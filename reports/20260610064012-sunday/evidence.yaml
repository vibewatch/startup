evidenceGaps:
  - type: missing-source
    severity: material
    topic: exact-founding-date
    missingEvidence: >-
      An incorporation filing, state registry extract, or founder statement that gives Sunday’s exact founding date
      rather than only the year 2024.
    whyItMatters: >-
      Founding date anchors pace-to-scale analysis and affects how exceptional the jump to a 2026 unicorn valuation
      really is.
    diligencePath: >-
      Obtain Delaware or California incorporation records, a verified cap-table history, or a founder interview with an
      exact formation date.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: beta-demand
    missingEvidence: A company-provided waitlist or beta-applicant count with timestamped methodology.
    whyItMatters: >-
      Current external demand signals vary between 1,000 people and “thousands,” which affects how much real consumer
      pull can be inferred from the public record.
    diligencePath: Request internal beta funnel metrics broken into applications, qualified households, and actual activated homes.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance-and-cap-table
    missingEvidence: A current board roster, cap table, voting rights summary, and any side-letter or information-rights schedule.
    whyItMatters: Public sources name a board addition but do not show who actually controls governance after the Series B.
    diligencePath: Obtain the latest financing documents, board consents, and investor-rights agreements under NDA.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: economics-and-customers
    missingEvidence: >-
      Revenue, pricing, customer conversion, retention, support cost, and deployment reliability data from real
      households.
    whyItMatters: >-
      The biggest remaining underwriting question is whether Sunday can turn compelling demos and capital formation into
      a viable home-robot business.
    diligencePath: >-
      Request beta-unit economics, churn or retention data, named reference households, and operational reliability
      dashboards from the first live deployments.
    relatedQuestionRefs:
      - QO015
      - QO018
      - QO024
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sunday-specific-sam-som
    missingEvidence: >-
      Consumer pricing, beta conversion, repeat usage, support burden, and task-frequency economics needed to isolate a
      Sunday-specific SAM or SOM.
    whyItMatters: >-
      Broad household-robot TAM figures do not reveal how much of the category is reachable by a premium multi-step home
      robot today.
    diligencePath: >-
      Request beta pricing, funnel metrics, household retention, hours saved by task, and any internal market-sizing
      bridge from U.S. household robot spend to Sunday's initial sellable wedge.
    relatedQuestionRefs:
