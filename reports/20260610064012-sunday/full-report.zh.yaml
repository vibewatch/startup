        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性应从已披露融资时间线向前看，而不是从融资头条热度向后推。Sunday 的启动融资是 2025 年 11 月的 $35 million，2026 年 3 月 Series B 又以 $1.15
              billion 估值加入 $165 million；因此 Tracxn 显示两轮合计 融资约 $200 million。对一家仍没有公开价格或收入披露的公司来说，这是可观资本，但不足以解决充足性问题。同一批
              2026 年 3 月材料把新资本用于真实世界部署、更快迭代，以及更大的工程、研究和数据运营团队。这些用途恰恰会加速
              烧钱。没有保留来源披露手头现金、月度烧钱、跑道月数、债务额度、契约限制、客户预付款或项目融资式义务。由于 Sunday 正从 demo 走向现场部署，下一次融资触发因素可能不再主要取决于 B 轮头条规模，而取决于
              2026-2027 年 beta 运营、 支持和制造在实践中有多贵。
