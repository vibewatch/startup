  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 数值 / 状态
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - 收入 / ARR
        - 'null'
        - 低
        - 没有标准收入数字，投资人无法检验规模、增长或资本效率。
        - 提供 2025-2026 年按来源拆分的月度收入，以及任何已签约但未确认的 beta 收入。
      - - 毛利率
        - 'null'
        - 低
        - 毛利率决定 Sunday 更像高端家电卖家、重服务运营商，还是介于两者之间。
        - 提供硬件 BOM、制造成本、支持成本和按队列拆分的毛利率。
      - - CAC / 回本周期 / 销售效率
        - 'null'
        - 低
        - 直接面向消费者的机器人业务，效率高低取决于付费获客、支持和转化，可能从好看到极差。
        - 披露付费获客支出、beta 转化漏斗、CAC、回本周期和留存。
      - - 需求代理指标
        - 至少 1,000 个 waitlist 名字；据报道有数千名 beta 申请者
        - 中
        - 说明消费者确有好奇心，但不能证明支付意愿或转化。
        - 分享申请者到合格家庭的漏斗、是否收取押金，以及付费转化假设。
      - - 成本基础代理指标
        - Engineering 3x、Research 4x、Data Ops 5x；据报道有 >70 名工程师和研究员；127 名员工
        - 中
        - 招聘和团队规模是公开可见、最清晰的运营费用强度指标。
        - 提供当前按职能拆分的员工数、平均全包成本，以及相对现金跑道的招聘计划。
      - - 服务交付负担
        - 50 个 beta 家庭加直接支持；正在招聘数据运营和评估运营
        - 中
        - 家庭部署在规模化前就可能增加现场支持、机队维护和异常处理成本。
        - 拆分每户家庭的上门支持分钟数、远程运营占比、更换成本和故障支持负担。
      - - 消费者可负担上限
        - 多数受访消费者支付意愿封顶在 $5,000 或以下
        - 中
        - Memo 经济性最终必须装进现实家庭预算，而不能只靠演示热度。
        - 提供目标 ASP 与融资假设，并与观察到的支付意愿队列对比。
      - - 公开家用机器人毛利率可比项
        - iRobot FY2024 GAAP 毛利率 20.9%
        - 中
        - 公开消费机器人可比项说明，即便规模化，硬件毛利也可能很薄。
        - 解释 Sunday 为什么能在结构上跑赢公开消费机器人毛利率。
    notes: 公开记录沉默处保留 Null。非 Null 行只是代理指标，不等于 Sunday 完整单位经济性披露。
