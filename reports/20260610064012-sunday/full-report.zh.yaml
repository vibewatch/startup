      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              这一品类的反向证据足够强，Sunday 的护城河不能只靠愿景承保。Figure 的家庭努力虽有惊人融资，但仍很早期。1X 之所以有吸引力，正因为它是少数明确 home-first
              的同业之一；但其公开记录仍显示云端依赖和持续的安全 / 操作工作， 而不是已经解决的部署经济性。Agility 和 Boston Dynamics 证明，许多资金最雄厚或名气最大的机器人团队目前仍偏好
              工业场景，这暗示家庭仍是最难的商业环境。最重要的是，Everyday Robots 说明，即便有 Alphabet 级人才、资本和内部 部署入口，只要可靠性、使命清晰度和客户经济性仍模糊，也不能保证形成商业业务。


              这给 Sunday 留下一个清楚但狭窄的护城河故事：如果真实家庭数据采集和训练确实优于有家庭野心的同业能获取的数据， Sunday
              可能建立可防守的学习曲线。但在通用家用人形机器人成为大众产品之前，品类也可能向下商品化为更窄助手、既有 家电生态或更便宜的单任务机器人。真正的尽调问题因此不是 Sunday
              有没有竞争——显然有——而是它能否在别处的资本、 渠道权力和信任优势压缩窗口前，证明持久的家庭表现优势。
