chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Sunday 是一家总部位于 Mountain View 的家用机器人初创公司，由 Tony Zhao 和 Cheng Chi 于 2024 年 创立。从官网、发布材料到第三方报道，公司始终把 Memo
              描述为一款有用的家用机器人，能够承担清桌、装洗碗机、 叠衣服、日常整理等重复性家务。公开记录也表明，Sunday 并不把自己定位为纯软件供应商。公司材料强调，它在软件、
              硬件、数据采集、训练和模型评估上掌握全栈；发布新闻稿则强调 Memo 采用轮式底盘和柔软硅胶包覆设计，而不是双足 人形形态。两者合在一起，更适合把 Sunday
              理解为一家垂直整合的机器人公司，目标是最终把机器人部署到家庭，而非 一个狭义 AI 工具初创公司。


              目前可见的核心商业模式是尚未商业化的部署，而不是成熟的经常性收入。Sunday 称 beta 部署将于 2026 年末启动， Founding Family Beta 覆盖 50
              个家庭；但已检索来源没有披露定价、收入或客户合同。运营论点转而落在数据积累： 公司称 Skill Capture Glove 及相关工具能把人类家庭行为规模化转成机器人训练数据。官方帖子称已出货超过 2,000
              只手套，训练数据来自超过 500 个家庭和约 1000 万次家庭场景片段，Memo 也从 2024 年 12 月的单臂摆鞋 系统推进到 2025 年 10
              月更复杂的家务。这些都是有意义的产品进展信号，但相比大规模部署的消费者硬件业务，仍处在 商业化曲线更早的位置。
