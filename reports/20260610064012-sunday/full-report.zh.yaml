      - number: '6.2'
        title: 采用轨迹与公开证明
        blocks:
          - type: paragraph
            body: >-
              公开证据里的采用轨迹是真实的，但仍处在商业化前。Sunday 的发布材料和多次转载都称，产品训练数据来自 500 多个家庭、约 1000
              万段家庭情境。这一点重要，因为它证明产品在部署前已接触真实家庭，但它仍是产品开发指标，不是客户指标。可见轨迹的下一步是 Founding Family Beta。Sunday 官方 beta
              页面和多篇发布报道显示，申请已于 2025 年 11 月开放，计划在 2026 年底部署到 50 个家庭，并提供直接支持。到 2026 年 3 月，Sunday 的 Series B
              信息已经从演示口径转向「真实世界部署」；第三方报道还补充了两个漏斗顶部需求信号：据报道约 1,000 人的 waitlist，以及「数千份」 beta
              申请。这些信号有价值，因为它们说明产品在出货前已吸引关注，但它们不能证明接受、激活、使用强度或复用。


              因此，具名客户证明是本章最弱的一环，而且弱点是实质性的，不是写法问题。保留的来源集中，没有发现任何具名付费家庭、公开生产用户或独立客户案例。最强的公开证明，是存在一个具体的首批队列，而不是任何家庭已经以生产深度使用
              Memo 的证据。也就是说，Sunday 的公开客户证明应被描述为由需求信号和 onboarding 准备支撑的前瞻性试点证明，而不是规模化采用。投资人不应把训练数据家庭、waitlist 规模和计划中的 50
              户队列当作同一种证据。三者分别支撑客户故事的不同部分，只有最后一项接近真实部署证明。
