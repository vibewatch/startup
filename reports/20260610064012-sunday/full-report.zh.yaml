      - number: '2.3'
        title: 买家、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Sunday 的公开 GTM 图景异常直接：家庭似乎同时就是买家、用户和付款方。不同于企业机器人或可报销医疗设备，当下
              公开记录中看不到保险、雇主、房东或政府预算所有者。因此近期销售更像高客单价消费耐用品或高端家电，而不是采购驱动 的系统。Sunday 的 Founding Family Beta
              让这一点尤其清楚：采用从志愿家庭开始，这些家庭愿意接纳早期机器人、 提供反馈并容忍迭代。最强的早期采用者很可能是富裕、技术前瞻型家庭：他们已经在家务上投入可观时间或金钱，重视智能 家居试验，也能承受硬件风险。


              在这个宽泛家庭买家内部，用户和价值故事因细分而异。双职工家庭和父母面对最清楚的时间压力论点，因为常规清洁、整理、 洗碗和洗衣会与工作和育儿时间竞争。BLS
              时间使用数据显示，家庭活动平均每天已经消耗约两小时；Altman Solon 调查 显示，最受期待的机器人工作是清洁、安全、做饭、洗衣和送物，而不是新奇功能。老年人和照护者家庭是相邻但尚未被证明
              的细分：人口顺风确实存在，Mordor 和 GMI 都预计 elder-care 或陪伴应用会增长，但 Sunday 尚未披露针对养老的 产品、报销渠道，或面向虚弱用户的安全案例。


              因此采用路径更可能是顺序推进，而非大众市场一拥而上。先靠 demo 和媒体建立认知，再用严格管理的 beta 证明居家
              可靠性，随后由独立评测和口碑降低信任摩擦；只有到那时，更广泛的消费者购买才变得可信。Altman 调查说明了为什么 这个顺序重要：兴趣很高，但熟悉度低，安全担忧显著，多数受访者不愿支付超过
              $5,000。Sunday 未来可能受益于 居家养老或订阅模式，但今天的公开证据支持的是一条消费者自费采用路径，由信任意愿、支付意愿和常规节省时间证明共同 约束。
