            title: 把 2026 年 3 月轮次当作价格发现，而不是估值证明
            body: Sunday 真实到值得继续推进，但缺失文件仍是最重要的那些：定价、转化、毛利、支持负担和融资条款。在这些出现前，当前估值下的正确动作是继续研究，而不是干净买入。
