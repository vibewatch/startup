        - 如果家庭拒绝支付足够价格，或节省时间的价值被证明过低，需求就无法货币化。
      - - 产品楔子
        - Sunday 拥有罕见的真实家庭数据和面向家庭的产品设计。
        - 如果 beta 使用仍依赖大量隐性人力或频繁介入，数据护城河的价值就会下降。
      - - 客户证明
        - 已具名的 50 户家庭 beta 和约 1,000 人等待名单显示规模化前已有兴趣。
        - 没有订金、付费转化或持久使用，这些信号仍只是漏斗顶端。
      - - 融资信号
        - $1.15B 轮说明可信投资人愿意为这个故事出钱。
        - 如果优先股条款很重，或下一轮融资早于商业证明到来，头部估值就会失去意义。
      - - 竞争背景
        - Sunday 资金远强于 1X 这类家用优先同行，也没有 Figure 那么过热。
        - 如果 Figure、Samsung 或其他 incumbents 更快解决家庭编排，Sunday 的中间档估值可能守不住。
      - - 品类风险
        - 反向逻辑主要在可负担性、可支持性和信任，而不是缺少想象力。
        - 公开定价、支持配比和安全治理，可能把判断从足价推向合理。
    notes: 反向逻辑由商业化证明和条款不透明驱动，而不是缺少真实家庭问题。
