    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调追问
    rows:
      - - 家务仍然消耗大量时间
        - 驱动因素
        - 立即
        - 支撑家务自动化的核心价值主张
        - Memo 在真实测试家庭中按任务每周净节省多少小时？
      - - 智能家居和 AI 集成趋势
        - 驱动因素
        - 近期
        - 提高消费者把机器人纳入家庭自动化的意愿
        - Memo 与其他家庭系统集成有多深，需要哪些隐私授权？
      - - 人口老龄化和辅助生活需求
        - 驱动因素
        - 中期
        - 把居家辅助的长期需求从清洁扩展到更多场景
        - Sunday 能否安全服务老年人，还是老年照护仍只是相邻市场？
      - - Sunday 的全栈数据飞轮
        - 驱动因素
        - 近期
        - 如果居家数据确实能复利，可能加快模型改进
        - 公司任务成功率提升中，数据量和硬件迭代各贡献多少？
      - - 消费者对实用家庭功能有兴趣
        - 驱动因素
        - 立即
        - 支撑围绕清洁、洗衣、做饭和安防的功能优先级
        - 哪些用户请求的任务在部署后能转化为重复使用和留存？
      - - 前期价格敏感度高
        - 约束
        - 立即
        - 在成本下降或融资改善前，采用可能被限制在高端家庭
        - Sunday 的实际硬件或订阅价格是多少，与 <$5k 的调查上限相比如何？
      - - 安全、信任和标准缺口
        - 约束
        - 立即至中期
        - 需要证明它能在家人、宠物和杂乱家庭环境中安全运行
        - Sunday 现在使用哪些测试方法、认证和事故响应流程？
      - - 隐私和远程操作顾虑
        - 约束
        - 立即
        - 居家视频、远程协助和数据收集可能劝退买家并引发监管关注
        - 远程人工干预使用频率多高，哪些数据会被存储或由人工查看？
      - - 用户更偏好专用机器人而非人形机器人
        - 约束
        - 近期
        - 宽口径多用途价值必须明显超过扫地机器人等更简单设备
        - Sunday 如何量化自身相对单一用途设备在可靠性和总成本上的优势？
      - - 对灵巧性和数据缺口的怀疑
        - 约束
        - 中期
        - 行业热度可能跑在杂乱家庭中实际泛化能力前面
        - 在 Sunday 控制的演示和测试叙事之外，有哪些任务成功率独立证据？
    notes: 时间相对于 2026-06-10 的 runDate。表格刻意同时纳入结构性市场力量和公司特有的商业化约束，因为两者都会塑造 Sunday 的真实采用曲线。
