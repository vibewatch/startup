      - number: '6.4'
        title: 扩张、集中度与采用摩擦
        blocks:
          - type: paragraph
            body: >-
              公开扩张模型容易描述，却难以承销。Sunday 自己给出的顺序是：先做宽泛的家庭定位，再收集 waitlist 和申请，然后管理一个高度受控的 50 户 beta，最后希望在反馈和数据改善产品后扩大
              rollout。对于一家早期家用机器人公司，这是一套合理的 land-and-expand 假设，但背后没有公开转化数学。公司没有披露多少申请会变成获批家庭、多少获批家庭会激活、多少家庭会重复使用
              Memo，也没有说明是否会有家庭转化为付费长期客户。集中度同样不透明：没有公开队列结构或收入结构，无法量化头部客户风险；但小规模早期队列仍可能主导学习和任何近期经济性。


              外部证据也说明，从好奇心跃迁到耐久采用会很难。UNSW 强调隐私风险、隐藏远程劳动，以及家庭并不是为通用机器人设计的事实。The Robot Report 引述 Ken Goldberg
              称，teleoperation 仍是持续的拐杖。Altman Solon 的调研显示品类兴趣存在——65%
              的受访美国消费者表达兴趣——但认知度低，安全和隐私担忧真实存在，价格承受度也远低于高端机器人硬件通常的起点。这些并非 Sunday 的公司特定失败，但确实意味着，Sunday 的客户扩张更可能受
              onboarding 质量、支持运营、信任和可负担性约束，而不是受初始媒体热度约束。简言之，Sunday 拥有一个可信的家庭 wedge
              和真实的发布前需求信号，但其公开客户故事仍停在投资人通常需要看到的耐久、可规模化采用证据之前。
