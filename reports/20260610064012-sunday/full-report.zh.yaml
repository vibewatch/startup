  - id: TR005
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - Beta 执行延误
        - Founding Family 部署时间
        - 50 户家庭 beta 明显晚于 2026 年底，或在直接支持准备不足的情况下启动
        - 这说明 Sunday 仍无法把 demo 和内部部署转化成面向客户的运营。
        - 视为一次重大去风险失败，并按比管理层说法更早期的公司重新承销。
      - - 安全 / 标准不成熟
        - 第三方安全证据
        - 部署前，管理层无法展示有意义的外部测试、认证路线图或清晰的内部安全论证
        - 标准仍不完整时，家庭信任只能押在公司叙事上。
        - 要求更低估值、里程碑融资，或暂停到安全证据产出后再推进。
      - - 隐私 / 数据治理缺口
        - 机器人专项隐私控制
        - 家庭机器人数据没有清晰的留存、删除、同意、供应商或事件响应框架
        - 缺少这些细节的联网机器人，会面对可避免的法律和声誉风险。
        - 实质上调法律风险，并把完整数据治理披露作为尽调条件。
      - - 隐性人力暴露
        - 远程介入或遥操作率
        - Memo 在家庭中保持运转需要持续且有意义的 human-in-the-loop 操作
        - 会同时削弱自主能力逻辑、抬高支持经济性。
        - 除非介入率被证明会快速下降，否则把 Sunday 重新归类为人力增强服务模型。
      - - 可负担性 / 单位经济错配
        - 价格到价值证明
        - Memo 全包价格和服务成本高于目标家庭愿意支付的水平，或高于公司能盈利支撑的水平
        - 单有消费者兴趣，造不出可行的机器人业务。
        - 除非 Sunday 能证明高端付费意愿和健康的家庭贡献利润率，否则大幅下调确信度。
      - - 资本效率压力
        - 现金需求轨迹
        - Sunday 在证明持久 beta 满意度、可支持性和可信商业化路径前就需要再次融资
        - 模型仍未验证时，这会放大融资风险。
        - 推进前要求披露现金跑道、里程碑式资金用途和下行情景条款。
    notes: 这些触发项有意设计成可监控指标，方便风险章节直接输入等待 / 推进 / 放弃决策。
