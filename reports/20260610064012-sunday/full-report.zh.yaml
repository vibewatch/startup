      - number: '8.4'
        title: 最终尽调要求与退出准备度
        blocks:
          - type: paragraph
            body: >-
              因此，退出准备度仍处早期。Sunday 已具备商业化推进前投资人想看的要素：新资本、具名首批队列、真实家庭数据，以及专门面向家务而非工厂 retrofit
              设计的产品架构。但公开记录仍停在能让委员会干净定价所需的文件之前。没有公开 beta
              合同，没有公开价格表，没有披露支持比例，没有单位经济性桥，也没有公开解释清算优先权或其他股权结构保护。即便安全和信任层也仍部分开放，因为品类标准框架还在追赶真实家庭自主性。


              因此，最终尽调要求并不泛泛。投资人需要商业包：Memo 价格、融资方案、如有定金则披露定金、beta 到付费转化预期、每户服务分钟数、故障和更换率，以及清晰的收入和毛利桥。还需要融资包：pro forma
              股权结构表、清算 stack、发行价格、治理权，以及此前轮次中的任何 ratchet 或下行保护。破坏投资逻辑的触发条件也相应简单：如果 2026 年底 beta 延期，如果 Memo
              全包价格在没有强有力融资支持的情况下高于消费者价值区间，如果家庭家务仍需要有意义的 human-in-the-loop operation，或如果条款 stack 意味着新资金排在比头部估值暗示更重的优先权
              overhang 之后，就应退出或实质性重定价。
