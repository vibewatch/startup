      - number: '3.2'
        title: 能力、定价姿态、GTM 与信任对比
        blocks:
          - type: paragraph
            body: >-
              这一组公司的能力宽度仍不均衡。Sunday、1X 和 Figure 都在宣传多步骤家庭操作，但公开就绪信号差异很大。Sunday 强调真实家庭自主性和专有训练数据。1X
              明确销售家务机器人概念，但其保留材料也承认高级推理依赖云端，并仍在努力让 双足操作在家庭内部变得安全。Figure 拥有最深的公开资本栈，并通过 Brookfield 获得异常大的住宅数据入口，但保留
              的独立报道仍把家庭测试描述为 alpha 阶段，而工业部署更接近近期落地。


              既有玩家和相邻方讲的是另一个故事。Samsung 的 Ballie 不是人形机器人，但已经对应家电控制、家庭陪伴式存在感和既有 智能家居行为。iRobot
              展示了当任务足够窄时，规模化家庭机器人长什么样：基于摄像头的建图、避障、用户控制功能，以及 围绕“在信任建立前不过度自动化”的隐私姿态。Agility 和 Boston Dynamics
              展示人形机器人先在哪里变现：仓库和工业 物料搬运，因为 ROI、安全边界和客户预算更清晰。定价本身也是竞争信号。本报告引用的通用家用机器人页面中，公开标价 仍未披露，说明包装和价格透明度仍落后于 demo
              的雄心。
