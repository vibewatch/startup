  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 假设
      - 估值逻辑
      - 示例公允价值
    rows:
      - - 乐观
        - 低
        - Beta 按时启动，Memo 定价在融资支持或明显高端价值下跨过家庭可负担门槛，支持负担下降，新增尽调显示融资条款温和。
        - 相比上一轮支付溢价，因为 Sunday 开始像少数能把数据优势转化成家庭付费使用的家用机器人公司。
        - $1.4B-$2.2B
      - - 基准
        - 中-高
        - 2026 年 3 月轮仍是最佳价格发现点，50 户家庭 beta 落地，商业化证明改善，但仍显得高接触、偏早期。
        - 估值贴近当前标记，因为融资支持真实存在，但公开经济性仍不完整。
        - $0.9B-$1.3B
      - - 悲观
        - 中
        - Beta 延误，Memo 定价超过家庭支付意愿，隐性人力持续存在，或优先股条款比头部估值暗示得更差。
        - 下调到上一轮以下，因为公司会从接近部署的故事退回昂贵机器人期权。
        - $0.4B-$0.8B
      - - 决策规则
        - —
        - 在定价、可支持性和条款透明度改善前，基准情景占主导。
        - 把当前标记当作参考点，而不是目标回报模型。
        - 当前标记 = $1.15B
    notes: 这些区间是围绕上一轮、品类可负担性证据和阶段匹配可比参照作出的情景判断，而不是靠虚构收入倍数推导。
