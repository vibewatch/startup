        - label: 首个具名 beta 队列
          value: 50 homes
          detail: 是有用的部署证明，但仍是高接触服务的起点。
          tone: neutral
        - label: 漏斗顶部需求信号
          value: ~1,000 waitlist
          detail: 证明有兴趣，不证明已付费转化。
          tone: neutral
        - label: 消费者可负担性上限
          value: 69% < $5k
          detail: 家庭机器人定价的主要约束。
          tone: risk
        - label: 可比成熟公司警示
          value: 20.9% GM at iRobot
          detail: 消费机器人即使规模化，利润率也可能很薄。
          tone: risk
        - label: 公开证据缺口
          value: Price / revenue / terms missing
          detail: 阻碍形成清晰投资建议的最重要因素。
          tone: risk
        - label: 目标回报支撑
          value: Not yet numeric
          detail: 以现有公开证据，今天还无法建立可信的回报模型。
          tone: risk
