      - number: '6.3'
        title: 耐久性与留存可见度
        blocks:
          - type: paragraph
            body: >-
              Sunday 的耐久性图景主要是证据缺口。公司已经发布面向客户的法律页面——隐私、条款和 cookies 页面； beta 页面也披露了配套
              app、语音排程和直接支持。这些都是部署前准备信号，但不是续约证明。保留来源未披露 Memo 定价、合同期限、取消权、保修条款、活跃家庭数、重复任务频率、支持响应时间、满意度评分、流失、NRR 或
              GRR。因此，最诚实的说法是：公开耐久性证据还不存在，因为首批家庭队列尚未被公开证明已规模化运行。


              家庭内数据处理也存在更具体的信任缺口。Sunday 的网站级隐私和条款页面说明，公司在 rollout 前已搭好法律基础设施；对于家庭机器人，这一点重要。但这些文件没有公开解释面向未来 beta
              家庭的机器人专属传感器留存、室内音频或视频处理、维护升级，或更换 SLA。这个缺口重要，因为在家用机器人里，信任和耐久性相互绑定：家庭可能愿意加入
              waitlist，但如果服务承诺和数据实践仍不透明，仍可能拒绝激活或续约。现阶段，正确的分析姿态应当保守。Sunday 披露的信息足以说明客户准备工作已经启动，但还不足以支撑长期留存或 beta 后转化质量。
