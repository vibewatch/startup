      - number: '4.4'
        title: 财务结论与承保阻碍
        blocks:
          - type: paragraph
            body: >-
              以当前公开记录看，Sunday 的财务故事高承诺、低可承保。收入质量无法判断，因为没有披露价格、没有付费设备销售证据、 没有客户集中度数据，也没有 beta
              或未来部署的流级收入确认政策。利润率路径同样开放：公司可能受益于专有数据闭环和 未来规模，但今天可见模型在证明持久消费者支付意愿之前，就背负沉重 R&D、制造、数据运营和支持义务。最强正面因素是
              资本可得性、申请兴趣和异常强的数据规模信号。最大阻碍仍是经济性：实现 ASP、硬件 BOM 和支持成本、按 cohort 的 毛利率、beta
              到付费转化、现金消耗、跑道，以及业务究竟会变成高端家电销售、服务很重的机器人产品，还是介于两者之间。 更广文献也支持谨慎：NBER
              发现机器人投资仍是设备支出中很小且集中的一部分，学术智能家居和家用机器人采用研究也不断 提出成本、隐私和安全担忧是采用刹车。在这些披露之前，Sunday 应被承保为一个资本密集型家用机器人实验：融资强劲，
              但收入质量未证实。
