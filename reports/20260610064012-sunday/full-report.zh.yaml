  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 商业条款
        - Memo 标价、融资方案、订金、如有 beta 费用，以及各队列上线时间。
        - 这是判断需求质量和消费者可负担性的基本分母。
        - 管理层定价材料加 beta 材料。
      - - 转化与使用
        - 申请漏斗、入选家庭标准、激活率、重复任务频率，以及 beta 后转化假设。
        - 等候名单规模不等于付费家庭需求。
        - 增长、产品和客户成功仪表盘。
      - - 单位经济性
        - 硬件 BOM、替换成本、支持分钟数、上门服务风险、毛利率，以及按队列划分的贡献利润率。
        - 家用机器人可以看起来很有吸引力，却仍然不赚钱。
        - 财务和运营审查。
      - - 股权结构表与优先权
        - 当前备考股权结构表、清算堆叠、发行价格、董事会权利，以及任何反稀释或 MFN 保护。
        - 表观估值可能与经济入场价值明显背离。
        - 法律顾问审查融资文件。
      - - 安全与信任控制
        - 安全测试、隐私架构、留存和删除规则、事故流程，以及保险覆盖。
        - 家庭机器人需要先拿出信任证据，再谈规模。
        - 产品、法务和外部保证审查。
      - - 规模路径
        - 从 50 户到 500 户及以上的里程碑，包括人员配比和支持自动化假设。
        - 真正的问题是 Sunday 会成为可规模化的家庭业务，还是礼宾式试点。
        - 运营计划和董事会里程碑。
    notes: 这些是把 Sunday 从可信故事变成可承销价格所需的最低尽调问题。
