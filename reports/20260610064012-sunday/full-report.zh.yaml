  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Sunday 容易让人喜欢，却难以定价。市场问题是真实的：BLS 称，80% 的人平均每天会做家庭活动，并花约两小时；Altman Solon 显示，65%
              的消费者对先进家用机器人有兴趣。产品证据也强于许多更早期的机器人初创。Sunday 称 Memo 已用来自 500 多个家庭的约 1000 万段家庭情境训练，公司也已经从抽象演示推进到一个具名的 2026 年底
              50 户 beta，并配有直接支持。但客户仍大多停在漏斗顶部。独立报道指向约 1,000 人 waitlist，而不是付费用户；保留来源没有披露标价、beta 费用、转化率、收入或毛利结构。


              正是这个分母缺口，让建议无法变成买入。公开记录支持一个真实消费者问题、一条差异化数据收集回路，以及足够继续在现场学习的资本。它还不能支撑更难的承销问题：Memo
              价格是多少、家庭是否真的愿意支付足够金额、产品需要多少支持，以及当前轮次是否嵌入了让头部估值产生误导的条款。竞争进一步强化谨慎。1X 是更接近的 home-first 同业，但披露的融资仍只是 $100
              million Series B；Figure 资金实力强得多，post-money 达 $39 billion，但在家庭场景仍只是 alpha-testing；Samsung
              可以用更简单的智能家居机器人争夺同一份家庭注意力预算；iRobot
              则说明，即便有品牌、渠道和多年部署，消费机器人经济性也会变得多么残酷。因此，基于公开证据的正确判断是：以中等信心、高风险和完整估值立场继续研究，而不是干净利落地 yes 或 no。
