  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与市场进入路径
        blocks:
          - type: paragraph
            body: >-
              Sunday 的公开客户故事比典型规模化消费者产品窄得多。公司始终把 Memo 定位给想获得重复家务帮助的忙碌家庭和家庭成员，
              任务包括洗碗、洗衣、整理和清桌。在本报告审阅的公开界面上，买家、用户和付款方似乎都收束为同一个家庭单位：Sunday
              没有披露雇主赞助、养老照护、酒店或企业动作，也没有按地理、收入或住宅类型细分家庭。这种狭窄并不天然负面，但意味着 今天可见市场证明集中在单一消费者楔子，而不是分散在多个买家原型上。


              更重要的区别，是几个容易被混同的家庭侧 cohort。Sunday 的训练数据家庭、Memory Developers、等候名单成员、beta 申请者，以及最终 Founding Family
              家庭，都靠近客户旅程，但并不是同一件事。500 多个家庭和约 1000 万次家庭场景 片段支撑数据护城河故事；它们不能证明 Memo 的付费使用。报道中的 1,000 人等候名单和数千份 beta
              申请显示早期兴趣， 但仍是漏斗顶部需求信号。最清楚的部署 cohort 是 2026 年末 Founding Family Beta，届时 50 个家庭应收到单独编号
              的机器人和直接支持。市场进入路径也显得高度集中。Sunday 公开材料强调直接 beta 申请、直接语音或 app 控制，以及 公司主导支持，而不是零售、经销商或伙伴主导分发；这带来短期聚焦，也把
              onboarding 和服务执行集中在 Sunday 内部。
