      - number: '4.2'
        title: 成本结构、利润率驱动与公开牵引缺口
        blocks:
          - type: paragraph
            body: >-
              即使在大规模商业化之前，Sunday 的成本结构也显得昂贵。公司称自己掌握硬件、软件、数据、训练、模型评估和制造的 全栈；2026 年 3
              月帖子称，为支持部署，工程团队扩大三倍、研究团队扩大四倍、数据运营增长五倍。招聘列表仍显示 Redwood City 和远程岗位覆盖 fleet software、data-operations
              tooling、memory development、data annotation 和 evaluation operations。这意味着至少有四个活跃成本桶：机器人
              R&D、硬件与制造、数据采集与标注、居家部署与支持。 公开牵引代理指标真实存在——数据集中超过 500 个家庭、约 1000 万次家庭场景片段、出货超过 2,000 只手套、计划 50 个 beta
              家庭、1,000 多等候名单或申请信号，以及 Tracxn 报告的 127 名员工——但这些代理都没有转化为已披露 收入、毛利率、CAC 或回本周期。iRobot 是最清楚的公开可比，说明这为什么重要：其
              FY2024 结果仅显示 20.9% GAAP 毛利率、$26.6 million 库存相关费用、为刺激 sell-through 而做促销，并在大幅裁员后启动战略评估。iRobot Q3 2025
              发布让警示更强：收入低于预期，现金降至 $24.8 million，库存仍有 $140.9 million，管理层称没有额外资本来源。 官方 Roomba 商店价格大致从 $250 到
              $1,400，并提供消费者融资，这凸显主流家用机器人价格架构仍多受约束。Sunday 未来可能跑出更好结果，但公开记录尚未显示风险更低的消费者机器人成本模型。
