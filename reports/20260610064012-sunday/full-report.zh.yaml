      - number: '7.3'
        title: 运营和依赖风险仍然偏高，因为 Sunday 的数据优势仍依赖劳动力、快速迭代和脆弱的首批服务模型
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Sunday 承诺的是机器人领域最难的事之一：机器人能自主进入新家庭，处理长周期家务，并以客户能感知的速度进步。官方材料清楚说明这需要多少基础设施。Sunday 称 Memo
              从数百个独特家庭、2,000 多副 gloves 和约 1000 万段家庭情境中学习。ACT-1 文章认为 teleoperation 是规模化死锁，并称 Sunday 用 Skill Transform 和
              90% 的 glove-to-robot 数据转换流程解决了其中一部分问题。这确实是缓解因素，也解释了为什么公司在招聘机器人 fleet management、语音交互、ML
              数据与评估、数据运营岗位，同时还描述工程、研究和数据运营团队的大规模扩张。


              但正是这套装置本身也构成风险。Sunday 自己的材料仍依赖一个配有直接支持、严格管理的 beta，这意味着服务负担还没有常规化。品类证据显示，隐藏人工劳动和支持强度仍真实存在。UNSW
              描述了品类中的远程接管和录制家庭互动，The Robot Report 称 teleoperation 仓库仍存在。Sunday 可能比这条基线更先进，但其自有文本仍承认数据瓶颈，以及需要发现 Memo
              在每个新家庭会遇到的独特问题。家庭不是工厂；它们多变、杂乱，充满非标准行为、宠物、儿童和易碎物品。NIST
              的机器人项目也强化了这一点：在不可预测环境中实现安全自主性之前，需要经过验证的数据集、测试方法和健康监测。依赖风险同样仍高，因为多个关键输入要么部分外部化，要么仍不透明：Sunday 称受益于公开数据集和 VLM
              进展，但没有公开说明制造栈、云架构或硬件供应商集中度。结果是，Sunday 可能在技术上领先同业，却在机器人离开演示循环、进入真实家庭后，被现场支持、数据运营劳动力或未披露供应商依赖困住。
