      - number: '1.4'
        title: 里程碑、证明点与反向背景
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示技术推进很快，叙事升温也同样快。Sunday 称其花了一年多搭建 Skill Capture Glove、Skill Transform、Memo 和 ACT-1
              基础模型背后的核心基础设施。研究帖子称 Skill Transform 能以 90% 成功率把手套数据 转成机器人等效数据，ACT-1
              可执行从餐桌到洗碗机的任务，并借助地图条件导航泛化到未见过的家庭。每个技术主张能否 经受独立基准测试仍不清楚，但从 2024 年原型进展，到 2025 年退出隐身，再到 2026 年独角兽融资，这条序列被压缩
              得很短。


              主要反向背景不是保留材料中的公司特定诉讼或执法行动，而是行业怀疑。Robot Report 引用 Ken Goldberg 的观点： 家庭管家时间表带有炒作，灵巧性和机器人数据缺口还要多年才能克服。IEEE
              Spectrum 又给出更市场化的警示：调查 参与者在家庭中通常更偏好专用机器人而非人形机器人，即便文章乐观情景也假设了安全、监管批准和保险条件，而这些 条件可能距离现实还有数十年。这些怀疑并不能证伪
              Sunday 的论点，但确实正确界定了核心尽调问题。Sunday 具备强 产品动能、蓝筹资本和独特的数据获取故事，但在客户采用、定价，以及大规模家庭部署所需运营可靠性上，仍缺公开证明。
