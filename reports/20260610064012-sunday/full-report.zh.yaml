  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览：Sunday 正试图在品类控制体系成熟前，把一个亲密的家庭产品工业化
        blocks:
          - type: paragraph
            body: >-
              Sunday 的公开材料在许多机器人初创最弱的地方反而最强：它有具体部署时间表、可见 beta 队列，以及清晰表述的数据策略。公司称 Memo 的 beta 将于 2026 年底启动，首个公开队列只有 50
              个家庭并配有直接支持，公司也已融资 $165
              million，专门用于从演示走向真实世界部署。这些是有意义的积极因素，因为它们说明公司理解，家庭机器人只有在真实家庭里能工作才有意义，而不是只在搭好的演示场景里好看。Sunday
              的数据故事也比典型发布前机器人公司更可信。公开材料指向来自 500 多个家庭的训练数据、约 1000 万段家庭情境，以及向 Memory Developers 发出的 2,000 多副
              gloves。这确实缓解了品类最大问题：缺少混乱的真实家庭数据。


              问题在于，Sunday 的公开承诺直接撞上三项外部现实校验。第一，家用机器人安全和标准体系仍明显不完整。IEEE Spectrum 2026 年 5 月报道称，家用机器人 ISO
              更新仍缺少可执行的测试方法，以及面向家庭自主性的治理机制；NIST 则强调，先进机器人必须先有严格验证、指标和协议，才能在预定环境中被信任。第二，隐私和责任义务扩张速度快于 Sunday
              公开法律细节。Sunday 有网站级法律页面，但外部法律和监管来源显示，AI
              驱动机器人可能触发生物识别、音频、地理位置和儿童数据问题；责任也可能尴尬地落在制造商、运营方和软件提供商之间。第三，品类经济性先例偏弱。Altman Solon 的调研显示消费者有好奇心但支付意愿低；iRobot
              近期的流动性、库存和 going-concern 问题则说明，消费机器人叙事能多快转成资本效率故事。换句话说，Sunday
              最高严重度的风险不是缺乏想象力，而是公司可能在周边经济性、安全框架和支持模型准备好规模化之前，就已经进入家庭。
            claimRefs:
              - CR001
              - CR005
              - CR011
              - CR014
              - CR015
              - CR037
              - CR039
              - CR043
              - CR049
              - CR053
              - CR054
      - number: '7.2'
        title: 法律、隐私和安全风险偏高，因为 Sunday 在公开合规细节成熟前，就要把联网机器人带进家庭
        blocks:
          - type: paragraph
            body: >-
              Sunday 已经有法律框架的开端，但还没有达到足以完成尽调的机器人专属披露水平。公开法律页面是真实存在的：隐私政策、服务条款和 cookies 政策均已上线，并自 2025 年 9 月 3 日起生效。隐私政策称
              Sunday 会收集信息以提供、维护和改进服务，并明确考虑从 newsletter 和 beta 注册中收集姓名、邮箱和电话信息。 beta 页面进一步显示，Memo 将通过直接语音互动和配套 Sunday
              app 安排任务。这些细节重要，因为它们证明产品不是一台简单离线家电，而是一个计划在亲密家庭环境中运行的联网系统，并通过必然触及用户信息和家庭日常的软件界面互动。


              公开记录仍未展示的内容同样重要。已审阅的 Sunday 材料没有公开列举 Memo 专属认证、保修、召回流程、泄露响应承诺或家庭传感器留存规则。这个缺口重要，因为外部法律背景正在收紧。FTC
              指引强调，公司必须兑现隐私承诺，并维持与所持数据相匹配的安全水平；COPPA 材料则显示，在家庭内部，围绕儿童、音频、视频和地理位置的问题会很快变成合规问题。Cyber Law Monitor
              对机器人更直接：视频、音频、地理位置和生物识别数据可能触发州隐私和生物识别法规、最小化义务、留存要求和监管通知义务。安全法同样不是缺席，而是不完整。ISO 13482 覆盖个人护理机器人，但 IEEE
              Spectrum 2026 年报道称，当前标准框架仍未把家用自主性知识转化为带有测试方法和治理机制、可执行的真实家庭互动规则。Hill Dickinson
              的责任分析又补上另一半问题：如果机器人伤人或处理敏感数据不当，制造商、运营方和软件栈之间可能争执责任归属。对 Sunday
              来说，结论很直接。法律风险不是部署后再解决的边角问题；任何想住进厨房、餐厅和有儿童家庭的机器人，都必须把它纳入产品市场匹配。
