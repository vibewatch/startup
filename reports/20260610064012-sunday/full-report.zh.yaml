      - number: '2.2'
        title: 市场规模视角、地理收窄与矛盾估计
        blocks:
          - type: paragraph
            body: >-
              自上而下的公开市场数据只有在品类边界明确时才有用。Mordor Intelligence 估计家用服务机器人市场 2025 年为 $14.62 billion，到 2031 年升至 $34.93
              billion，CAGR 为 15.62%；Global Market Insights 则估计更宽的 household robots 市场 2025 年为 $14.7 billion，并预计 2035 年达
              $85 billion，CAGR 为 19.2%。这些估计在 当年头条数字上接近，但分类和长期预测形态分化。Mordor 更明确指出，地面清洁和吸尘 / 拖地占据当下收入池主导； GMI
              强调的家庭框架更宽，仍以清洁为主，但也包括陪伴、安全、草坪和泳池应用。没有一个来源单独拆出 Sunday 真正 需要赢下的细分：超越单一清洁功能的高端多步骤家庭操作。


              更受约束的测算路径是地理范围。Mordor 称北美在 2025 年占家用服务机器人收入 38.3%，套用其 $14.62 billion 全球基数，意味着北美支出约 $5.6 billion。GMI 另行估计美国
              household robot 市场 2025 年为 $3.6 billion。 对 Sunday 来说，这些比全球消费者机器人数字更适合做近期锚点，因为 Sunday 的公开部署、训练家庭和 beta 信息都
              以美国为中心。相比之下，Future Market Insights 关于人形机器人的预测——2025 年 $7.8 billion、2036 年 $248.9 billion——最好视为相邻天花板，而不是
              Sunday TAM，因为它混合了医院、工厂、酒店、国防、教育、零售和 居住辅助。


              因此结论刻意保守。广义家用机器人 TAM 显然是数十亿美元级，北美和美国提供了更窄但仍有意义的支出池，家庭家务 也是确实存在的经济痛点。但公开数据无法可信拆出 Sunday 专属 SAM 或
              SOM，因为没有披露价格、没有公开转化漏斗、 没有独立验证的任务频次经济性，也没有公开证据证明消费者会以当前隐含的硬件价位购买通用家用机器人。矛盾本身就是
              重要尽调信号：慷慨的市场报告描绘了大品类，而真实采用证据仍像一个高端、受信任限制的楔子市场。
