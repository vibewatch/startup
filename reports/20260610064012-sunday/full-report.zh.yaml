  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Sunday 的相关市场不是“所有人形机器人”，甚至也不是所有家用自动化硬件。最接近且可辩护的边界，是在家庭内部运行、 用于家务、监测或陪伴的家用服务和个人护理机器人。Sunday
              自己的产品材料反复回到厨房、餐厅、洗衣空间和其他真实 居家环境中的家务辅助：清桌、装洗碗机、叠衣服、收鞋，以及类似移动操作任务。ISO 13482 对移动仆人和身体辅助
              机器人的框架，与这条边界方向一致，因为它明确覆盖改善生活质量、处理人类接触风险、并在人、家养动物和财产周围使用 的个人护理机器人。


              因此，纳入支出从清洁及相关家务的家用机器人开始，再延伸到相邻的居家辅助品类；这些品类的买家重视便利、劳动替代
              或居家养老支持。它排除工业机器人、医疗设备、军用机器人、玩具，以及那些把医疗、酒店、制造、教育、国防和住宅用例 混在一个数字里的宽泛人形机器人预测。更宽预测可作为相邻背景，但会高估 Sunday
              当前有证据支撑的机会。实际现状也 比竞争机器人供应商更宽：家庭已经靠无偿劳动、雇佣服务和扫地机器人等专用设备完成这项工作。这很关键，因为 IEEE
              调查证据显示，出于安全、隐私和舒适感，用户仍偏好专用家用机器人而非人形机器人；所以 Sunday 不只要击败其他初创 公司，还要击败根深蒂固的非机器人习惯和更简单设备。
