      - number: '5.2'
        title: 运营架构与技术差异化
        blocks:
          - type: paragraph
            body: >-
              公开运营模式围绕数据采集和迭代速度展开。Sunday 称自己掌握软件、硬件、数据、训练、模型评估、硬件设计和制造全栈；
              其最详细技术帖子认为，家庭机器人真正瓶颈不只是硬件或算力，而是缺少互联网规模的操作数据。Sunday 的答案是一串相连 资产：Skill Capture Glove 记录人类家庭行为，Skill
              Transform 把手套观测转成机器人等效数据，ACT-1 作为学习到的 策略栈，再加上 fleet-plus-data-operations 闭环把新数据推回系统。公司称手套和 Memo
              的手共享相同几何与传感器布局， Skill Transform 转换成功率达 90%。公司还声称 ACT-1 能执行长时程餐桌到洗碗机行为，利用 3D 地图在未见过的家庭中 导航，并处理叠袜子和准备
              espresso 等高灵巧任务。Sunday 的差异化故事不仅靠已披露生产架构图，也由创始人脉络增强。 公司页面、Tony Zhao 个人资料和公开 ALOHA / Diffusion Policy
              材料把创始人与低成本遥操作、动作分块、基于扩散的 策略学习和大规模灵巧数据采集等开放机器人工作相连。这条脉络不能证明 Memo 复用了那些确切代码库，但说明 Sunday
              正从机器人社区已经读得懂的研究传统出发建设。
