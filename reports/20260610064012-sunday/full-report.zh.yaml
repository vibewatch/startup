  - id: TV005
    title: 投资逻辑破裂与止损触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Beta 执行滑坡
        - 50 户家庭 beta 明显晚于 2026 年底，或上线时缺少可信的直接支持准备。
        - 说明公司仍比估值叙事所暗示的阶段更早。
        - 将案例重切到悲观区间，或暂停。
      - - 可负担性错配
        - Memo 全包价格落在消费者价值区间之上，且没有融资方案或异常强的节省证明。
        - 家庭兴趣和付费需求之间的桥会断掉。
        - 要求更低入场价格，或放弃。
      - - 隐性人工劳动
        - 家务要跑通，仍需要大量人类在环操作。
        - 同时削弱自主性和利润率假设。
        - 按服务属性更重的模型承销 Sunday，或退出。
      - - 优先权悬置
        - 既往或本轮融资文件显示清算优先权、反稀释条款或治理权扭曲了表观估值。
        - 名义估值会成为经济入场价值的劣质代理。
        - 要求结构化条款，或重定价。
      - - 安全 / 信任缺口
        - 部署前，管理层无法拿出可信的安全测试、隐私和事故治理材料。
        - 家庭产品转化会放慢，责任风险会上升。
        - 上调风险评级，并把任何投资都绑定到控制措施上。
      - - 消费机器人经济性接近 iRobot
        - 利润率、支持成本或库存动态开始接近承压消费硬件经济性。
        - 战略故事会变成资本效率问题。
        - 将案例移向估值区间下端。
    notes: 这些是估值止损触发因素：每一项都可能直接推翻当前价格，而不只是让故事没那么好听。
