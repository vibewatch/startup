  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有玩家、相邻路径与替代品
        blocks:
          - type: paragraph
            body: >-
              Sunday 面对的不是一个干净的同业集合。保留证据中，最接近的直接 home-first 对手是 1X 和 Figure，因为两者也把 通用人形系统营销给家庭任务，而不是单一清洁或仓库工作。Samsung
              Ballie 和 iRobot 的重要性在另一处：它们说明 家庭可能更偏好更窄、更可控、与既有智能家居或地面护理习惯绑定的助手，而不是完整人形机器人。Agility、Boston Dynamics、Tailos
              和 LG 仍重要，但主要作为相邻路径，证明机器人公司今天在哪里变现：仓库、工业物料搬运、酒店 清洁和商业服务机器人，而不是混乱的消费者家庭。


              这种分类关系到 Sunday 的真实竞争问题。一个家庭在决定是否信任家用机器人时，仍可以维持无偿劳动、外部清洁服务、 Roomba 级产品或智能家居套装，同时等待通用机器人成熟。换句话说，Sunday
              并不面对当前对手的赢家通吃锁定。它面对 的是宽替代集合，以及一个可能进入者集合，里面有渠道更强、资产负债表更大或信任基础更稳的公司。因此，格局应被框定
              为直接同业、窄型既有玩家、工业相邻方和现状，而不是单一人形机器人排行榜。
