  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 单位 / 定价基础
      - 当前价值 / 状态
      - 收入质量
      - 尽调要求
    rows:
      - - Founding Family Beta 部署
        - 早期采用家庭会在 2026 年末 beta 期间收到单独编号的机器人和直接支持。
        - 单户 beta 费用或补贴未披露
        - 计划 50 户；申请已开放；价格未披露
        - 低 —— 试点经济性可能由补贴、推广或非经常性因素支撑
        - 提供 beta 合同、任何收费条款、补贴结构和收入确认政策
      - - 未来 Memo 机器人直销
        - Memo 可能会通过 Sunday 自有渠道直接卖给家庭。
        - 机器人 ASP、融资或租赁条款未公开
        - 产品营销已上线，但未披露公开销售启动条款
        - 若存在实际 sell-through 则为中；但大概率是一次性硬件收入
        - 披露标价、融资选项、实际 ASP、退货和附加率
      - - 支持、软件和技能更新
        - 持续帮助、模型改进、技能发布和家庭支持可能与机器人打包。
        - 订阅费或服务费未公开
        - beta 材料和产品信息里能看到支持；变现方式未披露
        - 若可拆分则为中；否则就是打包收入并稀释利润率
        - 拆分服务与软件定价、留存和附加率
      - - 数据采集生态
        - Memory Developers 和 Skill Capture Gloves 提升产品性能与训练速度。
        - 未披露外部客户定价
        - 仅是战略投入；没有第三方数据收入证据
        - 作为独立收入证据为低
        - 说明是否存在任何开发者、合作伙伴或数据授权变现
      - - 当前已确认收入 / ARR
        - 公开披露门槛
        - 'null'
        - 留存来源未发现公开收入、ARR 或付费客户数字
        - Unknown
        - 按来源提供月度收入历史、付费客户数、积压订单或预约转化
    notes: 该表把部署活动和实际变现拆开。Null 表示留存公开记录不支持披露运行日数字。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Covers every materially visible monetization path in the retained public record, including explicit null
        disclosure where no public revenue stream is yet quantified.
