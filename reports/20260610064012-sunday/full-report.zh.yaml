      - number: '1.3'
        title: 融资基础、利益相关方与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              Sunday 的资本形成速度异常快。公司于 2025 年 11 月 19 日带着与 Benchmark 和 Conviction 相关的 $35 million 启动融资走出隐身状态，随后在 2026 年 3 月
              12 日宣布完成超额认购的 $165 million Series B， 估值 $1.15 billion。官方和独立来源一致将 Coatue 标为 Series B 领投方，并将 Bain Capital
              Ventures、 Fidelity Management & Research Company、Tiger Global、Benchmark、Conviction 和 Xtal Ventures 列为
              参与方。Tracxn 的画像暗示两轮已披露融资约 $200 million，与 $35 million 启动轮和 $165 million Series B 在算术上吻合。


              公开规模信号方向积极，但仍不完整。Tracxn 在 2026 年 3 月下旬报告员工 127 人，TechFundingNews 则称公司有 70 多名工程师和研究员。Sunday 自己的 Series B
              帖子称，随着公司转向部署，工程团队扩大三倍、研究团队扩大四倍、 数据运营增长五倍。招聘页显示 Redwood City 和远程岗位仍在招软件与数据运营人才，说明其 Bay Area 足迹可能比 Mountain
              View 新闻稿措辞更宽。与此同时，公开记录没有披露收入、ARR、客户数、债务额度、二级出售或具名商业客户。 因此融资故事很强，但经济画像仍大多私有。
