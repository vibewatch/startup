  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限性
    rows:
      - - Sunday（标的）
        - 2026 年 3 月私募轮
        - $165M Series B 对应 $1.15B 估值；已披露累计融资约 $200M
        - 公司自身唯一硬公开价格发现。
        - 该估值背后没有公开价格、收入、毛利率或优先股条款。
      - - iRobot
        - 上市消费机器人 incumbents
        - FY2024 收入 $681.8M；GAAP 毛利率 20.9%；到 2025 年进入战略评估 / 持续经营压力
        - 最好的公开参照，说明即便有品牌和规模，家用机器人经济性也可以非常苛刻。
        - 产品范围比 Sunday 窄，反映的是地板清洁 incumbent，而不是通用家用机器人。
      - - 1X
        - 私营家用 android 同行
        - $100M Series B；不到 12 个月融资超过 $125M；NEO 定位于家务和家庭帮助
        - 留存集合中最接近的、已披露融资的家用优先类人机器人参照。
        - 未披露估值、付费需求证明或成熟消费者部署数据。
      - - Figure
        - 私营类人机器人平台龙头
        - 已承诺 >$1B Series C，投后 $39B
        - 高端资本和品类热度参照。
        - 体量和资金基础使其更像热度与平台离群值，而不是 Sunday 的干净定价可比对象。
      - - Apptronik
        - 私营类人机器人融资 / 工业部署
        - $520M，估值 $5B；Apollo 已与 Mercedes-Benz 和 GXO 测试
        - 人形机器人公司一旦拿出工业部署势头，投资人胃口会提速，这一点很清楚。
        - 工业优先的姿态让它更像资本市场参照，而不是家庭需求可比公司。
      - - Unitree
        - 低成本人形机器人定价信号
        - G1 标价 US $13.5K；H1 定位为通用人形机器人
        - 这个参照提醒我们，未来人形机器人价格压力可能既来自高端美国创业公司，也来自更便宜的硬件新进入者。
        - 公开标价不等于已交付的家庭能力、安全性或支持经济性。
      - - Figure + Brookfield
        - 里程碑 / 部署参照
        - 管理 100,000+ 套住宅单元，另有大型商业地产，可供数据和部署使用
        - 人形机器人公司有大伙伴时，规模化数据和部署入口可能长什么样，这一组合给了样本。
        - 合作规模不能直接转化为对 Sunday 估值的支撑。
      - - Samsung Ballie
        - 既有智能家居替代方案
        - 未披露融资估值；大型家电生态用另一条路径进入同一家庭预算
        - 适合作为提醒：家庭机器人也可能被更简单、生态驱动的形态切入。
        - Ballie 不是直接的通用操作机器人。
      - - Amazon / iRobot
        - 并购参照
        - 收购在 2024 年终止；随后 iRobot 裁员 31%
        - 即便是品类龙头，战略可选性也可能快速丧失，这一点值得记住。
        - 监管和交易本身的因素让它只是宽松参照，不是直接估值可比。
    notes: 这一组覆盖本章估值逻辑所用的全部参照：一个直接价格参照、一个上市消费机器人既有公司、两个私人人形机器人参照、一个智能家居替代方案，以及一个并购警示信号。
