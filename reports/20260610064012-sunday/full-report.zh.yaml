  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与家庭工作流
        blocks:
          - type: paragraph
            body: >-
              Sunday 公开销售的是一个家庭工作流故事，而不是抽象机器人平台。从官网、发布报道到 beta 材料，Memo 被描述为面向 忙碌家庭的家用机器人，承担清餐桌、刮食物残渣、装洗碗机、叠袜子、摆鞋，甚至拉一杯
              espresso shot 等重复家务。 公司称 Memo 应能在不同家庭中开箱自主工作，并明确把价值主张定义为把时间还给家庭，而不是销售窄型工业机械臂。这一
              定位很重要，因为它用客户语言定义产品：买家是家庭，job-to-be-done 是减轻家务劳动，服务承诺是居家任务执行，而 不只是实验室表现。可见商业路径仍受控。Sunday 的 Founding Family
              Beta 是主要部署面，计划 50 个家庭收到单独编号 的机器人和直接支持。Beta 材料还称 Memo 的大脑会持续更新，参与家庭可以为更广训练闭环提出新技能。因此，公开来源
              支持一条具体初始工作流——家务、试点部署、支持和反馈——但尚未披露公开消费者结账流程、定价或已发布的可靠性 SLA。
