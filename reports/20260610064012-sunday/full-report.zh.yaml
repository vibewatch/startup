  - id: TP004
    title: 护城河持久性 / 竞争风险登记表
    columns:
      - 护城河主张或风险
      - 威胁
      - 严重性
      - 证据
      - 缓释 / 尽调追问
    rows:
      - - Sunday 真实家庭数据循环变得持久
        - Figure 和 1X 也在建设家庭数据引擎，同时 Figure 还获得 Brookfield 住宅访问
        - 高
        - 家庭数据差异化有可能成立，但公开层面尚未证明更优
        - 要求提供真实家庭中的并排任务成功率、学习曲线和留存数据
      - - 家庭人形机器人能够定价到大众采用
        - 保留的通用型家庭页面中，公开标价仍普遍未披露
        - 高
        - 包装可见度落后于能力营销
        - 在为采用率背书前，拿到价格、融资、安装和支持条款
      - - 用户会信任机器人在家中自主行动
        - iRobot 的经验显示用户仍想保留控制，家庭感知更丰富时隐私担忧会上升
        - 高
        - 即便对更窄的既有厂商，信任和隐私仍是采用门槛
        - 要求提供隐私架构、覆盖控制，以及事故或失败率报告
      - - 工业优先的头部公司会继续留在家庭市场之外
        - Agility 和 Boston 可能在硬件与经济性改善后下探市场
        - 中
        - 它们当前重心在工业场景，但技术底座可以迁移
        - 跟踪路线图表态、合作伙伴关系和组件成本下降
      - - 既有生态无法压缩 Sunday 的窗口期
        - Samsung 和 iRobot 已经掌握更强渠道、装机基础或消费者注意力
        - 高
        - 分销权力集中在早期家用机器人创业公司之外
        - 评估 Sunday 时看自有性能，不要假设渠道中立
      - - 通用助手机器人会自然商业化
        - Everyday Robots 即便有 Alphabet 支持和内部部署入口，仍然关停
        - 高
        - 即使演示跑通，可靠性、任务清晰度和单位经济性也可能失效
        - 在假设规模化前，要求运营指标、支持负担和窄用例证明
    notes: 严重性标签是基于留存公开证据作出的分析判断。该登记表有意保持选择性，聚焦后果最重的竞争风险。
