      - number: '8.3'
        title: 乐观 / 基准 / 悲观逻辑与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              情景表应被理解为按里程碑加权的估值判断，而不是虚假的精确性。乐观情景下，Sunday 按时完成 50 户 beta，披露家庭可以直接承受或通过可信融资吸收的定价，并证明支持负载和隐藏人工劳动会随着 fleet
              成熟而下降。在那个世界里，当前轮次开始像是一次早期去风险入场，而不是峰值估值。基准情景下，2026 年 3 月轮次仍是唯一硬性的价格发现点，beta 如期发生但仍像一个高接触验证场，投资人获得足够证据来
              defend 当前估值，但还不足以证明大幅溢价合理。悲观情景下，可负担性问题继续悬而未决，beta 延期或需要过多 concierge 支持，投资人发现条款或单位经济性让头部估值更像宣传而非保护。


              反向来源重要，因为它们比上行更清楚地定义下行触发因素。Altman Solon 称，近 70% 的消费者不会为家用机器人支付超过 $5,000，25% 的消费者无论价格多少都不会购买。IEEE 和 UNSW
              显示，在许多情境下消费者仍偏好专用机器人，并担心安全、隐私和隐藏远程劳动。The Robot Report 让 teleoperation 问题变得具体；IEEE
              的安全标准报道则称，家用机器人治理仍缺少可执行测试和规则制定。这些信号不意味着 Sunday 会失败；它们意味着，任何高于当前估值的价格，都需要证明 Sunday 能解决品类级约束，而不只是继承品类热情。
