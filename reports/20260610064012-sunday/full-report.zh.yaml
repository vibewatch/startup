      - number: '7.4'
        title: 财务模型风险大多仍未关闭，因为消费者兴趣尚不等于耐久的家用机器人业务
        blocks:
          - type: paragraph
            body: >-
              Sunday 的公开需求故事令人鼓舞，但仍是漏斗顶部。公司据报道有 1,000 人 waitlist、数千份 beta
              申请，在一个大多数成年人平均每天都会做家务的国家里，价值主张也非常直观。这些信号重要，因为它们说明 Sunday
              想解决的问题是真实的。但它们还没有回答硬件加服务业务最关键的承销问题：价格、转化、毛利率、服务负载、更换成本、保修准备金，以及每个部署家庭的现金消耗。保留来源中没有发现公开 Memo
              价格、单位经济性或毛利桥。这一缺口严重，因为 Altman Solon 的调研显示，该品类可能面临陡峭的消费者可负担性天花板：兴趣很高，但多数消费者不愿支付超过 $5,000，安全担忧也普遍存在。


              本文件中最好的公开品类可比对象是 iRobot，不是因为产品相同，而是因为它展示了消费机器人在需求、毛利率和库存失衡后有多不宽容。iRobot 近期 filings 和发布材料显示，这家公司面临
              going-concern 压力、贷款人豁免、低毛利、库存积压、战略评估、Amazon 交易失败后的大幅裁员，以及随后现金减少且已无剩余资本来源。Sunday
              更早期，资本也更新鲜，因此不应机械类比。即便如此，它仍是正确的警示信号。消费机器人可以一直显得战略上令人兴奋，直到获客成本、支持负担或硬件经济性迫使融资重置。Sunday
              真正可见的缓解因素，是小规模首批队列、直接支持、家庭数据护城河，以及足够在公开环境中学习的资本。击杀标准也同样清晰。如果 50 户 beta 延期，如果隐私和安全治理继续模糊，如果 Memo
              的价格价值等式落在家庭愿意支付的范围之上，或如果部署需要隐藏人工劳动或不可规模化的支持比例，无论演示多有吸引力，投资逻辑都应大幅下调。
