      - number: '1.2'
        title: 领导层、治理与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露仍很窄，且高度围绕创始人。Tony Zhao 是可见的联合创始人兼 CEO，Cheng Chi 是联合创始人兼 CTO。Zhao 的个人网站把他直接关联到 Stanford 的 ALOHA 和
              ACT，并描述其曾在 Google DeepMind、Tesla Autopilot 和 Google X Intrinsic 工作，这解释了外部投资人为何不断强调他的研究履历。Cheng Chi 是
              Diffusion Policy 论文作者，又被标注为 Sunday 的 CTO，进一步说明公司的技术叙事建立在两位创始人近期且可识别 的机器人学习资历之上。


              治理能见度远低于融资头条。保留来源中，最清楚的公开董事会披露是 Thomas Laffont 因 Coatue 领投 2026 年 3 月 Series B 而加入董事会。除此之外，Sunday
              未在已检索材料中发布完整董事名单、股权拆分或更广治理结构。这意味着 公开公司画像仍暴露于关键人物依赖：Zhao 和 Chi 不只是高管，也是研究可信度、产品愿景和投资人信心的主要证明。
              这种不对称很重要，因为后期资本已经到位，但高级运营人才、董事会监督或 GTM 领导层的公开披露包并未同步变得详细。 后续尽调应把创始人集中度和治理不透明视为真实承保问题，而不是表面缺漏。
