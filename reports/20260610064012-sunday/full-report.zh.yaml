  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价姿态与直接 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              公开证据支持消费者家用机器人收入模式，但尚未支持已披露的变现时间表。Sunday 直接面向忙碌家庭营销 Memo，官网和 beta
              材料要求家庭申请访问，而不是把需求导向企业买家、保险方或渠道伙伴。最强商业化证据是 Founding Family Beta： 申请于 2025 年 11 月开放，50
              个家庭将收到单独编号的机器人和直接支持；2026 年 3 月材料称公开部署从 beta 开始， 独立报道则称兴趣已达到至少四位数等候名单，且申请者可能有数千人。这是有用的需求信号，不是收入证明。Sunday 仍未
              披露 Memo 标价、beta 费用、订阅条款、融资计划，或 beta 设备的会计处理。定价缺口很重要，因为品类调查证据显示 多数消费者不愿为家用机器人支付超过 $5,000；因此 Sunday 最终实现的
              ASP 必须跨过有意义的可负担门槛，需求才会 转化为高质量收入。
