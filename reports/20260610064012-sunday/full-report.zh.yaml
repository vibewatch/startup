  - id: TI002
    title: 定价 / 变现表
    columns:
      - 产品 / 信号
      - 公开价格或单位
      - 来源类型
      - 解读
      - 仍未知的事项
    rows:
      - - Memo 标价
        - 'null'
        - 官方产品页和发布页
        - Sunday 尚未公开发布 Memo 标价。
        - 实际 ASP、折扣、硬件融资条款以及税费或安装费仍未披露。
      - - Founding Family Beta 商业条款
        - 'null'
        - 官方 beta 和发布材料
        - beta 已公开，但未披露费用、押金或租赁结构。
        - 家庭是否付费、获得补贴，或依据测试协议参与仍未知。
      - - 购买模式还是订阅
        - 37% 的消费者偏好一次性购买；24% 偏好订阅（品类调查）
        - Altman Solon 调查
        - 从品类视角看，家庭可能把家用机器人当作大型耐用品购买，而不是企业软件。
        - Sunday 尚未披露 Memo 会一次性出售、融资、租赁，还是与服务打包。
      - - 家用机器人的可负担上限
        - 69% 不愿支付超过 $5,000；25% 在任何价格下都不愿支付
        - Altman Solon 调查
        - 消费者支付意愿看起来远低于当前高端人形机器人的预期。
        - Sunday 尚未披露目标 ASP，也未说明能否靠融资或低成本形态弥合差距。
      - - 消费机器人可比价格带
        - 中端机器人 $300-$499 MSRP；高端机器人 $500+ MSRP
        - iRobot FY2024 业绩
        - 当下公开消费机器人价格仍远低于通用家用机器人的潜在成本结构。
        - 该可比项不能直接推导 Sunday 定价、毛利率或功能对等性。
    notes: 这里的公开价格点是品类或可比信号，不是 Memo 标价。Sunday 未披露可信商业条款时，Null 值保持不变。
    enumerationScope:
      coverage: partial
      basis: >-
        Focuses on the pricing signals most relevant to Sunday underwriting: Memo disclosure gaps, consumer willingness
        to pay, and a public consumer-robot comp band.
