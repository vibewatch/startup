      - number: '3.3'
        title: 切换成本、多归属、分发权力与数据或伙伴入口
        blocks:
          - type: paragraph
            body: >-
              近期消费者切换成本低于第一眼所见。家庭可以试用新机器人而不放弃现状，因为既有栈是模块化的：人力劳动、清洁工、
              智能音箱、扫地机器人、洗碗机和家庭日常流程都能共存。这让多归属比硬替代更可能发生。因此真正约束不是旧数据锁定，
              而是一台机器人是否足够可信、可负担、可支持，并且可靠有用到足以成为家庭正常操作系统的一部分。iRobot 自身转向
              用户控制的战略变化很有启发：即便是一个窄型既有玩家，也学到如果用户感觉失控，更多自主性并不自动更好。


              因而分发和伙伴入口至少和原始机器人能力同样重要。Figure 与 Brookfield 的关系扩大了住宅数据采集和商业化杠杆。 Samsung 可通过家电、SmartThings 和消费电子渠道进入。iRobot
              已在一个重要家庭任务中拥有持久信任和装机基础。 如果家庭经济性有一天足够有吸引力，足以推动下沉，Agility 和 Boston Dynamics 拥有集成和工业客户优势。Sunday
              最可信的优势是比多数玩家更早为家庭优化；但只有当其学习闭环在更大渠道和资金更强的对手汇聚到相同工作流前变得明显 更好，这一优势才会复利。
