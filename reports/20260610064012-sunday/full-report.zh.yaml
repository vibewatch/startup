      - number: '8.2'
        title: 融资背景、条款不透明与可比边界
        blocks:
          - type: paragraph
            body: >-
              融资故事在标题层面清晰，底层却不透明。Sunday 官方披露 2026 年 3 月 Series B 融资 $165 million，估值 $1.15 billion；TechCrunch、Yahoo
              Finance 和 Tracxn 均佐证了这一估值。Tracxn 还称两轮合计披露融资约 $200
              million，这意味着投资人在公开变现证明出现前，已经支付独角兽价格。这个价格仍可能合理，但公开文件还没有说明为什么。保留来源没有披露 Memo 标价、付费客户数、收入、毛利率、净 burn
              或清算优先权结构。也就是说，外部人无法判断本轮反映的是耐久运营证明、激进 sponsor optionality，还是两者兼有。


              可比背景与其说填补了缺口，不如说给缺口划了边界。1X 证明，一个严肃的家庭 android 同业在讲家务和家庭辅助故事时，仍可能处于 $100 million 融资阶段；这让 Sunday
              看起来是在投资人出价意愿上更靠前，而不一定是在已证明经济性上更靠前。Figure 位于另一端：post-money $39 billion，再加上 Brookfield 合作，可触达 100,000
              多个住宅单元和大型商业空间。这证明资本愿意进入该品类，但也让 Sunday 的 $1.15 billion 估值像是介于资本轻型 aspirant 和巨额融资平台押注之间的中间地带。公开 incumbent
              iRobot 是最清醒的参照。其 FY2024 业绩显示收入 $681.8 million，但 GAAP 毛利率只有 20.9%、库存相关费用 $26.6
              million，随后出现战略评估、going-concern 警告，以及 2025 年 Q3 关于没有额外资本来源的声明。换句话说，Sunday
              当前价格没有被品类证伪，但公开证据也尚未证明该估值便宜，甚至没有证明它安全合理。
