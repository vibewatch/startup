      - number: '2.4'
        title: 增长驱动、采用约束与保留的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Sunday 所在品类的结构性增长逻辑真实存在。家庭仍把大量时间花在家务上，智能家居预期在上升，主要公开市场报告 也把品类增长归因于便利性、AI/IoT 集成、家务劳动力短缺和人口老龄化。Sunday
              自己的差异化论点也对应真实市场需求： 家用机器人在杂乱、多变环境中无法泛化时就会失败；如果一家公司能采集更好的居家操作数据，就可能获得性能优势。 如果 Sunday 关于 500 个家庭和 1000
              万次场景片段的数据主张在运营上站得住，公司就能攻打单一用途清洁机器人 难以解决的那部分市场。


              但约束至少同样重要。安全和标准尚未解决。ISO 13482 为个人护理机器人提供基线框架，但 IEEE 的标准报道认为，当前 家用人形机器人标准仍缺面向真实家庭自主性的强制合规标准、测试方法和执行机制。NIST
              同样把采用条件定义为严格验证、 安全人机协作，以及在非结构化环境中可测量的灵巧性、感知和移动表现。需求侧，Altman 展示了鲜明的支付能力和信任 缺口，IEEE 显示用户仍偏好专用机器人而非人形机器人，The
              Robot Report 和 UNSW 也保留了更深层怀疑：灵巧性、隐私、 遥操作依赖和“数据缺口”问题，可能让真正有用的家用人形机器人还要多年才能到来。


              尽调中应保留这些矛盾，而不是把它们平均掉。公开来源支持一个数十亿美元级品类和可信的长期社会需求，但尚不足以支持 关于大众市场时点、Sunday 最终
              ASP、续约经济性、事故率，或消费者长期愿意让通用机器人在家人身边自主运行的判断。 残留尽调缺口因此是商业和运营问题，不只是数字问题：价格、转化、独立任务成功指标、故障模式、支持负担，以及一个家庭 在从
              Roomba 式工具升级到能力强得多、也亲密得多的机器人之前，到底需要多少信任。
