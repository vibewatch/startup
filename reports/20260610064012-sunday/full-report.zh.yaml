      - number: '5.3'
        title: 部署、信任与剩余产品风险
        blocks:
          - type: paragraph
            body: >-
              部署证据在改善，但公开信任证据仍落后于家用机器人的雄心。Sunday 2026 年 3 月帖子称，公司已从 demo-first 叙事 转向真实世界部署；招聘页用机器人 fleet management、ML
              数据与评估、语音交互、memory development、标注和 eval ops 等可见岗位支持了这一转变。这说明运营模式现在包括现场支持和质量闭环，而不只是模型训练。与此同时，公开信任面仍
              很窄。Sunday 有一份网站隐私政策，覆盖 beta 或 newsletter 收集、沟通、设备 / 网络信息和网站活动数据，但已访问材料
              没有解释机器人传感器留存、居家视频处理或车队数据治理。外部标准也不会自动替 Sunday 补上缺口。ISO 13482 覆盖个人 护理机器人，NIST 强调测试方法和经验证的表现指标，IEEE 2026
              年报道则认为家用机器人标准仍缺少真实家庭中关系性安全 的强制测试方法和执行机制。外部怀疑同样相关：Ken Goldberg 关于灵巧性和机器人数据缺口会拖慢家庭管家时间表的批评， 直接指向 Sunday
              的承保挑战。结果是一款看起来技术差异化、运营严肃的产品，但在现场可靠性、供应商细节和安全验证上 仍披露不足。
