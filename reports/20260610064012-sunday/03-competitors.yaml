- id: moat-durability-and-adverse-evidence
  title: Moat Durability, Commoditization Risk, and Adverse Evidence
  body: 'The adverse evidence in this category is strong enough that Sunday’s moat cannot be underwritten on aspiration alone. Figure’s home effort is still early despite extraordinary financing. 1X remains compelling precisely because it is one of the few explicit home-first peers, but its public record still shows cloud dependence and active safety/manipulation work rather than solved deployment economics. Agility and Boston Dynamics confirm that many of the best-funded or best-known humanoid teams currently prefer industrial settings, which implies that the home is still the hardest commercial environment. Most importantly, Everyday Robots demonstrates that even Alphabet-level talent, capital, and internal deployment access do not guarantee a commercial business if reliability, mission clarity, and customer economics remain fuzzy.


    That leaves Sunday with a clear but narrow moat story: if real-home data collection and training are genuinely better than what home-ambitious peers can gather, Sunday may build a defensible learning curve. But the category can also commoditize downward into narrower assistants, incumbent appliance ecosystems, or cheaper single-task robots long before a general-purpose home humanoid becomes a mass-market product. The real diligence question is therefore not whether Sunday has competition—it clearly does—but whether it can prove a durable home-performance edge before capital, channel power, and trust advantages elsewhere compress the window.'
