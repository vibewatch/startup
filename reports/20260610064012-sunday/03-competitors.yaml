- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or risk
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Sunday real-home data loop becomes durable
    - Figure and 1X are also building home data engines, while Figure adds Brookfield residential access
    - High
    - Home-data differentiation is plausible but not yet publicly proven superior
    - Request side-by-side task success, learning-curve, and retention data from real homes
  - - Home humanoids can price for mass adoption
    - Public list pricing is still undisclosed across the retained general-purpose home pages
    - High
    - Packaging visibility lags capability marketing
    - Obtain price, financing, installation, and support terms before underwriting adoption
  - - Users will trust a robot to act independently at home
    - iRobot learned users still want control, and privacy concerns rise with richer home sensing
    - High
    - Trust and privacy remain adoption gates even for narrower incumbents
    - Request privacy architecture, override controls, and incident or failure-rate reporting
  - - Industrial-first leaders will stay out of the home
    - Agility and Boston could move downmarket once hardware and economics improve
    - Medium
    - Their current focus is industrial, but the technical base is transferable
    - Track roadmap statements, partnerships, and component-cost declines
  - - Incumbent ecosystems cannot compress Sunday's window
    - Samsung and iRobot already own stronger channels, installed bases, or consumer attention
    - High
    - Distribution power is concentrated away from early home-robot startups
    - Underwrite Sunday on proprietary performance, not on assumed channel neutrality
  - - General-purpose helper robots will naturally commercialize
    - Everyday Robots shut down despite Alphabet backing and internal deployment access
    - High
    - Reliability, mission clarity, and unit economics can fail even when demos work
    - Demand operating metrics, support burden, and narrow use-case proof before assuming scale
  notes: Severity labels are analytical judgments grounded in retained public evidence. The register is intentionally selective and focuses on the highest-consequence competitive risks.
