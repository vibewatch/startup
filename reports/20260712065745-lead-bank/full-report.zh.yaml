      - number: '2.3'
        title: 增长驱动、采用路径和估值相关性
        blocks:
          - type: paragraph
            body: >-
              三股力量支撑品类增长。第一，金融科技和软件平台仍希望在不自建或收购银行的情况下获得受监管能力。第二，嵌入式金融分销把支付、信贷、卡和账户放进非银行工作流，扩大了需要受监管基础设施的项目数量。第三，现代 API
              交付相较定制化银行连接，可以降低集成摩擦。Lead 的定位与这些力量一致，因为它把发起银行责任与 API 交付的 Lend、Move、Issue 和 Store
              产品结合起来。投资含义不是所有嵌入式金融交易量都会变成 Lead 收入；捕获能力取决于项目赢单、定价、信用配置和留存。Lead 于 2025 年 9 月以 $1.47 billion 投后估值完成 $70
              million B
              轮，说明投资人给这一定位赋予了相当价值，但这不能证明市场份额。一个有用的采用模型应把品类扩张和公司捕获分开：需求可以增长，但经济性仍可能集中在少数大型项目；若定价压缩或客户多银行化，交易增长也可能跑赢基础设施收入。
