      - number: '8.3'
        title: 牛市、基准与熊市估值情景
        blocks:
          - type: paragraph
            body: >-
              用当前收入做敏感性分析，可以看清入场经济性的非对称性，同时不假装预测未披露未来收入。对 $108 million 套用 8x，得到 $864 million 的熊市参照，较 $1.47 billion 估值低约
              41%。11x 的基准参照约为 $1.188 billion，仍低于本轮融资估值。15x 的牛市参照约为 $1.62 billion，在考虑稀释、时间价值或优先权影响前，也只比当前估值高约
              10%。这些是估值参照点，不是目标价格，因为它们保持收入不变，只隔离倍数风险。牛市情形需要持续增长、合作伙伴经济性分散、信用表现干净，并证明牌照加 API
              模型值得享受非上市金融科技公司倍数上沿。基准情形假设公司不错，但向非上市区间中部正常化。熊市情形不需要失败或资不抵债；非上市市场常规压缩到 Mercury
              的估值水平就足够。清算优先权和二级交易条款缺失，进一步削弱可观察的普通股回报计算。
