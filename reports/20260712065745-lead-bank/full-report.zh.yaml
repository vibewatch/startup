            body: >-
              具名关系比单纯展示标识的营销更有力，因为审阅公告识别了具体银行角色。Affirm 使用 Lead 作为 BNPL 贷款发放的银行合作伙伴；Ramp 相关材料指出，Lead
              提供银行基础设施和稳定币支持公司卡的结算支持。Visa 和 Bridge 材料把 Lead 放在带有链上结算的稳定币挂钩发卡平台中；Branch 指定 Lead 为劳动力支付的发起银行和发卡方。Revolut
              另行确认，自 2024 年 11 月起 Lead
              是其美国银行和发卡合作伙伴。这些是生产级项目描述，而不是披露的试点，尽管公开来源没有给出合同起始到续约历史、交易量或收入贡献。证据质量有差异：客户和合作伙伴发布的公告直接且具名，多篇独立文章也印证了项目描述。因此，最强结论是
              Lead 已经在大型金融科技品牌中赢得可信的受监管基础设施角色，而不是每个关系都同样大、排他、盈利或耐久。
