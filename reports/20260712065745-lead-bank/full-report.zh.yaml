      - number: '5.4'
        title: 成熟度、可靠性、安全和实施尽调
        blocks:
          - type: paragraph
            body: >-
              证据支持 Lead 拥有一个能运行、且文档相对完整的集成平台，但还不能证明它具备完全透明的企业级可靠性画像。Lead 发布了专门的 API
              概览，并描述了欺诈、认证、白名单控制、实体筛查和公平信贷考虑。DashDevs 的从业者讨论也说明，生产级金融科技集成需要数据映射、供应商协调、测试、监控和合规工作；API
              优先标签并不会移除这些负担。三个缺口很关键。第一，审阅的公开记录没有量化正常运行时间、服务抵扣、恢复目标或事故历史。第二，它没有建立完整的独立安全认证清单，也没有提供渗透测试证据。第三，它没有发布吞吐、延迟、峰值量或账本规模基准。这些缺失不说明控制薄弱，但限制了外部对成熟度的评估。潜在合作伙伴应在上线前运行沙盒和故障模式测试，审查对账与幂等行为，取得架构和数据流图，检查安全与灾备证据，并谈妥按通道划分的支持和事故承诺。
