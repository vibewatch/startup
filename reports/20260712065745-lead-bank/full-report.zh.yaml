      - number: '3.3'
        title: 分销、切换成本和监管信任
        blocks:
          - type: paragraph
            body: >-
              选择发起银行会形成有意义的切换成本，因为迁移可能触及账户结构、客户披露、合规控制、账本、支付路径、卡和信贷工作流。这些成本能支撑留存，但无法阻止多归属：成熟金融科技公司可能把不同产品或项目分配给多家银行，以分散集中度和监管风险。不同竞争者类型的分销能力也不同。Cross
              River 和成熟银行可以直接销售受监管基础设施准入；Stripe 可以通过既有软件和支付关系导入财资能力；中间件提供商可以影响底层银行获得哪个项目；Marqeta
              则能在不持有发起银行牌照的情况下控制有价值的处理商层。Lead
              的具名合作证明了进入能力，但公开材料没有披露排他性、续约期限、钱包份额或迁移义务。监管信任同样是双刃剑。持有牌照可以减少一个中间环节、让责任更清晰，但也会集中监管责任。Blue Ridge 在 OCC
              命令后退出，说明 BSA/AML 和第三方监督缺陷可以淘汰一个竞争者，同时抬高所有剩余发起银行的尽调门槛。
