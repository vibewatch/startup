      - number: '2.2'
        title: 嵌入式金融背景和细分结构
        blocks:
          - type: paragraph
            body: >-
              嵌入式金融是更大的分销背景，并不是可以直接互换的 TAM。Bain 预计，美国嵌入式金融交易价值到 2026 年将达到约 $7 trillion，远高于 BaaS
              供应商市场估计，因为交易价值衡量的是流经嵌入式产品的金融活动，而不是基础设施提供商捕获的收入。BaaS
              只是这条价值链中的一个赋能层。商业细分覆盖信贷、支付、卡和存款；买方通常是金融科技产品或平台负责人，使用者包括财资、运营和工程团队，付款方或预算所有者往往在财务、产品或运营部门。即便合规、风险和法务团队不拥有预算，也保留实质否决权。采用路径通常从用例设计和发起银行选择开始，经过尽调、集成、控制测试，再进入规模化上线。Lead
              Bank 所在的是发起银行 / API 层，而不是消费者界面。其公开平台宽度支持其覆盖多个细分市场，但公开证据没有披露按细分品类拆分的收入，也没有给出可辩护的 Lead 专属全球市场份额。
