      - number: '8.4'
        title: 退出准备度、否决触发条件与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              Lead
              具备可信的融资通道和有意义的运营规模，但按已审阅证据看，还不能公开证明其具备退出准备度。投资者仍需要经审计报表、从已报告净收入和调整后利润到监管指标的桥接、合作伙伴层面贡献利润率、信用损失分摊，以及按收入和存款划分的集中度。股权结构表也要同等重视：优先清算条款、反稀释保护、董事会权利、二级交易和完全稀释后股权表，决定
              $1.47 billion
              的名义估值能否转化为普通股价值。尽调应围绕三个投资假设破裂触发条件。第一，头部合作伙伴流失或放贷项目经济性显著恶化，会同时削弱增长质量和溢价倍数。第二，不利监管发现或强制整改，可能放慢准入并推高合规成本。第三，如果证据显示非经常性、低毛利或信用敏感收入主导
              $108 million
              基数，简单收入倍数就失效。可信退出路径需要分散的经常性收入、可复制的合规运营、独立验证的利润质量，以及足够的治理透明度，让后期或公开市场投资者能够接受。在这些条件形成文档前，合理到偏高才是有纪律的结论。
