      - number: '7.5'
        title: 缓释因素、监测指标与投资假设破裂条件
        blocks:
          - type: paragraph
            body: >-
              合适的姿态是有条件推进，而不是一刀切。Lead
              拥有长期牌照、已报告规模、经验丰富的领导层和新近获得的成长资本，这些都能支持合规和运营韧性投入。但这些优势不能替代项目证据。尽调包应包含监管往来、董事会风险报告、BSA/AML
              和制裁测试、合作伙伴批准档案、每日对账指标、未解决异常、投诉和欺诈趋势、信贷批次、按收入和存款划分的集中度、损失分摊条款，以及继任材料。可监测的恶化包括正式执法行动、重复重大审计发现、对账异常账龄超过政策、损失恶化并超出约定触发条件，或头部合作伙伴迁移且没有替代经济性。银行无法证明控制所有权、放贷损失或准备金推翻约
              68% 收入引擎、合作伙伴失败暴露客户资金缺口，或领导层连续性不可信时，投资假设就会破裂。在 $1.47 billion 估值下，未解决尾部风险应压低可接受入场价和信心。
