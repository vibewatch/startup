  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资假设与反假设
        blocks:
          - type: paragraph
            body: >-
              按 2025 年 9 月入场估值看，Lead Bank 更适合给出继续研究建议，而不是直接否决。投资假设是：稀缺的监管牌照、API 驱动的合作银行模式、约 48%
              的净收入增长，以及可识别的金融科技关系，可以支撑其相对公开支付处理商的溢价。反假设在价格和收入质量：$1.47 billion 投后估值约为 2025 年 $108 million 净收入的
              13.6x，而合作伙伴放贷项目贡献约 68% 收入。集中度让该倍数对合作伙伴迁移、信贷结果和监管审视都很敏感。约 8–15x 收入的宽口径非上市公司基准，让该估值有辩护空间；但 Mercury 约 8x 的估值和
              Marqeta 约 1.6–3x 的公开 EV/revenue
              区间，也显示其中嵌入了多少乐观。合适的估值结论因此是合理到偏高，而不是有吸引力。置信度为中，因为融资和收入规模事实有充分交叉印证，但经审计收入质量、客户层集中度和证券条款仍未公开。
