      - number: '1.3'
        title: BaaS 运营模式和合作生态
        blocks:
          - type: paragraph
            body: >-
              Lead 销售的是面向金融科技和企业平台的受监管银行基础设施，而不只是经营传统网点银行。其公开产品架构把能力分为 Lend、Move、Issue 和 Store，并通过带有 OAuth2 控制的
              REST/JSON API 交付。落到实操上，金融科技公司接入 Lead 的 API 层；Lead 再把项目连接到存款、支付、卡网络或信贷通道，同时保留受监管银行的责任。具名合作关系展示了模式宽度：Affirm
              在贷款发放中使用 Lead，Ramp 使用 Lead 的银行基础设施和稳定币卡结算，Stripe 和 Visa 选择 Lead 参与稳定币挂钩发卡平台，Branch 增加 Lead 支持劳动力支付，Revolut
              则使用 Lead
              做美国银行业务和发卡。这种多样性有战略价值，因为一个受监管资产负债表和合规栈可以支撑多种用例。它也会抬高运营复杂度，并制造相互牵连的交易对手、合规和信用敞口。公开展示的客户标识能证明市场进入，但没有披露合同经济性、按合作伙伴拆分的集中度、损失分担条款，或每个项目的服务成本。
