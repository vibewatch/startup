      - number: '3.2'
        title: 规模、能力和定位
        blocks:
          - type: paragraph
            body: >-
              披露出来的规模对比并不均衡，但有参考价值。Lead 报告 2025 年净收入 $108 million，高于 2024 年的 $73 million，约 48% 同比增长。Column 据报道 2025 年收入约
