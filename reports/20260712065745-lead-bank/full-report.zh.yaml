      - number: '7.4'
        title: 运营、合规与关键人物执行
        blocks:
          - type: paragraph
            body: >-
              Lead 的 Lend、Move、Issue 和 Store 模型覆盖面很宽，交易、账本、欺诈、制裁、BSA/AML、争议和供应商控制面都必须持续跑通。API
              优先交付可以标准化控制，但合作伙伴快速增长也可能跑在人员配置、模型验证、质量保证和董事会报告前面。准入和持续监控面临同样的扩张压力：每个项目都有不同的客户旅程、数据流、禁用场景风险、投诉模式和退出要求。领导力集中进一步加重执行负担。Jackie
              Reses 同时担任 CEO、董事长、联合创始人，并持有约 40%
              股权；完整公开继任计划和授权控制图并不可得。她的经验能缓释风险，但角色和所有权集中会拖慢质询、增加继任复杂度，并放大声誉外溢。投资者应检查合规人手、独立测试、问题账龄、审计升级、运营韧性演练、管理层继任，以及控制职能是否有权叫停合作伙伴上线。
