      - number: '3.4'
        title: 差异化耐久度和失单场景
        blocks:
          - type: paragraph
            body: >-
              Lead 的可防守位置建立在银行牌照、API 交付、资产负债表容量，以及横跨信贷、支付、发卡和存款的宽度组合之上。这个组合有用，但每个组件都面临替代。Column
              提供垂直整合的平台银行主张，且报告增长快得多。Cross River 具备更大的披露收入规模和广泛 API 产品。Bancorp 和 Green Dot 提供成熟的受监管基础设施。Stripe
              能把财资能力打包进更广泛的开发者和支付关系。Synctera、Unit 和 Treasury Prime 可以抽象底层银行，限制发起银行对客户界面的拥有权；Marqeta 则争夺处理商经济性。Lead 约 68%
              收入暴露在合作伙伴信贷项目中，也削弱了其四大产品支柱所暗示的分散度。因此，护城河取决于风险执行、合作伙伴结果、合规质量和持久准入，而不只是 API。客户若想要一个覆盖多产品的现代受监管交易对手，Lead
              可能赢单；当买方优先考虑更大规模、中立中间件层、既有分销、更低集中度，或愿意支持 Lead 拒绝风险画像的提供商时，Lead 可能失单。需要私有赢输单、定价和服务水平数据来检验这一结论。
