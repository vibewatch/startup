  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和客户工作流
        blocks:
          - type: paragraph
            body: >-
              Lead Bank 的产品最适合被理解为：通过 Lend、Move、Issue 和 Store 四个支柱，向金融科技和嵌入式金融团队交付受监管银行基础设施。客户设计金融体验，接入 Lead 的 API
              接口层，再用银行层发放信贷、划转资金、发行卡片或持有资金。这个客户工作流视角很重要，因为 Lead 不是只在卖软件访问权。它把软件集成与受监管执行、账户记录、合规流程和外部网络连接结合在一起。Lend
              对应信贷和信用项目；Move 对应 ACH、电汇和即时支付工作流；Issue 对应卡项目；Store
              对应账户和存款用例。这种宽度可以降低需要多种银行基础能力的客户的供应商碎片化，但也会扩大实施、对账和合规范围。因此，买方应分别评估每个支柱，而不是把宽平台标签当成每条通道在成熟度、经济性或服务质量上都相同的证明。
