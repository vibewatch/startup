      - number: '5.2'
        title: API、账本、接入和合规架构
        blocks:
          - type: paragraph
            body: >-
              公开技术边界比较具体。Lead 记录了 REST 风格 API、JSON 载荷、OAuth2 认证和 IP 白名单控制。独立的 Accounts、Applications 和 Lending
              文档显示，它采用按领域组织的 API 设计，而不是一组无差别端点。Applications 尤其重要，因为文档把 KYC、KYB 和 OFAC 筛查放在 Entity 层，并讨论 Regulation B
              公平信贷实践。这意味着，对集成方而言，接入和合规是工作流问题，不是不可见的后台功能。运营模型可以读作一个序列：金融科技公司完成认证，提交账户或申请指令，Lead
              应用银行和合规控制，核心银行记录或账本更新，外部通道执行被请求的资金划转、发卡或信贷动作。公开文档证明了主体架构，但没有披露每个端点、内部账本实现、延迟预算、故障切换设计或对账容忍度。这些细节应进入技术尽调，而不是从营销文案中推断。
