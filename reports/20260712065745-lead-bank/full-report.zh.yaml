            body: >-
              客户质量的核心张力，是强品牌验证与不透明经济集中度并存。合作伙伴信贷项目占 Lead Bank 收入约三分之二、即约 68%，因此即便可见客户名单横跨多种用例，客户和产品集中度也可能直接传导到收入。Lead 报告
              2025 年净收入 $108 million，但所给公开证据没有按客户、项目、产品支柱、地域或合同分配这一金额。因此，少数大型金融科技公司可能驱动大量贷款发放、存款、交换费和手续费收入。Sacra
              的负面比较进一步强化了这一担忧：相较更偏软件的基础设施模式，Lead
              更暴露于合作伙伴信贷经济性。通过稳定币卡、劳动力支付和国际金融科技关系扩张，未来或许能分散经济性，但宣布触达不等于收入已经多元化。承销应在给客户基础赋予耐久价值前，要求头部客户集中度表、项目贡献利润率、信用和损失分担条款、合同续约日期，以及流失历史。
