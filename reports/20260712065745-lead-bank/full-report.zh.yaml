      - number: '7.3'
        title: 客户、信用与依赖集中度
        blocks:
          - type: paragraph
            body: >-
              Lead 最强的增长引擎，也把下行风险集中起来。公开报道显示，合作伙伴放贷项目贡献约三分之二、即约 68%
              的收入，因此承保表现、资金条款、合作伙伴行为和损失分摊，直接决定盈利质量。已披露生态更偏向几个大型金融科技关系，而合作伙伴层面的收入、存款、发放额、逾期、核销、准备金和合同终止权仍未公开。Affirm Card
              借记卡发卡在 2025 年迁至 Stride
              Bank，是一个具体提醒：即使其他银行合作活动继续，一个可见关系也可能按产品迁移。因此，集中度要按项目和经济敞口衡量，而不是数客户标识。放贷下行可能同时带来发放量下降、信用损失上升、准备金收紧、合作伙伴争议和监管担忧。反过来，一个主要合作伙伴迁移，也可能同时冲击手续费收入、存款和战略验证。公开分群和损失数据缺失，让这些风险无法量化，而不是风险低。
