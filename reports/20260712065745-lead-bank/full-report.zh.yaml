  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分、买方、用户和付款方
        blocks:
          - type: paragraph
            body: >-
              Lead Bank
              主要服务需要把受监管银行能力嵌入自有客户体验的金融科技平台。买方通常是金融科技高管、财资或支付负责人、卡项目负责人，或信贷项目负责人；终端用户是金融科技客户、持卡人、借款人、企业或劳动者；金融科技合作伙伴一般通过项目经济性向
              Lead 付费，而不是通过可见的零售订阅。公开案例覆盖 Affirm 的消费信贷、Ramp 的企业银行和卡、Stripe 与 Bridge 搭配 Visa 的全球稳定币挂钩卡、Branch 的零工劳动力支付，以及
              Revolut
              的美国银行和发卡。这是相对集中的机构客户模式：每个集成都可能带来有意义的存款、交易量、卡活动或贷款发放。用例宽度降低了对单一产品能力面的依赖，但具名客户名单不长，加上定制化受监管集成，意味着每个大关系仍可能产生不成比例的影响。公开证据对细分和工作流识别的支撑强于客户数量、收入区间或账户地域。
