          - type: paragraph
            body: >-
              Synapse 说明，中间件失效、记录不完整和账本责任争议，如何演变成系统性的合作银行事件。它在 2024 年 4 月倒下后，约 $265 million 客户资金被冻结，估计 $65–95 million
              下落不明，约 100,000 名客户受影响。Evolve Bank & Trust 和 Lineage Bank 随后因与该事件相关的资金缺口被起诉；这些诉状只是指控，并非裁判认定。CFPB 在 2025 年 8
              月提起行动，约 $46 million 在 2025 年 12 月分配给受害者。Synapse 给 Lead
              的教训，不是二者架构相同，而是对账断裂和责任不清，会把合作伙伴失败推成消费者损害、诉讼、监管介入、流动性压力和声誉损失。因此控制要端到端检查：权威记录系统归属、每日对账、异常账龄、FBO
              账户结构、客户沟通、合作伙伴退出计划，以及金融科技公司失败后银行继续服务用户的能力。
