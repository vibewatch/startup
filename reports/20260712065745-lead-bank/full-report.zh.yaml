      - number: '6.4'
        title: 耐久性、留存和切换风险
        blocks:
          - type: paragraph
            body: >-
              发起银行关系可能形成运营黏性，因为更换受监管机构可能需要处理卡、账户、合规、结算和客户沟通工作。但公开证据也显示，角色可以迁移。2025 年 4 月，Affirm 和 Stride Bank 宣布 Stride
              将成为 Affirm Card 借记项目的发卡合作伙伴。这一变化不能证明 Lead 失去了 Affirm 单独的 BNPL
              贷款发放角色，两个角色不应混为一谈。它确实证明，在一个大型金融科技关系内部，项目级切换和竞争性银行选择会发生。所给证据中没有发现公开
              NRR、GRR、流失、续约率、合同期限、满意度评分或队列数据。因此，具名生产级项目支持采用质量，但不能证明合同耐久度。投资人需要续约日历、终止权、实施历史和项目级经济性，来区分深度嵌入的多产品关系与可替换的单项目授权。Affirm
              案例应被视为具体警示：醒目的客户标识并不意味着拥有其所有银行产品的排他权。
