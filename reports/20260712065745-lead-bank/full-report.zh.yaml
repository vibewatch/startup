    million 收购后，将其重塑为 API 优先的银行即服务发起银行。公司向金融科技企业销售可编程核心银行、资金划转、发卡和信贷能力；2025 年报告净收入 $108 million，调整后收益约 $31 million，并于
    2025 年 9 月以 $1.47 billion 估值完成 $70 million B 轮融资。
