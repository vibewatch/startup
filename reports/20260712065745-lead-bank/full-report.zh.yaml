  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律先例
        blocks:
          - type: paragraph
            body: >-
              Lead Bank 所处的风险类别里，持牌银行仍要为金融科技合作伙伴交付的活动负责。FDIC 和 OCC
              对第三方监督的要求，把治理、BSA/AML、客户资金控制、投诉处理和项目监测都放在银行核心责任里，而不是可外包事项。最清晰的警示案例是 Blue Ridge Bank：OCC 2024 年 1 月下达同意令，涉及
              BSA/AML、第三方和 BaaS 监督、不安全或不稳健经营，以及资本充足性。该命令在 2025 年 11 月终止，但 Blue Ridge 已退出
              BaaS；也就是说，整改可以保住机构，却毁掉原本的平台战略。这是行业背景，不是 Lead Bank 违规证据。Lead
              的投资问题在于政策、人员、测试、董事会报告和退出权，是否跟上合作伙伴复杂度。公开材料无法证明该行当前检查结论或项目级控制有效性，因此监管状态和整改准备度必须直接确认。
