      - number: '8.2'
        title: 融资背景、方法与可比集合
        blocks:
          - type: paragraph
            body: >-
              最干净的起点是当前投后价值除以已报告净收入，而不是资产或存款。Lead 是受监管银行，但融资叙事由科技化收费和放贷项目经济性驱动；只看资产负债表倍数，会遮蔽该运营模式。用 $1.47 billion 除以
              $108 million，得到约 13.6x。同一估值约为已报告 $31 million 调整后利润的 47.4x，尽管调整后利润不能等同于监管净收入或经审计 GAAP
              利润。可比证据横跨并不完美的类别。Mercury 2026 年 5 月在约 $650 million 收入上获得 $5.2 billion 估值，隐含约 8x。Cross River 2022 年约 $3
              billion 估值和约 $517 million 收入，提供了较旧的合作银行参照，但没有同步倍数。Column 报告 2025 年收入约 $153 million，但没有外部股权市场估值。Marqeta
              公开市场约 1.6–3x 的 EV/revenue 区间，提供的是流动性处理商底部，而不是直接银行可比。非上市 BaaS 和新银行约 8–15x 的观察值，给出最宽松的相关区间。
