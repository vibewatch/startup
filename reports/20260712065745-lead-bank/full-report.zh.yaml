  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、历史和当前规模
        blocks:
          - type: paragraph
            body: >-
              做承销判断时，Lead Bank 的两个身份都重要：一是可追溯至 1928 年 Garden City Bank 的受监管银行牌照，二是现任所有者重新搭建的技术型发起银行平台。该机构 2010 年更名为 Lead
              Bank；2022 年 7 月，Jackie Reses 领导的控股公司 Luna Parent Inc. 以 $56 million 收购了它。如今，Lead Bank 是一家总部位于 Kansas City
              的密苏里州特许、FDIC 保险社区银行，FDIC 证书号 8283，在 Kansas City、Lee’s Summit 和 Crossroads district 设有网点。牌照不只是品牌包装；它让 Lead
              直接接入受保险保护的存款和受监管银行通道，也带来审慎监管、消费者保护和第三方监督义务。最新 2026 年监管数据显示，总资产约 $2.68 billion，存款接近 $2.4
              billion。相对于收购基数，这一规模已经可观，但不能与技术平台收入或盈利能力混为一谈。因此，本快照把银行资产负债表指标与经营收入、估值和募资额分开看。
