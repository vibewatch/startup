      - number: '2.4'
        title: 约束、矛盾和尽调优先级
        blocks:
          - type: paragraph
            body: >-
              该品类最强的顺风——非银行机构能提供金融产品——也是它的核心约束，因为受监管银行仍需对合规、消费者结果和第三方监督负责。因此，发起银行准入节奏慢、证据要求高，且难以逆转。切换可能涉及数据迁移、卡或账户变更、重新做控制测试和客户沟通；这会带来留存，也会拖慢初始采用。信贷项目增加资本和信用强度，存款、支付和卡则增加资金保护、欺诈和运营义务。Lead
              还面临公司特定的集中度敞口：公开分析显示，合作伙伴信贷项目贡献约三分之二、即约 68% 收入，但合作伙伴级经济性没有披露。$10–60 billion
              的宽估计区间是负面的规模测算信号，不是选择最大数字的理由。投资人应要求一致的定义、地域、预测年份、项目级经济性、监管整改成本和流失历史。在这些数据到位前，$28–34 billion 和 17.8% CAGR
              只能作为方向性品类锚点，Lead 的 SOM 和可持续抽成率仍未解决。
