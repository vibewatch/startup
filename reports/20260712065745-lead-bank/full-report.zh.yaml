  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算纪律
        blocks:
          - type: paragraph
            body: >-
              做承销时，Lead Bank 所在市场是银行即服务（BaaS）：通过 API
              或项目基础设施，把受监管银行能力交付给金融科技和非银行分销方。纳入的支出包括发起银行准入、核心账户基础设施、支付和资金划转、发卡、存款项目和信贷赋能。不纳入的是消费者交易价值本身、独立金融应用前端，以及银行自己的资产负债表；这些属于需求或运营背景，不是供应商收入池。现状替代方案包括与传统银行直接集成、内部搭建合规和账本能力，以及叠加在另一家发起银行之上的中间件。这个边界把
              Lead Bank 放在发起银行和 API 银行层，其牌照以及 Lend、Move、Issue 和 Store 能力把金融科技分销连接到受监管通道。公开 2026 年估计集中在 $28–34 billion 和约
              17.8% CAGR，但审阅范围从约 $10 billion 到 $60 billion 不等，因为发布机构在地域、纳入服务和预测年份上各不相同。只有保留这个区间，而不是压成虚假的精确数字，它才对决策有用。
