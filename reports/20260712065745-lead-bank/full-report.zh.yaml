              估值，是本证据集中披露规模最大的直接同业。Lead 的优势不是绝对规模。更强的定位论点，是通过 API 优先模式提供统一的受监管平台，覆盖 Lend、Move、Issue 和
              Store。这种宽度可以减少金融科技客户在信贷、资金划转、发卡和存款之间协调供应商的成本。但比较仍是暂定的，因为私营竞争对手没有一致披露经审计收入、项目数量、定价、审批率或贡献利润率。公开产品页面能证明范围和定位，不能证明等同的服务质量、实施速度或风险调整后经济性。
