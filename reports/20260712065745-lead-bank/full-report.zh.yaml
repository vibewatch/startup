  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局和买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Lead Bank 所在市场不止发起银行。最直接的替代者是拥有牌照的基础设施银行，如 Column、Cross River Bank、The Bancorp Bank 和 Green Dot
              Bank，它们可以把受监管资产负债表与支付、存款、卡或信贷能力结合起来。Stripe Treasury 是相邻的嵌入式金融分销路径；Synctera、Unit 和 Treasury Prime
              位于金融科技开发者与一家或多家银行之间。Marqeta 更适合作为处理商对比，而不是一一对应的银行。Blue Ridge Bank 作为退出者具有战略意义，因为它的退出证明，BaaS
              供给会在监管压力下收缩。潜在客户也可以自行组合处理商、合规供应商和银行关系，保留传统发起银行，或在内部搭建更多编排能力。这意味着 Lead
              同时竞争银行选择权和集成层控制权。实际格局应按牌照所有权、产品宽度、开发者体验、项目风险偏好，以及买方是否愿意管理多供应商来分层，而不是套用单一 BaaS 标签。
