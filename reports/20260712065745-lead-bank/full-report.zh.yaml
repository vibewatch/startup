      - number: '1.4'
        title: 牵引力、里程碑和尽调姿态
        blocks:
          - type: paragraph
            body: >-
              公开时间线显示，2022 年收购后 Lead 转型很快。它从长期社区银行底座切入高增长金融科技基础设施战略，拿下可见合作伙伴，2025 年报告净收入 $108 million，高于 2024 年的 $73
              million，并以独角兽估值融资。两年收入对比意味着约 48% 同比增长。入选 CNBC 2025 Disruptor 50，并于 2026 年 6 月加入 American Fintech
              Council，进一步增强生态可信度，但都不能替代经审计的经济性。最重要的制衡因素是收入质量：公开报道显示，合作伙伴信贷项目贡献约三分之二、即约 68% 收入。Sacra 与 Column 的负面比较凸显了
              Lead 对少数信贷关系的依赖，以及合作伙伴迁移、信用损失或监管干预可能同时影响多条收入流的风险。投资人应把管理层收入与监管报表收入对齐，取得项目级集中度和单位经济数据，并在依赖盈利能力说法前，区分约 $10.5
              million 的监管净收入与另行报告的约 $31 million 调整后收益。
