        title: 领导层、治理和资本形成
        blocks:
          - type: paragraph
            body: >-
              Jackie Reses 是公开层面的重心：CEO、董事长、联合创始人，并持有约 40% 股份。她的运营履历覆盖 Square 和 Block，曾负责 Square Capital 并担任 Square
              Financial Services 董事长；也曾任职于 Yahoo、Goldman Sachs 和 Apax Partners。Affirm 和 Nubank
              的董事经历，又补足了信贷和数字银行视角。同样的集中度也带来关键人物和治理风险，因为完整的最新股权结构、董事会权利安排和继任计划并未公开。资本形成仍然强劲。Lead 于 2025 年 9 月完成 $70
              million B 轮融资，由 Andreessen Horowitz 和 Khosla Ventures 共同领投，ICONIQ 和 Greycroft 加入，Ribbit Capital、Coatue 和
              Zeev Ventures 继续参与。披露的 $1.47 billion 投后估值，约为 2024 年 4 月前后报道的约 $750 million 估值的两倍。若把 $56 million 收购融资和 $70
              million B 轮作为披露资本相加，总额为 $126 million；但这不是经完整审计的终身融资台账，也不应被解读为今天经营银行可动用的股权资金。
