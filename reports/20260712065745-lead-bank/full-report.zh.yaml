            body: >-
              对一家私有发起银行来说，Lead Bank 报告的经营轨迹很强：净收入从 2024 年的 $73 million 增至 2025 年的 $108 million，意味着约 48%
              同比增长。媒体报道还显示，2025 年调整后收益约 $31 million，2024 年约 $22 million。这些数字对应约 28.7% 和 30.1% 的调整后收益率，以及约 40.9%
              的调整后收益增长，但这些只是基于报告、未审计输入计算出的分析比率，不应被视为 GAAP
              利润率。因此，主要承销亮点是动能，而不是披露质量。审阅来源没有提供经审计报表、收入确认政策，也没有把报告净收入和调整后收益与银行监管账户对齐的调节表。投资人应保留各指标的准确标签和年份，不要把管理口径指标与监管报表数据混合使用。
