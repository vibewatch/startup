  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer or component
      - Role
      - Owned or partner-supplied
      - Dependency
      - Principal risk
    rows:
      - - Fintech experience
        - Captures customer intent and presents financial product
        - Customer-owned
        - Lead API contract
        - Poor mapping or UX can create compliance errors
      - - API gateway
        - Authenticates and routes REST/JSON instructions
        - Lead-visible layer
        - OAuth2 and allowlisted networking
        - Credential or configuration failure
      - - Applications controls
        - Runs entity onboarding workflow
        - Lead with data and compliance dependencies
        - KYC KYB OFAC and policy inputs
        - False positives inconsistent decisions or Reg B exposure
      - - Core account and ledger layer
        - Records balances obligations and state changes
        - Lead bank responsibility
        - Internal controls and reconciliation
        - Ledger mismatch latency or recovery failure
      - - Banking rails
        - Execute ACH wire and instant transfers
        - Network and operator dependencies
        - External payment systems
        - Cutoffs returns outages and exception handling
      - - Card and stablecoin layer
        - Supports issuing and partner-enabled settlement
        - Shared with Visa Stripe Bridge and Solana
        - Partner availability and rule sets
        - Concentration settlement or regulatory change
    notes: Ownership is an analytical boundary inferred from public documentation; internal vendors, processors, and ledger architecture are not fully disclosed.
    claimRefs:
