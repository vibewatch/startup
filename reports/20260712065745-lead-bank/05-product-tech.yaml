      - CE008
      - CE012
      - CE019
      - CE020
      - CE021
      - CE026
      - CE032
  - id: TE004
    title: Trust / quality / compliance table
    columns:
      - Control or evidence
      - Public status
      - Scope
      - Strength
      - Unresolved gap
    rows:
      - - OAuth2
        - Documented
        - API authentication
        - Standard token-based access control
        - Token policy and privilege model not public
      - - IP allowlist
        - Documented
        - API network boundary
        - Adds origin restriction beyond tokens
        - Rotation and emergency-change procedure not public
      - - KYC KYB and OFAC
        - Documented at Entity level
        - Applications workflow
        - Makes screening location explicit
        - Vendors thresholds and false-positive rates not public
      - - Regulation B guidance
        - Documented best practice
        - Lending applications
        - Signals fair-lending workflow awareness
        - Monitoring testing and adverse-action evidence private
      - - Fraud protection
        - Officially described
        - Business and platform usage
        - Visible customer-protection posture
        - Loss rates tooling and response metrics not public
      - - Availability and security assurance
        - Not quantified in reviewed sources
        - Platform-wide
        - No public strength can be verified
        - SLA incidents certifications penetration tests and recovery objectives
    notes: “Documented” means visible in reviewed public materials; it does not substitute for control testing, audit reports, or contractual commitments.
