- id: FR002
  title: Industry risk transmission map
  type: dag
  layout: wide
  summary: A partner or ledger failure can propagate through frozen funds, customer harm, litigation, enforcement, and ultimately franchise impairment.
  data:
    nodes:
    - {id: partner-failure, label: Fintech or middleware failure}
    - {id: record-gap, label: Ledger and reconciliation gap}
    - {id: frozen-funds, label: Frozen or missing customer funds}
    - {id: customer-harm, label: Customer harm and complaints}
    - {id: litigation, label: Litigation}
    - {id: enforcement, label: Regulatory intervention}
    - {id: remediation, label: Remediation and capital cost}
    - {id: franchise, label: Program exit or franchise impairment}
    edges:
    - {from: partner-failure, to: record-gap, label: disrupts records and servicing}
    - {from: record-gap, to: frozen-funds, label: prevents reconciliation}
    - {from: frozen-funds, to: customer-harm, label: blocks access}
    - {from: customer-harm, to: litigation, label: creates claims}
    - {from: customer-harm, to: enforcement, label: draws scrutiny}
    - {from: litigation, to: remediation, label: adds cost}
    - {from: enforcement, to: remediation, label: mandates controls}
    - {from: remediation, to: franchise, label: can force exit}
