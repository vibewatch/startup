  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: supervisory-status
    missingEvidence: Current examination findings, regulatory correspondence, consent-order searches, board remediation reporting, and launch restrictions specific to Lead Bank.
    whyItMatters: Public industry precedents cannot establish Lead’s confidential supervisory standing or whether regulators have identified material weaknesses.
    diligencePath: Obtain counsel-confirmed regulatory searches, recent examination correspondence, board risk minutes, and a management representation on unresolved findings.
    relatedQuestionRefs: [QR026]
    relatedTableRefs: [TR001, TR002]
  - type: private-evidence-only
    severity: material
    topic: partner-contracts
    missingEvidence: Program-level termination rights, indemnities, servicing continuity, ledger ownership, renewal dates, and pricing provisions.
    whyItMatters: Contract rights determine whether a partner failure or migration becomes a manageable wind-down or a customer and earnings shock.
    diligencePath: Review the top partner agreements, side letters, wind-down playbooks, servicing schedules, and contract concentration dashboard.
    relatedQuestionRefs: [QR027]
    relatedTableRefs: [TR001, TR004]
  - type: private-evidence-only
    severity: blocking
    topic: credit-gap
    missingEvidence: Program vintages, delinquencies, charge-offs, recoveries, reserve methodology, fraud losses, and contractual loss allocation.
    whyItMatters: Approximately 68% revenue exposure to lending programs cannot be underwritten without knowing whether credit downside sits with Lead or its partners.
    diligencePath: Obtain monthly vintage curves, stress tests, allowance methodology, trigger breaches, partner recourse terms, and audited loss reconciliation.
    relatedQuestionRefs: [QR028]
    relatedTableRefs: [TR001, TR004, TR005]
  - type: private-evidence-only
    severity: material
    topic: succession-gap
    missingEvidence: Board-approved succession plan, emergency delegation matrix, retention arrangements, and ownership-transition plan for Jackie Reses.
    whyItMatters: CEO, chair, co-founder, and approximately 40% ownership concentration makes continuity central to governance and execution resilience.
    diligencePath: Review succession materials, delegated authorities, key-person insurance, executive retention, and board challenge mechanisms.
    relatedQuestionRefs: [QR029]
    relatedTableRefs: [TR001, TR004, TR005]
  - type: enumeration-incomplete
    severity: material
    topic: severity-ranked-risk-matrix
    missingEvidence: A complete internal risk inventory, regulatory issue log, operational incident register, partner contract set, and quantified enterprise risk ratings.
    whyItMatters: The public risk matrix is necessarily partial and cannot establish that all material risks or mitigations have been identified.
    diligencePath: Reconcile TR001 and TR002 against the bank’s enterprise risk assessment, RCSA, audit universe, complaint taxonomy, and board risk appetite.
