callouts:
- calloutType: risk
  title: Precedent can destroy the strategy without closing the bank
  body: Blue Ridge’s OCC order was terminated in November 2025, but the institution had exited BaaS; remediation success therefore does not guarantee preservation of platform economics.
  claimRefs: [CR003, CR004, CR005]
- calloutType: insight
  title: Logo diversity is not economic diversity
  body: Partner lending programs contribute roughly 68% of revenue, while product-level migration such as Affirm Card issuing moving to Stride shows why exposure must be measured by program.
  claimRefs: [CR015, CR016, CR039, CR041]
- calloutType: recommendation
  title: Require control evidence before underwriting the valuation
  body: Regulatory correspondence, reconciliation metrics, credit vintages, partner concentration, and succession materials should be conditions to investment rather than post-close workstreams.
  claimRefs: [CR023, CR024, CR025, CR026, CR028]
