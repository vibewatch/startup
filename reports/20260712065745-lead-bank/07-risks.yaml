- id: TR005
  title: Mitigation, monitoring, and kill criteria
  columns: [Risk, Monitorable indicator, Threshold or event, Mitigation evidence required, Action implication]
  rows:
  - [Regulatory standing, Formal orders or repeat material findings, Any unresolved public order or launch restriction, Clean correspondence and closed audit issues, Pause investment until remediation is independently verified]
  - [Customer funds, Reconciliation exceptions and aged breaks, Any unexplained customer shortfall or recurring material break, Daily three-way reconciliation and tested wind-down, Treat as immediate thesis break]
  - [Credit exposure, Delinquency charge-offs and reserve coverage, Losses outside contractual trigger or reserve policy, Program vintages stress tests and loss allocation, Reprice or avoid if downside is bank-retained]
  - [Partner concentration, Top-partner revenue and deposit share, Major migration without replacement economics, Renewal calendar diversification and exit rights, Reduce valuation or wait for diversification]
  - [Leadership continuity, Delegated authority and successor readiness, No credible successor for CEO chair control nexus, Board-approved succession and empowered control functions, Require governance condition before investment]
  notes: Thresholds are diligence decision rules, not claims that a breach has occurred at Lead Bank.
  claimRefs: [CR023, CR024, CR025, CR026, CR027, CR028, CR047, CR048]
