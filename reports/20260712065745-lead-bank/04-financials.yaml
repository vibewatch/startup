artifact: financials
slug: lead-bank
runDate: '2026-07-12'
company:
  name: Lead Bank
chapter:
  number: 4
  title: Financials
  summary: Lead Bank reported $108 million of 2025 net revenue versus $73 million in 2024, approximately 48% growth, and approximately $31 million of adjusted earnings. The trajectory is attractive, but roughly 68% dependence on partner lending programs, the distinction between press-adjusted earnings and approximately $10.5 million of FDIC regulatory net income, and the absence of audited public statements prevent a complete underwriting.
sections:
- id: revenue-trajectory-and-profitability
  title: Revenue trajectory and reported profitability
  body: 'Lead Bank’s reported operating trajectory is strong for a private sponsor bank: net revenue increased to $108 million in 2025 from $73 million in 2024, implying approximately 48% year-over-year growth. Press reporting also places adjusted earnings at approximately $31 million in 2025 versus approximately $22 million in 2024. Those figures imply adjusted-earnings margins near 28.7% and 30.1%, respectively, and approximately 40.9% adjusted-earnings growth, but these are analytical ratios built from reported, non-audited inputs. They should not be treated as GAAP margins. The primary underwriting strength is therefore momentum, not disclosure quality. No reviewed source provides audited statements, a revenue-recognition policy, or a reconciliation from reported net revenue and adjusted earnings to the bank’s regulatory accounts. Investors should preserve the exact labels and vintages rather than combining management-oriented measures with call-report data.'
  claimRefs: [CI001, CI002, CI003, CI004, CI005, CI041, CI042, CI043]
  tableRefs: [TI001]
  figureRefs: [FI001]
- id: revenue-model-and-mix
  title: Revenue model, mix, and concentration
  body: 'Lead monetizes regulated infrastructure across lending, money movement, issuing, and deposit products, but public evidence is much clearer on mix than on contract mechanics. Non-interest income represents approximately 45% of 2025 revenue, while partner lending programs contribute approximately two-thirds, or roughly 68%, of revenue. The latter concentration is the central revenue-quality issue because a small number of program relationships can expose revenue simultaneously to partner migration, credit performance, pricing pressure, and supervisory intervention. Sacra’s adverse comparison with Column reinforces that lending dependence is not merely a theoretical risk. Public materials do not disclose fee schedules, take rates, minimum commitments, revenue recognition by product, or partner-level economics. Consequently, the business appears diversified by product surface but concentrated by economic engine. Data-room diligence should separate recurring platform fees, transaction fees, spread income, origination economics, and credit-risk sharing for every material program.'
  claimRefs: [CI006, CI007, CI026, CI027, CI028, CI029, CI030, CI033, CI038]
  tableRefs: [TI002, TI003]
- id: regulatory-balance-sheet
  title: Regulatory balance sheet and metric reconciliation
  body: 'FDIC BankFind data for certificate 8283 provide the strongest primary-source financial anchor. Latest 2026 regulatory data show approximately $2.68 billion of total assets, approximately $2.4 billion of deposits, approximately $10.5 million of regulatory net income, and approximately $234 million of total equity. Deposits are therefore about 89.6% of assets and equity about 8.7% of assets, calculated ratios that describe balance-sheet funding rather than platform unit economics. Press coverage cited approximately $3 billion of assets by mid-2025, up from approximately $779 million in 2022, so reporting cutoffs and definitions must be reconciled before trend analysis. Most importantly, FDIC regulatory net income of approximately $10.5 million is a different metric from press-reported adjusted earnings of approximately $31 million. The gap may reflect perimeter, timing, or adjustments, but public sources do not provide the bridge.'
  claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI031, CI032]
  tableRefs: [TI004]
  figureRefs: [FI003]
- id: capital-adequacy-and-funding
  title: Capital adequacy and financing dependency
  body: 'The capital chronology begins with Luna Parent’s July 2022 acquisition of Lead Bank for $56 million and culminates in a $70 million Series B closed in September 2025 at a $1.47 billion post-money valuation. The prior valuation was approximately $750 million around April 2024, and the disclosed acquisition plus Series B amounts sum to $126 million of capital. Andreessen Horowitz and Khosla Ventures co-led the Series B; ICONIQ and Greycroft joined as new investors, while Ribbit Capital, Coatue, and Zeev Ventures were existing investors. This history establishes access to capital but does not establish cash available to the operating bank, holding-company liquidity, or regulatory capital headroom. Public sources disclose neither cash on hand, monthly burn, runway, intended use by legal entity, next-round triggers, nor debt and credit-facility obligations. Capital adequacy therefore requires private liquidity, capital-ratio, and intercompany-funding schedules rather than inference from headline fundraising.'
  claimRefs: [CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025, CI035, CI036, CI037, CI040]
  tableRefs: [TI005, TI006]
  figureRefs: [FI002]
- id: unit-economics-and-gtm
  title: Unit economics, cost structure, and GTM efficiency
  body: 'Public evidence does not support conventional unit-economics underwriting. Lead’s API-first model likely earns revenue through a mixture of platform, transaction, spread, origination, and program economics, while costs can include compliance personnel, fraud and loss operations, payment and network fees, technology infrastructure, partner onboarding, and balance-sheet capital. Yet no reviewed source discloses gross margin, contribution margin by program, credit-loss allocation, customer acquisition cost, sales-cycle length, payback, retention, or expansion. Named fintech relationships demonstrate distribution reach but cannot substitute for cohort economics or customer-level profitability. The roughly 68% lending-program revenue share makes loss-sharing and funding costs especially important. Diligence should obtain a fully loaded program P&L, vintage loss curves, direct-versus-partner pipeline conversion, implementation labor, and renewal economics. Until then, positive reported earnings cannot prove that growth is efficient, repeatable, or resilient through a credit cycle.'
  claimRefs: [CI007, CI026, CI033, CI034, CI038, CI039, CI040]
  tableRefs: [TI007]
- id: financial-verdict
  title: Financial verdict and underwriting blockers
  body: 'The financial verdict is favorable on growth and access to capital, mixed on revenue quality, and blocked on audit-grade transparency. Reported net revenue grew approximately 48% to $108 million in 2025, and adjusted earnings rose to approximately $31 million. At the same time, partner lending contributes roughly 68% of revenue, creating concentration and credit-cycle sensitivity, while non-interest income at approximately 45% shows a meaningful fee component without revealing its margin or durability. The $1.47 billion valuation equals approximately 13.6 times 2025 net revenue, a demanding reference point given the disclosure gap. The decisive diligence requests are audited financial statements, a management-to-regulatory earnings bridge, customer and program concentration, gross and contribution margin by stream, liquidity and burn, regulatory capital ratios, debt obligations, and downside stress tests. Without them, the public record supports monitoring and deeper diligence, not a fully underwritten financial conclusion.'
  claimRefs: [CI001, CI003, CI004, CI006, CI007, CI008, CI014, CI021, CI033, CI034, CI044]
