callouts:
- calloutType: strength
  title: Strong reported growth and capital access
  body: Net revenue rose approximately 48% to $108 million in 2025, while the September 2025 Series B added $70 million at a $1.47 billion post-money valuation.
  claimRefs: [CI001, CI003, CI019, CI021]
- calloutType: risk
  title: Lending concentration dominates revenue quality
  body: Partner lending programs generate roughly 68% of revenue, making program retention, credit performance, funding costs, and regulatory oversight decisive.
  claimRefs: [CI007, CI033]
- calloutType: recommendation
  title: Reconcile before underwriting profitability
  body: Obtain audited statements and a management-to-FDIC bridge before comparing approximately $31 million of adjusted earnings with approximately $10.5 million of regulatory net income.
  claimRefs: [CI008, CI012, CI014]
