  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited financial statements and a bridge among net revenue, adjusted earnings, regulatory net income, legal entities, and reporting periods.
    whyItMatters: Profitability and valuation cannot be underwritten when public operating and regulatory measures use different definitions.
    diligencePath: Request audited statements, call reports, management adjustments, revenue-recognition policies, and auditor correspondence.
    relatedQuestionRefs: [QI021]
    relatedTableRefs: [TI001, TI004]
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-unit-economics
    missingEvidence: Gross margin, contribution margin, credit losses, funding cost, and fully loaded servicing cost by product and partner.
    whyItMatters: Revenue growth may not translate into durable economic value if lending and service costs scale proportionally.
    diligencePath: Request program-level P&Ls, loss vintages, cost allocation, and cohort contribution-margin bridges.
    relatedQuestionRefs: [QI022]
    relatedTableRefs: [TI002, TI007]
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-and-runway
    missingEvidence: Cash on hand, monthly burn, runway, planned use of funds, next-round trigger, debt schedule, and capital-ratio forecast.
    whyItMatters: Headline funding does not establish holding-company liquidity or regulated-bank capital adequacy.
    diligencePath: Request treasury statements, board forecasts, debt documents, regulatory-capital schedules, and downside liquidity scenarios.
    relatedQuestionRefs: [QI024]
    relatedTableRefs: [TI005]
  - type: private-evidence-only
    severity: material
    topic: customer-and-gtm-economics
    missingEvidence: Revenue by customer, contract pricing, renewal schedule, CAC, payback, sales cycle, and direct-versus-partner funnel performance.
    whyItMatters: Concentration and sales efficiency determine whether current growth is repeatable and resilient.
    diligencePath: Request the top-20 customer schedule, contract extracts, CRM funnel, cohort retention, and fully loaded acquisition-cost analysis.
    relatedQuestionRefs: [QI023, QI027]
    relatedTableRefs: [TI003, TI007]
