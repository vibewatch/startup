        title: Platform depth, partner dependencies, and stablecoin capability
        blocks:
          - type: paragraph
            body: >-
              Lead’s defensible product position comes from combining a regulated bank operating layer with an
              integration surface. Middleware providers such as Unit or Synctera can simplify orchestration across
              banking providers, but Lead’s proposition is structurally different: its charter, account records,
              compliance responsibilities, and ledger role sit beneath the APIs. This can shorten the chain of
              responsibility, although it does not eliminate processors, card networks, payment operators, or specialist
              partners. The stablecoin-linked card program illustrates the boundary. Stripe’s Bridge contributes
              stablecoin infrastructure, Visa contributes card-network reach, Solana supports the tested on-chain
              settlement path, and Lead supplies the bank role within the operating structure. Reports in 2026 describe
              18 live countries and a target of 100+ countries by end-2026. That expansion is technically and
              commercially meaningful, but it remains a roadmap target for markets not yet live. Investors should
              distinguish Lead-built controls from partner-supplied capabilities and test fallback, settlement finality,
              sanctions, liquidity, geographic licensing, and partner-change provisions before assigning platform-level
