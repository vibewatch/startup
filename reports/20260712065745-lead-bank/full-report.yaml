      - number: '7.4'
        title: Operational, compliance, and key-person execution
        blocks:
          - type: paragraph
            body: >-
              The breadth of Lead’s Lend, Move, Issue, and Store model expands the number of transaction, ledger, fraud,
              sanctions, BSA/AML, dispute, and vendor-control surfaces that must work continuously. API-first delivery
              can standardize controls, but rapid partner growth can also outpace staffing, model validation, quality
              assurance, and board reporting. The same scaling challenge applies to onboarding and ongoing monitoring:
              each program introduces distinct customer journeys, data flows, prohibited-use risks, complaint patterns,
              and wind-down requirements. Leadership concentration compounds this execution burden. Jackie Reses is CEO,
              chair, co-founder, and an approximately 40% shareholder, while a complete public succession plan and
              delegated-control map are unavailable. Her experience is a mitigation, but role and ownership
              concentration can slow challenge, complicate succession, and amplify reputational spillover. Investors
              should inspect compliance headcount, independent testing, issue aging, audit escalation, operational
              resilience exercises, management succession, and whether control functions have authority to stop partner
              launches.
            claimRefs:
              - CR018
