        title: Scale, capability, and positioning
        blocks:
          - type: paragraph
            body: >-
              The disclosed scale comparison is uneven but informative. Lead reported $108 million of net revenue in
              2025, up from $73 million in 2024, or approximately 48% year over year. Column was reported at
              approximately $153 million of 2025 revenue and 219% year-over-year growth, despite remaining founder-owned
              with no outside equity. Cross River was reported at approximately $517 million of revenue and reached an
              approximately $3 billion valuation in 2022, making it the largest disclosed direct peer in this evidence
              set. Lead’s advantage is not absolute scale. Its stronger positioning argument is a unified regulated
              platform spanning Lend, Move, Issue, and Store through an API-first model. That breadth can reduce vendor
              coordination for fintechs needing lending, money movement, card issuing, and deposits. The comparison
              remains provisional because private competitors do not disclose consistently audited revenue, program
              counts, pricing, approval rates, or contribution margins. Public product pages establish scope and
              positioning, not equivalent service quality, implementation speed, or risk-adjusted economics.
