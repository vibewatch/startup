  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal precedent
        blocks:
          - type: paragraph
            body: >-
              Lead Bank operates in a risk category where the chartered bank remains accountable for activities
              delivered through fintech partners. FDIC and OCC third-party oversight expectations make governance,
              BSA/AML, customer-fund controls, complaint handling, and program monitoring core bank responsibilities
              rather than outsourced tasks. The clearest cautionary precedent is Blue Ridge Bank: the OCC imposed a
              consent order in January 2024 addressing BSA/AML, third-party and BaaS oversight, unsafe or unsound
              practices, and capital adequacy. The order was terminated in November 2025, but Blue Ridge had exited
              BaaS, demonstrating that remediation can preserve the institution while destroying the original platform
              strategy. This is industry context, not evidence of a Lead Bank violation. For Lead, the investment
              question is whether policy, staffing, testing, board reporting, and exit rights have scaled with partner
              complexity. Public materials do not establish the bank’s current examination findings or program-level
              control effectiveness, so regulatory standing and remediation readiness require direct confirmation.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR029
              - CR030
              - CR031
              - CR032
              - CR036
          - type: table
            tableRef: TR002
