  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Lead Bank merits a research-more recommendation at the September 2025 entry mark rather than an outright
              rejection. The thesis is that a scarce regulated charter, an API-led sponsor-bank model, approximately 48%
              net-revenue growth, and recognizable fintech relationships can sustain a premium to public payment
              processors. The anti-thesis is price and revenue quality: the $1.47 billion post-money valuation
              represents approximately 13.6x the $108 million of 2025 net revenue, while partner lending programs
              contribute roughly 68% of revenue. That concentration makes the multiple sensitive to partner migration,
              credit outcomes, and regulatory scrutiny. A broad private-company benchmark of approximately 8–15x revenue
              makes the mark defensible, but Mercury’s roughly 8x mark and Marqeta’s approximately 1.6–3x public
              EV/revenue range show how much optimism is embedded. The appropriate valuation conclusion is therefore
              fair-to-stretched, not attractive. Confidence is medium because financing and top-line facts are well
              corroborated while audited revenue quality, customer-level concentration, and security terms remain
              private.
            claimRefs:
              - CV001
