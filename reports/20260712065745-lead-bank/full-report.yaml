        - id: record-gap
          label: Ledger and reconciliation gap
        - id: frozen-funds
          label: Frozen or missing customer funds
        - id: customer-harm
          label: Customer harm and complaints
        - id: litigation
          label: Litigation
        - id: enforcement
          label: Regulatory intervention
        - id: remediation
          label: Remediation and capital cost
        - id: franchise
          label: Program exit or franchise impairment
      edges:
        - from: partner-failure
