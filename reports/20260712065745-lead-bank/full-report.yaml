              quality: public reporting indicates partner lending programs generate about two-thirds, or roughly 68%, of
              revenue. Sacra’s adverse comparison with Column highlights the resulting dependence on a limited set of
              lending relationships and the risk that partner migration, credit losses, or regulatory intervention could
              affect multiple income streams at once. Investors should reconcile management revenue with call-report
              income, obtain program-level concentration and unit economics, and distinguish the approximately $10.5
              million of regulatory net income from the separately reported approximately $31 million of adjusted
              earnings before relying on profitability claims.
