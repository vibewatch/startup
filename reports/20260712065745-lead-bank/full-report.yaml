  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Lead Bank’s product is best understood as regulated banking infrastructure delivered to fintech and
              embedded-finance teams through four pillars: Lend, Move, Issue, and Store. A customer designs a financial
              experience, integrates with Lead’s API surface, and uses the bank layer to originate credit, move money,
              issue cards, or hold funds. This customer-workflow framing matters because Lead is not merely selling
              software access. It is combining software integration with regulated execution, account records,
              compliance processes, and external network connections. Lend maps to lending and credit programs; Move
              maps to ACH, wire, and instant-payment workflows; Issue maps to card programs; and Store maps to account
              and deposit use cases. The breadth can reduce vendor fragmentation for customers that need several banking
              primitives, but it also expands implementation, reconciliation, and compliance scope. Buyers should
              therefore assess each pillar separately rather than treating a broad platform label as proof that every
              rail has equal maturity, economics, or service quality.
