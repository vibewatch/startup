      - number: '1.3'
        title: BaaS operating model and partner ecosystem
        blocks:
          - type: paragraph
            body: >-
              Lead sells regulated banking infrastructure to fintech and enterprise platforms rather than operating only
              as a conventional branch bank. Its public product architecture groups capabilities into Lend, Move, Issue,
              and Store, delivered through REST/JSON APIs with OAuth2 controls. In practical terms, a fintech integrates
              with Lead’s API layer; Lead then connects the program to deposits, payments, card networks, or lending
              rails while retaining regulated-bank responsibilities. Named relationships illustrate the breadth of the
              model: Affirm uses Lead in loan origination, Ramp uses Lead for banking infrastructure and stablecoin-card
              settlement, Stripe and Visa selected Lead for a stablecoin-linked card platform, Branch added Lead for
              workforce payments, and Revolut uses Lead for US banking and card issuance. This diversity is
              strategically valuable because it allows one regulated balance sheet and compliance stack to support
              multiple use cases. It also increases operational complexity and creates correlated counterparty,
              compliance, and credit exposure. Public logos confirm market access, but they do not disclose contract
              economics, concentration by partner, loss-sharing terms, or the cost of servicing each program.
