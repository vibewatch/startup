      - number: '3.3'
        title: Distribution, switching costs, and regulatory trust
        blocks:
          - type: paragraph
            body: >-
              Sponsor-bank selection creates meaningful switching costs because a migration can touch account
              structures, customer disclosures, compliance controls, ledgers, payment routes, cards, and lending
              workflows. Those costs can support retention, but they do not prevent multi-homing: sophisticated fintechs
              may allocate different products or programs among multiple banks to diversify concentration and regulatory
              risk. Distribution power also differs by competitor class. Cross River and established banks can sell
              direct access to regulated infrastructure; Stripe can introduce treasury capabilities through an existing
              software and payments relationship; middleware providers can influence which underlying bank receives a
              program; and Marqeta can control a valuable processor layer without holding the sponsor charter. Lead’s
              named partnerships demonstrate access, but public materials do not disclose exclusivity, renewal duration,
              wallet share, or migration obligations. Regulatory trust is similarly double-edged. Owning a charter can
              remove one intermediary and sharpen accountability, yet it also concentrates supervisory responsibility.
              Blue Ridge’s exit after an OCC order shows how deficiencies in BSA/AML and third-party oversight can
              eliminate a competitor while raising diligence standards for every remaining sponsor bank.
            claimRefs:
