      - number: '7.3'
        title: Customer, credit, and dependency concentration
        blocks:
          - type: paragraph
            body: >-
              Lead’s strongest growth engines also create concentrated downside. Public reporting indicates partner
              lending programs generate approximately two-thirds, or roughly 68%, of revenue, making underwriting
              performance, funding terms, partner conduct, and loss allocation central to earnings quality. The named
              ecosystem is weighted toward several large fintech relationships, while partner-level revenue, deposits,
              originations, delinquencies, charge-offs, reserves, and contract termination rights remain private. Affirm
              Card debit issuing moved to Stride Bank in 2025, a concrete reminder that a visible relationship can
              migrate by product even when other bank-partner activity continues. Concentration should therefore be
              measured by program and economic exposure, not logo count. A lending downturn could combine lower
              origination volume, higher credit losses, tighter reserves, partner disputes, and regulator concern.
              Conversely, one major partner migration could affect fee revenue, deposits, and strategic proof
              simultaneously. The absence of public cohort and loss data makes these risks unquantifiable rather than
              low.
