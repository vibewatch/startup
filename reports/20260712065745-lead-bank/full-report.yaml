      - number: '4.2'
        title: Revenue model, mix, and concentration
        blocks:
          - type: paragraph
            body: >-
              Lead monetizes regulated infrastructure across lending, money movement, issuing, and deposit products, but
              public evidence is much clearer on mix than on contract mechanics. Non-interest income represents
              approximately 45% of 2025 revenue, while partner lending programs contribute approximately two-thirds, or
              roughly 68%, of revenue. The latter concentration is the central revenue-quality issue because a small
              number of program relationships can expose revenue simultaneously to partner migration, credit
              performance, pricing pressure, and supervisory intervention. Sacra’s adverse comparison with Column
              reinforces that lending dependence is not merely a theoretical risk. Public materials do not disclose fee
              schedules, take rates, minimum commitments, revenue recognition by product, or partner-level economics.
              Consequently, the business appears diversified by product surface but concentrated by economic engine.
              Data-room diligence should separate recurring platform fees, transaction fees, spread income, origination
              economics, and credit-risk sharing for every material program.
