      - number: '4.5'
        title: Unit economics, cost structure, and GTM efficiency
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support conventional unit-economics underwriting. Lead’s API-first model likely
              earns revenue through a mixture of platform, transaction, spread, origination, and program economics,
              while costs can include compliance personnel, fraud and loss operations, payment and network fees,
              technology infrastructure, partner onboarding, and balance-sheet capital. Yet no reviewed source discloses
              gross margin, contribution margin by program, credit-loss allocation, customer acquisition cost,
              sales-cycle length, payback, retention, or expansion. Named fintech relationships demonstrate distribution
              reach but cannot substitute for cohort economics or customer-level profitability. The roughly 68%
              lending-program revenue share makes loss-sharing and funding costs especially important. Diligence should
              obtain a fully loaded program P&L, vintage loss curves, direct-versus-partner pipeline conversion,
              implementation labor, and renewal economics. Until then, positive reported earnings cannot prove that
