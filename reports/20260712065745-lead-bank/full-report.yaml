              workflow concerns for an integrator, not invisible back-office functions. The operating model can be read
              as a sequence: the fintech authenticates, submits account or application instructions, Lead applies bank
              and compliance controls, the core banking record or ledger is updated, and external rails execute the
              requested movement, card, or lending action. Public documentation proves the main architecture, but it
              does not disclose every endpoint, internal ledger implementation, latency budget, failover design, or
