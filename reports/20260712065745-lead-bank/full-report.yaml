      - number: '7.5'
        title: Mitigations, monitoring, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The appropriate posture is conditional rather than categorical. Lead has a long-lived charter, reported
              scale, experienced leadership, and fresh growth capital, all of which can support investment in compliance
              and operational resilience. Those strengths do not substitute for program evidence. The diligence package
              should include regulatory correspondence, board risk reporting, BSA/AML and sanctions testing, partner
              approval files, daily reconciliation metrics, unresolved exceptions, complaint and fraud trends, credit
              vintages, concentration by revenue and deposits, loss-sharing terms, and succession materials. Monitorable
              deterioration includes a formal enforcement action, repeat material audit findings, reconciliation
              exceptions that age beyond policy, worsening losses outside agreed triggers, or a top partner migration
              without replacement economics. A thesis break occurs if the bank cannot evidence control ownership, if
              lending losses or reserves invalidate the roughly 68% revenue engine, if a partner failure exposes
              customer shortfalls, or if leadership continuity is not credible. At a $1.47 billion valuation, unresolved
              tail risk should reduce acceptable entry price and confidence.
            claimRefs:
              - CR023
