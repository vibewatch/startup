      - number: '2.4'
        title: Constraints, contradictions, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The category’s strongest tailwind—the ability of nonbanks to offer financial products—is also its
              principal constraint because regulated banks remain accountable for compliance, consumer outcomes, and
              third-party oversight. Sponsor onboarding is therefore slow, evidence-heavy, and difficult to reverse.
              Switching can require data migration, card or account changes, renewed control testing, and customer
              communications; that creates retention but also delays initial adoption. Lending programs add capital and
              credit intensity, while deposits, payments, and cards add safeguarding, fraud, and operational
              obligations. Lead also faces company-specific concentration exposure: public analysis indicates partner
              lending programs account for approximately two-thirds, or roughly 68%, of revenue, yet partner-level
              economics are not disclosed. The wide $10–60 billion estimate range is an adverse sizing signal, not a
              reason to choose the largest figure. Investors should request consistent definitions, geography, forecast
              vintage, program-level economics, regulatory remediation costs, and churn history. Until those are
              available, $28–34 billion and 17.8% CAGR should be treated as directional category anchors, while Lead’s
              SOM and sustainable take rate remain unresolved.
