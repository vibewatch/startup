      - number: '8.3'
        title: Bull, base, and bear valuation scenarios
        blocks:
          - type: paragraph
            body: >-
              A current-revenue sensitivity highlights asymmetric entry economics without pretending to forecast
              undisclosed future revenue. Applying 8x to $108 million gives an $864 million bear reference,
              approximately 41% below the $1.47 billion mark. An 11x base reference gives approximately $1.188 billion,
              still below the financing valuation. A 15x bull reference gives approximately $1.62 billion, only about
              10% above the current mark before dilution, time value, or preference effects. These are valuation
              reference points rather than price targets, because they hold revenue constant and isolate multiple risk.
              The bull case requires continued growth, diversified partner economics, clean credit performance, and
              evidence that the charter-plus-API model deserves the top end of private fintech multiples. The base case
              assumes a good company but some normalization toward the middle of the private range. The bear case
              requires neither failure nor insolvency; ordinary private-market compression toward Mercury’s mark would
              be enough. Missing liquidation preferences and secondary terms further weaken observable common-equity
              return math.
            claimRefs:
