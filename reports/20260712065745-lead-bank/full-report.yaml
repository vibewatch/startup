        title: API, ledger, onboarding, and compliance architecture
        blocks:
          - type: paragraph
            body: >-
              The public technical surface is concrete at the boundary. Lead documents REST-style APIs with JSON
              payloads, OAuth2 authentication, and IP allowlisting. Separate Accounts, Applications, and Lending
              documentation indicates a domain-oriented API design rather than a single undifferentiated endpoint set.
              Applications is especially important because the documentation places KYC, KYB, and OFAC screening at the
