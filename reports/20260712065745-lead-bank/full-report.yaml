      - number: '7.2'
        title: Industry contagion and customer-fund risk
        blocks:
          - type: paragraph
            body: >-
              Synapse illustrates how middleware failure, incomplete records, and disputed ledger responsibility can
              become a systemic sponsor-bank event. Its April 2024 collapse froze approximately $265 million of customer
              funds, left an estimated $65–95 million missing, and affected roughly 100,000 customers. Evolve Bank &
              Trust and Lineage Bank were subsequently sued over missing funds linked to the collapse; those complaints
              are allegations rather than adjudicated findings. The CFPB brought an action in August 2025, and
              approximately $46 million was allocated to victims in December 2025. The lesson for Lead is not that its
              architecture matches Synapse, but that reconciliation breaks and unclear responsibility can turn a partner
              failure into consumer harm, litigation, regulatory intervention, liquidity pressure, and reputational
              damage. Controls should therefore be assessed end to end: ownership of the system of record, daily
              reconciliation, exception aging, FBO-account structure, customer communications, partner wind-down plans,
              and the bank’s ability to continue servicing users after a fintech fails.
            claimRefs:
              - CR006
              - CR007
              - CR008
