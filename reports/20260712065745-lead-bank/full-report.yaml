  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, history, and current scale
        blocks:
          - type: paragraph
            body: >-
              Lead Bank combines two identities that matter for underwriting: a regulated banking charter with roots in
              Garden City Bank, established in 1928, and a technology-oriented sponsor-bank platform assembled under
              current ownership. The institution became Lead Bank in 2010, and Luna Parent Inc., a holding company led
              by Jackie Reses, acquired it in July 2022 for $56 million. Today it is a Missouri state-chartered,
              FDIC-insured community bank headquartered in Kansas City, with FDIC certificate 8283 and locations in
              Kansas City, Lee’s Summit, and the Crossroads district. The charter is not merely branding; it gives Lead
              direct access to insured deposits and regulated banking rails while imposing prudential,
              consumer-protection, and third-party oversight obligations. Latest 2026 regulatory figures place assets at
              approximately $2.68 billion and deposits near $2.4 billion. That scale is substantial relative to the
              acquisition base, but it should not be confused with technology-platform revenue or profitability. The
              snapshot therefore separates bank balance-sheet measures from operating revenue, valuation, and capital
              raised.
