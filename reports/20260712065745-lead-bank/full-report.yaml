      - number: '2.2'
        title: Embedded-finance context and segment structure
        blocks:
          - type: paragraph
            body: >-
              Embedded finance is the larger distribution context, not a directly interchangeable TAM. Bain projects US
              embedded-finance transaction value to reach approximately $7 trillion by 2026, far above BaaS
              vendor-market estimates because transaction value measures financial activity flowing through embedded
              products rather than the revenue captured by infrastructure providers. BaaS is one enabling layer within
              that value chain. The commercial segments span lending, payments, cards, and deposits; buyers are
              typically fintech product or platform leaders, users include treasury, operations, and engineering teams,
              and payers or budget owners often sit in finance, product, or operations. Compliance, risk, and legal
              teams retain effective veto power even when they do not own the budget. Adoption usually proceeds from
              use-case design and sponsor selection through diligence, integration, control testing, and scaled launch.
              Lead Bank plays at the sponsor-bank/API layer rather than the consumer interface. Its public platform
              breadth supports relevance across several segments, but public evidence does not disclose category-level
              revenue by segment or a defensible Lead-specific share of the global market.
