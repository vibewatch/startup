      - number: '8.2'
        title: Financing context, methodology, and comparable set
        blocks:
          - type: paragraph
            body: >-
              The cleanest starting method is current post-money value divided by reported net revenue, not assets or
              deposits. Lead is a regulated bank, but its financing narrative is driven by technology-enabled fee and
              lending-program economics; balance-sheet multiples alone would obscure that operating model. Dividing
              $1.47 billion by $108 million produces approximately 13.6x. The same valuation is approximately 47.4x the
              reported $31 million of adjusted earnings, although adjusted earnings are not interchangeable with
              regulatory net income or audited GAAP profit. Comparable evidence spans imperfect categories. Mercury’s
              May 2026 $5.2 billion valuation on approximately $650 million of revenue implies roughly 8x. Cross River’s
              approximately $3 billion 2022 valuation and approximately $517 million revenue provide an older
              sponsor-bank reference without a synchronized multiple. Column reported approximately $153 million of 2025
              revenue but has no outside-equity market valuation. Marqeta’s public approximately 1.6–3x EV/revenue range
              supplies a liquid processor floor rather than a direct bank comp. Private BaaS and neobank observations
              around 8–15x provide the most generous relevant band.
