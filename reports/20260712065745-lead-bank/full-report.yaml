  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Lead Bank’s relevant market is broader than sponsor banks alone. The closest direct alternatives are
              charter-owning infrastructure banks such as Column, Cross River Bank, The Bancorp Bank, and Green Dot
              Bank, which can combine regulated balance sheets with payment, deposit, card, or lending capabilities.
              Stripe Treasury is an adjacent embedded-finance distribution route, while Synctera, Unit, and Treasury
              Prime sit between fintech developers and one or more banks. Marqeta is a processor comparison rather than
              a like-for-like bank. Blue Ridge Bank is strategically important as an exited participant because its
              departure demonstrates that BaaS supply can contract under supervisory pressure. A prospective customer
              can also assemble processors, compliance vendors, and bank relationships itself, retain a legacy sponsor,
              or build more orchestration internally. This means Lead competes for both bank selection and control of
              the integration layer. The practical landscape is therefore segmented by charter ownership, product
              breadth, developer experience, program risk appetite, and the buyer’s willingness to manage multiple
              vendors rather than by a single BaaS label.
