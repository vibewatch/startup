      - number: '3.4'
        title: Differentiation durability and loss cases
        blocks:
          - type: paragraph
            body: >-
              Lead’s defensible position rests on combining a bank charter, API delivery, balance-sheet capacity, and
              breadth across lending, payments, issuing, and deposits. That combination is useful, but each component
              faces substitution. Column offers a vertically integrated platform-bank proposition and substantially
              faster reported growth. Cross River brings larger disclosed revenue scale and extensive API products.
              Bancorp and Green Dot offer incumbent regulated infrastructure. Stripe can bundle treasury into a broader
              developer and payments relationship. Synctera, Unit, and Treasury Prime can abstract the underlying bank,
              limiting sponsor-bank ownership of the customer interface, while Marqeta competes for processor economics.
              Lead’s approximately 68% revenue exposure to partner lending programs also narrows the diversification
              implied by its four product pillars. The moat therefore depends on risk execution, partner outcomes,
              compliance quality, and durable access—not merely APIs. Lead may win customers wanting one modern
              regulated counterparty across multiple products; it may lose when a buyer prioritizes larger scale, a
              neutral middleware layer, incumbent distribution, lower concentration, or a provider willing to support a
              risk profile that Lead rejects. Private win-loss, pricing, and service-level data are required to test
              this conclusion.
            claimRefs:
