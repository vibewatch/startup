            body: >-
              The evidence supports a functioning and reasonably documented integration platform, but not a fully
              transparent enterprise-reliability profile. Lead publishes dedicated API overviews and describes fraud,
              authentication, allowlisting, entity screening, and fair-lending considerations. DashDevs’ practitioner
              discussion reinforces that production fintech integrations require data mapping, vendor coordination,
              testing, monitoring, and compliance work; an API-first label does not remove those burdens. Three gaps are
              material. First, the reviewed public record does not quantify uptime, service credits, recovery
              objectives, or incident history. Second, it does not establish a complete list of independent security
              certifications or provide penetration-test evidence. Third, it does not publish throughput, latency,
              peak-volume, or ledger-scale benchmarks. These absences do not show that the controls are weak, but they
              limit an external assessment of maturity. A prospective partner should run sandbox and failure-mode tests,
              review reconciliation and idempotency behavior, obtain architecture and data-flow diagrams, inspect
