  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, buyers, users, and payers
        blocks:
          - type: paragraph
            body: >-
              Lead Bank primarily serves fintech platforms that need regulated banking capabilities embedded inside
              their own customer experiences. The buyer is typically a fintech executive, treasury or payments leader,
              card-program owner, or lending-program leader; end users are the fintech customer, cardholder, borrower,
              business, or worker; and the fintech partner generally pays Lead through program economics rather than a
              visible retail subscription. Public examples span consumer credit through Affirm, corporate banking and
              cards through Ramp, global stablecoin-linked cards through Stripe and Bridge with Visa, gig-workforce
              payments through Branch, and US banking and card issuance through Revolut. This is a relatively
              concentrated institutional customer model: each integration can carry meaningful deposits, transaction
              volume, card activity, or loan originations. The breadth of use cases lowers dependence on one product
              surface, but the small named roster and bespoke regulated integrations mean each large relationship can
              still matter disproportionately. Public evidence supports segment and workflow identification more
              strongly than customer count, revenue band, or geography by account.
