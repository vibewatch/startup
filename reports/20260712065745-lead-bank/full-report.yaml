      - number: '8.4'
        title: Exit readiness, kill triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Lead has credible financing access and meaningful operating scale, but it is not publicly exit-ready on
              the evidence reviewed. An investor still needs audited statements, a bridge from reported net revenue and
              adjusted earnings to regulatory measures, partner-level contribution margins, credit-loss allocation, and
              concentration by revenue and deposits. The cap table requires equal attention: preferred liquidation
              terms, anti-dilution protection, board rights, secondary sales, and the fully diluted ownership schedule
              determine whether the $1.47 billion headline translates into common-equity value. Three thesis-break
              triggers should govern diligence. First, a top partner loss or material deterioration in lending-program
              economics would undermine both growth quality and the premium multiple. Second, adverse supervisory
              findings or required remediation could slow onboarding and raise compliance cost. Third, evidence that
              non-recurring, low-margin, or credit-sensitive revenue dominates the $108 million base would invalidate a
              simple revenue multiple. A credible exit path requires diversified recurring revenue, repeatable
              compliance operations, independently verified earnings quality, and enough governance transparency for
              later-stage or public investors. Until those conditions are documented, fair-to-stretched is the
              disciplined conclusion.
            claimRefs:
              - CV023
              - CV024
              - CV027
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
