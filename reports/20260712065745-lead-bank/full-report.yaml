            body: >-
              The central customer-quality tension is strong brand validation versus opaque economic concentration.
              Partner lending programs account for approximately two-thirds, or roughly 68%, of Lead Bank revenue, so
              customer and product concentration can transmit directly into revenue even when the visible roster spans
              several use cases. Lead reported $108 million of 2025 net revenue, but the supplied public evidence does
              not allocate that amount by customer, program, product pillar, geography, or contract. A few large
              fintechs may therefore drive substantial loan originations, deposits, interchange, and fee income. The
              adverse Sacra comparison reinforces the concern that Lead is more exposed to partner lending economics
              than a more software-heavy infrastructure model. Expansion through stablecoin cards, workforce payments,
              and international fintech relationships could diversify future economics, but announced reach is not the
              same as realized revenue diversification. Underwriting should require a top-customer concentration
              schedule, program contribution margins, credit and loss-sharing terms, contract renewal dates, and churn
              history before assigning durable value to the customer base.
