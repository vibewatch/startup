  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue trajectory and reported profitability
        blocks:
          - type: paragraph
            body: >-
              Lead Bank’s reported operating trajectory is strong for a private sponsor bank: net revenue increased to
              $108 million in 2025 from $73 million in 2024, implying approximately 48% year-over-year growth. Press
              reporting also places adjusted earnings at approximately $31 million in 2025 versus approximately $22
              million in 2024. Those figures imply adjusted-earnings margins near 28.7% and 30.1%, respectively, and
              approximately 40.9% adjusted-earnings growth, but these are analytical ratios built from reported,
              non-audited inputs. They should not be treated as GAAP margins. The primary underwriting strength is
              therefore momentum, not disclosure quality. No reviewed source provides audited statements, a
              revenue-recognition policy, or a reconciliation from reported net revenue and adjusted earnings to the
              bank’s regulatory accounts. Investors should preserve the exact labels and vintages rather than combining
              management-oriented measures with call-report data.
