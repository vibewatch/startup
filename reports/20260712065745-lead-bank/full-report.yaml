      - number: '6.4'
        title: Durability, retention, and switching risk
        blocks:
          - type: paragraph
            body: >-
              Sponsor-bank relationships can become operationally sticky because changing the regulated institution may
              require card, account, compliance, settlement, and customer-communication work. Public evidence
              nevertheless shows that roles can move. In April 2025, Affirm and Stride Bank announced that Stride would
              become the issuing partner for Affirm Card's debit program. That change does not establish that Lead lost
              Affirm's separate BNPL loan-origination role, and the two roles should not be conflated. It does
              demonstrate program-level switching and competitive bank selection within a major fintech relationship. No
              public NRR, GRR, churn, renewal rate, contract length, satisfaction score, or cohort data were found in
              the supplied evidence. Accordingly, named production programs support adoption quality but do not prove
              contractual durability. Investors need renewal calendars, termination rights, implementation histories,
              and program-level economics to distinguish deeply embedded multi-product relationships from replaceable
              single-program mandates. The Affirm example should be treated as a concrete warning against assuming that
              a prominent customer logo implies exclusivity across all banking products.
