      - number: '1.4'
        title: Traction, milestones, and diligence posture
        blocks:
          - type: paragraph
            body: >-
              The public chronology shows a rapid transformation after the 2022 acquisition. Lead moved from a
              long-lived community-bank base into a high-growth fintech infrastructure strategy, added visible partners,
              achieved a reported $108 million of 2025 net revenue versus $73 million in 2024, and raised at a unicorn
