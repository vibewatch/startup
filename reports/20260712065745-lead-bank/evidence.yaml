evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      A fully diluted cap table, preference stack, board-rights schedule, secondary history, and current succession
      plan.
    whyItMatters: >-
      Ownership and control concentration determine governance leverage, dilution exposure, and resilience beyond the
      founder-CEO.
    diligencePath: >-
      Request the capitalization ledger, financing documents, board observer agreements, and succession materials from
      management and counsel.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Partner-level shares of revenue, deposits, loan originations, credit losses, and contribution margin.
    whyItMatters: >-
      Public evidence indicates lending concentration but cannot quantify the impact of losing or repricing any major
      program.
    diligencePath: Obtain the top-20 partner cohort, program contracts, concentration dashboard, loss vintages, and renewal calendar.
    relatedQuestionRefs:
      - QO027
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited financial statements reconciling $108 million of 2025 net revenue and approximately $31 million of
      adjusted earnings to call-report measures.
    whyItMatters: >-
      Regulatory net income and adjusted earnings are different metrics, and valuation depends on recurring,
      attributable, audited economics.
    diligencePath: >-
      Request audited statements, the management-to-GAAP bridge, call-report reconciliation, and segment-level revenue
      recognition policy.
    relatedQuestionRefs:
      - QO028
  - type: enumeration-incomplete
    severity: material
    topic: milestone-and-leadership-coverage
    missingEvidence: Complete executive, board, investor-rights, and internal milestone records beyond publicly announced events.
    whyItMatters: Public enumeration can identify named actors and dated events but cannot establish that the lists are complete.
    diligencePath: Review board minutes, organization charts, financing schedules, and the internal corporate event ledger.
    relatedTableRefs:
      - TO002
      - TO003
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: >-
      Comparable publisher definitions, geographies, base years, forecast periods, and underlying revenue pools for the
      roughly $10–60 billion range.
    whyItMatters: Without normalized definitions, a precise TAM or market-share calculation would create false valuation confidence.
    diligencePath: Obtain full market-study methodologies and rebuild each estimate on a common 2026 geography and service boundary.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM001
      - TM002
  - type: private-evidence-only
    severity: blocking
    topic: lead-som-and-segment-economics
    missingEvidence: >-
      Lead’s qualified pipeline, win rates, revenue, take rate, contribution margin, and retention by Lend, Move, Issue,
      and Store.
    whyItMatters: Company-level capture and valuation cannot be derived from a broad market CAGR without segment economics.
    diligencePath: >-
      Request CRM cohorts, signed-program schedules, audited segment reporting, pricing, churn, and contribution-margin
      bridges.
    relatedQuestionRefs:
      - QM026
      - QM027
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: regulatory-cost
    missingEvidence: >-
      Program-level compliance staffing, examination findings, remediation costs, loss allocation, and capital
      consumption.
    whyItMatters: Regulatory and credit intensity may offset category growth and materially change segment profitability.
    diligencePath: >-
      Review regulatory correspondence, program risk assessments, staffing allocations, capital models, and loss-sharing
      agreements.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM005
  - type: enumeration-incomplete
    severity: minor
    topic: market-segment-enumeration
    missingEvidence: A complete census of every BaaS subsegment, buyer configuration, and adoption driver across geographies.
    whyItMatters: The tables are representative analytical maps and should not be read as exhaustive market taxonomies.
    diligencePath: >-
      Commission a customer and prospect survey and reconcile it with full analyst taxonomies and internal pipeline
      coding.
    relatedTableRefs:
      - TM001
      - TM002
      - TM003
      - TM004
      - TM005
  - type: private-evidence-only
    severity: blocking
    topic: win-loss-data
    missingEvidence: >-
      Competitor-tagged pipeline, win rates, loss reasons, displacement events, and renewal outcomes for every material
      direct and adjacent alternative.
    whyItMatters: >-
      Public positioning cannot show whether Lead actually wins against Column, Cross River, middleware providers, or
      incumbent banks in live procurement.
    diligencePath: >-
      Request CRM opportunity exports, RFP notes, loss reviews, renewal cohorts, and customer reference calls segmented
      by competitor.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: normalized-pricing
    missingEvidence: >-
      Comparable program quotes covering implementation fees, minimums, per-account and transaction charges, compliance
      services, credit economics, and volume discounts.
    whyItMatters: >-
      Sponsor banks and middleware vendors package different layers, so public pages cannot support a reliable
      total-cost comparison.
    diligencePath: >-
      Obtain recent Lead proposals and matched competitor quotes, then normalize three representative customer
      scenarios.
    relatedQuestionRefs:
      - QP014
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: service-and-program-economics
    missingEvidence: >-
      Normalized approval rates, implementation duration, uptime, fraud losses, compliance staffing, service levels, and
      contribution margin by program.
    whyItMatters: >-
      Product checklists do not establish operating quality or whether Lead’s integrated model produces superior
      risk-adjusted economics.
    diligencePath: >-
      Review signed SLAs, incident logs, implementation cohorts, approval funnels, risk outcomes, and program-level
      contribution margins.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP002
      - TP004
