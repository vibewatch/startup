  - [Cross River Bank, Direct sponsor bank, 'Approximately $517 million revenue; approximately $3 billion 2022 valuation', Fintech lenders payments and card programs, Broad API product set and greater disclosed scale, Public data do not normalize revenue vintage or program profitability]
  - [The Bancorp Bank, Incumbent sponsor bank, Undisclosed in reviewed evidence, Fintech and prepaid or payments programs, Established regulated infrastructure, Current comparable pricing and program appetite unknown]
  - [Green Dot Bank, Incumbent sponsor bank, Undisclosed in reviewed evidence, Consumer and embedded banking programs, Bank and distribution platform combination, Direct comparability to Lead product mix is incomplete]
  - [Stripe Treasury, Adjacent embedded-finance platform, Undisclosed standalone, Software platforms already using Stripe, Distribution through developer and payments ecosystem, Underlying bank allocation and economics are not transparent here]
  - [Blue Ridge Bank, Exited sponsor-bank competitor, Exited BaaS after OCC order, Historical fintech programs, Illustrates prior sponsor-bank supply, Exit demonstrates supervisory and execution risk]
  - [Synctera, BaaS middleware, Undisclosed in reviewed evidence, Fintech builders seeking orchestration, Platform abstracts bank and compliance integrations, Depends on partner-bank access and contract structure]
  - [Unit, BaaS middleware, Undisclosed in reviewed evidence, Technology companies embedding finance, Developer-oriented embedded-finance layer, Underlying charter and economics require separate diligence]
  - [Treasury Prime, BaaS middleware, Undisclosed in reviewed evidence, Enterprises and fintechs seeking bank-direct connectivity, Multi-bank embedded-banking orchestration, Adds another dependency and potential margin layer]
  - [Marqeta, Processor comp, Public processor with roughly 1.6–3x EV/revenue comp range, Card-program and embedded-finance customers, Card issuing and processing specialization, Not a charter-owning full-service sponsor-bank equivalent]
  - [Internal build or multi-vendor stack, Status quo substitute, Customer-funded and undisclosed, Large fintechs with compliance and engineering capacity, Greater vendor control and potential multi-homing, High integration governance and migration burden]
  notes: Scale metrics preserve the canonical vintages; undisclosed means the reviewed source pack did not support a comparable standalone figure. Categories are analytical and do not imply identical regulated roles.
  enumerationScope:
    coverage: partial
    basis: Covers named direct sponsor banks, middleware platforms, processor and internal-build routes specified in the reviewed evidence through 12 July 2026.
