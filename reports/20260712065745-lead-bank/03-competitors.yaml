  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: win-loss-data
    missingEvidence: Competitor-tagged pipeline, win rates, loss reasons, displacement events, and renewal outcomes for every material direct and adjacent alternative.
    whyItMatters: Public positioning cannot show whether Lead actually wins against Column, Cross River, middleware providers, or incumbent banks in live procurement.
    diligencePath: Request CRM opportunity exports, RFP notes, loss reviews, renewal cohorts, and customer reference calls segmented by competitor.
    relatedQuestionRefs: [QP027]
    relatedTableRefs: [TP001, TP003]
  - type: private-evidence-only
    severity: material
    topic: normalized-pricing
    missingEvidence: Comparable program quotes covering implementation fees, minimums, per-account and transaction charges, compliance services, credit economics, and volume discounts.
    whyItMatters: Sponsor banks and middleware vendors package different layers, so public pages cannot support a reliable total-cost comparison.
    diligencePath: Obtain recent Lead proposals and matched competitor quotes, then normalize three representative customer scenarios.
    relatedQuestionRefs: [QP014]
    relatedTableRefs: [TP002, TP003]
  - type: private-evidence-only
    severity: material
    topic: service-and-program-economics
    missingEvidence: Normalized approval rates, implementation duration, uptime, fraud losses, compliance staffing, service levels, and contribution margin by program.
    whyItMatters: Product checklists do not establish operating quality or whether Lead’s integrated model produces superior risk-adjusted economics.
    diligencePath: Review signed SLAs, incident logs, implementation cohorts, approval funnels, risk outcomes, and program-level contribution margins.
    relatedQuestionRefs: [QP028]
    relatedTableRefs: [TP002, TP004]
  - type: enumeration-incomplete
    severity: material
    topic: competitor-profile-table
    missingEvidence: A complete census of sponsor banks, regional entrants, likely new charter owners, and program-specific alternatives beyond the named reviewed set.
    whyItMatters: The profile matrix is deliberately bounded and may omit niche banks that compete for individual customer programs.
    diligencePath: Reconcile management’s competitor list with recent RFPs, bank-partner databases, and fintech program disclosures.
    relatedTableRefs: [TP001]
