callouts:
- calloutType: strength
  title: Regulated breadth is Lead’s clearest differentiation
  body: Lead combines a bank charter with API-first products across lending, money movement, issuing, and deposits, reducing the number of regulated infrastructure relationships a multi-product fintech may need.
  claimRefs: [CP001, CP002, CP037]
- calloutType: risk
  title: Growth and scale leaders set a demanding benchmark
  body: Column’s reported 219% year-over-year growth and Cross River’s approximately $517 million revenue show that Lead is neither the fastest-growing nor the largest disclosed direct peer.
  claimRefs: [CP008, CP009, CP012, CP038]
- calloutType: insight
  title: Blue Ridge is both removed supply and a warning
  body: Blue Ridge’s BaaS exit reduced one source of sponsor-bank capacity, but the OCC-linked path to that exit raises the compliance threshold for every surviving provider.
  claimRefs: [CP017, CP036]
