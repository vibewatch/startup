- id: TP003
  title: Lead Bank positioning by buyer priority
  columns: [Buyer priority, Lead position, Strongest alternative, Why Lead can win, Why Lead can lose]
  rows:
  - [One regulated API counterparty, Strong, Column or Cross River, Charter plus four product pillars, Peer may offer greater scale or faster growth]
  - [Largest disclosed direct-peer scale, Challenger, Cross River, Modern focused platform and visible fintech access, Cross River has approximately $517 million reported revenue]
  - [Technology-native bank design, Competitive, Column, Broad Lend Move Issue Store scope, Column reports 219% YoY growth]
  - [Existing payments ecosystem distribution, Challenger, Stripe Treasury, Direct regulated relationship can reduce layers, Stripe can bundle into installed developer workflows]
  - [Neutral multi-bank orchestration, Weak, Treasury Prime or Synctera, Direct accountability and potentially fewer dependencies, Middleware can preserve buyer flexibility]
  - [Card processing specialization, Adjacent, Marqeta, Broader banking product set, Specialist may deliver stronger processor economics]
  - [Lending-led fintech program, Strong but concentrated, Cross River or Column, Lending is a core product and major revenue stream, Approximately 68% lending-program revenue raises concentration]
  notes: Positions are qualitative conclusions from public scope, scale, and distribution evidence; they are not win-rate observations.
  claimRefs: [CP007, CP010, CP012, CP015, CP017, CP019, CP020, CP023, CP025, CP026, CP039]
- id: TP004
  title: Moat durability and competitive risk register
  columns: [Moat claim or threat, Evidence, Severity, Competitive implication, Mitigation or diligence ask]
  rows:
  - [Integrated charter and API stack, Lead combines regulated banking with Lend Move Issue and Store, Medium strength, Fewer layers can improve accountability, Test implementation time uptime and program-level service]
  - [Direct-peer scale gap, Cross River reports approximately $517 million revenue versus Lead at $108 million, High threat, Larger peer may absorb compliance and sales costs more effectively, Normalize audited revenue profitability and program count]
  - [Growth gap, Column reports 219% YoY versus Lead at approximately 48%, High threat, Faster peer can gain mindshare and operating leverage, Obtain comparable period definitions and retention cohorts]
  - [Middleware abstraction, Synctera Unit and Treasury Prime own orchestration surfaces, Medium threat, Buyer interface and economics may shift away from sponsor bank, Review channel agreements referrals and data ownership]
  - [Regulatory execution, Blue Ridge exited BaaS after an OCC order, High threat, Supervisory failure can erase the franchise, Review exams consent-order history BSA/AML and third-party controls]
  - [Lending concentration, Partner lending programs are approximately 68% of Lead revenue, High threat, A diversified product story masks concentrated economics, Obtain partner-level revenue credit and renewal schedules]
  notes: Severity reflects strategic exposure rather than probability of regulatory action; private control and cohort evidence is required to confirm durability.
