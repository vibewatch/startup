summary:
  headline: >-
    Track: Lead Bank is one of the few profitable, fast-scaling sponsor banks with genuine marquee-fintech traction and
    a proven operator-CEO, but BaaS regulatory scrutiny, partner concentration, and a premium ~13.6x revenue valuation
    warrant close monitoring rather than an unconditional buy.
