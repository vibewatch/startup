companyProfile:
  summary: Lead Bank is a 1928 Missouri state-chartered, FDIC-insured community bank (FDIC cert 8283) that a Jackie Reses-led group (Luna Parent Inc.) acquired in July 2022 for $56 million and rebuilt as an API-first banking-as-a-service sponsor bank. It sells programmable core banking, money movement, card issuing, and lending to fintech companies, reported $108 million of 2025 net revenue with roughly $31 million of adjusted earnings, and raised a $70 million Series B in September 2025 at a $1.47 billion valuation.
  foundedDate: '1928-01-12'
  founders:
  - name: Jackie Reses
    role: CEO, Chair, and co-founder
    background: Former Square/Block executive (chaired Square Financial Services and ran Square Capital); prior roles at Yahoo, Goldman Sachs, and Apax Partners; board member at Affirm and Nubank.
    claimRefs:
    - CO013
    - CO014
    - CO015
  foundingLocation: Kansas City, Missouri, USA
  headquarters: Kansas City, Missouri, USA
  productSummary: An API-first banking platform organized around four pillars — Lend, Move, Issue, and Store — offering core banking ledgers, ACH/wire/instant payment rails, card issuing, partner lending programs, FDIC-insured deposits, and emerging stablecoin settlement (via the Stripe/Bridge-Visa card platform).
  customerFocus: High-growth fintech companies and embedded-finance platforms needing a regulated bank partner (e.g., BNPL, corporate cards, workforce/gig payments, neobanking, stablecoin cards).
  businessModel: Earns net interest income on partner deposits and lending programs plus non-interest (fee/interchange) income; partner lending programs contribute roughly two-thirds of revenue and non-interest income about 45%.
  stage: Series B
  fundingStatus: Raised a $70 million Series B in September 2025 co-led by Andreessen Horowitz and Khosla Ventures at a $1.47 billion post-money valuation, roughly double the ~$750 million valuation around April 2024.
