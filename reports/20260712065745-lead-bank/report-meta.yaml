  topStrengths:
  - Profitable and fast-growing for a bank — $108M net revenue in 2025 (up ~48% from $73M in 2024) with roughly $31M of adjusted earnings, unusual among BaaS peers.
  - Marquee fintech partners (Affirm, Ramp, Stripe/Bridge-Visa stablecoin cards, Branch, Revolut) validate the platform and provide durable, high-volume programs.
  - A credentialed, aligned operator-CEO in Jackie Reses (ex-Square/Block) who owns ~40% and has assembled top-tier backers (a16z, Khosla, Ribbit, Coatue, ICONIQ, Greycroft).
  - Owning the bank charter (not just middleware) gives deeper control of compliance, economics, and product than non-bank BaaS competitors such as Unit, Synctera, or Treasury Prime.
  topRisks:
  - Heightened BaaS/sponsor-bank regulatory scrutiny (FDIC/OCC third-party guidance); the Blue Ridge consent order and Synapse/Evolve collapses show the sector's tail risk.
  - Partner and revenue concentration — a handful of large fintechs drive volume, and partner switching (e.g., Affirm Card issuing moving to Stride Bank) can dent economics quickly.
  - Credit and operational risk in partner lending programs, which contribute roughly two-thirds of revenue, amid limited public disclosure of loss and reserve detail.
  - A premium ~13.6x net-revenue valuation ($1.47B on $108M) prices in continued rapid, compliant scaling and leaves little cushion if growth or margins slip.
  unresolvedGaps:
  - Audited financial statements, revenue mix, net interest margin, credit losses, and burn/runway detail beyond press figures and FDIC call-report data.
  - Revenue concentration by customer and contract terms (exclusivity, duration, minimums) for the top fintech partners.
  - Post-Series-B cap table, board composition, and liquidation preferences shaping minority-investor outcomes.
  - Depth of compliance/BSA-AML infrastructure and regulatory examination history as programs scale toward multi-billion-dollar volumes.
disclaimer: This report is a public-information diligence snapshot prepared as of 2026-07-12 and is not investment advice. Several underwriting-critical inputs remain undisclosed by Lead Bank and its parent Luna Parent Inc., including audited financials, customer-level revenue concentration, credit-loss detail, and cap-table rights, so any investment decision should be conditioned on direct management diligence and a fuller private data room.
