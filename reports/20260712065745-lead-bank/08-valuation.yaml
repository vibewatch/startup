callouts:
- calloutType: recommendation
  title: Fair-to-stretched, not attractive
  body: Lead’s 13.6x multiple is supportable only near the upper end of private fintech references and leaves limited current-revenue upside under a 15x bull sensitivity.
  claimRefs: [CV004, CV019, CV022, CV030, CV032]
