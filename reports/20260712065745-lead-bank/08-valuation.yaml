  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Fully diluted capitalization, liquidation preferences, anti-dilution terms, board rights, and secondary-sale history.
    whyItMatters: Headline post-money valuation does not establish common-equity value or downside protection without security terms.
    diligencePath: Obtain the capitalization ledger, charter, investor-rights agreements, stock-purchase agreements, and board approvals from company counsel.
    relatedQuestionRefs: [QV030]
    relatedTableRefs: [TV001, TV006]
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited recurring, transaction, lending, and partner-level revenue with gross and contribution margins.
    whyItMatters: A 13.6x revenue multiple is only comparable when recurrence, margin, concentration, and credit sensitivity are understood.
    diligencePath: Request audited statements, revenue-recognition policies, partner cohorts, contract schedules, and margin bridges.
    relatedQuestionRefs: [QV031]
    relatedTableRefs: [TV003, TV005, TV006]
  - type: conflicting-data
    severity: material
    topic: earnings-reconciliation
    missingEvidence: Reconciliation of approximately $31 million of adjusted earnings to approximately $10.5 million of regulatory net income and audited profit.
    whyItMatters: Different earnings definitions produce materially different profitability and valuation conclusions.
    diligencePath: Reconcile management accounts to FDIC call reports and audited financial statements with the CFO and auditor.
    relatedQuestionRefs: [QV032]
    relatedTableRefs: [TV003, TV006]
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set
    missingEvidence: Synchronized valuation, net-debt, regulatory-capital, and revenue vintages for a broader sponsor-bank peer population.
    whyItMatters: The selected comp set mixes public and private instruments and cannot establish a precise clearing multiple.
    diligencePath: Commission a transaction and trading-comps screen with normalized enterprise values and consistent period financials.
    relatedTableRefs: [TV004]
