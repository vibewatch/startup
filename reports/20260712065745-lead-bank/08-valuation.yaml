  - [Confidence, Medium, Financing and revenue markers are corroborated while quality and terms are opaque, Avoid false precision]
  - [Risk rating, High, Partner concentration and sponsor-bank sensitivity can amplify multiple compression, Demand downside protection]
  - [Valuation stance, Fair-to-stretched, 13.6x is within private ranges but above public processors and Mercury, Do not treat the mark as attractive]
  notes: Assessments use the September 2025 post-money valuation and 2025 reported net revenue; they are not a security-specific investment recommendation.
  claimRefs: [CV004, CV019, CV022, CV023, CV024, CV035, CV036, CV037]
- id: TV002
  title: Thesis and anti-thesis table
  columns: [Argument, Evidence-supported read, Counterargument, What changes the view]
  rows:
  - [Regulated platform scarcity, Charter and API infrastructure can support a premium, Compliance obligations can make growth costly, Clean supervisory record and scalable onboarding evidence]
  - [Growth, 2025 net revenue rose approximately 48%, Growth quality is obscured by lending-program concentration, Audited cohort and partner contribution data]
  - [Private-market comparables, 8–15x range can encompass Lead at 13.6x, Mercury at roughly 8x shows a lower credible private benchmark, Superior margins retention and diversification]
  - [Public-market floor, Marqeta provides a liquid processor reference, Its roughly 1.6–3x range makes Lead’s premium substantial, Evidence that bank economics deserve a structurally higher band]
  notes: The table separates reasons a premium may exist from evidence that would prove the premium durable.
  claimRefs: [CV003, CV004, CV006, CV008, CV011, CV017, CV018, CV019, CV020, CV023]
- id: TV003
  title: Valuation methodology and multiples table
  columns: [Method, Input, Result, Interpretation, Limitation]
  rows:
  - [Post-money to net revenue, '$1.47 billion / $108 million', 'Approximately 13.6x', Primary current valuation lens, Net revenue quality is unaudited publicly]
  - [Post-money to adjusted earnings, '$1.47 billion / approximately $31 million', 'Approximately 47.4x', Profitability cross-check, Adjusted earnings are not GAAP or regulatory net income]
  - [Private lower-band revenue method, '$108 million x 8', '$864 million', Bear reference aligned with Mercury multiple, Ignores Lead-specific growth]
  - [Private midpoint revenue method, '$108 million x 11', '$1.188 billion', Base reference inside private range, Holds revenue constant]
  - [Private upper-band revenue method, '$108 million x 15', '$1.62 billion', Bull reference at top of broad range, Requires excellent execution and evidence]
  notes: All calculations use reported 2025 net revenue and simple post-money or enterprise-value proxies; they exclude debt, excess capital, dilution, and preferences.
  claimRefs: [CV002, CV003, CV004, CV007, CV019, CV028, CV029, CV030, CV045]
- id: TV004
  title: Comparable valuation table
  columns: [Comparable, Revenue or operating metric, Valuation or multiple, Relevance, Limitation]
  rows:
  - [Lead Bank, '$108 million 2025 net revenue', '$1.47 billion post-money / approximately 13.6x', Direct entry under review, Private terms and revenue quality are undisclosed]
  - [Mercury, 'Approximately $650 million revenue', '$5.2 billion May 2026 / roughly 8x', Current high-growth private fintech benchmark, Neobank software model differs from a chartered sponsor bank]
  - [Cross River Bank, 'Approximately $517 million revenue', 'Approximately $3 billion in 2022', Sponsor-bank and lending infrastructure reference, Valuation and revenue vintages are not synchronized]
  - [Column, 'Approximately $153 million 2025 revenue', 'Founder-owned with no market valuation', Closest operating-model growth comparison, No observable outside-equity price]
  - [Marqeta, 'Public card-issuing processor revenue base', 'Approximately 1.6–3x EV/revenue', Liquid public processing benchmark, Lacks Lead’s insured-deposit charter and lending model]
  notes: This partial comp set mixes post-money private valuations and public EV/revenue because no single disclosed peer exactly matches Lead’s charter, lending, and API model.
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant disclosed private fintech, sponsor-bank, founder-owned BaaS, and public processing references reviewed through 12 July 2026.
  claimRefs: [CV002, CV003, CV004, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016, CV017, CV018, CV042]
- id: TV005
  title: Bull, base, and bear scenario table
  columns: [Scenario, Multiple assumption, Implied value, Probability signal, Downside trigger]
  rows:
  - [Bull, '15x current net revenue', '$1.62 billion', Growth remains near recent pace with diversified high-quality economics, Evidence fails to support top-band margins or retention]
  - [Base, '11x current net revenue', '$1.188 billion', Strong franchise with ordinary private-market normalization, Partner concentration stays elevated]
  - [Bear, '8x current net revenue', '$864 million', Compression toward Mercury’s approximate multiple, Partner loss credit deterioration or regulatory remediation]
  notes: Scenario values intentionally hold $108 million of 2025 net revenue constant to isolate multiple sensitivity; they are not forecasts and exclude dilution.
  claimRefs: [CV003, CV011, CV019, CV028, CV029, CV030, CV031, CV032, CV033, CV034]
- id: TV006
  title: Final diligence asks and kill triggers
  columns: [Topic, Missing evidence or trigger, Why it matters, Owner or diligence path]
  rows:
  - [Revenue quality, Audited revenue recognition and recurring versus transaction and lending mix, Determines whether 13.6x is comparable to software-like revenue, CFO and auditor data-room review]
  - [Partner concentration, Top-20 revenue deposits origination and contribution margin by partner, Quantifies loss and repricing sensitivity, Commercial and finance cohort review]
  - [Credit economics, Loss allocation reserves vintages and risk-adjusted margin, Tests whether lending revenue warrants a premium, Chief risk officer and loan-file review]
  - [Capital terms, Fully diluted cap table liquidation preferences and anti-dilution rights, Converts headline post-money value into common-equity economics, Company counsel and financing documents]
  - [Regulatory readiness, Exams findings remediation onboarding controls and complaint trends, Determines whether growth can scale without multiple-damaging intervention, Compliance officer and regulatory counsel]
  notes: These asks target the private evidence most likely to move the fair-to-stretched judgment or activate a thesis break.
  claimRefs: [CV023, CV027, CV035, CV038, CV039, CV040, CV041, CV046]
