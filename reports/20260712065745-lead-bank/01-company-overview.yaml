company:
  name: Lead Bank
chapter:
  number: 1
  title: Company Overview
  summary: Lead Bank is a 1928 Missouri state-chartered, FDIC-insured community bank that was acquired by Jackie Reses-led Luna Parent in July 2022 and rebuilt as an API-first sponsor bank. Its September 2025 $70 million Series B at a $1.47 billion valuation followed 2025 net revenue of $108 million, but lending-program concentration, customer concentration, and limited private-company disclosure remain central diligence constraints.
sections:
- id: identity-history-and-scale
  title: Identity, history, and current scale
  body: 'Lead Bank combines two identities that matter for underwriting: a regulated banking charter with roots in Garden City Bank, established in 1928, and a technology-oriented sponsor-bank platform assembled under current ownership. The institution became Lead Bank in 2010, and Luna Parent Inc., a holding company led by Jackie Reses, acquired it in July 2022 for $56 million. Today it is a Missouri state-chartered, FDIC-insured community bank headquartered in Kansas City, with FDIC certificate 8283 and locations in Kansas City, Lee’s Summit, and the Crossroads district. The charter is not merely branding; it gives Lead direct access to insured deposits and regulated banking rails while imposing prudential, consumer-protection, and third-party oversight obligations. Latest 2026 regulatory figures place assets at approximately $2.68 billion and deposits near $2.4 billion. That scale is substantial relative to the acquisition base, but it should not be confused with technology-platform revenue or profitability. The snapshot therefore separates bank balance-sheet measures from operating revenue, valuation, and capital raised.'
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO031, CO032, CO033]
  tableRefs: [TO001]
  figureRefs: [FO003]
- id: leadership-governance-and-capital
  title: Leadership, governance, and capital formation
  body: 'Jackie Reses is the public center of gravity: CEO, chair, co-founder, and an approximately 40% shareholder. Her operating history spans Square and Block, where she led Square Capital and chaired Square Financial Services, as well as Yahoo, Goldman Sachs, and Apax Partners. Board roles at Affirm and Nubank add relevant lending and digital-bank perspective. The same concentration creates key-person and governance risk because a complete current cap table, board-rights schedule, and succession plan are not publicly available. Capital formation has nonetheless been strong. Lead closed a $70 million Series B in September 2025, co-led by Andreessen Horowitz and Khosla Ventures, with ICONIQ and Greycroft joining Ribbit Capital, Coatue, and Zeev Ventures. The disclosed $1.47 billion post-money valuation roughly doubled the approximately $750 million valuation reported around the April 2024 raise. Treating the $56 million acquisition financing and $70 million Series B as disclosed capital yields $126 million, but that is not a fully audited lifetime-funding ledger and should not be interpreted as equity proceeds available to the operating bank today.'
  claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027]
  tableRefs: [TO002]
- id: operating-model-and-partner-ecosystem
  title: BaaS operating model and partner ecosystem
  body: 'Lead sells regulated banking infrastructure to fintech and enterprise platforms rather than operating only as a conventional branch bank. Its public product architecture groups capabilities into Lend, Move, Issue, and Store, delivered through REST/JSON APIs with OAuth2 controls. In practical terms, a fintech integrates with Lead’s API layer; Lead then connects the program to deposits, payments, card networks, or lending rails while retaining regulated-bank responsibilities. Named relationships illustrate the breadth of the model: Affirm uses Lead in loan origination, Ramp uses Lead for banking infrastructure and stablecoin-card settlement, Stripe and Visa selected Lead for a stablecoin-linked card platform, Branch added Lead for workforce payments, and Revolut uses Lead for US banking and card issuance. This diversity is strategically valuable because it allows one regulated balance sheet and compliance stack to support multiple use cases. It also increases operational complexity and creates correlated counterparty, compliance, and credit exposure. Public logos confirm market access, but they do not disclose contract economics, concentration by partner, loss-sharing terms, or the cost of servicing each program.'
  claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO034, CO035, CO036, CO037, CO038, CO041]
  tableRefs: [TO003]
  figureRefs: [FO002]
- id: traction-milestones-and-diligence-posture
  title: Traction, milestones, and diligence posture
  body: 'The public chronology shows a rapid transformation after the 2022 acquisition. Lead moved from a long-lived community-bank base into a high-growth fintech infrastructure strategy, added visible partners, achieved a reported $108 million of 2025 net revenue versus $73 million in 2024, and raised at a unicorn valuation. That revenue comparison implies approximately 48% year-over-year growth. Recognition on CNBC’s 2025 Disruptor 50 and membership in the American Fintech Council in June 2026 reinforce ecosystem credibility, but neither substitutes for audited economics. The most important counterweight is revenue quality: public reporting indicates partner lending programs generate about two-thirds, or roughly 68%, of revenue. Sacra’s adverse comparison with Column highlights the resulting dependence on a limited set of lending relationships and the risk that partner migration, credit losses, or regulatory intervention could affect multiple income streams at once. Investors should reconcile management revenue with call-report income, obtain program-level concentration and unit economics, and distinguish the approximately $10.5 million of regulatory net income from the separately reported approximately $31 million of adjusted earnings before relying on profitability claims.'
  claimRefs: [CO021, CO025, CO028, CO029, CO030, CO039, CO040, CO041, CO042]
  tableRefs: [TO004]
  figureRefs: [FO001]
