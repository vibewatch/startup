  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: A fully diluted cap table, preference stack, board-rights schedule, secondary history, and current succession plan.
    whyItMatters: Ownership and control concentration determine governance leverage, dilution exposure, and resilience beyond the founder-CEO.
    diligencePath: Request the capitalization ledger, financing documents, board observer agreements, and succession materials from management and counsel.
    relatedQuestionRefs: [QO026]
    relatedTableRefs: [TO002, TO003]
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Partner-level shares of revenue, deposits, loan originations, credit losses, and contribution margin.
    whyItMatters: Public evidence indicates lending concentration but cannot quantify the impact of losing or repricing any major program.
    diligencePath: Obtain the top-20 partner cohort, program contracts, concentration dashboard, loss vintages, and renewal calendar.
    relatedQuestionRefs: [QO027]
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited financial statements reconciling $108 million of 2025 net revenue and approximately $31 million of adjusted earnings to call-report measures.
    whyItMatters: Regulatory net income and adjusted earnings are different metrics, and valuation depends on recurring, attributable, audited economics.
    diligencePath: Request audited statements, the management-to-GAAP bridge, call-report reconciliation, and segment-level revenue recognition policy.
    relatedQuestionRefs: [QO028]
  - type: enumeration-incomplete
    severity: material
    topic: milestone-and-leadership-coverage
    missingEvidence: Complete executive, board, investor-rights, and internal milestone records beyond publicly announced events.
    whyItMatters: Public enumeration can identify named actors and dated events but cannot establish that the lists are complete.
    diligencePath: Review board minutes, organization charts, financing schedules, and the internal corporate event ledger.
    relatedTableRefs: [TO002, TO003, TO004]
