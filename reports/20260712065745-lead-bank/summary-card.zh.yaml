  topStrengths:
    - 作为银行，Lead Bank 已经盈利且增速快——2025 年净收入 $108M（较 2024 年 $73M 增长约 48%），调整后收益约 $31M，在 BaaS 同行里少见。
    - Affirm、Ramp、Stripe/Bridge-Visa 稳定币卡、Branch、Revolut 等头部 fintech 合作伙伴验证了平台，也带来高交易量、持续性强的项目。
    - Jackie Reses（前 Square/Block）是有履历、利益绑定深的运营型 CEO，持股约 40%，并拉来了 a16z、Khosla、Ribbit、Coatue、ICONIQ、Greycroft 等一线投资方。
    - Lead Bank 自己持有银行牌照，而不只是做中间件；相比 Unit、Synctera、Treasury Prime 等非银行 BaaS 竞品，它对合规、经济性和产品有更深控制。
  topRisks:
    - BaaS / sponsor-bank 监管审查升温（FDIC/OCC 第三方指引）；Blue Ridge 同意令以及 Synapse/Evolve 崩塌，已经暴露这个板块的尾部风险。
    - 合作方与收入集中度高——少数大型 fintech 撑起交易量，合作方切换（例如 Affirm Card 发卡迁至 Stride Bank）会很快打到经济性。
    - 合作方贷款项目贡献约三分之二收入，但亏损和准备金细节披露有限，信用风险与运营风险仍需盯紧。
    - 约 13.6x 净收入估值（$108M 收入对应 $1.47B 估值）已经计入持续快速、合规扩张；一旦增长或利润率滑坡，缓冲很薄。
  unresolvedGaps:
    - 审计财务报表、收入结构、净息差、信用损失，以及新闻稿数字和 FDIC Call Report 数据之外的烧钱速度 / 现金跑道细节。
    - 头部 fintech 合作伙伴的客户收入集中度和合同条款（排他性、期限、最低量）。
    - Series B 后股权结构表、董事会构成，以及影响少数股东回报的清算优先权。
    - 项目规模迈向数十亿美元时，合规 / BSA-AML 基础设施的深度和监管检查历史。
