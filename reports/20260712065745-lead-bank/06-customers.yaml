  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-by-customer
    missingEvidence: Customer-level revenue, gross profit, contribution margin, deposits, transaction volume, loan originations, and credit losses by program.
    whyItMatters: A roughly 68% partner-lending revenue share cannot reveal whether one or two fintech relationships dominate enterprise value.
    diligencePath: Obtain the top-20 customer concentration schedule, product-level revenue bridge, monthly program economics, and counterparty exposure dashboard.
    relatedQuestionRefs: [QU023]
    relatedTableRefs: [TU003, TU004, TU006]
  - type: private-evidence-only
    severity: blocking
    topic: contract-terms
    missingEvidence: Contract start and end dates, renewal mechanics, pricing, exclusivity, minimums, termination rights, migration assistance, and loss-sharing terms.
    whyItMatters: The Affirm Card switch shows that a program role can migrate, while public logos do not establish contractual durability or switching protection.
    diligencePath: Review all material customer agreements, amendments, renewal calendars, termination notices, and current product-by-product bank-role maps.
    relatedQuestionRefs: [QU024]
    relatedTableRefs: [TU003, TU006]
  - type: private-evidence-only
    severity: blocking
    topic: churn-and-retention
    missingEvidence: Logo churn, revenue churn, NRR, GRR, cohort retention, expansion, contraction, satisfaction, and implementation success by customer vintage.
    whyItMatters: Named launches demonstrate adoption but cannot establish repeat usage, renewal quality, or durable expansion without longitudinal cohorts.
    diligencePath: Request quarterly customer cohorts, cancelled-program postmortems, renewal outcomes, reference calls, satisfaction data, and implementation scorecards.
    relatedQuestionRefs: [QU025]
    relatedTableRefs: [TU005, TU006]
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-and-use-case-enumeration
    missingEvidence: A complete current customer roster with every program, geography, status, launch date, product role, and production volume.
    whyItMatters: The public source pack supports five important examples but cannot establish exhaustive customer or use-case coverage.
    diligencePath: Reconcile management's full customer roster to contracts, regulatory program inventories, active accounts, and program-level general-ledger entries.
    relatedTableRefs: [TU003, TU004]
