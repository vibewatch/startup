schemaVersion: report-v2
artifact: customers
slug: lead-bank
runDate: '2026-07-12'
company:
  name: Lead Bank
chapter:
  number: 6
  title: Customers
  summary: Lead Bank has unusually visible production relationships for a private sponsor bank, spanning Affirm, Ramp, Stripe and Bridge with Visa, Branch, and Revolut. The roster validates lending, deposits, settlement, issuing, and workforce-payment use cases, but partner lending programs generate roughly 68% of revenue and Affirm Card's 2025 move to Stride Bank demonstrates that individual program roles can migrate.
sections:
- id: customer-segments-and-buying-structure
  title: Customer segments, buyers, users, and payers
  body: >-
    Lead Bank primarily serves fintech platforms that need regulated banking capabilities embedded inside their own customer experiences. The buyer is typically a fintech executive, treasury or payments leader, card-program owner, or lending-program leader; end users are the fintech customer, cardholder, borrower, business, or worker; and the fintech partner generally pays Lead through program economics rather than a visible retail subscription. Public examples span consumer credit through Affirm, corporate banking and cards through Ramp, global stablecoin-linked cards through Stripe and Bridge with Visa, gig-workforce payments through Branch, and US banking and card issuance through Revolut. This is a relatively concentrated institutional customer model: each integration can carry meaningful deposits, transaction volume, card activity, or loan originations. The breadth of use cases lowers dependence on one product surface, but the small named roster and bespoke regulated integrations mean each large relationship can still matter disproportionately. Public evidence supports segment and workflow identification more strongly than customer count, revenue band, or geography by account.
  claimRefs: [CU001, CU002, CU003, CU004, CU005, CU008, CU011, CU014, CU018, CU020]
  tableRefs: [TU001, TU004]
  figureRefs: [FU002]
- id: named-customer-and-partner-proof
  title: Named customer and partner proof
  body: >-
    The named relationships are stronger than logo-only marketing because the reviewed announcements identify concrete banking roles. Affirm uses Lead as a bank partner for BNPL loan origination, while Ramp-related materials identify banking infrastructure and settlement support for stablecoin-backed corporate cards. Visa and Bridge materials place Lead in a stablecoin-linked card platform with on-chain settlement, and Branch identifies Lead as a sponsor bank and card issuer for workforce payments. Revolut separately identifies Lead as its US banking and card-issuing partner from November 2024. These are production-oriented program descriptions rather than disclosed pilots, although public sources do not provide contract start-to-renewal histories, transaction volumes, or revenue contribution. Evidence quality varies: customer-issued and partner-issued announcements are direct and named, while several independent articles corroborate the program descriptions. The strongest conclusion is therefore that Lead has won credible regulated infrastructure roles with major fintech brands, not that every relationship is equally large, exclusive, profitable, or durable.
  claimRefs: [CU005, CU006, CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU018, CU019]
  tableRefs: [TU002, TU003]
  figureRefs: [FU001]
- id: adoption-trajectory-and-expansion
  title: Adoption trajectory and expansion surfaces
  body: >-
    The public chronology indicates adoption across adjacent product surfaces rather than a disclosed customer-count curve. Revolut's US relationship began in November 2024, the Stripe and Visa stablecoin-linked platform selection followed in April 2025, Ramp and Stripe announced stablecoin-backed corporate cards in May 2025, and Branch added Lead in July 2025. This sequence suggests that Lead can expand by winning new fintech programs and by attaching more regulated functions to existing ecosystems. The stablecoin platform offers the clearest geographic trajectory: public materials describe availability in 18 countries and a plan to exceed 100 countries by the end of 2026. That is a platform rollout target, not a count of Lead customers or active cardholders, and should not be treated as retention evidence. Relationship depth can increase through deposits, settlement, issuing, payments, and lending, but public reporting does not quantify cross-sell, implementation time, active accounts, utilization, or repeat purchase. Adoption is visible through named launches; usage intensity remains private.
  claimRefs: [CU021, CU022, CU023, CU024, CU025, CU026, CU027, CU028, CU038]
  figureRefs: [FU003]
- id: durability-retention-and-switching
  title: Durability, retention, and switching risk
  body: >-
    Sponsor-bank relationships can become operationally sticky because changing the regulated institution may require card, account, compliance, settlement, and customer-communication work. Public evidence nevertheless shows that roles can move. In April 2025, Affirm and Stride Bank announced that Stride would become the issuing partner for Affirm Card's debit program. That change does not establish that Lead lost Affirm's separate BNPL loan-origination role, and the two roles should not be conflated. It does demonstrate program-level switching and competitive bank selection within a major fintech relationship. No public NRR, GRR, churn, renewal rate, contract length, satisfaction score, or cohort data were found in the supplied evidence. Accordingly, named production programs support adoption quality but do not prove contractual durability. Investors need renewal calendars, termination rights, implementation histories, and program-level economics to distinguish deeply embedded multi-product relationships from replaceable single-program mandates. The Affirm example should be treated as a concrete warning against assuming that a prominent customer logo implies exclusivity across all banking products.
  claimRefs: [CU005, CU006, CU007, CU030, CU031, CU032, CU033, CU034, CU035]
  tableRefs: [TU005]
- id: concentration-and-investment-implications
  title: Expansion, concentration, and diligence implications
  body: >-
    The central customer-quality tension is strong brand validation versus opaque economic concentration. Partner lending programs account for approximately two-thirds, or roughly 68%, of Lead Bank revenue, so customer and product concentration can transmit directly into revenue even when the visible roster spans several use cases. Lead reported $108 million of 2025 net revenue, but the supplied public evidence does not allocate that amount by customer, program, product pillar, geography, or contract. A few large fintechs may therefore drive substantial loan originations, deposits, interchange, and fee income. The adverse Sacra comparison reinforces the concern that Lead is more exposed to partner lending economics than a more software-heavy infrastructure model. Expansion through stablecoin cards, workforce payments, and international fintech relationships could diversify future economics, but announced reach is not the same as realized revenue diversification. Underwriting should require a top-customer concentration schedule, program contribution margins, credit and loss-sharing terms, contract renewal dates, and churn history before assigning durable value to the customer base.
  claimRefs: [CU029, CU030, CU033, CU034, CU035, CU036, CU037, CU041, CU042]
  tableRefs: [TU006]
