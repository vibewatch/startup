callouts:
- calloutType: strength
  title: Multi-rail production proof
  body: Five named fintech ecosystems publicly connect Lead to lending, deposits, settlement, issuing, or workforce-payment workflows.
  claimRefs: [CU005, CU008, CU011, CU014, CU018]
- calloutType: risk
  title: Program roles can migrate
  body: Affirm Card's debit issuing mandate moved to Stride Bank in 2025, showing that a major logo does not guarantee durable ownership of every banking role.
  claimRefs: [CU006, CU007, CU033]
- calloutType: recommendation
  title: Underwrite concentration from private data
  body: Require customer-level revenue, contribution margin, contract, churn, and loss-sharing schedules before treating the named roster as diversified recurring revenue.
  claimRefs: [CU029, CU030, CU034, CU035, CU036, CU037]
