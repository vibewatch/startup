- id: growth-drivers-and-adoption
  title: Growth drivers, adoption path, and valuation relevance
  body: 'Three forces support category growth. First, fintechs and software platforms continue to seek regulated capabilities without building or acquiring a bank. Second, embedded-finance distribution moves payments, credit, cards, and accounts into nonbank workflows, expanding the number of programs that need regulated infrastructure. Third, modern API delivery can reduce integration friction relative to bespoke bank connectivity. Lead’s positioning is aligned with those forces because it combines sponsor-bank responsibility with API-delivered Lend, Move, Issue, and Store products. The investment implication is not that all embedded-finance volume becomes Lead revenue; capture depends on program wins, pricing, credit allocation, and retention. Lead’s September 2025 $70 million Series B at a $1.47 billion post-money valuation shows that investors assigned substantial value to this positioning, but it does not prove market share. A useful adoption model therefore separates category expansion
    from company capture: demand can grow while economics remain concentrated among a few large programs, and transaction growth can outpace infrastructure revenue if pricing compresses or customers multi-bank.'
