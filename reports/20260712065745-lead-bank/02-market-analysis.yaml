  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-methodology
    missingEvidence: Comparable publisher definitions, geographies, base years, forecast periods, and underlying revenue pools for the roughly $10–60 billion range.
    whyItMatters: Without normalized definitions, a precise TAM or market-share calculation would create false valuation confidence.
    diligencePath: Obtain full market-study methodologies and rebuild each estimate on a common 2026 geography and service boundary.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM001
    - TM002
  - type: private-evidence-only
    severity: blocking
    topic: lead-som-and-segment-economics
    missingEvidence: Lead’s qualified pipeline, win rates, revenue, take rate, contribution margin, and retention by Lend, Move, Issue, and Store.
    whyItMatters: Company-level capture and valuation cannot be derived from a broad market CAGR without segment economics.
    diligencePath: Request CRM cohorts, signed-program schedules, audited segment reporting, pricing, churn, and contribution-margin bridges.
    relatedQuestionRefs:
    - QM026
    - QM027
    relatedTableRefs:
    - TM003
    - TM004
  - type: private-evidence-only
    severity: material
    topic: regulatory-cost
    missingEvidence: Program-level compliance staffing, examination findings, remediation costs, loss allocation, and capital consumption.
    whyItMatters: Regulatory and credit intensity may offset category growth and materially change segment profitability.
    diligencePath: Review regulatory correspondence, program risk assessments, staffing allocations, capital models, and loss-sharing agreements.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM005
  - type: enumeration-incomplete
    severity: minor
    topic: market-segment-enumeration
    missingEvidence: A complete census of every BaaS subsegment, buyer configuration, and adoption driver across geographies.
    whyItMatters: The tables are representative analytical maps and should not be read as exhaustive market taxonomies.
    diligencePath: Commission a customer and prospect survey and reconcile it with full analyst taxonomies and internal pipeline coding.
    relatedTableRefs:
    - TM001
    - TM002
    - TM003
    - TM004
    - TM005
