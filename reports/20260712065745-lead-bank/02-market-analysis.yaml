chapter:
  number: 2
  title: Market Analysis
  summary: Lead Bank operates in the sponsor-bank/API layer of a BaaS market estimated at approximately $28–34 billion in 2026 and growing at roughly 17.8% CAGR, inside a much larger embedded-finance context. The opportunity is substantial but estimate definitions vary widely, while regulatory accountability, switching friction, capital intensity, and customer concentration constrain company-level capture.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing discipline
  body: 'For underwriting, the relevant market is banking-as-a-service (BaaS): regulated banking capabilities delivered through APIs or program infrastructure to fintech and nonbank distributors. Included spend covers sponsor-bank access, core account infrastructure, payments and money movement, card issuing, deposit programs, and lending enablement. It excludes consumer transaction value itself, standalone financial-app front ends, and a bank’s own balance sheet; those are demand or operating contexts rather than vendor revenue pools. Status-quo substitutes include direct integrations with conventional banks, internal compliance and ledger builds, and middleware layered over another sponsor bank. This boundary places Lead Bank in the sponsor-bank and API-banking layer, where its charter and Lend, Move, Issue, and Store capabilities connect fintech distribution to regulated rails. Public 2026 estimates cluster around $28–34 billion and approximately 17.8% CAGR, but the reviewed range extends
    from roughly $10 billion to $60 billion as publishers vary geography, included services, and forecast years. The range is decision-useful only when preserved rather than collapsed into false precision.'
