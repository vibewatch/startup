  - id: TV001
    title: Recommendation Summary and Strategic Posture
    columns:
      - Decision Metric
      - Current Evaluation
      - Supporting Evidence
      - Investment Implication
    rows:
      - - Recommendation
        - track
        - >-
          Overture program remains pre-revenue with entry-into-service targeted for 2029-2030, leaving commercial
          execution unproven.
        - Withhold expansion capital; monitor delivery milestones and customer conversion.
      - - Confidence
        - medium
        - >-
          Independent flight demonstration on XB-1 validates aerodynamics, but $6B-$8B total program capital
          requirements remain heavily dependent on unproven external financing.
        - Requires verification of commercial deposit terms and private capital commitments.
      - - Risk Rating
        - high
        - >-
          Capital-intensive clean-sheet aircraft and custom Symphony engine development face major execution, technical,
          and regulatory hurdles.
        - Cap exposure to speculative allocation; maintain tight stop-loss triggers on development delays.
      - - Valuation Stance
        - stretched
        - >-
          December 2025 Series B post-money valuation reached $1.5B ($901M total raised) against zero commercial revenue
          and high development burn.
        - Current valuation prices in seamless execution; public aerospace comps trade at 1.7x-2.5x revenue.
    notes: >-
      Evaluation synthesized from December 2025 financing terms, XB-1 flight test results, and comparative aerospace
      manufacturing benchmarks.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV015
  - id: TV002
    title: Thesis and Anti-Thesis Balance Matrix
    columns:
      - Position
      - Core Argument
      - Evidence Anchor
      - Disconfirming Pivot Trigger
    rows:
      - - Thesis
        - >-
          Unprecedented commercial appetite with 130+ aircraft orders and pre-orders from tier-one global airlines
          seeking fleet speed differentiation.
        - >-
          United Airlines, American Airlines, and Japan Airlines have placed 130+ orders and options with non-refundable
          deposit commitments.
        - Cancellation or refund demands from United or American Airlines reducing backlog below 50 firm aircraft.
      - - Thesis
        - >-
          Technological de-risking achieved through successful January 2025 supersonic flight of the XB-1 demonstrator
          at Mach 1.122.
        - >-
          XB-1 achieved human-piloted supersonic flight at Mach 1.122, validating composite aerostructures and digital
          flight control architecture.
        - >-
          Failure of the Symphony engine core rig tests or inability to demonstrate passive cooling and supersonic
          intake efficiency.
      - - Anti-Thesis
        - >-
          Massive capital expenditure gap between $901M cumulative raised capital and the $6B to $8B required for full
          Overture type certification.
        - >-
          Company estimates indicate $6B-$8B needed to achieve commercial market entry, while only $901M has been
          secured across 13 rounds.
        - >-
          Securing non-dilutive government project financing or sovereign co-development funding covering at least 50%
          of the remaining capital requirement.
      - - Anti-Thesis
        - >-
          Severe propulsion dependency and independent engine development risk following historical withdrawals by
          legacy engine OEMs.
        - >-
          Rolls-Royce ended its preliminary study in September 2022 and major commercial engine suppliers declined
          development, forcing in-house Symphony program.
        - >-
          Demonstrated successful static test and endurance milestone of full-scale Symphony core by Florida Turbine
          Technologies and StandardAero.
    notes: >-
      Pivots reflect observable operating, regulatory, or financing events that would trigger a rating upgrade or thesis
      breach.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: Scenario Valuation and Downside Distribution
    columns:
      - Scenario
      - Probability
      - Core Operating Assumptions
      - Valuation / Capital Logic
      - Downside Risk & Kill Triggers
    rows:
      - - Bull Case
        - 20%
        - >-
          Symphony core operational on schedule; Greensboro Superfactory reaches initial rate; FAA type certification
          achieved by 2030; 130 pre-orders convert to firm deliveries at ~$200M per hull.
        - >-
          $3.5B - $5.0B enterprise valuation supported by airline pre-delivery progress payments and commercial delivery
          backlog exceeding $20B.
        - Engine certification delay beyond 2031 or regulatory denial of overland boomless cruise corridors.
      - - Base Case
        - 50%
        - >-
          Overture certification delayed by 24-36 months into 2032-2033; capital requirement escalates toward $8B-$10B;
          secondary and strategic equity rounds required at flat-to-modest step-ups.
        - >-
          $1.2B - $1.8B valuation range reflecting substantial preference overhang, heavy equity dilution (~20-25% per
          round), and prolonged cash burn.
        - Failure to secure follow-on equity tranche or debt facility within 18 months of current cash depletion.
      - - Bear Case
        - 30%
        - >-
          Symphony development cost overruns force program redesign; airline customers cancel pre-order options under
          material delay clauses; capital markets close to pre-revenue aviation.
        - >-
          Sub-$400M liquidation or distressed restructuring; severe equity impairment resembling historical commercial
          supersonic failures such as Aerion Supersonic.
        - Withdrawal of lead carrier deposits or termination of Piedmont Triad Superfactory assembly operations.
    notes: >-
      Scenarios model potential outcomes through 2030 commercial entry window based on capital consumption rates and
      aerospace cycle dynamics.
    claimRefs:
      - CV003
      - CV010
      - CV011
      - CV012
      - CV013
