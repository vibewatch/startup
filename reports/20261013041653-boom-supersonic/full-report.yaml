chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Product Scope, and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic was founded in 2014 by software engineer and entrepreneur Blake Scholl and maintains
              corporate headquarters in Denver, Colorado. The enterprise is focused on reviving civil supersonic
              passenger transportation following the 2003 retirement of Concorde, positioning speed as a mainstream
              airline service rather than a high-cost government prestige asset. Its flagship commercial platform is
              Overture, a four-engine airliner designed to cruise at Mach 1.7 at an altitude of 60,000 feet with seating
              for 65 to 80 passengers in an all-premium cabin configuration. Boom's revenue model relies on selling
              commercial aircraft to major international carriers, having accumulated an announced order book of 130
              aircraft across firm orders and pre-orders from American Airlines, United Airlines, and Japan Airlines.
              The company operates as a private venture, with secondary market transactions valuing the business at a
              reported $1.5 billion following a major corporate financing round in late 2025.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Executive Leadership, Functional Execution, and Governance Exposure
        blocks:
          - type: paragraph
            body: >-
              The strategic trajectory of Boom Supersonic remains tightly coupled to founder and Chief Executive Officer
              Blake Scholl, who established the company after building mobile e-commerce technology and funding early
              aerospace conceptual studies from personal savings. Commercial airline relationships, regulatory strategy,
              and state economic partnership negotiations are directed by President and Chief Business Officer Kathy
              Savitt, a former corporate officer at Yahoo and Amazon who spearheaded the state incentive campaigns for
              Boom's production facilities. Flight test operations and experimental vehicle envelope expansion are led
              by Chief Test Pilot Tristan Brandenburg, a former naval test aviator who piloted the company's subscale
              demonstrator aircraft through supersonic corridor testing in early 2025. While executive leadership
              demonstrates strong commercial negotiation and experimental flight execution, independent corporate
              governance and formalized board oversight structures remain largely undisclosed in public documentation,
              presenting material key-person dependence on Scholl for capital allocation, technical pacing, and partner
              alignment.
            claimRefs:
              - CO003
              - CO004
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO009
      - number: '1.3'
        title: Development Progression, Flight Envelope Expansion, and Production Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic has systematically transitioned from computational fluid dynamics design into physical
              flight hardware validation and industrial manufacturing scale. Between 2016 and 2022, engineering teams
              evaluated 51 aerodynamic iterations and completed 26 million software core-hours, refining Overture from
              an initial trijet concept into a four-engine configuration featuring proprietary gull wings, contoured
              area-ruled fuselage shaping, and carbon composite airframes. In January 2022, Boom selected Piedmont Triad
              International Airport in Greensboro, North Carolina as the site for its primary manufacturing facility,
              securing more than $121 million in state and municipal incentives that included $107 million in
              specialized roadway and utility expansions. Construction of the Overture Superfactory finished in
              mid-2024, creating an assembly complex engineered to scale toward an annual production volume of 66
              supersonic aircraft. Flight aerodynamics and control systems were empirically validated by the subscale
              XB-1 demonstrator, which completed 11 piloted sorties before reaching Mach 1.122 at 35,290 feet over the
              Mojave Air & Space Port in January 2025.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO008
              - CO009
              - CO010
              - CO015
      - number: '1.4'
        title: Capital Requirements, Propulsion Partnerships, and Technical Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Bringing a civil supersonic airliner through federal airworthiness certification and serial delivery
              requires extraordinary capital resources and propulsion infrastructure. External aerospace engineering
              assessments indicate that full development of Overture will require between $6 billion and $8 billion in
              total investment, creating substantial financing hurdles against historical equity announcements that
              stood at approximately $270 million prior to recent expansion. In December 2025, Boom announced $300
              million in fresh capital alongside a commercial initiative to deploy Superpower natural gas turbines for
              artificial intelligence data centers, leveraging a shared core architecture to bridge near-term cash flow
              while informing propulsion reliability. This proprietary engine strategy became mandatory after
              established turbofan manufacturers, including Rolls-Royce, Safran, Honeywell, and CFM, publicly declined
              to develop bespoke commercial supersonic powerplants. Consequently, Boom formed an unconventional
              propulsion alliance with Florida Turbine Technologies for turbomachinery design and StandardAero for
              engine assembly at a 100,000-square-foot facility in San Antonio, Texas, making propulsion execution the
              critical bottleneck to commercial service.
            claimRefs:
              - CO005
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO011
              - CO012
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Propulsion Architecture Commercialization via Industrial Turbine Core
            body: >-
              Boom's December 2025 expansion into Superpower natural gas turbines for AI data centers represents an
              opportunistic technical bridge. By utilizing a shared turbomachinery core across both industrial power
              generation and the Symphony aircraft engine, Boom seeks to accumulate operating hours, prove component
              reliability, and generate near-term revenue years before Overture achieves commercial type certification.
            calloutType: insight
            claimRefs:
              - CO005
              - CO011
          - type: callout
            title: Capital Intensity and Self-Funded Engine Development Constraints
            body: >-
              Industry estimates indicate that certifying and manufacturing a commercial supersonic jet requires $6
              billion to $8 billion in cumulative funding. Following public refusals from established engine giants
              including Rolls-Royce and Safran to engineer civil supersonic powerplants, Boom carries the sole financial
              and engineering responsibility for Symphony, creating an acute multi-billion-dollar capital requirement
              that heavily dilutes current equity holders.
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Airline Demand, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Commercial supersonic passenger aviation occupies a specialized high-speed frontier within
              intercontinental civil air transport. The commercial boundary focuses on long-haul premium passengers
              traveling on high-yield transoceanic city pairs between major international hubs such as New York, London,
              Tokyo, and San Francisco. Spend included within this boundary comprises airline commercial airframe
              procurement, dedicated supersonic engine maintenance and overhaul contracts, and passenger ticket revenues
              on intercontinental corridors where flight time can be cut roughly in half. Excluded from this commercial
              air transport perimeter are subsonic narrowbody passenger aircraft, domestic overland short-haul routes
              where speed advantages are nullified by climb-and-descent cycles and overland regulatory restrictions,
              military and defense-specific supersonic platforms, and private supersonic business jets. The primary
              status-quo substitutes are modern widebody subsonic airliners offering lie-flat premium cabins, such as
              the Boeing 787 and Airbus A350, as well as ultra-long-range dedicated corporate jets like the Gulfstream
              G700 and Bombardier Global 7500.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM009
              - CM010
      - number: '2.2'
        title: Market Sizing Lenses, Fleet Projections, and Route Capacity
        blocks:
          - type: paragraph
            body: >-
              Evaluating market scale requires triangulating between global premium airline passenger capacity, airline
              commercial fleet replacement and expansion spending, and near-term manufacturer delivery capacity. Global
              intercontinental premium passenger spending constitutes the broad total addressable market (TAM),
              representing annual spending exceeding $40 billion across international business- and first-class routes.
              The serviceable addressable market (SAM) is bounded by the operational radius and acoustic corridor of the
              aircraft, encompassing approximately 600 identified profitable transoceanic city pairs capable of
              supporting Mach 1.7 operations within a 4,250 nautical mile full-payload range. Finally, the serviceable
              obtainable market (SOM) is constrained by manufacturing throughput and capital availability: Boom
              completed its initial Overture Superfactory in Greensboro, North Carolina, designed to scale to an annual
              production rate of 33 to 66 aircraft per year, with 130 non-binding orders and pre-orders currently
              secured across United Airlines, American Airlines, and Japan Airlines.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM011
          - type: figure
