      - number: '2.3'
        title: Buyer Segmentation, Fleet Procurement Workflow, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The adoption and purchasing path for supersonic commercial airframes is governed by commercial airline
              fleet planning and capital allocation departments. Tier-one network carriers, represented by United
              Airlines, American Airlines, and Japan Airlines, evaluate Overture as a premium flagship asset designed to
              capture high-margin corporate travelers and elite loyalty members on transatlantic and transpacific trunk
              routes. Fleet procurement workflows require multi-year evaluations, beginning with letters of intent and
              conditional pre-orders, followed by technical evaluation of engine performance, operating costs, and type
              certification milestones before committing firm non-refundable delivery deposits. In parallel, secondary
              and specialized buyer segments include defense and government VIP transport agencies, where Boom partners
              with Northrop Grumman to evaluate government mission variants, as well as industrial power generation
              customers purchasing derivative Superpower turbines.
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: Macro Growth Drivers, Technological Execution, and Regulatory Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Adoption of commercial supersonic flight is driven by persistent corporate willingness to pay for travel
              time reduction, premium airline capacity yield expansion, and modern digital aerodynamic simulation
              enabling airframes to cruise at Mach 1.7 without fuel-guzzling afterburners. However, the commercial
              market faces formidable structural constraints. Overland supersonic operations remain restricted under
              long-standing acoustic regulations dating back to 1973; while a June 2025 executive order instructed the
              FAA to establish acoustic standards, commercial viability over land remains contingent on unverified
              'boomless cruise' atmospheric refraction technologies. Furthermore, Overture requires 100% sustainable
              aviation fuel (SAF) to satisfy environmental compliance targets amidst a severe global SAF supply deficit,
              and the simultaneous development and FAA type certification of the bespoke Symphony turbofan engine
              introduces substantial multi-year schedule risk.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Certification Schedule and Order Book Vulnerability
            body: >-
              Boom's 130 airline pre-orders across United Airlines, American Airlines, and Japan Airlines represent
              conditional delivery reservations rather than firm purchase contracts. Independent aerospace assessments
              from Forecast International note that simultaneous clean-sheet certification of an airframe and a bespoke
              in-house engine has never been accomplished in a three-year timeframe, creating significant schedule slip
              risk into the 2030s that leaves non-binding airline commitments vulnerable to deferral or cancellation.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM011
          - type: callout
            title: Superpower Turbine Serves as an Industrial Bridge and Manufacturing Hedge
            body: >-
              By packaging the Symphony engine core into the Superpower industrial turbine for AI data centers and
              securing a 1.21 GW commercial commitment from Baker Hughes for deliveries beginning in mid-2026, Boom
              creates a near-term revenue stream and shared manufacturing scale that hedges against commercial aviation
              certification delays.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Peers and Historical Supersonic Precedents
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic operates in an extraordinary competitive vacuum in civil supersonic passenger transport,
              defined primarily by the ghost of historical failures rather than well-funded active startups. Since the
              retirement of the Anglo-French Concorde in 2003, no commercial operator has flown revenue passengers at
              supersonic speeds. Concorde proved that supersonic passenger flight is technically feasible, but
              demonstrated that extreme fuel burn, high maintenance overhead, limited passenger capacity, and
              restrictive overland sonic boom bans rendered the platform commercially unsustainable without state
              subsidies. Boom seeks to overcome this historical barrier with the Overture, designed to cruise at Mach
              1.7 over water with 64 to 80 passengers while burning 100 percent sustainable aviation fuel across more
              than 600 global routes. In the private jet category, Aerion Supersonic pursued the Mach 1.4 AS2 business
              jet for nearly two decades, securing preliminary fleet interest and technical partnerships with General
              Electric and Boeing. However, Aerion abruptly ceased operations in May 2021 after failing to secure the
              massive capital required to fund clean-sheet airframe development and bespoke engine manufacturing. Boom's
              successful flight testing of its XB-1 demonstrator to Mach 1.122 in January 2025 demonstrates independent
              aerodynamic execution that eluded Aerion, but aviation analysts emphasize that a subscale demonstrator
              does not bridge the enormous capital and certification gap to a passenger transport aircraft.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP010
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP010
              - CP014
      - number: '3.2'
        title: Incumbent Subsonic Widebodies and Business Aviation
        blocks:
          - type: paragraph
            body: >-
              The primary operational competitors to Overture are not rival supersonic aircraft, but incumbent subsonic
              commercial widebodies and long-range business jets that command long-haul intercontinental travel. Over
              the past two decades, commercial airframe manufacturers Boeing and Airbus optimized twin-engine composite
              aircraft such as the Boeing 787 Dreamliner and Airbus A350 for exceptional aerodynamic efficiency, low
              fuel burn per seat-mile, expansive belly-cargo revenue, and extreme transoceanic range exceeding 8,000
              nautical miles. While Overture promises to halve flight times on transatlantic and transpacific trunk
              routes—flying New York to London in approximately 3.5 hours compared to 6.5 hours on subsonic jets—it
              delivers this advantage with substantial operational compromises. Overture accommodates only 64 to 80
              passengers in an all-business cabin, possesses minimal cargo volume, and requires dedicated maintenance
              procedures. Commercial network carriers, including American Airlines with its deposit on 20 Overture
              airframes and United Airlines, are pursuing Overture as a premium brand differentiator rather than a core
              fleet substitute. For corporate passengers, long-range purpose-built business jets like the Bombardier
              Global 7500 and Gulfstream G700 offer near-sonic cruise speeds of Mach 0.90 to 0.94 combined with
              on-demand scheduling, private terminal access, and direct routing to secondary airfields, presenting a
              compelling status-quo alternative for the most time-sensitive travelers.
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP010
              - CP012
      - number: '3.3'
        title: Propulsion Barriers, Supply Power, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              The durability of Boom's competitive position is intimately coupled to its ability to resolve the
              structural propulsion bottleneck that has paralyzed civil supersonic aviation for decades. When legacy
              engine manufacturers including Rolls-Royce, General Electric, Safran, and Honeywell formally declined to
              develop bespoke commercial supersonic engines—citing small addressable market volumes and unsustainable
              research and development costs—Boom was compelled to establish an independent propulsion consortium.
              Boom's proprietary Symphony engine, developed alongside Florida Turbine Technologies, StandardAero, and GE
              Additive, is a medium-bypass turbofan designed to produce 35,000 pounds of thrust without afterburners,
              sharing core architecture with Boom's Superpower industrial turbine. This strategy grants Boom unique
              proprietary control over the sole active commercial supersonic propulsion program globally, creating a
              substantial defensive moat against potential aerospace entrants. However, clean-sheet engine certification
              under FAA Part 33 requires rigorous endurance testing, severe thermal containment validation, and billions
              in capital expenditure. Concurrently, environmental and regulatory constraints impose persistent
              commercial friction. While the FAA published a notice of proposed rulemaking in July 2026 addressing
              overland supersonic noise standards, Overture remains constrained primarily to transoceanic flight
              corridors. Furthermore, operating on 100 percent sustainable aviation fuel exposes airline customers to
              severe fuel cost premiums relative to conventional Jet-A, necessitating sustained premium passenger yield
              to defend operational viability.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Propulsion Asymmetry and the Engine Consortium Bottleneck
            body: >-
              The collective refusal by legacy engine primes—including Rolls-Royce, GE, Safran, and Pratt & Whitney—to
              fund or produce civil supersonic propulsion forces Boom to orchestrate the clean-sheet Symphony turbofan
              via Florida Turbine Technologies and StandardAero. While this preserves program autonomy, developing and
              certifying a commercial engine historically costs billions of dollars and represents Boom's most acute
              technical and financial vulnerability.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: Speed Advantage Versus Fleet Commonality Trade-Off
            body: >-
              Network carriers such as American and United view Overture not as a replacement for high-capacity
              widebodies, but as a specialized halo asset to capture high-yield corporate travelers on premium
              transoceanic corridors. Because supersonic aircraft cannot match the belly-cargo revenue, passenger
              density, or global overland routing flexibility of modern composite twin-aisles, Overture will complement
              rather than displace incumbent fleets.
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic is structured around two distinct revenue pillars: the long-term flagship Overture
              supersonic airliner and the nearer-term Superpower industrial gas turbine program. For Overture, Boom
              pursues a traditional commercial original equipment manufacturer (OEM) business model centered on airframe
              deliveries paired with long-term aftermarket parts and maintenance services. The company currently reports
              an order book of 130 aircraft spanning commercial reservations from American Airlines, United Airlines,
              and Japan Airlines. However, these commitments represent early-stage orders and pre-orders rather than
              finalized, irrevocable delivery contracts. With Overture list pricing set at approximately $200 million
              per airframe, the published order book indicates a headline pipeline value exceeding $26 billion, yet
              realized cash inflows to date are limited to developmental milestone deposits. To generate bridging cash
              flow before Overture enters service in the early 2030s, Boom introduced Superpower, a 42 MW natural-gas
              turbine derived from the core of its proprietary Symphony turbofan engine. While management targeted
              roughly 250 MW of Superpower deliveries in 2027 and 1 GW in 2028, the cancellation of Crusoe Energy launch
              commitments in September 2026 leaves this bridge unanchored by public commercial off-takers.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI009
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI013
      - number: '4.2'
        title: Monetization Framework and Operating Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Monetization of supersonic passenger aviation depends on closing the historical unit-economics deficit
              that grounded Concorde. Boom asserts that Overture will unlock sustainable airline profitability by
              achieving passenger ticket price parity with conventional subsonic business class on over 600 identified
              transoceanic routes. Nevertheless, realized airline operating margins will be governed by fuel efficiency,
              utilization, and engine durability. Overture is architected to operate exclusively on 100% sustainable
              aviation fuel (SAF) using a four-engine non-afterburning medium-bypass turbofan layout. Independent
              aerodynamic reviews emphasize that without massive industrial scaling and cost deflation of synthetic SAF
              production, Overture fuel-burn-per-seat-mile expenses could remain prohibitively high relative to modern
              wide-body subsonic airliners. On the maintenance dimension, Boom and its propulsion partners aim to
              mitigate lifecycle maintenance burdens through the Symphony engine program, targeting a 25% increase in
              time on wing and a 10% reduction in operating maintenance bills relative to legacy supersonic
              configurations. Engine assembly and overhaul are contracted with StandardAero in San Antonio, Texas,
              designed to scale to 330 engines annually, but these efficiency assumptions remain unproven prior to
              prototype core run cycles.
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI005
              - CI009
              - CI014
      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Financing Dependencies
        blocks:
          - type: paragraph
            body: >-
              Developing a clean-sheet supersonic commercial airliner and bespoke turbofan engine is among the most
              capital-intensive undertakings in global industrial manufacturing. Historically, commercial supersonic
              airliners were developed only by sovereign governments with billions in national subsidies. Boom estimates
              that completing the Overture program will require between $6 billion and $8 billion in total developmental
              capital, funded through a combination of private venture capital, airline pre-delivery milestone payments,
              and supplier risk-sharing agreements. Across its disclosed equity rounds and developmental awards, Boom
              has raised nearly $1 billion, leaving an estimated $5 billion to $7 billion funding gap to reach
              commercial type certification and series manufacturing. Capital allocation is further constrained by
              near-term physical infrastructure commitments. At Piedmont Triad International Airport in Greensboro,
              North Carolina, Boom completed construction on its 179,000-square-foot Overture Superfactory, but airport
              authority lease covenants permit lease termination if Boom employs fewer than 500 workers at the site by
              December 31, 2026. As a privately held enterprise, Boom does not publicly disclose its cash on hand,
              monthly cash burn, or unencumbered runway, creating substantial information asymmetry for external
              underwriting.
            claimRefs:
              - CI006
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI011
              - CI012
      - number: '4.4'
        title: Financial Underwriting Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Boom Supersonic presents an asymmetric, high-beta venture
              profile characterized by multi-billion-dollar forward capital requirements and severe near-term execution
              hurdles. Revenue quality is currently speculative: the core aviation program generates zero recurring
              revenue, airline deposits remain opaque regarding refundability and escrow covenants, and the near-term
              Superpower data-center power revenue bridge has lost its sole public anchor following Crusoe withdrawal.
              While XB-1 flight testing successfully de-risked low-speed and supersonic aerodynamics, the capital
              required to certify the Symphony engine and build production tooling at the Greensboro Superfactory will
              necessitate substantial additional equity or debt syndication. Crucial underwriting variables—including
              monthly cash burn, net unencumbered liquidity, tier-1 supplier cost guarantees, and binding off-taker
              agreements for Superpower turbines—are completely absent from public disclosures. Underwriters cannot
              model a credible solvency bridge without non-public disclosures detailing escrowed customer deposits,
              supplier fixed-price commitments, and covenant compliance timelines.
            claimRefs:
              - CI001
              - CI006
              - CI009
              - CI010
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Superpower Launch Cancellation Exposes Revenue Bridge Fragility
            body: >-
              The September 2026 cancellation of Crusoe Energy launch agreement for 29 Superpower turbines eliminated
              Boom sole announced commercial turbine backlog of $1.25 billion, leaving near-term monetization plans
              reliant on unnamed counterparties while Overture remains years from delivery.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI009
          - type: callout
            title: Capital Intensity Gap Requires Substantial Further Financing
            body: >-
              With nearly $1 billion raised to date against an estimated $6 billion to $8 billion required to certify
              and manufacture Overture, Boom faces multi-billion-dollar future financing requirements that depend on
              sustained investor risk appetite and carrier milestone payments.
            calloutType: insight
            claimRefs:
              - CI006
              - CI010
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Flight Fleet Portfolio
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic positions the Overture airliner as the flagship civil transport in commercial aviation
              designed to cut transoceanic flight durations in half compared to conventional subsonic airliners.
              Overture features an all-business-class cabin configured for 64 to 80 passengers, operating at an
              overwater cruise speed of Mach 1.7 at an altitude up to 60,000 feet with a design range of 4,250 nautical
              miles. The company’s flight hardware portfolio is anchored by the XB-1 subscale demonstrator aircraft,
              which serves as a technological testbed for aerodynamic shaping, digital flight controls, and composite
              materials, alongside the planned Superfactory production campus located in Greensboro, North Carolina.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE010
              - CE011
              - CE014
              - CE016
      - number: '5.2'
        title: Airframe Architecture, Symphony Propulsion, and Flight Deck
        blocks:
          - type: paragraph
            body: >-
              Overture’s aerodynamic architecture incorporates a compound delta gull wing designed to optimize
              supersonic lift-to-drag performance while maintaining low-speed airport handling stability without
              requiring afterburners. The airframe utilizes an area-ruled contoured carbon-composite fuselage with a
              wider forward cross-section that tapers aft to minimize shockwave wave drag across transonic regimes.
              Propulsion is delivered by four wing-mounted Symphony dry medium-bypass turbofans producing 35,000 pounds
              of thrust each, engineered with Florida Turbine Technologies and StandardAero for 100 percent sustainable
              aviation fuel operations. In the cockpit, Boom integrates the Honeywell Anthem avionics suite, dual
              Universal Avionics exterior cameras, and BAE Systems active sidesticks to enhance pilot situational
              awareness.
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE010
              - CE014
      - number: '5.3'
        title: Flight Operations, Airline Deployment, and Route Integration
        blocks:
          - type: paragraph
            body: >-
              Airline route deployment for Overture relies on optimizing high-density transoceanic corridors between
              major global financial hubs such as New York to London and San Francisco to Tokyo. Under current
              regulatory frameworks, civil supersonic flight over continental landmasses is prohibited by the FAA due to
              community sonic boom impacts, necessitating overland flight at subsonic speeds of Mach 0.94. This
              operational profile allows airlines to capture substantial time savings over oceans while integrating
              seamlessly into existing international airport gate infrastructure, runway length envelopes, and ICAO
              Chapter 14 noise certification standards without requiring specialized ground support infrastructure.
            claimRefs:
              - CE001
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE012
              - CE013
      - number: '5.4'
        title: Technical Differentiation, Certification, and Execution Gaps
        blocks:
          - type: paragraph
            body: >-
              Boom’s primary technical differentiation stems from modern computational aerodynamics, carbon-composite
              fabrication know-how, and its clean-sheet Symphony propulsion architecture that avoids afterburner fuel
              penalties. Flight validation was demonstrated on January 28, 2025, when the subscale XB-1 aircraft broke
              the sound barrier at Mach 1 in Mojave airspace following 11 piloted envelope-expansion test sorties.
              However, core engineering diligence gaps remain pronounced: full-scale Symphony core testing and flight
              certification have not yet been demonstrated, long-term turbine blade thermal fatigue under sustained
              supersonic cruising remains unproven, and high-rate aerostructure manufacturing at the Greensboro
              Superfactory remains in early construction phases.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE011
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Subscale Flight Validation vs. Full-Scale Engine Reality
            body: >-
              Boom's January 2025 Mach-1 flight with the XB-1 demonstrator retired fundamental aerodynamic risk
              regarding the delta-wing planform, but does not de-risk the full-scale Symphony turbofan, which remains
              years away from FAA certification.
            calloutType: insight
            claimRefs:
              - CE005
              - CE007
              - CE016
          - type: callout
            title: Overland Speed Penalties and Route Economics
            body: >-
              Because current regulations prohibit civil supersonic flight overland due to sonic booms, Overture must
              throttle back to Mach 0.94 over continental landmasses, reducing route time savings and constraining fuel
              efficiency.
            calloutType: risk
            claimRefs:
              - CE001
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Target Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic segments its addressable market into three primary customer groups: major global network
              airlines, international flag carriers, and government defense organizations, supplemented by an emerging
              industrial power generation concept. Mainline network airlines, represented by American Airlines and
              United Airlines, represent the core commercial buyer profile. These carriers operate massive transatlantic
              and transpacific hub-and-spoke networks with deep corporate customer bases capable of sustaining premium
              ticket pricing. For these buyers, Overture functions as a halo flagship asset designed to capture
              high-margin corporate travel on premier business corridors such as New York to London and San Francisco to
              Tokyo, cutting conventional flight durations roughly in half. International flag carriers such as Japan
              Airlines offer a complementary buyer profile focused on long-haul Pacific routes where supersonic speeds
              provide dramatic schedule compression. Beyond commercial passenger carriers, the U.S. Air Force represents
              an institutional research sponsor seeking high-speed executive transport and specialized operational
              capabilities. However, because commercial passenger airliners represent over 95% of projected program
              revenue, Boom remains almost entirely dependent on commercial airline capital expenditure cycles.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
              - CU013
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU013
      - number: '6.2'
        title: Adoption Trajectory and Order Book Milestones
        blocks:
          - type: paragraph
            body: >-
              Boom's commercial adoption trajectory has evolved through distinct phases over the past decade, moving
              from early strategic seed-stage endorsements to major fleet pre-orders. In December 2017, Japan Airlines
              established the initial institutional validation for the startup by contributing early strategic capital
              and securing options for 20 aircraft. The program achieved mainstream commercial momentum in June 2021
              when United Airlines became the first U.S. carrier to sign an aircraft purchase agreement, committing to
              15 Overtures alongside 35 options. Commercial momentum expanded further in August 2022 when American
              Airlines, the world's largest carrier by fleet size, executed an agreement for 20 aircraft with an option
              for 40 more, accompanied by non-refundable cash deposits. Together with defense research contracts
              including a $60 million U.S. Air Force award, Boom's headline commercial order book stands at 130 aircraft
              across orders and pre-orders. Technical milestones have reinforced this trajectory: on January 28, 2025,
              Boom's XB-1 demonstrator broke the sound barrier at Mach 1.122 over the Mojave Desert. Nonetheless, while
              Boom targets commercial entry into service by 2029, independent aerospace analysts widely anticipate that
              flight testing, engine integration, and FAA type certification will push initial airline deliveries into
              the early 2030s.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
      - number: '6.3'
        title: Named Customer Commitments and Contract Structure
        blocks:
          - type: paragraph
            body: >-
              A rigorous diligence examination of Boom's customer portfolio reveals sharp distinctions between headline
              commitments and binding purchase liabilities. American Airlines represents Boom's highest-conviction
              commercial customer, having committed cash deposits on 20 airframes with options for 40 additional units.
              United Airlines holds purchase agreements for 15 aircraft plus 35 options, while Japan Airlines maintains
              options for 20 aircraft. However, all commercial airline commitments are heavily conditioned on Boom
              achieving rigorous performance, environmental, and safety benchmarks. In particular, contracts require
              compliance with Stage 5 / Chapter 14 takeoff and landing noise thresholds, verified supersonic cruise
              range, and FAA airworthiness certification. Adverse industry evidence underscores that customer adoption
              is far from universal: Delta Air Lines CEO Ed Bastian publicly refused to place orders in 2022, citing
              fundamental unresolved doubts regarding supersonic unit economics and fuel efficiency. Furthermore,
              independent academic analysis from Delft University highlights that fueling supersonic jets with 100%
              sustainable aviation fuel could cost airlines up to 25 times more than operating subsonic planes on
              conventional kerosene, presenting a formidable long-term operating expense hurdle for airline CFOs.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU011
      - number: '6.4'
        title: Retention Durability, Expansion Loops, and Downside Exposure
        blocks:
          - type: paragraph
            body: >-
              Customer retention and contract durability in commercial aerospace differ fundamentally from enterprise
              software metrics: because Boom is pre-revenue and pre-delivery, net revenue retention is currently
              inapplicable, and durability is measured by pre-order conversion resilience and airline co-development
              engagement. Boom has maintained active customer engagement by embedding airline flight crews directly into
              the engineering loop. Commercial airline pilots and British Airways Concorde veteran Mike Bannister have
              conducted extensive simulator evaluations of Overture's flight deck, testing sidestick force-feedback
              controls and camera-based vision systems to validate flight operations. Expansion potential is embedded
              directly within existing contracts, which contain 95 optional aircraft that could more than triple Boom's
              delivered fleet if initial operations succeed across 600 modeled transoceanic routes. Nevertheless,
              customer concentration risk is extreme: two domestic airlines (American and United) account for 110 of the
              130 total aircraft in Boom's order book. Should either carrier renegotiate, postpone delivery slots, or
              exercise termination rights due to macroeconomic downturns or SAF availability deficits, Boom's production
              economics and capital runway would suffer severe disruption.
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU010
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU010
              - CU012
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Asymmetric Pre-Order Risk and Cancellation Vulnerability
            body: >-
              Boom's commercial order book of 130 aircraft consists overwhelmingly of conditional pre-orders and options
              rather than irrevocable purchase commitments. Although American Airlines paid a non-refundable deposit on
              20 airframes, delivery timelines stretching into the early 2030s leave airlines significant contractual
              latitude to walk away if Symphony engine certification stalls, noise standards tighten, or sustainable
              aviation fuel operating costs prove economically prohibitive.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU011
              - CU012
          - type: callout
            title: Dual-Track Defense and Industrial Hedges
            body: >-
              Faced with lengthy airline commercial certification timelines, Boom has cultivated non-airline customer
              relationships including a $60 million Air Force STRATFI research contract and a defense study partnership
              with Northrop Grumman. Furthermore, Boom is exploring an industrial natural gas turbine variant of its
              Symphony engine core (Superpower) to establish an operational revenue bridge and accumulate reliability
              run-hours before passenger service.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Certification Framework
        blocks:
          - type: paragraph
            body: >-
              Commercial supersonic flight operates under stringent regulatory constraints established during the
              Concorde era, most notably the federal ban on overland supersonic civil flights under 14 CFR 91.817. While
              a 2025 executive order directed the FAA to initiate rulemaking permitting overland operations that avoid
              ground-level sonic booms, and the Supersonic Aviation Modernization Act has passed the House of
              Representatives, the legislation remains pending in the Senate without guaranteed enactment timelines.
              Internationally, ICAO Chapter 14 and FAA Stage 5 noise standards require Overture to operate without
              afterburners, necessitating unproven medium-bypass turbofan acoustics. Without comprehensive regulatory
              relief and bilateral overflight approvals, Overture's addressable commercial routes remain constrained to
              transoceanic corridors, capping fleet utilization.
            claimRefs:
              - CR002
              - CR003
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR005
      - number: '7.2'
        title: Propulsion Engineering and Operational Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Developing a clean-sheet supersonic commercial powerplant without an incumbent engine OEM represents the
              program's primary technical vulnerability. Following Rolls-Royce's withdrawal from supersonic civil
              propulsion development, Boom assumed direct responsibility for the Symphony engine, coordinating design
              with Florida Turbine Technologies and assembly with StandardAero. Clean-sheet commercial turbofan
              development typically requires several billion dollars and extensive testing cycles to resolve aerodynamic
              flutter, compressor stall, and thermal endurance issues. Although the XB-1 demonstrator validated
              composite structures and intake aerodynamics during its January 2025 supersonic flight test, scaling these
              technologies to a four-engine Mach 1.7 passenger airliner carrying 64 to 80 passengers introduces
              substantial structural and aeroelastic certification challenges.
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
      - number: '7.3'
        title: Supply Chain Interdependence and Partner Concentration
        blocks:
          - type: paragraph
            body: >-
              Boom's asset-light manufacturing strategy relies upon a consortium of tier-one aerospace suppliers,
              creating operational dependencies across specialized single-source vendors. Propulsion engineering depends
              directly on Florida Turbine Technologies, while engine assembly and maintenance testing are centralized
              with StandardAero in San Antonio. High-temperature materials require specialized nickel-based superalloys
              from ATI, and the flight deck integrates Honeywell Anthem avionics with Universal Avionics head-wearable
              displays. Furthermore, production scaling depends on operationalizing the 66-aircraft capacity Overture
              Superfactory in Greensboro, supported by $121 million in North Carolina state and local incentive
              packages. Any technical bottleneck, labor disruption, or delivery delay among these interdependent
              partners threatens cascade delays across the integrated aircraft delivery schedule.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: Commercial Conversion, Fuel Economics, and Capital Model Viability
        blocks:
          - type: paragraph
            body: >-
              Boom's commercial business model hinges upon maintaining manageable operating economics and premium ticket
              pricing of approximately $5,000 for transatlantic routes. However, powering supersonic flight exclusively
              with sustainable aviation fuels poses acute cost and availability risks, with independent studies
              projecting SAF expenses up to 25 times higher than conventional jet fuel. Moreover, while Boom reports 130
              pre-orders from United, American, and Japan Airlines, these commitments consist largely of conditional
              options contingent upon performance milestones rather than firm, non-refundable purchase agreements. As a
              private entity with over $600 million raised, Boom faces substantial capital intensity, requiring bridge
              revenues from its late-2027 Superpower turbine deliveries to fund development until full commercial
              transport certification.
            claimRefs:
              - CR001
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Clean-Sheet Propulsion Certification Represents the Primary Schedule Kill Risk
            body: >-
              Developing the Symphony engine without an incumbent commercial engine OEM introduces severe technological
              and timeline risk; Forecast International projects commercial entry into service will slip into the 2030s
              given clean-sheet certification hurdles.
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
          - type: callout
            title: Diligence Must Verify Deposit Non-Refundability and Superpower Revenue Milestones
            body: >-
              Investors should verify whether airline commitments from American and United carry non-refundable
              milestone penalties, and closely monitor late-2027 delivery schedules for Superpower ground turbines as a
              revenue bridge.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Strategic Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Boom Supersonic rests on unprecedented airline commercial pull and
              demonstrated aerodynamic capability. Tier-one carriers including United Airlines, American Airlines, and
              Japan Airlines have placed over 130 orders and pre-orders for the Overture airliner, reflecting structural
              airline demand for speed as a premium product. In January 2025, Boom validated its composite
              aerostructures and flight control software when the XB-1 demonstrator achieved supersonic flight at Mach
              1.122. However, the anti-thesis is equally formidable: independent aviation environmental analyses
              indicate supersonic transports consume 7 to 9 times more fuel per passenger-kilometer than modern subsonic
              aircraft, exposing airline operators to immense fuel cost volatility and sustainability pushback.
              Furthermore, historical rejections from premier engine manufacturers Rolls-Royce, Safran, and General
              Electric have forced Boom to design its custom Symphony propulsion system in-house, creating extreme
              technical and certification hurdles.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Valuation Context and Pre-Revenue Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Boom achieved a post-money valuation of $1.5 billion in its December 2025 Series B financing round, led by
              Darsana Capital Partners, which raised $300 million and expanded cumulative funding to approximately $901
              million. This financing followed an estimated 20% equity dilution in Series B and approximately 23%
              dilution in the preceding Series A-1 round. When evaluated against public aerospace manufacturers such as
              Boeing, Airbus, Bombardier, and Embraer—which trade between 1.7x and 2.5x revenue multiples—Boom's private
              mark appears stretched, as the company remains entirely pre-revenue with heavy annual cash consumption.
              While secondary trading interest persists on pre-IPO platforms, incoming capital faces unquantifiable risk
              from undisclosed liquidation preferences and seniority stacks across 13 historical equity rounds. The
              absence of publicly audited cap table details prevents outside investors from verifying common share
              downside recovery thresholds in down-round restructuring scenarios.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV015
      - number: '8.3'
        title: Scenario Analysis and Downside Return Profiles
        blocks:
          - type: paragraph
            body: >-
              Valuation outcomes for Boom Supersonic diverge sharply across operating scenarios due to extreme capital
              intensity. Commercializing the Overture airliner is estimated to require between $6 billion and $8
              billion, creating an unresolved multi-billion-dollar funding gap against existing capital. In the bull
              case (20% probability), Boom achieves FAA type certification by 2030, converts 130 pre-orders into firm
              deliveries at roughly $200 million per airframe, and scales its Greensboro Superfactory toward an
              enterprise valuation of $3.5 billion to $5.0 billion. In the base case (50% probability), certification
              delays push commercial entry into 2032-2033, forcing substantial additional dilutive financing that
              compresses enterprise returns into the $1.2 billion to $1.8 billion range. In the bear case (30%
              probability), technical engine setbacks or airline cancellations trigger distressed restructuring
              resembling the liquidation of Aerion Supersonic, impairing equity value below $400 million.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Recommendation, Diligence Asks, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Balancing the technological breakthroughs demonstrated by the XB-1 with the severe capital intensity of
              clean-sheet commercial aircraft development yields a definitive diligence recommendation of 'track'. Boom
              is actively mitigating its propulsion bottleneck through engineering partnerships with Florida Turbine
              Technologies and StandardAero, but hardware testing for the Symphony engine core remains in early
              development stages. Investors should not commit growth capital until Boom satisfies specific diligence
              kill criteria: first, independent verification of full-scale Symphony engine core rig test data; second,
              public audit of non-refundable customer deposit conversion rates and backlog retention; and third, clear
              visibility into the Series B liquidation preference structure. Any material cancellation from United
              Airlines or American Airlines, or unmitigated engine certification delays beyond 2031, should serve as an
              immediate thesis-break trigger.
            claimRefs:
              - CV009
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Discipline Over Hype: Why Track Is the Only Defensible Posture'
            body: >-
              While Boom Supersonic has achieved an impressive technical milestone with the XB-1 supersonic flight,
              commercializing the Overture airliner requires scaling a bespoke engine program and closing a
              multi-billion-dollar financing gap. An investment recommendation of 'track' balances the extraordinary
              potential of revived supersonic travel with the reality of an eight-to-ten-year pre-revenue execution
              window and significant preference overhang.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
          - type: callout
            title: The Aerion Precedent and Clean-Sheet Engine Vulnerability
            body: >-
              Historical precedent in supersonic aviation demonstrates that airframe development is ultimately hostage
              to engine availability. Following Rolls-Royce's departure in 2022, Boom's decision to develop the Symphony
              engine in-house replicates the exact capital and engineering stress that drove competitor Aerion
              Supersonic to liquidate in 2021. Investors must treat Symphony milestone verification as an essential
              precondition for any capital commitment.
            calloutType: risk
            claimRefs:
              - CV008
              - CV013
