company:
  name: "Boom Supersonic"
chapter:
  number: 8
  title: "Valuation"
  summary: "Boom Supersonic holds an extraordinary technological achievement following the successful Mach 1.122 supersonic flight of its XB-1 demonstrator and an announced order book of 130+ airliners, but its $1.5 billion December 2025 post-money valuation prices in near-flawless execution against a $6 billion to $8 billion commercial development funding requirement. With zero commercial revenue, severe propulsion development risks following OEM withdrawals, and entry-into-service pushed toward 2030, an investment posture of 'track' is recommended until full-scale Symphony engine core testing and customer deposit conversion are independently verified."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Strategic Anti-Thesis"
    body: "The core investment thesis for Boom Supersonic rests on unprecedented airline commercial pull and demonstrated aerodynamic capability. Tier-one carriers including United Airlines, American Airlines, and Japan Airlines have placed over 130 orders and pre-orders for the Overture airliner, reflecting structural airline demand for speed as a premium product. In January 2025, Boom validated its composite aerostructures and flight control software when the XB-1 demonstrator achieved supersonic flight at Mach 1.122. However, the anti-thesis is equally formidable: independent aviation environmental analyses indicate supersonic transports consume 7 to 9 times more fuel per passenger-kilometer than modern subsonic aircraft, exposing airline operators to immense fuel cost volatility and sustainability pushback. Furthermore, historical rejections from premier engine manufacturers Rolls-Royce, Safran, and General Electric have forced Boom to design its custom Symphony propulsion system in-house, creating extreme technical and certification hurdles."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
    tableRefs:
      - "TV002"
  - id: "valuation-context-and-pre-revenue-structure"
    title: "Valuation Context and Pre-Revenue Capital Structure"
    body: "Boom achieved a post-money valuation of $1.5 billion in its December 2025 Series B financing round, led by Darsana Capital Partners, which raised $300 million and expanded cumulative funding to approximately $901 million. This financing followed an estimated 20% equity dilution in Series B and approximately 23% dilution in the preceding Series A-1 round. When evaluated against public aerospace manufacturers such as Boeing, Airbus, Bombardier, and Embraer—which trade between 1.7x and 2.5x revenue multiples—Boom's private mark appears stretched, as the company remains entirely pre-revenue with heavy annual cash consumption. While secondary trading interest persists on pre-IPO platforms, incoming capital faces unquantifiable risk from undisclosed liquidation preferences and seniority stacks across 13 historical equity rounds. The absence of publicly audited cap table details prevents outside investors from verifying common share downside recovery thresholds in down-round restructuring scenarios."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
  - id: "scenario-analysis-and-return-profiles"
    title: "Scenario Analysis and Downside Return Profiles"
    body: "Valuation outcomes for Boom Supersonic diverge sharply across operating scenarios due to extreme capital intensity. Commercializing the Overture airliner is estimated to require between $6 billion and $8 billion, creating an unresolved multi-billion-dollar funding gap against existing capital. In the bull case (20% probability), Boom achieves FAA type certification by 2030, converts 130 pre-orders into firm deliveries at roughly $200 million per airframe, and scales its Greensboro Superfactory toward an enterprise valuation of $3.5 billion to $5.0 billion. In the base case (50% probability), certification delays push commercial entry into 2032-2033, forcing substantial additional dilutive financing that compresses enterprise returns into the $1.2 billion to $1.8 billion range. In the bear case (30% probability), technical engine setbacks or airline cancellations trigger distressed restructuring resembling the liquidation of Aerion Supersonic, impairing equity value below $400 million."
    claimRefs:
      - "CV003"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV003"
  - id: "recommendation-diligence-asks-and-kill-criteria"
    title: "Recommendation, Diligence Asks, and Kill Criteria"
    body: "Balancing the technological breakthroughs demonstrated by the XB-1 with the severe capital intensity of clean-sheet commercial aircraft development yields a definitive diligence recommendation of 'track'. Boom is actively mitigating its propulsion bottleneck through engineering partnerships with Florida Turbine Technologies and StandardAero, but hardware testing for the Symphony engine core remains in early development stages. Investors should not commit growth capital until Boom satisfies specific diligence kill criteria: first, independent verification of full-scale Symphony engine core rig test data; second, public audit of non-refundable customer deposit conversion rates and backlog retention; and third, clear visibility into the Series B liquidation preference structure. Any material cancellation from United Airlines or American Airlines, or unmitigated engine certification delays beyond 2031, should serve as an immediate thesis-break trigger."
    claimRefs:
      - "CV009"
      - "CV014"
    figureRefs:
      - "FV001"
