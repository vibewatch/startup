callouts:
  - calloutType: "recommendation"
    title: "Discipline Over Hype: Why Track Is the Only Defensible Posture"
    body: "While Boom Supersonic has achieved an impressive technical milestone with the XB-1 supersonic flight, commercializing the Overture airliner requires scaling a bespoke engine program and closing a multi-billion-dollar financing gap. An investment recommendation of 'track' balances the extraordinary potential of revived supersonic travel with the reality of an eight-to-ten-year pre-revenue execution window and significant preference overhang."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV014"
  - calloutType: "risk"
    title: "The Aerion Precedent and Clean-Sheet Engine Vulnerability"
    body: "Historical precedent in supersonic aviation demonstrates that airframe development is ultimately hostage to engine availability. Following Rolls-Royce's departure in 2022, Boom's decision to develop the Symphony engine in-house replicates the exact capital and engineering stress that drove competitor Aerion Supersonic to liquidate in 2021. Investors must treat Symphony milestone verification as an essential precondition for any capital commitment."
    claimRefs:
      - "CV008"
      - "CV013"
