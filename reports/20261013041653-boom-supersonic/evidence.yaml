evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosures
    missingEvidence: Audited financial statements detailing cash burn rate, cash runway, and cap table liquidation preferences.
    whyItMatters: >-
      Aerospace development requires billions in upfront capital; undisclosed cash burn obscures the timing and dilutive
      impact of next-round financing.
    diligencePath: Request private investor financial presentations, audited balance sheets, and cap table summaries under NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Complete disclosure of Boom Supersonic's board of directors, observer seats, and voting control agreements.
    whyItMatters: >-
      Key-person dependence and strategic investor governance rights dictate corporate flexibility and major milestone
      decisions.
    diligencePath: Review corporate charter filings in Delaware and venture debt covenants during formal diligence.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: airline-deposit-terms
    missingEvidence: >-
      Exact contractual deposit amounts, escrow structures, refund conditions, and delivery cancellation penalties
      between Boom and airline pre-order partners (United, American, JAL).
    whyItMatters: >-
      Without public contract terms, it is impossible to verify airline financial exposure or assess the certainty of
      Boom's $130M+ implied pre-order backlog converting into firm deliveries.
    diligencePath: >-
      Subpoena or review SEC Form 10-K fleet commitments and aircraft purchase disclosures filed by United Airlines
      Holdings and American Airlines Group.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Audited comparative seat-mile operating cost models between Mach 1.7 Overture on 100% SAF and modern subsonic
      business cabins on the Airbus A350 and Boeing 787.
    whyItMatters: >-
      Airlines must assess whether passenger premium yield offsets estimated higher fuel consumption and dedicated fleet
      maintenance overhead.
    diligencePath: >-
      Request confidential airline fleet evaluation economic models and SAF procurement escalation assumptions from
      launch customer contracts.
