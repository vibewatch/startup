callouts:
  - calloutType: risk
    title: Propulsion Asymmetry and the Engine Consortium Bottleneck
    body: >-
      The collective refusal by legacy engine primes—including Rolls-Royce, GE, Safran, and Pratt & Whitney—to fund or
      produce civil supersonic propulsion forces Boom to orchestrate the clean-sheet Symphony turbofan via Florida
      Turbine Technologies and StandardAero. While this preserves program autonomy, developing and certifying a
      commercial engine historically costs billions of dollars and represents Boom's most acute technical and financial
      vulnerability.
    claimRefs:
      - CP006
      - CP007
  - calloutType: insight
    title: Speed Advantage Versus Fleet Commonality Trade-Off
    body: >-
      Network carriers such as American and United view Overture not as a replacement for high-capacity widebodies, but
      as a specialized halo asset to capture high-yield corporate travelers on premium transoceanic corridors. Because
      supersonic aircraft cannot match the belly-cargo revenue, passenger density, or global overland routing
      flexibility of modern composite twin-aisles, Overture will complement rather than displace incumbent fleets.
    claimRefs:
      - CP002
      - CP010
      - CP012
