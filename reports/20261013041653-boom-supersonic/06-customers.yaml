figures:
  - id: FU001
    title: Customer Journey Map
    type: journey-map
    summary: The six-phase airline procurement, technical validation, operational readiness, and fleet deployment journey for Overture supersonic airliners.
    claimRefs:
      - CU001
      - CU006
      - CU008
      - CU010
      - CU012
      - CU014
    data:
      items:
        - label: 'Phase 1: Strategic Alignment & Route Viability Evaluation'
          stage: Evaluation
          touchpoints:
            - Fleet planning teams model over 600 potential transoceanic routes
            - Airline network analysts evaluate Mach 1.7 schedule compression vs business-class yield
          detail: Airlines evaluate transoceanic route economics and premium passenger willingness-to-pay for 50% flight time reductions.
          tone: positive
        - label: 'Phase 2: Conditional Pre-Order & Option Placement'
          stage: Commitment
          touchpoints:
            - Execution of conditional aircraft purchase agreements
            - Payment of non-refundable deposits with performance caveats
          detail: Carriers secure delivery queue priority for 15-20 firm aircraft plus extensive option blocks of 35-40 aircraft.
          tone: positive
        - label: 'Phase 3: Flight Deck Co-Design & Pilot Ergonomics Validation'
          stage: Co-Development
          touchpoints:
            - Airline commercial pilots conduct simulator evaluations
            - Concorde veteran Mike Bannister benchmarks force-feedback flight controls
          detail: Customer pilots validate next-generation flight deck interfaces, sidestick ergonomics, and vision systems.
          tone: neutral
        - label: 'Phase 4: Regulatory Milestone & Symphony Engine Certification Tracking'
          stage: Technical Gate
          touchpoints:
            - Monitoring Symphony engine rig tests and FAA Stage 5 / Chapter 14 noise certification
            - Tracking XB-1 supersonic flight test data and Mach cutoff overland viability
          detail: Airlines gate capital progression on Boom achieving engine first flight and FAA/ICAO environmental approvals.
          tone: warning
        - label: 'Phase 5: Sustainable Aviation Fuel (SAF) Infrastructure & Operating Economics'
          stage: Infrastructure Gate
          touchpoints:
            - Airlines secure 100% SAF supply chains at hub airports
            - Analysis of up to 25x sustainable fuel cost premium compared to conventional subsonic kerosene
          detail: Commercial viability requires closing the SAF price and volume gap across international departure hubs.
          tone: adverse
        - label: 'Phase 6: Commercial Entry into Service & Route Network Expansion'
          stage: Fleet Deployment
          touchpoints:
            - Delivery of first production Overture airliners targeted for 2029 to early 2030s
            - Conversion of 95 option aircraft into firm delivery tranches
          detail: Carriers deploy supersonic aircraft on flagship transoceanic routes and evaluate option execution for network expansion.
          tone: opportunity
callouts:
  - calloutType: risk
    title: Asymmetric Pre-Order Risk and Cancellation Vulnerability
    body: Boom's commercial order book of 130 aircraft consists overwhelmingly of conditional pre-orders and options rather than irrevocable purchase commitments. Although American Airlines paid a non-refundable deposit on 20 airframes, delivery timelines stretching into the early 2030s leave airlines significant contractual latitude to walk away if Symphony engine certification stalls, noise standards tighten, or sustainable aviation fuel operating costs prove economically prohibitive.
    claimRefs:
      - CU001
      - CU002
      - CU007
      - CU011
      - CU012
  - calloutType: insight
    title: Dual-Track Defense and Industrial Hedges
    body: Faced with lengthy airline commercial certification timelines, Boom has cultivated non-airline customer relationships including a $60 million Air Force STRATFI research contract and a defense study partnership with Northrop Grumman. Furthermore, Boom is exploring an industrial natural gas turbine variant of its Symphony engine core (Superpower) to establish an operational revenue bridge and accumulate reliability run-hours before passenger service.
    claimRefs:
      - CU005
      - CU006
      - CU013
