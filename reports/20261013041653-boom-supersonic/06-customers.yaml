chapter:
  number: 6
  title: Customers
  summary: Boom Supersonic holds an announced commercial order book of 130 aircraft across American Airlines, United Airlines, and Japan Airlines, but all commitments remain pre-delivery options or conditional pre-orders with modest non-refundable deposits. With entry into service targeted for 2029 and independently expected in the early 2030s, Boom faces extreme customer concentration, delivery timeline friction, and unhedged airline cancellation risk if supersonic operating costs and sustainable fuel availability fail to meet commercial thresholds.
sections:
  - id: customer-segmentation-and-target-buyer-profiles
    title: Customer Base Segmentation and Target Buyer Profiles
    body: 'Boom Supersonic segments its addressable market into three primary customer groups: major global network airlines, international flag carriers, and government defense organizations, supplemented by an emerging industrial power generation concept. Mainline network airlines, represented by American Airlines and United Airlines, represent the core commercial buyer profile. These carriers operate massive transatlantic and transpacific hub-and-spoke networks with deep corporate customer bases capable of sustaining premium ticket pricing. For these buyers, Overture functions as a halo flagship asset designed to capture high-margin corporate travel on premier business corridors such as New York to London and San Francisco to Tokyo, cutting conventional flight durations roughly in half. International flag carriers such as Japan Airlines offer a complementary buyer profile focused on long-haul Pacific routes where supersonic speeds provide dramatic schedule compression. Beyond commercial passenger carriers, the U.S. Air Force represents an institutional research sponsor seeking high-speed executive transport and specialized operational capabilities. However, because commercial passenger airliners represent over 95% of projected program revenue, Boom remains almost entirely dependent on commercial airline capital expenditure cycles.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU008
      - CU013
      - CU015
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-order-book-milestones
    title: Adoption Trajectory and Order Book Milestones
    body: 'Boom''s commercial adoption trajectory has evolved through distinct phases over the past decade, moving from early strategic seed-stage endorsements to major fleet pre-orders. In December 2017, Japan Airlines established the initial institutional validation for the startup by contributing early strategic capital and securing options for 20 aircraft. The program achieved mainstream commercial momentum in June 2021 when United Airlines became the first U.S. carrier to sign an aircraft purchase agreement, committing to 15 Overtures alongside 35 options. Commercial momentum expanded further in August 2022 when American Airlines, the world''s largest carrier by fleet size, executed an agreement for 20 aircraft with an option for 40 more, accompanied by non-refundable cash deposits. Together with defense research contracts including a $60 million U.S. Air Force award, Boom''s headline commercial order book stands at 130 aircraft across orders and pre-orders. Technical milestones have reinforced this trajectory: on January 28, 2025, Boom''s XB-1 demonstrator broke the sound barrier at Mach 1.122 over the Mojave Desert. Nonetheless, while Boom targets commercial entry into service by 2029, independent aerospace analysts widely anticipate that flight testing, engine integration, and FAA type certification will push initial airline deliveries into the early 2030s.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU007
      - CU009
    tableRefs:
      - TU002
  - id: named-customer-commitments-and-delivery-friction
    title: Named Customer Commitments and Contract Structure
    body: 'A rigorous diligence examination of Boom''s customer portfolio reveals sharp distinctions between headline commitments and binding purchase liabilities. American Airlines represents Boom''s highest-conviction commercial customer, having committed cash deposits on 20 airframes with options for 40 additional units. United Airlines holds purchase agreements for 15 aircraft plus 35 options, while Japan Airlines maintains options for 20 aircraft. However, all commercial airline commitments are heavily conditioned on Boom achieving rigorous performance, environmental, and safety benchmarks. In particular, contracts require compliance with Stage 5 / Chapter 14 takeoff and landing noise thresholds, verified supersonic cruise range, and FAA airworthiness certification. Adverse industry evidence underscores that customer adoption is far from universal: Delta Air Lines CEO Ed Bastian publicly refused to place orders in 2022, citing fundamental unresolved doubts regarding supersonic unit economics and fuel efficiency. Furthermore, independent academic analysis from Delft University highlights that fueling supersonic jets with 100% sustainable aviation fuel could cost airlines up to 25 times more than operating subsonic planes on conventional kerosene, presenting a formidable long-term operating expense hurdle for airline CFOs.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: retention-durability-and-expansion-dynamics
    title: Retention Durability, Expansion Loops, and Downside Exposure
    body: 'Customer retention and contract durability in commercial aerospace differ fundamentally from enterprise software metrics: because Boom is pre-revenue and pre-delivery, net revenue retention is currently inapplicable, and durability is measured by pre-order conversion resilience and airline co-development engagement. Boom has maintained active customer engagement by embedding airline flight crews directly into the engineering loop. Commercial airline pilots and British Airways Concorde veteran Mike Bannister have conducted extensive simulator evaluations of Overture''s flight deck, testing sidestick force-feedback controls and camera-based vision systems to validate flight operations. Expansion potential is embedded directly within existing contracts, which contain 95 optional aircraft that could more than triple Boom''s delivered fleet if initial operations succeed across 600 modeled transoceanic routes. Nevertheless, customer concentration risk is extreme: two domestic airlines (American and United) account for 110 of the 130 total aircraft in Boom''s order book. Should either carrier renegotiate, postpone delivery slots, or exercise termination rights due to macroeconomic downturns or SAF availability deficits, Boom''s production economics and capital runway would suffer severe disruption.'
    claimRefs:
      - CU001
      - CU006
      - CU008
      - CU010
      - CU012
      - CU014
    figureRefs:
      - FU001
