chapter:
  number: 2
  title: "Market Analysis"
  summary: "Boom Supersonic targets premium long-haul civil aviation by pairing business-class transoceanic fares with Mach 1.7 flight times across more than 600 global routes. While the gross addressable airline passenger spend exceeds tens of billions annually, commercial adoption is constrained by overland supersonic flight bans, 100% sustainable aviation fuel requirements, uncertified bespoke propulsion, and non-binding airline commitments."
sections:
  - id: "market-boundary-and-substitutes"
    title: "Market Boundary, Addressable Airline Demand, and Status-Quo Substitutes"
    body: "Commercial supersonic passenger aviation occupies a specialized high-speed frontier within intercontinental civil air transport. The commercial boundary focuses on long-haul premium passengers traveling on high-yield transoceanic city pairs between major international hubs such as New York, London, Tokyo, and San Francisco. Spend included within this boundary comprises airline commercial airframe procurement, dedicated supersonic engine maintenance and overhaul contracts, and passenger ticket revenues on intercontinental corridors where flight time can be cut roughly in half. Excluded from this commercial air transport perimeter are subsonic narrowbody passenger aircraft, domestic overland short-haul routes where speed advantages are nullified by climb-and-descent cycles and overland regulatory restrictions, military and defense-specific supersonic platforms, and private supersonic business jets. The primary status-quo substitutes are modern widebody subsonic airliners offering lie-flat premium cabins, such as the Boeing 787 and Airbus A350, as well as ultra-long-range dedicated corporate jets like the Gulfstream G700 and Bombardier Global 7500."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM003"
      - "CM004"
      - "CM005"
    tableRefs:
      - "TM001"
  - id: "market-sizing-and-adoption-layers"
    title: "Market Sizing Lenses, Fleet Projections, and Route Capacity"
    body: "Evaluating market scale requires triangulating between global premium airline passenger capacity, airline commercial fleet replacement and expansion spending, and near-term manufacturer delivery capacity. Global intercontinental premium passenger spending constitutes the broad total addressable market (TAM), representing annual spending exceeding $40 billion across international business- and first-class routes. The serviceable addressable market (SAM) is bounded by the operational radius and acoustic corridor of the aircraft, encompassing approximately 600 identified profitable transoceanic city pairs capable of supporting Mach 1.7 operations within a 4,250 nautical mile full-payload range. Finally, the serviceable obtainable market (SOM) is constrained by manufacturing throughput and capital availability: Boom completed its initial Overture Superfactory in Greensboro, North Carolina, designed to scale to an annual production rate of 33 to 66 aircraft per year, with 130 non-binding orders and pre-orders currently secured across United Airlines, American Airlines, and Japan Airlines."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM010"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyer-segmentation-and-decision-path"
    title: "Buyer Segmentation, Fleet Procurement Workflow, and Budget Ownership"
    body: "The adoption and purchasing path for supersonic commercial airframes is governed by commercial airline fleet planning and capital allocation departments. Tier-one network carriers, represented by United Airlines, American Airlines, and Japan Airlines, evaluate Overture as a premium flagship asset designed to capture high-margin corporate travelers and elite loyalty members on transatlantic and transpacific trunk routes. Fleet procurement workflows require multi-year evaluations, beginning with letters of intent and conditional pre-orders, followed by technical evaluation of engine performance, operating costs, and type certification milestones before committing firm non-refundable delivery deposits. In parallel, secondary and specialized buyer segments include defense and government VIP transport agencies, where Boom partners with Northrop Grumman to evaluate government mission variants, as well as industrial power generation customers purchasing derivative Superpower turbines."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM009"
      - "CM011"
      - "CM012"
    tableRefs:
      - "TM003"
  - id: "growth-drivers-and-adoption-constraints"
    title: "Macro Growth Drivers, Technological Execution, and Regulatory Bottlenecks"
    body: "Adoption of commercial supersonic flight is driven by persistent corporate willingness to pay for travel time reduction, premium airline capacity yield expansion, and modern digital aerodynamic simulation enabling airframes to cruise at Mach 1.7 without fuel-guzzling afterburners. However, the commercial market faces formidable structural constraints. Overland supersonic operations remain restricted under long-standing acoustic regulations dating back to 1973; while a June 2025 executive order instructed the FAA to establish acoustic standards, commercial viability over land remains contingent on unverified 'boomless cruise' atmospheric refraction technologies. Furthermore, Overture requires 100% sustainable aviation fuel (SAF) to satisfy environmental compliance targets amidst a severe global SAF supply deficit, and the simultaneous development and FAA type certification of the bespoke Symphony turbofan engine introduces substantial multi-year schedule risk."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM008"
      - "CM011"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM015"
