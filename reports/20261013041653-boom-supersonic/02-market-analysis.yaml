callouts:
  - calloutType: "risk"
    title: "Dual Certification Schedule and Order Book Vulnerability"
    body: "Boom's 130 airline pre-orders across United Airlines, American Airlines, and Japan Airlines represent conditional delivery reservations rather than firm purchase contracts. Independent aerospace assessments from Forecast International note that simultaneous clean-sheet certification of an airframe and a bespoke in-house engine has never been accomplished in a three-year timeframe, creating significant schedule slip risk into the 2030s that leaves non-binding airline commitments vulnerable to deferral or cancellation."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM011"
  - calloutType: "insight"
    title: "Superpower Turbine Serves as an Industrial Bridge and Manufacturing Hedge"
    body: "By packaging the Symphony engine core into the Superpower industrial turbine for AI data centers and securing a 1.21 GW commercial commitment from Baker Hughes for deliveries beginning in mid-2026, Boom creates a near-term revenue stream and shared manufacturing scale that hedges against commercial aviation certification delays."
    claimRefs:
      - "CM009"
      - "CM010"
