chapter:
  number: 7
  title: "Risks"
  summary: "Boom Supersonic faces acute technological, regulatory, and capital risks as a pre-revenue aerospace startup undertaking clean-sheet airframe and propulsion development. Schedule slippage on the proprietary Symphony turbofan poses the greatest existential threat, compounded by restrictions on overland supersonic flight and severe fuel cost penalties from sustainable aviation fuels."
sections:
  - id: "regulatory-and-legal-risk"
    title: "Regulatory and Certification Framework"
    body: "Commercial supersonic flight operates under stringent regulatory constraints established during the Concorde era, most notably the federal ban on overland supersonic civil flights under 14 CFR 91.817. While a 2025 executive order directed the FAA to initiate rulemaking permitting overland operations that avoid ground-level sonic booms, and the Supersonic Aviation Modernization Act has passed the House of Representatives, the legislation remains pending in the Senate without guaranteed enactment timelines. Internationally, ICAO Chapter 14 and FAA Stage 5 noise standards require Overture to operate without afterburners, necessitating unproven medium-bypass turbofan acoustics. Without comprehensive regulatory relief and bilateral overflight approvals, Overture's addressable commercial routes remain constrained to transoceanic corridors, capping fleet utilization."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR005"
    tableRefs:
      - "TR001"
  - id: "operational-and-propulsion-failure-modes"
    title: "Propulsion Engineering and Operational Risk Architecture"
    body: "Developing a clean-sheet supersonic commercial powerplant without an incumbent engine OEM represents the program's primary technical vulnerability. Following Rolls-Royce's withdrawal from supersonic civil propulsion development, Boom assumed direct responsibility for the Symphony engine, coordinating design with Florida Turbine Technologies and assembly with StandardAero. Clean-sheet commercial turbofan development typically requires several billion dollars and extensive testing cycles to resolve aerodynamic flutter, compressor stall, and thermal endurance issues. Although the XB-1 demonstrator validated composite structures and intake aerodynamics during its January 2025 supersonic flight test, scaling these technologies to a four-engine Mach 1.7 passenger airliner carrying 64 to 80 passengers introduces substantial structural and aeroelastic certification challenges."
    claimRefs:
      - "CR004"
      - "CR006"
      - "CR007"
      - "CR010"
    tableRefs:
      - "TR002"
  - id: "supplier-and-counterparty-dependencies"
    title: "Supply Chain Interdependence and Partner Concentration"
    body: "Boom's asset-light manufacturing strategy relies upon a consortium of tier-one aerospace suppliers, creating operational dependencies across specialized single-source vendors. Propulsion engineering depends directly on Florida Turbine Technologies, while engine assembly and maintenance testing are centralized with StandardAero in San Antonio. High-temperature materials require specialized nickel-based superalloys from ATI, and the flight deck integrates Honeywell Anthem avionics with Universal Avionics head-wearable displays. Furthermore, production scaling depends on operationalizing the 66-aircraft capacity Overture Superfactory in Greensboro, supported by $121 million in North Carolina state and local incentive packages. Any technical bottleneck, labor disruption, or delivery delay among these interdependent partners threatens cascade delays across the integrated aircraft delivery schedule."
    claimRefs:
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR003"
  - id: "commercial-capital-and-residual-exposure"
    title: "Commercial Conversion, Fuel Economics, and Capital Model Viability"
    body: "Boom's commercial business model hinges upon maintaining manageable operating economics and premium ticket pricing of approximately $5,000 for transatlantic routes. However, powering supersonic flight exclusively with sustainable aviation fuels poses acute cost and availability risks, with independent studies projecting SAF expenses up to 25 times higher than conventional jet fuel. Moreover, while Boom reports 130 pre-orders from United, American, and Japan Airlines, these commitments consist largely of conditional options contingent upon performance milestones rather than firm, non-refundable purchase agreements. As a private entity with over $600 million raised, Boom faces substantial capital intensity, requiring bridge revenues from its late-2027 Superpower turbine deliveries to fund development until full commercial transport certification."
    claimRefs:
      - "CR001"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    figureRefs:
      - "FR001"
