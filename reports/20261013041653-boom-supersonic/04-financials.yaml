  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: private-financial-gaps
      missingEvidence: Audited balance sheet, current monthly cash burn rate, and unencumbered cash runway entering late 2026.
      whyItMatters: >-
        Without audited burn rate and available cash reserves, underwriters cannot verify whether Boom has sufficient
        runway to reach the Symphony engine first-run and Superpower assembly milestones without near-term dilutive
        emergency financing.
      diligencePath: >-
        Obtain private audited financial statements, 24-month rolling cash flow forecast, and current bank balance
        verification under NDA.
      relatedQuestionRefs:
        - QI009
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: material
      topic: order-book-deposit-terms
      missingEvidence: Escrow and refundability contract terms for the 130 airline aircraft pre-orders and deposits.
      whyItMatters: >-
        If airline deposits are fully refundable or conditional upon unmet performance and certification milestones, the
        order book cannot be underwritten as firm contractual revenue backlog or working capital.
      diligencePath: >-
        Request customer contract schedules, deposit refundability covenants, and letter-of-credit terms for American,
        United, and JAL commitments.
      relatedTableRefs:
        - TI001
    - type: conflicting-data
      severity: material
      topic: superpower-commercial-backlog
      missingEvidence: >-
        Executed binding purchase contracts and site interconnect agreements for replacement Superpower turbine buyers
        following Crusoe cancellation.
      whyItMatters: >-
        CEO Blake Scholl stated plans for 250 MW of 2027 deliveries to unnamed counterparties, but lack of verified
        customers leaves near-term turbine commercialization unproven.
      diligencePath: >-
        Require customer names, power purchase agreements, interconnection studies, and deposit verification for all
        replacement Superpower off-takers.
      relatedTableRefs:
        - TI001
