  name: Boom Supersonic
chapter:
  number: 4
  title: Financials
  summary: >-
    Boom Supersonic remains a pre-revenue aerospace developer facing an estimated $6B to $8B capital requirement to
    bring Overture to commercial service, with near-term turbine monetization destabilized by the September 2026 Crusoe
    contract cancellation and private cash burn undisclosed.
sections:
  - id: revenue-model-and-commercial-traction
    title: Revenue Model, Pricing, and Commercial Traction
    body: >-
      Boom Supersonic is structured around two distinct revenue pillars: the long-term flagship Overture supersonic
      airliner and the nearer-term Superpower industrial gas turbine program. For Overture, Boom pursues a traditional
      commercial original equipment manufacturer (OEM) business model centered on airframe deliveries paired with
      long-term aftermarket parts and maintenance services. The company currently reports an order book of 130 aircraft
      spanning commercial reservations from American Airlines, United Airlines, and Japan Airlines. However, these
      commitments represent early-stage orders and pre-orders rather than finalized, irrevocable delivery contracts.
      With Overture list pricing set at approximately $200 million per airframe, the published order book indicates a
      headline pipeline value exceeding $26 billion, yet realized cash inflows to date are limited to developmental
      milestone deposits. To generate bridging cash flow before Overture enters service in the early 2030s, Boom
      introduced Superpower, a 42 MW natural-gas turbine derived from the core of its proprietary Symphony turbofan
      engine. While management targeted roughly 250 MW of Superpower deliveries in 2027 and 1 GW in 2028, the
      cancellation of Crusoe Energy launch commitments in September 2026 leaves this bridge unanchored by public
      commercial off-takers.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI009
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: pricing-monetization-and-unit-economics
    title: Monetization Framework and Operating Unit Economics
    body: >-
      Monetization of supersonic passenger aviation depends on closing the historical unit-economics deficit that
      grounded Concorde. Boom asserts that Overture will unlock sustainable airline profitability by achieving passenger
      ticket price parity with conventional subsonic business class on over 600 identified transoceanic routes.
      Nevertheless, realized airline operating margins will be governed by fuel efficiency, utilization, and engine
      durability. Overture is architected to operate exclusively on 100% sustainable aviation fuel (SAF) using a
      four-engine non-afterburning medium-bypass turbofan layout. Independent aerodynamic reviews emphasize that without
      massive industrial scaling and cost deflation of synthetic SAF production, Overture fuel-burn-per-seat-mile
      expenses could remain prohibitively high relative to modern wide-body subsonic airliners. On the maintenance
      dimension, Boom and its propulsion partners aim to mitigate lifecycle maintenance burdens through the Symphony
      engine program, targeting a 25% increase in time on wing and a 10% reduction in operating maintenance bills
      relative to legacy supersonic configurations. Engine assembly and overhaul are contracted with StandardAero in San
      Antonio, Texas, designed to scale to 330 engines annually, but these efficiency assumptions remain unproven prior
      to prototype core run cycles.
    claimRefs:
      - CI003
      - CI007
      - CI008
      - CI014
    tableRefs:
      - TI002
  - id: cost-structure-capital-adequacy-and-burn
    title: Capital Adequacy, Cash Burn, and Financing Dependencies
    body: >-
      Developing a clean-sheet supersonic commercial airliner and bespoke turbofan engine is among the most
      capital-intensive undertakings in global industrial manufacturing. Historically, commercial supersonic airliners
      were developed only by sovereign governments with billions in national subsidies. Boom estimates that completing
      the Overture program will require between $6 billion and $8 billion in total developmental capital, funded through
      a combination of private venture capital, airline pre-delivery milestone payments, and supplier risk-sharing
      agreements. Across its disclosed equity rounds and developmental awards, Boom has raised nearly $1 billion,
      leaving an estimated $5 billion to $7 billion funding gap to reach commercial type certification and series
      manufacturing. Capital allocation is further constrained by near-term physical infrastructure commitments. At
      Piedmont Triad International Airport in Greensboro, North Carolina, Boom completed construction on its
      179,000-square-foot Overture Superfactory, but airport authority lease covenants permit lease termination if Boom
      employs fewer than 500 workers at the site by December 31, 2026. As a privately held enterprise, Boom does not
      publicly disclose its cash on hand, monthly cash burn, or unencumbered runway, creating substantial information
      asymmetry for external underwriting.
    claimRefs:
      - CI006
      - CI010
      - CI011
      - CI012
    tableRefs:
      - TI003
  - id: financial-underwriting-verdict-and-diligence-blockers
    title: Financial Underwriting Verdict and Diligence Blockers
    body: >-
      From an institutional underwriting perspective, Boom Supersonic presents an asymmetric, high-beta venture profile
      characterized by multi-billion-dollar forward capital requirements and severe near-term execution hurdles. Revenue
      quality is currently speculative: the core aviation program generates zero recurring revenue, airline deposits
      remain opaque regarding refundability and escrow covenants, and the near-term Superpower data-center power revenue
      bridge has lost its sole public anchor following Crusoe withdrawal. While XB-1 flight testing successfully
      de-risked low-speed and supersonic aerodynamics, the capital required to certify the Symphony engine and build
      production tooling at the Greensboro Superfactory will necessitate substantial additional equity or debt
      syndication. Crucial underwriting variables—including monthly cash burn, net unencumbered liquidity, tier-1
      supplier cost guarantees, and binding off-taker agreements for Superpower turbines—are completely absent from
      public disclosures. Underwriters cannot model a credible solvency bridge without non-public disclosures detailing
      escrowed customer deposits, supplier fixed-price commitments, and covenant compliance timelines.
    claimRefs:
      - CI001
      - CI006
      - CI009
      - CI010
      - CI012
