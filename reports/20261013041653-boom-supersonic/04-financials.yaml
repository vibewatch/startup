callouts:
  - calloutType: risk
    title: Superpower Launch Cancellation Exposes Revenue Bridge Fragility
    body: >-
      The September 2026 cancellation of Crusoe Energy launch agreement for 29 Superpower turbines eliminated Boom sole
      announced commercial turbine backlog of $1.25 billion, leaving near-term monetization plans reliant on unnamed
      counterparties while Overture remains years from delivery.
    claimRefs:
      - CI004
      - CI005
      - CI009
  - calloutType: insight
    title: Capital Intensity Gap Requires Substantial Further Financing
    body: >-
      With nearly $1 billion raised to date against an estimated $6 billion to $8 billion required to certify and
      manufacture Overture, Boom faces multi-billion-dollar future financing requirements that depend on sustained
      investor risk appetite and carrier milestone payments.
    claimRefs:
      - CI006
      - CI010
      - CI012
