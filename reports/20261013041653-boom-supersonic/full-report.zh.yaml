      - number: '1.4'
        title: 资本需求、推进合作与技术执行风险
        blocks:
          - type: paragraph
            body: >-
              要让民用超音速客机通过联邦适航认证并进入批量交付，需要极其庞大的资本和推进基础设施。外部航空航天工程评估认为，Overture 完整开发需要 $6 billion 至 $8 billion
              总投资；而在近期扩张前，历史股权融资公告合计仅约 $270 million，融资压力很大。2025 年 12 月，Boom 宣布新增 $300 million 资本，同时推出面向人工智能数据中心的
              Superpower 天然气轮机商业计划，借助共用核心架构衔接近期现金流并积累推进系统可靠性。由于 Rolls-Royce、Safran、Honeywell 和 CFM
              等传统涡扇制造商公开拒绝开发定制商用超音速发动机，公司被迫采用自研发动机策略。随后 Boom 与 Florida Turbine Technologies 组建非传统推进联盟，负责涡轮机械设计，并与
              StandardAero 合作在得州 San Antonio 的 100,000-square-foot 工厂组装发动机，使推进执行成为商业运营前的关键瓶颈。
            claimRefs:
              - CO005
              - CO011
              - CO012
              - CO013
              - CO014
