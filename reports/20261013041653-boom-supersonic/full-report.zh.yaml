      - number: '2.3'
        title: 买方细分、机队采购流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              超音速商用机体的采用和采购路径由航空公司的机队规划及资本配置部门主导。United Airlines、American Airlines 和 Japan Airlines 等一级网络航空公司，将 Overture
              视为面向跨大西洋和跨太平洋干线、用于吸引高毛利商务旅客和高等级忠诚会员的高端旗舰资产。机队采购通常需要多年评估：先签署意向书和有条件预订单，再评估发动机性能、运营成本和型号认证里程碑，最后才承诺支付不可退款的确定交付定金。与此同时，次级和专业买方包括国防及政府
              VIP 运输机构；Boom 正与 Northrop Grumman 评估政府任务变体，也在面向采购 Superpower 衍生轮机的工业发电客户。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM009
              - CM010
              - CM012
      - number: '2.4'
        title: 宏观增长驱动、技术执行与监管瓶颈
        blocks:
          - type: paragraph
            body: >-
              商业超音速飞行的采用动力来自企业持续愿意为缩短出行时间付费、高端航空公司提升客舱收益，以及现代数字气动仿真技术让机体可以在 Mach 1.7
              巡航而不依赖高耗油加力燃烧室。但商业市场仍有严峻的结构性约束。陆上超音速运营受 1973 年以来的声学法规限制；尽管 2025 年 6 月的一项行政命令要求 FAA
              制定声学标准，陆上商业可行性仍取决于尚未验证的“无音爆巡航”大气折射技术。此外，Overture 必须使用 100% 可持续航空燃料（SAF）才能满足环保合规目标，而全球 SAF 供应严重不足；Symphony
              定制涡扇发动机还要同步开发并通过 FAA 型号认证，带来显著的多年进度风险。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 双重认证周期与订单簿脆弱性
            body: >-
              Boom 来自 United Airlines、American Airlines 和 Japan Airlines 的 130 架航空预订单，代表有条件的交付预留，而不是确定采购合同。Forecast
              International 的独立航空航天评估指出，从零开始同时认证机体和定制自研发动机，历史上从未在三年内完成；这带来延误到 2030 年代的显著风险，也使非约束性航空公司承诺面临延期或取消。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM011
          - type: callout
            title: Superpower 既是工业桥梁，也是制造对冲
            body: >-
              Boom 将 Symphony 发动机核心封装进面向 AI 数据中心的 Superpower 工业轮机，并获得 Baker Hughes 1.21 GW 的商业承诺，交付从 2026
              年年中开始。这样既能创造近期收入和共用制造规模，也能对冲商业航空认证延误。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 直接同业与历史超音速先例
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 所处的民用超音速客运市场几乎没有正常竞争，主要参照物不是资金充足的活跃初创公司，而是历史失败案例。英法 Concorde 于 2003
              年退役后，没有商业运营商再以超音速搭载付费旅客。Concorde 证明超音速客运在技术上可行，却也表明极高油耗、昂贵维护、有限载客量和严格的陆上音爆禁令，使该平台若无政府补贴便难以商业持续。Boom 希望借助
              Overture 跨越这一历史障碍：飞机计划在海上以 Mach 1.7 巡航，搭载 64 至 80 名乘客，并在 600 多条全球航线上使用 100% 可持续航空燃料。私人飞机领域，Aerion
              Supersonic 曾近 20 年推进 Mach 1.4 的 AS2 公务机，获得初步机队兴趣，并与 General Electric、Boeing 建立技术合作；但公司在 2021 年 5
              月因无法筹足从零开发机体和定制发动机所需的巨额资本而突然停运。Boom 于 2025 年 1 月让 XB-1 验证机成功飞到 Mach 1.122，证明其独立气动执行能力优于
              Aerion；但航空分析师强调，缩比验证机并没有填平通往客运飞机的巨大资本和认证缺口。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP014
