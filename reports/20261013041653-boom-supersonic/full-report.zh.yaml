      - number: '4.3'
        title: 资本充足性、现金消耗与融资依赖
        blocks:
          - type: paragraph
            body: >-
              从零开发商用超音速客机和定制涡扇发动机，是全球工业制造中最资本密集的任务之一。历史上，商用超音速客机只有主权政府在数十亿美元国家补贴下才能完成开发。Boom 估计，完成 Overture 项目需要 $6
              billion 至 $8 billion 开发资本，来源包括私募风险资本、航空公司交付前里程碑付款和供应商风险共担协议。公司披露的股权轮次和开发奖项合计募资接近 $1
              billion，因此距离商业型号认证和批量制造仍有估计 $5 billion 至 $7 billion 缺口。近期实体基础设施承诺进一步限制资本配置。Boom 已在北卡罗来纳州 Greensboro 的
              Piedmont Triad International Airport 建成 179,000-square-foot Overture Superfactory，但机场管理机构的租约约定：若截至 2026 年
              12 月 31 日现场员工少于 500 人，可终止租约。Boom 是私营企业，不公开现金余额、月度现金消耗或无负担资金续航，给外部投资判断造成显著信息不对称。
            claimRefs:
              - CI006
              - CI010
              - CI011
              - CI012
