              Boom Supersonic 将 Overture 定位为商业航空旗舰民用运输机，目标是把跨洋飞行时间较传统亚音速客机缩短一半。Overture 配备全商务舱，可搭载 64 至 80 名乘客，以 Mach
              1.7 的越水巡航速度飞行，最高高度 60,000 英尺，设计航程 4,250 nautical miles。公司的飞行硬件组合以 XB-1
              缩比验证机为核心，用于测试气动外形、数字飞控和复合材料；同时配套计划中的 Greensboro Superfactory 生产园区。
