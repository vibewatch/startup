          detail: 由州政府激励建设的 Greensboro NC 装配线，初始设计产能为每年 33 架，配备工装和总装试验台。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Overture 超音速客机从航空公司采购、技术验证、运营准备到机队部署的六阶段旅程。
    claimRefs:
      - CU001
      - CU006
      - CU008
      - CU010
      - CU012
      - CU014
    data:
      items:
        - label: 阶段 1：战略对齐与航线可行性评估
          stage: 评估
          touchpoints:
            - 机队规划团队对 600 多条潜在跨洋航线建模
            - 航空公司网络分析师评估 Mach 1.7 带来的时刻压缩与商务舱收益对比
          detail: 航空公司评估跨洋航线经济性，以及高端旅客是否愿意为缩短 50% 的飞行时间付费。
          tone: positive
        - label: 阶段 2：附条件预订与选项配置
          stage: 承诺
          touchpoints:
            - 签署附条件飞机采购协议
            - 支付附带履约条款的不可退款定金
          detail: 承运商锁定交付队列优先级，对应 15-20 架确定飞机，另有大批量 35-40 架选项订单。
          tone: positive
        - label: 阶段 3：驾驶舱共同设计与飞行员人体工学验证
          stage: 共同开发
          touchpoints:
            - 航空公司商用飞行员开展模拟器评估
            - Concorde 资深飞行员 Mike Bannister 对力反馈飞控进行基准测试
          detail: 客户飞行员验证新一代驾驶舱界面、侧杆人体工学和视觉系统。
          tone: neutral
        - label: 阶段 4：监管里程碑与 Symphony 发动机认证跟踪
          stage: 技术关口
          touchpoints:
            - 监测 Symphony 发动机试验台测试和 FAA 第 5 阶段 / 第 14 章噪音认证
            - 跟踪 XB-1 超音速飞行测试数据和陆上航行的马赫数上限可行性
          detail: 航空公司以 Boom 实现发动机首飞并获得 FAA/ICAO 环境批准作为资本投入进度的关口。
          tone: warning
        - label: 阶段 5：可持续航空燃料（SAF）基础设施与运营经济性
          stage: 基础设施关口
          touchpoints:
            - 航空公司在枢纽机场锁定 100% SAF 供应链
            - 分析可持续燃料相对传统亚音速煤油最高 25x 的成本溢价
          detail: 商业可行性要求填平国际出发枢纽的 SAF 价格与供应量缺口。
          tone: adverse
        - label: 阶段 6：商业投入运营与航线网络扩张
          stage: 机队部署
          touchpoints:
            - 首批量产 Overture 客机目标于 2029 年至 2030 年代初交付
            - 将 95 架选项飞机转化为确定交付批次
          detail: 承运商在旗舰跨洋航线上部署超音速飞机，并评估执行选项订单以扩展航线网络。
          tone: opportunity
