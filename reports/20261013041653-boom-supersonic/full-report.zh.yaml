            body: >-
              Overture 的航空公司航线部署依赖于优化纽约—伦敦、旧金山—东京等全球金融枢纽之间的高密度跨洋走廊。按当前监管框架，FAA 因社区音爆影响禁止民用飞机飞越大陆陆地，飞机必须在陆上以 Mach 0.94
              的亚音速飞行。这样的运营模式既能让航空公司在海上获得显著时间节省，也能接入现有国际机场的登机口设施、跑道长度范围和 ICAO Chapter 14 噪声认证标准，无需专用地面支持基础设施。
