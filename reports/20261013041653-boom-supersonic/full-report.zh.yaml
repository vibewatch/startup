      - number: '6.2'
        title: 采用轨迹与订单簿里程碑
        blocks:
          - type: paragraph
            body: >-
              Boom 的商业采用在过去十年经历了清晰阶段，从早期战略种子期背书走向大型机队预订单。2017 年 12 月，Japan Airlines 通过投入早期战略资本并锁定 20
              架飞机的选择权，为这家初创公司提供最初的机构验证。2021 年 6 月，United Airlines 成为首家签署飞机采购协议的美国航空公司，承诺购买 15 架 Overture，另加 35
              架选择权，项目由此获得主流商业势头。2022 年 8 月，全球机队规模最大的航空公司 American Airlines 又签署 20 架飞机协议，并可选择再购 40 架，同时支付不可退款现金定金。加上包括
              $60 million U.S. Air Force 奖项在内的国防研究合同，Boom 已公布的商业订单簿为 130 架订单和预订单。2025 年 1 月 28 日，XB-1 在 Mojave Desert
              上空以 Mach 1.122 突破音障，进一步巩固了技术进度。尽管 Boom 目标是在 2029 年投入商业运营，独立航空航天分析师普遍预计飞行测试、发动机集成和 FAA 型号认证会把首批航空公司交付推迟到
              2030 年代初。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU009
