      - number: '4.4'
        title: 财务投资判断与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              从机构投资判断角度看，Boom Supersonic 是一种非对称、高 beta
              的风险投资标的，特点是未来需要数十亿美元资本，近期执行门槛极高。收入质量目前仍属推测：核心航空项目没有经常性收入，航空公司定金是否可退及托管约定不透明，而 Superpower 数据中心电力收入桥在 Crusoe
              撤出后失去了唯一公开锚点。XB-1 飞行测试虽然成功降低了低速和超音速气动风险，但 Symphony 认证及 Greensboro Superfactory
              生产工装仍需大量新增股权或债务融资。月度现金消耗、净无负担流动性、一级供应商成本保证，以及 Superpower
              轮机的约束性承购协议等关键投资判断变量，均未在公开披露中出现。若没有包含客户定金托管、供应商固定价格承诺和契约合规时间表的非公开资料，投资人无法建立可信的偿付能力过渡模型。
            claimRefs:
