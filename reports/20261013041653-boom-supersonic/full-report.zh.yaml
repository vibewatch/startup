          detail: Honeywell Anthem 航空电子套件、双 Universal Avionics 光圈摄像头、BAE Systems 主动式侧杆，以及新一代合成视觉。
        - label: 气动机身层
          detail: 复合三角鸥翼、带面积率化轮廓的碳复合材料机身，以及数字线传飞控舵面。
        - label: Symphony 推进系统层
          detail: 四台定制中涵道比涡扇发动机，提供 35,000 lbf 推力，由 FTT 和 StandardAero 共同设计，适配 100% SAF。
        - label: 热力学与燃油系统
          detail: 冷却式涡轮叶片材料、热管理换热器，以及集成式湿翼可持续航空燃料箱。
        - label: 缩比飞行测试验证
          detail: XB-1 缩比验证机身，验证跨音速激波空气动力学和超音速航路稳定性。
