      - number: '2.2'
        title: 市场规模视角、机队预测与航线容量
        blocks:
          - type: paragraph
            body: >-
              评估市场规模需要综合全球高端航空旅客容量、航空公司商用机队更新和扩张支出，以及近期制造商交付能力。全球洲际高端旅客支出构成广义总可服务市场（TAM），国际商务舱和头等舱航线年支出超过 $40
              billion。可服务市场（SAM）受飞机运营半径和声学走廊限制，约有 600 条已识别的盈利跨洋城市对，可在 4,250 nautical mile 满载航程内支持 Mach 1.7
              运营。最终，可获取市场（SOM）受制造吞吐量和资本可得性约束：Boom 已完成北卡罗来纳州 Greensboro 的 Overture Superfactory 初始建设，设计年产能可扩展至每年 33 至 66
              架；目前已从 United Airlines、American Airlines 和 Japan Airlines 获得 130 架非约束性订单及预订单。
            claimRefs:
              - CM001
