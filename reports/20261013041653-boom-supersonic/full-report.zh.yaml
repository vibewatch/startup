      - number: '6.3'
        title: 具名客户承诺与合同结构
        blocks:
          - type: paragraph
            body: >-
              对 Boom 客户组合的严格尽调显示，表面承诺与有约束力的采购负债之间差异明显。American Airlines 是 Boom 确信度最高的商业客户，已为 20 架机体承诺现金定金，并可选择再购 40
              架。United Airlines 持有 15 架飞机及 35 架选择权的采购协议，Japan Airlines 则持有 20 架飞机的选择权。但所有商业航空承诺都以 Boom
              达到严格的性能、环保和安全基准为前提。合同特别要求满足 Stage 5 / Chapter 14 起降噪声阈值、经过验证的超音速巡航航程和 FAA 适航认证。行业中的反向证据表明客户采用远非普遍：Delta
              Air Lines CEO Ed Bastian 于 2022 年公开拒绝下单，理由是超音速单位经济和燃油效率仍有根本性疑问。此外，Delft University 的独立学术分析指出，用 100% SAF
              为超音速飞机加注，航空公司的成本可能是使用传统煤油运营亚音速飞机的二十五倍，给航空公司 CFO 带来严峻的长期运营费用门槛。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
              - CU011
      - number: '6.4'
        title: 留存韧性、扩张循环与下行风险
        blocks:
          - type: paragraph
            body: >-
              商业航空的客户留存和合同韧性与企业软件指标有根本不同：Boom 尚未产生收入，也尚未交付飞机，因此净收入留存率目前不适用，韧性要看预订单转化能力和航空公司共同开发参与度。Boom
              将航空公司机组直接嵌入工程循环，以维持客户参与。商业航空飞行员以及 British Airways Concorde 老将 Mike Bannister 对 Overture
              驾驶舱进行了大量模拟器评估，测试侧杆力反馈控制和基于摄像头的视觉系统，以验证飞行运营。现有合同内置扩张空间，共有 95 架可选飞机；若在 600 条建模跨洋航线上运营成功，这些选择权可能让 Boom
              的交付机队增加超过三倍。不过客户集中度极高：两家美国航空公司 American 和 United 占 Boom 订单簿 130 架中的 110 架。若其中任何一家因宏观经济下行或 SAF
              供应不足而重新谈判、推迟交付时段或行使终止权，Boom 的生产经济性和资本续航都将遭受严重冲击。
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU010
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU010
              - CU012
              - CU014
      - number: '6.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 不对称预订单风险与取消脆弱性
            body: >-
              Boom 的 130 架商业订单绝大部分是有条件预订单和选择权，而非不可撤销的采购承诺。American Airlines 虽已为 20 架机体支付不可退款定金，但交付时间延伸到 2030 年代初，若
              Symphony 发动机认证停滞、噪声标准收紧或 SAF 运营成本被证明难以承受，航空公司仍有很大合同空间退出。
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU011
              - CU012
          - type: callout
            title: 国防与工业双轨对冲
            body: >-
              面对漫长的航空公司商业认证周期，Boom 培育了非航空公司客户关系，包括 $60 million Air Force STRATFI 研究合同，以及与 Northrop Grumman
              的国防研究合作。公司还在探索 Symphony 发动机核心的工业天然气轮机变体 Superpower，以建立运营收入桥，并在客运服务前积累可靠性运行小时。
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与认证框架
        blocks:
          - type: paragraph
            body: >-
              商业超音速飞行受 Concorde 时代建立的严格监管约束，最突出的是 14 CFR 91.817 对陆上民用超音速飞行的联邦禁令。尽管 2025 年行政命令要求 FAA
              启动规则制定，允许避免地面音爆的陆上运营，且 Supersonic Aviation Modernization Act 已在众议院通过，但法案仍待参议院审议，能否通过及何时实施都没有保证。国际上，ICAO
              Chapter 14 和 FAA Stage 5 噪声标准要求 Overture 不使用加力燃烧室，因此中涵道比涡扇的声学性能仍未经证明。没有全面监管放松和双边飞越批准，Overture
              的可触达商业航线仍局限于跨洋走廊，机队利用率也会受压。
            claimRefs:
              - CR002
              - CR003
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR005
      - number: '7.2'
        title: 推进工程与运营风险架构
        blocks:
          - type: paragraph
            body: >-
              在没有传统发动机 OEM 支持的情况下从零开发商用超音速动力装置，是项目首要技术弱点。Rolls-Royce 退出民用超音速推进开发后，Boom 直接承担 Symphony 发动机责任，与 Florida
              Turbine Technologies 协调设计，并由 StandardAero 负责组装。从零开发商用涡扇通常需要数十亿美元和大量测试周期，才能解决气动颤振、压气机失速和热耐久性问题。XB-1 虽在 2025
              年 1 月的超音速飞行测试中验证了复合材料结构和进气道气动性能，但将这些技术扩展到 4 发动机、Mach 1.7、载客 64 至 80 人的客机，仍会带来重大的结构和气弹性认证挑战。
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR010
      - number: '7.3'
        title: 供应链相互依赖与合作伙伴集中
        blocks:
          - type: paragraph
            body: >-
              Boom 的轻资产制造策略依赖一级航空航天供应商联盟，因而在专业单一来源供应商之间形成运营依赖。推进工程直接依赖 Florida Turbine Technologies；发动机组装和维护测试集中在 San
              Antonio 的 StandardAero。高温材料需要 ATI 提供专用镍基高温合金，驾驶舱则把 Honeywell Anthem 航电与 Universal Avionics 可穿戴头显集成。生产扩张还依赖
              Greensboro 的 Overture Superfactory 实现 66 架产能，该工厂得到 $121 million
              北卡罗来纳州及地方激励支持。这些相互依赖的合作伙伴中，任何技术瓶颈、劳工中断或交付延迟，都可能在一体化飞机交付进度中形成连锁延期。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 商业转化、燃油经济与资本模式可行性
        blocks:
          - type: paragraph
            body: >-
              Boom 的商业模式依赖于维持可控运营经济性，以及跨大西洋航线约 $5,000 的高端票价。但完全使用 SAF 驱动超音速飞行，带来尖锐的成本和供应风险；独立研究预计 SAF 费用最高可达传统喷气燃料的二十五
              倍。此外，Boom 虽报告 United、American 和 Japan Airlines 合计 130
              架预订单，但这些承诺大多是取决于性能里程碑的有条件选择权，而非确定且不可退款的采购协议。作为一家已募资超过 $600 million 的私营企业，Boom 资本密集度很高，需要依靠 2027 年末
              Superpower 轮机交付形成过渡收入，才能支撑开发至完整商业运输认证。
            claimRefs:
              - CR001
              - CR012
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR014
              - CR015
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 从零推进认证是首要进度致命风险
            body: 在没有传统商用发动机 OEM 的情况下开发 Symphony 发动机，会引入严重技术和进度风险；Forecast International 预计，考虑到从零认证的障碍，商业投入运营将延迟到 2030 年代。
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
          - type: callout
            title: 尽调必须核实定金不可退款性与 Superpower 收入里程碑
            body: 投资人应核实 American 和 United 的航空承诺是否包含不可退款的里程碑罚金，并密切跟踪 Superpower 地面轮机在 2027 年末的交付计划，因为它们将充当收入桥。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与战略反论点
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 的核心投资逻辑建立在前所未有的航空公司商业需求和已经验证的空气动力学能力之上。包括 United Airlines、American Airlines 和 Japan
              Airlines 在内的头部航空公司，已为 Overture 客机下达超过 130 架订单和预订单，说明航空公司确实把速度视为溢价产品而需要。2025 年 1 月，XB-1 验证机以 Mach 1.122
              实现超音速飞行，验证了 Boom 的复合材料机体结构和飞控软件。然而，反向逻辑同样严峻：独立航空环保分析显示， 超音速运输机每位乘客每公里的燃油消耗是现代亚音速飞机的七至九
              倍，使航空运营商暴露于巨大的燃油成本波动和可持续性压力之下。此外，Rolls-Royce、 Safran 和 General Electric 等顶级发动机制造商历史上拒绝合作，迫使 Boom 自研
              Symphony 推进系统，带来极高的技术和适航认证门槛。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: 估值背景与收入前的资本结构
        blocks:
          - type: paragraph
            body: >-
              Boom 在 2025 年 12 月由 Darsana Capital Partners 领投的 Series B 融资中达到 $1.5B 投后估值；该轮融资筹得 $300M，使累计融资增至约
              $901M。这轮融资前，Series B 的股权稀释估计为 20%，此前 Series A-1 轮的稀释约为 23%。与 Boeing、Airbus、Bombardier 和 Embraer
              等公开航空航天制造商相比——它们的收入倍数在 1.7x 至 2.5x 之间——Boom 目前的私人估值显得偏高，因为公司仍完全没有收入且每年大量消耗现金。 尽管 IPO
              前平台上仍有老股交易兴趣，新资金仍面临无法量化的风险：13 轮历史股权融资中的清算优先权和优先级堆叠尚未披露。公开审计的股权结构表细节缺失， 使外部投资者无法验证下行轮重组情景下普通股的下行回收门槛。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV015
      - number: '8.3'
        title: 情景分析与下行回报画像
        blocks:
          - type: paragraph
            body: >-
              由于资本密集度极高，Boom Supersonic 在不同运营情景下的估值结果分化明显。商业化 Overture 客机预计需要 $6B 至 $8B，这与现有资本之间形成尚未解决的数十亿美元
              融资缺口。在乐观情景（概率 20%）下，Boom 于 2030 年取得 FAA 型号合格证，将 130 架预订单转化为正式交付，单架价格约 $200M，并将 Greensboro Superfactory
              扩大到企业估值 $3.5B 至 $5.0B。在基准情景（概率 50%）下，认证延迟将商业化推迟至 2032–2033 年，迫使公司进行大规模新增稀释融资， 企业回报压缩至 $1.2B 至
              $1.8B。在悲观情景（概率 30%）下，发动机技术受挫或航空公司取消订单，引发类似 Aerion Supersonic 清算的困境重组， 使股权价值跌破 $400M。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: 建议、尽调要求与终止标准
        blocks:
          - type: paragraph
            body: >-
              XB-1 展现出的技术突破，与从零开发商用飞机所需的巨大资本投入相权衡后，明确的尽调建议是“观察”。Boom 正通过与 Florida Turbine Technologies 和 StandardAero
              建立工程合作来缓解推进系统瓶颈，但 Symphony 发动机核心的硬件测试仍处于早期开发阶段。在 Boom 满足以下尽调终止标准前，投资者不应投入 成长资本：第一，独立验证全尺寸 Symphony
              发动机核心试验台数据；第二，公开审计不可退款客户定金的转化率和积压订单留存率；第三，清晰掌握 Series B 清算优先权结构。United Airlines 或 American Airlines
              如出现任何重大取消，或发动机认证延误未能缓解并超过 2031 年，都应立即触发投资逻辑失效。
            claimRefs:
              - CV009
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV009
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: “克制胜过炒作：为什么‘观察’是唯一站得住的姿态”
            body: >-
              Boom Supersonic 虽已凭 XB-1 超音速飞行取得令人印象深刻的技术里程碑，但要把 Overture 客机商业化，仍需扩大定制发动机项目并填补数十亿美元融资缺口。
              “观察”的投资建议，既考虑超音速旅行复兴的巨大潜力，也正视 8 至 10 年的收入前执行窗口和沉重的优先权负担。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
          - type: callout
            title: Aerion 前车之鉴与从零开发发动机的脆弱性
            body: >-
              超音速航空的历史表明，机体开发最终受制于发动机供应。Rolls-Royce 于 2022 年退出后，Boom 决定自研 Symphony 发动机，重演了导致竞争对手 Aerion Supersonic 于
              2021 年清算的资本和工程压力。投资者必须把 Symphony 里程碑验证视为任何资金投入的必要前提。
            calloutType: risk
            claimRefs:
              - CV008
              - CV013
