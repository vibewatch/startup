  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分与目标买方画像
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 将可触达市场分为三类主要客户：全球大型网络航空公司、国际旗航空公司和政府国防机构，外加逐渐成形的工业发电概念。以 American Airlines 和 United
              Airlines 为代表的干线网络航空公司，是核心商业买方。它们运营庞大的跨大西洋和跨太平洋枢纽网络，拥有足以支撑高端票价的企业客户基础。对这些买方而言，Overture
              是一项面向纽约—伦敦、旧金山—东京等黄金商务航线、用于吸引高毛利商务出行的旗舰资产，可将传统飞行时间缩短约一半。Japan Airlines
              等国际旗航空公司则聚焦长途太平洋航线，超音速速度可大幅压缩航程。除商业客运航空公司外，U.S. Air Force 也是机构研究赞助方，寻求高速行政运输和专业运营能力。但由于商业客机预计贡献超过 95%
              的项目收入，Boom 几乎完全依赖航空公司的资本开支周期。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
              - CU013
              - CU015
          - type: table
