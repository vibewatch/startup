      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 推进不对称与发动机联盟瓶颈
            body: >-
              Rolls-Royce、GE、Safran 和 Pratt & Whitney 等传统发动机巨头集体拒绝资助或生产民用超音速推进系统，迫使 Boom 通过 Florida Turbine Technologies
              和 StandardAero 主导从零开发 Symphony 涡扇。这样虽保留了项目自主权，但商业发动机的开发和认证历来耗资数十亿美元，成为 Boom 最尖锐的技术和财务脆弱点。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: 速度优势与机队通用性的权衡
            body: >-
              American 和 United 等网络航空公司并不把 Overture
              当作高容量宽体机的替代品，而是用它在高端跨洋航线上吸引高收益商务旅客的专门旗舰资产。由于超音速飞机无法匹敌现代复合材料双通道客机的腹舱货运收入、客座密度或全球陆上航线灵活性，Overture
              更可能补充现有机队，而非取代它们。
