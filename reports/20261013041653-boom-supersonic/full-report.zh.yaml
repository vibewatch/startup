chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、产品范围与商业模式
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 由软件工程师兼创业者 Blake Scholl 于 2014 年创立，总部位于科罗拉多州丹佛。公司希望在 Concorde 于 2003
              年退役后重启民用超音速客运，把速度变成主流航空服务，而不是高成本的政府形象工程。其旗舰商用平台 Overture 是一款四发动机客机，设计巡航速度为 Mach 1.7、巡航高度为 60,000
              英尺，全商务舱可搭载 65 至 80 名乘客。Boom 通过向大型国际航空公司销售客机获得收入，目前已从 American Airlines、United Airlines 和 Japan Airlines 获得
              130 架飞机的已公布订单簿，包含确定订单和预订单。公司仍是私营企业；2025 年末一轮重大融资后，据报道二级市场给出的估值为 $1.5 billion。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: 高管领导、职能执行与治理风险
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 的战略走向仍与创始人兼首席执行官 Blake Scholl 高度绑定。Scholl
              先打造移动电商技术，再用个人积蓄资助早期航空航天概念研究，随后创办公司。商业航空关系、监管策略和州级经济合作谈判由总裁兼首席商务官 Kathy Savitt 负责；她曾任职于 Yahoo 和 Amazon，并主导
              Boom 生产设施的州级激励争取。飞行测试和试验机飞行包线扩展由首席试飞员 Tristan Brandenburg 领导；这名前海军试飞员曾在 2025
              年初驾驶公司的缩比验证机完成超音速走廊测试。管理层展现了较强的商业谈判和试验飞行执行能力，但公开文件几乎没有披露独立公司治理和正式董事会监督机制，因此 Scholl
              在资本配置、技术节奏和合作伙伴协同上存在显著关键人物依赖。
            claimRefs:
              - CO003
              - CO004
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO009
      - number: '1.3'
        title: 开发进度、飞行包线扩展与生产基础设施
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 已从计算流体力学设计，逐步推进到实体飞行硬件验证和工业化制造。2016 至 2022 年间，工程团队评估了 51 次气动迭代，完成 26 million 次软件核心小时计算，将
              Overture 从最初的三发动机概念改进为四发动机方案，并加入专有鸥翼、按面积率设计的流线型机身和碳纤维复合材料机体。2022 年 1 月，Boom 选定北卡罗来纳州 Greensboro 的 Piedmont
              Triad International Airport 建设主要生产设施，并获得超过 $121 million 的州和市级激励，其中包括 $107 million 的专用道路和公用设施扩建。Overture
              Superfactory 于 2024 年年中完工，建成可扩展至年产 66 架超音速飞机的装配基地。缩比 XB-1 验证机完成 11 次有人驾驶飞行后，于 2025 年 1 月在 Mojave Air &
              Space Port 上空、35,290 英尺高度达到 Mach 1.122，从实证上验证了飞行动力学和控制系统。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO015
