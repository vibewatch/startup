      - - 风险评级
        - 高
        - 高资本密集度的全新设计飞机与定制 Symphony 发动机开发，面临重大的执行、技术和监管障碍。
        - 限制投机性配置的敞口；针对开发延误设置严格止损触发条件。
      - - 估值立场
        - 偏高
        - 2025 年 12 月 B 轮融资投后估值达到 $1.5B（累计融资 $901M），但公司商业收入为零且开发烧钱严重。
        - 当前估值已计入顺利执行的预期；上市航空航天可比公司按收入的 1.7x-2.5x 交易。
    notes: 评估综合了 2025 年 12 月融资条款、XB-1 飞行测试结果和航空航天制造业比较基准。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV015
  - id: TV002
    title: 正题与反题平衡矩阵
    columns:
      - 立场
      - 核心论点
      - 证据锚点
      - 证伪转折触发条件
    rows:
      - - 正题
        - 商业需求空前强劲：United、American 和 Japan Airlines 等全球一线航空公司寻求机队速度差异化，已下单及预订 130+ 架飞机。
        - United Airlines、American Airlines 和 Japan Airlines 已下单及预订 130+ 架，并承诺支付不可退款定金。
        - United 或 American Airlines 取消订单或要求退款，导致确定订单降至 50 架以下。
      - - 正题
        - XB-1 验证机于 2025 年 1 月成功完成超音速飞行，达到 Mach 1.122，技术去风险取得进展。
        - XB-1 由人类飞行员驾驶完成 Mach 1.122 超音速飞行，验证了复合材料气动结构与数字飞控架构。
        - Symphony 发动机核心机台架测试失败，或无法证明被动冷却与超音速进气效率。
      - - 反题
        - 累计融资资本 $901M 与完成 Overture 型号合格审定所需 $6B 至 $8B 之间存在巨大的资本支出缺口。
        - 公司估算要进入商业市场需要 $6B-$8B，但 13 轮融资仅获得 $901M。
        - 获得非稀释性政府项目融资或主权共同开发资金，覆盖剩余资本需求的至少 50%。
      - - 反题
        - 在传统发动机 OEM 历史性退出后，推进系统依赖严重，独立开发发动机的风险升高。
        - Rolls-Royce 于 2022 年 9 月结束初步研究，主要商用发动机供应商也拒绝开发，迫使公司自行推进 Symphony 项目。
        - Florida Turbine Technologies 与 StandardAero 成功完成全尺寸 Symphony 核心机静态测试和耐久性里程碑。
    notes: 转折点反映可观察的运营、监管或融资事件，可能触发评级上调或论点失效。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 情景估值与下行分布
    columns:
      - 情景
      - 概率
      - 核心运营假设
      - 估值 / 资本逻辑
      - 下行风险与终止触发条件
    rows:
      - - 乐观情景
        - 20%
        - Symphony 核心机按计划投入运行；Greensboro Superfactory 达到初始产率；FAA 于 2030 年完成型号合格审定；130 架预订以每架约 $200M 转化为确定交付。
        - $3.5B - $5.0B 企业估值由航空公司交付前进度付款和超过 $20B 的商业交付积压订单支撑。
        - 发动机认证延误至 2031 年之后，或监管机构拒绝陆上无音爆巡航航路。
      - - 基准情景
        - 50%
        - Overture 认证延后 24-36 个月至 2032-2033 年；资本需求上升至 $8B-$10B；需要以持平至小幅上调估值进行次级及战略股权融资。
        - $1.2B - $1.8B 估值区间，反映大量优先权悬置、每轮约 20-25% 的高额股权稀释，以及长期现金消耗。
        - 当前现金耗尽后 18 个月内无法获得后续股权融资或债务工具。
      - - 悲观情景
        - 30%
        - Symphony 开发成本超支，迫使项目重新设计；航空公司客户依据重大延误条款取消预订选项；资本市场对未产生收入的航空项目关闭。
        - 低于 $400M 的清算或困境重组；股权严重减值，类似 Aerion Supersonic 等历史商业超音速项目的失败。
        - 主要承运商撤回定金，或 Piedmont Triad Superfactory 终止装配运营。
    notes: 情景基于资本消耗速度和航空航天周期动态，模拟截至 2030 年商业投入运营窗口的潜在结果。
    claimRefs:
      - CV003
      - CV010
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: Boom Supersonic 里程碑与飞行包线验证时间线
    type: timeline
    summary: 时间线追踪 Boom Supersonic 从成立、空气动力学仿真，到 Superfactory 建设、超音速飞行测试和涡轮机扩展的历程。
    approximationNotes: 日期反映公开公司公告、新闻稿和飞行测试记录。
    claimRefs:
      - CO001
      - CO008
      - CO009
      - CO010
      - CO015
    data:
      items:
        - label: 公司成立
          date: '2014'
          detail: Blake Scholl 在科罗拉多州丹佛创立 Boom Technology，开发民用超音速客机。
          tone: neutral
        - label: XB-1 验证机亮相
          date: 2016-11
          detail: Boom 推出 XB-1 缩比原型机，用于验证碳复合材料结构和超音速空气动力学。
          tone: neutral
        - label: Superfactory 选址
          date: 2022-01
          detail: 选定位于北卡罗来纳州 Greensboro 的制造工厂，并获得超过 $121M 的州及市级激励。
          tone: positive
        - label: 四发动机鸥翼构型
          date: 2022-07
          detail: 基于 51 次空气动力学迭代中的 26M 核心小时 CFD 建模，完成 Overture 设计定型。
          tone: positive
        - label: Symphony 推进系统项目启动
          date: 2022-12
          detail: 在传统 OEM 退缩后，与 Florida Turbine Technologies 和 StandardAero 宣布开展定制发动机计划。
          tone: warning
        - label: XB-1 首次亚音速飞行
          date: 2024-03
          detail: 原型机在加利福尼亚州莫哈韦航空航天港完成首次有人驾驶试飞。
          tone: positive
        - label: Overture Superfactory 交付
          date: 2024-06
          detail: 完成 Greensboro 主装配设施建设，设计产能可扩展至每年 66 架飞机。
          tone: positive
        - label: XB-1 超音速飞行测试
          date: 2025-01
          detail: 验证机在 35,290 英尺高度以 Mach 1.122 突破音障，验证进气道和空气动力学。
          tone: positive
        - label: 数据中心电力多元化
          date: 2025-12
          detail: 获得 $300M 融资，启动 Superpower 燃气轮机业务，共用 Symphony 核心，为 AI 数据中心供电。
          tone: opportunity
