      - number: '4.2'
        title: 变现框架与运营单位经济
        blocks:
          - type: paragraph
            body: >-
              超音速客运能否变现，取决于能否填补曾让 Concorde 停飞的历史单位经济缺口。Boom 声称，Overture 可在 600
              多条已识别跨洋航线上，把客票价格做到与传统亚音速商务舱相当，从而释放可持续的航空公司利润。但实际运营利润仍由燃油效率、利用率和发动机耐久性决定。Overture 设计为只能使用 100%
              SAF，采用四发动机、无加力燃烧室的中涵道比涡扇布局。独立气动评估强调，如果工业规模无法大幅扩大、合成 SAF 成本无法下降，Overture
              的每座英里油耗成本相对于现代宽体亚音速客机仍可能高得难以承受。维护端，Boom 及其推进合作伙伴希望借 Symphony 项目降低全生命周期维护负担，目标是相对传统超音速配置让翼上时间提升
              25%，运营维护账单降低 10%。发动机将在得州 San Antonio 由 StandardAero 负责组装和大修，设计年产能为 330 台；但在原型机核心运行循环完成前，这些效率假设仍未经证明。
