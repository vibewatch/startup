companyProfile:
  summary: >-
    Boom Supersonic 是一家总部位于丹佛的航空航天公司，由 Blake Scholl 于 2014 年创立，计划通过 Overture 客机和 Symphony 推进系统实现民用超音速旅行商业化。公司已用 XB-1
    验证关键气动性能，建成 Greensboro Superfactory，并拿到已公布的航空公司订单簿；但公司仍处于收入前阶段，在商业运营前还要跨过巨大的适航认证和融资门槛。
