  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与商业进展
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 有两条不同的收入支柱：长期旗舰 Overture 超音速客机，以及近期 Superpower 工业燃气轮机项目。针对 Overture，Boom
              采用传统商用原始设备制造商（OEM）模式，以机体交付为核心，并配套长期售后零部件和维护服务。公司目前报告 130 架订单簿，来自 American Airlines、United Airlines 和 Japan
              Airlines 的商业预留均在其中。但这些承诺仍是早期订单和预订单，不是最终且不可撤销的交付合同。按每架约 $200 million 的 Overture 标价计算，已公布订单簿的名义管线价值超过 $26
              billion；不过截至目前实际现金流入仅限于开发里程碑定金。为在 Overture 于 2030 年代初投入运营前创造过渡现金流，Boom 推出 Superpower，一款从专有 Symphony
              涡扇核心衍生的 42 MW 天然气轮机。管理层原本预计 2027 年交付约 250 MW、2028 年交付 1 GW，但 Crusoe Energy 于 2026 年 9
              月取消启动承诺后，这条过渡收入链已失去公开商业买方支撑。
