            tableRef: TO003
            claimRefs:
              - CO007
              - CO011
              - CO012
      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 通过工业涡轮核心实现推进架构商业化
            body: >-
              Boom 于 2025 年 12 月切入面向 AI 数据中心的 Superpower 天然气轮机，构成一座机会型技术桥梁。公司让工业发电和 Symphony
              飞机发动机共用涡轮机械核心，希望积累运行小时、证明部件可靠性，并在 Overture 获得商业型号认证前数年创造近期收入。
            calloutType: insight
            claimRefs:
              - CO005
              - CO011
          - type: callout
            title: 资本密集度与自研发动机的融资约束
            body: >-
              行业估算显示，认证并制造商用超音速喷气机需要累计 $6 billion 至 $8 billion 资金。Rolls-Royce、Safran 等老牌发动机巨头公开拒绝研发民用超音速动力装置后，Symphony
              的全部财务和工程责任都落在 Boom 身上，形成数十亿美元级的资本需求，并严重稀释现有股东。
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达航空需求与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              商业超音速客运位于洲际民航运输中的专业高速前沿。市场边界聚焦于往返纽约、伦敦、东京、旧金山等国际枢纽的高收益跨洋航线，以及乘坐高端舱位的长途旅客。纳入范围的支出包括航空公司商用机体采购、专用超音速发动机维护和大修合同，以及可将飞行时间缩短约一半的洲际航线客票收入。亚音速窄体客机、因爬升和下降周期及陆上监管限制而无法体现速度优势的国内短途航线、军用和国防超音速平台、私人超音速公务机均不在该商业航空边界内。主要现有替代方案是配备平躺式高端客舱的现代宽体亚音速客机，如
              Boeing 787 和 Airbus A350，以及 Gulfstream G700、Bombardier Global 7500 等超远程专用公务机。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
