        title: 机体架构、Symphony 推进与驾驶舱
        blocks:
          - type: paragraph
            body: >-
              Overture
              的气动架构采用复合三角鸥翼，既优化超音速升阻比，也在无需加力燃烧室的情况下保持低速机场操纵稳定性。机体使用按面积率设计的流线型碳纤维复合材料机身，前段横截面较宽并向后渐缩，以降低跨音速区间的激波波阻。推进系统由
