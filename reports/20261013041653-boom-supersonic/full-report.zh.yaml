      - number: '3.2'
        title: 现有亚音速宽体机与公务航空
        blocks:
          - type: paragraph
            body: >-
              Overture 的主要运营竞争者不是其他超音速飞机，而是主导洲际长途出行的现有亚音速宽体机和远程公务机。过去二十年，Boeing 和 Airbus 将 Boeing 787 Dreamliner、Airbus
              A350 等双发动机复合材料飞机优化到极高气动效率、较低的每座英里油耗、可观的腹舱货运收入，以及超过 8,000 nautical miles 的跨洋航程。Overture
              承诺把跨大西洋和跨太平洋干线的飞行时间减半——纽约至伦敦约 3.5 小时，而亚音速飞机需 6.5 小时——但也要付出重大运营代价。Overture 全商务舱仅容纳 64 至 80
              名乘客，货舱空间很小，还需要专用维护流程。American Airlines 已为 20 架 Overture 支付定金，United Airlines
              也在推进该机型；但网络航空公司更把它当作高端品牌差异化资产，而不是核心机队替代品。对于企业旅客，Bombardier Global 7500、Gulfstream G700 等远程公务机以 Mach 0.90 至
              0.94 的近音速巡航，结合按需排班、私人航站楼和直飞次级机场，为最看重时间的旅客提供了有力的现有替代方案。
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP010
              - CP012
      - number: '3.3'
        title: 推进壁垒、供应能力与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Boom 竞争地位能否持久，取决于其能否解决困扰民用超音速航空数十年的推进瓶颈。Rolls-Royce、General Electric、Safran 和 Honeywell
              等传统发动机制造商以可触达市场规模小、研发成本无法持续为由，正式拒绝开发定制商用超音速发动机后，Boom 只能组建独立推进联盟。              Boom 与 Florida Turbine
              Technologies、StandardAero 及 GE Additive 共同开发的 Symphony，是一款中涵道比涡扇发动机，设计推力为 35,000 pounds、无需加力燃烧室，并与 Boom 的
              Superpower 工业轮机共用核心架构。这一策略让 Boom 掌握全球唯一活跃商用超音速推进项目的专有控制权，对潜在航空航天进入者形成防御性护城河。但从零开始的发动机认证须遵守 FAA Part
              33，需完成严格耐久测试、严苛的热隔离验证，并投入数十亿美元。与此同时，环境和监管限制持续拖累商业化。虽然 FAA 于 2026 年 7 月发布拟议规则制定通知，处理陆上超音速噪声标准，Overture
              目前仍主要受限于跨洋航线；而使用 100% SAF 还会让航空公司承担相对于传统 Jet-A 的高昂燃料溢价，需要持续的高端客舱收益才能维持运营可行性。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
              - CP015
