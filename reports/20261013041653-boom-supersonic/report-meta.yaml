  topStrengths:
    - XB-1's Mach 1.122 supersonic flight validates the basic aerodynamic and control architecture.
    - The company has an announced order book of 130 aircraft across major airline customers.
    - >-
      Boom has moved from design work to physical infrastructure with the Greensboro Superfactory and propulsion
      partnerships.
  topRisks:
    - The Overture and Symphony programs still require a multi-billion-dollar capital raise before commercial service.
    - Custom propulsion development remains the key technical bottleneck after legacy engine OEM withdrawals.
    - The business is still pre-revenue, so execution risk remains high and financing dependence is acute.
  unresolvedGaps:
    - Independent verification of full-scale Symphony engine core testing and endurance.
    - Disclosure of deposit refundability, escrow terms, and conversion rates for airline orders.
    - Visibility into the full liquidation preference stack and future financing terms.
