companyProfile:
  summary: >-
    Boom Supersonic is a Denver-based aerospace company founded in 2014 by Blake Scholl to commercialize civil
    supersonic travel through the Overture airliner and its Symphony propulsion program. The company has validated key
    aerodynamics with the XB-1 demonstrator, built its Greensboro Superfactory, and secured an announced airline order
    book, but it remains pre-revenue and must still clear a large certification and funding hurdle before commercial
    service.
  foundedDate: '2014-01-01'
  founders:
    - name: Blake Scholl
      role: Founder and Chief Executive Officer
      background: Software entrepreneur who later founded Boom to pursue commercial supersonic aviation.
      claimRefs:
        - CO001
  foundingLocation: Denver, Colorado
  headquarters: Denver, Colorado
  productSummary: Overture supersonic passenger aircraft, Symphony propulsion, and related industrial turbine applications.
