  - id: TE003
    title: Technology and Operating Architecture Decomposition
    columns:
      - Subsystem / Layer
      - Functional Role
      - Core Supplier & Architectural Dependency
      - Technical & Delivery Risk
    rows:
      - - Aerodynamics & Airframe
        - Lift generation, wave drag reduction, structural integrity
        - Boom internal design; Aciturri empennage; carbon composites
        - Thermal expansion and fatigue under repeated Mach-1.7 heat cycles
      - - Symphony Turbofan Engine
        - Propulsion without afterburner at 35,000 lbf thrust per unit
        - Florida Turbine Technologies (FTT), GE Additive, StandardAero
        - Clean-sheet turbofan development timeline and turbine blade cooling
      - - Avionics & Flight Deck
        - Navigation, flight management, situational awareness
        - Honeywell Anthem avionics suite, Universal Avionics vision
        - Software integration complexity and FAA Part 25 avionics sign-off
      - - Flight Control Surfaces
        - Fly-by-wire stability and pilot command authority
        - BAE Systems active sidestick inceptors and actuators
        - High-altitude flutter and supersonic control surface aeroelasticity
    notes: Architectural roles and supplier assignments cross-checked against 2024 Farnborough announcements and propulsion partnership releases.
