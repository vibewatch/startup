figures:
  - id: FE001
    title: Overture Supersonic Aircraft System Architecture Stack
    type: stack
    summary: Hierarchical technical architecture decomposed from pilot interface and avionics down to propulsion, aerostructures, and production infrastructure.
    approximationNotes: Layer breakdown synthesizes subsystem configurations announced across Overture design iterations and supplier agreements.
    claimRefs:
      - CE003
      - CE007
      - CE008
      - CE010
      - CE014
    data:
      layers:
        - label: Cockpit & Avionics Layer
          detail: Honeywell Anthem avionics suite, dual Universal Avionics aperture cameras, BAE Systems active inceptors, and next-gen synthetic vision.
        - label: Aerodynamic Airframe Layer
          detail: Compound delta gull wing, contoured area-ruled carbon composite fuselage, and digital fly-by-wire flight control surfaces.
        - label: Symphony Propulsion Layer
          detail: Four bespoke medium-bypass turbofans delivering 35,000 lbf thrust, designed with FTT and StandardAero, engineered for 100% SAF.
        - label: Thermodynamics & Fuel Systems
          detail: Cooled turbine blade materials, thermal management exchangers, and integrated wet-wing sustainable aviation fuel tanks.
        - label: Subscale Flight Test Validation
          detail: XB-1 subscale demonstrator airframe validating transonic shockwave aerodynamics and supersonic corridor stability.
        - label: Superfactory Manufacturing Base
          detail: State-incentivized Greensboro NC assembly line designed for initial 33 aircraft/year capacity, tooling, and final assembly rigs.
callouts:
  - calloutType: insight
    title: Subscale Flight Validation vs. Full-Scale Engine Reality
    body: Boom's January 2025 Mach-1 flight with the XB-1 demonstrator retired fundamental aerodynamic risk regarding the delta-wing planform, but does not de-risk the full-scale Symphony turbofan, which remains years away from FAA certification.
    claimRefs:
      - CE005
      - CE007
      - CE016
  - calloutType: risk
    title: Overland Speed Penalties and Route Economics
    body: Because current regulations prohibit civil supersonic flight overland due to sonic booms, Overture must throttle back to Mach 0.94 over continental landmasses, reducing route time savings and constraining fuel efficiency.
    claimRefs:
      - CE001
      - CE013
