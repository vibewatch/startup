  - id: TE002
    title: Transoceanic Airline Deployment and Passenger Use-Case Matrix
    columns:
      - User Job / Mission
      - Incumbent Subsonic Workflow
      - Overture Supersonic Solution
      - Measurable Operational Benefit
      - Technical & Regulatory Limitation
    rows:
      - - Transatlantic Transit (JFK - LHR)
        - 7.0 hr flight time at Mach 0.80
        - 3.5 hr flight time at Mach 1.7 over water
        - 50% reduction in passenger transit duration
        - Overwater-only supersonic cruise; landing slot coordination
      - - Transpacific Transit (SFO - NRT)
        - 11.0 hr flight time at Mach 0.82
        - 6.0 hr flight time with technical refuel stop
        - 45% reduction in flight duration across Pacific
        - Requires fuel stops on long Pacific stages due to 4,250 nm limit
      - - Overland Continental Transit (JFK - LAX)
        - 5.5 hr flight time at Mach 0.80
        - 4.6 hr flight time at Mach 0.94 subsonic speed
        - 15% to 20% speed improvement without sonic boom
        - FAA overland supersonic ban eliminates Mach-1.7 capability
      - - Airline Fleet Utilization
        - Single transatlantic daily roundtrip cycle
        - Enables two transatlantic roundtrips per airframe/day
        - Doubles daily aircraft productivity and revenue turns
        - Rapid turnaround dependent on high-reliability engine maintenance
    notes: Flight duration benefits modeled on Mach-1.7 cruise over water; Overland legs restricted to Mach 0.94 under current FAA sonic boom regulations.
    claimRefs:
