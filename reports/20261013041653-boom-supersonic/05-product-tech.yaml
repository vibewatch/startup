company:
  name: Boom Supersonic
chapter:
  number: 5
  title: Product & Technology
  summary: Boom Supersonic is developing the Overture Mach-1.7 commercial airliner powered by the bespoke Symphony medium-bypass turbofan and validated by the subscale XB-1 demonstrator. While XB-1 achieved supersonic flight in January 2025 and key tier-one suppliers including Honeywell, FTT, and StandardAero are contracted, full-scale engine development, overland sonic boom restrictions, and high-rate manufacturing at the Greensboro Superfactory present major commercialization hurdles.
sections:
  - id: product-definition-and-fleet-portfolio
    title: Product Definition and Flight Fleet Portfolio
    body: Boom Supersonic positions the Overture airliner as the flagship civil transport in commercial aviation designed to cut transoceanic flight durations in half compared to conventional subsonic airliners. Overture features an all-business-class cabin configured for 64 to 80 passengers, operating at an overwater cruise speed of Mach 1.7 at an altitude up to 60,000 feet with a design range of 4,250 nautical miles. The company’s flight hardware portfolio is anchored by the XB-1 subscale demonstrator aircraft, which serves as a technological testbed for aerodynamic shaping, digital flight controls, and composite materials, alongside the planned Superfactory production campus located in Greensboro, North Carolina.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE014
    tableRefs:
      - TE001
  - id: aerospace-architecture-and-propulsion
    title: Airframe Architecture, Symphony Propulsion, and Flight Deck
    body: Overture’s aerodynamic architecture incorporates a compound delta gull wing designed to optimize supersonic lift-to-drag performance while maintaining low-speed airport handling stability without requiring afterburners. The airframe utilizes an area-ruled contoured carbon-composite fuselage with a wider forward cross-section that tapers aft to minimize shockwave wave drag across transonic regimes. Propulsion is delivered by four wing-mounted Symphony dry medium-bypass turbofans producing 35,000 pounds of thrust each, engineered with Florida Turbine Technologies and StandardAero for 100 percent sustainable aviation fuel operations. In the cockpit, Boom integrates the Honeywell Anthem avionics suite, dual Universal Avionics exterior cameras, and BAE Systems active sidesticks to enhance pilot situational awareness.
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: flight-operations-and-airline-workflow
    title: Flight Operations, Airline Deployment, and Route Integration
    body: Airline route deployment for Overture relies on optimizing high-density transoceanic corridors between major global financial hubs such as New York to London and San Francisco to Tokyo. Under current regulatory frameworks, civil supersonic flight over continental landmasses is prohibited by the FAA due to community sonic boom impacts, necessitating overland flight at subsonic speeds of Mach 0.94. This operational profile allows airlines to capture substantial time savings over oceans while integrating seamlessly into existing international airport gate infrastructure, runway length envelopes, and ICAO Chapter 14 noise certification standards without requiring specialized ground support infrastructure.
    claimRefs:
      - CE001
      - CE012
      - CE013
    tableRefs:
      - TE002
  - id: technical-differentiation-and-diligence-risks
    title: Technical Differentiation, Certification, and Execution Gaps
    body: 'Boom’s primary technical differentiation stems from modern computational aerodynamics, carbon-composite fabrication know-how, and its clean-sheet Symphony propulsion architecture that avoids afterburner fuel penalties. Flight validation was demonstrated on January 28, 2025, when the subscale XB-1 aircraft broke the sound barrier at Mach 1 in Mojave airspace following 11 piloted envelope-expansion test sorties. However, core engineering diligence gaps remain pronounced: full-scale Symphony core testing and flight certification have not yet been demonstrated, long-term turbine blade thermal fatigue under sustained supersonic cruising remains unproven, and high-rate aerostructure manufacturing at the Greensboro Superfactory remains in early construction phases.'
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE011
      - CE014
      - CE016
