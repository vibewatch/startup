callouts:
  - calloutType: "insight"
    title: "Propulsion Architecture Commercialization via Industrial Turbine Core"
    body: "Boom's December 2025 expansion into Superpower natural gas turbines for AI data centers represents an opportunistic technical bridge. By utilizing a shared turbomachinery core across both industrial power generation and the Symphony aircraft engine, Boom seeks to accumulate operating hours, prove component reliability, and generate near-term revenue years before Overture achieves commercial type certification."
    claimRefs:
      - "CO005"
      - "CO011"
  - calloutType: "risk"
    title: "Capital Intensity and Self-Funded Engine Development Constraints"
    body: "Industry estimates indicate that certifying and manufacturing a commercial supersonic jet requires $6 billion to $8 billion in cumulative funding. Following public refusals from established engine giants including Rolls-Royce and Safran to engineer civil supersonic powerplants, Boom carries the sole financial and engineering responsibility for Symphony, creating an acute multi-billion-dollar capital requirement that heavily dilutes current equity holders."
    claimRefs:
      - "CO013"
      - "CO014"
