company:
  name: "Boom Supersonic"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Boom Supersonic is developing Overture, a Mach-1.7 commercial airliner powered by its proprietary Symphony engine, anchored by an order book of 130 aircraft across American Airlines, United Airlines, and Japan Airlines. Following the successful supersonic flight of its XB-1 demonstrator in January 2025 and completion of its Greensboro Superfactory in 2024, the company announced $300 million in new funding to support industrial gas turbine commercialization alongside commercial aviation development targeting the early 2030s."
sections:
  - id: "identity-and-business-model"
    title: "Corporate Identity, Product Scope, and Commercial Model"
    body: "Boom Supersonic was founded in 2014 by software engineer and entrepreneur Blake Scholl and maintains corporate headquarters in Denver, Colorado. The enterprise is focused on reviving civil supersonic passenger transportation following the 2003 retirement of Concorde, positioning speed as a mainstream airline service rather than a high-cost government prestige asset. Its flagship commercial platform is Overture, a four-engine airliner designed to cruise at Mach 1.7 at an altitude of 60,000 feet with seating for 65 to 80 passengers in an all-premium cabin configuration. Boom's revenue model relies on selling commercial aircraft to major international carriers, having accumulated an announced order book of 130 aircraft across firm orders and pre-orders from American Airlines, United Airlines, and Japan Airlines. The company operates as a private venture, with secondary market transactions valuing the business at a reported $1.5 billion following a major corporate financing round in late 2025."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership, Functional Execution, and Governance Exposure"
    body: "The strategic trajectory of Boom Supersonic remains tightly coupled to founder and Chief Executive Officer Blake Scholl, who established the company after building mobile e-commerce technology and funding early aerospace conceptual studies from personal savings. Commercial airline relationships, regulatory strategy, and state economic partnership negotiations are directed by President and Chief Business Officer Kathy Savitt, a former corporate officer at Yahoo and Amazon who spearheaded the state incentive campaigns for Boom's production facilities. Flight test operations and experimental vehicle envelope expansion are led by Chief Test Pilot Tristan Brandenburg, a former naval test aviator who piloted the company's subscale demonstrator aircraft through supersonic corridor testing in early 2025. While executive leadership demonstrates strong commercial negotiation and experimental flight execution, independent corporate governance and formalized board oversight structures remain largely undisclosed in public documentation, presenting material key-person dependence on Scholl for capital allocation, technical pacing, and partner alignment."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "milestones-and-flight-testing"
    title: "Development Progression, Flight Envelope Expansion, and Production Infrastructure"
    body: "Boom Supersonic has systematically transitioned from computational fluid dynamics design into physical flight hardware validation and industrial manufacturing scale. Between 2016 and 2022, engineering teams evaluated 51 aerodynamic iterations and completed 26 million software core-hours, refining Overture from an initial trijet concept into a four-engine configuration featuring proprietary gull wings, contoured area-ruled fuselage shaping, and carbon composite airframes. In January 2022, Boom selected Piedmont Triad International Airport in Greensboro, North Carolina as the site for its primary manufacturing facility, securing more than $121 million in state and municipal incentives that included $107 million in specialized roadway and utility expansions. Construction of the Overture Superfactory finished in mid-2024, creating an assembly complex engineered to scale toward an annual production volume of 66 supersonic aircraft. Flight aerodynamics and control systems were empirically validated by the subscale XB-1 demonstrator, which completed 11 piloted sorties before reaching Mach 1.122 at 35,290 feet over the Mojave Air & Space Port in January 2025."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO015"
    figureRefs:
      - "FO001"
  - id: "capitalization-propulsion-and-headwinds"
    title: "Capital Requirements, Propulsion Partnerships, and Technical Execution Risks"
    body: "Bringing a civil supersonic airliner through federal airworthiness certification and serial delivery requires extraordinary capital resources and propulsion infrastructure. External aerospace engineering assessments indicate that full development of Overture will require between $6 billion and $8 billion in total investment, creating substantial financing hurdles against historical equity announcements that stood at approximately $270 million prior to recent expansion. In December 2025, Boom announced $300 million in fresh capital alongside a commercial initiative to deploy Superpower natural gas turbines for artificial intelligence data centers, leveraging a shared core architecture to bridge near-term cash flow while informing propulsion reliability. This proprietary engine strategy became mandatory after established turbofan manufacturers, including Rolls-Royce, Safran, Honeywell, and CFM, publicly declined to develop bespoke commercial supersonic powerplants. Consequently, Boom formed an unconventional propulsion alliance with Florida Turbine Technologies for turbomachinery design and StandardAero for engine assembly at a 100,000-square-foot facility in San Antonio, Texas, making propulsion execution the critical bottleneck to commercial service."
    claimRefs:
      - "CO005"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
