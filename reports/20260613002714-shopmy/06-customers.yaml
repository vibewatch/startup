  - id: durability-repeat-usage-and-proof-quality
    title: Durability, repeat usage, and proof quality
    body: >-
      Public durability evidence is directionally positive but still proxy-heavy. On the creator side, the repeat-use
      signals are better than average for a private commerce platform: independent creators describe using ShopMy daily
      after a year, receiving payouts every Friday, progressing through tiers quickly, and treating gifting, embeds,
      storefronts, and opportunities as recurring parts of their workflow. Official surfaces also try to create repeated
      behavior through monthly bonus opportunities, direct brand chat, rewards tiers, wishlist persistence, and Noir access
      for Gold and Black users. On the shopper side, the App Store rating and the Circles/Taste Profile feature set suggest
      some real engagement, but not a disclosed active-user curve.

      The biggest diligence problem is evidence quality, not evidence absence. Creator-side proof is often specific and
      persuasive, but much of it is still anecdotal, blogger-controlled, or company-curated. Brand-side proof is less
      mature: official logo rosters and anonymous case studies show motion, but not customer concentration, multi-quarter
      retention, or renewal depth. Review signals are also uneven. The App Store rating is strong, but JustUseApp’s low
      legitimacy score and mismatched complaint snippets show that secondary aggregators can add noise instead of clarity.
      As a result, ShopMy’s public customer file can prove real usage and active workflows, but it cannot yet prove
      long-term durability with the rigor an investor would want.
    claimRefs:
