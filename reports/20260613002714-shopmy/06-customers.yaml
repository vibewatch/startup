  evidenceGaps:
    - type: missing-disclosure
      severity: material
      topic: named brand proof table
      missingEvidence: A larger set of named brand customers with spend, campaign duration, or referenceable outcomes rather than creator-side anecdotes and logo walls.
      whyItMatters: Without named brand references, it is hard to judge whether ShopMy’s paying customer base is broad and durable or concentrated in a few premium relationships.
      diligencePath: Request a brand customer list segmented by active spend, ask for 5-10 reference calls, and reconcile logo-wall brands against actual recurring spend.
      relatedQuestionRefs:
        - QU009
        - QU025
      relatedTableRefs:
        - TU003
    - type: missing-disclosure
      severity: material
      topic: brand retention metrics
      missingEvidence: NRR, GRR, logo churn, contract length, and repeat Opportunity usage by brand cohort.
      whyItMatters: These are the core metrics needed to turn visible workflow activity into a durability underwriting conclusion.
      diligencePath: Request cohort retention by brand size, renewal dates, repeat-campaign frequency, and upsell/downsell history.
      relatedQuestionRefs:
        - QU015
        - QU016
      relatedTableRefs:
        - TU004
    - type: missing-disclosure
      severity: material
      topic: customer concentration
      missingEvidence: Top-brand concentration, category mix, and regional concentration across the paying brand base.
      whyItMatters: Strong creator activity can still hide a narrow revenue base if a small number of premium brands drive most spend.
      diligencePath: Request top-10 revenue concentration, category revenue share, and geographic GMV / revenue mix.
      relatedQuestionRefs:
        - QU017
        - QU022
      relatedTableRefs:
        - TU005
    - type: missing-disclosure
      severity: material
      topic: shopper usage kpis
      missingEvidence: Active shopper counts, repeat purchase cohorts, wishlist conversion, and Rewards / Noir penetration.
      whyItMatters: The shopper expansion thesis cannot be fully underwritten from app ratings and launch copy alone.
      diligencePath: Request MAU/DAU, save-to-buy conversion, repeat purchase rate, and cohort retention by Circle age and Rewards tier.
      relatedQuestionRefs:
        - QU011
        - QU014
        - QU026
      relatedTableRefs:
        - TU002
        - TU004
    - type: conflicting-metrics
      severity: minor
      topic: customer count definitions
      missingEvidence: A reconciled metric dictionary for creator counts, tastemaker counts, brand partners, and commissionable brands across public surfaces.
      whyItMatters: Count drift undermines confidence in top-of-funnel adoption narratives and can mask stale or incomparable denominators.
      diligencePath: Ask management to define approved creators, active creators, tastemakers, direct brand partners, and commissionable merchants, then reconcile each public claim to one owner metric.
      relatedQuestionRefs:
        - QU006
      relatedTableRefs:
        - TU002
