  - id: TU005
    title: Expansion and concentration risk table
    description: Where ShopMy can deepen customer value, and where the public record still leaves concentration and procurement risk unresolved.
    columns:
      - Expansion driver
      - Concentration / friction risk
      - Impact
      - Diligence path
    rows:
      - - Circles, Taste Profile, and shopper wishlists
        - No public MAU, DAU, or wishlist conversion data
        - Could turn ShopMy from a creator tool into a recurring shopping destination
        - Request shopper cohorts, save-to-order conversion, and repeat-purchase curves
      - - Rewards tiers and Noir concierge
        - No public disclosure of tier penetration or incremental monetization
        - Could concentrate value among a small premium shopper / creator subset while raising repeat behavior
        - Request Rewards enrollment, Gold/Black share, Noir engagement, and revenue contribution
      - - Stylists, consults, and owned-media embeds
        - Public proof is strong in stylist/blogger workflows but thinner in broad creator categories
        - Could create durable higher-intent creator segments with better conversion than generic influencer traffic
        - Request revenue mix by stylist/blogger vs broader creator cohorts
      - - Premium fashion / beauty / home brand base
        - Heavy concentration in elevated lifestyle verticals may limit resilience if those sectors soften
        - Supports premium positioning, but narrows the proven buyer mix
        - Request category revenue split, brand cohort growth, and cross-vertical win rates
      - - Monthly Bonus Opportunities and gifting loops
        - Brands may need ongoing paid incentives to keep creators posting at scale
        - Can raise recurring activation, but may reduce organic durability if bonuses disappear
        - Request repeat brand usage, creator response rates, and performance after incentives end
      - - Named logo roster and global footprint
        - Logo proof and 130-country reach are not the same as diversified spend or renewal quality
        - Brand scale may look broad while revenue remains concentrated in a few large accounts or geographies
        - Request top-account concentration, geographic GMV/revenue mix, and renewal by region
    notes: This table separates credible expansion vectors from the missing disclosures that would quantify customer concentration and procurement durability.
    claimRefs:
      - CU032
      - CU036
      - CU040
      - CU041
      - CU043
      - CU044
      - CU045
      - CU046
  - id: TU006
    title: Proof-quality and review-signal table
    description: How to interpret the major public customer-proof surfaces without overstating what each proves.
    columns:
      - Proof surface
      - What it supports
      - Freshness / specificity
      - Main limitation
    rows:
      - - Official creator homepage testimonial
        - Shows active creator enthusiasm and brand-facing utility
        - Current, named, but short
        - Company-curated and weak on quantified outcomes
      - - Independent long-form creator reviews
        - Show daily workflow use, payouts, gifting, and comparison against alternatives
        - Current and specific across multiple creators
        - Still anecdotal and self-selected
      - - Anonymous DTC brand case study
        - Shows real brand-side ROI, content volume, and campaign mechanics
        - Quantified and detailed
        - Customer is unnamed, so reference quality is weaker
      - - Company logo roster in funding PR
        - Shows ShopMy can name premium brands it works with
        - Current and high-prestige roster
        - Name drops do not disclose spend, outcomes, or renewals
      - - Apple App Store rating
        - Shows real end-user rating volume and product freshness
        - Current and public
        - Ratings do not equal active shoppers or brand retention
      - - JustUseApp review aggregation
        - Surfaces external sentiment and a weak-legitimacy warning
        - Current but noisy
        - Complaint snippets appear partly mismatched to the actual product, so signal quality is mixed
    notes: Use this table to separate credible proof of use from weaker logo, aggregator, or anecdotal signals.
