tables:
  - id: TU001
    title: Customer segmentation table
    description: How ShopMy segments across creators, brands, and shoppers based on public evidence.
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale / proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Fashion / beauty / lifestyle creators
        - 'User and economic beneficiary: creator; shopper is downstream buyer'
        - Storefronts, affiliate links, gifting, paid Opportunities, brand chat
        - Named proof from Shenea Walker, Wardrobe Oxygen, Salty Vagabonds, Whimsy School, and Olivia’s Shopping Diary
        - Core supply-side inventory that makes recommendations commissionable
        - No public split by creator cohort, vertical, or active-vs-approved status
      - - Personal stylists and personal shoppers
        - 'User: stylist; payer: creator client and/or brand commissions'
        - Private collections, client-specific recommendations, consults, higher commission negotiations
        - Official stylist guide explicitly targets personal shoppers and stylists
        - Differentiates ShopMy from pure influencer-link tools by supporting service-led creator workflows
        - No public count of stylists, consult conversion, or consult GMV
      - - Premium and DTC brand marketers
        - 'Buyer: brand marketing / affiliate / partnerships team; users: brand operators and finance teams'
        - Creator discovery, gifting, Opportunities, UGC buying, ROI tracking, monthly invoicing
        - Official brand pages, anonymous case study, and independent creator gifting anecdotes
        - Primary monetization layer for software/workflow revenue
        - No public contract length, renewal, seat count, or top-brand concentration
      - - Shoppers using Circles and wishlists
        - 'User: shopper; economic value flows through creator commissions and brand demand'
        - Multi-creator discovery, search, filters, wishlists, and Taste Profile personalization
        - Circles launch coverage plus App Store listing and rating signal
        - Potential second flywheel that can raise repeat discovery and conversion
        - No MAU/DAU, wishlist conversion, or repeat-purchase cohort disclosure
      - - Gold / Black / Noir high-value members
        - 'User: higher-frequency shopper and/or top creator; payer not separately disclosed'
        - Rewards progression, concierge-like recommendation access, and higher-status discovery behavior
        - App Store release notes plus Noir waitlist page
        - Suggests ShopMy is trying to formalize premium repeat behavior, not just one-off clicks
        - No public adoption count, conversion uplift, or economics for Noir
      - - International geo-linked audience
        - 'User: global shopper; creator remains curator of one link'
        - Geo-rerouted shopping links and international product routing
        - Official affiliate FAQ plus funding PR says 130+ countries
        - Broadens audience utility beyond U.S.-only storefront traffic
        - No country mix, local buyer concentration, or cross-border conversion data
    notes: Segmentation mixes supply-side creators, paying brands, and emerging shopper cohorts because ShopMy is explicitly a three-sided network rather than a single-seat SaaS product.
    claimRefs:
      - CU001
      - CU002
      - CU010
      - CU022
      - CU028
