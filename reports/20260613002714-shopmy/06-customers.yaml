  - id: TU003
    title: Named customer proof table
    description: Named creators and brands publicly tied to real use, sales, or gifting workflows on ShopMy.
    columns:
      - Customer / public reference
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / quote
      - Limitation
    rows:
      - - Olivia’s Shopping Diary
        - Creator
        - Uses ShopMy for linking, gifting, and paid opportunities
        - Production / live creator workflow
        - Calls ShopMy “the best tool” she has used on social media and says brands notice linking performance
        - Official testimonial; no revenue, duration, or churn detail
      - - Shenea Walker
        - Creator / stylist
        - Uses ShopMy after viral audience growth to monetize fashion recommendations and pitch brands with data
        - Production / live creator workflow
        - Says she made about $500 on a low-cost slipper link and loves the platform’s analytics and gifting access
        - Company-published spotlight and no longitudinal revenue cohort
      - - Wardrobe Oxygen
        - Independent blogger / creator
        - Uses shops, shelves, embeds, gifting, and tier system inside a full-time blogging business
        - Production / long-running usage
        - Says the platform fits curator-led content, supports older shoppers without an app, and is a daily workflow tool
        - Single-customer anecdote; not a representative cohort study
      - - Salty Vagabonds / Addison
        - Independent creator
        - Runs ShopMy alongside LTK with daily use, weekly payouts, gifting, and Amazon integration
        - Production / one-year usage
        - Reports reliable Friday payouts and fast tier progression after a year on platform
        - Independent but still one creator’s experience
      - - Whimsy School creator review
        - Independent creator
        - Joined ShopMy, received gifting, and advanced tier quickly while comparing it with LTK
        - Production / early-stage usage
        - Says two brands offered gifting within three days and the platform felt more intuitive and brand-connected than LTK
        - Very fresh account; speed of early activity does not prove long-term retention
      - - Beekman 1802
        - Brand surfaced through creator review
        - Product sold through ShopMy-linked creator recommendation
        - Production / real monetized sale
        - Salty Vagabonds reports one Beekman 1802 product generated $34 in volume and $4 in commission
        - Single-creator anecdote, not disclosed brand-level ROI or renewal
      - - Blenders Eyewear / Christie Kidd’s Perfect Skin / NOYZ
        - Brands surfaced through creator reviews
        - Named gifting invitations delivered through ShopMy creator workflows
        - Production / live gifting workflow
        - Independent creators cite these brands as active gifting participants on the platform
        - Shows brand activity but not campaign spend, retention, or multi-creator scale
    notes: Rows prioritize named entities with actual workflow detail, gifting evidence, or monetized sales. ShopMy does not publish a complete named customer roster with renewals or spend history.
    enumerationScope:
      coverage: partial
      basis: Rows include the strongest publicly named creators and brands with explicit workflow, gifting, or sales evidence across current official pages and independent creator reviews; the public set is not a complete customer roster.
