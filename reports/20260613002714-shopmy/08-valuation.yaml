  - - Confidence
    - medium
    - Scale and category momentum are real, but valuation support is incomplete.
  - - Risk rating
    - high
    - Competition, data opacity, and cap-table uncertainty can all compress value quickly.
  - - Valuation stance
    - stretched
    - Public evidence supports interest in the company more than comfort with the last price.
  - - Upgrade conditions
    - Current revenue, gross margin, NRR, and preferences disclosed; or entry price resets closer to base-case range.
    - Recommendation can improve if evidence or price gets better.
