  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current GAAP revenue and current-period margin are undisclosed
    missingEvidence: Board-ready 2025 and 2026 revenue bridge, gross margin by stream, and current run-rate revenue.
    whyItMatters: Without current audited or management revenue and margin data, investors cannot tell whether the $1.5B mark is a demanding but defensible software multiple or an overextended GMV narrative.
    diligencePath: Request monthly revenue by stream, gross margin by stream, and management budget-to-actual reporting for 2025-2026.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV006
    - QV031
  - type: private-evidence-only
    severity: material
    topic: liquidation preferences, participation, anti-dilution, and share count are undisclosed
    missingEvidence: Latest cap table, preferred stock term sheets, option pool, and current fully diluted share count.
    whyItMatters: The recommendation cannot be upgraded to buy while the downside waterfall and incremental dilution for new investors remain opaque.
    diligencePath: Request the October 2025 financing documents, cap-table export, and board materials summarizing preference and voting rights.
    relatedQuestionRefs:
    - QV017
    - QV026
    - QV031
  - type: missing-source
    severity: material
    topic: brand retention, NRR, and customer concentration are not publicly supported
    missingEvidence: Cohort retention, NRR, GRR, logo churn, and top-10 brand concentration across subscription and transaction revenue.
    whyItMatters: Valuation durability depends on whether recurring brand spend compounds or whether the platform is still a volatile campaign and affiliate marketplace.
    diligencePath: Request cohort dashboards, top-customer concentration tables, and renewal data for the 2024 and 2025 brand vintages.
    relatedQuestionRefs:
    - QV007
    - QV025
    - QV031
  - type: missing-source
    severity: material
    topic: shopper-layer engagement is visible but not underwritable
    missingEvidence: MAU, repeat-visit rate, wishlist conversion, Circles engagement, and app retention for shoppers.
    whyItMatters: The bull case partly depends on ShopMy owning more of the shopper relationship, but public evidence stops at feature adoption and app-store signals.
    diligencePath: Request app cohort dashboards, shopper funnel metrics, and the board narrative used to justify post-Series-B consumer investment.
    relatedQuestionRefs:
    - QV012
    - QV030
    - QV032
  - type: enumeration-incomplete
    severity: material
    topic: TV005 comparable valuation table is partial because open-source creator-commerce comps rarely disclose current revenue and term-adjusted private valuations.
    missingEvidence: Current open-market or management-verified valuation and revenue data for LTK, retailer-native creator programs, and other scaled creator-commerce platforms.
    whyItMatters: The comparable set is directionally useful but cannot fully normalize ShopMy against exact peer revenue multiples or term-adjusted private marks.
    diligencePath: Supplement the open-source comp set with paid private-market databases, management-shared peer decks, or banker materials before treating any single peer as a hard multiple anchor.
    relatedQuestionRefs:
    - QV008
    - QV029
    relatedTableRefs:
    - TV005
sections:
- id: valuation-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: 'The pro-investment case starts with the fact pattern that ShopMy is not a speculative pre-revenue concept anymore. Between the January 2025 Series B and the October 2025 unicorn round, official and independent sources show a company that scaled from more than 100,000 creators and $352M in brand sales to more than $1B in annual platform sales, 1,200+ premium brands, and 185,000+ tastemakers, while Modern Retail separately reported 650% revenue growth in 2024 and first profitability in September 2024. The business model has also improved in quality: subscriptions became the majority of revenue by early 2025, official brand pages emphasize measurable ROI and workflow infrastructure rather than vanity reach, and the shopper-layer buildout creates a credible long-term path toward owning more of discovery. The anti-thesis is valuation support and defensibility. Public revenue is still estimated rather than audited, creator counts drift materially across sources, and the biggest consumer
    platforms and partnership-infrastructure players are all moving toward storefronts, payouts, attribution, and AI-led discovery. That means ShopMy can be a real winner and still be too expensive to buy at the last mark.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV011
  - CV012
  - CV014
  - CV015
  - CV018
  - CV026
  - CV027
