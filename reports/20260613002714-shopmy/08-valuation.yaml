callouts:
- calloutType: risk
  title: Primary risk is valuation opacity, not category demand
  body: The market backdrop is supportive, but investors still lack public evidence on current revenue, gross margin, retention, concentration, and preference terms. That is enough to keep the recommendation cautious even though the company itself looks real.
  claimRefs:
  - CV030
  - CV031
  - CV048
- calloutType: insight
  title: The mark re-rated faster than the public evidence did
  body: A public January 2025 valuation mark of $410M moving to a $1.5B October 2025 round means the burden of proof moved faster than disclosed financial support. Investors should treat that gap as a diligence problem, not as proof of overvaluation or proof of fairness.
  claimRefs:
  - CV006
  - CV002
  - CV025
- calloutType: recommendation
  title: Track until price or evidence improves
  body: A buy call would require either a materially lower entry closer to the base-case range or direct evidence that current revenue, margins, retention, and cap-table terms justify the 2025 premium mark.
  claimRefs:
  - CV043
  - CV044
- calloutType: assumption
  title: Scenario math uses conservative multiple compression
  body: The scenario ranges deliberately assume that even a successful ShopMy should trade on lower future multiples than the October 2025 private round unless the company can prove software-grade durability and consumer-layer traction.
  claimRefs:
  - CV040
  - CV041
  - CV042
