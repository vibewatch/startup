  - CV050
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: financing-context-and-price-discipline
  title: Financing context, price discipline, and what public evidence really supports
  body: 'The financing history shows why investors were willing to pay up. Public sources support a sequence of rapid marks: $18.5M in March 2024, $77.5M in January 2025, a CB Insights January 2025 valuation of $410M, and then $70M at a $1.5B valuation in October 2025. But the same public record also shows why entry discipline matters. If Sacra''s $80M 2025 revenue estimate is directionally right, the October 2025 round priced at about 18.8x revenue, rich but still within the outer band for premium software-like growth assets. If investors anchor on the CB Insights public 2024 revenue figure of $15M, the same round reads closer to 100x trailing revenue, which is too aggressive for a company with undisclosed margins, retention, and concentration. The right interpretation is not that one datapoint is definitely false; it is that public valuation support is still too thin to justify false precision. At the last round price, the file is stretched. A materially lower entry or a fuller data room
    would be needed before the recommendation improves.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV010
  - CV025
  - CV038
  - CV039
  - CV048
  tableRefs:
  - TV001
  - TV003
  figureRefs:
  - FV002
- id: scenario-range-and-return-math
  title: Bull, base, and bear scenario range
  body: 'Because the public file is incomplete, scenario analysis is more trustworthy than a single target price. The bull case assumes ShopMy turns the current three-sided build into a larger shopper-plus-brand operating system: revenue reaches roughly $150M by 2027, the consumer layer improves repeat conversion, and the market still pays 12x-14x revenue for a profitable, premium creator-commerce platform. That produces roughly $1.8B-$2.1B of enterprise value and only modest upside from the last private mark. The base case assumes revenue reaches about $110M-$120M, but multiple compression to 8x-10x follows normal maturation and tougher comparison with larger infrastructure peers; that lands around $0.9B-$1.2B. The bear case assumes weaker creator retention, heavier competition from native platform tools, and no clean proof of margin durability, leaving revenue near $70M-$80M and value at only $0.3B-$0.5B. On a probability-weighted basis, the public-evidence range still sits below the October
    2025 price, which is why the recommendation stays cautious.'
  claimRefs:
  - CV040
  - CV041
  - CV042
  - CV043
  - CV047
  tableRefs:
  - TV004
  figureRefs:
  - FV003
- id: comp-set-and-market-posture
  title: Comparable set and market posture
  body: 'The comp set argues for caution even though category demand is strong. LTK is the clearest scaled adjacency: Forbes describes it as a $6B annual retail-sales platform with deep consumer reach, meaning ShopMy still sits at a much earlier point on the scale curve despite a premium curation narrative. impact.com is not a like-for-like creator app, but it is a useful infrastructure benchmark because it already serves 5,900+ brands, spans 2M+ partnerships, and positions storefronts, payouts, discovery, and AI in one system. Sacra''s note that Collective Voice wound down in December 2025 adds the adverse comp the chapter needs: creator-commerce demand can be real while individual platforms still fail or consolidate. Meanwhile, market-data sources support continued budget expansion and strong ROI interest across influencer marketing, but they also show a shift toward tighter measurement, short payback expectations, and platform concentration. That backdrop rewards defensible infrastructure
    and data, not just creator-count optics.'
  claimRefs:
  - CV028
  - CV029
  - CV030
  - CV031
  - CV032
  - CV033
  - CV035
  - CV046
  - CV049
  - CV050
  tableRefs:
  - TV005
  figureRefs:
  - FV004
- id: recommendation-cap-table-uncertainty-and-triggers
  title: Recommendation, dilution uncertainty, and thesis-break triggers
  body: 'The practical recommendation is track with medium confidence and high risk at the last disclosed price. The company has enough positive evidence to stay on the investable list: strong round support, rapid scale, a more subscription-heavy revenue mix, credible creator and brand workflows, and a meaningful shopper-ownership thesis. What it does not have is enough public evidence to justify a fresh buy at $1.5B. CB Insights shows that deal-term fields exist for the recent rounds, but liquidation preference, participation, anti-dilution, and board-voting values are not visible publicly, so dilution and downside waterfalls remain opaque. The same is true for current run-rate revenue, gross margin, NRR, and concentration. The chapter therefore treats the missing data as the main reason to wait, not as a reason to invent exact fair value. A better entry, or proof that 2026 revenue, margins, and retention justify the 2025 markup, would move the call. Until then, the thesis breaks if revenue
    growth slows sharply, shopper engagement fails to materialize, or larger ecosystem players commoditize the underlying infrastructure.'
  claimRefs:
  - CV038
  - CV039
  - CV043
  - CV044
  - CV048
  tableRefs:
  - TV006
  - TV007
  figureRefs: []
