chapter:
  number: 8
  title: Valuation
  summary: ShopMy has real operating momentum, but the October 2025 $1.5B price is still hard to underwrite from public evidence alone. Official releases and independent reporting confirm rapid scale, profitability claims, and sharp private-market markups, while analyst-style sources imply revenue anywhere from $15M in 2024 to an estimated $80M in 2025. That spread means the latest round can read as either a demanding but plausible high-growth software multiple or an extremely aggressive trailing mark. Because current revenue, margins, retention, concentration, and preference terms remain undisclosed, the evidence supports a track recommendation rather than a fresh buy at the last round price.
