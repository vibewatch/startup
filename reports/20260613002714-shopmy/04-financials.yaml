  evidenceGaps:
    - type: partial-coverage
      severity: material
      topic: conflicting tracker data on revenue and funding
      missingEvidence: Latka publishes a revenue and headcount estimate but also claims ShopMy is bootstrapped with zero funding, which conflicts with the disclosed financing record and leaves no reliable tracker consensus.
      whyItMatters: Outside-in tracker disagreement makes public comping and private-market benchmarking noisy, so management-provided revenue and cap-table data are still required.
      diligencePath: Request management revenue bridge, current headcount, and cap-table summary; do not rely on tracker profiles alone for underwriting.
      relatedQuestionRefs:
        - QI021
    - type: missing-source
      severity: material
      topic: GMV-to-revenue bridge and realized take rate by stream
      missingEvidence: Public sources disclose platform-sales, subscriptions, and estimated fee schedules, but none reconcile gross platform sales to recognized revenue by subscriptions, affiliate fees, Opportunities, gifting, or shopper products.
      whyItMatters: Without a stream-level bridge, the company could look more SaaS-like or more payments-and-services-like than headline metrics imply.
      diligencePath: Request monthly revenue by stream, gross platform sales, take rates, contra-revenue treatment, and gross margin by product line.
      relatedQuestionRefs:
        - QI023
