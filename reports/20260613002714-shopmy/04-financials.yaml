callouts:
  - calloutType: insight
    title: Revenue quality is likely improving, but not fully disclosed
    body: "Public evidence strongly suggests ShopMy is no longer just an affiliate-link tool: subscriptions, ROI tooling, and campaign workflows sit alongside transaction revenue. That helps revenue quality, but management still does not publicly reconcile GMV, take rate, and recognized revenue."
    claimRefs: [CI023, CI024, CI036, CI047]
  - calloutType: risk
    title: Cash timing could be a bigger hidden risk than topline demand
    body: "Weekly creator payouts sound creator-friendly, but official guides also show 30-120 day settlement windows, negative earnings from returns, and average rather than guaranteed commission rates. Without payout-reversal and working-capital metrics, headline growth can mask cash-conversion friction."
    claimRefs: [CI011, CI012, CI043, CI044, CI050]
