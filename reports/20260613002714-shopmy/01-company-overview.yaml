  - id: FO002
    title: "Company snapshot logic"
    type: flow
    layout: wide
    summary: "How ShopMy connects creator supply, brand demand, shopper discovery, and monetization infrastructure into a single system."
    data:
      nodes:
        - {id: creators, label: Curated creators / tastemakers, type: input}
        - {id: shops, label: Digital shops + affiliate links, type: process}
        - {id: brands, label: Brand tools + subscriptions, type: process}
        - {id: opp, label: Opportunities gifting + paid partnerships, type: process}
        - {id: consumers, label: Circles Taste Profile + wishlists, type: process}
        - {id: gmv, label: Attributed sales + commissions, type: output}
        - {id: data, label: Performance data + ROI visibility, type: output}
      edges:
        - {from: creators, to: shops, label: curation and audience trust}
        - {from: shops, to: gmv, label: affiliate conversion}
        - {from: brands, to: data, label: subscription analytics}
        - {from: brands, to: opp, label: campaign budgets and gifting}
        - {from: opp, to: creators, label: paid collaborations}
        - {from: shops, to: consumers, label: recommendation inventory}
        - {from: consumers, to: gmv, label: wishlist and purchase intent}
        - {from: gmv, to: data, label: performance measurement}
