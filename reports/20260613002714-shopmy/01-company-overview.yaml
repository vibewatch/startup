artifact: company-overview
slug: shopmy
runDate: '2026-06-13'
company:
  name: ShopMy
chapter:
  number: 1
  title: "Company Overview"
  summary: "ShopMy is a New York-based creator commerce platform founded in 2020 that has expanded from creator storefronts into a broader system for brands, creators, and shoppers. Public sources from 2025-2026 show rapid scale expansion, including a $70 million round at a $1.5 billion valuation, profitability since 2024, and growing evidence that the company is moving up the stack from affiliate links to a broader brand operating system and consumer discovery product."
sections:
  - id: identity-and-platform-scope
    title: "Identity, headquarters, and platform scope"
    body: "ShopMy operates under the legal name Shop My Shelf, Inc. and presents itself as creator-commerce infrastructure that connects creators, premium brands, and shoppers through curation rather than algorithm-first feeds. The current team page says the company was born from an MIT research project and is headquartered in New York, while the 2023 SEC Form D filing confirms Delaware incorporation, the legal entity name, and a historical Worcester, Massachusetts business address used for that financing notice. The operating proposition has broadened over time. ShopMy’s creator-facing pages emphasize digital storefronts, affiliate links, brand partnerships, weekly payouts, and curated admission to the network. Its brand-facing pages emphasize discovery, engagement, tracking, and amplification tools intended to convert word-of-mouth into measurable revenue. By mid-2025 and into 2026, the platform also positioned itself as a shopper destination through Circles, Taste Profile, wishlists, and multi-curator discovery. This three-sided positioning matters because it makes ShopMy more than a simple affiliate-link utility; it is trying to be infrastructure for recommendation-led commerce across supply, demand, and measurement layers."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010]
    figureRefs: [FO002]
  - id: founders-leadership-and-organization
    title: "Founders, leadership, and organizational signals"
    body: "The public founder record is consistent across official and independent sources. Harry Rein serves as CEO, Tiffany Lopinsky serves as President, and Chris Tinsley is the co-founder focused on business development. The current ShopMy team page names all three founders and says the company is headquartered in New York; the October 2025 funding release uses the same operating roles; and Inc’s March 2026 profile adds origin context, describing Rein and Tinsley as early builders of the product and Lopinsky as a creator-operator who helped turn the prototype into a commercial company. The SEC filing from December 2023 is also useful because it shows Tinsley as President, Executive Officer, Director, and Promoter at that stage, which indicates that the formal officer structure continued to evolve as the company scaled. Current careers and job pages provide additional operating evidence. They show a remote-first organization with active hiring across client strategy, enterprise sales, creator operations, product design, data, and engineering, while a Senior Full Stack Engineer role names a modern web stack built around NodeJS, React, Redux, AWS, ECS, and CloudWatch. Those hiring signals support the view that ShopMy is still in platform-building mode rather than pure commercialization mode."
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019]
    tableRefs: [TO002]
  - id: capital-history-scale-and-business-model
    title: "Capital history, scale metrics, and business model maturity"
    body: "The external funding narrative shows a company that accelerated quickly between 2024 and 2026. Modern Retail reported that ShopMy raised an $18.5 million round in March 2024 and then a $77.5 million Series B in January 2025 led by Bessemer Venture Partners and Bain Capital Ventures. The October 2025 company release and follow-on coverage from Hello Partner and Net Influencer then documented a further $70 million financing at a $1.5 billion valuation led by Avenir with Bain Capital Ventures, Bessemer Venture Partners, and Menlo Ventures participating. Multiple sources also tie that capital to operating progress. Modern Retail said 2024 revenue grew 650% year over year and that profitability was first reached in September 2024. The October 2025 announcement added stronger scale markers: over $1 billion in annual platform sales, 1,200-plus premium brand partners, 185,000-plus tastemakers, 200% revenue growth, and sustained profitability since 2024. Importantly, Modern Retail also said ShopMy’s subscription-based brand tools had become the majority of revenue by early 2025, with pricing ranging from roughly $1,000 to $7,000 per month. That mix suggests ShopMy is not only a GMV-linked take-rate story; it also has a recurring SaaS layer that can smooth revenue quality if brand subscriptions remain durable."
    claimRefs: [CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031]
    tableRefs: [TO001, TO003]
    figureRefs: [FO003]
  - id: milestones-and-adverse-context
    title: "Milestones, product expansion, and adverse context"
    body: "The chronology shows ShopMy repeatedly adding new layers rather than standing still as a storefront tool. The company was founded in 2020, launched an initial version in July 2020, disclosed a Form D in December 2023, scaled into brand subscriptions in 2024, launched its consumer platform with Circles in July 2025, and closed a unicorn round in October 2025. The product milestones are not cosmetic. Circles turned ShopMy from a one-creator storefront model into a multi-curator consumer discovery experience, while the Opportunities case study shows how the platform now packages creator marketing into repeatable performance infrastructure for brands. At the same time, there are visible adverse signals that later chapters need to examine. Modern Retail reported that LTK sued ShopMy in 2024 over false advertising, trademark infringement, and unfair competition before dropping the case. Digiday described creators diversifying because algorithmic platforms can suddenly reduce reach, and agency commentary in that piece suggested creators increasingly use ShopMy for friendlier economics and back-end tooling. Privacy and disclosure obligations also remain material because ShopMy monetizes affiliate links and creator recommendations across social channels, making FTC endorsement compliance and data-handling controls strategic rather than back-office issues."
    claimRefs: [CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041]
    tableRefs: [TO004]
    figureRefs: [FO001]
