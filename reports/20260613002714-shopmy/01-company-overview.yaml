    summary: "Publicly disclosed operating signals show a fast-moving private company that is layering subscriptions, consumer discovery, and creator economics on top of raw GMV growth."
    approximationNotes: "Values are direct public disclosures or source-dated snapshots. Where multiple dated counts exist, the figure uses the most widely cited recent public anchor and notes the drift in the chapter text."
    data:
      items:
        - {label: Brand pricing layer, value: '$1k-$7k', unit: monthly list pricing}
        - {label: Revenue mix, value: majority from subscriptions, unit: early-2025 report}
        - {label: Consumer layer, value: 'Circles + Taste Profile', unit: discovery}
        - {label: Creator monetization, value: 10-30%, unit: commission range}
        - {label: Operating model, value: remote-first, unit: org signal}
        - {label: Case-study ROAS, value: 3.3, unit: x}
    claimRefs: [CO007, CO018, CO019, CO029, CO030, CO034, CO037, CO040]
callouts:
  - calloutType: strength
    title: "ShopMy has graduated from link utility to infrastructure story"
    body: "The strongest company-overview signal is not just creator growth but the layering of subscriptions, campaign tooling, shopper discovery, and attribution into one system. That combination gives ShopMy more strategic depth than a single-purpose affiliate-link tool."
    claimRefs: [CO004, CO005, CO007, CO029, CO034]
  - calloutType: risk
    title: "Public scale is improving faster than public governance disclosure"
    body: "The company now publishes impressive traction numbers, but the public record still leaves important diligence gaps on exact headcount, current board composition, take rate, retention, and the lasting legal consequences of LTK competition. Investors should treat the overview as directionally strong but disclosure-light."
    claimRefs: [CO018, CO028, CO030, CO038]
