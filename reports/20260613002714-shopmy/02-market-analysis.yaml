- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Creators / tastemakers
    - Individual creator or creator team
    - Creator
    - Brand commissions, retailer commissions, or creator success spend
    - Build shop, create links, publish content, monitor payouts
    - Creator themselves / management
    - Higher commission potential and easier monetization
  - - Brands / merchants
    - Affiliate, influencer, or growth leader
    - Brand team
    - Brand subscription or campaign budget
    - Discover creators, gift product, track sales, pay bonuses
    - Ecommerce, growth, affiliate, or partnership owner
    - Need measurable creator ROI and repeatable creator sourcing
  - - Shoppers / followers
    - Platform product team shapes experience
    - Shopper
    - Indirect via commerce conversion
    - Browse curation, join circles, save products, purchase
    - Consumer product / retention owner
    - Higher-trust discovery and lower search friction
  - - Retailers / affiliate networks
    - Network, retailer marketplace, or merchant program owner
    - Creators and brands use the rails
    - Retailer/network economics and merchant fees
    - Link resolution, commission settlement, checkout attribution
    - Affiliate or marketplace owner
    - Want to keep creator demand inside owned ecosystem
  - - Enterprise partnership platforms
    - Brand partnership-ops leadership
    - Brand teams, partner managers, creators
    - Software budget
    - Recruit, manage, pay, measure, and expand partner programs
    - CMO, partnerships, or rev-ops leader
    - Need unified creator, affiliate, and referral data
  notes: The user is not the same as the payer; brands are the clearest direct payer today, while shoppers matter as the conversion
    and retention engine.
