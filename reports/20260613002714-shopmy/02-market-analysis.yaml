- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Budget shift into creator marketing
    - Positive
    - Current / near-term
    - More brands are treating creators as core budget line items
    - How much of spend converts into software fees versus media pass-through?
  - - Proven ROI and attribution pressure
    - Positive
    - Current
    - Performance accountability favors tracked creator-commerce platforms
    - What share of ROI is incremental versus cannibalized affiliate demand?
  - - Need to manage 50-100+ creators at once
    - Positive
    - Current
    - Workflow software becomes more valuable as programs scale
    - How automated are recruiting, payments, approvals, and reporting today?
  - - AI-assisted discovery and partner ops
    - Positive
    - Emerging
    - Better discovery and measurement can increase software willingness-to-pay
    - Does ShopMy own defensible first-party data or rely on third-party APIs?
  - - FTC disclosure and review-integrity rules
    - Negative
    - Current / durable
    - Compliance burdens can slow adoption and increase moderation needs
    - How does ShopMy enforce creator disclosures and review integrity?
  - - Algorithm dependence and TikTok uncertainty
    - Negative
    - Current / volatile
    - External platforms can cut reach or redirect commerce to native tools
    - How much traffic is direct versus social-platform dependent?
  - - Multi-homing by creators and brands
    - Negative
    - Current
    - Low switching costs can weaken moat and pricing power
    - What creator and brand retention looks like by cohort and by product?
  - - Conflicting public pricing and revenue-mix disclosures
    - Negative
    - Current
    - Makes underwriting exact ARPU and margin expansion difficult
    - Request product-level pricing, take rates, and segment gross margins
  notes: The strongest drivers are budget and ROI, while the strongest constraints are platform dependence, compliance, and
    low exclusivity.
