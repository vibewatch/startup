tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters
  rows:
  - - Creator monetization infrastructure
    - Storefronts, affiliate links, creator payouts, creator-side analytics
    - General creator ad revenue not mediated by commerce tools
    - Creators / brands / networks
    - Core creator-facing wedge for ShopMy-like platforms
  - - Brand-side creator commerce software
    - Discovery, gifting, tracking, creator CRM, ROI reporting, campaign operations
    - Generic agency retainers or pure brand-awareness media buys
    - Brands / ecommerce, affiliate, and growth budgets
    - Closest direct paying-software budget
  - - Trust-based shopper discovery
    - Curated feeds, circles, storefronts, wishlists, creator-led shopping destinations
    - Generic social feed impressions with no commerce intent
    - Platforms and merchants / shoppers indirectly monetize
    - ShopMy is expanding here through Circles and shopper surfaces
  - - Affiliate and attribution rails
    - Commission rules, link monetization, retailer/network settlement, payout workflows
    - Offline retail without attributable creator links
    - Retailers, networks, and platforms / brands fund commissions
    - Required infrastructure layer underneath creator commerce
  - - Retailer- or network-owned creator programs
    - Amazon Creator Connections, brand-owned affiliate communities, network marketplaces
    - Pure marketplace media without creator participation
    - Retailers or brands / creators earn variable payouts
    - Important substitute that can disintermediate specialized tools
  - - Excluded broad spend
    - Generic social ads, unrelated ecommerce checkout spend, creator merchandise with no platform take
    - All digital marketing or all ecommerce GMV
    - Varies
    - Helps avoid overstating ShopMy’s real addressable market
  notes: 'Boundary is intentionally narrower than the full creator economy: it centers on creator-commerce infrastructure,
    not all digital ads or all ecommerce.'
