- id: FM002
  title: Buyer / segment map
  type: matrix
  layout: wide
  summary: Each side of the marketplace wants something different, which is why buyer ownership and adoption logic cannot
    be reduced to one persona.
  data:
    columns:
    - Primary user
    - Direct payer
    - Core value metric
    - Main blocker
    rows:
    - label: Creators
      values:
      - Creator / manager
      - Variable commissions and brand deals
      - Earnings per recommendation
      - Low trust in payout speed or weak discovery of good brands
    - label: Brands
      values:
      - Affiliate / influencer team
      - Subscription or campaign budget
      - Attributed sales and ROI
      - Program complexity and unclear incrementality
    - label: Shoppers
      values:
      - Follower / buyer
      - Indirect monetization via conversion
      - Trust, relevance, repeat discovery
      - Algorithm noise and low-intent browsing
    - label: Retailers / networks
      values:
      - Marketplace or network owner
      - Network / merchant economics
      - Share of creator-driven checkout
      - Creators choosing third-party links over owned rails
