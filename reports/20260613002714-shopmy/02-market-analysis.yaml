company:
  name: ShopMy
chapter:
  number: 2
  title: Market Analysis
  summary: ShopMy operates in a layered creator-commerce market where the broad creator economy and social-commerce pools
    are much larger than the narrower software and attribution layer the company actually sells into. The strongest evidence
    supports a three-sided buyer map—creators, brands, and shoppers—with brands as the clearest direct payer and creators/shoppers
    as the usage engine that drives conversion data. Growth tailwinds are strong, but platform dependence, FTC disclosure
    rules, multi-homing, and noisy public pricing data still limit precise SAM and moat underwriting.
sections:
- id: market-boundary-and-sizing
  title: Market boundary and sizing logic
  body: 'ShopMy should not be underwritten against the entire creator economy without adjustment. The relevant market is creator-commerce
    infrastructure: software and workflow layers that help creators monetize recommendations, help brands discover and pay
    creators, and help shoppers convert that trust into attributable sales. Public sources support a broad creator-economy
    envelope in the $234 billion to $252 billion range for 2026 and an influencer-marketing spend layer around $39 billion
    to $40.5 billion, but those figures include revenue pools that ShopMy does not capture directly. A better boundary separates
    the broad creator economy from the narrower software, attribution, and commerce-enablement layer, then further narrows
    to the premium-brand, high-trust, creator-led shopping niche where ShopMy competes. That still leaves a large enough market
    to matter, but it makes clear that ShopMy is selling infrastructure for creator-led commerce rather than all creator monetization
    or all social-ad spend.'
