figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: A layered view from the broad creator economy to the narrower creator-commerce software wedge that ShopMy targets
    most directly.
  data:
    items:
    - label: TAM — Creator economy (~$234B-$252B in 2026 framing)
      detail: Broad pool that includes creator-led businesses, subscriptions, merchandise, platform payouts, and related commerce.
      tone: neutral
    - label: Large adjacent spend — Global influencer marketing (~$39.33B-$40.51B in 2026)
      detail: Marketing dollars flowing through creator partnerships and associated campaign budgets.
      tone: neutral
    - label: Narrower infrastructure lens — Influencer marketing software/tools (>$22B by 2026)
      detail: Closer proxy for platforms selling workflow, attribution, and creator-program infrastructure.
      tone: neutral
    - label: Current operating wedge — ShopMy platform scale (>$1B annual platform sales by late 2025)
      detail: Evidence that ShopMy has meaningful traction, but still within a much smaller slice than the broad creator-economy
        envelope.
      tone: positive
  approximationNotes: The layers mix broad market pools with a narrower infrastructure sub-segment on purpose; they show boundary
    logic rather than a single bottoms-up TAM equation.
