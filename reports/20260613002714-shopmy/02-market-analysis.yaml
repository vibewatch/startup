  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-isolation
    missingEvidence: Segment-level ShopMy take rates, monetized GMV by product line, and geography-specific revenue contribution.
    whyItMatters: Without product-line and geography-level economics, public TAM and SAM lenses cannot be converted into a
      reliable share or margin model.
    diligencePath: Request management cohort data by subscription tier, commission stream, geography, and shopper-direct traffic
      contribution.
    relatedQuestionRefs:
    - QM022
    - QM027
  - type: missing-source
    severity: material
    topic: international-mix
    missingEvidence: Current non-U.S. creator count, brand count, GMV, and revenue mix by geography.
    whyItMatters: International expansion is part of the market story, but public evidence does not show whether it is material
      today or still pre-scale.
    diligencePath: Ask management for U.K., Australia, and other market KPIs plus launch timing and local unit economics.
    relatedQuestionRefs:
    - QM023
    - QM027
  - type: conflicting-data
    severity: material
    topic: pricing-clarity
    missingEvidence: A definitive product-tier price card reconciling subscription fees, campaign fees, and transaction take
      rates.
    whyItMatters: Conflicting public pricing ranges make it hard to underwrite ARPU, upsell paths, and gross-margin durability.
    diligencePath: Request current brand pricing deck and historical price changes across self-serve, managed, and opportunity
      products.
    relatedQuestionRefs:
    - QM021
    - QM027
