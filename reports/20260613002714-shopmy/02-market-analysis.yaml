- id: TM005
  title: Creator-platform distribution context
  columns:
  - Platform
  - Primary user
  - Monetization model
  - Scale signal
  - ShopMy-relevant read
  - Limitation
  rows:
  - - ShopMy
    - Creators + brands + shoppers
    - Brand subscriptions, commissions, paid opportunities, transaction fees
    - '>$1B platform sales; 300k+ tastemakers; 50k+ brand partners'
    - Three-sided model is working, but public data is still sparse on margin structure
    - Public metrics mix company claims with third-party estimates
  - - LTK
    - Creators + shoppers + brands
    - Affiliate sales, brand tools, paid creator campaigns
    - 40M monthly users; 7,000 retailers; nearly $6B annual sales
    - Shows how destination discovery can expand beyond link monetization
    - Larger and more mature platform than ShopMy
  - - impact.com
    - Brands + affiliates + creators
    - Enterprise software for affiliate, creator, and referral programs
    - 5,900+ brands; 2M partnerships; $110B+ GMV
    - Validates buyer demand for unified partnership management
    - Infrastructure focus is broader than social shopping
  - - Amazon Associates / Creator Connections
    - Creators, publishers, brands
    - Marketplace-controlled commissions and sponsored-content tools
    - One of the world’s largest affiliate programs; 244% YoY affiliate-driven revenue growth in cited case
    - Incumbent retailers can internalize creator demand
    - Amazon economics and intent are retailer-centric
  - - Awin
    - Brands + publishers + influencers
    - Performance network fees and tooling
    - 1M+ publisher partners
    - Shows how large neutral affiliate rails can remain relevant
    - Network does not itself provide destination consumer discovery
  - - Mavely
    - Everyday creators + brands
    - Affiliate commissions, boosts, referral bonuses, bonuses
    - Thousands of brands; 177% higher claimed commissions; 45-day payouts
    - Competes for creator supply through payout speed and simplicity
    - Public claims come from company-authored material
  notes: Comparator rows are not apples-to-apples; they show the substitute set that can pull creators, brands, or shopper
    traffic away from ShopMy.
