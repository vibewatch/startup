evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition voting control and liquidation preference stack after the 2025 unicorn round.
    whyItMatters: >-
      Public founder and financing narratives are strong, but investor control and founder leverage cannot be assessed
      without cap-table and governance documents.
    diligencePath: Request current board list charter financing docs and post-money cap table.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-scale
    missingEvidence: Exact take rate subscription ARR gross margin and creator payout concentration.
    whyItMatters: >-
      The overview suggests a blended SaaS plus transaction model, but revenue quality and margin durability cannot be
      judged from GMV and valuation headlines alone.
    diligencePath: Request monthly revenue bridge subscription cohort data and creator payout concentration by decile.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Exact current headcount and office footprint as of run date.
    whyItMatters: Open roles and the 140+ team figure show growth, but investors still need a precise current people-cost baseline.
    diligencePath: Request current employee count by function and geography from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: compliance
    missingEvidence: ShopMy-specific FTC disclosure workflows monitoring practices and privacy-control implementation details.
    whyItMatters: >-
      Affiliate monetization and shopper data collection create regulatory risk that cannot be assessed from high-level
      policy pages alone.
    diligencePath: >-
      Request creator disclosure policies compliance training materials moderation SOPs and privacy program
      documentation.
    relatedQuestionRefs:
      - QO020
  - type: private-evidence-only
    severity: material
    topic: sam-isolation
    missingEvidence: Segment-level ShopMy take rates, monetized GMV by product line, and geography-specific revenue contribution.
    whyItMatters: >-
      Without product-line and geography-level economics, public TAM and SAM lenses cannot be converted into a reliable
      share or margin model.
    diligencePath: >-
      Request management cohort data by subscription tier, commission stream, geography, and shopper-direct traffic
      contribution.
    relatedQuestionRefs:
      - QM022
      - QM027
  - type: missing-source
    severity: material
    topic: international-mix
    missingEvidence: Current non-U.S. creator count, brand count, GMV, and revenue mix by geography.
    whyItMatters: >-
      International expansion is part of the market story, but public evidence does not show whether it is material
      today or still pre-scale.
    diligencePath: Ask management for U.K., Australia, and other market KPIs plus launch timing and local unit economics.
    relatedQuestionRefs:
      - QM023
      - QM027
  - type: conflicting-data
    severity: material
    topic: pricing-clarity
    missingEvidence: A definitive product-tier price card reconciling subscription fees, campaign fees, and transaction take rates.
    whyItMatters: Conflicting public pricing ranges make it hard to underwrite ARPU, upsell paths, and gross-margin durability.
    diligencePath: >-
      Request current brand pricing deck and historical price changes across self-serve, managed, and opportunity
      products.
    relatedQuestionRefs:
      - QM021
      - QM027
  - type: missing-source
    severity: material
    topic: brand-pricing-opacity
    missingEvidence: >-
      Current list and realized price cards for LTK advanced features, impact.com platform packages, Awin advertiser
      fees, and Amazon Creator Connections campaign economics.
    whyItMatters: >-
      Without public package detail, it is difficult to compare gross-margin durability, sales efficiency, and how much
      buyers are really paying for workflow depth versus pure affiliate rails.
    diligencePath: >-
      Request current rate cards, managed-service scopes, and minimum-spend thresholds from management and from live
      customer references who evaluated at least two competing platforms.
    relatedQuestionRefs:
      - QP004
      - QP022
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: creator-overlap-and-exclusivity
    missingEvidence: >-
      Creator overlap, active-link share, and revenue concentration data showing how many top ShopMy creators also
      actively monetize through LTK, Mavely, Amazon, or direct retailer programs.
    whyItMatters: >-
      Public anecdotes confirm multi-homing, but they do not quantify whether overlap is marginal or structural enough
      to cap ShopMy’s network effects and pricing power.
    diligencePath: >-
      Request cohort retention, creator overlap, and revenue-by-platform-usage segmentation for top-earning creator
      cohorts and compare against equivalent brand-side overlap.
    relatedQuestionRefs:
      - QP023
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: brand-multi-homing-share
    missingEvidence: >-
      Share of ShopMy brand spend that is exclusive, primary, or merely one rail among LTK, Amazon, impact.com, Awin, or
      self-built affiliate communities.
    whyItMatters: >-
      If most brand spend is multi-homed, ShopMy’s workflow moat is weaker and pricing power depends on measurable
      incremental ROI rather than lock-in.
    diligencePath: >-
      Ask management for cohort-level brand retention, primary-platform status, cross-platform overlap, and win-loss
      analysis versus LTK, impact.com, and retailer-native programs.
    relatedQuestionRefs:
      - QP015
      - QP017
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: direct-demand-mix
    missingEvidence: >-
      Comparable direct-traffic or app-engagement metrics for ShopMy, Mavely, and Amazon Creator Connections relative to
      LTK’s public consumer-demand claims.
    whyItMatters: >-
      Owned demand is one of the clearest differences in moat durability, but only LTK and Amazon disclose enough public
      evidence to score this axis confidently.
    diligencePath: >-
      Request destination traffic, app retention, direct-purchase share, and repeat-visit metrics by platform surface;
      supplement with third-party traffic benchmarking if management refuses.
    relatedQuestionRefs:
      - QP021
      - QP025
    relatedTableRefs:
      - TP001
  - type: partial-coverage
    severity: material
    topic: conflicting tracker data on revenue and funding
    missingEvidence: >-
      Latka publishes a revenue and headcount estimate but also claims ShopMy is bootstrapped with zero funding, which
      conflicts with the disclosed financing record and leaves no reliable tracker consensus.
    whyItMatters: >-
      Outside-in tracker disagreement makes public comping and private-market benchmarking noisy, so management-provided
      revenue and cap-table data are still required.
    diligencePath: >-
      Request management revenue bridge, current headcount, and cap-table summary; do not rely on tracker profiles alone
      for underwriting.
    relatedQuestionRefs:
      - QI021
  - type: missing-source
    severity: material
    topic: GMV-to-revenue bridge and realized take rate by stream
    missingEvidence: >-
      Public sources disclose platform-sales, subscriptions, and estimated fee schedules, but none reconcile gross
      platform sales to recognized revenue by subscriptions, affiliate fees, Opportunities, gifting, or shopper
      products.
    whyItMatters: >-
      Without a stream-level bridge, the company could look more SaaS-like or more payments-and-services-like than
      headline metrics imply.
    diligencePath: >-
      Request monthly revenue by stream, gross platform sales, take rates, contra-revenue treatment, and gross margin by
      product line.
    relatedQuestionRefs:
      - QI023
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      A public security overview covering certifications, penetration testing, incident response, moderation, and
      fraud-abuse controls.
    whyItMatters: >-
      Without externally reviewable control documentation, product-trust underwriting depends on management assertions
      rather than verifiable evidence.
    diligencePath: >-
      Request SOC reports, pen-test summaries, trust-center material, moderation policy docs, and recent
      incident-response runbooks under NDA.
    relatedQuestionRefs:
      - QE022
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: native-vs-web-parity
    missingEvidence: >-
      A public or management-confirmed matrix showing which shopper and creator features are native-app only, browser
      only, or parity across surfaces.
    whyItMatters: >-
      Mobile-routing exclusions such as /shop/circles complicate conversion analysis, support expectations, and
      product-prioritization judgments.
    diligencePath: >-
      Request current iOS and Android release notes, parity matrix, and app analytics by route family, especially for
      Circles, Taste Profile, and product pages.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: integration-architecture
    missingEvidence: >-
      Technical detail on whether Shopify, WooCommerce, and Salesforce connections are API-native, batch, manual, or
      middleware-driven.
    whyItMatters: >-
      Implementation complexity and reliability depend heavily on the integration model, data freshness, and failure
      handling between systems.
    diligencePath: >-
      Ask product or engineering for integration architecture diagrams, sync frequency, auth method, and common failure
      modes for each named connector.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: brand-safety-and-fraud
    missingEvidence: >-
      Public documentation on creator vetting, campaign review, content moderation, fraud detection, or payout abuse
      controls.
    whyItMatters: >-
      Paid Opportunities, gifting, and affiliate workflows are abuse-prone without enforceable controls, and public
      marketing does not describe them.
    diligencePath: >-
      Request policy docs on creator review, suspicious-order detection, content review, chargeback handling, and misuse
      escalation.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE004
  - type: missing-disclosure
    severity: material
    topic: named brand proof table
    missingEvidence: >-
      A larger set of named brand customers with spend, campaign duration, or referenceable outcomes rather than
      creator-side anecdotes and logo walls.
