      Without named brand references, it is hard to judge whether ShopMy’s paying customer base is broad and durable or
      concentrated in a few premium relationships.
    diligencePath: >-
      Request a brand customer list segmented by active spend, ask for 5-10 reference calls, and reconcile logo-wall
