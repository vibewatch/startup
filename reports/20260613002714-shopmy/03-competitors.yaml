  evidenceGaps:
  - type: missing-source
    severity: material
    topic: brand-pricing-opacity
    missingEvidence: Current list and realized price cards for LTK advanced features, impact.com platform packages, Awin advertiser fees, and Amazon Creator Connections campaign economics.
    whyItMatters: Without public package detail, it is difficult to compare gross-margin durability, sales efficiency, and how much buyers are really paying for workflow depth versus pure affiliate rails.
    diligencePath: Request current rate cards, managed-service scopes, and minimum-spend thresholds from management and from live customer references who evaluated at least two competing platforms.
    relatedQuestionRefs:
    - QP004
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: creator-overlap-and-exclusivity
    missingEvidence: Creator overlap, active-link share, and revenue concentration data showing how many top ShopMy creators also actively monetize through LTK, Mavely, Amazon, or direct retailer programs.
    whyItMatters: Public anecdotes confirm multi-homing, but they do not quantify whether overlap is marginal or structural enough to cap ShopMy’s network effects and pricing power.
    diligencePath: Request cohort retention, creator overlap, and revenue-by-platform-usage segmentation for top-earning creator cohorts and compare against equivalent brand-side overlap.
    relatedQuestionRefs:
    - QP023
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: brand-multi-homing-share
    missingEvidence: Share of ShopMy brand spend that is exclusive, primary, or merely one rail among LTK, Amazon, impact.com, Awin, or self-built affiliate communities.
    whyItMatters: If most brand spend is multi-homed, ShopMy’s workflow moat is weaker and pricing power depends on measurable incremental ROI rather than lock-in.
    diligencePath: Ask management for cohort-level brand retention, primary-platform status, cross-platform overlap, and win-loss analysis versus LTK, impact.com, and retailer-native programs.
    relatedQuestionRefs:
    - QP015
    - QP017
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: direct-demand-mix
    missingEvidence: Comparable direct-traffic or app-engagement metrics for ShopMy, Mavely, and Amazon Creator Connections relative to LTK’s public consumer-demand claims.
    whyItMatters: Owned demand is one of the clearest differences in moat durability, but only LTK and Amazon disclose enough public evidence to score this axis confidently.
    diligencePath: Request destination traffic, app retention, direct-purchase share, and repeat-visit metrics by platform surface; supplement with third-party traffic benchmarking if management refuses.
    relatedQuestionRefs:
    - QP021
    - QP025
    relatedTableRefs:
    - TP001
