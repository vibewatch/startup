- id: switching-costs-and-multi-homing
  title: Switching costs are real, but multi-homing appears normal
  body: 'The strongest disconfirming evidence is that creators and brands appear comfortable running multiple rails at once. Digiday reported that one creator-management agency sees roughly a 50-50 split of creators using both LTK and ShopMy, and that some creators have shifted day-to-day usage toward ShopMy because of commission economics and easier backend tooling. Mavely’s own guide encourages diversification across every major social and owned channel, reinforcing that creator businesses are not supposed to live on one rail. On the brand side, American Eagle’s new affiliate community is the clearest substitute example: the retailer launched its own creator-affiliate community while still keeping relationships with ShopMy and LTK. Amazon’s policies add another wrinkle. They deepen the appeal of Creator Connections and Amazon-native creator links, but they also constrain how creators can stack Amazon traffic with other commission systems. In practice, switching costs center on payout history,
    analytics continuity, creator-brand relationships, and workflow familiarity, not on hard exclusivity.'
  claimRefs:
