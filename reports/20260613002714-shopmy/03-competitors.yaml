- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Why it matters
  - Diligence ask
  rows:
  - - Premium creator and brand curation
    - Creator multi-homing across LTK, ShopMy, and Mavely
    - High
    - Digiday reported 50/50 creator usage split and better-ShopMy-economics anecdotes
    - If creator supply is portable, exclusive network effects are weaker than headline counts imply
    - Request creator-retention, active-link, and platform-overlap cohorts by top earnings decile
  - - Fast creator payouts
    - Mavely also sells faster payouts and bonus upside
    - Medium-High
    - Mavely claims 45-day payouts plus 25% monthly bonus uplift
    - Cash-flow edge can narrow quickly if rivals keep improving payout cadence
    - Benchmark creator churn against payout speed and bonus attachment
  - - Brand workflow depth
    - impact.com unifies creator, affiliate, and referral operations in one stack
    - High
    - impact.com bundles contracts, discovery, payments, Storefronts, and partner measurement
    - Enterprise buyers may choose one broader partnership OS instead of a specialized creator tool
    - Map win-rate by account size and overlap with impact-led evaluations
  - - Creator-commerce destination expansion
    - LTK already owns larger direct consumer demand and app engagement
    - High
    - LTK claims 40M shoppers plus direct discovery and retailer relationships
    - If owned demand matters, ShopMy remains the smaller destination and may need higher creator incentives
    - Measure how much GMV depends on off-platform traffic versus direct shopper sessions
  - - Affiliate-rail interoperability
    - Amazon policies can force channel conflict on the same traffic
    - Medium
    - Amazon may withhold commissions if the same traffic claims multiple program payouts
    - Policy control can pull creators or brands into Amazon-native rails for Amazon-heavy merchants
    - Ask what share of creator revenue uses Amazon-linked catalog and whether conflicts reduce ShopMy attach
  - - Retailer and brand dependence
    - Brands can self-build affiliate communities while keeping third-party rails
    - High
    - American Eagle launched its own community but still kept ShopMy and LTK relationships
    - Brand-owned programs cap pricing power and increase replacement risk
    - Collect examples where ShopMy was retained, displaced, or relegated to a single workflow slice
  - - Compliance and trust posture
    - Disclosure failures or policy mistakes can damage program ROI and brand trust
    - Medium
    - FTC requires clear in-line disclosures and repeated livestream disclosures
    - Compliance burden raises operating complexity and can favor vendors with stronger governance tooling
    - Review ShopMy product controls for disclosure prompts, audit trails, and Amazon-policy conflict detection
  notes: Severity is a qualitative judgment on current moat durability. The register emphasizes where public evidence directly undermines a simplistic network-effect narrative.
  enumerationScope:
    coverage: partial
    basis: Lists the seven moat claims and substitute threats most visible in current public evidence; additional risks may exist in private retention, pricing, and take-rate data.
