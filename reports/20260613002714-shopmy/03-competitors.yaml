- id: moat-durability-and-adverse-evidence
  title: Moat durability, substitutes, and adverse evidence
  body: 'The durability picture differs by rival. LTK has the clearest consumer-demand moat because its platform already claims tens of millions of shoppers, deep retailer relationships, and proprietary creator-performance data. impact.com has the deepest enterprise workflow moat because it unifies creator, affiliate, referral, contracts, and payouts in one operating layer. Amazon has the strongest native distribution and checkout moat, but that advantage comes with centralized rules that can make creators less flexible and reduce outside-platform economics. Mavely’s moat is weaker on destination demand but stronger on creator openness and cash-flow incentives. ShopMy therefore sits in the middle: stronger than generic affiliate rails on workflow and premium-brand access, but weaker than LTK on direct demand and weaker than impact.com on enterprise breadth. The adverse read is straightforward: if creator content and brand budgets are portable across multiple rails, then ShopMy’s moat depends
    on staying materially better on payouts, workflow, and trust rather than expecting structural lock-in. Incumbent response risk is also real: retained coverage shows LTK already escalated competition into litigation once ShopMy began gaining share, even though that case was later dropped.'
