company:
  name: ShopMy
chapter:
  number: 3
  title: Competitors
  summary: ShopMy competes in a crowded creator-commerce stack where LTK owns the strongest consumer destination and data moat, Mavely competes hardest on creator economics and openness, impact.com brings the deepest enterprise partnership workflow, and Amazon or retailer-owned programs threaten to absorb more activity into native rails. The strongest public evidence supports a moderate-switching-cost market with heavy multi-homing, which means ShopMy’s best defensible edge is workflow quality and creator economics rather than exclusivity.
sections:
- id: landscape-and-positioning
  title: Landscape definition and where ShopMy actually competes
  body: The relevant competitive set is broader than creator storefront apps alone. ShopMy competes directly with LTK and Mavely for creator supply, with impact.com for brand-side creator operating workflows, with Awin and ShareASale for affiliate tracking and payout rails, and with Amazon Creator Connections or retailer-owned communities for on-platform or native alternatives. The practical question for buyers is not whether one platform exists, but which mix of discovery, workflow, payout, and demand generation they need. LTK brings the strongest owned consumer destination and retailer network. Mavely emphasizes open access, bonuses, and faster creator cash flow. impact.com sells unified partnership infrastructure for larger brands that want creator, affiliate, and referral programs in one dashboard. Awin and ShareASale remain broad performance-marketing rails. Amazon brings unmatched product inventory and checkout control. That makes ShopMy look less like a winner-take-all network and
    more like a high-end operating layer inside a multi-rail market.
