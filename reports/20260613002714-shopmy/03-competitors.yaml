- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public creator economics / brand pricing
  - Payout or contract model
  - Included capabilities
  - Unknowns / implication
  rows:
  - - ShopMy
    - Independent coverage says brand subscriptions run about $1k-$7k per month; official creator page shows sample commissions and premium-brand access
    - Weekly creator payouts via PayPal or Stripe
    - Storefronts, affiliate links, brand tools, bonuses, geolinking
    - Current realized take rates and brand package tiers are still private
  - - LTK
    - Base brand platform became free to access with advanced paid features; creator commissions reported around 10-25% average and up to 30%
    - Public payout cadence not clearly disclosed in retained sources
    - Consumer app, creator matching, analytics, campaigns, ads, RMN
    - Opaque advanced-feature pricing makes economic comparison incomplete
  - - Mavely
    - 177% higher-commission claim; boosts can reach 3x on specific links; 10% referral revenue share for six months
    - Biweekly payouts paid 45 days after purchase; monthly bonus adds 25% on top
    - SmartLinks, MyShop, boosts, bonuses, referral economics
    - Brand-side pricing to merchants is not publicly disclosed
  - - impact.com
    - No public price card retained; creator capabilities included in Performance Platform at no extra SaaS cost
    - Platform-managed contracts and creator payments; Anytime Withdrawal announced with PayPal
    - Unified affiliate + creator + referral management, storefronts, APIs
    - Likely enterprise pricing by scope, but public list pricing is absent
  - - Awin / ShareASale
    - Pay-for-performance positioning; commission amounts depend on advertiser programs
    - Network-style partner payments and payout methods including ACH / Payoneer support
    - Publisher marketplace, AI recommendations, automated reporting
    - Good rail for variable commissions, weak public clarity on creator-specific packaging
  - - Amazon Associates / Creator Connections
    - Associates commissions up to 10%; Creator Connections sponsored requests are flat-fee campaigns with Amazon-native licenses
    - Approx. 60-day commission payout cycle; traffic and content rules tightly governed by policy
    - Millions of products, Storefront, Unique Creator Link, sponsored content requests
    - Tighter policy control can lower flexibility for creators multi-homing elsewhere
  notes: This table separates publicly visible creator economics from brand-side packaging. The source set supports directional comparison, not a clean apples-to-apples realized-margin model.
