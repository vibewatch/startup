tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / substitute
  - Category
  - Scale / reach
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - ShopMy
    - Creator-commerce workflow platform
    - 300k+ tastemakers; 47k+ commissionable brands; 350+ direct partners
    - Premium brands and curated creators
    - Weekly payouts, geolinking, premium-brand access, creator + brand workflow
    - No public evidence of LTK-like owned consumer demand or enterprise breadth
  - - LTK
    - Direct peer with consumer destination
    - 40M shoppers; 7,000 retailers; >50 creator teams common in brand programs
    - Brands wanting full-funnel creator media plus consumer app demand
    - Consumer app, proprietary data, LTK 360, AI matching, retail-media hooks
    - Public payout economics do not clearly beat ShopMy and multi-homing remains common
  - - Mavely
    - Creator-first affiliate and storefront peer
    - Open signup; thousands of brands; no follower minimum
    - Everyday creators and performance-oriented affiliate sellers
    - 177% higher-commission claim, 45-day payouts, boosts, referral economics
    - Weaker public evidence of owned demand or premium-brand exclusivity
  - - impact.com
    - Enterprise partnership OS / adjacent direct competitor
    - 5,900+ brands; 2M+ partnerships; >$110B GMV
    - Larger brands consolidating creator, affiliate, and referral programs
    - Unified workflow, contracts, payouts, APIs, Storefronts, creator discovery
    - Public pricing opaque and creator community is less consumer-facing than LTK or ShopMy
  - - Awin / ShareASale
    - Affiliate network rail
    - 1M+ publisher partners; ShareASale migration into Awin
    - Advertisers needing broad partner reach and performance-only economics
    - Large publisher base, flexible commission management, AI partner recommendations
    - Looks more like affiliate infrastructure than a creator-native operating system
  - - Amazon Associates / Creator Connections
    - Retailer-native affiliate + creator marketplace
    - One of the largest affiliate programs; millions of products; Amazon-native creator tools
    - Brands and creators willing to work inside Amazon’s ecosystem
    - Catalog breadth, checkout proximity, Creator Connections briefs, Storefronts
    - Policy control can reduce flexibility and force channel conflict with outside tools
  - - Brand-owned affiliate communities
    - Substitute / internal build
    - American Eagle says own program could scale to thousands of creators
    - Brands wanting direct creator relationships without full platform dependence
    - Keeps first-party relationship and authenticity control while still allowing multi-rail use
    - Requires internal staffing, experimentation, and no proof yet of equivalent tooling depth
  - - Status quo manual stack
    - Substitute / fragmented workflow
    - Spreadsheet + affiliate network + email + creator DM stack
    - Smaller teams and brands not yet ready for software spend
    - Low upfront cash cost and maximum vendor optionality
    - High operational overhead, weak measurement, and hard-to-scale payout/compliance processes
  notes: Rows summarize the most decision-relevant direct peers and substitutes in current public evidence; brand-owned and manual options are included because buyers can solve the same job without ShopMy.
  enumerationScope:
    coverage: partial
    basis: 'Covers the core direct peers named in the chapter brief plus the two most relevant substitute paths: brand-owned communities and the status-quo manual stack.'
