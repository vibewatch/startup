summary:
  headline: >-
    ShopMy has built a credible, fast-scaling creator-commerce platform with real platform-sales and profitability
    signals, but the public record still supports only a track stance because the latest $1.5 billion valuation sits
    ahead of disclosed fundamentals and detailed financing terms.
