  topStrengths:
    - >-
      ShopMy shows real operating momentum, including rapid 2024 growth, claimed profitability since 2024, and a large
      late-2025 financing from credible venture investors.
    - >-
      The platform appears broader and stickier than a simple affiliate-link tool because it combines subscriptions,
      campaign tooling, gifting, payout handling, analytics, and shopper-discovery surfaces.
    - >-
      Creator and brand scale signals are meaningful, with public sources citing more than $1 billion in annual platform
      sales and large creator and brand networks.
    - >-
      The company is positioned inside a durable creator-commerce tailwind as brands shift toward measurable performance
      and commerce-linked creator spend.
  topRisks:
    - >-
      The last $1.5 billion valuation is difficult to underwrite from public data because current revenue, gross margin,
      NRR, concentration, and cash metrics remain undisclosed.
    - >-
      Creator counts, brand counts, and business-scale disclosures drift across sources, reducing confidence in precise
      operating denominators.
    - >-
      ShopMy remains exposed to platform-policy shifts, affiliate-program rule changes, and creator multi-homing across
      Amazon, Meta, TikTok, LTK, and other surfaces.
    - >-
      Consumer expansion broadens upside but raises execution risk because public evidence still does not show shopper
      MAU, conversion, or monetization durability.
  unresolvedGaps:
    - Current GAAP revenue, gross margin by stream, burn or cash generation, runway, and audited cash balances.
    - Net revenue retention, brand logo churn, top-brand and top-creator concentration, and creator cohort durability.
    - >-
      Exact post-money share count, liquidation preferences, pro rata or control rights, any secondary sales, and other
      late-round cap-table terms.
    - >-
      Shopper engagement and monetization metrics for Circles, Rewards, Noir, and mobile usage beyond ratings or
      anecdotal adoption.
