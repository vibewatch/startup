callouts:
- calloutType: risk
  title: FTC exposure is the fastest path from growth story to diligence stop
  body: 'The public record already contains the rulebook: affiliate links, gifting, and sponsored content need clear disclosures that sit with the endorsement itself. ShopMy’s business model uses exactly those surfaces, so weak creator controls would be an execution failure, not a gray area.'
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021
- calloutType: risk
  title: Privacy burden rose when ShopMy became shopper-facing
  body: Circles, Wishlists, account-gated shopper features, and data-rich storefront surfaces make privacy governance a live operating issue. The concern is not just what the policy says; it is whether internal controls match the policy before complaints arrive.
  claimRefs:
  - CR001
  - CR002
  - CR007
  - CR009
  - CR013
  - CR023
- calloutType: risk
  title: Creator loyalty looks weaker than affiliate-platform marketing suggests
  body: The adverse creator-economy literature increasingly treats multi-homing as normal behavior. If creators compare commissions, cookie windows, and native-checkout conversion every quarter, ShopMy has to keep earning the right to sit in the flow.
  claimRefs:
  - CR041
  - CR042
  - CR043
  - CR044
  - CR045
- calloutType: recommendation
  title: Ask for concentration and control dashboards before underwriting scale
  body: 'The single best diligence upgrade is a hard data pack: top-merchant GMV mix, creator cohort churn, partner-policy incident history, DSAR SLA performance, and attribution-dispute logs. Without those dashboards, the growth narrative stays largely management-authored.'
  claimRefs:
  - CR022
  - CR027
  - CR052
  - CR055
