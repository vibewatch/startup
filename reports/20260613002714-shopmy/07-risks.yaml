- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Failure mode
  - Why it matters
  - Likelihood
  - Impact
  - Current mitigation
  - Residual exposure
  - Diligence ask
  rows:
  - - Broad data footprint across web/app/extension
    - ShopMy’s privacy policy covers websites, mobile apps, and extensions and describes collecting identities, usage, and social-media-linked information.
    - Medium-High
    - High
    - Published privacy policy and declared rights flows
    - Public documentation does not show internal control quality, vendor minimization, or access logging.
    - Request SOC/privacy control narrative, vendor inventory, permission model, and role-based access review.
  - - Estimated purchase counts can limit auditability
    - ShopMy estimates recent purchase counts to protect shopper privacy rather than showing exact underlying shopper data.
    - Medium
    - Medium
    - Privacy-preserving metric design
    - Creators and investors may lack clean evidence for repeat-buyer quality or attribution fairness.
    - Request internal exact-versus-estimated metric definitions, audit trails, and controls around reported creator statistics.
  - - Mandatory discovery surfaces can override creator curation
    - Creators cannot hide the For You tab even though storefront identity is part of the platform’s value proposition.
    - Medium
    - Medium-High
    - Creators can hide some tabs and keep collections curated
    - Required algorithmic or platform-defined surfaces can weaken creator autonomy and conversion consistency.
    - Request A/B tests on For You conversion, opt-out policy rationale, and complaints from creators about forced surfaces.
  - - Link freshness and broken-link cleanup are not yet fully automated
    - ShopMy says links can take up to 24–48 hours to process and that full broken-link automation is still in progress.
    - Medium-High
    - Medium-High
    - Continuous audits and manual review
    - Latency or stale links can hurt trust, conversion, and merchant relationships during high-volume events.
    - Request broken-link rate, SLA by creator tier, manual workload, and merchant-side complaint metrics.
  - - Cross-border localization can misroute traffic or pricing
    - Auto-localization helps reach global audiences, but cross-border retailer equivalence and pricing mismatches can create attribution and shopper-experience problems.
    - Medium
    - Medium
    - Automatic localization where possible
    - Equivalent product mapping and commission attribution may fail in edge cases.
    - Request localization success rate, dispute volume, and list of unsupported merchants or markets.
  - - Consumer-account features increase security expectations
    - Circles and Wishlists require shopper accounts, expanding stored identity and preference data beyond basic link-out browsing.
    - Medium
    - High
    - Account requirement is explicit and privacy policy exists
    - Public evidence does not show MFA, account-recovery safeguards, or abuse-detection outcomes.
    - Request account-security roadmap, fraud incidents, login-abuse metrics, and consumer support tickets tied to account access.
  notes: This table focuses on operating failure modes visible in public documentation, not on hidden security certifications that were not publicly located.
