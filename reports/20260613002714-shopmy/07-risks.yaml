  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-litigation-search
    missingEvidence: Counsel-led litigation schedule, arbitration log, and any regulator correspondence involving ShopMy, founders, or key subsidiaries.
    whyItMatters: Free public search tools do not prove the absence of threatened claims, sealed matters, or private arbitrations.
    diligencePath: Run paid federal/state docket searches, Delaware and New York entity checks, and management-representation schedule review.
    relatedQuestionRefs:
    - QR007
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: privacy-controls
    missingEvidence: Vendor inventory, DPA pack, data-retention matrix, DSAR response dashboard, and privacy incident log.
    whyItMatters: The public policy describes a broad data footprint and targeted-advertising sharing, but does not prove control quality or statutory response performance.
    diligencePath: Request privacy governance package, named privacy owner, recent audits, and sample fulfilled consumer requests.
    relatedQuestionRefs:
    - QR003
    - QR005
    - QR006
    - QR022
  - type: private-evidence-only
    severity: material
    topic: creator-churn-and-wallet-share
    missingEvidence: Creator retention by cohort/tier, top-10 creator GMV share, and creator wallet-share versus Amazon, LTK, and Meta-native tools.
    whyItMatters: Public evidence suggests multi-homing is structural, so durability depends on internal retention and share-of-wallet data rather than narrative.
    diligencePath: Request monthly cohort tables, top-creator concentration, and creator survey or win/loss data explaining why links stay on ShopMy.
    relatedQuestionRefs:
    - QR019
    - QR025
    - QR030
  - type: private-evidence-only
    severity: material
    topic: merchant-concentration
    missingEvidence: Top-20 merchant GMV mix, category mix, take-rate by retailer, and policy-incident history for key merchants or affiliate networks.
    whyItMatters: Premium-brand focus and retailer exclusivity can make rate cuts or partner disputes more damaging than aggregate GMV suggests.
    diligencePath: Request merchant concentration deck and partner-contract summary with historical commission changes.
    relatedQuestionRefs:
    - QR016
    - QR017
    - QR018
    - QR028
    - QR030
  - type: private-evidence-only
    severity: material
    topic: shopmy-scale-corroboration
    missingEvidence: Board materials or audited monthly KPIs supporting platform sales, growth, and profitability claims.
    whyItMatters: The biggest scale metrics in the file are company-reported; without internal corroboration they should not be treated as fully de-risked.
    diligencePath: Request investor update deck, board pack, or finance summary that reconciles platform sales, revenue growth, and profitability.
    relatedQuestionRefs:
    - QR016
    - QR027
