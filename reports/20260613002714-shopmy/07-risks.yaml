company:
  name: ShopMy
chapter:
  number: 7
  title: Risks
  summary: ShopMy’s main risk is not lack of creator-commerce demand; it is that the company sits between regulators, platforms, merchants, and creators that can all change the rules faster than ShopMy can lock in loyalty. FTC disclosure requirements, a broad 2026 privacy footprint, Amazon/TikTok/Instagram policy asymmetry, and structural creator multi-homing make the model more fragile than headline growth and profitability claims imply. The file is investable only if management can prove strong controls, low concentration, and real creator-retention durability with internal dashboards rather than narrative.
sections:
- id: risk-overview-and-underwriting-frame
  title: The main risk is policy and dependency compression, not lack of product ambition
  body: 'ShopMy’s public materials show a platform trying to operate three businesses at once: creator tooling, brand performance infrastructure, and a newer shopper-facing discovery layer. That expansion creates real upside, but the adverse evidence says the next underwriting question is not whether affiliate commerce exists; it is whether ShopMy can keep enough control while standing on top of other platforms’ rules, other merchants’ commission schedules, and creators who increasingly multi-home across every surface that pays. The current risk stack is therefore interactive. FTC disclosure failure or California privacy complaints would hurt brand trust just as consumer-facing Circles and Wishlists increase data-handling scope. Meanwhile, Amazon, TikTok, and Instagram all keep unilateral control over access, attribution, or monetization, and creators are openly taught to optimize across platforms instead of staying loyal to one storefront. The company’s own October 2025 release points to
    scale and profitability, but also confirms that ShopMy now spans creators, brands, and consumers—raising execution burden precisely when partner dependence is still high.'
