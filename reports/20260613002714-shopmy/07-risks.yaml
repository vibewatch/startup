tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Current public evidence
  - Likelihood
  - Impact
  - Mitigation maturity
  - Residual exposure
  - Diligence path
  rows:
  - - FTC endorsement non-compliance
    - FTC guidance requires clear material-connection disclosure with the endorsement, and says platform tools alone may not suffice.
    - High
    - High
    - Low-Medium
    - One sloppy creator workflow can create repeated deceptive-ad risk across hundreds of posts.
    - Request creator disclosure policy, brand-review workflow, sample audits, and any notice history from brands, networks, or regulators.
  - - Privacy / targeted-advertising challenge
    - ShopMy’s June 2026 policy covers sites, apps, and extensions and says it may sell or share categories of personal information for targeted advertising.
    - Medium-High
    - High
    - Medium
    - Consumer-facing features widen the set of identities, browsing, and shopping signals that can trigger DSAR or consent failures.
    - Request data map, vendor list, DPA pack, DSAR SLA dashboard, cookie-consent logs, and privacy-impact assessments for Circles/Wishlists.
  - - California complaint path
    - California consumers can demand deletion, correction, and opt-outs, and can complain to the AG or CPPA.
    - Medium
    - High
    - Medium
    - Even low complaint volume can escalate if response workflows or verification controls are weak.
    - Request complaint log, escalation protocol, and evidence that privacy requests are routed to the correct business entity within statutory windows.
  - - Partner-terms breach / commission clawback
    - Amazon reserves the right to cease commission payments, terminate on notice, or suspend immediately for breach, liability, or deceptive activity.
    - Medium-High
    - High
    - Low-Medium
    - A single large retail partner can change economics or cut off revenue faster than ShopMy can replace it.
    - Request top-retailer GMV and take-rate concentration, incident history with Amazon or other major networks, and contingency plans for partner suspension.
  - - Public-litigation blind spot
    - Free FTC and court-search surfaces are review tools, but they do not by themselves prove the absence of threatened claims, arbitrations, or sealed disputes.
    - Medium
    - Medium-High
    - Low
    - The public record may understate disputes if matters are private, threatened, or settled early.
    - Run counsel-led entity, founder, and key-subsidiary litigation searches across paid dockets; request litigation schedule, arbitration log, and regulator correspondence.
  notes: Severity ordering reflects legal and regulatory issues most likely to impair brand trust, affiliate economics, or merchant willingness to use the platform.
  enumerationScope:
    coverage: partial
    basis: Rows cover the main public legal and regulatory risks evidenced by reviewed 2026 materials, but private arbitrations, merchant disputes, and regulator correspondence are not visible in free public sources.
