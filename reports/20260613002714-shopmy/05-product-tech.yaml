  - CE038
- calloutType: risk
  title: Public trust documentation lags product ambition
  body: ShopMy documents how creators create links and how brands activate campaigns, but public evidence on security certifications, fraud controls, moderation, and integration architecture remains sparse. That raises diligence burden for any investor underwriting platform-risk resilience.
  claimRefs:
  - CE028
  - CE040
  - CE041
