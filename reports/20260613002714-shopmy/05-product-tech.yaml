  rows:
  - - Creator storefronts
    - Creators / stylists
    - Custom shops with sections, collections, links, search, latest/popular tabs, and product pages
    - Current production surface with detailed guide coverage
    - Blends affiliate links with curated editorial shop behavior and shopper personalization
    - No public usage metrics by module or conversion-rate disclosure
  - - Hidden collections and consults
    - Creators / private clients
    - Supports private curation and paid consult-style workflows inside the platform
    - Current guide-documented workflow
    - Lets creators use ShopMy for one-to-one clienteling, not just public posting
    - No public take-rate or attach-rate disclosure for consult workflows
  - - Snapshop link generation
    - Creators
    - Creates commissionable links directly from retailer pages and adds them to collections
    - Current production surface across Chrome and Safari
    - Reduces switching cost between retailer pages and ShopMy while surfacing alternative commission rates
    - Public install flow is still workaround-heavy on Safari
  - - Discover
    - Brands
    - Finds creators through curated lists, filters, performance data, and AI recommendations
    - Current production module with product-owner hiring behind it
    - Focuses on taste and sales signals rather than follower-count-only sourcing
    - No public explanation of recommendation features or ranking weights
  - - Engage
    - Brands
    - Runs affiliate setup, gifting, lookbooks, direct chat, and placements
    - Current production module
    - Moves seeding and relationship management into one creator-friendly workflow
    - No public SLA or message-delivery / moderation detail
  - - Track
    - Brands
    - Measures promoter performance, social mentions, payouts, invoices, and ROI
    - Current production module
    - Combines attribution, mentions monitoring, and operational payments inside one console
    - No public data-retention, latency, or reconciliation detail
  - - Amplify / Opportunities
    - Brands / creators
    - Runs lower-lift paid collaborations, monthly bonus programs, and campaign analytics
    - Current production module with 2025 feature iteration
    - Turns affiliate into an activatable budget line rather than passive channel only
    - No public disclosure of platform fee logic, fraud controls, or approval guardrails
  - - Shopper surfaces
    - Shoppers
    - Provides Shop by Curator/Circle/Brand/Category plus My Circles and My Taste Profile
    - Current production surface on current site and storefront docs
    - Adds persistent discovery and taste learning beyond one creator storefront
    - Native-app versus browser parity is not publicly documented
  notes: Rows reflect the public product map as of the 2026-06-13 run date; maturity labels refer to externally visible documentation or current marketing surface, not internal release telemetry.
