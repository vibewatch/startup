- id: architecture-and-engineering-signals
  title: Architecture, data platform, and engineering signals
  body: ShopMy does not publish public API or security architecture documentation, so the clearest technical read comes from a combination of machine-readable app artifacts and hiring signals. The manifest shows a standalone web app, while the Apple app-site-association file exposes a mature deep-link map across shops, products, opportunities, discover, payouts, partners, chat, and TikTok auth. The same file also shows distinct development, staging, and production iOS app identifiers, which is a strong public signal that ShopMy runs separate app environments rather than a single monolithic release target. Hiring signals fill in the application stack. The senior full-stack role names Node.js, React, Redux, relational databases, AWS, ALB, ECS, and CloudWatch. The ML role describes production systems for personalization, search, recommendations, embeddings, vector representations, and ML-powered APIs. The data role adds Snowflake, BI, experimentation, attribution, and product analytics tools.
    Together these sources suggest a commerce platform with a modern web application core, internal data pipelines, user-facing recommendation systems, and growing product specialization across creator and brand surfaces.
