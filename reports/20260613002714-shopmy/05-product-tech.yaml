- id: brand-operating-system
  title: Brand operating system and monetization workflows
  body: 'The brand product is explicitly modularized into Discover, Engage, Track, and Amplify, and the public descriptions are specific enough to map these modules to real operating jobs. Discover covers curated rosters, filtering, performance data, and AI-assisted recommendations. Engage covers the relationship layer: affiliate setup, gifting, lookbooks, direct messaging, and placements. Track covers performance measurement, social mentions, operational payouts, and POS integrations. Amplify packages Opportunities as a repeatable paid-collaboration engine and now distinguishes always-on monthly bonus programs from more structured promotional campaigns. The product-builder role descriptions reinforce that this is not just marketing copy. ShopMy is hiring dedicated product ownership over discovery/search, gifting, campaign management, analytics, attribution, reporting, onboarding, storefronts, earnings, and creator discovery. That implies the company views creator marketing as an operating
    system with separate subsystems, not as a thin dashboard over affiliate links. It also explains why brand subscriptions could become economically important: the product is trying to own daily workflow, not only track a downstream sale.'
