- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / dependency
  - Public status
  - Scope
  - Why it matters
  - Open gap / risk
  rows:
  - - FTC disclosure obligations
    - Explicit external guidance is public and current
    - Applies to affiliate links, gifting, paid collaborations, and endorsements
    - ShopMy workflows create material-connection scenarios that require clear disclosure
    - ShopMy does not publish a public platform-specific disclosure playbook or enforcement workflow
  - - Payout rails
    - Official guides say creator payouts use Stripe or PayPal
    - Affects creator cash flow and brand reconciliation
    - Settlement timing and payout reliability are dependency risks outside ShopMy’s direct control
    - No public SLA, failure-rate, or fallback-rail disclosure
  - - Retailer commission coverage
    - Snapshop guide says 50k+ retailer partners and can show “no commission available”
    - Affects which links monetize and how rates compare across retailers
    - Monetization quality depends on partner coverage and rate availability
    - No public retailer-level coverage matrix or partner-quality score
  - - Safari Snapshop support
    - Publicly documented but requires disabling cross-origin restrictions
    - Affects a subset of creator installation flows
    - Introduces a trust and support burden for non-technical users
    - No public alternative Safari implementation path is documented
  - - Mobile routing controls
    - AASA file shows granular includes and excludes
    - Shapes whether experiences open natively or stay in browser
    - Important for shopper conversion, app engagement, and support expectations
    - No public explanation for why Circles remains excluded from universal links
  - - Security / fraud / moderation controls
    - No public security-certification or fraud-control page found in retained sources
    - Would govern creator/brand trust, content integrity, and platform abuse
    - Absence of evidence is not proof of weakness, but it blocks external verification
    - Public SOC 2, pen-test, moderation, and incident-response artifacts were not found
  notes: This table separates positively documented controls from dependency and documentation gaps; several high-impact trust controls remain non-public rather than disproven.
