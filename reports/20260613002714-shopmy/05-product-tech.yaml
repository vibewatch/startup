  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: A public security overview covering certifications, penetration testing, incident response, moderation, and fraud-abuse controls.
    whyItMatters: Without externally reviewable control documentation, product-trust underwriting depends on management assertions rather than verifiable evidence.
    diligencePath: Request SOC reports, pen-test summaries, trust-center material, moderation policy docs, and recent incident-response runbooks under NDA.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: native-vs-web-parity
    missingEvidence: A public or management-confirmed matrix showing which shopper and creator features are native-app only, browser only, or parity across surfaces.
    whyItMatters: Mobile-routing exclusions such as /shop/circles complicate conversion analysis, support expectations, and product-prioritization judgments.
    diligencePath: Request current iOS and Android release notes, parity matrix, and app analytics by route family, especially for Circles, Taste Profile, and product pages.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: integration-architecture
    missingEvidence: Technical detail on whether Shopify, WooCommerce, and Salesforce connections are API-native, batch, manual, or middleware-driven.
    whyItMatters: Implementation complexity and reliability depend heavily on the integration model, data freshness, and failure handling between systems.
    diligencePath: Ask product or engineering for integration architecture diagrams, sync frequency, auth method, and common failure modes for each named connector.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: brand-safety-and-fraud
    missingEvidence: Public documentation on creator vetting, campaign review, content moderation, fraud detection, or payout abuse controls.
    whyItMatters: Paid Opportunities, gifting, and affiliate workflows are abuse-prone without enforceable controls, and public marketing does not describe them.
    diligencePath: Request policy docs on creator review, suspicious-order detection, content review, chargeback handling, and misuse escalation.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
