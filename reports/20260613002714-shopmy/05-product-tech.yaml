chapter:
  number: 5
  title: Product & Technology
  summary: ShopMy now spans creator storefronts, brand operating software, and shopper-discovery surfaces rather than a single affiliate-link tool. Official product pages, creator-guide docs, mobile deep-link files, and engineering hiring all point to a layered platform built around curated shops, opportunities, analytics, payouts, and recommendation systems, but public evidence on security controls, integration architecture, and fraud moderation remains thin.
sections:
- id: creator-and-shopper-surfaces
  title: Creator storefronts and shopper discovery surfaces
  body: 'ShopMy’s public creator and shopper materials describe a product that has moved beyond static link-in-bio pages. On the creator side, the storefront is presented as a customizable hub with sections, collections, links, hidden collections, shoppable posts, consults, and direct add-by-URL workflows from retailer pages. The summer 2025 storefront refresh materially expanded the shopper layer: Latest Finds auto-populates from visible links, Most Popular ranks what other shoppers are buying, and For You personalizes product suggestions using shopper taste signals over time. The current site also elevates My Circles and My Taste Profile as first-class destinations, indicating that the consumer product is now a persistent recommendation surface rather than only a pass-through checkout link. Snapshop extends this workflow back to the open web by letting creators generate commissionable links without leaving retailer pages. The result is a creator-commerce stack that tries to make content
    durable, searchable, and personalized instead of leaving monetization trapped inside ephemeral stories or one-off posts.'
