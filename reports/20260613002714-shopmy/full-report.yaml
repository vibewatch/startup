              ShopMy’s public creator and shopper materials describe a product that has moved beyond static link-in-bio
              pages. On the creator side, the storefront is presented as a customizable hub with sections, collections,
              links, hidden collections, shoppable posts, consults, and direct add-by-URL workflows from retailer pages.
