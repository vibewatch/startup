  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing, and recognition signals
        blocks:
          - type: paragraph
            body: >-
              ShopMy’s revenue model is broader than affiliate-link monetization alone. Official creator and brand pages
              show a platform that combines digital storefronts, affiliate links, creator-brand messaging, gifting,
              campaign management, and talent payment. The official payment guide says creators typically see 10% to 30%
              commission rates, that commissions can take 30 to 120 days to move from pending to locked, and that ShopMy
              then pays weekly on Fridays via Stripe or PayPal. On the brand side, the current product surface says
              ShopMy handles weekly talent payouts while sending brands a single monthly invoice, implying that ShopMy
              sits in the middle of cash reconciliation rather than merely passing software access through unchanged.
              Public third-party reporting adds the clearest list-pricing signal: Modern Retail said brand subscriptions
              run about $1,000 to $7,000 per month and had become the majority of revenue by early 2025. Sacra’s 2026
              estimate pack goes further by modeling a recurring-plus-transaction mix, but those fee and take-rate
              details remain analyst estimates rather than company disclosure. The right financial read is therefore
              that recurring SaaS revenue likely improves quality, while realized take rates and revenue recognition
              mechanics still need management backup.
