      - number: '1.4'
        title: Milestones, product expansion, and adverse context
        blocks:
          - type: paragraph
            body: >-
              The chronology shows ShopMy repeatedly adding new layers rather than standing still as a storefront tool.
              The company was founded in 2020, launched an initial version in July 2020, disclosed a Form D in December
              2023, scaled into brand subscriptions in 2024, launched its consumer platform with Circles in July 2025,
              and closed a unicorn round in October 2025. The product milestones are not cosmetic. Circles turned ShopMy
              from a one-creator storefront model into a multi-curator consumer discovery experience, while the
              Opportunities case study shows how the platform now packages creator marketing into repeatable performance
              infrastructure for brands. At the same time, there are visible adverse signals that later chapters need to
              examine. Modern Retail reported that LTK sued ShopMy in 2024 over false advertising, trademark
              infringement, and unfair competition before dropping the case. Digiday described creators diversifying
              because algorithmic platforms can suddenly reduce reach, and agency commentary in that piece suggested
              creators increasingly use ShopMy for friendlier economics and back-end tooling. Privacy and disclosure
              obligations also remain material because ShopMy monetizes affiliate links and creator recommendations
              across social channels, making FTC endorsement compliance and data-handling controls strategic rather than
              back-office issues.
