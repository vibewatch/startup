  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Why it matters
      - Current public proxy
      - Diligence path
      - Underwriting consequence
    rows:
      - - GAAP revenue by stream
        - Needed to separate recurring SaaS quality from GMV-linked volatility.
        - Modern Retail pricing + Sacra / Latka estimates only
        - >-
          Request audited or management revenue split across subscriptions, transaction fees, Opportunities, and any
          service revenue.
        - Cannot reliably value the mix or durability of revenue.
      - - GMV-to-revenue bridge and realized take rate
        - A >$1B platform-sales headline is not equivalent to recognized revenue.
        - Official platform-sales claims plus Sacra take-rate estimates
        - Request gross platform sales, net revenue, take rate by stream, and contra-revenue treatment.
        - GMV could overstate economic capture.
      - - Gross margin by product line
        - Critical for judging whether payments, gifting, and campaign workflows dilute software margins.
        - Only product-surface inference from current pages
        - Request gross margin for subscriptions, affiliate fees, Opportunities, and any services.
        - Margin path remains speculative.
      - - Cash, burn, and runway
        - Needed to test capital adequacy under expansion scenarios.
        - Recent funding + claimed profitability since 2024
        - Request monthly cash balance, burn / generation, and scenario runway.
        - Cannot price financing dependency or dilution risk.
      - - Retention and concentration
        - Net retention and customer concentration determine whether scale is durable.
        - 600 brand subscribers cited in early 2025 and broad creator counts, but no cohort data
        - Request NRR, gross retention, top-customer concentration, and cohort-level churn.
        - Growth quality and downside resilience remain unclear.
      - - Creator payout reversals / return-rate exposure
        - Returns and cancellations can reduce creator earnings and affect trust in the platform.
        - Official FAQ notes negative commissions and variable realized rates
        - Request chargeback, cancellation, return, and payout-adjustment rates by category.
        - Supply-side economics may look better in gross than in net terms.
      - - International and shopper monetization mix
        - Consumer and cross-border expansion may change both TAM and cost structure.
        - Current site and 2025 coverage show shopper adoption, but no direct monetization split
        - Request revenue and gross-margin contribution from shopper products and international business.
        - Forward model cannot distinguish growth from monetization quality.
    notes: >-
      These are the minimum unresolved inputs preventing a fully underwritable view. Public articles give momentum and
      product detail, but not the management metrics needed for rigorous valuation work.
