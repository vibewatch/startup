      - number: '8.3'
        title: Bull, base, and bear scenario range
        blocks:
          - type: paragraph
            body: >-
              Because the public file is incomplete, scenario analysis is more trustworthy than a single target price.
              The bull case assumes ShopMy turns the current three-sided build into a larger shopper-plus-brand
              operating system: revenue reaches roughly $150M by 2027, the consumer layer improves repeat conversion,
              and the market still pays 12x-14x revenue for a profitable, premium creator-commerce platform. That
              produces roughly $1.8B-$2.1B of enterprise value and only modest upside from the last private mark. The
              base case assumes revenue reaches about $110M-$120M, but multiple compression to 8x-10x follows normal
              maturation and tougher comparison with larger infrastructure peers; that lands around $0.9B-$1.2B. The
              bear case assumes weaker creator retention, heavier competition from native platform tools, and no clean
              proof of margin durability, leaving revenue near $70M-$80M and value at only $0.3B-$0.5B. On a
              probability-weighted basis, the public-evidence range still sits below the October 2025 price, which is
              why the recommendation stays cautious.
            claimRefs:
              - CV040
              - CV041
              - CV042
              - CV043
              - CV047
