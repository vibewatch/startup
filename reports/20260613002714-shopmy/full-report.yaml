      - number: '2.4'
        title: Platform context, competitive pressure, and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Competitive context cuts both ways. LTK, impact.com, Amazon, Awin, Mavely, and even brands such as
              American Eagle are all building creator-affiliate infrastructure, which validates the category and
              educates buyers. The same dynamic, however, weakens any claim that creators or brands are locked into a
              single platform. Public reporting shows creator multi-homing, brand multi-homing, retailer-owned creator
              programs, and continuing platform dependence on Instagram, TikTok, and other external traffic sources.
              Public numbers are also still noisy on pricing, take rates, geographic mix, and segment-level margins. The
              chapter therefore supports a bullish market-demand view, but it does not support precise underwriting of
              ShopMy’s durable share without management data on international adoption, revenue mix by product, and how
              much direct shopper traffic can be built outside algorithm-driven social channels. The current public
              evidence pack is also thin on cohort retention, direct-traffic share, international revenue contribution,
              and creator-versus-brand revenue by cohort, which means a large GMV headline could still hide fragile take
              rates or low repeat usage if creators, retailers, or brands can route commerce through substitute rails
              elsewhere.
