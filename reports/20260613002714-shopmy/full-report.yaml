  - id: TV006
    title: Thesis-break and kill triggers table
    description: Observable triggers that would force a downshift in recommendation or a reset in valuation expectations.
    columns:
      - Trigger
      - Threshold / event
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Revenue proof falls short
        - >-
          2026 revenue disclosure implies the October 2025 mark was well above 20x still-current revenue without
          matching margin quality
        - The bull case depends on a real software-like revenue and margin profile, not just GMV optics.
        - Do not buy at private-round pricing; re-underwrite on lower revenue base.
      - - Shopper layer fails to stick
        - Management cannot show meaningful MAU, repeat visits, wishlist conversion, or app retention
        - A large part of the strategic upside comes from owning more of the shopper relationship.
        - Strip out consumer optionality and value the business more like a narrower B2B creator tool.
      - - Competitive compression
        - Native platform or infrastructure competitors reduce creator or brand willingness to pay
        - The premium multiple assumes durable differentiation, not commoditized affiliate plumbing.
        - Lower multiple assumptions toward the bear-case band.
      - - Cap-table surprise
        - Preferences, participation, or anti-dilution terms are materially more investor-friendly than expected
        - Common-equity value can be far lower than headline post-money valuations imply.
        - Pause until fully diluted downside waterfall is modeled.
      - - Retention quality is weak
        - Brand churn or creator concentration proves materially worse than implied by public narrative
        - Subscription majority and network-effect claims would deserve less credit.
        - Treat the business as a campaign marketplace rather than compounding software revenue.
    notes: Each trigger is monitorable and tied directly to valuation transmission rather than to generic operational noise.
    claimRefs:
      - CV025
      - CV027
      - CV038
      - CV039
      - CV047
      - CV048
  - id: TV007
    title: Final diligence asks table
    description: Specific evidence needed before a price-sensitive investor could improve the recommendation.
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current revenue and margin
        - 2025-2026 monthly revenue by stream and gross margin by stream
        - Core input for deciding whether the current mark is supportable.
        - Finance team / board package request.
      - - Cap table and preference stack
        - Fully diluted cap table, liquidation preferences, participation, anti-dilution, board rights
        - Needed to translate headline post-money value into real common and new-money economics.
        - Legal + CFO data-room request.
      - - Retention and concentration
        - NRR, GRR, logo churn, top-brand concentration, creator concentration
        - Determines whether the software layer compounds or resets every campaign cycle.
        - Revenue-operations request and cohort dashboard review.
      - - Shopper engagement
        - MAU, repeat visit, wishlist conversion, and app-retention metrics for Circles / app
        - Needed to price consumer optionality instead of assuming it.
        - Product analytics review.
      - - Next-round timing
        - Cash on hand, monthly burn / generation, and financing trigger thresholds
        - Clarifies whether investors are buying into strength or future capital dependence.
        - Finance and board materials request.
    notes: >-
      The file should move to buy only if these asks close the biggest valuation-support gaps or the entry price resets
      materially lower.
    claimRefs:
      - CV039
      - CV044
      - CV048
