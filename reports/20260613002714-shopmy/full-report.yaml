      - number: '7.2'
        title: FTC disclosure and privacy compliance are the most monitorable legal risks
        blocks:
          - type: paragraph
            body: >-
              The clearest hard-risk surface is not a public lawsuit already on the books; it is the combination of
              specific disclosure obligations and a broader data-policy footprint. FTC guidance is direct that affiliate
              and gifted-product relationships are material connections, that creators themselves are responsible for
              compliance, and that a platform tool alone may not be enough. That matters because ShopMy’s value
              proposition depends on affiliate links, brand partnerships, gifting, and creator recommendations at scale.
              At the same time, the company’s June 2026 privacy policy covers websites, apps, and extensions; says it
              collects sensitive commerce and behavioral data; and says it may sell or share categories of personal
              information for targeted advertising. California law then gives residents deletion, correction, and
              sell/share opt-out rights, plus a complaint route to the Attorney General and CPPA. None of that proves
              active misconduct. It does mean the chapter should treat disclosure controls, DSAR response times, vendor
              governance, and consent logs as diligence items that can fail the investment even without a headline
              enforcement action.
            claimRefs:
              - CR001
