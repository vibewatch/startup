chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and platform scope
        blocks:
          - type: paragraph
            body: >-
              ShopMy operates under the legal name Shop My Shelf, Inc. and presents itself as creator-commerce
              infrastructure that connects creators, premium brands, and shoppers through curation rather than
              algorithm-first feeds. The current team page says the company was born from an MIT research project and is
              headquartered in New York, while the 2023 SEC Form D filing confirms Delaware incorporation, the legal
              entity name, and a historical Worcester, Massachusetts business address used for that financing notice.
              The operating proposition has broadened over time. ShopMy’s creator-facing pages emphasize digital
              storefronts, affiliate links, brand partnerships, weekly payouts, and curated admission to the network.
              Its brand-facing pages emphasize discovery, engagement, tracking, and amplification tools intended to
              convert word-of-mouth into measurable revenue. By mid-2025 and into 2026, the platform also positioned
              itself as a shopper destination through Circles, Taste Profile, wishlists, and multi-curator discovery.
              This three-sided positioning matters because it makes ShopMy more than a simple affiliate-link utility; it
              is trying to be infrastructure for recommendation-led commerce across supply, demand, and measurement
              layers.
