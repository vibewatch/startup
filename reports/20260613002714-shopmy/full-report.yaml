  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing logic
        blocks:
          - type: paragraph
            body: >-
              ShopMy should not be underwritten against the entire creator economy without adjustment. The relevant
              market is creator-commerce infrastructure: software and workflow layers that help creators monetize
              recommendations, help brands discover and pay creators, and help shoppers convert that trust into
              attributable sales. Public sources support a broad creator-economy envelope in the $234 billion to $252
              billion range for 2026 and an influencer-marketing spend layer around $39 billion to $40.5 billion, but
              those figures include revenue pools that ShopMy does not capture directly. A better boundary separates the
              broad creator economy from the narrower software, attribution, and commerce-enablement layer, then further
              narrows to the premium-brand, high-trust, creator-led shopping niche where ShopMy competes. That still
              leaves a large enough market to matter, but it makes clear that ShopMy is selling infrastructure for
              creator-led commerce rather than all creator monetization or all social-ad spend.
