  - id: TV002
    title: Thesis / anti-thesis table
    description: Structured positives versus what would change or break the investment case.
    columns:
      - Argument
      - Why it matters
      - What would change the view
    rows:
      - - Real scaled platform
        - Official and independent sources support >$1B annual platform sales and rapid creator/brand growth.
        - If growth was mostly GMV optics without durable revenue capture, the thesis weakens materially.
      - - Improving revenue quality
        - Subscriptions became the majority of revenue by early 2025, reducing reliance on pure affiliate take rates.
        - If subscription expansion stalls or brand churn is high, the quality premium disappears.
      - - Consumer upside exists
        - Circles, app features, and shopper tooling create a path to owning more of discovery.
        - If shopper retention is weak, the consumer build becomes cost without valuation upside.
      - - Valuation support is incomplete
        - Revenue, margin, and cap-table support are still model-driven or undisclosed.
        - Disclosure of audited revenue, margins, and terms could make the same price look more reasonable.
      - - Competition is rising
        - Native platform tools and broader infrastructure players keep raising the product bar.
        - If ShopMy shows clear retention, better take rates, or unique shopper ownership, competitive fear falls.
      - - Round-to-round markup was sharp
        - A $410M January 2025 mark moving to $1.5B by October 2025 raises the burden of proof.
        - A lower entry or a strong 2026 operating print could justify the step-up ex post.
    notes: The anti-thesis focuses on what would actually force a re-rating, not on generic startup risks.
