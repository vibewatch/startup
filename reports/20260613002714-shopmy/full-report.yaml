      - number: '8.5'
        title: Recommendation, dilution uncertainty, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The practical recommendation is track with medium confidence and high risk at the last disclosed price.
              The company has enough positive evidence to stay on the investable list: strong round support, rapid
              scale, a more subscription-heavy revenue mix, credible creator and brand workflows, and a meaningful
              shopper-ownership thesis. What it does not have is enough public evidence to justify a fresh buy at $1.5B.
              CB Insights shows that deal-term fields exist for the recent rounds, but liquidation preference,
              participation, anti-dilution, and board-voting values are not visible publicly, so dilution and downside
              waterfalls remain opaque. The same is true for current run-rate revenue, gross margin, NRR, and
              concentration. The chapter therefore treats the missing data as the main reason to wait, not as a reason
              to invent exact fair value. A better entry, or proof that 2026 revenue, margins, and retention justify the
              2025 markup, would move the call. Until then, the thesis breaks if revenue growth slows sharply, shopper
              engagement fails to materialize, or larger ecosystem players commoditize the underlying infrastructure.
            claimRefs:
              - CV038
              - CV039
              - CV043
              - CV044
              - CV048
          - type: table
            tableRef: TV006
            claimRefs:
