      - number: '7.4'
        title: >-
          Creator multi-homing, premium-brand concentration, and shared attribution make GMV less durable than headline
          scale suggests
        blocks:
          - type: paragraph
            body: >-
              The company’s own pages still frame ShopMy around premium brands, performance-based commissions, and
              curated storefronts, while external creator-economy sources increasingly frame diversification as
              survival. FollowMint and Logie are blunt that creators compare rates, cookie windows, and native-checkout
              advantages across surfaces rather than swearing loyalty to one affiliate platform. ShopMy’s own FAQ
              reinforces the reason: direct-link purchases pay 100% of commission to the creator, but Circle purchases
              split economics across multiple creators, some storefront tabs are mandatory, and link operations still
              involve processing delays and incomplete automation. That does not break the model; it does mean that GMV
              and subscription durability depend on creator retention, merchant economics, and perceived fairness in
              attribution. The premium-brand and retailer-exclusivity positioning can improve conversion for some
              merchants, but it also raises concentration risk if high-value brands or top creators decide Instagram,
              Amazon, LTK, or direct brand programs yield better economics. The underwriting question is therefore not
              whether ShopMy can grow, but whether it can keep enough exclusive value to avoid becoming a routing layer
              creators arbitrage opportunistically.
