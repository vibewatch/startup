  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case starts with the fact pattern that ShopMy is not a speculative pre-revenue concept
              anymore. Between the January 2025 Series B and the October 2025 unicorn round, official and independent
              sources show a company that scaled from more than 100,000 creators and $352M in brand sales to more than
              $1B in annual platform sales, 1,200+ premium brands, and 185,000+ tastemakers, while Modern Retail
              separately reported 650% revenue growth in 2024 and first profitability in September 2024. The business
              model has also improved in quality: subscriptions became the majority of revenue by early 2025, official
              brand pages emphasize measurable ROI and workflow infrastructure rather than vanity reach, and the
              shopper-layer buildout creates a credible long-term path toward owning more of discovery. The anti-thesis
              is valuation support and defensibility. Public revenue is still estimated rather than audited, creator
              counts drift materially across sources, and the biggest consumer platforms and partnership-infrastructure
              players are all moving toward storefronts, payouts, attribution, and AI-led discovery. That means ShopMy
              can be a real winner and still be too expensive to buy at the last mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
              - CV014
              - CV015
