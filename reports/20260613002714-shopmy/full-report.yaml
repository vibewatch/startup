      - number: '7.3'
        title: Amazon, TikTok, and Instagram can all change ShopMy economics without asking permission
        blocks:
          - type: paragraph
            body: >-
              ShopMy markets itself as durable infrastructure, but the partner contracts remain asymmetric. Amazon can
              require specific disclosures, cease commission payments for violations, and terminate or suspend
              participants for brand-harm, deceptive-activity, or liability concerns. TikTok’s terms show the same
              control pattern in a different form: the platform governs access across devices, can enforce with
              automated and human review, can use creator identity around sponsored content, and explicitly reserves
              suspension and termination rights. Instagram adds a competitive threat instead of only a compliance
              threat. Net Influencer reports that Instagram re-entered affiliate commerce in March 2026, lets creators
              paste affiliate URLs—including links from ShopMy if products sit in Meta’s catalog—and is again
              experimenting with ways to sit between creator influence and monetization. The adverse read is that ShopMy
              may remain useful, but must do so on top of counterparties that can redirect traffic, compress take rates,
              or privilege their own native tools whenever incentives change.
