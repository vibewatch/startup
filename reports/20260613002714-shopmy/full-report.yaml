      - number: '1.3'
        title: Capital history, scale metrics, and business model maturity
        blocks:
          - type: paragraph
            body: >-
              The external funding narrative shows a company that accelerated quickly between 2024 and 2026. Modern
              Retail reported that ShopMy raised an $18.5 million round in March 2024 and then a $77.5 million Series B
              in January 2025 led by Bessemer Venture Partners and Bain Capital Ventures. The October 2025 company
              release and follow-on coverage from Hello Partner and Net Influencer then documented a further $70 million
              financing at a $1.5 billion valuation led by Avenir with Bain Capital Ventures, Bessemer Venture Partners,
              and Menlo Ventures participating. Multiple sources also tie that capital to operating progress. Modern
              Retail said 2024 revenue grew 650% year over year and that profitability was first reached in September
              2024. The October 2025 announcement added stronger scale markers: over $1 billion in annual platform
              sales, 1,200-plus premium brand partners, 185,000-plus tastemakers, 200% revenue growth, and sustained
              profitability since 2024. Importantly, Modern Retail also said ShopMy’s subscription-based brand tools had
              become the majority of revenue by early 2025, with pricing ranging from roughly $1,000 to $7,000 per
              month. That mix suggests ShopMy is not only a GMV-linked take-rate story; it also has a recurring SaaS
              layer that can smooth revenue quality if brand subscriptions remain durable.
