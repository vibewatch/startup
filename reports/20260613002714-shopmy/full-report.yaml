      - number: '1.2'
        title: Founders, leadership, and organizational signals
        blocks:
          - type: paragraph
            body: >-
              The public founder record is consistent across official and independent sources. Harry Rein serves as CEO,
              Tiffany Lopinsky serves as President, and Chris Tinsley is the co-founder focused on business development.
              The current ShopMy team page names all three founders and says the company is headquartered in New York;
              the October 2025 funding release uses the same operating roles; and Inc’s March 2026 profile adds origin
              context, describing Rein and Tinsley as early builders of the product and Lopinsky as a creator-operator
              who helped turn the prototype into a commercial company. The SEC filing from December 2023 is also useful
              because it shows Tinsley as President, Executive Officer, Director, and Promoter at that stage, which
              indicates that the formal officer structure continued to evolve as the company scaled. Current careers and
              job pages provide additional operating evidence. They show a remote-first organization with active hiring
              across client strategy, enterprise sales, creator operations, product design, data, and engineering, while
              a Senior Full Stack Engineer role names a modern web stack built around NodeJS, React, Redux, AWS, ECS,
              and CloudWatch. Those hiring signals support the view that ShopMy is still in platform-building mode
              rather than pure commercialization mode.
