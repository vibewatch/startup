      - number: '6.4'
        title: Expansion paths and concentration risk
        blocks:
          - type: paragraph
            body: >-
              ShopMy’s clearest expansion path is to turn a creator- and brand-workflow tool into a destination where
              shoppers repeatedly discover and save products. Circles, Taste Profiles, wishlists, and the mobile app all
              push in that direction, and the app’s Rewards and Noir layers suggest the company is experimenting with
              higher-frequency shopper behavior rather than one-off link clicks. There is also an expansion path within
              creator monetization: stylists can run consults, bloggers can embed collections into owned media, and
              high-performing creators can deepen relationships through gifting, discount codes, and recurring
              Opportunities.

              The commercial risks are equally clear. First, ShopMy’s public proof is heavily concentrated in premium
              fashion, beauty, home, and lifestyle contexts, which may be a feature for elevated brands but still
              narrows the proven customer mix. Second, the strongest brand ROI proof remains anonymous, while the named
              brand roster in company materials is still closer to logo evidence than to referenceable production
              outcomes. Third, no public source in this chapter discloses NRR, GRR, logo churn, active shopper cohorts,
              or top-customer concentration. That means investors can underwrite adoption momentum and ecosystem
              activity, but not yet concentration exposure or the staying power of the brand base if creator or category
              mix shifts.
            claimRefs:
              - CU029
