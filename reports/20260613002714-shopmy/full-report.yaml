      - number: '2.2'
        title: Buyer, user, payer, and budget-owner map
        blocks:
          - type: paragraph
            body: >-
              The market is structurally multi-sided. Creators are the most visible users because they create
              storefronts, affiliate links, and brand-facing inventory, but they are not always the clearest payer.
              Brands appear to be the most direct paying customer today because public reporting says ShopMy’s brand
              subscriptions became the majority of revenue and because the brand product suite centers on discovery,
              gifting, performance tracking, and scalable campaign management. Shoppers matter because trust and repeat
              discovery determine whether creator recommendations compound into sales rather than one-off clicks.
              Retailers and affiliate networks remain upstream rails that can either supply inventory and payouts or
              absorb creator demand inside their own ecosystems. That means the adoption path runs through multiple
              budget owners at once: creator success teams, affiliate and partnership managers, growth or ecommerce
              leaders, and eventually consumer retention owners once a platform starts building destination discovery
              instead of just link monetization.
