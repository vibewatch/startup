      - number: '2.3'
        title: Growth drivers, adoption triggers, and operating constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case is strong because public studies show creator marketing has moved from experiment to
              operating line item. Marketers report high usage, rising budgets, and meaningful ROI, while larger brands
              increasingly run creator content across paid media, affiliate, retail media, and CRM surfaces rather than
              keeping it in one campaign bucket. That favors platforms like ShopMy that promise attribution, payouts,
              and workflow automation. ShopMy’s own Opportunities case study reinforces that buyers want measurable,
              performance-led creator programs with enough flexibility for creators to post across multiple channels.
              But adoption is not frictionless. The same evidence pack shows buyer concerns around compliance, creator
              disclosure, platform dependence, and execution complexity. The strongest market read is that demand is
              rising for infrastructure, but the winning platform still has to prove creator throughput, data integrity,
              and resilience when social-platform algorithms or policies move.
