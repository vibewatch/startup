  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: The main risk is policy and dependency compression, not lack of product ambition
        blocks:
          - type: paragraph
            body: >-
              ShopMy’s public materials show a platform trying to operate three businesses at once: creator tooling,
              brand performance infrastructure, and a newer shopper-facing discovery layer. That expansion creates real
              upside, but the adverse evidence says the next underwriting question is not whether affiliate commerce
              exists; it is whether ShopMy can keep enough control while standing on top of other platforms’ rules,
              other merchants’ commission schedules, and creators who increasingly multi-home across every surface that
              pays. The current risk stack is therefore interactive. FTC disclosure failure or California privacy
              complaints would hurt brand trust just as consumer-facing Circles and Wishlists increase data-handling
              scope. Meanwhile, Amazon, TikTok, and Instagram all keep unilateral control over access, attribution, or
              monetization, and creators are openly taught to optimize across platforms instead of staying loyal to one
              storefront. The company’s own October 2025 release points to scale and profitability, but also confirms
              that ShopMy now spans creators, brands, and consumers—raising execution burden precisely when partner
              dependence is still high.
            claimRefs:
              - CR001
              - CR007
              - CR018
              - CR027
              - CR041
              - CR043
