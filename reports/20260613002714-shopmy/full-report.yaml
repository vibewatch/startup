      - number: '3.2'
        title: Capability breadth, pricing visibility, and buyer tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The public record shows meaningful product differences even when everyone claims to be “full funnel.”
              ShopMy layers creator storefronts, weekly payouts, geolinking, and brand workflow tools that help
              advertisers discover tastemakers, track sales, and programmatically scale creator budgets. LTK’s public
              materials show the broadest creator-commerce surface among direct peers: creator community, consumer app,
              AI matching, campaign tools, retail-media hooks, and reporting products such as LTK 360. Mavely is more
              creator-accessible, foregrounding no application gate, higher commission claims, stacked boosts, and
              transparent bonus tracking. impact.com looks closest to enterprise partnership software, stressing
              creator, affiliate, and referral management in one system plus contracts and payouts. Awin and ShareASale
              look more like network rails with AI recommendations and partner breadth than creator-native community
              products. Public pricing remains the least transparent dimension outside ShopMy’s reported brand
              subscription range, so buyers can compare capability breadth more confidently than realized price or take
              rate.
