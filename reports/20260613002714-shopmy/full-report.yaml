      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally positive but not yet fully underwritable. Public evidence supports
              a business with multiple monetization layers, fast revenue growth, official workflow tooling for
              measurable creator commerce, and enough 2025 funding support to keep investing. It also supports a more
              durable revenue-quality story than a one-dimensional affiliate marketplace because subscriptions, campaign
              tooling, and gifting workflows appear to sit alongside transaction revenue. What remains missing is the
              data an investor or acquirer would need to price the business with confidence. The public set does not
              disclose GAAP revenue, gross margin, burn, runway, net retention, customer concentration, realized take
              rate by stream, or a clean GMV-to-revenue bridge. Sacra and Latka provide useful outside-in estimates, but
              they are not substitutes for management reporting, and Latka’s profile is internally inconsistent on
              funding. The next diligence step is therefore not another headline valuation article. It is a data-room
              request covering revenue by stream, gross-margin by product, cohort retention, creator payout reversals,
              cash balances, and the capital cost of building the shopper side without eroding the profitable core.
