companyProfile:
  summary: >-
    ShopMy is a private New York creator-commerce company founded in 2020 that has expanded from a creator storefront
    and affiliate-link tool into broader infrastructure for creator discovery, brand campaign management, gifting,
    messaging, shopper discovery, and measured commerce. Public evidence shows meaningful operating traction, including
    more than $1 billion in annual platform sales, more than 1,200 premium brand partners by October 2025, 243,000
    creators and 1,600 brands cited by Inc. in March 2026, and a $70 million financing at a $1.5 billion valuation. The
    investment debate is not whether the company has momentum; it is whether public evidence is sufficient to justify
    the price when current revenue, margin, retention, shopper monetization, and round-term details remain undisclosed.
