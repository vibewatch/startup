  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - FTC / disclosure risk
        - Formal complaint, affiliate-network warning, or internal audit failure
        - Any regulator inquiry, or >2% of reviewed creator posts in sample missing adequate disclosure
        - Pause growth underwriting until controls, training, and post-level review evidence are produced.
      - - Privacy / CCPA risk
        - DSAR latency, complaint count, or missing vendor controls
        - Missed statutory response windows, unexplained opt-out failures, or no current vendor/DPA inventory
        - Treat as a diligence blocker because consumer-facing surfaces expand enforcement exposure.
      - - Amazon / retailer dependence
        - Commission-rate cut, payout hold, or suspension on a top retailer
        - Any top-5 retailer policy action that reduces take rate or halts payouts for >14 days
        - Re-cut margin and GMV scenarios; if concentration is high, stop unless contingency volume is proven.
      - - Creator churn / multi-homing
        - Top-creator wallet-share decline or migration to native tools
        - Top-10 creators contribute >25% of GMV and two or more reduce activity materially within a quarter
        - Treat as a thesis-break signal unless cohort retention and replacement economics are strong.
      - - Meta / TikTok platform shift
        - Native affiliate tooling or algorithm changes compress link-out reach
        - Meaningful decline in link click-through or conversion from Instagram/TikTok after platform policy changes
        - Require updated attribution data and evidence that owned storefront traffic can offset lost platform reach.
      - - Merchant / category concentration
        - Premium-brand or category mix narrows further
        - Top-10 merchants >40% of GMV, or beauty/fashion concentration becomes dominant without offsetting categories
        - Demand diversification plan and merchant pipeline proof before underwriting more growth.
    notes: >-
      These thresholds are intentionally monitorable so management can disprove the bear case with real dashboards
      rather than narrative.
