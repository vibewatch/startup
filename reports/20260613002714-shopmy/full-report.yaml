            body: >-
              The trust picture is mixed. ShopMy clearly documents user-facing mechanics such as payouts, shopper
              personalization, and link creation, but it leaves several platform-risk questions unanswered in public.
              The strongest explicit compliance evidence is external: FTC guidance makes clear that creators must
              disclose material connections, including free products and paid posts, within the endorsement itself and
              not only in buried profile copy. That matters because ShopMy’s product is built around affiliate links,
              gifting, direct brand partnerships, and paid Opportunities. Dependency risk is also real. Payout
              experience depends on Stripe or PayPal settlement rails, storefront monetization depends on retailer
              commission availability, and attribution value depends on social platforms and partner systems staying
              cooperative. Snapshop’s Safari setup is a particularly visible friction point because the published
              workaround asks users to disable cross-origin restrictions. Public evidence is also thin on security
              certifications, moderation, fraud controls, and the exact integration model behind Shopify, WooCommerce,
              and Salesforce. Those omissions do not prove the controls are weak, but they do force an investor to treat
              operational trust and implementation depth as open diligence items rather than settled facts.
