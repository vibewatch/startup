    summary: Public evidence reveals more about where cash and margin pressure likely sit than about exact balances or runway.
    approximationNotes: >-
      Cells are qualitative because current public evidence describes workflow and funding direction more clearly than
      actual balance-sheet amounts.
    data:
      columns:
        - Brand subscriptions
        - Affiliate commissions
        - Opportunities & gifting
        - Consumer expansion
        - Balance-sheet disclosure
      rows:
        - id: cash-driver
          label: Main cash / margin driver
          values:
            - Sales, success, analytics, and product support needed to win and retain paying brands.
            - Creator payouts, retailer remittance timing, returns, and payment reconciliation.
            - Creator flat fees, gifting logistics, campaign support, and content operations.
            - Engineering and product investment before direct shopper monetization is publicly broken out.
            - Unknown because no cash, burn, or runway data is public.
        - id: public-evidence
          label: Public evidence
          values:
            - Brand-facing pages show discovery, tracking, gifting, campaign management, and monthly billing.
            - Official guides show 10%-30% commissions, 30-120 day pending periods, and weekly payout handling.
            - Opportunities case study and brand pages show structured paid campaigns and scalable gifting workflows.
            - HBS says consumer expansion could delay near-term revenue features and strain organizational bandwidth.
            - >-
              Funding headlines and profitability claims exist, but no retained public source discloses cash or debt
              levels.
        - id: underwriting
          label: Underwriting implication
          values:
            - Recurring revenue quality may be attractive, but retention and realized ASP still need proof.
            - Working-capital timing and reversal rates could matter more than headline commission ranges.
            - >-
              Campaign revenue may grow quickly while carrying lower or more variable margin than software
              subscriptions.
            - Consumer expansion could improve defensibility but also pull capital away from profitable core products.
            - Capital adequacy can be judged only directionally, not quantitatively.
    claimRefs:
      - CI029
      - CI033
      - CI043
      - CI045
      - CI046
      - CI048
      - CI049
