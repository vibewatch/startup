      - number: '7.5'
        title: Kill criteria should be tied to complaints, concentration, and creator-retention proof
        blocks:
          - type: paragraph
            body: >-
              This chapter should not be read as a call to reject ShopMy on public evidence alone. It should be read as
              a warning that the company needs unusually good internal controls to justify scale claims. The business is
              viable only if it can show low complaint rates, fast privacy-response handling, stable creator economics
              despite multi-homing, and enough merchant diversity that a small group of brands or platforms cannot
              dictate margins. The easiest way to de-risk the file is to request proof that does not yet appear
              publicly: top-merchant GMV concentration, creator churn and cohort retention, retailer-by-retailer
              commission changes, platform-policy incident logs, privacy training and DSAR dashboards, and any
              threatened claims or arbitrations that have not surfaced in free searches. If management cannot produce
              those materials, the appropriate conclusion is not “uncertain but fine”; it is that the business may be
              more fragile than the company’s profitability and growth messaging suggests.
            claimRefs:
              - CR022
              - CR023
              - CR027
