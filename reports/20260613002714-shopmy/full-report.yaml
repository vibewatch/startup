      - number: '4.3'
        title: Capital adequacy, cost structure, and forward investment pressure
        blocks:
          - type: paragraph
            body: >-
              The capital-adequacy read is favorable near term but still incomplete. Official and independent 2025
              reporting converges on a $70 million financing at a $1.5 billion valuation in October 2025, following the
              earlier 2025 Series B. The funding release says the newest capital will accelerate product development for
              a brand operating system built around taste and discovery, while HBS’s 2026 case summary makes clear that
              management was already debating whether to prioritize near-term brand and creator revenue features or
              invest engineering resources in a consumer-facing marketplace. That tradeoff matters financially: ShopMy’s
              public product stack now includes creator discovery, AI recommendations, social listening, gifting
              logistics, campaign tracking, POS integrations, monthly brand billing, and weekly creator payouts, all of
              which imply software, data, support, and operations costs above a simple affiliate widget. Yet no retained
              public source discloses cash on hand, monthly burn, runway, debt facilities, or gross margin. The 2023 SEC
              Form D is still the only filing-level financing artifact in the set, and outside trackers disagree on
              scale. The result is that recent capital plus claimed profitability suggests no immediate distress, but
              there is not enough public balance-sheet evidence to quantify runway or dilution risk under an aggressive
              consumer-expansion plan.
