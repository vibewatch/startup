  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and who pays
        blocks:
          - type: paragraph
            body: >-
              ShopMy’s customer base is best understood as a three-sided network rather than a single SaaS buyer pool.
              Creators are the clearest production users: they build storefronts, create affiliate links, manage
              gifting, chat with brands, and in some cases sell higher-touch consults. Brands are the clearest payers on
              the B2B side: official surfaces show discovery, social listening, gifting, paid Opportunities, UGC
              purchasing, weekly talent payout handling, monthly invoicing, and POS-linked performance tracking.
              Shoppers are the newest but increasingly explicit third side, especially after the Circles launch and the
              mobile app’s expansion around wishlists, rewards, and Noir concierge access.

              Within the creator base, the public proof clusters around premium fashion, beauty, home, and lifestyle
              tastemakers rather than a broad long-tail creator economy. The strongest named examples are stylists,
              bloggers, and social creators who monetize trusted recommendations, use private collections, and pitch
              brands with performance data. That matters because it suggests ShopMy is strongest where taste-driven
              curation and high-AOV product recommendations already fit the workflow. It also means the company may be
              more exposed to premium-lifestyle demand than a mass-market affiliate network would be. Official copy
              reinforces that positioning by repeatedly emphasizing premium brand partnerships, culture-driving
              tastemakers, and high-intent shoppers instead of generic merchant acquisition.
            claimRefs:
