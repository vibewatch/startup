      - number: '4.2'
        title: Public traction, case-study economics, and working-capital friction
        blocks:
          - type: paragraph
            body: >-
              The strongest public unit-economics evidence comes from ShopMy’s own workflow and case-study surfaces
              rather than audited statements. The Opportunities case study is unusually concrete: after the program
              launched, the featured brand averaged about $471,000 in monthly revenue versus $198,000 before
              implementation, attributed $709,000 of revenue directly to Opportunities, raised order volume 238% from
              December 2024 to March 2025, and reported 3.3x ROAS with some creators reaching 25x. The creator analytics
              guide also shows that ShopMy exposes clicks, orders, commissions, order totals, retailer-level
              performance, discount-code usage, and downloadable datasets, while the Opportunities analytics guide
              exposes ROI and creator percentile rankings. Those are real commercialization signals because they show
              the software is built around measurable revenue attribution, not only awareness campaigns. At the same
              time, the official payment FAQ highlights an important friction: creators wait 30 to 120 days for
              commissions to lock, returns and cancellations can reverse earnings, and displayed commission rates are
              only average guides because realized payouts vary by SKU, exclusions, cart mix, geography, and customer
              status. That means ShopMy can demonstrate performance-led selling, but the creator-side cash-conversion
              cycle still injects variability into engagement and retention economics.
