      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              The adoption story is real but messy. Official ShopMy pages and company-issued releases point to
              substantial scale, but they do not use one stable denominator. Current marketing surfaces variously cite
              47,000-plus commissionable brands and 350-plus direct brand partners, 50,000-plus brand partners,
              70,000-plus elite creators, 175,000-plus creators and 1,000-plus brand partners at the Circles launch,
              243,000 creators and 1,600 brands in Inc’s March 2026 profile, and even 300,000-plus tastemakers on
              creator-facing subpages. The safest read is not that one number is false, but that ShopMy is mixing
              different concepts such as approved creators, tastemakers, active creators, direct brand partners, and
              broader affiliate coverage.

              Named proof is strongest from creators rather than enterprise brands. Olivia’s Shopping Diary, Shenea
              Walker, Wardrobe Oxygen, Salty Vagabonds, and Whimsy School all describe live usage, weekly payouts,
              gifting, or measurable commissions. Brand-side proof exists, but it is weaker and often more indirect:
              ShopMy’s official case study is anonymous, while independent creator reviews provide the clearest named
              brand evidence through gifting and affiliate-sale anecdotes such as Beekman 1802, Blenders Eyewear, NOYZ,
              and Christie Kidd’s Perfect Skin. That supports real ecosystem activity, but it is not the same as a
              disclosed reference account with renewal or spend history.
