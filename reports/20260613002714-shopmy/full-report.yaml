      - number: '8.4'
        title: Comparable set and market posture
        blocks:
          - type: paragraph
            body: >-
              The comp set argues for caution even though category demand is strong. LTK is the clearest scaled
              adjacency: Forbes describes it as a $6B annual retail-sales platform with deep consumer reach, meaning
              ShopMy still sits at a much earlier point on the scale curve despite a premium curation narrative.
              impact.com is not a like-for-like creator app, but it is a useful infrastructure benchmark because it
              already serves 5,900+ brands, spans 2M+ partnerships, and positions storefronts, payouts, discovery, and
              AI in one system. Sacra's note that Collective Voice wound down in December 2025 adds the adverse comp the
              chapter needs: creator-commerce demand can be real while individual platforms still fail or consolidate.
              Meanwhile, market-data sources support continued budget expansion and strong ROI interest across
              influencer marketing, but they also show a shift toward tighter measurement, short payback expectations,
              and platform concentration. That backdrop rewards defensible infrastructure and data, not just
              creator-count optics.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
