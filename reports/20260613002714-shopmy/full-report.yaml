      - number: '8.2'
        title: Financing context, price discipline, and what public evidence really supports
        blocks:
          - type: paragraph
            body: >-
              The financing history shows why investors were willing to pay up. Public sources support a sequence of
              rapid marks: $18.5M in March 2024, $77.5M in January 2025, a CB Insights January 2025 valuation of $410M,
              and then $70M at a $1.5B valuation in October 2025. But the same public record also shows why entry
              discipline matters. If Sacra's $80M 2025 revenue estimate is directionally right, the October 2025 round
              priced at about 18.8x revenue, rich but still within the outer band for premium software-like growth
              assets. If investors anchor on the CB Insights public 2024 revenue figure of $15M, the same round reads
              closer to 100x trailing revenue, which is too aggressive for a company with undisclosed margins,
              retention, and concentration. The right interpretation is not that one datapoint is definitely false; it
              is that public valuation support is still too thin to justify false precision. At the last round price,
              the file is stretched. A materially lower entry or a fuller data room would be needed before the
              recommendation improves.
            claimRefs:
