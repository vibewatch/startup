      - - 悲观
        - $70M-$80M
        - 4x-6x
        - $0.3B-$0.5B
        - 25%
        - 增长放缓、购物者采用不及预期，或原生 / 平台竞争压缩抽成率。
      - - 概率加权
        - —
        - —
        - $1.0B-$1.2B
        - 源自 25/50/25 组合
        - 基于公开证据，仍低于上一轮 $1.5B 一级市场估值。
