  - id: TV005
    title: 可比估值表
    description: >-
      Model-appropriate comparables spanning scaled creator-commerce platforms, broader infrastructure, and adverse
      category references.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most publicly supportable creator-commerce references found in open sources, including one adverse
        category outcome. It is not a complete private-market transaction set because many exact valuations and terms
        remain undisclosed.
    columns:
      - 可比对象
      - 公开估值 / 状态
      - 重要性
      - 局限
    rows:
      - - LTK
        - 年零售销售平台 $6B；保留的公开来源未披露当前私人估值
        - 创作者驱动购物领域中，最好的相邻规模化目的地和变现参考。
        - GMV / 零售销售规模不是收入，公开来源集也不给出当前估值标记。
      - - impact.com
        - 5,900+ 品牌、2M+ 合作关系、$110B+ 年 GMV
        - 最好的基础设施基准，展示更广泛合作伙伴操作系统在规模化后是什么样。
        - 比 ShopMy 宽得多，也不是直接的高端策选同行。
      - - Collective Voice
        - 2025 年 12 月宣布全面停运，曾运营 140,000 名创作者
        - 有用的反向可比：真实创作者需求并不保证平台结果耐久。
        - 来源是分析师风格报道，而非专门的一手关停文件。
      - - Walmart Creator / 零售商原生工具
        - 大型零售商生态内的规模化战略项目
        - 展示分销能力强的在位者如何吸收创作者商务工作流，而不需要独立平台经济性。
        - 因为产品嵌在更大的企业平台里，没有独立估值。
      - - ShopMy 2025 年 1 月估值标记
        - 2025 年 10 月估值跃升前的 $410M 公开基准
        - 同一年内预期如何快速重定价的内部价格发现可比。
        - 私营公司估值标记可能反映优先股条款，且不揭示完全稀释后的普通股价值。
    notes: 可比集合说明品类有吸引力，但也说明最强护城河要么属于规模化目的地，要么属于更宽的基础设施层。
