    rows:
      - - ShopMy
        - 创作者电商工作流平台
        - 300k+ 品味达人；47k+ 可赚佣金品牌；350+ 直接合作伙伴
        - 高端品牌和精选创作者
        - 周结打款、地理链接、高端品牌接入、创作者 + 品牌工作流
        - 公开证据尚未显示其拥有 LTK 式自有消费者需求或企业级广度
      - - LTK
        - 带消费者目的地的直接同业
        - 40M 消费者；7,000 家零售商；品牌项目中 >50 人创作者团队很常见
        - 希望同时获得全漏斗创作者媒体和消费者 app 需求的品牌
        - 消费者 app、自有数据、LTK 360、AI 匹配、零售媒体接口
        - 公开打款经济性并未明显优于 ShopMy，多平台并用仍普遍
      - - Mavely
        - 创作者优先的联盟与店面同业
        - 开放注册；数千个品牌；无粉丝数门槛
        - 日常创作者和结果导向联盟卖家
        - 声称佣金高 177%、45 天打款、加成、推荐经济账
        - 自有需求或高端品牌独占性的公开证据较弱
      - - impact.com
        - 企业合作伙伴 OS / 邻近直接竞争者
        - 5,900+ 品牌；2M+ 合作关系；>$110B GMV
        - 整合创作者、联盟和推荐项目的大型品牌
        - 统一工作流、合同、打款、API、Storefronts、创作者发现
        - 公开定价不透明，创作者社区比 LTK 或 ShopMy 更少面向消费者
      - - Awin / ShareASale
        - 联盟网络轨道
        - 1M+ 发布者合作伙伴；ShareASale 迁移进 Awin
        - 需要广泛合作伙伴触达和纯效果经济账的广告主
        - 大型发布者基础、灵活佣金管理、AI 合作伙伴推荐
        - 更像联盟基础设施，而非创作者原生操作系统
      - - Amazon Associates / Creator Connections
        - 零售商原生联盟 + 创作者市场
        - 最大联盟项目之一；数百万商品；Amazon 原生创作者工具
        - 愿意在 Amazon 生态内工作的品牌和创作者
        - 商品目录广、靠近结账、Creator Connections 简报、Storefronts
        - 政策控制会降低灵活性，并迫使外部工具发生渠道冲突
      - - 品牌自有联盟社区
        - 替代方案 / 内部自建
        - American Eagle 称自有项目可扩至数千名创作者
        - 希望建立直接创作者关系、又不想完全依赖平台的品牌
        - 保留一方关系和真实性控制，同时仍允许多轨道使用
        - 需要内部人手和试错，且尚无证据证明工具深度相当
      - - 现状手工栈
        - 替代方案 / 碎片化工作流
        - 表格 + 联盟网络 + 邮件 + 创作者 DM 栈
        - 尚未准备好为软件花钱的小团队和品牌
        - 前期现金成本低，供应商选择自由度最高
        - 运营开销高、衡量弱，打款 / 合规流程难以扩展
    notes: 各行汇总了当前公开证据里最影响决策的直接同业和替代方案；纳入品牌自有和手工方案，是因为买方不靠 ShopMy 也能解决同一件事。
