      - number: '6.2'
        title: 采用轨迹与具名客户证据
        blocks:
          - type: paragraph
            body: >-
              采用故事是真实的，但也混乱。ShopMy 官方页面和公司发布的新闻稿都指向相当大的规模，但并不使用一个稳定分母。当前营销界面分别引用了超过 47,000 个可赚佣金品牌和超过 350 个直接品牌合作伙伴、超过
              50,000 个品牌合作伙伴、超过 70,000 名精英创作者、Circles 发布时的超过 175,000 名创作者和超过 1,000 个品牌合作伙伴、Inc. 2026 年 3 月报道中的 243,000
              名创作者和 1,600 个品牌，甚至创作者侧子页面上的超过 300,000 名品味影响者。最稳妥的解读不是某个数字为假，而是 ShopMy
              混用了不同概念：获批创作者、品味影响者、活跃创作者、直接品牌合作伙伴和更宽的联盟覆盖。

              具名证据在创作者侧最强，而不是企业品牌侧。Olivia’s Shopping Diary、Shenea Walker、Wardrobe Oxygen、Salty Vagabonds 和 Whimsy School
              都描述了实际使用、每周打款、赠品或可衡量佣金。品牌侧证据存在，但更弱，而且往往更间接：ShopMy 官方案例研究是匿名的，独立创作者评论则通过 Beekman 1802、Blenders Eyewear、NOYZ
              和 Christie Kidd’s Perfect Skin 等赠品和联盟销售轶事，提供了最清晰的具名品牌证据。这支持真实生态活动，但它不等于带有续约或花费历史的已披露参考账户。
