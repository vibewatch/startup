      - number: '6.4'
        title: 扩张路径与集中度风险
        blocks:
          - type: paragraph
            body: >-
              ShopMy 最清晰的扩张路径，是把创作者和品牌工作流工具变成一个让购物者反复发现并保存商品的目的地。Circles、Taste Profiles、愿望清单和移动应用都朝这个方向推进；应用里的 Rewards 和
              Noir 层也说明，公司正在试验更高频的购物者行为，而不是一次性链接点击。创作者变现内部也有扩张路径：造型师可以做咨询，博主可以把系列嵌入自有媒体，高表现创作者可以通过赠品、折扣码和重复
              Opportunities 加深关系。

              商业风险同样清晰。第一，ShopMy 的公开证据高度集中在高端时尚、美妆、家居和生活方式场景；这对高端品牌可能是优势，但仍收窄了已验证客户组合。第二，最强的品牌 ROI
              证据仍是匿名的，而公司材料中的具名品牌名单更接近 logo 证据，不是可被引用的生产结果。第三，本章没有任何公开来源披露 NRR、GRR、logo
              流失、活跃购物者队列或头部客户集中度。也就是说，投资者可以定价采用动能和生态活动，但还不能定价集中度暴露，或当创作者和品类组合变化时品牌基础的留存能力。
