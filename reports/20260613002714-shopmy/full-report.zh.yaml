      - number: '3.4'
        title: 护城河耐久度、替代品与反向证据
        blocks:
          - type: paragraph
            body: >-
              不同对手的耐久图景并不一样。LTK 的消费者需求护城河最清晰，因为其平台已经声称拥有数千万购物者、深厚零售商关系和自有创作者表现数据。impact.com
              的企业工作流护城河最深，因为它把创作者、联盟、推荐、合同和打款统一在一个运营层里。Amazon 的原生分发和结账护城河最强，但这种优势伴随集中规则，会让创作者更不灵活，并压低平台外经济性。Mavely
              在目的地需求上的护城河较弱，但在创作者开放度和现金流激励上更强。因此 ShopMy 处于中间位置：在工作流和高端品牌准入上强于通用联盟轨道，但在直接需求上弱于 LTK，在企业宽度上弱于
              impact.com。反向解读很直接：如果创作者内容和品牌预算能在多条轨道间流动，ShopMy
              的护城河就取决于它能否在打款、工作流和信任上持续明显更好，而不是指望结构性锁定。既有企业反击风险也真实存在：留存报道显示，ShopMy 开始抢份额后，LTK 已经把竞争升级到诉讼，尽管该案后来撤回。
