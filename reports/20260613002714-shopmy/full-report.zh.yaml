  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与谁在付费
        blocks:
          - type: paragraph
            body: >-
              与其把 ShopMy 客户群看成单一 SaaS 买方池，不如把它理解为三边网络。创作者是最清晰的生产用户：他们搭建店铺、创建联盟链接、管理赠品、与品牌聊天，有时还销售更高接触度的咨询。品牌是 B2B
              侧最清晰的付款方：官方界面展示了发现、社交聆听、赠品、付费 Opportunities、UGC 采购、每周人才打款处理、月度开票和 POS 关联效果跟踪。购物者是最新但越来越明确的第三边，Circles
              发布和移动应用围绕愿望清单、奖励和 Noir 礼宾访问扩展后尤其如此。

              创作者群体内部，公开证据集中在高端时尚、美妆、家居和生活方式品味影响者，而不是宽口径长尾创作者经济。最强的具名样本是造型师、博主和社交创作者，他们变现可信推荐，使用私密系列，并用表现数据向品牌推介。这很重要，因为它说明
              ShopMy
              在品味驱动策展和高客单价商品推荐已经契合工作流的地方最强。也就是说，相比大众市场联盟网络，公司可能更暴露于高端生活方式需求。官方文案也反复强调高端品牌合作、塑造文化的品味影响者和高意向购物者，而不是泛泛获取商家。
