      - number: '2.3'
        title: 增长驱动、采用触发点与运营约束
        blocks:
          - type: paragraph
            body: >-
              需求侧逻辑很强，因为公开研究显示，创作者营销已从实验项目变成运营预算项。营销人员报告使用率高、预算上升、ROI 有意义；更大的品牌也越来越多把创作者内容投放到付费媒体、联盟、零售媒体和 CRM
              界面，而不是把它留在单个活动桶里。这有利于 ShopMy 这类承诺归因、打款和工作流自动化的平台。ShopMy 自己的 Opportunities
              案例研究也强化了这一点：买方想要可衡量、以效果为导向的创作者项目，同时给创作者足够灵活度，让他们跨多个渠道发布。但采用并非没有摩擦。同一组证据显示，买方担心合规、创作者披露、平台依赖和执行复杂度。最强的市场解读是，基础设施需求在上升，但胜出的平台仍必须证明创作者吞吐量、数据完整性，以及当社交平台算法或政策变化时的韧性。
