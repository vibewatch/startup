      - number: '5.3'
        title: 架构、数据平台与工程信号
        blocks:
          - type: paragraph
            body: >-
              ShopMy 没有公开 API 或安全架构文档，因此最清晰的技术读数来自机器可读应用材料和招聘信号的组合。manifest 显示它是一个独立 Web 应用；Apple app-site-association
              文件则暴露了成熟的深度链接地图，覆盖 shops、products、opportunities、discover、payouts、partners、chat 和 TikTok
              auth。同一个文件还显示了不同的开发、预发和生产 iOS 应用标识，这是一个强公开信号：ShopMy 运行分离的应用环境，而不是单一整体发布目标。招聘信号补上了应用技术栈。Senior Full Stack
              职位写明 Node.js、React、Redux、关系型数据库、AWS、ALB、ECS 和 CloudWatch。ML 岗位描述了用于个性化、搜索、推荐、向量嵌入、向量表示和 ML 驱动 API
              的生产系统。数据岗位则加入 Snowflake、BI、实验、归因和产品分析工具。综合这些来源，ShopMy 像是一个以现代 Web
              应用为核心、具备内部数据管道、面向用户的推荐系统，并在创作者和品牌界面上持续产品专业化的电商平台。
