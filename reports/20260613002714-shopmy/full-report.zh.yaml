  - id: FU001
    title: 客户旅程图
    type: journey-map
    description: 创作者、购物者和品牌如何在 ShopMy 生态中，从入驻走到重复活动。
    layout: wide
    summary: ShopMy 的核心旅程从创作者搭建店铺、品牌发现创作者开始，再延展到购物者收藏、品牌激活，以及价值更高的忠诚度循环。
    data:
      items:
