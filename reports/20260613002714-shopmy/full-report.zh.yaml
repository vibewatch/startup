  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - FTC / 披露风险
        - 正式投诉、联盟网络警告或内部审计失败
        - 任何监管问询，或抽样审核的创作者帖子中 >2% 缺少充分披露
        - 暂停增长承销，直到拿出控制、培训和单帖审核证据。
      - - 隐私 / CCPA 风险
        - DSAR 延迟、投诉数量或供应商控制缺失
        - 错过法定响应窗口、无法解释的退出失败，或缺少当前供应商 / DPA 清单
        - 视为尽调阻断项，因为面向消费者的入口扩大了执法暴露面。
      - - Amazon / 零售商依赖
        - Top 零售商下调佣金率、暂停付款或停权
        - 任何 Top-5 零售商政策动作导致抽成率下降，或付款暂停 >14 天
        - 重新切分利润率和 GMV 情景；若集中度高，除非能证明替代交易量，否则停止。
      - - 创作者流失 / 多平台经营
        - 头部创作者钱包份额下降，或迁移到原生工具
        - Top-10 创作者贡献 >25% GMV，且两个或更多创作者在一个季度内显著减少活跃度
        - 除非队列留存和替换经济性强，否则视为投资逻辑破裂信号。
      - - Meta / TikTok 平台变化
        - 原生联盟工具或算法变化压缩外链触达
        - 平台政策变化后，Instagram/TikTok 的链接点击率或转化率显著下降
        - 要求更新归因数据，并证明自有店铺流量能够抵消平台触达损失。
      - - 商户 / 品类集中
        - 高端品牌或品类结构进一步收窄
        - Top-10 商户 >40% GMV，或美妆 / 时尚集中度在没有抵消品类时占主导
        - 在承销更多增长前，要求提供多元化计划和商户管线证据。
    notes: 这些阈值刻意设计为可监控，管理层可以用真实仪表盘反驳悲观情景，而不是靠叙事。
