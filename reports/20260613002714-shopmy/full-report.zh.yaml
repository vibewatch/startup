      - number: '7.3'
        title: Amazon、TikTok 和 Instagram 都能不经 ShopMy 同意改变其经济性
        blocks:
          - type: paragraph
            body: >-
              ShopMy 把自己包装成耐久基础设施，但伙伴合同仍不对称。Amazon 可以要求特定披露，因违规停止支付佣金，并以品牌伤害、欺骗性活动或责任顾虑为由终止或暂停参与者。TikTok
              条款以另一种形式展示同样的控制模式：平台管理跨设备访问，可通过自动和人工审核执法，可围绕赞助内容使用创作者身份，并明确保留暂停和终止权利。              Instagram
              带来的不是单纯合规威胁，而是竞争威胁。Net Influencer 报道称，Instagram 于 2026 年 3 月重返联盟电商，允许创作者粘贴联盟 URL——如果商品在 Meta 商品目录中，也包括
              ShopMy 链接——并再次试验介入创作者影响力与变现之间的方法。反向解读是，ShopMy
              可能仍然有用，但必须架在对手方之上发挥作用；一旦激励变化，这些对手方可以重定向流量、压缩抽佣率，或优先扶持自己的原生工具。
