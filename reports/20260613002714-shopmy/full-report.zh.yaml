        - 基础设施焦点比社交购物更宽
      - - Amazon Associates / Creator Connections
        - 创作者、发布者、品牌
        - 市场控制佣金和赞助内容工具
        - 全球最大联盟项目之一；引用案例中联盟驱动收入同比增长 244%
        - 在位零售商可以把创作者需求内化
