      - number: '2.4'
        title: 平台背景、竞争压力与未解决尽调缺口
        blocks:
          - type: paragraph
            body: >-
              竞争背景有利有弊。LTK、impact.com、Amazon、Awin、Mavely，甚至 American Eagle
              等品牌，都在建设创作者联盟基础设施；这验证了品类，也教育了买方。但同一动态也削弱了“创作者或品牌被锁进单一平台”的说法。公开报道显示，创作者多平台经营、品牌多平台经营、零售商自有创作者项目，以及对
              Instagram、TikTok
              等外部流量源的持续依赖都很常见。公开数字在价格、抽佣率、地域组合和分部利润率上也仍然嘈杂。因此，本章支持看多市场需求，但如果没有管理层关于国际采用、按产品划分收入组合，以及能在算法驱动社交渠道之外建立多少直接购物者流量的数据，它不足以精确定价
              ShopMy 的可持续份额。当前公开证据包在队列留存、直接流量占比、国际收入贡献，以及按队列拆分的创作者与品牌收入上也偏薄；这意味着，即便 GMV
              标题很大，如果创作者、零售商或品牌可以把交易导向别处的替代轨道，也可能掩盖脆弱抽佣率或低重复使用。
