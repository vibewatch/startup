      - number: '1.3'
        title: 资本历史、规模指标与商业模式成熟度
        blocks:
          - type: paragraph
            body: >-
              外部融资叙事显示，公司在 2024 年至 2026 年间迅速提速。Modern Retail 报道称，ShopMy 在 2024 年 3 月完成 $18.5 million 融资，随后在 2025 年 1
              月完成由 Bessemer Venture Partners 和 Bain Capital Ventures 领投的 $77.5 million Series B。公司 2025 年 10 月新闻稿以及
              Hello Partner 和 Net Influencer 的后续报道又记录了新一轮 $70 million 融资，估值 $1.5 billion，由 Avenir 领投，Bain Capital
              Ventures、Bessemer Venture Partners 和 Menlo Ventures 参投。多个来源也把这些资本与运营进展相连。Modern Retail 称 2024 年收入同比增长
              650%，并在 2024 年 9 月首次实现盈利。2025 年 10 月公告给出更强的规模标记：年平台销售额超过 $1 billion、超过 1,200 个高端品牌合作伙伴、超过 185,000
              名品味影响者、收入增长 200%，且 2024 年以来持续盈利。更重要的是，Modern Retail 还称，到 2025 年初，ShopMy 的订阅型品牌工具已成为收入大头，价格大约为每月 $1,000 到
              $7,000。这个组合说明 ShopMy 不只是一个 GMV 挂钩抽佣故事；如果品牌订阅足够耐久，它还有一层经常性 SaaS 收入，可以平滑收入质量。
