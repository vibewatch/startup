  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 创作者店铺与购物者发现界面
        blocks:
          - type: paragraph
            body: >-
              ShopMy 的公开创作者和购物者材料显示，产品已越过静态个人简介链接页。创作者侧，店铺被包装成可定制中心，包含分区、系列、链接、隐藏系列、可购物帖子、咨询，以及从零售商页面通过 URL
              直接添加的工作流。2025 年夏季店铺刷新显著扩展了购物者层：Latest Finds 会从可见链接自动填充，Most Popular 会按其他购物者购买情况排序，For You
              会随着时间用购物者品味信号个性化商品建议。当前网站还把 My Circles 和 My Taste Profile
              提升为一级目的地，表明消费者产品现在是持续存在的推荐界面，而不只是通往结账的一次性跳转链接。Snapshop 把这套工作流延伸回开放
              Web，让创作者无需离开零售商页面也能生成可赚佣金的链接。结果是一个创作者电商栈：它试图让内容可沉淀、可搜索、可个性化，而不是把变现困在转瞬即逝的限时动态或一次性帖子里。
