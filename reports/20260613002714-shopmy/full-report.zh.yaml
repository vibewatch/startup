      - number: '8.3'
        title: 乐观、基准和悲观情景区间
        blocks:
          - type: paragraph
            body: >-
              公开材料不完整，因此情景分析比单一目标价更可信。乐观情景假设 ShopMy 把当前三边建设做成更大的购物者 + 品牌操作系统：到 2027 年收入约
              $150M，消费者层提高复购转化，市场仍愿意为一家盈利的高端创作者电商平台支付 12x-14x 收入。这对应约 $1.8B-$2.1B 企业价值，相比上一轮私人市场标记只有温和上行。基准情景假设收入达到约
              $110M-$120M，但随着公司正常成熟、与更大基础设施同行的比较更严，倍数压缩到 8x-10x，对应约
              $0.9B-$1.2B。悲观情景假设创作者留存走弱、原生平台工具竞争更重，且利润率耐久性没有清晰证据，收入停在约 $70M-$80M，价值仅 $0.3B-$0.5B。按概率加权，公开证据支持的区间仍低于 2025
              年 10 月价格，因此建议保持谨慎。
