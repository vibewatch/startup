      - number: '7.5'
        title: 终止标准应绑定投诉、集中度和创作者留存证据
        blocks:
          - type: paragraph
            body: >-
              本章不应被解读为仅凭公开证据就否决 ShopMy，而是在提醒：公司需要异常扎实的内部控制，才能支撑规模叙事。只有当 ShopMy
              能证明投诉率低、隐私响应快、多平台经营下创作者经济性稳定、商家足够分散且少数品牌或平台无法主导利润率，业务才算站得住。最直接的降风险办法，是要求管理层提供尚未公开的证据：头部商家 GMV
              集中度、创作者流失和队列留存、逐零售商佣金变化、平台政策事件日志、隐私培训和 DSAR
              仪表盘，以及免费搜索尚未暴露的任何威胁索赔或仲裁。如果管理层拿不出这些材料，合理结论不是「不确定但没问题」，而是业务可能比公司的盈利和增长表述更脆弱。
            claimRefs:
              - CR022
              - CR023
