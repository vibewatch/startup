            body: >-
              资本充足性短期读数有利，但仍不完整。官方和独立 2025 年报道都指向 2025 年 10 月一轮 $70 million 融资，估值 $1.5 billion，此前还有 2025 年早些时候的 Series
              B。融资新闻稿称，最新资本将加速围绕品味和发现打造的品牌操作系统产品开发；HBS 2026
              年案例摘要则明确显示，管理层当时已经在权衡：优先推进近期品牌和创作者收入功能，还是把工程资源投向面向消费者的市场。这个取舍在财务上重要：ShopMy 公开产品栈现在包括创作者发现、AI
              推荐、社交聆听、赠品物流、活动跟踪、POS
              集成、月度品牌账单和每周创作者打款，所有这些都意味着软件、数据、支持和运营成本高于一个简单联盟小组件。但保留的公开来源没有披露现金余额、月度烧钱速度、现金跑道、债务工具或毛利率。2023 年 SEC Form D
              仍是资料集中唯一的文件级融资材料，外部跟踪器对规模也存在分歧。因此，近期资本加上声称盈利，说明公司没有迫在眉睫的困境；但公开资产负债证据不足，无法量化激进消费者扩张计划下的现金跑道或稀释风险。
