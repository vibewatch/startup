      - number: '1.2'
        title: 创始人、领导层与组织信号
        blocks:
          - type: paragraph
            body: >-
              官方和独立来源给出的公开创始人记录一致。Harry Rein 担任 CEO，Tiffany Lopinsky 担任总裁，Chris Tinsley 是聚焦业务发展的联合创始人。当前 ShopMy
              团队页面列出三位创始人，并称公司总部位于纽约；2025 年 10 月融资新闻稿使用了同样的运营职位；Inc. 2026 年 3 月的报道补充了起源背景，称 Rein 和 Tinsley
              是产品早期建设者，Lopinsky 则是帮助把原型做成商业公司的创作者型运营者。2023 年 12 月的 SEC 文件也有用：它显示 Tinsley
              当时是总裁、执行官、董事和发起人，说明公司扩张时正式高管结构仍在演进。当前招聘和职位页面提供了更多运营证据。公司是远程优先组织，正在招聘客户策略、企业销售、创作者运营、产品设计、数据和工程岗位；其中 Senior
              Full Stack Engineer 职位写明现代 Web 技术栈围绕 NodeJS、React、Redux、AWS、ECS 和 CloudWatch 搭建。这些招聘信号支持一个判断：ShopMy
              仍处于平台建设模式，而不是单纯商业化模式。
