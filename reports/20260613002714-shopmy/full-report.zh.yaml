        - 没有折扣、年度承诺或模块挂载的证据。
        - 确认在纯联盟经济性之上，还有一层有意义的经常性 SaaS 收入。
      - - ShopMy 付款指南
        - 典型创作者佣金为 10%-30%
        - 官方面向创作者的指南
        - 通过平台链接的可佣金商品产生佣金。
        - 费率因品牌或零售商而异，也不等同于 ShopMy 自身收入抽成。
        - 即便 ShopMy 自身抽成率仍不透明，创作者收入经济性已经可见。
      - - ShopMy 付款机制
        - 锁定期 30-120 天；周五付款；最低付款额 $11
        - 官方运营政策
        - 从待定到锁定的工作流、Stripe 或 PayPal 结算，以及付款排期。
        - 退货窗口和零售商汇款时点决定实际收款。
        - 营运资本时点是创作者体验里的真实变量。
      - - Opportunities 付款
        - 固定费用合作款在完成后的下一次周五付款中支付
        - 官方运营政策
        - 付费创作者合作跳过通常的待定佣金延迟。
        - 具体品牌费用和 ShopMy 利润率未披露。
        - Opportunities 很可能不同于普通联盟佣金来变现。
      - - 品牌计费运营
        - 每周向人才付款；每月向品牌开具一张账单
        - 官方面向品牌的工作流
        - 处理人才付款，并为品牌合并开具账单。
        - 没有官方披露付款条款、资金沉淀或坏账风险。
        - ShopMy 运营的是支付和对账层，不只是出售仪表盘访问权。
      - - Sacra 估计包
        - 入门品牌方案 $399 到全功能访问 >$2,799；联盟抽成最高 2.9%-3.9%；Opportunities 费用 15%
        - 分析师估计
        - 品牌软件分层、抽成率区间和活动费用假设。
        - 未经公司确认，只应作为方向性参考。
        - 可用于情景框架，但不能替代管理层指标。
    notes: 该表刻意区分官方运营规则、第三方标价和分析师估计，避免把估计的单位经济性误认为公司披露。
