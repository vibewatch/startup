      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论方向上正面，但还不能完全定价。公开证据支持这样一家企业：有多层变现、收入快速增长、有官方工作流工具支撑可衡量创作者电商，也有足够 2025
              年融资继续投入。相比单一维度的联盟市场，它也支持一个更耐久的收入质量故事，因为订阅、活动工具和赠品工作流似乎与交易收入并存。缺失的是投资者或收购方自信定价所需的数据。公开材料没有披露 GAAP
              收入、毛利率、烧钱速度、现金跑道、净留存率、客户集中度、按收入流划分的实际抽佣率，或清晰的 GMV 到收入桥。Sacra 和 Latka 提供了有用的外部估计，但不能替代管理层报告；Latka
              的档案在融资信息上还存在内部不一致。因此，下一步尽调不是再找一篇标题估值文章，而是向数据室索取按收入流拆分收入、按产品拆分毛利率、队列留存、创作者打款冲回、现金余额，以及在不侵蚀盈利核心的情况下建设购物者侧的资本成本。
