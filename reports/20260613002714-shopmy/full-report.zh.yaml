  - id: TV006
    title: 投资逻辑破裂和否决触发项表
    description: Observable triggers that would force a downshift in recommendation or a reset in valuation expectations.
    columns:
      - 触发项
      - 阈值 / 事件
      - 为什么会打破投资逻辑
      - 行动含义
    rows:
      - - 收入证明不及预期
        - 2026 年收入披露显示，2025 年 10 月估值标记远高于 20x 当前收入，且没有匹配的利润率质量
        - 乐观情景依赖真实的软件式收入和利润率画像，而不只是 GMV 表象。
        - 不要按私人轮价格买入；按更低收入基数重新承销。
      - - 购物者层没有留住用户
        - 管理层无法展示有意义的 MAU、重复访问、愿望清单转化或 app 留存
        - 战略上行空间很大一部分来自拥有更多购物者关系。
        - 剔除消费者可选性，把业务更像一个较窄的 B2B 创作者工具来估值。
      - - 竞争压缩
        - 原生平台或基础设施竞争者降低创作者或品牌的付费意愿
        - 高倍数假设的是耐久差异化，而不是商品化的联盟管道。
        - 将倍数假设下调到悲观情景区间。
      - - 股权结构意外
        - 优先权、参与权或反稀释条款显著比预期更偏投资人
        - 普通股价值可能远低于投后估值标题数字暗示。
        - 暂停，直到完全稀释的下行情景清算瀑布完成建模。
      - - 留存质量弱
        - 品牌流失或创作者集中度显著差于公开叙事暗示
        - 订阅占多数和网络效应主张应获得更少信用。
        - 将业务视为活动型市场平台，而不是复利型软件收入。
    notes: 每个触发项都可监控，并直接绑定估值传导，而不是泛泛运营噪音。
    claimRefs:
      - CV025
      - CV027
      - CV038
      - CV039
      - CV047
      - CV048
  - id: TV007
    title: 最终尽调要求表
    description: Specific evidence needed before a price-sensitive investor could improve the recommendation.
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前收入和利润率
        - 2025-2026 按月、按收入流拆分收入，并按收入流拆分毛利率
        - 判断当前估值标记是否站得住的核心输入。
        - 财务团队 / 董事会材料请求。
      - - 股权结构表和优先股堆叠
        - 完全稀释股权结构表、清算优先权、参与权、反稀释、董事会权利
        - 需要把表面投后价值翻译成真实普通股和新钱经济性。
        - 法务 + CFO 数据室请求。
      - - 留存和集中度
        - NRR、GRR、logo 流失、头部品牌集中度、创作者集中度
        - 决定软件层是复利增长，还是每个活动周期都重置。
        - 收入运营请求和队列仪表盘审查。
      - - 购物者互动
        - Circles / app 的 MAU、重复访问、愿望清单转化和 app 留存指标
        - 需要给消费者可选性定价，而不是直接假设它存在。
        - 产品分析审查。
      - - 下一轮融资时点
        - 账上现金、月度烧钱 / 现金生成，以及融资触发阈值
        - 说明投资人是在买入强势，还是买入未来资本依赖。
        - 财务和董事会材料请求。
    notes: 只有当这些要求补齐最大的估值支撑缺口，或入场价格大幅下调时，本文件才应转为买入。
    claimRefs:
      - CV039
      - CV044
      - CV048
