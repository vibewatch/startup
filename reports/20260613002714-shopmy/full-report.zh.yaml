      - number: '7.2'
        title: FTC 披露与隐私合规是最可监控的法律风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的硬风险界面不是已经进入公开记录的诉讼，而是具体披露义务与更宽数据政策足迹的组合。FTC 指南直接说明，联盟和赠品关系属于重大关系，创作者本人对合规负责，单靠一个平台工具可能不够。这很重要，因为
              ShopMy 的价值主张依赖大规模联盟链接、品牌合作、赠品和创作者推荐。与此同时，公司 2026 年 6
              月隐私政策覆盖网站、应用和扩展程序；称其收集敏感电商和行为数据；还称可能为定向广告出售或共享个人信息类别。California 法律随后赋予居民删除、更正和拒绝出售 / 共享的权利，并提供向 Attorney
              General 和 CPPA 投诉的路径。这些都不能证明存在主动不当行为。它们意味着，本章应把披露控制、DSAR 响应时间、供应商治理和同意日志视为尽调项；即便没有头条执法行动，这些事项也可能让投资失败。
