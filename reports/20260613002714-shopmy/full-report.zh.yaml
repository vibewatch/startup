            title: FTC 风险是增长故事变成尽调叫停的最快路径
            body: 公开记录已经给出规则：联盟链接、赠品和赞助内容需要清晰披露，并且披露要与背书本身放在一起。ShopMy 的业务模式恰好使用这些触点，所以创作者控制薄弱不是灰色地带，而是执行失误。
