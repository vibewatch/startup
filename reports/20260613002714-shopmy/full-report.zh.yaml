  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、定价与确认信号
        blocks:
          - type: paragraph
            body: >-
              ShopMy 的收入模式不只靠联盟链接变现。官方创作者和品牌页面显示，平台组合了数字店铺、联盟链接、创作者与品牌消息、赠品、活动管理和人才付款。官方付款指南称，创作者通常看到 10% 到 30%
              的佣金率，佣金可能需要 30 到 120 天才会从待定转为锁定，随后 ShopMy 每周五通过 Stripe 或 PayPal 打款。品牌侧，当前产品界面称 ShopMy
              处理每周人才打款，同时向品牌发送单张月度发票，意味着 ShopMy 位于现金对账中间，而不只是原样转售软件访问权。公开第三方报道给出最清晰的标价信号：Modern Retail 称品牌订阅约为每月 $1,000
              到 $7,000，并已在 2025 年初成为收入大头。Sacra 的 2026 年估计包进一步建模了经常性收入加交易收入的组合，但这些费用和抽佣率细节仍是分析师估计，而非公司披露。正确的财务解读是，经常性
              SaaS 收入很可能改善收入质量，但实际抽佣率和收入确认机制仍需要管理层背书。
