  - id: FI004
    title: 资本强度 / 现金流地图
    type: matrix
    layout: wide
    summary: 公开证据更多揭示现金和利润率压力可能落在哪里，而不是精确余额或 runway。
    approximationNotes: 单元格采用定性表述，因为当前公开证据对工作流和融资方向的描述，比对实际资产负债表金额的披露更清楚。
    data:
      columns:
        - 品牌订阅
        - 联盟佣金
        - Opportunities 与送样
        - 消费者扩张
        - 资产负债表披露
      rows:
        - id: cash-driver
          label: 主要现金 / 利润率驱动
          values:
            - 赢下并留住付费品牌，需要销售、客户成功、分析和产品支持。
            - 创作者打款、零售商汇款时点、退货和支付对账。
            - 创作者固定费用、送样物流、活动支持和内容运营。
            - 直接购物者变现公开拆分前，需要先投工程和产品。
            - 没有公开现金、烧钱或 runway 数据，因此未知。
        - id: public-evidence
          label: 公开证据
          values:
            - 品牌页面展示发现、追踪、送样、活动管理和月度计费。
            - 官方指南显示 10%-30% 佣金、30-120 天待定期和每周打款处理。
            - Opportunities 案例研究和品牌页面展示结构化付费活动，以及可规模化的送样工作流。
            - HBS 称消费者扩张可能推迟近期收入功能，并拉扯组织带宽。
            - 融资新闻和盈利说法存在，但保留下来的公开来源没有披露现金或债务水平。
        - id: underwriting
          label: 承销含义
          values:
            - 经常性收入质量可能有吸引力，但留存和实际 ASP 仍需证明。
            - 营运资本时点和冲回率，可能比标题式佣金区间更重要。
            - 活动收入可能增长很快，但利润率可能低于软件订阅，或波动更大。
            - 消费者扩张可能增强防御性，也可能把资本从盈利核心产品抽走。
            - 资本充足性只能定性判断，不能定量判断。
    claimRefs:
      - CI029
      - CI033
      - CI043
      - CI045
      - CI046
      - CI048
      - CI049
