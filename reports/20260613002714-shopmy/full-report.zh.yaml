      - number: '6.3'
        title: 耐久度、重复使用与证据质量
        blocks:
          - type: paragraph
            body: >-
              公开耐久度证据方向上正面，但仍大量依赖代理指标。创作者侧的重复使用信号优于私人电商平台平均水平：独立创作者描述了使用 ShopMy 一年后每天仍在用、每周五收款、快速晋级，以及把赠品、嵌入、店铺和
              Opportunities 当作工作流里的重复环节。官方界面也试图通过月度奖金机会、品牌直聊、奖励等级、愿望清单持久化，以及面向 Gold 和 Black 用户的 Noir 访问来制造重复行为。购物者侧，App
              Store 评分和 Circles / Taste Profile 功能集显示有一定真实参与，但没有披露活跃用户曲线。

              最大的尽调问题是证据质量，而不是没有证据。创作者侧证据往往具体、有说服力，但很多仍是轶事、博主自控或公司策展内容。品牌侧证据成熟度更低：官方标识名单和匿名案例研究显示有动静，但不能证明客户集中度、多季度留存或续约深度。评论信号也不均衡。App
              Store 评分很强，但 JustUseApp 的低合法性评分和不匹配投诉片段显示，二级聚合器可能增加噪音，而不是提供清晰度。因此，ShopMy
              的公开客户档案能证明真实使用和活跃工作流，但还不能以投资者想要的严谨度证明长期耐久性。
