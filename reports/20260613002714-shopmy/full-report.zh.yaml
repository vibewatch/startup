  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 重要性
      - 当前公开代理
      - 尽调路径
      - 承销后果
    rows:
      - - 按收入流划分的 GAAP 收入
        - 需要把经常性 SaaS 质量和 GMV 相关波动拆开。
        - 仅有 Modern Retail 定价 + Sacra / Latka 估计
        - 请求审计或管理口径下的收入拆分，覆盖订阅、交易费、Opportunities 和任何服务收入。
        - 无法可靠评估收入结构和耐久性。
      - - GMV 到收入桥表和实际抽成率
        - '>$1B 平台销售额标题不等同于确认收入。'
        - 官方平台销售额说法 + Sacra 抽成率估计
        - 请求总平台销售额、净收入、按收入流划分的抽成率，以及抵减收入处理。
        - GMV 可能高估经济捕获。
      - - 按产品线划分的毛利率
        - 判断支付、赠品和活动工作流是否稀释软件毛利，这一项很关键。
        - 仅从当前页面推断产品界面
        - 请求订阅、联盟费用、Opportunities 和任何服务的毛利率。
        - 利润率路径仍是推测。
      - - 现金、烧钱和现金跑道
        - 需要用来检验扩张情景下的资本充足性。
        - 近期融资 + 自 2024 年起盈利的说法
        - 请求月度现金余额、烧钱 / 现金生成和情景现金跑道。
        - 无法给融资依赖或稀释风险定价。
      - - 留存与集中度
        - 净留存和客户集中度决定规模是否耐久。
        - 2025 年初提及 600 个品牌订阅客户和广泛创作者数量，但没有队列数据
        - 请求 NRR、总留存、头部客户集中度和队列级流失。
        - 增长质量和下行韧性仍不清楚。
      - - 创作者付款冲回 / 退货率暴露
        - 退货和取消会减少创作者收入，并影响对平台的信任。
        - 官方 FAQ 提到负佣金和可变实际费率
        - 请求按品类划分的拒付、取消、退货和付款调整率。
        - 供给侧经济性可能总额好看、净额变弱。
      - - 国际与购物者变现组合
        - 消费者和跨境扩张可能同时改变 TAM 和成本结构。
        - 当前网站和 2025 年报道显示购物者采用，但没有直接变现拆分
        - 请求购物者产品和国际业务的收入与毛利贡献。
        - 前瞻模型无法区分增长和变现质量。
    notes: 这些是形成完整可承销视角所需的最低未解输入。公开文章给出了动量和产品细节，但没有给出严谨估值所需的管理层指标。
