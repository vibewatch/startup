  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              不能不加调整地把 ShopMy
              放进整个创作者经济里定价。更相关的市场是创作者电商基础设施：这类软件和工作流层帮助创作者变现推荐、帮助品牌发现并支付创作者，也帮助购物者把信任转成可归因销售。公开来源支持一个宽口径创作者经济包络：2026 年约
              $234 billion 到 $252 billion；网红营销支出层约 $39 billion 到 $40.5 billion。但这些数字包含 ShopMy
              不能直接捕获的收入池。更好的边界是先把宽口径创作者经济同更窄的软件、归因和电商赋能层切开，再进一步收窄到 ShopMy 所竞争的高端品牌、高信任、创作者主导购物细分市场。这个市场仍足够大，但它也说明 ShopMy
              卖的是创作者主导电商的基础设施，而不是全部创作者变现或全部社交广告支出。
