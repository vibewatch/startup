      - 打款或合同模式
      - 包含能力
      - 未知项 / 含义
    rows:
      - - ShopMy
        - 独立报道称品牌订阅约为每月 $1k-$7k；官方创作者页面展示了样例佣金和高端品牌接入
        - 通过 PayPal 或 Stripe 向创作者周结打款
        - Storefronts、联盟链接、品牌工具、奖金、地理链接
        - 当前实际抽成率和品牌套餐层级仍未公开
      - - LTK
        - 基础品牌平台转为免费接入，高级功能收费；据报道创作者佣金平均约 10-25%，最高 30%
        - 保留来源未清晰披露公开打款节奏
        - 消费者 app、创作者匹配、分析、活动、广告、RMN
        - 高级功能定价不透明，经济性对比不完整
      - - Mavely
        - 声称佣金高 177%；特定链接加成可达 3x；六个月内推荐收入分成 10%
        - 购买后 45 天双周打款；月度奖金在此基础上再加 25%
        - SmartLinks、MyShop、加成、奖金、推荐经济账
        - 面向商家的品牌侧定价未公开披露
      - - impact.com
        - 未保留公开价目表；创作者能力包含在 Performance Platform 中，不额外收 SaaS 费用
        - 平台管理合同和创作者付款；已宣布通过 PayPal 提供 Anytime Withdrawal
        - 统一联盟 + 创作者 + 推荐管理、店面、API
        - 可能按范围收企业级价格，但缺少公开标价
      - - Awin / ShareASale
        - 按效果付费定位；佣金额取决于广告主项目
        - 网络式合作伙伴付款，打款方式包括 ACH / Payoneer 支持
        - 发布者市场、AI 推荐、自动化报告
        - 是可变佣金的好轨道，但创作者专属包装的公开清晰度弱
