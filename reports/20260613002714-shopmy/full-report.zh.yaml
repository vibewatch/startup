      - CU027
      - CU030
      - CU032
      - CU033
      - CU047
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    description: 从具体性、独立性、部署成熟度和持久性可见度四个维度，比较公开客户证据表面的相对强弱。
    layout: wide
    summary: ShopMy 最强的公开证据来自具体创作者使用，以及一个量化但匿名的品牌案例；最弱的表面证据是 logo 名单和噪音较大的聚合器。
    data:
      columns:
        - 结果具体性
        - 独立性
        - 部署成熟度
        - 持久性可见度
      rows:
        - label: 官方创作者证言
          values:
            - label: 中等
              tone: positive
              detail: 赠品合作和品牌触达写得具体，但没有收入队列
            - label: 弱
              tone: risk
              detail: 来源由公司筛选
            - label: 强
              tone: positive
              detail: 代表真实产品使用，不是试点
            - label: 弱
              tone: risk
              detail: 没有续约或流失细节
        - label: 独立创作者评价
          values:
            - label: 高
              tone: positive
              detail: 多位创作者披露付款、赠品合作和工作流细节
            - label: 强
              tone: positive
              detail: 独立客户视角
            - label: 强
              tone: positive
              detail: 日常或长达一年的使用，说明已进入真实生产环境
            - label: 中等
              tone: neutral
              detail: 强于 logo，但仍不是队列留存数据
        - label: 匿名 DTC 品牌案例
          values:
            - label: 高
              tone: positive
              detail: 包含 ROAS、归因收入、内容量和订单增长指标
            - label: 弱
              tone: risk
              detail: 公司发布，且客户未具名
            - label: 强
              tone: positive
              detail: 明显是真实投放工作流，不是假设性的功能演示
            - label: 弱
              tone: risk
              detail: 未披露重复花费或续约窗口
        - label: 融资公关 logo 名单
          values:
            - label: 低
              tone: risk
              detail: 出现了具名品牌，但没有结果
            - label: 弱
              tone: risk
              detail: 公司发布的公告
            - label: 中等
              tone: neutral
              detail: 暗示存在真实关系，但只停留在 logo 层面
            - label: 弱
              tone: risk
              detail: 没有留存、花费或合同细节
        - label: App Store + JustUseApp 信号
          values:
            - label: 中等
              tone: neutral
              detail: 评分量较强，但运营细节有限
            - label: 中等
              tone: neutral
              detail: App Store 公开可查；二级聚合质量不均
            - label: 强
              tone: positive
              detail: 代表真实 App 用户使用后的反应
            - label: 弱
              tone: risk
              detail: 评分不是购物者留存队列
    claimRefs:
      - CU013
      - CU017
      - CU019
      - CU030
      - CU034
      - CU037
      - CU041
      - CU044
