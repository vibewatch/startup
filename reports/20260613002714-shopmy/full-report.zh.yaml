  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 披露或平台政策冲击如何经由创作者行为，传导到 GMV、商户信任和估值支撑。
    data:
      nodes:
        - id: N1
          label: FTC 或隐私事件
          detail: 披露失误、投诉，或 DSAR / 控制环节失守。
          tone: risk
        - id: N2
          label: 品牌 / 商户担忧
          detail: 商户重新审视参与、费率表或独家安排。
          tone: risk
        - id: N3
          label: 创作者信任受损
          detail: 创作者担心归因公平性、品牌安全或付款。
          tone: risk
        - id: N4
          label: 平台政策冲击
          detail: Amazon、TikTok 或 Meta 改变规则、触达或经济性。
          tone: risk
        - id: N5
          label: GMV 结构被压缩
          detail: 费率、转化或钱包份额从 ShopMy 流程中转移。
          tone: risk
        - id: N6
          label: 集中度上升
          detail: 剩余交易量集中到更少商户或创作者手中。
          tone: risk
        - id: N7
          label: 估值支撑转弱
          detail: 缺少内部证据时，盈利能力和增长叙事会失去可信度。
          tone: risk
        - id: N8
          label: 内部控制 / 仪表盘
          detail: 隐私、披露、流失和集中度证据可以打断这条链。
          tone: positive
