      - number: '5.4'
        title: 信任、合规、依赖与公开尽调缺口
        blocks:
          - type: paragraph
            body: >-
              信任图景好坏参半。ShopMy 清楚记录了打款、购物者个性化和链接创建等面向用户的机制，但若干平台风险问题在公开层面没有答案。最强的明确合规证据来自外部：FTC
              指南明确要求，创作者必须在背书本身披露重大关系，包括免费产品和付费帖子，不能只埋在个人资料文案里。这很重要，因为 ShopMy 产品围绕联盟链接、赠品、品牌直连合作和付费 Opportunities
              构建。依赖风险也真实存在。打款体验依赖 Stripe 或 PayPal 结算轨道，店铺变现依赖零售商佣金可得性，归因价值依赖社交平台和合作伙伴系统保持配合。Snapshop 的 Safari
              设置是尤其可见的摩擦点，因为公开规避方案要求用户关闭跨源限制。公开证据在安全认证、审核、反欺诈控制，以及 Shopify、WooCommerce 和 Salesforce
              背后的精确集成模型上也很薄。这些缺口不能证明控制薄弱，但它们确实迫使投资者把运营信任和实施深度视为未决尽调项，而不是已落定事实。
