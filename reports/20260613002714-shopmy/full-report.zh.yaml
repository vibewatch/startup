      - number: '5.2'
        title: 品牌操作系统与变现工作流
        blocks:
          - type: paragraph
            body: >-
              品牌产品被明确模块化为 Discover、Engage、Track 和 Amplify，公开描述也足够具体，可以把这些模块映射到真实运营工作。Discover 覆盖精选名单、筛选、表现数据和 AI
              辅助推荐。Engage 覆盖关系层：联盟设置、赠品、lookbooks、直连消息和展示位。Track 覆盖效果衡量、社交提及、运营打款和 POS 集成。Amplify 把 Opportunities
              打包成可复用的付费协作引擎，现在还区分常态化月度奖金项目和更结构化的促销活动。产品建设岗位描述也说明，这不只是营销文案。ShopMy 正在为发现 /
              搜索、赠品、活动管理、分析、归因、报告、入驻、店铺、收益和创作者发现招聘专门产品负责人。这意味着公司把创作者营销视为带有独立子系统的操作系统，而不是覆盖在联盟链接上的薄仪表盘。它也解释了为什么品牌订阅可能变得有经济意义：产品想拥有日常工作流，而不只是跟踪下游销售。
