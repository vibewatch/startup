companyProfile:
  summary: >-
    ShopMy 是一家位于纽约的私人创作者电商公司，成立于 2020
    年。公司最初做创作者店铺和联盟链接工具，后来扩展为更宽的基础设施，覆盖创作者发现、品牌活动管理、赠品、消息、购物者发现和可衡量电商。公开证据显示其运营动能可观：年平台销售额超过 $1 billion，截至 2025 年 10
    月已有超过 1,200 个高端品牌合作伙伴，Inc. 在 2026 年 3 月引用了 243,000 名创作者和 1,600 个品牌，公司也以 $1.5 billion 估值完成 $70 million
    融资。投资争议不在于公司有没有势能，而在于当前收入、利润率、留存、购物者变现和轮次条款细节都未披露时，公开证据是否足以支撑这个价格。
