      - number: '8.5'
        title: 建议、稀释不确定性和投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >-
              实际建议是：按最后披露价格，观察，中等置信度，高风险。公司有足够正面证据留在可投资名单上：强劲的轮次支持、快速规模化、更偏订阅的收入结构、可信的创作者和品牌工作流，以及有意义的购物者所有权逻辑。但它没有足够公开证据支撑在
              $1.5B 估值上新的买入。CB Insights 显示近期轮次存在交易条款字段，但清算优先权、参与权、反稀释和董事会投票权数值没有公开可见，因此稀释和下行分配瀑布仍不透明。当前收入运行率、毛利率、NRR
              和集中度也是如此。本章因此把数据缺失视为等待的主要理由，而不是编造精确公允价值的理由。更好的入场价，或能证明 2026 年收入、利润率和留存足以支撑 2025
              年加价的证据，才会改变判断。在此之前，一旦收入增长大幅放缓、购物者参与度没有兑现，或更大的生态玩家把底层基础设施商品化，投资逻辑就会失效。
