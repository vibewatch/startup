      - 威胁
      - 严重性
      - 证据
      - 重要性
      - 尽调问题
    rows:
      - - 高端创作者与品牌筛选
        - 创作者在 LTK、ShopMy 和 Mavely 之间多平台经营
        - 高
        - Digiday 报道创作者使用率约 50/50 分流，并有 ShopMy 经济性更好的个案
        - 如果创作者供给可迁移，独家网络效应就弱于表面数量
        - 按收入最高十分位请求创作者留存、活跃链接和平台重叠队列
      - - 创作者快速回款
        - Mavely 也主打更快回款和奖金上行空间
        - 中高
        - Mavely 称 45 天付款，并有每月 25% 的奖金提升
        - 如果对手继续缩短付款节奏，现金流优势会很快收窄
        - 对照付款速度和奖金挂钩情况评估创作者流失
      - - 品牌工作流深度
        - impact.com 把创作者、联盟和推荐运营统一到一个技术栈里
        - 高
        - impact.com 打包合同、发现、支付、Storefronts 和合作伙伴衡量
        - 企业买家可能选择更宽的合作伙伴 OS，而不是专门的创作者工具
        - 按账户规模和与 impact 主导评估的重叠度绘制赢单率
      - - 创作者电商目的地扩张
        - LTK 已经拥有更大的直接消费者需求和 App 参与度
        - 高
        - LTK 称拥有 40M 购物者，以及直接发现和零售商关系
        - 如果自有需求重要，ShopMy 仍是更小的目的地，可能需要更高的创作者激励
        - 衡量 GMV 有多少依赖站外流量，而不是直接购物者会话
      - - 联盟轨道互操作性
        - Amazon 政策可能让同一流量产生渠道冲突
        - 中
        - 如果同一流量申领多个项目付款，Amazon 可能扣留佣金
        - 对 Amazon 占比较高的商家，政策控制可能把创作者或品牌拉回 Amazon 原生轨道
        - 询问创作者收入中有多少来自 Amazon 关联目录，以及冲突是否降低 ShopMy 挂载率
      - - 零售商与品牌依赖
        - 品牌可以自建联盟社群，同时保留第三方轨道
        - 高
        - American Eagle 推出自有社群，但仍保留 ShopMy 和 LTK 关系
        - 品牌自有项目限制定价权，也增加替换风险
        - 收集 ShopMy 被保留、被替换，或被降级为单一工作流切片的案例
      - - 合规与信任姿态
        - 披露失误或政策错误会损害项目 ROI 和品牌信任
        - 中
        - FTC 要求清晰的内嵌披露，并在直播中重复披露
        - 合规负担提高运营复杂度，也可能利好治理工具更强的供应商
        - 审查 ShopMy 产品控制，包括披露提示、审计追踪和 Amazon 政策冲突检测
    notes: 严重性是对当前护城河耐久度的定性判断。该清单强调的，是公开证据中直接削弱简单网络效应叙事的部分。
