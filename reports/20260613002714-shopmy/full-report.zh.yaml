  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    description: 从创作者招募，到品牌激活和购物者重复行为，公开证据显示出的推进路径。
    layout: wide
    summary: 公开证据在创作者入驻和品牌激活环节最强；到了留存和集中度数据披露这一末端环节，证据最弱。
    data:
      nodes:
        - label: 创作者加入或获批
          detail: 创作者搭建店铺、连接社交账号，并开始挂商品链接。
          tone: positive
        - label: 品牌发现或赠送创作者
          detail: 品牌借助发现、聊天、赠品合作和 Opportunities 激活创作者。
          tone: positive
        - label: 创作者发布内容
          detail: 合集、嵌入、链接分享和社交提及开始带来流量与订单。
          tone: positive
        - label: 购物者收藏或购买
          detail: Circles、Taste Profiles、筛选器和心愿单降低发现与购买摩擦。
          tone: positive
        - label: 每周付款 / 重复机会
          detail: 创作者看到付款后，品牌可能通过月度奖金或再次赠品合作重新触达。
          tone: positive
        - label: 持久性证据缺口
          detail: 公开记录在 NRR、流失、头部账户集中度和购物者队列上变薄。
          tone: risk
      edges:
        - from: Creator joins or is approved
