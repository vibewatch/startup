      - number: '1.4'
        title: 里程碑、产品扩张与反向背景
        blocks:
          - type: paragraph
            body: >-
              时间线显示，ShopMy 不是停在店铺工具上，而是反复叠加新层。公司成立于 2020 年，2020 年 7 月推出初始版本，2023 年 12 月披露 Form D，2024 年扩展到品牌订阅，2025 年 7
              月随 Circles 推出消费者平台，并在 2025 年 10 月完成独角兽轮融资。产品里程碑不是表面动作。Circles 把 ShopMy
              从单一创作者店铺模式，变成多策展者消费者发现体验；Opportunities 案例研究则显示，平台现在能把创作者营销打包成品牌可复用的效果基础设施。与此同时，一些可见反向信号也需要后续章节检视。Modern
              Retail 报道称，LTK 曾在 2024 年以虚假广告、商标侵权和不正当竞争为由起诉 ShopMy，后又撤诉。Digiday
              描述了创作者因算法平台可能突然降低触达而分散渠道；该文中的机构评论称，创作者越来越多使用 ShopMy，是因为经济条件更友好、后端工具更好用。隐私和披露义务同样关键，因为 ShopMy
              通过社交渠道变现联盟链接和创作者推荐，FTC 背书合规和数据处理控制不是后台问题，而是战略问题。
