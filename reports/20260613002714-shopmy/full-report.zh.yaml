chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与平台范围
        blocks:
          - type: paragraph
            body: >-
              ShopMy 的法定名称为 Shop My Shelf, Inc.，对外定位是创作者电商基础设施，用精选而非算法优先的信息流连接创作者、高端品牌和购物者。当前团队页面称，公司源自 MIT
              研究项目，总部位于纽约；2023 年 SEC Form D 文件则确认其注册地为 Delaware、法定实体名称，以及该融资通知使用过的 Massachusetts Worcester
              历史营业地址。公司的运营主张也在持续扩宽。ShopMy 面向创作者的页面强调数字店铺、联盟链接、品牌合作、每周打款和精选准入网络；面向品牌的页面强调发现、互动、跟踪和放大工具，目标是把口碑转成可衡量收入。到
              2025 年中并延续至 2026 年，平台还借 Circles、Taste Profile、愿望清单和多策展者发现，把自己定位成购物者目的地。这个三边定位很重要，因为它让 ShopMy
              不只是简单的联盟链接工具；公司试图成为贯穿供给、需求和衡量层的推荐式电商基础设施。
