  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 主要风险是政策与依赖挤压，不是产品野心不足
        blocks:
          - type: paragraph
            body: >-
              ShopMy 的公开材料显示，平台试图同时运营三门生意：创作者工具、品牌效果基础设施，以及更新的面向购物者发现层。这种扩张带来真实上行空间，但反向证据说明，下一步定价问题不是联盟电商是否存在，而是 ShopMy
              站在其他平台规则、其他商家佣金表，以及越来越多跨所有付费界面多平台经营的创作者之上，还能保有多少控制权。因此，当前风险栈是相互作用的。FTC 披露失误或 California
              隐私投诉会伤害品牌信任，而面向消费者的 Circles 和 Wishlists 又扩大了数据处理范围。同时，Amazon、TikTok 和 Instagram
              都单方面控制访问、归因或变现；创作者也被公开教导要跨平台优化，而不是忠于一个店铺。公司自己的 2025 年 10 月新闻稿指向规模和盈利，但也确认 ShopMy
              现在横跨创作者、品牌和消费者——正是在伙伴依赖仍高的时候，提高了执行负担。
