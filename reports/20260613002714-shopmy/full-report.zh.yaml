      - number: '3.2'
        title: 能力宽度、价格可见度与买方取舍
        blocks:
          - type: paragraph
            body: >-
              即使各家公司都声称自己是“全漏斗”，公开记录仍显示出有意义的产品差异。ShopMy 叠加了创作者店铺、每周打款、地理链接和品牌工作流工具，帮助广告主发现品味影响者、跟踪销售，并以程序化方式扩大创作者预算。LTK
              的公开材料显示，它在直接同业中拥有最宽的创作者电商界面：创作者社区、消费者应用、AI 匹配、活动工具、零售媒体钩子，以及 LTK 360 等报告产品。Mavely
              更容易被创作者接入，前台强调无需申请门槛、更高佣金说法、叠加加成和透明奖金跟踪。impact.com 最接近企业合作伙伴软件，强调在一个系统里管理创作者、联盟和推荐，加上合同与打款。Awin 和
              ShareASale 更像带有 AI 推荐和广泛伙伴覆盖的网络轨道，而不是创作者原生社区产品。除 ShopMy
              被报道的品牌订阅价格区间外，公开价格仍是最不透明的维度；因此，买方能更有把握地比较能力宽度，而不是实际价格或抽佣率。
