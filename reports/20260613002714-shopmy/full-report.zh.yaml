      - number: '8.4'
        title: 可比公司集合和市场姿态
        blocks:
          - type: paragraph
            body: >-
              即便品类需求强劲，可比公司集合仍指向谨慎。LTK 是最清晰的规模化相邻样本：Forbes 将其描述为年零售销售额 $6B 的平台，且消费者触达很深；这意味着尽管 ShopMy
              有高端精选叙事，仍处在规模曲线更早的位置。impact.com 不是一款一一对应的创作者应用，但它是有用的基础设施基准，因为它已经服务 5,900+ 个品牌、覆盖 2M+ 个合作关系，并把店铺、支付、发现和 AI
              放进同一系统。Sacra 提到 Collective Voice 于 2025 年 12
              月关停，这给本章提供了所需的反向可比样本：创作者电商需求可以真实存在，但单个平台仍会失败或整合。与此同时，市场数据来源支持网红营销预算继续扩张、ROI
              兴趣强劲，但也显示预算正转向更严格的衡量、更短的回本预期和平台集中。这样的背景奖励的是可防御的基础设施和数据，而不只是创作者数量观感。
