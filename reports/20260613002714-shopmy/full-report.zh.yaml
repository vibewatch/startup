      - number: '4.2'
        title: 公开牵引力、案例经济性与营运资本摩擦
        blocks:
          - type: paragraph
            body: >-
              最强的公开单位经济证据来自 ShopMy 自己的工作流和案例研究界面，而不是经审计报表。Opportunities 案例研究异常具体：项目上线后，案例品牌月均收入约 $471,000，而实施前为
              $198,000；直接归因给 Opportunities 的收入为 $709,000；2024 年 12 月至 2025 年 3 月订单量增长 238%；报告 ROAS 为 3.3x，部分创作者达到
              25x。创作者分析指南还显示，ShopMy 暴露点击、订单、佣金、订单总额、零售商层面表现、折扣码使用和可下载数据集；Opportunities 分析指南则暴露 ROI
              和创作者百分位排名。这些都是真实商业化信号，因为它们说明软件围绕可衡量收入归因而构建，不只是做品牌认知活动。与此同时，官方付款 FAQ 凸显了一个重要摩擦：创作者要等 30 到 120
              天佣金才锁定，退货和取消可能冲回收入，显示的佣金率只是平均指南，因为实际打款会随 SKU、排除项、购物车组合、地域和客户状态变化。也就是说，ShopMy
              能展示效果导向销售，但创作者侧现金转换周期仍会给参与度和留存经济性注入波动。
