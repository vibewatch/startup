      - number: '7.4'
        title: 创作者多平台经营、高端品牌集中和共享归因，让 GMV 没有标题规模暗示的那么耐久
        blocks:
          - type: paragraph
            body: >-
              ShopMy 自己的页面仍把公司定位在高端品牌、按效果付费的佣金和精选店铺上；外部创作者经济资料则越来越直接地把多元化当成生存问题。FollowMint 和 Logie
              说得很直白：创作者会在不同平台之间比较费率、cookie 窗口和原生结账优势，而不是对某一个联盟平台保持忠诚。ShopMy 自己的 FAQ 也说明了原因：直接链接购买会把 100% 佣金付给创作者，但
              Circle 购买会让多个创作者分摊经济收益；部分店铺标签页是强制项，链接运营仍有处理延迟，自动化也不完整。模式并不会因此失效；但 GMV
              和订阅耐久性取决于创作者留存、商家经济性以及归因是否显得公平。高端品牌和零售商独家定位能提高部分商家的转化，但如果高价值品牌或头部创作者认为 Instagram、Amazon、LTK
              或品牌直营计划的经济性更好，集中度风险也会升高。因此承销问题不是 ShopMy 能不能增长，而是它能否守住足够多的独家价值，避免沦为创作者机会主义套利的路由层。
