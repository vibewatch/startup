        - 在缺少更好收入、利润率和股权结构证据前，不要追逐 2025 年 10 月 $1.5B 的估值标记。
      - - 信心
        - 中
        - 规模和品类动能真实存在，但估值支撑仍不完整。
      - - 风险评级
        - 高
        - 竞争、数据不透明和股权结构不确定性，都可能迅速压缩价值。
      - - 估值立场
        - 偏高
        - 公开证据更支持关注公司，而不是认可上一轮价格。
      - - 上调条件
        - 披露当前收入、毛利率、NRR 和优先权；或入场价格重置到更接近基准情景区间。
        - 证据或价格改善后，投资建议可以上调。
    notes: 这份摘要刻意对价格敏感：它不是泛泛的质量评分。
    claimRefs:
      - CV009
      - CV010
      - CV043
      - CV044
      - CV048
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    description: Structured positives versus what would change or break the investment case.
    columns:
      - 论点
      - 重要性
      - 什么会改变判断
    rows:
      - - 真实的规模化平台
        - 官方和独立来源都支持 >$1B 年平台销售额，以及创作者 / 品牌快速增长。
        - 如果增长主要只是 GMV 表象，缺少耐久收入捕获，投资逻辑会明显削弱。
      - - 收入质量改善
        - 到 2025 年初，订阅已成为收入多数，降低了对纯联盟抽成率的依赖。
        - 如果订阅扩张停滞或品牌流失率高，质量溢价会消失。
      - - 存在消费者端上行空间
        - Circles、app 功能和购物者工具提供了一条拥有更多发现环节的路径。
        - 如果购物者留存弱，消费者建设会变成成本，而没有估值上行。
      - - 估值支撑不完整
        - 收入、利润率和股权结构支撑仍依赖模型或尚未披露。
        - 披露经审计收入、利润率和条款后，同样价格可能显得更合理。
      - - 竞争正在升温
        - 原生平台工具和更广泛的基础设施玩家持续抬高产品门槛。
        - 如果 ShopMy 展示出清晰留存、更好抽成率或独特的购物者所有权，竞争担忧会下降。
      - - 轮次间估值跃升很大
        - 2025 年 1 月 $410M 的估值，到 2025 年 10 月升至 $1.5B，提高了举证门槛。
        - 较低入场价，或强劲的 2026 年经营数据，可能事后证明这次跃升合理。
    notes: 反向逻辑聚焦真正会迫使重估的因素，而不是泛泛的创业公司风险。
    claimRefs:
      - CV002
      - CV006
      - CV011
      - CV012
      - CV015
      - CV016
      - CV026
      - CV027
      - CV047
