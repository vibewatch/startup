      - number: '8.2'
        title: 融资背景、价格纪律和公开证据真正支持什么
        blocks:
          - type: paragraph
            body: >-
              融资历史解释了投资人为何愿意抬价。公开来源支持一串快速上调的标记：2024 年 3 月 $18.5M、2025 年 1 月 $77.5M、CB Insights 给出的 2025 年 1 月 $410M
              估值，随后是 2025 年 10 月以 $1.5B 估值融资 $70M。但同一公开记录也说明了为什么入场纪律重要。如果 Sacra 对 2025 年 $80M 收入的估计方向正确，2025 年 10 月这一轮约按
              18.8x 收入定价，偏贵，但仍落在高端、类软件增长资产的外沿区间。如果投资人锚定 CB Insights 公开披露的 2024 年 $15M 收入，同一轮就接近 100x
              往绩收入；对于一家利润率、留存和集中度都未披露的公司，这过于激进。正确解读不是某一个数据点一定错误，而是公开估值支撑仍太薄，无法支持虚假的精确感。按上一轮价格看，这个项目已经拉伸。只有入场价明显降低，或数据室更完整，建议才有上调空间。
