        - 索取 Rewards 注册量、Gold/Black 占比、Noir 参与度和收入贡献
      - - 造型师、咨询和自有媒体嵌入
        - 造型师 / 博主工作流的公开证据较强，泛创作者品类证据较薄
        - 可能形成更持久、更高意图的创作者分群，转化优于普通网红流量
        - 索取造型师 / 博主与更广泛创作者队列的收入结构
      - - 高端时尚 / 美妆 / 家居品牌基础
        - 对高端生活方式垂直领域集中度高；一旦这些行业走弱，韧性可能受限
        - 支撑高端定位，但已验证买方组合更窄
        - 索取品类收入拆分、品牌队列增长和跨垂直获客胜率
      - - Monthly Bonus Opportunities 和送样循环
        - 品牌可能需要持续付费激励，才能让创作者规模化发帖
        - 可提高重复激活，但若奖励消失，自然耐久性可能下降
        - 索取品牌重复使用、创作者响应率，以及激励结束后的表现
      - - 具名 logo 名单和全球覆盖
        - logo 证据和 130 个国家覆盖，不等于支出多元化或续约质量
        - 品牌规模看似广，但收入可能仍集中在少数大客户或地区
        - 索取头部客户集中度、地理 GMV / 收入结构和按地区续约情况
    notes: 本表区分可信扩张向量，以及仍缺失、但可量化客户集中度和采购耐久性的披露。
