        - Associates 佣金最高 10%；Creator Connections 赞助邀约是带 Amazon 原生授权的固定费用活动
        - 佣金打款周期约 60 天；流量和内容规则受政策严格约束
        - 数百万商品、Storefront、Unique Creator Link、赞助内容邀约
        - 更严格的政策控制会降低创作者在其他平台多平台并用的灵活性
