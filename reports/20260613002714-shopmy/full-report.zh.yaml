  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局定义与 ShopMy 真正竞争的位置
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不只包括创作者店铺应用。ShopMy 在创作者供给上直接与 LTK 和 Mavely 竞争，在品牌侧创作者运营工作流上与 impact.com 竞争，在联盟跟踪和打款轨道上与 Awin 和
              ShareASale 竞争，在平台内或原生替代方案上与 Amazon Creator Connections
              或零售商自有社区竞争。买方真正要回答的问题不是有没有某个平台，而是需要哪一种发现、工作流、打款和需求生成组合。LTK 拥有最强的自有消费者目的地和零售商网络。Mavely
              强调开放准入、奖金和更快的创作者现金流。impact.com 向更大品牌销售统一合作伙伴基础设施，把创作者、联盟和推荐项目放进一个仪表盘。Awin 和 ShareASale 仍是宽口径效果营销轨道。Amazon
              有无可匹敌的商品库存和结账控制。这样看，ShopMy 更像多轨市场里的高端运营层，而不是赢者通吃网络。
