      - number: '3.3'
        title: 切换成本真实存在，但多平台经营似乎很正常
        blocks:
          - type: paragraph
            body: >-
              最强的反证是，创作者和品牌看起来习惯同时跑多条轨道。Digiday 报道称，一家创作者管理机构看到创作者使用 LTK 和 ShopMy
              的比例大约五五开；有些创作者还因为佣金经济性和更易用的后端工具，把日常使用转向 ShopMy。Mavely
              自己的指南鼓励创作者在每个主要社交渠道和自有渠道上分散经营，也进一步说明创作者业务本来就不该只活在一条轨道上。品牌侧，American Eagle
              的新联盟社区是最清晰的替代样本：这家零售商推出了自己的创作者联盟社区，同时仍维持与 ShopMy 和 LTK 的关系。Amazon 的政策又增加了一层复杂性。它们加深了 Creator Connections 和
              Amazon 原生创作者链接的吸引力，但也限制创作者如何把 Amazon 流量与其他佣金系统叠加。实际切换成本集中在打款历史、分析连续性、创作者与品牌关系和工作流熟悉度，而不是硬性排他。
