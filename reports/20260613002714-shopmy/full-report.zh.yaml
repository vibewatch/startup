      - number: '2.2'
        title: 买方、用户、付款方与预算所有者地图
        blocks:
          - type: paragraph
            body: >-
              这个市场天然是多边结构。创作者最显眼，因为他们创建店铺、联盟链接和面向品牌的库存，但他们并不总是最清晰的付款方。今天最直接付费的客户似乎是品牌，因为公开报道称 ShopMy
              的品牌订阅已成为收入大头，品牌产品套件也围绕发现、赠品、效果跟踪和可扩展活动管理展开。购物者同样重要，因为信任和重复发现决定创作者推荐能否复合成销售，而不是一次性点击。零售商和联盟网络仍是上游轨道，既能提供库存和打款，也能把创作者需求吸进自己的生态。也就是说，采用路径会同时穿过多个预算所有者：创作者成功团队、联盟和合作经理、增长或电商负责人；一旦平台开始建设目的地式发现，而不只是链接变现，消费者留存负责人也会加入。
