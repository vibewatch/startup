  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑和反向逻辑
        blocks:
          - type: paragraph
            body: >-
              支持投资的事实起点，是 ShopMy 已不再是一个投机性的收入前概念。2025 年 1 月 Series B 到 2025 年 10 月独角兽轮之间，官方和独立来源显示，公司从 100,000
              多名创作者、$352M 品牌销售额，扩张到超过 $1B 年平台销售额、1,200+ 个高端品牌和 185,000+ 名品味策展人；Modern Retail 还单独报道，2024 年收入增长 650%，并在
              2024 年 9 月首次盈利。业务模式质量也在改善：到 2025 年初，订阅已成为收入大头；官方品牌页面强调可衡量 ROI
              和工作流基础设施，而不是虚荣曝光；购物者层的搭建也给公司长期掌握更多发现入口提供了可信路径。反向逻辑在于估值支撑和防御性。公开收入仍是估计值而非审计值，创作者数量在不同来源之间明显漂移，最大的消费平台和合作伙伴基础设施玩家都在走向店铺、支付、归因和
              AI 驱动发现。也就是说，ShopMy 可以是真正赢家，但按上一轮价格买入仍可能太贵。
