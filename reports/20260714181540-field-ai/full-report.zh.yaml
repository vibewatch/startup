      - 方向
      - 时间
      - FieldAI 影响
      - 尽调问题
    rows:
      - - 建筑、采矿、能源普遍劳动力短缺
        - 驱动
        - 正向
        - 当前 → 数十年结构性
        - 人工替代方案变少，付费意愿和紧迫感上升；试点到合同周期缩短
        - 核验各垂直行业劳动力短缺的量化口径，并对应到具体客户预算审批
      - - 安全监管（MSHA、OSHA、IEC 61511、OHS 框架）
        - 驱动
        - 正向
