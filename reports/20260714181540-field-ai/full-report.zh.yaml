  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >
              FieldAI 是一家纯 AI 软件公司，不制造机器人。它的商业产品是 Field Foundation Model（FFM）平台：不绑定具身形态的自主软件，安装在合作伙伴或客户自有机器人硬件上。FFM
              充当通用“机器人大脑”，让机器人在非结构化工业环境中感知、推理和行动，无需预先绘制地图、GPS、云连接或按任务重新编程。该平台可跨四足机器人（如 Boston Dynamics
              Spot）、轮式机器人、人形平台和乘用级自动驾驶车辆使用，硬件无关。

              FieldAI 的应用组合覆盖其官网 Solutions 页面列出的八类方案：现场测绘和文档化；设施与设备巡检；状态异常检测；大规模数据采集；无人化物料运输；安保和威胁检测；远程呈现和远程操作；搜索与
              ISR。公司既自研应用，也通过伙伴载荷模式与第三方提供商合作。短期商业重点是巡检和数据采集（当前已产生收入），操作能力和通用作业则位于中长期路线图上。

              一个有辨识度的架构原则是 “Context over Training”：FFM 不要求穷尽式场景预训练，而是利用上下文线索和学习到的物理先验，对未见过的情况做推断。CEO Ali Agha
              将机器人的风险感知描述为它知道自己对某个动作“有多大把握”，客户可配置风险阈值，从而在安全关键区域调整行为。结果是一种部署模型：机器人可在新场地快速启用，并在不做大量逐场地定制的情况下扩展到企业级机队。
