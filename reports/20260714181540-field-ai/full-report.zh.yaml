        - 高 — 训练和部署管线多个环节使用 NVIDIA 产品
        - 涨价、供给向超大规模云厂商倾斜、API 弃用，或战略合作伙伴优先级变化
        - 高 — 模型训练成本和管线可靠性绑定 NVIDIA 可得性与定价
        - NVentures 投资人关系；NVIDIA Omniverse 合作加深；边缘推理设计成可在多元硬件上运行
