      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 结构性需求顺风持续数十年且正在汇合
            body: >
              建筑、采矿和能源行业的劳动力短缺不是周期性的，而是结构性的，由劳动力老龄化、危险工种吸引力下降和监管升级共同推动。叠加 AI 自主能力在 2026–2028 年走向工业生产化成熟，FieldAI
              的时间点很理想：技术已经足够被证明（企业规模部署，90%+ 效率提升有记录），同时市场仍足够早，可在竞争碎片化前建立平台占位。IFR 数据显示全球有 4.66M 台运行中的工业机器人、年安装量 542,000
              台，为 FieldAI 的软件层提供了庞大且仍在增长的装机基础。
            calloutType: strength
            claimRefs:
              - CM008
              - CM031
              - CM033
              - CM035
          - type: callout
            title: 试点困境与企业转化缓慢是生存级风险
            body: >
              近期最重要的单一市场风险，是正面机器人评价与活跃部署之间已有记录的缺口。BuiltWorlds 发现，2025 年 95%+ 的建筑公司正面评价机器人，但只有 46% 报告活跃使用，低于上一年的
              65%。这一模式与 McKinsey 的发现一致：71% 的工业公司把资本成本列为采用障碍，61% 提到缺乏内部经验。对 FieldAI 来说，强试点表现不会自动变成企业收入。公司 $405M
              资本为解决这一转化问题提供了资金续航，但试点到企业级采用的转化率，是决定 FieldAI 能否按预计时间线兑现市场机会的关键未披露指标。
            calloutType: risk
            claimRefs:
              - CM036
              - CM038
              - CM039
          - type: callout
            title: 硬件商品化后，软件层拿走不成比例的价值
            body: >
              Analytics Insight 指出，工厂开始像选择云基础设施一样选择机器人：看它能否兼容某个智能生态，而不是只看单机硬件性能。随着机器人硬件规格趋同（Boston Dynamics Spot
              价格趋势下行；人形机器人进入价格竞争），软件智能层会拿走总系统价值中越来越大的份额。FieldAI 的硬件无关 FFM 架构让它有机会成为工业机器人的 OS
              级平台——类似超大规模云厂商在企业计算中抽象硬件的方式。长期看，软件层市场可能是赢者通吃大半，但前提是 FieldAI 要在竞争者基础模型缩小自治差距前，靠数据飞轮优势建立转换成本。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM019
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >
              到 2026 年，需要自主机器人作业的工业企业实质上有五条路径可选：（1）在现有硬件上部署 FieldAI 的 Field Foundation Models；（2）采用资金充足竞争者的具身 AI
              基础模型平台（Intrinsic/Google、Physical Intelligence、Covariant）；（3）使用带自有机器人栈的巡检专用平台（Gecko Robotics、Machina
              Labs）；（4）依赖机器人 OEM 捆绑的智能软件（Boston Dynamics Orbit、KUKA、Fanuc 原生 AI）；（5）维持现状——人工巡检班组、依赖传统 SLAM/GPS
              的导航，或内部软件团队。多数大型企业买家会同时使用不止一种方案，因此多平台并用很常见，转换成本也比初看更软。FieldAI 瞄准最大的未满足切片：动态、拒止 GPS、非结构化现场环境，在这些场景里现状方案和
              OEM 原生方案都会失效。公司的硬件无关软件模式避开了机器人制造的资本密集度，同时可覆盖比任何单一 OEM 更多的平台。截至 2026 年 5 月，下文画像中的八家直接和替代玩家合计代表的 VC
              与企业资本大幅超过 FieldAI；这既验证了市场，也带来资源充足的竞争者形成稳固位置的实质风险。
