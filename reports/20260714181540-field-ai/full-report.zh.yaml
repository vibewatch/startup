      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              FieldAI 的安全架构基于概率式风险管理，而不是显式规则：FFM 在信念空间中运行，持续维护对环境的置信度估计；当不确定性超过客户配置的阈值时，系统会采取更保守动作。CEO Agha
              将其描述为机器人知道自己“有多大把握”，并通过减速或改道避免不安全动作。该设计回应了传统 LLM 套进机器人时的幻觉风险，因为 FieldAI 的模型从一开始就为物理安全设计，而不是事后改造语言或视觉模型。

              但截至 2026 年 5 月，公司未公开记录任何安全认证、监管批准或合规标准（如 ISO 10218、IEC 62443、ANSI/RIA、FedRAMP，或工业机器人同等标准）。Certis
              合作协议提到，双方将“共同开展培训、安全验证和运营框架，以支持负责任部署”，这意味着正式安全验证框架仍在开发，而非已经完成。Boston Dynamics 合作同样聚焦实际部署成果，而不是认证。FieldAI
              通过 FieldAI Federal 进入国防 / 联邦场景，暗示存在某种政府安全审查，但公司未发布具体 clearance 或 FedRAMP
              状态。私有发布说明页面阻止外部审计已交付能力与路线图能力之间的差异，也未识别到正式漏洞赏金或安全披露政策。
