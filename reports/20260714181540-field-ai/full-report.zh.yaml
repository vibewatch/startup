      - number: '5.3'
        title: 部署流程与使用场景
        blocks:
          - type: paragraph
            body: >
              FieldAI 的部署模型是 B2B 软件：客户自有或租赁的机器人通过软件安装获得 FFM 大脑，FieldAI 提供集成服务和持续模型更新。客户不需要向 FieldAI
              购买专用硬件。部署时间是关键差异化主张：机器人不需要预先绘制环境或 GPS 基础设施，因此场地启用被描述为很快；公司及其投资人称，过去“要几个月”的流程现在“只要几个小时”。一位未具名全球工业制造高管给出了
              3.5 个月缩短到 12 小时的具体结果（超过 200 倍改善），使用的是 FieldAI 技术加 NVIDIA NuRec 数字孪生生成——但该主张未获独立第三方验证。

              建筑是领先的商业垂直。Big-D Construction 使用 FieldAI 已超过两年，并在 2026 年 4 月宣布扩展到多个项目；据称其中一个项目通过早期缺陷检测节省了 $1.2
              million。在安保垂直，Certis Group（新加坡）在公共基础设施、交通枢纽和工业设施中部署与其专有 Mozart 编排平台集成的 FFM。FieldAI 与 Boston Dynamics 的合作于
              2026 年 3 月 12 日正式化，目标是建筑巡检；搭载 FFM 的 Spot 机器人可自主执行 3D 扫描、危险识别和夜间监控。公司还通过 FieldAI Federal 处理联邦和国防用例，该实体由前
              DARPA Program Manager Dr. Eric Krotkov 领导。

              地域上，FieldAI 已记录美国、日本、欧洲，以及通过 Certis 覆盖亚太的部署。客户通常不公开具名（TechCrunch 确认，公司在 2025 年 8 月融资公告时拒绝披露客户名称）；截至 2026 年
              5 月，Big-D Construction 是唯一按名称公开确认的建筑行业客户。
