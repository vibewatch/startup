      - number: '4.4'
        title: 财务不透明与尽调阻点
        blocks:
          - type: paragraph
            body: >
              FieldAI 是私营公司，没有公开财务报告义务。截至 2026 年 5 月，仍未披露或无法验证的关键财务指标包括：（1）经审计 ARR 或总收入；（2）按收入流拆分的毛利率；（3）CAC
              和回本周期；（4）净收入留存率；（5）客户数量与集中度；（6）账上现金；（7）月度或季度 burn。


              现有收入信号彼此冲突。GetLatka 估计 ARR 为 $140M（2025 年 11 月），而其他分析平台曾给出低至 $5M 的数字——相差 28 倍，反映了外部估算私营公司指标的难度。UpsideList
              的社区模型标记 -2% 上行空间，并从二级市场定价角度把公司视为近似尚未产生收入，指向私募二级层面的流动性和估值不确定性。


              若以 $140M ARR 估计为基准，$2B 估值对应 14x 收入倍数；若以 $100M 已签约收入信号为基准，则对应 20x。对一家未披露盈利能力、没有公开财务记录、且所在市场中至少 54%
              建筑垂直机器人部署（公司披露的最大市场）仍停留在试点或搁置状态的公司而言，这两个倍数都很激进（据 BuiltWorlds 2025 数据）。只有在 ARR
              快速增长且利润率很高时，这些倍数才站得住脚——但现有数据无法确认任一条件。FieldAI 未向 SEC 提交 Form D（经 EDGAR 全文搜索确认），意味着公司要么使用了无需 Form D
              的豁免，要么使用了不同法律实体，要么尚未提交。加州实体 “Field Ai, Inc.”（文件 #6436098，2024 年 10 月 24 日注册，Delaware 设立，CEO Aliakbar
              Aghamohammadi）处于 active 状态。


              二级市场分析师给出的负面估值信号和宽幅收入估计区间本身不构成否决项，但意味着要承销 $2B 估值，必须通过正式尽调拿到非公开财务信息。
