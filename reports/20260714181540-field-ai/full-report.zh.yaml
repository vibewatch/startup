  - id: TV002
    title: 正方与反方论点
    columns:
      - 论点
      - 证据基础
      - 什么会改变观点
    rows:
      - - 正方：机器人硬件商品化后，硬件无关 AI 软件拿到近似垄断份额
        - FFM 已部署到四足 / 人形 / 轮式 / 履带式平台；TechCrunch 和官方来源确认硬件无关架构
        - OEM 纵向整合（Boston Dynamics、Figure）拿下“大脑层”；或超大规模云厂商（Google Intrinsic、NVIDIA Cosmos）让基础模型商品化
      - - 正方：创始团队拥有行业最高现场机器人信誉
        - DARPA SubT 获胜、NASA JPL、MIT/DeepMind 履历有据可查；Marc Raibert / Vinod Khosla 公开背书
        - 若 CEO 离开，出现关键人风险；或 CSO / CTO 被资金更充裕的竞争对手吸引
      - - 正方：顶尖投资人投入 $405M，说明其私有尽调优于公开数据
        - 轮次超额认购；Bezos Expeditions、Temasek、Khosla、NVentures 均参与；投资人声明确认商业信念
        - 若 B 轮出现估值下调轮，将推翻私有尽调假设；若投资人减记该头寸，信号反转
      - - 正方：公告后 9 个月已签约收入超过 $100M，商业牵引异常快
        - OCBJ 2026 年 4 月匿名来源；GetLatka 估计 ARR 为 $140M；CEO 称合同为数百万美元级
        - 已签约收入与管线混同；ARR 明显更低；流失暴露客户不满
      - - 反方：收入未验证，估计区间跨度达 28x
        - 估计从 $5M（CompWorth）到 $140M ARR（GetLatka）不等；无审计数字；OCBJ 使用匿名来源
        - 公司发布经审计 ARR；若数字高于 $80M，基本可补上这一缺口
      - - 反方：对一家 $2B 公司而言，治理不透明程度极高
        - 未披露董事会构成；Field Ai, Inc. 未提交 Form D；无审计财务；无股权结构表细节
        - NDA 下正式开放资料室即可满足；IPO 前财务报告可关闭缺口
      - - 反方：AI 软件倍数压缩是 2026–2027 年结构性风险
        - Howard Morgan（First Round Capital）警告 AI 估值过热；Madrona 合伙人称种子轮 / A 轮定价远超基本面
        - 经过验证的收入推动全行业重新上调估值，则该风险失效；或 FieldAI 自身 B 轮提价确认
      - - 反方：竞争对手（Physical Intelligence、Skild AI）以相当或更弱收入拿到更高估值
        - PI 以零收入洽谈 $11B 估值；Skild 以 $30M ARR 拿到 $14B 估值；行业可选性溢价推高全部估值
        - 若行业倍数压缩，且 PI 或 Skild 以平轮 / 估值下调轮融资，FieldAI 的 $2B 可能显得昂贵
    notes: |
      正方行代表多头 / 证实性解读；反方行代表空头 / 挑战性解读。两组论点截至 2026 年 5 月 runDate 均有证据支持。
