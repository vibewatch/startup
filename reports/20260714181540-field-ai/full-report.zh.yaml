      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              FieldAI 由 Ali Agha 创立并担任 CEO，他带来近二十年的机器人 AI 经验。创立 FieldAI 前，Agha 在 NASA Jet Propulsion
              Laboratory（JPL）工作约七年，担任多个美国高知名度自主项目的首席研究员，包括 DARPA Subterranean Challenge、DARPA RACER（自动驾驶越野车辆）、NASA
              Autonomous Mars Cave Exploration，以及 Coordinated Autonomy for Prototype Mars Helicopter-Rover。他还曾在 Qualcomm
              任研究员，并在 MIT 做博士后。关键在于，Agha 带领 JPL-MIT-Caltech-KAIST-LTU CoSTAR 团队赢得 2020 DARPA Subterranean Challenge 的
              Urban Circuit；这是现场机器人领域的标志性成果，也验证了如今 FieldAI 技术核心中的风险感知自治路线。Agha 在 Texas A&M University
              获得计算机科学与工程博士。联合创始人包括 Dr. Shayegan Omidshafiei（首席科学官）和 Dr. David Fan（首席技术官）。Omidshafiei 曾在 DeepMind/Google
              担任研究科学家超过五年，研究大规模 AI 模型和多智能体强化学习；他在 MIT 完成博士，并在那里首次与 Agha 合作。Fan 曾任多个 DARPA SubT 和 DARPA RACER
              项目的首席技术专家，也是 NASA JPL 研究员。其他高级领导包括 Dr. Eric Krotkov，他负责公司的国防子公司 FieldAI Federal，曾任 DARPA Program Manager 和
              Toyota Research Institute 的 CSO；以及 Sebastian Scherer，他是 Fieldable Embodied AI 负责人，也是 Carnegie Mellon
              Robotics Institute 副研究教授。创始团队共同的 JPL、DARPA 和 MIT 背景，让 FieldAI 在安全关键现场环境部署 AI 上拥有罕见的创始人 -
              市场匹配。董事会构成和正式治理结构尚未公开披露。CEO Ali Agha 是公司的主要公开发言人与募资人，形成了有意义的关键人依赖。
