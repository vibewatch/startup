      - number: '3.4'
        title: 差异化可持续性、护城河与反向证据
        blocks:
          - type: paragraph
            body: >
              FieldAI 声称的护城河建立在四根柱子上：（1）用专有真实部署数据训练的物理优先、风险感知基础模型；（2）不依赖云或 GPS
              的端侧部署，使其进入云优先竞争者无法进入的市场；（3）来自建筑、能源、采矿和国防等不断增长机队的数据飞轮；（4）由 Boston Dynamics、Certis Group 和 Carnegie Mellon
              Robotics Innovation Center
              锚定的合作伙伴生态。现阶段独立评估这条护城河很难：部署数据量和模型性能基准没有公开披露；硬件无关定位是优势，也意味着竞争者可以追逐同样的机器人伙伴。几项反向信号值得关注。第一，Physical
              Intelligence 正以 $11B 估值融资——是 FieldAI 的 5.5×——即便它没有商业产品。如果 Pi 在 FieldAI 建立主导数据优势前实现商业化，更强资本基础可能压缩 FieldAI
              的差异化窗口。第二，Google/Intrinsic/Fanuc 集成（1.1M 台已部署机器人获得 AI 升级）带来 FieldAI 无法靠自身复制的装机基础杠杆。第三，UpsideList 2026 年 3
              月分析给出 50% 概率的熊市情景：NVIDIA Isaac 或 Boston Dynamics 内化自治层，通过降价轮抹掉 FieldAI 普通股价值。关键在于，FieldAI 最显眼的合作伙伴 Boston
              Dynamics 也运营 Orbit 软件平台，背后有 Google Gemini，且可以选择开发竞争性自治能力。第四，对 Covariant——一个仓库 AI
              类比公司的独立分析，把其数据护城河评为“窄而非宽”，理由是 Physical Intelligence、Nimble 和 Amazon 都在竞争性积累数据；这一逻辑适用于任何具身 AI
              平台。基础模型商品化风险真实存在：随着 VLA 模型通过开源发布（Pi 已开源早期模型）和超大规模云厂商 API 扩散，物理优先差异化可能被压缩成商业秘密，而非结构性护城河。FieldAI 的国防垂直（由前
              DARPA PM Eric Krotkov 领导的 FieldAI Federal）以及拒止 GPS 的端侧部署要求，可能成为最可防守的细分，因为它们需要硬件认证和安全许可，能形成独立于模型质量的监管转换成本。
