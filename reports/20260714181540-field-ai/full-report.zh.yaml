  - id: TV003
    title: 牛市、基准、熊市情景
    columns:
      - 情景
      - 关键假设
      - 退出 / 下一轮隐含估值
      - $2B 标记估值下的回报逻辑
      - 概率信号
    rows:
      - - 牛市
        - ARR：$140M（已验证），同比增长 80–100%；GM：70–80%；NRR：120%+；2027 年 B 轮按 $350–500M ARR 的 15–20x 定价
        - B 轮估值 $5.25B–$10B；2030 年 IPO 估值 $15–30B+
        - 从 $2B 入场为 2.6–5x；到 IPO 潜在 7–15x
        - 低-中：需要收入验证和持续增长同时成立；AI 倍数必须守住
      - - 基准
        - ARR：$100M（未验证），同比增长 40–60%；GM：55–70%；NRR：110–120%；2028 年 B 轮按 $200–300M ARR 的 10–12x 定价
        - B 轮估值 $2.0B–$3.6B；2031 年 IPO 估值 $6–9B
        - 从 $2B 入场为 0–1.8x；到 IPO 约 3–4.5x；尚可但不突出
        - 中：与“好但不突出”的执行一致；需要避开行业压缩
      - - 熊市
        - ARR：$20–50M（实际），增长放缓；行业倍数压缩至 8–10x；2027 年估值下调轮
        - 下一轮估值 $0.4B–$1.0B；可能重组或人才收购
        - 从 $2B 入场亏损 50–80%；以困境价格救援式收购
        - 低-中：由收入意外叠加行业修正触发；若投资人做过真实尽调，则不太可能
    notes: |
      所有情景均为基于公开数据和可比公司基准的模型估计。没有审计财务就无法验证。情景中的收入数字是假设区间，不是已确认数值。回报估计假设现有股权结构之外不再发生额外稀释。
