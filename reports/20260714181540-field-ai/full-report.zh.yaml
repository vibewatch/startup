  - id: TI003
    title: 单位经济模型 — 已披露、估计与未知
    columns:
      - 指标
      - 数值 / 估计
      - 置信度
      - 为何重要
      - 尽调请求
    rows:
      - - 毛利率（软件授权）
        - 估计 65–80%（企业 AI 软件行业基准）
        - 低 — 估计值；未披露
        - 长期现金生成的核心驱动；必须高于边缘计算和支持的边际成本
        - 要求管理账按收入来源拆分毛利瀑布
      - - 毛利率（硬件集成服务）
        - 估计 20–45%（现场服务与集成工作）
        - 低 — 估计值；未披露
        - 服务毛利会稀释综合毛利；服务与授权的占比是关键
        - 披露服务与软件收入拆分及各自毛利率
      - - 综合毛利率
        - 估计 55–75%（取决于授权 / 服务组合）
        - 低 — 估计值；未披露
        - 影响估值：软件级毛利支撑溢价倍数；混合毛利不支撑
        - 要求提供最新 P&L 或贡献毛利数据
      - - 客户获取成本（CAC）
        - 未披露；考虑 12–24 个月销售周期，估计每个企业客户 $200K–$1M
        - Unknown
        - CAC 高，即便回本期短，也会带来现金流风险；回本期长则需要 NRR 足够粘
        - 要求按客户细分披露综合 CAC 和回本期
      - - 净收入留存率（NRR）
        - 未披露；官方公告提到「扩展合同」
        - Unknown
        - NRR >120% 将验证先落地再扩张模式，并显著抬高 LTV 估计
        - 要求客户 cohort 留存数据；确认扩展合同是否抬高 ACV
      - - 平均合同价值（ACV）
        - 基于数百万美元交易说法和定价区间，估计 $300K–$2M
        - 低 — 估计值
        - ACV 驱动 LTV/CAC 分析；估计区间很宽，说明信息缺口大
        - 披露 ACV 四分位数；确认 ACV 是否包含集成费
      - - 人均收入
        - 估计 ~$900K–$1M（若 $140M ARR / 150 名员工）
        - 低 — 分子和分母都是估计值
        - 若准确，该指标是强生产率信号；验证软件模式可扩展
        - 同时确认员工数和 ARR，验证该比率
      - - 燃烧倍数（每新增 $1 ARR 消耗的资本）
        - 估计 1.5x–3x（与激进增长期 AI 同业一致）
        - 低 — 估计值；未披露
        - 燃烧倍数高说明资本效率低；高效增长的目标应 <1.5x
        - 要求管理层提供滚动 12 个月现金消耗和新增 ARR
    notes: |
      所有单位经济模型数值都依据可比上市公司基准和可观察运营数据（员工数、定价区间、交易规模说法）估计。没有经审计数字。置信度整体偏低；这些估计应作为情景建模的方向性输入，而非确认指标。
