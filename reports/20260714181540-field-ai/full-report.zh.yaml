      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              牛市情景要求 FieldAI 收入位于估算高端（$140M ARR，年同比增长 80–100%），软件许可流毛利率接近 70–80%，由车队扩张驱动的 NRR 超过 120%，并在 2027 年以
              $350–500M ARR 为基数、按 15–20x 远期 ARR 完成 Series B——对应 $5.25–10B 估值，相比 $2B 标记回报
              2.6–5x。该情景的关键风险是收入数字未经验证，增长率未获独立确认，且市场环境必须继续支持 AI 软件高倍数。


              基准情景假设 $100M ARR、40–60% 增长、混合毛利率 55–70%、NRR 110–120%。若 2027–2028 年 Series B 以 $200–300M ARR 为基数、按 10–12x
              远期 ARR 定价，估值将为 $2.0–3.6B——相对 $2B 标记回报 0–1.8x。这意味着大体持平到温和升值，和风险水平相匹配。


              熊市情景假设收入显著更低（$20–50M ARR），行业逆风拖慢增长（企业采纳摩擦、宏观 capex 回撤），AI 软件倍数压缩把下一轮隐含估值拉到 $0.4–1.0B——相比 $2B 标记亏损
              50–80%。该情景下降价轮风险最高。负面触发因素包括：若 Physical Intelligence 或 Skild AI 以低于预期的倍数融资，整个机器人赛道估值重置；FieldAI
              客户削减部署或不续约；或出现证据显示「已预订收入」显著高估已确认 ARR。
