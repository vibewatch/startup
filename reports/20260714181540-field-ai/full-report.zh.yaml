      - 可衡量收益（声称）
      - 已记录限制
    rows:
      - - 建筑进度监测
        - 人工巡场、无人机航拍、3D 扫描项目（数周）
        - Spot 夜间自主巡逻 → 每日 3D 进度报告，并与 BIM 集成
        - 巡检 / 文档时间减少 90%+（Boston Dynamics 新闻稿）
        - 说法未经独立第三方验证；来源仅单一供应商
      - - 工业设备巡检
        - 受训技术员在危险区域人工巡检
        - 机器人在设施内自主导航，无需预绘地图即可采集设备读数
        - 降低人员暴露在危险环境中的时间；提前发现异常
        - 未发布误报率或覆盖率数据
      - - 数字孪生生成
        - 人工 3D 扫描项目 — 数月完成，很快过时
        - 机器人每天生成重建数据作为运营副产物，再经 NuRec → Isaac Sim
        - 某未具名客户从 3.5 个月 → 12 小时（提速 >200×，公司说法）
        - 单一未具名客户；未独立验证
