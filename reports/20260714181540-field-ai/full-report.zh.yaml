  - id: FU001
    title: 客户旅程图 — FieldAI 企业工业买家
    type: journey-map
    layout: wide
    summary: |
      展示 FieldAI 主要和次要客群中，典型企业工业客户从认知、生产部署到机队扩张的路径。
    data:
      items:
        - id: stage-awareness
          label: 1. 认知
          actor: 企业 VP/总监（技术、创新、VDC 或运营）
          description: 客户通过行业会议、伙伴转介（Boston Dynamics、NVIDIA）、媒体报道，或其他承包商同行推荐发现 FieldAI。
          channels:
            - 行业会议
            - OEM 伙伴网络（Boston Dynamics、NVIDIA）
            - 媒体报道与分析师报告
        - id: stage-discovery
          label: 2. 发现 / 演示
          actor: 技术或创新总监；项目高管
          description: 技术评估；CEO 级或 VP 参与；在活跃工地做现场演示，或用数字孪生走查。FieldAI 展示 BIM 集成、自主任务模式和传感器载荷。
          channels:
            - FieldAI 直销团队
            - fieldai.com 产品页面
            - 伙伴介绍与转介
        - id: stage-pilot
          label: 3. 概念验证 / 试点
          actor: 现场主管；安全经理；VDC 总监
          description: 在单个项目站点限时部署。机器人机队规模有限；只跑一种任务（巡检或文档记录）。这一阶段检验现场主管和一线团队是否买账。
          channels:
            - 有监督的现场部署
            - 客户反馈闭环
            - 现场主管评估
        - id: stage-production
          label: 4. 生产部署
          actor: 现场主管；技术总监；运营负责人
          description: 在活跃站点定期执行自主任务；FieldAI 接入 BIM、项目管理和安全报告流程。数据飞轮开始强化站点专属模型。
          channels:
            - 扩张后的机器人机队
            - 日常自主作业
            - BIM 与项目管理集成
        - id: stage-expansion
          label: 5. 机队 / 企业扩张
          actor: 创新总监；CTO；运营 VP
          description: 多站点铺开；增加任务类型（巡检 + 安防 + 运输）；多年合同续签。Big-D 计划在未来每个项目部署，正是这一阶段的样本。
          channels:
            - 新站点上线
            - 通过数据飞轮改进模型
            - 通过 FieldAI 云端管理企业机队
    approximationNotes: |
      阶段顺序根据可获得客户证据（Big-D 2 年轨迹、DPR 从 PoC 到生产的路径）和公司材料推断。并非所有细分市场都有已确认生产部署；能源、采矿和联邦仅按公司定位纳入。
