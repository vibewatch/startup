          - type: callout
            title: 关键风险：收入不透明让熊市情景出现 400x 倍数风险
            body: >
              FieldAI 最大的估值风险不是技术、团队或市场，而是信息不对称。如果真实收入是 $5M（一个二级市场估算所示），而不是 $140M ARR（GetLatka），则 $2B 估值隐含收入倍数约
              400x，只能与最投机的早期 AI 投资相比。若收入无法匹配当前投资人信心所隐含的 $100M+，降价轮概率会急剧上升。
