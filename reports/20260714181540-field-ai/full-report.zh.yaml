companyProfile:
  summary: >-
    FieldAI 是一家私营具身 AI 软件公司，2023 年由前 NASA JPL 机器人负责人 Ali Agha 创立，技术联合创始人来自 DeepMind、NASA JPL 和 DARPA 自主项目。公司销售 Field
    Foundation Models，这是一个硬件无关的软件大脑，让第三方机器人在非结构化工业环境中安全作业，不依赖 GPS、预建图场景或持续云连接。FieldAI 公开牵引力最强的场景在建筑业，已具名部署到 Big-D
