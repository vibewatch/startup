      - number: '3.3'
        title: 定价与包装对比
        blocks:
          - type: paragraph
            body: >
              整个竞争领域的定价透明度都很低；多数平台面向企业采购销售，没有公开标价。FieldAI 的订阅据称按部署规模不同，从每年数万美元到 $500,000 不等；公司引用第三方估算称 2025 年 ARR 为
              $140M，并称已签约收入达到 $100M 或以上。Intrinsic 不公布 Flowstate 定价；Google 的云优先模式暗示会在 Google Cloud 计算费之上叠加企业 SaaS 档位，而
              Fanuc 合作意味着可能存在批量授权。Physical Intelligence 没有商业产品或定价。Gecko Robotics 把巡检服务、Cantilever 平台访问和工程咨询打包成多年合同；Navy
              IDIQ 展示的是 18 艘船、五年 $71M 的合同框架。Boston Dynamics Orbit 作为硬件之上的软件层出售；年费未披露，但 Michelin 和其他企业案例研究把它称为持续运营软件。Viam
              提供对开发者友好的免费档，并按需提供企业定价；开源模式先推动开发者采用，再向托管基础设施追加销售。Machina Labs 按制造服务合同定价，而不是软件订阅。行业估计，美国海军单是现状人工巡检每年就花费
              $13–20B；按 Boston Dynamics 合作公告，FieldAI 支持的系统可让建筑工地文档时间减少 90% 以上。
