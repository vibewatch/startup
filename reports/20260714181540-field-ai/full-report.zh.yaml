      - number: '3.2'
        title: 竞争者画像与能力对比
        blocks:
          - type: paragraph
            body: >
              Intrinsic 已在 2026 年 2 月并入 Google，提供 Flowstate，这是面向工业机器人的网页开发与仿真环境。该平台跨 KUKA、Fanuc、Universal Robots 等硬件，且借助
              Google Gemini AI 模型做视觉和推理。2026 年 5 月与 Fanuc 的合作让 Google 触达 1.1M 台已部署工业机器人——这是任何初创公司都无法匹敌的分销渠道。Intrinsic
              在研发五年后，于 2023 年 1 月裁掉 20% 员工，也没有披露商业收入；但并入 Google 以及与 Foxconn 的合资（2025 年 10 月）显示其商业化意图正在加速。Physical
              Intelligence（Pi）是一家研究优先的基础模型公司，2024 年创立，截至 2026 年 3 月没有商业产品或收入。其 π0.7 模型（2026 年 4 月）在操作任务上展现出涌现式泛化，并据称正以
              $11B 估值融资 $1B。Pi 的 VLA（Vision-Language-Action）架构瞄准实验室到生产的迁移。Covariant 是机器人基础模型早期玩家（RFM-1，8B 参数，2024 年 3
              月推出），但其创始人和约 25% 员工在 2024 年 8 月被 Amazon 以团队收购方式吸收，交换条件是一份非排他技术许可。剩余公司由新 CEO Ted Stinson 领导，继续服务非 Amazon
              物流客户（服装、杂货、医药），但面临公司层面的不确定性；竞争性数据积累者也让其护城河偏窄。Gecko Robotics 把自有 TOKA 巡检机器人与 Cantilever AI
              平台结合，服务关键基础设施数字孪生；公司 2025 年 6 月达到独角兽状态（估值 $1.25B），并在 2026 年 3 月赢得一份 $71M、五年期 U.S. Navy IDIQ 合同。Gecko
              的市场深扎能源、国防和制造巡检，但结构上比 FieldAI 的横向野心更窄。Boston Dynamics（Hyundai 旗下）提供 Spot、Stretch、Atlas 机器人，以及用于车队智能的 Orbit
              软件平台。2026 年 3 月，Boston Dynamics 宣布与 FieldAI 直接合作，把 Spot 延伸到未知、动态环境——这让 Boston Dynamics 同时成为硬件伙伴和潜在软件竞争者，因为
              Orbit 正在扩大与 Google Gemini 的 AI 集成。Machina Labs 专注 AI 驱动的机器人钣金成形（RoboCraftsman），服务国防和航空航天，并在 2026 年 2 月完成
              $124M Series C。它不是 FieldAI 巡检与自治重点的直接竞争者，但会争夺国防预算和 OEM 机器人心智。Viam 是开源机器人软件平台（总融资 $117M），面向希望在
              IoT、机器人和工业机器之间抽象硬件的开发者。Viam 争夺同一个“大脑层”叙事，但把自己定位为开发者 SDK 路线，而不是 FieldAI 的预训练 AI
              模型。内部自研仍是既有方案：大型工业公司（能源、采矿、建筑）保有内部机器人和软件工程团队。自研单位经济很难量化；当没有商业平台满足所需安全认证或数据驻留约束时，自研就会成为默认选择。
