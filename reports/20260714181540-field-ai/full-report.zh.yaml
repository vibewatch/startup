            body: >
              FieldAI 2025 年 8
              月融资公告称，公司已在日本、欧洲和美国“数百个复杂真实世界工业环境”中完成“成功测试和部署”，客户包括建筑、能源、制造、城市配送与巡检领域的“全球最大公司中的一些”。该轮融资被描述为在“快速客户采用和多份扩张合同”之后超额认购；到
              2026 年 3 月，公司在 NVIDIA 合作公告中提到一个“快速增长的机队”，客户正在北美、欧洲和亚洲扩张。这些都是公司方说法，没有第三方验证活跃场地数量、客户数量或机队规模。

              robotsinconstruction.com 截至 2026 年 4 月的独立跟踪只统计到四个确认的建筑部署：Big-D Construction（生产，2+ 年）、DPR
              Construction（生产，截至 2025 年 11 月约 1.5 年），以及两家未具名 top-10 ENR 总承包商。该平台指出 FieldAI 自 2024
              年开始出货。“数百个环境”与四个确认建筑部署之间的差距，可能部分来自非建筑垂直、商业化前测试环境，以及未被独立来源跟踪的演示或评估部署。Big-D 和 DPR
              是仅有的、带有客户具名结果的案例（具名高管和现场主管引述、具体平方英尺数据、已运行部署时长）。

              Boston Dynamics 合作（2026 年 3 月）增加了一个可信的第三方验证者；Boston Dynamics 提到客户“从亚洲到欧洲再到北美”正在扩展到企业级部署。FieldAI 表示计划把 Spot
              部署扩展成“全球最大的第三方四足机器人机队之一”。两个说法都没有独立场地级佐证。
