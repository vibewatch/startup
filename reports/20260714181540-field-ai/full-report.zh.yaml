        - FFM 模型改进的训练基础设施；从部署数据做联邦学习
        - 中 — 集中在 NVIDIA GPU 生态；Azure 用于管线工具链
        - GPU 持续短缺（HBM 瓶颈、TSMC 冲击）推高训练成本或延误模型更新
