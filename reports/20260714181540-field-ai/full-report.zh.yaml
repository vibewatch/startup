      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              FieldAI 销售 B2B 企业软件，不卖硬件。公司的买方结构遵循典型企业工业技术模式：付款方是最高管理层或运营 / 财务 VP，技术买方是运营或
              HSE（健康、安全、环境）负责人，日常用户是现场总监、现场工程师或项目经理。预算归属因垂直而落在两类池子里：（1）用于新自动化投资的资本开支（capex）预算，由 CFO、工程 VP 或运营 VP
              控制；（2）用于经常性巡检、监控和现场智能合同的运营开支（opex），由工厂或项目经理在预先批准的服务供应商协议内控制。FieldAI 把产品定位成能在 opex 侧立刻产生 ROI（人工文档时间减少
              90%+，更早识别返工），让初始销售可被包装为成本规避，而不是资本开支改造。

              建筑板块最直接的购买力集中在最大型总承包商——例如 FieldAI 的 Boston Dynamics 案例研究中提到但未具名的 ENR
              排名前列公司。这些公司拥有大量项目积压，承担成本超支风险，也有为自动化试点预留的内部创新或数字化转型预算。采用触发因素包括：无法快速生成准确竣工 BIM
              数据，现场文档团队劳动力短缺，以及安全要求规定必须定期巡检危险区域。采矿和能源买家集中在 BHP、Rio Tinto 及同类大型运营商，HSE 与运营负责人受监管合规、事故减少和车队生产率指标驱动。BHP
              Ventures 投资 FieldAI，构成来自这一买方群体的直接市场验证。油气客户由巡检合规要求、危险环境访问降本和资产完整性管理要求驱动。所有板块的采用路径都从有限概念验证开始（通常是一个站点或资产集群），经
              ROI 验证后，进入覆盖多站点或多区域的企业框架协议——这与 FieldAI 提到“全车队部署”和全球运营“企业级”扩张的模式一致。
