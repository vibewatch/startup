  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              FieldAI 的可服务市场不是整个工业机器人市场——大多数已部署工业机器人都在结构化、重复性的制造环境中运行（汽车装配、半导体制造、消费电子），这些场景已经由 FANUC、ABB、Yaskawa
              等传统固定路径自动化厂商充分服务。FieldAI 真正不同的市场，是那些需要自适应、风险感知自治能力的工业机器人部署：环境非结构化，布局每天变化，GPS
              和预建图路径不可用，静态编程失效。具体包括活跃建筑工地（地形、障碍和工作流按小时变化）、地下与露天矿山（落石、瓦斯风险和狭窄空间让人员暴露危险）、油气地面设施与巡检环境（资产访问危险且偏远），以及不适合固定路径机器人的柔性或高混合制造设施。

              市场边界排除以下支出：（a）结构化工厂自动化硬件和软件，例如固定装配线上的传统关节臂机器人；（b）在受控环境中运行的消费级或物流仓储机器人；（c）机器人硬件本身，因为 FieldAI 是纯软件供应商；（d）水下
              ROV 和特种水下车辆，它们由另一套供应商生态服务。工业买家当前依赖的现状替代方案包括人工巡检和监控班组、需要大量预编程的传统固定路径或单任务机器人、无人机 / UAV 航测，以及配合人工采集数据的
              BIM/CAD 建模。按单位现场智能成本看，这些替代方案更贵，实时性更弱；随着劳动力池收缩、安全要求收紧，它们也越来越难以维持。

              FieldAI
              的市场横跨四个主要垂直：（1）建筑与基础设施，（2）能源、采矿和采掘，（3）油气巡检与运营，（4）非结构化或高混合配置下的工业制造。公司把目标场景描述为“脏、枯燥、危险”的环境；自主机器人能在安全、文档和运营洞察上持续叠加价值，这一框架与四个服务垂直的结构特征高度一致。可作为未来扩张路径的相邻市场包括国防与周界安防、复杂环境中的物流，以及半结构化场景中的城市配送。更合适的市场规模测算方式，是按垂直行业引用分析师估算，而不是套用一个宽泛机器人
              TAM；因为不同分析师报告的范围定义差异很大。
