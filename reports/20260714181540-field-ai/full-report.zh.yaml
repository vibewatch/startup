            title: 安全认证缺口是投资前最紧迫的尽调事项
            body: >
              截至 2026 年 5 月，尚未发现 FieldAI 平台取得 ISO 10218、IEC 62443、SOC 2 或同等第三方安全 /
              安保认证。若在建筑、采矿和能源场景部署自主机器人，却没有公开安全验证，客户会暴露在 OSHA 合规风险下，FieldAI 也会在欧盟修订后的 Product Liability Directive
              下直接承担产品责任敞口。投资人应在建仓前要求独立安全审计报告和合规路线图。
