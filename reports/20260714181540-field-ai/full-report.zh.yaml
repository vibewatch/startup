      - number: '6.3'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              Big-D Construction 和 DPR Construction 是 FieldAI 两个完全具名、已生产部署且公开归因结果的客户。Big-D 是一家拥有 25+ 年商业建筑经验的美国承包商，截至
              2026 年 4 月已活跃部署超过两年。C 级高管 Shaun Orr 描述了一个突破性时刻：机器人实时走遍项目现场，联接 BIM
              模型和项目进度，识别漏做工作和安全问题，并把发现回连到公司的项目管理平台——这是单个人类团队无法独立复制的能力。Orr 预计“每个项目都会在某种程度上使用 FieldAI 工具”。Big-D 现场主管
              Bronson Dupaix 描述了用机器人替代五小时人工现场巡检、手持相机和扫描仪的流程。Big-D 总监 Chantelle Menlove
              还独立提到，一位在某个工地见过机器人的现场主管打电话要求在下一个工地使用它，说明存在自下而上的自然需求。

              DPR Construction 是美国十大承包商之一，专长于数据中心和医疗项目；截至 2025 年 11 月，它在 California Santa Clara 的一个数据中心现场部署 FieldAI 机器人约
              1.5 年。机器人采集了 45,000+ 张照片，行走 100+ 英里，扫描 500,000 平方英尺室内空间和 125,000 平方英尺屋面。现场主管 Justin Schreiner
              表示，该系统通过去掉琐碎文档任务、让团队聚焦关键工作，“让我们把事情做得更好”。

              Certis Group 是新加坡最大的安保和运营公司，2026 年 2 月宣布与 FieldAI 建立战略合作，在其全球运营中部署自主安保机器人。Certis 的 Mozart 编排平台与 FieldAI 的
              FFM 集成，用于多场地安保环境中的自主巡逻、事件检测和人机协同。Certis 总裁 Ng Tian Beng 确认，该合作面向“实时、任务关键环境”。这不是直接客户销售，而是渠道 / OEM
              式安排：Certis 既是伙伴，也是安保垂直的运营方客户。

              一位未具名全球工业制造高管在 2026 年 3 月 FieldAI/NVIDIA 新闻稿中被引用称，某个过去“需要三个半月”的流程现在“只需十二小时”——提升 200
              倍。客户未具名，指标也无法验证，但这段话由公司具名高管（CEO Ali Agha）在正式新闻稿中归因。robotsinconstruction.com 独立跟踪器中还出现了两家额外的未具名 top-10 ENR
              公司，确认有生产部署，但未披露结果。
