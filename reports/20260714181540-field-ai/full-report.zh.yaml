  - id: FU003
    title: 客户证据矩阵 — 证据质量 vs. 生产成熟度
    type: matrix
    layout: wide
    summary: |
      从结果证据质量（低到高）和生产部署成熟度（试点到规模化生产）两个维度，展示 FieldAI 已知客户和伙伴关系。
    data:
      columns:
        - 试点 / 早期
        - 单站点生产部署
        - 多站点生产部署
        - 机队 / 企业级规模
      rows:
        - label: 高结果证据（具名高管引述 + 指标）
          values:
            - ''
            - DPR Construction（45K 张照片、500K sqft、现场主管引述）
            - Big-D Construction（多站点、2+ 年、高管 + 现场主管引述、VDC 总监）
            - ''
        - label: 中等结果证据（伙伴确认收益）
          values:
            - ''
            - ''
            - Boston Dynamics（称巡检时间减少 >90%）
            - ''
        - label: 低结果证据（公司归因、指标无法验证）
          values:
            - ''
            - 未具名全球制造商（速度提升 200×，未验证）
            - ''
            - ''
        - label: 极少 / 仅伙伴关系证据
          values:
            - Certis Group（2026 年 2 月签署合作，现场运营规模未确认）
            - 2 家未具名 ENR 公司（已确认部署，未披露结果）
            - ''
            - ''
    approximationNotes: |
      结果证据质量由分析师按证据独立性、具体程度和归因方式评级。成熟度位置反映公开披露的部署时长和规模，不代表公司内部数据。该矩阵只是局部视图——FieldAI 完整客户群未公开。
    claimRefs:
      - CU019
      - CU023
      - CU026
