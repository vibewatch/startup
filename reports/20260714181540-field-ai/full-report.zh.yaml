  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 作用
      - 关键依赖
      - 风险
    rows:
      - - 多模态感知栈
        - 将视觉、LiDAR、文本、音频、热成像、事件相机输入统一的信念状态表征
        - 合作伙伴机器人上的传感器硬件（Spot、Unitree 等）
        - 新平台上传感器退化或不支持某些模态，会降低感知质量
      - - 信念空间世界模型（FFM 核心）
        - 概率式环境表征；管理未知场景中的不确定性
        - 运营部署产生的真实世界训练数据
        - 分布偏移：训练语料未覆盖的新环境会让系统更保守，牺牲吞吐
      - - Dynamics Foundation Model（DFM）
        - 集成机器人运动学 / 动力学模型，用于跨平台执行
        - 机器人 URDF / 动力学模型；平台专属校准
        - 每种新机器人形态都需要适配 DFM；集成工作深度未公开
      - - Multiagent Foundation Model（MFM）
        - 机队级协调；共享环境推理
        - 机器人间通信（边缘 mesh 或本地网络）
        - 密集工业环境中的通信故障或带宽约束
      - - 边缘计算运行时
        - FFM 推理完全在机器人端运行，不需要云连接
        - 设备端加速硬件（推测为 NVIDIA Jetson 或同类）
        - 硬件采购与兼容性没有公开文档；功耗 / 散热限制会约束机器人平台选择
      - - NVIDIA Omniverse NuRec 管线
        - 将运营传感器数据转换为高保真 3D 数字孪生，供客户和 sim-to-real 使用
        - NVIDIA Omniverse 授权；Data Factory Blueprint 的 Azure 工具链
        - 依赖 NVIDIA 商业栈；存在 Omniverse 平台连续性和授权风险
      - - Isaac Sim / Isaac Lab 训练流水线
        - 在可用于仿真的重建环境中训练并验证策略
        - 重建数字孪生；NVIDIA Isaac 计算基础设施
        - 仿真到现实存在落差：机器人遇到仿真未覆盖的陌生现实特征时，行为会趋于保守
      - - 合成数据流水线（Cosmos + OSMO）
        - 用合成训练场景补充真实部署数据
        - NVIDIA Cosmos 开放世界模型；NVIDIA OSMO；Microsoft Azure
        - NVIDIA、Microsoft、FieldAI 三方依赖抬高集成复杂度，也加深供应商锁定
    notes: >
      架构层来自 FieldAI 官方产品页、NVIDIA 合作新闻稿，以及 FieldAI 的 NVIDIA Omniverse 博客。边缘计算硬件细节未公开；NVIDIA Jetson 是基于行业惯例和 NVIDIA
      合作背景的推断。依赖项只反映已记录的集成点；未披露组件可能仍然存在。
