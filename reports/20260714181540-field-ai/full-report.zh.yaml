      - number: '7.2'
        title: 运营、安全与安保风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 的核心价值主张——自主机器人在非结构化、安全关键环境中运行——同时也是最高的运营风险面。搭载 FFM 的机器人完全在端侧决策，不依赖
              GPS、地图或云连接。新环境中的一次模型推理错误（例如训练数据未覆盖的碎片构型、预授权机器人路径上突然出现行人），就可能在建筑、矿业或能源作业等高后果场景中造成身体伤害、财产损失或任务失败。2026
              International AI Safety Report 将“loss-of-control scenarios”和“inadequate real-world reliability
              testing”列为快速演进自主系统中最紧迫的两类风险，直接适用于 FieldAI 的产品域。2025 年一宗被广泛报道的 Unitree H1 机器人在人类工人附近故障事件，以及 SRES 在 CES 2026
              安全分析中提到“当机器人与人类共享开放工作空间时，现有工业安全协议往往不足”，说明更广泛同业群体——并非 FieldAI 本身——已经出现公开安全失败，这会塑造客户尽调要求、采购标准和潜在诉讼预期。

              截至 2026 年 5 月，未有公开报道称 FieldAI 驱动的机器人发生安全事故。但公司没有发布性能基准、安全验证测试报告或第三方安全认证（工业机器人 ISO 10218、工业网络安全 IEC
              62443，或数据处理 SOC 2），企业客户和投资人无法独立验证剩余风险水平。NIOSH Center for Occupational Robotics Research 和 OSHA
              都记录了工业环境中严重机器人相关工伤的基线；FieldAI
              部署在活跃建筑区和采矿作业中，恰恰进入了这些事故最常出现的场景。公司自己的部署叙事——三大洲数百个场地——意味着随着部署规模扩大，遇到首个不利事件的概率也会上升。

              网络安全方面：FieldAI 机器人会把机队数据上传到云分析平台，并与 NVIDIA Omniverse 和 Isaac 基础设施通信。未发现公开 DPA、安全白皮书、渗透测试报告或 SOC 2
              认证。若攻击者能够欺骗设备端传感器数据，或向机队管理平面注入命令，可能造成物理伤害。工业 IoT 和运营技术（OT）安全标准（IEC
              62443）尚未确认实施。如果安全事件早于正式认证发生，这些缺口会形成实质剩余暴露。
