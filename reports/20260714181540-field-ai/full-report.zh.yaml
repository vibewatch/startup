      - number: '7.5'
        title: 财务、估值与投资论证失效风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 的 $2B Series A 估值，是同阶段机器人 AI 公司历史最高，也为后续资本事件抬高了门槛。唯一独立收入信号是 OCBJ 2026 年 4 月匿名消息源提到的「已预订收入超过
              $100M」；按 $2B 估值折算，收入倍数约 20x，和企业 AI 软件最高倍数组相当，但一旦增长放缓、AI 板块情绪转向，或公开市场可比公司重估，就会暴露在倍数压缩下。GetLatka 2025 年 11
              月估算的 $140M ARR 未经审计，也未获公司确认。毛利率、NRR、CAC、账上现金和烧钱速度完全未披露，传统 SaaS 或深科技指标无法支撑估值承销。

              资本强度是隐藏风险：工业机器人部署需要现场集成、定制载荷安装和持续模型微调，都会带来交付成本，可能把毛利率显著压到纯软件水平以下。如果毛利率明显低于 60–70%，即便收入加速增长，$2B
              估值也很难支撑。第二个风险是烧钱集中：公司 130 多名员工，领导层来自高成本学术和科技机构，月度烧钱可能达到 $10–20M；按 $405M 融资计算，现金跑道约 2–4
              年。若市场或宏观条件在盈亏平衡前打断增长，公司可能被迫融资降价。

              投资论证失效触发点，落在会动摇核心投资假设的证据交叉处：（1）FieldAI 驱动的机器人发生重大安全事故，导致客户退出、监管行动或诉讼；（2）EU AI Act 执法阻断欧盟市场准入；（3）Boston
              Dynamics 合作终止，或 Hyundai 战略转向，移走主要商业案例；（4）Ali Agha 离职或发生声誉事件；（5）估值重置或降价轮，显示市场无法维持 $2B
              入场估值。任一触发点单独发生，都足以实质性改变风险调整后回报。
