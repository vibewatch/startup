  - id: TV005
    title: 推翻投资论点和止损触发器
    columns:
      - 触发器
      - 阈值 / 可衡量事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - Series B 轮下调估值
        - Series B 轮以低于 $2.0B 的估值完成
        - 直接违背私募投资人论点；意味着收入不及预期或赛道重估
        - 下调至 AVOID；立即退出或降低敞口
      - - 大客户流失或部署失败
        - 公开宣布客户退出，或安全事故导致部署暂停
        - 削弱「数百个站点、三大洲」的商业牵引叙事
        - 复核仓位；行动前判断事件是个案还是系统性问题
      - - 收入修正显著低于 $100M 预订收入
        - 公司披露或调查报道显示预订收入 < $50M，或预订额 ≠ ARR
        - 按真实 ARR 计算，估值倍数跳到 40x+；超出当前阶段的合理区间
        - 下调至 AVOID；若倍数压缩到 10–15x，估值将落在 $500M–750M
      - - 被超大云厂商替代
        - NVIDIA Cosmos、Google Intrinsic 或 Amazon AWS Robotics 宣布可比 FFM 服务
        - 授权费承压；平台风险兑现；护城河受到质疑
        - 重估防御性；按影响范围下调至 TRACK 或 AVOID
      - - 治理或法律风险事件
        - IP 纠纷、监管行动、关键人物离职（CEO 或 CSO），或 SEC 执法
        - 动摇团队和投资人信心；抬高执行风险
        - 重大风险事件 → 下调至 TRACK，待解决；严重事件 → AVOID
    notes: |
      这些触发器都设在可观察阈值上，便于在无法获取私有财务数据时持续监控。五项均会推翻投资论点；任何一项发生都会实质改变建议。下调估值轮是最可操作的公开信号。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 经审计 ARR 与收入确认政策
        - 没有经审计财务；估计区间为 $5M–$140M；「预订收入」≠ 已确认 ARR
        - 没有验证过的收入锚点，无法承销 $2B 估值；它决定适用 14x 还是 400x 倍数
        - 在 NDA 下索取经审计或审阅的 P&L 和 ARR 明细；可接受滚动 12 个月 ARR，但需附收入确认脚注
      - - 按收入流拆分的毛利率
        - 未披露；软件授权与硬件集成占比未知；综合毛利率无法验证
        - 软件级毛利率（70–80%）能支撑溢价；混合毛利率（55–65%）撑不起同一倍数
        - 索取按授权与服务拆分的贡献毛利瀑布图；对照公开 AI SaaS 基准
      - - 净收入留存与 cohort 数据
        - 未披露；公司称有「扩张合同」，但 NRR 未验证
        - 要支撑先落地再扩张的 SaaS 倍数，NRR 需 >120%；若 <100%，将触发熊案
        - 索取按产品线划分的季度 cohort 留存；确认 2024–2026 cohort 的 ACV 轨迹
      - - 股权结构、清算优先权和期权池
        - 未披露；优先权负担和反稀释保护未知
        - Series A/A1 的重清算优先权可能在基准情形下把普通股价值压到接近零
        - 向 Series A 领投方律师索取股权结构摘要和瀑布分析；确认优先权结构
      - - 董事会构成与治理文件
        - 未公开披露；独立董事成员未知
        - 治理质量是机构投资人的关键尽调维度；治理弱 = 代理风险更高
        - 索取董事会材料、观察员权利协议和投资人权利协议；确认审计委员会状态
      - - 客户集中度与合同条款
        - 客户名称未披露；前 5 大客户收入集中度未知；合同期限 / 续约条款未知
        - 若集中度高（前 3 大客户 >50% 收入），流失风险画像会实质改变
        - 在 NDA 下索取脱敏客户明细；确认单一客户收入上限；审阅合同续约条款
    notes: >
      六项要求都是投资前标准尽调问题。对这个阶段的私营公司而言都不异常；若要用任何基本面锚点承销 $2B 估值，这些证据都必须拿到。前三项（ARR、GM、NRR）是从 TRACK 上调至 BUY
      的最低门槛；后三项（股权结构、治理、客户集中度）则是任何投委会批准前的必备材料。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
