        - 跟踪 MSHA 执法动作，并映射 FieldAI 目标客户的 MSHA 合规状态
      - - 自主化成熟（FFM、VLA 模型、边缘 AI）
        - 驱动
        - 正向
        - 2026–2028 拐点
        - FieldAI 物理优先的 FFM 目前有差异化；竞争对手的 VLA 模型到 2028 年可能缩小差距
        - 在真实非结构化部署中，对标 FFM 与竞品基础模型的任务表现
      - - 硬件商品化（Boston Dynamics Spot 价格、人形机器人）
        - 驱动
        - 正向
        - 2026–2030 趋势
        - 机器人硬件商品化后，软件智能层吃到更多利润
        - 监测 Spot 定价趋势，以及 FieldAI 与 OEM 伙伴的版税 / 分成模式
      - - 资本开支周期与 ROI 验证要求
        - 约束
        - 负向
        - 持续
        - 企业采购委员会在规模化前需要多年 ROI 证明，拖慢收入确认
        - FieldAI 已将多少试点转成多年企业合同？平均销售周期多长？
      - - 集成复杂度与遗留 OT/IT 系统
        - 约束
        - 负向
        - 持续
        - 运营方使用彼此不兼容的遗留数据格式（BIM、ERP、historian）；集成开销推高部署成本
        - 评估 FieldAI 与主流 BIM（Autodesk BIM 360）、ERP 和 OSIsoft PI 系统的集成深度
      - - “试点炼狱”（BuiltWorlds：尽管 95%+ 评价正面，活跃机器人使用率仍从 65% 降至 46%）
        - 约束
        - 负向
