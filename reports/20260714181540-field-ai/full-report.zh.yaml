      - number: '5.2'
        title: 架构与技术设计
        blocks:
          - type: paragraph
            body: >
              FFM 平台由三层模型组件组织。核心 FFM 使用视觉、LiDAR、文本、音频等多模态传感器流，负责感知、世界建模和决策。Dynamics Foundation
              Model（DFM）是子模型，整合机器人的内在运动学和动力学属性，使同一个认知层能够驱动机械结构不同的机器人身体。Multiagent Foundation
              Model（MFM）是协同层，允许机队中的多台机器人共享环境表征，并在场地尺度上集体推理——把机器人集群变成分布式自主系统，而不是一组孤立工具。

              架构上，FieldAI 运行在“信念空间”：系统持续跟踪环境状态的概率分布，而不是假定信息完美。这一设计脉络可追溯到 CEO Ali Agha 关于 FIRM（Feedback-based Information
              RoadMap）信念空间规划的学术工作，也包括赢得 DARPA SubT 挑战赛 Phase II 的 NeBula 系统。概率式方法意味着机器人可在无 GPS、低能见度、传感器退化的条件下工作。当 FFM
              遇到陌生条件时，会明确降速或选择更保守路径——这是公司承认的吞吐成本，但被视为安全特性。真实世界数据飞轮意味着每次部署都会随着时间改善模型性能，并形成复利式数据优势。

              NVIDIA 集成加深了工程栈。FieldAI 使用 NVIDIA Omniverse NuRec，将机器人正常作业顺带采集的传感器数据重建为高保真 3D 数字孪生。这些数字孪生会加载到 NVIDIA Isaac
              Sim 和 Isaac Lab，用于机器人策略训练与验证；FieldAI 还通过 Microsoft Azure 采用 NVIDIA Physical AI Data Factory Blueprint，使用
              NVIDIA Cosmos 开放世界基础模型和 NVIDIA OSMO 自动化合成数据流水线。公司的 GitHub 组织（field-ai）维护着多个机器人基础设施库的活跃 fork——Spot
              SDK、rosbridge_suite、spconv、unitree_sdk2——最近提交时间到 2026 年 4 月，为平台集成面提供了开发者侧证据；但公司未公开任何专有模型权重或 SDK 文档。私有
              Squarespace 发布说明页面进一步限制了外部对已交付能力的审计。
