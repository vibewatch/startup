      - number: '8.5'
        title: 建议、否决触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              建议为 TRACK（中等信心、高风险、估值偏紧）。投资论证在结构上成立：具身 AI
              软件采用物理优先架构，部署已经在野外跑通；创始人与市场高度匹配；投资人组合也几乎是最强配置。但外部投资人如果拿不到经审计财务、已验证 ARR 和披露毛利率，就无法承销 $2B
              价格——主导风险是信息不对称，不是技术或团队质量。按当前 $2B 标记，入场价格已经按收入区间高端的执行兑现定价；任何收入下修或全行业倍数压缩都会造成实质性稀释。


              若满足三个条件，建议可上调至 BUY：（1）披露经审计或独立验证的 ARR ≥$100M，且年同比增长 ≥40%；（2）确认混合毛利率 ≥60%；（3）通过队列数据证明净收入留存 ≥110%。若不满足，TRACK
              仍合适：继续观察公司披露的财务里程碑、Series B 公告和隐含估值抬升、战略合作收入披露，以及客户集中度风险信号。若出现以下情况，建议下调至 AVOID：（1）Series B 公告估值低于
              $2B（降价轮）；（2）重大客户流失或部署失败公开；或（3）已报告的 >$100M 已预订收入被大幅下修。


              治理是明显缺口：董事会构成未披露，清算优先权和期权池规模未知，也没有独立财务报告。任何潜在投资人都必须在承诺前完成这些尽调。公司把自己定位为工业机器人的「软件大脑」层，确实差异化且短期内难以复制；但治理不透明叠加估值偏高，要求投资人保持纪律性的
              TRACK 姿态，直到商业验证点可以被公开核验。
