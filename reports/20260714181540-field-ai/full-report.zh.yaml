      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >
              FieldAI 的财务图景是一家资本充足、收入早期但增长很快的软件公司：24 个月内吸引 $405M 融资，但对外部承销仍过于不透明。$2B
              估值完全由投资人信号、增长轨迹和团队履历托住，而不是由已验证的财务基本面支撑。若 $140M ARR 估计准确，且同比增长 50–100%，这一估值落在品类开创型 AI 软件公司的合理区间；若 ARR
              明显更低或增长更慢，倍数就难以自圆其说。前瞻资本充足性看起来稳健：$405M 融资对应纯软件运营模型（无硬件制造 capex、无库存融资），再加上披露的 >$100M bookings，意味着下一轮融资前至少有
              2–3 年运营 runway。最大尽调风险不是偿付能力，而是信息不对称——公开可验证信息与承销估值所需信息之间的缺口，对一家 $2B 公司而言异常大。
            claimRefs:
              - CI030
              - CI031
              - CI032
      - number: '4.6'
        title: 附录
        blocks:
          - type: callout
            title: 纯软件模式限制资本强度
            body: >
              FieldAI 的硬件无关、纯软件收入模式意味着公司不承担机器人库存、制造 capex 或供应链营运资本风险。不同于纵向一体化机器人公司（Figure AI、Agility Robotics），FieldAI
              的成本基数主要由工程人才和现场支持构成；随着部署足迹扩大，这两项成本相对收入呈次线性扩张。这一结构优势支撑了公司相对于融资额具备高毛利和资本效率的判断。
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI015
          - type: callout
            title: 估值承载显著财务不透明溢价
            body: >
              $2B 投后估值建立在 $405M 融资、顶级投资人信号和匿名第三方收入估计之上，而不是建立在已验证的财务基本面之上。没有经审计 ARR、毛利率披露、客户数量或 SEC Form D
              文件，外部投资人若没有非公开尽调权限，就无法承销该估值。UpsideList 的二级市场模型按当前隐含价格估计上行空间为
              -2%，反映出私募二级市场对财务不透明给出的信息折价。收入估计区间很宽（$50M–$140M ARR，跨度 2.8 倍），分析平台数据点也互相冲突，进一步说明估值几乎完全由前瞻叙事托住，而非由历史基本面托住。
            calloutType: risk
            claimRefs:
              - CI022
              - CI023
              - CI024
              - CI025
              - CI028
              - CI029
          - type: callout
            title: 承销前的核心尽调清单
            body: >
              若要承销 $2B 估值，最低可行尽调包需要包括：（1）截至最近一个季度、经审计或管理层认证的 ARR，并按许可和服务拆分；（2）按收入流拆分的毛利率；（3）滚动 12 个月现金 burn
              和资产负债表；（4）客户数量及前 5 大收入集中度；（5）2024 和 2025 队列的队列级 NRR；（6）按行业垂直划分的 ACV
              四分位数。没有这些信息，当前估值下的任何投资论证都只是基于团队和市场的知情下注，而不是财务驱动的承销。
