  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 在安全关键工业环境中部署会自主做出物理决策的 AI 系统。这使公司正好落入多个持续演进的 2026 年 AI 监管框架范围。根据 EU AI Act，用作工业场景安全组件的机器人 AI
              系统被归为高风险，需要风险管理系统、技术文档、人类监督设计、CE marking 和上市后监测。Baker Botts 指出，Annex III 高风险系统原定 2026 年 8 月 2 日截止日期，可能因
              European Commission Digital Omnibus 提案延后至协调标准发布后六个月（最终兜底日期为 2027 年 12 月）；但延期取决于 2026 年 8
              月前是否通过，因此公司必须按现有期限并行准备合规。Colorado AI Act（SB 24-205）将于 2026 年 6 月 30 日生效，是美国首部针对高风险 AI
              系统的综合州法，要求影响评估、消费者披露，以及采取合理注意防止算法歧视。California SB 53 于 2026 年 1 月生效，要求大型前沿 AI 模型开发者（训练算力 >10²⁶
              FLOPS）发布风险框架，并在 15 天内报告关键安全事件；FieldAI 的训练算力是否跨过该阈值尚未披露。联邦方向仍未稳定：Trump administration 2025 年 12
              月行政令表达了预先排除州级 AI 法的意图，但今天尚未实际排除，合规负担仍呈碎片化。

              产品责任方面，法院正在围绕 AI 部署形成产品责任框架。KL Gates（2026 年 3 月）记录了越来越多的诉状，将已部署 AI
              系统视为“产品”，适用设计缺陷、未警示和可预见误用等理论。欧盟修订版产品责任指令将严格责任沿供应链延伸到上游 AI 组件提供商；即使部署客户或机器人 OEM 拥有终端产品关系，FieldAI
              也会被纳入。Garcia v. Character Technologies 树立了一个先例：在起诉状阶段，面向消费者的 AI 可被视作严格责任下的产品。对工业机器人 AI
              而言，物理伤害因果链（挤压、撞击、意外运动）会比消费者聊天机器人案件更直接。

              未发现涉及 FieldAI 的公开执法行动、监管调查、诉讼或 IP 争议。国防子公司 FieldAI Federal 若其自主系统进入军民两用技术，将受 ITAR/EAR
              出口管制约束；未发现公开披露的出口授权。IP 保护主要依靠商业秘密和论文发布速度，而不是已授权专利：USPTO 专利申请检索找到一件已提交专利申请（US 2025/0252306），但截至 2026 年 5
              月没有已授权专利；若人员离职，核心 FFM 技术可能面临被模仿的风险。
