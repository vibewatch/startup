      - number: '7.4'
        title: 人员、人才与执行风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 创始团队的行业可信度很强——Ali Agha 领导过赢得 DARPA SubT 的 CoSTAR 团队，也曾在 NASA JPL
              担任首席研究员，这正是投资人和客户信心的核心来源。但风险也集中在一个人身上：Agha 同时是公司的公开门面、首席技术意见领袖，也是最醒目的商业关系负责人。外界尚未看到与他公众分量相当的
              COO、工程负责人或并行商业领导者。David Fan（CTO）和 Shayegan Omidshafiei（CSO/总裁）提供了一定管理纵深，但公众能见度远低于 Agha。Agha
              若非自愿离职、长期无法履职，或卷入声誉事件，募资、企业客户信心和合作伙伴关系都可能同时受冲击。

              创始人之外，FieldAI 还面临高速扩张带来的用人风险，而它所在的技术劳动力市场竞争最激烈。公司据报从 2023 年创立扩至 2025 年 8 月的 130
              多人，折算年化增速很高，企业文化维护、工程协同和产品交付纪律都难以持续守住。FieldAI 要和 Google Intrinsic（现已并入 Google AI）、Physical
              Intelligence（融资超过 $700M）、Amazon Robotics、Tesla Optimus 抢机器人 AI 工程师；这些公司盯着同一小群能规模化做具身 AI
              的博士和资深工程师。尚未发现融资后关键技术人员离职的公开证据，但没有公开证据并不等于团队稳定。

              执行风险也体现在商业端。FieldAI 到 2025 年 8 月才走出隐身模式，可验证的企业销售能力还不到一年。公司尚未公布客户名称、带有验证结果的部署案例或留存指标。从 NASA JPL、DARPA
              传承的研究团队，转型为要对收入负责的企业软件供应商，是组织上的关键拐点；许多深科技衍生公司都没能足够快地跨过去，最终支撑不了估值曲线。
