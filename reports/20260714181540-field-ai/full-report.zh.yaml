      - number: '8.2'
        title: 投资论证与反论证
        blocks:
          - type: paragraph
            body: >
              FieldAI 的投资论证建立在五个相互咬合的支柱上。第一，工业机器人硬件商品化后，具身 AI
              软件层在结构上更容易捕获企业价值：一个不绑定硬件的软件大脑，叠加跨多样化部署的联邦学习网络效应，天然具备垄断吸引力。第二，创始团队——Ali Agha（NASA JPL / DARPA SubT
              获胜者）、Shayegan Omidshafiei（DeepMind / MIT）和 David Fan（DARPA RACER /
              JPL）——有可信的先验验证：这一路线能在野外条件跑通，而不只是仿真里有效。第三，投资人组合（Bezos Expeditions、Khosla
              Ventures、NVentures/NVIDIA、Temasek、Intel Capital、Gates Frontier）可说是围绕一家机器人 AI
              公司集结的最高确信度战略与财务投资人组合；他们做过外部无法获得的私下尽调。第四，公司走出隐身模式时，生产部署已在三大洲数百个场站上线，并在公告后九个月内报告 >$100M
              已预订收入——商业牵引速度快过任何可比具身 AI 软件公司。第五，建筑、能源、采矿、物流和国防的 TAM 很大，渗透率仍低。


              反论证逐一挑战这些支柱。如果机器人 OEM 纵向整合自有 AI 软件（Boston Dynamics、Figure AI、Agility
              Robotics），或超大规模云厂商（Google/Intrinsic、NVIDIA Cosmos）把基础模型层商品化，硬件无关优势可能被削弱。收入数字仍未经验证：$100M
              已预订收入来自匿名消息源，「booked」可能包含销售管线或未承诺订单；$140M ARR 估算来自第三方分析平台，方法未披露；另一个估算把收入压到 $5M，差异达 28
              倍。外部投资人看到的治理和财务透明度几乎为零：没有经审计财务、没有运营实体 Form D、没有披露毛利率、CAC 或 NRR。$2B 估值已经计入大量执行兑现：即便按 $140M ARR，14x
              收入倍数也需要高毛利、高留存和持续高速增长，才足以支撑二级入场。资深投资人 Howard Morgan（First Round Capital / B
              Capital）公开警告，「高买、更高卖只在泡沫里有效」；Seattle 地区 VC 在 2025 年 12 月 GeekWire 圆桌上也观察到，种子轮和 Series A
              私募市场估值已远远跑在基本面前面。2026–2027 年环境下，Series B+ AI 软件倍数压缩是真实风险。
            claimRefs:
