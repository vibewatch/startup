      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              结构性增长驱动持续数十年，且证据充分。最直接的是劳动力短缺：美国西部超过 50% 的采矿劳动力预计到 2029 年退休，全球建筑业也长期缺熟练工。US Mine Safety and Health
              Administration（MSHA）在 2024 财年记录了 31 起采矿死亡事故，致死伤害率为每 200,000 工时 0.0110；高危任务转向自主替代方案的监管压力仍在。IFR 的 World
              Robotics 2025 数据显示，到 2028 年全球工业机器人年安装量将保持在 500,000 台以上；当硬件规格趋同，软件定义自治会越来越成为差异化因素。Deloitte 的 2026 TMT
              Prediction 确认，有别于消费级 LLM 的专用 AI 基础模型，可能是 2026–2030 年间推动机器人从命令 - 控制转向真正泛化自治的技术突破。

              采用约束同样实质。McKinsey 的 Industrial Robotics Survey 显示，71% 的工业公司把硬件资本成本列为机器人采用的主要障碍，61%
              则提到缺乏内部经验；装配、表面处理、焊接等复杂活动在中短期内也不太可能自动化。Deloitte 观察到，工业机器人年销量自 2021 年以来基本持平在约 500,000
              台，并警告如果数据质量、集成复杂度和网络安全瓶颈不解决，市场很可能保持相对温和的年增长。最关键的是，BuiltWorlds 的 2025 Equipment and Robotics Benchmarking
              报告——Construction Dive 在 FieldAI 融资报道中引用——发现报告活跃使用机器人的建筑公司比例从 2024 年的 65% 降至 2025 年的 46%，即便正面评价从 74% 跳升至
              95%。热情与部署之间的背离，是近期市场的核心张力，也是 FieldAI 最直接的执行风险：把强试点表现转化为持久企业收入。高 capex 周期、与存量工厂系统的 OT/IT
              集成摩擦、较长回本期要求，以及油气运营商所处资本环境波动，都是进一步的结构性逆风。既有市场规模与已部署产品之间的差距真实且重大。
