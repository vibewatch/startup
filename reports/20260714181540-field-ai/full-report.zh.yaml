      - number: '1.3'
        title: 融资历史与投资人构成
        blocks:
          - type: paragraph
            body: >
              FieldAI 从 2023 年创立到 2025 年 8 月 20 日一直保持隐身；当天公司同时披露连续两轮融资合计 $405M，并宣布估值达到 $2B——较前一轮确定的 $500M 估值翻了四倍。最近一轮融资
              $314M，并且获得超额认购；共同投资方包括 Bezos Expeditions（Jeff Bezos 家族办公室）、Prysm Capital 和 Temasek。两轮融资中的其他投资方包括 BHP
              Ventures、Canaan Partners、Emerson Collective、Intel Capital、Khosla Ventures、NVentures（NVIDIA 的风险投资部门）等。Gates
              Frontier（Bill Gates 的投资机构）和 Samsung 被列为“过往投资人”，说明它们参与了前一轮、也就是确定 $500M 估值的那轮。按披露总额倒推，第一轮约融资
              $91M。注意：部分尽调前资料把拆分写成 $150M（种子轮）加 $255M（Series A）；该拆分与 Reuters 关于最新一轮 $314M
              的报道不一致，也无法从一手来源确认。超额认购与投资人阵容——覆盖科技风投领袖（Khosla、NVentures、Intel Capital）、主权财富和机构资金（Temasek、BHP）、慈善资本（Gates
              Frontier、Emerson Collective），以及全球最富有个人的家族办公室（Bezos Expeditions）——反映出异常广泛的投资人信念。Vinod Khosla 表示：“FieldAI
              站在通用机器人革命的前沿，它快速部署的能力将释放长期经济和社会价值。”Intel Capital 的公开背书正式确认了与 Intel
              硬件栈的平台集成和战略关系。本轮资金将用于全球扩张、产品开发（移动、操作）以及员工扩张，目标是在 2025 年底前把团队规模翻倍。
