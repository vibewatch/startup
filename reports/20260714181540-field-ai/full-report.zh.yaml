      - number: '4.2'
        title: 资本充足性与后续资金续航
        blocks:
          - type: paragraph
            body: >
              FieldAI 的两轮融资历史已在公司概览章节展开。看资本充足性，关键输入是：截至 2025 年 8 月，公司累计募资 $405M；第二轮融资（$314M）在 2025 年 8 月超额认购完成，由 Bezos
              Expeditions、Prysm Capital 和 Temasek 共同领投，Khosla Ventures、NVentures（NVIDIA）、Intel Capital、Canaan
              Partners、BHP Ventures 和 Emerson Collective 参投。第一轮融资（约 $91M）在 2024 年完成，估值 $500M；Gates Frontier 和 Samsung
              被列为上一轮投资方。


              公司未披露账上现金，也未披露月度烧钱速度。人员规模从 2024 年末约 30 人增至 2025 年 8 月公告时约 130 人，并明确计划到 2025 年末翻倍至约 260 人，说明固定成本基数正在快速拉升。若按
              200–260 名员工、单人全包成本 $250K–$350K（与 Irvine, CA 及分布式工程团队匹配）估算，仅年化薪酬开支就达 $50–90M/年，对应月度人工 run-rate 约
              $4–8M。再叠加全球部署费用、云基础设施、硬件载荷成本和 G&A，总月度 burn 估计为 $5–10M。低端情形下，从成立算起，累计募资 $405M、月 burn $5M 对应约 81 个月的毛
              runway；若月 burn $10M，则约 40 个月。扣除假设的 $100M+ 累计收入抵消后，自 2025 年 8 月交割起的净 runway 估计为 24–48
              个月；若收入不加速、成本不意外上行，下一轮融资触发点落在 2027 年末至 2029 年初。


              FieldAI 尚未宣布任何债务融资、项目融资义务、收入分成融资或授信额度。公司资本结构看起来是纯股权。与纵向一体化机器人公司不同，FieldAI 不做硬件制造，这显著降低了相对于同业的营运资本和库存融资需求。
