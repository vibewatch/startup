      - number: '7.3'
        title: 伙伴与技术依赖风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 的 GTM 策略和技术栈集中在少数高价值伙伴和供应商上。2026 年 3 月 Boston Dynamics 合作是最可见的商业依赖：公司面向建筑的自主故事建立在 Spot 四足硬件之上，Marc
              Raibert 公开背书并提到 DARPA SubT 历史，把品牌和市场可信度都绑定到这段关系上。Boston Dynamics 由 Hyundai Motor Group 持有，而 Hyundai 又在
              2026 年 2 月单独投资了 FieldAI——如果 Hyundai 决定为 Boston Dynamics 硬件投资竞争性的专有自主软件，或在 Hyundai
              层面战略重组中调整合作，就可能出现错位。合作条款（排他条款、收入分成、最低承诺、终止权）未公开披露，无法评估合同保护。

              NVIDIA 是更深、更广的依赖。NVentures（NVIDIA 的企业风投部门）是财务投资人，FieldAI 使用 NVIDIA Omniverse NuRec 做 3D 重建，用 Isaac Sim /
              Isaac Lab 做仿真训练，用 NVIDIA Cosmos 生成合成数据，并用 OSMO 自动化流水线。这形成了多层战略和商业锁定。投资人关系降低了突发供应中断的概率，但 NVIDIA
              自身优先级（hyperscaler 分配、数据中心 GPU 供应瓶颈、竞争动态）可能压缩 FieldAI 的算力访问，或推高训练成本。VerticalData 报告称，高带宽内存（HBM）瓶颈在 2026
              年仍然存在，最新型号的数据中心 GPU 交期延长至 9–12 个月；没有多年云承诺的小型 AI 公司暴露最大。

              在 NVIDIA 和 Boston Dynamics 之外，Certis Group 安保合作（2026 年 2 月）增加了第三个集成依赖。Certis 使用其 Mozart 平台进行机队指挥控制，FieldAI
              的 FFM 必须与这套专有基础设施互通。伙伴多元化是 FieldAI 硬件无关叙事中的明确组成部分——公司声称 FFM 兼容四足、人形、轮式机器人和 AV——但截至 2026 年 5
              月，已具名商业合作深度集中在两个伙伴上：Boston Dynamics 面向建筑，Certis 面向安保；收入和声誉暴露也随之集中。
