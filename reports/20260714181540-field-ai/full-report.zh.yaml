        - 正面评价没有转化为活跃部署；全行业试点后流失风险高
        - 要求 FieldAI 提供试点转企业合同转化率和流失数据；这是最关键的商业指标
      - - 地缘政治扰动与大宗商品价格波动
        - 约束
        - 负向
        - 事件性
