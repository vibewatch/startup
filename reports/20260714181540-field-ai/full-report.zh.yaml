chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              FieldAI 是一家位于 California Irvine 的机器人 AI 软件公司，2023 年由 NASA Jet Propulsion Laboratory（JPL）老将 Ali Agha
              创立。公司的核心判断很清楚：工业机器人采用的卡点不在硬件，而在智能——机器人缺少能在非结构化真实环境中稳定运行的自适应、风险感知自治能力。FieldAI 的解法是构建 Field Foundation
              Models（FFMs），这是一类“物理优先”的基础模型，训练数据来自物理部署中的传感器数据，而不是互联网文本或图像。FFMs
              充当通用软件大脑，可装到多种机器人平台上——四足机器人、人形机器人、轮式漫游车、履带车、乘用级自动驾驶车辆——不需要按平台重新编程，也不需要预建图环境、GPS 或云连接。机器人完全在端侧实时决策。FieldAI
              面向建筑、能源、采矿、制造、物流、城市配送、巡检和国防领域的企业工业客户销售平台。公司明确不制造机器人；它是纯 AI 软件供应商，与机器人 OEM
              合作，把软件部署到客户自有或第三方机器人硬件上。这种硬件无关模式把 FieldAI 放在机器人技术栈的“大脑层”，类似企业计算里抽象硬件的 OS 或中间件层。Bill Gates
              对公司描述得很直接：FieldAI“为其他公司的机器人开发 AI 软件，让机器人能够感知环境、在没有 GPS 的情况下导航，甚至彼此通信”。主要收入渠道是 B2B
              软件授权和硬件集成服务；订阅价格据称从数万美元到每年 $500,000 不等，取决于部署规模。截至 2026 年 4 月，知情人士称公司已拥有超过 $100M 的已签约收入，并与大型工业客户建立了合作。
