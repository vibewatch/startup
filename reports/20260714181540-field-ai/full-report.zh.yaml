      - number: '5.5'
        title: 路线图、成熟度与开发者生态
        blocks:
          - type: paragraph
            body: >
              FieldAI 在巡检和数据采集上的产品成熟度最高：公司已有付费客户，并在数百个场地记录了生产部署。分析师报道和投资人材料中提出的三阶段路线图是：（1）近期至 2026
              年——自主巡检、监控和数据采集，已商业化；（2）中期 2026–2028 年——干预和操作，从感知扩展到物理动作；（3）长期 2028+——跨所有平台的通用自主，包括人形机器人。这一路线图与 FieldAI 对
              $405M 融资用途的表述一致：资金将用于机动能力和操作能力的开发。

              CMU Robotics Innovation Center 入驻安排（2026 年 2 月宣布，Hazelwood Green 2,500 sq ft）正式化了公司的学术研究合作，让 FieldAI 可使用
              1.5 英亩户外测试场和专门机器人实验室。FieldAI 赞助 CMU 的 AirLab 和 LeCAR lab 研究，并支持 VectorRobotics 学生团队的人形
              loco-manipulation，显示公司正在投入中长期路线图上的能力缺口。Field AI Research Institute（FAIRI）发表同行评审研究；NeBula DARPA SubT 论文，以及
              2024 年关于风险感知 AI 和 MPPI 控制的论文，为公司提供学术可信度。

              开发者生态入口有限。FieldAI 的 GitHub 组织（field-ai）托管 10+ 个标准机器人库 fork，但没有发布任何专有 FFM 代码、模型权重或 SDK。未发现公开开发者门户、API
              文档或社区论坛（Discord、Slack、Stack Overflow tag）。发布说明页面是私有 Squarespace 站点。这把开发者信号面限制在可观察的 GitHub
              仓库活动，而非真正的从业者社区。与 NVIDIA 和 CMU 的合作为工程可信度提供了间接代理，但从公开来源还无法独立技术评估 FFM 能力。
