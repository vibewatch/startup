      - number: '4.3'
        title: 单位经济模型与成本结构
        blocks:
          - type: paragraph
            body: >
              FieldAI 基本没有披露单位经济模型。公司未发布经审计财务报表，也未披露毛利率、客户获取成本（CAC）、净收入留存（NRR）、年度合同价值（ACV）或回本周期。以下分析基于可比 B2B 工业 AI
              软件公司，以及 FieldAI 收入模式中可观察到的结构。


              按典型企业 AI 软件基准估算，软件许可部分的毛利率约为
              55–80%。硬件集成服务涉及实体传感器-计算载荷部署和现场支持，利润率可能较低（20–45%），会把混合毛利率拉到纯软件可比公司之下。规模化之后，软件许可收入应成为主导，并改善混合毛利。端侧架构不依赖云端推理，相比重云端的
              AI 平台，每次部署的持续可变成本更低，这是有利的结构特征。


              企业工业机器人销售效率天然承压：销售周期通常为 12–24 个月，需要现场演示和集成测试，还牵涉多方采购。CEO Agha 提到合同价值为数百万美元，说明单笔规模或可在中等流失率下支撑 1–3 年 CAC
              回本——但没有披露 CAC 和 NRR 数据，无法验证。若 $140M ARR 估计和 150 人员工数准确，则人均收入约 $900K–$1M，对这一阶段的企业软件公司而言很强。FieldAI 的 GTM
              路径聚焦直销企业、硬件伙伴关系（Boston Dynamics、OEM）和地域扩张伙伴（Certis Group、亚洲）；这也说明如果只靠纯直营，可服务市场天花板会被压低。
            claimRefs:
