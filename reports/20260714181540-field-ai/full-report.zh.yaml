  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买方 / 用户 / 付款方逻辑
        blocks:
          - type: paragraph
            body: >
              FieldAI 向企业级工业组织销售具身 AI 软件和传感器-计算载荷，覆盖六个已具名垂直：建筑、能源 / 油气、矿业、制造、城市配送与巡检，以及联邦 /
              国防。公司不制造机器人；产品是自主软件和载荷，用来改造买方已经拥有的硬件，或买方从 Boston Dynamics 等 OEM
              伙伴采购的硬件。这种干净的软件许可模型意味着付款方始终是工业企业，买方通常是技术负责人、运营 VP 或创新总监，日常用户则是现场主管、安全经理或运营负责人，由他们部署和监控机器人。

              据报道，订阅价格随部署规模不同，从数万美元到每年 $500,000 不等，首次部署还会叠加硬件集成服务。建筑垂直是 FieldAI 商业成熟度最高的板块——截至 2026
              年中，它拥有唯一公开具名的客户案例（Big-D Construction、DPR Construction），也拥有唯一确认的多年生产部署。能源 /
              油气和工业制造由专门产品页覆盖，内容包括设备异常检测、仪表和热成像监控、数字孪生创建，但公司未公开披露这些板块中的具名企业客户。安保运营通过 2026 年 2 月宣布的 Certis Group
              战略合作进入可服务市场；联邦 / 国防是单独品牌化的板块（FieldAI Federal），前文已提到 Detroit Defense 合作。

              买方 / 用户分离带来重要销售动态：采购决策中的 champion 往往是技术或创新总监，但生产采用取决于每天使用系统的现场主管和安全经理是否买账。在
              Big-D，现场主管的自发需求强化了自上而下的投资决策——这是黏性的正面信号——但也意味着单个项目团队的抵触可能拖慢场地级扩张。
