  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >
              FieldAI 最近一次披露的估值是投后 $2.0B；公司在 2025 年 8 月宣布连续两轮共融资 $405M 时确立了这一估值。最近一轮融资 $314M，获得超额认购，由 Bezos
              Expeditions、Prysm Capital 和 Temasek 共同领投；前一轮约融资 $91M，估值约 $500M。因此，公司约 12 个月内把估值推高了 4 倍。GeekWire 和 Reuters
              消息源把两轮描述为「Series A and A1」。部分预尽调资料称拆分为 $150M（种子轮）加 $255M（Series A），但这与 Reuters 报道的最新一轮 $314M
              不一致，也无法从一手来源确认；本章采用兄弟章节中的标准口径。


              PremierAlts（2026 年 5 月访问）显示，公司五轮合计融资 $506.1M，最近一轮为 2026 年 2 月完成的 $315M，估值同为 $2.0B——这可能反映公告后二级市场 SPV
              活动，或一轮新的一级融资。SEC 的 Form D 文件确认，投资工具「HII Field AI Series I, II, and III, a Series of HII Field AI, LLC」在
              2025 年 11 月和 2026 年 4 月提交备案（CIK 0002095306、0002095305、0002126354），符合特殊目的集合投资基金常见结构，用于聚合高知名度私人公司的二级交易和 LP
              权益。加州主体「Field Ai, Inc.」名下没有直接提交 Form D，说明公司可能依赖豁免，或使用了不同法律实体结构。


              二级市场交易活跃：FieldAI 股份在 Nasdaq Private Market 和 Notice.co 交易（截至 2026 年 5 月约 $34.32/股），UpsideList
              也收录公司但上行信号有限，说明二级定价接近或位于 $2B 标题估值附近。PitchBook（2025 年 6 月归档）显示公司 47 名员工，交易类型为「Early Stage VC」，这反映 PitchBook
              私营公司覆盖常见的数据滞后。公司自身披露的 LinkedIn 员工数 201–500，以及 2026 年 4 月已预订收入 >$100M，说明自 PitchBook 截图以来公司已显著增长。
