            title: 纯软件模式带来非对称扩张潜力
            body: >-
              FieldAI 拒绝造硬件，因此避开了机器人制造的资本密集度，并可把每一家机器人 OEM 同时视作分销伙伴和可触达客户。硬件无关路线意味着每一个新机器人平台（人形、轮式、空中）都是扩张机会，而不是产品转向。这就是
