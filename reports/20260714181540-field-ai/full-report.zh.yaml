        - 暂停新增部署扩张；开展根因分析；恢复前取得独立安全审计；监测客户撤出公告
      - - 欧盟 AI 法案执法行动
        - 欧盟市场监管机构公告、FieldAI 新闻稿、新闻报道、客户采购因合规冻结
        - 欧盟市场监管机构正式调查、不合规认定，或客户因 AI 法案合规冻结采购
        - 立即尽调欧盟合规计划；评估市场准入风险；认证完成前考虑暂停欧盟部署
      - - Boston Dynamics 合作终止或 Hyundai 战略转向
        - 公开合作公告、Hyundai Motor Group 战略披露、FieldAI OEM 合作伙伴更新
        - 任一方公开声明终止合作，或 Hyundai 宣布为 Boston Dynamics 硬件推出自有自主栈
        - 在没有 Spot 集成的情况下重新评估建筑垂直商业案例；评估 OEM 多元化时间表；重校收入预测
      - - Ali Agha 离职或声誉事件
        - LinkedIn、媒体报道、公司公告、投资人沟通
        - 确认离开 CEO / 创始人角色、长期病假，或公开声誉争议
        - 紧急评估管理层继任计划；开展投资人沟通；考虑陈述与保证保险触发项
      - - 融资估值重置或估值下调轮
        - 未来融资公告、二级市场数据（Nasdaq Private Market、PremierAlts）、投资人沟通
        - 任何已公告融资轮估值显著低于 $2B，或二级市场价格显示较上一轮价格折价 30%+
        - 重估终局估值上行空间；审查优先权结构和清算优先权；评估相对原始入场假设的稀释敞口
      - - 商业化停滞（收入增长低于阈值）
        - OCBJ、Sacra、GetLatka 收入报告、客户数披露、招聘放缓信号
        - 公开或可靠第三方迹象显示 ARR 同比增长低于 80%，或 2027 年前已签约收入停滞在 $150M 以下
        - 在下一次资本部署决定前，深挖销售生产率指标、客户留存和管线质量
    notes: 阈值是分析师定义、用于提高尽调强度的触发点，不是合同或法律约束标准。鉴于 FieldAI 是私营公司且披露有限，监测主要依赖公开信息。
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 评估
      - 依据
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 投资主线强，但估值不透明和收入未验证形成抵消
        - 跟踪商业证明点；无审计财务前，不按当前价格承诺投资
      - - 置信度
        - 中
        - 投资人阵容顶尖；收入区间跨度 28x；治理未披露
        - 若有 2 年以上经审计 ARR 数据并披露 NRR，置信度可升至高
      - - 风险评级
        - 高
        - 收入未验证；若行业倍数压缩或收入不及预期，存在估值下调轮风险
        - 对冲敞口；相对组合保守控制仓位
      - - 估值立场
        - 偏高
        - $2B 估值对应 $100–140M ARR 为 14–20x；若 ARR 为 $5M 则约 400x；AI 原生公司中位数按已验证 ARR 为 21x
        - 入场价格要求收入按高端执行；外部视角安全边际很薄
      - - 上调触发项
        - 经审计 ARR ≥$100M + GM ≥60% + NRR ≥110%
        - 这三项数据足以支持在当前 $2B 估值附近给出买入
        - 任何承诺前先索取资料室访问权限
    notes: |
      建议反映无法接触私有尽调资料的外部投资人立场。战略投资人和领投 VC（Bezos Expeditions、Khosla、NVentures）已开展非公开尽调，外部无法取得；他们的信念是正向信号，可补充但不能替代本评估。
