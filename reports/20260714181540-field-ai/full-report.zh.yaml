      - number: '2.2'
        title: 市场规模测算口径
        blocks:
          - type: paragraph
            body: >
              没有一个公开分析师数字能干净覆盖 FieldAI 的可服务可触达市场，因为多数报告要么定义过宽（纳入硬件或全部工业自动化），要么过窄（只覆盖一个垂直）。最相关的跨领域数字来自 Global Market
              Insights 对 AI 驱动工业机器人市场的估算：2026 年 $17.9B，按 7.1% CAGR 增长至 2035 年 $33.3B。该数字包含硬件，但能提示 FieldAI 所瞄准的 AI
              增强机器人软件层规模。另一个口径是 The Business Research Company 对工业人工智能市场（全部软件、平台、解决方案）的估算：2026 年 $13.69B，并以 51.1% CAGR
              指数式增长至 2030 年 $73.54B；这是覆盖制造、能源和物流的最宽用例集合，并不专指非结构化环境。

              对 FieldAI 的四个核心垂直，垂直行业规模给出更清晰信号。建筑机器人：2026 年 $7.79B（TBRC）和 $1.4B（Grand View
              Research，建筑机器人窄口径）；区间反映定义范围差异，较低数字对机器人平台本身可能更可辩护。采矿机器人：2026 年 $1.7B（PMR），按 9.8% CAGR 增长至 2033 年
              $3.3B。油气机器人：2026 年 $3.8B（MarkWide Research），按 14.6% CAGR 增长至 2035 年 $12.96B；仅巡检子板块 2026 年估计为
              $0.93B（Fortune Business Insights）。具身 AI 市场（跨垂直、所有物理 AI 系统）预计到 2030 年达到 $7.24B，CAGR 为 17.5%（Research and
              Markets）。

              对 FieldAI 当前垂直中的纯软件、非结构化环境市场，保守自下而上 SAM 估算可这样推导：把 15–25% 的软件占比假设套到 2026 年建筑 + 采矿 + 油气机器人合计 $13.2B
              的垂直硬件与服务市场，得到约 $2–3.3B 的 2026 年可触达软件支出区间。该估算天然不确定，置信度低；FieldAI 没有发布 SAM 数字，也没有分析师发布专门针对“非结构化环境中工业机器人的 AI
              软件”的市场估算。IFR 的 World Robotics 2025 报告记录了 2024 年 542,000 台工业机器人安装量，以及全球 4.66M 台在运行机器人；其中有多少部署在 FieldAI FFMs
              能创造价值的非结构化环境，并未单独量化。分析师估算分布很宽（见 TM002），相互矛盾的规模测算被保留为证据缺口。
