  - id: FV001
    title: 推荐逻辑链
    type: flow
    layout: wide
    summary: |
      从证据质量、估值评估到最终 TRACK 建议的决策逻辑，并标出哪些证据升级会改变结论。
    data:
      nodes:
        - id: team
          label: 创始团队信号
          detail: Ali Agha（DARPA SubT/JPL）、Omidshafiei（DeepMind）、Fan（DARPA RACER）→ 强正面
        - id: investors
          label: 投资人质量信号
          detail: Bezos Expeditions、Khosla、NVentures、Temasek、Intel Capital → 超额认购 → 强正面
        - id: technology
          label: 技术差异化
          detail: 物理优先 FFM；硬件无关；边缘推理 <100ms；联邦学习 → 中强正面
        - id: revenue
          label: 收入证据质量
          detail: 未验证：$5M–$140M 区间；匿名 OCBJ 消息源；无审计财务 → 重大缺口
        - id: valuation
          label: 估值评估
          detail: $2B 按未验证的 $100–140M ARR 计算为 14–20x；按 $5M 计算约 400x；如果收入属实，估值偏高但仍在可比区间内
        - id: governance
          label: 治理不透明
          detail: 未披露董事会；运营实体没有 Form D；未披露股权结构表细节 → 显著风险
        - id: recommendation
          label: 建议：TRACK
          detail: 强投资论点 + 顶级投资人，抵消部分未验证收入和估值拉伸风险 → 在证据点出现前维持 TRACK
        - id: upgrade_path
          label: 升级至 BUY 的路径
          detail: 审计 ARR ≥$100M + GM ≥60% + NRR ≥110% → 在 $2B 附近升级至 BUY
      edges:
        - from: team
          to: recommendation
          label: +
        - from: investors
          to: recommendation
          label: +
        - from: technology
          to: recommendation
          label: +
        - from: revenue
          to: recommendation
          label: 缺口 → 谨慎
        - from: valuation
          to: recommendation
          label: 偏高 → TRACK
        - from: governance
          to: recommendation
          label: 不透明 → TRACK
        - from: recommendation
          to: upgrade_path
          label: 升级条件
    approximationNotes: |
      逻辑流是定性判断；节点权重基于可获得公开证据评估，不是定量评分。投资人质量信号是最强正面因素；收入证据缺口是升级到 BUY 的主要约束。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV015
      - CV036
  - id: FV002
    title: 收入假设下的估值敏感性
    type: bar
    layout: standard
    summary: |
      在不同收入情景下，$2B 估值隐含的 EV/ARR 倍数，并以 Houlihan Lokey AI 原生软件中位数（21.2x）作为参照。
    data:
      items:
        - label: $5M ARR（CompWorth 估算）
          value: 400
        - label: $20M ARR（熊市情景）
          value: 100
        - label: $50M ARR（保守）
          value: 40
        - label: $100M ARR（OCBJ 匿名消息）
          value: 20
        - label: $140M ARR（GetLatka 估算）
          value: 14
        - label: HL AI 原生软件中位数（21x）
          value: 21
        - label: $200M ARR（牛市远期）
          value: 10
    approximationNotes: >
      所有收入数值都是估算或第三方报道，均未审计。$2B 估值分母来自 Reuters/CNBC 援引知情人士。Houlihan Lokey 21.2x 中位数适用于已验证财务的 AI 原生软件公司；FieldAI
      收入未验证，因此对比只是示意，不是精确匹配。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV028
  - id: FV003
    title: 估值与回报区间 — 牛市、基准、熊市
    type: range
    layout: standard
    summary: |
      下一轮融资（2027–2028）在牛市、基准和熊市情景下的隐含估值结果，并以当前 $2B 标记作为参照。
    data:
      items:
        - label: 熊市（降价轮，收入 <$50M，倍数压缩）
          low: 400
          mid: 700
          high: 1000
        - label: 当前估值标记（$2B，2025 年 8 月）
          low: 2000
          mid: 2000
          high: 2000
        - label: 基准（2028 年 Series B，$200–300M ARR @ 10–12x）
          low: 2000
          mid: 2800
          high: 3600
        - label: 牛市（2027 年 Series B，$350–500M ARR @ 15–20x）
          low: 5250
          mid: 7500
          high: 10000
    approximationNotes: |
      所有情景区间均为建模估算，依据可比公司倍数和既定收入假设。没有审计财务，任何区间都无法验证。回报计算假设入场价为 $2B，且没有额外稀释；实际稀释会压低回报。数值以百万美元计。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV030
  - id: FV004
    title: 投资 KPI — 评分摘要
    type: kpi
    layout: standard
    summary: |
      面向 IC 的 FieldAI 七项投资维度评分；0–10 分，10 分代表同类最佳。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          detail: 建筑、能源、采矿、物流、国防等行业 TAM 很大；渗透率仍低；劳动力短缺带来宏观顺风
        - label: 技术护城河
          value: 8
          unit: /10
          detail: 物理优先的 FFMs；硬件无关；已在现场验证；3 年以上自有部署数据；联邦学习飞轮
        - label: 团队 / 创始人与市场匹配
          value: 9
          unit: /10
          detail: 同类顶尖；赢得 DARPA SubT；成员来自 NASA JPL、DeepMind；现场机器人 AI 领域，团队厚度无可比肩
        - label: 商业验证
          value: 5
          unit: /10
          detail: 公司称覆盖数百个站点、3 大洲；已签约 >$100M（匿名、未审计）；没有客户名称，ARR 也未经验证
        - label: 财务透明度
          value: 2
          unit: /10
          detail: 没有经审计财务报表；运营实体未提交 Form D；收入区间相差 28x；治理结构未披露
        - label: 估值与基本面
          value: 4
          unit: /10
          detail: 若 ARR 为 $100–140M，$2B 估值对应 14–20x（说得通）；若 ARR 为 $5M，则为 400x（不合理）；核心风险就是不确定性
        - label: 退出准备度
          value: 5
          unit: /10
          detail: 没有 IPO 时间表；没有 M&A 信号；距离 Series B 可能还要 2 年以上；潜在战略买家很多（NVIDIA、Amazon、Honeywell、Emerson）
    approximationNotes: >
      评分是分析师基于截至 2026 年 5 月公开证据作出的定性判断。财务透明度得分 2/10，反映一家 $2B 公司不透明程度异常高；若公司通过尽调资料室补充披露，该分数会明显上调。综合得分（未加权平均）约为
      5.9/10，因此更支持跟踪，而不是买入。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
      - CV033
