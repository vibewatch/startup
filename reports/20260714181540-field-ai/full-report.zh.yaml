      - number: '8.3'
        title: 可比估值与市场背景
        blocks:
          - type: paragraph
            body: >
              具身 AI 和工业机器人软件赛道提供了一组有用但并不完美的可比公司。在具身 AI 软件同业中，Physical Intelligence 正洽谈近乎零披露收入下的 $11B 估值（2026 年 3
              月）——这是由研究声望和期权价值驱动的极端离群点，而不是当前商业牵引。Skild AI 2026 年 1 月以 $30M ARR 且指数级增长拿到 $14B 估值，对小基数隐含约 467x
              远期倍数——同样是早期阶段的期权倍数，不是基本面倍数。这些可比项确认，投资人群体正在给具身 AI 软件平台很高的期权溢价；但从近零收入对应 $14B–$5.6B 的巨大区间，也说明终局价值假设高度不确定。


              如果 $100–140M ARR 估算正确，FieldAI $2B 估值实际隐含的倍数更温和（14–20x），低于两个最接近的具身 AI 软件同业；只要收入真实，它在品类内看起来定价有吸引力。但如果真实收入只有
              $5–20M，隐含倍数（100–400x）会跻身赛道内最激进估值之列。硬件一体化可比公司——Apptronik（$5.3B，人形硬件 + 软件）和 Gecko
              Robotics（$1.25B，关键基础设施检测）——商业模式结构不同，软件毛利更低，但收入更可验证，因此会把纯软件估值可比倍数往下拉。Houlihan Lokey 2026 年一季度关于 AI
              垂直软件的报告发现，AI 原生软件公司在 VC 轮中的 EV/Revenue 中位数为 21.2x，而 AI 赋能软件为 8.5x、传统 SaaS 为 5.5x。若 FieldAI 有 $100M ARR 且按
              21x 计，估值可支撑约 $2.1B，基本与当前标记一致。关键风险在于，这一中位数适用于财务已验证的公司，而 FieldAI 收入完全没有外部验证。
