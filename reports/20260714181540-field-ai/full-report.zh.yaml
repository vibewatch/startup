  - id: FI002
    title: 单位经济桥 — 从合同到客户生命周期价值
    type: flow
    layout: standard
    summary: |
      用定性方式呈现单位经济如何从赢单推进到年度合同价值、成本扣除和多年生命周期价值。由于缺少公开数据，所有输入均为估计。
    approximationNotes: |
      FieldAI 未披露实际 CAC、ACV 或 NRR 数据。所有节点均根据行业基准和可观察交易规模主张估计。应视为情景结构，而非已确认指标。
    data:
      nodes:
        - id: cac
          label: 获客成本（估计 $200K–$1M）
          detail: 12–24 个月企业销售周期；现场演示；集成试验；试点支持；CEO 提到数百万美元级交易
        - id: acv
          label: 年度合同价值（估计 $300K–$2M）
          detail: 区间基于定价范围（$50K–$500K / 站点）、多站点合同，以及 CEO 提到的数百万美元级交易
        - id: cos_unit
          label: 年度服务成本（估计为 ACV 的 25–45%）
          detail: 现场支持、云分析、模型刷新；边缘架构降低边际可变成本后，规模化时成本下降
        - id: gross_profit_unit
          label: 单客户年度毛利润（估计为 ACV 的 55–75%）
          detail: 偏软件模式瞄准高毛利；若集成占比仍高，服务会拖累毛利
        - id: ltv
          label: 客户生命周期价值（多年合同 × NRR）
