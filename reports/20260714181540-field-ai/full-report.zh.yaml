      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              FieldAI 未披露任何留存指标——截至 2026 年 5 月，任何公开声明、新闻稿或投资人沟通中都没有出现
              NRR、GRR、队列数据、流失率、合同续约率或客户满意度评分。公司仍处于未披露收入阶段且为私营公司；没有监管文件强制这些披露。

              建筑板块的定性留存信号略偏正面。Big-D 的多年活跃部署，以及将 FieldAI 扩展到未来每个项目的明确计划，是目前最强的留存和扩张信号。DPR 的企业风投部门 WND Ventures 称 2025 年 8
              月融资是“人们可以期待机器人领域出现更大融资轮次的信号”，并提到 DPR
              工地帮助测试概念验证——这种措辞暗示关系仍在持续。超额认购融资轮明确归因于“多份扩张合同”，也从财务信号上佐证了复购，尽管具体合同价值和客户名称仍未披露。

              结构性集中度风险较高。基于公开确认的生产部署，FieldAI 的建筑客户基础由四个账户构成：Big-D、DPR 和两家未具名 ENR 公司。任何一个具名锚定客户流失，都会拿走超过 50%
              的可见证据基础。能源、矿业和制造垂直没有公开具名客户，意味着建筑之外的生产证据仍是缺口。Certis 带来了向安保的垂直多元化，但它是伙伴运营方，不是直接企业 SaaS 账户。

              主力垂直还存在更广泛的宏观逆风：BuiltWorlds 2025 Equipment & Robotics Benchmarking report 发现，承包商的活跃建筑机器人使用率同比从 65% 降至
              46%，即便正面情绪升至 95%。下降被归因于行业从实验性试点转向选择性、已验证的落地——这一动态可能拖慢 FieldAI 新客户获取，同时利好其现有生产账户。企业销售周期长、多方审批流程、NDA
              限制客户具名，意味着 FieldAI 真实客户基础几乎肯定大于公开证据所示，但没有独立方法验证。
