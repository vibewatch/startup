      - number: '1.4'
        title: 规模、合作伙伴与里程碑时间线
        blocks:
          - type: paragraph
            body: >
              自 2023 年创立以来，FieldAI 的增长曲线很陡。公司 2024 年底约有 30 名员工，到 2025 年 8 月融资公告时增至约 130 人；LinkedIn 在 2026 年初显示员工数为
              201–500 人，与公司所称到 2025 年底把员工翻倍至约 260 人的计划一致。2025 年末，出于招聘和实验室扩张需要，公司从 Mission Viejo 约 13,000 平方英尺办公空间，搬到
              Irvine Spectrum 的 3 Morgan、面积 41,000 平方英尺的研发总部。FieldAI
              的生产部署已覆盖三大洲——北美、欧洲和亚太（包括日本）——数百个站点、数千次任务。公司吸引了建筑、能源、制造、城市配送、安防和国防领域数十家大型企业客户，并成立 FieldAI Federal
              子公司服务政府和军事应用。2026 年初，公司宣布两项重要战略合作：2 月，Certis Group（新加坡领先的综合安防服务商）与 FieldAI 建立合作，在全球部署自主安防机器人；2026 年 3
              月，Boston Dynamics 与 FieldAI 宣布合作，把 Spot 的移动能力与 FieldAI 的 FFMs 结合，用于建筑和其他动态环境。Boston Dynamics 创始人 Marc
              Raibert 专门提到双方在 2020 年 DARPA SubT 的胜利来背书公司：“自 Ali 和他的团队用 Spot 机器人赢得 DARPA Subterranean Challenge 的
              Urban-circuit、同时为 NASA 处理类似挑战以来，我们就认识他们。”Construction Dive 提到的一个关键风险指标是：受访承包商中的活跃机器人部署比例从 2024 年的 65% 降至
              2025 年的 46%，尽管正面评价达到 95%；这说明行业在意愿和实际采用之间存在普遍摩擦，也会成为 FieldAI 近期商业规模目标的逆风。
