          - type: callout
            title: 在具身 AI 同业估值中，$2B 其实偏保守
            body: >
              与最接近的两个具身 AI 软件同业相比，FieldAI 的 $2B 估值显得保守：Physical Intelligence 2025 年 11 月在零披露收入下估值 $5.6B，Skild AI 2026 年
              1 月凭 $30M ARR 达到 $14B。如果 FieldAI 收入数字准确且继续增长，下一轮融资可能远高于 $2B。TRACK
              建议并不因此改变——未验证收入仍是硬约束——但这让下行风险的表述更准确：在可比集里，$2B 标记是地板，不是天花板。
