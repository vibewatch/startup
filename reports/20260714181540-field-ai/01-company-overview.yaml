callouts:
  - calloutType: strength
    title: Deep Founder-Market Fit from DARPA and NASA JPL
    body: >-
      The FieldAI founding team (Agha, Omidshafiei, Fan) shares a uniquely tight founder-market fit: all three
      worked directly on the CoSTAR program at JPL, MIT, and affiliated institutions, and their core autonomy
      architecture (NeBula, later FFMs) was battle-tested in the DARPA Subterranean Challenge before any commercial
      application was attempted. This research-to-deployment path is rare and substantially de-risks the technical
      thesis. Marc Raibert's personal Boston Dynamics endorsement further validates the team's technical credibility.
    claimRefs:
      - CO013
      - CO014
      - CO015
      - CO038

  - calloutType: risk
    title: No Named Customers and Early Commercial Stage
    body: >-
      Despite $405M raised and a $2B valuation, FieldAI has declined to publicly name any specific enterprise
      customers as of its August 2025 funding announcement. The company had only ~130 employees at funding time
      (growing from ~30 just nine months prior), and revenue metrics are privately held. The OCBJ-reported ">$100M
      booked revenue" is from anonymous third-party sources, not company disclosure. Active robotics deployments
      among contractors fell from 65% in 2024 to 46% in 2025 per BuiltWorlds, indicating an industry-wide
      adoption gap that FieldAI must navigate to convert its stated bookings into durable recurring revenue.
    claimRefs:
      - CO040
      - CO041
      - CO031
      - CO033

  - calloutType: risk
    title: HQ Location Conflict in Canon
    body: >-
      Multiple pre-diligence references describe FieldAI's headquarters as San Francisco. However, all primary
      sources—including FieldAI's own official press releases, TechCrunch, CNBC, Reuters, and Orange County Business
      Journal—consistently identify the company as headquartered in Irvine, California (formerly Mission Viejo, CA).
      No credible source places a FieldAI headquarters in San Francisco. This discrepancy in prior references should
      be verified in due diligence.
    claimRefs:
      - CO002
      - CO042

  - calloutType: insight
    title: Software-Only Model Provides Asymmetric Scale Potential
    body: >-
      By refusing to build hardware, FieldAI avoids the capital intensity of robot manufacturing and can target every
      robot OEM as both a distribution partner and an addressable account. The hardware-agnostic approach means each
      new robot platform (humanoid, wheeled, aerial) represents an expansion opportunity rather than a product pivot.
      This is the OS-layer analogy: if FFMs become the de facto standard for industrial robot autonomy, the addressable
      market expands proportionally to global robot fleet growth without commensurate capex increases.
    claimRefs:
      - CO003
      - CO005
      - CO007

