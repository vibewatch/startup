  - id: S03
    title: Funding History and Investor Composition
    body: >
      FieldAI operated in stealth mode from its 2023 founding until August 20, 2025, when it simultaneously disclosed
      $405 million raised across two consecutive funding rounds and announced its $2 billion valuation—quadrupling from
      the $500 million valuation established in the earlier round. The most recent round raised $314 million and was
      oversubscribed; co-investors include Bezos Expeditions (Jeff Bezos' family office), Prysm Capital, and Temasek.
      Additional investors across both rounds include BHP Ventures, Canaan Partners, Emerson Collective, Intel Capital,
      Khosla Ventures, NVentures (NVIDIA's venture capital arm), and others. Gates Frontier (Bill Gates' investment
      arm) and Samsung are designated "previous investors," indicating they participated in the earlier round which
      set the $500 million valuation. By subtraction from the disclosed total, the first round raised approximately
      $91 million. Note: some pre-diligence references describe the breakdown as $150 million (seed) plus $255 million
      (Series A); this breakdown is inconsistent with Reuters' reporting of a $314 million latest round and cannot be
      confirmed from primary sources. The oversubscription and caliber of investors—spanning tech-venture leaders
      (Khosla, NVentures, Intel Capital), sovereign wealth and institutional funds (Temasek, BHP), philanthropic
      capital (Gates Frontier, Emerson Collective), and the world's wealthiest individuals' family offices (Bezos
      Expeditions)—reflects exceptionally broad investor conviction. Vinod Khosla stated: "FieldAI is at the forefront
      of the general-purpose robotics revolution, and its ability to rapidly deploy will unlock long-term economic and
      societal value." Intel Capital's public endorsement post formalizes a platform integration and strategic
      relationship with Intel's hardware stack. The funding is designated for global expansion, product development
      (locomotion, manipulation), and headcount scale to double by end of 2025.
