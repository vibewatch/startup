  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >
        FieldAI's annual recurring revenue, total revenue, gross margin, and customer contract values
        are private and have not been disclosed. The only public signal is ">$100M booked revenue"
        from anonymous sources cited by OCBJ.
      whyItMatters: >
        Revenue is the primary commercial traction metric; the $2B valuation implies a high revenue
        multiple. Without disclosed revenue, it is impossible to assess whether the valuation is
        justified on fundamentals.
      diligencePath: >
        Request audited financial statements or management accounts during due diligence; verify
        the ">$100M booked revenue" figure and decompose into contracted ARR vs. one-time services.
      relatedQuestionRefs:
        - QO015
        - QO017

    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >
        FieldAI's board composition, voting rights, investor protective provisions, and governance
        structure have not been publicly disclosed.
      whyItMatters: >
        Board composition determines who controls major decisions including future fundraising, M&A,
        and CEO succession. Key-person risk in CEO Agha is elevated without disclosed succession or
        governance guardrails.
      diligencePath: >
        Obtain cap table and shareholders' agreement from the company; request board meeting minutes
        from the last four quarters and investor rights agreement.
      relatedQuestionRefs:
        - QO027
      relatedTableRefs:
        - TO002

    - type: conflicting-data
      severity: minor
      topic: round-breakdown
      missingEvidence: >
        The canonical pre-diligence description of FieldAI's funding as "$150M seed (Aug 2024) +
        $255M Series A (Aug 2025)" conflicts with Reuters' reporting of a $314 million most-recent
        round and a $500 million prior-round valuation. The inferred first-round amount is ~$91M.
        No primary source independently confirms the $150M + $255M breakdown.
      whyItMatters: >
        The precise round structure, dilution profile, and per-round investor ownership percentages
        are material to cap table analysis and future liquidation preference calculations.
      diligencePath: >
        Request official capitalization table and closing documents for all rounds from company
        counsel; cross-reference with SEC Form D filings if available.
      relatedQuestionRefs:
        - QO004
        - QO026
      relatedTableRefs:
        - TO003

    - type: missing-source
      severity: minor
      topic: hq-location
      missingEvidence: >
        Some secondary databases and pre-diligence sources list FieldAI's headquarters as San Francisco,
        California. No primary source—including FieldAI's own press releases, TechCrunch, CNBC, Reuters,
        or OCBJ—places the company in San Francisco. The company has been in Mission Viejo, CA (2023–2025)
        and Irvine, CA (late 2025 onward).
      whyItMatters: >
        HQ location affects legal domicile, IP ownership, talent recruiting, and regulatory jurisdiction
        analysis in later chapters.
      diligencePath: >
        Confirm current registered address via California Secretary of State business filings and
        cross-check with company letterhead or recent correspondence.
      relatedQuestionRefs:
        - QO013
