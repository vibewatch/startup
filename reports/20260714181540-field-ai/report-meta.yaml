companyProfile:
  summary: FieldAI is a private embodied AI software company founded in 2023 by former NASA JPL robotics leader Ali Agha and technical co-founders drawn from DeepMind, NASA JPL, and DARPA autonomy programs. The company sells Field Foundation Models, a hardware-agnostic software brain that lets third-party robots operate safely in unstructured industrial environments without GPS, pre-mapped scenes, or constant cloud connectivity. FieldAI’s public traction is strongest in construction, with named deployments at Big-D Construction and DPR Construction, but the company also targets energy, manufacturing, inspection, urban delivery, and federal use cases. Its August 2025 and February 2026 financing disclosures/third-party funding records kept the company at a $2B valuation while lifting total reported funding above $500M, leaving material questions around audited revenue, governance, and current scale unanswered.
  foundedDate: '2023-01-01'
  founders:
    - name: Ali Agha
      role: Founder & CEO
      background: Former NASA JPL principal investigator and DARPA Subterranean Challenge leader with roughly two decades in field robotics and autonomous systems.
      claimRefs: [CO011, CO012, CO013]
    - name: Shayegan Omidshafiei
      role: Co-founder & Chief Science Officer
      background: Former DeepMind and Google research scientist with MIT training in multi-agent and reinforcement learning systems.
      claimRefs: [CO014]
    - name: David Fan
      role: Co-founder & CTO
      background: Former DARPA SubT and RACER technologist and NASA JPL research fellow focused on deployable autonomy.
      claimRefs: [CO015]
  foundingLocation: Southern California, USA
  headquarters: Irvine, CA, USA
  productSummary: >-
    FieldAI’s product is the Field Foundation Model platform: physics-first, risk-aware embodied AI that runs on partner robot hardware at the edge and enables perception, reasoning, planning, and multi-robot coordination in dynamic industrial environments.
  customerFocus: Large industrial operators and contractors in construction, energy, manufacturing, inspection, urban delivery, and selected federal applications that need autonomy in hazardous or unstructured environments.
  businessModel: B2B enterprise software licensing plus integration and deployment services, with recurring autonomy subscriptions layered on top of customer- or partner-owned robot hardware.
  stage: Private, post-Series A / early-stage VC
  fundingStatus: PremierAlts reported $506.1M total funding across five rounds by February 2026, including a latest early-stage VC round of $315M at a $2B valuation; the company’s own August 2025 announcement disclosed $405M across two consecutive rounds with backing from Bezos Expeditions, Temasek, NVentures, Intel Capital, Khosla Ventures, and other strategic investors.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO011, CO014, CO015, CV001, CV004, CU006]
