callouts:
  - calloutType: strength
    title: Structural Demand Tailwinds Are Multi-Decade and Converging
    body: >
      Labor shortages in construction, mining, and energy are not cyclical—they are structural, driven by
      workforce aging, declining interest in hazardous trades, and regulatory escalation. Combined with
      AI autonomy reaching industrial productionization maturity in 2026–2028, FieldAI's timing is optimal:
      the technology is sufficiently proven (deployed at enterprise scale, 90%+ efficiency gains documented)
      while the market is still early enough for platform incumbency to be established before competitive
      fragmentation. IFR's data showing 4.66 million operational industrial robots globally and 542,000
      annual installations provides a large and growing installed base for FieldAI's software layer.
    claimRefs:
      - CM008
      - CM031
      - CM033
      - CM035

  - calloutType: risk
    title: Pilot Purgatory and Slow Enterprise Conversion Are Existential Risks
    body: >
      The single most important near-term market risk is the documented gap between positive robotics
      evaluations and active deployments. BuiltWorlds found that 95%+ of construction firms positively
      evaluated robotics in 2025 but only 46% reported active use—down from 65% the prior year. This
      pattern aligns with McKinsey's finding that 71% of industrial companies cite capital costs and
      61% cite lack of internal experience as adoption barriers. For FieldAI, this means strong pilot
      performance does not automatically translate into enterprise revenue. The company's $405M in
      capital provides the runway to solve this conversion problem, but the pilot-to-enterprise rate
      is the critical unpublished metric that determines whether FieldAI's market opportunity is
      realized on its projected timeline.
    claimRefs:
      - CM036
      - CM038
      - CM039

  - calloutType: insight
    title: Software Layer Captures Disproportionate Value as Hardware Commoditizes
    body: >
      Analytics Insight notes that factories are beginning to select robots the way companies select
      cloud infrastructure: for compatibility with an intelligence ecosystem rather than standalone
      hardware performance. As robot hardware specifications converge (Boston Dynamics Spot pricing
      trends down; humanoid robots entering price competition), the software intelligence layer
      captures an increasing share of total system value. FieldAI's hardware-agnostic FFM architecture
      positions it as the potential OS-level platform of industrial robotics—analogous to how
      hyperscalers abstracted hardware in enterprise computing. The market long-term could be
      winner-take-most for the software layer, but this requires FieldAI to build switching costs
      through data flywheel advantages before competitor foundation models narrow the autonomy gap.
    claimRefs:
      - CM001
      - CM006
      - CM019

