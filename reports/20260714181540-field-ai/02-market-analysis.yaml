  - id: S04
    title: Growth Drivers and Adoption Constraints
    body: >
      Structural growth drivers are multi-decade and well-documented. Labor shortages are the most immediate:
      over 50% of the Western US mining workforce is expected to retire by 2029, and the construction industry
      globally faces persistent skilled-labor deficits. The US Mine Safety and Health Administration (MSHA)
      recorded 31 mining fatalities in fiscal year 2024 at a fatal-injury rate of 0.0110 per 200,000 hours
      worked, sustaining regulatory pressure for autonomous alternatives in the most hazardous tasks. IFR's
      World Robotics 2025 data shows global industrial robot installations growing from 500,000+ per year
      through 2028, with software-defined autonomy increasingly the differentiating factor as hardware
      specifications converge. Deloitte's 2026 TMT Prediction confirms that specialized AI foundation models—
      distinct from consumer LLMs—represent the technology breakthrough that could shift robots from
      command-and-control to genuinely generalized autonomy between 2026 and 2030.


      Adoption constraints are equally substantive. McKinsey's Industrial Robotics Survey documents that 71%
      of industrial companies cite hardware capital cost and 61% cite lack of internal experience as the
      primary barriers to robotics adoption, and that complex activities such as assembly, surface treatment,
      and welding are unlikely to be automated in the short to medium term. Deloitte observes that annual
      industrial robot unit sales have been essentially flat at approximately 500,000 units since 2021 and
      warns that the market is likely to remain at relatively modest annual growth unless bottlenecks around
      data quality, integration complexity, and cybersecurity are resolved. Most critically, BuiltWorlds'
      2025 Equipment and Robotics Benchmarking report—cited in Construction Dive's coverage of FieldAI's
      funding—found that the share of construction firms reporting active robotics use fell from 65% in
      2024 to 46% in 2025, even as positive evaluations jumped from 74% to 95%. This divergence between
      enthusiasm and deployment is the defining tension in the near-term market and is FieldAI's most
      direct execution risk: translating strong pilot performance into durable enterprise revenue. High
      capex cycles, OT/IT integration friction with legacy plant systems, long payback period requirements,
      and the volatile capital environment for oil and gas operators are further structural headwinds.
      The gap between stated market size and deployed product is real and material.
