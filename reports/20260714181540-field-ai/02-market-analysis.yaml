  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: market-sizing
      missingEvidence: >-
        FieldAI's actual annual recurring revenue, booked pipeline, average contract value, and customer
        count are not publicly disclosed; a precise SOM calculation is impossible without data room access.
      whyItMatters: >-
        Without revenue and contract data, market penetration and unit economics cannot be validated;
        the SAM-to-SOM conversion is the critical unknown for valuation and growth modeling.
      diligencePath: >-
        Request data room access: ARR/ACV, customer count by vertical, average contract value, revenue
        churn rate, and number of pilots converted to enterprise agreements.
      relatedQuestionRefs: [QM025]
      relatedTableRefs: [TM002]

    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        No analyst has published a dedicated TAM/SAM estimate for "AI software for general-purpose industrial
        robots in unstructured environments"—the precise scope of FieldAI's market. All available estimates
        either include hardware or cover specific verticals separately.
      whyItMatters: >-
        Without a purpose-built SAM estimate, the addressable market for FieldAI's software-only,
        hardware-agnostic model must be inferred from broader estimates, introducing structural uncertainty
        into investment sizing and comparable analysis.
      diligencePath: >-
        Commission a custom analyst study or develop a bottom-up model using FieldAI's pricing, contract
        mix, and addressable robot fleet data from the data room.
      relatedQuestionRefs: [QM025, QM012]

    - type: private-evidence-only
      severity: material
      topic: adoption-path
      missingEvidence: >-
        FieldAI's pilot-to-enterprise conversion rate, average sales cycle length, and churn data
        are not publicly disclosed. The BuiltWorlds 2025 data showing active deployment drop from
        65% to 46% industry-wide makes conversion efficiency the most critical unpublished metric.
      whyItMatters: >-
        Pilot conversion rate directly determines near-term revenue trajectory and validates whether
        FieldAI's market opportunity translates into predictable enterprise revenue rather than
        perpetual pilot activity.
      diligencePath: >-
        Request cohort data from FieldAI's customer success team: number of pilots initiated, time
        to enterprise contract, expansion revenue per customer, and year-1 churn rate by vertical.
      relatedQuestionRefs: [QM010, QM018]

    - type: conflicting-data
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        Construction robotics TAM estimates vary by 5× between Grand View Research ($1.4B narrow, 2024)
        and TBRC ($7.79B broad, 2026), reflecting incompatible scope definitions that have not been
        reconciled by any single authoritative source.
      whyItMatters: >-
        The 5× range in construction robotics estimates means FieldAI's market opportunity in its
        largest current vertical is highly uncertain at the TAM level; the more conservative estimate
        is used in this chapter's body text but may understate growth if the broad definition proves
        to be the relevant competitive scope.
      diligencePath: >-
        Request a scope breakdown from analyst firms distinguishing robot hardware, software, services,
        and related automation technologies to reconcile the gap.
      relatedQuestionRefs: [QM002, QM020]
      relatedTableRefs: [TM002]
