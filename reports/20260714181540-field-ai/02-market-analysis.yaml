chapter:
  number: 2
  title: Market Analysis
  summary: >
    FieldAI targets the software intelligence layer for general-purpose robots deployed in unstructured industrial
    environments—construction megaprojects, active mines, oil and gas facilities, and flexible manufacturing
    sites. The total AI-powered industrial robot market is estimated at $17.9 billion in 2026, with the verticals
    FieldAI serves collectively spanning $7–14 billion in near-term addressable spend across construction ($7.8B),
    mining ($1.7B), and oil and gas ($3.8B) robotic and AI markets. Growth is structurally driven by labor
    shortages, tightening safety regulation, and rapidly maturing autonomy technology; however, material
    constraints—high capex cycles, enterprise integration friction, and an emerging "pilot purgatory" dynamic in
    construction—create a meaningful gap between market enthusiasm and deployed revenue that FieldAI must close
    at scale.

sections:
  - id: S01
    title: Market Boundary and Definition
    body: >
      FieldAI's addressable market is not the full industrial robotics market—the majority of deployed industrial
      robots reside in structured, repetitive manufacturing environments (automotive assembly, semiconductor
      fabrication, consumer electronics) that are already well served by traditional fixed-path automation
      vendors such as FANUC, ABB, and Yaskawa. FieldAI's distinct market is the segment of industrial robot
      deployments that require adaptive, risk-aware autonomy to operate in unstructured environments where
      layouts change daily, GPS and pre-mapped paths are unavailable, and static programming fails. This includes
      active construction sites (where terrain, obstacles, and workflows shift hourly), underground and open-pit
      mines (where rock falls, gas hazards, and confined spaces make human exposure dangerous), oil and gas
      topside and inspection environments (where access to assets is hazardous and remote), and flexible or
      high-mix manufacturing facilities not amenable to fixed-path robots.


      The market boundary excludes spend on: (a) structured factory automation hardware and software (e.g.,
      traditional articulated arm robots on fixed assembly lines); (b) consumer or logistics warehouse robots
      operating in controlled environments; (c) robot hardware itself, as FieldAI is a pure-play software
      vendor; and (d) subsea ROVs and specialty underwater vehicles, which are addressed by a separate supplier
      ecosystem. The status-quo substitutes that industrial buyers currently rely on include manual human
      inspection and monitoring crews, traditional fixed-path or single-task robots that require extensive
      pre-programming, drone/UAV aerial surveys, and BIM/CAD modeling with manual data capture. Each of
      these substitutes is more expensive per unit of site intelligence, less real-time, and increasingly
      untenable as labor pools shrink and safety requirements tighten.


      FieldAI's market spans four primary verticals: (1) construction and infrastructure, (2) energy, mining,
      and extractives, (3) oil and gas inspection and operations, and (4) industrial manufacturing in unstructured
      or high-mix configurations. The company describes its target as "dirty, dull, and dangerous" environments
      where autonomous robots deliver compounding value across safety, documentation, and operational insight—
      a framing that aligns closely with the structural characteristics of its four served verticals. Adjacent
      markets that represent future expansion paths include defense and perimeter security, logistics in complex
      environments, and urban delivery in semi-structured settings. The relevant market is best sized through
      vertical-specific analyst estimates rather than a single broad robotics TAM, because scope definitions
      across analyst reports diverge materially.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
    tableRefs:
      - TM001
    figureRefs:
      - FM001

  - id: S02
    title: Market Sizing Lenses
    body: >
      No single published analyst figure cleanly captures FieldAI's serviceable addressable market because most
      analyst reports either define markets too broadly (including hardware or all industrial automation) or too
      narrowly (covering only one vertical). The most relevant cross-cutting figure is Global Market Insights'
      estimate for the AI-powered industrial robot market: $17.9 billion in 2026 growing at 7.1% CAGR to $33.3
      billion by 2035. This figure includes hardware, but it signals the scale of the AI-augmented robotics
      software layer that FieldAI targets. Separately, The Business Research Company estimates the industrial
      artificial intelligence market (all software, platforms, solutions) at $13.69 billion in 2026, with
      exponential growth to $73.54 billion by 2030 at a 51.1% CAGR—the widest set of use cases across
      manufacturing, energy, and logistics, not unstructured environments specifically.


      For FieldAI's four core verticals, vertical-specific sizing provides sharper signal:
      Construction robots: $7.79 billion in 2026 (TBRC) and $1.4 billion (Grand View Research, narrow definition
      for construction robots only); the range reflects definitional scope differences, with the lower figure
      likely more defensible for robotic platforms alone. Mining robotics: $1.7 billion in 2026 (PMR), growing
      at 9.8% CAGR to $3.3 billion by 2033. Oil and gas robotics: $3.8 billion in 2026 (MarkWide Research),
      growing at 14.6% CAGR to $12.96 billion by 2035; the inspection sub-segment alone is estimated at
      $0.93 billion in 2026 (Fortune Business Insights). The embodied AI market (cross-vertical, all physical AI
      systems) is forecast to reach $7.24 billion by 2030 at 17.5% CAGR (Research and Markets).


      A conservative bottom-up SAM estimate for FieldAI's software-only, unstructured-environment market—derived
      by applying a 15–25% software-share assumption to the combined $13.2 billion vertical hardware and
      services market (construction + mining + oil and gas robots in 2026)—yields a SAM range of approximately
      $2–3.3 billion for 2026 addressable software spend in FieldAI's current verticals. This estimate
      is inherently uncertain and carries low confidence; FieldAI has not published a SAM figure and no analyst
      has published a dedicated "AI software for industrial robots in unstructured environments" market estimate.
      The IFR's World Robotics 2025 report documents 542,000 industrial robot installations in 2024 and 4.66
      million units in operational use globally; the fraction of these deployed in unstructured environments
      where FieldAI's FFMs add value is not separately quantified. The analyst estimate spread is wide (see TM002),
      and contradictory sizing is preserved as an evidence gap.
