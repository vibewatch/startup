callouts:
  - calloutType: strength
    title: Pure-Software Model Limits Capital Intensity
    body: >
      FieldAI's hardware-agnostic, software-only revenue model means it does not carry
      robot inventory, manufacturing capex, or supply-chain working capital risk. Unlike
      vertically integrated robotics companies (Figure AI, Agility Robotics), FieldAI's
      cost base is dominated by engineering talent and field support—both of which scale
      sub-linearly with revenue as the deployment footprint grows. This structural advantage
      supports the case for high gross margins and capital efficiency relative to the raised
      amount.
    claimRefs:
      - CI001
      - CI002
      - CI015

  - calloutType: risk
    title: Valuation Carries Significant Financial Opacity Premium
    body: >
      The $2B post-money valuation rests on a $405M capital raise, elite investor signal,
      and anonymous third-party revenue estimates—not on verified financial fundamentals.
      The absence of audited ARR, gross margin disclosure, customer count, or SEC Form D
      filing makes external underwriting of the valuation impossible without non-public
      diligence access. UpsideList's secondary-market model estimates -2% upside at current
      implied price, reflecting the information discount the private secondary market assigns
      to financial opacity. The wide revenue estimate range ($50M–$140M ARR, a 2.8x spread)
      and conflicting data points from analyst platforms underscore that the valuation is
      carried almost entirely by forward narrative rather than trailing fundamentals.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI025
      - CI028
      - CI029

  - calloutType: recommendation
    title: Core Diligence Asks Before Underwriting
    body: >
      A minimum viable diligence package for underwriting the $2B valuation requires: (1)
      audited or management-certified ARR as of most recent quarter, segmented by licensing
      and services; (2) gross margin by stream; (3) rolling 12-month cash burn and balance
      sheet; (4) customer count and top-5 revenue concentration; (5) cohort-level NRR for
      2024 and 2025 cohorts; and (6) ACV quartiles by industry vertical. Without these,
      any investment thesis at the current valuation is an informed bet on team and market
      rather than a financially-grounded underwrite.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI026
      - CI027

