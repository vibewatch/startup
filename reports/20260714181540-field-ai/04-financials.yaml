  - id: public-financial-gaps
    title: Financial Opacity and Diligence Blockers
    body: >
      FieldAI is a private company with no public financial reporting obligations. As of
      May 2026, key financial metrics that remain undisclosed or unverifiable include: (1)
      audited ARR or total revenue; (2) gross margin by revenue stream; (3) CAC and payback
      period; (4) net revenue retention rate; (5) customer count and concentration; (6) cash
      on hand; and (7) monthly or quarterly burn rate.


      The available revenue signals are conflicting. GetLatka estimates $140M ARR (November
      2025), while other analyst platforms have cited figures as low as $5M—a 28x discrepancy
      that reflects the challenge of estimating private-company metrics from outside.
      UpsideList's community model flags -2% upside and notes the company as effectively
      pre-revenue from a secondary-market pricing perspective, suggesting liquidity and
      valuation uncertainty at the private secondary level.


      The $2B valuation implies a 14x revenue multiple against the $140M ARR estimate, and
      a 20x multiple against the $100M booked revenue signal. Both multiples are aggressive for
      a company with undisclosed profitability, no public financial track record, and operating
      in a market where at least 54% of robotics deployments in the construction vertical
      (the company's largest disclosed market) remain as pilot or stalled projects (per
      BuiltWorlds 2025 data). These multiples are defensible only if ARR growth is rapid and
      margins are high—neither of which can be confirmed from available data. FieldAI has not
      filed a Form D with the SEC (confirmed via EDGAR full-text search), meaning the company
      either relied on an exemption that does not require a Form D, used a different legal
      entity, or has not yet filed. The California entity "Field Ai, Inc." (document #6436098,
      incorporated October 24, 2024, Delaware formation, CEO Aliakbar Aghamohammadi) is active.


      The adverse valuation signal from secondary-market analysts and the wide revenue estimate
      range are not disqualifying, but they mean underwriting the $2B valuation requires
      accessing non-public financial information through formal due diligence.
