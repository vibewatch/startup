company:
  name: Field AI

chapter:
  number: 4
  title: Financials
  summary: >
    FieldAI has raised $405M across two consecutive rounds—an initial ~$91M at a $500M valuation
    in 2024 and a $314M oversubscribed round in August 2025 at a $2B valuation—giving the company
    a $2B post-money valuation at approximately 2.5 years old. Revenue model is B2B: upfront
    hardware integration fees plus recurring software licensing subscriptions, with pricing
    reportedly ranging from tens of thousands to $500K per deployment-year. The only public
    revenue signal is ">$100M in booked revenue" from anonymous OCBJ sources (April 2026); a
    third-party analyst (GetLatka) estimates $140M ARR as of November 2025, though neither
    figure is audited or company-confirmed. Forward capital adequacy looks adequate for 2–4 years
    at inferred burn rates, but gross margin, CAC, NRR, and cash on hand are entirely undisclosed,
    creating material diligence blockers for underwriting the $2B valuation.

sections:
  - id: revenue-model
    title: Revenue Streams and Monetization Strategy
    body: >
      FieldAI's revenue model is B2B enterprise, centered on two primary streams: (1) upfront
      hardware integration fees collected when a customer first deploys FieldAI's sensor-compute
      payload and firmware onto existing third-party robots; and (2) recurring software licensing
      fees for continued access to Field Foundation Models (FFMs), fleet management, and analytics
      services. The company does not manufacture robots and explicitly avoids hardware OEM
      positioning, keeping the model closer to an enterprise software subscription than a
      robotics hardware vendor. All on-device inference runs at the edge with latency under 100ms;
      fleet data is uploaded to FieldAI's cloud platform for analytics and federated model
      improvement.


      List pricing is not publicly disclosed. Third-party sources characterize the subscription
      range as "tens of thousands to $500,000 per year" depending on deployment scale, with
      CEO Ali Agha citing "multi-million dollar contracts" in the US, Europe, and Asia as evidence
      of large-enterprise deal sizes. Construction Dive and Sacra confirm the B2B hardware
      integration plus software licensing structure. There is no evidence of a consumer-facing
      revenue stream, marketplace model, or hardware OEM revenue. A defense-oriented subsidiary,
      FieldAI Federal, is operational and could eventually generate government contract revenue,
      though no contract awards have been publicly disclosed.


      The only public revenue signal is an April 2026 Orange County Business Journal report
      citing anonymous "sources familiar with the matter" indicating the company has more than
      $100M in booked revenue. GetLatka's analyst platform estimates $140M ARR as of November
      2025. Neither figure is audited, company-confirmed, or broken down by stream. These data
      points are treated as directional signals rather than confirmed financial metrics.
