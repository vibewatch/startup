  - id: financial-verdict
    title: Financial Verdict
    body: >
      FieldAI's financial picture is that of a well-capitalized, early-revenue software
      business growing fast enough to attract $405M in 24 months but still too opaque for
      external underwriting. The $2B valuation is carried entirely by investor signal, growth
      trajectory, and team pedigree—not by verified financial fundamentals. If the $140M ARR
      estimate is accurate and growing at 50–100% year-on-year, the valuation is in range
      for a category-creating AI software company; if ARR is materially lower or growth is
      slower, the multiple becomes difficult to justify. Forward capital adequacy appears
      solid: $405M raised against a pure-software operating model (no hardware manufacturing
      capex, no inventory financing) and a disclosed >$100M in bookings implies at least
      2–3 years of operating runway before the next fundraise. The largest diligence risk is
      not solvency but information asymmetry—the gap between what is publicly verifiable and
      what is needed to underwrite the valuation is unusually wide for a $2B company.
    claimRefs:
      - CI030
      - CI031
      - CI032
    tableRefs: []
    figureRefs: []

