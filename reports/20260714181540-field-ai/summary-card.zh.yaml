  topStrengths:
    - 硬件无关的 Field Foundation Models 切中真实机器人瓶颈：在非结构化、安全关键环境中实现自主性。
    - 创始人-市场匹配少见地强，NASA JPL、DARPA SubT、DeepMind 和高端现场机器人经验是核心支撑。
    - 投资人质量一线，Bezos Expeditions、Temasek、NVentures、Intel Capital 和 Khosla 都传递了强私募市场信心。
    - 公开案例显示，建筑场景部署有可量化价值，包括检查 / 文档时间减少 90%+，以及 Big-D 的多项目扩张。
  topRisks:
    - 收入、利润率、留存和董事会治理大多未披露，估值承销高度不确定。
    - 公开具名客户证据仍窄，集中在建筑领域，还未显示跨垂直行业的大规模生产化。
    - 工业场景中具身 AI 的安全、认证和监管就绪度仍只有部分验证。
    - 对 Ali Agha 的关键人依赖，以及对 NVIDIA、Boston Dynamics 等平台伙伴的深度依赖，增加集中度风险。
  unresolvedGaps:
    - 没有公开可得的经审计 ARR、确认收入、毛利率或 NRR 披露。
    - 董事会构成、优先股结构和详细治理权利未公开。
    - 软件订阅、服务收入和硬件集成费之间的拆分尚未验证。
    - 当前员工数和确切总部标识在公开来源中不一致。
    - 可见建筑部署之外的客户集中度，无法通过公开证据衡量。
