- id: section-3
  title: Deployment, integrations, reliability, and workflow proof
  body: >-
    The public deployment story is strongest where the product touches real enterprise
    systems and measurable workflow outcomes. The integrations catalog names major systems of
    record and modern AI endpoints, while service operations pages show the platform acting
    across CRM, ITSM, and communications tools. Process Discovery emphasizes fast collection
    and visibility across desktops, mainframes, VDI, Windows, and web apps; Automation
    Co-Pilot emphasizes triggering workflows inside apps like SAP, Workday, and Salesforce;
    and the 2026 Autonomous Service Desk release adds governed action across enterprise
    systems at one-billion-request scale. The company repeatedly positions itself as usable in
    regulated, high-volume workflows where integration burden and handoff quality matter as
    much as model quality. The strongest evidence of deployment maturity is thus not abstract
    AI capability, but the combination of connectors, packaged workflows, and clear examples
    of production-oriented operational tasks.
  claimRefs:
  - CE011
  - CE012
  - CE015
  - CE016
  - CE017
  - CE019
  - CE022
  - CE023
  - CE024
  - CE030
