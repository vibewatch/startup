- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - PRE
    - Orchestrates reasoning, actions, and human-agent collaboration
    - Platform context, models, workflow definitions, enterprise systems
    - Model behavior and orchestration quality are hard to benchmark publicly.
  - - AI Agent Studio
    - Builds low-code goal-based agents and reusable AI skills
    - Third-party models and governance policies
    - Tooling depth and observability are only partially documented publicly.
  - - Foundation models
    - Generate language, classification, and reasoning outputs
    - AWS, Google Cloud, Azure OpenAI, OpenAI, and BYOM
    - Reliance on external model vendors and policy changes.
  - - Document Automation
    - Converts raw documents into process-ready structured data
    - NLP, CV, ML, GenAI, document models
    - Accuracy varies by document quality and task complexity.
  - - Integrations layer
    - Connects apps, APIs, packages, and event triggers
    - SAP, Salesforce, ServiceNow, Workday, IBM, OpenAI, REST/SOAP and more
    - Integration quality and maintenance burden can shape deployment success.
  - - Human-facing layer
    - Lets users trigger workflows and collaborate with agents in context
    - Co-Pilot and enterprise app surfaces
    - Adoption depends on workflow design and change management.
  - - Governance and audit layer
    - Logs prompts, events, policy controls, and secure access
    - Security stack, AI Guardrails, SIEM, RBAC, credential vaults
    - Policy misconfiguration or weak governance could still create enterprise risk.
  notes: This is an evidence-backed operating architecture derived from product and security pages, not a vendor-supplied reference diagram.
