  - TE002
  figureRefs:
  - FE002
- id: section-4
  title: Trust, safety, compliance, maturity, and technical caution
  body: >-
    Automation Anywhere's trust surface is one of the better-supported parts of the product
    story. The security page discloses a cloud-native microservices architecture, 16 global
    datacenters, contractually guaranteed 99.9% SLA, four-hour RTO/RPO, SOC 1 Type 2,
    SOC 2 Type 2, ISO 27001, HITRUST, ISO 22301, GDPR/CCPA alignment, FIPS-140, AES-256,
    TLS, RBAC, SAML, MFA, credential-vault integrations, SIEM connectivity, and audit trails.
    AI Agent Studio adds model-level guardrails, prompt and event logging, and grounded-model
    behavior tied to enterprise data. Those are meaningful signals for regulated deployments.
    The main technical caution is elsewhere: the platform is not unusually transparent in the
    public domain about incident history, release cadence, benchmark methodology, or hands-on
    developer adoption. The Stack Overflow tag page at least confirms a public practitioner
    footprint exists, but it does not suggest a large open ecosystem. This remains an
    enterprise-admin platform first, not a grassroots developer platform. That distinction may
    help in regulated rollouts but limits how much outside builder momentum can be observed in
    public channels.
  claimRefs:
  - CE008
  - CE009
  - CE019
  - CE020
  - CE021
  - CE027
  - CE028
  - CE029
  - CE032
  - CE033
  - CE034
  - CE035
