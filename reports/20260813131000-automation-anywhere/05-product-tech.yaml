  - TE004
  - TE005
  figureRefs:
  - FE004
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Agentic Process Automation platform
    - Enterprise automation and operations teams
    - Mature flagship surface
    - Unifies agents, RPA, and orchestration in one control layer
    - Exact SKU boundaries and pricing remain opaque.
  - - Process Reasoning Engine
    - Automation architects and enterprise operators
    - Recently elevated strategic core
    - Reasoning and orchestration layer above models, bots, and people
    - Benchmark methodology behind performance claims is not public.
  - - AI Agent Studio
    - Developers and low-code builders
    - Active build surface
    - Low-code agent creation with guardrails and third-party model support
    - Need deeper evidence on day-to-day production tooling and debugging ergonomics.
  - - Automation Co-Pilot
    - Frontline employees and process users
    - Production-facing module
    - In-app conversational interface that can invoke real workflows and agents
    - Public evidence does not quantify attach or active-user depth.
  - - Document Automation
    - Document-heavy operations teams
    - Mature packaged module
    - Handles structured and unstructured documents and hands data to agents
    - Need independent proof on accuracy across varied enterprise datasets.
  - - Process Discovery
    - Automation CoE and process-improvement teams
    - Mature packaged module
    - Auto-discovers process variation and ROI opportunities
    - Exact data-collection overhead and privacy tradeoffs need deeper diligence.
  - - Integrations / Agentic App Store
    - Developers, partners, and enterprise builders
    - Mature ecosystem surface
    - Packages, connectors, and reusable assets accelerate deployment
    - Need usage and quality data for partner or community-contributed assets.
  notes: Maturity labels reflect public positioning and workflow breadth, not audited product telemetry or release-health data.
  claimRefs:
