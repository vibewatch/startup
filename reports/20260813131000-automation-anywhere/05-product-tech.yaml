  - CE002
  - CE006
  - CE011
  - CE013
  - CE015
  - CE017
  - CE018
  - CE031
- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Accounts payable processing
    - Invoices, matching, approvals, and exception handling across systems
    - Document Automation + AI agents + Co-Pilot + APA
    - 90% straight-through processing, same-day processing, lower labor and late fees
    - Public proof is company-authored and not independently benchmarked.
  - - Customer support resolution
    - Triage, context gathering, routing, and resolution execution
    - Customer Support solution + PRE + Co-Pilot
    - Up to 87% faster resolution and 69% fewer escalations
    - Metrics are strong but mostly self-reported.
  - - Service operations / ITSM
    - Incident intake, classification, provisioning, troubleshooting, and escalation
    - Service Operations and Autonomous Service Desk
    - '>80% average auto-resolution claim, 50% fewer call volumes, time-to-value in as little as eight weeks'
    - Need wider third-party proof across more customers.
  - - Banking compliance and onboarding
    - KYC/AML, onboarding, form processing, and day-end reporting
    - Retail banking solution + document automation + integrations
    - Faster service and stronger controls in document-heavy legacy environments
    - Exact production adoption levels are not publicly broken out.
  - - Healthcare RCM and admin workflows
    - Claims, scheduling, admin processing, and document handling
    - RCM automation + Document Automation + APA
    - Lower errors and costs with better patient and revenue-cycle outcomes
    - Public detail on enterprise-scale reference accounts is limited.
  - - Automation opportunity mining
    - Manual process mapping and opportunity selection
    - Process Discovery
    - Months-to-minutes insight claims and 100% visibility narrative
    - Need independent validation of collection effort and actual ROI conversion.
  notes: Benefits are taken from company pages and releases; independent outcome verification remains uneven by workflow.
