  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: Public sources do not independently validate PRE efficacy, resiliency, document-accuracy, or app-store ROI claims.
    whyItMatters: Performance and deployment-speed claims are central to the product story and to competitive differentiation.
    diligencePath: Request benchmark methodology, customer-by-customer validation, and production error-rate or rollback metrics for PRE, Document Automation, and packaged solutions.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE001
    - TE002
  - type: private-evidence-only
    severity: material
    topic: product-usage-and-release-telemetry
    missingEvidence: Public materials do not disclose active-user depth by module, release cadence, incident history, or engineering productivity telemetry.
    whyItMatters: Breadth of modules is easier to verify than true product maturity and operational quality.
    diligencePath: Request release notes history, module adoption rates, support-ticket trends, uptime history, and customer module-attach data.
