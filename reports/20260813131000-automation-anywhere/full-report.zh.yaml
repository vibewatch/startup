        title: 创始人、领导梯队与公开治理信息的不确定性
        blocks:
          - type: paragraph
            body: >-
              本次收集到的所有公开来源里，Mihir Shukla 仍是核心控制点：官方关于页称他为董事长兼 CEO，第三方档案也仍标注他是 CEO 和联合创始人。Ankur Kothari 仍被公开识别为 COO
              和联合创始人，Nancy Hauge 则被呈现为人力负责人。再往下一层，领导层图景开始变得嘈杂。官网列出 Vikram Khosla 为 CFO，但 TipRanks 截至 Aug 2026 仍把 James
              Budge 列为 CFO、Chris Riley 列为 CRO，说明外部公司档案数据库存在滞后或不一致。公开创始人记录也没有完全统一：Wikipedia 保留了更宽的原始创始人名单，包括 Neeti Mehta
              Shukla 和 Rushabh Parmani；当前公司叙事则聚焦 Mihir Shukla 和 Ankur Kothari。这种不一致本身不致命，但意味着董事会、继任安排和完整创始人股权结构表仍需要一手确认。
