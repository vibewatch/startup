        title: 融资形成、估值重置，以及真正能支撑的事实
        blocks:
          - type: paragraph
            body: >-
              最干净的融资事实是历史事实，不是当前事实。官方和 PRNewswire 记录确认，公司在 2018 年以 $1.8 billion 估值完成 $250 million Series A，又在 2019 年完成
              $290 million Series B，投后估值 $6.8 billion，由 Salesforce Ventures
              领投，主要既有投资方参投。此后，公开记录迅速变差。老股市场数据提供商现在指向一个截然不同的私营估值标记： Premier Alternatives 报告，截至 8 October 2024，公司估值为 $2.0
              billion，并有 Oct 2024 的 $174 million 轮融资；Yahoo Finance 的 Forge 派生私营公司页面只显示市场参与者到 2026
              年仍在给公司定价。这些来源是有用的方向性信号，但不等同于公司宣布的融资轮。可投资结论是：公开证据支持公司相对 2019 年最后官方标记出现大幅折价； 而 post-2019
              轮次条款、累计融资和所有权稀释仍缺少充分文档。
