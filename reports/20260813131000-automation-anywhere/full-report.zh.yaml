  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、模块地图与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              公司已经不再把自己描述为机器人厂商。它的核心产品是 Agentic Process Automation 平台，把 AI 智能体、RPA、编排和人工审批统一到企业系统之上。在这个核心周围， Automation
              Anywhere 已经拼出一张相当清晰的模块地图：用于推理和编排的 Process Reasoning Engine、用于低代码智能体创建的 AI Agent Studio、用于应用内人机交互的
              Automation Co-Pilot、用于文档中心工作流的 Document Automation、用于工作流挖掘的 Process Discovery、用于应用和 API 连接的
              Integrations，以及承载可复用资产的 Agentic App Store。解决方案页面把这些模块绑到具体任务上，例如应付账款、客户支持、服务运营、零售银行和医疗
              RCM。模块清晰度很重要，因为它说明平台正试图拥有更多自动化生命周期：
              从发现工作流，到构建智能体，到执行工作，再到治理结果，而不是只卖单一运行时功能。这种广度应提升交叉销售潜力，但也会随着时间推高实施、治理和产品协同要求。
