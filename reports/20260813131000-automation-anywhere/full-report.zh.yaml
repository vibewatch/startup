  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere 的边界应从它真正试图自动化的工作流出发，而不是从所有贴着企业 AI 标签的支出出发。当前产品界面描述的是一个 Agentic Process Automation 系统：
              它把 AI 智能体、经典 RPA、编排、文档抽取和人工审批，组合到既有企业系统之上。这意味着最相关的支出池包括核心 RPA 软件、智能文档处理、智能体服务运营自动化，以及面向金融、IT、支持、
              医疗和银行场景的跨职能工作流编排。边界应排除通用 ERP 和 CRM 席位支出、从未进入生产工作流执行的纯基础模型实验，以及从未变成企业控制平面的零散内部脚本。实际替代集合很宽：
              手工共享服务人力、外包后台处理、在割裂工具间工作的服务台团队、Microsoft 或 ServiceNow 环境里的点状自动化，以及能处理规则但不能处理推理或异常的传统机器人项目。正因如此，
              公司试图把讨论从任务机器人转到受治理的跨系统执行。
            claimRefs:
              - CM001
              - CM002
              - CM003
