  - id: TV005
    title: 投资逻辑失效与放弃触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量不达预期
        - 私有尽调显示收入明显低于支撑重置标记所需水平
        - 可比公司案例失效，因为隐含倍数变得过高
        - 放弃，或要求大幅更低入场价。
      - - 留存或集中度不及预期
        - NRR / GRR 疲弱，或少数客户贡献过多收入
        - 上行空间会从复利增长重定价为脆弱资产
        - 将业务按更高风险、更低终局倍数处理。
      - - 安全或 AI 合规事故
        - 出现重大泄露、整改失败或工作流层面合规问题
        - 信任、采购速度和扩张假设同步走弱
        - 下调情景区间，并要求严格得多的尽调。
      - - Aisera / 智能体集成失败
        - 附加销售停滞、服务负担上升，或集成支持导致客户流失
        - 新增长楔子不再支撑优质平台逻辑
        - 重估到成熟自动化倍数。
      - - 优先股堆叠悬顶
        - 股权结构表条款显著削弱普通股上行空间
        - 即使公司表现良好，也可能无法带来可接受回报
        - 继续推进前重建回报模型。
    notes: 上述少数事件最直接改变建议。
    claimRefs:
      - CV013
      - CV014
      - CV027
      - CV029
      - CV036
      - CV037
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR / 收入基数
        - 绝对当前 ARR 或收入，以及从已签约到已确认收入的桥接
        - 这是所有隐含倍数测算背后最关键的缺失输入
        - CFO 尽调，以及经审计或董事会层级报告。
      - - 毛利率与服务收入占比
        - 按产品和实施模式拆分的毛利率
        - 服务交付占比高，就不该按高端工作流平台定价
        - 财务和交付负责人审查。
      - - 留存与客户集中度
        - 净留存率（NRR）、总留存率（GRR）、流失率、合同期限和头部客户敞口
        - 判断增长是在复利滚动，还是脆弱
        - CRO 和财务队列表。
      - - 股权结构表和优先权
        - 清算优先权、反稀释、期权和证券权利
        - 即使企业价值看起来有吸引力，回报测算也可能大幅改写
        - 法律顾问和股权结构表导出。
      - - Aisera 整合经济性
        - 收购后的附加率、流失、支持负担和交叉销售表现
        - 判断 ITSM / HR / CX 切口是在增厚价值，还是分散注意力
        - 产品和 GTM 尽调。
      - - 安全 / 合规运营记录
        - 事故日志、补丁修复证据，以及核心工作流中的 AI 治理归属
        - 风险章节显示，这类问题可能迅速改写业务定价
        - 安全团队审查和客户访谈。
    notes: 按最可能直接影响投资建议和价格纪律的程度排序。
    claimRefs:
      - CV009
      - CV013
      - CV016
      - CV036
      - CV037
