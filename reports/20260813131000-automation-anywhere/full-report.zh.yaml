        title: 收入模式，以及从公开披露中真正能推断出的内容
        blocks:
          - type: paragraph
            body: >-
              虽然 Automation Anywhere 不公布审计报表，但收入模式看起来像软件、且具备经常性。公司反复披露软件预订、ARR、百万美元以上 ARR 客户、剩余履约义务，以及存量客户附加率。
              这些不是硬件制造商或纯咨询公司的指标，而是企业软件平台通过会续约、会扩张的合同销售时使用的词汇。官方页面还暗示变现是分层的：核心平台、编排、AI 驱动解决方案，以及面向金融、支持和服务运营的工作流特定包。
              缺口在于核心订阅收入、使用量或 AI 相关变现、专业服务和客户支持之间的拆分。公开证据因此支持变现机制，但不支持绝对组合或确认收入构成。这一区分很关键，因为软件收入和服务收入支撑的毛利率与估值假设完全不同。
