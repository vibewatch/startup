      - number: '7.2'
        title: 智能体扩张推高监管、隐私和法律风险
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere 的监管暴露在上升。它最有吸引力的工作流，正好落在监管者越来越重视的几类场景里：客服、面向员工的运营、金融服务流程、医疗行政，以及公共服务流程。欧盟委员会的 AI Act
              框架把这一点说得很清楚。该法已于 2026 年 8 月适用，透明度规则已经生效，GPAI 义务也已开始执行；就业、基本服务获取等高风险类别，在 2027-2028 年还要承担更严格义务。Automation
              Anywhere 未必直接提供 Act 列出的每一类高风险系统，但它的工具显然离这些工作流足够近，欧盟对透明度、日志、稳健性和监督的要求必须纳入判断。

              加州隐私法则拉出另一条风险面。加州总检察长的 CCPA 指引强调删除、更正、选择退出、敏感信息限制，以及特定数据泄露情形下的法定赔偿。Automation Anywhere 自身隐私政策（2026 年 4 月 1
              日最后修改）确认，公司收集并处理网站、商业接触和服务相关信息，与关联方、合作伙伴和服务提供商共享数据，并考虑使用标准合同条款等机制开展跨境传输。这对企业软件并不罕见，但意味着隐私或安全失误会直接传导到法律、采购和客户信任后果。

              公开法律表面还算过得去，但不完整。网站条款对公共站点的保证、准确性、不中断可用性和广泛责任作出免责声明；这提醒投资人，不能只看网站语言，必须拿到真实客户合同样本、数据处理协议（DPA）和事件响应承诺。Companies
              House 文件显示英国实体仍处于存续并按时更新状态，但微型公司账目和常规确认声明提供的运营可见度很低。因此正确的风险读法不是「发现法律麻烦」，而是「法律和监管尽调负担仍然很高」。
