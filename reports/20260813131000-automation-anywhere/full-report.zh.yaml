    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部，以及从 RPA 转向智能体流程自动化
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere 当前的官方叙事没有歧义：公司称自己是 “Agentic Process Automation 公司”，把系统定位为位于企业软件之上的云原生编排层，并称自己 2003
              年开创经典 RPA，2024 年推出 APA。首页、关于页和产品页反复讲同一条故事线：公司如今卖的是横跨 AI 智能体、RPA、API、文档和人员的受治理编排，而不是独立
              机器人。公开第三方摘要仍把公司称为数字劳动力或 RPA 厂商，但大体同意同一个核心身份：一家创立于 California 州 San Jose
              的私营企业软件公司，向大型组织销售自动化软件。因此，后续章节可复用的底层事实是： 一家传统 RPA 厂商正试图在不抛弃存量客户的前提下，重新定价为 AI 原生企业自动化平台。
