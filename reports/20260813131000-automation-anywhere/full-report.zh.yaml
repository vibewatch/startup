  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere 公开风险中严重度最高的部分，来自信任敏感型执行，而不是单一已知法律爆雷。平台明确卖进银行、医疗、HR、客户服务和政府相邻工作流；安全问题、隐私失败或不可靠的 AI
              动作，都可能迅速伤害采购动能。Rapid7 2024 年披露 Automation 360 v21-v32 存在未经身份验证的 SSRF 漏洞，是最清晰的公开反向信号，因为它说明公司处在真实企业攻击面内，
              而不只是营销环境。状态页又给出第二个运营线索：Automation Anywhere 运营着庞大的区域云足迹，并反复发布可能中断服务的计划更新。这种透明度很好，但也证明了持续发布复杂性风险。

              下一层风险是战略依赖。Automation Anywhere 的现代产品故事依赖第三方模型、超大规模云厂商和合作伙伴生态，而不是封闭自研栈。这扩大了客户选择，也加快分发；
              但平台性能、定价、模型政策和部分预订动能也因此部分落在公司控制之外。客户证据把商业含义说得很清楚：增长依赖大型受监管账户内扩张，但当前公开材料仍不披露 NRR、GRR、流失、合同期限或收入集中度。
              这意味着投资案例可以观察到需求和客户验证，却无法完整观察底层收入基数的脆弱性。
