      - number: '8.3'
        title: 公开可比区间显示，即使重置后的估值也需要大量隐藏收入证明
        blocks:
          - type: paragraph
            body: >-
              这里最好的公开速记，不是精确 DCF，也不是编造的创投回报模型，而是锚定上市自动化与工作流软件公司的粗略可比区间。Yahoo Finance 给出的当前企业价值 / 收入倍数约为：UiPath
              4.10x、Pegasystems 2.96x、SS&C 3.97x、ServiceNow 9.20x、Microsoft 11.26x；StockAnalysis 给出对应收入基数，有助于显示
              Automation Anywhere 与上市龙头的规模差距。因此最直接的可比区间，大致是增长较慢或更成熟自动化同业的 3x-4x；ServiceNow
              可作为溢价上限，因为它拥有更宽的工作流控制权和公开市场可信度。

              这给出一个简单的纪律测试。在 $2.0B 标记下，Automation Anywhere 对 $50M 收入约等于 40x，对 $100M 是 20x，对 $150M 是 13.3x，对 $200M 是
              10x。在 Yahoo 的 $1.47B 标记下，这些数字分别降到约 29.4x、14.7x、9.8x 和
              7.4x。换句话说，即使是重置后的标记，仍要求投资人假设公司已有相当可观的当前收入基础和不错的软件经济性。除非私募尽调揭示类似九位数经常性收入、且留存和利润率良好，单靠公开证据无法把公司当成便宜货。
