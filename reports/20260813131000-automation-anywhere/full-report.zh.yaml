      - number: '2.3'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图首先按职能划分，其次才是横向市场。官方解决方案页面显示，当前最强适配点在应付账款和财务运营、客户支持和服务运营、零售银行工作流、医疗收入周期管理，以及更广泛的 IT 或员工支持。
              在这些分层里，买方通常是转型、运营或职能负责人；终端用户是服务坐席、AP 团队、收入周期员工、合规团队或 IT 操作员；经济赞助人往往坐在 CFO、CIO、COO、
              共享服务负责人或业务线负责人位置。各来源里的采用路径一致：识别高吞吐工作流，跑概念验证（PoC），接入记录系统，加入治理和异常处理，然后扩展到相邻流程。Automation Anywhere 自己披露的附加率——
              FY2025 为 38%、Q1 FY2026 为 51%——意味着在存量客户中的扩张与新客户获取同样重要。公司实际卖的是可先落地、再扩张的运营层，而不是一次性的机器人许可证。
