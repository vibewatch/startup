  headquarters: San Jose, California, United States
  productSummary: >-
    Automation Anywhere 提供一套企业自动化栈，核心是 Agentic Process Automation 平台、PRE、AI Agent Studio、Automation Co-Pilot、Document
    Automation、Process Discovery、集成能力，以及面向金融、服务运营、银行和医疗场景的工作流资产。
  customerFocus: 大型企业和受监管运营团队；它们需要跨系统工作流自动化、文档密集型流程自动化、受治理的 AI 智能体，以及高吞吐的服务或合规工作流。
  businessModel: 企业软件平台，通过大客户订阅和附加 AI / 自动化模块变现；扩张越来越依赖存量客户加购、AI 驱动的增购，以及在 ITSM、HR、客户服务、金融和运营中覆盖更广的工作流。
