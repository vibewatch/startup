      - number: '7.4'
        title: 客户、财务模型和集成风险仍是最不透明的一层
        blocks:
          - type: paragraph
            body: >-
              商业层面，最大问题不是需求弱，而是耐久性不透明。客户证明、平台迁移和附加率披露都指向健康扩张，但公司仍不公布最新
              NRR、GRR、流失率、合同期限或收入集中度。这很关键，因为可见客户群包括大型受监管企业，以及越来越多百万美元 ARR 客户。这样的业务可以从 logo 数看起来分散，但仍暴露在少数大客户、模块或合作伙伴上。

              财务模型风险同样披露不足。管理层公开强调过盈利能力、利润率改善、现金余额和预订增长，但公司仍不提供详细财务报表。与此同时，Yahoo Finance 的私有公司页面给出 2026 年 8 月约 $1.47
              billion 的派生估值，对照 2019 年 $6.8 billion 的投后估值和最新披露的 $174 million
              融资，进一步说明外部对公司的标记仍不稳定、且高度依赖方法论。这不能证明公司陷入困境，但说明透明度低时，市场可以很快重估这个故事。

              执行风险还在上升，因为 Automation Anywhere 试图同时做几件难事：把存量客户迁到智能体自动化，做大企业大客户，扩进 ITSM、HR 和客服，并在集成 Aisera
              的同时，把价值叙事从席位授权改成基于工作结果。官方新闻稿把这表述成机会，也提到新增 100 多名 AI 工程师，并继续支持 Aisera
              客户。这有帮助，但也把门槛抬高了。如果集成滑坡、定价更难解释，或新打法比预期更偏服务交付，下行会同时打到客户、利润率和估值。
