      - number: '7.3'
        title: 运营安全、可靠性和伙伴依赖，是公开材料里最具体的风险
        blocks:
          - type: paragraph
            body: >-
              Rapid7 的 CVE-2024-6922 披露，是本次尽调包里最强的公开运营风险证据。Rapid7 称，Automation 360 v21-v32 存在未认证 SSRF 漏洞，估计约 3,500 台
              Control Room 服务器暴露在公网，并说明攻击者如何借此触达内部服务。Automation Anywhere 告诉 Rapid7，该问题已在 33
              版修复，且客户已获通知，这是重要缓释。即便如此，这一事件仍很关键：当 Control Room 基础设施直接面向客户时，平台信任会很快转化为企业安全审查。

              可靠性风险不只是一条 CVE。公开状态页列出 Control Room、Community、Process Discovery、Bot Store、Enterprise Knowledge
              等跨多区域服务资产，许多计划更新还明确提醒客户不要在维护窗口安排自动化任务。这是企业云软件的常态，但也说明工作流连续性多么依赖发布运营和变更管理。安全页面用 >99.9% SLA、四小时 RTO/RPO
              披露，以及一长串认证和控制来部分对冲。只是公开事件历史细节，仍不足以匹配平台瞄准工作流的重要性。

              依赖风险同样实质。AI Agent Studio 和 PRE 围绕 AWS、Google Cloud、Azure OpenAI、OpenAI 和 BYOM
              等外部模型选项搭建，预订增长又多次被归因于超大规模云厂商合作，以及 Amazon Q
              带动的新客户兴趣。好处是灵活。坏处是模型厂商定价、路线图变化、可用性或政策调整，都可能直接流入产品经济性、功能速度和客户结果。Automation Anywhere 越来越把自己定位为 AI
              自动化控制平面，这类外部依赖就应被视为一阶风险，而不是脚注。
