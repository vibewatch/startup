              资本充足性是本章最难回答的财务问题，因为 Automation Anywhere 没有公布手头现金、债务、烧钱速度或现金跑道。公司确实表示，它超过 EBITDA 指引、增强现金余额、提高自由现金流， 并截至
              Apr 2026 实现连续 10 个季度 non-GAAP 盈利；这些合在一起，削弱了“自动化厂商还在烧钱”的刻板印象。但这不能替代资产负债表。最后一组干净的官方融资事实仍是： 2018 年以 $1.8
              billion 估值完成 $250 million Series A，2019 年以 $6.8 billion 投后估值完成 $290 million Series B。二级来源暗示 2024
              年前后当前估值明显更低，但没有一手确认。英国子公司的 Companies House 记录只能提供有限用途：它证明实体层面持续申报、提交完整账目、发生董事变更，但不能证明集团真实流动性或优先股堆叠。
              因此，在管理层分享一手资本数据前，财务舒适度必须保持有条件。
