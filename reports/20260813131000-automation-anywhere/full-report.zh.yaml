      - number: '8.2'
        title: 公司质量逻辑不错，但价格逻辑仍取决于隐藏经济性
        blocks:
          - type: paragraph
            body: >-
              支持投资的逻辑很直接。Automation Anywhere 有一套连贯的企业自动化平台，AI
              驱动模块在增长，客户证明覆盖金融、医疗、公共部门和客服，也披露了足够的盈利能力和现金余额语言，能降低近期偿付风险。它还可能对大型平台买家或 IPO 投资人具备战略相关性，因为市场仍然重要，而公司正从传统 RPA
              转向智能体编排和自助式自动化。Aisera 收购也增加了关注理由：它把买方地图扩展到 ITSM、HR 和客服，并把故事推向更宽的自治企业平台。

              反向逻辑同样清晰。公开证据看不到今天的 ARR、毛利率、NRR、GRR、流失率、服务收入占比、集中度或股权结构中的优先权。这些变量正是判断一家私有软件公司是否应享受溢价倍数的核心。近期的公开证据可以证明
              Automation Anywhere 是真实公司、且具备战略相关性；它不能证明当前价格提供了足够安全边际。因此正确结论不是质量判断，而是价格判断：资产有吸引力，承销依据不完整。
