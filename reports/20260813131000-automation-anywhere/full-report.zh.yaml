      - 论点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - Automation Anywhere 有真实企业验证、宽工作流覆盖、持续改善的 AI 变现，以及足够的盈利能力表述，能降低近期破产风险担忧。
