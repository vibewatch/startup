      - number: '5.2'
        title: 架构、模型与技术栈的运行逻辑
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere 公开的技术架构是分层的，而不是以模型为中心。PRE 被表述为 AI 大脑，能在业务流程中安全编排 AI 智能体、自动化和人员。AI Agent Studio
              则给开发者或自动化构建者一个低代码环境， 用来创建目标导向智能体，连接 AWS、Google Cloud、Azure OpenAI 和 OpenAI 的基础模型，并组合可复用 AI 技能。Document
              Automation 负责文档抽取、分类和验证， 再把结构化输出交给智能体推理和行动。Integrations 暴露软件包和连接器，接入
              SAP、Salesforce、ServiceNow、Workday、OpenAI、IBM Watson 等许多系统。 Automation Co-Pilot
              坐在工作流中，作为面向人的界面。架构模式因此不是“一个模型包办一切”；它是一个编排系统，把模型、自动化、连接器、人工审批和企业控制层组合起来。
