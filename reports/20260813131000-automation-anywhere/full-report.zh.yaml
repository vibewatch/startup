        - 如果业务更像优质工作流平台，而不是传统 RPA 供应商，$2.5B-$4.0B 就有支撑。
        - 需要私有数据证明重置过头。
        - 安全或续约不及预期会很快抹掉溢价。
      - - 基准
        - 收入质量不错但不顶尖，集中度可控，公司继续增长，但公开证据仍不完整。
        - 结合重置标记和温和可比公司支撑，$1.5B-$2.2B 是仅凭公开信息最站得住的区间。
        - 最符合当前证据集。
        - 经济性缺口仍限制信心。
      - - 悲观
        - 收入基数低于预期，服务强度高，或集成 / 监管摩擦拖慢智能体转向。
        - 如果市场只给成熟自动化倍数，$1.0B-$1.5B 有可能。
        - 会由疲弱私有尽调或负面经营消息触发。
        - 优先股悬顶可能压低新钱回报。
    notes: 区间刻意设得宽且仅作示意，因为公开证据无法支撑更窄估值带。
    claimRefs:
      - CV023
      - CV024
      - CV025
