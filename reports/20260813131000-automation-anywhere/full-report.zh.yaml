      - number: '2.2'
        title: 规模测算口径、发布方矛盾，以及真正可承销的部分
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere 所在品类的公开市场规模估计有方向性价值，但内部并不一致。Gartner 的 2024 市场份额分析给出了最可辩护的窄口径底线：全球 RPA 软件市场在 2024 年增长
              14.5%，达到 $3.6 billion，即使 AI 创新拖慢了该品类增速。Future Market Insights 给出更大、更前瞻的视角，估计 2026 年市场规模为 $5.7 billion，并预计到
              2036 年 CAGR 为 18.2%。MarketsandMarkets 公开估计更宽，约为 2025 年 $9 billion、2036 年接近 $48 billion； Technavio 则预计 2025
              至 2030 年增量增长 $54.27 billion，CAGR 为 41.3%。这些数字不能压成一个虚假的共识。它们使用不同年份、细分定义，以及软件、服务和 AI
              增强自动化的纳入规则。最安全的承销视角因此是桥接市场法：窄口径的数十亿美元核心 RPA 软件品类，略大的智能自动化平台品类，以及更大但更难单独隔离的智能体运营预算。
