  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景是真实的，但公开价格支撑并不一致
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere 的融资历史很清楚：这家公司曾拿到 RPA 周期顶部估值，之后已经重新定价。2018 年官方 Series A 公告给出 $1.8B 投后估值，并描述了三位数增长、98%
              留存和 1,000 多家全球客户。如今私募市场标记讲的是另一个故事。Yahoo Finance 的 AUAN.PVT 页面显示，截至 2026 年 8 月，派生估值约为 $1.47B；Premier
              Alternatives 则显示，截至 2024 年 10 月，当前估值约为 $2.0B，与 $174M 融资轮和约 $815M 累计融资相关。两个标记并不相同，也并不完美，但在关键点上一致：公司已经从过去
              $6.8B 的峰值回落。

              这次重置对估值纪律很重要。它意味着市场已经承认，后期自动化软件不能再只靠叙事定价。Automation Anywhere 的公开故事仍有很多强项——AI 驱动增购、客户迁移、百万美元 ARR
              增长、附加率提升，以及广泛伙伴牵引——但公司愿意披露的绝对财务细节仍然有限。因此，公开投资人和二级市场能看到动量和方向，却仍无法独立验证支撑重置后估值所需的收入基础。
