companyProfile:
  summary: >-
    Automation Anywhere 是一家总部在 San Jose 的私营企业软件公司，成立于 2003 年，正从传统机器人流程自动化转向智能体流程自动化。公开证据支持一个覆盖面很宽的平台： 工作流编排、AI
    智能体、文档自动化、流程发现、集成，以及受治理的企业工作流。银行、医疗、公共部门、金融和客户服务都有真实客户验证。不过，公司仍未披露几项影响估值的关键指标： 当前 ARR
    或收入、毛利率、留存队列、客户集中度，以及完整股权结构表条款。
  foundedDate: '2003-01-01'
  founders:
    - name: Mihir Shukla
