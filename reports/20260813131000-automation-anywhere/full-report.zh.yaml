      - number: '2.4'
        title: 增长驱动、部署约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素清晰且具体：公开市场报告中，金融仍是大型支出分层；BFSI 被反复强调为大型采用群体；官方解决方案页面承诺当日发票处理、更快支持响应、更少升级，以及更容易接入遗留系统等可衡量结果。
              但同一批来源也说明，部署速度对估值为什么如此关键。银行和医疗工作流需要合规、审计轨迹、基于角色的访问控制，以及与遗留应用的安全集成。Gartner 明确表示，AI 创新在 2024 年拖慢核心 RPA
              市场增长，这说明品类正在被重新定义，而不是简单线性增长。UiPath、ServiceNow、Pega 和 Microsoft 现在都在用与 Automation Anywhere
              相似的治理和编排话术，营销相邻的智能体或工作流自动化栈。 可投资问题因此不是自动化需求是否存在——需求存在——而是 Automation Anywhere
              能否比大型套件厂商打包该品类更快，把跨职能、受监管的工作流胜利转化为可复制的平台扩张。
