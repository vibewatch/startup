      - number: '8.4'
        title: 建议为继续研究，只有证据或价格到位时才重新进入
        blocks:
          - type: paragraph
            body: >-
              基于公开证据的建议是继续研究。置信度为中，因为 Automation Anywhere
              显然有真实客户、产品宽度有意义，也有可见动量。风险评级为高，因为最重要变量仍是私有信息，而且风险章节指出的下行路径——安全、监管、伙伴依赖和客户集中——都可能比公开材料暗示的更快压缩价值。估值立场是在重置区间以上仍偏高，只有接近较低二级市场标记、且重大尽调得到确认时，才可能变得有意思。

              决策规则很简单。如果管理层能证明当前 ARR 或收入显著高于约
              $150M，留存强、集中度可接受，且毛利率质量明显像软件业务，就重新接触。若入场价格下移到足够低，缺失变量不再需要承担回报逻辑的大部分，也可以更早重新接触。如果股权结构中的优先权、续约疲弱、服务交付过重，或 AI
              合规摩擦显示公司可扩展性低于品类叙事，就不要建立强信念。这是一家值得放在尽调名单里的好公司，但不是一个只凭公开记录就能认可的价格。
