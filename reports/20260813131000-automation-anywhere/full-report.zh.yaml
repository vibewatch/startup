      - 可监控触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 安全 / 隐私失败
        - 公开事故或整改证据薄弱
        - 面向客户的重大泄露、补丁采用延迟，或隐私响应流程失效
        - 立即下调信任、采购速度和扩张假设。
      - - AI 监管合规缺口
        - 欧盟或加州工作流合规边界不清
        - 尽调无法把主要工作流映射到可落地的 AI Act 和隐私控制
        - 在合规责任归属明确前，视为受监管工作流上行空间受损。
      - - 合作伙伴依赖冲击
        - 超大规模云厂商或模型供应商扰动
        - 定价、政策或路线图变化显著恶化部署经济性或功能质量
        - 下调护城河假设，因为太多杠杆掌握在公司外部。
      - - 集中度与持续性不达预期
        - 私有数据暴露留存疲弱或头部客户依赖沉重
        - NRR 或 GRR 不及预期，或头部客户集中度显著高于预期
        - 把入场价格从押注增长切到保本优先。
      - - Aisera / 智能体执行不达预期
        - 集成复杂或附加销售低
        - 产品集成延期、服务负担飙升，或新 AI 模块附加销售停滞
        - 质疑智能体重估逻辑，并下调终局倍数假设。
      - - 可靠性与变更管理承压
        - 维护和发布状态恶化
        - 客户访谈出现停机、回滚事件或长期维护痛点
        - 在信心提升前，提高事故运营尽调要求。
    notes: 触发因素聚焦最直接伤害投资逻辑的少数事件。
