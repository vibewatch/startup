  title: Valuation freshness is the largest overview risk
  body: The last clean official valuation fact is still the November 2019 $6.8B Series B. Current valuation and 2024 round claims are visible only through low-confidence secondary-market sources, so any investment view that assumes the company is still near its peak mark would be relying on stale history rather than current evidence.
  claimRefs:
  - CO014
