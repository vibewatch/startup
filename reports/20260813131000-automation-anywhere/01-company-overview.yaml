- id: section-5
  title: Milestones that matter for the rest of the diligence
  body: 'The milestone record explains why this company merits both product optimism and valuation caution. Automation Anywhere was founded in 2003, rebranded in 2010, raised large private rounds in 2018 and 2019, bought FortressIQ in 2021 to add process discovery, and in June 2024 formally launched its AI + Automation Enterprise System to reposition around agentic automation. Fiscal 2025 then layered on commercially important proof points: the largest non-GAAP bookings quarter in company history, a 38% APA attach rate, and Forrester/Gartner validation. In 2025 the company added Jeff Immelt to the board and acquired Aisera, then in 2026 reported that AI now drives a majority of software bookings. The picture is of a company still capable of shipping, selling, and partnering at scale, but one whose public-market story must be re-underwritten from operations rather than legacy unicorn marks.'
