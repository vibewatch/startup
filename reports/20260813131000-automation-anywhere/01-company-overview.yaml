  title: Leadership and headcount datasets are not synchronized
  body: Automation Anywhere’s own site and third-party company-profile services disagree on the CFO name and current employee count. That does not imply a governance failure by itself, but it is a reminder that this company still needs a primary diligence packet for management roster, board composition, and workforce scale.
