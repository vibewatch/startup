company:
  name: Automation Anywhere
chapter:
  number: 1
  title: Company Overview
  summary: 'Automation Anywhere is a San Jose-founded private automation software company that is repositioning itself from classic robotic process automation to agentic process automation. The best-supported public facts are a 2003 founding, co-founder/CEO Mihir Shukla still in control, a $290 million 2019 Series B at a $6.8 billion post-money valuation, and a 2024-2026 operating narrative built around APA, the Process Reasoning Engine, and Aisera. The main diligence tension is valuation and disclosure freshness: secondary-market sources imply a roughly $1.5-2.0 billion current mark and ~2.1k-2.6k employees, but Automation Anywhere still withholds exact ARR, revenue, customer count, and cap-table detail.'
sections:
- id: section-1
  title: Identity, headquarters, and the shift from RPA to agentic process automation
  body: 'Automation Anywhere’s current official framing is unambiguous: the company calls itself “the Agentic Process Automation company,” positions its system as a cloud-native orchestration layer that sits above enterprise software, and says it created classic RPA in 2003 before introducing APA in 2024. The homepage, about page, and product pages all reuse the same story arc: the company now sells governed orchestration across AI agents, RPA, APIs, documents, and people rather than standalone bots. Public third-party summaries still describe the company as a digital-workforce or RPA vendor, but they broadly agree on the same core identity: a private enterprise software company founded in San Jose, California, selling automation software to large organizations. The reusable ground truth for later chapters is therefore a legacy RPA vendor trying to re-rate as an AI-native enterprise automation platform without abandoning its installed base.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO017
