- id: section-2
  title: Founders, leadership bench, and public-governance ambiguity
  body: 'Mihir Shukla remains the central control point in every public source captured in this run: the official about page names him Chairman and CEO, and third-party profiles still tag him as CEO and co-founder. Ankur Kothari is still publicly identified as COO and co-founder, while Nancy Hauge is presented as the people leader. The leadership picture becomes noisier below that level. The official site names Vikram Khosla as CFO, but TipRanks still lists James Budge as CFO and Chris Riley as CRO as of August 2026, implying that external company-profile databases lag or are inconsistent. Public founder records are also not fully harmonized: Wikipedia preserves a broader original-founder set including Neeti Mehta Shukla and Rushabh Parmani, whereas current corporate storytelling focuses on Mihir Shukla and Ankur Kothari. That inconsistency is not fatal, but it means the board, succession, and full founder-cap-table story still need primary confirmation.'
