companyProfile:
  summary: >-
    Automation Anywhere is a San Jose-based private enterprise software company founded in 2003 that
    is repositioning from classic robotic process automation toward agentic process automation.
    Public evidence supports a broad platform spanning orchestration, AI agents, document automation,
    process discovery, integrations, and governed enterprise workflows. Customer proof is real across
    banking, healthcare, public sector, finance, and customer service. However, the company still
    withholds several valuation-critical metrics, including current ARR or revenue, gross margin,
    retention cohorts, customer concentration, and full cap-table terms.
  foundedDate: '2003-01-01'
  founders:
    - name: Mihir Shukla
      role: Co-founder, Chairman & CEO
      background: Co-founder and long-time chief executive driving the shift from RPA to APA.
      claimRefs: [CO005]
    - name: Ankur Kothari
      role: Co-founder & COO
      background: Publicly listed co-founder and operating leader.
      claimRefs: [CO006]
  foundingLocation: San Jose, California, United States
  headquarters: San Jose, California, United States
  productSummary: >-
    Automation Anywhere offers an enterprise automation stack centered on the Agentic Process
    Automation platform, PRE, AI Agent Studio, Automation Co-Pilot, Document Automation, Process
    Discovery, integrations, and workflow assets for finance, service operations, banking, and
    healthcare use cases.
  customerFocus: >-
    Large enterprises and regulated operations teams that need cross-system workflow automation,
    document-heavy process automation, governed AI agents, and high-volume service or compliance
    workflows.
  businessModel: >-
    Enterprise software platform monetized through large-account subscriptions and attached AI /
    automation modules, with expansion increasingly tied to installed-base attach, AI-led upsell,
    and broader workflow coverage across ITSM, HR, customer service, finance, and operations.
  stage: Late-stage private
  fundingStatus: >-
    Public valuation markers show a sharp reset from the official $6.8B 2019 Series B peak to about
    $2.0B in October 2024 (Premier Alternatives) and about $1.47B in a Yahoo Finance-derived August
    2026 mark. Total publicly surfaced capital is roughly $815M, but current cap-table detail and
    exact round structure remain incomplete in public materials.
