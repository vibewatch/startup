- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding status
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - UiPath
    - Direct peer / pure-play automation platform
    - Public company
    - Enterprise automation, agentic orchestration, process intelligence
    - Deep automation suite with agent builder, orchestration, and test/process layers
    - Still competes in a crowded field and enterprises may already own adjacent suites.
  - - Microsoft Power Automate
    - Bundled incumbent / suite substitute
    - Mega-cap public company
    - Broad M365, Dynamics, and Power Platform installed base
    - 1,400+ connectors, desktop RPA, and budget adjacency inside existing Microsoft estates
    - Pure-play automation depth may be weaker than specialist vendors in some enterprise cases.
  - - ServiceNow
    - ITSM / workflow incumbent expanding into agentic automation
    - Public company
    - IT, customer service, HR, risk, app platform
    - Built-in AI agents, agent fabric, control tower, and system-of-work ownership
    - Strongest where ServiceNow already owns the workflow system of record.
  - - Pega
    - Governed workflow and decisioning incumbent
    - Public company
    - Regulated, mission-critical enterprise workflows
    - Auditability, process structure, and long enterprise-trust history
    - Often associated with complex transformation programs rather than lightweight adoption.
  - - SS&C Blue Prism
    - Direct RPA peer / regulated enterprise automation
    - Backed by SS&C Technologies
    - Complex and regulated enterprise operations
    - Governance-first AI platform combining RPA and AI with audit trails
    - Less obvious low-friction self-serve entry than Microsoft or open workflow tools.
  - - IBM watsonx Orchestrate
    - Adjacent enterprise AI orchestration entrant
    - Large public company
    - Cross-functional enterprise agent control plane
    - Open, hybrid, secure agent orchestration connected to existing enterprise systems
    - More adjacent to IBM's broader AI and services estate than a pure automation specialist.
  - - Salesforce Agentforce
    - Adjacent CRM/service platform entrant
    - Large public company
    - Service, sales, field service, employee service, IT service
    - Deep CRM data context, MuleSoft connectors, and broad installed base
    - Strongest inside Salesforce-centered customer and employee workflows.
  - - n8n
    - Internal-build / developer-led substitute
    - Private workflow automation vendor
    - Developers, technical teams, cost-sensitive automation buyers
    - On-prem option, 500+ integrations, workflow transparency, human-in-the-loop controls
    - Not a full like-for-like substitute for large enterprise transformation programs.
  notes: Direct peers, bundled incumbents, adjacent platforms, and build-like substitutes are mixed intentionally because buyers can solve the same job in different ways.
