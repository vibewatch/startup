- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Installed-base automation footprint
    - Microsoft or ServiceNow displaces expansion through bundle economics
    - high
    - Request cohort win/loss data versus suite incumbents by workflow family.
  - - PRE and APA differentiation
    - Similar agentic-orchestration narratives from UiPath, ServiceNow, Pega, Blue Prism, IBM, and Salesforce
    - high
    - Require proof that PRE materially changes deployment success, not just messaging.
  - - Vertical workflow packaging
    - Competitors launch similar prebuilt agents and workflow templates
    - medium
    - Compare production win rates in AP, support, banking, and healthcare.
  - - Governance and compliance posture
    - Pega, ServiceNow, and Blue Prism also emphasize auditability and policy controls
    - medium
    - Benchmark deployment controls and regulated-reference wins side by side.
  - - Pure-play automation depth
    - Open workflow tools or in-house agent stacks absorb smaller use cases before enterprise platform evaluation
    - medium
    - Test whether departmental pipeline converts into platform-standardization deals.
  - - Sales-led enterprise motion
    - Opaque pricing and long evaluation cycles can weaken competitiveness in cost-sensitive deals
    - medium
    - Ask for discounting, sales-cycle length, and implementation-cost data against UiPath and Microsoft.
  notes: Severity reflects competitive pressure on future expansion and pricing power, not a prediction that any one rival will win all segments.
