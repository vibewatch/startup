- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Public price / contract model
  - Included capabilities signaled publicly
  - Discounts / unknowns
  - Implication
  rows:
  - - Automation Anywhere
    - Contact sales / enterprise contract
    - Agentic solutions, APA platform, industry workflows
    - No clean public list price located in cited sources
    - Buyers must evaluate through sales-led enterprise motion.
  - - UiPath
    - Basic starting at $25 per month; higher tiers contact sales
    - Enterprise automations, agents, data extraction, orchestration, governance, on-prem options
    - Realized enterprise pricing not shown publicly
    - Clearer self-serve entry than most peers, but serious deployments still move into negotiated contracts.
  - - Microsoft Power Automate / Copilot Studio
    - Public plan and capacity pricing pages
    - Cloud flows, desktop RPA, connectors, process mining entitlements, Copilot credits
    - Page warns actual price varies by region, org, and consumption
    - Strong for buyers already standardizing on Microsoft licensing.
  - - ServiceNow
    - Contact sales
    - AI agents, agent fabric, control tower, autonomous workforce
    - No public list pricing on cited page
    - Packaging advantage likely comes from existing platform ownership rather than transparent price.
  - - Salesforce Agentforce
    - Free start plus Flex Credits, conversations, or per-user licensing
    - Agent builder, flows, MuleSoft APIs, CRM data grounding
    - Real enterprise spend depends on usage and packaging
    - Powerful wedge for customer-facing and service-centric deployments.
  - - Pega / IBM / Blue Prism
    - Primarily sales-led enterprise pricing
    - Governed orchestration, modernization, or agentic automation capabilities
    - Public realized pricing not visible in cited sources
    - Pricing opacity raises diligence importance around TCO and implementation scope.
  notes: Public list pricing is not realized enterprise pricing; comparison is intended to show transparency and packaging posture rather than normalized TCV.
