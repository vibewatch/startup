        title: Capital adequacy, balance-sheet uncertainty, and legal-entity disclosure
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy is the hardest financial question in this chapter because Automation Anywhere has not
              published cash on hand, debt, burn, or runway. The company does say it exceeded EBITDA guidance,
              strengthened cash balance, increased free cash flow, and reached 10 consecutive quarters of non-GAAP
              profitability by April 2026, which collectively point away from the stereotype of a cash-burning
              automation vendor. Yet that does not replace a balance sheet. The last clean official financing facts
              remain the 2018 $250 million Series A at a $1.8 billion valuation and the 2019 $290 million Series B at a
              $6.8 billion post-money valuation. Secondary sources imply a materially lower current mark around 2024,
              but without primary confirmation. The UK subsidiary's Companies House record is useful only in a limited
              way: it proves ongoing filing activity, full accounts at the entity level, and director changes, but not
              the group's true liquidity or preference stack. Financial comfort must therefore remain conditional until
              management shares primary capital data.
