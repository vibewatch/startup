    Automation Anywhere is a San Jose-based private enterprise software company founded in 2003 that is repositioning
    from classic robotic process automation toward agentic process automation. Public evidence supports a broad platform
    spanning orchestration, AI agents, document automation, process discovery, integrations, and governed enterprise
    workflows. Customer proof is real across banking, healthcare, public sector, finance, and customer service. However,
    the company still withholds several valuation-critical metrics, including current ARR or revenue, gross margin,
    retention cohorts, customer concentration, and full cap-table terms.
