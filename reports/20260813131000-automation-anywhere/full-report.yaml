      - number: '8.2'
        title: The company-quality case is good, but the price case still depends on hidden economics
        blocks:
          - type: paragraph
            body: >-
              The pro-investment case is straightforward. Automation Anywhere has a coherent enterprise automation
              platform, growing AI-led modules, real customer proof across finance, healthcare, public sector, and
              customer service, and enough disclosed profitability and cash-balance language to reduce near-term
              solvency fear. It also has plausible strategic relevance to large platform buyers or IPO investors because
              the market remains important and the company is repositioning from legacy RPA toward agentic orchestration
              and self-service automation. The Aisera acquisition adds another reason to pay attention: it expands the
              buyer map into ITSM, HR, and customer service and pushes the story toward a broader autonomous-enterprise
              platform.

              The anti-thesis is also clear. Public evidence does not show today's ARR, gross margin, NRR, GRR, churn,
              services mix, concentration, or cap-table preferences. Those are exactly the variables that determine
              whether a private software company deserves a premium multiple. The recent public-only evidence can prove
              that Automation Anywhere is real and strategically relevant; it cannot prove that the current price offers
              enough margin of safety. The right conclusion is therefore not a quality judgment but a price judgment:
              compelling asset, incomplete underwriting.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
