            body: >-
              The milestone record explains why this company merits both product optimism and valuation caution.
              Automation Anywhere was founded in 2003, rebranded in 2010, raised large private rounds in 2018 and 2019,
              bought FortressIQ in 2021 to add process discovery, and in June 2024 formally launched its AI + Automation
