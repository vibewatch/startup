      - number: '3.2'
        title: Capability overlap and where buyers may perceive differentiation
        blocks:
          - type: paragraph
            body: >-
              Vendor messaging has converged sharply. Automation Anywhere's APA story centers on PRE, AI-agent
              orchestration, and ready-to-deploy finance and support workflows. UiPath now describes a single control
              plane that coordinates agents, robots, systems, and humans, with agent builder, Maestro orchestration,
              process intelligence, and healing agents. ServiceNow promotes built-in AI agents plus agent fabric and
              control-tower governance inside an IT and service-management installed base. Pega emphasizes predictable,
              auditable orchestration for mission-critical and regulated workflows, while Blue Prism frames agentic
              automation as RPA plus AI on one governed enterprise platform. IBM and Salesforce both push open,
              enterprise-controlled agent platforms that connect across existing systems. Buyers therefore are not
              choosing between “AI” and “non-AI” vendors; they are comparing different control planes, distribution
              positions, and workflow entry points.
