  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue-quality miss
        - Private diligence shows revenue materially below the level needed to support even reset marks
        - The comp case breaks because implied multiples become too high
        - Walk away or require a much lower entry price.
      - - Retention or concentration disappointment
        - NRR/GRR are weak or a small set of accounts drives too much revenue
        - Upside gets repriced as fragile rather than compounding
        - Treat the business as higher risk and lower terminal multiple.
      - - Security or AI-compliance incident
        - A material breach, remediation failure, or workflow-level compliance problem emerges
        - Trust, procurement speed, and expansion assumptions all weaken together
        - Cut scenario ranges and require much stricter diligence.
      - - Aisera / agentic integration failure
        - Attach stalls, service burden rises, or integration support churns customers
        - The new growth wedge stops justifying premium platform logic
        - Re-rate toward mature automation multiples.
      - - Preference-stack overhang
        - Cap-table terms materially reduce common-equity upside
        - Good company performance may still fail to produce acceptable returns
        - Rebuild return model before pursuing.
    notes: These are the few events that would most directly alter the recommendation.
