        title: Public-comp benchmarks and the financial verdict
        blocks:
          - type: paragraph
            body: >-
              Public automation and workflow-software peers show the kind of economics Automation Anywhere could
              plausibly reach if its model is truly software-led. Macrotrends' archived public-comp pages show UiPath
              with roughly $1.43 billion of FY2025 revenue and about 82.7% gross margin near January 2025, ServiceNow
              around 78.1% gross margin by September 2025, Pegasystems near 75.8% by December 2025, Salesforce near
              77.7% by January 2026, and Microsoft near 68.6% by December 2025. Those benchmarks do not prove Automation
              Anywhere's economics, but they make one thing clear: if the company is primarily licensing software and
              expanding inside an installed base, it could support strong margins. If instead its deployments depend
              heavily on services, discounting, or customer-specific implementation, margin quality may sit materially
              lower. Because public evidence does not settle that question, the right verdict is not “bad economics”; it
              is “insufficient disclosure on an otherwise promising software model.” That leaves underwriting stuck
              between encouraging operating signals and incomplete primary evidence.
