  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere's highest-severity public risks come from trust-sensitive execution rather than from a
              single known legal blow-up. The platform is explicitly sold into banking, healthcare, HR, customer
              service, and government-adjacent workflows where a security issue, privacy failure, or unreliable AI
              action can damage procurement momentum quickly. Rapid7's 2024 disclosure of an unauthenticated SSRF
              vulnerability in Automation 360 v21-v32 is the clearest public adverse signal because it shows that the
              company operates inside a real enterprise attack surface, not just a marketing environment. The status
              page adds a second operational clue: Automation Anywhere runs a large regional cloud footprint and
              repeatedly publishes planned updates that may interrupt service, which is good transparency but also proof
              of ongoing release-complexity risk.

              The next tier of risk is strategic dependency. Automation Anywhere's modern product story leans on
              third-party models, hyperscalers, and partner ecosystems rather than on a closed proprietary stack. That
              broadens customer choice and speeds distribution, but it also leaves platform performance, pricing, model
              policy, and some booking momentum partly outside the company's control. Customer evidence makes the
              commercial implication clear: growth depends on expansion inside large regulated accounts, yet current
              public materials still do not disclose NRR, GRR, churn, contract length, or revenue concentration. That
              means the investment case can observe demand and customer proofs, but cannot fully observe the fragility
              of the underlying revenue base.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
              - CR012
              - CR013
              - CR021
              - CR026
              - CR029
              - CR031
              - CR032
              - CR040
