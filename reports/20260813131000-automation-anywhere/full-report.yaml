        title: Scale indicators, commercial momentum, and analyst validation
        blocks:
          - type: paragraph
            body: >-
              Because Automation Anywhere is private, scale has to be inferred from operating indicators rather than
              audited statements. The best public signals are commercial and workforce oriented. Official FY2024-FY2026
              updates point to high customer retention, a quarter where large deals rose 14% year over year,
              million-dollar-plus deal growth above 150% in FY2025, 30%+ RPO growth, 90% APA booking growth, and 61% of
              Q4 software bookings coming from AI-powered offerings by April 2026. The same sources say customers with
              more than $1 million of ARR rose 23% and the agentic customer base more than doubled. Headcount estimates
              are directionally consistent with a mid-sized private software company but not perfectly aligned: Revelio
              estimates 2,572 employees in March 2026 after a 2024 trough, while TipRanks reports 2,100 in August 2026.
              Gartner’s 2024 market-share note that UiPath, Microsoft, and Automation Anywhere were the leading RPA
              vendors still corroborates category relevance even as the company tries to migrate the narrative toward
              APA.
