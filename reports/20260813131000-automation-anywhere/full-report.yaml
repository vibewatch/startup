  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context is real, but public price support is inconsistent
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere's financing history clearly shows a company that once commanded peak-cycle RPA
              valuation and has since repriced. The 2018 official Series A announcement set a $1.8B post-money value and
              described triple-digit growth, 98% retention, and more than 1,000 global customers. The private-market
              markers now tell a different story. Yahoo Finance's AUAN.PVT page shows a derived estimated valuation of
              about $1.47B as of August 2026, while Premier Alternatives shows a current valuation of about $2.0B as of
              October 2024 tied to the $174M round and total funding of roughly $815M. Those marks are not identical and
              they are not perfect, but they agree on the important point: the company has already come off its old
              $6.8B peak.

              That reset matters for valuation discipline. It means the market has already recognized that late-stage
              automation software is no longer being priced on narrative alone. Automation Anywhere's public story still
              has many strengths—AI-led upsell, customer migration, million-dollar ARR growth, attach-rate expansion,
              and broad partner traction—but the company's willingness to disclose absolute financial detail remains
              limited. Public investors and secondaries markets can therefore observe momentum and direction, yet still
              cannot independently verify the revenue base needed to justify even the reset valuation confidently.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
