  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition, module map, and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              The company is no longer describing itself as a bot vendor. Its core product is the Agentic Process
              Automation platform, which unifies AI agents, RPA, orchestration, and human approvals across enterprise
              systems. Around that core, Automation Anywhere has now assembled a fairly clear module map: Process
              Reasoning Engine for reasoning and orchestration, AI Agent Studio for low-code agent creation, Automation
              Co-Pilot for in-app human interaction, Document Automation for document-centric workflows, Process
              Discovery for workflow mining, Integrations for app and API connectivity, and the Agentic App Store for
              reusable assets. The solution pages tie those modules to specific jobs such as accounts payable, customer
              support, service operations, retail banking, and healthcare RCM. This module clarity matters because it
              suggests the platform is trying to own more of the automation lifecycle—from finding the workflow, to
              building the agent, to executing work, to governing outcomes—rather than selling a single runtime feature.
              That breadth should improve cross-sell potential, but it also increases implementation, governance, and
              product-coordination demands over time overall.
