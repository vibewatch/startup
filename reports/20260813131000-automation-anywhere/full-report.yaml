      - number: '1.3'
        title: Capital formation, valuation reset, and what is actually supportable
        blocks:
          - type: paragraph
            body: >-
              The cleanest financing facts are historical, not current. Official and PRNewswire records confirm a $250
              million 2018 Series A at a $1.8 billion valuation and a $290 million 2019 Series B at a $6.8 billion
              post-money valuation led by Salesforce Ventures with participation from major prior backers. After that,
              the public record degrades sharply. Secondary-market data providers now imply a very different private
              mark: Premier Alternatives reports a $2.0 billion valuation as of 8 October 2024 and a $174 million
              October 2024 round, while Yahoo Finance’s Forge-derived private-company page shows only that market
              participants are still marking the company in 2026. Those sources are useful directional signals, but they
              are not equivalent to a company-announced financing round. The investable conclusion is that public
              evidence supports a large markdown from the last official 2019 mark, while exact post-2019 round terms,
              total capital raised, and ownership dilution remain under-documented.
