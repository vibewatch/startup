      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public packaging visibility is uneven, which itself is informative. UiPath exposes a public entry point at
              $25 per month for Basic and then moves enterprises into contact-sales tiers with agent, governance, and
              on-prem features. Microsoft exposes public plan and capacity structures for Power Automate and Copilot
              Studio, but the page also warns that enterprise pricing varies by region, organization, and credit
              consumption. Salesforce is similarly explicit that customers can start free and then pay via Flex Credits,
              conversations, or per-user licensing. By contrast, Automation Anywhere, ServiceNow, Pega, IBM, and Blue
              Prism mostly keep enterprise realized pricing off-page, forcing the buyer into a sales process. That means
              the real packaging battle is less about published list price and more about whether automation is sold as
              a net-new budget line or hidden inside an existing suite. Microsoft and ServiceNow are strongest on that
              distribution axis; Automation Anywhere and UiPath remain stronger on pure-play automation depth. n8n adds
              a different kind of pressure by publishing hosted and self-hosted tiers with concurrency, AI-credit, and
              SSO/version-control signals that can make a lighter departmental workflow stack look cheaper and faster to
              try before an enterprise-wide platform decision is made.
            claimRefs:
              - CP017
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
