      - number: '2.2'
        title: Sizing lenses, publisher contradictions, and what is actually underwritable
        blocks:
          - type: paragraph
            body: >-
              Public market-size estimates for Automation Anywhere's category are directionally useful but not
              internally consistent. Gartner's 2024 market-share analysis gives the most defensible narrow floor: the
              worldwide RPA software market grew 14.5% to $3.6 billion in 2024, even as AI innovations slowed the
              category's growth rate. Future Market Insights publishes a larger and more forward-looking view, sizing
              the market at $5.7 billion in 2026 with an 18.2% CAGR through 2036. MarketsandMarkets publishes a still
              broader public estimate of roughly $9 billion in 2025 and nearly $48 billion by 2036, while Technavio
              projects $54.27 billion of incremental growth from 2025 to 2030 at a 41.3% CAGR. Those numbers should not
              be collapsed into a false consensus. They use different years, segment definitions, and inclusion rules
              for software versus services versus AI-enhanced automation. The safest underwriting view is therefore a
              bridge-market approach: a narrow single-digit-billion core RPA software category, a somewhat larger
              intelligent-automation platform category, and a still larger but much less isolatable agentic-operations
              budget.
            claimRefs:
