        - Absolute current ARR or revenue and booked-to-recognized bridge
        - This is the core missing input behind every implied-multiple test
        - CFO diligence and audited or board-level reporting.
      - - Gross margin and services mix
        - Gross margin by product and implementation model
        - Services-heavy delivery should not receive premium workflow-platform pricing
        - Finance and delivery-lead review.
      - - Retention and concentration
        - NRR, GRR, churn, contract length, and top-customer exposure
        - Determines whether growth is compounding or fragile
        - CRO and finance cohort tables.
      - - Cap table and preferences
        - Liquidation preferences, anti-dilution, options, and security rights
        - Return math can change dramatically even if enterprise value is attractive
        - Counsel and cap-table export.
      - - Aisera integration economics
        - Attach, churn, support burden, and cross-sell performance after acquisition
        - Determines whether the ITSM/HR/CX wedge is additive or distracting
        - Product and GTM diligence.
      - - Security / compliance operating history
        - Incident log, patch-remediation evidence, and AI-governance ownership in top workflows
        - Risks chapter shows this can reprice the business quickly
        - Security team review and customer references.
    notes: Ordered by what would most directly move recommendation and price discipline.
