    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and the shift from RPA to agentic process automation
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere’s current official framing is unambiguous: the company calls itself “the Agentic
              Process Automation company,” positions its system as a cloud-native orchestration layer that sits above
              enterprise software, and says it created classic RPA in 2003 before introducing APA in 2024. The homepage,
              about page, and product pages all reuse the same story arc: the company now sells governed orchestration
              across AI agents, RPA, APIs, documents, and people rather than standalone bots. Public third-party
              summaries still describe the company as a digital-workforce or RPA vendor, but they broadly agree on the
              same core identity: a private enterprise software company founded in San Jose, California, selling
              automation software to large organizations. The reusable ground truth for later chapters is therefore a
              legacy RPA vendor trying to re-rate as an AI-native enterprise automation platform without abandoning its
              installed base.
