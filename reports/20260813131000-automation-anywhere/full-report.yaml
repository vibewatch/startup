  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere should be bounded from the workflows it actually tries to automate, not from every
              dollar labeled enterprise AI. Its current product surfaces describe an Agentic Process Automation system
              that combines AI agents, classic RPA, orchestration, document extraction, and human approvals across
              existing enterprise systems. That means the most relevant spend pools are core RPA software, intelligent
              document processing, agentic service-operations automation, and cross-functional workflow orchestration
              for finance, IT, support, healthcare, and banking use cases. The boundary should exclude generic ERP and
              CRM seat spend, pure foundation-model experimentation that never reaches production workflow execution,
              and one-off internal scripting that never becomes an enterprise control plane. The practical substitute
              set is broad: manual shared-services labor, outsourced back-office processing, service-desk teams working
              through disconnected tools, point automations inside Microsoft or ServiceNow estates, and legacy bot
              programs that handle rules but not reasoning or exceptions. This is why the company is trying to move the
              conversation from task bots to governed, cross-system execution.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
