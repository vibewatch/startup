      - number: '8.3'
        title: Public comp bands imply that even the reset valuation needs substantial hidden revenue proof
        blocks:
          - type: paragraph
            body: >-
              The best public shorthand here is not a precise DCF or a made-up venture return model. It is a rough comp
              band anchored to public automation and workflow software names. Yahoo Finance gives current
              enterprise-value-to-revenue ratios of about 4.10x for UiPath, 2.96x for Pegasystems, 3.97x for SS&C, 9.20x
              for ServiceNow, and 11.26x for Microsoft; StockAnalysis gives the associated revenue bases, which helps
              show the scale difference between Automation Anywhere and the public leaders. The most relevant direct
              comp band is therefore roughly 3x-4x on slower or more mature automation peers, with ServiceNow as a
              premium ceiling because it has much broader workflow ownership and public-market credibility.

              That creates a simple discipline test. At a $2.0B mark, Automation Anywhere would imply about 40x on $50M
              of revenue, 20x on $100M, 13.3x on $150M, and 10x on $200M. At Yahoo's $1.47B mark, those fall to about
              29.4x, 14.7x, 9.8x, and 7.4x. In other words, even the reset marks still ask investors to assume a fairly
              substantial current revenue base and decent software economics. Unless private diligence reveals something
              like nine-figure recurring revenue with good retention and margins, public evidence alone cannot justify
              treating the company as a bargain.
            claimRefs:
