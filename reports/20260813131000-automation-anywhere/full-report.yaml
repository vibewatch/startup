  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape across direct peers, suites, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than classic RPA peer lists. UiPath and SS&C Blue Prism are the closest
              direct automation peers because they explicitly combine legacy RPA with newer agentic or orchestration
              layers. Microsoft and ServiceNow are the hardest incumbents to dislodge because they can bundle automation
              into larger productivity, CRM, or ITSM budgets that many enterprises already own. Pega competes where
              governed, mission-critical process orchestration matters more than bot count, while IBM and Salesforce are
              using agent-control-plane narratives to expand from adjacent workflow, service, and enterprise-data
              positions. n8n represents a different substitute class: it is not the same kind of large-enterprise sales
              motion, but it can absorb developer-led or cost-sensitive automation work that might otherwise have become
              a platform evaluation. The practical implication is that Automation Anywhere must win against both
              software alternatives and the buyer's existing system-of-record stack, not just another RPA vendor in
              practice.
            claimRefs:
