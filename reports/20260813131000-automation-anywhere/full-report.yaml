        title: Switching costs, moat durability, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Automation Anywhere does have real competitive assets, but they are narrower than the market narrative
              suggests. The company still benefits from a long-lived enterprise automation installed base, official
              evidence of attach-rate expansion, and solutionized packaging in finance, support, banking, and
              healthcare. It also has a credible governance and enterprise-compliance story. But moat durability is
              challenged by three forces. First, the narrative is commoditizing: nearly every major platform now claims
              governed, auditable, cross-system AI orchestration. Second, incumbent distribution is powerful: Microsoft,
              ServiceNow, and Salesforce can surface automation within pre-existing account control. Third,
              lighter-weight internal-build and workflow tools reduce the need for a full enterprise platform in smaller
              or departmental use cases. The result is a market where Automation Anywhere can still win, but mostly by
              proving faster time-to-value, better workflow packaging, or clearer enterprise controls than bundled
              alternatives.
