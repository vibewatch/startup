  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what can actually be inferred from public disclosures
        blocks:
          - type: paragraph
            body: >-
              The revenue model looks software-like and recurring, even though Automation Anywhere does not publish
              audited statements. The company repeatedly discloses software bookings, ARR, million-dollar-plus ARR
              customers, remaining performance obligations, and installed-base attach rates. Those are not the metrics
              of a hardware manufacturer or a pure consulting firm; they are the vocabulary of an enterprise software
              platform sold through contracts that renew and expand over time. The official pages also suggest
              monetization is layered: the core platform, orchestration, AI-powered solutions, and workflow-specific
              packages in finance, support, and service operations. What remains missing is the split between core
              subscription revenue, usage or AI-linked monetization, professional services, and customer support. Public
              evidence therefore supports the mechanism of monetization, but not the absolute mix or recognized revenue
              composition. That distinction matters because software revenue and services revenue support very different
              margin and valuation assumptions.
