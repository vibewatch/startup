- id: regulatory-and-legal
  title: Regulatory, privacy, and legal risk are rising with the agentic expansion
  body: >-
    The company's regulatory exposure is increasing because its most attractive workflows overlap
    with categories that regulators increasingly care about: customer service, employment-facing
    operations, financial-services workflows, healthcare administration, and public-service
    processes. The European Commission's AI Act framework makes this explicit. The law is now
    applicable as of August 2026, transparency rules are live, GPAI obligations are already in
    force, and high-risk categories such as employment and access to essential services carry more
    stringent obligations over 2027-2028. Automation Anywhere is not necessarily a direct provider
    of every high-risk system listed in the Act, but its tooling is clearly close enough to these
    workflows that EU transparency, logging, robustness, and oversight expectations matter.

    California privacy law creates a parallel risk surface. The California Attorney General's CCPA
    guidance highlights delete, correct, opt-out, and sensitive-information limits, plus statutory
    damages in certain data-breach situations. Automation Anywhere's own privacy policy, last
    modified April 1, 2026, confirms it collects and processes website, commercial-engagement, and
    service-related information, shares data with affiliates, partners, and service providers, and
    contemplates cross-border transfers under mechanisms such as standard contractual clauses. That
    is not unusual for enterprise software, but it means a privacy or security lapse could travel
    directly into legal, procurement, and customer-trust consequences.

    The public legal surface is decent but incomplete. Website Terms disclaim warranties, accuracy,
    uninterrupted availability, and broad liability on the public sites, which is a reminder that
    investors need actual customer contract samples, DPAs, and incident-response commitments rather
    than website language alone. Companies House filings show the UK entity remains active and up to
    date, but micro-company accounts and routine confirmation statements add very little operational
    visibility. The correct risk read is therefore not "legal trouble found," but rather "legal and
    regulatory diligence burden remains high."
