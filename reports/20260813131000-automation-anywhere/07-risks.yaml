    type: third-party-reported
    topic: remediation
    sourceRefs: [SR006]
    confidence: medium
    freshness: recent
    answersQuestionRefs: [QR003]
  - id: CR005
    statement: The security page also lists SOC 1 Type 2, SOC 2 Type 2, ISO 27001, HITRUST, ISO 22301, encryption, RBAC, SAML, MFA, SIEM, and audit-trail controls.
    type: company-claimed
    topic: compliance-controls
    sourceRefs: [SR002]
    confidence: medium
    freshness: current
    answersQuestionRefs: [QR005, QR006]
  - id: CR006
    statement: Automation Anywhere's privacy policy was last modified on April 1, 2026 and explicitly covers website, commercial-engagement, and service-related personal-information handling.
