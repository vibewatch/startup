- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security / privacy failure
    - Public incident or weak remediation evidence
    - Material customer-facing breach, delayed patch adoption, or failed privacy-response process
    - Re-rate trust, procurement velocity, and expansion assumptions downward immediately.
  - - AI-regulation compliance gap
    - EU or California workflow compliance ambiguity
    - Diligence cannot map major workflows to workable AI-act and privacy controls
    - Treat regulated-workflow upside as impaired until compliance ownership is clear.
  - - Partner dependency shock
    - Hyperscaler or model-vendor disruption
    - Pricing, policy, or roadmap changes materially worsen deployment economics or feature quality
    - Reduce moat assumptions because too much leverage sits outside the company.
  - - Concentration and durability miss
    - Private data reveals weak retention or heavy top-account dependence
    - NRR or GRR disappoints, or top-customer concentration is materially higher than expected
    - Move from growth-underwrite to capital-preservation mode on entry price.
  - - Aisera / agentic execution miss
    - Integration complexity or low attach
    - Product integration slips, service burden spikes, or attach on new AI modules stalls
    - Challenge the agentic re-rating thesis and lower terminal-multiple assumptions.
  - - Reliability and change-management strain
    - Maintenance and release posture worsens
    - Outages, rollback events, or chronic maintenance pain appear in customer references
    - Increase required diligence on incident operations before conviction rises.
  notes: These triggers focus on the few events that would most directly damage the investment case.
