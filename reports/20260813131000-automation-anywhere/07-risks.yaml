    sourceRefs: [SR003]
    confidence: medium
    freshness: current
    answersQuestionRefs: [QR007]
  - id: CR008
    statement: The privacy policy contemplates cross-border storage and processing, including transfers outside the EEA, Switzerland, and the UK using mechanisms such as standard contractual clauses.
