  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Public sources do not disclose current NRR, GRR, churn, average contract length, or top-customer concentration.
    whyItMatters: These are the most important hidden variables for judging whether customer and partner risks could quickly impair revenue.
    diligencePath: Request renewal cohorts, concentration by top account and vertical, and expansion vs contraction behavior by module.
    relatedQuestionRefs: [QR022, QR023, QR030]
    relatedTableRefs: [TR003, TR005]
    relatedFigureRefs: [FR001]
  - type: private-evidence-only
    severity: material
    topic: incident-and-remediation-history
    missingEvidence: Outside of the status page and one public CVE disclosure, public sources do not provide a robust incident archive, patch-adoption evidence, or uptime history.
    whyItMatters: Enterprise trust and procurement are highly sensitive to how quickly the company detects, communicates, and remediates failures.
    diligencePath: Request security incident log, patch adoption data, penetration-test summaries, SLA attainment, and customer-communication timelines.
    relatedQuestionRefs: [QR002, QR003, QR004, QR005]
    relatedTableRefs: [TR002]
    relatedFigureRefs: [FR002]
  - type: missing-source
    severity: minor
    topic: litigation-and-contract-sampling
    missingEvidence: Public legal materials are insufficient to determine customer-side indemnities, negotiated liability caps, or whether any non-public disputes exist.
    whyItMatters: Liability allocation is central when automation is used in financial, healthcare, employee, and service workflows.
    diligencePath: Have counsel review enterprise MSAs, DPAs, incident clauses, insurance coverage, and docket searches in key jurisdictions.
