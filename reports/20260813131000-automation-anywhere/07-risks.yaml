    statement: The public status page shows a large regional service footprint across Control Room, Process Discovery, Bot Store, Community, and Enterprise Knowledge surfaces.
    type: observed
    topic: operating-footprint
    sourceRefs: [SR005]
    confidence: medium
    freshness: current
    answersQuestionRefs: [QR001, QR004]
  - id: CR003
    statement: Rapid7 disclosed that Automation 360 v21-v32 was vulnerable to unauthenticated SSRF and estimated roughly 3,500 Control Room servers were exposed to the public internet.
    type: third-party-reported
    topic: security-vulnerability
    sourceRefs: [SR006]
    confidence: medium
    freshness: recent
    answersQuestionRefs: [QR001, QR002]
  - id: CR004
