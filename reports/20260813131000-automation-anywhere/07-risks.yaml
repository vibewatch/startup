- id: operational-security-and-dependency
  title: Operational security, reliability, and partner dependence are the most concrete public risks
  body: >-
    Rapid7's CVE-2024-6922 note is the strongest public operating-risk artifact in the diligence
    pack. Rapid7 said Automation 360 v21-v32 was vulnerable to unauthenticated SSRF, estimated that
    roughly 3,500 Control Room servers were exposed to the public internet, and described how the
    issue could be used to reach internal services. Automation Anywhere told Rapid7 the issue had
    already been fixed in version 33 and that customers had been notified, which is an important
    mitigation. Even so, the episode matters because it demonstrates how quickly platform trust can
    turn into enterprise security scrutiny when control-room infrastructure is customer-facing.

    Reliability risk is not just about one CVE. The public status page lists a broad multi-region
    service estate across Control Room, Community, Process Discovery, Bot Store, and Enterprise
    Knowledge components, and many planned updates explicitly warn customers not to schedule
    automations during maintenance windows. That is normal for enterprise cloud software, but it also
    highlights how much workflow continuity depends on release operations and change management. The
    security page partly offsets this with >99.9% SLA language, four-hour RTO/RPO disclosure, and a
    long list of certifications and controls. Still, public incident-history detail remains lighter
    than the importance of the workflows the platform targets.

    Dependency risk is equally material. AI Agent Studio and PRE are built around external model
    options from AWS, Google Cloud, Azure OpenAI, OpenAI, and BYOM, while bookings growth has been
    repeatedly linked to hyperscaler partnerships and newer customer interest powered by Amazon Q.
    The upside is flexibility. The downside is that model-vendor pricing, roadmap shifts,
    availability, or policy changes can flow directly into product economics, feature velocity, and
    customer outcomes. In a platform increasingly positioned as the automation control plane for AI,
    that outside dependency should be treated as a first-order risk, not a footnote.
