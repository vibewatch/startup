  - id: CR001
    statement: Automation Anywhere's security page discloses a cloud-native microservices architecture, 16 global datacenters, >99.9% SLA, and four-hour RTO/RPO commitments.
    type: company-claimed
    topic: reliability-controls
    sourceRefs: [SR002]
    confidence: medium
    freshness: current
    answersQuestionRefs: [QR001, QR005]
