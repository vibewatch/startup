company:
  name: Automation Anywhere
chapter:
  number: 4
  title: Financials
  summary: >-
    Public financial evidence on Automation Anywhere is unusually asymmetrical: the company
    discloses useful momentum indicators around software bookings, ARR cohorts, RPO, attach
    rate, profitability, and free cash flow, but still withholds the absolute revenue, ARR,
    cash, burn, margin, and runway numbers needed for full underwriting. The best-supported
    view is of an enterprise-software business with subscription-like economics and improving
    efficiency, not a capital-intensive hardware or low-margin services company. However,
    exact scale remains hidden. Public comp benchmarks from UiPath, ServiceNow, Pega,
    Salesforce, and Microsoft suggest high gross-margin software can support strong economics
    when implementation burden is controlled, but Automation Anywhere has not disclosed enough
    to prove where it sits on that spectrum. The financial verdict is therefore directionally
    positive on revenue quality and operating discipline, but still blocked by private-company
    disclosure gaps.
sections:
- id: section-1
  title: Revenue model and what can actually be inferred from public disclosures
  body: >-
    The revenue model looks software-like and recurring, even though Automation Anywhere does
    not publish audited statements. The company repeatedly discloses software bookings, ARR,
    million-dollar-plus ARR customers, remaining performance obligations, and installed-base
    attach rates. Those are not the metrics of a hardware manufacturer or a pure consulting
    firm; they are the vocabulary of an enterprise software platform sold through contracts
    that renew and expand over time. The official pages also suggest monetization is layered:
    the core platform, orchestration, AI-powered solutions, and workflow-specific packages in
    finance, support, and service operations. What remains missing is the split between core
    subscription revenue, usage or AI-linked monetization, professional services, and customer
    support. Public evidence therefore supports the mechanism of monetization, but not the
    absolute mix or recognized revenue composition. That distinction matters because software revenue and services revenue support very different margin and valuation assumptions.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: section-2
  title: Growth, efficiency, and revenue-quality signals
  body: >-
    Although Automation Anywhere does not disclose dollar revenue, its public operating
    signals are stronger than the median private software company discloses. The FY2025
    release reported the largest non-GAAP bookings quarter in company history, 150%+ growth
    in million-dollar-plus deals, 30%+ RPO growth, and 90% year-over-year bookings growth
    in the APA system. The April 2026 release added that AI-powered offerings represented 61%
    of fourth-quarter software bookings, that the number of customers above $1 million in ARR
    grew 23%, and that the agentic customer base more than doubled. The Q1 FY2026 PRNewswire
    release then said revenue and ARR reached the high end of expectations while new and
    upsell bookings grew double digits. Together these are credible signs of improving revenue
    quality and land-and-expand behavior. But because absolute revenue, NRR, gross margin, and
    cohort retention remain undisclosed, the signals still stop short of full financial proof.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  tableRefs:
