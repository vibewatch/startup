  - type: conflicting-data
    severity: material
    topic: current-valuation-and-capital-stack
    missingEvidence: Secondary sources imply a current mark near $2.0B, but there is no primary confirmation of whether that reflected a priced round, secondary transaction, or modeled estimate.
    whyItMatters: The size of the valuation reset and any associated preferences matter for dilution, downside protection, and capital adequacy.
    diligencePath: Obtain cap-table updates, investor notices, or signed financing documents for any 2024 or later capital event.
