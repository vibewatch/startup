  figureRefs:
  - FI002
- id: section-3
  title: Capital adequacy, balance-sheet uncertainty, and legal-entity disclosure
  body: >-
    Capital adequacy is the hardest financial question in this chapter because Automation
    Anywhere has not published cash on hand, debt, burn, or runway. The company does say it
    exceeded EBITDA guidance, strengthened cash balance, increased free cash flow, and reached
    10 consecutive quarters of non-GAAP profitability by April 2026, which collectively point
    away from the stereotype of a cash-burning automation vendor. Yet that does not replace a
    balance sheet. The last clean official financing facts remain the 2018 $250 million Series A
    at a $1.8 billion valuation and the 2019 $290 million Series B at a $6.8 billion
    post-money valuation. Secondary sources imply a materially lower current mark around 2024,
    but without primary confirmation. The UK subsidiary's Companies House record is useful only
    in a limited way: it proves ongoing filing activity, full accounts at the entity level, and
    director changes, but not the group's true liquidity or preference stack. Financial comfort
    must therefore remain conditional until management shares primary capital data.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  tableRefs:
  - TI004
  figureRefs:
  - FI004
- id: section-4
  title: Public-comp benchmarks and the financial verdict
  body: >-
    Public automation and workflow-software peers show the kind of economics Automation
    Anywhere could plausibly reach if its model is truly software-led. Macrotrends' archived
    public-comp pages show UiPath with roughly $1.43 billion of FY2025 revenue and about 82.7%
    gross margin near January 2025, ServiceNow around 78.1% gross margin by September 2025,
    Pegasystems near 75.8% by December 2025, Salesforce near 77.7% by January 2026, and
    Microsoft near 68.6% by December 2025. Those benchmarks do not prove Automation Anywhere's
    economics, but they make one thing clear: if the company is primarily licensing software
    and expanding inside an installed base, it could support strong margins. If instead its
    deployments depend heavily on services, discounting, or customer-specific implementation,
    margin quality may sit materially lower. Because public evidence does not settle that
    question, the right verdict is not “bad economics”; it is “insufficient disclosure on an
    otherwise promising software model.” That leaves underwriting stuck between encouraging
    operating signals and incomplete primary evidence.
