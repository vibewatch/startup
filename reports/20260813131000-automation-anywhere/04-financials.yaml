- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue and ARR in dollars
    - Impossible to anchor valuation or scale against direct peers.
    - Request audited annual revenue, current ARR, and quarterly bridge.
  - - Gross margin and services mix
    - Cannot distinguish true software efficiency from implementation-heavy delivery.
    - Request gross margin by revenue stream and partner-services attachment.
  - - Net retention, gross retention, and churn
    - Expansion quality and durability remain unproven.
    - Request cohort retention tables and renewal rates by segment.
  - - Cash, debt, burn, and runway
    - Capital adequacy cannot be underwritten.
    - Request latest balance sheet, debt schedule, and runway model.
  - - Preference stack / post-2019 financing terms
    - Downside protection and dilution cannot be assessed.
    - Request cap table, preference terms, and any secondary transaction documentation.
  notes: These gaps are the minimum data package required to move from directional optimism to investable conviction.
