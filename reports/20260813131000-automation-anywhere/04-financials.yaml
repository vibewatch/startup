  - type: private-evidence-only
    severity: material
    topic: core-financial-statement-pack
    missingEvidence: No public revenue, ARR, gross-margin, balance-sheet, cash-flow statement, or debt schedule is available for underwriting.
    whyItMatters: Without a core financial pack, valuation and capital-adequacy judgments remain directional rather than investable.
    diligencePath: Request the latest board pack or lender/investor package with revenue, ARR, gross margin, opex, cash, debt, and runway.
