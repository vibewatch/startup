- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue scale
    - null
    - low
    - Absolute revenue anchors valuation and operating leverage.
    - Provide audited or management-reported annual revenue and quarterly revenue trend.
  - - ARR scale
    - null
    - low
    - ARR reveals renewal base and software durability.
    - Provide current ARR and ARR bridge by new, upsell, churn, and price.
  - - Gross margin
    - null
    - low
    - Distinguishes true software economics from services-heavy delivery.
    - Provide gross margin split by subscription, services, and support.
  - - RPO growth
    - 30%+ in FY2025
    - medium
    - Indicates future revenue visibility and contracted demand.
    - Break RPO into current and non-current portions.
  - - Installed-base attach rate
    - 38% in FY2025; 51% in Q1 FY2026
    - high
    - Strong proxy for land-and-expand efficiency.
    - Provide cohort-level attach by segment and use case.
  - - Profitability / free cash flow status
    - 10 consecutive quarters of non-GAAP profitability and free cash flow by April 2026
    - medium
    - Suggests capital efficiency is improving.
    - Provide GAAP operating margin, FCF dollars, and reconciliation to non-GAAP metrics.
  - - CAC / payback / NRR / churn
    - null
    - low
    - Critical for underwriting durable software growth.
    - Provide CAC, sales cycle, NRR, GRR, logo churn, and retention by cohort.
  notes: Public signals indicate improving efficiency, but most core SaaS unit-economics metrics remain unavailable.
