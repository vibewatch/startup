  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-retention-cohorts
    missingEvidence: Public sources do not disclose current NRR, GRR, logo churn, contract length, or renewal cadence.
    whyItMatters: These are the core metrics needed to underwrite customer durability and revenue quality in an enterprise software business.
    diligencePath: Request cohort retention tables by vintage, module, top-account band, and vertical; ask for lost-logo reasons and contraction data.
    relatedQuestionRefs:
    - QU015
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Public materials do not reveal top-customer revenue concentration, revenue by segment, or whether the most visible references are economically representative.
    whyItMatters: A business can have many logos yet still depend heavily on a small set of large accounts or a few high-ACV verticals.
    diligencePath: Request top-1, top-5, and top-10 revenue concentration; top-customer tenure; revenue by vertical; and expansion vs new-logo mix.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
    - TU006
    relatedFigureRefs:
    - FU002
  - type: missing-source
    severity: minor
    topic: independent-reference-depth
    missingEvidence: Many detailed workflow proofs are company-authored or anonymous, while independent customer-authored case studies remain limited.
    whyItMatters: Independent references improve confidence that published outcomes generalize beyond marketing-selected accounts.
    diligencePath: Prioritize third-party customer calls, procurement records, customer conference presentations, and reference checks outside vendor-hosted pages.
