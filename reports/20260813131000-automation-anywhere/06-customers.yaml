- id: named-proof-and-reference-quality
  title: Named customer proof is real and diverse, but much of it remains company-authored
  body: >-
    The strongest customer evidence is the breadth of named or at least workflow-specific case
    studies. SoftBank, Newcastle Hospitals, TreasuryONE, Juniper Networks, KeyBank, San Diego
    County, Abbott, and other references show the platform touching real production processes with
    measurable claims around hours saved, error reduction, straight-through processing, and cycle
    time improvement. Additional official releases add customer quotes from R1RCM, Eletrobras,
    Petrobras, Osaic, and JCPenney, which broadens proof beyond a single vertical. Still, the
    chapter should not overstate this evidence. Several of the most detailed stories are hosted by
    Automation Anywhere itself, a number of banking references are anonymous, and some stories are
    about internal use by Automation Anywhere rather than third-party revenue customers. The right
    reading is that adoption is unquestionably real, but reference independence and production-depth
    visibility vary materially by account.
  claimRefs:
