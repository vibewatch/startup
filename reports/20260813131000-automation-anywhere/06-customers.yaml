- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / User / Payer
  - Public proof
  - Scale / strategic value
  - Gap
  rows:
  - - Financial-services operations
    - 'Buyer: operations, compliance, mortgage, onboarding, and shared-services leaders; User: analysts and back-office teams; Payer: enterprise operations budgets'
    - KeyBank, unnamed U.S. banks, global investment-bank, and global-bank-HR case studies
    - Core historical RPA constituency with clear document, compliance, and onboarding fit
    - Named production depth is uneven because several bank references are anonymized.
  - - Healthcare and life sciences
    - 'Buyer: revenue-cycle, operations, and support leaders; User: admin and document-heavy teams; Payer: operations / transformation budgets'
    - Abbott, R1RCM, and healthcare RCM solution pages
    - Important proof that the platform can enter regulated workflows
    - Public evidence is strong on workflow fit but light on renewal or contract economics.
  - - Shared services and finance transformation
    - 'Buyer: CFO org, GBS, treasury, and process-improvement leaders; User: finance and admin teams; Payer: transformation budgets'
    - TreasuryONE, Juniper invoice-to-cash, Petrobras tax-filing automation
    - Repetitive document and workflow tasks look highly automatable and expandable
    - Most ROI claims remain company-authored rather than independently audited.
  - - Customer service, IT, and employee service
    - 'Buyer: CX, ITSM, and service-operations leaders; User: agents, employees, service desks; Payer: operations / IT budgets'
    - Customer-support solution page, Automation Anywhere internal support case, Aisera acquisition coverage
    - Fastest-growing agentic wedge and strong cross-sell path beyond legacy RPA
    - Newer motion has less long-horizon retention history in public.
  - - Public sector and government-admin workflows
    - 'Buyer: agency operations leaders; User: case workers and admin teams; Payer: government program budgets'
    - San Diego County and Newcastle Hospitals
    - Shows fit in labor-constrained, compliance-sensitive environments
    - Public evidence does not show how repeatable public-sector procurement is.
  - - Enterprise automation CoEs and developers
    - 'Buyer: automation center-of-excellence leaders; User: bot builders, analysts, developers; Payer: enterprise platform budgets'
    - SoftBank Digital Worker 4,000, community and university disclosures, review sites
    - Important because platform expansion often depends on internal builder adoption
    - Public evidence does not quantify active builders by customer.
  notes: Segments are grouped by actual workflow buyer and payer, not just by logo industry label.
