- id: TU003
  title: Named customer proof table
  columns:
  - Customer
  - Segment
  - Deployment / use case
  - Status
  - Outcome
  - Limitation
  rows:
  - - SoftBank
    - Telecom / enterprise shared services
    - Cross-functional automation and Digital Worker 4,000 program
    - Production program
    - 7.7 million hours per year target and broad orchestration across Office365, Google, Salesforce, and more
    - Outcome is company-authored and framed partly as target rather than fully audited result.
  - - Newcastle Hospitals NHS Foundation Trust
    - Healthcare / public sector
    - HR portal, forms, and staff-record processing
    - Production program
    - 4,000 management hours released annually and 95% decrease in data-input time
    - Great workflow specificity, but no spend or contract data.
  - - TreasuryONE
    - Treasury and finance operations
    - Settlements and deal confirmations
    - Production deployment
    - Four business-critical processes automated in five months with zero errors
    - Smaller customer than global-enterprise references.
  - - Juniper Networks
    - Technology / finance operations
    - Invoice-to-cash workflow
    - Production deployment
    - Invoice submissions moved from two days to instant with 100% reduction in cycle time and improved controls
    - Scope appears focused on finance rather than broad enterprise rollout.
  - - KeyBank
    - Banking compliance
    - Suspicious-activity referral process
    - Production deployment
    - Stronger compliance posture and faster escalations in financial-crime workflows
    - Public page is thin on quantified volume or time savings.
  - - Abbott
    - Healthcare / life sciences
    - Enterprise scaling of intelligent automation plus generative-AI pilots
    - Active enterprise relationship
    - Governance and guardrails emphasized for HR, IT, diagnostics, nutrition, customer service, and regulatory use cases
    - Page stresses exploration and guardrails more than audited ROI.
  - - Becton Dickinson (anonymous page title)
    - Medical technology
    - End-to-end process automation across business units
    - Production deployment
    - 89% cycle-time reduction and 50 FTE reassigned for a 65K-employee organization
    - Public identity is partially obscured inside the case-story page.
  - - Top-30 U.S. bank via EY
    - Banking / mortgage operations
    - Flood certification, address verification, and mortgage QA/QC
    - Production workflow
    - 2-3x greater efficiency, zero errors, and potential annual savings of $1M
    - Customer remains unnamed, weakening independent reference quality.
  - - Global investment bank
    - Banking / customer service and onboarding
    - Bot lifecycle, access control, and new-account workflows
    - Production at scale
    - Over 1,000 bots in production and 92% reduction in time to add new accounts
    - Account remains unnamed and outcome source is still company-hosted.
  - - Automation Anywhere (self-use)
    - Internal customer support / CX
    - AI-driven case triage, root-cause analysis, and resolution
    - Production internal deployment
    - 87% faster resolution and 69% fewer escalations across support for 4,000+ global customers
    - Internal dogfooding is useful but not independent third-party proof.
