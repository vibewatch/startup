- id: TU006
  title: Customer evidence quality table
  columns:
  - Evidence class
  - Example
  - What it proves
  - What it does not prove
  rows:
  - - Named case study with workflow and metric
    - SoftBank, Newcastle Hospitals, TreasuryONE, Juniper
    - Real production usage and workflow-specific ROI claims
    - Renewal rates, contract size, or concentration.
  - - Named customer quote in press release
    - R1RCM, Eletrobras, Osaic, JCPenney
    - Active customer interest and strategic relevance
    - Long-term production depth or multi-year durability.
  - - Anonymous enterprise case study
    - Top-30 U.S. bank, global investment bank, global bank HR
    - Clear workflow fit and meaningful outcome claims
    - Reference independence and breadth of deployment.
  - - Internal dogfooding case
    - Automation Anywhere support organization
    - Product can be used in the company's own high-volume support environment
    - Third-party willingness to renew or expand.
  - - Review-aggregator signal
    - TrustRadius, PeerSpot, SourceForge
    - Real practitioner base with visible pros and cons
    - Revenue-weighted customer satisfaction.
  - - Missing private durability evidence
    - NRR, GRR, churn, contract terms, top-account mix
    - Where underwriting risk actually sits
    - Public record cannot answer these questions today.
  notes: This table separates logo existence from evidence quality because public customer proof is abundant but unevenly independent.
