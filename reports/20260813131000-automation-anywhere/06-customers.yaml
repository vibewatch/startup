- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value / null
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - Historical retention
    - 98% retention rate in fiscal period ended March 2018
    - Broad installed base
    - Medium
    - Request current NRR, GRR, logo retention, and churn by vintage because this disclosure is stale.
  - - Current customer retention
    - High customer retention stated, but no numeric value disclosed
    - Broad installed base
    - Low
    - Ask for current retention formula, timeframe, and absolute renewal counts.
  - - Latest-platform migration
    - 95% of customers exclusively on latest platform
    - Existing customers
    - High
    - Validate whether remaining 5% are churn risk, non-migrated legacy users, or long-tail accounts.
  - - Installed-base expansion
    - 51% attach rate within installed base
    - Existing customers
    - Medium
    - Break out attach by module, cohort, ACV, and vertical.
  - - Public review sentiment
    - TrustRadius 8.3/10 from 215 reviews; SourceForge 4.3/5 from 3 reviews
    - Practitioners and admins
    - Medium
    - Use reference calls and ticket data to test whether ratings match enterprise renewal behavior.
  - - Practitioner durability proxy
    - PeerSpot review cites 13 years of usage with strong support and scalability feedback
    - Long-tenure practitioner
    - Low
    - Determine whether long-tenure usage is common or anecdotal.
  - - Current NRR / GRR / churn / contract length
    - Not publicly disclosed
    - All customers
    - Low
    - Obtain full cohort tables, contract terms, renewal cadence, and contraction reasons.
  notes: Satisfaction data exists, but public retention-quality evidence remains too sparse to underwrite revenue durability confidently.
