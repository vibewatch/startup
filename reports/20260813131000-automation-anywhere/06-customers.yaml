schemaVersion: report-v2
artifact: customers
slug: automation-anywhere
runDate: '2026-08-13'
company:
  name: Automation Anywhere
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof for Automation Anywhere is broad enough to establish real enterprise
    adoption across banking, healthcare, public sector, telecom, manufacturing, and internal IT,
    but the proof is uneven. The company has many specific case studies with workflow outcomes,
    plus current signals of installed-base expansion such as 95% platform migration, 51% attach
    within the installed base, and continued growth in million-dollar ARR customers. The main
    customer-quality weaknesses are the lack of current NRR/GRR/churn disclosure, the heavy use
    of company-authored evidence, and limited public visibility into concentration by top account.
sections:
- id: segments-and-buyer-map
  title: Customer coverage is clearly enterprise-led and spans multiple workflow buyers
  body: >-
    Automation Anywhere's customer surface is not a narrow RPA niche anymore. Public materials
    show buyers across finance, operations, compliance, customer service, HR, IT, and shared
    services, with vertical proof in banking, healthcare, telecom, manufacturing, and government.
    LinkedIn and official positioning support that this is a global enterprise software vendor with
    a large field footprint, while older and newer press releases show the customer base evolving
    from 1,000-plus global customers in 2018 to a much larger installed base that management now
    describes through migration, attach, and large-deal metrics rather than by publishing an exact
    current customer count. The buyer pattern is consistent across sources: central automation
    teams or functional leaders land the platform inside high-volume, document-heavy, or
    compliance-sensitive workflows, then expansion happens across adjacent departments. That makes
    the customer base look more like a complex enterprise-program portfolio than a self-serve SaaS
    book of small accounts. That distinction matters for renewal economics and services burden.
  claimRefs:
