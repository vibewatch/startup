- id: expansion-concentration-and-procurement-risk
  title: The biggest diligence gaps are concentration opacity and enterprise-procurement friction
  body: >-
    Automation Anywhere's customer story points to classic land-and-expand enterprise economics,
    but the public evidence also highlights the key diligence risks. Expansion appears to be driven
    by installed-base attach, million-dollar customers, hyperscaler partnerships, and a wider buyer
    map that now explicitly includes ITSM, HR, and customer service. The Aisera acquisition sharpens
    that motion by pushing the platform toward seat-displacing agentic self-service in addition to
    traditional automation. At the same time, public sources do not reveal top-customer
    concentration, average contract length, revenue by vertical, or whether the most visible logos
    represent large recurring software contracts or a thinner layer of flagship references. Case
    studies repeatedly imply meaningful change-management, governance, and CoE work before value is
    realized, which suggests procurement and deployment cycles can be heavy even when ROI is strong.
    The overall customer verdict is positive on breadth and expansion potential, but cautious on the
    unobserved durability and concentration layer that matters most for underwriting revenue quality under current public evidence.
