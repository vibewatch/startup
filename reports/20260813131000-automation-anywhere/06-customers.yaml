- id: durability-satisfaction-and-repeat-usage
  title: Durability signals are directionally positive, but public retention data is still weak
  body: >-
    The public record is much better on adoption than on durability. There are enough signals to
    believe existing customers are expanding rather than abandoning the platform: 95% of customers
    were said to be exclusively on the latest platform in early 2024, new and upsell bookings are
    increasingly AI-led, million-dollar ARR customers kept growing in late 2024, and the fiscal
    2026 Q1 release disclosed a 51% attach rate within the installed base. Review surfaces also
    show a real practitioner base. TrustRadius lists 215 reviews with an 8.3 out of 10 score,
    SourceForge shows a smaller 4.3 out of 5 dataset, and a long-form PeerSpot review praises
    reliability, scalability, and support while still asking for better debugging, web-object
    recognition, performance, and connectors. Those are encouraging satisfaction proxies, but they
    do not substitute for current NRR, GRR, churn, contract length, or cohort renewal data. The
    2018 disclosure of 98% retention is useful as historical context only, not as evidence of
    present-day durability.
  claimRefs:
