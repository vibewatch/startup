- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Impact
  - Evidence
  - Diligence path
  rows:
  - - AI-led upsell into the installed base
    - High positive
    - AI-powered customers drove more than 65% of new and upsell bookings; installed-base attach reached 51%
    - Request attach by module and upsell ACV to see whether cross-sell is broad or concentrated.
  - - Growth in million-dollar ARR customers
    - High positive
    - Official Q3 FY2025 release says million-dollar ARR customers continued double-digit growth
    - Break out top-customer count, concentration, and renewal profile.
  - - New buyer expansion into ITSM, HR, and customer service
    - Medium-High positive
    - Aisera acquisition and internal support case show widening buyer map
    - Measure pipeline, win rate, and product attach for the service-operations motion.
  - - Hyperscaler and partner traction
    - Medium positive
    - AWS, Google Cloud, and Azure repeatedly highlighted as growth channels
    - Quantify partner-sourced pipeline, margin impact, and dependency risk.
  - - Unpublished top-customer concentration
    - High risk
    - No public top-1, top-10, or vertical concentration data found
    - Request revenue concentration, HHI, and revenue by top cohort.
  - - Anonymous banking references and self-authored proof
    - Medium risk
    - Several detailed case studies do not name the customer or are hosted by the company itself
    - Prioritize independent customer calls and procurement records in diligence.
  - - Heavy enterprise implementation requirements
    - Medium risk
    - CoE formation, training, governance, and change-management themes recur across case studies and reviews
    - Request implementation time, services mix, and deployment failure rates.
  notes: The strongest public risk signal is opacity, not lack of logos or lack of workflow value.
