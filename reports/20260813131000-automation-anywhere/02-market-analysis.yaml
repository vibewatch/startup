- id: section-4
  title: Growth drivers, deployment constraints, and valuation relevance
  body: >-
    Adoption drivers are visible and concrete: finance remains a large spend segment in public
    market reports, BFSI is repeatedly highlighted as a large adopter cohort, and official
    solution pages promise measurable outcomes such as same-day invoice processing, faster
    support resolution, lower escalations, and easier integration with legacy systems. But the
    same sources also show why deployment pace matters so much for valuation. Banking and
    healthcare workflows require compliance, audit trails, role-based access control, and safe
    integration with legacy applications. Gartner explicitly says AI innovation slowed core RPA
    market growth in 2024, which suggests the category is being redefined rather than simply
    growing linearly. UiPath, ServiceNow, Pega, and Microsoft now market adjacent agentic or
    workflow-automation stacks with governance and orchestration language similar to Automation
    Anywhere's. The investable question is therefore not whether automation demand exists — it
    does — but whether Automation Anywhere can convert cross-functional, regulated workflow wins
    into repeatable platform expansion faster than large suite vendors bundle the category.
  claimRefs:
  - CM026
  - CM027
  - CM028
  - CM029
  - CM030
