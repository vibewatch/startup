artifact: market-analysis
slug: automation-anywhere
runDate: '2026-08-13'
company:
  name: Automation Anywhere
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Automation Anywhere now sells into a broader automation budget than legacy RPA alone,
    but the size of that opportunity depends heavily on where the market boundary is drawn.
    The cleanest public floor is Gartner's $3.6 billion 2024 RPA software market; broader
    publishers stretch the category toward roughly $5.7 billion to $9.0 billion and
    hypergrowth scenarios above that by including more services, AI-enhanced automation,
    or wider enterprise-process spend. The strongest buyer evidence sits in finance,
    service operations, banking, and healthcare, where document-heavy, compliance-heavy,
    cross-system workflows create measurable ROI. The main underwriting caution is that
    demand is real, but public sources still do not isolate a precise Automation Anywhere
    SAM or SOM, and larger suite vendors now pitch nearly the same agentic-orchestration
    narrative.
sections:
- id: section-1
  title: Market boundary, included spend, and status-quo substitutes
  body: >-
    Automation Anywhere should be bounded from the workflows it actually tries to automate,
    not from every dollar labeled enterprise AI. Its current product surfaces describe an
    Agentic Process Automation system that combines AI agents, classic RPA, orchestration,
    document extraction, and human approvals across existing enterprise systems. That means
    the most relevant spend pools are core RPA software, intelligent document processing,
    agentic service-operations automation, and cross-functional workflow orchestration for
    finance, IT, support, healthcare, and banking use cases. The boundary should exclude
    generic ERP and CRM seat spend, pure foundation-model experimentation that never reaches
    production workflow execution, and one-off internal scripting that never becomes an
    enterprise control plane. The practical substitute set is broad: manual shared-services
    labor, outsourced back-office processing, service-desk teams working through disconnected
    tools, point automations inside Microsoft or ServiceNow estates, and legacy bot programs
    that handle rules but not reasoning or exceptions. This is why the company is trying to
    move the conversation from task bots to governed, cross-system execution.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: section-2
  title: Sizing lenses, publisher contradictions, and what is actually underwritable
  body: >-
    Public market-size estimates for Automation Anywhere's category are directionally useful
    but not internally consistent. Gartner's 2024 market-share analysis gives the most
    defensible narrow floor: the worldwide RPA software market grew 14.5% to $3.6 billion in
    2024, even as AI innovations slowed the category's growth rate. Future Market Insights
    publishes a larger and more forward-looking view, sizing the market at $5.7 billion in
    2026 with an 18.2% CAGR through 2036. MarketsandMarkets publishes a still broader public
    estimate of roughly $9 billion in 2025 and nearly $48 billion by 2036, while Technavio
    projects $54.27 billion of incremental growth from 2025 to 2030 at a 41.3% CAGR. Those
    numbers should not be collapsed into a false consensus. They use different years,
    segment definitions, and inclusion rules for software versus services versus AI-enhanced
    automation. The safest underwriting view is therefore a bridge-market approach: a narrow
    single-digit-billion core RPA software category, a somewhat larger intelligent-automation
    platform category, and a still larger but much less isolatable agentic-operations budget.
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
  - CM034
  - CM035
