      note: Vendor demonstrates time-to-value and a narrow ROI case.
    - label: Systems integration and governance completed
      value: 45
      note: Legacy applications, role-based access, privacy, and exception handling are wired in.
    - label: One-function production deployment
      value: 25
      note: A department puts the workflow live with monitored business outcomes.
    - label: Installed-base expansion into adjacent processes
      value: 15
      note: Additional workflows are added through attach and upsell.
