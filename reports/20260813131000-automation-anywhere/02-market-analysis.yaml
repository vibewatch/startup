  - TM002
  figureRefs:
  - FM002
- id: section-3
  title: Buyer segments, budget owners, and the adoption path
  body: >-
    The buyer map is functional first and horizontal second. Official solution pages show the
    strongest current fit in accounts payable and finance operations, customer support and
    service operations, retail-banking workflows, healthcare revenue-cycle management, and
    broader IT or employee support. In those segments the buyer is usually a transformation,
    operations, or function leader; the end users are service agents, AP teams, revenue-cycle
    staff, compliance teams, or IT operators; and the economic sponsor often sits with the
    CFO, CIO, COO, head of shared services, or line-of-business owner. The adoption path is
    consistent across sources: identify a high-volume workflow, run a proof of concept,
    integrate into systems of record, add governance and exception handling, then expand into
    adjacent processes. Automation Anywhere's own attach-rate disclosures — 38% in FY2025 and
    51% in Q1 FY2026 — imply that expansion inside the installed base matters as much as new
    logo acquisition. The company is effectively selling a land-and-expand operating layer,
    not a one-time bot license.
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
