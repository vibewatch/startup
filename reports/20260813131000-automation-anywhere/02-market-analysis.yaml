- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - High-volume, repetitive back-office work with measurable ROI
    - positive
    - current
    - Supports fast initial business cases in AP, support, and shared services.
    - What payback periods and labor-savings assumptions are actually used in live deals?
  - - Installed-base attach growth from 38% to 51%
    - positive
    - recent
    - Suggests existing customers are willing to expand beyond initial automation use cases.
    - How much of growth is expansion revenue versus logo adds?
  - - Finance and BFSI concentration in market reports
    - positive
    - current
    - Favors vendors with strong compliance and document-automation capabilities.
    - What percent of ARR is exposed to finance and regulated verticals?
  - - Service-operations and customer-support proof points
    - positive
    - current
    - Opens a larger cross-functional wedge than classic back-office RPA alone.
    - Are customer-support metrics replicated at external customers or mostly customer-zero?
  - - Legacy integration complexity
    - negative
    - current
    - Can lengthen deployment cycles and widen gap between pilot and scaled production.
    - What share of implementations stall on systems integration or exception handling?
  - - Compliance, privacy, and audit requirements
    - negative
    - current
    - Raises friction in banking, healthcare, and enterprise support workflows.
    - What regulated-reference architecture and audit evidence is available by vertical?
  - - Competitive convergence from suites and orchestration platforms
    - negative
    - current
    - Increases pricing and bundling pressure from Microsoft, ServiceNow, UiPath, and Pega.
    - Where does Automation Anywhere still win against bundled or incumbent alternatives?
  - - Category blur from AI-driven redefinition of RPA
    - mixed
    - recent
    - Broadens the opportunity set but makes headline TAMs less comparable and can slow core-category growth.
    - How should management define its real comparable market for budgeting and valuation?
  notes: Direction and timing are qualitative syntheses from product pages, customer stories, and market reports; they are not management-issued prioritization.
