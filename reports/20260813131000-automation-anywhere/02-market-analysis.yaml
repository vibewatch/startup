tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Core RPA / APA platform software
    - Bot execution, orchestration, agent studio, control plane, automation runtime
    - Generic ERP/CRM seats without dedicated automation functionality
    - CIO, COO, automation CoE, shared-services leader
    - Closest direct monetization pool for Automation Anywhere's core platform.
  - - Intelligent document processing and workflow extraction
    - Invoice capture, document understanding, exception routing, knowledge extraction
    - Generic OCR utilities that do not route work or trigger enterprise actions
    - CFO organization, AP lead, operations sponsor
    - Important because many AA use cases start with document-heavy workflows.
  - - Service operations / customer support automation
    - Ticket triage, case resolution, knowledge ops, ITSM and CRM workflows
    - Stand-alone chatbots that do not execute work across systems
    - CIO, support operations head, customer service leader
    - Fastest official proof points now sit in support and service operations.
  - - Regulated vertical workflow automation
    - Banking onboarding, KYC/AML, healthcare RCM, audit-heavy process execution
    - General AI copilots with no governance or auditability
    - Function leader plus compliance-conscious executive sponsor
    - High-value wedge because ROI and governance needs are both visible.
  - - Status-quo substitute set
    - Manual back-office labor, BPO, legacy service desks, simple macros, point tools
    - n/a
    - Existing budget owner already paying for people and incumbent software
    - Real competition is often the current operating model, not only another platform.
  notes: Uses present-tense official product framing; excluded-spend cells define the underwriting boundary rather than a vendor-published taxonomy.
