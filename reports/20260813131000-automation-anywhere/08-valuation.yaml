- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue-quality miss
    - Private diligence shows revenue materially below the level needed to support even reset marks
    - The comp case breaks because implied multiples become too high
    - Walk away or require a much lower entry price.
  - - Retention or concentration disappointment
    - NRR/GRR are weak or a small set of accounts drives too much revenue
    - Upside gets repriced as fragile rather than compounding
    - Treat the business as higher risk and lower terminal multiple.
  - - Security or AI-compliance incident
    - A material breach, remediation failure, or workflow-level compliance problem emerges
    - Trust, procurement speed, and expansion assumptions all weaken together
    - Cut scenario ranges and require much stricter diligence.
  - - Aisera / agentic integration failure
    - Attach stalls, service burden rises, or integration support churns customers
    - The new growth wedge stops justifying premium platform logic
    - Re-rate toward mature automation multiples.
  - - Preference-stack overhang
    - Cap-table terms materially reduce common-equity upside
    - Good company performance may still fail to produce acceptable returns
    - Rebuild return model before pursuing.
  notes: These are the few events that would most directly alter the recommendation.
  claimRefs:
  - CV013
  - CV014
  - CV027
  - CV029
  - CV036
  - CV037
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current ARR / revenue base
    - Absolute current ARR or revenue and booked-to-recognized bridge
    - This is the core missing input behind every implied-multiple test
    - CFO diligence and audited or board-level reporting.
  - - Gross margin and services mix
    - Gross margin by product and implementation model
    - Services-heavy delivery should not receive premium workflow-platform pricing
    - Finance and delivery-lead review.
  - - Retention and concentration
    - NRR, GRR, churn, contract length, and top-customer exposure
    - Determines whether growth is compounding or fragile
    - CRO and finance cohort tables.
  - - Cap table and preferences
    - Liquidation preferences, anti-dilution, options, and security rights
    - Return math can change dramatically even if enterprise value is attractive
    - Counsel and cap-table export.
  - - Aisera integration economics
    - Attach, churn, support burden, and cross-sell performance after acquisition
    - Determines whether the ITSM/HR/CX wedge is additive or distracting
    - Product and GTM diligence.
  - - Security / compliance operating history
    - Incident log, patch-remediation evidence, and AI-governance ownership in top workflows
    - Risks chapter shows this can reprice the business quickly
    - Security team review and customer references.
  notes: Ordered by what would most directly move recommendation and price discipline.
