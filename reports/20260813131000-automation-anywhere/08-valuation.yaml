  - - Anti-thesis
    - Public economics remain too opaque to justify a late-stage private valuation confidently.
    - Provide ARR/revenue, gross margin, NRR/GRR, services mix, and preference-stack details.
  - - Anti-thesis
    - Security, regulatory, and integration risks justify a discount until proven otherwise.
    - Show incident history, compliance ownership, and clean Aisera integration outcomes.
