artifact: valuation
slug: automation-anywhere
runDate: '2026-08-13'
company:
  name: Automation Anywhere
chapter:
  number: 8
  title: Valuation
  summary: >-
    Automation Anywhere looks investable as a company but not yet clearly investable at a late-stage
    price from public evidence alone. The business shows credible product breadth, real enterprise
    customers, improving profitability, and a workable agentic-automation pivot, but valuation
    markers remain inconsistent: historical peak pricing was about $6.8B, Premier Alternatives shows
    roughly $2.0B as of October 2024, and Yahoo Finance's derived August 2026 mark is about $1.47B.
    Without current ARR, gross margin, retention, concentration, or preference-stack visibility, the
    public-only recommendation is research-more with high price discipline.
sections:
- id: financing-context
  title: Financing context is real, but public price support is inconsistent
  body: >-
    Automation Anywhere's financing history clearly shows a company that once commanded peak-cycle
    RPA valuation and has since repriced. The 2018 official Series A announcement set a $1.8B
    post-money value and described triple-digit growth, 98% retention, and more than 1,000 global
    customers. The private-market markers now tell a different story. Yahoo Finance's AUAN.PVT page
    shows a derived estimated valuation of about $1.47B as of August 2026, while Premier
    Alternatives shows a current valuation of about $2.0B as of October 2024 tied to the $174M
    round and total funding of roughly $815M. Those marks are not identical and they are not perfect,
    but they agree on the important point: the company has already come off its old $6.8B peak.

    That reset matters for valuation discipline. It means the market has already recognized that
    late-stage automation software is no longer being priced on narrative alone. Automation
    Anywhere's public story still has many strengths—AI-led upsell, customer migration, million-dollar
    ARR growth, attach-rate expansion, and broad partner traction—but the company's willingness to
    disclose absolute financial detail remains limited. Public investors and secondaries markets can
    therefore observe momentum and direction, yet still cannot independently verify the revenue base
    needed to justify even the reset valuation confidently.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV015
  - CV016
  tableRefs:
  - TV004
- id: thesis-versus-antithesis
  title: The company-quality case is good, but the price case still depends on hidden economics
  body: >-
    The pro-investment case is straightforward. Automation Anywhere has a coherent enterprise
    automation platform, growing AI-led modules, real customer proof across finance, healthcare,
    public sector, and customer service, and enough disclosed profitability and cash-balance language
    to reduce near-term solvency fear. It also has plausible strategic relevance to large platform
    buyers or IPO investors because the market remains important and the company is repositioning from
    legacy RPA toward agentic orchestration and self-service automation. The Aisera acquisition adds
    another reason to pay attention: it expands the buyer map into ITSM, HR, and customer service and
    pushes the story toward a broader autonomous-enterprise platform.

    The anti-thesis is also clear. Public evidence does not show today's ARR, gross margin, NRR, GRR,
    churn, services mix, concentration, or cap-table preferences. Those are exactly the variables that
    determine whether a private software company deserves a premium multiple. The recent public-only
    evidence can prove that Automation Anywhere is real and strategically relevant; it cannot prove
    that the current price offers enough margin of safety. The right conclusion is therefore not a
    quality judgment but a price judgment: compelling asset, incomplete underwriting.
  claimRefs:
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV016
  - CV030
  - CV031
  - CV032
  - CV038
  - CV040
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: comparable-context-and-scenarios
  title: Public comp bands imply that even the reset valuation needs substantial hidden revenue proof
  body: >-
    The best public shorthand here is not a precise DCF or a made-up venture return model. It is a
    rough comp band anchored to public automation and workflow software names. Yahoo Finance gives
    current enterprise-value-to-revenue ratios of about 4.10x for UiPath, 2.96x for Pegasystems,
    3.97x for SS&C, 9.20x for ServiceNow, and 11.26x for Microsoft; StockAnalysis gives the
    associated revenue bases, which helps show the scale difference between Automation Anywhere and
    the public leaders. The most relevant direct comp band is therefore roughly 3x-4x on slower or
    more mature automation peers, with ServiceNow as a premium ceiling because it has much broader
    workflow ownership and public-market credibility.

    That creates a simple discipline test. At a $2.0B mark, Automation Anywhere would imply about
    40x on $50M of revenue, 20x on $100M, 13.3x on $150M, and 10x on $200M. At Yahoo's $1.47B mark,
    those fall to about 29.4x, 14.7x, 9.8x, and 7.4x. In other words, even the reset marks still ask
    investors to assume a fairly substantial current revenue base and decent software economics.
    Unless private diligence reveals something like nine-figure recurring revenue with good retention
    and margins, public evidence alone cannot justify treating the company as a bargain.
  claimRefs:
  - CV017
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
