- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Illustrative valuation logic
  - Probability signal
  - Key risk
  rows:
  - - Bull
    - ARR or recurring revenue is already above roughly $200M, retention is strong, margins are software-like, and Aisera plus AI attach keep accelerating.
    - $2.5B-$4.0B becomes supportable if the business looks closer to a premium workflow platform than a legacy RPA vendor.
    - Needs private data to prove the reset was overdone.
    - Security or renewal disappointments erase the premium quickly.
  - - Base
    - Revenue quality is decent but not elite, concentration is manageable, and the company keeps growing while public evidence remains partial.
    - $1.5B-$2.2B is the most defensible public-only band using reset markers plus moderate comp support.
    - Best fit for current evidence set.
    - Missing economics still cap conviction.
  - - Bear
    - Revenue base is lower than expected, services intensity is high, or integration/regulatory friction slows the agentic pivot.
    - $1.0B-$1.5B is plausible if the market pays only mature-automation multiples.
    - Would follow weak private diligence or adverse operating news.
    - Preference overhang can worsen new-money returns.
  notes: These ranges are deliberately broad and illustrative because public evidence cannot support narrow precision.
