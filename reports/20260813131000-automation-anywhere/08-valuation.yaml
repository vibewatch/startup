- id: recommendation-diligence-and-kill-criteria
  title: Recommendation is research-more, with re-entry only on proof or price
  body: >-
    The public-evidence recommendation is research-more. Confidence is medium because Automation
    Anywhere clearly has real customers, meaningful product breadth, and visible momentum. Risk
    rating is high because the most important variables remain private and because the downside paths
    identified in the risks chapter—security, regulation, partner dependence, and customer
    concentration—could all compress value faster than public materials imply. Valuation stance is
    stretched above the reset range and only potentially interesting nearer the lower secondary marks,
    subject to major diligence confirmation.

    The decision rule is simple. Re-engage if management can substantiate current ARR or revenue well
    above roughly $150M, strong retention, acceptable concentration, and gross-margin quality that is
    recognizably software-like. Re-engage sooner if entry pricing moves down enough that those missing
    variables no longer have to carry most of the return case. Avoid conviction if cap-table
    preferences, weak renewals, services-heavy delivery, or AI-compliance friction reveal that the
    company is less scalable than its category narrative suggests. This is a good company to keep live
    in diligence, not a price to bless from the public record alone.
  claimRefs:
  - CV027
  - CV028
  - CV029
  - CV030
  - CV031
  - CV032
  - CV034
  - CV035
  - CV036
