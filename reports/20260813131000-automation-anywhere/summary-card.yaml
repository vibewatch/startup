  topStrengths:
    - >-
      Broad enterprise automation platform with credible AI-native repositioning around PRE, AI Agent Studio, and
      governed workflow orchestration.
    - >-
      Real customer proof across banking, healthcare, public sector, finance, and customer service rather than a narrow
      single-vertical footprint.
    - >-
      Public evidence of installed-base momentum, including latest-platform migration, AI-led upsell, attach-rate
      growth, and expanding million-dollar ARR cohorts.
    - >-
      Lower near-term financing stress than many private peers because management has highlighted profitability, margin
      improvement, and cash balance.
    - >-
      Strategic upside from the Aisera acquisition and from hyperscaler-aligned deployment pathways into larger workflow
      budgets.
  topRisks:
    - >-
      Current ARR or revenue, gross margin, NRR/GRR, churn, concentration, and cap-table preferences remain undisclosed,
      making price underwriting fragile.
    - >-
      Public valuation markers are inconsistent and materially below the prior $6.8B peak, showing that the market has
      already re-rated the business.
    - >-
      Security and trust risk is real, with Rapid7's 2024 SSRF disclosure showing that control-room exposure can become
      an enterprise procurement issue quickly.
    - >-
      AI-regulation, privacy, and cross-border data obligations matter because the platform is increasingly used near
      regulated workflows in finance, healthcare, HR, and customer service.
    - >-
      Aisera integration and the broader agentic pivot could dilute margins or increase services burden if attach and
      renewals do not keep pace.
  unresolvedGaps:
    - Current ARR or revenue base and booked-to-recognized bridge are not public.
    - Gross margin, services mix, NRR/GRR, churn, and customer concentration are not public.
    - Full cap table, liquidation preferences, anti-dilution terms, and secondary-transfer constraints are not public.
    - Aisera post-acquisition attach, churn, and support-burden economics are not public.
    - Public incident history and patch-adoption evidence remain too thin to fully price trust risk.
