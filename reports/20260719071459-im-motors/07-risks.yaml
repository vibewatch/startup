    {
      "id": "financial-governance-and-execution-risks",
      "title": "Financial, Governance, and Execution Risks",
      "body": "Financial-model risk remains elevated because IM still discloses much more about launches and fundraising than about unit economics. The company has raised significant capital and claimed a first profitable month, but public evidence does not show cash on hand, burn, inventory discipline, or sustained free-cash-flow capacity. That matters even more in a market where the state itself is warning against irrational competition and where public-market peers still trade at valuations that imply skepticism about durable differentiation. Governance risk is less dramatic than in some startup stories, yet it is not trivial: the cap table and shareholding structure have evolved, and the public record still leaves open how decision rights, partner influence, and long-term capital expectations line up. Layered over all of that is straightforward execution risk. A company attempting to commercialize multiple architectures, geographies, and regulatory obligations can miss targets simply by spreading management attention too thin.",
      "claimRefs": [
