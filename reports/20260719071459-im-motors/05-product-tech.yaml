    {
      "id": "deployment-support-and-roadmap",
      "title": "Deployment, Support, and Roadmap Maturity",
      "body": "IM’s technology is not sitting only in lab demos. The company has shipped multiple product refreshes, rolled out highway NOA coverage across hundreds of cities, and paired product export with at least some support infrastructure in Singapore and Australia. The app layer also indicates an active post-sale operating model rather than a one-time handover. Roadmap direction is increasingly clear: refreshed BEV models continue, but the bigger strategic move is the transition into EREV and larger flagship formats such as LS9. That shift is important because it increases market fit potential while also making the architecture stack more complex. It is easier to tell that IM is building and deploying ambitious technology than to prove how robustly every feature performs in daily use. Deployment maturity is real; evidence of durability is still incomplete. That distinction matters because premium EV buyers can forgive bold claims at launch, but they are much less forgiving if autonomy behavior, battery performance, or software stability disappoint after delivery.",
