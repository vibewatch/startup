    {
      "id": "architecture-and-dependencies",
      "title": "Architecture, Hardware Stack, and Dependencies",
      "body": "Public launch coverage gives the clearest view of the architecture stack. On the BEV side, the LS6 and L6 are described with lidar, Nvidia Orin X compute, Qualcomm 8295 cockpit processing, fast-charging high-voltage platforms, and sophisticated chassis control. On the EREV side, IM’s Stellar system adds a 66 kWh battery, an 800V platform, and a large pure-electric range layer before fuel range extension comes into play. Supplier and platform dependencies are visible rather than hidden: Nvidia shows up in public marketing, RoboSense openly describes the LS9 lidar stack, and CATL is named in battery collaboration coverage. These dependencies do not make the product weak, but they do mean IM’s technology edge depends on integration quality and execution, not on total in-house control of every core layer. If supplier roadmaps shift or calibration quality slips, the user will still blame IM, which makes system integration and validation central to the technical moat.",
