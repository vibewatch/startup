              所在的同一战场。这个选择在战略上合理，因为市场越来越奖励相对于价格的功能密度。但这也意味着 IM 进入了中国市场最拥挤的细分：RMB200,000-300,000 价格带的智能汽车，而竞争对手已经有规模。 IM
