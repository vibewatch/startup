        title: 客户细分、购买逻辑与使用场景
        blocks:
          - type: paragraph
            body: >-
              IM 的公开客户画像最接近高端消费汽车故事，而不是企业或车队故事。可见买家是富裕家庭或以驾驶者为主的家庭， 在高端 EV 轿车和 SUV 之间做选择；付款方通常就是用车家庭。在这个宽泛群体中，两个子细分最重要：
              被 L6 / IM5 等高端智能轿车吸引的买家，以及越来越被 LS6 / IM6 和未来更大型 SUV 拉动的家庭或跨界买家。出口市场采用者构成第三类，但这些客户主要通过经销商触达，
              而不是完全自营直营模式。围绕长续航家庭使用、舒适性、泊车功能和高端内饰体验的公开定位，进一步说明客户任务不是便宜交通，
              而是带有身份、便利和家庭实用性的高端技术出行。这也意味着客户决策带有情绪成分：品牌信任、售后信心和日常数字可用性， 几乎和原始马力或广告续航同样重要。
