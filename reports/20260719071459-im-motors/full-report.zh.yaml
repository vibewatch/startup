  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与对手类型
        blocks:
          - type: paragraph
            body: >-
              最需要避免的竞争分析错误，是只把 IM 拿去和其他 BEV 轿车相比。实际购买中，中国高端 EV 买家会跨价格带、车身形式和动力形式对比。Tesla 仍是 RMB250,000-350,000 价格带的标杆，
              NIO 仍是最接近的高端智能 BEV 品牌类比，Li Auto 和 Aito 主导家庭导向高端 SUV 任务，Zeekr、Denza、XPeng 以及高端传统外资品牌，也在 IM 精确配置的上下方塑造买家预期。
              这意味着 IM 的相关竞争格局包括直接同行、相邻中国高端品牌、国际既有车企、EREV 替代品，以及从高端 ICE 转投的选择。公开 H1 2025 价格带数据把核心点讲清楚：即使中国 EV
              市场巨大，中高端价格层也已经挤满有能力、资金充足的对手；这些对手今天拥有比 IM 更大的保有量、更大的服务足迹或更强的品牌认知。即使在中国庞大的 EV 市场里，留给挑战者的无争议高端空白也已经很少。
