  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认限制
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一个直接的主要收入引擎：销售高端 EV。本次审阅的来源集合没有发现 IM 单独披露订阅、自动驾驶、软件或服务收入线。可见的是反复车型上市、官方指导价、促销价、出口市场促销和经销商主导的渠道公告。 L6
              和 LS6 的价格栈显示 IM 如何靠多配置和上市期激励变现；Singapore 和 Australia
              定价则显示，国际收入很可能通过本地伙伴流入，而不是标准化的全球直营模式。这一点重要，因为标价和订单数是很差的收入代理指标。
              它们不能告诉投资者多少订单会转化、扣除补贴或金融优惠后的实际净售价是多少，也不能说明渠道经济性是否健康。公开定价证明的是市场参与， 而不是收入质量。
