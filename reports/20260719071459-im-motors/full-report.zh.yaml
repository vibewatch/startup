      - number: '2.4'
        title: 市场对 IM Motors 意味着什么
        blocks:
          - type: paragraph
            body: >-
              落到 IM Motors，核心市场结论是：中国给了巨大的 EV 总可用市场（TAM），但高端可服务市场（SAM） 受限。好消息是，公开同行数据证明本土品牌可以做出真实的高端专营：Li Auto 证明了家庭 EV
              经济性，Aito 证明了规模，Denza 证明了细分高端深度，NIO 仍证明软件丰富的高端品牌有空间。 更难的一面是，上述竞争对手都已站稳脚跟，而公开市场估值显示，投资者仍把多数中国高端 EV
              制造商当作周期性车企，而不是稀缺软件平台。因此，中国高端 EV 需求真实存在，但很不宽容。IM 可以受益于市场整体技术升级，但前提是持续跟上已占据上下高端价格带品牌的功能、定价和分销强度。
              市场不是在问中国是否还需要更多 EV；它在问，品类成熟、弱者出清后，哪些高端 EV 品牌值得留下。
