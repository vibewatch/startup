companyProfile:
  summary: >-
    IM Motors 是一家总部位于上海的高端智能电动汽车品牌，由 SAIC Motor、Alibaba Group 和 Zhangjiang Hi-Tech 于 2020 年创立。公司先从 L7、LS7、L6、LS6 等高端 BEV
    轿车和 SUV 切入；到 2025 年，产品组合更贴近市场，加入增程战略和即将推出的 LS9 旗舰。公开证据支持其商业进展有实质性：截至 2024 年底累计交付超过 100,000 辆，2025 年交付 81,000 辆，并在
    Singapore、Thailand、 Australia 和 GCC 启动出口市场落地；同时 2024/2025 年合计完成 RMB 9.4 billion 大额融资。公司战略可信，但相对上市 EV 同行，关键披露仍明显不足。
