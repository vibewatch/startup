              lidar 和算力依赖带来集成风险；缺少独立现场质量数据，意味着外部观察者无法验证这套栈到底有多稳健。 供应商集中进一步放大问题，因为上游电池和感知硬件不是商品化附加件。面向客户的软件是另一个弱点。较低的
              app-store 评分不能证明系统性问题，但它是真实早期预警：即使纸面产品故事仍有吸引力，车主层也可能让人失望。 高端汽车品牌可以在一段时间内扛住薄利润；反复质量或信任失败则很难扛住。
