      - number: '1.3'
        title: 融资历史、股权结构与里程碑
        blocks:
          - type: paragraph
            body: >-
              按照初创公司标准，IM Motors 融资金额很大；但结构并不常规，因为它把母公司赞助和连续外部融资叠在一起。 2022 年早期报道称，SAIC 持股 54 percent，Alibaba 和
              Zhangjiang 各持 18 percent，另有 10 percent 预留给贡献数据的员工和用户。2022 年 8 月，公司 Series A 将 IM 估值推近 RMB 30 billion，并引入
              BOCOM Capital、National Green Development Fund、CITIC Securities Investment 等机构投资人。2024 年 12 月，IM 宣布完成
              Series B1，使 Series B 累计融资达到 RMB 9.4 billion。公开报道称，资金将用于数字底盘、线控转向、 智能驾驶开发和新车型上市。到那时，公司累计交付已超过 100,000
              辆，并终于连续两个月突破 10,000 辆，改善了呈现给客户和出资人的故事。公开时间线也显示清晰的产品和资本节奏：2020 年成立，2022 年 L7 上市，2023-2024 年 LS6 放量突破，2024 年
              L6 拓宽可触达价格带，2025 年进入海外市场并释放盈利信号。
