  - id: FO001
    title: IM Motors 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 公司的公开叙事从高端品牌发布，转向走量、再融资、海外扩张，以及首次盈利声明。
    data:
      items:
        - date: 2020-12
          label: 成立
          detail: SAIC、Alibaba 和 Zhangjiang 共同成立 IM Motors，定位高端智能 EV 项目。
          tone: positive
          claimRefs:
            - CO001
            - CO003
        - date: 2022-04
