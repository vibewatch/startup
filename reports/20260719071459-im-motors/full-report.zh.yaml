      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              中国 EV 市场最强的结构性驱动，是品类已经从政策扶持增长走向全品类消费者常态。乘用车市场 NEV 渗透率已超过 50 percent，国内品牌主导主流市场，豪华细分的 NEV 渗透率在最高端完全转换之前就已达到
              37.5 percent。但驱动栈变了。Third Bridge 认为，2025 年的竞争从粗暴价格战转向技术竞争，尤其是智能驾驶；无差别降价伤害了经销商经济性和残值。这个转向有利于能把软件、 电池和 ADAS
              差异化快速推向市场的品牌，但也推高资本需求。新的 OTA 和召回规则、叠加电池安全标准，提高了合规负担；上游电池力量集中，也让 OEM 暴露在 CATL、BYD
              和少数其他供应商面前。与此同时，出口增长和东南亚本地化为国内拥挤提供泄压阀，但也要求伙伴生态、工厂和本地供应链。 市场还在增长，但同时变得更难。
