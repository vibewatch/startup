              公开市场估值也显示，投资者对这个品类的持久差异化仍然怀疑。因此，反向证据很有力量：对手可以同时从 BEV 侧、EREV 侧和渠道侧挤压 IM。剩余最好的机会，可能在 IM
              能以功能密度相对价格明显超额交付的子细分：运动型电动轿车、配置充足的中型 SUV，以及既有强者较弱的出口邻近市场。 但如果没有更强品牌拉力、更广售后触达和已实现定价的更好证明，IM
