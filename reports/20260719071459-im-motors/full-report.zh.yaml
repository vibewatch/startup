            body: >-
              即使没有详细账目，IM 业务的经济形态也很清楚：它极度吃资本。整车项目需要设计、认证、采购电池、开模、 营销、软件验证、保修支持和工厂利用率，之后现金生成才可能自我维持。Series B
              报道明确称资金将投向数字底盘、线控转向、ADAS 和四款新产品，这正是那种消耗资本速度快于公开标价所暗示的支出计划。 SAIC
              支持显然降低生存风险，官方或地方政府材料也显示周边产业基础真实存在。但公开证据仍未披露现金、烧钱速度或净债务，
              因此资本充足性只能视为方向上改善，而不是已被证明。同样的不透明也让投资者无法区分，现金消耗究竟是发布驱动的暂时现象， 还是结构性单车经济性偏弱。轮次规模已知，现金跑道未知。
