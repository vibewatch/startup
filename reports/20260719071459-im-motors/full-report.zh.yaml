        title: 部署、支持与路线图成熟度
        blocks:
          - type: paragraph
            body: >-
              IM 的技术并不只停留在实验室演示。公司已经交付多轮产品焕新，在数百座城市铺开高速 NOA 覆盖，并把产品出口与 Singapore 和 Australia 的至少部分支持基础设施配套起来。App
              层也表明，公司在做活跃的售后运营模式，而不是一次性交车。路线图方向越来越清楚：改款 BEV 车型继续推进，但更大的战略动作是转入 EREV 和 LS9 等更大型旗舰形态。这个转向重要，
              因为它提高了市场契合潜力，也让架构栈更复杂。现在更容易判断 IM 确实在构建并部署有野心的技术， 但仍难证明每个功能在日常使用中有多稳健。部署成熟度真实存在；耐久性证据仍不完整。这个区别很重要， 因为高端 EV
              买家可以在上市时容忍大胆宣称，但交付后如果自动驾驶行为、电池表现或软件稳定性让人失望， 他们的容忍度会低得多。
