            body: >-
              同行背景能帮助界定缺失内容。NIO 和 Li Auto 提供公开季度业绩，包含收入、交付、毛利率和渠道细节； IM 没有。这让上市同行可用于约束健康或承压的高端 EV 经济性可能长什么样，但也凸显仅靠 IM
              公开材料仍有多少尽调无法完成。公开资本市场进一步显示，即便更强的中国 EV 公司，估值也远低于 Tesla，凸显投资者仍怀疑这个品类的持久差异化和利润率韧性。IM
              声称首个全成本月度盈利令人鼓舞，但没有回答持续毛利率、现金生成或营运资本纪律这些核心问题。它也没有解决出口扩张和新车型节奏是否会在业务能内生滚动资金前吃掉大部分增量现金。 因此公开结论是混合的：IM
              看起来可融资、商业上活跃，但透明度还不足以在没有私下尽调的情况下支持高置信度财务承销。
