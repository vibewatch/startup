        title: 牵引力、GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              由于 IM 不公布收入，最好的公开动销信号是交付量。Gasgoo 的 2025 年 81,000 辆交付数据，叠加可见的上市和订单公告，证明 IM 在以有意义但仍未成规模的体量销售真实车辆。 GTM
              质量只能从渠道信号推断。在中国，IM 的公开叙事更关注发布，而不是门店数量；海外则使用 Eurokars（Singapore）、SMI（GCC）以及 Thailand 和 Australia 的本地渠道等伙伴。
              这显示出一种务实、资本较轻的海外出口打法，而国内业务继续依赖 SAIC 体系的产业深度。Singapore 文章流也显示，IM 已经在出口市场直接对标 Tesla 做营销，这意味着即使本地特许经营由伙伴承担，
              公司也需要真实的销售费用和品牌建设。作为基准，Li Auto 的 530 家门店和 511 个服务中心展示了一个品牌有能力资助密集全国网络后，规模化高端 EV go-to-market 的样子。IM
              还处在这条成熟曲线更早的位置。
