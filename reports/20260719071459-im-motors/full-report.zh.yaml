  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管风险是 IM 最重要的暴露之一，因为公司的产品战略重压在中国监管正收紧的几个领域：OTA 软件升级、辅助驾驶功能、智能网联车数据和电池安全。MIIT 和 SAMR 的 2025
              年通知提高了测试、准入、召回和升级治理门槛；新的 GB 38031 电池标准也从 2026 年中起加入更严格的技术和安全要求。法律侧，IM 自身隐私政策的覆盖范围确认，公司会在 App、网站、
              购买和使用互动中处理个人信息，因此正落入中国 PIPL 合规框架。以上并不意味着 IM 今天已有公开已知的执法问题。它意味着高端智能 EV 战略如今带着更重的合规负载；软件、数据或电池验证一旦出错，
              可能变成监管事件，而不是常规产品问题。一个把自己定位为智能和高端的品牌，即便一次可见合规失误， 也可能在当下全球公开市场迅速传导为客户信任和融资风险。
