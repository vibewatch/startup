              IM 的产品应被理解为一套高端智能出行流程，而不只是车型清单。客户旅程从选择轿车或 SUV 车身开始，再选择纯 BEV 或如今的增程架构，之后延伸到 App 绑定使用、远程车辆监控、辅助驾驶、充电、
              泊车和支持。今天的产品组合覆盖 L6 和 L7 轿车、LS6 和 LS7 SUV，以及即将推出、 引入大型 EREV 形态的 LS9 旗舰。官方落地页增加了统一层：IM Digital
              Chassis、先进电动化、 AI 座舱、IM AD 和 Stellar 增程系统。这种框架很重要，因为它显示 IM
              的产品价值意图来自集成控制系统和车主体验，而不只是原始电池尺寸或加速数据。尽调口径下，买家支付的是整车操作感——转向、充电、软件、泊车和远程管理——而不是某一个孤立硬件部件。
