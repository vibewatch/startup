            body: >-
              最强的公开客户证据是采用量。IM 到 2024 年底累计交付超过 100,000 辆，2024 年 10 月和 11 月月交付超过 10,000 辆，并在 2025 年达到 81,000 辆交付。 对中国高端
              EV 品牌而言，这些数字有意义，即便相较品类领导者仍然偏小。产品层证据显示，LS6 焕新推动了很大一部分放量拐点；L6 也足够可信，在一些 2025
              年快照中进入其高端轿车价格段前三。中国大陆之外，最强证明不是高销量披露，而是实际市场存在：本地展厅、本地定价、 本地评测、奖项露出，以及 Thailand、Singapore 和 Australia
              已排期的客户交付。因此，IM 不只是在收集预订；它可验证地把车交付到真实消费市场。剩下的问题不是有没有客户，而是有多少客户会从早期兴奋转化为稳定的车主倡导和复购行为。
