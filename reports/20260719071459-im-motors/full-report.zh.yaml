            body: >-
              最难复制的竞争优势，正越来越多地出现在配置表之外。Li Auto 的 530 家零售店和 511 个服务中心显示，高端 EV 竞争如今也包括全国交付、服务和信任基础设施。Aito 同样把产品市场契合和
              Huawei 生态光环绑在一起。NIO 更大的保有量和以软件为中心的高端身份也很重要。 相比之下，IM 的公开证据更强调产品发布动能和技术宣称，而不是渠道深度。这意味着客户切换成本仍属中等：
              买家可以在许多品牌和融资渠道之间比较类似车辆，但仍在意服务可靠性、软件熟悉度和残值信心。换句话说，
              锁定效应比企业软件弱，却并非无足轻重。门店更多、车队更密、生态更强的竞争对手，享有单纯硬件平价无法完全抹掉的优势。
