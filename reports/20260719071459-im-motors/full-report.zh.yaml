      - number: '2.2'
        title: 买家细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              中国高端 EV 需求已经不再铁板一块。最重要的买家群体包括：想要快充、软件丰富座舱和强 ADAS 的城市智能 BEV 买家；想要高端空间但不愿有充电焦虑的家庭型 EREV SUV 买家；把中国品牌同
              Tesla、BMW、Mercedes、Audi 和 Lexus 对比的传统豪华品牌转投者；以及把中国开发产品在海外本地化的出口市场经销商或伙伴。
              大多数情况下，付款方是家庭而不是车队运营商，因此感知残值、安全和售后信任仍很关键。家庭 EREV 品类尤其重要，因为它已经成为 Li Auto、Aito 等品牌最有商业力量的高端 SUV
              切入点。这个成功证明，即便 BEV 渗透率继续上升，许多富裕买家仍优先考虑续航灵活性和低摩擦长途使用。 落到 IM，纯 BEV 逻辑并不完整；市场本身已经投票支持更宽的组合：高端 BEV、EREV
              和智能功能，同时价格越来越可及。
