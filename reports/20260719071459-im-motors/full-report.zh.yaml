      - number: '1.4'
        title: 规模、产品组合重置与扩张路径
        blocks:
          - type: paragraph
            body: >-
              最强的经营故事是，IM 离开最初 L7 和 LS7 的极高价位，转向 L6、尤其是 LS6 后，找到了更多动销。公开报道显示，2024 年 10 月销量为 10,001 辆，2024 年 11 月销量为
              10,007 辆；36Kr 引用的 2024 全年销量为 65,505 辆，同比增长 71 percent。Bamboo Works 也给出关键限定：这些增长仍低于 IM 的 2024
              年内部目标，早期旗舰定价高于 RMB 400,000，限制了可触达市场。因此 LS6 和 L6 的转向不只是小幅改善，而是战略上重要。到 2024 年底，IM 在售四款 BEV；到 2025
              年，公司计划再推出两款 BEV 和两款 EREV，表明管理层不再认为纯 BEV 高端定位已经足够。 海外动作也从愿景转向执行。Thailand 在 2025 年 3 月通过 IM6 成为第一个可见出口桥头堡，
              随后在 Singapore、Australia 和 GCC 的伙伴主导动作扩大了选择空间，但尚未证明 IM
              有独立的全球零售体系。整体图景是，一个品牌已经跨过关键生存门槛，但仍要证明：没有持续母公司支持和产品重新定价， 规模能否变得持久。
