      - number: '8.4'
        title: 退出准备度、投资逻辑破裂触发点与最终尽调
        blocks:
          - type: paragraph
            body: >-
              只靠公开证据，IM 还无法支撑高置信度的 IPO 式估值案例。公司能讲出可信的产业增长故事，但仍拿不出上市同业已经提供的财务和运营披露深度。这意味着估值的最后一锤属于尽调，不属于叙事。投资人承接价格前，应要求确切
              Series B 条款、当前现金和烧钱速度、分车型毛利率、渠道经济性，以及订单转化和服务质量的硬证据。还要测试管理层内部 KPI
              节奏更像未来上市公司，还是仍像资本密集型私营车企融资故事。投资人也应预先定义清晰的投资逻辑破裂触发点：监管延误、质量或软件故障、低于成本销售证据、出口售出表现弱，或在自我造血得到证明前又需要大额融资。因此，退出准备度结论很直接：可能融得到钱，但还没有透明到能按溢价估值退出。
