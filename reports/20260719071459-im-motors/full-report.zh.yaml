      - number: '8.3'
        title: 情景区间与入场纪律
        blocks:
          - type: paragraph
            body: >-
              估值区间应靠情景搭建，而不是假装精确。悲观情景下，价格竞争、出口摩擦和资本强度占上风，把 IM 推向低个位数十亿美元估值，更接近小规模上市同业的暗示。基准情景下，IM 继续增长，EREV
              转向跑得足够顺，能维持战略相关性，但披露仍太薄，撑不起溢价倍数。乐观情景下，公司证明更强利润率、可信出口动能，以及比怀疑者预期更持久的高端家庭车品牌。即便如此，投资人也要记住，可选性不是免费的。监管收紧、EU
              关税压力，以及持续零失误执行的要求，都意味着折现率应高于披露充分的上市可比公司。因此，入场纪律本身就是建议的核心。情景区间宽，并不等于什么价格都能付；尤其在私募估值标记和权利包仍无法从公开来源完整看清时。
