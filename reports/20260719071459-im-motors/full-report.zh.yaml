  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模
        blocks:
          - type: paragraph
            body: >-
              IM Motors 的正确市场框架不是「所有中国 EV」。它是高端智能乘用车 NEV 市场，核心是大约 RMB 200,000 以上的轿车和 SUV；买家在意软件、充电速度、安全和品牌，不只是动力形式。H1
              2025 数据显示整体池子有多大：中国销售 10.891 million 乘用车，其中 5.458 million 为 NEV，渗透率刚超过 50 percent。来自 CPCA 相关和行业来源的 2025
              全年预测集中在约 15.3 million 辆 NEV。但这个头部总量夸大了 IM 真正可触达的市场。ThinkerCar 的细分结构显示，>RMB300,000 的份额已收窄至约 9.3
              percent，而最大份额落在 RMB100,000-200,000 价格带。因此，一个可辩护的 IM 可服务市场（SAM）代理值，更接近大约 1.4-1.6 million 年高端销量，而不是完整的
              15-million-plus NEV 总可用市场（TAM）。这仍然是大机会，但已经被 Tesla、Li Auto、Aito、NIO、Zeekr、Denza 和快速行动的传统车企激烈争夺。
