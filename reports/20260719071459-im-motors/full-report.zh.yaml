              这些都是真实缓释因素。但它们主要降低生存风险，并不会消除剩余暴露。公司仍要证明：合规系统能跟上更智能的车辆， 产品质量在更激进部署下守得住，经销商能把关注转化为 sell-through，定价纪律能扛过中国残酷
              EV 竞争。对投资者而言，最有用的风险框架因此应是可监控，而不是二元判断。观察监管延误、召回活动、 持续 App 质量投诉、低于成本销售证据、疲弱出口 sell-through，或 EREV
