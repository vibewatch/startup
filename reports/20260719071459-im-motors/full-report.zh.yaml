  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              IM 的投资逻辑站得住。公司身处全球最深的 EV 市场，交付规模已经有分量，能动用重要产业和金融股东资源，也正从高端 BEV 扩到市场已经验证过的车型形态。反向逻辑同样清楚：相对头部同业，IM
              仍未成规模；利润率和现金经济性仍不透明；所在市场竞争已激烈到监管开始介入。把两条叙事放在一起，合理建议不是无条件买入，也不是轻率放弃，而是观察 /
              跟踪。这个判断承认真实上行可选性，但在价格纪律不足、单位经济性核心证据更清楚前，不为激进估值背书。换句话说，公司可能值得紧盯，但现有公开信息还不足以默认接受英雄式报价。
            claimRefs:
