      - number: '1.2'
        title: 管理层、治理与母公司监督
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，管理结构先围绕联席 CEO Liu Tao 展开，后来 CEO Jiang Jun 也进入公开沟通；但治理图景更像母公司主导，而不是初创公司独立运作。2022 至 2025
              年的融资、产品和海外扩张报道中，Liu Tao 多次作为管理层发声，谈车型战略、EREV 方向和投资者沟通。到 2025 年 12 月，汽车媒体引用的一封内部信由 Jiang Jun 和 Liu Tao
              共同署名，说明顶层团队采用双负责人安排。但在董事会和控制权层面，更强的信号来自 SAIC。Bamboo Works 报道称，SAIC 负责人 Jia Jianxu 在 2024 年 12 月初出任 IM
              多个关键董事会职位，包括董事长；这意味着市场压力上升后，母公司收紧了直接监督。后续 SAIC 称 IM 为其高端旗舰，也与这一判断一致。缺失的部分仍然是清晰公开的董事会名单、正式委员会结构，
              或外部轮次参与者的投资人权利披露。尽调口径下，IM 在运营上被包装为高端 EV 项目， 但战略治理更像 SAIC 严密监督的平台，叠加选择性外部资本，而不是完全自主的 VC 支持公司。
