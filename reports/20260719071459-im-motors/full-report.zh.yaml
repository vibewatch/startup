chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与定位
        blocks:
          - type: paragraph
            body: >-
              IM Motors 在法律或中文语境中也称为 Zhiji Automobile Technology，成立于 2020 年 12 月，定位为 SAIC Motor 的高端智能 EV 项目。公开材料一贯将公司描述为
              SAIC、 Alibaba 和 Zhangjiang Hi-Tech 三方合作，早期报道把 IM 品牌解释为「Intelligence in Motion」。官方 Singapore
              市场网站用更叙事化的方式强调同一逻辑：SAIC 提供整车工程和生产深度， Alibaba 提供 AI、云和车联网软件能力，Zhangjiang 提供上海创新生态和研发联动。这一组合很关键， 因为 IM
              并不是典型独立初创公司，而是一个国家背景汽车平台，外面包着技术品牌语言。2025 年 4 月， SAIC 董事长 Wang Xiaojun 进一步称 IM Motors 是集团唯一高端品牌，也是 RMB
              200,000 以上市场的最高优先级项目。这句话确认了 IM 的战略角色：它是母公司指定冲击高端智能 EV 竞争的尖刀，而不是一个实验性副品牌。
