      - number: '8.2'
        title: 融资背景与可比框架
        blocks:
          - type: paragraph
            body: >-
              公开融资记录只回答了一部分问题。它给出 2022 年接近 RMB30 billion 的估值锚，以及 2024/2025 年 Series B 合计 RMB9.4 billion
              的更大融资总额，但没有披露确切投后条款。光这一点就足以让投资人谨慎。上市可比公司给估值加了一道约束。NIO、Li Auto、XPeng 和 Zeekr 的披露更清晰，但即便如此，相比最乐观的 EV
              叙事，它们的市值仍不算高。BMW 和 Mercedes 显示盈利型全球高端车企能值多少钱；BYD 和 Xiaomi 则说明，EV 故事搭上更大生态和规模后，估值能扩到什么程度。IM
              还没有明显资格按这些天花板公司交易。除非私募尽调发现的经济性远强于今天公开证据，可比框架支持折价，而不是稀缺性溢价。这种折价不是惩罚，而是透明度不足在这个行业里的自然成本——上市同业已经向投资人披露了比 IM
              目前多得多的信息。
