          - type: callout
            title: The company has real mitigants, but mostly against extinction rather than underperformance
            body: >-
              Fresh capital, SAIC backing, and live-market traction reduce the risk of immediate collapse, yet they do
              not solve margin, quality, or compliance execution.
            calloutType: strength
