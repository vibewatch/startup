      - number: '3.3'
        title: Distribution Power, Switching Costs, and Access
        blocks:
          - type: paragraph
            body: >-
              The hardest competitive advantages to copy are increasingly outside the spec sheet. Li Auto’s 530 retail
              stores and 511 service centers show how premium EV competition now includes national delivery, servicing,
              and trust infrastructure. Aito likewise pairs product-market fit with Huawei’s ecosystem halo. NIO’s
              larger installed base and software-centric premium identity also matter. By contrast, IM’s public evidence
              emphasizes product launch momentum and technical claims more than channel depth. That suggests customer
              switching costs remain moderate: buyers can compare similar vehicles across many brands and financing
              channels, but they still care about service reliability, software familiarity, and resale confidence. In
              other words, lock-in is softer than in enterprise software, yet not trivial. Competitors with more stores,
              denser fleets, and stronger ecosystems enjoy an advantage that pure hardware parity does not fully erase.
