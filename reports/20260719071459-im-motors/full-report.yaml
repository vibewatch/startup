            body: >-
              The strongest public customer evidence is adoption volume. IM passed 100,000 cumulative deliveries by late
              2024, posted monthlies above 10,000 in October and November 2024, and reached 81,000 deliveries in 2025.
              Those are meaningful numbers for a premium Chinese EV brand even if they remain small versus the category
