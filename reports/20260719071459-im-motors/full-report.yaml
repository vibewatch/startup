      - number: '2.2'
        title: Buyer Segments, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Premium EV demand in China is no longer monolithic. The most important buyer groups include urban
              smart-BEV buyers who want fast charging, software-rich cockpits, and strong ADAS; family-oriented EREV SUV
              buyers who want premium space without charging anxiety; incumbent-luxury switchers comparing Chinese
              brands to Tesla, BMW, Mercedes, Audi, and Lexus; and export-market distributors or partners who localize
              China-developed products abroad. In most cases the payer is the household rather than a fleet operator,
              which means perceived resale value, safety, and after-sales trust remain crucial. The family EREV category
              matters particularly because it has become the most commercially powerful premium-SUV wedge for brands
              like Li Auto and Aito. That success proves that even as BEV penetration rises, many affluent buyers still
              prioritize range flexibility and low-friction long-distance usage. For IM, this means a pure-BEV thesis is
              incomplete; the market itself has voted for a broader mix of premium BEVs, EREVs, and intelligent features
              delivered at increasingly accessible prices.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM017
              - CM034
