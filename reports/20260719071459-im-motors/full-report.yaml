          - type: callout
            title: Several medium risks can compound into one large problem
            body: >-
              Supplier dependence, price pressure, weak app experience, and export-partner underperformance may each be
              survivable alone but can reinforce one another quickly.
            calloutType: insight
            claimRefs:
