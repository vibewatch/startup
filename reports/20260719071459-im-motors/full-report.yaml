            body: >-
              Even without detailed accounts, the economic shape of IM’s business is obvious: it is capital hungry.
              Vehicle programs require design, homologation, battery procurement, tooling, marketing, software
              validation, warranty support, and factory utilization long before cash generation becomes self-sustaining.
              Series B coverage explicitly said funds were earmarked for digital chassis, steer-by-wire, ADAS, and four
              new products, which is exactly the kind of spending plan that consumes capital faster than public list
              prices alone might imply. SAIC support clearly lowers existential risk, and official or local-government
              materials show the surrounding industrial base is real. But public evidence still does not disclose cash,
