  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              IM’s product should be understood as a premium intelligent mobility workflow, not just a list of car
              models. The customer journey begins with choosing between sedan and SUV form factors, then between
              pure-BEV and now extended-range architectures, then continues into app-linked usage, remote vehicle
              monitoring, assisted driving, charging, parking, and support. The product portfolio today spans L6 and L7
              sedans, LS6 and LS7 SUVs, and a coming LS9 flagship that introduces a large EREV form factor. Official
              landing pages add the unifying layer: IM Digital Chassis, advanced electrification, an AI cabin, IM AD,
              and the Stellar extended-range system. That framing matters because it shows IM’s product value is meant
              to come from integrated control systems and ownership experience, not simply raw battery size or
              acceleration statistics alone. In diligence terms, the buyer is paying for the whole operating feel of the
              car—steering, charging, software, parking, and remote management—rather than for one isolated hardware
              part.
