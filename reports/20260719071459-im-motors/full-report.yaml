  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is one of IM’s most material exposures because the company’s product strategy leans
              heavily on exactly the areas Chinese regulators are tightening: OTA software upgrades, assisted-driving
              functionality, connected-vehicle data, and battery safety. MIIT and SAMR’s 2025 notice raises the bar for
              testing, admission, recall, and upgrade governance, while the new GB 38031 battery standard adds stricter
              technical and safety requirements from mid-2026 onward. On the legal side, IM’s own privacy-policy scope
              confirms that the company processes personal information across app, website, purchase, and usage
              interactions, which puts it squarely inside China’s PIPL compliance framework. None of this means IM has a
              known public enforcement problem today. It does mean that a premium smart-EV strategy now carries a
              heavier compliance payload than before, and that mistakes in software, data, or battery validation can
              become regulatory events rather than routine product issues. For a brand positioning itself as intelligent
              and premium, even one visible compliance failure could transmit quickly into customer-trust and financing
              risk in public markets today globally.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
