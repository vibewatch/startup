      - number: '7.2'
        title: Operational, Quality, and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, IM is trying to do many hard things at once. It is refreshing BEV products, launching a new
              EREV stack, deploying smart-driving features broadly, and building export channels that must support
              premium owners after sale. Each layer adds complexity: 800V systems and battery safety create validation
              risk; lidar and compute dependencies create integration risk; and the lack of independent field-quality
              data means outside observers cannot verify how robust the stack really is. Supplier concentration
              compounds the issue because upstream batteries and perception hardware are not commodity add-ons.
              Customer-facing software is another weak point. The low app-store rating does not prove a systemic
              problem, but it is a real early warning that the ownership layer can disappoint even while the product
              story remains attractive on paper. Premium car brands can survive thin margins for a time; they struggle
              to survive repeated quality or trust failures.
