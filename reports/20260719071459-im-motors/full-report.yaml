      - number: '1.2'
        title: Leadership, Governance, and Parent Oversight
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a management structure centered on co-CEO Liu Tao, later joined in public
              communication by CEO Jiang Jun, but the governance picture remains more parent-led than
              startup-independent. Liu Tao appears repeatedly in 2022 through 2025 funding, product, and
              overseas-expansion coverage as the executive voice on model strategy, EREV direction, and investor
              communication. By December 2025, an internal letter cited by automotive media was signed by Jiang Jun and
              Liu Tao together, indicating a dual-top-team arrangement. At the board and control level, however, the
              stronger signal comes from SAIC. Bamboo Works reported that SAIC chief Jia Jianxu took key IM board
              positions in early December 2024, including chairman, which suggests that the parent tightened direct
              oversight as market pressure rose. That aligns with later SAIC language calling IM its premium flagship.
              What remains missing is a clean, public board roster, formal committee structure, or investor-rights
              disclosure for outside round participants. For diligence purposes, IM appears operationally branded as a
              premium EV venture but strategically governed as a closely supervised SAIC platform with selective outside
              capital rather than as a fully autonomous venture-backed company.
