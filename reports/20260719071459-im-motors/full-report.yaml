      - number: '2.3'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest structural driver in China’s EV market is that the category has moved from policy-supported
              growth to category-wide consumer normality. NEV penetration is now above 50 percent in the passenger
              market, domestic brands dominate the mainstream, and luxury-segment NEV penetration reached 37.5 percent
              even before the top end fully converted. But the driver stack has changed. Third Bridge argues that 2025
              marked a shift from blunt price wars toward technology competition, especially in intelligent driving,
              because indiscriminate discounting damaged dealer economics and residual values. That shift benefits
              brands that can bring software, battery, and ADAS differentiation to market quickly, but it also raises
              capital needs. New OTA and recall rules plus battery-safety standards increase compliance burdens, while
              concentrated upstream battery power leaves OEMs exposed to CATL, BYD, and a handful of other suppliers.
              Meanwhile, export growth and Southeast Asian localization offer an escape valve for domestic crowding, yet
              they also require partner ecosystems, factories, and local supply chains. The market is growing, but it is
              growing more demanding at the same time.
