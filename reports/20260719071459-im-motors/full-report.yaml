companyProfile:
  summary: >-
    IM Motors is a Shanghai-based premium intelligent electric-vehicle brand founded in 2020 by SAIC Motor, Alibaba
    Group, and Zhangjiang Hi-Tech. It began with premium BEV sedans and SUVs such as the L7, LS7, L6, and LS6, and by
    2025 had broadened into a more market-aligned mix that included extended-range strategy and an upcoming LS9
    flagship. Public evidence supports meaningful commercial progress—100,000+ cumulative deliveries by late 2024,
    81,000 deliveries in 2025, and live export-market rollouts in Singapore, Thailand, Australia, and the GCC—plus a
    large 2024/2025 financing round totaling RMB 9.4 billion. The company is strategically credible, but still
    materially under-disclosed versus public EV peers.
