chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Positioning
        blocks:
          - type: paragraph
            body: >-
              IM Motors, also known as Zhiji Automobile Technology in legal or Chinese-language contexts, was founded in
              December 2020 to serve as SAIC Motor’s premium intelligent EV venture. Public materials consistently
              describe the company as a three-way collaboration among SAIC, Alibaba, and Zhangjiang Hi-Tech, with the IM
              brand explained in early coverage as “Intelligence in Motion.” The official Singapore market site
              emphasizes the same logic in more narrative form: SAIC contributes vehicle engineering and production
              depth, Alibaba contributes AI, cloud, and connected-car software capabilities, and Zhangjiang contributes
              the Shanghai innovation ecosystem and R&D linkage. That combination matters because IM is not framed as a
              typical independent startup; it is framed as a state-backed automotive platform wrapped in
              technology-brand language. In April 2025 SAIC chairman Wang Xiaojun went further, calling IM Motors the
              group’s sole premium brand and top-priority project for the RMB 200,000-plus market. That statement
              confirms the strategic role of IM: it is the parent’s designated spearhead for high-end intelligent EV
              competition rather than just one experimental side brand.
            claimRefs:
