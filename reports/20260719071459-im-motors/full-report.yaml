              Because IM does not publish revenue, the best public traction signal is delivery volume. Gasgoo’s
              81,000-unit 2025 delivery figure, combined with visible launches and order announcements, establishes that
              IM is selling real cars at meaningful but still subscale volume. GTM quality has to be inferred from
