      - number: '7.4'
        title: Mitigations, Kill Criteria, and Residual Risk
        blocks:
          - type: paragraph
            body: >-
              IM is not defenseless against these risks. It has SAIC industrial backing, meaningful recent funding,
              visible product traction, and at least some export-partner depth. Those are real mitigants. But they
              mostly reduce existential risk; they do not remove residual exposure. The company still has to prove that
              its compliance systems keep pace with smarter vehicles, that product quality holds up under more
              aggressive deployment, that distributors can convert attention into sell-through, and that pricing
              discipline survives China’s brutal EV competition. For investors, the most useful risk framework is
              therefore monitorable rather than binary. Watch for regulatory delay, recall activity, persistent
              app-quality complaints, evidence of below-cost selling, weak export sell-through, or signs that the EREV
              pivot consumes capital without lifting durable demand. If several of those triggers fire together, the
              thesis weakens quickly even if headline deliveries still look respectable.
            claimRefs:
              - CR031
              - CR032
              - CR033
              - CR034
