              deliveries, margins, and channel details; IM does not. That makes listed peers useful for bounding what
              healthy or stressed premium EV economics can look like, but it also highlights how much diligence remains
              impossible from public IM materials alone. Public capital markets further show that even the stronger
              Chinese EV names trade at valuations far below Tesla, underscoring that investors remain skeptical about
