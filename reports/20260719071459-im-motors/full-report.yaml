  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Rival Classes
        blocks:
          - type: paragraph
            body: >-
              The most important competitor mistake would be to compare IM only to other BEV sedans. In practice,
              Chinese premium EV buyers compare across price bands, body styles, and powertrains. Tesla remains the
              benchmark around the RMB250,000-350,000 band, NIO remains the closest premium smart-BEV brand analog, Li
              Auto and Aito dominate the family-oriented premium SUV job, and Zeekr, Denza, XPeng, plus premium legacy
              foreign brands all shape buyer expectations above and below IM’s exact trims. That means IM’s relevant
              landscape includes direct peers, adjacent Chinese premium brands, international incumbents, EREV
              substitutes, and premium ICE switch-out options. Public H1 2025 price-band data make the core point clear:
              while the China EV market is vast, the upper-middle premium brackets are already dense with capable,
              well-funded rivals that have larger fleets, bigger service footprints, or stronger brand recognition than
              IM today. Even within China’s huge EV market, there are few uncontested premium pockets left for a
              challenger to occupy.
            claimRefs:
