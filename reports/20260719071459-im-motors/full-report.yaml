      - number: '1.3'
        title: Funding History, Shareholding, and Milestones
        blocks:
          - type: paragraph
            body: >-
              IM Motors has raised large amounts of capital by startup standards, but the structure is unusual because
              it combines parent-company sponsorship with successive external rounds. Early 2022 reporting described
              SAIC as holding 54 percent, with Alibaba and Zhangjiang each at 18 percent, while a further 10 percent
              pool was reserved for employees and users who contributed data. In August 2022 the company’s Series A
              round valued IM at nearly RMB 30 billion and added institutional investors such as BOCOM Capital, the
              National Green Development Fund, and CITIC Securities Investment. In December 2024 IM announced completion
              of Series B1, bringing total Series B funding to RMB 9.4 billion. Public reporting says the money will
              fund digital chassis, steer-by-wire, and smart-driving development plus new-model launches. By that point
              the company had passed 100,000 cumulative deliveries and had finally achieved two consecutive months above
              10,000 units, improving the story presented to both customers and financiers. Public chronologies also
              show a clear product-and-capital cadence: founding in 2020, L7 launch in 2022, LS6 volume breakout in
              2023-2024, L6 widening the addressable price band in 2024, and overseas market entry plus profitability
              signaling in 2025.
