  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Recognition Limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a straightforward primary revenue engine: selling premium EVs. The reviewed
              source set did not reveal a separately disclosed subscription, autonomy, software, or services revenue
              line for IM. Instead, what is visible are repeated model launches, official guide prices, promotional
              prices, export-market promotions, and distributor-led channel announcements. The L6 and LS6 price stacks
              show how IM monetizes through multiple trims and launch-period incentives, while Singapore and Australia
              pricing show that international revenue likely flows through local partners, not a standardized global
              direct-sales model. That matters because list prices and order counts are poor revenue proxies. They do
              not tell investors how many orders convert, what the realized net selling price is after subsidies or
              financing offers, or whether channel economics are healthy. Public pricing proves market participation,
              not revenue quality.
