      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution under tightening regulation is the top risk
            body: >-
              IM’s smartest features sit directly in the zones where China has raised the compliance bar: OTA, ADAS,
              battery safety, and data governance.
