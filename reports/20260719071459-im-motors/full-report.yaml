  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments, Buyer Logic, and Use Cases
        blocks:
          - type: paragraph
            body: >-
              IM’s public customer picture is closest to a premium consumer-auto story, not an enterprise or fleet
              story. The visible buyer is an affluent household or driver-led household deciding among premium EV sedans
              and SUVs, with the payer typically being the same household that uses the vehicle. Within that broad
              group, two subsegments matter most: buyers attracted to premium smart sedans such as the L6 / IM5 and
              family or crossover buyers increasingly pulled toward the LS6 / IM6 and future larger SUVs. Export-market
              adopters add a third segment, but those customers are reached mainly through distributors rather than a
              fully self-operated direct model. Public positioning around long-range family use, comfort, parking
              features, and premium interior experience reinforces that the customer job is not cheap transportation; it
              is premium technology-enabled mobility with status, convenience, and family utility built in. That also
              means the customer decision is emotionally loaded: brand trust, after-sales confidence, and daily digital
              usability matter almost as much as raw horsepower or advertised range.
