        title: Trust, Safety, Privacy, and Technical Verdict
        blocks:
          - type: paragraph
            body: >-
              The trust picture is mixed. On the positive side, IM clearly treats data governance as a real issue: its
              privacy policy explicitly covers the app, website, mini-programs, purchases, vehicle use, and store
              interactions. Public materials also discuss safety features and assisted-driving capabilities as central
              parts of the offering. On the negative side, the source base reviewed here did not surface independent
              reliability, recall, failure-rate, or apples-to-apples autonomy benchmark evidence sufficient to prove
              best-in-class safety or robustness. That is especially important because the product depends on complex
              interactions between batteries, sensors, software, connectivity, and chassis control. The technical
              verdict is therefore favorable but qualified: IM appears to have a credible modern EV stack, yet the
              hardest proof points still sit behind supplier relationships, internal testing, or post-sale operating
              data that are not public. For investors, the unresolved question is not whether IM can describe an
