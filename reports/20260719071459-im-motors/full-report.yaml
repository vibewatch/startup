  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for IM is coherent. The company operates in the world’s deepest EV market, has
              already crossed into meaningful delivery scale, has access to major industrial and financial sponsors, and
              is broadening from premium BEVs into formats the market has clearly validated. The anti-thesis is equally
              coherent: IM is still subscale versus leading peers, still opaque on margins and cash economics, and still
              exposed to a market where competition has become so intense that regulators are intervening. When those
              two narratives are weighed together, the right recommendation is not an unconditional buy or a dismissive
              pass. It is watch / track. That recommendation recognizes real upside optionality while refusing to
              underwrite an aggressive mark without price discipline and better evidence on the unit-economic core. In
              other words, the company may be good enough to follow closely, but the current public information is not
              good enough to accept a heroic price by default.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV027
              - CV040
              - CV041
