      - number: '1.4'
        title: Scale, Product-Mix Reset, and Expansion Path
        blocks:
          - type: paragraph
            body: >-
              The strongest operating story is that IM found more traction after moving away from the very high price
              points of the original L7 and LS7 and toward the L6 and especially the LS6. Public reporting shows October
              2024 sales of 10,001 vehicles and November 2024 sales of 10,007 vehicles, while 36Kr cites full-year 2024
              sales of 65,505, up 71 percent year on year. Bamboo Works adds the important caveat that these gains still
              fell short of IM’s 2024 internal target and that early flagship pricing above RMB 400,000 limited the
              addressable market. That makes the LS6 and L6 pivot strategically important, not just incrementally
              helpful. By late 2024 IM had four BEV models on sale; by 2025 it was planning two additional BEVs and two
              EREVs, signaling that management no longer viewed pure-BEV premium positioning as enough. Overseas
              activity also shifted from aspiration to execution. Thailand became the first visible export beachhead in
              March 2025 via the IM6, and later partner-led moves in Singapore, Australia, and the GCC expanded
              optionality without proving a standalone global retail system. The picture is of a brand that has crossed
              an important survival threshold but is still proving whether scale can become durable without continuous
              parent support and product repricing.
