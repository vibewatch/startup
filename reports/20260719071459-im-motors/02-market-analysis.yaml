  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "China’s NEV market is enormous and still growing, with 5.46 million H1 2025 passenger-vehicle NEV sales, 50 percent penetration, and roughly 15.3 million full-year wholesale volume. But IM Motors does not compete with that whole TAM: its practical arena is the premium intelligent EV segment where international incumbents still matter above 350,000 yuan, family EREV SUVs remain powerful, and technology differentiation increasingly matters more than raw price cuts. That makes IM’s opportunity real but narrower and more competitive than headline China EV growth suggests."
  },
  "sections": [
    {
      "id": "market-boundary-and-size",
      "title": "Market Boundary and Evidence-Constrained Size",
      "body": "The right market frame for IM Motors is not “all Chinese EVs.” It is the premium intelligent passenger-vehicle NEV market, centered on sedans and SUVs from roughly RMB 200,000 upward, where buyers care about software, charging speed, safety, and brand as much as propulsion alone. H1 2025 data show just how large the overall pool is: China sold 10.891 million passenger vehicles, of which 5.458 million were NEVs, taking penetration to just above 50 percent. Full-year 2025 forecasts from CPCA-linked and industry sources cluster around 15.3 million NEV units. That headline volume, however, overstates what is truly addressable for IM. ThinkerCar’s segment mix suggests the >RMB300,000 share has narrowed to about 9.3 percent of the market, while the biggest share sits in the RMB100,000-200,000 band. A defensible SAM proxy for IM is therefore closer to roughly 1.4-1.6 million annual premium units than to the full 15-million-plus NEV TAM. That still leaves a large opportunity, but one already intensely contested by Tesla, Li Auto, Aito, NIO, Zeekr, Denza, and fast-moving legacy groups.",
