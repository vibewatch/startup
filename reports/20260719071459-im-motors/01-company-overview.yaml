    "number": 1,
    "title": "Company Overview",
    "summary": "IM Motors is Shanghai-based SAIC Motor’s premium intelligent EV venture with Alibaba and Zhangjiang Hi-Tech, founded in December 2020 and positioned as SAIC’s flagship high-end EV bet. Public evidence supports a 2022 Series A valuation near RMB 30 billion, a December 2024 Series B total of RMB 9.4 billion, 100,000 cumulative deliveries by late 2024, and a shift from expensive early flagships toward the higher-volume L6 and LS6. The brand has begun overseas expansion and claims first monthly full-cost profitability in December 2025, but governance detail, audited headcount, and long-term independence from SAIC remain under-disclosed."
  },
  "sections": [
