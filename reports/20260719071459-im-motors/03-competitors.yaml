    {
      "id": "product-and-capability-headtohead",
      "title": "Product, Pricing, and Capability Head-to-Head",
      "body": "On product and technology, IM is more credible than its delivery volume alone suggests. The refreshed LS6 and L6 public record shows lidar, Nvidia Orin X compute, city or highway NOA, four-wheel steering, fast charging, and in some trims eye-catching acceleration or range claims. Public reports also show IM broadening from premium BEV-only positioning toward lower starting prices and extended-range offerings, which effectively pulls it closer to the same battleground occupied by Tesla, NIO, Li Auto, and Aito. That is strategically rational because the market increasingly rewards feature density relative to price. But it also means IM has entered the most crowded segment of the Chinese market: intelligent cars in the RMB200,000-300,000 range where rivals already scale. IM can claim parity on many hardware talking points; it cannot yet claim parity on installed base, ecosystem lock-in, or buyer mindshare. That leaves IM exposed whenever a better-known rival launches a roughly comparable car at a similar payment level.",
