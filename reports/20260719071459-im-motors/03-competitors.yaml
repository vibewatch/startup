    {
      "id": "durability-and-where-im-can-still-win",
      "title": "Moat Durability and Where IM Can Still Win",
      "body": "For underwriting, the most useful conclusion is that IM has a partial moat but not a closed one. SAIC-backed engineering depth, visible smart-driving capability, and a viable premium brand are real assets. Yet public scale markers still show IM far behind the leading Chinese premium groups, and public market values show how skeptical investors remain about durable differentiation in this category. Adverse evidence is therefore powerful: rivals can compress IM from the BEV side, the EREV side, and the channel side at the same time. The best remaining openings appear to be subsegments where IM can overdeliver on feature density versus price—sporty electric sedans, well-equipped mid-size SUVs, and export-adjacent markets where incumbency is weaker. But without stronger brand pull, after-sales reach, and better proof of realized pricing, IM remains vulnerable to commoditization by faster-scaling peers. For investors, the burden of proof is therefore on commercial conversion, not on whether IM can name advanced components in its product stack.",
