    {
      "id": "financing-context-and-comparable-frame",
      "title": "Financing Context and Comparable Frame",
      "body": "The public financing record gives only part of the answer. It shows a 2022 valuation anchor near RMB30 billion and a much larger 2024/2025 Series B fundraising total of RMB9.4 billion, but it does not show the exact post-money terms. That alone should make investors cautious. Public comparables add discipline. NIO, Li Auto, XPeng, and Zeekr all provide clearer disclosure and still trade at modest market caps compared with the most optimistic EV narratives. BMW and Mercedes show what profitable global premium auto franchises are worth, while BYD and Xiaomi show how much valuation can expand when the EV story rides on broader ecosystems and scale. IM does not yet obviously deserve to trade like those ceiling names. The comparable frame therefore supports a discount, not a scarcity premium, unless private diligence uncovers much stronger economics than public evidence implies today. That discount is not punitive; it is the natural price of opacity in a sector where public peers already tell investors far more than IM currently does.",
