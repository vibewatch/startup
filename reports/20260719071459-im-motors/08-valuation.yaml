    {
      "id": "scenario-ranges-and-entry-discipline",
      "title": "Scenario Ranges and Entry Discipline",
      "body": "The valuation range should be framed through scenarios, not false precision. In the bear case, price competition, export friction, and capital intensity dominate, pushing IM toward a low-single-digit-billion valuation closer to what subscale public peers imply. In the base case, IM keeps growing and the EREV pivot works well enough to sustain strategic relevance, but disclosure stays too thin for a premium multiple. In the bull case, the company proves stronger margins, credible export traction, and a more durable premium-family franchise than skeptics expect. Even then, investors should remember that option value is not free. Regulatory tightening, EU tariff pressure, and the need for continued flawless execution all argue for a discount rate that is higher than the one a fully disclosed public comp would deserve. Entry discipline is therefore central to the recommendation itself. A generous scenario range is not a reason to pay any price, especially when the private mark and rights package are still not fully visible from public sources.",
