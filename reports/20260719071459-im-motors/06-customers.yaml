    {
      "id": "satisfaction-retention-and-proof-quality",
      "title": "Satisfaction, Retention, and Proof Quality",
      "body": "Public proof quality is mixed but useful. Singapore provides the richest named evidence stack because the IM5 and IM6 have been reviewed against direct alternatives, won awards, and received detailed editorial treatment from several outlets. That gives confidence that the products resonate with premium buyer and reviewer expectations. But it is not the same as retention data. IM does not publicly provide repurchase, renewal, churn, or cohort metrics. The best adverse signal in the reviewed set is the app’s 2.2 out of 5 rating in the Singapore App Store, which suggests the digital ownership layer may still create friction for some users. A positive review stack plus a weak app rating is a classic early-growth pattern: acquisition looks promising, but post-sale experience may still be uneven. The public record supports “appeal” much more strongly than it supports “durability.” In diligence terms, IM looks increasingly capable of winning attention at the top of the funnel, while still leaving the middle and bottom of the ownership funnel under-documented.",
