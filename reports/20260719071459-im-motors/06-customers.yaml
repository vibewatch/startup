  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "IM Motors has clearly moved beyond the “pre-customer” stage: public sources show 100,000-plus cumulative deliveries by late 2024, 81,000 deliveries in 2025, and a credible export-market rollout through partners in Singapore, Thailand, Australia, and the GCC. The buyer base appears to be affluent households and family users, not enterprise fleets. What is much harder to prove publicly is durability. The evidence stack is rich in launch momentum, reviews, and awards, especially in Singapore, but thin on repeat purchase, churn, retention, or cohort metrics. That makes IM’s customer proof real but still more acquisition-led than loyalty-led."
  },
  "sections": [
    {
      "id": "segments-and-buyer-logic",
      "title": "Customer Segments, Buyer Logic, and Use Cases",
      "body": "IM’s public customer picture is closest to a premium consumer-auto story, not an enterprise or fleet story. The visible buyer is an affluent household or driver-led household deciding among premium EV sedans and SUVs, with the payer typically being the same household that uses the vehicle. Within that broad group, two subsegments matter most: buyers attracted to premium smart sedans such as the L6 / IM5 and family or crossover buyers increasingly pulled toward the LS6 / IM6 and future larger SUVs. Export-market adopters add a third segment, but those customers are reached mainly through distributors rather than a fully self-operated direct model. Public positioning around long-range family use, comfort, parking features, and premium interior experience reinforces that the customer job is not cheap transportation; it is premium technology-enabled mobility with status, convenience, and family utility built in. That also means the customer decision is emotionally loaded: brand trust, after-sales confidence, and daily digital usability matter almost as much as raw horsepower or advertised range.",
      "claimRefs": [
