    {
      "id": "expansion-concentration-and-verdict",
      "title": "Expansion, Concentration Risk, and Customer Verdict",
      "body": "IM’s customer base is expanding geographically, but the pattern carries concentration risk. China still dominates the demand story, while overseas expansion relies on a limited set of partners such as Eurokars and Smart Mobility International, plus SAIC-linked local networks in markets like Thailand. Product concentration also appears meaningful: the L6 and LS6 do much of the visible work in public adoption evidence, while the broader line-up contributes less visibly to customer proof. Against large peers such as Aito and Li Auto, IM therefore looks real but still narrow. The key underwriting conclusion is that IM has already crossed the threshold of genuine consumer adoption, yet the public evidence remains acquisition-heavy, partner-mediated, and concentrated enough that durability should be treated as an open diligence question rather than an established strength. Investors should therefore view customer traction as genuine but still fragile until repeat-owner evidence and export sell-through become more transparent.",
