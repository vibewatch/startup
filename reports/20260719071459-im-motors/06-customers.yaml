    {
      "id": "adoption-trajectory-and-live-market-proof",
      "title": "Adoption Trajectory and Live-Market Proof",
      "body": "The strongest public customer evidence is adoption volume. IM passed 100,000 cumulative deliveries by late 2024, posted monthlies above 10,000 in October and November 2024, and reached 81,000 deliveries in 2025. Those are meaningful numbers for a premium Chinese EV brand even if they remain small versus the category leaders. Product-level evidence suggests that the LS6 refresh drove much of the volume inflection, while the L6 became credible enough to rank top-three in its premium sedan bracket in some 2025 snapshots. Outside mainland China, the strongest proof is not high-volume sales disclosure but live-market presence: local showrooms, local pricing, local reviews, award surfaces, and scheduled customer deliveries in Thailand, Singapore, and Australia. IM is therefore not merely collecting reservations; it is demonstrably delivering cars into real consumer markets. The remaining question is not whether customers exist, but how many of those customers convert from early excitement into stable ownership advocacy and repeat purchase behavior.",
