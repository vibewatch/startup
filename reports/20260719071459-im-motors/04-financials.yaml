    {
      "id": "cost-structure-capital-intensity-and-adequacy",
      "title": "Cost Structure, Capital Intensity, and Capital Adequacy",
      "body": "Even without detailed accounts, the economic shape of IM’s business is obvious: it is capital hungry. Vehicle programs require design, homologation, battery procurement, tooling, marketing, software validation, warranty support, and factory utilization long before cash generation becomes self-sustaining. Series B coverage explicitly said funds were earmarked for digital chassis, steer-by-wire, ADAS, and four new products, which is exactly the kind of spending plan that consumes capital faster than public list prices alone might imply. SAIC support clearly lowers existential risk, and official or local-government materials show the surrounding industrial base is real. But public evidence still does not disclose cash, burn, or net debt, so capital adequacy must be treated as directionally improved rather than proved. The same opacity means investors cannot distinguish between temporary launch-driven cash consumption and structurally weak per-unit economics. The round size is known; the runway is not.",
