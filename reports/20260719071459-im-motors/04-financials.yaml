    {
      "id": "peer-context-gaps-and-verdict",
      "title": "Peer Context, Disclosure Gaps, and Financial Verdict",
      "body": "Peer context helps frame what is missing. NIO and Li Auto provide public quarterly results with revenue, deliveries, margins, and channel details; IM does not. That makes listed peers useful for bounding what healthy or stressed premium EV economics can look like, but it also highlights how much diligence remains impossible from public IM materials alone. Public capital markets further show that even the stronger Chinese EV names trade at valuations far below Tesla, underscoring that investors remain skeptical about durable differentiation and margin persistence in this category. IM’s claim of first full-cost monthly profitability is encouraging, yet it does not answer the essential questions about sustained gross margin, cash generation, or working-capital discipline. Nor does it resolve whether export expansion and new-model cadence will absorb most incremental cash before the business compounds internally generated funds. The public verdict is therefore mixed: IM looks financable and commercially active, but not yet transparent enough to support high-conviction financial underwriting without private diligence.",
