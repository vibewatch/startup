  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "IM Motors clearly monetizes cars, but almost everything investors really want to know about the business remains private. Public sources show list pricing for L6 and LS6, export-market pricing in Singapore and Australia, an 81,000-unit 2025 delivery result, and a December 2025 claim of first full-cost monthly profitability. They also show RMB 9.4 billion of Series B financing directed toward smart-driving, chassis, and new-product programs. What they do not show is cash on hand, burn, inventory, gross profit per vehicle, realized ASP, or warranty burden. Relative to listed peers such as NIO and Li Auto, IM’s finances therefore read as capital-backed and commercially alive, but still too opaque to underwrite on public evidence alone."
  },
  "sections": [
    {
      "id": "revenue-model-and-pricing",
      "title": "Revenue Model, Pricing, and Recognition Limits",
      "body": "Public evidence points to a straightforward primary revenue engine: selling premium EVs. The reviewed source set did not reveal a separately disclosed subscription, autonomy, software, or services revenue line for IM. Instead, what is visible are repeated model launches, official guide prices, promotional prices, export-market promotions, and distributor-led channel announcements. The L6 and LS6 price stacks show how IM monetizes through multiple trims and launch-period incentives, while Singapore and Australia pricing show that international revenue likely flows through local partners, not a standardized global direct-sales model. That matters because list prices and order counts are poor revenue proxies. They do not tell investors how many orders convert, what the realized net selling price is after subsidies or financing offers, or whether channel economics are healthy. Public pricing proves market participation, not revenue quality.",
