    {
      "id": "traction-and-sales-efficiency-proxies",
      "title": "Traction, GTM Motion, and Sales Efficiency Proxies",
      "body": "Because IM does not publish revenue, the best public traction signal is delivery volume. Gasgoo’s 81,000-unit 2025 delivery figure, combined with visible launches and order announcements, establishes that IM is selling real cars at meaningful but still subscale volume. GTM quality has to be inferred from channel signals. In China, IM’s public narrative focuses more on launches than on store counts; overseas, it uses partners such as Eurokars in Singapore, SMI in the GCC, and local channels in Thailand and Australia. That suggests a pragmatic capital-light export motion abroad while the domestic business continues to rely on SAIC-linked industrial depth. The Singapore article stream also shows IM already marketing directly against Tesla in export markets, which implies real selling expense and brand-building effort even where partners carry the local franchise. As a benchmark, Li Auto’s 530 stores and 511 service centers show what scaled premium EV go-to-market looks like when a brand can fund a dense national network. IM is still earlier on that maturity curve.",
      "claimRefs": [
        "CI014",
        "CI015",
        "CI019",
        "CI020",
        "CI021"
      ],
