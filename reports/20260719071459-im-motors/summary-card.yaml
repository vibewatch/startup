  topStrengths:
    - >-
      100,000+ cumulative deliveries by late 2024 and 81,000 deliveries in 2025 prove IM has real market presence, not
      just concept-level ambition.
    - >-
      SAIC, Alibaba, and Zhangjiang backing plus the RMB 9.4 billion disclosed Series B give IM more strategic
      resilience than a typical standalone EV startup.
    - >-
      Public product evidence shows real technical credibility in digital chassis, smart driving, fast charging, and a
      now-broader EREV strategy.
    - >-
      Singapore, Thailand, Australia, and GCC expansion provide credible early proof that IM can travel beyond mainland
      China through partner-led channels.
  topRisks:
    - >-
      Exact Series B post-money valuation, cash runway, model-level margins, and working-capital profile remain
      undisclosed, making valuation confidence materially lower than company-quality confidence.
    - >-
      China EV price competition, tighter OTA and battery regulation, and supplier concentration can compress margins
      and delay roadmap execution quickly.
    - >-
      Customer proof is much stronger on acquisition and launch momentum than on retention, repurchase, software
      satisfaction, or service durability.
    - >-
      The investment story still depends heavily on flawless execution across BEV refreshes, EREV expansion, and
      partner-led overseas rollout.
  unresolvedGaps:
    - No exact Series B / B1 post-money valuation, preferences, or governance-rights disclosure.
    - No public cash, burn, runway, gross-margin, or inventory data sufficient for clean underwriting.
    - No public owner-cohort, churn, repurchase, or app-engagement metrics to prove customer durability.
    - >-
      No independent reliability, warranty, or autonomy benchmark package strong enough to close the premium-tech proof
      gap.
