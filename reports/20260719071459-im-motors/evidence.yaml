evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-disclosure
    missingEvidence: >-
      A current statutory board roster, committee structure, and any investor governance rights for the 2024 Series B
      cohort.
    whyItMatters: >-
      Without formal governance disclosure it is hard to assess how much autonomy IM management actually has versus SAIC
      and whether outside investors hold vetoes or preferences.
    diligencePath: >-
      Request the latest shareholder agreement, board list, and any filed governance chart from management or the parent
      company.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: An audited or official current headcount for IM Motors itself, separated from SAIC or distributor staffing.
    whyItMatters: >-
      Headcount is a key scale and burn proxy for an automaker trying to prove it can fund R&D, channels, and overseas
      expansion without chronic capital dependence.
    diligencePath: >-
      Obtain management disclosure, an annual report footnote, or a verified HR / labor filing that states IM
      Motors-specific employee count.
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: series-b-terms
    missingEvidence: Exact 2024 Series B investor list, post-money valuation, preference terms, and dilution impact.
    whyItMatters: >-
      The headline funding amount is known, but the economic cost of that capital determines how investable any future
      IPO or private round really is.
    diligencePath: Ask for the Series B term sheet, capitalization table, and board-observer or veto-right summary.
    relatedQuestionRefs:
      - QO012
      - QO014
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: channel-footprint
    missingEvidence: A current owned-store, distributor, and service-center count through runDate, ideally by geography.
    whyItMatters: >-
      Retail footprint influences demand scaling and after-sales experience, especially as IM enters lower-tier Chinese
      cities and overseas markets.
    diligencePath: Request the latest channel map and signed outlet list from management or distributor partners.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: minor
    topic: ipo-readiness
    missingEvidence: Any formal IPO working-group mandate, target exchange, or pre-listing timetable authorized by the board.
    whyItMatters: >-
      Profitability headlines often precede financing narratives, but without board-approved listing preparation the IPO
      angle can be more rumor than process.
    diligencePath: Ask management and SAIC whether a C-round, pre-IPO round, or formal listing workstream has been approved.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: premium-sam-sizing
    missingEvidence: >-
      A direct CPCA or official annual table isolating the exact annual unit size of the premium intelligent-EV niche IM
      targets, rather than partial price-band rankings and derived shares.
    whyItMatters: >-
      Without a direct premium-SAM census, underwriting IM’s true addressable market still depends on inference and
      cross-source estimation rather than a single auditable market total.
    diligencePath: >-
      Obtain the full CPCA premium price-band tables or a paid market-research cut that isolates 200k-500k intelligent
      EV unit volumes by body style and powertrain.
    relatedQuestionRefs:
      - QM020
  - type: conflicting-data
    severity: minor
    topic: tam-methodology
    missingEvidence: One consistent retail versus wholesale methodology for annual NEV market size and premium-share math.
    whyItMatters: >-
      Different public sources mix retail, wholesale, and Jan-Nov versus full-year figures, which can overstate or
      understate the base used for premium-SAM calculations.
    diligencePath: Standardize on one CPCA retail or wholesale framework before doing any bottoms-up penetration model.
    relatedQuestionRefs:
      - QM005
      - QM006
  - type: stale
    severity: minor
    topic: purchase-tax-and-subsidy-path
    missingEvidence: A clean government timetable for how purchase-tax exemptions and other demand supports phase down after 2025.
    whyItMatters: >-
      Premium demand sensitivity changes once tax and trade-in supports normalize, especially for brands competing on
      technology rather than low price.
    diligencePath: Pull the latest MOF / MIIT policy notices and model the post-incentive price delta for IM’s core trims.
    relatedQuestionRefs:
      - QM013
  - type: private-evidence-only
    severity: minor
    topic: residual-value-data
    missingEvidence: Used-car residual-value curves and insurance cost data for the premium Chinese EV brands most comparable to IM.
    whyItMatters: >-
      Residual values shape lease economics, buyer confidence, and the durability of premium positioning in a market
      emerging from price wars.
    diligencePath: Request insurer, dealer, or used-car marketplace data on residuals for LS6/L6 peers and leading EREV SUVs.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: realized-pricing-and-incentives
    missingEvidence: >-
      A clean apples-to-apples dataset for realized transaction prices, financing subsidies, dealer incentives, and
      trade-in support across IM and its core peers.
    whyItMatters: >-
      Headline list prices overstate comparability if some brands rely much more heavily on incentives or channel
      support to move volume.
    diligencePath: >-
      Collect dealer quotes, financing offers, and insurance-inclusive out-the-door price sheets across major cities for
      LS6/L6, Tesla, NIO, Li Auto, and Aito.
    relatedQuestionRefs:
      - QP023
  - type: private-evidence-only
    severity: material
    topic: retention-repurchase-and-owner-switching
    missingEvidence: >-
      Brand-level repurchase, referral, retention, and conquest data showing which premium EV owners actually switch
      into or out of IM.
    whyItMatters: >-
      Without retention or conquest data, switching-cost conclusions remain inferential and may understate the power of
      service, community, and resale support.
    diligencePath: >-
      Request insurer, CRM, or dealer funnel data by brand and city tier, plus used-car trade-in patterns for direct
      peers.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: minor
    topic: independent-adas-benchmarking
    missingEvidence: >-
      A trusted third-party benchmark directly comparing IM’s NOA, parking, and safety performance against Tesla, NIO,
      Li Auto, Aito, and Zeekr using the same routes and scenarios.
    whyItMatters: >-
      Many brands now advertise similar hardware stacks, so independent performance validation matters more than
      spec-sheet parity.
    diligencePath: Obtain controlled road-test results, disengagement statistics, or insurer safety outcomes by model.
    relatedQuestionRefs:
      - QP011
  - type: conflicting-data
    severity: minor
    topic: im-l6-price-and-spec-basis
    missingEvidence: >-
      One canonical source reconciling L6 list pricing and trim-level specs across launch articles, updated pricing, and
      data aggregators.
    whyItMatters: >-
      Different public snapshots show different trim prices and spec combinations, which complicates direct competitor
      mapping.
    diligencePath: Pull the full official configurator or homologation sheet for each model-year trim and map changes over time.
    relatedQuestionRefs:
      - QP006
      - QP023
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash on hand, monthly cash burn, committed capex, and debt or project-finance obligations.
    whyItMatters: >-
      Without those metrics, the recent funding round cannot be converted into a reliable runway estimate or next-round
      timing view.
    diligencePath: Request the latest management balance sheet, cash bridge, and 12-18 month operating plan.
    relatedQuestionRefs:
      - QI014
      - QI016
  - type: private-evidence-only
    severity: material
    topic: vehicle-unit-economics
    missingEvidence: Model-level realized ASP, gross margin, warranty cost, financing support, and order-to-delivery conversion.
    whyItMatters: These are the core inputs required to judge whether IM can scale profitably or is buying volume with incentives.
    diligencePath: Request a unit-economics pack by major model and quarter.
    relatedQuestionRefs:
      - QI021
      - QI022
      - QI024
  - type: conflicting-data
    severity: minor
    topic: list-pricing-basis
    missingEvidence: >-
      One canonical, time-stamped configurator record reconciling varying L6 and LS6 price snapshots across launch
      articles and data aggregators.
    whyItMatters: >-
      Price-band comparisons are sensitive to trim basis and promotions, and public articles do not always reference the
      same variant set.
    diligencePath: >-
      Pull the official trim list for each launch and subsequent update date, then restate all pricing comparisons on
      the same basis.
    relatedQuestionRefs:
