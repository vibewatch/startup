  evidenceGaps:
    - id: EI001
      topic: "Undisclosed SPAC redemption rate and net proceeds to PlusAI"
      description: >-
        As of the May 2026 diligence date, the actual Churchill Capital Corp IX shareholder
        redemption rate, PIPE commitment terms, and net cash proceeds to PlusAI from the
        SPAC transaction have not been publicly disclosed. This is the single most important
        financial unknown: it determines PlusAI's actual post-listing cash runway and
        whether additional capital raises will be required before the 2027 SuperDrive
        commercial milestone.
      relatedQuestionRefs: [QI009]
      relatedTableRefs: [TI003, TI005]

    - id: EI002
      topic: "Undisclosed TRATON equity warrant terms and dilution mechanics"
      description: >-
        TRATON's equity warrant terms — including exercise price, expiration date, warrant
        count, and anti-dilution provisions — have not been publicly disclosed in PlusAI's
        S-4 or press releases. These terms are material to post-SPAC dilution modeling and
        investor return analysis. The warrant exercise could represent meaningful dilution
        if the post-SPAC stock price exceeds the exercise price and TRATON elects to exercise.
      relatedQuestionRefs: [QI006]
      relatedTableRefs: [TI005]

    - id: EI003
      topic: "HyperFoundry customer identity and pipeline composition"
      description: >-
        PlusAI has not publicly disclosed the specific enterprise customers comprising the
        $25 million contracted HyperFoundry pipeline, their industries, contract lengths,
        or renewal terms. Without this information, it is not possible to assess pipeline
        quality, customer concentration within HyperFoundry, or the probability of
        achieving the $40–50 million 2026 revenue target. This gap is critical to evaluating
        whether HyperFoundry can function as a standalone high-margin revenue diversifier.
      relatedQuestionRefs: [QI027]
      relatedTableRefs: [TI001]

    - id: EI004
      topic: "PlusDrive gross margin by component and subscription penetration rate"
      description: >-
        PlusAI has not publicly disclosed gross margins by product component (hardware vs.
        SaaS) or the exact installed-base-to-subscription ratio. Without these figures,
        unit economics modeling relies on industry benchmarks rather than company-specific
        data. The hardware-to-SaaS revenue mix, along with gross margin progression over
        time as hardware costs decline, is essential to projecting the path to profitability.
      relatedQuestionRefs: [QI015]
      relatedTableRefs: [TI004]
    - id: EI005
      topic: "Prior-year (2024) revenue baseline not publicly disclosed"
      description: >-
        PlusAI has not publicly disclosed its fiscal year 2024 revenue figures,
        making it impossible to calculate a verified year-over-year revenue growth
        rate from 2024 to 2025. The $47.5M 2025 figure appears in the S-4 but
        without a comparable 2024 figure in publicly accessible materials. This
        gap limits diligence on revenue growth trajectory.
      relatedQuestionRefs: [QI017]
      relatedTableRefs: []
