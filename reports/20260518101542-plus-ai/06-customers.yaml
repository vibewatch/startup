  - id: customer-segment-map
    title: Customer Segment Map and Market Penetration
    body: >-
      Plus.ai operates a B2B2C commercial model in which OEM integrators are the primary
      direct customers: fleet operators receive Plus.ai's autonomous software through
      factory-built trucks purchased from TRATON, International, or IVECO rather than
      through a direct software contract with Plus.ai. This indirect channel concentrates
      commercial execution risk in the OEM tier: if any OEM integration program stalls
      or an OEM redirects its AV strategy, downstream fleet adoption is immediately
      impaired. Plus.ai also maintains a direct-to-fleet channel for large operators
      such as Ryder System, creating a dual-channel commercial model.

      The OEM integrator segment — covering Class 8 long-haul truck manufacturers — shows
      early penetration. Three of an estimated fifteen major global Class 8 OEM families
      have active integration agreements with Plus.ai (TRATON/Scania/MAN, International/Navistar,
      IVECO), giving the company meaningful breadth across North America and Europe but
      leaving Asian OEMs (Dongfeng, FAW, CNHTC, Volvo) and other US OEMs (Daimler/DTNA,
      PACCAR/Kenworth/Peterbilt) unaddressed. Aurora's competing approach — pure-software
      OEM licensing without factory equity integration — has secured PACCAR and Volvo,
      suggesting customer complement rather than pure head-to-head competition in the
      OEM tier.

      The large fleet operator segment is at very early penetration: Ryder System is the
      only confirmed active fleet participant in a live Level 4 trial as of May 2026.
      Schneider National and Werner Enterprises, both announced as PlusDrive L2+ pilots
      in 2021–2022, have not publicly renewed or expanded and Werner has migrated to
      Aurora. The enterprise AI segment (HyperFoundry) has zero public named customers
      despite a disclosed $25M contracted pipeline, representing the highest-opacity
      customer segment in the portfolio. Small and mid-sized fleet operators are not
      addressable by Plus.ai's current factory-integrated model, which requires OEM
      partnership for truck manufacturing.
