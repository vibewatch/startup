    title: Plus.ai customer relationship timeline
    type: timeline
    layout: standard
    summary: >-
      Key milestones in Plus.ai's customer engagement history from the 2021 TRATON
      partnership launch through the March 2026 I-35 fleet trial.
    data:
      items:
        - label: "TRATON Partnership and Equity Investment (2021)"
          description: >-
            TRATON Group announces multi-year R&D license, equity investment, and board
            seat in Plus.ai — establishing the anchor OEM customer relationship.
        - label: "Schneider National and Werner Enterprises Pilot Announcements (2021–2022)"
          description: >-
            Two large US carriers announced as PlusDrive L2+ pilot customers; subsequent
            silence through 2026 suggests stalled conversions.
        - label: "China Operations Transfer to Full Truck Alliance / YMM (2023)"
          description: >-
            Plus.ai's China team and related equity interests transferred to Full Truck
            Alliance (NASDAQ: YMM), partially de-risking CFIUS overhang for US customers.
        - label: "TRATON Global L4 Software Release — Partnership Expanded (Oct 2024)"
          description: >-
            Joint press release with TRATON brands Scania, MAN, and International confirms
            expansion to cover both US and European factory OEM integration programs.
        - label: "IVECO Spain Level 4 Programme Launched (Jan 2026)"
          description: >-
            IVECO Group and Plus.ai announce Level 4 autonomous driving programme in Spain,
            adding a third OEM family and European geographic reach.
        - label: "I-35 Live Freight Lane Level 4 Trial — International, Ryder, Plus.ai (Mar 2026)"
          description: >-
            First live-freight-lane Level 4 trial launched on the I-35 corridor with named
            fleet operator Ryder System using International LT Series trucks.
