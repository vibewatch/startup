  evidenceGaps:
    - id: EU001
      type: private-evidence-only
      severity: material
      topic: hyperfoundry-customer-names
      missingEvidence: >-
        Plus.ai has not publicly disclosed the identity, industry, or contract terms of
        any HyperFoundry enterprise AI customer despite claiming a $25M contracted pipeline.
        No independent analyst, press report, or regulatory filing names a single HyperFoundry
        customer, making the pipeline figure unverifiable from external sources.
      whyItMatters: >-
        Without named HyperFoundry customers, the $25M pipeline cannot be assessed for
        concentration risk, renewal probability, or revenue quality. If the pipeline is
        concentrated in one or two enterprise clients in sensitive sectors, it could
        face the same CFIUS restrictions as Plus.ai's trucking customer base.
      diligencePath: >-
        Request a customer schedule in the data room identifying each HyperFoundry
        contract, including client name, industry, contract value, term, and renewal
        terms; verify against customer-issued purchase orders or signed contracts.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU001]

    - id: EU002
      type: private-evidence-only
      severity: material
      topic: pluesdrive-fleet-retention-metrics
      missingEvidence: >-
        Plus.ai has not disclosed formal subscription renewal rates, NRR, GRR, active
        account counts, or per-fleet churn figures for its PlusDrive L2+ fleet customer
        base. The only publicly available signal is aggregate revenue ($47.5M in 2025),
        which is insufficient to assess customer durability or expansion trajectory.
      whyItMatters: >-
        Fleet retention metrics are the leading indicator of SuperDrive L4 conversion
        probability: a fleet customer with high PlusDrive renewal rates and expanding
        utilization is more likely to upgrade to SuperDrive L4 than one renewing out of
        contract inertia. Without these metrics, the 2027 SuperDrive commercial ramp
        cannot be modeled with confidence.
      diligencePath: >-
        Request PlusDrive cohort retention data from the data room, including monthly
        active subscriber counts by account, net revenue retention by cohort year, and
        churn reasons for any accounts that did not renew since 2021.
      relatedQuestionRefs: [QU015]

    - id: EU003
      type: private-evidence-only
      severity: material
      topic: oem-deal-financial-terms
      missingEvidence: >-
        The specific per-truck, per-mile, or annual financial terms of Plus.ai's agreements
        with TRATON Group, International Motors, and IVECO are not disclosed in any public
        document including the S-4 registration statement. The $25M R&D commitment from
        TRATON is the only confirmed figure; all other deal economics are unverified.
      whyItMatters: >-
        Without disclosed per-OEM revenue terms, investors cannot model the revenue impact
        of TRATON concentration, assess margin on OEM vs. fleet channels, or project
        SuperDrive per-mile licensing revenue at scale with OEM-confirmed pricing inputs.
      diligencePath: >-
        Request deal term schedules for each OEM integration agreement from the data room,
        including upfront license fees, R&D milestone payments, royalty rates, minimum volume
        commitments, and change-of-control provisions that apply on SPAC completion.
      relatedQuestionRefs: [QU027]

    - id: EU004
      type: enumeration-incomplete
      severity: minor
      topic: schneider-national-contract-status
      missingEvidence: >-
        Schneider National's PlusDrive pilot contract status as of May 2026 is entirely
        unknown from public sources: no termination, renewal, expansion, or suspension
        has been publicly announced by either Plus.ai or Schneider National in the three
        years since the 2022 pilot announcement.
      whyItMatters: >-
        If Schneider has silently terminated its PlusDrive subscription, Plus.ai's
        effective fleet customer count drops further and the market signal for large
        US carrier adoption deteriorates. Conversely, a silent continuation would be
        a positive signal of fleet stickiness not visible in public data.
      diligencePath: >-
        Request a current customer list from the data room that includes Schneider
        National's subscription status, contract expiry date, and any formal renewal
        or cancellation notices exchanged between Plus.ai and Schneider.
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU003]
