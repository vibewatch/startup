callouts:
  - id: VCALL-01
    calloutType: recommendation
    title: Conditional Track — Diligence Blockers Preclude Buy
    body: >-
      Plus.ai at $1.2B SPAC entry offers a defensible risk/reward for investors with a 3-year horizon and high
      regulatory-risk tolerance: the TRATON OEM anchor, the only disclosed L2+ trucking revenue in the sector, and
      the 25× EV/Revenue multiple that reflects post-2021 sector re-rating rather than peak exuberance all support
      a base case of 2–3× upside by 2028. However, five unresolved diligence blockers — SPAC redemption rate, gross
      margins, 2024 revenue baseline, CFIUS status, and TRATON warrant terms — collectively prevent a confident buy
      recommendation. A track rating is warranted: monitor the post-vote 8-K for redemption rate disclosure, the
      S-4 historical financials for gross margin data, and any CFIUS certification filing. Upgrade to buy if SPAC
      redemption <30%, blended gross margin >50%, and CFIUS confirmed clear.
    claimRefs: [CV003, CV023, CV024, CV025, CV026]

