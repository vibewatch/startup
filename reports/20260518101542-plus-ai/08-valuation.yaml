  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: spac-redemption-rate-unknown
      missingEvidence: >-
        The actual Churchill Capital Corp IX shareholder redemption rate from the February 3 2026 vote, net cash
        proceeds to Plus.ai from the SPAC trust, and any PIPE commitment amounts and pricing have not been publicly
        disclosed as of May 2026.
      whyItMatters: >-
        The redemption rate is the single most important financial unknown: it determines Plus.ai's actual post-listing
        cash runway and whether additional dilutive capital raises will be required before the 2027 SuperDrive milestone.
        A >70% redemption rate triggers the bear case; <20% enables the bull case.
      diligencePath: >-
        Monitor the post-vote Form 8-K filed with the SEC for redemption rate disclosure, review S-4 final amendments
        or definitive proxy for PIPE terms, and contact investor relations for net proceeds confirmation.
      relatedQuestionRefs: [QV012, QV021]
      relatedTableRefs: [TV003]

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin-not-disclosed
      missingEvidence: >-
        Plus.ai has not publicly disclosed gross margins by product line (PlusDrive hardware vs. SaaS subscription,
        HyperFoundry) in any press release, S-4 summary, or accessible financial document.
      whyItMatters: >-
        Without gross margin data, unit economics modeling relies on industry benchmarks rather than company-specific
        data. The hardware-to-SaaS revenue mix and gross margin progression are essential to projecting the
        path to profitability and validating the base-case $2–3B 2028 valuation.
      diligencePath: >-
        Access the S-4 historical financial statements (income statement by segment) once the full filing is publicly
        accessible post-SPAC close, or request from management in a direct due diligence process.
      relatedQuestionRefs: [QV005]
      relatedTableRefs: [TV002]

    - type: private-evidence-only
      severity: material
      topic: fy2024-revenue-not-disclosed
      missingEvidence: >-
        Plus.ai's fiscal year 2024 annual revenue has not been disclosed in any publicly accessible document,
        preventing independent calculation of the 2024-to-2025 year-over-year growth rate.
      whyItMatters: >-
        Without the 2024 baseline, it is impossible to determine whether $47.5M 2025 revenue represents
        growth acceleration or deceleration relative to prior year — a fundamental input for revenue trajectory
        confidence and growth rate assumptions in the scenario analysis.
      diligencePath: >-
        The S-4 registration statement contains comparative financial statements including 2024 audited figures;
        access the full S-4 document through SEC EDGAR once processed.
      relatedQuestionRefs: [QV002]
      relatedTableRefs: []

    - type: missing-source
      severity: material
      topic: cfius-status-unconfirmed
      missingEvidence: >-
        CFIUS clearance or certification for Plus.ai's SPAC transaction has not appeared in any public SEC filing
        or press release as of May 2026, despite Bloomberg's November 2025 reporting on unresolved national security
        concerns from Plus.ai's Chinese-origin founding and prior Manbang equity relationship.
      whyItMatters: >-
        If CFIUS blocks or conditions the SPAC listing — as it did with TuSimple — the entire transaction fails and
        the equity value could approach zero in a dissolution scenario. This is the highest-severity tail risk for
        Plus.ai investors despite the 2023 Chinese team transfer mitigation.
      diligencePath: >-
        Review S-4 and definitive proxy for CFIUS certification language; if absent, submit FOIA request or
        engage legal counsel with CFIUS expertise to assess current review status.
      relatedQuestionRefs: [QV023, QV009]
      relatedTableRefs: [TV004]

    - type: private-evidence-only
      severity: material
      topic: traton-warrant-terms-undisclosed
      missingEvidence: >-
        TRATON Group's equity warrant exercise price, total warrant count, vesting schedule, and anti-dilution
        provisions in Plus.ai have not been disclosed in any public document, including the S-4 summary and
        TRATON's own press releases.
      whyItMatters: >-
        Without warrant terms, full post-SPAC dilution cannot be modeled. TRATON warrant exercise could represent
        meaningful dilution to post-SPAC common shareholders if the stock appreciates, affecting effective entry
        economics for investors entering at the SPAC price.
      diligencePath: >-
        Access the S-4 definitive proxy exhibit containing the equity and warrant agreements, or request directly
        in a direct due diligence process from management or TRATON investor relations.
      relatedQuestionRefs: [QV017]
      relatedTableRefs: [TV003]

    - type: private-evidence-only
      severity: material
      topic: hyperfoundry-unnamed-customers
      missingEvidence: >-
        The specific enterprise customers comprising the $25M contracted HyperFoundry pipeline, their industries,
        contract lengths, and renewal terms have not been publicly disclosed by Plus.ai.
