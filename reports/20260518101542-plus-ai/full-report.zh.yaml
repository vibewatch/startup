      - number: '3.4'
        title: 护城河耐久性与竞争风险
        blocks:
          - type: paragraph
            body: >
              PlusAI 主要可防守护城河是结构性的：（1）TRATON 股权认股权证和董事会席位，让 PlusAI 嵌入 TRATON 产品路线图决策，这一点 Aurora 只授权不持股的 PACCAR、Volvo OEM
              安排难以复制；（2）L2+→L4 产品阶梯，当前 $47.5M PlusDrive 收入为 L4 开发跑道供血；（3）HyperFoundry 作为独立 AI 训练平台，目标 2026 年收入
              $40-50M，并提供不依赖 L4 部署时间表的护城河资产；（4）ISO 26262 ASIL-D 以及 ISO 21434、27001 认证，构成欧洲 OEM 受监管招标中的采购门槛，而 Aurora
              尚未公开通过。

              最实质的竞争风险，是 Aurora 在无人商业运营上约三年的先发优势。Aurora 积累的 FedEx/Werner
              运营数据、无事故商业里程和监管熟悉度，会形成仅靠资本很难追上的复利优势。第二个结构性风险是资本差距：Aurora 已融资约 $2.5 billion，而 PlusAI 为 $720 million，前者资本优势为
              3.5:1，可比 PlusAI 当前烧钱速度更快扩展运营规模和数据获取。

              PlusAI 的国家安全暴露——中国来源创始人、2023 年转让给 Full Truck Alliance 的历史中国业务、残余股权关系——是 Aurora（美国创立、美国领导层）、Kodiak（美国创立、DoD
              客户）和 Waabi（加拿大创立、无中国暴露）没有的竞争劣势。TuSimple 先例（2023 年被 CFIUS 迫使退出美国市场）直接相关。Daimler/Torc 垂直整合先例带来尾部风险：如果 TRATON
              仿照 Daimler 2019 年做法，收购 PlusAI 技术栈或将能力内生化，PlusAI 的主要分销护城河就会消失。
