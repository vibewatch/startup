  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >
              SAE Level 4 自动驾驶长途卡车软件市场高度集中：截至 2026 年中，只有四到五家公司在美国和欧洲以有意义规模可信推进商业无人长途卡车。Aurora Innovation（NASDAQ:
              AUR）领先最明显，已于 2024 年 4 月在 Texas 商业推出无人卡车服务，FedEx 和 Werner Enterprises 为付费客户。Kodiak Robotics 正在 Texas
              高速公路进行有安全监督的无人测试，也持有美国 DoD 合同。Torc Robotics 自 2019 年起垂直整合进 Daimler Truck North America，专为 Freightliner
              Cascadia 平台开发。Waabi 阶段更早，借助 Uber Freight 合作走仿真优先的 AI 路线。Gatik 已商业化部署，但处于不同细分市场——65 miles 以下 B2B 中短途支线——不与
              PlusAI 的长途 OTR 目标直接竞争。

              自动驾驶卡车软件的现状竞争替代仍是人类 CDL 驾驶员，车队总薪酬成本为每年 $65,000–$100,000。来自 PlusAI（PlusDrive）、Delphi、Mobileye 等的 SAE Level
              2+ 驾驶辅助系统构成中间替代。几起显著失败——Embark Trucks（烧完 SPAC 资本后于 2023 年 2 月解散）和 TuSimple（2023 年在 CFIUS
              国家安全审查下被迫退出美国市场）——缩小了竞争场，但也树立了警示先例。近期竞争格局不会赢家通吃：FedEx、Werner、Schneider 等大型车队运营商正并行开展多供应商试验，明确是为了避免依赖单一供应商。
