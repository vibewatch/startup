      - number: '5.3'
        title: 安全认证、合规与技术风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月，Plus.ai 获得四项 ISO 认证：ISO 9001（质量管理体系）、ISO 26262 ASIL-D（汽车功能安全最高完整性等级）、ISO 21434（汽车网络安全工程）和 ISO
              27001（信息安全管理）。这些认证是 TRATON 和 International Motors 接受工厂集成的前置交付物，也表明 Plus.ai 的软件开发、验证和质量管理流程已达到汽车量产级标准——这是
              2027 年 L4 商业推出前的关键降风险里程碑。PlusDrive 的 ODD
              明确限于天气良好条件下的美国州际高速；恶劣天气（浓雾、雨、雪）以及所有非高速路线，都要求人类安全驾驶员接管。该限制既是安全设计选择，也是战略风险：Aurora Innovation 配备 LiDAR 的
              Aurora Driver 声称具备更广天气表现，而 Plus.ai 无 LiDAR 架构意味着，在软件进一步推进或传感器栈演进之前，恶劣天气覆盖会持续存在缺口。FMCSA 文件确认 Plus.ai
              在美国公共道路上按联邦自动驾驶汽车监管框架运营 ADS 装备车辆，NHTSA FMVSS 豁免则约束已部署硬件组件。截至 2026 年 4 月，系统报告 SCR（System Compliance
              Rate）90.1%、AMP（Autonomous Miles Percentage）99.2%、RAFT（Road Autonomy Factor for Trucks）79%——这些 KPI 在过去 12
              个月显著改善。美国一项拟议监管行动针对来自中国关联供应商的组件，引入残余供应链风险；Plus.ai 只用摄像头和雷达的技术栈，以及 2023 年将中国团队转让给 Full Truck
              Alliance，降低但没有完全消除这一监管暴露，公司也未公开披露完整供应商物料清单细节。
