      - number: '6.4'
        title: 反向信号与集中度风险
        blocks:
          - type: paragraph
            body: >-
              TRATON-International 企业家族的客户集中度，是 Plus.ai 商业画像中最重大的单一实体风险。TRATON Group 全资拥有 International
              Motors（Navistar），因此从商业依赖角度看，两家已点名 OEM 伙伴实质上是同一交易对手。估计 Plus.ai 近期商业价值的 75% 或更高——OEM 集成量、R&D
              资金、工厂部署跑道——都流经这个单一家族；IVECO 和 Ryder 只能在边际上提供分散，无法实质降低 Volkswagen/TRATON 依赖。

              Bloomberg 2025 年 11 月调查报道提出了围绕 Plus.ai 中国背景、潜在 CFIUS
              风险和供应链依赖的国家安全担忧——这些风险可能限制公司赢得与美国政府相邻的车队客户（USPS、军事物流、国防承包承运商），也可能让它与受 EU 监管、要求供应链透明度的卡车买家的 OEM
              关系更复杂。Plus.ai 的 S-4 没有按客户或 OEM 伙伴披露收入拆分，外部无法独立验证集中度，也让关于 TRATON 依赖的尽调只能依赖分析推断，而不是披露数据。

              Werner 流向 Aurora、Schneider 试点停滞、HyperFoundry 企业客户完全没有公开点名，这三者共同构成一种模式：Plus.ai 公开确认的商业证据窄于其融资叙事。OEM 新闻稿和
              I-35 试验是正当的商业里程碑，但 Plus.ai 缺少客户声音证据（没有 NPS 数据、没有 G2/Gartner 评价、没有客户结果案例研究），无法在 OEM
              关系之外独立证明经济价值交付。任何尽调流程都应把披露活跃 PlusDrive 账户数、订阅续约率，以及 TRATON/International 收入占比，作为形成坚定投资信念的前置条件。
