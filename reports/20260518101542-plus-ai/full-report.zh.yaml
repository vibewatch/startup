      - number: '8.4'
        title: 资本结构、稀释与估值结论
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 的 SPAC 后资本结构面临来自四个重叠来源的重大稀释风险。第一，SPAC 发起人 promote 股份和认股权证：Churchill Capital Corp IX
              发起人在低赎回情景下持有合并后约 20% 股权，受 12 个月锁定期约束，构成显著股权悬置。第二，TRATON Group
              持有股权和认股权证；认股权证条款（行权价、数量、反稀释）尚未披露，无法用公开数据完整建模稀释。第三，现有 Series A/B 优先股持有人（FountainVest、ClearVue、Amazon Alexa
              Fund）在合并交割时转为普通股，增加公众流通股。第四，PIPE 投资人如存在，可能以较 SPAC 价格折价获得股份。

              合并后的稀释瀑布意味着，以 $1.2B pre-money 价格入场的散户 SPAC 投资人，如果合并后股价上涨，会受到发起人 promote 和 TRATON 认股权证行权带来的显著稀释。高赎回情景下，发起人
              promote 占总流通股比例上升，对非发起人的稀释进一步放大。

              从估值结论看，$1.2B 的 Plus.ai 对应一个有条件的观察建议。投资逻辑由四点支撑：（1）行业唯一披露的 L2+ 自动驾驶卡车收入，达到 $47.5M 且仍在增长；（2）独特的 TRATON
              董事会层级合作，提供 Aurora 或 Kodiak 无法获得的 OEM 分销、R&D 共同资助和工厂集成入口；（3）HyperFoundry 作为可分散毛利来源的 AI 平台，已有早期 $25M
              合同管线；（4）SPAC 入场价反映了行业重估，而不是 2021 年峰值亢奋。反向逻辑同样有力：L4 收入为零、毛利率未披露、CFIUS 阴影与 TuSimple 结构性相似、SPAC
              赎回风险可能损害整个资本结构，以及 Aurora 在 L4 卡车上的先发商业优势。

              升级到买入前必须解决的尽调阻碍包括：SPAC 赎回率和净现金到账；S-4 历史财务中的分产品线毛利率；2024 年收入基线；CFIUS 许可确认；TRATON 认股权证行权条款；以及 HyperFoundry
              客户身份和管线质量。在这些事项确认前，观察评级才是合适纪律——承认中性情景有吸引力，但拒绝在结构性不确定性未解时投入资本。
            claimRefs: []
