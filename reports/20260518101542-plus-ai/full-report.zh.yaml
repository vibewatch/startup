      - number: '4.4'
        title: 资本充足性与财务风险评估
        blocks:
          - type: paragraph
            body: >-
              进入 2026 年，PlusAI 的资本充足性相对主要竞争对手 Aurora Innovation 明显受限。Aurora 作为上市公司（NASDAQ: AUR）累计融资约 $2.5
              billion，并可持续通过公开市场增发股权融资。PlusAI 历史累计融资 $720 million，相比 Aurora 存在 3.5× 资本缺口；这一缺口直接转化为安全车队扩张、监管沟通和软件 R&D
              资源更少。


              近期首要财务风险是 SPAC 股东赎回。如果大量 Churchill Capital Corp IX SPAC 股东选择按信托价值赎回股份，而不是转为 PlusAI 普通股，PlusAI
              获得的净现金可能显著低于交易名义价值，迫使公司通过同步 PIPE 或二级发行补充资本。截至 2026 年 5 月尽调日，赎回比例尚未公开披露。


              次要财务风险包括：（1）TRATON 股权认股权证稀释；如果 TRATON 以低于 SPAC 交易价值的价格行权，将形成可能稀释普通股股东的或有股权索取权；（2）近期收入的相当部分依赖少数大型 OEM
              合同，形成客户集中风险；（3）SuperDrive 商业化若延期到 2027 年之后，将延长盈利前烧钱期，并可能要求公司在 2027–2028 年再次融资。
