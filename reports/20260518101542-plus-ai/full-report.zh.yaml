  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流痛点
      - Plus.ai 方案
      - 可衡量收益
      - 关键限制
    rows:
      - - 长途卡车司机（车队运营商）
        - 多小时州际行驶容易疲劳；HOS 合规压力压缩每日有效里程
        - PlusDrive 在州际 ODD 内自动控制转向、油门和制动；司机负责监控，并接管城市路段
        - 减少疲劳；油门更平顺带来约 5–10% 燃油效率提升；在 HOS 内拉长有效行驶里程
        - ODD 外没有收益；司机必须保持警觉并在场；非公路路段不自动化
      - - OEM 卡车制造商（TRATON、International）
        - 客户需要集成式自动驾驶；后装 ADAS 改装成本高、复杂度也高
        - 工厂预装 SuperDrive 硬件；联合开发协议和共享安全验证流程
        - 产品差异化更强；省掉后装安装成本；ADAS 可做成标准 SKU
        - OEM 产品周期长；OEM 承担质保和安全验证责任；需要工厂改造
      - - 车队安全与调度经理
        - 数百辆卡车的实时表现不透明；事故响应偏被动
        - 实时遥测流：每辆车的 SCR、AMP、RAFT KPI；通过 HyperFoundry 记录事件
        - 预测式安全监控；可量化的自动驾驶表现基准；主动维护信号
        - 完整遥测数据处理和 GDPR 政策未公开；集成 API 也未公开成文
      - - 企业 AI 客户（HyperFoundry 买方）
        - 训练 AI 模型需要大规模 AV 级时空数据，也需要 GPU 算力
        - HyperFoundry 平台：接入 Plus.ai 专有卡车数据集和 NVIDIA DRIVE Thor 训练基础设施
        - 拿到独特的真实高速公路数据集；单位算力成本低于自建 AV 训练栈
        - 可选云平台并不少；数据管线会绑定 Plus.ai 单一供应商
      - - Level 4 自动货运承运商（2027 年目标）
        - 司机成本是卡车运输最大单项运营支出（估计约 $0.30/mile）
        - SuperDrive L4 2027 年后：在获批 ODD 路线上跑全自动高速货运，无需安全驾驶员
        - 有望在覆盖的州际走廊省掉司机成本；L4 许可费约 $0.10–0.15/mile，对比司机成本 $0.30/mile
        - 尚未商业化；需要 FMCSA 监管批准；ODD 限于晴天州际公路；2027 年目标来自管理层指引
    notes: 收益估计来自行业基准和管理层指引；Plus.ai 未公开披露单车经济性。Level 4 车队运营商这一行反映的是 2027 年后计划实现的功能，不是当前商业可用能力。
