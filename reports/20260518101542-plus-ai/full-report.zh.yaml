      - number: '4.2'
        title: 资本形成与投资者基础
        blocks:
          - type: paragraph
            body: >-
              自 2016 年创立以来，PlusAI 累计融资约 $720 million，来源包括多轮机构融资以及与 TRATON Group 的战略 R&D
              合同。资本形成轨迹符合深科技自动驾驶初创公司的常见路径：早期快速增长，2021 年估值峰值约 $8 billion；随后在后 ZIRP 环境中显著下修，到 2025 年 SPAC 合并公告时投前估值为 $1.2
              billion。峰谷估值降幅约 85%，与 2021–2025 年自动驾驶汽车板块整体重估一致。


              战略投资方构成股权结构表核心。TRATON Group 持有股权、股权认股权证和董事会席位，使 PlusAI 成为唯一拥有董事会层级 OEM 股权伙伴的自动驾驶卡车公司。Amazon 早期通过 Alexa
              Fund 参投。其他战略和财务投资方包括 FountainVest Partners、ClearVue Partners、Hyundai Motor Group（战略）和 GTJAI（Guangtai Junan
              Asset Income International）。中国团队及相关股权权益已在 2023 年转让给 Full Truck Alliance（NASDAQ: YMM），部分降低了 CFIUS 悬而未决风险。


              与 Churchill Capital Corp IX 的 SPAC 合并（2025 年 9 月宣布，S-4 于 2026 年 1 月 12 日生效，股东投票 2026 年 2 月 3
              日）可能为公司打开更多公开市场资本入口，但交易结构让 PlusAI 暴露于股东赎回风险，可能显著压低 SPAC 净募资。按 $1.2 billion 投前估值计算，SPAC 给 PlusAI 的定价约为其
              2025 年 PlusDrive 收入 $47.5 million 的 25×；这一倍数显著低于 2021 年峰值隐含倍数，但相对于 L4 前收入阶段可比公司是合理的。
