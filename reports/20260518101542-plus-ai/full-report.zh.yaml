chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商业模式与战略背景
        blocks:
          - type: paragraph
            body: >
              PlusAI（以 Plus.ai 名义运营）是一家 Physical AI 公司，为工厂原生自动驾驶商用卡车开发虚拟驾驶员软件。公司 2016 年由一组 Stanford 博士毕业生在 California 州
              Cupertino 创立，已经从研究阶段自动驾驶实验室，演进为一家前商业化 AV 技术栈供应商；其 OEM
              集成协议覆盖北美、欧洲和亚洲。公司官网把使命表述为，让卡车具备安全、高效行驶全球道路的智能；商业上采取轻资本的软件授权模式，目标是按英里收取经常性收入，而不是自有车队。

              产品组合覆盖四项主要产品：SuperDrive（SAE Level 4 完全自动驾驶软件）、PlusDrive（已经商业化部署的 SAE Level 2+ 受监督高速公路自动驾驶）、HyperFoundry（AI
              数据与模型开发平台，可供内部使用，也向外部客户开放），以及安全和视觉系统（PlusProtect 和 PlusVision）。商业模式以 OEM 为中心：PlusAI 将 SuperDrive 软件栈嵌入
              Tier-1 OEM 合作伙伴组装的工厂卡车，而不是改装存量卡车；因此公司定位是向 OEM 授权软件，再由 OEM 向车队运营商销售或租赁卡车。

              截至 2026 年 5 月，公司在自动驾驶主线业务上仍处于收入前阶段：PlusDrive 通过 SAE Level 2+ 车队部署产生收入，SuperDrive 目标在 2027
              年商业化部署。HyperFoundry AI 平台也开始从汽车、国防和机器人客户获取第三方收入；管理层在 2026 年 4 月业务更新会上披露，已签约管线为 $25M。PlusAI 的 S-4 注册声明已于
              2026 年 1 月 12 日获 SEC 宣布生效，Churchill Capital Corp IX 合并的股东投票定在 2026 年 2 月 3 日；交易完成后公司将以代码 “PLS” 在 Nasdaq
              上市。
