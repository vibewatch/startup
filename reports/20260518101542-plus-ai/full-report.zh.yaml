      - number: '7.4'
        title: 缓释措施、监测指标与尽调要求
        blocks:
          - type: paragraph
            body: >-
              监测监管风险，需要跟踪 FMCSA 拟议规则制定时间表，以及 DOT Automated Vehicles 门户发布 NPRM 的节奏。关键的投资逻辑破裂触发点，是 2027 年底前未发布允许商业 Level 4
              无人驾驶重型卡车运营的最终 FMCSA 规则；这会把仅有 L2+ 收入的时期至少延长 12–18 个月，并要求重做财务模型。投资人或董事会监控看板应跟踪：FMCSA NPRM 发布日期、California
              DMV 许可提交状态，以及季度或年度公开文件中披露的任何正式 CFIUS 调查。ISO 认证维护情况和任何不利 NHTSA 执法行动是次级指标。

              CFIUS 风险监测应围绕 S-4，以及任何披露 CFIUS 通知或正式调查的合并后 SEC 文件。TuSimple 先例和 Treasury CFIUS
              框架确认，最可能触发正式审查的情形，是竞争对手、国会议员或国家安全组织向 CFIUS 提交第三方投诉。投资人应聘请专门处理 CFIUS
              的律师，对交易结构、创始人持续角色、技术转移历史，以及任何仍存在的中国受益所有权或许可后门，进行独立的交割前评估。尽调要求是一份全面的 CFIUS 法律顾问备忘录，在交割前覆盖全部四个风险维度。

              SPAC 赎回风险可通过 PIPE 兜底分析部分处理：投资人应在 2 月股东投票前确认任何已承诺 PIPE 融资的规模和交易对手质量，并在 50%、70%、90%
              赎回情景下建模合并后资产负债表。否决标准是投票后信托余额低于 $75M 且没有已确认 PIPE 过桥；按估计 $80–120M 年烧钱速度，这会让 Plus.ai 运营现金跑道不足一年。TRATON
              集中度监测需要按季度做收入归因：如果合并后连续两个季度 TRATON 及其品牌超过总收入 80%，应要求管理层提交带里程碑和已点名替代 OEM 目标的 OEM 分散计划。人才风险需要跟踪
              ML、感知和安全验证职能的员工数；这三类职能中任一类年流失率超过 15%，都应上升为董事会层面关切。ATA 司机短缺报告确认卡车行业劳动力供给存在结构性约束，放大了自动驾驶部署的紧迫性——但也意味着
              Plus.ai 要在一个资本投入异常高的行业里争夺工程人才。关键尽调要求包括：数据室提供投票后赎回到账和 PIPE 条款；确认百分比集中度的 TRATON 收入表；2024 和 2025
              年按职能划分的工程员工数和流失率；以及确认本交易已按当前 CFIUS 风险因素审查的 CFIUS 法律顾问备忘录。
