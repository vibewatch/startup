        - label: 2016 — 成立（种子轮融资）
          description: 公司注册成立；创始人来自 Stanford/Waymo；聚焦 L4 自动驾驶卡车
        - label: 2019 — A 轮（PlusDrive 商业化）
          description: 首批 L2+ PlusDrive 硬件 / 软件收入；商用卡车验证启动
        - label: 2021 — B 轮约 $200M（隐含峰值估值约 $8B）
          description: SPAC 时代 AV 热潮见顶；隐含估值峰值约 $8B；宣布 TRATON 股权合作
        - label: 2023 — 中国团队转移至 Full Truck Alliance（FTA）
          description: 'CFIUS 缓释：中国工程团队转移至 FTA（NASDAQ: YMM）；风险部分降低'
        - label: 2025-09 — 宣布 SPAC 合并，合并前估值 $1.2B
          description: 宣布与 Churchill Capital Corp IX 合并；估值较峰值回撤 85%；NYSE 代码 PLS
        - label: 2026-01 — SEC 宣布 S-4 生效（2026 年 1 月 12 日）
          description: SEC 宣布 S-4 生效；公开上市流程正式推进；披露 HyperFoundry
        - label: 2026-02 — 股东投票（2026 年 2 月 3 日）
          description: Churchill Capital Corp IX 股东投票；SPAC 赎回率结果未公开披露
