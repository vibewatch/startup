      - number: '6.3'
        title: 留存、扩张信号与流失风险
        blocks:
          - type: paragraph
            body: >-
              TRATON 是唯一具备高置信留存和扩张信号的客户。2026 年 1 月由 TRATON 与 Plus.ai 联合发布的合作扩展新闻稿明确使用“扩展”表述，确认欧洲和美国 OEM
              品牌的工厂集成路线图继续推进，并承接 2024 年 10 月全球 L4 软件发布里程碑。TRATON 的股权和董事会席位形成结构性利益绑定，让单方面退出代价很高：TRATON
              会失去技术访问权和董事会影响力，Plus.ai 则会失去主要商业渠道。因此，这是一段深度相互依赖的关系，而不是简单供应商合同。

              International Motors 方面，2025 年 10 月确认采用 NVIDIA DRIVE AGX Hyperion 平台的集成公告，以及 2026 年 3 月的 I-35
              车队试验，都指向持续投入仍在进行。不过 International 隶属于 TRATON，意味着其留存也很大程度上由 TRATON 的战略承诺支撑——这放大的是集中度风险，而不是带来分散。IVECO 项目
              2026 年 1 月才启动，尚无续约数据，但代表一个尚未经过耐久性检验的新 OEM 承诺。Ryder 的车队试验正在进行，但没有公开披露正式商业承诺或定价安排。

              反向信号中，最值得担心的是 Werner 转向 Aurora，以及 Schneider 三年沉默。Werner Enterprises 曾是 2021 年宣布的 PlusDrive 试点客户，如今已确认成为
              Aurora Innovation L4 首发客户——这是最清晰的客户层面证据，说明在漫长的商业化前阶段，Plus.ai 可能把车队运营商输给竞争对手。Schneider National
              没有续约、扩张或取消的证据，在澄清前应视为停滞关系。没有任何车队运营商公开宣布有意从 PlusDrive L2+ 升级到 SuperDrive L4 无人驾驶运营，而这正是 Plus.ai 面向 2027
              年的关键商业转化事件。
