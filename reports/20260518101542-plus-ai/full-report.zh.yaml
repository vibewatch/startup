  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 具名客户关系与交易结构
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Plus.ai 已点名的商业关系分三层。第一层也是最核心的一层是 TRATON Group——这家 Volkswagen 旗下的卡车 OEM 控股公司拥有 Scania、MAN 和
              International Motors——它持有 Plus.ai 股权、一个董事会席位，并签有多年 R&D 授权协议，承诺提供 $25M 合同研究资金。TRATON 合作最早在 2021 年公布，随后在
              2024 年 10 月正式扩展，又在 2026 年 1 月再次扩展；TRATON 和 Plus.ai
              的联合新闻稿都确认，欧洲（Scania、MAN）和北美（International）卡车品牌的工厂集成在推进。这段关系的深度和结构性——股权、治理、工厂集成——让 TRATON 更像战略伙伴，而不是普通客户。

              第二层包括 International Motors（TRATON 旗下品牌）和 Ryder System。两家公司在 2026 年 3 月共同在 I-35 货运走廊启动 Level 4
              自动驾驶车队试验。试验使用出厂即搭载 Plus.ai SuperDrive 软件的 International LT Series 卡车，由 Ryder 作为车队伙伴运营，是 Plus.ai
              历史上商业化程度最高的客户验证事件。欧洲 OEM IVECO Group 在 2026 年 1 月与 Plus.ai 在西班牙启动 Level 4 自动驾驶项目，IVECO 自身的公司新闻稿和 Plus.ai
              公告均已确认——这为客户基础加入第三个 OEM 家族，也把地理覆盖延伸到南欧。

              第三层也是一个重大隐忧，由 Schneider National 和 Werner Enterprises 两家大型美国承运商构成。它们曾在 2021–2022 年试点部署
              PlusDrive，但此后没有公开更新。Werner Enterprises 之后已被公开确认为 Aurora Innovation 在 Texas 竞争性 Level 4 无人驾驶服务的首批客户——这是客户从
              Plus.ai 流向竞争对手的直接证据。Schneider 三年多沉默，表明这段关系可能已经停滞或被降级。Plus.ai 的 AI 平台业务 HyperFoundry 虽然在 2026 年 1 月分析师日披露了
              $25M 合同管线，但没有任何公开点名的企业客户。
