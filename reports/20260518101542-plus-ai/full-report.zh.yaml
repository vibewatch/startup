      - number: '4.3'
        title: 单位经济与盈利路径
        blocks:
          - type: paragraph
            body: >-
              PlusDrive 单位经济由两部分组成：估计每车约 $5,000 的一次性硬件部分（反映传感器套件和计算硬件成本），叠加月度 SaaS 订阅。PlusAI 未公开披露订阅定价；可比 L2+
              车队软件的行业基准为每车每月 $400 到 $1,200，取决于功能层级和合同期限。若按中位数每车每月 $700，并以 2025 年 $47.5 million 收入倒推，完全订阅口径下隐含装机基数约 5,650
              辆 PlusDrive 卡车；若单车价格更低并包含硬件收入贡献，则对应车辆数更多。


              软件即服务订阅部分的结构性毛利率高于硬件部分，后者受传感器和计算供应链的物料成本压力影响。HyperFoundry 作为纯软件授权业务，没有单车硬件成本，预计产生显著更高毛利率，是 2026–2027
              年利润率扩张的关键杠杆。


              盈利路径取决于三项重叠杠杆：（1）PlusDrive 装机基数增长带来经常性订阅收入，随着硬件成本下降，毛利率改善；（2）HyperFoundry 收入从已签约 $25M 放大到 2026 年
              $40–50M，贡献高毛利授权收入；（3）SuperDrive 按英里收入在 2027 年启动，并可能具备高软件毛利率。按 462 名员工和估计每年 $80–120 million 烧钱速度看，在当前轨迹下，除非
              L4 部署或 HyperFoundry 授权显著加速，PlusAI 预计不会在 2029–2031 年前达到现金流盈亏平衡。
