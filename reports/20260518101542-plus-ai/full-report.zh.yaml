  - id: FV005
    slug: dilution-waterfall
    title: SPAC 后股权稀释瀑布图
    type: flow
    insight: 公众投资者面对的两条最大不可控稀释路径，是 SPAC 发起人 promote 和 TRATON 认股权证；在高发起人 promote 情景下，合计稀释可能让有效公众持股降 30–40%，因此入场价格纪律至关重要。
    data:
      nodes:
        - id: d1
          label: SPAC 前股权（创始人 + 机构投资者）
          description: 创始人约 30%，TRATON 约 15%，FountainVest/ClearVue 约 10%，Amazon 约 5%——合并前估算
        - id: d2
          label: SPAC 股份（Churchill IX 信托）
          description: 信托股份按 $10/股转换；净股数取决于 2 月 3 日投票时的赎回率
        - id: d3
          label: SPAC 发起人 promote + 认股权证
          description: 低赎回情景下 promote 约 20%；另有认股权证；交割后 12 个月锁定
        - id: d4
          label: TRATON 股权认股权证
          description: 行权价和数量未披露；若股价上涨，潜在稀释可能很大
        - id: d5
          label: PIPE 投资者（如有）
          description: 任何 PIPE 承诺大概率有折价；S-4 摘要未公开披露条款
        - id: d6
          label: 公众流通股（合并后普通股）
          description: 扣除 promote、TRATON 认股权证和 PIPE 分配后，可供公众持有的净股份
      edges:
        - from: d1
          to: d6
          label: 合并交割时转换为普通股
        - from: d2
          to: d6
          label: 未赎回信托净股份进入公众流通股
        - from: d3
          to: d6
          label: Promote 稀释普通股；认股权证形成额外压力
        - from: d4
          to: d6
          label: 交割后行权会稀释所有普通股
        - from: d5
          to: d6
          label: PIPE 股份低于 SPAC 价格定价；形成即时稀释
    sourceRefs:
      - SV001
      - SV002
      - SV015
      - SV023
    claimRefs:
      - CV019
      - CV039
  - id: FV006
    slug: revenue-quality-matrix
    title: 收入流质量评估矩阵
    type: matrix
    insight: PlusDrive SaaS 是唯一同时具备可观现有规模、经常性特征和已验证客户付费意愿的收入流；其他收入要么依赖硬件（毛利受限），要么尚未商业化，或尚未确认。因此 PlusDrive SaaS 是近期唯一的估值锚。
    data:
      columns:
        - 2025 年贡献
        - 毛利质量
        - 经常性
        - 增长可见度
        - 风险水平
      rows:
        - label: PlusDrive 硬件
          values:
            - label: 主要（估计占 $47.5M 的 40–50%）
            - label: 低（估计 25–40%；BOM 成本压力）
            - label: 每辆卡车一次性
            - label: 中（新车销量）
            - label: 高（硬件毛利压缩）
        - label: PlusDrive SaaS 订阅
          values:
            - label: 主要（估计占 $47.5M 的 50–60%）
            - label: 高（估计 60–75%）
            - label: 高（按月经常性）
            - label: 高（装机基数 × 流失率）
            - label: 低（产品市场匹配已验证）
        - label: HyperFoundry 平台
          values:
            - label: 较小（已签约管线 $25M；2025 年确认收入 0）
            - label: 很高（估计为纯软件授权）
            - label: 中（企业 SaaS 合同）
            - label: 低（客户未具名；目标未确认）
            - label: 高（管线质量未验证）
        - label: SuperDrive L4 按英里计费
          values:
            - label: 零（商业化前）
            - label: 估计很高（软件按英里计费）
            - label: 高（按英里经常性）
            - label: 很低（2027 年目标；SCR 90.1%）
            - label: 很高（监管 + 商业风险）
    sourceRefs:
      - SV003
      - SV006
      - SV007
      - SV021
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV041
