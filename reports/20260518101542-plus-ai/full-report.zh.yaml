      - number: '1.4'
        title: 里程碑、部署、安全与规模
        blocks:
          - type: paragraph
            body: >
              PlusAI 的里程碑从 2016 年创立开始，沿着多次商业 ADAS 部署、一系列 OEM 合作，再到 2025–2026 年 L4 自动驾驶试点加速推进。Level 2+ 受监督高速公路产品
              PlusDrive 已在中国和美国商业化部署，是公司近期主要收入基础。2023 年，中国团队和业务转让给 Full Truck Alliance，标志着公司战略转向美国和欧洲商业化。

              2026 年关键运营里程碑包括：2026 年 3 月发布 SuperDrive 6.0（支持夜间驾驶、施工区通行，AI 模型训练速度提升 10X）；Ryder 与 International Motors 在
              I-35 走廊开展车队试验（Laredo–Temple，Texas，每日 600 miles，路线自主率达到 92%）；2026 年 1 月启动 IVECO Level 4
              西班牙项目（Madrid–Zaragoza 300 km 走廊，2 辆配安全驾驶员的 IVECO S-Way 卡车）；以及 2026 年 2 月取得四项 ISO
              认证（9001、26262、21434、27001）。PlusAI 还在 2026 年 3 月把 NVIDIA Alpamayo 基础模型引入自动驾驶卡车。

              截至 2026 年 3–4 月，关键绩效指标为：Safety Case Readiness（SCR）90.1%、Autonomous Miles Percentage（AMP）99.2%、Remote
              Assistance-Free Trips（RAFT）79%。公司自报 2025 年收入为 $47.5 million，截至 2026 年 3 月 31 日有 462 名员工。管理层目标是在 2027 年前后，在
              Texas Triangle 商业部署完全无人、工厂原生卡车。
