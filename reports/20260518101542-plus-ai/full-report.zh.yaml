      - number: '3.3'
        title: 能力对比、定价与定位
        blocks:
          - type: paragraph
            body: >
              车队运营商评估自动驾驶卡车系统时，主要看五项购买标准：（1）无人商业部署状态，（2）OEM 集成深度，（3）ISO 26262
              功能安全认证，（4）从受监督到无人驾驶的过渡路径，（5）运营经济性。在这些维度上，PlusAI 在 OEM 深度和认证上领先，但部署状态大约落后 Aurora 三年。

              截至 2026 年中，Aurora 是唯一拥有完全无人商业服务的竞争者。PlusAI 和 Kodiak 仍在配安全驾驶员的监督试验中；Torc/DTNA 和 Waabi 仍在开发；Gatik
              只部署在受限短途路线。PlusAI 是唯一同时拥有受监督 L2+ 商业产品（PlusDrive，2025 年收入 $47.5M）和开发阶段 L4 产品（SuperDrive 6.0，目标 2027
              年）的自动驾驶卡车公司，形成竞争对手尚未复制的双产品收入阶梯。

              公开定价有限：Aurora 未披露 Aurora Driver 商业服务的每英里或每车定价；行业估计显示，早期商业费率为每英里个位数美分，更优先证明可靠性而不是利润率。PlusAI 的 PlusDrive
              据报道为每车约 $5,000 硬件费，加月度软件订阅；SuperDrive 定价尚未披露。Kodiak 的 DoD 合同费率为保密信息。Aurora 和 Kodiak
              缺少公开定价，限制了车队运营商评估替代方案时的同业经济性基准。

              多供应商车队部署存在结构性激励：FedEx、Werner、Schneider 并行开展供应商试验，明确是为避免依赖单一供应商，因此近中期赢家通吃的可能性下降。一旦车队以商业规模部署某一 AV
              软件平台，切换成本就很高：OEM 硬件集成、驾驶员再培训、数据和地图基础设施、维护工作流变化，都会形成显著惯性。
