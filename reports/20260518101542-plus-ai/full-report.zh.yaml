      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              自动驾驶卡车软件市场是双边结构，与直接面向车队的软件销售不同。PlusAI 选择以 OEM 为中心进入市场：SuperDrive
              软件能力的买方是原始设备制造商（TRATON、IVECO、International Motors），它们把软件集成进工厂卡车，并计入整车总拥有成本。最终用户和付费方是购买或租赁 OEM
              装配卡车的车队运营商。这种结构带来重要商业动态：OEM 先充当门控方，在车队运营商承诺前验证技术能否规模化；AV 技术栈供应商的竞争差异也从直接获客，转向拿下 OEM 设计定点。

              PlusAI 初始 SAM 面向的主要车队运营商包括：（1）大型整车运输（TL）承运商，运营 1,000+ 辆 Class 8 长途车，并在明确线路网络上行驶——J.B. Hunt、Werner
              Enterprises、Knight-Swift、Schneider National 等公司合计运营约 400,000 辆卡车；（2）Amazon Logistics、Walmart、Sysco
              等大型货主自营的封闭私人车队，它们优先追求成本和交付表现的一致性，而不是价格优化。

              Aurora Innovation 2024 年 4 月在 Texas 走廊商业推出无人驾驶服务，证明大型 TL 承运商（包括 Werner）会在安全论证获验证后签署无人货运商业合同。Ryder 2026 年 1
              月与 PlusAI 在 I-35 上的车队试验合作，也确认第三方物流服务商是可信的早期付费方。大多数大型车队的采用触发点，是 FMCSA 放行监管绿灯，并且单位经济显示部署后 24
              个月内可在全成本口径达到盈亏平衡。
