      - number: '5.4'
        title: 部署状态、OEM 集成与产品路线图
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 Q1，Plus.ai 在美国公共道路上通过多个 OEM 和车队运营商部署了 162+ 辆卡车。TRATON Group 按 2026 年 1 月宣布的扩大全球合作，在工厂层面为 Scania
              和 MAN 卡车集成 PlusDrive，这是自动驾驶卡车领域运营上最成熟的 OEM 集成。International Motors 于 2026 年 Q1 与 Ryder System 作为参与车队运营商，在
              Texas I-35 货运走廊启动 Level 4 自动驾驶车队试验，标志着 Plus.ai 首个公开确认的 Level 4 收入线路试验，并有美国前十车队运营商参与。IVECO Group 于 2026 年 1
              月在西班牙启动 Level 4 自动驾驶项目，把 Plus.ai 的欧洲 OEM 足迹扩展到 TRATON 之外，并展示美国以外监管路径的进展。产品路线图指向三个连续里程碑：（1）HyperFoundry 从当前
              $25M 已签约管线放大到 2026 年 $40–50M 收入，服务卡车之外的企业 AI 客户，并在无人驾驶前阶段提供现金流；（2）2027 年与 TRATON 和 International Motors
              商业推出 L4 工厂集成卡车，让卡车从生产线出厂时就搭载完整 SuperDrive 自动驾驶栈；（3）2027 年后，在 FMCSA ODD 批准并进一步达到 KPI 阈值后，实现无安全驾驶员的 L4
              自动驾驶运营。2026 年 1 月 CES 宣布的 NVIDIA DRIVE Thor Alpamayo 联合开发计划，为 2027 年后无人里程碑提供计算底座。Plus.ai 由 David Liu 于
              2016 年创立；2023 年中国团队转让给 Full Truck Alliance，结束关键 CFIUS 悬而未决风险；2026 年 1 月董事会增补，也释放出公司通过 Churchill Capital
              Corp IX SPAC 交易预期公开上市前治理成熟的信号。
