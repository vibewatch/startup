      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              自动驾驶卡车采用最强的结构性驱动，是美国驾驶员短缺持续存在。American Trucking Associations 估计，2024 年行业缺口超过 80,000
              名驾驶员；随着现有驾驶员队伍老化、年轻从业者减少，缺口预计到 2031 年超过 160,000。这一短缺直接推高车队运营成本——2024 年驾驶员平均工资达到
              $72,000–$85,000——并削弱承运商运力利用率。

              第二个驱动是运营经济性。FMCSA Hours of Service 规则把人类驾驶员限制在 14 小时窗口内约 11 小时驾驶，强制休息使实际日行驶上限为 550–600
              miles。具备远程监控能力的自动驾驶卡车，理论上可在高精地图走廊每天运营 20–22 小时，达到每天 1,100–1,400 miles，资产利用率提升约 50–70%。多份行业分析估计，在计入 AV
              技术费、保险成本下降和燃油效率改善后，每英里成本可节省 $0.17–$0.45。

              主要采用约束是监管。Federal Motor Carrier Safety Administration 尚未发布最终规则，允许 Class 8 卡车在没有安全驾驶员的情况下商业无人运营；截至 2026 年 5
              月，FMCSA 在 Automated Vehicle 4.0 政策框架下的最新指南仍不具约束力，而州际监管（Texas、Arizona、Florida
              最宽松）形成拼图式格局，给商业规模化增加复杂度。第二项约束是有组织劳工反对：International Brotherhood of Teamsters 和 OOIDA
              公开反对自动驾驶商用车，并已释放推动立法要求人类操作员的信号。第三项约束是资本强度：将现有车队改装或替换为具备 AV 能力的卡车需要大量前期投入，而大多数承运商运营利润率只有
              3–4%，对未经验证技术押注的意愿有限。
