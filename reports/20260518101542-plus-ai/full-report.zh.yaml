      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 有条件观察——尽调阻碍排除买入
            body: >-
              Plus.ai 以 $1.2B SPAC 入场，对拥有 3 年周期且能承受高监管风险的投资人，提供了可辩护的风险回报：TRATON OEM 锚点、行业唯一披露的 L2+ 卡车收入，以及反映 2021
              年后行业重估而非峰值亢奋的 25× EV/Revenue 倍数，共同支撑到 2028 年基准情景 2–3× 上行。不过，五个未解决的尽调阻碍——SPAC 赎回率、毛利率、2024 年收入基线、CFIUS
              状态、TRATON 认股权证条款——合在一起，阻止形成有把握的买入建议。观察评级合理：跟踪投票后 8-K 对赎回率的披露、S-4 历史财务中的毛利率数据，以及任何 CFIUS 认证文件。若 SPAC 赎回率
              <30%、混合毛利率 >50%，且 CFIUS 确认放行，则升级为买入。
            calloutType: recommendation
