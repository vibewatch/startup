  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: PlusDrive 在车队运营商工作流中的位置
        blocks:
          - type: paragraph
            body: >-
              PlusDrive 是 Plus.ai 的 L2+
              高级驾驶辅助系统，在明确的美国和欧洲州际走廊上自动完成高速巡航、车道居中、跟车距离管理和辅助并线；城市进出以及任何超出运行设计域（ODD）的操作，仍由驾驶室内人类安全驾驶员负责。对长途车队运营商来说，价值主张很具体：在
              Los Angeles–Houston 货运走廊这类约 85–90% 驾驶里程发生在州际公路上的线路中，PlusDrive 在这部分行程中自主管理卡车，降低驾驶员疲劳，平滑油门以提升燃油效率，并在 HOS
              限制内延长有效日驾驶窗口，因为驾驶员抵达城市路段时疲劳更低。与 TRATON Group（Scania、MAN）和 International Motors 的 OEM 工厂集成，意味着卡车可从生产线直接预装
              PlusDrive 硬件出厂，消除了上一代 ADAS 部署受制于改装的摩擦。Ryder 参与 International Motors I-35 车队试验，说明大型第三方车队运营商可以把配备 PlusDrive
              的卡车接入现有 TMS 和调度工作流，而无需重做运营。HyperFoundry 把 Plus.ai 的可服务市场从卡车扩展到企业 AI
              客户，后者需要汽车级时空训练管线；该平台产生不依赖卡车部署数量的经常性软件授权收入，并在公司向 L4 扩张期间充当近期财务桥梁。OEM 渠道集成、车队运营商直接部署、企业 AI
              平台三者组合，形成三条获客路径，各自收入结构和销售周期不同，因此能在单一细分市场放缓时提供一定保护。
