      - number: '7.2'
        title: 技术、产品与运营风险
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 的核心技术风险是无激光雷达架构。SuperDrive 完全依赖摄像头和雷达，取消 lidar
              传感器后降低了单车硬件成本，但在恶劣天气——强降雨、浓雾、降雪——以及车道线消失的施工区域，会留下性能限制。Aurora 竞争产品 Aurora Driver 采用
              lidar、摄像头和雷达融合，提供更丰富的环境冗余，这是无 lidar 路线无法完全复制的。2026 年初报告的 RAFT（Fleet Readiness and Availability for
              Testing）指标为 79%，意味着在车队试验运营时长中，有 21% 的时间车辆被标记为尚未完全具备自动驾驶运行条件。管理层把这描述为朝着商业发布前超过 95%
              目标推进，但当前缺口要求更多软件迭代和道路测试，2027 年目标才具可信度。2026 年 3 月发布的 SuperDrive 6.0 新增夜间驾驶和施工区域处理能力，部分补上不利 ODD 缺口，但
              Autonomous Vehicle International 和 Trucking Info 的报道指出，性能改善仍缺少独立验证。

              运营可靠性风险不止来自传感器架构。NVIDIA 算力依赖具有结构性：Plus.ai 的整套感知和推理栈运行在 NVIDIA DRIVE AGX 及相关 NVIDIA
              芯片上，任何供应中断、价格变化或平台停产，都需要昂贵的重新工程化，而公司没有披露备选硬件。作为唯一已确认的算力供应商，NVIDIA 拥有显著议价权。网络安全风险来自云连接商业 AV 车队固有的 OTA
              软件更新入口；2026 年 2 月 ISO 21434 认证确认流程合规，但不保证攻击面为零。保险仍是未解决缺口：美国市场没有标准化的商业 Level 4
              自动驾驶卡车保险产品；车队试验期一旦发生责任事件，Plus.ai 在商业产品承保前可能暴露于无上限自保险损失。

              制造和集成质量风险位于 OEM 层。把 SuperDrive 工厂集成进 International LT Series 和 Scania/MAN 卡车，需要与 TRATON Group
              制造工程师紧密协同；工厂集成流程中的任何质量缺陷，都可能引发安全相关召回，并带来监管和声誉后果。2026 年 3 月启动的 I-35 走廊 International Level 4
              车队试验，为工厂集成质量提供了早期验证，但车队规模和持续时间仍停留在试点级别。2023 年约 30% 员工裁撤带来的劳动力风险，又被 ML
              工程师、自动驾驶车辆感知专家和安全验证专家的激烈人才市场放大——这些岗位上，Aurora、Waymo、Kodiak 和科技巨头都在争夺人才。参与搭建 Plus.ai 自研 ML
              训练和推理架构、且难以替代的工程师，留存风险尤其高。
