  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界与替代品
        blocks:
          - type: paragraph
            body: >
              与 PlusAI 软件业务最相关的市场，是面向北美和欧洲长途 Class 8 卡车的商用自动驾驶软件与系统市场。它不同于但邻近三个更大语境：（1）完整的美国商用卡车运输行业（年货运收入约 $900
              billion，涵盖所有运输方式和距离），（2）覆盖全部车型的全球自动驾驶汽车软件市场，以及（3）卡车高级驾驶辅助系统（ADAS）市场，后者包括 Delphi、Mobileye 等已规模部署的 Level 1–3
              产品。

              在自动驾驶卡车市场内，PlusAI 的相关支出边界包括：软件授权费、OEM 工厂内置集成服务，以及附带 AI 基础设施收入（HyperFoundry）。不纳入的支出包括：卡车硬件（Class 8
              车辆、传感器、计算模块）、车队远程信息订阅、ELD 合规软件、货运经纪平台，以及所有由人类驾驶员运营的货运服务。

              L4 自动驾驶卡车软件订阅的现状替代品，是一名人类 Class A CDL 驾驶员，年成本（含工资和福利）为 $65,000–$100,000。第二类替代品是 SAE Level 2+ 驾驶辅助系统，例如
              PlusAI 自有 PlusDrive 产品；它能减少事故、提升燃油效率，但仍需要人类驾驶员。第三类替代品是车队运营商继续观望，在监管框架成熟前保留选择权。
