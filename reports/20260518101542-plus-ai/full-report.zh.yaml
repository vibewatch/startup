      - number: '5.2'
        title: 技术架构——边缘 AI 与云端训练管线
        blocks:
          - type: paragraph
            body: >-
              PlusDrive 的传感器硬件由多摄像头阵列和短距、长距雷达组成，提供 360 度视野；技术栈刻意不采用 LiDAR，以降低单车成本和工厂集成复杂度，代价是恶劣天气覆盖不及 Aurora Innovation
              等配备 LiDAR 的竞争对手。NVIDIA DRIVE Thor 片上系统负责车端全部推理，接收融合后的摄像头 - 雷达数据流，实时运行 SuperDrive
              深度神经网络感知模型，生成场景理解输出并传给规划与控制模块。NVIDIA 的集中式计算架构把 ADAS 和自动驾驶工作负载整合到单芯片，而不是分散在独立域控制器上，从而降低 OEM
              合作伙伴的硬件集成复杂度。OTA 模型更新从 HyperFoundry 云端训练管线流向卡车边缘计算，因此感知模型版本无需把卡车送回服务站即可刷新。2026 年 3 月发布的 SuperDrive 6.0
              引入多模型集成感知、多摄像头 360 度场景感知、夜间驾驶能力和施工区处理，显著扩大了软件有效 ODD 覆盖。2026 年 3 月宣布的 Alpamayo 卡车大模型，是面向商用卡车的专用
              LLM，在车队遥测和高速场景数据上训练；它正被集成进 SuperDrive 技术栈，以提升长途长尾场景的泛化能力。云端侧托管在 HyperFoundry 基础设施上，负责基于车队遥测重新训练模型，管理向 162+
              辆已部署卡车的 OTA 分发，并作为独立企业 AI 平台，对需要高质量自动驾驶级训练管线和计算基础设施的外部客户授权。
