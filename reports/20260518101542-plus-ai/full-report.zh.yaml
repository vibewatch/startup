      - number: '6.2'
        title: 客户细分地图与市场渗透
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 采用 B2B2C 商业模式，OEM 集成方是主要直接客户：车队运营商不是直接与 Plus.ai 签软件合同，而是从 TRATON、International 或 IVECO
              购买出厂内置的卡车，从中获得 Plus.ai 自动驾驶软件。这条间接渠道把商业执行风险集中到 OEM 层：任何 OEM 集成项目停摆，或 OEM 转向其他 AV 战略，下游车队采用都会立刻受损。Plus.ai
              也保留面向 Ryder System 等大型运营商的直接车队渠道，因此形成双渠道商业模式。

              OEM 集成方细分市场——即 Class 8 长途卡车制造商——已有早期渗透。全球约十五个主要 Class 8 OEM 家族中，有三个与 Plus.ai
              签有活跃集成协议（TRATON/Scania/MAN、International/Navistar、IVECO），让公司在北美和欧洲具备有意义的覆盖宽度，但亚洲
              OEM（Dongfeng、FAW、CNHTC、Volvo）和其他美国 OEM（Daimler/DTNA、PACCAR/Kenworth/Peterbilt）仍未覆盖。Aurora 的竞争路径——纯软件 OEM
              授权、没有工厂股权集成——已拿下 PACCAR 和 Volvo，这说明在 OEM 层更像客户互补，而不是完全正面交锋。

              大型车队运营商细分市场仍处在极早期渗透阶段：截至 2026 年 5 月，Ryder System 是唯一已确认参与实时 Level 4 试验的活跃车队。Schneider National 和 Werner
              Enterprises 曾在 2021–2022 年宣布为 PlusDrive L2+ 试点客户，但没有公开续签或扩展，Werner 已转向 Aurora。企业 AI
              细分市场（HyperFoundry）虽然披露了 $25M 合同管线，却没有公开点名客户，是组合中透明度最低的客户板块。中小型车队运营商目前还不是 Plus.ai 工厂集成模式的可触达客户，因为该模式需要 OEM
              合作完成卡车制造。
