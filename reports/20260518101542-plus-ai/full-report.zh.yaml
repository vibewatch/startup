      - number: '3.2'
        title: 竞争对手画像
        blocks:
          - type: paragraph
            body: >
              Aurora Innovation 是 PlusAI 最重要的直接竞争对手。公司由前 Google 自动驾驶项目负责人 Chris Urmson 以及来自 Uber ATG、Tesla 的行业老兵创立，累计融资约
              $2.5 billion，并于 2021 年 11 月通过 SPAC 上市（NASDAQ: AUR）。2024 年 4 月，Aurora 在 Texas 商业推出 Aurora Driver 无人卡车服务，在
              Dallas–Houston 走廊为 FedEx 和 Werner Enterprises 承运货物，车上无安全驾驶员。Aurora 的 OEM 合作伙伴包括 PACCAR（Peterbilt 和
              Kenworth 品牌）以及 Volvo Trucks North America，合作结构是技术授权和集成协议，而不是股权安排。Aurora 截至 2025 年初约有 1,600
              名员工，并披露处于早期商业爬坡阶段，但未公开每英里定价。

              Kodiak Robotics 是第二活跃的直接 L4 竞争对手。公司由前 Uber ATG 和 Otto 工程师创立，累计融资约 $370 million，包括 2023 年 12 月 $250 million
              Series D，并已在 Texas 高速公路积累数十万无人驾驶英里。Kodiak 的独特之处在于持有美国 Department of Defense 和 US Air Force 自动驾驶物流车辆开发合同，带来
              PlusAI 不具备的政府收入流。Kodiak 约有 200 名员工，采用不绑定 OEM 的软件路线，尚未宣布相当于 Aurora–FedEx 安排的商业货运客户。

              Torc Robotics 于 2019 年被 Daimler Truck North America 收购，作为完全自有 R&D 单元为 Freightliner Cascadia 开发 L4。Torc 不能向
              Daimler 之外授权其技术栈，不发布独立财务结果，因此不是 PlusAI 在开放市场中的直接商业对手。不过，Torc 的集成先例在竞争风险上很重要：它证明 OEM 有意愿也有能力垂直整合自动驾驶软件能力。

              Waabi 由 Raquel Urtasun（Uber ATG 前 AI 研究负责人、University of Toronto 教授）于 2021 年创立，获得 $83.5 million Series A
              融资。Waabi 的差异化在于仿真优先、AI 原生的方法，减少实体车辆测试时间，并使用大规模自有合成训练数据集。Waabi 已与 Uber Freight 签署商业合作，但截至 2026
              年中尚未实现完全无人商业部署。Gatik 自 2021 年起与 Walmart、Kroger 在 B2B 中短途物流（配送中心到门店）中商业部署，但路线短（15–65 miles），运行设计域受限，不与
              PlusAI 的长途（300+ miles）目标重叠。Einride 是在美国和欧洲运营的电动货运平台，采用 Fleet OS 订阅模式，不是柴油长途卡车 AV 软件授权的竞争者。
