  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 收入质量与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 2025 年收入 $47.5 million，是 L4 自动驾驶卡车软件领域已公开披露的最高数字，且全部来自公司 L2+ 辅助驾驶订阅产品 PlusDrive。任何 L4
              无人驾驶运营收入仍为零。这个区分很关键：$47.5M 基础体现的是绑定卡车 OEM 硬件销售的 L2+ 订阅模式的商业韧性，而不是支撑乐观估值的、按英里计费的 L4 变革性经济性。PlusDrive
              的收入模式由一次性硬件组件（每辆车的传感器套件和边缘计算）叠加经常性 SaaS 订阅构成；若假设平均 SaaS 定价为 $700/truck/month，公司从估计 5,600–5,700
              辆全订阅装机车队中产生可预测的年经常性收入。

              两个结构性缺口进一步拉低收入质量。第一，2024 年年度收入基线没有以可获取形式公开披露，因此无法独立验证同比增长率。第二，公司没有披露按产品线划分的毛利率；可比 L2+ 车队软件的行业基准显示 SaaS
              毛利率为 60–75%，硬件毛利率为 25–40%，但 PlusDrive 具体收入组合未知。没有披露硬件与软件收入拆分，混合毛利率就无法有把握地计算。

              第二个收入支柱是 HyperFoundry，这是 2026 年初推出的企业 AI 模型训练平台，拥有 $25M 合同管线，管理层目标为 2026 年收入 $40–50M。HyperFoundry
              可能提供一个毛利率更高、且不依赖自动驾驶英里部署的软件分散收入流，但客户未公开点名；$40–50M 目标意味着仍有 $15–25M 未承诺增量收入，取决于 2026 年能否获得新的企业客户。2026 年 3
              月宣布的 NVIDIA Alpamayo 基础模型集成强化了 HyperFoundry 定位，但不能验证其管线转化概率。

              第三层收入——SuperDrive 按自动驾驶英里收取 $0.10–0.15 的 L4 授权费——仍完全处于商业化前阶段，目标为 2027 年。规模化后，500 辆卡车每天行驶 600 英里可产生每月
              $10–20M，但这一情景需要监管批准、安全论证就绪度达到 100%（当前 90.1%），并成功完成 2026 年 3 月与 Ryder 和 International Motors 启动的 I-35
              车队试验。收入轨迹取决于三个同时推进的催化剂，而没有任何一个已经完全去风险。
