      - number: '2.2'
        title: 市场规模测算——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              第三方对自动驾驶卡车市场的规模测算相差四倍甚至更多，取决于地理范围、技术层级和年份窗口；这反映的是商业化节奏存在真实分歧，不只是方法错误。2026 年最常被引用的估算集中在全球自动驾驶商用卡车市场 $35
              billion（Mordor Intelligence）到 $47 billion（Global Market Insights）之间，但这些数字把硬件（计算模块、LiDAR、雷达）和软件授权混在一起，对
              PlusAI 这样的纯软件供应商会产生误导。

              对 PlusAI 更有用的口径，是从底层估算 SAM，锚定 2026–2030 年窗口里监管和商业部署最可行的美国长途卡车走廊。American Trucking Associations
              估计，美国卡车每年行驶约 300 billion truck-miles。超过 500 miles 的长途路线约占里程的 25–30%，即每年约 75–90 billion miles，集中在 I-10、I-35
              和 I-80 走廊。按每英里软件定价 $0.05–$0.20（多位分析师引用的行业共识区间）计算，美国长途 L4 软件 SAM 在完全渗透时约为每年 $3.8–$18
              billion；按更保守的近期可服务口径，则约为 $3.5–$5.0 billion。

              PlusAI 在 2026–2028 年的 SOM 受几项因素限制：（a）车队试验仍处于前商业化阶段，（b）FMCSA 尚未批准无人驾驶运营，（c）OEM 制造爬坡依赖 SuperDrive 6.0
              工厂集成里程碑，（d）资本可得性。基于 TRATON 品牌销量（Scania、MAN、International 合计每年约 100,000 辆 Class 8）以及初始部署阶段现实的 1–3%
              获取率，PlusAI 到 2028 年的 SOM 区间为每年 $50–$200 million；这与管理层披露的 $25 million HyperFoundry 已签约管线和 2025 年 $47.5
              million PlusDrive 收入一致。
