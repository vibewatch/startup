      - number: '1.3'
        title: 融资、估值、投资方与资本
        blocks:
          - type: paragraph
            body: >
              自 2016 年创立以来，PlusAI 已在六轮或更多融资中累计融资约 $720 million，投资方覆盖战略 OEM、美国科技巨头和亚洲金融机构。Amazon 是早期战略投资方。TRATON
              Group（Scania、MAN 和 International Motors 的母公司）成为核心 OEM 投资方和合作伙伴。其他已披露投资方包括 FountainVest Partners、ClearVue
              Partners、GTJAI、Hyundai Motor Company、Millennium Technology Value Partners 和 SAIC Capital。

              与 Churchill Capital Corp IX 的拟议合并于 2025 年 6 月宣布，投前股权估值为 $1.2 billion，最多提供 $300 million 总募资，意在支持公司运营至 2027
              年商业化推出。SEC 于 2026 年 1 月 12 日宣布 S-4 生效；Churchill 股东投票排期在 2026 年 2 月 3 日。该 SPAC 交易意味着估值较 2021 年据报道达到的约 $8
              billion 私募市场峰值大幅压缩——降幅约 85%，既反映自动驾驶汽车商业化时间表在更广泛行业中的重估，也反映公开市场对收入前 AV 公司的审查更严。

              2026 年 1 月 26 日宣布扩大的 TRATON 合作包括最多 $25 million 的 R&D 资金，用于 SuperDrive 在 Scania、MAN 和 International
              品牌上的工厂集成；还包括与收入挂钩的股权认股权证和 TRATON 董事会席位。这一结构使 OEM 与股东激励一致，但如果 TRATON 的商业化承诺减弱，也会带来集中度风险。
