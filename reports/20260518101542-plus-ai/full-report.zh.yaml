  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 美国司机短缺（2024 年 80,000+ 个岗位空缺）
        - 驱动因素 / 加速项
        - 现在–2031 年
        - 推高车队人工成本，迫使长途干线更急于用自动驾驶替代
        - 跟踪 ATA 年度司机短缺报告；验证司机成本通胀轨迹
      - - FMCSA 无人驾驶卡车规则制定
        - 约束
        - 2026–2028 年估计
        - 无人驾驶商用卡车缺少可执行的联邦框架；拖慢全面商业规模化
        - 跟踪 FMCSA NPRM 和征求意见期；若规则滑到 2029 年，建模延迟情景
      - - 司机成本通胀（2024 年平均 $72K–$85K）
        - 驱动因素 / 加速项
        - 持续
        - 与完整司机成本相比，$0.10–$0.20/英里定价下的自动驾驶订阅 ROI 更好
        - 建模回本对司机工资假设的敏感性
      - - 工时规则利用率上行空间（每日里程 2x）
        - 驱动因素 / 加速项
        - 监管批准后
        - 自动驾驶卡车每天可跑 20–22 小时；受 HOS 约束的司机为 11 小时
        - 核实 Texas 和 Arizona 许可框架下的最长运营小时数
      - - Teamsters / OOIDA 劳工反对
        - 约束
        - 现在–持续
        - 立法可能强制配安全司机；每辆车每年运营成本或增加 $60K+
        - 跟踪 TX、AZ、CA 关于强制随车人员要求的立法提案
      - - 车队替换资本强度
        - 约束
        - 2026–2030
        - 配备自动驾驶的卡车有溢价；承运商低利润率限制采用速度
        - 建模卡车增量溢价与自动驾驶软件节省的对比；核查 OEM 定价意图
      - - Aurora 商业发布（Texas，2024 年 4 月）
        - 驱动因素 / 加速项
        - 活跃
        - 证明市场接受度；增强车队运营商信心；为 PlusAI 时间表风险提供基准
        - 跟踪 Aurora 商业运量和安全事件，作为监管参考
      - - 州监管碎片化（TX、AZ、FL 友好）
        - 混合
        - 现在–2028 年
        - Texas Triangle 较宽松，但跨州线路需要联邦规则；限制全国 SAM
        - 逐线路梳理监管状态；识别当前允许商业运营的走廊
      - - 中国部件禁令风险（LiDAR / 传感器）
        - 约束
        - 2025–2026+
        - 美国商务部拟议禁止中国来源自动驾驶部件，可能影响传感器供应链
        - 审计 PlusAI 传感器供应链；确认非中国传感器替代方案已就位或已有计划
      - - OEM 采用速度（TRATON、IVECO、International）
        - 驱动因素 / 加速项
        - 2026–2027
        - 工厂集成卡车是放量的可扩展路径；OEM 承诺降低 PlusAI 单车成本
        - 确认支持 SuperDrive 的卡车型号 OEM 制造启动日期；跟踪生产计划
    notes: 方向评级：驱动因素 / 加速项 = 对自动驾驶卡车采用为正面；约束 = 负面。时间基于截至 2026 年 5 月公开可得的监管和行业信息估计。
