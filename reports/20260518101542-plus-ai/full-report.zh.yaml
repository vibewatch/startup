  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与国家安全风险
        blocks:
          - type: paragraph
            body: >-
              Plus.ai 同时处在联邦自动驾驶车辆监管、国家安全审查和州级商业部署法律的交汇处。最根本的监管风险，是 FMCSA 仍未敲定允许无人值守商业 Level 4 卡车在美国公共高速公路上运营的规则。USDOT
              发布的 DOT Federal Automated Vehicles Policy 只提供自愿框架，不构成可执行的商业授权；截至 2026 年 5 月尽调日，覆盖车辆标准、安全表现报告和运营设计域限制的约束性
              FMCSA 规则仍停留在拟议阶段。FMCSA 的 Automated Driving Systems 页面确认，Level 4 全自动商业卡车运营尚无最终规则。若最终规则比 2026
              年中预期窗口推迟六个月或更久，Plus.ai 的 2027 年商业 L4 放量将被顺延，公司也会更长时间只依赖 L2+ 订阅收入，而该收入只是预期 L4 按英里收费的一小部分。FreightWaves
              分析还指出，拟议中的中国组件禁令及其对拥有中国工程背景的自动驾驶卡车 OEM 的影响，是约束 Plus.ai 硬件供应链的次级监管风险。

              国家安全风险在法律上最为独立。Plus.ai 由中国籍创始人共同创立，历史上曾在中国开展大量 R&D，直到 2023 年才把这些业务及相关股权权益转让给 Full Truck
              Alliance（YMM）。这笔转让旨在降低 CFIUS 风险，但没有消除风险：创始人仍担任美国实体高管，而 CFIUS 的审查权限覆盖 SPAC 交易本身，因为它属于控制权变更事件。美国财政部 CFIUS
              页面确认，受管辖交易包括任何可能导致外国控制美国企业的交易，也包括部分涉及外国受益所有人的实体参与的 SPAC 合并。TuSimple 先例——一家由中国人共同创立的自动驾驶卡车公司，在 CFIUS 压力和
              SEC 调查下解散——说明审查并非理论风险。Bloomberg 2025 年 11 月调查特写在具有潜在国家安全风险的中国背景 AV 公司语境下，将 Plus.ai 与 TuSimple 并列点名。SEC 于
              2026 年 1 月 13 日宣布生效的 S-4 注册声明将 CFIUS 列为重大风险因素。正式 CFIUS 调查可能要求技术剥离、董事会变更或供应链切分，带来显著成本和运营扰动；最坏情况下，CFIUS
              可能阻止交易，或施加等同于导致 TuSimple 解散的限制。

              州级 AV 监管进一步增加合规复杂度。California DMV 测试和部署报告确认，该州要求自动驾驶重型卡车另行取得无人值守商业许可，限制 Plus.ai 在美国最大货运市场扩张无人驾驶运营。Texas 州
              AV 法允许无人驾驶运营，但 I-35 授权不延伸到其他走廊。2026–2027 年商业规模化窗口内，同时满足数十个州辖区的合规要求，是重大的执行风险。NHTSA
              自动驾驶车辆安全框架还施加额外的联邦安全表现报告义务，增加合规成本。2026 年 2 月取得的四项 ISO 认证（包括 ISO 26262 功能安全和 ISO 21434
              网络安全）部分缓释了技术就绪维度，但不提供任何联邦或州监管机构的约束性商业授权。
