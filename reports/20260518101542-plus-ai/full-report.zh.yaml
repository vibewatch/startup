  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现路径
        blocks:
          - type: paragraph
            body: >-
              PlusAI 采用三层收入模式：近期从硬件和软件订阅切入，中期推进 AI 平台授权，长期转向按英里收费的自动驾驶卡车服务。最成熟的一层是 L2+ 辅助驾驶产品 PlusDrive，2025 年产生 $47.5
              million 收入，主要来自每车硬件销售和经常性 SaaS 订阅。这种订阅优先的变现策略，与 Aurora Innovation 在 2024 年后无人商业推出阶段才确认收入的做法有结构差异。PlusAI
              在实现完整 L4 无人能力前就能收取订阅收入，为客户商业付费意愿和多年无人前阶段的现金流稳定性提供了部分证明。


              第二层收入是 HyperFoundry，PlusAI 于 2026 年初推出的 AI 模型训练和推理平台，已签约管线 $25 million，管理层目标为 2026 年收入 $40–50
              million。HyperFoundry 服务需要大规模、自动驾驶级数据处理和模型训练的外部企业 AI 客户，实际上把 PlusAI 的 AI
              基础设施从单一卡车部署中拆出来单独变现。该平台代表毛利率更高的软件授权业务，降低了 PlusAI 对已部署卡车数量的财务依赖。


              第三层也是最具变革性的一层，是计划中的 SuperDrive L4 无人卡车按英里授权模式，目标 2027 年商业推出。管理层曾表示目标定价约为每自动驾驶英里 $0.10–$0.15，与 Aurora
              披露的定价区间相当。规模化后，500 辆卡车的车队若每天每车跑 600 miles，每月可产生约 $10–20 million 按英里收入。不过，这一层仍处于商业化前阶段，执行风险取决于 2027
              年无人驾驶监管和安全里程碑。
