      - number: '8.2'
        title: 可比公司倍数与 SPAC 定价语境
        blocks:
          - type: paragraph
            body: >-
              以 $1.2B pre-money 估值对比 2025 年 $47.5M PlusDrive 收入，Plus.ai 隐含约 25× EV/Revenue——这个倍数明显低于 Aurora Innovation
              隐含倍数，但显著高于 Mobileye 成熟 ADAS 可比公司。同行集必须按阶段、收入类型和技术层级仔细校准，否则跨公司比较会误导。

              Aurora Innovation（NASDAQ: AUR）是最接近的直接可比公司，作为美国上市的 L4 自动驾驶卡车公司，其市值约 $2.5B，而披露收入极少，隐含名义 EV/Revenue 倍数达到 250×
              或更高——不过 Aurora 2024 年 4 月才开始商业发布，收入刚起量，任何近期 EV/Revenue 比率都不适合作为估值锚。Mobileye（NASDAQ: MBLY）市值约 $12B，对应约 $2B
              成熟 ADAS 产品收入（6× 倍数），代表成熟度光谱的远端，Plus.ai 只有在 L4 成功商业规模化后才可能接近。Waymo 为私人公司、背靠 Alphabet，估值估计
              $45B，商业收入极少，本质上按长期期权价值定价——与 Plus.ai 的 SPAC 结构不可比。

              TuSimple（2024 年解散）是最重要的反向可比：它 2021 年通过 SPAC 以约 $8B 估值进入公开市场，随后在 CFIUS 和治理调查下崩塌，最终清盘，价值几乎归零。考虑到 Plus.ai
              的中国背景创立、此前与 FTA 的股权关系，以及持续 CFIUS 不确定性，TuSimple 轨迹是最适用的警示先例。Plus.ai $1.2B 入场价隐含折价了 TuSimple 情景，但没有完全剔除该风险。

              Kodiak Robotics（私有，估值约 $1B）是阶段更接近的可比公司，同为商业化前 L4 卡车公司且未披露收入——这说明市场目前给商业化前 L4 卡车进入者的估值区间为 $500M–$1.5B，与
              Plus.ai 的 SPAC 定价一致。SPAC AV 卡车群体（Embark、TuSimple、Locomation）从 2021 年峰值平均下跌 70–95%，让这类资产结构性重估，也使 Plus.ai
              $1.2B 入场价比与 2021 年群体相比更站得住。以 25× 收入倍数、已披露 OEM 锚点、活跃车队试验和 HyperFoundry 分散收入来看，SPAC 价格偏激进，但相对于 L4
              前阶段同行，并非显然不可辩护。
