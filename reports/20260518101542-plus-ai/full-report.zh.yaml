      - number: '1.2'
        title: 领导层、创始人、董事会与治理
        blocks:
          - type: paragraph
            body: >
              PlusAI 由四位技术领导者共同创办，他们均接受过 Stanford University 研究生训练，并在 AI、运营和产品工程上有履历。David Liu（CEO）拥有 Stanford
              电气工程博士学位，曾在 RMG Networks、RedAtoms、Hewlett Packard 和 McKinsey & Company 担任领导职务。Shawn Kerrigan（COO 兼联合创始人）带来
              Stanford 背景的运营和工程经验。Hao Zheng（CTO 兼联合创始人）是 AI 和机器学习专家，曾任 Yahoo Labs 高级总监和 Zynga Asia CTO。Tim
              Daly（首席架构师兼联合创始人）专攻分布式系统和 AI，拥有多项自动驾驶专利。

              公司在公开上市前补强了高管梯队。Steve Spinner 担任 CFO。VP 层包括 Anurag Ganguli（R&D）、Amit Kumar（Engineering）、Robert
              Dingli（Systems and Safety）、Wiley Deck（Government Affairs）、Derrick Nueman（Investor Relations）、Lauren
              Kwan（Marketing）和 Yefei Peng（Data）。2026 年 1 月，董事会增补 David C. Peterschmidt 和 Harry J. Harczak
              Jr.，两人都有上市公司经验，任命在上市后生效。TRATON Group 将按扩大战略合作协议提名一名董事会代表。

              关键人集中度仍然较高。David Liu 同时承担创始愿景、对外融资和合作伙伴关系角色。2023 年重组中，PlusAI 的中国团队转让给 Full Truck
              Alliance，公司由此重新聚焦美国和欧洲市场，降低了地域管理复杂度，但也转出了早期中国市场人才和本地合作关系。
