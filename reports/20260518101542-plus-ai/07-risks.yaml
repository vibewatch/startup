  evidenceGaps:
    - id: ER001
      type: private-evidence-only
      severity: material
      topic: plus-ai-cfius-formal-review-status
      missingEvidence: >-
        No public source confirms or denies whether the US Treasury CFIUS office has
        initiated a formal review or issued any correspondence regarding the Plus.ai /
        Churchill Capital SPAC transaction. The S-4 discloses CFIUS as a material risk
        factor but does not confirm formal notice or clearance. This is the highest-severity
        undisclosed risk in the Plus.ai investment.
      whyItMatters: >-
        A formal CFIUS investigation could block the SPAC transaction, impose structural
        remedies including technology divestiture or governance changes, or result in
        operating restrictions similar to those that dissolved TuSimple. Without
        confirmation of CFIUS clearance, no investor can assess the probability of
        transaction completion or the structural integrity of Plus.ai's technology stack.
      diligencePath: >-
        Retain CFIUS-specialized counsel to conduct an independent pre-closing assessment;
        request from Plus.ai legal team any CFIUS correspondence, including any notices of
        investigation or voluntary notices filed; review S-4 risk factors for any updated
        disclosure beyond those available at the effective date.
      relatedQuestionRefs: [QR002, QR003]

    - id: ER002
      type: private-evidence-only
      severity: material
      topic: spac-redemption-rate-and-pipe-backstop
      missingEvidence: >-
        The actual SPAC redemption rate at the February 3 2026 shareholder vote is not
        publicly disclosed as of the May 2026 diligence date. The S-4 identifies PIPE
        backstop commitments but their total size and counterparty quality are not
        confirmed in any public source reviewed. Post-vote trust proceeds are therefore
        unverifiable from public sources.
      whyItMatters: >-
        Post-merger capital adequacy is the single largest financial risk variable for
        Plus.ai's 2027 L4 ramp. A redemption rate above 70% would leave less than $100M
        in trust proceeds, potentially requiring dilutive emergency financing that could
        impair the investment thesis on entry.
      diligencePath: >-
        Request post-vote trust balance confirmation and any PIPE commitment letters
        before committing capital; model three scenarios (50%, 70%, 90% redemption) against
        estimated annual burn rate and L4 commercialization capex.
      relatedQuestionRefs: [QR010, QR026]

    - id: ER003
