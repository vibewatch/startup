  - id: mitigations-monitoring
    title: Mitigations, Monitoring Indicators, and Diligence Asks
    body: >-
      Regulatory risk monitoring requires tracking the FMCSA proposed rulemaking timeline and any
      NPRM publication cadence from the DOT's Automated Vehicles portal. The key thesis-break trigger
      is failure to publish a final FMCSA rule authorizing commercial Level 4 driverless heavy truck
      operations before the end of 2027, which would extend the exclusively L2+ revenue period by at
      least 12–18 months and require a revised financial model. An investor or board monitoring dashboard
      should track: FMCSA NPRM publication date, California DMV permit submission status, and any CFIUS
      formal investigation disclosure in quarterly or annual public filings. ISO certification maintenance
      and any adverse NHTSA enforcement action are secondary indicators.

      CFIUS risk monitoring centers on the S-4 and any post-merger SEC filings that disclose a CFIUS
      notice or formal investigation. The TuSimple precedent and the Treasury CFIUS framework confirm
      that the most likely trigger for a formal review would be a third-party complaint to CFIUS from
      a competitor, a member of Congress, or a national-security organization. An investor should retain
      a CFIUS-specialized attorney to conduct an independent pre-closing assessment of the transaction
      structure, the founders' ongoing roles, the technology transfer history, and any remaining
      Chinese beneficial ownership or licensing back-channels. The diligence ask is a comprehensive
      CFIUS counsel memorandum addressing all four risk dimensions before closing.

      SPAC redemption risk is partially addressable through a PIPE backstop analysis: investors should
      confirm the size and counterparty quality of any committed PIPE financing before the February
      shareholder vote, and model the post-merger balance sheet under 50%, 70%, and 90% redemption
      scenarios. A kill criterion is a post-vote trust balance below $75M with no confirmed PIPE bridge,
      which would leave Plus.ai with less than one year of operating runway at the estimated $80–120M
      annual burn. TRATON concentration monitoring requires quarterly revenue attribution: if TRATON
      and its brands exceed 80% of total revenue for two consecutive quarters post-merger, an OEM
      diversification plan with milestones and named alternative OEM targets should be demanded from
      management. Talent risk requires head-count tracking across the ML, perception, and safety
      validation functions, with an attrition rate above 15% per year in any of these three functions
      serving as a board-level concern. The ATA driver shortage report confirms structural labor
      supply constraints in the trucking industry that amplify the urgency of autonomous deployment
      — but also means Plus.ai competes for engineering talent against a sector with unusually high
      capital deployment. Key diligence asks include: data-room access to post-vote redemption proceeds
      and PIPE terms; TRATON revenue schedule confirming percentage concentration; engineering
      head-count and attrition rates by function for 2024 and 2025; and a CFIUS counsel memorandum
      confirming the transaction has been reviewed against current CFIUS risk factors.
