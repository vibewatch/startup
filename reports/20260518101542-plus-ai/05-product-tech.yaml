    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Seven-layer hardware and software architecture of Plus.ai's PlusDrive system,
      from the physical sensor layer through edge compute and cloud training platform,
      illustrating the edge-AI-first design with NVIDIA DRIVE Thor as the compute substrate.
    data:
      layers:
        - id: layer-sensor
          label: "Sensor Layer"
          detail: "Multi-camera array (360° coverage: front, rear, flanks); short-range and long-range radar units; no lidar"
        - id: layer-fusion
          label: "Sensor Fusion Layer"
          detail: "Camera-radar data fusion and pre-processing; calibration and synchronization; runs on NVIDIA DRIVE Thor"
        - id: layer-perception
          label: "Perception AI Layer (SuperDrive 6.0)"
          detail: "DNN multi-model ensemble; object detection, lane classification, depth estimation, scene understanding; OTA-updatable"
        - id: layer-planning
          label: "Prediction & Planning Layer"
          detail: "Trajectory prediction; path planning; decision-making; actuation command generation; ISO 26262 ASIL-D certified"
        - id: layer-control
          label: "Vehicle Control Layer"
          detail: "CAN bus actuation commands: steering, throttle, brake; OEM-specific integration adapter per TRATON/International/IVECO"
        - id: layer-edge-compute
          label: "Edge Compute Substrate (NVIDIA DRIVE Thor SoC)"
          detail: "Centralized on-truck inference and sensor processing; replaces multiple domain controllers; OTA-updatable firmware"
        - id: layer-cloud
          label: "Cloud/Platform Layer (HyperFoundry)"
          detail: "Model retraining on fleet telemetry; OTA update distribution; Alpamayo LLM training; enterprise AI licensing"
