  evidenceGaps:
    - id: EE001
      topic: V2X and DSRC connectivity capability
      description: >-
        No public announcement, datasheet, or technical disclosure confirms whether any
        version of PlusDrive or SuperDrive includes V2X or DSRC connectivity. The absence
        of public disclosure means Plus.ai's positioning relative to competitors that have
        announced V2X roadmaps cannot be assessed from external sources alone. If V2X is
        absent, the ODD expansion required for post-2027 driverless operation may require
        a future hardware revision.
      relatedQuestionRefs: [QE025]
      relatedTableRefs: [TE003]

    - id: EE002
      topic: HyperFoundry enterprise customer details
      description: >-
        Plus.ai has disclosed a $25 million contracted pipeline for HyperFoundry as of
        January 2026 but has not publicly named any enterprise customers, disclosed
        contract terms, or explained the specific AI use cases being served beyond
        autonomous-vehicle data training. This gap limits the ability to assess whether
        HyperFoundry revenue is concentrated in one or two unnamed customers or diversified
        across a broader enterprise base, which is material for evaluating the platform
        revenue quality and renewal risk.
      relatedQuestionRefs: [QE026]
      relatedTableRefs: [TE001]

    - id: EE003
      topic: Alpamayo LLM architecture and training details
      description: >-
        Plus.ai's announcement of the Alpamayo large trucking model in March 2026 did not
        disclose model architecture, parameter count, training corpus size, benchmark
        performance, or integration timeline within the SuperDrive production stack.
        Without these details it is not possible to independently assess the model's
        capability differentiation relative to general-purpose LLMs applied to trucking
        scenarios. This gap is material for evaluating whether Alpamayo represents a
        defensible technical moat or is primarily a marketing positioning claim.
      relatedQuestionRefs: [QE027]
      relatedTableRefs: []
