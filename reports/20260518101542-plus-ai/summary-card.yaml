  topStrengths:
    - >-
      Deep OEM integration with TRATON (Scania, MAN, International) creates durable distribution moat and recurring
      revenue visibility.
    - >-
      Camera-only sensor fusion (no lidar) enables significantly lower per-truck cost than Aurora or Waymo Via,
      supporting mass-market deployment economics.
    - >-
      NVIDIA Drive Thor partnership and Alpamayo large trucking model represent genuine technical differentiation in
      perception and AI architecture.
    - >-
      $47.5M 2025 revenue provides commercial validation beyond pure concept stage; $25M HyperFoundry contracted
      pipeline adds L4 upside optionality.
  topRisks:
    - >-
      L4 autonomous deployment without safety driver is post-2027 contingent on regulatory clearance; Aurora has a 2+
      year head start with safety-driver removal already achieved.
    - >-
      SPAC redemption risk is material — high redemption rates could leave PlusAI with insufficient post-merger
      liquidity, potentially triggering a capital crisis within 18 months.
    - >-
      TRATON customer concentration creates binary revenue risk; loss or renegotiation of the OEM partnership would be
      existential at current revenue scale.
    - >-
      CFIUS exposure from Chinese-origin founders and historical China operations (FTA team transfer 2023) introduces
      regulatory uncertainty around the public listing.
    - >-
      Private GAAP financials, gross margin, and burn rate are not independently audited or publicly disclosed; the
      valuation case rests on unverified management estimates.
  unresolvedGaps:
    - Audited gross margin, operating burn, and cash balance not disclosed; S-4 summary figures only.
    - HyperFoundry customer identities, contract terms, and revenue recognition methodology are not public.
    - Churchill Capital IX warrant structure and post-SPAC dilution profile require independent modeling.
    - CFIUS review status and any conditions or clearance letters not publicly disclosed.
    - >-
      Net SPAC proceeds after redemptions not determinable pre-vote; runway scenario is conditional on redemption
      outcome.
