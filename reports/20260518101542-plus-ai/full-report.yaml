      - CV039
  - id: FV006
    slug: revenue-quality-matrix
    title: Revenue Stream Quality Assessment Matrix
    type: matrix
    insight: >-
      PlusDrive SaaS is the only revenue stream combining meaningful current scale, recurring characteristics, and
      confirmed customer willingness to pay; all other streams are either hardware-dependent (margin-constrained),
      pre-commercial, or unconfirmed — making PlusDrive SaaS the sole near-term valuation anchor.
    data:
      columns:
        - 2025 Contribution
        - Gross Margin Quality
        - Recurrence
        - Growth Visibility
        - Risk Level
      rows:
        - label: PlusDrive Hardware
          values:
            - label: Major (est. 40–50% of $47.5M)
            - label: Low (25–40% est.; BOM cost pressure)
            - label: One-time per truck
            - label: Medium (new truck sales volume)
            - label: High (hardware margin compression)
        - label: PlusDrive SaaS Subscription
          values:
            - label: Major (est. 50–60% of $47.5M)
            - label: High (60–75% est.)
            - label: High (monthly recurring)
            - label: High (installed base × churn)
            - label: Low (proven product-market fit)
        - label: HyperFoundry Platform
          values:
            - label: Minor ($25M contracted pipeline; 0 recognised 2025)
            - label: Very high (pure software licensing est.)
            - label: Medium (enterprise SaaS contracts)
            - label: Low (customers unnamed; target unconfirmed)
            - label: High (pipeline quality unverified)
        - label: SuperDrive L4 Per-Mile
          values:
            - label: Zero (pre-commercial)
            - label: Very high est. (software per-mile)
            - label: High (per-mile recurring)
            - label: Very low (2027 target; SCR 90.1%)
            - label: Very high (regulatory + commercial risk)
