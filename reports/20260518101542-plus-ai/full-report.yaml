      - number: '4.3'
        title: Unit Economics and Path to Profitability
        blocks:
          - type: paragraph
            body: >-
              PlusDrive unit economics consist of an estimated one-time hardware component of approximately $5,000 per
              truck (reflecting sensor suite and compute hardware costs) combined with a monthly SaaS subscription. The
              subscription pricing has not been publicly disclosed by PlusAI; industry benchmarks for comparable L2+
              fleet software range from $400 to $1,200 per truck per month depending on feature tier and contract
              length. Assuming a midpoint of $700 per truck per month and $47.5 million in 2025 revenue, the implied
              installed base would be approximately 5,650 PlusDrive trucks at full subscription, or more trucks at a
              lower per-unit price reflecting hardware revenue contribution.


              The software-as-a-service subscription component carries structurally higher gross margins than the
              hardware component, which is subject to bill-of-materials cost pressure from sensor and compute supply
              chains. HyperFoundry is expected to generate materially higher gross margins as a pure software licensing
              business with no per-unit hardware cost, making it a key margin expansion lever in the 2026–2027 period.


              Path to profitability depends on three overlapping levers: (1) PlusDrive installed base growth generating
              recurring subscription revenue at improving gross margins as hardware costs decline; (2) HyperFoundry
              revenue scaling from $25M contracted to $40–50M in 2026, contributing high-margin licensing income; and
              (3) SuperDrive per-mile revenue commencing in 2027 at potentially high software gross margins. At 462
              employees and an estimated annual burn of $80–120 million, PlusAI is not projected to reach cash-flow
              breakeven before 2029–2031 on current trajectory, absent a significant acceleration in either L4
              deployment or HyperFoundry licensing.
