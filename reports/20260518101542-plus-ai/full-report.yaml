  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Pathway
        blocks:
          - type: paragraph
            body: >-
              PlusAI operates a three-tier revenue model that progresses from near-term hardware and software
              subscriptions through a mid-term AI platform licensing strategy to a long-term per-mile autonomous
              trucking service. The most mature tier is PlusDrive, the L2+ assisted driving product, which generated
              $47.5 million in revenue in 2025, primarily from per-truck hardware sales and recurring SaaS
              subscriptions. This subscription-first monetization strategy differs structurally from Aurora Innovation,
              which has deferred revenue recognition to its post-2024 driverless commercial launch phase. PlusAI's
              ability to collect subscription revenue before achieving full L4 driverless capability provides a partial
              proof of commercial willingness-to-pay and cash flow stability during the multi-year pre-driverless
              period.


              The second revenue tier is HyperFoundry, PlusAI's AI model training and inference platform launched in
              early 2026 with a $25 million contracted pipeline and a management target of $40–50 million in 2026
              revenue. HyperFoundry serves external enterprise AI customers who require large-scale
              autonomous-driving-grade data processing and model training, effectively monetizing PlusAI's AI
              infrastructure independently of any single truck deployment. The platform represents a higher-margin
              software licensing business that reduces PlusAI's financial dependency on the number of trucks deployed.


              The third and most transformative revenue tier is the planned SuperDrive per-mile licensing model for L4
              driverless trucks targeting commercial launch in 2027. Management has indicated a target pricing of
              approximately $0.10–$0.15 per autonomous mile, comparable to Aurora's disclosed pricing range. At scale, a
              500-truck fleet running 600 miles per day would generate approximately $10–20 million per month in
              per-mile revenue. However, this tier remains pre-commercial and carries execution risk tied to the 2027
              driverless regulatory and safety milestone.
