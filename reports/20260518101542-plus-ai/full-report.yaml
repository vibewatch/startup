      - number: '1.2'
        title: Leadership, Founders, Board, and Governance
        blocks:
          - type: paragraph
            body: >
              PlusAI was co-founded by four technical leaders with graduate training from Stanford University and track
              records in AI, operations, and product engineering. David Liu (CEO) holds a PhD in Electrical Engineering
              from Stanford and previously held leadership roles at RMG Networks, RedAtoms, Hewlett Packard, and
              McKinsey & Company. Shawn Kerrigan (COO and co-founder) brings operational and engineering expertise from
              Stanford. Hao Zheng (CTO and co-founder) is an AI and machine learning specialist who previously served as
              Senior Director at Yahoo Labs and CTO of Zynga Asia. Tim Daly (Chief Architect and co-founder) is a
              specialist in distributed systems and AI with numerous autonomous driving patents.

              The senior leadership bench has been strengthened ahead of public listing. Steve Spinner serves as CFO.
              The VP layer includes Anurag Ganguli (R&D), Amit Kumar (Engineering), Robert Dingli (Systems and Safety),
              Wiley Deck (Government Affairs), Derrick Nueman (Investor Relations), Lauren Kwan (Marketing), and Yefei
              Peng (Data). In January 2026 the board was bolstered by the addition of David C. Peterschmidt and Harry J.
              Harczak Jr., both public-company veterans, effective upon listing. TRATON Group will nominate a board
              representative as part of its expanded partnership.

              Key-person concentration remains elevated. David Liu occupies both the founding vision and external-facing
              capital and partnership roles. The 2023 reorganization in which PlusAI's China-based team was transferred
              to Full Truck Alliance effectively refocused the company on US and European markets, reducing geographic
              management complexity but also transferring earlier China-market talent and local partnerships.
