      - number: '5.2'
        title: Technical Architecture — Edge AI and Cloud Training Pipeline
        blocks:
          - type: paragraph
            body: >-
              PlusDrive's sensor hardware consists of a multi-camera array providing 360-degree field of view and short-
              and long-range radar units; the stack deliberately excludes lidar to reduce per-truck unit cost and
              factory-integration complexity at the cost of reduced adverse-weather coverage relative to lidar-equipped
              competitors such as Aurora Innovation. The NVIDIA DRIVE Thor system-on-chip handles all on-truck
              inference, receiving the fused camera-radar stream and executing the SuperDrive deep neural network
              perception models in real time to produce a scene-understanding output passed to the planning and control
              module. NVIDIA's centralized compute architecture consolidates ADAS and autonomy workloads onto a single
              chip rather than separate domain controllers, reducing hardware integration complexity for OEM partners.
              Over-the-air model updates flow from the HyperFoundry cloud training pipeline to the truck edge compute,
              so perception model versions can be refreshed without returning trucks to a service depot. SuperDrive 6.0,
              launched in March 2026, introduced multi-model ensemble perception, multi-camera 360-degree scene
              awareness, night driving capability, and construction zone handling, materially extending the software's
              effective ODD coverage. The Alpamayo large trucking model, announced March 2026, is a
              commercial-trucking-specific LLM trained on fleet telemetry and highway scenario data; it is being
              integrated into the SuperDrive stack to improve generalization on long-haul edge-case scenarios. The cloud
              side — hosted on HyperFoundry infrastructure — handles model retraining on fleet telemetry, manages OTA
              distribution to the 162+ deployed trucks, and serves as a standalone enterprise AI platform that Plus.ai
              licenses independently to external customers needing high-quality autonomous-vehicle-grade training
              pipelines and compute infrastructure.
