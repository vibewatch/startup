      - number: '7.2'
        title: Technology, Product, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Plus.ai's core technology risk is the no-lidar architecture. SuperDrive relies exclusively on cameras and
              radar, reducing hardware cost per truck by eliminating lidar sensors but introducing residual performance
              limitations in adverse weather — heavy rain, dense fog, and snow — and in construction zones where lane
              markings disappear. Aurora's competing Aurora Driver platform uses lidar, camera, and radar fusion,
              providing richer environmental redundancy that the no-lidar approach cannot fully replicate. The RAFT
              (Fleet Readiness and Availability for Testing) metric reported at 79% as of early 2026 means that in 21%
              of fleet-trial operational hours, vehicles are flagged as not fully ready for autonomous operation. While
              management frames this as progress toward a target above 95% for commercial launch, the current gap
              requires further software iteration and field testing before the 2027 target is credible. SuperDrive 6.0,
              released in March 2026, added night-driving and construction-zone handling capabilities, partially closing
              the adverse-ODD gap, but Autonomous Vehicle International and Trucking Info coverage notes that
              independent verification of performance improvements remains limited.

              Operational reliability risks extend beyond sensor architecture. The NVIDIA compute dependency is
              structural: Plus.ai's entire perception and inference stack runs on NVIDIA DRIVE AGX and related NVIDIA
              silicon, and any supply disruption, pricing change, or platform discontinuation would require expensive
              re-engineering with no disclosed fallback hardware. NVIDIA holds significant leverage as the only
              confirmed compute supplier. Cybersecurity risk arises from the over-the-air software update surface
              inherent in a cloud-connected commercial AV fleet; the February 2026 ISO 21434 certification confirms
              process compliance but does not guarantee zero attack-surface exposure. Insurance remains an unresolved
              gap: no standardized commercial Level 4 autonomous trucking insurance product exists in the US market, and
              any liability event during the fleet trial period could expose Plus.ai to uncapped self-insured losses
              until a commercial product is underwritten.

              Manufacturing and integration quality risk is present at the OEM level. Factory integration of SuperDrive
              into International LT Series and Scania/MAN trucks requires close coordination with TRATON Group
              manufacturing engineers, and any quality defect in the factory integration process could result in
              safety-related recalls with regulatory and reputational consequences. The International Level 4 fleet
              trial on the I-35 corridor launched in March 2026 provides early proof of factory integration quality, but
              fleet size and duration remain at pilot scale. The labor risk from the 2023 workforce reduction of
              approximately 30% of staff is compounded by a highly competitive market for ML engineers, autonomous
              vehicle perception specialists, and safety validation experts — all roles where Aurora, Waymo, Kodiak, and
              technology giants compete for talent. Retention risk is particularly acute for the engineers who built
              Plus.ai's proprietary ML training and inference architecture and who are difficult to replace.
