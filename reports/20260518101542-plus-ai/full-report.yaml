      - number: '3.2'
        title: Competitor Profiles
        blocks:
          - type: paragraph
            body: >
              Aurora Innovation is PlusAI's most consequential direct competitor. Founded by former Google self-driving
              project lead Chris Urmson and industry veterans from Uber ATG and Tesla, Aurora raised approximately $2.5
              billion in total capital, went public via SPAC in November 2021 (NASDAQ: AUR), and commercially launched
              the Aurora Driver driverless trucking service in Texas in April 2024 — hauling freight for FedEx and
              Werner Enterprises without a safety driver on the Dallas–Houston corridor. Aurora's OEM partnerships
              include PACCAR (Peterbilt and Kenworth brands) and Volvo Trucks North America, structured as technology
              licensing and integration agreements rather than equity arrangements. Aurora had approximately 1,600
              employees as of early 2025 and disclosed it was in early commercial ramp with no public per-mile pricing.

              Kodiak Robotics is the second most active direct L4 competitor. Founded by former Uber ATG and Otto
              engineers, Kodiak raised approximately $370 million in total capital, including a $250 million Series D in
              December 2023, and has accumulated hundreds of thousands of driverless miles on Texas highways. Uniquely,
              Kodiak holds US Department of Defense and US Air Force contracts for autonomous logistics vehicle
              development, providing a government revenue stream that PlusAI lacks. Kodiak has approximately 200
              employees, operates an OEM-agnostic software approach, and has not announced a commercial freight customer
              equivalent to Aurora's FedEx arrangement.

              Torc Robotics was acquired by Daimler Truck North America in 2019 and operates as a fully captive R&D unit
              developing L4 for the Freightliner Cascadia. Torc cannot license its stack outside Daimler, does not
              publish standalone financial results, and is not a direct commercial rival to PlusAI in the open market.
              However, Torc's integration precedent is material as a competitive risk: it demonstrates that OEMs are
              willing and able to vertically integrate autonomous software capabilities.

              Waabi was founded in 2021 by Raquel Urtasun (former head of AI research at Uber ATG and professor at the
              University of Toronto) and raised $83.5 million in Series A funding. Waabi's differentiation is a
              simulation-first, AI-native approach that reduces physical vehicle testing time and uses a large
              proprietary synthetic training dataset. Waabi has a signed commercial partnership with Uber Freight but
              had not achieved a fully driverless commercial deployment as of mid-2026. Gatik is commercially deployed
              in B2B middle-mile logistics (distribution center to store) with Walmart and Kroger since 2021, but its
              routes are short (15–65 miles) and constrained operational design domains that do not overlap with
              PlusAI's long-haul (300+ miles) target. Einride is an electric freight platform with a Fleet OS
              subscription model operating in the US and Europe, not a competing AV software licensor for diesel
              long-haul trucks.
