      - number: '5.3'
        title: Safety Certifications, Compliance, and Technical Risk
        blocks:
          - type: paragraph
            body: >-
              In February 2026, Plus.ai achieved four ISO certifications: ISO 9001 (quality management systems), ISO
              26262 ASIL-D (automotive functional safety at the highest integrity level), ISO 21434 (automotive
              cybersecurity engineering), and ISO 27001 (information security management). These certifications were
              prerequisite deliverables for factory integration acceptance at TRATON and International Motors and signal
              that Plus.ai's software development, validation, and quality management processes have reached automotive
              production-grade standards — a key de-risking milestone ahead of the 2027 L4 commercial launch.
              PlusDrive's ODD is explicitly limited to US interstate highways under good weather conditions; adverse
              weather (heavy fog, rain, snow) and all off-highway routes require the human safety driver to take
              control. This constraint is both a safety design choice and a strategic risk: Aurora Innovation's
              lidar-equipped Aurora Driver claims broader weather performance, and Plus.ai's no-lidar architecture means
              adverse-weather coverage is a persistent gap until further software advances or a sensor stack evolution
              are made. FMCSA filings confirm Plus.ai operates ADS-equipped vehicles on US public roads under the
              federal autonomous vehicle regulatory framework, while NHTSA FMVSS exemptions govern the deployed hardware
              components. As of April 2026, the system reports SCR (System Compliance Rate) of 90.1%, AMP (Autonomous
              Miles Percentage) of 99.2%, and RAFT (Road Autonomy Factor for Trucks) of 79% — KPIs that have improved
              meaningfully over the prior twelve months. A proposed US regulatory action targeting components sourced
              from Chinese-connected suppliers introduces residual supply chain risk; Plus.ai's camera-radar-only stack
              and the 2023 transfer of its China team to Full Truck Alliance reduces but does not fully eliminate this
              regulatory exposure, and the company has not disclosed full supplier bill-of-materials details publicly.
