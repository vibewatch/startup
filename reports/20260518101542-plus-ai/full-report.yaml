  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and National-Security Risks
        blocks:
          - type: paragraph
            body: >-
              Plus.ai operates at the intersection of federal autonomous-vehicle regulation, national-security review,
              and state-level commercial deployment law. The most fundamental regulatory risk is the absence of a
              finalized FMCSA rule authorizing unattended commercial Level 4 truck operation on US public highways. The
              DOT Federal Automated Vehicles Policy published by USDOT provides a voluntary framework but does not
              create enforceable commercial authorization; binding FMCSA rules covering vehicle standards, safety
              performance reports, and operational domain restrictions remain in proposed form as of the May 2026
              diligence date. The FMCSA's Automated Driving Systems page confirms that no final rule for fully
              autonomous commercial trucking operations at Level 4 has been issued. Any delay of six or more months
              beyond the mid-2026 expected window defers Plus.ai's 2027 commercial L4 ramp and extends the period of
              exclusively L2+ subscription revenue at a fraction of projected per-mile L4 rates. A FreightWaves analysis
              flagged the proposed China component ban and its implications for autonomous truck OEMs with
              Chinese-origin engineering as a secondary regulatory risk constraining Plus.ai's hardware supply chain.

              The national-security risk is the most legally distinct. Plus.ai was co-founded by Chinese nationals and
              historically conducted significant R&D in China before transferring those operations and associated equity
              interests to Full Truck Alliance (YMM) in 2023. That transfer was structured to reduce CFIUS exposure but
              did not eliminate it: the founders remain officers of the US entity, and CFIUS review authority extends to
              the SPAC transaction itself as a change-of-control event. The US Treasury Department's CFIUS page confirms
              that covered transactions include any transaction that could result in foreign control of a US business,
              including certain SPAC mergers involving entities with foreign beneficial owners. The TuSimple precedent —
              a Chinese-co-founded autonomous trucking company that dissolved under CFIUS pressure and an SEC
              investigation — demonstrates that the review is not merely theoretical. Bloomberg's November 2025
              investigative feature named Plus.ai alongside TuSimple in the context of Chinese-origin AV companies with
              potential national-security exposure. The S-4 registration statement, declared effective by the SEC on
              January 13 2026, discloses CFIUS as a material risk factor. A formal CFIUS investigation could require
              technology divestiture, board changes, or supply-chain separation imposing significant cost and
              operational disruption; in a worst case, CFIUS could block the transaction or impose restrictions
              equivalent to those that led to TuSimple's dissolution.

              State-level AV regulation adds compliance complexity. California DMV testing and deployment reports
              confirm that the state requires separate unattended commercial permits for autonomous heavy trucks,
              limiting Plus.ai's ability to scale driverless operations in the largest US freight market. Texas permits
              driverless operation under state AV laws, but I-35 authorization does not extend to other corridors.
              Simultaneous compliance across dozens of state jurisdictions is a material execution risk in the 2026–2027
              commercial scale-up window. NHTSA's automated vehicles safety framework imposes additional federal safety
              performance reporting obligations that add compliance overhead. Four ISO certifications (including ISO
              26262 functional safety and ISO 21434 cybersecurity) achieved in February 2026 partially mitigate the
              technology-readiness dimension but provide no binding commercial authorization from any federal or state
              regulator.
