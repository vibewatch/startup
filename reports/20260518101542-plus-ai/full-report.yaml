      - number: '1.4'
        title: Milestones, Deployments, Safety, and Scale
        blocks:
          - type: paragraph
            body: >
              PlusAI's milestone history tracks a progression from founding in 2016 through multiple commercial ADAS
              deployments, a series of OEM partnerships, and accelerating Level 4 autonomy pilots in 2025–2026.
              PlusDrive, the Level 2+ supervised highway product, has been commercially deployed in both China and the
              US, providing the company's primary near-term revenue base. In 2023, the China-based team and operations
              were transferred to Full Truck Alliance, marking a strategic pivot toward US and European
              commercialization.

              The key 2026 operational milestones include: the launch of SuperDrive 6.0 in March 2026 (featuring night
              driving, construction zone navigation, and 10X faster AI model training); the Ryder and International
              Motors fleet trial on the I-35 corridor (Laredo–Temple, Texas, 600 miles daily, 92% route autonomy
              achieved); the IVECO Level 4 Spain programme launched January 2026 (Madrid–Zaragoza 300 km corridor, two
              IVECO S-Way trucks with safety driver); and four ISO certifications (9001, 26262, 21434, 27001) obtained
              in February 2026. PlusAI also brought the NVIDIA Alpamayo foundation model to autonomous trucks in March
              2026.

              Key performance indicators as of March–April 2026: Safety Case Readiness (SCR) 90.1%, Autonomous Miles
              Percentage (AMP) 99.2%, Remote Assistance-Free Trips (RAFT) 79%. Revenue was self-reported at $47.5
              million for 2025, with 462 employees as of March 31, 2026. Management targets fully driverless
              factory-built trucks for commercial deployment in the Texas Triangle by 2027.
