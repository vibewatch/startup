  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: PlusDrive in the Fleet Operator Workflow
        blocks:
          - type: paragraph
            body: >-
              PlusDrive is Plus.ai's L2+ advanced driver-assistance system that automates highway speed-keeping, lane
              centering, following distance management, and assisted merging on defined US and European interstate
              corridors, with a human safety driver remaining in the cab for urban ingress/egress and any operation
              outside the Operational Design Domain. For a long-haul fleet operator, the value proposition is concrete:
              on a Los Angeles–Houston freight corridor where roughly 85–90% of driving miles occur on interstates,
              PlusDrive manages the truck autonomously during that portion of the run, reducing driver fatigue,
              smoothing throttle to improve fuel efficiency, and extending the effective daily driving window within HOS
              limits because the driver arrives at the urban segment less tired. OEM factory integration with TRATON
              Group (Scania, MAN) and International Motors means trucks can ship with PlusDrive hardware pre-installed
              from the production line, eliminating the retrofit friction that constrained prior-generation ADAS
              deployments. Ryder's participation in the International Motors I-35 fleet trial illustrates that large
              third-party fleet operators can integrate PlusDrive-equipped trucks into existing TMS and dispatch
              workflows without re-tooling operations. HyperFoundry extends Plus.ai's addressable market beyond trucking
              to enterprise AI customers that require automotive-grade spatial and temporal training pipelines,
              generating a recurring software licensing revenue stream that is independent of truck deployment count and
              serves as a near-term financial bridge while the company scales toward L4. The combination of OEM channel
              integration, fleet operator direct deployment, and enterprise AI platform creates three distinct customer
              motion pathways with different revenue profiles and sales cycles, which provides some protection against a
              slowdown in any single segment.
