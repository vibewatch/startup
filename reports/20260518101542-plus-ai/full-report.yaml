      - number: '1.3'
        title: Funding, Valuation, Investors, and Capital
        blocks:
          - type: paragraph
            body: >
              PlusAI has raised approximately $720 million across six or more rounds since its 2016 founding, with
              backers spanning strategic OEMs, US technology giants, and Asian financial institutions. Amazon
              participated as an early strategic investor. TRATON Group (parent of Scania, MAN, and International
              Motors) became a cornerstone OEM investor and partner. Other disclosed investors include FountainVest
              Partners, ClearVue Partners, GTJAI, Hyundai Motor Company, Millennium Technology Value Partners, and SAIC
              Capital.

              The proposed merger with Churchill Capital Corp IX, announced June 2025 at a $1.2 billion pre-money equity
              valuation, provides up to $300 million in gross proceeds and is intended to fund operations through the
              2027 commercial launch. The SEC declared the S-4 effective on January 12, 2026, and a Churchill
              shareholder vote was scheduled for February 3, 2026. The SPAC transaction implies a significant valuation
              compression from the approximately $8 billion private-market peak reportedly achieved in 2021 — a roughly
              85 percent decline that reflects both broader sector repricing of autonomous vehicle timelines and the
              public market's stricter scrutiny of pre-revenue AV companies.

              The expanded TRATON partnership announced January 26, 2026 includes up to $25 million in R&D funding for
              SuperDrive factory integration across Scania, MAN, and International brands, plus revenue-linked equity
              warrants and a board seat for TRATON. This structure aligns OEM and shareholder incentives but also
              creates potential for concentration risk if TRATON's commercialization commitment weakens.
