      - number: '6.3'
        title: Retention, Expansion Signals, and Churn Risks
        blocks:
          - type: paragraph
            body: >-
              The TRATON relationship is the only customer with high-confidence retention and expansion signals. The
              January 2026 partnership expansion press release — issued jointly by TRATON and Plus.ai — uses explicit
              "expansion" language, confirms continued factory integration roadmap for both European and US OEM brands,
              and follows the October 2024 global L4 software release milestone. TRATON's equity stake and board seat
              create structural alignment incentives that make unilateral exit costly: TRATON would lose its technology
              access and board influence while Plus.ai would lose its primary commercial channel, making this a deeply
              co-dependent relationship rather than a simple vendor contract.

              For International Motors, the October 2025 integration announcement confirming NVIDIA DRIVE AGX Hyperion
              platform adoption and the March 2026 I-35 fleet trial both signal active continued investment. However,
              International operates under TRATON ownership, meaning TRATON's strategic commitment largely anchors
              International's retention as well — compounding the concentration risk rather than diversifying it.
              IVECO's programme, launched only in January 2026, has no renewal data yet but represents a newly initiated
              commitment from an OEM not yet tested for durability. Ryder's fleet trial is ongoing but has no formal
              commercial commitment or pricing arrangement publicly disclosed.

              On the adverse side, the two most concerning signals are Werner's migration to Aurora and Schneider's
              three-year silence. Werner Enterprises was an announced PlusDrive pilot customer in 2021 and is now a
              confirmed Aurora Innovation L4 launch customer — the clearest customer-level evidence that Plus.ai can
              lose fleet operators to competitors during extended pre-commercial phases. Schneider National shows no
              evidence of renewal, expansion, or cancellation and must be treated as a stalled relationship pending
              clarification. No fleet operator has publicly announced any intention to upgrade from PlusDrive L2+ to
              SuperDrive L4 driverless operations, which is the critical commercial conversion event that Plus.ai
              targets for 2027.
