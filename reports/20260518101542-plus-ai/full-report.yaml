  - id: FV005
    slug: dilution-waterfall
    title: Post-SPAC Equity Dilution Waterfall
    type: flow
    insight: >-
      SPAC sponsor promote and TRATON warrants represent the two largest uncontrolled dilution vectors for public
      investors; the combined dilution could reduce effective public ownership by 30–40% in a high-sponsor-promote
      scenario, making entry price discipline critical.
    data:
      nodes:
        - id: d1
          label: Pre-SPAC Equity (Founders + Institutional Investors)
          description: Founders ~30%, TRATON ~15%, FountainVest/ClearVue ~10%, Amazon ~5% — estimated pre-merger
        - id: d2
          label: SPAC Shares (Churchill IX Trust)
          description: Trust shares converted at $10/share; net count depends on redemption rate at Feb 3 vote
        - id: d3
          label: SPAC Sponsor Promote + Warrants
          description: ~20% promote in low-redemption scenario; warrants on top; 12-month lockup post-close
        - id: d4
          label: TRATON Equity Warrants
          description: Exercise price and count not disclosed; potentially material dilution if stock appreciates
        - id: d5
          label: PIPE Investors (if any)
          description: Any PIPE commitments likely at discount; terms not publicly disclosed in S-4 summary
        - id: d6
          label: Public Float (Post-Merger Common Stock)
          description: Net shares available to public after promote, TRATON warrants, and PIPE allocations
      edges:
        - from: d1
          to: d6
          label: Converts to common at merger close
        - from: d2
          to: d6
          label: Net non-redeemed trust shares become public float
        - from: d3
          to: d6
          label: Promote dilutes common; warrants are additional overhang
        - from: d4
          to: d6
          label: Warrant exercise dilutes all common post-close
        - from: d5
          to: d6
          label: PIPE shares priced below SPAC; immediate dilution
    sourceRefs:
      - SV001
      - SV002
      - SV015
      - SV023
    claimRefs:
