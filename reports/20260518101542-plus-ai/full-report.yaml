  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition, Boundary, and Substitutes
        blocks:
          - type: paragraph
            body: >
              The market most relevant to PlusAI's software business is the commercial autonomous driving software and
              systems market for long-haul Class 8 trucks operating in North America and Europe. This market is distinct
              from but adjacent to three broader contexts: (1) the full US commercial trucking industry (roughly $900
              billion in annual freight revenues, including all modes and distances), (2) the global autonomous vehicle
              software market spanning all vehicle categories, and (3) the advanced driver-assistance systems (ADAS)
              market for trucks, which includes Level 1–3 products already deployed at scale by Delphi, Mobileye, and
              others.

              Within the autonomous truck market, the relevant spend boundary for PlusAI includes: software licensing
              fees, integration services for OEM factory build-in, and ancillary AI infrastructure revenues
              (HyperFoundry). Excluded spend includes: truck hardware (Class 8 vehicles, sensors, compute modules),
              fleet telematics subscriptions, ELD compliance software, freight brokerage platforms, and all
              human-driver-operated freight services.

              The status-quo substitute for an L4 autonomous truck software subscription is a human Class A CDL driver
              costing $65,000–$100,000 per year including salary and benefits. The second substitute is SAE Level 2+
              driver-assistance systems such as PlusAI's own PlusDrive product, which reduces accidents and improves
              fuel efficiency but still requires a human driver. The third substitute is a wait-and-see posture by fleet
              operators that preserves optionality while the regulatory framework matures.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
