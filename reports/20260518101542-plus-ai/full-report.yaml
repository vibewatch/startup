      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The autonomous truck software market has a two-sided structure that distinguishes it from direct-to-fleet
              software sales. PlusAI's chosen go-to-market is OEM-centric: the buyer of SuperDrive software capability
              is the Original Equipment Manufacturer (TRATON, IVECO, International Motors), who integrates it into
              factory-built trucks and prices it into the truck's total cost of ownership. The end user and payer is the
              fleet operator who purchases or leases the OEM-equipped truck. This structure creates important commercial
              dynamics: OEMs serve as gatekeepers who validate the technology at scale before fleet operators commit,
              and competitive differentiation for AV stack vendors shifts toward OEM design-wins rather than direct
              fleet customer acquisition.

              The primary fleet operator segments targeted in PlusAI's initial SAM are: (1) Large truckload (TL)
              carriers operating Class 8 long-haul fleets with 1,000+ trucks on defined lane networks — companies like
              J.B. Hunt, Werner Enterprises, Knight-Swift, and Schneider National collectively operate roughly 400,000
              trucks; and (2) Captive private fleets operated by large shippers such as Amazon Logistics, Walmart, and
              Sysco, which prioritize consistency of cost and delivery performance over price optimization.

              Aurora Innovation's commercial launch in April 2024 on the Texas corridor established that large TL
              carriers (including Werner) will sign commercial contracts for driverless freight when the safety case is
              validated. Ryder's January 2026 fleet trial partnership with PlusAI on I-35 confirms that a third-party
              logistics provider is also a credible early payer. The adoption trigger for most large fleets is a
              regulatory green light from FMCSA combined with demonstrated unit economics showing fully-loaded
              break-even within 24 months of deployment.
