      - number: '3.3'
        title: Capability Comparison, Pricing, and Positioning
        blocks:
          - type: paragraph
            body: >
              Across the five primary buying criteria for fleet operators evaluating autonomous trucking systems — (1)
              driverless commercial deployment status, (2) OEM integration depth, (3) ISO 26262 functional safety
              certification, (4) a transition path from supervised to driverless, and (5) operating economics — PlusAI
              leads on OEM depth and certification but trails Aurora on deployment status by approximately three years.

              Aurora is the only competitor with a fully driverless commercial service as of mid-2026. PlusAI and Kodiak
              operate supervised trials with safety drivers; Torc/DTNA and Waabi remain in development; Gatik is
              deployed only in short constrained routes. PlusAI is the only autonomous trucking company with both a
              supervised L2+ commercial product generating current revenue (PlusDrive at $47.5M in 2025) and a
              development-stage L4 product (SuperDrive 6.0, targeting 2027), giving it a two-product revenue ladder that
              no competitor has replicated.

              Published pricing is limited: Aurora has not disclosed per-mile or per-truck pricing for the Aurora Driver
              commercial service; industry estimates suggest early commercial rates are at single-digit cents per mile,
              prioritizing reliability demonstration over margin. PlusAI's PlusDrive is reported at approximately $5,000
              per-truck hardware plus monthly software subscription; SuperDrive pricing is not yet disclosed. Kodiak's
              DoD contract rates are classified. The absence of public pricing from Aurora and Kodiak limits
              peer-to-peer economic benchmarking for fleet operators evaluating alternatives.

              Multi-vendor fleet deployments are structurally incentivized: FedEx, Werner, and Schneider operate
              parallel vendor trials specifically to avoid single-vendor dependency, reducing winner-takes-all dynamics
              in the near-to-medium term. Once a fleet deploys at commercial scale with a specific AV software platform,
              switching costs are high: OEM hardware integration, driver retraining, data and mapping infrastructure,
              and maintenance workflow changes create significant inertia.
