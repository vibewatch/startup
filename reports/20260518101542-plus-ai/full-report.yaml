              with IVECO and Ryder adding diversification at the margin but not materially reducing the
              Volkswagen/TRATON dependency.

              Bloomberg's November 2025 investigative piece raised national security concerns around Plus.ai's Chinese
              origins, potential CFIUS exposure, and supply chain dependencies — risks that could restrict the company's
              ability to win US government-adjacent fleet customers (USPS, military logistics, defense-contracted
              carriers) and could complicate OEM relationships with EU-regulated truck buyers requiring supply chain
              transparency. Plus.ai's S-4 does not disclose revenue segmentation by customer or OEM partner, preventing
              independent verification of concentration levels and making diligence on TRATON dependency dependent on
              analytic inference rather than disclosed data.

              The Werner churn to Aurora, the Schneider pilot stagnation, and the complete absence of named HyperFoundry
              enterprise customers collectively create a pattern in which Plus.ai's publicly confirmed commercial
              evidence is narrower than its fundraising narrative suggests. While OEM press releases and the I-35 trial
              represent legitimate commercial milestones, Plus.ai lacks the voice-of-customer evidence (no NPS data, no
              G2/Gartner reviews, no customer outcome case studies) that would establish independent proof of economic
