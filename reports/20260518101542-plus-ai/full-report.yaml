      - number: '4.4'
        title: Capital Adequacy and Financial Risk Assessment
        blocks:
          - type: paragraph
            body: >-
              PlusAI's capital adequacy position entering 2026 is materially constrained relative to its primary
              competitor Aurora Innovation. Aurora, as a publicly traded company (NASDAQ: AUR), has raised approximately
              $2.5 billion in total capital and has access to continuous public market equity raises. PlusAI's $720
              million in total historical funding represents a 3.5× capital deficit versus Aurora, with the gap directly
              translating to fewer resources for safety fleet expansion, regulatory engagement, and software R&D.


              The primary near-term financial risk is SPAC shareholder redemption. If a large proportion of Churchill
              Capital Corp IX SPAC shareholders elect to redeem their shares at the trust value rather than roll into
              PlusAI common stock, the net cash proceeds to PlusAI could be significantly below the headline transaction
              value, forcing the company to raise additional capital through a concurrent PIPE or secondary offering. As
              of the May 2026 diligence date, redemption levels have not been publicly disclosed.


              Secondary financial risks include: (1) TRATON equity warrant dilution, which represents a contingent
              equity claim that could dilute common shareholders if TRATON exercises its warrants at a price below the
              SPAC transaction value; (2) dependence on a small number of large OEM contracts for a substantial portion
              of near-term revenue, creating customer concentration risk; and (3) the risk that SuperDrive
              commercialization is delayed beyond 2027, extending the pre-profitability burn period and potentially
              requiring another capital raise in 2027–2028.
