      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              Third-party market sizing estimates for the autonomous truck market vary by a factor of four or more
              depending on geographic scope, technology layer, and year horizon, reflecting genuine disagreement about
              the pace of commercialization rather than methodological error alone. The estimates most cited for 2026
              cluster around $35 billion (Mordor Intelligence) to $47 billion (Global Market Insights) for the global
              autonomous commercial truck market, but these figures blend hardware (compute modules, LiDAR, radar) with
              software licensing, making them misleading for a pure-play software vendor like PlusAI.

              A more useful sizing for PlusAI is a bottom-up SAM estimate anchored to the US long-haul trucking
              corridors where regulatory and commercial deployment is most feasible in the 2026–2030 window. The
              American Trucking Associations estimates approximately 300 billion truck-miles driven annually in the US.
              Long-haul routes exceeding 500 miles represent approximately 25–30% of that mileage, or roughly 75–90
              billion miles per year, concentrated on the I-10, I-35, and I-80 corridors. At per-mile software pricing
              of $0.05–$0.20 per mile (industry consensus range cited by multiple analysts), the US long-haul L4
              software SAM is approximately $3.8–$18 billion annually at full penetration, or $3.5–$5.0 billion on a
              more conservative near-term addressable basis.

              PlusAI's SOM for the 2026–2028 period is limited by: (a) fleet trials still in pre-commercial phase, (b)
              FMCSA regulatory approval outstanding for driverless operation, (c) OEM manufacturing ramp dependent on
              SuperDrive 6.0 factory integration milestones, and (d) capital availability. Based on TRATON brand volumes
              (approximately 100,000 Class 8 units per year across Scania, MAN, and International) and a realistic 1–3%
              capture rate in the initial deployment phase, PlusAI's SOM through 2028 is in the range of $50–$200
              million annually — consistent with management's $25 million contracted HyperFoundry pipeline and $47.5
              million 2025 PlusDrive revenue.
