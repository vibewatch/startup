  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Structure
        blocks:
          - type: paragraph
            body: >
              The SAE Level 4 autonomous long-haul trucking software market is concentrated: as of mid-2026, only four
              to five companies are credibly pursuing commercial driverless long-haul trucking in the US and Europe at
              meaningful scale. Aurora Innovation (NASDAQ: AUR) has the greatest lead, having commercially launched a
              driverless trucking service in Texas in April 2024 with FedEx and Werner Enterprises as paying customers.
              Kodiak Robotics is in supervised driverless testing on Texas highways and also holds US DoD contracts.
              Torc Robotics has been vertically integrated into Daimler Truck North America since 2019 and develops
              exclusively for the Freightliner Cascadia platform. Waabi is at an earlier stage, pursuing a
              simulation-first AI approach through an Uber Freight partnership. Gatik is commercially deployed but in a
              different segment — B2B middle-mile short-haul routes under 65 miles — that does not compete with PlusAI's
              long-haul OTR target.

              The status-quo competitive alternative to autonomous truck software remains human CDL drivers, which cost
              fleets $65,000–$100,000 per year in total compensation. SAE Level 2+ driver-assistance systems from PlusAI
              (PlusDrive), Delphi, Mobileye, and others represent an intermediate substitute. Notable failures — Embark
              Trucks (dissolved February 2023 after burning SPAC capital) and TuSimple (forced US market exit under
              CFIUS national security review in 2023) — have reduced the competitive field but set cautionary
              precedents. The competitive field is not winner-takes-all in the near term: large fleet operators such as
              FedEx, Werner, and Schneider are running parallel vendor trials specifically to avoid single-vendor
              dependency.
