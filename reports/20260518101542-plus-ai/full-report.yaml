  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Named Customer Relationships and Deal Structure
        blocks:
          - type: paragraph
            body: >-
              Plus.ai's named commercial relationships fall into three tiers as of May 2026. The first and dominant tier
              is TRATON Group — the Volkswagen-owned truck OEM holding company that includes Scania, MAN, and
              International Motors — which holds equity in Plus.ai, a board seat, and a multi-year R&D license agreement
              committing $25M in contracted research funding. The TRATON partnership was first announced in 2021 and
              formally expanded in October 2024 and again in January 2026, with joint press releases from both TRATON
              and Plus.ai confirming factory integration progress for both European (Scania, MAN) and North American
              (International) truck brands. The depth and structural nature of this relationship — equity, governance,
              and factory integration — distinguishes TRATON as a strategic partner rather than a conventional customer.

              The second tier consists of International Motors (a TRATON brand) and Ryder System, which jointly launched
              a Level 4 autonomous fleet trial on the I-35 freight corridor in March 2026. This trial uses International
              LT Series trucks factory-equipped with Plus.ai's SuperDrive software and is operated by Ryder as a fleet
              partner, representing the most commercially advanced customer proof event in Plus.ai's history. IVECO
              Group, a European OEM, launched a Level 4 autonomous driving programme with Plus.ai in Spain in January
              2026, confirmed by IVECO's own corporate press release and Plus.ai's announcement — adding a third OEM
              family to the customer base and geographic reach into Southern Europe.

              The third tier, and a material concern, consists of Schneider National and Werner Enterprises, two large
              US carriers that piloted PlusDrive deployments in 2021–2022 but have issued no public updates since.
              Werner Enterprises has since been publicly confirmed as a launch customer for Aurora Innovation's
              competing Level 4 driverless service in Texas — constituting direct evidence of competitive churn away
              from Plus.ai. Schneider's silence for over three years suggests the relationship is stalled or
              deprioritized. HyperFoundry, Plus.ai's AI platform business, has no publicly named enterprise customers
              despite management disclosure of a $25M contracted pipeline at the January 2026 analyst day.
