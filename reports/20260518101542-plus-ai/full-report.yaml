      - number: '8.2'
        title: Comparable Company Multiples and SPAC Pricing Context
        blocks:
          - type: paragraph
            body: >-
              At $1.2B pre-money valuation against $47.5M in 2025 PlusDrive revenue, Plus.ai implies approximately 25×
              EV/ Revenue — a multiple that sits well below Aurora Innovation's implied multiple but significantly above
              Mobileye's mature ADAS comps. The peer set must be calibrated carefully by stage, revenue type, and
              technology tier to avoid misleading cross-comparisons.

              Aurora Innovation (NASDAQ: AUR), the closest direct comp as a US-listed L4 autonomous trucking company,
              trades at approximately $2.5B market cap against minimal disclosed revenue, implying a notional EV/Revenue
              multiple of 250× or greater — though Aurora's commercial launch in April 2024 means revenue is just
              beginning to ramp and any near-term EV/Revenue ratio is not meaningful as a valuation anchor. Mobileye
              (NASDAQ: MBLY) trades at approximately $12B market cap against ~$2B in mature ADAS product revenue (6×
              multiple), representing the far-end of the maturity spectrum that Plus.ai would approach only after a
              successful L4 commercial scale-up. Waymo, private and Alphabet-backed at an estimated $45B, has minimal
              commercial revenue and is effectively valued on long-term option value — not comparable to Plus.ai's SPAC
              structure.

              TuSimple (dissolved 2024) is the most important adverse comp: it entered the public market via SPAC in
              2021 at ~$8B, collapsed under CFIUS and governance investigations, ultimately winding down with near-total
              value destruction. TuSimple's trajectory is the single most applicable cautionary precedent given
              Plus.ai's Chinese- origin founding, prior FTA equity relationship, and ongoing CFIUS uncertainty. The
              $1.2B Plus.ai entry price implicitly discounts the TuSimple scenario but does not price it out.

              Kodiak Robotics (private, ~$1B estimated) is a closer stage comparable as a pre-commercial L4 trucking
              company without disclosed revenue — suggesting the market currently values pre-commercial L4 trucking
              entrants at $500M–$1.5B, consistent with Plus.ai's SPAC pricing. The SPAC AV trucking cohort (Embark,
              TuSimple, Locomation) saw average valuation declines of 70–95% from 2021 peak, structurally re-rating the
              asset class and making Plus. ai's $1.2B entry more defensible than a comparison to the 2021 cohort would
              suggest. At 25× revenue with disclosed OEM anchor, active fleet trial, and HyperFoundry diversification,
              the SPAC price is aggressive but not obviously indefensible relative to pre-L4 stage peers.
