companyProfile:
  summary: Plus.ai (PlusAI) is a Cupertino-based autonomous trucking company founded in 2016 by Stanford PhD graduates. It commercializes PlusDrive, a camera-and-radar L2+ ADAS system deployed on OEM trucks via TRATON (Scania, MAN) and International Motors, alongside HyperFoundry, its emerging L4 enterprise platform built on NVIDIA Drive Thor. PlusAI is pursuing a SPAC listing on NYSE via Churchill Capital Corp IX at a $1.2B pre-money valuation, with an S-4 declared effective January 12, 2026.
