  - id: section-growth-drivers
    title: Growth Drivers and Adoption Constraints
    body: >
      The strongest structural driver of autonomous truck adoption is the persistent US driver
      shortage. The American Trucking Associations estimates the industry was short more than
      80,000 drivers in 2024, with the gap projected to exceed 160,000 by 2031 as the existing
      driver workforce ages and fewer younger workers enter the profession. This shortage
      directly raises fleet operating costs — driver wages reached an average of $72,000–$85,000
      in 2024 — and impairs carrier capacity utilization.

      The second driver is operating economics. Human drivers are constrained by FMCSA Hours
      of Service regulations to approximately 11 hours of driving per 14-hour window, with
      mandatory rest creating practical daily mileage limits of 550–600 miles. An autonomous
      truck with a remote monitoring capability can theoretically operate 20–22 hours per day
      on well-mapped corridors, yielding 1,100–1,400 miles per day and approximately 50–70%
      improved asset utilization. Multiple industry analyses estimate per-mile cost savings of
      $0.17–$0.45 after accounting for AV technology fees, reduced insurance costs, and
      fuel efficiency gains.

      The primary adoption constraint is regulatory. The Federal Motor Carrier Safety
      Administration has not published final rules allowing commercial driverless operation of
      Class 8 trucks without a safety driver; as of May 2026, FMCSA's most recent guidance
      document under the Automated Vehicle 4.0 policy framework remains non-binding, and
      state-by-state regulation (Texas, Arizona, and Florida are most permissive) creates a
      patchwork that complicates commercial scale-up. A second constraint is organized labor
      opposition: the International Brotherhood of Teamsters and OOIDA have publicly opposed
      autonomous commercial vehicles and have signaled legislative advocacy to require human
      operators. A third constraint is capital intensity: retrofitting or replacing existing
      fleets with AV-capable trucks requires large upfront investment, and most carriers
      operate on 3–4% operating margins that limit appetite for unproven technology bets.
    claimRefs:
