chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The global autonomous truck software market is a nascent but high-conviction
    sector measured across wildly divergent estimates ($35B–$47B in 2026 depending on
    definition) converging on a 14–27% CAGR through 2034. PlusAI's serviceable addressable
    market — L4 software licensing for long-haul OEM-integrated trucks in North America
    and Europe — is more constrained and best sized at $3.5–$5.0B for 2026 with penetration
    potential still sub-1% today. Growth will be driven by a structural driver shortage
    (80,000+ unfilled US positions in 2024), operating cost economics ($0.17–0.45/mile
    savings vs human driver), and OEM integration pathway economics. The critical adoption
    constraint is regulatory: FMCSA has not finalized driverless commercial truck rules,
    making 2027–2028 the earliest realistic unrestricted deployment window for most corridors.

sections:
  - id: section-market-definition
    title: Market Definition, Boundary, and Substitutes
    body: >
      The market most relevant to PlusAI's software business is the commercial autonomous
      driving software and systems market for long-haul Class 8 trucks operating in North
      America and Europe. This market is distinct from but adjacent to three broader
      contexts: (1) the full US commercial trucking industry (roughly $900 billion in annual
      freight revenues, including all modes and distances), (2) the global autonomous vehicle
      software market spanning all vehicle categories, and (3) the advanced driver-assistance
      systems (ADAS) market for trucks, which includes Level 1–3 products already
      deployed at scale by Delphi, Mobileye, and others.

      Within the autonomous truck market, the relevant spend boundary for PlusAI includes:
      software licensing fees, integration services for OEM factory build-in, and ancillary
      AI infrastructure revenues (HyperFoundry). Excluded spend includes: truck hardware
      (Class 8 vehicles, sensors, compute modules), fleet telematics subscriptions, ELD
      compliance software, freight brokerage platforms, and all human-driver-operated
      freight services.

      The status-quo substitute for an L4 autonomous truck software subscription is a
      human Class A CDL driver costing $65,000–$100,000 per year including salary and
      benefits. The second substitute is SAE Level 2+ driver-assistance systems such as
      PlusAI's own PlusDrive product, which reduces accidents and improves fuel efficiency
      but still requires a human driver. The third substitute is a wait-and-see posture by
      fleet operators that preserves optionality while the regulatory framework matures.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
    tableRefs:
      - TM001

  - id: section-market-sizing
    title: Market Sizing — TAM, SAM, and SOM
    body: >
      Third-party market sizing estimates for the autonomous truck market vary by a factor
      of four or more depending on geographic scope, technology layer, and year horizon,
      reflecting genuine disagreement about the pace of commercialization rather than
      methodological error alone. The estimates most cited for 2026 cluster around $35
      billion (Mordor Intelligence) to $47 billion (Global Market Insights) for the global
      autonomous commercial truck market, but these figures blend hardware (compute modules,
      LiDAR, radar) with software licensing, making them misleading for a pure-play software
      vendor like PlusAI.

      A more useful sizing for PlusAI is a bottom-up SAM estimate anchored to the US long-haul
      trucking corridors where regulatory and commercial deployment is most feasible in
      the 2026–2030 window. The American Trucking Associations estimates approximately 300
      billion truck-miles driven annually in the US. Long-haul routes exceeding 500 miles
      represent approximately 25–30% of that mileage, or roughly 75–90 billion miles per year,
      concentrated on the I-10, I-35, and I-80 corridors. At per-mile software pricing of
      $0.05–$0.20 per mile (industry consensus range cited by multiple analysts), the US
      long-haul L4 software SAM is approximately $3.8–$18 billion annually at full penetration,
      or $3.5–$5.0 billion on a more conservative near-term addressable basis.

      PlusAI's SOM for the 2026–2028 period is limited by: (a) fleet trials still in pre-commercial
      phase, (b) FMCSA regulatory approval outstanding for driverless operation, (c) OEM
      manufacturing ramp dependent on SuperDrive 6.0 factory integration milestones, and
      (d) capital availability. Based on TRATON brand volumes (approximately 100,000 Class 8
      units per year across Scania, MAN, and International) and a realistic 1–3% capture rate
      in the initial deployment phase, PlusAI's SOM through 2028 is in the range of $50–$200
      million annually — consistent with management's $25 million contracted HyperFoundry
      pipeline and $47.5 million 2025 PlusDrive revenue.
    claimRefs:
      - CM007
      - CM008
      - CM009
      - CM010
