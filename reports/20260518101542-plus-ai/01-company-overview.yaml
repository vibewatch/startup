company:
  name: Plus.ai
chapter:
  number: 1
  title: Company Overview
  summary: >-
    PlusAI is a Cupertino-based autonomous trucking software company that has progressed
    from a 2016 Stanford-origin research project to a pre-public-market L4 AV stack vendor
    with OEM integration across TRATON, IVECO, and International Motors. A June 2025 SPAC
    merger with Churchill Capital Corp IX — valued at $1.2 billion pre-money — is tracking
    toward a 2026 Nasdaq listing under ticker "PLS," while the company targets 2027 for
    factory-built driverless truck commercialization. The $1.2 billion SPAC valuation
    represents a steep decline from a reported $8 billion private peak in 2021, a gap that
    demands careful diligence on commercialization milestones and capital discipline.
sections:
  - id: section-identity
    title: Identity, Business Model, and Strategic Context
    body: >
      PlusAI (operating as Plus.ai) is a Physical AI company that develops virtual driver
      software for factory-built autonomous commercial trucks. Founded in 2016 in Cupertino,
      California by a team of Stanford PhD graduates, the company has evolved from a
      research-stage autonomous driving lab into a pre-commercial AV stack provider with
      OEM integration agreements covering North America, Europe, and Asia. The company's
      website describes its mission as providing trucks with the intelligence to safely and
      efficiently navigate the world, with a capital-light software-licensing approach
      targeting per-mile recurring revenue rather than fleet ownership.

      The product portfolio spans four major offerings: SuperDrive (SAE Level 4 full
      self-driving software), PlusDrive (SAE Level 2+ supervised highway autonomy already
      deployed commercially), HyperFoundry (an AI data and model development platform
      available to both internal use and external clients), and safety and vision systems
      (PlusProtect and PlusVision). The business model is OEM-centric: PlusAI embeds its
      SuperDrive software stack into factory trucks assembled by Tier-1 OEM partners rather
      than retrofitting existing trucks, positioning itself as a software licensor to OEMs
      who then sell or lease trucks to fleet operators.

      As of May 2026 the company is in a pre-revenue autonomous mode: PlusDrive generates
      revenues through fleet deployments at SAE Level 2+, while SuperDrive commercial
      deployment is targeted for 2027. The HyperFoundry AI platform is also beginning to
      generate third-party revenue from automotive, defense, and robotics clients, with
      $25M in contracted pipeline reported by management at the April 2026 business update
      call. PlusAI's S-4 registration statement was declared effective by the SEC on
      January 12, 2026, setting a February 3, 2026 shareholder vote for the Churchill
      Capital Corp IX merger, which would result in a Nasdaq listing under ticker "PLS."
