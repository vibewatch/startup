callouts:
  - calloutType: strength
    title: Factory-First OEM Integration Moat
    body: >-
      PlusAI's strategy of embedding SuperDrive into factory trucks at the OEM production
      line — rather than retrofitting fleets — creates a defensible integration moat.
      TRATON's $25M R&D commitment and board seat represent deep alignment between OEM
      and AV stack vendor, reducing the risk of competitive displacement before commercial
      scale.
    claimRefs:
      - CO029
      - CO033
  - calloutType: risk
    title: $8B to $1.2B Valuation Compression
    body: >-
      The SPAC valuation of $1.2 billion pre-money represents an approximately 85 percent
      decline from the reported $8 billion private-market peak in 2021. This compression
      reflects sector-wide repricing of pre-revenue AV timelines and puts significant
      pressure on PlusAI to hit 2027 commercialization milestones. Any slip increases risk
      of dilutive re-financing or loss of investor confidence post-listing.
    claimRefs:
      - CO026
