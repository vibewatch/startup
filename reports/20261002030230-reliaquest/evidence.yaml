evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete cap table, board roster, voting rights, investor protective provisions, and founder-control terms.
    whyItMatters: These rights determine effective control, downside protection, dilution, and exit flexibility.
    diligencePath: >-
      Review the capitalization table, charter, investor-rights agreements, board minutes, and latest financing
      documents in the data room.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited accounting revenue, gross margin, NRR, churn, customer concentration, cash balance, debt, and
      credit-facility terms.
    whyItMatters: >-
      ARR, growth, and operating-profitability labels cannot establish revenue quality, cash generation, liquidity, or
      leverage.
    diligencePath: >-
      Obtain audited financial statements, ARR-to-revenue reconciliation, cohort retention schedules, customer
      concentration, cash statements, and all debt documents.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-record
    missingEvidence: Relevant independent legal, regulatory, outage, breach, complaint, or litigation evidence for ReliaQuest.
    whyItMatters: >-
      The assigned adverse query returned no retained company-relevant source, so the chapter cannot establish either
      the presence or absence of material incidents.
    diligencePath: >-
      Run entity-specific court, regulator, state attorney-general, outage, and breach-database checks in the
      report-level risk workstream.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current independent market study aligned to enterprise security-operations orchestration and MDR, with
      geography, segment definitions, spend, and forecast methodology.
    whyItMatters: >-
      Without an aligned denominator, the historical MSSP estimate, engagement share, and customer count cannot
      establish TAM, SAM, SOM, or valuation upside.
    diligencePath: >-
      Obtain current Gartner, IDC, Forrester, or equivalent category data and reconcile its taxonomy to GreyMatter's
      included and excluded spend.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Customer-level ACV, segment mix, retention, expansion, sales-cycle, discounting, implementation cost, and regional
      revenue data.
    whyItMatters: >-
      These inputs determine serviceable and obtainable spend, procurement friction, and whether the observed installed
      base can support premium valuation.
    diligencePath: >-
      Review anonymized contracts, cohort retention, pipeline conversion, win-loss, pricing, and revenue-by-segment
      schedules in the data room.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: >-
      Audited financial statements detailing GAAP gross margin, recurring software subscription margin vs SOC delivery
      margin, and Net Revenue Retention (NRR).
    whyItMatters: >-
      Without verified gross margins, underwriters cannot confirm whether agentic AI automation is expanding
      software-like margins or if co-managed SOC staffing creates margin drag.
    diligencePath: >-
      Request audited financial statements, GAAP reconciliation schedules, and cohort retention tables in the
      confidential management data room.
    relatedQuestionRefs:
      - QI003
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: >-
      A dated product roadmap, release history, or changelog tying planned and shipped capabilities to specific
      versions.
    whyItMatters: >-
      Without release chronology, current availability cannot be separated from marketing direction or future
      capability.
    diligencePath: Request the prior 12 months of release notes, the next 12-month roadmap, and customer entitlement mapping by SKU.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: trust-and-compliance
    missingEvidence: >-
      Current control certifications, penetration-test scope, privacy and tenancy architecture, incident history,
      service levels, and model-safety evaluation results.
    whyItMatters: >-
      GreyMatter can ingest sensitive telemetry and execute response actions, making control design and reliability
      central to deployment risk.
    diligencePath: >-
      Review the trust package, SOC 2 report, certification registry entries, data-flow diagrams, status history,
      subprocessors, and AI control testing under NDA.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: performance-validation
    missingEvidence: >-
      Samples, periods, denominators, control groups, distributions, and calculation methods for containment,
      analyst-time, processing-speed, and accuracy claims.
    whyItMatters: Point estimates cannot be compared or generalized without knowing the measured population and test conditions.
    diligencePath: >-
      Recompute each metric from customer-level event logs in a controlled proof of value and inspect median,
      percentile, and false-action results.
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      A company-maintained public repository, API changelog, SDK package, contributor history, or practitioner-community
      usage metric.
    whyItMatters: >-
      One employee's personal open-source activity does not establish an extensible or independently adopted developer
      ecosystem.
    diligencePath: >-
      Request public or private API documentation, release cadence, SDK ownership, integration-partner references, and
      package or repository activity.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-nrr
    missingEvidence: Audited cohort net revenue retention (NRR) data and top-10 customer revenue concentration percentages.
    whyItMatters: >-
      Without cohort expansion metrics and concentration figures, diligence cannot confirm whether top enterprise logos
      carry disproportional revenue risk or if growth relies primarily on new logo acquisition.
    diligencePath: Request confidential data room customer concentration schedule and gross/net retention waterfall by annual cohort.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: Granular deployment timelines and contractual ACV tiers for named customers Lowe's, Signify, and Syniverse.
    whyItMatters: >-
      Public case studies highlight operational telemetry improvements but omit pricing, module attachments, and
      contract length.
    diligencePath: Review vendor customer reference calls and enterprise order forms during private data room diligence.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: litigation-and-regulatory
    missingEvidence: >-
      Comprehensive docket search of state and federal court litigation filings, EEOC disputes, or regulatory
      enforcement inquiries involving ReliaQuest.
    whyItMatters: >-
      Public web search records do not reveal active commercial lawsuits or customer breach claims, but confidential
      arbitration or sealed disputes cannot be ruled out without PACER review.
    diligencePath: >-
      Request legal disclosure schedule and litigation docket review in data room covering active customer disputes and
      arbitration proceedings.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: capitalization-and-preferences
    missingEvidence: >-
      Fully diluted ownership, security class, liquidation preferences, participation rights, anti-dilution terms, debt,
      and investor-control provisions for the latest financing.
    whyItMatters: Headline valuation does not determine investor proceeds when senior rights, dilution, and ownership are unknown.
    diligencePath: >-
      Review the current charter, capitalization table, investor-rights agreements, financing documents, debt schedule,
      and a proceeds waterfall at multiple exit values.
    relatedQuestionRefs:
      - QV005
  - type: private-evidence-only
    severity: material
    topic: return-and-exit
    missingEvidence: >-
      Executable entry price, ownership percentage, audited operating plan, exit alternatives, expected timing, and
      proceeds waterfall needed to set a target return and hold period.
    whyItMatters: >-
      A return cannot be calculated from a historical headline valuation without entry security, dilution, cash-flow,
      and exit assumptions.
    diligencePath: >-
      Obtain a binding term sheet and audited forecast, then model security-level proceeds under strategic sale, IPO,
      secondary, and downside cases.
    relatedQuestionRefs:
      - QV010
  - type: conflicting-data
    severity: material
    topic: valuation-denominator
    missingEvidence: >-
      Audited definitions and reconciliations for ARR, recognized revenue, recurring revenue, growth, gross margin,
      retention, and cash profitability.
    whyItMatters: >-
      The retained sources use ARR and revenue inconsistently, so the reported 11.3x multiple is not an independently
      comparable underwriting denominator.
    diligencePath: >-
      Reconcile audited financial statements to subscription schedules, ARR bridges, cohort retention, gross margin, and
      cash-flow statements.
    relatedQuestionRefs:
      - QV003
