slug: reliaquest
runDate: 2026-10-02
company:
  name: ReliaQuest
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    GreyMatter is positioned as an overlay for heterogeneous security stacks: it normalizes
    telemetry, deploys detections at source, coordinates agentic investigation, and executes
    response workflows. Partner and review evidence supports broad integration and workflow
    coverage, but independent benchmarks, reliability records, control certifications, and a
    dated roadmap remain material diligence gaps.
sections:
  - id: product-workflow
    title: Product scope and security-operations workflow
    body: >-
      GreyMatter is delivered as a security-operations platform rather than a rip-and-replace
      endpoint or SIEM product. ReliaQuest says it connects telemetry across a customer's
      existing tools and spans prevention, detection, containment, investigation, and response.
      The resulting workflow starts with fragmented cloud, endpoint, identity, network, and
      business signals; applies normalization and context; then supports detection deployment,
      autonomous investigation, playbook-driven containment, and analyst follow-through.
      Independent review material broadly agrees that the product is cloud-native and based on
      an open-XDR integration model, while the precise boundaries between licensed software,
      managed service labor, and optional modules are not disclosed in the assigned evidence.
      The module matrix therefore treats feature availability and packaging as diligence items,
      not settled SKU definitions.
    claimRefs: [CE001, CE002, CE005, CE012]
    tableRefs: [TE001]
  - id: architecture-integrations
    title: Architecture and integration model
    body: >-
      The public architecture is best understood as an orchestration and translation layer over
      tools the customer already owns. ReliaQuest's platform brief describes a Universal
      Translator that normalizes and stitches telemetry, while Google Cloud describes more than
      135 bidirectional integrations across cloud, multicloud, on-premises, and hybrid
      environments. Detection can be pushed toward the source rather than depending exclusively
      on centralized storage, and agentic personas coordinate tasks such as hunting, detection
      engineering, investigation, and response. This can reduce tool switching and preserve
      prior security investments, but it also creates dependencies on connector quality,
      customer log coverage, API permissions, and safe action controls. Public sources do not
      expose connector-level support tiers, data schemas, tenancy design, or failure-mode
      behavior.
    claimRefs: [CE002, CE003, CE004, CE012, CE013, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-maturity
    title: Deployment, operating maturity, and performance evidence
    body: >-
      Product maturity is visible through a broad feature surface, partner documentation, mobile
      response controls, customer-review activity, and managed-service operating claims. The
      evidence is less complete on repeatable implementation effort and measured production
      reliability. ReliaQuest's 2025 brief reports containment falling from 19.5 hours to under
      five minutes and Tier 1/2 analyst time falling from more than 85% to under 10%; a
      ReliaQuest-presented webinar separately claims 68% faster alert processing and 30% greater
      accuracy in identifying true threats. None of the assigned texts provides a sample,
      observation window, control group, or calculation method. Reviews also flag setup,
      customization, documentation, integration, and response-time friction, making customer
      environment complexity a central deployment variable rather than a secondary concern.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE002]
  - id: differentiation-trust-roadmap
    title: Differentiation, governance, and unresolved technical risk
    body: >-
      The most credible differentiation is architectural fit: GreyMatter aims to coordinate
      heterogeneous security products without forcing wholesale replacement, with at-source
      detection and reusable response workflows layered on top. ReliaQuest also describes
      model selection by task and human-in-the-loop governance using guardrails, expert QA/QC,
      and feedback loops. Those controls are directionally relevant but remain company claims;
      the assigned evidence contains no independent model evaluation, public error-rate series,
      service-level history, security-status record, privacy architecture, or current
      certification evidence. A named engineer's public open-source contribution supplies only
      a weak practitioner signal and does not establish a company-maintained developer
      ecosystem. The roadmap is likewise undated. Underwriting should therefore separate
      demonstrated integration breadth from unverified autonomy, trust, compliance, and release
      durability.
    claimRefs: [CE010, CE011, CE014, CE015, CE016]
