          items: ["Containment and response", "Human-in-the-loop oversight"]
    approximationNotes: "Conceptual stack reconstructed from public descriptions; it is not a disclosed internal deployment diagram or assurance boundary."
    claimRefs: [CE001, CE005, CE013, CE015, CE016]
callouts:
  - calloutType: strength
    title: Integration breadth is the best-supported product advantage
    body: >-
      An independent review and Google Cloud both describe an open-XDR overlay with
      bidirectional integrations, supporting the thesis that GreyMatter can preserve a
      heterogeneous customer stack rather than require wholesale replacement.
    claimRefs: [CE002, CE003, CE012]
  - calloutType: risk
    title: Claimed automation outcomes lack test methodology
    body: >-
      Public speed, analyst-time, and accuracy figures are company-issued and omit samples,
      observation periods, denominators, and calculation methods; they should be treated as
      proof-of-value hypotheses rather than independently verified benchmarks.
    claimRefs: [CE006, CE007, CE008]
