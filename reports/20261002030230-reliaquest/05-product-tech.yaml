      - ["Response and human governance", "Apply containment actions and escalate judgment to analysts", "Playbooks, role controls, auditability, and experienced operators", "Public evidence does not quantify false actions, rollback performance, or service availability"]
    notes: "Architecture is reconstructed from official and partner descriptions; internal data models, tenancy, resilience, and security-control implementation remain unverified."
    claimRefs: [CE002, CE003, CE004, CE012, CE014]
