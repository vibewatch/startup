schemaVersion: "report-v2"
artifact: market-analysis
slug: reliaquest
runDate: 2026-10-02
company:
  name: ReliaQuest
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    ReliaQuest addresses the enterprise security-operations layer between fragmented
    security tools and the teams that investigate and contain threats. The retained
    evidence supports demand from complex, high-volume environments, but it does not
    support a current TAM, SAM, or SOM; the only broad spend estimate is a stale 2020
    MSSP-market proxy and the current category signal is PeerSpot engagement share,
    not revenue share.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market should be bounded around enterprise security-operations
      orchestration and managed detection and response, not the whole cybersecurity
      market. ReliaQuest describes GreyMatter as an agentic platform spanning
      prevention, detection, containment, investigation, and response while connecting
      a customer's existing tools. That places the core offer above SIEM, EDR, cloud,
      identity, and other telemetry-producing controls rather than treating all of
      their spend as addressable. Adjacent categories include XDR and traditional
      MSSPs. Status-quo substitutes are internal SOC labor, point-tool workflows, an
      incumbent MSSP, or adding more security products; a historical company-issued
      release itself acknowledged that enterprises often combine additional tools and
      outsourcing without necessarily realizing expected effectiveness.
    claimRefs: [CM001, CM002, CM012, CM015]
    tableRefs: [TM001]
  - id: sizing-evidence
    title: Evidence-constrained sizing
    body: >-
      The source pool does not permit a defensible current TAM/SAM/SOM calculation.
      A syndicated 2020 company release cited IDC for a $27.9 billion MSSP market
      growing nearly 15% year over year, but that figure is historical, lacks a
      disclosed geography in the retained excerpt, and covers a broader service
      category than ReliaQuest's product boundary. PeerSpot reports 0.9% ReliaQuest
      mindshare in XDR as of October 2026, calculated from user engagement; this is a
      discovery-platform activity measure, not market share or revenue. LeadIQ's
      1,300-plus-customer figure is an installed-base signal but lacks contract value,
      segment mix, churn, and geography. Accordingly, these observations are separate
      sizing lenses rather than inputs to a false precision waterfall.
    claimRefs: [CM003, CM004, CM005, CM006]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      Evidence points to large organizations with dedicated security operations,
      multi-vendor stacks, high alert volumes, and hybrid IT or OT estates. CheckThat
      characterizes the target as enterprises with at least 1,000 employees, while
      ReliaQuest's Circle K story illustrates the operational trigger: acquisitions,
      legacy systems, escalating ingestion needs, and long containment times across
      more than 16,000 sites in over 25 countries. The economic buyer is therefore
      typically the CISO or senior security-operations leader, users are SOC analysts,
      engineers, and threat hunters, and funding normally comes from the enterprise
      security-operations budget. Adoption proceeds through integration with the
      installed SIEM and EDR estate, workflow automation, and proof of containment or
      analyst-capacity improvement rather than wholesale replacement on day one.
    claimRefs: [CM007, CM008, CM009, CM012]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Demand is supported by alert fatigue, fragmented tooling, scarce analyst
      capacity, and the need to contain threats quickly. ReliaQuest claims more than
      300 technology partners and over 50,000 alerts processed daily, suggesting that
      integration breadth and automation volume are central to the proposition; its
      Circle K case reports false positives below 5% and containment falling from
      about 24 hours to five minutes, although those outcomes are company-issued and
      not independently audited here. Constraints are equally material. PeerSpot
      characterizes ReliaQuest as higher-cost than Anomali, and competitor UnderDefense
      argues that buyers must diligence auditability, detection-logic portability, and
      ownership. Custom pricing, absent public unit economics, switching costs, and
      uncertain addressable spend make adoption timing and valuation sensitivity
      dependent on customer-level procurement evidence.
    claimRefs: [CM009, CM010, CM011, CM013, CM014, CM016]
tables:
  - id: TM001
    title: Market definition and spend boundary
    columns:
      - Segment or category
      - Included spend
      - Excluded spend
      - Buyer or payer
      - Relevance to ReliaQuest
    rows:
      - - Enterprise security-operations orchestration
        - Platform and workflow spend for cross-tool detection, investigation, containment, and response
        - Underlying SIEM, EDR, identity, cloud, and network-control license spend
        - CISO or security-operations executive
        - Core market boundary supported by GreyMatter's existing-stack positioning
      - - Managed detection and response
        - Monitoring, investigation, threat hunting, and response services bundled with the platform
        - Unrelated consulting, compliance, and general IT outsourcing
        - CISO, SOC leader, or enterprise security procurement
        - Core service adjacency and a status-quo outsourcing substitute
      - - Extended detection and response
        - Cross-domain detection and response workflows evaluated in the XDR category
        - All endpoint-protection or SIEM revenue merely because those tools supply telemetry
        - Security architecture and SOC leadership
        - Adjacent comparison category; PeerSpot classifies GreyMatter in XDR
      - - Broad MSSP market
        - Third-party managed security service spend
        - In-house SOC payroll and stand-alone product categories
        - Enterprise security and sourcing leadership
        - Historical top-down proxy only, not ReliaQuest TAM or SAM
    notes: >-
      Boundaries synthesize company positioning and third-party category evidence;
      excluded spend prevents double counting, and the 2020 MSSP proxy is broader and
      older than the core market.
    claimRefs: [CM001, CM002, CM012, CM015]
  - id: TM002
    title: Sizing lenses and their limitations
    columns:
      - Publisher or lens
      - Period
      - Geography
      - Value
      - Growth or denominator
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - IDC estimate cited in a syndicated ReliaQuest release
        - "2020"
        - Not specified in retained excerpt
        - "$27.9B MSSP market"
        - Nearly 15% year-over-year growth
        - Third-party estimate repeated in company-issued material
        - Low
        - Stale and broader than GreyMatter's addressable security-operations layer
      - - PeerSpot ReliaQuest XDR engagement
        - October 2026
        - Global site engagement; user geography not disclosed
        - "0.9%"
        - Share of PeerSpot XDR user engagement
        - PeerSpot user-engagement mindshare calculation
        - Medium
        - Not revenue share, customer share, TAM, SAM, or SOM
      - - PeerSpot Anomali XDR comparator
        - October 2026
        - Global site engagement; user geography not disclosed
        - "3.4%"
        - Share of PeerSpot XDR user engagement
        - Same PeerSpot engagement basis as ReliaQuest
        - Medium
        - Comparator signal only and not proof of total category economics
      - - LeadIQ installed-base signal
        - Accessed October 2026
        - Customer distribution not disclosed
        - "1,300+ customers"
        - Customer count; no spend denominator
        - Third-party company directory summary
        - Medium
        - No ACV, retention, segment mix, or independently audited customer definition
    notes: >-
      Values retain their original periods and denominators. They are deliberately not
      combined because spend, engagement share, and customer count are non-comparable.
    claimRefs: [CM003, CM004, CM005, CM006]
  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Large enterprise with a multi-vendor security stack
        - CISO or VP of Security Operations
        - SOC analysts, engineers, and threat hunters
        - Enterprise security organization
        - Connect telemetry and coordinate investigation and response across existing tools
        - CISO
        - Tool fragmentation, alert fatigue, or analyst-capacity constraints
      - - Multinational retailer with mixed IT and OT
        - Head of Global Cybersecurity
        - Global SOC and incident-response teams
        - Corporate cybersecurity function
        - Maintain detection coverage while integrating acquired and legacy environments
        - Global cybersecurity leader
        - Acquisition integration, SIEM scale limits, or long containment time
      - - High-volume AI-SOC adopter
        - Security-operations executive
        - Tier 1 and Tier 2 analysts
        - Security-operations budget
        - Automate alert investigation and containment while retaining human oversight
        - CISO or SOC leader
        - Rising alert volume and need to reallocate analysts to proactive work
      - - Cost-sensitive XDR evaluator
        - Security architecture or sourcing team
        - SOC practitioners
        - Enterprise security procurement
        - Compare integration, automation, service quality, and expected efficiency
        - CISO with procurement approval
        - Renewal event, pricing pressure, or need to prove operational ROI
    notes: >-
      Buyer roles are evidence-based archetypes, not a complete customer census;
      budget ownership and procurement paths require customer-contract validation.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM016]
figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      Six nested evidence layers narrow the relevant market without presenting
      non-comparable spend, engagement, customer, partner, volume, and outcome metrics
      as a calculated TAM/SAM/SOM.
    data:
      nodes:
        - label: Broad adjacency
          detail: "2020 MSSP proxy: $27.9B, nearly 15% year-over-year growth"
        - label: Comparison category
          detail: "XDR engagement signal: 0.9% ReliaQuest PeerSpot mindshare in October 2026"
        - label: Core offering boundary
          detail: Existing-stack security-operations orchestration and managed response
        - label: Enterprise-fit environment
          detail: Multi-vendor, high-alert-volume, hybrid IT and OT operations
        - label: Observable reach
          detail: "LeadIQ reports 1,300+ customers; company page claims 300+ technology partners"
        - label: Workload and outcome proof
          detail: "Company page claims 50K+ alerts daily; Circle K case claims five-minute containment"
    approximationNotes: >-
      This is a categorical narrowing framework, not a proportional pyramid. The
      metrics use different units and denominators and are not added, multiplied, or
      converted into TAM, SAM, SOM, revenue, or market share.
    claimRefs: [CM001, CM004, CM006, CM009, CM013, CM014]
callouts:
  - calloutType: risk
    title: Current TAM, SAM, and SOM remain unverified
    body: >-
      The retained evidence lacks a current independent market estimate aligned to
      GreyMatter's precise boundary, enterprise segmentation, geography, pricing, and
      attainable penetration. Data-room customer economics and a current third-party
      category study are required before using market size in valuation.
    claimRefs: [CM003, CM004, CM005, CM006, CM016]
