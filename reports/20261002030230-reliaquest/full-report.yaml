  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded around enterprise security-operations orchestration and managed
              detection and response, not the whole cybersecurity market. ReliaQuest describes GreyMatter as an agentic
              platform spanning prevention, detection, containment, investigation, and response while connecting a
              customer's existing tools. That places the core offer above SIEM, EDR, cloud, identity, and other
              telemetry-producing controls rather than treating all of their spend as addressable. Adjacent categories
              include XDR and traditional MSSPs. Status-quo substitutes are internal SOC labor, point-tool workflows, an
              incumbent MSSP, or adding more security products; a historical company-issued release itself acknowledged
              that enterprises often combine additional tools and outsourcing without necessarily realizing expected
              effectiveness.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM015
