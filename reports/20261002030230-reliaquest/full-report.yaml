      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that substantial sponsor backing, recurring-revenue scale, reported growth, and visible
              deployment signals can support a durable security-operations platform. The historical capital record
              includes more than $300M of growth financing in 2020 after a prior $30M FTV Capital investment, while the
              current company site presents named customer testimonials and LeadIQ reports more than 1,300 customers.
              Florida State University's account of hands-on GreyMatter training offers partner-issued evidence that the
              platform is being evaluated in a live institutional setting. The anti-thesis is evidentiary and
              price-sensitive: the retained sources do not disclose audited ARR, revenue, gross margin, retention, cash
              generation, cap-table ownership, liquidation preferences, or a current secondary-clearing price. Company
              and partner proof is useful commercial signal but is not independent verification of unit economics. The
              thesis breaks if the reported ARR, growth, or profitability claims fail diligence, if retention and
              margins cannot support the entry multiple, or if preference overhang materially subordinates new or common
              equity.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
