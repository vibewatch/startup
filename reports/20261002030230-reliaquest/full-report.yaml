              Despite glowing investor announcements, ReliaQuest remains a private entity without public SEC reporting.
              Crucial unit economics—including GAAP gross margins, customer acquisition cost payback periods, cohort net
              revenue retention, and customer concentration—remain undisclosed, representing a material underwriting
              risk that must be verified in an audited data room.
            calloutType: risk
