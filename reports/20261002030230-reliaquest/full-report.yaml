              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Bull, Base, and Bear Framework
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should remain conditional because the public record cannot support precise forward
              valuation ranges or probabilities. In the bull case, diligence confirms that ARR remains above the
              reported $300M level, growth remains above 30%, profitability is durable, and retention and margins
              justify paying above the March 2025 marker. In the base case, the operating claims broadly verify but
              current growth, customer economics, and financing terms warrant an entry at or below that marker with
              explicit downside protection. In the bear case, ARR classification, growth, profitability, retention, or
              margin evidence fails verification, or illiquidity and senior preferences impair investor proceeds; the
              correct response is a material discount or no investment rather than a fabricated point estimate.
              Multiples' displayed comparison set ranges widely across private and public companies, illustrating
              sensitivity rather than establishing an apples-to-apples benchmark. Probability signals are therefore
              diligence outcomes, not invented percentages.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV016
