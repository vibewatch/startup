              - CV013
              - CV016
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Public exit readiness is not established. Forge labels market activity limited and provides neither a
              Forge Price nor a post-money valuation for ReliaQuest, while warning that its private-market data is not
              audited or independently verified. No retained source supplies an IPO filing, definitive exit timetable,
              current secondary bid, fully diluted ownership schedule, or preference waterfall. The financing history
              and customer signals may support eventual strategic or public-market optionality, but they do not
              establish timing, proceeds, or a target return. Final diligence should reconcile ARR to recognized revenue
              and cash generation; inspect monthly retention, gross margin, customer concentration, and cohort
              expansion; review the charter, investor-rights agreements, debt, and all preference terms; and obtain
              primary transaction evidence for any proposed entry. Monitor for a current priced round, audited financial
              package, secondary trades, or an IPO filing. Until one of those signals arrives, the hold period and
              return case remain unquantified, and the recommendation should not be upgraded solely because the prior
              round attracted prominent sponsors.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional decision
            body: >-
              Track ReliaQuest and proceed to data-room diligence, but do not treat the March 2025 $3.4B marker as a
              current fair-value conclusion. Upgrade only after the operating denominator, retention and margin quality,
              capitalization rights, and executable price support the required return.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV012
              - CV013
              - CV016
          - type: callout
            title: Thesis-break trigger
            body: >-
              The thesis breaks if audited diligence cannot reproduce the reported ARR, growth, or profitability
              signals, or if senior preferences and illiquidity make investor proceeds unacceptable at the proposed
              entry.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV016
