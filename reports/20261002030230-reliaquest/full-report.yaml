      - number: '3.3'
        title: Switching Costs, Lock-in Dynamics, and Displacement Vulnerability
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest's enterprise defensibility rests on high organizational switching costs rather than proprietary
              telemetry ownership. Enterprise customers integrate GreyMatter across disparate cloud, on-premises, and
              identity technologies, establishing operational workflows that span multi-year procurement cycles across
              Fortune 500 accounts. The platform's universal translator correlates disparate logs, meaning replacing
              ReliaQuest requires either massive re-tooling around an ecosystem stack like Microsoft E5 or absorbing
              investigative labor internally. Nonetheless, GreyMatter's overlay structure introduces vulnerability:
              because it sits on top of underlying SIEM and EDR contracts, it represents an additive
              software-and-services budget line item. When enterprise buyers experience slow custom detection
              engineering queues, alert fatigue from repetitive alert re-triage, or complex multi-layer integrations,
              CFOs and CISOs re-evaluate the net return of maintaining an additive overlay layer against native platform
              consolidation or outcome-based AI MDR.
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Additive Overlay Economics and Alert Re-Triage Friction
            body: >-
              ReliaQuest's primary vulnerability in competitive bake-offs is structural: GreyMatter does not replace
              underlying SIEM or EDR infrastructure costs. When alert re-triage recurs and custom detection tuning faces
              delivery queues, enterprise buyers face compounding costs from paying for both the underlying tool
              licenses and the overlay management layer.
            calloutType: risk
            claimRefs:
              - CP003
              - CP006
              - CP008
          - type: callout
            title: Defensibility of 300+ Tool Integrations in Heterogeneous Stacks
            body: >-
              For Global 2000 enterprises maintaining diverse security tools across multiple cloud providers and
              on-premises footprints, ReliaQuest's universal translator and 300+ technology integrations offer an
              operational bridge that single-vendor ecosystems like CrowdStrike or Microsoft cannot replicate without
              forced tool consolidation.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanisms, and Contracting Structure
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest monetizes its Open XDR and Managed Detection and Response platform, GreyMatter, primarily
              through annual and multi-year subscription contracts. Rather than requiring enterprises to rip and replace
              their existing infrastructure, ReliaQuest charges for platform access and managed outcomes that integrate
              with over 200 security and telemetry technologies across customer environments. The revenue model combines
              recurring platform software fees with outcome-based managed detection, investigation, and response
              workflows. Although list pricing and discrete per-workload fees are not published publicly, user
              evaluations note a competitive initial setup cost paired with significant return on investment, while
              competing native tools often demand higher upfront tool licensing investments. Enterprise contracting
              typically involves custom enterprise agreements scaled by protected telemetry volume, integrated data
              sources, and organizational scope across hybrid cloud and on-premises deployments.
            claimRefs:
              - CI001
