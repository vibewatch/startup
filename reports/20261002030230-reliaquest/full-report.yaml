      - number: '4.3'
        title: Cost Structure, Unit Economics, and Diligence Verification Gaps
        blocks:
          - type: paragraph
            body: >-
              While top-line scale milestones and headline valuations demonstrate commercial adoption across more than
              1,000 enterprise customers, ReliaQuest's detailed cost structure remains undisclosed outside formal data
              rooms. As a co-managed platform integrating human SOC expertise with automated agentic AI, delivery costs
              span cloud infrastructure, data ingestion/processing overhead, and specialized engineering compensation
              for approximately 1,200 personnel. Because ReliaQuest does not report audited financial statements, key
              unit economics—including gross margin, customer acquisition cost, CAC payback velocity, Net Revenue
              Retention, and customer concentration—cannot be independently verified from public disclosures. Sponsoring
              investor materials characterize operations as profitable, but underwriting requires data-room
              reconciliation to confirm whether reported profitability reflects GAAP net income or non-GAAP adjusted
              EBITDA before stock-based compensation and transaction-related expenses.
