      - number: '5.4'
        title: Differentiation, governance, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              The most credible differentiation is architectural fit: GreyMatter aims to coordinate heterogeneous
              security products without forcing wholesale replacement, with at-source detection and reusable response
              workflows layered on top. ReliaQuest also describes model selection by task and human-in-the-loop
              governance using guardrails, expert QA/QC, and feedback loops. Those controls are directionally relevant
              but remain company claims; the assigned evidence contains no independent model evaluation, public
              error-rate series, service-level history, security-status record, privacy architecture, or current
              certification evidence. A named engineer's public open-source contribution supplies only a weak
              practitioner signal and does not establish a company-maintained developer ecosystem. The roadmap is
              likewise undated. Underwriting should therefore separate demonstrated integration breadth from unverified
              autonomy, trust, compliance, and release durability.
            claimRefs:
              - CE010
              - CE011
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration breadth is the best-supported product advantage
            body: >-
              An independent review and Google Cloud both describe an open-XDR overlay with bidirectional integrations,
              supporting the thesis that GreyMatter can preserve a heterogeneous customer stack rather than require
              wholesale replacement.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE012
          - type: callout
            title: Claimed automation outcomes lack test methodology
            body: >-
              Public speed, analyst-time, and accuracy figures are company-issued and omit samples, observation periods,
              denominators, and calculation methods; they should be treated as proof-of-value hypotheses rather than
              independently verified benchmarks.
            calloutType: risk
            claimRefs:
