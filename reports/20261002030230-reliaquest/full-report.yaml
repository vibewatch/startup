            title: Substantial Scale Milestone and Profitable Growth Posture
            body: >-
              Surpassing $300 million in ARR while growing at over 30% year-over-year and maintaining operating
              profitability positions ReliaQuest in an elite echelon of late-stage enterprise cybersecurity companies.
              This financial profile provides substantial defensibility and self-sustaining growth capacity without
              immediate dilutive capital requirements.
            calloutType: strength
            claimRefs:
