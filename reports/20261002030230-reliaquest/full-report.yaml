  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Architectural Triangulation
        blocks:
          - type: paragraph
            body: >-
              The managed detection, response, and security operations landscape has bifurcated across three primary
              operating models: Traditional MDR, customer-operated AI SOC software, and Managed Agentic Security
              Services (AI MDR). ReliaQuest positions GreyMatter as a vendor-neutral security operations overlay rather
              than a pure-play managed detection and response (MDR) service, explicitly avoiding single-vendor lock-in
              by orchestrating across existing enterprise tooling. However, competitors approach enterprise security
              operations with fundamentally distinct accountability and operational architectures. Traditional MDR
              providers such as Arctic Wolf, eSentire, and Sophos operate large managed SOCs that monitor customer
              telemetry, whereas pure platform consolidators like Microsoft (Sentinel and Defender XDR) and Palo Alto
              Networks (Cortex XDR and Unit 42) incentivize enterprise stack convergence by coupling native telemetry
              with proprietary agentic automation like Cortex AgentiX. Simultaneously, customer-operated AI SOC
              platforms such as Intezer, Prophet Security, and Dropzone AI automate triage workflows while leaving
              operational risk and incident response accountability on internal corporate teams.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP008
              - CP014
      - number: '3.2'
        title: Capability Matrix and Technical Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Evaluating ReliaQuest against alternative architectures reveals critical tradeoffs between telemetry
              breadth and investigation depth. ReliaQuest maintains an extensive integration footprint spanning over 300
              technology partners and ingesting more than 50,000 daily alerts per enterprise environment. To counter the
              latency and high licensing costs of centralized data aggregation, ReliaQuest highlighted a strategic pivot
              toward SIEM-less security architectures that inspect telemetry at the source and in transit, supplemented
              by the launch of GreyMatter Attack for automated AI red teaming and exposure validation. In contrast,
              emerging AI MDR competitors like Daylight Security challenge the overlay approach by executing proprietary
              detection rules directly on streaming raw logs and conducting bi-directional glass-box investigations that
              close resolved tickets at the tool source. Ecosystem consolidators such as CrowdStrike Falcon Complete
              deliver deep, automated remediation but restrict their primary investigation fidelity to native Falcon
              telemetry, illustrating that broad connector counts do not necessarily guarantee deep alert triage per
              integrated tool.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
