  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Enterprise Buyer Persona
        blocks:
          - type: paragraph
            body: >
              ReliaQuest targets mid-market and global enterprise security operations centers that manage heterogeneous,
              multi-vendor cybersecurity environments. Rather than forcing organizations to rip and replace incumbent
              tools, GreyMatter acts as a centralized security control plane that ingests, stitches, and normalizes
              telemetry across disparate endpoint, cloud, network, and SIEM infrastructure. The primary economic buyer
              is typically the Chief Information Security Officer (CISO) or Vice President of Security Operations, while
              the daily hands-on users are Tier 2 and Tier 3 security analysts, threat hunters, and detection engineers
              seeking to eliminate repetitive Tier 1 alert triage.


              Enterprise adopters span diverse industry verticals including retail (Lowe's), professional services and
              legal (Kirkland & Ellis, Syniverse), lighting and industrial manufacturing (Signify), and transportation
              and hospitality (Southwest Airlines, Campbell's, Abercrombie & Fitch, Darden, Hanes Brands). Across these
              segments, the economic justification centers on tool sprawl consolidation, headcount leverage (such as
              Signify monitoring 3x more environment without adding headcount), and reducing alert fatigue where
              organizations process upwards of 50,000 alerts daily. However, mid-market organizations with leaner
              security teams report that GreyMatter can still require substantial internal operational involvement to
              perform final incident remediation.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU006
              - CU007
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
