chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Founded in 2007 by Brian Murphy and headquartered in Tampa, ReliaQuest sells GreyMatter as an agentic-AI
              security-operations platform for large enterprises. The operating proposition is to connect telemetry from
              an existing security stack, detect threats where data resides or moves, and automate investigation and
              response rather than require wholesale replacement of incumbent tools. Company materials say the platform
              integrates with more than 200 cybersecurity tools; the current homepage separately describes more than 300
              technology partners, so those labels should not be treated as the same denominator. The business is
              therefore best understood as a subscription software-and-service layer across heterogeneous security
              estates, with pricing and revenue composition still private.
