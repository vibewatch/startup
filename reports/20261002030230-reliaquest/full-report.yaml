      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by alert fatigue, fragmented tooling, scarce analyst capacity, and the need to contain
              threats quickly. ReliaQuest claims more than 300 technology partners and over 50,000 alerts processed
              daily, suggesting that integration breadth and automation volume are central to the proposition; its
              Circle K case reports false positives below 5% and containment falling from about 24 hours to five
              minutes, although those outcomes are company-issued and not independently audited here. Constraints are
              equally material. PeerSpot characterizes ReliaQuest as higher-cost than Anomali, and competitor
              UnderDefense argues that buyers must diligence auditability, detection-logic portability, and ownership.
              Custom pricing, absent public unit economics, switching costs, and uncertain addressable spend make
              adoption timing and valuation sensitivity dependent on customer-level procurement evidence.
