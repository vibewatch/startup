              - CR013
      - number: '7.3'
        title: Partner Ecosystem Dependencies and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest's vendor-neutral Open XDR model creates substantial operational dependencies on external
              telemetry providers and consulting channels. The platform integrates with third-party SIEM and EDR
              products across over 300 technology partners and relies on strategic consulting alliances like Protiviti
              to deliver 24/7/365 managed detection and response services. Any technical deprecation or competitive
              enclosure by platform giants such as Microsoft, CrowdStrike, or Palo Alto Networks could restrict data
              ingest and degrade detection workflows. On the financial side, while ReliaQuest raised a $500 million
              investment round led by EQT, KKR, and FTV Capital at a $3.4 billion valuation in early 2025, the company
              sustains a capital-intensive hybrid service delivery model supporting approximately 1,200 employees across
              six global operating centers. Maintaining 24/7 human-in-the-loop enablement alongside agentic AI tools
              exposes the operating model to wage inflation and margin compression if automation fails to offset alert
              volume expansion.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Identity Verification Remains Critical Failure Point Post-ShinyHunters Incident
            body: >-
              The August 2026 ShinyHunters vishing breach against ReliaQuest highlights a fundamental operational risk:
              security operations centers are prime targets for adversary social engineering. When defenders rely on
              standard multi-factor authentication without hardware-bound FIDO2 or biometric passkeys, voice phishing
              can successfully bypass identity verification controls, jeopardizing client confidentiality and platform
              integrity.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Contractual Disclaimers Shift Breach Risk Back to Enterprise Clients
            body: >-
              ReliaQuest's standard Platform and Support Agreement clearly insulates the vendor from operational breach
              liability. Section 14.d's explicit statement that the occurrence of a security threat does not constitute
              a contractual breach provides vital legal defense against client lawsuits, yet it underscores to
              enterprise buyers that MDR services do not replace internal corporate liability frameworks.
            calloutType: insight
            claimRefs:
              - CR005
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence decision is track / research more, with medium confidence in that process
              recommendation and high underwriting risk for new capital at undisclosed terms. Independent reports
              corroborate a financing of more than $500M led by EQT, KKR, and FTV Capital and a resulting $3.4B
              valuation marker. SDxCentral also reports ARR above $300M, growth above 30%, and profitability, which is
              meaningful evidence of scale but remains a reported rather than audited operating snapshot. The price case
              is not complete: one market-data source labels $300M as revenue while its own methodology says the
              recorded figure may instead be ARR, and Forge shows no available price or post-money valuation for a
              current transaction. Entry discipline should therefore anchor to verified data-room economics and security
              terms, not to the headline mark alone. A move to invest requires clean ARR and revenue definitions,
              retention and margin cohorts, a fully diluted cap table, preference terms, and an executable price that
              supports the target return.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
