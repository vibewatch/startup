      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Evidence points to large organizations with dedicated security operations, multi-vendor stacks, high alert
              volumes, and hybrid IT or OT estates. CheckThat characterizes the target as enterprises with at least
              1,000 employees, while ReliaQuest's Circle K story illustrates the operational trigger: acquisitions,
              legacy systems, escalating ingestion needs, and long containment times across more than 16,000 sites in
