      - number: '7.2'
        title: Contractual Liability Disclaimers and Regulatory Exposure
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest's standard Platform and Support Agreement strictly limits its legal and financial liability in
              the event of enterprise security incidents. Under Section 14.d of the agreement, ReliaQuest explicitly
              disclaims any warranty or guarantee that its GreyMatter platform or Ongoing Enablement services will
              detect, investigate, or remediate all security threats, establishing that the occurrence of an active
              security threat does not constitute a contractual breach. Contractual terms also mandate that customers
              maintain sole responsibility for the quality and security of their data, backup services, and external
              security configurations, while capping evaluation liability at one hundred dollars and excluding liability
              for force majeure network disruptions. While these provisions protect ReliaQuest from ruinous breach
              litigation damages, they can generate friction during enterprise procurement negotiations when risk-averse
              buyers demand robust indemnification or financial guarantees for mission-critical security operations.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
