      - - Valuation stance
        - Indeterminate at the current entry price
        - The March 2025 $3.4B marker is historical; Forge displays no available current price or post-money valuation.
        - Treat $3.4B as a reference marker, not fair value.
      - - Return / hold / exit
        - Not supportable from public evidence
        - No retained source provides a filing, exit timetable, secondary-clearing price, or ownership waterfall.
        - Set return and hold targets only after transaction and capitalization diligence.
    notes: >-
      Evidence through 2026-10-02; assessments distinguish reported ARR from revenue and identify unavailable
      transaction terms rather than estimating them.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV007
      - CV012
      - CV013
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - 'Thesis: sponsor-backed scale'
        - The latest reported financing exceeded $500M and involved EQT, KKR, and FTV Capital.
        - Primary transaction documents confirm the price, security, ownership, and investor rights.
      - - 'Thesis: recurring-revenue momentum'
        - SDxCentral reports ARR above $300M, growth above 30%, and profitable operations.
        - Audited ARR, revenue, cash generation, and cohort data reconcile to the public claims.
      - - 'Thesis: visible commercial adoption'
        - LeadIQ reports more than 1,300 customers; ReliaQuest presents named enterprise testimonials.
        - Independent customer references confirm renewal, expansion, and measurable value.
      - - 'Thesis: institutional deployment signal'
        - FSU describes hands-on GreyMatter training under a new partnership.
        - Reference calls show production adoption rather than evaluation or training alone.
      - - 'Anti-thesis: denominator ambiguity'
        - Multiples labels $300M as revenue but states its round-linked figure may be revenue or ARR.
        - Audited statements establish a consistent revenue and ARR basis.
      - - 'Anti-thesis: illiquidity and price opacity'
        - Forge reports limited activity and no available price or post-money valuation.
        - A verifiable secondary trade, priced round, or public filing establishes current price discovery.
      - - 'Anti-thesis: preference and dilution opacity'
        - No retained source discloses a fully diluted cap table or the latest financing preferences.
        - Charter and investor-rights documents show an acceptable proceeds waterfall.
    notes: >-
      The table separates company- or partner-issued adoption signals from independent financing and market-data
      sources; absence of public terms is recorded as a diligence gap.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited ARR remains above $300M, growth remains above 30%, profitability is durable, and retention and margins
          are strong.
        - >-
          A price above the March 2025 $3.4B marker is considered only if verified unit economics support the premium;
          no public-data range is defensible.
        - Multiple compression, growth deceleration, or weak conversion from deployments to durable recurring revenue.
        - Rises only after audited economics and current transaction terms verify the public operating claims.
      - - Base
        - Headline operating claims broadly verify, but current growth and financing rights remain uncertain.
        - >-
          Use the $3.4B marker as a ceiling reference and seek an entry at or below it with downside protection; target
          return remains unquantified.
        - Denominator ambiguity, preference overhang, and limited liquidity.
        - Supported when diligence confirms scale but not enough efficiency or liquidity for a premium.
      - - Bear
        - >-
          ARR classification, growth, profitability, retention, or margins fail verification, or senior terms impair
          common proceeds.
        - >-
          Require a material discount to the prior marker or pass; public evidence cannot support a precise downside
          range.
        - Down round, prolonged illiquidity, customer concentration, or an unfavorable preference waterfall.
        - Rises if audited data conflict with reported metrics or current price discovery remains unavailable.
    notes: >-
      These are conditional underwriting cases, not forecasts; no numerical probability or forward valuation range is
      assigned because current operating and transaction inputs are unavailable.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
      - CV013
      - CV016
