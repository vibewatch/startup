      - number: '5.3'
        title: Deployment, operating maturity, and performance evidence
        blocks:
          - type: paragraph
            body: >-
              Product maturity is visible through a broad feature surface, partner documentation, mobile response
              controls, customer-review activity, and managed-service operating claims. The evidence is less complete on
              repeatable implementation effort and measured production reliability. ReliaQuest's 2025 brief reports
              containment falling from 19.5 hours to under five minutes and Tier 1/2 analyst time falling from more than
              85% to under 10%; a ReliaQuest-presented webinar separately claims 68% faster alert processing and 30%
              greater accuracy in identifying true threats. None of the assigned texts provides a sample, observation
              window, control group, or calculation method. Reviews also flag setup, customization, documentation,
              integration, and response-time friction, making customer environment complexity a central deployment
              variable rather than a secondary concern.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
