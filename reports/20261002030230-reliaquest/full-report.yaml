      - number: '5.2'
        title: Architecture and integration model
        blocks:
          - type: paragraph
            body: >-
              The public architecture is best understood as an orchestration and translation layer over tools the
              customer already owns. ReliaQuest's platform brief describes a Universal Translator that normalizes and
              stitches telemetry, while Google Cloud describes more than 135 bidirectional integrations across cloud,
              multicloud, on-premises, and hybrid environments. Detection can be pushed toward the source rather than
              depending exclusively on centralized storage, and agentic personas coordinate tasks such as hunting,
              detection engineering, investigation, and response. This can reduce tool switching and preserve prior
              security investments, but it also creates dependencies on connector quality, customer log coverage, API
              permissions, and safe action controls. Public sources do not expose connector-level support tiers, data
              schemas, tenancy design, or failure-mode behavior.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE012
              - CE013
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
