  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and security-operations workflow
        blocks:
          - type: paragraph
            body: >-
              GreyMatter is delivered as a security-operations platform rather than a rip-and-replace endpoint or SIEM
              product. ReliaQuest says it connects telemetry across a customer's existing tools and spans prevention,
              detection, containment, investigation, and response. The resulting workflow starts with fragmented cloud,
              endpoint, identity, network, and business signals; applies normalization and context; then supports
              detection deployment, autonomous investigation, playbook-driven containment, and analyst follow-through.
              Independent review material broadly agrees that the product is cloud-native and based on an open-XDR
              integration model, while the precise boundaries between licensed software, managed service labor, and
              optional modules are not disclosed in the assigned evidence. The module matrix therefore treats feature
              availability and packaging as diligence items, not settled SKU definitions.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
