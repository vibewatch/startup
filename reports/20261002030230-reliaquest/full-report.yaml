              leader, users are SOC analysts, engineers, and threat hunters, and funding normally comes from the
              enterprise security-operations budget. Adoption proceeds through integration with the installed SIEM and
              EDR estate, workflow automation, and proof of containment or analyst-capacity improvement rather than
              wholesale replacement on day one.
