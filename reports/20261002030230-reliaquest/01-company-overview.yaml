      diligencePath: Review the capitalization table, charter, investor-rights agreements, board minutes, and latest financing documents in the data room.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Audited accounting revenue, gross margin, NRR, churn, customer concentration, cash balance, debt, and credit-facility terms.
      whyItMatters: ARR, growth, and operating-profitability labels cannot establish revenue quality, cash generation, liquidity, or leverage.
      diligencePath: Obtain audited financial statements, ARR-to-revenue reconciliation, cohort retention schedules, customer concentration, cash statements, and all debt documents.
