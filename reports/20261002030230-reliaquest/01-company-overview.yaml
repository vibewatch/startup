company:
  name: ReliaQuest
chapter:
  number: 1
  title: Company Overview
  summary: >-
    ReliaQuest is a founder-led, Tampa-based private cybersecurity company built around
    the GreyMatter security-operations platform. Its March 2025 financing exceeded
    $500 million at a $3.4 billion valuation, while current company-issued materials
    report more than 1,300 customers and 1,200 teammates; accounting revenue, ownership,
    governance rights, margins, retention, and debt remain undisclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Founded in 2007 by Brian Murphy and headquartered in Tampa, ReliaQuest sells
      GreyMatter as an agentic-AI security-operations platform for large enterprises.
      The operating proposition is to connect telemetry from an existing security stack,
      detect threats where data resides or moves, and automate investigation and response
      rather than require wholesale replacement of incumbent tools. Company materials
      say the platform integrates with more than 200 cybersecurity tools; the current
      homepage separately describes more than 300 technology partners, so those labels
      should not be treated as the same denominator. The business is therefore best
      understood as a subscription software-and-service layer across heterogeneous
      security estates, with pricing and revenue composition still private.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: financing-and-scale
    title: Financing, scale, and stakeholder structure
    body: >-
      The strongest public capitalization marker is the March 2025 round of more than
      $500 million at a $3.4 billion valuation, led by EQT, KKR, and FTV Capital with
      Ten Eleven Ventures and Finback Investment Partners participating. ReliaQuest also
      reported that ARR had surpassed $300 million, had grown more than fourfold since
      2020, and that the company was growing above 30% year over year while operating
      profitably. Those are company-reported operating metrics, not accounting revenue
      or audited profit. Current company materials report more than 1,300 customers and
      1,200 teammates across six operating centers, but do not bridge those figures to
      revenue quality, concentration, retention, or a legal headcount definition.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Brian Murphy remains founder and CEO, making founder-market continuity a clear
      strength while also creating visible key-person dependence. ReliaQuest announced
      on October 1, 2026 that Krish Venkataraman would join as CFO on October 5; the
      company emphasized his experience scaling KnowBe4 from roughly $10 million to
      roughly $300 million of ARR and helping take it public. That appointment adds
      capital-markets and scaling coverage, but it is too recent to judge execution or
      succession depth. The assigned evidence does not identify the board roster,
      investor board seats, voting rights, ownership percentages, liquidation
      preferences, or founder control, leaving governance quality materially
      under-documented.
    claimRefs: [CO010, CO011, CO016]
    tableRefs: [TO002]
  - id: milestones-and-evidence-quality
    title: Milestones and evidence quality
    body: >-
      The milestone record shows a long operating history, institutional financing,
      continued AI product expansion, and investment in a Tampa talent pipeline.
      ReliaQuest's 2026 product release described six role-based agentic-AI personas
      using more than 200 agent skills and 400 AI tools; a June 2026 company release
      added a $1.5 million University of South Florida investment to a relationship that
      began in 2018. However, most current operating metrics in the assigned pool are
      company-issued or repeated from company announcements. The Forrester economic
      model is useful customer evidence but was commissioned by ReliaQuest and based on
      four interviews aggregated into a composite, so its 224% modeled ROI is not an
      independent population benchmark.
    claimRefs: [CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
