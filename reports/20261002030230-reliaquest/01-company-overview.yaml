      Public evidence supports valuation, ARR, growth, customer, and teammate labels,
      but not a current cap table, board structure, investor rights, accounting revenue,
      margins, retention, cash, or debt terms. Investment underwriting should not treat
      funding raised as cash available or company-reported ARR as audited revenue.
    claimRefs: [CO004, CO006, CO007, CO016]
