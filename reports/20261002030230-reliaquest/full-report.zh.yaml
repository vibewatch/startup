      - number: '8.4'
        title: 退出就绪度与终审尽调清单
        blocks:
          - type: paragraph
            body: >-
              公开层面的退出就绪度尚未确立。Forge 将其二级市场活跃度标记为受限，未给出 Forge 交易参考价与投后估值，并提醒其私募市场数据未经审计或独立核实。现有材料均未提供 IPO
              申报文件、明确的退出时间表、近期的老股买盘报价、完全稀释后的持股明细或优先清算瀑布流。融资历程与客户拓展信号或能支撑未来的并购或公开上市预期，但无法确定具体时间节点、回款规模或预期回报率。终审尽调应重点完成：将
              ARR
              与会计确认收入及造血现金流进行对账；核查月度留存率、毛利率、客户集中度与分群扩张情况；调阅公司章程、投资方权利协议、负债及全部优先清算条款；并针对意向投资获取一手交易证据。后续需密切追踪新一轮定价融资、经审计财务报告、老股交易或
              IPO 申报文件。在上述关键信号出现之前，持有周期与回报模型仍无法量化，绝不能仅凭上一轮融资吸引了知名机构就贸然调高投资建议评级。
