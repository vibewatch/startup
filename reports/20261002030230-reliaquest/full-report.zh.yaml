      - number: '7.3'
        title: 合作伙伴生态依赖与资本密集度
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest 坚持的中立 Open XDR 模式，使其在运营上对外部遥测数据提供方和咨询渠道产生了深度依赖。该平台集成了 300 多家技术合作伙伴的第三方 SIEM 与 EDR 产品，并依托
              Protiviti 等战略咨询联盟交付 24/7/365 全天候托管检测与响应服务。Microsoft、CrowdStrike 或 Palo Alto Networks
              等平台巨头实施的任何技术弃用或竞争性生态围墙，都可能限制其数据接入并削弱检测工作流。财务层面，尽管 ReliaQuest 于 2025 年初以 $3.4 billion 估值完成了由 EQT、KKR 和 FTV
              Capital 领投的 $500 million 融资，但公司维系的是资本密集型的混合交付模式，在全球六大运营中心雇佣约 1,200 名员工。如果自动化未能有效消化告警量的膨胀，在智能体 AI 工具之外维持
              24/7 全天候人机协同赋能，将使商业模式面临工资通胀与利润率被挤压的风险。
            claimRefs:
              - CR009
