      - number: '2.4'
        title: 增长驱动力、制约瓶颈与估值关联
        blocks:
          - type: paragraph
            body: >-
              告警疲劳、工具碎片化、分析师人才短缺以及快速遏制威胁的需求，共同支撑了市场需求。ReliaQuest 宣称拥有 300 多家技术合作伙伴，日均处理告警超过 50,000
              条，表明集成广度与自动化吞吐量是其价值主张的核心；其 Circle K 案例称误报率低于 5%，遏制时间从约 24 小时缩短至 5
              分钟，但上述成果均为公司单方发布，未在此处经过独立审计。制约因素同样不容忽视：PeerSpot 指出 ReliaQuest 的成本高于 Anomali，竞争对手 UnderDefense
              则主张买方必须对可审计性、检测逻辑的可迁移性及归属权做细致尽调。定制化定价、缺乏公开的单客经济模型、切换成本以及可触达预算的不确定性，使得采购节奏与估值敏感度高度依赖客户层面的实际合同证据。
