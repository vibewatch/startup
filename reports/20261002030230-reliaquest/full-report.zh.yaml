      - number: '8.2'
        title: 核心逻辑与反向推论
        blocks:
          - type: paragraph
            body: >-
              正向投资逻辑在于：顶尖财务赞助商的重磅注资、经常性收入体量、披露的高增速以及明确的实际落地迹象，足以支撑一个具备长青潜力的安全运营平台。过往融资记录显示，继早期 FTV Capital 投资 $30M 后，公司于
              2020 年获得超过 $300M 的成长期融资；目前官网展示了实名客户背书，LeadIQ 数据亦显示其拥有超过 1,300 家客户。佛罗里达州立大学关于 GreyMatter
              实操培训的案例，提供了该平台在真实机构环境中经受检验的合作伙伴侧证据。反向推论则聚焦于证据充分性与价格敏感度：现有资料未披露经审计的
              ARR、确认收入、毛利率、留存率、造血能力、股权结构表持股比例、清算优先权或近期的老股交易价格。公司及伙伴单方佐证属于有价值的商业信号，但不能代替对单客经济模型的独立核实。一旦尽调证实自报的
              ARR、增速或盈利能力声称存在水分，留存率与利润率无法支撑入场倍数，或优先股堆叠严重削弱新增股权或普通股权益，正向逻辑即告破灭。
