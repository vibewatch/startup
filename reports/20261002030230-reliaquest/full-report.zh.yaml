              Ventures 与 Finback Investment Partners 跟投。ReliaQuest 还披露其 ARR 已突破 $300 million，自 2020
              年以来增长逾四倍，且公司在保持经营性盈利的同时同比增速超 30%。上述指标属于公司自报的运营数据，并非会计确认收入或经审计利润。目前公司资料披露其在六大运营中心拥有超过 1,300 家客户与 1,200
