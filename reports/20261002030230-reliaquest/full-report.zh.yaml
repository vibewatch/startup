            body: >-
              对 ReliaQuest 保持“观察”并推进数据室尽调，但切勿将 2025 年 3 月的 $3.4B
              估值直接视作当前的公允价值结论。唯有在运营指标基准、留存与利润率质量、资本权利及可执行价格能够支撑既定回报要求之后，方可上调评级。
