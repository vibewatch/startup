  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与合同结构
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest 主要依托年度及多年期订阅合同，将其 Open XDR 与托管检测响应平台 GreyMatter 商业化。ReliaQuest
              并不要求企业推倒重建既有基础设施，而是针对平台接入及贯穿客户环境中 200
              多项安全与遥测技术的托管交付成效收取费用。其收入模式结合了定期平台软件费与按成效付费的托管检测、调查及响应工作流。尽管官方未公开发布公开报价单与单项工作负载费用，但用户评价指出其初始部署成本具备竞争力且投资回报率可观，而竞对的原生工具往往要求更高的先期工具授权投资。企业合同通常签署定制化大客户协议，按受保护的遥测数据量、接入的数据源数量以及横跨混合云与本地部署的组织规模阶梯计费。
