              尽管收入规模里程碑与高估值彰显出 1,000 多家企业客户的商业采纳，但 ReliaQuest 在正式数据室之外仍未披露详尽的成本结构。作为融合人类 SOC 专家经验与智能体自动化 AI
              的共管平台，其履约成本涵盖云基础设施、数据接入与处理开销，以及约 1,200 名员工的专业工程薪酬。由于 ReliaQuest 未披露经审计的财务报表，核心单客经济指标——包括毛利率、获客成本（CAC）、CAC
              回本周期、净留存率（NRR）及客户集中度——无法依据公开信息获得独立核实。投资方资料称其运营已实现盈利，但投资评估需要经数据室对账，确认其自报的盈利究竟反映的是 GAAP
              净利润，还是扣除股权激励和交易相关费用前的非 GAAP 调整后 EBITDA。
