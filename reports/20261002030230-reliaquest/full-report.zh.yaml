      - number: '7.4'
        title: 支撑证据
        blocks:
          - type: callout
            title: ShinyHunters 事件后身份验证仍是核心脆弱点
            body: >-
              2026 年 8 月针对 ReliaQuest 的 ShinyHunters
              语音钓鱼攻击暴露了一项根本性的运营风险：安全运营中心本身就是黑客实施社会工程学攻击的首要目标。当防守方仅依赖普通的双因素认证，而缺乏绑定硬件的 FIDO2
              或生物识别通行密钥（Passkey）时，语音钓鱼即可绕过身份验证屏障，威胁客户机密性与平台完整性。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 合同免责条款将安全失陷风险转嫁回企业客户
            body: >-
              ReliaQuest 的标准平台与支持协议明显规避了服务商面临的运营失陷责任。第 14.d 条明确规定出现安全威胁并不构成违约，这为应对客户诉讼构筑了关键的法律抗辩防线，但也向企业买方传递出明确信号：MDR
              服务并不能免除企业自身的法律与安全责任。
            calloutType: insight
            claimRefs:
              - CR005
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场价格纪律
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，当前合理的投资决策为“观察 / 继续深入研究”，对该过程建议的置信度为“中”，在条款未公开的情况下投入新增资金的研判风险为“高”。独立报道印证了由 EQT、KKR 和 FTV Capital
              领投的超过 $500M 融资，以及由此确立的 $3.4B 估值基准。SDxCentral 亦报道其 ARR 突破 $300M、增速超过 30%
              且实现盈利，这虽是反映规模的重要证据，但仍属披露口径而非经审计的运营数据。入场价格依据并不完整：某市场数据源将 $300M 标注为收入，而其自身方法论却说明该数字可能实为 ARR；Forge
              平台亦未显示当前可交易的价格或投后估值。因此，入场纪律应锚定在经数据室核实的财务指标与安全条款上，而非仅凭头条估值。做出投资决定前，必须厘清清晰的 ARR
              与会计收入定义、分客群留存率与利润率、完全稀释后的股权结构表、优先清算权条款，以及能够支撑目标回报率的实际成交价。
            claimRefs:
              - CV001
