      - number: '3.3'
        title: 切换成本、锁定机制与被替代风险
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest 的企业防守壁垒建立在极高的组织切换成本之上，而非专有遥测数据的所有权。企业客户将 GreyMatter 深度集成于分散的云端、本地与身份认证技术中，在财富 500
              强客户中沉淀出跨越多年采购周期的运营工作流。该平台的通用转换器能够关联分散日志，若要替换 ReliaQuest，企业要么需要围绕 Microsoft E5
              这类巨头生态重构整套工具栈，要么由内部承担庞大的调查人力。然而，GreyMatter 的顶层覆盖架构本身也带来脆弱性：它叠加在既有的 SIEM 和 EDR
              合同之上，属于额外增加的“软件+服务”预算条目。一旦企业买方面对定制化检测规则交付排期过长、重复告警二次分诊引发疲劳，或多层集成复杂度过高，CFO 与 CISO
              便会重新权衡保留这一外挂附加层的净收益，转而审视原生平台整合或基于结果交付的新型 AI MDR。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
