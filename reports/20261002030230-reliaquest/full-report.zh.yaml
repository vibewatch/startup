      - 维度
      - 评估结论
      - 证据边界
      - 决策启示
    rows:
      - - 投资建议
        - 持续跟踪 / 深入调研
        - $3.4B 融资估值标记已获佐证，但缺乏当下可执行价格与完整经营数据。
        - 在虚拟数据室财务模型与拟定证券条款核实之前，切勿配置资金。
      - - 置信度
        - 对流程建议持中等置信度；对精确估值置信度较低
        - 融资与名义规模获多家信源报道，但分母与交易条款仍不透明。
        - 采用分阶段尽职调查，而非给予定点估值。
      - - 投资判断风险
        - 条款未披露情况下，新进资金风险极高
        - 留存率、利润率、现金造血能力、客户集中度以及清算优先权数据均未公开。
        - 必须要求提供经审计指标、资本结构表细节以及清算优先权分配瀑布模型。
      - - 估值立场
        - 在当前入场价格下无法确定
        - 2025 年 3 月的 $3.4B 标记已成历史；Forge 未显示任何当前可用价格或投后估值。
        - 将 $3.4B 视为参考锚点，而非公允价值。
      - - 回报 / 持有 / 退出
        - 公开证据不足以支撑
        - 所留存信源均未提供官方申报文件、退出时间表、老股转让撮合价格或股权分配瀑布机制。
        - 仅在完成交易与股本结构尽职调查后，再行设定回报与持有目标。
    notes: 证据截至 2026-10-02；评估明确区分了报道所称 ARR 与实际营收，对不可获取的交易条款予以明确标出而非主观估测。
    claimRefs:
      - CV001
