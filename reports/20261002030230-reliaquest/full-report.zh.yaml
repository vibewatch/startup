  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与架构三角对照
        blocks:
          - type: paragraph
            body: >-
              托管检测、响应与安全运营领域已分化出三种主流运作模式：传统 MDR、客户自营的 AI SOC 软件以及托管型智能体安全服务（AI MDR）。ReliaQuest 将 GreyMatter
              定位为中立于厂商的安全运营顶层覆盖，而非纯粹的托管检测与响应（MDR）服务，借助对企业现有工具的跨栈编排，明确规避单一厂商的锁定风险。然而，各竞对切入企业安全运营的权责划分与底层架构截然不同。Arctic
              Wolf、eSentire 与 Sophos 等传统 MDR 服务商运营大型托管 SOC 来监控客户遥测；Microsoft（Sentinel 与 Defender XDR）及 Palo Alto
              Networks（Cortex XDR 与 Unit 42）等纯平台整合商，则将原生遥测数据与专有智能体自动化（如 Cortex
              AgentiX）绑定，推动企业安全栈向自身收敛；与此同时，Intezer、Prophet Security 与 Dropzone AI 等客户自营的 AI SOC
              平台虽然将分诊工作流自动化，但仍将运营风险与事件响应责任留在企业内部团队。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
