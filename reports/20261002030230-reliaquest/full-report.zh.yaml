      - number: '2.3'
        title: 买方画像、用户、预算来源与落地路径
        blocks:
          - type: paragraph
            body: >-
              证据表明其目标客群为设有专职安全运营团队、采用多厂商技术栈、告警量巨大且拥有混合 IT 或 OT 资产的大型机构。CheckThat 将目标群体界定为员工规模至少 1,000 人的企业；ReliaQuest 的
              Circle K 案例则展现了采购触发点：跨越 25 个以上国家、超过 16,000 个站点的并购整合、老旧遗留系统、数据接入需求暴增以及威胁遏制耗时过长。因此，经济买方通常为 CISO
              或高级安全运营主管，实际用户为 SOC 分析师、工程师与威胁猎手，采购预算通常划拨自企业安全运营专项。落地过程依托于对接既有的 SIEM 与 EDR
              资产、推进工作流自动化，并验证遏制耗时缩短或分析师产能释放，而非从首日就全面推倒重构。
