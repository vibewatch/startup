      - number: '8.3'
        title: 乐观、基准与悲观情景框架
        blocks:
          - type: paragraph
            body: >-
              由于公开记录无法支撑对未来估值区间或概率做出精确预测，情景分析应保持假定性。在乐观情景下，尽调证实 ARR 稳居自报的 $300M 之上，同比增速保持在 30% 以上且盈利具备可持续性，留存率与利润率足以支撑高于
              2025 年 3 月基准估值的溢价入场。在基准情景下，运营声称大体属实，但根据当前增速、客户经济指标与融资条款，合理的入场估值应等于或低于该基准，并需设定明确的下行保护条款。在悲观情景下，ARR
              认定口径、增速、盈利、留存或利润率未能通过尽调核实，抑或缺乏流动性及高顺位优先权损害了投资人实际收益；此时正确的应对策略是大幅折价或放弃投资，而非硬造一个具体的点位预估。参考倍数在未上市与上市企业间分化巨大，这凸显了估值敏感性，而非提供了同口径的可比基准。因此，发生概率应属于尽调最终得出的结论，不能凭空臆造具体百分比。
