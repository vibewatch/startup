  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场的边界应限定在企业安全运营编排与托管检测与响应（MDR）领域，而非泛化的整个网络安全市场。ReliaQuest 将 GreyMatter
              定位为覆盖预防、检测、遏制、调查与响应的智能体平台，同时打通客户既有工具。这一架构将核心产品置于
              SIEM、EDR、云、身份认证及其他产生遥测数据的安全控制层之上，而非将上述领域的全部预算视为自身的可触达空间。相邻品类包括 XDR 与传统托管安全服务商（MSSP）。现状下的替代方案包括企业自建 SOC
              人力、单点工具工作流、既有 MSSP 或采购更多安全单品；公司过往发布的一份通告自身也承认，企业叠加更多工具与外包服务后，往往未必能取得预期效果。
