      nodes:
        - id: reported-scale
          label: 报道经营规模
          detail: ARR 超过 $300M、增速超过 30% 以及盈利性运营均为报道口径，在此未经审计。
          tone: positive
        - id: financing-marker
          label: 融资估值标记
          detail: 超过 $500M 的融资确立了报道所称的 $3.4B 估值标记。
          tone: neutral
        - id: denominator-check
          label: 分母校核
          detail: 一处市场数据信源混淆了营收与 ARR，限制了估值倍数的可比性。
          tone: warning
        - id: terms-check
          label: 条款与稀释校核
          detail: 所留存公开证据中无法获取股权结构表持股比例、清算优先权及投资者权利。
          tone: warning
        - id: liquidity-check
          label: 流动性校核
          detail: Forge 显示交易活跃度有限，且无可用现行价格或投后估值。
          tone: risk
        - id: conditional-decision
          label: 持续跟踪 / 深入调研
          detail: 仅在经审计财务指标、交易条款及可执行入场价格确立了回报支撑后，方可推进。
          tone: neutral
    approximationNotes: 该流程为定性且有序的分析链条；并不意味着存在预测概率、估值区间或因果转化率。
