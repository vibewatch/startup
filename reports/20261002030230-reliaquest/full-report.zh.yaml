            body: >
              ReliaQuest 的企业客户体量稳步扩增，从早期增长阶段的约 1,000 家企业账户，扩大至近期运营报告中披露的 1,300 多家企业客户。自首次获得机构私募股权注资以来，公司的年经常性收入已实现近 8
              倍增长，突破 $300 million ARR，依托分布在坦帕、盐湖城、拉斯维加斯、伦敦、都柏林和浦那六大运营中心的 1,200 名全球员工提供业务支撑。


              已获验证的客户生产环境部署展现出跨异构 IT 资产的显著运营体量与可量化的效率提升。零售巨头 Lowe's 将 GreyMatter 部署于门店系统、云环境与终端传感器中，披露其监控可视性提升
              200%，告警噪点减少 88%，威胁响应速度提升 70%。跨国制造企业 Signify 将横跨 IT、云端及欧洲制造工厂的安全运营集中化，自动化分诊节省了约 1,000 个分析师工时，告警噪点降低
              81%。全球通信服务商 Syniverse 借助 GreyMatter 弥补 MITRE ATT&CK 框架下的检测盲区，实现了告警噪点降低 98%、ATT&CK 威胁覆盖面提升 50%，平均事件解决耗时缩短
