  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与企业买方画像
        blocks:
          - type: paragraph
            body: >
              ReliaQuest 瞄准的是管理异构多厂商网络安全环境的中型市场与全球企业安全运营中心（SOC）。GreyMatter
              并不强求机构推倒现有工具，而是充当统一的安全控制中枢，接入、拼接并标准化跨越终端、云端、网络与 SIEM
              基础设施的各类遥测数据。核心经济买方通常是首席信息安全官（CISO）或安全运营副总裁，而日常一线用户则是二级和三级安全分析师、威胁猎手以及致力于摆脱一级告警重复初筛的检测工程师。


              企业客户跨越多个行业垂直领域，包括零售（Lowe's）、专业服务与法律（Kirkland & Ellis、Syniverse）、照明与工业制造（Signify），以及交通运输与消费餐饮（Southwest
              Airlines、Campbell's、Abercrombie & Fitch、Darden、Hanes Brands）。在上述客群中，采购的商业合理性集中在整合多余工具、放大团队产能杠杆（如 Signify
              在不增加员工的前提下监控范围扩大至 3 倍），以及缓解日均处理 50,000 条以上告警企业的疲劳感。然而，安全团队编制较紧凑的中型企业反馈称，GreyMatter
              在落地最终事件处置时，仍可能需要大量内部运营人员介入配合。
