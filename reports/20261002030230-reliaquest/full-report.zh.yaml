      - number: '6.3'
        title: 留存韧性、扩张动能与流失阻力
        blocks:
          - type: paragraph
            body: >
              ReliaQuest 的机构投资方披露其客户总留存率（GRR）达 97%，独立的员工敬业度与运营规范也进一步印证了这一韧性。该平台的“先落地后扩张”（land-and-expand）路径通常始于核心 SIEM
              与终端遥测数据的接入，逐步扩展至自动化剧本编排、多云源头检测以及外部威胁情报。客户还利用源头检测来遏制失控的数据接入成本，有据可查的客户案例显示，每日接入 SIEM 的数据量减少了 860GB，节省了 43%
              的第三方 SIEM 授权费用，平均检测耗时改善 92%。


              尽管具备上述已被证实的优势，但关于响应授权范围与采购透明度，关键尽调风险依然存在。来自安全买方的独立市场反馈显示，GreyMatter
              往往将告警附带调查建议退回给客户内部团队，而非直接执行自主的主动修复，这可能会引发运营摩擦。此外，由于 ReliaQuest
              仍属非上市企业，分客群经审计的净留存率（NRR）、获客成本（CAC）回本周期以及单一大客户集中度指标仍处于严格保密状态，头部大客户在年度合同总额中是否占据过高比重依然存疑。
