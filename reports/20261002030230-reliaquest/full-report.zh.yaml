  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 核心风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计 ARR 保持在 $300M 以上，增速维持在 30% 以上，盈利具备持续性，且客户留存率与利润率表现强劲。
        - 仅在经核实的单位经济效益足以支撑溢价时，才考虑高于 2025 年 3 月 $3.4B 标记的价格；公开数据无法支撑明确的估值区间。
        - 估值倍数压缩、增长减速，或系统部署未能有效转化为持久的经常性收入。
        - 仅在经审计财务指标与当前交易条款核实了公开经营声称后，概率方会上升。
      - - 基准
        - 名义经营宣称大体得到核实，但当前增长与融资权益仍存不确定性。
        - 将 $3.4B 标记作为估值上限参考，寻求在该价位或更低水平入场并附带下行保护；目标回报仍未量化。
        - 分母定义模糊、清算优先权压制，以及流动性受限。
        - 尽调查实业务规模、但运营效率或流动性不足以支撑溢价时成立。
      - - 悲观
        - ARR 分类、增速、盈利能力、留存率或利润率未能通过核实，或优先清偿条款损害普通股收益。
        - 要求较前期估值标记大幅折价，否则放弃投资；公开证据无法支撑精准的下行区间。
        - 下跌轮（Down round）、长期流动性匮乏、客户集中度过高，或不利的清算优先权分配瀑布。
        - 若审计数据与报道指标冲突，或当前价格发现依然缺失，该情景概率上升。
    notes: 上述内容属于附带条件的投资判断情景，而非预测；因无法获取当前经营与交易参数，未分配具体的数值概率或远期估值区间。
