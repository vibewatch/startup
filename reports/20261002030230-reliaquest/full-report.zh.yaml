    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与运营模式
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest 由 Brian Murphy 于 2007 年创立，总部位于坦帕，面向大型企业销售 GreyMatter 智能体 AI
              安全运营平台。其业务核心在于打通既有安全工具栈的遥测数据，在数据驻留或传输的原位检测威胁，并自动化推进调查与响应，无需客户全盘替换现有工具。公司宣传材料称该平台集成了 200
              多种网络安全工具；当前官网则另行披露了 300 多家技术合作伙伴，两处统计口径并不相同。因此，该业务本质上是横跨异构安全资产的订阅制“软件+服务”层，其定价机制与收入构成仍未公开。
