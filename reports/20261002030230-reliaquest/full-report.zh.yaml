  - id: TV002
    title: 正方论点 / 反方论点表
    columns:
      - 论点
      - 证据
      - 改变观点的条件
    rows:
      - - 正方：机构背书的业务规模
        - 最新报道的融资规模超过 $500M，投资方包括 EQT、KKR 与 FTV Capital。
        - 原始交易文件证实价格、证券类型、股权比例与投资者权利。
      - - 正方：经常性收入增长势头
        - SDxCentral 报道称 ARR 超过 $300M、增速超过 30%，且保持经营性盈利。
        - 经审计的 ARR、营收、现金造血能力及客户留存队列数据与公开声称吻合。
      - - 正方：明确的商业落地信号
        - LeadIQ 报告其客户超过 1,300 家；ReliaQuest 列出具名企业客户背书。
        - 独立客户访谈印证了续约、扩购与可衡量的业务价值。
      - - 正方：高校与机构部署信号
        - 佛罗里达州立大学称已在全新合作框架下开展 GreyMatter 实操培训。
        - 客户背景调查证实已进入生产环境实际应用，而非仅用于评估或培训。
      - - 反方：分母定义模糊
        - Multiples 将 $300M 标注为营收，但说明该轮融资关联数字可能是营收或 ARR。
        - 经审计财报确立一致的营收与 ARR 统计口径。
      - - 反方：缺乏流动性与价格不透明
        - Forge 报告交易活动有限，且无可用现行价格或投后估值。
        - 存在可验证的老股交易、定价融资轮次或公开申报文件，以确立当前价格发现。
      - - 反方：清算优先权与稀释情况不透明
        - 所留存信源均未披露完全稀释后的股权结构表或最新一轮融资清算优先权。
        - 公司章程与投资者权利文件展示出可接受的收益分配瀑布机制。
    notes: 本表将公司或合作伙伴发布的落地信号与独立的融资及市场数据来源区分开来；公开条款缺失列为尽调缺口。
