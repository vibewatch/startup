      - number: '3.2'
        title: 能力矩阵与技术取舍
        blocks:
          - type: paragraph
            body: >-
              将 ReliaQuest 与其他架构进行横向评估，可以发现遥测广度与调查深度之间存在关键权衡。ReliaQuest 拥有庞大的集成生态，涵盖 300 多家技术合作伙伴，单个企业环境日均接入告警超过 50,000
              条。为解决集中式数据汇总带来的延迟与高昂授权费用，ReliaQuest 强调向无 SIEM 安全架构做战略转型，在源头与传输过程中直接检查遥测数据，并推出 GreyMatter Attack 用于自动化 AI
              红队演练与暴露面验证。相比之下，Daylight Security 等新兴 AI MDR
              竞对对顶层覆盖模式发起挑战，直接在流式原始日志上运行专有检测规则，并开展双向“透明盒”调查，在工具源头关闭已解决的工单。CrowdStrike Falcon Complete
              等生态整合商能提供深度的自动化修复，但其主要调查精度受限于 Falcon 原生遥测数据，这说明连接器数量广泛并不等同于对每款集成工具都能实现深度告警分诊。
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
