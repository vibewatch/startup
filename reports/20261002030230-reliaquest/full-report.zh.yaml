            title: 外挂覆盖层的附加成本与告警二次分诊摩擦
            body: >-
              ReliaQuest 在竞品选型 PK 中的主要劣势属于结构性问题：GreyMatter 无法取代底层的 SIEM 或 EDR
              基础设施开销。当告警二次分诊反复出现且定制检测调优遭遇交付排期时，企业买方必须同时承担底层工具授权与顶层管理覆盖的双重开销，面临成本叠加压力。
            calloutType: risk
            claimRefs:
              - CP003
              - CP006
