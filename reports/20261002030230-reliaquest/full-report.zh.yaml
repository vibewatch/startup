      - number: '7.2'
        title: 合同免责条款与合规法律风险
        blocks:
          - type: paragraph
            body: >-
              ReliaQuest 的标准平台与支持协议在企业发生安全事件时，严格限制了自身的法律与财务赔偿责任。根据协议第 14.d 条，ReliaQuest 明确声明，不保证其 GreyMatter
              平台或持续赋能服务能够检测、调查或处置所有安全威胁，并明确规定发生实际安全威胁并不构成违约。合同条款还要求客户对自身数据的质量与安全性、备份服务及外部安全配置承担全部责任，同时将测试评估期的赔偿责任上限设为
              100 美元，并免除不可抗力网络中断的责任。尽管这些条款保护了 ReliaQuest
              免受灾难性的安全违约诉讼索赔，但当风险厌恶型买方针对关键业务安全运营要求更有力的赔偿承诺或财务担保时，往往会在企业采购谈判中引发分歧摩擦。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
