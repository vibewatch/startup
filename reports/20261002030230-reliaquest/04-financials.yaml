sections:
  - id: "revenue-model-and-streams"
    title: "Revenue Model, Pricing Mechanisms, and Contracting Structure"
    body: "ReliaQuest monetizes its Open XDR and Managed Detection and Response platform, GreyMatter, primarily through annual and multi-year subscription contracts. Rather than requiring enterprises to rip and replace their existing infrastructure, ReliaQuest charges for platform access and managed outcomes that integrate with over 200 security and telemetry technologies across customer environments. The revenue model combines recurring platform software fees with outcome-based managed detection, investigation, and response workflows. Although list pricing and discrete per-workload fees are not published publicly, user evaluations note a competitive initial setup cost paired with significant return on investment, while competing native tools often demand higher upfront tool licensing investments. Enterprise contracting typically involves custom enterprise agreements scaled by protected telemetry volume, integrated data sources, and organizational scope across hybrid cloud and on-premises deployments."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
      - "CI011"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "capital-adequacy-and-growth"
    title: "Capital Adequacy, Cumulative Financing, and Scale Metrics"
    body: "ReliaQuest exhibits substantial capital adequacy supported by top-tier private equity investors including EQT Growth, KKR, and FTV Capital. In March 2025, the company secured a growth financing round exceeding $500 million led by EQT Growth alongside KKR and FTV Capital, with participation from Ten Eleven Ventures and Finback Investment Partners. This round valued the business at $3.4 billion post-money, expanding total lifetime equity funding to $1.13 billion across multiple institutional rounds since 2016. Sponsoring investors noted that ReliaQuest quadrupled its annual recurring revenue since 2020, crossing the $300 million ARR threshold while expanding top-line revenue at greater than 30% year-over-year. Crucially, investor disclosures state that the company maintains profitable operations alongside its 30% expansion, significantly reducing near-term financing dependency and providing multi-year runway across its six global operating centers."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI013"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "cost-structure-and-underwriting-verdict"
    title: "Cost Structure, Unit Economics, and Diligence Verification Gaps"
    body: "While top-line scale milestones and headline valuations demonstrate commercial adoption across more than 1,000 enterprise customers, ReliaQuest's detailed cost structure remains undisclosed outside formal data rooms. As a co-managed platform integrating human SOC expertise with automated agentic AI, delivery costs span cloud infrastructure, data ingestion/processing overhead, and specialized engineering compensation for approximately 1,200 personnel. Because ReliaQuest does not report audited financial statements, key unit economics—including gross margin, customer acquisition cost, CAC payback velocity, Net Revenue Retention, and customer concentration—cannot be independently verified from public disclosures. Sponsoring investor materials characterize operations as profitable, but underwriting requires data-room reconciliation to confirm whether reported profitability reflects GAAP net income or non-GAAP adjusted EBITDA before stock-based compensation and transaction-related expenses."
    claimRefs:
      - "CI008"
      - "CI010"
      - "CI012"
      - "CI014"
      - "CI015"
