companyProfile:
  summary: >-
    ReliaQuest is a founder-led, Tampa-based cybersecurity company that sells GreyMatter, an agentic-AI
    security-operations platform designed to sit on top of customers' existing tools and automate detection,
    investigation, containment, and response. The company pairs software with managed security operations, targets large
    enterprises with complex heterogeneous environments, and has a long-running public profile of customer traction,
    sponsor backing, and product expansion, while keeping core financial and governance terms private.
