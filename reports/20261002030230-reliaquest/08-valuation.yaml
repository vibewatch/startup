chapter:
  number: 8
  title: "Valuation"
  summary: "ReliaQuest's March 2025 financing provides a corroborated $3.4B valuation marker alongside company-reported ARR above $300M and growth above 30%, but public sources do not establish a clean revenue denominator, current executable price, financing preferences, or exit liquidity. The evidence therefore supports a conditional track / research-more recommendation, not a price-ready investment decision."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and Price Discipline"
    body: >-
      The appropriate public-evidence decision is track / research more, with medium confidence in that process recommendation and high underwriting risk for new capital at undisclosed terms. Independent reports corroborate a financing of more than $500M led by EQT, KKR, and FTV Capital and a resulting $3.4B valuation marker. SDxCentral also reports ARR above $300M, growth above 30%, and profitability, which is meaningful evidence of scale but remains a reported rather than audited operating snapshot. The price case is not complete: one market-data source labels $300M as revenue while its own methodology says the recorded figure may instead be ARR, and Forge shows no available price or post-money valuation for a current transaction. Entry discipline should therefore anchor to verified data-room economics and security terms, not to the headline mark alone. A move to invest requires clean ARR and revenue definitions, retention and margin cohorts, a fully diluted cap table, preference terms, and an executable price that supports the target return.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV012"
      - "CV013"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The thesis is that substantial sponsor backing, recurring-revenue scale, reported growth, and visible deployment signals can support a durable security-operations platform. The historical capital record includes more than $300M of growth financing in 2020 after a prior $30M FTV Capital investment, while the current company site presents named customer testimonials and LeadIQ reports more than 1,300 customers. Florida State University's account of hands-on GreyMatter training offers partner-issued evidence that the platform is being evaluated in a live institutional setting. The anti-thesis is evidentiary and price-sensitive: the retained sources do not disclose audited ARR, revenue, gross margin, retention, cash generation, cap-table ownership, liquidation preferences, or a current secondary-clearing price. Company and partner proof is useful commercial signal but is not independent verification of unit economics. The thesis breaks if the reported ARR, growth, or profitability claims fail diligence, if retention and margins cannot support the entry multiple, or if preference overhang materially subordinates new or common equity.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "scenario-framework"
    title: "Bull, Base, and Bear Framework"
    body: >-
      Scenario analysis should remain conditional because the public record cannot support precise forward valuation ranges or probabilities. In the bull case, diligence confirms that ARR remains above the reported $300M level, growth remains above 30%, profitability is durable, and retention and margins justify paying above the March 2025 marker. In the base case, the operating claims broadly verify but current growth, customer economics, and financing terms warrant an entry at or below that marker with explicit downside protection. In the bear case, ARR classification, growth, profitability, retention, or margin evidence fails verification, or illiquidity and senior preferences impair investor proceeds; the correct response is a material discount or no investment rather than a fabricated point estimate. Multiples' displayed comparison set ranges widely across private and public companies, illustrating sensitivity rather than establishing an apples-to-apples benchmark. Probability signals are therefore diligence outcomes, not invented percentages.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV012"
      - "CV013"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-final-diligence"
    title: "Exit Readiness and Final Diligence"
    body: >-
      Public exit readiness is not established. Forge labels market activity limited and provides neither a Forge Price nor a post-money valuation for ReliaQuest, while warning that its private-market data is not audited or independently verified. No retained source supplies an IPO filing, definitive exit timetable, current secondary bid, fully diluted ownership schedule, or preference waterfall. The financing history and customer signals may support eventual strategic or public-market optionality, but they do not establish timing, proceeds, or a target return. Final diligence should reconcile ARR to recognized revenue and cash generation; inspect monthly retention, gross margin, customer concentration, and cohort expansion; review the charter, investor-rights agreements, debt, and all preference terms; and obtain primary transaction evidence for any proposed entry. Monitor for a current priced round, audited financial package, secondary trades, or an IPO filing. Until one of those signals arrives, the hold period and return case remain unquantified, and the recommendation should not be upgraded solely because the prior round attracted prominent sponsors.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
