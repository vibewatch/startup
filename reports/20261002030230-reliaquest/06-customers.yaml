chapter:
  number: 6
  title: "Customers"
  summary: "ReliaQuest has built an enterprise customer base spanning over 1,300 organizations, including Fortune 500 accounts such as Lowe's, Southwest Airlines, Signify, and Syniverse, driven by its vendor-agnostic GreyMatter Open XDR architecture. The company reports an industry-leading 97% gross retention rate and strong customer outcomes including 70% to 82% faster threat response times, but faces commercial risks from bounced-ticket response handoffs, undisclosed customer concentration, and lack of audited cohort net revenue retention figures."
sections:
  - id: "customer-segmentation-and-icp"
    title: "Customer Segmentation and Enterprise Buyer Persona"
    body: |
      ReliaQuest targets mid-market and global enterprise security operations centers that manage heterogeneous, multi-vendor cybersecurity environments. Rather than forcing organizations to rip and replace incumbent tools, GreyMatter acts as a centralized security control plane that ingests, stitches, and normalizes telemetry across disparate endpoint, cloud, network, and SIEM infrastructure. The primary economic buyer is typically the Chief Information Security Officer (CISO) or Vice President of Security Operations, while the daily hands-on users are Tier 2 and Tier 3 security analysts, threat hunters, and detection engineers seeking to eliminate repetitive Tier 1 alert triage.

      Enterprise adopters span diverse industry verticals including retail (Lowe's), professional services and legal (Kirkland & Ellis, Syniverse), lighting and industrial manufacturing (Signify), and transportation and hospitality (Southwest Airlines, Campbell's, Abercrombie & Fitch, Darden, Hanes Brands). Across these segments, the economic justification centers on tool sprawl consolidation, headcount leverage (such as Signify monitoring 3x more environment without adding headcount), and reducing alert fatigue where organizations process upwards of 50,000 alerts daily. However, mid-market organizations with leaner security teams report that GreyMatter can still require substantial internal operational involvement to perform final incident remediation.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU006"
      - "CU007"
      - "CU011"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "adoption-trajectory-and-deployment-proof"
    title: "Adoption Trajectory and Enterprise Production Deployments"
    body: |
      ReliaQuest's customer adoption has expanded steadily from approximately 1,000 enterprise accounts in earlier growth stages to over 1,300 enterprise customers as of recent operational reporting. The company's annual recurring revenue trajectory exhibits nearly 8x growth since initial institutional private equity backing, crossing $300 million in ARR supported by 1,200 global employees across operating centers in Tampa, Salt Lake City, Las Vegas, London, Dublin, and Pune.

      Verified customer production deployments demonstrate significant operational scale and quantifiable efficiency gains across heterogeneous IT estates. In retail, Lowe's deployed GreyMatter across store systems, cloud environments, and endpoint sensors, reporting a 200% visibility increase, 88% alert noise reduction, and a 70% acceleration in threat response speed. In multinational manufacturing, Signify centralized security operations across IT, cloud, and European manufacturing facilities, automating triage to save approximately 1,000 analyst hours and reducing alert noise by 81%. Similarly, global communications provider Syniverse deployed GreyMatter to address blind spots across MITRE ATT&CK, achieving a 98% reduction in alert noise, a 50% expansion in ATT&CK threat coverage, and an 82% improvement in mean time to resolve incidents.
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU002"
      - "TU003"

  - id: "retention-expansion-and-concentration-risk"
    title: "Retention Durability, Expansion Dynamics, and Churn Friction"
    body: |
      ReliaQuest's institutional investors report a 97% gross customer retention rate, which is further supported by independent employee engagement and operational discipline. The platform's land-and-expand motion typically begins with core SIEM and endpoint telemetry ingestion, expanding into automated playbook orchestration, multi-cloud detection at source, and external threat intelligence. Customers also leverage at-source detection to curb runaway data ingestion costs, with documented case results showing an 860GB per day reduction in SIEM ingest, delivering 43% savings in third-party SIEM licensing fees and a 92% improvement in mean time to detect.

      Despite these documented strengths, critical diligence risks persist around response authority and procurement transparency. Independent market feedback from security buyers indicates that GreyMatter can cause operational friction when alerts bounce back to customer internal teams with recommendations to investigate, rather than executing autonomous hands-on remediation. Additionally, because ReliaQuest remains private, audited cohort net revenue retention (NRR), customer acquisition cost (CAC) payback periods, and single-customer concentration metrics remain strictly undisclosed, leaving open questions regarding whether top enterprise accounts represent disproportional shares of annual contract value.
    claimRefs:
      - "CU004"
      - "CU011"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"

