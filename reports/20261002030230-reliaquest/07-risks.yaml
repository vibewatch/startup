callouts:
  - calloutType: "risk"
    title: "Identity Verification Remains Critical Failure Point Post-ShinyHunters Incident"
    body: "The August 2026 ShinyHunters vishing breach against ReliaQuest highlights a fundamental operational risk: security operations centers are prime targets for adversary social engineering. When defenders rely on standard multi-factor authentication without hardware-bound FIDO2 or biometric passkeys, voice phishing can successfully bypass identity verification controls, jeopardizing client confidentiality and platform integrity."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "insight"
    title: "Contractual Disclaimers Shift Breach Risk Back to Enterprise Clients"
    body: "ReliaQuest's standard Platform and Support Agreement clearly insulates the vendor from operational breach liability. Section 14.d's explicit statement that the occurrence of a security threat does not constitute a contractual breach provides vital legal defense against client lawsuits, yet it underscores to enterprise buyers that MDR services do not replace internal corporate liability frameworks."
    claimRefs:
      - "CR005"
      - "CR007"
