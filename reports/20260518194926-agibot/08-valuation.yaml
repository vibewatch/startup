        - SV011
        - SV012
      statement: >-
        Agibot produced its 10,000th humanoid robot in March 2026, reaching the milestone in approximately
        three months after crossing the 5,000-unit mark — a 4x acceleration in production throughput
        representing the fastest production ramp of any humanoid robot company globally as of Q1 2026.
      topic: production-scale-milestone
      freshness: current
      implications: >-
        Production scale is the primary signal supporting the ~$960M valuation anchor; no comparable humanoid
        startup has achieved equivalent throughput.

    - id: CV002
      type: third-party-reported
      confidence: high
      sourceRefs:
        - SV001
        - SV025
        - SV026
      statement: >-
        Omdia (cited by Humanoid Index) ranks Agibot #1 in global humanoid shipments for 2025, with
        approximately 5,100 units shipped. This ranking is the primary basis for Agibot's claim to
        global production leadership; the methodology excludes research and show units from some
        competitors but has not been independently cross-validated.
      topic: omdia-shipment-ranking
      freshness: current
      implications: >-
        #1 shipment ranking supports a premium valuation relative to production-stage peers; contested
        by Unitree's self-reported 5,500 unit figure, which is not independently verified.

    - id: CV003
      type: observed
      confidence: high
      sourceRefs:
        - SV013
        - SV014
        - SV016
      statement: >-
        Agibot's G2 robot completed 2,283 tasks with zero errors during an 8-hour continuous operation
        at Longcheer Technology's tablet production facility in Nanchang, Jiangxi, achieving 310 products
        per hour and a cycle time of 18–20 seconds — confirming industrial-grade reliability at a live
        production line.
      topic: g2-zero-error-deployment
      freshness: current
      implications: >-
        Most compelling single commercial proof point in the humanoid sector as of May 2026; de-risks the
        industrial RaaS thesis but remains a single-customer data point.

