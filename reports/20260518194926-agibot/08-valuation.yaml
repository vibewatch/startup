        gross margin, or burn rate has been publicly disclosed as of May 2026. This opacity prevents
        independent financial diligence and increases the information asymmetry between insider investors
        (BYD, Tencent, JD.com) and prospective secondary or new-round investors.
      topic: financial-disclosure-opacity
      freshness: current
      implications: >-
        Financial opacity is the single largest diligence gap; without any revenue anchor, all valuation
        estimates are scenario-weighted projections rather than fundamental analyses.

    - id: CV038
      type: observed
      confidence: medium
      sourceRefs:
        - SV003
        - SV004
        - SV026
      statement: >-
        The Swancor Advanced Materials acquisition (CNY 2.1B, ~$290M consortium commitment) is the
        largest capital event in Agibot's history, representing a vertical integration into upstream
        high-performance composite materials. The strategic rationale — reducing carbon-fiber and
        actuator component costs — is plausible but unverified; integration timeline and synergy
        metrics have not been disclosed.
      topic: swancor-acquisition-risk
      freshness: current
      implications: >-
        CNY 2.1B commitment absorbs significant capital; if integration is successful, it could deliver
        COGS advantages that support the bull case; if unsuccessful, it is a material distraction and
        financial liability.

    - id: CV039
      type: inferred
      confidence: low
      sourceRefs:
        - SV019
        - SV030
        - SV027
      statement: >-
        The geopolitical risk premium embedded in Agibot's ~45% discount to Western humanoid peers is
        estimated at 20–30 percentage points, reflecting: US Security Robotics Act risk, enterprise
        procurement hesitation in US-aligned markets, CFIUS-equivalent barriers limiting Western strategic
        M&A, and reduced IPO optionality in US capital markets.
      topic: geopolitical-risk-premium
      freshness: current
      implications: >-
        Geopolitical risk premium is systematic and structural, not idiosyncratic; it cannot be reduced
        through company-level actions and must be modeled as a permanent ceiling on Western-market exit
        multiples.

    - id: CV040
      type: observed
      confidence: high
      sourceRefs:
        - SV002
        - SV003
        - SV004
      statement: >-
        No IPO timeline, STAR Market registration filing, or overseas listing intent has been publicly
        disclosed by Agibot as of May 2026. The most probable near-term liquidity pathway for investors
        is a Series C round at a higher post-money valuation, driven by industrial deployment proof.
      topic: ipo-readiness-status
      freshness: current
      implications: >-
        Absence of IPO timeline increases hold-period uncertainty; investors should model a 4–6 year
        hold to liquidity based on comparable-stage Chinese deep-tech company timelines.

    - id: CV041
      type: estimated
      confidence: medium
      sourceRefs:
        - SV003
        - SV006
        - SV025
      statement: >-
        Agibot's most probable strategic acquirer pathways are: (1) Chinese state-owned or state-adjacent
        industrial companies (CATL, BYD, SAIC, State Grid Corporation of China) as part of national
        embodied intelligence infrastructure buildout; (2) South Korean strategic buyers (LG Electronics,
        Samsung, Hyundai Motor) bridged through LG's existing investor position; (3) a Japanese or
        European industrial conglomerate in a non-CFIUS jurisdiction.
      topic: strategic-acquirer-pathways
      freshness: current
      implications: >-
        LG Electronics' existing position is the most actionable Western exit bridge; Korean and
        Japanese strategic acquirers are the most viable non-China exit pathway given US CFIUS barriers.

    - id: CV042
      type: inferred
      confidence: low
      sourceRefs:
        - SV003
