      topic: gs-growth-forecast-validation
      freshness: current
      implications: >-
        Goldman Sachs' framework provides external validation that Agibot's industrial transition is
        consistent with industry-wide trajectory; reduces model risk on growth assumptions.

    - id: CV031
      type: estimated
      confidence: medium
      sourceRefs:
        - SV031
        - SV009
        - SV007
      statement: >-
        Mordor Intelligence and IDC project CAGR of 45–65% for the industrial humanoid robot market
        through 2030; even at the lower end, a $300M ARR at 5% China market share by 2028 is
        a plausible base-case assumption given Agibot's current production leadership.
      topic: market-growth-rate-validation
      freshness: current
      implications: >-
        High market CAGR supports premium entry multiples but also signals that competition will
        intensify; first-mover advantage window is approximately 24–36 months.

    - id: CV032
      type: observed
      confidence: high
      sourceRefs:
        - SV019
        - SV030
        - SV020
      statement: >-
        US lawmakers introduced the American Security Robotics Act on March 26, 2026, which would
        prohibit US government agencies from procuring Chinese-origin humanoid and mobile robots.
        The bill has bipartisan sponsorship and reflects a political consensus on Chinese robot
        procurement risk that mirrors the treatment of Huawei in telecom and DJI in enterprise drones.
      topic: us-security-robotics-act
      freshness: current
      implications: >-
        Most material single adverse risk to Agibot's Western market expansion thesis; enterprise
        buyers in US-aligned sectors are likely to apply the bill's logic preemptively before formal passage.

    - id: CV033
      type: third-party-reported
      confidence: medium
      sourceRefs:
        - SV020
        - SV030
        - SV019
      statement: >-
        Hill Dickinson's legal analysis and WSJ coverage identify legal liability frameworks, data
        sovereignty requirements, and safety certification standards as three fast-moving regulatory
        dimensions for humanoid robots in 2026 — all creating structural compliance barriers for
        Chinese-origin robots seeking Western enterprise deployment, independent of legislative outcomes.
      topic: legal-regulatory-western-barriers
      freshness: current
      implications: >-
        Legal and regulatory complexity amplifies the commercial barriers created by legislation;
        even without the Security Robotics Act passing, enterprise legal risk assessment creates
        de facto exclusion in US-adjacent sectors.

    - id: CV034
      type: observed
      confidence: high
      sourceRefs:
        - SV021
        - SV008
        - SV007
