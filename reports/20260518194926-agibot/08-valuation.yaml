        - SV006
        - SV010
      statement: >-
        LG Electronics and the Mirae Asset-LG Electronics New Growth Fund made their first-ever investment
        in China's embodied intelligence sector through a strategic round in Agibot in August 2025.
        The round was described as strategic; the investment amount was not disclosed.
      topic: lg-mirae-strategic-investment
      freshness: current
      implications: >-
        LG Electronics' investment signals Korean industrial and electronics manufacturing appetite for
        Agibot humanoids; creates bridge to South Korean strategic acquirer optionality.

    - id: CV006
      type: observed
      confidence: high
      sourceRefs:
