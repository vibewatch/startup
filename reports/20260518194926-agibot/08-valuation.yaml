        exclusion risk.
      topic: china-domestic-market-offset
      freshness: current
      implications: >-
        Domestic China market alone (manufacturing, logistics, infrastructure) is large enough to support
        the base-case valuation if Agibot captures 3–5% market share; bear case requires failure in both
        Western and domestic segments.

    - id: CV035
