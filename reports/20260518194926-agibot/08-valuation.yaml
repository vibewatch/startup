      type: private-evidence-only
      topic: Revenue, ARR, gross margin, and burn rate
      description: >-
        No Agibot revenue, ARR, gross margin, or burn rate has been publicly disclosed as of May 2026.
        This is the single largest blocking diligence gap; all valuation estimates rest on production-
        volume signals and scenario modeling rather than fundamental financial analysis.
      severity: blocking
      relatedQuestionRefs:
        - QV002
        - QV012
        - QV024
        - QV034
      mitigationPath: >-
        CFO direct engagement in investor data room; Longcheer parent (603341.SH) earnings call review
        for partner-referenced cost disclosures; wait for CSRC IPO disclosure requirements if STAR Market
        filing proceeds.

