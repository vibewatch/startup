        first-mover industrial advantage in Western manufacturing contexts.
      topic: figure-ai-helix-competitive-risk
      freshness: current
      implications: >-
        Helix represents a capability-narrative risk; Agibot's manufacturing moat depends on demonstrated
        repeat deployments, quality track record, and China supply chain cost advantages that Helix alone
        cannot replicate.

    - id: CV037
      type: observed
      confidence: medium
      sourceRefs:
        - SV003
