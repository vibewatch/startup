        Agibot's pre-money valuation exceeded CNY 7 billion (~$960M at July 2025 exchange rates) at the
        time of the LG Electronics / Mirae Asset strategic round in August 2025. The post-money valuation
        is estimated at $1.0B–$1.3B based on this anchor and typical undisclosed round-size conventions
        for Chinese private companies at this stage.
      topic: pre-money-valuation-anchor
      freshness: current
      implications: >-
        Best available public valuation anchor; all scenario modeling and comparable analysis is referenced
        to this estimate. Post-money remains unconfirmed.

