        structural downward price pressure in the developer, research, and lower-tier commercial segments
        that could limit Agibot's addressable market in price-sensitive verticals.
      topic: unitree-price-pressure
      freshness: current
      implications: >-
        Unitree's pricing strategy risks locking in platform standards at lower price points; Agibot's
        differentiation must be demonstrated through industrial-grade performance and durability metrics
