        baseline in 2025 to multi-billion dollar scale by 2030, with manufacturing and logistics as the
        two highest-priority deployment verticals. Goldman Sachs projects a potential 250,000+ humanoid
        robot market by 2030 in industrial applications, representing a multi-hundred-billion-dollar TAM.
      topic: market-size-and-growth
      freshness: current
      implications: >-
        TAM supports aggressive valuation multiples in the bull case; Agibot's production scale positions
        it to capture a disproportionate share of early Chinese market deployment.

