        - SV002
      statement: >-
        Agibot's QCC corporate registry listing shows more than 50 shareholders, including BYD (A+, 2023),
        Tencent Ventures (B, March 2025), JD.com / JoyGen (B+, May 2025), Gaorong Capital, Sequoia
        China (via shareholder vehicles), TCL Ventures, Longcheer Technology (603341.SH), and Wolong
        Electric Drive (600580.SH) — confirming a supply-chain-integrated, ecosystem-linked investor base
        extending well beyond the disclosed $83.8M in venture capital.
      topic: investor-base-composition
      freshness: current
      implications: >-
        Strategic investors representing automotive supply chain (BYD, Wolong Electric), consumer
        electronics distribution (JD.com), and software/AI (Tencent) provide an integrated ecosystem
        unlikely to be replicated by Western competitors.

    - id: CV007
      type: observed
      confidence: high
      sourceRefs:
        - SV007
        - SV008
        - SV009
      statement: >-
        Goldman Sachs' "Humanoid Robot: The AI Accelerant" report and IDC's 2026 humanoid robotics
        commercialization analysis both identify manufacturing scale and industrial deployment proof as
        the two primary value drivers for private-market humanoid robot valuations; Agibot leads globally
        on both dimensions as of May 2026.
      topic: analyst-validation-of-value-drivers
      freshness: current
      implications: >-
        Independent analyst frameworks confirm Agibot's production-volume and deployment-proof credentials
        as the right metrics for investment evaluation, reducing model risk in the valuation approach.

    - id: CV008
      type: third-party-reported
      confidence: medium
      sourceRefs:
        - SV025
        - SV026
        - SV027
      statement: >-
        Agibot's ~$960M pre-money valuation at the August 2025 round represents a 45–70% discount to
        Western humanoid robot peers at equivalent or earlier production stages: Figure AI at ~$3.2B,
        Agility Robotics at $1.75B, and 1X Technologies at an implied $3–5B Series C range.
      topic: relative-valuation-discount
      freshness: current
      implications: >-
        Relative discount creates an attractive entry point for China-tolerant investors but reflects
        a geopolitical premium ceiling and financial opacity, not a fundamental valuation gap.

