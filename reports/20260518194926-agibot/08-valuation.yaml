        China's new humanoid robot standards issued in March 2026 are being shaped by Agibot's
        production leadership, creating a domestic regulatory tailwind.
      topic: international-market-entry-and-standards
      freshness: current
      implications: >-
        CES 2026 debut represents Western market intent; Chinese standards leadership strengthens
        domestic procurement position; both reinforce the international expansion thesis.

