  - id: TV005
    title: "Thesis-Break and Kill Trigger Table"
    columns:
      - "Trigger"
      - "Threshold / Event"
      - "Transmission to Thesis"
      - "Action Implication"
    rows:
      - - "US Security Robotics Act (or equivalent) signed into law"
        - "Final passage and presidential signature of any US statute banning Chinese robot procurement"
        - "Eliminates North American enterprise segment; signals EU and allied procurement follow-on restrictions; compresses exit pathway to China-only or non-aligned markets"
        - "Immediate SELL trigger for investors with global mandate; TRACK for China-domestic investors; re-evaluate Western strategic acquirer optionality"
      - - "No second industrial manufacturing customer announced by Q4 2026"
        - "Zero new industrial production-line customers at >20 deployed units by December 2026"
        - "Longcheer remains single data point; industrial RaaS thesis cannot be validated; base-case revenue trajectory impaired"
        - "Downgrade to PASS unless second customer materializes; monitor Longcheer expansion to 100 units as partial substitute signal"
      - - "Swancor acquisition integration failure or capital call"
        - "CSRC investigation, Swancor earnings miss >30%, or Agibot required to inject additional capital above CNY 500M beyond initial commitment"
        - "Balance-sheet stress; management bandwidth consumed by non-core integration; reduces capacity for R&D and deployment scaling"
        - "Request integration milestone disclosure; treat CNY 2.1B commitment as contingent liability in valuation model"
      - - "Industrial deployment quality failure at scale"
        - "Publicly reported safety incident, actuator failure rate >5%, or customer withdrawal from G2 program"
        - "Destroys manufacturing-sector trust; triggers regulatory inspection; rivals use incident to displace Agibot in customer conversations"
        - "Immediate PASS trigger; resume monitoring only upon root-cause disclosure and independent safety audit"
      - - "Down-round below CNY 5B ($700M)"
        - "Confirmed financing at post-money below CNY 5B or structured debt raise signaling equity price floor"
        - "Signals investor community loss of confidence in industrial transition; preference stack creates dilution cliff for earlier rounds"
        - "Exit assessment; monitor whether strategic Chinese-state buyer emerges at distressed price"
    notes: >-
      Thesis-break triggers are defined against observable events, not analyst opinions. All triggers can
      be monitored via public press coverage, CSRC filings, or Agibot official announcements. Thresholds
      were set to reflect the minimum signal strength that would materially alter the base-case
      investment thesis rather than incremental negative news.
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036

  - id: TV006
    title: "Final Diligence Asks Table"
    columns:
      - "Topic"
      - "Missing Evidence"
      - "Why It Matters"
      - "Owner / Diligence Path"
    rows:
      - - "Industrial ARR and unit economics"
        - "No Agibot revenue, ARR, or per-unit contract economics have been publicly disclosed; Longcheer contract value, duration, and renewal terms unknown"
        - "Entire industrial RaaS thesis is unverifiable without any revenue anchor; impossible to assign a revenue multiple or validate $960M+ pre-money"
        - "CFO direct engagement or investor data room; compare against Longcheer parent (Longcheer Technology 603341.SH) earnings call disclosures"
      - - "Swancor Advanced Materials integration plan and capital allocation"
        - "CNY 2.1B acquisition strategic rationale, integration timeline, and expected synergy metrics not publicly disclosed"
        - "Acquisition represents a capital commitment 2–3x larger than disclosed VC raises; unclear if it enhances or distracts from humanoid robot core thesis"
        - "CSRC and Shenzhen exchange public filings for Swancor (acquiring-entity filings); direct founder engagement on integration milestones"
      - - "US Security Robotics Act legislative status and enterprise buyer response"
        - "Bill introduced March 26, 2026 but not yet passed; enterprise buyer procurement freeze uncertain in scope and duration"
        - "US-market and US-aligned market exclusion is the single largest bear-case driver; legislative status determines Western TAM accessibility"
        - "Congressional tracking services; enterprise buyer reference checks in logistics, healthcare, and manufacturing sectors"
      - - "Cap-table structure, preference stack, and anti-dilution provisions"
        - "QCC shows 50+ shareholders but no preference stack, liquidation waterfall, or anti-dilution clause details"
        - "Returns to common shareholders at any exit scenario depend critically on preference multiplier and participation rights; undisclosed structure prevents return modeling"
        - "Corporate attorney review of AGIBOT Innovation (Shanghai) Technology Co., Ltd. registered capital filings; direct legal counsel engagement through Series B lead investors"
      - - "Second industrial manufacturing customer at commercial scale"
        - "Only Longcheer Technology confirmed as G2 industrial deployment customer; planned expansion to automotive and semiconductor sectors not yet announced with a named counterparty"
        - "Single-customer industrial proof is a necessary but insufficient condition for valuation; second named customer at 20+ units is the minimum required to confirm repeatability"
        - "Agibot official announcements; AIMA developer ecosystem partner disclosures; direct VP Sales engagement"
    notes: >-
      Diligence asks are ordered by urgency and materiality. Items 1 and 3 (industrial ARR and US Act
      status) are 90-day asks that should be resolved before any new capital commitment. Items 2, 4,
      and 5 are 6–18 month asks that define the upgrade trigger from TRACK to a conditional BUY
      recommendation.
    claimRefs:
      - CV040
      - CV041
      - CV042

