sections:
  - id: section-revenue-model
    title: Revenue Streams, Pricing, and Monetization
    body: >-
      AGIBOT's monetization model combines hardware product sales, a rental/robot-as-a-service (RaaS)
      offering, and a growing layer of software add-ons and platform services. The clearest pricing
      signals come from the company's global online store (store.agibot.com), which publicly lists the
      X2 half-size entertainment humanoid at $24,240 USD and the full-size A2 Lite entertainment humanoid
      at $44,560 USD. Both products carry a $500–$3,000 shipping deposit with customers responsible for
      all import duties and taxes. A one-year warranty (or 3,000 cumulative operating hours, whichever
      comes first) is included. The A2 Ultra — AGIBOT's flagship commercial-grade full-size humanoid —
      is not listed with a public price; based on the official product page, it has been deployed in
      over 20 leading enterprises for showroom, customer service, and brand-endorsement applications.
      Pricing for A2 Ultra is negotiated B2B and has not been disclosed.

      Beyond outright hardware sales, AGIBOT has established a "global rental platform" through which
      the company or its distribution partners offer humanoid robots for short-term commercial use.
      Humanoids Daily reported the rental rate for the hospitality vertical at €899 per day, with
      deployments including Genting Malaysia (MOU signed April 17, 2026) and Singapore through a
      Robot-as-a-Service arrangement with Singtel. While €899/day provides a concrete rental price
      point, the contract structure (minimum terms, volume tiers, maintenance inclusion) has not been
      independently confirmed.

      Software-layer monetisation is explicitly documented in AGIBOT's product FAQs: group control
      software, upgraded skill packs, and the VR remote control kit for the A2 Lite and A2 Ultra
      require "additional payment." Pricing for these components is not publicly disclosed, but the
      presence of a "skill pack shop" and AIMMASTER client software suggests a growing attach-revenue
      opportunity alongside hardware. The AIMA open-stack developer ecosystem, launched at APC 2026,
      targets third-party developers building applications on AGIBOT hardware; commercial licensing
      or API pricing has not been announced. Industrial deployment revenue from the G2 platform at
      factory customers (Longcheer Technology, planned expansion to automotive and semiconductors)
      represents a fourth revenue stream with entirely undisclosed project economics.
