company:
  name: Agibot

chapter:
  number: 4
  title: Financial Analysis
  summary: >-
    AGIBOT generates revenue through three primary channels: outright hardware sales (X2 at $24,240 and
    A2 Lite at $44,560 list price; A2 Ultra at undisclosed B2B price); a global rental/RaaS platform for
    hospitality and commercial deployments reportedly priced at €899 per day; and nascent industrial
    deployment contracts (G2 at Longcheer, 100 units planned by Q3 2026). Software add-ons — skill packs,
    group control software, and VR kits — add undisclosed incremental revenue. Disclosed venture capital
    stands at approximately $83.8 million across 10+ rounds; a parallel CNY 2.1 billion (~$290 million)
    acquisition of listed materials company Swancor Advanced Materials represents additional capital
    deployment that substantially exceeds the disclosed VC base. Reported pre-money valuation exceeds
    7 billion yuan (~$960 million). Revenue, gross margin, burn rate, and cash runway are entirely
    undisclosed, creating blocking diligence gaps. The proposed US American Security Robotics Act
    (March 2026) represents a material adverse risk to government-facing revenue, and competing
    shipment-count claims from Unitree introduce uncertainty about the revenue proxy implied by
    production milestones.

