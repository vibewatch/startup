  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-and-arr
      missingEvidence: >-
        AGIBOT has not disclosed total revenue, revenue by stream, ARR, MRR, or any financial results
        for any period through May 2026. Production volume (10,000 units) and confirmed deployments
        (20+ enterprises, Longcheer G2 programme) are proxies but cannot substitute for confirmed
        revenue data.
      whyItMatters: >-
        Without revenue, the investment thesis — that AGIBOT's production leadership translates into
        financial returns — cannot be validated. Revenue trajectory, cohort economics, and the ratio
        of recognised revenue to production cost are all unassessable from public information.
      diligencePath: >-
        Require management accounts or audited financials for FY2024 and FY2025; revenue breakdown
        by channel (hardware, rental, industrial deployment, software); MRR or ARR build by quarter;
        customer-level revenue for Longcheer and top-10 accounts.
      relatedQuestionRefs:
        - QI028
        - QI003
        - QI019

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin-and-cogs
      missingEvidence: >-
        COGS per unit, gross margin by product line, and service-delivery cost per deployed G2 unit are
        entirely undisclosed. The $44,560 and $24,240 list prices cannot be translated into gross profit
        without COGS data.
      whyItMatters: >-
        Negative gross margin at current volumes would materially increase capital requirements and reset
        the timeline to cash-flow breakeven. The hardware-first revenue model may require subsidising
        unit sales to build the installed base before software and RaaS layers become material.
      diligencePath: >-
        Require COGS waterfall per SKU per production batch (BOM, manufacturing labour, QC, warranty
        reserve, freight); gross margin by revenue stream; confirmed improvement trajectory across
        production volume milestones.
      relatedQuestionRefs:
        - QI006
        - QI010
        - QI012

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate-and-runway
      missingEvidence: >-
        Monthly cash consumption, treasury balance, and forward runway are entirely undisclosed. The
        Swancor acquisition (~$290M) and manufacturing scale investment imply capital consumption
        well above the $83.8M disclosed VC figure.
      whyItMatters: >-
        Without burn and runway data, it is impossible to assess whether AGIBOT faces a near-term
        financing cliff, how the Swancor acquisition impacts liquidity, or what dilution rate investors
        should expect in future rounds.
      diligencePath: >-
        Require treasury position as of Q1 2026, monthly cash-burn breakdown (manufacturing, R&D,
        G&A, sales), forward capital plan, and terms of any existing debt or credit facilities.
      relatedQuestionRefs:
        - QI011
        - QI016
        - QI009

    - type: private-evidence-only
      severity: material
      topic: industrial-deployment-contract-economics
      missingEvidence: >-
        Contract pricing, unit economics, and ROI structure for G2 industrial deployments (Longcheer
        and planned pipeline) have not been disclosed in any public source reviewed. Similarly, the
        A2 Ultra list and realised pricing in the B2B commercial channel is entirely undisclosed.
      whyItMatters: >-
        Industrial deployment is the thesis-critical revenue stream. If G2 deployments are priced below
        fully-loaded cost (as a market penetration strategy), the current deployment programme may be
        consuming capital rather than generating returns, and the scale timeline is longer than implied
        by production headlines. A2 Ultra B2B pricing gap also leaves the largest commercial hardware
        SKU with no financial proxy.
      diligencePath: >-
        Obtain G2 deployment contract template (per-unit purchase price, monthly service fee, contract
        duration, SLA); Longcheer ACV; pipeline by stage and conversion rate; expected contribution
        margin per deployed robot per month. Request A2 Ultra enterprise price list and volume tiers.
      relatedTableRefs:
        - TI003
      relatedQuestionRefs:
        - QI001
        - QI004
        - QI015

