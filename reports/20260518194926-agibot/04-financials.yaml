  - id: section-capital
    title: Capital Adequacy, Financing Dependency, and IPO Signals
    body: >-
      AGIBOT has completed more than ten financing rounds since February 2023; the full chronology is
      documented in the Company Overview chapter and is referenced here only as context for capital
      adequacy assessment. Disclosed venture capital stands at approximately $83.8 million per Tracxn
      and HumanoidIndex. However, this figure almost certainly understates total capital raised:
      Chinese private company disclosures are often partial, and the QCC corporate registry shows
      40+ shareholders spanning multiple undisclosed round sizes. Key rounds from QCC data include
      BYD's A+ participation (August 2023), Tencent's Series B (March 2025), JD.com/JoyGen's B+ round
      (May 2025), and the LG Electronics / Mirae Asset New Growth Fund strategic round (August 2025).
      AGIBOT declined to disclose the size of the LG Electronics / Mirae Asset round or the implied
      post-money valuation; Pandaily reported a pre-money valuation exceeding 7 billion yuan (roughly
      $960 million at July 2025 exchange rates).

      The most consequential capital event is the Swancor Advanced Materials acquisition. On July 8,
      2025, Swancor Advanced Materials (A-share listed, Shenzhen) disclosed that a consortium comprising
      AGIBOT and its core team agreed to pay up to CNY 2.1 billion (~$290 million USD) for control of
      the company. This exceeds AGIBOT's total disclosed VC funding by roughly 3.5× and represents a
      material upstream vertical-integration bet on high-performance materials. AGIBOT clarified that
      it has no definite plans to change Swancor's main business within 12 months and denied a backdoor
      stock-market listing, but market participants' suspicion of a listing route is noted as a live
      hypothesis. The acquisition sharply increases AGIBOT's financing requirement and reduces the
      capital available for robotics R&D and deployment.

      IPO signals: Reuters (via US News, March 2026) reported that AGIBOT and Unitree are among Chinese
      humanoid robot companies preparing to list in China in 2026. No formal prospectus, roadshow date,
      or underwriter appointment has been announced. Revenue and gross margin must be disclosed in any
      A-share or equivalent listing process; the timing of this disclosure may be the first opportunity
      for public investors to see confirmed financial metrics. Until then, revenue, burn rate, and cash
      runway remain entirely undisclosed, creating a blocking-severity gap for financial underwriting.
