        - label: "Customer Acquisition (Entertainment / Commercial)"
          detail: "Enterprise customer or venue operator purchases X2 ($24,240), A2 Lite ($44,560), or A2 Ultra (undisclosed B2B) outright; add-on software and skill packs provide incremental revenue"
        - label: "Customer Acquisition (Industrial / Manufacturing)"
          detail: "Factory operator (e.g. Longcheer) deploys G2 units on production lines; 4-month integration timeline; project-based or per-unit pricing undisclosed"
        - label: "Customer Acquisition (Rental / RaaS)"
