  - id: TI005
    title: "Public financial gaps table"
    columns:
      - Missing Metric
      - Why It Matters for Underwriting
      - Impact if Gap Persists
      - Diligence Path
    rows:
      - - Revenue (total; by stream; by geography)
        - Confirms whether production-volume proxy translates into recognized revenue; determines ARR run-rate and growth trajectory
        - Blocking — investment thesis cannot be validated without revenue trajectory; no LTV, payback, or growth-rate model is possible
        - Require management accounts (FY2024 and FY2025) and revenue breakdown by channel (hardware vs rental vs industrial deployment)
      - - Gross margin and COGS per SKU
        - Determines if hardware business is above-water; if negative at current volumes, capital requirement to reach profitability is much larger
        - Blocking — negative gross margin at scale would reshape capital-raise sizing and timeline materially
        - Require COGS waterfall per product generation; BOM, manufacturing labour, QC, warranty; separate hardware vs services margin
      - - Cash on hand, burn rate, and runway
        - Determines urgency of next fundraise; with Swancor acquisition, capital consumption is likely well above disclosed VC
        - Blocking — without burn and runway, capital adequacy and dilution risk cannot be assessed
        - Require treasury position as of Q1 2026, monthly cash consumption, and forward capital plan
      - - Industrial deployment contract economics (G2 Longcheer and pipeline)
        - G2 industrial deployment is the thesis-critical high-value revenue stream; pricing and margin are completely unknown
        - Material — if G2 economics are marginal or below COGS at early volumes, the industrial revenue ramp will require additional subsidy capital
        - Require G2 deployment contract template (pricing, duration, service fee, exclusivity); Longcheer contract ACV; customer pipeline by stage
    notes: >-
      This table reflects information gaps as of the report date (May 2026). All four gaps are considered
      material or blocking for investment underwriting. None can be resolved from public sources alone;
      all require formal data-room access. The Company Overview chapter documents the funding chronology;
      this table focuses specifically on forward capital adequacy and revenue quality gaps.
    claimRefs:
      - CI031
