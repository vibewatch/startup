  - id: TI003
    title: "Unit economics table"
    columns:
      - Metric
      - Value / Estimate
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - Hardware COGS per A2 Lite unit
        - Undisclosed; estimated $15,000–$30,000 based on automotive-grade production and 92-checkpoint QC (analogous to peer benchmarks)
        - Low (estimated)
        - Determines gross margin on largest publicly-priced SKU ($44,560 list); negative margin at current volumes would indicate hardware sold below cost
        - Require COGS waterfall (BOM, manufacturing labour, QC, freight, warranty reserve) per SKU per batch
      - - Hardware COGS per X2 unit
        - Undisclosed; estimated $8,000–$18,000 at current volumes (half-size, fewer DOF)
        - Low (estimated)
        - $24,240 list price; if COGS > $20,000, gross margin is negative or very thin
        - Require per-unit COGS and gross margin data from management accounts
      - - Manufacturing cost improvement per 10× volume scale
        - Not disclosed; industry analogues suggest 20–35% BOM cost reduction per 10× unit volume
        - Low (inferred from industry benchmarks)
        - Determines path to gross-margin-positive hardware business and when RaaS economics turn positive
        - Request learning-curve data across production batches; compare BOM at 1,000 vs 5,000 vs 10,000 units
      - - G2 industrial deployment gross margin
        - Undisclosed; Longcheer contract terms not public; €899/day rental proxy suggests positive margin at full utilisation
        - Low (no data available)
        - Industrial deployment is the thesis-critical revenue stream; margin quality determines long-term business value
        - Obtain G2 deployment pricing, integration cost per customer, ongoing service cost per unit per month
      - - Customer acquisition cost (CAC)
        - Undisclosed; enterprise humanoid robot sales cycles estimated at 6–18 months (industry analogue); CAC not disclosed
        - Low (estimated from industry norms)
        - Payback period drives capital requirements; high CAC in early industrial deployment phase is expected but must be quantified
        - Request sales cycle data, average contract value, CAC by segment (entertainment vs industrial), and payback period
      - - Gross margin (consolidated)
        - Entirely undisclosed by company; no revenue or gross profit disclosed
        - Not available
        - Key underwriting input; cannot be inferred from list prices alone without COGS, channel discount, and mix data
        - Require audited or management-reviewed income statement or P&L summary for FY2024 and FY2025
    notes: >-
      All financial values in this table are either estimates based on industry benchmarks and analogues or
      simply marked undisclosed. AGIBOT has not published revenue, gross margin, COGS, or any income statement
      data. Estimates for COGS are derived from peer hardware cost benchmarks and are not verified. The
      table is included to structure the diligence questions, not to assert specific financial outcomes.
    claimRefs:
