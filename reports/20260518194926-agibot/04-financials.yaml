  - id: section-cost-structure
    title: Cost Structure, Capital Intensity, and Manufacturing Economics
    body: >-
      AGIBOT's cost structure is characteristic of an early-stage vertically integrated robotics company:
      high capital expenditure on R&D and AI model training, significant manufacturing investment, and
      service-delivery costs that accompany each industrial deployment. The company manufactures under
      automotive-grade production principles, applying 92 comprehensive inspection checkpoints per A2 Lite
      unit and subjecting the A2 Ultra to up to 2,000 hours of walking tests (including 360 hours of
      continuous operation without anomalies). These quality controls are consistent with premium hardware
      manufacturing economics, implying material per-unit quality-assurance costs that are not publicly
      disclosed. Hot-swappable battery systems, UWB swarm positioning (supporting 100-robot synchronized
      performances), and dexterous hands with 3D tactile sensing represent additional bill-of-materials
      complexity versus simpler humanoid designs.

      The most informative proxy for deployment economics comes from the G2 industrial program at
      Longcheer Technology. AGIBOT states that the G2 requires only 36 hours of site setup (via
      Genie Sim 3.0 digital-twin compressed commissioning) versus a traditional months-long debugging
      process — a material improvement in deployment COGS. The equipment reuse rate for changeover
      between product models is 95%, and retraining for a new production-line configuration takes no
      more than four hours. These metrics suggest a structurally lower recurring service cost than
      first-generation industrial robots, but the absolute dollar economics per deployed G2 unit remain
      undisclosed. The full deployment from project initiation to production took four months for the
      Longcheer installation, which is a reasonable proxy for a per-customer integration cost that
      investors should quantify in due diligence.

      Manufacturing scale-up economics are visible through production-rate data: AGIBOT scaled from
      its founding (February 2023) to 1,000 units in approximately 24 months, accelerated to 5,000
      cumulative units by early 2026, and then completed the jump from 5,000 to 10,000 units in
      approximately three months — a 4× acceleration in throughput. This ramp implies meaningful
      investment in supply-chain industrialisation (components, battery systems, actuators, inspection
      capacity) and is consistent with the reported investor base including automotive-supply-chain-linked
      BYD, Tencent, JD.com, and Longcheer Technology itself (listed: 603341.SH). CATL-backed supply
      of battery systems is also noted by HumanoidIndex. The Swancor Advanced Materials acquisition
      (CNY 2.1B consortium, ~$290M) reflects AGIBOT's intent to vertically integrate into upstream
      high-performance materials, a major capital commitment that compounds the financing dependency.
