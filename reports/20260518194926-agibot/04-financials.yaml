    layout: standard
    summary: >-
      Qualitative flow showing how AGIBOT's customer interactions convert through hardware sales,
      industrial deployment, and rental/RaaS channels into revenue and potential gross profit. All
      dollar flows below the revenue nodes are estimates or proxies; AGIBOT has not disclosed revenue,
      gross margin, or COGS.
    data:
