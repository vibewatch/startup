  - id: section-switching-costs
    title: Switching Costs, Lock-in, and Supply-Chain Access
    body: >-
      Enterprise humanoid robot deployments create switching costs through three accumulating
      mechanisms. First, system integration: deploying a humanoid fleet requires embedding the robot
      into warehouse management systems, manufacturing execution systems, safety protocols, and
      operational workflows. Agility's Arc platform specifically exploits this by connecting Digit
      to existing warehouse automation and AMR infrastructure; replacing Digit requires re-integrating
      the broader automation stack. Second, trained model customisation: every deployment generates
      proprietary task-specific fine-tuning data. Switching vendors means losing accumulated model
      performance on facility-specific workflows and task configurations. Third, staff training and
      requalification investments are non-trivial in regulated industrial environments where safety
      certification requirements must be repeated.

      Agibot's lock-in opportunities broadly mirror these mechanisms. Its Genie Studio software
      platform and OmniHand dexterous manipulation system represent potential tooling layers for
      customers who build workflows on Agibot's stack. Supply-chain access provides a structural
      cost advantage Western competitors cannot easily replicate: CATL-backed battery component
      supply, Longcheer precision manufacturing for consumer electronics applications, and the
      broader Chinese supplier ecosystem underpin Agibot's ability to price below Western cost
      structures at comparable hardware specifications.

      Multi-homing is currently feasible because no single humanoid platform dominates any use case
      at meaningful scale. As deployment volumes grow, first-mover customers accumulate switching
      costs that make the enterprise reference deployments Agility, Apptronik, and — to a lesser
      extent — Agibot are accumulating in 2025–2026 strategically important well beyond their
      immediate contract revenue.
    claimRefs:
      - CP030
      - CP031
      - CP032
