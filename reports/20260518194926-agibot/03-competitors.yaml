  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margins
      missingEvidence: >-
        Gross margin data for humanoid robot hardware at current list prices (Agibot, Unitree, Western competitors).
      whyItMatters: >-
        Without gross margin data it is impossible to assess whether Agibot's pricing is
        sustainable, whether hardware sales contribute positively to unit economics, or whether
        Agibot and competitors are subsidising deployments to build scale.
      diligencePath: >-
        Request management accounts, cost-of-goods-sold breakdown, and gross margin walk from
        Agibot; compare implied margins for Unitree G1 at $16K against published BOM cost estimates
        for similar specification bipedal platforms.
      relatedQuestionRefs:
        - QP021

    - type: private-evidence-only
      severity: material
      topic: enterprise-contract-economics
      missingEvidence: >-
        Actual contract pricing, volume commitments, renewal terms, and unit economics for
        Agility Digit at Amazon, Figure AI at BMW, and Apptronik at Mercedes-Benz.
      whyItMatters: >-
        Without contract economics it is impossible to verify whether Western humanoid
        companies have achieved sustainable deployment business models or are subsidising
        deployments for data and learning purposes.
      diligencePath: >-
        Request contract terms from Agility and Apptronik through formal diligence;
        cross-reference Amazon and GXO earnings calls for any disclosed automation
        investment or cost-saving disclosures that imply Digit contract value.
      relatedQuestionRefs:
        - QP007

    - type: missing-source
      severity: minor
      topic: Unitree-autonomous-AI-capability
      missingEvidence: >-
        Independent benchmark of Unitree G1 autonomous task performance without custom AI
        software integration, and documentation of which third-party models are compatible.
      whyItMatters: >-
        The competitive threat from Unitree depends critically on whether its $16K G1 can
        achieve adequate autonomous operation; the threat is high if autonomy can be added
        via open-source AI, low if substantial custom development is required.
      diligencePath: >-
        Review Unitree developer documentation and community benchmarks; commission
        independent evaluation of G1 out-of-box autonomous task performance versus Agibot A2.
