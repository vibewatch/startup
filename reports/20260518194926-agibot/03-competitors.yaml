chapter:
  number: 3
  title: Competitors
  summary: >-
    Agibot enters 2026 as the global production-volume leader in humanoid robotics — 10,000 units by
    March 2026 — but faces a bifurcated competitive threat: well-capitalised Western startups (Figure AI
    $1.9B, Agility Robotics $641M+, Apptronik $1.45B+) commanding stronger enterprise trust and
    deployment proof, and domestic rival Unitree whose G1 at $16,000 represents the most acute
    hardware-commoditisation risk across the entire sector. Agibot's primary differentiators are its
    Chinese cost-structure advantage, full-series portfolio breadth, international safety certifications,
    and a real-world data flywheel that competitors without comparable deployment scale cannot replicate.
    Key vulnerabilities are the proposed US ban on government procurement of Chinese robots, limited
    Western enterprise proof, and the risk of price compression from Chinese hardware competition.

sections:
  - id: section-landscape
    title: Competitive Landscape — Peers, Incumbents, and Substitutes
    body: >-
      The humanoid robot competitive landscape as of mid-2026 organises into five categories. Direct
      peers are companies building commercially available or commercially shipping general-purpose
      bipedal or wheeled humanoid robots: Figure AI (Figure 03, US), Agility Robotics (Digit, US),
      Apptronik (Apollo, US), 1X Technologies (NEO, Norway), and Unitree Robotics (G1/H1, China).
      These companies compete with Agibot on form factor, enterprise use cases, and first-mover
      positioning with customers making initial humanoid deployment decisions.

      Megacap and strategic entrants form a second tier: Tesla (Optimus) deploys humanoids internally
      with a stated long-term $20,000 consumer price target; Hyundai/Boston Dynamics (Atlas) focuses
      on research and showcase deployments rather than general commercial sales; and major Chinese
      conglomerates BYD (Agibot investor) and CATL provide supply-chain alignment that Western
      competitors cannot replicate.

      Incumbents and adjacent substitutes include traditional industrial robots (Fanuc, KUKA, ABB),
      autonomous mobile robots from Locus Robotics, Vecna, and Geek+, and collaborative robots from
      Universal Robots and Techman Robot — all of which address manufacturing and logistics tasks at
      lower per-unit cost with proven safety records. For enterprise buyers evaluating humanoid robots,
      the practical near-term alternative is continuing to rely on human labor at US warehouse wages of
      $15–25/hr or installing conventional fixed automation where task requirements allow.

      Goldman Sachs' analysis underscores the market's early-stage dynamics: global humanoid shipments
      in 2025 are estimated at 15,000–20,000 units, with Chinese manufacturers contributing the
      majority of volume; but the same research flags 2026 as a potential "volume verification and
      expectation reset" year where manufacturer shipment targets may significantly outpace actual
      deployable enterprise demand — a structural risk applicable to Agibot and all Chinese volume peers.
