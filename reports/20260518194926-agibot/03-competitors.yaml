callouts:
  - calloutType: risk
    title: US Regulatory Exclusion — Material Threat to Agibot's US Market Strategy
    body: >-
      The proposed American Security Robotics Act (March 2026), if enacted, would prohibit the US
      federal government from buying or operating Chinese-made humanoid robots. Agibot and Unitree
      were explicitly named in the bill's context by US senators citing national security risks from
      potential data transmission to China. Beyond the direct government procurement exclusion,
      enterprise buyers in defence-adjacent industries, critical infrastructure, and regulated sectors
      may apply the same risk logic independently — functionally excluding Agibot from a significant
      share of the US addressable market without any formal restriction on private-sector sales.
    claimRefs:
      - CP037
      - CP038

  - calloutType: risk
    title: Price Commoditisation — Unitree and Chinese Hardware Competition
    body: >-
      Unitree's G1 at $16,000 is the first credible proof that capable bipedal humanoids can be
      commercially shipped at sub-$20K. If Unitree's forthcoming IPO capital accelerates R&D and
      further price reductions, and if additional Chinese manufacturers converge at similar price
      points, hardware margins across the Chinese humanoid tier — including Agibot — will compress.
      Goldman Sachs' 2026 expectation-reset warning applies most acutely to Chinese volume players
      whose valuations presuppose sustained high ASPs in a market that has not yet demonstrated
      large-scale enterprise demand at current pricing.
    claimRefs:
      - CP016
      - CP039
      - CP040

  - calloutType: strength
    title: Production Volume and Data Flywheel — Agibot's Most Durable Structural Advantage
    body: >-
      With 10,000 humanoid units produced by March 2026 — a 4× acceleration in production speed in
      the prior quarter — Agibot operates the largest real-world embodied-AI training fleet outside
      Tesla. Every deployed unit generates proprietary task and environment data that cannot be
      synthetically replicated at equivalent scale. Combined with a Chinese manufacturing cost
      structure that Western competitors cannot easily match, this data flywheel gives Agibot a
      compounding advantage on both cost and autonomy axes that persists as long as simulation
      training does not fully replace real-world fleet data requirements.
    claimRefs:
      - CP001
      - CP033
      - CP034

