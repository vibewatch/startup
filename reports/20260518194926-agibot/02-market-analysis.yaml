        - Driver
        - "2026–2030"
        - High
        - State enterprise procurement tailwind; reduces sales friction in domestic market
        - Identify specific policy-linked tenders Agibot has won or is pursuing
      - - China domestic supply chain maturation (57% local share by 2024)
        - Driver
        - Now — 2030
        - High
        - Lower unit cost than Western peers; shorter lead times; policy support for suppliers
        - Track COGS trajectory as local actuator and sensor supply scales
      - - Validated ROI case studies (Longcheer, HT-Tech, Guangzhou Metro)
        - Driver
        - "2026–2028"
        - Medium-High
        - Accelerates replication sales in same verticals; reduces buyer risk perception
        - Independent third-party validation of claimed metrics required; pilot-to-contract conversion rate
      - - AI model maturity and embodied AI data flywheel
        - Driver
        - "2026–2030"
        - High (long-term)
        - AgiBot-World dataset and AIMA model stack differentiate vs hardware-only competitors
        - Benchmark task success rate trajectory against published L1–L5 capability framework
      - - Unit cost and capex barrier ($10K–$100K+ per robot)
        - Constraint
        - Now — 2029
        - High
        - Slows enterprise adoption outside high-labor-cost environments; limits Western SME market
        - Track ASP trend; when does sub-$10K pricing unlock mass industrial segment?
      - - Safety and liability gaps in close-proximity human operations
        - Constraint
        - Now — 2030
        - Medium-High
        - Regulatory liability ambiguity delays deployment in healthcare, food, and some manufacturing
        - Monitor MIIT 2026 standard adoption timeline; request Agibot's safety incident disclosure
      - - US American Security Robotics Act (ban on Chinese robots in government use)
        - Constraint
        - "2026–2027 (if enacted)"
