  - id: section-market-sizing
    title: "Market Sizing: Multiple Lenses, Contradictions, and Constrained Estimates"
    body: >-
      Multiple independent estimates for the humanoid robot market exist but differ by orders of magnitude,
      reflecting incompatible scope definitions. Goldman Sachs estimates the global humanoid robot market at
      a minimum of $6 billion within 10-15 years in its base case (from a 2024 report), with a widely cited
      2035 figure of $38 billion and a blue-sky ceiling of $154 billion contingent on overcoming hardware cost,
      safety, and acceptance hurdles. MarketsandMarkets (April 2025) is more granular: global hardware market
      at $2.92 billion in 2025 growing to $15.26 billion by 2030 at a 39.2% CAGR; China-specific at $0.40
      billion growing to $2.80 billion at 47.6% CAGR; US at $0.86 billion growing to $4.60 billion at 39.9%.

      IDC's unit-volume forecast takes a different lens: global shipments exceeding 510,000 units by 2030
      at roughly 95% CAGR—which at plausible ASPs of $20,000-$50,000 implies a $10-25 billion revenue
      floor by 2030, broadly consistent with MarketsandMarkets but through different methodology. Goldman
      Sachs, in a January 2026 survey of Chinese manufacturers, revised near-term expectations to 15,000-20,000
      global units shipped in 2025, with 2026-2027 targets in the thousands-to-tens-of-thousands range,
      signaling a market still in early commercialization rather than mass adoption.

      The 600× gap between Goldman Sachs's $38B hardware revenue estimate and ARK Invest's $24 trillion
      economic-value estimate is not a disagreement about the hardware market—it reflects ARK measuring the
      potential labor-displacement economic impact if humanoids substituted a fraction of the $40+ trillion
      annual global human labor market. Both estimates are preserved here as they represent the market's upper
      and lower conceptual bounds. A unit-economics-constrained "SOM floor" for Agibot in 2026-2028 is
      estimated at $150-500 million based on current fleet size, ASPs, and emerging rental revenue, but this
      cannot be verified from public data. Grand View Research and multiple other analyst firms have published
      humanoid robot market analyses covering the same opportunity, further establishing the segment as an
      established research vertical with broad institutional interest, though their specific 2035 figures
      were not accessible in the research window.
