  - id: section-drivers-constraints
    title: "Growth Drivers, Adoption Constraints, and China's Market Edge"
    body: >-
      The primary structural demand driver is global manufacturing labor shortage, most acute in China, the
      US, and Japan. China's manufacturing industry operates with approximately 2 million industrial robots—
      4.5 times Japan's operational stock—and accounts for 54% of annual global robot installations, according
      to IFR's World Robotics 2025 Report. China's 15th Five-Year Plan (2026-2030), published in May 2026,
      places robotics and embodied AI at the explicit center of the national industrial strategy, targeting AI
      application in physical industries, creating a systematic procurement advantage for domestic makers like
      Agibot through policy-aligned state enterprise procurement.

      The China supply chain structural edge is compounding: Chinese local supplier share in domestic robot
      installations grew from 30% in 2020 to 57% in 2024. China's MIIT published the world's first national
      humanoid robot standard system in February 2026, covering safety, neuromorphic computing, component specs,
      system integration, application scenarios, and ethics. This gives Chinese companies a regulatory first-mover
      advantage—their products are designed to meet standards they helped draft, while Western entrants must
      reverse-engineer compliance.

      Adoption constraints are material and multi-dimensional. Capital intensity remains a barrier: hardware
      costs of $10,000-$100,000+ per unit require positive NPV justification versus flexible human labor,
      particularly in markets with ample workforce. Goldman Sachs notes production consistency and multi-stage
      testing processes as near-term barriers to scaling 2026-2027 targets. IFR explicitly cautions that mass
      adoption of humanoids as universal factory helpers will not happen in the near-to-medium term—traditional
      industrial robots retain advantages in high-speed precision tasks where the "form follows function" rule
      disfavors the humanoid form. Safety and liability concerns—exemplified by industrial robot incidents and
      addressed only partially by MIIT's 2026 standard—are a gating concern for deployments in high-proximity
      human environments.

      The most adversely significant constraint for Agibot specifically is the US geopolitical risk dimension.
      In March 2026, bipartisan US Senators Cotton and Schumer introduced the American Security Robotics Act,
      which would ban federal government purchase or use of humanoid robots made by Chinese companies, citing
      data transmission risks and national security concerns. This legislation, if enacted, would create a
      formal market bifurcation between Chinese-origin and Western-origin robots in US government and
      potentially allied defense and infrastructure procurement—directly constraining Agibot's US addressable
      market in sovereign contexts while leaving the private sector accessible.
