        - Blocks federal procurement; could expand to allied governments or ITAR-equivalent regime
        - Track bill progress; assess Agibot's US revenue exposure and contingency planning
      - - "IFR assessment: near-term mass adoption unlikely; form-follows-function limitations"
        - Constraint
        - Now — 2030
        - Medium
        - Caps near-term TAM to structured flexible tasks; does not threaten core industrial use case
        - Benchmark humanoid capability vs. fixed-arm in throughput-intensive repetitive tasks
      - - Production consistency and multi-stage testing challenges (Goldman Sachs warning)
        - Constraint
        - "2026–2027"
        - Medium
        - Ambitious volume targets (10,000+ units) may miss on quality or reliability at scale
        - Request field failure rates, MTBF data, and warranty claim rates from deployment partners
    notes: >-
