        - label: "Commercially Deployable (China-policy-accelerated, near-term)"
          value: 6
        - label: "Agibot SOM (current 7 solutions, 10K fleet, est. 2026–2028)"
          value: 2
    approximationNotes: >-
      Funnel percentages are illustrative estimates synthesized from Goldman Sachs (manufacturing labor gap
      sizing), IFR (China robot installation rates and humanoid vs. industrial robot comparison), and
      MarketsandMarkets (near-term addressable market sizing). Values represent approximate share of total
      addressable labor demand reachable at each adoption gate as of mid-2026. SOM estimate is inferred from
      Agibot fleet size and public deployment data; not a disclosed company projection.
    claimRefs:
      - CM031
      - CM033
      - CM036
      - CM037

callouts:
  - calloutType: risk
    title: "Geopolitical market bifurcation: US legislation targets Chinese humanoid robots"
    body: >-
      The American Security Robotics Act (March 2026) would ban US federal government purchase or use of
      humanoid robots made by Chinese companies. If enacted, it could extend to allied-nation procurement
      and ITAR-equivalent controls, creating a formal two-tier market: Chinese-origin robots (Agibot,
      Unitree) vs. Western-origin (Figure AI, Agility, Boston Dynamics). Agibot's US addressable market
      in sovereign and critical-infrastructure contexts would be materially constrained regardless of
      product capability. The Michigan partnership with Hyperscale Data is a hedge but does not resolve
      the origin-of-manufacture question.
    claimRefs:
      - CM029
      - CM035

  - calloutType: insight
    title: "China supply chain advantage is structural, not just cost-based"
    body: >-
      IFR data shows Chinese suppliers captured 57% of domestic robot market share by 2024 (up from 30%
      in 2020), and China accounts for 54% of global annual robot installations. The 15th Five-Year Plan
      explicitly mandates that thousands of subordinate plans align with robotics-led growth objectives.
      This means Agibot benefits not only from lower component costs but from state enterprise procurement
      tailwinds that Western competitors cannot replicate—a systematic rather than episodic advantage.
    claimRefs:
      - CM026
      - CM027

  - calloutType: assumption
    title: "Analyst market estimates rest on incompatible scope assumptions"
    body: >-
      Goldman Sachs's $38B 2035 estimate measures hardware and software revenue; ARK Invest's $24T
      measures economic value of labor displacement—a 600× gap reflecting scope, not analytical error.
      MarketsandMarkets's $15.26B by 2030 is hardware-only; IDC's 510,000 unit forecast implies
      $10-25B depending on ASP. Investors should avoid anchoring on any single figure; the market size
      is genuinely uncertain at this stage of commercialization.
    claimRefs:
      - CM006
      - CM012
      - CM013
      - CM038

