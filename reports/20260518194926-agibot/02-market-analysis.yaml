  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Agibot pricing
      missingEvidence: >-
        Agibot's average selling prices per product line (G2 industrial, A3 interactive, X2 compact)
        are not publicly disclosed; only the rental rate (€899/day) and general capex range are known.
      whyItMatters: >-
        Without ASP data, the SAM-to-SOM conversion and revenue trajectory cannot be modeled; unit
        shipment counts without pricing understate or overstate revenue at any given fleet size.
      diligencePath: >-
        Request Agibot's hardware price list and software/service attach rates in direct diligence;
        cross-check with component-level cost analysis via supply chain partners.
      relatedQuestionRefs:
        - QM022

    - type: private-evidence-only
      severity: material
      topic: Agibot revenue 2026
      missingEvidence: >-
        Agibot's total deployment revenue, annual recurring revenue from software/services, and
        revenue breakdown by segment are not publicly disclosed as a private company.
      whyItMatters: >-
        Fleet size (10,000 units) without revenue undermines market sizing validation; a company
        generating €899/day per rental unit across even 500 deployed units would indicate >$160M
        annual revenue, but actual utilization rates and sales-vs-rental mix are unknown.
      diligencePath: >-
        Request audited financials or management accounts in due diligence; triangulate via known
        partnership deal sizes (Longcheer 100-unit expansion, Hyperscale Data Michigan facility).
      relatedQuestionRefs:
        - QM023

    - type: conflicting-data
      severity: material
      topic: independent shipment verification
      missingEvidence: >-
        Neither Agibot's 5,200 units (IDC), nor Unitree's 5,500 unit counter-claim, nor Agibot's
        10,000-unit milestone have been verified by an independent third-party audit or regulatory
        disclosure; all figures originate from company statements or analyst surveys.
      whyItMatters: >-
        If shipment counts are overstated, Agibot's claimed market leadership position and production
        scale argument for investor valuation would be weakened; the discrepancy between IDC's
        Agibot-first ranking and Unitree's counter-claim remains unresolved.
      diligencePath: >-
        Request production and shipment records from Agibot's manufacturing partners; cross-check
        with customs and export data where available; verify with end-customer deployment counts.
      relatedQuestionRefs:
        - QM024

    - type: data-not-public
      severity: low
      topic: retail pilot ROI independence
      missingEvidence: >-
        Agibot's retail deployment ROI metrics (Anta 20% foot traffic lift, Haidilao reduced queue
        wait times) are reported in company press releases without independent third-party validation;
        no customer-issued public statements or neutral analyst case studies have been identified.
      whyItMatters: >-
        Distinguishing genuine repeat-purchase demand from promotional pilot activity requires
        independently verifiable metrics; without neutral validation these ROI claims may overstate
        the commercial traction in the retail segment.
      diligencePath: >-
        Request signed deployment contracts and customer-issued performance reports from Anta and
        Haidilao; seek analyst case studies or media investigations from retail industry outlets.
      relatedQuestionRefs:
        - QM013

    - type: research-not-completed
      severity: low
      topic: safety liability incident data
      missingEvidence: >-
        No public safety incident log, MIIT compliance audit results, or third-party liability
        insurance terms for Agibot's active deployments have been identified; the China MIIT 2026
        standard was published but its enforcement status and Agibot's compliance posture are unknown.
      whyItMatters: >-
        In high-proximity human operations, safety incidents or liability gaps could trigger
        deployment halts, regulatory sanctions, or reputational damage that disrupts market adoption.
      diligencePath: >-
        Request Agibot's safety audit records and MIIT compliance certification status; review
        insurance terms and liability clauses in deployment contracts.
      relatedQuestionRefs:
        - QM018

    - type: research-not-completed
      severity: low
      topic: humanoid vs fixed-arm unit economics
      missingEvidence: >-
        No independent study comparing per-unit total cost of ownership (capex, maintenance,
        downtime) of Agibot's humanoid G2 versus equivalent fixed-arm industrial robots (Fanuc,
        KUKA) in identical production line tasks has been identified; Agibot claims 5,700 units/day
        throughput but no comparative fixed-arm benchmark is publicly available.
      whyItMatters: >-
        Without a TCO comparison, the market opportunity boundary against fixed-arm incumbents
        is unclear; humanoid robots must demonstrate superior economics in flexible tasks to justify
        the premium over purpose-built fixed-arm automation.
      diligencePath: >-
        Commission independent TCO benchmarking using Longcheer or HT-Tech deployment data;
        request Agibot's internal ROI model and uptime/maintenance cost disclosures.
      relatedQuestionRefs:
        - QM025

