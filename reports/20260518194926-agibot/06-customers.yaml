        for any published terms; analyse comparable humanoid RaaS contracts from public peers.
      relatedQuestionRefs:
        - QU023

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      FU004 (Retention / Repeat Cohort) uses type kpi instead of cohort because no time-series
      retention data (NRR, GRR, cohort retention percentages) has been publicly disclosed by
      AGIBOT. A cohort figure cannot be constructed without quantitative retention time-series;
      the KPI substitute documents the null state of retention metrics with appropriate evidence
      gaps filed for the missing data.
  - dimension: tableNotes
    reason: >-
      TU004 (Retention table) contains only null/not-disclosed values by design: the chapter's
      research exhaustively confirmed that no NRR, GRR, or satisfaction metrics have been
      publicly disclosed. Adding a tableNotes field would be redundant with the section prose
      and column values, which already explain the evidence gap.
