    title: "Customer Journey Map"
    type: journey-map
    layout: standard
    summary: >-
      Maps AGIBOT's customer adoption path from initial awareness through enterprise production
      deployment and RaaS expansion across segments.
    data:
      items:
        - label: "Awareness"
          note: >-
            Enterprise discovers AGIBOT via APC 2026, trade media, industry partner referral,
            or store.agibot.com self-service channel
        - label: "Evaluation / Pilot"
