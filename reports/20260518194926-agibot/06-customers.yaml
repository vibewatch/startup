callouts:
  - calloutType: risk
    title: "Single Production Customer — Critical Concentration Risk"
    body: >-
      Longcheer Technology is AGIBOT's only confirmed production-stage customer as of May 2026.
      All other named commercial relationships are MOUs or pilots without disclosed outcomes.
      This creates 100% revenue concentration in a single manufacturing deployment, representing
      a material diligence risk until a second production-stage reference is confirmed.
    claimRefs:
      - CU032
      - CU016

  - calloutType: insight
    title: "RaaS Pricing Transparency as a Demand Signal"
    body: >-
      AGIBOT's public €899/day RaaS rate on store.agibot.com is unusually transparent for a
      hardware robotics company at this stage. If a typical manufacturing shift is 8 hours,
      the daily rate implies a monthly RaaS cost of ~€26,970 per robot — comparable to
      3–4× the monthly labour cost in China, and potentially competitive in high-wage
      geographies (Europe, Singapore). Transparent pricing may accelerate self-service
      enterprise pilots but also signals a price ceiling that constrains margin expansion
      without further automation of the service model.
    claimRefs:
      - CU004
      - CU041

