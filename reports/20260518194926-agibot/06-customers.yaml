  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        The complete list of AGIBOT enterprise customers and partners from APC 2026; AGIBOT claims
        20+ participants but has not publicly disclosed names beyond the five documented in TU003.
      whyItMatters: >-
        Without the full customer list, customer concentration, vertical diversification, and
        conversion rates from the partner ecosystem cannot be accurately assessed.
      diligencePath: >-
        Request the complete partner and customer list from AGIBOT commercial team; cross-reference
        APC 2026 attendee lists, post-conference press releases, and partner announcements.
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
      topic: whale-cloud-partnership
      missingEvidence: >-
        An independent press release, Whale Cloud website announcement, or verified third-party
        article confirming the AGIBOT fleet management partnership and its geographic scope.
      whyItMatters: >-
        Whale Cloud's claimed 150-market footprint is a material distribution amplifier; without
        independent corroboration, the claim cannot be relied upon for customer or channel analysis.
      diligencePath: >-
        Search Whale Cloud official website (whalecloud.com) and Alibaba enterprise press releases;
        request commercial partnership confirmation from AGIBOT and Whale Cloud directly.
      relatedQuestionRefs:
        - QU010

    - type: missing-source
      severity: material
      topic: longcheer-independent-filing
      missingEvidence: >-
        Longcheer Technology annual report, Lenovo supply chain disclosure, or an independent
        Chinese regulatory filing that independently corroborates the AGIBOT G2 production
        deployment at MMIT factories in Shenzhen and Dongguan.
      whyItMatters: >-
        The Longcheer deployment is AGIBOT's only production-level customer proof; independent
        audit or filing corroboration would materially strengthen the evidence quality and
        reduce reliance on a joint company press release.
      diligencePath: >-
        Access Longcheer Technology's annual quality report or Lenovo's 2026 ODM partner
        disclosure; search Chinese Securities Regulatory Commission filings if Longcheer has
        a listed affiliate.
      relatedQuestionRefs:
        - QU012

    - type: missing-source
      severity: material
      topic: genting-deployment
      missingEvidence: >-
