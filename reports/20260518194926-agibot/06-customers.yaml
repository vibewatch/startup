  - id: named-customer-proof
    title: "Named Customer Proof — Production Versus Pilot"
    body: >-
      Longcheer Technology is the only confirmed production-level customer for AGIBOT as of May 2026.
      Longcheer, a Lenovo ODM and electronics manufacturing partner headquartered in China, has deployed
      AGIBOT G2 robots on its MMIT consumer electronics precision assembly lines in Shenzhen and Dongguan.
      The deployment metrics — 310 UPH throughput, 99.9% motion success rate, 19–20 second cycle time,
      100% on-time delivery, and 16-hour-per-day operation with 8 autonomous hours — were jointly published
      by AGIBOT and Longcheer in a PRNewswire announcement and are corroborated by Longcheer's own website,
      which describes it as an AI-enabled smart manufacturing partner. Longcheer received Lenovo's 2026
      Perfect Quality Award in April 2026, suggesting a performance uplift that may reinforce the
      deployment's retention case.

      Beyond Longcheer, AGIBOT's APC 2026 partner conference announced a series of MOUs and RaaS
      partnerships. Genting Malaysia signed an MOU (confirmed by New Straits Times, April 2026) for
      humanoid robot deployment across Genting Highlands' hospitality and theme park operations. Genting
      Malaysia's corporate website describes an active expansion strategy across resort operations globally.
      Hyperscale Data, operator of a 100,000-square-foot data center facility in Michigan, USA, signed a
      partnership agreement with AGIBOT. SIR Spa Group (Italy) and Singtel (Singapore) are cited as
      additional early partners through the RaaS program by third-party sources. None of these
      non-Longcheer deployments had been confirmed as production-stage as of May 2026. AGIBOT claims
      participation from "20+ leading enterprises" at APC 2026 without disclosing the full list.

      Video testimonials and a customer Q&A published on AGIBOT's official website (APC 2026 coverage)
      show international attendees from across industries describing the conference positively, but no
      specific deployment metrics or contract values were disclosed by any non-Longcheer customer in the
      public record. BYD and JD.com appear as strategic investors with potential deployment interest but
      have not been confirmed as active production customers.
