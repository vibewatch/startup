  - id: section-deployment
    title: Deployment, Integration, Reliability, and Support
    body: >-
      The G2's production deployment at Longcheer Technology's Nanchang, Jiangxi tablet factory is the
      most-documented reliability proof point. Using the Genie Sim 3.0 digital twin, Agibot compressed
      on-site debugging from a traditional months-long process to 36 hours, with full production-line
      integration completed in four months from project initiation. In live 24/7 double-shift operation,
      the G2 achieved a sustained throughput of 310 units per hour (UPH) at a cycle time of roughly 19–20
      seconds per MMIT task, and independently reported completing 2,283 tasks with zero errors in a single
      eight-hour window. Mixed-model production changeovers require no custom tooling; retraining for a new
      product model takes under four hours and equipment reuse rate reaches 95%. Agibot plans to expand the
      Longcheer deployment to 100 robots by Q3 2026 and extend into automotive and semiconductor sectors.
      Beyond industrial deployments, the Genie Studio Agent platform introduces a zero-code deployment
      workflow: operators use a drag-and-drop node editor to assemble robot applications from prebuilt
      perception, navigation, VLA, and RL toolchain components, then validate in simulation before
      deploying to physical hardware. Software support is governed by the Defined Support Period V4
      document: Agibot guarantees at least one year of security updates from product launch date, with
      the A2, G2, and X2 Ultra listed as having update support until January 2027 under a January 2026
      launch date. The Aimmaster control app, PAD software, and robot firmware are covered under the same
      window. This one-year minimum is notably shorter than enterprise SLA expectations, representing a
      diligence gap for industrial customers with longer asset-lifecycle requirements.
