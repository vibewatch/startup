  - id: section-trust
    title: Trust, Safety, Privacy, and Compliance
    body: >-
      Agibot has established baseline compliance infrastructure, though gaps remain at the product-safety
      and cybersecurity depth expected for industrial-scale deployment. On certifications, the A2 Ultra holds
      CR (China), CE-MD (EU machinery directive), CE-RED (EU radio equipment directive), and FCC (US) approvals,
      enabling commercial sales across the three major markets. The G1 and G2 feature emergency stop buttons,
      collision protection, chassis obstacle avoidance, and immediate alarm-and-stop on fault detection; the
      G2 also embeds six-axis force sensing on both arms for controlled force application. China's MIIT HEIS
      framework (published February 2026) — which Agibot co-developed through Peng Zhihui's committee
      participation — mandates force limiting, emergency stop mechanisms, thermal management, and minimum-risk
      condition behaviour on software failure. Critically, Peng Zhihui acknowledged that nearly 80% of
      manipulation tasks where humans outperform traditional automation are strongly related to tactile sensing,
      a capability that remains insufficiently standardised and technically immature across the industry
      including Agibot's own products. On data privacy, Agibot's website privacy policy (effective April 30,
      2026) designates AGIBOT PTE. LTD. (Singapore) as the data controller for most international markets,
      with separate entities for Japan/Korea (Agibot K.K.) and Hong Kong SAR. The policy follows lawfulness,
      legitimacy, necessity, and integrity principles but does not publish a vulnerability disclosure programme
      or SOC 2 / ISO 27001 certification. The one-year security update floor is a diligence gap for enterprise
      buyers.
