callouts:
  - calloutType: strength
    title: Production-Validated Industrial Deployment at Scale
    body: >-
      The G2's live deployment at Longcheer — 310 UPH, 99.9%+ success, 36-hour site integration, zero errors
      in an 8-hour window — is independently corroborated by CnTechPost and Interesting Engineering and
      represents the most concrete industrial production proof point among public Chinese humanoid deployments.
    claimRefs:
      - CE026
      - CE027
      - CE028

  - calloutType: strength
    title: Open Data Flywheel Creates Network-Effect Moat
    body: >-
      The AgiBot World dataset (1M+ trajectories, open on GitHub and HuggingFace) and the open-sourced GO-1
      foundation model create a data and model ecosystem that competitors without a comparable fleet cannot
      easily replicate, reinforcing Agibot's academic and developer mindshare.
    claimRefs:
      - CE015
      - CE016
      - CE034

  - calloutType: risk
    title: One-Year Security Support Window Too Short for Industrial Buyers
    body: >-
      Agibot's defined minimum security update period of one year from launch is materially below the
      three-to-five-year lifecycle expectations of industrial operators. Customers who deployed A2 or G2
      units in January 2026 face a support cliff in January 2027 absent an announced extension.
    claimRefs:
      - CE032
      - CE033

  - calloutType: risk
    title: Tactile Sensing Gap Limits Manipulation Generalisation
    body: >-
      Agibot's own CTO acknowledges that nearly 80% of manipulation tasks where humans outperform traditional
      automation depend on tactile sensing — a capability that is insufficiently standardised and remains
      immature in Agibot's current product line, constraining the reliability ceiling for unstructured tasks.
    claimRefs:
      - CE042

