  - id: section-architecture
    title: Technology Architecture and Operating Model
    body: >-
      Agibot's "One Robotic Body, Three Intelligences" framework partitions intelligence into locomotion,
      manipulation, and interactive layers, each backed by one or more foundation models trained on proprietary
      data. Locomotion intelligence is powered by the Behavioral Foundation Model (BFM), which learns human-like
      movement patterns from short video demonstrations, and the Generative Control Foundation Model (GCFM),
      which improvises actions from text or audio prompts in real time. Manipulation intelligence relies on
      GO-2 (VILLA), which applies Action Chain-of-Thought reasoning to translate high-level task instructions
      into fine motor commands, supplemented by the Genie Sim 3.0 simulation platform for rapid sim-to-real
      transfer. Interactive intelligence is handled by WITA Omni, a robot-native multimodal model that unifies
      vision, speech, and gesture without stitching separate language and vision modules. These models are
      trained on the AgiBot World dataset, which as of March 2025 contains 1,003,672 manipulation trajectories
      (~43.8 TB) collected by a fleet of 100 robots across five target domains; the repository received an IROS
      2025 Best Paper Award Finalist nomination. The underlying robotics middleware is AimRT, an open-source
      framework providing real-time communication (1 kHz), ROS 2 / Jazzy interoperability, zenoh and gRPC
      backends, and an active monthly release cadence (v1.7.0 in April 2026). The SOP (Scalable Online
      Post-training) framework closes the deployment loop by enabling distributed fleet-level VLA model updates:
      multiple robots execute tasks in parallel, experience is consolidated in the cloud, and updated policies
      are pushed back to the fleet within hours; after SOP training, robots operated autonomously for over
      36 hours without human intervention. Genie Studio is the integrated developer platform: it orchestrates
      data collection (up to 1,000 frames/device/day), model training and fine-tuning across GO-1/RDT/Pi0/
      OpenVLA, simulation evaluation (8,000+ 3D assets, sub-5% sim-to-real error), and one-click cloud-to-device
      deployment achieving 2–3× inference throughput gains over single-GPU baselines.
