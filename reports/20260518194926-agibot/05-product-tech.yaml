  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: SOP independent validation
      missingEvidence: Peer-reviewed or third-party replication study of the SOP distributed fleet post-training framework and its claimed performance improvements.
      whyItMatters: SOP is positioned as a core technical differentiator enabling continuous model improvement at fleet scale; its performance claims rest solely on Agibot's own research blog with no independent replication.
      diligencePath: Search for IEEE/arXiv papers citing the SOP framework; request access to Agibot's internal benchmark data or an independent benchmark on a reference task suite.
      relatedQuestionRefs: [QE010]

    - type: missing-source
      severity: material
      topic: G2 industrial certification
      missingEvidence: CE-MD and FCC certification status for the G2 industrial robot, which is deployed in manufacturing but has no publicly confirmed international certifications beyond the A2 Ultra.
      whyItMatters: Industrial buyers in the EU and US will require CE-MD and FCC compliance before integrating G2 into regulated manufacturing lines; absent certification confirmation creates a deployment blocker.
      diligencePath: Request the CE and FCC declaration of conformity documents directly from Agibot; check EU market surveillance database for G2 filings.
      relatedTableRefs: [TE004]
      relatedQuestionRefs: [QE008]

    - type: missing-source
      severity: material
      topic: compute requirements
      missingEvidence: Published GPU memory requirements and inference latency for GO-2 (VILLA), WITA Omni, BFM, and GCFM models when deployed on Agibot hardware, and on-device vs. cloud split for production deployments.
      whyItMatters: Deployment cost and feasibility depend on whether models run on-device or require cloud connectivity; unknown compute requirements constrain TCO estimates for industrial buyers.
      diligencePath: Request system integration spec sheet from Agibot; review Genie Studio technical documentation for inference profiles.
      relatedQuestionRefs: [QE007]

    - type: missing-source
