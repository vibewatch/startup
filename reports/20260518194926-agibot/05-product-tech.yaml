chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Agibot delivers a vertically integrated embodied AI platform built around its "One Robotic Body, Three Intelligences"
    architecture, spanning six commercial robot series (A2, X2, G2, X1, G1, A2-W) backed by proprietary foundation
    models (GO-1, GO-2/VILLA, WITA Omni, BFM/GCFM), a 1M-trajectory open dataset (AgiBot World), and a full-stack
    developer toolchain (Genie Studio, AimRT middleware). The G2 industrial humanoid has achieved independently reported
    production deployment at Longcheer Technology's tablet factory at 310 units-per-hour throughput and 99.9%+ success
    rate. Key technology gaps include unverified SOP post-training benchmarks, a minimum one-year security support window
    that is short for industrial customers, and unresolved tactile-sensing limitations acknowledged by Agibot's own CTO.

sections:
  - id: section-product-lines
    title: Product Lines and Customer Workflow
    body: >-
      Agibot organises its commercial portfolio into three branded robot series aligned to deployment context and
      customer workflow stage. The Yuanzheng (Expedition) series covers full-size bipedal humanoids for interaction
      and enterprise service: the A2 Ultra is the certified flagship (CR, CE-MD, CE-RED, FCC), the A2 Lite is
      the lower-cost commercial variant listed at $44,560 on the Agibot store, and the A2-W is a wheeled-base
      variant optimised for data collection and factory navigation. The Genie (精灵) series targets industrial
      manufacturing: the G1 robot provides native data collection with millisecond-latency VR tele-operation,
      eight high-resolution cameras, and bimanual six-axis force sensing; the G2 is the production-grade industrial
      humanoid now deployed in consumer electronics manufacturing. The Lingxi (灵犀) series serves research,
      education, and entertainment: the X1 is an open-source 29-joint humanoid for academic researchers, while
      the X2 and X2 Ultra are compact half-humanoids (25–30 DOF) for exhibition, interactive retail, and research
      at a starting price of approximately $24,240. At APC 2026 Agibot introduced four additional platforms: the
      A3 (173 cm, 55 kg, entertainment-grade with 10-hour endurance and 10-second battery swap), the G2 Air
      (compact 7-DOF single-arm mobile manipulator for human-in-the-loop operations), the D2 Max all-terrain
      quadruped, and OmniHand 3 Ultra-T (22+3 DOF tendon-driven dexterous hand). A D1 quadruped series handles
      inspection in complex outdoor environments. The product architecture follows a customer workflow logic:
      operators choose a body form factor suitable for the physical environment, pair it with the relevant
      intelligence stack, and deploy via Genie Studio with minimal on-site integration engineering.
