  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >
              The American Security Robotics Act (ASRA), introduced by Senator Tom Cotton (R-AR) and Senator Chuck
              Schumer (D-NY) on 26 March 2026, represents the most material near-term regulatory risk to Agibot's
              international expansion. The bipartisan bill would prohibit the US federal government from purchasing or
              operating humanoid robots made by Chinese companies, citing national security concerns about data
              exfiltration and remote-control potential. Reuters and US News confirmed that the bill explicitly
              identifies Chinese humanoid robot startups — including Agibot and Unitree — as the target firms. A
              companion bill was simultaneously introduced in the US House by Representative Elise Stefanik. Even if
              ASRA does not become law in its current form, its introduction signals a legislative trend that could
              expand to state governments, defence contractors, regulated industries, and large enterprise procurement.
              Any Agibot robot integrated into a US government-adjacent workflow — logistics, infrastructure, healthcare
              — faces elevated regulatory scrutiny.

              China's legal infrastructure creates a second, structurally distinct legal risk layer. The National
              Intelligence Law (2017) requires all Chinese entities to assist state intelligence work on request. The
              Personal Information Protection Law (PIPL, 2021) and the Cybersecurity Law (2017) impose data localisation
              obligations, mandatory security assessments for cross-border data transfers, and government access rights.
              Agibot's Website Privacy Policy, effective 30 April 2026, discloses data collection of device identifiers,
              usage data, and technical information from robot operations. For enterprise customers in the US, EU,
              Japan, and South Korea, deploying Agibot robots in operational environments raises the question of whether
              production-line data — potentially including proprietary assembly processes, quality-control data, and
              facility layouts — could be accessed by Chinese state authorities. No public disclosure addresses how
              Agibot segments, localises, or restricts data flows to comply with both Chinese law and customer data
              sovereignty requirements simultaneously.

              Product liability for humanoid robots remains legally unsettled globally. The Hill Dickinson legal
              analysis published in 2026 identifies the core question: when an autonomous humanoid robot causes harm,
              responsibility may rest with the manufacturer, the operator, the software provider, or some combination.
              Existing product liability regimes — the EU Product Liability Directive, US state product liability law,
              and China's Product Quality Law — were not designed for autonomous embodied AI systems that make real-time
              decisions. The US OSHA acknowledges there are currently no specific OSHA standards for the robotics
              industry. ISO 10218-1:2011, the predecessor industrial robot safety standard, applies to fixed industrial
              robots and not to bipedal humanoids operating in open environments. Agibot's robots are deployed in 3C
              electronics manufacturing, automotive, and service environments where physical proximity to humans is
              inherent to the use case. This gap between capability and safety legal framework creates potential
              retrospective compliance obligations, insurance uncertainty, and customer adoption friction as
              jurisdictions develop specific humanoid robot regulations.

              China's MIIT published its Humanoid Robot and Embodied Intelligence Standard System in February 2026 — a
              framework Agibot's co-founder and CTO Peng Zhihui helped author as deputy director of the HEIS technical
              committee. While Agibot's involvement in standard-setting is a positive signal for China-market
              compliance, it also creates a risk: standards shaped by a dominant domestic player may embed technical
              requirements that advantage Agibot domestically while acting as de facto non-tariff barriers to foreign
              competitors — inviting WTO challenges and reciprocal restrictions in key markets. The EU AI Act
              (Regulation 2024/1689), fully applicable by August 2026, classifies AI systems used in safety-critical or
              high-risk settings as "high-risk AI," potentially requiring conformity assessments, CE marking, and
              registration for Agibot robots deployed in EU industrial environments.
