          Single-customer industrial proof is a necessary but insufficient condition for valuation; second named
          customer at 20+ units is the minimum required to confirm repeatability
        - Agibot official announcements; AIMA developer ecosystem partner disclosures; direct VP Sales engagement
    notes: >-
      Diligence asks are ordered by urgency and materiality. Items 1 and 3 (industrial ARR and US Act status) are 90-day
      asks that should be resolved before any new capital commitment. Items 2, 4, and 5 are 6–18 month asks that define
      the upgrade trigger from TRACK to a conditional BUY recommendation.
    claimRefs:
      - CV040
      - CV041
      - CV042
