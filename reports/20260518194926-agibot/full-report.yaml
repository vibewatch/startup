      - number: '8.3'
        title: Bull / Base / Bear Scenarios and Return Analysis
        blocks:
          - type: paragraph
            body: >-
              Three scenarios govern Agibot's valuation trajectory over the 2026–2030 investment horizon. Scenario
              probability assignments are approximate and are based on the weight of public evidence as of May 2026:
              approximately 25% bull, 50% base, and 25% bear.

              The bull case (probability: ~25%) assumes Agibot successfully converts production scale into industrial
              ARR at scale by 2027–2028. Key assumptions: (a) G2 industrial program expands from the Longcheer proof
              point to 10+ named manufacturing customers, each with 50–200 deployed units; (b) the Swancor acquisition
              delivers vertically integrated actuator and composite materials cost advantages that reduce per-unit COGS
              by 20–30%; (c) China's national electric grid / State Grid Corporation procurement program (the CNY 68B
              embodied intelligence devices tender referenced in QCC filing data) awards Agibot a material contract; (d)
              Western sales are limited by US legislation but non-restrictive markets (ASEAN, India, Middle East, EU)
              contribute 20%+ of revenue. Under these assumptions, cumulative industrial ARR reaches $400M–$600M by
              2028, supporting a $3B–$5B enterprise value at 6–10x forward revenue. From the implied ~$1.0B–$1.3B
              post-money entry price, bull-case returns for a 2025/2026 entry investor are approximately 2.5–5x over 5
              years.

              The base case (probability: ~50%) assumes Agibot grows industrial deployment steadily but remains
              predominantly a hardware sales company through 2027. Key assumptions: (a) G2 expands to 3–5 industrial
              customers by end-2027, total deployed industrial units reaching 500–800; (b) A2 and A3
              commercial/entertainment hardware sales continue at current pricing, generating $80M–$120M in annual
              hardware revenue; (c) the Swancor integration is completed by 2027 without material operational
              disruption; (d) no US or EU legislation blocks Asian and non-aligned market access. Under these
              assumptions, implied enterprise value at 2028 is $1.5B–$2.5B. From entry price ~$1.0B–$1.3B, base-case
              returns are approximately 1.2–2.0x over 5 years — modest but positive for China-tolerant robotics
              infrastructure investors.

              The bear case (probability: ~25%) involves: (a) US Security Robotics Act passes and creates a chilling
              effect on enterprise buyers globally, limiting Agibot to Chinese-market revenue; (b) industrial deployment
              quality issues emerge at scale (actuator failure, autonomy gaps in unstructured environments); (c) Swancor
              acquisition creates balance-sheet stress and management distraction; (d) Unitree achieves comparable
              industrial deployment proof at lower price points, compressing Agibot's pricing power. Under the bear
              case, Agibot is forced into a down-round below CNY 5B ($700M) by 2027, or seeks a strategic Chinese-state
              acquirer at distressed valuations. Bear-case returns from current entry are 0.5–0.7x, with preference
              stack protecting late-round institutional investors and devastating common equity.

              The probability-weighted expected value from entry at ~$1.1B post-money is approximately $1.5B–$2.0B by
              2028, representing a 1.4–1.8x expected return before dilution from future rounds. This is marginally
              attractive relative to the sector's capital intensity and binary risk profile, but insufficient to meet a
              3x return target without significant bull-case scenario support.
            claimRefs:
