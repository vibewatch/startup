  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Substitutes, and Adjacent Spend
        blocks:
          - type: paragraph
            body: >-
              The humanoid and embodied AI robot market is defined as commercially produced robots with a human-like or
              semi-humanoid form factor—including bipedal designs (Agibot A2, A3, G2 series) and compact wheeled-torso
              platforms—designed to operate in human-built environments using dexterous manipulation, mobile locomotion,
              and multimodal interaction. Excluded are: fixed-arm industrial robots (Fanuc, KUKA, ABB) that execute
              single-position repetitive tasks; autonomous mobile robots (AMRs) without manipulation capability; and
              software-only AI systems without physical embodiment. The humanoid form factor's competitive advantage is
              operating in spaces built for human workers—using existing doors, shelves, tools, and layouts—without
              requiring re-engineering of the physical environment.

              Status-quo substitutes in the primary target segments are: (1) human labor—the dominant substitute across
              manufacturing, logistics, and service environments; (2) traditional fixed-arm industrial robots performing
              structured high-speed tasks where the humanoid form offers no advantage; (3) cobots (collaborative robots
              such as Universal Robots UR-series) operating in fixed positions without mobility; and (4) specialized
              task robots (floor cleaners, delivery bots, barcode scanners) that address narrow, structured workflows.
              The key switching trigger is the shift from structured single-task automation to flexible multi-product,
              multi-station workflows that exceed the capability envelope of fixed automation.

              Included spend in this analysis covers robot hardware purchase or lease, embedded AI software licenses,
              deployment integration services, training data, and after-sale maintenance. Excluded spend includes
              facility infrastructure re-engineering (conveyors, racking re-design), workforce retraining programs, and
              adjacent non-humanoid automation categories. Adjacent markets that humanoids may expand into as
              capabilities mature include industrial exoskeletons, cobot arms, AI-powered delivery robots, and drone
              logistics platforms.
