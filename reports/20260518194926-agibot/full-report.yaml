      - number: '3.3'
        title: Pricing, Deployment Proof, and GTM Distribution
        blocks:
          - type: paragraph
            body: >-
              Agibot is one of the few humanoid robot companies with published international list pricing. Its A2 Lite
              is listed at $44,560 and its X2 entertainment robot at $24,240 on its international online store — making
              price comparison more tractable than for Western competitors, which universally withhold enterprise
              pricing. Figure AI, Agility Robotics, and Apptronik do not disclose unit pricing or contract economics;
              industry estimates for enterprise bipedal deployments range from $100K–$150K+ per unit or comparable
              annual RaaS contract values. Apptronik's RaaS model is publicly stated but specific economics are not
              disclosed.

              Unitree G1 at $16,000 remains the most disruptive pricing signal in the sector. At sub-$20K for a bipedal
              robot, it undercuts every Western competitor and approaches Agibot's X2 consumer tier. If Unitree achieves
              adequate autonomous operation through its own AI or third-party model integration, it could capture
              price-sensitive research and SME enterprise segments and force a hardware price war across the Chinese
              humanoid tier.

              In deployment proof, Agility Robotics has the deepest enterprise validation: the Amazon Digit programme is
              the only high-volume industrial humanoid deployment with a strategic investor as anchor customer. Agibot's
              10,000-unit cumulative fleet is impressive in volume but the mix of entertainment, commercial showrooms,
              and factory-floor applications is harder for Western enterprise buyers to benchmark against a specific
              labour-substitution ROI. Agibot's G2 zero-error manufacturing claim (Longcheer) represents an early but
              important western-compatible proof point that needs independent validation to build enterprise trust at
              scale.

              On GTM and distribution, Agibot operates a global rental platform and direct international online store,
              while Western competitors primarily sell through enterprise contracts with dedicated sales teams. Agibot's
              distribution approach — high volume, lower price, platform ecosystem — reflects its Chinese-market origin,
              whereas Western competitors focus on proof-led enterprise sales with high-touch support and account
              management.
