  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Revenue Architecture
        blocks:
          - type: paragraph
            body: >-
              AGIBOT addresses four primary customer segments in its commercial launch phase: industrial manufacturing
              (led by electronics assembly and automotive supply chain), logistics and warehousing (pick-and-place,
              sortation), hospitality and retail services (hotel operations, luxury spa, cleaning), and enterprise IT or
              data center operations. The industrial manufacturing segment is the most mature, anchored by the Longcheer
              Technology production deployment. The buyer in manufacturing is typically a plant operations or
              manufacturing engineering function; in logistics, it is a facilities or operations director; in
              hospitality, it is the resort or hotel general manager or a procurement department.

              AGIBOT operates two revenue models simultaneously. The first is direct robot purchase or fleet lease,
              where an enterprise acquires G2 or A2 units outright or under a multi-year leasing arrangement. The
              second, and strategically important, is Robot-as-a-Service (RaaS), launched at the Mobile World Congress
              in March 2026 via store.agibot.com, priced from €899 per robot per day with no minimum contract term
              disclosed. The RaaS model serves 17 countries and regions as of March 2026 and is designed to lower the
              procurement barrier for international customers who cannot commit to large upfront hardware spend. The
              store also lists direct-purchase robots such as the C5 cleaning model at $32,900, signalling a hybrid
              go-to-market that spans self-service digital and enterprise direct-sales channels.

              Geographic concentration at launch is heavily China-centric for production deployments, with Southeast
              Asia (Genting Malaysia), Europe (SIR Spa Group, Italy), and Singapore (Singtel RaaS trial) representing
              early international market tests. Government procurement represents a structurally blocked channel in the
              United States following the introduction of the American Security Robotics Act in March 2026, which
              proposes to bar federal agency use of Chinese-made robots.
