      - number: '6.5'
        title: Concentration Risk and Adverse Factors
        blocks:
          - type: paragraph
            body: >-
              AGIBOT's commercial book is critically concentrated. As of May 2026, Longcheer Technology is the sole
              production-level customer, meaning that, by any reasonable metric, customer concentration stands at 100%
              for commercial production revenue. If Longcheer were to pause or terminate the deployment — whether for
              operational, competitive, or cost reasons — AGIBOT would lose its only disclosed commercial production
              reference. This concentration is not unusual for an early-stage deep-tech company launching commercially,
              but it is material for diligence and must be addressed with a customer diversification roadmap and
              evidence of pipeline conversion.

              The American Security Robotics Act, introduced by Senators Cotton and Schumer in March 2026, proposes to
              prohibit US federal agencies from purchasing or using Chinese-made robots. This legislation does not
              affect commercial enterprise procurement or direct-to-business RaaS subscriptions, and its near-term
              impact on AGIBOT's existing customer book is limited. However, it signals a broader US regulatory and
              procurement risk for AGIBOT's long-term US government market entry strategy.

              Legal liability in humanoid robot deployments is an unresolved systemic risk. Hill Dickinson's 2026
              analysis identifies product liability, occupational health and safety obligations, and operator liability
              as material concerns for enterprise customers deploying humanoid robots on factory floors. These liability
              gaps may lengthen procurement cycles and require AGIBOT to offer explicit indemnification or insurance
              products. China's MIIT humanoid robot national safety standards, expected in 2026, may also add
              certification requirements that affect the lead time for new customer deployments. AGIBOT's APC 2026
              partner ecosystem model — standardised productivity solutions marketed through a channel of global
              industry partners — creates channel dependency risk if the conversion rate from MOU to signed production
              contract proves low.
