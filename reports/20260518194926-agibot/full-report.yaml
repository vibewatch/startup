      - number: '1.4'
        title: Product Portfolio, Deployments, and Commercial Evidence
        blocks:
          - type: paragraph
            body: >-
              AGIBOT's most commercially mature product is the A2 Ultra, described by the company as the industry's
              first full-size humanoid robot deployed commercially at scale. The A2 Ultra holds four international
              certifications (CR, CE-MD, CE-RED, FCC), completed the world's first 24-hour outdoor walking livestream,
              and set a Guinness World Record by walking 106.286 kilometres across provinces — demonstrating outdoor
              mobility endurance. It has been deployed in over 20 leading enterprises. The A2-W is a wheeled mobile
              manipulator variant that integrates the chassis, arms, and perception system for single-day deployment.

              The G-series (Genie) targets factory environments. The G1 features 26 degrees of freedom and operates in
              industrial, commercial, and domestic scenarios. The G2 is the company's primary factory deployment unit.
              In April 2026, AGIBOT announced that multiple G2 robots had been integrated into Longcheer Technology's
              tablet production lines in Nanchang, Jiangxi — described as the world's first large-scale implementation
              of embodied AI in consumer electronics precision manufacturing. AGIBOT reported that G2 completed 2,283
              tasks with zero errors during an 8-hour continuous operation, and the partnership targets expansion to 100
              G2 units on Longcheer's lines by Q3 2026.

              The X-series (Lingxi) covers the X1, an open-source hardware and software platform with 29 joints, and the
              X2, a half-size entertainment and commercial performance robot. The Genie Studio platform offers zero-code
              orchestration for robot deployment, and the AIMA open ecosystem was launched at APC 2026 to lower
              integration barriers for third-party developers. At APC 2026 (April 2026) AGIBOT also unveiled five new
              hardware platforms including the A3 full humanoid, D2 Max all-terrain quadruped, and G2 Air mobile
              manipulator. On the software side, eight foundational AI models under the "One Robotic Body, Three
              Intelligences" architecture were released.
