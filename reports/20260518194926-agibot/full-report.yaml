  - id: FE001
    title: Agibot Full-Stack Product Architecture
    type: stack
    layout: wide
    summary: Five-layer architecture from robotic hardware through AI models, data platform, and fleet orchestration.
    data:
      layers:
        - label: Robot Hardware (Bodies)
          detail: >-
            Six distinct form factors spanning service, industrial, research, and entertainment verticals; common
            hardware certifications include CR, CE-MD, CE-RED, and FCC.
          items:
            - A2 Ultra / A2 Lite — full-size bipedal, enterprise service (170 cm, certified CR/CE/FCC)
            - A2-W — wheeled humanoid, factory navigation and data collection
            - G2 / G2 Air — industrial bipedal / mobile manipulator, 24/7 production ops
            - X1 — open-source research humanoid (29 joints, full BOM/STEP published)
            - X2 / X2 Ultra — compact entertainment and education (25–30 DOF)
            - A3 — high-performance interactive humanoid (173 cm, 55 kg, 0.218 kW/kg)
        - label: Sensors and Actuators
          detail: >-
            Perception suite covering RGB-D, LiDAR, force, IMU, tactile, and audio; same sensor stack shared across
            bipedal and wheeled chassis variants.
          items:
            - 8× high-resolution cameras (upper body, full 3D coverage)
            - 6-axis force sensors — bimanual (G1/G2)
            - LiDAR + RGB-D (chassis navigation and obstacle avoidance)
            - IMU (YIS320, lower-limb DCU on X1)
            - Shoulder tactile sensors; head-touch sensors (A3, X2)
            - Multi-array 360° microphones for speech capture (A3)
        - label: On-Device Intelligence and Middleware
          detail: >-
            AimRT open-source middleware provides real-time inter-process communication; GO/BFM/WITA/GCFM model family
            handles manipulation, locomotion, and multimodal interaction on-device or with edge offload.
          items:
            - AimRT v1.7.0 — open-source real-time middleware, ROS 2 / zenoh / gRPC
            - GO-1 / GO-1 Air — open manipulation VLA foundation model
            - GO-2 (VILLA) — Action Chain-of-Thought manipulation model
            - BFM / GCFM — locomotion intelligence (text/audio-prompted movement)
            - WITA Omni — robot-native multimodal (vision + speech + gesture)
            - GDK (Genie Development Kit) — on-device inference and control SDK
        - label: Genie Studio (Development Platform)
          detail: >-
            End-to-end developer and operator platform covering data collection, model fine-tuning, physics simulation,
            and one-click deployment; integrates leading open-source models including RDT, Pi0, and OpenVLA.
          items:
            - Data Collection — up to 1,000 frames/device/day, human-in-the-loop QA
            - Training — GO-1, RDT, Pi0, OpenVLA, GR00T; 48 GPU-day fine-tuning templates
            - Simulation (Genie Sim 3.0) — 8,000+ 3D assets, <5% sim-to-real error
            - One-click Deployment — 2–3× inference gain over single-GPU baseline
            - Genie Studio Agent — zero-code drag-and-drop workflow orchestration
        - label: Fleet Orchestration and Data Flywheel (SOP / Cloud)
          detail: >-
            SOP framework and cloud infrastructure support continuous post-deployment model improvement across the
            entire deployed fleet; AgiBot World dataset serves as the foundation for pre-training future model
            generations.
          items:
            - Multi-robot parallel execution — shared policy across fleet
            - Centralized cloud online VLA updates — hours-scale convergence
            - Instant model synchronisation to all fleet devices
            - AgiBot World Dataset — 1M+ trajectories, IROS 2025 Best Paper Finalist
            - Hybrid edge + cloud compute — supports lightweight on-body or edge offload
    approximationNotes: >-
      Layer composition derived from official product pages, Genie Studio docs, AimRT release notes, and APC 2026 press
      release; some sub-components may be internal-only and not fully public.
    claimRefs:
      - CE011
      - CE016
      - CE018
      - CE021
      - CE019
