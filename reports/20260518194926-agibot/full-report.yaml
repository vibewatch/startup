      - number: '8.2'
        title: Financing Context, Valuation Framework, and Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Agibot has raised more than ten financing rounds since its founding in February 2023. Disclosed venture
              capital stands at approximately $83.8M per Tracxn and Humanoid Index, but this figure almost certainly
              understates total capital: Chinese private company disclosures are frequently partial, and the QCC
              corporate registry shows over 50 shareholders spanning multiple undisclosed round sizes. Key confirmed
              investors by round include: Gaorong Capital and Bailai Ventures (Angel, 2023), BYD (A+, August 2023),
              Sequoia China and others (pre-B/A, 2024), Tencent Ventures (B, March 2025), JD.com / JoyGen (B+, May
              2025), and LG Electronics / Mirae Asset New Growth Fund (strategic round, August 2025). The LG Electronics
              / Mirae Asset round was described as "strategic" and the first global investment of that fund; round size
              was not disclosed. Pandaily reported the pre-money valuation at the time of this round exceeds CNY 7
              billion (~$960M at July 2025 exchange rates), representing the best available public anchor for enterprise
              value. Post-money implied, accounting for undisclosed round size, is likely in the range of $1.0B–$1.3B.

              The Swancor Advanced Materials acquisition is the most significant capital event beyond VC rounds. On July
              8, 2025, a consortium led by Agibot and its founding team agreed to pay up to CNY 2.1 billion (~$290M) for
              control of the A-share listed materials company (Shenzhen exchange). This acquisition signals intent to
              vertically integrate into upstream carbon-fiber and high-performance composite materials — a plausible but
              capital-intensive diversification that extends total effective capital deployment well beyond the
              disclosed $83.8M VC figure. Investors should model the combined entity, not just the VC-funded robotics
              operations.

              The appropriate valuation framework for Agibot at this stage is a scenario-weighted milestone model
              anchored in production-volume and deployment proof, not revenue multiples (revenue is undisclosed). Under
              a base case assumption of 20,000 cumulative units deployed by end-2027, with 30% in paid industrial
              contracts at CNY 300,000–500,000 per unit per year (implied by Longcheer economics), annual industrial
              revenue could reach $250M–$450M — yielding a forward EV/Revenue multiple of 2–5x at current implied
              valuation, consistent with early-stage industrial software and automation companies. The bull case, in
              which 50%+ of production shifts to high-margin industrial RaaS with additional manufacturing customer
              proof, supports a $2B–$3B enterprise value at 2027 forward multiples of 6–10x. The bear case — where
              hardware sales remain dominant, margins are thin, and geopolitical barriers prevent Western scale —
              implies a down-round risk to below CNY 5B ($700M).

              The comparable set spans three categories. In humanoid robotics private rounds, Figure AI is the most
              relevant global peer: $675M raised in a February 2024 round at ~$2.6B post-money, with a subsequent round
              implying ~$3.2B valuation; Figure's BMW factory pilot and Helix general-purpose AI model represent the
              strongest Western competitive parallel. Agility Robotics closed a $400M Series C at ~$1.75B post-money in
              March 2025, supported by a GXO production deployment. Apptronik raised $350M from Samsung and others,
              valuation undisclosed but estimated at $1.4B–$1.6B. 1X Technologies' unconfirmed Series C implies a
              $3B–$5B range per analyst estimates. In public automation peers, Teradyne (collaborative robotics
              division, ~$4B EV) and Zebra Technologies (~$15B EV) trade at 5–8x forward revenue — establishing exit
              multiples if Agibot reaches $300M+ ARR. The Boston Dynamics precedent (Hyundai acquired from SoftBank,
              2021, ~$1.1B) sets a strategic M&A floor for a Chinese humanoid robotics company subject to geopolitical
              transaction scrutiny.
