      - number: '6.2'
        title: Adoption Trajectory and Deployment Scale
        blocks:
          - type: paragraph
            body: >-
              AGIBOT's adoption trajectory is among the steepest in the humanoid robotics sector by unit volume. Omdia
              data cited by Humanoid Index placed AGIBOT first globally by shipped unit volume in 2025, with
              approximately 5,100 units delivered — a figure no legacy or new entrant competitor matched in that period.
              By March 2026, cumulative production had crossed the 10,000-unit threshold, a milestone the company
              headlined at its Annual Partner Conference (APC 2026) in April 2026. The declared "Deployment Year One"
              positioning signals a strategic shift from product development to commercial scaling, though the
              distinction between units shipped to end customers versus units in internal testing, inventory, or
              distributor stock has not been clarified publicly.

              The Longcheer deployment provides the most concrete adoption evidence. Integration was completed in 36
              hours, and the deployment ramped from a pilot to a 24/7 production schedule in approximately four months —
              a cycle time that, if repeatable, supports rapid enterprise adoption at scale. AGIBOT plans to expand the
              Longcheer fleet to 100 G2 units by Q3 2026. The throughput of 310 units per hour and 99.9% motion success
              rate are the highest disclosed productivity metrics for any humanoid robot production deployment globally
              as of mid-2026. At the APC 2026, global customers from 17 countries attended the partner conference,
              suggesting growing international engagement — though attendance does not equal commercial contract
              conversion.

              AGIBOT's 5,100 units in 2025 represent approximately 1% of IDC's projected 510,000 humanoid robot units by
              2030 (~95% CAGR), illustrating significant TAM headroom alongside substantial execution risk to capture
              it. Goldman Sachs estimates the global humanoid robot market at $6 billion within 10–15 years, with a
              blue-sky scenario reaching $154 billion by 2035.
