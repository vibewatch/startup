              company at this stage. If a typical manufacturing shift is 8 hours, the daily rate implies a monthly RaaS
              cost of ~€26,970 per robot — comparable to 3–4× the monthly labour cost in China, and potentially
              competitive in high-wage geographies (Europe, Singapore). Transparent pricing may accelerate self-service
              enterprise pilots but also signals a price ceiling that constrains margin expansion without further
              automation of the service model.
