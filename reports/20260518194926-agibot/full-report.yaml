      - number: '6.4'
        title: Retention, Durability, and Expansion
        blocks:
          - type: paragraph
            body: >-
              AGIBOT has not disclosed any net revenue retention (NRR), gross revenue retention (GRR), churn rate,
              contract renewal rate, or customer satisfaction metric. No G2 reviews, Gartner Peer Insights ratings, or
              third-party customer satisfaction platforms have been identified for AGIBOT's products. All retention
              signals must therefore be inferred from structural indicators rather than measured from disclosed data.

              The strongest structural retention signal is the Longcheer deployment's expansion trajectory: scaling from
              a pilot to a 100-unit fleet implies a land-and-expand model where initial deployment performance drives
              organic fleet growth. The 4-month pilot-to-production conversion at Longcheer also suggests that AGIBOT's
              on-site engineering support is effective enough to convert pilots — a key early indicator of customer
              durability. However, the RaaS model's pricing (€899/day with no disclosed minimum term) leaves open the
              possibility of low-switching-cost termination, which would imply higher-than-average churn in the early
              commercial cohort.

              The Genting Malaysia MOU is a non-binding letter of intent with no disclosed contract value, timeline, or
              SLA commitments. MOUs in the humanoid robotics industry frequently do not convert to signed production
              contracts within 12 months, making the Genting and similar relationships unsuitable as evidence of durable
              recurring revenue. AGIBOT's overall retention posture at this commercial stage is best characterised as
              "structurally uncertain but positively oriented" — the Longcheer expansion plan is encouraging, but a
              single reference customer cannot establish a repeatable pattern.
