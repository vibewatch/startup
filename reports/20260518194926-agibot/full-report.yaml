        blocks:
          - type: callout
            title: 'Geopolitical market bifurcation: US legislation targets Chinese humanoid robots'
            body: >-
              The American Security Robotics Act (March 2026) would ban US federal government purchase or use of
              humanoid robots made by Chinese companies. If enacted, it could extend to allied-nation procurement and
              ITAR-equivalent controls, creating a formal two-tier market: Chinese-origin robots (Agibot, Unitree) vs.
              Western-origin (Figure AI, Agility, Boston Dynamics). Agibot's US addressable market in sovereign and
              critical-infrastructure contexts would be materially constrained regardless of product capability. The
              Michigan partnership with Hyperscale Data is a hedge but does not resolve the origin-of-manufacture
              question.
            calloutType: risk
            claimRefs:
              - CM029
              - CM035
          - type: callout
            title: China supply chain advantage is structural, not just cost-based
            body: >-
              IFR data shows Chinese suppliers captured 57% of domestic robot market share by 2024 (up from 30% in
              2020), and China accounts for 54% of global annual robot installations. The 15th Five-Year Plan explicitly
              mandates that thousands of subordinate plans align with robotics-led growth objectives. This means Agibot
              benefits not only from lower component costs but from state enterprise procurement tailwinds that Western
              competitors cannot replicate—a systematic rather than episodic advantage.
            calloutType: insight
            claimRefs:
              - CM026
              - CM027
          - type: callout
            title: Analyst market estimates rest on incompatible scope assumptions
            body: >-
              Goldman Sachs's $38B 2035 estimate measures hardware and software revenue; ARK Invest's $24T measures
              economic value of labor displacement—a 600× gap reflecting scope, not analytical error.
              MarketsandMarkets's $15.26B by 2030 is hardware-only; IDC's 510,000 unit forecast implies $10-25B
              depending on ASP. Investors should avoid anchoring on any single figure; the market size is genuinely
              uncertain at this stage of commercialization.
            calloutType: assumption
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM038
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape — Peers, Incumbents, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The humanoid robot competitive landscape as of mid-2026 organises into five categories. Direct peers are
              companies building commercially available or commercially shipping general-purpose bipedal or wheeled
              humanoid robots: Figure AI (Figure 03, US), Agility Robotics (Digit, US), Apptronik (Apollo, US), 1X
              Technologies (NEO, Norway), and Unitree Robotics (G1/H1, China). These companies compete with Agibot on
              form factor, enterprise use cases, and first-mover positioning with customers making initial humanoid
              deployment decisions.

              Megacap and strategic entrants form a second tier: Tesla (Optimus) deploys humanoids internally with a
              stated long-term $20,000 consumer price target; Hyundai/Boston Dynamics (Atlas) focuses on research and
              showcase deployments rather than general commercial sales; and major Chinese conglomerates BYD (Agibot
              investor) and CATL provide supply-chain alignment that Western competitors cannot replicate.

              Incumbents and adjacent substitutes include traditional industrial robots (Fanuc, KUKA, ABB), autonomous
              mobile robots from Locus Robotics, Vecna, and Geek+, and collaborative robots from Universal Robots and
              Techman Robot — all of which address manufacturing and logistics tasks at lower per-unit cost with proven
              safety records. For enterprise buyers evaluating humanoid robots, the practical near-term alternative is
              continuing to rely on human labor at US warehouse wages of $15–25/hr or installing conventional fixed
              automation where task requirements allow.

              Goldman Sachs' analysis underscores the market's early-stage dynamics: global humanoid shipments in 2025
              are estimated at 15,000–20,000 units, with Chinese manufacturers contributing the majority of volume; but
              the same research flags 2026 as a potential "volume verification and expectation reset" year where
              manufacturer shipment targets may significantly outpace actual deployable enterprise demand — a structural
              risk applicable to Agibot and all Chinese volume peers.
