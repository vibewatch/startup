      - number: '4.3'
        title: Production Milestones, Deployment Metrics, and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              AGIBOT's most concrete financial traction signal is its production volume. The company produced its
              10,000th humanoid robot in March 2026, with Omdia (cited by HumanoidIndex) ranking AGIBOT first globally
              in 2025 humanoid shipments at approximately 5,100–5,200 units. This ranking is contested: Unitree Robotics
              claimed 5,500 humanoid shipments for 2025 and has filed for a $580 million A-share IPO — the competing
              claim has not been independently verified, and methodology differences between the two companies' shipment
              counts remain unresolved. For diligence purposes, AGIBOT's production volume should be treated as a proxy
              for revenue potential rather than confirmed revenue, since the mix between commercially deployed units,
              demonstration/show units, and pre-commercial inventory is not publicly disclosed.

              The clearest deployment proof comes from the G2 industrial programme. Multiple G2 robots are confirmed
              operational on Longcheer Technology's tablet production lines at MMIT stations in Nanchang, Jiangxi.
              Measured performance: 2,283 tasks completed in an 8-hour continuous run with zero errors; throughput of
              310 products per hour; individual cycle time of 18–20 seconds. This 24/7 double-shift capability at
              production-line conditions is the most compelling commercial proof AGIBOT has published to date, but the
              number of units currently deployed at Longcheer and the commercial terms are undisclosed. Expansion to 100
              units by Q3 2026 is planned, extending to automotive and semiconductor manufacturing.

              On the entertainment and commercial-performance side, the A2 Ultra product page confirms deployment at
              "over 20 leading enterprises." The A3 humanoid — supporting 100-robot synchronized UWB swarm performances
              — has been demonstrated publicly and is entering commercial availability in mid-2026. The global
              rental/RaaS platform spans 17 countries as of March 2026 (per Humanoids Daily), pointing to an active
              commercial operating model. IDC data shows that in 2025, more than 85% of global humanoid deployments were
              concentrated in entertainment, education, and guided-tour scenarios — consistent with AGIBOT's early
              commercial base. The company's strategic shift toward industrial manufacturing deployment (declared
              "Deployment Year One" at APC 2026 in April 2026) is the thesis-critical transition that has yet to produce
              disclosed financial results.
