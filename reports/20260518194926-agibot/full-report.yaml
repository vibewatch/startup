      - number: '7.3'
        title: Operational and Supply Chain Risks
        blocks:
          - type: paragraph
            body: >
              Agibot's manufacturing ramp from artisanal production to 10,000 units required four years of development.
              The next phase — scaling to 50,000–100,000 units to serve the industrial deployment volumes implied by
              stated customer expansion targets — is categorically more demanding. Humanoid robot manufacturing involves
              hundreds of precision mechanical components, proprietary actuator assemblies, force-sensitive joint
              encoders, and integrated neural processing units, all of which must meet automotive-grade reliability
              specifications for industrial deployment. At current volumes, unit economics are almost certainly deeply
              negative; the manufacturing cost-down curve to reach commercially viable margins requires investment in
              dedicated tooling, supply chain rationalisation, and yield improvement that has not been publicly
              confirmed.

              Supply chain concentration in China creates a structural vulnerability. Key component categories — lithium
              battery packs (where CATL is a strategic investor and domestic supplier), AI accelerator chips (subject to
              US export-control restrictions on advanced semiconductors), and precision actuator components — are
              dominated by Chinese suppliers. US export controls on advanced semiconductor manufacturing equipment and
              chips (under the Export Administration Regulations administered by the Bureau of Industry and Security)
              have progressively tightened since 2022. If restrictions expand to include the AI inference chips used in
              Agibot's embedded systems, or if Chinese semiconductor foundries face additional restrictions, Agibot
              could face production disruptions without diversified supply chain alternatives. No public disclosure of
              supply chain redundancy or non-China component sourcing has been made.

              The operational deployment model — where robots are integrated into live production lines using Genie Sim
              for digital twin calibration — requires sustained technical support infrastructure: on-site integration
              engineers, remote diagnostics connectivity, firmware update mechanisms, and field service networks. IFR's
              May 2026 report notes that China now accounts for 54% of global industrial robot installations,
              underscoring the competitive intensity of robotics service networks in China itself. Outside China, Agibot
              has announced market entry at CES 2026 and secured LG Electronics as a Korean strategic investor, but no
              disclosed field service or support infrastructure in the US, Europe, or other international markets
              exists. International deployments without local service infrastructure expose customers to extended
              mean-time-to-repair (MTTR) and increase the risk of deployment failures that damage Agibot's reference
              case quality.
