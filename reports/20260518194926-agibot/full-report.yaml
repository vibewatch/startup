      - number: '3.2'
        title: Direct Competitor Profiles and Capability Comparison
        blocks:
          - type: paragraph
            body: >-
              Figure AI is the best-capitalised Western pure-play humanoid company, having raised $1.9B total including
              a $1B+ Series C in September 2025 at a $39B valuation — the highest sector valuation globally. Figure
              dropped its OpenAI partnership in early 2025, pivoting entirely to proprietary in-house AI models; its
              Figure 03 robot now targets general-purpose home assistance. Figure's BMW factory pilot with Figure 02
              continues but volume and economic terms are undisclosed. Figure's capital scale far exceeds Agibot's
              disclosed $83M+.

              Agility Robotics is the Western company with the most commercially proven deployment track record. Digit
              has been deployed at Amazon fulfilment centres, GXO Logistics, and Schaeffler manufacturing, making it the
              most enterprise-validated bipedal humanoid globally. Agility raised $641M+ including a $400M Series C in
              June 2025. Its Arc fleet-management platform integrates with existing WMS and AMR infrastructure,
              deepening customer lock-in.

              Apptronik (Austin, TX) targets warehouses and manufacturing, citing origins in NASA's Valkyrie programme.
              Apptronik raised $520M in a Series A in February 2026, bringing total disclosed funding to $1.45B+ at a
              $5.5B+ valuation. Its Robotics-as-a-Service model mirrors Agility's enterprise contract approach, with
              Mercedes-Benz as a named deployment partner.

              1X Technologies (Norway) is OpenAI-backed and raised $100M in a Series B in January 2024, total ~$125M+.
              Its wheeled EVE robot is deployed at enterprise security customers, while its NEO bipedal robot targets a
              $20K consumer price point with pre-orders open but no mass commercial deployment as of early 2026.

              Unitree Robotics (China) is Agibot's most direct domestic competitor and the most acute
              hardware-commoditisation threat across the sector. Unitree claims 5,500 humanoid units shipped in 2025 and
              filed for a $580M IPO in China, directly competing with Agibot's volume leadership narrative. Its G1
              bipedal robot is listed at $16,000 — the lowest publicly available price for a bipedal humanoid globally —
              and its H1 at $90,000 targets research and developer segments. The G1 has 23 degrees of freedom and basic
              bipedal locomotion, but its native autonomous AI stack is limited relative to Agibot's full-stack
              embodied-intelligence architecture.

              Agibot differentiates through three angles that most Western competitors cannot simultaneously match: a
              unified full-series portfolio spanning entertainment (X2 compact humanoid at $24.2K), commercial humanoids
              (A2 Lite at $44.6K), and industrial robots (G2 factory platform); a "One Robotic Body, Three
              Intelligences" architecture integrating motion, interaction, and manipulation intelligence; and
              international certifications (FCC, CE-MD, CE-RED, CR) that most Chinese competitors have not yet obtained
              for their humanoid lines. The G2 industrial platform achieved 8-hour zero-error operation on a consumer
              electronics precision manufacturing line at Longcheer Technology — the kind of enterprise operational
              proof that Western buyers require to progress from pilot to deployment commitment.
