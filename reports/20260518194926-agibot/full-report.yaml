      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Agibot's exit readiness as of May 2026 is limited. No IPO timeline, STAR Market registration filing, or
              overseas listing intent has been publicly disclosed. The most probable near-term liquidity pathway for
              early-round investors is a Series C or Series C+ round at a higher post-money valuation, driven by
              industrial deployment proof with a second or third named manufacturing customer. The Swancor Advanced
              Materials acquisition adds a listed-entity component to the corporate structure that could serve as a
              reverse-merger IPO pathway on the Shenzhen exchange, but this would be an unusual structure and its
              feasibility is unconfirmed.

              For a 2025/2026 entry investor, the most probable full-exit pathways are: (1) Chinese A-share IPO (STAR
              Market or Science and Technology Innovation Board, ChiNext), likely no earlier than 2028, contingent on
              CSRC profitability/revenue disclosure requirements; (2) strategic acquisition by a Chinese state-owned or
              state-adjacent industrial company (CATL, BYD, SAIC, State Grid) as part of national embodied intelligence
              infrastructure buildout; or (3) a Western strategic acquisition in a non-US jurisdiction (Japan, South
              Korea, Germany, Singapore), which would require CFIUS- equivalent approval avoidance and would benefit
              from the LG Electronics / Mirae Asset relationship as a bridging investor.

              IPO readiness in the narrow sense depends on the CSRC's evolving IPO policies for high-tech manufacturing
              companies that have not yet reached profitability, a path that has been explicitly opened in China's
              National Embodied Intelligence Development Plan but whose disclosure requirements would force publication
              of revenue and margin metrics currently shielded from investors.

              The five final diligence asks that must be resolved before upgrading from TRACK to INVEST are enumerated
              in TV006. The most urgent (within 90 days for a prospective investor) are: (1) the industrial ARR figure
              or equivalent unit economics for the Longcheer deployment; (2) clarity on the Swancor acquisition capital
              structure and integration timeline; and (3) confirmation of the US Security Robotics Act legislative
              status. The remaining two — a second industrial customer signed contract and a disclosed Series C term
              sheet or post-money valuation — are 6–18 month diligence asks that define the upgrade trigger from TRACK
              to a conditional BUY.
