chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Corporate Structure
        blocks:
          - type: paragraph
            body: >-
              AGIBOT Innovation (Shanghai) Technology Co., Ltd. — known publicly as AGIBOT and in Chinese as 智元机器人
              (Zhiyuan Jiqiren) — is a Shanghai-headquartered robotics and embodied AI company founded in February 2023.
              The company's stated mission is to build world-leading general-purpose embodied robots and their
              application ecosystems through the fusion and innovation of AI and robotics. AGIBOT operates as a
              vertically integrated hardware-and-AI platform: it designs hardware, trains foundation models on
              proprietary data, and deploys robots directly to enterprise customers across manufacturing, commercial,
              and consumer-facing environments.

              The company organises its portfolio around three robot series: Yuanzheng (远征), covering full-size and
              wheeled humanoids; Lingxi (灵犀), covering modular and performance robots; and Genie (精灵), covering
              factory-floor specialised platforms. By January 2026 AGIBOT was publicly citing 5,000 cumulative robots
              shipped; by March 2026 that figure had risen to 10,000 units produced — a production acceleration that,
              according to Omdia data cited by HumanoidIndex, placed AGIBOT first globally in humanoid shipments for
              2025. The company has received four major international certifications (CR, CE-MD, CE-RED, FCC) for its A2
              Ultra flagship, enabling commercial sales across the US, EU, and China. AGIBOT products are available in
              multiple countries and regions as of the report date, with an online store offering the X2 entertainment
              robot at $24,240 and the A2 Lite at $44,560 USD.

              Governance is private and undisclosed. AGIBOT has not published a corporate charter, board composition, or
              equity table in reviewed public materials. The company is at a late Series B / strategic-investment stage
              (private-undisclosed disclosure profile). Revenue, ARR, and key financial metrics remain private.
