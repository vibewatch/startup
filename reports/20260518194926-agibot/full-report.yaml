      - number: '3.4'
        title: Switching Costs, Lock-in, and Supply-Chain Access
        blocks:
          - type: paragraph
            body: >-
              Enterprise humanoid robot deployments create switching costs through three accumulating mechanisms. First,
              system integration: deploying a humanoid fleet requires embedding the robot into warehouse management
              systems, manufacturing execution systems, safety protocols, and operational workflows. Agility's Arc
              platform specifically exploits this by connecting Digit to existing warehouse automation and AMR
              infrastructure; replacing Digit requires re-integrating the broader automation stack. Second, trained
              model customisation: every deployment generates proprietary task-specific fine-tuning data. Switching
              vendors means losing accumulated model performance on facility-specific workflows and task configurations.
              Third, staff training and requalification investments are non-trivial in regulated industrial environments
              where safety certification requirements must be repeated.

              Agibot's lock-in opportunities broadly mirror these mechanisms. Its Genie Studio software platform and
              OmniHand dexterous manipulation system represent potential tooling layers for customers who build
              workflows on Agibot's stack. Supply-chain access provides a structural cost advantage Western competitors
              cannot easily replicate: CATL-backed battery component supply, Longcheer precision manufacturing for
              consumer electronics applications, and the broader Chinese supplier ecosystem underpin Agibot's ability to
              price below Western cost structures at comparable hardware specifications.

              Multi-homing is currently feasible because no single humanoid platform dominates any use case at
              meaningful scale. As deployment volumes grow, first-mover customers accumulate switching costs that make
              the enterprise reference deployments Agility, Apptronik, and — to a lesser extent — Agibot are
              accumulating in 2025–2026 strategically important well beyond their immediate contract revenue.
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
      - number: '3.5'
        title: Moat Durability, Commoditisation Risk, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              Agibot's most durable competitive moat is its production-scale data flywheel. With 10,000 units produced
              by March 2026 — a 4× acceleration in production rate in the prior quarter — Agibot operates the largest
              real-world embodied-AI training fleet outside Tesla. Every deployed unit generates proprietary real-world
              data that competitors without comparable deployment scale cannot match. This is structurally analogous to
              Tesla's FSD advantage from Autopilot fleet data: the more robots deployed, the more diverse task scenarios
              are observed, improving the AI models shared across the fleet. If simulation-based training matures
              sufficiently to displace real-world data needs, this advantage erodes.

              The most serious adverse evidence on Agibot's competitive position comes from three directions. First, the
              proposed US American Security Robotics Act (March 2026) would prohibit the federal government from buying
              or operating Chinese-made humanoid robots, with US senators explicitly citing national security risks from
              potential data transmission to China and naming Agibot and Unitree in the bill's context. Even if the
              legislation targets government procurement only, enterprise buyers in defence-adjacent industries,
              critical infrastructure, and regulated sectors may apply the same logic independently — functionally
              excluding Agibot from a significant share of the US addressable market without any formal restriction on
              private-sector sales.

              Second, the capital disadvantage relative to Western competitors is substantial. Figure AI ($1.9B),
              Agility ($641M), and Apptronik ($1.45B) collectively raised over $4B in 2024–2026 — approximately 48×
              Agibot's disclosed $83M+ funding. Even if Agibot's manufacturing cost structure and production scale are
              superior today, sustained R&D investment by competitors could close the autonomy and capability gap within
              two to three years.

              Third, and most immediately, the price commoditisation threat from Unitree and other Chinese manufacturers
              risks stripping the hardware margin from Agibot's business model. Goldman Sachs specifically flags 2026 as
              a potential expectation-reset year, noting that shipment targets from top Chinese manufacturers may
              significantly outpace actual enterprise demand. If supply races ahead of deployable demand, hardware ASPs
              compress and Agibot's pricing advantage narrows. China's MIIT published national humanoid robot standards
              in February 2026, creating a potential regulatory alignment advantage for domestic manufacturers who
              helped shape them, while Western competitors face additional compliance overhead to meet both their local
              standards and Chinese norms when targeting global markets.
