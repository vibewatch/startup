      - number: '2.3'
        title: 'Buyer and User Segmentation: Budget Owners and Adoption Triggers'
        blocks:
          - type: paragraph
            body: >-
              Agibot has articulated seven standardized productivity solutions targeting distinct buyer segments:
              production-line loading and unloading; industrial material handling; logistics sorting and fulfillment;
              guidance and retail assistance; retail service stations; hospitality; and research or data collection.
              This multi-segment approach reflects the current stage of the market—no single vertical has achieved
              sufficient deployment density to support a single-segment strategy.

              Industrial manufacturing buyers (EMS assemblers, 3C electronics makers, automotive OEMs, and semiconductor
              fabs) represent the highest-conviction near-term segment. Budget owners are VP Manufacturing or CFO-level,
              purchasing against capital equipment budgets. The adoption trigger is multi-model, small-batch production
              demands that exceed fixed-automation capacity: Longcheer's tablet lines, HT-Tech chip handling (up to one
              million chips per day), and Intel's deployment (100,000 chips per day) demonstrate the G2's value in
              precision manufacturing. Logistics and sorting buyers (e-commerce fulfillment, parcel handling) are
              attracted by labor substitution economics: Agibot reports 70% of human throughput at Damon and 50% labor
              cost reduction at Xiaonan Intelligence, though these are early-stage deployments.

              Retail and hospitality buyers (department stores, restaurants, transit operators) present a distinct buyer
              profile: brand and customer experience teams control the budget alongside operations, and the adoption
              trigger is customer engagement uplift rather than pure cost reduction. Agibot's reported 20% foot traffic
              increase at Anta stores and 13% operational cost reduction at Guangzhou Metro illustrate dual-value
              propositions in this segment. Research and education institutions (universities, data factories) were the
              dominant buyer in 2025, accounting for a disproportionate share of shipments per Goldman Sachs; these
              buyers have lower performance requirements and drive early revenue while production scales.

              Agibot's global rental model at €899 per robot per day lowers the capex barrier for hospitality and
              events, enabling trial adoption by buyers who cannot commit to hardware purchase. The Robot-as-a-Service
              model is currently the entry point for Western buyers in the 17-country deployment footprint.
