        title: Product Lines and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Agibot organises its commercial portfolio into three branded robot series aligned to deployment context
              and customer workflow stage. The Yuanzheng (Expedition) series covers full-size bipedal humanoids for
              interaction and enterprise service: the A2 Ultra is the certified flagship (CR, CE-MD, CE-RED, FCC), the
              A2 Lite is the lower-cost commercial variant listed at $44,560 on the Agibot store, and the A2-W is a
              wheeled-base variant optimised for data collection and factory navigation. The Genie (精灵) series targets
              industrial manufacturing: the G1 robot provides native data collection with millisecond-latency VR
              tele-operation, eight high-resolution cameras, and bimanual six-axis force sensing; the G2 is the
              production-grade industrial humanoid now deployed in consumer electronics manufacturing. The Lingxi (灵犀)
              series serves research, education, and entertainment: the X1 is an open-source 29-joint humanoid for
              academic researchers, while the X2 and X2 Ultra are compact half-humanoids (25–30 DOF) for exhibition,
              interactive retail, and research at a starting price of approximately $24,240. At APC 2026 Agibot
              introduced four additional platforms: the A3 (173 cm, 55 kg, entertainment-grade with 10-hour endurance
              and 10-second battery swap), the G2 Air (compact 7-DOF single-arm mobile manipulator for human-in-the-loop
              operations), the D2 Max all-terrain quadruped, and OmniHand 3 Ultra-T (22+3 DOF tendon-driven dexterous
              hand). A D1 quadruped series handles inspection in complex outdoor environments. The product architecture
              follows a customer workflow logic: operators choose a body form factor suitable for the physical
              environment, pair it with the relevant intelligence stack, and deploy via Genie Studio with minimal
              on-site integration engineering.
