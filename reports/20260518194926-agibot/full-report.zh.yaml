  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对承销的重要性
      - 缺口持续的影响
      - 尽调路径
    rows:
      - - 收入（总额；按收入流；按地域）
        - 确认产量代理指标是否转化为确认收入；决定 ARR 运行率和增长轨迹
        - 阻断 — 没有收入轨迹，投资逻辑无法验证；LTV、回本周期或增长率模型都无法建立
        - 要求管理账（FY2024 和 FY2025），并按渠道（硬件 vs 租赁 vs 工业部署）拆分收入
      - - 毛利率和每个 SKU 的 COGS
        - 判断硬件业务是否已越过成本线；若当前销量下为负毛利，走向盈利所需资本会大得多
        - 阻断 — 规模化后仍为负毛利，会显著重塑融资规模和时间表
        - 要求按产品代际提供 COGS 瀑布；BOM、制造人工、QC、质保；拆分硬件 vs 服务利润率
      - - 现金余额、烧钱速度和现金跑道
        - 决定下一轮融资紧迫性；考虑 Swancor 收购，资本消耗可能远高于已披露 VC
        - 阻断 — 没有烧钱速度和现金跑道，无法评估资本充足性和稀释风险
        - 要求截至 2026 年 Q1 的资金头寸、月度现金消耗和前瞻资本计划
      - - 工业部署合同经济性（G2 Longcheer 和管线）
        - G2 工业部署是投资逻辑最关键的高价值收入流；定价和利润率完全未知
        - 重大 — 若 G2 经济性在早期销量下边际或低于 COGS，工业收入爬坡将需要额外补贴资本
        - 要求 G2 部署合同模板（定价、期限、服务费、排他性）；Longcheer 合同 ACV；按阶段拆分客户管线
    notes: 本表反映截至报告日期（2026 年 5 月）的信息缺口。四个缺口都被视为投资承销的重大或阻断项。仅靠公开来源无法解决任何一个缺口；都需要正式数据室访问。公司概况章节记录融资时间线；本表专注于前瞻资本充足性和收入质量缺口。
