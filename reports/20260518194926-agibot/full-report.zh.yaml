      - number: '2.3'
        title: 买方与用户分层：预算所有者和采用触发点
        blocks:
          - type: paragraph
            body: >-
              Agibot
              提出了七套标准化生产力解决方案，面向不同买方细分：产线上下料；工业物料搬运；物流分拣与履约；导览和零售辅助；零售服务站；酒店；以及研究或数据采集。这种多细分打法反映了市场当前阶段——没有单一垂直行业达到足以支撑单一细分策略的部署密度。

              工业制造买方（EMS 组装商、3C 电子制造商、汽车 OEM 和半导体晶圆厂）是近期确定性最高的细分。预算所有者通常是 VP Manufacturing 或 CFO
              级别，采购资金来自资本设备预算。采用触发点，是多型号、小批量生产需求超过固定自动化能力：Longcheer 的平板电脑产线、HT-Tech 芯片搬运（最高每日 1 million 颗芯片）和 Intel
              的部署（每日 100,000 颗芯片）展示了 G2 在精密制造中的价值。物流和分拣买方（电商履约、包裹处理）被劳动力替代经济性吸引：Agibot 报告称，在 Damon 达到人类吞吐量的 70%，在
              Xiaonan Intelligence 降低 50% 劳动力成本，不过这些仍是早期部署。

              零售和酒店买方（百货商店、餐厅、交通运营商）呈现不同买方画像：品牌和客户体验团队与运营团队共同掌握预算，采用触发点不是单纯降本，而是提升客户互动。Agibot 报告称 Anta 门店客流增加
              20%，Guangzhou Metro 运营成本下降 13%，说明该细分有双重价值主张。研究与教育机构（大学、数据工厂）是 2025 年主导买方，按 Goldman Sachs
              口径贡献了不成比例的出货份额；这些买方性能要求较低，在产量爬坡期间带来早期收入。

              Agibot 的全球租赁模式按每台机器人每日 €899 收费，降低了酒店和活动场景的资本开支门槛，让无法承诺购买硬件的买方也能试用。Robot-as-a-Service 模式目前是 17
              国部署版图中西方买方的入口。
