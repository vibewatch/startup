      - number: '7.3'
        title: 运营与供应链风险
        blocks:
          - type: paragraph
            body: >
              Agibot 从手工式生产爬坡到 10,000 台，用了 4 年开发。下一阶段要扩到 50,000–100,000
              台，以服务其客户扩张目标隐含的工业部署规模，难度会高出一个量级。人形机器人制造涉及数百个精密机械部件、自研执行器组件、力敏关节编码器和集成神经处理单元，所有这些都必须达到工业部署所需的车规级可靠性规格。在当前产量下，单机经济性几乎肯定深度为负；要通过制造降本曲线达到商业可行利润率，需要投入专用工装、供应链精简和良率提升，但这些尚未得到公开确认。

              中国供应链集中度形成结构性脆弱性。关键部件类别——锂电池包（CATL 是战略投资者和国内供应方）、AI
              加速芯片（受美国先进半导体出口管制限制）以及精密执行器部件——都由中国供应商主导。美国对先进半导体制造设备和芯片的出口管制（依据 Bureau of Industry and Security 执行的
              Export Administration Regulations）自 2022 年以来持续收紧。若限制扩展到 Agibot 嵌入式系统使用的 AI 推理芯片，或中国半导体代工厂面临额外限制，而 Agibot
              又没有多元化供应链替代方案，就可能遭遇生产中断。公司没有公开披露供应链冗余或非中国零部件来源。

              运营部署模型依赖 Genie Sim 为产线做数字孪生校准，把机器人接入实产线，因此需要持续技术支持基础设施：现场集成工程师、远程诊断连接、固件更新机制和现场服务网络。IFR May 2026
              报告指出，中国现已占全球工业机器人安装量的 54%，凸显中国本土机器人服务网络竞争强度。中国之外，Agibot 已在 CES 2026 宣布市场进入，并拿到 LG Electronics
              作为韩国战略投资者，但没有披露美国、欧洲或其他国际市场的现场服务或支持基础设施。没有本地服务基础设施的国际部署，会让客户暴露在更长平均修复时间（MTTR）之下，并提高部署失败、损害 Agibot
              标杆案例质量的风险。
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
      - number: '7.4'
        title: 合作伙伴、依赖与集中度风险
        blocks:
          - type: paragraph
            body: >
              Agibot 在中国最高层的能见度很高——包括 2026
              年习近平主席上海考察期间进行演示——这强烈指向战略背书和国内市场准入。它同时也是地缘政治集中风险。只要公司创始人的政治地位恶化、中央政府优先级从人形机器人转移，或中美技术紧张升级，支撑快速审批、资本获取和政府采购的优惠政策环境都可能削弱。这种政治背书也会加深西方市场对“嵌入国家体系的机器人”的认知，可能推动立法限制在
              ASRA 框架之外加速扩大。

              Longcheer Technology 是目前文档最充分的商业客户，也是 Agibot “Deployment Year One” 叙事的锚点案例。与 Longcheer 的关系包括全球首个工业规模 3C 具身
              AI 部署，以及公开宣布的计划：到 2026 年 Q3 在 Longcheer 场景扩展至 100 台。这个客户加合作伙伴结构是积极信号，但也意味着主要外部部署证据由单一客户支撑。若 Longcheer
              推迟扩张、降低投入，或自身业务遇到困难，Agibot 会在最需要给下一波企业客户提供可引用证明的时点，失去最醒目的商业参考案例。

              Agibot 的投资人名册——来自中国企业登记数据披露——包括 BYD、SAIC、BAIC Group、JD.com、Tencent、LG Electronics 和 Mirae
              Asset，以及风险投资机构（Hillhouse、Sequoia China/HongShan、Bluerun、Matrix Partners China）。带国资色彩的投资人（BAIC Group
              多数股权国有；SAIC 国有；BYD 获得显著国家补贴）能带来客户入口和监管支持，但也引入治理问题。拥有生产运营场景的投资人客户，可能拿到独立企业客户在正常商业条款下无法复制的优惠部署条件和定价。美国 CFIUS
              审查机制会审查具有潜在国家安全影响的外国投资和收购；Agibot 的投资人结构包含国企资本和 LG（韩国）资本，若进入美国市场或设立合资公司，会引发审查关注。
