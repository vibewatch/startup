      - number: '6.5'
        title: 集中度风险与不利因素
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 的商业订单簿高度集中。截至 May 2026，Longcheer Technology 是唯一生产级客户；按任何合理口径，商业生产收入的客户集中度都是 100%。如果 Longcheer
              因运营、竞争或成本原因暂停或终止部署，AGIBOT 将失去唯一已披露的商业生产参照。这种集中度对一家刚开始商业发布的早期深科技公司并不罕见，但对尽调很重要，必须用客户多元化路线图和管线转化证据来回应。

              Senators Cotton 和 Schumer 在 March 2026 提出的 American Security Robotics Act
              拟禁止美国联邦机构采购或使用中国制造机器人。该法案不影响商业企业采购或直接面向企业的 RaaS 订阅，对 AGIBOT 现有客户订单簿的短期影响有限。但它释放了更广泛的美国监管和采购风险信号，影响 AGIBOT
              长期进入美国政府市场的战略。

              人形机器人部署中的法律责任仍是未解决的系统性风险。Hill Dickinson 的 2026
              年分析指出，产品责任、职业健康与安全义务、运营方责任，都是企业客户在工厂地面部署人形机器人时的重大顾虑。这些责任缺口可能拉长采购周期，并要求 AGIBOT 提供明确赔偿或保险产品。中国 MIIT 预计在 2026
              年推出的人形机器人国家安全标准，也可能增加认证要求，影响新客户部署前置时间。AGIBOT 的 APC 2026 伙伴生态模型通过全球行业伙伴渠道销售标准化生产力解决方案；如果 MOU
              到已签生产合同的转化率偏低，该模型会产生渠道依赖风险。
