      - number: '4.4'
        title: 资本充足性、融资依赖与 IPO 信号
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 自 February 2023 以来已完成十余轮融资；完整时间线已在公司概况章节列出，这里只作为评估资本充足性的背景。按 Tracxn 和 HumanoidIndex，已披露风险投资约为 $83.8
              million。但这个数字几乎肯定低估了实际融资总额：中国民营企业披露通常不完整，QCC 工商登记显示公司有 40+ 名股东，覆盖多轮未披露规模的融资。QCC 数据中的关键轮次包括 BYD 参与 A+
              轮（August 2023）、Tencent 的 Series B（March 2025）、JD.com / JoyGen 的 B+ 轮（May 2025），以及 LG Electronics / Mirae
              Asset New Growth Fund 战略轮（August 2025）。AGIBOT 拒绝披露 LG Electronics / Mirae Asset 轮次规模或投后估值；Pandaily
              报道称，其投前估值超过 7 billion yuan（按 July 2025 汇率约 $960 million）。

              影响最大的资本事件是 Swancor Advanced Materials 收购。July 8, 2025，Swancor Advanced Materials（深圳 A 股上市）披露，由 AGIBOT
              及其核心团队组成的财团同意支付最高 CNY 2.1 billion（~$290 million USD）取得公司控制权。这个金额约为 AGIBOT 已披露 VC 总额的
              3.5×，代表其押注上游高性能材料垂直整合。AGIBOT 澄清，12 个月内没有改变 Swancor 主业的确定计划，并否认借壳上市；但市场参与者怀疑这是一条上市路径，这一假设仍然存在。该收购大幅提高
              AGIBOT 的融资需求，也压缩了可用于机器人研发和部署的资本。

              IPO 信号：Reuters（经 US News，March 2026）报道，AGIBOT 和 Unitree 是准备在 2026
              年于中国上市的中国人形机器人公司之一。公司尚未宣布正式招股书、路演日期或承销商任命。任何 A
              股或同等上市流程都必须披露收入和毛利率；这一披露时点可能是公开投资者首次看到已确认财务指标的机会。在此之前，收入、烧钱速度和现金跑道完全未披露，构成财务承销的阻断级缺口。
