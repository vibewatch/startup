      - number: '4.2'
        title: 成本结构、资本强度与制造经济性
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 的成本结构很像一家早期垂直整合机器人公司：研发和 AI 模型训练吃掉大量资本开支，制造端投入很重，每一次工业部署还要叠加服务交付成本。公司按车规级生产原则制造，每台 A2 Lite 设置 92
              个综合检验点，A2 Ultra 还要经受最高 2,000 小时行走测试（包括 360
              小时连续运行且无异常）。这套质量控制匹配高端硬件制造的经济模型，也意味着单机质量保证成本不低，但公司没有公开披露。热插拔电池系统、UWB 群体定位（支持 100 台机器人同步表演）、带 3D
              触觉感知的灵巧手，都让 AGIBOT 的 BOM 复杂度高于更简单的人形机器人设计。

              部署经济性最有信息量的代理指标来自 Longcheer Technology 的 G2 工业项目。AGIBOT 称，借助 Genie Sim 3.0 数字孪生压缩调试，G2 现场安装只需 36
              小时，而传统调试通常要数月——这显著改善部署 COGS。产品型号切换时，设备复用率达到 95%；新产线配置的再训练不超过 4 小时。这些指标说明，G2 的经常性服务成本结构低于第一代工业机器人，但每台已部署 G2
              的绝对美元经济性仍未披露。Longcheer 项目从启动到投产用了 4 个月，这可以作为单客户集成成本的合理代理，投资者应在尽调中量化。

              制造爬坡的经济性可以从产速数据看出来：AGIBOT 从成立（February 2023）到 1,000 台大约用了 24 个月，early 2026 累计达到 5,000 台，随后又在大约 3 个月内从
              5,000 台跃升至 10,000 台，吞吐速度加快 4×。这轮爬坡意味着公司在供应链工业化上投入不小，覆盖零部件、电池系统、执行器和检测产能；其投资方名单包括与汽车供应链相关的
              BYD、Tencent、JD.com 以及 Longcheer Technology 本身（上市代码：603341.SH），也与此相符。HumanoidIndex 还提到，电池系统供应有 CATL
              支持。Swancor Advanced Materials 收购（CNY 2.1B 财团交易，~$290M）显示 AGIBOT 想向上游高性能材料垂直整合，这是一笔重资本承诺，也会进一步放大融资依赖。
