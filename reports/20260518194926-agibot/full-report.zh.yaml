        title: 图表证据
        blocks:
          - type: callout
            title: 地缘政治市场分裂：美国立法瞄准中国人形机器人
            body: >-
              American Security Robotics Act（2026 年 3 月）将禁止美国联邦政府购买或使用中国公司制造的人形机器人。如果生效，它可能延伸到盟国采购和 ITAR
              等价管制，形成正式的两层市场：中国来源机器人（Agibot、Unitree）对西方来源机器人（Figure AI、Agility、Boston Dynamics）。无论产品能力如何，Agibot
              在主权和关键基础设施场景中的美国可触达市场都会受到实质限制。与 Hyperscale Data 的 Michigan 合作是一种对冲，但不能解决制造来源问题。
