              Goldman Sachs 的 2035 年 $38B 估计衡量硬件和软件收入；ARK Invest 的 $24T 衡量劳动力替代的经济价值——600×
              差距反映的是范围，而非分析错误。MarketsandMarkets 的 2030 年 $15.26B 是硬件口径；IDC 的 510,000 台预测则根据 ASP 不同，意味着
