      - number: '8.4'
        title: 反向情景——地缘政治风险、估值过高与竞争压力
        blocks:
          - type: paragraph
            body: >-
              Agibot 的反向投资情景锚定三类相互强化的风险：地缘政治市场准入限制、估值不透明与估值过高风险，以及不断加强的西方竞争压力。

              截至 2026 年 Q2，地缘政治风险是最重要的反向因素。美国议员于 2026 年 3 月 26 日提出 American Security Robotics
              Act，拟禁止美国政府机构采购中国来源的人形和移动机器人。虽然截至报告日期法案尚未通过，但提出本身反映出围绕中国机器人风险的两党政治共识，并且很可能从政府采购细分市场外溢。与美国政府签有合同的企业买家（国防、物流、医疗）已经面对合规审查，即便法案正式通过前，也会从类别上排除
              Agibot 硬件。Huawei 在电信、DJI 在企业无人机领域都经历过同样路径。Hill Dickinson 对人形机器人责任框架的法律分析将法律问责、数据主权和安全认证标准列为 2026
              年推进最快的三大监管维度；这些都会为中国来源机器人进入西方企业部署制造额外结构性壁垒。

              中国国内监管环境提供部分抵消：Robotics & Automation News 报道，2026 年 3 月发布的新型人形机器人标准由 Agibot 的生产规模牵引，使其在国内采购中获得竞争优势。State
              Grid Corporation 的 CNY 68B 具身智能采购招标中，Agibot
              是参与方，代表一条重要的潜在政府合同管线。不过，对中国政府采购的依赖也带来另一种风险：政策优先级变化、付款节奏以及单一客户集中。

              相对于西方同行，约 $960M 的投前入场点降低了估值过高风险——显著低于 Figure AI 的 $3.2B 或 1X Technologies 隐含 $3–5B C
              轮区间。但公司没有披露任何财务指标（收入、ARR、毛利率、烧钱速度、现金），因此无法验证约 $960M 估值是否由单位经济模型支撑。10,000 台生产里程碑是产量信号，不是盈利能力信号。在工业 ARR
              公开披露之前——哪怕只是方向性披露——所有估值锚点都依赖产量可比和战略投资人信号，而不是基本面指标。

              西方同行的竞争压力是中期但持续上升的风险。Figure AI 面向家庭和通用部署的 Helix 模型，可能在 Agibot 进入西方市场之前抢占企业 AI-机器人心智。Agility Robotics 的 GXO
              物流部署提供了一个美国本土“安全港”可比对象，企业物流买家无需承担地缘政治合规风险即可采购。Unitree G1 约 $16,000 的价格点对开发者和研究细分市场形成结构性下行压力，可能在 Agibot
              开发者生态（AIMA）成熟之前锁定平台标准。
            claimRefs:
              - CV032
