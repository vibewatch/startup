      - number: '1.3'
        title: 融资历史、投资人和资本位置
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 自 2023 年 2 月创立以来已完成 10 多轮融资。按 Tracxn 口径，已披露资金约 $83.8 million，但这个数字很可能偏低：中国工商登记数据（Qichacha）列出 15
              个以上不同股东载体，其中包括多个匿名有限合伙，与更多未披露融资轮相符；估值来源之间也存在实质差异。Pandaily 报道估值「超过 7 billion yuan」（按报道时汇率约 $960 million），而
              Tracxn 较新的数据库条目把估值列为 $6.4 billion USD——这一差异更可能反映计量日期不同，而非真实分歧。

              投资人基础横跨中国工业与科技公司、国内 VC 和国际投资者。已确认的产业投资人包括 BYD（Qichacha 显示 A+ 轮，2023 年 8 月）、Tencent Holdings（Qichacha 显示 B
              轮，2025 年 3 月）、BAIC Group、SAIC Motor、JD.com 和 TCL Technology（据 Yicai Global 报道）。HumanoidIndex 将 CATL
              列为重要支持方。Gaocheng Ventures（与 GGV/Gaocheng 相关）被识别为早期投资人。最近披露的一轮融资来自 Mirae Asset-LG Electronics New Growth
              Fund 的战略投资，于 2025 年 8 月完成；这是 LG Electronics 首次投资具身智能领域。LG-Mirae 轮的金额和隐含估值未披露。

              收入和盈利数据完全未公开。审阅来源没有报道债务、信贷额度或老股交易。公司的资本位置意味着它正依靠机构股权烧钱，符合一家已规模化运营但仍处于收入前或早期收入阶段的硬件 AI
              公司特征。员工数未获官方披露；HumanoidIndex 报道为 500+ 人。
