      - number: '6.4'
        title: 留存、耐久性与扩张
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 没有披露任何净留存率（NRR）、总留存率（GRR）、流失率、合同续约率或客户满意度指标。市场上也未发现 AGIBOT 产品的 G2 评论、Gartner Peer Insights
              评分或第三方客户满意度平台数据。因此，所有留存信号都只能从结构性指标推断，而不是从已披露数据实测得出。

              最强的结构性留存信号是 Longcheer 部署的扩张轨迹：从试点扩到 100 台车队，意味着先落地再扩张的模型，即初始部署表现带动有机车队增长。Longcheer 从 4 个月试点转入生产，也说明 AGIBOT
              的现场工程支持足以促成试点转化，这是客户耐久性的早期关键指标。不过，RaaS 模型的定价（€899/day，未披露最低期限）留下了低切换成本终止的可能，这会意味着早期商业客户队列流失率高于平均水平。

              Genting Malaysia MOU 是无约束力的意向书，没有披露合同价值、时间表或 SLA 承诺。人形机器人行业的 MOU 经常无法在 12 个月内转化为已签署生产合同，因此 Genting
              和类似关系不适合作为耐久性经常性收入的证据。AGIBOT 当前商业阶段的整体留存状态最适合概括为「结构性不确定，但方向偏正面」：Longcheer 扩张计划令人鼓舞，但单一标杆客户无法证明可复制模式。
