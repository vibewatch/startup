  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价与变现
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 的变现模式组合硬件产品销售、租赁 / 机器人即服务（RaaS）产品，以及正在增长的软件插件和平台服务层。最清晰的定价信号来自公司的全球线上商店（store.agibot.com），公开列出 X2
              半尺寸娱乐人形机器人价格为 $24,240 USD，全尺寸 A2 Lite 娱乐人形机器人价格为 $44,560 USD。两款产品都收取 $500–$3,000
              运输押金，所有进口关税和税费由客户承担。产品包含一年质保（或 3,000 小时累计运行时间，以先到者为准）。A2 Ultra——AGIBOT 旗舰商业级全尺寸人形机器人——没有公开标价；根据官方产品页，它已部署在
              20 多家领先企业，用于展厅、客户服务和品牌背书场景。A2 Ultra 采用 B2B 协商定价，尚未披露。

              除了直接硬件销售，AGIBOT 还建立了「全球租赁平台」，公司或其分销伙伴通过该平台提供人形机器人短期商业使用。Humanoids Daily 报道酒店垂直的租赁费率为每日 €899，部署包括 Genting
              Malaysia（MOU 于 2026 年 4 月 17 日签署），以及通过与 Singtel 的机器人即服务（RaaS）安排进入新加坡。€899/day
              提供了具体租赁价格点，但合同结构（最低期限、数量阶梯、是否包含维护）尚未得到独立确认。

              软件层变现已在 AGIBOT 产品 FAQ 中明确写出：A2 Lite 和 A2 Ultra 的群控软件、升级技能包和 VR 远程控制套件需要「额外付费」。这些组件的定价没有公开披露，但「技能包商店」和
              AIMMASTER 客户端软件的存在，显示硬件之外的附加收入机会正在形成。AIMA 开放栈开发者生态在 APC 2026 发布，瞄准在 AGIBOT 硬件上构建应用的第三方开发者；商业许可或 API
              定价尚未公布。G2 平台在工厂客户（Longcheer Technology，并计划扩展到汽车和半导体）处产生的工业部署收入，是第四条收入来源，但项目经济性完全未披露。
