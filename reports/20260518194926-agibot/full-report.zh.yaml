  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与投资逻辑概要
        blocks:
          - type: paragraph
            body: >-
              Agibot 获得 TRACK（观察）投资建议，综合评分
              6.8/10，置信度中等，风险评级高。这个建议反映出一种真实且有证据支撑的张力：公司在生产规模上取得了异乎寻常的成果，但财务、地缘政治和商业层面仍有一组未解决的不确定性，阻止我们给出更高确信度的立场。

              投资逻辑有五根相互支撑的支柱。第一，截至 2026 年 Q1，Agibot 是全球出货规模最高的人形机器人制造商：公司 2026 年 3 月生产出第 10,000 台人形机器人，2025 年出货约 5,100
              台，并拿到 Omdia 全球人形机器人出货量第一。西方或亚洲竞争对手都没有达到这一规模。第二，G2 在江西南昌 Longcheer Technology 平板工厂的工业部署——G2 机器人连续 8 小时完成
              2,283 项任务、零错误——是截至 2026 年 5 月该领域最有说服力的工业规模人形机器人证据。第三，Agibot 的投资人基础包括 BYD、Tencent、JD.com、LG
              Electronics、Mirae Asset、Gaorong Capital（High-Flyer/Hillhouse）、Sequoia China 和 TCL
              Ventures；这组联盟提供了西方竞争对手拿不到的深度供应链、分销和资本市场优势。第四，Goldman Sachs《Humanoid Robot: The AI Accelerant》报告和 IDC 2026
              年人形机器人商业化分析都把制造规模和工业部署证据列为私募机器人估值的两大核心价值驱动因素；Agibot 在两项上都领先。第五，投前估值约 $960M（CNY 7B+，2025 年 8 月）较 Agility
              Robotics C 轮隐含估值折价约 45%，较 Figure AI 最近一轮折价约 70%，为能承受中国敞口的机构投资人提供了相对价值切入点。

              反向逻辑同样重要。收入、毛利率和烧钱速度完全未披露：Agibot 是私营公司，尚未发布任何财务披露。主导收入流不是高毛利的工业经常性合同，而是娱乐和服务人形机器人的硬件销售（A2 Lite 售价
              $44,560，X2 售价 $24,240）；转向工业 RaaS 是投资逻辑关键，但商业上尚未在规模化场景验证。Swancor Advanced Materials 收购（CNY 2.1B，约
              $290M）引入了一项规模大、复杂且非核心的资本投入，其战略理由——向高性能材料做垂直整合——合理但未经验证，整合也会占用大量管理层带宽。拟议中的 American Security Robotics
              Act（2026 年 3 月）将禁止美国政府机构采购中国来源机器人，并预示北美和欧洲市场更广泛的企业采购犹豫。最后，Unitree G1 约 $16,000 USD
              的价格在开发者和研究细分市场形成结构性价格压力，而 Figure AI 的 Helix 通用 AI 模型和全球汽车客户进展带来能力叙事风险。

              若满足以下条件，建议将从 TRACK 上调至 INVEST：(1) 已确认工业 ARR 超过 $50M（或披露单位经济模型后达到等量规模）；(2) Longcheer 之外第二个具名工业制造客户实现规模化（>20
              台部署）；(3) 明确 Swancor 整合里程碑和资本配置；(4) US Security Robotics Act 没有出现影响企业细分市场的不利进展；(5) 已确认融资轮披露投后估值，验证或重定价 CNY
              7B+ 投前锚点。投资建议逻辑图（FV001）展示从证据支柱和风险向量到投资结果的因果链。
