      - number: '7.6'
        title: 人员、执行与战略风险
        blocks:
          - type: paragraph
            body: >
              Agibot 由创始人 Edward Deng（CEO、董事长）和 Peng Zhihui（联合创始人、总裁、CTO）领导。Peng Zhihui 曾是 Huawei “天才少年”工程师，并主导 Kirin
              芯片项目，是公司最公开可见的技术人物，常出现在媒体和投资人沟通中。他的前 Huawei 人才身份会强化西方监管框架中的国家安全担忧。Deng 和 Peng
              同时支撑公司的技术可信度、投资人关系和政府地位。目前没有公开披露的继任计划、副手管理层结构或 CTO 备份角色。如此集中的关键人风险符合早期中国科技公司的特征，本身不构成否决项，但需要专项尽调。

              人形机器人竞争格局包括 Unitree（$580M IPO 申报，声称 2025 年出货 5,500 台）、Figure AI（已融资 $1.9B）、Agility Robotics（Amazon
              支持，Digit 已部署于仓库）、Boston Dynamics（Hyundai 支持）和 Physical Intelligence。Agibot
              作为中国量产领先者的战略位置，如果西方采购限制、数据主权担忧和本土竞争对手部署进展同时加速，未必能转化为国际市场份额。IFR 2026 年 5
              月报告指出，中国“十五五”规划（2026–2030）把机器人置于国家工业现代化核心位置，这将加剧国内竞争，并推动竞争对手拿到政府补贴的 R&D。

              Clingendael Institute 描述的 China Standards 2035 倡议，以及 MIIT HEIS 委员会框架所体现的方向，目标是把中国技术规格嵌入全球供应链。Agibot 积极参与
              HEIS 委员会（Peng Zhihui
              任副主任），对国内市场定位来说是理性选择，但也会强化西方市场的一种观感：中国人形机器人标准是为扶持国内冠军而设计，进而加速全球监管分化。若美国、欧盟和盟友国家采纳与中国标准根本不兼容的人形机器人安全和数据治理标准，可服务市场会被切碎，Agibot
              也必须为不同监管制度开发不同产品配置。
