      - number: '2.2'
        title: 市场规模测算：多重视角、矛盾与受限估计
        blocks:
          - type: paragraph
            body: >-
              人形机器人市场有多组独立估计，但彼此相差数个数量级，原因是范围定义不兼容。Goldman Sachs 在基准情景中估计，全球人形机器人市场在 10-15 年内至少达到 $6 billion（来自 2024
              年报告），被广泛引用的 2035 年数字为 $38 billion；若硬件成本、安全和接受度障碍被克服，蓝天上限为 $154 billion。MarketsandMarkets（2025 年 4
              月）更细：全球硬件市场 2025 年为 $2.92 billion，到 2030 年增至 $15.26 billion，CAGR 为 39.2%；中国市场从 $0.40 billion 增至 $2.80
              billion，CAGR 为 47.6%；美国市场从 $0.86 billion 增至 $4.60 billion，CAGR 为 39.9%。

              IDC 的出货量预测换了一个视角：到 2030 年全球出货量超过 510,000 台，CAGR 约 95%——如果采用 $20,000-$50,000 的合理 ASP，意味着到 2030 年收入底线为
              $10-25 billion；这个结果与 MarketsandMarkets 大体一致，但方法不同。Goldman Sachs 在 2026 年 1 月对中国制造商的调研中，把近期预期修正为 2025 年全球出货
              15,000-20,000 台，2026-2027 年目标处于数千至数万台区间，说明市场仍处在早期商业化阶段，而非大规模普及。

              Goldman Sachs 的 $38B 硬件收入估计与 ARK Invest 的 $24 trillion 经济价值估计之间有 600× 差距，这不是对硬件市场的分歧，而是 ARK 衡量的是如果人形机器人替代
              $40+ trillion 年度全球人类劳动力市场的一部分，可能带来的劳动力替代经济影响。这里同时保留两组估计，因为它们代表市场概念上的上下界。基于当前机队规模、ASP 和新兴租赁收入，Agibot
              2026-2028 年受单位经济约束的「SOM 底线」估计为 $150-500 million，但公开数据无法验证。Grand View Research
              和多家其他分析机构也发布了覆盖同一机会的人形机器人市场分析，进一步说明该赛道已是一个成熟研究垂直，拥有广泛机构兴趣；但其具体 2035 年数字在本轮研究窗口内无法取得。
