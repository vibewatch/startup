      - number: '1.4'
        title: 产品组合、部署与商业证据
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 商业成熟度最高的产品是 A2 Ultra，公司称其为行业首个大规模商业部署的全尺寸人形机器人。A2 Ultra 获得四项国际认证（CR, CE-MD, CE-RED, FCC），完成全球首次 24
              小时户外行走直播，并以跨省行走 106.286 kilometres 创下 Guinness World Record，展示了户外移动耐力。它已部署在 20 多家领先企业。A2-W
              是轮式移动操作变体，把底盘、机械臂和感知系统整合起来，可在一天内完成部署。

              G 系列（Genie）面向工厂环境。G1 拥有 26 个自由度，可在工业、商业和家庭场景中运行。G2 是公司的主力工厂部署单元。2026 年 4 月，AGIBOT 宣布多台 G2 机器人已整合进
              Longcheer Technology 位于江西南昌的平板电脑产线——公司称这是全球首个具身 AI 在消费电子精密制造中的大规模落地。AGIBOT 报告称，G2 在 8 小时连续运行中完成 2,283
              个任务且零错误，双方计划到 2026 年 Q3 将 Longcheer 产线上的 G2 扩至 100 台。

              X 系列（Lingxi）包括 X1——一个有 29 个关节的开源硬件和软件平台——以及 X2，一个半尺寸娱乐和商业表演机器人。Genie Studio 平台提供零代码机器人部署编排；AIMA 开放生态在 APC
              2026 发布，旨在降低第三方开发者的集成门槛。在 APC 2026（2026 年 4 月），AGIBOT 还发布五个新硬件平台，包括 A3 全尺寸人形机器人、D2 Max 全地形四足机器人和 G2 Air
              移动操作机器人。软件侧，公司发布了「一体三智」架构下的八个基础 AI 模型。
