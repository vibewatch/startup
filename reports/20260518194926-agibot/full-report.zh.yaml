      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 讲出了一个可信的产能规模故事——从成立起约 26 个月生产 10,000 台、按 Omdia 为 2025 年全球人形机器人出货第一、已确认工业部署且有可量化性能指标——但截至 May
              2026，支撑这些运营里程碑的财务实质对外部投资者几乎完全不透明。

              没有已披露财务数据，就无法评估收入质量。当前收入结构看起来主要由娱乐和商业表演硬件销售驱动，产品包括 X2、A2 Lite、A2 Ultra，标价
              $24,240–$44,560；同时有刚起步的工业部署（Longcheer 的 G2）和租赁 / RaaS 平台。硬件销售收入天然低于订阅或 RaaS
              等经常性收入的质量：它不可重复、履约依赖资本开支，还带有保修责任。€899/day 的租赁 / RaaS 平台和 Singtel 企业 RaaS
              安排说明公司正在形成一层经常性收入，但其规模、合同结构以及对总收入的贡献都未知。A2 Ultra 在 B2B 商业渠道的定价未披露，是关键缺口：如果该产品规模化单价达到
              $60,000–$150,000+（与国际可比商业人形机器人定价一致），娱乐 / 展厅垂直领域的收入集中度可能很高。

              资本结构风险较高。Swancor 收购（~$290 million）把已披露 VC 总额数倍的资金投向单一上游整合赌注。再加上公司已确认的 10,000 台产能（意味着持续 BOM 和制造现金流），AGIBOT
              的实际资本消耗很可能是已披露 $83.8 million VC 的数倍。毛利率、烧钱速度和现金跑道未知，但公司的运营规模、制造强度以及新增的 Swancor 收购都说明融资依赖高，近期资本规划非常关键。

              拟议中的美国 American Security Robotics Act 将禁止美国政府采购或使用中国制造的人形机器人，这对 AGIBOT
              声称的美国市场扩张战略构成重大不利因素，可能封闭相当一部分可触达需求。Hyperscale Data / Omnipresent Robotics 的 Michigan 工厂合作（100,000 sq.
              ft.）以及 Singtel / NCS 新加坡合作确认了国际部署野心，但若没有已确认的合同经济性，仍不足以证明收入重要性。

              核心尽调阻断项包括：（1）收入和年经常性收入（ARR）——完全未披露；（2）毛利率和单机 COGS——完全未披露；（3）烧钱速度和现金跑道——完全未披露；（4）Swancor
              收购财务结构——对资产负债表的影响未量化；（5）工业部署合同条款——价格、规模和 ROI 未公开。若不能通过正式数据室解决 1–3 项，任何投资决定都无法负责任地承销。
