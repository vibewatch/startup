      - number: '3.4'
        title: 切换成本、锁定效应与供应链接入
        blocks:
          - type: paragraph
            body: >-
              企业人形机器人部署通过三种累积机制形成切换成本。第一，系统集成：部署一支人形机器人机队，需要把机器人嵌入仓库管理系统、制造执行系统、安全协议和运营工作流。Agility 的 Arc 平台专门利用这一点，把
              Digit 接入现有仓库自动化和 AMR 基础设施；替换 Digit
              就必须重新集成更广泛的自动化栈。第二，训练模型定制：每次部署都会产生专有的任务级微调数据。更换供应商意味着失去在特定设施工作流和任务配置上累积的模型表现。第三，在受监管工业环境中，员工培训和重新认证投入并不低，安全认证要求也必须重复完成。

              Agibot 的锁定机会大体对应这些机制。它的 Genie Studio 软件平台和 OmniHand 灵巧操作系统，可能成为客户在 Agibot
              栈上搭建工作流的工具层。供应链接入提供了西方竞争对手难以复制的结构性成本优势：CATL 支持的电池部件供应、Longcheer 面向消费电子应用的精密制造，以及更广泛的中国供应商生态，共同支撑 Agibot
              在可比硬件规格下以低于西方成本结构的价格销售。

              当前多栖采购仍可行，因为还没有单一人形机器人平台在任何用例上形成有意义规模的主导地位。部署量增长后，先发客户会累积切换成本；这使 Agility、Apptronik 以及在较小程度上 Agibot 于
              2025–2026 年积累的企业参考部署，在战略意义上远超其即时合同收入。
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Agibot 最耐久的竞争护城河，是生产规模驱动的数据飞轮。截至 2026 年 3 月，Agibot 已生产 10,000 台机器人——上一季度生产速度提升 4×——运营着 Tesla 之外最大的真实世界具身
              AI 训练机队。每台已部署机器人都会产生专有真实世界数据，没有可比部署规模的竞争对手无法匹配。这在结构上类似 Tesla 从 Autopilot 车队数据获得的 FSD
              优势：部署机器人越多，观察到的任务场景越多样，整个机队共享的 AI 模型就越强。如果基于仿真的训练成熟到足以替代真实世界数据需求，这一优势会被削弱。

              Agibot 竞争位置上最严重的反向证据来自三个方向。第一，美国拟议的 American Security Robotics Act（2026 年 3
              月）将禁止联邦政府购买或运营中国制造的人形机器人；美国参议员明确援引潜在数据向中国传输的国家安全风险，并在法案语境中点名 Agibot 和
              Unitree。即使立法只针对政府采购，国防相邻行业、关键基础设施和受监管行业的企业买方也可能自行采用同样逻辑——在没有任何私人部门销售正式限制的情况下，实际上把 Agibot
              排除在美国可触达市场的重要部分之外。

              第二，相对西方竞争对手的资本劣势很大。Figure AI（$1.9B）、Agility（$641M）和 Apptronik（$1.45B）在 2024–2026 年合计融资超过 $4B——约为 Agibot
              已披露 $83M+ 融资的 48×。即便 Agibot 目前制造成本结构和生产规模更优，竞争对手持续砸钱做 R&D，也可能在两到三年内缩小自主能力和功能差距。

              第三，也是最迫近的一点，Unitree 和其他中国制造商带来的价格商品化威胁，可能剥掉 Agibot 商业模式中的硬件利润率。Goldman Sachs 特别提示，2026
              年可能是预期重置之年，指出头部中国制造商的出货目标可能显著跑在实际企业需求前面。如果供给先于可部署需求冲刺，硬件 ASP 会压缩，Agibot 的定价优势会收窄。中国工信部（MIIT）于 2026 年 2
              月发布国家人形机器人标准，为参与制定标准的本土厂商创造潜在监管一致性优势；而西方竞争对手面向全球市场时，既要满足本地标准，也要满足中国规范，合规成本更高。
