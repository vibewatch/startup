  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Agibot 将商业产品组合拆成三条品牌机器人系列，对应不同部署场景和客户工作流阶段。Yuanzheng (Expedition) 系列覆盖用于交互和企业服务的全尺寸双足人形机器人：A2 Ultra
              是已获认证的旗舰机型（CR、CE-MD、CE-RED、FCC），A2 Lite 是 Agibot 商店标价 $44,560 的低成本商业版本，A2-W 则是面向数据采集和工厂导航优化的轮式底盘版本。Genie
              (精灵) 系列面向工业制造：G1 机器人提供原生数据采集能力，配备毫秒级延迟 VR 遥操作、8 个高分辨率摄像头和双臂六轴力感知；G2 是量产级工业人形机器人，现已部署在消费电子制造中。Lingxi (灵犀)
              系列服务科研、教育和娱乐：X1 是面向学术研究者的开源 29 关节人形机器人，X2 和 X2 Ultra 是紧凑半身人形机器人（25–30 DOF），用于展览、互动零售和研究，起价约 $24,240。APC
              2026 上，Agibot 又推出 4 个平台：A3（173 cm、55 kg，娱乐级，续航 10 小时，10 秒换电）、G2 Air（紧凑 7-DOF 单臂移动操作臂，面向人在回路作业）、D2 Max
              全地形四足机器人，以及 OmniHand 3 Ultra-T（22+3 DOF 腱驱灵巧手）。D1
              四足系列负责复杂户外环境巡检。产品架构遵循客户工作流逻辑：运营方先选择适合物理环境的机体形态，再匹配相应智能栈，并通过 Genie Studio 部署，尽量减少现场集成工程。
