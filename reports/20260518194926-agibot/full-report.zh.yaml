      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 由两名核心人物共同创立并领导。Deng Taihua（邓泰华）担任 CEO，也是控制性受益所有人；中国工商登记数据（Qichacha）显示，截至 2025 年 7 月，他作为实际控制人持有约 33%
              的受益所有权。Peng Zhihui（彭志辉）是联合创始人兼 CTO，也是公司全栈机器人平台的技术架构师；Tracxn 的公司资料专门把他与 Deng 并列列出，并且在 2026 年 3 月 10,000
              台里程碑活动中，他以「联合创始人兼 CTO」身份出席。审阅材料尚未独立确认 Peng Zhihui 是否就是中国科技内容创作者「稚晖君」（Zhi Hui
              Jun），尽管网络上广泛流传；这一点仍是待解问题，不是既定事实。

              已确认的其他高管包括高级副总裁 Chuang Wang（王闯），他共同发布了第 10,000 台里程碑；以及 Dr. Yao Maoqing（姚茂庆），合伙人、高级副总裁兼具身业务单元总裁，他在 CES 2026
              以官方发言人身份代表 AGIBOT。官方称创始团队由「全球科技龙头核心高管和顶尖 AI 科学家」组成，但审阅的公开材料没有确认个人过往雇主和详细履历。

              董事会构成、投资人席位和治理条款均未公开披露。公司自创立以来未宣布任何重大领导层变化。关键人物集中度偏高：两位联合创始人分别占据最高经营与技术岗位，公司也未披露继任人或分布式领导架构。截至本报告日期，公司似乎没有发布任何
              IPO、双重上市或 SPAC 的治理里程碑。
