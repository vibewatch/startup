      - number: '6.3'
        title: 具名客户证明——生产与试点
        blocks:
          - type: paragraph
            body: >-
              截至 May 2026，Longcheer Technology 是 AGIBOT 唯一已确认的生产级客户。Longcheer 总部在中国，是 Lenovo ODM 和电子制造合作伙伴，已在其 Shenzhen
              和 Dongguan 的 MMIT 消费电子精密装配线上部署 AGIBOT G2 机器人。部署指标——310 UPH 吞吐、99.9% 动作成功率、19–20 秒节拍、100% 准时交付、每天运行 16
              小时且其中 8 小时自主运行——由 AGIBOT 和 Longcheer 在 PRNewswire 公告中联合发布，并得到 Longcheer 官网佐证；后者将自己描述为 AI
              赋能的智能制造伙伴。Longcheer 在 April 2026 获得 Lenovo 的 2026 Perfect Quality Award，说明性能提升可能强化该部署的留存理由。

              Longcheer 之外，AGIBOT 的 APC 2026 伙伴大会宣布了一系列 MOU 和 RaaS 合作。Genting Malaysia 签署了 MOU（New Straits Times，April
              2026 确认），计划在 Genting Highlands 的酒店和主题公园运营中部署人形机器人。Genting Malaysia 官网描述了其在全球度假村运营中的活跃扩张策略。Hyperscale Data
              是美国 Michigan 一座 100,000-square-foot 数据中心设施的运营方，已与 AGIBOT 签署合作协议。第三方来源还通过 RaaS 项目提到 SIR Spa Group（Italy）和
              Singtel（Singapore）为其他早期合作伙伴。截至 May 2026，这些非 Longcheer 部署都没有确认进入生产阶段。AGIBOT 声称 APC 2026 有「20
              多家头部企业」参与，但没有披露完整名单。

              AGIBOT 官网发布的视频证言和客户 Q&A（APC 2026 报道）显示，来自不同行业的国际参会者正面评价了大会，但公开记录中没有任何非 Longcheer 客户披露具体部署指标或合同价值。BYD 和
              JD.com 以战略投资者身份出现，可能有部署兴趣，但尚未确认是活跃生产客户。
