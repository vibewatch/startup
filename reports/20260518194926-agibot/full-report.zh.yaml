            - X2 / X2 Ultra — 紧凑型娱乐和教育（25–30 DOF）
            - A3 — 高性能交互式人形机器人（173 cm，55 kg，0.218 kW/kg）
        - label: 传感器与执行器
          detail: 感知套件覆盖 RGB-D、LiDAR、力、IMU、触觉和音频；同一传感器栈在双足和轮式底盘变体中复用。
          items:
            - 8× 高分辨率摄像头（上半身，完整 3D 覆盖）
            - 6 轴力传感器——双臂（G1/G2）
            - LiDAR + RGB-D（底盘导航和避障）
            - IMU（YIS320，X1 下肢 DCU）
            - 肩部触觉传感器；头部触摸传感器（A3、X2）
            - 多阵列 360° 麦克风，用于语音采集（A3）
        - label: 端侧智能与中间件
          detail: AimRT 开源中间件提供实时进程间通信；GO/BFM/WITA/GCFM 模型家族在端侧或边缘卸载下处理操作、运动和多模态交互。
          items:
            - AimRT v1.7.0 — 开源实时中间件，ROS 2 / zenoh / gRPC
            - GO-1 / GO-1 Air — 开放操作 VLA 基础模型
            - GO-2 (VILLA) — 动作思维链操作模型
            - BFM / GCFM — 运动智能（文本 / 音频提示驱动动作）
            - WITA Omni — 机器人原生多模态（视觉 + 语音 + 手势）
            - GDK (Genie Development Kit) — 端侧推理和控制 SDK
        - label: Genie Studio（开发平台）
          detail: 端到端开发者和操作员平台，覆盖数据采集、模型微调、物理仿真和一键部署；集成 RDT、Pi0、OpenVLA 等领先开源模型。
          items:
            - 数据采集 — 每设备每天最高 1,000 帧，人在环 QA
            - 训练 — GO-1、RDT、Pi0、OpenVLA、GR00T；48 GPU-day 微调模板
            - 仿真（Genie Sim 3.0）— 8,000+ 个 3D 资产，仿真到现实误差 <5%
            - 一键部署 — 相比单 GPU 基线，推理提升 2–3×
            - Genie Studio Agent — 零代码拖拽式工作流编排
        - label: 机队编排与数据飞轮（SOP / Cloud）
          detail: SOP 框架和云基础设施支撑整个已部署机队在部署后的模型持续改进；AgiBot World 数据集作为未来模型代际预训练的基础。
          items:
            - 多机器人并行执行 — 机队共享策略
            - 集中式云端在线 VLA 更新 — 小时级收敛
            - 模型即时同步至所有机队设备
            - AgiBot World 数据集 — 1M+ 条轨迹，IROS 2025 最佳论文入围
            - 边缘 + 云端混合计算 — 支持轻量级本体计算或边缘卸载
    approximationNotes: 层级构成来自官方产品页面、Genie Studio 文档、AimRT 发布说明和 APC 2026 新闻稿；部分子组件可能仅供内部使用，尚未完全公开。
