    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与公司结构
        blocks:
          - type: paragraph
            body: >-
              AGIBOT Innovation (Shanghai) Technology Co., Ltd.——公开品牌为 AGIBOT，中文名为 智元机器人（Zhiyuan
              Jiqiren）——是一家总部位于上海的机器人与具身 AI 公司，成立于 2023 年 2 月。公司宣称的使命，是靠 AI 与机器人技术的融合创新，打造世界领先的通用具身机器人及其应用生态。AGIBOT
              采用垂直整合的硬件与 AI 平台模式：自己设计硬件，用自有数据训练基础模型，并把机器人直接部署给制造、商业和面向消费者场景中的企业客户。

              公司围绕三条机器人系列组织产品组合：Yuanzheng（远征）覆盖全尺寸与轮式人形机器人；Lingxi（灵犀）覆盖模块化与表演机器人；Genie（精灵）覆盖工厂地面专用平台。到 2026 年 1 月，AGIBOT
              已公开称累计交付 5,000 台机器人；到 2026 年 3 月，产量升至 10,000 台——据 HumanoidIndex 引用的 Omdia 数据，这一生产提速让 AGIBOT 在 2025
              年人形机器人出货量上位列全球第一。公司的 A2 Ultra 旗舰机型已获得四项主要国际认证（CR, CE-MD, CE-RED, FCC），可在美国、欧盟和中国商业销售。截至本报告日期，AGIBOT
              产品已进入多个国家和地区，线上商店中 X2 娱乐机器人标价 $24,240，A2 Lite 标价 $44,560 USD。

              公司治理仍未公开。审阅的公开材料中，AGIBOT 没有发布公司章程、董事会构成或股权结构表。公司处于后期 Series B /
              战略投资阶段（私有、未披露画像）。收入、年经常性收入（ARR）和关键财务指标仍未公开。
