      - number: '7.2'
        title: 技术与产品风险
        blocks:
          - type: paragraph
            body: >
              Agibot 从 5,000 台到 10,000 台只用了 3 个月，生产加速在运营上令人印象深刻，但也引入外部资料难以评估的规模化质量风险。Longcheer Nanchang 平板工厂 8
              小时零错误运行（完成 2,283 个任务）是有说服力的数据点，但它只代表单一设施、单一部署，在 3C 装配线上执行定义明确的一部分抓取放置任务。当每个客户工业化到 100+
              台，并跨入汽车、半导体和服务环境后，环境条件、任务复杂度、边缘案例和交互场景都会出现差异，单一试点无法预判。公开资料中没有 Agibot 量产规模下的平均故障间隔时间（MTBF）、现场退货率或质量逃逸率数据。

              Agibot 商业机器人的官方安全支持期——A2、G2 / G2 Air 和 X2 Ultra——从 January 2026 发布日起只有 12 个月（截至 January
              2027）。软件产品（Aimmaster、App、PAD）同样只有 12 个月安全更新窗口。企业客户把人形机器人接入长周期工业流程时，资本设备通常预期运行 5–10+ 年；12
              个月安全补丁窗口明显不够。它制造了合同和责任缺口：January 2027 之后，在生产环境中运行过期固件的机器人会成为网络安全攻击目标，运营方独自承担未缓释风险。Agibot
              没有公开声明长期支持义务、延长服务协议，或定义期限之外的安全更新治理。

              Agibot 把 Genie Sim 3.0 数字孪生定位为快速部署的关键抓手，可把传统数月现场调试压缩到 36 小时。这在受管理部署中确实是竞争优势，但也引入新的单点故障：如果 Genie Sim
              基础设施宕机、重新定价或无法使用，现有部署管线就会被打断。MIIT 标准也指出，触觉感知仍是关键瓶颈；Peng Zhihui 本人在 MIIT 委员会承认，高价值操作任务中近 80%
              依赖尚未标准化的触觉反馈。没有标准化触觉感知，机器人面对新颖或未表征物体时，错误率可能显著高于受控演示中的报告水平。

              Humanoid Index 确认的 IDC 口径称 2025 年出货 5,200 台，但竞争对手 Unitree 对此提出异议，声称其人形机器人出货 5,500 台，并申请 USD 580 million
              IPO。这场出货量争议说明，行业产量数字没有经过审计，也无法独立验证。如果 Agibot 的产量主张被夸大，或指向已制造但未交付设备，支撑投资逻辑的商业证据就会减弱。这个验证缺口在任何阶段都是重大尽调风险。
