  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              American Security Robotics Act (ASRA) 由参议员 Tom Cotton (R-AR) 和参议员 Chuck Schumer (D-NY) 于 26 March 2026
              提出，是 Agibot 国际扩张面临的最重大近期监管风险。这项两党法案以数据外流和远程控制潜力带来的国家安全担忧为由，拟禁止美国联邦政府采购或运营中国公司制造的人形机器人。Reuters 和 US News
              确认，法案明确点名包括 Agibot 和 Unitree 在内的中国人形机器人创业公司。众议员 Elise Stefanik 同时在美国众议院提出配套法案。即便 ASRA
              不按现有形式成为法律，它的提出也显示立法趋势可能扩展到州政府、国防承包商、受监管行业和大型企业采购。任何接入美国政府相邻工作流的 Agibot 机器人——物流、基础设施、医疗——都会面临更高监管审查。

              中国法律基础设施构成第二层、且结构不同的法律风险。《国家情报法》(2017) 要求所有中国实体在被要求时协助国家情报工作。《个人信息保护法》(PIPL, 2021) 和《网络安全法》(2017)
              则设置数据本地化义务、跨境数据传输强制安全评估以及政府访问权。Agibot 的网站隐私政策于 30 April 2026
              生效，披露会从机器人运营中收集设备标识符、使用数据和技术信息。对美国、欧盟、日本和韩国的企业客户而言，在运营环境中部署 Agibot
              机器人会引出一个问题：产线数据——可能包括专有装配流程、质量控制数据和工厂布局——是否可能被中国国家机关访问。Agibot 没有公开披露如何同时满足中国法律和客户数据主权要求，对数据流进行分段、本地化或限制。

              全球范围内，人形机器人的产品责任仍未定型。Hill Dickinson 在 2026
              年发布的法律分析提出核心问题：当自主式人形机器人造成损害时，责任可能落在制造商、运营方、软件提供商，或几方共同承担。现有产品责任制度——欧盟产品责任指令、美国州级产品责任法和中国《产品质量法》——并不是为会实时决策的自主具身
              AI 系统设计的。美国 OSHA 承认，目前没有适用于机器人行业的具体 OSHA 标准。ISO 10218-1:2011
              是前代工业机器人安全标准，适用于固定式工业机器人，不适用于在开放环境中运行的双足人形机器人。Agibot 机器人部署在 3C
              电子制造、汽车和服务环境，使用场景天然要求与人近距离接触。能力和安全法律框架之间的缺口，可能在各司法辖区制定具体人形机器人监管时，引发追溯性合规义务、保险不确定性和客户采用阻力。

              中国 MIIT 在 February 2026 发布《人形机器人与具身智能标准体系》；Agibot 联合创始人兼 CTO Peng Zhihui 以 HEIS 技术委员会副主任身份参与编写。Agibot
              参与标准制定，对中国市场合规是正面信号，但也带来风险：由国内主导玩家塑造的标准，可能嵌入有利于 Agibot 国内竞争的技术要求，同时对外国竞争者形成事实上的非关税壁垒，从而引发 WTO
              挑战和关键市场的对等限制。EU AI Act (Regulation 2024/1689) 将于 August 2026 全面适用，把用于安全关键或高风险场景的 AI 系统归类为「高风险
              AI」，可能要求部署在欧盟工业环境中的 Agibot 机器人完成符合性评估、CE 标记和注册。
