  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——同行、既有厂商与替代品
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年中，人形机器人竞争版图可分为五类。直接同行是那些打造已商业可得或已商业出货的通用双足或轮式人形机器人的公司：Figure AI（Figure 03，美国）、Agility
              Robotics（Digit，美国）、Apptronik（Apollo，美国）、1X Technologies（NEO，挪威）和 Unitree
              Robotics（G1/H1，中国）。这些公司在形态、企业用例和先发定位上与 Agibot 竞争，争夺正在做首次人形机器人部署决策的客户。

              超大市值公司和战略进入者构成第二层：Tesla（Optimus）在内部部署人形机器人，并提出长期 $20,000 消费者价格目标；Hyundai/Boston
              Dynamics（Atlas）聚焦研究和展示部署，而非一般商业销售；中国大型集团 BYD（Agibot 投资人）和 CATL 则提供西方竞争对手无法复制的供应链协同。

              既有厂商和相邻替代品包括传统工业机器人（Fanuc、KUKA、ABB）、来自 Locus Robotics、Vecna 和 Geek+ 的自主移动机器人，以及 Universal Robots 和 Techman
              Robot 的协作机器人——它们都能以更低单机成本和已验证安全记录处理制造与物流任务。企业买方评估人形机器人时，近期现实替代方案是继续依赖美国仓库时薪 $15–25/hr
              的人力，或在任务要求允许时安装传统固定自动化。

              Goldman Sachs 的分析强调了市场早期动态：2025 年全球人形机器人出货量估计为 15,000–20,000 台，中国制造商贡献大部分销量；但同一研究也提示，2026
              年可能成为「销量验证与预期重置」之年，制造商出货目标可能显著跑在可实际部署的企业需求前面——这是一项适用于 Agibot 和所有中国规模型同行的结构性风险。
