      - number: '2.4'
        title: 增长驱动、采用约束与中国市场优势
        blocks:
          - type: paragraph
            body: >-
              最主要的结构性需求驱动来自全球制造业劳动力短缺，中国、美国和日本最为突出。IFR 的 World Robotics 2025 Report 显示，中国制造业约有 2 million
              台工业机器人在运行，是日本运行存量的 4.5 倍，并贡献全球年度机器人装机量的 54%。2026 年 5 月发布的中国第十五个五年规划（2026-2030）把机器人和具身 AI 明确放在国家产业战略中心，瞄准
              AI 在实体产业中的应用；国企采购与政策同向，让 Agibot 这类本土厂商获得系统性采购优势。

              中国供应链的结构优势正在复利：国内机器人装机中，中国本土供应商份额从 2020 年的 30% 提升到 2024 年的 57%。中国工信部（MIIT）于 2026 年 2
              月发布全球首个人形机器人国家标准体系，覆盖安全、类脑计算、部件规格、系统集成、应用场景和伦理。这给中国公司带来监管先发优势——它们的产品为自己参与起草的标准而设计，而西方进入者必须反向工程合规要求。

              采用约束实质且多维。资本强度仍是门槛：每台 $10,000-$100,000+ 的硬件成本，需要相对于灵活人力给出正 NPV 论证，尤其是在劳动力充足的市场。Goldman Sachs
              指出，生产一致性和多阶段测试流程是 2026-2027 年扩产目标的近期障碍。IFR
              明确提醒，人形机器人作为通用工厂助手，在中短期内不会大规模普及——在高速精密任务中，传统工业机器人仍有优势，因为「形态服从功能」规则不利于人形形态。安全和责任问题也是近距离人机环境部署的门槛；工业机器人事故已经体现这一风险，而
              MIIT 2026 年标准只能部分应对。

              对 Agibot 来说，最不利且重大的约束是美国地缘政治风险。2026 年 3 月，美国参议员 Cotton 和 Schumer 跨党提出 American Security Robotics
              Act，援引数据传输风险和国家安全担忧，拟禁止联邦政府购买或使用中国公司制造的人形机器人。如果立法生效，将在美国政府采购、乃至潜在的盟国防务和基础设施采购中，在中国来源机器人与西方来源机器人之间形成正式市场分裂——在主权场景中直接限制
              Agibot 的美国可触达市场，同时私人部门仍可进入。
