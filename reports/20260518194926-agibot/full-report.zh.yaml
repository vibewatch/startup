      - number: '8.2'
        title: 融资背景、估值框架与可比公司组
        blocks:
          - type: paragraph
            body: >-
              Agibot 自 2023 年 2 月成立以来已完成十余轮融资。按 Tracxn 和 Humanoid Index 口径，已披露风险资本约
              $83.8M，但这个数字几乎肯定低估了总资本：中国私营公司披露常常不完整，QCC 企业登记显示 50 多名股东，横跨多个未披露规模的融资轮次。按轮次确认的关键投资人包括：Gaorong Capital 和
              Bailai Ventures（天使轮，2023 年）、BYD（A+，2023 年 8 月）、Sequoia China 等（pre-B/A，2024 年）、Tencent Ventures（B 轮，2025 年
              3 月）、JD.com / JoyGen（B+，2025 年 5 月）、LG Electronics / Mirae Asset New Growth Fund（战略轮，2025 年 8 月）。LG
              Electronics / Mirae Asset 轮被称为“战略”融资，也是该基金首笔全球投资；融资规模未披露。Pandaily 报道该轮投前估值超过 CNY 7B（按 2025 年 7 月汇率约
              $960M），是目前公开可得的最佳企业价值锚点。若计入未披露轮次规模，隐含投后估值可能在 $1.0B–$1.3B 区间。

              Swancor Advanced Materials 收购是 VC 融资之外最重大的资本事件。2025 年 7 月 8 日，由 Agibot 及其创始团队牵头的财团同意支付最高 CNY 2.1B（约
              $290M），取得这家 A 股上市材料公司（深交所）的控制权。这笔收购显示公司有意向上游碳纤维和高性能复合材料做垂直整合；这个多元化方向合理，但资本开支很重，也让总有效资本投放远超已披露的 $83.8M VC
              数字。投资人应建模合并主体，而不只是 VC 资助的机器人业务。

              Agibot 当前阶段适合用场景加权的里程碑模型估值，锚点应是产量和部署证据，而不是收入倍数（收入未披露）。在基准情景下，假设到 2027 年底累计部署 20,000 台，其中 30% 纳入付费工业合同，单台每年
              CNY 300,000–500,000（由 Longcheer 经济模型推导），工业年收入可能达到 $250M–$450M；按当前隐含估值，对应前瞻 EV/Revenue
              2–5x，符合早期工业软件和自动化公司水平。乐观情景中，50%+ 产量转向高毛利工业 RaaS，并出现更多制造业客户证据，可支撑 2027 年前瞻倍数 6–10x 下的 $2B–$3B
              企业价值。悲观情景下，硬件销售仍占主导、利润率很薄、地缘政治壁垒阻止西方规模化，意味着估值可能下修至低于 CNY 5B（$700M）的降轮风险。

              可比公司组分为三类。人形机器人私募轮次中，Figure AI 是最相关的全球同行：2024 年 2 月融资 $675M，投后约 $2.6B，后续轮次隐含估值约 $3.2B；Figure 的 BMW 工厂试点和
              Helix 通用 AI 模型，是最强的西方竞争对标。Agility Robotics 2025 年 3 月完成 $400M C 轮，投后约 $1.75B，有 GXO 生产部署支撑。Apptronik 从
              Samsung 等投资人处融资 $350M，估值未披露，但估计为 $1.4B–$1.6B。按分析师估计，1X Technologies 未确认的 C 轮隐含 $3B–$5B
              区间。公开自动化同行中，Teradyne（协作机器人部门，约 $4B EV）和 Zebra Technologies（约 $15B EV）按 5–8x 前瞻收入交易，为 Agibot 达到 $300M+ ARR
              后提供退出倍数参照。Boston Dynamics 先例（Hyundai 2021 年从 SoftBank 收购，约 $1.1B）为一家受地缘政治交易审查的中国人形机器人公司设置了战略并购底价。
