      - number: '5.3'
        title: 部署、集成、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              G2 在 Longcheer Technology 位于 Jiangxi Nanchang 的平板工厂投产，是最有文档支撑的可靠性证明。借助 Genie Sim 3.0 数字孪生，Agibot
              把现场调试从传统数月压缩到 36 小时，从项目启动到完成整线集成用了 4 个月。在 24/7 双班制实产运行中，G2 在每个 MMIT 任务约 19–20 秒节拍下实现 310 件 /
              小时（UPH）的稳定吞吐，并有独立报道显示其在单个 8 小时窗口内完成 2,283 个任务且零错误。混线生产换型不需要定制工装；新产品型号再训练少于 4 小时，设备复用率达到 95%。Agibot 计划到 Q3
              2026 将 Longcheer 部署扩展至 100 台，并延伸到汽车和半导体领域。工业部署之外，Genie Studio Agent
              平台引入零代码部署工作流：运营方用拖拽式节点编辑器，把预置的感知、导航、VLA 和 RL 工具链组件组装成机器人应用，先在仿真中验证，再部署到实体硬件。软件支持受 Defined Support Period
              V4 文件约束：Agibot 保证自产品发布日期起至少 1 年安全更新；按 January 2026 发布日期，A2、G2 和 X2 Ultra 的更新支持截至 January 2027。Aimmaster 控制
              App、PAD 软件和机器人固件也在同一窗口内。这个 1 年最低期限明显短于企业 SLA 预期，对资产生命周期更长的工业客户构成尽调缺口。
