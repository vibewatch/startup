      - number: '6.2'
        title: 采用轨迹与部署规模
        blocks:
          - type: paragraph
            body: >-
              按单位数量看，AGIBOT 的采用轨迹是人形机器人行业中最陡的一批。Humanoid Index 引用的 Omdia 数据显示，AGIBOT 在 2025 年按出货量全球第一，交付约 5,100
              台；同期没有传统厂商或新进入者达到这一数字。到 March 2026，累计产量已跨过 10,000 台门槛，公司在 April 2026 的年度伙伴大会 (APC 2026)
              上重点强调这一里程碑。公司提出「部署元年」定位，意味着战略从产品开发转向商业规模化；但公开信息尚未区分终端客户出货、内部测试设备、库存或经销商存货。

              Longcheer 部署提供了最具体的采用证据。集成在 36 小时内完成，部署约 4 个月从试点爬升到 24/7 生产排程——如果这种周期可复制，将支撑企业级快速规模采用。AGIBOT 计划到 Q3 2026 将
              Longcheer 车队扩至 100 台 G2。每小时 310 台产品吞吐和 99.9% 动作成功率，是截至 mid-2026 全球任何人形机器人生产部署中披露的最高生产率指标。APC 2026 上，来自 17
              个国家的全球客户参加了伙伴大会，说明国际参与度在上升——但参会不等于商业合同转化。

              AGIBOT 在 2025 年的 5,100 台约占 IDC 预计 2030 年 510,000 台人形机器人规模的 1%（~95%
              CAGR）。这说明总可用市场（TAM）仍有显著空间，同时也伴随很高的执行风险。Goldman Sachs 估计，全球人形机器人市场将在 10–15 年内达到 $6 billion，乐观情景到 2035 年可达
              $154 billion。
