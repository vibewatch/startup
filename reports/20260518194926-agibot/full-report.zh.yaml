    title: 推荐逻辑 — 从证据到投资结论
    type: flow
    layout: standard
    summary: >-
      这条因果链从 Agibot 四个关键证据支柱（产量领先、工业部署验证、战略投资者联盟、相对估值折价）出发，穿过三条风险线（财务不透明、地缘政治风险、Swancor 资本承诺），落到 6.8/10
      的观察建议：中等信心、高风险；同时给出上调至有条件买入的触发路径。
