      - number: '5.5'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              Agibot 已搭起基础合规设施，但在工业规模部署所需的产品安全和网络安全深度上仍有缺口。认证方面，A2 Ultra 持有 CR（中国）、CE-MD（欧盟机械指令）、CE-RED（欧盟无线电设备指令）和
              FCC（美国）认证，可在三大主要市场商业销售。G1 和 G2 配备急停按钮、碰撞保护、底盘避障，以及故障检测后的即时报警和停止；G2 还在双臂嵌入六轴力感知，用于受控施力。中国 MIIT HEIS
              框架（February 2026 发布）由 Agibot 通过 Peng Zhihui 的委员会参与共同制定，要求限力、急停机制、热管理，以及软件故障下的最低风险状态行为。关键问题是，Peng Zhihui
              承认，人类优于传统自动化的操作任务中，近 80% 与触觉感知强相关；这一能力在全行业都尚未充分标准化，技术也不成熟，Agibot 自身产品同样如此。数据隐私方面，Agibot 网站隐私政策（April 30,
              2026 生效）指定 AGIBOT PTE. LTD.（新加坡）为多数国际市场的数据控制者，日本 / 韩国（Agibot K.K.）和 Hong Kong SAR
              则由不同实体负责。该政策遵循合法、正当、必要和诚信原则，但没有发布漏洞披露计划，也没有 SOC 2 / ISO 27001 认证。1 年安全更新底线是企业买家的尽调缺口。
