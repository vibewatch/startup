      - number: '3.2'
        title: 直接竞争对手画像与能力对比
        blocks:
          - type: paragraph
            body: >-
              Figure AI 是资本最充足的西方纯人形机器人公司，累计融资 $1.9B，包括 2025 年 9 月按 $39B 估值完成的 $1B+ Series C——这是全球该赛道最高估值。Figure 在 2025
              年初终止与 OpenAI 的合作，完全转向自研内部 AI 模型；其 Figure 03 机器人现在瞄准通用家庭辅助。Figure 与 BMW 的 Figure 02
              工厂试点仍在继续，但规模和经济条款未披露。Figure 的资本规模远超 Agibot 已披露的 $83M+。

              Agility Robotics 是西方商业部署记录最经过验证的公司。Digit 已部署在 Amazon 履约中心、GXO Logistics 和 Schaeffler
              制造场景，使其成为全球最经企业验证的双足人形机器人。Agility 融资 $641M+，包括 2025 年 6 月的 $400M Series C。其 Arc 机队管理平台与现有 WMS 和 AMR
              基础设施集成，加深客户锁定效应。

              Apptronik（Austin, TX）瞄准仓库和制造，并引用其源自 NASA Valkyrie 项目的背景。Apptronik 于 2026 年 2 月完成 $520M Series A，使已披露融资总额达到
              $1.45B+，估值 $5.5B+。其机器人即服务模式与 Agility 的企业合同打法相似，Mercedes-Benz 是具名部署伙伴。

              1X Technologies（挪威）由 OpenAI 支持，于 2024 年 1 月完成 $100M Series B，总融资约 $125M+。其轮式 EVE 机器人已部署于企业安防客户，而其 NEO
              双足机器人瞄准 $20K 消费者价位，已开放预订，但截至 2026 年初尚无大规模商业部署。

              Unitree Robotics（中国）是 Agibot 最直接的国内竞争对手，也是全行业最尖锐的硬件商品化威胁。Unitree 声称 2025 年人形机器人出货 5,500 台，并在中国提交 $580M IPO
              申请，直接挑战 Agibot 的销量领先叙事。其 G1 双足机器人标价 $16,000，是全球公开可得价格最低的双足人形机器人；H1 标价 $90,000，面向研究和开发者细分。G1 拥有 23
              个自由度和基础双足行走能力，但相较 Agibot 的全栈具身智能架构，其原生自主 AI 栈有限。

              Agibot 通过三个角度差异化，而多数西方竞争对手无法同时匹配：一是统一全系列产品组合，横跨娱乐（X2 紧凑人形，$24.2K）、商业人形（A2 Lite，$44.6K）和工业机器人（G2
              工厂平台）；二是「一体三智」架构，把运动智能、交互智能和操作智能整合起来；三是国际认证（FCC, CE-MD, CE-RED, CR），多数中国竞争对手的人形产品线尚未取得这些认证。G2 工业平台已在
              Longcheer Technology 的消费电子精密制造线上实现 8 小时零错误运行——这类企业运营证据，正是西方买方从试点走向部署承诺所需要的证明。
