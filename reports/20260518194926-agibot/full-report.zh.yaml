  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与收入架构
        blocks:
          - type: paragraph
            body: >-
              商业发布阶段，AGIBOT 面向 4 类核心客户：工业制造（以电子装配和汽车供应链为主）、物流与仓储（抓取放置、分拣）、酒店与零售服务（酒店运营、豪华水疗、清洁），以及企业 IT
              或数据中心运营。工业制造是最成熟的分层，由 Longcheer Technology 生产部署锚定。制造业买方通常是工厂运营或制造工程团队；物流买方是设施或运营负责人；酒店业买方则是度假村 /
              酒店总经理或采购部门。

              AGIBOT 同时运行两种收入模型。第一种是机器人直接购买或车队租赁，企业一次性采购 G2 或 A2
              设备，或签订多年期租赁安排。第二种也是战略上更重要的一种，是机器人即服务（Robot-as-a-Service，RaaS）：March 2026 公司在 Mobile World Congress 通过
              store.agibot.com 推出该服务，价格从每台机器人每天 €899 起，未披露最低合同期限。截至 March 2026，RaaS 模型覆盖 17
              个国家和地区，旨在降低国际客户采购门槛，让不能承诺大额前置硬件支出的客户也能试用。商店还列出 C5 清洁机型等可直接购买机器人，价格 $32,900，说明其商业化路径同时覆盖自助式数字渠道和企业直销渠道。

              发布初期的地域集中度明显偏向中国生产部署；东南亚（Genting Malaysia）、欧洲（SIR Spa Group，Italy）和新加坡（Singtel RaaS 试点）代表早期国际市场测试。March
              2026 提出的 American Security Robotics Act 拟禁止联邦机构使用中国制造机器人，美国政府采购因此成为结构性受阻渠道。
