  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - US Security Robotics Act（或同等法案）签署成法
        - 美国任何禁止采购中国机器人的法规最终通过并由总统签署
        - 北美企业市场被切断；意味着欧盟及盟友采购限制可能跟进；退出路径被压缩到仅中国或非结盟市场
        - 有全球投资权限的投资者立即触发卖出；中国境内投资者维持观察；重新评估西方战略买方可选性
      - - 到 2026 年 Q4 未宣布第二个工业制造客户
        - 到 2026 年 12 月，部署 >20 台的新工业产线客户为零
        - Longcheer 仍只是单一数据点；工业 RaaS 逻辑无法验证；基准情景收入轨迹受损
        - 若第二个客户未出现，则下调至放弃；监控 Longcheer 扩展到 100 台，作为部分替代信号
      - - Swancor 收购整合失败或需要追加资本
        - CSRC 调查、Swancor 盈利低于预期 >30%，或 Agibot 被要求在初始承诺之外再注入超过 CNY 500M 资本
        - 资产负债表承压；管理层带宽被非核心整合吃掉；R&D 和部署扩张能力下降
        - 要求披露整合里程碑；在估值模型中将 CNY 2.1B 承诺视为或有负债
      - - 工业部署规模化后质量失败
        - 公开报道的安全事故、执行器故障率 >5%，或客户退出 G2 计划
        - 制造业客户信任被击穿；触发监管检查；竞争对手借事故在客户沟通中替代 Agibot
        - 立即触发放弃；只有披露根因并完成独立安全审计后才恢复观察
      - - 估值低于 CNY 5B（$700M）的降估值融资
        - 确认融资投后估值低于 CNY 5B，或结构化债务融资暗示股权价格底部
        - 表明投资者群体对工业化转型失去信心；优先股堆叠给早期轮次带来稀释悬崖
        - 启动退出评估；监控是否出现中国国资战略买方以困境价格接盘
    notes: 投资逻辑破裂触发因素按可观察事件定义，而非分析师观点。所有触发因素都可通过公开媒体报道、CSRC 文件或 Agibot 官方公告监控。 阈值设定用于捕捉足以实质改变基准投资逻辑的最低信号强度，而非增量负面新闻。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 工业年经常性收入（ARR）和单机经济性
        - Agibot 未公开披露收入、ARR 或单机合同经济性；Longcheer 合同金额、期限和续约条款未知
        - 没有任何收入锚点，整套工业 RaaS 逻辑无法验证；也无法给出收入倍数或验证 $960M+ 融资前估值
        - 直接接触 CFO 或投资者资料室；对照 Longcheer 母公司（Longcheer Technology 603341.SH）业绩会披露
      - - Swancor Advanced Materials 整合计划和资本配置
        - CNY 2.1B 收购的战略理由、整合时间表和预期协同指标未公开披露
        - 该收购的资本承诺比已披露 VC 融资大 2–3 倍；尚不清楚它会增强还是分散人形机器人核心逻辑
        - 查询 Swancor 的 CSRC 和深圳交易所公开文件（收购主体文件）；就整合里程碑直接接触创始人
      - - US Security Robotics Act 立法状态和企业买家反应
        - 法案已于 2026 年 3 月 26 日提出，但尚未通过；企业买家采购冻结的范围和持续时间不确定
        - 美国市场和美国阵营市场被排除，是悲观情景中最大的单一驱动因素；立法状态决定西方 TAM 可达性
        - 国会跟踪服务；对物流、医疗和制造业企业买家做背调访谈
      - - 股权结构表、优先股堆叠和反稀释条款
        - QCC 显示 50+ 名股东，但没有优先股堆叠、清算分配瀑布或反稀释条款细节
        - 任何退出情景下普通股股东回报高度取决于优先倍数和参与权；结构未披露，无法建模回报
        - 公司律师审阅 AGIBOT Innovation (Shanghai) Technology Co., Ltd. 注册资本文件；通过 Series B 领投方直接接触法律顾问
      - - 第二个达到商业规模的工业制造客户
        - 目前只有 Longcheer Technology 确认为 G2 工业部署客户；面向汽车和半导体行业的计划扩张尚未宣布具名交易对手
        - 单一客户的工业验证是估值的必要但不充分条件；第二个具名、20+ 台客户是确认可复制性的最低要求
        - Agibot 官方公告；AIMA 开发生态合作伙伴披露；直接接触 VP Sales
    notes: >-
      尽调问题按紧迫性和重要性排序。第 1 和第 3 项——工业年经常性收入（ARR）和 US Act 状态——是 90 天内必须解决的问题，任何新增资本承诺前都应完成。 第 2、4、5 项是 6–18
      个月问题，决定从观察上调至有条件买入的触发条件。
    claimRefs:
      - CV040
      - CV041
      - CV042
