  - id: FV002
    title: 估值敏感性 — 企业价值 vs 工业 ARR 情景
    type: bar
    layout: standard
    summary: >-
      条形图展示八个参考情景下 Agibot 隐含企业价值：从悲观的下轮降估底价 $700M，到当前入场隐含估值；再到 Boston Dynamics 和 Agility Robotics M&A 先例给出的可比底线、2028
      基准情景 $2.0B，以及 2028 乐观情景 $4.0B。图中凸显估值分散度很大，最终结果首先由工业 ARR 轨迹决定。
    data:
      items:
        - label: 悲观下轮降估（法案通过 + 质量失败）
          value: 700
        - label: 当前入场（投后 ~$1.1B）
          value: 1100
        - label: Boston Dynamics M&A 底线（调整后）
          value: 1400
        - label: Agility Robotics 可比估值（~$1.75B）
          value: 1750
        - label: 2028 基准情景（$150M ARR，10x）
          value: 2000
        - label: Apptronik 可比估值（~$1.5B）
          value: 1500
        - label: Figure AI 可比估值（~$3.2B）
          value: 3200
        - label: 2028 乐观情景（$400M ARR，10x）
          value: 4000
    claimRefs:
      - CV013
      - CV021
      - CV022
      - CV023
  - id: FV003
    title: 估值与回报区间 — 乐观 / 基准 / 悲观情景
    type: range
    layout: wide
    summary: >-
      区间图展示 Agibot 以约 $1.1B 投后估值入场时，悲观、基准、乐观三种退出估值结果。每条柱覆盖该情景的区间，并给出中位估计。回报轮廓不对称：基准情景只给出 1.2–2x 的温和回报，乐观情景可达 2.5–5x
      但高度依赖执行，悲观情景则意味着 0.5–0.7x 的亏损。
    data:
      items:
        - label: 悲观情景（美国法案 + 质量失败）
          low: 500
          value: 700
          high: 900
        - label: 基准情景（2028，3–5 家工业客户）
          low: 1500
          value: 2000
          high: 2500
        - label: 乐观情景（2028，10+ 家工业客户）
          low: 3000
          value: 4000
          high: 5000
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
  - id: FV004
    title: 投资 KPI — 投委会可用评分
    type: kpi
    layout: compact
    summary: Agibot 八个投资维度的投委会可用评分仪表盘，量表为 1–10 分。综合总分 6.8/10：产量规模异常突出、市场机会强，但被财务完全不透明、地缘政治天花板和单一客户工业验证抵消。分数是分析师综合八个报告章节证据后的判断。
    data:
      items:
        - label: 市场机会（TAM + 中国战略）
          value: 9
        - label: 商业验证（G2 Longcheer 部署）
          value: 6
        - label: 技术护城河（生产 + AIMA + Genie Sim）
          value: 7
        - label: 团队与执行（3 年 10K 台）
          value: 8
        - label: 财务透明度（零披露）
          value: 2
        - label: '竞争位置（出货量 #1，价格压力）'
          value: 7
        - label: 估值支撑（相对同业折价，无收入）
          value: 6
        - label: 综合总分
          value: 6.8
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV008
      - CV013
      - CV032
