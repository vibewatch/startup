      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与回报分析
        blocks:
          - type: paragraph
            body: >-
              三个情景决定 Agibot 在 2026–2030 投资期的估值路径。情景概率为近似值，基于截至 2026 年 5 月公开证据权重：乐观约 25%，基准 50%，悲观 25%。

              乐观情景（概率：约 25%）假设 Agibot 在 2027–2028 年成功把生产规模转化为规模化工业 ARR。关键假设：(a) G2 工业项目从 Longcheer 证明点扩展到 10+
              家具名制造客户，每家部署 50–200 台；(b) Swancor 收购带来垂直整合的执行器和复合材料成本优势，使单台 COGS 下降 20–30%；(c) 中国国家电网 / State Grid
              Corporation 采购项目（QCC 备案数据提到的 CNY 68B 具身智能设备招标）授予 Agibot 重要合同；(d) 美国立法限制西方销售，但非限制性市场（ASEAN、India、Middle
              East、EU）贡献 20%+ 收入。在这些假设下，到 2028 年累计工业 ARR 达到 $400M–$600M，以 6–10x 前瞻收入支撑 $3B–$5B 企业价值。按隐含约 $1.0B–$1.3B
              投后入场价，2025/2026 年进入的投资人在乐观情景下 5 年回报约为 2.5–5x。

              基准情景（概率：约 50%）假设 Agibot 稳步扩大工业部署，但到 2027 年仍主要是硬件销售公司。关键假设：(a) 到 2027 年底，G2 扩展到 3–5 家工业客户，工业部署总量达到 500–800
              台；(b) A2 和 A3 商业 / 娱乐硬件销售维持当前定价，产生 $80M–$120M 年硬件收入；(c) Swancor 整合在 2027 年完成，且无重大运营扰动；(d)
              美国或欧盟立法没有阻断亚洲和非结盟市场准入。在这些假设下，2028 年隐含企业价值为 $1.5B–$2.5B。以约 $1.0B–$1.3B 入场价计算，基准情景 5 年回报约为
              1.2–2.0x——对能承受中国敞口的机器人基础设施投资人来说不算高，但为正。

              悲观情景（概率：约 25%）包括：(a) US Security Robotics Act 通过，并对全球企业买家造成寒蝉效应，把 Agibot 限定在中国市场收入；(b)
              工业部署在规模化后暴露质量问题（执行器失效、非结构化环境中的自主能力缺口）；(c) Swancor 收购造成资产负债表压力和管理层分心；(d) Unitree 以更低价格实现可比工业部署证明，压缩 Agibot
              定价权。在悲观情景下，到 2027 年 Agibot 被迫进行低于 CNY 5B（$700M）的降轮，或以受压估值寻找中国国有战略买家。按当前入场价，悲观情景回报为
              0.5–0.7x，优先股堆叠可保护后轮机构投资人，普通股则会遭受重创。

              以约 $1.1B 投后估值入场，概率加权预期价值到 2028 年约为 $1.5B–$2.0B，对应未来轮次稀释前 1.4–1.8x
              预期回报。相对于该行业资本密集度和二元风险画像，这个结果边际上有吸引力，但若没有显著的乐观情景支撑，达不到 3x 回报目标。
            claimRefs:
