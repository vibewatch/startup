      - number: '7.5'
        title: 财务与资本风险
        blocks:
          - type: paragraph
            body: >
              Agibot 最近披露的估值超过 70 亿元人民币（按当前汇率约 $970M）。Goldman Sachs Research 估计，全球人形机器人市场在基准情景下 10–15 年内可能达到 $6B，蓝天情景到
              2035 年可达 $154B。IDC 预测，到 2030 年全球人形机器人出货量将超过 510,000 台。这些预测支撑了一个终局很大的市场，但也凸显当前状态——Agibot 已生产约 10,000
              台、平均售价未经确认——与支撑近十亿美元估值所需收入规模之间的距离。

              Agibot 尚未披露收入、毛利率、经营亏损或烧钱速度。Humanoid Index 统计的多轮已披露融资总额约为 $83M，但 Tencent、BYD、JD.com 和 LG Electronics
              的战略融资可能未按完整金额披露。人形机器人制造资本开支很重——模具、零部件采购、质量保证、现场服务、质保准备金——这意味着即便已生产 10,000 台，公司几乎肯定仍处在深度负自由现金流。Goldman
              Sachs 分析指出，2026 年是“销量验证与预期重置”的关键一年，投资人关注雄心勃勃的出货目标和供应链公司估值能否持续。

              据报道，Agibot 正准备在中国 STAR Market A
              股上市，监管机构为中国证监会（CSRC）。上市会带来信息披露义务、锁定期动态、市场情绪敏感性和公开市场估值纪律，这些都是私募投资人此前无需面对的约束。若 IPO 认购热度高于可交付的收入证据，上市后 Agibot
              可能必须完成激进的商业部署里程碑，才能避免估值压缩。这会诱发过度承诺部署时间表和客户收入确认的激励，构成财务和声誉风险。反过来，若 IPO 市场恶化（因为中国科技市场整体环境或中美紧张升级），Agibot
              可能需要推迟公开流动性事件，并在制造最耗资本的阶段继续依赖私募资本。
