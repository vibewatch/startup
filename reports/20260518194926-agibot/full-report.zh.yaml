      - number: '8.5'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，Agibot 的退出准备度有限。公司尚未公开披露 IPO 时间表、STAR Market
              注册申报或海外上市意向。对早轮投资人而言，最可能的近期流动性路径，是由工业部署证据和第二或第三个具名制造客户驱动、以更高投后估值完成 C 轮或 C+ 轮。Swancor Advanced Materials
              收购给公司结构加入了上市实体组件，理论上可作为深交所反向并购 IPO 路径，但这种结构并不常见，可行性也未确认。

              对 2025/2026 年入场投资人而言，最可能的完全退出路径包括：(1) 中国 A 股 IPO（STAR Market 或科创板、ChiNext），大概率不早于 2028 年，取决于 CSRC 盈利 /
              收入披露要求；(2) 作为国家具身智能基础设施建设的一部分，被中国国有或准国有工业公司（CATL、BYD、SAIC、State Grid）战略收购；或 (3) 在非美国司法辖区（Japan、South
              Korea、Germany、Singapore）被西方战略买家收购，这需要规避等同 CFIUS 的审批，并会受益于 LG Electronics / Mirae Asset 作为桥梁投资人的关系。

              狭义 IPO 准备度取决于 CSRC 面向尚未盈利高科技制造公司的 IPO 政策演变。中国《国家具身智能发展规划》已明确打开这一路径，但披露要求会迫使公司公布目前对投资人屏蔽的收入和利润率指标。

              从 TRACK 上调至 INVEST 前必须解决的五项最终尽调问题列在 TV006 中。最紧迫的问题（潜在投资人 90 天内需要拿到）是：(1) Longcheer 部署的工业 ARR 或等价单位经济模型；(2)
              Swancor 收购资本结构和整合时间表的清晰度；(3) US Security Robotics Act 立法状态确认。剩余两项——第二个工业客户签署合同，以及披露的 C 轮条款清单或投后估值——是 6–18
              个月尽调问题，决定从 TRACK 上调至条件性 BUY 的触发点。
            claimRefs:
