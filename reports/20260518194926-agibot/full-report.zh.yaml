  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代品与相邻支出
        blocks:
          - type: paragraph
            body: >-
              人形与具身 AI 机器人市场，指商业化生产、具有人形或半人形形态的机器人，包括双足设计（Agibot A2、A3、G2
              系列）和紧凑型轮式躯干平台；它们用灵巧操作、移动行走和多模态交互，在为人类建造的环境中运行。不纳入本市场的包括：执行单点重复任务的固定臂工业机器人（Fanuc、KUKA、ABB）；没有操作能力的自主移动机器人（AMR）；以及没有物理具身形态的纯软件
              AI 系统。人形形态的竞争优势在于，它能在为人类工人建造的空间中运行——使用现有门、货架、工具和布局——而不需要重建物理环境。

              主要目标细分中的现状替代品包括：（1）人类劳动力——制造、物流和服务环境中最主要的替代选择；（2）传统固定臂工业机器人，用于结构化高速任务，这类任务中人形形态没有优势；（3）协作机器人（如 Universal
              Robots UR
              系列），在固定位置运行且没有移动能力；（4）专用任务机器人（洗地机、配送机器人、条码扫描器），解决狭窄、结构化工作流。关键切换触发点，是从结构化单任务自动化转向灵活、多产品、多工位工作流，而后者超出了固定自动化的能力边界。

              本分析纳入的支出包括机器人硬件购买或租赁、嵌入式 AI
              软件许可、部署集成服务、训练数据和售后维护。不纳入的支出包括设施基础设施重建（传送带、货架重新设计）、劳动力再培训项目，以及相邻的非人形自动化品类。能力成熟后，人形机器人可能扩展进入的相邻市场包括工业外骨骼、协作机器人手臂、AI
              驱动配送机器人和无人机物流平台。
