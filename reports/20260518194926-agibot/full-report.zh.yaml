      - number: '1.5'
        title: 里程碑时间线与战略轨迹
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 从创立走向全球大规模部署，只用了三年多。公司于 2023 年 2 月在上海成立，数月内完成天使轮和早期 VC 融资，并在 2025 年 1 月交付第 1,000
              台具身机器人——公司称这是通用具身机器人量产的行业首例里程碑。2026 年 1 月，AGIBOT 在拉斯维加斯 CES 完成美国市场首秀，宣布累计交付机器人 5,000 台。到 2026 年 3 月，累计产量达到
              10,000 台，最后 5,000 台大约用三个月生产完成——相较上一阶段，生产速度大约提速 4×。

              地缘政治上，AGIBOT 的国际推进积极且高调：2026 年 3 月，AGIBOT A2 机器人在巴塞罗那 MWC 2026 为西班牙国王 Felipe VI 提供引导；2025 年早些时候，Xi Jinping
              在上海考察期间参观了公司的机器人。与此同时，公司面临实质监管逆风：美国参议员 Tom Cotton 和 Chuck Schumer 于 2026 年 3 月 26 日提出并获得两党支持的 American
              Security Robotics Act，将禁止美国联邦机构购买或运营中国制造的人形机器人。如果法案通过，将直接限制 AGIBOT 可触达的美国政府市场。

              2026 年 4–5 月，战略扩张继续推进，包括 Genting Malaysia MOU（2026 年 4 月 17 日）、APC 2026 Shanghai Partner Conference，以及
              First Hong Kong Embodied AI Industry Summit（2026 年 5 月 12 日）。公司宣布 2026 年为「部署元年」，显示重心正从生产规模转向商业 ROI。
