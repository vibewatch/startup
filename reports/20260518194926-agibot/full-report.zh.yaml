        - 最直接的商业同业；物流场景对比 Agibot 的制造业重心
        - 单一具名客户（GXO）；商业范围仅美国；物流细分赛道对比 Agibot 跨垂直模型
      - - Apptronik（美国）
        - Series A+（2024，Samsung 领投）
        - 约 $1.4B–$1.6B（估计）
        - 累计融资 $350M；Apollo 人形机器人；NASA 和汽车试点
        - Samsung 战略投资者与 LG 有重叠（Mirae-LG 基金结构相似）；制造业投资逻辑
        - 估值未官方披露；仍处早期试点阶段，没有量产规模验证
      - - 1X Technologies（挪威）
        - Series B+（2025）
        - $3B–$5B（隐含，未确认的 Series C）
        - 约 390 台 EVE 商用部署；NEO 消费级人形机器人开发中
        - OpenAI 支持；企业安防部署验证；EQT Ventures 领投
        - Series C 未确认；NEO 偏消费级的逻辑与 Agibot 的工业 / 制造重心不同
      - - Boston Dynamics（2021 年被 Hyundai 收购）
        - M&A 先例
        - $1.1B 收购
        - Spot 机器人已部署在工业现场；Atlas 仍是开发阶段双足机器人
        - 收入前先进机器人公司的战略并购底价参照
        - 2021 年交易；行业已大幅演进；Hyundai 收购结构无法类比受 CFIUS 约束的中国 M&A
      - - Teradyne / Universal Robots（上市同业）
        - 上市可比公司
        - EV 约 $4B（Teradyne）；UR 部门贡献收入约 $1.5B
        - UR 峰值年销量 30,000+ 台协作机器人；远期收入倍数 5–8x
        - 退出倍数参照：如果 Agibot 达到 $300M+ ARR，按 5–10x 可实现 $1.5B–$3B EV
        - 协作机器人，不是人形机器人；ASP 低得多；市场动态不同
    notes: >-
      可比集合反映截至 2026 年 5 月公开已知的私募轮估值和上市公司企业价值。Figure AI、Apptronik 和 1X 的估值部分或全部为估计；
      任何人形机器人私营可比公司都没有已确认的股权结构表或优先股堆叠数据。所有比较分析在融资轮披露确认后都需修订。
    enumerationScope:
