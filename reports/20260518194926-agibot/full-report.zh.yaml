      - number: '5.2'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Agibot 的「One Robotic Body, Three Intelligences」框架把智能拆为运动、操作和交互三层，每一层由一个或多个基于自研数据训练的基础模型支撑。运动智能由 Behavioral
              Foundation Model (BFM) 驱动，它从短视频演示中学习类人运动模式；Generative Control Foundation Model (GCFM)
              则根据文本或音频提示实时即兴生成动作。操作智能依赖 GO-2 (VILLA)，用 Action Chain-of-Thought 推理把高层任务指令翻译成精细运动命令，并由 Genie Sim 3.0
              仿真平台补足，支撑快速 sim-to-real 迁移。交互智能由 WITA Omni 处理，这是一个机器人原生多模态模型，把视觉、语音和手势统一起来，而不是拼接独立语言和视觉模块。这些模型训练在 AgiBot
              World 数据集上；截至 March 2025，该数据集包含 1,003,672 条操作轨迹（~43.8 TB），由 100 台机器人在 5 个目标领域采集，仓库还获得 IROS 2025 Best Paper
              Award Finalist 提名。底层机器人中间件是 AimRT，一个开源框架，提供实时通信（1 kHz）、ROS 2 / Jazzy 互操作、zenoh 和 gRPC 后端，并保持活跃月度发布节奏（April
              2026 为 v1.7.0）。SOP (Scalable Online Post-training) 框架闭合了部署循环，支持分布式车队级 VLA
              模型更新：多台机器人并行执行任务，经验在云端汇总，更新后的策略在数小时内推回车队；SOP 训练后，机器人可在无人干预下自主运行超过 36 小时。Genie Studio 是集成开发者平台：它编排数据采集（最高
              1,000 frames/device/day）、跨 GO-1 / RDT / Pi0 / OpenVLA 的模型训练与微调、仿真评估（8,000+ 个 3D 资产，sim-to-real 误差低于
              5%），并支持云到设备一键部署，相比单 GPU 基线带来 2–3× 推理吞吐提升。
