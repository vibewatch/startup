      - number: '4.3'
        title: 产量里程碑、部署指标与商业牵引
        blocks:
          - type: paragraph
            body: >-
              AGIBOT 最具体的财务牵引信号是产量。公司在 March 2026 生产出第 10,000 台人形机器人；Omdia（HumanoidIndex 引用）将 AGIBOT 列为 2025
              年全球人形机器人出货量第一，约 5,100–5,200 台。这个排名存在争议：Unitree Robotics 声称其 2025 年人形机器人出货 5,500 台，并已申请 $580 million A 股
              IPO——这一竞争性说法尚未得到独立验证，两家公司出货口径的方法差异也没有解决。尽调中应把 AGIBOT 的产量视为收入潜力的代理指标，而不是已确认收入，因为公司没有公开披露已商用部署设备、演示 /
              展示设备和预商用库存之间的构成。

              最清晰的部署证明来自 G2 工业项目。多台 G2 机器人已确认在 Jiangxi Nanchang 的 Longcheer Technology 平板产线上运行，工位为 MMIT。实测表现：8 小时连续运行完成
              2,283 个任务，零错误；每小时吞吐 310 件产品；单次节拍 18–20 秒。这种在产线条件下跑通 24/7 双班制的能力，是 AGIBOT 迄今发布的最有说服力的商业证明，但 Longcheer
              当前部署台数和商业条款均未披露。公司计划到 Q3 2026 扩展至 100 台，并延伸到汽车和半导体制造。

              在娱乐和商业表演侧，A2 Ultra 产品页确认已部署于「20 多家头部企业」。A3 人形机器人支持 100 台机器人 UWB 同步群体表演，已公开演示，并将在 mid-2026 进入商用。根据
              Humanoids Daily，全球租赁 / RaaS 平台截至 March 2026 覆盖 17 个国家，指向一个正在运转的商业运营模型。IDC 数据显示，2025 年全球超过 85%
              的人形机器人部署集中在娱乐、教育和导览场景，这与 AGIBOT 的早期商业基础一致。公司在 April 2026 的 APC 2026
              上宣布转向工业制造部署，并称其为「部署元年」；这正是投资逻辑的关键转换，但尚未产出已披露的财务结果。
