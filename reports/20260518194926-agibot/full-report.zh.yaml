      - number: '3.3'
        title: 定价、部署证据与 GTM 分销
        blocks:
          - type: paragraph
            body: >-
              Agibot 是少数公布国际标价的人形机器人公司之一。其 A2 Lite 在国际线上商店标价 $44,560，X2 娱乐机器人标价
              $24,240——相比普遍不披露企业定价的西方竞争对手，价格比较更可操作。Figure AI、Agility Robotics 和 Apptronik 均不披露单价或合同经济性；行业对企业双足部署的估计为每台
              $100K–$150K+，或相当的年度 RaaS 合同价值。Apptronik 的 RaaS 模式已公开说明，但具体经济性未披露。

              Unitree G1 的 $16,000 仍是该赛道最具冲击力的价格信号。双足机器人低于 $20K，压低了所有西方竞争对手，也逼近 Agibot 的 X2 消费级价位。如果 Unitree 通过自有 AI
              或第三方模型集成实现足够的自主运行，它可能拿下价格敏感的研究和中小企业细分，并迫使中国人形机器人层级爆发硬件价格战。

              部署证据方面，Agility Robotics 的企业验证最深：Amazon Digit 项目是唯一由战略投资人作为锚定客户的高销量工业人形机器人部署。Agibot 的 10,000
              台累计机队在数量上亮眼，但娱乐、商业展厅和工厂地面应用混合在一起，使西方企业买方更难对照到具体劳动力替代 ROI。Agibot 的 G2
              零错误制造声明（Longcheer）是一个早期但重要的、西方企业可对标的证明点；若要在规模上建立企业信任，还需要独立验证。

              GTM 和分销上，Agibot 运营全球租赁平台和直接国际线上商店，而西方竞争对手主要通过专门销售团队签企业合同。Agibot
              的分销打法——高销量、较低价格、平台生态——反映其中国市场出身；西方竞争对手则聚焦以证据驱动的企业销售，并提供高接触支持和客户管理。
