callouts:
  - calloutType: strength
    title: Fastest Production Ramp in Humanoid Robotics
    body: >-
      AGIBOT produced its 10,000th robot in March 2026 — reaching the 5,000-to-10,000 tranche in approximately
      three months, which Robotics and Automation News characterised as a 4× acceleration in production speed.
      Omdia ranks AGIBOT #1 in global humanoid shipments for 2025 with more than 5,100 units. No US or European
      competitor has disclosed a comparable production volume.
    claimRefs:
      - CO034
      - CO035

  - calloutType: risk
    title: US Security Robotics Act — Federal Market Locked Out
    body: >-
      The bipartisan American Security Robotics Act introduced by Senators Cotton and Schumer in March 2026 would
      prohibit US federal agencies from purchasing or operating Chinese-made humanoid robots. While the bill had
      not passed as of this report date, its bipartisan sponsorship raises the probability of eventual enactment
      and signals a broader US policy trajectory that could extend to state-level and allied-country procurement.
      AGIBOT has announced an explicit US market push beginning at CES 2026 — a conflict that represents a
      material market-access risk.
    claimRefs:
      - CO047
      - CO042

  - calloutType: insight
    title: Strategic Investor Base Provides Both Capital and Channels
    body: >-
      AGIBOT's investor roster is unusually rich in corporate strategics: BYD, SAIC, BAIC, JD.com, Tencent, TCL,
      and CATL together represent automotive, logistics, consumer electronics, and internet verticals. Unlike
      pure-financial VC backers, these investors create captive deployment channels and supply chain relationships.
      The LG Electronics and Mirae Asset investment signals ambition to replicate this channel model internationally.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020

