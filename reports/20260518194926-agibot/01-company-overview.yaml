  - id: section-capital
    title: Funding History, Investors, and Capital Position
    body: >-
      AGIBOT has completed more than ten financing rounds since its founding in February 2023. Disclosed capital
      stands at approximately $83.8 million per Tracxn, though this figure is likely understated: Chinese corporate
      registry data (Qichacha) lists more than 15 distinct shareholder vehicles — including several anonymous
      limited partnerships consistent with additional undisclosed rounds — and valuation sources conflict materially.
      Pandaily reported the valuation as "exceeding 7 billion yuan" (approximately $960 million at the time of report),
      while Tracxn's more recent database entry places the valuation at $6.4 billion USD — a discrepancy that likely
      reflects different measurement dates rather than genuine disagreement.

      The investor base spans Chinese industrial and technology corporates, domestic VCs, and international investors.
      Confirmed corporate investors include BYD (A+ round, August 2023 per Qichacha), Tencent Holdings (B-round,
      March 2025 per Qichacha), BAIC Group, SAIC Motor, JD.com, and TCL Technology, per Yicai Global coverage.
      CATL is referenced by HumanoidIndex as a notable backer. Gaocheng Ventures (affiliated with GGV/Gaocheng) is
      identified as an early-stage investor. The most recent disclosed round is a strategic investment from the
      Mirae Asset-LG Electronics New Growth Fund, completed in August 2025; this marked LG Electronics' first
      investment in the embodied intelligence sector. The amount and implied valuation of the LG-Mirae round were
      not disclosed.

      Revenue and profitability data remain fully undisclosed. No debt, credit facilities, or secondary transactions
      have been reported in reviewed sources. The company's capital position implies it is burning against institutional
      equity, consistent with a pre-revenue or early-revenue hardware-AI company operating at scale. Headcount has not
      been officially disclosed; HumanoidIndex reports 500+ employees.
