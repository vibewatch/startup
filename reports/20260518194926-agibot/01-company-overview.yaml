  - id: section-milestones
    title: Milestone Chronology and Strategic Trajectory
    body: >-
      AGIBOT's trajectory from founding to large-scale global deployment spans just over three years. The company
      was established in Shanghai in February 2023, raised its angel and early VC rounds within months, and shipped
      its 1,000th embodied robot in January 2025 — a milestone the company characterised as an industry first for
      mass production of general-purpose embodied robots. In January 2026, at its US market debut at CES in Las Vegas,
      AGIBOT announced 5,000 robots had shipped to date. By March 2026, cumulative production reached 10,000 units,
      with the final 5,000-unit tranche produced in approximately three months — a roughly 4× acceleration in
      production speed compared to the prior phase.

      Geopolitically, AGIBOT's international push has been active and high-profile: AGIBOT A2 robots guided Spain's
      King Felipe VI at MWC 2026 in Barcelona (March 2026), and Xi Jinping visited the company's robots during his
      Shanghai tour earlier in 2025. At the same time, the company faces a material regulatory headwind: the US
      American Security Robotics Act, introduced March 26, 2026 by Senators Tom Cotton and Chuck Schumer with
      bipartisan support, would prohibit US federal agencies from purchasing or operating Chinese-made humanoid
      robots. If passed, this would directly limit AGIBOT's addressable US government market.

      In April–May 2026, the strategic expansion continued with the Genting Malaysia MOU (April 17, 2026), the APC
      2026 Shanghai Partner Conference, and the First Hong Kong Embodied AI Industry Summit (May 12, 2026). The
      company declared 2026 as "Deployment Year One," signalling a pivot from production scale to commercial ROI.
