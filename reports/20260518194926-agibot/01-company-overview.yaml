  - id: section-leadership
    title: Leadership, Governance, and Key-Person Dependence
    body: >-
      AGIBOT is co-founded and led by two principal figures. Deng Taihua (邓泰华) serves as CEO and is the
      controlling beneficial owner; Chinese corporate registry data (Qichacha) shows him as the actual controller
      holding approximately 33% of beneficial ownership as of July 2025. Peng Zhihui (彭志辉) is co-founder and CTO
      and the technical architect of the company's full-stack robotics platform; he was specifically named alongside
      Deng in Tracxn's company profile and was present at the March 2026 10,000-unit milestone event as "Co-founder
      and CTO." Whether Peng Zhihui is the same person as the widely-followed Chinese tech content creator known as
      "稚晖君" (Zhi Hui Jun) has not been independently confirmed in reviewed materials, though widely circulated online
      — this remains an unresolved point rather than an established fact.

      Additional confirmed leaders include Chuang Wang (王闯), Senior Vice President, who co-presented the 10,000th
      unit milestone, and Dr. Yao Maoqing (姚茂庆), Partner, Senior Vice President, and President of the Embodied
      Business Unit, who represented AGIBOT as official spokesperson at CES 2026. The founding team is described
      officially as comprising "core executives from global technology leaders and top AI scientists," but individual
      prior employers and detailed biographies have not been confirmed in public materials reviewed.

      Board composition, investor seats, and governance terms are not publicly disclosed. The company has not
      announced any material leadership changes since founding. Key-person concentration is elevated: both co-founders
      occupy the top executive and technical roles, and no successor or distributed leadership structure has been
      disclosed. The company does not appear to have published any IPO, dual-listing, or SPAC-related governance
      milestones as of the report date.
