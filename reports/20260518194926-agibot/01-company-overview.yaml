  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        AGIBOT has not disclosed revenue, ARR, gross margin, burn rate, or any other income statement
        metric. No audited financials exist in the public domain.
      whyItMatters: >-
        Without revenue data, it is impossible to assess unit economics, profitability trajectory,
        or the sustainability of the current capital-intensive production ramp.
      diligencePath: >-
        Request management accounts, unaudited P&L, and cash flow statements directly from AGIBOT
        management in due diligence; cross-check against disclosed investment amounts for burn-rate
        triangulation.
      relatedQuestionRefs:
        - QO006

    - type: conflicting-data
      severity: material
      topic: funding
      missingEvidence: >-
        The reported valuation conflicts materially between Pandaily (exceeding ¥7 billion / ~$960M)
        and Tracxn ($6.4B USD). Neither figure is a primary disclosure from the company or its investors.
      whyItMatters: >-
        The difference spans roughly a 6× magnitude gap. Investment decision-making based on either
        figure alone would be unreliable. The Tracxn figure may reflect post-LG-Mirae round sentiment,
        while the Pandaily figure likely predates Series B.
      diligencePath: >-
        Obtain company-confirmed pre-money valuation for the Series B and LG-Mirae rounds from management
        or lead investors directly. Cross-check with Qichacha registration capital changes.
      relatedQuestionRefs:
        - QO005
      relatedTableRefs:
        - TO001

    - type: missing-source
      severity: minor
      topic: leadership
      missingEvidence: >-
