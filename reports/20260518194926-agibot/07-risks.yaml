  - id: s702
    title: Technical and Product Risks
    body: >
      Agibot's rapid production acceleration — from 5,000 to 10,000 units in three months — is operationally impressive
      but introduces quality-at-scale risk that is difficult to assess from external sources. The headline 8-hour
      zero-error operation at Longcheer's Nanchang tablet factory (2,283 tasks completed) is a compelling data point,
      but it represents a single deployment at a single facility performing a defined subset of pick-and-place tasks on
      a 3C assembly line. Industrialisation at 100+ units per customer, across automotive, semiconductor, and service
      environments, introduces variance in environmental conditions, task complexity, edge cases, and interaction
      scenarios that a single pilot cannot anticipate. No public data exists on Agibot's mean time between failures
      (MTBF), field return rates, or quality escape rates at production volume.

      The officially published security support period for Agibot's commercial robots — the A2, G2/G2 Air, and X2 Ultra
      — is only 12 months from the January 2026 launch date (ending January 2027). Software products (Aimmaster, App,
      PAD) have a similarly short 12-month security update horizon. For enterprise customers integrating humanoid robots
      into long-cycle industrial processes — where capital equipment is expected to operate for 5–10+ years — a 12-month
      security patch window is materially insufficient. It creates a contractual and liability gap: after January 2027,
      robots running outdated firmware in production environments become targets for cybersecurity exploits, and
      operators bear unmitigated risk. No public statement from Agibot addresses long-term support obligations, extended
      service agreements, or security update governance beyond the defined period.

      Agibot positions the Genie Sim 3.0 digital twin as the key enabler for rapid deployment, compressing traditional
      months-long on-site debugging to 36 hours. While this is a genuine competitive advantage in managed deployments,
      it introduces a new single point of failure: if the Genie Sim infrastructure experiences downtime, is repriced, or
      becomes unavailable, existing deployment pipelines are disrupted. The MIIT standard also notes that tactile
      sensing remains a critical bottleneck; Peng Zhihui himself acknowledged in the MIIT committee that nearly 80
      percent of high-value manipulation tasks depend on tactile feedback not yet standardised. Without standardised
      tactile sensing, robot error rates in novel or uncharacterised objects may be significantly higher than reported
      in controlled demos.

      The IDC attribution of 5,200 units shipped in 2025 — which Humanoid Index confirms — was contested by rival
      Unitree, which claimed 5,500 humanoid shipments and filed for a USD 580 million IPO. The shipment-count dispute
      signals that production figures in this industry are not audited and cannot be independently verified. If Agibot's
      production claims are overstated or refer to manufactured-but-undelivered units, the commercial evidence
      supporting the investment thesis is weakened. This verification gap is a material diligence risk at any stage.
