  - id: TR005
    title: Financial and Capital Risk Register
    columns:
      - Risk
      - Likelihood
      - Severity
      - Quantification
      - Mitigation
      - Residual Exposure
      - Diligence Path
    rows:
      - - Valuation-to-revenue gap at 7 billion yuan valuation against early-stage commercial revenue
