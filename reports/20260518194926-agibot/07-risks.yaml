  claims:
    - id: CR001
      statement: >-
        The American Security Robotics Act (ASRA), introduced on 26 March 2026 by Senators Tom Cotton (R-AR) and Chuck
        Schumer (D-NY), would prohibit the US federal government from purchasing or operating humanoid robots made by
        Chinese firms, citing national security and data-exfiltration risks.
      type: third-party-reported
      topic: ASRA
      sourceRefs:
        - SR001
      confidence: medium
      freshness: recent
    - id: CR002
      statement: >-
        The ASRA bill identifies Chinese humanoid robot startups, including Agibot and Unitree, as the target firms and
        was reported by Reuters as naming them explicitly in the legislative context.
      type: third-party-reported
      topic: ASRA
      sourceRefs:
        - SR001
      confidence: medium
      freshness: recent
    - id: CR003
      statement: >-
        A companion bill to ASRA was simultaneously introduced in the US House of Representatives by Representative
        Elise Stefanik (R-NY), signalling bipartisan bicameral momentum for restrictions on Chinese humanoid robots in
        government procurement.
      type: third-party-reported
      topic: ASRA
      sourceRefs:
        - SR001
      confidence: medium
      freshness: recent
    - id: CR004
      statement: >-
        ASRA would bar federal funds from being used in connection with Chinese-made ground robots and would contain
        limited exemptions for military and law enforcement to research Chinese robots as long as the robots cannot
        transmit data to or receive data from China.
      type: third-party-reported
      topic: ASRA
      sourceRefs:
        - SR001
      confidence: medium
      freshness: recent
    - id: CR005
      statement: >-
        Agibot's Website Privacy Policy, effective 30 April 2026, discloses data collection of device identifiers, usage
        data, and technical information from robot operations, with provisions for international data transfer and
        sharing with third-party service providers.
      type: company-claimed
      topic: data sovereignty
      sourceRefs:
        - SR004
      confidence: medium
      freshness: current
    - id: CR006
      statement: >-
        As a Chinese-incorporated entity, Agibot is subject to the PRC National Intelligence Law (2017), which requires
        all Chinese organisations to assist state intelligence work on request; this obligation cannot be contractually
        waived with overseas customers.
      type: inferred
      topic: data sovereignty
      sourceRefs:
        - SR004
        - SR017
      confidence: high
      freshness: current
    - id: CR007
      statement: >-
        The Hill Dickinson legal analysis identifies the core unresolved liability question for humanoid robots: when an
        autonomous humanoid robot causes harm, responsibility allocation between manufacturer, operator, and software
        provider is legally unsettled globally as of 2026.
      type: inferred
      topic: robot liability and safety regulation
      sourceRefs:
        - SR003
      confidence: medium
      freshness: current
    - id: CR008
      statement: >-
        US OSHA confirms there are currently no specific OSHA standards for the robotics industry; robot accident risks
        during non-routine operations are identified but no humanoid-specific safety compliance framework exists in US
        occupational health law.
      type: third-party-reported
      topic: robot liability and safety regulation
      sourceRefs:
        - SR023
      confidence: medium
      freshness: current
    - id: CR009
      statement: >-
        ISO 10218-1:2011, the predecessor industrial robot safety standard, explicitly does not address bipedal humanoid
        robots operating in open environments; the standard is withdrawn and under revision; no ISO standard for
        general-purpose humanoid robots exists as of May 2026.
      type: third-party-reported
      topic: robot liability and safety regulation
      sourceRefs:
        - SR025
      confidence: medium
      freshness: current
    - id: CR010
      statement: >-
        Agibot's officially published Product Security Update Support policy sets a 12-month security update window from
        the January 2026 launch date for the A2, G2/AgiBot G2, and X2 Ultra models, with security update support ending
        January 2027 — critically short for enterprise capital equipment.
      type: company-claimed
      topic: security support lifecycle
      sourceRefs:
        - SR005
      confidence: medium
      freshness: current
    - id: CR011
      statement: >-
        Agibot software products — Aimmaster, App, and PAD — have a defined security update support end date of 2
        January 2027 per the published support policy, creating a coordinated product and software security support
        cliff 12 months after commercial launch.
      type: company-claimed
      topic: security support lifecycle
      sourceRefs:
        - SR005
      confidence: medium
      freshness: current
    - id: CR012
      statement: >-
        Agibot's G2 robot completed 2,283 tasks with zero errors during an 8-hour continuous operation at Longcheer's
        Nanchang tablet factory in April 2026, demonstrating 99.9%+ task success rate in that controlled setting; this
        is the primary public deployment evidence for reliability claims.
      type: third-party-reported
      topic: deployment reliability
      sourceRefs:
        - SR010
        - SR011
      confidence: medium
      freshness: recent
    - id: CR013
      statement: >-
        The Longcheer deployment involved pick-and-place precision tasks at multimedia integrated testing (MMIT)
        stations with defined cycle times of 19–20 seconds, representing a constrained set of tasks rather than the full
        range of unstructured manipulation Agibot demonstrates in promotional material.
      type: third-party-reported
      topic: deployment reliability
      sourceRefs:
        - SR010
        - SR011
      confidence: medium
      freshness: recent
    - id: CR014
      statement: >-
        MIIT's HEIS committee acknowledged that in industrial scenarios, nearly 80 percent of high-value manipulation
        tasks where humans excel but traditional automation struggles are strongly related to tactile sensing — a
        capability not yet standardised and described as a critical bottleneck by Agibot's CTO Peng Zhihui.
      type: third-party-reported
      topic: deployment reliability
      sourceRefs:
        - SR002
      confidence: medium
      freshness: current
    - id: CR015
      statement: >-
        IDC's attribution of 5,200 Agibot units shipped in 2025 was contested by rival Unitree, which claimed 5,500
        humanoid shipments and filed for a USD 580 million IPO; shipment data is unaudited and cannot be independently
        verified, creating a diligence gap on the commercial evidence foundation.
      type: third-party-reported
      topic: deployment reliability
      sourceRefs:
        - SR012
        - SR018
      confidence: medium
      freshness: recent
    - id: CR016
      statement: >-
        Agibot's Genie Sim 3.0 digital twin platform compressed traditional months-long on-site deployment debugging to
        36 hours, but creates a single-point-of-failure dependency on proprietary simulation infrastructure for all new
        deployment integrations.
      type: inferred
      topic: deployment reliability
      sourceRefs:
        - SR010
        - SR008
      confidence: high
      freshness: current
    - id: CR017
      statement: >-
        No public MTBF (mean time between failures), field return rate, or quality escape rate data for Agibot robots at
        production volume has been published; the single Longcheer deployment evidence is insufficient to characterise
        long-term reliability across diverse deployment environments.
      type: inferred
      topic: deployment reliability
      sourceRefs:
        - SR010
        - SR011
        - SR012
      confidence: medium
      freshness: current
    - id: CR018
      statement: >-
        Agibot accelerated production from 5,000 to 10,000 units in three months, representing a 4x increase in
        production speed; scaling from 10,000 to 50,000–100,000 units requires qualitatively different manufacturing
        investment in tooling, yield management, and supply chain redundancy.
      type: inferred
      topic: manufacturing and supply chain
      sourceRefs:
        - SR012
        - SR002
      confidence: medium
      freshness: recent
    - id: CR019
      statement: >-
        US Bureau of Industry and Security Export Administration Regulations have progressively tightened restrictions
        on advanced computing integrated circuits to China since 2022; AI inference processors used in humanoid robot
        embedded systems may be subject to export control restrictions affecting non-China supply chain access for
        Agibot.
      type: third-party-reported
      topic: manufacturing and supply chain
      sourceRefs:
        - SR024
      confidence: medium
      freshness: current
    - id: CR020
      statement: >-
        CATL, a strategic investor in Agibot per the Humanoid Index, is also a dominant Chinese lithium battery
        supplier; battery supply concentration creates a dual dependency where investor alignment and supply chain
        dependence may create preferential terms unavailable to Agibot's competitors.
      type: inferred
      topic: manufacturing and supply chain
      sourceRefs:
        - SR018
      confidence: medium
      freshness: current
    - id: CR021
      statement: >-
        IFR reported in May 2026 that China's manufacturing sector has an operational stock of approximately 2 million
        industrial robots, with 54% of global annual industrial robot installations occurring in China; this
        concentrated domestic market intensifies competition for Agibot within China itself.
      type: third-party-reported
      topic: manufacturing and supply chain
      sourceRefs:
        - SR028
      confidence: medium
      freshness: current
    - id: CR022
      statement: >-
        Agibot has no publicly confirmed field service infrastructure, regional support offices, or certified integrator
        network outside China as of May 2026; international deployment at CES 2026 market entry level lacks operational
        support scalability.
      type: inferred
      topic: manufacturing and supply chain
      sourceRefs:
        - SR013
        - SR015
      confidence: medium
      freshness: current
    - id: CR023
      statement: >-
        The APC 2026 conference confirmed Agibot's expansion plans into automotive manufacturing and semiconductor
        industries, both of which have substantially higher reliability, contamination, and safety requirements than 3C
        electronics manufacturing — presenting new qualification hurdles not yet addressed in public deployment
