  - id: s705
    title: Financial and Capital Risks
    body: >
      Agibot's most recent disclosed valuation exceeds 7 billion yuan (approximately USD 970 million at current exchange
      rates). Goldman Sachs Research estimates the global humanoid robot market could reach USD 6 billion in a base case
      within 10–15 years, with a blue-sky scenario of USD 154 billion by 2035. IDC forecasts global humanoid shipments
      to exceed 510,000 units by 2030. These projections support a large eventual market, but they also underscore the
      distance between the current state — approximately 10,000 units produced by Agibot at an unconfirmed average
      selling price — and the revenue scale needed to justify a near-billion-dollar valuation.

      Agibot has disclosed no revenue, gross margin, operating loss, or burn rate. The total disclosed funding across
      multiple rounds is approximately USD 83 million (per Humanoid Index), but strategic financing from Tencent, BYD,
      JD.com, and LG Electronics may not have been disclosed at full value. Capital intensity for humanoid robot
      manufacturing — tooling, component procurement, quality assurance, field service, warranty reserves — means that
      even with 10,000 units produced, the company almost certainly operates at a deeply negative free cash flow
      position. The Goldman Sachs analysis notes that 2026 is a critical year for "volume verification and expectation
      reset," with investors focused on whether ambitious unit targets and supply chain company valuations are
      sustainable.

      Agibot is reported to be preparing an A-share IPO listing on China's STAR Market, regulated by the China
      Securities Regulatory Commission (CSRC). A public listing introduces disclosure obligations, lock-up period
      dynamics, market sentiment sensitivity, and public-market valuation discipline that private investors have not had
      to navigate. If the IPO is oversubscribed relative to deliverable revenue proof, the post-listing period may
      require Agibot to execute aggressive commercial deployment milestones to prevent valuation compression. This
      creates incentives for overpromising deployment timelines and customer revenue recognition — a financial and
      reputational risk. Conversely, if the IPO market deteriorates (due to broader China tech market conditions or
      US–China escalation), Agibot may need to delay its public liquidity event and rely on continued private capital
      during its most capital-intensive manufacturing phase.
