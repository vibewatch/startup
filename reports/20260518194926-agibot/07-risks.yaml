  - id: s704
    title: Partner, Dependency, and Concentration Risks
    body: >
      Agibot's visibility with Chinese state leadership — including a demonstration to President Xi Jinping during his
      Shanghai visit in 2026 — is a powerful signal of strategic backing and domestic market access. It is
      simultaneously a geopolitical concentration risk. Any deterioration in the political standing of the company's
      founders, a shift in central government priorities away from humanoid robotics, or an escalation in US–China
      technology tensions could reduce the preferential policy environment that enables rapid permitting, capital
      access, and government procurement. The political endorsement also reinforces perceptions of state-embedded
      robotics in Western markets, potentially accelerating legislative restrictions beyond the ASRA framework.

      Longcheer Technology is the most prominently documented commercial customer — the anchor case for Agibot's
      "Deployment Year One" narrative. The Longcheer relationship includes the world's first industrial-scale 3C
      embodied AI deployment and a publicly announced plan to expand to 100 units at Longcheer sites by Q3 2026. While
      this customer-and-partnership structure is encouraging, it also means that a single customer underpins the primary
      external deployment evidence. If Longcheer delays the expansion, reduces its commitment, or encounters its own
      business difficulties, Agibot loses its most visible commercial reference case at the precise moment when the
      company needs referenceable proof for the next wave of enterprise customers.

      Agibot's investor register — disclosed via Chinese corporate registry data — includes BYD, SAIC, BAIC Group,
      JD.com, Tencent, LG Electronics, and Mirae Asset, alongside venture capital firms (Hillhouse, Sequoia
      China/HongShan, Bluerun, Matrix Partners China). State-adjacent investors (BAIC Group is majority state-owned;
      SAIC is state-owned; BYD receives significant state subsidies) provide strategic value in the form of customer
      access and regulatory support, but also introduce governance questions. Investor-customers with production
      operations may receive preferential deployment terms and pricing that are not replicable at arm's-length
      commercial terms for independent enterprise customers. The CFIUS review mechanism in the United States reviews
      foreign investments and acquisitions with potential national security implications; Agibot's investor structure —
      with state-enterprise and LG (Korean) capital — would attract scrutiny in any US market entry or joint venture
      context.
