        - plannedFigures/dependency-map
      status: answered
    - id: QR005
      question: >-
        What is Agibot's plan to extend security update support beyond January 2027 for the A2, G2, and X2 Ultra product
        lines, and does Agibot offer enterprise long-term support (LTS) contracts with multi-year security patch
        commitments?
      type: mechanism
      targets:
