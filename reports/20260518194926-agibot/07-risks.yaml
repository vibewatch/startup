  researchQuestions:
    - id: QR001
      question: >-
        Has the American Security Robotics Act advanced through Senate or House committee as of May 2026, and have any
        amendments expanded the scope to include private sector prohibitions or allied-nation procurement restrictions?
      type: adverse
      targets:
        - contentRequirements/0
        - plannedFigures/risk-transmission-map
      status: partial
    - id: QR002
      question: >-
        Has Agibot engaged any US regulatory or government affairs counsel in connection with ASRA, or established any
        corporate structure to separate its US-market entity from Chinese-origin data flows?
