  - id: TR006
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold or Event
      - Action Implication
    rows:
      - - ASRA or analogous federal procurement ban enacted
        - US Congressional actions; Federal Register notices; DoD/GSA procurement guidance
        - >-
          ASRA passes both chambers or is signed; equivalent state-level restrictions in California, Texas, or New York
          pass
        - Thesis-break for US federal and government-adjacent revenue; accelerate EU and allied-nation market strategy
      - - Longcheer deployment fails to reach 100-unit expansion by Q4 2026
        - Agibot press releases; Longcheer investor communications; third-party deployment reporting
        - No announcement of 100-unit expansion milestone by December 2026
        - >-
          Thesis-pressure: primary commercial reference case fails to scale; request pipeline update and replacement
          reference case
      - - Shipment count claims revised or disconfirmed by independent audit
        - IDC, Omdia, or analyst restatement of Agibot shipment data; STAR Market IPO prospectus disclosure
        - >-
          Public restatement reducing 2025 shipments below 3,000 units; CSRC prospectus showing substantially lower
          delivery figures
        - 'Thesis-break: commercial evidence foundation is weaker than claimed; valuation support deteriorates'
      - - Security incident or physical safety incident involving deployed robot
        - Press reporting; OSHA 300 logs (US); customer public statements; MIIT incident disclosure
        - Any publicly reported physical harm incident involving an Agibot robot in commercial deployment
        - >-
          Thesis-pressure: product liability crystallises; insurance repricing; customer adoption pause; regulatory
          investigation
      - - Key founder departure (Peng Zhihui or Edward Deng)
        - LinkedIn; company press releases; investor communications; STAR Market filing if IPO is underway
        - Departure of either co-founder prior to IPO completion and commercial-scale deployment
        - >-
          Thesis-break: concentrated technical and relationship capital exits; request replacement leadership quality
          assessment
      - - Extended security support beyond January 2027 not announced
        - Agibot official support policy updates; customer communications; product roadmap announcements
        - No extended support period or LTS programme announced by October 2026
        - >-
          Thesis-pressure: enterprise customer adoption friction increases; contract renewal risk; confirm enterprise
          support roadmap
    notes: >-
      Kill criteria are defined around the six highest-consequence risks: legislative, customer, commercial evidence,
      safety, people, and product support. Three of the six (ASRA, Longcheer expansion, extended security support) have
      measurable time-bound triggers within 2026.
