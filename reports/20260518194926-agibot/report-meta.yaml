companyProfile:
  summary: >-
    Agibot (AGIBOT Innovation (Shanghai) Technology Co., Ltd., 智元机器人) is a
    Shanghai-based embodied AI and humanoid robotics company founded in 2023.
    The company combines robot hardware, foundation models, deployment software,
    and operational datasets into a full-stack platform spanning industrial
    manipulation, logistics, hospitality, retail, and interactive service use
    cases. Public evidence shows unmatched Chinese production scale and one
    compelling factory deployment at Longcheer, but the company remains a
    private, financially opaque Series B business.
  foundedDate: "2023-02-27"
