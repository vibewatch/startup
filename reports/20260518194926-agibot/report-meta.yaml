  foundingLocation: "Shanghai, China"
  headquarters: "Shanghai, China"
  productSummary: >-
    General-purpose embodied robot portfolio spanning the A2 humanoid series,
    G1/G2 industrial robots, X1/X2 developer and interaction robots, dexterous
    hands, the Genie Studio deployment stack, and Agibot World / related model
    tooling for embodied AI.
  customerFocus: >-
    Manufacturing, logistics, hospitality, retail-service, public interaction,
    and enterprise operators seeking labor automation or interactive robotics.
  businessModel: >-
    Combination of hardware sales, project deployment packages, and early
    robot-as-a-service / deployment-platform monetization for enterprise and
    commercial operators.
  stage: Series B
  fundingStatus: >-
