  topStrengths:
    - >-
      Independent reviews validate premium build quality, focused cartridge compatibility, and a differentiated
      physical-gaming experience.
    - >-
      Expansion from Chromatic into ModRetro 64, physical cartridges, accessories, and publishing broadens the
      commercial surface beyond one handheld.
    - >-
      Chromatic's reported sellout, later restock, and recurring GameStop distribution provide credible, though
      unquantified, demand signals.
  topRisks:
    - >-
      Pre-production ModRetro 64 testing found repeated Wi-Fi update failures, incomplete features, and 46 North
      American titles with minor or major compatibility issues.
    - >-
      Recognized revenue, gross margin, cash, burn, runway, inventory exposure, return rates, and product-level
      contribution economics are undisclosed.
    - >-
      The reported $1 billion valuation and approximately $164 million of funding lack sufficient primary financing and
      security-term evidence.
    - >-
      Key-person, retailer, specialist-component, intellectual-property, and product-compliance dependencies remain
      incompletely quantified.
  unresolvedGaps:
    - >-
      Obtain audited monthly revenue, gross margin, cash, burn, inventory, returns, warranty, support-cost, and
      attach-rate data by product and channel.
    - >-
      Obtain the May 2026 financing documents, fully diluted cap table, investor rights, preference stack, board
      composition, and current cash proceeds.
    - >-
      Establish current headcount, customer and unit counts, sell-through, repeat-purchase behavior, retention, and
      direct-versus-GameStop channel concentration.
    - >-
      Verify post-launch ModRetro 64 update success, compatibility remediation, promised-feature delivery, return rates,
      and support-ticket incidence.
    - >-
      Review freedom-to-operate analysis, licenses, privacy and security controls, product certifications, recall
      history, and regulator or litigation records.
