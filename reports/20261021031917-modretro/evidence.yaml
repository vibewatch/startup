evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Dated revenue, gross margin, cash, burn, unit sales, customer count, channel mix, and numeric headcount.
    whyItMatters: >-
      Without operating scale and unit economics, product enthusiasm cannot be translated into financial durability or
      valuation support.
    diligencePath: >-
      Request monthly management accounts, SKU-level sales and margin data, channel sell-through, returns, cohort data,
      payroll roster, and cash statements.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financing
    missingEvidence: >-
      Primary financing announcement, closing documents, cap table, investor identities, security terms, and cumulative
      funding history.
    whyItMatters: >-
      A secondary report of one round does not establish total capital raised, dilution, liquidation preferences, or
      cash available.
    diligencePath: >-
      Obtain executed financing documents, the current fully diluted cap table, board approvals, bank receipts, and
      investor confirmations.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete board, executive, beneficial-owner, voting-rights, succession, and material leadership-change records.
    whyItMatters: >-
      The visible team is concentrated around two product leaders, but public sources do not show formal oversight or
      continuity protections.
    diligencePath: >-
      Request the charter, bylaws, board minutes, director roster, organization chart, employment agreements, and
      succession plan.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: modretro-64
    missingEvidence: >-
      Post-launch shipment, compatibility, update reliability, return-rate, warranty-cost, and sell-through evidence for
      the ModRetro 64.
    whyItMatters: >-
      A pre-production review identified update problems and promised features, so a listing alone does not establish
      production readiness.
    diligencePath: >-
      Review production firmware telemetry, support tickets, returns, warranty reserves, compatibility logs, and
      retailer sell-through after launch.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market sizing gap
    missingEvidence: >-
      Independent current category revenue, active cartridge-owner counts by platform and geography, and premium FPGA
      hardware unit volumes.
    whyItMatters: >-
      Without common-period demand data, historical installed base and price points cannot produce a defensible TAM or
      SAM.
    diligencePath: >-
      Commission or obtain retailer and distributor sell-through, platform-specific collector surveys, and independent
      category shipment data with geography and period.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial traction
    missingEvidence: >-
      ModRetro units, recognized revenue, gross margin, channel mix, returns, support cost, cartridge attach, reorder
      behavior, and cohort retention.
    whyItMatters: These metrics determine captured demand, repeat economics, channel quality, and whether any SOM is supportable.
    diligencePath: >-
      Review management accounts, SKU-level order and return data, retailer statements, and cohort analyses reconciled
      to recognized revenue.
    relatedQuestionRefs:
      - QM002
      - QM004
      - QM005
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: buyer segmentation
    missingEvidence: >-
      Measured customer demographics, use cases, willingness-to-pay, substitution behavior, and overlap between
      Chromatic and ModRetro 64 prospects.
    whyItMatters: Unmeasured segments can double-count buyers and overstate cross-platform expansion.
    diligencePath: >-
      Run purchaser interviews and a representative survey, then reconcile stated preferences with transaction, attach,
      and repeat-purchase behavior.
    relatedQuestionRefs:
      - QM003
      - QM006
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor scale
    missingEvidence: >-
      Comparable product-level unit sales, installed base, revenue, funding, and current channel inventory for ModRetro
      and Analogue are not available in the assigned evidence.
    whyItMatters: >-
      Product reviews and list prices establish positioning but cannot show relative scale, demand durability,
      purchasing power, or the ability to fund repeated hardware launches.
    diligencePath: >-
      Request product-level sell-through and channel inventory from ModRetro, then obtain distributor checks and
      comparable corporate filings or financing records for peers.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: ecosystem economics
    missingEvidence: >-
      Public evidence does not quantify cartridge attach rate, repeat purchase behavior, developer economics, return
      rates, or cross-device customer overlap.
    whyItMatters: >-
      These metrics determine whether physical publishing and open development create a durable flywheel or remain
      marketing differentiation with limited switching cost.
    diligencePath: >-
      Review cohort-level hardware and cartridge orders, developer contracts, return data, and anonymized customer
      overlap across Chromatic and M64.
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Recognized revenue by SKU and channel, revenue-recognition policy, discounts, returns, and revenue mix.
    whyItMatters: List prices and product availability cannot establish revenue scale, quality, concentration, or accounting timing.
    diligencePath: >-
      Obtain monthly management accounts, order-level exports, channel statements, refund data, and the
      revenue-recognition memo.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: Current cash, monthly burn, debt and purchase obligations, runway, financing proceeds, and next-round trigger.
    whyItMatters: >-
      A reported valuation discussion does not establish liquidity or capital adequacy for a hardware and publishing
      plan.
    diligencePath: >-
      Review bank statements, financing documents, debt schedules, board budgets, purchase commitments, and a monthly
      cash bridge.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Product-level landed COGS, channel deductions, attachment rates, return rates, warranty reserves, and contribution
      margin.
    whyItMatters: >-
      Premium list prices may coexist with weak contribution margins when hardware, inventory, support, and publishing
      costs are high.
    diligencePath: >-
      Reconcile SKU-level orders to landed costs, returns, warranty tickets, royalty statements, and channel settlements
      by cohort.
    relatedQuestionRefs:
      - QI009
