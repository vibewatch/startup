  topStrengths:
    - 独立评测验证了其高端做工、明确的卡带兼容范围，以及差异化的实体游戏体验。
    - 业务从 Chromatic 扩展到 ModRetro 64、实体卡带、配件和发行，商业触点不再局限于一款掌机。
    - Chromatic 据报道售罄、随后补货，并持续通过 GameStop 分销，这些都提供了可信但尚未量化的需求信号。
  topRisks:
    - 量产前测试发现 ModRetro 64 的 Wi-Fi 更新反复失败、功能尚未完整，且有 46 款北美游戏存在轻微或重大兼容性问题。
    - 已确认收入、毛利率、现金、烧钱速度、现金跑道、库存敞口、退货率和产品层面贡献经济学均未披露。
    - 据报道的 $1 billion 估值和约 $164 million 融资额，缺少足够的新股融资及证券条款证据。
    - 对关键人员、零售商、专用零部件、知识产权和产品合规的依赖仍未得到完整量化。
  unresolvedGaps:
    - 获取按产品和渠道拆分、经审计的月度收入、毛利率、现金、烧钱速度、库存、退货、保修、支持成本和配件加购率数据。
    - 获取 2026 年 5 月融资文件、完全摊薄股权结构表、投资者权利、优先股堆叠、董事会构成和当前现金到账额。
    - 确认当前员工数、客户数和销量、售罄率、复购行为、留存，以及直营与 GameStop 渠道的集中度。
    - 核实 ModRetro 64 上市后的更新成功率、兼容性修复、承诺功能交付、退货率和支持工单发生率。
    - 审查自由实施分析、许可、隐私与安全控制、产品认证、召回历史，以及监管机构或诉讼记录。
