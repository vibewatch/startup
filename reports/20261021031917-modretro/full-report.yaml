  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and purchase jobs
        blocks:
          - type: paragraph
            body: >-
              The clearest segmentation is by play context and collection: Chromatic serves owners of Game Boy and Game
              Boy Color cartridges who value faithful portable play, while M64 serves Nintendo 64 cartridge owners
              seeking a modern living-room experience. Independent reviews consistently frame Chromatic as a premium,
              intentionally narrow product rather than a general-purpose emulation handheld. Current direct pricing
              reinforces that premium ladder: on the run date, ModRetro listed transparent Chromatic bundles at $149.99,
              standard-color bundles from $199.99, and M64 hardware at $229.99. Within those categories, the evidence
              suggests distinct collector, preservationist, gift, and enthusiast use cases, but it does not disclose
              segment size, geography, acquisition cost, revenue contribution, or payer-versus-user differences. The
              segment map is therefore qualitative rather than a measured customer census.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU010
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU010
      - number: '6.2'
        title: Adoption signals and named proof
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is directional but credible enough to show a functioning market rather than only
              a concept. The First Edition Chromatic sold out before a permanent restock in July 2025, and ModRetro's
              launch messaging explicitly directed buyers to preorder or shop at GameStop. The channel relationship
              persisted across generations: GameStop carried an exclusive Chromatic colorway and later an exclusive
              Smoke M64 bundle. Independent hands-on evidence is also positive. XDA rated Chromatic 9/10 and praised the
              focused cartridge experience, while ModRetro's own storefront displays named testimonials emphasizing
              build, display, nostalgia, and repeat use. Those testimonials are useful voice-of-customer examples but
              remain company-curated, with no disclosed sampling, moderation, or verification method. None of these
              signals provides unit sales, active users, reorder rates, attach rates, or a comparable cohort
              denominator.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU011
              - CU012
              - CU013
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The customer thesis depends on ModRetro converting nostalgia-led hardware purchases into a durable
              physical-games and accessories ecosystem, but public evidence does not yet demonstrate that loop
              quantitatively. Product maturity is one friction point. PCMag's pre-production M64 review reported
              repeated Wi-Fi update failures, and ModRetro separately acknowledged that the M64 PSRAM implementation was
              operating at roughly half of architectural potential before launch. PCMag also relayed a mixed
              compatibility count, including titles with minor and major issues. These disclosures do not prove elevated
              returns or churn, but they identify support and update execution as measurable renewal risks. More
              importantly, the assigned evidence contains no NRR, GRR, churn, cohort retention, repeat-purchase rate,
              customer concentration, or direct-versus-retail revenue mix. The recurring GameStop relationship expands
              reach while also creating an unquantified channel dependency.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer durability is not publicly measurable
            body: >-
              Sell-outs, restocks, reviews, and retail exclusives demonstrate interest, but they do not establish repeat
              purchase, retention, profitable acquisition, or low channel concentration.
            calloutType: risk
            claimRefs:
              - CU005
              - CU007
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Underwriting posture and severity ranking
        blocks:
          - type: paragraph
            body: >-
              Risk is concentrated in execution and evidence quality rather than in a documented regulatory action.
              PCMag's pre-production ModRetro 64 testing observed failed Wi-Fi updates, 23 North American releases with
              major issues, another 23 with minor issues, and several promised features that were not yet available.
              Those findings make software readiness and compatibility the highest residual exposures because they
              affect the company's second hardware platform at launch. Financial exposure is also high: Grey Journal
              reported unconfirmed financing discussions at a $1 billion valuation while stating that only one product
              had reached market and no revenue figures were disclosed. The heatmap therefore distinguishes observed
              product failures from legal, safety, privacy, and concentration questions for which the assigned public
              evidence is incomplete.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and compliance uncertainty
        blocks:
          - type: paragraph
            body: >-
              The reviewed sources do not establish a lawsuit, enforcement action, recall, breach, or safety incident,
              and that absence in a bounded source pool is not evidence that none exists. GamesBeat reported
              management's account that ModRetro reviewed expired Game Boy patents and used black-box reverse
              engineering for its BIOS; this is a mitigation narrative, not an independent freedom-to-operate opinion.
              Connected firmware updates, streaming, physical cartridges, and reliance on legacy Nintendo ecosystems
              create IP, privacy, security, and product-compliance diligence needs. The company should provide
              outside-counsel analysis, license schedules, privacy and security controls, applicable product
              certifications, recall history, and open claims. Until those primary records are reviewed, residual legal
              exposure remains unquantified rather than presumed low.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: Operational, quality, and launch readiness
        blocks:
          - type: paragraph
            body: >-
              The ModRetro 64 review provides direct adverse evidence from a pre-production unit. PCMag could not
              reliably update over Wi-Fi and used a microSD card instead; it also reported 23 major-issue and 23
              minor-issue titles among North American releases, plus a black screen when a cartridge failed to read. The
              same review described notifications, enhanced video processing, additional filters, menu audio, and
              lag-free adapters as post-release commitments. These may improve before or after launch, but the current
              evidence makes schedule, firmware quality, and support load monitorable risks. The key release gate is not
              shipment alone: compatibility, update success, return rates, support tickets, and promised-feature
              delivery should meet agreed thresholds over a representative installed base.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Dependencies, financial exposure, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              ModRetro depends on legacy cartridges and IP, specialist FPGA hardware, physical manufacturing, and a
              premium nostalgia buyer. GamesBeat reported that Chromatic sold out before a larger restock and that
              assembly occurs in Mexico, while management expressed hope rather than certainty that the location would
              remain tariff-safe. Valor, an investor, describes a vertically integrated alternative to China-dependent
              hardware, but that relationship makes the statement partner evidence rather than independent supply-chain
              verification. A thesis break should occur if ModRetro 64 major incompatibilities persist after launch,
              promised features materially slip, returns or support costs exceed plan, legal review identifies blocking
              IP exposure, or audited unit economics cannot support the valuation and working-capital burden. Investment
              should remain conditional on revenue, margin, burn, inventory, supplier, retailer, and concentration data.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment gating condition
            body: >-
              Do not treat launch shipment as de-risking. Require stable compatibility and update metrics, verified
              legal and compliance files, audited unit economics, and quantified supplier and channel concentration
              before underwriting scale or valuation.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR007
              - CR008
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and the limits of the public mark
        blocks:
          - type: paragraph
            body: >-
              The only retained valuation dataset reports a $1 billion valuation from December 2024, $145.2 million of
              equity financing against a $150 million offering in May 2026, and $164 million raised across two rounds.
              That dataset also says the May disclosure did not establish whether the earlier $1 billion mark was
              achieved. These are financing references, not proof of current enterprise value, cash available, revenue
              scale, or liquidation economics. No retained source supplies audited revenue, gross margin, inventory
              turns, working-capital needs, cap-table ownership, liquidation preferences, or fully diluted share count.
              The reported mark therefore functions only as an entry anchor; it cannot support an intrinsic valuation,
              ownership calculation, or target return. A new investor should treat current price discovery as incomplete
              rather than infer value from capital raised.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is broader than one nostalgic device. ModRetro describes Chromatic as the first step
              in a physical console-and-cartridge strategy, its investor describes a vertically integrated
              consumer-electronics platform, and independent reviewers document strong build quality and an expanding
              M64 proposition. Current store pricing places transparent Chromatic bundles at $149.99 and the M64 at
              $229.99, while a September 2026 comparison frames the Chromatic as narrower than the more versatile
              Analogue Pocket. This supports differentiated product appeal but not venture scale. The anti-thesis is
              that premium hardware remains a narrow, episodic category with inventory, support, and launch risk. Entry
              discipline should require primary financing documents plus cohort-level economics before accepting any
              price near the reported $1 billion mark.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: Evidence-constrained scenarios
        blocks:
          - type: paragraph
            body: >-
              Precise bull, base, and bear valuation ranges would be false precision because the denominator metrics and
              security terms are absent. The bull case can justify revisiting the reported $1 billion anchor only if
              management demonstrates repeatable sell-through, durable hardware and cartridge gross margins, low return
              and support burdens, and successful M64 execution. The base case remains track: product quality is
              visible, but revenue durability and ownership economics are not. The bear case is a down-round or
              impairment outcome if launches require repeated fixes, inventory absorbs financing, or the niche cannot
              sustain premium pricing. Scenario probabilities should be assigned only after data-room review; today,
              milestone signals are more defensible than numeric probabilities or return multiples.
            claimRefs:
              - CV003
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Decision path, exit readiness, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track, with medium confidence, high risk, and a stretched valuation stance. The M64
              extends the platform into home consoles, but PCMag's pre-production review found update friction and
              reported a meaningful compatibility tail, making launch quality a near-term proof point rather than a
              completed milestone. No public evidence supports a target holding period, exit valuation, or liquidity
              route. Before investment, obtain the May 2026 financing documents, fully diluted capitalization,
              preference stack, audited monthly revenue and gross margin by product, channel inventory, returns,
              warranty and support costs, cartridge attach rates, and M64 sell-through. Thesis-break triggers are a
              priced round materially below the reported mark, failure to resolve launch defects, sustained discounting
              without profitable attach, or evidence that financing is funding inventory accumulation rather than
              repeatable demand.
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not price from the headline mark
            body: >-
              Reopen the investment decision only when primary financing terms and product-level economics can convert
              the reported valuation anchor into explicit ownership and return math.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: callout
            title: Launch execution is the nearest observable catalyst
            body: >-
              M64 pricing is visible, but compatibility and update execution must improve before the broader-platform
              thesis deserves valuation credit.
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
