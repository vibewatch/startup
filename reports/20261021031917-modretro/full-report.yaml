      - number: '2.3'
        title: Adoption depends on authenticity overcoming price and execution friction
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by a recognizable legacy installed base, original-cartridge compatibility, premium
              industrial design, and a content strategy that combines reissues with new physical games. Restocking and
              accessories broaden the offer, while expansion from Chromatic to ModRetro 64 can reuse the physical-media
              and FPGA thesis across another collector cohort. The constraints are equally material: a $199-plus
              purchase competes with original hardware, phones, inexpensive emulation handhelds, and broader
              multi-system FPGA products; the Chromatic's narrow compatibility limits utility for buyers seeking Game
              Boy Advance or multiple platforms. PCMag's pre-production ModRetro 64 review found update friction and
              incomplete promised features, making firmware delivery and cartridge compatibility part of the adoption
              decision. Product enthusiasm and capital can fund expansion, but neither validates category scale. For
              valuation, the decisive evidence is therefore commercial: recognized revenue, gross margin, hardware and
              cartridge attach, reorder behavior, returns, support cost, and cohort retention. Until those data are
              available, the market case supports a focused premium niche with platform optionality, not a quantified
              mass-market outcome.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert financing value into market size
            body: >-
              Forge's $1 billion post-money figure and TechCrunch's earlier report of fundraising discussions describe
              investor pricing, while the assigned evidence contains no independent TAM, category revenue, or ModRetro
              sell-through estimate.
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive set is wider than premium FPGA replicas. Analogue is the direct peer: Pocket addresses the
              premium handheld buyer, while Analogue 3D addresses the same original-cartridge N64 use case as M64.
              Original Nintendo hardware remains the authenticity benchmark and a status-quo substitute, although aging
              hardware and modern-display friction motivate replacement products. At the other end, inexpensive
              software-emulation handhelds and do-it-yourself emulator stacks trade hardware-level fidelity for broader
              libraries and lower prices. Mainstream consoles are adjacent entertainment substitutes rather than close
              product peers. Because original cartridges work across original hardware and multiple replicas, buyers can
              multi-home without moving a proprietary content library; the practical lock-in is therefore limited to
              accessories, firmware preferences, and each vendor's newly published games.
            claimRefs:
              - CP011
              - CP014
              - CP015
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP006
              - CP011
              - CP014
              - CP016
      - number: '3.2'
        title: Handheld tradeoffs favor focus versus breadth
        blocks:
          - type: paragraph
            body: >-
              Chromatic's defensible handheld angle is specialization. It plays physical Game Boy and Game Boy Color
              cartridges on a native-resolution display, while the reviewed evidence consistently treats the product as
              deliberately limited rather than a multi-system platform. Analogue Pocket asks a higher base price but
              adds native Game Boy Advance support, save-state and dock options, and a community openFPGA library
              spanning additional systems. Independent review evidence is favorable to Chromatic's build quality, yet
              the comparison still makes Analogue the stronger choice for buyers who value library breadth. ModRetro
              must therefore preserve a visible fidelity and physical-media advantage; competing feature-for-feature
              would erode the very focus that distinguishes Chromatic.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: M64 enters a live product-readiness contest
        blocks:
          - type: paragraph
            body: >-
              M64 undercuts Analogue 3D at both the reviewed list and early-bird prices, but price is not the only
              purchase criterion. PCMag's pre-production testing found a credible 4K cartridge console and open
              development posture, while also documenting update problems, a less polished interface, and incomplete
              game compatibility. ModRetro's own technical disclosure identified unfinished floating-point, RSP, and TLB
              work, making launch quality a measurable competitive risk rather than a generic execution concern.
              Open-source firmware and cores could attract developers and improve the system over time, but that option
              value does not erase the incumbent's current ease-of-use advantage. The decisive diligence metric is the
              pace at which the major-issue game count and promised-feature backlog decline after launch.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
      - number: '3.4'
        title: Moat durability depends on ecosystem execution
        blocks:
          - type: paragraph
            body: >-
              ModRetro is building more than interchangeable hardware: it plans and ships physical cartridges, works
              with homebrew developers, and can use device-aware presentation defaults to connect hardware with owned
              publishing activity. Retail exposure through GameStop also broadens discovery beyond enthusiast direct
              sales. Those advantages are potentially reinforcing, but none is yet proven to create high switching
              costs. Cartridge interoperability makes hardware replacement easy, Analogue retains broader platform
              coverage, and open sourcing can diffuse technical learning as well as attract contributors. The moat is
              therefore execution-based: differentiated industrial design, reliable launches, a compelling physical
              catalog, and sustained developer participation. Without sell-through, attach-rate, or repeat-purchase
              data, public evidence cannot show that this ecosystem has become a durable distribution or content
              flywheel.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP012
              - CP013
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing architecture
        blocks:
          - type: paragraph
            body: >-
              ModRetro's public commercial surface points to several transaction-based revenue streams rather than a
              recurring subscription model: premium consoles, separate controllers, individual physical games,
              multi-game bundles, and future remasters or new intellectual property. The M64 has been reported at $229,
              with a $199 early-bird offer, while its controller was reported at $89.99. The official storefront
              displays individual M64 cartridges at $49.99 and a four-title release bundle at $179.99. The company also
              says it directly funds indie developers and partners with larger studios, suggesting that content revenue
              may carry development or publishing commitments as well as manufacturing costs. These are list prices and
              stated mechanisms, not evidence of realized average selling price, net revenue, or margin.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI009
