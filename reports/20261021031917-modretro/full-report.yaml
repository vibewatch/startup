      - number: '1.4'
        title: Capitalization, scale, and disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Public capitalization evidence is the weakest part of the overview. One low-reputation secondary article
              says financing trackers list a $111.63 million Series A-1 at a $1 billion post-money valuation, but the
              reviewed pool contains no company announcement, filing, or named-investor confirmation for those figures.
              They should be treated as reported indicators rather than verified financing facts. Revenue, gross margin,
              cash, burn, customer count, unit sales, and numeric headcount are not disclosed in the retained evidence.
              The only scale language is the founder's description of a very small team, which cannot substitute for a
              dated employee count. Diligence should therefore prioritize primary financing documents, audited operating
              data, and a cap-table and governance package.
            claimRefs:
