      - number: '1.2'
        title: Leadership, governance, and stakeholder dependence
        blocks:
          - type: paragraph
            body: >-
              Valor Equity Partners' profile names Palmer Luckey, chief executive Torin Herndon, and chief financial
              officer Sam Ecker as the visible leadership team. Public materials provide unusually strong evidence of
              founder-product fit: Luckey describes nearly two decades of Game Boy hardware work, while Herndon told
              GamesBeat that he translated Luckey's product concept into Chromatic. That same evidence creates
              key-person concentration risk because product vision and technical execution are publicly tied to two
              individuals. The reviewed sources do not disclose a complete board, voting rights, investor protections,
              leadership-change history, or succession plan; the table is therefore a partial public roster, not a
              governance census.
            claimRefs:
              - CO002
              - CO005
              - CO016
