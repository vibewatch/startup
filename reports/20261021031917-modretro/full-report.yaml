      - number: '1.3'
        title: Milestones and product expansion
        blocks:
          - type: paragraph
            body: >-
              The current operating arc is rapid but still early. Chromatic was announced in June 2024, debuted and sold
              out late that year, and returned to stock in July 2025 with a larger game and accessory ecosystem.
              Independent reviews praised its build quality and cartridge fidelity. By 2026, ModRetro was listing the
              home-console ModRetro 64, and PCMag had tested a pre-production unit. This sequence demonstrates
              product-line expansion, but PCMag also encountered unreliable Wi-Fi updating and described several
              promised post-release functions. The milestone record therefore supports shipping capability while leaving
              launch execution and ongoing support quality as active diligence questions.
            claimRefs:
              - CO007
              - CO008
