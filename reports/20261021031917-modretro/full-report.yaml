      - CR013
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Product proof and platform breadth are offset by incomplete financial evidence and launch risk, producing a track
      recommendation rather than a price endorsement.
    data:
      nodes:
        - id: product-proof
          label: Independent product proof
        - id: platform-breadth
          label: Chromatic, cartridges, and M64
        - id: capital-anchor
          label: Reported $1B mark and $164M raised
        - id: evidence-deficit
          label: No audited revenue, margin, or security terms
        - id: execution-risk
          label: M64 update and compatibility risk
        - id: recommendation
          label: Track; require price and evidence reset
      edges:
        - from: product-proof
          to: platform-breadth
        - from: platform-breadth
          to: capital-anchor
        - from: capital-anchor
          to: evidence-deficit
        - from: evidence-deficit
          to: execution-risk
        - from: execution-risk
          to: recommendation
    approximationNotes: The flow is qualitative and does not imply numeric weights, probabilities, or a valuation bridge.
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV014
      - CV016
