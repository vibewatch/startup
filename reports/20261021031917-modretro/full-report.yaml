              - CI014
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Reporting that ModRetro was seeking financing at a $1 billion valuation establishes a valuation
              discussion, not the amount raised, cash received, or cash still available. The reviewed evidence provides
              no current cash balance, operating burn, debt schedule, inventory financing, runway, or next-round
              trigger. That distinction is especially important for a company simultaneously expanding hardware, funding
              physical software, and supporting firmware and compatibility work. The financial model is understandable
              at the SKU level, but revenue quality and margin durability are not underwritable from public information.
              Investment diligence should require bank evidence, monthly management accounts, inventory aging, channel
              receivables, returns, warranty costs, and product-level gross-margin bridges before relying on valuation
              or product enthusiasm.
            claimRefs:
              - CI011
              - CI012
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation is not liquidity
            body: >-
              A reported $1 billion financing valuation does not establish funding proceeds, cash on hand, or runway;
              all three remain undisclosed in the retained evidence.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
          - type: callout
            title: Underwrite from contribution margin
            body: >-
              Require product-level net revenue, landed cost, returns, warranty and channel deductions before assigning
              value to the visible premium list prices.
            calloutType: recommendation
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product system and user workflow
        blocks:
          - type: paragraph
            body: >-
              ModRetro's product thesis is narrower than a general emulation platform: customers use original cartridges
              in purpose-built hardware designed around one legacy console family. The Chromatic addresses Game Boy and
              Game Boy Color owners with a custom-resolution handheld, while the M64 extends the model to Nintendo 64
              cartridges, controllers, and modern displays. New physical games, accessories, cartridge updates, and
              streaming features broaden the offer from a device into a managed physical-media ecosystem. That scope is
              strategically coherent, but it also makes compatibility, firmware support, licensed-content supply, and
              accessory execution part of the core product rather than optional adjacency.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
