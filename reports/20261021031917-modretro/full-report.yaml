              - CE002
              - CE005
              - CE006
              - CE011
              - CE013
              - CE014
      - number: '5.3'
        title: Maturity, deployment, and support
        blocks:
          - type: paragraph
            body: >-
              Chromatic has meaningful external product proof: reviewers tested original cartridges, praised its
              physical execution, and documented field-upgrade capability. M64 evidence is earlier and more conditional.
              A pre-production review observed Wi-Fi update failures that required a microSD workaround, while
              compatibility reporting still included games with minor and major issues. Several user-facing capabilities
              were scheduled for later updates. These findings do not negate the hardware thesis, but they shift the
              underwriting question from whether the design is differentiated to whether ModRetro can close core bugs,
              ship updates reliably, and support a fragmented legacy library after launch.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Trust, quality controls, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strongest on industrial design and emulation architecture, not operational controls.
              The reviewed material does not disclose a security program, privacy treatment for connected features,
              independent quality certification, incident history, service levels, or a public status surface. The
              evidence base also contains low-reputation pages that conflate ModRetro with a generic multi-console
              software platform and inconsistent history; those pages are not usable as technical validation. Investment
              underwriting therefore needs production compatibility logs, return and defect data, firmware release
              telemetry, repository activity, vulnerability handling, and supply-chain quality records before treating
              the product stack as mature.
            claimRefs:
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Technical candor improves diligence quality
            body: >-
              ModRetro's M64 engineering disclosure names concrete accuracy defects and memory-performance limits rather
              than presenting FPGA use as automatic proof of fidelity.
            calloutType: strength
            claimRefs:
