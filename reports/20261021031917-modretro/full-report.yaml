      - number: '4.2'
        title: Go-to-market motion and public traction proxies
        blocks:
          - type: paragraph
            body: >-
              The historical Chromatic launch combined direct preorder availability with GameStop distribution, and
              bundled a physical Tetris cartridge with first-edition hardware. Current evidence also shows a portfolio
              expansion from a handheld into a home console and a catalog of physical games. Independent reviewers have
              handled both generations of hardware, which is stronger evidence of product existence than a roadmap
              alone, but it is not a substitute for sell-through, return, reorder, or channel-mix data. No retained
              source supplies customer-acquisition cost, sales cycle, channel margin, wholesale discount, or payback
              period. Diligence should therefore treat distribution breadth and reviewed products as traction proxies,
              not as quantified commercial performance.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI010
              - CI013
              - CI014
      - number: '4.3'
        title: Cost structure and unit-economics constraints
        blocks:
          - type: paragraph
            body: >-
              The disclosed product design indicates a hardware cost base that includes custom displays, metal
              enclosures, FPGA components, a premium printed circuit board, physical media, fulfillment, and support.
              The company characterizes the M64 board as unusually expensive and describes direct funding of some game
              development; those statements identify likely cost drivers but do not quantify bill of materials, royalty
              shares, inventory exposure, warranty reserves, or gross margin. A pre-production review also found
              wireless-update friction and incomplete compatibility, which could translate into support effort or
              returns if not resolved. The correct underwriting posture is to request cohort-level contribution
              economics rather than infer margin from premium pricing.
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
