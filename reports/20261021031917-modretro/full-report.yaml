  - id: FM001
    title: Evidence-bounded addressability pyramid
    type: pyramid
    summary: >-
      The evidence narrows from broad retro interest toward ModRetro demand, but only one historical installed-base
      proxy is quantified and no layer is a measured TAM or funnel.
    data:
      items:
        - label: Broad retro-gaming interest
          value: Unquantified
          detail: Too broad for ModRetro because it includes software emulation and unrelated gaming spend.
        - label: Historical Game Boy ownership
          value: '>100M devices'
          detail: Cumulative historical shipment proxy, not a count of current buyers.
        - label: Active physical-cartridge owners
          value: Unquantified
          detail: Relevant installed media base; active ownership by platform and geography is unavailable.
        - label: Premium authenticity buyers
          value: Unquantified
          detail: Observed product prices indicate willingness to pay, but volume and elasticity are unavailable.
        - label: Cross-platform ModRetro prospects
          value: Unquantified
          detail: Chromatic and ModRetro 64 address distinct legacy-platform cohorts with unknown overlap.
        - label: Captured ModRetro customers
          value: Unquantified
          detail: Units, revenue, channel mix, attach, returns, and repeat purchasing are undisclosed.
    approximationNotes: >-
      Conceptual hierarchy only; layer widths are not proportional, the >100M figure is a historical device proxy, and
      product price points are intentionally excluded from layer values because they do not measure audience size.
    claimRefs:
      - CM003
      - CM007
      - CM010
      - CM015
      - CM016
  - id: FP001
    title: Evidence-backed competitive positioning map
    type: quadrant
    summary: >-
      Analyst ordinal scoring separates single-system authenticity from platform breadth; it is a positioning aid, not a
      benchmark or measured product ranking.
    xAxis:
      label: Platform breadth
      min: 1
      max: 5
      lowLabel: Single-system
      highLabel: Multi-system
      description: Analyst ordinal score from retained cartridge and core coverage evidence.
    yAxis:
      label: Original-hardware fidelity orientation
      min: 1
      max: 5
      lowLabel: Convenience-led emulation
      highLabel: Original-hardware reference
      description: Analyst ordinal score from implementation, review, and readiness evidence.
    data:
      points:
        - label: ModRetro Chromatic
          x: 1.5
          'y': 4.5
          note: Narrow GB/GBC scope with native-resolution, physical-cartridge focus.
        - label: Analogue Pocket
          x: 4.5
          'y': 4
          note: Broader native and openFPGA scope while retaining physical-cartridge support.
        - label: ModRetro M64
          x: 2
          'y': 3.5
          note: N64-focused FPGA hardware with open work in the reviewed implementation.
        - label: Analogue 3D
          x: 2
          'y': 4
          note: N64-focused FPGA competitor with stronger reviewed out-of-box polish.
        - label: Original Nintendo hardware
          x: 1
          'y': 5
          note: Fidelity reference point with no cross-system platform breadth.
        - label: Software-emulation handhelds
          x: 5
          'y': 2
          note: Broad, lower-cost system coverage with software timing and setup tradeoffs.
    approximationNotes: >-
      Coordinates are analyst-assigned ordinal values from 1 to 5, derived from the cited scope, implementation, and
      review evidence; distances are not measured performance gaps.
    claimRefs:
      - CP006
      - CP011
      - CP014
      - CP016
