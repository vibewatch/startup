chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              ModRetro is an Irvine-based private consumer-electronics company whose public proposition combines
              purpose-built FPGA hardware with physical cartridges, accessories, and licensed or newly developed games.
              The official storefront currently lists Chromatic bundles across multiple materials and colors and lists
              the ModRetro 64, showing that the company has moved beyond a single handheld into a broader retro-hardware
              catalog. The commercial model therefore appears to mix hardware sales, recurring game releases, and
              accessories rather than software subscriptions. GamesBeat reports that the present company was
              incorporated in 2023; the older ModRetro name originated as Palmer Luckey's teenage hardware-hacking
              forum, so the brand history is longer than the current corporate entity.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO011
