              - CE005
              - CE011
              - CE013
              - CE014
      - number: '5.2'
        title: Architecture and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The central technical mechanism is FPGA-based hardware recreation rather than a broad software-emulation
              layer. For M64, the disclosed design uses low-latency PSRAM to make random memory access more predictable,
              an architecture intended to reproduce timing-sensitive N64 behavior. The same engineering disclosure is
              unusually candid about unfinished work: memory performance is below architectural potential,
              floating-point timing is wrong, the RSP dual pipeline is serialized, and inherited TLB shortcuts remain.
              Open-source commitments can improve inspectability and practitioner participation, but they do not by
              themselves establish accuracy, compatibility, or completion at launch.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
              - CE014
          - type: figure
