  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: A narrow premium market inside retro gaming
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all video games, all handhelds, or even all retro emulation. ModRetro sells
              purpose-built FPGA hardware for original physical cartridges, related accessories, and newly manufactured
              cartridges, with the Chromatic focused on Game Boy and Game Boy Color and the ModRetro 64 extending the
              model to Nintendo 64. That boundary includes premium hardware, physical-media preservation, licensed
              reissues and new retro-format games, and selected accessories. It excludes general-purpose mobile gaming,
              inexpensive software-emulation handhelds, ROM-first multi-system devices, original used consoles, and
              broader current-generation gaming spend. The differentiation is fidelity, tangible ownership, and
              low-friction use rather than catalog breadth or lowest price. An independent review praised the
              Chromatic's cartridge fidelity while identifying its GB/GBC-only scope and lack of a rechargeable battery
              as constraints. A comparison source also places FPGA handhelds above budget emulation devices, reinforcing
              that ModRetro competes for a narrower willingness-to-pay cohort rather than mass-market handheld demand.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM009
              - CM012
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
              - CM010
              - CM012
              - CM016
      - number: '2.2'
        title: Sizing proxies identify buyers, not a defensible TAM
        blocks:
          - type: paragraph
            body: >-
              The available sources provide useful boundary markers but no audited category size. Nintendo's more than
              100 million historical Game Boy units indicate a large legacy installed base, yet cumulative shipments are
              not active users, cartridge owners, or current annual spend. The $199 Chromatic price, $300 premium-screen
              option, and $199-to-$229 ModRetro 64 pricing show the consumer budget tier; they do not reveal volume or
              market value. ModRetro's $1 billion post-money valuation is likewise a financing datum based on
              company-submitted incorporation records, not a measure of addressable demand. The best-supported buyer
              groups are physical-cartridge owners, nostalgia-led former Game Boy or N64 users, fidelity-focused FPGA
              enthusiasts, and collectors attracted to hardware, colorways, accessories, and physical releases. Buyers
              generally also use and pay for the device, while classic-IP owners and indie developers are supply-side
              partners whose content can improve hardware utility. A credible SAM requires active cartridge-owner counts
              by platform and geography; SOM additionally requires ModRetro sell-through, returns, channel mix, attach
              rates, and repeat-purchase cohorts.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM010
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
