          detail: 买家会比较卡带支持、显示还原度、做工和价格。
          touchpoints:
            - Hands-on reviews
            - Product pages
        - id: purchase
          label: 购买硬件
          detail: 硬件通过直销和精选的 GameStop 独家渠道销售。
          touchpoints:
            - ModRetro storefront
            - GameStop
        - id: activate
          label: 游玩实体卡带
          detail: Chromatic 和 M64 分别覆盖掌机与客厅场景的卡带库。
          touchpoints:
            - Chromatic
            - M64
        - id: attach
          label: 增购游戏和配件
          detail: 实体发行、线缆、手柄和不同版本创造增购机会。
          touchpoints:
            - Physical games
            - Accessories
        - id: expand
          label: 在生态内扩展
          detail: 新硬件系列和限量版本可能促成再次购买。
          touchpoints:
            - M64 upgrade path
            - Limited colorways
