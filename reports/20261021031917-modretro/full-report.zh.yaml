chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              ModRetro 是一家位于尔湾的私营消费电子公司，公开产品主张是把定制 FPGA 硬件与实体卡带、配件及授权或新开发游戏结合起来。官方商店目前列出多种材质和配色的 Chromatic 套装，也列出
              ModRetro 64，说明公司已从单一掌机扩展为更完整的复古硬件目录。因此其商业模式似乎混合了硬件销售、持续发售游戏和配件，而非软件订阅。GamesBeat 报道，现有公司成立于 2023 年；更早的
              ModRetro 名称源于 Palmer Luckey 少年时期的硬件改装论坛，因此品牌历史长于当前法人实体。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
