      - number: '1.2'
        title: 领导层、治理与利益相关方依赖
        blocks:
          - type: paragraph
            body: >-
              Valor Equity Partners 的简介将 Palmer Luckey、首席执行官 Torin Herndon 和首席财务官 Sam Ecker
              列为可见领导层。公开材料对创始人与产品的匹配度提供了异常充分的证据：Luckey 描述了近二十年的 Game Boy 硬件经历，Herndon 则向 GamesBeat 表示自己把 Luckey 的产品构想落地为
              Chromatic。同一证据也带来关键人物集中风险，因为产品愿景与技术执行公开绑定在这两人身上。已审阅来源未披露完整董事会、投票权、投资者保护、领导层变更历史或继任计划，因此该表只是部分公开名单，不是完整治理清单。
