            body: >-
              核心技术机制是基于 FPGA 的硬件复现，而不是广泛的软件模拟层。M64 的披露设计使用低延迟 PSRAM，让随机内存访问更可预测，目标是复现对时序敏感的 N64
              行为。同一工程披露也坦率说明了未完成工作：内存性能低于架构潜力，浮点时序错误，RSP 双流水线被串行化，继承的 TLB
              捷径仍在。开源承诺可以提升可检查性和从业者参与度，但不能单独证明准确性、兼容性或发布时已完成。
