      - number: '2.3'
        title: 渗透取决于真实性能否抵消价格与执行摩擦
        blocks:
          - type: paragraph
            body: >-
              采用由可识别的遗留装机基础、原版卡带兼容性、高端工业设计以及结合重发版和新实体游戏的内容策略驱动。补货与配件扩大了产品供给，从 Chromatic 扩展到 ModRetro 64 也能把实体介质和 FPGA
              逻辑复用于另一批收藏者。约 $199 以上的购买会与原版硬件、手机、低价模拟掌机和更广泛的多系统 FPGA 产品竞争；Chromatic 的窄兼容性也限制了想要 Game Boy Advance
              或多平台支持的买家。PCMag 对试生产 ModRetro 64
              的评测发现更新摩擦和未完成功能，因此固件交付与卡带兼容性会直接影响采用。产品热度和资本可以支持扩张，但不能验证品类规模。估值所需的关键证据是已确认收入、毛利率、硬件与卡带附加、复购行为、退货、支持成本和队列留存。在这些数据出现前，市场逻辑只支持一个具有平台选择权的聚焦高端细分市场，不支持量化的大众市场结果。
            claimRefs:
