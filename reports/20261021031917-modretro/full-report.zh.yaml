  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 产品证据和平台覆盖广度被不完整的财务证据与发布风险抵消，因此结论是观察，而不是认可某一价格。
    data:
      nodes:
        - id: product-proof
          label: 独立产品证据
        - id: platform-breadth
          label: Chromatic、卡带与 M64
        - id: capital-anchor
          label: 据报道的 $1B 估值与 $164M 融资
        - id: evidence-deficit
          label: 没有经过审计的收入、利润率或安全条款
        - id: execution-risk
          label: M64 更新与兼容性风险
        - id: recommendation
          label: 观察；要求价格和证据重置
      edges:
        - from: product-proof
          to: platform-breadth
        - from: platform-breadth
          to: capital-anchor
        - from: capital-anchor
          to: evidence-deficit
        - from: evidence-deficit
          to: execution-risk
        - from: execution-risk
          to: recommendation
    approximationNotes: 流程是定性的，不表示数值权重、概率或估值桥接关系。
    claimRefs:
