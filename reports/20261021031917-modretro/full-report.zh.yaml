        title: 资本结构、规模与披露质量
        blocks:
          - type: paragraph
            body: >-
              公开资本结构证据是概况中最薄弱的一环。一篇低信誉二手文章称融资追踪机构列出 $111.63 million 的 Series A-1，投后估值为 $1
              billion，但已审阅资料没有公司公告、监管文件或具名投资者确认。应把这些数字视为据报道的指标，而非经验证的融资事实。留存证据没有披露收入、毛利率、现金、烧钱速度、客户数、销量或员工数。唯一的规模描述是创始人称团队很小，不能替代带日期的员工数量。尽调应优先取得主要融资文件、经审计运营数据以及股权结构和治理材料。
            claimRefs:
