              SKU 看，财务模式容易理解，但公开信息不足以评估收入质量和利润率持久性。投资尽调应在依赖估值或产品热度之前，要求银行证据、月度管理账、库存账龄、渠道应收款、退货、保修成本和产品级毛利桥接。
