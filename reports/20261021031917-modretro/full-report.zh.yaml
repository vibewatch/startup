  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 复古游戏中的窄众高端市场
        blocks:
          - type: paragraph
            body: >-
              相关市场不是全部电子游戏、全部掌机，甚至也不是全部复古模拟。ModRetro 销售面向原版实体卡带的定制 FPGA 硬件、相关配件和新生产卡带；Chromatic 聚焦 Game Boy 与 Game Boy
              Color，ModRetro 64 则扩展到 Nintendo 64。这一边界包含高端硬件、实体介质保存、授权重发版、新复古格式游戏和部分配件，但排除通用移动游戏、低价软件模拟掌机、以 ROM
              为主的多系统设备、二手原版主机及更广泛的新世代游戏支出。差异化在于还原度、实体所有权和低摩擦使用，而不是目录广度或最低价格。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
