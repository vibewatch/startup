companyProfile:
  summary: >-
    ModRetro 是一家位于尔湾的私营消费电子公司，正在商业化基于 FPGA 的高端复古游戏硬件与实体介质。产品组合已从聚焦 Game Boy 和 Game Boy Color 的 Chromatic 掌机扩展到聚焦
    Nintendo 64 的 ModRetro 64，并配套卡带、配件及发行合作。独立评测验证了产品的实际质量，但公司的规模、经济性、治理与融资条款仍披露不足。
