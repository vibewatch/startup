          - type: paragraph
            body: >-
              精确的乐观、基准和悲观估值区间会制造虚假精确，因为分母指标和证券条款缺失。只有管理层证明售罄可重复、硬件和卡带毛利率持久、退货与支持负担较低且 M64 执行成功，乐观情景才足以重新审视据报道的 $1
              billion
              锚点。基准情景仍是观察：产品质量可见，但收入持久性和所有权经济性不可见。若发布需要反复修复、库存吞噬融资，或细分市场无法维持高端价格，悲观情景可能是低价轮或减值。情景概率只能在数据室审阅后设定；目前里程碑信号比数字概率或回报倍数更可靠。
            claimRefs:
              - CV003
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: 决策路径、退出准备度与投资逻辑破坏触发器
        blocks:
          - type: paragraph
            body: >-
              建议为观察，置信度中等，风险高，估值立场偏高。M64 把平台扩展到家用主机，但 PCMag
              的试生产评测发现更新摩擦并报告了明显的兼容性尾部，使发布质量成为近期验证点而非已完成里程碑。没有公开证据支持目标持有期、退出估值或流动性路径。投资前应取得 2026 年 5
              月融资文件、完全稀释资本结构、优先股堆叠、按产品划分的经审计月度收入和毛利率、渠道库存、退货、保修与支持成本、卡带附加率及 M64
              售罄数据。投资逻辑破坏触发器包括明显低于据报道估值的定价轮、无法解决发布缺陷、无盈利附加支撑的持续折价，或融资被用于积累库存而非可重复需求。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV011
              - CV014
              - CV016
      - number: '8.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 继续观察，不要按 headline 估值定价
            body: 只有当主要融资条款和产品级经济性能够把据报道的估值锚点转换为明确的所有权和回报计算时，才重新开启投资决策。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV016
          - type: callout
            title: 发布执行是最近可观察的催化剂
            body: M64 定价可见，但在更广平台逻辑获得估值认可前，兼容性和更新执行必须改善。
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
