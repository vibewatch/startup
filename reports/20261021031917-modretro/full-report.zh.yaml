            body: >-
              ModRetro 的公开商业面向显示出多种交易型收入，而不是经常性订阅：高端主机、独立手柄、单款实体游戏、多游戏套装以及未来重制版或新知识产权。M64 据报道售价 $229，早鸟价为 $199，手柄据报道售价
              $89.99。官方商店列出单款 M64 卡带 $49.99，四款发行套装
              $179.99。公司还称直接资助独立开发者并与大型工作室合作，说明内容收入可能同时承担开发或发行承诺及制造成本。这些是标价和机制，不是实际平均售价、净收入或利润率的证据。
