      - number: '2.2'
        title: 规模代理指标能识别买家，但不足以支撑可靠的 TAM
        blocks:
          - type: paragraph
            body: >-
              现有来源提供了有用的边界标志，却没有经审计的品类规模。Nintendo 历史上超过 100 million 台 Game Boy 说明遗留装机基础庞大，但累计出货不等于活跃用户、卡带持有者或当前年度支出。$199
              的 Chromatic、$300 的高端屏幕选项和 $199 至 $229 的 ModRetro 64 定价说明了消费预算层级，却没有说明销量或市场价值。$1 billion
              投后估值同样只是融资数据，不是可触达需求的衡量。更可信的买家群体包括实体卡带持有者、怀旧驱动的 Game Boy 或 N64 用户、重视还原度的 FPGA 爱好者和收藏者。可信的 SAM
              需要按平台和地区统计活跃卡带持有者；SOM 还需要 ModRetro 的售罄、退货、渠道组合、附加率和复购队列数据。
