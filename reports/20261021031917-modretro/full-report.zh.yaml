      - number: '1.3'
        title: 里程碑与产品扩张
        blocks:
          - type: paragraph
            body: >-
              当前运营路径扩张很快，但仍处早期。Chromatic 于 2024 年 6 月公布，当年晚些时候上市并售罄，2025 年 7 月补货，同时扩大游戏与配件生态。独立评测称赞其做工和卡带还原度。到 2026
              年，ModRetro 已列出家用主机 ModRetro 64，PCMag 也测试了试生产机。这证明了产品线扩张能力，但 PCMag 同时遇到不可靠的 Wi-Fi
              更新，并指出多项承诺功能要在发布后实现。因此里程碑支持其发货能力，却仍把发布执行和持续支持质量留作尽调问题。
