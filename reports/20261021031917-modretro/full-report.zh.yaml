  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合比高端 FPGA 复刻机更广。Analogue 是直接同业：Pocket 面向高端掌机买家，Analogue 3D 则对应与 M64 相同的原版卡带 N64 场景。原版 Nintendo
              硬件仍是真实性基准和现状替代品，但老化硬件与现代显示摩擦会推动替换产品。另一端的低价软件模拟掌机和 DIY
              模拟器栈以硬件级还原度换取更广目录和更低价格。主流主机属于相邻娱乐替代品而非近似产品。由于原版卡带可在原版硬件和多个复刻机上使用，买家无需迁移专有内容库即可多平台使用；实际锁定主要限于配件、固件偏好和各厂商新发布的游戏。
            claimRefs:
              - CP011
              - CP014
              - CP015
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP011
              - CP014
