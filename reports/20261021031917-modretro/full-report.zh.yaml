  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 按证据加权的排序区分了已观察到的预生产故障，以及因缺少一手尽调记录而仍无法判断发生可能性的重大风险。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 基于已审阅证据的范围，而不是全机队概率。
        - id: impact
          label: 影响
          detail: 对发布执行或投资结果的潜在影响。
        - id: mitigation
          label: 缓解成熟度
          detail: 公开证据显示的缓解措施状态。
        - id: residual
          label: 剩余严重性
          detail: 已披露缓解措施之后仍剩余的暴露。
      rows:
        - label: ModRetro 64 兼容性
