      - number: '4.2'
        title: 市场进入动作与公开市场验证代理指标
        blocks:
          - type: paragraph
            body: >-
              Chromatic 历史发布把直接预订与 GameStop 分销结合，并在首版硬件中捆绑实体 Tetris
              卡带。当前证据还显示产品从掌机扩展到家用主机，并形成实体游戏目录。独立评测者接触过两代硬件，这比单纯路线图更能证明产品存在，但不能替代售罄、退货、复购或渠道组合数据。留存来源没有提供获客成本、销售周期、渠道利润、批发折扣或回本周期。尽调应把分销广度和已评测产品视为
              市场验证的代理指标，而不是量化商业表现。
