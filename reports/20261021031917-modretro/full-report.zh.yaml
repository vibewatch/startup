              - CP014
              - CP016
      - number: '3.2'
        title: 掌机取舍偏向专注而非广度
        blocks:
          - type: paragraph
            body: >-
              Chromatic 的可守住的掌机定位是专业化。它在原生分辨率屏幕上运行实体 Game Boy 和 Game Boy Color 卡带，而已审阅证据始终把它视为有意限制的产品，不是多系统平台。Analogue
              Pocket 基础价格更高，却增加了原生 Game Boy Advance 支持、存档状态、底座选项和覆盖其他系统的 openFPGA 社区库。独立评测认可 Chromatic
              的做工，但对比仍显示，重视目录广度的买家更适合 Analogue。ModRetro 必须守住清晰的还原度和实体介质优势；逐项比拼功能反而会侵蚀 Chromatic 的专注定位。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: M64 进入真实的产品成熟度竞争
        blocks:
          - type: paragraph
            body: >-
              M64 在评测价和早鸟价上都低于 Analogue 3D，但价格不是唯一购买标准。PCMag 试生产测试认为它是可信的 4K
              卡带主机，且开发姿态开放，同时记录了更新问题、不够成熟的界面和不完整的游戏兼容性。ModRetro 的技术披露还指出浮点、RSP 和 TLB
              工作尚未完成，使发布质量成为可量化的竞争风险。开源固件和核心可能吸引开发者并随时间改善系统，但这种期权价值不能抹去在位产品当前的易用优势。关键尽调指标是发布后重大问题游戏数量和承诺功能积压下降的速度。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
      - number: '3.4'
        title: 护城河能否持久取决于生态执行
        blocks:
          - type: paragraph
            body: >-
              ModRetro 打造的不只是可互换硬件：它规划并发售实体卡带，与 homebrew 开发者合作，还能用设备感知的默认展示把硬件与自有发行活动连接起来。GameStop
              的零售曝光也把发现渠道扩展到爱好者直销之外。这些优势可能相互强化，但尚未证明能形成高切换成本。卡带互通让硬件替换容易，Analogue
              保有更广平台覆盖，开源既能扩散技术学习，也能吸引贡献者。因此护城河取决于执行：差异化工业设计、可靠发布、有吸引力的实体目录和持续开发者参与。没有售罄、附加率或复购数据，公开证据无法证明该生态已形成持久的分销或内容飞轮。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP012
              - CP013
              - CP015
              - CP016
