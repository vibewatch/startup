              卡带、手柄和现代显示器。新实体游戏、配件、卡带更新和流媒体功能把产品从设备扩展为受管理的实体介质生态。该范围在战略上连贯，但也使兼容性、固件支持、授权内容供给和配件执行成为核心产品的一部分，而不是可选邻接业务。
