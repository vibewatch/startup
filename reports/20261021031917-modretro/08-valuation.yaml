schemaVersion: "report-v2"
artifact: valuation
slug: modretro
runDate: 2026-10-21
company:
  name: ModRetro
chapter:
  number: 8
  title: Valuation
  summary: >-
    ModRetro has credible product proof, a widening hardware-and-cartridge strategy, and
    substantial reported financing, but public evidence does not support underwriting the
    reported $1 billion valuation. The recommendation is track, with high risk and a
    stretched valuation stance until primary financing terms and audited operating metrics
    permit explicit return analysis.
sections:
  - id: financing-context
    title: Financing context and the limits of the public mark
    body: >-
      The only retained valuation dataset reports a $1 billion valuation from December 2024,
      $145.2 million of equity financing against a $150 million offering in May 2026, and
      $164 million raised across two rounds. That dataset also says the May disclosure did
      not establish whether the earlier $1 billion mark was achieved. These are financing
      references, not proof of current enterprise value, cash available, revenue scale, or
      liquidation economics. No retained source supplies audited revenue, gross margin,
      inventory turns, working-capital needs, cap-table ownership, liquidation preferences,
      or fully diluted share count. The reported mark therefore functions only as an entry
      anchor; it cannot support an intrinsic valuation, ownership calculation, or target
      return. A new investor should treat current price discovery as incomplete rather than
      infer value from capital raised.
    claimRefs: [CV001, CV002, CV003, CV004, CV016]
    tableRefs: [TV001]
  - id: thesis-and-price-discipline
    title: Thesis, anti-thesis, and entry discipline
    body: >-
      The investable thesis is broader than one nostalgic device. ModRetro describes
      Chromatic as the first step in a physical console-and-cartridge strategy, its investor
      describes a vertically integrated consumer-electronics platform, and independent
      reviewers document strong build quality and an expanding M64 proposition. Current
      store pricing places transparent Chromatic bundles at $149.99 and the M64 at $229.99,
      while a September 2026 comparison frames the Chromatic as narrower than the more
      versatile Analogue Pocket. This supports differentiated product appeal but not venture
      scale. The anti-thesis is that premium hardware remains a narrow, episodic category
      with inventory, support, and launch risk. Entry discipline should require primary
      financing documents plus cohort-level economics before accepting any price near the
      reported $1 billion mark.
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios
    title: Evidence-constrained scenarios
    body: >-
      Precise bull, base, and bear valuation ranges would be false precision because the
      denominator metrics and security terms are absent. The bull case can justify revisiting
      the reported $1 billion anchor only if management demonstrates repeatable sell-through,
      durable hardware and cartridge gross margins, low return and support burdens, and
      successful M64 execution. The base case remains track: product quality is visible, but
      revenue durability and ownership economics are not. The bear case is a down-round or
      impairment outcome if launches require repeated fixes, inventory absorbs financing,
      or the niche cannot sustain premium pricing. Scenario probabilities should be assigned
      only after data-room review; today, milestone signals are more defensible than numeric
      probabilities or return multiples.
    claimRefs: [CV003, CV009, CV011, CV012, CV013, CV016]
    tableRefs: [TV003]
  - id: decision-and-diligence
    title: Decision path, exit readiness, and thesis-break triggers
    body: >-
      The recommendation is track, with medium confidence, high risk, and a stretched
      valuation stance. The M64 extends the platform into home consoles, but PCMag's
      pre-production review found update friction and reported a meaningful compatibility
      tail, making launch quality a near-term proof point rather than a completed milestone.
      No public evidence supports a target holding period, exit valuation, or liquidity
      route. Before investment, obtain the May 2026 financing documents, fully diluted
      capitalization, preference stack, audited monthly revenue and gross margin by product,
      channel inventory, returns, warranty and support costs, cartridge attach rates, and
      M64 sell-through. Thesis-break triggers are a priced round materially below the
      reported mark, failure to resolve launch defects, sustained discounting without
      profitable attach, or evidence that financing is funding inventory accumulation rather
      than repeatable demand.
    claimRefs: [CV002, CV003, CV006, CV010, CV011, CV012, CV015, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Assessment, Decision implication]
    rows:
      - [Recommendation, Track, "Do not underwrite a new entry until financing and operating evidence is available."]
      - [Confidence, Medium, "Product and pricing evidence is current, but financing evidence is secondary and financial disclosure is absent."]
      - [Risk rating, High, "Hardware launch execution, inventory exposure, and security terms remain material unknowns."]
      - [Valuation stance, Stretched, "The reported $1B mark is not supported by disclosed revenue, margin, cash-flow, or ownership data."]
      - [Return and exit, Not supportable publicly, "Set holding-period and return targets only after cap-table, preference, and operating review."]
    notes: >-
      Assessments use retained public evidence as of 2026-10-21; the $1B figure is a
      third-party financing reference, not an independent valuation conclusion.
    claimRefs: [CV001, CV002, CV003, CV004, CV011, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-based argument, What would change the view]
    rows:
      - [Thesis, "Premium construction and focused FPGA fidelity earn strong independent reviews.", "Repeat purchases and low return rates across multiple cohorts would strengthen product proof."]
      - [Thesis, "The strategy extends from Chromatic into cartridges and the M64, creating more than one product surface.", "Profitable cartridge attach and on-time M64 sell-through would validate platform breadth."]
      - [Anti-thesis, "Chromatic is narrower than a multi-system alternative, limiting utility outside GB/GBC enthusiasts.", "Broader licensed content or demonstrated pricing power could offset the narrower use case."]
      - [Anti-thesis, "M64 update and compatibility issues expose support cost and launch-quality risk.", "Stable firmware, published compatibility improvement, and low support incidence would reduce execution risk."]
    notes: >-
      Review judgments reflect product samples and public pages, not audited demand,
      retention, margin, or warranty cohorts.
    claimRefs: [CV007, CV008, CV009, CV011, CV012, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "M64 launches cleanly; hardware demand repeats; cartridges attach at attractive margins.", "Revisit the reported $1B anchor only after audited scale and security terms support a venture return.", "Premium niche remains smaller than capital base.", "Multiple sold-through cohorts with stable pricing and low returns."]
      - [Base, "Products retain enthusiast appeal, but revenue quality and launch economics remain undisclosed.", "Track without a numeric range; require a material evidence discount to the reported anchor.", "Inventory, support, and dilution are unquantified.", "Primary financing documents plus product-level contribution margin."]
      - [Bear, "Launch defects persist, discounting rises, or financing funds slow-moving inventory.", "Expect down-round or impairment risk; no public evidence supports a floor value.", "Preference overhang could magnify common-equity downside.", "Missed launch milestones, unresolved compatibility, or a priced round below the reported mark."]
    notes: >-
      These are evidence-constrained decision cases, not forecasts; numeric probabilities,
      valuation ranges, and return multiples are withheld because financial and security
      terms are not public in the retained sources.
    claimRefs: [CV003, CV005, CV006, CV009, CV011, CV012, CV013, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Product proof and platform breadth are offset by incomplete financial evidence and
      launch risk, producing a track recommendation rather than a price endorsement.
    data:
      nodes:
        - id: product-proof
          label: "Independent product proof"
        - id: platform-breadth
          label: "Chromatic, cartridges, and M64"
        - id: capital-anchor
          label: "Reported $1B mark and $164M raised"
        - id: evidence-deficit
          label: "No audited revenue, margin, or security terms"
        - id: execution-risk
          label: "M64 update and compatibility risk"
        - id: recommendation
          label: "Track; require price and evidence reset"
      edges:
        - from: product-proof
          to: platform-breadth
        - from: platform-breadth
          to: capital-anchor
        - from: capital-anchor
          to: evidence-deficit
        - from: evidence-deficit
          to: execution-risk
        - from: execution-risk
          to: recommendation
    approximationNotes: >-
      The flow is qualitative and does not imply numeric weights, probabilities, or a
      valuation bridge.
    claimRefs: [CV004, CV008, CV010, CV011, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Track, do not price from the headline mark
    body: >-
      Reopen the investment decision only when primary financing terms and product-level
      economics can convert the reported valuation anchor into explicit ownership and return
      math.
    claimRefs: [CV001, CV002, CV003, CV016]
  - calloutType: risk
    title: Launch execution is the nearest observable catalyst
    body: >-
      M64 pricing is visible, but compatibility and update execution must improve before the
      broader-platform thesis deserves valuation credit.
    claimRefs: [CV006, CV010, CV011, CV012]
