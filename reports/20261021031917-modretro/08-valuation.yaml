  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: >-
        Executed May 2026 financing documents, fully diluted capitalization, investor
        ownership, liquidation preferences, anti-dilution rights, and board rights.
      whyItMatters: >-
        Funding raised is not cash available, and headline valuation does not reveal the
        effective price or downside protection attached to a new security.
      diligencePath: >-
        Review executed stock-purchase documents, charter, investor-rights agreement,
        capitalization ledger, and board minutes in the data room.
      relatedQuestionRefs: [QV002, QV007, QV008]
    - type: private-evidence-only
      severity: material
      topic: operating-economics
      missingEvidence: >-
        Audited revenue, gross margin, contribution margin, inventory turns, returns,
        warranty and support costs, channel sell-through, and cartridge attach by cohort.
      whyItMatters: >-
        These denominators determine whether premium product appeal can produce durable cash
        economics and support any valuation or return case.
      diligencePath: >-
        Reconcile monthly management accounts to bank and fulfillment records, then test
        product and channel cohorts against invoices, returns, and inventory aging.
      relatedQuestionRefs: [QV001, QV003, QV008]
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: >-
        A management-approved liquidity plan, credible strategic buyer set, governance
        readiness, and evidence supporting a target hold period or exit multiple.
      whyItMatters: >-
        Without a plausible liquidity route, even successful product execution cannot be
        translated into an underwritten investor return.
