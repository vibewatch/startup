figures:
  - id: FE001
    title: Product architecture from physical media to support
    type: stack
    summary: >-
      ModRetro's differentiation spans physical media, FPGA recreation,
      purpose-built presentation, and an update and extensibility layer.
    data:
      layers:
        - label: Physical media
          detail: Customer-owned and newly published cartridges enter through console-specific interfaces.
          items:
            - Game Boy and Game Boy Color cartridges
            - Nintendo 64 cartridges and controllers
            - ModRetro-published physical games
        - label: Input and control interfaces
          detail: Cartridge readers and original or modern controllers preserve console-specific interaction.
          items:
            - Console-specific cartridge readers
            - Original controller support
            - Link and accessory interfaces
        - label: FPGA recreation
          detail: Console-specific FPGA cores reproduce legacy logic and timing behavior.
          items:
            - Chromatic FPGA core
            - M64 FPGA core
            - Console-specific timing logic
        - label: Memory subsystem
          detail: M64 uses PSRAM to target predictable random-access latency for its recreation core.
          items:
            - M64 PSRAM subsystem
            - Memory controller optimization
            - Timing-sensitive data paths
        - label: Presentation and experience
          detail: Purpose-built display and modern video output present the recreated hardware behavior.
          items:
            - Chromatic custom 160x144 display
            - M64 HDMI and resolution profiles
            - Filters, controls, and accessories
        - label: Updates and extensibility
          detail: Firmware delivery and open-design commitments determine whether compatibility improves over time.
          items:
            - Firmware and cartridge updates
            - Wi-Fi or microSD delivery
            - Open-source code and design assets
    approximationNotes: "Conceptual stack only; layer order does not imply measured latency, cost, maturity, or ownership boundaries."
    claimRefs: [CE001, CE002, CE005, CE006, CE011, CE013, CE014]
callouts:
  - calloutType: strength
    title: Technical candor improves diligence quality
    body: >-
      ModRetro's M64 engineering disclosure names concrete accuracy defects and
      memory-performance limits rather than presenting FPGA use as automatic
      proof of fidelity.
    claimRefs: [CE007, CE008, CE009, CE010]
  - calloutType: risk
    title: M64 maturity depends on post-disclosure execution
    body: >-
      Pre-production update failures, unresolved compatibility cases, and
      roadmap-dependent features create a meaningful gap between architectural
      potential and launch-ready reliability.
    claimRefs: [CE011, CE012]
