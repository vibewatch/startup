company:
  name: ModRetro
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    ModRetro has built a coherent cartridge-first product system around FPGA
    hardware recreation, premium physical design, and new physical software.
    The Chromatic has credible hands-on validation, while the pre-launch M64
    still carries disclosed core-accuracy, compatibility, and update-readiness
    risks that make its technical differentiation promising but not yet proven
    at production scale.
sections:
  - id: product-system-and-user-workflow
    title: Product system and user workflow
    body: >-
      ModRetro's product thesis is narrower than a general emulation platform:
      customers use original cartridges in purpose-built hardware designed
      around one legacy console family. The Chromatic addresses Game Boy and
      Game Boy Color owners with a custom-resolution handheld, while the M64
      extends the model to Nintendo 64 cartridges, controllers, and modern
      displays. New physical games, accessories, cartridge updates, and
      streaming features broaden the offer from a device into a managed
      physical-media ecosystem. That scope is strategically coherent, but it
      also makes compatibility, firmware support, licensed-content supply, and
      accessory execution part of the core product rather than optional
      adjacency.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: architecture-and-technical-differentiation
    title: Architecture and technical differentiation
    body: >-
      The central technical mechanism is FPGA-based hardware recreation rather
      than a broad software-emulation layer. For M64, the disclosed design uses
      low-latency PSRAM to make random memory access more predictable, an
      architecture intended to reproduce timing-sensitive N64 behavior. The
      same engineering disclosure is unusually candid about unfinished work:
      memory performance is below architectural potential, floating-point
      timing is wrong, the RSP dual pipeline is serialized, and inherited TLB
      shortcuts remain. Open-source commitments can improve inspectability and
      practitioner participation, but they do not by themselves establish
      accuracy, compatibility, or completion at launch.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE010, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-support
    title: Maturity, deployment, and support
    body: >-
      Chromatic has meaningful external product proof: reviewers tested original
      cartridges, praised its physical execution, and documented field-upgrade
      capability. M64 evidence is earlier and more conditional. A pre-production
      review observed Wi-Fi update failures that required a microSD workaround,
      while compatibility reporting still included games with minor and major
      issues. Several user-facing capabilities were scheduled for later updates.
      These findings do not negate the hardware thesis, but they shift the
      underwriting question from whether the design is differentiated to
      whether ModRetro can close core bugs, ship updates reliably, and support a
      fragmented legacy library after launch.
    claimRefs: [CE011, CE012, CE013, CE014]
  - id: trust-quality-and-evidence-limits
    title: Trust, quality controls, and evidence limits
    body: >-
      Public evidence is strongest on industrial design and emulation
      architecture, not operational controls. The reviewed material does not
      disclose a security program, privacy treatment for connected features,
      independent quality certification, incident history, service levels, or a
      public status surface. The evidence base also contains low-reputation
      pages that conflate ModRetro with a generic multi-console software
      platform and inconsistent history; those pages are not usable as
      technical validation. Investment underwriting therefore needs production
      compatibility logs, return and defect data, firmware release telemetry,
      repository activity, vulnerability handling, and supply-chain quality
      records before treating the product stack as mature.
    claimRefs: [CE015, CE016]
