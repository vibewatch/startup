    type: matrix
    summary: >-
      Evidence-weighted ranking separates observed pre-production failures from material
      risks whose likelihood remains unknown because primary diligence records are absent.
    data:
      columns:
        - id: likelihood
          label: Likelihood
          detail: Based on the scope of reviewed evidence, not a fleet-wide probability.
        - id: impact
          label: Impact
          detail: Potential effect on launch execution or investment outcome.
        - id: mitigation
          label: Mitigation maturity
          detail: Publicly evidenced mitigation status.
        - id: residual
          label: Residual severity
          detail: Exposure remaining after disclosed mitigations.
      rows:
        - label: ModRetro 64 compatibility
          note: Pre-production evidence; post-launch defect rates are not available.
          values:
            - value: High in reviewed build
            - value: High
            - value: In progress
            - value: High
        - label: Firmware update reliability
          note: Wi-Fi failure was observed by one independent reviewer.
          values:
            - value: High in reviewed unit
            - value: High
            - value: Workaround only
            - value: Medium-high
        - label: Feature-delivery execution
          note: Several capabilities were described as post-release commitments.
          values:
            - value: Medium
            - value: Medium-high
            - value: Roadmap only
            - value: Medium-high
        - label: Financial and valuation exposure
          note: Financing discussions were unconfirmed and public revenue was undisclosed.
          values:
            - value: Medium
            - value: High
            - value: Not evidenced
            - value: High
        - label: IP and legal exposure
          note: Management described process controls, but no independent legal opinion was allocated.
          values:
            - value: Unknown
            - value: High
            - value: Partially described
            - value: Unquantified
        - label: Supply and channel concentration
          note: Supplier shares, inventory commitments, and channel mix are undisclosed.
          values:
            - value: Unknown
            - value: High
            - value: Not evidenced
            - value: Unquantified
    approximationNotes: >-
      Categorical ratings are analyst judgments anchored to cited facts and explicit gaps;
      they are not numerical probabilities or incident-rate estimates.
    claimRefs: [CR001, CR003, CR006, CR007, CR008, CR011, CR012, CR013, CR014, CR015]
callouts:
  - calloutType: risk
    title: Investment gating condition
    body: >-
      Do not treat launch shipment as de-risking. Require stable compatibility and update
      metrics, verified legal and compliance files, audited unit economics, and quantified
      supplier and channel concentration before underwriting scale or valuation.
    claimRefs: [CR001, CR003, CR007, CR008, CR013, CR014]
