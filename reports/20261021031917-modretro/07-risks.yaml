    claimRefs: [CR007, CR010, CR011, CR014, CR015]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Observed evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitoring indicator or kill criterion
    rows:
      - - ModRetro 64 compatibility shortfall
        - PCMag reported 23 major-issue and 23 minor-issue North American releases based on company-confirmed counts.
        - High in the reviewed pre-production build
        - High
        - In progress
        - High until post-launch validation
        - Kill if major incompatibilities persist across a representative launch cohort after the committed remediation window.
      - - Firmware update failure
        - PCMag experienced repeated Wi-Fi update problems and used microSD instead.
        - High in one reviewed pre-production unit
        - High
        - Workaround exists
        - Medium-high
        - Require update-success telemetry and recovery testing; kill if failed updates or bricked units exceed the approved threshold.
      - - Feature-delivery slippage
        - PCMag listed notifications, video processing, filters, menu audio, and adapters as post-release commitments.
        - Medium
        - Medium-high
        - Roadmap only
        - Medium-high
        - Track committed dates and attach rates; pause follow-on funding after repeated material roadmap misses.
      - - Cartridge-read and support burden
        - PCMag observed a black screen when a cartridge did not read, while GamesBeat described one launch-era game that required a restart.
        - Medium
        - Medium
        - Limited diagnostic UX
        - Medium
        - Review return, warranty, unreadable-cartridge, and support-ticket rates by hardware and firmware cohort.
    notes: >-
      Severity is an underwriting assessment tied to the cited observations; likelihood
      qualifiers preserve the pre-production or anecdotal scope rather than extrapolating fleet-wide rates.
    claimRefs: [CR007, CR008, CR009, CR010, CR012]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or surface
      - Role and concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Legacy cartridge and IP ecosystem
        - Nintendo-origin formats and rights holders
        - Chromatic is limited to Game Boy and Game Boy Color cartridges; current legal and license concentration is not disclosed.
        - Rights dispute, licensing gap, or constrained catalog weakens the hardware and publishing proposition.
        - High
        - Black-box BIOS work and licensed physical releases are described, but outside legal evidence is missing.
        - Medium-high
      - - FPGA, component, and manufacturing chain
        - AMD partnership for ModRetro 64; Mexico assembly for Chromatic
        - PCMag described an AMD FPGA partnership; GamesBeat reported Mexico assembly, but no supplier shares or second-source plan.
        - Component shortage, tariff change, yield issue, or sole-source failure delays units and compresses margin.
        - High
        - Investor material describes vertical integration; no independent redundancy proof was allocated.
        - High
      - - Premium demand and retail availability
        - Direct sales, GameStop, and nostalgia-focused buyers
        - GamesBeat reported a sold-out debut followed by a larger restock; Grey Journal described only one shipped product at the time of its article.
        - Demand normalizes after launch, stock availability oscillates, or channel inventory obscures sell-through.
        - Medium-high
        - Direct sales and a larger restock broaden access, but cohort retention and channel mix are undisclosed.
        - Medium-high
    notes: >-
      Concentration percentages, supplier shares, inventory commitments, and retailer
      sell-through are unavailable; rows identify dependency surfaces rather than quantified exposure.
    claimRefs: [CR002, CR004, CR005, CR011, CR012, CR013, CR014, CR016]
figures:
