company:
  name: ModRetro
chapter:
  number: 7
  title: Risks
  summary: >-
    ModRetro's clearest near-term risk is execution: an independent pre-production review
    found update failures, incomplete features, and material game-compatibility gaps in the
    ModRetro 64. The larger underwriting problem is evidence scarcity around revenue,
    compliance, concentration, and supply-chain resilience while third parties report
    financing discussions at a $1 billion valuation.
sections:
  - id: underwriting-posture
    title: Underwriting posture and severity ranking
    body: >-
      Risk is concentrated in execution and evidence quality rather than in a documented
      regulatory action. PCMag's pre-production ModRetro 64 testing observed failed Wi-Fi
      updates, 23 North American releases with major issues, another 23 with minor issues,
      and several promised features that were not yet available. Those findings make
      software readiness and compatibility the highest residual exposures because they
      affect the company's second hardware platform at launch. Financial exposure is also
      high: Grey Journal reported unconfirmed financing discussions at a $1 billion
      valuation while stating that only one product had reached market and no revenue
      figures were disclosed. The heatmap therefore distinguishes observed product
      failures from legal, safety, privacy, and concentration questions for which the
      assigned public evidence is incomplete.
    claimRefs: [CR001, CR002, CR003, CR007, CR008, CR009]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, regulatory, and compliance uncertainty
    body: >-
      The reviewed sources do not establish a lawsuit, enforcement action, recall, breach,
      or safety incident, and that absence in a bounded source pool is not evidence that
      none exists. GamesBeat reported management's account that ModRetro reviewed expired
      Game Boy patents and used black-box reverse engineering for its BIOS; this is a
      mitigation narrative, not an independent freedom-to-operate opinion. Connected
      firmware updates, streaming, physical cartridges, and reliance on legacy Nintendo
      ecosystems create IP, privacy, security, and product-compliance diligence needs.
      The company should provide outside-counsel analysis, license schedules, privacy and
      security controls, applicable product certifications, recall history, and open
      claims. Until those primary records are reviewed, residual legal exposure remains
      unquantified rather than presumed low.
    claimRefs: [CR007, CR010, CR011, CR014, CR015]
    tableRefs: [TR001]
  - id: operational-readiness
    title: Operational, quality, and launch readiness
    body: >-
      The ModRetro 64 review provides direct adverse evidence from a pre-production unit.
      PCMag could not reliably update over Wi-Fi and used a microSD card instead; it also
      reported 23 major-issue and 23 minor-issue titles among North American releases,
      plus a black screen when a cartridge failed to read. The same review described
      notifications, enhanced video processing, additional filters, menu audio, and
      lag-free adapters as post-release commitments. These may improve before or after
      launch, but the current evidence makes schedule, firmware quality, and support load
      monitorable risks. The key release gate is not shipment alone: compatibility,
      update success, return rates, support tickets, and promised-feature delivery should
      meet agreed thresholds over a representative installed base.
    claimRefs: [CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Dependencies, financial exposure, and thesis-break triggers
    body: >-
      ModRetro depends on legacy cartridges and IP, specialist FPGA hardware, physical
      manufacturing, and a premium nostalgia buyer. GamesBeat reported that Chromatic
      sold out before a larger restock and that assembly occurs in Mexico, while management
      expressed hope rather than certainty that the location would remain tariff-safe.
      Valor, an investor, describes a vertically integrated alternative to China-dependent
      hardware, but that relationship makes the statement partner evidence rather than
      independent supply-chain verification. A thesis break should occur if ModRetro 64
      major incompatibilities persist after launch, promised features materially slip,
      returns or support costs exceed plan, legal review identifies blocking IP exposure,
      or audited unit economics cannot support the valuation and working-capital burden.
      Investment should remain conditional on revenue, margin, burn, inventory, supplier,
      retailer, and concentration data.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR012, CR013, CR014, CR016]
    tableRefs: [TR003]
