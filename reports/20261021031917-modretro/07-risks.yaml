      missingEvidence: Current certifications, privacy and security controls, incident logs, recall records, product-liability claims, regulator correspondence, and independent legal opinions.
      whyItMatters: These records determine whether connected consumer hardware and legacy-platform dependencies create hidden legal, security, safety, or launch blockers.
      diligencePath: Obtain management's compliance data room and outside-counsel materials, then independently verify records with the relevant certification bodies, courts, and regulators.
