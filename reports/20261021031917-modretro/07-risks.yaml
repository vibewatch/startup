      topic: concentration
      missingEvidence: Supplier shares, second-source coverage, retailer and customer concentration, inventory commitments, sell-through, warranty claims, returns, and support costs by product cohort.
      whyItMatters: Without denominators and concentration data, public product availability and review evidence cannot quantify working-capital, channel, or service exposure.
      diligencePath: Review supplier BOM and contracts, channel inventory reports, cohort sell-through, warranty dashboards, return reasons, and support tickets under NDA.
