companyProfile:
  summary: >-
    ModRetro is a private Irvine consumer-electronics company commercializing premium FPGA-based retro-gaming hardware
    and physical media. Its portfolio has expanded from the Game Boy and Game Boy Color-focused Chromatic handheld into
    the Nintendo 64-focused ModRetro 64, supported by cartridges, accessories, and publishing partnerships. Independent
    reviews validate tangible product quality, while the company's scale, economics, governance, and financing terms
    remain insufficiently disclosed.
  founders:
    - name: Palmer Luckey
      role: Founder and product originator
      background: Started the original ModRetro forum as a teenager and describes long-running work on Game Boy hardware.
      claimRefs:
        - CO002
  foundedDate: null
