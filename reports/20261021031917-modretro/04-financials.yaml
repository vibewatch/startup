schemaVersion: "report-v2"
artifact: financials
slug: modretro
runDate: 2026-10-21
company:
  name: ModRetro
chapter:
  number: 4
  title: Financials
  summary: >-
    ModRetro has a visible premium-hardware and physical-content monetization model,
    with separate console, controller, cartridge, and bundle price points. Public
    evidence does not disclose recognized revenue, gross margin, cash, burn, runway,
    or attachment economics, so capital adequacy and revenue quality remain material
    underwriting gaps.
sections:
  - id: revenue-model
    title: Revenue model and pricing architecture
    body: >-
      ModRetro's public commercial surface points to several transaction-based revenue
      streams rather than a recurring subscription model: premium consoles, separate
      controllers, individual physical games, multi-game bundles, and future remasters
      or new intellectual property. The M64 has been reported at $229, with a $199
      early-bird offer, while its controller was reported at $89.99. The official
      storefront displays individual M64 cartridges at $49.99 and a four-title release
      bundle at $179.99. The company also says it directly funds indie developers and
      partners with larger studios, suggesting that content revenue may carry
      development or publishing commitments as well as manufacturing costs. These are
      list prices and stated mechanisms, not evidence of realized average selling
      price, net revenue, or margin.
    claimRefs: [CI001, CI002, CI003, CI004, CI009, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: go-to-market-and-traction
    title: Go-to-market motion and public traction proxies
    body: >-
      The historical Chromatic launch combined direct preorder availability with
      GameStop distribution, and bundled a physical Tetris cartridge with first-edition
      hardware. Current evidence also shows a portfolio expansion from a handheld into
      a home console and a catalog of physical games. Independent reviewers have handled
      both generations of hardware, which is stronger evidence of product existence than
      a roadmap alone, but it is not a substitute for sell-through, return, reorder, or
      channel-mix data. No retained source supplies customer-acquisition cost, sales
      cycle, channel margin, wholesale discount, or payback period. Diligence should
      therefore treat distribution breadth and reviewed products as traction proxies,
      not as quantified commercial performance.
    claimRefs: [CI004, CI005, CI006, CI010, CI013, CI014]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit-economics constraints
    body: >-
      The disclosed product design indicates a hardware cost base that includes custom
      displays, metal enclosures, FPGA components, a premium printed circuit board,
      physical media, fulfillment, and support. The company characterizes the M64 board
      as unusually expensive and describes direct funding of some game development;
      those statements identify likely cost drivers but do not quantify bill of
      materials, royalty shares, inventory exposure, warranty reserves, or gross margin.
      A pre-production review also found wireless-update friction and incomplete
      compatibility, which could translate into support effort or returns if not
      resolved. The correct underwriting posture is to request cohort-level contribution
      economics rather than infer margin from premium pricing.
    claimRefs: [CI003, CI007, CI008, CI013, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Reporting that ModRetro was seeking financing at a $1 billion valuation establishes
      a valuation discussion, not the amount raised, cash received, or cash still
      available. The reviewed evidence provides no current cash balance, operating burn,
      debt schedule, inventory financing, runway, or next-round trigger. That distinction
      is especially important for a company simultaneously expanding hardware, funding
      physical software, and supporting firmware and compatibility work. The financial
      model is understandable at the SKU level, but revenue quality and margin durability
      are not underwritable from public information. Investment diligence should require
      bank evidence, monthly management accounts, inventory aging, channel receivables,
      returns, warranty costs, and product-level gross-margin bridges before relying on
      valuation or product enthusiasm.
    claimRefs: [CI011, CI012, CI016]
callouts:
  - calloutType: risk
    title: Valuation is not liquidity
    body: >-
      A reported $1 billion financing valuation does not establish funding proceeds,
      cash on hand, or runway; all three remain undisclosed in the retained evidence.
    claimRefs: [CI011, CI012]
  - calloutType: recommendation
    title: Underwrite from contribution margin
    body: >-
      Require product-level net revenue, landed cost, returns, warranty and channel
      deductions before assigning value to the visible premium list prices.
    claimRefs: [CI012, CI013, CI014, CI016]
