    notes: >-
      Prices are public list or reported launch prices as of the cited pages; they are
      not recognized revenue, realized ASP, or gross margin, and no unit volumes are public.
    claimRefs: [CI001, CI002, CI003, CI004, CI009, CI015]
  - id: TI002
    title: Pricing and monetization observations
    columns: [Offer, Public price, Included or excluded, Pricing evidence, Main uncertainty]
    rows:
      - [M64 standard offer, "$229", "Console; official page says customers may bring their own controller", "Independent review plus official configuration language", "Current realized price and promotions"]
      - [M64 early-bird offer, "$199", "Console configuration not fully detailed in review", "Independent review", "Quantity, duration and discount cost"]
      - [M64 Pro Controller, "$89.99", "Separate controller", "Two independent publications", "Attach rate and margin"]
      - [Individual M64 game, "$49.99", "One physical cartridge", "Official storefront", "Publisher share, manufacturing cost and returns"]
      - [M64 release bundle, "$179.99", "Four named physical titles", "Official storefront", "Bundle mix and cannibalization"]
      - [Chromatic historical base offer, "$199 reported in 2024", "Handheld plus first-edition Tetris bundle", "Independent review and company launch post", "Not evidence of current realized pricing"]
    notes: >-
      Values mix current M64 list prices with a historical Chromatic launch price; no
      source discloses wholesale pricing, discounts, taxes, freight, refunds, or net ASP.
    claimRefs: [CI001, CI002, CI004, CI006, CI009, CI010, CI015]
  - id: TI003
    title: Unit economics and capital-adequacy ledger
    columns: [Metric, Public value, Confidence, Why it matters, Required diligence evidence]
    rows:
      - [Recognized revenue, null, Low, "Establishes scale and revenue quality", "Monthly revenue by SKU, channel and geography"]
      - [Gross margin, null, Low, "Tests whether premium pricing covers premium hardware and content costs", "Landed COGS, royalties, freight, returns and warranty by SKU"]
      - [Customer acquisition cost and payback, null, Low, "Tests efficiency of direct and retail distribution", "Spend, attributed customers, contribution margin and cohort payback"]
      - [Controller and game attach rates, null, Low, "Determines lifetime contribution beyond console sale", "Order-level cohorts and attachment by channel"]
      - ["Cash, burn and runway", null, Low, "Determines financing dependency", "Bank statements, cash bridge, monthly burn and board-approved plan"]
      - [Inventory and working capital, null, Low, "Hardware and cartridges can consume cash before sell-through", "Inventory aging, purchase commitments, receivables and channel terms"]
      - [Support and compatibility burden, "Pre-production update and compatibility issues reported", Medium, "May affect returns, warranty and support cost", "Tickets, return reasons, defect rates and warranty reserves"]
    notes: >-
      Null means the metric is unavailable in the assigned public evidence, not zero;
      each row specifies the private evidence needed to close the underwriting gap.
    claimRefs: [CI003, CI007, CI008, CI011, CI012, CI013, CI014, CI016]
figures:
  - id: FI001
    title: Publicly visible revenue model bridge
    type: flow
    summary: >-
      Public price points show several paths into gross sales, but recognition, cost,
      returns and gross profit remain undisclosed.
    data:
      nodes:
        - id: buyer-demand
          label: Collector and retro-player demand
          detail: Demand is visible through reviewed products, but buyer counts and cohorts are unavailable.
        - id: hardware-sale
          label: Console sale
          value: "$229 reported / $199 early-bird"
          detail: List price is not realized net revenue.
        - id: controller-attach
          label: Controller attachment
          value: "$89.99 reported"
          detail: Attachment rate is unavailable.
        - id: cartridge-attach
          label: Physical game attachment
          value: "$49.99 each / $179.99 bundle"
          detail: Unit mix and publisher economics are unavailable.
        - id: recognized-revenue
          label: Recognized net revenue
          value: Unavailable
          detail: Discounts, returns, channel deductions and recognition policy are not disclosed.
        - id: product-costs
          label: Product and content costs
          value: Unavailable
          detail: FPGA, PCB, enclosure, cartridge, royalty, fulfillment and support costs are not quantified.
        - id: gross-profit
          label: Gross profit
          value: Unavailable
          detail: No public gross-margin bridge supports a numerical value.
      edges:
        - source: buyer-demand
          target: hardware-sale
        - source: buyer-demand
          target: controller-attach
        - source: buyer-demand
          target: cartridge-attach
        - source: hardware-sale
          target: recognized-revenue
        - source: controller-attach
          target: recognized-revenue
        - source: cartridge-attach
          target: recognized-revenue
        - source: recognized-revenue
          target: product-costs
        - source: product-costs
          target: gross-profit
    approximationNotes: >-
      This is a mechanism map, not a quantified waterfall; unavailable values must not
      be interpreted as zero and the arrows do not assert accounting recognition timing.
    claimRefs: [CI003, CI008, CI015, CI016]
