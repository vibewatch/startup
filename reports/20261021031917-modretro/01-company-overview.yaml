company:
  name: ModRetro
chapter:
  number: 1
  title: Company Overview
  summary: >-
    ModRetro is a private Irvine consumer-electronics company built around premium
    FPGA-based retro-gaming hardware and physical games. Public evidence supports a
    2023 incorporation, an operating leadership trio, and expansion from Chromatic
    into the ModRetro 64, but financing, governance, revenue, customer, and headcount
    disclosures remain too thin for a fully verified scale assessment.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      ModRetro is an Irvine-based private consumer-electronics company whose public
      proposition combines purpose-built FPGA hardware with physical cartridges,
      accessories, and licensed or newly developed games. The official storefront
      currently lists Chromatic bundles across multiple materials and colors and
      lists the ModRetro 64, showing that the company has moved beyond a single
      handheld into a broader retro-hardware catalog. The commercial model therefore
      appears to mix hardware sales, recurring game releases, and accessories rather
      than software subscriptions. GamesBeat reports that the present company was
      incorporated in 2023; the older ModRetro name originated as Palmer Luckey's
      teenage hardware-hacking forum, so the brand history is longer than the current
      corporate entity.
    claimRefs: [CO001, CO002, CO003, CO004, CO006, CO011]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and stakeholder dependence
    body: >-
      Valor Equity Partners' profile names Palmer Luckey, chief executive Torin
      Herndon, and chief financial officer Sam Ecker as the visible leadership team.
      Public materials provide unusually strong evidence of founder-product fit:
      Luckey describes nearly two decades of Game Boy hardware work, while Herndon
      told GamesBeat that he translated Luckey's product concept into Chromatic.
      That same evidence creates key-person concentration risk because product vision
      and technical execution are publicly tied to two individuals. The reviewed
      sources do not disclose a complete board, voting rights, investor protections,
      leadership-change history, or succession plan; the table is therefore a
      partial public roster, not a governance census.
    claimRefs: [CO002, CO005, CO016]
    tableRefs: [TO002, TO003]
  - id: milestones-and-product-expansion
    title: Milestones and product expansion
    body: >-
      The current operating arc is rapid but still early. Chromatic was announced in
      June 2024, debuted and sold out late that year, and returned to stock in July
      2025 with a larger game and accessory ecosystem. Independent reviews praised
      its build quality and cartridge fidelity. By 2026, ModRetro was listing the
      home-console ModRetro 64, and PCMag had tested a pre-production unit. This
      sequence demonstrates product-line expansion, but PCMag also encountered
      unreliable Wi-Fi updating and described several promised post-release
      functions. The milestone record therefore supports shipping capability while
      leaving launch execution and ongoing support quality as active diligence
      questions.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    figureRefs: [FO001]
  - id: capitalization-scale-and-disclosure
    title: Capitalization, scale, and disclosure quality
    body: >-
      Public capitalization evidence is the weakest part of the overview. One
      low-reputation secondary article says financing trackers list a $111.63 million
      Series A-1 at a $1 billion post-money valuation, but the reviewed pool contains
      no company announcement, filing, or named-investor confirmation for those
      figures. They should be treated as reported indicators rather than verified
      financing facts. Revenue, gross margin, cash, burn, customer count, unit sales,
      and numeric headcount are not disclosed in the retained evidence. The only
      scale language is the founder's description of a very small team, which cannot
      substitute for a dated employee count. Diligence should therefore prioritize
      primary financing documents, audited operating data, and a cap-table and
      governance package.
    claimRefs: [CO014, CO015, CO016]
