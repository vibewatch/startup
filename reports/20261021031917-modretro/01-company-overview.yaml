callouts:
  - calloutType: strength
    title: Founder-product fit is unusually visible
    body: >-
      The founder's documented history in hardware modification and the CEO's role
      translating that vision into Chromatic support authentic domain commitment,
      even though they also create concentration risk.
    claimRefs: [CO002, CO016]
  - calloutType: risk
    title: Financing and governance remain unverified
    body: >-
      The reported Series A-1 and valuation rely on one low-reputation secondary
      source, while board composition, ownership, investor rights, and financial
      scale remain absent from the retained evidence.
    claimRefs: [CO014, CO015]
