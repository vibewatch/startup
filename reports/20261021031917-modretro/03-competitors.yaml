company:
  name: ModRetro
chapter:
  number: 3
  title: Competitors
  summary: >-
    ModRetro competes most directly with Analogue across both handheld and Nintendo 64
    FPGA hardware, using lower entry pricing, physical-media publishing, and a narrower
    authenticity proposition against Analogue's broader platform scope. That position is
    credible but not yet durable: shared cartridge compatibility limits lock-in, while
    current M64 compatibility and update gaps leave room for the more polished incumbent.
sections:
  - id: landscape-and-buyer-alternatives
    title: Landscape and buyer alternatives
    body: >-
      The competitive set is wider than premium FPGA replicas. Analogue is the direct peer:
      Pocket addresses the premium handheld buyer, while Analogue 3D addresses the same
      original-cartridge N64 use case as M64. Original Nintendo hardware remains the
      authenticity benchmark and a status-quo substitute, although aging hardware and
      modern-display friction motivate replacement products. At the other end, inexpensive
      software-emulation handhelds and do-it-yourself emulator stacks trade hardware-level
      fidelity for broader libraries and lower prices. Mainstream consoles are adjacent
      entertainment substitutes rather than close product peers. Because original cartridges
      work across original hardware and multiple replicas, buyers can multi-home without
      moving a proprietary content library; the practical lock-in is therefore limited to
      accessories, firmware preferences, and each vendor's newly published games.
    claimRefs:
      - CP011
      - CP014
      - CP015
      - CP013
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: handheld-tradeoffs
    title: Handheld tradeoffs favor focus versus breadth
    body: >-
      Chromatic's defensible handheld angle is specialization. It plays physical Game Boy
      and Game Boy Color cartridges on a native-resolution display, while the reviewed
      evidence consistently treats the product as deliberately limited rather than a
      multi-system platform. Analogue Pocket asks a higher base price but adds native Game
      Boy Advance support, save-state and dock options, and a community openFPGA library
      spanning additional systems. Independent review evidence is favorable to Chromatic's
      build quality, yet the comparison still makes Analogue the stronger choice for buyers
      who value library breadth. ModRetro must therefore preserve a visible fidelity and
      physical-media advantage; competing feature-for-feature would erode the very focus
      that distinguishes Chromatic.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP010
      - CP016
    tableRefs:
      - TP002
  - id: home-console-contest
    title: M64 enters a live product-readiness contest
    body: >-
      M64 undercuts Analogue 3D at both the reviewed list and early-bird prices, but price is
      not the only purchase criterion. PCMag's pre-production testing found a credible 4K
      cartridge console and open development posture, while also documenting update problems,
      a less polished interface, and incomplete game compatibility. ModRetro's own technical
      disclosure identified unfinished floating-point, RSP, and TLB work, making launch quality
      a measurable competitive risk rather than a generic execution concern. Open-source
      firmware and cores could attract developers and improve the system over time, but that
      option value does not erase the incumbent's current ease-of-use advantage. The decisive
      diligence metric is the pace at which the major-issue game count and promised-feature
      backlog decline after launch.
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP016
    tableRefs:
      - TP003
  - id: moat-and-displacement
    title: Moat durability depends on ecosystem execution
    body: >-
      ModRetro is building more than interchangeable hardware: it plans and ships physical
      cartridges, works with homebrew developers, and can use device-aware presentation
      defaults to connect hardware with owned publishing activity. Retail exposure through
      GameStop also broadens discovery beyond enthusiast direct sales. Those advantages are
      potentially reinforcing, but none is yet proven to create high switching costs.
      Cartridge interoperability makes hardware replacement easy, Analogue retains broader
      platform coverage, and open sourcing can diffuse technical learning as well as attract
      contributors. The moat is therefore execution-based: differentiated industrial design,
      reliable launches, a compelling physical catalog, and sustained developer participation.
      Without sell-through, attach-rate, or repeat-purchase data, public evidence cannot show
      that this ecosystem has become a durable distribution or content flywheel.
    claimRefs:
      - CP006
      - CP007
      - CP009
      - CP012
      - CP013
      - CP015
      - CP016
