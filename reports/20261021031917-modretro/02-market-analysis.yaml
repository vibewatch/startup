    columns: ["Segment", "Buyer", "User", "Payer", "Workflow / budget owner", "Adoption trigger or constraint"]
    rows:
      - ["Game Boy and Game Boy Color cartridge owners", "Collector or returning player", "Same individual or household", "Consumer", "Discretionary entertainment / collectibles budget", "Pixel fidelity and cartridge compatibility; constrained by GB/GBC-only scope"]
      - ["N64 cartridge owners", "Collector or nostalgia-led household", "Individual, family, or local multiplayer group", "Consumer household", "Living-room gaming / collectibles budget", "Modern display support and physical cartridges; constrained by launch execution and compatibility"]
      - ["FPGA fidelity enthusiasts", "Technically informed retro-gaming enthusiast", "Same individual", "Consumer", "Premium hobby-electronics budget", "Hardware-level accuracy and low latency; compares breadth, price, and update quality"]
      - ["Nostalgia-led former owners", "Former Game Boy or N64 user", "Returning casual player", "Consumer", "Discretionary entertainment budget", "Familiar physical experience and simple setup; constrained by price and substitute convenience"]
      - ["Classic-IP owners and indie developers", "Rights holder or developer selecting a publishing route", "End consumer plays the cartridge", "Consumer ultimately funds purchases; commercial terms are undisclosed", "Publishing and licensing decision", "Higher-value physical release opportunity; constrained by unknown royalty, volume, and attach economics"]
    notes: >-
      Segments are evidence-backed hypotheses, not measured cohorts; budget ownership,
      conversion rates, and segment sizes require transaction and customer research.
    claimRefs: [CM004, CM005, CM007, CM008, CM009, CM010, CM011, CM016]
figures:
  - id: "FM001"
    title: "Evidence-bounded addressability pyramid"
    type: "pyramid"
    summary: >-
      The evidence narrows from broad retro interest toward ModRetro demand, but only one
      historical installed-base proxy is quantified and no layer is a measured TAM or funnel.
    data:
      items:
        - label: "Broad retro-gaming interest"
          value: "Unquantified"
          detail: "Too broad for ModRetro because it includes software emulation and unrelated gaming spend."
        - label: "Historical Game Boy ownership"
          value: ">100M devices"
          detail: "Cumulative historical shipment proxy, not a count of current buyers."
        - label: "Active physical-cartridge owners"
          value: "Unquantified"
          detail: "Relevant installed media base; active ownership by platform and geography is unavailable."
        - label: "Premium authenticity buyers"
          value: "Unquantified"
          detail: "Observed product prices indicate willingness to pay, but volume and elasticity are unavailable."
        - label: "Cross-platform ModRetro prospects"
          value: "Unquantified"
          detail: "Chromatic and ModRetro 64 address distinct legacy-platform cohorts with unknown overlap."
        - label: "Captured ModRetro customers"
          value: "Unquantified"
          detail: "Units, revenue, channel mix, attach, returns, and repeat purchasing are undisclosed."
    approximationNotes: >-
      Conceptual hierarchy only; layer widths are not proportional, the >100M figure is a
      historical device proxy, and product price points are intentionally excluded from layer
      values because they do not measure audience size.
    claimRefs: [CM003, CM007, CM010, CM015, CM016]
