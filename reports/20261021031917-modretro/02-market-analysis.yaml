company:
  name: "ModRetro"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    ModRetro addresses a premium, physical-media subset of retro gaming rather than the
    whole games market. The reviewed evidence supports buyer and price segmentation, but
    not a credible TAM, SAM, or SOM because active cartridge ownership, category spending,
    ModRetro unit volume, revenue, channel mix, and repeat purchasing remain undisclosed.
sections:
  - id: "market-boundary"
    title: "A narrow premium market inside retro gaming"
    body: >-
      The relevant market is not all video games, all handhelds, or even all retro
      emulation. ModRetro sells purpose-built FPGA hardware for original physical
      cartridges, related accessories, and newly manufactured cartridges, with the
      Chromatic focused on Game Boy and Game Boy Color and the ModRetro 64 extending the
      model to Nintendo 64. That boundary includes premium hardware, physical-media
      preservation, licensed reissues and new retro-format games, and selected accessories.
      It excludes general-purpose mobile gaming, inexpensive software-emulation handhelds,
      ROM-first multi-system devices, original used consoles, and broader current-generation
      gaming spend. The differentiation is fidelity, tangible ownership, and low-friction
      use rather than catalog breadth or lowest price. An independent review praised the
      Chromatic's cartridge fidelity while identifying its GB/GBC-only scope and lack of a
      rechargeable battery as constraints. A comparison source also places FPGA handhelds
      above budget emulation devices, reinforcing that ModRetro competes for a narrower
      willingness-to-pay cohort rather than mass-market handheld demand.
    claimRefs: [CM001, CM002, CM004, CM005, CM009, CM012, CM016]
    tableRefs: [TM001]
  - id: "sizing-and-buyers"
    title: "Sizing proxies identify buyers, not a defensible TAM"
    body: >-
      The available sources provide useful boundary markers but no audited category size.
      Nintendo's more than 100 million historical Game Boy units indicate a large legacy
      installed base, yet cumulative shipments are not active users, cartridge owners, or
      current annual spend. The $199 Chromatic price, $300 premium-screen option, and
      $199-to-$229 ModRetro 64 pricing show the consumer budget tier; they do not reveal
      volume or market value. ModRetro's $1 billion post-money valuation is likewise a
      financing datum based on company-submitted incorporation records, not a measure of
      addressable demand. The best-supported buyer groups are physical-cartridge owners,
      nostalgia-led former Game Boy or N64 users, fidelity-focused FPGA enthusiasts, and
      collectors attracted to hardware, colorways, accessories, and physical releases.
      Buyers generally also use and pay for the device, while classic-IP owners and indie
      developers are supply-side partners whose content can improve hardware utility. A
      credible SAM requires active cartridge-owner counts by platform and geography; SOM
      additionally requires ModRetro sell-through, returns, channel mix, attach rates, and
      repeat-purchase cohorts.
    claimRefs: [CM003, CM007, CM008, CM010, CM013, CM015, CM016]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001]
  - id: "drivers-constraints-and-valuation"
    title: "Adoption depends on authenticity overcoming price and execution friction"
    body: >-
      Adoption is driven by a recognizable legacy installed base, original-cartridge
      compatibility, premium industrial design, and a content strategy that combines
      reissues with new physical games. Restocking and accessories broaden the offer, while
      expansion from Chromatic to ModRetro 64 can reuse the physical-media and FPGA thesis
      across another collector cohort. The constraints are equally material: a $199-plus
      purchase competes with original hardware, phones, inexpensive emulation handhelds,
      and broader multi-system FPGA products; the Chromatic's narrow compatibility limits
      utility for buyers seeking Game Boy Advance or multiple platforms. PCMag's
      pre-production ModRetro 64 review found update friction and incomplete promised
      features, making firmware delivery and cartridge compatibility part of the adoption
      decision. Product enthusiasm and capital can fund expansion, but neither validates
      category scale. For valuation, the decisive evidence is therefore commercial:
      recognized revenue, gross margin, hardware and cartridge attach, reorder behavior,
      returns, support cost, and cohort retention. Until those data are available, the
      market case supports a focused premium niche with platform optionality, not a
      quantified mass-market outcome.
    claimRefs: [CM003, CM005, CM006, CM009, CM010, CM011, CM013, CM014, CM015, CM016]
callouts:
  - calloutType: "risk"
    title: "Do not convert financing value into market size"
    body: >-
      Forge's $1 billion post-money figure and TechCrunch's earlier report of fundraising
      discussions describe investor pricing, while the assigned evidence contains no
      independent TAM, category revenue, or ModRetro sell-through estimate.
    claimRefs: [CM013, CM014, CM015]
