company:
  name: ModRetro
chapter:
  number: 6
  title: Customers
  summary: >-
    ModRetro's public customer evidence points to a premium enthusiast base split
    between handheld cartridge players and living-room N64 players, with recurring
    retail reach through GameStop and strong hands-on product reviews. The evidence
    does not quantify retention, repeat purchase, channel mix, or customer
    concentration, so durability remains an important underwriting gap.
sections:
  - id: customer-segments
    title: Customer segments and purchase jobs
    body: >-
      The clearest segmentation is by play context and collection: Chromatic serves
      owners of Game Boy and Game Boy Color cartridges who value faithful portable
      play, while M64 serves Nintendo 64 cartridge owners seeking a modern
      living-room experience. Independent reviews consistently frame Chromatic as a
      premium, intentionally narrow product rather than a general-purpose emulation
      handheld. Current direct pricing reinforces that premium ladder: on the run
      date, ModRetro listed transparent Chromatic bundles at $149.99, standard-color
      bundles from $199.99, and M64 hardware at $229.99. Within those categories,
      the evidence suggests distinct collector, preservationist, gift, and
      enthusiast use cases, but it does not disclose segment size, geography,
      acquisition cost, revenue contribution, or payer-versus-user differences.
      The segment map is therefore qualitative rather than a measured customer
      census.
    claimRefs: [CU001, CU002, CU004, CU010]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption signals and named proof
    body: >-
      Public adoption evidence is directional but credible enough to show a
      functioning market rather than only a concept. The First Edition Chromatic
      sold out before a permanent restock in July 2025, and ModRetro's launch
      messaging explicitly directed buyers to preorder or shop at GameStop. The
      channel relationship persisted across generations: GameStop carried an
      exclusive Chromatic colorway and later an exclusive Smoke M64 bundle.
      Independent hands-on evidence is also positive. XDA rated Chromatic 9/10 and
      praised the focused cartridge experience, while ModRetro's own storefront
      displays named testimonials emphasizing build, display, nostalgia, and repeat
      use. Those testimonials are useful voice-of-customer examples but remain
      company-curated, with no disclosed sampling, moderation, or verification
      method. None of these signals provides unit sales, active users, reorder
      rates, attach rates, or a comparable cohort denominator.
    claimRefs: [CU003, CU005, CU006, CU011, CU012, CU013, CU014]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The customer thesis depends on ModRetro converting nostalgia-led hardware
      purchases into a durable physical-games and accessories ecosystem, but public
      evidence does not yet demonstrate that loop quantitatively. Product maturity
      is one friction point. PCMag's pre-production M64 review reported repeated
      Wi-Fi update failures, and ModRetro separately acknowledged that the M64
      PSRAM implementation was operating at roughly half of architectural
      potential before launch. PCMag also relayed a mixed compatibility count,
      including titles with minor and major issues. These disclosures do not prove
      elevated returns or churn, but they identify support and update execution as
      measurable renewal risks. More importantly, the assigned evidence contains no
      NRR, GRR, churn, cohort retention, repeat-purchase rate, customer
      concentration, or direct-versus-retail revenue mix. The recurring GameStop
      relationship expands reach while also creating an unquantified channel
      dependency.
    claimRefs: [CU007, CU008, CU009, CU015, CU016]
callouts:
  - calloutType: risk
    title: Customer durability is not publicly measurable
    body: >-
      Sell-outs, restocks, reviews, and retail exclusives demonstrate interest, but
      they do not establish repeat purchase, retention, profitable acquisition, or
      low channel concentration.
    claimRefs: [CU005, CU007, CU015, CU016]
