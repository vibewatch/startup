    title: Evidence-based customer journey and expansion surfaces
    type: journey-map
    summary: >-
      Public evidence supports the touchpoints and intended expansion surfaces,
      but not conversion rates or customer movement between stages.
    data:
      nodes:
        - id: discover
          label: Discover through nostalgia
          detail: Reviews, retro-gaming coverage, and physical retail create awareness.
          touchpoints:
            - Independent media
            - GameStop
        - id: evaluate
          label: Evaluate authenticity
          detail: Buyers compare cartridge support, display fidelity, build, and price.
          touchpoints:
            - Hands-on reviews
            - Product pages
        - id: purchase
          label: Buy hardware
          detail: Hardware is sold directly and through selected GameStop exclusives.
          touchpoints:
            - ModRetro storefront
            - GameStop
        - id: activate
          label: Play physical cartridges
          detail: Chromatic and M64 address handheld and living-room cartridge libraries.
          touchpoints:
            - Chromatic
            - M64
        - id: attach
          label: Add games and accessories
          detail: Physical releases, cables, controllers, and variants create attach opportunities.
          touchpoints:
            - Physical games
            - Accessories
        - id: expand
          label: Expand within the ecosystem
          detail: New hardware families and limited variants can prompt another purchase.
          touchpoints:
            - M64 upgrade path
            - Limited colorways
    approximationNotes: >-
      Ordered touchpoints are analytical, not a measured funnel; no conversion,
      repeat-purchase, or retention rates are publicly disclosed.
    claimRefs: [CU002, CU003, CU004, CU011, CU012, CU013]
