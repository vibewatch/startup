    - IPO market for SaaS security was subdued in 2024; IPO delay would lock capital at 25× ARR with no liquidity
  - - Unit economics
    - CEO confirmed reasonable burn rate; $546M total raised provides multi-year runway without additional dilution
    - No public disclosure of NDR, gross margins, or operating loss magnitude; financial opacity is a diligence risk
