summary:
  headline: |
    Abnormal Security 是企业邮件安全中最清晰的 AI-native 颠覆故事：
    ARR 增长 100%，企业客户 2,800+，并获得 Gartner Magic Quadrant Vision
    领导者位置，独立分析师验证也站得住。$5.1B Series D 估值约 25× ARR，
    相比上市网络安全同行（11–15× ARR）偏高；但如果公司能在目标 Q4 2025 IPO
    前维持 70%+ ARR 增长，这一估值仍可辩护。主要风险是 Microsoft Defender
    零边际成本捆绑威胁，以及增长放缓后的倍数压缩。适合能在尽调中拿到 NDR
    和利润率披露的成熟投资人，结论为 **有条件买入**。
