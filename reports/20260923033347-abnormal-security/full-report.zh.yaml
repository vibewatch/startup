chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >
              Abnormal Security 自 2025 年 4 月起以 Abnormal AI 名义运营，是一家 AI 原生网络安全公司，总部位于加州旧金山。公司成立于 2018
              年，切入企业邮件安全中的专业细分市场：它不把邮件流量导入网关、再过滤已知恶意签名，而是通过 API
              连接云邮件系统，摄取发件人历史、通信模式、语言语气、关系图谱等数千个行为信号，并为每个租户建立正常人类行为的基线。当邮件或操作明显偏离这些基线，平台就识别复杂的
              BEC、供应商冒充欺诈、账户接管，以及绕过传统安全邮件网关（SEG）的零日社会工程攻击。


              核心产品与 Microsoft 365 和 Google Workspace 原生集成，并已扩展覆盖协作平台（Slack、Zoom）、CRM（Salesforce）、ITSM（ServiceNow）和 HR
              系统（Workday）。商业模式是 SaaS 订阅，按邮箱或席位收费，以多年期企业合约为主，并辅以专业服务。部署采取 API 优先，无需修改 MX
              记录，数分钟可完成，降低企业概念验证（PoC）摩擦。扩张收入来自新增模块（账户接管保护、安全态势管理）以及向现有邮件安全客户交叉销售更广泛的 SaaS 应用覆盖。
            claimRefs:
              - CO001
              - CO002
              - CO003
