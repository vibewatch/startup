figures:
  - id: FO001
    title: 产品演进与能力时间线
    type: timeline
    summary: 这条产品里程碑线从 2018 年 API 发布延伸到 2025 年自主 AI 智能体，展示 Abnormal 平台如何从邮件安全扩展到完整 SaaS 行为 AI 防护。
    data:
      items:
        - date: '2018'
          label: API 原生邮件安全平台发布
          detail: 行为 AI 按租户建立通信基线；无需改 MX 记录
          tone: positive
        - date: '2021'
          label: 新增 BEC 与账号接管模块
          detail: 平台从入站邮件扩展到账号攻陷检测
          tone: positive
        - date: '2022'
          label: SaaS 应用覆盖：Slack、Salesforce、Workday、Zoom
          detail: 人类行为 AI 扩展到协作和 CRM 平台
          tone: positive
        - date: '2023'
          label: 推出安全态势管理
          detail: 在被利用前主动发现高风险 M365 配置错误
          tone: positive
        - date: '2024'
          label: SOC 自动化与投递后自动补救
          detail: 实时分诊并补救用户上报的钓鱼邮件；声称 SOC 负担降低 95%
          tone: positive
        - date: 2025-04
          label: 品牌改为 Abnormal AI；推出 AI Phishing Coach 与 AI Data Analyst 智能体
          detail: 自主智能体取代通用安全培训；自动生成董事会可用风险报告
          tone: positive
        - date: '2025'
          label: 加深 API 集成并扩展生态
          detail: SaaS 覆盖更深；开发者生态扩展到企业技术栈各处
          tone: positive
        - date: '2025'
          label: Microsoft 365 配置错误检测引擎
          detail: 攻击者可利用前，主动发现云环境弱点
          tone: positive
        - date: '2025'
          label: 完整 SOC 工作流自动化能力
          detail: 端到端分诊和补救，替代分析师手工工作流
          tone: positive
        - date: '2025'
          label: AI 驱动的个性化安全意识培训
          detail: 基于上下文的辅导取代通用钓鱼模拟
          tone: positive
        - date: '2025'
          label: 即时生成董事会可用风险报告
          detail: AI Data Analyst 智能体自主生成高管仪表盘
          tone: positive
        - date: '2026'
          label: 预期 IPO 并进一步扩展平台
          detail: IPO 前产品广度已覆盖邮件、SaaS 和 SOC 自动化
          tone: neutral
