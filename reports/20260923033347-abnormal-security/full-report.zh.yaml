      - number: '1.4'
        title: 商业规模与封面指标
        blocks:
          - type: paragraph
            body: >
              截至 2024 年 8 月 Series D 公告，Abnormal Security 的 ARR 已超过 $200 million，较此前 $100 million 水平约同比增长
              100%。公司在融资时报告企业客户 2,400+；跟踪活跃部署的第三方数据提供商显示，到 2024 年底该数字接近 3,000–3,200，覆盖 35+ 个国家。Fortune 500 渗透率约 17%，即约
              85 家公司；部分来源称最高达 20%。2024 年员工数大约增长 70%，至约 1,000 人，办公室位于 San Francisco（HQ）、Austin、New York、London
              以及新兴亚太市场。NRR 和毛利率未公开披露，但企业 SaaS 邮件安全同业通常做到 110–130% NRR 和 70–80% 毛利率；考虑 Abnormal 的 API
              架构和较低单客户基础设施成本，估计其大致处于类似区间。
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.5'
        title: 关键里程碑与战略方向
        blocks:
          - type: paragraph
            body: >
              从 2018 年两人创始团队到 2024 年估值 $5.1 billion，Abnormal 走的是纪律性强的构建—衡量—迭代路径。公司首批企业客户验证了 API-行为-AI
              的产品市场匹配；连续融资支持地域扩张，并把产品从核心邮件扩展到更多场景。2024 年 Gartner Magic Quadrant 认可 Abnormal 为领导者，并在首版 Email Security
              Platforms 报告中列为愿景完整性最靠右的厂商；这与客户满意度评分（Gartner Peer Insights 4.8/5）一起巩固了行业分析师背书。2025 年 4 月更名为 Abnormal
              AI，并推出自主 AI 智能体（AI Phishing Coach、AI Data Analyst），显示平台正从被动检测演进到 AI 编排的安全运营，把总可用市场从邮件扩展到完整 SOC 自动化。2024
              年初任命有 IPO 经验的 CFO 和 CLO，表明管理层和董事会瞄准 2025–2026 年窗口登陆公开市场，但仍取决于宏观条件。
            claimRefs:
              - CO001
              - CO002
              - CO003
