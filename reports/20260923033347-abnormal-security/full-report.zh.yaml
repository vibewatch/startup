    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
    rows:
      - - 架构护城河
        - API 原生 Behavior Engine 按组织建立基线，切换成本更持久；无需改 MX 记录
        - Microsoft Defender for Office 365 Plan 2 为 E3/E5 许可用户捆绑 AI 威胁检测，不增加额外成本
      - - 市场位置
        - 2024 年 Gartner MQ 愿景领导者；在首份邮件安全 MQ 中，愿景完整性位置最靠右
        - 平台厂商扩张安全栈，纯邮件安全赛道正在整合
      - - 增长速度
        - 2023–2024 年 ARR 增长 100%，Series D 时拥有 2,400+ 企业客户，Fortune 500 渗透率 17%
        - 客户基础成熟叠加 2025 年竞争加剧，增长很可能降至 60% 以下
      - - 竞争护城河
        - 还没有直接同业在 Abnormal 这个规模和检测保真度上复制 API 原生行为 AI
        - CrowdStrike Falcon for Email、Sublime Security 等正在缩小技术和销售落地差距
      - - 退出路径
        - CEO 给出的现实路径是 Q4 2025 IPO；Wellington 背书显示机构相信近期有流动性
        - 2024 年 SaaS 安全 IPO 市场低迷；若 IPO 延后，资金会以 25× ARR 被锁住且没有流动性
      - - 单位经济模型
        - CEO 确认烧钱速度合理；累计融资 $546M 可提供多年现金跑道，无需新增稀释
        - NDR、毛利率、经营亏损规模均未公开披露；财务不透明是尽调风险
    claimRefs:
