companyProfile:
  summary: |
    Abnormal Security 是一家总部位于旧金山的网络安全公司，由 Evan Reiser（CEO）和 Sanjay Jeyakumar（CTO）于 2018 年创立，两人都曾任职 Twitter
    和 TellApart。公司打造了一套 API 原生平台，无需修改 MX 记录即可直连 Microsoft 365 和 Google Workspace，并用自研 Behavior Engine
    为正常通信模式建立基线，识别 AI 生成钓鱼、商务电子邮件入侵（BEC）和账户接管攻击。2024 年 8 月，Abnormal 完成 Wellington
    Management 领投的 $250 million Series D，估值 $5.1 billion，累计融资达到 $546 million。Series D 完成时，ARR 已超过
    $200 million，约为上一年的两倍；企业客户 2,400+，覆盖 17% 的 Fortune 500。到 2024 年底，客户数增至 2,800+，Fortune 500
    渗透率达 20%。2025 年 4 月，公司更名为 Abnormal AI，表明平台正从邮件扩展到所有云应用。公司在 2024 年 Forbes Cloud 100
    中排名第 #46。
