              - CO002
      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              Abnormal Security 由 Evan Reiser（CEO）和 Sanjay Jeyakumar（CTO）共同创办，两人都曾是 Twitter 和 TellApart
              工程师，在那里搭建过大规模机器学习系统。Reiser 在 Twitter 做行为建模，分析数十亿个信号来发现异常活动；这直接塑造了 Abnormal 的产品判断：邮件攻击利用人的行为，要防住它们，就需要 AI
              深入理解组织内每名员工、每个供应商以及每组租户关系里的“正常”是什么。


              潜在 IPO 前，管理层已补强。Michael DeCesare（前 Forescout CEO）加入担任总裁，负责商业化运营。Smita Sanadhya 此前任 Okta CFO，也曾在 Microsoft
              和 HP 担任财务高管，2024 年初被任命为 CFO。Jeff True（前 Zoom 和 Palo Alto Networks 总法律顾问）同期出任 CLO。Kevin Moore 任首席营收官，Mike
              Britton 任 CISO，Lisa Wallace 任首席人力官。Series D 完成后，董事会包括 Greylock Partners（Asheem Chandna、Saam
              Motamedi）、Menlo Ventures（Venky Ganesan）、Insight Partners（Stephen Ward）和 Wellington Management（Rob
              Mazzoni）的投资方代表。


              关键人物风险集中在 CEO Reiser 身上：他的愿景和技术可信度支撑公司的市场定位。经验丰富的 CFO 留任，以及董事会中有 IPO 经验的成员，能在一定程度上缓解继任风险。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              Abnormal Security 通过四轮主要股权融资累计融资 $546 million。早期 Series A 于 2020 年完成，随后 2021 年 $50 million Series B 支持 API
              原生平台建设。公司在 2022 年 5 月 Series C 前越过 $100 million ARR；该轮由 CrowdStrike Falcon Fund 领投，Greylock 和 Menlo 参投，以
              $4 billion 投前估值融资 $210 million。2024 年 8 月，Abnormal 完成 Wellington Management 领投的 $250 million Series
              D；Wellington 是经常提前布局 IPO 候选公司的跨阶段基金；该轮估值 $5.1 billion，隐含募资时约 25x ARR 倍数。CrowdStrike Falcon Fund
              多轮参投，显示两家公司检测生态存在战略协同。公司未公开披露重大老股交易或可转债，也未报告任何信贷额度。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
