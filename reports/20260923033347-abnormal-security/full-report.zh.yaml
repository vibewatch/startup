  - id: FE001
    title: 平台架构流程 — 从 API 集成到检测
    type: flow
    summary: 流程图，展示 Abnormal Security 如何通过 API 接入企业协作平台、处理行为信号，并交付自动化威胁处置。
    data:
      nodes:
        - id: m365
          label: Microsoft 365 / Google Workspace
          detail: 来源：邮件 + 认证 + 日历 + 身份 API
        - id: saas-apps
          label: SaaS 应用
          detail: Slack、Zoom、Salesforce、ServiceNow、Workday 等 SaaS 应用
        - id: api-layer
          label: 一键式 API 集成层
          detail: 只读 OAuth；无需改 MX；<1 小时完成设置
        - id: signal-ingestion
          label: 信号摄取（约 45,000/身份）
          detail: 通信模式、认证事件、应用活动、文件访问
        - id: behavior-engine
          label: Abnormal 行为引擎
          detail: GNN + NLP + LLM 集成模型；按身份建立基线
        - id: knowledge-bases
          label: 知识库
          detail: PeopleBase、VendorBase、AppBase、ThreatBase 等知识库
        - id: detection
          label: 行为异常检测
          detail: 实时识别相对基线的偏离；置信度评分
        - id: remediation
          label: 自动化处置
          detail: 通过 M365 API 隔离；向 SOC 告警并附 AI 解释
        - id: soc-integrations
          label: SOC 集成（SIEM/SOAR/XDR）
          detail: Splunk、Sentinel、CrowdStrike Falcon、XSOAR 等 SOC 集成
      edges:
        - from: m365
          to: api-layer
          label: 只读 OAuth
        - from: saas-apps
          to: api-layer
          label: 按应用 API
        - from: api-layer
          to: signal-ingestion
          label: 事件流
        - from: signal-ingestion
          to: behavior-engine
          label: 特征向量
        - from: knowledge-bases
          to: behavior-engine
          label: 上下文增强
        - from: behavior-engine
          to: detection
          label: 异常分数
        - from: detection
          to: remediation
          label: 高置信度触发
        - from: remediation
          to: soc-integrations
          label: 告警 + 上下文
    claimRefs:
      - CE001
      - CE002
