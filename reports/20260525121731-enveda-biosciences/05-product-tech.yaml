chapter:
  number: 5
  title: Product & Technology
  summary: >
    Enveda's PRISM platform combines high-throughput tandem mass spectrometry (MS/MS) on Bruker timsTOF
    Pro 2 instruments with a suite of proprietary AI models — including the DreaMS transformer pre-trained
    on 201 million spectra and published in Nature Biotechnology (2025) — to navigate the >99.9% of plant
    chemistry that remains unknown to science and translate it into drug candidates at a claimed 4× faster
    pace than industry average. The platform ingests plant extracts through liquid chromatography, records
    MS/MS spectra enriched with trapped-ion-mobility collisional cross section (CCS) data, applies ML
    models for de novo structure prediction, bioactivity scoring, and ADMET filtering, then advances
    prioritized hits through wet-lab validation and clinical development. As of May 2026, the pipeline
    contains 3 clinical assets across 4 indications — ENV-294 (Phase 2a, atopic dermatitis + asthma),
    ENV-308 (Phase 1, obesity), ENV-6946 (Phase 1, IBD) — plus 6 IND-enabling assets and 17 development
    candidates. ENV-294's Phase 1b data (n=9) showed 100% EASI-50, 78% EASI-75, 56% EASI-90 response
    rates at Day 42 with no serious adverse events, a result independently described by two KOLs as
    compelling. The LOCKTAC mechanism (non-degrading molecular glue targeting a novel non-kinase
    inflammatory pathway) is the strongest platform differentiation claim. Key dependencies include
    Bruker hardware concentration, outsourced GMP manufacturing, and the inherent risk of a still-modest
    Phase 1b dataset entering pivotal studies.

sections:
  - id: SE001
    title: Platform Architecture — PRISM Technology Stack
    body: >
      Enveda's core discovery platform — internally and publicly referred to as PRISM — is a vertically
      integrated technology stack spanning physical plant libraries, high-throughput mass spectrometry,
      machine-learning models for structure and activity prediction, and a computable knowledge graph
      linking plant chemistry to human disease.

      The bottom layer is a curated physical library drawn from thousands of plant species sourced from
      biodiversity hotspots. Enveda has constructed a database of 38,000 plants cross-referenced against
      12,000 human diseases and symptoms, which guides which species are collected and prioritized for
      analysis. Biological material is processed via solvent extraction, and the resulting complex mixtures
      are separated by liquid chromatography (LC) before measurement. Critically, Enveda does not purify
      individual compounds before initial analysis — the platform is designed to operate on fractions,
      avoiding the bottleneck that has historically constrained natural-product drug discovery.

      The measurement layer uses Bruker timsTOF Pro 2 mass spectrometers, which uniquely combine
      high-resolution tandem MS/MS fragmentation with trapped ion mobility spectrometry (TIMS).
      The TIMS dimension provides a collisional cross section (CCS) value for each ion, encoding
      the three-dimensional shape of a molecule in a single number. According to a Bruker customer
      case study featuring Enveda Senior Scientist Pelle Simpson: "The timsTOF platform...performs
      well with both [acquisition rate and spectral quality] and provides a single-point encoding of
      a molecule's shape in the form of its collisional cross section (CCS), which can be utilized to
      link molecules between acquisitions even when separations are varied." This fourth dimension of
      data — mass, charge, fragmentation, and shape — is the primary hardware differentiator enabling
      Enveda's ML models to achieve higher specificity in structure inference than conventional MS-only
      approaches.

      The AI/ML layer is anchored by DreaMS (Deep Representations Empowering the Annotation of Mass
      Spectra), a transformer-based neural network pre-trained in a self-supervised fashion on the
      GeMS dataset of millions of unannotated MS/MS spectra mined from the GNPS/MassIVE repository.
      DreaMS produces 1024-dimensional molecular embeddings from raw spectra; fine-tuned versions
      achieve state-of-the-art performance on spectral similarity, chemical property prediction, and
      structure annotation tasks. The DreaMS Atlas — 201 million MS/MS spectra annotated with DreaMS
      representations — is publicly accessible. Beyond DreaMS, Enveda applies statistical deconvolution
      models to link spectra from complex fractions to individual molecular structures, followed by
      bioactivity prediction and ADMET (absorption, distribution, metabolism, excretion, toxicity)
      filtering models that together score and rank candidates. The Guild open-source tool, released
      in 2026, orchestrates protein-ligand docking pipelines (Vina, DiffDock, Boltz, KarmaDock) for
      target engagement confirmation.
