    - type: private-evidence-only
      severity: blocking
      topic: clinical-risk
      missingEvidence: "Phase 2a data for ENV-294 in atopic dermatitis and asthma from randomized, DB, PC trials — actual placebo-controlled efficacy read."
      whyItMatters: "Phase 1b n=9 open-label data cannot confirm placebo-adjusted efficacy; Phase 2 is the first controlled test of the LOCKTAC mechanism and determines pipeline value."
      diligencePath: "Monitor ClinicalTrials.gov for trial registration details and interim/final data disclosures; request trial design documentation and anticipated enrollment timelines from company."
      relatedQuestionRefs: [QE010, QE023]
      relatedTableRefs: [TE005]

