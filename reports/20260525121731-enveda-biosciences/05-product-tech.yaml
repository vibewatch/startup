  - id: SE004
    title: Science Validation and Academic Publications
    body: >
      Enveda's scientific credibility is substantially buttressed by a track record of peer-reviewed
      publications, preprints, and open-source code releases that allow independent validation of
      platform components.

      The most significant publication is the DreaMS paper in Nature Biotechnology (2025), which
      demonstrated that a self-supervised transformer trained on >1 million unannotated MS/MS spectra
      from the GNPS/MassIVE public repository produces molecular representations ("DreaMS embeddings")
      that achieve state-of-the-art performance on spectral similarity prediction, chemical property
      classification, and fluorine detection tasks. The DreaMS Atlas — a molecular network of 201
      million spectra annotated with DreaMS embeddings — is publicly available on HuggingFace.
      Pre-trained model weights are deposited on Zenodo (record 10997887). A simple web application
      on HuggingFace Spaces enables one-click spectral library matching using DreaMS embedding
      similarity. This publication is a primary-tier validation that the core ML methodology
      underlying Enveda's structure-prediction capability has independent scientific merit.

      A 2024 Journal of Natural Products paper by Domingo-Fernández et al. (all authors employed
      at Enveda) demonstrated empirically that natural products have statistically significantly
      higher rates of clinical trial success at every phase of development compared to synthetic
      compounds — a finding that validates the strategic rationale for the natural-product-first
      platform. Supporting code and data are deposited in the GitHub repository enveda/np-clinical-trials.

      A 2025 bioRxiv preprint by Enveda authors (Engler Hart, Gadiya, Kind, Healey, Allen, Colluru,
      Domingo-Fernández et al.) estimated plant chemical space by applying multiple MS-based approaches
      to data from >1,000 plant species, concluding that total plant chemical diversity likely spans
      millions of unique structures — with the vast majority unexplored. This preprint provides the
      quantitative foundation for Enveda's "99.9% of nature's chemistry is unknown" claims.

      The TIMS-Bench project (Rajkumar et al., 2026, GitHub: enveda/tims-bench) is a community
      benchmarking initiative led by Enveda scientists to establish standards for evaluating
      trapped-ion-mobility metabolomics software tools. Supporting datasets are deposited on Zenodo.
      Analytical Chemistry published (in print 2026) a computational metabolomics review co-authored
      by Enveda scientists (Domingo-Fernández, Healey, Kind, Allen, Colluru, Misra), cataloguing
      tools and databases in the field from 2021–2025. Enveda's GitHub organization (github.com/enveda)
      hosts over a dozen public repositories spanning sinusoidal embeddings, spectral library
      weighting, NMR networking, chemotaxonomy, and multi-omics analysis — all active as of May 2026.
