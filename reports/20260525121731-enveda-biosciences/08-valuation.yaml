  - id: comparables-analysis
    title: Comparable Valuation Analysis
    body: >
      The AI-drug-discovery comparable set exhibits wide valuation dispersion as of
      May 2026, reflecting the divergence between companies that have generated clinical
      proof and those that remain purely platform-stage. Recursion Pharmaceuticals
      (NASDAQ: RXRX) trades at a $1.6 billion market cap with $594 million in cash
      (December 2024, 10-K), a net loss of $463.7 million in FY2024, and an accumulated
      deficit of $1.4 billion. Its value is partially supported by over $450 million in
      historical collaboration payments and active partnerships with Sanofi, Bayer, and
      Roche/Genentech, but its first AI-discovered clinical candidate showed no reportable
      efficacy. Schrödinger (NASDAQ: SDGR) has the most defensible public valuation at
      $994 million, supported by $255.9 million in FY2025 revenue ($199.5 million from
      software licensing to all top-20 pharma companies), a diversified revenue base,
      and a cash position that implies approximately 2–3 years of runway. Relay
      Therapeutics (NASDAQ: RLAY) trades at approximately $2.9 billion, a surprisingly
      high market cap driven by clinical-stage oncology assets rather than an AI platform
      premium; its relevance to Enveda is limited. Absci (NASDAQ: ABSI) trades at
      approximately $795 million with an AI protein design platform that has limited
      clinical-stage assets as of runDate. Among private comparables, Generate:Biomedicines
      raised at approximately $1.7 billion valuation in its 2024 Series C, with a
      platform that combines machine learning and wet-lab biological design. Insilico
      Medicine last raised at approximately $1 billion in 2022 and filed for a Hong Kong
      IPO; its Phase 2a result in idiopathic pulmonary fibrosis fell short of statistical
      significance on the primary endpoint, illustrating the Phase 2 translation risk
      for AI drug discovery. Against these peers, Enveda's ~$1 billion unicorn valuation
      is neither the cheapest nor the most expensive: it is more defensible than Recursion's
      historical peak because ENV-294 has delivered a quantified Phase 1b clinical signal
      that none of Recursion's clinical candidates have matched, but it is less defensible
      than Schrödinger's $994 million because Schrödinger generates $255 million of actual
      revenue. The appropriate "Enveda premium" over the Schrödinger market cap is
      the rNPV of the clinical pipeline minus the revenue-multiple discount for being
      pre-commercial — a net that roughly cancels, leaving a fair-value range of
      $800 million to $1.3 billion.
