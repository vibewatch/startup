localEvidence:
  researchQuestions:
    - id: QV001
      question: "Did Enveda Biosciences close a $150M Series D and achieve unicorn status in September 2025?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Confirmed by BusinessWire official press release dated September 4, 2025, and corroborated by GlobeNewswire and Enveda news page."

    - id: QV002
      question: "What is the total capital raised by Enveda Biosciences through the 2025 Series D close?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "$517 million total, confirmed in the BusinessWire Series D press release: 'bringing the company's total funding to $517 million'."

    - id: QV003
      question: "What was the exact post-money valuation of Enveda's Series D round in 2025?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: unresolved
      answerSummary: "Not publicly disclosed; unicorn designation ($1B+ floor) confirmed by press release but exact figure withheld."

    - id: QV004
      question: "What clinical data from ENV-294 Phase 1b atopic dermatitis study support Enveda's 2025-2026 valuation?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answerSummary: "Phase 1b: 85% mean EASI reduction at Day 42 in 9 patients; 100% EASI-50, 78% EASI-75, 56% EASI-90; no SAEs; no discontinuations. Source: BusinessWire / Morningstar March 2026."

    - id: QV005
      question: "What are the market capitalizations of public AI drug discovery comparables (RXRX, SDGR, RLAY, ABSI) as of 2026?"
      type: quantification
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "RXRX: $1.6B; SDGR: $994M; RLAY: $2.9B; ABSI: $795M. All sourced from Yahoo Finance intraday market cap as of runDate 2026-05-25."

    - id: QV006
      question: "What is Schrödinger's 2025 annual revenue and net loss, as reported in its 10-K filing?"
      type: quantification
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "FY2025 total revenue $255.9M ($199.5M software); net loss $103.3M. Source: Schrödinger 10-K for fiscal year ended December 31, 2025 (SEC EDGAR accession 0001490978-26-000010)."

    - id: QV007
      question: "What is Recursion Pharmaceuticals' cash position, net loss, and accumulated deficit as of its most recent 10-K filing?"
      type: quantification
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "Cash $594.3M (Dec 31, 2024); net loss $463.7M (FY2024); accumulated deficit $1.4B. Source: Recursion 10-K for fiscal year ended December 31, 2024 (SEC EDGAR accession 0001601830-25-000035)."

    - id: QV008
      question: "How has Recursion Pharmaceuticals' market cap changed from its 2021-2022 peak to May 2026?"
      type: comparison
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "Declined from over $5B at peak to $1.6B as of May 2026 (Yahoo Finance). 52-week range on runDate: $2.77–$7.18/share. This represents >68% decline from historical peak market cap."

    - id: QV009
      question: "Have any AI drug discovery companies' Phase 2 trials failed in 2024-2025, and what does this imply for sector valuation?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "STAT News (Dec 2024): Recursion first clinical candidate showed no reportable efficacy; Insilico Phase 2a missed primary endpoint; Exscientia acquired at fraction of peak; BenevolentAI collapsed. This implies the sector discount is real and persistent."

    - id: QV010
      question: "What is the standard clinical success rate for Phase 1 to approval in immunology/inflammation indications?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "BIO/Informa data indicates approximately 12–15% Phase 1-to-approval rate for immunology; Phase 2-to-3 approximately 35-40%; Phase 3-to-approval approximately 60-65%."

    - id: QV011
      question: "What is the rNPV of ENV-294 assuming Phase 2b success in atopic dermatitis?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: partial
      answerSummary: "Estimated $250–450M rNPV for ENV-294 AD alone at 25% Phase 2a-to-approval success rate, $3–6B peak sales, 12% discount rate. This is an analyst estimate with high uncertainty."

    - id: QV012
      question: "What investors participated in Enveda's Series D and Series C, and what do their other holdings indicate about platform conviction?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Series D: Premji Invest, Baillie Gifford, Kinnevik, Lingotto, Peakline, FPV, Socium Ventures, Dimension, Level Ventures, Henry Kravis, IA Ventures, Lux Capital. Series C included Sanofi. Kinnevik confirms Enveda as portfolio holding on website."

    - id: QV013
      question: "What is the capital-raised-to-valuation ratio for Enveda versus AI drug discovery public peers?"
      type: comparison
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Enveda: ~1.9× ($1B+ / $517M). Recursion at IPO: ~8× ($2B / ~$250M). BenevolentAI at listing peak: >5×. Enveda's ratio is unusually low, indicating modest pricing relative to capital deployed."

    - id: QV014
      question: "What are the financial terms of Sanofi's participation in Enveda's Series C?"
      type: verification
      targets: ["contentRequirements/2"]
      status: unresolved
      answerSummary: "Not publicly disclosed. Sanofi is named as Series C participant in the Series D press release but no collaboration agreement terms, equity stake, or milestone structure has been published."

    - id: QV015
      question: "Is there a Form D filing for Enveda Biosciences with the SEC covering any of its financing rounds?"
      type: verification
      targets: ["contentRequirements/2"]
      status: unresolved
      answerSummary: "No Form D found under 'Enveda Biosciences' in EDGAR full-text search. Unrelated entities (Enveda Therapeutics, Bioverge Funds Enveda) were found. Enveda Biosciences may file under a different legal name."

    - id: QV016
      question: "What is Generate:Biomedicines' most recent known valuation and how does it compare to Enveda's?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "Generate:Biomedicines raised at approximately $1.7B in its 2024 Series C ($370M raised); no clinical assets. Enveda at $1B+ with Phase 2a-stage assets — Enveda has more clinical proof per dollar of valuation."

    - id: QV017
      question: "What is the current status of ENV-6946 (IBD program) and ENV-294 Phase 2b as of May 2026?"
      type: freshness
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "ENV-6946 received FDA IND clearance and initiated Phase 1 in December 2025 (BusinessWire). ENV-294 Phase 2a in AD and Asthma initiated December 2025. Phase 2b in AD planned for mid-2026 per company guidance (Phase 1b results press release March 2026)."

    - id: QV018
      question: "What does Royalty Pharma's investment in Enveda signal about the platform's commercial validation as of 2026?"
      type: verification
      targets: ["contentRequirements/2"]
      status: partial
      answerSummary: "Evaluate Vantage referenced a Royalty Pharma deal with Enveda (URL was found in fetch log but content redirected). Royalty Pharma involvement would provide non-dilutive capital and implies conviction in ENV-294 commercialization probability."

    - id: QV019
      question: "How does the AI drug discovery sector valuation as of 2026 compare to the 2021-2022 peak?"
      type: comparison
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "RXRX down >68% from $5B+ peak to $1.6B; SDGR down from >$5B peak to $994M; BenevolentAI from >£1B to negligible; Exscientia from ~$3B to acquired at ~$700M stock. Sector compression is pervasive and material."

    - id: QV020
      question: "What is Insilico Medicine's valuation history and what does its Phase 2a result imply for AI drug discovery clinical risk?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "Insilico last valued at ~$1B (2022 Series D); filed HK IPO. Phase 2a for ISM-001 in IPF missed primary statistical significance per STAT News Dec 2024 — a direct warning signal for any AI-first drug discovery company entering Phase 2."

    - id: QV021
      question: "What revenue does Schrödinger generate from its software business, and how does this support its valuation versus Enveda's?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "Schrödinger: $199.5M software revenue (FY2025), ACV $198.5M, all top-20 pharma customers (10-K). This revenue base provides a $994M valuation anchor Enveda lacks. Schrödinger's revenue-based floor partially justifies its $994M vs. Enveda's rNPV-based ~$1B."

    - id: QV022
      question: "Did Enveda announce any partnership or licensing deal with a major pharma company in 2025 or 2026 beyond the Sanofi Series C investment?"
      type: freshness
      targets: ["contentRequirements/2"]
      status: partial
      answerSummary: "No additional major pharma licensing deal publicly announced as of runDate. Sanofi remains the only disclosed strategic pharma investor. Royalty Pharma deal referenced but terms unconfirmed."

    - id: QV023
      question: "What is the expected timeline for Phase 2b data readout for ENV-294 in atopic dermatitis in 2026?"
      type: freshness
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "Phase 2b planned for initiation in mid-2026 per Phase 1b press release (March 2026). Data readout timeline from a Phase 2b study typically 18–24 months from initiation, i.e., approximately late 2027–mid 2028."

    - id: QV024
      question: "What did Fast Company say about Enveda in its 2026 Most Innovative Companies ranking?"
      type: verification
      targets: ["contentRequirements/1"]
      status: answered
      answerSummary: "Enveda was named one of the Most Innovative Companies in biotech by Fast Company in March 2026 (per Enveda news page). No quantitative metrics disclosed in the ranking citation available."

    - id: QV025
      question: "Is the AI drug discovery sector facing a capital-raising reckoning in 2025-2026 that could affect Enveda's ability to raise future rounds?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "STAT News Dec 2024 documents the AI drug discovery reckoning: Recursion first drug no efficacy, Insilico Phase 2a primary missed, BenevolentAI collapsed, Deep Genomics CEO: 'AI has really let us all down'. However, Enveda's Series D closed in September 2025 despite this headwind, indicating selective investor differentiation based on Phase 1b clinical data quality and mechanism novelty."

    - id: QV026
      question: "What is the Relay Therapeutics (RLAY) market cap as of May 2026 and why is it higher than Recursion despite smaller scale?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "RLAY: $2.9B market cap (Yahoo Finance, May 2026). Higher than RXRX $1.6B likely reflects positive clinical data for lead oncology candidates and a more focused pipeline, whereas Recursion's broader platform has not yet produced clinical proof despite higher capital deployed."

    - id: QV027
      question: "What were Recursion's total collaboration payments received since inception, and which pharma partners does it have?"
      type: quantification
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "Over $450M in collaboration payments since inception (Recursion 10-K FY2024). Partners include Sanofi ($150M upfront + milestones), Bayer, Roche/Genentech (exercised $30M neuro phenomap option), Merck KGaA."

    - id: QV028
      question: "What are the applicable rNPV discount rates and success probability benchmarks for an oral Phase 2a immunology asset in 2026?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "BIO/Informa data: Phase 1-to-approval ~12-15% for immunology; Phase 2-to-3 ~35-40%; Phase 3-to-approval ~60-65%. Tufts CSDD cost-to-market ~$1-2B per approved drug. A 12% discount rate is standard for late pre-clinical/Phase 1 immunology assets. Peak sales for oral AD first-in-class therapy estimated $1-6B depending on label breadth and competitor landscape."

    - id: QV029
      question: "What is BenevolentAI's current market status and what does its collapse imply for AI drug discovery valuation risk?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "BenevolentAI listed on Euronext at >£1B valuation in 2022 and collapsed to ~£50-100M by 2025 after clinical failures. Its trajectory is the benchmark cautionary case for AI drug discovery valuation destruction."

    - id: QV030
      question: "What was the Exscientia acquisition price by Recursion, and does it signal a sector valuation floor for AI drug discovery companies?"
      type: comparison
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "Recursion 10-K FY2024 documents Exscientia acquisition closed November 2024 at approximately $700M in stock (Exscientia's pre-acquisition cash was $184M). Exscientia had traded at $2-3B+ at peak, implying >60% destruction of peak value. This establishes a sector floor for asset sales."

