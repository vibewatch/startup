company:
  name: Enveda Biosciences
chapter:
  number: 8
  title: Valuation
  summary: >
    Enveda Biosciences achieved unicorn status in September 2025 with a $150M Series D
    (Premji Invest-led, oversubscribed) bringing total capital raised to $517M against an
    undisclosed but ~$1B+ post-money valuation. Applying standard rNPV methodology to a
    pipeline anchored by ENV-294 — a first-in-class LOCKTAC oral small-molecule that
    delivered 85% EASI reduction in its Phase 1b atopic dermatitis study (March 2026),
    with Phase 2a underway and Phase 2b planned for mid-2026 — yields a base-case
    pipeline value of $800M–$1.2B on a probability-adjusted, risk-discounted basis,
    broadly in line with the unicorn mark. Comparable-company analysis of public AI-drug
    discovery peers (Recursion $1.6B market cap, Schrödinger $994M, Relay $2.9B, Absci
    $795M) and private comps (Generate:Biomedicines ~$1.7B, Insilico ~$1B) shows wide
    dispersion driven by clinical proof, revenue mix, and platform differentiation. The
    capital-raised-to-valuation ratio of approximately 1.9× is unusually modest for a
    biotech unicorn, suggesting investor appetite for optionality rather than aggressive
    pricing. Critically, every AI drug discovery public peer has suffered severe valuation
    compression since 2021–2022 peaks (RXRX from $5B+ to $1.6B; BenevolentAI from
    £1B+ to near-zero; Exscientia acquired by Recursion at a fraction of peak value),
    and independent commentators note that AI drug discovery companies continue to
    struggle to deliver statistically significant clinical proof. The recommendation is
    WATCH/TRACK with a conditional upgrade to BUY upon Phase 2b ENV-294 data readout
    confirming efficacy in larger randomised cohorts; the current entry price is
    reasonable but not undervalued relative to the evidence base.

sections:
  - id: valuation-context-financing-history
    title: Valuation Context and Financing History
    body: >
      Enveda Biosciences completed its $150 million Series D in September 2025, led by
      Premji Invest with participation from Baillie Gifford, Kinnevik, Lingotto
      Investment Management, Peakline Partners, FPV, Socium Ventures, Dimension,
      Level Ventures, Henry Kravis, IA Ventures, and Lux Capital. The round was
      oversubscribed and formally conferred unicorn status on the company, implying a
      post-money valuation in excess of $1 billion. This followed a $150 million Series
      C closing in February 2025 that included Sanofi as a strategic anchor, bringing
      the company's total disclosed capital to $517 million across all rounds. Prior
      rounds included a $55 million raise in June 2024 and a $130 million extension in
      November 2024, together contributing approximately $217 million of the pre-Series
      D capital stack. The capital-raised-to-implied-valuation ratio of approximately
      1.9× (i.e., $1B / $517M) is strikingly modest compared with AI drug discovery
      comparables that achieved $3–8× ratios at peak: Recursion IPO'd at approximately
      $2B on roughly $250M raised (~8×), and BenevolentAI reached a £1B market cap on
      substantially less capital before collapsing. This modesty suggests either disciplined
      pricing, insider-led pricing with limited third-party discovery, or genuine alignment
      between capital deployed and platform maturity. Importantly, the exact post-money
      figure from the Series D has not been publicly disclosed; the "$1B+" floor is
      derived from the public unicorn designation. The Sanofi strategic anchor in the
      Series C provides validation from a top-five global pharma, though the financial
      terms of any associated collaboration agreement have not been made public. As of
      runDate, Enveda has no product revenue, deriving all operating support from equity
      financing and no disclosed grant or licensing income. Royalty Pharma also announced
      a royalty interest deal with Enveda, providing a non-dilutive capital mechanism and
      implying institutional conviction in ENV-294's commercial prospects.
