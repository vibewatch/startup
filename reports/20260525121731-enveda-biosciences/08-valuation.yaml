  - id: final-recommendation-diligence-asks
    title: Final Recommendation and Diligence Asks
    body: >
      The final recommendation is WATCH / TRACK at the current implied valuation of
      approximately $1 billion or higher. This is not a BUY because the clinical
      evidence base, while promising, rests on nine patients in an open-label Phase
      1b study; the full randomised Phase 2a data in atopic dermatitis and asthma are
      the decisive value inflection. The valuation is not a SELL because the rNPV of
      the current pipeline broadly supports the unicorn price, the Phase 1b data are
      genuinely compelling, the mechanism is novel and differentiated, and the investor
      syndicate includes credible life-science specialists (Premji Invest, Kinnevik,
      Baillie Gifford, Lux Capital) with access to non-public diligence. An upgrade to
      BUY should be conditioned on: (1) Phase 2b ENV-294 data in AD showing
      statistically significant EASI reduction vs. placebo in a randomised controlled
      cohort of at least 50 patients, expected mid-2026 per company guidance; (2) Phase
      2a asthma data showing at least nominal improvement in FEV1 or ACQ score; (3)
      ENV-6946 (IBD program) completing Phase 1 dosing with a clean safety profile; and
      (4) confirmation that total cash and committed financing provides at least 18 months
      of runway through a potential Phase 3 initiation milestone. If any of these
      conditions are not met, the position should be maintained at WATCH pending further
      clinical data. A downgrade to AVOID should be triggered if Phase 2a fails the
      primary endpoint in both AD and asthma, or if a serious adverse event is reported
      in any ongoing trial. The five final diligence asks are: (1) audited or reviewed
      financial statements confirming actual cash position and burn rate; (2) full
      Phase 1b dataset and biomarker analyses published in a peer-reviewed journal;
      (3) terms and scope of the Sanofi collaboration agreement under the Series C;
      (4) exact Series D post-money valuation and preference waterfall structure; and
      (5) Phase 2a enrollment progress, primary endpoint design, and statistical
      analysis plan filed with ClinicalTrials.gov.
