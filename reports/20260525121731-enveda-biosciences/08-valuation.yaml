  - id: kill-triggers-thesis-break
    title: Thesis-Break Triggers and Kill Criteria
    body: >
      Four events would materially impair the investment thesis and trigger an
      immediate hold/sell reassessment. First, a Phase 2a failure in either the
      atopic dermatitis or asthma study — defined as failure to meet the primary
      EASI endpoint at the pre-specified significance threshold — would reduce the
      ENV-294 rNPV by 80–90% and likely force a down-round financing given that
      ENV-294 is the anchor program on which the unicorn valuation was justified.
      Second, emergence of a serious adverse event (SAE) in Phase 2a related to
      immunosuppression or off-target toxicity would eliminate the key competitive
      advantage of ENV-294 over JAK inhibitors and trigger an FDA clinical hold
      risk. Third, a strategic reversal by Sanofi — defined as non-renewal of the
      Series C collaboration arrangement or public discontinuation of a joint
      discovery program — would both reduce capital efficiency expectations and
      signal platform concerns from an insider with deep diligence access. Fourth,
      evidence of data quality concerns in the Phase 1b study, including EASI
      measurement variability, inconsistent biomarker read-outs in larger cohorts,
      or investigator assessment irregularities, would cast doubt on the reliability
      of the published clinical results. Monitoring indicators include quarterly Phase 2a
      enrollment updates, protocol amendments filed with ClinicalTrials.gov, FDA
      correspondence disclosed in future funding materials, and publication of the
      full Phase 1b dataset in a peer-reviewed journal to allow independent
      methodological review.
