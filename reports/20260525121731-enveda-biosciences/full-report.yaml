              - CV018
              - CV035
      - number: '8.2'
        title: Valuation Methodology — rNPV Pipeline Analysis
        blocks:
          - type: paragraph
            body: >
              Because Enveda is pre-commercial with no product revenue, revenue multiples are not applicable. The
              appropriate valuation framework is risk-adjusted net present value (rNPV), discounting each clinical
              program's peak-year probability-weighted commercial value by a risk factor reflecting the clinical-stage
              success rate for the relevant indication and modality. Standard industry success rates (BIO/Informa 2025)
              for the immunology/inflammation indication class are: Phase 1 to Phase 2 approximately 55–60%; Phase 2 to
              Phase 3 approximately 35–40%; Phase 3 to approval approximately 60–65%; full Phase 1-to-approval
              approximately 12–15% for novel mechanisms. ENV-294 is currently in Phase 1b (atopic dermatitis) and Phase
              2a (AD and asthma simultaneously), making it the most advanced and value-creating program in the pipeline.
              Applying an indicative Phase 2a-to-approval success rate of ~25% to a peak-year US sales assumption of
              $3–6 billion (assuming a first-in-class oral daily therapy capturing 5–10% of a $30B+ addressable market
              for moderate-to-severe AD and asthma biologic-eligible patients), and discounting at a 12% cost of capital
              with a 10-year time-to-peak, the probability-weighted NPV of ENV-294 alone is approximately $250–450
              million. Adding three additional pipeline programs (IBD, obesity, and at least two undisclosed assets at
              preclinical stage), with rNPV discounted by their earlier clinical stage, contributes an incremental
              $100–250 million of pipeline NPV. Platform optionality — the ability to generate additional first-in-class
              drugs from Enveda's library of life — contributes a speculative premium analogous to the "platform
              multiple" applied to Schrödinger's software-licensing business or Recursion's phenomics dataset. In sum, a
              base-case pipeline rNPV of $800 million to $1.2 billion broadly supports the ~$1B unicorn valuation. The
              bear case rNPV (assuming Phase 2a fails or delivers only modest effect sizes) contracts to $150–350
              million, implying material downside from the current $1B+ price. The bull case rNPV (Phase 2b success in
              AD, positive Phase 2a asthma data, and IBD program advancing to Phase 2) exceeds $2 billion, suggesting a
              2–3× return from the current entry price before considering platform licensing deal optionality.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
