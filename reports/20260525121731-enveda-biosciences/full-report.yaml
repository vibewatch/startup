      - number: '6.2'
        title: Named Partner Segmentation and Relationship Evidence
        blocks:
          - type: paragraph
            body: >
              Enveda's current partner base comprises four named external organizations, each serving a different
              strategic function and representing a distinct quality of customer-proof evidence.

              Bruker Daltonics is Enveda's most comprehensively documented B2B partner. The relationship began in 2021
              when Enveda adopted the timsTOF Pro 2 mass spectrometer for its metabolomics platform. Bruker published a
              formal customer insight case study on its website, featuring verbatim quotes from Pelle Simpson (Senior
              Scientist, Enveda): "The challenge in the industry is no longer the acquisition of MS/MS spectra itself
              but the rate of acquisition and the quality of the spectra. This is where the timsTOF platform has set
              itself apart from its competitors." August Allen (CTO, Enveda) added: "We will continue building the
              largest metabolomics dataset, purpose-built for machine learning, and applying active learning
              strategies." This case study, published by Bruker, constitutes the primary customer-proof source for this
              chapter—a jointly-sanctioned publication in which Enveda's senior scientific leadership explicitly
              endorses the instrument partner's product. [CU005, CU006]

              Microsoft is a technology collaboration partner announced in May 2024. Enveda developed the PRISM
              foundation model in collaboration with Microsoft, described as a model to "read and translate" the
              chemistry of natural samples. The collaboration provides Enveda with cloud AI infrastructure and
              legitimizes the scientific basis of its machine learning claims. No financial terms were disclosed.
              [CU007]

              Sanofi made a strategic investment in Enveda as part of the Series C round in February 2025, bringing
              total Series C financing to $150M. This represents pharma industry validation from one of the world's
              largest specialty I&I companies. Importantly, Sanofi also has its own atopic dermatitis pipeline
              (amlitelimab in Phase 3, per Sanofi press releases as of March 2026), which means the relationship
              encompasses both strategic investment and therapeutic-area competition. No licensing or co-development
              agreement terms were disclosed beyond the equity investment. [CU008, CU009]

              The Bill & Melinda Gates Foundation partnership, disclosed on Enveda's purpose page, involves applying
              Enveda's natural-product discovery platform to infectious disease indications including tuberculosis,
              malaria, and other global health priorities. No grant amounts or milestones are publicly documented in the
              Gates Foundation committed-grants database, which may indicate the relationship is a direct charitable
              contract or Program Related Investment rather than a traditional grant (the database excludes those
              formats per its own disclosure). This partnership significantly expands Enveda's total addressable patient
              base beyond I&I into global infectious disease. [CU010, CU011]
