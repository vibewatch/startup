      - number: '5.3'
        title: Clinical Pipeline Assets — ENV-294, ENV-308, ENV-6946
        blocks:
          - type: paragraph
            body: >
              Enveda's clinical pipeline as of May 2026 comprises three drugs in human trials across four indications,
              with six additional assets in IND-enabling studies and seventeen declared development candidates in the
              research pipeline.

              ENV-294 is the lead and most advanced asset. It is described as a first-in-class, once-daily oral small
              molecule with a novel "LOCKTAC" mechanism — a non-degrading molecular glue that reconfigures cellular
              immunity to chronic inflammation rather than blocking individual cytokines via the JAK-STAT or IL-4Rα
              pathways used by existing therapies. ENV-294 targets a non-kinase inflammatory pathway. The Phase 1b
              open-label study (n=9, moderate-to-severe atopic dermatitis) reported the following efficacy endpoints at
              Day 42 (14 days post-treatment): mean EASI reduction of 85%, with 100% of patients achieving EASI-50, 78%
              reaching EASI-75, and 56% achieving EASI-90. Two patients achieved complete skin clearance (vIGA-AD=0).
              Responses were observed as early as Day 8 and deepened after treatment cessation, suggesting a potential
              disease-modification signal. No serious or severe adverse events were reported and no patients
              discontinued. ENV-294 is now in two parallel randomized, double-blind, placebo-controlled Phase 2a trials
              — one for atopic dermatitis and one for asthma — initiated in December 2025. A Phase 2b dose-ranging study
              in AD is planned for mid-2026.

              ENV-308 is a first-in-class, once-daily oral small molecule described as a "hormone mimetic" for chronic
              weight maintenance, with data suggesting muscle-preservation properties distinct from existing GLP-1
              receptor agonists. FDA IND clearance was received and first patient dosed in December 2025; the asset is
              in Phase 1 with Nadeem Sarwar, Ph.D., MPharm, MPhil, appointed to lead the obesity program.

              ENV-6946 is positioned as a gut-preferred, once-daily oral small molecule with a "multi-biologic in a
              pill" mechanism via a novel TL1A+ pathway inhibitor for inflammatory bowel disease. FDA IND clearance was
              received in December 2025 and Phase 1 was initiated with the first patient dosed at that time. The
              gut-preferred selectivity profile is intended to reduce systemic exposure and associated side-effect risk
              relative to parenteral biologics. All three clinical assets are first-in-class claims by the company, with
              novel mechanisms unsupported by any currently approved small-molecule precedent — a differentiation
              argument that will require Phase 2 data to fully substantiate.
