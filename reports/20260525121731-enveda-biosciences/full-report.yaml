  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Phase 2a AD primary endpoint failure
        - ENV-294 does not meet pre-specified EASI reduction vs. placebo at p<0.05 in randomised Phase 2a cohort
        - >-
          Eliminates ~60% of base-case rNPV; unicorn valuation no longer supportable; likely triggers down-round
          financing at sub-$500M valuation
        - Immediate downgrade to AVOID; do not participate in down-round without full data review and revised price
      - - Serious adverse event in Phase 2a or 2b
        - >-
          Any treatment-related SAE in ENV-294 Phase 2 trials implicating immunosuppression, hepatotoxicity, or
          off-target systemic toxicity
        - >-
          Eliminates primary competitive advantage (biologic-like safety profile); FDA clinical hold risk; full rNPV
          impairment
        - Immediate downgrade to AVOID pending FDA/IRB investigation outcome
      - - Sanofi strategic withdrawal
        - >-
          Sanofi declines to renew or materially reduces its collaboration scope under the Series C commercial
          arrangement
        - >-
          Negative signal from an insider with diligence access; reduces credibility of platform validation claim;
          signals internal scientific concerns
        - Downgrade to WATCH (from TRACK); request full terms of Sanofi agreement before further commitment
      - - AI drug discovery sector multiple compression
        - >-
          Public AI drug discovery peers (RXRX, SDGR) experience further >50% market cap decline from May 2026 levels,
          driven by clinical disappointments
        - >-
          Reduces private market comparable valuation floor; increases down-round risk at any future financing;
          increases cost of capital for clinical development
        - Maintain WATCH; acknowledge macro risk; seek earlier Phase 2b data release to justify current entry price
      - - Capital depletion without new financing
        - >-
          Evidence that Enveda's cash runway falls below 12 months without a new financing round; indicative of
          inability to complete Phase 2b trials
        - >-
          Execution risk becomes existential; Phase 2b may need to be delayed or restructured; could trigger distressed
          sale
        - 'Urgent diligence ask: confirm cash position and Phase 2b completion financing plan before further commitment'
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
    notes: >-
      Kill criteria are monitoring signals, not inevitable outcomes. Each trigger requires confirmation before trading
      action. ClinicalTrials.gov is the primary monitoring source for Phase 2a enrollment and protocol amendments.
    sourceRefs:
      - SV001
      - SV007
      - SV015
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner or Diligence Path
    rows:
      - - Exact Series D post-money valuation
        - Post-money figure not publicly disclosed; only unicorn floor ($1B+) available
        - >-
          Essential for computing cost of capital, preference waterfall analysis, and dilution sensitivity in future
          rounds
        - >-
          Direct request to Enveda CFO/corporate development; secondary: review any Form D filed with SEC under Colorado
          entity
      - - Audited financials and burn rate
        - >-
          No audited financial statements publicly available; no burn rate, no runway estimate, no cash balance
          disclosed
        - >-
          Without this, rNPV-to-price comparison lacks a critical denominator; burn rate determines
          time-to-next-financing and thus the probability of reaching Phase 2b completion
        - >-
          Enveda investor relations: soumoditya.dey@enveda.com (VP Corporate Development); UK Companies House if entity
          incorporated in UK; or request as condition of next financing participation
      - - Sanofi collaboration terms
        - >-
          Financial scope, exclusivity provisions, milestone structure, and co-development rights under the Series C
          Sanofi anchor not disclosed
        - >-
          Sanofi's involvement could represent $100–500M in future milestone value or could be limited to a minority
          equity stake with no clinical commitment; the difference is material to thesis
        - >-
          Request term sheet summary from Enveda; review SEC 8-K equivalent or Form D amendments for any collaboration
          agreement registration
      - - Phase 2b statistical analysis plan
        - >-
          Phase 2b design (sample size, primary endpoint, success criteria) not yet filed with ClinicalTrials.gov as of
          runDate
        - >-
          Phase 2b success depends critically on endpoint selection and sample size; a poorly designed trial can
          generate a technically negative result for a truly effective drug — or vice versa
        - Monitor ClinicalTrials.gov NCT for ENV-294 Phase 2b filing; request SAP from Enveda CMO Jose Trevejo
      - - Full Phase 1b dataset peer-reviewed publication
        - >-
          Phase 1b results released as press release (March 2026) and webcast; full biomarker, PK/PD, and safety dataset
          not yet peer-reviewed
        - >-
          Peer review is the standard validation step for clinical claims; absence of published dataset makes
          independent scientific assessment impossible
        - >-
          Monitor NEJM, JAMA Dermatology, JID, and Annals of Allergy for ENV-294 Phase 1b submission; request preprint
          from Enveda medical affairs
    claimRefs:
      - CV037
      - CV038
      - CV039
    notes: >-
      All five diligence asks are material to upgrading from WATCH to BUY. The most critical is the Phase 2b SAP, which
      determines whether the trial is adequately powered to support regulatory filing.
