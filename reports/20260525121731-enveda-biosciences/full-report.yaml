      - number: '7.2'
        title: IP, Legal, and Biodiversity Compliance Risks
        blocks:
          - type: paragraph
            body: >
              Natural-product-derived drug discovery creates a structurally unusual intellectual property environment.
              Under 35 U.S.C. § 101 as interpreted post-Alice/Mayo (2012–2014), claims on isolated natural products or
              their salts/derivatives face heightened patent eligibility scrutiny at the USPTO. While patent protection
              remains achievable for specific synthetic modifications, new forms, combinations, or methods of treatment,
              the core natural scaffold may not be independently protectable where a prior art structural analog exists
              in publicly accessible chemical databases (PubChem, ChemSpider). A compound with ethnobotanical use in
              Ayurvedic, TCM, or indigenous communities may also face obviousness challenges if the therapeutic
              indication was traditionally known—even without a published clinical trial.

              The WIPO-administered Treaty on Intellectual Property, Genetic Resources and Associated Traditional
              Knowledge (adopted May 2024) and the existing Nagoya Protocol on Access and Benefit-Sharing (CBD ABS
              framework, in force since October 2014) collectively create a binding compliance layer for companies that
              source genetic resources from biodiversity-rich nations. Under the Nagoya Protocol, prior informed consent
              (PIC) and mutually agreed terms (MAT) must be established with the provider country before biological
              material is collected; utilization of the genetic resource must be disclosed to the ABS Clearing-House;
              and benefit-sharing obligations can include royalty payments, co-authorship, or community benefit funds.
              For Enveda's business model—which systematically collects plant samples from biodiverse ecosystems
              globally—Nagoya Protocol compliance is a structural, ongoing legal obligation rather than a one-time
              clearance. Failure to document PIC/MAT for each plant accession used to discover a commercialized compound
              could create regulatory blockage at regulatory approval stage or expose the company to treaty-violation
              claims from provider countries.

              No Enveda Biosciences or Enveda Therapeutics litigation was found in federal court records on
              CourtListener (RECAP Archive search, May 2026). The Zymergen securities class action (5:21-cv-06028, N.D.
              Cal., March 2024 amended complaint) references "Enveda Therapeutics, Inc." as a contextual reference in
              the pharmaceutical industry landscape document but names Zymergen—not Enveda—as the defendant. No patent
              interference proceedings, IPR petitions, or inter partes reviews naming Enveda were identified in the
              patent-search records reviewed. USPTO patent public search and Google Patents searches for "Enveda"
              assignee returned results consistent with a relatively early filing portfolio; the breadth and
              defensibility of those filings versus established natural-product chemistry IP held by Sanofi,
              AstraZeneca, Bayer, and biotech specialists has not been independently confirmed.

              Trade secret risk is significant: the PRISM platform's proprietary mass spectrometry annotation models,
              plant-compound ontology, and biological activity prediction algorithms represent the core moat. Employee
              departures to competitors (Recursion, Insilico, large pharma) could erode these trade secrets faster than
              formal IP protects them. Non-compete enforceability varies by jurisdiction (Colorado, where Enveda is
              headquartered, has historically weak non-compete enforcement post-2022 statutory changes).
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
