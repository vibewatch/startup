      - number: '5.2'
        title: Drug Discovery Workflow — From Plant to Candidate
        blocks:
          - type: paragraph
            body: >
              Enveda's end-to-end drug discovery workflow compresses what traditionally requires years of manual
              natural-product isolation into a high-throughput, database-centric process. The workflow begins with
              species selection from the company's 38,000-plant knowledge graph, which scores each species by its
              predicted therapeutic relevance to target indications and its chemical novelty relative to known structure
              space.

              Selected plant tissue is extracted with organic solvents and fractionated by liquid chromatography. Each
              fraction is split: one aliquot enters the Bruker timsTOF Pro 2 for LC-MS/MS and TIMS measurement; the
              parallel aliquot is screened in dozens of simultaneous in vitro bioassays covering relevant biological
              pathways. This "measure and screen simultaneously" architecture means Enveda does not need to know what
              compound is in a fraction before testing its activity — the MS/MS spectra and bioactivity data are
              generated in parallel and then computationally linked.

              The ML deconvolution step uses statistical models to associate specific MS/MS spectral features with
              specific bioactivity signals in each fraction. Fractions showing the right combination of activity, low
              predicted toxicity, and structurally tractable chemistry are elevated for further investigation. At this
              stage, the DreaMS-style structure prediction pipeline infers plausible molecular structures from the MS/MS
              spectra, which are then prioritized for isolation, structural confirmation by NMR, and analoging by
              medicinal chemists. The Bruker case study notes that "bioactive components of natural products tend to be
              present in low abundance, making it difficult to isolate large enough quantities to perform structure
              analysis using nuclear magnetic resonance (NMR)" — Enveda's ML-first approach allows it to commit to a
              structure hypothesis before investing in the expensive NMR confirmation step, improving throughput.

              Validated hit series then enter standard hit-to-lead and lead optimization chemistry, followed by GLP
              toxicology studies and IND-enabling programs. Enveda has received multiple FDA IND clearances in rapid
              succession: ENV-294 in 2024, ENV-308 and ENV-6946 both in December 2025. The company claims a 4× faster
              discovery rate than the industry average, grounded in this parallel, database-driven approach rather than
              sequential isolation-then-screen methods.
