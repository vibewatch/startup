      - number: '4.2'
        title: Capital Formation History and Runway Adequacy
        blocks:
          - type: paragraph
            body: >
              Enveda has assembled $517 million in equity capital over five years through a tightly paced funding
              sequence. The seed round of $4,999,998—confirmed by SEC Form D filed August 24, 2020 with first sale date
              August 11, 2020—bootstrapped the company from its founding in 2019. A $51M Series A followed in June 2021
              (Lux Capital led), followed by a $68M Series B in December 2022. The Series B1 extension reached $119M
              total; the incremental tranche of approximately $62.4M was registered via Form D filed March 7, 2023 with
              first sale August 25, 2022. A $55M financing closed in May 2024. The Series C of $150M closed in February
              2025, with Sanofi among the participants—a strategically significant development. The Series D of $150M,
              led by Premji Invest, closed September 4, 2025, conferring unicorn status. The company's legal filing
              entity, Enveda Therapeutics, Inc. (CIK 0001821392, Delaware), is confirmed by the EDGAR entity page, which
              shows exactly two Form D registrations.

              The appointment of Jason Kim as CFO in January 2025 preceded both the Series C and Series D closes,
              signaling that the board was building financial infrastructure for a capital-intensive Phase 2/Phase 3
              buildout and potential partnering process. Kim's track record at Molecular Templates—$500M+ raised, public
              listing, and collaborations with Takeda, Vertex, and Bristol Myers Squibb—represents exactly the financial
              capability set required for Enveda's next phase.

              Burn rate is not publicly disclosed. With approximately 250 employees (late 2024), a 60,000-square-foot
              Boulder facility plus Hyderabad operations, Phase 2a trials actively enrolling in atopic dermatitis and
              asthma, and 16 preclinical programs in advancement, a conservative monthly cash consumption estimate lands
              in the $7–15M/month range, consistent with clinical-stage AI biotechs of comparable scale. The Series D
              proceeds ($150M), if the company was spending $8–12M/month at close, extend runway by 12–18 months from
              September 2025. The clinical value inflection from Phase 2a interim data (expected 2026–2027) is the
              logical trigger for either a pharma partnership event or a subsequent financing round. Enveda carries no
              disclosed debt or credit facilities, though undisclosed convertible notes cannot be ruled out without data
              room access.
