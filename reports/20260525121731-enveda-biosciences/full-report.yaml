      - number: '1.4'
        title: Pipeline, Platform Scale, and Traction Signals
        blocks:
          - type: paragraph
            body: >
              Enveda's PRISM platform—combining AI-guided mass spectrometry (Bruker timsTOF instrumentation used since
              2021), high-throughput biological assays, and machine learning-driven structure prediction—operates on a
              database of natural samples linked to biological activity. The platform uses liquid chromatography to
              fractionate complex mixtures, sends fractions through the timsTOF Pro 2 for structure prediction
              (leveraging collisional cross-section encoding for molecule shape), and subjects parallel fractions to
              dozens of biological assays. Statistical deconvolution then prioritizes molecules with favorable activity,
              low toxicity, and drug-like structures. An Enveda-published peer-reviewed paper (iScience, 2023) validated
              this ethnobotanical-driven approach, demonstrating congeneric medicinal plants share phytochemical space
              and therapeutic uses.

              The lead clinical asset ENV-294 is a first-in-class, oral, once-daily small molecule for atopic dermatitis
              and asthma. Enveda describes its mechanism of action as a novel non-kinase pathway, operating as a
              "LOCKTAC" non-degrading molecular glue that resets the cellular immune response to chronic inflammation,
              distinct from JAK-STAT or cytokine-signaling approaches used by current therapies. Phase 2a trials for
              both indications were initiated in December 2025, following positive interim Phase 1b efficacy data, with
              a Phase 2b dose-ranging study in atopic dermatitis planned for mid-2026. ENV-308, a first-in-class oral
              small molecule for chronic weight maintenance (hormone mimetic mechanism), entered Phase 1 following FDA
              IND clearance in December 2025. ENV-6946, a gut-preferred TL1A+ pathway inhibitor for inflammatory bowel
              disease, also entered Phase 1 in December 2025.

              External recognition of platform traction includes Fast Company naming Enveda one of the Most Innovative
              Companies in biotech in 2026, Forbes ranking the company #2 in Life Science Startups and #26 overall in
              America's Best Startup Employers 2025, and a strategic collaboration with Microsoft in May 2024 to build a
              chemistry foundation model. Evercore ISI analyst Umer Raffat hosted a webcast on the Phase 1b results in
              April 2026, indicating growing Wall Street coverage for a pre-revenue private company.
            claimRefs:
