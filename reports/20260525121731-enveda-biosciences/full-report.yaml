  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Scope and Boundaries
        blocks:
          - type: paragraph
            body: >
              Enveda's commercial opportunity spans four distinct but mechanistically adjacent therapeutic areas: atopic
              dermatitis (AD), atopic asthma, inflammatory bowel disease (IBD), and obesity. Each represents a large
              chronic disease market with sustained pharmaceutical investment. Atopic dermatitis affects an estimated 31
              million Americans and manifests across a wide severity spectrum, with moderate-to-severe disease driving
              the bulk of pharmaceutical spend on biologics and advanced small molecules. Globally, AD is a significant
              public health burden, with notably elevated adult prevalence in East Asia—Japan and South Korea report
              rates above 10%—and approximately 40 million patients in China. Asthma is even larger in absolute scale,
              with 262 million people affected globally based on the 2023 Global Burden of Disease study; it cannot be
              cured and requires lifelong inhaled and biologic management. IBD, comprising Crohn's disease and
              ulcerative colitis, affects an estimated 6–8 million people globally with incidence rising in Asia,
              Africa, and South America. Obesity now affects more than 1 billion people worldwide, with GLP-1 receptor
              agonists establishing a new standard of care and the WHO issuing updated clinical practice guidelines in
              December 2025. Enveda's pipeline-in-a-product strategy for ENV-294 aims to address AD and asthma from a
              single clinical program, while ENV-308 (obesity) and ENV-6946 (IBD) expand the portfolio breadth. The four
              indications share immune-inflammatory or metabolic biology, supporting common discovery platform economics
              but requiring distinct regulatory, commercial, and payer strategies. Excluded from this market boundary
              are the broader dermatology drug market (acne, psoriasis), pure-play respiratory biologics without AD
              overlap, and general metabolic pipeline programs not related to inflammatory mechanisms.
