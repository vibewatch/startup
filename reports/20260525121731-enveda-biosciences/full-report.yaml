      - number: '6.4'
        title: Patient End-User Segments and Market Sizing
        blocks:
          - type: paragraph
            body: >
              Enveda's four lead clinical indications address some of the largest unmet medical needs in medicine, with
              collective US patient populations exceeding 140 million and significant treatment inadequacy across all
              four.

              Atopic dermatitis (eczema): The US atopic dermatitis patient population is estimated at approximately 16
              million, with moderate-to-severe disease affecting roughly 10–25% of that group. The market is served by
              biologics (Dupixent generated ~$14B in annual global sales for Sanofi/Regeneron in 2024) and emerging JAK
              inhibitors. ENV-294's clinical profile— described as a "Dupi-like efficacy and safety profile" with
              "pan-endotype potential"—directly targets inadequate responders to existing oral therapies. Phase 2a in
              atopic dermatitis is currently recruiting (60 patients, primary completion December 2026). [CU020, CU021]

              Asthma: 28 million Americans have asthma (AAFA, 2026 data), of whom approximately 23 million are adults.
              About 8% of the US population is affected. Asthma represents ENV-294's second indication with a Phase 2a
              trial (50 patients) currently recruiting, demonstrating ENV-294's potential pipeline-in-a-product value
              beyond atopic dermatitis. The same molecule targets both indications, which compresses development cost
              and timeline if both Phase 2s succeed. [CU022, CU023]

              Inflammatory Bowel Disease (IBD): ENV-6946, targeting TL1A+ pathway as a novel "multi-biologic in a pill"
              mechanism, is in Phase 1 for IBD. The US IBD population (Crohn's disease plus ulcerative colitis) is
              estimated at 3 million, with significant treatment inadequacy in Crohn's disease specifically. ENV-6946
              received US FDA IND clearance and initiated Phase 1 in December 2025. [CU024]

              Obesity/Chronic Weight Maintenance: ENV-308 is a first-in-class oral small molecule for chronic weight
              maintenance, with IND clearance and first patient dosed in December 2025. US adult obesity prevalence is
              approximately 42% of adults, with over 100 million US adults meeting obesity criteria (BMI ≥30). The GLP-1
              receptor agonist class (Zepbound, Wegovy) has validated massive commercial potential; ENV-308's mechanism
              (hormone mimetic) would need to demonstrate differentiation to compete effectively. [CU025, CU026]

              Global health (Gates Foundation): TB and malaria collectively affect hundreds of millions globally,
              representing a non-commercial but scientifically validating expansion of Enveda's platform beyond I&I into
              anti-infectives. Anti-infective natural products have historically been among the most successful drug
              classes (penicillin, artemisinin). [CU027]
