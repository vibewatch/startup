  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture — PRISM Technology Stack
        blocks:
          - type: paragraph
            body: >
              Enveda's core discovery platform — internally and publicly referred to as PRISM — is a vertically
              integrated technology stack spanning physical plant libraries, high-throughput mass spectrometry,
              machine-learning models for structure and activity prediction, and a computable knowledge graph linking
              plant chemistry to human disease.

              The bottom layer is a curated physical library drawn from thousands of plant species sourced from
              biodiversity hotspots. Enveda has constructed a database of 38,000 plants cross-referenced against 12,000
              human diseases and symptoms, which guides which species are collected and prioritized for analysis.
              Biological material is processed via solvent extraction, and the resulting complex mixtures are separated
              by liquid chromatography (LC) before measurement. Critically, Enveda does not purify individual compounds
              before initial analysis — the platform is designed to operate on fractions, avoiding the bottleneck that
              has historically constrained natural-product drug discovery.

              The measurement layer uses Bruker timsTOF Pro 2 mass spectrometers, which uniquely combine high-resolution
              tandem MS/MS fragmentation with trapped ion mobility spectrometry (TIMS). The TIMS dimension provides a
              collisional cross section (CCS) value for each ion, encoding the three-dimensional shape of a molecule in
              a single number. According to a Bruker customer case study featuring Enveda Senior Scientist Pelle
              Simpson: "The timsTOF platform...performs well with both [acquisition rate and spectral quality] and
              provides a single-point encoding of a molecule's shape in the form of its collisional cross section (CCS),
              which can be utilized to link molecules between acquisitions even when separations are varied." This
              fourth dimension of data — mass, charge, fragmentation, and shape — is the primary hardware differentiator
              enabling Enveda's ML models to achieve higher specificity in structure inference than conventional MS-only
              approaches.

              The AI/ML layer is anchored by DreaMS (Deep Representations Empowering the Annotation of Mass Spectra), a
              transformer-based neural network pre-trained in a self-supervised fashion on the GeMS dataset of millions
              of unannotated MS/MS spectra mined from the GNPS/MassIVE repository. DreaMS produces 1024-dimensional
              molecular embeddings from raw spectra; fine-tuned versions achieve state-of-the-art performance on
              spectral similarity, chemical property prediction, and structure annotation tasks. The DreaMS Atlas — 201
              million MS/MS spectra annotated with DreaMS representations — is publicly accessible. Beyond DreaMS,
              Enveda applies statistical deconvolution models to link spectra from complex fractions to individual
              molecular structures, followed by bioactivity prediction and ADMET (absorption, distribution, metabolism,
              excretion, toxicity) filtering models that together score and rank candidates. The Guild open-source tool,
              released in 2026, orchestrates protein-ligand docking pipelines (Vina, DiffDock, Boltz, KarmaDock) for
              target engagement confirmation.
