        - >-
          Illustrates private market appetite for AI biology platforms without clinical proof; benchmarks the platform
          premium component of Enveda's valuation
        - >-
          Generate:Biomedicines has no clinical-stage assets; all value is platform optionality — a less favourable
          comparator than Enveda which has Phase 2a-stage assets
      - - 'BenevolentAI (Euronext: BAI)'
        - Clinical-stage; AI-assisted drug design; peaked at >£1B valuation on Euronext listing (2022)
        - Market cap collapsed from >£1B at listing to ~£50–100M by 2025; near-zero investor confidence
