  - id: TV004
    title: Comparable Valuation Table
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >
        Comparables selected to represent: (1) the closest public AI-drug-discovery platform peers with NASDAQ listings
        (RXRX, SDGR, RLAY, ABSI); (2) the most relevant private AI-drug-discovery peers at comparable development stage
        (Insilico, Generate:Biomedicines); (3) a cautionary-tale public benchmark (BenevolentAI — illustrating maximum
        AI drug discovery valuation compression risk). Isomorphic Labs (Alphabet subsidiary) and Atomwise excluded as
        not separately valued or insufficiently comparable in clinical stage.
    columns:
      - Comparable
      - Stage / Revenue
      - Market Cap / Valuation (May 2026)
      - Key Metric
      - Relevance to Enveda
      - Limitation
    rows:
      - - 'Recursion Pharmaceuticals (NASDAQ: RXRX)'
        - >-
          Clinical-stage; no product revenue; $450M+ cumulative collaboration payments; net loss $463.7M (FY2024); cash
          $594.3M (Dec 2024)
        - $1.6B market cap (Yahoo Finance, May 2026); 52-week range $2.77–$7.18
        - Market cap / accumulated collaboration payments ≈ 3.5×; stock down ~68% from 2021–2022 $5B+ peak
        - >-
          Most directly comparable AI-first drug discovery platform; NASDAQ-listed; multiple Big Pharma partnerships
          (Sanofi, Bayer, Roche/Genentech, Merck KGaA); acquired Exscientia (Nov 2024)
        - >-
          Recursion is far larger ($594M cash vs. Enveda's undisclosed); has revenue-generating collaborations; first
          clinical candidate showed no efficacy — a direct adverse comparator for AI drug discovery clinical risk
      - - 'Schrödinger, Inc. (NASDAQ: SDGR)'
        - >-
          Commercial-stage software + clinical pipeline; $255.9M total revenue (FY2025); $199.5M software revenue;
          $103.3M net loss (FY2025); ACV $198.5M
        - $994M market cap (Yahoo Finance, May 2026); analyst SELL rating noted on Yahoo Finance
        - >-
          EV / Revenue ≈ 3.9×; software provides non-dilutive revenue base that Enveda lacks; physics-based
          differentiation vs. Enveda's natural-product-AI approach
        - >-
          Closest AI-drug-discovery public peer with actual revenue; licenses software to all top-20 pharma; has own
          clinical pipeline (LRRK2, oncology)
        - >-
          Schrödinger has $200M+ in recurring software revenue — a fundamental advantage Enveda lacks; Schrödinger's
          clinical pipeline is less advanced than ENV-294 as of May 2026
      - - 'Relay Therapeutics (NASDAQ: RLAY)'
        - Clinical-stage; oncology AI-designed small molecules in Phase 1/2; no product revenue
        - $2.9B market cap (Yahoo Finance, May 2026)
        - >-
          Market cap driven by lead oncology program clinical data, not platform premium; filed 10-K (Feb 2025, SEC
          EDGAR accession 0000950170-25-027756)
        - >-
          AI-informed drug design with clinical-stage pipeline in oncology; illustrates that AI drug discovery valuation
          can remain elevated with strong clinical data
        - >-
          Relay's oncology focus and kinase-inhibitor mechanism differ materially from ENV-294's immunology and novel
          LOCKTAC mechanism; oncology commands different probability-adjusted multiples
      - - 'Absci Corporation (NASDAQ: ABSI)'
        - >-
          Preclinical-to-early-clinical; AI protein design platform; limited revenue; 10-K filed Mar 2025 (SEC EDGAR
          accession 0001950452-22-000001 domain)
        - $795M market cap (Yahoo Finance, May 2026)
        - >-
          Pure-play AI protein design; no clinical proof as of runDate; market cap reflects platform premium not
          pipeline NPV
        - AI-first drug design company; illustrates the market cap range available for pre-clinical AI platforms
        - >-
          Absci's protein design is a fundamentally different technology from Enveda's natural-product metabolomics
          platform; weaker comparable for direct valuation benchmarking
      - - Insilico Medicine (private; HK IPO filed)
        - Phase 2a (IPF, ISM-001 — AI-designed first-in-class); ~$1B last private valuation (2022 Series D)
        - >-
          ~$1B private valuation (2022); Phase 2a IPF result missed primary statistical significance threshold per STAT
          News Dec 2024 analysis
        - >-
          Clinical proof failed to materialise on primary endpoint; Phase 2a primary endpoint not met despite company
          claims of first AI-designed drug in humans
        - >-
          Most direct AI-drug-discovery private comp at similar valuation; first-in-class claim and platform-to-clinic
          narrative comparable to Enveda
        - >-
          Phase 2a failure is the key adverse data point for Enveda: it illustrates that AI-assisted discovery of a
          Phase 2-ready molecule does not guarantee Phase 2 clinical success
      - - Generate:Biomedicines (private)
        - Preclinical; AI protein design; $370M Series C (2024) at approximately $1.7B valuation
        - ~$1.7B valuation (2024 Series C)
        - >-
          Capital ratio: ~$1.7B / $370M raised ≈ 4.6×; higher than Enveda's 1.9×, reflecting AI protein design market
