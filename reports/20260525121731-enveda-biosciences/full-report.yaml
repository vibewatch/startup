    Enveda Biosciences is a clinical-stage AI-native drug discovery company headquartered in Boulder, Colorado, founded
    in 2019 by Viswa Colluru, PhD. The company builds proprietary metabolomics and mass spectrometry tools to
    systematically decode the ~99% of nature's chemical diversity that remains unexplored, then trains AI models to
