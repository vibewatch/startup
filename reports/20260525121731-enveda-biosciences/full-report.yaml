      - number: '4.3'
        title: Clinical Development Costs and Capital Intensity
        blocks:
          - type: paragraph
            body: >
              Drug development is structurally capital-intensive, and Enveda's financial planning must be evaluated
              against established cost benchmarks for each clinical stage. The FDA's drug development process
              documentation and Tufts Center for the Study of Drug Development (CSDD) benchmarks provide the most cited
              public reference points. Phase 1 trials typically cost $1–5M per study depending on indication, cohort
              size, and clinical site complexity. Phase 2 studies—which test efficacy in a targeted patient population—
              run $7–20M per study. Phase 3 confirmatory trials, required for regulatory approval, cost $40–100M+ for
              small molecule programs, with atopic dermatitis Phase 3 programs (large patient populations, long
              follow-up) at the higher end of this range. Total drug development costs from first IND to approval
              average $200–500M per drug across all phases including failures, per Tufts CSDD analyses.

              For ENV-294 specifically, the Phase 2a trials in AD and asthma (initiated December 2025) are the current
              capital consumption event. With two concurrent Phase 2a programs, Enveda's spending on this asset alone is
              likely $20–40M for completion of both indications. Phase 2b, if both Phase 2a arms succeed, would add
              another $30–60M. Phase 3 would require external capital beyond the Series D—either through a pharma
              partnership (the most capital-efficient path), additional equity raises, or a public offering. The current
              $150M Series D, even assuming lean burn on non-ENV-294 programs, does not cover the full cost of a Phase 3
              program.

              This creates a clear strategic calculus: Enveda must generate a meaningful pharma partnership (with
              upfront payment covering Phase 2b/3 costs) or raise additional capital before ENV-294 requires Phase 3
              funding. The 16 preclinical programs represent parallel option value, but they also consume capital. The
              IQVIA 2026 Global R&D Trends report notes that AI-enabled programs are showing stronger success rates in
              early-stage trials, which provides a macroeconomic tailwind for Enveda's per-program capital efficiency
              thesis. However, the same report notes that overall clinical development timelines have not shortened
              materially, meaning AI discovery acceleration does not automatically translate to faster or cheaper
              later-stage development.
