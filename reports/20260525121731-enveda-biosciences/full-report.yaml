chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Business Model
        blocks:
          - type: paragraph
            body: >
              Enveda Biosciences, also operating under the legal entity Enveda Therapeutics, Inc., is a clinical-stage
              biotechnology company headquartered at a 60,000 square-foot facility in Boulder, Colorado's Flatiron Park
              business campus. The company additionally operates an Asian headquarters in Hyderabad, India. Founded in
              2019, Enveda's core thesis is that the majority of nature's chemical diversity—estimated at 99%—remains
              unexplored, yet roughly half of all oral medicines historically originate from naturally occurring
              molecules. By building systematic tools to decode and search this hidden chemistry at scale, Enveda aims
              to produce first-in-class small-molecule drugs faster and more cheaply than the industry average.

              The company's primary platform uses AI-powered mass spectrometry (relying on Bruker timsTOF
              instrumentation integrated with machine learning since 2021), metabolomics, and a searchable database
              linking 38,000 plants to 12,000 human diseases and symptoms to identify and characterize previously
              unknown molecules from natural sources. Enveda claims its discovery platform operates approximately 4×
              faster and 10× cheaper than the pharmaceutical industry average, enabling the generation of 17 development
              candidates in roughly five years from founding. As of May 2026, the pipeline spans three clinical programs
              across four indications, six IND-enabling assets, and seventeen development candidates.

              Enveda is a wholly private, venture-backed company with no disclosed revenue, following a biotech R&D
              model in which all current value is tied to the clinical progression of its pipeline. The business model
              is asset-centric: Enveda generates and wholly owns its compounds internally, positioning for future
              out-licensing, partnership, or commercial launch milestones. The company has characterized its lead asset
              ENV-294 as having "pipeline-in-a-product" potential, potentially addressing multiple inflammatory
              indications from a single molecule.
