  - id: FV001
    title: Recommendation Logic Flow — Evidence Chain to WATCH Stance
    type: flow
    layout: wide
    summary: >
      Chain from the four evidence pillars (clinical proof, mechanism novelty, capital efficiency, investor conviction)
      and four risk factors (sector failures, Phase 1b sample size, absent financials, Phase 2a uncertainty) to the
      WATCH/TRACK recommendation with conditional BUY trigger.
    data:
      nodes:
        - id: clinical-proof
          label: |-
            Phase 1b Clinical Proof
            (85% EASI reduction, n=9, no SAEs)
          detail: 'ENV-294 Phase 1b in AD: 100% EASI-50, 78% EASI-75, 56% EASI-90; no discontinuations'
          tone: positive
          claimRefs:
            - CV015
        - id: mechanism
          label: |-
            Novel LOCKTAC Mechanism
            (Non-kinase, non-cytokine, no boxed warning)
          detail: >-
            First-in-class molecular glue that resets cellular immune response; distinct from JAK inhibitors and
            biologics
          tone: positive
          claimRefs:
            - CV016
        - id: syndicate
          label: |-
            Strong Investor Syndicate
            (Premji, Kinnevik, Sanofi, Baillie Gifford)
          detail: Total $517M raised; Series C anchored by Sanofi; Series D oversubscribed; unicorn status September 2025
          tone: positive
          claimRefs:
            - CV001
            - CV002
        - id: sector-risk
          label: |-
            AI Drug Discovery Sector Risk
            (RXRX -68%, BenevolentAI >90% loss)
          detail: >-
            STAT News Dec 2024: Recursion first drug no efficacy; Insilico Phase 2a missed primary; Exscientia acquired
            at fraction of peak
          tone: negative
          claimRefs:
            - CV018
            - CV019
        - id: phase1b-size
          label: |-
            Phase 1b Sample Size Risk
            (9 open-label patients)
          detail: Insufficient to confirm Phase 2a replication; no active comparator; randomised evidence absent
          tone: negative
          claimRefs:
            - CV020
        - id: financial-opacity
          label: |-
            Financial Opacity
            (No audited financials, no burn rate)
          detail: Exact Series D post-money undisclosed; no cash balance; Sanofi deal terms unknown
          tone: negative
          claimRefs:
            - CV039
        - id: phase2a-trigger
          label: |-
            Phase 2a Data (Expected 2026)
            (Conditional BUY trigger)
          detail: Phase 2a AD (randomised, placebo-controlled) and asthma results expected by end-2026
          tone: neutral
          claimRefs:
            - CV036
        - id: recommendation
          label: |-
            WATCH / TRACK
            (Conditional BUY at Phase 2b)
          detail: >-
            Current rNPV base $800M–$1.2B supports ~$1B+ unicorn price; insufficient evidence for BUY without Phase 2b
            data
          tone: neutral
          claimRefs:
            - CV035
