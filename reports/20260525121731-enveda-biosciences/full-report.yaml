              Enveda's ~$1 billion unicorn valuation is reported by the company in its September 2025 Series D press
              release and confirmed by BizWest (local Colorado coverage). No independent financial institution, public
              filing, or secondary-market transaction has independently corroborated this figure. Unicorn status is
