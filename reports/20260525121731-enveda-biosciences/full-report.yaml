  - id: FE001
    title: PRISM Platform Architecture — Technology Stack
    type: stack
    layout: standard
    summary: >
      Five-layer PRISM technology stack from hardware instrumentation to drug discovery output, showing the primary
      components at each layer.
    data:
      layers:
        - label: Hardware / Instrumentation
          detail: >-
            Bruker timsTOF Pro 2 provides high-resolution MS/MS combined with trapped ion mobility; LC separates complex
            plant extracts before MS measurement.
          items:
            - Bruker timsTOF Pro 2 (MS/MS + TIMS)
            - Liquid chromatography (LC) separation
            - Trapped ion mobility spectrometry (TIMS)
            - Collisional cross section (CCS) encoding
        - label: Data Acquisition & Spectral Processing
          detail: >-
            Raw spectra pipeline enriches each measured ion with CCS shape data; spectral library search and molecular
            networking link spectra to known and unknown compounds.
          items:
            - Raw MS/MS spectra pipeline
            - CCS-augmented spectral feature extraction
            - Spectral library search (GNPS-style annotation)
            - Spectral networking / molecular clustering
        - label: AI / ML Models
          detail: >-
            DreaMS transformer (Nature Biotechnology 2025) produces 1024-D molecular embeddings from raw spectra;
            downstream models predict structure, bioactivity, and ADMET profiles.
          items:
            - DreaMS transformer (1024-D molecular embeddings)
            - De novo structure prediction models
            - Bioactivity prediction models
            - ADMET prediction and liability filtering
        - label: Chemistry Library & Knowledge Graph
          detail: >-
            Cross-reference of 38,000 plants × 12,000 human diseases guides species selection; proprietary compound
            activity database accumulates hit annotations across campaigns.
          items:
            - 38,000 plants × 12,000 human diseases cross-reference
            - Plant extract physical library (1,000+ species profiled)
            - Compound activity database (proprietary)
            - Natural product structure catalog
        - label: Drug Discovery Output
          detail: >-
            Ranked hit lists feed medicinal chemistry; Guild orchestrates protein-ligand docking for target validation;
            clinical candidates advance through IND-enabling programs.
          items:
            - Hit prioritization engine
            - Hit-to-lead medicinal chemistry
            - Protein-ligand docking (Guild orchestrator)
            - Clinical candidate nomination
    approximationNotes: >
      Layer composition based on Bruker technical case study, enveda.com/platform, DreaMS GitHub repo, and Guild GitHub
      repo. Internal model architecture details are proprietary; components reflect public disclosures only.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE013
