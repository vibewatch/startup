  - id: TE002
    title: Drug Discovery Workflow — Use-Case and Step Table
    columns:
      - Workflow Step
      - Current Industry Approach
      - Enveda Solution
      - Measurable Benefit (claimed)
      - Known Limitation
    rows:
      - - Species selection
        - Empirical or ethnobotanical databases; narrow coverage
        - >-
          ML-scored database of 38,000 plants × 12,000 diseases; prioritization by therapeutic relevance and chemical
          novelty
        - Higher hit rate from pre-selected species vs random screening
        - Database coverage still partial vs 400,000 known plant species; selection bias risk
      - - Complex mixture fractionation + screening
        - Isolate pure compounds first (slow, expensive); then screen
        - Fractionate with LC; screen fraction bioactivity AND measure MS/MS simultaneously in parallel
        - Eliminates sequential bottleneck; processes thousands of fractions per week
        - Active compound identified at fraction level; isolation still required for structure confirmation
      - - Structure identification
        - NMR after isolation (requires mg quantities); slow and costly
        - ML-based de novo structure prediction from MS/MS + CCS data before isolation commitment
        - Allows structure hypotheses at trace quantities; focuses NMR investment on high-confidence candidates
        - >-
          Structure prediction is probabilistic; novel scaffold classes may lack training data for high-confidence
          predictions
      - - Bioactivity scoring and ADMET filtering
        - Sequential assay cascades; ADMET tested late
        - ML models score bioactivity and ADMET simultaneously with structure prediction; filters early
        - Early elimination of liabilities reduces costly late-stage attrition
        - Model accuracy on truly novel chemotypes (outside training distribution) uncertain
      - - Hit-to-lead and clinical development
        - Standard medicinal chemistry and CRO-dependent IND-enabling
        - >-
          Standard medicinal chemistry plus optional protein-ligand docking (Guild); outsourced GMP manufacturing; FDA
          IND filing
        - Multiple IND clearances in 2024–2025 at rate faster than industry average (claimed 4×)
        - No proprietary manufacturing; CMO dependency for GMP supply; Phase 2 powered studies pending
    notes: >
      Workflow derived from Bruker customer case study (bruker.com), Enveda platform page (enveda.com/platform), and
      bioRxiv plant chemical space preprint. Limitation column reflects independent analytical judgment and standard
      natural product drug discovery literature.
