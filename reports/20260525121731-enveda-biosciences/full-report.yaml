  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer and Stakeholder Framework for a Pre-Commercial Drug-Discovery Company
        blocks:
          - type: paragraph
            body: >
              Enveda Biosciences does not have conventional customers in the commercial sense. As a pre-commercial
              drug-discovery company founded in 2019, Enveda's business model is built around discovering novel
              small-molecule medicines from natural sources and advancing them through clinical trials with the intent
              to license or commercialize them with large pharma companies. No products have been approved, no licensing
              revenue has been disclosed, and no traditional customer contracts have been announced as of May 2026.

              For diligence purposes, the "customers" chapter must therefore frame four structurally distinct
              stakeholder groups. The first group is B2B technology and instrument partners, companies that collaborate
              with Enveda's platform team and provide scientific validation of Enveda's methodology. Bruker Daltonics is
              the most important partner in this layer, having provided its timsTOF Pro 2 mass spectrometers since 2021
              and published a named case study with verbatim quotes from Enveda scientists—this constitutes the
              strongest customer-proof evidence in the chapter. Microsoft is a second platform partner, whose
              collaboration with Enveda on the PRISM foundation model was announced in May 2024, validating the AI
              chemistry platform at scale. The Bill & Melinda Gates Foundation has partnered with Enveda to apply the
              platform to global health indications (tuberculosis, malaria), representing a philanthropic-commercial
              hybrid relationship with third-party validation weight.

              The second group is pharma investors and future licensing counterparties. Sanofi's strategic investment
              (as part of the Series C) represents a pharma industry endorsement with licensing optionality—Sanofi
              invested in Enveda while also pursuing its own competing assets in atopic dermatitis, which introduces
              both partnership depth and potential conflict-of-interest dynamics that warrant diligence. The third group
              is the ~110 clinical trial patients currently enrolled across ENV-294 Phase 2 trials in atopic dermatitis
              (60 estimated) and asthma (50 estimated) as of May 2026, representing the earliest direct engagement with
              end users. The fourth group is the future patient population—the ultimate end customers for approved
              drugs—where Enveda's four indication areas collectively represent over 140 million US patients. [CU001,
              CU002, CU003, CU004]
