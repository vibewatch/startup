      - number: '6.5'
        title: Retention, Concentration Risk, and Adverse Evidence
        blocks:
          - type: paragraph
            body: >
              Because Enveda has no commercial customers and no disclosed revenue, traditional retention metrics (NRR,
              GRR, churn) are structurally inapplicable. The relevant analog is clinical trial retention (participant
              dropout rates and Phase 1b-to-Phase 2 advancement rates) and platform partnership duration and depth.

              Platform partnership durability: Bruker timsTOF has been Enveda's core instrument platform since 2021—four
              continuous years—indicating high platform stickiness with the instrument partner. The Microsoft PRISM
              collaboration was announced in May 2024 and appears to be an ongoing research collaboration, though no
              multi-year commitment terms were disclosed. The Gates Foundation partnership duration and financial
              commitment are undisclosed. Sanofi's strategic investment in the Series C (February 2025) implies a
              multi-year investor relationship but does not guarantee any future licensing or co-development
              exclusivity. [CU028, CU029]

              Concentration risk is structurally severe at Enveda's stage. The entire commercial thesis rests on (a)
              ENV-294 succeeding in at least one of atopic dermatitis or asthma (or both), (b) attracting a pharma
              licensing partner willing to pay material milestone and royalty payments, and (c) the platform continuing
              to produce development candidates at the claimed rate. A Phase 2 failure in ENV-294 would eliminate
              Enveda's most advanced and externally validated commercial asset, with two earlier-stage programs
              (ENV-308, ENV-6946) not expected to generate licensing revenue for several years. [CU030, CU031]

              The adverse evidence is provided by the BioPharma Dive analysis of the broader I&I clinical landscape as
              of 2025. The article documents that Amgen's OX40L antibody competitor "disappointed in a Phase 3 eczema
              trial, sparking doubts among investors that amlitelimab's performance in late-stage testing might not
              match what was observed in Phase 2." It also notes Sanofi's amlitelimab "missed its mark in a mid-stage
              trial in asthma." These failures among large, well-capitalized pharma companies pursuing the same
              indications as Enveda demonstrate that Phase 2-to-Phase 3 translation in atopic dermatitis and asthma is
              highly uncertain, even with best-in-class biological understanding. The biotech sector overall is
              described as remaining "in an uncertain place" with investors "not rewarding positive clinical trial
              results as reliably as they once did." [CU032, CU033]

              Enveda has not disclosed any pharma licensing negotiations, term sheets, or pre-commercial agreements. Its
              unicorn valuation ($1B+) is investor-implied based on the September 2025 Series D at $150M raised,
              suggesting a $1B+ post-money valuation. No named future customer has expressed intent to license Enveda's
              assets. This leaves the commercial pathway entirely dependent on clinical data that has not yet been
              generated at the confirmatory Phase 2 level. [CU034, CU035]
