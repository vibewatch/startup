      - number: '3.2'
        title: General AI Drug Discovery Competitors
        blocks:
          - type: paragraph
            body: >
              Recursion Pharmaceuticals is the most direct public-market analog to Enveda in terms of being a
              clinical-stage AI-first drug discovery company. Recursion's platform ingests cell images (phenomics) at
              scale—processing up to 2.2 million samples per week and generating 36+ petabytes of proprietary data—and
              trains neural networks to map disease biology and chemical perturbation space. In 2024 Recursion completed
              the acquisition of Exscientia, a UK-based AI chemistry company, for approximately $688 million, combining
              Recursion's biology data platform with Exscientia's generative molecule design capability. Recursion's
              10-K filed 2026-02-25 explicitly identifies its TechBio competitors as Relay Therapeutics, Isomorphic
              Labs, Schrödinger, and AbCellera. The company has seven clinical-stage programs and partnerships with
              Roche/Genentech (neuroscience/oncology), Bayer, and Takeda. Recursion does not focus on natural products;
              its chemical inputs are synthesized compounds or perturbations of human cell lines.

              Schrödinger is the leading physics-based computational chemistry platform. Founded in 1990 with ~900
              employees across 12 offices, Schrödinger's FEP+ (free energy perturbation) platform is licensed by
              hundreds of pharma companies for lead optimization. Schrödinger's approach is complementary to traditional
              medicinal chemistry—it improves the odds of synthetic molecule optimization—but does not access natural
              product chemical space. Schrödinger reported Q1 2026 financial results on May 5, 2026. Its competitive
              differentiation is physics accuracy and decades of validation data; its limitation is the compute
              intensity required and the inability to explore truly novel chemical scaffolds beyond its synthesis-
              accessible design space.

              Insilico Medicine's Pharma.AI suite (PandaOmics for target ID, Chemistry42 for molecule generation,
              InClinico for trial design) powers the first AI-designed drug to reach Phase 2 clinical trials:
              INS018_055, a small molecule for idiopathic pulmonary fibrosis (IPF). Insilico raised a $110 million
              Series E in 2025 and has a $1.2 billion collaboration with Sanofi. Insilico operates from Hong Kong/New
              York with a planned IPO. It is a closer AI-discovery-to-clinic analog to Enveda than Schrödinger, but its
              target input data is genomic/transcriptomic rather than metabolomic.

              Isomorphic Labs, an Alphabet subsidiary, leverages AlphaFold3—co-developed with Google DeepMind—to predict
              protein and drug complex structures. It signed 2024 partnerships with Eli Lilly and Novartis worth up to
              approximately $3 billion in potential milestones. Isomorphic has near-unlimited compute and deep AI
              research talent but relies on structural biology inputs (protein folding) versus Enveda's chemistry-driven
              metabolomics input. Generate Biomedicines uses generative biology to design proteins from scratch, having
              generated 42,000+ proteins; its lead asset GB-0895 (anti-TSLP) is in Phase 1. Absci applies generative AI
              to antibody and biologic design with 6-week experimental cycles. Both Generate and Absci compete in the
              biologic/protein modality rather than small-molecule natural-product space.
