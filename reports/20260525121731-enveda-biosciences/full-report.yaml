      - number: '4.4'
        title: Pharma Partnership Deal Economics and Comparables
        blocks:
          - type: paragraph
            body: >
              The commercial value of Enveda's pipeline will primarily be realized through pharma partnership
              transactions rather than direct product sales, at least through the next several years of development.
              Understanding deal economics in the AI drug discovery space—and in atopic dermatitis specifically—is
              therefore essential to financial forecasting.

              The most directly comparable deal structure is Recursion Pharmaceuticals' collaboration with Sanofi,
              announced January 2022. Under this agreement, Sanofi paid $100M upfront for AI-driven small-molecule
              discovery in oncology and immunology, with up to $5.2 billion in total milestone payments plus tiered
              royalties. Recursion also received $150M upfront from Roche/Genentech in December 2021 for a
              neuroscience/oncology collaboration covering up to 40 programs with milestone potential exceeding $300M
              per program. These deals set the template for what large pharma pays for validated AI drug discovery
              platforms with clinical proof points. Enveda's ENV-294 Phase 1b data (published March 2026) is materially
              stronger validation than Recursion had when negotiating these deals—Recursion was entirely preclinical at
              the time of the Roche deal. This suggests Enveda's negotiating position for an ENV-294 licensing deal is
              stronger, though Recursion's larger breadth of indications and public company status may offset this
              advantage.

              The atopic dermatitis indication adds a revenue-upside layer not captured by platform comparables. The
              Dupixent commercial benchmark ($13.5B annual revenue, 2024) represents the aspirational ceiling for an
              approved AD biologic. An orally-administered first-in-class small molecule with ENV-294's Phase 1b profile
              (85% EASI reduction, 100% EASI-50) would command substantial partner interest. Sanofi's strategic Series C
              participation further suggests the company may already be evaluating ENV-294 as a co-development or
              licensing target. Enveda has not disclosed any licensing or collaboration payments received to date. The
              company does not appear to have entered a multi-program platform partnership analogous to Recursion's
              Roche deal, leaving the full partnership potential unrealized but intact.
