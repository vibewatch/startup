      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Phase 1b Efficacy Signal Is Exceptional for an Oral Drug in AD
            body: >
              ENV-294's Phase 1b results in 9 patients with moderate-to-severe atopic dermatitis — 100% EASI-50, 78%
              EASI-75, 56% EASI-90, mean EASI reduction of 85% at Day 42, with no serious adverse events and no
              discontinuations — are numerically superior to the Phase 2 benchmarks for most approved biologics in AD.
              KOL Jonathan Silverberg (George Washington University) stated: "if confirmed in larger studies, ENV-294
              could represent a meaningful advance in the treatment of atopic dermatitis." The response-deepening after
              treatment cessation suggests disease modification rather than symptomatic suppression, which would be
              clinically differentiated from existing JAK inhibitors. The Phase 1b dataset is small (n=9, open-label),
              but the combination of depth, speed of onset (Day 8), and post-treatment durability is notable.
            calloutType: strength
            claimRefs:
              - CE020
              - CE021
              - CE022
              - CE025
          - type: callout
            title: Phase 2 Data Gap Is the Defining Uncertainty
            body: >
              As of May 2026, ENV-294's entire clinical evidence base rests on 9 patients in an open-label, single-arm
              Phase 1b study. Phase 2a (randomized, DB, PC) trials in AD and Asthma are ongoing but unpowered data are
              not yet available. Industry-wide Phase 2 failure rates in inflammatory diseases exceed 50%. The LOCKTAC
              mechanism is novel and biologically plausible, but its human proof-of-concept in a controlled trial has
              not yet been demonstrated. Phase 2b in AD (mid-2026 target) is planned before Phase 2a data readout,
              creating a scenario where substantial capital could be deployed into a larger study before the Phase 2a
              signal is confirmed. Adverse outcomes in Phase 2a would require complete reassessment of the pipeline
              valuation thesis.
            calloutType: risk
            claimRefs:
              - CE026
              - CE027
              - CE053
          - type: callout
            title: Single-Vendor Hardware Dependency on Bruker Creates Supply Concentration Risk
            body: >
              Enveda's entire mass spectrometry data acquisition layer depends on Bruker timsTOF Pro 2 instruments — the
              only commercially available platform combining high-resolution MS/MS with trapped ion mobility (TIMS) at
              the throughput and spectral quality Enveda requires. This represents a single-vendor dependency with no
              disclosed backup. Bruker's 2023 acquisition by Brookfield Business Partners introduced private-equity
              ownership dynamics. Any disruption to Bruker's supply chain, pricing, or service availability could
              materially impair Enveda's data generation capacity. The CCS-dependent models (DreaMS, structure
              prediction) are trained on Bruker-specific spectral characteristics; switching to an alternative MS
              platform would require re-training on new spectral profiles.
            calloutType: risk
            claimRefs:
              - CE001
              - CE045
          - type: callout
            title: DreaMS Publication Validates Core ML Methodology in Peer-Reviewed Literature
            body: >
              The publication of DreaMS in Nature Biotechnology (2025) is the highest-quality independent validation
              available for Enveda's AI methodology. The DreaMS transformer was developed with scientific collaborators
              outside Enveda (Pluskal Lab, Czech Academy of Sciences / Masaryk University) and published through Nature
              Biotechnology's peer review process. Its state-of-the-art results on spectral similarity, chemical
              property prediction, and structure annotation tasks provide external validation that the core ML
              architecture underpinning Enveda's structure prediction capability is scientifically credible. The public
              availability of model weights (Zenodo) and the DreaMS Atlas (HuggingFace) also enables independent
              replication — a level of scientific transparency uncommon among AI-driven drug discovery companies.
