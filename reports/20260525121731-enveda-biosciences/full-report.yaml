      - number: '6.3'
        title: Named Partners, Collaborators, and Clinical Trial Stakeholders
        blocks:
          - type: paragraph
            body: >
              Beyond the four primary named partners, Enveda's stakeholder footprint includes clinical trial site
              operators and patient advocacy-adjacent networks that constitute the earliest evidence of end-user
              engagement.

              Clinical trial infrastructure: As of May 2026, Enveda operates three active or recently completed clinical
              trials. NCT07336940 (Phase 1b ENV-294, atopic dermatitis/healthy adults) was completed with primary
              completion in January 2026, and Enveda announced positive results in March 2026. NCT07298395 (Phase 2a
              ENV-294 atopic dermatitis) is actively recruiting with 60 estimated participants across US sites including
              Birmingham (AL), Hot Springs (AR), Beverly Hills (CA), Fremont (CA), and San Diego (CA). NCT07301255
              (Phase 2a ENV-294 asthma) is recruiting 50 estimated participants. These trials make Enveda an active
              sponsor-collaborator with academic and clinical research organizations, though specific site names beyond
              "Enveda Investigative Site" are not publicly identified. [CU012, CU013, CU014]

              Phase 1 trials for ENV-308 (obesity, IND cleared December 2025) and ENV-6946 (IBD, IND cleared December
              2025, Phase 1 initiated) further expand the clinical partner network. Nadeem Sarwar, Ph.D., was appointed
              to lead metabolic disease programs alongside ENV-308's Phase 1 initiation. [CU015, CU016]

              Enveda also recruited Mikael Dolsten (former Chief Scientific Officer of Pfizer for over a decade) to its
              board of directors as part of the Series D raise in September 2025, signaling access to a high-value
              pharmaceutical industry network. This board-level relationship—while not a commercial
              partnership—materially strengthens Enveda's future licensing partner outreach capability. [CU017]

              Future pharma licensing is Enveda's primary commercial pathway for revenue. The company has made no public
              announcements of licensing deals or co-development agreements as of May 2026. This is a material evidence
              gap: Enveda's pipeline claim of discovering drugs "4X faster than the industry average" and its Fast
              Company Most Innovative Companies in Biotech 2026 recognition have not yet translated into disclosed
              commercial partnership economics, leaving the licensing value creation unverified. [CU018, CU019]
