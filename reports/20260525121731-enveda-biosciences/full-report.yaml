      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              Enveda's four pipeline indications share a commercial channel—specialty prescription drugs sold through US
              and EU specialty pharmacy or hospital distribution—but differ materially in prescriber archetype, payer
              dynamics, and adoption barriers. For atopic dermatitis and asthma, board-certified dermatologists and
              allergists/pulmonologists serve as the primary prescribers, with decision-making concentrated among a
              relatively small number of high-volume KOLs and academic medical center practices. Patients are the end
              users, often adults with moderate-to-severe disease who have failed topical corticosteroids and at least
              one biologic. US commercial insurers and pharmacy benefit managers (PBMs) serve as primary payers, with
              step therapy and prior authorization requirements routinely applied—dupilumab itself required years of
              formulary negotiations before broad access. France's 100% biologic cost coverage for severe AD offers a
              favorable access signal in a large European market. For IBD, gastroenterologists are the key prescribing
              channel, with hospital pharmacy and infusion center logistics relevant for the early biologic treatment
              lines. The obesity indication has the broadest potential prescriber base—primary care physicians and
              endocrinologists—and payer dynamics are evolving rapidly following GLP-1 guideline issuance; however,
              commercial payer coverage for branded obesity drugs remains inconsistent in the US. Budget ownership
              across all four indications rests with specialty pharmacy benefit managers or medical benefit teams within
              health plans; employer self-insured plans are a key access gate for novel specialty therapies.
            claimRefs:
