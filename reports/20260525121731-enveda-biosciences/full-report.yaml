      - CE003
      - CE012
      - CE039
      - CE040
      - CE041
  - id: TE003
    title: Technology and Operating Architecture — Layer Breakdown
    columns:
      - Layer / Component
      - Role in Platform
      - Key Dependency
      - Primary Risk
    rows:
      - - Bruker timsTOF Pro 2 (hardware)
        - MS/MS data acquisition with TIMS; generates spectral fingerprints + CCS values for each ion
        - Single vendor (Bruker); no equivalent commercial alternative at equivalent throughput
        - Hardware supply disruption; pricing leverage concentrated in one vendor
      - - Liquid chromatography (LC)
        - Separates complex plant extracts into fractions before MS measurement
        - Standard HPLC/UHPLC equipment; multi-vendor available
        - Low risk — commodity instrumentation
      - - DreaMS transformer (ML — structure prediction)
        - >-
          Self-supervised transformer embedding MS/MS spectra into 1024-D molecular representations for structure
          inference
        - GNPS/MassIVE public spectral database for pre-training; GPU compute for inference
        - >-
          Accuracy degrades for structures far from training distribution; generalization to fully novel scaffolds
          unproven at scale
      - - Bioactivity prediction ML models
        - Scores fraction-level activity against disease-relevant pathways; linked to MS/MS spectral features
        - In-house labeled training data (proprietary); not open-sourced
        - >-
          Training data scale and diversity unknown externally; risk of false positives directing medicinal chemistry to
          inactive scaffolds
      - - ADMET prediction models
        - Filters candidates by predicted absorption, distribution, metabolism, excretion, toxicity profiles
        - In-house and commercial models; standard in industry
        - Moderate — commercial benchmarks available for calibration; main risk is novel chemotype extrapolation
      - - Guild (protein-ligand docking orchestrator)
        - Orchestrates Vina, DiffDock, Boltz, KarmaDock docking methods for target validation
        - Docker; public docking tools (Vina, AlphaFold/Boltz); MIT license
        - Computational docking has known accuracy limits; requires experimental confirmation
      - - Chemistry library and knowledge graph
        - Database of 38,000 plants × 12,000 diseases; compound activity records; spectral annotations
        - Ongoing data generation; proprietary curation
        - Proprietary lock-in risk is moat; but also means no independent validation of library quality or coverage
      - - CMO / CRO ecosystem
        - GMP clinical supply manufacturing; GLP toxicology studies; clinical CRO services
        - External CMOs and CROs; no in-house GMP capability disclosed
        - CMO schedule and capacity risk; cost scale-up for Phase 2b and beyond
    notes: >
