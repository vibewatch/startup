  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: licensing-gap
      missingEvidence: >
        Any pharma licensing deal, co-development term sheet, or letter of intent for ENV-294,
        ENV-308, or ENV-6946.
      whyItMatters: >
        Enveda's entire commercial value creation pathway depends on pharma licensing, which has
        not been publicly announced 15 months after Sanofi's strategic investment.
      diligencePath: >
        Request full investor data room; ask specifically for any NDAs, MOUs, or term sheets with
        pharma companies; request a list of all licensing discussions with current status.
      relatedQuestionRefs: [QU003, QU010]
      relatedTableRefs: [TU002, TU003]

    - type: private-evidence-only
      severity: material
      topic: sanofi-partnership
      missingEvidence: >
        Full terms of Sanofi's investment agreement, including ROFR on ENV-294 licensing,
        board seat or observer rights, co-development options, and exclusivity provisions.
      whyItMatters: >
        Sanofi's simultaneous investor and competitor roles create structural conflicts; without
        the investment agreement terms, the nature and constraints of this relationship cannot
        be assessed.
      diligencePath: >
        Request the Sanofi investment agreement from the data room; specifically identify any
        licensing rights, ROFR provisions, and exclusivity clauses.
      relatedQuestionRefs: [QU002, QU011]

    - type: enumeration-incomplete
      severity: material
      topic: named-partners-collaborators
      missingEvidence: >
        Confirmation of named pharma partnerships or licensing discussions beyond the four
        publicly disclosed collaborators (Bruker, Microsoft, Sanofi, Gates Foundation).
      whyItMatters: >
        Four named partners is an unusually thin collaboration footprint for a unicorn-stage
        biotech. The absence of named CRO or academic collaborators also leaves clinical
        execution risk unassessed.
      diligencePath: >
        Request a full list of named collaborators, CROs, academic partners, and potential
        licensing counterparties from management; verify all sites for Phase 2 trials.
      relatedQuestionRefs: [QU001, QU019, QU020]
      relatedTableRefs: [TU003]

    - type: missing-source
      severity: material
      topic: env294-clinical-data
      missingEvidence: >
        Specific ENV-294 Phase 1b efficacy endpoints met (e.g., SCORAD, EASI reduction %),
