figures:
  - id: FU001
    title: Enveda Stakeholder Journey Map
    type: journey-map
    layout: wide
    summary: >
      Maps four stakeholder segments—B2B Technology Partners, Pharma Investors, Clinical Trial
      Patients, and Future Patient End Users—through Enveda's pre-commercial engagement stages
      from platform adoption to potential drug commercialization.
    data:
      items:
        - label: "Platform Discovery"
          detail: "B2B Tech Partners: scientific publications, Bruker co-development, Microsoft AI ecosystem. Pharma Investors: Series C/D fundraising process, pitch materials, pipeline data room. Patients: not yet engaged."
        - label: "Technical Validation"
          detail: "B2B Tech Partners: Bruker timsTOF integration (2021), CCS data quality assessment, PRISM model training (Microsoft, 2024). Pharma Investors: due diligence, Sanofi strategic review leading to Series C investment (Feb 2025). Patients: IND clearance as regulatory prerequisite."
        - label: "Partnership Formation"
          detail: "B2B Tech Partners: Bruker case study publication, PRISM collaboration announcement. Pharma Investors: Sanofi strategic investment completed; Gates Foundation partnership on anti-infectives. Clinical Patients: Phase 1b enrollment (NCT07336940, Sep 2025) and Phase 2a enrollment (AD + asthma, Dec 2025 onwards)."
        - label: "Clinical Proof Generation"
          detail: "B2B Tech Partners: Ongoing platform iteration. Pharma Investors: awaiting Phase 2 readout (December 2026 expected). Clinical Patients: Phase 1b completed January 2026; Phase 2a active enrollment 110 patients. Patient End Users: not yet exposed."
        - label: "Commercial Licensing (Target)"
          detail: "B2B Tech Partners: Platform licensing or instrument supply scale-up. Pharma Investors: Exit or licensing optionality trigger. Future Patients: post-licensing clinical development, NDA submission, approval, market access. No commercial events have occurred as of May 2026."
    approximationNotes: >
      Journey stage timing is estimated from press release dates and ClinicalTrials.gov data. No
      commercial events beyond equity investment have been confirmed. All future stages are
      projected based on disclosed clinical timelines.
