callouts:
  - calloutType: strength
    title: Bruker Partnership Constitutes the Most Credible Customer-Proof Signal
    body: >
      The Bruker Daltonics customer insight page—authored by Bruker and featuring verbatim quotes
      from Enveda's Senior Scientist (Pelle Simpson) and CTO (August Allen)—is the highest-quality
      customer-proof evidence in this chapter. It confirms that the timsTOF Pro 2 is a core,
      production-deployed element of Enveda's drug-discovery workflow since 2021, with explicitly
      stated scientific advantages (CCS data quality, MS/MS fragmentation clarity). This four-year
      production deployment with a named instrument partner distinguishes Enveda from earlier-stage
      AI drug-discovery companies with only conceptual platform claims.
    claimRefs: [CU005, CU006]

  - calloutType: risk
    title: Zero Disclosed Pharma Licensing Deals Is a Material Commercial Diligence Gap
    body: >
      Despite reaching unicorn valuation ($1B+ post-money implied by September 2025 Series D),
      Enveda has not announced a single pharma licensing deal, co-development agreement, or
      pre-commercialization term sheet as of May 2026. A comprehensive review of Enveda's news
      sitemap, Sanofi's press releases, and biotech news databases found no such announcement.
      For a company claiming 4X faster drug discovery than the industry average, the absence of a
      commercial licensing arrangement with any pharma company represents the primary financial
      risk to the investment thesis and should be a mandatory diligence ask in any data room.
    claimRefs: [CU018, CU019, CU034]

  - calloutType: risk
    title: Sanofi Is Both Strategic Investor and Direct Competitor in Atopic Dermatitis
    body: >
      Sanofi invested in Enveda's Series C (February 2025) while simultaneously advancing
      amlitelimab into Phase 3 for atopic dermatitis—the same primary indication as ENV-294.
      As of March 2026, Sanofi presented Phase 3 amlitelimab data at the AAD meeting. This creates
      a structural conflict of interest: Enveda's most important financial backer is also its
      most direct competitive threat in the atopic dermatitis market. Diligence should verify the
      ROFR and exclusivity provisions in the Sanofi investment agreement.
    claimRefs: [CU009, CU032]

  - calloutType: insight
    title: Enveda's "Customer" Universe Will Evolve Rapidly as Phase 2 Data Matures
    body: >
      Phase 2 data for ENV-294 in atopic dermatitis is expected in December 2026 per
      ClinicalTrials.gov. If positive, this will be the first time Enveda can negotiate licensing
      with Phase 2 efficacy data in hand—historically a major inflection point in pharma partnership
      valuation. The asthma Phase 2 data, also expected in late 2026, could double the licensing
      opportunity. Investors should benchmark against analogous natural-product-derived drug
      licensing deals (e.g., Tango Therapeutics, Relay Therapeutics) to calibrate fair milestone
      and royalty expectations.
    claimRefs: [CU013, CU020, CU021, CU022]

