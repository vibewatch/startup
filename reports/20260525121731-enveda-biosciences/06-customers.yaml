company:
  name: Enveda Biosciences

chapter:
  number: 6
  title: Customers
  summary: >
    Enveda is a pre-commercial drug-discovery company with no traditional paying customers as of
    May 2026. Its "customer" universe comprises four layers: (1) B2B instrument and technology
    partners—Bruker Daltonics (timsTOF Pro 2 since 2021, with named scientist quotes constituting
    the chapter's primary customer-proof), Microsoft (PRISM foundation-model collaboration, 2024),
    and the Bill & Melinda Gates Foundation (TB/malaria partnership); (2) strategic pharma investor
    Sanofi, which led the February 2026 Series C top-up bringing total Series C financing to $150M;
    (3) future pharma licensees who would pay milestone and royalty payments for Enveda's clinical
    assets; and (4) patients with atopic dermatitis (~16M US), asthma (~28M US), IBD (~3M US), and
    obesity (~100M US adults), who represent the ultimate end-user population. The strongest
    customer-proof evidence is the Bruker case study featuring verbatim quotes from two named
    Enveda scientists. No commercial licensing revenue, no disclosed partnership economics, and no
    named pharma co-development agreements have been published, representing a material gap for
    pre-revenue due diligence. The adverse signal is the BioPharma Dive industry analysis showing
    that competing drugs in Enveda's exact indications (Sanofi's amlitelimab in AD and asthma,
    Amgen's competitor in eczema) have encountered Phase 2-to-Phase 3 translation failures,
    illustrating the clinical-stage risk facing Enveda.

sections:
  - id: customer-stakeholder-framework
    title: Customer and Stakeholder Framework for a Pre-Commercial Drug-Discovery Company
    body: >
      Enveda Biosciences does not have conventional customers in the commercial sense. As a
      pre-commercial drug-discovery company founded in 2019, Enveda's business model is built
      around discovering novel small-molecule medicines from natural sources and advancing them
      through clinical trials with the intent to license or commercialize them with large pharma
      companies. No products have been approved, no licensing revenue has been disclosed, and no
      traditional customer contracts have been announced as of May 2026.

      For diligence purposes, the "customers" chapter must therefore frame four structurally distinct
      stakeholder groups. The first group is B2B technology and instrument partners, companies that
      collaborate with Enveda's platform team and provide scientific validation of Enveda's
      methodology. Bruker Daltonics is the most important partner in this layer, having provided its
      timsTOF Pro 2 mass spectrometers since 2021 and published a named case study with verbatim
      quotes from Enveda scientists—this constitutes the strongest customer-proof evidence in the
      chapter. Microsoft is a second platform partner, whose collaboration with Enveda on the PRISM
      foundation model was announced in May 2024, validating the AI chemistry platform at scale.
      The Bill & Melinda Gates Foundation has partnered with Enveda to apply the platform to global
      health indications (tuberculosis, malaria), representing a philanthropic-commercial hybrid
      relationship with third-party validation weight.

      The second group is pharma investors and future licensing counterparties. Sanofi's strategic
      investment (as part of the Series C) represents a pharma industry endorsement with licensing
      optionality—Sanofi invested in Enveda while also pursuing its own competing assets in
      atopic dermatitis, which introduces both partnership depth and potential conflict-of-interest
      dynamics that warrant diligence. The third group is the ~110 clinical trial patients currently
      enrolled across ENV-294 Phase 2 trials in atopic dermatitis (60 estimated) and asthma
      (50 estimated) as of May 2026, representing the earliest direct engagement with end users.
      The fourth group is the future patient population—the ultimate end customers for approved
      drugs—where Enveda's four indication areas collectively represent over 140 million US patients.
      [CU001, CU002, CU003, CU004]
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: partner-segmentation
    title: Named Partner Segmentation and Relationship Evidence
    body: >
      Enveda's current partner base comprises four named external organizations, each serving
      a different strategic function and representing a distinct quality of customer-proof evidence.

      Bruker Daltonics is Enveda's most comprehensively documented B2B partner. The relationship
      began in 2021 when Enveda adopted the timsTOF Pro 2 mass spectrometer for its metabolomics
      platform. Bruker published a formal customer insight case study on its website, featuring
      verbatim quotes from Pelle Simpson (Senior Scientist, Enveda): "The challenge in the industry
      is no longer the acquisition of MS/MS spectra itself but the rate of acquisition and the
      quality of the spectra. This is where the timsTOF platform has set itself apart from its
      competitors." August Allen (CTO, Enveda) added: "We will continue building the largest
      metabolomics dataset, purpose-built for machine learning, and applying active learning
      strategies." This case study, published by Bruker, constitutes the primary customer-proof
      source for this chapter—a jointly-sanctioned publication in which Enveda's senior scientific
      leadership explicitly endorses the instrument partner's product. [CU005, CU006]

      Microsoft is a technology collaboration partner announced in May 2024. Enveda developed the
      PRISM foundation model in collaboration with Microsoft, described as a model to "read and
      translate" the chemistry of natural samples. The collaboration provides Enveda with cloud AI
      infrastructure and legitimizes the scientific basis of its machine learning claims. No
      financial terms were disclosed. [CU007]

      Sanofi made a strategic investment in Enveda as part of the Series C round in February 2025,
      bringing total Series C financing to $150M. This represents pharma industry validation from
      one of the world's largest specialty I&I companies. Importantly, Sanofi also has its own
      atopic dermatitis pipeline (amlitelimab in Phase 3, per Sanofi press releases as of
      March 2026), which means the relationship encompasses both strategic investment and
      therapeutic-area competition. No licensing or co-development agreement terms were disclosed
      beyond the equity investment. [CU008, CU009]

      The Bill & Melinda Gates Foundation partnership, disclosed on Enveda's purpose page, involves
      applying Enveda's natural-product discovery platform to infectious disease indications
      including tuberculosis, malaria, and other global health priorities. No grant amounts or
      milestones are publicly documented in the Gates Foundation committed-grants database, which
      may indicate the relationship is a direct charitable contract or Program Related Investment
      rather than a traditional grant (the database excludes those formats per its own disclosure).
      This partnership significantly expands Enveda's total addressable patient base beyond I&I into
      global infectious disease. [CU010, CU011]
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: named-partners-collaborators
    title: Named Partners, Collaborators, and Clinical Trial Stakeholders
    body: >
      Beyond the four primary named partners, Enveda's stakeholder footprint includes clinical
      trial site operators and patient advocacy-adjacent networks that constitute the earliest
      evidence of end-user engagement.

      Clinical trial infrastructure: As of May 2026, Enveda operates three active or recently
      completed clinical trials. NCT07336940 (Phase 1b ENV-294, atopic dermatitis/healthy adults)
      was completed with primary completion in January 2026, and Enveda announced positive results
      in March 2026. NCT07298395 (Phase 2a ENV-294 atopic dermatitis) is actively recruiting with
      60 estimated participants across US sites including Birmingham (AL), Hot Springs (AR), Beverly
      Hills (CA), Fremont (CA), and San Diego (CA). NCT07301255 (Phase 2a ENV-294 asthma) is
      recruiting 50 estimated participants. These trials make Enveda an active sponsor-collaborator
      with academic and clinical research organizations, though specific site names beyond
      "Enveda Investigative Site" are not publicly identified. [CU012, CU013, CU014]

      Phase 1 trials for ENV-308 (obesity, IND cleared December 2025) and ENV-6946 (IBD, IND
      cleared December 2025, Phase 1 initiated) further expand the clinical partner network.
      Nadeem Sarwar, Ph.D., was appointed to lead metabolic disease programs alongside ENV-308's
      Phase 1 initiation. [CU015, CU016]

      Enveda also recruited Mikael Dolsten (former Chief Scientific Officer of Pfizer for over a
      decade) to its board of directors as part of the Series D raise in September 2025, signaling
      access to a high-value pharmaceutical industry network. This board-level relationship—while
      not a commercial partnership—materially strengthens Enveda's future licensing partner
      outreach capability. [CU017]

      Future pharma licensing is Enveda's primary commercial pathway for revenue. The company has
      made no public announcements of licensing deals or co-development agreements as of May 2026.
      This is a material evidence gap: Enveda's pipeline claim of discovering drugs "4X faster than
      the industry average" and its Fast Company Most Innovative Companies in Biotech 2026
      recognition have not yet translated into disclosed commercial partnership economics, leaving
      the licensing value creation unverified. [CU018, CU019]
    claimRefs: [CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: patient-end-user-segments
    title: Patient End-User Segments and Market Sizing
    body: >
      Enveda's four lead clinical indications address some of the largest unmet medical needs in
      medicine, with collective US patient populations exceeding 140 million and significant
      treatment inadequacy across all four.

      Atopic dermatitis (eczema): The US atopic dermatitis patient population is estimated at
      approximately 16 million, with moderate-to-severe disease affecting roughly 10–25% of that
      group. The market is served by biologics (Dupixent generated ~$14B in annual global sales
      for Sanofi/Regeneron in 2024) and emerging JAK inhibitors. ENV-294's clinical profile—
      described as a "Dupi-like efficacy and safety profile" with "pan-endotype potential"—directly
      targets inadequate responders to existing oral therapies. Phase 2a in atopic dermatitis is
      currently recruiting (60 patients, primary completion December 2026). [CU020, CU021]

      Asthma: 28 million Americans have asthma (AAFA, 2026 data), of whom approximately 23 million
      are adults. About 8% of the US population is affected. Asthma represents ENV-294's second
      indication with a Phase 2a trial (50 patients) currently recruiting, demonstrating ENV-294's
      potential pipeline-in-a-product value beyond atopic dermatitis. The same molecule targets
      both indications, which compresses development cost and timeline if both Phase 2s succeed.
      [CU022, CU023]

      Inflammatory Bowel Disease (IBD): ENV-6946, targeting TL1A+ pathway as a novel "multi-biologic
      in a pill" mechanism, is in Phase 1 for IBD. The US IBD population (Crohn's disease plus
      ulcerative colitis) is estimated at 3 million, with significant treatment inadequacy in
      Crohn's disease specifically. ENV-6946 received US FDA IND clearance and initiated Phase 1
      in December 2025. [CU024]

      Obesity/Chronic Weight Maintenance: ENV-308 is a first-in-class oral small molecule for
      chronic weight maintenance, with IND clearance and first patient dosed in December 2025.
      US adult obesity prevalence is approximately 42% of adults, with over 100 million US adults
      meeting obesity criteria (BMI ≥30). The GLP-1 receptor agonist class (Zepbound, Wegovy)
      has validated massive commercial potential; ENV-308's mechanism (hormone mimetic) would
      need to demonstrate differentiation to compete effectively. [CU025, CU026]

      Global health (Gates Foundation): TB and malaria collectively affect hundreds of millions
      globally, representing a non-commercial but scientifically validating expansion of Enveda's
      platform beyond I&I into anti-infectives. Anti-infective natural products have historically
      been among the most successful drug classes (penicillin, artemisinin). [CU027]
    claimRefs: [CU020, CU021, CU022, CU023, CU024, CU025, CU026, CU027]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: retention-concentration-risks
    title: Retention, Concentration Risk, and Adverse Evidence
    body: >
      Because Enveda has no commercial customers and no disclosed revenue, traditional retention
      metrics (NRR, GRR, churn) are structurally inapplicable. The relevant analog is clinical
      trial retention (participant dropout rates and Phase 1b-to-Phase 2 advancement rates) and
      platform partnership duration and depth.

      Platform partnership durability: Bruker timsTOF has been Enveda's core instrument platform
      since 2021—four continuous years—indicating high platform stickiness with the instrument
      partner. The Microsoft PRISM collaboration was announced in May 2024 and appears to be an
      ongoing research collaboration, though no multi-year commitment terms were disclosed. The
      Gates Foundation partnership duration and financial commitment are undisclosed. Sanofi's
      strategic investment in the Series C (February 2025) implies a multi-year investor
      relationship but does not guarantee any future licensing or co-development exclusivity.
      [CU028, CU029]

      Concentration risk is structurally severe at Enveda's stage. The entire commercial thesis
      rests on (a) ENV-294 succeeding in at least one of atopic dermatitis or asthma (or both),
      (b) attracting a pharma licensing partner willing to pay material milestone and royalty
      payments, and (c) the platform continuing to produce development candidates at the claimed
      rate. A Phase 2 failure in ENV-294 would eliminate Enveda's most advanced and externally
      validated commercial asset, with two earlier-stage programs (ENV-308, ENV-6946) not expected
      to generate licensing revenue for several years. [CU030, CU031]

      The adverse evidence is provided by the BioPharma Dive analysis of the broader I&I clinical
      landscape as of 2025. The article documents that Amgen's OX40L antibody competitor
      "disappointed in a Phase 3 eczema trial, sparking doubts among investors that amlitelimab's
      performance in late-stage testing might not match what was observed in Phase 2." It also
      notes Sanofi's amlitelimab "missed its mark in a mid-stage trial in asthma." These failures
      among large, well-capitalized pharma companies pursuing the same indications as Enveda
      demonstrate that Phase 2-to-Phase 3 translation in atopic dermatitis and asthma is highly
      uncertain, even with best-in-class biological understanding. The biotech sector overall is
      described as remaining "in an uncertain place" with investors "not rewarding positive clinical
      trial results as reliably as they once did." [CU032, CU033]

      Enveda has not disclosed any pharma licensing negotiations, term sheets, or pre-commercial
      agreements. Its unicorn valuation ($1B+) is investor-implied based on the September 2025
      Series D at $150M raised, suggesting a $1B+ post-money valuation. No named future customer
      has expressed intent to license Enveda's assets. This leaves the commercial pathway entirely
      dependent on clinical data that has not yet been generated at the confirmatory Phase 2 level.
      [CU034, CU035]
    claimRefs: [CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU005]

