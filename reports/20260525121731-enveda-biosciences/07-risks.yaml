  - id: mitigations-kill-criteria
    title: Mitigations and Kill Criteria
    body: >
      Enveda has several structural mitigants for the risk profile described above. On the
      clinical side, the positive Phase 1b data in nine AD patients (March 2026) provides
      biological proof-of-concept that ENV-294 reaches target tissue and modulates the relevant
      pathway, reducing (though not eliminating) Phase 2 failure probability from pure mechanism
      uncertainty to dose/exposure and population variability. The Phase 2a trials are appropriately
      sized (60 AD, 50 asthma) and blinded with validated endpoints (EASI, vIGA, FEV1, ACQ-5).

      On IP, the company appears to be pursuing composition-of-matter patents on novel synthetic
      analogs rather than natural compounds per se—a more defensible approach. For Nagoya Protocol
      compliance, systematic benefit-sharing agreements executed before compound collection are the
      appropriate mitigation; the company should maintain documented provenance for each accession.

      On capital, a pharma partnership deal—licensing ENV-294 post-Phase 2 data—would substantially
      extend runway and validate the thesis. Several large-pharma AD programs (Sanofi/Regeneron
      for dupilumab, AstraZeneca for tezepelumab) have demonstrated the commercial viability of
      Phase 2-partnered molecules. Enveda would benefit from initiating partnering discussions
      pre-Phase 2 data, as post-data negotiations typically command a higher price but require
      positive results.

      Four kill-criteria triggers are identified: (1) Phase 2a ENV-294 AD trial fails to achieve
      ≥30% EASI improvement over placebo at Week 12 with statistical significance—discontinue
      AD program and reassess asthma positioning; (2) both Phase 2a AD and asthma trials fail
      simultaneously—strong indicator to restructure pipeline and potentially consolidate clinical
      programs; (3) Nagoya Protocol compliance audit reveals undocumented plant accessions for
      any commercial compound—requires immediate remediation program and may create regulatory
      filing delay; (4) Series E capital raise at valuation below $800 million (>20% down-round
      from Series D)—indicates loss of investor conviction requiring strategic review including
      partnership or acquisition path.
    claimRefs:
      - CR026
      - CR027
      - CR028
      - CR029
      - CR030
    tableRefs:
      - TR005

