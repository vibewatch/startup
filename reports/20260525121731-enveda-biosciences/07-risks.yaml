      topic: "Nagoya Protocol compliance documentation for ENV-294, ENV-308, ENV-6946 source plants"
      description: >
        Enveda has not publicly disclosed any ABS Clearing-House registration numbers, PIC/MAT
        agreements, or country-of-origin compliance certificates for the plant accessions used to
        discover its clinical compounds. The Nagoya Protocol (in force since October 2014) requires
        documentation per genetic resource utilization event. Systematic compliance at 38,000-plant
        library scale is a significant operational commitment that cannot be verified from public
        sources and requires data-room access.
