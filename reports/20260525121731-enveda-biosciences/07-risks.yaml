  - id: operational-people-risks
    title: Operational, People, and Platform Risks
    body: >
      Key-person risk is elevated and structurally concentrated. Viswa Colluru (CEO/co-founder)
      is the public face, scientific architect, and primary fundraising lead of Enveda. As a
      founder-CEO at an early-clinical-stage biotech, his departure—voluntary or otherwise—could
      create significant investor confidence disruption, partnership renegotiation risk, and
      talent flight. No public succession planning has been disclosed. Scientific advisory board
      turnover, particularly loss of Cynthia He (biology) or Craig Crews-adjacent mentors, would
      reduce the scientific credibility signal to pharma partners.

      Mass spectrometry data integrity represents a platform-level operational risk. Enveda's
      compound library of 38,000+ plant-linked molecules depends on reproducible MS/MS spectral
      annotation. If systematic errors in spectral matching, retention time calibration, or
      molecular formula assignment were to be identified—whether through internal audit or
      external challenge—the validity of the compound-disease linkage database would be questioned.
      This is analogous to data integrity concerns that have damaged other omics-platform companies
      (Theranos, to an extreme; proteomics companies more modestly). Enveda has not publicly
      disclosed audit procedures for its spectral database.

      Biodiversity supply chain risk is material: sourcing plant material from biodiverse regions
      requires field collection, which depends on geopolitical stability, seasonal access, export
      permit continuity, and local partner relationships in countries that may have complex
      regulatory environments for genetic resource export. Disruption to any high-priority plant
      collection region could delay compound discovery timelines.

      Manufacturing and CMC (chemistry, manufacturing, and controls) risk is non-trivial for
      naturally derived compounds: scaling up synthesis of complex natural product analogs is
      typically more complex than for fully synthetic small molecules, and characterization of
      impurity profiles in natural-product-derived APIs may require significant analytical
      development. As Enveda advances ENV-294 and ENV-308 toward Phase 3, CMC complexity will
      increase.
