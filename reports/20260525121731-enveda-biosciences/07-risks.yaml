callouts:
  - id: RK001
    calloutType: risk
    title: "December 2026 Dual Phase 2a Binary Risk"
    body: >
      Both ENV-294 Phase 2a trials (AD: NCT07298395, 60 participants; asthma: NCT07301255,
      50 participants) have estimated primary completion dates in December 2026. This creates
      a correlated binary risk event where two thesis-critical readouts occur simultaneously,
      with limited time to course-correct before the likely Series E financing window. A
      dual failure scenario would be thesis-breaking.
    claimRefs:
      - CR001
      - CR002

  - id: RK002
    calloutType: risk
    title: "Nagoya Protocol Compliance Is Not Optional"
    body: >
      The Nagoya Protocol on Access and Benefit-Sharing (in force since October 2014) creates
      binding prior informed consent and benefit-sharing obligations for every plant accession
      sourced from a CBD signatory country and used to identify a commercial compound. For a
      company with a library of 38,000+ plant samples from biodiverse ecosystems, compliance
      requires systematic documentation at scale—this is not a checkbox. Investor diligence
      should request access to the ABS Clearing-House compliance records for ENV-294's
      source material before committing capital.
    claimRefs:
      - CR009
      - CR010

  - id: RK003
    calloutType: risk
    title: "AI Drug Discovery Multiple Compression: A Sector-Wide Adverse Signal"
    body: >
      Public AI drug discovery comparables have significantly underperformed expectations.
      Recursion Pharmaceuticals (NASDAQ: RXRX) CEO Chris Gibson announced in April 2026 he
      would not seek re-election—a leadership transition signal at a company that raised
      billions on AI-biology premises. BenevolentAI entered administration in 2024. These
      signals create a negative reference frame for Series E pricing of private AI pharma
      companies like Enveda, regardless of individual pipeline quality.
    claimRefs:
      - CR013
      - CR017
      - CR019

  - id: RK004
    calloutType: risk
    title: "Natural-Product IP Is Structurally Weaker Than Synthetic Drug IP"
    body: >
      Post-Alice/Mayo doctrine and the USPTO's heightened 35 U.S.C. § 101 scrutiny for
      naturally occurring substances means that Enveda's core compound scaffolds derived from
      plant sources require careful claim drafting to achieve composition-of-matter protection.
      Additionally, traditional knowledge prior art (Ayurvedic formularies, ethnobotanical
      databases) creates obviousness risks that are not always screened in standard prior art
      searches. Freedom-to-operate risk is structurally higher than for fully synthetic small
      molecule portfolios.
    claimRefs:
      - CR008
      - CR011

