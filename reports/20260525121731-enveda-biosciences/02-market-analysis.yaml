callouts:
  - calloutType: strength
    title: Oral Route Advantage in a Biologic-Dominated Market Creates a Structural Opening
    body: >
      Moderate-to-severe AD and asthma are dominated by injectable biologics (dupilumab, mepolizumab,
      benralizumab) that require clinic visits or patient self-injection training and carry annual list prices
      of $15,000–$35,000. Patient and prescriber preference for oral once-daily dosing is well-documented
      across dermatology and rheumatology, and JAK inhibitors (upadacitinib, abrocitinib) captured meaningful
      AD market share precisely because of their oral formulation despite black-box safety caveats. ENV-294's
      Phase 1b results—100% EASI-50, 78% EASI-75—at a "JAK-inhibitor-like efficacy profile" from a mechanism
      without known kinase liability represents a potentially differentiated positioning. If Phase 2b confirms
      this profile at scale, ENV-294's oral non-kinase mechanism could command a premium access position
      over injectable biologics and avoid the safety-driven prescriber hesitancy limiting JAK inhibitor uptake.
    claimRefs:
      - CM007
      - CM031
      - CM032
      - CM005

  - calloutType: risk
    title: High Competitive Bar and Payer Access Hurdles May Delay or Compress Commercial Opportunity
    body: >
      Dupilumab has set an exceptionally high efficacy bar in moderate-to-severe AD, achieving EASI-75 rates
      of 36–38% at 16 weeks as monotherapy and higher in combination with topical corticosteroids; it has also
      expanded into asthma, nasal polyposis, and eosinophilic esophagitis, creating a multi-indication franchise
      that payers already understand. A new entrant with ENV-294 will face formulary step therapy requirements
      demanding dupilumab failure before authorization, compressing the initial patient access opportunity to
      a biologic-refractory segment. Additionally, the AI drug discovery category has experienced high-profile
      clinical failures (Insilico Medicine Phase 2a, Recursion Phase 2) that have raised investor and payer
      scrutiny on mechanistic novelty claims from AI-derived candidates. Enveda must generate Phase 2b data
      that unambiguously differentiates ENV-294 by safety, oral route, and/or dual-indication coverage to
      overcome these access and perception barriers before a competitive first-in-class window closes.
