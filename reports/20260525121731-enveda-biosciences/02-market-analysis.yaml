  - id: growth-drivers-and-adoption-constraints
    title: Growth Drivers and Adoption Constraints
    body: >
      Multiple structural forces are expanding the market Enveda is entering. Globally rising atopic disease
      prevalence—linked to urbanization, pollution, and the hygiene hypothesis—is growing the diagnosed and
      treated population faster than historical rates, particularly in Asia. The WHO's December 2025 GLP-1
      therapy guidelines legitimize obesity as a chronic disease requiring pharmaceutical management, opening
      formulary access pathways previously unavailable to non-GLP-1 agents. Small molecule oral therapies
      command a strong patient preference over injectable biologics when comparable efficacy is demonstrated,
      and ENV-294's Phase 1b data suggesting JAK-inhibitor-like efficacy from an oral agent positions it
      favorably in this preference dynamic. AI-enabled drug discovery platforms are showing early evidence of
      stronger Phase 1-to-Phase 2 success rates in IQVIA's 2026 analysis, providing an emerging reputational
      tailwind for companies like Enveda that lead with platform credibility. Enveda's total $517 million
      raised, including a $150 million Series D at unicorn valuation in September 2025 and Sanofi's
      participation in the Series C, signals strong investor and strategic partner confidence.

      On the constraint side, the AD market is highly competitive: dupilumab's dominant position, approved
      JAK inhibitors (upadacitinib, abrocitinib) with black-box safety warnings that have reshaped prescriber
      habits, and the incoming lebrikizumab and tralokinumab create a crowded landscape where a new entrant
      must demonstrate differentiation on mechanism, safety, or convenience. Mixed AI drug discovery outcomes
      through 2025—Insilico Medicine's Phase 2a failure and Recursion's Phase 2 non-efficacy—have raised
      investor scrutiny for the category. Drug development timelines remain long (more than seven years from
      target to first Phase 1 as a historical benchmark), and inter-trial intervals grew by approximately
      three months industry-wide in 2025 per IQVIA, suggesting that platform-based speed claims face real
      operational friction at clinical execution stages.
