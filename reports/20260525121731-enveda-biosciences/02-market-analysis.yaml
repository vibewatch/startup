        Without an independent SOM estimate, the market opportunity is characterized only by indicative
        analogues; conviction on the commercial size of the prize is materially limited.
      relatedQuestionRefs: [QM024]

    - type: private-evidence-only
      severity: material
      topic: "ENV-294 molecular target"
      missingEvidence: >
        ENV-294's precise molecular target has been described only as "a novel non-kinase inflammatory pathway
        distinct from JAK-STAT or cytokine signaling." The actual target is apparently proprietary and has not
        been disclosed in public filings, press releases, or peer-reviewed publications. Independent mechanistic
        validation requires confidential data room access to structural biology or target ID data.
      whyItMatters: >
        Undisclosed targets cannot be independently validated for selectivity, off-target liability, or
        freedom-to-operate. The mechanism claim is central to the investment thesis.
      relatedQuestionRefs: [QM025]

    - type: missing-source
      severity: material
      topic: "FDA regulatory designations for Enveda pipeline"
      missingEvidence: >
        No public FDA correspondence, press release, or ClinicalTrials.gov record confirms that Enveda has
        received Fast Track, Breakthrough Therapy, or any other expedited designation for ENV-294, ENV-308,
        or ENV-6946. Diligence should request FDA designation correspondence from Enveda's regulatory affairs team.
      whyItMatters: >
        Breakthrough Therapy designation would accelerate Phase 2b/3 timelines and signal FDA's recognition
        of unmet need; its absence is a material diligence gap for timeline and risk modeling.
      relatedQuestionRefs: [QM026]

    - type: private-evidence-only
      severity: minor
      topic: "ENV-294 manufacturing and scale-up"
      missingEvidence: >
        No public CMC data, manufacturing partner announcement, or supply chain disclosure has been made for
        ENV-294's plant-derived scaffold. The bioavailability characteristics at commercial-scale synthesis
        and the identity of any contract manufacturing organization (CMO) are unknown from public sources.
      whyItMatters: >
        Plant-derived NCE synthesis can be challenging to scale; undisclosed CMC readiness adds operational
        risk to projected Phase 2b/3 and launch timelines.
      relatedQuestionRefs: [QM027]

