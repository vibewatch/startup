  - id: evidence-gaps-and-diligence-priorities
    title: Evidence Gaps and Diligence Priorities
    body: >
      Several material uncertainties limit the precision of this market analysis. First, no independent
      sell-side or buy-side analyst has published a peak revenue estimate for ENV-294 across its intended
      AD and asthma indications, making SOM modeling dependent on comparables (dupilumab, abrocitinib) and
      analyst analogies rather than asset-specific projections. Enveda has not publicly disclosed ENV-294's
      precise molecular target beyond describing it as a "novel non-kinase inflammatory pathway distinct from
      JAK-STAT or cytokine signaling," which makes independent efficacy mechanism validation impossible without
      confidential data room access. Regulatory designation status—whether Enveda has applied for or received
      FDA Breakthrough Therapy, Fast Track, or Orphan Drug designation for any asset—has not been publicly
      confirmed, which is a material gap since designation would accelerate FDA review timelines and signal
      clinical unmet need recognition. The bioavailability and scale-up characteristics of ENV-294's
      plant-derived scaffold at commercial manufacturing volumes have not been disclosed, creating a manufacturing
      risk that could affect COGS and supply chain reliability at launch. Diligence asks: (1) obtain or model
      SOM from payer coverage assumptions and market share scenarios for the moderate-to-severe AD biologic
      segment; (2) request Phase 2b protocol and regulatory correspondence regarding any fast-track or
      breakthrough designation; (3) commission or obtain CMC due diligence on ENV-294 synthesis scalability;
      (4) assess competitive timing risk given Phase 2b plans for 2026 against a market where dupilumab
      biosimilars may enter by 2030–2031.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
