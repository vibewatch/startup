    title: Market sizing lens
    type: pyramid
    layout: wide
    summary: >
      TAM/SAM/SOM pyramid for Enveda's four-indication pipeline, from total global inflammatory and
      metabolic disease drug spend down to an estimated ENV-294 launch SOM in moderate-to-severe AD.
    data:
      items:
        - label: "TAM — Global Inflammatory + Metabolic Disease Drug Market (~$200B+)"
          detail: >
            Includes all Rx pharmaceuticals for immune-inflammatory (AD, asthma, IBD, autoimmune) and metabolic
            (obesity, diabetes, NASH) indications globally; highly fragmented across hundreds of branded and
            generic agents. Not a monolithic addressable opportunity—listed to bound the sector scale.
          tone: neutral
        - label: "SAM — Advanced Oral Small Molecules & Biologics for AD, Asthma, IBD, Obesity (~$50B by 2030)"
          detail: >
            Enveda's four specific therapeutic areas: AD therapeutics (~$20B by 2030, Grand View/MDF), asthma
            biologics (~$10B), IBD advanced therapies (~$12B), and obesity drugs (rapidly expanding GLP-1 market).
            SAM reflects the combined advanced-therapy segment, excluding generics and OTC. Methodological overlap
            across these analyst estimates (some double-count atopic conditions) means the combined figure is
            indicative, not additive.
          tone: neutral
        - label: "SOM — ENV-294 Launch in Moderate-to-Severe AD/Asthma (~$1–4B Peak Potential)"
          detail: >
            Author estimate: if ENV-294 captures 5–15% of the biologic-eligible moderate-to-severe AD patient
            population in US + EU5 at list prices comparable to oral JAK inhibitors ($25,000–$35,000/year),
            peak revenue potential reaches $1–4B. This is speculative pre-Phase 3 and does not discount for
            probability of Phase 3 success, approval, or competitive timing.
          tone: neutral
    approximationNotes: >
      TAM and SAM figures are aggregated from multiple analyst reports (Market Data Forecast, Grand View Research)
      many of which are paywalled; only summary headlines were accessible. SOM is an author estimate based on
      dupilumab penetration analogues and is not an independently published projection.
