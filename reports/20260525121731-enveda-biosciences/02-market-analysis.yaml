  - id: market-sizing-lenses
    title: Market Sizing Lenses
    body: >
      Quantifying the addressable market for Enveda requires layering published estimates across indications,
      noting that no single analyst report integrates all four therapeutic areas into a combined TAM. The global
      atopic dermatitis therapeutics market is projected to exceed $20 billion by 2030, driven by continued
      biologic uptake, new mechanism entries, and geographic expansion into Asia. Dupilumab (Dupixent),
      co-developed by Regeneron and Sanofi, anchors this market as the dominant standard of care and set a
      commercial template for high-efficacy but injectable biologics in the $15,000–$35,000 annual cost range.
      The asthma biologics market adds a further multi-billion-dollar opportunity, with the biologics segment
      growing rapidly following approvals for anti-IL-5 and anti-IL-4/13 therapies. GLP-1 obesity therapeutics
      represent the fastest-growing drug class globally, with market projections reaching hundreds of billions
      in the early 2030s as access expands to broader patient populations beyond the initial semaglutide and
      tirzepatide beachheads. IQVIA's 2026 Global R&D Trends report recorded 79 new active substances approved
      globally in 2025, of which 30 were first-in-class, confirming a sustained pipeline capable of expanding
      the addressable market. Small molecules' share of Phase 1 trial starts reached 62% in 2025, up from 60%
      in 2023, reflecting structural demand for oral-route therapies across all four of Enveda's indications.
      Sizing uncertainty is high: analyst estimates for individual indications vary materially, competing for
      shared patient populations (AD and asthma co-occur in atopic march patients), and Enveda's SOM will
      ultimately depend on Phase 2b/3 data, payer coverage decisions, and competitive timing rather than
      published market projections.
    claimRefs:
      - CM012
      - CM013
      - CM017
      - CM019
      - CM020
    tableRefs:
      - TM002
    figureRefs:
      - FM002

  - id: buyer-user-payer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >
      Enveda's four pipeline indications share a commercial channel—specialty prescription drugs sold through
      US and EU specialty pharmacy or hospital distribution—but differ materially in prescriber archetype,
      payer dynamics, and adoption barriers. For atopic dermatitis and asthma, board-certified dermatologists
      and allergists/pulmonologists serve as the primary prescribers, with decision-making concentrated among
      a relatively small number of high-volume KOLs and academic medical center practices. Patients are the
      end users, often adults with moderate-to-severe disease who have failed topical corticosteroids and at
      least one biologic. US commercial insurers and pharmacy benefit managers (PBMs) serve as primary payers,
      with step therapy and prior authorization requirements routinely applied—dupilumab itself required years
      of formulary negotiations before broad access. France's 100% biologic cost coverage for severe AD offers
      a favorable access signal in a large European market. For IBD, gastroenterologists are the key prescribing
      channel, with hospital pharmacy and infusion center logistics relevant for the early biologic treatment
      lines. The obesity indication has the broadest potential prescriber base—primary care physicians and
      endocrinologists—and payer dynamics are evolving rapidly following GLP-1 guideline issuance; however,
      commercial payer coverage for branded obesity drugs remains inconsistent in the US. Budget ownership
      across all four indications rests with specialty pharmacy benefit managers or medical benefit teams
      within health plans; employer self-insured plans are a key access gate for novel specialty therapies.
    claimRefs:
      - CM031
      - CM033
      - CM035
      - CM036
      - CM037
      - CM041
