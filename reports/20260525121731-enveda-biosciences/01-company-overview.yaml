      severity: material
      topic: clinical-risk
      missingEvidence: "Direct head-to-head quantitative comparison between ENV-294's Phase 1b EASI response rates and those from comparable Phase 1/2 studies of dupilumab and approved JAK inhibitors in moderate-to-severe AD patients."
      whyItMatters: "While Phase 1b investigators describe the ENV-294 results as 'JAK inhibitor-like,' this is a qualitative assertion; independent comparative analysis would strengthen or challenge the efficacy claim."
