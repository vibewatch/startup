  - id: milestones-adverse-signals
    title: Key Milestones and Adverse Signals
    body: >
      Enveda's most significant positive milestone is the March 31, 2026 announcement of positive Phase 1b
      results for ENV-294 in moderate-to-severe atopic dermatitis. The open-label study enrolled nine adult
      patients, who received oral ENV-294 (800 mg once daily) for 28 days followed by a 14-day off-treatment
      observation. Patients achieved a mean 68% EASI reduction at Day 28, deepening to 85% at Day 42. All
      patients (100%) achieved EASI-50, 78% achieved EASI-75, and 56% achieved EASI-90 by Day 42—with
      44% reaching complete or near-complete skin clearance (vIGA-AD 0 or 1). No serious or severe adverse
      events were reported, and no patients discontinued. Leading dermatology KOLs (Dr. Jonathan Silverberg,
      George Washington University; Dr. Leon Kircik, Mount Sinai) described the results as compelling.

      These results must be placed in broader context for rigorous assessment. The Phase 1b enrolled only
      9 patients in an open-label (non-blinded) design, severely limiting statistical power. Phase 2a results
      (randomized, double-blind, placebo-controlled, 60-patient study) are the first controlled test of
      ENV-294's efficacy. Furthermore, the broader AI drug discovery sector remains in a period of scrutiny:
      as of mid-2026, no AI-discovered drug has received regulatory approval globally, despite over $60 billion
      invested and 173 programs in clinical trials. Phase II success rates for AI-designed drugs match traditional
      drugs (~40%), eliminating early-stage advantage. Peer companies including BenevolentAI (whose topical
      pan-Trk inhibitor for atopic dermatitis failed Phase IIa) and Exscientia (multiple program failures)
      have demonstrated that compelling preclinical and early clinical signals do not guarantee Phase II success.
      Clinical development remains the key risk for Enveda, and ENV-294's mechanism-of-action novelty—while
      attractive—also means there is no validated clinical precedent for the LOCKTAC class.
