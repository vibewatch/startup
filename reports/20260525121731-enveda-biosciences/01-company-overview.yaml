callouts:
  - calloutType: strength
    title: "Phase 1b ENV-294 Results: Best-in-Class Signal for an Oral Therapy"
    body: >
      The March 2026 Phase 1b data for ENV-294 showed a mean 85% EASI reduction at Day 42 (with continued
      improvement after treatment cessation), 100% EASI-50, 78% EASI-75, and 56% EASI-90—with no serious
      adverse events and no discontinuations. Independent KOLs at GWU and Mount Sinai characterized the
      combination of rapid, deep response with a biologic-like safety profile as "genuinely compelling" for
      an oral therapy. If confirmed in Phase 2a, this profile would represent a meaningful advance over
      injectable dupilumab and JAK inhibitors with boxed warnings.
    claimRefs:
      - CO032
      - CO033
      - CO034

  - calloutType: risk
    title: "AI Drug Discovery Phase II Attrition: Zero Approved Drugs Despite $60B Invested"
    body: >
      As of mid-2026, no AI-designed drug has received FDA regulatory approval globally—despite over $60
      billion in venture capital invested and 173 AI-discovered programs in clinical trials. Phase II success
      rates for AI-designed drugs match traditional drugs (~40%), eliminating the early-stage advantage seen
      in Phase I. BenevolentAI's topical pan-Trk inhibitor for atopic dermatitis failed Phase IIa with no
      significant efficacy versus placebo—a directly analogous indication to ENV-294. Exscientia has seen
      multiple program failures. The ENV-294 Phase 1b (n=9, open-label) cannot statistically predict Phase 2
      outcomes; the controlled Phase 2a readout is the first genuine efficacy test.
    claimRefs:
      - CO040
      - CO041
      - CO042
      - CO043

  - calloutType: insight
    title: "Pipeline-in-a-Product Strategy: Three Novel Clinical Assets from One Platform in ~5 Years"
    body: >
      Enveda's December 2025 simultaneous Phase 1 initiations for ENV-308 (obesity) and ENV-6946 (IBD),
      alongside ENV-294 in Phase 2a, demonstrate a platform productivity rate that is exceptional for a
      5-year-old biotech: three wholly owned, internally discovered clinical assets with novel mechanisms
      in high-value indications. The company claims approximately $1 million per development candidate versus
      an industry average of $10–15 million, implying an ~10× capital efficiency edge if valid.
    claimRefs:
      - CO025
      - CO028
      - CO031
      - CO035
      - CO036

  - calloutType: assumption
    title: "Unicorn Valuation Is Self-Reported and Not Independently Verified"
    body: >
      Enveda's ~$1 billion unicorn valuation is reported by the company in its September 2025 Series D
      press release and confirmed by BizWest (local Colorado coverage). No independent financial institution,
      public filing, or secondary-market transaction has independently corroborated this figure. Unicorn status
      is typical for a funding announcement but does not reflect a realized enterprise value or a public-market
      assessment. Investors should treat the $1B valuation as a negotiated round price, not a validated
      fair value.
    claimRefs:
      - CO006
      - CO009

