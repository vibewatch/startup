  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: >
      Viswa Colluru, PhD is the sole founder and CEO of Enveda Biosciences. A first-generation immigrant who
      grew up in Southern India around his father's pharmacy, Colluru earned his PhD in cancer biology at the
      University of Wisconsin-Madison, becoming the youngest PhD graduate from the CMB Class of 2011. He
      subsequently served as the first Innovation Scientist and Product Manager at Recursion Pharmaceuticals,
      where he established the portfolio and early commercial team before departing to found Enveda. Colluru
      seeded the company with approximately $55,000 of his own savings before raising institutional capital,
      and has described the founding as deeply personal—his mother's battle with treatable leukemia, and the
      family's inability to afford available medicines, shaped his mission to accelerate drug discovery. As
      of 2026, under Colluru's leadership, Enveda has scaled to over 300 employees and $517M in total capital.

      The broader executive team includes Daniel Wee as Chief Execution Officer (responsible for operational
      strategy and communications); Jose Trevejo, MD, PhD as Chief Medical Officer and Head of Clinical Pipeline
      Strategy, who led the Phase 2 initiation announcement in December 2025; Jason Kim, appointed CFO in
      January 2025, who brings over 20 years of biopharmaceutical financial leadership, including prior roles
      as President/COO/CFO of Molecular Templates where he raised more than $500M; August Allen as Chief
      Technology Officer (named in Bruker customer documentation as overseeing the metabolomics platform); and
      Nadeem Sarwar, PhD, appointed in December 2025 to lead portfolio strategy. Christopher K. Porter, MBA, JD
      was appointed SVP of Clinical Operations in April 2026 to support the expanding clinical program.

      Board governance remains mostly undisclosed. Dr. Mikael Dolsten, former Chief Scientific Officer and
      President of Worldwide R&D at Pfizer—credited with advancing more than 150 drug candidates into clinical
      studies and 36 approvals during his Pfizer tenure—joined the Board of Directors with the September 2025
      Series D close. Investor board representation likely includes Premji Invest, Kinnevik, and Lux Capital
      given their lead-round roles, but formal board composition beyond Dolsten and Colluru has not been
      publicly confirmed. Key-person risk is material: Colluru is the public face, lead scientist, and primary
      capital-raiser for the company.
