  - id: funding-investors
    title: Funding History and Investor Ecosystem
    body: >
      Enveda has assembled $517 million in total capital across Seed, Series A, B, C, and D rounds since
      its 2019 founding. The company launched with approximately $55,000–$225,000 in personal seed capital
      from Colluru before securing institutional backing. The Series A raised $51 million in June 2021, led
      by Lux Capital, providing the capital foundation for platform development. The Series B reached $119 million
      across two tranches—an initial $68 million combined equity-and-debt financing in December 2022 and an
      oversubscribed extension to $119 million in April 2023. At the time of the Series B completion, the
      company had about 250 employees globally.

      The Series C raised $130 million in November 2024, led by Kinnevik and FPV. In February 2025,
      pharmaceutical giant Sanofi made a strategic investment that extended the Series C total to $150 million—a
      notable endorsement from a big-pharma player with direct commercial interest in inflammatory disease.
      The Series D closed on September 4, 2025, at $150 million, was oversubscribed, and was led by Premji
      Invest (the family office of Indian billionaire Azim Premji). New and returning participants in the Series
      D included Baillie Gifford, Kinnevik, Lingotto Investment Management, Peakline Partners, FPV, Socium
      Ventures, Dimension, Level Ventures, Henry Kravis (personal), IA Ventures, and Lux Capital. With the
      Series D close, Enveda reached unicorn status with a reported valuation of approximately $1 billion.

      The investor base spans a mix of growth-stage technology investors (Kinnevik, Baillie Gifford), traditional
      biotech venture firms (Lux Capital), crossover funds (FPV, IA Ventures), and strategic corporate capital
      (Sanofi). The Premji Invest lead in the Series D adds a global family-office dimension. This breadth of
      investor types, combined with a round that was oversubscribed at the current macro environment for biotech,
      signals strong investor conviction in the platform and pipeline.
