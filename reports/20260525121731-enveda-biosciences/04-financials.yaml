callouts:
  - calloutType: strength
    title: Phase 1b Success Creates Dealmaking Window
    body: >
      ENV-294's Phase 1b results (85% EASI reduction, 100% EASI-50, published March 2026)
      provide the strongest near-term financial catalyst in Enveda's history. For an atopic
      dermatitis program, achieving EASI-75 response in 78% of patients at Day 42 of a Phase 1b
      trial is exceptional by industry standards. Sanofi's Dupixent achieved roughly 50%
      EASI-75 in its pivotal Phase 3 trials. If ENV-294 replicates or exceeds this in Phase 2,
      Enveda's negotiating position for a licensing deal would be among the strongest seen in
      the AI drug discovery space. The window for Enveda to execute a large pharma partnership
      is estimated at 12–24 months from the run date, coinciding with Phase 2a interim data.
    claimRefs:
      - CI011
      - CI022

  - calloutType: risk
    title: Public Market Skepticism Constrains AI Biotech Valuations
    body: >
      Recursion Pharmaceuticals (RXRX) trading at $3.01/share as of May 2026—approximately
      80% below its all-time high—despite over $500M in partnership milestone payments and five
      active clinical programs signals that AI drug discovery companies face structural investor
      skepticism in public markets. This does not directly impair Enveda's private valuation
      in the near term, but it represents a meaningful headwind for any future IPO exit at a
      premium multiple. Science.org's framing of AI drug hunters "making some gains" with
      skeptics still vocal underscores that the sector has not yet produced the clinical proof
      required to sustain the valuation premiums investors paid at peak. Enveda's Phase 2 data
      will be a critical test of whether natural-product AI discovery can achieve that proof
      ahead of its peers.
    claimRefs:
      - CI016
      - CI017
      - CI018

  - calloutType: strength
    title: CFO Hire Signals Pre-IPO or Pre-Partnership Financial Buildout
    body: >
      The January 2025 appointment of Jason Kim as CFO—a hire made before both the Series C
      and Series D closes—is a structural signal of financial maturation. Kim's background at
      Molecular Templates ($500M+ raised, public listing, Takeda/Vertex/BMS collaborations)
      is precisely the toolkit required to manage a clinical-stage company's capital markets
      strategy, investor relations, and BD deal structuring. Hiring a CFO of this caliber six
      to twelve months before a Phase 2 readout is standard pre-partnership preparation. This
      hire is a positive indicator of board intent and financial discipline.
    claimRefs:
      - CI008
      - CI009

