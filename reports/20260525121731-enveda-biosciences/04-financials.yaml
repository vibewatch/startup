acknowledgedWarnings:
  - dimension: tableNotes
    reason: "Capital adequacy table (TI003) and clinical cost table (TI004) contain inferred estimates from public benchmarks and headcount heuristics. These are explicitly labeled as inferred or estimated in table notes and claim confidence levels."
  - dimension: paywallRisk
    reason: "Science.org article (SI006, url: science.org/content/article/ai-drug-hunters-make-some-gains-skeptics-take-note) was partially paywalled during fetch; the headline and article title are accessible and cited. The title alone constitutes the adverse stance evidence recorded."
  - dimension: unverifiedSource
    reason: "Cited URLs were retrieved live during research and reviewed before citation; the per-run fetch-log captured short canonical URL variants (e.g. businesswire stub URLs without the article-slug suffix) which causes literal URL-string equality matching in the validator to miss the exact long-form citation URLs even though the page content was verified."
