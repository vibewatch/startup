companyProfile:
  summary: >-
    Enveda Biosciences is a clinical-stage AI-native drug discovery company headquartered in Boulder, Colorado,
    founded in 2019 by Viswa Colluru, PhD. The company builds proprietary metabolomics and mass spectrometry tools
    to systematically decode the ~99% of nature's chemical diversity that remains unexplored, then trains AI models
    to identify drug candidates. ENV-294, its lead LOCKTAC oral small-molecule targeting atopic dermatitis and
    asthma, delivered an 85% mean EASI reduction in Phase 1b (March 2026) and entered Phase 2a in December 2025.
    The company has raised $517M across seed through Series D (September 2025, led by Premji Invest), claims
    unicorn status at $1B+ valuation, and counts Sanofi and Henry Kravis among its strategic investors.
  foundedDate: '2019-01-01'
  founders:
    - name: Viswa Colluru, PhD
      role: Founder & CEO
      background: >-
        PhD in cancer biology (University of Wisconsin-Madison, 2011); first Innovation Scientist and Product Manager
        at Recursion Pharmaceuticals; founded Enveda in 2019 with personal seed capital. Primary driver of scientific
        vision, fundraising, and commercial strategy.
      claimRefs: [CO001, CO002]
  foundingLocation: Boulder, Colorado
  headquarters: Boulder, Colorado
  productSummary: >-
    Enveda's platform generates a proprietary library of natural-product molecules using mass spectrometry and AI
    foundation models, then advances selected scaffolds as first-in-class oral small molecules. Lead asset ENV-294
    is a LOCKTAC oral inhibitor in Phase 2a for atopic dermatitis and asthma. ENV-308 (obesity, Phase 1) and
    ENV-6946 (IBD, Phase 1) represent the near-clinical pipeline.
  customerFocus: >-
    Pre-commercial; primary monetization model is pharmaceutical partnership or licensing deals modeled on
    Recursion/Sanofi and Recursion/Roche precedents, plus eventual royalties on approved drugs.
  businessModel: >-
    Pre-revenue discovery-stage biotech. Revenue pathways include upfront pharma co-development or licensing payments
    (primary near-term path), development milestones tied to Phase 2b, Phase 3, NDA, and approval, and long-term
    royalties on approved drugs. Sanofi's Series C participation suggests a potential right-of-first-negotiation
    relationship for ENV-294.
  stage: clinical-stage private (Series D)
  fundingStatus: >-
