      - number: '1.4'
        title: 管线、平台规模与牵引信号
        blocks:
          - type: paragraph
            body: >
              Enveda 的 PRISM 平台把 AI 引导的质谱（自 2021 年使用 Bruker timsTOF
              设备）、高通量生物测定和机器学习驱动的结构预测结合起来，在与生物活性相连的天然样本数据库上运行。平台用液相色谱分离复杂混合物，把各组分送入 timsTOF Pro 2
              做结构预测（利用碰撞截面编码捕捉分子形状），并对平行组分开展几十种生物测定。随后统计去卷积会优先筛选活性好、毒性低、结构具备成药性的分子。Enveda 发表的同行评议论文（iScience，2023
              年）验证了这条民族植物学驱动路径，证明近缘药用植物共享植物化学空间和治疗用途。

              核心临床资产 ENV-294 是面向特应性皮炎和哮喘的同类首创、口服、每日一次小分子。Enveda
              将其作用机制描述为新型非激酶通路，是一种“LOCKTAC”非降解型分子胶，可重置细胞免疫反应以应对慢性炎症，区别于现有疗法采用的 JAK-STAT 或细胞因子信号通路。基于积极的 1b
              期中期疗效数据，两个适应症的 2a 期试验已于 2025 年 12 月启动；特应性皮炎 2b 期剂量探索研究计划在 2026 年中开展。ENV-308 是面向长期体重维持的同类首创口服小分子（激素模拟机制），在
              2025 年 12 月获得 FDA IND 放行后进入 1 期。ENV-6946 是面向炎症性肠病的肠道优先 TL1A+ 通路抑制剂，也在 2025 年 12 月进入 1 期。

              外部牵引信号包括：Fast Company 将 Enveda 评为 2026 年最具创新力生物技术公司之一；Forbes 在 America's Best Startup Employers 2025
              中把公司列为生命科学初创企业第 2 名、总榜第 26 名；以及 2024 年 5 月与 Microsoft 达成战略合作，共建化学基础模型。Evercore ISI 分析师 Umer Raffat 于 2026
              年 4 月主持 1b 期结果网络研讨会，说明这家尚未产生收入的私营公司正在获得更多华尔街覆盖。
