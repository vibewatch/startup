      - number: '5.3'
        title: 临床管线资产——ENV-294、ENV-308、ENV-6946
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，Enveda 的临床管线包括三款进入人体试验的药物，覆盖四个适应症；另有六项资产处于 IND 申报支持研究，研究管线中还有十七个已宣布的开发候选物。

              ENV-294 是领先且最先进的资产。公司将其描述为同类首创、每日一次口服小分子，采用新的「LOCKTAC」机制——一种非降解分子胶，重新配置细胞免疫对慢性炎症的反应，而不是像现有疗法那样通过 JAK-STAT
              或 IL-4Rα 通路阻断单个细胞因子。ENV-294 靶向一条非激酶炎症通路。Phase 1b 开放标签研究（n=9，中重度特应性皮炎）报告 Day 42（停药后 14 天）的疗效终点如下：平均 EASI 下降
              85%，100% 患者达到 EASI-50，78% 达到 EASI-75，56% 达到 EASI-90。两名患者实现皮损完全清除（vIGA-AD=0）。最早 Day 8
              即观察到反应，且停药后反应继续加深，提示潜在疾病修饰信号。未报告严重或重度不良事件，也没有患者停药。ENV-294 目前处于两项并行、随机、双盲、安慰剂对照 Phase 2a
              试验中，一项用于特应性皮炎，一项用于哮喘，均于 2025 年 12 月启动。AD 的 Phase 2b 剂量探索研究计划于 2026 年中开展。

              ENV-308 是同类首创、每日一次口服小分子，被描述为用于慢性体重维持的「激素模拟物」；数据提示其保肌特性不同于现有 GLP-1 受体激动剂。FDA IND 放行已获得，首例患者于 2025 年 12
              月给药；该资产处于 Phase 1，Nadeem Sarwar, Ph.D., MPharm, MPhil 已被任命负责肥胖项目。

              ENV-6946 定位为肠道优先、每日一次口服小分子，通过新型 TL1A+ 通路抑制剂实现「一片药里的多重生物制剂」机制，用于炎症性肠病。FDA IND 放行于 2025 年 12 月获得，Phase 1
              同期启动并完成首例患者给药。肠道优先的选择性画像旨在相对注射用生物制剂降低系统暴露及相关副作用风险。公司声称三项临床资产均为同类首创，机制新颖，且没有任何已获批小分子先例支持；这一差异化论点需要 Phase 2
              数据充分坐实。
