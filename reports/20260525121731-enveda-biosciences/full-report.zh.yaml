      - number: '1.5'
        title: 关键里程碑与反向信号
        blocks:
          - type: paragraph
            body: >
              Enveda 最重要的正向里程碑，是 2026 年 3 月 31 日公布 ENV-294 在中重度特应性皮炎中的积极 1b 期结果。这项开放标签研究纳入 9 名成人患者，口服 ENV-294（800
              mg，每日一次）28 天，随后停药观察 14 天。患者在第 28 天实现平均 EASI 下降 68%，到第 42 天加深至 85%。截至第 42 天，所有患者（100%）达到 EASI-50，78% 达到
              EASI-75，56% 达到 EASI-90，其中 44% 达到完全或接近完全皮损清除（vIGA-AD 0 或 1）。研究未报告严重或重度不良事件，也没有患者停药。皮肤科 KOL（George
              Washington University 的 Dr. Jonathan Silverberg；Mount Sinai 的 Dr. Leon Kircik）称结果很有说服力。

              严谨评估时，这组结果必须放到更大背景中。1b 期只纳入 9 名患者，且为开放标签（非盲法）设计，统计效力严重有限。2a 期结果（随机、双盲、安慰剂对照、60 人研究）才是 ENV-294
              疗效的首次受控检验。更广的 AI 药物发现行业仍处在审视期：截至 2026 年中，全球尚无 AI 发现药物获得监管批准，尽管该领域已投入超过 $60B，且 173 个项目进入临床试验。AI 设计药物的 2
              期成功率与传统药物相当（约 40%），早期阶段优势被抹平。BenevolentAI（其治疗特应性皮炎的局部 pan-Trk 抑制剂在 IIa 期失败）和
              Exscientia（多个项目失败）等同业案例表明，强劲的临床前和早期临床信号并不保证 II 期成功。临床开发仍是 Enveda 的核心风险；ENV-294 的作用机制新颖性虽有吸引力，也意味着 LOCKTAC
              类别没有已验证的临床先例。
