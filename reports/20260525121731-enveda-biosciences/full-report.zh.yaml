        title: 图表
        blocks:
          - type: callout
            title: 天然产物代谢组学小众赛道不拥挤
            body: >
              Enveda 占据一块空白：它是唯一一家以植物代谢组学作为主要药物发现输入的 AI 原生临床阶段公司。所有主要 AI-TechBio
              竞争者（Recursion、Isomorphic、Insilico、Generate）都使用根本不同的输入模态。两个最接近的天然产物 AI 同业（Hexagon Bio、Lodo
              Therapeutics）均已被收购，直接竞争被移除，同时验证了该领域对药企的战略价值。
            calloutType: strength
            claimRefs:
              - CP001
              - CP019
              - CP020
          - type: callout
            title: BenevolentAI 先例所示的临床转化风险
            body: >
              BenevolentAI 把一个问题讲得很清楚：差异化 AI 平台和临床成功之间还有很长一段路。它在知识图谱上投入 10 年，并与 AstraZeneca 建立高调合作，但预测出的机制在 Phase 2
              临床试验中失败，随后触发大规模重组。Enveda 面临同样的平台到患者转化风险，风险集中在三个临床项目上，尤其是 ENV-294；在特应性皮炎这一适应症里，Dupixent 和多款口服竞品已经把疗效门槛抬得很高。
            calloutType: risk
            claimRefs:
              - CP023
              - CP034
              - CP035
          - type: callout
            title: 合作缺口同时带来风险和机会
            body: >
              截至 2026 年 5 月，Enveda 还没有宣布药企合作交易；Recursion、Insilico 和 Isomorphic Labs
              则都已经签下大型合作。这既是竞争性资本缺口，意味着支撑临床运营的非稀释资金更少；也是机会：如果 ENV-294 在特应性皮炎的 Phase 2a 数据成立，可能以高于数据前交易的估值吸引重大授权兴趣。
            calloutType: insight
            claimRefs:
              - CP029
              - CP031
              - CP036
          - type: callout
            title: 速度主张需要独立验证
            body: >
              Enveda 称药物发现速度「比行业平均快 4X」。如果得到验证，这是显著差异化。但截至 2026 年 5 月，这一说法仍由公司自报，尚未在同行评审文献中独立对标。它与公司管线产出相符——成立约 6 年已有 3
              个临床资产——但没有标准化方法，就无法直接拿它同 Recursion 的「较传统方法显著改善」或 Insilico 有记录的从发现到 IND 时间指标比较。
            calloutType: assumption
            claimRefs:
              - CP026
