      - number: '3.3'
        title: 天然产物专门及相邻平台竞争者
        blocks:
          - type: paragraph
            body: >
              天然产物专门竞争格局经过整合已显著收缩，使 Enveda 的位置更易防守，同时也说明更大玩家认可这一路径的市场价值。Hexagon Bio 用真菌基因组学发现新型天然产物生物合成基因簇，并于 2023
              年被收购——这确认大市值收购方看到了天然产物平台的价值。Lodo Therapeutics 在土壤微生物组中勘探抗生素和抗感染天然产物，被 Zymergen 收购后又并入 Genentech
              组合。两个主要由基因组学驱动的天然产物竞争对手被整合，既移除了 Enveda 最接近的理念对手，也验证了该赛道对药企的吸引力。

              剩余天然产物相邻公司在输入化学和疾病焦点上差异很大。Cultivarium
              及相关微生物天然产物公司（BiomeBank、Phylagen）聚焦微生物而非植物化学；它们进入的是不同且小于植物界的化学多样性空间。Brightseed 把 AI
              用于食品和营养应用的植物生物活性物，而不是药物开发，路径同样有些类似质谱 + ML；它尚未推进药物发现候选物。Octant Bio（现 Octant）大规模应用化学生物学，但重点是合成化学而非天然产物。

              最相关的天然产物竞争威胁，是大型药企残留的内部天然产物项目。AstraZeneca、Novartis、Roche/Genentech 和 Pfizer 历史上都有大型天然产物筛选项目，但在 1990s-2000s
              大多转向组合化学而关闭。药企兴趣回升已有早期信号：Novartis 维持 100 多个行业联盟来获取新机制，显示其愿意许可天然产物机制。竞争风险在于，大药企收购或自建竞争性代谢组学平台，而不是向 Enveda
              许可。考虑到 Enveda 已积累的数据领先（系统分析 38,000 种植物、可搜索库约 1.5M 化合物），复制这种平台需要 3-5 年专门投入——这给 Enveda
              留出有意义窗口，可推进临床管线并建立许可先例。

              BenevolentAI 是重要警示类比：一家基于知识图谱的 AI 药物发现公司（Euronext 上市），用 10 年构建了广泛的生物学知识图谱，但其预测靶点在试验中失败后遭遇临床挫折（尤其是一个 AKI
              baricitinib 项目在 AstraZeneca 2 期试验中失败）。BenevolentAI 的经历说明，包括 Enveda 在内，所有 AI
              药物发现公司无论平台怎样差异化，都必须穿过从平台到患者的转化风险。
