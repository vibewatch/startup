      - number: '8.5'
        title: 投资逻辑破裂触发因素与终止标准
        blocks:
          - type: paragraph
            body: >
              四类事件会实质损害投资逻辑，并触发立即 hold/sell 复评。第一，特应性皮炎或哮喘研究任一 Phase 2a 失败——定义为未能在预设显著性阈值下达到主要 EASI 终点——会把 ENV-294 rNPV
              降低 80–90%，并很可能迫使 down-round 融资，因为 ENV-294 是支撑独角兽估值的锚定项目。第二，Phase 2a 出现与免疫抑制或 off-target
              毒性相关的严重不良事件（SAE），会消除 ENV-294 相对 JAK 抑制剂的关键竞争优势，并触发 FDA clinical hold 风险。第三，Sanofi 发生战略反转——定义为 Series C
              合作安排不续约，或公开终止联合发现项目——既会降低资本效率预期，也会释放一个来自深度尽调内部人的平台担忧信号。第四，Phase 1b 研究出现数据质量问题证据，包括 EASI
              测量波动、较大队列中生物标志物读数不一致，或研究者评估异常，都会削弱已发表临床结果的可靠性。监测指标包括季度 Phase 2a 入组更新、提交至 ClinicalTrials.gov
              的方案修订、未来融资材料中披露的 FDA correspondence，以及在同行评审期刊发表完整 Phase 1b 数据集，以便独立方法学复核。
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
          - type: table
            tableRef: TV005
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
      - number: '8.6'
        title: 最终建议与尽调问题
        blocks:
          - type: paragraph
            body: >
              最终建议是在当前约 $1 billion 或更高的隐含估值下 WATCH / TRACK。它不是 BUY，因为临床证据虽然有前景，但建立在 9 名患者的开放标签 Phase 1b
              研究上；特应性皮炎和哮喘的完整随机 Phase 2a 数据才是决定性价值拐点。它也不是 SELL，因为当前管线 rNPV 大体支撑独角兽价格，Phase 1b
              数据确实有吸引力，机制新颖且差异化，投资者财团还包括可信生命科学专业机构（Premji Invest、Kinnevik、Baillie Gifford、Lux Capital），并可接触非公开尽调。升至 BUY
              应以以下条件为前提：（1）ENV-294 在 AD 的 Phase 2b 数据显示，相比安慰剂，在至少 50 名患者的随机对照队列中实现有统计显著性的 EASI 降幅；公司指引为 mid-2026；（2）哮喘
              Phase 2a 数据显示 FEV1 或 ACQ 分数至少有名义改善；（3）ENV-6946（IBD 项目）完成 Phase 1 给药且安全性干净；（4）确认总现金和已承诺融资可提供至少 18
              个月现金跑道，覆盖潜在 Phase 3 启动里程碑。若任一条件未满足，应维持 WATCH，等待更多临床数据。若 AD 和哮喘两项 Phase 2a 均未达到主要终点，或任何进行中试验报告严重不良事件，应下调至
              AVOID。五个最终尽调问题是：（1）经审计或审阅的财务报表，确认实际现金余额和烧钱速度；（2）完整 Phase 1b 数据集和生物标志物分析，并发表于同行评审期刊；（3）Series C 下 Sanofi
              合作协议的条款和范围；（4）Series D 确切投后估值和 preference waterfall 结构；（5）提交至 ClinicalTrials.gov 的 Phase 2a
              入组进度、主要终点设计和统计分析计划。
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
          - type: table
            tableRef: TV006
            claimRefs:
              - CV037
              - CV038
              - CV039
