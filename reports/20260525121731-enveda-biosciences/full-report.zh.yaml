      - number: '2.2'
        title: 市场规模测算视角
        blocks:
          - type: paragraph
            body: >
              量化 Enveda 的可服务市场，需要把各适应症的公开估计分层叠加；目前没有单一分析师报告把四个治疗领域整合为一个综合 TAM。全球特应性皮炎治疗市场预计到 2030 年超过
              $20B，驱动因素包括生物制剂继续渗透、新机制进入和亚洲地理扩张。由 Regeneron 和 Sanofi 联合开发的 Dupilumab（Dupixent）是该市场的主导护理标准，也为年成本
              $15,000–$35,000、疗效高但需注射的生物制剂建立了商业模板。哮喘生物制剂市场又带来数十亿美元级机会，随着 anti-IL-5 和 anti-IL-4/13 疗法获批，生物制剂细分增长很快。GLP-1
              肥胖疗法是全球增长最快的药物类别；随着覆盖从最初 semaglutide 和 tirzepatide 滩头阵地扩展到更广患者群体，2030 年代初市场预测可达数千亿美元。IQVIA 的 2026 Global
              R&D Trends 报告记录，2025 年全球批准 79 个新活性物质，其中 30 个为同类首创，说明管线仍能持续扩张可触达市场。小分子在 1 期试验启动中的占比从 2023 年的 60% 升至 2025 年的
              62%，反映 Enveda 四个适应症都存在对口服疗法的结构性需求。市场规模不确定性高：各单一适应症的分析师估计差异很大，AD 和哮喘等共病患者群存在争夺；Enveda 的 SOM 最终取决于 2b/3
              期数据、支付方覆盖决定和竞争时点，而不是公开市场预测。
