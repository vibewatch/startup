      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              截至 May 2026，AI 药物发现可比公司估值分散度很高，反映出已产生临床 proof 的公司与仍处纯平台阶段公司之间的分化。Recursion Pharmaceuticals（NASDAQ: RXRX）市值
              $1.6 billion，现金 $594 million（December 2024，10-K），FY2024 净亏损 $463.7 million，累计亏损 $1.4
              billion。其价值部分由历史合作付款超过 $450 million、以及与 Sanofi、Bayer、Roche/Genentech 的活跃合作支撑，但其首个 AI-discovered
              临床候选物没有展示可报告疗效。Schrödinger（NASDAQ: SDGR）拥有最可防守的上市估值，市值 $994 million，由 FY2025 收入 $255.9 million 支撑（其中
              $199.5 million 来自向所有 top-20 药企的软件授权）、收入基础多元，现金状况暗示约 2–3 年现金跑道。Relay Therapeutics（NASDAQ: RLAY）交易市值约 $2.9
              billion，估值意外偏高，主要由临床阶段肿瘤资产驱动，而不是 AI 平台溢价；它与 Enveda 的相关性有限。Absci（NASDAQ: ABSI）市值约 $795 million，拥有 AI
              蛋白设计平台，但截至 runDate 临床阶段资产有限。私有可比公司中，Generate:Biomedicines 在 2024 Series C 的估值约 $1.7 billion，其平台结合机器学习和
              wet-lab biological design。Insilico Medicine 上次融资发生在 2022，估值约 $1 billion，并已申请香港 IPO；其 idiopathic pulmonary
              fibrosis Phase 2a 结果在主要终点上未达统计显著，说明 AI 药物发现的 Phase 2 转化风险。相较这些同业，Enveda 约 $1 billion
              的独角兽估值既不是最便宜，也不是最昂贵：相较 Recursion 历史峰值，它更可防守，因为 ENV-294 已交付可量化的 Phase 1b 临床信号，而 Recursion 临床候选物没有匹配；但相较
              Schrödinger 的 $994 million，它更不稳，因为 Schrödinger 有 $255 million 实际收入。合理的「Enveda premium」应等于临床管线
              rNPV，扣掉商业化前状态带来的收入倍数折价；两者大致相抵，留下 $800 million 到 $1.3 billion 的公允价值区间。
