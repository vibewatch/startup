      - number: '3.2'
        title: 通用 AI 药物发现竞争者
        blocks:
          - type: paragraph
            body: >
              Recursion Pharmaceuticals 是与 Enveda 最接近的公开市场类比，二者都是临床阶段、AI 原生药物发现公司。Recursion 的平台大规模摄入细胞图像（表型组学）——每周处理最高
              2.2M 个样本，生成 36+ PB 自有数据——并训练神经网络映射疾病生物学和化学扰动空间。2024 年，Recursion 以约 $688M 完成收购英国 AI 化学公司 Exscientia，把
              Recursion 的生物学数据平台与 Exscientia 的生成式分子设计能力结合起来。Recursion 于 2026-02-25 提交的 10-K 明确将其 TechBio 竞争对手列为 Relay
              Therapeutics、Isomorphic Labs、Schrödinger 和 AbCellera。公司有 7 个临床阶段项目，并与 Roche/Genentech（神经科学 / 肿瘤）、Bayer 和
              Takeda 建立合作。Recursion 不专注天然产物；其化学输入是合成化合物或人类细胞系扰动。

              Schrödinger 是领先的基于物理的计算化学平台。Schrödinger 创立于 1990 年，在 12 个办公室约有 900 名员工；其 FEP+（free energy
              perturbation）平台被数百家药企许可用于先导化合物优化。Schrödinger 的路径与传统药物化学互补——提高合成分子优化概率——但不进入天然产物化学空间。Schrödinger 于 2026 年 5
              月 5 日公布 2026 年 Q1 财务结果。其竞争差异化来自物理准确性和数十年验证数据；限制在于所需计算强度高，且无法探索可合成设计空间之外真正新颖的化学骨架。

              Insilico Medicine 的 Pharma.AI 套件（用于靶点识别的 PandaOmics、用于分子生成的 Chemistry42、用于试验设计的 InClinico）支撑了首个进入 2 期临床试验的
              AI 设计药物：治疗特发性肺纤维化（IPF）的小分子 INS018_055。Insilico 于 2025 年完成 $110M E 轮，并与 Sanofi 有 $1.2B 合作。Insilico 在香港 /
              纽约运营，并计划 IPO。相较 Schrödinger，它是更接近 Enveda 的“从 AI 发现走向临床”类比，但其靶点输入数据是基因组 / 转录组，而非代谢组。

              Isomorphic Labs 是 Alphabet 子公司，利用与 Google DeepMind 共同开发的 AlphaFold3 预测蛋白和药物复合物结构。它在 2024 年与 Eli Lilly 和
              Novartis 签署合作，潜在里程碑最高约 $3B。Isomorphic 拥有近乎无限的算力和深厚 AI 研究人才，但依赖结构生物学输入（蛋白折叠），而非 Enveda
              以化学驱动的代谢组学输入。Generate Biomedicines 用生成式生物学从零设计蛋白，已生成 42,000+ 种蛋白；核心资产 GB-0895（anti-TSLP）处于 1 期。Absci 将生成式
              AI 用于抗体和生物制剂设计，实验周期为 6 周。Generate 和 Absci 竞争的是生物制剂 / 蛋白模态，而非小分子天然产物空间。
