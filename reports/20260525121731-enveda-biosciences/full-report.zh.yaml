  - id: TE003
    title: 技术与运营架构——层级拆解
    columns:
      - 层级 / 组件
      - 平台角色
      - 关键依赖
      - 主要风险
    rows:
      - - Bruker timsTOF Pro 2（硬件）
        - 用 TIMS 采集 MS/MS 数据；为每个离子生成谱图指纹 + CCS 值
        - 单一供应商（Bruker）；同等通量下没有等效商业替代
        - 硬件供应中断；定价杠杆集中在单一供应商
      - - 液相色谱（LC）
        - 在 MS 测量前，把复杂植物提取物分离为馏分
        - 标准 HPLC/UHPLC 设备；有多家供应商
        - 低风险——商品化仪器
      - - DreaMS transformer（ML——结构预测）
        - 自监督 transformer 将 MS/MS 谱嵌入 1024-D 分子表征，用于结构推断
        - 用 GNPS/MassIVE 公共谱库做预训练；推理依赖 GPU 计算
        - 结构越远离训练分布，准确性越下降；对全新骨架的大规模泛化尚未证实
      - - 生物活性预测 ML 模型
        - 评估馏分层面对疾病相关通路的活性；与 MS/MS 谱特征相连
        - 内部标注训练数据（专有）；未开源
        - 外部无法看到训练数据规模和多样性；假阳性可能把药物化学引向无活性骨架
      - - ADMET 预测模型
        - 按预测的吸收、分布、代谢、排泄、毒性画像过滤候选物
        - 内部模型 + 商业模型；行业标准做法
        - 中等——可用商业基准校准；主要风险是外推到新颖化学型
      - - Guild（蛋白-配体对接编排器）
        - 编排 Vina、DiffDock、Boltz、KarmaDock 等对接方法，用于靶点验证
        - Docker；公开对接工具（Vina、AlphaFold/Boltz）；MIT 许可证
        - 计算对接存在已知准确性上限；需要实验确认
      - - 化学库和知识图谱
        - 数据库覆盖 38,000 种植物 × 12,000 种疾病；化合物活性记录；谱图注释
        - 持续生成数据；专有整理
        - 专有锁定风险也是护城河；但也意味着库质量和覆盖面缺少独立验证
      - - CMO / CRO 生态
        - GMP 临床供应生产；GLP 毒理研究；临床 CRO 服务
        - 外部 CMO 和 CRO；未披露内部 GMP 能力
        - CMO 排期和产能风险；2b 期及以后成本放大
    notes: |
      架构来自 Bruker 案例（bruker.com）、Enveda 平台页、DreaMS GitHub 仓库、Guild GitHub 仓库。 风险列反映分析判断。CMO 依赖来自未披露制造设施这一事实推断。
