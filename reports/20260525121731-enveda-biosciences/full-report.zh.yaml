      - number: '7.4'
        title: 竞争与市场风险
        blocks:
          - type: paragraph
            body: >
              特应性皮炎市场竞争激烈，证据标准很高。Dupilumab（Dupixent，BLA 761055）是主导性 IL-4Rα/IL-13Rα1 生物制剂，获批适应症多个，Supplement 82 最近在 April
              2026 才提交，显示标签仍在持续扩张。口服竞争者包括 JAK 抑制剂（abrocitinib、upadacitinib、baricitinib），已有疗效和安全性数据，也有新兴口服 IL-13
              通路药物。ENV-294 若要拿到有意义的市场份额，必须在低于或接近 dupilumab 的价格点（$30,000–$40,000/year）证明具备竞争力的 EASI
              应答，同时拥有更好的口服生物利用度和便利性，门槛很高。AD 医生处方惯性很强：ENV-294 从 Phase 1b 数据中采用的「Dupi-like」标签，需要 Phase 2 和 Phase 3
              大规模随机证据支撑后，才具备商业可信度。

              在更广泛的 AI 药物发现领域，Enveda 面临结构性竞争压力：Recursion Pharmaceuticals（大规模细胞成像 + AI，与 Sanofi、Bayer、Roche
              合作）；Schrödinger（基于物理的分子建模 + ML，药企合作强）；Insilico Medicine（用于靶点和分子设计的生成式 AI，IPF Phase 2 资产）；AbSci（蛋白设计
              AI）；以及大型药企内部 AI 能力（Novartis NIBR、AstraZeneca CRD）。天然产物角度有差异化，但多家公司（Hexagon Bio、Biome
              Pharmaceuticals、Genentech 历史天然产物项目）也在相邻化学空间竞争。

              Enveda 的体重维持资产 ENV-308 面对 GLP-1 主导问题：semaglutide（Ozempic/Wegovy）和 tirzepatide（Mounjaro/Zepbound）凭 Phase 3
              疗效数据主导肥胖 / 体重管理市场，体重下降达 15–22%。除非 ENV-308 证明肌肉保留优势，或拥有可与 GLP-1 疗法互补的不同机制，否则商业差异化会很困难。

              药企交易流是次级竞争风险：Enveda 的合作策略依赖为早期管线资产吸引大型药企授权交易。Recursion 与 Sanofi、Bayer 的高曝光交易抬高了估值，也抬高了预期；若 Enveda
              管线无法生成可比交易条款，投资者回报假设会变差。
            claimRefs:
