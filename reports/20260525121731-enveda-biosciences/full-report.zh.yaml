      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >
              Enveda
              的四个管线适应症共享一条商业渠道——通过美国和欧盟专科药房或医院分销销售的专科处方药——但开方者画像、支付方机制和采用障碍差异很大。特应性皮炎和哮喘的主要开方者是认证皮肤科医生、过敏科医生和肺科医生；决策集中在数量相对少的高量
              KOL
              和学术医学中心诊所。患者是最终用户，通常是中重度成人，已用过外用糖皮质激素且至少一种生物制剂失败。美国商业保险和药品福利管理机构（PBM）是主要支付方，阶梯治疗和预授权要求会被常规使用——dupilumab
              自身也经历多年处方集谈判后才获得广泛准入。法国对重度 AD 生物制剂费用 100% 覆盖，为一个大型欧洲市场提供了有利准入信号。IBD
              的关键开方渠道是胃肠科医生，早期生物制剂治疗线还涉及医院药房和输注中心物流。肥胖适应症潜在开方者最广——初级保健医生和内分泌科医生——GLP-1
              指南发布后支付方机制正在快速演变；不过，美国商业支付方对品牌肥胖药的覆盖仍不稳定。四个适应症的预算归属都在健康计划内的专科药品福利管理机构或医疗福利团队；雇主自保计划是创新专科疗法准入的关键闸口。
