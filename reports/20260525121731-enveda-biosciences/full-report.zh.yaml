        - 高——两项 Phase 2 同时失败会形成复合反向信号，影响全部适应症
        - 确认哮喘试验基于独立机制假设，还是从 AD Phase 1b 外推；审阅哮喘临床前数据
      - - Nagoya Protocol / CBD ABS 合规——未能为 ENV-294、ENV-308、ENV-6946 发现所用植物资源记录事先知情同意和共同商定条款
        - 国际（植物采集地 CBD 缔约国）；美国通过 FDA CMC 文件间接受影响
        - Nagoya Protocol 自 2014 年 10 月生效；WIPO TK Treaty 于 2024 年 5 月通过；合规义务持续存在
        - 中——系统性合规要求对生物多样性地区每一份植物资源主动留档
        - 高——若缺少提供国合规证书，IND 或 NDA 阶段可能被监管卡住；也可能引发条约违规主张
        - 已成文的来源追溯管理系统；与来源社区签署利益分享协议；ABS Clearing-House 登记
        - 中 — 合规状态未公开披露；投资人无法凭公开文件核验 ENV-294 来源材料是否具备 PIC/MAT
        - 要求提供用于 ENV-294、ENV-308、ENV-6946 发现工作的所有植物种质材料的 ABS 合规记录；确认 ABS Clearing-House 登记
      - - 天然产物专利适格性风险 — Alice/Mayo 之后，USPTO 加强对天然来源骨架的 § 101 审查，并面临传统知识现有技术挑战
        - 美国（USPTO 专利审查与诉讼）
        - 持续存在 — Alice（2014）之后，USPTO 天然产物审查指南要求发明概念不能止于分离；审查员不一定检索民族植物学数据库中的现有技术
        - 中 — 取决于权利要求撰写策略；针对新型类似物的物质组成权利要求，比单纯分离权利要求更站得住
        - 高 — 核心专利弱或无效，会削弱授权价值，并让生物类似药竞争者在自由实施（FTO）上找到突破口
        - 推进针对类似物的物质组成权利要求；对照 PubChem/ChemSpider 做自由实施（FTO）分析；定期复核专利组合
        - 中 — Enveda 向 USPTO 提交的专利组合未完整披露；权利要求深度和质量不确定
        - 要求提供完整专利组合摘要，包括 ENV-294 和 ENV-308 核心骨架的授权专利、审查状态和 FTO 意见
      - - >-
          Zymergen 证券集体诉讼（5:21-cv-06028，N.D. Cal.）— 2024 年 3 月修订起诉状将 Enveda Therapeutics, Inc. 作为行业语境对照提及；未发现 Enveda
          作为被告的诉讼
        - 美国联邦法院（N.D. Cal.）
        - 'Enveda 在 Zymergen/ZYM 欺诈案文件 #321 中被作为语境公司提及；Enveda 不是被告；如果 Enveda 上市，该案反映出 AI 生物科技公司的普遍证券诉讼风险'
        - 当前私有阶段为低；IPO 或出现重大虚假陈述事件时显著上升
        - 中 — IPO 阶段的证券诉讼风险会带来董事 / 高管责任敞口；Zymergen 崩盘先例具有警示意义
        - 强治理；IPO 前会计体系达到 PCAOB 要求；投资人披露准确
        - 当前阶段为低 — 截至 2026 年 5 月，未发现针对 Enveda 的未决诉讼
        - 任何 IPO 或重大资本事件前 6 个月，对 Enveda 实体做 PACER/CourtListener 检索；确认 D&O 保险已到位
    notes: >
      各行按严重度 × 发生概率排序。所有 ClinicalTrials.gov 数据均已截至 2026 年 5 月对照注册库核验。考虑到 Enveda 的天然产物来源获取策略，Nagoya Protocol
      合规风险属于结构性风险；投资人仅凭公开文件无法核验合规状态。截至 2026 年 5 月，联邦记录未发现 Enveda 作为被告的诉讼。
