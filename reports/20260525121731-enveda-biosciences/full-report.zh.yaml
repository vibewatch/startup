            title: Sanofi 既是战略投资方，也是特应性皮炎直接竞争者
            body: >
              Sanofi 投资 Enveda Series C（February 2025）的同时，也在把 amlitelimab 推进到特应性皮炎 Phase 3，而这正是 ENV-294 的首要适应症。截至 March
              2026，Sanofi 已在 AAD 会议展示 Phase 3 amlitelimab 数据。这制造了结构性利益冲突：Enveda 最重要的财务支持者，也是其在特应性皮炎市场最直接的竞争威胁。尽调应核实
              Sanofi 投资协议中的 ROFR 和排他性条款。
