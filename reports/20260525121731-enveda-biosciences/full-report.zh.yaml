      - number: '8.3'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Enveda 的投资逻辑有四根支柱。第一，ENV-294 已在 9 名中重度特应性皮炎患者中拿出异常亮眼的 Phase 1b 临床 proof：Day 42 EASI 降幅 85%，生物标志物画像符合
              pan-endotype 活性（Th1、Th2、Th17），没有严重不良事件，也没有停药；这种安全性和疗效组合，当前适应症中尚无任何口服药物做到。第二，机制确实新：ENV-294
              是一种非降解分子胶（「LOCKTAC」），可重置细胞免疫反应，而不抑制 JAK-STAT kinase，可能绕开限制 JAK 抑制剂采用的黑框安全警示。第三，平台与同业不同：Enveda 的「library of
              life」建立在天然产物化学之上，不是完全合成空间，因此与 Recursion（phenomics）、Schrödinger（physics-based computation）或
              Insilico（generative chemistry）相比，假设集合根本不同。第四，资本 / 估值比克制，投资者财团——Premji Invest、Kinnevik、Baillie
              Gifford、Sanofi、Henry Kravis——同时反映财务和战略信念。反向逻辑也同样强。9 名患者的 Phase 1b 数据极其初步；大多数特应性皮炎药物 Phase 2a
              试验无法在更大随机队列中复刻 Phase 1b 信号，ENV-294 的效果量也没有与 active control 比较。AI 药物发现板块自 2021 年以来经历了普遍的估值清算：Recursion
              尽管有实质药企合作，股价仍从超过 $5 billion 跌至约 $1.6 billion；Exscientia 被 Recursion 以峰值估值的一小部分收购；BenevolentAI 从超过 £1
              billion 崩至接近无价值；STAT News 在 December 2024 发表详细反向评估，记录 Recursion 首个 AI-discovered drug 没有可报告疗效，Insilico 首个
              first-in-class AI drug 未达到主要终点。任何 Enveda 投资者都必须计入一个并不低的风险：ENV-294 的 Phase 1b
              信号无法在规模化试验中复现；一旦发生，估值很可能像同业那样重置，并威胁公司以非 down-round 价格融资的能力。没有审计财务、没有烧钱速度披露、没有 royalty 交易金额、没有披露 Series D
              投后估值，都会叠加尽调不确定性。
