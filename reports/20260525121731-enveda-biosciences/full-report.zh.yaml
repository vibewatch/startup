  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 临床与监管风险
        blocks:
          - type: paragraph
            body: >
              Enveda 近端投资逻辑押在两个 December 2026 Phase 2a 读数上：NCT07298395（ENV-294 用于中重度特应性皮炎，60 名受试者，主要终点为 Week 12 相对基线的
              EASI 百分比变化）和 NCT07301255（ENV-294 用于中重度哮喘，50 名受试者，主要终点为截至 Week 12
              的不良事件发生率和哮喘失控事件）。两项都是随机、双盲、安慰剂对照研究；设计适合捕捉疗效信号。但从 Phase 1 进入到 NDA/BLA 获批，行业失败率约 90%；炎症疾病新机制的 Phase 2 特定失败率为
              40–60%。

              ENV-294 在 AD 的 Phase 1b 数据（NCT07336940，9 名受试者，开放标签，January 2026 完成）于 March 31, 2026 被报告为积极；但 9 名患者的 Phase
              1b 延伸研究无法复刻 Phase 2 的随机条件。公司称 ENV-294 具备「类似 Dupi 的疗效和安全性画像」，这把门槛抬得很高：Dupixent（dupilumab，BLA 761055）是 AD
              领域主导性生物制剂，自 March 2017 获批，并在 April 2026 获 Supplement 82 批准。这意味着 ENV-294 需要可比的 EASI
              降幅，再加上口服给药优势，才有理由支撑溢价定价。如果 Phase 2a AD 试验未达到预设的 EASI-75 或 vIGA ≥2-point reduction
              终点，特应性皮炎项目大概率终止，公司估值会急剧下修。哮喘试验（NCT07301255）并行推进，主要完成时间同样为 December 2026，两个试验同时读出带来相关性时间风险。

              ENV-294 的新型非激酶机制带来实质性监管路径风险。FDA 针对新型小分子药物开发的指导文件要求申办方完整表征药物作用机制、靶点和安全性；对于具备新机制的首创分子（不是已确立的激酶抑制剂药理），FDA
              审评员可能要求额外的临床前机制研究和更长周期的安全性包。ENV-6946（IBD，Phase 1）已在 December 2025 获 Enveda IND
              批准；作为一种肠道优先小分子，并以「一粒药里的多重生物制剂」定位，它进一步增加监管复杂度，因为监管方会仔细审查这类机制主张。

              ENV-308（体重维持，Phase 1）所处赛道竞争极其激烈，GLP-1 受体激动剂（semaglutide、tirzepatide）已经重塑市场。即使 ENV-308 展示疗效，体重维持的 FDA
              获批路径也要求证明有意义的结局（1 年时相对安慰剂 ≥5% 体重下降）和肌肉保留优势，门槛很难。

              基于质谱的代谢组学数据质量，是 Enveda 化合物识别和 PRISM 平台的地基：若监管检查（特别是 FDA/GCP/GLP 审计）发现谱图注释的数据完整性或可重复性问题，化合物发现主张和 IND
              支撑包质量都会被削弱。
