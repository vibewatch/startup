      - number: '2.5'
        title: 证据缺口与尽调优先级
        blocks:
          - type: paragraph
            body: >
              几个重大不确定性限制了本市场分析的精度。第一，没有独立卖方或买方分析师发布 ENV-294 在目标 AD 和哮喘适应症中的峰值收入估计，SOM
              建模只能依赖可比药物（dupilumab、abrocitinib）和分析师类比，而非资产专属预测。Enveda 尚未公开 ENV-294 的精确分子靶点，只称其为“区别于 JAK-STAT
              或细胞因子信号的新型非激酶炎症通路”；没有保密数据室访问，外部无法独立验证疗效机制。监管认定状态——Enveda 是否为任何资产申请或获得 FDA
              突破性疗法、快速通道或孤儿药认定——尚未公开确认，这是重大缺口，因为认定会加速 FDA 审评时间，并显示临床未满足需求得到认可。ENV-294
              植物来源骨架在商业制造规模下的生物利用度和放大特征未披露，形成可能影响上市时 COGS 和供应链可靠性的制造风险。尽调问题：（1）基于支付方覆盖假设和中重度 AD 生物制剂细分市场份额情景，获取或建模
              SOM；（2）索取 2b 期方案，以及有关任何快速通道或突破性疗法认定的监管沟通；（3）委托或获取 ENV-294 合成可扩展性的 CMC 尽调；（4）在 dupilumab 生物类似药可能于 2030–2031
              年进入的市场背景下，评估 2026 年 2b 期计划的竞争时点风险。
