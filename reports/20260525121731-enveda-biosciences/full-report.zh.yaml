          - type: callout
            title: AI 药物发现估值倍数压缩：行业性反向信号
            body: >
              上市 AI 药物发现可比公司表现显著低于预期。Recursion Pharmaceuticals（NASDAQ: RXRX）CEO Chris Gibson 在 April 2026
              宣布不再寻求连任，这是一个建立在 AI-biology 叙事上、融资数十亿美元的公司出现领导层过渡信号。BenevolentAI 在 2024 进入破产管理。不论个体管线质量如何，这些信号都会为 Enveda
              这类私有 AI 药企的 Series E 定价建立负面参照系。
            calloutType: risk
            claimRefs:
              - CR013
              - CR017
              - CR019
          - type: callout
            title: 天然产物 IP 在结构上弱于合成药 IP
            body: >
              Alice/Mayo 之后的规则，以及 USPTO 对天然存在物质更严格的 35 U.S.C. § 101 审查，意味着 Enveda
              源自植物的核心化合物骨架需要谨慎撰写权利要求，才能获得物质组成保护。同时，传统知识现有技术（Ayurvedic
              方剂、民族植物学数据库）制造了显而易见性风险，而标准现有技术搜索并不总能筛出这些风险。相较全合成小分子组合，freedom-to-operate 风险在结构上更高。
