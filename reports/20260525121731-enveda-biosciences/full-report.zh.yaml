  - id: TE002
    title: 药物发现工作流——用例与步骤表
    columns:
      - 工作流步骤
      - 当前行业做法
      - Enveda 方案
      - 可量化收益（公司宣称）
      - 已知局限
    rows:
      - - 物种选择
        - 依赖经验或民族植物学数据库；覆盖面窄
        - ML 评分数据库，覆盖 38,000 种植物 × 12,000 种疾病；按治疗相关性和化学新颖性排序
        - 预选物种相较随机筛选命中率更高
        - 相较 400,000 种已知植物，数据库覆盖仍不完整；存在选择偏差风险
      - - 复杂混合物分馏 + 筛选
        - 先分离纯化合物（慢且贵），再筛选
        - 用 LC 分馏；并行筛选馏分生物活性并同步测量 MS/MS
        - 消除串行瓶颈；每周处理数千个馏分
        - 活性化合物先在馏分层面识别；结构确认仍需分离
      - - 结构识别
        - 分离后做 NMR（需要毫克级样品）；慢且成本高
        - 在决定分离前，基于 MS/MS + CCS 数据用 ML 从头预测结构
        - 可在痕量样品下提出结构假设；把 NMR 投入集中到高置信候选物
        - 结构预测带概率性；全新骨架类别可能缺少训练数据，难以做高置信预测
      - - 生物活性评分与 ADMET 过滤
        - 串行实验级联；ADMET 测试靠后
        - ML 模型在结构预测时同步评估生物活性和 ADMET；早期过滤
        - 早期剔除风险点，降低后期高成本失败
        - 真正新颖化学型（训练分布外）上的模型准确性不确定
      - - 命中到先导物与临床开发
        - 标准药物化学 + 依赖 CRO 的 IND 支持研究
        - 标准药物化学，叠加可选的蛋白-配体对接（Guild）；外包 GMP 生产；FDA IND 申报
        - 2024–2025 年多项 IND 获批，速度快于行业平均（公司宣称 4×）
        - 无自有生产；GMP 供应依赖 CMO；具备统计效能的 2 期研究仍待完成
    notes: |
      工作流来自 Bruker 客户案例（bruker.com）、Enveda 平台页（enveda.com/platform）和 bioRxiv 植物化学空间预印本。局限列反映独立分析判断和天然产物药物发现领域的标准文献。
