companyProfile:
  summary: >-
    Enveda Biosciences 是一家临床阶段 AI 原生药物发现公司，总部位于科罗拉多州 Boulder，由 Viswa Colluru, PhD 于 2019 年创立。公司自研代谢组学和质谱工具，系统解码自然界约 99%
    尚未探索的化学多样性，再训练 AI 模型识别候选药物。其核心 LOCKTAC 口服小分子 ENV-294 靶向特应性皮炎和哮喘，在 2026 年 3 月的 1b 期中实现平均 EASI 下降 85%，并于 2025 年 12 月进入
