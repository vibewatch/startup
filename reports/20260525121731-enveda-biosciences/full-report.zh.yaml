  - id: TV005
    title: 投资逻辑打穿与终止触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 2a 期 AD 主要终点失败
        - ENV-294 在随机 2a 期队列中，未达到预设的相对安慰剂 EASI 降低（p<0.05）
        - 清除基准情景 rNPV 约 60%；独角兽估值不再可支撑；很可能触发低于 $500M 估值的 down-round 融资
        - 立即下调至回避；未完成完整数据审阅并修正价格前，不参与 down-round
      - - 2a 期或 2b 期出现严重不良事件
        - ENV-294 2 期试验中任何治疗相关 SAE，涉及免疫抑制、肝毒性或脱靶系统性毒性
        - 抹去主要竞争优势（类生物制剂安全性画像）；FDA 临床搁置风险；rNPV 全面受损
        - 在 FDA/IRB 调查结果明确前，立即下调至回避
      - - Sanofi 战略性退出
        - Sanofi 不续签 Series C 商业安排，或大幅缩小合作范围
        - 有尽调访问权的内部参与方释放负面信号；平台验证主张的可信度下降；也提示内部可能存在科学层面担忧
        - 下调至观察（由跟踪下调）；在进一步投入前要求披露 Sanofi 协议完整条款
      - - AI 药物发现板块估值倍数压缩
        - 公开市场 AI 药物发现同业（RXRX、SDGR）因临床失利，市值较 2026 年 5 月水平进一步下跌 >50%
        - 压低私募市场可比估值底部；未来融资下轮降估值风险上升；临床开发资本成本抬高
        - 维持观察；承认宏观风险；争取更早披露 Phase 2b 数据，以证明当前入场价格合理
      - - 融资未跟上导致资金耗尽
        - 证据显示，若没有新一轮融资，Enveda 现金跑道不足 12 个月；公司可能无力完成 Phase 2b 试验
        - 执行风险变成生死问题；Phase 2b 可能被迫延期或重构；也可能触发困境出售
        - 紧急尽调问题：继续投入前，确认现金头寸和 Phase 2b 完成所需融资计划
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
    notes: 退出条件是监测信号，不是必然结果。每个触发项都要确认后才能采取交易动作。ClinicalTrials.gov 是监测 Phase 2a 入组和方案修订的主要来源。
    sourceRefs:
      - SV001
      - SV007
      - SV015
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - Series D 确切投后估值
        - 投后估值未公开披露；只能确认独角兽底线（$1B+）
        - 计算资本成本、分析优先权清算瀑布、测算未来轮次稀释敏感性，都离不开这一数字
        - 直接向 Enveda CFO / 公司发展团队索取；备选路径：查阅 Colorado 实体向 SEC 提交的任何 Form D
      - - 经审计财务报表与烧钱速度
        - 公开渠道没有经审计财报；未披露烧钱速度、现金跑道估计或现金余额
        - 缺少这些数据，rNPV 与价格的比较缺少关键分母；烧钱速度决定下一轮融资前时间，也决定公司撑到 Phase 2b 完成的概率
        - Enveda 投资者关系：soumoditya.dey@enveda.com（公司发展副总裁）；若实体在 UK 注册，查 UK Companies House；或把披露作为参与下一轮融资的条件
      - - Sanofi 合作条款
        - Sanofi 作为 Series C 锚定方的安排中，财务范围、排他条款、里程碑结构和共同开发权利均未披露
        - Sanofi 参与可能意味着未来 $100–500M 里程碑价值，也可能只是少数股权投资、没有临床承诺；两者差异足以改变投资逻辑
        - 向 Enveda 索取条款清单摘要；查阅 SEC 8-K 等同文件或 Form D 修订，寻找任何合作协议登记
      - - Phase 2b 统计分析计划（SAP）
        - 截至 runDate，Phase 2b 设计（样本量、主要终点、成功标准）尚未提交至 ClinicalTrials.gov
        - Phase 2b 成败高度取决于终点选择和样本量；设计不佳的试验可能让真正有效的药得到技术性阴性结果，反之亦然
        - 监测 ClinicalTrials.gov NCT 上 ENV-294 Phase 2b 备案；向 Enveda CMO Jose Trevejo 索取 SAP
      - - Phase 1b 完整数据集的同行评议发表
        - Phase 1b 结果以新闻稿（2026 年 3 月）和网络直播发布；完整生物标志物、PK/PD 和安全性数据集尚未经同行评议
        - 同行评议是临床主张的标准验证步骤；没有已发表数据集，外部无法独立评估科学性
        - 监测 NEJM、JAMA Dermatology、JID 和 Annals of Allergy 上的 ENV-294 Phase 1b 投稿；向 Enveda 医学事务团队索取预印本
    claimRefs:
      - CV037
      - CV038
      - CV039
    notes: 这五个尽调问题都是从观察上调至买入的关键。最关键的是 Phase 2b SAP，它决定试验是否具备足够统计功效，支撑监管申报。
    sourceRefs:
      - SV001
      - SV003
      - SV006
