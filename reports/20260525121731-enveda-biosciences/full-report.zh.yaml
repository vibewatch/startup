      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              Viswa Colluru, PhD 是 Enveda Biosciences 的唯一创始人兼 CEO。Colluru 是第一代移民，在印度南部长大，父亲经营药房；他在 University of
              Wisconsin-Madison 获癌症生物学博士，是 CMB Class of 2011 最年轻的博士毕业生。之后他在 Recursion Pharmaceuticals
              担任首位创新科学家和产品经理，搭起产品组合和早期商业团队，随后离职创办 Enveda。Colluru 先用大约 $55,000
              个人储蓄为公司注入种子资金，再启动机构融资；他把创办公司称为高度个人化的使命——母亲罹患可治疗白血病而家庭无力负担现有药物，这段经历塑造了他加速药物发现的目标。截至 2026 年，在 Colluru
              带领下，Enveda 已扩至 300 多名员工、累计融资 $517M。

              更广的高管团队包括 Chief Execution Officer Daniel Wee（负责运营策略和沟通）；Chief Medical Officer 兼 Head of Clinical Pipeline
              Strategy Jose Trevejo, MD, PhD，他主导了 2025 年 12 月启动 2 期的公告；2025 年 1 月任命的 CFO Jason Kim，拥有 20 多年生物制药财务领导经验，曾任
              Molecular Templates President/COO/CFO 并融资超过 $500M；Chief Technology Officer August Allen（Bruker
              客户材料中将其列为代谢组学平台负责人）；以及 2025 年 12 月任命、负责组合策略的 Nadeem Sarwar, PhD。Christopher K. Porter, MBA, JD 于 2026 年 4
              月获任 Clinical Operations SVP，以支撑扩张中的临床项目。

              董事会治理大多未披露。Pfizer 前 Chief Scientific Officer 兼 Worldwide R&D President Dr. Mikael Dolsten 在 2025 年 9 月 D
              轮交割时加入董事会；其 Pfizer 任内曾推动 150 多个候选药物进入临床研究并促成 36 项获批。鉴于各自领投角色，投资人董事席位很可能包括 Premji Invest、Kinnevik 和 Lux
              Capital，但除 Dolsten 与 Colluru 之外，正式董事构成尚未公开确认。关键人风险实质存在：Colluru 是公司的公众面孔、首席科学家和主要融资人。
