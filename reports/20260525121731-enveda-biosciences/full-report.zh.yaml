  - id: TV004
    title: 可比估值表
    enumeration: true
    enumerationScope:
      coverage: sample
      basis: >
        Comparables selected to represent: (1) the closest public AI-drug-discovery platform peers with NASDAQ listings
        (RXRX, SDGR, RLAY, ABSI); (2) the most relevant private AI-drug-discovery peers at comparable development stage
        (Insilico, Generate:Biomedicines); (3) a cautionary-tale public benchmark (BenevolentAI — illustrating maximum
        AI drug discovery valuation compression risk). Isomorphic Labs (Alphabet subsidiary) and Atomwise excluded as
        not separately valued or insufficiently comparable in clinical stage.
    columns:
      - 可比公司
      - 阶段 / 收入
      - 市值 / 估值（2026 年 5 月）
      - 关键指标
      - 与 Enveda 的相关性
      - 局限
    rows:
      - - 'Recursion Pharmaceuticals (NASDAQ: RXRX)'
        - 临床阶段；无产品收入；累计合作付款 $450M+；净亏损 $463.7M（FY2024）；现金 $594.3M（2024 年 12 月）
        - $1.6B 市值（Yahoo Finance，2026 年 5 月）；52 周区间 $2.77–$7.18
        - 市值 / 累计合作付款 ≈ 3.5×；股价较 2021–2022 年 $5B+ 峰值下跌约 68%
        - 最直接可比的 AI 优先药物发现平台；NASDAQ 上市；多个大型药企合作（Sanofi、Bayer、Roche/Genentech、Merck KGaA）；收购 Exscientia（2024 年 11 月）
        - Recursion 规模大得多（$594M 现金 vs. Enveda 未披露）；有产生收入的合作；首个临床候选物未显示疗效 — 这是 AI 药物发现临床风险的直接反向可比
      - - 'Schrödinger, Inc.（NASDAQ: SDGR，可比公司）'
        - 商业化阶段软件 + 临床管线；总收入 $255.9M（FY2025）；软件收入 $199.5M；净亏损 $103.3M（FY2025）；ACV $198.5M
        - $994M 市值（Yahoo Finance，2026 年 5 月）；Yahoo Finance 显示分析师 SELL 评级
        - EV / Revenue ≈ 3.9×；软件提供 Enveda 缺少的非稀释收入基础；物理模型差异化 vs. Enveda 的天然产物 AI 路线
        - 最接近的 AI 药物发现上市同业，且有实际收入；向全球前 20 药企授权软件；拥有自有临床管线（LRRK2、oncology）
        - Schrödinger 拥有 $200M+ 经常性软件收入 — 这是 Enveda 缺少的根本优势；截至 2026 年 5 月，Schrödinger 的临床管线不如 ENV-294 先进
      - - 'Relay Therapeutics (NASDAQ: RLAY)'
        - 临床阶段；1/2 期肿瘤 AI 设计小分子；无产品收入
        - $2.9B 市值（Yahoo Finance，2026 年 5 月）
        - 市值由领先肿瘤项目临床数据驱动，而非平台溢价；已提交 10-K（2025 年 2 月，SEC EDGAR accession 0000950170-25-027756）
        - AI 辅助药物设计，肿瘤临床阶段管线；说明有强临床数据时，AI 药物发现估值仍可维持高位
        - Relay 的肿瘤重点和激酶抑制剂机制，与 ENV-294 的免疫学和新型 LOCKTAC 机制存在实质差异；肿瘤使用不同的概率调整倍数
      - - 'Absci Corporation (NASDAQ: ABSI)'
        - 临床前至早期临床；AI 蛋白设计平台；收入有限；10-K 于 2025 年 3 月提交（SEC EDGAR accession 0001950452-22-000001 domain）
        - $795M 市值（Yahoo Finance，2026 年 5 月）
        - 纯 AI 蛋白设计；截至 runDate 无临床证明；市值反映平台溢价，而非管线 NPV
        - AI 优先药物设计公司；说明临床前 AI 平台可获得的市值区间
        - Absci 的蛋白设计与 Enveda 的天然产物代谢组学平台是根本不同的技术；作为直接估值基准较弱
      - - Insilico Medicine（私营；已提交香港 IPO）
        - 2a 期（IPF，ISM-001 — AI 设计的同类首创）；上一轮私募估值约 $1B（2022 Series D）
        - 约 $1B 私募估值（2022）；STAT News 2024 年 12 月分析称，2a 期 IPF 结果未达到主要统计显著性阈值
        - 临床证明未能在主要终点上兑现；尽管公司声称是首个进入人体的 AI 设计药物，2a 期主要终点仍未达成
        - 估值相近的最直接 AI 药物发现私营可比；first-in-class 主张和平台到临床叙事与 Enveda 可比
        - 2a 期失败是 Enveda 的关键反向数据点：它说明，AI 辅助发现出已具备 2 期条件的分子，并不保证 2 期临床成功
      - - Generate:Biomedicines（私营）
        - 临床前；AI 蛋白设计；2024 年 Series C 融资 $370M，估值约 $1.7B
        - 约 $1.7B 估值（2024 Series C）
        - 资本比率：约 $1.7B / $370M 融资 ≈ 4.6×；高于 Enveda 的 1.9×，反映 AI 蛋白设计市场溢价
        - 说明私募市场对没有临床证明的 AI 生物学平台仍有需求；为 Enveda 估值中的平台溢价部分提供基准
        - Generate:Biomedicines 没有临床阶段资产；全部价值来自平台可选性 — 相比拥有 2a 期资产的 Enveda，是较不有利的可比
      - - 'BenevolentAI (Euronext: BAI)'
        - 临床阶段；AI 辅助药物设计；2022 年 Euronext 上市时估值峰值 >£1B
        - 市值从上市时 >£1B 崩至 2025 年约 £50–100M；投资人信心接近归零
        - 临床管线受挫和战略重组后，上市后估值毁灭 >90%
        - 警示性可比：未能把平台承诺转成临床证明的 AI 药物发现公司，最大下行可能如此
        - BenevolentAI 是纯下行基准；其崩盘由临床失败和管理不稳定驱动，而非机制本身 — 不一定预示 Enveda 的路径
