      - number: '5.6'
        title: 图表
        blocks:
          - type: callout
            title: Phase 1b 疗效信号在 AD 口服药中异常突出
            body: >
              ENV-294 在 9 名中重度特应性皮炎患者中的 Phase 1b 结果——100% EASI-50、78% EASI-75、56% EASI-90、Day 42 平均 EASI 下降
              85%，且无严重不良事件、无停药——在数字上优于多数已获批 AD 生物制剂的 Phase 2 基准。KOL Jonathan Silverberg（George Washington
              University）表示：「如果在更大研究中得到确认，ENV-294 可能代表特应性皮炎治疗的一项重要进展。」停药后反应继续加深，提示疾病修饰而非单纯症状抑制，这会让它在临床上区别于现有 JAK
              抑制剂。Phase 1b 数据集很小（n=9，开放标签），但反应深度、起效速度（Day 8）和停药后持久性的组合值得关注。
            calloutType: strength
            claimRefs:
              - CE020
              - CE021
              - CE022
              - CE025
          - type: callout
            title: Phase 2 数据缺口是核心不确定性
            body: >
              截至 2026 年 5 月，ENV-294 的全部临床证据都来自 9 名患者的开放标签、单臂 Phase 1b 研究。AD 和哮喘的 Phase
              2a（随机、双盲、安慰剂对照）试验正在进行，但未充分赋能的数据尚未披露。全行业炎症疾病 Phase 2 失败率超过 50%。LOCKTAC 机制新颖且生物学上合理，但尚未在受控试验中证明人体概念验证。AD 的
              Phase 2b（目标 2026 年中）计划在 Phase 2a 数据读出前启动，可能导致公司在 Phase 2a 信号确认前就把大量资本投入更大研究。如果 Phase 2a
              出现不利结果，整个管线估值论点都需要重新评估。
            calloutType: risk
            claimRefs:
              - CE026
              - CE027
              - CE053
          - type: callout
            title: 对 Bruker 的单一硬件依赖带来供应集中风险
            body: >
              Enveda 的整个质谱数据采集层依赖 Bruker timsTOF Pro 2 仪器；这是唯一商业可得、能在 Enveda 所需通量和谱图质量下结合高分辨率 MS/MS
              与捕获离子淌度（TIMS）的平台。这构成单一供应商依赖，且公司未披露备份方案。Bruker 于 2023 年被 Brookfield Business Partners
              收购，引入了私募股权所有权变量。Bruker 供应链、定价或服务可得性一旦受扰，可能实质削弱 Enveda 的数据生成能力。依赖 CCS 的模型（DreaMS、结构预测）是在 Bruker
              特定谱图特征上训练的；切换到替代 MS 平台，需要在新的谱图画像上重新训练。
            calloutType: risk
            claimRefs:
              - CE001
              - CE045
          - type: callout
            title: DreaMS 论文在同行评审文献中验证核心 ML 方法
            body: >
              DreaMS 在 Nature Biotechnology（2025）的发表，是目前 Enveda AI 方法论可获得的最高质量独立验证。DreaMS transformer 与 Enveda
              之外的科研合作者共同开发（Pluskal Lab，Czech Academy of Sciences / Masaryk University），并通过 Nature Biotechnology
              同行评审发表。它在谱图相似性、化学性质预测和结构注释任务上的领先结果，为支撑 Enveda 结构预测能力的核心 ML 架构提供外部验证，说明其科学上可信。模型权重（Zenodo）和 DreaMS
              Atlas（HuggingFace）公开可得，也支持独立复现；这种科学透明度在 AI 驱动药物发现公司中并不常见。
            calloutType: insight
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE036
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 尚未商业化药物发现公司的客户与利益相关方框架
        blocks:
          - type: paragraph
            body: >
              从商业意义上说，Enveda Biosciences 还没有传统客户。Enveda 成立于 2019
              年，是一家尚未商业化的药物发现公司；商业模式围绕从天然来源发现新型小分子药物，并推进临床试验，目标是与大型药企授权或商业化。截至 2026 年 5 月，没有产品获批，没有披露授权收入，也没有宣布传统客户合同。

              因此，尽调中的「客户」章节必须划分四类结构上不同的利益相关方。第一类是 B2B 技术和仪器合作伙伴，它们与 Enveda 平台团队合作，并为 Enveda 方法论提供科学验证。Bruker Daltonics
              是这一层最重要的伙伴，自 2021 年以来提供 timsTOF Pro 2 质谱仪，并发布具名案例研究，包含 Enveda 科学家的原话引用——这是本章最强的客户证明证据。Microsoft
              是第二个平台合作伙伴；它与 Enveda 在 PRISM 基础模型上的合作于 2024 年 5 月宣布，在规模化层面验证了 AI 化学平台。Bill & Melinda Gates Foundation 与
              Enveda 合作，把平台用于全球健康适应症（结核病、疟疾），代表一种兼具慈善和商业属性、并带有第三方验证权重的混合关系。

              第二类是药企投资者和未来授权交易对手。Sanofi 的战略投资（作为 C 轮一部分）代表药企行业背书，也带有授权选择权；Sanofi 投资 Enveda
              的同时，也在特应性皮炎中推进自有竞争资产，因此既带来合作深度，也引入需要尽调的潜在利益冲突动态。第三类是截至 2026 年 5 月，当前入组 ENV-294 Phase 2 特应性皮炎（估计 60
              人）和哮喘（估计 50 人）试验的约 ~110 名临床患者，代表公司与终端用户的最早直接接触。第四类是未来患者人群，即获批药物的最终客户；Enveda 四个适应症领域合计覆盖超过 140 million
              美国患者。[CU001, CU002, CU003, CU004]
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
