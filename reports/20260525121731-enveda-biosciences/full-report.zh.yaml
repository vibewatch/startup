      - number: '6.3'
        title: 具名合作伙伴、协作者与临床试验利益相关方
        blocks:
          - type: paragraph
            body: >
              除四个主要具名合作伙伴外，Enveda 的利益相关方足迹还包括临床试验中心运营方和接近患者倡导网络的组织，它们构成终端用户接触的最早证据。

              临床试验基础设施：截至 2026 年 5 月，Enveda 运营三项活跃或近期完成的临床试验。NCT07336940（Phase 1b ENV-294，特应性皮炎 / 健康成人）已完成，主要完成时间为 2026
              年 1 月，Enveda 于 2026 年 3 月宣布积极结果。NCT07298395（Phase 2a ENV-294 特应性皮炎）正在主动招募，估计 60 名参与者，覆盖美国多个中心，包括
              Birmingham (AL)、Hot Springs (AR)、Beverly Hills (CA)、Fremont (CA) 和 San Diego (CA)。NCT07301255（Phase 2a
              ENV-294 哮喘）正在招募，估计 50 名参与者。这些试验让 Enveda 成为学术和临床研究组织的活跃发起方兼协作者，不过除「Enveda Investigative
              Site」之外，具体中心名称未公开识别。[CU012, CU013, CU014]

              ENV-308（肥胖，IND 于 2025 年 12 月获放行）和 ENV-6946（IBD，IND 于 2025 年 12 月获放行，Phase 1 已启动）的 Phase 1
              试验进一步扩大了临床合作伙伴网络。Nadeem Sarwar, Ph.D. 已被任命在 ENV-308 Phase 1 启动的同时负责代谢疾病项目。[CU015, CU016]

              Enveda 还在 2025 年 9 月 D 轮融资中邀请 Mikael Dolsten（Pfizer
              前首席科学官，任职超过十年）加入董事会，释放出公司可以触达高价值制药行业网络的信号。尽管这一董事会层面的关系不是商业合作，但实质增强了 Enveda 未来接触授权合作伙伴的能力。[CU017]

              未来药企授权是 Enveda 最主要的收入商业路径。截至 2026 年 5 月，公司没有公开宣布任何授权交易或共同开发协议。这是重大证据缺口：Enveda 关于「比行业平均快 4X」发现药物的管线主张，以及
              Fast Company 2026 年生物技术最具创新力公司认可，尚未转化为已披露的商业合作经济条款，授权价值创造仍未得到验证。[CU018, CU019]
