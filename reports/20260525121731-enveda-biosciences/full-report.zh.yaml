          - type: callout
            title: 《名古屋议定书》合规不是可选项
            body: >
              《名古屋议定书》关于获取与利益分享的安排（in force since October 2014）为每一个从 CBD 缔约国取得、并用于识别商业化合物的植物 accession
              建立了有约束力的事先知情同意和利益分享义务。对一家从生物多样性生态系统拥有 38,000+ 个植物样本库的公司来说，合规需要大规模系统性文档，不是打勾项。投资者在投入资本前，应要求查看 ENV-294 来源材料的
              ABS Clearing-House 合规记录。
            calloutType: risk
