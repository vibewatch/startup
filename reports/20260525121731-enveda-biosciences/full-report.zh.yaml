        - 索取期中 DSMB 安全报告；确认主要 / 次要终点层级；询问 Phase 1b 剂量反应细节
      - - ENV-294 Phase 2a 哮喘读出失败（NCT07301255）——与 AD 试验时间重叠，形成同步二元风险
        - '美国 FDA（IND 监管试验，isFdaRegulatedDrug: true）'
        - 截至 2026 年 4 月正在招募；主要完成时间 2026 年 12 月；尚未发布结果
