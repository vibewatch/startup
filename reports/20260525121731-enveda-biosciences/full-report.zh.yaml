            title: Phase 2 数据成熟后，Enveda 的「客户」宇宙会快速变化
            body: >
              根据 ClinicalTrials.gov，ENV-294 特应性皮炎 Phase 2 数据预计在 December 2026 产生。若结果积极，这将是 Enveda 首次拿着 Phase 2
              疗效数据谈授权，历史上这是药企合作估值的重要拐点。同样预计 late 2026 读出的哮喘 Phase 2 数据，可能把授权机会翻倍。投资者应对照类似天然产物衍生药物授权交易（例如 Tango
