  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >
              Enveda Biosciences 于 September 2025 完成 $150 million Series D，由 Premji Invest 领投，Baillie
              Gifford、Kinnevik、Lingotto Investment Management、Peakline Partners、FPV、Socium Ventures、Dimension、Level
              Ventures、Henry Kravis、IA Ventures 和 Lux Capital 参投。本轮超额认购，并正式让公司进入独角兽行列，意味着投后估值超过 $1 billion。此前，公司在
              February 2025 完成 $150 million Series C，Sanofi 作为战略锚定方参与；公司所有轮次披露融资总额因此达到 $517 million。更早轮次包括 June 2024 的
              $55 million 融资和 November 2024 的 $130 million extension，合计贡献约 $217 million Series D 前资本堆栈。累计融资与隐含估值之比约为
              1.9×（即 $1B / $517M），相较峰值时达到 $3–8× 的 AI 药物发现可比公司显得相当克制：Recursion IPO 时估值约 $2B，累计融资约 $250M（约
              8×）；BenevolentAI 在崩盘前以远少于此的资本达到 £1B
              市值。这种克制说明，定价可能较为自律，可能由内部人主导、第三方价格发现有限，也可能真实反映了投入资本与平台成熟度的匹配。重要的是，Series D
              的确切投后估值并未公开披露；「$1B+」下限来自公开独角兽称号。Sanofi 在 Series C 中作为战略锚定方，提供了来自全球 top-five 药企的验证，但任何相关合作协议的财务条款尚未公开。截至
              runDate，Enveda 没有产品收入，全部运营支持来自股权融资，且未披露 grant 或授权收入。Royalty Pharma 也宣布与 Enveda 达成 royalty interest
              deal，提供非稀释性资本机制，并暗示机构对 ENV-294 商业前景有信念。
