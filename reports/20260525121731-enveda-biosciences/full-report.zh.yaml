      - number: '5.2'
        title: 药物发现流程——从植物到候选药物
        blocks:
          - type: paragraph
            body: >
              Enveda 的端到端药物发现流程，把传统上需要多年手工天然产物分离的工作，压缩成高通量、数据库中心的流程。流程从公司的 38,000
              种植物知识图谱中选择物种开始；知识图谱会按每个物种对目标适应症的预测治疗相关性，以及相对已知结构空间的化学新颖性打分。

              选定植物组织后，用有机溶剂萃取，并通过液相色谱分级。每个级分被分成两份：一份进入 Bruker timsTOF Pro 2 做 LC-MS/MS 和 TIMS
              测量；另一份并行进入数十个同步体外生物测定，覆盖相关生物通路。「边测量、边筛选」的架构意味着 Enveda 不必先知道级分中是什么化合物再测试活性；MS/MS 谱图和生物活性数据并行生成，再由计算方法连接。

              ML 解卷积步骤用统计模型，把每个级分中的特定 MS/MS 谱图特征与特定生物活性信号关联起来。若级分同时具备正确活性组合、低预测毒性和结构上可处理的化学特征，就会被提升到下一步研究。此时，类似 DreaMS
              的结构预测管线会从 MS/MS 谱图推断可信分子结构，再由药物化学家优先进行分离、NMR 结构确认和类似物设计。Bruker
              案例研究指出，「天然产物中的生物活性成分往往丰度很低，难以分离出足够数量，用核磁共振（NMR）进行结构分析」；Enveda 的 ML 优先方法让它能先形成结构假设，再投入昂贵的 NMR 确认步骤，从而提升通量。

              经验证的命中系列随后进入标准的命中到先导和先导优化化学，之后是 GLP 毒理研究和 IND 申报支持项目。Enveda 已经连续快速获得多项 FDA IND 放行：2024 年 ENV-294，2025 年 12
              月 ENV-308 和 ENV-6946。公司称发现速度比行业平均快 4×，依据是这种并行、数据库驱动的方法，而不是先分离、后筛选的顺序流程。
            claimRefs:
