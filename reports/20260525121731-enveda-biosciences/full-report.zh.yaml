          - type: callout
            title: 一药多管线策略：约 5 年内从同一平台产出 3 个新型临床资产
            body: >
              Enveda 于 2025 年 12 月同步启动 ENV-308（肥胖）和 ENV-6946（IBD）1 期，并推进 ENV-294 进入 2a 期，显示一家成立 5 年的生物技术公司具备罕见的平台生产率：3
              个全资、自主发现、机制新颖且瞄准高价值适应症的临床资产。公司称每个开发候选物成本约 $1M，而行业平均为 $10–15M；若属实，意味着约 10× 的资本效率优势。
