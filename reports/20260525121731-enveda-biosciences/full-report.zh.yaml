      - number: '7.6'
        title: 缓释因素与终止标准
        blocks:
          - type: paragraph
            body: >
              Enveda 对上述风险有几项结构性缓释因素。临床端，9 名 AD 患者的积极 Phase 1b 数据（March 2026）提供了生物学概念验证，说明 ENV-294 能到达目标组织并调节相关通路，从而把
              Phase 2 失败概率从纯机制不确定性降低到剂量 / 暴露和人群变异问题，尽管不能消除失败风险。Phase 2a 试验规模合理（60 名 AD、50
              名哮喘），采用盲法，并使用已验证终点（EASI、vIGA、FEV1、ACQ-5）。

              IP 方面，公司看起来在追求针对新型合成类似物的物质组成专利，而不是天然化合物本身，这一路径更可防守。《名古屋议定书》合规方面，化合物采集前系统性签署利益分享协议才是合适缓释措施；公司应为每一个
              accession 保存有据可查的来源记录。

              资本端，药企合作交易——在 Phase 2 数据后授权 ENV-294——会显著延长现金跑道，并验证投资逻辑。多个大型药企 AD 项目（Sanofi/Regeneron 的
              dupilumab、AstraZeneca 的 tezepelumab）已证明 Phase 2 阶段合作分子的商业可行性。Enveda 若在 Phase 2
              数据前启动合作讨论会受益；数据后谈判通常要价更高，但需要积极结果。

              识别出四个终止标准触发点：（1）ENV-294 AD Phase 2a 试验在 Week 12 未能以统计显著性实现相对安慰剂 ≥30% EASI 改善——终止 AD 项目，并重新评估哮喘定位；（2）AD
              和哮喘两项 Phase 2a 同时失败——强烈提示需要重组管线，并可能整合临床项目；（3）《名古屋议定书》合规审计发现任何商业化合物存在未记录植物
              accession——需要立即补救，并可能造成监管申报延迟；（4）Series E 融资估值低于 $800 million（较 Series D 下调
              >20%）——表明投资者信念流失，需要战略复盘，包括合作或收购路径。
