      - number: '7.2'
        title: IP、法律与生物多样性合规风险
        blocks:
          - type: paragraph
            body: >
              天然产物衍生药物发现带来结构上不寻常的知识产权环境。在 35 U.S.C. § 101 及 Alice/Mayo（2012–2014）之后的解释下，针对分离天然产物或其盐 / 衍生物的权利要求，在 USPTO
              面临更高的专利适格性审查。具体的合成修饰、新形式、组合或治疗方法仍有机会获得专利保护；但如果公开化学数据库（PubChem、ChemSpider）中已有结构类似的现有技术，核心天然骨架未必能独立受保护。若某化合物在
              Ayurvedic、TCM 或原住民社区有民族植物学用途，即使没有公开临床试验，只要传统上已知治疗适应症，也可能面临显而易见性挑战。

              WIPO 管理的《知识产权、遗传资源及相关传统知识条约》（adopted May 2024）和现有《名古屋议定书》（CBD ABS 框架，in force since October
              2014）共同为从生物多样性丰富国家获取遗传资源的公司建立了有约束力的合规层。根据《名古屋议定书》，采集生物材料之前必须与提供国建立事先知情同意（PIC）和共同商定条款（MAT）；遗传资源利用情况必须向 ABS
              Clearing-House 披露；利益分享义务可以包括 royalty 支付、共同署名或社区利益基金。Enveda
              的商业模式是系统性地从全球生物多样性生态系统采集植物样本，因此《名古屋议定书》合规是结构性、持续性的法律义务，而不是一次性 clearance。若无法为用于发现商业化化合物的每一个植物 accession 记录
              PIC/MAT，监管批准阶段可能被卡住，公司也可能面临提供国的条约违规主张。

              在 CourtListener 联邦法院记录中未发现 Enveda Biosciences 或 Enveda Therapeutics 诉讼（RECAP Archive search，May
              2026）。Zymergen 证券集体诉讼（5:21-cv-06028，N.D. Cal.，March 2024 amended complaint）在制药行业背景文件中把「Enveda
              Therapeutics, Inc.」作为上下文提及，但被告是 Zymergen，不是 Enveda。已复核的专利检索记录未发现以 Enveda 为名的专利抵触程序、IPR petitions 或 inter
              partes reviews。USPTO patent public search 和 Google Patents 对「Enveda」受让人的搜索结果，与一个相对早期的申请组合相符；这些申请相较
              Sanofi、AstraZeneca、Bayer 和生物技术专门公司持有的成熟天然产物化学 IP，到底有多宽、多能防守，尚未被独立确认。

              商业秘密风险很高：PRISM 平台自研的质谱注释模型、植物化合物 ontology 和生物活性预测算法构成核心护城河。员工流向竞争对手（Recursion、Insilico、大型药企）可能比正式 IP
              更快侵蚀这些商业秘密。竞业限制的可执行性随司法辖区变化；Enveda 总部所在 Colorado，在 2022 后法定变化之后，历史上竞业限制执行偏弱。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
