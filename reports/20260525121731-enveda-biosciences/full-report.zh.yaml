        title: 佐证材料
        blocks:
          - type: callout
            title: December 2026 双 Phase 2a 二元风险
            body: >
              两项 ENV-294 Phase 2a 试验（AD：NCT07298395，60 名受试者；哮喘：NCT07301255，50 名受试者）的预计主要完成时间都在 December
              2026。这制造了相关性二元风险事件：两个对投资逻辑至关重要的读数会同时发生，而在可能的 Series E 融资窗口前，留给公司纠偏的时间有限。双失败场景会击穿投资逻辑。
            calloutType: risk
            claimRefs:
              - CR001
