      - number: '6.5'
        title: 留存、集中度风险与反向证据
        blocks:
          - type: paragraph
            body: >
              Enveda 没有商业客户，也没有披露收入，传统留存指标（NRR、GRR、churn）在结构上并不适用。更可比的指标是临床试验留存（受试者脱落率、Phase 1b 到 Phase 2
              的推进率），以及平台合作的持续时间和深度。

              平台合作韧性：Bruker timsTOF 自 2021 起就是 Enveda 的核心仪器平台，已连续四年，说明仪器合作伙伴的黏性很高。Microsoft PRISM 合作在 May 2024
              宣布，看起来仍是持续中的研究合作，但未披露多年期承诺条款。Gates Foundation 合作的期限和财务承诺未披露。Sanofi 在 Series C（February
              2025）中的战略投资意味着多年期投资者关系，但不保证未来任何授权或共同开发排他权。[CU028, CU029]

              以 Enveda 当前阶段看，集中度风险在结构上很重。整个商业逻辑押在三件事上：（a）ENV-294 至少在特应性皮炎或哮喘之一（或两者）成功；（b）吸引愿意支付实质性里程碑款和 royalty
              的药企授权伙伴；（c）平台继续以公司声称的速度产出开发候选物。若 ENV-294 Phase 2 失败，Enveda
              最成熟、也最受外部验证的商业资产将被清零，而更早期的两个项目（ENV-308、ENV-6946）预计数年内不会产生授权收入。[CU030, CU031]

              反向证据来自 BioPharma Dive 对 2025 年更广泛 I&I 临床格局的分析。文章记录，Amgen 的 OX40L 抗体竞争者「在 Phase 3 湿疹试验中表现不及预期，引发投资者怀疑
              amlitelimab 在后期测试中的表现可能无法匹配 Phase 2 观察结果」。文章还指出，Sanofi 的 amlitelimab
              在哮喘中期试验中「未达目标」。这些失败发生在资金雄厚的大型药企身上，且适应症与 Enveda 相同，说明特应性皮炎和哮喘从 Phase 2 向 Phase 3
              转化高度不确定，即使生物学理解已接近同类最佳也一样。生物技术行业整体仍被描述为「处在不确定状态」，投资者也不像过去那样稳定奖励积极的临床试验结果。[CU032, CU033]

              Enveda 没有披露任何药企授权谈判、条款清单或商业化前协议。其独角兽估值（$1B+）由投资者隐含得出，基础是 September 2025 Series D 融资 $150M，暗示投后估值
              $1B+。没有任何具名未来客户表达授权 Enveda 资产的意向。因此，商业路径完全依赖尚未在确证性 Phase 2 层面产出的临床数据。[CU034, CU035]
