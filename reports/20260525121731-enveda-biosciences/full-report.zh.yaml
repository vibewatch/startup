      - number: '7.3'
        title: 资本、烧钱速度与财务风险
        blocks:
          - type: paragraph
            body: >
              Enveda 于 September 2025 完成 $150 million Series D，并以约 $1 billion 估值达到独角兽状态。公司员工数 300+，有三个临床阶段项目、六个
              IND-enabling 资产和十七个已披露开发候选物，年烧钱速度很可能在每年 $80–130 million 区间——假设每项 Phase 2a 研究临床试验成本为 $15–30
              million，再加上平台运营费用、生物技术高级薪酬水平下的工资，以及 CMC / 生产基础设施。按这一烧钱速度，$150M Series D 自交割起提供约 14–22 个月现金跑道，意味着 Series E
              融资需在约 late 2026 到 mid-2027 前完成，才能避免现金跑道缺口。

              资本市场环境不利：AI 药物发现板块在 2023–2025 经历显著重估。Recursion Pharmaceuticals（NASDAQ: RXRX）股价较 2021 高点大幅下跌；截至 April
              2026，Recursion 宣布 CEO Chris Gibson 不再寻求连任，这类领导层信号常与业绩压力相关。Insilico Medicine 的 IPO 计划一再推迟。BenevolentAI 在
              2024 进入破产管理。这些公开市场信号为私有 AI 药物发现融资建立了负面参照系，因为 Series E 投资者会用上市可比公司为 Enveda 轮次定价。若 December 2026 两项 ENV-294
              Phase 2a 同时失败，下轮下调或桥接融资场景将变得很可能。

              药物开发的资本强度对 Enveda 形成结构性挑战：单项 Phase 2 研究平均成本为 $20–50 million（Tufts CSDD 小分子估计），皮肤科和呼吸领域 Phase 3 研究通常每项耗资
              $100–300 million。若 ENV-294 在 Phase 2 成功，Enveda 需要 $200–400 million 完成 Phase 3 和 NDA 申报，超出 Series D
              所提供资本。因此，Phase 3 启动前，公司要么大规模融资，要么达成合作 / 授权交易。

              财务不透明（无公开 filings、未披露平台授权或合作收入）妨碍对现金状况的独立尽调。公司没有公开披露 Series D 资金是否仍全部未动用，或交割以来是否已有部分支出。
