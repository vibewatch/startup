      - number: '7.5'
        title: 运营、团队与平台风险
        blocks:
          - type: paragraph
            body: >
              关键人物风险偏高，并且结构性集中。Viswa Colluru（CEO / co-founder）是 Enveda 的公众面孔、科学架构师和主要融资负责人。作为早期临床阶段生物技术公司的创始人
              CEO，他若离开——无论自愿还是其他原因——都可能显著冲击投资者信心，带来合作重谈风险和人才流失。公司没有披露公开继任计划。科学顾问委员会若出现流失，尤其是失去 Cynthia He（生物学）或 Craig
              Crews 相关导师，会削弱传递给药企伙伴的科学可信度信号。

              质谱数据完整性是平台级运营风险。Enveda 的 38,000+ 个植物关联分子化合物库依赖可重复的 MS/MS
              谱图注释。若谱图匹配、保留时间校准或分子式指认出现系统性错误——无论由内部审计还是外部挑战发现——化合物-疾病关联数据库的有效性都会受到质疑。这类似于曾伤害其他组学平台公司的数据完整性问题（Theranos
              是极端案例；蛋白组学公司程度较轻）。Enveda 没有公开披露其谱图数据库的审计程序。

              生物多样性供应链风险很实质：从生物多样性地区获取植物材料需要现场采集，依赖地缘政治稳定、季节性准入、出口许可连续性，以及与当地合作伙伴的关系；这些国家的遗传资源出口监管环境可能复杂。任何高优先级植物采集地区中断，都可能拖慢化合物发现时间线。

              制造与 CMC（chemistry, manufacturing, and controls）风险对天然衍生化合物并不低：复杂天然产物类似物的合成放大，通常比全合成小分子更复杂；天然产物衍生 API
              的杂质谱表征可能需要大量分析开发。随着 Enveda 推动 ENV-294 和 ENV-308 迈向 Phase 3，CMC 复杂度会提高。
