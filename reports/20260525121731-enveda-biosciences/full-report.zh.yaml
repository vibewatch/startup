      - number: '1.3'
        title: 融资历程与投资人生态
        blocks:
          - type: paragraph
            body: >
              Enveda 自 2019 年创立以来，经过种子轮、A、B、C、D 轮累计融得 $517M。公司起步时由 Colluru 投入约 $55,000–$225,000 个人种子资金，随后获得机构支持。2021 年 6
              月 A 轮融资 $51M，由 Lux Capital 领投，为平台开发奠定资金基础。B 轮分两笔达到 $119M——2022 年 12 月首笔 $68M 股债结合融资，以及 2023 年 4 月将总额扩至
              $119M 的超募延伸轮。B 轮完成时，公司全球约有 250 名员工。

              2024 年 11 月 C 轮融资 $130M，由 Kinnevik 和 FPV 领投。2025 年 2 月，制药巨头 Sanofi 做出战略投资，使 C 轮总额增至
              $150M——这来自一家对炎症疾病有直接商业兴趣的大药企，是重要背书。D 轮于 2025 年 9 月 4 日以 $150M 完成，获得超额认购，由 Premji Invest（印度亿万富豪 Azim Premji
              的家族办公室）领投。D 轮新老参与方包括 Baillie Gifford、Kinnevik、Lingotto Investment Management、Peakline Partners、FPV、Socium
              Ventures、Dimension、Level Ventures、Henry Kravis（个人）、IA Ventures 和 Lux Capital。D 轮完成后，Enveda 据报道以约 $1B
              估值进入独角兽行列。

              投资人结构覆盖增长阶段科技投资人（Kinnevik、Baillie Gifford）、传统生物技术 VC（Lux Capital）、交叉基金（FPV、IA
              Ventures）和战略企业资本（Sanofi）。Premji Invest 领投 D 轮，又引入全球家族办公室维度。在当前生物技术宏观环境下，投资人类型广、轮次仍被超额认购，说明市场对平台和管线的信念很强。
