      - number: '6.6'
        title: 佐证材料
        blocks:
          - type: callout
            title: Bruker 合作构成最可信的客户验证信号
            body: >
              Bruker Daltonics 的客户洞察页由 Bruker 撰写，并包含 Enveda 高级科学家 Pelle Simpson 和 CTO August Allen
              的原话，是本章质量最高的客户验证证据。该页确认，timsTOF Pro 2 自 2021 起就是 Enveda 药物发现工作流中已部署到生产的核心环节，并明确列出科学优势（CCS 数据质量、MS/MS
              碎片清晰度）。与具名仪器伙伴连续四年生产部署，让 Enveda 区别于那些只有概念性平台叙事的更早期 AI 药物发现公司。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: 未披露任何药企授权交易，是重大商业尽调缺口
            body: >
              尽管 Enveda 已达到独角兽估值（September 2025 Series D 隐含投后 $1B+），截至 May 2026，公司尚未宣布任何药企授权交易、共同开发协议或商业化前条款清单。对 Enveda
              新闻站点地图、Sanofi 新闻稿和生物技术新闻数据库的全面复核没有发现此类公告。公司声称药物发现速度比行业平均快
              4X；在这种前提下，缺少任何与药企的商业授权安排，构成投资逻辑的首要财务风险，也应成为任何数据室中的强制尽调问题。
