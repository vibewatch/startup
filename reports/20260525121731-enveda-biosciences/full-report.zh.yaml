      - number: '4.4'
        title: 药企合作交易经济学与可比交易
        blocks:
          - type: paragraph
            body: >
              未来几年，Enveda 管线的商业价值主要会通过药企合作交易实现，而不是直接产品销售。因此，理解 AI 药物发现领域、尤其是特应性皮炎领域的交易经济学，是财务预测的关键。

              最直接可比的交易结构，是 Recursion Pharmaceuticals 于 2022 年 1 月宣布的 Sanofi 合作。根据协议，Sanofi 为 AI 驱动的肿瘤和免疫小分子发现支付 $100M
              首付款，总里程碑付款最高 $5.2 billion，另有分层版税。Recursion 还在 2021 年 12 月从 Roche/Genentech 获得 $150M 首付款，用于神经科学 / 肿瘤合作，覆盖最多
              40 个项目、每个项目里程碑潜力超过 $300M。这些交易为大型药企愿意为经过验证、且有临床证据点的 AI 药物发现平台支付什么价格，提供了模板。Enveda 的 ENV-294 Phase 1b 数据（2026
              年 3 月发布）作为验证材料，比 Recursion 当年谈这些交易时更强——Recursion 签 Roche 交易时仍完全处在临床前阶段。这说明 Enveda 谈 ENV-294 授权交易时议价位置更强，尽管
              Recursion 更宽的适应症覆盖和上市公司身份可能抵消部分优势。

              特应性皮炎适应症又增加了一层平台可比交易无法覆盖的收入上行。Dupixent 的商业基准（2024 年年收入 $13.5B）代表获批 AD 生物制剂的理想天花板。如果 ENV-294 的 Phase 1b
              画像（EASI 下降 85%，100% EASI-50）最终对应一种口服、同类首创小分子，合作方兴趣会很强。Sanofi 参与 C 轮的战略投资进一步提示，该公司可能已经把 ENV-294
              作为共同开发或授权标的评估。Enveda 至今没有披露任何已收到的授权或合作付款。公司也似乎没有签下类似 Recursion-Roche 的多项目平台合作，完整合作潜力尚未兑现，但仍保留。
