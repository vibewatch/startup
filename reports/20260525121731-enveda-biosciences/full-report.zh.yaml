      - number: '4.3'
        title: 临床开发成本与资本强度
        blocks:
          - type: paragraph
            body: >
              药物开发天然资本密集，评估 Enveda 财务规划时必须对照各临床阶段的既有成本基准。FDA 药物开发流程文件和 Tufts Center for the Study of Drug
              Development（CSDD）基准，是公开材料中最常被引用的参照。Phase 1 试验通常每项 $1–5M，取决于适应症、队列规模和临床中心复杂度。Phase 2 研究在目标患者人群中测试有效性，单项通常
              $7–20M。为监管批准所需的 Phase 3 确证性试验，小分子项目成本为 $40–100M+；特应性皮炎 Phase 3 项目患者规模大、随访期长，通常位于区间高端。按 Tufts CSDD 分析，从首个
              IND 到获批的总开发成本，计入失败项目后平均每个药物 $200–500M。

              具体到 ENV-294，AD 和哮喘 Phase 2a 试验（2025 年 12 月启动）是当前资本消耗事件。两个 Phase 2a 项目并行，Enveda 仅在这一资产上完成两个适应症很可能就要花
              $20–40M。如果两个 Phase 2a 分支都成功，Phase 2b 还会增加 $30–60M。Phase 3 需要 D
              轮之外的外部资本——要么通过药企合作（资本效率最高），要么继续股权融资，或推进公开发行。即便假设非 ENV-294 项目精简烧钱，当前 $150M D 轮也覆盖不了一个 Phase 3 项目的全部成本。

              由此得到的战略算式很清楚：在 ENV-294 需要 Phase 3 资金之前，Enveda 必须拿到有意义的药企合作（首付款足以覆盖 Phase 2b/3 成本），或再融资。16
              个临床前项目提供并行期权价值，但也会消耗资本。IQVIA 2026 Global R&D Trends 报告指出，AI 赋能项目在早期试验中显示出更强成功率，这为 Enveda
              的单项目资本效率论点提供宏观顺风。不过，同一份报告也指出，整体临床开发时间线并未实质缩短，意味着 AI 发现提速不会自动转化为后期开发更快或更便宜。
