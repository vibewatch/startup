      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              多重结构性力量正在扩大 Enveda 即将进入的市场。全球特应性疾病患病率上升——与城市化、污染和卫生假说相关——正在使确诊和治疗人群以高于历史水平的速度增长，尤其在亚洲。WHO 2025 年 12 月
              GLP-1 治疗指南把肥胖确认为需要药物管理的慢性病，为非 GLP-1 药物打开过去不存在的处方集准入路径。疗效相当时，患者明显偏好口服小分子而非注射生物制剂；ENV-294 1b 期数据暗示一个口服药能达到类似
              JAK 抑制剂的疗效，使其在这类偏好中站位有利。IQVIA 2026 年分析显示，AI 药物发现平台在 1 期到 2 期的成功率上出现早期改善证据，为 Enveda
              这类以平台可信度开场的公司提供声誉顺风。Enveda 累计融资 $517M，其中包括 2025 年 9 月以独角兽估值完成的 $150M D 轮，以及 Sanofi 参与 C 轮，说明投资人和战略伙伴信心强。

              约束端，AD 市场竞争高度激烈：dupilumab 占据主导地位；获批 JAK 抑制剂（upadacitinib、abrocitinib）带黑框安全警告，已重塑开方习惯；即将进入的 lebrikizumab 和
              tralokinumab 让赛道更拥挤。新进入者必须在机制、安全性或便利性上证明差异化。到 2025 年，AI 药物发现结果好坏参半——Insilico Medicine 2a 期失败、Recursion 2
              期无疗效——已提高投资人对该类别的审视。药物开发周期仍长（从靶点到首次 1 期的历史基准超过 7 年），且 IQVIA 数据显示 2025 年全行业试验间隔约延长 3
              个月，说明平台声称的速度优势在临床执行阶段会遇到真实运营摩擦。
