      - number: '4.2'
        title: 融资历史与资金续航充足性
        blocks:
          - type: paragraph
            body: >
              Enveda 在五年内按紧凑节奏累计筹集 $517 million 股权资本。种子轮 $4,999,998 由 2020 年 8 月 24 日提交的 SEC Form D 确认，首次销售日期为 2020 年 8
              月 11 日，为 2019 年成立后的公司启动提供资金。2021 年 6 月，公司完成 $51M A 轮（Lux Capital 领投）；2022 年 12 月完成 $68M B 轮。B1 轮延伸后总额达到
              $119M；约 $62.4M 的增量融资通过 2023 年 3 月 7 日提交的 Form D 注册，首次销售日期为 2022 年 8 月 25 日。2024 年 5 月，公司完成 $55M 融资。2025 年
              2 月完成 $150M C 轮，Sanofi 参与其中，战略意义明显。2025 年 9 月 4 日，Premji Invest 领投 $150M D 轮，公司获得独角兽身份。EDGAR
              实体页面确认公司的法律申报主体为 Enveda Therapeutics, Inc.（CIK 0001821392，Delaware），页面显示正好两份 Form D 注册。

              Jason Kim 于 2025 年 1 月出任 CFO，早于 C 轮和 D 轮完成，说明董事会在为资本密集的 Phase 2/Phase 3 扩张和潜在合作流程搭建财务基础设施。Kim 在 Molecular
              Templates 的经历——融资超过 $500M、推动上市、并与 Takeda、Vertex、Bristol Myers Squibb 合作——正好对应 Enveda 下一阶段所需的财务能力组合。

              公司未公开披露烧钱速度。按 2024 年末约 250 名员工、Boulder 60,000 平方英尺设施、Hyderabad 运营、特应性皮炎和哮喘 Phase 2a 试验正在入组、以及 16
              个临床前项目推进来估算，保守月度现金消耗落在 $7–15M/month，符合相近规模临床阶段 AI 生物技术公司的水平。如果公司在 D 轮完成时每月消耗 $8–12M，$150M D 轮资金可从 2025 年 9
              月起延长 12–18 个月现金续航期。Phase 2a 中期数据（预计 2026–2027）带来的临床价值拐点，是药企合作事件或下一轮融资的合理触发点。Enveda
              没有披露债务或信贷额度；但没有数据室权限，无法排除未披露可转债。
