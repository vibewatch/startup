chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >
              Enveda Biosciences（也以法律实体 Enveda Therapeutics, Inc. 运营）是一家临床阶段生物技术公司，总部设在科罗拉多州 Boulder 的 Flatiron Park
              商务园区，占地 60,000 平方英尺。公司另在印度海得拉巴设有亚洲总部。Enveda 于 2019 年创立，核心判断是：自然界绝大多数化学多样性（估计
              99%）仍未被探索，但历史上约一半口服药来自天然分子。公司试图用系统化工具大规模解码和搜索这片隐藏化学空间，比行业平均更快、更低成本地产出同类首创小分子药物。

              公司的主平台使用 AI 驱动的质谱（自 2021 年起把 Bruker timsTOF 设备与机器学习集成）、代谢组学，以及一个可搜索数据库，把 38,000 种植物与 12,000
              种人类疾病和症状相连，用于识别和表征此前未知的天然来源分子。Enveda 称其发现平台比制药行业平均速度快约 4×、成本低 10×，从创立到约 5 年内生成 17 个开发候选物。截至 2026 年 5
              月，管线覆盖 4 个适应症的 3 个临床项目、6 个 IND 支持资产和 17 个开发候选物。

              Enveda 是完全私有、风险投资支持的公司，未披露收入，沿用生物技术 R&D 模型：当前价值全部押在管线的临床推进上。商业模式以资产为中心：Enveda
              在内部生成并全资持有化合物，为未来对外许可、合作或商业化上市里程碑做准备。公司把核心资产 ENV-294 描述为具有“一药多管线”潜力，即一颗分子可能覆盖多个炎症适应症。
