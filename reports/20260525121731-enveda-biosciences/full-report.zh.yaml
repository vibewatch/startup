        - '美国 FDA（IND 监管试验，isFdaRegulatedDrug: true）'
        - 截至 2026 年 5 月正在招募；主要完成时间 2026 年 12 月；暂无期中结果
        - 中高——皮肤科新型非激酶机制 Phase 2 成功率通常为 40–60%
        - 关键——主要商业资产；失败会重置估值和现金跑道测算
