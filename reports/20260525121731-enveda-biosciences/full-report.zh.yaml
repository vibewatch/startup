      - number: '5.5'
        title: 技术依赖、质量控制与路线图
        blocks:
          - type: paragraph
            body: >
              Enveda 的技术栈有几项重要依赖，既是风险集中点，也是尽调问题。最关键的是硬件：自 2021 年以来，公司一直只依赖 Bruker timsTOF 仪器。Bruker 是唯一商业供应商，能在 Enveda
              所需通量下把高分辨率 MS/MS 与捕获离子淌度（TIMS）结合；替代平台（如 Waters SYNAPT 或基于 SLIM 的离子淌度）具备 CCS 能力，但谱图特征和通量不同。Bruker
              的供应链、仪器可得性或定价一旦受扰，Enveda 的数据采集能力会被实质约束。公司未公开披露第二硬件供应商关系。

              软件和 AI 侧，Enveda 于 2024 年 5 月宣布与 Microsoft 合作，开发用于阅读和翻译化学的「基础模型」。除公告外，合作范围、排他性和治理安排都未公开披露。Enveda 自有 ML
              模型（DreaMS、生物活性预测器、ADMET 模型）部分开源，降低了结构预测层的部分专有集中风险；但公司的内部训练数据集和整合主动学习管线仍为专有。

              临床质量和监管合规方面，ENV-294 已完成 3 个月 GLP 毒理研究（Phase 2a 启动公告中提及），并获得多项 FDA IND 放行。GMP
              临床供应生产由外部合同生产组织（CMOs）承担；公司未披露自有生产设施。这对临床阶段生物技术公司是标准做法，但会带来成本和排期依赖。Phase 2a（AD 和哮喘）以及 Phase
              1（ENV-308、ENV-6946）临床试验中心涉及学术医学中心和专门研究者中心；首席研究者 Leon Kircik（Mount Sinai）和 Jonathan Silverberg（George
              Washington University）已公开具名。

              截至 2026 年 5 月，近期路线图如下：AD 的 Phase 2b 剂量探索研究目标为 2026 年中；Phase 2a AD 和哮喘仍在进行（完整数据预计 2026–2027）；ENV-308 和
              ENV-6946 的 Phase 1 完成预计在 2026–2027；额外管线资产的开发候选物宣布仍在推进。公司于 2026 年 4 月任命 Christopher K. Porter
              为临床运营高级副总裁，显示正在为 Phase 2 执行搭建运营能力。Fast Company 将 Enveda 列入 2026 年生物技术最具创新力公司，为平台科学方法提供独立认可。
