  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >
              药物发现买方——为新机制付费许可的药企和生物技术公司——可以用多条路径完成同一任务：（1）来自合成化合物库的传统高通量筛选（HTS），（2）基于蛋白结构或基因组靶点数据的 AI
              辅助理性设计，（3）自营或通过合同方运行天然产物分离项目，（4）Enveda 这样的 AI 赋能代谢组学平台。Enveda 与每一类的竞争方式都不同。

              最大、最受关注的竞争组，是最能吸引投资人和媒体注意的通用 AI 药物发现 TechBio：Recursion Pharmaceuticals（NASDAQ: RXRX）、Schrödinger（NASDAQ:
              SDGR）、Insilico Medicine、Isomorphic Labs（Alphabet 子公司）、Generate Biomedicines、Relay Therapeutics、Absci 和
              insitro。这些公司的主要数据输入完全不同——细胞图像（表型组学）、分子物理模拟、基因组多组学、蛋白 3D
              结构、蛋白序列生成模型——而不是植物代谢物质谱。它们发现的主要是合成或蛋白类疗法，并不主张进入植物界尚未探索的化学多样性。

              更窄的天然产物专门竞争格局已经大幅收缩。Hexagon Bio 用真菌基因组学发现天然产物，2023 年被收购。Lodo Therapeutics 筛查土壤微生物组以寻找新型天然产物，被 Zymergen
              收购（Zymergen 自身于 2022 年被 Genentech 收购）。Cultivarium 和 Phylagen 是微生物天然产物公司，化学多样性焦点不同。Brightseed
              专注用于营养的植物生物活性物，而非药物开发。这轮格局收缩，使 Enveda 在以植物代谢组学结合 AI、且已推进到临床阶段的同级公司中，几乎没有资金充足的直接对手。

              大型药企构成结构性竞争威胁：AstraZeneca、Novartis、Roche/Genentech 和 Pfizer 都有天然产物项目历史，也有当前 AI 投资。它们的内部 AI
              项目可能转向天然产物输入。不过，其主要投入仍在合成化学、生物制剂和已建立靶点类别，而非 Enveda 系统搭建的未探索植物化学空间。Novartis 单独就维持 300 多个学术联盟和 100
              多个行业联盟，说明其越来越倾向许可新机制，而不是全部自建发现能力；这为 Enveda 创造了潜在合作机会，而不只是威胁。
