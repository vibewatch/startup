      - number: '1.6'
        title: 图表
        blocks:
          - type: callout
            title: ENV-294 1b 期结果：口服疗法的同类最佳信号
            body: >
              2026 年 3 月 ENV-294 的 1b 期数据显示，第 42 天平均 EASI 下降 85%（停药后仍继续改善）、100% EASI-50、78% EASI-75、56%
              EASI-90；未出现严重不良事件，也没有停药。GWU 和 Mount Sinai 的独立 KOL 认为，口服疗法能同时呈现快速、深度响应和类似生物制剂的安全性，“确实很有说服力”。若 2a
              期证实该特征，ENV-294 将相对可注射 dupilumab 和带黑框警告的 JAK 抑制剂形成有意义的进步。
            calloutType: strength
            claimRefs:
              - CO032
              - CO033
              - CO034
          - type: callout
            title: AI 药物发现 II 期损耗：投入 $60B 仍无获批药物
            body: >
              截至 2026 年中，全球没有任何 AI 设计药物获得 FDA 监管批准——尽管风投资本已投入超过 $60B，且 173 个 AI 发现项目进入临床试验。AI 设计药物的 II 期成功率与传统药物相当（约
              40%），抹平了 I 期看到的早期优势。BenevolentAI 治疗特应性皮炎的局部 pan-Trk 抑制剂在 IIa 期相对安慰剂没有显著疗效而失败，与 ENV-294 的适应症直接相似。Exscientia
              也经历了多个项目失败。ENV-294 1b 期（n=9，开放标签）无法在统计上预测 2 期结果；受控 2a 期读数才是首次真正疗效检验。
            calloutType: risk
