      - number: '5.4'
        title: 科学验证与学术发表
        blocks:
          - type: paragraph
            body: >
              Enveda 的科学可信度，主要由一系列同行评审论文、预印本和开源代码发布支撑；这些材料允许外部独立验证平台组件。

              最重要的发表是 2025 年 Nature Biotechnology 上的 DreaMS 论文。论文显示，在 GNPS/MassIVE 公共仓库中超过 >1 million 条未标注 MS/MS
              谱图上训练的自监督 transformer，可生成分子表征（「DreaMS embeddings」），并在谱图相似性预测、化学性质分类和氟检测任务上达到领先水平。DreaMS Atlas 是一个带 DreaMS
              embeddings 注释的 201 million 条谱图分子网络，已在 HuggingFace 公开。预训练模型权重存放于 Zenodo（record 10997887）。HuggingFace Spaces
              上的简易网页应用支持用 DreaMS embedding similarity 一键匹配谱图库。这篇论文是一线验证材料，说明支撑 Enveda 结构预测能力的核心 ML 方法具备独立科学价值。

              Domingo-Fernández 等人在 2024 年 Journal of Natural Products 发表论文（所有作者均受雇于
              Enveda），用实证方式证明天然产物在每个开发阶段的临床试验成功率都显著高于合成化合物；这一发现验证了天然产物优先平台的战略逻辑。配套代码和数据存放在 GitHub 仓库
              enveda/np-clinical-trials。

              Enveda 作者在 2025 年 bioRxiv 预印本（Engler Hart、Gadiya、Kind、Healey、Allen、Colluru、Domingo-Fernández 等）中，利用多种基于 MS
              的方法分析 >1,000 种植物数据，估算植物化学空间，并得出结论：植物总化学多样性可能包含数百万个独特结构，且绝大多数尚未探索。这篇预印本为 Enveda「自然界 99.9%
              的化学仍未知」的说法提供了定量基础。

              TIMS-Bench 项目（Rajkumar et al., 2026，GitHub: enveda/tims-bench）由 Enveda
              科学家牵头，是一个社区基准计划，目标是建立评估捕获离子淌度代谢组学软件工具的标准。配套数据集存放在 Zenodo。Analytical Chemistry 于 2026
              年纸刊发表一篇计算代谢组学综述，Enveda 科学家 Domingo-Fernández、Healey、Kind、Allen、Colluru、Misra 共同署名，梳理 2021–2025
              年该领域的工具和数据库。截至 2026 年 5 月，Enveda 的 GitHub 组织（github.com/enveda）托管了十多个公开仓库，覆盖正弦嵌入、谱图库加权、NMR
              网络、化学分类学和多组学分析，且仍处于活跃状态。
            claimRefs:
