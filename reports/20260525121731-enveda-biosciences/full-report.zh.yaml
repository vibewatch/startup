      - number: '8.2'
        title: 估值方法——rNPV 管线分析
        blocks:
          - type: paragraph
            body: >
              Enveda 仍处于商业化前且没有产品收入，收入倍数不适用。更合适的估值框架是风险调整净现值（rNPV）：按每个临床项目峰值年份、经成功概率加权的商业价值折现，并用反映相应适应症和 modality
              临床阶段成功率的风险因子调整。免疫 / 炎症适应症类别的标准行业成功率（BIO/Informa 2025）为：Phase 1 到 Phase 2 约 55–60%；Phase 2 到 Phase 3 约
              35–40%；Phase 3 到获批约 60–65%；新机制从 Phase 1 到获批全程约 12–15%。ENV-294 目前处于 Phase 1b（特应性皮炎）和 Phase 2a（AD
              与哮喘同时推进），是管线中最成熟、也最能创造价值的项目。若把约 25% 的 Phase 2a 到获批成功率套用于峰值年份美国销售假设 $3–6 billion（假设首创每日口服疗法在中重度 AD
              和哮喘、符合生物制剂条件患者的 $30B+ 可触达市场中拿到 5–10%），并以 12% 资本成本、10 年达峰时间折现，单 ENV-294 的概率加权 NPV 约为 $250–450
              million。再加上三个额外管线项目（IBD、肥胖，以及至少两个未披露的临床前资产），按更早临床阶段折现后的 rNPV 增量为 $100–250 million。平台可选性——从 Enveda「library
              of life」持续生成额外 first-in-class 药物的能力——贡献了投机性溢价，类似 Schrödinger 软件授权业务或 Recursion phenomics dataset
              所获得的「platform multiple」。合计看，基准情景管线 rNPV 为 $800 million 到 $1.2 billion，大体支撑约 $1B 的独角兽估值。悲观情景 rNPV（假设 Phase
              2a 失败或仅交付温和效果量）收缩至 $150–350 million，意味着相对当前 $1B+ 价格存在实质下行。乐观情景 rNPV（AD Phase 2b 成功、哮喘 Phase 2a 数据积极、IBD
              项目推进到 Phase 2）超过 $2 billion，说明在不计平台授权交易可选性的情况下，当前进入价格仍可能带来 2–3× 回报。
            claimRefs:
              - CV008
              - CV009
