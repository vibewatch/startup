  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构——PRISM 技术栈
        blocks:
          - type: paragraph
            body: >
              Enveda 的核心发现平台在内部和公开叙事中都称为 PRISM，是一套纵向整合的技术栈，覆盖实体植物库、高通量质谱、用于结构和活性预测的机器学习模型，以及把植物化学与人类疾病连接起来的可计算知识图谱。

              底层是一套经过筛选的实体库，来自生物多样性热点地区采集的数千种植物。Enveda 建立了一个包含 38,000 种植物、并与 12,000
              种人类疾病和症状交叉引用的数据库，用来指导采集哪些物种、优先分析哪些物种。生物材料通过溶剂萃取处理，得到的复杂混合物先经液相色谱（LC）分离，再进入测量。关键在于，Enveda
              初始分析前不纯化单个化合物；平台按级分运行，避开了过去制约天然产物药物发现的瓶颈。

              测量层使用 Bruker timsTOF Pro 2 质谱仪，这类仪器独特地把高分辨率串联 MS/MS 碎片与捕获离子淌度质谱（TIMS）结合起来。TIMS
              维度为每个离子提供一个碰撞截面积（CCS）值，用一个数字编码分子的三维形状。Bruker 的客户案例研究引用 Enveda 高级科学家 Pelle Simpson 的话：「timsTOF 平台……在
              [采集速度和谱图质量] 两方面表现都很好，并以碰撞截面积（CCS）的形式提供分子形状的单点编码；即使分离条件变化，也能用它在不同采集之间连接分子。」质量、电荷、碎片和形状构成第四个数据维度，这是 Enveda
              的核心硬件差异化，也让其 ML 模型在结构推断上比传统仅依赖 MS 的方法具备更高特异性。

              AI/ML 层以 DreaMS（Deep Representations Empowering the Annotation of Mass Spectra）为锚点。DreaMS 是一个 transformer
              神经网络，在从 GNPS/MassIVE 仓库挖掘出的 GeMS 数据集上，以数百万未标注 MS/MS 谱图进行自监督预训练。DreaMS 从原始谱图生成 1024
              维分子嵌入；微调版本在谱图相似性、化学性质预测和结构注释任务上达到领先水平。DreaMS Atlas 收录 201 million 条带有 DreaMS 表征注释的 MS/MS 谱图，已公开访问。DreaMS
              之外，Enveda 还用统计解卷积模型把复杂级分中的谱图连接到单个分子结构，再接入生物活性预测和 ADMET（吸收、分布、代谢、排泄、毒性）过滤模型，共同为候选物评分排序。2026 年发布的 Guild
              开源工具负责编排蛋白-配体对接管线（Vina、DiffDock、Boltz、KarmaDock），用于确认靶点结合。
