  - id: FV001
    title: 推荐逻辑流——通向观察立场的证据链
    type: flow
    layout: wide
    summary: |
      从四个证据支柱（临床证据、机制新颖性、资本效率、投资方信心）和四个风险因素（板块失败、Phase 1b 样本量、缺少财务数据、Phase 2a 不确定性）出发，推导出观察 / 跟踪建议，并设置有条件买入触发点。
    data:
      nodes:
        - id: clinical-proof
          label: |-
            Phase 1b 临床证据
            （EASI 降低 85%，n=9，无 SAE）
          detail: ENV-294 在 AD 的 Phase 1b：100% EASI-50，78% EASI-75，56% EASI-90；无停药
          tone: positive
          claimRefs:
            - CV015
        - id: mechanism
          label: |-
            新颖 LOCKTAC 机制
            （非激酶、非细胞因子、无黑框警告）
          detail: 同类首创分子胶重置细胞免疫反应；与 JAK 抑制剂和生物制剂不同
          tone: positive
          claimRefs:
            - CV016
        - id: syndicate
          label: |-
            强投资方组合
            （Premji、Kinnevik、Sanofi、Baillie Gifford）
          detail: 累计融资 $517M；Series C 由 Sanofi 领投；Series D 超额认购；2025 年 9 月进入独角兽状态
          tone: positive
          claimRefs:
            - CV001
            - CV002
        - id: sector-risk
          label: |-
            AI 药物发现板块风险
            （RXRX -68%，BenevolentAI 跌幅 >90%）
          detail: STAT News 2024 年 12 月：Recursion 首个药物无疗效；Insilico Phase 2a 未达主要终点；Exscientia 以峰值的一小部分价格被收购
          tone: negative
          claimRefs:
            - CV018
            - CV019
        - id: phase1b-size
          label: |-
            Phase 1b 样本量风险
            （9 名开放标签患者）
          detail: 不足以确认 Phase 2a 能否复现；无主动对照；缺少随机化证据
          tone: negative
          claimRefs:
            - CV020
        - id: financial-opacity
          label: |-
            财务不透明
            （无审计财务、无烧钱速度）
          detail: Series D 投后估值未披露；无现金余额；Sanofi 交易条款未知
          tone: negative
          claimRefs:
            - CV039
        - id: phase2a-trigger
          label: |-
            Phase 2a 数据（预计 2026）
            （有条件买入触发点）
          detail: Phase 2a AD（随机、安慰剂对照）和哮喘结果预计 2026 年底出炉
          tone: neutral
          claimRefs:
            - CV036
        - id: recommendation
          label: |-
            观察 / 跟踪
            （Phase 2b 后有条件买入）
          detail: 当前 rNPV 基准 $800M–$1.2B 支撑约 $1B+ 独角兽价格；若没有 Phase 2b 数据，证据不足以支持买入
          tone: neutral
          claimRefs:
            - CV035
      edges:
        - from: clinical-proof
          to: recommendation
          label: 部分支持
        - from: mechanism
          to: recommendation
          label: 支持
        - from: syndicate
          to: recommendation
          label: 锚定
        - from: sector-risk
          to: recommendation
          label: 约束
        - from: phase1b-size
          to: recommendation
          label: 限制信心
        - from: financial-opacity
          to: recommendation
          label: 推高风险溢价
        - from: phase2a-trigger
          to: recommendation
          label: 升级条件
    claimRefs:
      - CV015
      - CV016
      - CV018
      - CV035
  - id: FV002
    title: ENV-294 Phase 2a/2b 结果对估值的敏感性
    type: bar
    layout: standard
    summary: |
      Enveda 隐含企业价值对四种 Phase 2a/2b 结果情景的敏感性，展示临床阶段生物技术估值的二元属性，以及 Phase 2 失败相较上行更不成比例的下行。
    data:
      items:
        - label: |-
            Phase 2b 成功
            （AD + 哮喘）
          value: 3000
          unit: $M implied EV
          detail: 完整 AD+哮喘 rNPV + IBD 期权 + 平台授权；较当前独角兽入场价约 3×
          claimRefs:
            - CV012
        - label: |-
            Phase 2b 成功
            （仅 AD）
          value: 1500
          unit: $M implied EV
          detail: AD rNPV + IBD 期权 + 残余哮喘；较当前独角兽入场价约 1.5×
          claimRefs:
            - CV013
        - label: |-
            Phase 2a 结果不明确
            （延迟）
          value: 850
          unit: $M implied EV
          detail: 在更多数据前维持基准 rNPV；较当前入场价约 0.85×；无实质减值
          claimRefs:
            - CV021
        - label: |-
            Phase 2a 失败
            （AD 主要终点）
          value: 250
          unit: $M implied EV
          detail: 仅剩余管线 + 清算优先权；较当前独角兽入场价损失约 75%
          claimRefs:
            - CV014
        - label: |-
            当前独角兽
            入场价（~$1B+）
          value: 1000
          unit: $M implied EV
          detail: 参考：Enveda 2025 年 9 月获得独角兽称号；确切投后估值未披露
          claimRefs:
            - CV005
    claimRefs:
      - CV012
      - CV013
      - CV014
      - CV021
  - id: FV003
    title: 各情景估值 / 回报区间
    type: range
    layout: standard
    summary: |
      Enveda Biosciences 在悲观、基准和乐观情景下的低、基准和高企业价值区间，展示以独角兽价格投资临床阶段 AI 药物发现公司的非对称风险回报。
    data:
      items:
        - label: 悲观情景（Phase 2a 失败）
          low: 150
          mid: 250
          high: 350
          unit: $M EV
          lowSource: Liquidation preference + residual pipeline; total clinical failure
          highSource: Partial residual value if secondary programs survive
          confidence: low
          claimRefs:
            - CV014
        - label: 基准情景（Phase 2b AD 成功）
          low: 800
          mid: 1050
          high: 1300
          unit: $M EV
          lowSource: AD rNPV at lower bound ($250M) + IBD + pre-clinical platform
          highSource: AD rNPV at upper bound ($450M) + IBD + platform licensing option
          confidence: medium
          claimRefs:
            - CV013
        - label: 乐观情景（AD + 哮喘 + IBD）
          low: 2000
          mid: 2750
          high: 4000
          unit: $M EV
          lowSource: AD full rNPV + asthma moderate success + IBD Phase 2
          highSource: AD+asthma full rNPV + IBD + platform licensing deal signed
          confidence: low
          claimRefs:
            - CV012
        - label: |-
            相对约 $1B 独角兽
            入场价的回报倍数
          low: 0.15
          mid: 1.05
          high: 4
          unit: × return
          lowSource: 'Bear case: $150M / $1B entry = 0.15×'
          highSource: 'Bull case: $4B / $1B entry = 4.0×'
          confidence: low
          claimRefs:
            - CV021
    claimRefs:
      - CV012
      - CV013
      - CV014
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: |
      可供投委会使用的 Enveda 评分，覆盖市场、临床证据、平台护城河、资本效率、板块风险和估值支撑等维度，采用 1–5 分尺度（5 = 可能的最强分）。
    data:
      items:
        - label: 市场机会
          value: 5 / 5
          detail: $30B+ 口服 AD/哮喘可触达市场；同类首创口服疗法；仅美国就有 100M+ 合格患者
          claimRefs:
            - CV040
        - label: 临床证据（Phase 1b）
          value: 4 / 5
          detail: Phase 1b 信号极强（EASI 降低 85%，n=9）；因开放标签小样本且无主动对照扣 1 分
          claimRefs:
            - CV015
        - label: 平台护城河
          value: 4 / 5
          detail: 生命体天然产物化学库与合成 AI 同业有差异化；因平台授权缺少收入证据扣 1 分
          claimRefs:
            - CV017
        - label: 资本效率
          value: 3 / 5
          detail: 为约 $1B 估值累计融资 $517M（1.9× 比率）；合理，但反映临床前和 Phase 1/2 高烧钱，且现金回流有限
          claimRefs:
            - CV003
        - label: 板块风险
          value: 2 / 5
          detail: AI 药物发现板块连续出现临床失败；Recursion、Insilico、BenevolentAI 均表现不佳；板块倍数仍在压缩
          claimRefs:
            - CV018
            - CV019
        - label: 估值支撑
          value: 3 / 5
          detail: rNPV 基准情景 $800M–$1.2B 大体支撑 $1B+ 独角兽价格；无收入锚定倍数；确切投后估值未披露
          claimRefs:
            - CV021
        - label: 尽调完整性
          value: 2 / 5
          detail: 无审计财务、无确切 Series D 估值、无 Sanofi 交易条款、未提交 Phase 2b SAP；大量未披露证据限制信心
          claimRefs:
            - CV039
    claimRefs:
      - CV015
      - CV018
      - CV021
      - CV040
