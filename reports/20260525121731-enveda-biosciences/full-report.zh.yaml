      - number: '6.4'
        title: 患者终端用户细分与市场规模测算
        blocks:
          - type: paragraph
            body: >
              Enveda 的四个领先临床适应症覆盖医学中部分最大的未满足需求；仅美国患者合计就超过 140 million，四个适应症现有治疗都明显不足。

              特应性皮炎（湿疹）：美国特应性皮炎患者估计约 16 million，其中约 10–25% 属于中重度。市场已有生物制剂（Dupixent 在 2024 为 Sanofi/Regeneron 贡献约 $14B
              全球年销售额）和新兴 JAK 抑制剂。ENV-294 的临床特征被描述为具备「类似 Dupi 的疗效和安全性画像」和「泛内型潜力」，直接瞄准现有口服疗法应答不足的人群。特应性皮炎 Phase 2a
              目前正在招募（60 名患者，主要完成时间 December 2026）。[CU020, CU021]

              哮喘：28 million 美国人患有哮喘（AAFA，2026 data），其中约 23 million 为成年人，约占美国人口 8%。哮喘是 ENV-294 的第二个适应症；Phase 2a 试验（50
              名患者）正在招募，显示 ENV-294 在特应性皮炎之外可能具备「一个产品承载一条管线」的价值。同一分子覆盖两个适应症；如果两个 Phase 2 都成功，开发成本和时间线都会被压缩。[CU022, CU023]

              炎症性肠病（IBD）：ENV-6946 瞄准 TL1A+ 通路，定位为新型「一粒药里的多重生物制剂」机制，目前处于 IBD Phase 1。美国 IBD 人群（克罗恩病加溃疡性结肠炎）估计为 3
              million，其中克罗恩病的治疗不足尤其明显。ENV-6946 已获美国 FDA IND 批准，并于 December 2025 启动 Phase 1。[CU024]

              肥胖 / 慢性体重维持：ENV-308 是首创口服小分子，用于慢性体重维持；已获 IND 批准，并在 December 2025 完成首例患者给药。美国成年人肥胖患病率约为 42%，超过 100 million
              美国成年人符合肥胖标准（BMI ≥30）。GLP-1 受体激动剂类别（Zepbound、Wegovy）已经验证了巨大的商业潜力；ENV-308 的机制（激素模拟物）若要有效竞争，必须证明差异化。[CU025,
              CU026]

              全球健康（Gates Foundation）：结核病和疟疾合计影响全球数亿人。该方向商业属性不强，但从科学上验证 Enveda
              平台能从免疫与炎症（I&I）延伸到抗感染药物。抗感染天然产物历史上曾孕育最成功的药物类别之一（penicillin、artemisinin）。[CU027]
