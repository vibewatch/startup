    title: 缓释措施与终止标准表
    columns:
      - 风险
      - 缓释动作
      - 监测指标
      - 终止标准阈值
      - 投资含义
    rows:
      - - 2a 期 ENV-294 AD 试验失败（NCT07298395）
        - 维持 AD + 哮喘 + IBD 的管线多元化；读数前启动合作讨论；如可获得，监测 DSMB 中期摘要
        - EASI 评分轨迹（来自 Enveda 投资人更新）；入组完成情况；任何揭盲事件或临床搁置
        - EASI 相对安慰剂改善 <30%，或主要终点（第 12 周）p-value >0.1；或安全相关停药率 >15%
        - 停止 AD 项目；重新评估哮喘单独估值；预期估值显著重置
      - - AD 和哮喘两项 2a 期同时失败（NCT07298395 + NCT07301255）
        - 确保 ENV-308（体重维持）和 ENV-6946（IBD）试验提供独立数据点；“pipeline-in-a-product” 可部分缓释单一适应症失败
        - 两项试验的主要终点结果；数据可得时点与现金跑道的匹配
        - AD 和哮喘两项试验均未达到主要终点，且无差异化安全信号
        - 投资逻辑打穿：重组管线、寻求收购或合作，down-round 融资概率很高
      - - 发现 Nagoya Protocol 合规缺口
        - 为所有植物种质维护 ABS Clearing-House 来源记录；IND 提交前与来源社区签署 PIC/MAT
        - ABS Clearing-House 登记更新；原产国合规证书；利益分享付款已记录
        - IND 搁置或上市许可申请被拒，理由是任何商业化化合物缺失 ABS 合规
        - 潜在 NDA 延迟；受影响项目下一次资本投入前，要求立即完成法律补救
      - - Series E 融资估值下调（较 Series D 低 >20%）
        - 主动推进合作伙伴触达；非稀释性 grant funding（NIH SBIR/STTR）；可能向战略合作伙伴出售项目权益
        - Term sheet 估值与 Series D 标记（$1B+）对比；投资人质量（新投资人 vs. 内部领投）
        - Series E 以低于 $800M 估值完成；或 Series E 从首次接触到关闭超过 90 天
        - 投资人信心丧失；考虑加速合作 / 授权谈判，以非稀释方式延长现金跑道
      - - ENV-294 2 期 IND 临床搁置
        - 扎实的安全监测；哮喘试验设 DSMB；加速 FDA 沟通流程；预先制定响应策略
        - FDA 关于 IND 状态的沟通；任何 FDA 信函（special protocol assessment、clinical hold communications）
        - FDA 对 ENV-294 IND 在 AD 或哮喘任一适应症上实施部分或全部临床搁置
        - 入组暂时停止；取决于安全信号性质；若为全面搁置，投资逻辑在解决前受到实质损害
    notes: |
      终止标准按预期概率 × 影响排序。鉴于 2026 年 12 月主要完成日期，AD 读数失败行是最高优先级监测项。Series E 融资指标需要从 2026 年 Q3 后期开始跟踪。
