      - number: '6.2'
        title: 具名合作伙伴分层与关系证据
        blocks:
          - type: paragraph
            body: >
              Enveda 当前合作伙伴基础包括四个具名外部组织，各自承担不同战略功能，也代表不同质量的客户证明证据。

              Bruker Daltonics 是 Enveda 记录最完整的 B2B 合作伙伴。双方关系始于 2021 年，当时 Enveda 在代谢组学平台中采用 timsTOF Pro 2 质谱仪。Bruker
              在官网发布正式客户洞察案例研究，引用 Pelle Simpson（Enveda 高级科学家）原话：「行业的挑战不再是 MS/MS 谱图获取本身，而是获取速度和谱图质量。正是在这里，timsTOF
              平台同竞争对手拉开了差距。」August Allen（Enveda CTO）补充说：「我们会继续构建最大的、专为机器学习打造的代谢组学数据集，并应用主动学习策略。」这份由 Bruker
              发布的案例研究，是本章核心客户证明来源：一份双方认可的出版物，其中 Enveda 高级科学领导层明确背书仪器伙伴产品。[CU005, CU006]

              Microsoft 是 2024 年 5 月宣布的技术合作伙伴。Enveda 与 Microsoft 合作开发 PRISM 基础模型，并将其描述为用于「读取和翻译」天然样本化学的模型。合作为 Enveda
              提供云端 AI 基础设施，也为其机器学习主张的科学基础背书。双方未披露财务条款。[CU007]

              Sanofi 于 2025 年 2 月作为 C 轮一部分对 Enveda 进行战略投资，使 C 轮总融资达到 $150M。这代表来自全球最大专科 I&I 公司之一的药企行业验证。重要的是，Sanofi
              也有自己的特应性皮炎管线（根据 Sanofi 截至 2026 年 3 月的新闻稿，amlitelimab 处于 Phase
              3），因此双方关系同时包含战略投资和治疗领域竞争。除股权投资外，公司未披露任何授权或共同开发协议条款。[CU008, CU009]

              Bill & Melinda Gates Foundation 合作披露在 Enveda 的宗旨页面，内容是把 Enveda
              的天然产物发现平台用于包括结核病、疟疾及其他全球健康优先事项在内的传染病适应症。Gates Foundation
              承诺资助数据库中没有公开记录资助金额或里程碑；这可能说明该关系是直接慈善合同或项目相关投资，而非传统资助（该数据库据自身披露不包含这些形式）。该合作显著扩大了 Enveda 在 I&I
              之外、面向全球传染病的总可触达患者基础。[CU010, CU011]
