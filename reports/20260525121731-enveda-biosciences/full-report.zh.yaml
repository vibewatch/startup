  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: wide
    summary: |
      Enveda 四个适应症管线的 TAM/SAM/SOM 金字塔，从全球炎症和代谢疾病药物总支出，一直收窄到中重度 AD 中 ENV-294 上市后的估计 SOM。
    data:
      items:
        - label: TAM — 全球炎症 + 代谢疾病药物市场（~$200B+）
          detail: |
            包括全球免疫炎症（AD、哮喘、IBD、自身免疫）和代谢（肥胖、糖尿病、NASH）适应症的所有处方药；横跨数百个品牌药和仿制药，高度分散。该口径不是单一可触达机会，而是用来框定板块规模。
          tone: neutral
        - label: SAM — AD、哮喘、IBD、肥胖中的先进口服小分子与生物药（2030 年约 $50B）
          detail: >
            Enveda 的四个具体治疗领域：AD 治疗药物（2030 年约 $20B，Grand View/MDF）、哮喘生物药（约 $10B）、IBD 先进疗法（约 $12B）和肥胖药物（快速扩张的 GLP-1
            市场）。SAM 反映合并后的先进疗法细分市场，不含仿制药和 OTC。多份分析师估计之间存在方法重叠（部分会重复计算特应性疾病），因此合计数只是指示性，不可直接相加。
          tone: neutral
        - label: SOM — ENV-294 中重度 AD / 哮喘上市（峰值潜力 ~$1–4B）
          detail: >
            作者估计：如果 ENV-294 以与口服 JAK 抑制剂相当的标价（$25,000–$35,000/年），在 US + EU5 中拿下符合生物药条件的中重度 AD 患者群体 5–15%，峰值收入潜力可达
            $1–4B。该估计仍处 Phase 3 前，未按 Phase 3 成功、获批或竞争时点的概率折现。
          tone: neutral
    approximationNotes: >
      TAM 和 SAM 数字聚合自多份分析师报告（Market Data Forecast、Grand View Research），其中很多需付费；只能获取摘要标题。SOM 是作者基于 dupilumab
      渗透率类比的估计，并非独立发表的预测。
    claimRefs:
      - CM012
      - CM017
      - CM011
