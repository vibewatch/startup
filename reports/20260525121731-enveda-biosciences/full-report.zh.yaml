      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 由生物制剂主导的市场中，口服路径优势打开结构性窗口
            body: >
              中重度 AD 和哮喘由注射生物制剂（dupilumab、mepolizumab、benralizumab）主导，这些药物需要门诊给药或患者自我注射培训，年标价为
              $15,000–$35,000。皮肤科和风湿病领域已有充分证据表明，只要疗效相当，患者和开方者偏好每日一次口服给药；JAK
              抑制剂（upadacitinib、abrocitinib）正是凭借口服剂型，在黑框安全提示存在的情况下仍拿下了有意义的 AD 市场份额。ENV-294 1b 期结果——100% EASI-50、78%
              EASI-75——来自一种没有已知激酶责任的机制，却呈现“类似 JAK 抑制剂的疗效特征”，可能形成差异化定位。若 2b 期在更大规模验证这一特征，ENV-294
              的口服非激酶机制可能在可注射生物制剂之上获得溢价准入地位，并避开限制 JAK 抑制剂采用的安全性开方犹豫。
            calloutType: strength
            claimRefs:
              - CM007
              - CM031
              - CM032
              - CM005
          - type: callout
            title: 高竞争门槛和支付方准入障碍可能拖慢或压缩商业机会
            body: >
              Dupilumab 已在中重度 AD 设下极高疗效门槛：单药 16 周 EASI-75 率达
              36–38%，与外用糖皮质激素联用更高；它还扩展至哮喘、鼻息肉和嗜酸性食管炎，形成支付方已经理解的多适应症特许经营。ENV-294 作为新进入者，会面对处方集阶梯治疗要求：授权前先证明 dupilumab
              失败，因此初始患者准入机会会被压缩到生物制剂难治细分。与此同时，AI 药物发现类别已经经历高调临床失败（Insilico Medicine 2a 期、Recursion 2 期），抬高了投资人和支付方对 AI
              来源候选物机制新颖性主张的审视。Enveda 必须产出 2b 期数据，在安全性、口服路径和 / 或双适应症覆盖上清晰区分 ENV-294，才能在竞争性同类首创窗口关闭前跨过准入和认知障碍。
            calloutType: risk
            claimRefs:
