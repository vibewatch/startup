  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场范围与边界
        blocks:
          - type: paragraph
            body: >
              Enveda 的商业机会横跨四个机制相邻但彼此独立的治疗领域：特应性皮炎（AD）、特应性哮喘、炎症性肠病（IBD）和肥胖。每个领域都是大型慢性病市场，持续吸引药企投入。特应性皮炎估计影响 31M
              美国人，严重程度跨度很大；中重度患者驱动了生物制剂和先进小分子的大部分药物支出。全球看，AD 是重要公共卫生负担，东亚成人患病率显著偏高——日本和韩国报告的比例超过 10%——中国约有 40M
              患者。哮喘绝对规模更大：按 2023 Global Burden of Disease study，全球有 262M 人受影响；该病无法治愈，需要终身使用吸入药物和生物制剂管理。IBD 包括 Crohn's
              disease 和 ulcerative colitis，估计全球影响 6–8M 人，亚洲、非洲和南美发病率正在上升。肥胖如今影响全球超过 1B 人，GLP-1 受体激动剂确立了新护理标准，WHO 于 2025
              年 12 月发布更新的临床实践指南。Enveda 对 ENV-294 的一药多管线策略，试图用单一临床项目覆盖 AD 和哮喘；ENV-308（肥胖）和
              ENV-6946（IBD）则扩展组合宽度。四个适应症共享免疫炎症或代谢生物学，可支撑共同的发现平台经济性，但监管、商业化和支付方策略各不相同。本文市场边界不包括更广的皮肤科药物市场（痤疮、银屑病）、与 AD
              无重叠的纯呼吸生物制剂，以及与炎症机制无关的一般代谢管线项目。
