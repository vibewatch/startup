company:
  name: Matchroom
chapter:
  number: 6
  title: Customers
  summary: Matchroom sells live sports promotion and programming to a two-sided ecosystem of broadcasters, sponsors, venues, athletes, and fans. Public evidence shows durable broadcaster relationships and a broad event portfolio, but does not disclose customer-level revenue, retention, or concentration metrics.
sections:
  - id: customer-ecosystem
    title: Customer ecosystem and segmentation
    body: Matchroom's paying and strategic customer base is best understood as a multi-sided sports-content market rather than a conventional software account list. Broadcasters buy rights and programming; sponsors buy audience and association; athletes and governing bodies supply or license event participation; venues and local promoters provide distribution and live-event capacity; fans consume tickets, broadcasts, and digital content. Matchroom's own materials describe ownership, production, and promotion of events, and say it supplies programming to virtually every major sports broadcaster. The 2024 Pitch partnership announcement also identifies international media rights, global events, and sponsorships as the commercial surfaces. This supports a diversified customer architecture in principle, but the public record does not allocate revenue, margin, or account counts by segment.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and commercial proof
    body: Adoption evidence is strongest where a named counterparty has renewed or expanded a relationship, and weaker where Matchroom presents an audience, event, or programming total without a denominator for paying accounts. Matchroom reports 650 event days and 2,500 hours of original programming on its current home page, while its 2024 partnership release reports more than 600 event days and more than 2,400 programming hours. SportsPro reports a five-year DAZN extension for Matchroom Boxing in the United States and United Kingdom, plans for more than 30 shows per year, and expanded PDC rights in Germany, Austria, and Switzerland through 2031. These are meaningful distribution and repeat-use signals, but they do not establish net retention, renewal rates, average contract value, or cash collections.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-risks
    title: Named proof, durability, and concentration
    body: >-
      Named counterparties provide credible proof that Matchroom's events reach production or broadcast distribution, but the evidence is uneven on end-user outcomes. DAZN is an identified broadcast partner with a renewed five-year boxing arrangement and a long-running PDC relationship; Pitch International is an identified strategic investor and rights partner; Sky Sports is identified as a historical live broadcaster for Matchroom boxing. Matchroom's official pages also name fighters and tournament participants, but a roster or logo is not proof of active commercial retention. Adverse evidence shows that individual talent relationships can end: Sky Sports reported that Matchroom did not renew Josh Warrington's contract after the parties did not share the same plans. Public materials do not disclose top-customer concentration, contract length beyond selected rights deals, churn, or the economics of replacing a broadcaster or athlete.
    claimRefs: [CU010, CU011, CU016, CU013, CU014, CU015]
    tableRefs: [TU003]
callouts:
  - calloutType: strength
    title: Repeat-distribution proof
    body: The five-year DAZN extension and expanded PDC rights are stronger adoption evidence than undifferentiated audience or logo claims because they identify counterparties, territories, and contract duration.
    claimRefs: [CU006, CU007]
  - calloutType: risk
    title: Customer metrics remain opaque
    body: No assigned source discloses customer count, revenue concentration, renewal or churn rates, cohort behavior, or contract economics; those remain material diligence gaps rather than zero values.
    claimRefs: [CU009, CU015]
  - calloutType: recommendation
    title: Request account-level evidence
    body: Underwrite broadcaster and sponsor durability using a customer-by-customer schedule of contract terms, renewal status, revenue share, territory, and replacement pipeline.
    claimRefs: [CU009, CU015]
