    title: Customer journey from event creation to expansion
    type: journey-map
    summary: Matchroom's public evidence traces a path from sports properties and talent through live events and programming to broadcasters, sponsors, and fans, with expansion through rights and territories.
    data:
      nodes:
        - id: properties
          label: "Sports properties and talent"
          description: "Athletes, leagues, governing bodies, and acquired or promoted event properties"
          touchpoints: ["Talent and rights relationships", "Tournament participation"]
        - id: events
          label: "Live event production"
          description: "Promoted fight nights, tournaments, and other sporting events"
          touchpoints: ["650 reported event days", "Venue and production operations"]
        - id: programming
          label: "Original programming"
          description: "Packaged live and original sports content"
          touchpoints: ["2,500 reported annual hours", "Global broadcast distribution"]
        - id: distributors
          label: "Broadcasters and streamers"
          description: "Rights buyers distribute events across territories"
          touchpoints: ["DAZN boxing and PDC extensions", "Historical Sky Sports relationship"]
        - id: commercial
          label: "Sponsors and partners"
          description: "Commercial partners buy association and rights-related exposure"
          touchpoints: ["Pitch media-rights and sponsorship collaboration", "Sponsor exposure"]
        - id: fans
          label: "Fans and audiences"
          description: "Viewers and attendees consume the resulting events and programming"
          touchpoints: ["Broadcast access", "Ticketed and live-event demand"]
    approximationNotes: "This is an evidence-mapped operating journey, not a measured conversion funnel; no stage conversion or audience-retention rates are disclosed."
    claimRefs: [CU001, CU005, CU006, CU008]
