        - "DAZN: US and UK rights partner"
        - "Five-year extension; more than 30 shows per year planned"
        - "Payment, audience, platform, or strategic retrenchment"
        - High
        - "Verify guarantees, termination rights, payment security, alternatives, and revenue share"
      - - Darts distribution
        - "DAZN: PDC rights in Germany, Austria, and Switzerland"
        - "Exclusive major-tournament rights reported through 2031"
        - "Regional reach or economics weaken under one platform"
        - Medium-high
        - "Review minimum guarantees, exclusivity, renewal, and alternate distribution rights"
      - - Capital and media-rights strategy
        - "Pitch International: minority investor and strategic partner"
        - "Hearn family retained majority control in the 2024 announcement"
        - "Partner objectives diverge or reserved matters constrain execution"
        - Medium
        - "Inspect shareholder agreement, vetoes, liquidity rights, conflicts, and succession provisions"
      - - Headline talent and leadership
        - "Anthony Joshua / Eddie Hearn; fighter contracts and promotion leadership"
        - "Joshua was reported as the biggest draw in 2024; Hearn remains highly visible"
        - "Retirement, departure, incapacity, dispute, or weak successor slate"
        - High
        - "Quantify contribution, contract duration, succession bench, key-person insurance, and replacement pipeline"
    notes: >-
      Concentration percentages, contract economics, payment security, and succession
      coverage are not public in the assigned evidence and must be obtained directly.
    claimRefs: [CR001, CR003, CR004, CR005, CR011, CR017, CR014, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap - evidence-priority triage
    type: matrix
    summary: >-
      Qualitative prioritization of the most decision-relevant risks; labels are not
      probabilities and unknown mitigation evidence is shown explicitly.
    data:
      columns:
        - label: Impact
          detail: "Investment impact if the failure mode occurs"
        - label: Likelihood
          detail: "Qualitative likelihood from retained public evidence"
        - label: Mitigation evidence
          detail: "Maturity visible in the assigned public source pool"
      rows:
        - label: DAZN boxing concentration
          values:
            - label: High
              note: "More than 30 annual US/UK shows planned"
            - label: Medium
              note: "Long-term commitment reduces near-term renewal risk but increases counterparty dependence"
            - label: Limited
              note: "Contract guarantees and remedies are private"
        - label: Headline-talent concentration
          values:
            - label: High
              note: "Joshua was reported as the biggest draw in 2024"
            - label: Medium-high
              note: "Late-2026 boxing coverage remains franchise-centered"
            - label: Limited
              note: "Contribution and replacement pipeline are not quantified"
        - label: Key-person leadership
          values:
            - label: High
              note: "Chairmanship and promotion identity are strongly associated with Eddie Hearn"
            - label: Medium
              note: "No disclosed succession event; exposure is structural"
            - label: Limited
              note: "Succession and insurance evidence are absent"
        - label: Multi-jurisdiction execution
          values:
            - label: High
              note: "Failure can cancel events and damage rights relationships"
            - label: Medium
              note: "Current boxing calendar spans five listed countries"
            - label: Partial
              note: "Operating history is visible but control KPIs are not"
        - label: Licensing and public disputes
          values:
            - label: Medium-high
              note: "Permits and reputation can affect event delivery"
            - label: Medium
              note: "A licensing application and a retracted allegation are observable signals"
            - label: Limited
              note: "No consolidated legal register was retained"
        - label: Cybersecurity and data
          values:
            - label: High
              note: "Digital rights, ticketing, and customer data can create material exposure"
            - label: Unknown
              note: "No current incident-rate evidence"
            - label: Unknown
              note: "No control, audit, or insurance record in the assigned pool"
    approximationNotes: >-
      Qualitative analyst assessment as of 2026-10-24; cells preserve uncertainty and
      do not imply measured probabilities, loss values, or independently verified controls.
    claimRefs: [CR001, CR003, CR004, CR006, CR009, CR015, CR016]
callouts:
  - calloutType: recommendation
    title: Diligence-gated investment posture
    body: >-
      Do not credit portfolio breadth as economic diversification until revenue,
      contribution margin, and counterparty concentration are reconciled by sport.
      Pause if DAZN payment protection, headline-talent replacement, leadership
      succession, event-compliance controls, or current incident data cannot be
      demonstrated with primary records.
    claimRefs: [CR001, CR003, CR004, CR006, CR009, CR016]
