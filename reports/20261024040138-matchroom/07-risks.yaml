  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: legal-regulatory-register
      missingEvidence: >-
        Complete litigation, regulator inquiry, promoter-license, sanctions, privacy,
        employment, tax, and fighter-safety matter list by operating jurisdiction.
      whyItMatters: >-
        A partial public register cannot establish the probability or financial impact
        of injunctions, license loss, event cancellation, fines, or contingent liabilities.
      diligencePath: >-
        Obtain counsel-prepared litigation and compliance schedules, regulator
        correspondence, license copies, sanctions procedures, and board compliance reports.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: safety-security-continuity
      missingEvidence: >-
        Current safety KPIs, medical incidents, cyber controls, privacy map, outages,
        business-continuity tests, event cancellations, and insurance limits.
      whyItMatters: >-
        These records determine whether high-impact operating and data risks are controlled
        or merely absent from public reporting.
      diligencePath: >-
        Review 2025-2026 incident logs, independent security and safety audits, insurance
        policies, penetration tests, continuity exercises, and post-event reviews.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: concentration-economics
      missingEvidence: >-
        Revenue, contribution margin, cash collection, minimum guarantees, termination
        rights, and payment security by broadcaster, sport, event, fighter, and sponsor.
      whyItMatters: >-
        Public event volume and media prominence cannot quantify cash-flow concentration,
        downside capacity, or the loss from a counterparty or franchise failure.
      diligencePath: >-
        Reconcile audited ledgers to the top-20 counterparty and event contribution schedule,
        then stress DAZN disruption and loss of the largest boxing draw.
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: succession-and-governance
      missingEvidence: >-
        Leadership succession plan, delegated authorities, key-person insurance, Pitch
        shareholder rights, reserved matters, conflicts policy, and liquidity provisions.
      whyItMatters: >-
        Highly visible leadership and family majority control can amplify continuity,
        governance, and transaction-execution risk.
      diligencePath: >-
        Review board minutes, succession materials, insurance certificates, shareholder
        agreement, delegation matrix, and named emergency successors.
      relatedTableRefs: [TR003]
