evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: Audited group revenue, EBITDA, free cash flow, debt, capex, total capital raised and current headcount.
    whyItMatters: >-
      Private-company scale and cash generation determine whether the reported valuation and expansion plans are
      financially supportable.
    diligencePath: >-
      Request the latest signed group accounts, management accounts, debt schedule, capex plan and capitalization table
      under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current shareholder agreement, board reserved matters, succession plan and key-person insurance or contract terms
      for the Hearn family.
    whyItMatters: Family control and founder visibility create continuity benefits but also concentration and succession exposure.
    diligencePath: >-
      Obtain constitutional documents, shareholder agreements, board minutes, executive contracts and insurance
      schedules.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: rights
    missingEvidence: >-
      Current territory-by-territory rights matrix and contract economics for DAZN, Sky Sports, Foxtel/Kayo and other
      broadcasters.
    whyItMatters: Rights duration, counterparty concentration and renewal terms drive recurring distribution and event economics.
    diligencePath: Request the rights register, renewal calendar, minimum guarantees and termination provisions.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A market study or rights-industry dataset that defines the relevant sports promotion and programming market by
      geography, category, and monetization stream.
    whyItMatters: >-
      Without a common denominator, event volume and individual rights deals cannot be converted into a defensible TAM,
      SAM, or SOM.
    diligencePath: >-
      Obtain a paid rights-market dataset or management market model and reconcile it to Matchroom's event, programming,
      ticketing, sponsorship, and rights revenue.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM004
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >-
      Current rights contracts, renewal dates, minimum guarantees, revenue shares, audience data, and event-level
      contribution margins.
    whyItMatters: The market opportunity may be large while Matchroom's retained economics remain concentrated or volatile.
    diligencePath: >-
      Request a rights and event cohort schedule showing counterparty, territory, term, guarantees, variable
      consideration, and contribution margin.
    relatedQuestionRefs:
      - QM005
      - QM007
      - QM008
  - type: conflicting-data
    severity: minor
    topic: event-volume
    missingEvidence: >-
      A current company-level definition reconciling event days, events, programming hours, and the scope of Matchroom
      subsidiaries.
    whyItMatters: >-
      Current official figures of 650 event days and 2,500 annual programming hours differ from the 600-plus and
      2,400-plus measures in other disclosures, while their reporting perimeter is not independently audited.
    diligencePath: >-
      Reconcile the latest management KPI pack to the legal-entity perimeter and distinguish event days from discrete
      events.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Realized rights revenue, event-level margins, Fight Pass subscribers, and package prices by sport and territory.
    whyItMatters: >-
      Without realized pricing and retention, portfolio breadth cannot be translated into durable economic advantage
      over other promoters.
    diligencePath: >-
      Request management's rights contracts, renewal schedule, subscriber cohort data, and contribution margins by sport
      and distribution channel.
    relatedQuestionRefs:
      - QP005
      - QP008
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-disclosure
    missingEvidence: >-
      Current contract, roster, audience, and financial data for Queensberry, Golden Boy, Misfits, and non-boxing
      substitutes.
    whyItMatters: Competitor comparisons otherwise risk overstating Matchroom's relative scale from company-reported breadth.
    diligencePath: >-
      Obtain competitor filings, rights announcements, customer references, audience data, and event-level economics
      across the major sports.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
      - TP002
  - type: stale
    severity: minor
    topic: athlete-mobility
    missingEvidence: Current roster retention, contract expiry, and replacement pipeline for material athletes and event brands.
    whyItMatters: The Warrington example demonstrates mobility risk but does not quantify current portfolio churn.
    diligencePath: Build a confidential roster and rights-expiry schedule with renewal probabilities and replacement costs.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: underwriting-gaps
    missingEvidence: >-
      Audited segment-level revenue, EBITDA, event P&Ls, free cash flow, working-capital detail, and debt or facility
      schedules.
    whyItMatters: >-
      Reported turnover, profit, and bank balance do not establish recurring revenue quality, cash conversion, or
      liquidity runway.
    diligencePath: >-
      Request the latest audited accounts, monthly management accounts, event-level P&Ls, cash-flow bridge, debt
      schedule, and covenant package.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
      - TI004
  - type: missing-source
    severity: material
    topic: sponsorship-risk
    missingEvidence: Current sponsor concentration, contract expiry, termination, and replacement economics.
    whyItMatters: >-
      The company has identified betting-sector regulatory exposure, but public evidence does not quantify the revenue
      at risk.
    diligencePath: >-
      Obtain the sponsor register, contract terms, renewal calendar, and scenario analysis for betting-sector
      substitution.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: Pitch International transaction consideration and use of proceeds.
    whyItMatters: >-
      A minority investment may improve capital adequacy, but the public announcement does not establish cash available
      to Matchroom.
    diligencePath: >-
      Request transaction documents, proceeds allocation, post-close capitalization, and any investor funding
      commitments.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: trust-and-safety
    missingEvidence: >-
      Security, privacy, incident-response, disaster-recovery and production-redundancy documentation for Matchroom's
      event and digital operations.
    whyItMatters: >-
      A rights-and-events business can lose audience, partner trust and sponsor value through a failed live delivery or
      data incident, yet the assigned public sources do not quantify this exposure.
    diligencePath: >-
      Request current security policies, penetration-test summaries, incident log, continuity plan, production
      architecture and supplier-control schedule from management.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public or private evidence of software systems, developer activity, data assets, technical integrations and
      ownership of first-party audience data.
    whyItMatters: >-
      The available evidence supports content and rights execution but cannot establish software defensibility or
      proprietary technology as an investment moat.
    diligencePath: >-
