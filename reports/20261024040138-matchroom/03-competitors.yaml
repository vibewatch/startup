          x: 3
          y: 5
          note: "Ordinal score reflects BBC's current description of five years spanning influencer boxing and leading women's boxing; comparable scale is not disclosed."
        - label: Celebrity-led entrants
          name: Celebrity-led entrants
          x: 2
          y: 5
          note: "Ordinal score reflects current coverage of Dana White and algorithmic celebrity power, not a single measured organization."
    approximationNotes: Scores are evidence-backed ordinal judgments, not measured market shares, revenue, or audience data; the figure should not be read as a quantitative ranking.
    claimRefs: [CP001, CP002, CP003, CP006, CP009, CP014, CP015, CP016]
