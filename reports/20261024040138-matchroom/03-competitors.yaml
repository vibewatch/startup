        - label: Top Rank
          name: Top Rank
          x: 4
          y: 7
          note: "Ordinal score based on boxing specialization and ESPN relationship described in the assigned source."
        - label: Queensberry
          name: Queensberry
          x: 3
          y: 6
          note: "Ordinal score based only on DAZN identifying Queensberry as a partner; portfolio breadth is not disclosed."
        - label: Golden Boy
          name: Golden Boy
          x: 3
          y: 6
          note: "Ordinal score based only on DAZN identifying Golden Boy as a partner; portfolio breadth is not disclosed."
        - label: MVP
