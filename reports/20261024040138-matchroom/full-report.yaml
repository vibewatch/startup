chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Matchroom Sport was formed in Romford, Essex, in 1982 after Barry Hearn's work in snooker management, then
              expanded into boxing, television production and a broader portfolio of sports. The company describes its
              model as owning, producing and promoting sporting events, monetising through broadcaster relationships,
              sponsorship, ticketed events and associated rights. Its current official site lists 12 sports, 650 event
              days and 2,500 hours of original programming annually, while the 2026 company announcement describes more
              than 600 event days and 2,400 hours distributed across broadcast and streaming platforms. The difference
              is a disclosed snapshot difference, not a reconciled growth series.
            claimRefs:
