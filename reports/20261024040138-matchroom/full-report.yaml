  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic model
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the monetization of live and televised sporting events and associated sports
              intellectual property, not all sports entertainment spending. Matchroom's own history describes a
              progression from athlete and tournament management into event ownership, promotion, and television, while
              its current corporate description says it owns, produces, and promotes sporting events and supplies sports
              programming to broadcasters. The boundary therefore includes event promotion, media rights and
              programming, sponsorship and hospitality, and related ticketing and talent economics. It excludes team
              ownership, general broadcaster revenues, and consumer subscriptions that belong to distribution partners.
              This distinction matters because the company can capture value at several points in the chain without
              owning every downstream customer relationship.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several narrower sizing lenses but not a single reliable top-down market number.
              Matchroom's current website reports 12 sports, 650 event days, 2,500 hours of original annual programming,
              and 20,000 hours of available programming. Its 2024 partnership announcement instead cited more than 600
              event days and over 2,400 original-programming hours, while 2026 reporting used similar but not identical
              measures. A historical boxing transaction described an eight-year, $1 billion joint venture for 32 annual
              US and UK fight nights, showing rights-backed investment in one subcategory rather than the size of the
              whole market. Event volume, programming hours, rights contracts, and audience or sponsor monetization are
              therefore separate sizing lenses, not interchangeable denominators. No assigned source isolates a
              geography-adjusted SAM or company-specific SOM; both remain explicit diligence gaps.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM013
      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Matchroom's demand is multi-sided. Broadcasters and streaming platforms are paying distribution partners
              seeking reliable rights, differentiated programming, and recurring event supply. Sponsors seek audience
              reach and brand association, while live attendees pay for tickets and hospitality. Athletes and governing
              bodies are supply-side counterparties whose talent, event rights, and sanctioning relationships determine
              inventory quality. Fans are users and sometimes direct payers, but a rights partner may monetize them
              through a subscription or advertising bundle rather than through Matchroom directly. The evidence shows
              this structure in practice: DAZN extended boxing rights for five years with plans for more than 30 shows
              per year, while its PDC deal covers major tournaments and additional tours in Germany, Austria, and
              Switzerland. Adoption is triggered by premium events, dependable calendars, and distribution reach, not by
              a standalone software purchase.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The main growth driver is the ability to package scarce sports intellectual property into repeatable,
              internationally distributed event calendars. Historical diversification across snooker, boxing, pool,
              darts, golf, fishing, bowling, and other disciplines reduces dependence on one competition, while the
              Pitch International investment and current DAZN rights extensions indicate continued emphasis on
              international media rights, events, sponsorship, and distribution. Constraints are equally material:
              rights contracts can be concentrated, athlete and promoter relationships can change, event economics
              depend on attendance and broadcast demand, and distribution partners can alter pricing or strategy. BBC
              and Guardian evidence shows a crowded and attention-sensitive boxing environment, while the Warrington
              example demonstrates that talent relationships can end when plans diverge. These factors support a growth
              opportunity but make market-share, contract-tenor, and unit-economics diligence central to valuation.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Addressable-market precision is the key diligence gap
            body: >-
              Matchroom's public operating scale and rights relationships support a real market opportunity, but current
              evidence cannot translate them into a comparable market denominator or retained-economics forecast.
            calloutType: risk
            claimRefs:
              - CM006
              - CM008
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Matchroom's relevant competitive set spans direct boxing promoters such as Top Rank, sport-specific rights
              owners and promoters such as the Professional Darts Corporation and World Snooker within its own
              portfolio, broadcasters that can alter the economics of rights, and substitutes including self-promoted
              events, federation-led competitions, and status-quo entertainment spend. The company's official history
              describes a progression from snooker management into boxing, event ownership, television, pool, darts, and
              other sports, while its current corporate surface describes 12 sports, 650 event days, and 2,500 hours of
              original programming. That breadth is a capability and a risk: it creates cross-sport distribution and
              sponsor inventory, but it also makes the company compete for scarce talent, audience attention, and
              broadcaster budgets across many categories. Top Rank is a credible direct boxing peer with a long
              operating history, a Las Vegas base, and an ESPN relationship; it is not evidence that the two businesses
              have equal scale or economics. Matchroom's differentiation is therefore best framed as a
              portfolio-and-rights system, not a claim of universal superiority.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
