  - id: FR001
    title: Residual risk heatmap - evidence-priority triage
    type: matrix
    summary: >-
      Qualitative prioritization of the most decision-relevant risks; labels are not probabilities and unknown
      mitigation evidence is shown explicitly.
    data:
      columns:
        - label: Impact
          detail: Investment impact if the failure mode occurs
        - label: Likelihood
          detail: Qualitative likelihood from retained public evidence
        - label: Mitigation evidence
          detail: Maturity visible in the assigned public source pool
      rows:
        - label: DAZN boxing concentration
          values:
            - label: High
              note: More than 30 annual US/UK shows planned
            - label: Medium
              note: Long-term commitment reduces near-term renewal risk but increases counterparty dependence
            - label: Limited
              note: Contract guarantees and remedies are private
        - label: Headline-talent concentration
          values:
            - label: High
              note: Joshua was reported as the biggest draw in 2024
            - label: Medium-high
              note: Late-2026 boxing coverage remains franchise-centered
            - label: Limited
              note: Contribution and replacement pipeline are not quantified
        - label: Key-person leadership
          values:
            - label: High
              note: Chairmanship and promotion identity are strongly associated with Eddie Hearn
            - label: Medium
              note: No disclosed succession event; exposure is structural
            - label: Limited
              note: Succession and insurance evidence are absent
        - label: Multi-jurisdiction execution
          values:
            - label: High
              note: Failure can cancel events and damage rights relationships
            - label: Medium
              note: Current boxing calendar spans five listed countries
            - label: Partial
              note: Operating history is visible but control KPIs are not
        - label: Licensing and public disputes
          values:
            - label: Medium-high
              note: Permits and reputation can affect event delivery
            - label: Medium
              note: A licensing application and a retracted allegation are observable signals
            - label: Limited
              note: No consolidated legal register was retained
        - label: Cybersecurity and data
          values:
            - label: High
              note: Digital rights, ticketing, and customer data can create material exposure
            - label: Unknown
              note: No current incident-rate evidence
            - label: Unknown
              note: No control, audit, or insurance record in the assigned pool
    approximationNotes: >-
      Qualitative analyst assessment as of 2026-10-24; cells preserve uncertainty and do not imply measured
      probabilities, loss values, or independently verified controls.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR009
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Commercial proof narrows the business-quality question, but missing price and cash-flow evidence block an
      investable valuation conclusion.
    data:
      nodes:
        - id: scale
          label: Portfolio scale
          detail: Company-reported multi-sport event and programming footprint.
        - id: proof
          label: Contract proof
          detail: Five-year DAZN extension and current talent renewal evidence.
        - id: dependencies
          label: Dependency tests
          detail: Broadcaster alternatives, talent churn, and key-person transferability.
        - id: economics
          label: Economics gap
          detail: No audited margins, free cash flow, net debt, or event contribution data.
        - id: price
          label: Price gap
          detail: No disclosed Pitch consideration, exact stake, or preference terms.
        - id: decision
          label: Research more
          detail: Underwrite private evidence before setting entry price or target return.
      edges:
        - from: scale
          to: proof
        - from: proof
          to: dependencies
        - from: dependencies
          to: economics
        - from: economics
          to: price
        - from: price
          to: decision
    approximationNotes: >-
      The flow is decision logic, not a quantitative scoring model; node order does not imply measured conversion or
      probability.
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV013
      - CV015
      - CV016
