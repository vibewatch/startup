            body: >-
              Matchroom's capital history is best evidenced through strategic minority investments rather than a
              disclosed venture-round schedule. The 2024 Pitch International announcement says Pitch would acquire a
              minority stake while the Hearn family retained majority control; its financial terms are not stated in the
              retained text. In May 2026, Matchroom announced Bruin Capital had agreed to take a minority equity
