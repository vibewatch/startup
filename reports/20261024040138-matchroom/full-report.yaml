      - number: '1.2'
        title: Leadership, governance and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Control remains concentrated with the Hearn family. Matchroom's official leadership material identifies
              Barry Hearn as President and Eddie Hearn as Chairman, with Barry moving to an advisory President role in
              April 2021 as Eddie became Chairman. The same source identifies Steve Dawson as Chief Operating Officer
              and Group Finance Director, Katie McCabe as Director of Programming and CEO of Matchroom Media, Matthew
              Porter as PDC Chief Executive, and Frank Smith as Matchroom Boxing CEO and a parent-company board member.
              Bruin Capital joined the board after taking a minority interest in 2026, but the company said the Hearn
              family retained majority ownership. This creates functional coverage beyond the founders, while Eddie and
              Barry remain material relationship and brand dependencies.
