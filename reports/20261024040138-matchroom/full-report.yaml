      - number: '3.2'
        title: Distribution, packaging, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              The buyer proposition is built around packaging scarce live sports into broadcastable programming,
              sponsorship inventory, tickets, and fan access. Matchroom says it supplies sports programming to virtually
              every major broadcaster, and its history page describes 20 annual fight nights broadcast on Sky Sports in
              the UK and worldwide on DAZN; the current boxing surface also shows a continuing international event
              calendar and a Fight Pass membership offer. Independent SportsPro reporting adds a more current example:
              DAZN's five-year extension covers the US and UK, plans more than 30 shows per year, and extends PDC rights
              in Germany, Austria, and Switzerland through 2031. These relationships increase reach and switching
              friction for a broadcaster, but they also expose Matchroom to renewal, platform, and rights-pricing risk.
              Public sources do not disclose a comparable standardized list price for Matchroom's packages, so pricing
              rows distinguish disclosed rights terms from unknown event-level economics rather than implying a price
              advantage.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: Moat durability and displacement risks
        blocks:
          - type: paragraph
            body: >-
              The moat appears strongest where Matchroom controls repeatable event brands, athlete relationships,
              production know-how, and buyer access at the same time. A minority investment from Pitch International was
              explicitly tied to international media rights, global events, and sponsorships, while the later Bruin
              transaction was reported at a valuation above £1 billion and paired with support for US expansion. Those
              transactions are signals of strategic access, not proof of future returns. The adverse evidence is
              operational: Sky Sports reported that Matchroom did not renew Josh Warrington's contract after the parties
              disagreed on plans, showing that athlete relationships can end even when a boxer has local fan support.
              DAZN's separate partnerships with Queensberry, Golden Boy, and Misfits show platform multi-homing, while
              current BBC and Guardian coverage points to MVP, Dana White, Frank Warren, and celebrity-led event logic
              as visible competitive forces. Matchroom can defend its position through portfolio breadth and execution,
              but a single star, sport, or broadcaster should not be treated as locked in.
            claimRefs:
              - CP011
              - CP012
              - CP017
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Portfolio moat
            body: >-
              The evidence supports a moat in owned or controlled event IP and repeat distribution relationships, not an
              unqualified moat in every sport or athlete relationship.
            calloutType: strength
            claimRefs:
              - CP001
              - CP006
              - CP011
          - type: callout
            title: Concentration and mobility
            body: >-
              Rights renewals, broadcaster strategy, and athlete mobility remain material sources of displacement risk;
              public sources do not provide contract-level visibility for the full portfolio.
            calloutType: risk
            claimRefs:
              - CP009
              - CP017
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue engine and monetization
        blocks:
          - type: paragraph
            body: >-
              Matchroom operates a rights-and-events model rather than a conventional recurring-revenue software
              business. Spark Intel describes the business as staging sports events and selling them as television
              programming, with revenue from broadcast rights, ticket sales, and sponsorship. Matchroom's own materials
              describe ownership, production, and promotion of events, while its 2024 Pitch International announcement
              says the strategic partnership targets international media rights, global events, and sports sponsorships.
              The commercial model therefore converts event rights, audience reach, and sponsor inventory into revenue,
              but the public sources do not disclose the realized split among rights, tickets, sponsorship,
              merchandising, or licensing. That lack of mix detail limits assessment of revenue durability and
              concentration.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
              - CI011
              - CI012
      - number: '4.2'
        title: Reported performance and cost structure
        blocks:
          - type: paragraph
            body: >-
              Spark Intel's summary of Companies House group accounts reports £225m of turnover for the year to June
              2025, up from £218m, alongside £55m of pre-tax profit versus £52m in the prior year. It also reports £14m
              of staff costs, 142 employees, £22m at the bank, £33m of net assets, and £33m of dividends paid. These are
              reported group-account figures rather than an independently audited operating model presented in the
              public source. The implied pre-tax margin is about 24.4% (£55m divided by £225m), an analyst calculation
              that should not be mistaken for disclosed gross margin or free cash flow. The drop in reported bank and
              cash from £38m to £22m, together with the dividend, makes cash conversion and distribution policy
              important diligence questions.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Capital adequacy and underwriting gaps
        blocks:
          - type: paragraph
            body: >
              Public evidence indicates meaningful commercial scale but leaves several financing inputs unavailable. The
              Spark Intel account summary gives a point-in-time bank-and-cash figure and net assets, not runway, undrawn
              facilities, covenant headroom, capex, working capital, or free cash flow. The company-issued Pitch
              announcement confirms a significant investment and minority stake sale to Pitch International while the
              Hearn family retained majority control, but it does not disclose transaction value, proceeds to Matchroom,
              or intended use of funds. SportsPro reports a five-year DAZN extension for Matchroom Boxing and rights
              through 2031 for PDC events in Germany, Austria, and Switzerland; these relationships support distribution
              visibility but do not disclose Matchroom's realized economics. Matchroom Boxing also promotes a Fight Pass
              membership, but the fetched page does not state a price. A further risk is sponsor substitution: SBC News
              reports Matchroom's statement that gambling-law changes may affect betting-sector event sponsorship and
              that directors were working to diversify sponsors. The public record is therefore sufficient to establish
              scale and identifiable commercial dependencies, but insufficient for a reliable runway, margin, or
              next-round trigger.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI004
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              Matchroom presents as a profitable, cash-generative-looking sports-rights platform on the limited figures
              available, but the evidence is not sufficient to underwrite that conclusion as recurring or durable.
              Reported turnover and pre-tax profit are strong headline indicators, yet the sources do not separate
              event-level economics, rights advances, promoter obligations, prize money, production costs, working
              capital swings, or cash conversion. DAZN and other broadcast relationships can improve reach and
              scheduling visibility, while the Pitch partnership may add distribution and capital, but both are
              relationship evidence rather than proof of realized margin or liquidity. Betting-sponsor exposure is a
              concrete adverse consideration because the company itself identified regulatory change as a potential
              commercial impact. Talent agreements can also expire without renewal, and current independent coverage
              characterizes boxing as retaining box-office appeal even while broader popularity wanes; neither
              observation quantifies Matchroom's exposure, but both reinforce event and roster volatility. Before
              underwriting, an investor should obtain audited segment-level revenue and EBITDA, cash-flow statements,
              event P&Ls, rights and sponsorship contracts, debt and security schedules, transaction proceeds, and a
              forward liquidity plan.
            claimRefs:
              - CI005
              - CI010
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong reported scale
            body: >-
              Filed group-account summaries show £225m of turnover and £55m of pre-tax profit for the year to June 2025,
              but the public evidence does not establish the quality of those earnings.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Cash and sponsor dependency
            body: >-
              Reported bank and cash fell from £38m to £22m while dividends rose to £33m, and the company identified
              potential betting-sponsorship disruption from gambling-law change.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI014
          - type: callout
            title: Request event-level underwriting data
            body: >-
              The next diligence step is to obtain segment and event-level revenue, margin, cash conversion, partner
              concentration, and liquidity schedules before relying on headline profit.
            calloutType: recommendation
            claimRefs:
              - CI005
              - CI008
              - CI010
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Matchroom delivers sports entertainment through a repeatable workflow that starts with acquiring or
              developing a sports property, assembling talent and event formats, staging live competitions, producing
              broadcast-ready programming, and licensing distribution to media partners. Its public boxing surface
              presents an active event calendar and a Matchroom Fight Pass membership offer, while its corporate history
              describes a broader portfolio spanning snooker, boxing, pool, fishing, bowling, golf, darts and other
              events. The customer-facing product is therefore a combination of live event access, media rights
              inventory, original programming and fan experiences rather than a single application. The clearest current
              distribution proof is the renewed five-year Matchroom Boxing relationship with DAZN in the United States
              and United Kingdom, with more than 30 shows per year and seven 2026 events on Foxtel and Kayo Sports in
              Australia. Independent BBC and Guardian boxing hubs also show that fan discovery spans news, audio, video
              and feature formats outside Matchroom-controlled channels. This supports a scaled content-delivery model,
              but not a claim about realized audience, conversion or unit economics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE007
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE008
      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The operating architecture is a layered rights, production and distribution system. Matchroom's history
              says Matchroom Sport TV began trading in 1990 as the business moved toward event ownership, promotion and
              television. Its current corporate homepage lists 2,500 hours of original programming per year and 20,000
              hours of available programming. The newer Pitch International alliance adds media-rights, event and
              sponsorship capability across Matchroom Boxing, the Professional Darts Corporation, World Snooker and
              Matchroom MultiSport; the 2024 announcement says Matchroom promoted more than 600 event days and over
              2,400 hours of original programming per year. These are company-issued scale claims from different
              vintages and should not be treated as independently audited throughput. The public record does show
              operational maturity in rights ownership and repeat event production, including a PDC media-rights
              extension through 2031 in Germany, Austria and Switzerland. It does not reveal software components, data
              pipelines, production vendors, service-level objectives or internal controls.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE009
              - CE013
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
      - number: '5.3'
        title: Dependencies, reliability and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Matchroom's delivery depends on external distribution platforms, rights counterparties, venues, athletes
              and event execution. DAZN describes production quality, audience reach and global capability as reasons
              for the renewed partnership, while the independent SportsPro account identifies the geographic scope,
              annual show cadence and the expansion of PDC coverage. This is evidence of a distribution relationship,
              not proof that Matchroom controls the end-to-end viewing stack. Portfolio breadth also creates dependency
              concentration: a prominent boxing roster and media partners are valuable assets, but a contract can
              expire, a fighter can leave, or a broadcaster can change strategy. Sky Sports' report that Matchroom did
              not renew Josh Warrington's contract demonstrates that roster composition changes in practice. Public
              sources reviewed did not establish uptime, incident history, cybersecurity certification, privacy
              controls, disaster recovery, production redundancy, or a public developer signal. Those gaps should remain
              explicit before underwriting technical defensibility or operational resilience.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Durable content engine, opaque technical layer
            body: >-
              Public evidence supports a mature event-and-rights engine with recurring production and distribution, but
              it does not support a software moat, security certification or reliability claim.
            calloutType: insight
            claimRefs:
              - CE005
              - CE006
              - CE013
              - CE014
          - type: callout
            title: Treat distribution reach as partner-enabled
            body: >-
              DAZN, Foxtel and Kayo expand access, but Matchroom's own audience ownership, platform economics and
              first-party data control require diligence.
            calloutType: assumption
            claimRefs:
              - CE003
              - CE004
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer ecosystem and segmentation
        blocks:
          - type: paragraph
            body: >-
              Matchroom's paying and strategic customer base is best understood as a multi-sided sports-content market
              rather than a conventional software account list. Broadcasters buy rights and programming; sponsors buy
              audience and association; athletes and governing bodies supply or license event participation; venues and
              local promoters provide distribution and live-event capacity; fans consume tickets, broadcasts, and
              digital content. Matchroom's own materials describe ownership, production, and promotion of events, and
              say it supplies programming to virtually every major sports broadcaster. The 2024 Pitch partnership
              announcement also identifies international media rights, global events, and sponsorships as the commercial
              surfaces. This supports a diversified customer architecture in principle, but the public record does not
              allocate revenue, margin, or account counts by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU009
      - number: '6.2'
        title: Adoption trajectory and commercial proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strongest where a named counterparty has renewed or expanded a relationship, and
              weaker where Matchroom presents an audience, event, or programming total without a denominator for paying
              accounts. Matchroom reports 650 event days and 2,500 hours of original programming on its current home
              page, while its 2024 partnership release reports more than 600 event days and more than 2,400 programming
              hours. SportsPro reports a five-year DAZN extension for Matchroom Boxing in the United States and United
              Kingdom, plans for more than 30 shows per year, and expanded PDC rights in Germany, Austria, and
              Switzerland through 2031. These are meaningful distribution and repeat-use signals, but they do not
              establish net retention, renewal rates, average contract value, or cash collections.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: Named proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              Named counterparties provide credible proof that Matchroom's events reach production or broadcast
              distribution, but the evidence is uneven on end-user outcomes. DAZN is an identified broadcast partner
              with a renewed five-year boxing arrangement and a long-running PDC relationship; Pitch International is an
              identified strategic investor and rights partner; Sky Sports is identified as a historical live
              broadcaster for Matchroom boxing. Matchroom's official pages also name fighters and tournament
              participants, but a roster or logo is not proof of active commercial retention. Adverse evidence shows
              that individual talent relationships can end: Sky Sports reported that Matchroom did not renew Josh
              Warrington's contract after the parties did not share the same plans. Public materials do not disclose
              top-customer concentration, contract length beyond selected rights deals, churn, or the economics of
              replacing a broadcaster or athlete.
            claimRefs:
              - CU010
              - CU011
              - CU016
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU011
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Repeat-distribution proof
            body: >-
              The five-year DAZN extension and expanded PDC rights are stronger adoption evidence than undifferentiated
              audience or logo claims because they identify counterparties, territories, and contract duration.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
          - type: callout
            title: Customer metrics remain opaque
            body: >-
              No assigned source discloses customer count, revenue concentration, renewal or churn rates, cohort
              behavior, or contract economics; those remain material diligence gaps rather than zero values.
            calloutType: risk
            claimRefs:
              - CU009
              - CU015
          - type: callout
            title: Request account-level evidence
            body: >-
              Underwrite broadcaster and sponsor durability using a customer-by-customer schedule of contract terms,
              renewal status, revenue share, territory, and replacement pipeline.
            calloutType: recommendation
            claimRefs:
              - CU009
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk hierarchy and investment consequence
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a high-priority concentration cluster rather than a single disclosed
              crisis. SportsPro reports a new five-year DAZN boxing extension covering more than 30 US and UK shows per
              year, while late-2026 BBC, Athletic, and ESPN boxing pages continue to foreground the Fury-Joshua
              franchise and Eddie Hearn-linked stories. That combination makes broadcaster continuity, headline talent
              availability, and key-person execution the most visible residual risks. Matchroom has meaningful portfolio
              breadth, but its own scale claims do not establish revenue diversification or loss absorbency. The
              investment implication is to underwrite the group on verified cash flows by sport and counterparty, not on
              event count, media prominence, or an executive valuation assertion. A deterioration in DAZN performance,
              loss of a headline franchise without a replacement, or unplanned leadership succession should pause
              investment until quantified mitigants are produced.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR013
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR009
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, regulatory, and reputation exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence is insufficient for a complete jurisdiction-by-jurisdiction legal register. The current
              record does show that major-event execution can depend on specific licensing relief: The Athletic reported
              an application to Cardiff Council for a one-off extension connected with a 1am Fury-Joshua ringwalk. It
              also reported that Chris Eubank Jr retracted corruption allegations against Eddie Hearn and Robert Smith
              as untrue and without foundation; that item evidences reputational dispute exposure, not misconduct by
              Matchroom. Matchroom's current event page spans the UK, US, Australia, Russia, and Monaco, increasing the
              number of sanctioning, licensing, immigration, tax, safety, and sanctions regimes that may matter. No
              retained source provides a comprehensive litigation list, promoter-license schedule, safety-event log,
              privacy posture, or sanctions-control framework. Those omissions are gaps, not evidence that incidents or
              liabilities do not exist.
            claimRefs:
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR016
      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Matchroom describes a footprint of 12 sports, 650 event days, and 2,500 hours of annual original
              programming. That scale diversifies the content slate but also expands scheduling, venue, production,
              medical, travel, and quality-control dependencies. The current Matchroom Boxing calendar alone lists
              events across five countries, while DAZN's extension contemplates more than 30 annual US and UK shows. A
              2020 independent analysis documented performance-based opt-outs in the then-DAZN agreement and criticized
              streaming reliability; it is historical evidence of the failure mode, not proof of current platform
              performance. Public evidence in the assigned pool does not disclose incident response, cyber controls,
              venue contingency plans, fighter-safety KPIs, cancellation rates, or insurance limits. Investment
              underwriting should therefore treat mitigation maturity as unverified until management supplies current
              operating and incident data.
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR015
      - number: '7.4'
        title: Partner, financial-model, and execution triggers
        blocks:
          - type: paragraph
            body: >-
              Counterparty concentration is clearest in distribution. DAZN is tied to Matchroom Boxing through a
              five-year US/UK extension and to PDC darts in Germany, Austria, and Switzerland through 2031. Pitch
              International acquired a minority stake in 2024, with the Hearn family retaining majority control,
              creating strategic support but not independent evidence of governance depth or downside funding. Talent
              contracts are another renewal surface: Sky's historical Warrington report shows Matchroom can allow a
              contract to expire when plans diverge, while the Express described Anthony Joshua as the company's biggest
              draw in 2024. The Express also relayed executive claims of a billion-pound valuation and possible 15%-30%
              minority transactions; neither is an audited liquidity or cash-loss measure. Kill criteria are a material
              DAZN payment or distribution disruption, loss of a headline draw without a proven successor, regulatory
              inability to stage a priority event, or diligence showing that a single counterparty drives an
              unacceptable share of cash contribution.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR011
              - CR017
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR011
              - CR017
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence-gated investment posture
            body: >-
              Do not credit portfolio breadth as economic diversification until revenue, contribution margin, and
              counterparty concentration are reconciled by sport. Pause if DAZN payment protection, headline-talent
              replacement, leadership succession, event-compliance controls, or current incident data cannot be
              demonstrated with primary records.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR009
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive recommendation
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research more, with no invest decision until a price and a normalized financial base
              are available. Commercial evidence is constructive: SportsPro reports a new five-year Matchroom Boxing
              extension with DAZN covering the US and UK and more than 30 shows per year, while Matchroom says Pitch
              International invested for a minority stake and the Hearn family retained majority control. Those facts
              indicate strategic relevance and contract durability, not equity value. The fetched investment release
              calls the investment significant but supplies no consideration, ownership percentage, enterprise value,
              net debt, or preference terms. Without audited cash flow and transaction economics, neither a target
              return nor a defensible hold-period or exit valuation can be calculated.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is a diversified sports-promotion and programming platform with recurring demand from
              broadcasters, a current global event pipeline, and demonstrated ability to retain talent. Matchroom's
              current site reports 12 sports, 650 event days and 2,500 hours of original programming, while the boxing
              site displays events in multiple countries and both an independent article and Matchroom announce a
              multi-fight Jaron Ennis renewal. The anti-thesis is concentration and transferability risk: DAZN also
              works with other boxing promoters, an older Sky Sports report shows a boxer contract was allowed to
              expire, and Forbes frames Eddie Hearn as central to Matchroom's boxing expansion. Public scale claims are
              company-issued and do not reveal margins, concentration, or cash conversion.
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV017
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV017
      - number: '8.3'
        title: Scenarios and comparable discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario underwriting should be driven by renewal economics, event contribution margins, talent retention,
              broadcaster concentration, and normalized free cash flow rather than by headline programming volume. The
              bull case requires the DAZN term and event cadence to translate into expanding cash generation across the
              portfolio. The base case assumes stable rights relationships and roster replenishment but no
              evidence-supported multiple expansion. The bear case combines partner concentration, talent churn, weaker
              event economics, and illiquid minority ownership. The assigned sources provide no suitable public-company,
              private-round, or sports-promotion M&A multiple. SportsPro's cited Foxtel acquisition is an adjacent
              pay-TV platform transaction, not a like-for-like Matchroom valuation benchmark, so using it as a multiple
              would create false comparability.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV017
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV010
              - CV017
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness and decisive diligence
        blocks:
          - type: paragraph
            body: >-
              Pitch International's 2024 minority investment establishes that strategic capital has engaged with
              Matchroom, but the fetched release does not identify a liquidity mechanism, governance package, exit
              timetable, or valuation. Exit readiness therefore remains unproven. The decision can improve only through
              primary private evidence: audited group accounts with segment profitability and free cash flow; a fully
              diluted cap table and preference waterfall; transaction documents for the Pitch investment; contract
              economics and concentration for DAZN and other major broadcasters; event-level contribution margins; and
              key-person, succession, and talent-renewal protections. Thesis-break triggers are a material rights
              non-renewal, sustained failure to replace marquee talent, negative free cash flow after event working
              capital, or terms that leave a new minority investor structurally subordinated without a credible
              liquidity path.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV017
              - CV016
