companyProfile:
  summary: >-
    Matchroom is a Hearn-family-controlled sports promotion and rights group formed in Romford, Essex, in 1982. It
    expanded from snooker management into boxing, darts, pool, golf, fishing, bowling, television, and other sports,
    combining event ownership and promotion with original programming and distribution through broadcasters and
    streaming partners.
  founders:
    - name: Barry Hearn
      role: Founder and President
      background: Founded Matchroom after earlier work in snooker management.
      claimRefs:
        - CO001
        - CO005
    - name: Eddie Hearn
      role: Group Chairman
      background: Became chairman in 2021 after Barry Hearn moved to president.
      claimRefs:
        - CO005
        - CO006
  foundingLocation: Romford, Essex, United Kingdom
  headquarters: Brentwood, Essex, United Kingdom
  productSummary: >-
