  topStrengths:
    - Diversified multi-sport event IP and meaningful original-programming scale.
    - Durable broadcaster and streaming relationships, including the current DAZN extension.
    - Positive FY2025 filed turnover and pre-tax profit, alongside strategic investor interest.
  topRisks:
    - Broadcaster and headline-talent concentration can pressure rights economics.
    - Leadership and relationship dependence remain concentrated around the Hearn family.
    - Equity valuation, cash generation, net debt, and transaction terms are not publicly disclosed.
  unresolvedGaps:
    - Audited group-level free cash flow, capex, net debt, and recurring revenue mix.
    - Exact consideration, ownership percentage, and governance terms for strategic investments.
    - DAZN subscriber and counterparty financial health, plus rights-renewal economics.
    - Key-person insurance and contractual protections for senior leadership and headline talent.
