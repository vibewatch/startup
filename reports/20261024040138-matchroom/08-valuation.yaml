company:
  name: "Matchroom"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Matchroom shows durable commercial assets through a five-year DAZN extension, a broad
    event portfolio, current talent renewals, and Pitch International's minority investment.
    The assigned public evidence does not disclose the investment price, ownership percentage,
    audited cash generation, net debt, or preference structure, so the investable conclusion is
    research more rather than a price-insensitive endorsement.
sections:
  - id: "price-sensitive-recommendation"
    title: "Price-sensitive recommendation"
    body: >-
      The recommendation is research more, with no invest decision until a price and a normalized
      financial base are available. Commercial evidence is constructive: SportsPro reports a new
      five-year Matchroom Boxing extension with DAZN covering the US and UK and more than 30 shows
      per year, while Matchroom says Pitch International invested for a minority stake and the
      Hearn family retained majority control. Those facts indicate strategic relevance and
      contract durability, not equity value. The fetched investment release calls the investment
      significant but supplies no consideration, ownership percentage, enterprise value, net
      debt, or preference terms. Without audited cash flow and transaction economics, neither a
      target return nor a defensible hold-period or exit valuation can be calculated.
    claimRefs: ["CV001", "CV002", "CV003", "CV013", "CV015"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "thesis-and-anti-thesis"
    title: "Thesis and anti-thesis"
    body: >-
      The thesis is a diversified sports-promotion and programming platform with recurring demand
      from broadcasters, a current global event pipeline, and demonstrated ability to retain
      talent. Matchroom's current site reports 12 sports, 650 event days and 2,500 hours of
      original programming, while the boxing site displays events in multiple countries and both
      an independent article and Matchroom announce a multi-fight Jaron Ennis renewal. The
      anti-thesis is concentration and transferability risk: DAZN also works with other boxing
      promoters, an older Sky Sports report shows a boxer contract was allowed to expire, and
      Forbes frames Eddie Hearn as central to Matchroom's boxing expansion. Public scale claims
      are company-issued and do not reveal margins, concentration, or cash conversion.
    claimRefs: ["CV005", "CV007", "CV009", "CV010", "CV017", "CV012"]
    tableRefs: ["TV002"]
  - id: "scenarios-and-comparables"
    title: "Scenarios and comparable discipline"
    body: >-
      Scenario underwriting should be driven by renewal economics, event contribution margins,
      talent retention, broadcaster concentration, and normalized free cash flow rather than by
      headline programming volume. The bull case requires the DAZN term and event cadence to
      translate into expanding cash generation across the portfolio. The base case assumes stable
      rights relationships and roster replenishment but no evidence-supported multiple expansion.
      The bear case combines partner concentration, talent churn, weaker event economics, and
      illiquid minority ownership. The assigned sources provide no suitable public-company,
      private-round, or sports-promotion M&A multiple. SportsPro's cited Foxtel acquisition is an
      adjacent pay-TV platform transaction, not a like-for-like Matchroom valuation benchmark, so
      using it as a multiple would create false comparability.
    claimRefs: ["CV003", "CV004", "CV005", "CV017", "CV013", "CV014"]
    tableRefs: ["TV003"]
  - id: "exit-readiness-and-diligence"
    title: "Exit readiness and decisive diligence"
    body: >-
      Pitch International's 2024 minority investment establishes that strategic capital has
      engaged with Matchroom, but the fetched release does not identify a liquidity mechanism,
      governance package, exit timetable, or valuation. Exit readiness therefore remains
      unproven. The decision can improve only through primary private evidence: audited group
      accounts with segment profitability and free cash flow; a fully diluted cap table and
      preference waterfall; transaction documents for the Pitch investment; contract economics
      and concentration for DAZN and other major broadcasters; event-level contribution margins;
      and key-person, succession, and talent-renewal protections. Thesis-break triggers are a
      material rights non-renewal, sustained failure to replace marquee talent, negative free cash
      flow after event working capital, or terms that leave a new minority investor structurally
      subordinated without a credible liquidity path.
    claimRefs: ["CV001", "CV002", "CV003", "CV010", "CV017", "CV016"]
tables:
  - id: "TV001"
    title: "Recommendation summary table"
    columns: ["Decision item", "Assessment", "Evidence basis", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Commercial contracts and strategic investment are visible, but price and audited economics are not.", "Do not make a price-based investment decision from public evidence."]
      - ["Confidence", "Medium on commercial durability; low on valuation", "The five-year DAZN extension and current activity support continuity; valuation inputs remain private.", "Separate business quality from entry-price attractiveness."]
      - ["Risk rating", "High underwriting risk", "Broadcaster, talent, key-person, minority-governance, and liquidity exposures are not quantified.", "Require downside-protection and concentration evidence before term-setting."]
      - ["Valuation stance", "Indeterminate / evidence-insufficient", "No disclosed transaction consideration, stake percentage, audited free cash flow, net debt, or preference stack.", "Do not label the price cheap or stretched without the missing denominator."]
      - ["Return / hold / exit", "Not supportable", "No entry price, cash-flow forecast, ownership terms, or exit mechanism is public in the assigned evidence.", "Set target return and hold period only after data-room underwriting."]
    notes: "Assessments use only the assigned fetched evidence; no valuation, return range, or probability is estimated where the required private inputs are absent."
    claimRefs: ["CV001", "CV002", "CV003", "CV013", "CV015", "CV016"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Side", "Argument", "Evidence", "What would change the view"]
    rows:
      - ["Thesis", "Durable media-rights demand", "SportsPro reports a five-year US/UK DAZN extension with more than 30 shows per year.", "Signed economics, termination rights, and cash receipts would establish value rather than duration alone."]
      - ["Thesis", "Diversified owned-event and programming footprint", "Company pages report 12 sports, 650 event days, 2,500 annual programming hours, and a history of event ownership.", "Audited segment margins and rights ownership would show which activities create cash value."]
      - ["Thesis", "Current talent retention", "NY Fights via Yahoo and Matchroom both report a Jaron Ennis extension or multi-fight deal.", "Roster economics and renewal success across all marquee talent would test repeatability."]
      - ["Anti-thesis", "Distribution and talent are contestable", "DAZN also partners with rival promoters, and Sky Sports historically reported a Matchroom boxer contract non-renewal.", "Low partner concentration, durable exclusivity, and evidence of economical roster replacement would reduce this risk."]
      - ["Anti-thesis", "Key-person and transferability risk", "Forbes attributes Matchroom's boxing expansion to Eddie Hearn, while public evidence does not disclose succession protections.", "A documented succession plan, delegated commercial authority, and key-person coverage would improve transferability."]
    notes: "Company-reported scale is not treated as audited financial performance; the Sky Sports example is historical and illustrates contract churn rather than a current portfolio-wide rate."
    claimRefs: ["CV003", "CV005", "CV007", "CV008", "CV009", "CV010", "CV017"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Explicit assumptions", "Valuation / return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "The DAZN extension converts to profitable event volume; portfolio diversification produces repeatable cash flow; marquee talent renewals continue.", "A premium could be justified only from audited growth, margins, free cash flow, and durable rights economics; no range is supportable yet.", "Execution cost, partner concentration, and talent economics absorb the contracted scale.", "Unassigned: the evidence shows activity and duration, not scenario frequency or cash conversion."]
      - ["Base", "Rights relationships remain stable, the roster is replenished, and event economics are steady without major multiple expansion.", "Value should be anchored to normalized free cash flow and comparable sports-promotion transactions after net debt; both are missing.", "Flat economics, minority illiquidity, governance limits, and key-person dependence.", "Unassigned: audited historical results and cap-table terms are required."]
      - ["Bear", "A major rights relationship weakens, talent replacement becomes more expensive, event margins compress, or minority terms restrict liquidity.", "Downside must be tested against contracted cash flows, fixed commitments, working capital, debt, and preference seniority; no floor can be calculated.", "Non-renewal, negative cash conversion, adverse preferences, or no credible exit path.", "Unassigned: contract liabilities and balance-sheet evidence are unavailable."]
    notes: "Scenario labels are qualitative decision frameworks, not forecasts; ranges and probabilities are deliberately left unquantified because the assigned sources lack the required financial and transaction inputs."
    claimRefs: ["CV003", "CV005", "CV010", "CV017", "CV013", "CV014", "CV016"]
