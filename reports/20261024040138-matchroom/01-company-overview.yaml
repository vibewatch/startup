company:
  name: Matchroom
chapter:
  number: 1
  title: Company Overview
  summary: Matchroom is a privately held, Hearn-family-controlled sports promotion and rights group formed in 1982. Its operating model combines ownership and promotion of live events with globally distributed programming, while 2026 strategic capital and broadcast extensions support expansion but leave private-company financial disclosure limited.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: Matchroom Sport was formed in Romford, Essex, in 1982 after Barry Hearn's work in snooker management, then expanded into boxing, television production and a broader portfolio of sports. The company describes its model as owning, producing and promoting sporting events, monetising through broadcaster relationships, sponsorship, ticketed events and associated rights. Its current official site lists 12 sports, 650 event days and 2,500 hours of original programming annually, while the 2026 company announcement describes more than 600 event days and 2,400 hours distributed across broadcast and streaming platforms. The difference is a disclosed snapshot difference, not a reconciled growth series.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-control
    title: Leadership, governance and key-person dependence
    body: Control remains concentrated with the Hearn family. Matchroom's official leadership material identifies Barry Hearn as President and Eddie Hearn as Chairman, with Barry moving to an advisory President role in April 2021 as Eddie became Chairman. The same source identifies Steve Dawson as Chief Operating Officer and Group Finance Director, Katie McCabe as Director of Programming and CEO of Matchroom Media, Matthew Porter as PDC Chief Executive, and Frank Smith as Matchroom Boxing CEO and a parent-company board member. Bruin Capital joined the board after taking a minority interest in 2026, but the company said the Hearn family retained majority ownership. This creates functional coverage beyond the founders, while Eddie and Barry remain material relationship and brand dependencies.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: capital-partners-and-disclosure
    title: Capital, partners and disclosure limits
    body: Matchroom's capital history is best evidenced through strategic minority investments rather than a disclosed venture-round schedule. The 2024 Pitch International announcement says Pitch would acquire a minority stake while the Hearn family retained majority control; its financial terms are not stated in the retained text. In May 2026, Matchroom announced Bruin Capital had agreed to take a minority equity interest, join the board and support expansion, particularly in the United States, again without disclosing terms. Wikipedia reports a 15% Bruin stake at a valuation above £1 billion, but that figure is secondary and should not be treated as audited. Public materials do not establish revenue, EBITDA, free cash flow, total capital raised or current headcount, so those cover metrics remain diligence gaps.
    claimRefs: [CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
callouts:
  - calloutType: strength
    title: Durable multi-sport platform
    body: More than four decades of event promotion, recurring broadcaster relationships and a portfolio spanning boxing, darts, snooker, pool and other sports provide breadth across rights and live-event formats.
    claimRefs: [CO002, CO003, CO004]
  - calloutType: risk
    title: Founder and rights concentration
    body: Majority family control and the public prominence of Eddie and Barry Hearn support continuity but leave key-person, succession and contract-duration questions that public materials do not resolve.
    claimRefs: [CO005, CO006, CO016]
