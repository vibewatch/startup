slug: matchroom
runDate: 2026-10-24
company:
  name: Matchroom
chapter:
  number: 4
  title: Financials
  summary: Matchroom's latest filed group accounts show substantial turnover and profit, but the public record does not provide a complete underwriting view of recurring revenue, cash generation, or realized event economics.
sections:
  - id: revenue-engine
    title: Revenue engine and monetization
    body: Matchroom operates a rights-and-events model rather than a conventional recurring-revenue software business. Spark Intel describes the business as staging sports events and selling them as television programming, with revenue from broadcast rights, ticket sales, and sponsorship. Matchroom's own materials describe ownership, production, and promotion of events, while its 2024 Pitch International announcement says the strategic partnership targets international media rights, global events, and sports sponsorships. The commercial model therefore converts event rights, audience reach, and sponsor inventory into revenue, but the public sources do not disclose the realized split among rights, tickets, sponsorship, merchandising, or licensing. That lack of mix detail limits assessment of revenue durability and concentration.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: reported-performance
    title: Reported performance and cost structure
    body: Spark Intel's summary of Companies House group accounts reports £225m of turnover for the year to June 2025, up from £218m, alongside £55m of pre-tax profit versus £52m in the prior year. It also reports £14m of staff costs, 142 employees, £22m at the bank, £33m of net assets, and £33m of dividends paid. These are reported group-account figures rather than an independently audited operating model presented in the public source. The implied pre-tax margin is about 24.4% (£55m divided by £225m), an analyst calculation that should not be mistaken for disclosed gross margin or free cash flow. The drop in reported bank and cash from £38m to £22m, together with the dividend, makes cash conversion and distribution policy important diligence questions.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting gaps
    body: >
      Public evidence indicates meaningful commercial scale but leaves several financing inputs unavailable. The Spark Intel account summary gives a point-in-time bank-and-cash figure and net assets, not runway, undrawn facilities, covenant headroom, capex, working capital, or free cash flow. The company-issued Pitch announcement confirms a significant investment and minority stake sale to Pitch International while the Hearn family retained majority control, but it does not disclose transaction value, proceeds to Matchroom, or intended use of funds. SportsPro reports a five-year DAZN extension for Matchroom Boxing and rights through 2031 for PDC events in Germany, Austria, and Switzerland; these relationships support distribution visibility but do not disclose Matchroom's realized economics. Matchroom Boxing also promotes a Fight Pass membership, but the fetched page does not state a price. A further risk is sponsor substitution: SBC News reports Matchroom's statement that gambling-law changes may affect betting-sector event sponsorship and that directors were working to diversify sponsors. The public record is therefore sufficient to establish scale and identifiable commercial dependencies, but insufficient for a reliable runway, margin, or next-round trigger.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI004]
  - id: underwriting-verdict
    title: Financial verdict
    body: Matchroom presents as a profitable, cash-generative-looking sports-rights platform on the limited figures available, but the evidence is not sufficient to underwrite that conclusion as recurring or durable. Reported turnover and pre-tax profit are strong headline indicators, yet the sources do not separate event-level economics, rights advances, promoter obligations, prize money, production costs, working capital swings, or cash conversion. DAZN and other broadcast relationships can improve reach and scheduling visibility, while the Pitch partnership may add distribution and capital, but both are relationship evidence rather than proof of realized margin or liquidity. Betting-sponsor exposure is a concrete adverse consideration because the company itself identified regulatory change as a potential commercial impact. Talent agreements can also expire without renewal, and current independent coverage characterizes boxing as retaining box-office appeal even while broader popularity wanes; neither observation quantifies Matchroom's exposure, but both reinforce event and roster volatility. Before underwriting, an investor should obtain audited segment-level revenue and EBITDA, cash-flow statements, event P&Ls, rights and sponsorship contracts, debt and security schedules, transaction proceeds, and a forward liquidity plan.
    claimRefs: [CI005, CI010, CI012, CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit or driver, Current value or status, Quality, Diligence ask]
    rows:
      - ["Broadcast rights", "Sell event programming to television and streaming partners", "Rights contract and event slate", "Publicly described; realized revenue undisclosed", "Company description / third-party summary", "Obtain contract-level revenue and renewal terms"]
      - ["Tickets and live events", "Stage promoted sporting events", "Attendance and ticket price", "Publicly described; mix undisclosed", "Company description / third-party summary", "Obtain event-level ticket revenue and costs"]
      - ["Sponsorship", "Sell event and portfolio sponsor inventory", "Sponsor contracts and audience reach", "Publicly described; betting exposure flagged", "Mixed company and independent reporting", "Obtain sponsor concentration and termination provisions"]
      - ["Strategic investment", "Minority investment by Pitch International", "Transaction proceeds", "Significant investment; amount undisclosed", "Company-issued announcement", "Obtain consideration, proceeds, and use of funds"]
    notes: "Streams are qualitative where sources do not disclose realized mix; broadcast, ticket, and sponsorship mechanisms are described by Spark Intel, while the strategic investment is described by Matchroom Boxing."
    claimRefs: [CI001, CI002, CI003, CI004, CI010, CI011]
  - id: TI003
    title: Reported group-account indicators
    columns: [Metric, June 2025, June 2024, Interpretation, Diligence ask]
    rows:
      - [Turnover, "£225m", "£218m", "Filed group-account turnover; approximately 3.3% year-over-year increase", "Reconcile to consolidated statements and segment mix"]
      - [Pre-tax profit, "£55m", "£52m", "Filed group-account profit; not EBITDA or free cash flow", "Obtain EBITDA bridge and cash-flow statement"]
      - [Employees, 142, 136, "Reported employee count", "Reconcile group and contractor headcount"]
      - [Staff costs, "£14m", "£13m", "Reported staff-cost line", "Obtain full operating-cost categories"]
      - [Bank and cash, "£22m", "£38m", "Reported point-in-time balance; declined year over year", "Obtain liquidity schedule and restricted-cash detail"]
      - [Net assets, "£33m", "£25m", "Reported balance-sheet measure", "Obtain balance-sheet composition and asset quality"]
      - [Dividends paid, "£33m", "£24m", "Reported distributions; cash impact needs reconciliation", "Obtain dividend policy and post-dividend liquidity plan"]
    notes: "Figures are rounded summaries of Matchroom Sport Limited group accounts as presented by Spark Intel; they are not a substitute for reviewing the filed accounts."
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
  - id: TI004
    title: Unit economics and underwriting gaps
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue mix by rights / tickets / sponsorship, null, low, "Determines concentration and recurring versus event-driven quality", "Obtain segment revenue schedule"]
      - [Gross margin by event or division, null, low, "Shows economics after rights, talent, production, and prize costs", "Obtain event-level P&Ls"]
      - [Free cash flow and cash conversion, null, low, "Profit does not establish liquidity or cash generation", "Obtain audited cash-flow statement and working-capital bridge"]
      - [CAC or sales payback, null, low, "Traditional CAC is not disclosed and may not fit this rights-led model", "Provide sponsor and broadcaster acquisition economics"]
      - [Customer / partner concentration, null, low, "Large rights partners can create renewal and bargaining risk", "Obtain top-partner revenue shares and expiry schedule"]
      - [Runway and next financing trigger, null, low, "Cash balance alone does not establish runway", "Provide budget, debt schedule, covenants, and financing plan"]
    notes: "Null values are unavailable public evidence, not zero; each row states the specific request needed to close the gap."
    claimRefs: [CI005, CI008, CI009, CI012, CI013, CI014]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Matchroom converts owned or promoted sporting events into broadcast, ticket, and sponsorship monetization, with a strategic investment potentially expanding rights and event capacity.
    data:
      nodes:
        - id: events
          label: Owned or promoted sporting events
          detail: Boxing, darts, snooker, pool, golf, and other event properties.
        - id: inventory
          label: Rights, tickets, and sponsor inventory
          detail: Commercial assets described by public company and editorial sources.
        - id: monetization
          label: Broadcasters, audiences, and sponsors
          detail: Broadcast rights, live attendance, and sponsorship relationships.
        - id: capital
          label: Strategic investment and distribution
          detail: Pitch International minority investment and media-rights collaboration.
        - id: rights
          label: Broadcast and sponsorship contracts
          detail: Rights extensions and sponsor agreements determine monetization visibility.
        - id: profit
          label: Profit and cash outcomes
          detail: Public sources do not disclose the bridge from revenue to cash.
      edges:
        - [events, inventory]
        - [inventory, monetization]
        - [capital, inventory]
        - [monetization, profit]
    approximationNotes: "The flow describes the public revenue mechanism; it does not quantify conversion, margins, or cash proceeds."
    claimRefs: [CI001, CI002, CI003, CI010, CI011, CI012]

callouts:
  - calloutType: strength
    title: Strong reported scale
    body: Filed group-account summaries show £225m of turnover and £55m of pre-tax profit for the year to June 2025, but the public evidence does not establish the quality of those earnings.
    claimRefs: [CI005, CI006]
  - calloutType: risk
    title: Cash and sponsor dependency
    body: Reported bank and cash fell from £38m to £22m while dividends rose to £33m, and the company identified potential betting-sponsorship disruption from gambling-law change.
    claimRefs: [CI008, CI009, CI014]
  - calloutType: recommendation
    title: Request event-level underwriting data
    body: The next diligence step is to obtain segment and event-level revenue, margin, cash conversion, partner concentration, and liquidity schedules before relying on headline profit.
    claimRefs: [CI005, CI008, CI010, CI014]

