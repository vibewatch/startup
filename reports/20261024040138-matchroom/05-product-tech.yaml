    notes: The table separates documented operating activity from unavailable audience, conversion, margin and ownership metrics; annual figures are not treated as revenue or profit.
    claimRefs: [CE003, CE004, CE006, CE008]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Rights and property layer", "Own or promote sports properties and event formats", "Athlete, federation and rights contracts", "Expiry, exclusivity and renewal risk"]
      - ["Event and talent layer", "Assemble athletes, venues, schedules and live competitions", "Talent availability and venue execution", "Cancellation, roster turnover and replacement cost"]
      - ["Production layer", "Convert events into live and original programming", "Production teams, equipment and suppliers", "Cost overruns, resilience and quality-control opacity"]
      - ["Distribution layer", "Deliver content through broadcasters and streaming platforms", "DAZN, Foxtel, Kayo and other rights buyers", "Counterparty strategy, geography and platform dependency"]
    notes: This is an evidence-bounded operating model inferred from described activities; no source discloses Matchroom's internal software stack, cybersecurity controls or service-level metrics.
    claimRefs: [CE005, CE006, CE007, CE009, CE013, CE014]
