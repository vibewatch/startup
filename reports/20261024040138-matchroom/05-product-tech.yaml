    rows:
      - ["Watch live boxing", "Discover and access fights through a broadcaster or streamer", "Matchroom promotes events and licenses a recurring schedule to DAZN", "More than 30 Matchroom Boxing shows per year are scheduled under the renewed deal", "Audience and retention outcomes are undisclosed"]
      - ["Distribute premium sports content", "Fill a multi-market programming slate", "Matchroom supplies live events and original content to DAZN and Australian platforms", "Seven major Australian events are planned for 2026", "Partner reach is not equivalent to Matchroom-owned distribution"]
      - ["Grow a sports property", "Build events, talent and media exposure over time", "Matchroom combines promotion, rights and production across properties", "Corporate sources report more than 600 event days and over 2,400 programming hours annually", "Figures are company-issued and not independently audited"]
