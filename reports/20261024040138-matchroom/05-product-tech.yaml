company:
  name: Matchroom
chapter:
  number: 5
  title: Product & Technology
  summary: "Matchroom's product is a rights-and-events operating system rather than a standalone software product: it owns or promotes sports properties, packages live events and original programming, and distributes them through broadcast and streaming partners. Public evidence supports meaningful scale, a direct Fight Pass membership surface and durable distribution relationships, but does not disclose a conventional software architecture, reliability metrics, security controls, or a developer ecosystem."
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: Matchroom delivers sports entertainment through a repeatable workflow that starts with acquiring or developing a sports property, assembling talent and event formats, staging live competitions, producing broadcast-ready programming, and licensing distribution to media partners. Its public boxing surface presents an active event calendar and a Matchroom Fight Pass membership offer, while its corporate history describes a broader portfolio spanning snooker, boxing, pool, fishing, bowling, golf, darts and other events. The customer-facing product is therefore a combination of live event access, media rights inventory, original programming and fan experiences rather than a single application. The clearest current distribution proof is the renewed five-year Matchroom Boxing relationship with DAZN in the United States and United Kingdom, with more than 30 shows per year and seven 2026 events on Foxtel and Kayo Sports in Australia. Independent BBC and Guardian boxing hubs also show that fan discovery spans news, audio, video and feature formats outside Matchroom-controlled channels. This supports a scaled content-delivery model, but not a claim about realized audience, conversion or unit economics.
    claimRefs: [CE001, CE002, CE003, CE004, CE015, CE016]
    tableRefs: [TE001, TE002]
  - id: operating-architecture-and-maturity
    title: Operating architecture and maturity
    body: The operating architecture is a layered rights, production and distribution system. Matchroom's history says Matchroom Sport TV began trading in 1990 as the business moved toward event ownership, promotion and television. Its current corporate homepage lists 2,500 hours of original programming per year and 20,000 hours of available programming. The newer Pitch International alliance adds media-rights, event and sponsorship capability across Matchroom Boxing, the Professional Darts Corporation, World Snooker and Matchroom MultiSport; the 2024 announcement says Matchroom promoted more than 600 event days and over 2,400 hours of original programming per year. These are company-issued scale claims from different vintages and should not be treated as independently audited throughput. The public record does show operational maturity in rights ownership and repeat event production, including a PDC media-rights extension through 2031 in Germany, Austria and Switzerland. It does not reveal software components, data pipelines, production vendors, service-level objectives or internal controls.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: dependencies-trust-and-diligence
    title: Dependencies, reliability and technical diligence
    body: "Matchroom's delivery depends on external distribution platforms, rights counterparties, venues, athletes and event execution. DAZN describes production quality, audience reach and global capability as reasons for the renewed partnership, while the independent SportsPro account identifies the geographic scope, annual show cadence and the expansion of PDC coverage. This is evidence of a distribution relationship, not proof that Matchroom controls the end-to-end viewing stack. Portfolio breadth also creates dependency concentration: a prominent boxing roster and media partners are valuable assets, but a contract can expire, a fighter can leave, or a broadcaster can change strategy. Sky Sports' report that Matchroom did not renew Josh Warrington's contract demonstrates that roster composition changes in practice. Public sources reviewed did not establish uptime, incident history, cybersecurity certification, privacy controls, disaster recovery, production redundancy, or a public developer signal. Those gaps should remain explicit before underwriting technical defensibility or operational resilience."
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014]
    calloutType: risk
