callouts:
  - calloutType: insight
    title: Durable content engine, opaque technical layer
    body: Public evidence supports a mature event-and-rights engine with recurring production and distribution, but it does not support a software moat, security certification or reliability claim.
    claimRefs: [CE005, CE006, CE013, CE014]
  - calloutType: assumption
    title: Treat distribution reach as partner-enabled
    body: DAZN, Foxtel and Kayo expand access, but Matchroom's own audience ownership, platform economics and first-party data control require diligence.
    claimRefs: [CE003, CE004, CE009]
