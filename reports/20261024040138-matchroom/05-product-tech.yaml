  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: trust-and-safety
      missingEvidence: Security, privacy, incident-response, disaster-recovery and production-redundancy documentation for Matchroom's event and digital operations.
      whyItMatters: A rights-and-events business can lose audience, partner trust and sponsor value through a failed live delivery or data incident, yet the assigned public sources do not quantify this exposure.
      diligencePath: Request current security policies, penetration-test summaries, incident log, continuity plan, production architecture and supplier-control schedule from management.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public or private evidence of software systems, developer activity, data assets, technical integrations and ownership of first-party audience data.
      whyItMatters: The available evidence supports content and rights execution but cannot establish software defensibility or proprietary technology as an investment moat.
      diligencePath: Request a product and technology inventory, system diagram, integration list, data-ownership map and engineering/vendor staffing evidence.
    - type: private-evidence-only
      severity: material
      topic: differentiation
      missingEvidence: Property-level rights terms, renewal dates, exclusivity, audience outcomes and distribution economics.
      whyItMatters: The durable value of the operating model depends on rights durability and partner economics rather than event counts alone.
      diligencePath: Obtain material broadcaster, streaming, federation, venue and talent contracts with revenue-share, minimum-guarantee and termination schedules.
      relatedQuestionRefs: [QE005, QE006]
