  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture
      missingEvidence: A current parent-level architecture or product/API inventory tying Xingyun, LinkieBuy, Polibeli, logistics, and commerce systems together.
      whyItMatters: Without a system inventory, investors cannot distinguish shared platform capability from a portfolio of operationally separate products.
      diligencePath: Request a current architecture diagram, product ownership map, integration catalog, and data-flow inventory from management.
      relatedQuestionRefs: [QE003]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Security, privacy, quality, incident, and service-level evidence for customer-facing systems and cross-border data flows.
      whyItMatters: The product crosses payments, customs, logistics, customer data, and multiple jurisdictions, so control failures could impair market access and reliability.
      diligencePath: Request SOC/ISO certificates if any, penetration-test summaries, incident register, uptime/SLA history, privacy policies, and business-continuity tests.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: Public repository, API documentation, package activity, or practitioner-community evidence attributable to Xingyun's core platform.
      whyItMatters: The App Market listing evidences a partner-facing product surface but not the maturity or maintainability of the parent platform.
      diligencePath: Ask for API documentation, release history, developer metrics, and a technical reference customer or integration partner.
      relatedQuestionRefs: [QE004, QE005, QE007, QE008]
