  topStrengths:
    - Broad cross-border supply-chain, logistics, warehouse, and commerce-service footprint.
    - Historical financing record and brand, retailer, and ecosystem relationships provide operating optionality.
    - >-
      Multiple service lines and overseas capabilities can support differentiated cross-border execution if controls and
      unit economics are proven.
  topRisks:
    - Parent-level revenue quality, margins, cash, debt, and customer concentration are not publicly disclosed.
    - Governance, control-rights, and regulatory outcomes around the related listed entity remain unresolved.
    - Cross-border customs, product-safety, platform, data, and geopolitical obligations create material execution risk.
  unresolvedGaps:
    - >-
      No consolidated parent audit or lender-style information package discloses group revenue, EBITDA, debt, cash, or
      segment mix.
    - >-
      The July 2025 valuation mark appears in secondary databases, but no clearly documented primary financing round or
      transaction terms were found.
    - >-
      The exact ownership percentage and economic rights Xingyun still holds in Polibeli after the de-SPAC listing
      remain inconsistently disclosed.
    - >-
      Customer concentration, retention, and cohort economics for key brand and retailer segments are not publicly
      reported.
    - >-
      The operational and legal consequences of the CSRC cases, share freezes, and the 行云科技 control dispute are still
      evolving.
