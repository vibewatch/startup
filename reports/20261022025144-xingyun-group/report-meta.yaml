summary:
  headline: >-
    Xingyun Group has meaningful cross-border infrastructure and historical financing scale, but opaque parent
    financials, unresolved governance linkage, and high compliance exposure keep the investment view at research-more
    rather than buy.
  overallScore: 4.6
