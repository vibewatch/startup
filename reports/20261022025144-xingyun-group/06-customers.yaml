schemaVersion: "report-v2"
artifact: customers
slug: xingyun-group
runDate: 2026-10-22
company:
  name: Xingyun Group (行云集团)
chapter:
  number: 6
  title: Customers
  summary: >-
    Xingyun presents a two-sided customer model spanning international brands,
    retailers, and cross-border commerce operators, with LinkieBuy providing the
    clearest named-customer evidence. Public materials support relationship breadth
    and a broad operating workflow, but do not independently establish active usage,
    production deployment, retention, customer outcomes, or concentration.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      The evidence indicates that Xingyun addresses several related customer groups
      rather than one homogeneous buyer. The group's official page markets brand
      internationalization, positioning, strategy, promotion, and overseas operating
      support. LinkieBuy's company-issued release is more specific: it describes
      digital-operation services for global brands and retailers entering China,
      spanning a SaaS mall, payment and API integration, agency operations, marketing,
      CRM, private-domain repurchase, warehousing, logistics, store delivery, and
      member management. Brands and retailers therefore appear to be the economic
      buyers, while commercial, marketing, e-commerce, and store teams are users and
      logistics operations are delivery dependencies. Public evidence does not
      disclose payer-by-entity, contract value, segment revenue, account counts, or
      the share of customers using multiple services.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption signals and durability
    body: >-
      Customer proof is strongest at the relationship and capability level, not at
      the recurring-usage level. LinkieBuy states that it had cooperation with more
      than 100 well-known brands and names Yohji Yamamoto, BIGC, CATALO, Swisse, and
      TheNose Fuji. It also reports a service team of more than 100 people and a focus
      on Japan, Thailand, Southeast Asia, and Europe. Those are company-issued breadth
      signals, but the release does not say whether each named relationship was paid,
      active, production, pilot, exclusive, or still current. Latka supplies broad
      company-level revenue and headcount fields but labels its revenue source as
      unrecorded and does not provide customer retention or concentration evidence.
      Sector-wide customer totals reported by CGTN likewise cannot be attributed to
      Xingyun. No NRR, GRR, churn, renewal, cohort, contract-length, satisfaction, or
      customer-level outcome metric is established by the assigned sources.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU015]
    tableRefs: [TU002, TU003]
  - id: expansion-concentration-and-friction
    title: Expansion, concentration, and market-access friction
    body: >-
      The described workflow creates a plausible land-and-expand path: a brand or
      retailer could combine market entry and digital storefront services with
      marketing, CRM, warehousing, logistics, store delivery, and member management.
      The evidence does not show that any named customer buys this full stack, nor
      does it disclose top-customer share, module attach rate, procurement cycle,
      customer-level margin, failed pilots, or reasons for churn. Independent 2026
      reporting on Indonesia describes seller complaints about administrative and
      logistics fees and a planned rule revision focused on local products, consumer
      protection, and marketplace obligations. China-focused policy analysis also
      describes tighter platform responsibility and compliance as market-access
      issues. These are operating frictions for cross-border customers, not proof of
      Xingyun-specific churn. An adverse article about the separately identified
      listed company 行云科技 (300209.SZ) does not name Xingyun Group or LinkieBuy, so
      no customer or governance link should be inferred without entity-level proof.
    claimRefs: [CU011, CU012, CU013, CU014, CU016]
    figureRefs: [FU001]
