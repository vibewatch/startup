    columns: [Metric or signal, Value, Date or period, Source posture, Implication, Missing denominator]
    rows:
      - ["Reported brand cooperation", "More than 100 well-known brands", "2023-10-31 company release", "company-issued", "Indicates reported relationship breadth", "Active, paid, and retained relationships"]
      - ["Named market focus", "Japan, Thailand, Southeast Asia, and Europe", "2023-10-31 company release", "company-issued", "Indicates a multi-market service ambition", "Revenue, customers, and activity by market"]
      - ["Reported operating team", "More than 100 people", "2023-10-31 company release", "company-issued", "Indicates a dedicated service organization", "Accounts per employee, utilization, and service economics"]
      - ["Retention and expansion KPIs", null, "As of 2026-10-22 review", "evidence gap", "Public sources do not establish NRR, GRR, churn, renewal, or cohorts", "Customer-level numerator, denominator, and time period"]
    notes: These are heterogeneous company-reported signals, not a comparable time series. Null means the assigned successful sources did not establish the metric; no growth or retention rate is inferred.
    claimRefs: [CU005, CU007, CU008, CU009, CU010, CU015]
  - id: TU003
    title: Named customer proof table
    columns: [Named customer, Segment, Reported relationship, Production versus pilot, Outcome, Limitation]
    rows:
      - ["Yohji Yamamoto", "International brand", "Named among LinkieBuy cooperation relationships", "Not disclosed", "No customer outcome disclosed", "Supported only by a company-issued release"]
      - ["BIGC", "Retailer", "Named among LinkieBuy cooperation relationships", "Not disclosed", "No customer outcome disclosed", "Commercial scope and current status are undisclosed"]
      - ["Swisse", "International brand", "Named among LinkieBuy cooperation relationships", "Not disclosed", "No customer outcome disclosed", "Independent customer confirmation is unavailable"]
      - ["TheNose Fuji", "International brand", "Named among LinkieBuy cooperation relationships", "Not disclosed", "No customer outcome disclosed", "Retention and deployment scope are undisclosed"]
    notes: Enumeration is partial and limited to names in one company-issued release; the official Xingyun page corroborates the customer-service category but not these individual relationships.
    enumerationScope:
      coverage: partial
      basis: Named relationships explicitly listed in the LinkieBuy release reviewed for this 2026-10-22 customer chapter.
    claimRefs: [CU001, CU004, CU005, CU006, CU010]
figures:
  - id: FU001
    title: Customer journey and expansion surfaces
    type: journey-map
    summary: The reported customer path spans market entry through digital and physical operations, while evidence gaps prevent measurement of conversion, expansion, and renewal.
    data:
      nodes:
        - id: market-entry
          label: Market entry
          touchpoints: ["Brand positioning", "market strategy", "overseas brand operation"]
          note: Reported service surface; customer conversion and fees are undisclosed.
        - id: digital-storefront
          label: Digital storefront
          touchpoints: ["SaaS mall", "payment", "API integration"]
          note: LinkieBuy describes the modules; named-customer adoption is not verified.
        - id: demand-generation
          label: Demand generation
          touchpoints: ["Agency operation", "marketing", "customer acquisition", "CRM"]
          note: Customer-level outcomes and acquisition economics are not disclosed.
        - id: channel-and-store
          label: Channel and store
          touchpoints: ["Online and offline scenarios", "delivery to stores", "store member management"]
          note: The release describes the workflow but not production deployments.
        - id: fulfillment
          label: Fulfillment
          touchpoints: ["Warehousing", "logistics supply chain", "delivery"]
          note: Service levels, utilization, and margins are unavailable.
        - id: repurchase-and-renewal
          label: Repurchase and renewal
          touchpoints: ["Private-domain operation", "repurchase", "renewal review"]
          note: No retention, renewal, repeat-purchase, or cohort rate is disclosed.
    approximationNotes: The sequence is an analytical customer journey assembled from reported service modules; it does not represent measured conversion or verified use by every customer.
    claimRefs: [CU001, CU002, CU003, CU009, CU011]
callouts:
  - calloutType: strength
    title: Broad workflow coverage
    body: LinkieBuy describes a service path connecting digital commerce, marketing, CRM, physical distribution, and store operations, creating a plausible basis for multi-service customer relationships.
    claimRefs: [CU002, CU003]
  - calloutType: risk
    title: Relationship breadth is not retention proof
    body: The assigned evidence names more than 100 brand relationships but does not establish active use, production status, renewal, customer outcomes, or concentration.
    claimRefs: [CU005, CU009, CU010, CU011]
  - calloutType: assumption
    title: Country-level diligence is required
    body: Indonesia's proposed rule revision and broader platform-governance changes may alter fees, seller protections, and compliance obligations; exposure must be mapped to Xingyun's actual customer and service footprint.
    claimRefs: [CU012, CU013, CU016]
