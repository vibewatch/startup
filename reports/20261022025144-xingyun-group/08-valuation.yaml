  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Global infrastructure optionality", "Group describes operations across 72 countries and one region.", "Verified segment revenue, gross margin, retention, and cash conversion."]
      - ["Listed overseas asset may create a reference mark", "Coverage reports Polibeli listed at $10 per share and later at $11.67.", "Primary merger terms, current cap table, lockups, and parent's economic rights."]
      - ["Digital supply-chain capability is tangible", "Technology subsidiary describes supply-chain, marketing, warehousing, logistics, and finance services.", "Independent customer outcomes and audited segment economics."]
      - ["Price discovery is weak", "No assigned source provides a consolidated parent valuation bridge or audited group earnings.", "Audited statements, debt, preference stack, and a recent primary transaction."]
      - ["Cross-border growth has policy upside", "WTO and WEF describe expanding digital-trade rules and support for cross-border e-commerce.", "Evidence that Xingyun captures durable margin after tariffs, compliance, and working capital."]
      - ["Downside is exposed to platform and regulatory friction", "European Parliament highlights product safety, customs, and platform-oversight concerns.", "Country-level compliance controls, incident record, and quantified remediation costs."]
    notes: "The evidence column distinguishes company description, market reporting, and institutional policy context; it is not a comparable-company valuation set."
    claimRefs: [CV001, CV002, CV003, CV004, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Polibeli remains liquid; parent ownership is substantial and documented; domestic segments show positive cash conversion.", "A verified listed-asset value plus profitable operating segments could support a premium to opaque private peers; target return remains unquantified.", "Low-to-medium: requires several unverified conditions.", "Ownership or liquidity is materially below the public headline assumption."]
      - [Base, "Operating capability persists, but parent financials, ownership, and preference terms remain incomplete.", "Use no precise multiple; maintain research-more or track until a verified valuation bridge exists.", "Medium: consistent with current evidence quality.", "No lender-quality package or primary transaction disclosure after diligence."]
      - [Bear, "Polibeli de-rates or dilutes; group cash conversion is weak; cross-border compliance costs rise.", "Headline subsidiary value fails to protect parent equity; downside cannot be bounded from assigned evidence.", "Medium-to-high: several identified risks are unresolved.", "Down-round, ownership dispute, adverse enforcement, or material liquidity impairment."]
    notes: "Scenarios are qualitative because assigned sources do not disclose parent revenue, EBITDA, debt, cash, preference stack, or a verified current ownership percentage."
    claimRefs: [CV005, CV006, CV007, CV008, CV009, CV010, CV015]
