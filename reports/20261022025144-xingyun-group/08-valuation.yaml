company:
  name: Xingyun Group (行云集团)
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports a real cross-border supply-chain platform and a potentially valuable Polibeli listing, but it does not establish a consolidated parent valuation, audited group earnings, or the economic rights retained after the spin-out. The appropriate stance is research-more: preserve upside optionality while requiring primary financing, ownership, cash-flow, and preference data before underwriting price."
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Xingyun's investable proposition is infrastructure optionality rather than a verified
      software multiple. The group's technology subsidiary describes a combined supply-chain,
      marketing, warehousing, logistics, and finance service stack, while the group site says it
      links operations across 72 countries and one region. Polibeli's public-market profile adds
      a possible external mark for the overseas business: contemporaneous Chinese coverage reports
      an August 2025 Nasdaq listing at $10 per share and a subsequent market capitalization above
      RMB30 billion. Those facts support a thesis that the group has built operating assets that
      can be separated and financed. They do not prove that the parent owns a fixed percentage of
      Polibeli today, that the public mark is transferable to the parent, or that reported platform
      scale converts into recurring, cash-generative earnings. The anti-thesis is therefore
      valuation opacity: a private parent with no consolidated audited revenue, EBITDA, net debt,
      dilution, liquidation preference, or segment bridge in the assigned evidence cannot be
      valued responsibly from a headline market capitalization alone.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: scenarios-and-entry-discipline
    title: Scenarios and entry discipline
    body: >-
      The scenario framework should treat the Polibeli quotation as an uncertain reference point,
      not as Xingyun's equity value. The bull case requires the listed overseas platform to
      maintain liquidity, expand distribution and logistics economics, and leave the parent with
      meaningful, documented economic ownership; it also requires the domestic technology and
      supply-chain businesses to show segment-level gross profit and cash conversion. The base case
      assumes operating capability persists but public-market value is volatile and the parent
      remains difficult to underwrite, supporting a track or research-more decision rather than a
      buy. The bear case is a de-rating, dilution, weak monetization, or inability to verify
      ownership and cash flows; in that case the public mark provides little downside protection.
      Entry discipline should therefore be based on a verified cap table, primary transaction
      documents, audited or lender-quality financials, and an explicit discount for illiquidity and
      governance complexity. No assigned source supplies a defensible target return or price.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: market-and-diligence
    title: Market context, exit readiness, and diligence
    body: >-
      External policy evidence is directionally supportive but not a substitute for company
      performance. The WTO reports an interim pathway for 66 members covering approximately 70% of
      global trade to implement baseline digital-trade rules, while the World Economic Forum
      describes China's 2026-2030 plan as supporting cross-border e-commerce, digital trade, and
      overseas partnerships. Conversely, the European Parliament records concerns about product
      safety, customs fees, platform oversight, and the surge of parcels from China into Europe.
      These conditions create both addressable demand and execution, compliance, and margin risks
      for a cross-border intermediary. Exit readiness is therefore conditional: a listed
      subsidiary may improve financing optionality, but parent-level exit value still depends on
      clean ownership, audited consolidation, transfer pricing, related-party disclosures, and
      evidence that the operating model earns returns after working capital and compliance costs.
      The immediate diligence ask is a reconciled valuation bridge from the last primary round or
      transaction to current ownership, plus segment financials and preference terms.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
    figureRefs: [FV001]
