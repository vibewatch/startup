              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR011
              - CR013
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific adverse evidence concerns Xingyun Technology, the A-share subsidiary
              identified by the group as SZ.300209. A March 2026 report says the Hunan regulator investigated the new
              and former controllers and proposed warnings, correction orders, and fines after agreements and
              undertakings signed during restructuring were not disclosed. The same report says the controlling parties'
              shares were subject to successive freezes and that the 2025 forecast called for a net loss. The parent
              site presents the listed company as controlled by the group, so this is relevant to governance and
              reputational risk even though the company said the notice related to shareholders rather than operations.
              The case is not proof of parent-level liability; it is a thesis-break indicator for disclosure controls
              and control-rights execution.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, partner, and cross-border dependencies
        blocks:
          - type: paragraph
            body: >-
              Xingyun describes an integrated model spanning brand services, export fulfillment, cross-border logistics,
              warehousing, financing support, and overseas channels. That breadth creates multiple hand-offs where
              service quality, counterparty performance, customs classification, inventory, and working capital can fail
              together. The official site claims coverage of 72 countries and one region, while the group page describes
              overseas brand, retailer, warehouse, and bank relationships without disclosing counterparty concentration
              or service-level outcomes. External policy commentary describes a cross-border environment with stronger
              platform responsibilities, supervision, rule alignment, and product-safety expectations. A specialist
              trade guide describes formal-entry, broker, classification, duty, and inventory-carrying requirements
              after de minimis changes, but its unsupported or promotional elements should be treated as directional
              rather than audited company evidence.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.4'
        title: Financial, security, and execution monitoring
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish parent-level burn, debt, cash, margin, customer concentration, security
              incidents, or audited segment economics. That absence is itself a diligence gap, not evidence that no
              incident or exposure exists. A third-party profile reports $42.3 million of annual revenue for December
              2024, $900 million raised, and a $2 billion April 2021 valuation, but labels the revenue source as
              unrecorded and describes only 195 employees in November 2025; the official site separately says more than
              3,000 global employees. These figures are not necessarily comparable, but the discrepancy makes
              consolidated perimeter and data quality a kill-criterion issue. The investment case should be paused if
              audited parent accounts, regulatory remediation, or operating metrics cannot reconcile these differences.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Risk posture
            body: >-
              Xingyun has operating breadth and an international supply-chain proposition, but public evidence is
              stronger on the existence of the platform than on control effectiveness, parent-level financial
              resilience, or regulatory closure. The appropriate stance is high risk with research-more discipline.
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
          - type: callout
            title: Evidence limitation
            body: >-
              The assigned pool did not provide a parent-level audited risk report, security certification, incident
              log, customer concentration schedule, or final regulatory order. These are open evidence gaps rather than
              negative findings.
            calloutType: assumption
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Xingyun's investable proposition is infrastructure optionality rather than a verified software multiple.
              The group's technology subsidiary describes a combined supply-chain, marketing, warehousing, logistics,
              and finance service stack, while the group site says it links operations across 72 countries and one
              region. Polibeli's public-market profile adds a possible external mark for the overseas business:
              contemporaneous Chinese coverage reports an August 2025 Nasdaq listing at $10 per share and a subsequent
              market capitalization above RMB30 billion. Those facts support a thesis that the group has built operating
              assets that can be separated and financed. They do not prove that the parent owns a fixed percentage of
              Polibeli today, that the public mark is transferable to the parent, or that reported platform scale
              converts into recurring, cash-generative earnings. The anti-thesis is therefore valuation opacity: a
              private parent with no consolidated audited revenue, EBITDA, net debt, dilution, liquidation preference,
              or segment bridge in the assigned evidence cannot be valued responsibly from a headline market
              capitalization alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Scenarios and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should treat the Polibeli quotation as an uncertain reference point, not as
              Xingyun's equity value. The bull case requires the listed overseas platform to maintain liquidity, expand
              distribution and logistics economics, and leave the parent with meaningful, documented economic ownership;
              it also requires the domestic technology and supply-chain businesses to show segment-level gross profit
              and cash conversion. The base case assumes operating capability persists but public-market value is
              volatile and the parent remains difficult to underwrite, supporting a track or research-more decision
              rather than a buy. The bear case is a de-rating, dilution, weak monetization, or inability to verify
              ownership and cash flows; in that case the public mark provides little downside protection. Entry
              discipline should therefore be based on a verified cap table, primary transaction documents, audited or
              lender-quality financials, and an explicit discount for illiquidity and governance complexity. No assigned
              source supplies a defensible target return or price.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.3'
        title: Market context, exit readiness, and diligence
        blocks:
          - type: paragraph
            body: >-
              External policy evidence is directionally supportive but not a substitute for company performance. The WTO
              reports an interim pathway for 66 members covering approximately 70% of global trade to implement baseline
              digital-trade rules, while the World Economic Forum describes China's 2026-2030 plan as supporting
              cross-border e-commerce, digital trade, and overseas partnerships. Conversely, the European Parliament
              records concerns about product safety, customs fees, platform oversight, and the surge of parcels from
              China into Europe. These conditions create both addressable demand and execution, compliance, and margin
              risks for a cross-border intermediary. Exit readiness is therefore conditional: a listed subsidiary may
              improve financing optionality, but parent-level exit value still depends on clean ownership, audited
              consolidation, transfer pricing, related-party disclosures, and evidence that the operating model earns
              returns after working capital and compliance costs. The immediate diligence ask is a reconciled valuation
              bridge from the last primary round or transaction to current ownership, plus segment financials and
              preference terms.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research-more, with a high risk rating and stretched/unverified valuation stance. A buy call requires
              primary evidence of parent ownership, consolidated economics, and transaction terms.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat a material ownership shortfall, down-round, enforcement event, or inability to reconcile
              listed-asset value to parent cash flows as a thesis-break until disproved by primary records.
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV014
              - CV015
