        - Polibeli de-rates or dilutes; group cash conversion is weak; cross-border compliance costs rise.
        - Headline subsidiary value fails to protect parent equity; downside cannot be bounded from assigned evidence.
        - 'Medium-to-high: several identified risks are unresolved.'
        - Down-round, ownership dispute, adverse enforcement, or material liquidity impairment.
    notes: >-
      Scenarios are qualitative because assigned sources do not disclose parent revenue, EBITDA, debt, cash, preference
      stack, or a verified current ownership percentage.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
