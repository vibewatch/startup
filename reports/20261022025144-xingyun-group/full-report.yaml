              - CO013
              - CO014
      - number: '1.4'
        title: Milestones and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a timeline from founding in 2015 through the 2018 and 2019 financing rounds, the
              September 2020 and April 2021 Series C financings, international expansion to Kenya in 2021, and the
              February 2025 launch of the Flexcreate print-on-demand service. The 2026 policy evidence points to a
              supportive but more demanding external environment: China is promoting cross-border e-commerce, overseas
              expansion, and digital-trade rule alignment while strengthening platform responsibilities and supervision.
              Sector comparator evidence shows that international logistics platforms are investing in overseas capacity
              and localized infrastructure, but it does not measure Xingyun's performance. Material gaps remain around
              current ownership, parent-company audited financials, debt and cash, customer concentration, leadership,
              and the relationship between Xingyun Group and the restructured listed entity 行云科技. The company should not
              be assigned current revenue, valuation, headcount, or governance conclusions beyond the dated disclosures
