  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis impact
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high residual-risk assessment rather than a claim of imminent failure. The most
              concrete event is the listed subsidiary's disclosure case: an adverse report says the Hunan regulator
              found non-disclosure of agreements affecting control and proposed fines, while the listed company said the
              notice concerned controlling shareholders rather than operations. That distinction matters. A second risk
              is financial opacity: the available private-company profile reports historical revenue, funding, and
              valuation but explicitly says the revenue source was not recorded. A third is operating-model exposure to
              customs, platform, product-safety, data, and geopolitical rules. Monitoring should focus on final
              regulatory outcomes, audited consolidated accounts, customs or product-compliance incidents, and evidence
              that local operating entities can absorb policy changes.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
