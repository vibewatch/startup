            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU010
      - number: '6.3'
        title: Expansion, concentration, and market-access friction
        blocks:
          - type: paragraph
            body: >-
              The described workflow creates a plausible land-and-expand path: a brand or retailer could combine market
              entry and digital storefront services with marketing, CRM, warehousing, logistics, store delivery, and
              member management. The evidence does not show that any named customer buys this full stack, nor does it
              disclose top-customer share, module attach rate, procurement cycle, customer-level margin, failed pilots,
              or reasons for churn. Independent 2026 reporting on Indonesia describes seller complaints about
              administrative and logistics fees and a planned rule revision focused on local products, consumer
              protection, and marketplace obligations. China-focused policy analysis also describes tighter platform
              responsibility and compliance as market-access issues. These are operating frictions for cross-border
              customers, not proof of Xingyun-specific churn. An adverse article about the separately identified listed
              company 行云科技 (300209.SZ) does not name Xingyun Group or LinkieBuy, so no customer or governance link
              should be inferred without entity-level proof.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU016
          - type: figure
