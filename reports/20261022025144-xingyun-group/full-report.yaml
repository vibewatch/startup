  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption context
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all e-commerce or all freight. Xingyun's described offering sits in the
              cross-border B2B supply-chain layer between overseas brands, agents and traders on one side and Chinese
              e-commerce platforms, retailers and offline stores on the other. The included spend is therefore
              procurement, distribution, cross-border logistics, brand support and related trade-finance services for
              imported and exported goods. Consumer checkout, domestic-only retail, pure parcel delivery and unrelated
              financial products are excluded unless they are bundled into that workflow. The boundary matters because
              broad online retail and parcel metrics overstate the revenue pool available to an integrated intermediary.
              Current policy evidence indicates that cross-border e-commerce, overseas warehousing, data value and
              platform responsibilities are becoming linked market-access requirements rather than optional growth
              features.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: Multiple sizing lenses and limitations
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports several directional sizing lenses, but not a defensible company-specific SAM
              or SOM. A policy source reports that cross-border e-commerce accounts for more than 6% of total goods
              trade and serves 3.2 billion global customers; these are ecosystem indicators, not Xingyun revenue. A
              historical investor article describes China's imported cross-border e-commerce transaction volume as
              RMB1.9 trillion in 2018 and says the sector had exceeded 30% growth over the prior three years, but that
              estimate is dated and covers a wider market than Xingyun. Adjacent comparators add current demand signals:
              an April 2026 report put S.F. Holding's monthly international and supply-chain revenue at RMB6.991
              billion, up 18.25% year on year, while Lalatech's 2025 overseas revenue was reported at $197.3 million, up
              32.1%. Those businesses and denominators are not Xingyun's TAM. Historical network counts and a $42.3
              million company-revenue estimate whose source was not recorded also cannot bridge the gap. Valuation
              should therefore reflect category optionality with a wide uncertainty band pending current GMV, take rate,
              segment revenue and geography.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
      - number: '2.3'
        title: Buyers, budget owners, drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. Overseas brands and agents seek market access, assortment and distribution;
              Chinese retailers and e-commerce channels seek reliable supply, compliance and working-capital support;
              logistics and warehouse operators provide execution capacity; and the platform itself coordinates the
              transaction and data layer. Budget ownership can therefore sit with procurement, category or merchandising
              teams, supply-chain operations, logistics, or finance, depending on the service purchased. Adoption
              drivers include fragmented cross-border sourcing, the need to connect supply with multiple channels, and
              policy support for digital trade and overseas expansion. Constraints include customs and product-safety
              obligations, platform liability, data governance, geopolitical trust, capital intensity and the complexity
              of localizing operations. China's 2026 guidance is supportive but explicitly couples expansion with
              stronger platform responsibility and regular supervision, so compliance capability is part of the value
              proposition and a timing risk. Execution risk is not merely theoretical: Xingyun Technology, the listed
              company controlled by Xingyun's founder and Shenzhen Tianxingyun, forecast a 2025 parent-attributable net
              loss of RMB70 million to RMB90 million after restructuring. That affiliate result is not the private
              group's accounting loss or cash burn, but it is an adverse signal for capital-intensive channel expansion.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Policy support is paired with compliance burden
            body: >-
              China's 2026 e-commerce guidance supports cross-border trade, overseas expansion and digital
              infrastructure while also strengthening platform responsibilities and supervision. This can expand the
              category while raising the minimum operating and compliance capability required to serve it.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM013
          - type: callout
            title: Company-specific SAM and SOM remain unverified
            body: >-
              The available evidence describes ecosystem size, adjacent logistics growth and historical network breadth,
              but does not disclose current GMV, take rate, segment revenue, customer concentration or a
              serviceable-market calculation for Xingyun.
            calloutType: risk
            claimRefs:
              - CM009
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive archetypes
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a landscape broader than software vendors. Xingyun's LinkedIn profile describes a
              full-link service spanning brand services, imported-commodity agency, supply-chain trade financing, and
              cross-border logistics, while the founder biography frames the company as building the "road" for
              cross-border trade rather than competing as a merchant. That scope places Xingyun alongside at least four
              archetypes: integrated logistics networks such as S.F. Holding and J&T Express; asset-light,
              technology-mediated marketplaces such as Lalatech; specialist or incumbent fulfillment providers such as
              JD Logistics; and merchant-led or internal logistics arrangements that can remain the status quo for large
              brands. The profile is strategically attractive because it can combine procurement, financing, and
              movement of goods, but breadth also creates execution and capital requirements that a focused competitor
              may avoid.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Scale and network density are visible differentiators for the larger comparators. S.F. Holding reported
              April 2026 supply-chain and international revenue of RMB 6.991 billion, while J&T Express reported 8.33
              billion parcels in the first quarter of 2026 and 35.1% of volume outside China. Lalatech disclosed more
              than 1.03 billion fulfilled orders in 2025, 21.3 million monthly active users, 2.1 million monthly active
              drivers, and operations in more than 400 cities across 14 markets. These are not like-for-like measures
              with Xingyun's reported employee or platform descriptions, and they should not be treated as a
              market-share ranking. They do show the hurdle Xingyun faces when buyers value reliable international
              coverage, capacity, or two-sided liquidity. The policy evidence adds a second hurdle: cross-border
              operators increasingly need platform responsibility, regular supervision, rule alignment, and compliant
              global expansion. Xingyun's full-link proposition may create value where procurement and logistics are
              bought together, but the assigned sources do not verify a proprietary technology advantage, service-level
              lead, or regulatory certification that would make displacement difficult.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              No assigned source provides a comparable Xingyun price list, realized take rate, contract economics, or
              customer retention series. The correct competitive conclusion is therefore conditional rather than a
              claimed price advantage. Xingyun can plausibly reduce coordination friction by combining brand services,
              trade finance, and logistics, but the evidence does not quantify savings or switching costs. Competitors
              can attack different parts of the workflow: scaled parcel networks compete on route density and unit
              economics; Lalatech competes through a closed-loop order, payment, matching, tracking, and settlement
              platform; and a merchant can retain incumbent forwarders, marketplace fulfillment, or internal
              procurement. China’s 2026 e-commerce guidance simultaneously supports cross-border expansion and increases
              emphasis on platform responsibility and compliant global growth, making compliance execution a potential
              differentiator and a source of downside. The adverse evidence around the related listed company controlled
              by Xingyun founder Billy Wang is not proof about every Xingyun operation, but it is a governance and
              execution signal that a buyer or investor should diligence before treating the platform breadth as a
              durable moat.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Competitive exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate directly observed company scope from third-party competitor scale and from
              unresolved fields. Ordinal positioning is an analytical aid, not a measured market share: the plotted
              coordinates reflect the evidence-backed dimensions of network breadth and integration breadth, while the
              accompanying notes identify where public data is unavailable. They should be read as a diligence map: a
              high position reflects documented workflow scope, while a rightward position reflects disclosed operating
              reach rather than a claim of superior economics. This distinction matters because the available competitor
              metrics use different populations, periods, and units.
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP010
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration is the hypothesis, not yet the moat
            body: >-
              Xingyun's combined brand, financing, commodity-agency, and logistics scope could reduce coordination
              friction, but the assigned evidence contains no quantified savings, retention, service-level advantage, or
              switching-cost measure.
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
              - CP011
          - type: callout
            title: Scale and compliance raise the bar
            body: >-
              J&T, S.F. Holding, and Lalatech disclose operating scale that can support network effects or lower unit
              costs, while 2026 policy guidance makes platform responsibility and compliant global expansion more
              important. Xingyun's comparable scale and control evidence remain open diligence items.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Xingyun describes a bundled operating model rather than a single software subscription. LinkieBuy,
              identified on its own site as a solution provider under Xingyun Group, combines online SaaS mall
              construction, payment and API integration, agency operation, marketing, CRM, private-domain repurchase,
              warehousing, logistics, delivery, and store-member management. That scope indicates multiple possible
              revenue streams: channel operation and distribution, service fees, logistics or warehousing charges, and
              software or integration fees. The public materials do not state the mix, contract duration,
              gross-versus-net recognition policy, realized pricing, take rate, or contribution margin for any stream.
              The company-controlled description of 150-plus partner brands in 14 countries or regions and management of
              more than 100 million brand-user assets is operating traction, not recognized revenue. PrivCo's fetched
              page was an access-restricted notice and cannot support a financial claim. A lender or investor should
              therefore underwrite each stream separately and request audited segment revenue, customer concentration,
              deferred revenue, and working-capital schedules before treating the reported revenue estimate as durable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.2'
        title: Profitability, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No retained source discloses consolidated Xingyun gross margin, operating margin, CAC, payback,
              contribution profit, working-capital turns, or service-delivery cost. The public revenue estimate from
              GetLatka is explicitly described as a 2024 figure whose source was not recorded, so it is a directional
              datapoint rather than audited revenue. Yahoo Finance reports Polibeli income-statement values including
              total revenue of 26,419.71, cost of revenue of 24,479.14, gross profit of 1,940.57, operating expense of
              9,500.49, and operating income of negative 7,559.91 in the displayed period, but the page does not
              establish that those figures equal the Xingyun parent or its consolidated operations. The comparable
              signal is that logistics and cross-border commerce can carry substantial fulfillment, inventory, platform,
              and operating costs; it is not a substitute for Xingyun's own unit economics. Every null in the
              unit-economics table is a specific diligence request because a blended top-line number cannot show whether
              growth creates cash or consumes it.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Capital adequacy and financial risks
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not disclose Xingyun Group cash on hand, free cash flow, debt maturities,
              committed facilities, burn, runway, or the next-round trigger. GetLatka reports a private-company
              valuation of $2 billion in April 2021 and $900 million raised across three rounds, including a $600
              million Series C, but attributes the round history to Crunchbase and does not provide current financing
              terms. The refresh pool's Polibeli financial page shows negative operating income, negative EBITDA, and
              negative net income in the displayed historical series; a syndicated announcement also describes a CFO
              resignation and temporary assumption of finance duties, which is a governance-monitoring signal rather
              than proof of accounting distress. Separately, Sina Finance reports that the listed 行云科技 expected a 2025
              attributable net loss of 70 million to 90 million yuan, non-recurring-excluded loss of 80 million to 110
              million yuan, and a preliminary 55 million yuan impairment provision; this is a related listed operating
              vehicle and should not be mechanically consolidated into Xingyun Group. The regulatory reporting issue and
              continuing losses increase diligence urgency, while the absence of parent-level cash and debt data
              prevents a runway conclusion. Financing dependency therefore remains a material underwriting blocker.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI009
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial case is best characterized as operational breadth with unverified earnings quality. The
              company-controlled material supports a broad infrastructure and services footprint, while third-party
              databases provide an older revenue and financing history with explicit sourcing limitations. The
              listed-company evidence adds adverse information on losses, asset impairments, share freezes, and
              disclosure penalties, but the relationship between that vehicle and the private parent must be documented
              rather than assumed. A defensible underwriting model should use scenario bands for revenue recognition,
              gross margin, working-capital intensity, and financing needs; it should not convert funding raised into
              cash available or convert a valuation mark into current enterprise value. The immediate diligence package
              is a consolidated audited income statement and balance sheet, segment and customer concentration
              schedules, order-to-cash and inventory aging, debt and covenant schedule, cash-burn bridge, realized price
              and take-rate data, and evidence of any parent guarantees or obligations tied to listed subsidiaries.
            claimRefs:
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Parent-level underwriting gap
            body: >-
              Parent cash, debt, burn, margin, and segment economics are not disclosed in the retained evidence, so
              financing dependency and downside cannot be quantified.
            calloutType: risk
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI016
          - type: callout
            title: Breadth is not revenue quality
            body: >-
              The operating footprint spans software, marketing, distribution, warehousing, and logistics, but public
              materials do not show which streams are recurring, profitable, or recognized gross versus net.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and operating workflow
        blocks:
          - type: paragraph
            body: >-
              Xingyun's product is best understood as an operating layer for fragmented cross-border commerce rather
              than a single software SKU. EqualOcean described the company as providing digital supply-chain and
              one-piece fulfillment services to online and offline small and medium-sized retailers, with brands, SKUs,
              retailers, logistics centers, and consumer reach connected through digital links. The company's own
              milestone page records a global intelligent supply-chain platform, localized fulfillment and channel
              distribution, and the later launch of Polibeli in Indonesia and Vietnam. LinkieBuy adds a China-market
              operating workflow for overseas brands: channels, payment, supply-chain fulfillment, and member operations
              are described as one service chain. This supports a workflow thesis of source or onboard products, expose
              them through commerce channels, coordinate fulfillment and settlement, and automate repetitive operating
              tasks. It does not establish that every capability is delivered from one common codebase or that all
              milestones remain active in 2026.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
