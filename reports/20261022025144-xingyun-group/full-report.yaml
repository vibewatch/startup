chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Xingyun Group is identified as Shenzhen Tianxingyun Supply Chain Co., Ltd., a privately held Chinese B2B
              platform for cross-border commodities and digital supply-chain services. The strongest current profile
              describes SaaS tools for full-process management and one-stop direct-to-consumer services, while an
              independent reference describes the company more simply as an international commodities e-commerce
              business. Together these sources establish the business category and Shenzhen base, but not a consolidated
              legal-entity map or a verified current group structure. The platform profile reports operations spanning
              72 countries and one region through nearly 160 warehouses and says it serves more than 350,000 retailers
              in China; these are reported operating descriptors rather than audited group KPIs. A 2026 policy context
              also supports the relevance of cross-border e-commerce and overseas warehousing while emphasizing stronger
              platform responsibility and supervision, increasing the importance of compliance execution for this
              operating model.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
              - CO011
              - CO012
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Publicly available leadership evidence is not internally consistent. Multiples describes the founder as
              Billy Wang, whereas GetLatka identifies Leon Zhang as founder and CEO; neither retained source provides a
              primary corporate leadership page or a board roster for the private parent. That disagreement is material
              because it prevents a clean key-person and governance assessment. A separate 2026 report about the listed
              company 行云科技, which is described as the post-restructuring operating vehicle and not automatically
              identical to the private parent, reports that Wang Wei became its controlling shareholder and actual
              controller after a restructuring. The same report says the regulator proposed penalties over undisclosed
              agreements during the restructuring and that the listed company forecast a 2025 attributable net loss of
              RMB70 million to RMB90 million. Those facts are adverse evidence about a related public-company governance
              perimeter, not proof that the private parent itself incurred the loss or penalty.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
      - number: '1.3'
        title: Capital history and scale disclosure
        blocks:
          - type: paragraph
            body: >-
              The retained financing databases converge on a last disclosed valuation of about $2 billion in a 2021
              Series C and a roughly $600 million April 2021 round, but they differ on the number of rounds and
              cumulative capital: Multiples reports $950 million across five rounds, while GetLatka reports $900 million
              across three rounds and labels its revenue source as unrecorded. The independent Wikipedia page
              corroborates the existence of a $200 million September 2020 Series C and a $600 million April 2021 Series
              C2, and records unicorn status after the financing. These data points support historical financing scale
              but do not establish a current valuation or cash balance. Current operating scale is similarly uncertain:
              GetLatka reports $42.3 million of December 2024 revenue and 195 employees in November 2025, while
              Multiples reports 350,000-plus retailers and nearly 160 warehouses without a comparable revenue or
              headcount methodology. The figures should therefore be carried as source-attributed, non-comparable
