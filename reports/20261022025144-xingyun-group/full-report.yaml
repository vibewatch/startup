              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Workflow automation is the strongest product proof
            body: >-
              LinkieBuy provides concrete examples of RPA and AI applied to image preparation, reconciliation, tax
              exceptions, logistics billing, visual search, and recommendations, although the reported performance
              figures remain company claims.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Parent-level technical controls are not disclosed
            body: >-
              The retained sources do not establish a consolidated architecture, security certification, uptime history,
              privacy control framework, or independent performance benchmark for the group.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates that Xingyun addresses several related customer groups rather than one homogeneous
              buyer. The group's official page markets brand internationalization, positioning, strategy, promotion, and
              overseas operating support. LinkieBuy's company-issued release is more specific: it describes
              digital-operation services for global brands and retailers entering China, spanning a SaaS mall, payment
              and API integration, agency operations, marketing, CRM, private-domain repurchase, warehousing, logistics,
              store delivery, and member management. Brands and retailers therefore appear to be the economic buyers,
              while commercial, marketing, e-commerce, and store teams are users and logistics operations are delivery
              dependencies. Public evidence does not disclose payer-by-entity, contract value, segment revenue, account
              counts, or the share of customers using multiple services.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU012
              - CU016
      - number: '6.2'
        title: Adoption signals and durability
        blocks:
          - type: paragraph
            body: >-
              Customer proof is strongest at the relationship and capability level, not at the recurring-usage level.
              LinkieBuy states that it had cooperation with more than 100 well-known brands and names Yohji Yamamoto,
              BIGC, CATALO, Swisse, and TheNose Fuji. It also reports a service team of more than 100 people and a focus
              on Japan, Thailand, Southeast Asia, and Europe. Those are company-issued breadth signals, but the release
              does not say whether each named relationship was paid, active, production, pilot, exclusive, or still
              current. Latka supplies broad company-level revenue and headcount fields but labels its revenue source as
              unrecorded and does not provide customer retention or concentration evidence. Sector-wide customer totals
              reported by CGTN likewise cannot be attributed to Xingyun. No NRR, GRR, churn, renewal, cohort,
              contract-length, satisfaction, or customer-level outcome metric is established by the assigned sources.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
