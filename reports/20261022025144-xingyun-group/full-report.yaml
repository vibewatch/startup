      - number: '5.2'
        title: Technology maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              The clearest technical proof is at the workflow-automation layer. LinkieBuy says it uses RPA to collect
              multi-channel image assets, generate standardized storefront images, reconcile platform bills, identify
              customs-tax exceptions, and split logistics bills under different suppliers, charging rules, and
              merchant-specific discounts. It also describes image-based search and an AI shopping assistant that
              recommends products and promotions from user preferences and behavior. The article reports operating
              examples such as reducing one 100-SKU image batch from 310 to 120 minutes and a 99.99% reconciliation
              accuracy figure, but these are company-issued case claims, not independent benchmarks. FlexCreate's Ecwid
              listing supplies a separate practitioner-facing product surface: more than 600 print-on-demand products,
              custom branding, storefront design, embroidery, engraving, and shipping support. Together these are
              credible signs of applied automation and integration, while the public record does not disclose
              source-code activity, APIs, uptime, test methodology, model accuracy, or proprietary IP scope.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Deployment, controls, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              Deployment appears operationally complex because the workflow crosses commerce channels, tax and customs
              data, logistics providers, warehouses, payment, and local-market fulfillment. China's 2026 e-commerce
              guidance reinforces the external control burden: cross-border e-commerce and overseas warehousing are
              encouraged alongside stronger platform responsibilities, regular supervision, data value, and compliant
              global expansion. This makes compliance, data governance, product safety, customs accuracy, and partner
              execution part of the product risk surface, not merely back-office matters. The source set does not
              provide Xingyun-specific security certifications, incident history, service-level commitments, disaster
              recovery, privacy controls, or independent reliability testing. The LinkieBuy article describes future
              improvement areas for image-search accuracy, assistant coverage, and automated campaign generation; these
              should be treated as roadmap claims. The listed-company affiliate's 2025 transition and continuing losses
              also show that operational integration and governance can affect execution, but they do not prove a defect
              in Xingyun's software.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
