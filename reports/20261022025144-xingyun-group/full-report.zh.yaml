        - id: platform
          label: 供应链技术栈
          note: 科技子公司描述了整合的供应链、物流、营销、仓储和金融服务。
        - id: listed-asset
          label: Polibeli 公开市场参考
          note: 独立报道显示其在 Nasdaq 上市，并披露了后续市值。
        - id: opacity
          label: 母公司估值不透明
          note: 分配到的来源中没有任何一个能证明母公司合并盈利、所有权或优先权条款。
        - id: risks
          label: 跨境合规与流动性风险
