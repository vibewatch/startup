              - CO012
              - CO014
              - CO015
              - CO016
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开领导层证据彼此不一致。Multiples 称创始人为 Billy Wang，GetLatka 则称 Leon Zhang 是创始人兼
              CEO；现有来源没有提供私人母公司的官方领导层页面或董事会名单。这一分歧妨碍了对关键人物和治理的清晰判断。另一份 2026 年关于上市公司 行云科技
              的报道将其描述为重组后的运营主体，但不能自动视为与私人母公司相同；报道指 Wang Wei 在重组后成为其控股股东和实际控制人。同一报道称监管机构拟就重组期间未披露协议提出处罚，并称上市公司预计 2025
              年归属于母公司的净亏损为人民币 7000 万至 9000 万元。这些事实构成关联上市公司治理边界上的反向证据，不证明私人母公司承担了该亏损或处罚。
            claimRefs:
