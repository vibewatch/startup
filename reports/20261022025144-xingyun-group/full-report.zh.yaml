            body: >-
              现有来源没有披露 Xingyun 合并口径的毛利率、营业利润率、CAC、回本期、贡献利润、营运资金周转或服务交付成本。GetLatka 的公开收入估算明确是 2024
              年数据且来源未记录，因此只是方向性数据点而非审计收入。Yahoo Finance 报告 Polibeli 损益表显示期间总收入 26,419.71、收入成本 24,479.14、毛利 1,940.57、营业费用
              9,500.49、营业利润负 7,559.91，但该页面没有证明这些数字等于 Xingyun 母公司或其合并业务。可比信号只能说明物流和跨境商业可能承担较高的履约、库存、平台和运营成本，不能替代 Xingyun
              自身的单位经济性。单位经济性表中的每个 null 都对应一项尽调请求，因为混合口径收入无法说明增长是在创造现金还是消耗现金。
