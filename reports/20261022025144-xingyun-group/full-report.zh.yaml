  - id: FU001
    title: 客户旅程与扩张触点
    type: journey-map
    summary: 报道中的客户路径覆盖从市场进入到数字及实体运营，但证据缺口使转化、扩张和续约无法量化。
    data:
      nodes:
        - id: market-entry
          label: 市场进入
          touchpoints:
            - Brand positioning
            - market strategy
            - overseas brand operation
          note: 报道中的服务触点；客户转化和费用未披露。
        - id: digital-storefront
          label: 数字店铺
          touchpoints:
            - SaaS mall
            - payment
            - API integration
          note: LinkieBuy 描述了相关模块；具名客户的采用情况未验证。
        - id: demand-generation
          label: 需求生成
          touchpoints:
            - Agency operation
            - marketing
            - customer acquisition
            - CRM
          note: 客户层面的结果和获客经济性未披露。
        - id: channel-and-store
          label: 渠道与门店
          touchpoints:
            - Online and offline scenarios
            - delivery to stores
            - store member management
          note: 公告描述了工作流，但没有说明生产环境部署。
        - id: fulfillment
          label: 履约
          touchpoints:
            - Warehousing
            - logistics supply chain
            - delivery
          note: 服务水平、利用率和利润率不可得。
        - id: repurchase-and-renewal
          label: 复购与续约
          touchpoints:
            - Private-domain operation
            - repurchase
            - renewal review
          note: 未披露留存率、续约率、复购率或群组率。
