  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采用背景
        blocks:
          - type: paragraph
            body: >-
              相关市场并不是全部电商或全部货运。Xingyun 的服务位于跨境 B2B
              供应链层，连接海外品牌、代理商和贸易商与中国电商平台、零售商和线下门店。纳入的支出包括进口和出口商品的采购、分销、跨境物流、品牌支持及相关贸易融资服务；消费者结账、仅限国内的零售、纯包裹配送和无关金融产品均排除，除非被捆绑进同一工作流。这个边界很重要，因为广义线上零售和包裹指标会高估一体化中间商可获得的收入池。当前政策证据表明，跨境电商、海外仓、数据价值和平台责任正成为相互关联的市场准入要求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM010
      - number: '2.2'
        title: 多种规模测算视角及局限
        blocks:
          - type: paragraph
            body: >-
              现有证据支持若干方向性的规模测算视角，但不足以形成可信的公司特定 SAM 或 SOM。政策来源称跨境电商占商品贸易总额超过 6%，服务全球 3.2 billion 客户；这是生态指标，不是 Xingyun
              收入。历史投资者文章称中国进口跨境电商交易额在 2018 年为 RMB1.9 trillion，且此前三年增速超过 30%，但该估算已过时且覆盖范围更广。相邻可比公司提供当前需求信号：2026 年 4 月
              S.F. Holding 国际及供应链业务月收入为人民币 6.991 billion，同比增 18.25%；Lalatech 2025 年海外收入据报为 $197.3 million，同比增
              32.1%。这些企业及分母不是 Xingyun 的 TAM；历史网络数量和来源未记录的 $42.3 million 公司收入估算也无法补足缺口。因此在获得当前
              GMV、抽佣率、分部收入和地域数据前，估值应体现品类选择权并采用宽泛的不确定性区间。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
      - number: '2.3'
        title: 买方、预算负责人、驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              买方地图是多边的。海外品牌和代理商寻求市场准入、品类和分销；中国零售商与电商渠道需要可靠供给、合规和营运资金支持；物流与仓储运营商提供执行能力；平台协调交易和数据层。因此预算可能由采购、品类或商品团队、供应链运营、物流或财务部门掌握，取决于购买的服务。采用驱动因素包括跨境采购碎片化、将供给接入多个渠道的需求，以及数字贸易和海外扩张的政策支持。约束包括海关与产品安全义务、平台责任、数据治理、地缘政治信任、资本密集度和本地化运营复杂性。中国
              2026 年指引支持扩张，但明确要求更强的平台责任和常态化监管，因此合规能力既是价值主张的一部分，也是时点风险。由 Xingyun 创始人和 Shenzhen Tianxingyun 控制的上市公司
              Xingyun Technology 预计重组后 2025 年归属于母公司的净亏损为人民币 7000 万至 9000 万元；这不是私人集团的会计亏损或现金消耗，但对资本密集型渠道扩张构成不利信号。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 展品
        blocks:
          - type: callout
            title: 政策支持伴随合规负担
            body: 中国 2026 年电商指引支持跨境贸易、海外扩张和数字基础设施，同时强化平台责任与监管。这可能扩大品类空间，也会抬高服务该品类所需的最低运营和合规能力。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM013
          - type: callout
            title: 公司特定 SAM 与 SOM 尚未验证
            body: 现有证据描述生态规模、相邻物流增长和历史网络广度，但没有披露 Xingyun 当前 GMV、抽佣率、分部收入、客户集中度或可服务市场测算。
            calloutType: risk
            claimRefs:
              - CM009
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 格局与竞争类型
        blocks:
          - type: paragraph
            body: >-
              证据支持的竞争格局不止软件供应商。Xingyun 的 LinkedIn
              资料称其提供覆盖品牌服务、进口商品代理、供应链贸易融资和跨境物流的全链路服务；创始人简介将公司定位为建设跨境贸易的“道路”，而非作为商家竞争。其竞争者至少包括 S.F. Holding 和 J&T Express
              等一体化物流网络、Lalatech 等技术驱动的市场平台、JD Logistics
              等专业履约服务商，以及大型品牌可维持的商家自营或内部物流。其吸引力在于能结合采购、融资和货物流转，但业务广度也带来聚焦型竞争者可能避开的执行与资本要求。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
      - number: '3.2'
        title: 能力、分销与信任比较
        blocks:
          - type: paragraph
            body: >-
              规模和网络密度是大型可比公司的显著差异点。S.F. Holding 报告 2026 年 4 月供应链及国际业务收入人民币 6.991 billion；J&T Express 报告 2026 年第一季度包裹量
              8.33 billion 件，其中 35.1% 来自中国以外。Lalatech 披露 2025 年履约订单超过 1.03 billion 笔、月活用户 21.3 million、月活司机 2.1
              million，并在 14 个市场的 400 多座城市运营。这些指标与 Xingyun 的员工或平台描述并非同口径，不应视为市场份额排名，但说明买方重视国际覆盖、产能或双边流动性时 Xingyun
              面临的门槛。政策证据又增加了平台责任、常态监管、规则衔接和合规全球扩张的要求。现有来源没有验证 Xingyun 的专有技术优势、服务水平领先或监管认证。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP010
      - number: '3.3'
        title: 定价、迁移成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              没有现有来源提供可比的 Xingyun 价目表、实际抽佣率、合同经济性或客户留存序列。因此竞争结论应当是有条件的，而不是宣称价格优势。Xingyun
              可能通过结合品牌服务、贸易融资和物流降低协调摩擦，但证据没有量化节省额或迁移成本。规模化包裹网络在路线密度和单位经济性上竞争；Lalatech
              依靠闭环订单、支付、撮合、追踪和结算平台竞争；商家也可以继续使用既有货代、平台履约或内部采购。中国 2026
              年指引支持跨境扩张，同时提高平台责任和合规全球增长要求，使合规执行既可能差异化，也可能带来下行风险。关联上市公司的反向证据不是每项 Xingyun
              业务有问题的证明，但买方或投资人在把平台广度视为持久护城河前应完成治理和执行尽调。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
