chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营模式
        blocks:
          - type: paragraph
            body: >-
              Xingyun Group 被识别为 Shenzhen Tianxingyun Supply Chain Co., Ltd.，是一家私有的中国 B2B
              跨境商品和数字供应链服务平台。当前最完整的资料称其提供全流程管理 SaaS
              工具和一站式直面消费者服务；独立资料则将其概括为国际商品电商企业。两类来源确认了业务类别和深圳基地，但没有建立完整的法律实体地图或验证当前集团结构。平台资料称其通过近 160 个仓库覆盖 72
              个国家和一个地区，并服务中国超过 350,000 家零售商；这些是来源声称的经营描述，不是经审计的集团 KPI。2026
              年政策环境也凸显跨境电商和海外仓的重要性，同时强调更强的平台责任与监管，因此合规执行对该模式更为关键。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
