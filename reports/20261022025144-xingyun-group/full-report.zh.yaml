          - type: paragraph
            body: >-
              公开证据没有证明母公司层面的现金消耗、债务、现金、利润率、客户集中度、安全事故或审计分部经济性。这一缺失本身是尽调缺口，不证明不存在事故或风险。第三方资料报告 2024 年 12 月年收入 $42.3
              million、融资 $900 million 和 2021 年 4 月估值 $2 billion，但将收入来源标为未记录，并称 2025 年 11 月只有 195 名员工；官网另称全球员工超过 3,000
              人。这些数字不一定同口径，但差异使合并边界和数据质量成为否决标准问题。若审计母公司账目、监管整改或经营指标无法调和，应暂停投资判断。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展品
        blocks:
          - type: callout
            title: 风险姿态
            body: Xingyun 拥有经营广度和国际供应链主张，但公开证据更多证明平台存在，而非控制有效性、母公司财务韧性或监管收尾。适当立场是高风险，并保持继续研究纪律。
            calloutType: insight
            claimRefs:
              - CR009
              - CR010
              - CR013
              - CR014
              - CR015
              - CR016
          - type: callout
            title: 证据限制
            body: 现有资料池没有提供母公司层面的审计风险报告、安全认证、事故日志、客户集中度明细或最终监管命令。这些是开放的证据缺口，而不是负面结论。
            calloutType: assumption
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Xingyun 的可投资主张是基础设施选择权，而不是已验证的软件倍数。集团技术子公司描述结合供应链、营销、仓储、物流和金融的服务堆栈，集团网站称其覆盖 72 个国家和一个地区。Polibeli
              的公开市场资料提供了海外业务的可能外部估值标记：中国同期报道显示其于 2025 年 8 月以每股 $10 在 Nasdaq 上市，随后市值超过人民币 300
              亿元。这支持集团已搭建可拆分、可融资的经营资产，但不能证明母公司今天拥有 Polibeli
              的固定比例、公开市场标记可转移给母公司，或平台规模能转化为经常性现金盈利。因此反论点是估值不透明：一个没有合并审计收入、EBITDA、净债务、稀释、清算优先权或分部桥接表的私人母公司，不能仅凭 headline
              市值负责任地估值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 情景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              情景框架应把 Polibeli 报价视为不确定参考点，而不是 Xingyun
              的股权价值。乐观情景要求上市海外平台保持流动性、扩大分销和物流经济性，并让母公司保有有文件支持的经济所有权；国内技术和供应链业务也要证明分部毛利和现金转化。基准情景假设经营能力延续，但公开市场价值波动、母公司仍难以判断，因此更适合跟踪或继续研究而非买入。悲观情景是估值下调、稀释、变现疲弱，或无法验证所有权和现金流；此时公开市场标记几乎不能提供下行保护。入场纪律应建立在经验证的股权结构表、一手交易文件、审计或贷款人质量的财务资料，以及针对流动性不足和治理复杂性的明确折价上。现有来源没有可信的目标回报或价格。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
      - number: '8.3'
        title: 市场背景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              外部政策证据方向上有利，但不能替代公司表现。WTO 报告称 66 个成员正沿临时路径落实基础数字贸易规则，覆盖全球贸易约 70%；世界经济论坛称中国 2026–2030
              年规划支持跨境电商、数字贸易和海外合作。另一方面，欧洲议会记录了对产品安全、海关费用、平台监管以及从中国进入欧洲的包裹激增的担忧。这些条件既带来可服务需求，也带来执行、合规和利润率风险。退出准备度因此是有条件的：上市子公司可能提升融资选择权，但母公司退出价值仍取决于清晰所有权、审计合并、转让定价、关联方披露，以及证明经营模式在营运资金和合规成本后仍有回报。应索取从最近一轮一手融资或交易到当前所有权的对账估值桥接表，以及分部财务和优先权条款。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 展品
        blocks:
          - type: callout
            title: 决策
            body: 继续研究；风险评级高，估值偏高且尚未验证。买入判断必须有母公司所有权、合并经济性和交易条款的一手证据。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
          - type: callout
            title: 论点破坏触发条件
            body: 如出现重大所有权不足、降价轮、执法事件，或无法将上市资产价值与母公司现金流对账，在一手记录推翻前均应视为论点被破坏。
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV014
              - CV015
