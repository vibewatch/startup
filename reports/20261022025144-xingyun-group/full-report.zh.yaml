              证据支持一条从 2015 年成立、经过 2018 年和 2019 年融资、2020 年 9 月及 2021 年 4 月 Series C 融资、2021 年拓展至 Kenya，到 2025 年 2 月推出
              Flexcreate 按需打印服务的时间线。2026
              年政策证据显示外部环境既有支持也更为严格：中国推动跨境电商、海外扩张和数字贸易规则衔接，同时强化平台责任和监管。行业可比公司显示国际物流平台正在投资海外产能和本地化基础设施，但无法衡量 Xingyun
              的表现。当前所有权、母公司审计财务、债务和现金、客户集中度、领导层，以及 Xingyun Group 与重组上市实体 行云科技 的关系仍存在重大缺口。不能在现有日期披露之外推断当前收入、估值、员工数或治理。
