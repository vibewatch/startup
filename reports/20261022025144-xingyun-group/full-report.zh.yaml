  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Xingyun 描述的是捆绑式经营模式，而不是单一软件订阅。其官网将 LinkieBuy 识别为 Xingyun Group 旗下解决方案提供商，业务结合线上 SaaS 商城建设、支付与 API
              集成、代理运营、营销、CRM、私域复购、仓储、物流、配送和店铺会员管理。由此可见，收入可能来自渠道运营与分销、服务费、物流或仓储收费，以及软件或集成费。公开材料没有说明收入占比、合同期限、总额或净额确认政策、实际定价、抽佣率或贡献利润。公司控制的资料称其在
              14 个国家或地区拥有 150 多个合作品牌，并管理超过 100 million 品牌用户资产；这是经营 traction，不是已确认收入。PrivCo
              页面只是访问受限提示，不能支持财务结论。因此在把收入估算视为可持续前，投资人应分别评估各收入流，并索取审计分部收入、客户集中度、递延收入和营运资金明细。
