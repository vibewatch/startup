        title: 资本历史与规模披露
        blocks:
          - type: paragraph
            body: >-
              现有融资数据库均指向 2021 年 Series C 的最后一次公开估值约 $2B，以及 2021 年 4 月约 $600M 的融资，但轮次和累计资本记录不同：Multiples 报告五轮合计
              $950M，GetLatka 报告三轮合计 $900M，并标注收入来源未记录。独立 Wikipedia 页面佐证 2020 年 9 月 $200M Series C 和 2021 年 4 月 $600M
              Series C2 的存在，并记录公司融资后达到独角兽地位。这些数据支持历史融资规模，但不能证明当前估值或现金余额。当前经营规模同样不确定：GetLatka 报告 2024 年 12 月收入
              $42.3M、2025 年 11 月员工 195 人；Multiples 报告超过 350,000 家零售商和近 160 个仓库，却没有可比的收入或员工统计口径。因此这些数字只能作为来源归属、不可比的披露。
