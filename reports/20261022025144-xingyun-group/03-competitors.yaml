company:
  name: Xingyun Group (行云集团)
chapter:
  number: 3
  title: Competitors
  summary: Xingyun presents as a broad cross-border supply-chain and commodity-services platform, but the assigned evidence does not establish a durable product or cost moat against scaled logistics networks, marketplace logistics platforms, and status-quo providers. Public competitor evidence points to scale, network density, localization, and compliance execution as the decisive buyer trade-offs, while Xingyun's own comparable pricing and customer-performance disclosure remains limited.
sections:
  - id: landscape
    title: Landscape and competitive archetypes
    body: >-
      The evidence supports a landscape broader than software vendors. Xingyun's LinkedIn
      profile describes a full-link service spanning brand services, imported-commodity agency,
      supply-chain trade financing, and cross-border logistics, while the founder biography frames
      the company as building the "road" for cross-border trade rather than competing as a
      merchant. That scope places Xingyun alongside at least four archetypes: integrated
      logistics networks such as S.F. Holding and J&T Express; asset-light, technology-mediated
      marketplaces such as Lalatech; specialist or incumbent fulfillment providers such as JD
      Logistics; and merchant-led or internal logistics arrangements that can remain the status
      quo for large brands. The profile is strategically attractive because it can combine
      procurement, financing, and movement of goods, but breadth also creates execution and
      capital requirements that a focused competitor may avoid.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-comparison
    title: Capability, distribution, and trust comparison
    body: >-
      Scale and network density are visible differentiators for the larger comparators. S.F.
      Holding reported April 2026 supply-chain and international revenue of RMB 6.991 billion,
      while J&T Express reported 8.33 billion parcels in the first quarter of 2026 and 35.1% of
      volume outside China. Lalatech disclosed more than 1.03 billion fulfilled orders in 2025,
      21.3 million monthly active users, 2.1 million monthly active drivers, and operations in
      more than 400 cities across 14 markets. These are not like-for-like measures with Xingyun's
      reported employee or platform descriptions, and they should not be treated as a market-share
      ranking. They do show the hurdle Xingyun faces when buyers value reliable international
      coverage, capacity, or two-sided liquidity. The policy evidence adds a second hurdle:
      cross-border operators increasingly need platform responsibility, regular supervision,
      rule alignment, and compliant global expansion. Xingyun's full-link proposition may create
      value where procurement and logistics are bought together, but the assigned sources do not
      verify a proprietary technology advantage, service-level lead, or regulatory certification
      that would make displacement difficult.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability
    title: Pricing, switching costs, and moat durability
    body: >-
      No assigned source provides a comparable Xingyun price list, realized take rate, contract
      economics, or customer retention series. The correct competitive conclusion is therefore
      conditional rather than a claimed price advantage. Xingyun can plausibly reduce coordination
      friction by combining brand services, trade finance, and logistics, but the evidence does
      not quantify savings or switching costs. Competitors can attack different parts of the
      workflow: scaled parcel networks compete on route density and unit economics; Lalatech
      competes through a closed-loop order, payment, matching, tracking, and settlement platform;
      and a merchant can retain incumbent forwarders, marketplace fulfillment, or internal
      procurement. China’s 2026 e-commerce guidance simultaneously supports cross-border
      expansion and increases emphasis on platform responsibility and compliant global growth,
      making compliance execution a potential differentiator and a source of downside. The
      adverse evidence around the related listed company controlled by Xingyun founder Billy Wang
      is not proof about every Xingyun operation, but it is a governance and execution signal that
      a buyer or investor should diligence before treating the platform breadth as a durable moat.
    claimRefs: [CP010, CP011, CP012, CP013]
    tableRefs: [TP003]
  - id: exhibits
    title: Competitive exhibits
    body: >-
      The exhibits separate directly observed company scope from third-party competitor scale and
      from unresolved fields. Ordinal positioning is an analytical aid, not a measured market
      share: the plotted coordinates reflect the evidence-backed dimensions of network breadth and
      integration breadth, while the accompanying notes identify where public data is unavailable.
      They should be read as a diligence map: a high position reflects documented workflow scope,
      while a rightward position reflects disclosed operating reach rather than a claim of superior
      economics. This distinction matters because the available competitor metrics use different
      populations, periods, and units.
    claimRefs: [CP002, CP005, CP007, CP010]
tables:
  - id: TP001
    title: Competitor profile and role in the buyer decision
    columns: [Competitor or alternative, Category, Public scale or scope, Target segment and differentiation, Limitation or diligence issue]
    rows:
      - [Xingyun Group, "Integrated cross-border supply-chain platform", "Full-link services; founded 2015; 501-1,000 employees on LinkedIn profile", "Brands, retailers, imported commodities, financing, and cross-border logistics", "No comparable public pricing, retention, service-level, or consolidated operating metrics in assigned evidence"]
      - [S.F. Holding, "Incumbent integrated logistics network", "April 2026 supply-chain and international revenue RMB 6.991 billion; total revenue RMB 25.376 billion", "International express and supply-chain coverage; value-driven network economics", "Large public-company scale is not comparable to Xingyun's private-company disclosure"]
      - [J&T Express, "Scaled parcel and e-commerce logistics network", "8.33 billion parcels in Q1 2026; 35.1% outside China", "Southeast Asia and international parcel density; platform collaboration", "Parcel volume does not establish procurement, financing, or brand-service capability"]
      - [Lalatech, "Technology-mediated logistics marketplace", "1.03 billion fulfilled orders in 2025; 400+ cities in 14 markets", "Closed-loop ordering, payment, matching, tracking, and settlement", "Marketplace and GTV metrics are not directly comparable with Xingyun's service mix"]
      - [JD Logistics, "Incumbent fulfillment and supply-chain provider", "Assigned article failed to expose annual-report content", "Potential alternative for enterprise fulfillment and network services", "Evidence gap: obtain the primary annual report or customer-level proof before scoring"]
      - [Merchant or internal build, "Status quo / substitute", "Not quantified in assigned sources", "Existing forwarders, marketplace fulfillment, or internal procurement can avoid platform migration", "Switching costs, service failures, and make-versus-buy economics are unverified"]
    notes: "Public scale figures come from the cited source periods and units; blank or unquantified fields are evidence gaps, not zero values."
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP010]
  - id: TP002
    title: Capability and trust comparison
    columns: [Buying criterion, Xingyun evidence, Scaled logistics competitors, Status quo or alternative, Underwriting implication]
    rows:
      - [Cross-border coverage, "Founder biography says operations in 72 countries and regions by 2025", "Lalatech operates in more than 400 cities across 14 markets; J&T reports international volume", "Can use incumbent forwarders or local providers", "Coverage is a claimed advantage but breadth, service levels, and economics need primary verification"]
      - [Network density, "No comparable parcel, order, or route-volume disclosure", "J&T reported 8.33B Q1 2026 parcels; S.F. reported 1.295B April 2026 parcels", "Internal or incumbent networks may be denser in priority lanes", "Scale may pressure Xingyun on price, reliability, and procurement leverage"]
      - [Workflow integration, "Brand services, commodity agency, trade financing, and logistics are described together", "Lalatech covers order placement, payment, matching, tracking, and settlement", "Merchant can coordinate separate vendors", "Integration is a plausible differentiator, but savings and adoption evidence are missing"]
      - [Regulatory and trust posture, "No assigned source verifies Xingyun certifications or overseas compliance controls", "China policy calls for platform responsibilities, supervision, rule alignment, and compliant global expansion", "Local specialists may reduce jurisdiction-specific risk", "Compliance capability should be treated as a gating diligence item"]
      - [Distribution and ecosystem, "LinkedIn lists 227 employees and similar pages including Polibeli Retail", "J&T cites collaboration with major e-commerce platforms; Lalatech has 21.3M MAUs and 2.1M drivers", "Brands may retain marketplace-native distribution", "Partner access and liquidity are not demonstrated for Xingyun at comparable scale"]
      - [Data and technology, "Profile labels the company Technology, Information and Internet but does not document architecture", "Lalatech describes a closed-loop platform; peer network data shows operational scale", "Internal tools can be tailored to a merchant's workflow", "Do not award a software moat without technical, uptime, or customer evidence"]
    notes: "The rows mix company descriptions, competitor operating metrics, and policy requirements; values use each source's own period and denominator and are not a normalized scorecard."
    claimRefs: [CP002, CP006, CP007, CP008, CP009, CP011]
  - id: TP003
    title: Pricing, packaging, and switching-cost evidence
    columns: [Offer or alternative, Price or contract model, Included capabilities, Discount or unknowns, Competitive implication]
    rows:
      - [Xingyun Group, null, "Brand services, imported-commodity agency, trade financing, and cross-border logistics", "No public list price, take rate, realized price, or contract term found", "Cannot claim price leadership; request customer contracts and contribution margin by service"]
      - [S.F. Holding, null, "Express logistics plus supply-chain and international services", "Public operational bulletin gives revenue and volume but not a buyer quote", "Scale and revenue-per-parcel visibility may support sharper pricing discipline"]
      - [J&T Express, null, "Parcel delivery with international and Southeast Asia network", "No comparable customer tariff in assigned source", "Dense network may reduce route cost, but service scope differs"]
      - [Lalatech, null, "Order placement, payment, driver matching, tracking, settlement, and diversified logistics services", "No buyer-specific price or take rate in assigned article", "Closed-loop workflow can raise switching costs if adoption is deep; retention is unverified"]
      - [JD Logistics, null, "Potential enterprise fulfillment and supply-chain alternative", "Assigned fetched page is a 404-like shell; pricing and scope remain unverified", "Do not use as a scored benchmark until primary evidence is retrieved"]
      - [Internal build or incumbent forwarder, null, "Existing process, vendor portfolio, or bespoke procurement stack", "Cost, migration burden, and performance are unquantified", "Status quo may win when Xingyun's integration savings do not exceed switching costs"]
    notes: "All price fields are null because no assigned successful source exposed comparable pricing; null means unavailable, not free or zero."
    claimRefs: [CP010, CP011, CP012]
