    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "Xingyun's described integration breadth is wider than a focused parcel network, but its publicly evidenced network scale is less quantified than scaled logistics peers."
    data:
      xAxis: "Network breadth and demonstrated operating scale"
      yAxis: "Workflow integration breadth"
      points:
        - {label: "Xingyun", x: 4, y: 5, note: "Full-link scope is described; comparable network scale is not disclosed"}
        - {label: "S.F. Holding", x: 5, y: 4, note: "International and supply-chain revenue plus parcel volume are reported"}
        - {label: "J&T Express", x: 5, y: 3, note: "Parcel scale and international mix are reported"}
        - {label: "Lalatech", x: 4, y: 4, note: "Closed-loop platform and global marketplace scale are reported"}
        - {label: "JD Logistics", x: 3, y: 4, note: "Assigned page did not provide usable primary evidence"}
        - {label: "Internal build", x: 2, y: 2, note: "Status quo scale and integration are not quantified"}
    approximationNotes: "Coordinates are ordinal analyst judgments anchored to the cited scope and operating metrics; they are not market shares, financial estimates, or measured benchmarks."
    claimRefs: [CP002, CP005, CP006, CP007, CP010]
callouts:
  - calloutType: insight
    title: Integration is the hypothesis, not yet the moat
    body: "Xingyun's combined brand, financing, commodity-agency, and logistics scope could reduce coordination friction, but the assigned evidence contains no quantified savings, retention, service-level advantage, or switching-cost measure."
    claimRefs: [CP002, CP010, CP011]
  - calloutType: risk
    title: Scale and compliance raise the bar
    body: "J&T, S.F. Holding, and Lalatech disclose operating scale that can support network effects or lower unit costs, while 2026 policy guidance makes platform responsibility and compliant global expansion more important. Xingyun's comparable scale and control evidence remain open diligence items."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
