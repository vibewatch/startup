      No consolidated parent audit or lender-style information package discloses group revenue, EBITDA, debt, cash, or
      segment mix.
    - >-
      The July 2025 valuation mark appears in secondary databases, but no clearly documented primary financing round or
      transaction terms were found.
    - >-
      The exact ownership percentage and economic rights Xingyun still holds in Polibeli after the de-SPAC listing
      remain inconsistently disclosed.
    - >-
      Customer concentration, retention, and cohort economics for key brand and retailer segments are not publicly
      reported.
    - >-
      The operational and legal consequences of the CSRC cases, share freezes, and the 行云科技 control dispute are still
      evolving.
