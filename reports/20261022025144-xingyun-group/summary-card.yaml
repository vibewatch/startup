  topStrengths:
    - Broad cross-border supply-chain, logistics, warehouse, and commerce-service footprint.
    - Historical financing record and brand, retailer, and ecosystem relationships provide operating optionality.
    - >-
      Multiple service lines and overseas capabilities can support differentiated cross-border execution if controls and
      unit economics are proven.
  topRisks:
    - Parent-level revenue quality, margins, cash, debt, and customer concentration are not publicly disclosed.
    - Governance, control-rights, and regulatory outcomes around the related listed entity remain unresolved.
    - Cross-border customs, product-safety, platform, data, and geopolitical obligations create material execution risk.
  unresolvedGaps:
