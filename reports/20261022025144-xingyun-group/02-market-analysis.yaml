company:
  name: Xingyun Group (行云集团)
chapter:
  number: 2
  title: Market Analysis
  summary: Xingyun operates at the intersection of cross-border B2B commerce, digital supply-chain coordination, logistics and trade finance. Current policy and adjacent-logistics growth support category demand, but incompatible scopes, stale company-network counts and an unsourced revenue estimate prevent a defensible company-specific SAM or SOM.
sections:
  - id: market-boundary
    title: Market boundary and adoption context
    body: >-
      The relevant market is not all e-commerce or all freight. Xingyun's described
      offering sits in the cross-border B2B supply-chain layer between overseas brands,
      agents and traders on one side and Chinese e-commerce platforms, retailers and
      offline stores on the other. The included spend is therefore procurement,
      distribution, cross-border logistics, brand support and related trade-finance
      services for imported and exported goods. Consumer checkout, domestic-only
      retail, pure parcel delivery and unrelated financial products are excluded unless
      they are bundled into that workflow. The boundary matters because broad online
      retail and parcel metrics overstate the revenue pool available to an integrated
      intermediary. Current policy evidence indicates that cross-border e-commerce,
      overseas warehousing, data value and platform responsibilities are becoming
      linked market-access requirements rather than optional growth features.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses and limitations
    body: >-
      Available evidence supports several directional sizing lenses, but not a
      defensible company-specific SAM or SOM. A policy source reports that cross-border
      e-commerce accounts for more than 6% of total goods trade and serves 3.2 billion
      global customers; these are ecosystem indicators, not Xingyun revenue. A
      historical investor article describes China's imported cross-border e-commerce
      transaction volume as RMB1.9 trillion in 2018 and says the sector had exceeded
      30% growth over the prior three years, but that estimate is dated and covers a
      wider market than Xingyun. Adjacent comparators add current demand signals: an
      April 2026 report put S.F. Holding's monthly international and supply-chain
      revenue at RMB6.991 billion, up 18.25% year on year, while Lalatech's 2025
      overseas revenue was reported at $197.3 million, up 32.1%. Those businesses and
      denominators are not Xingyun's TAM. Historical network counts and a $42.3 million
      company-revenue estimate whose source was not recorded also cannot bridge the
      gap. Valuation should therefore reflect category optionality with a wide
      uncertainty band pending current GMV, take rate, segment revenue and geography.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, budget owners, drivers and constraints
    body: >-
      The buyer map is multi-sided. Overseas brands and agents seek market access,
      assortment and distribution; Chinese retailers and e-commerce channels seek
      reliable supply, compliance and working-capital support; logistics and warehouse
      operators provide execution capacity; and the platform itself coordinates the
      transaction and data layer. Budget ownership can therefore sit with procurement,
      category or merchandising teams, supply-chain operations, logistics, or finance,
      depending on the service purchased. Adoption drivers include fragmented
      cross-border sourcing, the need to connect supply with multiple channels, and
      policy support for digital trade and overseas expansion. Constraints include
      customs and product-safety obligations, platform liability, data governance,
      geopolitical trust, capital intensity and the complexity of localizing operations.
      China's 2026 guidance is supportive but explicitly couples expansion with stronger
      platform responsibility and regular supervision, so compliance capability is part
      of the value proposition and a timing risk. Execution risk is not merely
      theoretical: Xingyun Technology, the listed company controlled by Xingyun's
      founder and Shenzhen Tianxingyun, forecast a 2025 parent-attributable net loss of
      RMB70 million to RMB90 million after restructuring. That affiliate result is not
      the private group's accounting loss or cash burn, but it is an adverse signal for
      capital-intensive channel expansion.
    claimRefs: [CM010, CM011, CM012, CM013, CM015]
    tableRefs: [TM003]
