    notes: "Values use the units and qualifications reported by each source; unlike units and populations are not combined into a single TAM."
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM014]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Overseas brands and agents, Brand or regional commercial team, Sourcing and channel teams, Market-access or procurement budget, "Supply, distribution and brand services into Chinese channels", "Need for local channel reach and fragmented retail access"]
      - [Chinese e-commerce platforms and retailers, Category or procurement lead, Merchandising and fulfillment teams, Procurement and supply-chain budget, "Import sourcing, assortment and delivery coordination", "Need for reliable supply and broader selection"]
      - [Offline small and medium retailers, Owner or purchasing lead, Store and sales staff, Inventory and working-capital budget, "One-on-one delivery and replenishment", "Need to focus on consumer-facing sales while outsourcing supply"]
      - [Logistics and warehouse partners, Operations or network lead, Transport and warehouse teams, Logistics operations budget, "International logistics and overseas-warehouse execution", "Need for volume, utilization and integrated workflows"]
    notes: "The map is an evidence-constrained operating model, not a disclosed customer segmentation or pricing schedule; payer ownership remains a diligence gap."
    claimRefs: [CM010, CM011, CM012]
figures:
  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: The market is shown as nested evidence lenses, with broad ecosystem indicators above the narrower Xingyun network footprint; values remain qualified and are not additive.
    data:
      items:
        - label: "Global customers served by cross-border e-commerce"
          value: "3.2 billion"
          note: "CGTN reports this as a policy-level ecosystem figure; not Xingyun customers."
        - label: "Cross-border e-commerce share of goods trade"
          value: ">6%"
          note: "CGTN policy description; denominator is total goods trade."
        - label: "China imported cross-border e-commerce transaction volume"
          value: "RMB1.9 trillion"
          note: "2018 historical estimate cited by Hongtai APLUS; broader than Xingyun."
        - label: "Countries and regions represented by overseas groups"
          value: "40+"
          note: "2019 Hongtai APLUS description of Xingyun's network."
        - label: "Overseas brands on described platform"
          value: "2,000+"
          note: "2019 Hongtai APLUS description; network count, not revenue."
        - label: "Selected goods on described platform"
          value: "150,000+"
          note: "2019 Hongtai APLUS description; assortment count, not spend."
        - label: "Current serviceable market"
          value: "Not isolated"
          note: "No retained source reconciles category spend to Xingyun's service mix and geographies."
        - label: "Current obtainable market"
          value: "Not isolated"
          note: "No retained source supplies current GMV, take rate, customer cohorts or capacity."
    claimRefs: [CM005, CM006, CM007, CM008, CM016]
    approximationNotes: "The layers are an ordered evidence hierarchy, not a mathematically nested or value-proportional TAM/SAM/SOM calculation. Values have different units, dates and populations and must not be summed or interpreted as conversion rates."
callouts:
  - calloutType: insight
    title: Policy support is paired with compliance burden
    body: "China's 2026 e-commerce guidance supports cross-border trade, overseas expansion and digital infrastructure while also strengthening platform responsibilities and supervision. This can expand the category while raising the minimum operating and compliance capability required to serve it."
    claimRefs: [CM003, CM004, CM013]
  - calloutType: risk
    title: Company-specific SAM and SOM remain unverified
    body: "The available evidence describes ecosystem size, adjacent logistics growth and historical network breadth, but does not disclose current GMV, take rate, segment revenue, customer concentration or a serviceable-market calculation for Xingyun."
    claimRefs: [CM009, CM016]
