callouts:
  - calloutType: strength
    title: Historical capital and operating optionality
    body: "The assigned evidence supports a $2B historical valuation, a reported $600M 2021 financing, and a broad cross-border supply-chain footprint, although these are not current audited operating metrics."
    claimRefs: [CO003, CO011, CO012]
  - calloutType: risk
    title: Disclosure and governance uncertainty
    body: "Conflicting founder names, inconsistent funding totals, unrecorded revenue sourcing, and adverse governance reporting around a related listed entity materially limit confidence in current scale and control conclusions."
    claimRefs: [CO006, CO007, CO009, CO014, CO015, CO016]
