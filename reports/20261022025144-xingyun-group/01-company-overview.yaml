company:
  name: Xingyun Group (行云集团)
chapter:
  number: 1
  title: Company Overview
  summary: Xingyun Group is a Shenzhen-based, privately held B2B digital supply-chain and cross-border commerce platform founded in 2015. The available evidence supports a large historical financing record and broad operating footprint, but current parent-level financials, governance, and leadership identity remain insufficiently disclosed and partly conflicting.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Xingyun Group is identified as Shenzhen Tianxingyun Supply Chain Co., Ltd., a privately held Chinese B2B platform for cross-border commodities and digital supply-chain services. The strongest current profile describes SaaS tools for full-process management and one-stop direct-to-consumer services, while an independent reference describes the company more simply as an international commodities e-commerce business. Together these sources establish the business category and Shenzhen base, but not a consolidated legal-entity map or a verified current group structure. The platform profile reports operations spanning 72 countries and one region through nearly 160 warehouses and says it serves more than 350,000 retailers in China; these are reported operating descriptors rather than audited group KPIs. A 2026 policy context also supports the relevance of cross-border e-commerce and overseas warehousing while emphasizing stronger platform responsibility and supervision, increasing the importance of compliance execution for this operating model.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Publicly available leadership evidence is not internally consistent. Multiples describes the founder as Billy Wang, whereas GetLatka identifies Leon Zhang as founder and CEO; neither retained source provides a primary corporate leadership page or a board roster for the private parent. That disagreement is material because it prevents a clean key-person and governance assessment. A separate 2026 report about the listed company 行云科技, which is described as the post-restructuring operating vehicle and not automatically identical to the private parent, reports that Wang Wei became its controlling shareholder and actual controller after a restructuring. The same report says the regulator proposed penalties over undisclosed agreements during the restructuring and that the listed company forecast a 2025 attributable net loss of RMB70 million to RMB90 million. Those facts are adverse evidence about a related public-company governance perimeter, not proof that the private parent itself incurred the loss or penalty.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO002]
  - id: capital-and-scale-disclosure
    title: Capital history and scale disclosure
    body: >-
      The retained financing databases converge on a last disclosed valuation of about $2 billion in a 2021 Series C and a roughly $600 million April 2021 round, but they differ on the number of rounds and cumulative capital: Multiples reports $950 million across five rounds, while GetLatka reports $900 million across three rounds and labels its revenue source as unrecorded. The independent Wikipedia page corroborates the existence of a $200 million September 2020 Series C and a $600 million April 2021 Series C2, and records unicorn status after the financing. These data points support historical financing scale but do not establish a current valuation or cash balance. Current operating scale is similarly uncertain: GetLatka reports $42.3 million of December 2024 revenue and 195 employees in November 2025, while Multiples reports 350,000-plus retailers and nearly 160 warehouses without a comparable revenue or headcount methodology. The figures should therefore be carried as source-attributed, non-comparable disclosures.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
  - id: milestones-and-diligence-gaps
    title: Milestones and diligence gaps
    body: >-
      The evidence supports a timeline from founding in 2015 through the 2018 and 2019 financing rounds, the September 2020 and April 2021 Series C financings, international expansion to Kenya in 2021, and the February 2025 launch of the Flexcreate print-on-demand service. The 2026 policy evidence points to a supportive but more demanding external environment: China is promoting cross-border e-commerce, overseas expansion, and digital-trade rule alignment while strengthening platform responsibilities and supervision. Sector comparator evidence shows that international logistics platforms are investing in overseas capacity and localized infrastructure, but it does not measure Xingyun's performance. Material gaps remain around current ownership, parent-company audited financials, debt and cash, customer concentration, leadership, and the relationship between Xingyun Group and the restructured listed entity 行云科技. The company should not be assigned current revenue, valuation, headcount, or governance conclusions beyond the dated disclosures in the retained sources.
    claimRefs: [CO001, CO004, CO005, CO008, CO009, CO010, CO011, CO012]
    figureRefs: [FO001]
