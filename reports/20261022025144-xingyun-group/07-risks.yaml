callouts:
  - calloutType: insight
    title: Risk posture
    body: >-
      Xingyun has operating breadth and an international supply-chain proposition, but public evidence is stronger on the existence of the platform than on control effectiveness, parent-level financial resilience, or regulatory closure. The appropriate stance is high risk with research-more discipline.
    claimRefs: [CR009, CR010, CR013, CR014, CR015, CR016]
  - calloutType: assumption
    title: Evidence limitation
    body: >-
      The assigned pool did not provide a parent-level audited risk report, security certification, incident log, customer concentration schedule, or final regulatory order. These are open evidence gaps rather than negative findings.
    claimRefs: [CR013, CR014, CR015, CR016]
