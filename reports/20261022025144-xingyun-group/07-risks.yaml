      - [Cross-border compliance and customs changes, Medium-high, High, "Medium; operating footprint and logistics capabilities are described, controls are not evidenced", High, "Stress margins, inventory, and working capital by market"]
      - ["Platform, product-safety, data, and geopolitical exposure", Medium-high, High, "Low-to-medium; policy direction is clear, company-specific control testing is absent", High, "Require market-by-market compliance ownership and incident reporting"]
    notes: "Severity and likelihood are analytical judgments constrained by the cited evidence; null or undisclosed parent-level metrics are not treated as zero. Sources include CR005-CR016."
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR013, CR014]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule, jurisdiction, status, likelihood, severity, mitigation, residual exposure, diligence path]
    rows:
      - ["Undisclosed restructuring agreements and undertakings", China / Hunan, "Preliminary administrative penalty notice reported in March 2026", High, High, "Correction, warning, and shareholder-level response", High, "Obtain final regulator decision and complete remediation record"]
      - ["Control-rights and shareholder freeze exposure", China / listed subsidiary, "Share freezes reported; control transition followed restructuring", Medium-high, High, "Restructuring plan and proposed share purchase", High, "Verify current encumbrances, voting rights, and beneficial ownership"]
      - ["Cross-border platform and product-safety obligations", China and destination markets, "Policy direction toward stronger platform responsibility and supervision", Medium-high, High, "Local compliance and channel controls claimed but not tested", High, "Request market-level compliance matrix, audit results, and incidents"]
      - ["Customs classification, duties, and import formalities", United States and other destination markets, "Trade guide describes post-de-minimis formal-entry requirements", Medium-high, Medium-high, "Warehouse, broker, SKU-classification, and origin alternatives", Medium-high, "Test landed-cost controls and customs error/penalty history"]
    enumerationScope:
      coverage: partial
      basis: "Publicly reported company-specific proceedings plus cross-border rules identified in the assigned 2026 evidence pool."
    notes: "The table separates a reported preliminary notice from a final adjudication and treats policy commentary as context, not proof of a Xingyun violation."
    claimRefs: [CR005, CR006, CR007, CR011, CR012]
  - id: TR003
    title: Operational, quality, and dependency risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Customs or SKU-classification error", Medium-high, High, "Not evidenced at parent level", High, "No public error rate, broker controls, or penalty history"]
      - ["Inventory and working-capital shock from formal import flows", Medium-high, High, "Operating model includes warehousing and financing support, but no audited unit economics", High, "No parent-level cash conversion or inventory-aging disclosure"]
      - ["Partner, bank, channel, or overseas-operator concentration", Medium, High, "Relationships are described generically; counterparties and concentration are undisclosed", Medium-high, "No top-counterparty, contract, or termination exposure schedule"]
      - ["Security, privacy, or service outage", Unknown, High, "No incident or control report located in the assigned pool", High, "Request SOC/ISO evidence, incident log, uptime, and recovery tests"]
    notes: "Unknown likelihood means the assigned public evidence cannot support a probability estimate; it does not mean the event has not occurred. Sources include CR009-CR012 and CR016."
    claimRefs: [CR009, CR010, CR011, CR012, CR016]
