evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: >-
      A current consolidated parent-company audit or lender-style information package covering revenue, EBITDA, debt,
      cash and segment mix.
    whyItMatters: >-
      Historical funding and database revenue figures cannot support a current solvency, profitability or valuation
      judgment.
    diligencePath: >-
      Request audited consolidated statements, management accounts and debt schedules directly from the company or
      financing counterparties.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: leadership
    missingEvidence: A current official leadership roster, incorporation record and cap-table or governance schedule.
    whyItMatters: >-
      Billy Wang and Leon Zhang are reported as founder, while Wang Wei is reported as controller of a related listed
      entity; key-person and control conclusions are otherwise unreliable.
    diligencePath: Obtain the parent board roster, executive biographies, shareholder register and related-party structure.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary financing announcements or cap-table reconciliation explaining $900M versus $950M cumulative funding and
      differing round counts.
    whyItMatters: The discrepancy affects historical capital intensity, investor attribution and any valuation multiple analysis.
    diligencePath: Reconcile signed financing documents, investor confirmations and post-money capitalization schedules.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: A complete current investor and governance-rights list.
    whyItMatters: >-
      Secondary profiles expose only partial investor lists and cannot establish control, liquidation preferences or
      residual ownership.
    diligencePath: Request the latest cap table, shareholder agreement and investor-rights schedule under NDA.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: operating-scale
    missingEvidence: Current 2026 verified counts for active retailers, warehouses, countries and employees.
    whyItMatters: >-
      The available scale descriptors are undated or database-reported and may not reflect the current operating
      perimeter.
    diligencePath: Request a dated KPI pack with definitions, active-account cohorts, warehouse ownership and headcount by entity.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Current segment revenue, GMV, take rate, gross margin and geographic mix for Xingyun's cross-border supply-chain
      services.
    whyItMatters: >-
      Broad ecosystem metrics cannot be translated into a company-specific SAM, SOM or valuation-relevant revenue
      opportunity.
    diligencePath: >-
      Request a current management KPI pack or lender-style information memorandum with segment definitions, periods and
      reconciliation to audited or management accounts.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: historical-sizing
    missingEvidence: >-
      A current, comparable cross-border B2B market estimate covering the same geography, service bundle and buyer
      population.
    whyItMatters: The RMB1.9 trillion estimate and Xingyun network counts are historical and use different populations and units.
    diligencePath: >-
      Commission or obtain a 2025-2026 market study that separates B2B procurement, logistics, fulfillment and financing
      spend.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics-gap
    missingEvidence: Customer-level buyer, payer, pricing and retention data by brand, retailer, platform and logistics segment.
    whyItMatters: Without budget ownership and repeat-use evidence, adoption timing and monetization durability remain uncertain.
    diligencePath: Request anonymized cohort, pricing, take-rate and customer-concentration schedules by segment and geography.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Obtain Xingyun customer contracts, list prices, take rates, discounting, renewal terms, and contribution margin by
      service line.
    whyItMatters: >-
      Without realized pricing and retention, integration cannot be distinguished from a broad but low-margin service
      bundle.
    diligencePath: Request a segmented commercial data room export and sample contracts from management.
    relatedQuestionRefs:
      - QP004
      - QP005
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: technology
    missingEvidence: Obtain architecture, uptime, service-level, integration, and security evidence for Xingyun's platform.
    whyItMatters: Technology and reliability may determine whether buyers can multi-home or switch to scaled logistics networks.
    diligencePath: Run technical diligence with product documentation, SLA history, incident logs, and customer references.
    relatedQuestionRefs:
      - QP006
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: material
    topic: competitors
    missingEvidence: Obtain primary annual reports and customer evidence for JD Logistics and other enterprise fulfillment incumbents.
    whyItMatters: >-
