company:
  name: Xingyun Group (行云集团)
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a multi-service cross-border supply-chain model, but parent-level revenue quality, margins, cash, debt, and customer economics remain opaque. Listed Polibeli and the related 行云科技 disclosures provide useful downside signals rather than a consolidated Xingyun underwriting package.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Xingyun describes a bundled operating model rather than a single software subscription. LinkieBuy, identified on its own site as a solution provider under Xingyun Group, combines online SaaS mall construction, payment and API integration, agency operation, marketing, CRM, private-domain repurchase, warehousing, logistics, delivery, and store-member management. That scope indicates multiple possible revenue streams: channel operation and distribution, service fees, logistics or warehousing charges, and software or integration fees. The public materials do not state the mix, contract duration, gross-versus-net recognition policy, realized pricing, take rate, or contribution margin for any stream. The company-controlled description of 150-plus partner brands in 14 countries or regions and management of more than 100 million brand-user assets is operating traction, not recognized revenue. PrivCo's fetched page was an access-restricted notice and cannot support a financial claim. A lender or investor should therefore underwrite each stream separately and request audited segment revenue, customer concentration, deferred revenue, and working-capital schedules before treating the reported revenue estimate as durable.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
  - id: profitability-and-unit-economics
    title: Profitability, cost structure, and unit economics
    body: >-
      No retained source discloses consolidated Xingyun gross margin, operating margin, CAC, payback, contribution profit, working-capital turns, or service-delivery cost. The public revenue estimate from GetLatka is explicitly described as a 2024 figure whose source was not recorded, so it is a directional datapoint rather than audited revenue. Yahoo Finance reports Polibeli income-statement values including total revenue of 26,419.71, cost of revenue of 24,479.14, gross profit of 1,940.57, operating expense of 9,500.49, and operating income of negative 7,559.91 in the displayed period, but the page does not establish that those figures equal the Xingyun parent or its consolidated operations. The comparable signal is that logistics and cross-border commerce can carry substantial fulfillment, inventory, platform, and operating costs; it is not a substitute for Xingyun's own unit economics. Every null in the unit-economics table is a specific diligence request because a blended top-line number cannot show whether growth creates cash or consumes it.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financial risks
    body: >-
      The available evidence does not disclose Xingyun Group cash on hand, free cash flow, debt maturities, committed facilities, burn, runway, or the next-round trigger. GetLatka reports a private-company valuation of $2 billion in April 2021 and $900 million raised across three rounds, including a $600 million Series C, but attributes the round history to Crunchbase and does not provide current financing terms. The refresh pool's Polibeli financial page shows negative operating income, negative EBITDA, and negative net income in the displayed historical series; a syndicated announcement also describes a CFO resignation and temporary assumption of finance duties, which is a governance-monitoring signal rather than proof of accounting distress. Separately, Sina Finance reports that the listed 行云科技 expected a 2025 attributable net loss of 70 million to 90 million yuan, non-recurring-excluded loss of 80 million to 110 million yuan, and a preliminary 55 million yuan impairment provision; this is a related listed operating vehicle and should not be mechanically consolidated into Xingyun Group. The regulatory reporting issue and continuing losses increase diligence urgency, while the absence of parent-level cash and debt data prevents a runway conclusion. Financing dependency therefore remains a material underwriting blocker.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: financial-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial case is best characterized as operational breadth with unverified earnings quality. The company-controlled material supports a broad infrastructure and services footprint, while third-party databases provide an older revenue and financing history with explicit sourcing limitations. The listed-company evidence adds adverse information on losses, asset impairments, share freezes, and disclosure penalties, but the relationship between that vehicle and the private parent must be documented rather than assumed. A defensible underwriting model should use scenario bands for revenue recognition, gross margin, working-capital intensity, and financing needs; it should not convert funding raised into cash available or convert a valuation mark into current enterprise value. The immediate diligence package is a consolidated audited income statement and balance sheet, segment and customer concentration schedules, order-to-cash and inventory aging, debt and covenant schedule, cash-burn bridge, realized price and take-rate data, and evidence of any parent guarantees or obligations tied to listed subsidiaries.
    claimRefs: [CI015, CI016]
