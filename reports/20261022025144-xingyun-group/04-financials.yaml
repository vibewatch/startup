callouts:
  - calloutType: risk
    title: Parent-level underwriting gap
    body: Parent cash, debt, burn, margin, and segment economics are not disclosed in the retained evidence, so financing dependency and downside cannot be quantified.
    claimRefs: [CI006, CI009, CI010, CI016]
  - calloutType: insight
    title: Breadth is not revenue quality
    body: The operating footprint spans software, marketing, distribution, warehousing, and logistics, but public materials do not show which streams are recurring, profitable, or recognized gross versus net.
    claimRefs: [CI001, CI002, CI003, CI005]
