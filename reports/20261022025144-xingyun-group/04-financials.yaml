      - [Parent debt and maturities, null, "Current as of 2026-10-22", "Unavailable", "Cannot assess refinancing risk; request debt, covenant, and guarantee schedule"]
      - [Reported Xingyun revenue, 42.3, "USD millions; December 2024", "Medium-low", "GetLatka says source was not recorded; reconcile to audited statements and segment definitions"]
      - [Historical valuation mark, 2000, "USD millions; April 2021", "Medium-low", "GetLatka attributes the mark to Crunchbase; obtain primary financing terms and cap table"]
      - [Total funding reported by database, 900, "USD millions across three rounds since 2018", "Medium-low", "Funding raised is not cash available; verify proceeds, ownership, and use of funds"]
      - [行云科技 expected attributable net loss, "70-90", "RMB millions; 2025", "Medium", "Related listed vehicle, not parent consolidated result; obtain audited outcome and linkage"]
      - [行云科技 expected non-recurring-excluded loss, "80-110", "RMB millions; 2025", "Medium", "Indicates operating pressure in related vehicle; reconcile scope and continuing obligations"]
      - [Preliminary impairment provision, 55, "RMB millions; 2025 year-end estimate", "Medium", "Potential asset-quality and working-capital pressure; obtain final audited impairment roll-forward"]
    notes: "Nulls are unavailable public inputs, not zero. Values from Polibeli and 行云科技 are related-entity signals and must not be treated as consolidated Xingyun Group results."
    claimRefs: [CI006, CI010, CI011, CI012, CI013, CI014, CI015]
  - id: TI003
    title: Unit economics and underwriting data
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, "Unavailable", "Determines whether fulfillment and service scale creates contribution profit", "Provide audited segment gross margin and allocation methodology"]
      - [CAC and payback, null, "Unavailable", "Tests whether brand and retailer acquisition is self-funding", "Provide channel spend, cohort starts, conversion, and payback by segment"]
      - [Take rate or service fee, null, "Unavailable", "Separates GMV or transaction volume from recognized revenue", "Provide contract pricing, discounts, rebates, and revenue-recognition memos"]
      - [Working-capital turns, null, "Unavailable", "Inventory and receivables can consume cash despite reported growth", "Provide inventory aging, receivables aging, supplier terms, and cash conversion"]
    notes: "All values are unavailable in the retained evidence; each row is a concrete request rather than an estimate."
    claimRefs: [CI006, CI007, CI008, CI009]
