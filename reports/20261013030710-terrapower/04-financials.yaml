callouts:
  - calloutType: "risk"
    title: "EPC Contractor Disruption at Kemmerer"
    body: "The mid-stream departure of Bechtel from the Natrium Demonstration Project creates acute uncertainty around Kemmerer Unit 1's final cost-to-complete and commercial operation schedule. Without a finalized replacement EPC contractor or cost-sharing cap, TerraPower faces heightened risk of first-of-a-kind construction overruns that could strain private capital resources."
    claimRefs:
      - "CI005"
      - "CI006"
  - calloutType: "insight"
    title: "Contractual De-Risking for Commercial Fleet"
    body: "By securing framework agreements with Hyundai E&C that include completion, price, and performance guarantees for future Natrium reactors, TerraPower is attempting to solve the core financing bottleneck that historically crippled Western nuclear deployments. If enforceable, this structure shifts construction cost risk off utility balance sheets to enable commercial bankability."
    claimRefs:
      - "CI003"
      - "CI013"
