company:
  name: "TerraPower"
chapter:
  number: 4
  title: "Financials"
  summary: "TerraPower operates a bifurcated commercial structure featuring a pre-revenue advanced nuclear reactor division alongside an active commercial radiopharmaceutical isotope business. The core Natrium demonstration project in Wyoming relies on a 50/50 cost-share authorization of up to $2 billion from the U.S. Department of Energy ARDP program, supplemented by over $1 billion in private equity funding. While commercial agreements with Meta and guaranteed-price EPC terms with Hyundai Engineering & Construction establish a framework for commercial scaling, Bechtel's September 2026 departure from Kemmerer and the absence of disclosed cash burn or cost-to-complete figures create material underwriting uncertainty."
sections:
  - id: "revenue-streams-and-commercial-status"
    title: "Revenue Streams and Commercial Status"
    body: "TerraPower's core reactor commercialization initiative remains pre-revenue, with first electricity sales from the Kemmerer Unit 1 demonstration plant in Wyoming targeted for 2030 to 2031 following the receipt of its NRC construction permit in March 2026. The company's business model anticipates future monetization through three distinct channels: electricity generation via utility power purchase agreements, technology licensing royalties on serial reactor deployments, and hyperscale clean power capacity reservations. In January 2026, Meta entered into an agreement to support the development of up to eight Natrium advanced nuclear plants, representing up to 2.8 GW of baseload power and 4 GW of peak output, which provides validation for private demand. In contrast to the pre-revenue status of the reactor platform, TerraPower Isotopes is commercially active, conducting weekly production runs of actinium-225 for targeted cancer radiotherapies under pharmaceutical supply contracts, though standalone isotope revenues remain private."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI004"
      - "CI007"
    tableRefs:
      - "TI001"
  - id: "pricing-models-and-epc-guarantees"
    title: "Pricing Models, GTM Motion, and EPC Financing"
    body: "Advanced reactor commercialization in Western markets has historically struggled with severe capital expenditure overruns that damaged utility balance sheets and deterred private underwriting. To address this structural impediment, TerraPower selected Hyundai Engineering & Construction in August 2026 as its engineering, procurement, and construction contractor for up to eight commercial fleet Natrium reactors. The framework incorporates completion, price, and performance guarantees designed to shift construction risk away from project owners and unlock conventional debt financing. In international markets, TerraPower targets a levelized cost of electricity below £100 per megawatt-hour for prospective UK deployments by 2034. The physical design of the Natrium plant decouples the nuclear island from the energy island, substantially reducing the volume of safety-related concrete and structural steel required and aiming to deliver a ~36-month construction cycle from nuclear concrete pour to fuel loading."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI011"
      - "CI013"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-construction-risk"
    title: "Capital Adequacy, Burn, and Execution Dependencies"
    body: "Capital adequacy for the first-of-a-kind Kemmerer demonstration plant is anchored by the U.S. Department of Energy's Advanced Reactor Demonstration Program, which authorizes a 50/50 matching cost-share of up to $2 billion. TerraPower has raised more than $1 billion in cumulative private equity and strategic investment, backed by founder Bill Gates alongside strategic partners such as SK Group and HD Hyundai. However, the project encountered a significant execution shock in September 2026 when contractor Bechtel submitted a WARN notice announcing roughly 200 layoffs after the parties failed to agree on commercial terms for the next construction phase. As of September 2026, TerraPower has not named a replacement EPC contractor for Kemmerer Unit 1 or disclosed whether the dispute will alter construction timelines. In parallel, TerraPower is directing $450 million toward building the Bellwether Laboratory in Philadelphia to expand actinium-225 capacity twentyfold by 2029, representing substantial ongoing capital commitments."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "financial-verdict-and-underwriting-blockers"
    title: "Financial Verdict and Underwriting Blockers"
    body: "From an institutional diligence perspective, TerraPower demonstrates stronger capitalization and strategic sponsorship than any other private advanced nuclear developer, bolstered by federal cost-share matching and hyperscaler backing from Meta. Nevertheless, public information remains insufficient for definitive financial underwriting. Critical underwriting metrics—including monthly net operating burn, total projected cost-to-complete at Kemmerer, post-money valuation, and cash runway—are undisclosed private data. Furthermore, Bechtel's departure introduces near-term execution and cost friction that could strain private capital resources if replacement contracting costs exceed previous budgets. Institutional investors must treat project economics as unverified until audited cost baselines, replacement contractor agreements, and commercial isotope margins are disclosed."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI008"
      - "CI013"
      - "CI014"
