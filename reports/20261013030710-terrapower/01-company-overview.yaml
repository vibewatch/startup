callouts:
  - calloutType: "insight"
    title: "Bifurcated EPC Model for Commercial Fleet vs. Demonstration Unit"
    body: "TerraPower has established a bifurcated execution model by selecting Hyundai Engineering & Construction (HDEC) to deliver future commercial fleet reactors with price and performance guarantees, while separating from demonstration contractor Bechtel in September 2026. This structure seeks to make future units bankable under conventional commercial financing."
    claimRefs:
      - "CO011"
      - "CO016"
  - calloutType: "risk"
    title: "Demonstration Project Re-Contracting Exposure"
    body: "The departure of Bechtel following failure to agree on terms for the next phase of the Natrium Demonstration Project introduces immediate supply chain and schedule uncertainty for Kemmerer Unit 1. Until TerraPower names a successor EPC contractor or formally transitions to a self-perform delivery model, the targeted 2030 to 2031 completion schedule carries heightened execution risk."
    claimRefs:
      - "CO013"
      - "CO016"
