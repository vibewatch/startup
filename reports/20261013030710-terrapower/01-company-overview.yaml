company:
  name: "TerraPower"
chapter:
  number: 1
  title: "Company Overview"
  summary: "TerraPower is a Bellevue, Washington-based advanced nuclear reactor developer founded by Bill Gates in 2006, commercializing the Natrium 345 MWe sodium-cooled fast reactor with integrated molten-salt energy storage. In March 2026 the Nuclear Regulatory Commission issued the first construction permit for a commercial non-light-water power reactor for Kemmerer Unit 1 in Wyoming, where construction is underway alongside commercial fleet agreements with Meta and Korean industrial partners."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Mission, and Product Model"
    body: "TerraPower is a privately held nuclear innovation company headquartered in Bellevue, Washington, founded in 2006 by Chairman Bill Gates alongside a group of visionaries to pioneer clean energy and nuclear science solutions. The company's core commercial focus is advanced nuclear energy systems and radioisotope production for medical therapeutics. Its primary nuclear product is Natrium, an advanced nuclear reactor plant design developed in partnership with GE Vernova Hitachi Nuclear Energy. The Natrium architecture couples a 345 MWe sodium-cooled fast reactor with an integrated molten salt energy storage system capable of temporarily boosting electrical output to 500 MWe for more than five hours, decoupling continuous base reactor heat generation from peak electricity grid dispatch. The plant features an atmospheric, low-pressure operating regime using liquid sodium coolant that enables passive safety and simplifies containment structures through a distinct Nuclear Island and Energy Island layout. In parallel, TerraPower Isotopes operates as a commercial subsidiary extracting actinium-225 (Ac-225) from thorium-229 for targeted alpha-particle cancer therapies, operating weekly commercial production runs while constructing the $450 million Bellwether Laboratory in Philadelphia to expand global supply twentyfold."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO015"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "governance-leadership-and-execution"
    title: "Governance, Leadership, and Key-Person Structure"
    body: "TerraPower operates under the governance of founder and Chairman Bill Gates, who has chaired the company since 2006 and provides decisive long-term capital backing, global diplomatic access, and strategic visibility. Executive management is led by President and Chief Executive Officer Chris Levesque, who directs organizational strategy and global commercialization across North America, Europe, and Asia. In August 2026, TerraPower expanded its nuclear governance by establishing the role of Chief Nuclear Officer and appointing George Wilson, formerly Senior Vice President of Regulatory Affairs and a veteran Nuclear Regulatory Commission office director, to lead nuclear safety, licensing compliance, and regulatory strategy. While executive leadership and specialized nuclear engineering depth are substantial, the organization retains material key-person dependence on Bill Gates for institutional credibility, bilateral relationship facilitation with foreign heads of state, and ongoing financial backstopping."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-ecosystem"
    title: "Capitalization, Public-Private Cost-Share, and Strategic Partners"
    body: "TerraPower has built a heavily capitalized public-private balance sheet combining federal cost-share grants, sovereign and industrial strategic equity, and venture backers. Under the U.S. Department of Energy Advanced Reactor Demonstration Program (ARDP), the company secured a 50/50 cost-share award authorizing up to $2 billion in federal funding to license, build, and operate the first-of-a-kind Kemmerer Unit 1 demonstration plant in Wyoming, matched dollar-for-dollar by TerraPower and its private partners. Private equity backing includes SK Group (SK Inc. and SK Innovation), HD Hyundai (Korea Shipbuilding and Offshore Engineering), ArcelorMittal's XCarb Innovation Fund, NVIDIA via NVentures, and Bill Gates, totaling over $4.5 billion in cumulative disclosed funding and cost-share commitments across four major rounds. Strategic industrial relationships anchor execution across the reactor enclosure and construction value chain, including framework agreements with HD Hyundai Heavy Industries for reactor vessel manufacturing, Hyundai Engineering & Construction (HDEC) as EPC partner for up to eight fleet reactors with completion, price, and performance guarantees, and Doosan Enerbility for core barrel and guard vessel structures."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "commercial-scale-and-execution-milestones"
    title: "Commercial Scale, Licensing Milestones, and Operational Risks"
    body: "The Natrium program achieved a historic regulatory breakthrough in March 2026 when the U.S. Nuclear Regulatory Commission approved a construction permit for Kemmerer Power Station Unit 1 in Wyoming, marking the first commercial construction permit for a non-light-water reactor in the United States in more than 40 years. Construction commenced in April 2026 on the site near a retiring coal plant, mobilizing toward approximately 1,600 peak workers, with expected commercial operation targeted for 2030 to 2031. On the commercial demand front, TerraPower expanded beyond utility demonstration by entering a landmark agreement with Meta in January 2026 covering up to eight Natrium plants (2.8 GW baseload, boostable to 4 GW) to power enterprise data center infrastructure. However, execution faces notable operational friction: in September 2026, engineering partner Bechtel filed a WARN notice announcing plans to lay off roughly 200 staff at its Reston headquarters after failing to agree on commercial terms for the next phase of the demonstration project, leaving TerraPower to resolve EPC contracting for Kemmerer Unit 1 while pursuing its Korean and UK fleet expansion."
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
