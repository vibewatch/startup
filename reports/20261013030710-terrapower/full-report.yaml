        - date: '2006'
          label: Company Founded
          detail: >-
            Bill Gates and visionaries establish TerraPower in Bellevue, Washington to develop advanced nuclear energy
            architectures.
          tone: positive
        - date: 2020-10
          label: DOE ARDP Selection
          detail: >-
            U.S. Department of Energy selects TerraPower for up to $2B cost-share to demonstrate the Natrium
            sodium-cooled reactor.
          tone: positive
        - date: 2022-08
          label: Series B Financing Round
          detail: TerraPower closes $830M funding round led by SK Group and Bill Gates to advance Natrium commercialization.
          tone: positive
