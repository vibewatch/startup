  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: >-
      Structural layers of the Natrium commercial nuclear plant spanning the reactor core, heat transport loops, thermal
      energy storage, and turbine island.
    data:
      layers:
        - label: Grid Dispatch & Power Generation Island
          detail: Conventional commercial turbine-generator operating at standard utility scale
          modules:
            - Grid Interconnection Substation
            - Turbine-Generator Set
            - Load-Following Frequency Controls
          items:
            - 500 MWe peak electrical output capacity
            - Synchronous condensing and spinning reserve delivery
            - Rapid ramp capability for renewable grid integration
        - label: Molten Salt Thermal Storage System
          detail: Two-tank nitrate molten salt energy storage decoupled from the reactor core
          modules:
            - Hot Salt Storage Tank
            - Cold Salt Storage Tank
            - Steam Generator Heat Exchanger
          items:
            - Hot and cold liquid salt storage tanks
            - Steam generator heat exchange loop
            - Up to 5.5 hours of continuous 155 MWe boost capacity
        - label: Intermediate Heat Transport Loop
          detail: Non-radioactive secondary liquid sodium heat transfer loop
          modules:
            - Electromagnetic Sodium Pumps
            - Sodium-to-Salt Heat Exchangers
            - Intermediate Loop Expansion Tank
          items:
            - Intermediate sodium piping and electromagnetic pumps
            - Sodium-to-salt heat exchanger
            - Physical separation barrier between reactor and steam systems
        - label: Primary Sodium Coolant & Reactor Pool
          detail: Low-pressure liquid metal pool operating near atmospheric pressure
          modules:
            - Primary Reactor Pool Vessel
            - Electromagnetic Primary Pumps
            - Passive RVACS Air Heat Exchangers
          items:
            - Primary pool vessel containing reactor core and pumps
            - Passive Reactor Vessel Auxiliary Cooling System (RVACS)
            - High thermal margin with sodium boiling point near 882°C
        - label: Reactor Core & HALEU Fuel Assembly
          detail: Fast-neutron spectrum core utilizing high-assay low-enriched uranium fuel
          modules:
            - U-Zr Metallic Fuel Pins
            - Control Rod Drive Mechanisms
            - Neutron Reflector & Shield Assemblies
          items:
            - Uranium-zirconium metallic fuel alloy pins
            - HALEU enrichment level between 5% and 20% U-235
            - High fuel burnup and passive negative reactivity feedback
        - label: Civil Infrastructure & Silo Containment
          detail: Underground silo containment minimizing footprint and surface vulnerability
          modules:
            - Below-Grade Reactor Silo
            - Seismic Isolation Bearings
            - Independent Balance-of-Plant Pad
          items:
            - Below-grade nuclear island excavation
            - Seismic isolation bearings and shock dampers
            - Independent non-nuclear energy island foundation
    approximationNotes: >-
      Layer definitions synthesize TerraPower public technical disclosures and NRC construction permit boundary
      definitions separating nuclear and energy island structures.
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE014
