      - number: '6.4'
        title: Customer Concentration, Procurement Friction, and Delivery Friction
        blocks:
          - type: paragraph
            body: >-
              TerraPower faces notable customer concentration risks and substantial procurement friction typical of
              first-of-a-kind advanced nuclear projects. Because the company's near-term domestic utility deployment
              relies exclusively on the Kemmerer site with PacifiCorp, any delays in licensing, supply chain
              qualification, or high-assay low-enriched uranium fuel access directly threaten its primary customer
              reference. Furthermore, commercialization risks were highlighted in September 2026 when longtime
              engineering contractor Bechtel issued a WARN notice for approximately 200 headquarters positions after
              failing to reach commercial terms with TerraPower for subsequent project phases. While TerraPower
              subsequently established an EPC framework with Hyundai Engineering and Construction offering price and
              completion guarantees, demonstrating repeatable construction execution remains an essential hurdle to
              converting exploratory customer interest into binding power purchase agreements.
            claimRefs:
              - CU002
              - CU006
              - CU007
              - CU010
              - CU011
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pre-Revenue Status and Demonstration Execution Risk
            body: >-
              TerraPower remains strictly pre-revenue in its core nuclear power business, with zero electricity
              generation sales and commercial operation of Kemmerer Unit 1 not expected until at least 2030. The
              company's recent separation from longtime EPC contractor Bechtel over commercial terms underscores the
              execution hurdles inherent in transitioning from subsidized demonstration to repeatable customer delivery.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU006
          - type: callout
            title: Hyperscale Tech Offtakers Driving Advanced Nuclear Demand
            body: >-
              The commercial framework agreement with Meta for up to eight Natrium plants demonstrates that hyperscale
              technology firms seeking 24/7 clean power for artificial intelligence infrastructure represent the primary
              private demand catalyst for advanced reactors. However, bankability for these projects hinges on EPC
              completion and price guarantees such as those structured with Hyundai E&C.
            calloutType: insight
            claimRefs:
              - CU004
