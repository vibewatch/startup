              - CE014
      - number: '5.3'
        title: Licensing Milestones, Supply Chain Infrastructure, and EPC Transition
        blocks:
          - type: paragraph
            body: >-
              TerraPower has transitioned from theoretical advanced reactor conceptualization into active field
              construction at its Kemmerer, Wyoming demonstration site. The US Nuclear Regulatory Commission issued the
              formal construction permit for Kemmerer Unit 1 on March 4, 2026, representing the first commercial
              non-light-water reactor construction permit approved in the United States in over four decades.
              Non-nuclear site preparation broke ground in June 2024 with full commercial plant operation targeted for
              2030 under the US Department of Energy ARDP 50/50 cost-share program. However, execution experienced a
              major restructuring in late 2026 when original general contractor Bechtel departed the project following
              commercial disagreements over the subsequent construction phase. TerraPower subsequently established an
              international supply chain framework, selecting Hyundai Engineering & Construction as EPC contractor for
              up to eight reactors with performance and completion guarantees, partnering with SK Innovation, and
              signing a landmark agreement with Meta for clean data center power.
            claimRefs:
              - CE004
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
              - CE013
      - number: '5.4'
        title: Fuel-Cycle Vulnerabilities, Safety Governance, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Despite significant regulatory licensing momentum, TerraPower faces two overarching technical and
              execution bottlenecks that present material risks to underwriting commercial deployment. First, Natrium
              requires High-Assay Low-Enriched Uranium metallic fuel enriched between 5% and 20% U-235, a fuel category
              lacking a mature, high-volume domestic commercial supply chain following Western disengagement from
              Russian enrichment suppliers. Second, the departure of Bechtel creates an active general contractor
              vacancy on Kemmerer Unit 1 that could trigger cost escalation or timeline slippage before replacement EPC
              arrangements are finalized on site. To strengthen regulatory compliance and operational discipline during
              this critical phase, TerraPower appointed former regulatory affairs head George Wilson as Chief Nuclear
              Officer in August 2026 and continues advancing parallel pipeline initiatives including the Molten Chloride
              Fast Reactor and Actinium-225 medical isotope commercialization.
            claimRefs:
              - CE002
              - CE008
              - CE011
              - CE012
              - CE013
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Decoupled Nuclear Island Architecture
            body: >-
              By physically and hydraulically separating the 345 MWe nuclear reactor from the molten salt thermal energy
              storage and turbine building, TerraPower confines nuclear-grade safety regulations strictly to the reactor
              silo, allowing the energy island to be constructed to standard commercial industrial codes.
            calloutType: strength
            claimRefs:
              - CE003
              - CE004
              - CE007
          - type: callout
            title: General Contractor Realignment and HALEU Supply Chain Vulnerabilities
            body: >-
              Following Bechtel's departure from the Kemmerer project in late 2026, TerraPower faces near-term general
              contractor transition risks while remaining dependent on nascent domestic HALEU enrichment capacity to
              meet commercial fuel load timelines.
            calloutType: risk
            claimRefs:
              - CE008
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Offtake Profiles
        blocks:
          - type: paragraph
            body: >-
              TerraPower's customer base spans three distinct buyer profiles: regulated investor-owned utilities seeking
              firm clean baseload generation, hyperscale technology corporations requiring dedicated 24/7 power for data
              centers, and international conglomerates pursuing sovereign nuclear fleet expansion. The primary domestic
              utility anchor is PacifiCorp, which is partnering on the Kemmerer Unit 1 demonstration project in Wyoming.
              In parallel, corporate clean energy buyers have emerged as the fastest-growing source of commercial
              interest, highlighted by Meta's commitment to explore nuclear offtake across multiple planned reactors.
              Internationally, South Korea's SK Innovation and the United Kingdom's energy authorities represent forward
              deployment pipelines, though both remain in early regulatory and commercial scoping phases rather than
              binding operational delivery.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU008
              - CU009
