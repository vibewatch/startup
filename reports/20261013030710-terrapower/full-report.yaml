      - number: '6.2'
        title: Commercial Adoption Trajectory and Pipeline Scale
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory for TerraPower's Natrium reactor is characterized by multi-year licensing and
              construction cycles rather than near-term commercial volume. The company's flagship project, Kemmerer Unit
              1, achieved formal construction initiation in 2024 and targets commercial completion by 2030 to 2031 under
              the U.S. Department of Energy Advanced Reactor Demonstration Program. On the commercial offtake front,
              Meta signed a framework agreement in January 2026 to support the development of up to eight Natrium
              plants, representing up to 2.8 gigawatts of baseload generation that can flex to 4 gigawatts utilizing
              molten salt energy storage. Despite these significant forward commitments, TerraPower's core reactor
              business remains pre-revenue as of late 2026, with zero commercial electricity generation sales recorded
              to date.
            claimRefs:
              - CU001
              - CU002
              - CU004
