      - number: '1.2'
        title: Governance, Leadership, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              TerraPower operates under the governance of founder and Chairman Bill Gates, who has chaired the company
              since 2006 and provides decisive long-term capital backing, global diplomatic access, and strategic
              visibility. Executive management is led by President and Chief Executive Officer Chris Levesque, who
              directs organizational strategy and global commercialization across North America, Europe, and Asia. In
              August 2026, TerraPower expanded its nuclear governance by establishing the role of Chief Nuclear Officer
              and appointing George Wilson, formerly Senior Vice President of Regulatory Affairs and a veteran Nuclear
              Regulatory Commission office director, to lead nuclear safety, licensing compliance, and regulatory
              strategy. While executive leadership and specialized nuclear engineering depth are substantial, the
              organization retains material key-person dependence on Bill Gates for institutional credibility, bilateral
              relationship facilitation with foreign heads of state, and ongoing financial backstopping.
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Capitalization, Public-Private Cost-Share, and Strategic Partners
        blocks:
          - type: paragraph
            body: >-
              TerraPower has built a heavily capitalized public-private balance sheet combining federal cost-share
              grants, sovereign and industrial strategic equity, and venture backers. Under the U.S. Department of
              Energy Advanced Reactor Demonstration Program (ARDP), the company secured a 50/50 cost-share award
              authorizing up to $2 billion in federal funding to license, build, and operate the first-of-a-kind
              Kemmerer Unit 1 demonstration plant in Wyoming, matched dollar-for-dollar by TerraPower and its private
              partners. Private equity backing includes SK Group (SK Inc. and SK Innovation), HD Hyundai (Korea
              Shipbuilding and Offshore Engineering), ArcelorMittal's XCarb Innovation Fund, NVIDIA via NVentures, and
              Bill Gates, totaling over $4.5 billion in cumulative disclosed funding and cost-share commitments across
              four major rounds. Strategic industrial relationships anchor execution across the reactor enclosure and
              construction value chain, including framework agreements with HD Hyundai Heavy Industries for reactor
              vessel manufacturing, Hyundai Engineering & Construction (HDEC) as EPC partner for up to eight fleet
              reactors with completion, price, and performance guarantees, and Doosan Enerbility for core barrel and
              guard vessel structures.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
