chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Product Model
        blocks:
          - type: paragraph
            body: >-
              TerraPower is a privately held nuclear innovation company headquartered in Bellevue, Washington, founded
              in 2006 by Chairman Bill Gates alongside a group of visionaries to pioneer clean energy and nuclear
              science solutions. The company's core commercial focus is advanced nuclear energy systems and radioisotope
              production for medical therapeutics. Its primary nuclear product is Natrium, an advanced nuclear reactor
              plant design developed in partnership with GE Vernova Hitachi Nuclear Energy. The Natrium architecture
              couples a 345 MWe sodium-cooled fast reactor with an integrated molten salt energy storage system capable
              of temporarily boosting electrical output to 500 MWe for more than five hours, decoupling continuous base
              reactor heat generation from peak electricity grid dispatch. The plant features an atmospheric,
              low-pressure operating regime using liquid sodium coolant that enables passive safety and simplifies
              containment structures through a distinct Nuclear Island and Energy Island layout. In parallel, TerraPower
              Isotopes operates as a commercial subsidiary extracting actinium-225 (Ac-225) from thorium-229 for
              targeted alpha-particle cancer therapies, operating weekly commercial production runs while constructing
              the $450 million Bellwether Laboratory in Philadelphia to expand global supply twentyfold.
            claimRefs:
