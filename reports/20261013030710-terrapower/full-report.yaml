      - number: '6.3'
        title: Named Customer Proof and Reference Validation
        blocks:
          - type: paragraph
            body: >-
              Tangible customer validation is currently anchored by two prominent named relationships: PacifiCorp in the
              regulated utility sector and Meta Platforms in the hyperscale technology sector. PacifiCorp leadership has
              publicly affirmed the strategic value of the Natrium demonstration facility in replacing retiring
              coal-fired capacity and stabilizing the regional grid. For commercial fleet expansion, Meta's agreement
              provides development funding for an initial two units delivering 690 megawatts as early as 2032, paired
              with future rights for six additional units. In South Korea, a bilateral term sheet with SK Innovation
              formalizes mutual intent to construct the country's first commercial Natrium reactor. While these
              agreements validate substantial prospective demand, none yet represent completed, revenue-generating
              commercial operations.
            claimRefs:
              - CU001
              - CU003
              - CU004
