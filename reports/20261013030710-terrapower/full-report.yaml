  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Licensing Exposure
        blocks:
          - type: paragraph
            body: >-
              TerraPower achieved a historic regulatory breakthrough on March 4, 2026, when the U.S. Nuclear Regulatory
              Commission unanimously authorized the issuance of a 10 CFR Part 50 construction permit for Kemmerer Power
              Station Unit 1 in Wyoming. The approval represents the first commercial non-light-water reactor
              construction permit issued by the NRC in over forty years. The regulatory review concluded in a record
              eighteen months—nine months ahead of initial staff projections—enabled by the Licensing Modernization
              Project risk-informed methodology and TerraPower's architectural separation of the nuclear reactor island
              from the energy storage island. However, the construction permit explicitly does not constitute design
              approval or authorization to operate. Before commercial power generation can commence, TerraPower's
              subsidiary must submit a final safety analysis report reflecting the as-built reactor design and obtain a
              formal Class 103 operating license under Part 50. Ensuring that final construction matches the evaluated
              safety basis remains a critical milestone through 2030.
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
      - number: '7.2'
        title: Operational and EPC Execution Risks
        blocks:
          - type: paragraph
            body: >-
              While non-nuclear site construction began in 2024 and nuclear-island civil works officially commenced in
              April 2026, TerraPower faces immediate project delivery risk. In September 2026, lead engineering,
              procurement, and construction contractor Bechtel filed a WARN Act notice with Virginia workforce officials
              announcing plans to lay off approximately 200 Reston staff after failing to agree on commercial terms for
              the next phase of the Natrium Demonstration Project. Bechtel and TerraPower mutually decided to move
              forward separately. As of late 2026, TerraPower has not publicly announced a replacement prime contractor
              for Kemmerer Unit 1 or confirmed whether the target construction completion timeline of February 2031 will
              be affected. Managing site transition during a build intended to mobilize roughly 1,600 peak craft workers
              creates vulnerability to FOAK schedule slippage and construction cost inflation.
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR014
      - number: '7.3'
        title: Supply Chain and Fuel Cycle Dependencies
        blocks:
          - type: paragraph
            body: >-
              Beyond immediate on-site construction management, TerraPower's long-term commercialization strategy hinges
              on specialized industrial supply chains and advanced nuclear fuel availability. The 345 MWe Natrium
              reactor requires High-Assay Low-Enriched Uranium (HALEU) metal fuel enriched up to 20 percent U-235.
              Domestic commercial HALEU enrichment capacity is currently limited, forcing reliance on federal
              availability initiatives and developmental supply arrangements with partners including Centrus, ASP
              Isotopes, Framatome, and GNF-A. On the equipment side, TerraPower has built an international supply
              consortium, awarding major reactor enclosure system components to HD Hyundai, Doosan Enerbility, ENSA, and
              Marmen. In August 2026, TerraPower expanded its Korean manufacturing partnership by selecting Hyundai
              Engineering & Construction as EPC partner for up to eight commercial fleet units with completion and price
              guarantees, supporting prospective commercial off-take agreements like the 2026 Meta partnership.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR013
      - number: '7.4'
        title: Capital Intensity and Risk Mitigation Matrix
        blocks:
          - type: paragraph
            body: >-
              Advanced reactor development requires substantial upfront capital to absorb first-of-a-kind cost overruns
              and demonstration risk. TerraPower's Kemmerer project benefits from a 50/50 public-private cost share
              under the Department of Energy's Advanced Reactor Demonstration Program, authorizing up to $2 billion in
              federal support. To match this investment and secure long-lead supplier commitments, TerraPower has raised
              substantial private growth equity, including an $830 million Series B in 2022 and $650 million in 2025.
              Nevertheless, firm clean generation technology currently carries an estimated Green Premium exceeding 50
              percent compared to conventional fossil generation. Commercial fleet viability depends on executing FOAK
              demonstration milestones at Kemmerer without crippling budget overruns, establishing dependable HALEU fuel
              supplies, and validating standardized guaranteed-price EPC models for utility and hyperscale customers.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: EPC Transition Uncertainty at Kemmerer Unit 1
            body: >-
              The September 2026 separation between TerraPower and Bechtel introduces significant project execution and
              schedule risk for the flagship demonstration plant. Without a finalized replacement contractor to oversee
              ongoing craft mobilization, the target for 2030-2031 commercial operation faces potential headwind.
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR012
          - type: callout
            title: Decoupled Architecture as a Primary Safety and Regulatory Mitigant
            body: >-
              TerraPower's structural separation of the nuclear reactor island from the conventional molten-salt energy
              island confined NRC safety reviews strictly to nuclear components. This architectural innovation enabled a
              record 18-month construction permit review and insulates two-thirds of the physical plant from
              nuclear-grade quality assurance overhead.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Underwriting Recommendation
        blocks:
          - type: paragraph
            body: >-
              TerraPower represents the foremost commercialization platform in the Western advanced nuclear sector,
              driven by its 345 MWe Natrium sodium-cooled fast reactor architecture and integrated gigawatt-scale
              molten-salt thermal energy storage. The company possesses extraordinary strategic differentiation through
              its March 2026 Nuclear Regulatory Commission construction permit for Kemmerer Unit 1—the first commercial
              non-light-water power reactor authorized for construction in the United States in over four decades.
              However, rigorous institutional underwriting cannot rely on technological prestige alone. TerraPower's
              core reactor business remains pre-revenue, commercial operations at Kemmerer are scheduled for 2030 to
              2031, and post-money valuation marks, share pricing, and preference overhang from its $650 million June
              2025 growth round remain entirely undisclosed to the public. Consequently, we assign a research-more
              recommendation with medium confidence, a high risk rating, and an unknown valuation stance. Capital
              deployment must remain on hold until verified private cap table terms and first-of-a-kind construction
              cost-to-complete models become available.
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: Financing Context and Capital Structure Discipline
        blocks:
          - type: paragraph
            body: >-
              The financing history of TerraPower reflects exceptional capital-raising capability anchored by sovereign
              cost-share mechanisms and strategic institutional balance sheets. The company's demonstration plant in
              Kemmerer, Wyoming, is backed by a 50/50 public-private cost share through the Department of Energy's
              Advanced Reactor Demonstration Program, authorizing up to $2.0 billion in federal funding matched
              dollar-for-dollar by private capital. In June 2025, TerraPower closed a $650 million growth round
              featuring new backer NVentures—marking Nvidia's venture capital arm's largest investment to date and its
              inaugural foray into nuclear energy—alongside existing backers Bill Gates and HD Hyundai. Despite
              cumulative funding commitments surpassing $4.5 billion across grants and equity, the lack of disclosed
              share valuation, liquidation preference seniority, and balance sheet cash burn prevents establishing a
              credible public enterprise valuation or revenue multiple. Investors must distinguish capital access from
              enterprise valuation: headline funding figures demonstrate liquidity and sponsor endurance but cannot
              substitute for fundamental valuation benchmarks.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV015
      - number: '8.3'
        title: Commercial Fleet Momentum Versus EPC Execution Headwinds
        blocks:
          - type: paragraph
            body: >-
              TerraPower's commercial positioning has evolved rapidly from a single-unit demonstration in Wyoming into a
              multi-gigawatt commercial fleet strategy aimed at hyperscale data center operators. In January 2026, Meta
              signed a landmark commercial agreement supporting the development of up to eight Natrium plants in the
              United States, including two initial units producing up to 690 MW as early as 2032 and options for six
              additional reactors providing 2.1 GW by 2035. To industrialize reactor delivery, TerraPower executed
              landmark agreements in Seoul in August 2026, selecting Hyundai Engineering and Construction as EPC
              contractor for up to eight commercial units with price, schedule, and performance guarantees, and
              formalizing joint development with SK Innovation. However, this commercial expansion is severely
              counterbalanced by immediate first-of-a-kind execution friction: a September 2026 WARN notice revealed
              that longtime EPC contractor Bechtel and TerraPower failed to agree on commercial terms for the next
              construction phase at Kemmerer Unit 1 and parted ways, prompting approximately 200 layoffs at Bechtel's
              Reston support center. As of September 2026, TerraPower has not named a replacement contractor for
              Kemmerer, introducing severe re-contracting and schedule risks.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
      - number: '8.4'
        title: Scenario Modeling, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              To frame investment decisions across asymmetric execution outcomes, we model bull, base, and bear
              underwriting scenarios. In the bull case (25% probability), TerraPower smoothly transitions Kemmerer Unit
              1 construction to an alternative contractor without extending its 2030 to 2031 commercial target, and Meta
              converts all eight units into binding project-financed contracts under Hyundai E&C delivery guarantees. In
              the base case (50% probability), first-of-a-kind construction friction causes moderate schedule slippage
              to 2032, requiring incremental equity capital but successfully validating the commercial blueprint. In the
              bear case (25% probability), the Bechtel departure leads to protracted cost overruns and licensing
              disputes, commercial HALEU fuel availability lags, and hyperscalers reallocate capital to alternative
              clean firm energy. Critical diligence asks for any prospective institutional investor include obtaining
              the confidential capitalization table, reviewing replacement EPC contract structures for Kemmerer Unit 1,
              assessing full project-level cash burn, and verifying binding fuel procurement agreements with Centrus,
              ASP Isotopes, and the DOE HALEU consortium.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting Discipline Requires Private Term Disclosure
            body: >-
              While TerraPower exhibits premier technical momentum with its NRC construction permit and Meta commercial
              pipeline, public evidence does not disclose the post-money valuation, share price, or liquidation
              preferences from the 2025 financing round. Investors should maintain a research-more stance until private
              balance sheet data and Kemmerer cost-to-complete metrics can be verified.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV012
              - CV015
          - type: callout
            title: Contractor Transition Introduces Execution and Cost Overhang
            body: >-
              The departure of primary EPC contractor Bechtel from Kemmerer Unit 1 following a failure to agree on
              commercial terms marks a critical execution test. Without a named replacement contractor for the
              first-of-a-kind demonstration plant, schedule and cost risk remain elevated regardless of long-term fleet
              agreements.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
