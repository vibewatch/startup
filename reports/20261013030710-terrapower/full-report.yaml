      - number: '1.4'
        title: Commercial Scale, Licensing Milestones, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              The Natrium program achieved a historic regulatory breakthrough in March 2026 when the U.S. Nuclear
              Regulatory Commission approved a construction permit for Kemmerer Power Station Unit 1 in Wyoming, marking
              the first commercial construction permit for a non-light-water reactor in the United States in more than
              40 years. Construction commenced in April 2026 on the site near a retiring coal plant, mobilizing toward
              approximately 1,600 peak workers, with expected commercial operation targeted for 2030 to 2031. On the
              commercial demand front, TerraPower expanded beyond utility demonstration by entering a landmark agreement
              with Meta in January 2026 covering up to eight Natrium plants (2.8 GW baseload, boostable to 4 GW) to
              power enterprise data center infrastructure. However, execution faces notable operational friction: in
              September 2026, engineering partner Bechtel filed a WARN notice announcing plans to lay off roughly 200
              staff at its Reston headquarters after failing to agree on commercial terms for the next phase of the
              demonstration project, leaving TerraPower to resolve EPC contracting for Kemmerer Unit 1 while pursuing
              its Korean and UK fleet expansion.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bifurcated EPC Model for Commercial Fleet vs. Demonstration Unit
            body: >-
              TerraPower has established a bifurcated execution model by selecting Hyundai Engineering & Construction
              (HDEC) to deliver future commercial fleet reactors with price and performance guarantees, while separating
              from demonstration contractor Bechtel in September 2026. This structure seeks to make future units
              bankable under conventional commercial financing.
            calloutType: insight
            claimRefs:
              - CO011
              - CO016
          - type: callout
            title: Demonstration Project Re-Contracting Exposure
            body: >-
              The departure of Bechtel following failure to agree on terms for the next phase of the Natrium
              Demonstration Project introduces immediate supply chain and schedule uncertainty for Kemmerer Unit 1.
              Until TerraPower names a successor EPC contractor or formally transitions to a self-perform delivery
              model, the targeted 2030 to 2031 completion schedule carries heightened execution risk.
            calloutType: risk
            claimRefs:
              - CO013
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial market for TerraPower's Natrium reactor sits at the intersection of utility-scale firm
              clean baseload power and grid-scale flexible energy storage. Traditional nuclear reactors operate
              exclusively as inflexible baseload assets due to thermal and economic constraints, forcing grid operators
              to deploy peaking natural gas turbines to balance intermittent wind and solar generation. Natrium
              redefines this boundary by decoupling heat generation from electricity production: a 345 MWe sodium-cooled
              fast reactor operates continuously at full thermal output while charging an integrated molten-salt energy
              storage system capable of flexing electricity delivery to 500 MWe for more than five hours. This
              architectural separation positions Natrium not merely as an alternative to conventional light-water
              reactors or small modular reactors, but as a direct substitute for natural gas peakers and long-duration
              battery storage in regions with high renewable penetration. Furthermore, by targeting retiring coal-fired
              power stations such as the inaugural Kemmerer, Wyoming site, the plant captures pre-existing high-voltage
              grid interconnections, water rights, and experienced operating personnel.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 'Addressable Market Sizing: FOAK Reality vs. NOAK Fleet Scaling'
        blocks:
          - type: paragraph
            body: >-
              Evaluating TerraPower's addressable market requires disaggregating first-of-a-kind (FOAK) demonstration
              economics from long-term Nth-of-a-kind (NOAK) fleet commercialization. The Kemmerer Unit 1 demonstration
              plant operates under an official $4.0 billion budget supported by a 50/50 public-private cost share with
              the Department of Energy's Advanced Reactor Demonstration Program, achieving a major regulatory milestone
              when the NRC granted its construction permit on March 4, 2026. However, independent historical
              benchmarking across Western nuclear builds suggests an 80% probability of capital expenditure escalation,
              with probability-weighted estimates pointing to a $9.4 billion final cost ($27,234 per kWe). The
              integrated molten-salt storage subsystem accounts for approximately $726 million (18.1%) of baseline
              capital outlay. Commercial viability for the broader market does not depend on Kemmerer achieving baseline
              FOAK targets, but rather on executing down the multi-unit learning curve. Industry learning models project
              a 40% cost reduction by the eighth deployed reactor, bringing NOAK capital expenditure down to
              $4,638–$6,957 per kWe, where advanced nuclear becomes cost-competitive with international new-build
              benchmarks.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM012
      - number: '2.3'
        title: Buyer Segmentation, Procurement Pathways, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Adoption of advanced nuclear is diverging into two distinct buyer archetypes: regulated investor-owned
              utilities seeking rate-based decarbonization and technology hyperscalers securing 24/7 firm power for
              artificial intelligence data center infrastructure. In January 2026, Meta established the corporate
              offtake pathway by signing a commercial agreement for up to eight Natrium reactors, securing rights to 2.8
              GW of baseload power and 4.0 GW of peak storage-assisted output. On the utility side, PacifiCorp has
              integrated two Natrium reactors into its long-term resource planning for delivery by 2033, alongside
              utility planning agreements in Utah and Kansas. To bridge the traditional financing bottleneck where
              commercial banks refuse to underwrite unhedged nuclear construction risk, TerraPower established a
              framework agreement in August 2026 naming Hyundai Engineering & Construction as EPC contractor for up to
              eight fleet reactors with completion, price, and performance guarantees. Concurrently, a joint-business
              term sheet with SK Innovation expands the addressable pipeline into South Korea's industrial power sector.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Adoption Drivers, Capital Intensity, and Execution Constraints
        blocks:
          - type: paragraph
            body: >-
              The structural drivers accelerating advanced nuclear demand—such as hyperscaler clean energy mandates and
              surging load growth from artificial intelligence data centers—face immediate friction from severe capital
              intensity and supply chain dependencies. Western nuclear projects historically experience an average 3.05x
              cost escalation over initial budget forecasts, with more than 70% of cost escalation concentrating between
              20% and 80% project completion. Execution risks materialized concretely in September 2026 when
              long-standing EPC partner Bechtel filed a WARN notice indicating that it and TerraPower could not agree on
              commercial terms for the next construction phase of Kemmerer Unit 1 and elected to part ways. To mitigate
              component manufacturing bottlenecks, TerraPower has locked in tier-one international supply agreements,
              awarding reactor enclosure system contracts to ENSA, Doosan Enerbility, HD Hyundai, and Marmen.
              Nevertheless, securing high-assay low-enriched uranium (HALEU) fuel qualification and managing contractor
              transitions remain pivotal execution constraints determining commercial adoption timelines.
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial Delivery Guarantees as a Financing Catalyst
            body: >-
              TerraPower's framework agreement with Hyundai E&C introducing completion, price, and performance
              guarantees represents an attempt to overcome the historical Western nuclear financing barrier, shifting
              first-of-a-kind cost risk away from utility balance sheets to enable commercial project debt.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
          - type: callout
            title: FOAK Construction Cost Overrun Exposure
            body: >-
              Historical nuclear construction benchmarks compiled by independent research indicate an 80% probability of
              cost overrun on first-of-a-kind units, with Western builds averaging 3.05x initial estimates and cost
              escalation concentrated in the 20% to 80% completion window.
            calloutType: risk
            claimRefs:
              - CM005
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Advanced Nuclear Landscape and Competitive Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The commercial advanced nuclear sector encompasses multiple technological archetypes addressing the
              growing demand for clean, dispatchable baseload and peaking power driven by data center expansions and
              industrial decarbonization. TerraPower's flagship Natrium reactor represents a sodium-cooled fast reactor
              architecture paired with molten-salt thermal energy storage, designed to deliver 345 MWe of continuous
              baseload electricity and boost output to 500 MWe for over five hours [CP001] [CP004]. In the broader
              competitive ecosystem, TerraPower competes across three primary categories: conventional light-water small
              modular reactor (SMR) developers and incumbent nuclear vendors, non-light-water advanced reactor concepts
              including high-temperature gas and molten salt systems, and non-nuclear clean firm energy substitutes such
              as combined-cycle gas with carbon capture and long-duration battery storage [CP006]. While conventional
              light-water SMR designs benefit from established regulatory precedents and standard low-enriched uranium
              fuel supply chains, they lack the intrinsic thermal energy storage and load-following flexibility offered
              by Natrium's decoupled Nuclear and Energy Island configuration [CP004] [CP006]. However, sodium fast
              reactors require high-assay low-enriched uranium (HALEU) metallic fuel and specialized liquid-metal supply
              chains, creating distinct operational and procurement trade-offs against conventional pressurized water
              reactors [CP002] [CP006].
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP002
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
      - number: '3.2'
        title: Technological Differentiation and Delivery Model Comparisons
        blocks:
          - type: paragraph
            body: >-
              Natrium's competitive differentiation rests on two core architectural choices: atmospheric-pressure liquid
              sodium cooling and the physical separation of the nuclear reactor from the power-generation turbine island
              [CP004] [CP006]. Unlike high-pressure light-water reactors that require massive containment structures and
              extensive safety-grade concrete and steel to mitigate pressure-driven loss-of-coolant accidents, Natrium
              operates at near-atmospheric pressure with natural circulation passive cooling [CP006]. This design
              separates safety-related nuclear structures from the conventional commercial turbine island, aiming to
              reduce safety-grade material requirements and shorten field delivery schedules [CP004] [CP006].
              Furthermore, while traditional nuclear baseload designs operate at fixed thermal output, Natrium's
              molten-salt storage system enables daily load-following by buffering continuous reactor heat while
              modulating electrical generation between 345 MWe and 500 MWe [CP001] [CP004]. On the delivery front,
              nuclear commercialization has historically suffered from extensive cost overruns and schedule slippages
              under traditional cost-plus utility models. To address commercial bankability, TerraPower established a
              framework agreement with Hyundai Engineering & Construction (HDEC) featuring completion, price, and
              performance guarantees for up to eight commercial fleet units [CP003] [CP005]. This contrasts with
              competing Western advanced reactor projects that remain exposed to open-ended utility balance-sheet
              liabilities or unhedged EPC execution risks [CP003].
            claimRefs:
              - CP004
              - CP006
              - CP001
              - CP003
              - CP005
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
      - number: '3.3'
        title: Moat Durability, Supply Chain Moats, and Adverse Execution Friction
        blocks:
          - type: paragraph
            body: >-
              TerraPower's commercial moat is reinforced by its regulatory milestone of securing NRC Construction Permit
              CPAR-1 for Kemmerer Unit 1 in March 2026, marking the first commercial non-light-water reactor
              construction permit issued by the NRC in more than four decades [CP002] [CP008]. It is further supported
              by an extensive network of specialized equipment suppliers across North America, Europe, and Asia [CP001]
              [CP007]. Specifically, TerraPower has contracted major components for its Reactor Enclosure System with
              specialized fabricators, including HD Hyundai for the reactor vessel, Doosan Enerbility for the core
              barrel and guard vessel, ENSA for the reactor head, and Marmen for the rotating plug [CP007]. Additional
              awards cover specialized instrumentation, cyber systems, and control mechanisms across domestic and
              international suppliers [CP001]. Nonetheless, competitive durability is constrained by substantial
              execution frictions and industry-wide supply chain bottlenecks. The decision by Bechtel and TerraPower to
              move forward separately following an inability to agree terms for the next construction phase at Kemmerer
              Unit 1 introduces contractor transition uncertainty and workforce reorganization risks for the flagship
              demonstration project [CP005]. Additionally, while commercial offtake interest from hyperscalers like Meta
              demonstrates strong market demand for clean firm generation [CP001] [CP003], Natrium remains dependent on
              securing commercial volumes of HALEU fuel and demonstrating commercial reliability at full scale before
              its unit economics can be validated against alternative energy sources [CP002] [CP005].
            claimRefs:
              - CP002
              - CP008
              - CP001
              - CP007
              - CP005
              - CP003
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Storage Decoupling as Commercial Wedge
            body: >-
              Natrium's combination of a 345 MWe fast reactor with molten-salt storage offering up to 500 MWe peak
              output fundamentally alters the revenue model compared to inflexible baseload nuclear, enabling
              participation in high-value grid balancing and high-capacity-factor hyperscaler data center contracts.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
          - type: callout
            title: Counterparty Transitions and Fuel Vulnerabilities
            body: >-
              Despite advanced manufacturing agreements with Korean industrial partners, the separation of Bechtel from
              the Kemmerer Unit 1 execution and the ongoing reliance on nascent commercial HALEU supply chains present
              tangible execution risks that could delay serial deployment targets.
            calloutType: risk
            claimRefs:
              - CP005
              - CP002
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Status
        blocks:
          - type: paragraph
            body: >-
              TerraPower's core reactor commercialization initiative remains pre-revenue, with first electricity sales
              from the Kemmerer Unit 1 demonstration plant in Wyoming targeted for 2030 to 2031 following the receipt of
              its NRC construction permit in March 2026. The company's business model anticipates future monetization
              through three distinct channels: electricity generation via utility power purchase agreements, technology
              licensing royalties on serial reactor deployments, and hyperscale clean power capacity reservations. In
              January 2026, Meta entered into an agreement to support the development of up to eight Natrium advanced
              nuclear plants, representing up to 2.8 GW of baseload power and 4 GW of peak output, which provides
              validation for private demand. In contrast to the pre-revenue status of the reactor platform, TerraPower
              Isotopes is commercially active, conducting weekly production runs of actinium-225 for targeted cancer
              radiotherapies under pharmaceutical supply contracts, though standalone isotope revenues remain private.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI007
      - number: '4.2'
        title: Pricing Models, GTM Motion, and EPC Financing
        blocks:
          - type: paragraph
            body: >-
              Advanced reactor commercialization in Western markets has historically struggled with severe capital
              expenditure overruns that damaged utility balance sheets and deterred private underwriting. To address
              this structural impediment, TerraPower selected Hyundai Engineering & Construction in August 2026 as its
              engineering, procurement, and construction contractor for up to eight commercial fleet Natrium reactors.
              The framework incorporates completion, price, and performance guarantees designed to shift construction
              risk away from project owners and unlock conventional debt financing. In international markets, TerraPower
              targets a levelized cost of electricity below £100 per megawatt-hour for prospective UK deployments by
              2034. The physical design of the Natrium plant decouples the nuclear island from the energy island,
              substantially reducing the volume of safety-related concrete and structural steel required and aiming to
              deliver a ~36-month construction cycle from nuclear concrete pour to fuel loading.
            claimRefs:
              - CI002
              - CI003
              - CI011
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI003
              - CI007
              - CI013
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI013
      - number: '4.3'
        title: Capital Adequacy, Burn, and Execution Dependencies
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy for the first-of-a-kind Kemmerer demonstration plant is anchored by the U.S. Department
              of Energy's Advanced Reactor Demonstration Program, which authorizes a 50/50 matching cost-share of up to
              $2 billion. TerraPower has raised more than $1 billion in cumulative private equity and strategic
              investment, backed by founder Bill Gates alongside strategic partners such as SK Group and HD Hyundai.
              However, the project encountered a significant execution shock in September 2026 when contractor Bechtel
              submitted a WARN notice announcing roughly 200 layoffs after the parties failed to agree on commercial
              terms for the next construction phase. As of September 2026, TerraPower has not named a replacement EPC
              contractor for Kemmerer Unit 1 or disclosed whether the dispute will alter construction timelines. In
              parallel, TerraPower is directing $450 million toward building the Bellwether Laboratory in Philadelphia
              to expand actinium-225 capacity twentyfold by 2029, representing substantial ongoing capital commitments.
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI014
      - number: '4.4'
        title: Financial Verdict and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence perspective, TerraPower demonstrates stronger capitalization and strategic
              sponsorship than any other private advanced nuclear developer, bolstered by federal cost-share matching
              and hyperscaler backing from Meta. Nevertheless, public information remains insufficient for definitive
              financial underwriting. Critical underwriting metrics—including monthly net operating burn, total
              projected cost-to-complete at Kemmerer, post-money valuation, and cash runway—are undisclosed private
              data. Furthermore, Bechtel's departure introduces near-term execution and cost friction that could strain
              private capital resources if replacement contracting costs exceed previous budgets. Institutional
              investors must treat project economics as unverified until audited cost baselines, replacement contractor
              agreements, and commercial isotope margins are disclosed.
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: EPC Contractor Disruption at Kemmerer
            body: >-
              The mid-stream departure of Bechtel from the Natrium Demonstration Project creates acute uncertainty
              around Kemmerer Unit 1's final cost-to-complete and commercial operation schedule. Without a finalized
              replacement EPC contractor or cost-sharing cap, TerraPower faces heightened risk of first-of-a-kind
              construction overruns that could strain private capital resources.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
          - type: callout
            title: Contractual De-Risking for Commercial Fleet
            body: >-
              By securing framework agreements with Hyundai E&C that include completion, price, and performance
              guarantees for future Natrium reactors, TerraPower is attempting to solve the core financing bottleneck
              that historically crippled Western nuclear deployments. If enforceable, this structure shifts construction
              cost risk off utility balance sheets to enable commercial bankability.
            calloutType: insight
            claimRefs:
              - CI003
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Reactor Design and Decoupled Power Architecture
        blocks:
          - type: paragraph
            body: >-
              TerraPower designs advanced nuclear energy systems centered on the Natrium reactor, a 345 MWe
              sodium-cooled fast reactor paired with molten salt thermal storage. Unlike conventional light-water
              reactors operating at water pressures exceeding 150 atmospheres, Natrium uses liquid sodium metal coolant
              operating near atmospheric pressure with an exceptionally high boiling point of 882°C. This low-pressure
              operating regime eliminates high-pressure vessel blowdown hazards and enables passive decay heat removal
              through natural air circulation without external emergency electrical power. Crucially, the plant
              architecture physically decouples the nuclear island containing the reactor core from the non-nuclear
              energy island containing the thermal storage tanks and steam turbine generator. This civil decoupling
              confines nuclear-grade safety requirements strictly to the below-grade reactor silo, allowing the power
              conversion facility to be built to standard commercial industrial construction codes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE008
              - CE015
      - number: '5.2'
        title: Molten Salt Storage System and Operational Dispatch Flexibility
        blocks:
          - type: paragraph
            body: >-
              The defining technological differentiator of the Natrium design is its integrated molten salt thermal
              energy storage system. While base reactor heat generation remains continuous and steady-state at 345 MWe
              equivalent, the secondary heat transport system directs thermal energy into a two-tank liquid nitrate salt
              storage system. During peak grid demand periods or intermittent renewable supply deficits, stored thermal
              energy is rapidly discharged through steam generators to boost electrical output to 500 MWe for more than
              five hours. This capability transforms a baseload nuclear plant into a dispatchable peaking asset able to
              provide synchronous inertia, frequency regulation, and flexible load-following. An intermediate liquid
              sodium loop isolates the primary reactor pool from the molten salt tanks, preventing chemical
              contamination and providing a clean hydraulic boundary between radioactive systems and the conventional
              steam cycle.
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE014
