            and gas.
        - label: Advanced Reactor & SMR Replacement Market (SAM)
          value: 20-50 GW
          unit: capacity
          detail: >-
            Addressable market for non-light-water advanced reactors offering high operating temperatures and thermal
            storage.
        - label: Dual-Role Peaking & Baseload Storage (Serviceable Segment)
          value: 10-20 GW
          unit: capacity
