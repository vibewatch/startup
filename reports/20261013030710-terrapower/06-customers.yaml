    - Binding long-term PPA pricing and cost-overrun allocation unknown
  - - Hyperscale Data Center Operators
    - Large Technology Corporations (e.g. Meta)
    - Dedicated behind-the-meter or sleeved clean power for AI workloads
    - Up to 8 Natrium plants (up to 2.8 GW baseload, 4 GW peak)
    - Direct corporate capital; development funding for initial 2 units
    - Firm sites, construction start dates, and PPA conversion triggers unverified
  - - International Power Developers
    - Sovereign / Conglomerate Utilities (e.g. SK Innovation)
    - International deployment in Asia and industrial power
    - 1 Natrium plant targeted in Korea plus overseas expansion
    - Global license expansion and manufacturing ecosystem alignment
    - Korean licensing framework for sodium-cooled fast reactors unestablished
  - - Public Sector Co-Funders
    - Federal / National Energy Agencies (e.g. US DOE, UK DESNZ)
    - First-of-a-kind technology demonstration and regulatory evaluation
    - Up to $2B US cost-share; UK GDA design entry
    - Subsidizes early CAPEX; establishes domestic/foreign licensing precedent
    - Contingent on ongoing federal appropriations and multi-year regulatory review
