company:
  name: TerraPower
chapter:
  number: 6
  title: Customers
  summary: TerraPower's commercial traction centers on its Kemmerer Unit 1 demonstration project with PacifiCorp and early pipeline agreements, notably an offtake agreement with Meta covering up to eight Natrium reactors and a South Korean deployment term sheet with SK Innovation. However, the core reactor business remains strictly pre-revenue with no commercial electricity generation, and broader utility commitments remain encumbered by unresolved project-level economics and first-of-a-kind delivery risks.
sections:
- id: customer-segmentation-and-buyer-profiles
  title: Customer Base Segmentation and Offtake Profiles
  body: 'TerraPower''s customer base spans three distinct buyer profiles: regulated investor-owned utilities seeking firm clean baseload generation, hyperscale technology corporations requiring dedicated 24/7 power for data centers, and international conglomerates pursuing sovereign nuclear fleet expansion. The primary domestic utility anchor is PacifiCorp, which is partnering on the Kemmerer Unit 1 demonstration project in Wyoming. In parallel, corporate clean energy buyers have emerged as the fastest-growing source of commercial interest, highlighted by Meta''s commitment to explore nuclear offtake across multiple planned reactors. Internationally, South Korea''s SK Innovation and the United Kingdom''s energy authorities represent forward deployment pipelines, though both remain in early regulatory and commercial scoping phases rather than binding operational delivery.'
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU008
  - CU009
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: commercial-adoption-trajectory
  title: Commercial Adoption Trajectory and Pipeline Scale
  body: The adoption trajectory for TerraPower's Natrium reactor is characterized by multi-year licensing and construction cycles rather than near-term commercial volume. The company's flagship project, Kemmerer Unit 1, achieved formal construction initiation in 2024 and targets commercial completion by 2030 to 2031 under the U.S. Department of Energy Advanced Reactor Demonstration Program. On the commercial offtake front, Meta signed a framework agreement in January 2026 to support the development of up to eight Natrium plants, representing up to 2.8 gigawatts of baseload generation that can flex to 4 gigawatts utilizing molten salt energy storage. Despite these significant forward commitments, TerraPower's core reactor business remains pre-revenue as of late 2026, with zero commercial electricity generation sales recorded to date.
  claimRefs:
  - CU001
  - CU002
  - CU004
  - CU005
  - CU012
  - CU014
  tableRefs:
  - TU002
- id: named-deployments-and-customer-proof
  title: Named Customer Proof and Reference Validation
  body: 'Tangible customer validation is currently anchored by two prominent named relationships: PacifiCorp in the regulated utility sector and Meta Platforms in the hyperscale technology sector. PacifiCorp leadership has publicly affirmed the strategic value of the Natrium demonstration facility in replacing retiring coal-fired capacity and stabilizing the regional grid. For commercial fleet expansion, Meta''s agreement provides development funding for an initial two units delivering 690 megawatts as early as 2032, paired with future rights for six additional units. In South Korea, a bilateral term sheet with SK Innovation formalizes mutual intent to construct the country''s first commercial Natrium reactor. While these agreements validate substantial prospective demand, none yet represent completed, revenue-generating commercial operations.'
  claimRefs:
  - CU001
  - CU003
  - CU004
  - CU005
  - CU008
  tableRefs:
  - TU003
- id: customer-concentration-and-procurement-risks
  title: Customer Concentration, Procurement Friction, and Delivery Friction
  body: TerraPower faces notable customer concentration risks and substantial procurement friction typical of first-of-a-kind advanced nuclear projects. Because the company's near-term domestic utility deployment relies exclusively on the Kemmerer site with PacifiCorp, any delays in licensing, supply chain qualification, or high-assay low-enriched uranium fuel access directly threaten its primary customer reference. Furthermore, commercialization risks were highlighted in September 2026 when longtime engineering contractor Bechtel issued a WARN notice for approximately 200 headquarters positions after failing to reach commercial terms with TerraPower for subsequent project phases. While TerraPower subsequently established an EPC framework with Hyundai Engineering and Construction offering price and completion guarantees, demonstrating repeatable construction execution remains an essential hurdle to converting exploratory customer interest into binding power purchase agreements.
  claimRefs:
  - CU002
  - CU006
  - CU007
  - CU010
  - CU011
  - CU013
