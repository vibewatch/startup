callouts:
- calloutType: risk
  title: Pre-Revenue Status and Demonstration Execution Risk
  body: TerraPower remains strictly pre-revenue in its core nuclear power business, with zero electricity generation sales and commercial operation of Kemmerer Unit 1 not expected until at least 2030. The company's recent separation from longtime EPC contractor Bechtel over commercial terms underscores the execution hurdles inherent in transitioning from subsidized demonstration to repeatable customer delivery.
  claimRefs:
  - CU001
  - CU002
  - CU006
- calloutType: insight
  title: Hyperscale Tech Offtakers Driving Advanced Nuclear Demand
  body: The commercial framework agreement with Meta for up to eight Natrium plants demonstrates that hyperscale technology firms seeking 24/7 clean power for artificial intelligence infrastructure represent the primary private demand catalyst for advanced reactors. However, bankability for these projects hinges on EPC completion and price guarantees such as those structured with Hyundai E&C.
  claimRefs:
  - CU004
  - CU005
  - CU007
  - CU013
