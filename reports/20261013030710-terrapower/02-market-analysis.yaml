  - - SEQH Historical Overrun Tracker
    - FOAK Probability-Weighted Nuclear Build
    - 2026–2031
    - $9.4 Billion
    - $27,234 / kWe
    - Benchmarked against historical Western nuclear builds exhibiting a 3.05x mean cost overrun with 80% risk
    - Independent probabilistic model; assumes Kemmerer follows Vogtle and Hinkley Point C cost escalation patterns
  - - Molten Salt Subsystem Valuation
    - Integrated Thermal Energy Storage Island
    - 2026–2031
    - $726 Million
    - 18.1% of baseline capex
    - Enables 45% electrical output boost (345 to 500 MWe); evaluated as cost-competitive vs. battery storage
    - Novel subsystem integration risk at commercial utility scale; unproven thermal cycling in liquid metal plants
  - - NOAK Fleet Learning Curve
    - Commercial Fleet Build (8th Unit)
    - 2032–2035
    - $1.6B–$2.4B per unit
    - $4,638–$6,957 / kWe
    - Projects 40% capital cost reduction from FOAK to NOAK enabled by serialized Korean EPC manufacturing
    - Dependent on continuous multi-unit order volume and execution under Hyundai E&C delivery guarantees
  notes: Figures benchmark official DOE ARDP project cost-share targets against independent historical nuclear cost escalation tracking and fleet learning-curve models.
