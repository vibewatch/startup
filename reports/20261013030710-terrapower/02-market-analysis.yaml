figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  summary: Constrained market sizing hierarchy from global clean baseload demand down to near-term contracted offtake pipeline.
  data:
    items:
    - label: Global Clean Firm Power Demand (TAM)
      value: 100+ GW
      unit: capacity
      detail: Broadest addressable market for 24/7 carbon-free firm dispatchable power replacing retiring baseload coal and gas.
    - label: Advanced Reactor & SMR Replacement Market (SAM)
      value: 20-50 GW
      unit: capacity
      detail: Addressable market for non-light-water advanced reactors offering high operating temperatures and thermal storage.
    - label: Dual-Role Peaking & Baseload Storage (Serviceable Segment)
      value: 10-20 GW
      unit: capacity
      detail: Grids with high renewable penetration requiring 345 MWe continuous generation and 500 MWe dispatchable peaking.
    - label: Utility & Data Center Offtake Pipeline (SOM)
      value: 2.8-4.0 GW
      unit: capacity
      detail: Pipeline of announced bilateral commercial agreements including Meta for up to 8 units and PacifiCorp planning.
    - label: FOAK Commercial Demonstration (Kemmerer Unit 1)
      value: 345 MWe
      unit: capacity
      detail: Active 345 MWe (500 MWe peak) demonstration plant in Kemmerer, Wyoming under construction with target completion 2030-2031.
    - label: Near-Term Committed Capital Base
      value: $4.0B+
      unit: USD
      detail: Committed public-private funding comprising $2.0B DOE ARDP cost-share plus matching private equity commitments.
  approximationNotes: Market sizing figures represent capacity boundaries synthesized from utility integrated resource plans, hyperscaler offtake commitments, and ARDP demonstration program budgets.
