- calloutType: strength
  title: Decoupled Nuclear Island Architecture
  body: By physically and hydraulically separating the 345 MWe nuclear reactor from the molten salt thermal energy storage and turbine building, TerraPower confines nuclear-grade safety regulations strictly to the reactor silo, allowing the energy island to be constructed to standard commercial industrial codes.
  claimRefs:
  - CE003
  - CE004
  - CE007
