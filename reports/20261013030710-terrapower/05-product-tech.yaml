  - - TerraPower Isotopes (Actinium-225)
    - Radiopharmaceutical oncology manufacturers
    - Commercial sales active; 50M second facility in Philadelphia
    - Extraction of high-purity alpha-emitting medical isotopes from thorium decay chains
