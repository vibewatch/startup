company:
  name: TerraPower
chapter:
  number: 5
  title: Product & Technology
  summary: TerraPower is commercializing the Natrium 345 MWe sodium-cooled fast reactor integrated with a molten salt thermal energy storage system capable of boosting output to 500 MWe for grid peaking. The architecture decouples the low-pressure nuclear island from a conventional non-nuclear energy island, aiming to reduce nuclear-grade civil construction scope. While the NRC granted the Kemmerer Unit 1 construction permit in March 2026, project execution faces near-term general contractor realignment and long-term domestic HALEU fuel enrichment bottlenecks.
sections:
- id: sec-natrium-overview
  title: Core Reactor Design and Decoupled Power Architecture
  body: TerraPower designs advanced nuclear energy systems centered on the Natrium reactor, a 345 MWe sodium-cooled fast reactor paired with molten salt thermal storage. Unlike conventional light-water reactors operating at water pressures exceeding 150 atmospheres, Natrium uses liquid sodium metal coolant operating near atmospheric pressure with an exceptionally high boiling point of 882°C. This low-pressure operating regime eliminates high-pressure vessel blowdown hazards and enables passive decay heat removal through natural air circulation without external emergency electrical power. Crucially, the plant architecture physically decouples the nuclear island containing the reactor core from the non-nuclear energy island containing the thermal storage tanks and steam turbine generator. This civil decoupling confines nuclear-grade safety requirements strictly to the below-grade reactor silo, allowing the power conversion facility to be built to standard commercial industrial construction
    codes.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE007
  tableRefs:
  - TE001
- id: sec-thermal-storage
  title: Molten Salt Storage System and Operational Dispatch Flexibility
  body: The defining technological differentiator of the Natrium design is its integrated molten salt thermal energy storage system. While base reactor heat generation remains continuous and steady-state at 345 MWe equivalent, the secondary heat transport system directs thermal energy into a two-tank liquid nitrate salt storage system. During peak grid demand periods or intermittent renewable supply deficits, stored thermal energy is rapidly discharged through steam generators to boost electrical output to 500 MWe for more than five hours. This capability transforms a baseload nuclear plant into a dispatchable peaking asset able to provide synchronous inertia, frequency regulation, and flexible load-following. An intermediate liquid sodium loop isolates the primary reactor pool from the molten salt tanks, preventing chemical contamination and providing a clean hydraulic boundary between radioactive systems and the conventional steam cycle.
  claimRefs:
  - CE003
  - CE005
  - CE007
  - CE014
  tableRefs:
  - TE002
  figureRefs:
  - FE001
- id: sec-licensing-execution
  title: Licensing Milestones, Supply Chain Infrastructure, and EPC Transition
  body: TerraPower has transitioned from theoretical advanced reactor conceptualization into active field construction at its Kemmerer, Wyoming demonstration site. The US Nuclear Regulatory Commission issued the formal construction permit for Kemmerer Unit 1 on March 4, 2026, representing the first commercial non-light-water reactor construction permit approved in the United States in over four decades. Non-nuclear site preparation broke ground in June 2024 with full commercial plant operation targeted for 2030 under the US Department of Energy ARDP 50/50 cost-share program. However, execution experienced a major restructuring in late 2026 when original general contractor Bechtel departed the project following commercial disagreements over the subsequent construction phase. TerraPower subsequently established an international supply chain framework, selecting Hyundai Engineering & Construction as EPC contractor for up to eight reactors with performance and completion guarantees, partnering
    with SK Innovation, and signing a landmark agreement with Meta for clean data center power.
  claimRefs:
  - CE004
  - CE006
  - CE008
  - CE009
  - CE010
  - CE011
  tableRefs:
  - TE003
- id: sec-technical-risks
  title: Fuel-Cycle Vulnerabilities, Safety Governance, and Diligence Blockers
  body: Despite significant regulatory licensing momentum, TerraPower faces two overarching technical and execution bottlenecks that present material risks to underwriting commercial deployment. First, Natrium requires High-Assay Low-Enriched Uranium metallic fuel enriched between 5% and 20% U-235, a fuel category lacking a mature, high-volume domestic commercial supply chain following Western disengagement from Russian enrichment suppliers. Second, the departure of Bechtel creates an active general contractor vacancy on Kemmerer Unit 1 that could trigger cost escalation or timeline slippage before replacement EPC arrangements are finalized on site. To strengthen regulatory compliance and operational discipline during this critical phase, TerraPower appointed former regulatory affairs head George Wilson as Chief Nuclear Officer in August 2026 and continues advancing parallel pipeline initiatives including the Molten Chloride Fast Reactor and Actinium-225 medical isotope commercialization.
  claimRefs:
  - CE002
  - CE008
  - CE011
  - CE012
  - CE013
  - CE015
