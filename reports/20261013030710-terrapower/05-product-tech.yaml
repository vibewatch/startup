  title: General Contractor Realignment and HALEU Supply Chain Vulnerabilities
  body: Following Bechtel's departure from the Kemmerer project in late 2026, TerraPower faces near-term general contractor transition risks while remaining dependent on nascent domestic HALEU enrichment capacity to meet commercial fuel load timelines.
  claimRefs:
