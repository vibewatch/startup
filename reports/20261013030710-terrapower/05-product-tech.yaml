- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Baseline Workflow
  - Natrium Solution Architecture
  - Measurable Benefit
  - Technical Limitation
  rows:
  - - Baseload Firm Carbon-Free Power
    - Pressurized light-water reactors or coal-fired plants
    - Continuous 345 MWe nuclear fission utilizing HALEU metallic fuel pins
    - Steady zero-carbon generation with smaller physical plant footprint
    - Requires HALEU fuel enrichment infrastructure currently scaling up
  - - Grid Peaking & Renewable Integration
    - Open-cycle natural gas peakers or 4-hour Li-ion battery arrays
    - Thermal discharge from molten salt tanks boosting electric output to 500 MWe
    - 5.5+ hours of dispatchable 155 MWe boost with synchronous grid inertia
    - Round-trip thermal heat loss in molten salt tanks during prolonged storage
  - - Industrial Steam & Heat Co-generation
    - Dedicated fossil gas boilers with volatile fuel expense
    - High-temperature thermal extraction before power conversion turbine
    - Consistent high-enthalpy thermal heat delivery for industrial processing
    - Co-location regulatory licensing constraints near population centers
  - - Coal Plant Brownfield Repowering
    - Costly greenfield site development with new transmission lines
    - Siting on retired coal facility (Kemmerer, WY) reusing water and grid interconnection
    - Saves hundreds of millions in electrical switchyard and line expansion
    - Requires specialized civil excavation for underground nuclear reactor silo
  notes: Metrics reflect design specifications for 345 MWe base output and 500 MWe peak thermal storage.
