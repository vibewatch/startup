    - Doosan Enerbility (vessel), Global Nuclear Fuel-Americas (fabrication)
    - First-of-a-kind manufacturing tolerances and sodium wetting verification
  - - Intermediate Heat Transport Loop
    - Hydraulic isolation separating radioactive primary sodium from salt
    - Specialized sodium electromagnetic pumps and heat exchanger suppliers
    - Thermal shock transients during abrupt reactor trip or salt loop trip
  - - Thermal Energy Storage & Power Conversion
    - Molten salt storage and commercial steam turbine generator
    - Standard industrial EPC contractors (HDEC framework)
    - Transition from Bechtel to replacement general contractor for civil build
  - - Plant Controls & Regulatory Compliance
    - Plant monitoring, digital twin modeling, and safety compliance
    - George Wilson (CNO), SK Innovation (digital twin collaboration)
    - NRC Operating License application review timeline and technical audits
