        blocks:
          - type: paragraph
            body: >-
              TerraPower 的核心反应堆商业化业务仍未产生收入；在 2026 年 3 月取得 NRC 建造许可证后，Wyoming Kemmerer Unit 1 示范电站的首次售电目标为 2030 至 2031
              年。公司未来预计通过三条渠道变现：公用事业购电协议下的发电收入、批量部署反应堆的技术许可费，以及超大规模企业清洁电力容量预留。2026 年 1 月，Meta 同意支持最多 8 座 Natrium
              先进核电站开发，代表最高 2.8 GW 基荷和 4 GW 峰值输出，为私人需求提供验证。与反应堆平台尚未产生收入不同，TerraPower Isotopes 已在商业运营，根据制药供应合同每周生产
              actinium-225，用于靶向癌症放射疗法，但独立同位素收入仍属私人信息。
