chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与产品模式
        blocks:
          - type: paragraph
            body: >-
              TerraPower 是一家总部位于华盛顿州 Bellevue 的私营核能创新公司，由董事长 Bill Gates 于 2006
              年与一批愿景主义者共同创立，旨在推动清洁能源和核科学方案。公司的核心商业方向是先进核能系统及用于医疗治疗的放射性同位素生产。主要核能产品 Natrium 是与 GE Vernova Hitachi Nuclear
              Energy 合作开发的先进核反应堆电站设计。Natrium 将 345 MWe 钠冷快堆与一体化熔盐储能系统结合，可在超过 5 小时内把电力输出临时提升至 500
              MWe，从而把反应堆持续的基础热输出与电网峰值调度分开。              电站采用接近大气压的低压运行环境和液态钠冷却剂，依靠独特的 Nuclear Island 与 Energy Island
              布局实现被动安全并简化安全壳结构。与此同时，TerraPower Isotopes 作为商业子公司，从 thorium-229 中提取 actinium-225（Ac-225），为靶向 α
              粒子癌症疗法每周开展商业生产，并在 Philadelphia 建设 $450 million 的 Bellwether Laboratory，以把全球供应扩大二十倍。
            claimRefs:
