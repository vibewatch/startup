      - 核心假设
      - 估值 / 回报逻辑
      - 关键下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - Kemmerer 在 2031 年前完工；替代 EPC 的转换无缝衔接；Meta 执行全部 8 个 Natrium 机组；HDEC 的保证有效
        - 多 GW 已签约管线享有溢价倍数；战略 IPO 或超大型融资轮以气候科技一线估值为股权定价
        - HALEU 燃料和专用钠部件制造的供应链瓶颈持续更久
        - 25%
      - - 基准情景
        - Kemmerer 因重新签约小幅延误至 2032 年；首批 Meta 机组推进；第二个数据中心项目于 2027 年破土动工
        - 估值稳步上调，反映公用事业示范项目去风险化，以及超大规模云厂商商业积压订单
        - 首台核岛成本通胀；中途追加资本导致投资者股权被稀释
        - 50%
      - - 悲观情景
        - Bechtel 退出引发漫长的 EPC 重新竞标和成本超支；HALEU 供应落后；超大规模云厂商寻求替代稳定电力
        - 估值大幅折价；完成 Kemmerer 示范项目需要下轮融资或政府兜底
        - NRC 对运行许可证的审查拖延；商业框架协议被取消
        - 25%
    notes: 概率情景反映商业和监管里程碑、EPC 转换风险，以及超大规模云厂商承购动态。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV009
      - CV014
      - CV015
figures:
  - id: FO001
    title: TerraPower 企业与 Natrium 项目开发时间线
    type: timeline
    summary: 按时间梳理公司成立、联邦成本分摊入选、商业协议、监管许可及建设里程碑，覆盖 2006—2026 年。
    data:
      items:
        - date: '2006'
          label: 公司成立
          detail: Bill Gates 与一批先行者在 Washington 州 Bellevue 创立 TerraPower，开发先进核能架构。
          tone: positive
        - date: 2020-10
          label: DOE ARDP 入选
          detail: 美国能源部选定 TerraPower，提供最高 $2B 的成本分摊资金，用于示范 Natrium 钠冷却反应堆。
          tone: positive
        - date: 2022-08
          label: Series B 融资轮
          detail: TerraPower 完成 $830M 融资轮，由 SK Group 和 Bill Gates 领投，推进 Natrium 商业化。
          tone: positive
        - date: 2024-06
          label: Kemmerer 非核工程破土
          detail: Kemmerer（Wyoming）举行破土仪式，启动非核场址准备和能源岛施工。
          tone: positive
        - date: 2024-12
          label: 反应堆围护结构合同授予
          detail: Natrium 反应堆压力容器和围护结构的主要制造合同授予 HD Hyundai 与 Doosan Enerbility。
          tone: positive
        - date: 2026-01
          label: Meta 机组协议签署
          detail: Meta 与 TerraPower 签署商业协议，覆盖 2035 年前最多八座 Natrium 先进核电站。
          tone: positive
        - date: 2026-03
          label: NRC 签发建造许可证
          detail: 核管理委员会为 Kemmerer 1 号机组签发首个商用非轻水反应堆建造许可证。
          tone: positive
        - date: 2026-04
          label: 全面核电站建设开始
          detail: NRC 许可证签发后，Kemmerer 1 号机组正式开始核电站建设。
          tone: positive
        - date: 2026-08
          label: HDEC 机组 EPC 与 SK 条款清单
          detail: TerraPower 在首尔与 HDEC 签署机组 EPC 保证协议，并与 SK Innovation 签署韩国反应堆部署协议。
          tone: positive
        - date: 2026-09
          label: Bechtel 示范项目 EPC 分拆
          detail: Bechtel 在未能就 Natrium 项目下一阶段达成协议后，发布 WARN 通知，削减约 200 个 Reston 岗位。
          tone: negative
    approximationNotes: 日期以官方公告日期和监管申报为准。Kemmerer 1 号机组目标在 2030—2031 年投入商业运行。
    claimRefs:
      - CO001
      - CO008
      - CO009
      - CO010
      - CO011
      - CO013
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 从全球清洁基荷需求逐层收窄至近期已签约承购管线的市场规模层级。
    data:
      items:
        - label: 全球清洁稳定电力需求（TAM）
          value: 100+ GW
          unit: capacity
          detail: 最宽泛的可服务市场：以全天候、无碳、可调度的稳定电力替代正在退役的煤电和燃气基荷。
        - label: 先进反应堆与 SMR 替代市场（SAM）
          value: 20-50 GW
          unit: capacity
          detail: 面向非轻水先进反应堆的可服务市场，产品具备高运行温度和热储能能力。
        - label: 双角色调峰与基荷储能（可服务细分市场）
          value: 10-20 GW
          unit: capacity
          detail: 面向可再生能源渗透率高的电网，需要 345 MWe 连续发电和 500 MWe 可调度调峰能力。
        - label: 公用事业与数据中心承购管线（SOM）
          value: 2.8-4.0 GW
          unit: capacity
          detail: 已公告的双边商业协议管线，包括 Meta 最多 8 个机组的协议和 PacifiCorp 的规划。
        - label: 首台商用示范项目（Kemmerer 1 号机组）
          value: 345 MWe
          unit: capacity
          detail: Wyoming 州 Kemmerer 正在建设 345 MWe（峰值 500 MWe）示范电站，目标于 2030—2031 年完工。
        - label: 近期承诺资本基础
          value: $4.0B+
          unit: USD
          detail: 已承诺的公私融资，包括 $2.0B DOE ARDP 成本分摊资金及等额私募股权承诺。
    approximationNotes: 市场规模数据代表容量边界，综合自公用事业综合资源计划、超大规模云厂商承购承诺及 ARDP 示范项目预算。
    claimRefs:
      - CM002
      - CM005
      - CM006
      - CM012
  - id: FP001
    title: 竞争定位：输出灵活性与许可成熟度
    type: quadrant
    summary: 按调度灵活性和监管许可成熟度，对先进清洁稳定电力方案进行象限映射。
    data:
      points:
        - label: TerraPower Natrium
          x: 0.85
          'y': 0.8
          quadrant: top-right
        - label: 轻水 SMR
          x: 0.3
          'y': 0.75
          quadrant: top-left
        - label: 非轻水快堆概念
          x: 0.4
          'y': 0.25
          quadrant: bottom-left
        - label: 高温气冷堆
          x: 0.35
          'y': 0.45
          quadrant: bottom-left
        - label: 联合循环燃气 + CCS
          x: 0.7
          'y': 0.9
          quadrant: top-right
        - label: 可再生能源 + 电池 LDES
          x: 0.9
          'y': 0.95
          quadrant: top-right
    approximationNotes: X 轴表示定性调度与调峰灵活性（0 = 刚性基荷，1 = 动态调峰储能）。Y 轴表示商业监管许可和审批成熟度（0 = 概念设计，1 = 已运行或已获许可）。
    claimRefs:
      - CP001
      - CP002
      - CP004
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 从公私示范项目融资到商业机组运营，展示资本投入转化为收入的结构性链路。
    data:
      nodes:
        - id: step-1-ardp-grant
          label: DOE ARDP 50/50 成本分摊
          description: 最高 $2.0B 的联邦配套承诺，吸收首台设备开发和许可成本
        - id: step-2-private-equity
          label: 私募股权共同融资
          description: 超过 $1.0B 的私募风险资本和战略股权，与公共示范资金配套
        - id: step-3-res-manufacturing
          label: 部件供应合同
          description: 与 HD Hyundai 和 Doosan 签署系列化制造协议，控制设备成本
        - id: step-4-kemmerer-build
          label: 示范项目建设
          description: 建设 Kemmerer 1 号机组，将核岛与能源岛分开，以验证设计
        - id: step-5-epc-guarantees
          label: 商业 EPC 保证
          description: Hyundai E&C 框架协议为机组提供价格、完工和履约保证
        - id: step-6-customer-offtake
          label: 超大规模客户承购
          description: Meta 2+ GW 承诺等商业管线协议转化为电力收入
        - id: step-7-isotope-cashflow
          label: 商业同位素收入
          description: Actinium-225 医用同位素销售带来近期多元化毛利率和现金流
    approximationNotes: 流程图展示从首台示范项目到商业机组变现的战略运营模式和收入机制转换。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI011
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 展示 Natrium 商用核电站的结构层级，涵盖反应堆堆芯、热输运回路、热能储存和汽轮机岛。
    data:
      layers:
        - label: 电网调度与发电岛
          detail: 按标准公用事业规模运行的常规商用汽轮发电机组
          modules:
            - 电网并网变电站
            - 汽轮发电机组
            - 负荷跟踪频率控制
          items:
            - 500 MWe 峰值电力输出能力
            - 提供同步调相和旋转备用
            - 支持可再生能源并网的快速爬坡能力
        - label: 熔盐热储能系统
          detail: 与反应堆堆芯解耦的双罐硝酸盐熔盐储能系统
          modules:
            - 热盐储罐
            - 冷盐储罐
            - 蒸汽发生器换热器
          items:
            - 冷热液态盐储罐
            - 蒸汽发生器换热回路
            - 最多 5.5 小时的连续 155 MWe 增功能力
        - label: 中间热输运回路
          detail: 非放射性二级液态钠传热回路
          modules:
            - 电磁钠泵
            - 钠—盐换热器
            - 中间回路膨胀罐
          items:
            - 中间回路钠管道和电磁泵
            - 钠—盐换热器
            - 反应堆系统与蒸汽系统之间的实体隔离屏障
        - label: 一回路钠冷却剂与反应堆池
          detail: 接近大气压运行的低压液态金属池
          modules:
            - 一回路反应堆池容器
            - 电磁一回路泵
            - 被动式 RVACS 空气换热器
          items:
            - 容纳反应堆堆芯和泵的一回路池容器
            - 被动式反应堆容器辅助冷却系统（RVACS）
            - 热裕度高，钠沸点接近 882°C
        - label: 反应堆堆芯与 HALEU 燃料组件
          detail: 使用高丰度低浓缩铀燃料的快中子能谱堆芯
          modules:
            - U-Zr 金属燃料棒
            - 控制棒驱动机构
            - 中子反射层与屏蔽组件
          items:
            - 铀—锆金属燃料合金棒
            - HALEU 浓缩度为 5%—20% U-235
            - 高燃耗和被动负反应性反馈
        - label: 土建基础设施与地下筒仓安全壳
          detail: 地下筒仓式安全壳，减少占地和地表脆弱性
          modules:
            - 地下反应堆筒仓
            - 抗震隔离支座
            - 独立核电厂辅助设施基础台
          items:
            - 地下核岛开挖
            - 抗震隔离支座和减震器
            - 独立非核能源岛基础
    approximationNotes: 层级定义综合自 TerraPower 公开技术披露和 NRC 建造许可证边界定义，后者区分核岛与能源岛结构。
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE014
