      - number: '1.4'
        title: 商业规模、许可里程碑与运营风险
        blocks:
          - type: paragraph
            body: >-
              Natrium 项目于 2026 年 3 月取得历史性监管突破：美国 Nuclear Regulatory Commission 批准 Wyoming Kemmerer Power Station Unit 1
              的建造许可证，成为美国 40 多年来首个获商业建造许可的非轻水反应堆。项目于 2026 年 4 月在一座即将退役的燃煤电厂附近开工，预计高峰期动员约 1,600 名工人，商业运营目标为 2030 至 2031
              年。商业需求端，TerraPower 于 2026 年 1 月与 Meta 达成里程碑式协议，覆盖最多 8 座 Natrium 电站（2.8 GW 基荷、可提升至 4
              GW），为企业数据中心基础设施供电。但执行仍有明显摩擦：2026 年 9 月，工程伙伴 Bechtel 提交 WARN 通知，称因未能就示范项目下一阶段商业条款达成一致，计划裁减其 Reston 总部约 200
              名员工。TerraPower 需要在推进韩国和英国车队扩张的同时，解决 Kemmerer Unit 1 的 EPC 合同问题。
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 商业车队与示范机组的双轨 EPC 模式
            body: >-
              TerraPower 选择 Hyundai Engineering & Construction（HDEC）交付未来商业车队反应堆并提供价格和性能保证，同时于 2026 年 9 月与示范承包商 Bechtel
              分开，形成双轨执行模式。该结构旨在让未来机组能够获得传统商业融资。
            calloutType: insight
            claimRefs:
              - CO011
              - CO016
          - type: callout
            title: 示范项目重新签约风险
            body: >-
              Bechtel 因未能就 Natrium 示范项目下一阶段条款达成一致而退出，立即给 Kemmerer Unit 1 带来供应链和工期不确定性。在 TerraPower 指定新的 EPC
              承包商或正式转为自营交付前，2030 至 2031 年的目标完工计划都面临更高执行风险。
            calloutType: risk
            claimRefs:
              - CO013
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、类别范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的 Natrium
              商业市场位于公用事业级稳定清洁基荷电力与电网级灵活储能的交汇处。传统核反应堆受热力和经济约束，只能作为缺乏灵活性的基荷资产运行，因此电网运营商必须用调峰天然气机组平衡风电和太阳能的间歇性。Natrium
              通过把热量生成与发电分开重划边界：345 MWe 钠冷快堆持续以满热功率运行，同时为一体化熔盐储能充电，可在超过 5 小时内把供电灵活提升至 500 MWe。因而，Natrium
              不只是传统轻水堆或小型模块化反应堆的替代品，也可直接替代高可再生能源渗透地区的天然气调峰机组和长时电池储能。通过瞄准 Kemmerer
              这类退役燃煤电站所在地，电站还可复用既有高压电网接入、水权和有经验的运营人员。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 可服务市场规模：FOAK 现实与 NOAK 车队扩张
        blocks:
          - type: paragraph
            body: >-
              评估 TerraPower 的可服务市场，必须把首堆（FOAK）示范项目经济性与长期 Nth-of-a-kind（NOAK）车队商业化分开。Kemmerer Unit 1 示范电站的官方预算为 $4.0
              billion，由 DOE Advanced Reactor Demonstration Program 按 50/50 公私成本分摊支持；NRC 于 2026 年 3 月 4
              日颁发建造许可证，构成重大监管里程碑。然而，西方核电建设的独立历史基准显示，资本支出超支概率为 80%，概率加权估算最终成本为 $9.4 billion（每 kWe
              $27,234）。一体化熔盐储能子系统约占基准资本支出的 $726 million（18.1%）。更大市场的商业可行性不取决于 Kemmerer 达到 FOAK
              基准，而取决于沿多机组学习曲线推进。行业学习模型预计，到第 8 座部署反应堆成本可下降 40%，将 NOAK 资本支出降至每 kWe $4,638–$6,957，使先进核能与国际新建项目基准具备成本竞争力。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM012
      - number: '2.3'
        title: 买方细分、采购路径与预算归属
        blocks:
          - type: paragraph
            body: >-
              先进核能的采用分化为两类买家：寻求按费率回收机制脱碳的受监管投资者所有公用事业，以及为人工智能数据中心基础设施锁定 24/7 稳定电力的技术超大规模企业。2026 年 1 月，Meta 签署最多 8 座
              Natrium 反应堆的商业协议，获得 2.8 GW 基荷电力和 4.0 GW 储能辅助峰值输出的权利，建立了企业承购路径。公用事业方面，PacifiCorp 已将两座 Natrium
              反应堆纳入长期资源规划，目标于 2033 年交付，Utah 和 Kansas 也有公用事业规划协议。为解决商业银行不愿承保无对冲核电建设风险的传统融资瓶颈，TerraPower 于 2026 年 8
              月签署框架协议，指定 Hyundai Engineering & Construction 为最多 8 座车队反应堆的 EPC 承包商，并提供完工、价格和性能保证。同时，与 SK Innovation
              的联合业务条款清单把潜在管线延伸至韩国工业电力市场。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用驱动、资本密集度与执行约束
        blocks:
          - type: paragraph
            body: >-
              推动先进核能需求的结构性因素——如超大规模企业清洁能源要求和人工智能数据中心带来的负荷激增——正受到高资本密集度与供应链依赖的即时掣肘。西方核电项目历史上相对初始预算平均出现 3.05 倍成本上升，且超过 70%
              的超支集中发生在项目完成度 20% 至 80% 之间。2026 年 9 月，长期 EPC 伙伴 Bechtel 提交 WARN 通知，称双方无法就 Kemmerer Unit 1
              下一建设阶段的商业条款达成一致并决定分开，执行风险由此具体化。为缓解部件制造瓶颈，TerraPower 已锁定一级国际供应协议，将反应堆围护系统合同授予 ENSA、Doosan Enerbility、HD
              Hyundai 和 Marmen。但 HALEU 燃料认证以及承包商过渡仍是决定商业化时间表的关键约束。
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 商业交付保证作为融资催化剂
            body: TerraPower 与 Hyundai E&C 的框架协议引入完工、价格和性能保证，试图跨越西方核电融资的历史障碍，把首堆成本风险从公用事业资产负债表上移开，以便获得商业项目债务融资。
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
          - type: callout
            title: FOAK 建设成本超支风险
            body: 独立研究汇编的历史核电建设基准显示，首堆发生成本超支的概率为 80%；西方项目相对初始估算平均达到 3.05 倍，且成本上升集中在完成度 20% 至 80% 的阶段。
            calloutType: risk
            claimRefs:
              - CM005
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 先进核能格局与竞争分类
        blocks:
          - type: paragraph
            body: >-
              先进核能商业领域包含多种技术路线，用于满足数据中心扩张和工业脱碳带来的清洁、可调度基荷及调峰电力需求。TerraPower 的旗舰 Natrium 采用钠冷快堆架构和熔盐热能储存，设计为持续提供 345 MWe
              基荷电力，并在超过 5 小时内提升至 500 MWe [CP001] [CP004]。在更广泛的竞争生态中，TerraPower
              面对三类竞争：传统轻水小型模块化反应堆（SMR）开发商及现有核电供应商；包括高温气冷和熔盐系统在内的非轻水先进反应堆；以及带碳捕集的联合循环燃气和长时电池储能等非核清洁稳定能源替代品 [CP006]。传统轻水
              SMR 受益于成熟监管先例和标准低浓缩铀供应链，却缺少 Natrium 分离式 Nuclear Island 与 Energy Island 所具备的内生热能储存和跟随负荷灵活性 [CP004]
              [CP006]。不过，钠冷快堆需要 HALEU 金属燃料和专门的液态金属供应链，相比传统压水堆形成不同的运营与采购取舍 [CP002] [CP006]。
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP002
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
      - number: '3.2'
        title: 技术差异化与交付模式比较
        blocks:
          - type: paragraph
            body: >-
              Natrium 的竞争差异化建立在两项核心架构选择上：大气压液态钠冷却，以及把核反应堆与发电汽轮机岛物理分开 [CP004]
              [CP006]。高压轻水堆需要巨大的安全壳结构以及大量核安全级混凝土和钢材，以应对压力驱动的失水事故；Natrium 则在接近大气压下运行，依靠自然循环实现被动冷却
              [CP006]。这种设计把核安全相关结构与传统商业汽轮机岛分开，旨在减少核安全级材料需求并缩短现场交付周期 [CP004] [CP006]。传统核电基荷设计以固定热功率运行，而 Natrium
              的熔盐储能可缓冲持续反应堆热量，在 345 MWe 与 500 MWe 之间调节发电，实现日内跟随负荷 [CP001] [CP004]。说到交付，核能商业化长期受成本超支和工期延误困扰。TerraPower 与
              Hyundai Engineering & Construction（HDEC）签署框架协议，为最多 8 座商业车队机组提供完工、价格和性能保证，以提升商业融资能力 [CP003]
              [CP005]。这与仍暴露于无限公用事业资产负债表责任或无对冲 EPC 执行风险的西方先进核电项目形成对比 [CP003]。
            claimRefs:
              - CP004
              - CP006
              - CP001
              - CP003
              - CP005
