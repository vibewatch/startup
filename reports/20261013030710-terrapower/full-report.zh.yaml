      - number: '4.2'
        title: 定价模式、GTM 动作与 EPC 融资
        blocks:
          - type: paragraph
            body: >-
              西方市场的先进反应堆商业化长期受到严重资本支出超支困扰，既损害公用事业资产负债表，也令私人投资者不愿评估和承接风险。为解决这一结构性障碍，TerraPower 于 2026 年 8 月选择 Hyundai
              Engineering & Construction 作为最多 8 座商业车队 Natrium 反应堆的 EPC
              承包商。框架协议包含完工、价格和性能保证，旨在把建设风险从项目所有者转移出去并解锁传统债务融资。在国际市场，公司目标是在 2034 年前把英国潜在部署的平准化电力成本降至每兆瓦时 £100 以下。Natrium
              的物理设计把 Nuclear Island 与 Energy Island 分开，大幅减少所需核安全级混凝土和结构钢，并争取从浇筑核岛混凝土到装载燃料约 36 个月完成建设。
