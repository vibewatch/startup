      - number: '1.2'
        title: 治理、领导层与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              TerraPower 由创始人兼董事长 Bill Gates 主导治理；他自 2006 年起担任董事长，为公司提供强有力的长期资本支持、全球外交渠道和战略曝光。总裁兼首席执行官 Chris Levesque
              负责执行管理，统筹北美、欧洲和亚洲的组织战略与全球商业化。2026 年 8 月，公司强化核能治理，设立 Chief Nuclear Officer 一职，并任命曾任 Regulatory Affairs
              高级副总裁、拥有 Nuclear Regulatory Commission 办公室主任经验的 George Wilson，负责核安全、许可合规和监管战略。虽然高管团队和专业核工程能力都很强，但公司仍高度依赖
              Bill Gates 的机构信誉、与外国国家元首建立双边关系以及持续的财务兜底。
            claimRefs:
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 资本结构、公共—私人分摊成本与战略伙伴
        blocks:
          - type: paragraph
            body: >-
              TerraPower 已搭建资本充足的公共—私人资产负债表，资金来源包括联邦成本分摊拨款、主权及工业战略股权和风险投资者。根据美国能源部 Advanced Reactor Demonstration
              Program（ARDP），公司获得最高 $2 billion 的联邦资金授权，用于许可、建设和运营 Wyoming 的首座 Kemmerer Unit 1 示范电站；TerraPower 及私人伙伴按 1:1
              配套。私人股权支持者包括 SK Group（SK Inc. 和 SK Innovation）、HD Hyundai（Korea Shipbuilding and Offshore
              Engineering）、ArcelorMittal 的 XCarb Innovation Fund、通过 NVentures 参与的 NVIDIA 及 Bill
              Gates，四轮主要融资累计已披露资金和成本分摊承诺超过 $4.5 billion。战略工业关系覆盖反应堆围护和建设价值链，包括与 HD Hyundai Heavy Industries
              就反应堆压力容器制造达成框架协议、由 Hyundai Engineering & Construction（HDEC）作为最多 8 座车队反应堆的 EPC 伙伴并提供完工、价格和性能保证，以及由 Doosan
              Enerbility 供应堆芯筒和安全壳容器结构。
            claimRefs:
