  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心反应堆设计与解耦式电力架构
        blocks:
          - type: paragraph
            body: >-
              TerraPower 围绕 Natrium 设计先进核能系统：345 MWe 钠冷快堆搭配熔盐热储能。传统轻水堆运行水压超过 150 个大气压，而 Natrium 使用接近大气压运行的液态金属钠冷却剂，沸点高达
              882°C。低压运行消除了高压容器泄压风险，并可在无外部应急电力的情况下通过自然空气循环被动排出衰变热。更关键的是，电站将容纳反应堆堆芯的 Nuclear Island 与容纳储热罐和蒸汽轮机发电机的非核
              Energy Island 在物理上分开。该民用工程解耦把核安全级要求严格限制在地下反应堆筒仓，使能量转换设施可按标准商业工业规范建设。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE007
