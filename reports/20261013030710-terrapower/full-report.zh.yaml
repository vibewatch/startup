              首堆 Kemmerer 示范项目的资本充足性由美国能源部 Advanced Reactor Demonstration Program 支撑，该项目授权最高 $2 billion 的 50/50
              配套成本分摊。TerraPower 在 Bill Gates 及 SK Group、HD Hyundai 等战略伙伴支持下，已累计筹集超过 $1 billion 私人股权和战略投资。但项目于 2026 年 9
              月遭遇重大执行冲击：承包商 Bechtel 在双方未能就下一建设阶段商业条款达成一致后提交 WARN 通知，宣布裁员约 200 人。截至 2026 年 9 月，TerraPower 尚未指定 Kemmerer
              Unit 1 的替代 EPC 承包商，也未披露争议是否会改变建设时间表。同时，公司正投入 $450 million 在 Philadelphia 建造 Bellwether Laboratory，计划到 2029
              年将 actinium-225 产能扩大二十倍，持续资本承诺不低。
