      - number: '5.2'
        title: 熔盐储能系统与运行调度灵活性
        blocks:
          - type: paragraph
            body: >-
              Natrium 的核心技术差异化在于一体化熔盐热能储存系统。反应堆基础热量持续稳定，相当于 345
              MWe；二次热输送系统则把热能导入双罐液态硝酸盐储能系统。在电网需求高峰或可再生能源供给间歇性不足时，储存的热能通过蒸汽发生器快速释放，把电力输出提升至 500 MWe，持续超过 5
              小时。该能力把基荷核电站变成可调度调峰资产，可提供同步惯量、频率调节和灵活跟随负荷。中间液态钠回路将主反应堆池与熔盐罐隔开，防止化学污染，并在放射性系统与传统蒸汽循环之间形成清洁的水力边界。
            claimRefs:
              - CE003
              - CE005
              - CE007
              - CE014
