            title: 超大规模科技承购方推动先进核能需求
            body: >-
              Meta 计划最多 8 座 Natrium 电站的商业框架协议显示，寻求为人工智能基础设施提供 24/7 清洁电力的超大规模科技企业，是先进反应堆私人需求的主要催化剂。但这些项目能否获得融资，取决于 EPC
              完工和价格保证，例如 Hyundai E&C 所设计的安排。
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与许可风险敞口
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月 4 日，TerraPower 取得历史性监管突破：美国 Nuclear Regulatory Commission 一致授权向 Wyoming Kemmerer Power Station
              Unit 1 颁发 10 CFR Part 50 建造许可证。这是 NRC 40 多年来颁发的首个商业非轻水反应堆建造许可证。监管审查仅用创纪录的 18 个月完成，比工作人员最初预计提前 9 个月，得益于
              Licensing Modernization Project 的风险知情方法，以及 TerraPower
              将核反应堆岛与储能岛分开的架构。但建造许可证明确不等于设计批准或运行授权。商业发电开始前，TerraPower 子公司必须提交反映实际建成反应堆设计的最终安全分析报告，并根据 Part 50 取得正式 Class
              103 运行许可证。确保最终建设符合已评估安全基础，是直到 2030 年的关键里程碑。
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
      - number: '7.2'
        title: 运营与 EPC 执行风险
        blocks:
          - type: paragraph
            body: >-
              非核场地建设虽于 2024 年开始，核岛土建也于 2026 年 4 月正式开工，但 TerraPower 立即面临项目交付风险。2026 年 9 月，主要工程、采购和施工承包商 Bechtel 向
              Virginia 劳动力官员提交 WARN Act 通知，称因未能就 Natrium 示范项目下一阶段商业条款达成一致，计划裁减约 200 名 Reston 员工。Bechtel 与 TerraPower
              双方决定分开推进。截至 2026 年末，TerraPower 尚未公开宣布 Kemmerer Unit 1 的替代总承包商，也未确认目标建设完工时间 2031 年 2 月是否会受到影响。在计划动员约 1,600
              名高峰期现场工人的建设中管理现场过渡，容易出现 FOAK 工期滑延和建设成本通胀。
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR012
              - CR014
      - number: '7.3'
        title: 供应链与燃料循环依赖
        blocks:
          - type: paragraph
            body: >-
              除现场建设管理外，TerraPower 的长期商业化战略还取决于专业工业供应链和先进核燃料供应。345 MWe Natrium 反应堆需要浓缩度最高 20% U-235 的 HALEU 金属燃料。国内商业
              HALEU 浓缩能力目前有限，公司不得不依赖联邦供应计划以及与 Centrus、ASP Isotopes、Framatome 和 GNF-A 等伙伴的开发性供应安排。设备端，TerraPower
              已建立国际供应联盟，把主要反应堆围护系统部件订单授予 HD Hyundai、Doosan Enerbility、ENSA 和 Marmen。2026 年 8 月，公司选择 Hyundai Engineering
              & Construction 作为最多 8 座商业车队机组的 EPC 伙伴，并提供完工和价格保证，扩展韩国制造合作，也支持包括 2026 年 Meta 合作在内的潜在商业承购协议。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR013
      - number: '7.4'
        title: 资本密集度与风险缓释矩阵
        blocks:
          - type: paragraph
            body: >-
              先进反应堆开发需要大量前期资本，以吸收首堆成本超支和示范风险。TerraPower 的 Kemmerer 项目受益于能源部 Advanced Reactor Demonstration Program 的
              50/50 公私成本分摊，联邦支持最高 $2 billion。为配套这一投资并锁定交付周期长的供应商承诺，TerraPower 已筹集大量私人增长股权，包括 2022 年 $830 million Series
              B 和 2025 年 $650 million。尽管如此，目前稳定清洁发电技术相对传统化石发电的估计 Green Premium 已超过 50%。商业车队能否成立，取决于 Kemmerer FOAK
              示范不发生致命预算超支、HALEU 供应可靠，以及为公用事业和超大规模客户验证标准化的保证价格 EPC 模式。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR014
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: Kemmerer Unit 1 的 EPC 转型不确定性
            body: 2026 年 9 月 TerraPower 与 Bechtel 分开，给旗舰示范电站带来显著项目执行和进度风险。在负责持续现场人员动员的替代承包商尚未最终确定前，2030-2031 年商业运营目标面临潜在阻力。
            calloutType: risk
            claimRefs:
              - CR003
              - CR005
              - CR012
          - type: callout
            title: 解耦架构作为主要安全与监管缓释因素
            body: TerraPower 将核反应堆岛与传统熔盐能量岛分开，把 NRC 安全审查严格限制在核部件内。这一架构创新促成创纪录的 18 个月建造许可审查，并使物理电站约三分之二免受核安全级质量保证负担影响。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与投资判断建议
        blocks:
          - type: paragraph
            body: >-
              TerraPower 是西方先进核能领域最领先的商业化平台，依托 345 MWe Natrium 钠冷快堆架构和 GW 级一体化熔盐热储能。公司凭借 2026 年 3 月取得的 Kemmerer Unit 1
              Nuclear Regulatory Commission 建造许可证实现了显著战略差异化——这是美国 40 多年来首个获准建设的商业非轻水动力反应堆。但严谨的机构投资判断不能只靠技术声望。TerraPower
              核心反应堆业务仍未产生收入，Kemmerer 商业运营安排在 2030 至 2031 年，其 2025 年 6 月 $650 million
              增长轮融资的投后估值、股价和清算优先权均未向公众披露。因此，我们给出继续研究建议，信心中等、风险评级高、估值立场未知。在取得经验证的私人股权结构表条款和首堆建设完工成本模型前，应暂停部署资本。
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV011
              - CV012
      - number: '8.2'
        title: 融资背景与资本结构纪律
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的融资史体现出极强的募资能力，背后是主权成本分摊机制和战略机构资产负债表。公司位于怀俄明州 Kemmerer 的示范电站由能源部先进反应堆示范计划提供 50/50 公私成本分摊，联邦资金最高
              $2.0 billion，私人资本按美元对美元配套。2025 年 6 月，TerraPower 完成 $650 million 增长轮融资，新投资方 NVentures 参与其中——这是 Nvidia
              旗下风投部门迄今最大的一笔投资，也标志着其首次进军核能——Bill Gates 和 HD Hyundai 等老股东同轮跟投。尽管拨款和股权承诺累计超过 $4.5
              billion，但公开资料没有披露股权估值、清算优先权和资产负债表现金消耗，因此无法建立可信的公开企业估值或收入倍数。投资者必须
              区分资本获取能力与企业估值：融资总额这一醒目数字说明流动性和赞助方的持续支持，但不能替代基本面估值基准。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV015
      - number: '8.3'
        title: 商业化机群势头与 EPC 执行阻力
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的商业定位迅速从怀俄明州的单机示范项目，转向面向超大规模数据中心运营商的多吉瓦商业机群战略。2026 年 1 月，Meta 签署里程碑式商业协议，支持在美国开发最多 8 座 Natrium
              电站，其中 2 座首批机组最早于 2032 年发电、总功率最高 690 MW，另可选择在 2035 年前增建 6 座反应堆、提供 2.1 GW。为让反应堆交付实现工业化，TerraPower 于 2026 年 8
              月在首尔签署里程碑式协议，选定 Hyundai Engineering and Construction 作为最多 8 座商业机组的 EPC 承包商，并提供价格、工期和性能保证，同时与 SK Innovation
              正式开展联合开发。然而，商业扩张被眼前的首堆执行摩擦严重抵消：2026 年 9 月的 WARN 通知显示，长期 EPC 承包商 Bechtel 与 TerraPower 未能就 Kemmerer 1
              号机组下一施工阶段的商业条款达成一致，双方分道扬镳， Bechtel Reston 支持中心因此裁员约 200 人。截至 2026 年 9 月，TerraPower 尚未为 Kemmerer 指定替代承包商，
              引入严重的重新签约和工期风险。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
      - number: '8.4'
        title: 情景建模、论点失效触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              为应对执行结果的不对称性，我们建立乐观、基准和悲观三种投资判断情景。乐观情景（概率 25%）下，TerraPower 顺利将 Kemmerer 1 号机组的建设移交给替代承包商，不推迟 2030 至 2031
              年的商业化目标；Meta 则在 Hyundai E&C 的交付保证下，把 8 座机组全部转化为有约束力的项目融资合同。基准情景（概率 50%）下，首堆建设摩擦 导致工期中度延误至 2032
              年，需要追加股权资本，但商业化蓝图最终得到验证。悲观情景（概率 25%）下，Bechtel 离场引发长期成本超支和许可争议，商业 HALEU 燃料供应落后，超大规模云厂商把资本转向其他清洁稳定能源。
              对任何潜在机构投资者而言，关键尽调包括：取得保密股权结构表，审阅 Kemmerer 1 号机组替代 EPC 合同结构，评估项目层面的完整现金消耗，并核实与 Centrus、ASP Isotopes 及 DOE
              HALEU 联盟签订的有约束力燃料采购协议。
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 投资判断必须取得私募条款披露
            body: >-
              TerraPower 已取得 NRC 建设许可证，且 Meta 商业项目储备强劲，但公开证据没有披露 2025 年融资轮的投后估值、股价或清算优先权。在私有资产负债表数据和 Kemmerer
              完工成本指标得到核实前，投资者应继续保持“继续研究”立场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV012
              - CV015
          - type: callout
            title: 承包商切换带来执行与成本拖累
            body: 主要 EPC 承包商 Bechtel 因未能就商业条款达成一致而退出 Kemmerer 1 号机组，这是一次关键的执行考验。 在首堆示范电站尚未指定替代承包商之前，无论长期机群协议如何，工期和成本风险都维持高位。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
