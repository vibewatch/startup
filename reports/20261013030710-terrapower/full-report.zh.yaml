      - number: '3.3'
        title: 护城河耐久性、供应链壁垒与不利执行摩擦
        blocks:
          - type: paragraph
            body: >-
              TerraPower 的商业护城河得到 2026 年 3 月取得 Kemmerer Unit 1 NRC Construction Permit CPAR-1 的强化；这是 NRC 40
              多年来颁发的首个商业非轻水反应堆建造许可证 [CP002] [CP008]。公司还拥有覆盖北美、欧洲和亚洲的专业设备供应商网络 [CP001] [CP007]。具体而言，TerraPower 已为 Reactor
              Enclosure System 的主要部件签约：HD Hyundai 供应反应堆压力容器，Doosan Enerbility 供应堆芯筒和安全壳容器，ENSA 供应反应堆顶盖，Marmen 供应旋转塞
              [CP007]。其他订单覆盖国内外的专用仪表、网络系统和控制机构 [CP001]。不过，竞争耐久性受到重大执行摩擦和行业供应链瓶颈制约。Bechtel 与 TerraPower 因无法就 Kemmerer
              Unit 1 下一建设阶段的条款达成一致而分开，给旗舰示范项目带来承包商过渡和人员重组风险 [CP005]。此外，Meta 等超大规模企业的商业承购兴趣显示清洁稳定发电存在强劲市场需求 [CP001]
              [CP003]，但 Natrium 仍需取得商业规模 HALEU 燃料，并在满规模下证明商业可靠性，才能与替代能源比较并验证单位经济性 [CP002] [CP005]。
