companyProfile:
  summary: >-
    TerraPower is a Bellevue-based advanced nuclear developer founded by Bill Gates in 2006. The company is
    commercializing the Natrium sodium-cooled fast reactor with integrated molten-salt storage and operating TerraPower
    Isotopes as a commercial actinium-225 business. It has moved from licensing into first commercial construction at
    Kemmerer while pursuing hyperscaler, utility, and international fleet opportunities.
