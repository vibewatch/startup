    - NRC construction permit materially de-risks the flagship Natrium demonstration plant.
    - Meta and other blue-chip partners validate commercial demand for fleet-scale clean firm power.
    - TerraPower has assembled unusually strong public, strategic, and industrial financing support.
  topRisks:
