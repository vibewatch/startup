callouts:
  - calloutType: "risk"
    title: "EPC Transition Uncertainty at Kemmerer Unit 1"
    body: "The September 2026 separation between TerraPower and Bechtel introduces significant project execution and schedule risk for the flagship demonstration plant. Without a finalized replacement contractor to oversee ongoing craft mobilization, the target for 2030-2031 commercial operation faces potential headwind."
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR012"
  - calloutType: "insight"
    title: "Decoupled Architecture as a Primary Safety and Regulatory Mitigant"
    body: "TerraPower's structural separation of the nuclear reactor island from the conventional molten-salt energy island confined NRC safety reviews strictly to nuclear components. This architectural innovation enabled a record 18-month construction permit review and insulates two-thirds of the physical plant from nuclear-grade quality assurance overhead."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"

