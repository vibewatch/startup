  title: "Risks"
  summary: "Comprehensive evaluation of TerraPower's risk profile across regulatory licensing hurdles, supply chain and HALEU fuel vulnerabilities, and near-term EPC execution uncertainty following the separation from contractor Bechtel."

sections:
  - id: "regulatory-and-licensing-exposure"
    title: "Regulatory and Licensing Exposure"
    body: "TerraPower achieved a historic regulatory breakthrough on March 4, 2026, when the U.S. Nuclear Regulatory Commission unanimously authorized the issuance of a 10 CFR Part 50 construction permit for Kemmerer Power Station Unit 1 in Wyoming. The approval represents the first commercial non-light-water reactor construction permit issued by the NRC in over forty years. The regulatory review concluded in a record eighteen months—nine months ahead of initial staff projections—enabled by the Licensing Modernization Project risk-informed methodology and TerraPower's architectural separation of the nuclear reactor island from the energy storage island. However, the construction permit explicitly does not constitute design approval or authorization to operate. Before commercial power generation can commence, TerraPower's subsidiary must submit a final safety analysis report reflecting the as-built reactor design and obtain a formal Class 103 operating license under Part 50. Ensuring that final construction matches the evaluated safety basis remains a critical milestone through 2030."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
    tableRefs:
      - "TR001"

  - id: "operational-and-epc-execution-risks"
    title: "Operational and EPC Execution Risks"
    body: "While non-nuclear site construction began in 2024 and nuclear-island civil works officially commenced in April 2026, TerraPower faces immediate project delivery risk. In September 2026, lead engineering, procurement, and construction contractor Bechtel filed a WARN Act notice with Virginia workforce officials announcing plans to lay off approximately 200 Reston staff after failing to agree on commercial terms for the next phase of the Natrium Demonstration Project. Bechtel and TerraPower mutually decided to move forward separately. As of late 2026, TerraPower has not publicly announced a replacement prime contractor for Kemmerer Unit 1 or confirmed whether the target construction completion timeline of February 2031 will be affected. Managing site transition during a build intended to mobilize roughly 1,600 peak craft workers creates vulnerability to FOAK schedule slippage and construction cost inflation."
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR012"
      - "CR014"
    tableRefs:
      - "TR002"

  - id: "supply-chain-and-fuel-cycle-dependencies"
    title: "Supply Chain and Fuel Cycle Dependencies"
    body: "Beyond immediate on-site construction management, TerraPower's long-term commercialization strategy hinges on specialized industrial supply chains and advanced nuclear fuel availability. The 345 MWe Natrium reactor requires High-Assay Low-Enriched Uranium (HALEU) metal fuel enriched up to 20 percent U-235. Domestic commercial HALEU enrichment capacity is currently limited, forcing reliance on federal availability initiatives and developmental supply arrangements with partners including Centrus, ASP Isotopes, Framatome, and GNF-A. On the equipment side, TerraPower has built an international supply consortium, awarding major reactor enclosure system components to HD Hyundai, Doosan Enerbility, ENSA, and Marmen. In August 2026, TerraPower expanded its Korean manufacturing partnership by selecting Hyundai Engineering & Construction as EPC partner for up to eight commercial fleet units with completion and price guarantees, supporting prospective commercial off-take agreements like the 2026 Meta partnership."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR013"
    tableRefs:
      - "TR003"

  - id: "capital-intensity-and-risk-matrix"
    title: "Capital Intensity and Risk Mitigation Matrix"
    body: "Advanced reactor development requires substantial upfront capital to absorb first-of-a-kind cost overruns and demonstration risk. TerraPower's Kemmerer project benefits from a 50/50 public-private cost share under the Department of Energy's Advanced Reactor Demonstration Program, authorizing up to $2 billion in federal support. To match this investment and secure long-lead supplier commitments, TerraPower has raised substantial private growth equity, including an $830 million Series B in 2022 and $650 million in 2025. Nevertheless, firm clean generation technology currently carries an estimated Green Premium exceeding 50 percent compared to conventional fossil generation. Commercial fleet viability depends on executing FOAK demonstration milestones at Kemmerer without crippling budget overruns, establishing dependable HALEU fuel supplies, and validating standardized guaranteed-price EPC models for utility and hyperscale customers."
    claimRefs:
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR014"
    figureRefs:
      - "FR001"

