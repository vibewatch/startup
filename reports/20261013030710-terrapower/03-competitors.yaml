    body: "Natrium's combination of a 345 MWe fast reactor with molten-salt storage offering up to 500 MWe peak output fundamentally alters the revenue model compared to inflexible baseload nuclear, enabling participation in high-value grid balancing and high-capacity-factor hyperscaler data center contracts."
    claimRefs:
      - "CP001"
      - "CP004"
  - calloutType: "risk"
    title: "Counterparty Transitions and Fuel Vulnerabilities"
    body: "Despite advanced manufacturing agreements with Korean industrial partners, the separation of Bechtel from the Kemmerer Unit 1 execution and the ongoing reliance on nascent commercial HALEU supply chains present tangible execution risks that could delay serial deployment targets."
