evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership-roster
    missingEvidence: >-
      Complete executive leadership roster including VP-level engineering, finance, and procurement leaders beyond
      disclosed executive officers.
    whyItMatters: >-
      TerraPower is transitioning from R&D to project execution, making non-public operational and project delivery
      leadership depth material to execution assessment.
    diligencePath: Obtain organizational chart and key leadership biographies during technical management diligence sessions.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: project-level-lcoe-and-unit-economics
    missingEvidence: >-
      Disclosed commercial levelized cost of electricity (LCOE) models, project-level equity returns, and exact power
      purchase agreement strike prices for Natrium fleet deployments.
    whyItMatters: >-
      Without verified LCOE benchmarks and firm PPA tariff structures, long-term commercial competitiveness against
      combined-cycle natural gas and renewables plus battery storage cannot be independently audited.
    diligencePath: >-
      Review future state regulatory utility rate-case filings from PacifiCorp or international Generic Design
      Assessment economic submissions in the United Kingdom.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: commercial-fleet-epc-guarantee-terms
    missingEvidence: >-
      Detailed terms, liability caps, and liquidated damages provisions of the Hyundai Engineering & Construction EPC
      framework agreement.
    whyItMatters: >-
      The bankability of the commercial fleet depends on whether contractor completion and cost guarantees sufficiently
      shield project debt lenders from FOAK cost overruns.
    diligencePath: >-
      Monitor subsequent project finance disclosures and lender technical advisor reports for initial commercial fleet
      builds.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: replacement EPC contractor
    missingEvidence: >-
      Public disclosure of the replacement EPC contractor or revised self-perform structure for Kemmerer Unit 1
      following Bechtel's departure.
    whyItMatters: >-
      Directly determines near-term construction schedule stability, labor mobilization, and potential cost increases
      for the first-of-a-kind demonstration plant.
    diligencePath: >-
      Review future TerraPower press releases, NRC docket updates, and DOE ARDP quarterly reports regarding Kemmerer
      site management.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: commercial HALEU pricing
    missingEvidence: >-
      Disclosed pricing benchmarks, volume commitments, and long-term delivery schedules for commercial-scale metallic
      HALEU fuel fabrication.
    whyItMatters: >-
      Fuel cycle operating costs will dictate Natrium's levelized cost of electricity relative to light-water SMRs
      operating on standard LEU fuel.
    diligencePath: >-
      Track DOE HALEU Availability Program procurement allocations and commercial contracts with ASP Isotopes, Centrus,
      and GNF-A.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy-and-burn
    missingEvidence: >-
      Audited financial statements detailing TerraPower's cash and short-term investment balances, monthly net operating
      burn rate, remaining equity runway, and revised Kemmerer Unit 1 total cost-to-complete.
    whyItMatters: >-
      Without disclosure of cash balances and project cost-to-complete, underwriters cannot verify whether existing
      private capital and DOE cost-share matching funds are sufficient to achieve commercial operation without dilutive
      bridge financing.
    diligencePath: >-
      Request confidential balance sheet disclosures, trailing 12-month cash flow statements, and the latest ARDP budget
      baseline under non-disclosure agreement.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: bechtel-epc-replacement-and-cost
    missingEvidence: >-
      Official disclosure of replacement EPC contracting arrangements, revised labor estimates, and transition terms
      following Bechtel's September 2026 departure from the Kemmerer Natrium demonstration project.
    whyItMatters: >-
      Transitioning EPC management mid-construction introduces execution friction, potential craft remobilization
      penalties, and schedule delay risks that directly impact capital burn.
    diligencePath: >-
      Review subsequent filings with the Wyoming Department of Environmental Quality and NRC project docket updates
      regarding general contractor replacement.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
