    title: "Underwriting Discipline Requires Private Term Disclosure"
    body: "While TerraPower exhibits premier technical momentum with its NRC construction permit and Meta commercial pipeline, public evidence does not disclose the post-money valuation, share price, or liquidation preferences from the 2025 financing round. Investors should maintain a research-more stance until private balance sheet data and Kemmerer cost-to-complete metrics can be verified."
    claimRefs:
      - "CV001"
