      - "CV012"
      - "CV015"
  - calloutType: "risk"
    title: "Contractor Transition Introduces Execution and Cost Overhang"
    body: "The departure of primary EPC contractor Bechtel from Kemmerer Unit 1 following a failure to agree on commercial terms marks a critical execution test. Without a named replacement contractor for the first-of-a-kind demonstration plant, schedule and cost risk remain elevated regardless of long-term fleet agreements."
