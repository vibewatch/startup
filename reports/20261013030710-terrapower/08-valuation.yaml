company:
  name: "TerraPower"
chapter:
  number: 8
  title: "Valuation"
  summary: "TerraPower combines unmatched regulatory progress and blue-chip demand with persistent financial and execution opacity. While its NRC construction permit and Meta commercial pipeline validate technical credibility, undisclosed private valuation marks and the September 2026 Bechtel EPC transition dictate a disciplined research-more stance."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment Thesis and Underwriting Recommendation"
    body: "TerraPower represents the foremost commercialization platform in the Western advanced nuclear sector, driven by its 345 MWe Natrium sodium-cooled fast reactor architecture and integrated gigawatt-scale molten-salt thermal energy storage. The company possesses extraordinary strategic differentiation through its March 2026 Nuclear Regulatory Commission construction permit for Kemmerer Unit 1—the first commercial non-light-water power reactor authorized for construction in the United States in over four decades. However, rigorous institutional underwriting cannot rely on technological prestige alone. TerraPower's core reactor business remains pre-revenue, commercial operations at Kemmerer are scheduled for 2030 to 2031, and post-money valuation marks, share pricing, and preference overhang from its $650 million June 2025 growth round remain entirely undisclosed to the public. Consequently, we assign a research-more recommendation with medium confidence, a high risk rating, and an unknown valuation stance. Capital deployment must remain on hold until verified private cap table terms and first-of-a-kind construction cost-to-complete models become available."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV008"
      - "CV010"
      - "CV012"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-context-and-valuation-discipline"
    title: "Financing Context and Capital Structure Discipline"
    body: "The financing history of TerraPower reflects exceptional capital-raising capability anchored by sovereign cost-share mechanisms and strategic institutional balance sheets. The company's demonstration plant in Kemmerer, Wyoming, is backed by a 50/50 public-private cost share through the Department of Energy's Advanced Reactor Demonstration Program, authorizing up to $2.0 billion in federal funding matched dollar-for-dollar by private capital. In June 2025, TerraPower closed a $650 million growth round featuring new backer NVentures—marking Nvidia's venture capital arm's largest investment to date and its inaugural foray into nuclear energy—alongside existing backers Bill Gates and HD Hyundai. Despite cumulative funding commitments surpassing $4.5 billion across grants and equity, the lack of disclosed share valuation, liquidation preference seniority, and balance sheet cash burn prevents establishing a credible public enterprise valuation or revenue multiple. Investors must distinguish capital access from enterprise valuation: headline funding figures demonstrate liquidity and sponsor endurance but cannot substitute for fundamental valuation benchmarks."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV012"
      - "CV015"
  - id: "commercial-momentum-versus-execution-risks"
    title: "Commercial Fleet Momentum Versus EPC Execution Headwinds"
    body: "TerraPower's commercial positioning has evolved rapidly from a single-unit demonstration in Wyoming into a multi-gigawatt commercial fleet strategy aimed at hyperscale data center operators. In January 2026, Meta signed a landmark commercial agreement supporting the development of up to eight Natrium plants in the United States, including two initial units producing up to 690 MW as early as 2032 and options for six additional reactors providing 2.1 GW by 2035. To industrialize reactor delivery, TerraPower executed landmark agreements in Seoul in August 2026, selecting Hyundai Engineering and Construction as EPC contractor for up to eight commercial units with price, schedule, and performance guarantees, and formalizing joint development with SK Innovation. However, this commercial expansion is severely counterbalanced by immediate first-of-a-kind execution friction: a September 2026 WARN notice revealed that longtime EPC contractor Bechtel and TerraPower failed to agree on commercial terms for the next construction phase at Kemmerer Unit 1 and parted ways, prompting approximately 200 layoffs at Bechtel's Reston support center. As of September 2026, TerraPower has not named a replacement contractor for Kemmerer, introducing severe re-contracting and schedule risks."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Modeling, Thesis-Break Triggers, and Diligence Asks"
    body: "To frame investment decisions across asymmetric execution outcomes, we model bull, base, and bear underwriting scenarios. In the bull case (25% probability), TerraPower smoothly transitions Kemmerer Unit 1 construction to an alternative contractor without extending its 2030 to 2031 commercial target, and Meta converts all eight units into binding project-financed contracts under Hyundai E&C delivery guarantees. In the base case (50% probability), first-of-a-kind construction friction causes moderate schedule slippage to 2032, requiring incremental equity capital but successfully validating the commercial blueprint. In the bear case (25% probability), the Bechtel departure leads to protracted cost overruns and licensing disputes, commercial HALEU fuel availability lags, and hyperscalers reallocate capital to alternative clean firm energy. Critical diligence asks for any prospective institutional investor include obtaining the confidential capitalization table, reviewing replacement EPC contract structures for Kemmerer Unit 1, assessing full project-level cash burn, and verifying binding fuel procurement agreements with Centrus, ASP Isotopes, and the DOE HALEU consortium."
    claimRefs:
      - "CV004"
      - "CV008"
      - "CV009"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
