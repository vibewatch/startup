        title: 图表
        blocks:
          - type: callout
            title: ' 平台 转变 中的 临床 AI 采购'
            body: 医疗系统已到 AI 采购的转折点。FDA 已登记 700 多个 AI/ML 设备，医院 IT 部门无法管理几十家单算法供应商，因此预算正集中到 aiOS 这类统一层，用于在医院网络中部署、治理和协调多个临床模型。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
          - type: callout
            title: 治理 、 责任 约束 中的 生成式 报告
            body: 临床 AI 从分诊通知延伸到放射科报告起草后，监管和法律风险明显上升。临床文档中的错误、幻觉和自动化偏差会直接带来医疗过失责任，因此必须保留严格的人在回路监督和监管设计。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争 格局：直接 同行、在位者、、 单点 方案
        blocks:
          - type: paragraph
            body: >-
              急性和诊断医疗的临床 AI 已从单算法竞争演变为多层平台市场。急性放射分诊主要由 Aidoc、Viz.ai 和 RapidAI 三个平台占据商业讨论，三者都称覆盖约 2,000
              家医院，表面触达相近，却掩盖了真实账户深度和多重采购。市场还包括企业影像 IT/PACS 厂商、CADt 单点算法开发商，以及 Practice Fusion 等门诊健康 IT。门诊 EHR
              主要服务病历和计费，不做影像分诊；PACS 厂商既是集成渠道，也可能成为 AI 工作列表注入的守门人。头部三家差异已从卒中检测准确率转向多专科平台编排、基础模型和机构 EHR 集成。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
