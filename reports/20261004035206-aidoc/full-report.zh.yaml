      - number: '4.2'
        title: 市场进入 动作、销售 周期、、 服务 交付 经济性
        blocks:
          - type: paragraph
            body: >-
              Aidoc 采用高接触企业直销，并结合临床集成和医疗渠道关系 [CI006]。部署触及急诊、放射、心脏和神经血管流程，受 IT 治理、HIPAA、Data Privacy Framework
