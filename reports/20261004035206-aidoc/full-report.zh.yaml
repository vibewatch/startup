        title: 资本化 历史、企业 规模、、 里程碑 演进
        blocks:
          - type: paragraph
            body: >-
              Aidoc 在五轮主要融资中持续获得顶级科技和成长股权投资者支持。继 2022 年 6 月完成 $110 million 扩张轮后，公司于 2026 年 4 月完成由 Growth Equity at
              Goldman Sachs Alternatives 领投的 $150 million Series E，General Catalyst、SoftBank Vision Fund 2 和
              NVentures（NVIDIA 的风险投资部门）跟投。已披露累计融资超过 $500 million，为大规模临床基础模型部署提供资金。平台每年支持约 60 million 名患者的临床决策，迄今累计评估超过
