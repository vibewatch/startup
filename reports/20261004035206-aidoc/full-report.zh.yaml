      - number: '1.2'
        title: 创始 领导层、高管 背景、、 关键人物 依赖
        blocks:
          - type: paragraph
            body: >-
              Aidoc 于 2015 年 10 月由 CEO Elad Walach 与以色列国防军 Talpiot 技术项目校友共同创立。Walach
              拥有耶路撒冷希伯来大学计算机科学与物理学学士学位、特拉维夫大学计算机科学硕士学位，创办 Aidoc 前曾在以色列空军负责人工智能研究。在其十年管理下，公司从放射科算法原型发展到拥有 400 多名员工、覆盖全球近
              2,000 家医院的企业。治理结构仍高度依赖 Walach 的运营与技术背景，同时由北美和欧洲的资深医疗商业团队平衡；公司按 EU-U.S. Data Privacy Framework
              合规，并接受美国联邦贸易委员会监督，争议由 JAMS 和 ICDR-AAA 等独立机制处理。
