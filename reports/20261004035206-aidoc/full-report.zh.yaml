      - number: '3.2'
        title: 同行 画像 、 平台 对比 单点-方案 架构
        blocks:
          - type: paragraph
            body: >-
              同行架构呈现不同路径。Aidoc 通过 aiOS 和 CARE 基础模型把自有算法与经过审核的第三方模块编排到放射、心脏和神经科；Viz.ai 偏重移动端神经血管协同和专家激活，RapidAI 则建立在卒中
              CT/MRI 灌注分析上。独立临床评估显示，CADt 单点厂商正面临商品化和整合压力，因为 CIO 不愿为单个适应症维护定制集成、服务器和供应商合同。平台分诊已带来运营改善：2024 年 SNIS
              会议数据称，Aidoc 部署后急性卒中患者从入门到穿刺时间减少 38 分钟。但效果高度依赖扫描仪协议、层厚和重建核，仍需逐站验证，单点厂商常无法支持。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
              - CP013
