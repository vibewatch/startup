  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 部署转化为经验证的经常性增长、强留存、有吸引力的贡献利润率，以及 清晰的优先权结构。
        - 没有数据支持数值区间；只有在取得经审计指标和已披露入场价格后，才能测试上行空间。
        - 商业转化、临床表现、实施成本和监管义务。
        - 积极信号是新近融资和公司声称的规模；经济性仍未经验证。
      - - 基准
        - 产品扩张和医院采用继续，但收入质量和资本效率仍 不确定。
        - 没有数据支持数值区间；标准化稀释和优先权 条款后，再从回报目标出发谈判。
        - 采购周期长、客户集中、模型成本和后续资本需求。
        - 混合：运营活动可见，但核心估值分母缺失。
      - - 悲观
        - 商业收益不足以覆盖产品、集成、合规和支持成本，或高级条款吞噬 退出价值。
        - 没有现金、债务和瀑布数据，无法界定下行幅度；下轮降价融资或普通股权益价值 损失仍有可能。
        - 流动性约束、隐私责任、融资依赖和疲弱的客户经济性。
        - 若未达增长或留存计划、现金跑道缩短、监管证据不利或融资条款惩罚性 条款出现，则触发。
    notes: 情景为定性判断，因为指定公开证据没有入场估值、ARR、利润率、现金 余额、出售的所有权比例或优先权瀑布；未估计概率百分比或估值倍数。
