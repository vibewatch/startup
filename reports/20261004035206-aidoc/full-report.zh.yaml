          x: 1.8
          'y': 3.1
          detail: 医院核心影像档案和阅片工作列表，作为 AI 模块的集成主机或 分发渠道。
        - label: 门诊 EHR 与诊所 IT
          x: 1.1
          'y': 1.3
          detail: 在相邻的非放射科临床工作流中运行的门诊电子健康记录和诊所管理系统。
    approximationNotes: 厂商坐标基于分析师和厂商来源记录的产品广度及 架构集成能力，在 1-5 级上进行定性序数排名。
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP008
  - id: FI001
    title: Aidoc 商业收入与利润率流转架构
    type: flow
    summary: 按顺序展示医院扫描量和临床算法部署如何转化为 企业订阅 ARR 和运营利润率。
    data:
      nodes:
        - id: n1
          label: 医院扫描量
          value: 120M+ cumulative cases analyzed across radiology
        - id: n2
          label: aiOS 工作流集成
          value: PACS/EHR triage flagging and care team activation
        - id: n3
          label: 企业订阅 ARR
          value: Annual recurring license fee per facility / health system
        - id: n4
          label: 销售成本
          value: Cloud infrastructure (AWS/NVIDIA) and monitoring
        - id: n5
          label: 毛贡献利润率
          value: Operating capital reinvested into CARE foundation model R&D
        - id: n6
          label: 运营再投资与研发
          value: Continuous model retraining and regulatory compliance
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 流程展示商业模式机制；数值转化百分比属于保密的私有指标。
    claimRefs:
      - CI001
      - CI002
      - CI008
  - id: FE001
    title: Aidoc 临床 AI 架构栈
    type: stack
    summary: 支撑 Aidoc 临床 AI 解决方案的分层软件、云基础设施和企业工作流栈。
    data:
      layers:
        - label: 临床应用与报告层
          detail: 面向终端用户的临床界面，包括 First Read 草稿报告生成、急性 CT 分诊通知和 桌面阅片器界面。
        - label: aiOS 编排与集成层
          detail: 管理 PACS/EMR 集成、医院 DICOM 接入和临床工作列表 同步的企业运营层。
        - label: 深度学习与模型推理层
          detail: CARE 基础模型和专用急性异常检测模型在 Amazon EC2 P3 GPU 集群上运行推理。
        - label: 云与本地基础设施层
          detail: Amazon S3 匿名化影像存储、Amazon RDS 元数据仓库和 VA Enterprise Cloud VM 桌面 实例。
        - label: 治理与合规基础
          detail: EU-U.S. Data Privacy Framework 认证、VA TRM 技术标准（Handbook 6500）以及 FDA 研究性器械监督。
        - label: 安全与传输控制
          detail: 网络边界加密、访问日志以及临床集成中的严格 数据处理保障。
    approximationNotes: null
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE009
      - CE010
  - id: FU001
    title: 企业客户采用旅程与扩张生命周期
    type: journey-map
    summary: 医疗系统从最初的急诊科急性分诊，发展到全企业 aiOS 部署和 参与治理联盟。
    data:
      items:
        - label: 技术验证与 DICOM 接入
          touchpoints:
            - IT 安全与云 / 本地架构审查
            - 通过 DICOM 监听器连接 PACS 并测试静默模式
            - 两周历史验证与诊断一致性基准测试
        - label: 临床入驻与科室上线
          touchpoints:
            - 解决方案成功经理工作流映射与 ARRT 认证培训
            - 神经血管与心肺急症的主动工作列表分诊
            - EHR 警报推送至 InBasket，并路由至移动寻呼升级
        - label: 多机构 IDN 标准化
          touchpoints:
            - 在各医院园区推广企业 aiOS
            - 集中式分析仪表板监测周转 KPI
            - 扩展病理模块（卒中、PE、ICH、颈椎骨折）
        - label: 企业治理与联盟共创
          touchpoints:
            - 高管参与诊断 AI 联盟
            - 基础模型（CARE）预读与智能体工作流评估
            - 多年软件订阅续约与跨专科扩张
        - label: 纵向监测与模型漂移审计
          touchpoints:
            - 跨扫描仪和患者群体的持续性能监测
            - 上市后临床反馈闭环与多站点一致性追踪
            - 集中式高管报告诊断周转时间指标
        - label: 超越放射科分诊的平台扩展
          touchpoints:
            - 扩展至 First Read 胸部 X 光报告起草
            - 急诊科、神经科和肺科护理团队之间的跨专科协作
            - 第三方 AI 算法托管与企业 aiOS 集中化
    approximationNotes: 旅程阶段综合 MedAI Verdict、招聘说明和 联盟公告中记录的实施时间线。
    claimRefs:
      - CU001
      - CU004
      - CU009
      - CU015
  - id: FR001
    title: 暂定残余风险热力图
    type: matrix
    summary: 对六项暴露的定性排序；不是事件概率估计。
    data:
      columns:
        - 可能性证据
        - 潜在影响
        - 缓解措施成熟度
        - 残余严重性
      rows:
        - label: 临床模型或报告错误
          values:
            - 已知风险；未披露发生率
            - 可能达到关键程度
            - 正在形成
            - 高
        - label: 授权延迟或范围限制
          values:
            - 结果未量化
            - 高
            - 仅 First Read 获得突破性认定
            - 高
        - label: 隐私或处理方控制失败
          values:
            - 未披露频率
            - 高
            - 框架已披露；无法获得控制测试
            - 中高
        - label: 平台中断或集成失败
          values:
            - 未披露频率
            - 高
            - 公开 SLA 不可用
            - 高
        - label: 合作伙伴算法治理失败
          values:
            - 未披露频率
            - 高
            - 声称已审查；控制不可用
            - 中高
        - label: 资本或单位经济性不足
          values:
            - 消耗和现金跑道不可用
            - 高
            - 已披露近期融资
            - 中高
    approximationNotes: 分析师基于引用公开证据的综合；定性标签为暂定值，不代表有数值概率、损失 估计、事件数量或现金跑道估计。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR008
      - CR010
      - CR013
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链将运营规模和融资证据，与缺失的价格、经济性和 证券条款区分开来。
    data:
      nodes:
        - id: fresh-capital
          label: $150M Series E
          detail: 新鲜资本证明融资渠道畅通，不代表已披露估值。
        - id: investment-plan
          label: CARE 与 aiOS 扩张
          detail: 公司说明的用途包括适应症、报告起草和全球部署。
        - id: scale-proof
          label: 近 2,000 家医院
          detail: 据称的部署规模需要通过合同和经济性验证。
        - id: risk-adjustment
          label: 隐私与执行风险
          detail: 临床数据处理及后续转移义务增加了尽调要求。
        - id: price-gate
          label: 价格与条款缺失
          detail: 投后估值、经济性、稀释情况和优先权瀑布均未公开。
        - id: recommendation
          label: 需进一步研究
          detail: 只有在获得主要财务和资本结构证据后，才能纳入投资判断。
      edges:
        - from: fresh-capital
          to: investment-plan
        - from: investment-plan
          to: scale-proof
        - from: scale-proof
          to: risk-adjustment
        - from: risk-adjustment
          to: price-gate
        - from: price-gate
          to: recommendation
    approximationNotes: 该流程是定性的尽调顺序，不估算估值、概率或转化率。
    claimRefs:
      - CV003
      - CV009
      - CV010
      - CV014
