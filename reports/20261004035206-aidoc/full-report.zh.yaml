  - number: 2
    title: 市场 分析
    sections:
      - number: '2.1'
        title: 市场 边界、分类、、 现状 替代方案
        blocks:
          - type: paragraph
            body: >-
              急性医疗临床 AI 市场不同于广义医疗企业软件。通用医疗 AI 处理排班、计费、收入周期和供应链等行政事务，而临床 AI 直接处理 CT、X
              光等诊断信号，实时影响患者路径。急性系统过去用单点机器学习算法处理卒中和颅内出血分诊，但维护负担、集成复杂度和流程割裂正让采购方排斥这些工具，预算转向连接医疗设备、PACS 和 EMR 的企业级临床 AI
              操作系统。现状仍由放射科医生人工阅片、远程放射服务合同和值班专家升级处理主导，同时受到严重人手短缺和积压加剧的影响。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场 规模测算 视角、增长 驱动因素、、 诊断 需求
        blocks:
          - type: paragraph
            body: >-
              企业临床 AI 的可服务市场不能只看一份宽泛软件预测，还要结合急性医院需求、影像检查量和诊断产能约束。美国门诊影像周转时间在 2014 至 2023 年间翻倍以上，急诊 CT 周转最长可增加 150
              分钟住院时间；全国每年诊断错误和延误至少造成 400,000 人死亡，因此自动分诊和报告初稿具有紧迫的临床与运营价值。全球数千家急性医院的平台已分析数千万次扫描，早期商业覆盖约 2,000 家机构；2026 年
              $150 million Series E 和累计超过 $500 million 的披露资本，显示投资者更看好平台整合而非单点方案。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
