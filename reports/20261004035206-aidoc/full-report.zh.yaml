      - number: '2.3'
        title: 买方 分层、采购 路径、、 实施 约束
        blocks:
          - type: paragraph
            body: >-
              临床 AI 的企业采购涉及临床专家、放射科领导、医院运营高管和医疗系统 CIO。CIO 与临床工程团队要求 aiOS 这类集中架构，以消除部门 IT 孤岛并满足数据隐私框架；CMO
              和急诊负责人则看重吞吐量、住院时长和 PERT、卒中团队等多学科协作的可验证改善。系统还要处理 EU-U.S. Data Privacy Framework
              的跨境传输、生成式报告的自动化偏差与临床责任，以及大规模变更管理。合同通常按年订阅，但长期软件替换率和净运营利润率仍缺少证据。
