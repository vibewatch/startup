figures:
  - id: FO001
    title: Aidoc 创立与商业平台演进时间线
    type: timeline
    summary: 公司历经十年，从军事 AI 研究人员创立发展到企业临床平台 规模化、完成多轮重大融资并获得 FDA 突破性器械认定。
    data:
      items:
        - label: 在特拉维夫创立公司
          date: 2015-10
          tone: positive
          details: Elad Walach 与 Talpiot 技术校友共同创立 Aidoc，率先将深度学习图像分诊用于急性 放射科。
          claimRefs:
            - CO005
        - label: 急性分诊的基础 FDA 批准
          date: 2018-08
          tone: positive
          details: 取得头部 CT 颅内出血和颈椎骨折分诊应用的初始 FDA 批准 。
          claimRefs:
            - CO004
        - label: 风险投资扩张融资轮
          date: 2022-06
          tone: positive
          details: 募集 $110 million 风险资本扩张资金，加快企业医院软件在 北美的采用。
          claimRefs:
            - CO009
        - label: 使用条款与公司网站更新
          date: 2022-11
          tone: neutral
          details: 网站及软件适用条款更新，明确特拉维夫管辖权和标准运营 保修免责声明。
          claimRefs:
            - CO002
        - label: CARE 临床基础模型发布
          date: 2025-01
          tone: positive
          details: 开发专有 CARE 基础模型架构，用单一引擎支持全面的多疾病分诊。
          claimRefs:
            - CO010
        - label: 首次获得分诊突破性器械认定
          date: 2025-09
          tone: positive
          details: FDA 为 CARE Triage 授予突破性器械认定，加快基础模型影像的监管 路径。
          claimRefs:
            - CO012
        - label: 高管领导与规模里程碑
          date: 2026-04
          tone: positive
          details: Elad Walach 担任 CEO 满十年获认可；员工数超过 400 人，安装基础覆盖 超过 1,000 家机构。
