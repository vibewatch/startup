      - number: '3.3'
        title: 商业 打包、交易 经济性、、 预算 摩擦
        blocks:
          - type: paragraph
            body: >-
              企业临床 AI 的商业采购通常是多年 SaaS 承诺，但价格高度不透明。Aidoc 面向 C-suite 和医院服务线负责人，签署单笔 $500,000 以上的多年合同，并试图在保持 95%
              留存的同时让年度支出至少扩大两倍。与 Practice Fusion 发布按医生计费的透明月价和试用不同，企业临床 AI 不公布统一价目表。Aidoc
              按算法启用和年度检查量收取订阅费，新增适应症会显著推高机构支出，也迫使医院在没有谈判前基准数据的情况下评估复杂组合。自动分诊的救命和吞吐收益归卒中神经科、血管外科和急诊等服务线，但软件费用通常记在放射科或企业
              IT 预算，形成长期错配。
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河 持久性、CADt 约束、、 Alert Fatigue 风险
        blocks:
          - type: paragraph
            body: >-
              Aidoc 护城河的持久性取决于监管边界、告警疲劳和系统切换成本。其核心许可属于 FDA 的 CADt
              分类，只能重排工作列表并通知疑似时间关键发现，不能给出确定诊断或替代认证放射科医生阅片。因此，以减少医生编制或阅片量为前提的 ROI
              会在监管审查下失效，每项影像仍须完整人工阅片。模型为避免颅内出血、肺栓塞等致命病变漏报而追求高敏感度，误报会频繁发生；若系统不在本地患者组合中严审阳性预测值，放射科告警疲劳可能在数月内侵蚀信任。切换成本主要来自深度
              PACS 集成和 EU-US Data Privacy Framework 下的数据治理，而非算法排他性；商业条款把供应商总责任限制在近期订阅费并否认诊断保证，临床责任仍由医院医生承担。
            claimRefs:
              - CP004
              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: CADt 监管 边界 、 诊断 Workload Misconception
            body: >-
              企业买方常以为自动分诊能减少放射科编制或阅片负担，但 Aidoc 的 510(k) 许可属于 CADt，只允许工作列表重排和临床通知，不允许独立诊断。每项影像仍需完整人工阅片，因此 ROI
              不能建立在减少人员或取消阅片上。
            calloutType: risk
            claimRefs:
              - CP004
              - CP010
          - type: callout
            title: 平台 Layer aiOS as a Multi-Algorithm 护城河
            body: >-
              急性卒中分诊算法在 Aidoc、Viz.ai 和 RapidAI 之间已大体同质化，Aidoc 的防御力来自 aiOS。它接入企业
              PACS，并在放射、心脏和神经科编排自有及第三方算法，让希望用单一治理和部署层替代零散集成的 IDN 面临更高切换成本。
            calloutType: insight
            claimRefs:
              - CP006
              - CP008
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入 模型、定价 机制、、 商业 打包
        blocks:
          - type: paragraph
            body: >-
              Aidoc 主要向医院、IDN 和门诊影像中心销售 B2B 企业订阅 [CI001]。aiOS 作为操作和部署层，把临床算法嵌入 PACS 与 EHR
              [CI002]。具体美元标价和按扫描收费是保密条款，合同通常按床位量、机构数或服务线算法覆盖，将固定平台费与分级许可结合 [CI003]。标准在线条款把总责任限制在客户此前三个月支付的费用
              [CI004]；由于没有公开价目和单机构实际收入基准，合同价值分布无法精确量化 [CI005]。
            claimRefs:
              - CI001
