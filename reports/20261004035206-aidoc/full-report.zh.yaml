chapters:
  - number: 1
    title: 公司 概览
    sections:
      - number: '1.1'
        title: 企业 身份、运营 架构、、 双重 布局
        blocks:
          - type: paragraph
            body: >-
              Aidoc 是一家面向企业的临床人工智能软件公司，专注于加快急性医疗系统的诊断决策并减少诊断错误。公司由位于以色列特拉维夫的 Aidoc Medical Ltd. 和纽约曼哈顿的 Aidoc Inc.
              共同运营，连接以色列国防体系培养的深度技术工程能力与美国及国际医疗系统的商业分发。平台以 CARE 临床基础模型和 aiOS 企业 AI 操作系统为核心，把影像分诊和临床工作流通知直接嵌入医院 PACS 与
              EHR；相比割裂的单点算法，它强调集中式 AI 编排、基于 FHIR 的 Epic 等 EHR 集成，以及从紧急分诊到生成式放射科初稿的完整自动化。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
