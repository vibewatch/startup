evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration-completeness
    missingEvidence: Complete unredacted executive committee and full board of directors roster beyond public corporate announcements.
    whyItMatters: >-
      Independent board oversight, voting rights, and audit committee governance cannot be verified from press releases
      alone.
    diligencePath: Inspect company corporate registry filings and board resolution records under NDA.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation-and-terms
    missingEvidence: >-
      Post-money equity valuation, liquidation preference seniority, and investor dividend covenants for the April 2026
      Series E financing.
    whyItMatters: >-
      Without valuation multiples and preference stack terms, exact investor return hurdles and common equity dilution
      cannot be modeled.
    diligencePath: Review the Series E Certificate of Incorporation, voting agreement, and capitalization table under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited annual recurring revenue (ARR), gross margins, net revenue retention (NRR), and cash burn rate for FY2025
      and 2026.
    whyItMatters: >-
      Hospital software contract economics and operating runway cannot be verified solely from total funding
      announcements.
    diligencePath: >-
      Audit GAAP financial statements, trailing twelve-month revenue by product line, and management subscription churn
      reports under NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: sam-som-penetration
    missingEvidence: >-
      Audited ARR breakdown by health system tier and verified software license renewal rates across the 2,000 hospital
      customer base.
    whyItMatters: >-
      Without private ARR disclosure, serviceable obtainable market (SOM) dollar conversion cannot be modeled
      independently from total hospital counts.
    diligencePath: >-
      Review confidential customer contracts, renewal cohorts, and average annual recurring contract values (ACV) under
      NDA.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: reimbursement-codes
    missingEvidence: >-
      Health system level Medicare New Technology Add-on Payment (NTAP) and Category III CPT reimbursement revenue
      capture data.
    whyItMatters: >-
      Reimbursement direct payments accelerate health system adoption and shorten ROI payback periods for radiology AI
      software.
    diligencePath: >-
      Audit CMS reimbursement claims data and hospital billing code utilization reports for clinical AI triage
      algorithms.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Audited multi-algorithm rate cards, discount schedules, and volume-based pricing tiers for Aidoc and direct peers
      Viz.ai and RapidAI.
    whyItMatters: >-
      Without transparent pricing data, health systems and diligence evaluators cannot benchmark cost-effectiveness or
      model long-term total cost of ownership across multi-specialty rollouts.
    diligencePath: >-
      Review actual health system procurement contracts, RFP responses, or vendor invoices under non-disclosure
      agreements.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: hospital-adoption-parity
    missingEvidence: >-
      Independent third-party verification of active production hospital deployments comparing Aidoc, Viz.ai, and
      RapidAI.
    whyItMatters: >-
      All three vendors claim approximately 2,000 hospital relationships, obscuring actual market share, account
      penetration, and multi-homing across health systems.
    diligencePath: >-
      Survey enterprise health system radiology and neuroscience service lines to determine primary versus secondary
      vendor deployments.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: annual-recurring-revenue
    missingEvidence: >-
      Audited income statements, ARR schedule by product line, and average contract value (ACV) across the ~2,000
      hospital customer base.
    whyItMatters: >-
      Without ARR and contract values, top-line revenue scale, growth velocity, and valuation multiples cannot be
      reliably verified.
    diligencePath: >-
      Request confidential management financial presentation, trailing twelve-month income statement, and ARR waterfall
      bridge under NDA.
    relatedQuestionRefs:
      - QI001
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-gross-margin
    missingEvidence: >-
      Breakdown of cost of goods sold (COGS) including cloud computing fees (AWS/NVIDIA GPU instances), clinical
      annotation, and support overhead.
    whyItMatters: >-
      Healthcare AI operating systems can face heavy GPU compute and infrastructure costs that compress software gross
      margins below traditional SaaS levels.
    diligencePath: Obtain departmental expense ledger and cloud hosting invoice reconciliations for trailing four quarters.
    relatedQuestionRefs:
      - QI003
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Monthly cash burn, operating cash flow, revolving credit facility utilization, and ending cash balances as of the
      April 2026 Series E close.
    whyItMatters: >-
      Determines how long the $150M Series E extends operating runway given a 600+ employee headcount and high
      computational R&D requirements.
    diligencePath: Inspect cash flow statements, bank balance confirmations, and corporate budget forecasts for fiscal 2026-2027.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: >-
      Audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), multi-year cohort churn rates, and contract
      renewal rates across hospital tiers.
    whyItMatters: >-
      Public data confirms extensive initial deployment footprint but leaves multi-year subscription durability and
      contract expansion unverified.
    diligencePath: >-
      Request audited NRR/GRR schedules, cohort retention curves, and annual customer renewal metrics under
      confidentiality review.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: revenue-concentration
    missingEvidence: Top-5 and top-10 customer account share of total annual recurring revenue and channel revenue splits.
    whyItMatters: >-
      High exposure to master service agreements with national practice networks or mega-IDNs could create enterprise
      churn volatility.
    diligencePath: Review revenue concentration schedules and master customer service contracts.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: legal-regulatory-record
    missingEvidence: >-
      Current regulator, recall, enforcement, court, patent, sanctions, and security-incident records for Aidoc and its
      regulated products across material jurisdictions.
    whyItMatters: >-
      The assigned pool cannot establish whether material cases or incidents exist, so legal and regulatory severity
      cannot be converted into an evidence-based event probability.
    diligencePath: >-
      Search FDA and non-U.S. regulator databases, court dockets, patent offices, sanctions lists, breach registries,
      and customer incident records; reconcile results with counsel.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: clinical-operational-controls
    missingEvidence: >-
      Product-level SLAs, uptime and alert-latency history, security audits, model validation, drift thresholds,
      override rates, CAPA files, and post-market safety-event data.
    whyItMatters: >-
      Public risk acknowledgements and workflow descriptions do not demonstrate that controls work at the reported
      deployment scale.
    diligencePath: >-
      Review customer SLAs, status and incident exports, SOC reports, model cards, site-level validation, monitoring
      dashboards, rollback tests, and safety committee minutes.
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: capital-risk
    missingEvidence: >-
      Cash balance, monthly net burn, debt and preference obligations, revenue, gross margin, customer concentration,
      partner concentration, and downside runway.
    whyItMatters: Funding raised does not establish cash available or the durability of the operating model.
    diligencePath: >-
      Obtain audited financials, current management accounts, cap table, financing documents, customer and vendor
      concentration schedules, and a downside cash bridge.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: valuation-and-security-terms
    missingEvidence: >-
      Current pre-money and post-money valuation, price per share, fully diluted ownership, dilution, debt, liquidation
      preferences, participation rights, and side letters.
    whyItMatters: >-
      Entry price and the distribution waterfall determine whether operating success can produce the required investor
      return.
    diligencePath: >-
      Obtain the signed Series E term sheet, charter, capitalization table, investor-rights agreement, debt schedule,
      and management waterfall model; reconcile every security on a fully diluted basis.
    relatedQuestionRefs:
      - QV003
  - type: missing-source
    severity: material
    topic: comparable-valuation
    missingEvidence: >-
      Denominator-matched public-company, private-round, or M&A observations with revenue basis, growth, margins,
      transaction date, and security terms.
    whyItMatters: >-
      A comparable multiple is not meaningful without matching business model, financial denominator, growth,
      profitability, and transaction structure.
    diligencePath: >-
      Build a banker-supported comparable set after Aidoc supplies audited revenue, recurring-revenue definitions, gross
      margin, growth, retention, and transaction perimeter.
    relatedQuestionRefs:
      - QV006
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Audited revenue, recurring-revenue bridge, gross margin, retention, customer concentration, implementation cost,
      compute cost, cash balance, burn, and runway.
    whyItMatters: >-
      These metrics determine capital efficiency, financing need, scenario credibility, and the sustainable valuation
      method.
    diligencePath: >-
      Request audited statements, monthly management accounts, customer cohorts, bookings-to-revenue bridge, cloud-cost
      allocation, concentration schedule, and board-approved operating plan.
