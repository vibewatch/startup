chapter:
  number: 5
  title: "Product & Technology"
  summary: "Aidoc develops an acute imaging triage and clinical AI platform anchored by its proprietary aiOS operating system and CARE foundation model, combining AWS cloud orchestration with on-premise hospital VM deployments. In June 2026, Aidoc received FDA Breakthrough Device Designation Q260882 for First Read to generate draft radiology reports from chest radiographs, while core acute triaging algorithms operate across CT workflows."
sections:
  - id: product-definition-overview
    title: "Clinical Workflow and Product Line Definition"
    body: "Aidoc positions its technology as a clinical AI operating layer designed to alleviate acute imaging backlogs in emergency and inpatient healthcare environments. Rather than acting as an autonomous diagnostic authority, Aidoc's decision-support software analyzes medical imaging scans to flag acute abnormalities, prioritize life-threatening cases on radiologist worklists, and accelerate multidisciplinary care team coordination. The product catalog spans specialized computer-vision algorithms for acute computed tomography (CT) triage—such as intracranial hemorrhage, pulmonary embolism, and abdominal abnormalities—paired with emerging generative capabilities like First Read for chest radiographs. First Read is designed to generate preliminary drafted reporting text across more than 100 pre-specified radiological findings, though final sign-off and clinical liability remain strictly reserved for certified human radiologists."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001
    figureRefs:
      - FE001
  - id: operating-architecture-infrastructure
    title: "Operating Model, Cloud Infrastructure, and Deployment Topology"
    body: "Aidoc's operating architecture couples scalable cloud-based model training and inference pipelines with localized health-system interfaces. Model training and high-throughput inference routines execute on Amazon Web Services utilizing Amazon Elastic Compute Cloud (EC2) P3 instances with GPU acceleration. Anonymized medical imagery is staged in Amazon S3 buckets, while image metadata and operational indexing reside in Amazon Relational Database Service (RDS). For clinical site integration, Aidoc supports on-premises and private-cloud VM deployments; for example, the Department of Veterans Affairs Technical Reference Model (One-VA TRM v25.4) approved the Desktop Edition of Aidoc for deployment on virtual machines within VA-controlled environments such as the VA Enterprise Cloud (VAEC). Health systems integrate the platform directly into picture archiving and communication systems (PACS) and electronic medical records (EMR) through aiOS, ensuring seamless triage alerts without disrupting baseline clinical software stacks."
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE002
  - id: regulatory-governance-technical-risks
    title: "Regulatory Pathway, Data Governance, and Diligence Risks"
    body: "Regulatory clearances and strict clinical oversight form the foundation of Aidoc's technical moat and risk profile. On June 25, 2026, the FDA granted Breakthrough Device Designation Q260882 for Aidoc's First Read solution, specifically designating four life-threatening findings in chest radiograph analysis. However, First Read remains strictly for investigational use and has not yet achieved 510(k) clearance or PMA market authorization. Data governance policies comply with international data transfer frameworks; Aidoc Inc. maintains active certification under the EU-U.S. Data Privacy Framework (DPF), UK Extension, and Swiss-U.S. DPF for pseudonymized scans and metadata processing. Conversely, commercial terms of use enforce stringent liability limitations: Aidoc explicitly disclaims all warranties regarding site and third-party content and caps aggregate direct damages at total fees paid during the trailing three months prior to a claim, underscoring that ultimate clinical responsibility rests with healthcare providers."
    claimRefs:
      - CE009
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE003
