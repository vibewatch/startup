chapter:
  number: 1
  title: "Company Overview"
  summary: "Aidoc is an acute clinical artificial intelligence enterprise software company operating dual corporate bases in Tel Aviv and New York. Founded in 2015 by CEO Elad Walach and military AI veterans, the company has raised over $500 million in total funding through an April 2026 Series E round led by Goldman Sachs Alternatives to scale its CARE foundation model and aiOS clinical operating system across nearly 2,000 hospitals worldwide."
sections:
  - id: "corporate-identity-and-operating-model"
    title: "Corporate Identity, Operating Architecture, and Dual Footprint"
    body: "Aidoc operates as an enterprise clinical artificial intelligence software provider dedicated to accelerating diagnostic decision-making and mitigating diagnostic errors across acute health systems. Legally organized through Aidoc Medical Ltd. in Tel Aviv, Israel, alongside Aidoc Inc. in Manhattan, New York, the organization maintains a dual corporate operating footprint that links Israeli defense-derived deep technical engineering with commercial health system distribution in the United States and international markets. The platform centers on the proprietary CARE clinical foundation model and the aiOS enterprise AI operating system, which embeds algorithmic image triage and clinical workflow notifications directly into existing hospital Picture Archiving and Communication Systems (PACS) and Electronic Health Record (EHR) environments. In contrast to isolated point-solution algorithms that create departmental IT friction, Aidoc's architectural strategy emphasizes centralized AI orchestration, FHIR-based clinical EHR integrations with systems like Epic, and comprehensive diagnostic workflow automation spanning urgent triage notifications to generative radiology draft report creation."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Founding Leadership, Executive Background, and Key-Person Dependency"
    body: "Aidoc was co-founded in October 2015 by Chief Executive Officer Elad Walach alongside fellow alumni of the elite Talpiot technology program in the Israeli Defense Forces. Walach, who holds a BSc in Computer Science and Physics from The Hebrew University of Jerusalem and an MS in Computer Science from Tel Aviv University, previously led artificial intelligence research within the Israeli Air Force before co-founding Aidoc. Under his ten-year executive leadership, the enterprise has grown from an initial algorithmic radiology prototype to an organization with over 400 employees and a commercial footprint in nearly 2,000 hospitals globally. The company's corporate governance structure reflects significant key-person dependence on Walach's dual operational and technical background, balanced by seasoned commercial healthcare leadership across North America and Europe. Enterprise governance incorporates strict regulatory and data protection compliance, managed under the EU-U.S. Data Privacy Framework with U.S. Federal Trade Commission oversight and independent dispute resolution mechanisms via JAMS and ICDR-AAA."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale-milestones"
    title: "Capitalization History, Enterprise Scale, and Milestone Evolution"
    body: "Aidoc's capitalization trajectory demonstrates sustained institutional backing from premier technology and growth equity investors across five primary funding rounds. Following an initial growth phase that included a $110 million venture expansion round in June 2022, the company completed a landmark $150 million Series E financing in April 2026 led by Growth Equity at Goldman Sachs Alternatives, with participation from General Catalyst, SoftBank Vision Fund 2, and NVentures (NVIDIA's venture capital arm). Disclosed cumulative funding surpassed $500 million, solidifying Aidoc's balance sheet for large-scale clinical foundation model deployments. Operationally, Aidoc's platform supports clinical decision-making for approximately 60 million patients annually, having evaluated more than 120 million cumulative patient cases to date across prominent health system networks such as Sutter Health, Wellspan Health, and Mercy. However, post-money equity valuation, exact annual recurring revenue (ARR), gross margins, and net cash burn remain undisclosed private metrics, representing material diligence gaps."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
