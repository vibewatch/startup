schemaVersion: "report-v2"
artifact: risks
slug: aidoc
runDate: 2026-10-04
company:
  name: Aidoc
chapter:
  number: 7
  title: Risks
  summary: >-
    Aidoc's most consequential public-evidence risks are clinical and regulatory execution at
    enterprise scale, privacy and processor governance, and dependence on integrations, partners,
    and continued capital. The evidence supports risk prioritization and diligence triggers, but
    not incident rates, customer concentration, cash runway, or a complete litigation record.
sections:
  - id: ranked-risk-posture
    title: Ranked risk posture and thesis-break conditions
    body: >-
      The leading exposure is clinical and regulatory execution at scale. Aidoc says its platform
      is deployed across nearly 2,000 hospitals and supports about 60 million patient cases each
      year; an earlier Harvard Business School case independently described 20 algorithms in more
      than 900 hospitals and 17 FDA clearances in 2023. Those figures do not establish safety
      outcomes, but they make any model, workflow, or reporting-control failure potentially broad
      in reach. Public deployment figures also move from more than 900 hospitals and imaging
      centers to more than 1,600 medical centers and then nearly 2,000 hospitals, with different
      dates and denominators, so they should not be treated as a clean growth series. The
      investment view should break if a material patient-safety event is substantiated, a required
      authorization is denied or materially narrowed, or enterprise customers cannot evidence
      reliable clinician override, monitoring, and escalation.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR007, CR008]
    figureRefs: [FR001]
  - id: regulatory-legal-privacy
    title: Regulatory, legal, and privacy exposure
    body: >-
      First Read has FDA Breakthrough Device Designation, but Aidoc's syndicated announcement
      explicitly says the device is investigational and has not been cleared or approved. That
      distinction makes authorization scope and timing a gating item rather than a completed
      milestone. Privacy exposure is also structurally material: Aidoc's Data Privacy Framework
      notice says the service may process pseudonymized radiology scans, reports, metadata, usage
      logs, and product analytics, and it describes transfers to processors supporting cloud,
      identity, and data-hosting functions. The notice provides FTC oversight and complaint or
      arbitration paths, but it is company-issued evidence, not an independent audit of controls.
      The assigned evidence contains no regulator order, court docket, recall register, or
      independently verified incident history; absence from this bounded pool is not evidence
      that no such matter exists.
    claimRefs: [CR007, CR009, CR010, CR011]
    tableRefs: [TR001]
  - id: operational-clinical-security
    title: Operational, clinical-quality, and security controls
    body: >-
      Aidoc's own First Read announcement identifies errors, inconsistencies, and automation bias
      as known generative-reporting risks and presents clinician oversight and final approval as
      safeguards. That is useful risk recognition, but it does not disclose false-positive or
      false-negative rates, override rates, monitoring thresholds, rollback procedures, uptime,
      or incident-response performance. The public website terms are explicitly site terms and
      disclaim any guarantee that the site will be free of bugs, security breaches, or virus
      attacks; they cannot be used as a clinical-product service-level agreement. Separately,
      Aidoc's economics discussion says radiology AI vendors must articulate provider ROI and
      describes throughput improvement as still in its infancy. Renewal resilience therefore
      depends on proving both clinical reliability and realized economic value, not deployment
      counts alone.
    claimRefs: [CR008, CR013, CR014, CR016]
    tableRefs: [TR002]
  - id: partner-financial-execution
    title: Partner, financial, and execution dependencies
    body: >-
      The platform model introduces two dependency layers. The Harvard case says Aidoc hosted both
      its own and partners' algorithms, while Aidoc's current site identifies vetted third-party
      algorithm developers and original-equipment manufacturers as platform partners. Its privacy
      notice also identifies processors for cloud, identity, logs, analytics, and research data.
      Diligence must therefore test contractual accountability, version and validation controls,
      substitution rights, outage escalation, and audit coverage across both clinical and
      infrastructure counterparties. Aidoc's April 2026 release reports a $150 million Series E
      and more than $500 million of total funding, but funding raised is not cash available and
      discloses neither burn nor runway. Capital adequacy, customer concentration, margins, and
      partner concentration remain private-evidence questions rather than supportable public
      estimates.
    claimRefs: [CR002, CR010, CR012, CR015]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Jurisdiction / scope
      - Public status
      - Likelihood
      - Severity
      - Disclosed mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - First Read market authorization
        - United States / chest radiograph report drafting
        - Breakthrough Device Designation Q260882; investigational and not FDA-cleared or approved
        - Approval timing and outcome unquantified
        - High, because commercialization scope depends on authorization
        - Clinician oversight and final approval described by Aidoc
        - High until clearance, indications, labeling, and post-market plan are verified
        - Obtain FDA correspondence, submission plan, validation package, intended-use language, and launch dependencies
      - - Clinical AI performance and post-market safety
        - Regulated imaging workflows across deployed health systems
        - Historical clearances and broad deployment are reported; current incident and recall record is not established by the assigned evidence
        - Incident probability unquantified
        - Potentially critical because outputs affect clinical workflow
        - Centralized aiOS deployment and stated regulatory discipline
        - High without model-level performance, drift, override, and event data
        - Review regulator databases, complaint files, CAPA records, model monitoring, recalls, and site-level safety outcomes
      - - Cross-border health-data processing
        - EU, UK, Switzerland, and United States
        - Aidoc states DPF certification and processing of pseudonymized scans, reports, metadata, logs, and analytics
        - Exposure frequency unquantified
        - High because clinical data and cross-border transfers are involved
        - DPF principles, written processor protections, complaint channels, and FTC oversight
        - Medium-high pending control testing and subprocessor review
        - Obtain current DPF record, DPA, transfer impact assessments, subprocessor inventory, retention schedule, and audit reports
      - - Litigation, enforcement, and intellectual-property disputes
        - Global operations
        - No complete docket or regulator search is present in the assigned pool
        - Unknown
        - Potentially high but not evidence-quantified
        - No independently verified mitigation in the assigned evidence
        - Unknown; absence of a cited case is not proof of absence
        - Run jurisdiction-specific court, regulator, patent, sanctions, and enforcement searches and obtain counsel letters
    notes: >-
      Partial public-evidence register as of 2026-10-04; severity is provisional and tied to the
      cited status and potential clinical scope, while likelihood remains unquantified where the
      assigned sources provide no event denominator.
    enumerationScope:
      coverage: partial
      basis: >-
        Public issues identifiable from the eight successful prefetched sources assigned to this
        chapter; no comprehensive court, regulator, recall, or patent-database search was available.
    claimRefs: [CR001, CR007, CR008, CR009, CR010, CR011]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Public mitigation maturity
      - Residual exposure
      - Monitoring indicator
      - Unresolved gap
    rows:
      - - Erroneous or inconsistent draft-report text and automation bias
        - Acknowledged as a known risk; event rate not disclosed
        - Potentially critical in clinical workflows
        - Emerging; clinician oversight and final approval are stated
        - High without external validation and override data
        - False-negative, false-positive, edit, override, escalation, and safety-event rates by indication and site
        - Independent First Read validation, labeling, and post-market surveillance plan
      - - Model drift or site-specific performance degradation
        - Unknown
        - High where prioritization or reporting affects care pathways
        - Not evidenced in the assigned public sources
        - High until monitoring and rollback controls are tested
        - Performance by scanner, population, site, indication, software version, and time cohort
        - Drift thresholds, retraining governance, change control, and rollback evidence
      - - Platform outage, delayed alert, or integration failure
        - Unknown
        - High because aiOS is embedded in imaging and EMR workflows
        - Centralized platform positioning is public; reliability controls are not
        - High without uptime and recovery evidence
        - Uptime, critical-alert latency, failed-message rate, mean time to detect, and mean time to recover
        - Customer SLAs, status history, business continuity tests, and incident logs
      - - Adoption or renewal fails provider ROI hurdle
        - Company identifies budget pressure and ROI articulation as adoption requirements
        - Medium-high for commercial durability
        - Conceptual value cases are public; realized cohort economics are not
        - Medium-high pending customer-level outcomes
        - Realized time saved, length-of-stay impact, utilization, renewal, expansion, and implementation cost
        - Independent ROI studies and renewal cohorts with denominators
    notes: >-
      Qualitative register based on public company disclosures and one independent case abstract;
      no event-rate denominator, SLA, security audit, or customer renewal cohort was available.
    claimRefs: [CR005, CR007, CR008, CR013, CR014, CR016]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty class
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Public mitigation
      - Residual exposure / diligence path
    rows:
      - - Third-party clinical algorithms
        - Algorithm developers and original-equipment manufacturers
        - Extend applications available through the enterprise platform
        - Not disclosed
        - Partner model, update, or evidence fails Aidoc or customer standards
        - High
        - Aidoc describes partners as vetted and hosts its own and partner algorithms
        - Verify validation ownership, regulatory responsibility, version control, indemnities, audit rights, and substitution options
      - - Cloud, identity, and data processors
        - Infrastructure and service providers
        - Host logs, analytics, research data, cloud services, authentication, and related processing
        - Vendor names and shares not disclosed in the cited notice
        - Outage, breach, transfer failure, or processor non-compliance interrupts service or exposes data
        - High
        - Written protection requirements and stated potential Aidoc liability for onward transfers
        - Obtain named subprocessor list, architecture, regional failover, security reports, and concentration analysis
      - - FDA and other medical-device regulators
        - Regulatory authorities
        - Determine authorization scope and post-market obligations
        - Structurally concentrated by jurisdiction
        - Clearance is delayed, denied, narrowed, or conditioned
        - High
        - Breakthrough designation may accelerate interaction but is not approval
        - Verify submission milestones, predicates, clinical evidence, indication strategy, and contingency plan
      - - External capital
        - Growth-equity investors
        - Fund product development and global deployment
        - Terms and future capital need not disclosed
        - Cash needs exceed operating resources or financing becomes dilutive or unavailable
        - Medium-high, provisional
        - $150 million Series E announced in April 2026
        - Obtain cash balance, monthly net burn, committed debt, runway, revenue, margins, preferences, and downside plan
    notes: >-
      Concentration is marked undisclosed unless the assigned sources name a structurally singular
      authority; the financing row preserves the distinction between funding raised and cash available.
    claimRefs: [CR002, CR007, CR010, CR012, CR015]
figures:
  - id: FR001
    title: Provisional residual-risk heatmap
    type: matrix
    summary: >-
      A qualitative prioritization of six exposures; it is not an estimate of incident probability.
    data:
      columns:
        - Likelihood evidence
        - Potential impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Clinical model or reporting error
          values:
            - Known risk; rate undisclosed
            - Potentially critical
            - Emerging
            - High
        - label: Authorization delay or scope limitation
          values:
            - Outcome unquantified
            - High
            - Breakthrough designation only for First Read
            - High
        - label: Privacy or processor-control failure
          values:
            - Frequency undisclosed
            - High
            - Framework disclosed; control testing unavailable
            - Medium-high
        - label: Platform outage or integration failure
          values:
            - Frequency undisclosed
            - High
            - Public SLA unavailable
            - High
        - label: Partner algorithm governance failure
          values:
            - Frequency undisclosed
            - High
            - Vetting asserted; controls unavailable
            - Medium-high
        - label: Capital or unit-economics shortfall
          values:
            - Burn and runway unavailable
            - High
            - Recent financing disclosed
            - Medium-high
    approximationNotes: >-
      Analyst synthesis from cited public evidence; qualitative labels are provisional, and no
      numeric probability, loss estimate, incident count, or cash-runway estimate is implied.
    claimRefs: [CR001, CR004, CR006, CR008, CR010, CR013, CR015]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Escalate or stop if First Read does not obtain the authorization required for its intended
      commercial use; a substantiated material patient-safety, privacy, or availability event
      reveals inadequate controls; enterprise customers cannot evidence durable ROI and renewal;
      a critical algorithm or infrastructure partner cannot be audited or replaced; or private
      diligence shows less than 18 months of runway without committed financing. These are proposed
      investment controls, not claims that any trigger has occurred.
    claimRefs: [CR007, CR008, CR010, CR013, CR015]
