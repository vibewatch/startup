company:
  name: "Aidoc"
chapter:
  number: 8
  title: "Valuation"
  summary: "Aidoc disclosed a $150 million Series E in April 2026 and more than $500 million of cumulative funding, alongside claimed deployment across nearly 2,000 hospitals. Public evidence does not disclose the round valuation, operating economics, or preference stack, so the evidence-supported stance is research-more with valuation unknown."
sections:
  - id: "recommendation-and-evidence-boundary"
    title: "Recommendation and Evidence Boundary"
    body: >-
      The appropriate public-evidence recommendation is research-more, not buy or pass. Aidoc's
      April 2026 financing announcement supplies credible evidence of investor support and reports
      substantial deployment scale, but it does not provide the price or operating metrics needed
      to underwrite an entry. The reviewed financing materials state the amount raised and total
      historical funding; they do not state post-money valuation, price per share, ownership sold,
      liquidation preferences, revenue, margins, retention, or cash balance. Funding raised is not
      current cash availability, and hospital deployment is not revenue. Confidence is medium in
      the recommendation because the missing data are decision-critical, while confidence in any
      numeric valuation would be low. A price-sensitive decision therefore requires a cap table,
      round documents, audited financials, and customer-level economics before assigning a return
      case.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV001"
  - id: "financing-thesis-and-anti-thesis"
    title: "Financing Context, Thesis, and Anti-Thesis"
    body: >-
      The thesis is that fresh institutional capital can fund broader indications, automated
      imaging draft reports, and wider aiOS deployment against an already meaningful installed
      base. Aidoc says the Series E was led by Growth Equity at Goldman Sachs Alternatives, with
      General Catalyst, SoftBank Vision Fund 2, and NVentures participating, and that the new
      capital will support those product and deployment priorities. The anti-thesis is that public
      scale claims cannot be converted into durable equity value without revenue quality, gross
      margin, retention, implementation cost, concentration, and cash-consumption evidence.
      Historical funding, including an earlier $20 million financing reported by EBN, demonstrates
      access to capital but not capital efficiency. The same distinction applies to the more than
      $500 million cumulative-funding claim: it is a financing history, not a valuation or a
      balance-sheet measure.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV013"
    tableRefs:
      - "TV002"
  - id: "scenario-and-comparable-framework"
    title: "Scenario and Comparable Framework"
    body: >-
      Public evidence supports directional scenarios but not defensible dollar ranges or revenue
      multiples. A bull case requires Aidoc to convert product investment and broad deployment into
      verified recurring growth, strong retention, software-like contribution margins, and a clean
      preference structure. A base case assumes continued adoption while economics and entry terms
      remain unresolved, which still prevents a return calculation. A bear case is triggered if
      commercialization fails to cover model, integration, regulatory, and support costs, or if a
      senior preference stack absorbs exit proceeds before common equity. The assigned comparison
      page is not a usable valuation benchmark: it categorizes Aidoc in a broad AI-research set and
      reports zero reviews. No public-company, private-round, or M&A observation in the reviewed
      pool supplies a comparable denominator, growth rate, margin profile, or transaction multiple.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV015"
    tableRefs:
      - "TV003"
  - id: "liquidity-exit-and-diligence-gates"
    title: "Liquidity, Exit Readiness, and Final Diligence Gates"
    body: >-
      EquityZen describes Aidoc exposure through funds purchasing shares from existing
      shareholders, not through a disclosed primary-price discovery process. It lists two possible
      liquidity paths for private-company investments: a company exit such as an IPO, merger, or
      acquisition, or an eligible Express Deal. Neither path establishes timing, availability, or
      proceeds for a specific Aidoc security. The data-privacy notice also identifies operational
      obligations relevant to downside underwriting: Aidoc says it processes pseudonymized
      radiology scans, reports, metadata, usage logs, and analytics, and may be liable for onward
      transfers under the applicable framework. Final diligence should therefore test security
      obligations, regulatory costs, customer concentration, cash runway, and the full preference
      waterfall. The thesis breaks if verified economics cannot support ongoing product and
      compliance investment, or if entry terms leave insufficient downside protection and target
      return.
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV014"
      - "CV015"
    figureRefs:
      - "FV001"
