    columns:
      - "Side"
      - "Argument"
      - "Evidence"
      - "What Would Change the View"
    rows:
      - - "Thesis"
        - "Institutional financing supports continued product and indication expansion."
        - "$150 million Series E led by Goldman Sachs Alternatives; proceeds assigned to CARE, new indications, draft reporting, and aiOS deployment."
        - "Confirm product milestones, budget allocation, and remaining runway against the approved operating plan."
      - - "Thesis"
        - "Claimed enterprise deployment offers a base from which to expand."
        - "Aidoc reports nearly 2,000 hospitals and more than 60 million patient cases analyzed annually."
        - "Verify contracted accounts, recurring revenue per site, renewals, and deployment depth."
      - - "Anti-thesis"
        - "Capital access may mask weak capital efficiency."
        - "More than $500 million of cumulative funding is disclosed without revenue, margin, or cash data."
        - "Audited gross margin, burn, retention, and cohort expansion would resolve the concern."
      - - "Anti-thesis"
        - "Private security terms can separate company success from investor returns."
        - "Public materials do not disclose valuation, ownership sold, preference seniority, or dilution."
        - "A fully diluted cap table, charter, side letters, and waterfall analysis are required."
    notes: "The table separates company-issued scale and financing claims from the missing financial and security terms needed for an investment decision."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV012"
      - "CV013"
      - "CV014"
  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Explicit Assumptions"
      - "Valuation / Return Logic"
      - "Key Risks"
      - "Probability Signal"
    rows:
      - - "Bull"
        - "Deployment converts into verified recurring growth, strong retention, attractive contribution margins, and a clean preference structure."
        - "No numeric range is supportable; upside can be tested only after audited metrics and a disclosed entry price."
        - "Commercial conversion, clinical performance, implementation costs, and regulatory obligations."
        - "Positive signals are fresh financing and claimed scale; economics remain unverified."
      - - "Base"
        - "Product expansion and hospital adoption continue, while revenue quality and capital efficiency remain uncertain."
        - "No numeric range is supportable; negotiate from a return target after normalizing dilution and preference terms."
        - "Long procurement cycles, customer concentration, model costs, and follow-on capital needs."
        - "Mixed: operating activity is visible, but the core valuation denominator is absent."
      - - "Bear"
        - "Commercial gains fail to cover product, integration, compliance, and support costs, or senior terms absorb exit value."
        - "Downside cannot be bounded without cash, debt, and waterfall data; a down round or loss of common-equity value remains possible."
        - "Liquidity constraints, privacy liabilities, financing dependence, and weak customer economics."
        - "Trigger on missed growth or retention plan, shrinking runway, adverse regulatory evidence, or punitive financing terms."
    notes: "Scenarios are qualitative because the assigned public evidence contains no entry valuation, ARR, margins, cash balance, ownership sold, or preference waterfall; no probability percentage or valuation multiple is estimated."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV014"
      - "CV015"
