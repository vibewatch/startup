  title: "Financials"
  summary: "Aidoc operates an enterprise subscription model for its clinical AI operating system (aiOS) across approximately 2,000 hospital sites, backed by over $500M in cumulative equity financing through its April 2026 Series E round. However, foundational underwriting metrics—including Annual Recurring Revenue (ARR), gross margins, net retention rates, and operating burn—remain undisclosed private data."
sections:
  - id: "revenue-model-and-streams"
    title: "Revenue Model, Pricing Mechanics, and Commercial Packaging"
    body: "Aidoc monetizes its clinical artificial intelligence technology primarily through a B2B enterprise software subscription model targeting hospitals, integrated delivery networks (IDNs), and outpatient imaging centers [CI001]. The commercial architecture centers on the proprietary aiOS platform, which acts as an operating system and deployment layer embedding clinical algorithms directly into existing picture archiving and communication systems (PACS) and electronic health records (EHR) [CI002]. While specific dollar-denominated list prices and per-scan software fees are strictly treated as confidential commercial terms, hospital contract structures generally combine fixed platform access fees with tiered software licensing scaled by hospital bed volume, facility count, or algorithmic coverage across clinical service lines [CI003]. Under its standard online terms of use, Aidoc restricts aggregate liability to the total fees paid by a customer in the preceding three-month period, reflecting standard enterprise SaaS contract governance [CI004]. Nevertheless, the absence of public pricing schedules or realized revenue-per-facility benchmarks limits precise quantification of contract value distribution [CI005]."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "go-to-market-and-cost-structure"
    title: "Go-to-Market Motion, Sales Cycles, and Service Delivery Economics"
    body: "Aidoc's go-to-market motion involves high-touch enterprise direct sales combined with strategic clinical integrations and healthcare channel relationships [CI006]. Because clinical deployment touches emergency medicine, radiology, cardiology, and neurovascular workflows, enterprise sales cycles in health systems routinely span nine to eighteen months due to institutional IT governance, HIPAA and Data Privacy Framework compliance, and physician committee evaluations [CI007]. On the cost side, Aidoc's service delivery economics encompass compute infrastructure across cloud partners like Amazon Web Services (AWS) and NVIDIA, specialized engineering overhead for foundation model development (such as CARE), and regulatory compliance maintenance [CI008]. While Aidoc reported that contracted annual recurring revenue expanded significantly in earlier growth stages, steady-state software gross margins and cloud compute expenditures per processed study remain opaque private metrics [CI009]. Operating expenses are heavily weighted toward commercial account teams, clinical deployment specialists, and specialized machine learning research personnel [CI010]."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy, Financing Trajectory, and Underwriting Diligence Verdict"
    body: "From a financing perspective, Aidoc maintains a well-capitalized balance sheet following its $150 million Series E round in April 2026 led by Growth Equity at Goldman Sachs Alternatives, bringing cumulative disclosed funding to over $500 million [CI011, CI012]. External secondary trackers estimate Aidoc's headcount at over 600 personnel, implying substantial monthly operating payroll commitments and computational model training overhead [CI013]. While the Series E proceeds provide multi-year runway to pursue FDA submissions and product expansion—such as the First Read radiology report drafting tool—underwriting institutional diligence is obstructed by the complete opacity surrounding net revenue retention, GAAP operating losses, and cash burn rate [CI014]. Secondary market pricing and historical capitalization records remain fragmented and lack formal verification, confirming that full credit or equity valuation underwriting requires access to private financial disclosures [CI015]."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
