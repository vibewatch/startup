  title: Customers
  summary: Aidoc operates at enterprise scale across nearly 2,000 global medical facilities and multi-site health systems, yet commercial concentration, long procurement cycles, and limited public disclosure on net revenue retention or churn leave customer durability open to diligence.
sections:
  - id: customer-segmentation-and-commercial-structure
    title: Customer Segmentation and Enterprise Commercial Structure
    body: |
      Aidoc targets multi-facility integrated delivery networks (IDNs), academic medical centers, tertiary health systems, and large-scale physician services practices that manage heavy acute-care imaging volumes. Commercial contracting operates primarily at the enterprise level, where Chief Medical Information Officers (CMIOs), radiology department chairs, and hospital executive leadership negotiate site-wide or system-wide software subscriptions. Secondary commercial segments encompass regional community hospital clusters that access Aidoc via centralized teleradiology networks or outsourced radiology management partners, such as Radiology Partners, which represents one in ten US imaging exams. Payer and procurement dynamics demand demonstrable ROI across emergent pathways such as intracranial hemorrhage (ICH), pulmonary embolism (PE), and stroke, where clinical time savings justify recurring software allocations. However, contract sizes vary widely from five-figure single-site deployments to seven-figure IDN-wide enterprise agreements, creating distinct renewal and procurement hurdles across health system tiers.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-deployment-scale
    title: Adoption Trajectory and Deployment Scale Across Health Systems
    body: |
      The adoption trajectory for Aidoc has expanded from approximately 500 medical centers in 2021 to over 1,000 US hospital sites and nearly 2,000 hospital facilities globally by 2026. The platform's annual analytical throughput has reached approximately 60 million patient cases per year, with cumulative historical processing exceeding 120 million to 150 million patient studies. In Europe, adoption has scaled through regional networks such as Germany's Asklepios Group, which completed an enterprise rollout of the aiOS platform across 28 hospitals processing roughly 35,000 CT and X-ray examinations monthly. Cross-site utilization relies on passive background PACS integration, where automated DICOM listeners analyze studies without requiring active radiologist sign-in, maintaining engagement above 90% in health systems that enforce standardized triage protocols. Despite broad geographic reach across 30 US states and international hospital networks, public tracking metrics lack granular historical cohort data and precise annual volume disclosure per customer account.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-proof-and-clinical-consortia
    title: Named Customer Proof and Consortium Governance
    body: |
      Named customer proof points demonstrate deep penetration within premier US healthcare institutions and international academic centers. In August 2026, twelve leading US health systems collectively caring for nearly 20 million patients annually—including Advocate Health, Cedars-Sinai Health System, Hartford HealthCare, Houston Methodist, Mercy, Mount Sinai Health System, Northwell Health, Northwestern Medicine, Sutter Health, University of Florida Health, University Hospitals of Cleveland, and WellSpan Health—co-founded the Diagnostic AI Consortium with Aidoc to govern diagnostic AI performance, workflow integration, and post-deployment monitoring. In Europe, clinical deployments at OLVG in Amsterdam and Region Skåne in Sweden (covering 10 hospitals and over 3,000 emergency CT angiographies) demonstrate verified production use in acute trauma and stroke pathways. Furthermore, nationwide radiology physician provider Radiology Partners implemented Aidoc across its partner hospitals to support care teams and expedite emergency patient management.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: retention-durability-and-concentration-risks
    title: Retention Durability, Churn Risks, and Commercial Concentration
    body: |
      While Aidoc maintains extensive deployment breadth, commercial durability and customer concentration present critical diligence considerations. Baseline enterprise pricing starting at approximately $50,000 per site annually creates an affordability barrier for smaller community hospitals imaging under 200 acute CTs monthly, where amortized costs exceed $20 per exam. In contrast to competitors like Viz.ai and RapidAI that enjoy active clinician discourse online, independent peer-to-peer clinician sentiment regarding Aidoc on public forums remains virtually absent, suggesting purchasing decisions are predominantly administrative and executive-led. Contract renewal risk is elevated where baseline DICOM alerts push into EHR inboxes without bi-directional report write-back, as unintegrated workflows risk clinician alert fatigue. Aidoc has not publicly disclosed Net Revenue Retention (NRR), Gross Revenue Retention (GRR), logo churn, or customer account concentration, necessitating direct auditor verification of annual recurring revenue distribution and multi-year contract stability.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
