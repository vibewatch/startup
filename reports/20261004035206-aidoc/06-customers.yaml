    title: Customer Segmentation and Enterprise Commercial Structure
    columns:
      - Customer Segment
      - Primary Buyer / Decision Maker
      - Clinical Use Case & Workflow Surface
      - Typical Contract Scope & Pricing Basis
      - Revenue & Strategic Value
      - Key Diligence Gap
    rows:
      - - Large Integrated Delivery Networks (IDNs)
        - CMIO, Chief Medical Officer, Radiology Chair
        - Enterprise acute-care triage across stroke, PE, ICH, trauma
        - Multi-campus enterprise agreement ($50k+/site/yr baseline plus module add-ons)
        - Core revenue engine; anchor reference accounts for multi-year retention
        - System-wide NRR and exact multi-year contract renewal rates undisclosed
      - - Academic Medical Centers & Level 1 Trauma
        - Radiology Department Chair, Trauma Medical Director
        - Specialized acute triage, clinical research, CARE foundation model evaluation
        - Premier academic deployment ($50k-$150k+/yr including professional services)
        - Research prestige, peer-reviewed clinical validations, consortium governance
        - Custom EHR integration costs and radiologist alert fatigue mitigation
      - - Physician Services Groups (e.g., Radiology Partners)
        - Practice Executive Committee, Chief AI Officer
        - Standardized radiologist worklist prioritization across distributed reading pools
        - National enterprise partnership affecting high exam volumes across 30 states
        - Massive scale distribution and channel acceleration without direct hospital sales
        - Channel partner concentration and revenue share structure opaque
      - - Community & Regional Hospitals
        - Hospital COO, Director of Imaging, ED Medical Director
        - Basic acute neurovascular and cardiopulmonary alert coverage
        - Per-site annual subscription ($50,000/site/year baseline threshold)
        - Geographic volume expansion; vulnerable to low-volume budget pressure
        - High amortized cost per exam ($20+/scan) threatening long-term renewal
    notes: Segment classification and pricing mechanics synthesized from MedAI Verdict independent enterprise analysis and public partnership disclosures.
