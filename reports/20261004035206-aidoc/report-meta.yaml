companyProfile:
  summary: >-
    Aidoc is a private enterprise clinical-AI company that sells radiology triage, workflow coordination, and
    draft-reporting software through its aiOS platform and CARE foundation-model stack. The company operates with a dual
    Tel Aviv and New York footprint, serves hospitals and health systems, and pairs acute-care imaging tools with
    emerging generative reporting products such as First Read.
  foundedDate: '2015-10-01'
  founders:
    - name: Elad Walach
      role: CEO
      background: Computer-science and physics-trained AI leader with prior Israeli Air Force research experience.
    - name: Michael Braginsky
      role: CTO
      background: Talpiot-program co-founder who helped build the company’s technical foundation.
    - name: Guy Reiner
      role: VP
      background: Early technical co-founder on the original clinical AI team.
  foundingLocation: Tel Aviv, Israel
  headquarters: Tel Aviv, Israel and New York, NY
  productSummary: Enterprise clinical AI software for acute imaging triage, workflow coordination, and draft radiology reporting.
  customerFocus: Hospitals, integrated delivery networks, and large health systems.
  businessModel: Enterprise software subscriptions and related deployment services for health systems.
