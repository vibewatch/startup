      - number: '3.3'
        title: Commercial Packaging, Deal Economics, and Budgetary Friction
        blocks:
          - type: paragraph
            body: >-
              Commercial procurement structures for enterprise clinical AI are characterized by multi-year SaaS
              commitments and significant opacity. Aidoc targets executive C-suite leadership and hospital service-line
              directors, closing multi-year enterprise contracts with individual deal values of $500,000 or greater,
              while pursuing an account expansion strategy designed to expand annual spend by at least two times while
              sustaining 95% retention. Unlike commodity ambulatory software where vendors like Practice Fusion publish
              transparent monthly per-provider pricing tiers and offer free evaluation trials, enterprise clinical AI
              vendors do not publish standardized rate cards. Aidoc licenses its technology through annual subscriptions
              structured around specific algorithm activations and annual study volume, causing total institutional
              software spend to escalate steeply as additional clinical indications are deployed. This pricing
              architecture introduces substantial procurement friction, as health systems must evaluate complex
              multi-algorithm bundles without pre-negotiation benchmarking data. Crucially, a persistent budgetary
              misalignment complicates procurement: while the life-saving and throughput benefits of automated triage
              accrue to clinical service lines like stroke neurology, vascular surgery, and emergency medicine, software
              licensing costs are typically charged against radiology or enterprise IT budgets.
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, CADt Constraints, and Alert Fatigue Risks
        blocks:
          - type: paragraph
            body: >-
              Evaluating the durability of Aidoc's competitive moat requires examining regulatory boundaries, alert
              fatigue, and health system switching barriers. Aidoc's core commercial clearances fall under the FDA's
              CADt (computer-aided triage and notification) classification. By regulatory statute, CADt software is
              authorized solely to reorder worklists and notify specialists of suspected time-critical findings; it
              cannot provide definitive diagnostic interpretations or substitute for a certified radiologist read.
              Consequently, ROI business cases premised on reduced radiologist staffing or workload elimination fail
              under regulatory scrutiny, as every imaging study still demands a full physician read. Furthermore,
              because triage models are deliberately tuned for high sensitivity to avoid false negatives on fatal
              pathologies like intracranial hemorrhages or pulmonary embolisms, false-positive alerts occur routinely.
              In health systems that do not rigorously audit real-world positive predictive value within their local
              patient mix, radiologist interruptive alert fatigue can rapidly erode clinician trust within months of
              launch. Switching costs are protected primarily by deep PACS integrations and enterprise data processing
              governance under the EU-US Data Privacy Framework, rather than algorithm exclusivity. Standard commercial
              terms cap aggregate vendor liability to recent subscription fees and disclaim diagnostic warranties,
              reinforcing that clinical accountability remains entirely with hospital practitioners.
            claimRefs:
              - CP004
              - CP010
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: CADt Regulatory Boundary and Diagnostic Workload Misconception
            body: >-
              Enterprise buyers frequently evaluate clinical AI under the assumption that automated triage will reduce
              total radiologist staffing or reading burdens. In regulatory reality, Aidoc's 510(k) clearances reside
              within the CADt category, which strictly permits worklist reprioritization and clinical notification
              rather than independent diagnostic interpretation. Every imaging study still requires a comprehensive
              human read, meaning financial return on investment cannot be underwritten on headcount reduction or
              eliminated reads.
            calloutType: risk
            claimRefs:
              - CP004
              - CP010
          - type: callout
            title: Platform Layer aiOS as a Multi-Algorithm Moat
            body: >-
              While core acute stroke triage algorithms have reached parity across Aidoc, Viz.ai, and RapidAI, Aidoc's
              architectural defensibility stems from its aiOS platform. By integrating into enterprise PACS and
              orchestrating both proprietary and third-party algorithms across radiology, cardiology, and neurology,
              Aidoc raises the switching costs for Integrated Delivery Networks that seek a single governance and
              deployment layer instead of managing fragmented point integrations.
            calloutType: insight
            claimRefs:
              - CP006
              - CP008
