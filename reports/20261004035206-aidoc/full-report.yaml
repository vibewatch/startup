            - Medium-high
        - label: Platform outage or integration failure
          values:
            - Frequency undisclosed
            - High
            - Public SLA unavailable
            - High
        - label: Partner algorithm governance failure
          values:
            - Frequency undisclosed
            - High
            - Vetting asserted; controls unavailable
            - Medium-high
        - label: Capital or unit-economics shortfall
          values:
