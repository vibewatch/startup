        - from: scale-proof
          to: risk-adjustment
        - from: risk-adjustment
          to: price-gate
        - from: price-gate
          to: recommendation
    approximationNotes: The flow is a qualitative diligence sequence; it does not estimate valuation, probability, or conversion rates.
