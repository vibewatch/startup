      - number: '5.3'
        title: Regulatory Pathway, Data Governance, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory clearances and strict clinical oversight form the foundation of Aidoc's technical moat and risk
              profile. On June 25, 2026, the FDA granted Breakthrough Device Designation Q260882 for Aidoc's First Read
              solution, specifically designating four life-threatening findings in chest radiograph analysis. However,
              First Read remains strictly for investigational use and has not yet achieved 510(k) clearance or PMA
              market authorization. Data governance policies comply with international data transfer frameworks; Aidoc
              Inc. maintains active certification under the EU-U.S. Data Privacy Framework (DPF), UK Extension, and
              Swiss-U.S. DPF for pseudonymized scans and metadata processing. Conversely, commercial terms of use
              enforce stringent liability limitations: Aidoc explicitly disclaims all warranties regarding site and
              third-party content and caps aggregate direct damages at total fees paid during the trailing three months
              prior to a claim, underscoring that ultimate clinical responsibility rests with healthcare providers.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
