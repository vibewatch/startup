  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Clinical Workflow and Product Line Definition
        blocks:
          - type: paragraph
            body: >-
              Aidoc positions its technology as a clinical AI operating layer designed to alleviate acute imaging
              backlogs in emergency and inpatient healthcare environments. Rather than acting as an autonomous
              diagnostic authority, Aidoc's decision-support software analyzes medical imaging scans to flag acute
              abnormalities, prioritize life-threatening cases on radiologist worklists, and accelerate
              multidisciplinary care team coordination. The product catalog spans specialized computer-vision algorithms
              for acute computed tomography (CT) triage—such as intracranial hemorrhage, pulmonary embolism, and
              abdominal abnormalities—paired with emerging generative capabilities like First Read for chest
              radiographs. First Read is designed to generate preliminary drafted reporting text across more than 100
              pre-specified radiological findings, though final sign-off and clinical liability remain strictly reserved
              for certified human radiologists.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
