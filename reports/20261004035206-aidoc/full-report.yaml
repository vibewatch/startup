    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Architecture, and Dual Footprint
        blocks:
          - type: paragraph
            body: >-
              Aidoc operates as an enterprise clinical artificial intelligence software provider dedicated to
              accelerating diagnostic decision-making and mitigating diagnostic errors across acute health systems.
              Legally organized through Aidoc Medical Ltd. in Tel Aviv, Israel, alongside Aidoc Inc. in Manhattan, New
              York, the organization maintains a dual corporate operating footprint that links Israeli defense-derived
              deep technical engineering with commercial health system distribution in the United States and
              international markets. The platform centers on the proprietary CARE clinical foundation model and the aiOS
              enterprise AI operating system, which embeds algorithmic image triage and clinical workflow notifications
              directly into existing hospital Picture Archiving and Communication Systems (PACS) and Electronic Health
              Record (EHR) environments. In contrast to isolated point-solution algorithms that create departmental IT
              friction, Aidoc's architectural strategy emphasizes centralized AI orchestration, FHIR-based clinical EHR
              integrations with systems like Epic, and comprehensive diagnostic workflow automation spanning urgent
              triage notifications to generative radiology draft report creation.
            claimRefs:
