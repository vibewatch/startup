      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: First Read Breakthrough Designation and Clinical Governance
            body: >-
              Aidoc's Breakthrough Device Designation (Q260882) for First Read marks a strategic transition from triage
              notifications toward draft generative report text across chest radiographs. While promising significant
              efficiency gains in emergency settings, Aidoc maintains a conservative clinical boundary where every
              report requires explicit human radiologist validation, limiting automated medical diagnostic liability.
            calloutType: insight
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Enterprise Commercial Structure
        blocks:
          - type: paragraph
            body: >
              Aidoc targets multi-facility integrated delivery networks (IDNs), academic medical centers, tertiary
              health systems, and large-scale physician services practices that manage heavy acute-care imaging volumes.
              Commercial contracting operates primarily at the enterprise level, where Chief Medical Information
              Officers (CMIOs), radiology department chairs, and hospital executive leadership negotiate site-wide or
              system-wide software subscriptions. Secondary commercial segments encompass regional community hospital
              clusters that access Aidoc via centralized teleradiology networks or outsourced radiology management
              partners, such as Radiology Partners, which represents one in ten US imaging exams. Payer and procurement
              dynamics demand demonstrable ROI across emergent pathways such as intracranial hemorrhage (ICH), pulmonary
              embolism (PE), and stroke, where clinical time savings justify recurring software allocations. However,
              contract sizes vary widely from five-figure single-site deployments to seven-figure IDN-wide enterprise
              agreements, creating distinct renewal and procurement hurdles across health system tiers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU013
      - number: '6.2'
        title: Adoption Trajectory and Deployment Scale Across Health Systems
        blocks:
          - type: paragraph
            body: >
              The adoption trajectory for Aidoc has expanded from approximately 500 medical centers in 2021 to over
              1,000 US hospital sites and nearly 2,000 hospital facilities globally by 2026. The platform's annual
              analytical throughput has reached approximately 60 million patient cases per year, with cumulative
              historical processing exceeding 120 million to 150 million patient studies. In Europe, adoption has scaled
              through regional networks such as Germany's Asklepios Group, which completed an enterprise rollout of the
              aiOS platform across 28 hospitals processing roughly 35,000 CT and X-ray examinations monthly. Cross-site
              utilization relies on passive background PACS integration, where automated DICOM listeners analyze studies
              without requiring active radiologist sign-in, maintaining engagement above 90% in health systems that
              enforce standardized triage protocols. Despite broad geographic reach across 30 US states and
              international hospital networks, public tracking metrics lack granular historical cohort data and precise
              annual volume disclosure per customer account.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU009
              - CU015
      - number: '6.3'
        title: Named Customer Proof and Consortium Governance
        blocks:
          - type: paragraph
            body: >
              Named customer proof points demonstrate deep penetration within premier US healthcare institutions and
              international academic centers. In August 2026, twelve leading US health systems collectively caring for
              nearly 20 million patients annually—including Advocate Health, Cedars-Sinai Health System, Hartford
              HealthCare, Houston Methodist, Mercy, Mount Sinai Health System, Northwell Health, Northwestern Medicine,
              Sutter Health, University of Florida Health, University Hospitals of Cleveland, and WellSpan
              Health—co-founded the Diagnostic AI Consortium with Aidoc to govern diagnostic AI performance, workflow
              integration, and post-deployment monitoring. In Europe, clinical deployments at OLVG in Amsterdam and
              Region Skåne in Sweden (covering 10 hospitals and over 3,000 emergency CT angiographies) demonstrate
              verified production use in acute trauma and stroke pathways. Furthermore, nationwide radiology physician
              provider Radiology Partners implemented Aidoc across its partner hospitals to support care teams and
              expedite emergency patient management.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Retention Durability, Churn Risks, and Commercial Concentration
        blocks:
          - type: paragraph
            body: >
              While Aidoc maintains extensive deployment breadth, commercial durability and customer concentration
              present critical diligence considerations. Baseline enterprise pricing starting at approximately $50,000
              per site annually creates an affordability barrier for smaller community hospitals imaging under 200 acute
              CTs monthly, where amortized costs exceed $20 per exam. In contrast to competitors like Viz.ai and RapidAI
              that enjoy active clinician discourse online, independent peer-to-peer clinician sentiment regarding Aidoc
              on public forums remains virtually absent, suggesting purchasing decisions are predominantly
              administrative and executive-led. Contract renewal risk is elevated where baseline DICOM alerts push into
              EHR inboxes without bi-directional report write-back, as unintegrated workflows risk clinician alert
              fatigue. Aidoc has not publicly disclosed Net Revenue Retention (NRR), Gross Revenue Retention (GRR), logo
              churn, or customer account concentration, necessitating direct auditor verification of annual recurring
              revenue distribution and multi-year contract stability.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise Network Effects via the Diagnostic AI Consortium
            body: >-
              Aidoc's formation of the Diagnostic AI Consortium with twelve premier US health systems caring for 20
              million patients cements high-level institutional alignment and barriers to competitor displacement.
            calloutType: strength
            claimRefs:
              - CU009
              - CU010
          - type: callout
            title: Lack of Public Retention and Concentration Metrics
            body: >-
              The absence of public disclosures regarding NRR, GRR, annual logo churn, or revenue concentration leaves
              multi-year commercial durability as an unverified diligence gap.
            calloutType: risk
            claimRefs:
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              The leading exposure is clinical and regulatory execution at scale. Aidoc says its platform is deployed
              across nearly 2,000 hospitals and supports about 60 million patient cases each year; an earlier Harvard
              Business School case independently described 20 algorithms in more than 900 hospitals and 17 FDA
              clearances in 2023. Those figures do not establish safety outcomes, but they make any model, workflow, or
              reporting-control failure potentially broad in reach. Public deployment figures also move from more than
              900 hospitals and imaging centers to more than 1,600 medical centers and then nearly 2,000 hospitals, with
              different dates and denominators, so they should not be treated as a clean growth series. The investment
              view should break if a material patient-safety event is substantiated, a required authorization is denied
              or materially narrowed, or enterprise customers cannot evidence reliable clinician override, monitoring,
              and escalation.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR008
              - CR010
              - CR013
              - CR015
      - number: '7.2'
        title: Regulatory, legal, and privacy exposure
        blocks:
          - type: paragraph
            body: >-
              First Read has FDA Breakthrough Device Designation, but Aidoc's syndicated announcement explicitly says
              the device is investigational and has not been cleared or approved. That distinction makes authorization
              scope and timing a gating item rather than a completed milestone. Privacy exposure is also structurally
              material: Aidoc's Data Privacy Framework notice says the service may process pseudonymized radiology
              scans, reports, metadata, usage logs, and product analytics, and it describes transfers to processors
              supporting cloud, identity, and data-hosting functions. The notice provides FTC oversight and complaint or
              arbitration paths, but it is company-issued evidence, not an independent audit of controls. The assigned
              evidence contains no regulator order, court docket, recall register, or independently verified incident
              history; absence from this bounded pool is not evidence that no such matter exists.
            claimRefs:
              - CR007
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Operational, clinical-quality, and security controls
        blocks:
          - type: paragraph
            body: >-
              Aidoc's own First Read announcement identifies errors, inconsistencies, and automation bias as known
              generative-reporting risks and presents clinician oversight and final approval as safeguards. That is
              useful risk recognition, but it does not disclose false-positive or false-negative rates, override rates,
              monitoring thresholds, rollback procedures, uptime, or incident-response performance. The public website
              terms are explicitly site terms and disclaim any guarantee that the site will be free of bugs, security
              breaches, or virus attacks; they cannot be used as a clinical-product service-level agreement. Separately,
              Aidoc's economics discussion says radiology AI vendors must articulate provider ROI and describes
              throughput improvement as still in its infancy. Renewal resilience therefore depends on proving both
              clinical reliability and realized economic value, not deployment counts alone.
            claimRefs:
              - CR008
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Partner, financial, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              The platform model introduces two dependency layers. The Harvard case says Aidoc hosted both its own and
              partners' algorithms, while Aidoc's current site identifies vetted third-party algorithm developers and
              original-equipment manufacturers as platform partners. Its privacy notice also identifies processors for
              cloud, identity, logs, analytics, and research data. Diligence must therefore test contractual
              accountability, version and validation controls, substitution rights, outage escalation, and audit
              coverage across both clinical and infrastructure counterparties. Aidoc's April 2026 release reports a $150
              million Series E and more than $500 million of total funding, but funding raised is not cash available and
              discloses neither burn nor runway. Capital adequacy, customer concentration, margins, and partner
              concentration remain private-evidence questions rather than supportable public estimates.
            claimRefs:
              - CR002
              - CR010
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR010
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Escalate or stop if First Read does not obtain the authorization required for its intended commercial use;
              a substantiated material patient-safety, privacy, or availability event reveals inadequate controls;
              enterprise customers cannot evidence durable ROI and renewal; a critical algorithm or infrastructure
              partner cannot be audited or replaced; or private diligence shows less than 18 months of runway without
              committed financing. These are proposed investment controls, not claims that any trigger has occurred.
            calloutType: risk
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR013
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Evidence Boundary
        blocks:
          - type: paragraph
            body: >-
              The appropriate public-evidence recommendation is research-more, not buy or pass. Aidoc's April 2026
              financing announcement supplies credible evidence of investor support and reports substantial deployment
              scale, but it does not provide the price or operating metrics needed to underwrite an entry. The reviewed
              financing materials state the amount raised and total historical funding; they do not state post-money
              valuation, price per share, ownership sold, liquidation preferences, revenue, margins, retention, or cash
              balance. Funding raised is not current cash availability, and hospital deployment is not revenue.
              Confidence is medium in the recommendation because the missing data are decision-critical, while
              confidence in any numeric valuation would be low. A price-sensitive decision therefore requires a cap
              table, round documents, audited financials, and customer-level economics before assigning a return case.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Financing Context, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that fresh institutional capital can fund broader indications, automated imaging draft
              reports, and wider aiOS deployment against an already meaningful installed base. Aidoc says the Series E
              was led by Growth Equity at Goldman Sachs Alternatives, with General Catalyst, SoftBank Vision Fund 2, and
              NVentures participating, and that the new capital will support those product and deployment priorities.
              The anti-thesis is that public scale claims cannot be converted into durable equity value without revenue
              quality, gross margin, retention, implementation cost, concentration, and cash-consumption evidence.
              Historical funding, including an earlier $20 million financing reported by EBN, demonstrates access to
              capital but not capital efficiency. The same distinction applies to the more than $500 million
              cumulative-funding claim: it is a financing history, not a valuation or a balance-sheet measure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario and Comparable Framework
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports directional scenarios but not defensible dollar ranges or revenue multiples. A
              bull case requires Aidoc to convert product investment and broad deployment into verified recurring
              growth, strong retention, software-like contribution margins, and a clean preference structure. A base
              case assumes continued adoption while economics and entry terms remain unresolved, which still prevents a
              return calculation. A bear case is triggered if commercialization fails to cover model, integration,
              regulatory, and support costs, or if a senior preference stack absorbs exit proceeds before common equity.
              The assigned comparison page is not a usable valuation benchmark: it categorizes Aidoc in a broad
              AI-research set and reports zero reviews. No public-company, private-round, or M&A observation in the
              reviewed pool supplies a comparable denominator, growth rate, margin profile, or transaction multiple.
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
      - number: '8.4'
        title: Liquidity, Exit Readiness, and Final Diligence Gates
        blocks:
          - type: paragraph
            body: >-
              EquityZen describes Aidoc exposure through funds purchasing shares from existing shareholders, not through
              a disclosed primary-price discovery process. It lists two possible liquidity paths for private-company
              investments: a company exit such as an IPO, merger, or acquisition, or an eligible Express Deal. Neither
              path establishes timing, availability, or proceeds for a specific Aidoc security. The data-privacy notice
              also identifies operational obligations relevant to downside underwriting: Aidoc says it processes
              pseudonymized radiology scans, reports, metadata, usage logs, and analytics, and may be liable for onward
              transfers under the applicable framework. Final diligence should therefore test security obligations,
              regulatory costs, customer concentration, cash runway, and the full preference waterfall. The thesis
              breaks if verified economics cannot support ongoing product and compliance investment, or if entry terms
              leave insufficient downside protection and target return.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Valuation Stance: Unknown'
            body: >-
              The $150 million Series E and more than $500 million of cumulative funding do not reveal Aidoc's
              post-money value, ownership sold, or investor return potential. The recommendation remains research-more
              until primary pricing and operating evidence are available.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
              - CV014
          - type: callout
            title: Secondary Access Is Not Price Validation
            body: >-
              EquityZen describes access through funds purchasing shares from existing holders and conditional exit
              paths. That mechanism does not establish a current Aidoc price, liquidity date, or expected proceeds for a
              specific security.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV008
