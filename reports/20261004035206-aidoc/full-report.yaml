      - number: '1.2'
        title: Founding Leadership, Executive Background, and Key-Person Dependency
        blocks:
          - type: paragraph
            body: >-
              Aidoc was co-founded in October 2015 by Chief Executive Officer Elad Walach alongside fellow alumni of the
              elite Talpiot technology program in the Israeli Defense Forces. Walach, who holds a BSc in Computer
              Science and Physics from The Hebrew University of Jerusalem and an MS in Computer Science from Tel Aviv
              University, previously led artificial intelligence research within the Israeli Air Force before
              co-founding Aidoc. Under his ten-year executive leadership, the enterprise has grown from an initial
              algorithmic radiology prototype to an organization with over 400 employees and a commercial footprint in
              nearly 2,000 hospitals globally. The company's corporate governance structure reflects significant
              key-person dependence on Walach's dual operational and technical background, balanced by seasoned
              commercial healthcare leadership across North America and Europe. Enterprise governance incorporates
              strict regulatory and data protection compliance, managed under the EU-U.S. Data Privacy Framework with
              U.S. Federal Trade Commission oversight and independent dispute resolution mechanisms via JAMS and
              ICDR-AAA.
