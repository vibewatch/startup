      - number: '5.2'
        title: Operating Model, Cloud Infrastructure, and Deployment Topology
        blocks:
          - type: paragraph
            body: >-
              Aidoc's operating architecture couples scalable cloud-based model training and inference pipelines with
              localized health-system interfaces. Model training and high-throughput inference routines execute on
              Amazon Web Services utilizing Amazon Elastic Compute Cloud (EC2) P3 instances with GPU acceleration.
              Anonymized medical imagery is staged in Amazon S3 buckets, while image metadata and operational indexing
              reside in Amazon Relational Database Service (RDS). For clinical site integration, Aidoc supports
              on-premises and private-cloud VM deployments; for example, the Department of Veterans Affairs Technical
              Reference Model (One-VA TRM v25.4) approved the Desktop Edition of Aidoc for deployment on virtual
              machines within VA-controlled environments such as the VA Enterprise Cloud (VAEC). Health systems
              integrate the platform directly into picture archiving and communication systems (PACS) and electronic
              medical records (EMR) through aiOS, ensuring seamless triage alerts without disrupting baseline clinical
              software stacks.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE007
