    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanics, and Commercial Packaging
        blocks:
          - type: paragraph
            body: >-
              Aidoc monetizes its clinical artificial intelligence technology primarily through a B2B enterprise
              software subscription model targeting hospitals, integrated delivery networks (IDNs), and outpatient
              imaging centers [CI001]. The commercial architecture centers on the proprietary aiOS platform, which acts
              as an operating system and deployment layer embedding clinical algorithms directly into existing picture
              archiving and communication systems (PACS) and electronic health records (EHR) [CI002]. While specific
              dollar-denominated list prices and per-scan software fees are strictly treated as confidential commercial
              terms, hospital contract structures generally combine fixed platform access fees with tiered software
              licensing scaled by hospital bed volume, facility count, or algorithmic coverage across clinical service
              lines [CI003]. Under its standard online terms of use, Aidoc restricts aggregate liability to the total
              fees paid by a customer in the preceding three-month period, reflecting standard enterprise SaaS contract
              governance [CI004]. Nevertheless, the absence of public pricing schedules or realized revenue-per-facility
              benchmarks limits precise quantification of contract value distribution [CI005].
