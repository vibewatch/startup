callouts:
  - calloutType: "risk"
    title: "CADt Regulatory Boundary and Diagnostic Workload Misconception"
    body: "Enterprise buyers frequently evaluate clinical AI under the assumption that automated triage will reduce total radiologist staffing or reading burdens. In regulatory reality, Aidoc's 510(k) clearances reside within the CADt category, which strictly permits worklist reprioritization and clinical notification rather than independent diagnostic interpretation. Every imaging study still requires a comprehensive human read, meaning financial return on investment cannot be underwritten on headcount reduction or eliminated reads."
    claimRefs:
      - "CP004"
      - "CP010"
  - calloutType: "insight"
    title: "Platform Layer aiOS as a Multi-Algorithm Moat"
    body: "While core acute stroke triage algorithms have reached parity across Aidoc, Viz.ai, and RapidAI, Aidoc's architectural defensibility stems from its aiOS platform. By integrating into enterprise PACS and orchestrating both proprietary and third-party algorithms across radiology, cardiology, and neurology, Aidoc raises the switching costs for Integrated Delivery Networks that seek a single governance and deployment layer instead of managing fragmented point integrations."
    claimRefs:
      - "CP006"
      - "CP008"
