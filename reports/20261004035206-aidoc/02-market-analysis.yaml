callouts:
  - calloutType: "insight"
    title: "The Platform Shift in Clinical AI Procurement"
    body: "Health systems have reached a decisive tipping point in AI procurement. With more than 700 AI/ML-enabled devices cataloged by the FDA, hospital IT departments cannot manage dozens of disparate single-algorithm vendors. Enterprise budgets are concentrating on unified operating layers like aiOS that can deploy, govern, and coordinate multiple clinical models across hospital networks."
    claimRefs:
      - "CM001"
      - "CM004"
  - calloutType: "risk"
    title: "Governance and Liability Constraints in Generative Reporting"
    body: "As clinical AI expands from triage notifications to drafting radiology report text, health systems encounter heightened regulatory and legal risks. Errors, hallucinations, and automation bias in clinical documentation carry direct medical malpractice exposure, necessitating strict human-in-the-loop oversight and rigorous regulatory designations."
    claimRefs:
      - "CM011"
      - "CM012"
