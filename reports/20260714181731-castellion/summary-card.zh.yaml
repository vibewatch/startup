  topStrengths:
    - 真实客户拉力已经出现：Navy、Army 和 Air Force 项目已为 Blackbeard 提供资金，仅 Navy 到 2026 年 4 月就执行了约 $154.9M 合同金额。
    - 对一家制造重度的国防 startup 来说，创始人-市场匹配少见地强；三位联合创始人都来自 SpaceX，经历覆盖政府销售、运营、预测和成本纪律。
    - Project Ranger 和公司强调低成本生产的表述，契合 Pentagon 正在转向可负担弹药深度，而不只是追求精密高超音速系统的真实优先级变化。
  topRisks:
    - 公司几乎完全依赖单一买方生态：美国政府。任何预算转向、测试失败或采购政策反转，都可能快速重置收入预期。
    - 相对已披露证据，估值已经激进；Castelion 还没有拿出经审计收入、生产毛利率，或通常能支撑 $2.8B 定价的已执行多年制造订单。
    - 技术和工业执行风险仍高，因为 Blackbeard 必须通过集成、安全和实弹里程碑，同时 Project Ranger 要爬坡一个新的导弹制造园区。
    - Project Ranger 周边社区和环境反对，可能拖慢许可、设施建设或政治支持，而这正发生在公司最需要制造可信度的时候。
  unresolvedGaps:
    - 没有公开经审计收入、burn、现金余额或毛利率数据，因此资本充足性承销仍依赖间接信号，而不是硬财务报表。
    - Department of War 框架公告不等于有约束力的生产合同；时点、单位经济和实际 take-or-pay 承诺仍未证明。
    - Blackbeard 的持续性能包线和准确高超音速分类在公开来源中仍部分不透明，留下剩余不确定性：需求信号有多少取决于未来测试成功。
    - 员工数、客户数和收入数字部分依赖第三方估计或类别推断，而非管理层认证披露。
    - 出口能力、ITAR 姿态和未来盟友市场路径仍不清晰，因此长期市场可能比当前 Pentagon-only 叙事更窄。
