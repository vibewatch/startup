          label: Environmental permitting gate for SRM manufacturing
        - from: itar-dtsa
          to: castelion-hq
          label: Export control on guidance/seeker/avionics tech
        - from: range-facilities
          to: castelion-hq
          label: Test range access for flight test campaigns
