  - id: TE002
    title: Workflow / Use-Case Table
    columns:
      - User Job
      - Current / Alternative Workflow
      - Castelion Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - "Navy carrier aviation: anti-access/area-denial strike against mobile maritime or coastal targets"
        - AGM-158C LRASM (sub-sonic, >$2M/unit), AGM-84D Harpoon (sub-sonic, limited range), or no hypersonic option
        - Blackbeard on F/A-18E/F; Mach 5+ speed; $300K–$442K target AUR; EOC FY2027
        - Hypersonic speed severely constrains adversary point-defense reaction time; 5–7x lower cost than LRASM per engagement
        - Warhead (75 lb) is smaller than LRASM (~1,000 lb JASSM equivalent); payload trade-off for speed
      - - "Army HIMARS brigade: precision fires against time-sensitive mobile targets at 500–1,000 km range"
        - PrSM Inc 1 (range ~500 km, $1.6M/AUR) or ATACMS (sub-sonic, limited range); no affordable hypersonic option
        - Blackbeard GL from HIMARS pod; ~80% of PrSM Inc 4 range; Mach 5+ terminal; estimated <$7M/AUR (prototype), targeting <$300K at volume
        - Delivers hypersonic speed at HIMARS logistics footprint; a C-17 can carry 4 loaded HIMARS vs. LRHW trailer constraints
        - Blackbeard GL unit cost significantly above $300K at current prototype stage; Army fielding not before FY2028
      - - "Navy F-35C: internal-carriage stealth hypersonic strike against defended targets"
        - No internal-carriage hypersonic option exists in the U.S. inventory for the F-35C
        - Blackbeard designed for 4 AURs in F-35C/A internal weapons bays; preserves low-observable profile
        - First internal-carriage hypersonic weapon for F-35C; enables stealth strikes against high-value targets
        - F-35C internal carriage is a design requirement as of May 2026, not a demonstrated or contracted capability
      - - "Joint force: attacking surface air-defense radar, C2 nodes, and mobile launcher TELs"
        - Conventional cruise missiles (JASSM-ER, Tomahawk) at sub-sonic speeds; limited against mobile/defended targets
        - Blackbeard (both variants); multi-mode EO seeker with terminal guidance for moving targets; Mach 5+ approach
        - Speed drastically reduces adversary reaction time; moving-target capability vs. TELs and ships
        - Hypersonic classification dispute; warhead size limits blast radius against hardened structures
    notes: >-
      Use-case benefits are derived from government budget documents, Navy MACE requirements, Army HX3 program docs,
      and company announcements. No operational test data exists as of May 2026; all measurable benefits are
      design targets and government-stated requirements, not demonstrated field outcomes.
