  - id: FE004
    title: Product Maturity / Capability Map
    type: matrix
    layout: wide
    summary: >-
      Scores each Blackbeard product module across four dimensions (technical validation, production readiness,
      platform integration, regulatory clearance) as of May 2026 to surface where the program is strong
      and where material gaps remain.
    data:
      columns:
        - label: Technical Validation
          sublabel: Subsystem validated in flight test
        - label: Production Readiness
          sublabel: Manufacturable at scale with target yield
        - label: Platform Integration
          sublabel: Confirmed integration on operational platform
        - label: Regulatory Clearance
          sublabel: Required safety/export certifications complete
      rows:
        - label: Solid Rocket Motor
          values:
            - score: high
              note: 20+ motors test-fired; subsystem validated
            - score: medium
              note: Project Ranger under construction; yield at ~70% for TPS nosecap; SRM yield not disclosed
            - score: medium
              note: Integrated on test-launch vehicles; HIMARS pod compatibility in progress
            - score: low
              note: Environmental permits for Project Ranger outstanding; HIMARS FTS pending
        - label: GNC / EO Seeker
          values:
            - score: high
              note: Multi-mode EO seeker validated for moving-target tracking in 25+ flight tests
            - score: medium
              note: Production seeker supply chain and yield not disclosed
            - score: medium
              note: Integrated on Navy and Army test articles; carrier interface pending NAVAIR cert
            - score: low
              note: ITAR Cat IV; NAVAIR NOSSA/WSESRB not complete; FMS clearance pending
        - label: FPGA Avionics
          values:
            - score: high
              note: Flight-validated across 25+ tests; HALT/HASS reliability testing underway
            - score: medium
              note: AMD/Xilinx commercial supply chain; geopolitical risk; radiation hardening unconfirmed
            - score: medium
              note: Integrated in all test vehicles; carrier and HIMARS fire-control interface in progress
            - score: low
              note: Cybersecurity RMF/CMMC status not reported; DO-178C qualification not confirmed
        - label: Thermal Protection System
          values:
            - score: medium
              note: Validated in flight test at Mach 5+ conditions; no public ablation data
            - score: low
              note: Yield ~70% vs. >90% target; most significant near-term scale-up risk
            - score: high
              note: Qualified for current test-article use across all test configurations
            - score: medium
              note: No specific regulatory certification required for TPS manufacturing; EHS/VOC controls at Project Ranger
        - label: Embedded Flight Software
          values:
            - score: high
              note: Full stack validated across 25+ flight tests; HIL simulation in production use
            - score: medium
              note: Software production process not independently assessed; DO-178C status unknown
            - score: medium
              note: Open fire-control interface bench-tested with Joint Fires Network (basic CFF script)
            - score: low
              note: DO-178C / equivalent qualification not confirmed; cybersecurity assessment not reported
        - label: Project Ranger (Facility)
          values:
            - score: low
              note: Not yet operational; first building summer 2026
            - score: low
              note: All 21 buildings targeted end-2026; tooling/commissioning ongoing
            - score: low
              note: Not applicable; facility is an enabler, not a platform integration point
            - score: low
              note: Environmental permits not yet complete; community opposition ongoing
    approximationNotes: >-
      Scores (high/medium/low) reflect the analyst's synthesis of available public evidence as of May 2026.
      No direct access to engineering documentation, test reports, or regulatory submissions was possible.
      "High" technical validation means publicly confirmed through government-witnessed or contractually
      referenced flight test evidence. "Low" production readiness means facility not yet operational or
      yield materially below production target.
    claimRefs:
      - CE006
      - CE007
      - CE015
      - CE019
      - CE021
      - CE027

