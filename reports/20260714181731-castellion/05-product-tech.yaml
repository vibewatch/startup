  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: manufacturing-yield
      missingEvidence: >-
        Solid rocket motor yield rate at current Torrance and Midland TX facilities is not publicly
        disclosed. Thermal protection system yield (~70%) is industry-sourced but unconfirmed by Castelion
        or DoD. No independent manufacturing audit has been reported.
      whyItMatters: >-
        Yield directly determines production cost, Project Ranger ramp timeline, and whether the
        $300K/AUR target is achievable. A yield below 90% at scale would increase unit cost and
        compress margins, potentially invalidating the core unit-economics thesis.
      diligencePath: >-
        Request manufacturing quality data room, including yield rates by subsystem, scrap rates, rework
        costs, and Castelion's improvement roadmap from current ~70% to the >90% target.
      relatedQuestionRefs:
        - QE009

    - type: private-evidence-only
      severity: blocking
      topic: regulatory-certification
      missingEvidence: >-
        NAVAIR NOSSA/WSESRB safety certification status, timeline, and identified failure modes are
        not publicly available. No official certification documentation has been released.
      whyItMatters: >-
        NOSSA/WSESRB certification is the single remaining pre-EOC gate for the Navy MACE program. Any
        certification failure or delay would defer EOC from FY2027 and delay the first production contract,
        directly affecting revenue timing.
      diligencePath: >-
        Request latest certification status report, any NOSSA findings or open items, and the projected
        certification completion date from the NAVAIR contracting office.
      relatedQuestionRefs:
        - QE006
        - QE017

    - type: private-evidence-only
      severity: material
      topic: seeker-specifications
      missingEvidence: >-
        Blackbeard seeker type (EO, radar, dual-mode), operating wavelength, acquisition range,
        countermeasure resistance, and terminal CEP at operational range are not publicly confirmed.
        Industry reporting uses EO and multi-mode terms without technical specificity.
      whyItMatters: >-
        Seeker performance against moving maritime and air-defended targets is the primary capability
        claim. If the seeker is adversely affected by environmental conditions (cloud cover, smoke) or
        electronic countermeasures, the operational utility is materially different from the brief
        descriptions in public reporting.
      diligencePath: >-
        Review MACE program test reports and Independent Test Agency assessments (if available);
        request seeker specification documents and any countermeasure test results from data room.
      relatedQuestionRefs:
        - QE010
        - QE025

    - type: not-publicly-available
      severity: material
      topic: software-qualification
      missingEvidence: >-
        No public confirmation that Castelion's embedded flight software has been qualified to DO-178C
        (or equivalent MIL-SPEC software development process standard) required for safety-of-flight
        determination in DoD weapon systems.
      whyItMatters: >-
        DO-178C qualification is a prerequisite for airworthiness certification on Navy platforms and
        constitutes a material development cost and schedule dependency. Failure to meet qualification
        on schedule would delay NOSSA/WSESRB certification.
      diligencePath: >-
        Request software development plan, qualification evidence, and any NAVAIR software verification
        team findings from the data room.
      relatedQuestionRefs:
        - QE022

    - type: not-publicly-available
      severity: material
      topic: developer-signal-proxy
      missingEvidence: >-
        Castelion has no public GitHub repositories, open-source code, developer API, or public
        community (Discord, Slack, Stack Overflow tag, HuggingFace) consistent with its hardware-only,
        classified defense context. Developer signal was satisfied via the closest practitioner-community
        proxy: Castelion's published job postings revealing the Vitis HLS FPGA workflow, embedded software
        stack, GNC methodology, and MES/ERP tooling (NetSuite, Manufacturo MES).
      whyItMatters: >-
        The absence of a public developer surface is expected and appropriate for a classified defense
        hardware company; no adverse inference is drawn. The career-posting proxy provides credible
        indirect evidence of the software and hardware technology stack.
      diligencePath: >-
        No external diligence path exists for developer-signal given the classified nature of the work;
        request internal engineering process documentation and software team org chart in data room.
      relatedQuestionRefs:
        - QE013
        - QE020

    - type: private-evidence-only
      severity: material
      topic: second-product-line
      missingEvidence: >-
        The second hypersonic product line disclosed in Castelion's Series B announcement has no publicly
        available program name, target market, technical specifications, contract status, development spend,
        or timeline.
      whyItMatters: >-
        The second product line is cited as a future growth lever and a rationale for the shared subsystem
        infrastructure investment. Without details, investors cannot assess whether it represents a
        material revenue opportunity or a speculative program placeholder.
      diligencePath: >-
        Request program summary, target customer, expected contract vehicle, development spend to date,
        and estimated timeline to contract in data room.
      relatedQuestionRefs:
        - QE023

    - type: not-publicly-available
      severity: low
      topic: automotive-supplier-identity
      missingEvidence: >-
        The specific automotive-industry or non-traditional suppliers used by Castelion for metal cases,
        rubber attachments, flight-computer hardware, and other commercial-grade components are not
        publicly disclosed. The company has described the approach in qualitative terms only.
      whyItMatters: >-
        Supplier identity matters for supply-chain concentration analysis, geopolitical exposure, and
        understanding whether the cost-reduction thesis depends on single-source commercial relationships
        that could be disrupted by demand shifts or trade restrictions.
      diligencePath: >-
        Request Castelion's approved vendor list and supply-chain concentration analysis; ask specifically
        about single-source components, any suppliers with foreign ownership, and contingency sourcing plans.
      relatedQuestionRefs:
        - QE014

