figures:
  - id: FE001
    title: Blackbeard Weapon System Architecture — Technology Stack
    type: stack
    layout: wide
    summary: >-
      Castelion vertically integrates all six core subsystems of the Blackbeard weapon system. The stack
      maps each technical layer from physical propulsion through mission software, showing the in-house
      design/manufacturing role and the key dependency or risk for each layer.
    data:
      layers:
        - id: propulsion
          label: Solid Rocket Motor Propulsion
          sublabel: "2-stage (GL); ammonium perchlorate / aluminum powder; manufactured in-house in Torrance and Project Ranger"
          role: Boosts weapon to Mach 5+ and sustains hypersonic flight; eliminates propulsion supply-chain markup
          status: validated
          detail: >-
            In-house design and manufacturing; 20+ motors test-fired; Project Ranger will scale to
            thousands of SRMs per year; yield ~70% for TPS nosecap; ~90% target for rate production.
          dependency: Ammonium perchlorate (commercial chemical); Project Ranger commissioning for volume
          risk: Environmental permitting at Project Ranger; perchlorate yield scale-up
        - id: thermal-protection
          label: Thermal Protection System (TPS)
          sublabel: "Siliconized carbon-carbon nose tip; >2,400°C tolerance; autoclave-cured in-house"
          role: Protects guidance hardware from aerothermal loads during hypersonic flight; prevents ablation wander
          status: in-development
          detail: >-
            Cured in small autoclave adapted from rocket-nozzle tooling; yield ~70% (industry sources);
            target >90% before rate production; Castelion deploying extra layup tubes to improve yield.
          dependency: Specialty carbon-carbon precursor materials; autoclave capacity at Project Ranger
          risk: Yield gap is single largest manufacturing scale-up risk
        - id: cas
          label: Control Actuation System (CAS)
          sublabel: "In-house design; controls aerodynamic surfaces during boost and glide"
          role: Provides precise attitude control throughout flight; interfaces with GNC for steering commands
          status: validated
          detail: >-
            Validated across 25+ flight tests; specific actuator supplier and lead-time data not public.
          dependency: Commercial/defense actuator motors; electronics from domestic supply chain
          risk: Supplier concentration not disclosed
        - id: seeker-gnc
          label: Multi-Mode EO Seeker + GNC System
          sublabel: "Inertial + celestial mid-course; EO terminal seeker; in-flight re-targeting"
          role: Navigation and terminal guidance for moving and hardened targets; ITAR Category IV
          status: validated
          detail: >-
            Mid-course: inertial + celestial updates. Terminal: multi-mode EO seeker capable of
            mid-flight target update. Validated in flight test for moving-target tracking.
          dependency: EO detector from defense supply chain (ITAR IV); GPS augmentation optional
          risk: ITAR IV export control limits FMS; countermeasure resistance not confirmed
        - id: fpga-avionics
          label: FPGA Avionics (Vitis HLS)
          sublabel: "AMD/Xilinx FPGA; Vitis HLS workflow; Allen TX engineering hub"
          role: Real-time sensor fusion, actuator command, and flight-critical computation
          status: in-development
          detail: >-
            FPGA design using Vitis High-Level Synthesis (HLS) workflow per job postings. Commercial
            silicon (not radiation-hardened) reduces cost and lead time vs. space-rated parts. HALT/HASS
            reliability testing underway.
          dependency: AMD/Xilinx FPGA supply chain; Vitis HLS software toolchain
          risk: Commercial FPGA not radiation-hardened; EMP/EMI vulnerability unassessed in public
        - id: flight-software
          label: Embedded Flight Software + Mission Stack
          sublabel: "Real-time embedded OS; firmware to application; HIL simulation; GNC algorithms"
          role: Executes navigation, GNC, health monitoring, mission management, and FTS arming/safing
          status: validated
          detail: >-
            Full software stack developed internally: low-level firmware on embedded microcontrollers,
            operating system, GNC algorithm layer, and mission software. Validated through hardware-in-the-loop
            simulation and 25+ flight tests. MIL-SPEC software qualification (DO-178C or equivalent) not confirmed.
          dependency: Internal team; real-time OS vendor; test infrastructure
          risk: DO-178C qualification status unknown; cybersecurity assessment not reported
    approximationNotes: >-
      Layer details synthesized from company career postings (FPGA, GNC, embedded SW roles), public Series B
      announcement, government contract language, and defense reporting. Specific component vendors and
      performance parameters remain proprietary.
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE012
      - CE013
      - CE014
      - CE029

  - id: FE002
    title: Customer Workflow — Hypersonic Strike Mission Execution
    type: flow
    layout: wide
    summary: >-
      Maps the operational workflow from threat identification through Blackbeard delivery, showing the
      role Castelion's weapon plays at each stage and the integration touchpoints with existing military systems.
    data:
      nodes:
        - id: threat-detect
          label: Threat Detection / Targeting
          detail: >-
            Intelligence, surveillance, and reconnaissance (ISR) systems—satellites, UAVs, JTARS—identify
            time-sensitive moving target or hardened fixed target. Target coordinates passed to fire-control.
          tone: neutral
        - id: fire-control
          label: Fire Control Authorization
          detail: >-
            Army AFATDS, Marine MAGTF AFATDS, or Joint Fires Network receives digital call-for-fire with
            target coordinates. Blackbeard's open fire-control interface accepts standard CFF script without
            bespoke middleware. Navy variant coordinated through carrier strike group LINK-16.
          tone: neutral
        - id: weapon-load
          label: Weapon Load / Platform Prep
          detail: >-
            Navy: Blackbeard loaded on F/A-18E/F wing station (or F-35C internal bay, future). Carrier deck
            operations require NAVAIR NOSSA/WSESRB certification (not yet complete). Army: Blackbeard GL
            loaded in HIMARS MFOM pod; designed for reload time equal to standard GMLRS pod swap (<8 min target).
          tone: neutral
        - id: launch
          label: Launch (Air or Ground)
          detail: >-
            Navy F/A-18: air-launched from carrier or land base. Army HIMARS: salvo capability of 2 rounds/pod,
            4 rounds/truck; a battery of 8 launchers could salvo 32 hypersonic shots. CAML-M (future): crew
            walks away; autonomous launch under satellite relay control.
          tone: positive
        - id: boost-glide
          label: Boost / Hypersonic Glide Phase
          detail: >-
            Solid rocket motor burns ~12 seconds to push vehicle above Mach 5. Post-stage separation, aeroshell
            sheds and wedge-shaped glide body follows depressed trajectory below traditional ballistic arc.
            Inertial + celestial navigation in mid-course. Speed and trajectory profile compress adversary
            detect-to-react cycle from minutes to tens of seconds.
          tone: positive
        - id: terminal
          label: Terminal Guidance and Strike
          detail: >-
            Multi-mode EO terminal seeker acquires and tracks target in final phase. Mid-flight re-targeting
            supports time-sensitive movers (TELs, ships, C2 vehicles). CEP <2 m at 600 km claimed (design
            target from defense-aerospace.com; not independently validated). Strike warhead: 75 lb (Navy) or
            220 lb unitary/penetrator (Army GL design target).
          tone: positive
        - id: battle-damage
          label: Battle Damage Assessment
          detail: >-
            Post-strike BDA conducted via ISR. No Castelion-specific BDA technology; relies on existing
            joint ISR architecture. Magazine replenishment depends on Project Ranger production capacity
            (thousands/year target) and logistics chain from NM.
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE003
      - CE009
      - CE010
      - CE024
      - CE025

  - id: FE003
    title: Critical Dependency Map — Suppliers, Platforms, Regulators, Facilities
    type: dag
    layout: wide
    summary: >-
      Maps the key external dependencies for Castelion's Blackbeard program across supply chain,
      launch platforms, regulatory bodies, and enabling infrastructure, with risk severity for each node.
    data:
      nodes:
        - id: castelion-hq
          label: Castelion (Torrance, CA)
          detail: HQ, avionics integration, seeker assembly, flight software, system integration and test
          type: internal
          risk: low
        - id: project-ranger
          label: Project Ranger (Rio Rancho, NM)
          detail: SRM manufacturing, static test, final assembly; $220M investment; 21 buildings by end-2026; environmental permits pending
          type: internal
          risk: high
        - id: midland-tx
          label: Midland, TX Propulsion Facility
          detail: Current SRM development and hot-fire testing site; active before Project Ranger completes
          type: internal
          risk: medium
        - id: ap-supply
          label: Ammonium Perchlorate Supplier
          detail: Primary oxidizer for solid rocket motor; few domestic suppliers; concentration risk; PFAS/environmental controls required
          type: external-supplier
          risk: high
        - id: fpga-supply
          label: AMD/Xilinx FPGA Supply Chain
          detail: Commercial FPGA for avionics processing; geopolitical supply-chain risk for semiconductor components
          type: external-supplier
          risk: medium
        - id: automotive-supply
          label: Automotive-Grade Component Suppliers
          detail: Metal cases, rubber attachments, commercial-grade computers; non-traditional defense supply chain; reduces cost and lead time
          type: external-supplier
          risk: low
        - id: fa18-boeing
          label: Boeing (F/A-18 Integration)
          detail: Aircraft OEM; Q2 FY2027 contract modification for expanded flight envelope; integration activities for expanded carriage
          type: platform-partner
          risk: medium
        - id: himars-lockheed
          label: Lockheed Martin (HIMARS/MFOM)
          detail: HIMARS launcher OEM; Blackbeard GL must fit MFOM pod rails; requires compatibility testing
          type: platform-partner
          risk: low
        - id: navair-nossa
          label: NAVAIR NOSSA / WSESRB
          detail: Naval Ordnance Safety and Security Activity; mandatory safety certification before carrier operations; not complete May 2026
          type: regulator
          risk: high
        - id: sandoval-permits
          label: Sandoval County / NM Environmental Regulator
          detail: Environmental and land-use permits for Project Ranger SRM manufacturing and static testing; community opposition active
          type: regulator
          risk: high
        - id: itar-dtsa
          label: DTSA (ITAR Category IV)
          detail: Defense Technology Security Administration; controls any export of guidance, seeker, avionics technology; no FMS cases in process
          type: regulator
          risk: medium
        - id: range-facilities
          label: Test Ranges (White Sands, Point Mugu, Spaceport NM)
          detail: Government-provided test ranges for flight testing; range safety requires FTS qualification
          type: infrastructure
          risk: medium
      edges:
