    rows:
      - - Blackbeard — Air Launch (MACE/Navy)
        - U.S. Navy (carrier air wing, F/A-18E/F)
        - Pre-EOC prototype; $155M in executed FFP contracts; F/A-18 integration underway; EOC targeted FY2027
        - Only air-launched Mach 5+ weapon competing at <$300K/AUR; internal F-35C carriage planned
        - NAVAIR NOSSA/WSESRB safety certification not yet complete; no carrier live-fire confirmed
      - - Blackbeard GL — Ground Launch (HX3/Army)
        - U.S. Army (HIMARS, future CAML-M)
        - Phase 1 proof-of-concept; $25M FY2026 Army budget; Phase 2 MVP prototypes targeted end-FY2026
        - HIMARS-compatible; autonomous launcher companion (CAML-M); ~80% of PrSM Inc 4 range at fraction of cost
        - FTS qualification pending; no independent Army live-fire completed
      - - Solid Rocket Motor (propulsion subsystem)
        - Both variants; internally produced
        - Active manufacturing in Torrance, CA; Project Ranger (NM) intended for scale; 20+ motors test-fired
        - In-house SRM eliminates defense propulsion supply-chain markup and lead time
        - Production yield, static-fire qualification, and DOT/FAA explosive-materials transport permits at scale unconfirmed
      - - GNC / Seeker System
        - Both variants; internally integrated
        - Validated in 25+ flight tests; multi-mode EO seeker tracking moving targets confirmed in test
        - Terminal seeker enables moving-target engagement; inertial + celestial mid-course reduces GPS dependence
        - Exact seeker type (EO/radar/dual-mode), update rate, and CEP at production scale not publicly disclosed
      - - FPGA Avionics & Flight Computers
        - Both variants; internally designed
        - Vitis HLS workflow in production design; HALT/HASS reliability testing underway per job postings
        - Automotive-grade silicon vs. space-rated parts; 52-week lead time reduced to weeks; reduces cost
        - No independent radiation hardening or EMI qualification confirmed for the production design
      - - Thermal Protection System (TPS)
        - Both variants; internally produced
        - In development; siliconized carbon-carbon nose tip validated in flight test; yield ~70%
        - In-house autoclave curing from rocket-nozzle manufacturing heritage; avoids specialty TPS suppliers
        - Yield target (>90%) not yet met; scale-up risk for Project Ranger production rate
      - - Mission Software Stack
        - Both variants; internally developed
        - Embedded flight software validated across 25+ flight tests; GNC algorithms and HIL simulation confirmed
        - Full-stack internal software eliminates proprietary COTS avionics software licensing; fast iteration
        - MIL-SPEC software qualification (DO-178C or equivalent) not confirmed; cybersecurity audit not reported
      - - Follow-on Second Hypersonic System
        - Undisclosed; shared subsystem infrastructure
        - Pre-contract, early development; shared propulsion and guidance stack with Blackbeard
        - Shared component base reduces cost and development timeline for second weapon
        - Program name, target market, technical spec, contract status, and development spend not disclosed
