  - id: integration-and-test
    title: Platform Integration, Flight Test, and Development Maturity
    body: >-
      Castelion's most significant evidence of technical maturity is its flight-test record: more than 25
      developmental flight tests were completed through December 2025, and Army Senate Armed Services Committee
      testimony in May 2026 confirmed that the company had executed 25 of its own test events over the prior
      year. No other U.S. hypersonic startup has reached this test cadence. The first flight test occurred in
      March 2024 at the Mojave Desert, just 16 months after the company was founded—a pace unprecedented for
      complex hypersonic hardware. Subsequent tests have been conducted at Black Rock Desert (Nevada),
      Point Mugu Sea Range (California), Spaceport New Mexico, White Sands Missile Range, and via an
      Oshkosh MKR18 LVSR (10×10) mobile launcher truck, which the company has converted into a deployable
      ground launch platform. In October 2024, Castelion was awarded Army and Navy integration contracts
      to begin adapting Blackbeard for live-fire demonstrations on operational platforms. The February 2026
      Navy contract (N6833526F1022, $49,998,005 FFP) covers full-scale prototypes, flight testing, and
      early operational capability. The April 2026 option modification (P00001, $104,998,566) funds final
      EOC requirements, F/A-18 hardware and software integration, and live-fire tests in the Indo-Pacific
      Command area of responsibility, with completion expected in January 2028. Boeing is expected to receive
      a contract modification in Q2 FY2027 for aircraft integration activities expanding the full F/A-18E/F
      flight envelope, with IOC contract award accelerated from FY2028 to FY2027 through reconciliation
      funding. For the Army, a $25M FY2026 budget commitment under HX3 funds Phase 1 (proof-of-concept
      demonstration with existing HIMARS-compatible pods, originally Q1 2026) and Phase 2 (10 MVP prototype
      flights from HIMARS). The FY2027 Navy budget proposes the first procurement lot: 353 Blackbeard missiles
      for $156M (~$442K/AUR), a starting point expected to decline toward the $300K target at scale.
      The current development maturity is pre-EOC prototype: the company has validated all key subsystems
      through flight test but has not yet completed the NAVAIR carrier-aviation safety and airworthiness
      certification required for carrier-based deployment.
