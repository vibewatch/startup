      - - ITAR Export Controls (Category IV)
        - Active; guidance stack components are ITAR Category IV controlled
        - Applies to all guidance, seeker, and avionics components with ITAR-controlled technology
        - Any FMS or allied-nation sale requires DTSA review; no export case is currently being processed
      - - Environmental / EHS Permitting (Project Ranger)
        - Incomplete; Sandoval County permitting process ongoing as of May 2026
        - Governs ammonium perchlorate handling, static-fire test emissions, groundwater protection, and PFAS foam use
        - Community opposition and outstanding permits create potential schedule risk for Project Ranger commissioning
      - - Airworthiness Certification (F/A-18)
        - In progress; April 2026 contract explicitly funds "system safety assessments and flight trials" for F/A-18
        - Required for all Navy air-launched weapons before operational deployment from carrier deck
        - No carrier-based live-fire test has been completed as of May 2026
      - - MIL-SPEC / Production Qualification
        - Not confirmed; program remains in prototype (pre-production) phase
        - Required for transition from prototype to production status under DoD acquisition regulations
        - No public documentation of MIL-SPEC qualification process or schedule
      - - Cybersecurity (RMF / CMMC)
        - Not publicly reported or confirmed
        - Applies to all DoD-contractor weapon systems handling controlled unclassified information
        - Absence of public reporting is a diligence gap; request DoD cybersecurity assessment status
      - - Environmental Health & Safety (EHS) Programs
        - Active EHS program at Torrance, CA (HQ) and Rio Rancho, NM (under construction)
        - Covers energetic material handling, composite fiber manufacturing, and fire suppression protocols
        - AP fire suppression does not use water; evacuation-and-containment strategy confirmed by CFO at community meeting
    notes: >-
      All compliance status assessments are based on public contract language, company announcements, and
