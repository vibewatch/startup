  - id: manufacturing-infrastructure
    title: Manufacturing Technology and Project Ranger
    body: >-
      Castelion's manufacturing approach combines vertical integration of key subsystems with advanced
      production methods borrowed from commercial aerospace. The company machines motor casings in-house,
      winds composite shrouds, assembles seeker boards, and fabricates flight-control fins and avionics
      harness support trays using multi-laser powder-bed additive manufacturing (3D printing), which
      reduces traditional supply lead times by approximately 10 weeks per component generation. Metal cases
      and rubber components are sourced from automotive-industry suppliers—rather than traditional defense
      vendors—to cut material costs. Enterprise resource planning runs on NetSuite with Manufacturo MES
      (or a comparable Manufacturing Execution System) for production tracking. Manufacturing yield for
      the thermal protection system (siliconized carbon-carbon nose tip layup) is approximately 70% per
      industry sources, against a production-scale target of 90%+. Castelion has deployed additional
      layup tubes to work on yield improvement outside of government contract funding. The company
      produced more than 50 missile articles in calendar year 2025, validating its high-cadence hardware
      strategy before Project Ranger is operational. Project Ranger is a 1,000-acre hypersonic
      manufacturing campus in Sandoval County (Rio Rancho), New Mexico, representing $220M in privately
      funded capital investment ($250M per Reuters). The facility is designed for solid rocket motor
      (SRM) manufacturing, SRM static testing, and final weapon assembly. All 21 planned buildings are
      targeted for completion by end-2026, with the first building expected in summer 2026. At full
      capacity, Project Ranger is designed to produce thousands of Blackbeard missiles annually, well
      above the 500 AUR/year minimum required by the Navy MACE contract. The company operates additional
      manufacturing and engineering facilities in Torrance, CA (HQ); Allen, TX (FPGA engineering);
      and Midland, TX (propulsion and environmental testing).
