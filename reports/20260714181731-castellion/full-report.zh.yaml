  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架与投资概览
        blocks:
          - type: paragraph
            body: >-
              Castelion 的风险画像由四股力量交织塑造：作为含能材料制造新进入者，技术和监管复杂度高；几乎完全依赖单一政府客户；小型创始团队带来较高执行风险，且没有披露接班计划；$2.8 billion
              估值隐含非约束性 DoW 生产框架能成功转成获拨款的多年合同。公司已在 seed、Series A 和 Series B 轮累计筹集约 $464
              million，资本储备可观，但仍处于生产收入前阶段，必须先通过多个资格关口，才会获得生产规模合同付款。本章按已知缓释后的残余严重度排序风险：Project Ranger
              的监管和环境风险短期不确定性最高，因为社区反对活跃且环境审查未完成；高氯酸铵供应链集中，是整个 SRM
              行业共同面对的结构性脆弱点；关键人物和执行风险中等，但有适当接班规划即可管理；财务和竞争风险偏高，但被框架协议和强投资人支持部分抵消。最后一节列出否决条件和监测指标。
