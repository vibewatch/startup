  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Castelion 的影响
      - 尽调问题
    rows:
      - - 中国 DF-17 / DF-ZF 已实战部署
        - 驱动因素
        - 已在发生
        - 这是美国高超音速采购紧迫性的核心政策理由，直接支撑项目优先级
        - 确认 DoD 威胁评估是否明确把 Blackbeard 级能力列为反制手段
      - - 俄罗斯 Kinzhal / Avangard / Zircon 已服役系统
        - 驱动因素
        - 已在发生
        - 次要理由；强化国会两党对高超音速支出的共识
        - 核实俄罗斯威胁在多大程度上驱动大西洋与太平洋态势预算
      - - 伊朗冲突导致美国导弹库存消耗
        - 驱动因素
        - 2025–2026 紧迫性
        - 加快近期采购节奏；让 10,000+ 枚导弹计划在政治上更可行
        - 确认实际库存水平，以及 Blackbeard 是否算补库弹药
      - - Arsenal of Freedom / DoD 采办转型
        - 驱动因素
        - 2025–2028
        - 政策顺风；其他交易授权为新进入者移除传统采办门槛
        - 评估政治领导层更替后的持续性；OTA 合同可能被挑战
      - - 低成本量产硬要求（$384K 目标）
        - 驱动因素
        - 2026–2031
        - Castelion 因此相对传统成本架构高得多的主承包商形成结构性市场优势
        - 核实 $384K 目标是否是固定总价，且不受生产阶段成本上升影响
      - - 高超音速材料 / 热防护供应链约束
        - 约束
        - 2026–2028
        - 可能拖慢 Project Ranger 爬坡，让产量低于需求，SOM 落地的关键风险
        - 审查热防护材料、SRM 推进剂和导引头组件供应商清单
      - - 高超音速测试靶场容量稀缺
        - 约束
        - 持续
        - 拖慢认证节奏；任何靶场排期失败都会推迟 EOC 和采购
        - 审阅 Castelion 的测试靶场预订协议和备用靶场选项
      - - 海军适航认证流程
        - 约束
        - 2026–2027 关口
        - 近期最关键单一关口；失败或异常可能让采购推迟 12–24 个月
        - 确认安全评审状态，以及 FY2026 测试活动是否仍有未关闭异常
      - - 国会授权 12,000 枚多年期采购
        - 约束
        - FY2027 NDAA 周期
        - 尚未解决；DoW 框架需要拨款，但尚未过会
        - 跟踪 FY2027 NDAA 标记审议中的 Blackbeard 多年期采购措辞
      - - ITAR / 出口管制制度
        - 约束
        - 持续
        - 限制供应商池多元化，也限制没有豁免的盟友 FMS 销售
        - 评估是否有子系统来自受限司法辖区
      - - 军控 / 升级风险政策关切
        - 约束
        - 开始显现
        - 未来可能形成政治逆风；军控倡议在 SASC 层面获得关注
        - 跟踪国会听证记录中的反高超音速扩散情绪
      - - 传统主承包商适应低成本要求带来的竞争
        - 约束
        - 2027–2030
        - Lockheed、Raytheon 可能重组投标，或收购新进入者，在下一轮类似 MACE 的项目周期中竞争
        - 关注 Lockheed 或 Raytheon 收购高超音速初创公司，或提交新的低成本报价
    notes: 时间标签为定性判断。驱动因素 / 约束分类反映截至 2026 年 5 月 Castelion 的市场位置。尽调问题是仅靠公开来源无法解决的开放项。
