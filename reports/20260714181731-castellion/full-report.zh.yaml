      - number: '6.5'
        title: 集中风险、反向证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Castelion 的客户画像带有极端集中风险：单一买方（美国 Department of War）贡献 100% 收入。在这一个客户内部，美国海军是主导的已签约买方（已执行
              $154.9M），陆军和空军居次。早期防务初创公司出现这种情况并不罕见，但对尽调的含义很重。第一，DoD 高超音速项目优先级、Congressional appropriations
              或采办政策出现任何不利变化，都可能在一次项目审查周期内消除或大幅削减 Castelion
              的收入基础。第二，没有净留存率（NRR）、总留存率（GRR）、流失率、客户满意度分数或商业留存指标可用；防务合同模式用合同修改和后续授予替代这些指标。截至本报告日期，Castelion 的“留存”记录完全正面：从
              2023 年空军 $1.77M SBIR 到 2026 年 Navy $154.9M，每个接触过的军种都扩大了关系。社区层面的反向证据与客户集中度是两条线：New Mexico 州 Sandoval County
              的 Project Ranger 场址，已经因居民担忧高氯酸盐污染、噪声和地下水风险而引发有组织反对。数百人参加了 October 和 December 2025 社区会议。militarypoisons.org
              的环保活动文章把该设施描述为潜在公共卫生危机。虽然这不直接威胁现有客户合同——客户是 DoD，不是社区——但会带来监管、许可和声誉风险，可能拖慢制造爬坡，进而影响生产合同履约。截至 May
              2026，公开记录中没有合同抗议、GAO 投标挑战或竞争性采购争议的证据。


              独立分析机构 IPO Club 认为，AUKUS 伙伴——Australia 和 United Kingdom——可能通过 Foreign Military Sales
              成为未来出口客户，把收入基础扩展到当前唯一买方之外。传统 DoD 项目历来依赖陈旧工程实践，这给 Castelion 带来结构性需求优势，因为项目经理在寻找商业级效率。不过，New Mexico 的
              Project Ranger 设施遭遇社区反对，理由包括有毒化学品和 PFAS 污染风险；如果监管障碍真正出现，这会成为不可忽视的供应链风险，限制产能扩张。
