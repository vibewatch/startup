      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >-
              按过去十二个月收入计算，Castelion
              的收入倍数在同业组里最高，反映市场在押注尚未出现在已披露数字中的规模化生产收入。最有参考价值的可比对象，是同一资本环境下近期完成融资的私营防务科技创业公司。Anduril Industries 在 May
              2026 完成 $5 billion Series H，估值 $61 billion——约为 2025 年 $2.2 billion 过去收入的 27.7×——此前其收入同比翻倍以上，并拿下 $20
              billion 陆军企业合同。Shield AI 在 March 2026 完成 $1.5 billion Series G，估值 $12.7 billion——约为 $540 million-plus 2026
              预测收入的 23.5×。直接高超音速技术同业 Hermeus 在 April 2026 完成 $350 million Series C 后估值达到 $1 billion；Hermeus
              没有生产收入，因此按每次飞行测试隐含价值来比，更适合作为 Castelion 量产前溢价的参照。上市公司中，Kratos
              Defense（KTOS）是最接近的公开可比——一家正在扩张无人系统和高超音速子系统的中型防务硬件公司——基于 $1.347 billion 2025 收入，EV/revenue 约
              9–12×。大型防务主承包商（Lockheed Martin 1.8×、RTX 3.0×、Northrop Grumman 2.3×）是公司成熟后的结构性底部可比，不适合作为量产前创业公司的目标。核心估值问题不是
              Castelion 的收入倍数是否高于 Anduril 或 Kratos——答案是高——而是前瞻生产合同管线能否支撑当前溢价。如果 DoW 框架转化且按计划完成规模化爬坡，隐含的 $2.8 billion
              入场价在 Series B 阶段可能显得有吸引力。若未兑现，任何可实现的近期收入基数都会让倍数大幅压缩。
