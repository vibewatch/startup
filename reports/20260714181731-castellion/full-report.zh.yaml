      - number: '6.2'
        title: 美国海军：MACE 项目与舰载航空联队采用
        blocks:
          - type: paragraph
            body: >-
              美国海军是 Castelion 的主导客户，也是近期合同收入的主要驱动。Naval Air Systems Command（NAVAIR）最早在 February 2024 通过 Multi-mission
              Affordable Capacity Effector（MACE）项目的 Request for Information 释放需求，寻找一款面向 F/A-18E/F Super Hornet
              的可负担空射防区外高超音速武器，并把 F-35A/C 内置挂载列为目标项。April 2026，Castelion 的 Blackbeard 被确认为 MACE 项目下首个入选武器。采购节奏异常快：初始
              $49,998,005 合同（基于 BOA N6833526G0006 的订单 N6833526F1022）在 February 25, 2026 授予，按 SBIR Phase III 条款资助全尺寸
              Blackbeard 原型、飞行测试和早期作战能力。不到两个月后的 April 24, 2026，又执行了一项 $104,998,566
              合同修改（P00001），资助最终集成要求、系统安全和适航认证，以及印太司令部责任区内实弹测试活动，确认海军的作战区域优先级和持续承诺。截至 April 2026，已执行 Navy 合同累计价值达到
              $154.9M。April 2026 发布的 Pentagon 预算文件显示，海军计划未来五年为 F/A-18E/F 机队采购 4,500 枚 Blackbeard 导弹，平均单位成本约
              $384,000。FY2027 采购规划明确为首个生产批次的 353 枚导弹分配 $156M。后续批次大幅上升：FY2028 目标 691 枚 AUR，FY2029 目标 976 枚 AUR，FY2030 目标
              1,115 枚 AUR，FY2031 目标 1,375 枚 AUR——这意味着 Navy 预期 Blackbeard 将成为其舰载航空联队库存中数量最多的高超音速打击弹药。MACE
              项目不同于传统高超音速采购：它依赖 Other Transaction Authority 与 SBIR Phase III 固定价格合同的组合，以加快时间线并压缩行政开销。
