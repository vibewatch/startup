  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与作战流程
        blocks:
          - type: paragraph
            body: >-
              Castelion 的主力产品是 Blackbeard，一款远程高超音速打击武器，设计目标是以超过 Mach 5 的速度攻击时间敏感、机动或加固目标。放进客户作战流程看，Blackbeard
              嵌入美国现有军事打击链，可作为更便宜、更高频的替代方案，替代单价数千万美元的战略级高超音速滑翔器，也替代传统亚音速防区外弹药；后者缺少速度和弹道不可预测性，难以压制现代一体化防空系统。该武器正按两个平台型别推进，并共用底层子系统基础设施。空射海军型属于
              Navy Multi-mission Affordable Capacity Effector（MACE）项目，由 F/A-18E/F Super Hornet 携带，并要求未来可在 F-35A/C
              武器舱内置挂载四枚 AUR。Navy MACE 要求规定：射程与 AGM-158C LRASM 互补（至少 370+ km）、75 lb 战斗部（政府集成）、在年产至少 500 枚 AUR 时单位成本低于
              $300,000，并在 FY2027 形成 Early Operational Capability。地面发射陆军型——HX3/Project CAML 项目下的 Blackbeard
              GL——目标是以一小部分成本达到 PrSM Increment 4 射程约 80%（估计 500–1,000+ km），兼容现有 HIMARS MFOM pod 架构，并与自主 Common Autonomous
              Multi-Domain Launcher（CAML-M）同步开发。与此同时，Castelion 披露了第二条早期高超音速产品线，与 Blackbeard
              共用低成本子系统基础设施，但尚未公开合同、项目名称或时间表。两个型别的买方都是美国 Department of War；没有商业客户。
