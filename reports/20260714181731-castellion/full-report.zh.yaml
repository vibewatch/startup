      - number: '4.4'
        title: 财务结论与关键尽调缺口
        blocks:
          - type: paragraph
            body: >-
              按公开材料可做的投资评估标准看，Castelion 的收入质量较高：固定总价政府合同带来较强回款确定性，SBIR Phase III 工具为近期合同提供竞争隔离，May 2026 DoW
              生产框架也释放出可信的前向需求信号。关键未解问题是，这一框架能否转成有约束力的多年采购合同；截至 December 2025，Castelion 仍未拿到生产合同。FY2026 联邦预算中，支持 MACE 以及
              Blackbeard 开发的总额约 $379M，来自基础拨款、国会追加和 reconciliation funding，说明政府承诺强，但生产收入还没有合同确定性。客户集中度是绝对的：美国 DoD
              是唯一买方，任何项目取消、测试失败或预算重新分配，都会在没有商业收入流对冲的情况下实质性冲击收入。$2.8B 估值意味着，在部分落地的合同基础上给了激进收入倍数，也重押生产框架最终转化。New Mexico 州
              Sandoval County 的社区反对聚焦高氯酸盐污染风险、潜在 PFAS 暴露和静态点火测试噪声，这给 Project Ranger
              制造扩张叠加了环境许可和政治风险，投资人不应忽视。按当前估值投资前，必须补齐的关键尽调动作包括：量产规模下的毛利率、实际烧钱速度和现金跑道、有约束力的生产合同条款，以及 Project Ranger
              环境许可状态。
