      - - HIMARS → CAML 发射器切换
        - 扩张驱动
        - CAML M 型被设想为 Blackbeard 的主要陆军发射器，将现有 HIMARS 车队扩展到新型自主发射器
        - 中 — 扩大陆军弹药深度；取决于 CAML 开发时间线
        - 跟踪 CAML 项目里程碑排期；发射器进度滑坡可能拖延陆军需求
      - - FMS / 盟国销售
        - 扩张驱动
        - 20+ 个美国盟国使用 HIMARS；Blackbeard 兼容 HIMARS，自然打开 FMS 路径；尚未确认 FMS
        - 中高（未来）—— 需要 ITAR 许可和政府间协议
        - 索取美国国务院和 DSCA 的 FMS 资格审查时间线
      - - 第二条 Castelion 产品线
        - 扩张驱动
        - Series B（2025 年 12 月）资助“第二条高超音速产品线的并行成熟”；可能增加新客户关系
        - 低（近期）—— 第二产品尚无公开客户合同
        - 跟踪 Castelion 新闻稿，关注第二产品客户公告
      - - 单一买方集中（DoD = 100% 收入）
        - 集中度风险
        - Castelion 没有商业或盟国客户；100% 收入来自美国 DoD；任何项目重组、预算撤销或测试失败都会切断收入
        - 关键 —— 没有收入多元化缓冲
        - 要求提供合同积压、修改授权和未义务余额的详细拆分
