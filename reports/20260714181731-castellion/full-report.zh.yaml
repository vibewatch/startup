      - number: '3.6'
        title: 要点
        blocks:
          - type: callout
            title: 单位价格结构性优势是主要护城河
            body: >
              Castelion 对每枚 Blackbeard 导弹约 ~$384,000 的目标价格，比 Lockheed Martin ARRW 便宜 40 多倍，比海军 Conventional Prompt
              Strike 滑翔体便宜 100 多倍。这不是边际成本优势——它从根本上改变了航母舰载机联队能携带多少导弹、单次交战能消耗多少导弹，以及 DoD 预算如何配置到高超音速威慑。如果 Castelion
              能以这一价格实现量产，当前没有竞争者能在不彻底重构采办和制造模式的情况下匹配。
            calloutType: strength
            claimRefs:
              - CP002
              - CP006
              - CP011
              - CP024
          - type: callout
            title: 生产规模尚未在目标单位成本上验证
            body: >
              截至 2026 年 5 月，Project Ranger 仍在建设中，尚未以 $384,000 目标成本生产作战导弹。DoD 框架协议的前提，是 Castelion
              在采购交易正式化之前通过测试和验证。如果首批作战批次的生产成本超过目标，或测试失败暴露，12,000 多枚导弹的需求信号可能被推迟或缩减。这是核心执行风险；只有监测清楚后，Castelion
              的护城河才可被视为耐久。
