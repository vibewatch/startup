      - number: '5.6'
        title: 信任、安全、质量与合规
        blocks:
          - type: paragraph
            body: >-
              Castelion 的合规负担主要来自弹药安全认证、出口管制和环境许可。沿 Navy 舰载航空路径推进时，主要关口是 NAVAIR NOSSA（Naval Ordnance Safety and Security
              Activity）审查和 WSESRB（Weapon Systems Explosives Safety Review Board）认证；Blackbeard
              获准在航母上存储、装载和飞行前，这两项都是强制条件。FY2026 reconciliation bill 明确拨出 $89M，用于“完成供应商开发、政府集成成本、NOSSA/WSESRB 认证，以及支持最低
              EOC 构型的靶场/飞行”，确认截至 May 2026 这些审查仍未完成。Army HIMARS 集成则要求先设计、建造并鉴定 Flight Termination
              System（FTS），靶场安全才允许实弹测试；该系统正在开发。Castelion 在 Torrance（总部）和 Rio Rancho（Project Ranger）运营 Environmental,
              Health, and Safety（EHS）项目，覆盖高氯酸铵（AP）处理、铝粉燃料、复合纤维制造，以及含能材料消防规程（AP/铝火灾不能用水）。在 Project Ranger，Castelion
              承认，固体火箭发动机氧化剂高氯酸铵需要严格的高氯酸盐围堵和地下水监测，以保护供应 Rio Rancho 饮用水的 Santa Fe Group aquifer。October 和 December 2025
              社区会议上，数百名居民正式提出担忧，涉及高氯酸盐污染、静态点火测试噪声、灭火泡沫中的 PFAS 风险和施工径流。截至 May 2026，Castelion 尚未取得 Project Ranger
              全部环境许可。量产硬件的 MIL-SPEC 鉴定尚未公开确认；项目仍处于原型和 EOC 前状态。没有公开报道显示 DoD
              或独立第三方完成过网络安全审计。也没有公开报道的安全事故、造成人员伤害的测试失败或产品召回。
