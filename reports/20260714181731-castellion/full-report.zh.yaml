      - number: '6.3'
        title: 美国陆军：HX3 地面发射项目与 HIMARS 集成
        blocks:
          - type: paragraph
            body: >-
              美国陆军是 Castelion 的次级活跃客户，也是地面发射 Blackbeard 型别（指定为 Blackbeard GL 或 HX3）的驱动方。陆军高层在 May 2025 批准 Blackbeard GL
              的紧急需求，指示 Rapid Capabilities and Critical Technologies Office 在新的 Common Autonomous Multi-Domain
              Launcher（CAML）工作框架下推进项目。陆军在 FY2026 预算中为 Blackbeard GL 开发分配 $25M，并把项目设计成固定价格 Other Transaction Authority
              下的两阶段 Middle Tier Acquisition 快速原型工作。Phase I 要求使用政府提供的 MFOM pod 交付一次概念验证飞行，目标在 January 至 March 2026
              之间演示。Phase II 要求提供十枚接近量产状态的弹体，用于 HIMARS 发射飞行测试，目标在 FY2026 结束前完成。陆军的既定目标，是以显著更低成本达到未来 Precision Strike
              Missile Increment 4 约 80% 的能力，填补陆军高低搭配远程火力组合中的“低端”层。陆军预算文件预计 FY2027-2029 还有 $120M HX3 追加支出；如果 Phase II
              测试成功，陆军预计 early FY2028 开始接收 Blackbeard 导弹用于部署。Blackbeard GL 被设计成兼容 HIMARS 的过渡方案，CAML 则是远期主要发射器。陆军承诺还体现在
              Lt. Gen. Frank Lozano（Portfolio Acquisition Executive Fires）参加 January 2026 Project Ranger
              破土仪式——这是高层客户参与超过合同文件本身的信号。Defense Aerospace 估计，Blackbeard GL 的低速初始生产成本低于每枚 $7M，而 Long Range Hypersonic
              Weapon 超过 $40M；6-8x 成本降低正是陆军弹药库存深度逻辑的核心。
