      - number: '5.4'
        title: 平台集成、飞行测试与开发成熟度
        blocks:
          - type: paragraph
            body: >-
              Castelion 技术成熟度最强的证据，是飞行测试记录：截至 December 2025 已完成 25 次以上开发性飞行测试；May 2026 陆军在参议院军事委员会的证词也确认，公司在此前一年完成了 25
              次自有测试活动。没有其他美国高超音速初创公司达到这种测试节奏。首次飞行测试发生在 March 2024 的 Mojave Desert，距离公司成立仅 16
              个月——复杂高超音速硬件此前没有这样的速度。后续测试地点包括 Black Rock Desert（Nevada）、Point Mugu Sea Range（California）、Spaceport New
              Mexico、White Sands Missile Range，并使用一辆 Oshkosh MKR18 LVSR（10×10）移动发射卡车；公司已把它改造成可部署的地面发射平台。October
              2024，Castelion 获得 Army 和 Navy 集成合同，开始把 Blackbeard 改造到现役平台上做实弹演示。February 2026 Navy
              合同（N6833526F1022，$49,998,005 FFP）覆盖全尺寸原型、飞行测试和早期作战能力。April 2026 期权修改（P00001，$104,998,566）为最终 EOC 要求、F/A-18
              软硬件集成，以及印太司令部责任区内实弹测试提供资金，预计 January 2028 完成。Boeing 预计将在 Q2 FY2027 获得一项合同修改，承担飞机集成活动，扩展完整 F/A-18E/F
              飞行包线；IOC 合同授予通过 reconciliation funding 从 FY2028 提前到 FY2027。陆军方面，HX3 项下 $25M FY2026 预算承诺资助 Phase 1（使用现有
              HIMARS 兼容 pod 的概念验证演示，原计划 Q1 2026）和 Phase 2（从 HIMARS 发射 10 次 MVP 原型飞行）。FY2027 Navy 预算提出首个采购批次：353 枚
              Blackbeard 导弹，金额 $156M（约 $442K/AUR）；预计规模化后会向 $300K 目标下降。当前开发成熟度仍是 EOC
              前原型阶段：公司已通过飞行测试验证全部关键子系统，但尚未完成舰载部署所需的 NAVAIR 舰载航空安全与适航认证。
