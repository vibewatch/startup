  - id: TV002
    title: 投资论点与反论点
    columns:
      - 类型
      - 论点
      - 支持证据
      - 会改变观点的因素
    rows:
      - - 论点
        - 需求有结构性，也已有资金支持：DoD 库存里没有可负担、可量产的高超声速打击武器，留下任务关键缺口；Castelion 的方案正好独特切入这个缺口。
        - DoW 生产框架（2026 年 5 月）、MACE 合同、FY2026 对 Blackbeard 项目 $379M 预算承诺。
        - FY2027 NDAA 取消所有 MACE 及配套高超声速预算条线。
      - - 论点
        - SpaceX DNA 执行力：三名 SpaceX 前高管不到三年完成 25+ 次飞行测试——这种速度在防务制造初创中没有先例。
        - Altimeter 合伙人引述确认 25+ 次飞行测试；Series B 新闻稿称仅 2025 年就完成 20+ 次开发测试。
        - 两名或更多共同创始人离职，或出现系统性测试失败。
      - - 论点
        - 先发制造护城河：Project Ranger 建出 1,000 英亩固体火箭发动机产能；同类初创尚无公司启动过可比的专用制造基地。
        - Project Ranger 于 2026 年初破土；私人投资 $220M；计划 21 栋建筑，到 2026 年底实现全面生产。
        - 另一家供应商以可比成本拿到可负担高超声速武器的竞争性生产合同。
      - - 反论点
        - 约 54× 收入倍数要求执行近乎零失误：当前估计收入约 $51.5M，只有生产框架快速转化、并把年收入拉到数亿美元，才能支撑 $2.8B 估值。
        - 第三方收入估算（CompWorth、Growjo）；可比未上市同业交易在 23–28×。
        - 生产框架转化，收入爬升至 ≥$150M，把倍数压到可辩护区间。
      - - 反论点
        - DoW 生产框架没有约束力：2026 年 5 月框架是需求信号，不是采购订单；转化前还要完成实弹测试并宣布 EOC。
        - DoW 新闻稿使用「框架协议」措辞；财务章节对合同转换条件的分析。
        - 与 DoD 签署有约束力的多年生产合同。
      - - 反论点
        - 高超声速标签存在模糊性，带来项目风险：The War Zone 公开质疑 Blackbeard 飞行剖面是否满足严格的 Mach 5+ 持续高超声速定义，而这个标准卡住它的 DoD 预算条线。
        - The War Zone 2025 年 6 月报道称，陆军预算文件写道「Blackbeard 究竟会如何达到高超声速仍不清楚」。
        - Castelion 发布经验证的飞行性能数据，确认作战测试弹道可持续达到 Mach 5+。
    notes: 论点和反论点各行仅基于公开证据。未公开技术、财务和合同数据可能实质改变任何一行。
