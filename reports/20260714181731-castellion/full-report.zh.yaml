      - number: '2.3'
        title: 买方与平台分层
        blocks:
          - type: paragraph
            body: >-
              美国国防采购体系形成了分层买方结构：政策负责人（战争部长、负责研究与工程的副部长）、项目赞助方（NAVAIR、陆军导弹与空间项目执行办公室），以及最终提出需求的作战部队。Castelion
              的直接付款方是通过项目合同付款的美国政府；现阶段没有商业客户、国际买方或中间分销商。国会授权和拨款是项目意图走向有资金合同之间的闸门。

              海军是最直接的买方细分。MACE 项目正式选择 Blackbeard 作为海军主要空射高超音速打击弹药，F/A-18E/F Super Hornet 是主要发射平台，F-35C
              是具备隐身能力的次要载机（内埋挂载四枚）。采用触发点是完成适航认证和实弹集成测试，目标是在 2027 年达到 Early Operational
              Capability。预算权掌握在海军负责研究、开发与采办的助理部长手中。

              陆军通过 HX3/HIMARS Blackbeard Ground Launch 项目构成较小的平行买方渠道。FY2026 为 HIMARS 和 M270 发射器上的概念验证与集成测试分配 $25M。陆军逻辑是为
              Long Range Hypersonic Weapon（LRHW/Dark Eagle）提供更具成本效益的补充，以 LRHW 单位成本的一小部分实现更广分布。这里的采用触发点，是固定翼飞行测试和 HIMARS
              发射演示成功。

              战争部作为「Arsenal of Freedom」框架下的企业级买方，代表天花板最高但不确定性也最大的渠道。框架协议承诺每年至少 500 枚导弹，并寻求五年总计 12,000
              枚的授权；但国会必须拨款，且本分析审阅的公开 FY2027 预算文件中尚无覆盖完整 12,000 枚规模的单列拨款。
