  - id: TV005
    title: 论点失效与止损触发项
    columns:
      - 触发项
      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 实弹测试失败（MACE 项目）
        - 海军 MACE 或陆军 HX3 项目中，Blackbeard 飞行测试出现任何经公开确认的失败，且失败归因于武器设计（而非靶场条件）。
        - 击穿三项牛市假设；触发生产框架重新评估；项目可能取消。
        - 立即复盘持仓；在下一轮融资定价发现前减仓或退出。
      - - DoW 框架未转成合同
        - 到 FY2027 Q2（2027 年 6 月）仍未从生产框架转成有约束力的多年采购合同。
        - 基准收入轨迹崩塌；$2.8B 估值失去支撑；降价轮情景成为最可能结果。
        - 除非有明确证据显示是合同延迟而非取消，并给出修订时间表，否则按论点失效处理。
      - - Project Ranger 建设延误
        - Project Ranger 首栋生产建筑到 2027 年 Q1 仍未投用（对比 2026 年底计划）。
        - 收入爬坡顺延；营运资本和资本开支压力上升；Series C 需要更早启动，议价位置更弱。
        - 提高监控频率；评估是否已拿到过桥融资。
      - - 联合创始人离职
        - 三位联合创始人（Hargis、Pitt、Kreitz）中有两位或以上因任何原因离职。
        - 政府关系管理、技术执行和融资能力都集中在联合创始人身上；考虑到 100 多人的团队和早期阶段，接班风险很重。
        - 需要立即询问留任计划、董事会构成和领导层替补。
      - - FY2027 MACE 预算撤销
        - 国会在 FY2027 NDAA 或拨款法案中撤销 MACE 采购资金，或 DoD 发出正式列装项目取消通知。
        - 收入拐点消失；生产合同不可能按已宣布规模转换。
        - 没有 MACE 项目，熊市情形也缺少高于 $500M–$1B 的可行底部；应全部退出持仓。
      - - Project Ranger 环境许可受阻
        - New Mexico Environment Department 或 EPA 发出停工令或同意协议，导致 Project Ranger 设施建设延误超过 90 天。
        - 制造产能延后；MACE 交付承诺受威胁；投资者信心受损。
        - 提高法律和监管监控；评估替代厂址是否可行。
    notes: 止损触发项用于基于阈值的监控；它们不构成具体价格目标或退出指令。投资者应独立设定个体持仓上限。
    claimRefs:
      - CV025
      - CV026
      - CV028
      - CV033
  - id: TV006
    title: 最终尽调请求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 量产规模下的毛利率
        - 500、1,000、5,000 枚 / 年情形下，每枚整弹（AUR）的毛利率；当前及预测的分系统 BOM。
        - 没有毛利率数据，$2.8B 估值无法做压力测试；如果 $300K/AUR 下毛利接近零，投资论点就完全押在销量和政府连续性上，而不是产品经济性。
        - 数据室：索取生产成本模型（FY2025 实际 + FY2026 估算 + 稳态预测）。负责人：CFO（Kreitz）。
      - - Series B 后烧钱速度和现金跑道
        - 截至 2026 年 Q1 的月度现金消耗；Series B 交割后的现金余额；FY2026 现金流预测。
        - 决定 $350M Series B 是否足以撑到 Project Ranger 投用和生产合同里程碑，还是收入拐点前的年中就需要过桥轮。
        - 数据室：索取 2026 年 1–4 月月度管理账和 24 个月现金流模型。负责人：CFO。
      - - Project Ranger 资本开支进度和剩余义务
        - 已投入 Project Ranger 的资本与剩余待支出；挂钩里程碑的提款计划。
        - 如果 $350M Series B 中的 $220M 全部尚未投入，运营可用资金只有约 $130M——生产合同落地前可能不够。
        - 数据室：索取 Project Ranger 建设计划、已承诺采购订单和完工资本估算。负责人：COO（Pitt）。
      - - 股权结构和优先权堆栈
        - 完全稀释股权结构，包括所有期权池、认股权证、SAFEs 和可转债；各轮清算优先权条款。
        - 在 $2.8B 名义估值下，若优先权压力很重，退出估值低于 2–3× 跳升时，普通股和期权持有人拿到的可能远低于名义估值。
        - 数据室：索取最新资本结构表、投资者权利协议和公司注册证书。负责人：总法律顾问。
      - - 完整飞行测试记录
        - 完整 Blackbeard 测试活动结果，包括任何未达成飞行目标的测试弹；证明持续高超音速的飞行性能数据。
        - The War Zone 和陆军预算文件都指出，Blackbeard 是否达到持续 Mach 5+ 仍不确定；未经确认的测试失败可能推翻 MACE 项目预算科目和 DoW 框架。
        - 向海军和陆军项目办公室索取涉密和非涉密测试报告；或索取 Castelion 内部测试摘要及飞行测试数据。负责人：CEO（Hargis）和相关项目执行办公室（Program Executive Offices）。
      - - 生产合同转换时间表
        - DoW 生产框架转成有约束力的多年采购合同所需的具体合同条件、里程碑和日期。
        - 该框架不具约束力，是估值风险的最大单一来源；在以 $2.8B 投资前，必须弄清转换关口，以及是否仍有技术或政治条件未满足。
        - >-
          通过数据室索取完整 DoW 生产框架协议，包括所有先决条件。负责人：CEO（Hargis）；相关 DoD 对口方：Office of the Under Secretary of Defense for
          Acquisition。
      - - 国际销售和盟友采购潜力
        - 任何盟友政府（Australia、Japan、UK、ROK）围绕 Blackbeard 采购的沟通状态；影响国际销售的任何出口管制限制。
        - 盟友采购会在美国 DoD SAM 之外带来实质性收入倍增，并可能显著改善牛市回报轨迹。
        - 索取任何 ITAR/EAR 出口许可证申请和国际政府沟通记录。负责人：COO（Pitt）。
    notes: 截至 2026 年 5 月报告日，本清单所有事项都无法从公开来源解决；每项都需要在适当 NDA 下访问安全数据室。
