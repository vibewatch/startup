      - number: '7.5'
        title: 人员、执行与财务风险
        blocks:
          - type: paragraph
            body: >-
              Castelion 高管权力集中在三位联合创始人身上——CEO Bryon Hargis、COO Sean Pitt 和 CFO Andrew
              Kreitz——构成有意义的关键人物风险。每位创始人都带来独特且难以替代的技能：Hargis 管理政府关系管线和合同策略；Pitt 负责运营和大规模制造执行；Kreitz
              掌管资本结构、融资和财务建模。公司没有披露公开接班计划、关键人物保险或具名副手。IPO Club 的老股市场分析指出，Castelion 的投资人信心和政府可信度，很大程度绑定在这支创始团队的 SpaceX
              背景和既有 DoD 关系上。工程人才获取风险偏高：固体火箭发动机和高超音速系统工程师需要安全许可、专门材料科学经验和实操经验，而更广泛的科技人才市场很难提供这些能力。Defense tech 招聘在
              2025–2026 年激增，多家资金充足的初创公司争夺同一批持证工程人才。财务侧，Castelion 未披露收入运行率、毛利率、烧钱速度或运营现金跑道。公司处在生产收入前阶段，资金来自合同里程碑付款，以及自
              2022 年以来筹集的 $464 million 股权和债务。$30 million SVB 风险债务批次带有标准契约条款风险，可能需要再融资。Anduril Industries（May 2026 以 $61
              billion 估值筹集 $5 billion）以及传统主承包商在相邻可负担弹药项目上的竞争，增加了资源和人才压力。DoD 的 LCCM 项目在 May 2026 与 Anduril、Leidos
              等签署框架协议，显示可负担弹药竞争正在升温。
