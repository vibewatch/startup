        - SEC 或新闻公告；投资者更新；LinkedIn 变动
        - 任何共同创始人（Hargis、Pitt 或 Kreitz）离职
        - 立即重评；30 天内向董事会询问继任计划
      - - 现金续航耗尽
        - 合同里程碑时间 vs. 披露现金消耗
        - 在未签署有约束力生产合同的情况下，现金续航降至 12 个月以下
        - 要求更新融资计划；视为重大负面信号
    notes: 触发阈值为作者基于公开项目和融资数据估计；实际管理层仪表盘和财务披露会让这些阈值更精确。除创始人离职（需要投资者更新权限）和现金续航（需要管理层披露）外，所有触发项都可通过公开来源监控。
