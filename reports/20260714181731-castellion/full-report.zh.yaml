      - number: '4.5'
        title: 展项
        blocks:
          - type: callout
            title: 美国防务科技初创公司获得的最大高超音速生产框架
            body: >-
              May 2026 Department of War 生产框架要求每年至少生产 500 枚 Blackbeard 导弹，并给出五年 12,000+
              枚、合计潜在价值达数十亿美元的选项；这是低成本高超音速武器首个同类生产导向协议。叠加截至 April 2026 已执行的 $155M+ 海军合同，以及 FY2026 分配给 MACE 和 Blackbeard
              项目的约 $379M 联邦资金，截至 May 2026 本报告日期，这是任何非传统高超音速进入者获得的最强可见政府需求信号。
            calloutType: strength
            claimRefs:
              - CI007
              - CI008
              - CI025
          - type: callout
            title: 单一客户集中——美国 DoD 是唯一收入来源
            body: >-
              Castelion
              没有商业收入，也没有披露盟国销售管线。每一美元收入都取决于美国政府防务采购决策。项目取消、实弹测试失败或预算重新分配，都会立刻损害收入，没有商业收入流可对冲。除非进入盟国或商业市场，否则这种结构性脆弱性无法分散；而披露的公司战略目前并不包括这些市场。
            calloutType: risk
            claimRefs:
              - CI009
              - CI028
          - type: callout
            title: 生产合同转化尚未确认；技术分类受到质疑
            body: >-
              截至 December 2025，Castelion 仍未赢得有约束力的生产合同。May 2026 DoW 框架是意向协议，不是采购订单。The War Zone 质疑 Blackbeard
              的飞行剖面是否满足高超音速的严格定义；如果技术分类被成功挑战，可能影响项目预算线、单枚采购上限，以及相对传统主承包商的竞争位置。
