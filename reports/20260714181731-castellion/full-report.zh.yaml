  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与政府合同结构
        blocks:
          - type: paragraph
            body: >-
              Castelion 是一家纯粹面向美国政府的国防承包商，没有商业收入。每一美元收入都来自 DoD 按固定总价条款授予的合同，主要通过 Small Business Innovation
              Research（SBIR）Phase III 合同工具取得；该工具允许非传统国防供应商以单一来源方式签约。公司披露的收入轨迹陡峭：2023 年 5 月首份 $5M 合同，到 2025 年 12
              月已升级为累计超过 $100M 的军事合同基础，并在 2026 年 4 月达到近 $155M 已执行海军合同价值。2026 年 2 月合同授予（N6833526F1022）总额 $49,998,005，用于海军
              Multi-mission Affordable Capacity Effector（MACE）项目下的全尺寸 Blackbeard 原型、飞行测试和早期作战能力。2026 年 4 月，同一合同执行
              $104,998,566 选择权修改，用于最终集成、Indo-Pacific Command 区域实弹测试和早期作战能力要求。第三方收入聚合器估算，Castelion 截至 2025 年 9 月年收入约为
              $51.5M，与原型收入快速放大的曲线一致。2026 年 5 月战争部生产框架——在测试和验证完成后保证每年至少 500 枚 Blackbeard 导弹，并可在五年内购买超过 12,000
              枚——代表收入模型从开发转向生产合同的第一个事件。该框架尚未转化为有约束力的多年期采购合同；转化取决于完成正在进行的测试和集成日程。
