      - number: '4.2'
        title: 单位经济性与成本架构
        blocks:
          - type: paragraph
            body: >-
              Castelion 的商业逻辑压在一个声称上：与能力相当的传统高超音速武器相比，成本可降 10x。美国陆军 PrSM Increment 1 单枚约 $1.6M，配备双模导引头的 Increment 2 约
              $5.35M。美国海军 MACE 项目把 All Up Round 的目标单位成本设在低于 $300,000，前提是年产至少 500 枚 AUR；如果做到，Blackbeard
              将成为美国库存里迄今最便宜的远程高超音速打击武器。早期 FY2027 海军采购规划为 353 枚导弹拨出 $156M，折合初始批次单枚约 $442K；这只是起点，之后学习曲线改善会把成本推向 $300K
              目标。这套成本结构靠两件事支撑：固体火箭发动机、控制作动系统、导引头、飞控计算机和热防护系统垂直整合；金属壳体和橡胶部件改用商业汽车供应商，而不是承受防务行业一贯的溢价。第三方数据估计，每名员工收入约
              $515K，对资本密集型硬件制造商来说偏高，但这更多反映早期合同结构，并不是成熟毛利信号。毛利率、运营费用，以及量产后的实际单位经济性仍完全没有披露。市场上没有一手财务报表；收入只来自政府，也没有公开可比的私人防务初创公司利润率基准。The
              War Zone 报道称，Blackbeard 的飞行剖面是否满足高超音速的严格定义仍有不确定性；这会影响成本对标，因为“高超音速”标签决定项目预算线和单枚采购上限。
