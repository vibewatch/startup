      - number: '3.5'
        title: 护城河、切换成本与差异化耐久性
        blocks:
          - type: paragraph
            body: >
              Castelion 的护城河建立在四个互相强化的机制上：垂直一体化、平台集成切换成本、生产规模投资，以及通过多年期框架协议形成的早期采购锁定。


              推进（固体火箭发动机）、航电、热防护和制导系统的垂直一体化——在 Castelion 位于新墨西哥州 Sandoval County、占地 1,000 英亩、包含 21 栋建筑的固体火箭发动机园区 Project
              Ranger 中完成——让 Castelion 无需依赖传统一级供应商，就能控制成本、交付周期和质量。该设施预计到 2026 年底投运，并创造约 300
              个长期岗位。这是一项资本密集基础设施投资，竞争者很难快速复制。


              平台集成会不断放大切换成本。把一种武器集成并认证到军事平台上（Castelion 案例中是 F/A-18），需要数千小时工程工作、资质测试、布线改动、软件更新和飞行员训练。一旦海军在 Super Hornet
              上认证 Blackbeard，要把竞争武器重新认证到同一平台，就需要等量投入——从而形成有利于先发者的制度惯性。陆军 Blackbeard GL 项目（从 HIMARS 陆基发射）创造第二条平台集成路径，使
              Castelion 的切换成本足迹翻倍。


              DoD 转向固定价格、确定数量的框架协议（相对于传统成本加成），从结构上利好那些能在规模下承诺单位成本确定性的供应商。Castelion 已签署这类框架；DoD 正积极寻求五年 12,000 多枚
              Blackbeard 的授权和拨款。该信号对资本市场可见（支撑 Altimeter 和 Lightspeed 领投的 $350M Series B），也给 Castelion 的设施投资提供了清晰需求托底。


              耐久性风险包括：（1）ARRW 复活——Lockheed 保留制度关系，可能交付成本更低的 ARRW Increment 2 型号；（2）Raytheon HACM 若在 2027 年实现 IOC，会为 Air
              Force 创造一个竞争性空射高超音速选项，并可能影响 Navy Air Force 协调；（3）新进入者——Anduril 公开表达的高超音速野心，以及其在国防科技领域上升的制度地位，可能在 2028–2030
              年窗口产生竞争武器；（4）DoD 买方垄断风险——如果国会削减高超音速预算或重定向资金，Castelion 的 12,000 枚需求信号可能减弱。
