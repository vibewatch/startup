        - DO-178C（或 MIL 同等级）软件认证未确认；GNC 模型保真度缺口未披露
      - - 热防护系统（TPS）
        - 保护鼻锥尖免受 2,400°C 以上气动热载荷；防止烧蚀导致制导漂移
        - 内部制造硅化碳-碳材料；高压釜来自火箭喷管工装经验
        - 良率目前约 70%；Project Ranger 生产速率放量未验证；存在特种材料供应风险
      - - 飞行终止系统（FTS）
        - 飞行器偏离预定轨迹时终止飞行；HIMARS 测试的靶场安全需要该系统
        - 开发中；必须满足 DoD 靶场安全要求，才能集成 HIMARS
        - FTS 认证是 Army HIMARS 实弹测试的关键路径依赖
      - - 火控接口（开放架构）
        - 接收来自 Army AFATDS、Marine MAGTF AFATDS 和 Joint Fires Network 的数字火力呼叫
        - 开放接口按兼容性设计；据称已通过 Joint Fires Network 台架测试（基础 CFF 脚本）
        - 任何实弹环境下的端到端集成和作战适用性测试均未确认
      - - 制造执行系统（MES）
        - 跟踪从子装配到最终集成的生产流、工艺路线和库存
        - NetSuite 库存管理；Manufacturo MES（或同类系统）；来自招聘信息
        - MES 支撑 Project Ranger 产量规模的成熟度未验证；存在 ERP/MES 集成风险
    notes: >-
      架构条目来自公司公开材料、政府预算文件和 Castelion 招聘岗位，并把招聘岗位作为开发信号代理指标。 关键组件（推进剂、EO 探测器、FPGA 变体）的具体供应商名称未公开披露。所有架构元素截至 2026 年 5 月
      都处于 EOC 前原型阶段。
