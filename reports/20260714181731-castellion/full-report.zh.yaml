  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与军种拆分
        blocks:
          - type: paragraph
            body: >-
              Castelion 是只服务美国政府的防务承包商；截至本报告日期，每一美元收入都来自 DoD 合同，没有商业、盟国或民用客户。因此，公司的客户基础是单一买方市场：美国 Department of War（原
              Department of Defense）是唯一付款方，美国海军、美国陆军和美国空军则是执行采购方和作战用户。海军是主要生产客户，已基于 Naval Air Warfare Center Aircraft
              Division（New Jersey 州 Lakehurst）管理的单一 Basic Ordering Agreement（N6833526G0006）签下 $154.9M 固定总价合同。陆军是次级客户，通过
              HX3/Blackbeard GL 项目获得 $25M FY2026 预算拨款。空军是早期客户，2023 年通过 SBIR Phase II 合同（$1.77M，FA2385-23-C-B007）在
              AF231-D026 课题下为 Blackbeard 项目打底。Series A 公告（January 2025）确认公司有“由 US Navy、US Air Force 和 US Army
              资助的活跃合同”，说明在 Navy 主导地位成形前，三军已经参与。地域上，所有工作都在美国本土完成（主要在 Torrance, California），实弹测试在 Mojave 和 Dugway Proving
              Ground 等政府靶场进行。截至 May 2026，尚无公开确认的外国军售或盟国采购；但 Blackbeard 设计瞄准 HIMARS 兼容性，而 HIMARS 是许多美国盟国使用的平台，暗示未来可能具备
              FMS 资格。客户集中度在这一阶段极高且有意为之：公司整体战略把 DoD 高超音速市场作为可服务收入基础。
