  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 阶段 / 描述
      - 收入 / 指标
      - 估值 / EV
      - 收入倍数
      - 对 Castelion 的可比意义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Defense tech private and public comparables identified in May 2026 sources with known revenue and valuation;
        excludes undisclosed private rounds and non-hypersonic defense startups.
    rows:
      - - Anduril Industries
        - 后期私营（2026 年 5 月 Series H 轮）；多域自主国防平台
        - 2025 年滚动收入 $2.2B；同比增长约 110%
        - $61B（Series H 轮）
        - ~27.7×
        - 最强的私营可比对象：创始人与 SpaceX 有关联，由硅谷 VC 共同领投（a16z），合同规模迅速放大；对 Castelion 的投资者画像来说，这是最接近的估值基准。
        - Anduril 有软件平台杠杆（Lattice）、多条产品线和 $20B 陆军企业合同——收入基数显著大于现阶段 Castelion，护城河也更宽。
      - - Shield AI
        - 后期私营（2026 年 3 月 Series G 轮）；面向军用飞机和无人机的 AI 自主系统
        - 2026 年预计收入 $540M+；同比增长 80%+
        - $12.7B（Series G 轮）
        - 预计约 23.5×
        - VC 投资者画像可比（Advent、JPMorgan）；近期融资体现类似的国防科技溢价，也说明投资者愿意以显著倍数押注硬件导向的国防公司。
        - Shield AI 的收入基数约为 Castelion 当前估算的 10 倍，客户覆盖多个平台，还有软件护城河（Hivemind AI 飞行员）；它不是单一武器制造商。
      - - Hermeus
        - 早期增长（2026 年 4 月 Series C 轮）；高超音速飞机初创公司，尚未进入量产收入
        - 量产前；$350M Series C 轮；2026 年 3 月首次试飞
        - $1B（Series C 轮）
        - N/A（收入前）
        - >-
          最直接的技术类比：高超音速飞行，SpaceX / 国防科技投资者基础（Khosla、Founders Fund、RTX Ventures），量产前阶段。Hermeus 估值 $1B
          说明高超音速原型有溢价；Castelion 比 Hermeus 高 3× 的溢价，反映的是其政府合同管线。
        - 终端产品不同（可重复使用飞机 vs. 一次性导弹）；Hermeus 没有生产合同；估值不是按收入定价。
      - - Kratos Defense & Security Solutions (KTOS) 可比公司
        - 上市中型防务公司；无人系统、火箭推进、高超音速子系统；硬件制造画像可比
        - FY2025 收入 $1.347B；有机增长 16.6%；FY2026 指引 $1.595–1.675B
        - 约 $12.6B EV（2026）
        - ~9.4×
        - 规模路径上最好的上市可比对象：同样是按政府方向放大硬件制造的非传统国防承包商；9–12× EV / 收入为 Castelion 上市后、产能爬坡后的交易倍数提供上限。
        - Kratos 已经盈利（FY2025 调整后 EBITDA $119.9M），有多条产品线和已完全投产的制造基地。Castelion 目前都没有；Kratos 倍数可能高估现阶段 Castelion 的公开市场价值。
      - - Lockheed Martin (LMT)
        - 上市国防主承包商；高超音速武器既有厂商（ARRW、CPS、LRHW 项目）
        - 年收入 $75–77B；市值约 $75B
        - $137–141B EV（2026）
        - ~1.8×
        - 下限可比对象：说明 Castelion 如果最终成为成熟、盈利且规模化的国防制造商，会按什么水平交易；现阶段不适用。
        - 成熟业务，增长稳定，政府关系积累数十年；ARRW 重启（FY2026 $387M）让 LMT 成为直接竞争威胁，而不只是可比对象。
      - - Raytheon Technologies (RTX)
        - 上市国防主承包商；HACM 高超音速巡航导弹开发方；Pratt & Whitney 航空发动机
        - 年收入指引 $86.5–87B（2025）
        - 约 $261B EV（2026）
        - ~3.0×
        - 大型国防主承包商的下限可比；HACM 项目是直接竞争的高超音速项目。
        - 集团业务包含民用航空；不是纯国防科技初创公司的可比对象；HACM 延误说明既有厂商也有执行风险，而 Castelion 尚未进入这一阶段。
      - - Northrop Grumman (NOC)
        - 上市国防主承包商；Conventional Prompt Strike（CPS / Dark Eagle）项目；B-21 轰炸机
        - 年收入约 $42B（2025）
        - 约 $96B EV（2026）
        - ~2.3×
        - 下限可比；CPS / Dark Eagle 单价 $41M，是 Castelion 试图压低成本的战略替代方案。
        - CPS / Dark Eagle 是独立的战略射程项目，不是战术打击替代品；Northrop 的倍数不适用于早期生产公司。
    notes: 私营公司的收入倍数基于新闻和分析师来源披露或预测的数字；私营估值数据不包含优先权压力或稀释后股本结构细节。上市公司倍数为截至 2026 年 5 月的企业价值 / 过去或远期收入。
