  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Castelion 在三个不同竞争层面上竞争：（1）既有主承包商的高超音速项目（Lockheed Martin ARRW、Raytheon HACM、Northrop Grumman 参与的
              Conventional Prompt Strike/Dark Eagle）；（2）在 Pentagon Low-Cost Containerized
              Missile（LCCM）项目下运作的新进入巡航导弹公司（Anduril、Leidos、CoAspire、Zone 5 Technologies）；（3）现状替代品——JASSM-ER、Tomahawk
              等常规防区外弹药，仍属亚音速但已经大规模列装。


              没有任何在位者处在 Castelion 的具体生态位：一种从第一天起就为高速率生产设计、可负担、空射、Mach 5+ 的战术高超音速导弹。Lockheed 的 ARRW 达到高超音速，但单位成本
              $15–18M，在 FY2026 预算以 $387M 复活前已经被取消。Raytheon 的 HACM 是处于原型阶段的吸气式超燃冲压巡航导弹，首次飞行测试推迟到 FY2026，IOC 目标 2027
              年，单位成本未披露但为数百万美元级。Northrop/Lockheed Conventional Prompt Strike（CPS）和陆军 Long-Range Hypersonic
              Weapon（LRHW/Dark Eagle）是舰射和陆基发射滑翔体系统，瞄准战略远程打击，不是 Blackbeard 瞄准的空射战术架次。Castelion 与 LCCM 相邻的框架协议——DoD
              寻求在两年采购交易中每年至少采购 500 枚 Blackbeard，并积极寻求五年 12,000 多枚导弹授权——截至 2026 年 5 月在同业中没有直接可比案例。


              舰载航空打击的现状替代品是 AGM-154 JSOW 或 AGM-158 JASSM-ER（亚音速，约
              ~$1.4M/枚），缺少高超音速速度，也难以在现代一体化防空系统面前保持生存力。通过国家实验室（Sandia、DARPA 项目）和 Dynetics（C-HGB 设计方）进行内部 DoD
              建设，是一条非商业平行路线，但不是 Castelion 的商业竞争者。
