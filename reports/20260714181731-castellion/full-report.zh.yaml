          - type: callout
            title: 观察——三项条件可上调至买入
            body: >-
              “观察”建议体现了我们对团队、市场和政府背书的高确信度，但偏高的入场倍数和重大未解决风险抵消了这部分优势。至少确认以下一项后，建议才会上调至买入：（1）DoW
              生产框架转成带承诺资金的绑定多年期购买合同，（2）生产规模下毛利率披露并确认达到 20% 或以上，或（3）后续融资轮或二级市场交易中，入场估值回落至低于 35×
              过去十二个月收入。能够进入数据室且可同时确认有利毛利率和生产合同转化的投资者，今天作出买入决定的依据会明显更强。
            calloutType: recommendation
            claimRefs:
              - CV034
              - CV035
              - CV036
          - type: callout
            title: 防务科技倍数膨胀带来全行业压缩风险
            body: >-
              2025–2026 防务科技 VC 周期推高了整个板块的倍数：2025 年投入 $29B，接近 2020 年的三倍，推动 Anduril 在十二个月内从 $14B 升至 $61B，Shield AI 同期从
              $5.3B 升至 $12.7B。Castelion 的 54× 倍数正是这个环境的产物。如果采购改革停滞、防务预算增速放慢，或头部防务创业公司之一错过收入里程碑，全行业倍数压缩会影响包括 Castelion
              在内的所有私营持仓。PwC 和 S&P Global 都把它列为这一队列的结构性风险：随着生产阶段公司成熟、公开市场投资者施加 EBITDA 纪律，防务科技倍数会向 Kratos 式水平压缩。
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV044
