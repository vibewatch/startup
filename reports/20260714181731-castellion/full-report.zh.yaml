        - 社区反对和未批许可可能拖慢 Project Ranger 投产
      - - 适航认证（F/A-18）
        - 推进中；2026 年 4 月合同明确资助“系统安全评估和飞行试验”
        - 所有海军空射武器从航母甲板部署前都必须完成
        - 截至 2026 年 5 月，尚未完成航母场景实弹测试
      - - MIL-SPEC / 生产资质认证
        - 未确认；项目仍处在原型（量产前）阶段
