      - number: '7.2'
        title: 监管、法律与环境风险
        blocks:
          - type: paragraph
            body: >-
              Project Ranger 是 Castelion 位于 New Mexico 州 Sandoval County 的 1,000
              英亩固体火箭发动机生产设施，构成近期最复杂的风险簇。该设施将使用高氯酸铵（AP）、铝粉和含能添加剂来制造和测试固体火箭发动机；这些物质在美国可比防务场址留下过记录充分的地下水污染历史。West Mesa 地下的
              Santa Fe Group aquifer 向 Albuquerque Basin 约 100 万人供应饮用水；一旦被 AP 污染，修复成本高到难以承受，实际也可能无法完成，Maryland 州 Naval
              Surface Warfare Center Indian Head 长达数十年的污染事件就是例证。社区倡议组织 Common Ground Rising 已向 New Mexico Department of
              Justice 和 GAO 投诉，指称 Sandoval County 在没有依法举行公开听证、也没有充分环境审查的情况下批准 Project Ranger LEDA 补贴。截至 December 2025，与
              Sandia National Laboratories 合作的环境污染羽流研究仍未完成。取消危险建筑内部喷淋和消火栓的消防规范豁免，也招致额外审查。Castelion 对所有 Blackbeard 技术数据承担
              ITAR 合规义务；FY2026 NDAA 和 Outbound Investment Security Program 还明确把高超音速系统列为 CFIUS
              审查下的敏感技术类别，给每一轮未来融资增加投资人尽调要求。截至本报告日期，公开记录尚未确认有针对 Castelion 的诉讼，但 NM DOJ 投诉为施工禁令或许可撤销打开路径，可能实质性推迟 Project
              Ranger 的 2026 目标运营时间线。
