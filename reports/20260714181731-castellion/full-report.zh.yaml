  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Castelion 位于高超音速武器开发和大批量国防制造的交叉点。相关市场定义为速度达到或超过 Mach 5
              的武器——主要包括空射和陆基发射高超音速滑翔飞行器、高超音速巡航导弹，以及助推-滑翔系统。该定义排除了常规亚音速巡航导弹（如 Tomahawk）、战术弹道导弹，以及 Standard Missile
              系列等超音速但未达高超音速的弹药。

              在高超音速赛道内，Castelion 瞄准一个新子类：为工业级产量而非精品式小批量生产设计的可负担、大批量高超音速打击武器。Blackbeard 导弹处在轻型 / 紧凑型空射高超音速类别——不同于海军
              Conventional Prompt Strike 或陆军 LRHW 这类更重系统，它的特点是目标单位成本低于 $400K，且兼容多个平台。美国海军库存中的现状替代品是 AGM-158C LRASM（Long
              Range Anti-Ship Missile），单位成本约 $3M；已取消的 HALO/OASuW Increment 2 项目留下采购真空，Blackbeard 正是在填补这一位置。对美国陆军而言，在位产品是
              Precision Strike Missile（PrSM），其 Increment 4 型号瞄准类似能力，但成本显著更高。

              相邻领域包括：反高超音速防御系统（完全独立的市场）、超燃冲压推进开发、高超音速测试基础设施，以及下游平台集成服务。Castelion 目前无法服务这些相邻市场，但随着公司推进 IP 成熟，它们可能成为未来扩张面。
