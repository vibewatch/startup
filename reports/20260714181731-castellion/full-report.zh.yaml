      - number: '3.2'
        title: 在位高超音速项目
        blocks:
          - type: paragraph
            body: >
              Lockheed Martin 领导 ARRW（AGM-183A）Air-launched Rapid Response Weapon，这是一种由 B-52/B-1B 携带的高超音速滑翔飞行器。该项目在 2021
              至 2023 年间至少三次飞行测试失败，导致空军取消。FY2026 国防预算以 $387M 复活该项目，并规划到 2030 年投入 $1.7B。单位成本估算为 $15–18M（Congressional
              Budget Office 对 100–300 枚产量的分析），比 Castelion 的 Blackbeard 目标价格高出 40 多倍。USAF 目前计划集成 B-52，并可能集成
              F-15E。Lockheed 还与 Northrop Grumman 一起，在海军 Conventional Prompt Strike（CPS）和陆军 LRHW（Dark
              Eagle）项目中担任主承包角色；陆军在 2026 年 4 月授予 $2.7B CPS/LRHW 合同。CPS 是舰射滑翔体系统，目前部署在 Zumwalt 级驱逐舰上，单位成本约 ~$41M。


              Raytheon Technologies（RTX）领导 Hypersonic Attack Cruise Missile（HACM），这是美国开发管线中唯一的吸气式超燃冲压高超音速导弹。HACM 设计用于
              F-15E（以及后续 F/A-18）挂载，并在 2022–2023 年获得约 $1.4B 开发合同。由于设计延误，空军经 GAO 审查的日程把首次飞行测试从 FY2025 推迟到 FY2026。FY2027
              预算申请 $404M 生产资金，IOC 目标 2027 年。总采购计划超过 $3B。Northrop Grumman 提供助推器、超燃冲压设施投资，以及另行授予的 Glide Phase
              Interceptor（GPI）高超音速防御项目（2026 年 5 月 $475M 合同修改），另有用于高超音速遥测的 RangeHawk 无人机合同。


              三家在位者都在成本加成合同模式下运作，采办时间线以多年计，组织结构并不适合 Castelion 瞄准的每年数千枚产量。它们的制度优势包括数十年的 DoD
              关系、涉密项目准入和庞大工程队伍，但成本结构和官僚化采办周期正是 Castelion 模式要绕开的对象。
