      - number: '1.5'
        title: 风险、负面信号与证据缺口
        blocks:
          - type: paragraph
            body: >-
              Castelion 面临多项重大风险，横跨社区反对、监管暴露、业务集中度和规模化执行。Project Ranger 制造园区已经引发 Rio Rancho 和 Sandoval County
              非建制地区居民的显著反对；居民担心静态火箭发动机点火测试噪声、高氯酸铵氧化剂和铝推进剂粉末造成环境污染、地下水和 arroyo 径流影响、部落协商义务，以及火灾和事故响应能力。2025 年 12 月 9
              日举行的社区会议吸引数十名居民，他们就安全和环境协议向 Castelion CFO Andrew Kreitz 施压；Sandoval County 已批准该项目 $125M 工业收入债。Rio Rancho
              消防局长 James Wenzel 另行提出担忧，认为该设施的高危等级会影响市政消防资源。与 Sandia National Laboratories 合作的环境羽流研究在 2025 年 12
              月社区会议时仍在进行。从商业角度看，Castelion 是单一客户公司：美国联邦政府是唯一收入来源，且截至 2025 年 12
              月尚未取得生产合同，仍处示范阶段。公司还没有生产过数千枚导弹，必须从原型转向生产；这在历史上往往成本高、周期长。收入、烧钱速度和毛利率未公开披露。三位联合创始人形成中等程度关键人集中。董事会结构和主要投资者的治理权利不公开。国防采办项目经常出现延期、范围变化和预算削减，可能实质影响
              Castelion 的合同管线。
