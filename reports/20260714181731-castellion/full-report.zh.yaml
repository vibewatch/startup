  - id: FI002
    title: 单位经济模型桥接——Blackbeard 成本架构
    type: flow
    layout: wide
    summary: Castelion 的单位成本逻辑，是靠垂直整合、商业供应链和 Project Ranger 的大批量制造，把每枚 AUR 成本从传统高超音速水平（约 $5M+）压到 $300K 以下。毛利率层面仍未公开。
    data:
      nodes:
        - id: legacy-cost
          label: 传统高超音速基准
          detail: 传统高超音速武器每枚成本数百万美元（PrSM Inc 2：每枚导弹约 $5.35M；HACM 开发成本约 $2B，对应约 13 件测试样机）。
          tone: negative
        - id: design-choice
          label: 面向可制造性的设计
          detail: Castelion 避开「精致设计」，并把固体火箭发动机、导引头、控制作动和飞行计算机垂直整合，压缩成本和周期。
          tone: positive
        - id: commercial-supply
          label: 非传统商业供应链
          detail: 金属壳体和橡胶部件来自汽车行业供应商，而不是国防专用供应商，从而降低材料成本和交期。
          tone: positive
        - id: high-cadence
          label: 高频测试迭代
          detail: 2025 年完成 25+ 次飞行测试，间隔很短；测试—学习—修复循环压缩开发时间，也降低每轮迭代的重新设计成本。
          tone: positive
        - id: target-cost
          label: 目标单件成本：<$300K
          detail: 海军 MACE 项目的目标，对应 ≥500 枚 AUR/年的生产节奏。FY2027 首批量产估计为 $442K/AUR；规模化后预期降向 $300K。
          tone: neutral
        - id: margin-gap
          label: 毛利率缺口（私有）
          detail: 每枚 AUR 在直接制造成本之上的贡献额未披露。$300K–$442K 的价格区间能否撑起可行毛利率，完全取决于实际生产成本；评估需要数据室。
          tone: negative
    approximationNotes: 所有成本数字要么是项目目标，要么是从 DoD 预算文件推导出的早期批次估计。实际制造成本、材料拆分和毛利率均未公开。传统成本基准（PrSM 定价）来自公开的陆军预算申报。
