  - id: FI001
    title: 收入模型桥接——从政府合同活动到收入
    type: flow
    layout: wide
    summary: Castelion 只靠美国政府国防合同变现。流程图说明不同合同活动如何转成确认收入：从 R&D 奖项推进到量产收入，但量产收入取决于测试验证和 EOC 声明。
