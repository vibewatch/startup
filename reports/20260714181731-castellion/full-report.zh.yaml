      nodes:
        - id: sbir-rnd
          label: SBIR R&D 和原型奖项
          detail: 入口收入：SBIR Phase III 下的固定总价奖项，用于武器开发、子系统测试和原型制造。首份合同在 2023 年 5 月；截至 2025 年 12 月，累计基础金额 >$100M。
          tone: positive
        - id: integration
          label: 平台集成合同
          detail: 中期收入：在 F/A-18 Super Hornet 和 HIMARS 平台上集成并实弹测试。$49.9M + $105M 的海军合同（2026 年 2–4 月）是当前主要收入事件。
          tone: positive
        - id: framework
          label: DoW 量产框架（2026 年 5 月）
          detail: 量产前需求信号：DoW 针对每年 500+ 枚 Blackbeard 导弹的框架；尚不是有约束力的合同。只有在 EOC 声明后才转成量产收入，预计为 FY2027。
          tone: neutral
        - id: production
          label: 量产合同收入（未来）
          detail: 目标收入状态：针对 FY2027 初始 353+ 枚导弹的固定总价量产合同，并随 Project Ranger 扩至每年数千枚。前提是测试和 EOC 里程碑兑现。
          tone: neutral
        - id: gross-margin
          label: 毛利率（私有）
          detail: 每个合同阶段的毛利率完全未披露。硬件国防合同通常有 10–30% 毛利率；实际数据需要数据室。
          tone: negative
        - id: scale
          label: 后续系统收入（未来）
          detail: Series B 材料披露了第二条高超音速产品线；没有公开合同数据、定价或开发时间表。
          tone: neutral
