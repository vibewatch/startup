      - number: '7.4'
        title: 伙伴、供应链与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Castelion 供应链存在一个结构性单点故障：American Pacific Corporation（AMPAC）是美国本土唯一大规模航空航天级高氯酸铵供应商。截至 May 2026，美国没有第二家规模化
              AP 供应商。多个导弹项目同时拉动需求——HIMARS 补库、THAAD、Tomahawk、PAC-3 以及新的 DoW Arsenal of Freedom 倡议——已经让 AP 供应吃紧。Department
              of War 在 January 2026 通过向 L3Harris Missile Solutions（原 Aerojet Rocketdyne）直接股权投资 $1 billion
              来扩大固体火箭发动机产能，承认了这一脆弱点；但这笔投资解决的是 SRM 装配产能，而不是上游 AP 瓶颈本身。Castelion 垂直整合的 Project Ranger 旨在降低外部 SRM 采购依赖，但 AP
              原料仍依赖 AMPAC。客户侧，Castelion 收入近 100% 集中在美国政府合同，没有披露商业或盟国多元化。公司与 Department of War 的条件性生产框架协议，需要 Congress
              另行拨款后才能下达生产订单；预算封存、CR 临时拨款决议或 DoW 优先级转移，都可能延后或削减订单量。DoD 飞行测试靶场也是一项排期依赖，因为靶场可用性会推迟里程碑达成和合同转化时间线。
