      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >-
              Castelion 由三名前 SpaceX 员工共同创立，三人的能力拼图互补。CEO 兼联合创始人 Bryon Hargis 曾任 SpaceX
              政府销售总监，负责国家安全卫星项目，并搭建了数十亿美元规模的国防管线。他拥有 Johns Hopkins University 应用物理硕士学位和 Georgia Tech 机械工程学士学位。COO 兼联合创始人
              Sean Pitt 曾负责 SpaceX 欧洲商业发射和载人航天销售，完成超过 $1.25B 出口交易，熟悉复杂的国际国防销售与运营。CFO 兼联合创始人 Andrew Kreitz 曾在 SpaceX
              负责发射预测和政府成本方案，此前是 Goldman Sachs 副总裁，专注航空航天与国防并购，让公司同时具备少见的财务纪律和国防项目经验。三人均在 2022 年 11 月离开 SpaceX，共同创立
              Castelion。领导团队此后吸收了来自 SpaceX Falcon 9 和 Dragon capsule 项目的工程师和运营人才，也包括 Lockheed Martin、Raytheon
              等传统承包商的老兵。公司董事会结构没有公开披露。Castelion 的投资方——包括 Altimeter Capital、Lightspeed Venture Partners 和 Andreessen
              Horowitz——可能按其投资位置持有董事会观察员或董事席位，但公开来源尚未证实。考虑到创始团队在政府关系管理中的核心地位，以及公司运营成熟度仍处早期，关键人依赖偏高。
