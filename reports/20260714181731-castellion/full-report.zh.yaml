      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              Castelion 的三条情景路径取决于两个二元结果：（1）May 2026 DoW 生产框架能否在 FY2027 初前转成绑定多年期采购合同；（2）Project Ranger 能否按已宣布的 2026
              时间表达到额定产能。乐观情景下，两项条件都兑现，FY2027 MACE 采购批次（353 枚导弹，$156 million）之后立即扩产，DoW 框架行使完整选择权，五年采购 12,000+ 枚导弹，单价
              $350–$442K。在这样的产能下，到 2029 年收入可能达到 $1.5–2.5 billion，IPO 或战略退出可按 10–15× 前瞻收入定价，对应 $15–37 billion 区间——相对 $2.8
              billion Series B 价格实现 5× 到 13× 回报。基准情景下，生产框架转化，但爬坡慢于计划：到 2027 年每年 500–1,000 枚，到 2029–2030 年每年 1,500–2,500
              枚。收入达到 $250–700 million，仍需以 $5–8 billion 估值融资 Series C 来完成 Project Ranger，公开退出前产生 15–25% 稀释。该情景下从 Series B
              价格出发的回报有限：五到七年 1.5–2.5×，符合中档防务科技结果。悲观情景下，测试失败、项目延迟或预算重新分配阻碍框架按时转化。生产收入推迟到 FY2028–2029，Series B 价格相对低于 $100
              million 的收入基数显得昂贵，$1.5–2.0 billion 的降价轮变得可能。基于当前证据，基准情景是众数结果；DoW 框架和 April 2026 MACE
              集成合同确认了政府意图，乐观情景概率在上升，但工厂投产和实弹测试带来的执行风险仍然重要。
