      - number: '3.3'
        title: 新进入者与相邻竞争者
        blocks:
          - type: paragraph
            body: >
              Pentagon 2026 年 5 月的 Low-Cost Containerized Missile（LCCM）项目，创造了一个新的巡航导弹创业公司竞争群：Anduril、Leidos、CoAspire 和
              Zone 5 Technologies。这些公司目标是在三年内交付至少 10,000 枚廉价亚音速巡航导弹。它们不是 Castelion
              的直接高超音速竞争者；武器速度为亚音速或低超音速，设计目的在于以可消耗成本进行饱和打击，而非靠到达速度和穿透现代防空系统取胜。不过，它们会争夺 DoD 预算、项目办公室注意力和工业基础产能。


              Anduril 的 Barracuda-500M 是为 LCCM 项目设计的地面发射巡航导弹，Anduril 计划把产量扩大到每年 1,000 枚，并在 2027 年初交付首批。Anduril
              已披露把技术延伸到高超音速飞行包线的意图，并截至 2026 年发布了相关 R&D 职位，但尚无确认的高超音速武器项目。Leidos 正在扩大其 Black Arrow（AGM-190A）LCCM 型号产量，承诺
              3,000 枚。CoAspire 提供其 GHOST 巡航导弹（RAACM-ER 型号）。Zone 5 Technologies 也参与其中，但尚未公开披露其 LCCM 武器。


              Castelion 自身也出现在 DoD 更广义的 LCCM 相邻公告中：国防部正寻求授权和拨款，在五年内根据独立框架协议购买 12,000 多枚 Blackbeard 高超音速导弹。DoD
              明确表示，Castelion 项目与 LCCM 参与方属于不同类别（高超音速 vs. 巡航）。Hermeus 和 Stratolaunch
              代表高超音速试验台和可重复使用飞行器项目，不是进攻性打击武器；它们是高超音速技术生态供应商，而非竞争者。Kratos Defense 获得过高超音速子系统合同，但截至 2026 年 5
              月尚未列装竞争性高超音速打击武器。
