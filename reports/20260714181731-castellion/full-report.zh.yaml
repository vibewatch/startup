  - id: FE001
    title: Blackbeard 武器系统架构——技术栈
    type: stack
    layout: wide
    summary: Castelion 垂直整合 Blackbeard 武器系统的六个核心子系统。技术栈从物理推进到任务软件逐层映射，说明每层的内部设计 / 制造角色，以及对应的关键依赖或风险。
    data:
      layers:
        - id: propulsion
          label: 固体火箭发动机推进
          sublabel: 2-stage (GL); ammonium perchlorate / aluminum powder; manufactured in-house in Torrance and Project Ranger
          role: Boosts weapon to Mach 5+ and sustains hypersonic flight; eliminates propulsion supply-chain markup
          status: validated
          detail: 内部设计和制造；已试车 20+ 台发动机；Project Ranger 将扩至每年数千台 SRM；TPS 鼻锥良率约 70%；批量生产目标约 90%。
          dependency: Ammonium perchlorate (commercial chemical); Project Ranger commissioning for volume
          risk: Environmental permitting at Project Ranger; perchlorate yield scale-up
        - id: thermal-protection
          label: 热防护系统（TPS）
          sublabel: Siliconized carbon-carbon nose tip; >2,400°C tolerance; autoclave-cured in-house
          role: Protects guidance hardware from aerothermal loads during hypersonic flight; prevents ablation wander
          status: in-development
          detail: 在由火箭喷管工装改造的小型高压釜中固化；良率约 70%（行业来源）；批量生产前目标 >90%；Castelion 正部署额外铺层管以提高良率。
          dependency: Specialty carbon-carbon precursor materials; autoclave capacity at Project Ranger
          risk: Yield gap is single largest manufacturing scale-up risk
        - id: cas
          label: 控制作动系统（CAS）
          sublabel: In-house design; controls aerodynamic surfaces during boost and glide
          role: Provides precise attitude control throughout flight; interfaces with GNC for steering commands
          status: validated
          detail: 已在 25+ 次飞行测试中验证；具体作动器供应商和交期数据未公开。
          dependency: Commercial/defense actuator motors; electronics from domestic supply chain
          risk: Supplier concentration not disclosed
        - id: seeker-gnc
          label: 多模 EO 导引头 + GNC 系统
          sublabel: Inertial + celestial mid-course; EO terminal seeker; in-flight re-targeting
          role: Navigation and terminal guidance for moving and hardened targets; ITAR Category IV
          status: validated
          detail: 中段：惯性 + 天文更新。末段：多模 EO 导引头，可在飞行中更新目标。已在飞行测试中验证移动目标跟踪。
          dependency: EO detector from defense supply chain (ITAR IV); GPS augmentation optional
          risk: ITAR IV export control limits FMS; countermeasure resistance not confirmed
        - id: fpga-avionics
          label: FPGA 航电（Vitis HLS）
          sublabel: AMD/Xilinx FPGA; Vitis HLS workflow; Allen TX engineering hub
          role: Real-time sensor fusion, actuator command, and flight-critical computation
          status: in-development
          detail: 招聘信息显示，FPGA 设计使用 Vitis High-Level Synthesis（HLS）流程。商业硅（非抗辐射加固）相对航天级部件降低成本和交期。HALT/HASS 可靠性测试正在推进。
          dependency: AMD/Xilinx FPGA supply chain; Vitis HLS software toolchain
          risk: Commercial FPGA not radiation-hardened; EMP/EMI vulnerability unassessed in public
        - id: flight-software
          label: 嵌入式飞行软件 + 任务栈
          sublabel: Real-time embedded OS; firmware to application; HIL simulation; GNC algorithms
          role: Executes navigation, GNC, health monitoring, mission management, and FTS arming/safing
          status: validated
          detail: 全套软件栈内部开发：嵌入式微控制器上的底层固件、操作系统、GNC 算法层和任务软件。已通过硬件在环仿真和 25+ 次飞行测试验证。MIL-SPEC 软件鉴定（DO-178C 或同等标准）尚未确认。
          dependency: Internal team; real-time OS vendor; test infrastructure
          risk: DO-178C qualification status unknown; cybersecurity assessment not reported
    approximationNotes: 各层细节综合自公司招聘信息（FPGA、GNC、嵌入式 SW 岗位）、公开 Series B 公告、政府合同文本和国防报道。具体组件供应商和性能参数仍为专有信息。
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE012
      - CE013
      - CE014
      - CE029
  - id: FE002
    title: 客户工作流——高超音速打击任务执行
    type: flow
    layout: wide
    summary: 该图从威胁识别到 Blackbeard 投送，映射作战工作流，说明 Castelion 武器在各阶段的角色，以及它与现有军事系统的集成触点。
    data:
      nodes:
        - id: threat-detect
          label: 威胁探测 / 目标指示
          detail: 情报、监视与侦察（ISR）系统——卫星、UAV、JTARS——识别时敏移动目标或加固固定目标。目标坐标传给火控系统。
          tone: neutral
        - id: fire-control
          label: 火控授权
          detail: >-
            陆军 AFATDS、海军陆战队 MAGTF AFATDS 或 Joint Fires Network 接收带目标坐标的数字化呼火。Blackbeard 的开放火控接口可接受标准 CFF
            脚本，不需要定制中间件。海军型号通过航母打击群 LINK-16 协调。
          tone: neutral
        - id: weapon-load
          label: 武器装载 / 平台准备
          detail: >-
            海军：Blackbeard 装载在 F/A-18E/F 机翼挂点（或未来 F-35C 内部弹舱）。航母甲板作业需要 NAVAIR NOSSA/WSESRB 认证（尚未完成）。陆军：Blackbeard GL 装入
            HIMARS MFOM 发射箱；设计目标是换装时间等同标准 GMLRS 发射箱更换（<8 分钟目标）。
          tone: neutral
        - id: launch
          label: 发射（空中或地面）
          detail: 海军 F/A-18：从航母或陆基机场空射。陆军 HIMARS：每个发射箱可齐射 2 发，每辆车 4 发；8 辆发射车的一个连可齐射 32 发高超音速弹。CAML-M（未来）：人员撤离；通过卫星中继控制自主发射。
          tone: positive
        - id: boost-glide
          label: 助推 / 高超音速滑翔阶段
          detail: >-
            固体火箭发动机燃烧约 12 秒，将飞行器推至 Mach 5 以上。级间分离后，气动壳脱落，楔形滑翔体沿压低轨迹飞行，低于传统弹道弧线。中段使用惯性 +
            天文导航。速度和轨迹剖面把对手从探测到反应的周期从数分钟压到数十秒。
          tone: positive
        - id: terminal
          label: 末制导与打击
          detail: >-
            多模 EO 末段导引头在最后阶段捕获并跟踪目标。飞行中重定目标支持时敏移动目标（TEL、舰船、C2 车辆）。声称在 600 km 时 CEP <2 m（来自 defense-aerospace.com
            的设计目标；未经独立验证）。打击战斗部：75 lb（海军）或 220 lb 单体 / 侵彻型（陆军 GL 设计目标）。
          tone: positive
        - id: battle-damage
          label: 战损评估
          detail: 打击后 BDA 通过 ISR 完成。没有 Castelion 专属 BDA 技术；依赖现有联合 ISR 架构。弹药补充取决于 Project Ranger 产能（目标每年数千枚）和来自 NM 的后勤链。
          tone: neutral
    approximationNotes: null
    claimRefs:
      - CE003
      - CE009
      - CE010
      - CE024
      - CE025
