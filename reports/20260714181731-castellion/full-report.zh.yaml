      - number: '3.4'
        title: 能力与价格对比
        blocks:
          - type: paragraph
            body: >
              对 Castelion 最关键的竞争维度，是单位成本叠加产量潜力。Blackbeard 每枚约 $384,000 的设计目标——已在 Pentagon 海军采购预算文件中确认——比 ARRW（$15–18M）便宜
              40 多倍，比 CPS/C-HGB（约 ~$41M）便宜 100 多倍，并从根本上重塑了谁能大批量购买高超音速武器。这个成本差异不是边际优势；它改变了库存规模、任务多样性，以及消耗武器时的风险计算。


              从能力看，Blackbeard 达到 Mach 5+，并在末段机动，比弹道轨迹更难跟踪和拦截。ARRW 是助推-滑翔飞行器，气动外形不同；HACM
              是吸气式超燃冲压武器，推进物理不同，射程更远但开发更慢。CPS/Dark Eagle 是舰射或陆基发射战略滑翔体，不像 Blackbeard
              那样平台无关。在战术空射角色中——从航母出动打击设防目标——Blackbeard 是目前正在积极采购的唯一武器，同时结合了高超音速、空射能力和量产经济性。


              相比在位者，关键能力缺口是射程：Blackbeard 的公开报道射程并未精确披露，而 CPS
              等更远程高超音速滑翔飞行器可以在洲际防区外距离实施打击，战术高超音速导弹未必能匹配。不过，在海军舰载航空任务中，带有高库存纵深的战术射程是海军已经明确选择的取舍；海军正把 MACE 项目指向 Blackbeard
              作为首个武器候选。LCCM 替代品提供数量但牺牲速度；在位者提供射程和涉密能力，但牺牲可负担性和生产速度。
