      - number: '4.3'
        title: 资本充足性与资金跑道
        blocks:
          - type: paragraph
            body: >-
              Castelion 自 November 2022 创立以来，已在五轮融资中累计筹集约 $504M。January 2025 完成的 Series A 约 $100M——其中 $70M 为 Lightspeed
              Venture Partners 领投的股权融资，Andreessen Horowitz、Lavrock Ventures、Cantos、First In、BlueYard Capital 和
              Interlagos 参投；另有 Silicon Valley Bank 提供的 $30M 风险债务。December 2025 完成的 $350M Series B 由 Altimeter Capital 和
              Lightspeed Venture Partners 领投，Andreessen Horowitz、General Catalyst、Lavrock Ventures、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。Series B 后估值约 $2.8B。最大一笔已披露资本投向，是 Project
              Ranger：位于 New Mexico 州 Rio Rancho（Sandoval County）的 1,000 英亩固体火箭发动机制造园区，私人投资 $220M。Project Ranger 已在 early
              2026 破土，第一栋建筑计划 summer 2026 交付，全部 21 栋建筑预计 end-2026 完工并具备生产条件。该设施将创造 300 个高薪岗位，预计十年内带来 $650M
              经济产出。月度烧钱速度、Series B 之外的账上现金，以及项目剩余融资需求都未公开披露，留下实质性投资评估缺口。鉴于 $350M Series B 在 May 2026 本报告日期前六个月完成，同时 Navy
              和 Army 合同收入在爬坡，资本看起来足以支撑至少 12–18 个月运营；但导弹制造和工厂投产调试本身高度资本密集，下一轮融资事件或生产合同里程碑将决定长期现金跑道。
