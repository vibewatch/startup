      - number: '1.3'
        title: 融资历史与估值
        blocks:
          - type: paragraph
            body: >-
              自创立以来，Castelion 已通过多轮融资筹集约 $464M。公司的第一笔外部资本来自 Alex Poulin 的 Lavrock Ventures；该机构在 2023 年 4 月投资
              $2M，此前见证了创始人在 Los Angeles 地区仓库和机加工车间里艰难自举的韧性。拿到第一笔投资后一个月内，Castelion 首次提交方案便赢得 $5M 政府合同——也是公司的第一份合同。2023 年
              10 月，公司宣布 $14.2M 正式种子轮，由 Andreessen Horowitz（a16z）和 Lavrock Ventures 联合领投，First In、BlueYard
              Capital、Champion Hill Ventures 参投。2025 年 1 月，Castelion 宣布完成 $100M 融资：其中 $70M Series A 股权融资由 Lightspeed
              Venture Partners 领投，a16z、Lavrock Ventures、Cantos、First In、BlueYard Capital、Interlagos 参投；另有 Silicon Valley
              Bank 提供的 $30M 风险债（2025 年 2 月最终交割）。2025 年 12 月 5 日，Castelion 宣布 $350M Series B 轮，由 Altimeter Capital 和
              Lightspeed Venture Partners 领投，Lavrock Ventures、Andreessen Horowitz、General Catalyst、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。Series B 轮对 Castelion 的估值约为 $2.8B。累计融资约
              $464M（股权加债务）。从 2023 年 4 月第一笔外部资本到 32 个月后 $2.8B 估值，公司估值快速上行，反映出政府合同势头强、多次飞行测试成功，也反映出机构投资者广泛认可公司的技术和制造路径。
