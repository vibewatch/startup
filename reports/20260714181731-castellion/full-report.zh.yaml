      - number: '5.5'
        title: 技术差异化与专有壁垒
        blocks:
          - type: paragraph
            body: >-
              Castelion 的竞争差异化来自制造 know-how、供应链架构和开发方法的组合，而不是新物理。没有单个子系统在技术上前所未有；差异化在于集成方式和生产经济性。源自 SpaceX
              的“快速建造、频繁测试”方法，把从设计到发射的周期从数年压到数月，形成学习曲线优势；传统主承包商一年或两年一次的测试节奏，短期内很难复制。固体火箭发动机、导引头、CAS、飞控计算机和热防护系统的垂直整合，让
              Castelion 直接控制成本驱动项；多数防务公司已把这些环节让给专门分包商，而后者按带防务溢价的供应链定价。使用汽车级商业部件（发动机、计算机、壳体），并借力全球 R&D 投资，让 Castelion
              相比航天级等价物拥有更好的成本和交付周期位置。SBIR Phase III 单一来源合同授权，在当前原型阶段提供竞争隔离；政府买方可以不重新竞标就追加期权。不过，截至 May 2026，公开专利数据库尚未发现
              Castelion 已授权专利；IP 位置看起来靠商业秘密形态的制造 know-how 支撑，尤其是固体火箭发动机加工配方、热防护铺层流程和 GNC 软件参数。制导栈受 ITAR Category IV
              管制，带来出口约束，也说明该制导系统使用受控美国防务技术；任何 FMS 销售都需要出口许可。The War Zone 提出技术问题：Blackbeard 的飞行剖面可能是峰值超过 Mach 5
              的准弹道轨迹，而非持续高超音速助推-滑翔，因此是否严格符合“高超音速”技术定义仍存疑；Castelion 澄清，社交媒体上的测试载具图像不代表量产武器。
