          - type: callout
            title: 在位者 ARRW 复活带来遥远但真实的替代威胁
            body: >
              空军在 FY2026 以 $387M、到 2030 年以 $1.7B 复活 ARRW 项目，说明即便项目被取消，制度惯性和既有关系仍能支撑更高成本项目。如果 ARRW Increment 2 借助
              Lockheed 的制造规模实现有意义的单位成本下降，且空军能把影响力转向海军采购，Castelion 的空射窗口会变窄。鉴于 ARRW 的失败历史和不同平台（B-52 vs. 舰载
              F/A-18），近期概率较低，但仍需跟踪。
