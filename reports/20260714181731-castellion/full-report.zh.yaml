      - number: '7.3'
        title: 运营、制造与安全风险
        blocks:
          - type: paragraph
            body: >-
              固体火箭发动机制造天然危险。April 2025，Northrop Grumman 位于 Utah 州 Promontory 的推进剂原料设施发生爆炸，摧毁一栋建筑但未造成人员死亡；即便由美国最有经验的 SRM
              制造商运营，AP 基推进剂生产的化学波动性仍被凸显出来。Castelion 正在建设一座可比设施，却没有可比的机构安全历史。公司垂直整合的做法——内部生产 SRM
              推进剂、壳体、导引头和控制系统——会加快成本下降，但也集中运营风险。设施消防在工程设计上很棘手，因为 AP 火灾不能用水扑救；应急规程要求人员撤离并允许受控燃烧，限制了损害缓释选项。Rio Rancho Fire
              Chief James Wenzel 对该设施的高危分类及其对消防部门资源的需求表达担忧。静态点火测试会产生包括氯化氢和细小氧化铝颗粒在内的酸性气体；如果不能全量捕集，这些物质会随风飘散，影响居民空气质量。GAO
              2024 年对美国高超音速项目的评估发现，多数项目未使用现代数字工程工具，推高全行业成本和进度风险；Castelion
              的快速迭代模式部分缓释这一点，但尚未在规模化阶段获得独立验证。资格测试失败仍是实质风险：Blackbeard 必须在 2026 年通过 Army 集成测试和 Navy F/A-18
              平台测试，条件性生产框架才会转成获拨款合同。
