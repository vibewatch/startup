      - number: '5.3'
        title: 制造技术与 Project Ranger
        blocks:
          - type: paragraph
            body: >-
              Castelion 的制造打法，把关键子系统垂直整合与来自商业航天的先进生产方法结合起来。公司内部加工发动机壳体、缠绕复合材料罩体、组装导引头电路板，并用多激光粉床增材制造（3D
              打印）生产飞控舵面和航电线束支撑托盘，从而把每轮组件迭代的传统供应交期缩短约 10 周。金属壳体和橡胶部件来自汽车行业供应商，而不是传统防务供应商，以压低材料成本。企业资源规划运行在 NetSuite
              上，生产跟踪使用 Manufacturo MES（或类似 Manufacturing Execution System）。行业来源称，热防护系统（硅化碳-碳鼻锥铺层）制造良率约 70%，而量产目标为
              90%+。Castelion 已部署额外铺层管，在政府合同资金之外推进良率提升。公司在 calendar year 2025 生产了 50 多件导弹试制件，在 Project Ranger
              投产前验证了高频硬件策略。Project Ranger 是位于 New Mexico 州 Sandoval County（Rio Rancho）的 1,000 英亩高超音速制造园区，代表 $220M
              私人资本投资（Reuters 报道为 $250M）。该设施面向固体火箭发动机（SRM）制造、SRM 静态测试和武器总装。计划中的全部 21 栋建筑目标在 end-2026 完成，第一栋预计 summer 2026
              交付。Project Ranger 满产后设计年产数千枚 Blackbeard 导弹，显著高于 Navy MACE 合同要求的 500 枚 AUR/年最低门槛。公司还在 Torrance,
              CA（总部）、Allen, TX（FPGA 工程）和 Midland, TX（推进与环境测试）运营制造和工程设施。
