      - number: '7.6'
        title: 缓释因素、否决条件与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              尽管存在上述风险，Castelion 仍有几项结构性缓释因素：已签署的 DoW 生产框架协议让每年 500+ 枚导弹的条件性收入可见；Army 和 Navy 多军种集成分散了项目集中度；Project
              Ranger 的垂直整合降低外部 SRM 依赖；SpaceX 校友团队有快速执行记录；$464 million 融资提供现金跑道缓冲。该投资的逻辑失效事件，是 Blackbeard 在 2026 年 Army 或
              Navy 资格测试中出现类别性失败，且无法在 12 个月内恢复；或者 Congress 在两个预算周期内未能为 DoW 生产订单拨款。New Mexico 法院若对 Project Ranger
              发出施工禁令，也会把生产时间线延长 12–24 个月，并对投资逻辑产生实质影响。投资人应监测：Blackbeard 2026 年资格测试结果、Project Ranger 环境许可状态、DoW 生产合同转化日期和
              Congressional appropriation、AMPAC 向 Castelion 分配 AP 供应的情况，以及任何创始人离职公告。下方否决条件表列出具体触发器；一旦触发，需在 30
