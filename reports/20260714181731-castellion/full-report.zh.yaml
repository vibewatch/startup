      - number: '8.2'
        title: 估值背景与融资结构
        blocks:
          - type: paragraph
            body: >-
              Castelion 在 December 5, 2025 完成 $350 million Series B 融资，由 Altimeter Capital 和 Lightspeed Venture Partners
              共同领投，Andreessen Horowitz、General Catalyst、Lavrock Ventures、First In、Space
              VC、Cantos、BlueYard、Avenir、Champion Hill 和 Interlagos 参投。本轮融资隐含投后估值约 $2.8 billion。各轮累计融资约 $504 million，包括
              Lavrock Ventures 最初的 $2 million 种子资金（April 2023）、$100 million Series A（January 2025；$70 million 股权加 SVB
              $30 million 风险债），以及 $350 million Series B。按现有证据，Series B 是截至该日期美国高超音速武器创业公司拿到的最大单轮融资。第三方收入聚合平台
              CompWorth、Growjo 和 GetLatka 的口径收敛到 September 2025 年收入约 $51.5 million，与公司不断扩大的政府合同基础一致。按超过 100 名员工估算，人均收入为
              $515,000。$2.8 billion 估值隐含约 54× 过去十二个月收入倍数，而当时 Anduril 和 Shield AI 的区间为
              23–28×。优先股堆叠、清算瀑布和股权结构表均未公开披露，因此投资者无法独立判断相对于普通股的有效入场价。报告日期前，公开来源中未发现能为 Castelion 估值提供第三方标记的二级市场或要约收购交易。
