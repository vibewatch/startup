      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动来自地缘政治：中国和俄罗斯已经列装可运行的高超音速系统（中国 DF-17/DF-ZF，俄罗斯 Kinzhal、Avangard 和
              Zircon），而大多数美国项目仍停留在开发或测试阶段。这个「战略缺口」已经成为两党共同政治优先事项，压缩了典型 DoD 采办周期，也打开 Other Transaction Authority
              机制以加快签约。「Arsenal of Freedom」原则明确把规模和可负担性定义为威慑支柱，直接利好 Castelion 的制造优先路径。

              次级增长驱动包括：近期高强度行动消耗了美国导弹库存（包括 Pentagon 文件提到的伊朗冲突），让大规模补库更紧迫；DoD 已提出从 2027 年开始用三到五年采购超过 10,000 枚低成本巡航导弹和
              12,000 枚高超音速导弹；国会对国防现代化的支持上升，推动支出从传统平台转向先进弹药。

              采用约束同样重要，不应低估。材料可得性是近期瓶颈：高超音速热防护系统和先进复合材料需要专业供应链，而全球供给受限。测试基础设施稀缺——高超音速测试靶场排期紧，飞行测试节奏直接决定认证进度。ITAR
              制度限制供应链多元化。舰载机集成认证是高门槛监管关口：海军适航认证流程旨在排除航母作业中的灾难性故障，任何测试异常都可能让采购推迟 12–24 个月。12,000
              枚导弹的多年期采购尚未获得国会授权，这是政策风险。最后，军控倡导者和部分战略研究学者警告，快速扩散高超音速武器可能带来升级误判；这一担忧可能在未来预算周期形成政治逆风。
