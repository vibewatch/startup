chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与创立
        blocks:
          - type: paragraph
            body: >-
              Castelion 是一家私营国防科技公司，总部位于加州 Torrance，并在 Los Angeles County（California）、Midland（Texas）、Allen（Texas）以及
              Washington D.C. 政策办公室开展工程、制造和测试业务。公司还在新墨西哥州 Sandoval County 的 Rio Rancho 运营一个新的 1,000 英亩固体火箭发动机制造园区，即
              Project Ranger。Castelion 由三名前 SpaceX 高管于 2022 年 11 月创立；三人一同离开
              SpaceX，想解决他们口中的美国常规威慑关键缺口：缺少可负担、可量产的高超音速远程打击武器。公司的使命，是在面对中国和俄罗斯这两个对手时重建美国高超音速制造能力；两国已先于美国部署可运行的高超音速系统。Castelion
              是一家硬件密集、垂直一体化制造商，把 SpaceX「快速建造、频繁测试」的方法带入国防领域。公司的第一个也是主要产品，是 Blackbeard
              高超音速打击武器，从设计起点就瞄准工业级产量和商业化单位成本。Castelion 的公开目标是 Project Ranger 全面投产后每年生产超过 1,000 枚 Blackbeard
              导弹，并最终扩大到每年数千枚，为美国及其盟友提供有意义的弹药库存纵深。
