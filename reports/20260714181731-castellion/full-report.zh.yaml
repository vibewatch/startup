  - id: FV002
    title: 收入倍数估值敏感性
    type: bar
    layout: standard
    summary: 将不同收入倍数套用到 $51.5M TTM 收入估算，得出 Castelion 的隐含企业价值；区间从 Kratos 水平（9.4×）到当前 Series B 隐含倍数（约 54×）。图中显示，当前入场价高出同业基准多少。
    data:
      items:
        - label: 9.4×（Kratos/KTOS 上市公司）
          value: 484
        - label: 15×（保守国防科技）
          value: 773
        - label: 23.5×（Shield AI Series G）
          value: 1210
        - label: 27.7×（Anduril Series H）
          value: 1426
        - label: 35×（中档拉伸）
          value: 1803
        - label: 54×（当前 Series B 隐含）
          value: 2781
    approximationNotes: >-
      所有数值均为百万美元；将所列倍数套用到 CompWorth、Growjo 和 GetLatka 聚合商给出的 $51.5M TTM 收入估算后得出。该收入估算来自第三方，Castelion 未验证。同业倍数基于截至 2026 年
      5 月的最新轮次或市值数据。
    claimRefs:
      - CV004
      - CV005
      - CV007
      - CV008
      - CV010
      - CV027
  - id: FV003
    title: 估值与回报区间：乐观 / 基准 / 悲观
    type: range
    layout: wide
    summary: 以 2029–2030 年退出为窗口，收入倍数假设与可比公司组保持一致，展示三种情景路径下的退出估值区间，以及基于 $2.8B Series B 入场价的隐含回报。
    data:
      items:
        - label: 悲观情景退出估值（百万美元）
          low: 1000
          high: 2000
          mid: 1500
          detail: 测试失败或生产延期；2027 年前没有生产合同收入；下轮融资隐含估值 $1–2B。基于 $2.8B 入场价的回报：(0.64×) 至 (0.36×)，即本金亏损 36–64%。
        - label: 基准情景退出估值（百万美元）
          low: 5000
          high: 8000
          mid: 6500
          detail: >-
            DoW 框架转为正式合同；2027 年前爬坡到每年 500–1,000 枚导弹；需要 Series C；2029–2031 年 IPO 或战略退出。基于 $2.8B 入场价的回报：1.8× 至 2.9×（5–6
            年隐含 IRR 约 13–22%）。
        - label: 乐观情景退出估值（百万美元）
          low: 15000
          high: 37000
          mid: 22000
          detail: >-
            DoW 框架全部转正；2030 年前每年 3,000+ 枚导弹；以 $1.5–2.5B 前瞻收入、10–15× 倍数 IPO。基于 $2.8B 入场价的回报：5.4× 至 13.2×（4–6 年隐含 IRR 约
            35–55%）。
    approximationNotes: >-
      所有估值均为情景建模估算，不是公司指引或分析师目标价。退出倍数基于截至 2026 年 5 月的 Anduril/Shield AI/Kratos 可比公司组。Series C（基准情景）带来的稀释估计为
      15–25%，未计入上方隐含回报；实际回报会按稀释幅度降低。
    claimRefs:
      - CV019
      - CV031
      - CV032
      - CV035
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: compact
    summary: 面向投委会的八项投资维度评分（1–10 分），权衡市场证明、执行证据和风险调整后估值。分数仅基于公开证据做定性综合；若拿到私有数据，财务健康和生产经济性分数很可能向任一方向移动。
    data:
      items:
        - label: 市场规模与资金支持
          value: 9/10
          description: DoD 2026 财年高超音速预算 $3.9B；全球市场 $8.6B，CAGR >10%；DoD 计划 5 年采购 12,000+ 枚导弹。需求强、有预算支撑，且持续性好。
        - label: 管理层质量
          value: 8/10
          description: 三位 SpaceX 老兵，执行履历覆盖政府销售、国际交易和航天 M&A。一家防务制造初创公司不到 3 年完成 25+ 次飞行测试，前所未有。
        - label: 客户证明
          value: 7/10
          description: 已执行海军合同 $155M+，另有 DoW 框架；陆军 $25M 专项拨款；单一客户集中度（100% DoD）是原始合同金额没有体现的风险。
        - label: 竞争护城河
          value: 7/10
          description: 在低成本空射高超音速制造上先发；Project Ranger 构筑持久产能壁垒；SBIR Phase III 奖项提供竞争隔离。ARRW 复活削弱独占性。
        - label: 产品成熟度
          value: 6/10
          description: 研发飞行测试 25+ 次；已获 MACE 集成合同；印太战区实弹测试仍待完成。高超音速标签未获独立确认；量产代表性设计尚未定型。
        - label: 商业模式耐久性
          value: 5/10
          description: 量产跑通后，固定总价政府合同收入质量高；但客户 100% 集中且生产毛利尚未验证，风险重大。
        - label: 财务健康
          value: 4/10
          description: 未披露毛利率、烧钱速度或 P&L。估算收入 $51.5M、累计融资 $504M，说明近期自我造血能力有限。Project Ranger 除运营消耗外还需要约 $220M capex。
        - label: 估值合理性
          value: 3/10
          description: 约 54× TTM 收入，高于 Anduril 和 Shield AI 的 23–28×；还要求尚不具约束力的生产框架无瑕执行。可比公司组里入场倍数最拉伸。
    approximationNotes: 分数为定性判断（1–10 分），基于截至 2026 年 5 月的公开证据；不是精算结果，也未获公司验证。不同报告或公司之间不可横向比较。若获得私有财务数据，财务健康和商业模式耐久性分数很可能大幅变化。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV010
      - CV023
      - CV026
      - CV040
      - CV041
