      - number: '5.2'
        title: 武器系统架构与子系统
        blocks:
          - type: paragraph
            body: >-
              Blackbeard 武器系统架构的核心，是 Castelion
              把六个核心子系统垂直整合并自研自产：固体火箭发动机推进、控制作动系统（CAS）、飞控计算机、多模导引头、热防护材料和任务软件。这种做法绕开传统防务主承包商—分包商供应链，是 Castelion
              压缩交付周期、把单枚成本降到低于现有厂商的主要机制。推进系统采用固体燃料火箭；地面发射型使用两级构型，发射发动机燃烧约 12 秒，把滑翔体推到 Mach 5
              以上，随后气动外壳分离，楔形滑翔体沿压低弹道飞行，增加雷达跟踪难度，也压缩点防御系统反应时间。制导、导航与控制（GNC）采用惯性导航，并在中段用天文更新修正；末段切换到多模电光（EO）导引头，用于打击移动和加固目标。导引头可在飞行中更新目标，以重新瞄准时间敏感的移动目标。航电围绕现场可编程门阵列（FPGA）处理构建，使用
              AMD/Xilinx 的 Vitis HLS（High-Level Synthesis）工作流，为传感器融合、作动器控制和 GNC 算法执行提供高性能、可重构计算。嵌入式飞行软件覆盖从微控制器低层固件到应用层
              GNC 算法的全栈，并通过硬件在环（HIL）仿真验证。鼻锥热防护采用硅化碳-碳铺层材料，可承受 2,400°C 以上温度，并在由火箭发动机喷管制造工装改造的小型热压罐中固化。所有 HIMARS 靶场操作都要求
              Flight Termination System（FTS）；该系统正在开发，以让武器获得 Army HIMARS 火控系统资格。可行时，汽车级部件替代传统航天级硬件；COO Sean Pitt
              称，这把部件交期从 52 周（航天级）压到数周，同时依靠每年数百亿美元商业验证投资支撑相当可靠性。
