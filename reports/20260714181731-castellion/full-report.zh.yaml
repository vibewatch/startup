      - number: '2.5'
        title: 竞争格局与替代品
        blocks:
          - type: paragraph
            body: >-
              高超音速武器市场有两个清晰竞争层级。既有主承包商层——Lockheed Martin、Raytheon/RTX、Northrop Grumman——掌握了 DoD 历史高超音速合同价值的大部分。Lockheed
              凭 ARRW 和 LRHW 项目领先；Raytheon 是 Hypersonic Attack Cruise Missile（HACM）主承包商；Northrop
              在多个项目中提供关键子系统。这些在位者的竞争优势来自长期项目关系、集成经验和涉密项目准入。

              Castelion 所处的新进入者层由速度和成本定义。在 MACE 项目中，Castelion 的 Blackbeard 已经中选，取代了包括已取消 HALO/OASuW Increment 2
              在内的传统项目。在 LCCM 巡航导弹项目中，另外四家新进入者（Anduril、CoAspire、Leidos、Zone 5 Technologies）持有平行的 DoW 框架协议；如果高超音速 /
              巡航导弹边界变模糊，或国会把类似 MACE 的项目扩大到巡航导弹替代品，它们可能成为未来竞争者。尤其是 Anduril，拥有深厚 VC 支持和宽广国防产品组合，可能支撑竞争性交叉销售。

              对 Castelion 最有利的结构性竞争动态，是海军明确拒绝了在位者路径：已取消的 HALO 项目和 MACE 项目的成本上限（约
              ~$384K/枚）实际上让传统高超音速主承包商无法在等量规模下竞争，因为它们的按成本设计传统根本不同。这并不排除既有主承包商调整自身或通过收购进入低成本高超音速赛道的情形；这仍是一个未解决的尽调问题。
