      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发因素与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Castelion 的自然退出路径包括：被寻求垂直高超音速能力的防务主承包商或二线承包商战略收购；在生产合同产生可审计收入后直接上市或 IPO；或在后续风险轮中安排结构化二级交易。2026 PwC 航空航天与防务
              M&A 展望把弹药和防务科技列为主承包商补强式收购及战略少数股权投资的主要目标，与 Castelion 的画像一致。Pre-IPO 老股交易需要可审计的生产级收入和正
              EBITDA，当前条件尚未具备。战略收购风险有两面：如果 Castelion 证明 Project Ranger 产能跑通，主承包商可能给出高于 $2.8 billion
              的控制权溢价；如果测试受挫，也可能给出低于市场的报价。投资者需要持续监控的投资逻辑破裂触发因素包括：（1）实弹 MACE 项目出现任何已确认测试失败，（2）DoW 生产框架到 Q2 FY2027
              仍未转成绑定购买合同，（3）Project Ranger 建设延迟超过 end-of-2026 投产目标，（4）两名或更多联合创始人离职，以及（5）国会撤销 MACE
              或相关高超音速项目资金。按当前价格投入资本前，优先级最高的六项尽调问题是：（1）每枚 All Up Round 在生产规模下的毛利率，（2）Series B 后实际烧钱速度和现金跑道，（3）Project
              Ranger 资本支出节奏和剩余义务，（4）股权结构表和优先股堆叠，（5）完整飞行测试结果记录，包括任何部分失败，（6）DoW 框架转成生产合同的时间表。公开来源无法解决这些问题；全部需要数据室权限。
