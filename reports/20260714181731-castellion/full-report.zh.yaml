      - number: '6.4'
        title: Department of War 生产框架与采购远景
        blocks:
          - type: paragraph
            body: >-
              Castelion 历史上最重要的客户信号出现在 May 13, 2026：Department of War 宣布一项生产框架协议，把 Castelion 与 Low-Cost Containerized
              Missiles 项目下四家巡航导弹公司一并纳入。DoW 表示，一旦 Castelion 完成测试和验证，部门将授予一份两年期多年采购合同，每年至少采购 500 枚 Blackbeard
              导弹，并可选择延长至五年。此外，DoW 宣称正在“积极寻求必要授权和拨款，以在五年内购买超过 12,000 枚 Blackbeard
              导弹”。这是美国政府首次公开承诺如此规模的高超音速生产，而且完全有条件：没有有约束力的生产订单，没有执行采购订单，整个框架都取决于正在进行的集成、测试和验证日程能否成功完成。即便如此，该框架确实为 2027 至
              2029 年生产批次确立了固定材料单位成本，在正式拨款前提供定价可预见性。空军最初的 SBIR 课题 AF231-D026 继续作为三军通用的 SBIR Phase III
              法律合同工具，使单一来源授予无需竞争性重新征标。DoW 的叙事明确带有战略色彩：它把此事描述为 Trump 总统和 Hegseth 部长“Arsenal of Freedom”授权的一部分，并把
              Castelion 定位为不同于传统主承包商的新工业基础伙伴。这是评估客户留存风险的重要背景：对一个仍处原型测试阶段的项目而言，Blackbeard 采购背后的政治和制度动能异常高；但项目和预算承诺仍可能被
              Congress、政府更迭或测试失败逆转。
