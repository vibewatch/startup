        title: 投资建议与确信度
        blocks:
          - type: paragraph
            body: >-
              按 December 2025 Series B 约 $2.8 billion 的入场价，Castelion
              获得“观察”建议。确信度建立在四个证据扎实的支柱上：一代级、结构性获资的高超音速武器市场；在可负担价格点上率先切入，当前没有空射同业；具备 SpaceX 式执行基因的运营团队；以及 May 2026 DoW
              生产框架释放的政府需求信号——同阶段可比创业公司还没有拿到过。但约 54× 过去十二个月估计收入的入场倍数，相比任何阶段的上市防务科技公司公开基准都很激进。最接近的私营可比公司——Anduril
              Industries 以 $2.2 billion 2025 收入支撑 $61 billion 估值（27.7×），Shield AI 以约 ~$540 million 2026 预测收入支撑 $12.7
              billion 估值（23.5×）——收入基数更大、平台更多元、生产历史更长，倍数却明显更低。风险评级为高：DoW
              框架转成绑定多年期合同、首个全速生产批次按期交付、规模化毛利率得到确认，三项条件必须全部兑现，投资者才能有把握把 $2.8 billion
              入场价视为公允价值。估值立场为偏高。要升至买入，至少需要出现一项：签署绑定生产合同、披露并确认毛利率 ≥20%，或入场价回落到 <35×
