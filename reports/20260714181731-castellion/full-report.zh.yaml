      - number: '2.2'
        title: 市场规模：TAM、SAM 和 SOM
        blocks:
          - type: paragraph
            body: >-
              多个分析口径都指向同一结论：全球高超音速武器市场在 2025 年约为 $7.82B，2026 年增至 $8.64B，复合年增长率 10.5%，并预计到 2030 年达到 $12.76B（The Business
              Research Company）。Mordor Intelligence 的更宽口径把超音速和高超音速赛道合并，给出 2026 年 $22.77B
              的合计市场；该数字方法论不同，会高估纯高超音速机会。Fortune Business Insights 估算高超音速导弹子赛道（不含滑翔飞行器）在 2026 年为 $6.56B，并在 2030 年代初之前保持
              13.3% CAGR。

              美国是最大的单一国家市场。Market Research Future 估算，美国高超音速武器赛道在 2025 年约为 ~$2.8B，到 2035 年增至约 $8.5B，CAGR 约
              ~11.7%。北美整体占全球高超音速采购的估算 50–60%，几乎完全由 DoD 支出支撑。FY2026 DoD 预算为陆军、海军和空军高超音速项目专门分配约
              $3.9B——这确认了美国作为买方的主导地位，也验证了 TAM 区间。

              Castelion 的可服务可获得市场（SAM）是 Blackbeard 在技术和项目上有资格进入的 DoD 采购项目集合。最清晰的近期锚点是海军 MACE 项目：FY2027–2031 年采购 4,500
              枚空射高超音速导弹，平均单位成本约 ~$384,000，对应隐含约 ~$1.6B 采购包。再叠加战争部框架协议（五年 12,000 枚 Blackbeard 导弹，每年至少 500 枚，价格尚未公开确认但隐含接近
              $350,000–$384,000/枚），若所有采购选项都执行，SAM 约为 $5.5–6.1B。陆军集成支出（FY2026 为 HX3/HIMARS 工作预算 $25M）是更小且更早期的渠道。Castelion
              在 2026–2028 年窗口期的 SOM 受自身制造爬坡约束：Project Ranger（新墨西哥州 Sandoval County）目标到 2027 年底每年生产数千枚导弹；若 FY2027 MACE
              第一批 353 枚（$156M）执行且 DoW 框架启动，2027 年 SOM 约为 $300–500M。这些数字来自公司隐含信息，无法用公开数据独立确认。
