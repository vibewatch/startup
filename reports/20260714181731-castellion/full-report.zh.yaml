  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 从市场规模、产品验证、客户证明、财务图景、风险画像和估值评估一路串到「跟踪」建议。每个节点概括该维度的关键证据和结论。
    data:
      nodes:
        - id: market
          label: 市场机会
          detail: 全球高超音速武器市场 2026 年达 $8.6B，CAGR >10%；美国 DoD 2026 财年高超音速拨款 $3.9B；DoD 计划五年采购 12,000+ 枚 Blackbeard 导弹。结论：强。
          tone: positive
        - id: product
          label: 产品验证
          detail: 不到 3 年完成 25+ 次飞行测试；仅 2025 年就 20+ 次，验证了 SRM、导引头、CAS、飞行计算机、TPS 和任务软件。公开来源未独立确认其「高超音速」标签。结论：在推进，但尚未完全去风险。
          tone: neutral
        - id: customers
          label: 客户证明
          detail: 已执行海军合同 $155M+；陆军专项拨款 $25M；DoW 生产框架（每年最低 500+ 枚导弹）；没有商业客户，客户 100% 集中在 DoD。结论：强，但客户单一。
          tone: positive
        - id: financials
          label: 财务图景
          detail: 估算收入约 $51.5M；累计融资 $504M；$350M Series B（2025 年 12 月）；毛利率、烧钱速度和单位经济完全未披露。结论：未披露——重大尽调缺口。
          tone: negative
        - id: risk
          label: 风险画像
          detail: 高风险：单一客户（DoD）、生产框架尚不具约束力、$220M capex 承诺、Project Ranger 遭社区反对、关键人物集中、ARRW 竞争项目复活。结论：高风险。
          tone: negative
        - id: valuation
          label: 估值评估
          detail: $2.8B / ~$51.5M = 约 54× TTM 收入；Anduril 和 Shield AI 在大得多的收入基数上分别为 27.7×、23.5×；Kratos 上市可比为 9–12×。结论：估值拉伸。
          tone: negative
        - id: recommendation
          label: 建议——跟踪
          detail: 买入条件：生产合同转正，或毛利率披露且 ≥20%，或入场价格回落到 <35× TTM 收入。持续监控否决触发项。
          tone: neutral
      edges:
        - from: market
          to: product
        - from: product
          to: customers
        - from: customers
          to: financials
        - from: financials
          to: risk
        - from: risk
          to: valuation
        - from: valuation
          to: recommendation
