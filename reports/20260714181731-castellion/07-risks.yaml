callouts:
  - calloutType: risk
    title: Environmental and Community Opposition Threaten Project Ranger Timeline
    body: >-
      Active New Mexico DOJ complaints, an incomplete Sandia environmental plume study, and a fire
      code variance on sprinklers create a realistic pathway to a construction injunction or permit
      revocation that could delay Project Ranger by 12 to 24 months. This is the highest near-term
      risk for investors given its direct impact on the production timeline required to convert the
      DoW framework agreement into a binding revenue stream.
    claimRefs:
      - CR002
      - CR003
      - CR036
      - CR037

  - calloutType: risk
    title: AP Sole-Source Dependency Is an Unresolved Structural Vulnerability
    body: >-
      AMPAC's monopoly on U.S. aerospace-grade ammonium perchlorate production is an industry-wide
      vulnerability that Castelion cannot fully mitigate through vertical integration alone. While
      Project Ranger reduces external SRM assembly dependency, it still requires AMPAC feedstock.
      The DoW's $1 billion L3Harris investment targets downstream SRM capacity, not upstream AP supply.
    claimRefs:
      - CR021
      - CR022
      - CR023

  - calloutType: risk
    title: Key-Person Risk in Three Founders with No Disclosed Succession
    body: >-
      All three co-founders bring unique and non-fungible skills—government relationship management,
      operations leadership, and financial engineering. No succession plan, key-person insurance, or
      named deputy has been publicly disclosed. A departure of any single co-founder would likely
      trigger investor concern and require immediate succession clarity from the board.
    claimRefs:
      - CR025
      - CR026
      - CR027

  - calloutType: assumption
    title: Production Contract Conversion Is the Core Thesis Assumption
    body: >-
      The investment thesis at the $2.8 billion Series B valuation implicitly assumes that the May 2026
      DoW production framework converts into a Congressional-appropriated, multi-year production contract
      for at least 500 Blackbeard missiles per year. This conversion requires Blackbeard to pass
      qualification testing, Congressional appropriation, and DoW program office execution—none of
      which is guaranteed by the framework alone.
    claimRefs:
      - CR041
      - CR042

  - calloutType: recommendation
    title: Commission Independent Environmental Audit Before Further Project Ranger Investment
    body: >-
      Investors should require Castelion to commission and publish an independent third-party environmental
      impact study for Project Ranger—distinct from the company-funded Sandia study—before committing
      additional capital to facility construction. This would close the most significant disclosure gap,
      reduce community opposition, and protect against litigation-driven construction delays.
    claimRefs:
      - CR005
      - CR009
      - CR037

