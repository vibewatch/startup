  - id: operational-manufacturing-safety
    title: Operational, Manufacturing, and Safety Risks
    body: >-
      Solid rocket motor manufacturing is inherently hazardous. An April 2025 explosion at Northrop
      Grumman's Promontory, Utah, propellant ingredient facility—which destroyed a building but resulted
      in no fatalities—underscored the volatile chemistry of AP-based propellant production even at a
      facility operated by the most experienced SRM manufacturer in the United States. Castelion is
      building a comparable facility with no comparable institutional safety history. The company's
      vertically integrated approach—producing SRM propellants, casings, seekers, and control systems
      in-house—accelerates cost reduction but concentrates operational risk. Fire suppression at the
      facility is architecturally challenging because water cannot be used on AP fires; emergency
      protocols call for personnel evacuation and allowing controlled burns, limiting damage mitigation
      options. Rio Rancho Fire Chief James Wenzel raised concerns about the high-hazard classification
      of the facility and its demands on fire department resources. Static fire tests generate acid
      gases including hydrogen chloride and fine aluminum-oxide particulates that, without full capture,
      can drift downwind and affect residential air quality. GAO's 2024 assessment of U.S. hypersonic
      programs found most programs not using modern digital engineering tools, increasing cost and
      schedule risk industry-wide; Castelion's rapid iterative model partially mitigates this but
      has not been independently validated for scale-up. Qualification test failure remains a
      material risk: Blackbeard must pass Army integration and Navy F/A-18 platform tests in 2026
      before the conditional production framework converts to an appropriated contract.
    claimRefs:
      - CR008
      - CR010
      - CR015
      - CR016
      - CR017
      - CR018
