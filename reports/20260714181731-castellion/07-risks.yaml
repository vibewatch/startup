  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Program cancellation / production deferral
        - DoW production order conversion and Congressional appropriation
        - Failure to achieve appropriated production contract within 2 budget cycles (FY2027–FY2028)
        - Reduce position; require management explanation of recovery path
      - - Environmental litigation injunction
        - NM DOJ complaint status; court filings against Project Ranger
        - Court injunction or permit revocation halting construction or operations
        - Re-evaluate timeline; 12–24 month delay materially impairs thesis
      - - Qualification test failure
        - 2026 Army HX3 and Navy MACE qualification results
        - Three or more consecutive test failures without credible technical recovery
        - Reduce conviction; demand recovery plan and updated schedule before next check-in
      - - AP supply disruption
        - AMPAC delivery schedules vs. Project Ranger production ramp
        - More than 30-day AP delivery delay affecting production schedule
        - Demand second-source plan from management within 30 days
      - - Founder departure
        - SEC or press announcements; investor updates; LinkedIn changes
        - Departure of any co-founder (Hargis, Pitt, or Kreitz)
        - Immediate re-assessment; query board on succession plan before 30 days
      - - Financial runway depletion
        - Contract milestone timing vs. reported cash burn
        - Runway falls below 12 months without a signed binding production contract
        - Demand updated financing plan; treat as material negative signal
    notes: >-
      Trigger thresholds are author-estimated based on publicly available program and financing data;
      actual management dashboards and financial disclosures would sharpen these thresholds.
      All triggers are monitorable through publicly available sources except founder departure
      (requires investor update access) and financial runway (requires management disclosure).
    claimRefs:
      - CR019
      - CR020
      - CR031
      - CR036
      - CR041
      - CR042

