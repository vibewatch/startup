  - id: mitigations-kill-criteria
    title: Mitigations, Kill Criteria, and Thesis-Break Triggers
    body: >-
      Despite the risk profile above, Castelion has several structural mitigations: a signed DoW
      production framework agreement provides conditional revenue visibility at 500+ missiles per
      year; multi-service integration (Army and Navy) diversifies program concentration; vertical
      integration at Project Ranger reduces external SRM dependency; the SpaceX-alumni team has
      a demonstrated record of executing at speed; and the $464 million capital raise provides a
      runway buffer. The thesis-break event for this investment is a categorical test failure of
      Blackbeard during 2026 Army or Navy qualification campaigns that is not recoverable within
      12 months, or a Congressional failure to appropriate the DoW production order within two
      budget cycles. A construction injunction on Project Ranger by New Mexico courts would also
      extend the production timeline by 12–24 months with material thesis implications. Investors
      should monitor: Blackbeard's 2026 qualification test outcomes, the status of Project Ranger
      environmental permits, the DoW production contract conversion date and Congressional
      appropriation, AMPAC AP supply allocation to Castelion, and any founder departure announcement.
      The kill-criteria table below catalogs the specific triggers that would require thesis
      re-evaluation within 30 days.
    claimRefs:
      - CR019
      - CR020
      - CR041
      - CR042
    tableRefs:
      - TR005

