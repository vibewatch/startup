            body: >-
              Forge Global 对 July 2026 Series D 的列表把所有投资人标为「未披露」。对一轮 $44 million
              独角兽融资而言，没有具名机构投资人并不寻常，也让清算优先权堆叠、反稀释机制、董事会构成变化以及新投资人信息权无法被尽调。在数据室确认投资人身份和条款清单前，Series D 后治理结构无法评估。
