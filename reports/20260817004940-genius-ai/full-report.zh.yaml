  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: GlossGenius 把软件订阅和嵌入式支付打包给美容 / 康养商户；单一平台同时跑出两条收入流：SaaS + 金融科技。
    data:
      nodes:
        - id: operator
          label: 美容 / 康养商户
          description: 美发沙龙、水疗、医美或康养门店；平台的主要买方和使用者。
        - id: platform
          label: GlossGenius 平台
          description: 一体化 SaaS：预约、支付、客户管理、营销、薪资、AI 分析。
        - id: consumer
          label: 终端消费者（客户）
          description: 预约人；通过 GlossGenius 托管的预约页面或社媒集成完成互动。
        - id: payment-rail
          label: 支付处理
          description: 线下刷卡统一费率 2.6%；当日到账；Tap & Go 和 Pro Reader 硬件。
        - id: marketing
          label: 营销与留存
          description: SMS / email 营销、自动提醒、订金和免责协议功能，压低爽约率。
        - id: embedded-finance
          label: 嵌入式金融服务
          description: 商户预支资金（$1K–$250K）；薪资；集成报表。
        - id: gg-revenue
          label: GlossGenius 收入
          description: 月度订阅（各层级 $24–$168/mo）+ 支付处理价差（统一 2.6%）。
      edges:
        - from: operator
          to: platform
          label: 订阅并配置
        - from: consumer
          to: platform
          label: 预约服务
        - from: platform
          to: payment-rail
          label: 处理交易
        - from: platform
          to: marketing
          label: 触发营销和提醒
        - from: platform
          to: embedded-finance
          label: 开通预支资金和薪资
        - from: payment-rail
          to: gg-revenue
          label: 捕获价差
        - from: operator
          to: gg-revenue
          label: 月度订阅
    claimRefs:
      - CO001
