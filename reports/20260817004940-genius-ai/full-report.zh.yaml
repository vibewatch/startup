      - number: '4.5'
        title: 财务缺口、反向信号与尽调议程
        blocks:
          - type: paragraph
            body: >
              所有核心单位经济指标——毛利率、净留存率（NRR）、获客成本（CAC）、客户终身价值（LTV）——都未公开，无法从公开来源验证。~$200M 收入运行率是 Forbes
              报告的一次门槛跨越，不是精确当前数字。准确支付量、月度烧钱速度和 Series D 后股权结构均未知。这种不透明对该阶段私营公司是常态，但也意味着本章每个财务结论都是建模或推断，并非直接观察。

              最重大的公开反向信号，是 Better Business Bureau 给 GlossGenius Inc.（New York）的 D- 评级。BBB D-
              评级相较其标准字母评级显著偏低，通常反映未解决消费者投诉的模式，或未回应 BBB
              查询。对一家核心价值主张包括支付处理和嵌入式金融服务的公司而言，相关产品领域未解决投诉带来的声誉风险，高于一家非金融业务拿到同样评级。公开搜索未直接确认 CFPB 投诉数据；尽调中应专门核实。

              Series D 投资人身份未披露，是治理红旗。在不知道谁以独角兽定价投入 $44 million 的情况下，尽调无法评估清算优先权堆叠、赎回权、反稀释条款或董事会席位变化。嵌入式资金预支产品（向美业商家发放
              $1,000–$250,000 贷款）引入信用风险、货币服务牌照义务和损失拨备要求，而公开披露中完全没有这些信息。
