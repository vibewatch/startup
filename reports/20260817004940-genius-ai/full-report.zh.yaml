      - number: '3.5'
        title: 切换成本与锁定效应分析
        blocks:
          - type: paragraph
            body: >
              美业软件切换成本中等且不对称。专业端数据——客户联系人列表、预约历史、配方备注和支付记录——被平台持有，并不容易迁移。GlossGenius 为基础客户数据提供 CSV
              导出，但照片档案和服务历史备注如果不手工重录，就难以被竞争平台吃进去。这种数据可携性摩擦，是最具体的锁定机制。

              薪资锁定高于单纯排班。使用 GlossGenius 集成薪资模块的专业人士在切换前，必须对齐历史薪资记录、税务申报和 W-2/1099 文件；年中切换因此会被明显抑制。Boulevard 和 Mindbody
              也在更高价位提供薪资集成，但 Fresha 和 Booksy 目前都不在嵌入式薪资上竞争。

              消费者侧切换成本天然较低：美业消费者习惯通过多个平台预约（多平台并用是理发店和美发沙龙预约中的常态）。Booksy、Fresha 和 Vagaro
              都允许消费者在市场平台上预约任何专业人士，因此当专业人士切换平台时，消费者不用改变行为——只是在新平台上找到该专业人士。这个结构特征意味着，GlossGenius 无法把消费者锁定用作其专业订阅者基础的留存机制。

              运营惯性——员工培训、前台工作流、提醒模板——提供低到中等的切换阻力，能延缓但不能阻止竞争流失。围绕 GlossGenius
              界面定制入职流程、接诊表单和复约自动化的沙龙，迁移成本不低；但一旦竞争平台出现有吸引力的价格或功能优势，这种阻力通常会被消磨。
            claimRefs:
              - CP033
              - CP034
              - CP035
              - CP036
      - number: '3.6'
        title: 战略展望与尽调问题
        blocks:
          - type: paragraph
            body: >
              未来 12–24 个月的竞争动态取决于三个转折：Fresha 定价调整后能否维持市场平台规模（如果 Fresha 流失专业人士，对 GlossGenius 是上行），Square 是否推出美业专用工具并缩小
              GlossGenius 的 UX 优势（下行），以及 GlossGenius 是否开发或收购消费者发现能力（若执行到位，是转型级上行）。Booksy 已披露 $120M 融资和 $65.9M 2024
              收入，显示它是资本更充足的国际同业；但 Booksy 地域更多元、理发店占比更高，与 GlossGenius 高端沙龙客户基础的直接重叠只是部分而非全部。

              关键尽调问题：（1）GlossGenius 流失账户中，有多大比例迁往 Fresha、Vagaro 或 Square？流失目的地数据可以量化最尖锐的替代向量。（2）GlossGenius
              是否试点或评估过市场平台或需求生成功能？产品或商业模式障碍是什么？（3）GlossGenius 多门店客户数量和 ARPU
              相对单门店账户如何？这能说明上探市场是否实质改善单位经济，还是只制造支持复杂度而没有收入抬升。

              Boulevard 是定位最高度相似的高端竞争对手；在任何 GlossGenius 财务预测假设医美 spa 层 ARPU 可防守之前，都应详细审计 Boulevard 定价。如果 Boulevard 能以
              $234–$328/mo 加 ePrescribe 成功留住医美 spa，GlossGenius $148/mo 的 Platinum 方案可能结构性定价过低；也可能恰好面向大众化医美 spa 层，而
              Boulevard 的企业级打法无法高效触达。
