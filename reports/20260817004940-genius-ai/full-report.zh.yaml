      - number: '8.3'
        title: 上市可比公司分析
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 位于垂直 SaaS 与嵌入式金融科技的交叉点，纯粹可比公司有限。最相关的公开参照是 ServiceTitan（TTAN）；
              它服务家庭和商业服务企业，平台包含排期、支付和劳动力管理。ServiceTitan 的 FY2026（截至 2026 年 1 月 31 日） 收入为 $960.97 million，毛利率为 70.1%；截至
              2025 年 7 月，非关联方股份的总市值约为 $6.05 billion—— 隐含 IPO 及 IPO 后交易时 EV/Revenue 约 6.3×。ServiceTitan 的可比毛利率和垂直 SaaS
              商业模式，使它成为 GlossGenius 最有用的单一公开可比。Toast（TOST）虽处于相邻垂直（餐饮技术），但提供了一个负面参照： FY2025 在 $6.15 billion 收入上的毛利率仅
              25.9%，反映支付量占比较高的收入组合；截至 2026 年 7 月， 其 P/S 约 2.4×。如果 GlossGenius 的收入也大幅偏向支付（像 Toast 一样），其合理倍数会显著压缩到那一区间。
              Damodaran 2026 年 7 月数据集显示，软件公司 P/S 中位数为 9.01×，EV/Sales 为 9.56×，可作为天花板基准。 Mindbody 于 2019 年被 Vista Equity
              Partners 以 $1.9 billion 收购，是最相关的 M&A 可比：它也是面向健康与美业商家的垂直 SaaS 平台，并与 GlossGenius
              有直接产品重叠。该交易提供了并购上限参照。私营家庭服务垂直 SaaS 公司 Jobber 拥有 400,000+ 用户，但没有公开估值数据。
