        - GlossGenius 收集敏感的商户和消费者数据，并提到加州合规。
        - 隐私政策讨论处理者 / 服务提供商定位，以及加州相关权利。
        - 高
        - 要求提供隐私项目负责人、各州法规映射，以及供应商 DPA 覆盖范围。
      - - PCI DSS
        - GlossGenius 通过 Stripe 处理银行卡支付，并承接收款流程。
        - PCI SSC 称，处理银行卡的实体必须遵守 PCI 标准。
        - 高
        - 要求提供 PCI 范围、SAQ/ROC 状态，以及与 Stripe 的共同责任细节。
      - - FTC 隐私与安全预期
        - 公司存储金融和身份数据，同时作出隐私承诺。
        - FTC 指引强调数据保护措施和真实的隐私声明。
        - 中高
        - 要求提供安全控制、泄露处置流程和隐私治理负责人。
      - - 州牌照与美容行业合规
        - 专业人士用该软件经营受监管的美容业务。
        - 条款把牌照合规责任放在专业用户身上。
        - 中
        - 要求说明平台如何按州检查、提示牌照义务，或作出免责声明。
      - - 仲裁与集体诉讼豁免
        - 合同把客户争议导向庭外解决。
        - 条款要求个人仲裁，并豁免集体诉讼。
        - 中
        - 审阅争议数量、投诉处理流程和仲裁历史。
      - - 用户内容与业务转让权利
        - GlossGenius 主张宽泛的内容权利，并可在交易中转移数据。
        - 条款授予永久内容许可；隐私政策允许 M&A 中的数据转移。
        - 中高
        - 要求提供数据留存规则、M&A 转移保护措施和同意机制。
    notes: 各行覆盖公开材料中可见的主要监管和合同义务；认证深度和执法历史在公开来源中仍不完整。
