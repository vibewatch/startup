      - number: '7.4'
        title: 监管、法律与数据隐私风险
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 的合规暴露面，比它面向消费者友好的品牌暗示更宽。隐私政策称，公司会收集敏感身份标识和金融数据，
              包括社会安全号码、银行账户、支付卡信息、专业执照详情和照片。这自然抬高了隐私、安全和支付处理门槛。 政策还提到 California 和其他州隐私制度；FTC
              的隐私—安全指引也明确，处理消费者数据的公司必须保护数据并兑现隐私承诺。 支付侧，PCI 标准适用于处理支付卡的实体，因此依赖 Stripe 并不会消除合规暴露，只是把风险转入共同责任范围。
              条款还把法律复杂度继续拉高：它把执照合规责任放在专业人士身上，要求强制个人仲裁，并授予 GlossGenius 对用户内容的广泛永久许可。
              公司还保留在商业交易中转移数据的权利。公开文件没有写出的内容同样重要：所审阅材料没有展示 PCI DSS 等级、SOC 2 报告或可比认证，使外部投资者只能有限看到安全成熟度。
