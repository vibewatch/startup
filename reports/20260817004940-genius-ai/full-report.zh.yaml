      - number: '2.2'
        title: 市场规模测算——服务支出、企业数量与软件机会
        blocks:
          - type: paragraph
            body: >
              没有单一权威来源覆盖美国 NAICS 8121 所有子分部的个人护理服务总收入，因此需要多组测算镜头。SBDC（2025）引用的 First Research 估计，仅美国美发服务子分部就约 $25
              billion，覆盖约 84,000 家机构。加入 BLS 可推导的美甲、按摩治疗、护肤和医美收入后，自下而上的跨分部估计显示，美国个人护理服务总收入在 $45–85 billion 区间，取决于是否纳入医美
              spa、健身相邻健康服务和沙龙零售。

              从消费者支出视角看，BLS Consumer Expenditure Survey 2024 报告家庭年均个人护理产品与服务合计支出为 $978；乘以 135.76 million
              个消费单位，意味着个人护理总支出约 $133 billion，不过其中大多数是家庭自用产品，而非专业服务。

              软件和支付平台机会需要单独测算。约 270,000 家机构处于 NAICS 812（personal care and laundry services，个人护理和洗衣服务；BLS iag812
              2025）；保守估计 500,000–700,000 个总可服务单元——包括在传统线下门店之外工作的单人经营者——按每年合计订阅与支付费用 $2,500–$4,000 计算，可得到 $1.25–$2.8
              billion 的软件 + 支付总可用市场（TAM）。GlossGenius 自报 100,000+ 客户，平均 ARPU 约 $1,000（由 ~$200M 收入运行率隐含），意味着当前已渗透约 14–20%
              的软件可服务市场，也印证了 TAM 上限。

              MarketsAndMarkets 估计，全球预约排班软件市场（更窄口径）2023 年为 $342.3 million，并以 13.8% CAGR 增长至 2030 年 $803.7 million。另一份
              Allied Market Research 新闻稿则称，全球沙龙管理软件市场到 2030 年为 $9.74 billion——两者相差 12
              倍，反映口径定义根本不同；在无法看到底层方法论前，本报告对该差异给予低置信度。
