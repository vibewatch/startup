      - number: '8.2'
        title: Series D 交易与估值历史
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 于 2026 年 7 月 21 日完成 $44 million Series D 融资，每股 $49.00，投后估值 $1.15 billion。 根据 Forge Global
              披露，本轮投资者包括 2048 Ventures、Abaco、Bessemer Venture Partners、Burst Capital、 HearstLab、Imaginary Ventures 和 L
              Catterton。本轮是公司第四次机构融资，之前依次为：2021 年 11 月的 $16.4 million Series A（Bessemer 领投，投后约 ~$131M）、2022 年 9 月的 $25
              million Series B（投后约 ~$394M）， 以及 2023 年 7 月的 $28 million Series C（L Catterton 领投，投后 $510M）。从 Series C 到
              Series D 的估值跃升—— $510M 到 $1.15B，30 个月内增长 2.2×——与公司跨过 ~$200M 收入运行率并达到有意义支付量相符。 累计融资约
              >$125M，对一家独角兽来说效率惊人。GlossGenius 的 SEC EDGAR 文件（CIK 0001988828） 确认 2023 年 8 月有一份 Series C 的 Form D，总发行额
              $35.99M。截至研究日期，EDGAR 全文搜索尚未出现对应的 Series D Form D；这是一个小缺口，但对处在五日申报期限内的融资并不少见。Nasdaq Private Market 2026 年 5
              月 20 日数据显示， 二级市场价格为每股 $44.54，较 $49.00 的 Series D 每股价格折价 9.1%；这符合后期私营股份正常流动性折价， 并不代表基本价值被下调。
