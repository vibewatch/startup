chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              GlossGenius 是一体化 SaaS 平台，专为预约制美容与健康商家打造，包括美发沙龙、spa、医美 spa、健康服务机构和相邻垂直领域。公司于 September 2015 在 New York
              注册，2016 年商业化推出产品，从宿舍里一位自由职业化妆师的想法，成长为截至 July 2026 服务超过 125,000 家商家的规模化平台。总部位于 169 Madison Avenue, New
              York, NY 10016，另有办公地址 579 Broadway Suite 2C, New York。

              商业模式由经常性订阅和支付处理两部分构成：商户支付月度平台费（Standard、Gold 或 Platinum 分层），并以 2.6% 的固定刷卡费率把交易导入 GlossGenius，从而形成每个席位上的软件
              + 金融科技混合收入。GlossGenius 称，客户第一年收入平均提升 26%，每月节省约 40 小时行政工作，并达到 75%
              的平均复购预约率——公司把这些数字作为核心市场推广证据。平台用一个移动优先界面处理预约、支付、客户管理、营销、薪资、表单和嵌入式金融服务。公司有意不设主动销售体系；从创立到独角兽估值，增长主要靠有机口碑和产品驱动分发。
