        title: 信任、安全、质量与合规
        blocks:
          - type: paragraph
            body: >-
              信任信号不错，但并不均匀。客户情绪方面，Software Advice、Capterra 和 The Salon Business 都给了产品较高评价， 移动 App 在 iOS
              上的分数尤其强。合规和支持方面，公开材料显示公司有真实的帮助中心、专门的支付文档区、 安全 EMV 合规支付表述，以及招聘页中面向医美流程的 HIPAA 插件。Fast Company 的 2024
              年最具创新力公司和 2025 年最佳创新工作场所认可，也为产品组织持续发货提供了第三方背书。信任图景里较软的一面则不那么有利。 BBB 搜索结果也显示 GlossGenius 评级为
              D-，给总体正面的软件评论均值加上了声誉反向信号。Android 评分明显落后 iOS；GitHub 上几乎看不到公开工程或开源足迹；公开材料除了营销表述和支持页面，也没有展示支付安全控制的深度外部文档。
              合在一起看，GlossGenius 足以支撑 SMB 采用，但在大型买家可能期待的公开技术透明度信号上仍偏轻。
