  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品套件与预约—支付流程
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 把产品打包成三个付费层级，并把预约到结账的流程紧密串在一起。Standard、Gold、Platinum
              覆盖从单人经营者到更大团队的核心升级路径，价格也足够简单，适配公司的自助购买模式。典型客户先使用托管预约页， 再借助 Google
              或社交渠道上的商家资料被发现，客户无需登录即可选择预约。随后，预约会在同一套系统里完成确认、 提醒、订金、表单、免责协议、客户资料补全、结账和再次预约提示。核心模块覆盖在线预约、CRM、支付、营销、库存、
              礼品卡、薪资和分析；嵌入式金融则把变现延伸到结账和服务完成之后。这种一体化是真正的产品优势，因为经营者不必再拼接独立的排期、 POS 和营销系统。主要取舍在于，预约体验围绕 GlossGenius
              托管环境优化，而不是围绕经营者自有网站上的全嵌入式组件优化。
