            title: 向更宽垂直行业扩张，是一把双刃剑
            body: >-
              GlossGenius 把脊椎按摩师、私人教练、瑜伽工作室和医学减重诊所加入专业列表，说明公司有意把 TAM 扩到核心美业之外。
              但未找到这些垂直的具名客户证据，也没有专门功能页面；这种扩张可能更像愿景式营销，而不是这些细分中已经形成实质产品差异化。
