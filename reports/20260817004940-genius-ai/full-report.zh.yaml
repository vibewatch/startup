  - id: FE002
    title: 客户预约工作流
    type: flow
    layout: wide
    summary: 公开工作流从发现开始，经过托管预约、提醒、到店服务、集成支付，最后进入复购预约。
    data:
      nodes:
        - id: client-discovery
          label: 客户发现
          description: 客户通过托管预约页、Google、Instagram、Facebook 或 Yelp 找到商户。
        - id: booking-request
          label: 预约请求
          description: 客户无需登录或下载 app，就能通过托管站点预约。
        - id: confirmation
          label: 确认
          description: GlossGenius 确认预约、应用预约规则，并可收取订金或表单。
        - id: reminder
          label: 提醒
          description: 自动提醒、更新和再次预约提示减少爽约和管理工作。
        - id: appointment
          label: 到店服务
          description: 服务时，商户可在客户档案中查看客户备注、图片、免责协议和历史记录。
        - id: payment
          label: 支付
          description: 集成 POS、读卡器，以及 BNPL 或标准支付完成成交。
        - id: review
          label: 评价
          description: 到店后收集评价，表现数据进入留存和口碑循环。
        - id: rebook
          label: 再预约
          description: 再预约提醒、候补名单逻辑和营销活动把客户拉回下一次到店。
      edges:
        - from: client-discovery
          to: booking-request
          label: 发现并选择服务
        - from: booking-request
          to: confirmation
          label: 完成托管预约
        - from: confirmation
          to: reminder
          label: 安排通知
        - from: reminder
          to: appointment
          label: 到店接受服务
        - from: appointment
          to: payment
          label: 结账
        - from: payment
          to: review
          label: 收集反馈
        - from: review
          to: rebook
          label: 留住客户
