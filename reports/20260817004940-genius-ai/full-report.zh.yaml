      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的可服务市场至少包含六类结构不同的买方，每一类的工作流、预算权和软件采用触发点都不同。单人发型师和单人创业者——以个人品牌经营，或在租用工位中执业的个人——数量最大；BLS
              数据显示，理发师 76%、美发师约 48% 为自雇，意味着潜在单人经营者客户约
              350,000–400,000。对这类买方而言，预算所有者就是专业人士本人，软件成本来自个人收入，采用触发点通常是客户复约失败或行政时间危机。

              租位从业者是结构上独立的子分部：他们是在沙龙内部工作的独立承包人，需要不依赖沙龙老板系统的便携预约和支付工具。GlossGenius 定价页显示，公司通过独立银行账户功能明确支持这一模式。

              小团队沙龙（2–9 名服务者）引入新的付费方动态——沙龙老板或经理控制平台选择，承担订阅成本，并把平台部署到员工。中型沙龙（10+ 名服务者）则增加薪资、合规和报表需求。日间 spa
              和健康中心服务目录更复杂，也有零售 POS 需求。医美 spa 是高端分部，需要符合 HIPAA 要求的数据处理、详细客户记录，并且通常需要更紧密集成临床接诊表单。

              IBISWorld（经 SBDC 引用）的消费者年龄队列数据表明，终端付费客户偏年长：55 岁及以上消费者贡献 30% 的美发和美甲沙龙支出，25 岁以下消费者仅贡献
              12.1%；这说明既有客户群比技术新鲜感更看重服务连续性。不过，Gen Z 和 Millennials 正在重塑采用预期：SBDC 2025 分析引用的 Boulevard 调查显示，55% 的 Gen Z 和
              47% 的 Millennials 把商家的社交媒体存在视为最重要的预约因素；随着发型师打造数字形象，下游软件需求随之出现。
