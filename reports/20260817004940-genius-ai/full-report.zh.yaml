      - number: '3.3'
        title: 消费者市场缺口与新客发现风险
        blocks:
          - type: paragraph
            body: >
              GlossGenius 面临的最结构性竞争不对称，是缺少面向消费者的新客获取市场平台。Booksy 的 40 million 名消费者和 $10 billion 年 GMV、Fresha 横跨 120 个国家的
              25 million 名消费者，以及 Vagaro 的本土市场平台，共同形成客户发现飞轮，而 GlossGenius 订阅者完全拿不到这一能力。StyleSeat 同样靠 2 million+
              客户侧用户群变现，以每月 $35 固定订阅打包市场平台展示位。

              TheSalonBusiness.com（March 2025）的反向评测证据明确把这一点列为从业者离开 GlossGenius 的原因：「不像 Fresha 和 Vagaro 等竞争对手，GlossGenius
              不提供一个新客户可以发现你业务的集成市场平台。」同一来源指出，Fresha 模式通过首笔交易 20% 佣金带来新客预约，本质上是用收入分成换取获客——当客户管道偏弱时，独立专业人士会觉得这笔交易有吸引力。

              市场平台缺口带来两项二阶影响。第一，它限制了 GlossGenius 的数据护城河：没有消费者侧行为数据，GlossGenius
              无法搭建发现算法、消费者偏好图谱或跨专业人士推荐引擎。第二，业务下行时它会制造流失压力：如果某位专业人士遇到淡季，即便 GlossGenius 的专业端工具运营上更好，也可能合理化切换到 Fresha 或
              StyleSeat，以获得嵌入式需求生成收益。

              Fresha 2025 年从免费转付费的转型引出一个相关战略问题：随着 Fresha
              引入订阅收入，其市场平台护城河会被侵蚀，还是混合模式会让它成为更耐久的竞争对手？早期证据显示，平台在定价迁移中留住了大部分专业人士基础；这强化而非削弱了它相对 GlossGenius 的竞争位置。
