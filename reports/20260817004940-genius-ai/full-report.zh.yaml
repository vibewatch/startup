      - number: '5.3'
        title: AI 创新、嵌入式金融与 2025-2026 年发布
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年最清晰的产品主线，是 AI 工具与嵌入式金融继续扩张。Growth Analyst 并不是被包装成一个被动仪表盘； GlossGenius
              称它会每天扫描业务数据，主动发现漏掉的收入，生成定制报告，并把一家沙龙或医美机构与类似经营者做基准比较。 招聘页的例子更进一步，称第一个主动式 AI 智能体发现了超过 $5 million
              的潜在客户收入。同一页面还展示了相邻的 AI 工作：Voice AI Receptionist 后端、一个会读工单并写代码的内部编码智能体，以及面向医美流程的 HIPAA
              合规插件。金融科技侧，产品现在把固定费率支付、即时到账、通过 Affirm、Afterpay 和 Klarna 提供的 BNPL、 收入分成式资本预支，以及集成薪资放在一起。Fast Company 的 2025
              年最佳创新工作场所认可能再给路线图一个信号： 一个黑客松诞生的目标设定和分析功能，据称让用户收入平均提升 51%。
