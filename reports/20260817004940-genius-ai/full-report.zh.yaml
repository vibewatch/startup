      - number: '4.4'
        title: 资本结构、充足性与融资依赖
        blocks:
          - type: paragraph
            body: >
              GlossGenius 于 2026-07-21 完成 Series D——一轮 $44 million 融资，每股 $49.00，隐含投后估值约 $1.15 billion（独角兽地位）。Forge
              Global 将投资人标为「未披露」，对这个规模的融资而言并不常见，也阻断了治理和信息权分析。累计融资约超过 $125 million（Forge Global 数据）；对于一家 ~$200M
              收入运行率的公司，这意味着累计烧钱足迹不大。

              投后估值路径——$131.77M（Series A-1）、$394.51M（Series B）、$508.71M（Series C-2）、$1.15B（Series D）——反映四年间估值约提升 8.5x，而
              ARR 从不到 $20M 增长到 $100M+。Series D 隐含收入倍数约为 10–11x ARR（以 ~$200M 收入运行率为基数），与 2025–2026 年高增长公司在优质垂直 SaaS
              倍数上的水平一致。

              Nasdaq Private Market 估计 2026-05-20 二级市场股价为 $44.54，相比五个月前设定的 $49.00 Series D 价格仅折价
              9%；这个折价异常紧，说明二级供给有限，投资人对平台仍有信心。

              公司在 July 2026 融得 $44 million，且 378 人团队通常对应成长阶段运营成本；估计年度烧钱速度为 $20–35 million，意味着 Series D 从交割日起可支撑约 15–26
              个月（大约到 Q2 2027–Q3 2027）。该估计假设公司尚未现金流为正；如果 ~$200M 收入运行率叠加高贡献毛利已转化为接近盈亏平衡的运营，现金跑道可能显著延长。精确财务状况需要数据室确认。
