      - number: '3.4'
        title: 护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的耐久竞争优势集中在三点：（1）美业与健康专业人士中的品牌资产，他们把平台和高端移动
              UX、简单易用联系在一起；（2）集成薪资处理，它制造会计和报税依赖，使薪资周期内切换的运营成本变高；（3）美业原生数据格式，包括客户照片、服务历史，以及为美业工作流定制的接诊表单。

              主要替代风险是核心排班和支付功能商品化。Square 免费层、Fresha 低成本模式、Vagaro 全包中端方案，都能以挑战 GlossGenius
              对早期单人创业者价值主张的价格，交付排班、支付和基础营销。如果新发型师的第一个数字工具是 Square（免费）或 Fresha（~$20/mo），GlossGenius
              之后必须在品牌惯性和已嵌入工作流面前重新赢下该专业人士。

              次要风险来自 Boulevard 和 Mindbody 的上探替代。随着 GlossGenius 扩展团队管理和医美 spa 功能以捕获更大客户，它越来越多地与 Boulevard 专为多服务者和
              ePrescribe 打造的工具链竞争，也会面对 Mindbody 在健身与 spa 企业级分部的强品牌认知。Boulevard 的 12 个月合同结构和 $140–$328/mo
              价格点，反映高端沙龙分部的支付意愿；GlossGenius 只有通过 Platinum 方案才能规模化覆盖。

              最弱的护城河环节，是缺少自有分发渠道。Vagaro、Booksy 和 Fresha 都有消费者侧网络效应：平台上每增加一个新消费者，都会给现有专业人士带来边际价值。GlossGenius
              的网络效应仅限于其预约页带来的推荐流量，以及 Fast Company Most Innovative Companies 2024 品牌信号——这是一种软竞争优势，挡不住平台侧既有厂商。
