  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与摘要
        blocks:
          - type: paragraph
            body: >-
              按 $1.15 billion 的 Series D 估值，GlossGenius 值得给出有条件的正面投资信号，前提是尽调确认毛利率、 净收入留存率和 ARR 增长桥。公司已经达到关键规模里程碑——收入运行率
              ~$200M、125,000+ 家商户客户和独角兽身份—— 且只用了 >$125M 累计融资，资本效率很高。估值隐含约 ~11× ARR 倍数；若公司是毛利率强劲的高质量垂直
              SaaS，这一水平在可接受范围内，但需要持续 30%+ 增长和高于 115% 的 NRR 才能支撑价格。二级市场约 9% 折价处在后期私营公司正常范围内，
              并不显示困境。投资逻辑的主要风险，是毛利率披露不足：如果支付收入（按 Toast 可比公司的约 26% 毛利率） 占总收入超过 40%，混合利润率以及合理 ARR
              倍数都会明显压缩。最终投资决定前，必须完整确认收入构成、净留存和股权结构表。 3–5 年持有期，并通过 IPO 或战略并购退出，是最可能带来正回报的路径。乐观情景目标是从当前估值获得 2× 或更高回报；
              基准情景约 1.3×；悲观情景意味着亏损。
