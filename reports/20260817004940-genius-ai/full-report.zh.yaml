      - number: '8.6'
        title: 反向逻辑与不利考量
        blocks:
          - type: paragraph
            body: >-
              核心反向逻辑集中在估值和利润率风险。如果 GlossGenius 的真实收入组合中支付占比超过 40%（像 Toast 一样）， 混合毛利率会降向 40–50%，可比公司集合也会从
              ServiceTitan（6–7× EV/Revenue，70% 利润率）转向 Toast（2–3× P/S，26% 利润率）。在混合毛利率低于 50% 时，11× ARR 倍数很难站住。没有 NRR 披露，
              增长可持续性也未经验证：聚焦 SMB 的 SaaS 公司通常流失更高；如果 GlossGenius 的 NRR 低于 105%， 市场会对其倍数施加明显折价。BBB D-
              评级反映未解决客户投诉，是一个声誉反向信号；虽然不至于推翻投资逻辑， 但需要确认修复进展。二级市场流动性折价（较 Series D PPS 折价 9.1%）以及尚无公开 IPO 申报，说明退出时间表不确定。
              最后，美业和健康垂直天然暴露在可选消费周期之下。若经济衰退或消费者支出长期收紧，GlossGenius 的 SMB 客户基础可能出现更高关闭率，带来流失和 ARR
              逆风，把公司推向悲观情景。单一垂直集中度也会放大这一风险； 相比之下，横向 SaaS 平台有更多元的终端市场。
            claimRefs:
