      - number: '4.2'
        title: 订阅定价、实际收入代理指标与增长信号
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的订阅定价公开且透明。Standard 方案年度承诺价为每月 $24，月付为每月 $28；Gold 方案（公司称为最受欢迎层级）为每月 $48/$56；Platinum 方案面向更大或医美
              spa 导向商家，价格为每月 $148/$168。这些是标价，代表每个活跃商家的最低订阅贡献。加入薪资（每月 $40 加每席 $6）、支付硬件和资本利息收入后，实际 ARPU 更高。

              Forbes 报道 GlossGenius 在「过去一年」跨过 $100 million 年经常性收入（ARR），意味着 $100M 门槛在 2025 或 mid-2026 达成。公司 LinkedIn 资料页在
              2026 年材料中描述其拥有「数十亿美元年支付量」。按公司披露的 125,000+ 家商家，以及假设平均采用 Gold 方案层（每月 $48）计算，纯 SaaS ARR 底线约为年化 $69
              million；纳入金融科技贡献后，这与总 ARR 超过 $100 million 一致。Forbes 报告公司每周 1 million+ 次预约；按估计平均服务票价 $80–120，隐含每周 GMV 为
              $80–120 million，外推年 GMV 为 $4.2–6.2 billion。这些是模型估计，不是已确认数字。

              独立 B2B 软件评测平台 Software Advice 基于 348 条已验证评价给 GlossGenius 4.8 / 5 评分，并将其评为预约排班软件 FrontRunner 2026
              获奖者。这个高满意度分数叠加公司报告的 75% 复约率和第一年平均预约增长 22%，说明个人经营者层面的留存动态较强。
