              少数 SoftwareAdvice 评论提到预约数据丢失、短信提醒不稳定、读卡器故障，以及支持响应慢（工单制，1–2 天 SLA）。 虽然这些评论少于总评论数的
              3%，但对漏发提醒或丢失预约会直接影响收入的商家来说，这些投诉指向了不可忽视的运营风险。
