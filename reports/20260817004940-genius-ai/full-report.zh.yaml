  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争强度与市场替代风险
        blocks:
          - type: paragraph
            body: >-
              竞争是 GlossGenius 的一级风险，因为公司位于沙龙软件最拥挤的区域：单人和微型商户工作流工具。Square Appointments
              可以用零月费让个人服务提供者上手，同时提供几乎相同的核心支付轨道；Fresha 仍以零订阅费叙事降低美业经营者的软件价格锚点。 这意味着，GlossGenius
              不是在对抗弱势本地既有厂商，而是必须证明付费软件值得购买，竞争对手还拥有免费入口或更强分发。 风险不只是价格。Booksy 拥有市场规模和客户侧网络效应；Boulevard 与 Mindbody
              更适合更大或多门店经营者， 而 GlossGenius 若要上探高端市场，就必须赢下这类客户。独立评论也认为，GlossGenius 的功能轻于许多对手；
              这让单人用户更容易爱上产品，却也更难把产品拉伸到更大团队细分。估值进一步放大了竞争负担：2026 年 Series D 之后， 任何客户新增或上探高端市场放缓，都会同时压迫增长预期和退出倍数。
