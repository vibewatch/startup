          - type: callout
            title: 单人客户集中限制 ARPU，并放大流失敏感性
            body: >-
              GlossGenius 的客户基础结构性集中在单人经营者和 10 人以下团队——这是垂直 SaaS 中流失风险最高的细分。 单人专业人士更容易受业务关闭、职业转向和竞争对手价格战影响（Fresha
              提供免费层）。这限制了 ARPU 上行空间； 如果美国个人服务经济收缩，也会带来下行风险。
            calloutType: risk
