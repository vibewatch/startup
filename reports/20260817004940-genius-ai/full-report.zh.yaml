  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的收入来自两根相互咬合的支柱：经常性 SaaS 订阅层，以及负责导流、处理并融资客户交易的嵌入式金融科技层。SaaS 层按月或按年向商户收取三档固定层级之一——Standard、Gold
              和 Platinum——没有免费方案，订阅本身也没有用量计费。金融科技层则从平台内每一美元交易中抽取固定比例，并通过即时提现、薪资处理和资金预支收取附加费用。公司把平台锚定在强制支付路由上（GlossGenius
              Payments 深度集成，且不容易替换），确保每个订阅客户在规模化后也会产生金融科技收入。

              GlossGenius 没有市场平台或消费者发现收入模式；它不从为商户获取新客中赚钱。截至 July 2026，业务也仅限美国，所有收入和运营风险集中在单一监管与宏观经济地区。薪资附加项和资金预支产品是在核心订阅
              + 支付架构建立后推出的，它们是有意设计的 ARPU 扩张杠杆，而非独立获客动作。第三方评测指出，平台移动优先、聚焦美国的设计限制了可服务企业级市场，并压低了多门店运营者可贡献的 ARPU 上限。
