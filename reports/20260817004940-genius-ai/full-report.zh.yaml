          - type: callout
            title: 资本效率异常突出——收入运行率 ~$200M，累计融资 >$125M
            body: >-
              GlossGenius 靠各轮累计约 >$125M 的融资，把收入运行率推到 ~$200M 门槛，ARR / 已投入资本接近 1:1；对垂直 SaaS +
              金融科技公司来说，这种效率非常少见。这条曲线反映出产品驱动增长的结构性优势： 公司不靠外呼销售团队扩张，而是用支付路由的锁定效应带动高留存和扩张，省下传统销售与营销（S&M）开支。对照基准是： 处在独角兽估值的
              Series D SaaS 公司中位数，累计融资通常是 ARR 的 2–4x。
