      - number: '6.5'
        title: 扩张、集中度与经营者规模限制
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 的商业模式在当前单人 / 小团队客户基础与多门店或高人数高 ARPU 细分之间，形成了结构性张力。 Platinum 方案为 $148/月，面向「10
              人以上团队」，包括无限团队成员、佣金结构和高级分析；但独立评论者指出了实质缺口： 没有房间和资源管理（全功能页仅显示「即将推出」），多门店支持弱于 Boulevard 或
              Mindbody，也没有白标或高级自定义品牌能力。 SchedulingKit 的评论说得很直白：「团队排期有限，主要为单人专业人士设计；只服务美业和健康行业，不适合其他业务类型。」

              集中度风险体现在三个维度。第一，客户基础严重偏向单人经营者；相比团队型企业，他们的单账户平均收入更低， 对个体流失也更敏感。第二，GlossGenius 只在美国运营——SchedulingKit
              评论和全部官方内容都确认没有国际存在——限制了总可服务收入。 第三，美业 / 健康垂直集中意味着平台与美国个人服务就业周期高度相关。Professional Beauty Association 数据显示，
              沙龙行业约有 1M 持证专业人士，但 GlossGenius 在其中可服务的市场（预约制、移动优先、愿意支付 SaaS 费用的经营者）更小； 在 125,000 个账户的规模下，GlossGenius
              可能已经服务了愿意数字化的单人经营者细分中的相当一部分。

              现有账户内的落地后扩张，来自方案升级（Standard → Gold → Platinum）和附加产品（Payroll $40+$6/席位、BNPL、Memberships）。 防爽约工具、Waitlist 和
              AI Growth Analyst 都是 Gold/Platinum 功能，给超出 Standard 的单人专业人士创造了自然升级动力。 免费数据迁移计划（「Free Data
              Transfer」）降低了新注册用户的切换成本，但也意味着，如果客户后来流失，他们的沉没成本较低。 公司没有公开按方案层级划分的 ARPU、升级速度或薪资附加产品挂载率，限制了对扩张经济性的量化评估。
