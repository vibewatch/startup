      - number: '1.2'
        title: 创始人、管理层与董事会
        blocks:
          - type: paragraph
            body: >
              GlossGenius 由双胞胎姐妹 Danielle Cohen-Shohet（CEO）和 Leah Cohen-Shohet（首席商务官）共同创办。Danielle 以 summa cum laude
              荣誉毕业于 Princeton University，在校期间也做自由职业化妆师，客户管理摩擦直接启发了 GlossGenius。Princeton 毕业后，她加入 Goldman Sachs
              担任金融分析师，随后离职全栈搭建 GlossGenius。她是 Techstars 校友，也参加过 Sephora Accelerate 项目。Leah 同样毕业于 Princeton，担任 CBO；Inc
              Female Founders 100 对两人的报道也同样认可她。

              截至 2026，当前高管团队包括首席技术官 Christopher Cunningham、首席财务官 Jed Cullen，以及 Nasdaq Private Market 文件中列为联合创始人的 Karim
              Butt。董事会由 Danielle Cohen-Shohet、Leah Cohen-Shohet、Kent Bennett（Bessemer Venture Partners 合伙人，也是 Series A
              领投方）和 Ian Friedman（L Catterton）组成，反映主要机构投资人结构。团队前五年基本没有专业销售人员，先靠有机产品市场契合验证业务，再接受机构资本。
