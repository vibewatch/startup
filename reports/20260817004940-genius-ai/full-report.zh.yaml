  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户画像与分层
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 面向美国的美业、健康与身心护理服务专业人士。截至 2026 年，公司称服务 125,000+ 家商户， About 页面则提到 100,000+
              名业主；这两组数字可能来自不同统计口径（商户账户 vs. 个人业主经营者）。平台明确覆盖 18 个细分行业：发型师、理发师、美容师、睫毛技师、美甲师、化妆师、按摩治疗师、医美和美学从业者、脊椎按摩师、
              针灸师、眉毛造型师、行为治疗师、私人教练、美黑师、纹身和穿孔师、体育教练、瑜伽工作室，以及医学减重诊所。 这种覆盖面值得注意，但与头发相邻的专业人士（发型师、理发师、美容师、睫毛和美甲技师）历来主导美业软件采用；
              鉴于他们在可服务市场中的普遍性，GlossGenius 的收入集中度预计最大也在这些人群。

              GlossGenius 围绕四类角色组织产品：单人专业人士、租椅经营者、团队成员，以及业主 / 经理。单人专业人士是主要设计目标： $24/月的 Standard
              方案被描述为「非常适合单人创业者」，单人专业人士落地页则把 GlossGenius 定位成服务一人经营的「全天候伙伴，帮你获得优势」。平台明确支持租椅经营者，支付可直接打入他们的银行账户，
              独立于工作室业主的薪资系统。最多 9 人的团队由 Gold 方案服务（$48/月）；10 人及以上团队由 Platinum 方案服务（$148/月）。 独立评论者一致认为，GlossGenius
              对更大团队最弱；一个评论平台指出，「有限的团队排期」是实质性限制， 产品「主要为单人专业人士设计」。公司只在美国市场运营；网站语言、定价或媒体报道均未显示国际扩张证据。
