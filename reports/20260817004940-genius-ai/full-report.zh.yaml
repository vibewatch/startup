  - id: FV004
    title: 投资决策逻辑——GlossGenius D 轮
    type: flow
    layout: wide
    summary: 从入场条件，经关键尽调关口到投资决策结果的逻辑流程，说明为何建议只能有条件偏正面。
    data:
      nodes:
        - id: entry
          label: D 轮入场
          description: 投后 $1.15B；$49/股；融资 $44M；2026 年 7 月
        - id: diligence-gate
          label: 尽调关口
          description: 毛利率 ≥65%，NRR ≥115%，ARR 增长 ≥30%，股权结构表审查
        - id: pass-gate
          label: 尽调通过
          description: 利润率、NRR 和 ARR 桥接确认基准或乐观情景；推进条款清单
        - id: fail-gate
          label: 尽调未通过
          description: 毛利率 <50%、NRR <105% 或有 ARR 减速证据；重新定价或放弃
        - id: bull-outcome
          label: 乐观结果（2× 回报）
          description: $250M ARR × 10× = $2.5B 退出；2028 年 IPO 或战略并购
        - id: base-outcome
          label: 基准结果（1.3× 回报）
          description: $180M ARR × 8× = $1.44B 退出；2029 年时间线；个位数 IRR
        - id: bear-outcome
          label: 悲观结果（亏损）
          description: $130M ARR × 5× = $650M；低于 $1.15B 入场价；减值
      edges:
        - from: entry
          to: diligence-gate
          label: 开展尽调
        - from: diligence-gate
          to: pass-gate
          label: 所有关口通过
        - from: diligence-gate
          to: fail-gate
          label: 一个或多个关口未过
        - from: pass-gate
          to: bull-outcome
          label: 高增长路径
        - from: pass-gate
          to: base-outcome
          label: 共识路径
        - from: pass-gate
          to: bear-outcome
          label: 增长减速
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV033
