      - number: '7.2'
        title: 支付经济性与利润率压缩
        blocks:
          - type: paragraph
            body: >-
              Genius AI 面临利润率压缩，因为它的变现栈与支付处理紧密绑定，而支付处理在沙龙软件供应商中正越来越标准化。 公司依赖 Stripe 处理支付，并宣传线下刷卡 2.6% 固定费率；但 Square 公布的是
              2.6% 加一笔小额单笔费用， Fresha 又使用免订阅模式，可把变现转向支付或市场经济性。这压缩了 GlossGenius 提高支付抽成率的空间，
              否则就会引发比价或流失。法律框架又加了一层风险：GlossGenius 保留提前 14 天通知即可变更费用、以及调查期间扣留资金的权利；
              这可能在边缘情形下保护公司，但当客户基础由现金周期紧张的小经营者构成时，也会加剧客户不满。最大的尽调缺口在于， GlossGenius
              没有公开拆分软件利润率与支付利润率。没有这项拆分，投资者无法判断这家公司到底是一家带支付的优质 SaaS 公司， 还是一家支付占比较高、正面对直接商品化压力的垂直软件公司。
