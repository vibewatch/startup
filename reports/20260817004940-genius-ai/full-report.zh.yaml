      - number: '8.5'
        title: 情景分析——乐观、基准与悲观
        blocks:
          - type: paragraph
            body: >-
              三情景框架从 Series D 入场价每股 $49.00（投后 $1.15B）出发，模拟 GlossGenius 在 3 到 5 年持有期内的价值轨迹。 所有情景都假设入场倍数为约 ~11× 过去
              ARR，并把退出倍数设定为与退出时公开 SaaS 市场一致。乐观情景中， GlossGenius 到 2028 年达到 $250M ARR，通过 SaaS 订阅继续主导、支付占比不压低利润率，把毛利率维持在
              70%+，并以 10× ARR 通过 IPO 退出，对应 $2.5 billion 估值——约为入场价的 2.2×。基准情景中，ARR 到 2029 年增长至 $180M，混合利润率为 60–65%，以 8×
              ARR 的市场清算倍数退出，得到 $1.44 billion 结果——约为入场价的 1.3×，Series D 投资者获得个位数 IRR。悲观情景中，增长降至每年 20% 以下——可能由支付市场份额输给
              Square 或 Stripe，或受经济压力的 SMB 客户基础流失升高驱动——ARR 停在 $130M，倍数压缩至 5×， 得到 $650 million 退出，低于 $1.15B
              入场价并形成亏损。极端下行情景（ARR 持平、4× 倍数）只会得到 $400M， 约亏损 65%。倍数压缩是关键摆动因子：如果公开 SaaS P/S 倍数从今天约 ~9× 中位数降至 6×，
              即便走基准轨迹，也需要 $190M+ ARR 才能在 Series D 价格上实现盈亏平衡。
