      - number: '7.5'
        title: 平台依赖与运营可靠性
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 在软件分发和获客两端都依赖外部门卫。Apple 和 Google 控制 App Store 访问，它们的公开政策明确保留拒绝、
              下架或终止分发的权利。这不是假设性的合同细节：对移动优先产品来说，App Store 中断会立刻伤害注册流、更新，甚至账户访问。 分发风险也不止 App Store。GlossGenius 宣传与 Google
              和主要社交资料的预约连接，这有助于获客，但也让公司依赖自己无法控制的上游政策和 API。公开评论证据也能看到运营可靠性风险。Software Advice 评论者提到预约消失、提醒失败、读卡器损坏和支持解决慢；
              BBB 档案显示 D- 评级。条款还允许 GlossGenius 在不通知的情况下暂停账户，并自行决定停用服务功能。最后，
              作为一家独角兽级私营公司，公司仍相对不透明：公开披露在治理、认证和财务分拆上都偏薄；而这恰恰会在平台与运营风险最难量化的地方增加尽调负担。
