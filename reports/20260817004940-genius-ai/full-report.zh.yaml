      - number: '1.3'
        title: 融资历史与投资人版图
        blocks:
          - type: paragraph
            body: >
              GlossGenius 早期拿过一笔约 $2.8M 的小额 pre-seed 轮，并在 Series A 前基本自举了约五年。资本纪律叠加 late 2021 已超过 $1B
              的商品交易总额（GMV），让公司在机构融资前处于有利位置。

              $16.4M Series A 于 November 2021 完成，由 Bessemer Venture Partners 领投，并有一批重要战略天使参与：Tobias Lütke（Shopify
              CEO）、Chris Comparato（Toast CEO）、Aman Narang（Toast 联合创始人）和 Robert Murphy（Mindbody 联合创始人）。来自最成功垂直 SaaS 和 SMB
              支付公司的运营者参投，被公司有意用来验证市场投资逻辑。Series B 于 September 2022 跟进，规模 $25M，由 Imaginary Ventures 和 Bessemer 共同领投，Left
              Lane Capital 作为新机构声音加入；彼时 GlossGenius 报告 40,000 名客户和 $2B 年化交易量。$28M Series C 于 July 2023 完成，由 L Catterton
              Growth Fund 领投，投后估值 $510M。Series D——$44M，2026-07-21 完成——把投后估值推至约 $1.15B，确认独角兽地位。累计融资约 >$125M。
