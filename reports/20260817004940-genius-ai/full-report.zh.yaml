      - number: '6.2'
        title: 采用轨迹与增长
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 披露的 125,000+ 家商户客户数（App Store，2026 年），对一个面向独立美业专业人士的垂直 SaaS 平台来说，是重要里程碑。多轮融资公告互相印证了增长曲线：2022
              年末的 TechCrunch 文章提到平台服务 「数千名美业和健康专业人士」；2024 年 Series D 公告及 Entrepreneur 后续报道提到超过 70,000 家商户； 到 2026 年，App
              Store 列表写到 125,000+，意味着较 2024 年基线至少增长 70%。更早的 FastCompany 「100,000+ 家商户」表述与 About 页面相符，可能反映稍早时点的快照。

              平台参与度信号也有利：App Store 有 3,800+ 条评分，平均 4.5/5；SoftwareAdvice 记录 348 条已验证评论， 评分 4.8/5。相对于账户数，评论深度很高（大约每 345
              个账户 1 条评论），符合高参与用户群特征。JustUseApp 对 3,802 条 App Store 评论的 NLP 分析也提取出正面主题（易用、能跟踪所有事项、客户喜欢）。GlossGenius
              自家网站上的 Vagaro-vs-GlossGenius 对比博客引用了强制创建账户带来的「预约流失 40%」，以此作为转化论点； 这说明公司会跟踪并围绕客户再次预约转化率做营销。平台声称「使用
              GlossGenius 处理支付的商家收入提高 2.6x」， 这是公司自述的结果指标，没有第三方验证；它更可能反映 BNPL、会员等增购功能推高了平均客单价，而不是支付处理费率本身带来因果效果。
