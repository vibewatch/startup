  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              GlossGenius 的可服务市场，是美国使用预约制工作流并处理客户支付的个人护理服务商家，包括美发沙龙、理发店、美甲店、日间 spa、按摩治疗机构、护肤工作室和医美 spa。这些商家主要归入美国人口普查
              NAICS 代码 8121（Personal Care Services，个人护理服务），其下再细分为理发店和美发沙龙（812111/812112）、其他个人护理服务（81219）和美甲店（812113）。医美
              spa 横跨 NAICS 8121 和医疗服务，取决于监管分类；GlossGenius 通过符合 HIPAA 要求的 Platinum 方案明确覆盖该类别。

              纳入的支出类别分为三桶：平台订阅费（每月 $24–$148 区间）、按服务总收入 2.6% 收取的嵌入式支付处理，以及可选附加模块（薪资、HIPAA 合规、开票）。核心 TAM 不包括美容产品零售（NAICS
              4461）、采用定制 ERP 系统的企业级沙龙连锁，以及不用数字排班工具的非正式经营专业人士。相邻市场——健身工作室、纹身店、宠物美容——工作流相似，但由不同垂直竞争对手服务，本报告把它们视为邻近市场而非核心
              TAM。

              GlossGenius 替代的现状方案并不轻：纸质预约本、Google Calendar 等通用日历应用、人工电话排班、社交媒体 DM 预约（尤其 Instagram 和
              Facebook），以及租位门店里不用软件的到店排队。BLS 2024 数据显示，理发师 76%、美发师 48% 为自雇；这部分劳动力中替代方案仍然顽固存在，既创造可服务机会，也带来惯性风险。
