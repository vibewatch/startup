      - number: '6.4'
        title: 留存、满意度与再次预约
        blocks:
          - type: paragraph
            body: >-
              GlossGenius 未公开披露净收入留存率（NRR）、总收入留存率（GRR）或流失率。来自评论平台的满意度代理指标始终很强： SoftwareAdvice 在 348 条已验证评论中，给易用性
              4.84/5、性价比 4.75/5、客户支持 4.75/5。评论中 266 条为五星、30 条为四星，只有 1 条为二星，显示分布高度偏正面。App Store 在 3,800+ 条评分上为 4.5/5。

              平台的留存机制写得很清楚：GlossGenius 的 App Store 描述称，「60% 未预约下次服务就离开的客户，不会自行再次预约」； 平台通过自动 Rebooking Reminders、面向临时取消的
              Waitlist，以及 AI 驱动的 Email/Text Marketing 做再触达来应对这一点。2025 年新增的 Memberships 和 Packages，为高频客户提供订阅锁定。Client
              Insights 功能展示再次预约习惯分析，并跟踪留存率、单客平均销售额和月度新增客户数。

              SoftwareAdvice 评论中的反向证据揭示了运营摩擦：一位评论者称「预约会消失，短信提醒发不出去，信用卡读卡器不能用」， 并抱怨问题解决慢（工单制，1–2 天 SLA）。另一位提到短信营销限制：Gold
              方案每月包含 500 条短信额度， 对拥有大量历史客户数据库的商家来说，超额费用会很痛。第三位评论者指出排期边界问题：工作时间设置会挡住更长服务。 这些投诉在 348 条评论中只是少数（1 到 3 星评论少于
              10 条），但说明对交易量更高的经营者来说，可靠性和可扩展性确实存在痛点。
