      - number: '8.7'
        title: 投资逻辑失效触发点与关键尽调要求
        blocks:
          - type: paragraph
            body: >-
              三个条件会实质削弱投资逻辑，并迫使重新评估入场价格：（1）混合层面毛利率低于 50%——如果审计财务确认这一点， ARR 倍数必须从 10–12× 重定到 5–7×，意味着最高可支撑估值为
              $500–700M。（2）NRR 低于 110%—— 持续低 NRR 表明 GlossGenius 现有账户扩张速度不足以抵消流失，意味着 ARR 增长会比模型更快减速。（3）有证据显示，
              在驱动初始获客的每月低于 $30 价格点，公司正向 Square Appointments、Fresha 或 Booksy 丢失竞争份额。 反过来，如果审计财务显示 NRR 高于 115%、毛利率高于
              65%，且截至 2026 年 7 月的滚动 12 个月 ARR 增长为 35%+，投资逻辑就得到确认。下一节列出的六项开放尽调问题，是做出可辩护投资决定所需的最低信息集。
              若至少前四项——利润率拆分、NRR、ARR 桥和股权结构表——没有得到回答，这笔投资就无法高置信度承销。
            claimRefs:
              - CV013
              - CV023
              - CV033
              - CV036
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV013
              - CV022
              - CV034
              - CV036
              - CV037
      - number: '8.8'
        title: 估值结论
        blocks:
          - type: paragraph
            body: >-
              鉴于 ~$200M 收入运行率里程碑和垂直 SaaS 市场领导地位，GlossGenius 的 $1.15 billion Series D 估值处在可辩护区间内；但相对于 ServiceTitan 的 6–7×
              EV/Revenue 和 Damodaran 软件 P/S 9× 中位数， 11× 隐含倍数提供的安全边际有限。二级市场价格提醒投资者谨慎：较 Series D PPS 折价 9.1% 虽然不大，
              但确认尚没有愿意按本轮价格买入的二级市场。基准情景在 5 年持有期内约 8–12% 的 IRR，不足以达到典型风险投资回报目标； 只有乐观情景（2× 回报）才是风险投资级结果。乐观情景能否实现，取决于
              NRR、毛利率和增长率能否跑赢同业中位数—— 这些都需要专有财务披露才能确认。因此，投资判断是有条件建设性：可以推进投资条款清单，但必须以利润率、NRR 和 ARR
              桥确认为前提；同时通过谈判参与权或反稀释条款保护下行，限制悲观情景暴露。六项尽调要求必须在交割前全部回答。
            claimRefs:
              - CV011
              - CV017
              - CV018
