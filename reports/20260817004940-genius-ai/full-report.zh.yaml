      - number: '4.3'
        title: 单位经济与毛利结构
        blocks:
          - type: paragraph
            body: >
              GlossGenius 尚未公开披露毛利率、净留存率（NRR）、获客成本（CAC）或客户终身价值（LTV）。以下判断来自对可得定价和竞争数据的结构分析。

              订阅分部具备典型 SaaS 毛利率，扣除托管、支持和产品成本后，可能在 70–80% 区间。支付分部毛利明显更低：GlossGenius 对所有交易类型（持卡人在场、轻触支付、存档卡和手工录入）收取
              2.6%，但对持卡人在场与非持卡人在场美业交易的混合而言，支付服务商底层交换费成本估计为 1.5–1.9%。扣除交换费、卡组织费用和支付处理商成本后，净支付利润率可能为 0.6–1.1%——或支付收入线约
              23–42% 毛利率。这与该规模的嵌入式金融科技经济性一致。

              两根支柱的混合毛利率——权重向更高毛利 SaaS 组件倾斜——估计为 55–70%。这低于纯垂直 SaaS 公司 75–85% 的中位毛利率，但高于纯支付处理商常见的 20–35% 毛利率。公司以超过 $125M
              的累计投入做到 ~$200M 收入运行率，显示即便精确数字不可得，单位经济仍然强。没有主动销售团队是结构性 CAC
              优势：通过产品驱动传播和社交预约集成获客，成本显著低于配额制外勤销售。净留存率无法验证；客户「使用 GlossGenius Payments 后收入增加 65%」的说法反映客户侧收入改善，不是
              GlossGenius NRR。

              薪资和资金预支产品在底层基础设施建成后，可在成本不同比例上升的情况下增加 ARPU。薪资栈（基础每月 $40，加每席 $6）很可能部分转付给第三方薪资引擎，压缩该产品线利润率。
