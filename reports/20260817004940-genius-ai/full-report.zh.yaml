      - number: '3.2'
        title: 功能与定价对比
        blocks:
          - type: paragraph
            body: >
              在八家竞争对手中，GlossGenius 每月 $24–$148 的定价（三层：Starter、Standard、Platinum）高于 Square 免费入门点，低于 Boulevard 企业级层级，并与
              Vagaro、Booksy 大致可比。Platinum 层（$148/mo）为医美 spa 增加符合 HIPAA 要求的病历记录、薪资处理和团队管理——这些功能 Boulevard 和 Mindbody
              也有，但价格点显著更高。

              最关键的功能缺口，是没有可嵌入网站的预约组件。Vagaro、Mindbody、Boulevard、Fresha 和 Booksy
              都支持组件，让现有网站无需把消费者重定向到另一个平台即可接收预约。GlossGenius 则提供子域名预约页（yourname.glossgenius.com），不能嵌入自定义域名。这把 GlossGenius
              的可服务客户限制在没有既有网页存在的专业人士——这个子集有意义，但并非无限。

              第二个缺口是多门店管理。Boulevard、Mindbody 和 Vagaro 都支持单一账户下的多门店排班和报表。GlossGenius 的团队管理功能（2023
              年推出）支持员工级排班，但没有提供达到企业竞争对手水平的统一多门店仪表盘。StyleSeat 和 Fresha 与 GlossGenius 类似，主要面向单门店或单人专业人士。

              支付处理方面，GlossGenius 每笔交易收取 2.6%（与 Square Plus 层费率相同）且没有逐笔固定费用；Square 对线下交易收取 2.6% + 15¢。Fresha 线下收取 2.29% +
              $0.20，线上收取 2.79% + $0.20。Boulevard 采用定制处理费率。在具名竞争对手中，GlossGenius 的处理费率不是差异化劣势，在低客单交易上甚至可能略有利。
