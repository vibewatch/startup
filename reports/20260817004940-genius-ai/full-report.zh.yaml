            title: BBB D- 评级对支付和借贷平台是重大信号
            body: >-
              GlossGenius Inc. 在 Better Business Bureau 拿到 D- 评级，这是 BBB 评级体系中仅高于 F 的最低非 F
              等级。对一家每年处理数十亿美元支付量、并向小企业提供资金预支的公司而言，金融产品类别中的未解决消费者投诉，带来的监管和声誉风险超过纯 SaaS 公司。尽调中应专门查询 CFPB
              投诉数据库；州货币传输牌照主管机关或 FTC 是否有活跃监管调查，也必须确认或排除。
