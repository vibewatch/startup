  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              GlossGenius 所处竞争格局可分三层。第一层是老牌企业级既有厂商：Mindbody（1998 年创立，2001 年更名）已经吸收 Booker、ClassPass 和 FitMetrix，如今以每月
              $139–$599、12 个月强制合同面向中大型健康工作室。Mindbody 网站不再列出价格，而是把潜在客户导向销售电话；这个摩擦点正被 GlossGenius 以透明自助定价利用。

              第二层是中端市场通用平台。Vagaro 对单人服务者收取每月 $30，额外用户每人 $10，支持网站预约组件，运营消费者市场平台，并近期加入 AI 辅助工具和每月 $100 的品牌 app
              附加项，是功能最完整的中端竞争对手。Square Appointments 提供免费个人层，以及 Plus（$29/mo）和
              Premium（$69/mo）方案，凭品牌认知和支付网络普及度构成最强免费层威胁。Acuity Scheduling（现归 Squarespace
              所有）是横向排班工具，并未针对美业工作流优化；它主要争夺价格敏感、优先选择网站原生预约的独立专业人士。

              第三层是美业专用市场平台，消费者侧网络强。Booksy 截至 2024 年在 25+ 个国家运营，拥有 140,000 家商户客户、40 million 名消费者和 $10 billion 年
              GMV。Fresha 在 2025 年从完全免费模式转向订阅 + 佣金模式，服务 120 个国家的 450,000+ 名专业人士和 25 million 名消费者。StyleSeat
              仅服务美国市场，聚焦独立发型师和理发师，提供 AI 驱动动态定价。Boulevard 面向高端沙龙和医美 spa，每月 $140–$328，并具备 ePrescribe 和临床病历功能。GlossGenius
              位于中端市场与市场平台层之间：UX 高端、定价透明、美业原生设计，但没有 Booksy 和 Fresha 已经搭起的新客发现飞轮。
