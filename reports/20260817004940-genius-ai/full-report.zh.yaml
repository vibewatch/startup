      - number: '7.3'
        title: 客户基础脆弱性与经济周期暴露
        blocks:
          - type: paragraph
            body: >-
              Genius AI 已有相当规模，但客户组合让收入基础结构性脆弱。公司强调平台上有超过 125,000 家商户，
              但自家包装和第三方评论都显示，重心是单人专业人士或极小团队。这个细分吸引人，因为它庞大且分散；但它天然也更容易流失。 BLS
              创业数据表明，机构存续率会随时间下降；当客户是一人经营者或微型商户时，这一点影响更大，因为他们可以关闭、退休、
              搬迁或转行，而不需要经过漫长采购周期。宏观叠加层让风险更重。美业服务并不是消费者的任务关键型开支，SBDC 的 2025
              年沙龙行业报告已经指出早期消费克制迹象。如果较弱消费环境下预约频率变软，微型商户业主会几乎立刻感受到压力， 可能取消软件、降级方案或减少支付量。GlossGenius 没有公开披露流失率、GRR 或
              NRR，因此投资者无法量化当前增长中有多少是耐久增长， 多少只是可替换增长。
