      - number: '5.4'
        title: 产品限制、集成缺口与竞争风险
        blocks:
          - type: paragraph
            body: >-
              让 GlossGenius 吸引单人专业人士的同一组设计选择，也带来了清晰的扩张风险。第三方评论反复说平台优雅、
              易用，但也强调桌面端体验处于次要位置；面对复杂前台或多门店流程时，系统灵活性较弱；集成面也窄于更大经营者可能希望的水平。 两个限制在商业上尤其突出。第一，预约必须通过 GlossGenius
              托管页面完成，而不是通过带自定义域名的可嵌入组件； 对已经投入自有网站的商家来说，这会带来品牌控制问题。第二，GlossGenius 没有客户市场，因此无法提供 Fresha 或 Vagaro
              能带来的获客引擎。评论者还认为，它的营销自动化轻于 Mangomint 或 Boulevard；同时没有免费入门层， 也压窄了预算敏感用户在比较 Square Appointments
              等横向替代品时的价格保护带。
