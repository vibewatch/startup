      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              四个结构性增长驱动支撑美容与健康软件市场。第一，所有美业职业的就业增长都为正且可持续：BLS 预计美容师在 2024–34 增长 5%，美甲师和美容护理师增长 7%，按摩治疗师增长
              15%——这是增速最快的单一个人护理职业。新从业者进入市场并建立独立执业，会带来增量软件采用机会。第二，医美 spa 分部快速扩张：AmSpa 数据显示，美国医美 spa 门店从 2022 年 8,899 家增至
              2023 年 10,488 家，单年净增约 1,600 家——每一家都是潜在软件客户，且支付意愿更高。第三，跨世代消费者对数字预约的预期上升，Gen Z 和 Millennial
              消费者把社交媒体可见度和在线预约视为基本配置。第四，GVR 估计，全球美妆和个人护理产品市场——可作为行业活力代理指标——2025 年为 $88.20 billion，并以 7.0% CAGR 增长。

              与这些驱动相对，三项采用约束很关键。消费者支出压力最直接：SBDC 2025 分析明确指出沙龙行业已经出现消费者克制的早期信号，Morgan Stanley
              预计美国消费支出增速放缓，受冲击最重的是中低收入消费者，而他们正是沙龙服务的核心人群。2025 年关税成本上升正在压缩运营者利润，削弱其投资新软件平台的能力。免费层竞争替代品——Square
              Appointments 和 Fresha 都提供零成本入门方案——对 GlossGenius 每月 $24 的 Standard
              层构成结构性定价压力。美业软件存在真实切换成本（客户数据库、支付历史、预约逻辑），但门槛并非不可逾越，尤其是刚开始采用预约工具的单人创业者。
