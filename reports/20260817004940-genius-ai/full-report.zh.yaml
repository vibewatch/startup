      - number: '1.5'
        title: 产品概览与平台边界
        blocks:
          - type: paragraph
            body: >
              GlossGenius 平台是一套面向预约制商家的垂直整合运营系统。核心模块包括在线预约（集成 Instagram 和 Google）、带 Tap & Go（$49）和 Pro
              Reader（$299/$349）硬件选项的移动 POS、客户管理和历史记录、SMS 与电子邮件营销、薪资和员工排班、电子表单与弃权书、库存管理，以及嵌入式融资。Memberships and Packages
              于 2025 推出，AI Growth Analyst 于 2026 首发。支付处理提供当日到账，以及 $1,000 至 $250,000 的商业资金预支。

              第三方评测者认为，平台优势在于移动优先 UX、集成刷卡器、社交预约集成和固定费率带来的可预测定价。已识别的限制包括没有免费入门层、多门店团队管理受限，以及相较部分新进入者，历史上 AI 预约自动化较弱。App
              Store 评分为 4.5 / 5，来自 3,800+ 条评价；Capterra 评分 4.5，说明个人经营者层面对产品满意度较强。
