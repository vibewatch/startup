      - number: '1.4'
        title: 规模、牵引力与关键里程碑
        blocks:
          - type: paragraph
            body: >
              对一家先自举、后加速的垂直 SaaS 公司来说，Genius AI 已经跑出少见规模。客户数从 late 2021 Series A 完成时的「数万」，增长到 September 2022 约
              40,000，mid-2023 约 50,000-60,000，并在 July 2026 超过 125,000。Forbes 指出，公司已经跨过 $100M
              年经常性收入（ARR），并在平台上记录数亿次客户触点和数十亿美元年平台销售额。支付处理量在 Series B 完成时（September 2022）估计为 $2B 年化，2026
              年公司材料则称为「数十亿美元年支付量」。公司报告 2022 和 2023 年同比增速均达到三位数。

              Fast Company 将公司评为 2024 零售领域 Most Innovative Company，理由包括新功能——电子弃权书、定金和 AI 营销助手——让客户平均取消和爽约率下降
              42%。GlossGenius 于 2025 推出 Memberships and Packages，并在 2026 推出 AI Growth Analyst 产品。可得来源显示员工数已增长至约 300–378
