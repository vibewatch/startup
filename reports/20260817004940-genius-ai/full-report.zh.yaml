      - number: '8.4'
        title: 私营 SaaS 市场估值框架
        blocks:
          - type: paragraph
            body: >-
              SaaS Capital 是面向私营 B2B SaaS 公司的领先机构贷款方，并维护一套每年更新至 2026 年的估值框架。 该框架把一家公司的合理 ARR 倍数拆成三个因素：公开 SaaS 的当前 SaaS
              Capital Index（SCI）倍数、公司的 ARR 增长率，以及公司的净收入留存率（NRR）。在披露的 ~$200M 收入运行率、以及行业推断的此前几年约 60–80%
              增长（基于收入里程碑和融资时点）下，GlossGenius 落在私营 SaaS 倍数的高端层级——大约 8–15× ARR，具体取决于 NRR 质量。因此，Series D 的 11×
              倍数处在市场会给强增长公司定价的上中部。不过，缺少已确认的 NRR 数据， 仍留下显著不确定性。作为参照，SaaS Capital 调研中 2025 年 SaaS 公司增长率中位数为 25%，显著低于
              GlossGenius 的隐含增长。如果按同业中位增长率且没有 NRR 溢价，合理倍数会压缩到 5–7× ARR，对应 $500–700M 估值，较 Series D 价格有明显折价。因此，基准情景假设
              GlossGenius 继续跑赢私营 SaaS 中位数，并靠持续 30%+ 增长和高于 115% 的 NRR 支撑溢价倍数。
