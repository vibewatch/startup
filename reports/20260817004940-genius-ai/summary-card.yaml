  topStrengths:
    - >-
      Real scale in a focused vertical: public sources support 125,000+ businesses, billions in annual payment volume,
      and a revenue run-rate approaching $200M.
    - >-
      Product breadth is unusual for the segment, spanning booking, payments, POS, CRM, payroll, AI reception, AI
      marketing, and embedded finance in one workflow.
    - >-
      Founder-led execution and a July 2026 Lux-led Series D provide evidence that the platform has expanded from beauty
      SaaS into a broader service-business AI story.
  topRisks:
    - >-
      Public disclosure remains thin on gross margin, burn, runway, customer concentration, NRR, and logo churn, which
      limits underwriting confidence.
    - >-
      The customer base still centers on small and mid-sized service businesses, which can be cyclical, churn-prone, and
      sensitive to consumer-spending slowdowns.
    - >-
      Competitive pressure from Mindbody, Boulevard, Fresha, Vagaro, Square Appointments, and other vertical SaaS
      vendors can compress pricing and weaken differentiation.
    - >-
      Embedded-payments dependence and support / reputation issues create margin, trust, and operational risk if payment
      disputes or service failures rise.
  unresolvedGaps:
    - >-
      Exact current revenue composition between SaaS subscription, payment processing, payroll, lending, and newer AI
      products is not public.
    - >-
      Net revenue retention, logo churn, cohort quality, and customer mix across solo, team, medspa, wellness, and
      health-adjacent segments remain undisclosed.
    - >-
      The detailed Series D cap table, board rights, liquidation preferences, and investor-control terms are not
      available in public sources.
    - >-
      No public record cleanly reconciles current profitability, gross margin, and cash burn after the July 2026 rebrand
      and financing.
