companyProfile:
  summary: >-
    Genius AI, formerly GlossGenius, is a New York-based software and payments platform for
    appointment-led service businesses. Its flagship GlossGenius product bundles booking, payments,
    point of sale, client management, marketing, payroll, and newer AI-led tools such as Reception
    and Growth Analyst for salons, spas, medspas, wellness studios, health-adjacent practices, and
    other in-person operators. July 2026 public disclosures place the company at more than 125,000
    businesses, more than $125 million in capital raised, and a revenue run-rate approaching $200
    million, while leaving margin quality, retention, and cap-table economics substantially opaque.
