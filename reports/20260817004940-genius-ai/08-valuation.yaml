chapter:
  number: 8
  title: Valuation
  summary: 'GlossGenius closed a $44 million Series D in July 2026 at $49.00 per share, implying a $1.15 billion post-money
    valuation and approximately 11× its reported $100 million-plus ARR. Secondary market pricing (Nasdaq Private Market, $44.54/share
    in May 2026) reflects a ~9% discount to the round price, signaling limited near-term liquidity but no material mark-down.
    Public vertical SaaS comps—ServiceTitan at ~6–7× EV/Revenue and a 70% gross margin, Toast at ~2.4× P/S—bracket a fair
    value range of $900M–$1.4B in a base case at continued 25–40% ARR growth to $180M by 2028. The 11× entry multiple is achievable
    but leaves limited margin of safety: a growth deceleration to sub-20% or meaningful multiple compression would impair
    returns at the $1.15B entry.'
sections:
- id: section-1
  title: Investment Recommendation and Summary
  body: 'GlossGenius warrants a conditional positive investment signal at the Series D valuation of $1.15 billion, subject
    to diligence confirmation of gross margin, net revenue retention, and the ARR growth bridge. The company has reached a
    critical scale milestone—~$200M revenue run-rate, 125,000+ business customers, and unicorn status—with a capital-efficient
    trajectory of only >$125M total raised. The valuation implies an ~11× ARR multiple, which is within range for high-quality
    vertical SaaS with strong gross margins but demands sustained 30%+ growth and NRR above 115% to justify the price. The
    secondary market discount of roughly 9% is within normal range for late-stage private companies and does not signal distress.
    The main risk to the thesis is insufficient gross margin disclosure: if payments revenue (at ~26% gross margin per Toast
    comps) represents more than 40% of total revenue, the blended margin and hence the justified ARR multiple compress materially.
    Full diligence confirmation of revenue composition, net retention, and the cap table is required before a final investment
    decision. A holding period of 3–5 years with an exit via IPO or strategic M&A is the most plausible path to a positive
    return. The bull case targets a 2× or better return from current valuation; the base case delivers roughly 1.3×; the bear
    case implies a loss.'
