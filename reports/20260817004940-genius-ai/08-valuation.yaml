- id: section-4
  title: Private SaaS Market Valuation Framework
  body: 'SaaS Capital, the leading institutional lender to private B2B SaaS companies, maintains a valuation framework updated
    annually through 2026. The framework calculates a company''s justified ARR multiple as a function of three factors: the
    current SaaS Capital Index (SCI) multiple for public SaaS, the company''s ARR growth rate, and the company''s net revenue
    retention (NRR). At reported ~$200M revenue run-rate and industry-implied growth of approximately 60–80% in the years
    prior (based on revenue milestones and funding timing), GlossGenius falls in the premium tier of private SaaS multiples—roughly
    8–15× ARR depending on NRR quality. The Series D 11× multiple is therefore at the upper midpoint of what the market would
    assign to a company with strong growth. However, without confirmed NRR data, a significant degree of uncertainty remains.
    For context, the 2025 median SaaS company growth rate in the SaaS Capital survey was 25%, substantially below the implied
    growth of GlossGenius. At a peer median growth rate with no NRR premium, the justified multiple compresses to 5–7× ARR,
    implying a valuation of $500–700M—a meaningful discount to the Series D price. The base case, therefore, assumes GlossGenius
    continues to outperform the private SaaS median and justifies a premium multiple through sustained 30%+ growth and NRR
    above 115%.'
  claimRefs:
