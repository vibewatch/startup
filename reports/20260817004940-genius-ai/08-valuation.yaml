  - TV006
  figureRefs: []
- id: section-8
  title: Valuation Conclusion
  body: 'GlossGenius''s $1.15 billion Series D valuation is within a defensible range given its ~$200M revenue run-rate milestone
    and vertical SaaS market leadership, but the 11× implied multiple offers limited margin of safety relative to ServiceTitan''s
    6–7× EV/Revenue and the Damodaran software median P/S of 9×. The secondary market premium commands caution: a 9.1% discount
    to the Series D PPS, while modest, confirms that no secondary market has emerged willing to pay up to the round price.
    The base case IRR of roughly 8–12% over a 5-year hold is insufficient for a typical venture return target; only the bull
    case (2× return) represents a venture-grade outcome. Whether the bull case is achievable depends on whether NRR, gross
    margin, and growth rate outperform the peer median—none of which can be confirmed without proprietary financial disclosure.
    The investment is therefore conditionally constructive: proceed with a term sheet conditioned on margin, NRR, and ARR
    bridge confirmation; price-protect downside by negotiating participation rights or anti-dilution provisions to limit exposure
    in the bear case. All six diligence asks must be addressed before close.'
