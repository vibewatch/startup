- id: TV005
  title: Investment Thesis vs. Anti-Thesis
  columns:
  - theme
  - bull thesis
  - bear thesis / anti-thesis
  - key diligence question
  rows:
  - - Revenue quality
    - High-margin recurring SaaS subscriptions, 125K+ paying businesses
    - Payments mix may dilute blended margin below 50%; similar to Toast's 26% gross margin trajectory
    - What is the actual SaaS subscription vs. payments revenue breakdown?
  - - Growth rate
    - Company hit ~$200M revenue run-rate—likely 60–80% CAGR during build phase
    - Growth typically decelerates at ~$200M revenue run-rate scale; SMB churn may accelerate under economic stress
    - What is the most recent 12-month ARR growth rate?
  - - Market leadership
    - Category creator in beauty/wellness vertical SaaS; brand loyalty at 125K businesses
    - Square Appointments, Fresha, and Booksy add vertically specialized features; horizontal SaaS expands
    - What is the NRR and churn rate for the core salon segment?
  - - Valuation multiple
    - ServiceTitan comps at 6–7× EV/Rev; Mindbody M&A at 13–19× ARR; 11× defensible
    - If margin mix = Toast's, justified multiple falls to 2–4× P/S; $1.15B entry implies material downside
    - What is the audited gross margin by revenue stream?
  - - Exit path
    - IPO candidate (cloud-native, ~$200M revenue run-rate, unicorn); M&A interest from large enterprise SaaS or PE
    - IPO market conditions uncertain in 2026; PE overhang from prior rounds; illiquid secondary market
    - What is management's targeted exit timeline and preferred path?
  notes: Thesis and anti-thesis items represent the primary debates among investors. The weight of evidence favors the thesis
