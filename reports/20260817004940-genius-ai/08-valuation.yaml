  title: Investment Decision Logic — GlossGenius Series D
  type: flow
  layout: wide
  summary: Logical flow from entry conditions through key diligence gates to investment decision outcomes, illustrating the
    conditional-positive recommendation structure.
  data:
    nodes:
    - id: entry
      label: Series D Entry
      description: $1.15B post-money; $49/share; $44M raised; Jul 2026
    - id: diligence-gate
      label: Diligence Gate
      description: Gross margin ≥65%, NRR ≥115%, ARR growth ≥30%, cap table review
    - id: pass-gate
      label: Diligence Passes
      description: Margin, NRR, and ARR bridge confirm base or bull case; proceed with term sheet
    - id: fail-gate
      label: Diligence Fails
      description: Gross margin <50%, NRR <105%, or ARR deceleration evidence; reprice or pass
    - id: bull-outcome
      label: Bull Outcome (2× return)
      description: $250M ARR × 10× = $2.5B exit; 2028 IPO or strategic M&A
    - id: base-outcome
      label: Base Outcome (1.3× return)
      description: $180M ARR × 8× = $1.44B exit; 2029 timeline; single-digit IRR
    - id: bear-outcome
      label: Bear Outcome (loss)
      description: $130M ARR × 5× = $650M; below $1.15B entry; impairment
    edges:
    - from: entry
      to: diligence-gate
      label: conduct diligence
    - from: diligence-gate
      to: pass-gate
      label: all gates clear
    - from: diligence-gate
      to: fail-gate
      label: one or more gates fail
    - from: pass-gate
      to: bull-outcome
      label: high-growth path
    - from: pass-gate
      to: base-outcome
      label: consensus path
    - from: pass-gate
      to: bear-outcome
      label: growth deceleration
