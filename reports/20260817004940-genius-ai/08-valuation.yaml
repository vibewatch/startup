- id: section-7
  title: Thesis-Break Triggers and Key Diligence Asks
  body: 'Three conditions would materially impair the investment thesis and force a reassessment of entry price: (1) Gross
    margin below 50% at blended level—if confirmed by audited financials, the ARR multiple must be rebased to 5–7× rather
    than 10–12×, implying a maximum supportable valuation of $500–700M. (2) NRR below 110%—sustained sub-NRR performance indicates
    GlossGenius is not expanding in existing accounts at a rate sufficient to offset churn, implying ARR growth decelerates
    faster than modeled. (3) Evidence of competitive share loss to Square Appointments, Fresha, or Booksy at the sub-$30/month
    price point that drives initial acquisition. Conversely, the thesis is confirmed if audited financials show NRR above
    115%, gross margin above 65%, and ARR growth of 35%+ on a rolling 12-month basis as of July 2026. The six
    open diligence asks listed in the following section represent the minimum information set required for a defensible investment
    decision. Without addressing at least the first four—margin breakdown, NRR, ARR bridge, and cap table—the investment cannot
    be underwritten with high confidence.'
  claimRefs:
  - CV013
  - CV023
  - CV033
  - CV036
  - CV045
