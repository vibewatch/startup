- id: section-3
  title: Unit economics and margin structure
  body: 'GlossGenius has not publicly disclosed gross margin, net revenue retention, customer acquisition cost, or lifetime
    value figures. The following characterization is constructed from structural analysis of the pricing and competitive data
    available.

    The subscription segment carries SaaS-typical gross margins, likely in the 70–80% range after hosting, support, and product
    costs. The payments segment operates at materially lower gross margins: GlossGenius charges 2.6% on all transaction types
    (card-present, tap-to-pay, card-on-file, and manual entry), but the underlying interchange cost to the payment facilitator
    for a mix of card-present and card-not-present beauty transactions is estimated at 1.5–1.9%. After interchange, card network
    fees, and payment processor costs, the net payments margin is likely 0.6–1.1%—or roughly 23–42% gross margin on the payments
    revenue line. This is consistent with embedded-fintech economics at this scale.

    Blended gross margin across the two pillars—weighted toward the higher-margin SaaS component—is estimated at 55–70%. This
    is below the 75–85% median for pure-play vertical SaaS companies but above the 20–35% gross margin typical of pure payment
    processors. The company''s capital-efficient growth (reaching ~$200M revenue run-rate on more than $125M total invested)
    implies strong unit economics even if the exact figures are unavailable. The absence of an outbound sales team is a structural
    CAC advantage: customer acquisition through product-led virality and social-booking integrations is significantly less
    expensive than quota-carrying field sales. Net revenue retention cannot be verified; the claim that customers achieve
    "65% more revenue using GlossGenius Payments" reflects customer-side revenue improvement, not GlossGenius NRR.

    The payroll and capital advance products provide incremental ARPU without proportional cost increases once the underlying
    infrastructure is built. The payroll stack ($40/month base plus $6/seat) is likely partly pass-through to a third-party
    payroll engine, compressing margin on that product line.

    '
