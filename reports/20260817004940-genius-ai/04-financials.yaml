callouts:
- calloutType: risk
  title: Undisclosed Series D investors are a governance diligence blocker
  body: Forge Global's listing for the July 2026 Series D identifies all investors as "Undisclosed." For a $44 million unicorn
    round, the absence of named institutional investors is unusual and prevents any diligence on liquidation preference stacking,
    anti-dilution mechanics, board composition changes, and information rights held by the new investors. Until investor identities
    and the term sheet are confirmed in a data room, the governance structure post-Series D cannot be assessed.
  claimRefs:
  - CI037
- calloutType: risk
  title: BBB D- rating is a material signal for a payment and lending platform
  body: GlossGenius Inc. holds a D- rating with the Better Business Bureau, the lowest non-F grade on the BBB scale. For a
    company processing billions in annual payment volume and offering capital advances to small businesses, unresolved consumer
    complaints in financial product categories carry regulatory and reputational risk beyond what would apply to a pure-SaaS
    company. The CFPB complaint database should be specifically queried in due diligence; any active regulatory inquiries
    from state money transmitter authorities or the FTC must be confirmed or ruled out.
  claimRefs:
  - CI039
  - CI040
- calloutType: insight
  title: Capital efficiency is exceptional — ~$200M revenue run-rate on >$125M total raised
  body: 'GlossGenius reached its ~$200M revenue run-rate threshold on approximately >$125M in total capital raised across
    all rounds—an ARR-to-invested-capital ratio near 1:1 that is exceptionally rare for a vertical SaaS plus fintech business.
    This trajectory reflects the structural advantage of a product-led growth model with no outbound sales headcount, where
    payment-routing lock-in drives high retention and expansion without traditional S&M spend. The comparison benchmark: the
    median Series D SaaS company at unicorn valuation typically has raised 2–4x its ARR in total venture capital.'
  claimRefs:
  - CI030
  - CI019
