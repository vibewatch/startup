  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Exact current ARR (by stream), gross margin by segment, net revenue retention, customer acquisition cost,
      and lifetime value are all private and unavailable from public sources. The Forbes ~$200M revenue run-rate figure is
      a threshold disclosure, not a precise or recent figure.
    whyItMatters: 'These are the primary metrics driving the investment thesis: ARR multiple at $1.15B valuation (approx.
      10–11x) cannot be confirmed without exact ARR, and the path to profitability or exit cannot be modeled without gross
      margin and NRR.'
    diligencePath: Request full data room with audited P&L, ARR waterfall by segment, NRR cohort analysis, CAC model by channel,
      and management-prepared financial model with 24-month forecast.
    relatedQuestionRefs:
    - QI001
    - QI002
    - QI003
    - QI004
    - QI006
    - QI007
    - QI018
    - QI019
    - QI028
    - QI030
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Series D investor identities are not disclosed. Full capitalization table, term sheet, liquidation preferences,
      anti-dilution provisions, redemption rights, and board-seat changes associated with the July 2026 unicorn round are
      not publicly available.
    whyItMatters: Governance post-Series D cannot be assessed; participating-preferred or full-ratchet anti-dilution terms
      can materially alter common-equity economics at exit. Unknown investors also prevent any conflict-of-interest analysis.
    diligencePath: Require full cap table, Series D term sheet, and investor identity disclosure as part of data room; confirm
      new board appointments and any side letters or side agreements.
    relatedQuestionRefs:
    - QI012
    - QI013
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Monthly and annual burn rate, cash position, and runway are unconfirmed. The company may be near-breakeven
      at ~$200M revenue run-rate (which would dramatically extend runway) or still loss-making; no public disclosure resolves
      this ambiguity.
    whyItMatters: Runway uncertainty has a ±12-month range in the modeled estimate. If burn exceeds $35M/year, the next financing
      round may be required within 12 months of the Series D, with associated dilution and down-round risk in a volatile private-market
      environment.
    diligencePath: Obtain bank statements, latest board-approved budget, and cash flow statement; confirm presence or absence
      of any credit facility, line of credit, or venture debt associated with the Series D.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI026
    - QI027
    relatedTableRefs:
    - TI005
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: The BBB D- rating source documents the rating but does not enumerate the specific complaints underlying
      it. CFPB complaint database records, state money-transmitter licensing filings, and FTC enforcement records for GlossGenius
      were not directly confirmed in public research.
    whyItMatters: For a company that processes billions in annual payment volume and offers capital advances, regulatory exposure
      in payment facilitation and embedded lending is a material diligence item that a D- BBB rating alone is insufficient
      to characterize.
    diligencePath: Search CFPB complaint database at consumerfinance.gov/data-research/consumer-complaints; query state MSB
      licensing registries in New York, California, and Texas; confirm FDIC-insured custodial account structure for merchant
      funds.
    relatedQuestionRefs:
    - QI022
    - QI023
    - QI029
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: GlossGenius's capital advance portfolio—book size, delinquency rate, loss provisions, APR equivalent,
      and funding mechanism—is entirely absent from public disclosure.
    whyItMatters: Embedded lending creates credit risk not reflected in the SaaS-multiple valuation framework. If the advance
      book is material (>$20M outstanding), undisclosed losses could impair the financial picture significantly; if it is
      small, it is an upside optionality item.
    diligencePath: 'Request full capital advance portfolio: outstanding balance, monthly origination volume, 30/60/90-day
