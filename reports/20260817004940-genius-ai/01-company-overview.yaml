  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Exact current ARR, gross margin, net revenue retention, and burn rate are not publicly disclosed by GlossGenius
      as a private company.
    whyItMatters: Without confirmed ARR and margin data, valuation multiples and unit economics cannot be verified. The $1.15B
      Series D valuation implies an ARR multiple that cannot be assessed without exact revenue.
    diligencePath: Request full financial model and audited statements in a data room; seek management discussion of ARR trajectory,
      margin structure, and path to profitability.
    relatedQuestionRefs:
    - QO009
    - QO015
  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: Series D investor identities and post-Series D cap table ownership percentages are not publicly disclosed.
      Forge Global describes the round but names only "Undisclosed Investors."
    whyItMatters: Unidentified investors mean governance, information rights, liquidation preferences, and any redemption
      or anti-dilution mechanics cannot be assessed from public sources.
    diligencePath: Obtain full cap table and Series D term sheet; confirm investor identities, pro-rata rights, board-seat
      commitments, and any participating-preferred terms.
    relatedQuestionRefs:
    - QO003
    - QO006
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: No public sources confirm the existence or absence of regulatory investigations, payment-fraud enforcement
      actions, or financial services licensing disputes related to GlossGenius's payment processing and embedded lending activities.
    whyItMatters: GlossGenius processes billions in annual payment volume and offers capital advances up to $250K. Regulatory
      exposure in payment facilitation, money-service licensing, and consumer lending is a material diligence item.
    diligencePath: Search CFPB complaint database, state financial regulator records, and FinCEN public data for any GlossGenius
      enforcement actions; request compliance certifications in due diligence.
    relatedQuestionRefs:
    - QO022
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Series D investor names are not public; Forge Global listed only "Undisclosed Investors." The full investor
      syndicate for the most recent unicorn round cannot be enumerated from public sources.
    whyItMatters: Incomplete investor attribution reduces confidence in the stakeholder map for downstream governance and
      conflict-of-interest analysis.
    diligencePath: Confirm lead investor identity and any new board appointments associated with the Series D round.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: competition
    missingEvidence: No head-to-head pricing and feature comparison between GlossGenius and Booksy, Mindbody, Square Appointments,
      or Vagaro was found in the fetched source set.
    whyItMatters: Without a direct competitive comparison, pricing positioning and feature differentiation claims cannot be
      independently verified; this is important context for market-analysis chapters.
    diligencePath: Obtain pricing pages and feature matrices for Booksy, Mindbody, and Square Appointments; conduct structured
      feature comparison for the market analysis chapter.
    relatedQuestionRefs:
    - QO026
    - QO027
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Full GlossGenius leadership org chart below the C-suite is not publicly available. VP and director-level
      titles, function-level headcount, and reporting structures are not disclosed in any fetched public source.
    whyItMatters: An incomplete leadership table elevates key-person dependency risk and limits analysis of functional coverage
      depth and management bench strength below the founding team.
    diligencePath: Request a current org chart with headcount by function from the company's data room during formal diligence.
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: customers
    missingEvidence: Breakdown of GlossGenius's 125,000+ customers by vertical sub-segment (salons, spas, medspas, wellness
      practices, etc.) with customer counts per segment is not publicly disclosed.
    whyItMatters: Without vertical segment data, it is impossible to assess concentration risk, cohort quality differences,
      or the strategic importance of any single segment to overall revenue.
    diligencePath: Request customer count and ARR by vertical segment from the company's diligence data room.
    relatedQuestionRefs:
    - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: Internal product launches, unreported strategic partnership announcements, non-public financial threshold
      crossings, and adverse events not covered in press are excluded from the milestone table because they are unavailable
      in public sources.
    whyItMatters: A partially complete milestone chronology may omit adverse or governance events that are material for downstream
      risk and valuation chapters.
    diligencePath: Obtain a complete chronological product and business history from company management in the diligence data
      room; cross-reference with legal and compliance disclosures.
    relatedTableRefs:
    - TO004
