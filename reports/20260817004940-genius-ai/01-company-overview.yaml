- id: section-4
  title: Scale, traction, and key milestones
  body: 'Genius AI has built scale unusual for a bootstrapped-then-accelerated vertical SaaS company. From "tens of thousands"
    at the Series A close in late 2021, customer count grew to approximately 40,000 by September 2022, approximately 50,000-60,000
    by mid-2023, and exceeded 125,000 by July 2026. Forbes noted that the company had crossed $100M in ARR and
    records hundreds of millions of client touchpoints and billions of dollars of annual platform sales on the platform. Payment
    processing volume, estimated at $2B annualized at Series B close (September 2022), is described in 2026 company materials
    as "billions in annual payment volume." The company reported triple-digit year-over-year growth in both 2022 and 2023.

    Fast Company''s recognition as a Most Innovative Company in retail for 2024 cited new features—digital waivers, deposits,
    and an AI marketing assistant—that reduced cancellation and no-show rates by an average of 42% across customers. GlossGenius
    added Memberships and Packages in 2025 and launched its AI Growth Analyst product in 2026. Employee headcount has grown
    to approximately 300–378 per available sources.

    '
