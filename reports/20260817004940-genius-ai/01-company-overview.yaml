- id: section-5
  title: Product overview and platform scope
  body: 'The GlossGenius platform is a vertically integrated operating system for appointment-based businesses. Core modules
    include online booking (with Instagram and Google integrations), a mobile point-of-sale with Tap & Go ($49) and Pro Reader
    ($299/$349) hardware options, client management and history, SMS and email marketing, payroll and staff scheduling, digital
    forms and waivers, inventory management, and embedded financing. Memberships and Packages launched in 2025 and the AI
    Growth Analyst debuted in 2026. Payment processing offers same-day payouts and business capital advances between $1,000
    and $250,000.

    Third-party reviewers note the platform''s strengths in mobile-first UX, integrated card reader, social booking integrations,
    and flat-rate pricing predictability. Identified limitations include the absence of a free entry-level tier, constrained
    multi-location team management, and historically limited AI booking automation relative to some newer entrants. The App
    Store rating of 4.5 out of 5 from 3,800+ reviews and a 4.5 Capterra score suggest strong practitioner satisfaction at
    the individual-operator level.

    '
  claimRefs:
  - CO026
  - CO027
  - CO028
  - CO029
  - CO036
  - CO037
- id: section-6
  title: Recognition, headwinds, and adverse signals
  body: 'Genius AI / GlossGenius has accumulated meaningful industry recognition: Fast Company Most Innovative Companies 2024
    (retail), Forbes Cloud 100, Forbes Fintech 50, Inc Female Founders 100, and Inc Best Workplaces. Fast Company''s 2024
    piece called out the company having signed up more salons than there are Starbucks in the US, and cited the founders''
    combination of Princeton education, Goldman Sachs financial discipline, and hands-on beauty-industry domain knowledge
    as a differentiated founding profile.

    Against this, the Better Business Bureau gave GlossGenius a D- rating as of July 2026—the second-lowest possible
    score—primarily reflecting a pattern of unresolved consumer complaints centered on payment processing disputes, account
    closures without warning, and slow customer service response times. The SchedulingKit and JustUseApp review aggregators
    independently corroborate these themes: users praise the product functionality but report frustration with support escalation
    paths. These signals are material for enterprise or multi-location operators who require guaranteed uptime and SLA-backed
    service, and the gap between product ratings and BBB standing is a diligence item for downstream commercial and risk chapters.

    '
  claimRefs:
  - CO031
  - CO032
  - CO035
  - CO036
  - CO038
