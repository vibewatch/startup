- id: section-2
  title: Founders, leadership, and board
  body: 'GlossGenius was co-founded by twin sisters Danielle Cohen-Shohet (CEO) and Leah Cohen-Shohet (Chief Business Officer).
    Danielle graduated summa cum laude from Princeton University, where she also worked as a freelance makeup artist whose
    client-management friction became the direct inspiration for GlossGenius. After Princeton she joined Goldman Sachs as
    a financial analyst, then left to build GlossGenius full-stack. She is a Techstars alum and participated in the Sephora
    Accelerate program. Leah, also a Princeton graduate, serves as CBO and is equally recognized in Inc Female Founders 100
    coverage of the pair.

    The current executive team as of 2026 includes Christopher Cunningham as Chief Technology Officer, Jed Cullen as Chief
    Financial Officer, and Karim Butt listed as co-founder in Nasdaq Private Market filings. The board of directors comprises
    Danielle Cohen-Shohet, Leah Cohen-Shohet, Kent Bennett (partner at Bessemer Venture Partners and the lead investor on
    the Series A), and Ian Friedman (L Catterton), reflecting the principal institutional investors. The team built its first
    five years largely without professional sales staff, validating the business on organic product-market fit before accepting
    institutional capital.

    '
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
