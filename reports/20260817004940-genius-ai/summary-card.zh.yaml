  topStrengths:
    - 聚焦垂直领域却已有真实规模：公开来源支持 125,000+ 商家、数十亿美元年支付额，以及接近 $200M 的收入运行率。
    - 产品宽度在该细分市场并不常见，一个工作流里覆盖预约、支付、POS、CRM、薪资、AI 接待、AI 营销和嵌入式金融。
    - 创始人主导执行，加上 2026 年 7 月 Lux 领投的 Series D，证明平台已从美业 SaaS 扩到更宽的服务业 AI 叙事。
  topRisks:
    - 毛利率、烧钱速度、现金跑道、客户集中度、NRR 和 logo 流失披露仍薄，限制了承销信心。
    - 客户群仍以中小服务商家为中心，周期性更强、流失更容易，也更容易受消费放缓影响。
    - Mindbody、Boulevard、Fresha、Vagaro、Square Appointments 等垂直 SaaS 厂商的竞争，可能压低定价并削弱差异化。
    - 嵌入式支付依赖叠加支持 / 口碑问题，一旦支付争议或服务故障上升，就会放大毛利、信任和运营风险。
  unresolvedGaps:
    - SaaS 订阅、支付处理、薪资、借贷和新 AI 产品之间的当前收入构成，外界仍看不到。
    - 净收入留存、logo 流失、队列质量，以及 solo、团队、medspa、wellness 和医疗相邻细分里的客户结构仍未披露。
    - Series D 的详细股权结构表、董事会权利、清算优先权和投资人控制条款，公开来源里都没有。
    - 2026 年 7 月更名和融资之后，当前盈利能力、毛利率和烧钱速度之间的关系，公开记录没有清楚对上。
