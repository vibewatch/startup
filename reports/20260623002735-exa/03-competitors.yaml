- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - mitigation / diligence ask
  rows:
  - - Proprietary web-index quality
    - Brave, Perplexity, and Google all pair search with current-answer workflows while SerpAPI broadens engine access
    - high
    - Request independent relevance and latency benchmarks across Exa, Brave, Tavily, Perplexity, and SerpAPI on the target workload
  - - Agent-native workflow wedge
    - Tavily and Perplexity are both moving from raw search toward research or agent orchestration surfaces
    - high
    - Verify how often Exa wins because of workflow depth versus because of base search quality
  - - Enterprise trust differentiation
    - Brave, SerpAPI, Glean, Google, and Elastic all publish compliance, SLA, or governance claims
    - medium-high
    - Map closed-won deals by trust requirement and ask for audit-scope comparisons, not just certification logos
  - - Developer distribution via SDKs and MCP
    - OpenAI-compatible and any-search-API abstractions make rewrites lighter than in classic SaaS
    - high
    - Measure cohort retention by SDK or MCP entry path and identify where second-source vendor adoption begins
  - - Vertical extensions such as company search
    - Google, Glean, Elastic, and internal build can satisfy many owned-data or enterprise-graph use cases without matching Exa’s exact product shape
    - medium
    - Test whether company search materially changes win rates outside GTM and market-research workflows
  - - Price transparency and self-serve motion
    - Brave, Perplexity, SerpAPI, and legacy Google pricing all create reference prices for buyers
    - high
    - Obtain realized pricing, discounting, and gross-margin data before assuming Exa can hold premium economics
  - - Incumbent platform bundles
    - Google Grounding and enterprise-search platforms can hide retrieval inside a larger AI, cloud, or workflow budget
    - high
    - Track when Exa is evaluated as a line item versus when it is displaced by a bundle the buyer already approved
  notes: >-
    Severity is an underwriting judgment based on public evidence about substitution pathways, not a company-disclosed internal risk register.
