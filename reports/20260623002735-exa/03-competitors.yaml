chapter:
  number: 3
  title: Competitors
  summary: >-
    Exa has a real direct-peer set in Tavily, Brave Search API, SerpAPI, and Perplexity Sonar, but the larger threat comes from substitutes that make search a component inside broader enterprise or cloud workflows. Exa’s moat is strongest where buyers need live web retrieval plus code, company, and agent-native tooling together; it is weakest where bundle power, public price transparency, and multi-homing make retrieval swappable.
sections:
- id: section-1
  title: 'Landscape: direct API peers, grounded incumbents, enterprise-search substitutes, and internal build'
  body: >-
    Exa’s direct peer set is narrow but very real. Tavily, Brave Search API, SerpAPI, and Perplexity Sonar all sell developer-facing ways to bring current web context into AI products, and all four now extend beyond plain results into richer agent or answer workflows. Tavily packages search, extraction, research, and crawling in one API; Brave sells an independent index with answer generation and OpenAI-compatible surfaces; SerpAPI competes on breadth of engines and wrapper convenience; and Perplexity packages search with answer generation and source control.


    The substitute set is broader than the direct-peer set. Google’s legacy Custom Search API is shrinking, but Google is simultaneously raising the bar through Grounding, Agent Search, and broader Gemini platform tooling. Glean, Algolia, and Elastic approach the job from inside the enterprise boundary rather than from a live public-web index, which makes them credible substitutes whenever the budget owner values permissions, owned data, or existing deployment footprint more than open-web recall. Internal build is also viable because orchestration layers like LangChain already let teams swap models and retrieval backends without committing to one vertically integrated vendor forever.
