- id: TP003
  title: Pricing / packaging comparison
  columns:
  - vendor
  - public entry price / unit
  - contract model
  - public inclusions
  - public unknowns
  - implication
  rows:
  - - Exa
    - $7 per 1k Search requests; $12 Deep Search; $15 Deep-Reasoning; Agent from $0.012/request
    - Usage-based credits + enterprise custom
    - Search, contents, monitors, answer, and agent tooling
    - Realized enterprise discounts and committed-spend floors are not public
    - Transparent enough for developers, but not clearly the cheapest direct peer
  - - Tavily
    - Free 1,000 credits/month; PAYG $0.008 per credit
    - Credit-based self-serve + enterprise custom
    - Search, research, and related API usage
    - Credit-to-workload translation by endpoint is not fully public in one normalized card
    - Easy trial lowers switching cost for early-stage teams
  - - Brave Search API
    - $5 free monthly credits; Answers $4 per 1k requests + token charges
    - Self-serve + enterprise custom
    - Independent index, answer layer, citations, OpenAI SDK compatibility
    - Exact normalized cost for every search endpoint or storage right varies by plan
    - Low public entry pricing increases comparison pressure on Exa
  - - SerpAPI
    - Free 250 searches/month; $25/1k; $75/5k; $150/15k; $275/30k
    - Monthly self-serve plans + enterprise custom
    - Engine breadth, ZeroTrace, SLA-backed enterprise upsell
    - Comparability to independent-index quality is not explicit in pricing alone
    - Simple self-serve ladder is attractive when breadth matters more than recall quality
  - - Perplexity
    - $5 per 1k Search API requests; Sonar and Agent API priced separately by tokens and tools
    - Token-based API pricing + direct provider pass-through
    - Raw search, Sonar answer models, Agent API tools, MCP, OpenAI compatibility
    - Enterprise discounts and actual blended cost per answered task remain opaque
    - Strong option for buyers who want search and answer generation together
  - - Google Custom Search
    - $5 per 1k queries up to 10k/day for existing customers only
    - Legacy pay-as-you-go API
    - 100 free queries/day and standard monitoring
    - Unavailable to new customers and closing in 2027
    - Legacy low-cost pricing is less relevant than Google’s broader grounding bundle
  - - Algolia / Elastic / Glean
    - Mostly custom or workload-based pricing; Algolia exposes request and crawl charges while Glean is custom
    - Sales-led contracts or cloud metering
    - Owned-data relevance, analytics, governance, or hosted platform features
    - No like-for-like public cost card for enterprise deployments
    - These substitutes compete on broader workflow or data-stack ROI, not raw search-call price
  notes: >-
