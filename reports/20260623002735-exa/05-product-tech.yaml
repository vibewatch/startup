- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - Status
  - Scope
  - Gap
  rows:
  - - SOC 2 Type II
    - Documented
    - Organization-level security control framework referenced from security docs
    - Public materials do not themselves enumerate control exceptions, audit dates, or customer-facing SLA terms
  - - Zero Data Retention
    - Available on enterprise plans
    - Enterprise commercial/security option for qualifying buyers
    - Default behavior for non-enterprise query paths still requires policy review
  - - HIPAA mode
    - Available only for enabled enterprise teams
    - Constrained to eligible /search and /contents requests with compliant processor path and fail-closed rules
    - Not a blanket platform-wide compliance claim; livecrawl, summaries, and deep paths are excluded
  - - Privacy policy for query data
    - Documented
    - Users are told not to submit personal information, but query data may improve products and train/fine-tune models
    - Enterprises need contractual confirmation of retention/training treatment for their exact SKU and workflow
  - - Public status page
    - Operational signal visible
    - Websets and Exa MCP showed operational with 100% uptime at fetch time
    - Snapshot status is weaker than published SLA/SLO history or incident postmortem discipline
  - - Trust center / enterprise documentation
    - Available through Exa trust center and sales motion
    - Supports diligence conversations for DPA, security documentation, and enterprise controls
    - Key details remain gated behind sales or portal access rather than self-serve public docs
  notes: Status entries describe control surfaces visible in public documentation and explicitly flag where the buyer still needs contractual or portal-level diligence.
