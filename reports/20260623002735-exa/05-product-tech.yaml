- id: architecture-operating-model
  title: 'Architecture and operating model: custom retrieval infrastructure plus agent-oriented orchestration'
  body: 'The most important technical question is whether Exa is merely packaging third-party search or whether it owns material parts of the retrieval stack. Public evidence points to the latter. Exa’s docs and blog posts describe embeddings-based search, query-aware highlights, structured vertical indexes, and a self-built vector database optimized for billions of vectors, metadata filtering, sub-100 millisecond retrieval, and more than 500 QPS. The same material describes aggressive compression, clustering, reranking, and custom query-language stages, which is qualitatively different from simply forwarding queries to a SERP provider. The infrastructure disclosures reinforce that story: Exa says it operates an 80-A100 cluster plus a 144-H200 Exacluster, uses Kubernetes orchestration with Pulumi and Ansible, relies on NVIDIA operators for GPU and network management, and uses Alluxio with S3-backed cache semantics for large-scale training data access. Higher-level products also mirror this
    architecture. Exa Deep and Exa Agent are presented as parallel-search and subagent systems that turn retrieval into structured synthesis, while the LangChain case study describes planner-task-observer patterns and JSON-first outputs. The practical implication is that Exa’s operating model is increasingly “retrieval platform plus research orchestration,” which is technically differentiated but also more infrastructure-intensive than a thin API wrapper.'
