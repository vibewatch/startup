chapter:
  number: 5
  title: Product & Technology
  summary: 'Exa now sells more than a search endpoint: the public surface spans low-latency web retrieval, structured company search, long-running research agents, recurring monitors, webset-based enrichment, and MCP/SDK distribution for agent builders. The technical edge appears real in crawler/index design, token-efficient retrieval, custom vector infrastructure, and broad integration packaging, but enterprise diligence still lacks public SLA, deployment-topology, and default-retention transparency.'
sections:
- id: product-surface
  title: 'Product surface: Exa sells a layered retrieval and research stack, not a single endpoint'
  body: 'Exa’s public positioning has expanded from “search engine for AIs” into a broader operating stack for agent builders. The official quickstart and search guides present four core primitives—/search, /contents, /answer, and /research—then extend them into higher-order workflows such as Agent runs, Monitors, Websets, MCP distribution, and structured verticals like company search. In customer workflow terms, this means Exa can be the retrieval layer for a fast assistant, the enrichment layer for CRM or GTM software, the research layer for structured intelligence tasks, and the tool layer for assistants that prefer MCP or SDK-mediated access over direct HTTP integration. The customer examples matter because they show those surfaces in production-style workflows: OpenRouter uses Exa-backed web search as shared model-marketplace infrastructure, monday.com uses natural-language search plus structured outputs to stage CRM prospecting, and Cognition publicly says Exa powers Devin’s search
    capability. That breadth gives Exa a clearer product definition than a generic search API vendor, but it also means the product should be diligenced as a multi-module platform whose value depends on orchestration, distribution, and post-search workflow fit—not just on result relevance.'
