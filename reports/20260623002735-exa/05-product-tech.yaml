- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Exa solution
  - Measurable or claimed benefit
  - Limitation
  rows:
  - - Ground a fast assistant on live web information
    - Model answers stale questions or relies on generic browser plugins
    - Use /search with instant/fast modes and highlights
    - Published latency tiers down to ~250 ms for instant mode with grounded excerpts
    - No public benchmark on answer quality versus incumbent web plugins by domain
  - - Run deep web research with structured outputs
    - Teams orchestrate multiple searches, crawling, synthesis, and JSON formatting themselves
    - Use Deep / Agent with outputSchema and citations
    - Exa says one API call can replace complex orchestration for deep research tasks
    - Vendor-managed orchestration means less transparency into intermediate failure handling
  - - Build GTM or investment entity lists
    - Analysts combine spreadsheets, manual search, and enrichment vendors
    - Use company search or Websets with criteria verification and enrichments
    - Structured company entities and verified webset items reduce manual screening steps
    - Coverage and freshness of long-tail entities are not independently benchmarked publicly
  - - Monitor changing topics or competitors
    - Teams rerun searches manually or build cron jobs and webhook plumbing
    - Use Monitors for scheduled search plus deduped webhook delivery
    - Recurring runs surface only new content and can emit structured results
    - Public docs do not expose enterprise workflow governance or reviewer controls
  - - Stage CRM prospecting and enrichment
    - Sales teams manually research accounts and buying groups
    - monday.com case study uses Exa search to convert natural-language ICP into structured CRM records
    - Case study claims reps open pre-staged work rather than build lists manually
    - Customer proof is company-hosted and does not disclose error rates or lift metrics
  - - Embed web search inside multi-model assistants
    - Teams build provider-specific plugins for every model family
    - OpenRouter case study and MCP distribution let search travel across many model/client surfaces
    - OpenRouter reports 73M Exa-backed searches to date and server-side tool calling portability
    - Portability can also make switching away from Exa easier if retrieval quality compresses to parity
  notes: Benefits are based on public product descriptions and case studies; most do not disclose audited ROI metrics, so operational lift should be treated as directional.
