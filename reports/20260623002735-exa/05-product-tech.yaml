  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sla-and-uptime-history
    missingEvidence: A public or customer-shareable SLA/SLO document covering latency, error budgets, incident response, and historical uptime across the full hosted platform.
    whyItMatters: A point-in-time status page is not enough to underwrite production dependency for enterprise search or agent workflows.
    diligencePath: Request current SLA/MSA exhibits, status-history exports, and the last 12 months of Sev1/Sev2 incident summaries from Exa security or support teams.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: deployment-topology
    missingEvidence: Documented support for VPC, region pinning, self-hosted, or private-link style deployment options, if any exist.
    whyItMatters: Large enterprise buyers may require infrastructure isolation or region-specific deployment before approving sensitive retrieval workflows.
    diligencePath: Ask product and solutions engineering for a current deployment-options matrix, including hosted-only, private networking, data residency, and roadmap status.
    relatedQuestionRefs:
    - QE020
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: retrieval-benchmarking
    missingEvidence: Independent benchmark evidence for recall, freshness, false positives, and entity-resolution quality across Exa search and company-search surfaces.
    whyItMatters: Most quality claims in the reviewed corpus are Exa-authored and do not let an investor separate real technical edge from well-packaged marketing.
    diligencePath: Request third-party evals, customer-side bakeoff results, and methodology for company-search coverage and freshness measurements.
    relatedQuestionRefs:
    - QE013
    - QE022
    - QE024
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: default-retention-and-training-controls
    missingEvidence: Contract-level detail on retention, training exclusion, logging, and support-access behavior for each Exa SKU outside enterprise zero-retention mode.
    whyItMatters: The privacy policy explicitly permits product-improvement and model-training uses of query data, which may be incompatible with regulated or confidential workloads.
    diligencePath: Request DPA language, retention schedules, training opt-out defaults, and admin-level control documentation for the exact commercial plan under consideration.
    relatedQuestionRefs:
    - QE018
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
