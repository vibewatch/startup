  rows:
  - - Search API
    - Agent/app developer
    - GA; six search modes documented from instant to deep-reasoning
    - Semantic retrieval with latency/quality tiers, structured outputs, filters, and category surfaces
    - Need independent recall/precision benchmarking outside Exa-authored evals
  - - Contents API
    - Agent/app developer
    - GA; text, highlights, summaries, and subpage crawling documented
    - Token-efficient highlights plus freshness controls reduce downstream context cost
    - Need clearer public limits on crawl breadth, extraction failure rates, and JS-heavy edge cases
  - - Company Search
    - GTM, research, finance builders
    - GA; weekly-updated 50M+ company index with structured entities
    - Moves Exa beyond plain web search into structured company metadata and enrichment
    - Need public proof of coverage quality, entity resolution accuracy, and stale-record handling
  - - Agent / Deep Search
    - Teams needing multi-step synthesis
    - Released and actively expanded in 2026
    - Parallel search agents, structured JSON output, citations, and effort-based pricing
    - Need public throughput, failure-rate, and governance detail for long-running tasks
  - - Monitors / Websets
    - Ops, research, enrichment, GTM teams
    - GA; recurring and asynchronous workflows documented
    - Turns search into durable pipelines with criteria verification, enrichments, imports, and webhooks
    - Need more public controls for approvals, review queues, and enterprise governance
  - - MCP + SDK distribution
    - AI assistant builders and platform teams
    - GA and actively packaged across GitHub, PyPI, npm, and hosted MCP
    - Low-friction integration into Cursor, Claude, Codex, VS Code, and custom clients
    - Need clarity on versioning guarantees, backward compatibility, and tenant-isolation at MCP endpoint
  notes: Rows separate buyer-facing modules from the shared platform underneath them; maturity reflects documented public availability, not private enterprise deployment depth.
