- id: trust-security-verdict
  title: 'Trust, privacy, compliance, and technical verdict: meaningful controls exist, but they are scoped and conditional'
  body: 'Exa’s trust story is better than “AI startup with a search API,” but buyers should read the qualifiers carefully. The security documentation says Exa is SOC 2 Type II certified and points buyers to a trust center, while enterprise plans can unlock zero data retention and HIPAA support. The HIPAA documentation is specific in a useful way: compliant mode is not a blanket switch for every product path, but a gated mode for eligible teams that works only on constrained /search and /contents flows, rejects livecrawl and summary-heavy paths, and fails closed when a request needs non-HIPAA-safe processors. That precision is a positive sign because it suggests Exa is mapping controls to exact request paths rather than marketing compliance as generic platform coverage. The privacy policy creates the counterweight. It explicitly warns users not to submit personal information as query data, notes that query data can be used to improve products and train or fine-tune models, and separates business-offering
    processor data into customer agreements. For enterprise underwriting, that means Exa can support sensitive workflows, but only when the buyer is on the right plan, configured correctly, and comfortable that default query handling outside those modes fits internal policy. Technically, Exa looks differentiated; procedurally, trust and deployment still need contract-level diligence.'
  claimRefs:
