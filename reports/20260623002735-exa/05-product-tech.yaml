- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer or component
  - Role
  - Dependency
  - Risk
  rows:
  - - Search interface layer
    - Accept natural-language queries, filters, output schemas, and category selection
    - Hosted Exa API, language SDKs, and customer code quality
    - API abstraction is strong, but customers remain exposed to hosted-service availability and contract terms
  - - Content processing layer
    - Return text, highlights, summaries, and subpage crawls from URLs or search results
    - Crawler coverage, cache freshness policy, and extraction pipeline choices
    - Public docs explain controls but not global extraction success rates or regional crawl topology
  - - Structured vertical layer
    - Map search results into company or other typed entities with metadata
    - Domain classifiers, entity resolution, and vertical-specific indexing
    - Coverage/quality for long-tail companies and non-English surfaces remains hard to judge externally
  - - Agentic orchestration layer
    - Break tasks into searches, subagents, enrichments, and grounded outputs
    - Exa-managed run orchestration plus underlying model/tool routing
    - Long-running workflow correctness and budget control are partly black-box outside Exa-authored examples
  - - Retrieval core
    - Compute embeddings, search vectors, apply metadata filters, and rerank results
    - Custom vector DB, inverted indexes, clustering, reranking pipeline
    - Architecture appears differentiated but may be capital-intensive and difficult to audit without internal metrics
  - - Training and infra layer
    - Train retrieval models and run large-scale indexing workloads
    - Exacluster, Kubernetes, NVIDIA operators, Alluxio, S3-backed cache semantics
    - Heavy GPU/datacenter footprint can strengthen moat while increasing fixed-cost and ops complexity
  notes: The table mixes documented architecture with explicit diligence risks where public materials stop short of operational or benchmark-grade disclosure.
