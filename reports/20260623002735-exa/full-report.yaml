  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Adjacent Spend
        blocks:
          - type: paragraph
            body: >-
              Exa belongs to a narrower market than generic 'search' or even generic 'AI infrastructure.' Its own
              materials describe a public-web retrieval stack for agents: search, crawling, extraction, cited answers,
              and MCP-based distribution into developer tools. That means the relevant spend is the money developers and
              enterprise AI teams use to connect agents to fresh public-web information and turn those results into
              usable context. Several adjacent pools are tempting but misleading. Glean and Elasticsearch sell
              internal-knowledge and private-data retrieval; Algolia sells commerce and site-search optimization; all
              matter as substitutes or comparison points, but they do not directly measure Exa's core revenue pool.
              Google Custom Search remains a legacy substitute, yet Google says it is closed to new customers and
              sunsets in 2027. The right boundary is therefore AI-native public-web retrieval infrastructure for agents,
              with internal enterprise search, advertising, browser subscriptions, and generic vector-database spend
              treated as excluded or adjacent rather than counted as core TAM.
