            body: >-
              Exa's public customer set is broad enough to segment by buyer, user, payer, and job-to-be-done rather than
              by a single “developer tools” label. One cluster is developer-native agent and coding products—Cursor,
              Cognition, OpenRouter, CodeRabbit—where the day-to-day user is a developer or AI agent, the economic buyer
              usually sits in engineering or product, and the payer is an infrastructure or software budget. A second
              cluster is GTM and CRM automation— monday.com, HubSpot, 11x, and Obvious—where end users are SDRs, AEs,
              RevOps, or AI agents acting on their behalf, while budget authority sits with revenue operations, sales
              technology, or product leadership. A third cluster is research and specialist knowledge work—Anara in
              scientific discovery and WhyHow in litigation intelligence—where information quality matters more than
              pure click-through search. A fourth cluster is enterprise agent platforms like StackAI, where Exa is
              embedded into governed, multi-step enterprise workflows such as due diligence and RFPs. Geography is less
              directly disclosed by Exa than by its customers, but HubSpot's 299,000 customers across 135 countries and
              monday.com's 250,000+ customers worldwide imply that Exa already sits inside globally distributed software
