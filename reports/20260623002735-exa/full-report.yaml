            body: >-
              Exa's expansion path is intuitive: self-serve search can grow into contents extraction, monitoring,
              asynchronous research, and eventually negotiated enterprise contracts. That path is visible in the
              customer mix itself. HubSpot layers Search and Monitors into CRM agents; OpenRouter turns Exa into shared
