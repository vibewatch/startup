      - number: '6.4'
        title: Retention and Durability
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public record thins out. No reviewed source disclosed net revenue retention, gross
              retention, churn, renewal rates, or contract duration, so the retention story has to be inferred from
              product embed and workflow behavior rather than measured directly. Positive structural signals exist. Exa
              is not just a single endpoint: customers can start with Search and expand into Contents, Monitors, Agent,
              and enterprise overlays like negotiated billing and higher-volume support. LangChain's dedicated Exa
              integration lowers developer adoption friction, while customer stories repeatedly describe Exa as part of
              the core operating loop rather than a one-off experiment. But the negative signals are also real.
              OpenRouter's architecture shows search can be a swappable engine inside larger model-routing products.
              Humai and MakerStack both argue Exa is best when semantic quality matters, but more expensive and more
              complex than alternatives for simple or high-volume lookups; both describe routing or multi-provider
              patterns that normalize multi-homing. ChatForest pushes the risk one level up, arguing the whole category
              could compress if native search inside model providers becomes “good enough.” The result is a credible but
              not fully evidenced durability case: Exa looks embedded in important customer workflows, yet public
              retention disclosure is missing and switching costs are clearly not absolute.
