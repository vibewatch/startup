      - number: '7.2'
        title: Regulatory, privacy, and intellectual-property risk
        blocks:
          - type: paragraph
            body: >-
              The most acute risk is the gap between Exa’s default product behavior and the expectations of sensitive
              enterprise workloads. The privacy policy explicitly says query data is used to improve products and
              fine-tune the models that power the service, and it also says Exa does not actively monitor query text for
              personal information. That combination is manageable for general-purpose developer search, but it is not
              naturally aligned with customers who expect default log minimization, confidential-prompt segregation, or
              clear processor-only handling. Exa’s own security documentation shows the mitigation path: SOC 2 Type II
              controls, a trust center, and enterprise-only options such as Zero Data Retention and HIPAA mode. The
              issue is that those controls are not the baseline. HIPAA mode is limited to eligible enterprise teams,
              supports only `/search` and `/contents`, rejects live retrieval and summary-heavy paths, and fails closed
              when a request would require non-compliant processing. In other words, the product can be made safer for
              regulated use cases, but the path is contractual and feature-constraining rather than universal.


              The adjacent IP and web-crawling risk is also real. Exa’s terms push responsibility for lawful user input
              onto the customer, prohibit using the service to violate IP or contractual rights, reserve audit and
              termination rights, and give Exa a broad license over user input and output to operate and improve the
              service. That does not prove a problem, but it does mean both sides are allocating legal uncertainty
              contractually. The U.S. Copyright Office’s 2025 Part 3 report says dozens of AI copyright suits are
              pending and treats training-data collection, RAG, fair use, and licensing as unresolved questions. The EU
              AI Act, meanwhile, preserves GDPR and other personal-data obligations while raising documentation and
              governance expectations around AI systems. Exa’s repeated use of outside privacy, cybersecurity, and
              copyright counsel is a positive signal, but the public record still does not let an investor verify the
              operative DPA, training-data licensing posture, or jurisdiction-specific compliance program.
            claimRefs:
