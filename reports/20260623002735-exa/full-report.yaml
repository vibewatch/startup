      - number: '1.3'
        title: Funding History and Valuation Path
        blocks:
          - type: paragraph
            body: >-
              Exa's capital history follows a fast staircase. In July 2024 the company announced $22 million of seed
              plus Series A financing, with the Series A portion reported as $17 million led by Lightspeed and joined by
              NVentures and Y Combinator. In September 2025 Exa raised an $85 million Series B at a $700 million
              valuation led by Benchmark, a round that also formalized Peter Fenton's board role and funded a larger GPU
              cluster and broader hiring. In May 2026 Exa announced a $250 million Series C at a $2.2 billion valuation
              led by Andreessen Horowitz, with existing backers Benchmark, Lightspeed, and Y Combinator also
              participating.


              That path implies roughly $357 million of disclosed lifetime capital by May 2026 and a valuation step-up
              of a little over 3x from the Series B to the Series C in under a year. The financing trajectory is
              impressive, but public-market-data services lag it unevenly: Sacra still showed only $107 million of
              funding because its snapshot stopped at Series B, illustrating how quickly third-party datasets can go
              stale in a fast-moving private company. Public sources also do not disclose debt, secondary liquidity,
              preference stack, pro-rata rights, or the full cap table, so governance and economics still require
              private confirmation despite the apparent momentum of the headline round sequence.
            claimRefs:
