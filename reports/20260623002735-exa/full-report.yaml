      - number: '3.2'
        title: 'Capability, pricing, GTM, and trust: where Exa is differentiated and where parity is rising'
        blocks:
          - type: paragraph
            body: >-
              Exa’s public product surface is unusually coherent for an AI-native search vendor. Search, contents,
              company enrichment, MCP distribution, and SDK primitives all point toward the same buying story: one
              vendor that can ground agents on the live web while also exposing structured workflows for code, company
              discovery, and deep research. That is stronger than a bare search API pitch. However, the comparison gets
              tighter once pricing and trust enter the picture. Brave’s answer stack is public, low-friction, and
              OpenAI-compatible; Perplexity makes raw search and agent-tool pricing explicit; SerpAPI exposes a simple
              self-serve ladder; and Google still lists commodity legacy search pricing even while migrating serious
              buyers toward grounding bundles.


              Trust is also not a monopoly. Exa has meaningful enterprise proof through SOC 2, zero-retention options,
              and constrained HIPAA-safe retrieval paths. But Brave, SerpAPI, Glean, Google, and Elastic each publish
              their own control surfaces, certifications, or uptime commitments. Procurement therefore looks less like a
              binary yes-or-no security review and more like a matrix tradeoff among recall quality, bundle fit,
              compliance scope, and operating cost. The result is that Exa can still stand out on product coherence and
              vertical extensions, yet teams are increasingly able to compare trust, price, and distribution across
              several acceptable alternatives instead of treating Exa as the only AI-native web-retrieval vendor in
              serious enterprise evaluations.
