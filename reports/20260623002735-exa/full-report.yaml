      - number: '7.5'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The encouraging part of Exa’s risk profile is that many of the highest-severity issues are monitorable.
              The company already exposes some of the right control surfaces: public status pages, explicit rate limits,
              enterprise security docs, a trust center, and a privacy policy that is candid enough to reveal where the
              defaults are weak. The key is to translate those disclosures into diligence asks and triggers rather than
              treating them as comfort statements. Before underwriting a growth-stage round, an investor should insist
              on the executed DPA and enterprise terms, uptime/SLA history by product surface, cloud and GPU supplier
              concentration, top-customer revenue share, gross-margin bridge, and an org chart that proves leadership
              depth below the founders.


              The thesis breaks if any one of three things happens. First, privacy and data-use controls fail to keep
              pace with enterprise adoption—for example, if regulated customers need Exa’s deepest live-retrieval
              features but can only get compliant behavior by switching those features off. Second, the company’s
              infrastructure leverage turns against it—through sustained incidents, GPU/cloud bottlenecks, or margin
              compression that forces more capital in before the revenue base is mature. Third, customer proof fails to
              diversify beyond a handful of frontier-AI workflows at the same time that incumbents embed search more
              natively. If those events do not happen, Exa can still compound as a core layer in the agent stack; if
              they do, valuation downside could be sharp because the current story already assumes category leadership.
