  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - scale/funding proxy
      - target segment
      - differentiation
      - limitation
    rows:
      - - Exa
        - Direct web-search API + agent infrastructure
        - 50M+ company index, public SDK/MCP distribution, usage-based API pricing
        - AI agents, coding assistants, GTM/market research builders
        - One stack for live web search, contents, company search, code-aware workflows, and agent tooling
        - Bundle power is weaker than Google or Glean and public trust parity is narrowing
      - - Tavily
        - Direct peer
        - Home page claims 300M+ monthly requests, 2M+ developers, 99.99% uptime, 180 ms p50
        - Developers building search, extraction, and research agents
        - Unified search + extraction + research + crawl positioning
        - Public evidence on enterprise win rates and differentiated trust scope is thin
      - - Brave Search API
        - Direct peer with independent index
        - 30B+ page independent index, 100M+ page updates/day, 50 QPS search
        - AI search, training data, RAG, citation-heavy assistants
        - Independent index, low public entry pricing, OpenAI-compatible answer layer, ZDR claims
        - Still a horizontal web index product without Exa’s company-search vertical
      - - SerpAPI
        - Direct peer / wrapper
        - Free to $275 self-serve tiers plus many engine-specific APIs and enterprise plans
        - Developers who want broad engine coverage without running SERP infrastructure
        - Breadth across Google, Maps, News, Scholar, Shopping, Amazon, and more
        - Wrapper economics and index dependence can matter when proprietary recall quality is the key differentiator
      - - Perplexity Sonar
        - Direct peer with answer layer
        - $5 per 1k raw search plus Sonar model pricing; TechCrunch cites Zoom as an early user
        - Developers who want search plus answer generation and source control in one surface
        - Search API, Sonar, Agent API, MCP, and OpenAI compatibility in one stack
        - Trust and raw-search economics still compete directly with Exa rather than protecting it from substitution
      - - Google Grounding / Custom Search
        - Incumbent bundle
        - Legacy Custom Search is closing to new customers while Grounding expands across the Gemini stack
        - Cloud and enterprise buyers already standardizing on Google
        - World-knowledge grounding, Agent Search, regulated web grounding, and bundle power
        - Custom Search is legacy and Grounding is broader platform procurement rather than a lightweight swap
      - - Glean
        - Enterprise-search substitute
        - Home page highlights 35+ models and 93% adoption in <2 years on featured deployments
        - Large enterprises focused on internal knowledge, permissions, and adoption
        - Permission-aware search, agent governance, and deep internal-system context
        - Not a public-web-native retrieval product
      - - Algolia
        - Owned-content substitute
        - Request-priced relevance stack with NeuralSearch, rules, analytics, merchandising, and crawl ingestion
        - Teams optimizing product or content discovery on owned properties
        - Strong relevance tooling and business-user controls for first-party content
        - No independent public-web index or agent-native research wedge
      - - Elastic
        - Buildable platform substitute
        - Open-source deployment options, 350+ integrations, 99.95% hosted SLA, higher-tier Agent Builder
        - Teams that want full control over retrieval, data, and deployment footprint
        - Hybrid retrieval, vector search, multi-cloud hosting, and agent features at scale
        - Requires more build effort than adopting a ready-made web-search API
      - - Internal build with LangChain + chosen search API
        - Status quo / likely entrant path
        - No fixed vendor markup beyond chosen components; orchestration already spans major model providers
        - Strong engineering teams that already own agent infrastructure
        - Maximum routing flexibility and easier multi-homing across search vendors
        - Highest integration burden and weakest out-of-the-box trust, support, and quality guarantees
