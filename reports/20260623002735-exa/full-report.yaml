  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              Exa’s risk stack is dominated by four interlocking issues rather than a single existential flaw. First,
              the company’s default privacy and IP posture is materially more permissive than many enterprise buyers
              will assume: the public privacy policy says query data can be used to improve products and fine-tune
              models, while the published security docs make Zero Data Retention and HIPAA controls enterprise-only and
              narrower than the full product surface. Second, the company’s core advantage comes from running its own
              crawl, index, vector database, and GPU fleet, which is technologically impressive but economically and
              operationally heavy. Third, public customer proof is strong but skewed toward frontier-AI builders and
              agent tooling, which raises dependency and concentration concerns even though Exa claims 5,000-plus
              companies and 400,000-plus developers. Fourth, the regulatory and copyright perimeter around AI training,
              retrieval, and web-scale content use is moving faster than the company’s public legal disclosures.


              The practical implication is that Exa is best understood as high-upside but high-operating-leverage
              infrastructure. The company has real mitigation assets—SOC 2 Type II, enterprise privacy controls, a trust
              center, and repeated outside legal counsel engagement—but those mitigations are not fully defaulted into
              the self-serve product, and the public record still lacks DPA detail, incident metrics, revenue
              concentration, margin disclosure, and leadership-depth visibility. For an investor, the right question is
              not whether Exa has product-market signal; it does. The question is whether privacy controls, legal
              hygiene, capital discipline, and dependency management are maturing as quickly as adoption and valuation.
            claimRefs:
              - CR047
