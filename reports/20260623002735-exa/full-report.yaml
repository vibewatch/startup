            body: >-
              Exa monetizes a broad menu of API primitives rather than a seat license. The public pricing surface shows
              direct charges for Search, Deep Search, Deep-Reasoning Search, Contents, Answer, and Agent runs, while
              Monitors and Websets extend the same usage logic into recurring or enrichment-heavy workflows. Self-serve
