      - number: '2.4'
        title: Growth Drivers, Constraints, and Preserved Contradictions
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers are ecosystem-level. OpenAI is making web search and agent orchestration
              standard building blocks, MCP is lowering the integration tax for external tools, and vendors such as Exa
              and Tavily are moving up the stack from raw search endpoints toward richer research workflows. At the same
              time, this remains a difficult market to size and underwrite. Consumption units differ radically across
              vendors, governance and zero-data-retention requirements can slow procurement, and internal retrieval
              stacks still compete for the same budget owner in many enterprises. Most importantly, the public corpus
              preserves direct contradictions that should not be smoothed away. Exa says it is the highest-quality
              search API at every latency and price point and the fastest search API in the world; Brave says it can
              replace smaller-index competitors like Exa and Tavily and that its grounding can outperform frontier
              answer engines; Tavily says its own search is the fastest on the market. Those contradictions are
              evidence, not noise: they show why diligence should prioritize neutral workflow benchmarks and private
              cohort economics over vendor marketing narratives.
