      - number: '8.3'
        title: Scenarios and comparable set
        blocks:
          - type: paragraph
            body: >-
              The comp set says more than the round headline. On public and semi-public proxies, Exa's price is richer
              than a wide range of better-disclosed businesses. Perplexity's 2025 private mark implied roughly 100x ARR
              with much more revenue scale disclosed. Glean's 2025 round implied roughly 72x ARR and by 2026 it was
              already reporting a $300 million run rate. Public software infrastructure names price far lower: Elastic
              sat around 3.5x market cap to revenue and Datadog around 23x. Exa at roughly 220x the last public revenue
              estimate is therefore not obviously cheap even inside a heated private AI market.


              That pushes scenario analysis toward entry discipline. In the bull case, Exa compounds fast enough to
              justify the mark with a path into nine-figure revenue while holding premium multiples. In the base case,
              growth stays strong but multiple normalization leaves little upside versus the latest round. In the bear
              case, search gets more substitutable before Exa proves margin quality, and the next financing becomes flat
              or down. The current round can work, but only if future operating proof quickly catches up with current
              investor enthusiasm.
