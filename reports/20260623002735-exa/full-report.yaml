chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Rename, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Exa is a private San Francisco AI-search infrastructure company founded in 2021 and originally launched
              under the Metaphor name before publicly rebranding to Exa in January 2024. The rename mattered because it
              marked a shift from a better-search narrative to a broader mission of organizing the world's knowledge for
              AI systems. The current product is not a consumer search destination but a search-and-retrieval layer for
              agents: Exa sells web search, content extraction, answer generation, monitors, and asynchronous research
              workflows through APIs and developer tooling.


              The operating model is usage-based infrastructure. Public pricing shows per-request charges for search
              tiers, page-content retrieval, and agent runs, while enterprise plans add negotiated controls such as
              higher limits and Zero Data Retention. Official docs and product pages consistently emphasize latency,
              semantic retrieval quality, structured outputs, and code-search support rather than advertising, which is
              important because it frames Exa as a picks-and-shovels company for the agent stack rather than a media or
              SEO business. Official legal pages also anchor the headquarters in San Francisco, while company materials
              describe a worldwide hiring footprint rather than a large, fully enumerated office network.
            claimRefs:
              - CO001
              - CO002
              - CO003
