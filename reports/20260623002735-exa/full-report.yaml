      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The gap between company quality and price quality is still bridgeable, but only with private evidence. The
              diligence agenda should focus on four questions: what revenue and ARR actually were exiting 2025 and
              entering 2026; whether gross margin improves after crawl, inference, and support costs; whether customer
              concentration and retention justify premium valuation assumptions; and where a new investor would actually
              sit in the cap stack. Without those answers, the IC risks underwriting narrative instead of economics.


              The thesis-breakers are mercifully concrete. If management cannot show a credible near-term path toward
              revenue that closes the gap with current valuation, the price should be treated as too rich. If growth is
              real but margin quality is weak, the round may still prove value-destructive. And if the next financing or
              employee liquidity event resets pricing below the Series C mark, that would signal that public traction
              claims were not enough to hold the private market. Until diligence closes those gaps, the prudent posture
              is to stay close, keep the company on the watchlist, and wait for either better evidence or a better entry
              point.
