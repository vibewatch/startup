      - number: '3.3'
        title: 'Switching cost, multi-homing, and moat durability: Exa has a wedge, but not a closed field'
        blocks:
          - type: paragraph
            body: >-
              The best public case for Exa’s moat is not search API in isolation. It is the combination of live web
              retrieval, code-aware search, structured company search, and agent-native distribution through SDKs and
              remote MCP. That package can matter for developers who want fewer vendors and faster time to a
              production-grade agent. It also gives Exa credible room to expand into adjacent vertical workflows such as
              GTM enrichment, coding, and compliance-sensitive retrieval.


              The problem is that modern AI stacks make multi-homing unusually cheap. Google Grounding can sit on top of
              any search API, LangChain abstracts core model-provider choices, and Brave plus Perplexity both present
              compatibility layers that reduce rewrite cost. Competitors are also moving up-stack: Tavily now sells
              research workflows, Perplexity sells Sonar plus agent tooling, and incumbents can hide search procurement
              inside larger enterprise bundles. Even SerpAPI changes the comparison by letting teams keep a wrapper
              layer while swapping underlying engines or vertical SERP endpoints. That means Exa’s moat looks durable
              only where its index quality and vertical extensions are materially better than peers. If buyers
              increasingly see search as a swappable component, then price compression, bundle pressure, internal-build
              optionality, and wrapper-based second sourcing all become underwriting risks rather than edge cases.
