      - number: '2.2'
        title: Sizing Lenses and Demand Signals
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports multiple sizing lenses, but not a single clean TAM. The best adjacent market
              study in the reviewed corpus is Grand View Research's enterprise-search report, which measures a $4.9
              billion market in 2023 growing toward $8.9 billion by 2030; that is useful as an outer adjacency, not as
              Exa's TAM, because it mostly counts internal knowledge retrieval and secure enterprise search. The direct
              category evidence is instead operating data and unit economics from the vendors themselves. Exa's pricing
              spans $7 to $15 per thousand search-style requests, $1 per thousand pages of content extraction, and up to
              $2 per agent run. Tavily and Brave both publish low-friction entry pricing and large-scale usage or index
              claims, while Google shows what the older programmable-search baseline looked like. Taken together, these
              lenses prove a real and growing revenue pool for public-web retrieval inside agent workflows, but they do
              not let the analyst isolate a neutral standalone SAM for Exa without internal contract, volume, or cohort
              data.
