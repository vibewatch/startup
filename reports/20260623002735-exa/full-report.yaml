  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows the chain from strong product and financing support into a weaker price-supported
      judgment.
    data:
      nodes:
        - id: n1
          label: Product and customer proof
          detail: Case studies, 5,000+ companies, 400,000+ developers.
          tone: positive
        - id: n2
          label: Financing support
          detail: $250M Series C and blue-chip investors remove near-term survival pressure.
          tone: positive
        - id: n3
          label: Operating evidence gap
          detail: Public record still lacks revenue quality, retention, margin, and cap-stack detail.
          tone: warning
        - id: n4
          label: Rich current price
          detail: ~220x the last public revenue proxy is above the comp set.
          tone: warning
        - id: n5
          label: 'Current call: track'
          detail: Follow the company closely, but do not underwrite the latest price yet.
          tone: warning
      edges:
        - from: n1
          to: n5
          label: supports interest
        - from: n2
          to: n5
          label: supports survival
        - from: n3
          to: n5
          label: blocks conviction
        - from: n4
          to: n5
          label: blocks price support
    approximationNotes: This is a decision chain, not a legal cap-table flowchart.
