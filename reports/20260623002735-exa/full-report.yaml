      - number: '7.4'
        title: Customer, financial-model, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The public adoption story is compelling, but the durability picture is still underdisclosed. Exa’s named
              customer proofs—OpenRouter, Cognition, monday.com, Databricks, Cursor, and other AI-native accounts
              highlighted by investors—suggest product relevance in the agent stack, yet they also bias the public
              evidence toward a relatively narrow segment of frontier-AI and automation buyers. Exa says it now serves
              more than 5,000 companies and over 400,000 developers, but public materials do not disclose top-customer
              concentration, renewal rates, NRR, churn, deployment breadth by vertical, or the share of revenue coming
              from a handful of design partners. That is important because the company’s go-to-market and product
              narrative still revolve around exactly the customers most exposed to rapid platform substitution by
              OpenAI, Anthropic, Google, and large application incumbents.


              The financial-model risk follows directly. Sacra estimates roughly $10 million of revenue in 2025 against
              a business that publicly operates expensive GPU and crawling infrastructure, while the company has now
              raised to a $2.2 billion valuation and is guiding investors toward hundreds of thousands of searches per
              second. If Exa can convert frontier usage into durable enterprise contracts, those economics can work; if
              not, the company could face a familiar infrastructure trap where usage grows faster than gross profit. The
              execution overlay is founder concentration. The visible public leadership record remains heavily centered
              on Will Bryk and Jeff Wang, with limited bench disclosure and no public succession plan. That is not
              unusual for an early infrastructure company, but it matters more here because Exa is simultaneously
              scaling product scope, infrastructure intensity, legal complexity, and enterprise sales motion.
