            body: >-
              Exa looks commercially real, technically differentiated, and currently well-capitalized, but it is still
              not publicly underwriteable on a fundamentals basis. The positive case is straightforward: usage-based
              monetization is consistent with agent adoption, customer proofs suggest embedded workflow value, and the
              Series C meaningfully extends the company's ability to scale before needing another round. The blocker is
              that every core underwriting metric that converts product excitement into investable economics is still
              absent: realized revenue mix, gross margin, CAC, payback, NRR, concentration, discounting, burn, runway,
              and debt obligations. Public filings do not fill that gap, and the Delaware public search only offers
              basic entity detail unless one purchases underlying records. The practical verdict is that Exa can be
              diligenced further, but any priced decision should wait for a management data room that reconciles usage
              growth with contribution margin and liquidity. Until then, the right IC posture is research-more rather
              than buy or avoid, because the missing data speaks to quality of earnings rather than obvious demand
