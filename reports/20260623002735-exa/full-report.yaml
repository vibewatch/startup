      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              The public founder story is coherent and unusually aligned with Exa's product thesis. Will Bryk is the
              co-founder and CEO, with a Harvard computer-science-and-physics background and prior engineering work at
              Cresta. Jeff Wang studied computer science and philosophy at Harvard and then worked on data and web
              infrastructure at Plaid. Across official and investor materials, the two are presented as long-time
              collaborators who had already built search projects together before founding Exa. That gives the company
              strong founder-market fit for a product that blends retrieval quality, systems engineering, and developer
              workflow design.


              The governance picture is much thinner. Public sources clearly identify Peter Fenton joining the board in
              the September 2025 Series B and Sarah Wang joining in the May 2026 Series C, but the reviewed official
              pages do not publish a full board list, ownership structure, or succession plan. Careers and about pages
              show a bench of individual technical staff, yet they do not disclose a full executive team beneath the
              founders. That leaves diligence questions around board control, management depth, and whether Bryk's
              unusually visible role creates key-person concentration across recruiting, fundraising, and product
              direction.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO016
              - CO020
