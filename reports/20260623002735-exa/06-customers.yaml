schemaVersion: report-v2
artifact: customers
slug: exa
runDate: '2026-06-23'
company:
  name: Exa
chapter:
  number: 6
  title: Customers
  summary: >-
    Exa has real customer traction across AI-native developer tools, CRM/GTM software, research
    products, and enterprise-agent platforms, with especially strong named proof at HubSpot,
    monday.com, OpenRouter, Cognition, and a broader long tail of workflow-specific case studies.
    Adoption signals are strong—5,000+ companies, 400,000+ developers, and 73M OpenRouter queries
    to date—but retention, contract duration, and customer concentration remain undisclosed, while
    pricing complexity and multi-homing make durability less proven than logo growth.
sections:
  - id: segmentation
    title: Customer Base Segmentation
    body: >-
      Exa's public customer set is broad enough to segment by buyer, user, payer, and job-to-be-done
      rather than by a single “developer tools” label. One cluster is developer-native agent and
      coding products—Cursor, Cognition, OpenRouter, CodeRabbit—where the day-to-day user is a
      developer or AI agent, the economic buyer usually sits in engineering or product, and the
      payer is an infrastructure or software budget. A second cluster is GTM and CRM automation—
      monday.com, HubSpot, 11x, and Obvious—where end users are SDRs, AEs, RevOps, or AI agents
      acting on their behalf, while budget authority sits with revenue operations, sales technology,
      or product leadership. A third cluster is research and specialist knowledge work—Anara in
      scientific discovery and WhyHow in litigation intelligence—where information quality matters
      more than pure click-through search. A fourth cluster is enterprise agent platforms like
      StackAI, where Exa is embedded into governed, multi-step enterprise workflows such as due
      diligence and RFPs. Geography is less directly disclosed by Exa than by its customers, but
      HubSpot's 299,000 customers across 135 countries and monday.com's 250,000+ customers worldwide
      imply that Exa already sits inside globally distributed software products even if Exa does not
      publish a clean segment or regional revenue split.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU041, CU045]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption Trajectory
    body: >-
      The public adoption curve is steep even if the denominator quality is still company-defined.
      In July 2024 Exa said thousands of companies and developers had already integrated the product,
      with Databricks cited as an early AI research-team example. By the May 2026 Series C post,
      Exa said the number of companies using the platform had grown to over 5,000 and that the
      product powered search for more than 400,000 developers. Named-customer signaling also became
      more specific over that period: public references moved from broad “AI applications” language
      to explicit mention of Cursor, Cognition, HubSpot, OpenRouter, and monday.com. Usage depth is
      strongest where customer-side outcome data exists. OpenRouter reported growth from 2.36M+
      Exa-backed search queries last year to 73M queries to date. 11x said Exa has powered millions
      of searches, Webset items, and enrichment cells in production. CodeRabbit reported that
      switching to Exa reduced web-search volume by roughly 70-75% while preserving or improving
      output quality. Taken together, the trajectory supports real production adoption, but Exa still
      does not disclose active-versus-registered developer counts, paid-versus-free company counts,
      or expansion by cohort.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU037, CU040, CU043]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: named-proof
    title: Named Customer Proof
    body: >-
      Exa's named-customer proof is unusually rich for a private infrastructure API company, but the
      evidence quality varies materially by logo. HubSpot has the strongest enterprise workflow proof:
      named AI leaders say Exa beat both native model search and other alternatives on speed, price,
      and enrichment coverage, and the case study ties usage to Breeze Assistant, agents, and Monitors
      workflows. monday.com offers similarly concrete workflow proof for CRM lead-generation and
      routing. OpenRouter provides the best quantitative scale proof with 73M cumulative queries and a
      clear explanation of why Exa mattered inside a model-routing marketplace. Cognition's evidence
      is thinner in detail but strategically important because its founder states Exa powers all parts
      of Devin. Secondary references widen the proof set: 11x, CodeRabbit, Obvious, StackAI, WhyHow,
      and Anara show usage in GTM intelligence, code review, market mapping, enterprise agent stacks,
      litigation intelligence, and scientific research. Cursor is the one marquee logo where Exa's
      public proof is weakest: the company, Lightspeed, and PYMNTS all name it as a customer, but no
      standalone Exa case study or quantified deployment details were located. That makes Cursor real
      as a named proof point, but not as strong as HubSpot, monday.com, OpenRouter, or the secondary
      case-study set.
    claimRefs: [CU018, CU019, CU020, CU021, CU022, CU023, CU025, CU026, CU042, CU044]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: retention-durability
    title: Retention and Durability
    body: >-
      Durability is where the public record thins out. No reviewed source disclosed net revenue
      retention, gross retention, churn, renewal rates, or contract duration, so the retention story
      has to be inferred from product embed and workflow behavior rather than measured directly.
      Positive structural signals exist. Exa is not just a single endpoint: customers can start with
      Search and expand into Contents, Monitors, Agent, and enterprise overlays like negotiated
      billing and higher-volume support. LangChain's dedicated Exa integration lowers developer
      adoption friction, while customer stories repeatedly describe Exa as part of the core operating
      loop rather than a one-off experiment. But the negative signals are also real. OpenRouter's
      architecture shows search can be a swappable engine inside larger model-routing products.
      Humai and MakerStack both argue Exa is best when semantic quality matters, but more expensive
      and more complex than alternatives for simple or high-volume lookups; both describe routing or
      multi-provider patterns that normalize multi-homing. ChatForest pushes the risk one level up,
      arguing the whole category could compress if native search inside model providers becomes “good
      enough.” The result is a credible but not fully evidenced durability case: Exa looks embedded in
      important customer workflows, yet public retention disclosure is missing and switching costs are
      clearly not absolute.
    claimRefs: [CU023, CU024, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036, CU040]
    tableRefs: [TU004]
    figureRefs: [FU004]
  - id: expansion-concentration
    title: Expansion and Concentration Risk
    body: >-
      Exa's expansion path is intuitive: self-serve search can grow into contents extraction,
      monitoring, asynchronous research, and eventually negotiated enterprise contracts. That path is
      visible in the customer mix itself. HubSpot layers Search and Monitors into CRM agents;
      OpenRouter turns Exa into shared infrastructure across hundreds of models; StackAI embeds Exa
      into governed enterprise agent deployments; and GTM customers like 11x and Obvious move from
      discovery into enrichment and workflow automation. The concentration question is much harder.
      Public named references skew toward AI-native software and agent builders, which suggests a real
      risk that a relatively small number of flagship logos influence roadmap, reputation, and maybe
      revenue mix more than the 5,000-company headline implies. Public sources do not disclose top-
      customer revenue share, segment mix, or direct-versus-partner sourced bookings. The ecosystem is
      also two-edged: LangChain and other developer surfaces reduce adoption friction, but they also
      make it easier for customers to benchmark or substitute multiple search providers. Exa's
      customer chapter therefore supports a land-and-expand thesis, but not yet a no-concentration
      thesis.
    claimRefs: [CU027, CU028, CU029, CU030, CU038, CU039, CU040, CU041, CU042]
    tableRefs: [TU005]
