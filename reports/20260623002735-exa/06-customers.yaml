callouts:
  - calloutType: strength
    title: Real customer proof across multiple buyer types
    body: >-
      Exa has crossed the threshold from generic logo soup to workflow-specific proof: HubSpot,
      monday.com, OpenRouter, Cognition, 11x, CodeRabbit, Obvious, StackAI, WhyHow, and Anara all
      show concrete uses that span developers, GTM, research, and enterprise agents.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU027]
  - calloutType: risk
    title: Logos outpace durability disclosure
    body: >-
      Exa's public customer evidence is stronger on adoption breadth and named proofs than on the
      metrics that determine revenue durability. No public NRR, churn, or concentration data was
      found, and independent reviews argue that search-provider routing and price-based multi-homing
      are common.
    claimRefs: [CU031, CU033, CU034, CU035, CU036, CU039, CU040]
