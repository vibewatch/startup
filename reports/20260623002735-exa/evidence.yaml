evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board composition and governance disclosure
    missingEvidence: >-
      A current board list, board-observer roster, voting-control summary, and formal succession / leadership-depth
      materials.
    whyItMatters: >-
      Series B and Series C added named investor directors, but public pages do not show who controls the board or how
      dependent Exa remains on the founders.
    diligencePath: Request board materials, current cap table, and governance docs from the data room.
    relatedQuestionRefs:
      - QO007
      - QO008
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: debt, secondaries, and preference stack
    missingEvidence: >-
      Debt facilities, secondary-sale history, liquidation preferences, pro-rata rights, and other economic terms not
      disclosed in public financing writeups.
    whyItMatters: >-
      Headline valuation alone is insufficient for underwriting entry price or control dynamics in a heavily financed
      private company.
    diligencePath: Obtain financing documents and cap-table schedules covering seed through Series C.
    relatedQuestionRefs:
      - QO013
      - QO026
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount and location consistency
    missingEvidence: A verified employee count and an authoritative office list from HR or payroll records.
    whyItMatters: >-
      Public sources disagree materially on staffing scale, making burn-rate, capacity, and operating-leverage
      assumptions unreliable.
    diligencePath: Request an employee census by function/location and reconcile it against recruiting plans.
    relatedQuestionRefs:
      - QO017
      - QO018
      - QO026
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: audited revenue, concentration, and retention metrics
    missingEvidence: Audited or management-certified revenue/ARR, growth, customer concentration, and retention data for 2025-2026.
    whyItMatters: >-
      The valuation path is strong, but public revenue evidence is currently a third-party estimate rather than a
      company-certified KPI.
    diligencePath: Request revenue bridge, top-customer concentration, cohort retention, and contracted backlog metrics.
    relatedQuestionRefs:
      - QO024
      - QO026
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: enumeration coverage for public milestone chronology
    missingEvidence: >-
      Internal product-roadmap, commercial milestone, and board-event logs that would confirm whether the public
      timeline omits material inflections.
    whyItMatters: >-
      The milestone table is the public chronology of record for this chapter, but private-company disclosure may omit
      governance and customer milestones.
    diligencePath: Cross-check management timeline against board decks and internal product release records.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: standalone-agent-retrieval-tam
    missingEvidence: >-
      A neutral third-party market study that isolates public-web retrieval infrastructure for agents from enterprise
      knowledge search and generalized search software.
    whyItMatters: >-
      Without a scoped third-party TAM or SAM, valuation work can drift into adjacent categories that materially
      overstate Exa's addressable revenue pool.
    diligencePath: >-
      Ask management for segmented revenue or usage by product line, target buyer mix, and internal market-sizing work
      tied to specific contract cohorts.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-owner-concentration
    missingEvidence: >-
      Customer-level information about who signs production contracts and whether spend sits in engineering, platform,
      product, or centralized AI budgets.
    whyItMatters: >-
      Budget-owner concentration determines sales cycle, pricing power, and how resilient Exa's category is when
      experimental agent projects tighten.
    diligencePath: >-
      Request anonymized customer references, procurement org charts, and deal-level data showing initial champion
      versus final budget owner.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality-and-retention
    missingEvidence: >-
      Neutral evidence on cohort retention, gross margin, and the split between recurring platform usage and
      project-style research workflows.
    whyItMatters: >-
      The category can look large on query volume while still producing weaker software economics if usage is spiky,
      experimental, or heavily services-assisted.
    diligencePath: >-
      Ask for cohort retention, net dollar retention, attach rates by endpoint, and any internal breakdown between usage
      revenue and enterprise commitments.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: minor
    topic: vendor-benchmark-claims
    missingEvidence: >-
      A neutral benchmark comparing Exa, Brave, and Tavily on relevance, latency, grounding quality, and downstream task
      success under the same workload.
    whyItMatters: >-
      Vendor self-claims conflict directly, so investors should not treat any single publisher's speed or quality
      narrative as dispositive.
    diligencePath: >-
      Run a controlled benchmark across the buyer workflows that matter most to Exa, including coding, research, and
      enterprise search-grounding tasks.
    relatedQuestionRefs:
      - QM023
      - QM024
    relatedTableRefs:
      - TM006
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Realized enterprise discounting, committed-spend floors, and bundled concessions across Exa, Brave, Perplexity,
      Tavily, and SerpAPI.
    whyItMatters: >-
      List prices understate whether Exa can defend premium economics or whether peers are already winning on blended
      cost.
    diligencePath: >-
      Request anonymized recent order forms or board-level pricing summaries that show committed spend, overage rules,
      and discount bands by segment.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rate
    missingEvidence: Cohort-level retention, win-rate, and volume-share data for Exa versus Tavily, Brave, SerpAPI, and Perplexity.
    whyItMatters: Public product pages do not show whether Exa is winning because of quality, trust, or just early category timing.
    diligencePath: Ask for CRM win/loss notes, retention by use case, and usage concentration by top customers or top workloads.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: independent-benchmarking
    missingEvidence: >-
      Independent side-by-side benchmarks on relevance, latency, hallucination control, and citation quality across the
      direct peer set on agent workloads.
    whyItMatters: >-
      Most public performance claims are vendor-authored, which limits confidence when converting positioning claims
      into moat conclusions.
    diligencePath: >-
      Run a buyer-specific benchmark or obtain a trusted third-party evaluation using the exact workloads Exa is
      pursuing.
    relatedQuestionRefs:
      - QP003
      - QP004
      - QP005
      - QP006
    relatedTableRefs:
      - TP002
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Enterprise versus self-serve revenue split, top-customer concentration, and realized discount rates by cohort.
    whyItMatters: Public endpoint prices do not reveal whether Exa's best customers are sticky, concentrated, or heavily discounted.
    diligencePath: Request board reporting that breaks revenue by product, channel, contract type, and top 20 accounts.
    relatedQuestionRefs:
      - QI008
      - QI020
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-gap
    missingEvidence: >-
      Blended and endpoint-level gross margin, including infrastructure allocation, support cost, and third-party model
      spend.
    whyItMatters: >-
      Without margin disclosure, it is impossible to know whether rapid usage growth translates into attractive unit
      economics or merely higher infrastructure burn.
    diligencePath: >-
      Request monthly gross-margin bridge by endpoint for the last 12 months and assumptions for forward contribution
      margins.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-gap
    missingEvidence: Current cash balance, monthly burn, capex commitments, and management runway cases after the Series C.
    whyItMatters: A large raise can still mask short runway if infrastructure expansion or GTM hiring is cash intensive.
    diligencePath: Request latest cash waterfall, board burn dashboard, capex schedule, and downside runway model.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: CAC, payback, gross retention, NRR, churn, and net pricing realization by customer segment.
    whyItMatters: >-
      These metrics determine whether Exa's usage-based model compounds efficiently or requires repeated external
      capital to sustain growth.
    diligencePath: >-
      Request cohort tables by acquisition channel and enterprise account expansion, including support burden and
      discounting.
    relatedQuestionRefs:
      - QI020
      - QI025
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: sla-and-uptime-history
    missingEvidence: >-
      A public or customer-shareable SLA/SLO document covering latency, error budgets, incident response, and historical
      uptime across the full hosted platform.
    whyItMatters: >-
      A point-in-time status page is not enough to underwrite production dependency for enterprise search or agent
      workflows.
    diligencePath: >-
      Request current SLA/MSA exhibits, status-history exports, and the last 12 months of Sev1/Sev2 incident summaries
      from Exa security or support teams.
    relatedQuestionRefs:
      - QE019
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: deployment-topology
    missingEvidence: Documented support for VPC, region pinning, self-hosted, or private-link style deployment options, if any exist.
    whyItMatters: >-
      Large enterprise buyers may require infrastructure isolation or region-specific deployment before approving
      sensitive retrieval workflows.
    diligencePath: >-
      Ask product and solutions engineering for a current deployment-options matrix, including hosted-only, private
      networking, data residency, and roadmap status.
    relatedQuestionRefs:
      - QE020
      - QE025
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retrieval-benchmarking
    missingEvidence: >-
      Independent benchmark evidence for recall, freshness, false positives, and entity-resolution quality across Exa
      search and company-search surfaces.
    whyItMatters: >-
      Most quality claims in the reviewed corpus are Exa-authored and do not let an investor separate real technical
      edge from well-packaged marketing.
    diligencePath: >-
      Request third-party evals, customer-side bakeoff results, and methodology for company-search coverage and
      freshness measurements.
    relatedQuestionRefs:
      - QE013
      - QE022
      - QE024
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: default-retention-and-training-controls
    missingEvidence: >-
