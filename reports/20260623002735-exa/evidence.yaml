    whyItMatters: >-
      The privacy policy explicitly permits product-improvement and model-training uses of query data, which may be
      incompatible with regulated or confidential workloads.
    diligencePath: >-
      Request DPA language, retention schedules, training opt-out defaults, and admin-level control documentation for
