- id: public-scale-and-ecosystem-signals
  title: Public Scale Markers, Customers, and Ecosystem Signals
  body: 'The strongest public traction markers are company-claimed and ecosystem-based rather than audited financial. Exa says it powers search for Cursor, Cognition, HubSpot, OpenRouter, Monday.com, and more than 400,000 developers, while its Series C post says the platform now serves over 5,000 companies. Independent partner signals reinforce that Exa is embedded in current agent tooling: LangChain maintains both Python and JavaScript integrations; Exa publishes its own MCP server guide for Claude, Cursor, VS Code, Codex, and Gemini CLI; and Browserbase offers an Exa-based job-search automation template. TechCrunch also cited Databricks as a customer using Exa for dataset discovery.


    Some scale markers remain much softer. Public headcount numbers disagree sharply, ranging from 75 on Y Combinator''s company profile to around 100 in May 2026 coverage and 294 on Growjo. Revenue is even less reliable: Sacra estimated roughly $10 million in 2025, but no official audited revenue or ARR disclosure was found in the company''s own materials. Likewise, the public record confirms a San Francisco headquarters and a worldwide hiring posture, but not a clean list of durable secondary offices. The right reading is that customer and developer adoption look real, but several cover metrics still need private verification before they can carry valuation weight.'
