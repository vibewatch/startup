- id: milestones-and-adverse-context
  title: Milestones and Adverse Context
  body: 'Exa''s milestone pattern shows a company moving from search-engine R&D into agent infrastructure with unusual speed: first search engine launch in November 2022, API focus in early 2023, the Exa rename and Highlights launch in January 2024, the institutionalizing Series B in September 2025, the revamped Exa Deep release in March 2026, and the $2.2 billion Series C in May 2026. Those events collectively support a view that management has repeatedly re-positioned the company toward the highest-value agent workflows rather than staying in a narrow semantic-search niche.


    The adverse context is subtler but material. First, Exa''s economics are infrastructure-heavy because it runs its own crawling, indexing, and GPU stack; even a positive growth story can therefore remain cash-hungry. Second, Sacra''s competitive map highlights pressure from OpenAI, Anthropic, Google, Brave, Tavily, Jina, and Perplexity, reminding investors that the category sits directly in the blast radius of both frontier models and adjacent search APIs. Third, the privacy policy states that query data can be used to improve and fine-tune Exa''s models, while Zero Data Retention is marketed as an enterprise-only feature. That does not imply misconduct, but it is a real diligence issue for sensitive workloads and reinforces the need to inspect enterprise contract terms rather than assuming default data isolation.'
