company:
  name: Exa
chapter:
  number: 1
  title: Company Overview
  summary: Exa is a San Francisco AI-search infrastructure company founded in 2021 and renamed from Metaphor in January 2024. By May 2026 it had climbed from a $700M Series B to a $2.2B Series C while positioning itself as the search layer for agents, citing 5,000+ company customers and 400,000+ developers. The core diligence tension is that the adoption and financing signals are strong, but public disclosure on governance, exact headcount, audited revenue, and default data-retention behavior remains incomplete.
sections:
- id: identity-and-operating-model
  title: Identity, Rename, and Operating Model
  body: 'Exa is a private San Francisco AI-search infrastructure company founded in 2021 and originally launched under the Metaphor name before publicly rebranding to Exa in January 2024. The rename mattered because it marked a shift from a better-search narrative to a broader mission of organizing the world''s knowledge for AI systems. The current product is not a consumer search destination but a search-and-retrieval layer for agents: Exa sells web search, content extraction, answer generation, monitors, and asynchronous research workflows through APIs and developer tooling.


    The operating model is usage-based infrastructure. Public pricing shows per-request charges for search tiers, page-content retrieval, and agent runs, while enterprise plans add negotiated controls such as higher limits and Zero Data Retention. Official docs and product pages consistently emphasize latency, semantic retrieval quality, structured outputs, and code-search support rather than advertising, which is important because it frames Exa as a picks-and-shovels company for the agent stack rather than a media or SEO business. Official legal pages also anchor the headquarters in San Francisco, while company materials describe a worldwide hiring footprint rather than a large, fully enumerated office network.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO037
  - CO042
  figureRefs:
  - FO002
- id: founders-leadership-and-governance
  title: Founders, Leadership, and Governance
  body: 'The public founder story is coherent and unusually aligned with Exa''s product thesis. Will Bryk is the co-founder and CEO, with a Harvard computer-science-and-physics background and prior engineering work at Cresta. Jeff Wang studied computer science and philosophy at Harvard and then worked on data and web infrastructure at Plaid. Across official and investor materials, the two are presented as long-time collaborators who had already built search projects together before founding Exa. That gives the company strong founder-market fit for a product that blends retrieval quality, systems engineering, and developer workflow design.


    The governance picture is much thinner. Public sources clearly identify Peter Fenton joining the board in the September 2025 Series B and Sarah Wang joining in the May 2026 Series C, but the reviewed official pages do not publish a full board list, ownership structure, or succession plan. Careers and about pages show a bench of individual technical staff, yet they do not disclose a full executive team beneath the founders. That leaves diligence questions around board control, management depth, and whether Bryk''s unusually visible role creates key-person concentration across recruiting, fundraising, and product direction.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO016
  - CO020
  - CO023
  - CO029
  - CO040
  tableRefs:
  - TO002
- id: funding-history-and-valuation-path
  title: Funding History and Valuation Path
  body: 'Exa''s capital history follows a fast staircase. In July 2024 the company announced $22 million of seed plus Series A financing, with the Series A portion reported as $17 million led by Lightspeed and joined by NVentures and Y Combinator. In September 2025 Exa raised an $85 million Series B at a $700 million valuation led by Benchmark, a round that also formalized Peter Fenton''s board role and funded a larger GPU cluster and broader hiring. In May 2026 Exa announced a $250 million Series C at a $2.2 billion valuation led by Andreessen Horowitz, with existing backers Benchmark, Lightspeed, and Y Combinator also participating.


    That path implies roughly $357 million of disclosed lifetime capital by May 2026 and a valuation step-up of a little over 3x from the Series B to the Series C in under a year. The financing trajectory is impressive, but public-market-data services lag it unevenly: Sacra still showed only $107 million of funding because its snapshot stopped at Series B, illustrating how quickly third-party datasets can go stale in a fast-moving private company. Public sources also do not disclose debt, secondary liquidity, preference stack, pro-rata rights, or the full cap table, so governance and economics still require private confirmation despite the apparent momentum of the headline round sequence.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO019
