callouts:
- calloutType: strength
  title: Exa has become agent infrastructure, not just a semantic-search demo
  body: 'By June 2026 the public evidence points to a real ecosystem position: official customer logos, over 5,000 company users, 400,000+ developers, LangChain integrations, and an MCP guide spanning major coding-agent clients. That does not prove durable moat, but it does show Exa has moved beyond experiment status into active workflow infrastructure.'
  claimRefs:
  - CO024
  - CO025
  - CO027
  - CO028
- calloutType: risk
  title: Governance and privacy disclosure lag the valuation story
  body: The reviewed public sources never publish a full board, cap table, or control-rights summary, and the privacy policy explicitly says query data can improve and fine-tune Exa's models while Zero Data Retention is framed as an enterprise feature. For sensitive workloads or governance-heavy investors, those are not footnotes — they are diligence blockers until contract and board materials are reviewed.
  claimRefs:
  - CO023
  - CO035
  - CO036
- calloutType: insight
  title: Funding velocity is exceptional, but some core metrics remain indirect
  body: Exa's move from a $700M Series B in September 2025 to a $2.2B Series C in May 2026 is a major institutional endorsement. Yet public revenue, headcount, office footprint, and full governance details remain either estimated or inconsistent. The clean reading is strong momentum with incomplete disclosure, not a fully de-risked late-stage profile.
