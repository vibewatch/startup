companyProfile:
  summary: >-
    Exa is a private San Francisco AI-search infrastructure company founded in 2021 by Will
    Bryk and Jeff Wang. The company positions itself as a custom search engine built for AI
    agents and has expanded from search into content extraction, answer generation, company
    search, monitors, and agentic research workflows. Public evidence supports real adoption
    and strong financing momentum, including a $250 million Series C at a $2.2 billion
    valuation, but disclosure remains limited on audited financials, governance depth,
    retention, and exact operating scale.
  founders:
    - name: Will Bryk
      role: Co-founder and CEO
      background: Harvard computer science and physics graduate; previously an engineer at Cresta.
      claimRefs: [CO006, CO007]
    - name: Jeff Wang
      role: Co-founder
      background: Harvard computer science and philosophy graduate; previously built data and web infrastructure at Plaid.
      claimRefs: [CO006, CO008]
  foundingLocation: San Francisco
  headquarters: San Francisco
  productSummary: >-
    Web search, content extraction, grounded answers, company search, monitors, Websets, and
    agent-style research APIs built on Exa's own crawling, indexing, embedding, vector,
    and orchestration stack.
  customerFocus: >-
    AI-native developers, coding assistants, research tools, GTM software, and enterprise
    teams embedding live public-web retrieval into agent workflows.
  businessModel: >-
    Usage-based API pricing for search, contents, answer, and agent workflows, with enterprise
    contracts adding higher limits, negotiated billing, and security controls such as zero data retention.
  stage: Series C
  fundingStatus: >-
    Latest public financing was a $250 million Series C in May 2026 at a $2.2 billion valuation,
    following earlier 2024 Series A and 2025 Series B rounds.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO006, CO019, CO024, CO025, CE023, CE026, CE027, CE028, CV031]
summary:
  headline: >-
    Exa looks like a real and differentiated agent-search infrastructure company, but the
    public economics and current $2.2 billion price are still too opaque to justify an
    invest-now call.
