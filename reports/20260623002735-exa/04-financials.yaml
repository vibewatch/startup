- id: traction-capital
  title: Traction visibility and capital adequacy
  body: 'Demand proof is directionally strong but still incomplete. Exa says it serves more than 5,000 companies and over 400,000 developers, while the OpenRouter case study reports 73 million cumulative search queries through its Exa-backed path. On revenue, the best public number is Sacra''s estimate of $10 million for 2025 after an earlier company statement that revenue had tripled over a few months in 2024. Capital visibility is better than operating visibility: Exa publicly announced a $250 million Series C at a $2.2 billion valuation in May 2026 after previously disclosing a $22 million seed and Series A round in 2024. Management tied the new money to model training, infrastructure expansion to hundreds of thousands of searches per second, and GTM build-out. What remains missing is the solvency bridge from that raise to sustainable economics: no cash balance, burn, runway, debt, or covenant picture is publicly available.'
