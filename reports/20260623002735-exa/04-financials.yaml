- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Enterprise vs self-serve revenue mix
    - Without mix, top-line quality and concentration cannot be judged
    - Request revenue by product, contract type, and top-20 accounts
  - - Gross margin by endpoint
    - Cannot tell whether usage growth is accretive or margin-dilutive
    - Request COGS bridge by Search, Contents, Agent, and custom enterprise workloads
  - - Cash, burn, runway
    - Capital adequacy cannot be converted into months of survival or investment pace
    - Request latest monthly cash waterfall and 12-18 month plan
  - - CAC, payback, NRR, churn
    - Sales efficiency and durability remain opaque
    - Request cohort retention, expansion, and fully loaded sales/marketing efficiency
  - - Discounting and contract terms
    - List price may overstate monetization quality if enterprise discounts are steep
    - Request standard MSA terms, average discount by cohort, and support burden
  - - Debt, hardware commitments, and vendor financing
    - Infrastructure liabilities could sit outside headline equity story
    - Request debt schedule, hardware purchase commitments, and any guaranteed minimums
  notes: Each row is a gating diligence item rather than a minor nice-to-have; without these, a priced underwriting decision would rest on proxies.
