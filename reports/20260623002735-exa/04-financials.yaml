- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value/status
  - Revenue quality
  - Diligence ask
  rows:
  - - Search API
    - Core retrieval endpoint sold on usage
    - per 1k requests
    - $7 base with $1 incremental results above 10
    - Clear list pricing; realized yield unknown
    - Provide blended realized ARPU per 1k searches by top cohort
  - - Deep / Deep-Reasoning Search
    - Higher-effort synthesized search modes
    - per 1k requests
    - $12 deep; $15 deep-reasoning
    - Premium usage SKU; margin unknown because more model work
    - Disclose mix of deep queries and compute cost per request
  - - Contents / Answer
    - Retrieval plus page extraction / grounded answers
    - per 1k pages or per 1k requests
    - $1 per 1k pages; Answer $5 per 1k requests
    - Useful attach product; crawl and inference costs likely variable
    - Show attach rate, average pages per query, and gross margin
  - - Agent
    - Async deep research and enrichment
    - per run plus ACUs and search tool calls
    - $0.012-$2.00 per run plus $0.10/ACU and $0.005/search
    - Potentially high-value workload but highly compute-sensitive
    - Share average ACUs, search calls, and realized gross margin by effort tier
  - - Monitors / Websets
    - Recurring search, list building, and enrichment
    - scheduled runs / async jobs
    - Monitors priced in public surface; Websets positioned as enrichment workflow
    - Expands wallet via recurring and GTM use cases
    - Disclose retention, repeat-run volume, and contract packaging
  - - Enterprise overlays
    - Invoice billing, custom QPS, ZDR, support, SLAs
    - custom contract
    - Negotiated via sales rather than public calculator
    - Higher willingness to pay plausible; pricing opacity remains high
    - Break out enterprise ARR, average contract value, and custom-support burden
  notes: List prices and packaging are public; realized net pricing, discounting, and product mix are not.
