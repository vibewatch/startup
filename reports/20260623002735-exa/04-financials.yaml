  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Enterprise versus self-serve revenue split, top-customer concentration, and realized discount rates by cohort.
    whyItMatters: Public endpoint prices do not reveal whether Exa's best customers are sticky, concentrated, or heavily discounted.
    diligencePath: Request board reporting that breaks revenue by product, channel, contract type, and top 20 accounts.
    relatedQuestionRefs:
    - QI008
    - QI020
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-gap
    missingEvidence: Blended and endpoint-level gross margin, including infrastructure allocation, support cost, and third-party model spend.
    whyItMatters: Without margin disclosure, it is impossible to know whether rapid usage growth translates into attractive unit economics or merely higher infrastructure burn.
    diligencePath: Request monthly gross-margin bridge by endpoint for the last 12 months and assumptions for forward contribution margins.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-gap
    missingEvidence: Current cash balance, monthly burn, capex commitments, and management runway cases after the Series C.
    whyItMatters: A large raise can still mask short runway if infrastructure expansion or GTM hiring is cash intensive.
    diligencePath: Request latest cash waterfall, board burn dashboard, capex schedule, and downside runway model.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: CAC, payback, gross retention, NRR, churn, and net pricing realization by customer segment.
    whyItMatters: These metrics determine whether Exa's usage-based model compounds efficiently or requires repeated external capital to sustain growth.
    diligencePath: Request cohort tables by acquisition channel and enterprise account expansion, including support burden and discounting.
    relatedQuestionRefs:
    - QI020
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
