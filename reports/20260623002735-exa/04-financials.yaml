- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2025 revenue estimate
    - $10M (Sacra estimate)
    - medium
    - Only public revenue anchor in reviewed set
    - Provide audited or board-reported 2025 revenue and 2026 run rate
  - - Gross margin
    - 'null'
    - low
    - Core underwriting blocker for an infra-heavy API business
    - Provide blended and endpoint-level gross margin history
  - - Installed training / retrieval compute
    - $5M 144-H200 cluster; 224 GPUs combined with older A100 fleet
    - medium
    - Signals heavy fixed-cost base and capacity ambitions
    - Provide depreciation policy, lease terms, and utilization
  - - Vector DB efficiency claim
    - 10x lower cost than quoted cloud vector DB alternatives
    - medium
    - Shows internal cost-optimization, not absolute margin
    - Provide actual infrastructure cost per 1k successful searches
  - - Search throughput proxy
    - '>500 QPS for vector DB; 10 QPS public /search default limit'
    - medium
    - Suggests internal capacity can exceed public self-serve defaults
    - Provide sustained production QPS, latency, and unit cost by tier
  - - Token-efficiency proxy
    - '>20x text-extraction reduction and up to 94% token reduction in Agent benchmarks'
    - medium
    - Lower tokens can improve downstream economics and customer ROI
    - Provide measured customer savings and capture rate versus API price
  - - Sales efficiency / retention
    - 'null'
    - low
    - No public CAC, payback, NRR, or churn means GTM quality is opaque
    - Provide CAC by channel, payback, gross retention, and NRR
  notes: Nulls mark undisclosed private metrics; public proxies emphasize cost drivers and optimization claims rather than realized profitability.
