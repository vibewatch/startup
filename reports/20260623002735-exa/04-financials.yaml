chapter:
  number: 4
  title: Financials
  summary: Exa shows a credible usage-based API business with strong customer adoption and fresh capital, but public evidence still stops short of gross-margin, burn, and revenue-mix disclosure needed for underwriting. The financial case is strongest on monetization breadth and weakest on realized unit economics and filing-grade transparency.
sections:
- id: revenue-model
  title: Revenue model and endpoint monetization
  body: Exa monetizes a broad menu of API primitives rather than a seat license. The public pricing surface shows direct charges for Search, Deep Search, Deep-Reasoning Search, Contents, Answer, and Agent runs, while Monitors and Websets extend the same usage logic into recurring or enrichment-heavy workflows. Self-serve users prepay credits and consume them as requests, pages, and agent tool calls accrue; enterprise customers are pushed toward negotiated pricing, invoice billing, higher result counts, custom QPS, and security commitments like zero data retention. That means the commercial question is not whether Exa has ways to charge, but whether list-price demand turns into durable realized gross profit after compute, crawl, and support costs. Public customer case studies support willingness to embed Exa deeply inside agentic products, but they do not reveal enterprise contract sizes, discounting, or the mix between high-volume platform deals and long-tail developer spend.
