callouts:
- calloutType: recommendation
  title: Publicly compelling, not yet publicly underwriteable
  body: Exa has enough commercial signal to merit continued diligence, but not enough financial disclosure to support an underwriting decision on public evidence alone. The Series C removes immediate solvency fear; it does not solve margin, burn, or retention opacity.
  claimRefs:
  - CI034
  - CI037
  - CI039
  - CI040
  - CI050
- calloutType: risk
  title: Infrastructure costs can outrun usage economics
  body: Owning crawling, vector retrieval, and GPU clusters may create a durable moat, but it also means operating leverage can turn negative if realized enterprise pricing or query mix fails to outrun infrastructure and support intensity.
  claimRefs:
  - CI029
  - CI031
  - CI032
  - CI048
  - CI049
- calloutType: strength
  title: Capital and customer proofs are real
  body: 'The best evidence in the file is not accounting data but adoption and financing signal: named customers, growing query volume through OpenRouter, and a $250M Series C at a multi-billion valuation. Those facts justify deeper diligence even though they do not close the underwriting case.'
  claimRefs:
