- id: cost-structure
  title: Cost structure proxies and unit economics
  body: Public sources are unusually clear on infrastructure ambition and unusually thin on actual margins. Exa owns crawling, indexing, embedding, vector-database, and query layers, and management says the system tracks more than 500 billion URLs. The company also disclosed a $5 million 144-H200 cluster that runs nearly continuously and, combined with the older 80-A100 fleet, pushes total installed GPUs to 224. The vector-database writeup argues this design cuts cloud-vector-database costs by roughly ten times while sustaining billions of vectors, sub-100 millisecond retrieval, and more than 500 QPS. Those are meaningful efficiency signals, but they do not reveal gross margin because delivery still depends on live crawl freshness, contents breadth, reranking, and agent compute intensity. The right read is that Exa likely has strong internal cost-optimization talent, but its margin path remains a diligence item until management discloses endpoint-level contribution margins or at least a
    blended gross-margin range.
  claimRefs:
