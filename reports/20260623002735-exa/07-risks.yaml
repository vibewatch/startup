- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / query-data risk
    - Default retention and training terms
    - No processor-only / ZDR default for sensitive enterprise tiers
    - Do not underwrite regulated-workload upside until contract controls are proven
  - - Reliability risk
    - Status incidents and SLA metrics
    - Repeated customer-visible outages or no credible MTTR/SLO package
    - Re-rate as infrastructure with weak enterprise readiness
  - - Capital-intensity risk
    - Gross margin, GPU utilization, and next-capex plan
    - Margin stagnates while cluster spend and cloud costs rise
    - Assume more dilution and lower terminal multiple
  - - Customer concentration risk
    - Top-10 revenue share and NRR by cohort
    - Top accounts dominate usage or frontier-AI cohort churns materially
    - Cut growth durability assumptions and revisit valuation
  - - Platform displacement risk
    - Win/loss data against OpenAI, Google, Anthropic, and bundled suites
    - Incumbents absorb search use cases faster than Exa adds differentiated workflows
    - Shift thesis from category leader to niche component supplier
  - - Key-person risk
    - Leadership bench and succession readiness
    - No credible depth below founders or a founder departure
    - Pause conviction until management continuity is de-risked
  notes: Kill criteria are framed as observable events or missing controls that would directly impair the underwriting thesis.
