- id: operational-reliability-and-dependencies
  title: Operational reliability and dependency risk
  body: |-
    Exa’s infrastructure story is simultaneously a moat and a risk amplifier. The company says it bought a $5 million H200 cluster, now runs a combined 224-GPU fleet nearly 24/7, and built a proprietary vector database to search billions of vectors with sub-100 millisecond latency and more than 500 QPS. Those are impressive technical indicators, but they imply a business with meaningful fixed-cost commitments, utilization risk, and non-trivial failure modes across crawling, indexing, reranking, storage, billing, and partner APIs. The public status history already shows that the “default” service had multiple short downtime events on June 14, 2026. The billing docs also show a customer-level failure path: if prepaid credits run out, requests are blocked. Rate-limit docs cap self-serve search at 10 QPS and push higher-throughput users into enterprise contracting. That is operationally coherent, but it means reliability depends not just on core uptime, but also on entitlement management, rate-shaping, and customer account configuration.

    Dependencies add another layer. TechCrunch reported that Exa hosted the product on AWS even while operating its own GPU cluster, and the public ecosystem shows additional reliance on hosted MCP infrastructure, payment rails, and partner integrations like LangChain and Browserbase. Public customer stories make clear that Exa is embedded in critical agent workflows at OpenRouter, Cognition, and monday.com. Once Exa sits inside those automation chains, even brief outages or latency spikes can propagate into downstream product failures. The right diligence lens is therefore not whether Exa can demo strong search quality—it can—but whether it has the SRE maturity, redundancy, cloud/GPU procurement discipline, and contractual SLAs to behave like a mission-critical infrastructure vendor at the scale implied by its financing narrative.
