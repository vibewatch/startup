  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public-dpa-visibility
    missingEvidence: Executed DPA, retention annex, subprocessors list, and enterprise privacy schedule.
    whyItMatters: The public materials show that enterprise controls exist but do not prove what defaults, carve-outs, and indemnities are actually contracted.
    diligencePath: Obtain the current MSA/DPA package and compare it line-by-line against the public privacy policy and terms.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration-and-retention
    missingEvidence: Top-customer revenue share, logo concentration by ARR, GRR/NRR, churn, and contract durations.
    whyItMatters: Without concentration and retention data, the adoption story cannot be translated into durable revenue quality or downside exposure.
    diligencePath: Request cohort retention, top-10 customer share, and renewal data from the board deck or revenue warehouse.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR021
  - type: private-evidence-only
    severity: material
    topic: leadership-bench-depth
    missingEvidence: Current org chart, named leaders below founders, and succession plan for core product and infrastructure functions.
    whyItMatters: Founder concentration is manageable only if operational authority and technical stewardship are visibly distributed below the co-founder layer.
    diligencePath: Review org chart, management biographies, board materials, and key-person insurance / succession planning artifacts.
    relatedQuestionRefs:
    - QR025
  - type: private-evidence-only
    severity: material
    topic: sla-and-incident-depth
    missingEvidence: Twelve-month incident log, MTTR, SLA credits, uptime by service surface, and cloud/GPU redundancy posture.
    whyItMatters: The public status page proves observability but not reliability quality at the standard expected for core infrastructure vendors.
    diligencePath: Pull SRE dashboards, postmortems, SLA language, and capacity-planning materials.
    relatedQuestionRefs:
    - QR009
    - QR026
    - QR029
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register coverage
    missingEvidence: A complete register of active or threatened disputes, regulator contacts, and country-specific privacy requirements.
    whyItMatters: The public register covers only the highest-severity issues visible in sources and may understate private disputes or enterprise-specific obligations.
    diligencePath: Request outside-counsel memo, claims schedule, regulator correspondence summary, and a market-by-market compliance matrix.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
