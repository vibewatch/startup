  topStrengths:
    - Exa 自建抓取、索引、嵌入、向量和智能体编排栈，而不是在传统搜索外包一层壳，技术差异化看起来有实质内容。
    - 公开采用信号很强：5,000 多家公司、约 400,000 名开发者，且已嵌入 HubSpot、monday.com、OpenRouter、Cognition 等客户工作流。
    - 2026 年 5 月 $250 million Series C 和一线投资人组合显著降低近期融资风险，也给管理层扩基础设施和 go-to-market 留出空间。
  topRisks:
    - 公开披露仍不足以支撑承销判断：经审计收入、ARR、毛利率、NRR、烧钱速度、客户集中度和优先股堆叠条款都未披露。
    - 相比最近一次公开收入 proxy，也相比私有与公开市场可比公司，$2.2 billion 估值隐含倍数都极高。
    - 若产品控制和单位经济不能随增长成熟，隐私默认设置、仅企业版零数据留存控制以及重基础设施运营模式，会带来运营和采购风险。
  unresolvedGaps:
    - 董事会批准的 2025 年及当年收入、ARR 和毛利率数据，按主要产品线拆分。
    - 在声称的 5,000 多家公司基础上，前几大客户集中度、续约行为、净收入留存率，以及付费与免费转化。
    - 2026 年 Series C 前后的当前股权结构表、清算优先权、老股流动性、债务和期权池条款。
    - 准确员工数、创始人以下管理层厚度，以及敏感工作负载使用的企业 DPA 或默认留存配置。
