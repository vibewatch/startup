- id: TM002
  title: TAM / SAM / sizing lens table
  columns:
  - lens
  - value / signal
  - what it captures
  - confidence
  - limitation
  rows:
  - - Adjacent enterprise search market
    - $4.867B in 2023; $8.852B by 2030; 8.9% CAGR
    - Outer-envelope spend on internal enterprise search and information access
    - Medium
    - Overstates Exa because most of this spend is internal knowledge retrieval, not public-web agent grounding
  - - Exa pricing and scale lens
    - $7-$15 per 1k search-style requests; $1 per 1k pages; over 400k developers; over 5k companies
    - Direct vendor unit economics and current adoption claims
    - Medium-Low
    - Self-reported and not convertible into standalone market revenue without usage mix or retention data
  - - Tavily usage lens
    - 300M monthly requests; 2M+ developers; $0.008 per credit
    - Competitive proof that developer demand and usage volume already exist in the category
    - Low
    - Self-reported and uses a different billing unit
  - - Brave index and pricing lens
    - 30B+ pages; 100M daily updates; $4 per 1k answers or $5 per 1k search requests
    - Evidence of scale, index cost, and category pricing benchmarks
    - Low
    - Vendor-claimed and influenced by packaging differences across endpoints
  - - Legacy programmable-search lens
    - 100 free queries/day; $5 per 1k queries; service unavailable to new customers and sunsets 2027-01-01
    - Status-quo baseline that many teams will migrate away from
    - Medium
    - Legacy benchmark, not a forward TAM
  notes: Multiple lenses support demand, but none isolates a neutral standalone SAM for AI-native public-web retrieval infrastructure; the main output of this table is a bounded sizing logic, not a single TAM headline.
