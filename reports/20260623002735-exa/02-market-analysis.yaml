- id: TM005
  title: Growth drivers and adoption constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Built-in agent tooling from major model providers
    - Positive
    - Current
    - Makes web retrieval a default feature in new agents and enlarges distribution opportunity for vendors like Exa
    - Which buyer workflows drive the highest conversion from experimentation to paid production use?
  - - MCP standardization
    - Positive
    - Current
    - Reduces integration cost across clients and increases channel breadth through IDEs, frameworks, and enterprise connectors
    - How much of new pipeline is MCP-driven versus direct API adoption?
  - - Move up-stack into cited answers and research workflows
    - Positive
    - Current
    - Lets vendors capture more value per task than raw search alone
    - What share of revenue comes from higher-level workflows versus commodity search calls?
  - - Internal-search and DIY stack competition
    - Negative
    - Current
    - Blurs budget ownership because some buyers can extend Glean, Elastic, or internal tooling instead of buying a dedicated public-web retrieval vendor
    - Which customer segments choose dedicated web retrieval over extending internal stacks?
  - - Security, governance, and procurement requirements
    - Negative
    - Current to medium-term
    - Enterprise buyers may demand ZDR, permissions, observability, and contract terms before broad rollout
    - What security and governance features are table stakes in Exa's largest accounts?
  - - Conflicting vendor self-claims on quality and speed
    - Negative
    - Current
    - Makes third-party benchmarks and cohort economics more important than marketing narratives
    - What neutral benchmark or customer proof best predicts win rates and retention?
  notes: Drivers and constraints are tied to adoption timing rather than abstract market size; each row is meant to guide diligence on when demand converts into durable budget.
