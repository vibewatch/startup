company:
  name: Exa
chapter:
  number: 2
  title: Market Analysis
  summary: 'Exa operates in a narrower category than generic search or generic AI infrastructure: AI-native public-web retrieval infrastructure for agents. Public evidence shows real demand through API pricing, usage, integration breadth, and adjacent market research, but the reviewed corpus does not support a clean standalone TAM or SAM for this exact slice. Buyers are primarily developer and AI-platform teams, while the biggest diligence risks are budget-owner ambiguity and unresolved vendor self-claims on quality, coverage, and latency.'
sections:
- id: market-boundary-and-adjacencies
  title: Market Boundary and Adjacent Spend
  body: 'Exa belongs to a narrower market than generic ''search'' or even generic ''AI infrastructure.'' Its own materials describe a public-web retrieval stack for agents: search, crawling, extraction, cited answers, and MCP-based distribution into developer tools. That means the relevant spend is the money developers and enterprise AI teams use to connect agents to fresh public-web information and turn those results into usable context. Several adjacent pools are tempting but misleading. Glean and Elasticsearch sell internal-knowledge and private-data retrieval; Algolia sells commerce and site-search optimization; all matter as substitutes or comparison points, but they do not directly measure Exa''s core revenue pool. Google Custom Search remains a legacy substitute, yet Google says it is closed to new customers and sunsets in 2027. The right boundary is therefore AI-native public-web retrieval infrastructure for agents, with internal enterprise search, advertising, browser subscriptions,
    and generic vector-database spend treated as excluded or adjacent rather than counted as core TAM.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
