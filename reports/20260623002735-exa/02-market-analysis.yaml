- id: TM006
  title: Evidence-preserved contradictions table
  columns:
  - issue
  - claim A
  - claim B
  - why the contradiction matters
  - current handling
  rows:
  - - Quality leadership
    - Exa says it is the highest-quality search API at every latency and price point
    - Brave says its API can replace smaller-index competitors like Exa and that better grounding beats frontier answer engines
    - No neutral third-party benchmark in the reviewed corpus resolves the claim
    - Preserve as unresolved competitive contradiction
  - - Latency leadership
    - Exa says it built the fastest search API in the world at sub-200ms
    - Tavily says its /search endpoint is the fastest on the market at 180ms p50
    - Both claims are self-reported and framed differently
    - Treat as workflow-specific diligence item, not a settled fact
  - - Market size headline
    - Enterprise search research suggests a multi-billion-dollar adjacent market
    - The public-web retrieval category itself is narrower and lacks a standalone TAM study
    - Using the broader report as Exa's TAM would inflate valuation framing
    - Use multiple constrained lenses instead of one TAM headline
  - - Commercial packaging
    - Some vendors monetize raw search requests
    - Others push cited answers, research runs, or credit abstractions
    - Different units make comparison and budgeting messy
    - Compare by workflow and value captured, not only by per-call list price
  notes: Contradictions are preserved rather than normalized away; this chapter treats them as evidence about market immaturity and the need for neutral workflow benchmarking.
