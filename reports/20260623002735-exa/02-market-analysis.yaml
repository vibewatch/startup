    - AI platform, product, and research teams
    - Core market
  - - Protocol and integration layer
    - MCP connectors, framework tools, IDE integrations, and deployment packaging around public-web retrieval
    - Generic integration middleware that does not ship retrieval itself
    - Developer-tool teams and enterprise AI platform owners
    - Important enabling layer
  - - Enterprise internal retrieval
    - Secure search across private docs, SaaS systems, and permission-aware knowledge bases
    - Fresh public-web grounding as a service
    - Enterprise IT and knowledge-management owners
    - Adjacent but excluded
  - - General search/vector platforms
    - Broader search, analytics, vector DB, or site-search platforms used to build in-house retrieval stacks
    - Hosted public-web retrieval revenue unless separately packaged
    - Platform engineering and data infrastructure owners
    - Adjacency and substitute pressure
  notes: Boundary centers on paid public-web retrieval infrastructure for agents; adjacent internal-search and generalized retrieval platforms are shown only to prevent TAM inflation.
