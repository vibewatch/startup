  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-opacity
    missingEvidence: Detailed cap table, liquidation preferences, secondaries, option-pool changes, and any debt or hardware commitments tied to the latest round.
    whyItMatters: Headline valuation can materially overstate common-equity value when downside protections or side letters are heavy.
    diligencePath: Request stock purchase agreements, cap-table model, debt schedule, and any board financing memo.
    relatedQuestionRefs:
    - QV007
    - QV023
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Board-reported 2025 actual revenue, current 2026 run rate, NRR, gross retention, top-customer mix, and contract discounting.
    whyItMatters: The recommendation stays at track because no public source closes the gap between product traction and investable revenue quality.
    diligencePath: Request finance pack with cohort retention, top-20 accounts, and product-level revenue bridge.
    relatedQuestionRefs:
    - QV008
    - QV021
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Blended and endpoint-level gross margin plus key crawl, compute, and support cost drivers.
    whyItMatters: Without unit-economics proof, a premium valuation can hide value-destructive growth.
    diligencePath: Request margin bridge by product line and reconcile it to traffic, query, and compute metrics.
    relatedQuestionRefs:
    - QV011
    - QV021
    - QV022
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: competitive-benchmark
    missingEvidence: Independent benchmark data on recall, latency, switching behavior, and second-source usage across Exa, Perplexity, Tavily, Brave, and internal bundles.
    whyItMatters: Multiple compression risk depends on whether Exa is structurally better or merely early in a hot category.
    diligencePath: Run neutral benchmark tests and customer references before treating the premium multiple as durable.
    relatedQuestionRefs:
    - QV024
    - QV025
    relatedTableRefs:
    - TV004
    - TV005
