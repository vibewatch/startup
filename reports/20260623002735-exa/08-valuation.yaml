- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Side
  - Argument
  - Evidence anchor
  - What would change the view
  rows:
  - - Thesis
    - Real customer embedment suggests Exa is infrastructure, not demo ware.
    - OpenRouter, monday.com, and Cognition case studies plus 5,000+ company claim.
    - Independent retention, concentration, and expansion data would strengthen conviction.
  - - Thesis
    - Blue-chip investors keep financing risk low in the near term.
    - a16z, Lightspeed, Benchmark, YC, and the $250M Series C.
    - Cap-table transparency and use-of-proceeds discipline would improve comfort.
  - - Thesis
    - Usage-based pricing can scale with agent adoption if search remains differentiated.
    - Public pricing and documented product breadth across search, contents, answer, and agent.
    - Gross-margin proof by product line would make the model easier to underwrite.
  - - Anti-thesis
    - Current price already discounts a huge amount of future success.
    - ~220x the last public revenue estimate and richer than the peer set.
    - A materially larger current revenue base could neutralize this objection.
  - - Anti-thesis
    - Infrastructure intensity may cap long-run economics.
    - GPU cluster and vector-database disclosures plus analyst warnings on cost base.
    - Endpoint-level contribution margin data could rebut the concern.
  - - Anti-thesis
    - Search budgets may get more swappable as peers and bundles mature.
    - Perplexity, Glean, and public pricing transparency across the category.
    - Neutral benchmark win rates and durable NRR would reduce commoditization fear.
  notes: Rows frame what must be true for the current price to work and what specific diligence could falsify either side.
