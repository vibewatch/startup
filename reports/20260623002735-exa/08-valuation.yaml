- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Operating assumptions
  - Valuation / return logic
  - Probability signal
  - Key risks
  rows:
  - - Bull
    - Revenue scales toward roughly $120M-$160M with strong expansion, cleaner enterprise controls, and credible margin improvement.
    - At ~18x-25x forward revenue, value lands around $2.2B-$4.0B, which finally supports or exceeds today's mark.
    - Would require private data showing revenue quality already far ahead of public estimates.
    - Execution miss, bundle pressure, or weak margin conversion can break the case.
  - - Base
    - Growth stays strong but lands closer to roughly $60M-$90M revenue with solid, not elite, software economics.
    - At ~12x-16x, value lands around $0.7B-$1.4B, implying limited or negative upside from today's price.
    - 'Most consistent with current public evidence: good company, incomplete economics, normalizing multiples.'
    - Current round buyers may be overpaying for eventual quality.
  - - Bear
    - Revenue scales slowly, retention is mixed, or gross margin disappoints as search becomes more substitutable.
    - At ~6x-10x on roughly $25M-$40M revenue, value lands around $0.2B-$0.4B and points to flat/down financing.
    - This becomes more likely if management cannot prove economics in the next diligence cycle.
    - Down-round risk, morale damage, and cap-stack complexity all rise.
  notes: Ranges are judgmental but anchored to the comp set rather than to a DCF false-precision exercise.
