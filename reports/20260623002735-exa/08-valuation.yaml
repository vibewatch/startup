- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current call
  - Why
  - Decision implication
  rows:
  - - Recommendation
    - track
    - Company quality is promising but the public operating record is too thin for a priced yes.
    - Keep live diligence coverage; do not anchor on the Series C price.
  - - Confidence
    - medium
    - Direction of the call is clear, but it rests on partial public economics.
    - Upgrade only after private revenue, margin, and retention review.
  - - Risk rating
    - high
    - Compute intensity, competition, and missing cap-stack terms create asymmetric downside.
    - Require deeper diligence before any new-money decision.
  - - Valuation stance
    - expensive
    - ~220x the last public revenue estimate is richer than the current public and private comp set.
    - A lower entry price or much better private data is needed.
  - - Decision implication
    - watchlist only
    - Exa is worth following closely because the company may outgrow the current skepticism.
    - Engage only if diligence or price moves materially in the investor's favor.
  notes: 'Recommendation is intentionally price-sensitive: the table separates company-quality support from entry-price support.'
