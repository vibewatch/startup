company:
  name: Exa
chapter:
  number: 8
  title: Valuation
  summary: Exa is easier to like than to price. The public record supports a track recommendation with medium confidence, high risk, and an expensive valuation stance because the 2026 $2.2B Series C mark materially outruns the last public revenue proxy and still sits above a broad peer set on public evidence.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: |-
    Exa looks investable as a company before it looks investable at the current price. The positive side of the record is unusually strong for a private AI-search infrastructure startup: a $250 million Series C at a $2.2 billion valuation, a blue-chip syndicate, over 5,000 company customers, roughly 400,000 developers, and public customer references that show real workflow embedment rather than vague logo slides. The problem is that the public operating record still trails the financing record. Sacra's last public revenue estimate was only about $10 million in 2025, public sources do not disclose gross margin, burn, retention, or concentration, and no reviewed source discloses the preference stack or secondary overhang.

    At that backdrop, the right recommendation is track, not buy. The latest round price asks an outside investor to pay for a future where Exa rapidly scales into a far larger revenue base, keeps enough product edge to resist bundling pressure, and proves software-like economics despite a compute-heavy cost structure. Public evidence does not yet clear that bar. A disciplined investor should treat $2.2 billion as a headline reference rather than as fair value, and should only lean in if private diligence shows revenue, retention, and margin quality materially ahead of the public proxy set.
  claimRefs:
  - CV001
  - CV003
  - CV005
  - CV014
  - CV016
