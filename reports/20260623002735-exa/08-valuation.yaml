- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue proof misses the fair-value hurdle
    - Management cannot show a believable path into at least high-double-digit millions of revenue soon enough to justify the current mark.
    - Breaks the argument that operating proof will catch up with financing momentum.
    - Step back unless price resets materially lower.
  - - Unit economics stay opaque or weak
    - Gross margin and contribution margin remain thin or deteriorate after deeper diligence.
    - Turns a product winner into a capital sink.
    - Do not underwrite the current price.
  - - Retention / concentration disappoints
    - Top customers dominate spend or expansion is weaker than the growth narrative implies.
    - Makes usage-based monetization less durable than the bull case assumes.
    - Re-rate to avoid unless price compensates for the risk.
  - - Search becomes more swappable
    - Neutral benchmarks show little lasting quality edge versus peers or bundled alternatives.
    - Compresses both growth expectations and valuation multiples.
    - Treat the business more like a commodity API vendor.
  - - Financing reset or adverse cap-stack surprise
    - Next financing, secondary, or internal mark sits below the Series C or shows heavy downside protection.
    - Signals that current headline valuation overstates common-equity value.
    - Pause and re-underwrite from the new terms, not from the old headline.
  notes: Triggers are deliberately tied to measurable operating or financing events rather than to generic unease.
  claimRefs:
  - CV031
  - CV032
  - CV034
  - CV037
  - CV040
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue bridge
    - Board or management bridge from 2025 actual revenue to current 2026 run rate by product and customer cohort.
    - This is the core missing input behind the valuation debate.
    - Request CFO package or data-room export before any IC vote.
  - - Gross margin and unit economics
    - Blended and product-level margin, including crawl, inference, and support costs.
    - Without this, growth quality cannot be priced.
    - Request finance / infra cost deck and reconcile to usage metrics.
  - - Retention and concentration
    - NRR, gross retention, logo concentration, and top-20 customer revenue share.
    - A premium multiple only works if customers expand durably and concentration is manageable.
    - Request cohort table plus top-account schedule.
  - - Cap table and preferences
    - Liquidation preferences, participating rights, secondaries, option pool, and any debt or hardware commitments.
    - Headline valuation can overstate common-equity value if protections are heavy.
    - Request cap table, stock purchase agreement, and debt schedule.
  - - Competitive proof
    - Neutral benchmark win rates, churn reasons, and second-source vendor usage.
    - Needed to judge whether Exa is differentiated or merely early in a hot category.
    - Run reference calls and benchmark the workload against peer vendors.
  notes: These asks are gating items, not nice-to-have polish; each one can change the valuation stance.
