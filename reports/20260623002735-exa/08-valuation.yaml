- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Scale metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Exa (2026 Series C)
    - Sacra estimated ~$10M 2025 revenue
    - ~220x implied post-money / estimated revenue at $2.2B private valuation
    - Direct price under review.
    - Revenue proxy is third-party and preference stack is undisclosed.
  - - Perplexity (2025 private round)
    - ~$200M ARR per TechCrunch; Sacra later estimated $500M annualized revenue in 2026
    - $20B valuation; roughly ~100x on the ~2025 ARR proxy
    - Closest AI-search growth comp with clear investor appetite.
    - Consumer/product mix and scale are much larger than Exa's public record.
  - - Glean (2025 Series F)
    - '>$100M ARR at round; $300M annualized revenue by May 2026'
    - $7.2B valuation; roughly ~72x on the disclosed ARR milestone
    - Useful private comp for search-plus-agent workflow enthusiasm.
    - Enterprise-search product is more internal-data oriented than Exa.
  - - Datadog (public)
    - FY2025 revenue ~$3.43B
    - ~23x market cap / revenue in June 2026
    - High-quality public infra-software ceiling for premium multiples.
    - Much larger scale and broader platform than Exa.
  - - Elastic (public)
    - FY2026 revenue ~$1.74B
    - ~3.5x market cap / revenue in June 2026
    - A lower-multiple search/retrieval benchmark with public filings.
    - Mature public company with a very different product mix and growth profile.
  notes: Private rows use disclosed valuations and ARR/revenue milestones; public rows use June 2026 market caps and latest SEC filing-derived revenue.
