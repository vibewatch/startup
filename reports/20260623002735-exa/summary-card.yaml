  topStrengths:
    - >-
      Exa appears to own meaningful technical differentiation by operating its own crawling, indexing, embedding,
      vector, and agent-orchestration stack rather than a thin wrapper around legacy search.
    - >-
      Public adoption signals are strong, with 5,000-plus companies, about 400,000 developers, and named workflow
      embedment at customers such as HubSpot, monday.com, OpenRouter, and Cognition.
    - >-
      The May 2026 $250 million Series C and blue-chip syndicate materially reduce near-term financing risk and give
      management room to scale infrastructure and go-to-market.
  topRisks:
    - >-
      Public disclosure still does not support underwriting because audited revenue, ARR, gross margin, NRR, burn,
      concentration, and cap-stack terms remain undisclosed.
    - >-
      The $2.2 billion valuation implies an extremely rich multiple versus the last public revenue proxy and versus both
      private and public comparison points.
    - >-
      Privacy defaults, enterprise-only zero-data-retention controls, and an infrastructure-heavy operating model create
      operational and procurement risk if product controls and unit economics do not mature with growth.
  unresolvedGaps:
    - Board-approved 2025 and current-year revenue, ARR, and gross-margin data by major product line.
    - >-
      Top-customer concentration, renewal behavior, net revenue retention, and paid-versus-free conversion across the
      claimed 5,000-plus company base.
    - >-
      Current cap table, liquidation preferences, secondary liquidity, debt, and option-pool terms around the 2026
      Series C.
    - >-
      Exact headcount, leadership depth below the founders, and the operative enterprise DPA or default retention
      configuration for sensitive workloads.
