  - id: TP003
    title: 定价 / 打包比较
    columns:
      - 厂商
      - 公开入门价 / 单位
      - 合同模式
      - 公开包含项
      - 公开未知项
      - 含义
    rows:
      - - Exa
        - Search 请求 $7 / 1k；Deep Search $12；Deep-Reasoning $15；Agent 起价 $0.012 / 请求
        - 按量 credits + 企业定制
        - Search、contents、monitors、answer 和 agent 工具
        - 实际企业折扣和承诺消费下限未公开
        - 对开发者足够透明，但不明显是最便宜的直接同业
      - - Tavily
        - 每月免费 1,000 credits；PAYG 每 credit $0.008
        - 基于 credit 的自助 + 企业定制
        - Search、research 及相关 API 使用
        - 各端点 credit 到工作负载的换算没有在一张标准化卡片中完全公开
        - 容易试用，降低早期团队切换成本
      - - Brave Search API
        - 每月 $5 免费 credits；Answers $4 / 1k 请求 + token 费用
        - 自助 + 企业定制
        - 独立索引、回答层、引用、OpenAI SDK 兼容
        - 每个搜索端点或存储权利的精确标准化成本因计划而异
        - 低公开入门价加大 Exa 的比价压力
      - - SerpAPI
        - 每月免费 250 次搜索；$25 / 1k；$75 / 5k；$150 / 15k；$275 / 30k
        - 月度自助计划 + 企业定制
        - 引擎覆盖广度、ZeroTrace、SLA 支持的企业升级
        - 仅看定价，无法明确与独立索引质量比较
        - 当覆盖广度比召回质量更重要时，简单自助阶梯有吸引力
      - - Perplexity
        - Search API 请求 $5 / 1k；Sonar 和 Agent API 按 tokens 与工具另行定价
        - 基于 token 的 API 定价 + 直接提供商成本转嫁
        - 原始搜索、Sonar 回答模型、Agent API 工具、MCP、OpenAI 兼容
        - 企业折扣和每个已回答任务的实际混合成本仍不透明
        - 适合买方把搜索和回答生成放在一起采购
      - - Google Custom Search
        - 仅限现有客户，最高 10k / 天，$5 / 1k 查询
        - 传统按量付费 API
        - 每天 100 次免费查询和标准监控
        - 不对新客户开放，并将在 2027 年关闭
        - 传统低价不如 Google 更宽的依据化捆绑重要
      - - Algolia / Elastic / Glean
        - 多为定制或按工作负载定价；Algolia 公开请求和爬取费用，Glean 为定制
        - 销售主导合同或云计量
        - 自有数据相关性、分析、治理或托管平台功能
        - 企业部署没有同口径公开成本卡
        - 这些替代品拼的是更宽工作流或数据栈 ROI，不是原始搜索调用价格
    notes: 各厂商公开定价单位并不完全标准化；本表比较开发者或采购团队在定制谈判前实际能看到的内容。
