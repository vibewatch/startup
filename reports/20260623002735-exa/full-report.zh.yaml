  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - Search API
        - 核心检索端点，按用量售卖
        - 每 1k 次请求
        - 基础 $7；超过 10 条结果后，额外结果收 $1
        - 标价清晰；实际收益率未知
        - 提供头部客群每 1k 次搜索的混合实际 ARPU
      - - Deep / Deep-Reasoning Search
        - 更高投入的综合搜索模式
        - 每 1k 次请求
        - deep $12；deep-reasoning $15
        - 高价用量 SKU；模型工作更多，毛利率未知
        - 披露 deep 查询占比，以及每次请求的计算成本
      - - Contents / Answer
        - 检索加页面提取 / 有出处答案
        - 每 1k 个页面或每 1k 次请求
        - 每 1k 个页面 $1；Answer 每 1k 次请求 $5
        - 有用的附加产品；抓取和推理成本可能波动
        - 展示附加率、每次查询平均页面数和毛利率
      - - Agent
        - 异步深度研究和增强
        - 每次运行，另加 ACU 和搜索工具调用
        - 每次运行 $0.012-$2.00，另加 $0.10/ACU 和 $0.005/search
        - 工作负载潜在价值高，但对计算成本高度敏感
        - 按 effort 层级分享平均 ACU、搜索调用和实际毛利率
      - - Monitors / Websets
        - 周期性搜索、列表构建和增强
        - 定时运行 / 异步任务
        - Monitors 在公开页面标价；Websets 定位为增强工作流
        - 靠周期性和 GTM 用例扩大钱包份额
        - 披露留存、重复运行量和合同打包方式
      - - Enterprise overlays
