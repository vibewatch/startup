      - number: '7.5'
        title: 缓释措施、监控指标与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              Exa
              风险画像中令人鼓舞的一点是，许多最高严重度问题可以监控。公司已经暴露出一些正确的控制面：公开状态页、明确速率限制、企业安全文档、信任中心，以及足够坦诚、能看出默认项薄弱处的隐私政策。关键是把这些披露转化为尽调要求和触发器，而不是把它们当成安慰性声明。在承销一轮成长期融资前，投资人应坚持拿到已签署
              DPA 和企业条款、按产品面划分的正常运行时间 / SLA 历史、云和 GPU 供应商集中度、头部客户收入占比、毛利率桥，以及能证明创始人以下领导层纵深的组织架构图。


              论点会在三类事件任一发生时破裂。第一，隐私和数据使用控制跟不上企业采用——例如，受监管客户需要 Exa 最深的实时检索功能，却只能通过关闭这些功能来获得合规行为。第二，公司的基础设施杠杆反噬——持续事故、GPU
              / 云瓶颈，或利润率压缩迫使收入基数成熟前继续融资。第三，客户证据无法从少数前沿 AI 工作流中多元化，同时 incumbents 把搜索更原生地嵌入产品。如果这些事件没有发生，Exa 仍可能作为 agent
              栈核心层继续复利；如果发生，估值下行会很陡，因为当前故事已经预设其成为品类领导者。
