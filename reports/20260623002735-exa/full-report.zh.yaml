        - Brave、SerpAPI、Glean、Google 和 Elastic 都发布合规、SLA 或治理声明
        - 中高
        - 按信任要求拆解已赢单交易，并要求审计范围对比，而不只是认证 logo
      - - 通过 SDK 和 MCP 做开发者分发
        - OpenAI 兼容和 any-search-API 抽象让改写比传统 SaaS 更轻
        - 高
        - 按 SDK 或 MCP 进入路径衡量队列留存，并识别第二供应商采用从哪里开始
      - - 公司搜索等垂直扩展
        - Google、Glean、Elastic 和内部自建可以满足许多自有数据或企业图谱用例，而不必匹配 Exa 的精确产品形态
        - 中
