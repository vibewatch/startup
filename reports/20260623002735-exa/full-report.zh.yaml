        - 已为集群扩张融资；现有 224 块 GPU 足迹
        - 采购合同、租赁条款和备用采购来源未公开
      - - 智能体和 IDE 分发
        - Claude、Cursor、VS Code、Codex、Gemini CLI、MCP 客户端
        - 流量和开发者采用入口
        - 中高
        - 连接器政策或协议变化削弱分发，或推高支持成本
        - 中高
        - 托管 MCP 端点和广泛生态支持
        - Exa 不控制第三方客户端用户体验或默认位置
      - - 智能体平台客户
        - OpenRouter / Cognition / monday.com 及类似设计伙伴
        - 使用量、标杆背书和工作流嵌入
        - Unknown
        - 少数大型 AI 原生账户主导增长，或同步流失
        - 高
        - 多个工作流里的具名证据
        - 未公开集中度、留存或 ACV
      - - 支付和开票
        - Stripe / 企业应付账款流程
        - 额度购买和账户连续性
        - 中
        - 支付失败或支出控制错配中断工作负载
        - 中
        - 自动充值和企业发票计费路径
        - 公开文档没有展示任务关键型计费兜底条款
    notes: 交易对手来自公开文档、客户故事和新闻报道的推断；集中度百分比大多未披露。
