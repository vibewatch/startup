        - stage: Embed
          label: 客户把 Exa 接入 CRM、编码、GTM、研究或法律情报工作流
        - stage: Operationalize
          label: 用途扩展到监控、富集或多步骤智能体编排
        - stage: Standardize
          label: 企业控制、议价账单和支持比自助额度更重要
        - stage: Expand
