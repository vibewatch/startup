      - number: '5.4'
        title: 信任、隐私、合规与技术结论：有意义的控制存在，但范围受限且有条件
        blocks:
          - type: paragraph
            body: >-
              Exa 的信任故事好过「一家有搜索 API 的 AI 初创公司」，但买家需要仔细读限定条件。安全文档称 Exa 获得 SOC 2 Type II 认证，并引导买家访问 trust
              center；企业方案可解锁零数据留存和 HIPAA 支持。HIPAA 文档的具体性很有用：合规模式不是覆盖每条产品路径的总开关，而是面向 eligible teams 的门控模式，只在受限 /search 和
              /contents flows 上工作，拒绝 livecrawl 和 summary-heavy paths，并在请求需要非 HIPAA-safe processors 时 fail
              closed。这种精确性是正面信号，因为它说明 Exa
              在把控制映射到精确请求路径，而不是把合规营销成泛平台覆盖。隐私政策构成反向砝码。它明确警告用户不要把个人信息作为查询数据提交，说明查询数据可用于改进产品并训练或微调模型，并把 business-offering
              processor data 放进客户协议。对企业承保来说，这意味着 Exa 可以支持敏感工作流，但只有买家处于正确方案、配置正确，并且认可这些模式之外的默认查询处理符合内部政策时才成立。技术上，Exa
              看起来有差异化；流程上，信任和部署仍需要合同级尽调。
