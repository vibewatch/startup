      - number: '2.2'
        title: 规模测算视角与需求信号
        blocks:
          - type: paragraph
            body: >-
              公开证据支持多个规模测算视角，但没有一个干净的 TAM。审阅材料中最佳相邻市场研究是 Grand View Research 的企业搜索报告：该报告测算 2023 年市场为 $4.9B，并到 2030 年增长至
              $8.9B；这适合作为外层相邻市场，不适合作为 Exa 的 TAM，因为它主要计算内部知识检索和安全企业搜索。直接品类证据反而来自供应商自身的运营数据和单位经济。Exa 定价覆盖每千次搜索类请求 $7 至
              $15、每千页内容抽取 $1，以及每次 agent 运行最高 $2。Tavily 和 Brave 都发布了低摩擦入门定价、大规模用量或索引口径；Google 则展示了较老 programmable-search
              基线的样子。合在一起，这些视角证明 agent 工作流内的公开 Web 检索存在真实且增长的收入池，但在没有内部合同、用量或 cohort 数据前，分析师无法为 Exa 隔离出一个中立的独立 SAM。
