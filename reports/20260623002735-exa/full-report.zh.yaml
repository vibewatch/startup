  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Exa 作为公司看起来可投，但按当前价格还未到可投。记录中的正面部分，对于一家私有 AI 搜索基础设施初创公司来说异常强：$250 million Series C、$2.2 billion
              估值、蓝筹投资财团、超过 5,000 家公司客户、约 40 万名开发者，以及公开客户引用，显示真实工作流嵌入，而不是模糊的 logo 幻灯片。问题是，公开运营记录仍落后于融资记录。Sacra
              最后一次公开收入估计仅约 $10 million（2025 年），公开来源没有披露毛利率、烧钱、留存或集中度，也没有任何已审阅来源披露优先股结构或二级市场悬顶。


              在这个背景下，正确建议是跟踪，而不是买入。最新一轮价格要求外部投资人付费购买一个未来：Exa
              迅速放大到远大得多的收入基数，保有足够产品边缘来抵御捆绑压力，并在计算密集成本结构下证明类似软件的经济性。公开证据尚未跨过这条线。纪律性投资人应把 $2.2 billion
              当成标题参考，而非公允价值；只有当私下尽调显示收入、留存和利润率质量显著领先公开代理集合时，才应加码。
