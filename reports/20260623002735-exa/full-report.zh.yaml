          - type: paragraph
            body: >-
              Exa 的风险栈不是单一的生死缺陷，而是四个相互咬合的问题。第一，公司的默认隐私和 IP 姿态比很多企业买家预期更宽松：公开隐私政策写明，查询数据可用于改进产品和微调模型；公开安全文档则把 Zero Data
              Retention 和 HIPAA 控制限定在企业版，覆盖面也窄于完整产品。第二，公司的核心优势来自自建爬取、索引、向量数据库和 GPU 机群，技术上亮眼，但经济和运营负担都重。第三，公开客户证据很强，却偏向前沿
              AI 构建者和 agent 工具；即便 Exa 声称已有 5,000 多家公司、40 多万名开发者，依赖和集中度疑虑仍在。第四，围绕 AI
              训练、检索和网络级内容使用的监管与版权边界，变化速度快过公司的公开法律披露。


              实际含义是，Exa 更像高上行空间、高经营杠杆的基础设施。公司确有缓释资产——SOC 2 Type
              II、企业隐私控制、信任中心，以及多次聘请外部法律顾问——但这些缓释并未完全内置为自助产品默认项，公开记录也仍缺少 DPA 细节、事件指标、收入集中度、利润率披露和领导层纵深可见度。投资人要问的不是 Exa
              有没有产品市场信号；它有。真正的问题是，隐私控制、法律卫生、资本纪律和依赖管理，是否能像采用率和估值一样快地成熟。
