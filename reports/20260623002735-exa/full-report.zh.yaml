      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开的创始人故事连贯，而且与 Exa 的产品 thesis 异常契合。Will Bryk 是联合创始人兼 CEO，拥有哈佛计算机科学和物理学背景，曾在 Cresta 做工程。Jeff Wang
              在哈佛学习计算机科学和哲学，之后在 Plaid 做数据和 Web 基础设施。官方和投资人材料都把两人呈现为长期合作者，在创办 Exa
              前已经一起做过搜索项目。这让公司在检索质量、系统工程和开发者工作流设计交汇的产品上具备很强的 founder-market fit。


              治理图景要薄得多。公开来源明确显示 Peter Fenton 在 2025 年 9 月 Series B 后加入董事会、Sarah Wang 在 2026 年 5 月 Series C
              后加入董事会，但审阅过的官方页面没有发布完整董事会名单、所有权结构或接班计划。招聘和关于页面展示了一批技术员工，却没有披露创始人之下的完整高管团队。因此，董事会控制权、管理层厚度，以及 Bryk
              过高的可见度是否在招聘、融资和产品方向上形成关键人集中，仍是尽调问题。
