      - number: '1.3'
        title: 融资历史与估值路径
        blocks:
          - type: paragraph
            body: >-
              Exa 的资本历史像快速上楼梯。2024 年 7 月，公司宣布完成 $22M 种子轮加 Series A，其中 Series A 部分报道为 $17M，由 Lightspeed 领投，NVentures 和 Y
              Combinator 参投。2025 年 9 月，Exa 以 $700M 估值完成 $85M Series B，由 Benchmark 领投；这一轮也正式确立 Peter Fenton 的董事席位，并资助更大的
              GPU 集群和更广泛招聘。2026 年 5 月，Exa 宣布以 $2.2B 估值完成 $250M Series C，由 Andreessen Horowitz 领投，老股东
              Benchmark、Lightspeed 和 Y Combinator 也参与。


              这条路径意味着截至 2026 年 5 月，已披露累计融资约 $357M；从 Series B 到 Series C 不到一年，估值上调略高于 3 倍。融资轨迹亮眼，但公开市场数据服务跟进不均：Sacra 仍只显示
              $107M 融资，因为其快照停在 Series B，说明高速发展的私营公司很容易让第三方数据过时。公开来源也未披露债务、二级流动性、优先权栈、pro-rata
              权利或完整股权表。因此，即便头部轮次序列表面动能强，治理和经济条款仍需要私下确认。
