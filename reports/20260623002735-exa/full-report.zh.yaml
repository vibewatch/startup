      - CV024
      - CV025
      - CV026
      - CV027
  - id: TV005
    title: 投资论点破裂和退出触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入证明达不到公允价值门槛
        - 管理层无法展示一条可信路径，让收入足够快地进入至少高双位数百万美元，从而支撑当前标记。
        - 打破“经营证明会追上融资动能”的论点。
        - 除非价格大幅下调，否则后退。
      - - 单位经济性仍不透明或偏弱
        - 深入尽调后，毛利率和贡献利润率仍偏薄或恶化。
        - 把产品赢家变成资本黑洞。
        - 不承保当前价格。
      - - 留存 / 集中度令人失望
        - 头部客户主导支出，或扩张弱于增长叙事暗示。
        - 让按用量变现的耐久性低于牛市情景假设。
        - 重新评级为回避，除非价格补偿风险。
      - - 搜索变得更容易替换
        - 中性基准测试显示，相对同业或捆绑替代品几乎没有持久质量优势。
        - 同时压低增长预期和估值倍数。
        - 按大宗商品化 API 供应商重新看待这家公司。
      - - 融资重估或资本结构出现反向意外
        - 下一轮融资、二级交易或内部估值低于 Series C，或显示出很强的下行保护。
        - 说明当前名义估值夸大了普通股价值。
        - 暂停推进，按新条款而非旧名义估值重新承销。
    notes: 触发项刻意锚定可衡量的运营或融资事件，而不是泛泛的不安。
    claimRefs:
      - CV031
      - CV032
      - CV034
      - CV037
      - CV040
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥接
        - 董事会或管理层按产品和客户 cohort 拆分，从 2025 年实际收入桥接到当前 2026 年收入 run rate。
        - 这是估值争议背后最核心的缺失输入。
        - 任何 IC 投票前，先索取 CFO 材料或 data room 导出。
      - - 毛利率与单位经济
        - 混合口径和产品级毛利率，包括抓取、推理和支持成本。
        - 没有这些，就无法给增长质量定价。
        - 索取财务 / 基础设施成本材料，并与使用量指标对账。
      - - 留存与集中度
        - NRR、毛留存、logo 集中度和前 20 大客户收入占比。
        - 只有客户能持续扩张且集中度可控，高倍数才站得住。
        - 索取 cohort 表和头部账户清单。
      - - 资本结构与优先权
        - 清算优先权、参与权、二级交易、期权池，以及任何债务或硬件承诺。
        - 如果保护条款很重，名义估值可能夸大普通股价值。
        - 索取 cap table、股份购买协议和债务清单。
      - - 竞争证明
        - 中立基准下的胜率、流失原因和第二供应商使用情况。
        - 需要判断 Exa 到底有差异化，还是只是卡在热门品类的早期位置。
        - 做客户访谈，并把该工作负载与同业供应商跑基准。
    notes: 这些问题是闸门项，不是锦上添花；每一项都可能改变估值立场。
    claimRefs:
      - CV014
      - CV029
      - CV031
      - CV038
      - CV042
figures:
  - id: FO001
    title: Exa — 资本与产品拐点时间线
    type: timeline
    layout: wide
    summary: 高层次梳理 Exa 从创立、改名、产品发布到融资推进的历程，覆盖至 2026 年 6 月报告生成日。
    data:
      items:
        - label: 以 Metaphor 名义创立
          date: '2021'
          detail: Bryk 和 Wang 在旧金山创办公司，围绕从零搭建搜索的论点起步。
          tone: positive
        - label: YC + 种子轮支持
          date: '2021'
          detail: 早期种子资金和加速器支持为公司提供了第一批机构基础。
          tone: positive
        - label: 首个搜索引擎上线
          date: 2022-11
          detail: 管理层后来称，首个搜索引擎在 2022 年 11 月上线。
          tone: positive
        - label: 转向 AI API
          date: 2023-early
          detail: Exa 转向为 AI 产品和智能体提供网页搜索 API。
          tone: positive
        - label: 改名为 Exa
          date: '2024-01-25'
          detail: Metaphor 更名为 Exa，并推出 Highlights，以支持更丰富的检索。
          tone: positive
        - label: 宣布 Series A
          date: '2024-07-16'
          detail: 种子轮 + Series A 合计 $22M 融资，由 Lightspeed 领投。
          tone: positive
        - label: Series B + 董事席位
          date: '2025-09-03'
          detail: 以 $700M 估值融资 $85M；Peter Fenton 加入董事会。
          tone: positive
        - label: Websets 牵引
          date: 2025-09
          detail: 投资人更新重点展示 Websets 在招聘和市场研究场景中的用例。
          tone: neutral
        - label: Exa Deep 发布
          date: '2026-03-04'
          detail: 改版后的 Deep 增加结构化输出和有出处支撑的引用。
          tone: positive
        - label: Series C + 隐私尽调
          date: 2026-05 to 2026-06
          detail: 以 $2.2B 估值融资 $250M；随后，公开舆论开始审视其线上隐私政策中的数据留存限制条件。
          tone: risk
