      - - 既有平台捆绑
        - Google Grounding 和企业搜索平台可以把检索藏进更大的 AI、云或工作流预算
        - 高
        - 跟踪 Exa 何时被作为单独项目评估，何时被买方已批准的捆绑方案替代
