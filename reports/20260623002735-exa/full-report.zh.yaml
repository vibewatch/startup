            body: >-
              公开来源对基础设施野心异常清楚，对实际利润率则异常稀薄。Exa 拥有爬取、索引、嵌入、向量数据库和查询层，管理层称系统追踪超过 500B 个 URL。公司还披露了一个 $5M 的 144-H200
              集群，几乎连续运行；加上更早的 80-A100 机群，已安装 GPU 总数达到 224。向量数据库文章称，这种设计在承载数十亿向量、低于 100 毫秒检索和超过 500 QPS 的同时，把云向量数据库成本削减约
              10 倍。这些是有意义的效率信号，但它们没有揭示毛利率，因为交付仍取决于实时爬取新鲜度、内容广度、reranking 和 agent 算力强度。正确解读是，Exa
              很可能拥有很强的内部成本优化人才，但在管理层披露端点级贡献利润率，或至少披露混合毛利率区间之前，利润率路径仍是尽调事项。
