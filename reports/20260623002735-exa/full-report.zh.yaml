  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：直接 API 同行、有 grounding 能力的巨头、企业搜索替代品与内部自建
        blocks:
          - type: paragraph
            body: >-
              Exa 的直接同行集合很窄，但非常真实。Tavily、Brave Search API、SerpAPI 和 Perplexity Sonar 都向开发者销售把当前 Web 上下文带进 AI
              产品的方式，而且四者现在都从普通结果扩展到更丰富的 agent 或答案工作流。Tavily 把搜索、抽取、研究和爬取打包进一个 API；Brave 销售独立索引、答案生成和 OpenAI 兼容表面；SerpAPI
              竞争点在引擎广度和 wrapper 便利性；Perplexity 则把搜索与答案生成和来源控制打包。


              替代品集合比直接同行更宽。Google 的传统 Custom Search API 在收缩，但 Google 同时通过 Grounding、Agent Search 和更广的 Gemini
              平台工具抬高门槛。Glean、Algolia 和 Elastic 从企业边界内部切入，而不是从实时公开 Web 索引切入；当预算负责人更重视权限、自有数据或既有部署足迹而不是开放 Web recall
              时，它们就是可信替代品。内部自建同样可行，因为 LangChain 这类编排层已经让团队可替换模型和检索后端，不必永远绑定一家垂直整合供应商。
