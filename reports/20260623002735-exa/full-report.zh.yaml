        - 支撑与 Exa 类似的多层定价栈
      - - Tavily PAYG
        - $0.008
        - 按 credit 计费
        - 面向开发者的入门定价，用 credit 抽象
        - 低门槛上手会推高价格透明度压力
      - - Google 自定义搜索 JSON API
        - $5
        - 每 1,000 次查询
        - 仅面向现有客户的传统可编程搜索基准
        - 可作历史参照，但不是好的前瞻代理指标
    notes: 各厂商计费单位不能直接横比；本表看的是定价结构和工作流定位， 不是干净的同口径毛利率基准。
