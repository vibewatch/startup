      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              审阅到的工作流证据显示，买方基础由软件团队主导，而不是终端用户搜索部门。OpenAI 的 agent 工具和 MCP 生态都默认开发者、产品团队和企业 AI 平台组会把 Web 检索嵌入更大的 agent
              系统。Exa 的 MCP server、Brave 的 skills 仓库、LangChain 的 Tavily 集成，都强化同一模式：第一用户通常是工程师或 agent
              构建者，而不是采购主导的知识管理团队。付款方位于用户上一层。早期支出可能来自开发者主导的产品或实验预算；规模化部署更可能落在 CTO、平台、产品或集中式企业 AI 负责人手中，他们关心治理、SLA
              和多工具集成。采用通常从编码辅助或研究自动化等狭窄工作流开始，通过更好的 grounding 和更少手动浏览证明价值；等治理、权限和可靠性标准满足后，才扩展到更广的企业合同。
