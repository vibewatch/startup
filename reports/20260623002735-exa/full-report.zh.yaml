  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 牛
        - 收入扩张到约 $120M-$160M，扩张强劲，企业控制更干净，利润率改善可信。
        - 按约 18x-25x 远期收入，价值落在 $2.2B-$4.0B，才终于支撑或超过今天的标记。
        - 需要私下数据证明收入质量已经远超公开估算。
        - 执行失误、捆绑压力或利润率转化薄弱都可能打破该情景。
      - - 基准
        - 增长仍强，但收入更接近约 $60M-$90M，软件经济性扎实但并非顶尖。
        - 按约 12x-16x，价值落在 $0.7B-$1.4B，意味着相对今天价格上行有限或为负。
        - 最符合当前公开证据：好公司，经济性不完整，倍数回归正常。
        - 本轮买方可能为最终质量付了过高价格。
      - - 熊
        - 收入扩张缓慢，留存参差不齐，或随着搜索更可替代，毛利率令人失望。
        - 按约 $25M-$40M 收入的 6x-10x，价值落在 $0.2B-$0.4B，并指向平轮 / 下轮融资。
        - 如果管理层无法在下一轮尽调周期证明经济性，该情景会更可能发生。
        - 下轮风险、士气受损和资本结构复杂度都会上升。
    notes: 区间带有判断性，但锚定可比公司组，而不是 DCF 的虚假精确。
    claimRefs:
      - CV016
      - CV023
      - CV025
      - CV027
      - CV034
      - CV035
      - CV036
      - CV037
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 规模指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Exa（2026 Series C）
        - Sacra 估算 2025 年收入约 $10M
        - 按 $2.2B 私有估值，对应约 220x 隐含投后 / 估算收入
        - 直接审查的价格。
        - 收入代理来自第三方，优先权结构未披露。
      - - Perplexity（2025 私募轮）
        - TechCrunch 称 ARR 约 $200M；Sacra 后续估算 2026 年年化收入为 $500M
        - $20B 估值；按约 2025 ARR 代理约 100x
        - 最接近的 AI 搜索增长可比公司，投资人兴趣清晰。
        - 消费者 / 产品组合和规模都远大于 Exa 公开记录。
      - - Glean（2025 Series F）
        - 本轮时 ARR >$100M；到 2026 年 5 月年化收入 $300M
        - $7.2B 估值；按披露 ARR 里程碑约 72x
        - 可作为搜索加智能体工作流热度的私有可比公司。
        - 企业搜索产品比 Exa 更偏内部数据。
      - - Datadog（公开）
        - FY2025 收入约 $3.43B
        - 2026 年 6 月市值 / 收入约 23x
        - 高质量公开基础设施软件的溢价倍数天花板。
        - 规模远大于 Exa，平台也更宽。
      - - Elastic（公开）
        - FY2026 收入约 $1.74B
        - 2026 年 6 月市值 / 收入约 3.5x
        - 低倍数搜索 / 检索基准，有公开申报文件。
        - 成熟上市公司，产品组合和增长画像与 Exa 差异很大。
    notes: 私有公司行使用已披露估值和 ARR/收入里程碑；公开公司行使用 2026 年 6 月市值和最新 SEC 申报收入。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows capture the most decision-useful price anchors for Exa as of the 2026 run date: direct private AI-search
        peers plus two public software/search infrastructure reference points.
    claimRefs:
      - CV016
      - CV019
