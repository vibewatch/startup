  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 正方
        - 真实客户嵌入说明 Exa 是基础设施，不是演示型产品。
        - OpenRouter、monday.com 和 Cognition 案例，加上 5,000+ 公司声明。
        - 独立留存、集中度和扩张数据会增强信心。
      - - 正方
        - 蓝筹投资人让近期融资风险保持低位。
        - a16z、Lightspeed、Benchmark、YC 和 $250M Series C。
        - 股权结构表透明度和募资用途纪律会提高舒适度。
      - - 正方
        - 如果搜索仍有差异化，按用量计价可随智能体采用而放大。
        - 公开定价，以及 search、contents、answer 和智能体的产品广度文档。
        - 按产品线证明毛利率后，模型会更容易承保。
      - - 反方
        - 当前价格已经计入大量未来成功。
        - 约为上一份公开收入估算的 220x，也高于同业组。
        - 如果当前收入基数明显更大，就能中和这条反对意见。
      - - 反方
        - 基础设施强度可能压住长期经济性。
        - GPU 集群和向量数据库披露，加上分析师对成本基础的警示。
        - 端点级贡献利润率数据可以反驳这一担忧。
      - - 反方
        - 随着同业和捆绑套件成熟，搜索预算可能更容易被替换。
        - Perplexity、Glean，以及品类内公开定价透明度。
        - 中性基准测试胜率和耐久 NRR 会降低商品化担忧。
    notes: 各行说明当前价格要成立必须满足什么，以及哪些具体尽调能证伪任一方。
