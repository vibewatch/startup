        title: 收入模式与端点变现
        blocks:
          - type: paragraph
            body: >-
              Exa 变现的是一整套 API primitives，而不是席位授权。公开定价表面显示，Search、Deep Search、Deep-Reasoning Search、Contents、Answer 和
              Agent runs 都直接收费，Monitors 和 Websets 则把同一用量逻辑延伸到经常性或重 enrichment 的工作流。自助用户预付 credits，并随着请求、页面和 agent
              工具调用发生而消耗；企业客户被推向协商定价、发票账单、更高结果数、自定义 QPS，以及零数据留存等安全承诺。因此商业问题不是 Exa
              有没有收费方式，而是标价需求在扣除算力、爬取和支持成本后，能否转成持久的实际毛利。公开客户案例支持客户愿意把 Exa 深度嵌入 agent 化产品，但没有揭示企业合同规模、折扣，或高用量平台交易与长尾开发者支出的
