  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 原因
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 公司质量有吸引力，但公开运营记录太薄，不足以支持按价投资。
        - 保持实时尽调覆盖；不要锚定 Series C 价格。
      - - 信心
        - 中
        - 判断方向清楚，但依赖不完整的公开经济性证据。
        - 只有在审查私下收入、利润率和留存后才上调。
      - - 风险评级
        - 高
        - 算力强度、竞争和缺失的资本结构条款带来不对称下行。
        - 任何新资金决策前，都要求更深尽调。
      - - 估值立场
        - 昂贵
        - 约为上一份公开收入估算的 220x，高于当前公开和私有可比公司组。
        - 需要更低入场价格，或好得多的私下数据。
      - - 决策含义
        - 仅列入观察名单
        - Exa 值得密切跟踪，因为公司可能跑赢当前疑虑。
        - 只有在尽调或价格明显向投资者有利方向移动时才接触。
    notes: 建议刻意对价格敏感：表格把公司质量支撑和入场价格支撑分开。
