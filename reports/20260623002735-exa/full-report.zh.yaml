      - number: '1.5'
        title: 里程碑与不利背景
        blocks:
          - type: paragraph
            body: >-
              Exa 的里程碑显示，公司以罕见速度从搜索引擎 R&D 转向 agent 基础设施：2022 年 11 月首次推出搜索引擎，2023 年初聚焦 API，2024 年 1 月更名为 Exa 并发布
              Highlights，2025 年 9 月完成制度化的 Series B，2026 年 3 月发布改版 Exa Deep，2026 年 5 月完成 $2.2B 估值的 Series
              C。合在一起，这些事件支持一个判断：管理层反复把公司推向价值最高的 agent 工作流，而不是停留在狭窄的语义搜索利基里。


              不利背景更微妙，但有实质影响。第一，Exa 自建爬取、索引和 GPU 栈，经济模型偏重基础设施；即便增长故事为正，仍可能持续烧钱。第二，Sacra 的竞争图谱突出了来自
              OpenAI、Anthropic、Google、Brave、Tavily、Jina 和 Perplexity 的压力，提醒投资人这个品类正处于前沿模型和相邻搜索 API
              的爆炸半径内。第三，隐私政策说明查询数据可用于改进和微调 Exa 模型，而 Zero Data Retention
              被营销为企业专属功能。这不意味着不当行为，但它确实是敏感工作负载的尽调问题，也强化了检查企业合同条款的必要性，而不能默认数据隔离。
