      - number: '7.3'
        title: 运营可靠性与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Exa 的基础设施故事同时是护城河，也是风险放大器。公司称其购入一套 $5 million 的 H200 集群，如今运行合计 224 块 GPU 的机群，几乎 24/7
              运转，并自建专有向量数据库，在数十亿向量中实现低于 100 毫秒延迟和超过 500 QPS
              的搜索。这些技术指标很亮眼，但也意味着业务背着有意义的固定成本承诺、利用率风险，以及横跨爬取、索引、重排、存储、计费和合作伙伴 API 的非平凡故障模式。公开状态历史已经显示，“default” 服务在 2026
              年 6 月 14 日发生过多次短暂停机。计费文档也暴露出客户层面的失败路径：预付额度用完后，请求会被阻断。速率限制文档把自助搜索封顶在 10
              QPS，并把更高吞吐用户推向企业合同。运营上这说得通，但也意味着可靠性不只取决于核心正常运行时间，还取决于权益管理、速率整形和客户账户配置。


              依赖关系又加了一层。TechCrunch 报道称，Exa 一边运营自有 GPU 集群，一边把产品托管在 AWS；公开生态还显示，其进一步依赖托管 MCP 基础设施、支付通道，以及
              LangChain、Browserbase 等合作伙伴集成。公开客户故事清楚表明，Exa 已嵌入 OpenRouter、Cognition 和 monday.com 的关键 agent 工作流。一旦 Exa
              进入这些自动化链条，即便短暂停机或延迟尖峰，也会传导为下游产品故障。因此，正确的尽调视角不是 Exa 能否演示强搜索质量——它可以——而是它是否具备 SRE 成熟度、冗余、云 / GPU 采购纪律和合同
              SLA，能按融资叙事暗示的规模，表现得像任务关键型基础设施供应商。
