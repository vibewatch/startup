    title: 估值敏感性
    type: bar
    layout: standard
    summary: 只有当 Exa 做到大得多的收入规模、且仍守住高溢价倍数时，当前价格才显得合理。
    data:
      items:
        - label: 25x 下所需收入
          value: 88
          unit: USDm
          tone: neutral
        - label: 20x 下所需收入
          value: 110
          unit: USDm
          tone: neutral
        - label: 15x 下所需收入
