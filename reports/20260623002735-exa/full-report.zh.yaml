      - number: '3.3'
        title: 切换成本、多供应商并用与护城河耐久性：Exa 有楔子，但不是封闭赛场
        blocks:
          - type: paragraph
            body: >-
              公开信息里支持 Exa 护城河的最佳论据，不是孤立的搜索 API，而是实时 Web 检索、代码感知搜索、结构化公司搜索，以及通过 SDK 和远程 MCP 进行 agent
              原生分发的组合。开发者想要更少供应商、更快做出生产级 agent 时，这套组合会有价值。它也让 Exa 有可信空间扩展到 GTM enrichment、编码和合规敏感检索等相邻垂直工作流。


              问题在于，现代 AI 栈让多供应商并用异常便宜。Google Grounding 可以坐在任意搜索 API 之上，LangChain 抽象核心模型供应商选择，Brave 和 Perplexity
              都提供降低重写成本的兼容层。竞争对手也在上移：Tavily 现在销售研究工作流，Perplexity 销售 Sonar 加 agent 工具，巨头可以把搜索采购藏进更大的企业 bundle。即便 SerpAPI
              也会改变比较方式，因为团队可保留 wrapper 层，同时替换底层引擎或垂直 SERP 端点。这意味着，只有当 Exa
              的索引质量和垂直扩展显著好于同行时，它的护城河才显得耐久。如果买家越来越把搜索看作可替换组件，那么价格压缩、bundle 压力、内部自建可选性和基于 wrapper
              的第二供应源，都会成为承保风险，而不是边缘情形。
