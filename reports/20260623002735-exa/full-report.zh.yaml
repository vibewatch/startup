    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、改名与运营模式
        blocks:
          - type: paragraph
            body: >-
              Exa 是一家位于旧金山的私营 AI 搜索基础设施公司，成立于 2021 年，最初以 Metaphor 名义推出，2024 年 1 月公开更名为
              Exa。这次改名重要，因为公司叙事从「更好的搜索」转向更大的使命：为 AI 系统组织世界知识。当前产品不是面向消费者的搜索入口，而是 agent 的搜索与检索层：Exa 通过 API 和开发者工具销售 Web
              搜索、内容抽取、答案生成、监控和异步研究工作流。


              运营模式是按用量计费的基础设施。公开价格显示，搜索档位、页面内容检索和 agent 运行按请求收费；企业方案增加更高限额、Zero Data Retention
              等协商控制。官方文档和产品页持续强调延迟、语义检索质量、结构化输出和代码搜索支持，而不是广告。这一点重要，因为它把 Exa 定位为 agent 栈里的「卖铲人」，不是媒体或 SEO
              生意。官方法律页面也把总部锚定在旧金山；公司材料则描述全球招聘足迹，而不是一个规模庞大、逐一列明的办公室网络。
