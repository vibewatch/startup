      - number: '6.4'
        title: 留存与耐久性
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录变薄的地方。没有审阅来源披露净收入留存、总留存、流失、续约率或合同期限，因此留存故事只能从产品嵌入和工作流行为推断，而不是直接测量。正面的结构性信号存在。Exa 不只是单一端点：客户可从
              Search 起步，再扩展到 Contents、Monitors、Agent，以及协商账单和更高用量支持等企业叠层。LangChain 的专用 Exa 集成降低开发者采用摩擦；客户故事也反复把 Exa
              描述为核心运营循环的一部分，而不是一次性实验。但负面信号也真实存在。OpenRouter 的架构显示，搜索可以是更大模型路由产品中的可替换引擎。Humai 和 MakerStack 都认为，当语义质量重要时
              Exa 最好，但在简单或高用量查询上比替代品更贵、更复杂；两者都描述了 routing 或 multi-provider 模式，让多供应商并用常态化。ChatForest
              把风险再推高一层，认为如果模型供应商内置搜索变得「足够好」，整个品类可能被压缩。结果是一个可信但证据不足的耐久性 case：Exa 看起来嵌入重要客户工作流，但公开留存披露缺失，切换成本也显然不是绝对的。
