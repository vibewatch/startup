      - number: '8.4'
        title: 最终尽调问题与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              公司质量与价格质量之间的缺口仍可弥合，但只能靠私下证据。尽调议程应聚焦四个问题：2025 年退出、进入 2026 年时的收入和 ARR
              到底是多少；在爬取、推理和支持成本之后，毛利率是否改善；客户集中度和留存是否支撑高溢价估值假设；新投资人实际会坐在资本结构的哪个位置。没有这些答案，IC 承销的就会是叙事，而不是经济性。


              论点破裂点很具体。如果管理层无法展示可信的近期收入路径，来缩小与当前估值的差距，价格就应被视为过高。如果增长真实但利润率质量薄弱，这一轮仍可能破坏价值。如果下一轮融资或员工流动性事件把定价重置到低于 Series
              C 标记，那会说明公开采用证据不足以撑住私募市场。在尽调补齐这些缺口之前，审慎姿态是保持接近、把公司留在观察名单上，等待更好的证据或更好的入场点。
