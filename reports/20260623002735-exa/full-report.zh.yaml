      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 查询数据风险
        - 默认留存和训练条款
        - 敏感企业层级没有默认仅处理方 / ZDR
        - 合同控制被证明前，不承保受监管工作负载的上行
      - - 可靠性风险
        - 状态事件和 SLA 指标
        - 反复出现客户可见宕机，或没有可信 MTTR/SLO 方案
        - 按企业就绪度薄弱的基础设施重新定价
      - - 资本强度风险
        - 毛利率、GPU 利用率和下一轮资本开支计划
        - 集群支出和云成本上升时，利润率停滞
        - 假设更多稀释和更低终局倍数
      - - 客户集中风险
        - 前 10 大收入占比和按客群批次的 NRR
        - 头部账户主导使用量，或前沿 AI 客群批次明显流失
        - 下调增长耐久性假设，重看估值
      - - 平台替代风险
        - 相对 OpenAI、Google、Anthropic 和捆绑套件的输赢数据
        - 现有平台吸收搜索用例的速度快于 Exa 增加差异化工作流
        - 将投资论点从品类领导者调为小众组件供应商
      - - 关键人风险
        - 领导梯队和接班准备度
        - 创始人以下没有可信深度，或创始人离任
        - 管理连续性去风险前，暂停信心
    notes: 退出标准被定义为可观察事件或缺失控制，一旦出现会直接损害承保投资论点。
