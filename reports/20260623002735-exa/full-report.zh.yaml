      - number: '5.2'
        title: 架构与运营模式：自定义检索基础设施加面向 agent 的编排
        blocks:
          - type: paragraph
            body: >-
              最重要的技术问题是，Exa 只是包装第三方搜索，还是拥有检索栈的实质部分。公开证据指向后者。Exa 的文档和博客描述了基于 embeddings 的搜索、query-aware
              highlights、结构化垂直索引，以及自建向量数据库；后者为数十亿向量、元数据过滤、低于 100 毫秒检索和超过 500 QPS 优化。同一批材料还描述了激进压缩、聚类、reranking
              和自定义查询语言阶段，这与简单把查询转发给 SERP provider 在性质上不同。基础设施披露强化了这个故事：Exa 称其运营 80-A100 集群和 144-H200 Exacluster，使用
              Kubernetes 编排并配合 Pulumi 和 Ansible，依赖 NVIDIA operators 做 GPU 和网络管理，并用 Alluxio 加 S3-backed cache semantics
              支持大规模训练数据访问。更高层产品也映射这套架构。Exa Deep 和 Exa Agent 被呈现为并行搜索和 subagent 系统，把检索转成结构化综合；LangChain 案例研究则描述
              planner-task-observer 模式和 JSON-first 输出。实际含义是，Exa 的运营模式越来越像「检索平台加研究编排」；技术上有差异化，但也比薄 API wrapper 更吃基础设施。
