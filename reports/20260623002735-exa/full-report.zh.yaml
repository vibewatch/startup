      - number: '3.2'
        title: 能力、定价、GTM 与信任：Exa 的差异化在哪里，平价化又在哪里上升
        blocks:
          - type: paragraph
            body: >-
              Exa 的公开产品表面对一家 AI 原生搜索供应商来说异常连贯。搜索、内容、公司 enrichment、MCP 分发和 SDK primitives 都指向同一个购买故事：一家供应商能让 agent 在实时
              Web 上完成 grounding，同时暴露面向代码、公司发现和深度研究的结构化工作流。这比单纯搜索 API pitch 更强。不过，一旦纳入定价和信任，比较就变紧。Brave 的答案栈公开、低摩擦且兼容
              OpenAI；Perplexity 明示原始搜索和 agent 工具定价；SerpAPI 提供简单自助阶梯；Google 仍列出商品化传统搜索定价，同时把严肃买家迁向 grounding bundles。


              信任也不是垄断。Exa 凭借 SOC 2、零留存选项和受限 HIPAA-safe 检索路径，拥有有意义的企业证明。但 Brave、SerpAPI、Glean、Google 和 Elastic
              都发布了各自的控制表面、认证或 uptime 承诺。因此采购不像二元的安全审查，而更像在 recall 质量、bundle 契合度、合规范围和运营成本之间做矩阵权衡。结果是，Exa
              仍可凭产品连贯性和垂直扩展突出，但团队越来越能在多个可接受替代品之间比较信任、价格和分发，而不是在严肃企业评估中把 Exa 当成唯一的 AI 原生 Web 检索供应商。
