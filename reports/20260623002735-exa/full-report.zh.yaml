  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              Exa 所在市场比泛泛的「搜索」甚至泛泛的「AI 基础设施」更窄。其自有材料描述的是面向 agent 的公开 Web 检索栈：搜索、爬取、抽取、带引用答案，以及通过 MCP
              分发进开发者工具。这意味着相关支出，是开发者和企业 AI 团队用来把 agent 连接到新鲜公开 Web 信息，并把结果转成可用上下文的钱。几个相邻资金池很诱人，但容易误导。Glean 和
              Elasticsearch 卖内部知识与私有数据检索；Algolia 卖电商和站内搜索优化；它们都可作为替代品或比较点，但不能直接衡量 Exa 的核心收入池。Google Custom Search
              仍是传统替代品，但 Google 称其已关闭新客户入口，并将在 2027 年 sunset。因此，正确边界是面向 agent 的 AI 原生公开 Web
              检索基础设施；内部企业搜索、广告、浏览器订阅和通用向量数据库支出应被排除或作为相邻项，而不是计入核心 TAM。
