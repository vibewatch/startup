      - number: '7.4'
        title: 客户、财务模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              公开采用故事很有吸引力，但耐久性仍披露不足。Exa 点名的客户证据——OpenRouter、Cognition、monday.com、Databricks、Cursor，以及投资人强调的其他 AI
              原生账户——显示产品切中了 agent 栈需求，却也让公开证据偏向一个相对狭窄的前沿 AI 和自动化买家群体。Exa 称其现在服务 5,000 多家公司和超过 40
              万名开发者，但公开材料没有披露头部客户集中度、续约率、NRR、流失、按垂直行业划分的部署广度，或来自少数设计伙伴的收入占比。这很重要，因为公司的进入市场和产品叙事仍围绕恰恰最容易受到
              OpenAI、Anthropic、Google 和大型应用在位者快速平台替代的客户。


              财务模型风险由此直接延伸。Sacra 估计 2025 年收入约 $10 million，而这家公司公开运行昂贵的 GPU 和爬取基础设施；同时公司估值已抬到 $2.2
              billion，并引导投资人想象每秒数十万次搜索。如果 Exa
              能把前沿用量转化为耐久的企业合同，这套经济模型可以成立；否则，公司可能掉进熟悉的基础设施陷阱：用量增长快过毛利。执行层面还叠加创始人集中度。可见的公开领导层记录仍高度集中在 Will Bryk 和 Jeff
              Wang，管理梯队披露有限，也没有公开继任计划。这对早期基础设施公司并不罕见，但在这里更重要，因为 Exa 同时在扩大产品范围、基础设施强度、法律复杂度和企业销售动作。
