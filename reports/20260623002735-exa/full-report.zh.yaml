      - number: '1.4'
        title: 公开规模标记、客户与生态信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引力标记来自公司口径和生态，而不是经审计财务。Exa 称其为 Cursor、Cognition、HubSpot、OpenRouter、Monday.com 等提供搜索能力，并服务超过 400,000
              名开发者；Series C 文章称平台现在服务超过 5,000 家公司。独立合作伙伴信号进一步说明 Exa 已嵌入当前 agent 工具链：LangChain 维护 Python 和 JavaScript
              两套集成；Exa 发布自有 MCP server 指南，覆盖 Claude、Cursor、VS Code、Codex 和 Gemini CLI；Browserbase 提供基于 Exa
              的求职搜索自动化模板。TechCrunch 还提到 Databricks 是用 Exa 做数据集发现的客户。


              一些规模标记仍软得多。公开员工数相互冲突很大，从 Y Combinator 公司资料的 75 人，到 2026 年 5 月报道中的约 100 人，再到 Growjo 的 294 人。收入更不可靠：Sacra 估算
              2025 年约 $10M，但在公司自有材料中没有找到官方经审计收入或 ARR
              披露。同样，公开记录确认了旧金山总部和全球招聘姿态，却没有给出稳定二级办公室的清单。正确解读是，客户和开发者采用看起来真实，但多个封面指标在承担估值权重之前仍需私下核验。
