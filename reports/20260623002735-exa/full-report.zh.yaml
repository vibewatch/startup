            body: >-
              Exa 的扩张路径直观：自助搜索可增长到内容抽取、监控、异步研究，最终进入协商企业合同。客户 mix 本身就能看到这条路径。HubSpot 把 Search 和 Monitors 叠进 CRM
              agents；OpenRouter 把 Exa 变成覆盖数百个模型的共享基础设施；StackAI 把 Exa 嵌入受治理的企业 agent 部署；11x 和 Obvious 等 GTM 客户则从发现走向
              enrichment 和工作流自动化。集中度问题难得多。公开具名引用偏向 AI 原生软件和 agent 构建者，这意味着存在真实风险：少数旗舰 logo 对路线图、声誉，也可能对收入 mix 的影响，超过
              5,000 家公司这个标题数字所暗示的程度。公开来源没有披露 top-customer 收入占比、细分 mix 或直接与伙伴来源 bookings。生态也是双刃剑：LangChain
              和其他开发者表面降低采用摩擦，也让客户更容易 benchmark 或替代多个搜索供应商。因此，Exa 的客户章节支持 land-and-expand thesis，但还不支持无集中度 thesis。
