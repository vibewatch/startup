      - number: '8.3'
        title: 情景与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              可比集合比轮次标题更能说明问题。按公开和半公开代理看，Exa 的价格高于一大批披露更充分的业务。Perplexity 2025 年私募估值隐含约 100x ARR，且披露收入规模大得多。Glean 2025
              年融资隐含约 72x ARR，到 2026 年已报告 $300 million run rate。公开软件基础设施公司定价低得多：Elastic 约为 3.5x 市值 / 收入，Datadog 约为
              23x。Exa 按最后公开收入估计约 220x 定价，因此即便放在火热的私有 AI 市场里，也不显得明显便宜。


              这会把情景分析推向入场纪律。牛市情景中，Exa 复合增长足够快，能沿着通往九位数收入的路径、维持高溢价倍数，从而证明当前估值合理。基准情景中，增长仍强，但倍数正常化让相对最新轮次的上行空间有限。熊市情景中，搜索在
              Exa 证明利润率质量前变得更容易替代，下一轮融资持平或下行。当前轮次可以成立，但前提是未来运营证据要迅速追上当前投资人热情。
