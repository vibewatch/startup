  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资代理指标
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Exa
        - 直接网页搜索 API + agent 基础设施
        - 50M+ 公司索引、公开 SDK/MCP 分发、按量 API 定价
        - AI agent、编码助手、GTM / 市场研究构建者
        - 一套栈覆盖实时网页搜索、contents、公司搜索、代码感知工作流和 agent 工具
        - 捆绑能力弱于 Google 或 Glean，公开信任能力差距正在缩小
      - - Tavily
        - 直接同业
        - 首页称月请求量 300M+、开发者 2M+、99.99% 可用性、180 ms p50
        - 构建搜索、抽取和研究 agent 的开发者
        - 统一搜索 + 抽取 + 研究 + 爬取定位
        - 企业胜率和差异化信任范围的公开证据较薄
      - - Brave Search API
        - 拥有独立索引的直接同业
        - 30B+ 页面独立索引、每日 100M+ 页面更新、50 QPS 搜索
        - AI 搜索、训练数据、RAG、重引用助手
        - 独立索引、低公开入门价、OpenAI 兼容回答层、ZDR 声明
        - 仍是横向网页索引产品，没有 Exa 的公司搜索垂直能力
      - - SerpAPI
        - 直接同业 / 封装器
        - 免费至 $275 自助档位，另有多个特定引擎 API 和企业计划
        - 希望覆盖广泛引擎、但不想运营 SERP 基础设施的开发者
        - 覆盖 Google、Maps、News、Scholar、Shopping、Amazon 等
        - 当专有召回质量是关键差异点时，封装器经济性和索引依赖会很重要
      - - Perplexity Sonar
        - 带回答层的直接同业
        - 原始搜索 $5 / 1k，另加 Sonar 模型定价；TechCrunch 称 Zoom 是早期用户
        - 希望在一个界面获得搜索、回答生成和来源控制的开发者
        - 一套栈包含 Search API、Sonar、Agent API、MCP 和 OpenAI 兼容
        - 信任和原始搜索经济性仍与 Exa 直接竞争，并不能让其免于替代
      - - Google Grounding / Custom Search
        - 既有平台捆绑
        - 传统 Custom Search 正停止接纳新客户，Grounding 则在 Gemini 栈内扩张
        - 已在 Google 上标准化的云和企业买方
        - 世界知识依据化、Agent Search、受监管网页依据化和捆绑能力
        - Custom Search 属于传统产品，Grounding 是更宽的平台采购，不是轻量替换
      - - Glean
        - 企业搜索替代品
        - 首页强调 35+ 模型，以及重点部署案例中 <2 年达 93% 采用率
        - 关注内部知识、权限和采用的大型企业
        - 权限感知搜索、agent 治理和深层内部系统上下文
        - 不是公共网页原生检索产品
      - - Algolia
        - 自有内容替代品
        - 按请求计价的相关性栈，包含 NeuralSearch、规则、分析、商品运营和爬取摄取
        - 优化自有资产上产品或内容发现的团队
        - 面向第一方内容的强相关性工具和业务用户控制
        - 没有独立公共网页索引，也没有 agent 原生研究楔子
      - - Elastic
        - 可自建平台替代品
        - 开源部署选项、350+ 集成、99.95% 托管 SLA、高阶 Agent Builder
        - 希望完全掌控检索、数据和部署足迹的团队
        - 混合检索、向量搜索、多云托管和规模化 agent 功能
        - 比采用现成网页搜索 API 需要更多构建工作
      - - 用 LangChain + 所选搜索 API 内部自建
        - 现状 / 潜在进入路径
        - 除所选组件外没有固定厂商加价；编排已经横跨主要模型提供商
        - 已拥有 agent 基础设施的强工程团队
        - 路由灵活性最高，也更容易在搜索厂商间多家部署
        - 集成负担最高，开箱即用的信任、支持和质量保证最弱
    notes: 各行覆盖截至 2026-06-23 公开证据中，Exa 买方可见的最重要直接同业、既有厂商、替代品和内部自建选项。
