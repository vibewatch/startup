            body: >-
              Exa 看起来商业上真实、技术上差异化、当前资本充足，但仍无法基于公开基本面承保。正面 case 很直接：按用量变现与 agent 采用一致，客户证明显示嵌入式工作流价值，Series C
              显著延长公司在下一轮融资前扩大规模的能力。阻塞项在于，把产品兴奋转成可投资经济性的每个核心承保指标仍缺席：实际收入 mix、毛利率、CAC、回本周期、NRR、集中度、折扣、烧钱、runway
