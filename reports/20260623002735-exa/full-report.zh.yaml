  - id: FP001
    title: 竞争定位图
    type: quadrant
    layout: wide
    summary: Exa 在网页原生差异化上位置较高，但在捆绑能力上低于 Google 和 Glean；按现代开发者姿态看，Brave 和 Perplexity 是最接近的直接同业。
    data:
      xAxis:
        label: 网页索引独特性 / 检索差异化（0-10 序数）
      yAxis:
        label: 工作流广度 / 分发能力（0-10 序数）
      points:
        - label: Exa
          x: 8
          'y': 7
          detail: 强网页原生检索，再叠加代码、公司、SDK 和 MCP 界面。
          tone: positive
        - label: Tavily
          x: 6
          'y': 5
          detail: 搜索、研究和抓取的一体化 API 速度快，但垂直深度较轻。
          tone: neutral
        - label: Brave Search API
          x: 7
          'y': 6
          detail: 独立索引、低进入价格，并兼容答案生成。
          tone: positive
        - label: SerpAPI
          x: 4
          'y': 6
          detail: 胜在搜索引擎连接器广度，而不是自有召回。
          tone: warning
        - label: Perplexity Sonar
          x: 6
          'y': 7
          detail: 搜索加答案生成，并通过面向企业的 API 分发。
          tone: positive
        - label: Google Grounding
          x: 7
          'y': 9
          detail: 更宽的 grounding stack，背后有云和企业捆绑能力。
          tone: positive
        - label: Glean
          x: 3
          'y': 8
          detail: 当自有数据最关键时，带权限感知的企业分发占主导。
          tone: warning
        - label: Algolia / Elastic 技术栈
          x: 4
          'y': 7
          detail: 可以自行搭建相关性和部署控制，但不是原生开放网页产品。
          tone: neutral
        - label: 内部自建
          x: 5
          'y': 4
          detail: 灵活且可多家并用，但要做到稳固和可支持，成本很高。
          tone: warning
    approximationNotes: 分数是综合判断，锚定保留下来的公开产品、定价和信任证据，而不是供应商发布的基准。
