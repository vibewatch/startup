        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >-
              公开采用曲线很陡，即便分母质量仍由公司定义。2024 年 7 月，Exa 称已有数千家公司和开发者集成产品，并提到 Databricks 是早期 AI 研究团队案例。到 2026 年 5 月 Series C
              文章，Exa 称使用平台的公司数已增至超过 5,000 家，产品为超过 400,000 名开发者提供搜索能力。具名客户信号在这段时期也更具体：公开引用从宽泛的「AI applications」语言，转向明确提及
              Cursor、Cognition、HubSpot、OpenRouter 和 monday.com。客户侧结果数据存在的地方，用量深度最强。OpenRouter 报告 Exa 支持的搜索查询从去年 2.36M+
              增至累计 73M。11x 称 Exa 已在生产中支撑数百万次搜索、Webset items 和 enrichment cells。CodeRabbit 报告切换到 Exa 后，在保持或提升输出质量的同时，Web
              搜索量减少约 70-75%。合在一起，这条轨迹支持真实生产采用，但 Exa 仍未披露活跃与注册开发者数量、付费与免费公司数量，或按 cohort 的扩张。
