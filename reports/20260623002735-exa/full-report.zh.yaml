    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间明显偏斜：当前价格主要只在牛市情景下说得通。
    data:
      items:
        - label: 熊市情景估值（$B）
          low: 0.2
          high: 0.4
        - label: 基准情景估值（$B）
          low: 0.7
          high: 1.4
        - label: 牛市情景估值（$B）
          low: 2.2
          high: 4
    approximationNotes: 区间反映与收入规模和常态化倍数区间挂钩的情景逻辑，不是 DCF。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 可供投委会使用的评分卡：Exa 在产品和融资支撑上得分高，在披露支撑的价格吸引力上得分低。
    data:
      items:
        - label: 市场 / 产品证明
          value: 8/10 — real workflow adoption and strong investor sponsorship
          status: strong
        - label: 客户证明质量
          value: 7/10 — case studies are credible but economics are hidden
          status: conditional
        - label: 护城河持久性
          value: 5/10 — differentiated today, but bundle pressure is real
          status: conditional
        - label: 经济性证明
          value: 2/10 — public margin and retention evidence is missing
          status: adverse
        - label: 披露质量
          value: 3/10 — no filing-grade view on revenue quality or cap stack
          status: adverse
        - label: 价格吸引力
          value: 2/10 — current round is difficult to justify on public evidence
          status: adverse
    claimRefs:
      - CV028
      - CV030
      - CV031
      - CV032
      - CV039
