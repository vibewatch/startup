      - number: '7.2'
        title: 监管、隐私与知识产权风险
        blocks:
          - type: paragraph
            body: >-
              最尖锐的风险，是 Exa 默认产品行为与敏感企业工作负载预期之间的缺口。隐私政策明确写明，查询数据会用于改进产品并微调支撑服务的模型；政策也写明，Exa
              不会主动监控查询文本中是否含个人信息。这一组合用于通用开发者搜索尚可管理，但并不天然契合那些期待默认日志最小化、机密提示词隔离或明确仅作为处理者处理数据的客户。Exa 自己的安全文档给出了缓释路径：SOC 2
              Type II 控制、信任中心，以及 Zero Data Retention、HIPAA 模式等企业专属选项。问题在于，这些控制不是基线。HIPAA 模式只面向符合条件的企业团队，只支持 `/search` 和
              `/contents`，拒绝实时检索和大量摘要路径；一旦请求需要非合规处理，系统会失败关闭。换句话说，产品可以为受监管用例做得更安全，但路径依赖合同，也会限制功能，而不是普遍默认开启。


              相邻的 IP 和网络爬取风险也真实存在。Exa 的条款把合法用户输入责任推给客户，禁止用服务侵犯 IP 或合同权利，保留审计和终止权，并授予 Exa
              对用户输入和输出的广泛许可，用于运营和改进服务。这不能证明存在问题，但意味着双方都在用合同分配法律不确定性。美国版权局 2025 年 Part 3 报告称，已有数十起 AI
              版权诉讼待决，并把训练数据收集、RAG、合理使用和许可视为未决问题。与此同时，EU AI Act 保留 GDPR 和其他个人数据义务，也提高了围绕 AI 系统的文档和治理预期。Exa
              多次使用外部隐私、网络安全和版权顾问，是正面信号；但公开记录仍无法让投资人核验实际生效的 DPA、训练数据授权立场或按司法辖区划分的合规项目。
