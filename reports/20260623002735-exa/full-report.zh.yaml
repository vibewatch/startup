  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面：Exa 销售分层检索与研究栈，不是单一端点
        blocks:
          - type: paragraph
            body: >-
              Exa 的公开定位已从「面向 AI 的搜索引擎」扩展为面向 agent 构建者的更广运营栈。官方 quickstart 和搜索指南呈现四个核心
              primitives——/search、/contents、/answer 和 /research——再把它们延伸到 Agent runs、Monitors、Websets、MCP
              分发，以及公司搜索等结构化垂直场景。按客户工作流看，这意味着 Exa 可以是快速助手的检索层、CRM 或 GTM 软件的 enrichment 层、结构化情报任务的研究层，也可以是偏好 MCP 或 SDK
              介入而不是直接 HTTP 集成的助手工具层。客户例子重要，因为它们显示这些表面已经进入类似生产的工作流：OpenRouter 把 Exa 支持的 Web 搜索作为共享模型市场基础设施，monday.com
              用自然语言搜索加结构化输出来铺排 CRM prospecting，Cognition 公开称 Exa 支撑 Devin 的搜索能力。这种广度让 Exa 的产品定义比通用搜索 API
