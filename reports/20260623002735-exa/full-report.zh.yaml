            body: >-
              最强增长驱动来自生态层面。OpenAI 正把 Web 搜索和 agent 编排变成标准构件，MCP 正降低外部工具集成税，Exa 和 Tavily
              等供应商正从原始搜索端点向更丰富的研究工作流上移。与此同时，这仍是一个难以测算和承保的市场。不同供应商的消耗单位差异极大，治理和零数据留存要求会拖慢采购，内部检索栈在许多企业里仍争夺同一个预算负责人。最重要的是，公开材料保留了不应抹平的直接矛盾。Exa
              称自己在每个延迟和价格点都是最高质量搜索 API，也是世界最快搜索 API；Brave 称它能替代 Exa 和 Tavily 这类较小索引竞争对手，并且其 grounding 可胜过前沿答案引擎；Tavily
              称自家搜索是市场最快。这些矛盾是证据，不是噪音：它们说明尽调应优先看中立工作流 benchmark 和私有 cohort 经济，而不是供应商营销叙事。
