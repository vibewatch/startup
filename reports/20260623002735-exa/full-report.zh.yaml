  - id: TM006
    title: 保留证据的矛盾表
    columns:
      - 议题
      - 说法 A
      - 说法 B
      - 矛盾为何重要
      - 当前处理
    rows:
      - - 质量领先
        - Exa 称自己在每个延迟和价格点上都是质量最高的搜索 API
        - Brave 称其 API 可以替代 Exa 这类索引规模较小的竞争对手，而且更好的依据化胜过前沿回答引擎
        - 已审阅语料中没有中立第三方基准能解决这一说法
        - 保留为未解决的竞争矛盾
      - - 延迟领先
        - Exa 称其打造了全球最快的搜索 API，延迟低于 200ms
        - Tavily 称其 /search 端点 p50 为 180ms，是市场最快
        - 两种说法都来自自报，口径也不同
        - 作为特定工作流的尽调项处理，而不是既定事实
      - - 市场规模标题
        - 企业搜索研究显示相邻市场有数十亿美元规模
        - 公共网页检索品类本身更窄，也缺少独立 TAM 研究
        - 若把更宽口径报告当作 Exa 的 TAM，会抬高估值框架
        - 用多个受约束视角，而不是单一 TAM 标题
      - - 商业打包
        - 部分厂商按原始搜索请求变现
        - 其他厂商主推带引用的回答、研究运行或 credit 抽象
        - 计费单位不同，比较和预算都会变乱
        - 按工作流和捕获价值比较，不只看单次调用标价
    notes: 矛盾被保留下来，而不是被抹平；本章把它们视为市场尚不成熟、且需要中立工作流基准的证据。
