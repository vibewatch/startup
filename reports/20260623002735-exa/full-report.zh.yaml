  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Exa 的公开客户集合足够宽，可以按买方、用户、付款方和待完成任务分层，而不是只贴一个「开发者工具」标签。第一类是开发者原生 agent
              和编码产品——Cursor、Cognition、OpenRouter、CodeRabbit——日常用户是开发者或 AI agent，经济买方通常在工程或产品，付款方是基础设施或软件预算。第二类是 GTM 和
              CRM 自动化——monday.com、HubSpot、11x 和 Obvious——终端用户是 SDR、AE、RevOps 或代表他们行动的 AI
              agent，预算权在收入运营、销售技术或产品领导层。第三类是研究和专业知识工作——科学发现里的 Anara、诉讼情报里的 WhyHow——信息质量比单纯点击式搜索更重要。第四类是 StackAI 这类企业
              agent 平台，Exa 嵌入受治理的多步骤企业工作流，如尽职调查和 RFP。地理分布由 Exa 直接披露的少于客户披露的，但 HubSpot 覆盖 135 个国家的 299,000 名客户、monday.com
              全球 250,000+ 客户，意味着即使 Exa 没有发布干净的细分或区域收入拆分，它已位于全球分布的软件产品内部。
