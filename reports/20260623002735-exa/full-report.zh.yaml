  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议沿着一条链条展开：产品和融资支撑强，但价格支撑下的判断更弱。
    data:
      nodes:
        - id: n1
          label: 产品和客户证明
          detail: 案例研究、5,000+ 家公司、400,000+ 名开发者。
          tone: positive
        - id: n2
          label: 融资支撑
          detail: $250M Series C 和一线投资人消除了短期生存压力。
          tone: positive
        - id: n3
          label: 运营证据缺口
          detail: 公开记录仍缺收入质量、留存、利润率和股本结构细节。
          tone: warning
        - id: n4
          label: 当前价格偏贵
          detail: 约为上一项公开收入代理指标的 220x，高于可比公司组。
          tone: warning
        - id: n5
          label: 当前判断：跟踪
          detail: 密切跟踪公司，但暂不按最新价格承销。
          tone: warning
      edges:
        - from: n1
          to: n5
          label: 支撑兴趣
        - from: n2
          to: n5
          label: 支撑生存
        - from: n3
          to: n5
          label: 阻碍确信
        - from: n4
          to: n5
          label: 阻碍价格支撑
    approximationNotes: 这是决策链，不是法律意义上的股本结构流程图。
    claimRefs:
