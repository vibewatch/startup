  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-som
      missingEvidence: A segment-by-segment SAM and SOM model with paying-account counts, price realization, geography, and qualification criteria.
      whyItMatters: Broad no-code/low-code market totals and user counts do not establish the spend Emergent can actually serve or win.
      diligencePath: Obtain management's 2026–2028 market model and reconcile it to active paying accounts, plan mix, geography, and target conversion rates.
      relatedQuestionRefs: [QM002, QM003]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: market-estimates
      missingEvidence: A methodology bridge explaining why the $65B no-code/low-code estimate and the $6.56B-to-$75B AI app-builder estimate use compatible or incompatible category definitions.
      whyItMatters: Treating unlike market estimates as additive or interchangeable would overstate the opportunity.
      diligencePath: Request the underlying publisher definitions, included vendors, geography, currency basis, and forecast methodology for each estimate.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
    - type: missing-source
      severity: material
      topic: enterprise-adoption
      missingEvidence: Independent customer and procurement evidence showing paid conversion, renewal, security review, and budget ownership by segment.
      whyItMatters: Category adoption statistics are not evidence of Emergent-specific enterprise penetration or durable monetization.
      diligencePath: Review anonymized cohort retention, plan mix, sales pipeline, procurement cycle time, and customer references across SMB, mid-market, and enterprise.
      relatedQuestionRefs: [QM004, QM006, QM009]
      relatedTableRefs: [TM003]
