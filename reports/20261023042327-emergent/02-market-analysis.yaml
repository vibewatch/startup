chapter:
  number: 2
  title: Market Analysis
  summary: Emergent participates in the broader no-code/low-code and AI app-builder market, but the public evidence does not isolate a company-specific SAM or SOM. The strongest sizing lens is the reported $65B global no-code/low-code market in 2026, while adoption evidence supports a wedge among non-technical founders, SMBs, business departments, and product teams rather than an immediately interchangeable enterprise software market.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      Emergent's relevant market is software that turns natural-language requirements into deployable web or mobile applications, including generation, iteration, testing, deployment, and managed operations. That boundary includes AI-native app builders and the broader no-code/low-code category when the buyer is purchasing faster application delivery rather than only a design mockup. It excludes generic chat assistants, isolated code-completion tools, website-only editors, and conventional outsourced development unless they are a direct substitute for the same application-building workflow. The status quo is a mix of spreadsheets, email, messaging workflows, internal IT backlogs, agency or freelance development, and conventional engineering teams. The distinction matters because Emergent's value proposition is workflow compression, not simply code generation: a third-party review describes the product as sitting between lightweight no-code builders and traditional development workflows, while GitHub's own Workspace documentation shows that multi-step natural-language development is also being incorporated into incumbent developer tooling.
    claimRefs: [CM001, CM002, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and what remains unproven
    body: >-
      The broad category is large, but it should not be treated as Emergent's obtainable market. Searchlab's compilation reports a $65B global no-code/low-code market size for 2026, a 26.1% 2022–2028 CAGR, and a $94B 2028 projection, with low-code estimated at roughly $39B and pure no-code at roughly $26B. The same compilation reports an $8.2B no-code website-builder segment, which is a narrower adjacent category rather than a clean Emergent SAM. A separate Hostinger compilation presents a different AI app-builder trajectory, from $6.56B in 2025 to a projected $75B by 2034. These estimates use different category boundaries and publishers, so they are directional lenses, not a reconciled market model. Emergent-specific public evidence is stronger on user reach than on addressable spend: Sacra reports more than 6M users and about 150,000 paying customers in early 2026, but no public source in this pool supplies a geography-, segment-, and spend-constrained SAM or a defensible SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The initial buyer and user are often the same person: a non-technical founder, creator, product manager, or operator with a concrete workflow to digitize. Sacra attributes nearly 40% of users to small businesses and about 70% to people without prior coding experience; it also describes use cases replacing spreadsheet, email, and messaging workflows. The adoption path is therefore bottom-up experimentation, followed by paid credits, higher usage, deployment, hosting, or team requirements. SMB and mid-market expansion is plausible where governance, single sign-on, custom domains, database controls, and security evidence reduce procurement friction. Enterprise adoption is a separate motion: the no-code/low-code compilation reports 77% enterprise adoption and 58% SMB adoption for that broad category, but those statistics do not prove Emergent's penetration. Budget ownership can move from an individual or business department to operations, product, or IT only after reviewability, reliability, security, and support are demonstrated.
    claimRefs: [CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      The principal growth driver is the gap between demand for bespoke software and scarce engineering capacity. The no-code/low-code compilation reports that 87% of IT leaders say these tools help address developer-talent shortages, while 46% of projects are initiated by business departments rather than IT. Emergent's multi-agent, full-stack workflow can capture value when a buyer prioritizes speed to a working internal tool or MVP and accepts iterative review. Constraints are equally material: output quality still requires judgment and testing; a review of Emergent says it is less suitable for heavy compliance, highly custom technical requirements, or buyers expecting a polished product without iteration. Usage-based AI and hosting costs can also make casual exploration feel restrictive, while incumbent platforms are embedding comparable natural-language workflows. The valuation implication is that user growth and category growth are not sufficient by themselves; durable conversion, retention, gross margin after model and infrastructure costs, enterprise proof, and defensible distribution are the missing bridges from broad market potential to company value.
    claimRefs: [CM015, CM016, CM017, CM019]
    callouts:
      - calloutType: risk
        title: Category size is not company SAM
        body: >-
          Public category estimates support a large opportunity, but the evidence does not yet isolate Emergent's serviceable spend or prove that broad no-code adoption converts into Emergent-specific paid retention.
        claimRefs: [CM005, CM008, CM019]
      - calloutType: insight
        title: The wedge is workflow compression
        body: >-
          Emergent's clearest market wedge is helping non-technical or capacity-constrained teams move from requirements to a working application, with deployment and iteration included.
        claimRefs: [CM002, CM010, CM015]
