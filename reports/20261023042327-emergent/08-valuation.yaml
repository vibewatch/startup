company:
  name: Emergent
chapter:
  number: 8
  title: Valuation
  summary: >-
    Emergent's reported $1.5B Series C mark is supported by rapid financing and adoption signals,
    but not by public evidence on audited revenue, retention, margins, cash burn, or investor
    preferences. The evidence supports a track/research-more recommendation with a stretched
    valuation stance rather than a price-insensitive buy.
sections:
  - id: recommendation-and-entry
    title: Recommendation and entry discipline
    body: >-
      The decision is track/research-more with medium confidence, high risk, and a stretched
      valuation stance. Two independent profiles report a $130M Series C at a $1.5B post-money
      valuation and about $230M of total funding, while current profile and statistics pages repeat
      a company-reported $100M ARR figure. Combining those two reported values implies roughly 15x
      valuation-to-ARR, but this is not a conventional revenue multiple: the ARR is unaudited,
      its definition is not disclosed, and funding raised is not cash available. Entry at the
      latest preferred mark should therefore require verified paid-cohort retention, gross margin,
      cash burn, fully diluted ownership, and preference terms. Until those return variables are
      available, financing momentum supports continued diligence but not a high-conviction buy.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV016]
    tableRefs: [TV001]
  - id: thesis-and-antithesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on financing validation, a large non-technical user wedge, and demonstrated
      speed from prompt to working software. TechCrunch reported a $23M Series A led by Lightspeed,
      said more than one million people had built over 1.5 million apps, and produced a satisfactory
      first version in less than half an hour during its own test. The anti-thesis is that usage
      volume may not translate into durable economics. A 2026 independent review describes fast,
      unpredictable credit consumption and warns against production-critical enterprise use
      without developer review. Those weaknesses matter at a $1.5B private mark because support,
      inference, and debugging costs could absorb revenue while customer activity remains high.
    claimRefs: [CV001, CV008, CV009, CV010, CV011, CV016]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios and comparable context
    body: >-
      Public comparables provide boundary conditions rather than a defensible fair-value range.
      AIBase reported that StackBlitz was discussing an $83.5M raise at a $700M valuation, while
      Replit announced a $250M financing at $3B. Macrotrends reported Appian at a $2.33B market
      capitalization on $0.617B of revenue, a simple ratio of about 3.8x. None is directly
      comparable: StackBlitz and Replit are private financing marks, Appian is a mature public
      low-code vendor, and Emergent's cited denominator is company-reported ARR rather than
      accounting revenue. The bull/base/bear cases therefore use milestone and downside logic,
      not invented precision. A numeric fair-value range remains unsupported without matched
      growth, margin, retention, liquidity, and security terms.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Diligence gates, exit readiness, and thesis breaks
    body: >-
      The immediate diligence package should include monthly recurring-revenue cohorts, the ARR to
      recognized-revenue bridge, gross margin after model and hosting costs, CAC payback, GRR, NRR,
      cash burn, debt, a fully diluted cap table, and a preference waterfall. Silicon Valley
      Investclub explicitly says the full shareholder register is not public and presents dilution
      estimates rather than ownership facts, so the reported post-money valuation cannot be
      translated into investor return. Exit readiness is similarly unproven: later financing,
      strategic acquisition, or an eventual public listing would require durable paid usage and
      auditable economics. Thesis-break signals are a down round, adverse preference terms,
      decelerating paid retention, worsening credit economics, or evidence that production-critical
      workloads require support intensity inconsistent with software margins.
    claimRefs: [CV006, CV007, CV009, CV010, CV016]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, "Track / research more", "Financing and adoption are visible; return variables are not", "Do not underwrite a buy from public data alone"]
      - [Confidence, Medium, "Latest mark is repeated by two profiles, but ARR remains company-reported", "Require primary financing and operating records"]
      - [Risk rating, High, "Credit economics, production readiness, cap table, and preferences remain uncertain", "Structure and price must protect downside"]
      - [Valuation stance, Stretched, "Reported $1.5B mark implies about 15x reported ARR", "Treat the mark as a financing reference, not fair value"]
    notes: "Assessments use public financing and company-reported ARR inputs; no audited financials, cap table, or preference package was available."
    claimRefs: [CV002, CV004, CV005, CV006, CV009, CV010, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence, What would strengthen the view, What would weaken the view]
    rows:
      - [Thesis, "Institutional financing progressed from a $23M Series A to a reported $130M Series C", "Signed financing records with clean terms", "Down round or senior preference overhang"]
      - [Thesis, "TechCrunch reported more than 1M builders and 1.5M apps", "Paid activation and retention by cohort", "Predominantly free or low-engagement usage"]
      - [Thesis, "TechCrunch produced a satisfactory first app in under half an hour", "Repeatable production deployments and enterprise references", "High rework or support intensity after initial generation"]
      - [Anti-thesis, "Independent review flags unpredictable credit burn and production-readiness limits", "Stable gross margin and bounded debugging costs", "Credit consumption or defects drive churn"]
    notes: "Adoption figures attributed to TechCrunch were reported by the company; the hands-on test and review observations are publisher assessments."
    claimRefs: [CV001, CV002, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation and return logic, Key downside trigger]
    rows:
      - [Bull, "Reported ARR is validated; paid retention and software-like margins remain strong; enterprise use becomes repeatable", "The $1.5B mark can be defended or exceeded, but no upper range is supportable from public evidence", "Growth converts poorly into retained gross profit"]
      - [Base, "Adoption continues while conversion normalizes and compute, hosting, and support costs stay material", "Entry below the latest mark or with downside protection is required; precise fair value remains unavailable", "Flat paid cohorts or adverse financing terms"]
      - [Bear, "Free activity dominates; debugging friction and production limits raise churn; category multiples compress", "A down round or impaired liquidity produces weak equity returns; $700M StackBlitz context is not a floor", "Retention deterioration, security failure, or funding stress"]
    notes: "Scenarios are qualitative because the assigned evidence lacks audited revenue, matched comparable multiples, fully diluted ownership, and preference terms; ranges are not invented."
    claimRefs: [CV004, CV005, CV006, CV009, CV010, CV012, CV013, CV014, CV015, CV016]
