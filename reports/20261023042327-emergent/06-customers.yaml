schemaVersion: "report-v2"
artifact: customers
slug: emergent
runDate: 2026-10-23
company:
  name: Emergent
chapter:
  number: 6
  title: Customers
  summary: Emergent shows broad, fast adoption among entrepreneurs and small businesses, but the public record is much stronger on users and applications than on durable paid retention, renewal, or enterprise production use.
sections:
  - id: customer-segments
    title: Customer segments and jobs
    body: >-
      Emergent's customer proposition is concentrated around people who need software but do not want to hire a conventional engineering team. Its own surface describes a path from conversation to deployed application, while independent reviews place the strongest fit with non-technical founders, small businesses, product managers, agencies, and operations teams. TechCrunch reports examples across trucking, manufacturing, construction, and property management, indicating that the product is being used for operational software rather than only marketing pages. The buyer, user, and payer can nevertheless be different: an owner or operator may sponsor a build, an employee may use the resulting workflow, and a business may pay subscription, usage, or hosting charges. The evidence supports a broad SMB and entrepreneur wedge, but not a quantified revenue mix by segment.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and deployment trajectory
    body: >-
      Adoption signals are unusually large for a young product: company-linked materials and third-party profiles report millions of users, millions of applications, and availability across more than 190 countries. TechCrunch adds a more decision-useful paid metric, reporting more than 200,000 paying customers and an annual run-rate revenue figure of $120 million in July 2026. Those numbers should not be blended into a single funnel because users, applications, and paying customers have different denominators and time bases. The public record also includes materially inconsistent snapshots, including earlier $50 million ARR and 5-million-user claims. This supports strong acquisition and monetization momentum, while leaving active usage, project survival, and cohort conversion unverified.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: retention-expansion-risk
    title: Durability, expansion, and concentration risks
    body: >-
      Reported deployment examples demonstrate use-case breadth but do not establish renewal or expansion. TechCrunch describes trucking, factories, construction businesses, and property managers without naming the customers; a hands-on Geekflare review documents a real-estate application with accounts, saved favorites, a database, and deployment. These are useful proof points for workflow fit, but they do not disclose contract length, recurring usage, gross retention, net retention, churn, or customer-level revenue. Independent review evidence also identifies a credit-based cost risk: debugging and hosting can consume credits, which may limit iteration or make a live app uneconomic for smaller customers. Enterprise adoption is described as nascent or requiring a custom contract, so procurement, SLA, security, and concentration exposure remain open diligence items.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate customer segmentation, adoption metrics, and named proof so that a large user count is not mistaken for a retained revenue base. Values are presented with their source period and limitations; nulls and gaps are intentional where the public record does not provide a denominator.
      The distinction is especially important here because applications created are not the same unit as paying accounts, and a reported run-rate is not a disclosed cash-collection or renewal measure. The tables therefore preserve uncertainty rather than deriving conversion, retention, or expansion rates.
    claimRefs: [CU005, CU010, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns: [Segment, Buyer or user, Evidenced use case, Strategic value, Gap]
    rows:
      - [Non-technical founders, Founder/operator, Build and monetize a web or mobile product, Primary wedge for zero-code workflow, No disclosed segment revenue or retention]
      - ["Small and medium-sized businesses", "Owner or operations team", "Internal CRM, ERP, logistics, or inventory tooling", "Converts manual workflows into software", "No disclosed active-account denominator"]
      - ["Agencies and product teams", "Agency, freelancer, or product manager", "Accelerate client delivery and prototypes", "Potential multi-project usage", "No disclosed agency expansion or project survival"]
      - [Enterprise buyers, IT or business sponsor, Governed production applications, Higher contract value if security and procurement clear, Public evidence describes adoption as nascent]
    notes: >-
      Segment descriptions are synthesized from the cited company surface, independent reviews, and TechCrunch customer examples; the table does not estimate segment size or revenue share.
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Period, Evidence posture, Implication, Missing denominator]
    rows:
      - [Users, "More than 5 million", "January 2026 announcement", "Company-issued syndicated release", "Large top-of-funnel reach", "Active users and paid conversion"]
      - [Paying customers, "More than 200,000", "July 2026", "CEO statement reported by TechCrunch", "Material paid adoption signal", "Definition of paying and cohort retention"]
      - [Annual run-rate revenue, "$120 million", "July 2026", "CEO statement reported by TechCrunch", "Rapid monetization claimed", "Cash revenue, gross margin, and recurring mix"]
      - [Applications built, "6 million+", "July 2026 profile snapshot", "Company-claim summary in profile", "High creation volume", "Live-app rate and repeat creation"]
      - [Geographic reach, "190+ countries", "January 2026 announcement", "Company-issued syndicated release", "Global distribution", Revenue and usage by geography]
    notes: >-
      Metrics have different sources, periods, denominators, and assurance levels. Earlier public snapshots report $50 million ARR and 5 million users, while later reporting gives $120 million run-rate revenue and more than 200,000 paying customers; these are not reconciled into a single growth rate.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or proof source, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    rows:
      - [Trucking companies, SMB operations, Shipment tracking software, Reported deployment example, Operational workflow digitization, Customer name and contract status not disclosed]
      - [Factories, SMB or mid-market operations, Business software and workflow systems, Reported deployment example, Evidence of vertical breadth, No named customer or outcome metric]
      - [Construction businesses, SMB operations, Enterprise resource planning systems, Reported deployment example, Evidence of operational use case, No production duration or renewal data]
      - [Property managers, SMB operations, Internal customer management tools, Reported deployment example, "Evidence of recurring-workflow fit", "No customer name or usage metric"]
      - [DC Nest reviewer, Independent reviewer, "Real-estate app with accounts, database, favorites, and deployment", "Hands-on build and deployment test", "Functional application observed by reviewer", "One review is not retention or customer revenue proof"]
    enumerationScope:
      coverage: partial
      basis: Named customer examples and one independently reviewed deployment identified in the assigned public sources through 2026-10-23; not a complete customer census.
    notes: >-
      TechCrunch supplies the industry examples; Geekflare supplies the independently tested DC Nest application. “Reported deployment example” does not prove a paid production contract, renewal, or customer outcome.
    claimRefs: [CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from idea to recurring use
    type: journey-map
    summary: Emergent's evidence supports a journey from non-technical need to deployed workflow, while recurring use and expansion remain the least evidenced stages.
    data:
      nodes:
        - id: need
          label: Business need
          detail: Founder or operator seeks software without a conventional engineering build.
        - id: prompt
          label: Prompted build
          detail: Natural-language request is decomposed by AI agents into an application.
        - id: deploy
          label: Deployment
          detail: Web or mobile application is tested and deployed from the platform.
        - id: workflow
          label: Operating workflow
          detail: Examples include shipment tracking, ERP, property management, and internal tools.
        - id: paid
          label: Paid account
          detail: Public reporting cites more than 200,000 paying customers in July 2026.
        - id: expand
          label: Renewal or expansion
          detail: Contract duration, churn, GRR, NRR, and expansion are not publicly disclosed.
    claimRefs: [CU001, CU005, CU010, CU014]
callouts:
  - calloutType: strength
    title: Broad wedge with concrete workflow evidence
    body: "Emergent's strongest customer proof is breadth: reported use spans logistics, factories, construction, property management, and independently tested real-estate software rather than a single narrow persona."
    claimRefs: [CU002, CU010, CU011]
  - calloutType: risk
    title: Retention is the central unresolved customer question
    body: Public sources disclose users, applications, and paying customers, but not cohorts, churn, renewal, contract length, or net revenue retention; the adoption story therefore remains stronger than the durability story.
    claimRefs: [CU007, CU012, CU013, CU014]
