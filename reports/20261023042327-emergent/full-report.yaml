      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The public leadership record is concentrated in the two co-founders. Mukund Jha is identified as
              co-founder and CEO and Madhav Jha as co-founder and CTO; the available profiles provide meaningful
              technical and operating backgrounds but little public detail on directors, independent governance,
              executive depth, or succession. That concentration is relevant because the company is scaling quickly and
              is moving from individual and small-business use cases toward enterprise features such as governance, SSO,
              and security controls. The evidence therefore supports founder-market fit, not a complete governance
              assessment. A diligence process should request the board composition, executive ownership map, security
              accountability, and succession plan.
