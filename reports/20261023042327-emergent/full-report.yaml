        title: Financing, scale, and milestone record
        blocks:
          - type: paragraph
            body: >-
              The financing record is unusually compressed: sources describe a $7 million seed round, a $23 million
              Series A, a $70 million Series B at a reported $300 million post-money valuation, and a $130 million
              Series C at a reported $1.5 billion valuation. TechCrunch independently reported the Series C, total
              funding, a $120 million annual run-rate revenue figure, more than 200,000 paying customers, and about 200
              employees in July 2026; the company release reported more than 12 million applications and a $1.5 billion
              valuation. Other profiles publish materially different figures, including $100 million ARR, 95 employees,
              or earlier user and application counts. These are not interchangeable metrics: the evidence supports the
              existence of rapid growth and financing, while the exact current revenue, customer, app-count, and
              headcount baseline remains a reconciliation item.
