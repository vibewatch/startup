  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and jobs
        blocks:
          - type: paragraph
            body: >-
              Emergent's customer proposition is concentrated around people who need software but do not want to hire a
              conventional engineering team. Its own surface describes a path from conversation to deployed application,
              while independent reviews place the strongest fit with non-technical founders, small businesses, product
              managers, agencies, and operations teams. TechCrunch reports examples across trucking, manufacturing,
              construction, and property management, indicating that the product is being used for operational software
              rather than only marketing pages. The buyer, user, and payer can nevertheless be different: an owner or
              operator may sponsor a build, an employee may use the resulting workflow, and a business may pay
              subscription, usage, or hosting charges. The evidence supports a broad SMB and entrepreneur wedge, but not
              a quantified revenue mix by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption and deployment trajectory
        blocks:
          - type: paragraph
            body: >-
              Adoption signals are unusually large for a young product: company-linked materials and third-party
              profiles report millions of users, millions of applications, and availability across more than 190
              countries. TechCrunch adds a more decision-useful paid metric, reporting more than 200,000 paying
              customers and an annual run-rate revenue figure of $120 million in July 2026. Those numbers should not be
              blended into a single funnel because users, applications, and paying customers have different denominators
              and time bases. The public record also includes materially inconsistent snapshots, including earlier $50
              million ARR and 5-million-user claims. This supports strong acquisition and monetization momentum, while
              leaving active usage, project survival, and cohort conversion unverified.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU010
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Reported deployment examples demonstrate use-case breadth but do not establish renewal or expansion.
              TechCrunch describes trucking, factories, construction businesses, and property managers without naming
              the customers; a hands-on Geekflare review documents a real-estate application with accounts, saved
              favorites, a database, and deployment. These are useful proof points for workflow fit, but they do not
              disclose contract length, recurring usage, gross retention, net retention, churn, or customer-level
              revenue. Independent review evidence also identifies a credit-based cost risk: debugging and hosting can
              consume credits, which may limit iteration or make a live app uneconomic for smaller customers. Enterprise
              adoption is described as nascent or requiring a custom contract, so procurement, SLA, security, and
              concentration exposure remain open diligence items.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate customer segmentation, adoption metrics, and named proof so that a large user count
              is not mistaken for a retained revenue base. Values are presented with their source period and
              limitations; nulls and gaps are intentional where the public record does not provide a denominator. The
              distinction is especially important here because applications created are not the same unit as paying
              accounts, and a reported run-rate is not a disclosed cash-collection or renewal measure. The tables
              therefore preserve uncertainty rather than deriving conversion, retention, or expansion rates.
            claimRefs:
              - CU005
              - CU010
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad wedge with concrete workflow evidence
            body: >-
              Emergent's strongest customer proof is breadth: reported use spans logistics, factories, construction,
              property management, and independently tested real-estate software rather than a single narrow persona.
            calloutType: strength
            claimRefs:
              - CU002
              - CU010
              - CU011
          - type: callout
            title: Retention is the central unresolved customer question
            body: >-
              Public sources disclose users, applications, and paying customers, but not cohorts, churn, renewal,
              contract length, or net revenue retention; the adoption story therefore remains stronger than the
              durability story.
            calloutType: risk
            claimRefs:
              - CU007
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk assessment
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is execution risk after initial generation. Independent product reviews describe
              rapid prototyping as a strength, but warn that applications accumulate permissions, integrations, business
              rules, and edge cases that still require testing, monitoring, and maintenance. Credit-based pricing adds a
              second execution exposure because the same review says repeated iterations and debugging can make
              refinement costs less predictable, while product documentation records a 50-credit monthly charge for a
              continuously deployed web app. These are not evidence of failure, but they create measurable monitoring
              needs: defect escape rates, rollback frequency, credit consumption per active application, and the share
              of production changes reviewed by qualified engineers.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR009
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Emergent's exposure depends on what customers build and where those applications operate, not only on the
              platform's generic label. The European Commission states that transparency rules for certain AI systems
              take effect in August 2026, while high-risk systems in sensitive areas face obligations including risk
              assessment, logging, documentation, human oversight, robustness, cybersecurity, and accuracy from December
              2027. The ICO separately frames AI use as a UK GDPR data-protection issue and provides guidance on
              explaining AI-assisted decisions and assessing risks to individual rights. Emergent therefore needs
              customer-facing classification, data-processing, auditability, and incident-escalation workflows; the
              assigned evidence does not prove that every enterprise control is already implemented.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
              - CR014
      - number: '7.3'
        title: Operating, partner, and financial-model dependencies
        blocks:
          - type: paragraph
            body: >-
              The business model creates dependency on third-party models, hosting, deployment infrastructure,
              integrations, and venture-funded product execution. Public summaries describe subscription, usage-based
              compute, and hosting revenue, while the company profile reports rapid ARR and user milestones but also
              notes that profitability evidence is not public. A large user base can increase support, reliability, and
              abuse-management load without proving durable paid retention. Enterprise adoption is described as nascent
              and concentrated in pilots, so the path from broad usage to repeatable, high-quality enterprise revenue
              remains an open question. Management should monitor model-provider concentration, gross margin after
              inference and hosting, paid conversion by cohort, support burden, and working-capital needs rather than
              treating funding raised as operating cash or ARR as cash generation.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.4'
        title: Mitigations, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Some mitigations are visible in the assigned material: GitHub integration and branches can support code
              ownership and review; product documentation describes testing, previews, rollback, secure environment
              variables, and enterprise deployment options; NIST provides a voluntary AI Risk Management Framework and a
              generative-AI profile that can structure risk identification and evaluation. These mechanisms reduce
              process risk only if customers use them consistently and if Emergent can evidence control effectiveness.
              The thesis should be revisited if material outages or security incidents recur, if credit consumption or
              gross margin deteriorates as deployments scale, if enterprise pilots fail to convert, or if regulatory
              obligations require capabilities that are not available on the relevant plan. Diligence should request
              incident history, SLA terms, control attestations, model and subprocessors, customer concentration, and
              cohort retention.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              A repeatable pattern of material outages, security incidents, unrecovered data loss, or uncontrolled
              credit consumption would undermine the case that rapid generation translates into dependable production
              software.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR013
          - type: callout
            title: Evidence boundary
            body: >-
              Public evidence supports a risk framework and specific control questions, but it does not establish
              Emergent's incident frequency, customer-level retention, gross margin, or profitability.
            calloutType: assumption
            claimRefs:
              - CR010
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The decision is track/research-more with medium confidence, high risk, and a stretched valuation stance.
              Two independent profiles report a $130M Series C at a $1.5B post-money valuation and about $230M of total
              funding, while current profile and statistics pages repeat a company-reported $100M ARR figure. Combining
              those two reported values implies roughly 15x valuation-to-ARR, but this is not a conventional revenue
              multiple: the ARR is unaudited, its definition is not disclosed, and funding raised is not cash available.
              Entry at the latest preferred mark should therefore require verified paid-cohort retention, gross margin,
              cash burn, fully diluted ownership, and preference terms. Until those return variables are available,
              financing momentum supports continued diligence but not a high-conviction buy.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on financing validation, a large non-technical user wedge, and demonstrated speed from
              prompt to working software. TechCrunch reported a $23M Series A led by Lightspeed, said more than one
              million people had built over 1.5 million apps, and produced a satisfactory first version in less than
              half an hour during its own test. The anti-thesis is that usage volume may not translate into durable
              economics. A 2026 independent review describes fast, unpredictable credit consumption and warns against
              production-critical enterprise use without developer review. Those weaknesses matter at a $1.5B private
              mark because support, inference, and debugging costs could absorb revenue while customer activity remains
              high.
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public comparables provide boundary conditions rather than a defensible fair-value range. AIBase reported
              that StackBlitz was discussing an $83.5M raise at a $700M valuation, while Replit announced a $250M
              financing at $3B. Macrotrends reported Appian at a $2.33B market capitalization on $0.617B of revenue, a
              simple ratio of about 3.8x. None is directly comparable: StackBlitz and Replit are private financing
              marks, Appian is a mature public low-code vendor, and Emergent's cited denominator is company-reported ARR
              rather than accounting revenue. The bull/base/bear cases therefore use milestone and downside logic, not
              invented precision. A numeric fair-value range remains unsupported without matched growth, margin,
              retention, liquidity, and security terms.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Diligence gates, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The immediate diligence package should include monthly recurring-revenue cohorts, the ARR to
              recognized-revenue bridge, gross margin after model and hosting costs, CAC payback, GRR, NRR, cash burn,
              debt, a fully diluted cap table, and a preference waterfall. Silicon Valley Investclub explicitly says the
              full shareholder register is not public and presents dilution estimates rather than ownership facts, so
              the reported post-money valuation cannot be translated into investor return. Exit readiness is similarly
              unproven: later financing, strategic acquisition, or an eventual public listing would require durable paid
              usage and auditable economics. Thesis-break signals are a down round, adverse preference terms,
              decelerating paid retention, worsening credit economics, or evidence that production-critical workloads
              require support intensity inconsistent with software margins.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The latest private mark is not investable evidence by itself; verify unit economics, ownership, and
              preferences before setting a target return.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV006
              - CV016
          - type: callout
            title: ARR is not accounting revenue
            body: >-
              The implied 15x ratio uses a company-reported annual run-rate and cannot be compared directly with
              Appian's market-cap-to-revenue ratio.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV015
