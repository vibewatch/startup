      - number: '3.2'
        title: Capability, packaging, and distribution
        blocks:
          - type: paragraph
            body: >-
              Emergent’s strongest product wedge is end-to-end scope. Its company-controlled surfaces say the platform
              handles architecture, logic, implementation, testing, debugging, deployment, and integrations, while an
              independent profile describes specialized agents collaborating to assemble applications. That breadth
              contrasts with GitHub Copilot Workspace’s task-oriented repository workflow, whose preview was sunset on
              May 30, 2025, and with narrower web, prototyping, or developer-assistance products. Emergent’s public
              pricing is credit-based: the current company page displays free, $17 annual-plan, and $167 power-user
              tiers, while a July 2026 competitor review reports $20 and $200 monthly tiers. The mismatch should be
              preserved rather than normalized because billing cadence, plan changes, or review error could explain it.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP014
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is workflow breadth and accumulated project context, not an exclusive model or distribution
              channel. GitHub demonstrates that an incumbent can offer a natural-language plan-and-implement workflow
              with editable specifications, plans, and diffs, even though that particular preview ended. The
              highest-priority displacement risks are price opacity and credit burn, the mobile publishing last mile,
              design homogenization acknowledged by the CEO, and security governance for non-technical builders. A
              security-focused source warns that vibe coding can remove code review and leave authentication,
              dependency, and deployment controls absent; this is category evidence rather than proof of an Emergent
              incident. Durable advantage must therefore come from application success rates, retention, distribution
              into underserved SMB workflows, trusted deployment, and lower all-in completion cost, none of which is yet
              quantified in the retained evidence.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack breadth is the clearest wedge
            body: >-
              Emergent is differentiated when a buyer needs generated backend, deployment, and exportable code rather
              than a front-end prototype or coding autocomplete.
            calloutType: strength
            claimRefs:
              - CP005
              - CP006
          - type: callout
            title: Operational trust is not yet a demonstrated moat
            body: >-
              Credit consumption, mobile publishing, design consistency, and security review remain buyer-owned risks;
              public evidence does not establish durable enterprise switching costs.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Emergent monetizes access to an AI application-building platform rather than selling a single software
              license. Its official pricing page lists a free tier, a Standard plan at $20 per month with 100 credits,
              and a Pro plan at $200 per month with 750 credits; larger business tiers are custom-priced. The same page
              describes extra-credit purchases, hosting, integrations, and team controls, while an independent review
              describes serious projects as typically spending $50–100 or more per month in credits. These are list or
              observed pricing signals, not realized revenue or gross margin. Company and third-party pages report ARR
              milestones ranging from $50 million in January 2026 to $100 million in 2026, but these remain
              company-claimed or secondary-reported run-rate figures and are not audited revenue. The mix of
              subscriptions, usage-linked credits, and hosting makes revenue quality dependent on paid conversion, usage
              intensity, and compute cost control.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
