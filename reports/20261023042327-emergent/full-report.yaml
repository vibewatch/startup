      - number: '1.4'
        title: Current diligence posture
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence establishes product identity, founder biographies, financing announcements,
              and selected scale disclosures. It does not establish audited revenue, cash balance, gross margin,
              retention, customer concentration, cap-table terms, board governance, security incident history, or the
              durability of application activity. A critical independent review notes that generated code still carries
              maintenance, dependency, security, and technical-debt obligations; that limitation is material to the
              company’s positioning because code ownership transfers responsibility rather than eliminating it. The
              chapter’s conclusion is therefore positive on identity and momentum but conservative on operating quality
              and governance until primary diligence materials are available.
