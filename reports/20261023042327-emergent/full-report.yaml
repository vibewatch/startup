              - CE006
              - CE008
              - CE010
      - number: '5.2'
        title: Architecture, deployment, and maturity
        blocks:
          - type: paragraph
            body: >-
              The public technical descriptions point to an opinionated full-stack workflow rather than a visual-only
              builder. A practitioner walkthrough describes a React frontend, Python backend APIs, MongoDB storage,
              authentication, deployment, and a built-in code-review loop; the review also describes exporting or
              synchronizing the project to GitHub. A second comparison characterizes Emergent as more focused on AI-led
              application development and developer control than on visual no-code editing. These are useful indicators
              of the product's intended architecture and handoff model, but they are not an audited reference
              architecture, uptime record, benchmark, or independent security assessment. The maturity conclusion is
              therefore mixed: the workflow appears more complete than a prototype-only generator, while operational
              assurance remains unverified.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
