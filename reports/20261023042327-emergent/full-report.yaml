              - CI013
              - CI014
      - number: '4.2'
        title: Traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public traction is large but denominators are inconsistent. Emergent's about page currently claims $100
              million ARR, 10 million active builders, 12 million applications, and reach in more than 190 countries. An
              external review records free, Standard, and Pro price points and says the product is most compelling for
              non-technical founders, product managers, solo operators, and agencies. Moneycontrol reported company
              claims of a $25 million annualized revenue run rate and 2.5 million users in under five months in December
              2025. A January 2026 funding report then said more than five million users were building products across
              more than 190 countries and reported a rise from $100,000 to $50 million ARR in seven months. These
              disclosures provide evidence of distribution and monetization velocity, but not CAC, sales cycle, payback,
              retention, active paid accounts, or enterprise contract economics. The current evidence supports a
              self-serve or product-led acquisition hypothesis; it does not establish that reported user growth converts
              into durable paid revenue.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The platform's cost base is likely shaped by model inference, hosting, storage, support, and the
              engineering required to test and maintain generated applications, but public sources do not quantify any
              of those components. The official product page says the platform handles backend data management,
              authentication, integrations, payments, deployment, and infrastructure; those capabilities expand the
              service-delivery surface beyond a simple seat license. Public financing disclosures provide capital
              history but not cash on hand: Silicon Valley Investclub lists $230 million of total funding and a $1.5
              billion July 2026 valuation, while Intelligent CIO reported a $70 million Series B and $100 million raised
              within seven months as well as planned use for team growth, product development, and global expansion.
              Funding raised is not cash available, and neither source discloses burn, debt, runway, liquidation
              preferences, or remaining proceeds. Capital adequacy therefore cannot be underwritten from the public
              record alone.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.4'
        title: Underwriting verdict and open diligence
        blocks:
          - type: paragraph
            body: >-
              Emergent's financial profile is attractive on reported growth but immature on disclosed economics. The
              company has a credible monetization mechanism: recurring plan fees, usage-linked credits, and hosting can
              scale with application activity. It also has evidence of financing access and global adoption. The adverse
              case is that ARR milestones are not accompanied by audited revenue, gross margin, net retention,
              paid-customer cohorts, CAC, payback, or cash-flow data. An independent review also warns that debugging,
              authentication edge cases, custom deployment, and maintenance remain material user burdens, which can
              increase support and service costs. The right financial conclusion is not that Emergent lacks demand, but
              that margin durability and cash runway remain unproven. Diligence should request monthly recurring revenue
              reconciliation, cohort retention, compute cost per credit, hosting gross margin, support burden, burn and
              runway, debt terms, and a fully diluted cap table before relying on forward valuation math.
            claimRefs:
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported demand is substantial
            body: >-
              The official page claims $100M ARR, 10M+ active builders, 12M+ applications, and reach across 190+
              countries, while earlier reporting documented rapid ARR expansion and global usage.
            calloutType: strength
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: callout
            title: Financial underwriting remains disclosure-limited
            body: >-
              No retained source provides gross margin, burn, runway, CAC payback, cohort retention, cash on hand, debt
              obligations, or a fully diluted cap table.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and user job
        blocks:
          - type: paragraph
            body: >-
              Emergent's customer-facing proposition is to turn a plain-language product idea into working software
              rather than merely generate a screen mock-up. The available descriptions consistently place the user at
              the start of a conversational loop: describe the desired application, review an output, report changes or
              failures, and let the platform revise the result. The workflow is aimed at non-technical founders and
              small teams, but it also exposes a handoff path for developers through GitHub. That combination is
              strategically useful because it lowers the initial build barrier without requiring the customer to
              surrender all control of the resulting code. It does not, however, prove that generated applications are
              production-safe without human review.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
