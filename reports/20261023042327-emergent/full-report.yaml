        max: 5
        lowLabel: Narrow task assistance
        highLabel: Full application lifecycle
        description: Ordinal analyst scale based on retained product descriptions.
      yAxis:
        label: Customer technical operating burden
        min: 1
        max: 5
        lowLabel: Platform-managed or non-technical
        highLabel: Developer-operated or internal
        description: Ordinal analyst scale based on who must build, verify, deploy, and operate.
      points:
        - label: Emergent
          x: 5
          'y': 1.5
          note: Company claims integrated full-stack building and deployment for non-technical users.
        - label: Replit
          x: 4
          'y': 4
          note: Cloud development environment with AI agents; management calls it the closest rival.
        - label: Lovable
          x: 3
          'y': 2.5
          note: Retained evidence positions it as a web-app builder; deeper operating burden is unverified.
        - label: Bolt.new
          x: 3
          'y': 3
          note: Retained profile describes browser-native rapid full-stack prototyping.
        - label: Copilot Workspace
          x: 2
          'y': 4.5
          note: Developer task environment spanning plans and changes; preview sunset in May 2025.
        - label: Internal build
          x: 5
          'y': 5
          note: Potentially broad scope with the organization retaining engineering and operations.
    approximationNotes: >-
      Coordinates are evidence-backed ordinal judgments, not measured performance. Half-points separate overlapping
      product postures; no distance or quadrant boundary is a market benchmark.
    claimRefs:
      - CP001
      - CP005
      - CP010
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer application activity can flow through plans and usage into hosting-related revenue, but gross profit is
      not publicly measurable.
    data:
      nodes:
        - id: demand
          label: Builders and teams
          description: Individuals, founders, SMBs and teams create applications.
        - id: plans
          label: Subscription plans
          description: Free, Standard and Pro tiers provide access and included credits.
        - id: usage
          label: Credit consumption
          description: AI work consumes included or additional usage credits.
        - id: hosting
          label: Hosting and deployment
          description: Applications can use platform deployment, integrations and infrastructure.
        - id: revenue
          label: Reported ARR
          description: Public sources report ARR milestones, but not audited recognized revenue.
        - id: gross-profit
          label: Gross profit
          description: Inference, hosting and support costs are not disclosed; margin is unresolved.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI013
      - CI014
    approximationNotes: >-
      Ordered commercial mechanism only; the figure does not infer conversion rates, revenue allocation, or gross
      margin.
  - id: FE001
    title: Emergent product architecture map
    type: stack
    summary: >-
      Emergent's documented workflow runs from conversational requirements through agent generation and validation to
      deployment and developer handoff.
    data:
      layers:
        - label: User intent
          detail: Natural-language requirements and conversational change requests
        - label: Agent orchestration
          detail: Application planning and code generation
        - label: Application runtime
          detail: Frontend interface, backend APIs, database, and authentication
        - label: Quality loop
          detail: Testing, debugging, and code review
        - label: Delivery
          detail: Managed deployment and hosting
        - label: Ownership
          detail: GitHub synchronization and local developer handoff
    approximationNotes: >-
      The layers show the product workflow described in public sources, not a confirmed internal service topology or
      claim that every project uses identical components.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Customer journey from idea to recurring use
    type: journey-map
    summary: >-
      Emergent's evidence supports a journey from non-technical need to deployed workflow, while recurring use and
      expansion remain the least evidenced stages.
    data:
      nodes:
        - id: need
          label: Business need
          detail: Founder or operator seeks software without a conventional engineering build.
        - id: prompt
          label: Prompted build
          detail: Natural-language request is decomposed by AI agents into an application.
        - id: deploy
          label: Deployment
          detail: Web or mobile application is tested and deployed from the platform.
        - id: workflow
          label: Operating workflow
          detail: Examples include shipment tracking, ERP, property management, and internal tools.
        - id: paid
          label: Paid account
          detail: Public reporting cites more than 200,000 paying customers in July 2026.
        - id: expand
          label: Renewal or expansion
          detail: Contract duration, churn, GRR, NRR, and expansion are not publicly disclosed.
    claimRefs:
      - CU001
      - CU005
      - CU010
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Risk priority rises where uncertain controls intersect with high operational or regulatory impact.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Generated-software regression and maintenance
          values:
            - 3
            - 4
            - 2
            - 4
        - label: Credit and hosting cost volatility
          values:
            - 3
            - 3
            - 2
            - 3
        - label: Security and production-readiness failure
          values:
            - 3
            - 4
            - 2
            - 4
        - label: EU AI Act use-case compliance
          values:
            - 3
            - 4
            - 2
            - 4
        - label: UK GDPR and explainability exposure
          values:
            - 3
            - 4
            - 2
            - 4
        - label: Provider, hosting, and integration dependency
          values:
            - 3
            - 4
            - 2
            - 4
    approximationNotes: >-
      Ordinal 1–5 analyst scale: higher means more likely, impactful, mature, or severe within the named column; ratings
      are not measured probabilities.
    claimRefs:
      - CR001
      - CR002
      - CR005
      - CR007
      - CR009
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Reported scale and financing lead to continued diligence, while operating and ownership opacity prevent a buy
      call.
    data:
      nodes:
        - id: adoption
          label: Adoption signal
          value: 1M+ builders and 1.5M apps reported in 2025
        - id: product-proof
          label: Product proof
          value: Satisfactory first version in under half an hour
        - id: financing
          label: Financing signal
          value: $1.5B reported Series C mark
        - id: valuation
          label: Valuation test
          value: About 15x company-reported ARR
        - id: downside
          label: Downside test
          value: Credit burn and production-readiness concerns
        - id: decision
          label: Decision
          value: Track pending unit economics and financing terms
      edges:
        - from: adoption
          to: product-proof
        - from: product-proof
          to: financing
        - from: financing
          to: valuation
        - from: valuation
          to: downside
        - from: downside
          to: decision
    approximationNotes: >-
      The 15x figure divides the reported $1.5B financing mark by company-reported $100M ARR; it is not an audited
      revenue multiple.
    claimRefs:
      - CV002
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV016
