              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Differentiation, controls, and diligence risks
        blocks:
          - type: paragraph
            body: >-
              Emergent differentiates through scope and interaction model: it presents agents as an engineering team in
              a box, covering architecture, database design, frontend and backend implementation, testing, debugging,
              and deployment from a conversational interface. The product surface also includes integrations and a route
              to continued development outside the platform. The trade-off is that the same abstraction can obscure
              failure modes for non-technical users. Public sources identify credit-based usage and continuing hosting
              costs, and a company interview acknowledges that design quality remains a weakness. The evidence does not
              establish security certifications, incident history, service-level commitments, reproducible quality
              metrics, or enterprise-grade permissioning. Those gaps are material for customers putting
              business-critical workflows or sensitive data on generated applications.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
