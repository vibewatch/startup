chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Emergent is described across company, accelerator, and independent sources as an AI app-builder or
              autonomous coding platform. The product proposition is to turn plain-language prompts into
              production-oriented web and mobile applications, including interface, backend, database, authentication,
              testing, and deployment. The company says users retain code ownership and can connect GitHub or host
              outside the platform, while third-party reviews describe the platform as a full-stack builder rather than
              only a UI mockup. The company was founded by twin brothers Mukund Jha and Madhav Jha, with Jha biographies
              pointing to Dunzo, Google, Penn State, Sandia National Laboratories, and Amazon experience. Public
              descriptions place the operating footprint across Bengaluru and San Francisco, but the exact legal
              headquarters and current employee count vary by source and should not be treated as settled.
            claimRefs:
