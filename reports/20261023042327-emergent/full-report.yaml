            title: Broader than a prompt-to-UI demo
            body: >-
              Independent walkthroughs describe working frontend, backend, database, authentication, code review,
              deployment, and GitHub handoff, indicating a broader intended product surface than a visual prototype
              generator.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE008
          - type: callout
            title: Production assurance remains the underwriting gap
            body: >-
              The retained evidence does not verify uptime, security certification, incident history, regression rates,
