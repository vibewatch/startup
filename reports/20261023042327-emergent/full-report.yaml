  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Emergent's relevant market is software that turns natural-language requirements into deployable web or
              mobile applications, including generation, iteration, testing, deployment, and managed operations. That
              boundary includes AI-native app builders and the broader no-code/low-code category when the buyer is
              purchasing faster application delivery rather than only a design mockup. It excludes generic chat
              assistants, isolated code-completion tools, website-only editors, and conventional outsourced development
              unless they are a direct substitute for the same application-building workflow. The status quo is a mix of
              spreadsheets, email, messaging workflows, internal IT backlogs, agency or freelance development, and
              conventional engineering teams. The distinction matters because Emergent's value proposition is workflow
              compression, not simply code generation: a third-party review describes the product as sitting between
              lightweight no-code builders and traditional development workflows, while GitHub's own Workspace
              documentation shows that multi-step natural-language development is also being incorporated into incumbent
              developer tooling.
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM019
      - number: '2.2'
        title: Sizing lenses and what remains unproven
        blocks:
          - type: paragraph
            body: >-
              The broad category is large, but it should not be treated as Emergent's obtainable market. Searchlab's
              compilation reports a $65B global no-code/low-code market size for 2026, a 26.1% 2022–2028 CAGR, and a
              $94B 2028 projection, with low-code estimated at roughly $39B and pure no-code at roughly $26B. The same
              compilation reports an $8.2B no-code website-builder segment, which is a narrower adjacent category rather
              than a clean Emergent SAM. A separate Hostinger compilation presents a different AI app-builder
              trajectory, from $6.56B in 2025 to a projected $75B by 2034. These estimates use different category
              boundaries and publishers, so they are directional lenses, not a reconciled market model.
              Emergent-specific public evidence is stronger on user reach than on addressable spend: Sacra reports more
              than 6M users and about 150,000 paying customers in early 2026, but no public source in this pool supplies
              a geography-, segment-, and spend-constrained SAM or a defensible SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM019
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The initial buyer and user are often the same person: a non-technical founder, creator, product manager,
              or operator with a concrete workflow to digitize. Sacra attributes nearly 40% of users to small businesses
              and about 70% to people without prior coding experience; it also describes use cases replacing
              spreadsheet, email, and messaging workflows. The adoption path is therefore bottom-up experimentation,
              followed by paid credits, higher usage, deployment, hosting, or team requirements. SMB and mid-market
              expansion is plausible where governance, single sign-on, custom domains, database controls, and security
              evidence reduce procurement friction. Enterprise adoption is a separate motion: the no-code/low-code
              compilation reports 77% enterprise adoption and 58% SMB adoption for that broad category, but those
              statistics do not prove Emergent's penetration. Budget ownership can move from an individual or business
              department to operations, product, or IT only after reviewability, reliability, security, and support are
              demonstrated.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The principal growth driver is the gap between demand for bespoke software and scarce engineering
              capacity. The no-code/low-code compilation reports that 87% of IT leaders say these tools help address
              developer-talent shortages, while 46% of projects are initiated by business departments rather than IT.
              Emergent's multi-agent, full-stack workflow can capture value when a buyer prioritizes speed to a working
              internal tool or MVP and accepts iterative review. Constraints are equally material: output quality still
              requires judgment and testing; a review of Emergent says it is less suitable for heavy compliance, highly
              custom technical requirements, or buyers expecting a polished product without iteration. Usage-based AI
              and hosting costs can also make casual exploration feel restrictive, while incumbent platforms are
              embedding comparable natural-language workflows. The valuation implication is that user growth and
              category growth are not sufficient by themselves; durable conversion, retention, gross margin after model
              and infrastructure costs, enterprise proof, and defensible distribution are the missing bridges from broad
              market potential to company value.
            claimRefs:
              - CM015
              - CM016
              - CM017
              - CM019
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is not one homogeneous “AI coding” category. Emergent targets entrepreneurs and
              SMBs that historically used email, spreadsheets, and messaging apps, while Replit is identified by
              Emergent’s CEO as its closest rival and Claude Code, Codex, and Cursor are positioned as developer-focused
              alternatives. Independent profiles also identify Lovable, Bolt.new, Bubble, Softr, Webflow, Glide, v0, and
              Rocket, although the retained evidence does not provide comparable scale, funding, or customer economics
              for most of them. The status quo therefore includes internal build, agencies, spreadsheet workflows, and
              conventional no-code tools. The buying decision is whether a customer values integrated software delivery
              and code ownership enough to accept a credit-metered platform and a still-unproven operating burden.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP015
              - CP016
