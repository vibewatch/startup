    claimRefs: [CP007, CP008, CP009, CP014]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Emergent is positioned as broad and low-burden for non-technical builders, while developer workflows and internal builds retain more technical operating responsibility.
    data:
      xAxis:
        label: Full-stack scope and ownership
        min: 0
        max: 5
        lowLabel: Narrow task assistance
        highLabel: Full application lifecycle
        description: Ordinal analyst scale based on retained product descriptions.
      yAxis:
        label: Customer technical operating burden
        min: 1
        max: 5
        lowLabel: Platform-managed or non-technical
        highLabel: Developer-operated or internal
        description: Ordinal analyst scale based on who must build, verify, deploy, and operate.
      points:
        - {label: Emergent, x: 5, y: 1.5, note: "Company claims integrated full-stack building and deployment for non-technical users."}
        - {label: Replit, x: 4, y: 4, note: "Cloud development environment with AI agents; management calls it the closest rival."}
        - {label: Lovable, x: 3, y: 2.5, note: "Retained evidence positions it as a web-app builder; deeper operating burden is unverified."}
        - {label: Bolt.new, x: 3, y: 3, note: "Retained profile describes browser-native rapid full-stack prototyping."}
        - {label: Copilot Workspace, x: 2, y: 4.5, note: "Developer task environment spanning plans and changes; preview sunset in May 2025."}
        - {label: Internal build, x: 5, y: 5, note: "Potentially broad scope with the organization retaining engineering and operations."}
    approximationNotes: "Coordinates are evidence-backed ordinal judgments, not measured performance. Half-points separate overlapping product postures; no distance or quadrant boundary is a market benchmark."
    claimRefs: [CP001, CP005, CP010, CP015]
