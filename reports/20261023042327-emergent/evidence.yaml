evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board, executive, ownership, and succession package.
    whyItMatters: Founder concentration and rapid financing make governance depth and control rights material to underwriting.
    diligencePath: >-
      Request the current cap table, board roster and minutes, executive ownership map, delegated authorities, and
      succession plan under NDA.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-reconciliation
    missingEvidence: A dated KPI bridge reconciling run-rate revenue or ARR, paying customers, users, applications, and headcount.
    whyItMatters: >-
      Different public sources report $100M ARR, $120M annual run-rate revenue, 95 or about 200 employees, and different
      app counts.
    diligencePath: >-
      Obtain monthly recurring-revenue and cash-collection schedules, customer cohort definitions, active-app
      methodology, and a payroll-based headcount report.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: blocking
    topic: capital-structure
    missingEvidence: >-
      Fully diluted capitalization, liquidation preferences, debt, secondary transactions, and Series C governance
      terms.
    whyItMatters: Headline funding and valuation do not establish cash available to the company or investor return economics.
    diligencePath: >-
      Request the executed financing documents, capitalization table, debt schedule, option pool, preference stack, and
      use-of-proceeds plan.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: operating-quality
    missingEvidence: >-
      Independent evidence on retention, gross margin, inference and hosting costs, security incidents, and enterprise
      conversion.
    whyItMatters: Rapid top-line and application growth can coexist with weak unit economics, churn, or reliability burden.
    diligencePath: >-
      Request cohort retention, GRR/NRR, gross-margin bridge, infrastructure spend, incident register, SLA history, and
      anonymized enterprise pipeline.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: >-
      A segment-by-segment SAM and SOM model with paying-account counts, price realization, geography, and qualification
      criteria.
    whyItMatters: >-
      Broad no-code/low-code market totals and user counts do not establish the spend Emergent can actually serve or
      win.
    diligencePath: >-
      Obtain management's 2026–2028 market model and reconcile it to active paying accounts, plan mix, geography, and
      target conversion rates.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: >-
      A methodology bridge explaining why the $65B no-code/low-code estimate and the $6.56B-to-$75B AI app-builder
      estimate use compatible or incompatible category definitions.
    whyItMatters: Treating unlike market estimates as additive or interchangeable would overstate the opportunity.
    diligencePath: >-
      Request the underlying publisher definitions, included vendors, geography, currency basis, and forecast
      methodology for each estimate.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: enterprise-adoption
    missingEvidence: >-
      Independent customer and procurement evidence showing paid conversion, renewal, security review, and budget
      ownership by segment.
    whyItMatters: Category adoption statistics are not evidence of Emergent-specific enterprise penetration or durable monetization.
    diligencePath: >-
      Review anonymized cohort retention, plan mix, sales pipeline, procurement cycle time, and customer references
      across SMB, mid-market, and enterprise.
    relatedQuestionRefs:
      - QM004
      - QM006
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: differentiation
    missingEvidence: >-
      Cohort retention, multi-homing, migration behavior, and customer references segmented by SMB, startup, and
      enterprise buyer.
    whyItMatters: >-
      Without switching-cost and retention evidence, workflow breadth may be copied or undercut by better-funded
      developer and no-code platforms.
    diligencePath: >-
      Request anonymized retention cohorts, churn reasons, exported-project migration examples, and reference calls from
      each target segment.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Independent security review, certifications, incident history, SLA terms, and enterprise procurement artifacts
      specific to Emergent.
    whyItMatters: >-
      Security and governance can determine whether serious businesses adopt generated applications or retain internal
      build and review controls.
    diligencePath: >-
      Obtain current SOC 2 or equivalent reports, penetration-test summary, incident register, SLA, subprocessors, and
      customer security questionnaire responses.
    relatedQuestionRefs:
      - QP008
  - type: conflicting-data
    severity: minor
    topic: pricing
    missingEvidence: >-
      A dated, region-specific explanation reconciling official annual-billing cards with external monthly-price
      reporting.
    whyItMatters: >-
      Credit-based pricing makes effective cost and procurement approval sensitive to billing period, included credits,
      and overage rules.
    diligencePath: >-
      Capture current checkout pricing, credit consumption examples, overage terms, and unused-credit policy for each
      plan.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited revenue reconciliation, paid-customer cohorts, gross margin, inference cost, hosting cost, CAC and
      payback.
    whyItMatters: >-
      Reported ARR and usage can grow while contribution economics deteriorate under high model, hosting and support
      costs.
    diligencePath: >-
      Request monthly cohort files, revenue recognition policy, compute-cost ledger, support-cost allocation and
      channel-spend bridge.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
      - QI007
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Cash balance, monthly burn, runway, debt schedule, financing terms and fully diluted cap table.
    whyItMatters: Funding raised and valuation do not establish liquidity or investor return outcomes.
    diligencePath: Obtain the latest management accounts, cash forecast, debt agreements, cap table and preferred-share rights.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: production-assurance
    missingEvidence: >-
      Independent uptime, defect escape, rollback, backup, and incident metrics for applications deployed through
      Emergent.
    whyItMatters: >-
      Customers may use generated applications for business-critical workflows, but the retained public evidence does
      not quantify operational reliability.
    diligencePath: >-
      Request a current SLA, uptime history, incident register, rollback procedure, backup policy, and representative
      production references.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Security architecture, penetration-test results, data-isolation model, permissions testing, and compliance
      attestations.
    whyItMatters: >-
      Natural-language generation can hide authorization and data-handling defects from non-technical users and
      enterprise buyers.
    diligencePath: >-
      Obtain the security package, architecture review, subprocessors list, audit reports, and customer security
      questionnaire responses.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, package adoption, issue resolution history, or another independently measurable
      practitioner signal.
    whyItMatters: >-
      The available practitioner reviews describe features but do not establish sustained developer usage, release
      cadence, or ecosystem durability.
    diligencePath: >-
      Request anonymized release cadence and support metrics, then verify any public repositories, integrations, package
      usage, or developer-community activity.
    relatedQuestionRefs:
      - QE003
      - QE006
  - type: missing-source
    severity: minor
    topic: roadmap
    missingEvidence: >-
      Dated roadmap milestones for mobile support, enterprise permissions, security, and local or open-source model
      support.
    whyItMatters: >-
      Product maturity and enterprise readiness depend on whether these capabilities are shipped rather than merely
      planned.
    diligencePath: Request the current product roadmap, release notes, and customer-available feature matrix.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: missing-source
    severity: blocking
    topic: retention
    missingEvidence: >-
      Customer-level cohorts showing paid activation, renewal, churn, GRR, NRR, and usage persistence by plan and
      segment.
    whyItMatters: >-
      Large user and application counts can coexist with low paid retention; durability is central to valuing recurring
      software revenue.
    diligencePath: >-
      Request cohort tables and a revenue-retention bridge from management, segmented by customer type, geography, and
      plan.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: Named customer references with production status, contract duration, measurable outcomes, and renewal history.
    whyItMatters: Public examples show use-case breadth but do not establish production depth or customer value realization.
    diligencePath: Obtain reference calls and anonymized deployment metrics covering at least three customer segments.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Revenue concentration by top customer, segment, geography, channel, and partner.
    whyItMatters: A global user count does not rule out dependence on a small number of paying accounts or acquisition channels.
    diligencePath: Request top-10 customer concentration, channel-sourced bookings, and geographic revenue tables.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: enterprise
    missingEvidence: Enterprise pipeline, production deployments, security review completion, SLA coverage, and procurement cycle data.
    whyItMatters: >-
      Enterprise expansion is a stated opportunity, but public evidence describes it as nascent and does not quantify
      conversion.
    diligencePath: >-
      Review enterprise contracts, pilot-to-production conversion, security questionnaires, and SLA commitments under
      NDA.
    relatedQuestionRefs:
      - QU008
  - type: conflicting-data
    severity: minor
    topic: adoption
    missingEvidence: A dated management metric pack reconciling users, applications, paying customers, ARR, and revenue definitions.
    whyItMatters: Different snapshots use different periods and definitions, so simple growth-rate calculations would be misleading.
    diligencePath: Ask management to reconcile the January and July 2026 metrics with definitions and source dates.
    relatedQuestionRefs:
      - QU002
      - QU007
  - type: missing-source
    severity: blocking
    topic: incidents
    missingEvidence: A complete incident, outage, security, data-loss, and recovery history with customer impact and dates.
    whyItMatters: Anecdotal reports cannot establish frequency, severity, or whether controls are improving.
    diligencePath: >-
      Request an incident register, postmortems, SLA credits, recovery-time metrics, and security questionnaire
      responses under NDA.
    relatedQuestionRefs:
      - QR001
      - QR006
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Gross margin after model inference, hosting, support, and deployment costs, plus cash burn and runway.
    whyItMatters: Rapid ARR or funding does not show cash generation or resilience if usage costs rise.
    diligencePath: Obtain monthly management accounts, cohort gross margin, usage-cost allocation, burn, runway, and financing terms.
    relatedQuestionRefs:
      - QR002
      - QR006
  - type: missing-source
    severity: material
    topic: enterprise-conversion
    missingEvidence: Enterprise pilot count, conversion, contract value, retention, procurement blockers, and security review outcomes.
    whyItMatters: >-
      Enterprise conversion is central to monetization and governance economics but is described as nascent in public
      evidence.
    diligencePath: Review anonymized pipeline cohorts, pilot-to-paid conversion, renewal data, and customer reference calls.
    relatedQuestionRefs:
      - QR006
  - type: missing-source
    severity: material
    topic: regulatory-scope
    missingEvidence: >-
