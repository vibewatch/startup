company:
  name: Emergent
chapter:
  number: 1
  title: Company Overview
  summary: Emergent is a 2024-founded AI application platform built by Mukund and Madhav Jha that turns natural-language prompts into full-stack software. Public evidence supports rapid financing and adoption claims, but private-company operating metrics, governance detail, and retention remain unevenly disclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and operating footprint
    body: Emergent is described across company, accelerator, and independent sources as an AI app-builder or autonomous coding platform. The product proposition is to turn plain-language prompts into production-oriented web and mobile applications, including interface, backend, database, authentication, testing, and deployment. The company says users retain code ownership and can connect GitHub or host outside the platform, while third-party reviews describe the platform as a full-stack builder rather than only a UI mockup. The company was founded by twin brothers Mukund Jha and Madhav Jha, with Jha biographies pointing to Dunzo, Google, Penn State, Sandia National Laboratories, and Amazon experience. Public descriptions place the operating footprint across Bengaluru and San Francisco, but the exact legal headquarters and current employee count vary by source and should not be treated as settled.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: The public leadership record is concentrated in the two co-founders. Mukund Jha is identified as co-founder and CEO and Madhav Jha as co-founder and CTO; the available profiles provide meaningful technical and operating backgrounds but little public detail on directors, independent governance, executive depth, or succession. That concentration is relevant because the company is scaling quickly and is moving from individual and small-business use cases toward enterprise features such as governance, SSO, and security controls. The evidence therefore supports founder-market fit, not a complete governance assessment. A diligence process should request the board composition, executive ownership map, security accountability, and succession plan.
    claimRefs: [CO004, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-scale-and-milestones
    title: Financing, scale, and milestone record
    body: >-
      The financing record is unusually compressed: sources describe a $7 million seed round, a $23 million Series A, a $70 million Series B at a reported $300 million post-money valuation, and a $130 million Series C at a reported $1.5 billion valuation. TechCrunch independently reported the Series C, total funding, a $120 million annual run-rate revenue figure, more than 200,000 paying customers, and about 200 employees in July 2026; the company release reported more than 12 million applications and a $1.5 billion valuation. Other profiles publish materially different figures, including $100 million ARR, 95 employees, or earlier user and application counts. These are not interchangeable metrics: the evidence supports the existence of rapid growth and financing, while the exact current revenue, customer, app-count, and headcount baseline remains a reconciliation item.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: diligence-gaps
    title: Current diligence posture
    body: The strongest public evidence establishes product identity, founder biographies, financing announcements, and selected scale disclosures. It does not establish audited revenue, cash balance, gross margin, retention, customer concentration, cap-table terms, board governance, security incident history, or the durability of application activity. A critical independent review notes that generated code still carries maintenance, dependency, security, and technical-debt obligations; that limitation is material to the company’s positioning because code ownership transfers responsibility rather than eliminating it. The chapter’s conclusion is therefore positive on identity and momentum but conservative on operating quality and governance until primary diligence materials are available.
    claimRefs: [CO003, CO012, CO016]
