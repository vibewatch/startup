callouts:
  - calloutType: strength
    title: Founder-market fit and financing momentum
    body: The founders combine prior startup operating experience with deep technical credentials, while independent reporting corroborates a rapid sequence of institutional financings and a $1.5B Series C valuation.
    claimRefs: [CO004, CO006, CO007, CO011]
  - calloutType: risk
    title: Scale metrics need reconciliation
    body: Public sources disagree on ARR or run-rate revenue, headcount, users, and applications; the differences may reflect timing or definitions, but they prevent a clean current baseline without company diligence.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
  - calloutType: assumption
    title: Code ownership does not remove operating responsibility
    body: Independent product review evidence indicates that exported generated code still carries maintenance, security, dependency, and technical-debt obligations.
    claimRefs: [CO003]
