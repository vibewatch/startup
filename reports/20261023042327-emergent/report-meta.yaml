  topStrengths:
    - Rapid financing and reported revenue growth indicate strong market demand and fundraising access.
    - Natural-language full-stack generation addresses a clear pain point for non-technical builders and SMBs.
    - Founder backgrounds and investor support provide credible technical and commercial momentum.
  topRisks:
    - Retention, gross margin, inference cost, CAC payback, and cash burn are not publicly established.
    - Generated software still carries maintenance, security, integration, and production-readiness risk.
    - Governance depth, enterprise control effectiveness, incident history, and financing terms remain opaque.
  unresolvedGaps:
    - Cohort retention, GRR, NRR, and active-paying-customer behavior by plan and geography.
    - Gross margin, inference and hosting-cost burden, support intensity, and CAC payback.
    - Incident history, SLA commitments, security diligence artifacts, and enterprise procurement proof.
    - Pipeline quality and enterprise conversion evidence beyond first-party case studies.
    - Fully diluted cap table, liquidation preferences, and other financing terms that drive actual return math.
