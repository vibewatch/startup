        - label: Agent orchestration
          detail: Application planning and code generation
        - label: Application runtime
          detail: Frontend interface, backend APIs, database, and authentication
        - label: Quality loop
          detail: Testing, debugging, and code review
        - label: Delivery
          detail: Managed deployment and hosting
        - label: Ownership
