      internal service topology or claim that every project uses identical components.
    claimRefs: [CE001, CE005, CE006, CE007, CE008]
callouts:
  - calloutType: strength
    title: Broader than a prompt-to-UI demo
    body: >-
      Independent walkthroughs describe working frontend, backend, database, authentication,
      code review, deployment, and GitHub handoff, indicating a broader intended product surface
      than a visual prototype generator.
    claimRefs: [CE005, CE006, CE008]
  - calloutType: risk
    title: Production assurance remains the underwriting gap
    body: >-
      The retained evidence does not verify uptime, security certification, incident history,
      regression rates, authorization quality, or enterprise service commitments for generated
      applications.
    claimRefs: [CE011, CE012]
