      - ["Iterate after review", "Describe layout or feature changes conversationally", "Agent revises relevant application components", "Reduces manual editing for supported changes", "Regression and scope-control performance are not published"]
      - ["Operate an internal tool", "Describe screens, forms, workflows, and data handling", "Builder creates internal software around the described process", "May reduce engineering queue dependence", "Security and governance evidence is incomplete"]
      - ["Move from prototype to engineering ownership", "Export or synchronize project with GitHub", "Developers continue locally and collaborate on code", "Reduces platform lock-in risk", "Exact export completeness and support obligations require diligence"]
      - ["Keep an application live", "Deploy through managed platform hosting", "Platform handles deployment path", "Avoids separate initial hosting configuration", "Ongoing hosting credits and service terms affect economics"]
    notes: >-
      The table distinguishes described workflow benefits from measured outcomes; no row should
      be read as a verified conversion, uptime, or productivity benchmark.
    claimRefs: [CE001, CE002, CE006, CE008, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Conversational interface", "Captures requirements and change requests", "User prompts and review", "Ambiguous requirements can create incorrect scope"]
      - ["Agent planning and code generation", "Produces application structure and implementation", "Model behavior and platform orchestration", "Quality and repeatability are not independently benchmarked"]
      - ["Frontend layer", "Delivers application screens and responsive user experience", "Generated React or comparable frontend output", "Design consistency and accessibility require review"]
      - ["Backend and API layer", "Implements business logic and integrations", "Generated backend services and external APIs", "Authorization and error handling need testing"]
      - ["Data layer", "Stores application records and relationships", "Generated or configured database", "Data isolation, migration, and backup controls are not evidenced"]
      - ["Testing and code review", "Finds defects and suggests fixes", "Agent analysis plus user validation", "Human oversight remains necessary before production"]
      - ["Deployment and hosting", "Makes the application accessible to users", "Managed platform environment", "Availability, rollback, and cost controls are not publicly substantiated"]
      - ["GitHub handoff", "Enables local development and collaboration", "Repository integration and developer processes", "Export fidelity and long-term support need verification"]
    notes: >-
      Architecture rows synthesize the specific components described by the retained technical
      and practitioner sources; they are not an official security or reference-architecture
      specification.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE012]
