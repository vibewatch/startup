  evidenceGaps:
    - type: missing-source
      severity: material
      topic: production-assurance
      missingEvidence: Independent uptime, defect escape, rollback, backup, and incident metrics for applications deployed through Emergent.
      whyItMatters: Customers may use generated applications for business-critical workflows, but the retained public evidence does not quantify operational reliability.
      diligencePath: Request a current SLA, uptime history, incident register, rollback procedure, backup policy, and representative production references.
      relatedQuestionRefs: [QE006]
    - type: private-evidence-only
      severity: material
      topic: trust-controls
      missingEvidence: Security architecture, penetration-test results, data-isolation model, permissions testing, and compliance attestations.
      whyItMatters: Natural-language generation can hide authorization and data-handling defects from non-technical users and enterprise buyers.
      diligencePath: Obtain the security package, architecture review, subprocessors list, audit reports, and customer security questionnaire responses.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public repository activity, package adoption, issue resolution history, or another independently measurable practitioner signal.
      whyItMatters: The available practitioner reviews describe features but do not establish sustained developer usage, release cadence, or ecosystem durability.
      diligencePath: Request anonymized release cadence and support metrics, then verify any public repositories, integrations, package usage, or developer-community activity.
      relatedQuestionRefs: [QE003, QE006]
    - type: missing-source
      severity: minor
      topic: roadmap
      missingEvidence: Dated roadmap milestones for mobile support, enterprise permissions, security, and local or open-source model support.
      whyItMatters: Product maturity and enterprise readiness depend on whether these capabilities are shipped rather than merely planned.
      diligencePath: Request the current product roadmap, release notes, and customer-available feature matrix.
      relatedQuestionRefs: [QE004, QE007]
