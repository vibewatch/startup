schemaVersion: "report-v2"
artifact: risks
slug: emergent
runDate: 2026-10-23
company:
  name: Emergent
chapter:
  number: 7
  title: Risks
  summary: Emergent's principal risks are maintainability and cost control in AI-generated software, immature evidence for enterprise-grade operations, and an expanding compliance burden as customers use generated applications in regulated contexts. The public record provides concrete mitigations and regulatory frameworks, but does not establish incident rates, customer-level loss experience, or the maturity of Emergent's controls.
sections:
  - id: risk-ranking
    title: Ranked risk assessment
    body: >-
      The highest residual risk is execution risk after initial generation. Independent product reviews describe rapid prototyping as a strength, but warn that applications accumulate permissions, integrations, business rules, and edge cases that still require testing, monitoring, and maintenance. Credit-based pricing adds a second execution exposure because the same review says repeated iterations and debugging can make refinement costs less predictable, while product documentation records a 50-credit monthly charge for a continuously deployed web app. These are not evidence of failure, but they create measurable monitoring needs: defect escape rates, rollback frequency, credit consumption per active application, and the share of production changes reviewed by qualified engineers.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Emergent's exposure depends on what customers build and where those applications operate, not only on the platform's generic label. The European Commission states that transparency rules for certain AI systems take effect in August 2026, while high-risk systems in sensitive areas face obligations including risk assessment, logging, documentation, human oversight, robustness, cybersecurity, and accuracy from December 2027. The ICO separately frames AI use as a UK GDPR data-protection issue and provides guidance on explaining AI-assisted decisions and assessing risks to individual rights. Emergent therefore needs customer-facing classification, data-processing, auditability, and incident-escalation workflows; the assigned evidence does not prove that every enterprise control is already implemented.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operating-dependencies
    title: Operating, partner, and financial-model dependencies
    body: >-
      The business model creates dependency on third-party models, hosting, deployment infrastructure, integrations, and venture-funded product execution. Public summaries describe subscription, usage-based compute, and hosting revenue, while the company profile reports rapid ARR and user milestones but also notes that profitability evidence is not public. A large user base can increase support, reliability, and abuse-management load without proving durable paid retention. Enterprise adoption is described as nascent and concentrated in pilots, so the path from broad usage to repeatable, high-quality enterprise revenue remains an open question. Management should monitor model-provider concentration, gross margin after inference and hosting, paid conversion by cohort, support burden, and working-capital needs rather than treating funding raised as operating cash or ARR as cash generation.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: mitigation-and-kill-criteria
    title: Mitigations, monitoring, and thesis-break triggers
    body: >-
      Some mitigations are visible in the assigned material: GitHub integration and branches can support code ownership and review; product documentation describes testing, previews, rollback, secure environment variables, and enterprise deployment options; NIST provides a voluntary AI Risk Management Framework and a generative-AI profile that can structure risk identification and evaluation. These mechanisms reduce process risk only if customers use them consistently and if Emergent can evidence control effectiveness. The thesis should be revisited if material outages or security incidents recur, if credit consumption or gross margin deteriorates as deployments scale, if enterprise pilots fail to convert, or if regulatory obligations require capabilities that are not available on the relevant plan. Diligence should request incident history, SLA terms, control attestations, model and subprocessors, customer concentration, and cohort retention.
    claimRefs: [CR013, CR014, CR015, CR016]

tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Status and likelihood, Severity, Mitigation and residual exposure, Diligence path]
    rows:
      - ["AI transparency and labeling obligations for certain systems", "EU", "Rules take effect August 2026; likelihood depends on customer use cases", "High", "Classify use cases, label applicable AI output, and maintain customer guidance; residual scope risk remains", "Map product features and customer deployments to AI Act transparency duties"]
      - ["High-risk AI obligations including logging, documentation, human oversight, robustness, cybersecurity, and accuracy", "EU", "Sensitive-area obligations apply from December 2027; likelihood is customer/use-case dependent", "High", "Maintain traceability and oversight controls; residual compliance and implementation risk remains", "Obtain control matrix, audit logs, model documentation, and deployment responsibility split"]
      - ["AI-assisted decisions and personal-data processing under UK GDPR", "UK", "ICO guidance is available; likelihood depends on data and decision context", "High", "Provide data-protection assessment and explainability workflows; residual rights risk is unquantified", "Review DPA, subprocessor list, retention/deletion controls, and rights-request process"]
    notes: "Sources: European Commission, ICO, and NIST guidance; rows are a partial risk register for public evidence and do not enumerate every customer jurisdiction or use case."
    enumerationScope:
      coverage: partial
      basis: "Public regulatory guidance reviewed through 2026-10-23, limited to EU and UK AI/data-protection exposures"
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["AI regression or hidden defects as applications accumulate complexity", "Medium-high", "High", "Partial: previews, testing, and GitHub workflows are described", "High for critical workflows", "No public defect, rollback, or incident-rate series"]
      - ["Credit-cost escalation from iterative changes and always-on deployment", "Medium", "Medium-high", "Partial: published plan credits and deployment charge", "Medium-high", "No public cost-per-application or margin disclosure"]
      - ["Security, permissions, integration, or production-readiness failure", "Medium", "High", "Partial: enterprise controls and deployment features are described", "High until independently evidenced", "No public independent control test or complete incident history"]
      - ["Data loss or empty-project outcome reported by users", "Unknown", "High", "Unclear: public commentary is anecdotal", "High because incidence is unknown", "Obtain ticket, outage, recovery, and customer-impact records"]
    notes: "Rows synthesize independent reviews, product documentation, and public commentary; likelihood and residual exposure are analytical judgments tied to the cited evidence, not measured incident probabilities."
    claimRefs: [CR001, CR002, CR003, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Foundation models and AI compute", "Third-party model providers", "Price, availability, policy, or model-quality change compresses margin or degrades output", "High", "Track provider mix, fallback capability, and per-application compute cost", "High; provider concentration and contractual protections are not public"]
      - ["Hosting and deployment infrastructure", "Emergent-managed deployment and cloud providers", "Outage, quota, or deployment failure interrupts customer applications", "High", "Use previews, rollback, environment controls, and customer-owned repositories where available", "Medium-high; SLA and incident history are not public"]
      - ["Enterprise integrations and identity", "GitHub, OAuth, Stripe, Supabase, APIs, and customer VPCs", "Dependency outage, permission error, or incompatible change breaks workflows", "Medium-high", "Use branches, pull requests, tests, and customer-VPC options", "Medium-high; integration failure rates are not disclosed"]
      - ["Capital and enterprise conversion", "Investors and prospective enterprise customers", "Funding dependence or weak pilot conversion slows hiring, controls, and roadmap delivery", "Medium-high", "Measure paid retention, pilot conversion, gross margin, and runway separately", "High; profitability, cohort retention, and pilot conversion remain gaps"]
    notes: "Dependency roles are drawn from the assigned product and market sources; no counterparty concentration percentages or contractual terms were publicly available in the reviewed text."
    claimRefs: [CR009, CR010, CR011, CR012, CR015]

figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Risk priority rises where uncertain controls intersect with high operational or regulatory impact.
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual severity]
      rows:
        - label: Generated-software regression and maintenance
          values: [3, 4, 2, 4]
        - label: Credit and hosting cost volatility
          values: [3, 3, 2, 3]
        - label: Security and production-readiness failure
          values: [3, 4, 2, 4]
        - label: EU AI Act use-case compliance
          values: [3, 4, 2, 4]
        - label: UK GDPR and explainability exposure
          values: [3, 4, 2, 4]
        - label: Provider, hosting, and integration dependency
          values: [3, 4, 2, 4]
    approximationNotes: "Ordinal 1–5 analyst scale: higher means more likely, impactful, mature, or severe within the named column; ratings are not measured probabilities."
    claimRefs: [CR001, CR002, CR005, CR007, CR009]

callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: "A repeatable pattern of material outages, security incidents, unrecovered data loss, or uncontrolled credit consumption would undermine the case that rapid generation translates into dependable production software."
    claimRefs: [CR001, CR002, CR003, CR013]
  - calloutType: assumption
    title: Evidence boundary
    body: "Public evidence supports a risk framework and specific control questions, but it does not establish Emergent's incident frequency, customer-level retention, gross margin, or profitability."
    claimRefs: [CR010, CR011, CR016]

