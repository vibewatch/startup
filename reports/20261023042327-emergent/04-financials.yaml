schemaVersion: "report-v2"
artifact: financials
slug: emergent
runDate: 2026-10-23
company:
  name: Emergent
chapter:
  number: 4
  title: Financials
  summary: >-
    Emergent has a usage-led, credit-based monetization model and publicly reported
    rapid ARR and user growth, but the available record does not disclose realized
    revenue, gross margin, burn, cash, runway, or customer-level retention. The
    underwriting case therefore rests on strong reported demand and substantial
    financing, offset by unresolved unit economics and infrastructure-cost risk.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: >-
      Emergent monetizes access to an AI application-building platform rather than
      selling a single software license. Its official pricing page lists a free
      tier, a Standard plan at $20 per month with 100 credits, and a Pro plan at
      $200 per month with 750 credits; larger business tiers are custom-priced.
      The same page describes extra-credit purchases, hosting, integrations, and
      team controls, while an independent review describes serious projects as
      typically spending $50–100 or more per month in credits. These are list or
      observed pricing signals, not realized revenue or gross margin. Company and
      third-party pages report ARR milestones ranging from $50 million in January
      2026 to $100 million in 2026, but these remain company-claimed or
      secondary-reported run-rate figures and are not audited revenue. The mix of
      subscriptions, usage-linked credits, and hosting makes revenue quality
      dependent on paid conversion, usage intensity, and compute cost control.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-sales-efficiency
    title: Traction and sales-efficiency proxies
    body: >-
      Public traction is large but denominators are inconsistent. Emergent's
      about page currently claims $100 million ARR, 10 million active builders,
      12 million applications, and reach in more than 190 countries. An external
      review records free, Standard, and Pro price points and says the product is
      most compelling for non-technical founders, product managers, solo operators,
      and agencies. Moneycontrol reported company claims of a $25 million
      annualized revenue run rate and 2.5 million users in under five months in
      December 2025. A January 2026 funding report then said more than five
      million users were building products across more than 190 countries and
      reported a rise from $100,000 to $50 million ARR in seven months. These
      disclosures provide evidence of distribution and monetization velocity,
      but not CAC, sales cycle, payback, retention, active paid accounts, or
      enterprise contract economics. The current evidence supports a self-serve
      or product-led acquisition hypothesis; it does not establish that reported
      user growth converts into durable paid revenue.
    claimRefs: [CI005, CI006, CI007, CI008, CI016]
    tableRefs: [TI002]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure and capital adequacy
    body: >-
      The platform's cost base is likely shaped by model inference, hosting,
      storage, support, and the engineering required to test and maintain
      generated applications, but public sources do not quantify any of those
      components. The official product page says the platform handles backend
      data management, authentication, integrations, payments, deployment, and
      infrastructure; those capabilities expand the service-delivery surface
      beyond a simple seat license. Public financing disclosures provide capital
      history but not cash on hand: Silicon Valley Investclub lists $230 million
      of total funding and a $1.5 billion July 2026 valuation, while Intelligent
      CIO reported a $70 million Series B and $100 million raised within seven
      months as well as planned use for team growth, product development, and
      global expansion. Funding raised is not cash available, and neither source
      discloses burn, debt, runway, liquidation preferences, or remaining
      proceeds. Capital adequacy therefore cannot be underwritten from the public
      record alone.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Underwriting verdict and open diligence
    body: >-
      Emergent's financial profile is attractive on reported growth but immature
      on disclosed economics. The company has a credible monetization mechanism:
      recurring plan fees, usage-linked credits, and hosting can scale with
      application activity. It also has evidence of financing access and global
      adoption. The adverse case is that ARR milestones are not accompanied by
      audited revenue, gross margin, net retention, paid-customer cohorts, CAC,
      payback, or cash-flow data. An independent review also warns that debugging,
      authentication edge cases, custom deployment, and maintenance remain
      material user burdens, which can increase support and service costs. The
      right financial conclusion is not that Emergent lacks demand, but that
      margin durability and cash runway remain unproven. Diligence should request
      monthly recurring revenue reconciliation, cohort retention, compute cost per
      credit, hosting gross margin, support burden, burn and runway, debt terms,
      and a fully diluted cap table before relying on forward valuation math.
    claimRefs: [CI013, CI014, CI015]
tables:
  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Current value/status, Quality, Diligence ask]
    rows:
      - [Subscription plans, "Monthly or annual access tiers", "$0, $20/mo Standard, $200/mo Pro listed", "Official list pricing; not realized revenue", "Paid conversion and realized ARPU by plan"]
      - [Usage credits, "Included and additional AI credits", "100 Standard credits; 750 Pro credits", "Official list terms; compute economics undisclosed", "Inference cost per credit and overage pricing"]
      - [Hosting and deployment, "Platform hosting and deployment services", "Feature and custom-tier signal; value undisclosed", "Company-described monetization surface", "Hosting revenue, utilization, and gross margin"]
      - [Enterprise controls, "Custom tiers with SSO, RBAC, audit logs and VPC support", "Custom pricing", "Official offering; contract value undisclosed", "ACV, sales cycle, implementation cost and renewal"]
    notes: >-
      Sources are official list pricing and product descriptions; no row is a
      recognized-revenue measure, and custom tiers have no public realized price.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Public traction and sales-efficiency proxies
    columns: [Metric, Period, Value or status, Evidence class, Underwriting implication]
    rows:
      - [ARR, "Seven months after launch", "$50M reported", "Company statement reproduced by Intelligent CIO", "Strong monetization velocity; unaudited"]
      - [Annualized revenue run rate, "Under five months / December 2025 report", "$25M company claimed", "Company statement reported by Moneycontrol", "Earlier milestone; reconciliation to later ARR required"]
      - [ARR, "Eight months / 2026", "$100M claimed", "Company official about page", "Supports demand; reconciliation required"]
      - [Active builders, "Current official page", "10M+", "Company claimed", "Distribution signal; paid share unknown"]
      - [Applications created, "Current official page", "12M+", "Company claimed", "Usage signal; revenue per app unknown"]
      - [Geographic reach, "Current official page", "190+ countries", "Company claimed", "Broad distribution; regional unit economics unknown"]
      - [CAC, "Current public record", null, "Not disclosed", "Request channel spend and payback cohorts"]
    notes: >-
      The published figures use different periods and denominators. They are not
      interchangeable and do not establish paid-customer retention or CAC.
    claimRefs: [CI005, CI006, CI007, CI008, CI013]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, "Unavailable", "Determines whether usage growth creates contribution profit", "Monthly gross-margin bridge by plan and workload"]
      - [Inference and hosting cost, null, "Unavailable", "Core variable cost in credit-led monetization", "Cost per credit and hosting utilization"]
      - [CAC and payback, null, "Unavailable", "Tests whether self-serve growth is economically repeatable", "Cohort CAC, payback and channel mix"]
      - [Cash on hand and runway, null, "Unavailable", "Determines financing dependency", "Latest cash, burn, runway and budget"]
      - [Debt and project-finance obligations, null, "Unavailable", "Could constrain future cash deployment", "Debt schedule, covenants and guarantees"]
      - [Fully diluted ownership, null, "Unavailable", "Controls investor return math", "Cap table, preferences and option pool"]
    notes: >-
      Null values mean the assigned public sources did not disclose the metric;
      they are not zero and should be obtained in diligence.
    claimRefs: [CI009, CI010, CI011, CI012, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Customer application activity can flow through plans and usage into
      hosting-related revenue, but gross profit is not publicly measurable.
    data:
      nodes:
        - id: demand
          label: Builders and teams
          description: "Individuals, founders, SMBs and teams create applications."
        - id: plans
          label: Subscription plans
          description: "Free, Standard and Pro tiers provide access and included credits."
        - id: usage
          label: Credit consumption
          description: "AI work consumes included or additional usage credits."
        - id: hosting
          label: Hosting and deployment
          description: "Applications can use platform deployment, integrations and infrastructure."
        - id: revenue
          label: Reported ARR
          description: "Public sources report ARR milestones, but not audited recognized revenue."
        - id: gross-profit
          label: Gross profit
          description: "Inference, hosting and support costs are not disclosed; margin is unresolved."
    claimRefs: [CI001, CI003, CI005, CI006, CI013, CI014]
    approximationNotes: >-
      Ordered commercial mechanism only; the figure does not infer conversion
      rates, revenue allocation, or gross margin.
callouts:
  - calloutType: strength
    title: Reported demand is substantial
    body: >-
      The official page claims $100M ARR, 10M+ active builders, 12M+ applications,
      and reach across 190+ countries, while earlier reporting documented rapid
      ARR expansion and global usage.
    claimRefs: [CI005, CI006, CI007, CI008]
  - calloutType: risk
    title: Financial underwriting remains disclosure-limited
    body: >-
      No retained source provides gross margin, burn, runway, CAC payback, cohort
      retention, cash on hand, debt obligations, or a fully diluted cap table.
    claimRefs: [CI012, CI013, CI014, CI015]
