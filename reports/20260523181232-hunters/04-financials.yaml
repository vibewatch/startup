    - Medium
    - Marketplace fees, billing mechanics, and attach-rate economics
    - Confirms a channel route but not price transparency
  - - Microsoft Sentinel (comp)
    - GB-based analytics and data-lake tiers with commitment pricing
    - Public list model
    - High
    - Customer-specific blended rates and Azure consumption interplay
    - Shows one transparent competitor benchmark
  - - Splunk (comp)
    - Ingest, workload, and entity pricing models
    - Public model menu, not a single universal rate
    - Medium
    - Actual contract rates and bundled discounts
    - Shows pricing architecture itself is a competitive variable
  - - LimaCharlie (comp)
    - $3.00 per endpoint and $0.20 per GB
    - Public month-to-month pricing
    - Medium
    - Large-customer discounts and service-layer costs
    - Shows a transparent modular alternative to quote-led pricing
  notes: This table separates Hunters-specific public evidence from competitor benchmarks. Comparable rows are context for underwriting pricing architecture, not evidence of Hunters realized pricing.
