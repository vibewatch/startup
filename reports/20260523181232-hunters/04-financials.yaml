- id: unit-economics-and-cost-structure-proxies
  title: Unit economics and cost-structure proxies
  body: Public evidence is rich enough to sketch the economic shape of the model, but not rich enough to underwrite it cleanly. Hunters markets fast deployment, automation, and minimal detection-engineering burden, which is consistent with a software model that should have strong gross margins if cloud and support costs stay controlled. At the same time, the same public materials emphasize ingesting broad telemetry into an open security data lake, which implies real storage, compute, and retention costs. Because Hunters is private, the public file never tells us where that balance lands. The cleanest workaround is comparable public security SaaS. CrowdStrike and SentinelOne both disclose gross-margin and sales-and-marketing structures that imply a plausible gross-margin band in the low-70s to high-70s and a go-to-market load between the high-30s and low-50s percent of revenue. That does not make those metrics Hunters facts; it only establishes what a similar security software model can look
    like when disclosed. Hunters-specific ARR, NRR, CAC payback, recognized revenue mix, and gross margin all remain private, so any serious diligence still depends on management-certified operating data.
