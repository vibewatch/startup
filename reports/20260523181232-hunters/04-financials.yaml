  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-balance
    missingEvidence: Current cash, cash equivalents, and short-term investments as of the latest month-end.
    whyItMatters: Without a cash balance, historical fund-raising does not translate into a current liquidity view or solvency cushion.
    diligencePath: Request the latest board package, monthly balance sheet, and bank cash schedule; reconcile to any escrow or restricted-cash balances.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: burn-and-runway
    missingEvidence: Monthly net burn, free cash flow, and management runway estimate under the current budget.
    whyItMatters: Runway is the central financing-dependency metric for a private SaaS vendor and is completely absent from the public record.
    diligencePath: Request trailing-twelve-month cash-flow statements, the current operating plan, and management's runway bridge by scenario.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cogs
    missingEvidence: Gross margin by product line plus hosting, storage, and support cost detail.
    whyItMatters: Hunters' data-lake and ingestion positioning could create attractive software margins or materially heavier cloud COGS depending architecture and retention behavior.
    diligencePath: Request monthly gross-margin reports, cloud bills, storage-retention policy, and customer-level usage cohorts.
    relatedQuestionRefs:
    - QI020
    - QI023
    - QI029
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback, pipeline conversion, net revenue retention, and gross retention by cohort.
    whyItMatters: The business could still be cash-hungry even with strong gross margin if enterprise sales or channel acquisition costs are too high.
    diligencePath: Request cohort retention tables, sales-efficiency dashboards, and direct-vs-channel bookings data for the last eight quarters.
    relatedQuestionRefs:
    - QI021
    - QI024
    - QI030
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-mix-and-recognition
    missingEvidence: Recognized revenue split among subscription, onboarding, services, marketplace resale, and any usage-based overages.
    whyItMatters: Revenue quality depends on how much of the top line is recurring software versus services or channel-mediated billings.
    diligencePath: Request the revenue-recognition policy memo, deferred-revenue rollforward, and SKU-level bookings mix.
    relatedQuestionRefs:
    - QI022
    - QI032
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: current-scale-proxies
    missingEvidence: A management-certified current revenue, headcount, and valuation packet to reconcile third-party databases.
    whyItMatters: GetLatka and Tracxn provide useful discovery leads but do not agree cleanly with official funding history or each other, so they cannot anchor underwriting.
    diligencePath: Request a signed KPI sheet covering ARR, revenue, headcount, valuation, and last secondary/common pricing; reconcile it against cap-table materials.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    - QI017
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: valuation-and-financing-trigger
    missingEvidence: Board-approved valuation references, current cap table, investor rights stack, and the operating thresholds that would trigger another financing.
    whyItMatters: Historical raises show access to capital, but not the current dilution risk, financing timing, or downside protection terms that matter to underwriting.
    diligencePath: Request the latest financing documents, cap table, investor update deck, and management downside-case financing plan.
    relatedQuestionRefs:
    - QI028
    - QI033
    relatedTableRefs:
