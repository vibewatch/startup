- id: public-financial-gaps-and-underwriting-verdict
  title: Public financial gaps and underwriting verdict
  body: 'This chapter''s central point is straightforward: audited financials are not public, and the remaining public proxies are too inconsistent to replace them. The low-confidence company-data pages are useful as discovery prompts, not as canon. Tracxn and LATKA publish conflicting 2026 scale proxies while Hunters'' official financing history is much better documented than either source''s operating data. That conflict is exactly why the public financial gaps table matters more than another synthetic model. The missing items are not decorative; they are the actual blockers to underwriting revenue quality, margin durability, and financing dependence. Without audited or management-certified revenue, gross margin, retention, CAC payback, cash, burn, runway, and contract-mix data, the honest verdict is constrained. The public record supports a recurring software model and a meaningful historical capital
    base, but it does not support a clean call on current scale or self-funded growth capacity. Strictly from public evidence, Hunters looks financially plausible, not financially proven.'
