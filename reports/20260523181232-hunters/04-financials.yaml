  title: Pricing / monetization table
  columns:
  - Surface
  - Public price / unit
  - List vs realized pricing
  - Confidence
  - Unknowns
  - Source / implication
  rows:
  - - Hunters official website
    - null
    - List pricing absent; demo-led
    - High
    - ACV, discounts, minimums, and contract length
    - Official pages support quote-led selling, not a public rate card
  - - Move Beyond SIEM page
    - Unlimited ingestion at a predictable cost
    - Marketing claim, not a numeric card
    - Medium
    - Whether pricing is flat, tiered, or usage-capped in contracts
    - Useful signal that Hunters sells against SIEM sticker shock
  - - AWS Marketplace / PeerSpot review
    - Data sources + data entities
    - Third-party description only
    - Low
    - Whether this matches current contracts across segments
    - Directional evidence that Hunters may avoid pure per-GB charging
  - - CrowdStrike Marketplace
    - null
