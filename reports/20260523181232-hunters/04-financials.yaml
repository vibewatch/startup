- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Evidence
  - Underwriting read
  - Diligence ask
  rows:
  - - Total disclosed equity raised
    - $118M disclosed through Series C
    - BusinessWire plus Tracxn
    - Confirms historical access to venture capital, not current liquidity
    - Request latest cap table and cash waterfall
  - - Latest public priced round
    - $68M Series C on 2022-01-25
    - Official blog, BusinessWire, TechCrunch
    - Latest clean public financing marker is over four years old relative to run date
    - Request any 2023-2026 primary or secondary transactions
  - - Strategic growth funding
    - Snowflake Ventures participation disclosed in 2020
    - Official Hunters release
    - Supports partner alignment but not current cash
    - Request current strategic-investor rights and commercial commitments
  - - Current cash on hand
    - null
    - No public disclosure located
    - Historical fundraising cannot be converted into runway without a cash balance
    - Request latest balance sheet and bank statements
  - - Monthly burn
    - null
    - No public disclosure located
    - Impossible to size financing dependency from open sources
    - Request monthly actual-vs-budget cash burn
  - - Runway months
    - null
    - No public disclosure located
    - Cannot tell whether Hunters is comfortably funded or near a financing trigger
    - Request base / downside runway model from finance team
  - - Stated use of last major round
    - Product, engineering, data science, and sales / marketing expansion
    - Official Series C materials
    - Capital has been aimed at growth rather than balance-sheet conservatism
    - Request whether the use-of-funds plan changed after 2022
  - - Debt / project finance obligations
    - null
    - No debt or project-finance obligation surfaced in reviewed public sources
    - Positive signal only in the narrow sense that no hidden debt is visible; still unverified
    - Request debt schedule, credit facilities, leases, and minimum-commitment contracts
  notes: This table focuses on forward capital adequacy rather than replaying the full financing chronology. Null means undisclosed in reviewed public materials, not zero.
