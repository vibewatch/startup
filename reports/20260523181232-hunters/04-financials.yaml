- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public signal
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue / financial statements
    - Needed to anchor quality of earnings, expense base, and working-capital needs
    - No audited financial statements are public
    - Blocking for any high-confidence underwriting
    - Request audited or management-reviewed FY2024 and FY2025 statements
  - - Current ARR
    - Needed for valuation, payback, and rule-of-40 style screens
    - Only low-confidence third-party proxies; no official figure
    - Material uncertainty on scale
    - Request current ARR bridge by segment and channel
  - - Recognized revenue mix
    - Separates recurring software from services or other non-core revenue
    - No public SKU or recognition detail
    - Revenue quality cannot be scored cleanly
    - Request revenue-recognition memo and deferred-revenue rollforward
  - - Gross margin
    - Determines whether ingestion-heavy architecture is still software-like economically
    - Only public-comp benchmarks, no Hunters disclosure
    - Material uncertainty on margin path
    - Request gross margin by deployment mode and cloud/storage COGS
  - - Sales efficiency / CAC payback
    - Determines whether growth is financeable without repeated dilution
    - No public CAC or payback
    - Material uncertainty on capital efficiency
    - Request CAC, payback, funnel conversion, and win-rate data
  - - Net revenue retention
    - Shows expansion durability and churn offset
    - No public NRR or gross retention
    - Material uncertainty on compounding quality
    - Request cohort retention tables for the last eight quarters
  - - Customer count and ACV mix
    - Needed to interpret ARR concentration and land-and-expand economics
    - Named logos only; no current customer count
    - Material uncertainty on concentration and average contract size
    - Request current customer count, top-20 accounts, and ACV distribution
  - - Channel mix
    - Marketplace or partner sales can change margin and cash collection profile
    - Marketplaces are public but mix is not
    - Material uncertainty on net revenue and sales leverage
    - Request direct vs marketplace vs partner bookings mix
  - - Cash balance and runway
    - Most direct test of financing dependency
    - No public cash, burn, or runway
    - Blocking on capital adequacy
    - Request month-end cash, trailing burn, and scenario runway model
  - - Debt / financing obligations
    - Hidden obligations can subordinate new investors or constrain operations
    - No obligation surfaced publicly
    - Moderate uncertainty remains because absence of evidence is not evidence of absence
    - Request debt, lease, and minimum-spend schedule
  - - Board-approved valuation references
    - Needed to interpret dilution risk and financing urgency
    - Only low-confidence third-party proxy
    - Material uncertainty on round timing and downside protection
    - Request latest 409A, board deck, and cap-table history
  notes: This chapter treats the public financial gaps table as the core underwriting artifact. The table is intentionally heavier on missing evidence than on claimed numbers because Hunters is private and audited financials are not public.
