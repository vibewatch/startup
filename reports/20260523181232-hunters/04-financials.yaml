chapter:
  number: 4
  title: Financials
  summary: Public evidence supports Hunters as a recurring, quote-led SOC platform sold through direct and marketplace channels, but it does not disclose audited revenue, cash, burn, gross margin, or runway. Comparable public security SaaS disclosures suggest the model could be attractive at scale, yet Hunters' current financial position remains unverified because audited financials are not public.
sections:
- id: revenue-model-and-visible-monetization
  title: Revenue model and visible monetization
  body: 'Hunters should be treated publicly as a recurring software platform vendor, not as a hardware or transaction business. The strongest evidence is the company''s own positioning: current pages describe an AI-driven next-gen SIEM and broader SOC platform, with no hardware bill of materials, no payment-volume economics, and no services-heavy revenue disclosure. The commercial posture is also visible even though the price card is not. Hunters drives buyers to demos and tours rather than a posted list price, while the Move Beyond SIEM page frames the product around unlimited ingestion and predictable cost. Marketplace evidence adds another layer. AWS and CrowdStrike listings show that Hunters can be sold or activated through channel infrastructure, which matters because channel procurement can accelerate budget access while obscuring realized net pricing. Snowflake partner material further suggests that some deployments may run against customer-controlled data-lake infrastructure, making
    monetization partly architectural. The implication is a quote-led, recurring SaaS model with real channel leverage but weak public visibility into contract detail, discounting, and exact pricing units.'
  claimRefs:
