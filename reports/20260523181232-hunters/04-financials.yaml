tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Public mechanism
  - Current status
  - Revenue quality
  - Financial implication
  - Diligence ask
  rows:
  - - Core SOC platform subscription
    - Quote-led software subscription for next-gen SIEM / SOC platform
    - Supported by official product pages
    - Likely recurring and higher quality
    - Most of the business appears software-recurring rather than transactional
    - Request SKU-level ARR, contract duration, and renewal cohorts
  - - Usage-linked ingestion / entity pricing
    - Official pages promise predictable or unlimited ingestion; one AWS review says pricing keys off data sources and entities
    - Partially supported; exact unit not verified
    - Potentially scalable but sensitive to cloud COGS
    - Pricing unit determines gross-margin exposure to data growth
    - Request price book, overage rules, and customer usage distributions
  - - Marketplace-routed subscriptions
    - Procurement through AWS Marketplace and CrowdStrike Marketplace / Store
    - Supported by official and partner pages
    - Still recurring software, but net revenue may be reduced by channel economics
    - Channel routes can accelerate procurement while obscuring realized net pricing
    - Request direct vs marketplace bookings mix and fee structures
  - - Snowflake-connected deployment economics
    - Partner materials imply customers can run Hunters against Snowflake-based security data lakes
    - Supported by partner materials, but monetization terms are not public
    - Could reduce storage duplication while shifting cost visibility to customer cloud bills
    - Architecture choice matters for COGS, retention, and margin interpretation
    - Request BYO-lake vs managed deployment mix and gross-margin by deployment type
  - - Onboarding / support / services
    - null
    - Not publicly itemized
    - Unknown
    - Services attachment could lower revenue quality if material
    - Request recognized revenue split between software and services
  notes: Official sources support a recurring-software model but not an audited revenue mix. Null means the stream exists as a diligence question rather than a verified disclosed line item.
