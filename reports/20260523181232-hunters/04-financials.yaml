- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current ARR / run-rate revenue
    - null
    - Low
    - No official current ARR is public, so valuation and efficiency screens cannot be anchored on canon numbers
    - Request management-certified ARR and recognized revenue by month
  - - Historical growth signal
    - TechCrunch reported revenue grew 5x in 2021
    - Medium
    - Useful for understanding early acceleration but not current scale
    - Request 2022-2026 ARR and revenue bridge
  - - Current headcount proxy
    - 181-246 employees across Tracxn and LATKA
    - Low
    - Headcount is a burn proxy and helps frame operating leverage
    - Request latest payroll headcount and fully loaded compensation run rate
  - - Gross margin benchmark band
    - 73%-78% public comp band; Hunters-specific metric undisclosed
    - Medium
    - Cloud security SaaS can be high margin, but ingestion-heavy architectures can compress margin
    - Request gross margin by deployment model and cloud/storage cost detail
  - - Sales and marketing intensity benchmark
    - 38%-52% of revenue across public comps; Hunters-specific metric undisclosed
    - Medium
    - Even attractive gross margins can be offset by heavy enterprise go-to-market spend
    - Request CAC, payback, pipeline conversion, and S&M spend
  - - Net revenue retention
    - null
    - Low
    - Retention determines whether the platform expands efficiently after land
    - Request gross and net retention by cohort and channel
  - - CAC payback
    - null
    - Low
    - Payback shows whether quote-led enterprise selling is financeable without constant new equity
    - Request CAC by segment and payback by booking cohort
  - - Contract structure / retention term
    - null
    - Low
    - Usage caps, retention windows, and minimum terms determine both ARR quality and COGS risk
    - Request standard MSA / order form and top-20 customer pricing matrix
  notes: Null cells denote private operating metrics that are not publicly disclosed. Public-company benchmark rows are for range-setting only and must not be mistaken for Hunters-specific reported values.
