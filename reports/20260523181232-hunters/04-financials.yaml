- id: capital-adequacy-and-financing-dependence
  title: Capital adequacy and financing dependence
  body: 'The public capital story is clearer than the operating story, but it is still not enough to answer the core liquidity question. Hunters has a well-supported disclosed equity base: official and major-news sources converge on a $68 million Series C in January 2022 and about $118 million of disclosed total funding through that point, while the Snowflake Ventures announcement shows earlier strategic capital and commercial alignment. Series C materials also explain how the money was supposed to be used—more product, engineering, data science, and sales and marketing—which tells us the company was funding growth rather than just defensive balance-sheet repair. What the public packet does not show is the number an investor actually needs now: current cash. No reviewed source discloses cash on hand, burn, runway, debt, or financing trigger conditions. That means the capital adequacy verdict must stay cautious. Historical fund-raising proves access to capital; it does not prove that Hunters
    is well funded on 2026-05-23. For a private SaaS vendor, the absence of current liquidity data is the decisive missing input.'
