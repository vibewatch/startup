figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: standard
  summary: Maps how Hunters turns customer telemetry and platform deployment into recurring software revenue, while highlighting where public pricing detail disappears.
  data:
    nodes:
    - id: n1
      label: Security telemetry + data sources
      note: Customer environments send identity, endpoint, cloud, and application data into Hunters or a connected data lake
    - id: n2
      label: Contract scope
      note: Quote-led commercial terms; public materials emphasize predictable or unlimited ingestion rather than a posted rate card
    - id: n3
      label: Recurring platform subscription
      note: Core next-gen SIEM / SOC platform appears to be the main monetization layer
    - id: n4
      label: Marketplace / partner procurement
      note: AWS, CrowdStrike, and Snowflake relationships can influence billing path and attach motion
    - id: n5
      label: Gross profit pool (undisclosed)
      note: Cloud, storage, support, and channel costs sit between booked subscription revenue and operating margin
    edges:
    - to: n2
      label: defines pricing exposure
      from: n1
    - to: n3
      label: becomes booked subscription value
      from: n2
    - to: n4
      label: can route through channels
      from: n3
    - to: n5
      label: revenue minus COGS / fees
      from: n3
  approximationNotes: The bridge is qualitative because official sources describe the revenue mechanism but do not disclose realized pricing, channel fees, or gross margin.
