callouts:
- calloutType: insight
  title: The control-plane layer is the real market boundary
  body: 'The most important boundary choice is not whether a product still calls itself SIEM. It is whether the buyer is purchasing the SOC control plane: telemetry normalization, investigation workflow, automation, and case management. That is the zone where Hunters, Microsoft, CrowdStrike, Palo Alto Networks, Google, and Splunk now overlap.'
  claimRefs:
  - CM013
  - CM018
  - CM025
  - CM050
- calloutType: risk
  title: Published TAMs overstate certainty for Hunters
  body: The public estimates are useful for bracketing the category, but none of them isolate an AI-driven SOC platform market or a Hunters-specific SAM. Treat the sizing figures as diligence lenses, not valuation-grade precision.
  claimRefs:
  - CM022
  - CM026
  - CM029
  - CM046
  - CM048
- calloutType: assumption
  title: Channel relevance is real but under-disclosed
  body: Microsoft and Google both show that multi-tenant and partner-supported workflows matter in modern SecOps. Hunters may benefit from the same channel logic, but public sources do not disclose how much of its actual demand is direct versus MSSP-led.
  claimRefs:
  - CM015
  - CM035
  - CM047
  - CM049
