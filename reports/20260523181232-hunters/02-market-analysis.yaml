  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: converged-tam-overlap
    missingEvidence: A primary analyst taxonomy that removes double-counting across SIEM, SOAR, XDR, and AI-SOC platform spend.
    whyItMatters: The largest public market numbers are not additive because vendors now sell overlapping control-plane functions under multiple labels, so a naive TAM stack would overstate unique budget.
    diligencePath: Obtain a current Gartner, IDC, or Forrester market taxonomy that explicitly maps category overlap, then rebuild the convergence lens against one normalized framework.
    relatedQuestionRefs:
    - QM006
    - QM020
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: hunters-sam-segmentation
    missingEvidence: A management-grade split of Hunters pipeline and customer count by company size, deployment path, and direct versus MSSP-led motion.
    whyItMatters: Without company-level segmentation, the chapter can bound SAM directionally but cannot validate what share of the broad convergence market Hunters can actually pursue efficiently.
    diligencePath: Request pipeline segmentation, customer cohorting, and channel attribution from management or the data room, then reconcile it against the public first-SIEM and lean-team narrative.
    relatedQuestionRefs:
    - QM025
    - QM026
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: ai-soc-platform-category
    missingEvidence: An independent public analyst report that isolates AI-driven SOC platforms as a distinct category rather than burying them inside SIEM, XDR, or SOAR.
    whyItMatters: The thesis depends on convergence, but the public market data still arrives as adjacent categories. That makes valuation-sensitive sizing less certain than the product narrative suggests.
    diligencePath: Buy or license a primary analyst market note on next-gen SIEM or AI-SOC platformization, or ask management for the third-party market material it uses internally.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
