- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cybersecurity skills gap and analyst scarcity
    - Driver ↑
    - Current / structural
    - Supports automation, guided investigation, and faster time to value for lean teams
    - What measurable analyst-efficiency gains do Hunters customers report after deployment?
  - - Breach cost and AI governance pressure
    - Driver ↑
    - Current
    - Raises the cost of slow investigations and makes evidence-rich response more budgetable
    - How often do buyers quantify Hunters against breach-cost or governance KPIs in real deals?
  - - Regulatory logging and disclosure obligations
    - Driver ↑
    - Current and expanding
    - Sustains budget for better telemetry retention, monitoring, and incident documentation
    - Which verticals cite SEC, NIS2, or CISA-aligned controls in Hunters evaluations?
  - - Cloud-delivered budget shift toward next-gen SIEM
    - Driver ↑
    - 2026 onward
    - Favors subscription, cloud-native SOC platforms over appliance-heavy legacy designs
    - What share of Hunters pipeline is competitive displacement versus first-SIEM greenfield?
  - - Platform consolidation and incumbent bundling
    - Constraint ↓
    - Current and accelerating
    - Microsoft, CrowdStrike, Palo Alto, Google, and Splunk can bundle control-plane functions around existing telemetry estates
    - How often does Hunters lose to bundle economics rather than product capability?
  - - Interoperability helps adoption but can lower switching costs
    - Constraint / driver
    - Current
    - OCSF and open ingestion reduce migration friction, but they also weaken lock-in as a moat
    - Does Hunters retain an edge through workflow quality, channel leverage, or cost transparency?
  notes: The table mixes structural demand drivers with execution constraints because both matter to valuation. Items are qualitative, but every row is anchored in a fetched source rather than generic cybersecurity-market boilerplate.
