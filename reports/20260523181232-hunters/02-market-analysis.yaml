tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Next-gen SIEM / SOC control plane
    - Telemetry ingestion, normalization, search, detections, case management, investigation workbench
    - Compliance-only log archives and generic IT observability
    - CISO / SecOps leader; security budget
    - Core market layer where Hunters is explicitly positioned
  - - SOAR / response automation
    - Playbooks, orchestration, investigation automation, response actions across tools
    - Standalone ITSM workflow tools with no SOC role
    - SecOps manager; security operations budget
    - Included because incumbents now sell automation as part of the same platform
  - - XDR / cross-domain detection and response
    - Cross-domain correlation across endpoint, identity, cloud, and email signals
    - Endpoint-only EDR budgets with no SOC analytics layer
    - Security architecture and SecOps leadership; security budget
    - Adjacent but increasingly merged into next-gen SIEM buying motions
  - - Security data lake and schema layer
    - Security-data storage, normalization, federation, OCSF mapping, data routing and search
    - General-purpose data warehousing not used as SOC system of record
    - Security engineering / platform security with CISO approval
    - Important because data architecture increasingly determines platform stickiness
  - - Status-quo substitutes
    - Legacy SIEM admin, manual triage, spreadsheets, and MSSP-first monitoring retainers
    - Not direct software TAM; displacement context only
    - Security leader or IT owner
    - Explains why first-SIEM and modernization budgets can emerge even before a full rip-and-replace project
  notes: Included spend is defined by workflow ownership in the SOC control plane, not by historical analyst labels alone. Exclusions remove endpoint-only, service-only, and archive-only spend from Hunters' practical software SAM.
