- id: diligence-gaps-and-what-public-data-still-misses
  title: Diligence gaps and what public data still misses
  body: 'The main diligence problem is not that the market lacks activity; it is that public category definitions lag how vendors now sell the product. SIEM, SOAR, XDR, and AI-driven SOC are converging faster than analyst category trees. That leaves public market numbers directionally useful but analytically messy, especially when the same control-plane story gets counted under multiple category labels. The second gap is company-specific: public sources do not disclose Hunters'' mix between direct enterprise sales, channel-led deals, and MSSP-assisted deployments, nor do they isolate how much of its practical SAM sits in small-team first-SIEM use cases versus larger modernization programs. Those gaps do not invalidate the market thesis; they simply mean this chapter should be read as an evidence-constrained sizing lens, not a false-precision TAM model. The right diligence follow-up is a management-level segmentation view showing customer mix, deployment path, and the share of pipeline driven
    by MSSP or partner channels.'
