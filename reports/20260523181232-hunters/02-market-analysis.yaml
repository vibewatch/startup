company:
  name: Hunters
chapter:
  number: 2
  title: Market Analysis
  summary: Hunters sells into the converged SOC modernization market where AI-native SIEM, automation, XDR-style correlation, and telemetry-control-plane workflows are collapsing into one budget line. Public 2026 category estimates anchor SIEM at $8.39B-$12.06B, SOAR at $2.22B, and XDR at $3.69B, but overlap is material, so the more honest read is a bounded lens of roughly $14.3B-$18.0B rather than one clean published TAM. Buyers are security leaders and engineering teams trying to reduce tool sprawl and staffing strain, with MSSP and channel workflows mattering more than public company-specific data currently reveals.
sections:
- id: market-boundary-and-convergence
  title: Market boundary and why SIEM, SOAR, XDR, and AI SOC are converging
  body: 'Hunters should be analyzed inside the converged security-operations platform market rather than as a narrow legacy-SIEM replacement. Its own current product surfaces emphasize next-gen SIEM, AI-led investigation, OCSF-standardized data, a security data lake, and fast deployment for small teams. That description already overlaps with what large incumbents now market: CrowdStrike frames next-gen SIEM as an AI-native SOC platform, Palo Alto positions Cortex XSIAM as an AI-driven security-operations platform, Microsoft explicitly unifies SIEM and XDR in the Defender portal, Google describes Security Operations as the telemetry-retention and analysis layer for large-scale SecOps, and Splunk treats SOAR as part of a broader AI-powered security stack. The included spend, therefore, is not just log retention; it is the control-plane layer that ingests and normalizes telemetry, correlates detections, automates investigation and response, and manages cases or workflows. The main exclusions
    are endpoint-only budgets, pure MDR labor, compliance-only log archives, and generic observability tooling that never becomes a SOC system of record. Status-quo substitutes still matter because spreadsheets, manual triage, legacy-SIEM administration, and MSSP-heavy operating models are part of the displacement path that Hunters itself markets against.'
  claimRefs:
