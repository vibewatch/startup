- id: growth-drivers-and-adoption-constraints
  title: Growth drivers and adoption constraints
  body: 'The structural demand case is clear. Workforce pressure still pushes automation because both ISC2 and SANS frame the 2026 problem as a skills mismatch that weakens cybersecurity operations, not simply a vacancy count. IBM adds financial urgency with a $4.4 million global average breach cost and a warning that AI is moving faster than governance. Regulation also helps sustain spending: ENISA''s NIS2 guidance, the SEC''s cyber-disclosure regime, and CISA''s logging-and-monitoring guidance all reinforce the need for better evidence collection, incident handling, and operational visibility. At the same time, Dell''Oro''s 2026 outlook says security budgets are continuing to shift toward cloud-delivered and subscription models, which is favorable for next-gen SIEM and AI-SOC platforms. The biggest constraints are the flip side of the same trend. Platformization by Microsoft, CrowdStrike, Palo Alto Networks, Google, and Splunk increases bundling pressure and raises migration or lock-in
    risk for independents. Open schema work such as OCSF helps interoperability, but it also lowers switching friction, making durable differentiation harder to hold unless a vendor wins on workflow quality, time to value, or channel fit.'
  claimRefs:
  - CM012
