evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-table
    missingEvidence: >-
      A complete current management roster, clearer title continuity for technical leadership, and independent
      corroboration for executives beyond the founder core.
    whyItMatters: >-
      The leadership table is intentionally partial because the fetched public pack shows role evolution but not a full
      org chart, which limits succession and bench-depth assessment.
    diligencePath: >-
      Request an org chart and current executive roster from management, then reconcile titles against LinkedIn, board
      materials, and recent press releases.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, observer rights, ownership percentages, liquidation preference stack, and any secondary
      sales since the Series C.
    whyItMatters: >-
      Public filings do not expose the cap-table or control stack, so investor leverage and governance concentration
      cannot be assessed from the fetched open-source pack alone.
    diligencePath: >-
      Request the current cap table, investor rights agreements, and board roster directly from management or the data
      room; reconcile against any investor-side memos.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current official employee count or similarly reliable third-party payroll/compliance proxy for 2026.
    whyItMatters: >-
      Current operating scale affects burn, hiring efficiency, and go-to-market capacity, but the fetched third-party
      estimates conflict and the official pack only discloses older milestone numbers.
    diligencePath: >-
      Request an HR headcount report or payroll summary as of the latest month-end and compare it to public profiles
      such as Tracxn, LinkedIn, and recruiter disclosures.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: valuation-and-revenue
    missingEvidence: >-
      A current board-approved valuation anchor and audited or management-certified revenue/ARR metrics after January
      2022.
    whyItMatters: >-
      The company's public financing history is clear through Series C, but current valuation and revenue remain opaque;
      low-tier profiles conflict sharply with official funding history and cannot support underwriting by themselves.
    diligencePath: >-
      Request a current board deck, 409A or internal valuation workup, ARR bridge, and audited or reviewed financial
      statements.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: panther-series-d-rumor
    missingEvidence: >-
      A primary announcement, transaction filing, press release, or high-tier independent report supporting either a
      Panther transaction or a 2025 Series D for Hunters.
    whyItMatters: >-
      The user supplied those facts as possibilities, but the fetched public pack does not corroborate them; repeating
      them as settled facts would misstate the company's financing and ownership history.
    diligencePath: >-
      Obtain signed transaction documents, board approvals, investor communications, or a credible contemporaneous
      report before treating the rumor as fact.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: converged-tam-overlap
    missingEvidence: A primary analyst taxonomy that removes double-counting across SIEM, SOAR, XDR, and AI-SOC platform spend.
    whyItMatters: >-
      The largest public market numbers are not additive because vendors now sell overlapping control-plane functions
      under multiple labels, so a naive TAM stack would overstate unique budget.
    diligencePath: >-
      Obtain a current Gartner, IDC, or Forrester market taxonomy that explicitly maps category overlap, then rebuild
      the convergence lens against one normalized framework.
    relatedQuestionRefs:
      - QM006
      - QM020
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: hunters-sam-segmentation
    missingEvidence: >-
      A management-grade split of Hunters pipeline and customer count by company size, deployment path, and direct
      versus MSSP-led motion.
    whyItMatters: >-
      Without company-level segmentation, the chapter can bound SAM directionally but cannot validate what share of the
      broad convergence market Hunters can actually pursue efficiently.
    diligencePath: >-
      Request pipeline segmentation, customer cohorting, and channel attribution from management or the data room, then
      reconcile it against the public first-SIEM and lean-team narrative.
    relatedQuestionRefs:
      - QM025
      - QM026
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: ai-soc-platform-category
    missingEvidence: >-
      An independent public analyst report that isolates AI-driven SOC platforms as a distinct category rather than
      burying them inside SIEM, XDR, or SOAR.
    whyItMatters: >-
      The thesis depends on convergence, but the public market data still arrives as adjacent categories. That makes
      valuation-sensitive sizing less certain than the product narrative suggests.
    diligencePath: >-
      Buy or license a primary analyst market note on next-gen SIEM or AI-SOC platformization, or ask management for the
      third-party market material it uses internally.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: >-
      Public or customer-verifiable win-loss data showing Hunters displacement rates versus Microsoft Sentinel,
      Cisco-owned Splunk, Google SecOps, or CrowdStrike.
    whyItMatters: Without actual displacement evidence, bundle pressure is visible but moat durability remains partly narrative.
    diligencePath: Request CRM win-loss data, renewal saves, and named customer migration case studies broken out by incumbent stack.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: material
    topic: pricing-discounting
    missingEvidence: >-
      Recent contracted quotes or procurement benchmarks for quote-led vendors including Hunters, Splunk, QRadar,
      Exabeam, Securonix, Torq, Stellar, Swimlane, Devo, and Google SecOps.
    whyItMatters: >-
      Public packaging detail is not enough to establish whether Hunters is economically advantaged in real competitive
      deals.
    diligencePath: >-
      Collect recent customer quotes, partner deal sheets, or procurement benchmarks and normalize them by ingest,
      endpoint, or workflow scope.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: sales-motion-mix
    missingEvidence: >-
      Share of Hunters pipeline and closed business that is greenfield first-SIEM adoption versus incumbent
      rip-and-replace, plus partner or MSSP influence on those deals.
    whyItMatters: >-
