companyProfile:
  summary: "Hunters is a Tel Aviv-founded cybersecurity company selling an AI-driven next-gen SIEM and SOC platform. Public evidence supports a product built around vendor-agnostic ingestion, OCSF-standardized data handling, automatic investigation, and a Snowflake-oriented data-lake architecture, with Pathfinder AI extending the workflow into copilot and agentic investigation modes. The company disclosed Seed, Series A, Series B, and a $68 million Series C in January 2022, taking total public funding to about $118 million, but later financing, valuation, and current financial scale remain opaque. Public customer proof includes Cimpress, Unzer, Clumio, Pennymac, and other enterprise logos, indicating real market traction despite sparse financial disclosure."
