  foundingLocation: "Tel Aviv, Israel"
  headquarters: "82 Yigal Alon Street, Tel Aviv, Israel"
  productSummary: "Next-gen SIEM and SOC platform that ingests and normalizes security data, correlates leads into attack stories, supports Hunters-hosted or bring-your-own Snowflake data-lake deployments, standardizes on OCSF, and adds Pathfinder AI for guided and agentic investigation workflows."
  customerFocus: "Enterprise and lean security teams modernizing SOC workflows, especially organizations seeking a first SIEM or a vendor-agnostic replacement for legacy SIEM operations."
  businessModel: "Recurring enterprise SaaS subscriptions sold through direct sales plus partner and marketplace channels, with pricing and realized contract structure not publicly disclosed."
