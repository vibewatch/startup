- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Open, vendor-agnostic data lake and OCSF posture
    - OCSF is open and storage-agnostic, so rivals can copy the interoperability story and reduce format lock-in
    - High
    - Request migration case studies, data-gravity metrics, and proof that open ingestion still converts into better retention or expansion
  - - First-SIEM and lean-team onboarding
    - Azure, Google, Cisco, and Falcon standardization can still dominate greenfield selections even when Hunters is easier to deploy
    - High
    - Request win-loss by greenfield versus displacement and split by incumbent stack already present in the account
  - - AI-assisted investigation and no-detection-engineering story
    - Splunk, Sentinel, Google SecOps, CrowdStrike, Exabeam, and Swimlane all now market AI or agentic assistance
    - High
    - Benchmark analyst-hour savings, false-positive reduction, and deployment speed against incumbent pilots
  - - Platform-neutral coexistence
    - Tines, Torq, and Swimlane can multi-home beside Hunters and capture workflow ownership without replacing the telemetry layer
    - Medium
    - Measure which response and case workflows stay inside Hunters after deployment versus leaking to adjunct automation tools
  - - MSSP and channel flank
    - LimaCharlie, Stellar, Securonix, Swimlane, and Google all show MSSP or multi-tenant signals that can attack through partners
    - Medium
    - Request partner-sourced pipeline mix, attach rates, and whether Hunters wins or loses when an MSSP influences architecture
  - - Pricing discipline and predictability narrative
    - Public sources do not prove Hunters is clearly cheaper than direct peers because most of the field is quote-led
    - Medium
    - Collect current customer quotes, negotiated discount bands, and gross-margin guardrails before underwriting a price moat
  - - Bundle resistance
    - Microsoft, Cisco or Splunk, Google, and CrowdStrike can land SIEM, AI, and automation inside broader platform relationships
    - High
    - Request renewal-cycle win data and evidence that Hunters survives when platform bundles are priced aggressively
  notes: Severity reflects evidence-backed competitive pressure, not a claim that the threat has already translated into quantified churn.
