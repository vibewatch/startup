- id: TP001
  title: Competitor profile table
  columns:
  - Vendor
  - Competitive class
  - Scale / backing
  - Target segment
  - Core differentiation
  - Limitation vs. Hunters
  rows:
  - - Hunters
    - Independent next-gen SOC / first-SIEM vendor
    - Private standalone; current public pricing opaque on fetched official pages
    - Lean teams, first-SIEM adopters, SOC modernization buyers
    - Vendor-agnostic ingestion, BYO or managed data lake, OCSF posture, AI-assisted investigation
    - Less bundle leverage than hyperscalers or installed-base incumbents
  - - Splunk (Cisco)
    - Bundled-platform incumbent
    - Cisco-owned platform since March 2024
    - Large enterprise SOC and existing Splunk/Cisco estates
    - Integrated TDIR with separate SOAR product and broad enterprise familiarity
    - Procurement and packaging remain enterprise-heavy and public pricing is opaque
  - - Microsoft Sentinel
    - Bundled-platform incumbent
    - Microsoft/Azure platform leverage
    - Azure-heavy and multicloud security teams willing to buy into Microsoft stack
    - Cloud-native SIEM + SOAR + unified data lake with official pricing structure
    - Vendor-neutral posture is weaker than Hunters' open-data story
  - - IBM QRadar
    - Bundled-platform incumbent
    - IBM portfolio incumbent
    - Enterprise and compliance-heavy SOC teams
    - Centralized visibility, real-time detection, compliance orientation
    - Public pages are less explicit on openness, AI differentiation, or transparent pricing
  - - CrowdStrike Falcon LogScale + Charlotte AI
    - Bundled-platform incumbent
    - Falcon platform installed base and agentic AI layer
    - CrowdStrike-centric SOCs and teams expanding inside Falcon
    - High-volume ingest plus AI analyst narrative inside existing Falcon relationship
    - Open-stack positioning is less central than in Hunters' pitch
  - - Exabeam (merged LogRhythm)
    - Independent next-gen SIEM peer
    - Merged pure-play SecOps vendor after 2024 LogRhythm transaction
    - SOC teams wanting search, analytics, and AI automation without hyperscaler bundle
    - New-Scale SIEM performance plus post-merger scale story
    - Public pricing remains opaque and integration of merger thesis still needs proof
  - - Securonix
    - Independent next-gen SIEM peer
    - Private cloud-native SIEM vendor
    - SOC modernization, compliance-led buyers, MSSP-friendly environments
    - Unified Defense SIEM with board-ready reporting and compliance mapping
    - Fetched public pack gives limited pricing detail and weaker open-data signaling than Hunters
  - - Tines
    - Automation-first adjacent
    - Private workflow platform; paid pricing largely sales-led
    - Security and IT teams automating workflows around existing tools
    - Strong orchestration and workflow depth with easy free entry point
    - Not positioned as a full telemetry system of record or native SIEM replacement
  - - Torq
    - Automation-first adjacent
    - Private AI SOC hyperautomation vendor
    - SecOps teams fighting alert overload and response bottlenecks
    - AI SOC platform focused on correlation, enrichment, and automated action
    - Public materials emphasize automation more than open data-lake ownership
  - - Stellar Cyber
    - Independent unified SecOps peer
    - Private Open XDR / SecOps vendor
    - Lean SOCs, MSSPs, and teams avoiding rip-and-replace
    - Open XDR plus NG-SIEM, NDR, UEBA, and AI in one platform
    - Public pricing is opaque and enterprise traction is less visible than bundle incumbents
  - - Swimlane
    - Automation-first adjacent
    - Private enterprise automation vendor
    - Large SOCs and MSSPs that prioritize case management and playbooks
    - AI agents, low-code playbooks, broad integrations, case execution
    - Best read as an automation layer rather than a direct first-SIEM competitor
  - - Devo
    - Independent data-centric SecOps peer
    - Private ingest-centric platform vendor
    - Teams with heavy data-routing, retention, and analytics requirements
    - Predictable ingest-based packaging, hot data, SIEM + SOAR + UEBA packaging
    - Rates are still not publicly itemized, limiting apples-to-apples price comparison
  - - Google Security Operations
    - Bundled-platform incumbent
    - Google Cloud plus Mandiant threat-intelligence leverage
    - Large-scale SOC modernization and SIEM migration buyers
    - Unified SIEM + SOAR + threat intelligence with package-based ingestion model
    - Still sales-led on pricing and less obviously optimized for first-SIEM simplicity
  - - LimaCharlie
    - Independent modular SecOps peer
    - Public-cloud SecOps builder with explicit MSSP motion
    - MSSPs, builders, enterprise SOCs, and teams wanting modular infrastructure
    - Transparent usage pricing, no contracts, public-cloud modularity, agentic operators
    - More building-block oriented than Hunters' managed first-SIEM narrative
  - - Status quo / internal build
    - Substitute, not product peer
    - Existing staff time, MSSP retainers, and engineering budget
    - Organizations still on spreadsheets, MSSP-heavy monitoring, or DIY pipelines
    - Avoids large platform purchase and can be assembled gradually with automation tools
    - Usually slower, less standardized, and harder to scale than a purpose-built SOC platform
  notes: Scale and backing reflect what is explicit on fetched official or primary sources; many private vendors do not disclose current funding or price points on those pages.
