- id: moat-durability-and-biggest-risks
  title: Moat durability and the biggest displacement risks
  body: Hunters' moat is real, but it is not a classic lock-in moat. The strongest evidence-backed advantages are an open and vendor-agnostic ingestion story, explicit first-SIEM and lean-team fit, and AI-assisted investigations that promise value without large in-house detection-engineering teams. Those strengths are meaningful because many incumbent platforms still require the buyer to navigate broader portfolio tradeoffs or enterprise-heavy procurement. The problem is that the same openness that helps Hunters sell against legacy lock-in also reduces exclusivity. OCSF is vendor-agnostic and storage-agnostic, so portability works both ways. Automation specialists such as Tines, Torq, and Swimlane can coexist beside Hunters and capture response workflow ownership. MSSP-friendly vendors such as LimaCharlie, Stellar Cyber, Securonix, Swimlane, and Google can approach the account through service-provider channels instead of direct head-to-head displacement. Above all, bundle pressure from Microsoft,
    Cisco-owned Splunk, Google, and CrowdStrike is the largest moat breaker because those vendors can package AI, SIEM, and automation inside broader platform relationships. Public evidence does not yet show whether Hunters wins enough greenfield or rip-and-replace deals to fully offset that pressure.
