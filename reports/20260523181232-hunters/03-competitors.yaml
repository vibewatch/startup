company:
  name: Hunters
chapter:
  number: 3
  title: Competitors
  summary: 'Hunters competes across three different lanes at once: bundled-platform incumbents such as Microsoft, Google, Cisco-owned Splunk, IBM, and CrowdStrike; direct next-gen SIEM peers such as Exabeam, Securonix, Devo, Stellar Cyber, and LimaCharlie; and automation-first adjacencies such as Tines, Torq, and Swimlane. The strongest evidence-backed Hunters wedge is vendor-agnostic ingestion plus an open OCSF-aligned data-lake posture, first-SIEM fit for lean teams, and AI-assisted investigation; the biggest moat risks are platform bundle pressure, open-standard commoditization, multi-homing with automation overlays, and public pricing opacity across much of the field.'
sections:
- id: competitive-classes-and-buying-motions
  title: Competitive classes and why Hunters is not competing on the same axis with everyone
  body: 'Hunters sits inside a converged SecOps field, but the competitive set breaks into distinct classes rather than one flat list. Microsoft Sentinel, Google Security Operations, Cisco-owned Splunk, IBM QRadar, and CrowdStrike pair SOC workflows with broader control planes, distribution leverage, or committed cloud and platform spend. Exabeam, Securonix, Devo, Stellar Cyber, and LimaCharlie are closer to Hunters as independent or semi-open next-gen SOC and SIEM alternatives. Tines, Torq, and Swimlane are different again: they lead with automation, case execution, or hyperautomation rather than a native telemetry system of record. Hunters'' own materials make its wedge explicit. It sells AI-driven investigation for small teams, a first-SIEM motion for buyers graduating from spreadsheets or MSSP-only monitoring, and a vendor-agnostic data-lake posture standardized on OCSF. That makes the most honest read a two-front battle: Hunters must win greenfield and modernization projects against
    large bundles, while also proving it offers more operational substance than automation-only adjacencies or do-it-yourself builds.'
