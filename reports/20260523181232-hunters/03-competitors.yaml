callouts:
- calloutType: strength
  title: Hunters owns the open-first, first-SIEM wedge
  body: The cleanest positive case is not that Hunters beats every incumbent feature-for-feature. It is that Hunters pairs vendor-agnostic ingestion, OCSF alignment, and fast AI-assisted investigations with a buyer story built for teams adopting a first real SIEM or modernizing away from spreadsheet and MSSP-heavy operations.
  claimRefs:
  - CP002
  - CP003
  - CP027
  - CP041
- calloutType: risk
  title: Bundle pressure is the biggest moat breaker
  body: Microsoft, Cisco-owned Splunk, Google, and CrowdStrike all sell AI, investigation, and automation inside larger platform relationships. That makes distribution and procurement leverage a larger threat to Hunters than any one feature gap.
  claimRefs:
  - CP030
  - CP035
  - CP036
  - CP042
- calloutType: insight
  title: Automation-first vendors are often coopetition, not pure replacement
  body: Tines, Torq, and Swimlane often attack the response workflow rather than the telemetry layer. That means Hunters can integrate with them, but it also means those vendors can capture a meaningful share of workflow value without replacing the full platform.
  claimRefs:
  - CP034
  - CP043
  - CP047
