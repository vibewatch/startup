  evidenceGaps:
  - type: missing-source
    severity: material
    topic: certification-refresh
    missingEvidence: Current ISO surveillance or recertification evidence plus the latest SOC 2 report period and bridge letter.
    whyItMatters: Regulated buyers can block or narrow deployment if current assurance artifacts are stale or unclear.
    diligencePath: Request the current ISO certificate, the latest SOC 2 report date range, and any bridge letter covering the run-date gap.
    relatedQuestionRefs:
    - QR002
    - QR031
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: company-specific-legal-exposure
    missingEvidence: A direct outside-counsel memo or comprehensive docket schedule covering Hunters and affiliates across key jurisdictions.
    whyItMatters: The public pack did not surface a company-specific lawsuit or enforcement file, so legal downside is still being framed structurally rather than by realized case exposure.
    diligencePath: Request legal diligence materials, litigation schedules, and regulator correspondence logs covering privacy, security, IP, and employment matters.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: data-residency-subprocessors
    missingEvidence: A full subprocessor list, regional data-residency matrix, SCC or equivalent transfer annexes, and customer-specific AI governance addenda.
    whyItMatters: Enterprise privacy reviews often stall on exactly these details, especially for an Israel-HQ vendor using cloud and model partners across jurisdictions.
    diligencePath: Request the current subprocessors register, regional architecture diagram, transfer mechanism pack, and any AI addendum used in regulated deals.
    relatedQuestionRefs:
    - QR015
    - QR028
    relatedTableRefs:
    - TR001
    - TR003
  - type: private-evidence-only
    severity: material
    topic: integration-resilience
    missingEvidence: Internal metrics on parser break-fix SLAs, failed-ingest volume, vendor-deprecation response time, and customer incident counts tied to integration drift.
    whyItMatters: Without reliability metrics, investors cannot tell whether partner API change is a manageable nuisance or a silent detection-quality risk.
    diligencePath: Request monthly integration reliability dashboards, postmortems for recent deprecations, and customer communication logs for affected connectors.
    relatedQuestionRefs:
    - QR020
    - QR023
    relatedTableRefs:
    - TR002
    - TR003
