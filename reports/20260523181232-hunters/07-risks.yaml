- id: mitigation-maturity-and-deal-kill-triggers
  title: Mitigation maturity, people load, and deal-kill triggers
  body: 'The encouraging part of the risk picture is that Hunters has enough public scaffolding to suggest these issues are manageable with evidence, not that the company is inherently non-compliant. The DPA is real, the terms are public, the trust page exists, Azure''s enterprise privacy posture is stronger than a consumer model API path, and the company is at least documenting vendor deprecations rather than pretending they do not exist. The problem is that the public pack stops one step short of what an investor or a regulated buyer would actually need to clear diligence. The missing items are current assurance artifacts, substantiated data-residency and subprocessor detail, and hard metrics on integration reliability and AI-governance exceptions. That creates people and execution risk: someone at Hunters has to keep legal, privacy, security, partner engineering, and detection quality synchronized as the surface area expands. The practical underwriting posture should therefore be strict.
    If the company cannot quickly provide refreshed trust artifacts, demonstrate that current vendor deprecations are fully mitigated, and show that Pathfinder remains human-supervised inside customer governance boundaries, the investment thesis should be treated as fragile even if the product demo is compelling.'
