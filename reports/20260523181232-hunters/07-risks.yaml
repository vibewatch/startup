- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Trust-assurance freshness
    - Current ISO or SOC 2 evidence
    - Company cannot produce current certification/report support within diligence window
    - Pause or walk unless the company provides fresh third-party assurance artifacts.
  - - Cross-border privacy controls
    - DPA and transfer package quality
    - Material customer redlines remain unresolved on subprocessors, residency, or transfer mechanisms
    - Treat as thesis break for regulated-enterprise expansion assumptions.
  - - AI-governance discipline
    - Pathfinder guardrails
    - No documented human-review controls or unresolved customer concerns about inaccurate output
    - Do not underwrite AI-led margin or win-rate upside.
  - - Partner / API resilience
    - Connector migration evidence
    - Recent CrowdStrike or Microsoft transitions remain incomplete or lack impact reporting
    - Discount reliability claims and require operational holdback in valuation.
  - - Execution capacity
    - Integration and legal response time
    - Backlog or redline cycle times show the company is not keeping pace with expanding surface area
    - Assume slower onboarding, weaker NRR, and lower expansion efficiency.
  notes: Kill criteria are intentionally monitorable and tied to evidence that can be requested in a data room rather than to vague product impressions.
