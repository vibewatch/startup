- calloutType: risk
  title: Current valuation and scale are still opaque
  body: The public record supports the historical funding path through January 2022, but it does not cleanly establish current
    valuation, current revenue, or exact headcount. Low-tier company-data pages conflict with one another and with official
    funding history, so they are useful only as diligence flags, not as canon.
  claimRefs:
  - CO034
  - CO040
  - CO041
  - CO042
  - CO043
- calloutType: insight
  title: Product narrative kept moving after the last public round
  body: Even without a newer financing announcement, fetched 2024-2026 materials show Hunters still evolving its public story—from
    SIEM replacement and marketplace distribution toward OCSF-native search and agentic AI investigation. That suggests continuing
    product investment even as public financial disclosure stayed sparse.
