- id: milestones-scale-and-open-gaps
  title: Milestones, scale signals, and unresolved diligence gaps
  body: The post-2022 picture is more mixed than the capital history. Hunters continued shipping product and ecosystem milestones—AWS
    Marketplace availability, full OCSF adoption, GigaOm recognition, and a 2026 agentic-AI message—so the company clearly
    remains active as a standalone vendor. Public scale signals also exist, but they do not resolve into a clean current operating
    snapshot. TechCrunch quoted 2021 revenue growth of 5x, BusinessWire and DTCP cited ARR growth above 4x in 2021, the 2022
    Series C blog said the team had crossed 100 employees, Calcalist put 2022 headcount at 110, Tracxn listed 181 employees
    as of March 2026, and GetLatka claimed 246 employees plus a bootstrapped capital structure that conflicts with the well-documented
    venture funding history. This is why the chapter treats current valuation, current revenue, exact headcount, and the user-supplied
    Panther/2025 Series D rumor as open diligence items rather than facts. The fetched Panther homepage still presents Panther
    as a separate AI SOC platform, but no primary transaction evidence was located in the reviewed public pack.
