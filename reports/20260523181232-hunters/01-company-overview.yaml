- id: capital-customers-and-ecosystem
  title: Capital base, customers, and ecosystem proof
  body: Hunters' public capital history is unusually clear through early 2022. The company disclosed a $5.4 million seed in
    2019, a $15 million Series A in mid-2020, Snowflake Ventures growth funding later that year, a $30 million Series B in
    August 2021, and a $68 million Series C in January 2022. Taken together, the fetched official and independent sources
    support roughly $118 million of disclosed funding by the Series C. Just as important, the investor mix doubles as a commercial
    signal. Snowflake was described as both an early customer and go-to-market partner; DTCP tied its investment to European
    expansion; and BusinessWire and the Series C blog positioned Cisco, Databricks, Snowflake, and Okta as strategic investors
    that could amplify sales and partnerships. Customer proof is visible, though still selective. Official case studies and
    testimonials name Unzer, Cimpress, Clumio, Pennymac, Booking.com, Snowflake, and Netgear rather than giving a full customer
    count, which is enough to demonstrate enterprise relevance but not enough to fully quantify traction today.
