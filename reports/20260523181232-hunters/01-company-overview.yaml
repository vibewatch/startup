company:
  name: Hunters
chapter:
  number: 1
  title: Company Overview
  summary: Hunters is a Tel Aviv-founded security-operations platform company that now presents itself as an AI-driven next-gen
    SIEM and SOC platform. Public financing evidence supports Seed, Series A, Snowflake strategic growth funding, Series B,
    and a $68 million Series C in January 2022, bringing disclosed capital to about $118 million; fetched current-source discovery
    did not surface corroborated evidence of a later priced round. Customer proof, marketplace listings, and 2024-2026 product
    posts support continued standalone operations, but current valuation, revenue, headcount, and any rumored Panther transaction
    remain under-disclosed or conflicting in public data.
sections:
- id: identity-platform-model
  title: Identity, platform, and operating model
  body: 'As of the run date, hunters.ai redirects to the hunters.security site, where Hunters describes itself as an AI-driven
    next-gen SIEM and broader SOC platform rather than a point tool. The current and recent official materials are consistent
    on the operating model: Hunters ingests and normalizes security data across the attack surface, correlates signals, automates
    investigation, and tries to replace legacy SIEM administration with a turnkey platform. The go-to-market model is also
    visible in public materials. Series A materials already referenced direct sales plus partner channels such as the CrowdStrike
    Store and Snowflake Partner Connect, and later AWS and CrowdStrike marketplace listings show that channel-assisted procurement
    remained part of distribution. Recent product messaging also shows the company extending the platform narrative beyond
    classic XDR into OCSF-native search and agentic AI investigation workflows. That combination of cloud data-lake orientation,
    automation, and partner-assisted distribution is the clearest current picture of what Hunters sells and how it expects
    customers to buy it.'
