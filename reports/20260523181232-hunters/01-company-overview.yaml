  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-table
    missingEvidence: A complete current management roster, clearer title continuity for technical leadership, and independent corroboration for executives beyond the founder core.
    whyItMatters: The leadership table is intentionally partial because the fetched public pack shows role evolution but not a full org chart, which limits succession and bench-depth assessment.
    diligencePath: Request an org chart and current executive roster from management, then reconcile titles against LinkedIn, board materials, and recent press releases.
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, observer rights, ownership percentages, liquidation preference stack, and
      any secondary sales since the Series C.
    whyItMatters: Public filings do not expose the cap-table or control stack, so investor leverage and governance concentration
      cannot be assessed from the fetched open-source pack alone.
    diligencePath: Request the current cap table, investor rights agreements, and board roster directly from management or
      the data room; reconcile against any investor-side memos.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current official employee count or similarly reliable third-party payroll/compliance proxy for 2026.
    whyItMatters: Current operating scale affects burn, hiring efficiency, and go-to-market capacity, but the fetched third-party
      estimates conflict and the official pack only discloses older milestone numbers.
    diligencePath: Request an HR headcount report or payroll summary as of the latest month-end and compare it to public profiles
      such as Tracxn, LinkedIn, and recruiter disclosures.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: valuation-and-revenue
    missingEvidence: A current board-approved valuation anchor and audited or management-certified revenue/ARR metrics after
      January 2022.
    whyItMatters: The company's public financing history is clear through Series C, but current valuation and revenue remain
      opaque; low-tier profiles conflict sharply with official funding history and cannot support underwriting by themselves.
    diligencePath: Request a current board deck, 409A or internal valuation workup, ARR bridge, and audited or reviewed financial
      statements.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: panther-series-d-rumor
    missingEvidence: A primary announcement, transaction filing, press release, or high-tier independent report supporting
      either a Panther transaction or a 2025 Series D for Hunters.
    whyItMatters: The user supplied those facts as possibilities, but the fetched public pack does not corroborate them; repeating
      them as settled facts would misstate the company's financing and ownership history.
    diligencePath: Obtain signed transaction documents, board approvals, investor communications, or a credible contemporaneous
      report before treating the rumor as fact.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO004
