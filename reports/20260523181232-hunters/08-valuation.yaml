    - Private
    - 2026 ARR and reported 2025 valuation
    - ~10x ARR
    - Useful disclosed private software-platform comp below Wiz but above most public mids.
    - IT operations orientation and stronger disclosure make it imperfect.
  - - Wiz
    - Strategic / private
    - 2025 ARR floor and completed Google price
