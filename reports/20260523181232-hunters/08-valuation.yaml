- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category demand
    - SIEM and SOC automation demand is real and growing as environments get more complex.
    - Category growth does not guarantee that every vendor earns a premium valuation.
    - Show sustained win rates and expansion that prove Hunters is taking share, not just participating in market growth.
  - - Product and investor proof
    - Hunters has credible investors, named customers, and a product positioned against legacy SIEM pain points.
    - The public record shows traction, but not current ARR, margins, or retention.
    - Provide current ARR, NRR, and gross margin with management certification.
  - - Comparable context
    - Exceptional security platforms can still command premium private and strategic multiples.
    - Most public security comps trade far below premium outliers, especially when growth or disclosure quality is weaker.
    - Produce current metrics that justify treating Hunters closer to premium private comps than to mid-tier public names.
  - - Financing context
    - The last public round was sizable and management said the company planned for multiple years of runway.
    - No retained source proves what the current cash or financing position looks like on 2026-05-23.
    - Provide cash, burn, runway, and any interim financing or tender evidence.
  - - Price discipline
    - A disciplined investor could still like the company at the right price.
    - Without a verified current mark, overpaying is the default failure mode.
    - Disclose a verified clearing price or accept a discount that reflects opacity.
  notes: This table separates company quality from entry price. The anti-thesis is driven by disclosure risk and comparable compression, not by a claim that Hunters lacks a real product.
