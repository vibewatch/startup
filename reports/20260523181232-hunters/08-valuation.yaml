- id: v-thesis-breaks-and-diligence
  title: Thesis-break triggers and final diligence asks
  body: 'The critical discipline question is not whether Hunters can tell a compelling product story; it is what facts would break or upgrade the valuation case. The investment case breaks quickly if refreshed ARR comes in materially below the bear-case band, if software economics prove much weaker than cyber-SaaS norms, or if the cap-table waterfall means common-equity upside disappears at sub-$500 million exits. Those are not remote accounting details. They are direct transmission channels from operating truth to investable equity returns.


    The same logic defines the final diligence list. Investors need current ARR or revenue, gross margin, GRR or NRR, burn or runway, renewal quality, and the full cap table before negotiating price. If that pack shows Hunters belongs in the low or mid part of the base case, the name can move from watchlist to active underwriting. If it instead shows premium-quality metrics and an entry mark that does not assume them in advance, the recommendation can improve further. In other words, evidence quality is still the gating variable, not slideware. Until then, the biggest blocker is simple: current valuation is opaque and the public record is not strong enough to replace missing company disclosure.'
