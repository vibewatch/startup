  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-arr-disclosure
    missingEvidence: Current ARR or revenue by month, revenue mix by product, and management-certified growth bridge from 2022 through 2026.
    whyItMatters: Without current scale data, every valuation range in this chapter remains estimate-driven and cannot clear a buy recommendation.
    diligencePath: Request CFO or FP&A exports, board pack revenue bridge, and signed management representation on current ARR or revenue.
    relatedQuestionRefs:
    - QV021
    - QV022
    - QV023
    - QV024
    - QV025
    - QV026
    - QV027
    - QV029
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-margin-disclosure
    missingEvidence: Gross margin, GRR, NRR, and sales-efficiency metrics with at least the latest four quarters of history.
    whyItMatters: Premium cyber multiples require evidence that revenue quality and software economics are durable rather than merely aspirational.
    diligencePath: Request cohort retention, gross-margin by deployment model, and customer expansion analysis from finance and revops.
    relatedQuestionRefs:
    - QV027
    - QV029
    - QV030
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-waterfall
    missingEvidence: Fully diluted cap table, liquidation preferences, any ratchets, and recent secondary or tender terms.
    whyItMatters: A seemingly fair enterprise value can still produce weak common-equity outcomes if late-stage preferences absorb most exit value.
    diligencePath: Review financing docs, latest 409A materials, and any banker or board materials covering secondary transactions.
    relatedQuestionRefs:
    - QV028
    - QV029
    - QV030
  - type: missing-source
    severity: material
    topic: current-price-discovery
    missingEvidence: A verified 2025 or 2026 secondary print, financing term sheet, or banker valuation memo for Hunters.
    whyItMatters: The recommendation is price-sensitive; without any observed clearing price, investors cannot know whether they are underwriting fair value or a stale seller narrative.
    diligencePath: Obtain brokered-secondary indications, recent tender documentation, or a fresh board-approved financing pack.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table coverage
    missingEvidence: More direct private SIEM or SOC automation peers with both current ARR and current valuation disclosed in 2026.
    whyItMatters: The public and strategic comp set is useful, but the most comparable private peers remain partially opaque, which widens Hunters' scenario bands.
    diligencePath: Expand private comp work with banker books, secondary data, or additional disclosed financing memos from near-adjacent SIEM or SOC platforms.
    relatedQuestionRefs:
    - QV017
    - QV018
    - QV019
    relatedTableRefs:
    - TV004
