  rows:
  - - CrowdStrike
    - Public
    - May 2026 market cap / TTM revenue
    - ~35.1x
    - Premium upper bound for scaled cyber-platform valuation.
    - Much larger and more disclosed than Hunters.
  - - Palo Alto Networks
    - Public
    - May 2026 market cap / TTM revenue
    - ~21.4x
    - Shows what broad platform breadth can command in security.
    - Conglomerate-like scale and product breadth make it aspirational, not direct.
  - - SentinelOne
    - Public
    - May 2026 market cap / TTM revenue
    - ~6.4x
    - Useful current public floor for a still-scaling security platform.
    - Still larger and more disclosed than Hunters, with different product mix.
  - - Qualys
    - Public
    - May 2026 market cap / TTM revenue
    - ~5.3x
    - Useful profitable public-security benchmark near the low end of software-like multiples.
    - Mature and slower-growth profile is not a direct next-gen SIEM analog.
  - - Elastic
    - Public
    - May 2026 market cap / TTM revenue
    - ~3.4x
    - Shows that security-adjacent observability/search exposure can still clear only low-single-digit multiples.
    - Not a pure-play SOC platform.
  - - Tenable
    - Public
    - May 2026 market cap / TTM revenue
    - ~2.7x
    - Useful exposure-management comp for downside discipline.
    - Different category and customer motion.
  - - Rapid7
    - Public
    - May 2026 market cap / TTM revenue
    - ~0.6x
    - Hard downside comp showing how quickly public multiples compress when growth and confidence weaken.
    - Current public discount may overstate Hunters downside if economics are materially better.
