- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Refreshed ARR disappointment
    - Current ARR materially below $25M
    - Breaks even the bear/base range logic and suggests the company is much earlier than public narrative implies.
    - Walk away or reset valuation expectations sharply lower.
  - - Weak software economics
    - Gross margin below ~60% or NRR below ~105%
    - Removes the basis for paying software-like revenue multiples.
    - Shift to the low end of bear-case multiples or decline the deal.
  - - Preference overhang
    - Cap-table waterfall absorbs most value below a ~$500M exit
    - Converts an apparently fair enterprise value into weak common-equity returns.
    - Require structure clarity or do not proceed.
  - - No credible current mark
    - Seller cannot show a verified 2025-2026 financing, tender, or secondary reference point
    - Leaves entry price exposed to stale-round anchoring and narrative inflation.
    - Demand a discount or keep the name on the watchlist only.
  - - Competitive replacement risk
    - Evidence that buyers can substitute cheaper or bundled platforms without material loss of outcomes
    - Collapses the premium-multiple part of the thesis.
    - Reduce multiple assumptions and revisit the whole investment case.
  notes: Kill triggers are monitorable thresholds tied directly to valuation compression or equity-value impairment, not generic operating risks.
  claimRefs:
  - CV006
  - CV021
  - CV028
  - CV029
  - CV040
  - CV044
  - CV046
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Current scale
    - Current ARR or revenue, growth bridge, and product mix
    - Determines whether Hunters belongs in the bear, base, or bull range at all.
    - CFO or FP&A data room plus management certification.
  - - Revenue quality
    - GRR, NRR, gross margin, and sales-efficiency history
    - Decides whether software-like multiples are appropriate.
    - Finance and revops cohort packs plus audited or reviewed management accounts.
  - - Liquidity and dilution
    - Cash, burn, runway, and any interim financing since 2022
    - Clarifies whether new money is buying growth or just extending runway.
    - Controller cash bridge and financing history review.
  - - Cap-table structure
    - Fully diluted cap table, liquidation stack, and any secondary terms
    - Determines whether a fair enterprise value actually creates fair equity returns.
    - Legal review of financing documents and latest 409A materials.
  - - Commercial durability
    - Top-customer concentration, renewal outcomes, and recent competitive win-loss data
    - Tests whether Hunters deserves to sit above low-end public comps.
    - Sales, CS, and customer cohort diligence.
  notes: These asks are not cosmetic. They are the minimum package required to convert this chapter from disciplined public-market triangulation into a real underwriteable valuation decision.
