company:
  name: Hunters
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports Hunters as a real next-gen SOC or SIEM platform, but the last corroborated priced round remains the January 2022 $68 million Series C and current valuation is opaque. Using 2026 cybersecurity comp data plus explicit ARR assumptions, a cautious bear/base/bull framework lands at roughly $75 million to $175 million, $200 million to $420 million, and $560 million to $900 million, supporting a research-more / track recommendation rather than a buy call until current financials and price discovery are disclosed.
sections:
- id: v-recommendation-context
  title: Recommendation and current valuation context
  body: 'Hunters clears the first hurdle for a valuation chapter: there is enough public evidence to show this is a real company in a real market with credible backers and product traction. The problem is the second hurdle, which is price. The last corroborated priced round in the retained public set is still the January 2022 Series C. The strongest public reporting from that round says Hunters raised $68 million, reached roughly $118 million of disclosed total funding, and still had not reached unicorn status. Database-style sources that remain accessible in 2026 still point back to that same Series C as the latest surfaced round. That means the chapter cannot honestly treat any higher 2025 or 2026 mark as a verified fact.


    The recommendation is therefore research-more for new money and track for watchlist purposes, not buy. This is not a judgment that Hunters lacks a product or a market. It is a judgment that current ARR, gross margin, NRR, burn, runway, and price discovery are all missing from the public record. In private software, those are not side details; they are the variables that determine whether a few-hundred-million-dollar valuation is conservative or aggressive. The right posture is to separate company quality from entry discipline and refuse false precision.'
