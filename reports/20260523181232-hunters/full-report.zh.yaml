  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 剩余风险集中在跨境隐私尽调、AI 治理失误和合作伙伴技术栈集中，而不是已知公开诉讼。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 主要破坏投资假设信号
      rows:
        - label: 跨境隐私 / DPA 摩擦
          values:
            - 高
            - 高
            - 中
            - 数据传输、驻留或子处理方出现重大红线
        - label: 信任证明时效缺口
          values:
            - 中高
            - 高
            - 中
            - 无法快速拿出最新 ISO 或 SOC 2 证据
        - label: AI 输出不准确 / 治理例外
          values:
            - 中高
            - 高
            - 低至中
            - 客户或监管方不接受当前人工监督设计
        - label: 供应商 API 退役 / 解析器漂移
          values:
            - 高
            - 高
            - 中
            - 连接器迁移落后于合作伙伴弃用节奏
        - label: Snowflake / AWS 集中度
          values:
            - 中
            - 中高
            - 中
            - 部署摩擦或商业议价压力恶化
        - label: 法务与集成运营执行过载
          values:
            - 中
            - 高
            - 低至中
            - 覆盖面扩大后，积压和响应时间上升
