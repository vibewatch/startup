  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 决策路径从真实产品和融资证据出发，但当前价格发现缺失，因此只能停在继续研究。
    data:
      nodes:
        - label: 最近定价轮
          value: 2022 Series C; $68M raised; ~not a unicorn
        - label: 类别需求
          value: SIEM / SOC automation still grows as environments and AI complexity rise
        - label: 可比公司背景
          value: Public comps span ~0.6x to ~35x; premium private outcomes are exceptional
        - label: 当前不透明度
          value: No retained current ARR, margin, retention, runway, or verified seller mark
        - label: 情景区间
          value: $75M-$175M bear; $200M-$420M base; $560M-$900M bull
        - label: 决策
          value: Research-more / track until price and fundamentals are disclosed
