      - number: '7.2'
        title: 运营、质量与事件处理风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Hunters 最大的风险在于产品承诺依赖一串同时保持准确的活动部件：上游遥测、 Hunters 自身的解析和标准化、相关性逻辑，以及叠在其上的 Pathfinder AI 生成推理。公司自己的文档
              异常坦诚：Pathfinder 可能出错，且必须由人验证。这个披露是健康信号，但也确认产品还不是可以放手的 自主信任层。公开材料包同一部分还实时暴露了合作伙伴变更风险。2026 年，Hunters
              不得不指导客户迁出 即将退役的 CrowdStrike 事件日志和 Microsoft Message Trace 端点；如果响应慢， 这类供应商更替正会悄悄削弱覆盖。Snowflake 上线还通过 IP
              白名单、角色设置和网络策略给客户侧增加摩擦。 结论很清楚：对于能容忍一定复杂度的买方，Hunters 可以跑得不错；但下行情景是，集成漂移和 AI 错误
              累积得比公司闭环更快，进而侵蚀检测质量，或让分析师过度信任系统。
