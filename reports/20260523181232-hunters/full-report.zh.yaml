      - number: '8.3'
        title: 逻辑失效触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              关键的纪律问题不是 Hunters 能否讲出动人的产品故事，而是什么事实会击穿或上调估值判断。如果更新后的 ARR 明显低于 悲观情景区间，如果软件经济性显著弱于网络安全 SaaS
              常态，或者股权结构表瀑布意味着低于 $500 million 退出时普通股上行 消失，投资案例会很快破裂。这些不是遥远的会计细节，而是经营真相传导到可投资股权回报的直接通道。


              同一逻辑也定义了最终尽调清单。投资人在谈价前需要当前 ARR 或收入、毛利率、GRR 或 NRR、烧钱速度或现金跑道、续约质量， 以及完整股权结构表。如果这套材料显示 Hunters
              落在基准情景的低位或中位区间，公司可以从观察名单转入主动承销。 如果材料反而显示它拥有优质指标，且入场估值没有提前预设这些指标，建议还可以进一步上调。换句话说，证据质量仍是闸门变量，
              不是演示文稿。在此之前，最大阻碍很简单：当前估值不透明，公开记录不足以替代缺失的公司披露。
