companyProfile:
  summary: >-
    Hunters 是一家创立于 Tel Aviv 的网络安全公司，销售 AI 驱动的新一代 SIEM 和 SOC 平台。公开证据显示， 产品围绕厂商无关的数据接入、OCSF 标准化数据处理、自动调查以及以 Snowflake
    为重心的数据湖架构构建， Pathfinder AI 又把工作流延伸到 copilot 和智能体调查模式。公司披露过 Seed、Series A、Series B， 并在 January 2022 完成 $68 million
    Series C，使公开累计融资约为 $118 million；但后续融资、估值和当前财务规模仍不透明。 公开客户证据包括 Cimpress、Unzer、Clumio、Pennymac 等企业
    logo，说明即便财务披露稀疏，公司仍有真实市场牵引力。
