      - number: '6.3'
        title: 实名客户证据与生产深度
        blocks:
          - type: paragraph
            body: |
              Hunters 的实名客户证据明显好于许多私营安全软件同业，但证据质量不均。最强证据来自当前或近期案例研究，
              里面有可识别运营者、使用场景和结果。Unzer 称 Hunters 简化了数据源接入，浮出此前未看到的安全告警和事件报告，
              并帮助这家支付公司及时响应、降低业务影响。Clumio 称其通过 AWS Marketplace 采购 Hunters 和 Snowflake，
              并用 Hunters 的跨源关联把 endpoint、Google Workspace 和 Okta 信号串成更高保真调查。Snowflake 案例研究把
              Hunters 描述为帮助 10 人 SOC 降噪、统一 best-of-breed 工具集的方式；Spotnana、Solaris 和 Pennymac
              也描述了类似主题：快速 time-to-value、以数据湖为中心的部署，以及更低的手工 detection-engineering 负担 [CU013, CU014, CU015, CU016,
              CU017, CU018, CU019, CU021, CU022]。

              证据光谱较弱的一端，是只有 logo 的证明。BusinessWire、DTCP 和 PeerSpot 的客户文案点名 Booking.com 和 Netgear，
              因此这些 logo 可以作为公开 reference 支撑。但审阅的 2026 资料包没有找到这两个账户新的详细案例研究、
              实名运营者引述或当前工作流细节。因此应把它们视为 reference logos，而不是完全刷新的生产证据。
              这个区分重要，因为只有 logo 存在，不能证明当下部署深度、合同耐久性或扩张 [CU020, CU035, CU036]。
