  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 基于具名案例研究中的反复模式，概括 Hunters 买方从工具泛滥痛点到生产部署和扩张的典型旅程。
    approximationNotes: 旅程阶段来自具名案例研究的综合，而不是 Hunters 内部 CRM 遥测。各阶段之间的时间、流失率和转化率未公开披露。
    claimRefs:
      - CU001
      - CU002
      - CU023
      - CU025
      - CU037
    data:
      nodes:
        - label: 'N1: 安全团队痛点显性化'
          description: 旧式 SIEM、告警过载、手工调查或数据可携性不足变得尖锐
          touchpoints: CISO / VP Cybersecurity / Security Engineering Manager, analyst backlog, compliance pressure
          headwayRole: Hunters not yet adopted; buyer defines the SOC pain point
        - label: 'N2: 评估现代 SOC 平台'
          description: 团队将 Hunters 与旧式 SIEM 或其他现代平台对比，并测试它与现有工具的匹配度
          touchpoints: Case studies, partner channels, AWS Marketplace, CrowdStrike Marketplace, Snowflake alignment
          headwayRole: Show fast onboarding, prebuilt detectors, and lower operating burden
        - label: 'N3: 初始数据源接入'
          description: 客户接入核心遥测，并开始使用开箱即用的检测和富化能力
          touchpoints: Snowflake or existing data lake, EDR, identity, SaaS, cloud logs
          headwayRole: Built-in ETL, normalization, and first incident narratives
        - label: 'N4: 生产分诊与调查'
          description: 分析师依靠关联后的攻击故事工作，不再手工跨控制台切换
          touchpoints: Daily alert queue, investigations, purple-team or real incident response
          headwayRole: Correlation, prioritization, automated investigation context
        - label: 'N5: 扩展至更多遥测 / 分析'
          description: 首个工作流稳定后，客户增加更多数据源、自定义逻辑或连接 Snowflake 的分析
          touchpoints: More detectors, custom use cases, customer-owned data lake, managed services
          headwayRole: Land-and-expand wedge inside broader SOC workflow
        - label: 'N6: 续约 / 参考节点'
          description: 账户可能成为参考客户；若支持、集成或 ROI 证明不及预期，也可能停滞
          touchpoints: Reference calls, renewal decision, support experience, procurement channel
          headwayRole: Outcome depends on realized workflow value, not publicly disclosed cohort metrics
