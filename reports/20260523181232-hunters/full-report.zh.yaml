    summary: 公开证明耐久度代理：样本中具名客户证据在 12、24、36 个月后仍可公开访问的占比。这不是 logo 留存或收入留存数据。
    approximationNotes: Hunters 不披露真实客户留存队列。这里改用下限型公开证明代理：样本中具名客户证明在各期限仍可公开访问的占比。它衡量的是证据耐久度，不是合同留存，不应解读为流失统计。
