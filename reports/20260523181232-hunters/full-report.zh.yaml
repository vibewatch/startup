            body: >-
              公开证据足以勾勒模型的经济形态，但不足以干净承销。Hunters 营销快速部署、自动化和最低 detection-engineering
              负担；如果云和支持成本受控，这符合一个应有强毛利率的软件模型。同时，同一批公开材料强调把广泛遥测接入开放安全数据湖， 这意味着真实的存储、计算和留存成本。因为 Hunters
              是私营公司，公开材料从未告诉我们这两端如何平衡。 最干净的绕行方法，是参考公开安全 SaaS 可比公司。CrowdStrike 和 SentinelOne 都披露毛利率与销售营销结构，
              暗示类似安全软件模型在披露时可能呈现 low-70s 到 high-70s 的毛利率区间，以及占收入 high-30s 到 low-50s percent 的 go-to-market
              负荷。关键是，这不会让这些指标变成 Hunters 的事实；它只说明类似安全软件模型在披露时可能长什么样。 Hunters 专属 ARR、NRR、CAC
              payback、确认收入组合和毛利率仍全部私有，因此严肃尽调仍取决于管理层认证的运营数据。
