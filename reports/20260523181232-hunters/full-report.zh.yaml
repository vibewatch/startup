      - number: '2.5'
        title: 尽调缺口与公开数据仍漏掉的内容
        blocks:
          - type: paragraph
            body: >-
              主要尽调问题不是市场缺少活动，而是公开品类定义落后于供应商现在销售产品的方式。SIEM、SOAR、XDR 和 AI 驱动 SOC
              的收敛速度快于分析师品类树。因此，公开市场数字方向上有用，分析上却很脏，尤其是同一套控制平面故事被多个品类标签重复计入时。 第二个缺口是公司特定的：公开来源没有披露 Hunters 在直销企业销售、渠道主导交易和
              MSSP 辅助部署之间的组合， 也没有拆出其实际 SAM 中多少来自小团队 first-SIEM 场景、多少来自更大的现代化项目。这些缺口不推翻市场 thesis；
              它们只是说明，本章应被视为受证据约束的规模视角，而不是虚假精确的 TAM 模型。正确的后续尽调，是拿到管理层级别的分群视图， 展示客户组合、部署路径，以及由 MSSP 或合作伙伴渠道驱动的 pipeline
              占比。
