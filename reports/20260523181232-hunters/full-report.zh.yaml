  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争类别：Hunters 并不是在同一轴线上与所有对手竞争
        blocks:
          - type: paragraph
            body: >-
              Hunters 位于收敛中的 SecOps 赛道，但竞争集合分成不同类别，而不是一张扁平名单。Microsoft Sentinel、 Google Security Operations、Cisco 旗下
              Splunk、IBM QRadar 和 CrowdStrike 将 SOC 工作流与更大的控制平面、 分销杠杆或已承诺的云与平台支出绑定。Exabeam、Securonix、Devo、Stellar Cyber
              和 LimaCharlie 更接近 Hunters，是独立或半开放的新一代 SOC 与 SIEM 替代方案。Tines、Torq 和 Swimlane 又不同：它们以自动化、 案件执行或
              hyperautomation 切入，而不是以原生遥测 system of record 切入。Hunters 自己的材料把切入点说得很明确。 它卖给小团队的 AI 驱动调查、面向从电子表格或纯 MSSP
              监控升级买家的 first-SIEM 动作，以及以 OCSF 标准化的厂商无关数据湖姿态。最诚实的解读是双线作战：Hunters 必须在绿地和现代化项目中赢过大型打包方案，
              同时还要证明自己比只做自动化的相邻产品或 DIY build 更有运营实质。
