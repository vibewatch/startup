  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、监管与 AI 治理负担
        blocks:
          - type: paragraph
            body: >-
              Hunters 的核心法律风险不是某起已知公开诉讼；风险在于三件事叠加：公司总部在以色列、 作为处理者向受监管企业销售，并且现在把 AI 辅助调查接入敏感安全工作流。公司确实公布了
              实质性支架：隐私政策、DPA、SOC 2 Type II 声明和公开 ISO 证书。这比没有法律实质的 信任页面更强。但截至运行日，问题在于新鲜度和证明深度，而不是这些文件是否存在。公开 ISO 证书在
              2026-05-23 之前到期，公开材料包没有披露子处理者名录或数据驻留矩阵；公司仍需要买方接受 跨境、控制者-处理者和合同责任分配条款，价值才可能兑现。外部义务也更紧，不是更松。 GDPR 仍是 EU
              基础法律，以色列传输规则要求不低于原有保护或合同保障，CPPA 的 2026 法规推动 风险评估和网络安全审计，EU AI Act 增加透明度和基于风险的治理预期，NIS2 收紧关键行业网络义务， DOJ
              数据安全规则则让敏感跨境数据处理成为当前尽调议题，而不是理论问题。
