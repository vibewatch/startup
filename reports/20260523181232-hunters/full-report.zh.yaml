      - number: '3.3'
        title: 定价、包装与采购现实
        blocks:
          - type: paragraph
            body: >-
              公开定价透明度不均衡，这一点重要，因为 Hunters 最好的切入点往往是想要快速采购和可预测经济性的 first-SIEM 买方。 Sentinel 是最清楚的在位者反例，因为 Microsoft
              发布了基于接入量、带承诺层级的定价结构。LimaCharlie 更明确， 公布 endpoint 和每 GB 费率，并强调无合同。Tines 披露免费 Community
              Edition，但大多数付费方案细节仍放在销售之后； Google 描述基于 package 的接入定价，却不发布标价。Devo 给买方一个按 ingest 打包的信号，但没有公开费率卡。
              抓取到的官方页面显示，赛道中大多数其余玩家仍以报价为主，包括 Hunters 自身。因此，公开来源支持的是关于定价清晰度的比较结论， 而不是关于总成本领先的确定结论。打包型在位者仍有采购优势，因为它们可以把
              SecOps 塞进既有 Azure、Google、 Cisco 或 Falcon 关系里；独立供应商则必须在运营 ROI 和 time to value 上赢得更多讨论。
