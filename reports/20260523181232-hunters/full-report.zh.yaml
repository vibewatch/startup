      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Hunters 是一家 2018-founded 的公司，最稳定关联的人物是 Uri May 和 Tomer Kazaz； 最早的公司融资文章还在孵化故事中提到 Ehud
              Schneorson、Yodfat Harel Buchris 和 Idan Nurick。 治理可见度比融资可见度更弱。抓取资料包只有一个明确董事会数据点——BusinessWire 的 Series C
              新闻稿引用了 Stripes 创始人 Ken Fox，称其为 Hunters 董事会成员；除此之外，公开董事会构成、持股比例和投资人控制权披露不足。 管理层可见度更好，但仍碎片化。2019 seed 发布稿把
              Tomer Kazaz 标为 CTO，而 2024 产品发布稿引用 Yuval Itzchakov 时称其为 CTO，说明技术领导头衔随时间演变。较新的官方内容还提到 Ian Forrest 负责产品领导， 以及
              Hanan Levin 推动 EMEA 扩张。在公开记录里，公司仍高度由创始人定义；Uri May 在融资、合作和产品公告材料中反复作为主要对外讲述者出现。
