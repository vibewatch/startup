      - number: '5.2'
        title: 架构、数据湖姿态与集成运营模式
        blocks:
          - type: paragraph
            body: >-
              最清晰的架构主题，是接入和标准化层的开放性，但 Snowflake 重心真实存在。Hunters 记录了三种采集方法： 直接 API 或 webhook 抽取，AWS S3、GCP 和 Azure Storage
              等中间存储产品，以及 Oracle Cloud、 Azure Event Hub 等第三方 streaming 工具。集成工程 blog 补上了这份菜单背后的运营逻辑。Hunters 称， 每个集成都要保持
              hermeticity、最小化延迟、尊重 rate limits、使用窄权限凭据、暴露设置可见性，并让 staged 数据易于解析和查询。这套运营模式供给一个安全数据湖，客户可以让 Hunters 托管在
              Snowflake 上，也可以作为自带 Snowflake 部署直接连接。在这个湖之上，Hunters 现在把抽象层锚定在 OCSF。公司称 OCSF 是其主要数据模型； 2024 OCSF 公告以及 OCSF
              和 AWS Security Lake 文档支撑了其重要性：OCSF 厂商无关、可扩展， 旨在减少源特定 schema 摩擦。随后 Hunters 用 OCSF 原生 Search
              隐藏字段标准化工作，让分析师能基于事件或对象 hunting， 而不是逼每个团队记住源特定语法。公开文档还显示，架构高度依赖第三方遥测质量和凭据。CrowdStrike 覆盖原始事件、 基于身份的告警和较新的
              Alerts API flow，而 Signal Sciences 接入依赖 API 访问请求、事件和公司活动日志。 因此，平台在理论和界面上厂商无关，但实践中仍运营性依赖合作伙伴 API、合作伙伴存储导出，以及
              Hunters 自身映射和 parser 维护质量。
