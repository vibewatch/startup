        - 财务负责人现金桥和融资历史审查。
      - - 股权结构
        - 完全摊薄股权表、清算顺位和任何二级交易条款
        - 决定公平企业价值是否真的带来公平股权回报。
        - 法务审查融资文件和最新 409A 材料。
      - - 商业耐久性
        - 头部客户集中度、续约结果和近期竞争输赢数据
        - 检验 Hunters 是否配得上高于低端上市可比公司的位置。
        - 销售、CS 和客户队列尽调。
    notes: 这些问题不是装饰项，而是把本章从有纪律的公开市场三角测算，推进到可真实背书的估值决策所需的最低材料包。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV031
      - CV043
