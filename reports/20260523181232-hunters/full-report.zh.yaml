      - number: '2.2'
        title: 规模测算视角：方向上有用，细节上矛盾
        blocks:
          - type: paragraph
            body: >-
              公开市场数据有助于划出外边界，但不能给出一个干净、已发表的 AI 驱动 SOC 平台 TAM。Mordor 估计 2026 SIEM 市场为 $12.06 billion，MarketsandMarkets
              则把同一年定为 $8.39 billion， 马上说明即便基础品类也高度依赖定义。SOAR 和 XDR 分别增加 $2.22 billion 与 $3.69 billion 的 2026
              相邻视角，但这些品类与供应商现在围绕新一代 SIEM 提出的平台主张重叠。因此，简单相加会夸大独立支出。 本章保留三个口径：约 $14.28 billion 的保守收敛视角、约 $17.97 billion
              的扩张视角，以及接近 $16.1 billion 的方向性中点。这些数字适合给市场划边界，不适合假装重叠问题已经解决。Hunters 实际 SAM 还要更窄，因为公司当前定位最适合 first-SIEM
              和精简团队现代化场景，而不是覆盖全球所有 SIEM、SOAR、 XDR、MDR 和 endpoint 预算。
