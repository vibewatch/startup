      - number: '6.5'
        title: 集中度风险、扩张风险与证据缺口
        blocks:
          - type: paragraph
            body: |
              最可信的扩张逻辑，是在复杂安全数据环境里先落地、再扩张。
              官方和合作伙伴页面反复描述同一套打法：先靠快速摄取和开箱即用的检测缩短启动时间，
              再扩到更广的遥测覆盖、与 Snowflake 连接的分析、自定义用例，以及借助 AWS Marketplace 和
              CrowdStrike Marketplace 的渠道采购。这个逻辑有吸引力，因为 Hunters 可以先以
              价值实现速度作为切口，再随着客户遥测和工作流深度一起长大 [CU022, CU023, CU034,
              CU037, CU039].

              集中度问题更难。公开证据支持企业级质量，但不支持企业级集中度判断。
              Hunters 明确面向比普通 SMB 安全厂商更大、更复杂的客户；官方和合作伙伴材料反复提到
              Fortune 500、大型受监管企业和世界级组织。但已审阅材料没有量化头部客户 ARR 占比、
              按垂直行业拆分的收入、对 Snowflake 中心型买家的依赖，或金融服务相对其他细分市场的收入集中度。
              由于公开参考集带有选择性，且多由合作伙伴撰写，集中度和续约风险仍是开放尽调项，
              而不是公开事实 [CU033, CU034, CU038, CU040].
