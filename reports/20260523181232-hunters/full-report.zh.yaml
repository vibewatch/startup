  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与当前估值背景
        blocks:
          - type: paragraph
            body: >-
              Hunters 已经跨过估值章节的第一道门槛：公开证据足以说明这是一家真实公司，处在真实市场里，有可信的支持方和产品牵引。 问题在第二道门槛，也就是价格。保留公开资料中最后一轮可佐证的定价轮，仍是 2022 年
              1 月的 Series C。 该轮最强公开报道显示，Hunters 融资 $68 million，披露累计融资约 $118 million，且当时仍未达到独角兽状态。 到 2026
              年仍可访问的数据库式来源，也都指回同一轮 Series C，把它作为最新浮出水面的轮次。因此，本章不能诚实地 把任何更高的 2025 或 2026 标记当作已验证事实。


              因此，新资金的建议是 research-more，观察名单目的则是 track，而不是 buy。这不是判断 Hunters 没有产品或市场， 而是判断当前
              ARR、毛利率、NRR、烧钱速度、现金跑道和价格发现都缺席于公开记录。在私有软件公司里，这些不是边角信息； 它们决定几亿美元估值到底保守还是激进。正确姿态是把公司质量和入场纪律分开，并拒绝虚假的精确性。
