  - id: TP004
    title: 护城河耐久性 / 竞争风险台账
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 开放、厂商中立的数据湖和 OCSF 姿态
        - OCSF 本身开放且不绑定存储，竞争对手可复制互操作叙事，削弱格式锁定
        - 高
        - 要求提供迁移案例、数据引力指标，并证明开放摄取仍能转化为更好的留存或扩张
      - - 首套 SIEM 和精简团队导入
        - 即便 Hunters 更容易部署，Azure、Google、Cisco 和 Falcon 的标准化仍可能主导绿地采购
        - 高
        - 要求按绿地采购与替换场景拆分赢单 / 输单，并按账户中既有技术栈拆分
      - - AI 辅助调查和无需检测工程叙事
        - Splunk、Sentinel、Google SecOps、CrowdStrike、Exabeam 和 Swimlane 现在都在营销 AI 或智能体辅助
        - 高
        - 将分析师工时节省、误报减少和部署速度与既有厂商试点对标
      - - 平台中立共存
        - Tines、Torq 和 Swimlane 可与 Hunters 并行部署，不替换遥测层也能拿走工作流所有权
        - 中
        - 衡量部署后哪些响应和案件工作流留在 Hunters 内，哪些流向附加自动化工具
      - - MSSP 和渠道侧翼
        - LimaCharlie、Stellar、Securonix、Swimlane 和 Google 都呈现 MSSP 或多租户信号，可借合作伙伴切入攻击
        - 中
        - 要求提供伙伴来源销售管线占比、附加率，以及 MSSP 影响架构时 Hunters 的赢单 / 输单情况
      - - 定价纪律和可预测性叙事
        - 公开来源无法证明 Hunters 明显比直接同业更便宜，因为多数竞品都由报价驱动
        - 中
        - 在承保价格护城河前，收集当前客户报价、谈判折扣区间和毛利率底线
      - - 抵御捆绑能力
        - Microsoft、Cisco 或 Splunk、Google 和 CrowdStrike 可借更广的平台关系落地 SIEM、AI 和自动化
        - 高
        - 要求提供续约周期赢单数据，并证明平台捆绑激进定价时 Hunters 仍能守住
    notes: 严重性反映有证据支撑的竞争压力，并不意味着该威胁已经转化为可量化流失。
