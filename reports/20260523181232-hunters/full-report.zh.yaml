      - number: '3.4'
        title: 护城河耐久性与最大替代风险
        blocks:
          - type: paragraph
            body: >-
              Hunters 的护城河真实存在，但不是经典锁定型护城河。证据最强的优势包括开放且厂商无关的数据接入故事、明确的 first-SIEM 和精简团队契合度，以及承诺无需大型内部
              detection-engineering 团队也能创造价值的 AI 辅助调查。 这些强项有意义，因为许多在位平台仍要求买方处理更大的产品组合取舍或企业级重采购。问题在于，同样的开放性帮助 Hunters
              对抗传统锁定，也削弱了排他性。OCSF 厂商无关、存储无关，因而可移植性双向生效。Tines、Torq、 Swimlane 等自动化专家可以与 Hunters
              共存，并拿走响应工作流所有权。LimaCharlie、Stellar Cyber、Securonix、 Swimlane 和 Google 等 MSSP
              友好型供应商，可以通过服务商渠道切入账户，而不是直接正面对替。最重要的是， 来自 Microsoft、Cisco 旗下 Splunk、Google 和 CrowdStrike
              的打包压力是最大的护城河破坏者，因为这些供应商能把 AI、SIEM 和自动化打包进更大的平台关系。公开证据还没有显示 Hunters 是否赢下足够多绿地或 rip-and-replace 交易，
