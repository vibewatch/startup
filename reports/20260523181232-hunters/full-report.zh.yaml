      - number: '6.2'
        title: 采用轨迹与企业 reference 广度
        blocks:
          - type: paragraph
            body: |
              Hunters 的公开采用故事，在 reference 质量上强于客户总数。审阅的 2026 来源包没有披露新的合计客户数。
              采用度通过合作伙伴和融资材料，以及越来越多的实名案例研究可见。Snowflake 在 2020 被描述为 Hunters 最早客户之一和
              go-to-market 合作伙伴；这很重要，因为它把 Hunters 长期的数据湖姿态锚定在真实 reference account 上，
              而不只是供应商集成主张 [CU006]。

              到 January 2022，公司公开报告 2021 收入增长 5x、ARR 增长超过 4x；BusinessWire 和 DTCP 材料称
              Hunters 增加了众多灯塔企业客户、不断增长的 Fortune 500 客户名单，并点名 Booking.com、Snowflake、Netgear
              和 Cimpress 作为公开 reference enterprises [CU007, CU008, CU009]。截至报告运行日，Unzer、Clumio、
              Snowflake、Spotnana、Solaris 和 Pennymac 都有 2026-accessible 详细证据；每个案例强调的都是快速部署、
              预构建逻辑和更广遥测关联，而不是狭义点产品替换 [CU010, CU011, CU012, CU034, CU037]。
