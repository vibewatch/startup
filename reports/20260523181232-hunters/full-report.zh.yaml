  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 从工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Hunters 最好被理解为面向精简安全团队的 SOC 控制平面，而不是狭义日志存储。在产品页和技术文档中，公司描述的工作流从广泛遥测接入开始， 进入内置检测，自动调查检测浮出的内容，再把相关证据归并为
              Stories，让分析师审阅事件，而不是孤立告警。 这种工作流框架重要，因为它解释了 Hunters 为什么把自己同时定位为新一代 SIEM 和更广义 SOC 平台：产品不只是存日志， 而是试图掌控
              triage、调查和优先级排序循环；小团队通常不得不把多个独立工具拼起来应对这套循环。公开迁移指南强化了同一运营模式。 Hunters 要求买方从 endpoint、identity、cloud
              和业务关键自定义日志入手，用低接触流程快速接入，加入 asset tags 和 custom scoring 等业务上下文，培训团队，并在切换前验证覆盖范围。公司还把这条迁移路径与明确生产力主张配套， 包括告警
              triage 减少 80%、过量告警减少 90%；但这些百分比仍是公司报告，并非独立 benchmark。实际 takeaway 是， Hunters 向 first-SIEM 和 SIEM
              替换买方销售一种快速部署工作流：连接技术栈，让 Hunters 应用内置内容， 审阅更高保真事件，把分析师时间留给响应，而不是 parser 维护或无尽规则维护。
