  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：SIEM、SOAR、XDR 与 AI SOC 为什么走向收敛
        blocks:
          - type: paragraph
            body: >-
              Hunters 应放在已经收敛的安全运营平台市场里分析，而不是狭义地当作传统 SIEM 替代。其当前产品表面强调新一代 SIEM、AI 主导调查、OCSF
              标准化数据、安全数据湖，以及面向小团队的快速部署。这样的描述已经与大型在位者的市场叙事重叠： CrowdStrike 将新一代 SIEM 定义为 AI 原生 SOC 平台，Palo Alto 把 Cortex
              XSIAM 定位为 AI 驱动的安全运营平台， Microsoft 在 Defender portal 中明确统一 SIEM 与 XDR，Google 将 Security Operations 描述为面向大规模
              SecOps 的遥测留存和分析层，Splunk 则把 SOAR 视为更广义 AI-powered 安全栈的一部分。因此，纳入的支出不只是日志留存，
              而是控制平面层：接入并标准化遥测，关联检测，自动化调查和响应，并管理案件或工作流。主要排除项包括只面向 endpoint 的预算、 纯 MDR 人力、只为合规留存的日志归档，以及从未成为 SOC system
              of record 的通用可观测性工具。现状替代方案仍重要， 因为电子表格、手工 triage、传统 SIEM 管理和高度依赖 MSSP 的运营模式，都是 Hunters 自己主张要替代的路径。
