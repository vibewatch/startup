      - number: '8.2'
        title: 可比公司组合与情景区间
        blocks:
          - type: paragraph
            body: >-
              公开和私有市场可比对象有助于划边界，但不能抹掉 Hunters 自身的披露缺口。保留的 2026 公开市场集合跨度极宽。 CrowdStrike 和 Palo Alto Networks
              展示了规模化平台龙头可以拿到什么估值。SentinelOne、Qualys、Elastic 和 Tenable 则说明，当下安全软件也可能只拿到中个位数或低个位数收入倍数。Rapid7
              提醒投资人，一旦增长信心受损， 公开市场会更严厉地折价安全类公司。私有市场和战略交易侧，NinjaOne、Wiz 以及 Cisco 或 Splunk 交易说明高溢价成交 仍会发生，但对象通常拥有比 Hunters
              当前披露内容清晰得多的当期规模或战略稀缺性。


              因为 Hunters 不披露当前收入，正确答案不是猜一个数字，而是展示假设树。悲观情景假设当前 ARR 温和，并按公开市场式折价。
              基准情景假设它具备可信的增长型软件画像，且经济性可接受。乐观情景假设当期规模强得多，并具备软件式留存和毛利质量。 三个区间都是明确估计，这正是重点：基于市场的估值可以在这里框定纪律，但不能替代管理层披露。
