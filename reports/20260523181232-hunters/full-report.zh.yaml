        - label: 悲观
          low: 75
          mid: 120
          high: 175
          unit: USD m
        - label: 基准
          low: 200
          mid: 300
          high: 420
          unit: USD m
        - label: 乐观
          low: 560
          mid: 720
          high: 900
          unit: USD m
