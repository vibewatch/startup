      - number: '2.3'
        title: 买方地图、预算所有者，以及 MSSP 或渠道影响
        blocks:
          - type: paragraph
            body: >-
              买方不是单一 persona。在企业里，商业 sponsor 通常是 CISO 或 SecOps 负责人，他们想简化 SOC 控制平面、 减少交接，并避免再上一个昂贵的传统 SIEM 项目。日常用户是 SOC
              分析师、检测工程师和响应人员，他们必须承受告警量和案件管理摩擦。 云和平台安全团队也重要，因为他们影响遥测来源、schema 对齐、数据湖架构，以及与现有 endpoint 和 XDR stack
              共存还是迁移出去的选择。Hunters 的 first-SIEM 信息也把口径扩到大型在位者之外：有些组织是更小或更精简的团队， 在运行复杂企业 SIEM 之前，就已经不再适合电子表格或纯 MSSP
              模式。MSSP 仍有战略重要性，因为 Microsoft 明确支持多租户 Sentinel 运营，Google 也在扩展合作伙伴支持的 SecOps 工作流。这意味着 Hunters 的渠道相关性真实存在，
              即便公开来源没有披露直销与 MSSP 主导需求之间的准确拆分。
