      - number: '6.4'
        title: 留存、重复使用与 land-and-expand 机制
        blocks:
          - type: paragraph
            body: |
              Hunters 不公开披露 NRR、GRR、logo churn、合同期限、续约率或真实 cohort 留存。这是本章最重要的限制。
              现有证据支持可能产生持久留存的机制，但不支持实际留存结果。部署后，Hunters 往往横跨多个数据源，
              把预构建检测和关联逻辑嵌入分析师工作流，并在几个案例中使用 Snowflake 或客户自有数据湖架构运行。
              这些特性创造真实工作流切换成本，尤其针对那些采用 Hunters 正是为了避免自己构建和维护 SIEM 逻辑的精简团队 [CU024, CU025, CU037, CU039]。

              独立满意度证据稀疏，但方向上有用。PeerSpot 在审阅的 2026 资料包中只暴露一个可访问的详细评论摘要；
              该评论者给 Hunters 评分 4.0/5、整体 8/10，称赞其内置 detectors 和定价模型，但批评支持周转和集成广度。
              SoftwareWorld 信号更弱，因为它把 Hunters 错标为 EDR，称其缺少 API，并把产品框定给 self-employed 或小企业用户——
              这些都与 Hunters 官方 SOC 平台定位以及公开 API / marketplace 表面冲突。正确的尽调结论不是留存很弱，
              而是公开 retention 证据基础薄且嘈杂 [CU026, CU027, CU028, CU029, CU030]。
