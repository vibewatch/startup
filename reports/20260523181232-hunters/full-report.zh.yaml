      - number: '5.3'
        title: Pathfinder AI、差异化与 2026 路线图推进
        blocks:
          - type: paragraph
            body: >-
              Hunters 在 2025-2026 的主要差异化推进，是把 Pathfinder AI 叠在既有检测、自动调查和 Stories stack 之上。 官方 landing page 和 Pathfinder
              发布文章把系统分成两半。Copilot AI 是分析师辅助侧：线索总结、自然语言查询、 引导式调查、自定义检测编写、报告生成和威胁分类。Agentic AI
              是自主侧：triage、根因分析、自优化检测、协同响应执行， 以及跨云、网络、身份、威胁情报和 endpoint 专用 agents 的编排。重要尽调 nuance 是成熟度。 January 2026
              release notes 称 Pathfinder 已进入 open beta，会自动运行在相关告警上，并使用 Microsoft Azure OpenAI Service 做 LLM
              reasoning；但同一说明也称 Pathfinder 尚不会补救或执行自动动作， 且由于生成式输出可能错误，用户应验证结果。到 April 2026，Hunters 仍在加入反馈循环和
              private-preview 组织上下文； 这说明向前推进真实存在，也确认 AI 层在 beta 发布后仍在调优。与此同时，产品路线图显示的是实际平台工作，而不只是 AI marketing：March
              2026 在 portal 中推出 SQL custom detectors，January through April release notes 则记录了来自 CrowdStrike
              Incidents、Microsoft Message Trace 等退役供应商 endpoint 的迁移压力。 综合看法应保持平衡。Hunters 显然在投资智能体 AI 叙事和真实产品 surface
              area，但公开证据仍指向一个平台： 人工监督自动化强于无需人工介入的自主补救。
