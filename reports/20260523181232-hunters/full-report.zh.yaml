  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 下一代 SIEM / SOC 控制平面
        - 遥测摄取、标准化、搜索、检测、案件管理、调查工作台
        - 仅用于合规的日志归档和通用 IT 可观测性
        - CISO / SecOps 负责人；安全预算
        - Hunters 明确定位的核心市场层
      - - SOAR / 响应自动化
        - 跨工具的处置剧本、编排、调查自动化、响应动作
        - 没有 SOC 角色的独立 ITSM 工作流工具
        - SecOps 经理；安全运营预算
        - 纳入该项，因为现有厂商现在把自动化作为同一平台的一部分销售
      - - XDR / 跨域检测与响应
        - 跨端点、身份、云和邮件信号的跨域相关性分析
        - 没有 SOC 分析层的纯端点 EDR 预算
        - 安全架构和 SecOps 领导层；安全预算
        - 相邻领域，但正越来越多并入下一代 SIEM 采购路径
      - - 安全数据湖与模式层
        - 安全数据存储、标准化、联邦、OCSF 映射、数据路由和搜索
        - 不作为 SOC 记录系统使用的通用数据仓库
        - 安全工程 / 平台安全，需 CISO 批准
        - 重要，因为数据架构越来越决定平台黏性
      - - 现状替代方案
        - 传统 SIEM 管理、人工分诊、电子表格，以及 MSSP 优先的监控服务保留费
        - 不是直接软件 TAM；仅作为替代背景
        - 安全负责人或 IT 负责人
        - 解释为什么即使在全面替换项目之前，也可能出现首次 SIEM 和现代化预算
    notes: 纳入支出按 SOC 控制平面里的工作流所有权定义，而不是只看历史分析师标签。排除项剔除了 Hunters 实际软件 SAM 之外的 纯端点、纯服务和纯归档支出。
