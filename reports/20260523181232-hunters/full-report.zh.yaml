      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              结构性需求逻辑很清楚。人才压力仍会推高自动化需求，因为 ISC2 和 SANS 都把 2026 问题定义为削弱网络安全运营的技能错配， 而不只是岗位空缺数量。IBM 用 $4.4 million
              的全球平均数据泄露成本增加了财务紧迫感，并警告 AI 进展快于治理。 监管也支撑支出：ENISA 的 NIS2 指引、SEC 网络披露制度、CISA 日志与监控指引，都强化了更好证据收集、
              事件处理和运营可见性的必要性。同时，Dell'Oro 的 2026 展望称，安全预算继续转向云交付和订阅模式， 这有利于新一代 SIEM 和 AI-SOC
              平台。最大约束则是同一趋势的反面。Microsoft、CrowdStrike、Palo Alto Networks、 Google 和 Splunk
              的平台化会增加打包压力，并提高独立厂商的迁移或锁定风险。OCSF 等开放 schema 工作有助于互操作， 但也降低切换摩擦；除非供应商在工作流质量、价值兑现时间或渠道适配上胜出，否则很难守住持久差异化。
