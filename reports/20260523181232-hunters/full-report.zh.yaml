    sections:
      - number: '1.1'
        title: 身份定位、平台与运营模式
        blocks:
          - type: paragraph
            body: >-
              截至报告运行日，hunters.ai 会跳转到 hunters.security；Hunters 在该站把自己描述为 AI 驱动的新一代 SIEM 和更广义的 SOC
              平台，而不是单点工具。现有和近期官方材料对运营模式的描述一致：Hunters 接入并标准化攻击面上的安全数据， 关联信号，自动化调查，并试图用交钥匙平台替代传统 SIEM 管理。公开材料也能看出
              go-to-market 模式。 Series A 材料已经提到直销，以及 CrowdStrike Store、Snowflake Partner Connect 等合作伙伴渠道； 后续 AWS 和
              CrowdStrike marketplace 上架说明，渠道辅助采购仍是分销的一部分。近期产品信息还显示， 公司把平台叙事从经典 XDR 继续推向 OCSF 原生搜索和智能体 AI
              调查工作流。云数据湖取向、自动化和合作伙伴辅助分销叠在一起， 构成当前最清晰的图景：Hunters 卖什么，以及它希望客户怎么买。
