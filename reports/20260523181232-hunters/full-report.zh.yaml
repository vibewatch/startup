    rows:
      - - 品类需求
        - 环境越复杂，SIEM 和 SOC 自动化需求真实存在且还在增长。
        - 品类增长不保证每个厂商都能拿到溢价估值。
        - 展示持续胜率和扩张，证明 Hunters 在拿份额，而不只是参与市场增长。
      - - 产品和投资人背书
        - Hunters 拥有可信投资人、具名客户，以及直指传统 SIEM 痛点的产品定位。
        - 公开记录显示已有牵引力，但不显示当前 ARR、利润率或留存。
        - 提供经管理层确认的当前 ARR、NRR 和毛利率。
      - - 可比公司背景
        - 出色的安全平台仍可拿到私有和战略溢价倍数。
        - 多数上市安全可比公司交易倍数远低于溢价异常值，增长或披露质量更弱时尤其如此。
        - 拿出当前指标，证明 Hunters 应更接近溢价私有可比公司，而不是中游上市公司。
      - - 融资背景
        - 上一轮公开融资规模不小，管理层称公司已规划多年现金跑道。
        - 没有留存来源能证明 2026-05-23 的当前现金或融资状况。
        - 提供现金、现金消耗、现金跑道，以及任何期间融资或要约证据。
      - - 价格纪律
        - 价格合适时，纪律严明的投资者仍可能喜欢这家公司。
        - 没有经验证的当前估值标记，默认失败模式就是付贵。
        - 披露经验证的清算价格，或接受反映不透明度的折扣。
    notes: 本表把公司质量和入场价格拆开。反论点来自披露风险和可比倍数压缩，而不是声称 Hunters 没有真实产品。
