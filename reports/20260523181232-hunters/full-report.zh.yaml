        - 私营云原生 SIEM 厂商
        - SOC 现代化买方、合规主导买方、MSSP 友好环境
        - Unified Defense SIEM，配有可上董事会的报告和合规映射
        - 已抓取公开材料给出的定价细节有限，开放数据的信号弱于 Hunters
      - - Tines
        - 自动化优先的相邻厂商
        - 私营工作流平台；付费定价主要由销售驱动
        - 围绕既有工具自动化工作流的安全和 IT 团队
        - 编排和工作流深度强，免费入口简单
        - 定位不是完整遥测记录系统，也不是原生 SIEM 替代品
      - - Torq
        - 自动化优先的相邻厂商
        - 私营 AI SOC 超自动化厂商
        - 应对告警过载和响应瓶颈的 SecOps 团队
        - AI SOC 平台，聚焦关联、富化和自动动作
        - 公开材料更强调自动化，而非开放数据湖所有权
      - - Stellar Cyber
        - 独立统一 SecOps 同行
        - 私营 Open XDR / SecOps 厂商
        - 精简 SOC、MSSP，以及避免推倒重来的团队
        - 一个平台内整合 Open XDR、NG-SIEM、NDR、UEBA 和 AI
        - 公开定价不透明，企业牵引力不如打包型既有厂商可见
      - - Swimlane
        - 自动化优先的相邻厂商
        - 私营企业自动化厂商
        - 优先考虑工单管理和剧本的大型 SOC 与 MSSP
        - AI 智能体、低代码剧本、广泛集成、工单执行
        - 更应视为自动化层，而非直接首套 SIEM 竞品
      - - Devo
        - 独立数据中心型 SecOps 同行
        - 私营摄取中心型平台厂商
        - 数据路由、留存和分析要求重的团队
        - 可预测的按摄取包装、热数据、SIEM + SOAR + UEBA 包装
        - 费率仍未公开逐项列示，限制同口径价格比较
      - - Google Security Operations
        - 打包平台型既有厂商
        - Google Cloud 加 Mandiant 威胁情报杠杆
        - 大规模 SOC 现代化和 SIEM 迁移买方
        - 统一 SIEM + SOAR + 威胁情报，采用按套餐的摄取模型
        - 定价仍由销售驱动，对首套 SIEM 简洁性的优化也不够明显
      - - LimaCharlie
        - 独立模块化 SecOps 同行
        - 公共云 SecOps 构建平台，MSSP 动作明确
        - MSSP、构建者、企业 SOC，以及想要模块化基础设施的团队
        - 透明用量定价、无合同、公共云模块化、智能体操作员
        - 比 Hunters 的托管式首套 SIEM 叙事更偏构建模块
      - - 现状方案 / 内部自建
        - 替代方案，不是产品同行
        - 既有员工时间、MSSP 保留费和工程预算
        - 仍依赖表格、MSSP 重度监控或 DIY 管线的组织
        - 避免大型平台采购，可用自动化工具逐步拼装
        - 通常比专用 SOC 平台更慢、更不标准，也更难扩展
    notes: 规模和背书只反映已抓取官方或一手来源中明确写出的内容；许多私营厂商不会在这些页面披露当前融资或价格点。
