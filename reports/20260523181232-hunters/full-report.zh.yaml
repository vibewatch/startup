      - number: '7.3'
        title: 合作伙伴、平台与云依赖集中度
        blocks:
          - type: paragraph
            body: >-
              Hunters 的合作伙伴版图是商业资产，但也压窄了韧性。Snowflake 公开将 Hunters 列为合作伙伴， Snowflake Partner Connect 把这条路径制度化，AWS
              Marketplace 提供直接采购通道。这些入口有助于采用， 也告诉投资人公司最依赖哪里。Snowflake 不只是集成目标；它也是部署和数据所有权叙事的一部分。已发布的 Snowflake
              指南目前在这一路径上只支持 AWS 作为云提供商，这是实实在在的集中度信号，而不是泛泛的多云叙事。 Microsoft 通过 Azure OpenAI 和 Graph 嵌在 AI 与 Microsoft 365
              数据链里。CrowdStrike 嵌在告警覆盖里。 ServiceNow 延展事件上下文。每个集成都能提高黏性，但也都增加权限、API 版本、文档和响应时间风险。
              因此，议价能力和韧性不取决于某一条合作公告，而取决于 Hunters 能否让合作伙伴栈保持更新， 同时不让集成债漏成上线延迟、检测盲点，或续约时的信任侵蚀。
