      - number: '5.4'
        title: 信任、合规与成熟度约束
        blocks:
          - type: paragraph
            body: >-
              Hunters 具备有意义的公开信任信号，但当前性不均。隐私与安全页面称，Deloitte 对 Hunters 进行了与安全性和保密性相关的 SOC 2 Type II 审计，并发布 privacy policy
              与 DPA 页面，至少让基础数据处理承诺可见。同一页面还宣传 ISO/IEC 27001:2013 合规，但本次抓取到的公开证书有效期只到 2026-03-20，早于报告运行日。这并不能证明 Hunters
              失去认证，但意味着当前公开续期状态没有完全佐证，应作为尽调缺口处理，而不是干净的当前事实。 公开 AI guardrails 同样可信但不完整。January 2026 release notes
              称客户数据不会用于训练 Pathfinder models， 同时警告生成式输出可能不准确、应由用户验证。方向上不错，但也强化了 Pathfinder 不是零审查信任层。
              独立市场验证也比官方表面更薄。PeerSpot 在 SIEM 和 SOC-as-a-service 两个品类中仍显示评论量很轻、mindshare 中等； 一个低质量评论网站仍把 Hunters 错标为没有
              API 的 EDR 产品，尽管 Hunters 公开了 API 文档。更深层含义是， 产品故事技术上连贯，但围绕采用深度、外部社区使用、认证新鲜度和经审计结果指标的独立第三方证据，仍比公司官方 marketing
              深度浅。
