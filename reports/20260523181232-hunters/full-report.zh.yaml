  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与可见商业化
        blocks:
          - type: paragraph
            body: >-
              公开视角下，Hunters 应被视为经常性软件平台供应商，而不是硬件或交易型业务。最强证据来自公司自身定位： 当前页面描述的是 AI 驱动的新一代 SIEM 和更广义 SOC 平台，没有硬件
              BOM、支付量经济，也没有服务重收入披露。 虽然价格表不公开，商业姿态仍可见。Hunters 引导买方预约 demo 和产品 tour，而不是发布标价；Move Beyond SIEM
              页面则围绕不限接入量和可预测成本包装产品。Marketplace 证据又加了一层。AWS 和 CrowdStrike listings 显示 Hunters
              可以通过渠道基础设施销售或激活；这很重要，因为渠道采购可以加快预算触达，同时让实际净价更不透明。 Snowflake 合作伙伴材料进一步说明，一些部署可能跑在客户控制的数据湖基础设施上，使商业化部分取决于架构。
              结论是：报价主导的经常性 SaaS 模式，确有渠道杠杆，但公开层面对合同细节、折扣和精确定价单位的可见度很弱。
