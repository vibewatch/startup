  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与买方画像
        blocks:
          - type: paragraph
            body: |
              Hunters 的公开客户基础，最可信的分群维度是安全团队运营模式、监管负担和数据架构复杂度，而不是已发布客户数 taxonomy。
              Unzer、Solaris、Snowflake、Spotnana、Pennymac、Clumio 和未具名化工制造商显示，反复出现的买方是 CISO、
              VP Cybersecurity、安全工程经理或同等负责人，他们试图用相对精简的团队跑出有效 SOC。付款方通常是企业安全或基础设施预算；
              日常用户是 SOC 分析师、检测工程师和安全运营经理，他们需要关联、减少 triage，并让调查更容易 [CU001, CU002, CU003, CU004]。

              公开可证实的垂直行业覆盖欧洲支付与 fintech（Unzer）、DACH 地区 banking-as-a-service（Solaris）、
              美国 mortgage/financial services（Pennymac）、云和 SaaS 环境（Snowflake、Clumio）、旅行基础设施（Spotnana），
              以及全球制造 / 工业运营（Cimpress、未具名化工制造商）。这种广度反驳了单一垂直客户故事，但它仍是选择性样本，不是 census。
              最强可见模式是：当客户面对大规模遥测、工具蔓延或受监管数据处理要求，并希望比传统 SIEM 部署更快进入生产时，
              Hunters 更容易赢 [CU003, CU004, CU005, CU031, CU032]。
