figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Typical Hunters buyer journey from tool-sprawl pain to production deployment and expansion,
      based on recurring patterns across named case studies.
    approximationNotes: >-
      Journey stages are synthesized from named case studies rather than telemetry from Hunters'
      internal CRM. Time between stages, drop-off rates, and conversion rates are not publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU023
      - CU025
      - CU037
    data:
      nodes:
        - label: 'N1: Security-team pain recognized'
          description: Legacy SIEM, alert overload, manual investigations, or poor data portability become acute
          touchpoints: CISO / VP Cybersecurity / Security Engineering Manager, analyst backlog, compliance pressure
          headwayRole: Hunters not yet adopted; buyer defines the SOC pain point
        - label: 'N2: Evaluation of modern SOC platform'
          description: Team compares Hunters against legacy SIEM or other modern platforms and tests fit with existing tools
          touchpoints: Case studies, partner channels, AWS Marketplace, CrowdStrike Marketplace, Snowflake alignment
          headwayRole: Show fast onboarding, prebuilt detectors, and lower operating burden
        - label: 'N3: Initial data-source onboarding'
          description: Customer connects core telemetry and begins using out-of-the-box detections and enrichment
          touchpoints: Snowflake or existing data lake, EDR, identity, SaaS, cloud logs
          headwayRole: Built-in ETL, normalization, and first incident narratives
        - label: 'N4: Production triage and investigation'
          description: Analysts work from correlated attack stories instead of manually pivoting across consoles
          touchpoints: Daily alert queue, investigations, purple-team or real incident response
          headwayRole: Correlation, prioritization, automated investigation context
        - label: 'N5: Expansion into broader telemetry / analytics'
          description: Customer adds more sources, custom logic, or Snowflake-linked analytics once the first workflow is stable
          touchpoints: More detectors, custom use cases, customer-owned data lake, managed services
          headwayRole: Land-and-expand wedge inside broader SOC workflow
        - label: 'N6: Renewal / reference point'
          description: Account either becomes a reference customer or stalls if support, integration, or ROI proof disappoints
          touchpoints: Reference calls, renewal decision, support experience, procurement channel
          headwayRole: Outcome depends on realized workflow value, not publicly disclosed cohort metrics

