schemaVersion: report-v2
artifact: customers
slug: hunters
runDate: '2026-05-23'
company:
  name: Hunters
chapter:
  number: 6
  title: Customers
  letter: U
  summary: >-
    Hunters' public customer evidence supports a focused enterprise customer base of lean but
    sophisticated security teams rather than a broad mass-market footprint. Detailed production
    proof exists for Unzer, Cimpress, Clumio, Snowflake, Spotnana, Solaris, Pennymac, and one
    unnamed chemicals manufacturer; 2022 partner and financing materials also name Booking.com
    and Netgear, but those two remain logo-level references without fresh production detail as of
    2026-05-23. The strongest recurring pattern is a land-and-expand motion into security-data-lake
    and multi-tool environments where buyers want fast onboarding, built-in detections, correlation,
    and lower SIEM operating burden. The central diligence gaps are unchanged: no public total
    customer count, no disclosed NRR/GRR or true retention cohorts, no top-customer concentration
    disclosure, and only thin independent review coverage beyond one accessible PeerSpot review and
    lower-fidelity aggregator pages.

sections:
  - id: u-customer-segmentation
    title: Customer segmentation and buyer profile
    body: |
      Hunters' public customer base is most credibly segmented by security-team operating model,
      regulatory burden, and data-architecture complexity rather than by a published customer-count
      taxonomy. Across Unzer, Solaris, Snowflake, Spotnana, Pennymac, Clumio, and the unnamed
      chemicals manufacturer, the recurring buyer is a CISO, VP Cybersecurity, security engineering
      manager, or equivalent leader trying to run an effective SOC with a relatively lean team.
      The payer is typically the enterprise security or infrastructure budget; the day-to-day users
      are SOC analysts, detection engineers, and security operations managers who need correlation,
      triage reduction, and easier investigations [CU001, CU002, CU003, CU004].

      Publicly evidenced verticals span European payments and fintech (Unzer), banking-as-a-service
      in the DACH region (Solaris), U.S. mortgage/financial services (Pennymac), cloud and SaaS
      environments (Snowflake, Clumio), travel infrastructure (Spotnana), and global manufacturing /
      industrial operations (Cimpress, unnamed chemicals manufacturer). That breadth argues against
      a single-vertical customer story, but it is still a selective sample rather than a census.
      The strongest visible pattern is that Hunters wins where customers face large telemetry volumes,
      tool sprawl, or regulated data-handling requirements and want a faster path to production than
      legacy SIEM deployment usually offers [CU003, CU004, CU005, CU031, CU032].
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU031
      - CU032
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: u-adoption-trajectory
    title: Adoption trajectory and enterprise-reference breadth
    body: |
      Hunters' public adoption story is stronger on quality of references than on total customer
      count. The reviewed 2026 source pack does not disclose a fresh aggregate customer number.
      Instead, adoption is visible through partner and funding materials plus a growing set of named
      case studies. Snowflake was described in 2020 as one of Hunters' first customers and a go-to-
      market partner, which is important because it anchors Hunters' long-running data-lake posture
      in an actual reference account rather than only a vendor integration claim [CU006].

      By January 2022, the company was publicly reporting revenue growth of 5x in 2021 and ARR
      growth of more than 4x, while BusinessWire and DTCP materials said Hunters had added numerous
      lighthouse enterprise customers, a growing list of Fortune 500 customers, and named Booking.com,
      Snowflake, Netgear, and Cimpress as public reference enterprises [CU007, CU008, CU009].
      As of the run date, detailed 2026-accessible proof exists for Unzer, Clumio, Snowflake,
      Spotnana, Solaris, and Pennymac, with each case emphasizing fast deployment, prebuilt logic,
      and broader telemetry correlation rather than narrow point-product replacement [CU010, CU011,
      CU012, CU034, CU037].
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU034
      - CU037
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: u-named-customer-proof
    title: Named customer proof and production depth
    body: |
      Hunters has materially better named-customer proof than many private security-software peers,
      but the proof quality is uneven. The strongest evidence is on current or recent case studies
      with identifiable operators, use cases, and outcomes. Unzer says Hunters simplified data-source
      onboarding, surfaced security alerts and incident reports it had not previously seen, and helped
      the payments company respond in time to reduce business impact. Clumio says it acquired Hunters
      and Snowflake through AWS Marketplace and used Hunters' cross-source correlation to tie endpoint,
      Google Workspace, and Okta signals into a higher-fidelity investigation. Snowflake's case study
      frames Hunters as a way for a 10-person SOC to reduce noise and unify a best-of-breed tool set;
      Spotnana, Solaris, and Pennymac all describe similar themes of rapid time-to-value, data-lake-
      centered deployment, and lower manual detection-engineering burden [CU013, CU014, CU015, CU016,
      CU017, CU018, CU019, CU021, CU022].

      The weaker end of the evidence spectrum is logo-only proof. BusinessWire, DTCP, and PeerSpot
      customer copy name Booking.com and Netgear, so those logos are supportable as public references.
      But the reviewed 2026 pack did not surface fresh detailed case studies, named operator quotes,
      or current workflow detail for either account. They should therefore be treated as reference
      logos, not as fully refreshed production proof. That distinction matters because logo presence
      alone does not establish present-day deployment depth, contract durability, or expansion [CU020,
      CU035, CU036].
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
