      - CU036
    tableRefs:
      - TU003
    figureRefs:
      - FU003

  - id: u-retention-and-expansion
    title: Retention, repeat usage, and land-and-expand mechanics
    body: |
      Hunters does not publicly disclose NRR, GRR, logo churn, contract duration, renewal rates,
      or true cohort retention. That is the chapter's most important limitation. The available
      evidence supports the mechanisms that could produce durable retention, but not the actual
      retention outcomes. Once deployed, Hunters tends to sit across multiple data sources, embeds
      prebuilt detections and correlation logic into analyst workflow, and in several cases operates
      with Snowflake or customer-owned data-lake architecture. Those features create real workflow
      switching costs, especially for lean teams that adopted Hunters specifically to avoid building
      and maintaining SIEM logic themselves [CU024, CU025, CU037, CU039].

      Independent satisfaction evidence is sparse but directionally useful. PeerSpot exposes only one
      detailed accessible review summary in the reviewed 2026 pack; that reviewer rated Hunters 4.0/5
      and 8/10 overall, praised its built-in detectors and pricing model, but criticized support
      turnaround and integration breadth. SoftwareWorld is an even weaker signal because it mislabels
      Hunters as EDR, says it lacks an API, and frames the product for self-employed or small-business
      users — all of which conflict with Hunters' official SOC-platform positioning and public API/
      marketplace surfaces. The right diligence conclusion is not that retention is weak, but that the
      public evidence base for retention is thin and noisy [CU026, CU027, CU028, CU029, CU030].
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU027
      - CU028
      - CU029
      - CU030
      - CU037
      - CU039
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: u-concentration-and-gaps
    title: Concentration risk, expansion risk, and evidence gaps
    body: |
      The most credible expansion thesis is land-and-expand inside complex security-data environments.
      Official and partner pages consistently describe a motion that starts with fast ingestion and
      out-of-the-box detections, then expands into broader telemetry coverage, Snowflake-linked
      analytics, custom use cases, and channel-assisted procurement through AWS Marketplace and the
      CrowdStrike Marketplace. This is attractive because it suggests Hunters can start as a time-to-
      value wedge and then grow with customer telemetry and workflow depth [CU022, CU023, CU034,
      CU037, CU039].

      The concentration question is harder. Public evidence supports enterprise quality but not
      enterprise concentration. Hunters clearly targets larger and more sophisticated customers than
      a commodity SMB security vendor, and official/partner materials repeatedly highlight Fortune 500,
      major regulated enterprises, and world-scale organizations. But nothing in the reviewed pack
      quantifies top-customer ARR share, revenue by vertical, dependency on Snowflake-centric buyers,
      or how much revenue is concentrated in financial services versus other segments. Because the
      public reference set is selective and partner-authored, concentration and renewal risk remain
      open diligence items rather than public facts [CU033, CU034, CU038, CU040].
    claimRefs:
      - CU022
      - CU023
      - CU033
      - CU034
      - CU037
      - CU038
      - CU039
      - CU040
    tableRefs:
      - TU005
    figureRefs: []

