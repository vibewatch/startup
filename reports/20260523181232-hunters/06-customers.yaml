  evidenceGaps:
    - id: EGU001
      type: private-evidence-only
      severity: blocking
      topic: aggregate-customer-count
      missingEvidence: >-
        No reviewed 2026 source disclosed Hunters' current total customer count, customer count by
        geography, or customer count by vertical.
      whyItMatters: >-
        Without a denominator, investors cannot tell whether Hunters is a concentrated enterprise
        vendor with dozens of accounts or a broader platform with hundreds of customers. The answer
        materially affects concentration, sales efficiency, and referenceability.
      diligencePath: >-
        Request current customer count, active paid customer count, paid POC count, and customer mix
        by region / vertical / deployment architecture.
      relatedQuestionRefs:
        - QU003
        - QU008

    - id: EGU002
      type: private-evidence-only
      severity: blocking
      topic: retention-metrics
      missingEvidence: >-
        No public NRR, GRR, logo churn, renewal rate, contract length, or true customer-retention
        cohort data was found.
      whyItMatters: >-
        Customer-quality underwriting depends on durability, not just on impressive reference logos.
        Without real retention cohorts, the public chapter cannot distinguish compounding expansion
        from a leaky new-logo machine.
      diligencePath: >-
        Request cohort retention by vintage, gross and net revenue retention, logo churn, contract
        terms, and expansion revenue split by year 1 / year 2 / year 3.
      relatedQuestionRefs:
        - QU011
        - QU012
        - QU024

    - id: EGU003
      type: enumeration-incomplete
      severity: material
      topic: named customer proof coverage
      missingEvidence: >-
        Public proof is incomplete. Detailed workflow proof exists for several accounts, but Booking.com
        and Netgear remain logo-level references and Hunters does not publish a complete customer list.
      whyItMatters: >-
        The named-proof table is directionally strong but cannot be treated as exhaustive evidence of
        current production deployment breadth. Several large logos may be stale or lightly referenced.
      diligencePath: >-
        Request a dated reference-account list distinguishing active production customers, former
        customers, pilots, and public-reference restrictions. Prioritize Booking.com and Netgear.
      relatedQuestionRefs:
        - QU004
        - QU005
        - QU021
      relatedTableRefs:
        - TU003

    - id: EGU004
      type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: >-
        No public disclosure quantifies top-customer ARR share, vertical ARR share, or how much revenue
        depends on Snowflake-centered data-lake buyers.
      whyItMatters: >-
        Hunters' public reference set skews enterprise and regulated, which likely raises average deal
        size and therefore the potential impact of losing one or two lighthouse accounts.
      diligencePath: >-
        Request top-20 customers by ARR, ARR concentration by top 5 / top 10, ARR by vertical, and any
        revenue share tied to channel-assisted marketplace procurement.
      relatedQuestionRefs:
        - QU018
        - QU020
        - QU025

    - id: EGU005
      type: private-evidence-only
      severity: material
      topic: independent-satisfaction-coverage
      missingEvidence: >-
        Independent review coverage is thin and noisy: one accessible PeerSpot review summary plus a
        low-fidelity SoftwareWorld page do not provide enough statistical confidence to assess customer
        satisfaction or renewal risk.
      whyItMatters: >-
        A late-stage enterprise software company should ideally provide reference calls, CSAT/NPS by
        segment, support-SLA performance, and renewal cohorts. Public review scarcity raises the odds
        that only curated references are visible.
      diligencePath: >-
        Request customer-reference calls by segment, NPS/CSAT by customer cohort, support ticket SLA
        attainment, and independent survey data if available.
      relatedQuestionRefs:
        - QU009
        - QU010
        - QU024
