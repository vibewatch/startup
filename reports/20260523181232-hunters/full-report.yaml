  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The decision path starts with real product and funding evidence but stops at a research-more call because current
      price discovery is missing.
    data:
      nodes:
        - label: Last priced round
          value: 2022 Series C; $68M raised; ~not a unicorn
        - label: Category demand
          value: SIEM / SOC automation still grows as environments and AI complexity rise
        - label: Comparable backdrop
          value: Public comps span ~0.6x to ~35x; premium private outcomes are exceptional
        - label: Current opacity
          value: No retained current ARR, margin, retention, runway, or verified seller mark
        - label: Scenario envelope
          value: $75M-$175M bear; $200M-$420M base; $560M-$900M bull
        - label: Decision
          value: Research-more / track until price and fundamentals are disclosed
    approximationNotes: Flow compresses a qualitative underwriting tree into six nodes for IC readability.
