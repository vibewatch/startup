            title: Channel relevance is real but under-disclosed
            body: >-
              Microsoft and Google both show that multi-tenant and partner-supported workflows matter in modern SecOps.
              Hunters may benefit from the same channel logic, but public sources do not disclose how much of its actual
              demand is direct versus MSSP-led.
