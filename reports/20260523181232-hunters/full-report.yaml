    approximationNotes: Flow combines migration docs, platform docs, and product-page messaging and is not time-scaled.
    data:
      nodes:
        - id: plan
          label: Plan migration
          detail: Security team defines timeline, stakeholders, and priority use cases.
        - id: prioritize
          label: Prioritize telemetry
          detail: Endpoint, identity, cloud, and business-critical custom logs are selected first.
        - id: onboard
          label: Onboard data sources
          detail: Low-touch integration flows connect APIs, storage buckets, or streaming paths.
        - id: context
          label: Add context and tuning
          detail: Asset tags, custom scoring, and optional custom detectors adapt the platform to the environment.
        - id: detect
          label: Detect Leads
          detail: Built-in or custom detections operate over raw or normalized data.
        - id: investigate
          label: Automatic investigation
          detail: Hunters enriches entities, attributes, and alert context and assigns risk scores.
        - id: stories
          label: Stories and summaries
          detail: Related leads are grouped into attack narratives and increasingly summarized by AI.
        - id: respond
          label: Analyst review and response
          detail: Analysts validate findings, take one-click response actions, and feed future tuning.
      edges:
        - from: plan
          to: prioritize
          label: Use-case scoping
        - from: prioritize
          to: onboard
          label: Connect sources
        - from: onboard
          to: context
          label: Operational tuning
        - from: context
          to: detect
          label: Enable content
        - from: detect
          to: investigate
          label: Lead generated
        - from: investigate
          to: stories
          label: Correlate evidence
        - from: stories
          to: respond
          label: Review and act
        - from: respond
          to: context
          label: Continuous improvement
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE006
      - CE021
      - CE022
      - CE030
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Hunters depends less on one endpoint agent than on the health of partner telemetry, Snowflake data-lake posture,
      and AI-service dependencies.
    approximationNotes: >-
      Dependencies are synthesized from public docs, partner materials, and release notes rather than from an official
      dependency register.
    data:
      nodes:
        - id: vendor-apis
          label: Vendor APIs and webhooks
          detail: Credentialed collection from products such as CrowdStrike and Signal Sciences.
        - id: storage
          label: Cloud storage / streaming bridges
          detail: AWS S3, GCP, Azure Storage, Oracle Cloud, and Azure Event Hub support some ingestion paths.
        - id: snowflake
          label: Snowflake data lake
          detail: Hunters-hosted or BYO Snowflake posture underpins the data-lake deployment model.
        - id: ocsf
          label: OCSF mappings
          detail: Normalization quality shapes Search, interoperability, and cross-source correlation.
        - id: partners
          label: Partner telemetry
          detail: CrowdStrike and other vendors supply the raw context that enriches Stories and hunts.
        - id: azure-openai
          label: Azure OpenAI Service
          detail: January 2026 release notes tie Pathfinder reasoning to Microsoft Azure OpenAI Service.
        - id: analysts
          label: Analyst verification
          detail: Public guardrails still assume analysts validate AI output before acting on it.
      edges:
        - from: vendor-apis
          to: storage
          label: Some sources export via buckets or streaming intermediaries
        - from: vendor-apis
          to: partners
          label: Collection quality depends on vendor credentials and endpoints
        - from: storage
          to: snowflake
          label: Ingested data lands in the lake
        - from: snowflake
          to: ocsf
          label: Search and correlation depend on normalized records
        - from: partners
          to: ocsf
          label: Partner events must be parsed and mapped correctly
        - from: ocsf
          to: azure-openai
          label: Structured context improves AI investigation inputs
        - from: azure-openai
          to: analysts
          label: AI conclusions still flow through human validation
    claimRefs:
      - CE009
      - CE010
      - CE015
      - CE018
      - CE019
      - CE028
      - CE044
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public evidence is strongest for ingestion breadth, OCSF posture, and investigation workflows, and weaker for
      independently validated AI and assurance depth.
    approximationNotes: Cells are qualitative judgments based on fetched public evidence rather than internal KPIs or customer telemetry.
    data:
      columns:
        - Public maturity signal
        - Primary dependency
        - Diligence status
      rows:
        - label: Ingestion breadth
          values:
            - label: Strong documentation and active release cadence
              tone: positive
            - label: Vendor APIs, storage exports, and parser maintenance
              tone: warning
            - label: Directionally strong, but exact supported-count is not fully public in fetched text
              tone: warning
        - label: Open data-lake and OCSF posture
          values:
            - label: Strong and differentiated in official messaging
              tone: positive
            - label: Snowflake deployment choices and mapping quality
              tone: warning
            - label: Strategically credible and well corroborated
              tone: positive
        - label: Automatic investigation and Stories
          values:
            - label: Core product flow is clearly documented
              tone: positive
            - label: Entity resolution and multi-source data quality
              tone: warning
            - label: Operationally central, but outcome metrics remain mostly company-reported
              tone: warning
        - label: Pathfinder AI autonomy
          values:
            - label: Meaningful 2026 feature motion, but still post-beta tuning
              tone: warning
            - label: Azure OpenAI plus analyst-verification loop
              tone: warning
            - label: Promising, but not yet a fully de-risked hands-off remediation layer
              tone: warning
        - label: Trust and compliance evidence
          values:
            - label: SOC 2 page and privacy surfaces are visible
              tone: positive
            - label: Certificate freshness and public scope detail
              tone: warning
            - label: ISO renewal status still needs direct diligence confirmation
              tone: warning
        - label: Developer and community signal
          values:
            - label: Public API-doc surface and GitHub research repo exist
              tone: positive
            - label: Thin independent review volume and noisy aggregator coverage
              tone: warning
            - label: Usable but still lighter than mature platform ecosystems
              tone: warning
    claimRefs:
      - CE017
      - CE024
      - CE027
      - CE029
      - CE035
      - CE040
      - CE042
      - CE044
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Typical Hunters buyer journey from tool-sprawl pain to production deployment and expansion, based on recurring
      patterns across named case studies.
    approximationNotes: >-
      Journey stages are synthesized from named case studies rather than telemetry from Hunters' internal CRM. Time
      between stages, drop-off rates, and conversion rates are not publicly disclosed.
    claimRefs:
      - CU001
      - CU002
      - CU023
      - CU025
      - CU037
    data:
      nodes:
        - label: 'N1: Security-team pain recognized'
          description: Legacy SIEM, alert overload, manual investigations, or poor data portability become acute
          touchpoints: CISO / VP Cybersecurity / Security Engineering Manager, analyst backlog, compliance pressure
          headwayRole: Hunters not yet adopted; buyer defines the SOC pain point
        - label: 'N2: Evaluation of modern SOC platform'
          description: Team compares Hunters against legacy SIEM or other modern platforms and tests fit with existing tools
          touchpoints: Case studies, partner channels, AWS Marketplace, CrowdStrike Marketplace, Snowflake alignment
          headwayRole: Show fast onboarding, prebuilt detectors, and lower operating burden
        - label: 'N3: Initial data-source onboarding'
          description: Customer connects core telemetry and begins using out-of-the-box detections and enrichment
          touchpoints: Snowflake or existing data lake, EDR, identity, SaaS, cloud logs
          headwayRole: Built-in ETL, normalization, and first incident narratives
        - label: 'N4: Production triage and investigation'
          description: Analysts work from correlated attack stories instead of manually pivoting across consoles
          touchpoints: Daily alert queue, investigations, purple-team or real incident response
          headwayRole: Correlation, prioritization, automated investigation context
        - label: 'N5: Expansion into broader telemetry / analytics'
          description: Customer adds more sources, custom logic, or Snowflake-linked analytics once the first workflow is stable
          touchpoints: More detectors, custom use cases, customer-owned data lake, managed services
          headwayRole: Land-and-expand wedge inside broader SOC workflow
        - label: 'N6: Renewal / reference point'
          description: Account either becomes a reference customer or stalls if support, integration, or ROI proof disappoints
          touchpoints: Reference calls, renewal decision, support experience, procurement channel
          headwayRole: Outcome depends on realized workflow value, not publicly disclosed cohort metrics
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: wide
    summary: >-
      Flow from partner or direct discovery into production deployment and expansion, emphasizing the channel-assisted,
      data-lake-friendly operating model visible in public proof.
    approximationNotes: >-
      This is a process flow, not a numeric conversion funnel. Public sources do not disclose stage-by-stage conversion
      rates or win rates.
    claimRefs:
      - CU011
      - CU015
      - CU022
      - CU023
      - CU037
    data:
      nodes:
        - id: discovery
          label: Direct / partner discovery
          detail: Case studies, Snowflake alignment, AWS Marketplace, CrowdStrike Marketplace, investor-partner ecosystem
          tone: neutral
        - id: eval
          label: Lean-team SIEM evaluation
          detail: >-
            Buyer tests whether Hunters can replace manual rule building and reduce alert overload faster than legacy
            SIEM
          tone: neutral
        - id: onboarding
          label: Fast initial onboarding
          detail: Core data sources connected; out-of-the-box detectors and enrichment begin producing alerts quickly
          tone: positive
        - id: production
          label: Production SOC workflow
          detail: >-
            Analysts use correlated attack stories, prioritization, and automated investigation context in daily
            operations
          tone: positive
        - id: expansion
          label: Data-lake / multi-source expansion
          detail: Customer adds more telemetry, Snowflake-linked analytics, or managed services after initial value is proven
          tone: positive
        - id: reference
          label: Named reference account
          detail: Strongest public outputs are company/partner-authored case studies and testimonials
          tone: neutral
        - id: friction
          label: Support / integration friction
          detail: >-
            Thin independent review base still flags support turnaround and integration breadth as possible renewal
            risks
          tone: adverse
      edges:
        - from: discovery
          to: eval
          label: initiates
        - from: eval
          to: onboarding
          label: selects
        - from: onboarding
          to: production
          label: operationalizes
        - from: production
          to: expansion
          label: broadens
        - from: production
          to: reference
          label: proves
        - from: production
          to: friction
          label: can encounter
