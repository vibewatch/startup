  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in workflow terms
        blocks:
          - type: paragraph
            body: >-
              Hunters is best understood as a SOC control plane for lean security teams rather than as a narrow log
              store. Across its product page and technical docs, the company describes a workflow that starts with broad
              telemetry onboarding, moves into built-in detections, automatically investigates what those detections
              surface, and then groups related evidence into Stories so analysts review incidents rather than isolated
              alerts. That workflow framing matters because it explains why Hunters positions itself as both a next-gen
              SIEM and a broader SOC platform: the product is not just storing logs, it is trying to own the triage,
              investigation, and prioritization loop that usually forces small teams to stitch together separate tools.
              Public migration guidance reinforces the same operating model. Hunters tells buyers to begin with
              endpoint, identity, cloud, and business-critical custom logs, onboard them quickly with a low-touch
              process, add business context such as asset tags and custom scoring, train the team, and validate coverage
              before cutover. The company pairs that migration path with explicit productivity claims, including 80%
              less alert triage and 90% less excessive alerting, but those percentages remain company-reported rather
              than independently benchmarked. The practical takeaway is that Hunters sells a fast-deployment workflow
              for first-SIEM and SIEM-replacement buyers: connect the stack, let Hunters apply built-in content, review
              higher-fidelity incidents, and reserve analyst time for response instead of parser upkeep or endless rule
              maintenance.
            claimRefs:
