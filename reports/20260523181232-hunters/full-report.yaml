          - type: paragraph
            body: >-
              Public evidence supports Hunters as a 2018-founded company associated most consistently with Uri May and
              Tomer Kazaz, while the earliest company financing post also credits Ehud Schneorson, Yodfat Harel Buchris,
              and Idan Nurick in the incubation story. Governance visibility is thinner than funding visibility. The
              fetched pack gives one explicit board datapoint—BusinessWire's Series C release quotes Stripes founder Ken
              Fox as a Hunters board member—but otherwise public board composition, ownership percentages, and
              investor-control rights are not well disclosed. Leadership visibility is better but still fragmented. The
              2019 seed release identified Tomer Kazaz as CTO, whereas a 2024 product release quoted Yuval Itzchakov as
              CTO, suggesting an evolution in technical leadership titles over time. Newer official content also names
              Ian Forrest in product leadership and Hanan Levin in EMEA expansion. The company remains highly
              founder-defined in the public record, with Uri May appearing repeatedly as the principal external narrator
