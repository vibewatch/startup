      - number: '5.4'
        title: Trust, compliance, and maturity constraints
        blocks:
          - type: paragraph
            body: >-
              Hunters has meaningful public trust signals, but they are unevenly current. The privacy and security page
              states that Deloitte audited Hunters for SOC 2 Type II relevant to security and confidentiality, and it
              publishes privacy-policy and DPA surfaces that at least make baseline data-processing commitments visible.
              The same page also advertises ISO/IEC 27001:2013 compliance, but the publicly posted certificate fetched
              for this run was valid only through 2026-03-20, which is before the run date. That does not prove Hunters
              lost certification, but it does mean current public renewal status is not fully corroborated and should be
              treated as a diligence gap rather than as a clean current fact. Public AI guardrails are similarly
              credible but incomplete. January 2026 release notes say customer data is not used to train Pathfinder
              models, while warning that generative outputs can be inaccurate and should be verified. That is
              directionally good, yet it reinforces that Pathfinder is not a zero-review trust layer. Independent market
              validation is also thinner than the official surface. PeerSpot still shows very light review volume and
              modest mindshare in both SIEM and SOC-as-a-service categories, and one low-quality review site still
              mislabels Hunters as an EDR product with no API even though Hunters exposes public API docs. The deeper
              implication is that the product story is technically coherent, but independent third-party proof around
              adoption depth, external community usage, certification freshness, and audited outcome metrics is still
              shallower than the company's official marketing depth.
