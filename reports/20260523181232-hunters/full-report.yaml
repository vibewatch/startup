        title: Exhibits
        blocks:
          - type: callout
            title: The control-plane layer is the real market boundary
            body: >-
              The most important boundary choice is not whether a product still calls itself SIEM. It is whether the
              buyer is purchasing the SOC control plane: telemetry normalization, investigation workflow, automation,
              and case management. That is the zone where Hunters, Microsoft, CrowdStrike, Palo Alto Networks, Google,
              and Splunk now overlap.
            calloutType: insight
            claimRefs:
