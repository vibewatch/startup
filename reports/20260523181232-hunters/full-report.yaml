  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive classes and why Hunters is not competing on the same axis with everyone
        blocks:
          - type: paragraph
            body: >-
              Hunters sits inside a converged SecOps field, but the competitive set breaks into distinct classes rather
              than one flat list. Microsoft Sentinel, Google Security Operations, Cisco-owned Splunk, IBM QRadar, and
              CrowdStrike pair SOC workflows with broader control planes, distribution leverage, or committed cloud and
              platform spend. Exabeam, Securonix, Devo, Stellar Cyber, and LimaCharlie are closer to Hunters as
              independent or semi-open next-gen SOC and SIEM alternatives. Tines, Torq, and Swimlane are different
              again: they lead with automation, case execution, or hyperautomation rather than a native telemetry system
              of record. Hunters' own materials make its wedge explicit. It sells AI-driven investigation for small
              teams, a first-SIEM motion for buyers graduating from spreadsheets or MSSP-only monitoring, and a
              vendor-agnostic data-lake posture standardized on OCSF. That makes the most honest read a two-front
              battle: Hunters must win greenfield and modernization projects against large bundles, while also proving
              it offers more operational substance than automation-only adjacencies or do-it-yourself builds.
