      - number: '7.2'
        title: Operational, quality, and incident-handling risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Hunters' biggest risk is that its product promise depends on a chain of moving parts that
              all have to stay accurate at the same time: upstream telemetry, Hunters' own parsing and normalization,
              correlation logic, and then Pathfinder's AI-generated reasoning on top. The company's own documentation is
              unusually candid that Pathfinder may be wrong and must be verified by humans. That disclosure is healthy,
              but it also confirms the product is not yet a hands-off autonomous trust layer. The same section of the
              public pack shows partner-change risk in real time. Hunters had to guide customers off retiring
              CrowdStrike incident logs and retiring Microsoft Message Trace endpoints during 2026, which is exactly the
              sort of vendor churn that can silently degrade coverage if response is slow. Snowflake onboarding adds
              additional customer-side friction through IP allowlisting, role setup, and network policies. The net
              result is a clear operational thesis: Hunters can work well for buyers who tolerate some complexity, but
              the downside case is detection-quality erosion or analyst over-trust if integration drift and AI error
              compound faster than the company can close the loop.
