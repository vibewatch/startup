    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating model
        blocks:
          - type: paragraph
            body: >-
              As of the run date, hunters.ai redirects to the hunters.security site, where Hunters describes itself as
              an AI-driven next-gen SIEM and broader SOC platform rather than a point tool. The current and recent
              official materials are consistent on the operating model: Hunters ingests and normalizes security data
              across the attack surface, correlates signals, automates investigation, and tries to replace legacy SIEM
              administration with a turnkey platform. The go-to-market model is also visible in public materials. Series
              A materials already referenced direct sales plus partner channels such as the CrowdStrike Store and
              Snowflake Partner Connect, and later AWS and CrowdStrike marketplace listings show that channel-assisted
              procurement remained part of distribution. Recent product messaging also shows the company extending the
              platform narrative beyond classic XDR into OCSF-native search and agentic AI investigation workflows. That
              combination of cloud data-lake orientation, automation, and partner-assisted distribution is the clearest
              current picture of what Hunters sells and how it expects customers to buy it.
