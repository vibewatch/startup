            title: Published TAMs overstate certainty for Hunters
            body: >-
              The public estimates are useful for bracketing the category, but none of them isolate an AI-driven SOC
              platform market or a Hunters-specific SAM. Treat the sizing figures as diligence lenses, not
              valuation-grade precision.
            calloutType: risk
            claimRefs:
