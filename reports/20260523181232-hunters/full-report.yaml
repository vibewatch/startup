  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, regulatory, and AI-governance burden
        blocks:
          - type: paragraph
            body: >-
              Hunters' core legal risk is not a known public lawsuit; it is the combination of being an
              Israel-headquartered processor, selling to regulated enterprises, and now attaching AI-assisted
              investigation to sensitive security workflows. The company does publish real scaffolding: a privacy
              policy, a DPA, a SOC 2 Type II claim, and a public ISO certificate. That is better than a trust page with
              no legal substance. But the run-date issue is freshness and proof depth, not mere existence. The public
              ISO certificate expires before 2026-05-23, the public pack does not expose a subprocessor register or
              residency matrix, and the company still needs buyers to accept cross-border, controller-processor, and
              contract-allocation terms before value can be realized. External obligations have also become tighter, not
              looser. GDPR remains foundational EU law, Israeli transfer rules require no-lesser protection or
              contractual safeguards, CPPA's 2026 regulations push toward risk assessments and cybersecurity audits, the
              EU AI Act adds transparency and risk-based governance expectations, NIS2 sharpens critical-sector cyber
              obligations, and DOJ data-security rules make sensitive cross-border data handling a live diligence topic
              rather than a theoretical one.
