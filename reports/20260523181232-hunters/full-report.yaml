      - number: '7.3'
        title: Partner, platform, and cloud-dependency concentration
        blocks:
          - type: paragraph
            body: >-
              Hunters' partner footprint is a commercial asset, but it also narrows resilience. Snowflake publicly lists
              Hunters as a partner, Snowflake Partner Connect formalizes that route, and AWS Marketplace provides a
              direct procurement path. Those surfaces help with adoption, yet they also tell investors where the company
              is most dependent. Snowflake is not just an integration target; it is part of the deployment and
              data-ownership story. The published Snowflake guide currently supports only AWS as the cloud provider for
              that path, which is a real concentration signal rather than a generic multi-cloud narrative. Microsoft
              sits inside the AI and Microsoft 365 data chain through Azure OpenAI and Graph. CrowdStrike sits inside
              alert coverage. ServiceNow extends incident context. Every one of those integrations can improve
              stickiness, but every one also adds permissioning, API-version, documentation, and response-time risk.
              That means bargaining power and resilience depend less on any one partnership announcement than on whether
              Hunters can keep the partner stack current without letting integration debt leak into onboarding delays,
              detection blind spots, or trust erosion during renewals.
