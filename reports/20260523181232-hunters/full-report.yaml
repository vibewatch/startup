      - number: '2.2'
        title: 'Sizing lenses: useful directionally, contradictory in detail'
        blocks:
          - type: paragraph
            body: >-
              Public market data is helpful for setting the outer boundary, but it does not yield one clean, published
              TAM for AI-driven SOC platforms. Mordor estimates the 2026 SIEM market at $12.06 billion, while
              MarketsandMarkets places the same year at $8.39 billion, immediately showing that even the base category
              is definition-sensitive. SOAR and XDR add adjacent 2026 lenses of $2.22 billion and $3.69 billion
              respectively, but those categories overlap with the platform claims vendors now make about next-gen SIEM.
              As a result, simply summing the categories would overstate unique spend. This chapter therefore preserves
              a conservative convergence lens around $14.28 billion, an expansionary lens around $17.97 billion, and a
              directional midpoint near $16.1 billion. Those figures are useful for bounding the market, not for
              pretending the overlap problem is solved. Hunters' practical SAM is narrower still because the company's
              current positioning is strongest for first-SIEM and lean-team modernization use cases, not the full global
              universe of every SIEM, SOAR, XDR, MDR, and endpoint budget.
