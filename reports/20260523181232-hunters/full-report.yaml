      - number: '8.2'
        title: Comparable set and scenario ranges
        blocks:
          - type: paragraph
            body: >-
              Public and private comparables help set boundaries, but they do not erase Hunters' own disclosure gap. The
              retained 2026 public market set is extremely wide. CrowdStrike and Palo Alto Networks show what scaled
              platform leaders can command. SentinelOne, Qualys, Elastic, and Tenable show that current security
              software can also clear only mid-single-digit or low-single-digit revenue multiples. Rapid7 is a reminder
              that the public market can discount a security name even more harshly when growth confidence erodes. On
              the private and strategic side, NinjaOne, Wiz, and the Cisco or Splunk transaction show that premium
              prints still happen, but they happen around companies with much more visible current scale or strategic
              scarcity than Hunters currently discloses.


              Because Hunters does not publish current revenue, the right answer is not to guess a single number but to
              show an assumption tree. The bear case assumes modest current ARR and public-like discounting. The base
              case assumes a credible growth software profile with acceptable economics. The bull case assumes much
              stronger current scale and software-like retention and margin quality. All three ranges are explicit
              estimates, and that is the point: market-based valuation can frame discipline here, but it cannot
              substitute for management disclosure.
