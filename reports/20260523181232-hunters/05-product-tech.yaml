- id: pathfinder-ai-differentiation-and-roadmap
  title: Pathfinder AI, differentiation, and 2026 roadmap motion
  body: 'Hunters'' main differentiation push in 2025-2026 is Pathfinder AI layered on top of the existing detection, automatic-investigation, and Stories stack. The official landing page and Pathfinder launch posts split the system into two halves. Copilot AI is the analyst-assistance side: lead summarization, natural-language querying, guided investigations, custom detection authoring, report generation, and threat classification. Agentic AI is the autonomy side: triage, root-cause analysis, self-optimizing detections, coordinated response execution, and orchestration across domain-specific cloud, network, identity, threat-intelligence, and endpoint agents. The important diligence nuance is maturity. January 2026 release notes say Pathfinder had moved to open beta, automatically ran on relevant alerts, and used Microsoft Azure OpenAI Service for its LLM reasoning, but the same note also says Pathfinder did not yet remediate or take automated actions and should be verified by users because
    generative output can be wrong. By April 2026, Hunters was still adding feedback loops and private-preview organizational context, which suggests material forward motion but also confirms the AI layer was still being tuned after beta launch. In parallel, the product roadmap shows practical platform work rather than only AI marketing: March 2026 brought SQL custom detectors in the portal, while January through April release notes documented migration pressure from retiring vendor endpoints such as CrowdStrike Incidents and Microsoft Message Trace. That mix supports a balanced read. Hunters is clearly investing in agentic AI messaging and in real product surface area, but the public evidence still points to a platform where human-supervised automation is stronger than hands-off autonomous remediation.'
