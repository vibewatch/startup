company:
  name: Hunters
chapter:
  number: 5
  title: Product & Technology
  summary: Hunters publicly presents the product as a next-gen SIEM and SOC platform built around vendor-agnostic data ingestion, an open security-data-lake posture, OCSF normalization, built-in detections, automatic investigation, Stories correlation, and a newer Pathfinder AI layer. The strongest technical evidence supports flexible collection methods, Snowflake-centric hosted or BYO data lake options, deep CrowdStrike and Signal Sciences workflows, and active 2026 release cadence for custom detectors and Pathfinder feedback loops. The biggest architecture dependencies are third-party telemetry quality, credentialed access to vendor APIs and storage, OCSF mapping quality, and Azure OpenAI-backed AI workflows whose public guardrails still look mid-rollout rather than fully mature.
sections:
- id: product-definition-and-customer-workflow
  title: Product definition in workflow terms
  body: 'Hunters is best understood as a SOC control plane for lean security teams rather than as a narrow log store. Across its product page and technical docs, the company describes a workflow that starts with broad telemetry onboarding, moves into built-in detections, automatically investigates what those detections surface, and then groups related evidence into Stories so analysts review incidents rather than isolated alerts. That workflow framing matters because it explains why Hunters positions itself as both a next-gen SIEM and a broader SOC platform: the product is not just storing logs, it is trying to own the triage, investigation, and prioritization loop that usually forces small teams to stitch together separate tools. Public migration guidance reinforces the same operating model. Hunters tells buyers to begin with endpoint, identity, cloud, and business-critical custom logs, onboard them quickly with a low-touch process, add business context such as asset tags and custom scoring,
    train the team, and validate coverage before cutover. The company pairs that migration path with explicit productivity claims, including 80% less alert triage and 90% less excessive alerting, but those percentages remain company-reported rather than independently benchmarked. The practical takeaway is that Hunters sells a fast-deployment workflow for first-SIEM and SIEM-replacement buyers: connect the stack, let Hunters apply built-in content, review higher-fidelity incidents, and reserve analyst time for response instead of parser upkeep or endless rule maintenance.'
