- id: architecture-open-data-lake-and-integrations
  title: Architecture, data-lake posture, and integration operating model
  body: 'The clearest architecture theme is openness at the ingestion and normalization layer, but with a real Snowflake center of gravity. Hunters documents three collection methods: direct API or webhook extraction, intermediary storage products such as AWS S3, GCP, and Azure Storage, and third-party streaming tools such as Oracle Cloud and Azure Event Hub. The integration-engineering blog fills in the operational logic behind that menu. Hunters says each integration is built to preserve hermeticity, minimize delay, respect rate limits, use narrow credentials, expose setup visibility, and make data easy to parse and query once staged. That operating model feeds a security data lake that customers can either let Hunters host on Snowflake or connect to directly as a bring-your-own Snowflake deployment. On top of that lake, Hunters now anchors its abstraction layer on OCSF. The company says OCSF is its primary data model, and the 2024 OCSF announcement plus OCSF and AWS Security Lake documentation
    support why that matters: OCSF is vendor-agnostic, extensible, and designed to reduce source-specific schema friction. Hunters then uses OCSF-native Search to hide field-normalization work from analysts and support event or object based hunting instead of forcing every team to memorize source-specific syntax. Public docs also show the architecture is highly dependent on third-party telemetry quality and credentials. CrowdStrike coverage spans raw events, identity-based alerts, and the newer Alerts API flow, while Signal Sciences ingestion depends on API access to request, event, and corporate activity logs. The platform is therefore vendor-agnostic in theory and interface, but in practice it remains operationally dependent on partner APIs, partner storage exports, and the quality of Hunters'' own mappings and parser maintenance.'
