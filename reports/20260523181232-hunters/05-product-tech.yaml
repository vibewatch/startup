- id: TE003
  title: Technology / operating architecture table
  notes: Architecture is reconstructed from Hunters docs, OCSF references, and partner materials rather than from a published reference architecture diagram.
  columns:
  - Layer / process
  - Role
  - Key dependency
  - Primary risk
  rows:
  - - Vendor APIs and webhooks
    - Direct collection for products that expose authenticated pull or push interfaces
    - Third-party API scopes, credentials, and rate limits
    - Coverage breaks if vendor endpoints change or narrow permissions
  - - Intermediary storage and streaming
    - Landing zone for sources routed through AWS S3, GCP, Azure Storage, Oracle Cloud, or Azure Event Hub
    - Customer cloud configuration and transport reliability
    - Lag, missing events, or parser drift can distort downstream detections
  - - Security data lake
    - Stores normalized telemetry for detection, search, dashboards, and notebooks
    - Hunters-hosted or customer-managed Snowflake environment
    - Snowflake-centric posture narrows true portability even under an open-data story
  - - Detection engine
    - Runs built-in or custom detectors on raw tables and mapped data
    - Parser quality, data freshness, and SQL detector correctness
    - False positives or missed detections rise when upstream data is noisy or partial
  - - Automatic investigation and Stories
    - Enriches leads, scores risk, and correlates multi-signal attack narratives
    - Entity enrichment logic and cross-source joins
    - Weak entity resolution can fragment or over-merge incidents
  - - Pathfinder AI layer
    - Adds Copilot assistance and agentic investigation orchestration
    - Azure OpenAI reasoning plus domain-specific agent workflows
    - LLM hallucination, limited remediation scope, and evolving feedback loops
  - - Analyst and developer surface
    - Search, dashboards, notebooks, docs, and public API documentation for integration or usage guidance
    - Public docs quality and API surface maintenance
    - Thin external community validation can slow practitioner confidence and ecosystem growth
