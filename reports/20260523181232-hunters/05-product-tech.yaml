    - Maintain external detection code and manual score adjustments
    - Add asset tags, custom scoring, and SQL custom detectors inside the platform
    - March 2026 release notes add portal-native SQL detector workflows
    - Public evidence does not yet show deep external developer adoption or reusable package ecosystem
