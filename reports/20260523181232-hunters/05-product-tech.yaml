- calloutType: risk
  title: Coverage quality is downstream of partner APIs and parser health
  body: Because Hunters depends on credentialed vendor data, bucket exports, and schema mappings, the real system risk is not only detection logic but also drift in upstream APIs, permissions, and normalization quality.
  claimRefs:
  - CE015
  - CE018
  - CE019
  - CE020
- calloutType: insight
  title: Pathfinder looks strategically important but still mid-rollout
  body: Public 2026 evidence shows real Pathfinder shipping velocity, but beta-era caveats, analyst-verification guidance, and ongoing feedback-loop work suggest the AI layer is not yet a fully mature autonomous SOC substitute.
