  topStrengths:
    - >-
      Large consumer and merchant distribution footprint with clear product breadth across payments, cards, and business
      tools.
    - Publicly reported FY2025 revenue and profit suggest that the operating engine has reached meaningful scale.
    - Historical fundraising and IPO interest indicate access to institutional capital and strategic relevance.
  topRisks:
    - Audited standalone financial statements, gross margin, and cash-flow detail remain unavailable.
    - Nigeria concentration and continuing regulatory or fraud-control scrutiny leave the operating backdrop fragile.
    - Reported valuation marks and IPO targets remain hard to reconcile to fully transparent financial disclosure.
  unresolvedGaps:
    - >-
      Audited standalone OPay financial statements with revenue mix, gross margin, EBIT, cash flow, and balance-sheet
      detail.
    - >-
      Clean, reconciled definitions for users, DAUs, MAUs, merchants, agents, and monthly transaction volume across
      Nigeria versus worldwide scope.
    - A reliable current country-footprint disclosure and a quantified non-Nigeria revenue contribution.
    - Loan-book economics, default rates, float income, and take-rate by product line.
    - IPO filing detail on governance, proceeds, and the basis for any valuation above Opera's shareholder mark.
