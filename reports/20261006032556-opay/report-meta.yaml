companyProfile:
  summary: >-
    OPay is a 2018-founded, Lagos-rooted payments and financial-services platform spanning consumer transfers, savings,
    debit cards, merchant acceptance, and adjacent credit and business tools. Independent reporting on company documents
    indicates FY2025 revenue of $536.25 million, FY2025 net profit of $72.47 million, and 39.3 million monthly active
    users, while the current valuation, capitalization structure, and audited standalone disclosure remain only
    partially visible.
