    title: "Disciplined Entry Demands Verifiable Disclosures"
    body: "Prospective investors should treat current secondary chatter and pre-IPO valuation targets of up to $4.0 billion with extreme skepticism until audited financials reconcile actual revenue, take-rates, and float income against Nigeria's macro realities [CV001, CV008, CV013]."
