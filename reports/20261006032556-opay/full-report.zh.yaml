            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 纪律化入场需要可核验披露
            body: >-
              在经审计财务报表将实际收入、费率和备付金利息收入与尼日利亚宏观现实核对一致之前，潜在投资者应对当前老股市场传闻和最高达 $4.0 billion 的 IPO 前估值目标保持极度怀疑 [CV001, CV008,
              CV013]。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV013
          - type: callout
            title: 宏观与监管摩擦威胁估值倍数
            body: 高度集中在尼日利亚，使 OPay 持续暴露于货币贬值风险和监管合规要求；这些要求可能突然阻碍客户开户或资本汇回 [CV006, CV012]。
            calloutType: risk
            claimRefs:
              - CV006
