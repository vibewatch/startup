        - 商户活跃率大幅放缓、代理商普遍流失，或市场份额大量流向 Moniepoint 或 PalmPay
      - - 投资逻辑
        - 获得全球机构资本，并有望通过美国股票上市取得市场认可
        - 过往得到 SoftBank 和 Sequoia 支持，且 Standard Bank 与华尔街承销团对 IPO 前融资表示兴趣
