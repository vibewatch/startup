  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 从运营层面的市场领先地位，到估值立场和最终投资建议的逻辑推演。
    data:
      nodes:
        - id: N1
          label: 市场存在感
          detail: 超过 1M 家企业商户，以及遍布尼日利亚的广泛代理银行通道
        - id: N2
          label: 资本基础
          detail: 融资 $570M，由 SoftBank Vision Fund 和 Sequoia 领投
        - id: N3
          label: 估值基准
          detail: $3.1B 私募老股交易账面估值，对比 $4.0B IPO 前目标
        - id: N4
          label: 风险画像
          detail: 尼日利亚货币敞口集中、监管审计反复，利润率未经验证
        - id: N5
          label: 治理状况
          detail: 依赖少数股东披露，缺乏经审计的独立监管文件
        - id: N6
          label: 决策立场
          detail: 估值评级偏高、风险画像较高，投资建议为观察
      edges:
        - from: N1
          to: N2
          label: 利用
        - from: N2
          to: N3
          label: 确立
        - from: N3
          to: N4
          label: 暴露于
        - from: N4
          to: N5
          label: 叠加
        - from: N5
          to: N6
          label: 决定
    approximationNotes: 流程图展示对财务、运营和估值输入的定性综合。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV008
      - CV013
