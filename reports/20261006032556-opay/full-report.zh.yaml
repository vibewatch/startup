              移动应用完成日常核心交易，包括点对点银行转账、公用事业账单结算、话费和流量充值、借记卡发放，以及由 OPay Microfinance Bank Limited 支持的 OWealth
              生息储蓄。面向微型、小型和中型企业（MSME），OPay Business 提供全渠道收款工具，包括商户 POS 终端、二维码受理和企业银行基础设施。第三大支柱是 OPay
              的全国代理银行网络：在传统商业银行网点稀少的半城市和农村社区，它为依赖现金的人群提供不可或缺的实体现金存取信任桥梁。尽管覆盖广泛，尼日利亚各地理政治区的详细地域收入分布和用户集中度仍属于公司未公开披露。
