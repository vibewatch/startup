              ARR，净利润不是可用现金，交易总额也不是收入。地域集中度较高：据报道，尽管公司在印度尼西亚、埃及和巴基斯坦运营，尼日利亚仍贡献了 FY2025 收入的 88.1%。拟议中的美国 IPO
              可能带来更多披露和流动性，但尼日利亚投资者已质疑离岸上市地点，使上市司法管辖区成为一个明确的利益相关方问题，而非已敲定的里程碑。
