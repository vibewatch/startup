    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Tracxn 将 OPay 认定为一家 2018 年成立、总部位于拉各斯的公司。公司当前面向消费者的产品涵盖账户充值、银行转账、账单支付、借记卡和 OWealth
              储蓄；其埃及网站还推广结账、销售点、账单支付和分期产品。另一个 OPay
              企业登录页面称其软件服务企业，进一步印证了双边模式：一侧是消费者金融账户和支付界面，另一侧是商户受理与运营工具。现有证据能证明产品覆盖面，但没有披露当前定价、产品级收入、费率或各地区背后的法律实体边界，因此不能从产品页面推断这些信息。
