        title: 规模、集中度与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              独立报道援引一份载有 OPay FY2024 和 FY2025 经审计合并数据的投资文件，描述了规模的明显跃升：FY2025 收入达到 $536.25 million，净利润达到 $72.47
