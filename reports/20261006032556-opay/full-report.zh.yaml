      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用由移动设备普及、更快国内交易的需求、部分社区银行网点有限以及商户对简化收款的需求推动。OPay
              的代理网络帮助连接现金和数字使用，产品级保障措施也能降低用户感知的交易风险。但信任是另一面：Nairametrics
              将转账失败、欺诈和未解决投诉列为生态持续存在的问题。网络稳定性、数字素养、监管合规、激烈竞争和尼日利亚市场集中度都可能拖慢采用或推高服务成本。估值不能只看企业和用户规模。只有核实留存、活跃度、交易组合、费率、欺诈损失、支持成本、代理商生产率和产品层面利润率，才能把市场增长转化为可持续收入或利润。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 不要把未经审计的 TAM 计入估值
            body: 来源集合展示了运营覆盖面，但没有证明支付总额、可获取份额、费率或市场收入。估值应采用经核对的自下而上模型；没有使用量和单位经济性证据，就不能把用户数或企业数转换为收入。
