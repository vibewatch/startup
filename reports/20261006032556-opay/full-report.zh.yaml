      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              OPay 服务不同的经济参与者。消费者用应用和卡片转账、缴费、购物和储蓄；商户及大型企业购买收款与对账能力；代理商则把依赖现金的社区接入数字支付通道。PayAtlas 将年轻数字用户和小企业主视为典型用户，而
              OPay
              自己的企业网站面向尼日利亚各地的企业经营者。因此，采用依赖两个相互连接的循环：消费者接受度带来商户效用，密集的商户和代理商受理又提升消费者的使用价值。不同细分市场的预算归属不同：个人承担费用或余额，企业主决定是否接受支付，财务或运营团队批准较大规模部署，代理商投入营运资金和运营精力。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM010
