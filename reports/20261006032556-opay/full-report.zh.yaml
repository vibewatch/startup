  - id: FI001
    title: 受证据约束的收入模型桥接图
    type: flow
    summary: |
      公开证据支持活动和产品层，但实际收入、成本和毛利仍属私有信息。
    data:
      nodes:
        - id: customer-activity
          label: 客户与商户活动
          detail: 转账、账单、银行卡、储蓄活动和企业收款
        - id: distribution
          label: 应用、代理商和网点分销
          detail: 数字触达，加上公司自述的企业、代理商和实体触达范围
        - id: monetizable-events
          label: 潜在可变现事件
          detail: 据报道存在交易费和增值服务；具体由谁承担费用尚不清楚
        - id: realized-revenue
          label: 实际净收入
          detail: 产品组合、费率、合作伙伴分成和收入确认政策均未披露
        - id: delivery-costs
          label: 处理和服务交付成本
          detail: 网络、支持、激励、欺诈和实体分销成本均未量化
        - id: gross-profit-cash
          label: 毛利与现金生成
          detail: 毛利率、经营现金流、烧钱速度和现金跑道均不可得
    approximationNotes: |
      这是定性的机制图，不是量化漏斗或预测；指定公开证据明确无法提供下游财务数值。
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI008
      - CI016
  - id: FE001
    title: 有公开证据的产品架构边界
    type: stack
    summary: 该架构将有文档记录的客户界面、商户接口、交易控制和保障证据分开呈现，但不声称这是 OPay 的内部实现。
    data:
      layers:
        - label: 客户界面
          detail: 直接呈现给消费者和企业的界面。
          items:
            - label: 消费者账户
              detail: 充值、转账、话费、流量和账单支付。
            - label: 借记卡
              detail: 通过应用或指定代理商申请，据称可在尼日利亚使用。
            - label: 企业支付
              detail: 全渠道、工业、代理商和在线销售解决方案。
        - label: 商户集成
          detail: 文档记录的在线收款选项。
          items:
            - label: OPay Cashier
              detail: 托管支付页面流程。
            - label: 服务器 API
              detail: 商户自有界面，支持回调和状态查询。
            - label: 电商插件
              detail: 面向常见电子商务框架的打包接入方式。
        - label: 产品风险控制
          detail: 公开描述的控制措施，不涉及内部实现细节。
          items:
            - label: 转账前警告
              detail: 据报道，转账模式出现异常时会发出警告。
            - label: 加强认证
              detail: 据报道，在敏感情形下会增加检查。
            - label: 行为监测
              detail: 据报道，会使用设备、登录和交易模式信号。
        - label: 账户保护入口
          detail: OPay 对外说明的用户恢复和支持渠道。
          items:
            - label: USSD 账户锁定
              detail: OPay 说明了设备丢失后锁定账户或银行卡的短代码。
            - label: 支持渠道
              detail: 公开列出了应用内、实体中心、社交媒体和电话支持。
        - label: 交易状态处理
          detail: 商户可见的状态和对账界面。
          items:
            - label: 状态回调
              detail: 交易状态变化时，商户端点会收到通知。
            - label: 状态查询
              detail: 商户可在需要时拉取交易状态。
        - label: 保障边界
          detail: 限制投资判断的证据和所有权边界。
          items:
            - label: OPay 安全声明
              detail: 加密、每日扫描、PCI DSS 合规和账户锁定。
            - label: 集成方自有验证
              detail: Guild 的重新验证控制不属于 OPay 的内部架构。
            - label: 未披露的内部细节
              detail: 账本、基础设施、容量、可用性和路线图仍属私有信息。
    approximationNotes: 仅为概念性的由外向内分组；位置不代表 OPay 的内部部署拓扑或处理顺序。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE014
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖发现、账户开通、日常支付交易、基于风险的摩擦缓解和商户业务扩张的端到端用户生命周期。
    data:
      items:
        - label: 发现与代理商开通
          stage: 发现
          touchpoint: Neighbourhood POS agent or mobile app store download
          actor: 无银行账户或银行服务不足的消费者
          action: Digital account opening with phone number and basic identity details
          sentiment: positive
          notes: 无需实体商业银行网点文件，即可即时获得数字化服务
        - label: 无摩擦的日常交易
          stage: 激活与采用
          touchpoint: OPay mobile consumer wallet interface
          actor: 已注册钱包的消费者
          action: Executing free transfers to Nigerian banks, purchasing airtime, paying utility bills
          sentiment: positive
          notes: 推动高频日活用户留存和基础余额存入
        - label: 主动防范欺诈与风险
          stage: 信任与安全
          touchpoint: In-app real-time fraud alert and step-up verification engine
          actor: 发起交易的消费者或账户持有人
          action: Dynamic biometric check on large transfers and automated prompt on unusual patterns
          sentiment: neutral
          notes: 防止资金被欺诈性转出，并避免事后争议处理带来的高昂成本
        - label: 客户支持与解决
          stage: 支持与协助
          touchpoint: In-app complaint centre, 24/7 telephone hotlines, and 30 physical branches
          actor: 遇到服务异常的消费者或商户
          action: Instant account locking via USSD codes (*955*131#) or dispute logging
          sentiment: positive
          notes: 部署多渠道支持架构，在高运营量下维持消费者信任
        - label: 企业与商户扩张
          stage: 商业增长
          touchpoint: OPay Business POS terminal and omnichannel payment portal
          actor: 零售商户或企业主
          action: Collecting multi-channel customer payments with instant settlement and working capital
          sentiment: positive
          notes: 加深商户锁定效应，并将生态变现拓展到消费者转账之外
        - label: 价值留存与资金沉淀
          stage: 生态留存
          touchpoint: OWealth savings module powered by OPay Microfinance Bank Limited
          actor: 零售储户或中小企业主
          action: Depositing liquid operating float to earn daily interest with unrestricted withdrawal access
          sentiment: positive
          notes: 促使资金留在 OPay 的闭环生态内
    approximationNotes: 各阶段对应结构化的用户和商户旅程路径，综合自 OPay 产品文档、安全架构和客户支持渠道。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
      - CU010
      - CU012
