  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业分层
        blocks:
          - type: paragraph
            body: >-
              尼日利亚数字金融服务生态存在多个竞争类别，争夺消费者钱包、代理银行通道和商户收款。OPay 的主要直接竞争者是尼日利亚 2023 年现金短缺后快速扩张的金融科技挑战者平台，最突出的是 Moniepoint 和
              PalmPay；传统银行则依靠网点网络和自有代理银行体系参与竞争。OPay 最初强调覆盖城市和农村地区的广泛代理网络及消费者账单支付，但竞争者已按重点领域分化。Moniepoint
              大力聚焦企业收单和正规商户服务；面向消费者的数字放贷机构和钱包平台则争夺日常支付流量及高收益储蓄存款。更广义的竞争边界还包括现金结算、传统商业银行 USSD
              和网点服务等现状替代方案；尽管速度较慢，它们仍拥有深厚的系统性信任。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
