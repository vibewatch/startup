  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 错误信息引发挤兑与存款脆弱性
        blocks:
          - type: paragraph
            body: >-
              OPay 已在尼日利亚覆盖估计 46 到 50 million
              用户和超过一百万家商户，逐渐成为日常商业的准公共基础设施。但这种庞大覆盖也带来严重的系统性脆弱性：病毒式错误信息在社交渠道快速传播，可能几乎即时引发存款提款恐慌。2026 年 8 月下旬至 9
              月上旬，一则伪造的停业通知在 WhatsApp 和 X 上广泛传播，声称 OPay 将无限期暂停所有交易和账户运营。由此激增的恐慌性提款类似数字银行挤兑，迫使包括 COO 和 CTO Dotun
              Adekunle、首席法务官 Akinfolabi Rokosu 在内的 OPay
              管理层立即举行公开说明会、投放应用内警示横幅，并将事件转交国家安全机构。数字钱包余额不像传统商业银行存款那样具有黏性，还能通过移动通道即时变现，因此恐慌传播速度构成传统资本储备无法完全隔离的生存级运营风险。
