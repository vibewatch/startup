      - number: '3.2'
        title: 定价结构与硬件权衡
        blocks:
          - type: paragraph
            body: >-
              在尼日利亚，定价和销售点终端购置成本是争夺代理商与商户的核心战场。OPay 采取低前期资本策略，入门级 Mini POS 终端售价 N8,500；Moniepoint 的基础 Mpos 售价为
              N15,500，Android POS 售价为 N22,500。相反，OPay 高端 Android 终端售价 N50,000，Traditional POS 售价 N35,000。对于低于 N20,000
              的代理商现金取款，OPay 和 Moniepoint 均收取 0.5% 的费用；超过 N20,000 后均转为固定 N100。转账方面，Moniepoint 每笔收取固定 N20，低于 OPay 对
              N10,000 及以上出账转账收取的 N50。这一费用差异会促使高频转账代理商同时使用多个平台，或把出账转账量转向 Moniepoint；小型运营商则更看重 OPay 较低的进入资本门槛。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
