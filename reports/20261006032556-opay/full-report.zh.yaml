      - number: '3.3'
        title: 差异化持久性、切换成本与平台风险
        blocks:
          - type: paragraph
            body: >-
              尼日利亚金融科技平台的切换成本在零售消费者和商业商户之间并不对称。商户忠诚度主要取决于交易完成率、争议即时冲正和费用透明度。行业数据称，2023 年 6 月 OPay 占尼日利亚 POS 代理网络的
              37%，Moniepoint 占 20%；但截至 2024 年 1 月，Moniepoint 已迅速扩张到覆盖全部 774 个地方政府区、超过 2.3 million
              台商用设备，显示商户正不断转向转账价格更低且支持即时冲正的平台。运营约束也会限制竞争者的锁定效应：Moniepoint 设定 N80,000 的日交易量门槛以防止终端被收回，并在合规审查期间通过 Post No
              Debit 指令限制账户。为抵御服务中断、守住用户留存，OPay 将 Night Guard、实时诈骗提醒和生物识别检查等算法安全工具嵌入产品流程，试图把品牌信任建立成核心护城河。
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 转账费劣势会促使用户同时使用多个平台
            body: >-
              OPay 对 N10,000 及以上出账转账收取 N50，相比 Moniepoint 固定 N20 的费用明显处于劣势。对每天处理数十笔转账的代理银行柜台而言，N30
              的差额会显著压缩利润，持续激励其通过竞争对手的通道处理高价值转账。
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: 硬件定价是一条分销漏斗
            body: >-
              OPay 将 Mini POS 定价为 N8,500，显著低于 Moniepoint N15,500
              的基础终端，因此能够吸引商户金字塔底层资本受限的个体经营者，先搭建入口，再把代理商转化为其消费者钱包、储蓄和账单支付服务的更广泛用户。
            calloutType: insight
            claimRefs:
