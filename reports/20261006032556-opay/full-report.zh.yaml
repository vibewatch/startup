  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：以实体现金为桥梁的尼日利亚资金流转
        blocks:
          - type: paragraph
            body: >-
              可辩护的市场边界应从尼日利亚日常资金流转切入，而不是覆盖整个非洲金融服务市场。OPay 官方消费者端涵盖账户充值、银行转账、账单支付、话费和流量、借记卡及
              OWealth；企业端则增加全渠道收款、定制支付方案、代理银行服务和线上销售支持。核心机会因此位于数字钱包、国内转账、商户收单和代理银行的交叉点。除非分别拿到产品范围和经济性的证据，信贷、保险、国际汇款和泛非银行
              TAM 都只能视为相邻市场。现金、银行网点、直接银行转账、银行卡、竞争性钱包及商户现金收款都是现实替代方案，因此不能把 OPay 的覆盖面等同于整个支付市场。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
