evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: A current complete executive, board, committee, and material leadership-change roster.
    whyItMatters: >-
      Without the full governance roster, key-person dependence, oversight quality, succession, and functional coverage
      cannot be assessed.
    diligencePath: >-
      Request the current organization chart, board and committee lists, executive biographies, departure history, and
      succession plan.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A current fully diluted cap table and defensible present valuation supported by a financing, secondary, or public
      filing.
    whyItMatters: The $4 billion figure is a proposed IPO target and cannot be treated as current enterprise or equity value.
    diligencePath: >-
      Obtain the latest cap table, preference stack, secondary transaction data, option pool, debt schedule, and any
      draft offering valuation analysis.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A current reconciled employee count by legal entity, function, and country.
    whyItMatters: >-
      Headcount is needed to assess operating leverage, geographic substance, leadership span, and personnel
      concentration.
    diligencePath: >-
      Request payroll and HRIS extracts reconciled to legal entities and compare them with current official workforce
      disclosures.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      A complete current investor and stakeholder map with ownership, preference, voting, board, debt, and
      secondary-sale terms.
    whyItMatters: Historical round participation does not reveal current control, economic seniority, dilution, or exit incentives.
    diligencePath: >-
      Review the cap table, shareholder register, financing documents, board minutes, debt agreements, and secondary
      transaction history.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A current, auditable Nigeria payments market denominator and OPay-specific transaction value, active users, active
      merchants, take rate, and geographic revenue mix.
    whyItMatters: >-
      Without common units and periods, operating scale cannot be translated into TAM, SAM, SOM, obtainable revenue, or
      valuation support.
    diligencePath: >-
      Obtain management cohort and transaction data, reconcile it to audited financials, and benchmark it against
      regulator or industry payment-flow statistics.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Reconciled definitions and vintages for registered users, active users, merchants, agents, transaction volume, and
      the denominator behind any market-share claim.
    whyItMatters: >-
      The available scale figures use incompatible populations and cannot establish penetration, retention, or reachable
      share.
    diligencePath: >-
      Request monthly cohort definitions and source calculations, then reconcile public claims to unique verified active
      accounts and transacting merchants.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Segment-level pricing, fee incidence, gross margin, fraud losses, support cost, agent economics, retention, and
      transaction frequency.
    whyItMatters: Market adoption does not demonstrate that OPay can monetize activity at durable margins.
    diligencePath: >-
      Review management accounts and data-room exports by product, customer segment, channel, and cohort, with audited
      tie-outs.
  - type: missing-source
    severity: material
    topic: merchant-churn-and-retention
    missingEvidence: >-
      Audited longitudinal cohort data on POS terminal churn, monthly active terminal ratios, and multi-homing rates
      between OPay and Moniepoint.
    whyItMatters: >-
      Without audited merchant retention metrics, it is difficult to determine whether OPay's terminal distribution
      translates into durable transaction share or idle hardware.
    diligencePath: Request confidential merchant retention cohorts and terminal active rates by vintage from company management.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >
      Audited entity and consolidated statements with revenue recognition, product mix, gross margin, operating profit,
      cash flow, and balance-sheet detail.
    whyItMatters: |
      Product breadth and third-party estimates cannot establish revenue quality, profitability, or cash conversion.
    diligencePath: >
      Obtain audited IFRS statements, management accounts, and reconciliations to regulated entities and any future SEC
      registration statement.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >
      Realized take rates, network and partner costs, fraud losses, incentives, CAC, retention, payback, and
      contribution margin by product and channel.
    whyItMatters: >
      Public pricing emphasizes free or customized terms and therefore does not show whether transaction growth creates
      durable gross profit.
    diligencePath: >
      Request product-level cohort P&Ls, merchant and agent contracts, pricing waterfalls, and monthly unit-economics
      dashboards.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >
      Current unrestricted cash, burn, runway, use of historical proceeds, debt, safeguarded customer funds, regulatory
      capital, settlement working capital, and next-round triggers.
    whyItMatters: >
      Funding raised, stake-based valuation marks, and reported IPO targets do not measure cash available to fund
      operations or absorb liquidity shocks.
    diligencePath: >
      Review the current cash roll-forward, treasury and debt schedules, regulatory returns, settlement accounts, board
      financing plan, and stress tests.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: internal-architecture
    missingEvidence: >-
      A current architecture pack covering ledger design, infrastructure providers, data residency, capacity limits,
      failover topology and disaster recovery.
    whyItMatters: >-
      Public interfaces do not establish whether the transaction platform can remain correct and available during
      infrastructure or banking-rail failures.
    diligencePath: >-
      Request an engineering architecture review, current data-flow diagram, recovery objectives and the latest
      disaster-recovery exercise results under NDA.
    relatedQuestionRefs:
      - QE003
      - QE005
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Independent uptime history, incident postmortems, transaction success rates, callback-delivery guarantees and
      merchant-facing service levels.
    whyItMatters: >-
      The retained pages describe interfaces but do not quantify reliability or show how failures affect consumers and
      merchants.
    diligencePath: >-
      Obtain 24 months of status and incident data, monthly availability, success rates by rail, support severity logs
      and contractual SLA performance.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current PCI attestation scope, penetration-test summary, material security incident history, privacy audit and
      fraud-control outcome metrics.
    whyItMatters: >-
      Company security statements and a positive press account do not independently verify control effectiveness or
      residual loss.
    diligencePath: >-
      Review current attestations, external test findings, incident register, fraud losses, false-positive rates and
      remediation evidence with security leadership.
    relatedQuestionRefs:
      - QE005
      - QE007
  - type: missing-source
    severity: minor
    topic: roadmap
    missingEvidence: A dated product roadmap, public changelog, supported API-version schedule and deprecation policy.
    whyItMatters: >-
      Without lifecycle evidence, investors cannot assess release cadence, integration maintenance burden or whether
      listed capabilities are strategic priorities.
    diligencePath: >-
      Request the 12-to-24-month product roadmap and API governance policy, then reconcile milestones against release
      and adoption data.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn
    missingEvidence: Audited cohort retention schedules, monthly active user (MAU) ratios, and merchant churn rates by product line.
    whyItMatters: >-
      Without cohort retention and churn data, investors cannot verify the long-term durability and organic lifetime
      value of OPay's customer base.
    diligencePath: >-
      Request audited customer cohort schedules, monthly active user breakdowns, and merchant terminal activity reports
      from OPay management during virtual data room review.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-case-studies
    missingEvidence: >-
      Detailed case studies of named corporate and enterprise merchants with transaction volumes, contract duration, and
      processing fee terms.
    whyItMatters: >-
      Public testimonials are currently concentrated in micro-merchants and individual consumers, obscuring enterprise
      tier penetration.
    diligencePath: Obtain enterprise customer references and verify commercial processing agreements for top corporate billers.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: loan-book-loss-rates
    missingEvidence: >-
      Audited standalone disclosure of credit default rates, non-performing loan ratios, and float yield for OWealth and
      associated lending products.
    whyItMatters: >-
      Without segmented credit performance, financial risk from credit expansion and micro-lending defaults cannot be
      independently verified.
    diligencePath: >-
      Obtain audited financial statements for OPay Microfinance Bank Limited and regulatory prudential filings submitted
      to the Central Bank of Nigeria.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited standalone financial statements providing revenue breakdown, net take-rates, operating margins, and cash
      flow.
    whyItMatters: >-
      Current valuation multiples of $3.1B to $4.0B cannot be rigorously benchmarked against peer fintech multiples
      without verified revenue.
    diligencePath: Review S-1 or F-1 registration statement disclosures filed with the US SEC prior to public listing.
    relatedQuestionRefs:
      - QV006
  - type: private-evidence-only
    severity: material
    topic: pre-ipo-cap-table
    missingEvidence: >-
      Full capitalization table disclosing liquidation preference tiers, option pools, and secondary transaction share
      transfers.
    whyItMatters: Preference overhang could dilute common shareholders or affect returns in a sub-$4.0B exit scenario.
    diligencePath: >-
      Request confidential cap table disclosures and shareholder agreements from management during underwriting
      diligence.
    relatedQuestionRefs:
      - QV001
