    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Core Use Case
      - Scale Indicator
      - Revenue / Strategic Value
      - Diligence Gap
    rows:
      - - Mass-Market Retail Consumers
        - Individual smartphone and feature phone users across urban and rural Nigeria
        - Free peer-to-peer transfers, airtime/data purchases, bill payments, OWealth savings
        - Tens of millions of active users nationwide
        - Drives high-frequency transaction velocity, float balances, and user stickiness
        - Undisclosed active user ratios (DAU/MAU) and average balance per user account
      - - Offline MSMEs and Retail Traders
        - Small business owners, retail shopkeepers, market vendors, hospitality merchants
        - Over-the-counter payments collection, POS card processing, instant business settlements
        - Over 1,000,000 registered businesses across Nigeria
        - Generates merchant POS terminal sales, rental fees, and payment processing take-rates
        - Private merchant churn rates, terminal activity rates, and transaction volume per merchant
      - - Agency Banking Operators
        - Neighbourhood retail kiosk owners, licensed mobile money human ATM agents
        - Cash-in/cash-out (CICO) conversions, bill collection on behalf of unbanked citizens
        - Nationwide network spanning all 36 Nigerian states and FCT
        - Serves as primary physical cash-to-digital bridge expanding ecosystem reach
        - Lack of audited agent network count, agent retention, and liquidity financing terms
      - - Digital Enterprises and Billers
        - Corporate merchants, utility providers, educational and telecommunication billers
        - Omnichannel payment gateway integration, bulk disbursement, automated reconciliation
        - Multi-industry billing integration across Nigeria
        - Yields steady corporate processing fees and institutional payment flow integration
        - Enterprise contract lengths, customer concentration, and tier-one corporate logos unverified
    notes: Segment classification compiled from official OPay and OPay Business platform specifications and independent 2026 fintech industry analyses; scale indicators reflect latest available 2026 disclosures.
