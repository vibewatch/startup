figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: End-to-end user lifecycle across discovery, account onboarding, daily payment transactions, risk-based friction mitigation, and merchant business expansion.
    data:
      items:
        - label: Discovery & Agent Onboarding
          stage: Discovery
          touchpoint: Neighbourhood POS agent or mobile app store download
          actor: Unbanked or underbanked consumer
          action: Digital account opening with phone number and basic identity details
          sentiment: positive
          notes: Enables instant digital access without requiring physical commercial bank branch documentation
        - label: Frictionless Everyday Transacting
          stage: Activation & Adoption
          touchpoint: OPay mobile consumer wallet interface
          actor: Registered wallet consumer
          action: Executing free transfers to Nigerian banks, purchasing airtime, paying utility bills
          sentiment: positive
          notes: Drives high-frequency daily user retention and foundational balance deposits
        - label: Preemptive Fraud & Risk Mitigation
          stage: Trust & Security
          touchpoint: In-app real-time fraud alert and step-up verification engine
          actor: Transacting consumer or account holder
          action: Dynamic biometric check on large transfers and automated prompt on unusual patterns
          sentiment: neutral
          notes: Prevents fraudulent fund outflow and eliminates costly post-incident dispute resolution
        - label: Customer Support & Resolution
          stage: Support & Assistance
          touchpoint: In-app complaint centre, 24/7 telephone hotlines, and 30 physical branches
          actor: Consumer or merchant encountering service exceptions
          action: Instant account locking via USSD codes (*955*131#) or dispute logging
          sentiment: positive
          notes: Multi-channel support architecture deployed to sustain consumer trust at high operational volume
        - label: Business & Merchant Expansion
          stage: Commercial Growth
          touchpoint: OPay Business POS terminal and omnichannel payment portal
          actor: Retail merchant or enterprise business owner
          action: Collecting multi-channel customer payments with instant settlement and working capital
          sentiment: positive
          notes: Deepens merchant lock-in and diversifies ecosystem monetization beyond consumer transfers
        - label: Value Retention & Float Deepening
          stage: Ecosystem Retention
          touchpoint: OWealth savings module powered by OPay Microfinance Bank Limited
          actor: Retail saver or SME owner
          action: Depositing liquid operating float to earn daily interest with unrestricted withdrawal access
          sentiment: positive
          notes: Encourages capital stickiness within the OPay closed-loop ecosystem
    approximationNotes: Stages map structured user and merchant journey paths synthesized from OPay product documentation, security architectures, and customer support channels.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
      - CU010
      - CU012
callouts:
  - calloutType: strength
    title: Product-Led Customer Service and Fraud Prevention
    body: >-
      OPay's operational differentiation in customer management stems from integrating security and dispute handling natively into its technology architecture. By triggering real-time fraud warnings prior to transaction completion and applying dynamic biometric verification on elevated-risk transfers, the platform intercepts errors and scams before funds leave accounts. This proactive design substantially mitigates call-centre overload and solidifies user trust across an operating volume of millions of daily transactions.
    claimRefs:
      - CU003
      - CU007
      - CU009
  - calloutType: risk
    title: Lack of Audited Cohort Retention and Disclosure
    body: >-
      While top-line scale figures—such as over 1,000,000 registered businesses, tens of millions of consumer users, and $12 billion in monthly transaction volume—are supported by company statements and corporate investor filings, OPay discloses no audited cohort retention, net revenue retention (NRR), or customer acquisition cost (CAC) metrics. Diligence cannot confirm the proportion of dormant wallets or POS terminals versus active, profitable accounts.
    claimRefs:
      - CU002
      - CU004
      - CU005
      - CU014
