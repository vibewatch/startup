schemaVersion: "report-v2"
artifact: financials
slug: opay
runDate: "2026-10-06"
company:
  name: OPay
chapter:
  number: 4
  title: Financials
  summary: >
    OPay exposes a broad payments and financial-services surface and claims more than one million
    Nigerian business users, but public pricing is mostly promotional and realized take rates,
    margins, cash, burn, and runway remain undisclosed. Third-party revenue and valuation figures
    are estimates or secondary reports, so they are scale signals rather than underwriting-grade
    financials.
sections:
  - id: revenue-model-and-public-pricing
    title: Revenue Model and Public Pricing
    body: >
      OPay's public surfaces show consumer transfers, bill payments, debit cards, OWealth, and
      business payment collection. A low-reputation research page attributes revenue primarily to
      transaction fees and value-added services, but OPay does not publish a revenue mix or
      recognition policy in the assigned evidence. Public consumer terms emphasize free bank
      transfers subject to limits, bill payment at no extra charge, and zero maintenance fees for
      active cards. Those terms may support acquisition and engagement, yet they do not disclose
      realized pricing, partner economics, or whether merchant, interchange, biller, or interest
      income ultimately carries the model. The revenue architecture is therefore plausible but not
      quantitatively underwritten.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: distribution-and-cost-to-serve
    title: Distribution and Cost-to-Serve Proxies
    body: >
      OPay Business markets omnichannel collection, customized industrial payment solutions,
      banking and bill-payment access through an agent network, and online sales tools. It also
      claims more than one million businesses in Nigeria and thirty physical branches nationwide.
      These are meaningful distribution signals, not revenue or retention measures. The consumer
      site additionally advertises round-the-clock service channels and daily security scanning.
      Together, the branch, agent, support, and control footprint indicates material service
      delivery obligations, but the evidence does not quantify terminal subsidies, agent
      commissions, processing costs, fraud losses, support expense, capex, or working-capital
      requirements. CAC, payback, contribution margin, and channel economics remain private.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
  - id: traction-financing-and-ipo-signals
    title: Traction, Financing, and IPO Signals
    body: >
      Public scale indicators require careful labeling. GetLatka estimates 2025 annual revenue at
      $373 million; this is neither audited revenue nor ARR and the page does not record its
      underlying source. Tracxn reports $570 million raised across three rounds, including a $400
      million Series C in August 2021 at a $2 billion post-money valuation. Historical funding is
      not current cash. Separately, media reports say OPay engaged Citigroup, Deutsche Bank, and
      JPMorgan for a possible US IPO targeting about $4 billion, while also stating that no formal
      SEC filing had been disclosed and terms remained conditional. A secondary account of an
      Opera stake mark implies $3.1 billion, which is a valuation signal rather than financing.
    claimRefs:
      - CI006
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
  - id: financial-verdict-and-diligence-blockers
    title: Financial Verdict and Diligence Blockers
    body: >
      Revenue quality cannot be scored confidently from the assigned public evidence. The product
      breadth and business reach support a credible volume-led payments model, but there is no
      audited bridge from activity to net revenue, gross profit, operating cash flow, or free cash
      flow. Capital adequacy is likewise unresolved because cumulative funding and private-company
      valuation marks reveal neither cash on hand nor burn, runway, debt, restricted deposits, or
      regulatory capital. Techpoint also documented that a false viral post prompted some users to
      withdraw funds, illustrating how trust shocks can create operational and liquidity-management
      pressure without proving a solvency problem. The investment case requires audited statements,
      cohort economics, product-level take rates, and a current capital schedule before
      underwriting profitability or IPO readiness.
    claimRefs:
      - CI006
      - CI009
      - CI010
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
tables:
  - id: TI001
    title: Revenue Streams and Evidence Quality
    columns:
      - Stream
      - Publicly Described Mechanism
      - Revenue Unit
      - Current Public Status
      - Evidence Quality
      - Diligence Ask
    rows:
      - - Consumer transfers
        - Bank-to-bank transfer activity through the OPay app
        - Not disclosed
        - Free offer subject to limits and restrictions
        - Official product evidence; monetization unverified
        - Realized fee schedule, transfer volume, switch cost, and contribution margin
      - - Bill, airtime, and data payments
        - Consumer payment and value-added service activity
        - Not disclosed
        - Bills advertised at no extra charge to the user
        - Product availability verified; partner economics unverified
        - Biller or telco commission schedule, rebates, volume, and revenue recognition
      - - Debit cards
        - Card use across ATM, POS, and online channels
        - Not disclosed
        - Zero maintenance fee for active cards
        - Official terms; interchange and issuance economics absent
        - Interchange yield, issuance cost, activity threshold, and fraud loss rate
      - - OWealth
        - Interest-bearing funds product operated through OPay Microfinance Bank
        - Not disclosed
        - Daily interest and access to funds are advertised
        - Official product evidence; spread and balance data absent
        - Average balances, asset yield, customer rate, liquidity reserve, and net interest margin
      - - Business payment acceptance
        - Omnichannel and customized payment collection for businesses
        - Not disclosed
        - Marketed to more than one million Nigerian businesses
        - Company-claimed reach; active and paying counts absent
        - Merchant volume, active merchants, blended take rate, churn, and concentration
      - - Agent and branch distribution
        - Banking and bill-payment access through agents and physical service locations
        - Not disclosed
        - Nationwide agent proposition and thirty claimed branches
        - Distribution footprint verified only at company-claim level
        - Agent productivity, commissions, terminal economics, branch cost, and payback
    notes: >
      Public sources describe products and promotional terms, not realized pricing or revenue mix;
      "not disclosed" means the assigned evidence provides no underwriting-grade value.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
  - id: TI002
    title: Public Pricing and Monetization Boundaries
    columns:
      - Product
      - Public Term
      - List vs. Realized Pricing
      - Discounts or Unknowns
      - Source Basis
    rows:
      - - Interbank transfers
        - Free transfers to other Nigerian bank accounts
        - Public promotional term only
        - Limits and restrictions apply; realized fees are not stated
        - OPay consumer site
      - - Bill payments
        - Bills advertised at no extra charge
        - Customer-facing term only
        - Partner commissions and processing costs are not stated
        - OPay consumer site
      - - Active debit cards
        - Zero card maintenance fees
        - Public active-card term only
        - Activity definition, issuance cost, and other card fees are not stated
        - OPay consumer site
      - - Business payments
        - Customized and omnichannel solutions
        - No public price or contract term
        - Merchant discounts, minimums, hardware terms, and take rate are unknown
        - OPay Business site
      - - OWealth
        - Daily interest with access to funds
        - Customer rate and retained spread are not published
        - Balance tiers, funding costs, and realized net interest margin are unknown
        - OPay consumer site
    notes: >
      This table records only terms visible in the assigned official pages; it does not infer
      merchant pricing, fee incidence, discounts, or realized unit economics.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
  - id: TI003
    title: Unit Economics and Capital Adequacy Scorecard
    columns:
      - Metric
      - Public Value
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - Annual revenue
        - "$373M for 2025, explicitly estimated by GetLatka"
        - Low
        - Indicates possible scale but is neither audited nor ARR
        - Audited annual revenue by product, entity, geography, and recognition basis
      - - Businesses served
        - "More than 1,000,000 across Nigeria, company-claimed"
        - Medium
        - Signals distribution reach but not active, paying, or retained merchants
        - Monthly active and transacting merchants, cohort retention, and concentration
      - - Total funding raised
        - "$570M across three rounds, reported by Tracxn"
        - Medium
        - Shows historical financing capacity, not current liquidity
        - Cap table, cash roll-forward, use of proceeds, and remaining unrestricted cash
      - - Series C
        - "$400M in August 2021 at a $2B post-money valuation"
        - Medium
        - Anchors historical financing terms
        - Final financing documents, liquidation preferences, and secondary components
      - - Opera stake-implied valuation
        - "$3.1B from a secondary account of a 2026 stake mark"
        - Low
        - Provides a valuation reference, not cash or a priced round
        - Original filing, valuation methodology, ownership denominator, and transaction basis
      - - Reported IPO target
        - "Approximately $4B; no formal SEC filing disclosed by the reporting date"
        - Low
        - Indicates capital-markets intent but not executable proceeds
        - Filed registration statement, offering size, primary proceeds, and use of funds
      - - Gross margin and processing cost
        - null
        - Unavailable
        - Determines whether payment volume converts into durable gross profit
        - Product-level net revenue, network fees, fraud losses, incentives, and gross margin
      - - CAC and payback
        - null
        - Unavailable
        - Tests whether app, agent, branch, and merchant growth is capital efficient
        - Fully loaded CAC and payback by consumer, merchant, and agent cohort
      - - Cash, burn, and runway
        - null
        - Unavailable
        - Required to assess capital adequacy and financing dependency
        - Current unrestricted cash, monthly operating cash burn, runway, and board plan
      - - Debt, deposits, and working capital
        - null
        - Unavailable
        - Separates operating liquidity from customer or regulated balances
        - Debt schedule, regulatory capital, safeguarded funds, settlement timing, and covenants
    notes: >
      Values are company claims or third-party reports as labeled. Null means the assigned public
      evidence did not disclose the metric; funding raised and valuation are not treated as cash.
    claimRefs:
      - CI006
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI016
figures:
  - id: FI001
    title: Evidence-Bounded Revenue Model Bridge
    type: flow
    summary: >
      Public evidence supports the activity and product layers, while realized revenue, costs, and
      gross profit remain private.
    data:
      nodes:
        - id: customer-activity
          label: Customer and merchant activity
          detail: Transfers, bills, cards, savings activity, and business payment collection
        - id: distribution
          label: App, agent, and branch distribution
          detail: Digital access plus company-claimed business, agent, and physical reach
        - id: monetizable-events
          label: Potential monetizable events
          detail: Transaction fees and value-added services are reported; exact fee incidence is unknown
        - id: realized-revenue
          label: Realized net revenue
          detail: Product mix, take rates, partner shares, and recognition policy are not disclosed
        - id: delivery-costs
          label: Processing and service-delivery costs
          detail: Network, support, incentives, fraud, and physical-distribution costs are not quantified
        - id: gross-profit-cash
          label: Gross profit and cash generation
          detail: Gross margin, operating cash flow, burn, and runway are unavailable
    approximationNotes: >
      This is a qualitative mechanism map, not a quantified funnel or forecast; downstream
      financial values are explicitly unavailable in the assigned public evidence.
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI006
      - CI008
      - CI016
callouts:
  - calloutType: risk
    title: Scale Signals Are Not Unit Economics
    body: >
      More than one million company-claimed businesses and a third-party revenue estimate indicate
      possible scale, but neither discloses active-paying denominators, take rate, gross margin, CAC,
      retention, or cash conversion.
    claimRefs:
      - CI006
      - CI009
      - CI016
  - calloutType: recommendation
    title: Make Audited Cash Conversion the Financing Gate
    body: >
      Do not treat $570 million of historical funding, private-company valuation marks, or a
      reported IPO target as cash available. Require an audited cash roll-forward, restricted-funds
      schedule, burn, runway, and debt or regulatory-capital obligations.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
      - CI016
