callouts:
  - calloutType: "risk"
    title: "Transfer Fee Disadvantage Encourages Multi-Homing"
    body: "OPay's N50 fee for outbound transfers of N10,000 or more places it at a distinct disadvantage compared to Moniepoint's flat N20 fee. For agent banking desks processing dozens of daily transfers, this N30 gap drives significant margin compression, creating persistent incentives to route high-value transfer flows through rival rails."
    claimRefs:
      - "CP009"
      - "CP010"
  - calloutType: "insight"
    title: "Hardware Pricing as a Distribution Funnel"
    body: "By pricing its Mini POS at N8,500—significantly lower than Moniepoint's N15,500 base terminal—OPay captures capital-constrained sole proprietors at the bottom of the merchant pyramid, creating an initial on-ramp that converts agents into broader users of its consumer wallet, savings, and bill payment services."
    claimRefs:
      - "CP007"
      - "CP008"
      - "CP016"
