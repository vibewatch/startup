chapter:
  number: 5
  title: "Product & Technology"
  summary: "OPay's public product surface spans consumer payments, cards and savings, merchant payment collection, hosted checkout, server APIs, and e-commerce plugins. Public evidence also describes pre-transfer risk controls, but it does not expose OPay's internal ledger design, uptime record, performance benchmarks, or current roadmap, so technical maturity remains only partially independently verified."
sections:
  - id: "product-surface"
    title: "Product surface and customer workflows"
    body: >-
      OPay presents a broad customer workflow rather than a single payment feature. Its
      consumer page covers account funding, bank transfers, bill payment, debit cards and
      OWealth, while the business page groups merchant needs into omnichannel collection,
      customized industrial payments, agent-enabled banking and bill payment, and online
      sales support. The business site also claims more than one million businesses across
      Nigeria, which is useful evidence of intended scale but is not an independently
      audited active-merchant count. For digital merchants, the checkout documentation
      separates a hosted OPay Cashier flow from server APIs and pre-built commerce
      plugins. This creates a coherent progression from turnkey checkout to merchant-owned
      user interfaces, but the public materials do not disclose usage by module, payment
      success rates, realized settlement times, or the share of merchants using each
      integration mode.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE001"
      - "TE002"
  - id: "integration-architecture"
    title: "Externally visible architecture and integration model"
    body: >-
      The verifiable architecture is an external boundary, not a view of OPay's internal
      stack. Merchants can redirect customers to a hosted cashier, build their own checkout
      interface against server APIs, or use a packaged plugin; the server API documentation
      says transaction-status changes can be delivered through callbacks and queried on
      demand. A practitioner integration published by Guild adds useful developer signal:
      Guild says its own wrapper re-verifies a payment against OPay's authoritative endpoint
      before crediting funds. That control demonstrates how one integrator contains webhook
      risk, but it must not be attributed to OPay's internal platform. The assigned official
      documentation root rendered only the title “Docs” in the prefetched artifact, limiting
      verification of authentication, versioning, error semantics, sandbox behavior and API
      lifecycle. The resulting map therefore shows only public interfaces and documented
      control points, with no invented databases, clouds, throughput figures or clearing
      topology.
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "trust-and-diligence"
    title: "Trust controls, differentiation and diligence gaps"
    body: >-
      TechCabal reports that OPay uses pre-transfer fraud warnings, step-up authentication
      for sensitive situations and background monitoring of device, login and transaction
      patterns. These controls suggest that product design is being used to prevent support
      incidents, a potentially meaningful operating advantage at consumer-payment scale.
      OPay's own page separately claims encrypted data storage, daily threat scanning, PCI
      DSS compliance, encrypted transactions and USSD shortcuts for locking an account or
      card. Those are company assertions rather than substitutes for a current certificate,
      penetration-test summary, incident history, service-level record or regulator audit.
      Evidence hygiene is also material: one allocated OPAY integration page identifies a
      Vilnius address and is treated as a different namesake provider, not evidence for the
      Nigerian platform. Investment diligence should therefore test OPay's internal controls,
      reliability and roadmap directly rather than infer them from marketing or third-party
      client architecture.
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE016"
