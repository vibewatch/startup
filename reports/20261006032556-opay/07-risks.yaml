callouts:
  - calloutType: "risk"
    title: "Digital Bank Runs as a Novel Systemic Vulnerability"
    body: "The August-September 2026 withdrawal panic demonstrated that for digital wallets serving tens of millions of retail users, misinformation operates with catastrophic velocity. Traditional branch-based banks benefit from physical withdrawal bottlenecks and institutional inertia; digital banking users, however, can evacuate balances in seconds via mobile apps. Investors must evaluate OPay's crisis management and liquidity buffers not merely against credit or market risk, but against social media-driven panic runs."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
