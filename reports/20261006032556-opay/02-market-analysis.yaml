callouts:
  - calloutType: "risk"
    title: "Do not capitalize an unaudited TAM"
    body: >-
      The source set shows operating breadth, but it does not establish total payment value,
      obtainable share, take rate, or market revenue. Valuation work should use a reconciled
      bottom-up model rather than convert user or business counts into revenue without usage
      and unit-economics evidence.
    claimRefs:
      - "CM003"
      - "CM016"
