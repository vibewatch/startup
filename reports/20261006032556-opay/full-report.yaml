    sections:
      - number: '6.1'
        title: Customer Segmentation and Payer Architecture
        blocks:
          - type: paragraph
            body: >-
              OPay's customer architecture is segmented into three primary pillars across Nigeria's retail financial
              landscape: mass-market consumer digital banking users, offline and online commercial merchants, and
              neighbourhood agency banking operators. At the consumer tier, tens of millions of registered users utilize
              the OPay mobile application for core day-to-day transactions including peer-to-peer bank transfers,
              utility bill settlements, airtime and data top-ups, debit card issuance, and interest-bearing savings via
              OWealth powered by OPay Microfinance Bank Limited. For micro, small, and medium enterprises (MSMEs), OPay
              Business provides omnichannel collection tools including merchant POS terminals, QR code acceptance, and
              business banking infrastructure. The third pillar comprises OPay's nationwide agent banking network, which
              functions as an indispensable physical cash-in and cash-out trust bridge for cash-reliant populations
              across semi-urban and rural communities where traditional commercial bank branches are scarce. Despite
              this extensive reach, detailed geographical revenue distribution and user concentration across Nigerian
              geopolitical zones remain private company disclosures.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU008
              - CU010
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU008
              - CU010
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs:
