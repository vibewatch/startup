      - number: '4.2'
        title: Distribution and Cost-to-Serve Proxies
        blocks:
          - type: paragraph
            body: >
              OPay Business markets omnichannel collection, customized industrial payment solutions, banking and
              bill-payment access through an agent network, and online sales tools. It also claims more than one million
              businesses in Nigeria and thirty physical branches nationwide. These are meaningful distribution signals,
              not revenue or retention measures. The consumer site additionally advertises round-the-clock service
              channels and daily security scanning. Together, the branch, agent, support, and control footprint
              indicates material service delivery obligations, but the evidence does not quantify terminal subsidies,
              agent commissions, processing costs, fraud losses, support expense, capex, or working-capital
              requirements. CAC, payback, contribution margin, and channel economics remain private.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Traction, Financing, and IPO Signals
        blocks:
          - type: paragraph
            body: >
              Public scale indicators require careful labeling. GetLatka estimates 2025 annual revenue at $373 million;
              this is neither audited revenue nor ARR and the page does not record its underlying source. Tracxn reports
              $570 million raised across three rounds, including a $400 million Series C in August 2021 at a $2 billion
              post-money valuation. Historical funding is not current cash. Separately, media reports say OPay engaged
              Citigroup, Deutsche Bank, and JPMorgan for a possible US IPO targeting about $4 billion, while also
              stating that no formal SEC filing had been disclosed and terms remained conditional. A secondary account
              of an Opera stake mark implies $3.1 billion, which is a valuation signal rather than financing.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Revenue quality cannot be scored confidently from the assigned public evidence. The product breadth and
              business reach support a credible volume-led payments model, but there is no audited bridge from activity
              to net revenue, gross profit, operating cash flow, or free cash flow. Capital adequacy is likewise
              unresolved because cumulative funding and private-company valuation marks reveal neither cash on hand nor
              burn, runway, debt, restricted deposits, or regulatory capital. Techpoint also documented that a false
              viral post prompted some users to withdraw funds, illustrating how trust shocks can create operational and
              liquidity-management pressure without proving a solvency problem. The investment case requires audited
              statements, cohort economics, product-level take rates, and a current capital schedule before underwriting
              profitability or IPO readiness.
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale Signals Are Not Unit Economics
            body: >
              More than one million company-claimed businesses and a third-party revenue estimate indicate possible
              scale, but neither discloses active-paying denominators, take rate, gross margin, CAC, retention, or cash
              conversion.
            calloutType: risk
            claimRefs:
              - CI006
              - CI009
              - CI016
          - type: callout
            title: Make Audited Cash Conversion the Financing Gate
            body: >
              Do not treat $570 million of historical funding, private-company valuation marks, or a reported IPO target
              as cash available. Require an audited cash roll-forward, restricted-funds schedule, burn, runway, and debt
              or regulatory-capital obligations.
            calloutType: recommendation
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              OPay presents a broad customer workflow rather than a single payment feature. Its consumer page covers
              account funding, bank transfers, bill payment, debit cards and OWealth, while the business page groups
              merchant needs into omnichannel collection, customized industrial payments, agent-enabled banking and bill
              payment, and online sales support. The business site also claims more than one million businesses across
              Nigeria, which is useful evidence of intended scale but is not an independently audited active-merchant
              count. For digital merchants, the checkout documentation separates a hosted OPay Cashier flow from server
              APIs and pre-built commerce plugins. This creates a coherent progression from turnkey checkout to
              merchant-owned user interfaces, but the public materials do not disclose usage by module, payment success
              rates, realized settlement times, or the share of merchants using each integration mode.
            claimRefs:
