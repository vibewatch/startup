  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Nigerian money movement with a physical cash bridge'
        blocks:
          - type: paragraph
            body: >-
              The defensible market boundary starts with everyday Nigerian money movement rather than all African
              financial services. OPay's official consumer surface includes account funding, bank transfers, bill
              payment, airtime and data, debit cards, and OWealth, while its business surface adds omnichannel
              collection, customized payment solutions, agent banking, and online sales support. This places the core
              opportunity at the intersection of digital wallets, domestic transfers, merchant acquiring, and agency
              banking. Credit, insurance, international remittance, and a pan-African banking TAM remain adjacencies
              unless product scope and economics are separately evidenced. Cash, bank branches, direct bank transfers,
              cards, competing wallets, and merchant cash collection are the practical substitutes; they prevent OPay's
              footprint from being equated with the whole payments market.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM006
      - number: '2.2'
        title: 'Sizing: operating scale is visible, market value is not'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports scale indicators but not an investment-grade TAM, SAM, or SOM. OPay claims
              more than one million Nigerian businesses on its business platform. Two lower-reputation market pages
              offer broader user or share estimates, but their populations are not comparable: one discusses active
              users while the other discusses registered users and an estimated mobile-money share, without auditable
              methodology. Those figures cannot be converted into market value, revenue, or obtainable share.
              Accordingly, the sizing exhibit preserves each lens and its limitation rather than averaging them. A
              credible model would require current unique active consumers and merchants, transaction value by rail,
              take rate, addressable payment flows, and geographic revenue mix.
            claimRefs:
              - CM003
              - CM011
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
