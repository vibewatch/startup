  - id: FE001
    title: Publicly evidenced product architecture boundary
    type: stack
    summary: >-
      The stack separates documented customer surfaces, merchant interfaces, transaction controls and assurance evidence
      without asserting an internal OPay implementation.
    data:
      layers:
        - label: Customer surfaces
          detail: Interfaces presented directly to consumers and businesses.
          items:
            - label: Consumer account
              detail: Funding, transfers, airtime, data and bill payment.
            - label: Debit card
              detail: App or selected-agent application path with claimed Nigerian acceptance.
            - label: Business payments
              detail: Omnichannel, industrial, agent and online-sales solutions.
        - label: Merchant integration
          detail: Documented choices for accepting online payments.
          items:
            - label: OPay Cashier
              detail: Hosted payment-page flow.
            - label: Server APIs
              detail: Merchant-owned interface with callbacks and status queries.
            - label: Commerce plugins
              detail: Packaged route for common e-commerce frameworks.
        - label: Product risk controls
          detail: Controls described publicly, without internal implementation detail.
          items:
            - label: Pre-transfer warning
              detail: Reported warning when a transfer pattern appears unusual.
            - label: Step-up authentication
              detail: Reported additional checks in sensitive situations.
            - label: Behavior monitoring
              detail: Reported use of device, login and transaction-pattern signals.
        - label: Account-protection access
          detail: User-facing recovery and support paths stated by OPay.
          items:
            - label: USSD account lock
              detail: Shortcodes stated for locking an account or card after device loss.
            - label: Support channels
              detail: In-app, physical-center, social and telephone support are listed publicly.
        - label: Transaction-state handling
          detail: Merchant-visible state and reconciliation interfaces.
          items:
            - label: Status callback
              detail: Merchant endpoint receives a notification when transaction status changes.
            - label: Status query
              detail: Merchant can pull transaction status when needed.
        - label: Assurance boundary
          detail: Evidence and ownership boundaries that constrain underwriting.
          items:
            - label: OPay security claims
              detail: Encryption, daily scanning, PCI DSS compliance and account locking.
            - label: Integrator-owned verification
              detail: Guild's re-verification control is not OPay's internal architecture.
            - label: Undisclosed internals
              detail: Ledger, infrastructure, capacity, availability and roadmap remain private.
    approximationNotes: >-
      Conceptual outside-in grouping only; placement does not imply OPay's internal deployment topology or processing
      sequence.
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE014
      - CE015
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end user lifecycle across discovery, account onboarding, daily payment transactions, risk-based friction
      mitigation, and merchant business expansion.
    data:
      items:
        - label: Discovery & Agent Onboarding
          stage: Discovery
          touchpoint: Neighbourhood POS agent or mobile app store download
          actor: Unbanked or underbanked consumer
          action: Digital account opening with phone number and basic identity details
          sentiment: positive
          notes: Enables instant digital access without requiring physical commercial bank branch documentation
        - label: Frictionless Everyday Transacting
          stage: Activation & Adoption
          touchpoint: OPay mobile consumer wallet interface
          actor: Registered wallet consumer
          action: Executing free transfers to Nigerian banks, purchasing airtime, paying utility bills
          sentiment: positive
          notes: Drives high-frequency daily user retention and foundational balance deposits
        - label: Preemptive Fraud & Risk Mitigation
          stage: Trust & Security
          touchpoint: In-app real-time fraud alert and step-up verification engine
          actor: Transacting consumer or account holder
          action: Dynamic biometric check on large transfers and automated prompt on unusual patterns
          sentiment: neutral
          notes: Prevents fraudulent fund outflow and eliminates costly post-incident dispute resolution
        - label: Customer Support & Resolution
          stage: Support & Assistance
          touchpoint: In-app complaint centre, 24/7 telephone hotlines, and 30 physical branches
          actor: Consumer or merchant encountering service exceptions
          action: Instant account locking via USSD codes (*955*131#) or dispute logging
          sentiment: positive
          notes: Multi-channel support architecture deployed to sustain consumer trust at high operational volume
        - label: Business & Merchant Expansion
          stage: Commercial Growth
          touchpoint: OPay Business POS terminal and omnichannel payment portal
          actor: Retail merchant or enterprise business owner
          action: Collecting multi-channel customer payments with instant settlement and working capital
          sentiment: positive
          notes: Deepens merchant lock-in and diversifies ecosystem monetization beyond consumer transfers
        - label: Value Retention & Float Deepening
          stage: Ecosystem Retention
          touchpoint: OWealth savings module powered by OPay Microfinance Bank Limited
          actor: Retail saver or SME owner
          action: Depositing liquid operating float to earn daily interest with unrestricted withdrawal access
          sentiment: positive
          notes: Encourages capital stickiness within the OPay closed-loop ecosystem
    approximationNotes: >-
      Stages map structured user and merchant journey paths synthesized from OPay product documentation, security
      architectures, and customer support channels.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU007
      - CU008
      - CU010
      - CU012
