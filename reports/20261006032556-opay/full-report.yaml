            title: Public technical proof is interface-heavy
            body: >-
              The evidence shows products, integration choices and risk-control claims, but not the internal ledger,
              infrastructure, availability record, incident history or roadmap. Guild's defensive wrapper is useful
              developer signal, yet it proves the integrator's design rather than OPay's own controls.
