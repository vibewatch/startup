      - number: '5.3'
        title: Trust controls, differentiation and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              TechCabal reports that OPay uses pre-transfer fraud warnings, step-up authentication for sensitive
              situations and background monitoring of device, login and transaction patterns. These controls suggest
              that product design is being used to prevent support incidents, a potentially meaningful operating
              advantage at consumer-payment scale. OPay's own page separately claims encrypted data storage, daily
              threat scanning, PCI DSS compliance, encrypted transactions and USSD shortcuts for locking an account or
              card. Those are company assertions rather than substitutes for a current certificate, penetration-test
              summary, incident history, service-level record or regulator audit. Evidence hygiene is also material: one
              allocated OPAY integration page identifies a Vilnius address and is treated as a different namesake
              provider, not evidence for the Nigerian platform. Investment diligence should therefore test OPay's
              internal controls, reliability and roadmap directly rather than infer them from marketing or third-party
              client architecture.
            claimRefs:
