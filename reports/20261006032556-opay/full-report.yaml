        title: Capitalization and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $570 million raised across three rounds: a $50 million Series A in July 2019, a $120
              million Series B in November 2019, and a $400 million Series C in August 2021 led by SoftBank Vision Fund.
              Its round table also names strategic and venture investors including Meituan, Gaorong Capital, Source Code
              Capital, IDG Capital, Opera, HSG, and others. Separately, 2026 reporting says Citi, Deutsche Bank, and
              JPMorgan were involved in preparations for a potential US listing. These disclosures map important
              stakeholders but do not establish a current fully diluted valuation, ownership percentages, preference
              terms, secondary sales, debt, or available cash. The reported $4 billion IPO target is an aspiration, not
