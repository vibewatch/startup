          Inability to list in New York; down-round secondary pricing below August 2021 Series C mark ($2.0B
          post-money); regulatory penalties
        - Low-to-Moderate (20%)
        - >-
          Stringent central bank account restrictions, digital fraud scandals impacting consumer trust, or inability to
          remit foreign exchange
    notes: >-
      Valuation ranges reference August 2021 Series C ($2.0B), Opera December 2024 / 2026 filings ($2.7B-$3.1B), and
      reported pre-IPO target ($4.0B).
