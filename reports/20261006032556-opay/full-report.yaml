      - number: '1.4'
        title: Scale, Concentration, and IPO Path
        blocks:
          - type: paragraph
            body: >-
              Independent reports citing an investment document with OPay's FY2024 and FY2025 audited consolidated
              figures describe a sharp scale inflection: FY2025 revenue reached $536.25 million, net profit reached
              $72.47 million, gross transaction value reached $358 billion, and monthly active users reached 39.3
              million. The metrics are consolidated operating and accounting measures; revenue is not ARR, net profit is
              not cash available, and gross transaction value is not revenue. Geographic concentration is material:
              Nigeria reportedly generated 88.1% of FY2025 revenue despite operations in Indonesia, Egypt, and Pakistan.
              The proposed US IPO could add disclosure and liquidity, but Nigerian investors have questioned the
              offshore venue, making listing jurisdiction a visible stakeholder issue rather than a settled milestone.
