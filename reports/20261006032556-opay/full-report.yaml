        title: Externally visible architecture and integration model
        blocks:
          - type: paragraph
            body: >-
              The verifiable architecture is an external boundary, not a view of OPay's internal stack. Merchants can
              redirect customers to a hosted cashier, build their own checkout interface against server APIs, or use a
              packaged plugin; the server API documentation says transaction-status changes can be delivered through
              callbacks and queried on demand. A practitioner integration published by Guild adds useful developer
              signal: Guild says its own wrapper re-verifies a payment against OPay's authoritative endpoint before
              crediting funds. That control demonstrates how one integrator contains webhook risk, but it must not be
              attributed to OPay's internal platform. The assigned official documentation root rendered only the title
              “Docs” in the prefetched artifact, limiting verification of authentication, versioning, error semantics,
              sandbox behavior and API lifecycle. The resulting map therefore shows only public interfaces and
              documented control points, with no invented databases, clouds, throughput figures or clearing topology.
