              Publicly accessible evidence in the assigned pool provides only a narrow view of leadership. Tracxn names
              Yahui Zhou as OPay's founder, while Nairametrics identifies Elizabeth Wang as Chief Commercial Officer in
              reporting on the company's long-term expansion goals. Those two roles indicate founder-level strategic
              influence and a named commercial executive, but they are not a complete executive or governance roster. No
              assigned source supplies a current board list, committee structure, voting rights, succession plan, or
              verified leadership-change chronology. The resulting key-person and governance assessment is therefore
