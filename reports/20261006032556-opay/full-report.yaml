    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Tracxn identifies OPay as a Lagos-based company founded in 2018. The company's current consumer
              proposition combines account funding, bank transfers, bill payment, debit cards, and OWealth savings,
              while its Egypt site also markets checkout, point-of-sale, bill-payment, and installment products. A
              separate OPay business login says its software serves businesses, reinforcing a two-sided model: a
              consumer financial account and payment interface on one side, and merchant acceptance and operating tools
              on the other. The evidence establishes product breadth, but it does not disclose current pricing,
              product-level revenue, take rates, or the legal-entity boundaries behind each geography, so these should
              not be inferred from the product pages.
