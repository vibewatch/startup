company:
  name: "OPay"
chapter:
  number: 1
  title: "Company Overview"
  summary: "OPay is a 2018-founded, Lagos-based financial-services platform spanning consumer payments, savings, cards, merchant acceptance, and credit. Third-party reporting on a document containing FY2025 audited consolidated figures points to $536.25 million of revenue, $72.47 million of net profit, $358 billion of gross transaction value, and 39.3 million monthly active users, while current valuation, headcount, board composition, and full capitalization remain open diligence items."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      Tracxn identifies OPay as a Lagos-based company founded in 2018. The company's
      current consumer proposition combines account funding, bank transfers, bill
      payment, debit cards, and OWealth savings, while its Egypt site also markets
      checkout, point-of-sale, bill-payment, and installment products. A separate
      OPay business login says its software serves businesses, reinforcing a
      two-sided model: a consumer financial account and payment interface on one
      side, and merchant acceptance and operating tools on the other. The evidence
      establishes product breadth, but it does not disclose current pricing,
      product-level revenue, take rates, or the legal-entity boundaries behind each
      geography, so these should not be inferred from the product pages.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      Publicly accessible evidence in the assigned pool provides only a narrow view
      of leadership. Tracxn names Yahui Zhou as OPay's founder, while Nairametrics
      identifies Elizabeth Wang as Chief Commercial Officer in reporting on the
      company's long-term expansion goals. Those two roles indicate founder-level
      strategic influence and a named commercial executive, but they are not a
      complete executive or governance roster. No assigned source supplies a
      current board list, committee structure, voting rights, succession plan, or
      verified leadership-change chronology. The resulting key-person and
      governance assessment is therefore deliberately incomplete rather than
      extrapolated from earlier reports or unsourced biographies.
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholders"
    title: "Capitalization and Stakeholders"
    body: >-
      Tracxn reports $570 million raised across three rounds: a $50 million Series A
      in July 2019, a $120 million Series B in November 2019, and a $400 million
      Series C in August 2021 led by SoftBank Vision Fund. Its round table also names
      strategic and venture investors including Meituan, Gaorong Capital, Source
      Code Capital, IDG Capital, Opera, HSG, and others. Separately, 2026 reporting
      says Citi, Deutsche Bank, and JPMorgan were involved in preparations for a
      potential US listing. These disclosures map important stakeholders but do
      not establish a current fully diluted valuation, ownership percentages,
      preference terms, secondary sales, debt, or available cash. The reported
      $4 billion IPO target is an aspiration, not a current valuation observation.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "scale-concentration-and-ipo-path"
    title: "Scale, Concentration, and IPO Path"
    body: >-
      Independent reports citing an investment document with OPay's FY2024 and
      FY2025 audited consolidated figures describe a sharp scale inflection:
      FY2025 revenue reached $536.25 million, net profit reached $72.47 million,
      gross transaction value reached $358 billion, and monthly active users
      reached 39.3 million. The metrics are consolidated operating and accounting
      measures; revenue is not ARR, net profit is not cash available, and gross
      transaction value is not revenue. Geographic concentration is material:
      Nigeria reportedly generated 88.1% of FY2025 revenue despite operations in
      Indonesia, Egypt, and Pakistan. The proposed US IPO could add disclosure and
      liquidity, but Nigerian investors have questioned the offshore venue, making
      listing jurisdiction a visible stakeholder issue rather than a settled
      milestone.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
