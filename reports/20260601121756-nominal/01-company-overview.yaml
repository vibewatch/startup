  body: Nominal's narrative is strongest where the founders' backgrounds, the product thesis, and early customers line up. McCord's Navy and Anduril path, plus Strauss and Hoch's hardware and software-platform backgrounds, make the company's test-data focus feel earned rather than opportunistic.
