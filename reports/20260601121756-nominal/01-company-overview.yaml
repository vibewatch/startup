company:
  name: Nominal
chapter:
  number: 1
  title: Company Overview
  summary: Nominal is a Los Angeles hardware-test data infrastructure startup founded in 2022 by Cameron McCord, Bryce Strauss, and Jason Hoch. The company positioned itself as the modern software stack for mission-critical hardware teams, raised $155 million across a 2025 Series B and a March 2026 $80 million B-2 extension, and reached a $1 billion valuation while claiming 7x revenue growth, 60-plus organizations, and four of the five largest defense contractors as customers. Public evidence shows strong founder-market fit and unusually fast early traction, but also leaves governance, exact revenue scale, and even current headcount only partially resolved.
sections:
- id: identity-mission
  title: Identity, Founding Story, and Product Thesis
  body: 'Nominal was founded in 2022 in Los Angeles by Cameron McCord, Bryce Strauss, and Jason Hoch, and the founding story is unusually well aligned with the category the company chose to attack. Public company and investor materials present McCord as a former U.S. Navy officer who later built test software at Anduril, while Strauss and Hoch add Lockheed Martin and Palantir/Vercel lineage. Across the homepage, about page, and investor writeups, the company frames the problem consistently: modern hardware teams still move too much mission-critical test data through fragmented scripts, spreadsheets, lab tools, and bespoke pipelines. Nominal''s response is a connected software suite spanning Nominal Core and Nominal Connect, with Core acting as the collaborative cloud or secure-environment workspace for telemetry, logs, video, and simulation data, and Connect acting as the edge runtime for automated test control and repeatable instrumentation workflows. The messaging stays consistent across
    company, investor, and media surfaces, which makes the basic identity package unusually coherent for a young private startup. This gives the chapter a clear identity anchor for every later section: Nominal is not selling generic analytics, but purpose-built infrastructure for engineers testing physical systems where speed, safety, and auditability matter.'
