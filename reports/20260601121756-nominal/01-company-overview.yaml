  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, board observer rights, and governance documents for Nominal after the 2026 B-2 round.
    whyItMatters: Board structure determines control, future financing leverage, and acquisition or IPO readiness, but public materials do not identify directors or governance rights.
    diligencePath: Request the board list, voting agreements, and major investor rights documents directly from the company under NDA.
    relatedQuestionRefs:
