    - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Any debt facilities, SAFEs, secondaries, or employee-liquidity programs associated with Nominal's financing history.
    whyItMatters: The public round headlines establish valuation but not liquidation preferences, debt overhang, or secondary liquidity that could materially affect investor outcomes.
    diligencePath: Request the cap table, debt schedule, and financing documents that sit behind the Series B and B-2 announcements.
    relatedQuestionRefs:
