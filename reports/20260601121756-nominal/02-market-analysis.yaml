  evidenceGaps:
  - type: missing-source
    severity: material
    topic: defense-electronics-test-spend
    missingEvidence: A source-backed split between defense-electronics test software spend and test hardware or instrumentation spend.
    whyItMatters: Without a cleaner software-only denominator, Nominal's direct addressable market can only be estimated from broader categories.
    diligencePath: Interview test-instrument vendors and defense-prime engineering buyers, then triangulate software-line-item budgets against procurement documents.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: classified-sam
    missingEvidence: A customer-segment split showing what share of Nominal's realistic SAM requires classified, sovereign, or air-gapped deployment.
    whyItMatters: Deployment constraints directly affect gross margin, implementation cost, and product roadmap complexity.
    diligencePath: Ask management for pipeline segmentation by deployment model and by program classification level.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: minor
    topic: budget-ownership
    missingEvidence: Named public examples of which budget owner signs for test-data software across each core segment.
    whyItMatters: Budget ownership determines sales motion, procurement timing, and the correct comparator set for valuation and CAC assumptions.
    diligencePath: Interview buyers at defense primes, aerospace OEMs, and energy operators to map signature authority by program type.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: som
    missingEvidence: Pipeline conversion, ACV, and deployment-capacity data needed to turn the SAM range into a concrete near-term SOM.
    whyItMatters: A startup can operate in a large market and still overestimate attainable share if procurement friction and services load are high.
    diligencePath: Request pipeline, win-rate, ACV, and implementation-capacity data from the company and benchmark against similar defense software vendors.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
    - TM004
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A harmonized vendor definition that separates hardware, services, analytics, and pure software-control layers across market reports.
    whyItMatters: Analyst estimates are directionally useful but not directly comparable; mixing them without normalization can overstate market size.
    diligencePath: Normalize each report to a software-only layer before using it in valuation work and treat broad IIoT numbers as ceiling references, not direct TAM.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
