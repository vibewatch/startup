  title: Broad IIoT numbers are ceiling references, not direct TAM
  body: The category is undeniably large, but most of the biggest published numbers bundle hardware, services, connectivity, and broad analytics. A realistic Nominal TAM needs to stay anchored to the software layer around test, analysis, automation, and secure workflow.
