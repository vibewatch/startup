chapter:
  number: 2
  title: Market Analysis
  summary: Nominal competes inside a broad set of industrial IoT, analytics, testing, and digital-engineering markets, but the right software-only boundary is much narrower than headline IIoT figures imply. Public market reports put the broad ceiling anywhere from roughly $50 billion to nearly $200 billion, while direct testing or IIoT-platform analogs land between roughly $4 billion and $15 billion; a disciplined Nominal-relevant TAM therefore looks more like a $5 billion to $20 billion software layer centered on high-consequence hardware programs. Demand is strongest where data volume, regulatory burden, and cost of failure are all high, but procurement friction and deployment complexity keep the market hard to win.
sections:
- id: market-boundary-sizing
  title: Market Boundary and Sizing Logic
  body: 'Nominal should not be evaluated against the entire industrial IoT universe, but it also should not be constrained to a tiny niche of generic testing software. The right boundary is the software layer where hardware teams capture test data, synchronize it across instruments and runs, analyze it in near real time, automate repeatable validation, and preserve an auditable record that can feed design and operations. That sits inside several bigger categories—industrial IoT, IoT analytics, IoT testing, and digital-engineering software—while excluding large pools of unrelated hardware, generic cloud storage, or broad enterprise systems. Public market reports show why discipline matters: the broad industrial IoT market runs into the hundreds of billions, IoT analytics sits in the tens of billions, IoT testing lands in the low single-digit billions, and IIoT platform software is a narrower low-teens-billion slice. The market-definition problem is therefore strategic, not cosmetic, because
    investors and operators can easily overstate TAM by importing spend that will never flow to a workflow-software vendor. For Nominal, the most decision-useful conclusion is not one huge TAM headline but a constrained software-layer range of roughly $5 billion to $20 billion, big enough to build a large company but small enough that workflow fit and trust still determine who wins.'
