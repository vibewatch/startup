- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk / driver
  - Evidence
  - Impact
  - Mitigant / counter-evidence
  - Diligence path
  rows:
  - - Undisclosed defense-prime identities
    - Nominal says four of the five largest defense contractors use the platform but does not name them
    - Could hide top-account concentration and make ARR durability impossible to estimate externally
    - 60-plus-organization claim and multi-vertical named proof show the book is broader than one account
    - Request top-10 customer ARR and the names of the largest five accounts under NDA
  - - Budget timing and procurement friction
    - WTW cites phantom spending and procurement timing gaps in defense
    - Can delay task orders and rollout timing after technical acceptance
    - AFTC Phase III IDIQ reduces some contracting friction for Air Force work
    - Request backlog, task-order cadence, and budget exposure by program
  - - Government-program opacity
    - AFTC and NAVAIR proof is real but sparse on seat count, burn, and renewal
    - Makes public durability analysis inherently incomplete
    - Government proof still validates mission relevance and procurement trust
    - Request one classified or redacted reference call plus user-count ranges
  - - Services-heavy deployment risk
    - Many proofs emphasize implementation support and mission-team partnership
    - Could reduce software gross margin if services content is high
    - Repeatable platform use cases and shared templates imply reusable product core
    - Request revenue split between software subscription, services, and support
  - - Commercial concentration versus diversification
    - Pratt Miller, Antares, Odys, and REGENT diversify sector exposure beyond defense
    - Diversification reduces dependence on one federal budget line
    - Commercial accounts are still mostly pre-production or workflow-stage proof, not mature retention cohorts
    - Request paid ARR by vertical and by customer maturity
  - - Defense industrial-base delays
    - GAO highlights dependence on a vast supplier network with foreign-supplier risk
    - Customer program delays can push out Nominal expansion and invoice timing
    - Mission-critical test infrastructure may still remain funded even when downstream schedules slip
    - Map pipeline by procurement phase and by customer milestone dependency
  notes: Risks focus on customer durability and concentration, not product or company financing. Mitigants use only evidence visible in public sources and should be stress-tested in diligence.
