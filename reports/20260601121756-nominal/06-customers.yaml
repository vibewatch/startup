    - No public contract economics or end-customer revenue visibility
  - - Commercial engineering / motorsport
    - Pratt Miller Motorsports
    - 'Buyer: race engineering leadership; User: trackside, simulation, and test teams; Payer: racing operations budget'
    - Telemetry, wind tunnel, simulation, and race-day analysis
    - Commercially legible proof that speed-to-learning matters outside defense
    - No disclosed seat count, contract term, or quantified spend
