  - - Defense autonomy OEMs
    - Anduril and HII
    - 'Buyer: engineering operations; User: flight-test, manufacturing, and quality teams; Payer: platform programs'
    - Unified telemetry, automated analysis, and production workflow support
    - Best public evidence of multi-program expansion inside one account
    - No public ACV or deployment breadth by program
  - - Emerging aerospace mobility
    - Odys and REGENT
    - 'Buyer: chief engineer / certification leadership; User: flight-test engineers; Payer: R&D programs'
    - Real-time telemetry and accelerated post-flight review
    - Strong proof of workflow stickiness before production scale
