- id: SU002
  title: Case studies support a program-led land-and-expand motion
  body: 'The most important customer pattern in Nominal''s public evidence is not a disclosed seat count or contract term; it is the repeated shift from one critical workflow into a broader system-of-record role. Nominal says growth comes from engineering teams adopting the product on one program and then pulling it into the next. The case studies largely fit that story. Anduril describes a unified analysis platform that now serves multiple programs, more than 300 active users, and air-gapped ranges. HII says a 2025 pilot expanded into a 2026 rollout across REMUS and ROMULUS manufacturing and test workflows. The Air Force relationship moved from a 2023 research contract to a 2026 Phase III IDIQ with a $53 million ceiling, creating a vehicle for repeated task orders rather than a single bespoke pilot.


    The commercial and dual-use accounts show the same pattern at smaller scale. Odys used Nominal first to replace fragmented flight-test review, then to unify flight and ground testing around live telemetry. REGENT used the platform to avoid building an internal telemetry stack, and it already expects the same infrastructure to extend into certification and end-of-line testing as production ramps. Pratt Miller is similar in spirit: the platform connects shop, simulation, wind-tunnel, and race-day workflows on one backbone so engineers can work through large telemetry loads faster. The evidence is still mostly workflow-led rather than finance-led, but the direction is clear. Nominal wins when it shortens the test-to-decision loop, then expands outward into adjacent programs and lifecycle steps.'
