- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Nominal appears to win a narrow high-value workflow first, then expand across adjacent programs and lifecycle steps.
  data:
    items:
    - label: Initial program wedge
      description: Win a painful workflow such as flight-test review, reactor monitoring, or racing telemetry where delayed analysis slows learning.
    - label: Secure deployment fit
      description: Deploy on-prem, in secure clouds, or at the edge so the platform works inside sensitive government and industrial environments.
    - label: Live telemetry and shared context
      description: Ingest telemetry, logs, video, and annotations into one synchronized catalog available to operators and engineers.
    - label: Reusable analysis templates
      description: Standardize workbooks, anomaly checks, and review templates so specialists create the logic once and other teams reuse it.
    - label: Program-to-program spread
      description: Move from one program into adjacent vehicle lines, production workflows, certification tasks, or new service branches.
    - label: System-of-record position
      description: Become the persistent data backbone that makes follow-on contracts, multi-year rollouts, and deeper lifecycle integration possible.
