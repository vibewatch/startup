  title: Financial Profile
  summary: Nominal looks like a high-quality software revenue story wrapped around a mission-critical hardware workflow, but the public file still lacks absolute revenue, margin, and cash-burn disclosure. The clearest positives are $155 million of recent primary capital, 7x revenue growth, 60-plus customers, and strong land-and-expand signals; the clearest blockers are opaque unit economics and noisy third-party datasets caused by entity and domain confusion around nominal.so.
