sections:
  - id: revenue-model-streams
    title: Revenue Model and Monetization Architecture
    body: >-
      Public evidence points to a software-first business model, but not a simple self-serve SaaS one. Nominal explicitly markets two products — Core and Connect — that together cover collaborative telemetry analysis, edge data capture, instrument control, and repeatable testing workflows. The homepage uses request-demo calls to action rather than public pricing, and the Connect page describes an edge deployment model that reads from and writes to instruments in real time. That combination strongly suggests negotiated enterprise contracts rather than transparent seat-based pricing. The more important diligence question is revenue mix. Customer announcements repeatedly describe Nominal as the engineering, test, and operations data infrastructure for specific programs, which implies onboarding, integration, and solution-engineering work in addition to recurring software access. The highest-confidence conclusion is therefore not pure SaaS, but software licensing with a meaningful services envelope, especially early in account deployment. That can still be an excellent business if expansion revenue eventually dominates implementation effort, and the company’s own language supports that thesis by positioning Core and Connect as reusable platform layers rather than one-off services. What remains unknown is how much of first-year contract value comes from recurring software versus deployment labor, and whether gross margin already looks like infrastructure software or still reflects a heavy customer-success burden.
    claimRefs: [CI001, CI002, CI003, CI017, CI018, CI019, CI031]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-sales-efficiency
    title: GTM Motion, Expansion Dynamics, and Sales-Efficiency Proxies
    body: >-
      Nominal’s public go-to-market profile looks much closer to mission-critical enterprise infrastructure than to product-led software. The named customers and partner references cluster around organizations with complex hardware programs, high consequence of failure, and long procurement or validation cycles: the U.S. Air Force, Anduril, Shield AI, Mach, Forterra, HII, REGENT, Odys Aviation, Pratt Miller, and Antares. That customer list implies a high-touch sales motion with security, integration, and credibility hurdles, but it also implies larger contract potential and strong reference value once a program is won. The strongest positive signal is the company’s own description of account expansion: engineers start on one program and then pull Nominal into the next one. That is a classic land-and-expand pattern, and it matters more here than any missing CAC statistic because it suggests the product becomes operational infrastructure once embedded in the test loop. Investor commentary reinforces the point. Founders Fund led the B-2 after reported pull from Anduril and other portfolio teams, while Lightspeed and Sequoia both frame Nominal as a category-defining continuous test stack. None of that substitutes for hard CAC or payback data, but it does provide a reasonable public proxy for efficient early distribution: founder-market fit, portfolio referrals, lighthouse customers, and measurable customer ROI around faster test cadence and less manual analysis.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI033, CI034, CI035]
    figureRefs: [FI002]
  - id: cost-structure-and-capital-intensity
    title: Cost Structure, Margin Path, and Capital Intensity
    body: >-
      The public evidence is enough to sketch Nominal’s cost structure, but not enough to model it. On the favorable side, the company is clearly selling software and data infrastructure rather than hardware inventory, which should keep working-capital needs much lighter than those of its customers. There is no sign of factories, inventory financing, or project-manufacturing exposure; the core assets appear to be software products, domain expertise, and deployment credibility. That supports a plausible software-style long-term gross-margin profile. The caveat is that Nominal is not a lightweight horizontal app. Connect runs at the edge, interacts directly with instruments, and supports repeatable control logic. Customer proof spans testbeds, operations, autonomous systems, and production environments, all of which usually require more implementation, field support, and solution-engineering effort than a pure cloud dashboard. In other words, Nominal likely has lower capital intensity than hardware companies but higher delivery complexity than a standard B2B SaaS vendor. The most sensible public financial read is good gross-margin destination, uncertain current gross-margin reality. If services and deployment labor are mostly front-loaded, margins could expand nicely as accounts scale across programs. If the service load remains persistent, revenue quality is still good but less software-like than the headline growth story implies.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI024, CI025, CI031, CI034, CI035]
    tableRefs: [TI003]
    figureRefs: [FI004]
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy and Financing Dependency
    body: >-
      Publicly disclosed financing is strong even by venture-backed infrastructure standards. In June 2025, Nominal announced a $75 million Series B led by Sequoia. Less than a year later, it announced an $80 million B-2 extension led by Founders Fund at a $1 billion valuation. Those two rounds alone add to $155 million of recent primary capital, and the 2026 materials explicitly tie the new money to product development, global expansion, strategic acquisitions, and adjacent business lines. That capital base materially reduces near-term survival risk for a software company with 135 employees, but it does not eliminate financing dependency as a diligence topic because the most important variables — cash on hand, monthly burn, runway, and any debt or lease obligations — remain undisclosed. The likely interpretation is that Nominal raised ahead of need to accelerate rather than rescue, especially given the preemptive framing of the B-2, but that remains an interpretation rather than a modeled conclusion. The company is ambitious enough that strong capitalization and meaningful capital requirements can both be true at the same time: expanding internationally, widening product scope, and pursuing acquisitions can consume capital quickly even in software. So the verdict is positive but incomplete. Recent funding strength is real; underwritten runway is not yet public.
    claimRefs: [CI004, CI005, CI006, CI007, CI008, CI009, CI023, CI024, CI026, CI027, CI032]
    tableRefs: [TI004]
    figureRefs: [FI003]
  - id: data-quality-and-diligence-blockers
    title: Data Quality Problems and Remaining Diligence Blockers
    body: >-
      The last major financial issue is not operating performance but data hygiene. The current nominal.so domain resolves to an unrelated accounting-AI company, while the hardware company’s public materials sit on nominal.io. CB Insights then compounds the problem by attaching nominal.so to a different Nominal profile that reports only $29.2 million raised and a July 2025 $20 million Series A — facts that plainly conflict with Nominal’s disclosed $75 million Series B and $80 million B-2. This matters because valuation work on private companies often leans heavily on third-party databases for funding history, employee counts, and comparable sets. In Nominal’s case, those databases can mislead if entity identifiers are not reconciled first. Once that conflict is stripped out, the financial story is fairly clear: revenue quality looks promising because the product appears sticky, mission critical, and expansionary; margin path looks potentially strong because the company sells software rather than hardware; and financing risk looks manageable because recent capital is substantial. But the chapter still cannot answer the questions that ultimately determine conviction: absolute revenue, revenue mix, gross margin, CAC, retention, cash, burn, and debt obligations. Those are not minor omissions. They are the difference between a strong narrative and a fully underwritten financial model.
    claimRefs: [CI009, CI016, CI026, CI028, CI029, CI030, CI031, CI032]
    tableRefs: [TI005]
tables:
