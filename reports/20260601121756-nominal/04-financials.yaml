    title: Revenue Streams Table
    columns: [Stream, Mechanism, Public evidence, Current status, Revenue quality, Diligence ask]
    rows:
      - - Nominal Core subscriptions
        - Collaborative telemetry, logs, video, and simulation workspace
        - Core is the flagship product and central workspace
        - Active product
        - Best candidate for recurring high-margin software revenue
        - Need pricing metric, contract term, and renewal data
      - - Nominal Connect subscriptions
        - Edge compute, instrument control, and repeatable test automation
        - Connect runs at the edge and is expanding across testbeds and field operations
        - Active product
        - Recurring module revenue with strong attach potential
        - Need attach rate, packaging, and pricing by site or device
      - - Implementation and integration services
        - Data ingestion, telemetry setup, workflow design, and environment configuration
        - Customer announcements describe Nominal as data infrastructure for specific programs
        - Implied but not separately disclosed
        - Useful for activation, but probably lower margin than software
        - Need services share of bookings and gross margin
      - - Ongoing support and solution engineering
        - Mission-critical deployment support, training, and workflow tuning
        - Defense and operations use cases imply sustained technical support
        - Likely bundled into enterprise contracts
        - Sticky but labor-intensive if overused
        - Need support headcount and attach economics
      - - Expansion across programs or sites
        - Land-and-expand into additional programs once embedded
        - CEO says engineers adopt Nominal on one program and pull it into the next
        - Visible in company narrative
        - Highest-quality growth path if incremental cost is low
        - Need cohort expansion data and NRR
      - - Acquisition-led adjacent lines
        - Potential inorganic revenue from acquisitions and new business lines
        - 2026 raise explicitly mentions acquisitions and new lines
        - Planned, not yet quantified
        - Could widen TAM but adds integration risk
        - Need target profile and revenue contribution assumptions
    notes: Rows combine disclosed products with inferred monetization mechanics. Public sources confirm products and deployment patterns, but not exact pricing units or stream-level revenue mix.
