- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk domain
  - Monitorable trigger
  - Threshold or event
  - Investment implication
  rows:
  - - Compliance / export controls
    - Compliance pack completeness
    - Management cannot produce a current ITAR, CUI, CMMC, and secure-by-design packet with named owners and evidence.
    - Treat defense-scale upside as impaired until the control surface is documented.
  - - Customer concentration
    - Top-customer dependence
    - A small set of primes, labs, or program offices explains a large share of bookings or renewals without durable contractual protections.
    - Haircut growth durability, lower valuation tolerance, and require more downside protection.
  - - Budget exposure
    - Program-start timing
    - CRs or budget uncertainty push out task orders, new starts, or program expansions tied to Nominal deployments.
    - Model slower conversion and lower near-term government expansion.
  - - Legacy competition
    - System-of-record displacement
    - Nominal remains a narrow add-on while incumbent toolchains retain the decisive workflow.
    - Assume weaker expansion economics and slower sales cycles.
  - - People capacity
    - Service and hiring throughput
    - Support SLAs slip, security reviews bottleneck, or cleared-role hiring falls behind contract growth.
    - Raise the execution discount and question whether the team is too small for the current sales posture.
  - - Commercial diversification
    - Non-defense revenue proof
    - Management cannot show repeatable commercial production accounts with durable ROI and renewals.
    - Continue underwriting Nominal primarily as a defense-concentrated business.
  notes: These are monitorable triggers rather than predictions; each converts a visible public concern into a concrete underwriting test during diligence.
