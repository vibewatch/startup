tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Public evidence
  - Likelihood
  - Severity
  - Current mitigation evidence
  - Residual exposure / diligence path
  rows:
  - - ITAR technical-data scope can attach to defense-test workflows
    - Cornell says technical data includes information needed for testing, maintenance, operation, and modification of defense articles, plus classified information and directly related software.
    - High
    - High
    - Nominal publicly emphasizes secure and private deployment options for mission-critical programs.
    - Review export-control policy, foreign-national access controls, customer security addenda, and any classified-boundary architecture before treating secure deployment claims as de-risked.
  - - CUI and CMMC burden expands as contracts scale
    - National Archives says CUI requires standardized safeguarding rules, and the DOD CIO says CMMC Phase 1 is already active through November 9, 2026.
    - High
    - High
    - The company already sells into defense and government environments, implying some baseline process discipline.
    - Request current SPRS affirmations, CMMC status, SSP or POA&M evidence, and customer-specific flow-down obligations.
  - - Foreign-national disclosure mistakes could trigger DDTC issues
    - 22 CFR 125.1 restricts disclosure of controlled technical data to nationals of another country without DDTC approval, subject only to limited exemptions.
    - Medium
    - High
    - Private or on-prem deployment may let customers constrain access locally.
    - Map exactly which employees, contractors, cloud regions, and support workflows can touch controlled datasets.
  - - Secure-by-design expectations are rising faster than vendor marketing language
    - CISA says software vendors should make security a core business requirement and ship secure defaults such as MFA, logging, and SSO.
    - Medium
    - High
    - Nominal markets secure environments, but the public source set does not show a detailed control pack.
    - Treat exact control maturity as open diligence until management provides architecture reviews, audit scope, and security-review outcomes.
  notes: Rows are ordered by residual investment severity; the open question is not whether Nominal touches sensitive defense data, but how much of today's workload already sits inside ITAR, CUI, and security-review boundaries.
  enumerationScope:
    coverage: exhaustive
    basis: 'This table covers the distinct regulatory and legal risks surfaced in the chapter''s source set: ITAR scope, foreign-national transfer rules, CUI handling, CMMC implementation, and secure-by-design control expectations.'
