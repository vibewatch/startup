  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: classified-and-export-controls
    missingEvidence: A compliance pack showing classified deployment boundaries, export-control procedures, foreign-national access controls, incident history, and how Nominal separates ITAR-controlled technical data from general telemetry.
    whyItMatters: Defense test data can fall inside ITAR, CUI, and cybersecurity obligations, so investors need to know whether the architecture and staffing already match the real control burden.
    diligencePath: Request the security architecture review, export-control policy, customer security addenda, incident-response plan, and any third-party audit or accreditation matrix used for classified or export-controlled programs.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer-by-customer revenue, renewal dates, task-order concentration, and the share of bookings represented by a handful of primes, labs, or government programs.
    whyItMatters: Public customer proof is strong, but the underwriting case changes quickly if revenue sits behind a few programs exposed to volatile procurement calendars and continuing-resolution delays.
    diligencePath: Request the top-10 customer table with ARR or bookings share, contract type, renewal and termination terms, and the split between government and prime-contractor work.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: commercial-expansion
    missingEvidence: Commercial ARR, the number of live non-defense production accounts, reference calls in robotics or energy, and evidence that those logos repeat outside bespoke deployments.
    whyItMatters: Commercial diversification is one of the clearest ways to reduce budget and prime-concentration exposure, but the public source set still shows only an early wedge.
    diligencePath: Request a split of pipeline and revenue by defense versus non-defense vertical, plus three live commercial references with deployment scope, renewal status, and ROI metrics.
    relatedQuestionRefs:
    - QR005
    - QR029
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: team-capacity
    missingEvidence: Cleared-headcount mix, open requisitions by security and field role, support ratios, security-review cycle times, and post-deployment SLA performance for recent large defense accounts.
    whyItMatters: A 135-person team can support major programs, but investors need to know whether service quality and compliance capacity are keeping pace with contract growth and integration breadth.
    diligencePath: Request the org chart, hiring plan, backlog metrics, support SLAs, and attrition data for engineering, security, compliance, and field teams.
    relatedQuestionRefs:
    - QR018
    - QR030
    relatedTableRefs:
    - TR004
