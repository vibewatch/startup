  productSummary: >-
    Nominal Core is a collaborative workspace for test data management, search, and analytics that integrates with
    existing test infrastructure. Nominal Connect is an edge product that reads from and writes to in-situ test
    equipment, enabling real-time data streaming from hardware test cells to the cloud platform. Together they form a
    test data fabric across defense primes, aerospace, and industrial manufacturers, replacing siloed spreadsheets and
    custom tooling with a unified intelligence layer.
  customerFocus: Defense prime contractors, aerospace manufacturers, nuclear energy operators, and advanced industrial manufacturers
  businessModel: >-
    SaaS platform licensing (Nominal Core) plus professional services and edge deployment (Nominal Connect); enterprise
