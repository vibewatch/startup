    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding Story, and Product Thesis
        blocks:
          - type: paragraph
            body: >-
              Nominal was founded in 2022 in Los Angeles by Cameron McCord, Bryce Strauss, and Jason Hoch, and the
              founding story is unusually well aligned with the category the company chose to attack. Public company and
              investor materials present McCord as a former U.S. Navy officer who later built test software at Anduril,
              while Strauss and Hoch add Lockheed Martin and Palantir/Vercel lineage. Across the homepage, about page,
              and investor writeups, the company frames the problem consistently: modern hardware teams still move too
              much mission-critical test data through fragmented scripts, spreadsheets, lab tools, and bespoke
              pipelines. Nominal's response is a connected software suite spanning Nominal Core and Nominal Connect,
              with Core acting as the collaborative cloud or secure-environment workspace for telemetry, logs, video,
              and simulation data, and Connect acting as the edge runtime for automated test control and repeatable
              instrumentation workflows. The messaging stays consistent across company, investor, and media surfaces,
              which makes the basic identity package unusually coherent for a young private startup. This gives the
              chapter a clear identity anchor for every later section: Nominal is not selling generic analytics, but
              purpose-built infrastructure for engineers testing physical systems where speed, safety, and auditability
              matter.
