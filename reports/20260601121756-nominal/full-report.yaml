      - number: '5.3'
        title: Differentiation, maturity, and trust posture
        blocks:
          - type: paragraph
            body: >-
              The clearest differentiation signal is that Nominal is trying to own the hardware-data workflow end to
              end, not just a visualization endpoint. The Fundamentals post explicitly frames the product as a response
              to teams outgrowing CSVs, patched-together dashboards, and fragmented telemetry stacks; the Fid Labs
              announcement extends that thesis by arguing that useful AI only appears after the underlying data supply
              chain is captured, normalized, and made collaborative. That makes the current maturity picture uneven but
              understandable. Core, Connect, live monitoring, synchronized multimodal review, and disconnected edge
              operation all look like shipped or actively deployed capabilities in the public record. The AI layer is
              more directional: the company has a clear thesis and an acquisition aligned with it, but no retained
              public GA specification for model boundaries, permissions, evaluation, or override controls. Trust and
              compliance disclosure are also meaningfully behind deployment ambition. The edge and product materials
              support secure-facility and low-connectivity use cases, and generic federal references clarify why
              low-latency local processing and formal authorization pathways matter for defense buyers. But this source
              pack does not provide a Nominal trust center, published certification matrix, detailed support or incident
              commitments, or a clean inventory of native integrations for incumbent tools. In practical diligence
              terms, that means the workflow and architecture story is credible, while integration depth, assurance
              artifacts, and AI operating controls still require direct customer-room access.
