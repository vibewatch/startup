      - number: '4.3'
        title: Cost Structure, Margin Path, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              The public evidence is enough to sketch Nominal’s cost structure, but not enough to model it. On the
              favorable side, the company is clearly selling software and data infrastructure rather than hardware
              inventory, which should keep working-capital needs much lighter than those of its customers. There is no
              sign of factories, inventory financing, or project-manufacturing exposure; the core assets appear to be
              software products, domain expertise, and deployment credibility. That supports a plausible software-style
              long-term gross-margin profile. The caveat is that Nominal is not a lightweight horizontal app. Connect
              runs at the edge, interacts directly with instruments, and supports repeatable control logic. Customer
              proof spans testbeds, operations, autonomous systems, and production environments, all of which usually
              require more implementation, field support, and solution-engineering effort than a pure cloud dashboard.
              In other words, Nominal likely has lower capital intensity than hardware companies but higher delivery
              complexity than a standard B2B SaaS vendor. The most sensible public financial read is good gross-margin
              destination, uncertain current gross-margin reality. If services and deployment labor are mostly
              front-loaded, margins could expand nicely as accounts scale across programs. If the service load remains
              persistent, revenue quality is still good but less software-like than the headline growth story implies.
