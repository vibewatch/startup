companyProfile:
  summary: >-
    Nominal is a Los Angeles-based hardware test data intelligence company founded in 2022 by Cameron McCord (CEO,
    ex-Navy, ex-Anduril), Bryce Strauss, and Jason Hoch. The company's platform — Nominal Core and Nominal Connect —
    connects disparate test data systems across defense primes and advanced manufacturers, enabling engineers to
    collaborate, search, and analyze hardware test results in real time. Nominal raised $80 million at a $1 billion
    valuation in March 2026 (Series B-2) led by Founders Fund (Trae Stephens), with participation from Sequoia Capital,
    Lux Capital, and General Catalyst. The company reported 7x revenue growth since its prior round and says four of the
    five largest defense contractors globally run on its platform.
  foundedDate: '2022-01-01'
