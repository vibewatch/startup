            body: >-
              Nominal's public customer proof is stronger on engineering outcomes than on economic durability. The case
              studies are unusually concrete for a private industrial-software company: Anduril quantifies 40x faster
              ingest and a 300-plus-user footprint, Odys reports 43 percent more test flights per day, REGENT compresses
              multi-day review into minutes, and HII ties the product to faster analysis and shorter production test
              steps. Those are the right kinds of signals for a workflow platform, because they imply the product sits
              near the decision-making core of each program. But none of the reviewed public materials disclose NRR,
              GRR, churn, standard contract length, pricing, or top-customer concentration. That makes it hard to
              convert operational stickiness into a durable revenue model from outside evidence alone.


              The risk is highest in defense. If four of the five largest defense contractors truly use Nominal, those
              are extraordinarily valuable accounts, but the company does not disclose which ones or how revenue is
              distributed among them. Sector headwinds also matter. WTW highlights procurement friction and
              budget-timing gaps, while GAO notes the broader defense industrial base depends on a vast supplier network
              with meaningful supply-chain risk. Those frictions do not negate Nominal's customer traction, but they can
              slow the pace at which technical wins become repeatable enterprise revenue. The right diligence ask is
              therefore straightforward: request top-customer ARR concentration, cohort renewal by program, and a clean
              split between software subscription revenue and services-heavy deployments before underwriting customer
              durability as fully proven.
