  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view and thesis-break framing
        blocks:
          - type: paragraph
            body: >-
              Nominal's risk stack is attractive precisely because the company has reached real defense relevance
              quickly. The strongest public proof comes from the hardest operating environments: Air Force test
              infrastructure, DARPA digital-twin programs, Navy autonomous-aircraft testing, and prime or defense-tech
              programs including Anduril, HII, Forterra, and Mach. That means the first-ranked risk is not demand
              generation; it is compliance and trust. A platform that handles test data, telemetry, logs, video, and
              secure deployments for sensitive government-adjacent programs can drift into ITAR technical-data rules,
              CUI handling obligations, customer security reviews, and potentially classified-boundary questions faster
              than a conventional horizontal SaaS tool. The second-ranked risk is concentration. Nominal says four of
              the five largest defense contractors use the platform and more than 60 organizations trust it with
              sensitive programs, but those same signals imply a few primes, labs, or program offices may explain a
              large share of near-term bookings. The third-ranked risk is operational complexity: Anduril's case study
              shows Nominal already supports multimodal data, edge processing, and austere or classified-adjacent
              environments, which is powerful evidence of product value but also evidence that implementation burden can
              spike. Fourth is people and execution risk. A 135-person team is scaling contracts, security expectations,
              and product surface area simultaneously. Fifth is commercial-penetration risk. Public non-defense proof
              exists, but HBR's 2026 argument that AI will reset expectations for many workflow-software categories
              raises the bar for any company trying to broaden beyond a high-trust defense wedge.
            claimRefs:
