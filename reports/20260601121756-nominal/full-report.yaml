  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful 2026 public and transaction references for Nominal: a defense-data premium
        ceiling, an industrial-operations benchmark, a mature industrial floor, strategic field-service M&A, and sector
        baskets that bracket industrial versus public-sector software.
    columns:
      - comparable
      - metric
      - multiple / valuation / status
      - relevance
      - limitation
    rows:
      - - Palantir
        - Public EV/Sales / LTM revenue
        - ~70.34x EV/Sales on ~$5.22B LTM revenue
        - Shows how far defense-grade data platforms can rerate when category leadership and AI narratives compound.
        - Too mature and too exceptional to use as a base-case multiple for Nominal.
      - - Samsara
        - Public EV/Sales / ARR
        - ~11.88x EV/Sales on $1.62B revenue and $1.9B ARR
        - Best public benchmark for premium physical-operations software with real data-moat economics.
        - Less defense-exposed and more commercially diversified than Nominal.
      - - PTC
        - Public EV/Sales
        - ~5.66x-6.2x EV/Sales on ~$3.0B LTM revenue
        - Useful mature industrial-software floor with strong margins and mission-critical workflows.
        - Growth is much slower and the company is far more mature than Nominal.
      - - ServiceMax / PTC transaction
        - Strategic M&A / annual software revenue
        - $1.46B acquisition; ~$148M annual software revenue added to PTC PLM category
        - Shows strategics will pay for asset-centric workflow software that closes a lifecycle data loop.
        - Historical transaction in a different buyer context, not a direct public multiple.
      - - Multiples.vc industrial software basket
        - Sector basket revenue multiple
        - ~3.4x revenue and ~11.7x EBITDA
        - Defines the center of gravity for industrial software in May 2026.
        - Basket average can understate a niche company with stronger growth or government premium.
      - - Multiples.vc public-sector software basket
        - Sector basket revenue multiple
        - ~11.4x revenue
        - Useful premium benchmark for software with public-sector end-markets and sticky workflows.
        - Sector basket includes firms with different product depth and procurement models.
    notes: >-
      This table is intentionally partial because private defense-software rounds rarely disclose enough ARR detail to
      produce apples-to-apples multiples. It is designed to bracket a plausible range rather than imply false precision.
    claimRefs:
