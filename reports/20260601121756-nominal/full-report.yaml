        - Strategic value does not guarantee public-market style multiples or timely exits if M&A stays slow.
        - Show active strategic demand, continuation interest, or exit-ready scale with diversified ARR.
      - - Market support
        - Public-sector and industrial software comps support meaningful premiums above generic SaaS averages.
        - Palantir is an exceptional ceiling, not a base case, and mature industrial software still trades far lower.
        - Show metrics that place Nominal closer to the premium bucket than the industrial floor.
    notes: >-
      The point of this table is to isolate which parts of the premium story are already evidenced and which parts still
      depend on diligence-only economics.
