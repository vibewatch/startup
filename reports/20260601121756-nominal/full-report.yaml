      - number: '1.2'
        title: Capital Formation, Investors, and Early Traction
        blocks:
          - type: paragraph
            body: >-
              Nominal's financing trajectory compressed unusually quickly. The company announced a $75 million Series B
              in 2025 led by Sequoia and followed it less than a year later with an $80 million Series B-2 acceleration
              round led by Founders Fund at a $1 billion valuation. Independent reporting and investor commentary
              describe those two rounds as $155 million of fresh capital in roughly 10 months, with the same core
              investor set recurring across Sequoia, Lightspeed, Lux Capital, General Catalyst, and later Founders Fund
              plus Red Glass. The significance is not only the dollar amount but the speed and context: TechCrunch,
              National Law Review, and Sourcery all depict the B-2 as a preemptive financing catalyzed by strong
              customer pull from defense-oriented portfolio companies such as Anduril. Nominal paired that financing
              story with strong but still mostly company-reported operating signals—7x revenue growth year over year,
              more than 60 organizations on the platform, four of the five largest defense contractors as customers, and
              a team that supposedly tripled to 135 people across five cities. That is enough to establish momentum, but
              not enough to settle exact revenue scale or headcount with precision.
