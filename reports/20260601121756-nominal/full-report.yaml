  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape Shape: Fragmented, Not Winner-Take-All'
        blocks:
          - type: paragraph
            body: >-
              The most important conclusion in Nominal's competitive landscape is that there is no clean one-to-one peer
              with the exact same market narrative. Instead, the company is threading between several established
              categories that each own part of the incumbent workflow. NI and MathWorks dominate legacy bench-level test
              and engineering analysis. Databricks and Palantir attack the enterprise data and AI layer. InfluxDB
              competes as a time-series building block. PTC and Siemens are embedded where PLM and digital-thread
              governance already matter. That means Nominal usually competes against combinations of tools and internal
              glue code rather than a single packaged alternative. Strategically, that is both good and bad. It reduces
              the probability that one vendor can simply overwhelm Nominal feature-for-feature, but it also means
              customers can often delay change by stitching together a familiar stack that is suboptimal yet
              institutionally trusted. The category map also explains why procurement language can sound inconsistent:
              some buyers call the problem test automation, others call it engineering analytics, and others treat it as
              digital thread or data infrastructure. That linguistic sprawl makes category ownership unusually hard to
              claim. The landscape is therefore fragmented enough to create whitespace, but crowded enough to keep
              switching cost real.
            claimRefs:
