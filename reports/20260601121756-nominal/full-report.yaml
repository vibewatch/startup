  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - $180M-$240M ARR, defense category leadership, visible industrial expansion, and continued platform premium.
        - $2.2B-$3.6B EV using roughly 12x-15x ARR; supports a 3B+ outcome for a top-decile execution path.
        - Industrial expansion stalls, acquisitions misfire, or public multiples compress before scale is reached.
        - ~25%
      - - Base
        - >-
          $60M-$90M forward ARR, fast but moderating growth, continued defense conversion, and enough retention to
          preserve premium software status.
        - >-
          $1.0B-$1.4B EV using a blended premium over industrial software; current mark can hold but is not obviously
          cheap.
        - Customer concentration, delayed procurement, or weaker-than-expected retention erode the premium.
        - ~45%
      - - Bear
        - >-
          Growth normalizes toward mature-industrial levels and investors value the business at 6x-8x ARR with limited
          industrial contribution.
        - $0.7B-$0.9B EV; downside appears quickly if ARR is well below the implied range or exits stay scarce.
        - Defense budget execution, valley-of-death risk, and limited exit liquidity compound.
        - ~30%
    notes: >-
      All ranges are analytical estimates rather than management guidance. They are anchored to public comp bands, the
      reported 7x growth signal, and the absence of disclosed recurring-software KPIs.
