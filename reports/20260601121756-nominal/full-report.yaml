      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Defense premium is real, but liquidity is less abundant than funding headlines imply
            body: >-
              Defense-tech funding has accelerated, but S&P says sector M&A has slowed after the 2021 peak and Goodwin
              says the prototype-to-production valley of death remains real. For Nominal, that means customer logos
              alone are not enough. Investors need to see proof that federal and prime-contractor adoption becomes
              durable recurring revenue before assuming the next round or exit will clear at a materially higher
              multiple.
            calloutType: insight
            claimRefs:
              - CV040
              - CV041
              - CV043
          - type: callout
            title: The right valuation lens is closer to premium industrial software than to Palantir
            body: >-
              Palantir proves the existence of a defense-grade data premium, but Nominal is much earlier and less
              diversified. Samsara and PTC together give the more useful bracket: Nominal deserves more than the mature
              industrial floor if its software economics are real, yet the current public evidence still falls short of
              the scale and disclosure that justify Palantir's exceptional multiple.
            calloutType: insight
            claimRefs:
              - CV024
              - CV028
              - CV030
              - CV036
          - type: callout
            title: 'Best next step: verify the denominator before paying for the premium'
            body: >-
              The diligence path is clear. Ask for ARR, retention, gross margin, concentration, and capital-structure
              terms first. If those disclosures support the base-case ARR zone and show diversified software-quality
              revenue, the current mark can hold. If they do not, the safer move is to wait rather than paying full
              price for growth that the public record cannot yet quantify.
            calloutType: insight
            claimRefs:
              - CV037
              - CV042
