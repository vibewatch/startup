  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision chain from reported traction through comparable brackets and disclosure gaps to the current investment
      stance.
    data:
      nodes:
        - id: n1
          label: March 2026 financing at $1B
          detail: Fresh $80M extension after the prior Series B; 7x reported revenue growth since the prior round.
        - id: n2
          label: Real deployment proof
          detail: 4 of 5 largest defense contractors, Anduril usage, Navy support, and AFTC contract ceiling.
        - id: n3
          label: Comparable bracket
          detail: >-
            PTC ~6x, Samsara ~12x, Palantir ~70x; Nominal likely sits above mature industrial but well below the
            Palantir ceiling.
        - id: n4
          label: Implied ARR threshold
          detail: >-
            $1B means roughly $50M-$83M ARR at 20x-12x, but $100M-$167M if the market values it like mature industrial
            software.
        - id: n5
          label: Missing economics
          detail: No public ARR, retention, gross-margin, or preference-stack disclosure.
        - id: n6
          label: 'Verdict: track'
          detail: >-
            Stay close to the company, but do not pay more than the current mark until recurring-software quality is
            proven.
      edges:
        - from: n1
          to: n2
          label: supports serious review
        - from: n2
          to: n3
          label: determines premium lens
        - from: n3
          to: n4
          label: sets ARR hurdle
        - from: n4
          to: n5
          label: depends on disclosure
        - from: n5
          to: n6
          label: keeps stance cautious
    claimRefs:
      - CV001
      - CV013
      - CV034
      - CV035
      - CV036
      - CV042
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: ARR required to justify a $1 billion valuation at different revenue-multiple assumptions.
    data:
      items:
        - label: 20x ARR case
          value: 50
          detail: Requires a top-end premium typically reserved for exceptional hypergrowth software.
        - label: 15x ARR case
          value: 66.7
          detail: A demanding but more plausible premium if Nominal already behaves like a scaled recurring software platform.
        - label: 12x ARR case
          value: 83.3
          detail: Close to the Samsara-style premium zone for strong physical-operations software.
        - label: 10x ARR case
          value: 100
          detail: Requires meaningful scale and still assumes premium public-market support.
        - label: 8x ARR case
          value: 125
          detail: Closer to compressed but still respectable software outcomes.
        - label: 6x ARR case
          value: 166.7
          detail: Near the mature-industrial floor implied by PTC-style comparables.
    claimRefs:
      - CV034
      - CV035
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: Bear, current-mark, base, and bull valuation ranges in USD millions.
    data:
      items:
        - label: Bear range
          low: 700
          mid: 800
          high: 900
          unit: M USD
          detail: Growth normalizes and exit multiples compress toward 6x-8x ARR.
        - label: Current round mark
          low: 1000
          mid: 1000
          high: 1000
          unit: M USD
          detail: March 2026 financing headline valuation.
        - label: Base range
          low: 1000
          mid: 1200
          high: 1400
          unit: M USD
          detail: Requires roughly $60M-$90M forward ARR with continued premium-software framing.
        - label: Bull range
          low: 2200
          mid: 2900
          high: 3600
          unit: M USD
          detail: Requires industrial expansion, stronger disclosure, and 12x-15x premium multiples on $180M-$240M ARR.
    claimRefs:
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-ready metrics that frame the current round and what the next re-rating requires.
    data:
      items:
        - label: Current valuation
          value: $1.0B
          unit: USD
          detail: March 2026 financing headline valuation.
        - label: Reported growth
          value: 7x
          unit: null
          detail: Company-reported revenue growth since the prior Series B.
        - label: Defense-prime penetration
          value: 4 of 5
          unit: null
          detail: Company-reported share of the largest defense contractors using Nominal.
        - label: AFTC ceiling
          value: $53M
          unit: USD
          detail: IDIQ ceiling awarded through Air Force Test Center Phase III pathway.
        - label: Base-case ARR hurdle
          value: $60M-$90M
          unit: USD
          detail: Forward ARR zone that keeps the current mark broadly supportable.
        - label: Bull-case ARR hurdle
          value: $180M-$240M
          unit: USD
          detail: ARR band that starts to support a $3B+ outcome.
    claimRefs:
