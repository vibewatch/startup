  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a software-first business model, but not a simple self-serve SaaS one. Nominal
              explicitly markets two products — Core and Connect — that together cover collaborative telemetry analysis,
              edge data capture, instrument control, and repeatable testing workflows. The homepage uses request-demo
              calls to action rather than public pricing, and the Connect page describes an edge deployment model that
              reads from and writes to instruments in real time. That combination strongly suggests negotiated
              enterprise contracts rather than transparent seat-based pricing. The more important diligence question is
              revenue mix. Customer announcements repeatedly describe Nominal as the engineering, test, and operations
              data infrastructure for specific programs, which implies onboarding, integration, and solution-engineering
              work in addition to recurring software access. The highest-confidence conclusion is therefore not pure
              SaaS, but software licensing with a meaningful services envelope, especially early in account deployment.
              That can still be an excellent business if expansion revenue eventually dominates implementation effort,
              and the company’s own language supports that thesis by positioning Core and Connect as reusable platform
              layers rather than one-off services. What remains unknown is how much of first-year contract value comes
