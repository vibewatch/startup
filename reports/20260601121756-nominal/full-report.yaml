  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Nominal’s public surface is more coherent than a generic telemetry startup pitch. Core is presented as the
              collaborative workspace where engineering teams manage test data, run analysis, monitor live operations,
              report findings, and keep decisions attached to the underlying evidence. Connect is the separate edge-side
              product that reads from and writes to instruments, runs repeatable Python-based tests, and moves with the
              hardware instead of assuming a stable cloud connection. The product split matters because it implies a
              real operating model: local control and ingest near the asset, then shared review and reuse in the cloud
              workspace. The official aviation, space, and RF materials reinforce that view. Aviation emphasizes
              repositories that unify full-rate telemetry, video, logs, spatial data, PDFs, computed events, and weather
              context; space materials describe synchronized timelines across ephemeris, bus, and payload data plus
              structured review; the SDR example shows live command, ingest, and visualization for radio workflows
              inside Connect. Across those pages, Nominal is not selling only charts. It is selling a workflow backbone
              that spans live monitoring, post-test comparison, historical search, and collaboration across multiple
              asset classes and time scales. The public pack is still thin on packaging detail, however. There is no
              public module-by-module pricing, no explicit connector inventory for incumbent aerospace or industrial
              toolchains, and no clean boundary between packaged workflow templates and customer-specific implementation
              work. Even so, the retained evidence is enough to conclude that Nominal has a defined product architecture
              rather than a services-only narrative.
