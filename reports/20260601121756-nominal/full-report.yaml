      - number: '2.3'
        title: Growth Drivers, Regulatory Tailwinds, and Adoption Friction
        blocks:
          - type: paragraph
            body: >-
              The category benefits from several strong tailwinds, but each one comes with a practical constraint.
              Digital engineering and software modernization are now embedded in defense-acquisition policy, with DAU
              and DoD materials emphasizing iterative software delivery, data-driven analytics, and modernization speed.
              CMMC and DFARS implementation raise the bar further by turning secure handling of program data into a
              procurement requirement, which increases the value of vendors that can offer traceable, auditable
              workflows. NIST's cyber and smart-manufacturing work, plus FAA approval processes in aerospace, reinforce
              the same core need for trustworthy, documented, secure engineering data. At the same time, the same
              features that make the market attractive also slow adoption. Integration burden, long procurement cycles,
              security reviews, skills shortages, and the tension between cloud-native tooling and air-gapped
              environments all make this a slower and more operationally demanding market than ordinary enterprise SaaS.
              These constraints help explain why incumbents and custom internal tools persist despite obvious workflow
              pain, especially when an existing test stack already works badly but predictably. The result is a large,
              structurally improving market whose economics favor vendors that can combine product depth with regulatory
              trust rather than simply attach themselves to the biggest IIoT number available.
