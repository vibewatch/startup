      - number: '3.3'
        title: Switching Cost, Multi-Homing, and Nominal’s Moat Question
        blocks:
          - type: paragraph
            body: >-
              Nominal's moat argument is strongest where customers do not want another general platform but do want a
              purpose-built workflow for hardware test data. That creates a practical land-and-expand path: keep MATLAB,
              LabVIEW, PLM, or a data lake where they already work, then add Nominal to the painful workflow that needs
              faster capture, analysis, and collaboration. Multi-homing is therefore not a failure mode but a likely
              adoption pattern. The risk is that incumbents still own meaningful sources of power. NI has
              instrumentation and test-bench installed base. MathWorks has trained users and toolboxes. Databricks and
              Palantir have executive relationships and enterprise budgets. PTC and Siemens ride on standardized
              digital-thread and PLM processes. InfluxDB and internal Python or lakehouse stacks create a credible
              low-end substitute for teams willing to build. Put differently, Nominal does not only need better product
              ergonomics; it needs enough measurable workflow advantage to justify organizational change inside
              conservative engineering environments. Public evidence does not yet show a crisp set of win-loss cases
              that proves Nominal consistently beats those alternatives. The best current conclusion is that Nominal is
              genuinely differentiated, but its competitive durability will depend on whether that workflow advantage
              compounds faster than incumbent trust and internal-build habits.
