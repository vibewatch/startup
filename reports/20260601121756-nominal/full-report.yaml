      - number: '1.3'
        title: Milestones, Culture Signals, and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Beyond financing, public milestones show a startup that is trying to become durable infrastructure rather
              than a point feature. The Anduril case study is the clearest proof point: Nominal says analysis cycles
              that once took five to six hours moved to near real time, telemetry ETL improved by 40x, and usage
              expanded to 300-plus active users across programs. The company followed that customer proof with a Fid
              Labs acquisition oriented around domain-expert AI for hardware engineering, a stated push into the UK and
              Europe, and a recruiting narrative that produced nearly 16 university hires in 2025. Culture signals also
              look coherent with the category: careers materials emphasize engineers and operators from Palantir,
              SpaceX, Anduril, and Applied Intuition, while customer testimonials from Hermeus, GA-ASI, and retired Air
              Force leadership reinforce credibility in mission-critical domains. The public milestone set also suggests
              a company that is widening both geography and product ambition at the same time, which usually increases
              execution complexity even when momentum is strong. The remaining public gaps are concentrated in
              governance and measurement. Board composition is not disclosed, debt and secondary liquidity are not
              described, the exact ARR or run-rate behind the 7x growth claim is unknown, and independent databases show
              a materially higher employee count than the company's own March 2026 disclosure. The company story is
              compelling; the diligence file is not yet complete.
