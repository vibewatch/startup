      - number: '7.2'
        title: Regulatory, legal, security, and budget exposure
        blocks:
          - type: paragraph
            body: >-
              Nominal's regulatory and legal risk is not theoretical. Cornell's ITAR text matters because technical data
              explicitly includes information needed for testing, maintenance, operation, and modification of defense
              articles, plus classified information and software directly related to defense articles. A platform
              positioned as the data backbone for defense testing therefore sits close to export-control boundaries
              whenever it aggregates engineering artifacts, procedures, logs, or model outputs across teams and
              geographies. The National Archives and DOD CIO show why the burden is operational today rather than
              hypothetical: CUI handling is standardized across the executive branch, and CMMC Phase 1 is already in
              effect for defense contractors. CISA adds another layer by making clear that software vendors are
              increasingly expected to own secure-by-design outcomes at the executive level and provide secure defaults
              rather than optional bolt-ons. Budget exposure compounds the compliance burden. GAO documents how often
              DOD operates under continuing resolutions and the schedule delays and cost increases that follow. The
              Senate's FY26 summary says CRs block new starts and certain multiyear procurements, while Brookings frames
              sequestration-style cuts as harmful to contracting and training beyond headline savings. For Nominal, that
              matters because its biggest public wins are tied to developmental test, autonomy, and modernization
              programs that benefit from new starts, rapid contracting, and program continuity. Compliance friction and
              budget friction are therefore linked: the harder the sales motion leans into defense programs, the more
              both forces shape growth quality.
            claimRefs:
