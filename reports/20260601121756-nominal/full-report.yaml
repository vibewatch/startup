  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Nominal's residual risk concentrates in compliance burden, defense concentration, and execution strain rather than
      in pure demand creation.
    data:
      columns:
        - Low impact
        - Medium impact
        - High impact
      rows:
        - label: High likelihood
          values:
            - label: Commercial proof stays thin
              tone: neutral
              detail: Expansion beyond defense may simply take longer than the valuation hopes.
            - label: Team bandwidth strains
              tone: risk
              detail: A 135-person team is carrying contracts, support, and compliance work at once.
            - label: Prime and program concentration
              tone: risk
              detail: A few defense accounts could drive outsized bookings, references, or renewal risk.
        - label: Medium likelihood
          values:
            - label: Legacy coexistence
              tone: neutral
              detail: Incumbent toolchains may remain embedded even if Nominal lands new workflows.
            - label: Integration complexity
              tone: risk
              detail: Multimodal, air-gapped, and custom deployments can slow standardization.
            - label: Compliance packet gaps
              tone: risk
              detail: ITAR, CUI, or CMMC diligence could surface more work than public materials suggest.
        - label: Low likelihood
          values:
            - label: Case-study metrics do not generalize
              tone: neutral
              detail: Some customer wins may be harder to repeat outside marquee accounts.
            - label: Acquisition distraction
              tone: neutral
              detail: Roadmap expansion may take time to integrate without changing the core thesis.
            - label: Formal compliance failure
              tone: risk
              detail: A serious export-control or security miss would be thesis-breaking despite lower base probability.
    claimRefs:
      - CR005
      - CR022
      - CR028
      - CR033
      - CR034
      - CR035
      - CR038
