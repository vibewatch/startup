      - number: '5.2'
        title: Architecture, edge deployment, and reliability model
        blocks:
          - type: paragraph
            body: >-
              Nominal discloses more architecture than most young industrial-software vendors. The live-streaming post
              breaks the user-visible path into ingest, compute, network, and render latency, then explains a bifurcated
              hot/cold pipeline: durable storage stays on, while a memory-backed hot path is activated only for live
              streaming. The same post describes incremental compute over new points only, websocket-based push
              delivery, browser workers, stitched appends, canvas rendering, graceful pod handoff, JVM warm-up, eventual
              consistency for out-of-order data, and adaptive back-pressure over unreliable links. Those details matter
              because they point to a product designed for test events where engineers must decide whether to continue,
              pause, or abort in real time. The edge-deployment write-up fills in the operating model around that
              architecture. Nominal says the system can run self-contained on rack servers or rugged laptops at remote
              sites, keep ingest, validation, and review local when connectivity is weak, and then synchronize data back
              to a central workspace without breaking schema or losing state. That maps well to AWS and Azure’s general
              edge-computing rationale around low latency, local processing, and intermittent networks. Connect’s own
              stack choices also fit the positioning. Nominal says it deliberately built the edge app as a desktop
              product and chose Rust, Bevy, and egui after shipping the product to customers for a year. Public Rust,
              embedded, Python, asyncio, and Rust-crate documentation do not prove Nominal’s implementation quality, but
              they do show the company is building on mature systems and scripting ecosystems that are appropriate for
              low-latency hardware-adjacent automation.
