      - number: '3.2'
        title: Capability Breadth and Distribution Power by Competitor Class
        blocks:
          - type: paragraph
            body: >-
              The capability map breaks cleanly by competitor class. NI and MathWorks remain closest to the engineer,
              especially where instrument integration, scripting, model-based design, or control-system analysis are
              already deeply embedded. Databricks and Palantir instead sit at the enterprise platform layer, where data
              governance, ontology, lakehouse architecture, and executive sponsorship matter more than test-specific
              workflow details. InfluxDB addresses real-time storage and time-series performance, but it is more often a
              component than a full collaborative engineering environment. PTC and Siemens come from the PLM and
              digital-twin world, where the decisive advantage is existing embedment in product-data governance. That
              distribution split matters because Nominal does not need to beat every competitor at their home game. It
              needs to be better at the specific handoff where high-volume hardware test data becomes searchable,
              shareable, and operationally useful across programs. This is also why some incumbents can remain in the
              account even after Nominal lands: their tools continue serving modeling, PLM, or enterprise data mandates
              while Nominal takes over the painful cross-program test workflow. Replacement often happens only in narrow
              slices first inside cautious engineering organizations. Review evidence on MATLAB reinforces the tradeoff:
              powerful tools and strong user loyalty coexist with price opacity and limited suitability as a broad
              collaborative platform.
