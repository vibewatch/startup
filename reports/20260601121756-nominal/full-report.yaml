  - id: FE001
    title: Product architecture map
    type: stack
    summary: Layered view of Nominal from hardware-adjacent edge control through shared cloud analysis and emerging AI.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE012
      - CE024
      - CE025
    data:
      layers:
        - id: edge-control
          label: Edge control and ingest
          detail: >-
            Connect runs as a desktop edge runtime near the hardware, reads and writes instruments, and executes
            repeatable Python-based tests.
        - id: local-visualization
          label: Local live visualization
          detail: >-
            Operators can inspect live data locally for low-latency workflows before or while synchronizing back to
            Core.
        - id: sync-layer
          label: Sync and schema continuity
          detail: >-
            Disconnected or intermittent sites keep state locally and later merge back into the central environment
            without schema breaks.
        - id: core-workspace
          label: Core collaborative workspace
          detail: >-
            Core provides shared storage, monitoring, analysis, reporting, and decision context across engineering
            teams.
        - id: analytics-layer
          label: Streaming and analysis services
          detail: >-
            Hot/cold ingest, incremental compute, websocket delivery, and rendering optimizations support live and
            historical review.
        - id: ai-layer
          label: Emerging AI overlay
          detail: Fid Labs extends the platform toward domain-expert AI built on top of structured engineering history.
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    summary: How teams move from edge capture to shared review, reporting, and next-test iteration in Nominal.
    claimRefs:
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
      - CE024
      - CE032
    data:
      nodes:
        - id: capture
          label: Capture at the asset
          description: >-
            Sensors, instruments, and domain-specific equipment feed Connect or Nominal ingest paths near the test
            asset.
        - id: align
          label: Align into one timeline
          description: >-
            Telemetry and adjacent context such as video, logs, ephemeris, or documents are synchronized for shared
            review.
        - id: monitor
          label: Monitor live operations
          description: Teams watch live runs, compare against expectations, and react during safety-critical test events.
        - id: analyze
          label: Analyze and compare history
          description: >-
            Engineers filter prior runs, compute derived signals, and investigate anomalies across assets and time
            windows.
        - id: collaborate
          label: Collaborate on findings
          description: Structured reviews, annotations, assignments, and shared links keep the investigation attached to the data.
        - id: report
          label: Report decisions
          description: Outputs become reusable engineering artifacts rather than disconnected screenshots or spreadsheets.
        - id: iterate
          label: Feed the next test cycle
          description: >-
            The same data backbone supports the next development or operational iteration instead of resetting the
            workflow.
      edges:
        - id: e1
          source: capture
          target: align
          label: Ingest and timestamp
        - id: e2
          source: align
          target: monitor
          label: Create live context
        - id: e3
          source: monitor
          target: analyze
          label: Persist for review
        - id: e4
          source: analyze
          target: collaborate
          label: Share findings
        - id: e5
          source: collaborate
          target: report
          label: Version decisions
        - id: e6
          source: report
          target: iterate
          label: Reuse in future tests
  - id: FE003
    title: Critical dependency map
