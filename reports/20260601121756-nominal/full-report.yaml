              domain resolves to an unrelated accounting-AI company, while the hardware company’s public materials sit
              on nominal.io. CB Insights then compounds the problem by attaching nominal.so to a different Nominal
              profile that reports only $29.2 million raised and a July 2025 $20 million Series A — facts that plainly
              conflict with Nominal’s disclosed $75 million Series B and $80 million B-2. This matters because valuation
              work on private companies often leans heavily on third-party databases for funding history, employee
              counts, and comparable sets. In Nominal’s case, those databases can mislead if entity identifiers are not
              reconciled first. Once that conflict is stripped out, the financial story is fairly clear: revenue quality
              looks promising because the product appears sticky, mission critical, and expansionary; margin path looks
              potentially strong because the company sells software rather than hardware; and financing risk looks
              manageable because recent capital is substantial. But the chapter still cannot answer the questions that
              ultimately determine conviction: absolute revenue, revenue mix, gross margin, CAC, retention, cash, burn,
