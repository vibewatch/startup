      capacity into growth durability.
    data:
      nodes:
        - id: R1
          label: ITAR / CUI / CMMC burden
          detail: Sensitive defense workflows require stronger controls and customer evidence.
          tone: risk
        - id: R2
          label: Deployment friction
          detail: Security reviews or access restrictions slow onboarding and expansion.
          tone: risk
        - id: R3
          label: Budget or CR delay
          detail: Programs tied to new starts or task orders move slower.
          tone: risk
        - id: R4
          label: Fewer live programs
          detail: Pilots or expansions convert later than expected.
          tone: risk
        - id: R5
          label: Legacy stack stays in control
          detail: Incumbent tools remain the true system of record.
          tone: risk
        - id: R6
          label: Lower share of wallet
          detail: Nominal lands as a wedge instead of the backbone.
          tone: risk
        - id: R7
          label: Support bandwidth strain
          detail: A small team must support more accounts and more compliance work.
          tone: risk
        - id: R8
          label: Growth durability weakens
          detail: Expansion becomes slower, lumpier, and more defense-dependent.
          tone: risk
      edges:
        - from: R1
          to: R2
