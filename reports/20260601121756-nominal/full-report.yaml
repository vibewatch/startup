  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation and entry discipline: track until recurring-software proof closes the valuation gap'
        blocks:
          - type: paragraph
            body: >-
              Nominal has assembled the kind of signal bundle that deserves continued investor attention: a March 2026
              financing at a $1 billion valuation, reported 7x revenue growth in ten months, more than sixty
              organizations using the platform, and direct evidence that the product is operating in real defense and
              autonomy workflows rather than in slideware pilots. The public proof is especially important because it is
              not just a logo list. Nominal cites four of the five largest defense contractors as customers, an Air
              Force Test Center IDIQ with a $53 million ceiling, a Navy collaborative-combat-aircraft support role,
              Anduril usage across test-and-evaluation programs, and Antares as an early industrial proof point. That
              combination is strong enough to justify a premium over mature industrial software and to keep the company
              firmly in a serious-investment bucket.


              The problem is entry price, not company quality. A $1 billion mark can describe two very different
              underwriting cases. In a premium-growth software frame, it implies only about $50 million to $83 million
              of ARR if investors are using 20x to 12x multiples. In a more mature industrial-software frame, the same
              valuation implies roughly $100 million to $167 million of ARR at 10x to 6x. Public software references
              therefore do not prove the round is wrong; they show that the hidden denominator matters enormously.
              Breakwater's framework also makes the same point from the opposite direction: fast growth and strong
              retention can justify premium ARR multiples, while concentration and weaker software quality force
              discounts.


              That is why the cleanest recommendation remains track. The evidence supports a real company with
              meaningful deployment proof and a plausible premium narrative, but public evidence still does not disclose
              ARR, retention, gross margin, burn, or cap-table terms. Without those inputs, the current price is best
              described as fair if Nominal already behaves like a premium recurring-software platform and stretched if
              it does not. The investor should stay engaged, treat the current round as the upper bound of disciplined
              entry for now, and only move toward a buy posture when recurring-software quality and concentration data
              prove the premium is earned rather than merely implied.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
