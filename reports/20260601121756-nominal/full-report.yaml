              Nominal's public customer profile is not the broad-logo SaaS pattern of hundreds of lightly engaged
              accounts. The company instead markets itself to mission-critical hardware teams that need secure
              telemetry, analysis, and automated testing across development, production, and operations. The clearest
              company-wide signal is its March 2026 statement that more than 60 organizations trust the platform,
              including four of the five largest defense contractors in the world. That claim is strategically powerful
              because it implies Nominal is already inside programs run by the most important prime contractors in
              defense, but it is also incomplete because the company does not identify which primes or what share of
              revenue they represent.


              What public evidence does identify is a customer set centered on serious engineering programs. Pratt
              Miller is a motorsports operator that also works in defense and new mobility, giving Nominal a
              commercially legible validation outside government procurement. Antares extends the proof set into nuclear
              and emerging energy, where test reliability, remote operation, and safety matter as much as they do in
              aerospace. The rest of the named roster stays close to defense and dual-use engineering: Anduril, HII, the
              Air Force Test Center, NAVAIR, Odys, and REGENT. In other words, the customer base is diversified by
              application domain but not by seriousness of workflow. These are not casual analytics buyers; they are
              teams using Nominal where delayed feedback slows a program, a production line, or a mission.
