      - number: '4.2'
        title: GTM Motion, Expansion Dynamics, and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Nominal’s public go-to-market profile looks much closer to mission-critical enterprise infrastructure than
              to product-led software. The named customers and partner references cluster around organizations with
              complex hardware programs, high consequence of failure, and long procurement or validation cycles: the
              U.S. Air Force, Anduril, Shield AI, Mach, Forterra, HII, REGENT, Odys Aviation, Pratt Miller, and Antares.
              That customer list implies a high-touch sales motion with security, integration, and credibility hurdles,
              but it also implies larger contract potential and strong reference value once a program is won. The
              strongest positive signal is the company’s own description of account expansion: engineers start on one
              program and then pull Nominal into the next one. That is a classic land-and-expand pattern, and it matters
              more here than any missing CAC statistic because it suggests the product becomes operational
              infrastructure once embedded in the test loop. Investor commentary reinforces the point. Founders Fund led
              the B-2 after reported pull from Anduril and other portfolio teams, while Lightspeed and Sequoia both
              frame Nominal as a category-defining continuous test stack. None of that substitutes for hard CAC or
              payback data, but it does provide a reasonable public proxy for efficient early distribution:
              founder-market fit, portfolio referrals, lighthouse customers, and measurable customer ROI around faster
              test cadence and less manual analysis.
