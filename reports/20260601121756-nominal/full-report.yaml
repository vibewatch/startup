      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed financing is strong even by venture-backed infrastructure standards. In June 2025,
              Nominal announced a $75 million Series B led by Sequoia. Less than a year later, it announced an $80
              million B-2 extension led by Founders Fund at a $1 billion valuation. Those two rounds alone add to $155
              million of recent primary capital, and the 2026 materials explicitly tie the new money to product
              development, global expansion, strategic acquisitions, and adjacent business lines. That capital base
              materially reduces near-term survival risk for a software company with 135 employees, but it does not
              eliminate financing dependency as a diligence topic because the most important variables — cash on hand,
              monthly burn, runway, and any debt or lease obligations — remain undisclosed. The likely interpretation is
              that Nominal raised ahead of need to accelerate rather than rescue, especially given the preemptive
              framing of the B-2, but that remains an interpretation rather than a modeled conclusion. The company is
              ambitious enough that strong capitalization and meaningful capital requirements can both be true at the
              same time: expanding internationally, widening product scope, and pursuing acquisitions can consume
              capital quickly even in software. So the verdict is positive but incomplete. Recent funding strength is
              real; underwritten runway is not yet public.
