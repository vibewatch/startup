      - number: '4.2'
        title: 销售推进、扩张动力和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Nominal 的公开市场进入画像更接近任务关键型企业基础设施，而不是产品驱动软件。具名客户和合作伙伴引用集中在一类组织：硬件项目复杂、失败后果高、采购或验证周期长，包括美国空军、Anduril、Shield
              AI、Mach、Forterra、HII、REGENT、Odys Aviation、Pratt Miller 和
              Antares。这个客户名单意味着高接触销售动作，需要跨过安全、集成和可信度门槛；但它也意味着更大的合同潜力，以及项目拿下后的强背书价值。最强的正面信号来自公司对账户扩张的描述：工程师先在一个项目上使用产品，然后把
              Nominal 拉进下一个项目。这是典型的先落地、再扩张模式，在这里比任何缺失的 CAC 统计都更重要，因为它暗示产品嵌入测试循环后会变成运营基础设施。投资人评论也强化了这一点。据报道，Founders Fund
              在 Anduril 和其他被投团队的拉动后领投 B-2；Lightspeed 与 Sequoia 都把 Nominal 定义为品类定义型的连续测试栈。这些都不能替代硬 CAC
              或回本数据，但能提供一个合理的公开代理指标，说明早期分发效率：创始人与市场匹配、被投公司推荐、灯塔客户，以及围绕更快测试节奏和更少人工分析的可测客户 ROI。
