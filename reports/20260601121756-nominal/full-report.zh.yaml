        title: 资本形成、投资人和早期牵引
        blocks:
          - type: paragraph
            body: >-
              Nominal 的融资节奏快得异常。公司在 2025 年宣布由 Sequoia 领投的 $75 million Series B，不到一年后又宣布由 Founders Fund 领投、估值 $1 billion
              的 $80 million Series B-2 加速轮。独立报道和投资人评论把这两轮描述为大约 10 个月内注入的 $155 million
              新资本，核心投资人组合反复出现：Sequoia、Lightspeed、Lux Capital、General Catalyst，之后又加入 Founders Fund 和 Red
              Glass。关键不只是金额，而是速度和背景：TechCrunch、National Law Review 和 Sourcery 都把 B-2 描述为一轮预防性融资，催化因素是 Anduril
              等偏国防的被投公司带来的强客户拉力。Nominal 同时给出强但仍主要由公司披露的经营信号——收入同比增长 7x、平台上有 60+ 家组织、五大国防承包商中有四家为客户，团队据称在五个城市扩至 135
              人，达到此前三倍。这足以确认动能，但还不足以精确锁定收入规模或员工数。
