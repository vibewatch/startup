        - 每次事件后，团队把多个工具、文件和仪表盘拼在一起
        - 将遥测、视频、日志、PDF 和空间上下文摄入同一个可搜索资料库，并支持历史对比和流式检查清单
        - 官方航空材料称，测试节奏可快一个数量级，历史对比也更容易
        - 需要按测试量和团队规模拆分的独立基准细节。
