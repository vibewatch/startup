          - type: paragraph
            body: >-
              其余风险来自 Nominal 当前牵引力看起来高度集中且专业化。公司最强的证据仍集中在国防和国家安全项目；Antares 和 REGENT
              更像早期相邻切口，而不是已充分多元化的工业客户基础。因此，客户集中度和商业收入组合是核心尽调项，不是边缘问题。工具链风险同样重要。NI 称其服务全球顶尖航空航天和国防组织中的 85%，MathWorks 称
              MATLAB 和 Simulink 仍嵌在复杂航空航天和国防系统的开发、认证、部署和可视化流程中。Nominal
              仍可在这些生态内拿份额，但更可能靠共存、集成和逐步扩张，而不是立刻替代。人才风险会放大问题。RAND、CSET 和 GAO 都描述了国防 AI 和软件劳动力市场仍难以识别、招聘和持续培养。原因在于 Nominal
              卖的不是席位；它同时支撑敏感项目、客户评审、数据管道，以及许多场景里的定制集成界面。商业化故事是最后的不确定性。HBR 的 2026 SaaS 分析认为，在 AI
              驱动的市场里，供应商必须证明自己拥有差异化的汇聚数据和判断力，才能避免客户内部重建或更换供应商。Nominal
              也许最终能越过这条线，但在非国防生产账户更可见之前，投资人应主要把它按一个国防集中型基础设施公司来承销，其扩张带来上行，而不是把它视为已被广泛验证的工业软件平台。
