  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 排序后的风险视图和打破投资逻辑的框架
        blocks:
          - type: paragraph
            body: >-
              Nominal 的风险组合之所以有吸引力，恰恰因为公司很快拿到了真实的国防相关性。最强的公开证明来自最难的运营环境：Air Force 测试基础设施、DARPA 数字孪生项目、Navy 自主飞机测试，以及包括
              Anduril、HII、Forterra 和 Mach
              在内的主承包商或国防科技项目。这意味着排名第一的风险不是需求生成，而是合规和信任。一个为敏感的政府邻近项目处理测试数据、遥测、日志、视频和安全部署的平台，可能比传统横向 SaaS 工具更快进入 ITAR
              技术数据规则、CUI 处理义务、客户安全审查，甚至涉密边界问题。第二大风险是集中度。Nominal 称五大国防承包商中有四家使用该平台，且 60+
              家组织把敏感项目托付给它；但这些信号也意味着，少数主承包商、实验室或项目办公室可能解释近期预订额的大部分。第三大风险是运营复杂度：Anduril 案例显示 Nominal
              已支持多模态数据、边缘处理，以及艰苦或接近涉密的环境，这有力证明了产品价值，也证明实施负担可能陡增。第四是人员和执行风险。一个 135
              人团队同时扩张合同、安全预期和产品表面。第五是商业渗透风险。公开非国防证明存在，但 HBR 2026 年关于 AI 将重置许多工作流软件品类预期的论点，会抬高任何试图从高信任国防楔子向外扩张的公司的门槛。
