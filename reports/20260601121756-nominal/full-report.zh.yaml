  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律：先观察，等经常性软件证据补上估值缺口
        blocks:
          - type: paragraph
            body: >-
              Nominal 已经拼出一组值得投资人持续关注的信号：2026 年 3 月以 $1 billion 估值融资，据报道 10 个月收入增长 7x，超过 60
              个组织使用平台，并且有直接证据表明产品跑在真实国防和自主系统工作流里，而不是停留在 PPT 试点。公开证据尤其重要，因为它不只是 logo 清单。Nominal 称，客户包括五大国防承包商中的四家、上限 $53
              million 的 Air Force Test Center IDIQ、Navy 协同作战飞机支持角色、Anduril 在测试与评估项目中的使用，以及作为早期工业证据的
              Antares。上述组合足以支撑相对成熟工业软件的溢价，也足以让公司稳稳留在严肃投资池。


              问题在入场价格，而不是公司质量。$1 billion 标记可以对应两种很不一样的承销情景。在高增长软件框架下，如果投资人采用 20x 到 12x 倍数，它只意味着约 $50 million 到 $83
              million ARR。在更成熟的工业软件框架下，同一估值按 10x 到 6x 计算，则意味着大约 $100 million 到 $167 million
              ARR。因此，公开软件参照并不能证明本轮定价错误；它说明隐藏分母极其关键。Breakwater 的框架也从反方向指出同一点：高速增长和强留存可以支撑高溢价 ARR 倍数，而集中度和较弱的软件质量会迫使折价。


              因此，最干净的建议仍是观察。证据支持 Nominal 是一家真实公司，已有有意义的部署证据，也有可成立的溢价叙事；但公开材料仍未披露
              ARR、留存、毛利率、烧钱速度或股权结构条款。缺少这些输入，当前价格最好理解为：如果 Nominal
              已经像高溢价经常性软件平台那样运行，价格合理；如果没有，则估值偏高。投资人应保持接触，暂时把当前轮视为纪律性入场的上限，只有当经常性软件质量和集中度数据证明溢价是挣来的、而非仅被暗示时，才转向买入姿态。
