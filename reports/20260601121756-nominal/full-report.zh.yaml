      - number: '4.3'
        title: 成本结构、利润率路径和资本强度
        blocks:
          - type: paragraph
            body: >-
              公开证据足以勾勒 Nominal
              的成本结构，但不足以建模。正面看，公司显然卖的是软件和数据基础设施，而不是硬件库存，营运资金需求应远低于其客户。没有迹象显示它有工厂、库存融资或项目制造风险；核心资产看起来是软件产品、领域经验和部署可信度。这支撑了一个合理的软件式长期毛利率轮廓。问题在于，Nominal
              不是轻量横向应用。Connect
              在边缘运行，直接与仪器交互，并支持可重复控制逻辑。客户证明覆盖测试台、运营、自主系统和生产环境，这些通常比纯云仪表盘需要更多实施、现场支持和解决方案工程投入。换句话说，Nominal
              的资本强度可能低于硬件公司，但交付复杂度高于标准 B2B SaaS
              供应商。最合理的公开财务解读是：毛利率终点不错，当前毛利率现实不确定。如果服务和部署劳务大多前置，账户跨项目扩张后利润率可以漂亮地提升。如果服务负载持续存在，收入质量仍好，但会比标题里的增长故事更不像纯软件。
