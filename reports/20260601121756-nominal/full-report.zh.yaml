    sections:
      - number: '1.1'
        title: 身份、创始故事和产品论点
        blocks:
          - type: paragraph
            body: >-
              Nominal 由 Cameron McCord、Bryce Strauss 和 Jason Hoch 于 2022 年在洛杉矶创立，创始故事和公司选择攻入的品类异常贴合。公司公开材料和投资人材料把 McCord
              描述为前美国海军军官，后来在 Anduril 做测试软件；Strauss 和 Hoch 则带来 Lockheed Martin 以及 Palantir/Vercel
              背景。从官网、关于页面到投资人文章，公司对问题的表述高度一致：现代硬件团队仍把太多任务关键测试数据塞进碎片化脚本、电子表格、实验室工具和定制管线里。Nominal 的回应是一套连接式软件组合，横跨 Nominal
              Core 和 Nominal Connect；Core 充当面向遥测、日志、视频和仿真数据的协作云工作区或安全环境工作区，Connect
              则是自动化测试控制和可重复仪器工作流的边缘运行时。公司、投资人和媒体口径保持一致，让这家年轻私营创业公司的基本身份叙事少见地完整。本章因此有了清晰锚点：Nominal
              卖的不是通用分析，而是面向物理系统测试工程师的专用基础设施，速度、安全和可审计性在这些场景里都很关键。
