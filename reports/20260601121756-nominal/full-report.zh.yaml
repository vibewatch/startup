      - number: '2.3'
        title: 增长驱动、监管顺风和采用摩擦
        blocks:
          - type: paragraph
            body: >-
              这个品类受益于几股强顺风，但每股顺风都带着现实约束。数字工程和软件现代化已嵌入国防采购政策，DAU 和 DoD 材料强调迭代式软件交付、数据驱动分析和现代化速度。CMMC 与 DFARS
              的执行进一步抬高门槛，把项目数据的安全处理变成采购要求，也提升了可提供可追踪、可审计工作流的供应商价值。NIST 的网络和智能制造工作，加上航空航天里的 FAA
              审批流程，也强化了同一核心需求：可信、留痕、安全的工程数据。与此同时，让市场有吸引力的特征也会放慢采用。集成负担、漫长采购周期、安全审查、技能短缺，以及云原生工具和隔离环境之间的张力，都让这个市场比普通企业
              SaaS
              更慢，也更吃运营能力。这些约束解释了为什么即便工作流痛点明显，既有厂商和定制内部工具仍能延续，尤其是现有测试栈虽不好用但足够可预测。结果是一个规模大、结构性改善的市场；其经济性更偏向能把产品深度和监管信任结合起来的供应商，而不是简单挂靠最大
              IIoT 数字的公司。
