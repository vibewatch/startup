      - number: '3.3'
        title: 切换成本、多栈并用和 Nominal 的护城河问题
        blocks:
          - type: paragraph
            body: >-
              当客户不想再要一个通用平台，却需要面向硬件测试数据的专用工作流时，Nominal 的护城河论点最强。由此形成一条务实的先落地、再扩张路径：MATLAB、LabVIEW、PLM 或数据湖在能工作的地方继续保留，再把
              Nominal 加到那个需要更快采集、分析和协作的痛点工作流上。因此，多栈并用不是失败模式，而是很可能的采用形态。风险在于，既有厂商仍掌握实质权力来源。NI 有仪器和测试台架装机基础。MathWorks
              有受训用户和工具箱。Databricks 与 Palantir 有高管关系和企业预算。PTC 和 Siemens 搭着标准化数字线程和 PLM 流程。InfluxDB 以及内部 Python 或
              lakehouse 栈，则为愿意自建的团队提供可信的低端替代。换句话说，Nominal
              不只需要更好的产品手感；它还需要足够可测量的工作流优势，才能让保守工程环境里的组织变革变得值得。公开证据尚未给出一组清晰的赢单/输单案例，来证明 Nominal
              能持续击败这些替代方案。目前最稳妥的结论是，Nominal 确实有差异化，但竞争耐久性取决于这种工作流优势能否比既有信任和内部自建习惯更快复利。
