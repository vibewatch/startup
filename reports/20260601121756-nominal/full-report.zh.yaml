      - number: '5.3'
        title: 差异化、成熟度和信任姿态
        blocks:
          - type: paragraph
            body: >-
              最清楚的差异化信号，是 Nominal 试图端到端掌握硬件数据工作流，而不只是做一个可视化终端。Fundamentals 文章明确把产品定位为对团队超出 CSV、拼凑仪表盘和碎片化遥测栈承载能力后的回应；Fid
              Labs 公告进一步延伸这个论点，认为只有底层数据供应链被捕获、规范化并协作化之后，有用的 AI
              才会出现。因此，当前成熟度图景不均匀，但能理解。Core、Connect、实时监控、同步多模态复盘和断连边缘运行，在公开记录里都像是已交付或正在积极部署的能力。AI
              层更偏方向性：公司有清晰论点，也有与之匹配的收购，但没有保留下来的公开 GA
              规格来说明模型边界、权限、评估或人工干预控制。信任与合规披露也明显落后于部署野心。边缘和产品材料支持安全设施和低连接场景，通用联邦材料解释了为什么低延迟本地处理和正式授权路径对国防买方重要。但这组来源材料没有提供
              Nominal 信任中心、公开认证矩阵、详细支持或事故承诺，也没有给出既有工具的原生集成清单。落实到尽调，结论是工作流和架构故事可信；集成深度、保障材料和 AI 运行控制仍需要进入客户侧数据室直接验证。
