    data:
      layers:
        - id: edge-control
          label: 边缘控制与摄取
          detail: Connect 作为桌面边缘运行时在硬件附近运行，读取和写入仪器，并执行可重复的 Python 测试。
        - id: local-visualization
          label: 本地实时可视化
          detail: 在同步回 Core 之前或同时，操作员可在本地查看实时数据，服务低延迟工作流。
        - id: sync-layer
          label: 同步与 schema 连续性
          detail: 断连或间歇联网的站点将状态保留在本地，之后无 schema 断裂地合并回中心环境。
        - id: core-workspace
          label: Core 协作工作区
          detail: Core 为工程团队提供共享存储、监控、分析、报告和决策上下文。
        - id: analytics-layer
          label: 流式处理与分析服务
          detail: 冷热数据摄取、增量计算、websocket 交付和渲染优化支撑实时与历史复盘。
        - id: ai-layer
          label: 新兴 AI 覆盖层
          detail: Fid Labs 将平台延展到领域专家 AI，建立在结构化工程历史之上。
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    summary: 团队如何在 Nominal 中从边缘采集走向共享复盘、报告和下一轮测试迭代。
    claimRefs:
      - CE006
      - CE007
      - CE009
      - CE010
      - CE011
      - CE024
      - CE032
    data:
      nodes:
        - id: capture
          label: 在资产端采集
          description: 传感器、仪器和领域专用设备在测试资产附近接入 Connect 或 Nominal 摄取路径。
        - id: align
          label: 对齐到同一时间线
          description: 遥测以及视频、日志、星历或文档等相邻上下文同步到一起，用于共享复盘。
        - id: monitor
          label: 监控实时运行
          description: 团队观看实时运行，对照预期，并在安全关键测试事件中响应。
        - id: analyze
          label: 分析并对比历史
          description: 工程师筛选过往运行，计算衍生信号，并跨资产和时间窗口排查异常。
        - id: collaborate
          label: 围绕发现协作
          description: 结构化复盘、标注、任务分派和共享链接，让调查始终挂在数据上。
        - id: report
          label: 报告决策
          description: 输出变成可复用的工程工件，而不是割裂的截图或电子表格。
        - id: iterate
          label: 反哺下一轮测试周期
          description: 同一数据骨干支撑下一次开发或运营迭代，而不是重置工作流。
      edges:
        - id: e1
          source: capture
          target: align
          label: 摄取并打时间戳
        - id: e2
          source: align
          target: monitor
          label: 创建实时上下文
        - id: e3
          source: monitor
          target: analyze
          label: 沉淀供复盘
        - id: e4
          source: analyze
          target: collaborate
          label: 分享发现
        - id: e5
          source: collaborate
          target: report
          label: 版本化决策
        - id: e6
          source: report
          target: iterate
          label: 复用于后续测试
