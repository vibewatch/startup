  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - $180M-$240M ARR、国防品类领导地位、可见工业扩张，以及持续平台溢价。
        - 使用大约 12x-15x ARR 得出 $2.2B-$3.6B EV；前十分位执行路径可支撑 3B+ 结果。
        - 工业扩张停滞、收购失手，或公开市场倍数在规模达成前压缩。
        - ~25%
      - - 基准
        - $60M-$90M 前瞻 ARR、快速但放缓的增长、持续国防转化，以及足以守住溢价软件地位的留存。
        - 使用相对工业软件的混合溢价得出 $1.0B-$1.4B EV；当前价格可以守住，但并不明显便宜。
        - 客户集中、采购延迟或低于预期的留存侵蚀溢价。
        - ~45%
      - - 悲观
        - 增长向成熟工业水平回归，投资人按 6x-8x ARR 给企业估值，工业贡献有限。
        - 如果 ARR 明显低于隐含区间，或退出仍稀缺，$0.7B-$0.9B EV 的下行会很快出现。
        - 国防预算执行、“死亡谷”风险和有限退出流动性叠加。
        - ~30%
    notes: 所有区间都是分析估计，不是管理层指引。它们锚定公开可比公司区间、据报道的 7x 增长信号，以及缺少经常性软件 KPI 披露这一事实。
