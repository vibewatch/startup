  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算逻辑
        blocks:
          - type: paragraph
            body: >-
              评估 Nominal 时不应把整个工业 IoT
              宇宙都算进去，也不该把它压成通用测试软件的小众角落。更合适的边界，是硬件团队捕获测试数据、跨仪器和运行同步数据、近实时分析、自动化可重复验证，并保留可审计记录以反哺设计和运营的那层软件。它位于几个更大品类内部——工业
              IoT、IoT 分析、IoT 测试和数字工程软件——同时排除大量无关硬件、通用云存储或宽泛企业系统支出。公开市场报告说明了为什么边界纪律很重要：广义工业 IoT 市场达到数千亿美元，IoT
              分析是数百亿美元，IoT 测试落在低个位数十亿美元，IIoT 平台软件则是更窄的低十几亿美元切片。因此，市场定义问题是战略问题，不是修辞问题；投资人和运营者很容易把永远不会流向工作流软件供应商的支出导入
              TAM。对 Nominal 而言，最有决策价值的结论不是一个巨大的 TAM 标题，而是大约 $5 billion 到 $20 billion
              的受限软件层区间——足够支撑大公司，又小到工作流贴合度和信任仍决定赢家。
