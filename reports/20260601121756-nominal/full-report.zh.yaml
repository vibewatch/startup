  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局形态：碎片化，不是赢家通吃
        blocks:
          - type: paragraph
            body: >-
              Nominal 竞争格局里最重要的结论，是市场上没有一个叙事完全一一对应的干净同类公司。公司实际上穿行在几个成熟品类之间，每个品类都掌握既有工作流的一部分。NI 和 MathWorks
              主导传统台架级测试与工程分析。Databricks 和 Palantir 进攻企业数据和 AI 层。InfluxDB 以时序数据组件参与竞争。PTC 和 Siemens 则扎在 PLM
              与数字线程治理已经重要的地方。这意味着 Nominal 通常面对的是工具组合和内部胶水代码，而不是一个打包好的单一替代品。战略上，这既是好事也是坏事。好处是，单个供应商逐项功能压倒 Nominal
              的概率下降；坏处是，客户常能把熟悉的栈缝起来，虽然次优，却受组织信任，从而推迟改变。品类地图也解释了为什么采购语言会不一致：有些买方把问题叫测试自动化，有些叫工程分析，还有些把它当成数字线程或数据基础设施。语言分散让品类所有权格外难拿。这个格局因此足够碎片化，能造出空白；也足够拥挤，让切换成本保持真实。
