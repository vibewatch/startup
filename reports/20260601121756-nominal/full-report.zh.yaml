  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 或留存披露低于溢价情景
        - 披露的 ARR 显著低于约 $60M 前瞻等价水平，或留存太弱，支撑不起溢价软件叙事。
        - 当前 $1B 估值标记不再像合理的溢价软件定价，而开始像一轮偏紧融资。
        - 不在当前价格以上追加资本；按更低估值区间重新承保。
      - - 客户集中度过高
        - 少数国防主承包商或项目主导收入，工业补位有限。
        - 即便增长仍稳健，Breakwater 的集中度折价也会压缩退出倍数。
        - 在承保完整溢价前，要求集中度和合同期限数据。
      - - 合规或采购摩擦导致政府转化停滞
        - SBIR、所有权、供应链或合同问题，拖慢从试点走向生产项目。
        - 公司保住客户名，却丢掉支撑基础设施倍数的耐久收入转化。
        - 暂停，直到合规姿态和生产转化被证明。
      - - 工业扩张仍停留在叙事层
        - 到 2027 年，非国防垂直仍主要是灯塔客户背书，而不是经常性 ARR 贡献者。
        - 业务仍是更狭窄的国防工具故事，失去通向 $3B+ 多元化的路径。
        - 持有或下调预期，转向更接近基准或悲观情景的国防单一退出框架。
    notes: 这些是投资逻辑破裂条件，不是预测。每一项都直接攻击让 $1 billion 价格成立的分母或倍数。
    claimRefs:
      - CV022
      - CV037
      - CV039
      - CV041
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经常性软件质量
        - 当前 ARR、NRR、毛利率，以及按队列划分的烧钱速度
        - 这是判断当前倍数合理还是偏紧的最大单一因素。
        - CFO + 董事会材料 + 队列 KPI 复核
      - - 客户集中度
        - 前 20 大客户 ARR、国防与工业收入结构、合同期限和续约机制
        - 即便产品很强，收入基础集中也会压缩退出。
        - 销售运营导出 + 客户成功续约分析
      - - 资本结构
        - 投资条款书、优先股堆叠、期权池变化，以及任何老股定价
        - 如果清算优先权包袱很重，名义估值可能高估普通股价值。
        - 财务 / 法务数据室复核
      - - 政府转化
        - 从 SBIR/IDIQ 和演示进入经常性生产收入的管道
        - 国防证明只有变成可重复软件收入，而不是一次性项目工作，才有力量。
        - 联邦 GTM 复核 + 已预订与管道分析
      - - 工业规模化
        - 工业队列收入、收购路线图和跨垂直产品附加率
        - $3B+ 情景需要更宽的品类形成，而不只是更深的国防渗透。
        - CEO/战略复核 + 产品路线图尽调
    notes: 表中每一行都对决策关键，因为开放项要么影响 ARR 分母，要么影响 ARR 质量，要么影响退出时可能适用的倍数。
    claimRefs:
      - CV016
      - CV037
      - CV042
      - CV043
