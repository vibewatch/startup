      - number: '4.4'
        title: 资本充足性和融资依赖
        blocks:
          - type: paragraph
            body: >-
              按风险投资支持的基础设施公司标准看，公开披露融资也很强。2025 年 6 月，Nominal 宣布由 Sequoia 领投的 $75 million Series B。不到一年后，公司又宣布由 Founders
              Fund 领投的 $80 million B-2 扩展轮，估值 $1 billion。仅这两轮就合计带来 $155 million 近期新股资本；2026
              年材料明确把新资金用于产品开发、全球扩张、战略收购和相邻业务线。对一家 135
              人的软件公司而言，这个资本基础显著降低短期生存风险；但它没有让融资依赖退出尽调议题，因为最关键变量——账上现金、月度烧钱、现金跑道以及任何债务或租赁义务——仍未披露。较可能的解读是，Nominal
              在需求前提前融资以加速，而不是救急，尤其考虑到 B-2
              的预防性表述；但这仍是解读，不是建模结论。公司野心足够大，强资本化和有意义的资本需求可以同时成立：国际扩张、产品范围变宽、收购都会在软件公司里快速吃掉资本。因此结论是正面但不完整。近期融资强度真实；经承销的现金跑道还未公开。
