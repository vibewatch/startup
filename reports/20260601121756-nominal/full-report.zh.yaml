      - number: '6.3'
        title: 耐久性有依据，但公开留存和集中度数据仍是最大客户缺口
        blocks:
          - type: paragraph
            body: >-
              Nominal 的公开客户证明，在工程结果上强于经济耐久性。对一家私营工业软件公司而言，案例研究少见地具体：Anduril 量化了 40x 更快摄取和 300+ 用户覆盖，Odys 报告每天测试飞行次数增加
              43%，REGENT 把多天复盘压缩到几分钟，HII 把产品与更快分析和更短生产测试步骤相连。这些是工作流平台应该呈现的信号，因为它们暗示产品贴近每个项目的决策核心。但已审阅的公开材料没有披露
              NRR、GRR、流失、标准合同期限、定价或头部客户集中度。只靠外部证据，很难把运营粘性转化为耐用收入模型。


              风险在国防领域最高。如果五大国防承包商中确实有四家使用 Nominal，这些账户价值极高；但公司没有披露是哪几家，也没有说明收入如何在它们之间分布。行业逆风也重要。WTW 强调采购摩擦和预算时点缺口，GAO
              则指出更广泛的国防工业基础依赖庞大供应商网络，供应链风险不小。这些摩擦不会抵消 Nominal
              的客户牵引，但会放慢技术赢单转化为可重复企业收入的速度。因此，正确的尽调请求很直接：在把客户耐久性视为完全承销之前，要求披露头部客户 ARR
              集中度、按项目队列续约，以及软件订阅收入与服务占比高的部署之间的清晰拆分。
