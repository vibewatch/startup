      - number: '2.2'
        title: 买方分层、用户和预算池
        blocks:
          - type: paragraph
            body: >-
              Nominal
              这类软件的需求中心并不在各行业均匀分布。在国防和航空航天领域，买方通常是总工程师、项目办公室、测试负责人或软件采购负责人，他们需要在安全数据处理下更快完成验证。在能源、汽车和先进制造领域，同一个底层问题会出现在工厂工程、制造质量、可靠性和数字化转型团队里。跨这些细分市场，日常用户是最靠近硬件的工程师和操作员；付款方则可能在
              R&D、工程项目、数字工程预算、运营现代化和合规之间切换。这一点重要，因为市场进入动作通常先从一个痛点很强的项目、测试单元或任务系统开始，再扩展到更大的预算。实际看，这个品类更像基础设施式的先落地、再扩张，而不是自上而下的平台替换。账户内部的切换通常先靠一个痛苦工作流上的证明推进。Nominal
              最好的早期细分仍是测试节奏高、失败代价大、数据碎片化已经拖慢项目速度的地方——国防主承包商、航空航天 OEM、能源运营商、汽车性能团队和先进制造商。由 APAC 拉动的广义 IIoT 增长是真实的，但
              Nominal 近期可落地的 SAM 更集中在北美和欧洲，那里受监管、任务关键的硬件项目最密集。
