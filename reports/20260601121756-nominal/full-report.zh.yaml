      - number: '8.3'
        title: 情景、退出准备度和尽调触发点：上行存在，但举证责任仍在前方
        blocks:
          - type: paragraph
            body: >-
              基准情景并不激进，但要求仍超过公开记录可验证范围。要让当前 $1 billion 标记站得住，Nominal 大概率需要落在约 $60 million 到 $90 million 远期 ARR
              区间，同时保持异常强的增长和软件式留存。乐观情景难度明显更高：$3 billion 以上结果大概需要更接近 $180 million 到 $240 million ARR，继续享有 12x 到 15x
              的高溢价倍数，并有清晰证据证明工业扩张正在变成真实收入，而不是战略愿望。悲观情景更简单。如果增长正常化、工业扩张仍然单薄，或市场把公司按更成熟的工业软件定价，下行会很快出现，因为支撑当前轮所需分母会迅速抬升。


              因此，退出准备度是混合的。PTC-ServiceMax 例子说明，战略买家会为能闭合有价值工业数据循环的工作流软件付费，所以长期 M&A 逻辑真实存在。但 S&P 的 2026
              年国防科技研究提醒，充裕的风险投资不一定带来充裕的退出流动性，尤其在 M&A 放缓时。Goodwin
              补上运营层面的警示：国防公司仍要面对原型到生产的死亡谷、所有权和合规摩擦，以及供应链约束；即便已有早期客户证据，这些因素也可能打断扩张。因此，新投资人应把 Nominal
              承销为一家有真实战略潜力、但退出路径尚未充分去风险的公司，还不足以支持以当前估值入场。


              这直接引向尽调和投资逻辑失效点。如果管理层能展示当前 ARR、留存、毛利率、客户集中度，以及国防项目向经常性生产收入的转化，投资案例会明显改善。如果披露 ARR
              明显低于基准情景区间，如果一两个国防项目主导收入基础，如果政府转化卡在采购或合规瓶颈，或如果非国防扩张只停留在叙事层面，投资逻辑会迅速走弱。在这些问题回答前，上行情景应被视为真实但有条件，而不是已经挣来的价格支撑。
