      - number: '8.2'
        title: 可辩护区间落在高溢价工业软件与 Palantir 例外级天花板之间
        blocks:
          - type: paragraph
            body: >-
              可比公司组有用，因为它同时给出地板，也提醒不要偷懒类比。PTC 是成熟工业软件的地板：一家任务关键软件公司，利润率强、工作流嵌入深，但估值仍大致落在中个位数 EV/Sales 区间。Samsara
              是更相关的高溢价基准，因为它展示了规模化物理运营软件在同时具备强增长、可观 ARR 和可信数据护城河时能拿到什么估值；约 11.9x EV/Sales 代表 Nominal
              需要接近的公开市场区域，当前价格才会显得明显有吸引力。Palantir 是天花板情景。它证明公开市场投资人有时会为国防级数据平台支付异常高倍数，但 Palantir 也有 AI
              叙事、规模和嵌入深度，Nominal 目前还没有这些。


              ServiceMax 有助于把这个区间翻译成战略价值逻辑。PTC 以 $1.46 billion 收购 ServiceMax，是因为生命周期和现场服务软件能闭合数据循环，并对工业运营方产生战略价值。Nominal
              也适用这一点，因为它最好的长期故事不只是测试数据可视化，而是成为连接严肃硬件项目开发、验证和现场运营的运营真相层。如果 Nominal
              到达系统记录位置，相对成熟工业软件的溢价就有理由成立。如果它仍是一个更窄的高价值工具层，倍数就应向工业软件地板回落。


              实际结论是，当前估值标记不能只靠 Palantir 式上行来支撑。公开证据支持一个区间：Nominal
              比成熟工业软件在位者更值得给分，但仍需证明自己属于高溢价区间顶部。问题因此不是有没有溢价，而是公司基于公开证据已经挣到了多少溢价。
