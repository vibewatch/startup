companyProfile:
  summary: >-
    Nominal 是一家位于洛杉矶的硬件测试数据智能公司，由 Cameron McCord（CEO，前美国海军、前 Anduril）、Bryce Strauss 和 Jason Hoch 于 2022
    年创立。公司的平台——Nominal Core 和 Nominal Connect——打通国防主承包商和先进制造商内部割裂的测试数据系统，让工程师能实时协作、搜索并分析硬件测试结果。Nominal 于 2026 年 3 月完成由
    Founders Fund（Trae Stephens）领投的 $80 million 融资，估值 $1 billion（Series B-2），Sequoia Capital、Lux Capital 和 General
    Catalyst 参投。公司称上一轮以来收入增长 7x，并表示全球 5 大国防承包商中的 4 家已在其平台上运行。
