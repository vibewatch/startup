  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful 2026 public and transaction references for Nominal: a defense-data premium
        ceiling, an industrial-operations benchmark, a mature industrial floor, strategic field-service M&A, and sector
        baskets that bracket industrial versus public-sector software.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Palantir
        - 上市公司 EV/Sales / LTM 收入
        - 约 70.34x EV/Sales，基于约 $5.22B LTM 收入
        - 显示国防级数据平台在品类领导地位和 AI 叙事叠加时，重估空间可以有多大。
        - 太成熟、也太特殊，不能作为 Nominal 基准情景倍数。
      - - Samsara
        - 上市公司 EV/Sales / ARR
        - 约 11.88x EV/Sales，基于 $1.62B 收入和 $1.9B ARR
        - 这是高溢价实体运营软件的最佳上市公司基准，且具备真实数据护城河经济性。
        - 与 Nominal 相比，国防暴露更低、商业多元化更高。
      - - PTC
        - 上市公司 EV/Sales
        - 约 5.66x-6.2x EV/Sales，基于约 $3.0B LTM 收入
        - 可作为成熟工业软件底部参考，特点是高利润率和关键任务工作流。
        - 增长慢得多，公司也比 Nominal 成熟得多。
      - - ServiceMax / PTC 交易
        - 战略 M&A / 年软件收入
        - $1.46B 收购；为 PTC PLM 品类新增约 $148M 年软件收入
        - 显示战略买家会为以资产为中心、能闭合生命周期数据回路的工作流软件付钱。
        - 这是不同买方环境下的历史交易，不是直接上市公司倍数。
      - - Multiples.vc 工业软件篮子
        - 板块篮子收入倍数
        - 约 3.4x 收入和约 11.7x EBITDA
        - 定义 2026 年 5 月工业软件的估值重心。
        - 篮子均值可能低估增长更强或具备政府溢价的细分公司。
      - - Multiples.vc 公共部门软件篮子
        - 板块篮子收入倍数
        - 约 11.4x 收入
        - 对面向公共部门终端市场且工作流粘性强的软件，是有用的溢价基准。
        - 板块篮子包含产品深度和采购模式不同的公司。
    notes: 这张表有意只做部分覆盖，因为私人国防软件融资很少披露足够 ARR 细节，无法做完全可比的倍数。它旨在框定合理区间，而不是暗示虚假的精确度。
