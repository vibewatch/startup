        title: 数据质量问题和剩余尽调卡点
        blocks:
          - type: paragraph
            body: >-
              最后一项重大财务问题不是经营表现，而是数据卫生。当前 nominal.so 域名指向一家无关的会计 AI 公司，而这家硬件公司的公开材料位于 nominal.io。CB Insights 又放大了问题，把
              nominal.so 绑定到另一个 Nominal 档案上，该档案只报告 $29.2 million 融资和 2025 年 7 月 $20 million Series A——这些事实明显与 Nominal
              披露的 $75 million Series B 和 $80 million B-2 冲突。这一点重要，因为私营公司估值常高度依赖第三方数据库来查融资历史、员工数和可比公司组合。在 Nominal
              案例里，如果实体标识不先校准，这些数据库会误导。剥离这个冲突后，财务故事相当清楚：收入质量看起来有希望，因为产品似乎粘性强、任务关键且能扩张；利润率路径可能强，因为公司卖软件而不是硬件；融资风险可控，因为近期资本充足。但本章仍无法回答真正决定确信度的问题：绝对收入、收入结构、毛利率、CAC、留存、现金、烧钱和债务义务。这些不是小遗漏。它们决定一家公司到底只是叙事强，还是能被完整承销进财务模型。
