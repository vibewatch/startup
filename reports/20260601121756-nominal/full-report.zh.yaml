      - number: '6.2'
        title: 案例研究支持项目牵引的先落地、再扩张动作
        blocks:
          - type: paragraph
            body: >-
              Nominal 公开证据里最重要的客户模式，不是披露的席位数或合同期限，而是从一个关键工作流反复转向更宽系统记录层。Nominal
              称，增长来自工程团队先在一个项目上采用产品，再把它拉进下一个项目。案例研究大体符合这个故事。Anduril 描述了一个统一分析平台，如今服务多个项目、300+ 活跃用户和隔离靶场。HII 称，2025
              年试点已扩展为 2026 年在 REMUS 和 ROMULUS 制造与测试工作流中的铺开。Air Force 关系则从 2023 年研究合同推进到 2026 年 Phase III IDIQ，额度上限 $53
              million，形成可反复下任务订单的工具，而不是单个定制试点。


              商业和两用账户也在较小规模上呈现同一模式。Odys 最初用 Nominal 替换碎片化飞行测试复盘，之后又用它围绕实时遥测统一飞行和地面测试。REGENT
              用该平台避免自建内部遥测栈，并已预期同一基础设施会随量产爬坡延伸到认证和下线测试。Pratt Miller
              的精神类似：平台把车间、仿真、风洞和比赛日工作流接到同一条主干上，让工程师更快处理大规模遥测负载。证据仍主要由工作流牵引，而不是由财务牵引，但方向清楚。Nominal
              的赢法是缩短从测试到决策的循环，再向外扩展到相邻项目和生命周期步骤。
