  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和变现架构
        blocks:
          - type: paragraph
            body: >-
              公开证据指向软件优先的商业模式，但不是简单的自助式 SaaS。Nominal 明确营销 Core 和 Connect
              两个产品，合在一起覆盖协作式遥测分析、边缘数据采集、仪器控制和可重复测试工作流。官网使用预约演示 CTA，而不是公开定价；Connect
              页面描述的边缘部署模型能实时读写仪器。这个组合强烈指向协商式企业合同，而不是透明的按席位定价。更重要的尽调问题是收入结构。客户公告反复把 Nominal
              描述为具体项目的工程、测试和运营数据基础设施，这意味着除了经常性软件访问，还会有上线、集成和解决方案工程工作。因此，最高置信度的结论不是纯
              SaaS，而是软件许可加上不小的服务层，尤其在账户部署早期。只要扩张收入最终超过实施工作量，这仍能成为好生意；公司自己的表述也支持这个论点，因为它把 Core 和 Connect
              定位为可复用平台层，而非一次性服务。未知的是，首年合同价值里有多少来自经常性软件、多少来自部署劳务，以及毛利率已经像基础设施软件，还是仍反映沉重的客户成功负担。
