  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态和工作流匹配
        blocks:
          - type: paragraph
            body: >-
              Nominal 的公开产品形态比通用遥测创业公司的说辞更连贯。Core 被呈现为协作工作区，工程团队在其中管理测试数据、运行分析、监控现场运营、报告发现，并把决策挂到下面的证据上。Connect
              是单独的边缘侧产品，可从仪器读取和写入数据，运行可重复的 Python
              测试，并跟着硬件移动，而不是假设稳定云连接。这个产品拆分很重要，因为它暗示了真实运营模型：在资产附近本地控制和摄取，再到云工作区共享复盘和复用。官方航空、航天和 RF
              材料强化了这一判断。航空材料强调资料库能统一全速率遥测、视频、日志、空间数据、PDF、计算事件和天气背景；航天材料描述了跨星历、总线和载荷数据的同步时间线以及结构化复盘；SDR 示例展示 Connect
              内部面向无线电工作流的实时指令、摄取和可视化。贯穿这些页面，Nominal
              卖的不只是图表。它卖的是一条工作流主干，横跨实时监控、测试后对比、历史搜索，以及多个资产类别和时间尺度上的协作。不过，公开材料在打包细节上仍薄：没有公开的逐模块定价，没有面向既有航空航天或工业工具链的明确连接器清单，也没有清楚划分打包工作流模板与客户定制实施工作。即便如此，保留下来的证据足以说明
              Nominal 有明确产品架构，而不是只有服务叙事。
