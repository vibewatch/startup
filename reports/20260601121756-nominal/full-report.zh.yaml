      - number: '7.2'
        title: 监管、法律、安全和预算暴露
        blocks:
          - type: paragraph
            body: >-
              Nominal 的监管和法律风险不是纸面风险。Cornell 的 ITAR 文本关键在于，技术数据明确包括测试、维护、操作和改装国防物项所需的信息，也包括机密信息以及与国防物项直接相关的软件。Nominal
              把自己定位成国防测试的数据骨干；一旦平台跨团队、跨地域汇总工程资料、流程、日志或模型输出，就会贴近出口管制边界。National Archives 和 DOD CIO
              说明了为什么这项负担已经是运营现实，而不是假设：CUI 处理在行政部门内已有统一标准，CMMC Phase 1 也已对国防承包商生效。CISA
              又加了一层要求：软件供应商越来越需要由高管承担安全内建成效，并提供默认安全配置，而不是可选附加项。预算暴露让合规负担进一步叠加。GAO 记录了 DOD
              多频繁在持续决议下运转，以及随之而来的进度延迟和成本上升。Senate 的 FY26 摘要称，持续决议会挡住新项目启动和部分多年期采购；Brookings
              则把类似自动减支的削减描述为不仅影响账面节省，也会伤害签约和训练。Nominal
              需要重视这一点，因为其最大公开成果绑定在研制测试、自主系统和现代化项目上，而这些项目受益于新项目启动、快速签约和项目连续性。因此，合规摩擦和预算摩擦相互勾连：销售动作越向国防项目倾斜，两股力量越会塑造增长质量。
