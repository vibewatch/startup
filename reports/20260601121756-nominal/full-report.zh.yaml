    type: dag
    layout: wide
    summary: Nominal 同时依赖防务买方、既有工具链、合规制度和仍然偏小的运营团队。
    data:
      nodes:
        - id: D1
          label: Nominal 平台
          detail: 共享工作流和数据层。
          tone: neutral
        - id: D2
          label: 防务主承包商与自主系统公司
          detail: 带来证明和背书的主承包商及防务科技客户。
          tone: risk
        - id: D3
          label: 政府项目
          detail: AFTC、DARPA、Navy 及相关测试机构。
          tone: risk
        - id: D4
          label: 遗留工具链
          detail: NI、MathWorks 和客户自有工作流已经嵌入团队。
          tone: risk
        - id: D5
          label: ITAR / CUI / CMMC 控制
          detail: 敏感数据附带的监管和安全义务。
          tone: risk
        - id: D6
          label: Nominal 团队
          detail: 工程、安全、合规和现场实施能力。
          tone: risk
        - id: D7
          label: 早期商业账户
          detail: 可随时间分散需求的相邻工业切入口。
          tone: neutral
      edges:
        - from: D2
          to: D1
          label: 客户需求与背书
        - from: D3
          to: D1
          label: 合同与任务订单
        - from: D4
          to: D1
          label: 集成或替换压力
        - from: D5
          to: D1
          label: 安全与出口管制规则
        - from: D6
          to: D1
          label: 交付与支持能力
        - from: D7
          to: D1
          label: 多元化选项
        - from: D1
          to: D2
          label: 工作流价值与更快测试分析
        - from: D1
          to: D3
          label: 现代化测试基础设施
    claimRefs:
      - CR005
      - CR008
      - CR010
      - CR015
      - CR022
      - CR028
      - CR033
      - CR038
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 从披露牵引力到可比估值区间，再到披露缺口和当前投资立场的决策链。
    data:
      nodes:
        - id: n1
          label: 2026 年 3 月融资，估值 $1B
          detail: 前一轮 Series B 后新获 $80M 追加融资；公司称自上一轮以来收入增长 7x。
        - id: n2
          label: 真实部署证明
          detail: 五大防务承包商中 4 家、Anduril 使用、Navy 支持以及 AFTC 合同上限共同构成证明。
        - id: n3
          label: 可比估值区间
          detail: PTC 约 6x，Samsara 约 12x，Palantir 约 70x；Nominal 可能高于成熟工业软件，但远低于 Palantir 上限。
        - id: n4
          label: 隐含 ARR 门槛
          detail: $1B 在 20x-12x 下约对应 $50M-$83M ARR；若市场按成熟工业软件定价，则需要 $100M-$167M。
        - id: n5
          label: 经济性缺失
          detail: 没有公开 ARR、留存、毛利率或优先股堆叠披露。
        - id: n6
          label: 结论：观察
          detail: 持续跟踪公司，但在经常性软件质量得到证明前，不要支付高于当前估值标记的价格。
      edges:
        - from: n1
          to: n2
          label: 支撑严肃评估
        - from: n2
          to: n3
          label: 决定溢价视角
        - from: n3
          to: n4
          label: 设定 ARR 门槛
        - from: n4
          to: n5
          label: 取决于披露
        - from: n5
          to: n6
          label: 让立场保持谨慎
    claimRefs:
      - CV001
      - CV013
      - CV034
      - CV035
      - CV036
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 支撑 $1B 估值在不同收入倍数假设下所需的 ARR。
    data:
      items:
        - label: 20x ARR 情景
          value: 50
          detail: 需要顶级溢价，通常只有异常高增长软件才拿得到。
        - label: 15x ARR 情景
          value: 66.7
          detail: 要求很高，但如果 Nominal 已经像规模化经常性软件平台一样运行，则更可信。
        - label: 12x ARR 情景
          value: 83.3
          detail: 接近强物理运营软件的 Samsara 式溢价区间。
        - label: 10x ARR 情景
          value: 100
          detail: 需要有意义的规模，且仍假设公开市场愿意给溢价。
        - label: 8x ARR 情景
          value: 125
          detail: 更接近压缩后但仍体面的软件结果。
        - label: 6x ARR 情景
          value: 166.7
          detail: 接近 PTC 式可比公司隐含的成熟工业底部。
    claimRefs:
      - CV034
      - CV035
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、当前轮估值、基准和乐观情景的估值区间，单位为百万美元。
    data:
      items:
        - label: 悲观区间
          low: 700
          mid: 800
          high: 900
          unit: M USD
          detail: 增长回归常态，退出倍数压缩至 6x-8x ARR。
        - label: 当前轮估值
          low: 1000
          mid: 1000
          high: 1000
          unit: M USD
          detail: 2026 年 3 月融资披露估值。
        - label: 基准区间
          low: 1000
          mid: 1200
          high: 1400
          unit: M USD
          detail: 需要约 $60M-$90M 前瞻 ARR，且市场继续按溢价软件框架定价。
        - label: 乐观区间
          low: 2200
          mid: 2900
          high: 3600
          unit: M USD
          detail: 需要工业侧扩张、更强披露，并在 $180M-$240M ARR 上拿到 12x-15x 溢价倍数。
    claimRefs:
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 可直接提交 IC 的指标，用来框定当前轮以及下一次重估需要什么。
    data:
      items:
        - label: 当前估值
          value: $1.0B
          unit: USD
          detail: 2026 年 3 月融资披露估值。
        - label: 披露增长
          value: 7x
          unit: null
          detail: 公司披露的自上一轮 Series B 以来收入增长。
        - label: 防务主承包商渗透率
          value: 4 of 5
          unit: null
          detail: 公司披露的最大防务承包商中使用 Nominal 的比例。
        - label: AFTC 上限
          value: $53M
          unit: USD
          detail: 通过 Air Force Test Center Phase III 路径授予的 IDIQ 上限。
        - label: 基准情景 ARR 门槛
          value: $60M-$90M
          unit: USD
          detail: 让当前估值标记大体站得住的前瞻 ARR 区间。
        - label: 乐观情景 ARR 门槛
          value: $180M-$240M
          unit: USD
          detail: 开始支撑 $3B+ 结果的 ARR 区间。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV013
      - CV037
      - CV038
