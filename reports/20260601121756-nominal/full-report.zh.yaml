        title: 图表
        blocks:
          - type: callout
            title: 国防溢价真实存在，但流动性没有融资头条暗示得那么充裕
            body: >-
              国防科技融资已经加速，但 S&P 称该板块 M&A 在 2021 年峰值后放缓，Goodwin 称原型到生产的死亡谷仍然真实存在。Nominal 不能只靠客户
              logo。投资人需要看到证据：联邦和主承包商采用能转化为耐久经常性收入，然后才能假设下一轮或退出会以明显更高倍数完成。
            calloutType: insight
            claimRefs:
              - CV040
              - CV041
              - CV043
          - type: callout
            title: 正确估值镜头更接近高溢价工业软件，而不是 Palantir
            body: >-
              Palantir 证明了国防级数据溢价存在，但 Nominal 更早期，也更缺乏多元化。Samsara 和 PTC 合在一起给出更有用的区间：如果 Nominal
              的软件经济性真实，它理应高于成熟工业软件地板；但当前公开证据仍达不到支撑 Palantir 例外级倍数所需的规模和披露度。
            calloutType: insight
            claimRefs:
              - CV024
              - CV028
              - CV030
              - CV036
          - type: callout
            title: 最佳下一步：先核验分母，再为溢价付费
            body: >-
              尽调路径很清楚。先索取 ARR、留存、毛利率、集中度和资本结构条款。如果这些披露支撑基准情景 ARR
              区间，并显示收入多元且具备软件质量，当前标记可以成立。如果不能，更安全的动作是等待，而不是为公开记录尚无法量化的增长支付全价。
            calloutType: insight
            claimRefs:
              - CV037
