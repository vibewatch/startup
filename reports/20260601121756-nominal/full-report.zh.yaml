  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合偏向国防关键项目，边缘处有一定商业验证
        blocks:
          - type: paragraph
            body: >-
              Nominal 的公开客户画像不是那种靠大量客户标识、拥有数百个轻度参与账户的 SaaS 模式。公司把自己卖给任务关键硬件团队，这些团队需要贯穿开发、生产和运营的安全遥测、分析与自动化测试。最清楚的公司级信号来自
              2026 年 3 月的声明：60+ 家组织信任该平台，其中包括全球五大国防承包商中的四家。这个说法在战略上很有力量，因为它暗示 Nominal
              已经进入国防领域最重要主承包商运行的项目；但它也不完整，因为公司没有说明这些主承包商是谁，或它们贡献了多少收入。


              公开证据能识别的，是一组围绕严肃工程项目的客户。Pratt Miller 是赛车运动运营商，也做国防和新型移动出行，给 Nominal 带来政府采购之外、商业上看得懂的验证。Antares
              把证明集扩展到核能和新兴能源，在这些领域，测试可靠性、远程操作和安全性与航空航天一样重要。其余具名客户仍贴近国防和两用工程：Anduril、HII、Air Force Test
              Center、NAVAIR、Odys 和 REGENT。换句话说，客户群按应用领域有分散，但按工作流严肃性并不分散。这些不是随意购买分析工具的客户；它们在反馈延迟会拖慢项目、产线或任务的地方使用 Nominal。
