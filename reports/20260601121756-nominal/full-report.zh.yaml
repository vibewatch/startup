      - number: '5.2'
        title: 架构、边缘部署和可靠性模型
        blocks:
          - type: paragraph
            body: >-
              Nominal
              披露的架构细节多于多数年轻工业软件供应商。实时流传输文章把用户可见路径拆成摄取、计算、网络和渲染延迟，再解释了一条冷热分叉管线：持久化存储保持开启，内存支撑的热路径只在实时流传输时激活。同一篇文章还描述了只对新增点做增量计算、基于
              websocket 的推送交付、浏览器 worker、拼接式追加、canvas 渲染、pod 平滑交接、JVM
              预热、乱序数据的最终一致性，以及不可靠链路上的自适应背压。这些细节重要，因为它们指向一种为测试事件设计的产品：工程师必须实时决定继续、暂停还是中止。边缘部署文章补上了这个架构周围的运营模型。Nominal
              称，系统可在远程现场的机架服务器或加固笔记本上自包含运行，在连接较弱时把摄取、验证和复盘留在本地，再把数据同步回中心工作区，同时不破坏 schema、不丢状态。这与 AWS 和 Azure
              对边缘计算的通用论证相吻合：低延迟、本地处理、间歇性网络。Connect 自身技术栈选择也贴合定位。Nominal 称，公司有意把边缘应用做成桌面产品，并在向客户交付一年后选择 Rust、Bevy 和
              egui。公开 Rust、嵌入式、Python、asyncio 和 Rust crate 文档不能证明 Nominal 的实现质量，但能说明公司正建立在成熟系统和脚本生态上，这些生态适合低延迟、贴近硬件的自动化。
