    "number": 5,
    "title": "Product & Technology",
    "summary": "Nominal\u2019s public product story centers on a two-part workflow stack: Core is the shared cloud workspace for engineering data and decisions, while Connect is the edge-side runtime for control, ingest, and repeatable testing. The strongest technical proof is a detailed public explanation of its hot/cold streaming architecture and disconnected edge operating model; the main diligence gaps are public connector coverage, trust/compliance artifacts, and the exact production scope of the new AI layer."
  },
  "sections": [
    {
      "id": "product-surface-and-workflow-fit",
      "title": "Product surface and workflow fit",
      "body": "Nominal\u2019s public surface is more coherent than a generic telemetry startup pitch. Core is presented as the collaborative workspace where engineering teams manage test data, run analysis, monitor live operations, report findings, and keep decisions attached to the underlying evidence. Connect is the separate edge-side product that reads from and writes to instruments, runs repeatable Python-based tests, and moves with the hardware instead of assuming a stable cloud connection. The product split matters because it implies a real operating model: local control and ingest near the asset, then shared review and reuse in the cloud workspace. The official aviation, space, and RF materials reinforce that view. Aviation emphasizes repositories that unify full-rate telemetry, video, logs, spatial data, PDFs, computed events, and weather context; space materials describe synchronized timelines across ephemeris, bus, and payload data plus structured review; the SDR example shows live command, ingest, and visualization for radio workflows inside Connect. Across those pages, Nominal is not selling only charts. It is selling a workflow backbone that spans live monitoring, post-test comparison, historical search, and collaboration across multiple asset classes and time scales. The public pack is still thin on packaging detail, however. There is no public module-by-module pricing, no explicit connector inventory for incumbent aerospace or industrial toolchains, and no clean boundary between packaged workflow templates and customer-specific implementation work. Even so, the retained evidence is enough to conclude that Nominal has a defined product architecture rather than a services-only narrative.",
