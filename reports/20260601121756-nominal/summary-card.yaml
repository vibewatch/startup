  topStrengths:
    - >-
      7x revenue growth YoY at the Series B-2 close demonstrates exceptional product-market fit in a historically
      manual, fragmented market
    - >-
      Four of the five largest US defense contractors on the platform provides both revenue visibility and a powerful
      reference customer moat
    - >-
      Founders Fund, Sequoia, Lux, and General Catalyst backing from an ex-Navy, ex-Anduril CEO signals strong
      defense-market conviction from top-tier investors
    - >-
      Hardware test data represents a durable, high-switching-cost category with structural growth from defense
      modernization and advanced manufacturing expansion
  topRisks:
    - >-
      Undisclosed absolute ARR and gross margin make it impossible to confirm whether the $1 billion valuation is
      appropriate without trusting management-disclosed growth multiples
    - >-
      Heavy concentration in defense prime contractors creates budget-cycle sensitivity and customer-concentration risk
      if any single prime reduces testing programs
    - >-
      The test data category is niche enough that adjacent players from PLM (PTC, Siemens) or data-platform vendors
      (Palantir) could expand into the same workflow
    - >-
      Geographic and sector expansion into commercial aerospace, automotive, and nuclear is unproven: international and
      non-defense revenue mix is undisclosed
  unresolvedGaps:
    - Absolute ARR, gross margin percentage, and net revenue retention rate are not publicly disclosed
    - Revenue concentration by customer and by sector (defense vs. commercial) is unknown
    - Competitive win rates versus legacy tooling and point solutions are not documented in public sources
    - International expansion progress and non-defense revenue trajectory are not quantified
