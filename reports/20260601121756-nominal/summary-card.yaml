summary:
  headline: >-
    Nominal's 7x revenue growth and four-of-five-largest-defense-contractor deployment prove real product-market fit in
    a structurally underserved niche, but undisclosed absolute revenue and gross margin prevent a buy call at a $1
    billion valuation that requires roughly $60–90 million of ARR to be supportable.
