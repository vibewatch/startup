- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - ARR or retention disclosure misses the premium case
    - Disclosed ARR materially below ~$60M forward equivalent or retention too weak to support premium software framing.
    - The current $1B mark stops looking like fair premium software pricing and starts looking like a stretched round.
    - Do not add capital above the current mark; re-underwrite at a lower valuation band.
  - - Customer concentration is too high
    - A handful of defense primes or programs dominate revenue with limited industrial backfill.
    - Breakwater's concentration discount would compress the exit multiple even if growth remains solid.
    - Require concentration and contract-duration data before underwriting a full premium.
  - - Government conversion stalls through compliance or procurement friction
    - SBIR, ownership, supply-chain, or contracting issues slow the move from pilots to production programs.
    - The company keeps logos but loses the durable revenue conversion that supports infrastructure multiples.
    - Pause until compliance posture and production conversion are proven.
  - - Industrial expansion remains narrative-only
    - Non-defense verticals stay mostly lighthouse references instead of recurring ARR contributors through 2027.
    - The business remains a narrower defense-tools story and loses the path to $3B+ diversification.
    - Hold or trim expectations to a defense-only exit framework closer to the base or bear case.
  notes: These are thesis-break conditions, not predictions. Each one directly attacks the denominator or multiple that makes the $1 billion price work.
  claimRefs:
  - CV022
  - CV037
  - CV039
  - CV041
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Recurring-software quality
    - Current ARR, NRR, gross margin, and burn by cohort
    - This is the single biggest determinant of whether the current multiple is fair or stretched.
    - CFO + board package + cohort KPI review
  - - Customer concentration
    - Top-20 customer ARR, defense-vs-industrial mix, contract lengths, and renewal mechanics
    - A concentrated revenue base will compress exits even if the product is strong.
    - Sales ops export + customer success renewal analysis
  - - Capital structure
    - Term sheets, preference stack, option-pool changes, and any secondary pricing
    - Headline valuation can overstate common-equity value if preference overhang is meaningful.
    - Finance/legal data room review
  - - Government conversion
    - Pipeline from SBIR/IDIQ and demos into recurring production revenue
    - Defense proof is powerful only if it becomes repeatable software revenue rather than one-off program work.
    - Federal GTM review + booked-vs-pipeline analysis
  - - Industrial scale-out
    - Industrial cohort revenue, acquisitions roadmap, and cross-vertical product attach rates
    - The $3B+ case requires broader category formation, not just deeper defense penetration.
    - CEO/strategy review + product roadmap diligence
  notes: Every row in this table is decision-critical because the open items affect either the ARR denominator, the quality of that ARR, or the multiple likely to apply at exit.
