- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - dimension
  - thesis
  - anti-thesis
  - what changes the view
  rows:
  - - Defense platform proof
    - Four of five largest defense contractors, Navy support, and a $53M AFTC ceiling show real program pull.
    - Public proof is still heavily defense-centric and does not yet show how much of this becomes durable recurring software ARR.
    - Show customer-concentration data, renewal rates, and multi-program expansion by account.
  - - Product relevance
    - Core and Connect address real-time observability, analysis, and edge execution for serious hardware teams.
    - The product story could still be read as a high-value test workflow layer rather than a deeply embedded enterprise data platform.
    - Demonstrate stickiness through retention, workflow expansion, and attach rates across operations, not just test benches.
  - - Industrial expansion
    - Antares and management's stated push into automotive, energy, manufacturing, and robotics suggest the platform can travel beyond defense.
    - Industrial expansion is still reference-heavy and revenue-light in public evidence.
    - Show repeatable revenue contribution from industrial verticals outside defense.
  - - Strategic value
    - PTC-ServiceMax shows buyers pay for lifecycle software that closes a data loop.
    - Strategic value does not guarantee public-market style multiples or timely exits if M&A stays slow.
    - Show active strategic demand, continuation interest, or exit-ready scale with diversified ARR.
  - - Market support
    - Public-sector and industrial software comps support meaningful premiums above generic SaaS averages.
    - Palantir is an exceptional ceiling, not a base case, and mature industrial software still trades far lower.
    - Show metrics that place Nominal closer to the premium bucket than the industrial floor.
  notes: The point of this table is to isolate which parts of the premium story are already evidenced and which parts still depend on diligence-only economics.
