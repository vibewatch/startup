  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosed-economics
    missingEvidence: Current ARR, net revenue retention, gross margin, burn, and software-versus-services mix by major customer cohort.
    whyItMatters: The $1 billion price is only cleanly supportable if Nominal already resembles a premium recurring-software business rather than a high-growth but mixed-services test contractor.
    diligencePath: Request the latest board KPI package, revenue waterfall, cohort retention tables, and a product-level gross-margin bridge for Core versus Connect.
    relatedQuestionRefs:
    - QV006
    - QV028
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: The September 2025 and March 2026 term sheets, liquidation preferences, participation rights, option-pool expansion, and any secondary pricing history.
    whyItMatters: Headline valuation can materially overstate common-equity value if preference overhang, seniority, or insider secondary discounts are significant.
    diligencePath: Obtain the cap table, financing documents, and any secondary-transfer data used by the board or lead investors after the March 2026 extension.
    relatedQuestionRefs:
    - QV029
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by top defense primes, government program, and the first industrial accounts, plus contract duration and renewal mechanics.
    whyItMatters: Breakwater suggests concentration can compress exit multiples; without customer mix the investment case cannot tell whether Nominal is a platform or a small number of very large programs.
    diligencePath: Ask for top-20 customer ARR, remaining performance obligations, renewal rates, and defense-versus-industrial revenue mix by quarter.
    relatedQuestionRefs:
    - QV025
    - QV028
  - type: missing-source
    severity: minor
    topic: industrial-expansion-proof
    missingEvidence: A cohort view showing how quickly non-defense verticals such as automotive, energy, and manufacturing convert from lighthouse references into recurring revenue.
    whyItMatters: The $3 billion plus bull case depends on Nominal becoming a broader industrial data platform rather than remaining primarily a defense beachhead, and the partial comparable table reflects that same private-market opacity.
    diligencePath: Request pipeline conversion, referenceable industrial logos, and any acquisition roadmap tied to Europe or adjacent industrial categories.
    relatedQuestionRefs:
    - QV006
    - QV025
    relatedTableRefs:
    - TV004
