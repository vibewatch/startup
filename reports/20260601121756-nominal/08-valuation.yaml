- id: val-scenarios
  title: 'Scenarios, exit readiness, and diligence triggers: upside exists, but the burden of proof is still ahead'
  body: |-
    The base case is not heroic, but it still asks for more than the public record can verify. To keep the current $1 billion mark supportable, Nominal likely needs to be somewhere in roughly the $60 million to $90 million forward-ARR zone while preserving unusually strong growth and software-like retention. The bull case is materially harder: a $3 billion plus outcome likely requires something closer to $180 million to $240 million of ARR, continued premium multiples in the 12x to 15x range, and clear evidence that industrial expansion is becoming real revenue rather than a strategic aspiration. The bear case is simpler. If growth normalizes, if industrial expansion remains thin, or if the market values the company more like mature industrial software, then downside appears quickly because the denominator needed to defend the current round rises fast.

    Exit readiness is therefore mixed. The PTC-ServiceMax example shows that strategic buyers will pay for workflow software that closes a valuable industrial data loop, so the long-term M&A logic is real. But S&P's 2026 defense-tech work is a reminder that abundant venture funding does not automatically create abundant exit liquidity, especially when M&A slows. Goodwin adds the operational caution: defense companies still face a prototype-to-production valley of death, ownership and compliance friction, and supply-chain constraints that can interrupt scale even after early customer proof. A new investor should therefore underwrite Nominal as a company with genuine strategic potential but not yet with an exit path that is de-risked enough to justify paying through the current mark.

    That leads directly to diligence and thesis-breaks. The investment case improves sharply if management can show current ARR, retention, gross margin, customer concentration, and conversion from defense programs into recurring production revenue. The thesis weakens quickly if disclosed ARR lands materially below the base-case zone, if one or two defense programs dominate the revenue base, if government conversion stalls through procurement or compliance bottlenecks, or if non-defense expansion stays narrative-only. Until those asks are answered, the upside case should be treated as real but conditional rather than as price support already earned.
