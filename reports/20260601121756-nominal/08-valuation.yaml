  rows:
  - - Recommendation
    - track
    - Stay engaged, but do not underwrite full premium until recurring-software KPIs are disclosed.
  - - Confidence
    - medium
    - The company-quality signal is strong, but valuation support rests on undisclosed ARR, retention, and margin data.
  - - Risk rating
    - high
    - Operational adoption looks real, but concentration, procurement, and disclosure risk remain material at this price.
  - - Valuation stance
    - fair-to-stretched
    - The mark is fair if forward ARR is already roughly $60M-$90M and stretched if it is materially below that range.
  - - Price discipline
    - Prefer <=$1B until data improves
    - A richer entry only makes sense after retention, gross margin, and concentration data support a software premium.
  - - What would upgrade the view
    - Disclosed software quality
    - Public or diligence-only proof of ARR, NRR, gross margin, and diversified industrial expansion would move the call closer to buy.
  notes: This is a price-sensitive judgment, not a generic company-quality score. The company can be strategically attractive while the current mark still demands more evidence.
