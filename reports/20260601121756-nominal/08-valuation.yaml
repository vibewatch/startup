- id: val-comparables
  title: 'Comparable bracket: the defensible range sits between premium industrial software and Palantir’s exceptional ceiling'
  body: |-
    The comparable set is useful because it establishes both a floor and a warning against lazy analogies. PTC is the mature industrial floor: a mission-critical software company with strong margins and deeply embedded workflows, yet still valued around the mid-single-digit EV/Sales range. Samsara is the more relevant premium benchmark because it shows what scaled physical-operations software can command when it pairs strong growth, substantial ARR, and a credible data moat; at roughly 11.9x EV/Sales, it represents the public-market zone Nominal would need to resemble before the current price looks obviously attractive. Palantir is the ceiling case. It proves that public investors will sometimes pay extraordinary multiples for a defense-grade data platform, but it also reflects AI narrative, scale, and entrenchment that Nominal does not yet have.

    ServiceMax helps translate that bracket into strategic value logic. PTC paid $1.46 billion for ServiceMax because lifecycle and field-service software can close a data loop and become strategically valuable to industrial operators. That matters for Nominal because its best long-term story is not just test-data visualization; it is becoming the operational truth layer that connects development, validation, and field operations for serious hardware programs. If Nominal reaches that system-of-record position, then a premium over mature industrial software is warranted. If it remains a narrower high-value tool layer, the multiple should drift back toward the industrial floor.

    The practical takeaway is that the current mark is not supported by Palantir-style upside alone. Public evidence supports a bracket in which Nominal deserves more credit than a mature industrial incumbent but still has to prove it belongs near the top of the premium band. That makes the question less about whether a premium exists and more about how much premium the company has already earned on public evidence.
