  evidenceGaps:
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: Named public win-loss examples showing where Nominal displaced NI, MathWorks, Databricks, Palantir, or custom internal tooling.
    whyItMatters: Without real replacement cases it is hard to estimate switching cost, pricing power, and product superiority.
    diligencePath: Request customer references that explicitly compare Nominal to prior incumbent tools or internal stacks.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: pricing
    missingEvidence: Contract-level pricing and ACV comparisons across Nominal and the main enterprise competitors.
    whyItMatters: Public pricing is sparse across the category, making it difficult to compare economic switching cost or discounting behavior.
    diligencePath: Collect redacted proposals or customer procurement summaries to compare pricing model, data fees, and implementation costs.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: minor
    topic: classified-deployment
    missingEvidence: Evidence on which competitors have the deepest classified, sovereign, or air-gapped deployment footprint in Nominal's exact target accounts.
    whyItMatters: Security posture can determine vendor eligibility before feature breadth matters in defense programs.
    diligencePath: Interview defense customers and request deployment references by classification level.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: minor
    topic: internal-build
    missingEvidence: Specific public examples of custom Python, MATLAB, or data-lake stacks that buyers considered sufficient instead of buying a dedicated platform.
    whyItMatters: Internal-build competition is one of Nominal's most credible substitutes, but it is under-documented in public case material.
    diligencePath: Request pre-sales competitive notes and customer migration stories from the company.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP001
    - TP004
  - type: missing-source
    severity: minor
    topic: classified-review-depth
    missingEvidence: Independent reviews of LabVIEW, Databricks, Palantir, or Teamcenter specifically from defense and aerospace users running secure hardware programs.
    whyItMatters: Mainstream review sites skew toward general use and do not fully capture mission-critical deployment constraints.
    diligencePath: Supplement public reviews with expert calls from defense, aerospace, and industrial test organizations.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
