  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据表明，Darwinbox 客户旅程围绕大型企业适配、可配置实施、员工自助服务和售后支持赋能展开。
    data:
      items:
        - label: 区域企业适配
          actor: CHRO / HR 运营 / IT
          stage: 落地
          touchpoints:
            - 适配约 1000-20000 名员工的中大型企业买方
            - 覆盖印度、更广泛的 APAC 和中东，并在美国增长
        - label: 套件式评估
          actor: HR 领导层 / 薪资 / 人才团队
          stage: 评估
          touchpoints:
            - 统一的核心 HR、薪资、招聘、绩效和敬业度
            - 定位为企业平台，而非单点 HR 工具
        - label: 快速实施
          actor: 实施与 IT 团队
          stage: 实施
          touchpoints:
            - 简单配置、数据迁移和有针对性的变更管理
            - 面向复杂环境的开放 API 和多国薪资
        - label: 员工日常自助服务
          actor: 员工与管理者
          stage: 使用
          touchpoints:
            - 面向考勤、休假和员工工作流的移动优先 UX
            - 买方承诺通过更简单的终端用户体验实现高采用率
        - label: 支持与赋能层
          actor: 客户、合作伙伴与 Darwinbox 支持团队
          stage: 采用
          touchpoints:
            - 帮助门户有 12000 名活跃用户、100 万次浏览、13 分钟互动时长
            - 由聊天机器人关联内容带来的 65% 支持分流
        - label: 扩张与持久性检验
          actor: 财务、客户成功与高管买方
          stage: 扩张
          touchpoints:
            - 2022 年 SEA 占季度收入的三分之一
            - 续约、NRR、流失率和集中度指标仍未披露
