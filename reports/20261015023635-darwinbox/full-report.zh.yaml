  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据将真实的产品与客户证明，连接到对价格敏感的持续跟踪建议，而不是明确买入。
    data:
      nodes:
        - id: product
          label: 产品广度真实存在
          detail: 官方页面显示，AI 驱动的 HCM 已覆盖核心人力资源、薪资、人才、分析和移动端工作流。
          tone: positive
        - id: deployment
          label: 商业化部署清晰可见
          detail: 在线的多语言登录界面和持续发布产品更新的公司说法，共同支持该软件正在生产环境运行。
          tone: positive
        - id: scale
          label: 客户规模获独立来源支持
          detail: 独立来源显示，覆盖企业超过 1,000 家，覆盖员工超过 400 万。
          tone: positive
        - id: funding
          label: 融资支持仍在延续
          detail: 2025-2026 年的融资轮次显示机构投资者持续支持，但过往融资中有相当一部分以老股转让为主。
          tone: warning
        - id: gaps
          label: 核心估值输入仍不透明
          detail: 公开证据仍缺少 ARR、NRR、毛利率、现金消耗和优先股堆叠的细节。
          tone: negative
        - id: call
          label: 最终立场是持续跟踪 / 估值偏高
          detail: 继续尽调，等待更充分的披露或更宽松的入场价格。
          tone: negative
      edges:
        - from: product
          to: deployment
          label: 将功能广度转化为可运行的平台
        - from: deployment
          to: scale
          label: 支持企业采用的证明
        - from: scale
          to: funding
          label: 有助于解释投资者的兴趣
        - from: funding
          to: gaps
          label: 并未消除披露缺口
        - from: gaps
          to: call
          label: 将估值纪律置于首要位置
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV012
