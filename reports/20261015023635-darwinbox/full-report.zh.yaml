chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与定位
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 当前最清晰的身份，是一家希望被视为 AI 原生、而不只是传统 HRMS 套件的企业 HCM 软件厂商。其官网和产品页面始终围绕 AI、核心
              HR、薪资、人才、分析和全球企业使用场景展开；DHRMap 则独立将其描述为覆盖从招聘到退休全流程、尤其擅长亚洲、印度和中东市场的平台。总部所在地更难判断。保留的公开来源并不一致：DHRMap
              称公司已将总部迁至新加坡，但同一资料又列出纽约 Bryant Park 地址；Darwinbox 自己的 newsroom 早前则称海得拉巴是新的全球总部。因此，后续章节应把 2015 年成立、印度根基、企业
              HCM 范围和持续国际扩张视为可靠事实，而不要强行确定一个全球总部。
