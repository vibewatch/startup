      - number: '3.2'
        title: 能力、打包与市场进入比较
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 已记录的产品主张，是在单一平台上覆盖核心 HR、薪资、招聘、绩效、劳动力管理、员工参与和人员分析。官网强调移动优先体验、可配置工作流、开放 API 和频繁更新；ERP Research
              报告称平台有 300 多个预构建连接器，并在其追踪的 61 项能力中记录了 33 项有证据、另有 1
              项部分具备。但这不是普适的功能评分：发布方明确说明，“未见证据”只代表没有找到公开文档，能力本身仍可能存在。商业层面，保留的独立来源称价格按员工数、模块和合同期限询价，在 Darwinbox
              的强势区域，同等范围的价格明显低于 Workday 和 SuccessFactors。由于竞争者目录价和 Darwinbox 实际折扣均不可得，无法形成可信的总成本比较。
