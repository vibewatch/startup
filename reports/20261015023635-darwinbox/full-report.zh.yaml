      - number: '2.3'
        title: 采用驱动因素与摩擦
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素比精确市场规模更清楚。Darwinbox 自己的产品页强调可配置性、开放 API、快速上线和全球合规；Microsoft 的合作公告则展示了通过 Teams、Viva、Dynamics
              365、Azure AD 和 Power BI 接入日常工作流的实际路径。再叠加移动优先定位，当买家希望整合割裂的 HR 工具、又不愿让无固定办公桌的员工回到桌面优先系统时，Darwinbox
              更容易被证明有价值。摩擦同样得到多个独立买家导向来源的印证：价格需询价，实施和迁移可能主导第一年成本，没有原生 EOR，部分用户还报告高峰期支持延迟或性能变慢。因此，Darwinbox
              应按可配置的企业转型项目来评估，而不是按能即时见效的轻量 HR 工具来评估。
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 公开 TAM 很宽，但投资判断仍取决于 ICP 匹配
            body: >-
              证据支持一个庞大的 HCM 类别，也支持 Darwinbox 在薪资和合规要求较重的企业 HR 转型中拥有可信切入点，但无法单独证明公开 SAM 或稳定的北美赢单率。在把全球 TAM
              当作近期收入机会前，应压测询价定价、实施负担、核心市场之外的薪资能力，以及支持和可靠性证据。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买家替代方案
        blocks:
          - type: paragraph
            body: >-
              Darwinbox 不是在狭窄的点解决方案类别中竞争。独立资料将 Workday、Factorial、Kronos、PeopleStrong、Remote、Dayforce、Bob 和 SAP
              SuccessFactors 列入比较范围，覆盖全球企业套件、区域 HCM/薪资产品和相邻的雇佣基础设施。Tracxn 将 Workday、Factorial 和 Kronos 列为主要竞争者；ERP
              Research 则称 Darwinbox 为面向中端市场和企业组织的一体化核心 HR、薪资、人才、劳动力、员工参与和分析平台。买家可以选择大型 incumbent
              套件、区域一体化套件、较窄的相邻平台，也可以保留割裂工具和内部工作流、推迟替换。保留证据没有量化赢单率或市场份额，因此这里是方向性格局，不是商业实力排名。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP015
