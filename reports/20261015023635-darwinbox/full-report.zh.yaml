      - number: '8.3'
        title: 乐观情景需要更好的经济性证明；基准情景是持有并核验
        blocks:
          - type: paragraph
            body: >-
              乐观情景很直接：Darwinbox 将其 APAC 和中东企业地位转化为全球 HCM
              份额，用新资本深化产品并进军北美，同时证明收入增长可以转化为有吸引力的经常性经济性。在这种结果下，今天偏高的估值仍可能在接近已报道私有估值的价格入场后复合出可接受回报，因为业务会更像规模化的区域品类赢家，而不是新兴挑战者。

              基准情景更谨慎，也更符合公开记录。Darwinbox 的规模真实存在，但现有证据更能证明产品广度和融资渠道，SaaS 质量指标则更弱。没有公开
              ARR、留存、利润率、流失或明确价格基准时，理性做法是继续尽调，等待更好的经济性或更宽松的入场点，不要在证据不支持时强行给出精确判断。

              悲观情景聚焦估值倍数压缩和商业化摩擦。独立买家评测仍提到 UI bug、工作流复杂、性能变慢和支持响应问题；公开披露也没有说明 2025 年和 2026 年融资解决了这些限制，还是只是延长了
              runway。因此，最终尽调应聚焦经审计的 FY25/FY26 财务、ARR/NRR、客户集中度、毛利率、实施经济性和准确优先权结构。在这些问题解决前，投资论点的破坏触发条件很简单：如果 Darwinbox
              在证明持久的经常性经济性前就放缓增长，当前私有估值可能比产品叙事改善得更快地重置。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 当前判断
            body: 跟踪 Darwinbox，而不是强行给出买入判断：公司看起来商业上真实，也仍能获得融资，但当前公开证据不足以有把握地为上行空间定价。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV013
              - CV014
              - CV016
          - type: callout
            title: 估值标记为何仍可能令人失望
            body: 最大下行风险不是产品是否存在，而是估值透明度：如果 ARR 质量、利润率、留存或清算优先权不及预期，偏高的私有估值可能迅速重置。
            calloutType: risk
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV014
              - CV015
          - type: callout
            title: 会推动决策变化的尽调事项
            body: 如果 Darwinbox 披露经审计的 FY25/FY26 财务、经常性收入质量指标、APAC 之外的企业赢单持久性，以及融资后的股权结构表或优先权结构，建议可以上调。
            calloutType: assumption
            claimRefs:
              - CV005
              - CV009
              - CV014
              - CV015
