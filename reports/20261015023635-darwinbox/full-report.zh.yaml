      - number: '8.2'
        title: 融资背景偏正面，但混合轮次结构和不透明定价令立场仍偏高
        blocks:
          - type: paragraph
            body: >-
              融资记录有支持作用，但还不够干净，无法消除估值风险。Fundz 称 Ontario Teachers' Pension Plan 于 2026 年 9 月追加投资 4,000 万美元；Economic Times
              报道 OTPP 已在 2025 年 8 月投过 4,000 万美元，此前 2025 年 3 月轮次以老股为主、只有部分新股。Economic Times 还称 2025 年 3 月轮次的综合估值约为 9.5
              亿美元。Inc42 的公司资料如今列出累计融资超过 2.96 亿美元，但融资额不等于可用现金，也无法说明老股交易后资产负债表上还剩多少新增资本。

              这直接影响入场纪律。以老股为主的轮次可以同时验证投资人需求和内部人流动性，却不自动意味着企业获得了与所披露轮次等比例的新资本。公开记录也没有披露完整的股权结构表、
              清算优先权和期权池信息，使新投资人很难判断自己能从任何私有估值标记中获得多少上行。同时，RFP.wiki 的独立定价研究称 Darwinbox 不发布目录价，实施、支持和 AI 附加项会显著改变第一年
              TCO。因此，很难把产品质量转换成相对于透明 HCM 同行的清晰估值基准。

              综合这些事实，现有证据支持的是偏高的估值立场，而不是明显昂贵或明显便宜。产品和客户证据足以支持继续关注，但公开单位经济披露不足以证明当前私有估值由一流 SaaS 质量支撑。
            claimRefs:
              - CV001
              - CV003
              - CV004
