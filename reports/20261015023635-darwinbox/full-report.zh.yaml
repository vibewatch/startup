      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              这里的融资标题需要仔细解读。Economic Times 在 2025—2026 年的报道称，近期轮次的综合估值约为 $950 million 至 $1 billion，但也反复指出其中有老股成分，包括 2025
              年 3 月一轮以老股为主、仅有小额新股，以及 2025 年 8 月一轮混合新股和老股。这支持股东流动性和价格发现，却不能证明公司把整笔 headline
              融资额都增加到了现金中。同时，本集合中最负面的分析认为，较长的企业销售周期、实施密集型上线和未经证实的北美扩张，都可能拖累利润率，并延长现金生成追上增长的时间。
