      - number: '4.2'
        title: GTM 动能、牵引力与单位经济信号
        blocks:
          - type: paragraph
            body: >-
              指定证据指向经典的企业销售模式，而不是自助式 SMB 漏斗。Value For Startups 描述公司直接向 CHRO/CIO
              买家销售，采购周期较长；审阅过的官方页面则强调可配置性、实施支持、集成和安全姿态，符合大客户采购标准。公开牵引力真实但质量不一：Economic Times 报道 FY24 收入增长 58%，达到 Rs 392
              crore；Business Wire 转述 Darwinbox 2026 年 4 月的口径称，公司覆盖接近 5M 名员工、超过 1,200 家企业；Scribd 上一份 2025 年 9
              月投资备忘录则在更早的扩张阶段称覆盖 3M+ 名用户、1,000+ 家机构。单位经济信息更薄弱。本集合中最具体的毛利率、NRR、CAC 回收期和 EBITDA
              口径，来自一份独立但估计成分较重的分析师报告，因此只能作为方向性输入，不能当作可用于投资判断的审计指标。
