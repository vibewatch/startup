    title: 产品架构图
    type: stack
    summary: Darwinbox 的公开产品叙事是在可配置 HCM 和集成核心之上叠加移动工作流界面。
    data:
      layers:
        - label: 体验与采用
          detail: 面向员工、管理者、招聘人员和 HR 管理员的移动优先界面。
          modules:
            - label: 员工自助服务
            - label: 管理者审批
            - label: 招聘与入职流程
        - label: 工作流应用
          detail: 覆盖面广的 HCM 模块被呈现为可配置的运营工作流，而非单一僵化的流程路径。
          modules:
            - label: 核心 HR
            - label: 薪资中心
            - label: 绩效与敬业度
            - label: 服务台与考勤
        - label: 数据与智能
          detail: 员工主数据、组织图谱、分析和 AI 服务驱动个性化与报告。
          modules:
            - label: Neo4J 图谱模型
            - label: 人员分析
            - label: Sense AI / 技能评分
        - label: 集成与控制
          detail: 开放 API、合作伙伴薪资交接和合规控制，将 Darwinbox 接入更广泛的企业系统。
          modules:
            - label: API 与连接器
            - label: Mercans 薪资交换
            - label: 基于角色的访问与合规
        - label: 部署与支持
          detail: 企业配置、迁移、培训和平台所有权决定套件广度能否转化为采用。
          modules:
            - label: 工作流配置
            - label: 数据迁移
            - label: 变更管理
        - label: 保障与运营
          detail: 可靠性、事件响应、认证范围和 AI 治理仍是尽调界面，而非已验证的公开层。
