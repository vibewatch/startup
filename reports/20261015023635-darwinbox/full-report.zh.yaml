  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买家切入点
        blocks:
          - type: paragraph
            body: >-
              对 Darwinbox 最稳妥的市场定义是企业 HCM：作为记录系统的核心 HR，加上薪资与合规、劳动力管理、招聘、绩效、员工参与和人员分析。这比狭义 HRIS 点工具更宽，但比泛化的“未来工作”软件或完整
              ERP 替代更窄。面向买家的公开来源对其最佳适配场景出奇一致：印度、广义 APAC 和中东的大型企业，需要本地化薪资与合规，以及面向制造、零售和物流员工的移动优先工作流。相同来源也划定了边界：Darwinbox
              不等同于原生 EOR 招聘，也还没有被呈现为美国总部《财富》500 强企业的默认选择；后者往往希望从 Workday、SAP 或 Oracle 等 incumbent 处获得财务与 HCM 的标准化。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
