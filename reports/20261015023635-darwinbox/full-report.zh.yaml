        blocks:
          - type: paragraph
            body: >-
              Darwinbox 最近的融资和经营里程碑足以支撑后期扩张叙事，但公开披露还不足以拼出清晰的资本结构。官方公告和 Economic Times 的报道都指向 $140 million 的 2025 年 3
              月融资，以及 $40 million 的 Teachers' Venture Growth 2025 年 8 月投资；2026 年 9 月的报道则暗示 TVG
              再次支持，但具体金额不够确定。规模信号也并非纯粹愿景：公开报道将公司与超过 1,000 家企业、服务超过 4M 名员工、FY24 收入 Rs 392 crore、收入增长 58% 以及截至 2025 年中 11
