figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Darwinbox 的公开记录呈现出融资、扩张和 AI 产品里程碑的连续进展，而非一次孤立的增长事件。
    data:
      items:
        - date: '2015'
          label: 在海得拉巴成立
          detail: 公开公司资料将 Darwinbox 的成立时间追溯至 2015 年，并将其起源与海得拉巴联系起来。
          tone: positive
          claimRefs:
            - CO001
        - date: '2022-01-25'
          label: 独角兽融资
          detail: Darwinbox 宣布完成由 TCV 领投、估值 1B+ 的 $72m 融资，确立了后期私募背景。
          tone: positive
          claimRefs:
            - CO003
        - date: '2022-11-14'
          label: 海得拉巴全球总部信号
          detail: 新闻稿称 Darwinbox 在海得拉巴开设了新的全球总部，但这一说法后来与其他总部标签并不协调。
          tone: neutral
          claimRefs:
            - CO005
        - date: '2023-01-17'
          label: Microsoft 合作
          detail: Darwinbox 宣布围绕其 HCM SaaS 平台与 Microsoft 合作，强化了其企业软件布局。
          tone: positive
          claimRefs:
            - CO003
