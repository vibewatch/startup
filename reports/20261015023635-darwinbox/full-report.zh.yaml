  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 由于经营证明落后于估值披露，建议维持跟踪
        blocks:
          - type: paragraph
            body: >-
              公开证据仍指向一家真实的企业软件公司，而不是投机故事。Darwinbox 官方页面将产品定位为 AI 驱动、移动优先的 HCM 套件，覆盖核心
              HR、薪资、人才、分析和员工工作流；一个仍在运行的品牌登录页面证明存在面向客户的访问端点，但不能证明部署规模或生产使用。独立来源也持续显示有意义的客户规模：DHRMap 将 Darwinbox
              描述为覆盖招聘到退休的 HCM 厂商，拥有 1,000+ 客户账户；Economic Times 则报道 2025 年中覆盖超过 400 万员工、1,000 家企业。这些因素支持真实的企业软件论点。

              估值判断就没那么舒服了。市场仍愿意为公司提供资金，Fundz 和 Economic Times 都指向 2025—2026 年新增 Ontario Teachers
              支持，但最新公开证据无法解决在高估值下判断上行空间所需的关键输入。公开来源仍未披露 ARR、毛利率、NRR、现金
              burn，或老股主导融资后的准确优先权结构。价格仍需询价而不透明，独立买家评论也继续指出性能、工作流和支持摩擦。这些缺失输入很重要，因为后期 HCM 软件的估值纪律应建立在持久的经常性收入质量上，而不只是
              headline 融资势头。

              实际含义是：建议 TRACK，信心中等，风险高。公司值得留在名单上，但仅凭公开证据还不透明到足以支持买入。更好的入场案例需要更强的经常性经济性和资本结构披露，或需要价格下调，为执行和流动性风险留出空间。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
