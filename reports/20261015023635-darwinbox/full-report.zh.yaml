    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Darwinbox 将新资本转化为更快的全球扩张，同时证明经常性收入质量高、留存强。
        - 如果未来披露显示其 SaaS 质量顶尖且具备战略稀缺性，即使入场估值偏高也可能奏效。
        - 在证明模式可复制前，北美扩张会消耗现金。
        - 需要经审计的财务报表，以及强劲的客户群和利润率数据。
      - - 基准
        - 增长持续，但公开披露仍不完整，投资者只能依据部分证据作出投资判断。
        - 回报更多取决于纪律严明的入场价格，而不是当前估值倍数的扩张。
        - 在治理和经济性问题仍未解决时，估值维持区间波动。
        - 与今天的证据集最为一致。
      - - 悲观
        - 在 Darwinbox 证明利润率、留存或定价能力之前，增长放缓，随后出现私募估值重置。
        - 过往二级交易占比较高的轮次和不清晰的优先股堆叠，会在重置中迅速压缩普通股上行空间。
        - 产品评价中的摩擦和不透明的 TCO 削弱其相对大型同行的赢单率。
        - 若尽调显示留存弱、利润率薄或股权结构表条款不利，则触发该情景。
    notes: 情景表只提供方向性判断，因为公开证据没有披露足够数据，无法建立有说服力的数值估值模型。
