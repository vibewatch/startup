            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM009
              - CM010
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM011
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模与区域形态
        blocks:
          - type: paragraph
            body: >-
              现有规模证据足以证明 Darwinbox 面向的是大市场，但不足以搭建清晰的公开 TAM/SAM/SOM。合作方撰写的 2025 年报告预计，全球 HCM 市场到 2030 年超过 USD 38
              billion；另一份置信度较低的上传备忘录称，薪资占 HCM 收入的 38%，HR 分析市场从 USD 3.7 billion（2025 年）增长到 USD 5.6 billion（2029
              年）。这些不同口径说明市场由多个大型预算池构成，而不是一条单一支出线。区域证据进一步勾勒出图景：上传备忘录称北美占 HCM 投资近 45%，APAC 增速最快；Darwinbox
              和近期报道也都强调正在扩大北美业务。这支持可信的扩张叙事，但还不能形成 Darwinbox 特定的 SAM，因为公开来源没有按地区、行业或员工规模拆分收入和 pipeline。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
