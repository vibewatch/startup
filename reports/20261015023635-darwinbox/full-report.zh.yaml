      - - 论点
        - Darwinbox 拥有覆盖面广的企业 HCM 套件，具备 AI、移动优先交付、开放 API 和真实生产环境，显示出实际的产品成熟度。
        - 官方披露持久的 ARR 增长和毛利率，将增强投资信心。
      - - 论点
        - 近期 OTPP 追加投资和 2025 年 1.4 亿美元轮融资表明，成熟投资者仍支持该平台从区域走向全球。
        - 新资本正高效转化为北美扩张的证据，会提升对上行空间的信心。
      - - 反论点
        - 关于 ARR、NRR、流失率、利润率和优先权结构的公开证据仍然稀薄，因此私募估值仍可能领先于基本面。
        - 经审计的 FY25/FY26 财务报表和清晰的资本表披露将减少估值歧义。
      - - 反论点
        - 独立买方评论仍指出性能、工作流、定价和支持方面的摩擦，这可能拖慢其对大型 HCM 既有厂商的扩张。
        - APAC 以外更强的独立客户成果和参考访谈，将缓解商业化风险。
    notes: 论点结合了官方产品证据与独立市场及评价来源；改变条件标出了最可能改变判断的尽调事项。
