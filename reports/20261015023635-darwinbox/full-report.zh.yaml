        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              就收入质量而言，公开图景总体偏正面：Darwinbox 似乎销售一种具有黏性、包含多个模块的企业记录系统，并具备真实的交叉销售潜力；公开新闻流也显示增长延续到 2025
              年。但本章仍缺少投资判断级财务证明。指定来源没有披露当前现金、月度 burn、现金 runway、债务额度、实际价格、产品或服务的毛利率，也没有队列级留存指标。因此，稳妥的财务结论是：Darwinbox
              具备可信的企业 SaaS 规模和合理的经常性收入质量，但决定性利润路径与近期融资依赖，仍是私有证据问题，而非公开事实。
