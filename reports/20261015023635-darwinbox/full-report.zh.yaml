      - number: '3.3'
        title: 切换成本、集成与分销能力
        blocks:
          - type: paragraph
            body: >-
              现有证据显示，可能的锁定机制来自运营深度，而不是合同条款。Darwinbox
              用一个系统承载敏感员工记录、薪资、出勤、招聘、绩效和分析，集成层再把这些工作流连接到周边企业系统。客户若要替换多个系统、配置国家特定流程并连接下游应用，再次切换时会承担数据迁移、变更管理、合规和集成工作。这是对实施深度的推断，不是留存或定价权证据；现有资料没有
              NRR、流失、续约、合同期限或迁移成本数据。分销也有两面性：Economic Times 报道了美国和英国扩张及 PwC India 等合作，但 Workday 和 SAP SuccessFactors 仍是
              incumbent 套件替代品，区域专业厂商也能争夺本地化部署。
            claimRefs:
              - CP006
              - CP007
              - CP013
              - CP014
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              从公开比较集合看，Darwinbox 的差异化可信，但尚未证明能够持久。移动优先设计、本地化薪资、可配置性、广泛集成和面向 AI 的路线图可以改善产品匹配，尤其适合亚洲和中东的复杂企业。不过，官方 AI
              和安全主张都来自公司自身；ERP Research 的部分能力覆盖也说明公开证明不完整。Incumbent 可以把 HCM
              捆绑进更大的企业系统，区域套件可以在本地化和服务上竞争，相邻平台可以从薪资或雇佣基础设施切入，内部团队也可以通过多套并用推迟替换。因此，投资结论应是具有差异化、实施黏性可能存在的挑战者，而不是已经证明的品类护城河。尽调应优先看竞争赢单/失单队列、实施投入、续约行为、模块附加率和实际价格。
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 已记录的切入点
            body: Darwinbox 将广泛 HCM 范围与移动优先的可配置性、本地化和集成工具结合起来；当全球套件过于复杂或昂贵时，这是一个逻辑自洽的挑战者定位。
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP007
          - type: callout
            title: 护城河仍未证实
            body: 公开来源没有披露竞争赢单率、续约队列、实际价格或切换成本，因此不能把实施广度误当成已证明的留存或定价权。
            calloutType: risk
            claimRefs:
              - CP011
              - CP014
              - CP015
              - CP016
