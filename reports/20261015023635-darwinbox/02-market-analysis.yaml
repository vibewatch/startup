callouts:
  - calloutType: risk
    title: Public TAM is broad; underwriting still depends on ICP fit
    body: >-
      The evidence supports a large HCM category and a credible Darwinbox wedge
      in payroll/compliance-heavy enterprise HR transformations, but it does not
      isolate a public SAM or durable North America win rate. Diligence should
      pressure-test quote-based pricing, implementation burden, payroll depth
      outside core markets, and support/reliability evidence before treating the
      global TAM as near-term revenue opportunity.
    claimRefs: [CM012, CM013, CM014, CM015, CM016]
