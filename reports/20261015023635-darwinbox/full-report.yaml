  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Darwinbox's reviewed official surfaces consistently present the company as an integrated enterprise HCM
              suite rather than a point product, spanning core HR, payroll, recruiting, performance, analytics, and
              adjacent employee-experience workflows. What public evidence does not provide is a numeric price card: the
              official pages in this pool describe modules, configuration, implementation speed, and enterprise
              positioning, but not PEPM price points, discount ladders, or regional contract minimums. That leaves the
              strongest monetization detail coming from an independent analyst brief, which characterizes the model as
              PEPM subscription pricing layered with module tiers and estimates a mix still centered on core HR/payroll,
              with meaningful services and add-on revenue beside it.
