          - type: callout
            title: Rollout and product-quality risk remain visible in third-party evidence
            body: >-
              Public review evidence does not undercut Darwinbox's functional breadth, but it does suggest that
              implementation discipline and day-two product quality matter: third-party sources cite heavy setup effort,
              UI bugs, process-flow friction, and periodic performance slowdowns.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise segment fit is clear even if revenue mix is not
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently positions Darwinbox as an enterprise HCM vendor rather than an SMB HR tool.
              DHRMap's August 2026 buyer-fit snapshot places the sweet spot at roughly 1,000–20,000 employees and
              highlights India, broader APAC, and the Middle East, with the US still growing. Official Darwinbox pages
              reinforce that buyer profile by emphasizing core HR, payroll, talent, recruiting, analytics, and mobile
              self-service in a single suite, then marketing configurability, open APIs, and faster go-live as adoption
              levers. The buyer/user split also looks consistent: HR operations, HR business partners, managers,
              finance/payroll teams, and broad employee populations appear to be the core audience, but Darwinbox does
              not publicly break out revenue by segment, geography, or buyer type.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
