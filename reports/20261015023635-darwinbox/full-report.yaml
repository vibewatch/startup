      - number: '5.4'
        title: Public trust messaging is broad; operational proof is thinner
        blocks:
          - type: paragraph
            body: >-
              Public trust and compliance messaging is present, but mostly at the level of product positioning rather
              than operational proof. Official and review-style sources mention role-based access, audit trails,
              enterprise-grade security, and ISO/GDPR-aligned compliance, which is directionally helpful for diligence.
              The more decision-useful risk signals in this pool come from buyer-facing third-party evidence: DHRMap
              explicitly says global brand strength outside APAC is smaller than Workday, SAP, or Oracle, and both
              DHRMap and TrustRadius surface performance or usability caveats. That leaves a gap between broad product
