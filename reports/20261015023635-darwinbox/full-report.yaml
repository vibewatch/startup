chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and positioning
        blocks:
          - type: paragraph
            body: >-
              Darwinbox's clearest current identity is as an enterprise HCM software vendor that wants to be read as
              AI-native rather than just a conventional HRMS suite. Its official homepage and product surfaces
              consistently anchor on AI, core HR, payroll, talent, analytics, and global-enterprise usage, while DHRMap
              independently describes the platform as covering the full hire-to-retire lifecycle with particular
              strength across Asia, India, and the Middle East. The harder identity question is headquarters. Retained
              public sources do not line up cleanly: DHRMap says the company moved its headquarters to Singapore, but
              the same profile also lists a Bryant Park, New York address, and Darwinbox's own newsroom earlier
              described Hyderabad as its new global headquarters. For downstream chapters, the reliable ground truth is
              therefore founding in 2015, Indian roots, enterprise HCM scope, and active international expansion rather
              than one confidently settled global HQ label.
