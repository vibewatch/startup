      - number: '6.3'
        title: Named customer proof is real, but proof quality varies by account
        blocks:
          - type: paragraph
            body: >-
              Darwinbox has more than logo-only evidence, but the quality of proof is uneven. Kotak Life is the clearest
              public case because the available evidence describes a full hire-to-retire rollout, a large employee base,
              rapid go-live, and mobile self-service adoption. Emcure adds another enterprise example, though the
              evidence is older and investor-authored. DHRMap also cites a multinational logo roster including
              Starbucks, Nivea, AXA, and Cigna, which is useful for confirming that Darwinbox can point to recognizable
              accounts, but those roster-style citations do not disclose the scope, modules, contract values, or renewal
              quality of each deployment. The distinction between outcome-bearing deployments and logo references
              matters for underwriting real expansion durability.
            claimRefs:
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
