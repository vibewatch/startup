          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Financing context is constructive, but mixed round structure and opaque pricing keep the stance stretched
        blocks:
          - type: paragraph
            body: >-
              The financing record is supportive but not clean enough to remove valuation risk. Fundz says Ontario
              Teachers' Pension Plan made a $40 million follow-on investment in September 2026, while Economic Times
              reported that OTPP had already invested $40 million in August 2025 after a March 2025 round that was
              largely secondary and only partly primary. Economic Times also said the March 2025 round carried a blended
              valuation of about $950 million. Inc42's company profile now lists total funding above $296 million, but
              funding raised is not cash available and does not resolve how much fresh primary capital remains on the
              balance sheet after secondary activity.

              This matters for entry discipline. A secondary-heavy round can validate investor demand and insider
              liquidity at the same time, but it does not automatically mean the business has new capital proportional
              to the headline round. The lack of public cap-table detail, liquidation preferences, and option-pool
              information makes it hard to assess how much upside a new investor really captures from any private mark.
              Meanwhile, independent pricing work from RFP.wiki says Darwinbox does not publish list pricing and that
              implementation, support, and AI add-ons can materially change year-one TCO. That makes it difficult to
              translate product quality into a clean valuation benchmark against more transparent HCM peers.

              Netting those facts together, the current evidence supports a stretched stance rather than an obviously
              expensive or attractive one. There is enough product and customer evidence to justify continued interest,
              but not enough public unit-economic disclosure to conclude the current private mark is underwritten by
              best-in-class SaaS quality.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Bull case needs better economic proof; base case is hold-and-verify
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Darwinbox keeps converting its APAC and Middle East enterprise position
              into global HCM share, uses fresh capital to deepen product and go after North America, and shows that
              revenue growth converts into attractive recurring economics. In that outcome, today's stretched mark could
              still compound into an acceptable return at an entry near the reported private marks because the business
              would look more like a scaled regional category winner than an emerging challenger.

              The base case is more cautious and better supported by the public record. Darwinbox has real scale, but
              the available evidence is still stronger on product breadth and funding access than on SaaS quality
              metrics. Without published ARR, retention, margins, churn, or explicit pricing benchmarks, the rational
              move is to keep the company in diligence, wait for either better economics or a softer entry, and avoid
              forcing precision where the evidence does not support it.

              The bear case centers on multiple compression and commercialization friction. Independent buyer-review
              sources still cite buggy UI, workflow complexity, performance slowdowns, and support responsiveness
              issues, while public disclosures do not show whether the 2025 and 2026 financings solved those constraints
              or merely extended the runway. Final diligence should therefore focus on audited FY25/FY26 financials,
              ARR/NRR, customer concentration, gross margin, implementation economics, and the exact preference stack.
              Until those are cleared, the thesis-break trigger is simple: if growth decelerates before Darwinbox proves
              durable recurring economics, the current private valuation can reset faster than the product narrative
              improves.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Track Darwinbox rather than force a buy call: the company looks commercially real and still fundable, but
              current public evidence is not strong enough to price the upside with confidence.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV013
              - CV014
              - CV016
          - type: callout
            title: Why the mark can still disappoint
            body: >-
              The biggest downside is not product existence but valuation opacity: if ARR quality, margins, retention,
              or liquidation preferences underwhelm, a stretched private mark can reset quickly.
            calloutType: risk
            claimRefs:
              - CV003
              - CV009
              - CV010
              - CV014
              - CV015
          - type: callout
            title: Diligence items that would move the decision
            body: >-
              The recommendation can improve if Darwinbox discloses audited FY25/FY26 financials, recurring-revenue
              quality metrics, enterprise win durability outside APAC, and the post-round cap-table or preference stack.
            calloutType: assumption
            claimRefs:
              - CV005
              - CV009
              - CV014
              - CV015
