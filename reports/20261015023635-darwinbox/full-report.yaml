  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public evidence links real product and customer proof to a price-sensitive track recommendation rather than a
      clean buy.
    data:
      nodes:
        - id: product
          label: Product breadth is real
          detail: Official pages show AI-powered HCM across core HR, payroll, talent, analytics, and mobile workflows.
          tone: positive
        - id: deployment
          label: Commercial deployment is visible
          detail: >-
            A live multilingual login surface and ongoing product-update claims support that the software is operating
            in production.
          tone: positive
        - id: scale
          label: Customer scale has independent support
          detail: Independent sources point to 1,000+ enterprises and more than 4 million covered employees.
          tone: positive
        - id: funding
          label: Financing support continues
          detail: 2025-2026 rounds show repeat institutional backing, but part of the capital history was secondary-heavy.
          tone: warning
        - id: gaps
          label: Core valuation inputs remain opaque
          detail: Public evidence still lacks ARR, NRR, gross margin, cash burn, and preference-stack detail.
          tone: negative
        - id: call
          label: Resulting stance is track / stretched
          detail: Keep the company in diligence and wait for better disclosure or a more forgiving entry point.
          tone: negative
      edges:
        - from: product
          to: deployment
          label: converts feature breadth into a live platform
        - from: deployment
          to: scale
