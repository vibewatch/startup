      - number: '6.4'
        title: Durability, concentration, and international depth remain the main public gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter's biggest public-evidence gap is customer durability. None of the sources in this pool
              disclose Darwinbox's NRR, GRR, gross churn, contract lengths, renewal rates, or top-customer
              concentration, so public readers cannot tell whether growth is driven mainly by new-logo adds, seat
              expansion inside the installed base, or a concentrated enterprise roster. DHRMap also notes that
              Darwinbox's footprint and brand outside APAC remain smaller than Workday, SAP, or Oracle, which fits the
              broader picture of a vendor that is strong in APAC-led enterprise contexts but still proving depth
              elsewhere. The main adverse signal in the assigned pool is operational rather than existential:
              TrustRadius reviews cite buggy UI moments, process-flow friction, and better reporting needs.
            claimRefs:
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise fit is real
            body: >-
              Darwinbox has credible public evidence that it wins inside large-enterprise HR environments, especially in
              APAC-led markets where mobile-first workflows, payroll complexity, and localization matter.
            calloutType: strength
            claimRefs:
