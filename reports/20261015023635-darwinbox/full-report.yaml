  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Darwinbox has a broad enterprise HCM suite with AI, mobile-first delivery, open APIs, and a live production
          surface, showing real product maturity.
        - Official disclosure of durable ARR growth and gross margin would strengthen conviction.
      - - Thesis
        - >-
          Recent OTPP follow-on capital and a $140 million 2025 round show that sophisticated investors still support
          the platform's regional-to-global expansion.
        - >-
          Evidence that fresh capital is converting into efficient North America expansion would improve upside
          confidence.
      - - Anti-thesis
        - >-
          Public evidence remains thin on ARR, NRR, churn, margins, and preference stack, so the private mark could
          still be ahead of the fundamentals.
        - Audited FY25/FY26 financials and clear cap-table disclosures would reduce valuation ambiguity.
      - - Anti-thesis
        - >-
          Independent buyer commentary still flags performance, workflow, pricing, and support friction, which can slow
          expansion against larger HCM incumbents.
        - Stronger independent customer outcomes and reference calls outside APAC would soften commercialization risk.
    notes: >-
      Thesis lines combine official product evidence with independent market and review sources; change conditions
      identify the diligence items most likely to move the call.
