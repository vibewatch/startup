      - number: '2.3'
        title: Adoption drivers and frictions
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are clearer than precise market sizing. Darwinbox's own product pages emphasize
              configurability, open APIs, rapid onboarding, and global compliance, while Microsoft's partnership release
              shows a practical route into the daily workflow through Teams, Viva, Dynamics 365, Azure AD, and Power BI.
              Combined with the platform's mobile-first positioning, those factors make Darwinbox easiest to justify
              when a buyer wants to consolidate fragmented HR tools without forcing deskless populations back to
              desktop-first systems. The friction side is also consistent across independent buyer-oriented sources:
              pricing is quote-only, implementation and migration effort can dominate year-one cost, native EOR is
              absent, and some users report support delays or performance slowdowns at peak load. The practical
              implication is that Darwinbox should be underwritten as a configurable enterprise transformation program,
              not as lightweight HR tooling with instant time-to-value.
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public TAM is broad; underwriting still depends on ICP fit
            body: >-
              The evidence supports a large HCM category and a credible Darwinbox wedge in payroll/compliance-heavy
              enterprise HR transformations, but it does not isolate a public SAM or durable North America win rate.
              Diligence should pressure-test quote-based pricing, implementation burden, payroll depth outside core
              markets, and support/reliability evidence before treating the global TAM as near-term revenue opportunity.
