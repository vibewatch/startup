              The assigned evidence points to a classic enterprise-sales motion rather than a self-serve SMB funnel.
              Value For Startups describes direct selling into CHRO/CIO buyers and long procurement cycles, while the
              reviewed official pages emphasize configurability, implementation support, integrations, and security
              posture that map to large-account buying criteria. Public traction is real but mixed in quality: Economic
              Times reports FY24 revenue grew 58% to Rs 392 crore, Business Wire carries Darwinbox's April 2026 claim of
              nearly 5 million employees across more than 1,200 enterprises, and a September 2025 investment memo on
              Scribd described 3M+ users across 1,000+ organizations earlier in the scaling curve. Unit-economics detail
              is thinner. The most specific numbers in this pool - gross margin, NRR, CAC payback, and EBITDA posture -
              come from one independent but estimate-heavy analyst note, so they are useful directional inputs, not
