  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The near-term underwriting issue is not whether Darwinbox has product breadth; it is whether buyers can
              deploy that breadth without paying for unused modules or accepting a long, consultant-heavy rollout. The
              strongest independent negative signal in the assigned pool is module sprawl: one 2026 review says most
              customers actively use only four modules in production even though broader bundles are often sold up
              front. A second cluster of risk comes from execution velocity. Public commentary pegs enterprise rollouts
              at 90 to 150 days and notes that complex workflow setup still requires significant admin effort. Those
              exposures are partly offset by company claims around faster onboarding, open APIs, and continuing product
              investment, but the residual profile still looks high until a buyer validates phased rollout, activation
              KPIs, and integration readiness account by account.
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR013
              - CR014
