      - number: '3.2'
        title: Capability, packaging, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              Darwinbox's documented proposition is breadth on a single platform: core HR, payroll, recruitment,
              performance, workforce management, engagement, and people analytics. Official pages emphasize a
              mobile-first experience, configurable workflows, open APIs, and frequent product updates, while ERP
              Research reports more than 300 prebuilt connectors and records evidence for 33 of 61 capabilities it
              tracks, plus one partial capability. That count is not a universal feature score: the publisher explicitly
              says that “not evidenced” means public documentation was not found and that the capability may still
              exist. Commercially, the retained independent source characterizes pricing as quote-based, driven by
              employee count, modules, and contract length, and says it is materially below Workday and SuccessFactors
              for comparable scope in Darwinbox's strongest regions. Exact competitor list prices and realized Darwinbox
              discounts are unavailable, precluding a credible total-cost comparison.
