  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Darwinbox converts fresh capital into faster global expansion while proving high-quality recurring revenue and
          strong retention.
        - A stretched entry can still work if future disclosures show elite SaaS quality and strategic scarcity.
        - North America expansion burns cash before repeatability is proven.
        - Would need audited financials plus strong cohort and margin data.
      - - Base
        - Growth continues but public disclosures stay incomplete and investors must underwrite with partial evidence.
        - Returns depend more on disciplined entry price than on multiple expansion from current marks.
        - Valuation stays range-bound while governance and economics questions remain open.
        - Best aligned with today's evidence set.
      - - Bear
        - Growth slows before Darwinbox proves margins, retention, or pricing power and a private reset follows.
        - Secondary-heavy prior rounds and unclear preferences compress common-equity upside quickly in a reset.
        - Product-review friction and opaque TCO weaken win rates versus larger peers.
        - Triggered if diligence shows weak retention, thin margins, or adverse cap-table terms.
    notes: >-
      Scenario table is directional because public evidence does not disclose enough data for a defensible numeric
      valuation model.
    claimRefs:
      - CV001
