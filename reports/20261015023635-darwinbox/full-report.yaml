              - CR004
              - CR005
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria to clear before underwriting upside
            body: >-
              Treat the thesis as impaired if Darwinbox cannot show production-grade DPDP and breach-notification
              artifacts, a staffed rollout plan that materially improves on the 90-150 day public benchmark, and a
              phased module-activation plan that avoids full-bundle shelfware. A buyer should also demand integration
              proof on its own legacy stack rather than relying on generic API marketing.
            calloutType: risk
            claimRefs:
              - CR002
              - CR006
              - CR011
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation stays at track because operating proof outruns valuation disclosure
        blocks:
          - type: paragraph
            body: >-
              Public evidence still points to a real enterprise software business rather than a speculative story.
              Darwinbox's official pages position the product as an AI-powered, mobile-first HCM suite spanning core HR,
              payroll, talent, analytics, and employee workflows, while a live branded login surface shows that a
              customer-facing access endpoint exists without establishing deployment scale or production usage.
              Independent sources also continue to show meaningful customer scale: DHRMap describes Darwinbox as a
              hire-to-retire HCM vendor with 1,000+ client accounts, and Economic Times reported more than 4 million
              covered employees across 1,000 enterprises in mid-2025. That combination supports a real
              enterprise-software thesis.

              The valuation call is less comfortable. The market is still willing to fund the company, with Fundz and
              Economic Times both pointing to fresh Ontario Teachers' backing in 2025-2026, but the latest public
              evidence does not resolve the key inputs needed to underwrite upside at a stretched price. Public sources
              still do not disclose ARR, gross margin, NRR, cash burn, or the exact preference stack after secondary-led
              financing. Pricing remains quote-led rather than transparent, and independent buyer commentary still flags
              performance, workflow, and support friction. Those missing inputs matter because valuation discipline for
              late-stage HCM software should depend on durable recurring revenue quality, not just headline funding
              momentum.

              The practical implication is a TRACK recommendation with medium confidence and a high risk rating. The
              company appears good enough to keep on the list, but not transparent enough to justify a buy
              recommendation on public evidence alone. A better entry case would require either stronger disclosures on
              recurring economics and capital structure or a price reset that leaves room for execution and liquidity
              risk.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
