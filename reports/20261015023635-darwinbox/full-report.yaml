      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Financing headlines here need careful interpretation. Economic Times' 2025-2026 items describe recent
              rounds at roughly $950 million to $1 billion blended valuation, but they also repeatedly note secondary
              components, including a March 2025 round that was largely secondary with only a small primary tranche and
              an August 2025 round that mixed primary and secondary stock. That is supportive of shareholder liquidity
              and price discovery, but it does not prove the company added the full headline round size to cash.
              Meanwhile, the strongest adverse analysis in the assigned pool argues that long enterprise sales cycles,
              implementation-heavy go-lives, and unproven North America expansion can all drag margins and extend the
              period before cash generation catches up with growth.
            claimRefs:
              - CI010
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public picture is directionally constructive on revenue quality: Darwinbox appears to sell a sticky,
              multi-module enterprise system of record with real cross-sell potential, and public news flow suggests
              growth has continued through 2025. But this chapter is still short of underwriting-grade financial proof.
              The assigned sources do not disclose current cash on hand, monthly burn, runway, debt facilities, realized
              pricing, gross margin by product or services, or cohort-quality retention metrics. As a result, the
              prudent financial verdict is that Darwinbox has credible enterprise SaaS scale and plausible
              recurring-revenue quality, but the decisive margin path and near-term financing dependency remain
              private-evidence questions rather than public facts.
