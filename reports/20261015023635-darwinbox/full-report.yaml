        title: Architecture favors configurability over simplicity
        blocks:
          - type: paragraph
            body: >-
              The strongest public architecture detail in the assigned pool comes from Josh Bersin, who describes
              Darwinbox as a micro-services platform on top of a Neo4J graph database. That description aligns with
              official and semi-independent material emphasizing complex org structures, localized workflows, and
              change-heavy operating models such as mergers, reorganizations, or cross-functional teams. Taken together,
              the picture is of a product built to model enterprise complexity through configurable mini-apps and
              multiple workflow views rather than through a simpler, opinionated mid-market design. That is a real
              differentiator if accurate, but it also means the architecture story depends heavily on a limited set of
              public technical descriptions instead of deep open documentation.
            claimRefs:
              - CE003
