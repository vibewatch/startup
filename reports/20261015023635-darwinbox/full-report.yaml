            body: >-
              Public leadership visibility is decent at the founder and operating level but weak at the governance
              level. DHRMap still names founders Chaitanya Peddi, Jayant Paleti, and Rohit Chennamaneni, while 2024-2026
              coverage shows Darwinbox continuing to broaden the leadership bench by elevating CTO Vineet Singh to
              cofounder and appointing Akshay Murthy as Country Head India. That pattern suggests continued founder
              centrality alongside efforts to institutionalize operating leadership in a core market. What is still
              missing from the retained public record is the current board roster, investor voting rights, and any
              formal control map after the 2025 and 2026 financing activity. That absence does not invalidate the
              business, but it does mean later diligence should treat governance and preference-stack visibility as open
              work rather than assumed facts.
