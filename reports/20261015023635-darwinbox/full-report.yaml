      - number: '6.2'
        title: Adoption proof exists, but the best public signals are scale and usage proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption story is directional rather than fully cohort-based. Lightspeed wrote in
              early 2022 that Darwinbox had already reached 650+ enterprises and 1.5 million users, with one-third of
              quarterly revenue coming from Southeast Asia. By mid-2025, Economic Times reported Darwinbox had crossed
              1,000 enterprises globally and served more than 4 million employees, which suggests continued account and
              end-user growth. Fluid Topics adds a different lens: Darwinbox's help portal grew its content corpus,
              active user base, engagement time, and support deflection. Those signals matter because they show live
              post-sale usage, but they are not a substitute for disclosed NRR, GRR, renewal, or seat expansion data.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
