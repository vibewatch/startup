      - number: '3.3'
        title: Switching cost, integrations, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The likely lock-in mechanism is operational rather than contractual evidence visible in the pool.
              Darwinbox markets one system across sensitive employee records, payroll, attendance, recruiting,
              performance, and analytics, while its integration layer connects those workflows to surrounding enterprise
              systems. A customer replacing several systems, configuring country-specific processes, and connecting
              downstream applications would face data-migration, change-management, compliance, and integration work
              when switching again. This is an inference about implementation depth, not evidence of retention or
              pricing power; no NRR, churn, renewal, contract-duration, or migration-cost data were retained.
              Distribution also cuts both ways. The Economic Times reports US and UK expansion and partnerships such as
              PwC India, but Workday and SAP SuccessFactors remain incumbent-suite alternatives, and regional
              specialists can contest localized deployments.
            claimRefs:
              - CP006
              - CP007
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Darwinbox's differentiation is credible but not yet proven durable by the public comparison set.
              Mobile-first design, localized payroll, configurability, integration breadth, and an AI-forward roadmap
              can improve product fit, especially for complex enterprises in Asia and the Middle East. However, official
              AI and security claims are company-issued, and ERP Research's partial capability coverage shows that
              public proof is incomplete. Incumbents can bundle HCM into broader enterprise estates, regional suites can
              compete on localization and service, adjacent platforms can enter through payroll or employment
              infrastructure, and internal teams can postpone replacement through multi-homing. The investment
              conclusion is therefore a differentiated challenger with plausible implementation stickiness, not a
              demonstrated category moat. Diligence should prioritize competitive win/loss cohorts, implementation
              effort, renewal behavior, module attach, and realized pricing.
            claimRefs:
              - CP002
              - CP009
              - CP010
              - CP012
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Documented wedge
            body: >-
              Darwinbox combines broad HCM scope with mobile-first configurability, localization, and integration
              tooling; this is a coherent challenger position where global-suite complexity or price is a buyer concern.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP007
          - type: callout
            title: Moat remains unproven
            body: >-
              Public sources do not disclose competitive win rates, renewal cohorts, realized pricing, or switching
              costs, so implementation breadth should not be mistaken for demonstrated retention or pricing power.
            calloutType: risk
            claimRefs:
