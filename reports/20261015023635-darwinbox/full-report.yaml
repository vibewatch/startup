            title: Customer-quality risk is a disclosure gap, not yet a public collapse signal
            body: >-
              The assigned pool shows some product-friction complaints and weaker brand depth outside APAC, but the
              larger concern is that public evidence still cannot quantify churn, concentration, or renewal quality.
