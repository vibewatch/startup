      - number: '7.2'
        title: Regulatory, data-governance, and control risk
        blocks:
          - type: paragraph
            body: >-
              Darwinbox's public posture on security is directionally reassuring but still incomplete for a diligence
              file that has to clear enterprise payroll and employee-data risk. Company marketing emphasizes globally
              compliant HR infrastructure, strong security standards, and frequent product updates, while an independent
              2026 review cites SOC 2 Type II, ISO 27001, ISO 22301, and GDPR-aligned handling. That is enough to rate
              the control environment as materially better than an unproven startup, but not enough to close legal
              diligence. The assigned pool does not include Darwinbox's DPA, subprocessor register, cross-border
              transfer controls, incident-notification workflow, or a documented statutory-update SLA for India payroll
              changes. Because HR data is sensitive and payroll deadlines are unforgiving, those missing artifacts
              remain a material residual risk rather than a paperwork footnote.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR001
