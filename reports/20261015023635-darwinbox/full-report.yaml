  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Darwinbox actually delivers
        blocks:
          - type: paragraph
            body: >-
              Across the assigned sources, Darwinbox is consistently described as an end-to-end HCM platform rather than
              a narrow HR point tool. Official product surfaces and third-party summaries all place recruitment,
              onboarding, core HR, payroll, engagement, performance, and analytics inside one suite, which matters
              because the company's product pitch depends on reducing handoffs between hiring, employee data, and
              downstream workforce operations. The same evidence also narrows the buyer profile: this is framed for
              larger enterprises and multi-entity employers whose process complexity has already outgrown lightweight
              HRIS tools, not for low-complexity teams looking for a minimal system of record.
            claimRefs:
              - CE001
              - CE002
              - CE008
          - type: table
