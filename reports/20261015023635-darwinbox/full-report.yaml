  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer wedge
        blocks:
          - type: paragraph
            body: >-
              The most defensible market boundary for Darwinbox is enterprise HCM: system-of-record core HR plus
              payroll/compliance, workforce management, recruiting, performance, engagement, and people analytics. That
              is wider than a narrow HRIS point tool, but narrower than generic "future of work" software or a full ERP
              replacement. Public buyer-facing sources are unusually consistent on where Darwinbox fits best: large
              enterprises in India, broader APAC, and the Middle East that need localized payroll and compliance, plus
              mobile-first workflows for manufacturing, retail, and logistics workforces. The same sources also narrow
              the edge of the market: Darwinbox is not the same thing as native EOR hiring, and it is not yet presented
              as the default choice for US-headquartered Fortune 500 buyers that want finance-plus-HCM standardization
              from incumbents such as Workday, SAP, or Oracle.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM009
              - CM010
              - CM013
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM011
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing and regional shape
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence is good enough to show that Darwinbox sells into a large market, but not
              good enough to produce a clean public TAM/SAM/SOM stack. A partner-authored 2025 note puts global HCM
              above USD 38 billion by 2030, while a lower-confidence uploaded memo points to payroll as 38% of HCM
              revenue share and HR analytics growing from USD 3.7 billion in 2025 to USD 5.6 billion in 2029. Those
              unlike lenses suggest a market with multiple large budget pools rather than one monolithic spend line.
              Regional evidence sharpens the story: the uploaded memo says North America accounts for nearly 45% of HCM
              investment and APAC is fastest-growing, while Darwinbox and recent reporting both emphasize fresh North
              America expansion. That supports a credible expansion narrative, but it still falls short of a
              Darwinbox-specific SAM because public sources do not break out revenue or pipeline by region, industry, or
              employee band.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
