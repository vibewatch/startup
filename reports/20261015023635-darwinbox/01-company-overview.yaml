          tone: positive
          claimRefs: [CO014]
        - date: "2025-08-14"
          label: TVG investment
          detail: Darwinbox announced a separate $40 million investment from Teachers' Venture Growth to support continued expansion.
          tone: positive
          claimRefs: [CO012]
        - date: "2026-07-27"
          label: New India country head
          detail: Darwinbox appointed Akshay Murthy as Country Head India, showing ongoing operating investment in its home market.
          tone: neutral
          claimRefs: [CO008]
        - date: "2026-08-04"
          label: Cortex launch
          detail: The company launched Cortex as an AI-native HCM platform rebuilt around an AI-era product narrative.
          tone: positive
          claimRefs: [CO003]
        - date: "2026-09-02"
          label: Microsoft partnership expanded
          detail: Darwinbox said it expanded its Microsoft partnership to deepen enterprise value delivery with frontier-tuning language.
          tone: positive
          claimRefs: [CO003]
    approximationNotes: null
    claimRefs: [CO001, CO003, CO005, CO007, CO008, CO010, CO011, CO012, CO014]
callouts:
  - calloutType: strength
    title: Real enterprise momentum is visible even without full private-company disclosure
    body: >-
      The combination of repeated financing access, 1,000+ enterprise customer
      claims, 4M+ employees served, and ongoing product launches is enough to
      treat Darwinbox as a scaled late-stage platform rather than a niche HR
      startup.
    claimRefs: [CO010, CO012, CO014]
  - calloutType: risk
    title: The biggest overview-level risk is opacity, not absence of momentum
    body: >-
      Headquarters labeling, exact cap-table structure, board composition,
      current headcount, and the precise Sep 2026 TVG follow-on amount all
      remain uncertain in retained public evidence, while review surfaces also
      point to product-performance and support friction.
    claimRefs: [CO004, CO005, CO009, CO013, CO015, CO016]
