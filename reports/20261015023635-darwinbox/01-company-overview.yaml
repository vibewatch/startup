    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap / note
    rows:
      - ["Founded", "2015", "2015", "Medium", "Founder date is consistent across retained sources."]
      - ["Business model", "Enterprise HCM SaaS covering core HR, payroll, talent, recruiting, performance, engagement, analytics, and AI positioning", "2026 public surfaces", "High", "Official framing is clear; market-share evidence belongs in later chapters."]
      - ["Headquarters", "Conflicting public signals: Singapore move, Hyderabad global-HQ language, and a New York directory address all appear in retained sources", "2022-2026", "Low", "Confirm legal HQ, operating HQ, and principal employer entities in diligence."]
      - ["Latest disclosed major financing", "$140M Mar 2025 plus $40M TVG Aug 2025; Sep 2026 follow-on reported but amount disclosure is inconsistent", "2025-2026", "Medium", "Need signed financing documents and exact 2026 round status."]
      - ["Valuation signal", "About $950M blended valuation cited for the Mar 2025 round", "2025-03", "Medium", "No audited current post-money or cap table in retained evidence."]
      - ["Scale signal", ">1,000 enterprises and >4M employees served; 11 global offices cited by mid-2025", "2025-06 to 2025-08", "High", "No precise 2026 customer count or employee count."]
      - ["Headcount", "Only a broad 1001-5000 employee band is public in retained sources", "2026-08", "Medium", "Need exact payroll headcount and geographic split."]
    notes: >-
      Mixes official releases, a directory profile, and independent reporting;
      unresolved metrics are stated as status/gaps rather than converted into
      unsupported point estimates.
    claimRefs: [CO001, CO002, CO004, CO005, CO010, CO011, CO012, CO013, CO014]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role / status
      - Background / coverage
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Chaitanya Peddi", "Co-founder", "Publicly listed founder", "Anchors founding continuity and external company identity", "High because founder set remains central in public record."]
      - ["Jayant Paleti", "Co-founder", "Publicly listed founder", "Supports continuity of original operating team", "High because little board-level governance detail offsets founder concentration."]
      - ["Rohit Chennamaneni", "Co-founder", "Publicly listed founder", "Third named founder in retained public record", "High because public control map is still incomplete."]
      - ["Vineet Singh", "CTO elevated to cofounder in Aug 2024", "Technical leadership elevated into founder tier", "Signals product and AI roadmap importance in company narrative", "Medium; elevation may reduce single-thread technical dependence but also underscores technical key-person risk."]
      - ["Akshay Murthy", "Country Head India since Jul 2026", "Named operating leader for core domestic market", "Shows Darwinbox is still investing in India execution while expanding globally", "Medium; role suggests market execution depth below founder tier."]
    notes: >-
      Enumeration is partial rather than exhaustive because retained public
      sources do not disclose the full executive bench or board roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Compiled from the retained founder profile plus named leadership changes
        visible in 2024-2026 public reporting and newsroom posts.
    claimRefs: [CO006, CO007, CO008, CO009]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Diligence ask
    rows:
      - ["KKR and Partners Group", "Co-led Mar 2025 financing", "Most visible recent institutional capital and key valuation anchor", "Confirm ownership %, board seats, liquidation preference, and how much of the round was secondary."]
      - ["Teachers' Venture Growth / OTPP", "Growth investor in Aug 2025 and reported Sep 2026 follow-on", "Signals continuing external support and possible late-stage price support", "Confirm whether the Sep 2026 follow-on closed, exact amount, and whether it changed governance rights."]
      - ["TCV plus earlier venture backers", "Led 2022 unicorn round and remain part of the disclosed backer set", "Important legacy ownership block and potential secondary sellers", "Confirm remaining stake sizes, pro-rata behavior, and any sale restrictions."]
      - ["Employees / option holders", "Beneficiaries of the Jun 2025 ESOP buyback", "Employee liquidity and retention are material in a late-stage private company", "Request current option pool, exercised/unexercised split, and post-buyback overhang."]
      - ["Microsoft and other go-to-market / product partners", "Technology and distribution ecosystem partners", "Can influence product credibility and expansion velocity without direct control", "Clarify revenue contribution, exclusivity, and whether partnerships drive meaningful pipeline."]
    notes: >-
      Sample map focused on publicly visible economic or strategic stakeholders;
      it is not a cap table and should not be read as a complete control chart.
    enumerationScope:
      coverage: sample
      basis: >-
        Limited to stakeholders explicitly named in retained 2022-2026 public
        evidence covering financings, ESOP liquidity, and strategic
        partnerships.
    claimRefs: [CO003, CO010, CO011, CO012, CO013, CO016]
