          claimRefs: [CO007]
        - date: "2025-03-05"
          label: $140M financing announced
          detail: Partners Group and KKR co-led a $140 million investment, with ET separately framing the round as largely secondary.
          tone: positive
          claimRefs: [CO010, CO011]
        - date: "2025-06-24"
          label: ESOP buyback and office footprint
