artifact: company-overview
slug: darwinbox
runDate: 2026-10-15
company:
  name: Darwinbox
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Darwinbox presents as a late-stage private, AI-forward HCM platform with
    credible enterprise scale signals, recent product launches, and repeated
    access to growth capital, but public evidence still leaves key control,
    headquarters, and exact cap-table questions unresolved. The strongest
    support comes from Darwinbox's own 2025-2026 announcements cross-checked
    with Economic Times reporting and independent product-review surfaces.
sections:
  - id: identity-and-positioning
    title: Identity and positioning
    body: >-
      Darwinbox's clearest current identity is as an enterprise HCM software
      vendor that wants to be read as AI-native rather than just a conventional
      HRMS suite. Its official homepage and product surfaces consistently anchor
      on AI, core HR, payroll, talent, analytics, and global-enterprise usage,
      while DHRMap independently describes the platform as covering the full
      hire-to-retire lifecycle with particular strength across Asia, India, and
      the Middle East. The harder identity question is headquarters. Retained
      public sources do not line up cleanly: DHRMap says the company moved its
      headquarters to Singapore, but the same profile also lists a Bryant Park,
      New York address, and Darwinbox's own newsroom earlier described
      Hyderabad as its new global headquarters. For downstream chapters, the
      reliable ground truth is therefore founding in 2015, Indian roots,
      enterprise HCM scope, and active international expansion rather than one
      confidently settled global HQ label.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Public leadership visibility is decent at the founder and operating level
      but weak at the governance level. DHRMap still names founders Chaitanya
      Peddi, Jayant Paleti, and Rohit Chennamaneni, while 2024-2026 coverage
      shows Darwinbox continuing to broaden the leadership bench by elevating
      CTO Vineet Singh to cofounder and appointing Akshay Murthy as Country
      Head India. That pattern suggests continued founder centrality alongside
      efforts to institutionalize operating leadership in a core market. What
      is still missing from the retained public record is the current board
      roster, investor voting rights, and any formal control map after the 2025
      and 2026 financing activity. That absence does not invalidate the
      business, but it does mean later diligence should treat governance and
      preference-stack visibility as open work rather than assumed facts.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002, TO003]
  - id: funding-scale-and-momentum
    title: Funding, scale, and momentum
    body: >-
      Darwinbox has enough recent financing and operating milestones to support
      a late-stage scaling narrative, but not enough public disclosure to turn
      that into a clean capital-structure picture. Official releases and
      Economic Times reporting align on a $140 million March 2025 financing and
      a separate $40 million Teachers' Venture Growth investment in August 2025,
      while September 2026 reporting suggests renewed TVG backing with less
      certainty on the exact amount. Scale signals also look real rather than
      purely aspirational: public reporting ties the business to more than 1,000
      enterprises, more than 4 million employees served, FY24 revenue of Rs 392
      crore, 58% revenue growth, and an 11-office footprint by mid-2025.
      However, current exact headcount, customer count as of run date, and the
      split between primary capital and secondary liquidity remain areas where
      management materials are still needed.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
tables:
