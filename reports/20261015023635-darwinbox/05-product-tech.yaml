  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Direct developer telemetry such as API usage, release-note history, connector adoption, repo or package activity, or engineering-community support signals.
      whyItMatters: TrustRadius supplies a practitioner proxy for daily use, but the assigned pool does not independently show whether APIs and connectors are widely used or operationally mature.
      diligencePath: Review Darwinbox API docs, connector catalog, changelog cadence, and any public or customer-visible ecosystem metrics directly with product and solutions engineering.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: reliability-telemetry
      missingEvidence: Public uptime, incident history, status-page evidence, response-time SLOs, or objective production reliability data.
      whyItMatters: Third-party comments mention lag and usability friction, so diligence needs hard operational telemetry to judge whether product breadth is matched by stable production performance.
      diligencePath: Request uptime history, support-severity logs, status-page records, and module-level performance benchmarks by region and customer size.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: security-assurance
      missingEvidence: Direct audit artifacts or scoped evidence for certifications, data residency, privacy controls, and subprocessor/security-operations practices.
      whyItMatters: The public trust narrative is broad, but underwriting enterprise HR data risk requires evidence beyond marketing language about standards and compliance.
      diligencePath: Obtain certification reports, control mappings, pen-test or audit summaries, DPA terms, and region-specific data-hosting details from security or legal teams.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE003]
