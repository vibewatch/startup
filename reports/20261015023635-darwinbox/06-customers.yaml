      - Scale evidence
      - Revenue / strategic value
      - Gap
    rows:
      - [Large APAC enterprises, HR ops and leadership / employees / corporate HR-budget owners, Unified core HR and hire-to-retire HCM, DHRMap buyer fit centers on roughly 1000-20000 employees, Likely core installed base and reference set, No public segment revenue split or ACV data]
      - [Banks and insurers, HR teams / managers / enterprise HR-budget owners, Multi-system integration and mobile self-service, Kotak Life and BPI-style enterprise evidence point to regulated buyers, Strategic proof for complex and compliance-heavy workflows, Contract size and renewal depth undisclosed]
      - ["Manufacturing / pharma / conglomerates", HRBPs and managers / employees / enterprise HR-budget owners, "Talent / feedback / broader HR system replacement", Emcure plus DHRMap sector list show non-tech enterprise relevance, Supports cross-vertical adoption thesis, Current win-rate by vertical is not public]
      - ["International multi-country enterprises", Payroll and finance / HR admins / centralized enterprise buyers, "Multi-country payroll / configurable workflows / integrations", Official pages emphasize open APIs and multi-country payroll while ET reports US expansion, Important for international expansion and upsell, Brand depth outside APAC remains smaller than Workday/SAP/Oracle]
    notes: Combines official positioning with third-party buyer-fit and named-account evidence; Darwinbox does not publicly disclose segment revenue mix, pricing bands, or ACVs in this pool.
    claimRefs: [CU001, CU002, CU003, CU004, CU015]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Enterprise customers, 650+ enterprises, "2022-01-27", Lightspeed Venture Partners, Medium, Shows Darwinbox had already reached meaningful enterprise scale by early 2022, No segment or ARR breakdown]
      - [Platform users, 1.5 million users, "2022-01-27", Lightspeed Venture Partners, Medium, Confirms broad employee-level reach before the later funding rounds, User definition and activity threshold not disclosed]
      - [Enterprise customers, 1000+ enterprises globally, "2025-08 / 2025-06 ET items", The Economic Times, Medium, Indicates continued logo growth and broader geographic scale, Net adds and production-vs-pilot split not disclosed]
      - [Employees served, 4 million+ employees, "2025-06-24 ET item", The Economic Times, Medium, Suggests end-user reach expanded materially versus 2022, Employee count is not directly comparable to active users]
      - [Help-portal content and reach, Articles grew 5000 to 10000 and views reached 1 million over the past year, Undated partner case study, Fluid Topics, Medium, Shows Darwinbox is investing in post-sale enablement and self-service, Portal activity does not equal paid-seat expansion]
      - [Help-portal engagement, Active users grew 4000 to 12000 and average engagement reached 13 minutes, Undated partner case study, Fluid Topics, Medium, Suggests users are actually consuming support content, User cohort and audience mix are not disclosed]
      - [Support deflection, 65 percent deflection via chatbot integration, Undated partner case study, Fluid Topics, Medium, Positive indicator for scaled customer support and onboarding, No baseline ticket volume or customer-retention link]
    notes: Public adoption signals mix customer-count, employee-count, and support-portal metrics; they indicate traction but are not directly comparable and do not reveal renewal quality.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [Kotak Life Insurance, Insurance / large enterprise, Full hire-to-retire lifecycle and multi-system employee-experience integration, Production, DHRMap cites a 16000+ employee rollout with about three-month go-live and 100 percent mobile-enabled self-service; LSVP says Darwinbox integrated more than 6 systems, Evidence is still vendor- and investor-mediated rather than an independent buyer interview]
      - [Emcure Pharmaceuticals, Pharma / established enterprise, Talent-data visibility and feedback workflows across a large employee base, Production implied, LSVP says the deployment covered 7500+ employees and improved efficiency and retention, Outcome is older 2022 investor-authored evidence without current-state verification]
      - ["Starbucks / Nivea / AXA / Cigna roster", Multinational enterprise logos, Publicly cited customer roster within Darwinbox's 1000+ client base, Not disclosed, Confirms Darwinbox can point to recognizable multinational accounts, No module scope timing seat count or per-customer outcome evidence in the assigned pool]
    notes: This is a sample of the named public evidence in the assigned pool, not an exhaustive customer roster; public proof is strongest where a case study describes deployment scope and weakest where only logos are cited.
    enumerationScope:
      coverage: sample
      basis: Publicly named customer evidence available in the assigned pool, prioritized for rows with deployment or outcome detail rather than every logo citation.
    claimRefs: [CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Public evidence implies a Darwinbox customer journey centered on large-enterprise fit, configurable implementation, employee self-service, and post-sale support enablement.
    data:
      items:
        - label: Regional enterprise fit
          actor: CHRO / HR ops / IT
          stage: Land
          touchpoints:
            - Mid-to-large enterprise buyer fit around 1000-20000 employees
            - India, broader APAC, and Middle East footprint with US growth
        - label: Suite-based evaluation
          actor: HR leadership / payroll / talent teams
          stage: Evaluate
          touchpoints:
            - Unified core HR, payroll, recruiting, performance, and engagement
            - Enterprise positioning rather than point-solution HR tooling
        - label: Fast-track implementation
          actor: Implementation and IT teams
          stage: Implement
          touchpoints:
            - Simple configuration, data migration, and targeted change management
            - Open APIs and multi-country payroll for complex environments
        - label: Daily employee self-service
          actor: Employees and managers
          stage: Use
          touchpoints:
            - Mobile-first UX for attendance, leave, and employee workflows
            - Buyer promise is high adoption through easier end-user experience
        - label: Support and enablement layer
          actor: Customers, partners, and Darwinbox support teams
          stage: Adopt
          touchpoints:
            - 12000 help-portal active users, 1 million views, 13-minute engagement
            - 65 percent support deflection from chatbot-linked content
        - label: Expansion and durability test
          actor: Finance, customer success, and executive buyers
          stage: Expand
          touchpoints:
            - SEA represented one-third of quarterly revenue in 2022
            - Renewal, NRR, churn, and concentration metrics remain undisclosed
    claimRefs: [CU002, CU003, CU004, CU006, CU010, CU011, CU015]
callouts:
  - calloutType: strength
    title: Enterprise fit is real
    body: Darwinbox has credible public evidence that it wins inside large-enterprise HR environments, especially in APAC-led markets where mobile-first workflows, payroll complexity, and localization matter.
    claimRefs: [CU001, CU002, CU003, CU004, CU012]
  - calloutType: insight
    title: Adoption proof is stronger on usage than on retention
    body: Public sources provide real usage signals through customer counts, employee reach, and support-portal engagement, but they still do not disclose the recurring-revenue durability metrics investors usually want.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU015]
  - calloutType: risk
    title: Customer-quality risk is a disclosure gap, not yet a public collapse signal
    body: The assigned pool shows some product-friction complaints and weaker brand depth outside APAC, but the larger concern is that public evidence still cannot quantify churn, concentration, or renewal quality.
    claimRefs: [CU015, CU016]
