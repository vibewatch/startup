  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-durability
      missingEvidence: Customer-cohort data covering NRR, GRR, gross churn, contract lengths, and renewal rates by region or customer segment.
      whyItMatters: Without durability metrics, it is hard to separate healthy expansion from new-logo growth or to test whether Darwinbox's reference accounts are sticky at scale.
      diligencePath: Request cohort tables and renewal reporting for the top 20 accounts, broken out by region and product module.
      relatedQuestionRefs: [QU007]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Revenue concentration by top customers, channel partners, and geography, plus a production-versus-pilot split for the publicly cited logos.
      whyItMatters: Enterprise SaaS growth can look broad in logo count while still being concentrated in a handful of large accounts, one region, or partner-led distribution.
      diligencePath: Request top-10 customer ARR share, partner-sourced ARR share, and customer concentration by region alongside a current logo-quality review.
      relatedQuestionRefs: [QU006, QU008]
      relatedTableRefs: [TU001, TU003]
    - type: stale
      severity: minor
      topic: fresh-named-outcomes
      missingEvidence: Independently sourced 2026 customer stories with quantified outcomes outside vendor-, investor-, or directory-mediated evidence.
      whyItMatters: Most named proof in the assigned pool is either older or filtered through friendly intermediaries, which limits confidence in current expansion quality.
      diligencePath: Ask management for current customer references or public procurement and announcement records tied to 2026 deployments.
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU003]
