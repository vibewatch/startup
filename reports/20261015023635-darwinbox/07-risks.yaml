      - ["Implementation and change-management capacity", "Darwinbox services team plus buyer HR Ops", "Configures workflows, permissions, data migration, and training", "High", "Consultant-heavy rollout overruns timeline and suppresses adoption", "High", "Darwinbox claims fast-track onboarding and targeted change management", "Medium-High"]
      - ["Cloud and mobile delivery stack", "Darwinbox-hosted platform", "Runs employee self-service, attendance capture, and daily workflows", "Medium-High", "Availability or performance issues disrupt HR operations at scale", "Medium", "Company cites security standards and frequent product updates", "Medium"]
      - ["Private capital support", "Existing and future investors", "Funds expansion, liquidity, and product investment", "Medium", "Growth slows or financing terms worsen before public operating transparency improves", "Medium-High", "Economic Times reports fresh capital, revenue growth, and employee-liquidity events", "Medium"]
    notes: "Counterparties combine external parties and internal buyer dependencies because both can break enterprise deployment economics."
    claimRefs: ["CR002", "CR004", "CR005", "CR011", "CR012", "CR014", "CR015"]
