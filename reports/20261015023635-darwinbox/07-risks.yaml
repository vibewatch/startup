      - ["Module under-adoption / shelfware", "Skima says most customers actively use only four modules in production and some add-ons see single-digit adoption within 18 months.", "Medium-High", "High", "Low-Medium", "High", "Need phased module plan with activation KPIs by cohort."]
      - ["Mobile UX and workflow reliability variance", "Skima says user feedback mentions occasional slowness and bugs in the mobile app even though Darwinbox positions the product as mobile-first.", "Medium", "Medium", "Medium", "Medium", "Need uptime, performance, and adoption metrics by employee persona."]
