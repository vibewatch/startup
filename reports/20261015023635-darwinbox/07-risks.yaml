callouts:
  - calloutType: "risk"
    title: "Kill criteria to clear before underwriting upside"
    body: >-
      Treat the thesis as impaired if Darwinbox cannot show production-grade DPDP and breach-notification
      artifacts, a staffed rollout plan that materially improves on the 90-150 day public benchmark, and a
      phased module-activation plan that avoids full-bundle shelfware. A buyer should also demand integration
      proof on its own legacy stack rather than relying on generic API marketing.
    claimRefs: ["CR002", "CR006", "CR011", "CR013", "CR014"]
