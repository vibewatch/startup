    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Darwinbox has a broad enterprise HCM suite with AI, mobile-first delivery, open APIs, and a live production surface, showing real product maturity.", "Official disclosure of durable ARR growth and gross margin would strengthen conviction."]
      - [Thesis, "Recent OTPP follow-on capital and a $140 million 2025 round show that sophisticated investors still support the platform's regional-to-global expansion.", "Evidence that fresh capital is converting into efficient North America expansion would improve upside confidence."]
      - [Anti-thesis, "Public evidence remains thin on ARR, NRR, churn, margins, and preference stack, so the private mark could still be ahead of the fundamentals.", "Audited FY25/FY26 financials and clear cap-table disclosures would reduce valuation ambiguity."]
      - [Anti-thesis, "Independent buyer commentary still flags performance, workflow, pricing, and support friction, which can slow expansion against larger HCM incumbents.", "Stronger independent customer outcomes and reference calls outside APAC would soften commercialization risk."]
    notes: >-
      Thesis lines combine official product evidence with independent market and review
      sources; change conditions identify the diligence items most likely to move the call.
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Darwinbox converts fresh capital into faster global expansion while proving high-quality recurring revenue and strong retention.", "A stretched entry can still work if future disclosures show elite SaaS quality and strategic scarcity.", "North America expansion burns cash before repeatability is proven.", "Would need audited financials plus strong cohort and margin data."]
      - [Base, "Growth continues but public disclosures stay incomplete and investors must underwrite with partial evidence.", "Returns depend more on disciplined entry price than on multiple expansion from current marks.", "Valuation stays range-bound while governance and economics questions remain open.", "Best aligned with today's evidence set."]
      - [Bear, "Growth slows before Darwinbox proves margins, retention, or pricing power and a private reset follows.", "Secondary-heavy prior rounds and unclear preferences compress common-equity upside quickly in a reset.", "Product-review friction and opaque TCO weaken win rates versus larger peers.", "Triggered if diligence shows weak retention, thin margins, or adverse cap-table terms."]
    notes: >-
      Scenario table is directional because public evidence does not disclose enough data
      for a defensible numeric valuation model.
    claimRefs: [CV001, CV003, CV006, CV009, CV010, CV011, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Public evidence links real product and customer proof to a price-sensitive track recommendation rather than a clean buy.
    data:
      nodes:
        - id: product
          label: Product breadth is real
          detail: Official pages show AI-powered HCM across core HR, payroll, talent, analytics, and mobile workflows.
          tone: positive
        - id: deployment
          label: Commercial deployment is visible
          detail: A live multilingual login surface and ongoing product-update claims support that the software is operating in production.
          tone: positive
        - id: scale
          label: Customer scale has independent support
          detail: Independent sources point to 1,000+ enterprises and more than 4 million covered employees.
          tone: positive
        - id: funding
          label: Financing support continues
          detail: 2025-2026 rounds show repeat institutional backing, but part of the capital history was secondary-heavy.
          tone: warning
        - id: gaps
          label: Core valuation inputs remain opaque
          detail: Public evidence still lacks ARR, NRR, gross margin, cash burn, and preference-stack detail.
          tone: negative
        - id: call
          label: Resulting stance is track / stretched
          detail: Keep the company in diligence and wait for better disclosure or a more forgiving entry point.
          tone: negative
      edges:
        - from: product
          to: deployment
          label: converts feature breadth into a live platform
        - from: deployment
          to: scale
          label: supports enterprise adoption proof
        - from: scale
          to: funding
          label: helps explain investor appetite
        - from: funding
          to: gaps
          label: does not remove disclosure gaps
        - from: gaps
          to: call
          label: keeps valuation discipline front and center
    claimRefs: [CV001, CV006, CV007, CV008, CV012, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Current call
    body: >-
      Track Darwinbox rather than force a buy call: the company looks commercially real and
      still fundable, but current public evidence is not strong enough to price the upside
      with confidence.
    claimRefs: [CV001, CV003, CV006, CV007, CV013, CV014, CV016]
  - calloutType: risk
    title: Why the mark can still disappoint
    body: >-
      The biggest downside is not product existence but valuation opacity: if ARR quality,
      margins, retention, or liquidation preferences underwhelm, a stretched private mark
      can reset quickly.
    claimRefs: [CV003, CV009, CV010, CV014, CV015]
  - calloutType: assumption
    title: Diligence items that would move the decision
    body: >-
      The recommendation can improve if Darwinbox discloses audited FY25/FY26 financials,
      recurring-revenue quality metrics, enterprise win durability outside APAC, and the
      post-round cap-table or preference stack.
    claimRefs: [CV005, CV009, CV014, CV015]
