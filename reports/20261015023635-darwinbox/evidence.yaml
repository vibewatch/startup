evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters
    missingEvidence: A definitive statement of legal headquarters, operating headquarters, and principal employing entities.
    whyItMatters: >-
      Conflicting HQ labels affect jurisdiction, leadership location, tax, compliance, and later market-expansion
      analysis.
    diligencePath: >-
      Request current legal-entity chart, registered addresses, and management confirmation of HQ terminology used
      externally.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, observer rights, voting controls, and post-2025 preference stack details.
    whyItMatters: >-
      Without governance detail, it is hard to assess control concentration, investor protections, and downside
      scenarios.
    diligencePath: Obtain the latest board list, shareholder agreement summary, and capitalization table with security classes.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financing
    missingEvidence: >-
      Signed documentation for the Sep 2026 TVG follow-on and a complete round-by-round ledger separating primary from
      secondary proceeds.
    whyItMatters: >-
      Capital availability, valuation trajectory, and employee or investor liquidity cannot be judged cleanly from
      partial public reporting alone.
    diligencePath: >-
      Request financing closing documents, cap-table history, and management reconciliation of total primary capital
      raised.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Region-, segment-, or employee-band-specific revenue, bookings, or win-rate disclosures that isolate Darwinbox's
      practical SAM/SOM.
    whyItMatters: >-
      Without public segmentation, the report can defend a broad category opportunity but not a precise underwritable
      market share path.
    diligencePath: >-
      Request management or data-room detail on revenue mix by geography, customer band, and module attach rate, then
      reconcile it against public customer logos and payroll coverage.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-terms
    missingEvidence: Official PEPM pricing bands, implementation rate cards, support-tier terms, and go-live assumptions by geography.
    whyItMatters: >-
      Quote-only commercials and separate services fees can materially change payback, competitive position, and
      deployment risk.
    diligencePath: >-
      Obtain recent customer proposals or a standard order form with module pricing, implementation scope, and support
      entitlements.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: minor
    topic: north-america-proof
    missingEvidence: Referenceable North America customer cohort evidence, including deployment scope, module mix, and realized ROI.
    whyItMatters: >-
      The public expansion narrative is credible, but durable share gain against incumbent US suites is not yet
      independently proven in detail.
    diligencePath: >-
      Ask for current North America customer references, module-level win/loss data, and churn or renewal metrics by
      region.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Realized Darwinbox and competitor quotes with module scope, employee bands, implementation fees, discounts,
      contract duration, and renewal terms.
    whyItMatters: >-
      Without normalized quotes, relative-price positioning cannot establish realized savings, gross-margin quality, or
      durable pricing power.
    diligencePath: >-
      Request recent anonymized proposals and renewal invoices for matched enterprise cohorts, then normalize total cost
      over implementation and contract life.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: underwriting-gap
    missingEvidence: Audited FY25/FY26 financial statements with current cash balance, quarterly burn, operating cash flow, and runway.
    whyItMatters: Without cash and burn disclosure, the chapter cannot underwrite next-round timing or downside survivability.
    diligencePath: Request management accounts, audited financials, and a 12-18 month cash forecast by scenario.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized PEPM pricing, contract minimums, discount ladders, and geo-specific enterprise price cards.
    whyItMatters: >-
      Public product scope alone cannot show monetization quality, discount discipline, or price-based competitive
      pressure.
    diligencePath: Review customer contracts, order forms, and pricing approval policies by region and segment.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Cohort NRR, GRR, logo churn, services attach rate, and services gross margin.
    whyItMatters: Estimated retention and margin metrics are not enough to test recurring revenue quality or delivery leverage.
    diligencePath: Request cohort dashboards, renewal waterfalls, and subscription-versus-services gross margin splits.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Debt facilities, covenants, and any board-approved financing plan linked to international expansion.
    whyItMatters: Secondary-heavy rounds and expansion ambition make balance-sheet flexibility a central investment question.
    diligencePath: Review debt agreements, board materials, and treasury planning for base and downside cases.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Direct developer telemetry such as API usage, release-note history, connector adoption, repo or package activity,
      or engineering-community support signals.
    whyItMatters: >-
      TrustRadius supplies a practitioner proxy for daily use, but the assigned pool does not independently show whether
      APIs and connectors are widely used or operationally mature.
    diligencePath: >-
      Review Darwinbox API docs, connector catalog, changelog cadence, and any public or customer-visible ecosystem
      metrics directly with product and solutions engineering.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: reliability-telemetry
    missingEvidence: >-
      Public uptime, incident history, status-page evidence, response-time SLOs, or objective production reliability
      data.
    whyItMatters: >-
      Third-party comments mention lag and usability friction, so diligence needs hard operational telemetry to judge
      whether product breadth is matched by stable production performance.
    diligencePath: >-
      Request uptime history, support-severity logs, status-page records, and module-level performance benchmarks by
      region and customer size.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Direct audit artifacts or scoped evidence for certifications, data residency, privacy controls, and
      subprocessor/security-operations practices.
    whyItMatters: >-
      The public trust narrative is broad, but underwriting enterprise HR data risk requires evidence beyond marketing
      language about standards and compliance.
    diligencePath: >-
      Obtain certification reports, control mappings, pen-test or audit summaries, DPA terms, and region-specific
      data-hosting details from security or legal teams.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Customer-cohort data covering NRR, GRR, gross churn, contract lengths, and renewal rates by region or customer
      segment.
    whyItMatters: >-
      Without durability metrics, it is hard to separate healthy expansion from new-logo growth or to test whether
      Darwinbox's reference accounts are sticky at scale.
    diligencePath: Request cohort tables and renewal reporting for the top 20 accounts, broken out by region and product module.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Revenue concentration by top customers, channel partners, and geography, plus a production-versus-pilot split for
      the publicly cited logos.
    whyItMatters: >-
      Enterprise SaaS growth can look broad in logo count while still being concentrated in a handful of large accounts,
      one region, or partner-led distribution.
    diligencePath: >-
      Request top-10 customer ARR share, partner-sourced ARR share, and customer concentration by region alongside a
      current logo-quality review.
    relatedQuestionRefs:
      - QU006
      - QU008
    relatedTableRefs:
      - TU001
      - TU003
  - type: stale
    severity: minor
    topic: fresh-named-outcomes
    missingEvidence: >-
      Independently sourced 2026 customer stories with quantified outcomes outside vendor-, investor-, or
      directory-mediated evidence.
    whyItMatters: >-
      Most named proof in the assigned pool is either older or filtered through friendly intermediaries, which limits
      confidence in current expansion quality.
    diligencePath: >-
      Ask management for current customer references or public procurement and announcement records tied to 2026
      deployments.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: data-governance-proof-pack
    missingEvidence: >-
      Darwinbox's current DPA, consent artefact, subprocessor list, cross-border transfer register, and
      breach-notification workflow.
    whyItMatters: >-
      Enterprise HR and payroll buyers cannot clear privacy, vendor-risk, and employee-data exposure with marketing
      claims alone.
    diligencePath: >-
      Request the current legal/security packet and confirm production incident-notification obligations in the master
      services agreement.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: statutory-update-sla
    missingEvidence: A written statutory-update SLA plus dated release notes for recent India payroll-rule changes.
    whyItMatters: >-
      Late statutory updates can create payroll errors, penalties, and urgent manual workarounds in regulated
      jurisdictions.
    diligencePath: >-
      Ask Darwinbox for dated examples of recent PF, PT, or filing updates and the standard customer SLA for policy
      changes.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: financial-model-transparency
    missingEvidence: Audited FY25/FY26 gross margin, cash burn, working-capital profile, and geography-level revenue quality.
    whyItMatters: >-
      Fresh capital and revenue growth reduce near-term solvency concern, but investors still need operating-quality
      data to price downside correctly.
    diligencePath: Obtain audited financials, cash-flow detail, and board-level plan-vs-actual reporting during management diligence.
  - type: missing-source
    severity: material
    topic: recurring-economics
    missingEvidence: Audited FY25/FY26 ARR, NRR, gross margin, churn, and cash-burn disclosure.
    whyItMatters: These metrics determine whether Darwinbox deserves a premium late-stage SaaS multiple or only a watchlist stance.
    diligencePath: >-
      Request audited financial statements and cohort dashboards from management and reconcile them with the latest
      round materials.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Exact post-2025 and post-2026 cap table, liquidation preferences, employee option pool, and primary-secondary
      split.
    whyItMatters: >-
      Private-round structure can materially change common-equity upside even when the headline valuation appears
      unchanged.
    diligencePath: Review the latest financing documents, investor rights agreements, and board materials under NDA.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: pricing-benchmark
    missingEvidence: Official price-book, implementation rate card, and module-level packaging for enterprise buyers.
    whyItMatters: >-
      Quote-only pricing weakens comparable benchmarking and obscures whether Darwinbox can convert growth into healthy
      payback and margin.
    diligencePath: >-
      Obtain current commercial proposals for at least two enterprise buyer archetypes and compare them with win-loss
      commentary.
    relatedQuestionRefs:
      - QV009
