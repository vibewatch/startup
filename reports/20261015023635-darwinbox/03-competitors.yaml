      - [Workday, "Exact retained price and unit unavailable", "HR plus finance and operations described broadly", "No comparable quote, discount, or implementation data", "ERP Research says Darwinbox is materially cheaper for comparable regional scope"]
      - [SAP SuccessFactors, "Exact retained price and unit unavailable", "HCM described broadly", "No comparable quote, discount, or implementation data", "ERP Research says Darwinbox is materially cheaper for comparable regional scope"]
      - [Regional suites, "Exact retained price and unit unavailable", "Integrated HR and payroll described broadly", "No like-for-like price or service-cost data", "Localization may pressure Darwinbox where service matters more than breadth"]
      - ["Status quo / internal build", "No vendor list price", "Existing tools, integrations, and internal workflows", "Migration avoidance and maintenance burden are unquantified", "Can delay replacement even without matching product breadth"]
    notes: "Only Darwinbox's model and an independent relative-price statement are available; no row should be read as a total-cost quote or realized contract price."
    claimRefs: [CP003, CP004, CP016]
