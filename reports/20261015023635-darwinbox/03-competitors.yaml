          detail: "Direct enterprise-suite overlap; public incumbent with HR, finance, and operations breadth."
        - label: SAP SuccessFactors
          x: 5
          y: 5
          detail: "Direct enterprise HCM overlap; acquired incumbent suite."
        - label: Kronos
          x: 4
          y: 4
          detail: "Enterprise HCM and workforce-management overlap; acquired long-standing vendor."
        - label: PeopleStrong
          x: 4
          y: 3
          detail: "Regional integrated-HCM overlap with localization relevance."
        - label: Factorial
          x: 3
          y: 3
          detail: "HR and finance suite overlap, but retained evidence does not establish large-enterprise depth."
        - label: Remote
          x: 2
          y: 3
          detail: "Adjacent employment infrastructure, payroll compliance, and contractor-management entry point."
    approximationNotes: "Scores are ordinal analyst judgments from retained product descriptions and lifecycle status; they do not represent market share, revenue, win rate, or a published benchmark."
    claimRefs: [CP006, CP015]
callouts:
  - calloutType: strength
    title: Documented wedge
    body: Darwinbox combines broad HCM scope with mobile-first configurability, localization, and integration tooling; this is a coherent challenger position where global-suite complexity or price is a buyer concern.
    claimRefs: [CP001, CP004, CP007]
  - calloutType: risk
    title: Moat remains unproven
    body: Public sources do not disclose competitive win rates, renewal cohorts, realized pricing, or switching costs, so implementation breadth should not be mistaken for demonstrated retention or pricing power.
    claimRefs: [CP011, CP014, CP015, CP016]
