      - Diligence ask
    rows:
      - ["Core HR & payroll", "Enterprise SaaS subscription anchored in system-of-record workflows", "PEPM / recurring contract", "55% of revenue mix (estimated)", "Estimated by one analyst brief; modules confirmed on official pages", "Provide audited FY25/FY26 revenue mix by module family and geography."]
      - ["Talent & performance", "Cross-sold modules including recruitment, performance, onboarding, and related talent workflows", "Module subscription", "25% of revenue mix (estimated)", "Estimated; product scope visible but realized attach rate undisclosed", "Disclose attach rates, expansion cohorts, and renewal behavior by module."]
      - ["Implementation & professional services", "Configuration, migration, and go-live support around enterprise deployments", "Project / services fees", "12% of revenue mix (estimated)", "Estimated; official pages support implementation effort but not service revenue disclosure", "Break out services revenue, gross margin, and partner-versus-internal delivery mix."]
      - ["Analytics & add-ons", "People analytics, AI capabilities, and adjacent add-on products", "Add-on subscription", "8% of revenue mix (estimated)", "Estimated; official pages confirm analytics and AI surfaces, not actual monetization", "Provide ARR by AI/analytics modules and current attach rate to core accounts."]
    notes: >-
      Revenue mix is estimated from Value For Startups; official Darwinbox pages confirm
      module categories but do not publish audited revenue splits.
    claimRefs: [CI001, CI003, CI004]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Core HCM subscription", "PEPM subscription structure (described by analyst brief)", "No numeric public list price found on reviewed official pages; realized pricing unknown", "No disclosed minimum contract size, seat banding, or geo-specific price card", "SI001, SI003"]
      - ["Module expansion", "Tiered module pricing layered on top of core subscription", "Structure described publicly; numeric module pricing not disclosed", "Unknown bundle discounts, adoption thresholds, and renewal uplifts", "SI001, SI006"]
      - ["Implementation / onboarding", "Project-based implementation effort implied by onboarding and migration language", "No published rate card", "Unknown services day-rates, partner economics, and margin profile", "SI001, SI008"]
      - ["AI / analytics add-ons", "Add-on monetization implied by analytics and embedded AI capabilities", "No public price points in assigned sources", "Unknown whether sold as bundled tiers, standalone upsell, or seat premium", "SI001, SI002, SI006"]
    notes: >-
      Reviewed official surfaces describe modules and deployment benefits but provide no
      numeric price card, so list-versus-realized pricing remains a diligence gap.
    claimRefs: [CI002, CI003, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["FY24 revenue growth", "58% growth to Rs 392 crore", "Medium", "Best public revenue datapoint in the assigned pool; shows real scale but not profitability", "Provide audited FY25/FY26 revenue and monthly exit ARR bridge."]
      - ["Gross margin", "75%-80% (estimated)", "Low-Medium", "Would support software quality if true, but still comes from one independent analyst note", "Provide audited gross margin split between subscription and services revenue."]
      - ["Net revenue retention", ">115% (estimated)", "Low-Medium", "Important indicator of land-and-expand efficiency and revenue quality", "Provide NRR, GRR, logo churn, and expansion ARR by cohort."]
      - ["CAC payback", "18-24 months (estimated)", "Low-Medium", "Long payback increases dependence on financing capacity during expansion", "Provide fully loaded CAC, payback period, and channel / partner mix by region."]
      - ["EBITDA margin", "Negative; narrowing post-2023 (estimated)", "Low-Medium", "Signals the margin path is not yet publicly proven despite growth", "Provide EBITDA, operating cash flow, and normalized burn by quarter."]
      - ["Cash / runway / debt", null, "Unavailable publicly", "Most important missing underwriting input for financing dependency", "Provide current cash balance, debt facilities, covenant package, and base / downside runway."]
    notes: >-
      Public and estimated figures are intentionally separated; null means the assigned
      public source pool did not disclose a defensible value.
    claimRefs: [CI007, CI010, CI011, CI012, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points to enterprise accounts landing on core HCM, expanding into
      adjacent modules and AI features, while long sales and implementation cycles absorb
      cash before payback.
    data:
      nodes:
        - id: enterprise-sale
          label: Enterprise buyer acquisition
          context: Direct enterprise sales to CHRO/CIO buyers with long procurement cycles.
        - id: core-subscription
          label: Core HR / payroll contract
          context: PEPM subscription structure centered on the system-of-record layer.
        - id: module-expansion
          label: Talent, recruiting, and performance expansion
          context: Cross-sell from core HR into talent and performance modules.
        - id: services
          label: Implementation and migration work
          context: Go-live, configuration, and migration effort around enterprise deployments.
        - id: add-ons
          label: Analytics and AI add-ons
          context: People analytics and embedded AI features deepen wallet share.
        - id: recurring-quality
          label: Multi-year recurring revenue quality
          context: Analyst brief describes typical 3-5 year contracts and estimated NRR above 115%.
        - id: cash-draw
          label: Cash absorption before payback
          context: Estimated 18-24 month CAC payback and service-heavy go-lives can delay cash generation.
      edges:
        - from: enterprise-sale
          to: core-subscription
          relationship: Initial enterprise land motion
        - from: core-subscription
          to: module-expansion
          relationship: Land-and-expand cross-sell
        - from: core-subscription
          to: services
          relationship: Deployment and migration effort
        - from: module-expansion
          to: add-ons
          relationship: Additional wallet share
        - from: module-expansion
          to: recurring-quality
          relationship: Expansion revenue improves stickiness
        - from: services
          to: cash-draw
          relationship: Upfront delivery load
        - from: recurring-quality
          to: cash-draw
          relationship: Payback depends on retention and margin
    approximationNotes: >-
      This is a mechanism diagram, not a quantified waterfall; only the quoted public or
      estimated revenue mechanics are shown.
    claimRefs: [CI003, CI005, CI006, CI011, CI012, CI013, CI015]
callouts:
  - calloutType: insight
    title: Revenue quality is directionally strong, but mostly not audited in public
    body: >-
      The evidence points to recurring enterprise software economics and meaningful
      expansion potential, but the most specific margin and retention numbers still come
      from one independent analyst brief rather than audited filings or direct company
      disclosure.
    claimRefs: [CI003, CI006, CI011, CI012, CI013]
  - calloutType: risk
    title: Headline financing rounds likely overstate fresh operating cash
    body: >-
      Recent ET items repeatedly describe secondary components in Darwinbox financings, so
      the round headlines are useful valuation markers but not reliable proxies for cash
      now available to fund go-to-market and product expansion.
    claimRefs: [CI010, CI016]
