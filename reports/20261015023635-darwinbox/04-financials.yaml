schemaVersion: report-v2
artifact: financials
slug: darwinbox
runDate: 2026-10-15
company:
  name: Darwinbox
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a real enterprise-software revenue engine at Darwinbox: an
    end-to-end HCM suite, enterprise traction measured in the thousands of customers,
    and a reported FY24 revenue step-up to Rs 392 crore. The harder underwriting inputs
    still remain private, though: realized pricing, audited gross margin, current cash,
    burn, runway, and service-delivery profitability are not disclosed in the assigned
    source set, while recent funding disclosures include meaningful secondary liquidity
    that should not be mistaken for fully fresh operating cash.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: >-
      Darwinbox's reviewed official surfaces consistently present the company as an
      integrated enterprise HCM suite rather than a point product, spanning core HR,
      payroll, recruiting, performance, analytics, and adjacent employee-experience
      workflows. What public evidence does not provide is a numeric price card: the
      official pages in this pool describe modules, configuration, implementation speed,
      and enterprise positioning, but not PEPM price points, discount ladders, or
      regional contract minimums. That leaves the strongest monetization detail coming
      from an independent analyst brief, which characterizes the model as PEPM
      subscription pricing layered with module tiers and estimates a mix still centered
      on core HR/payroll, with meaningful services and add-on revenue beside it.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-unit-economics
    title: GTM motion, traction, and unit-economics signals
    body: >-
      The assigned evidence points to a classic enterprise-sales motion rather than a
      self-serve SMB funnel. Value For Startups describes direct selling into CHRO/CIO
      buyers and long procurement cycles, while the reviewed official pages emphasize
      configurability, implementation support, integrations, and security posture that
      map to large-account buying criteria. Public traction is real but mixed in quality:
      Economic Times reports FY24 revenue grew 58% to Rs 392 crore, Business Wire carries
      Darwinbox's April 2026 claim of nearly 5 million employees across more than 1,200
      enterprises, and a September 2025 investment memo on Scribd described 3M+ users
      across 1,000+ organizations earlier in the scaling curve. Unit-economics detail is
      thinner. The most specific numbers in this pool - gross margin, NRR, CAC payback,
      and EBITDA posture - come from one independent but estimate-heavy analyst note, so
      they are useful directional inputs, not underwriteable audited metrics.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI011, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      Financing headlines here need careful interpretation. Economic Times' 2025-2026
      items describe recent rounds at roughly $950 million to $1 billion blended
      valuation, but they also repeatedly note secondary components, including a March
      2025 round that was largely secondary with only a small primary tranche and an
      August 2025 round that mixed primary and secondary stock. That is supportive of
      shareholder liquidity and price discovery, but it does not prove the company added
      the full headline round size to cash. Meanwhile, the strongest adverse analysis in
      the assigned pool argues that long enterprise sales cycles, implementation-heavy
      go-lives, and unproven North America expansion can all drag margins and extend the
      period before cash generation catches up with growth.
    claimRefs: [CI010, CI012, CI013, CI014, CI015]
  - id: verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The public picture is directionally constructive on revenue quality: Darwinbox
      appears to sell a sticky, multi-module enterprise system of record with real
      cross-sell potential, and public news flow suggests growth has continued through
      2025. But this chapter is still short of underwriting-grade financial proof. The
      assigned sources do not disclose current cash on hand, monthly burn, runway, debt
      facilities, realized pricing, gross margin by product or services, or cohort-quality
      retention metrics. As a result, the prudent financial verdict is that Darwinbox has
      credible enterprise SaaS scale and plausible recurring-revenue quality, but the
      decisive margin path and near-term financing dependency remain private-evidence
      questions rather than public facts.
    claimRefs: [CI002, CI010, CI011, CI013, CI014, CI015, CI016]
tables:
