chapter:
  number: 6
  title: Customers
  summary: Myricx has no public revenue customers because it remains preclinical, but it still has a definable customer map. Today the real economic buyer is strategic pharma—most concretely Novartis—while the eventual downstream beneficiaries are patients with HER2-positive or B7-H3-positive solid tumors, investigators running future trials, and potential partners seeking differentiated payload options.
sections:
- id: who-is-customer
  title: Who Counts as a Customer When the Company Is Precommercial
  body: 'Because Myricx remains preclinical, the customer chapter cannot be written like a software or commercial-biopharma customer roster. There are no disclosed paying hospital systems, prescribers, or product users. Instead, the real current economic customer is a strategic biopharma buyer that values the platform before launch. The strongest evidence for that is Novartis’s agreement to acquire the company, which effectively converts external customer interest into ownership. A second customer-adjacent group consists of strategic investors such as Eli Lilly, whose participation in the Series A signaled market interest even without a disclosed commercial licensing transaction. Downstream, the eventual users and beneficiaries would be oncologists, investigators, and patients only if Myricx’s payload reaches the clinic through Novartis or another partner path. This chapter therefore treats customer analysis as a staged chain: strategic buyer today, trial ecosystem tomorrow, and treated
    patients after approval. That is the only framing consistent with the company’s actual stage.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: patient-segments
  title: Downstream Patient Segments and Why They Matter
  body: Even without revenue customers, Myricx can still be mapped to real downstream patient groups because its public programs sit on recognizable oncology targets. HER2-positive disease matters because it is a well-established biological segment across breast and gastric cancers, with precedent for ADC use and commercial uptake. B7-H3 matters because it is broadly expressed across many solid tumors and continues to attract ADC development attention, especially in lung and other difficult cancers. The broad cancer burden also matters because it keeps oncology budgets and trial activity high enough to sustain large platform acquisitions and multiple parallel drug-development bets. For Myricx, patient segmentation is therefore not abstract. The company is aiming at solid-tumor settings where existing payload classes may underperform on resistance or tolerability, and where validated antibodies can carry a new payload into familiar disease spaces. The practical implication is that downstream
    customer value is largest where there is both target relevance and unmet need after incumbent ADC exposure.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: proof
  title: Named Stakeholder Proof and Early Adoption Path
  body: 'The strongest named-customer proof is the Novartis acquisition announcement itself. Novartis is not a theoretical buyer; it is the actual strategic counterparty choosing to pay for the platform. That makes Novartis both customer-proof and future commercialization owner if the deal closes. The next-most-relevant proof comes from the investor and partner set around the Series A, especially Eli Lilly and specialist life-science funds willing to back the preclinical platform. These are not customers in the revenue sense, but they are market validators who absorb diligence burden before ordinary product buyers exist. Trial sites and investigators are the next layer in the adoption path. Once an IND is filed, the first operating "customers" will effectively be investigators and patients enrolling in early studies, because that is where the platform begins to produce human evidence. This sequencing matters for diligence: customer concentration is currently extreme because the platform’s
    visible external validator is essentially a single acquirer, while broader adoption remains contingent on clinical progress.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  tableRefs:
  - TU003
  - TU004
  figureRefs:
  - FU003
- id: concentration
  title: Retention, Concentration, and Expansion Risk
  body: 'Current concentration risk is unavoidable. Myricx does not yet have a diversified commercial customer base; it has a single dominant strategic buyer in Novartis and a handful of supporting capital providers. That means "retention" in the normal sense is irrelevant today, while transaction completion, team retention, and platform continuation inside Novartis matter enormously. Expansion risk is similarly unusual: it is not about upselling more seats or hospital contracts but about extending one payload platform into more indications, more targets, and more clinical studies over time. The challenge is that every expansion path still depends on first-in-human execution. A strong preclinical platform can appear broadly expandable until the first clinical data force prioritization. The right customer-risk lens therefore focuses on concentration, sequencing, and proof burden. In practical terms, Myricx’s customer map becomes more attractive only as it moves from one strategic owner to
    multiple validated clinical use cases and investigator cohorts.'
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  tableRefs:
  - TU005
  figureRefs:
  - FU004
- id: verdict
  title: Customer Verdict
  body: 'The right customer verdict on Myricx is that current demand is strategic rather than commercial. The platform has already demonstrated enough buyer relevance to attract a $1.5 billion announced takeout, but it has not yet demonstrated diversified revenue demand, physician adoption, or patient benefit in humans. That does not make the customer story weak; it makes it staged. In the present, the customer is Novartis and, more abstractly, any sophisticated buyer looking for differentiated ADC payloads. In the near future, the first operational users will be investigators and enrolled patients in early trials. In the long run, the true commercial customers would be oncology providers and reimbursing systems if efficacy and tolerability prove out. This staged customer map is the correct way to read Myricx’s status: impressive strategic demand today, but no ordinary commercial demand proof yet.'
  claimRefs:
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
