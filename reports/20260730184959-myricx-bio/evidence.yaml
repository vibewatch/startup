evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: A current cap table, any venture debt, secondary sale history, and shareholder rights summary.
    whyItMatters: >-
      Without these materials, the economic and control consequences of the pre-acquisition ownership structure remain
      opaque.
    diligencePath: >-
      Request the latest board-approved cap table, stockholder rights summary, and any debt or secondary transaction
      documents.
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: material
    topic: commercial-metrics
    missingEvidence: >-
      A public or management-confirmed statement on whether Myricx has any revenue beyond research funding and how
      management defines customers.
    whyItMatters: Overview readers need a clean distinction between platform science, financing proceeds, and commercial traction.
    diligencePath: >-
      Request management commentary and financial statements that separate grants, collaboration income, and product
      revenue.
    relatedQuestionRefs:
      - QO015
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-and-milestone-coverage
    missingEvidence: A complete cap table and company-approved chronology including undisclosed internal milestones.
    whyItMatters: >-
      Public stakeholder and milestone tables capture only what was disclosed openly, so some economically relevant rows
      may be absent.
    diligencePath: Request a formal stakeholder register and internal chronology to reconcile omitted rows.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: myricx-specific-sam-som
    missingEvidence: >-
      A buyer-level bottoms-up model showing how many realistic strategic acquirers or licensors would pay for an NMTi
      payload platform and at what stage-gated values.
    whyItMatters: Without a constrained SAM/SOM, broad ADC market size can overstate what is actually monetizable by Myricx today.
    diligencePath: >-
      Request management’s target-account list, comparable deal framework, and stage-gated scenario model for partnering
      versus acquisition.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: minor
    topic: payload-share-precision
    missingEvidence: >-
      An openly accessible primary market source that precisely quantifies 2025 Topo-1 payload share using the same
      market definition across analysts.
    whyItMatters: >-
      Public commentary agrees on concentration but not on one canonical percentage, so the analysis uses ranges and
      direction rather than over-precision.
    diligencePath: Request analyst deck extracts or a licensed database view that normalizes payload share across marketed ADCs.
    relatedQuestionRefs:
      - QM016
  - type: missing-source
    severity: material
    topic: pricing-comparability
    missingEvidence: >-
      Comparable licensing economics or valuation bridges that normalize platform-stage assets against approved product
      franchises.
    whyItMatters: >-
      Without those data, pricing and packaging comparisons remain strategic-format comparisons rather than direct
      unit-price benchmarks.
    diligencePath: Request comparable-term sheets, licensing precedents, or banker comps for preclinical payload platforms.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: ip-breadth
    missingEvidence: >-
      A clear patent-family map showing payload composition-of-matter, linker compatibility, and freedom-to-operate
      versus competitors.
    whyItMatters: Moat durability ultimately depends on whether Myricx can stop fast followers, not just impress acquirers.
    diligencePath: Request outside counsel IP memo and competitor claim-chart analysis.
    relatedQuestionRefs:
      - QP021
      - QP022
  - type: private-evidence-only
    severity: material
    topic: cash-and-burn
    missingEvidence: Current cash balance, monthly burn, and board-approved runway plan.
    whyItMatters: >-
      Without these data, standalone capital adequacy cannot be modeled even though the pending acquisition may moot the
      issue.
    diligencePath: Request the latest balance sheet, monthly management accounts, and board runway plan.
    relatedQuestionRefs:
      - QI017
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Current cap table, preference stack, and any employee retention or rollover terms tied to the acquisition.
    whyItMatters: Investor outcome analysis depends on who gets paid first and how transaction proceeds are actually distributed.
    diligencePath: Request the merger agreement summary, cap table, and stockholder rights documents.
    relatedQuestionRefs:
      - QI021
      - QI025
  - type: private-evidence-only
    severity: material
    topic: payload-portability
    missingEvidence: >-
      Head-to-head data across multiple antibodies and linker formats showing that NMTi payload activity and
      tolerability hold outside disclosed exemplar constructs.
    whyItMatters: >-
      Portability is central to the platform thesis; without it, Myricx may be closer to a narrow asset story than a
      reusable payload engine.
    diligencePath: >-
      Request construct-by-construct comparability data across linker chemistries, target antigens, and toxicology
      packages.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: material
    topic: first-in-human-window
    missingEvidence: IND-enabling tox package and first-in-human starting-dose rationale for the lead construct.
    whyItMatters: Therapeutic index is the primary gating variable between elegant preclinical biology and clinical failure.
    diligencePath: Request full GLP tox, safety pharmacology, and exposure-response package for the lead candidate.
    relatedQuestionRefs:
      - QE019
      - QE023
  - type: missing-source
    severity: material
    topic: trial-site-roster
    missingEvidence: Named future investigators, site strategy, and planned tumor cohorts for first-in-human work.
    whyItMatters: Those details would turn the customer map from a strategic abstraction into a real clinical adoption plan.
    diligencePath: Request the planned IND study synopsis, site list strategy, and target-indication prioritization.
    relatedQuestionRefs:
      - QU022
  - type: missing-source
    severity: minor
    topic: patient-segmentation-precision
    missingEvidence: Company-specific prioritization by indication, biomarker threshold, and line of therapy.
    whyItMatters: Broad target biology does not reveal which patient cohorts management actually intends to pursue first.
    diligencePath: Request internal target-product profiles and indication-prioritization materials.
    relatedQuestionRefs:
      - QU023
  - type: enumeration-incomplete
    severity: minor
    topic: TU003 named customer proof coverage
    missingEvidence: >-
      A fuller set of disclosed counterparties, investigator groups, and customer-like validation signals beyond the
      named public examples.
    whyItMatters: >-
      The named customer proof table is intentionally partial because the company is precommercial and most BD
      conversations or future trial relationships are not public.
    diligencePath: >-
      Request the company’s prioritized partner list, planned trial-site outreach, and any undisclosed strategic
      diligence counterparties.
    relatedQuestionRefs:
      - QU022
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: ind-package
    missingEvidence: Full IND-enabling toxicology, exposure-response, and CMC package for the lead construct.
    whyItMatters: This package is the main missing evidence needed to rank clinical and operational risks with real confidence.
    diligencePath: Request the full nonclinical regulatory package and CMC readiness review.
    relatedQuestionRefs:
      - QR007
      - QR021
  - type: private-evidence-only
    severity: material
    topic: transaction-close-detail
    missingEvidence: Detailed merger-agreement terms, antitrust analysis, retention packages, and close-timeline management plan.
    whyItMatters: Deal-completion and post-close continuity risk cannot be fully judged from public announcements alone.
    diligencePath: Request merger summary, regulatory filing calendar, and key-employee retention schedule.
    relatedQuestionRefs:
      - QR005
      - QR018
      - QR019
  - type: enumeration-incomplete
    severity: minor
    topic: TR001 regulatory legal risk coverage
    missingEvidence: Private transaction counsel analysis, antitrust workstreams, and full regulatory interaction history.
    whyItMatters: >-
      The public register captures only the visible legal and regulatory risks and may omit issue-specific closing or
      filing nuances.
    diligencePath: Request counsel memos, regulatory correspondence logs, and the detailed deal close checklist.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: control-premium-split
    missingEvidence: >-
      Board-level transaction analysis separating science value, control premium, milestone probability, and retention
      economics.
    whyItMatters: >-
      Without it, analysts cannot quantify how much of the price is durable platform value versus strategic bidding
      dynamics.
    diligencePath: Request merger-committee materials and banker fairness or valuation memoranda.
    relatedQuestionRefs:
      - QV026
  - type: private-evidence-only
    severity: material
    topic: portfolio-portability
    missingEvidence: >-
      Construct-level evidence showing why Novartis believes the payload is reusable across more than one meaningful
      antibody context.
    whyItMatters: That evidence is central to whether the strategic premium is justified.
    diligencePath: Request detailed technical diligence memos and construct-comparison analyses.
    relatedQuestionRefs:
      - QV022
      - QV025
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable valuation coverage
    missingEvidence: A licensed transaction database with phase-adjusted private oncology and ADC platform deals.
    whyItMatters: >-
      The public comparable table is intentionally selective and may omit less-public platform transactions that could
      widen or narrow the valuation range.
    diligencePath: Obtain banker comps or licensed M&A databases filtered for preclinical oncology platforms and ADC technologies.
    relatedQuestionRefs:
      - QV013
    relatedTableRefs:
      - TV004
