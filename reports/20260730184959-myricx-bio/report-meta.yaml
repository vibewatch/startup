companyProfile:
  summary: >-
    Myricx Bio is a London-based oncology biotech spun out from Imperial College London and the Francis
    Crick Institute, built around N-myristoyltransferase inhibitor payloads for antibody-drug conjugates.
    The company launched in 2020, raised a £4.5M seed and a £90M Series A, disclosed preclinical HER2
    and B7-H3 programs including MYX2449, and in July 2026 agreed to be acquired by Novartis for up to
    $1.5B while still preclinical.
