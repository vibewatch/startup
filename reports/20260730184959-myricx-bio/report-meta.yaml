  topStrengths:
    - 'First-in-class NMTi payload thesis with credible scientific origin and mechanistic differentiation from incumbent ADC payload classes.'
    - 'Large strategic validation from Novartis before first-in-human work, suggesting genuine scarcity value in next-generation ADC payloads.'
    - 'Leadership upgraded in 2025 for IND readiness, CMC, and strategic execution rather than remaining a purely academic discovery project.'
  topRisks:
