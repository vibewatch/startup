- id: incumbents
  title: Incumbent Power in HER2 and B7-H3
  body: The biggest commercial threat to Myricx does not come from another NMT startup; it comes from companies that already own the most important antibody targets and clinical mindshare. In HER2, Enhertu defines the efficacy benchmark and has grown into the leading commercial ADC franchise. Kadcyla remains an earlier-generation comparator and shows how deeply incumbents can entrench physician familiarity and regulatory precedent around a target. In B7-H3, the clearest threat is ifinatamab deruxtecan, which has already reached a U.S. Priority Review milestone in small-cell lung cancer, giving Merck and Daiichi Sankyo a chance to define the clinical and regulatory bar before Myricx enters the clinic. GSK’s B7-H3 program reinforces that the target is crowded, while BioNTech and DualityBio show that licensing-led competitors can quickly assemble competitive portfolios around the same validated antigen spaces. Myricx therefore enters crowded target ecosystems where payload differentiation must
    be obvious, not merely claimed, because incumbents already control distribution power, trial infrastructure, and regulatory momentum.
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  tableRefs:
  - TP003
- id: switching-moat
  title: Switching Costs, Distribution Power, and What Actually Creates Moat
  body: 'In this market, switching costs do not look like software migration costs. They arise from clinical precedent, target ownership, manufacturing capability, and the ability to move quickly from preclinical evidence into late-stage trials. Incumbents benefit from deep antibody franchises, trusted CMC systems, established investigator networks, and the credibility that comes from already-approved or late-stage products. Myricx’s moat claim is therefore narrower and more fragile: it depends on having a genuinely differentiated payload mechanism that can plug into familiar antibody and linker frameworks while yielding superior efficacy or tolerability. If that claim is true, the platform can travel across multiple targets and create real scarcity. If not, incumbents and fast followers can stay with better-known payloads. Multi-homing is also structurally possible in ADC development; a large pharma buyer can back several payload bets at once. That reduces lock-in and raises the proof burden
    on Myricx. In practical terms, moat durability is not based on customer captivity but on whether the NMTi payload generates data that other payload classes cannot match.'
  claimRefs:
  - CP025
  - CP026
  - CP027
  - CP028
  - CP029
