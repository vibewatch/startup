  - FP003
- id: competitive-verdict
  title: 'Competitive Verdict: Where Myricx Is Strong and Where It Is Exposed'
  body: 'Myricx is strongest where the market most wants novelty: a differentiated payload class for crowded targets and resistance-prone therapy lines. The acquisition by Novartis suggests sophisticated buyers believe that scarcity is real. But the company is also exposed exactly where incumbents are strongest: human data, target-specific clinical precedent, and organizational scale. Pacylex narrows the novelty premium around NMT biology. Enhertu and Kadcyla dominate HER2 reference points. Ifinatamab deruxtecan and GSK compress the timeline for B7-H3 differentiation. BioNTech and DualityBio prove that well-capitalized entrants can assemble portfolios quickly through partnership. The net result is that Myricx’s competitive position is attractive but conditional. It is not protected by distribution or customer lock-in; it is protected only if its payload produces a clear, transferable biological edge. That is a strong moat if proven and a weak moat if not, which is exactly why the competitive
    risk profile remains binary despite the rich exit headline.'
  claimRefs:
  - CP033
  - CP034
  - CP035
  - CP036
