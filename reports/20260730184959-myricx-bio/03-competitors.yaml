  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-comparability
    missingEvidence: Comparable licensing economics or valuation bridges that normalize platform-stage assets against approved product franchises.
    whyItMatters: Without those data, pricing and packaging comparisons remain strategic-format comparisons rather than direct unit-price benchmarks.
    diligencePath: Request comparable-term sheets, licensing precedents, or banker comps for preclinical payload platforms.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: ip-breadth
    missingEvidence: A clear patent-family map showing payload composition-of-matter, linker compatibility, and freedom-to-operate versus competitors.
    whyItMatters: Moat durability ultimately depends on whether Myricx can stop fast followers, not just impress acquirers.
    diligencePath: Request outside counsel IP memo and competitor claim-chart analysis.
    relatedQuestionRefs:
    - QP021
    - QP022
