              platform has already demonstrated enough buyer relevance to attract a $1.5 billion announced takeout, but
              it has not yet demonstrated diversified revenue demand, physician adoption, or patient benefit in humans.
              That does not make the customer story weak; it makes it staged. In the present, the customer is Novartis
              and, more abstractly, any sophisticated buyer looking for differentiated ADC payloads. In the near future,
              the first operational users will be investigators and enrolled patients in early trials. In the long run,
              the true commercial customers would be oncology providers and reimbursing systems if efficacy and
              tolerability prove out. This staged customer map is the correct way to read Myricx’s status: impressive
              strategic demand today, but no ordinary commercial demand proof yet.
            claimRefs:
              - CU029
              - CU030
              - CU031
              - CU032
              - CU033
              - CU034
              - CU035
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Novartis is effectively the customer today
            body: For a preclinical payload platform, acquisition is the clearest form of customer proof available.
            calloutType: insight
            claimRefs:
              - CU001
              - CU015
          - type: callout
            title: Customer concentration is absolute
            body: >-
              Current demand proof depends on a single strategic acquirer and has not yet diversified into broader
              clinical users.
            calloutType: risk
            claimRefs:
              - CU022
              - CU023
              - CU029
          - type: callout
            title: Validated targets point to real downstream populations
            body: HER2 and B7-H3 give Myricx biologically grounded future patient segments even before launch.
            calloutType: strength
            claimRefs:
              - CU008
              - CU010
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical and Mechanistic Risk Is the Dominant Risk
        blocks:
          - type: paragraph
            body: >-
              The most important risk is simple: Myricx has no human efficacy or safety data. Every public claim
              supporting the platform still depends on preclinical models. That matters more here than in some other
              biotech stories because the company’s differentiated value comes from a broad biological mechanism rather
              than from a narrowly validated pathway. NMT inhibition could be highly powerful in tumors, but it could
              also create unanticipated toxicity when moved into patients, especially if the ADC format fails to confine
              exposure tightly enough. Public ADC literature reinforces how often resistance, payload behavior, linker
              release, and toxicity end up determining the fate of otherwise compelling programs. The rich announced
              acquisition price does not erase this risk; if anything, it highlights how much value Novartis is paying
              before the key question has been answered. In risk-ranking terms, lack of human proof and novel-mechanism
              toxicity should be treated as critical, not merely high.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR008
              - CR015
              - CR022
              - CR029
      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory and legal risk is the second critical layer. The acquisition is still pending, which means
              transaction timing and final ownership remain contingent on approvals and customary closing conditions.
              That creates a nontrivial deal-completion risk even though both counterparties are credible. At the
              product level, Myricx has not yet faced the real regulatory stress test that begins with IND review and
              continues through first-in-human safety assessment. Broader FDA and biotech regulatory frameworks show
              that moving a novel biologic platform from preclinical evidence to human testing requires a much deeper
              documentation burden than press releases can convey. The legal surface visible publicly is also
              incomplete. Companies House confirms the filing surface, but public legal materials do not reveal every
              shareholder-rights, retention, or transaction-detail issue that could matter in a strategic exit. The
              practical point is that legal and regulatory work have not disappeared just because the strategic
              narrative is strong; they are simply less visible than the science.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
      - number: '7.3'
        title: Operational, Quality, and Manufacturing Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Myricx is exposed to the usual ADC scale-up hazards despite not yet being in the clinic.
              Linker stability, payload release control, and manufacturing reproducibility all influence therapeutic
              index. Public reviews and manufacturing articles underscore that ADC programs are notoriously sensitive to
              chemistry, CMC, and process robustness. This matters because Myricx’s value proposition depends on
              transplanting a novel payload into a format whose manufacturing and exposure properties must be tightly
              controlled. A small problem in linker behavior or CMC can turn a compelling biology story into a safety or
              efficacy failure. Operational risk is also amplified by stage: the company does not yet have a public
              commercial manufacturing track record or a history of navigating late-stage quality systems. This should
              be treated as a high but not top-level risk. It is not the first question because human proof comes first,
              but it can become the binding constraint quickly once a lead candidate moves into clinic-readiness.
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
          - type: table
            tableRef: TR003
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR010
              - CR016
              - CR017
              - CR019
              - CR030
      - number: '7.4'
        title: Partner, Dependency, and People Risk
        blocks:
          - type: paragraph
            body: >-
              Myricx also carries meaningful dependence risk. Pacylex can reduce novelty around NMT biology and
              potentially set a small-molecule human benchmark before Myricx does. In target space, ifinatamab
              deruxtecan and other B7-H3 programs can establish efficacy expectations before Myricx enters the clinic.
              Internally, know-how concentration remains important. Robin Carr and Ed Tate represent a substantial share
              of the platform’s tacit technical logic, while the post-2025 leadership team is still relatively new as an
              integrated operating unit. The Novartis transaction could eventually reduce funding risk but may also
              create integration and retention risk if key scientists or operators leave during transition. These risks
              are not as foundational as first-in-human biology, but they are highly relevant because they can narrow
              the window in which the platform proves itself. They should therefore be treated as high for execution and
              medium-to-high for structural durability.
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
          - type: table
            tableRef: TR004
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR033
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR022
              - CR023
              - CR026
              - CR027
              - CR028
      - number: '7.5'
        title: Mitigation Priorities and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The right mitigation posture for Myricx is explicit and unforgiving. The company should demand early
              clinical evidence that NMTi payloads are at least directionally superior on either efficacy or
              tolerability in relevant settings, not merely novel. IND-enabling toxicology, linker-stability work, and
              target-specific translational packages should be reviewed construct by construct. On the corporate side,
              diligence should test transaction-close risk, key-person retention, and whether Novartis has the
              integration plan to preserve scientific continuity. The correct kill criteria are similarly clear. If
              first-in-human safety proves materially worse than expected, if efficacy fails to differentiate from
              incumbent payloads, or if platform portability does not hold across more than one meaningful construct,
              the core thesis weakens sharply. By contrast, many secondary risks—such as portfolio crowding or moderate
              delay—are manageable if the biology holds. The mitigation logic therefore mirrors the risk hierarchy:
              focus first on mechanism-window proof, then on execution and organizational continuity.
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
          - type: table
            tableRef: TR005
