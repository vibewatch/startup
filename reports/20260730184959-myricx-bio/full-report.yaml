              also matters because it keeps oncology budgets and trial activity high enough to sustain large platform
              acquisitions and multiple parallel drug-development bets. For Myricx, patient segmentation is therefore
              not abstract. The company is aiming at solid-tumor settings where existing payload classes may
              underperform on resistance or tolerability, and where validated antibodies can carry a new payload into
              familiar disease spaces. The practical implication is that downstream customer value is largest where
