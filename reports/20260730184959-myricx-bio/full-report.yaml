            body: >-
              Because Myricx remains preclinical, the customer chapter cannot be written like a software or
              commercial-biopharma customer roster. There are no disclosed paying hospital systems, prescribers, or
              product users. Instead, the real current economic customer is a strategic biopharma buyer that values the
              platform before launch. The strongest evidence for that is Novartis’s agreement to acquire the company,
              which effectively converts external customer interest into ownership. A second customer-adjacent group
              consists of strategic investors such as Eli Lilly, whose participation in the Series A signaled market
              interest even without a disclosed commercial licensing transaction. Downstream, the eventual users and
              beneficiaries would be oncologists, investigators, and patients only if Myricx’s payload reaches the
              clinic through Novartis or another partner path. This chapter therefore treats customer analysis as a
              staged chain: strategic buyer today, trial ecosystem tomorrow, and treated patients after approval. That
