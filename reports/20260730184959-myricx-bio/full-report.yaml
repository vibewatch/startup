      - number: '3.4'
        title: Switching Costs, Distribution Power, and What Actually Creates Moat
        blocks:
          - type: paragraph
            body: >-
              In this market, switching costs do not look like software migration costs. They arise from clinical
              precedent, target ownership, manufacturing capability, and the ability to move quickly from preclinical
              evidence into late-stage trials. Incumbents benefit from deep antibody franchises, trusted CMC systems,
              established investigator networks, and the credibility that comes from already-approved or late-stage
              products. Myricx’s moat claim is therefore narrower and more fragile: it depends on having a genuinely
              differentiated payload mechanism that can plug into familiar antibody and linker frameworks while yielding
              superior efficacy or tolerability. If that claim is true, the platform can travel across multiple targets
              and create real scarcity. If not, incumbents and fast followers can stay with better-known payloads.
              Multi-homing is also structurally possible in ADC development; a large pharma buyer can back several
              payload bets at once. That reduces lock-in and raises the proof burden on Myricx. In practical terms, moat
              durability is not based on customer captivity but on whether the NMTi payload generates data that other
              payload classes cannot match.
