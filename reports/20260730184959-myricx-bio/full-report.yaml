      - number: '2.3'
        title: Buyers, Users, and the Adoption Path for a Preclinical Payload Platform
        blocks:
          - type: paragraph
            body: >-
              Because Myricx is preclinical, the immediate buyer is not an oncologist or hospital system. The real
              current buyer is a pharmaceutical R&D or business-development organization that controls antibody platform
              budgets, external innovation scouting, and M&A decisions. Within such organizations, research scientists
              and translational oncology leaders are the early users, while executive committees and corporate
              development teams are the economic decision makers. Only later, if a payload platform becomes part of a
              clinical asset portfolio, do investigators, clinicians, and eventually payers enter the chain. Target
              biology also broadens the addressable downstream user base. HER2 remains one of the best-established ADC
              target classes, especially in breast and gastric cancers, while B7-H3 is attractive because it is
              expressed across many solid tumors and remains an active frontier in lung and other cancers. That
              combination gives Myricx a way to start from well-understood antibody target spaces while selling
              differentiation through payload biology rather than novel target discovery. In short, the adoption path is
              buyer-led by big pharma today and patient-facing only after clinical proof emerges.
            claimRefs:
