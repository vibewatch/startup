            body: >-
              Myricx should be analyzed as a pre-revenue biotech rather than as a company with visible recurring
              commercial economics. The public materials reviewed for this report do not disclose marketed products,
              clinical-stage revenue, or product sales. Instead, the company’s financial history is dominated by equity
              financing and, ultimately, announced acquisition value. That matters because it means there is no normal
              revenue-stream bridge from units sold to gross profit. The nearest analogue to monetization before
              acquisition would have been platform partnering or licensing, yet no broad commercial collaboration
              revenue stream is disclosed in the open sources reviewed here. In practical terms, the revenue model
              stayed hypothetical until Novartis chose acquisition. The right financial framing is therefore to separate
              three buckets: disclosed external financing, potential but undisclosed partnering optionality, and exit
              economics. Readers should avoid treating the size of the ADC market as evidence of current company revenue
