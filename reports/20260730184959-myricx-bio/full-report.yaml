  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation Framing and Headline Recommendation
        blocks:
          - type: paragraph
            body: >-
              Myricx’s announced valuation should be framed as a strategic transaction price rather than as a fair-value
              mark supported by current operating metrics. The company raised roughly $120 million of disclosed private
              capital and agreed to sell for up to $1.5 billion, including $1.1 billion upfront. That is a remarkable
              outcome for a preclinical biotech and should immediately push analysts away from ordinary revenue or
              EBITDA frameworks. The right question is not whether Myricx is cheap relative to current fundamentals; it
              plainly is not on conventional metrics. The right question is whether a strategic buyer could rationally
              pay a premium for scarce payload technology before first-in-human proof because waiting would risk losing
              access to the platform. On that frame, the valuation can be described as stretched but strategically
              intelligible. It prices optionality, transferability, and future portfolio leverage rather than proven
              cash flow. That implies a nuanced recommendation: impressive strategic monetization outcome, high
              confidence in price realization if the deal closes, but only moderate confidence that the same price would
              generalize to ordinary investors absent a strategic control buyer.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV034
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV034
      - number: '8.2'
        title: Why the Price Can Be Defended and Why It Can Look Overstretched
        blocks:
          - type: paragraph
            body: >-
              The pro-valuation thesis is strong. ADC markets are growing rapidly, payload concentration creates
              scarcity for orthogonal mechanisms, and large pharma has demonstrated willingness to pay heavily for
              oncology platforms. Novartis clearly believes Myricx’s NMTi payload could matter across more than one
              target and perhaps across more than one asset generation. The anti-thesis is equally strong. Myricx has no
              human data, no product revenue, no ordinary commercial customer base, and no published evidence that its
              payload is portable across many constructs in a clinically meaningful way. Comparable transactions such as
              Fusion, ImmunoGen, and Seagen all involved different stage mixes and, in some cases, approved products or
              more mature pipelines. That means Myricx’s price is not cheap on stage-adjusted grounds. The fair summary
              is that the transaction reflects a large platform premium paid ahead of clinical validation. Such a
              premium can be rational for a strategic acquirer but would look aggressive as a purely financial-investor
              mark.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Comparable Transactions and Why They Only Partly Anchor Myricx
        blocks:
          - type: paragraph
            body: >-
              Comparables help frame direction more than precision. Pfizer-Seagen and AbbVie-ImmunoGen show what
              validated ADC franchises and later-stage assets can command. AstraZeneca-Fusion shows appetite for
              differentiated oncology technology beyond classic ADCs. Gilead-Tubulis is the most interesting directional
              parallel because it shows how buyers may pay substantial sums for next-generation ADC platforms and
              preclinical optionality, albeit in a different structure and at a different stage mix. Nature and analyst
              benchmarking sources both reinforce that billion-dollar oncology bets increasingly cluster around scarce
              enabling technologies rather than only around approved products. But these analogies have limits. Myricx’s
              unique combination of preclinical stage, payload novelty, and strategic-takeout timing makes it hard to
              drop into a normal comparable-multiple set. The right use of comparables is therefore to establish that
              strategic buyers have precedent for paying up in oncology platform races, while preserving the point that
              Myricx still sits at the upper-risk end of that range.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
          - type: table
            tableRef: TV004
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more honest than a single deterministic fair value. In the bull case, Myricx’s
              NMTi payload shows a differentiated safety or efficacy profile in humans, validates portability across
              multiple target contexts, and supports a multibillion-dollar portfolio logic inside Novartis. In that
              case, the announced price may eventually look prescient rather than rich. In the base case, the platform
              proves interesting but not category-breaking, and the acquisition still looks acceptable because Novartis
              secures optionality, talent, and first-mover access to a scarce mechanism. In the bear case,
              first-in-human data fail on safety or differentiation and the preclinical premium looks excessive. Because
              no public operating cash flow anchors the valuation, the scenario range is driven almost entirely by
              biology and portfolio leverage. That is why the deal’s valuation stance should be described as stretched
              but defendable, not conservative or obviously mispriced.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: table
            tableRef: TV003
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV032
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV037
              - CV040
      - number: '8.5'
        title: What Would Change the Valuation View
        blocks:
          - type: paragraph
            body: >-
              Several diligence asks would materially sharpen the valuation view. First, a construct-level explanation
              of why Novartis believes the payload can generalize across targets would clarify whether the platform
              premium is justified by breadth. Second, a detailed comparison between Myricx and competitor payload
              options would show whether the buyer paid for true scarcity or merely for optionality under uncertainty.
              Third, a transaction-structure memo could reveal how much of the headline value is economically robust
              versus back-ended into milestones or retention. Fourth, the IND-enabling package and early clinical plan
              would help distinguish a platform premium with disciplined risk management from one driven mainly by
              competitive fear. These requests matter because Myricx is already priced as a scarce strategic asset. Once
              a company clears that bar, diligence must ask not whether the story is exciting, but whether the premium
              is supported by durable technical leverage rather than a one-time bidding moment.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV006
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV033
      - number: '8.6'
        title: Final Valuation Verdict
        blocks:
          - type: paragraph
            body: >-
              The final valuation verdict is that Myricx should be marked as strategically expensive but not obviously
              irrational. The price is stretched relative to stage because there is no human proof, no revenue base, and
              no conventional multiple to support it. Yet the existence of multiple large oncology transactions, rapid
              ADC dealmaking, and a strategic buyer with strong balance-sheet capacity make the premium understandable
              if management believes NMTi payloads could become a reusable portfolio advantage. In that sense, the
              valuation is less a judgment about today’s fundamentals than about tomorrow’s option value under strategic
              control. For financial investors, that means caution: the transaction is a great exit but not clean
              evidence that preclinical payload platforms broadly deserve the same mark. For strategic buyers, it
              suggests that scarcity in next-generation ADC technology can justify paying early. That tension is why the
              appropriate valuation stance remains stretched.
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic premium explains the price better than fundamentals
            body: >-
              The transaction prices future portfolio optionality and control over scarce payload technology more than
              current operating performance.
            calloutType: insight
            claimRefs:
              - CV003
              - CV005
              - CV034
          - type: callout
            title: This price is not a general market clearing price for all preclinical payload platforms
            body: Without a strategic control buyer, the same platform might not command the same mark.
            calloutType: risk
            claimRefs:
              - CV006
              - CV013
              - CV040
          - type: callout
            title: 'Valuation stance: stretched but defendable'
            body: >-
              The price looks rich relative to stage, but comparable oncology dealmaking and buyer scarcity logic keep
              it from looking irrational.
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV021
              - CV040
