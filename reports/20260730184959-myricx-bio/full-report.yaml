  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct, Incumbent, Adjacent, and Substitute Solutions'
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape around Myricx is layered rather than flat. The most direct peer is Pacylex,
              which also centers on N-myristoyltransferase inhibition and has already advanced zelenirstat into the
              clinic while also discussing NMTi-ADC payload work with Heidelberg Pharma. That makes Pacylex the closest
              scientific comparator because it tests the same enzyme target, albeit through a small-molecule route
              before fully proving the ADC payload thesis. A second layer consists of established ADC incumbents with
              validated commercial footprints: Enhertu in HER2 and multiple B7-H3 programs led by ifinatamab deruxtecan
              and GSK’s risvutatug rezetecan. A third layer includes adjacent platform competitors such as BioNTech and
              DualityBio, which are building differentiated HER2 and B7-H3 ADC portfolios through licensing and
              dealmaking. Finally, the status quo alternative is not another startup at all but continuing to use proven
              Topo-1, tubulin, or other existing payload classes. Myricx therefore competes on two fronts at once:
              scientific novelty versus direct peers and portfolio relevance versus entrenched incumbents.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
