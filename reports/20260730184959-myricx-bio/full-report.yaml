      - number: '3.2'
        title: 'Direct Peer Pressure: Pacylex as the Closest NMT Comparator'
        blocks:
          - type: paragraph
            body: >-
              Pacylex is the most important direct comparator because it validates investor and buyer interest in NMT
              biology independently of Myricx. Pacylex’s lead program zelenirstat is an oral NMT inhibitor that has
              advanced into clinical testing for hematologic malignancies, and the company has also highlighted a
              collaboration with Heidelberg Pharma around ADC payload applications. This gives Pacylex two advantages
              relative to Myricx. First, it can generate human safety and activity data on NMT inhibition earlier, even
              if the modality is not an ADC. Second, it can claim its own path to an NMTi payload narrative rather than
              ceding the field to Myricx. At the same time, modality differences matter. Oral small-molecule NMT
              inhibition and an antibody-directed payload are not interchangeable, so Pacylex does not automatically
              invalidate Myricx’s thesis. Instead, Pacylex raises the competitive bar by reducing novelty value at the
              enzyme-target level while potentially increasing confidence that NMT itself is clinically interesting. For
              diligence, that means Pacylex is both a threat and a partial category validator.
            claimRefs:
