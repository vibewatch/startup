            body: >-
              Even without revenue customers, Myricx can still be mapped to real downstream patient groups because its
              public programs sit on recognizable oncology targets. HER2-positive disease matters because it is a
              well-established biological segment across breast and gastric cancers, with precedent for ADC use and
              commercial uptake. B7-H3 matters because it is broadly expressed across many solid tumors and continues to
