  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Issue
      - Mitigation
      - Kill criterion
      - Why
    rows:
      - - Novel-mechanism toxicity
        - Demand full IND-enabling tox review and exposure rationale
        - Unexpected severe safety signal in first-in-human work
        - Would undercut entire platform thesis
      - - Insufficient efficacy differentiation
        - Benchmark against incumbent payloads in relevant models and early trials
        - No meaningful edge on efficacy or tolerability
        - Novelty alone would not justify platform premium
      - - Portability failure
        - Test more than one construct and target context
        - Signal works only in one narrow construct
        - Platform shrinks into single-asset story
      - - Transaction / retention disruption
        - Review close conditions and retention plans
        - Loss of critical talent or failed close
        - Would weaken continuity and financing certainty
    notes: >-
      Kill criteria are intentionally strict because a platform-premium valuation should be defended by equally strict
      downside rules.
