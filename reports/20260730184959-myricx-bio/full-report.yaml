      - number: '5.3'
        title: 'Technology Architecture: Payload, Linker Compatibility, and ADC Operating Stack'
        blocks:
          - type: paragraph
            body: >-
              The public technical narrative suggests a modular architecture rather than a bespoke one-off chemistry
              package. Myricx repeatedly argues that NMTi payloads can be combined with familiar antibodies and linker
              technologies, which is central to the platform’s strategic value. If true, this architecture lowers
              switching cost for potential buyers because they do not need to rebuild the entire ADC stack around a new
              antigen concept. The core layers are target-binding antibody, linker and conjugation strategy, NMT
              inhibitor payload, and translational biology package that explains efficacy, tolerability, and resistance
              hypotheses. Open literature on ADC design reinforces why linker choice and stability matter so much:
              payload release efficiency, pharmacokinetics, and therapeutic index can change materially with linker
              design even when the payload is promising. That means Myricx’s real technical asset is not merely the NMTi
              warhead but the integration of payload potency, linker behavior, antigen selection, and evidence package.
              Product-tech diligence should therefore test whether the platform is genuinely modular across antibodies
              and linkers or whether public examples overstate portability from one construct to another.
