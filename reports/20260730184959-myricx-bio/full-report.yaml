      - number: '2.5'
        title: What the Market Structure Means for Myricx Specifically
        blocks:
          - type: paragraph
            body: >-
              Myricx benefits from entering the market at a moment when payload differentiation matters more than ever.
              The dominance of Topo-1 payloads created commercial proof, but it also created crowding and the risk of
              class-wide retreatment limitations. Public discussions of resistance mechanisms, dose reductions, and
              interruptions support management’s argument that there is a strategic opening for orthogonal payload
              classes. However, the market will not reward novelty alone forever. The reason the Novartis deal looks so
              rich is precisely that it prices future optionality before human data. If early clinical results later
              fail to show a clear efficacy or tolerability edge, the same market structure could work against the
              platform because buyers already have many alternative ADC programs to back. The market therefore gives
              Myricx a strong window of strategic relevance now, but that relevance remains highly conditional on
              proving that NMT inhibition can be more than an interesting preclinical story.
            claimRefs:
              - CM033
              - CM034
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
