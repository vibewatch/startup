chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origins, and Operating Thesis
        blocks:
          - type: paragraph
            body: >-
              Myricx Pharma Ltd, trading as Myricx Bio, is a UK oncology biotechnology company founded in November 2020
              and headquartered in London’s King’s Cross biotech cluster. The company was spun out from Imperial College
              London and the Francis Crick Institute around research showing that N-myristoyltransferase, or NMT, is a
              targetable cancer vulnerability. Myricx originally launched around novel NMT inhibitors as small
              molecules, but by 2023 had repositioned the platform around antibody-drug conjugate payloads, arguing that
              an NMT inhibitor payload can solve the efficacy, tolerability, and resistance limits of the three payload
              classes that dominate clinical ADCs today. As of the July 2026 run date, the company remains preclinical,
              with no disclosed human clinical data, no revenue-generating products, and a business model centered on
              preclinical discovery, capital formation, and strategic exit. That strategy culminated in Novartis
              announcing an agreement to acquire Myricx for $1.1 billion upfront plus up to $400 million in milestones,
              highlighting how strongly large pharma values differentiated ADC payload innovation even before
              first-in-human validation.
