      - number: '1.3'
        title: Leadership Build-Out and Governance
        blocks:
          - type: paragraph
            body: >-
              Myricx materially upgraded its leadership team in September 2025, signaling preparation for clinical
              execution and strategic optionality rather than pure laboratory discovery. Mohit Rawat joined as chief
              executive officer after serving as president and chief business officer of Fusion Pharmaceuticals, which
              AstraZeneca acquired for $2.4 billion in 2024, and after prior senior roles at Novartis, AbbVie, and
              McKinsey. At the same time, Robin Carr transitioned from chief executive to chief technology officer,
              preserving continuity around the NMT chemistry and ADC pivot while making room for a transaction-oriented
              CEO. The same September 2025 expansion added a chief medical officer, senior CMC leadership, regulatory,
              business development, and clinical operations executives across the UK and US, indicating a deliberate
              move toward IND readiness. Governance also strengthened earlier with ADC Therapeutics co-founder Chris
              Martin joining as independent board chair in November 2023, while Novo Holdings and Abingworth gained
              board representation at the 2024 Series A. The leadership picture therefore combines strong scientific
              continuity with a commercial and clinical bench built to maximize acquisition value, although key-person
              dependence on Carr and Tate remains significant because the core NMTi know-how is not commoditized.
