  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Core Science: Why NMT Biology Could Matter as a Payload'
        blocks:
          - type: paragraph
            body: >-
              N-myristoyltransferase is the enzyme that attaches a 14-carbon myristoyl group to the N-terminal glycine
              of substrate proteins, a modification that can determine protein localization, signaling, and survival
              functions. Myricx’s product thesis begins with the idea that this biology creates a broad cancer
              vulnerability rather than a narrow single-pathway effect. Public company materials and broader literature
              frame NMT inhibition as a way to disrupt multiple survival pathways at once, with particular relevance in
              tumors dependent on intense oncogenic signaling. This gives Myricx a payload narrative that is orthogonal
              to the Topo-1 and tubulin payload families dominating today’s marketed ADCs. The attraction is not only
              novelty but mechanism density: one payload can theoretically hit many downstream processes through
              myristoylation dependence. The price of that promise is translational uncertainty, because a broad
              mechanism can also create toxicity surprises if the therapeutic window is not preserved by the ADC format.
              Public technical sources therefore matter here because they show the platform logic is scientifically
              coherent even if not yet clinically proven.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: Disclosed Assets and Use Cases
        blocks:
          - type: paragraph
            body: >-
              Myricx has not disclosed a broad clinical product catalog; instead it has disclosed a focused platform
              with a few flagship applications. The best-known named construct is MYX2449, described as a
              trastuzumab-linked HER2-targeting NMTi-ADC. Public materials also reference B7-H3 as a second major
              targeting axis. This choice of targets is strategically sensible because it lets Myricx test novel payload
              biology against antibodies and target classes that are already familiar to oncology buyers. In effect, the
              company is trying to reduce one source of uncertainty—target novelty—so the market can focus on payload
              differentiation. The intended users of the product are therefore not end patients at this stage but
              translational oncology teams and strategic acquirers evaluating whether Myricx’s payload can be inserted
              into clinically relevant antibody frameworks. A product-tech reading of the company is thus closer to a
              payload engine than to a conventional one-asset biotech. Its clearest use case is enabling activity in
              settings where existing payload classes underperform because of resistance, tolerability, or
              antigen-expression breadth constraints.
