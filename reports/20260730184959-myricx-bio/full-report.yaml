        title: Trust, Quality, and Translational Control Surface
        blocks:
          - type: paragraph
            body: >-
              Because Myricx remains preclinical, trust controls are less about commercial compliance badges and more
              about scientific quality, reproducibility, and manufacturability. The company’s public control surface
              includes repeated conference disclosures, named scientific leadership, and explicit claims about
              tolerability and therapeutic index. It does not yet include human safety packages, marketed-product
              quality systems, or published commercial CMC track records. That is normal for stage, but it sharpens the
              diligence burden. For this platform, trust depends on whether preclinical data are robust across models,
              whether the bystander-effect and macrophage-reprogramming claims translate beyond isolated experiments,
              and whether linker-payload integration can preserve a useful therapeutic window. The public literature on
              ADC resistance, linker design, and payload innovation provides context for what strong controls should
              eventually demonstrate. Myricx’s comparative advantage is that it appears to plug a novel mechanism into a
              well-understood format; its comparative vulnerability is that all the hard translational work still lies
              ahead. The quality question is therefore not whether the science is interesting, but whether it will
              remain coherent under manufacturability and human-toxicity scrutiny.
