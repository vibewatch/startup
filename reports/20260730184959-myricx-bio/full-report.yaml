      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Four durable drivers support continued investment in new ADC payloads. First, the global cancer burden
              remains very large, which keeps oncology budgets resilient. Second, approved ADC success has already
              proven that the format can create blockbuster drugs. Third, persistent toxicity and resistance problems
              leave room for better payloads. Fourth, the transaction market has shown that differentiated payload
              science can be bought well before commercialization. These drivers align closely with Myricx’s pitch. At
              the same time, adoption constraints are just as important. Most of the market’s current economics come
              from validated, late-stage, or approved assets, whereas Myricx has no human data. The dominant payload
              classes already enjoy manufacturing familiarity, physician comfort, and regulatory precedent. Large pharma
              buyers can therefore be enthusiastic about novelty while still demanding unusually strong preclinical
              evidence before licensing or building around an unproven mechanism. The practical implication is that
              Myricx competes in a market that is strategically hungry for innovation but operationally conservative
              about clinical translation.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
