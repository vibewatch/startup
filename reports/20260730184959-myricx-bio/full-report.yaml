      - number: '3.3'
        title: Incumbent Power in HER2 and B7-H3
        blocks:
          - type: paragraph
            body: >-
              The biggest commercial threat to Myricx does not come from another NMT startup; it comes from companies
              that already own the most important antibody targets and clinical mindshare. In HER2, Enhertu defines the
              efficacy benchmark and has grown into the leading commercial ADC franchise. Kadcyla remains an
              earlier-generation comparator and shows how deeply incumbents can entrench physician familiarity and
              regulatory precedent around a target. In B7-H3, the clearest threat is ifinatamab deruxtecan, which has
              already reached a U.S. Priority Review milestone in small-cell lung cancer, giving Merck and Daiichi
              Sankyo a chance to define the clinical and regulatory bar before Myricx enters the clinic. GSK’s B7-H3
              program reinforces that the target is crowded, while BioNTech and DualityBio show that licensing-led
              competitors can quickly assemble competitive portfolios around the same validated antigen spaces. Myricx
              therefore enters crowded target ecosystems where payload differentiation must be obvious, not merely
              claimed, because incumbents already control distribution power, trial infrastructure, and regulatory
              momentum.
            claimRefs:
