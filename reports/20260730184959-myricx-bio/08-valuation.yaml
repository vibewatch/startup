chapter:
  number: 8
  title: Valuation
  summary: Myricx’s announced valuation is best understood as a strategic scarcity premium on a preclinical payload platform, not as a conventional multiple on revenue or clinical de-risking. The deal is stretched against stage, but not irrational if a buyer believes differentiated ADC payloads are scarce and transferable across multiple targets.
sections:
- id: recommendation
  title: Valuation Framing and Headline Recommendation
  body: 'Myricx’s announced valuation should be framed as a strategic transaction price rather than as a fair-value mark supported by current operating metrics. The company raised roughly $120 million of disclosed private capital and agreed to sell for up to $1.5 billion, including $1.1 billion upfront. That is a remarkable outcome for a preclinical biotech and should immediately push analysts away from ordinary revenue or EBITDA frameworks. The right question is not whether Myricx is cheap relative to current fundamentals; it plainly is not on conventional metrics. The right question is whether a strategic buyer could rationally pay a premium for scarce payload technology before first-in-human proof because waiting would risk losing access to the platform. On that frame, the valuation can be described as stretched but strategically intelligible. It prices optionality, transferability, and future portfolio leverage rather than proven cash flow. That implies a nuanced recommendation: impressive
    strategic monetization outcome, high confidence in price realization if the deal closes, but only moderate confidence that the same price would generalize to ordinary investors absent a strategic control buyer.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  tableRefs:
  - TV001
  figureRefs:
