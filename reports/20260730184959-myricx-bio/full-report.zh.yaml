              Myricx 最大的商业威胁不是另一家 NMT 创业公司，而是那些已经拥有关键抗体靶点和临床心智的公司。在 HER2 中，Enhertu 定义了疗效标杆，并成长为领先的商业化 ADC 产品线。Kadcyla
              仍是早一代参照，也显示既有玩家能在一个靶点上把医生熟悉度和监管先例扎得多深。在 B7-H3 中，最清晰的威胁是 ifinatamab deruxtecan，它已在小细胞肺癌中达到美国优先审评里程碑，使 Merck
              和 Daiichi Sankyo 有机会在 Myricx 进入临床前定义临床和监管门槛。GSK 的 B7-H3 项目进一步说明该靶点已经拥挤；BioNTech 和 DualityBio
              则表明，靠授权推进的竞争者可以围绕同一批已验证抗原空间迅速拼出竞争性组合。因此，Myricx
              进入的是拥挤的靶点生态。载荷差异化必须显而易见，不能只停留在宣称，因为既有玩家已经掌握分销能力、试验基础设施和监管动量。
