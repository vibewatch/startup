        - 检验溢价是否建立在可复用平台宽度上
        - 高
      - - IND 与首次人体计划
        - 把估值连接到近期去风险里程碑
        - 高
      - - 并购结构细节
        - 区分公告价值与后置经济条款
        - 高
      - - 竞争替代方案备忘录
        - 检验稀缺是真实存在，还是只是感知
        - 中
      - - 留任与整合计划
        - 保护交割后的平台连续性
        - 中
    notes: 这些问题瞄准让估值显得偏高的具体不确定性。
