              使用和商业放量先例。B7-H3 重要，是因为它在多种实体瘤中广泛表达，并持续吸引 ADC
              开发关注，尤其是在肺癌和其他难治癌种中。广泛癌症负担也重要，因为它让肿瘤预算和试验活动保持足够高，足以支撑大型平台收购和多条并行药物开发赌注。对 Myricx
              来说，患者分群并不抽象。公司瞄准的是实体瘤场景：既有载荷类别可能因耐药或耐受性表现不足，而已验证抗体又能把新载荷带入熟悉疾病空间。实际含义是，下游客户价值最大的位置，是靶点相关性和既有 ADC
