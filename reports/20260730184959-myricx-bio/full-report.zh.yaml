  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入现实：临床前平台，没有商业化产品收入
        blocks:
          - type: paragraph
            body: >-
              分析 Myricx
              时，应把它视为尚未产生收入的生物技术公司，而不是一家已有可见、可重复商业经济性的公司。本报告审阅的公开材料没有披露已上市产品、临床阶段收入或产品销售额。公司财务历史主要由股权融资主导，最终体现为已宣布的收购价值。这一点重要，因为它意味着不存在从销售件数到毛利的正常收入流桥梁。收购前最接近货币化的路径本应是平台合作或授权，但本报告审阅的公开来源没有披露广泛商业合作收入流。实际看，在
              Novartis 选择收购之前，收入模型一直停留在假设状态。正确的财务框架应拆成三块：已披露外部融资、潜在但未披露的合作可选性、以及退出经济性。读者不应把 ADC
              市场规模当作公司当前收入的证据，因为公开层面没有证明这类收入存在。
