      - number: '1.3'
        title: 领导层扩建与治理
        blocks:
          - type: paragraph
            body: >-
              Myricx 在 2025 年 9 月大幅升级领导团队，释放出的信号不再只是实验室发现，而是临床执行和战略选项准备。Mohit Rawat 加入担任首席执行官；此前他曾任 Fusion
              Pharmaceuticals 总裁兼首席商务官，Fusion 在 2024 年被 AstraZeneca 以 $2.4B 收购，他也曾在 Novartis、AbbVie 和 McKinsey
              担任高级职务。与此同时，Robin Carr 从首席执行官转任首席技术官，既延续 NMT 化学和 ADC 转向上的连续性，也为更偏交易导向的 CEO 腾出空间。同一次 2025 年 9
              月扩建还补入首席医学官，以及 CMC、监管、业务发展和临床运营方面的资深高管，覆盖英国和美国，显示公司有意向 IND 准备推进。治理层面此前也已增强：ADC Therapeutics 联合创始人 Chris
              Martin 于 2023 年 11 月出任独立董事长；Novo Holdings 和 Abingworth 在 2024 年 Series A
              后获得董事会席位。因此，领导层图谱同时具备强科学连续性和为最大化收购价值搭建的商业、临床梯队。不过，Carr 和 Tate 的关键人依赖仍然显著，因为核心 NMTi 技术诀窍还没有商品化。
