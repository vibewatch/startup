      - number: '7.5'
        title: 缓释优先级和终止标准
        blocks:
          - type: paragraph
            body: >-
              Myricx 正确的风险缓释姿态应当明确且严苛。公司应要求早期临床证据证明，NMTi payload 在相关场景中至少在疗效或耐受性上具有方向性优势，而不仅仅是新颖。支持 IND 的毒理、linker
              稳定性工作和靶点特异性转化包，都应逐个构建物审查。公司层面，尽调应测试交易交割风险、关键人员留任，以及 Novartis
              是否有整合计划来保住科学连续性。正确的终止标准同样清晰：如果人体首次安全性显著差于预期，疗效无法与既有 payload
              拉开差异，或平台可移植性无法跨越一个以上有意义的构建物，核心论点会急剧变弱。相反，只要生物学站得住，许多次要风险——例如组合拥挤或中等延迟——都可以管理。因此，缓释逻辑应贴合风险层级：先抓机制窗口证明，再抓执行和组织连续性。
            claimRefs:
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
