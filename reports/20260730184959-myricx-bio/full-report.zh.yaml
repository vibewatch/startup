  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Myricx 为什么只切泛 ADC 总可用市场（TAM）中更窄的一块
        blocks:
          - type: paragraph
            body: >-
              Myricx 的相关市场不是整个肿瘤药市场，甚至也不是最宽口径的 ADC 市场。最实用的窄边界，是那些在拓扑异构酶 I 或微管蛋白载荷经验之后，正在寻找下一代 ADC
              载荷以提升疗效或耐受性的肿瘤项目和买方。因此，Myricx 主要是 ADC 创新供应链里的平台和授权资产，而不是短期面向医院或支付方的卖方。公开市场报告把整体 ADC 市场放在 2025 年 150
              多亿美元、2026 年约 $20B，并预计到 2030 年代初继续快速增长。但这些自上而下的数字混合了已获批产品、临床验证靶点、制造基础设施和商业肿瘤销售，Myricx 目前都不具备。尽调里，较宽的 ADC
              市场之所以重要，是因为它证明战略预算和并购胃口存在；较窄的下一代载荷市场之所以重要，是因为它定义了今天真正的买方：愿意在首次商业化前为差异化机制付费的大型生物制药公司。
