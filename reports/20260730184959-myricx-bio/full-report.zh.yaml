  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心科学：NMT 生物学为什么可能适合作为载荷
        blocks:
          - type: paragraph
            body: >-
              N-肉豆蔻酰基转移酶会把一个 14 碳肉豆蔻酰基接到底物蛋白的 N 端甘氨酸上，这种修饰会决定蛋白定位、信号传导和存活功能。Myricx
              的产品逻辑从一个想法出发：这套生物学制造的是广泛癌症脆弱点，而不是狭窄的单通路效应。公司公开材料和更广泛文献都把 NMT 抑制描述为一种同时扰动多条存活通路的方式，尤其适用于依赖强致癌信号的肿瘤。这给了
              Myricx 一套与当下已上市 ADC 中主导的 Topo-1
              和微管蛋白载荷家族正交的载荷叙事。吸引力不只在新颖性，也在机制密度：一个载荷理论上可以通过肉豆蔻酰化依赖打击许多下游过程。承诺的代价是转化不确定性，因为如果 ADC
              形式守不住治疗窗口，广谱机制也可能带来毒性意外。因此，公开技术来源在这里很重要，因为它们说明平台逻辑在科学上自洽，哪怕还没有临床证明。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
      - number: '5.2'
        title: 已披露资产与使用场景
        blocks:
          - type: paragraph
            body: >-
              Myricx 没有披露庞大的临床产品目录；它披露的是一个聚焦平台和少数旗舰应用。最知名的命名构建物是 MYX2449，被描述为连接 trastuzumab、靶向 HER2 的 NMTi-ADC。公开材料也把
              B7-H3 列为第二条重要靶向轴。选择这些靶点在战略上合理，因为 Myricx
              可以用肿瘤买方已经熟悉的抗体和靶点类别来测试新载荷生物学。换句话说，公司试图减少一种不确定性——靶点新颖性——让市场把注意力放在载荷差异化上。因此，这个产品现阶段的预期用户不是终端患者，而是评估 Myricx
              载荷能否插入临床相关抗体框架的转化肿瘤团队和战略收购方。用产品技术视角看，公司更像一个载荷引擎，而不是常规单资产生物技术公司。最清晰的使用场景，是在既有载荷类别因为耐药、耐受性或抗原表达广度限制而表现不足时，帮助打出活性。
            claimRefs:
              - CE008
