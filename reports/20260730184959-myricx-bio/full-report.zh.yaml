      - number: '3.4'
        title: 切换成本、分销能力与真正的护城河来源
        blocks:
          - type: paragraph
            body: >-
              在这个市场里，切换成本不像软件迁移成本。它来自临床先例、靶点所有权、制造能力，以及从临床前证据快速推进到后期试验的能力。既有玩家拥有深厚的抗体产品线、可信的 CMC
              系统、成熟研究者网络，以及已获批或后期产品带来的信誉。Myricx
              的护城河主张因此更窄，也更脆弱：它必须有真正差异化的载荷机制，能插入熟悉的抗体和连接子框架，同时带来更好疗效或耐受性。如果这个主张成立，平台可以跨多个靶点迁移，并制造真实稀缺性。如果不成立，既有玩家和快速跟随者可以继续使用更熟悉的载荷。ADC
              开发中，多线押注在结构上也可行；大型药企买方可以同时押几个载荷赌注。这会降低锁定效应，也抬高 Myricx 的证据门槛。实际看，护城河耐久性不来自客户被锁住，而取决于 NMTi
              载荷能否产出其他载荷类别无法匹配的数据。
