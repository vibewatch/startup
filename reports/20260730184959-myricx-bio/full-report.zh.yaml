      - number: '2.2'
        title: 规模测算视角：ADC 高速增长、载荷经济集中与买方支付能力
        blocks:
          - type: paragraph
            body: >-
              多个外部市场视角都支持一个判断：ADC 是一个扩张中且战略重要性上升的市场，即便绝对规模估算会因方法不同而变化。Mordor Intelligence 将全球 ADC 市场估为 2025 年
              $15.61B、2026 年 $20.12B，并在 2031 年达到 $71.55B。The Business Research Company、Grand View Research
              等行业跟踪机构也落在相近区间，并都描述出陡峭的双位数增长。关键不只是市场大，它也很集中。商业价值被少数获批资产主导，尤其是 Enhertu；载荷类别也集中，尤其是拓扑异构酶 I
              载荷。这种集中很重要，因为它同时创造标杆和脆弱性。如果大部分收入集中在一个机制家族里，任何可信的替代载荷类别都能相对其阶段拿到超额战略价值，这有助于解释 Novartis 为什么愿意在临床前买下
              Myricx。因此，真正的结论不是挑一个 TAM 数字，而是认识到买方市场有真实预算、已经证明愿意买 ADC 资产，也有明确动力在竞争者之前锁定差异化载荷。
