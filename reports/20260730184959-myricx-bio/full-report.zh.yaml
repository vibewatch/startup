              公开描述的路线图很直接：提名领先候选药物，完成 IND 申报支持工作，进入临床。Myricx 2025 年表示，已提名一个领先开发候选药物，预计 2026 年提交
              IND。从产品技术角度看，关键依赖是科学转化、CMC 准备，以及留住 Robin Carr 和 Ed Tate 等领导者身上的专门技术诀窍。平台上行空间在于，如果一个 NMTi
              载荷构建物在临床有效，这套化学可以跨多个抗体靶点迁移。下行也同样集中：如果早期临床数据在安全性或疗效上失败，大部分载荷平台逻辑可能一次性坍塌。正确的产品判断因此不是 Myricx
              已经拥有经验证的产品套件，而是它拥有一套科学上差异化的临床前载荷架构，具备合理可移植性，也获得了异常强的战略买方兴趣。这足以支持严肃尽调，但不足以跳过连接子行为、靶点迁移性和首次人体治疗指数这些硬问题。
