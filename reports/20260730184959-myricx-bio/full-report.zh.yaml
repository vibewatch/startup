            body: >-
              最清晰的财务事实也是最简单的事实。Myricx 2020 年以 £4.5M 种子轮启动，2024 年完成 £90M Series A，意味着收购公告前披露私募资本约 £94.5M，约合 $120M。随后
              Novartis 在 2026 年 7 月同意以 $1.1B 首付款加最高 $400M 里程碑款收购公司。这为一家临床前公司创造了很高的投入资本倍数。不过，它没有回答所有承销问题。Companies House
              确认了法律实体和公开申报层面，但公开申报历史没有给出投资人通常想看的运营细节，如现金、义务或烧钱速度。Novartis 自己的 2025 年 20-F
              和年度业绩材料显示，买方拥有庞大肿瘤收入和集团规模，财务上有能力发起这类收购。因此，从财务上看，案例并不是 Myricx 已具备可见收入质量，而是资本充足的买方选择在首次人体去风险之前支付高额战略价格。
