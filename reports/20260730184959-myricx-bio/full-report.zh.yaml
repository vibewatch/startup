      - number: '5.3'
        title: 技术架构：载荷、连接子兼容性与 ADC 运行栈
        blocks:
          - type: paragraph
            body: >-
              公开技术叙事显示，它更像一套模块化架构，而不是一次性定制化学包。Myricx 反复主张 NMTi
              载荷可以与熟悉的抗体和连接子技术组合，这正是平台战略价值的核心。如果成立，这套架构会降低潜在买方的切换成本，因为他们不必围绕一个新抗原概念重建整个 ADC 栈。核心层包括靶点结合抗体、连接子和偶联策略、NMT
              抑制剂载荷，以及解释疗效、耐受性和耐药假设的转化生物学包。ADC 设计的公开文献也说明，连接子选择和稳定性极其关键：即便载荷本身有潜力，载荷释放效率、药代动力学和治疗指数也会随连接子设计发生实质变化。这意味着
              Myricx 真正的技术资产不只是 NMTi
              弹头，而是载荷效力、连接子行为、抗原选择和证据包的整合。产品技术尽调因此要测试，平台是否真的能跨抗体和连接子模块化迁移，还是公开案例夸大了从一个构建物迁移到另一个构建物的可移植性。
