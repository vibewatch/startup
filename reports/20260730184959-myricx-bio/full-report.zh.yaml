      - number: '2.3'
        title: 临床前载荷平台的买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Myricx
              处在临床前，所以眼前买方不是肿瘤医生或医院系统。真正的当前买方，是掌握抗体平台预算、外部创新扫描和并购决策的药企研发或业务发展组织。在这类组织里，研究科学家和转化肿瘤学负责人是早期用户，执行委员会和企业发展团队才是经济决策者。只有当载荷平台进入临床资产组合之后，研究者、临床医生和最终支付方才会进入链条。靶点生物学也会拓宽下游可触达用户基础。HER2
              仍是最成熟的 ADC 靶点类别之一，尤其在乳腺癌和胃癌中；B7-H3 则因在多种实体瘤中广泛表达而有吸引力，并且仍是肺癌等癌种里的活跃前沿。这个组合让 Myricx
              能从被充分理解的抗体靶点空间起步，同时把差异化卖点放在载荷生物学，而不是新靶点发现上。简言之，今天的采用路径由大药企买方牵引，只有临床证据出现后才会真正面向患者。
