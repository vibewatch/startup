      - number: '1.4'
        title: 融资历程、利益相关方与资本叙事
        blocks:
          - type: paragraph
            body: >-
              相比临床前阶段，Myricx 的融资爬坡很陡。公司 2020 年 11 月以 £4.5M 种子轮启动，由 Sofinnova Partners 和 Brandon Capital 领投。2024 年 7
              月，公司完成 £90M Series A，约合 $114M，由 Novo Holdings 和 Abingworth 领投，British Patient Capital、Cancer Research
              Horizons、Eli Lilly and Company、Brandon Capital 和 Sofinnova Partners 参投。这一轮把公司从有学术潜力的平台，推到资本充足的下一代 ADC
              竞争者位置。收购公告前，公司披露私募资本合计约 £94.5M，约合 $120M。因此，2026 年 7 月 Novartis 最高 $1.5B
              的交易，对一家资产仍在临床前的公司来说，意味着投入资本获得极高溢价。利益相关方图谱也有战略含义：科学创始人和英国转化机构播下种子，专业生命科学风投承担早期风险，Lilly
              作为战略投资方加入但未披露商业合作，Novartis 最终选择收购而非期权式合作。这一模式说明，平台价值更多来自载荷稀缺性和战略契合度，而不是传统的近期收入可见性。
