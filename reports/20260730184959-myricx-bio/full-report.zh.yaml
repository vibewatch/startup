      - number: '5.4'
        title: 信任、质量与转化控制面
        blocks:
          - type: paragraph
            body: >-
              Myricx
              仍处临床前，信任控制更多关乎科学质量、可重复性和可制造性，而不是商业合规徽章。公司的公开控制面包括反复会议披露、具名科学领导层，以及关于耐受性和治疗指数的明确主张。它还没有人体安全包、已上市产品质量体系或公开商业
              CMC 记录。这符合阶段，但也抬高了尽调负担。对这个平台来说，信任取决于临床前数据是否能跨模型站住，旁观者效应和巨噬细胞重编程主张是否能从孤立实验走向更广场景，以及连接子-载荷整合能否保留有用治疗窗口。关于
              ADC 耐药、连接子设计和载荷创新的公开文献，为强控制最终应证明什么提供背景。Myricx
              的比较优势在于，它似乎把一个新机制插入了被充分理解的形式；比较脆弱点在于，所有困难的转化工作仍在前方。因此，质量问题不是科学是否有趣，而是在可制造性和人体毒性审视下，科学是否还能保持自洽。
