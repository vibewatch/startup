        - 相对组合价值，交易日后显得便宜
      - - 基准
        - 平台有用，但定义不了品类
        - 作为战略期权价值，交易仍可接受
      - - 悲观
        - 载荷在安全性或差异化上失败
        - 临床前溢价显得过高
