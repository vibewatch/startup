      - number: '1.5'
        title: 里程碑、当前状态与概览层面风险
        blocks:
          - type: paragraph
            body: >-
              里程碑记录呈现出快速串联：科学验证、融资、领导层扩建和战略退出。Carr 2019 年加入、公司 2020 年正式启动之后，第一个重要验证点出现在 2023 年，Myricx 在 AACR 公布 NMTi-ADC
              数据，随后补充临床前数据，支持 NMTi 作为新型载荷类别。2023 年底，董事会和科学领导层得到增强；2024 年，公司为临床推进完成大额 Series A。2025 年，管理层披露已提名领先候选药物，预计
              2026 年提交 IND，并搭建更跨大西洋的组织足迹。2026 年 7 月收购公告带来很强的外部验证信号，但没有消除核心尽调担忧。Novartis 交易仍待监管批准，预计只能在 2026
              年下半年交割。更重要的是，Myricx 没有人体疗效或安全性数据，全部估值逻辑都压在一个前提上：NMT 抑制剂载荷在临床中能优于成熟的 Topo-1
              和微管蛋白载荷，同时不引入不可接受的毒性。放在公司概况层面，即便退出经济性很诱人，核心未解问题仍在这里。
