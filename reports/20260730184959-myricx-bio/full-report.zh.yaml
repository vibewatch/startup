      - number: '7.2'
        title: 监管和法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险是第二层关键风险。收购仍在等待完成，意味着交易时间和最终所有权仍取决于审批和惯常交割条件。即便双方都可信，这也带来不低的交易完成风险。产品层面，Myricx 还没有面对真正的监管压力测试；那会从
              IND 审查开始，并延续到人体首次安全性评估。更广泛的 FDA
              和生物科技监管框架表明，把一个新型生物平台从临床前证据推进到人体试验，需要远比新闻稿能呈现的更深文件负担。公开可见的法律界面也不完整。Companies House
              确认了备案表面，但公开法律材料不会揭示每一项可能影响战略退出的股东权利、留任安排或交易细节。现实是，科学叙事强，并不代表法律和监管工作消失了；它们只是没有科学那么显眼。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
      - number: '7.3'
        title: 运营、质量和制造风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Myricx 虽然还未进入临床，但已经暴露在 ADC 放大生产的常见风险下。linker 稳定性、payload 释放控制和制造可重复性都会影响治疗窗。公开综述和制造文章都强调，ADC 项目对化学、CMC
              和工艺稳健性极其敏感。这里尤其重要，因为 Myricx 的价值主张，是把一种新型 payload 移植到一种制造和暴露属性都必须严控的形式里。linker 行为或 CMC
              上一个小问题，就可能把有吸引力的生物学故事变成安全性或疗效失败。阶段也放大了运营风险：公司还没有公开的商业化制造记录，也没有穿越后期质量体系的历史。这应被视为高风险，但不是最高层级。它不是第一问题，因为人体证明更靠前；但一旦领先候选物推进到临床就绪，运营风险可能很快成为卡点。
            claimRefs:
              - CR015
              - CR016
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
          - type: table
            tableRef: TR003
            claimRefs:
