      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
    enumerationScope:
      coverage: partial
      basis: >-
        Includes the major public oncology and ADC strategic comparables most relevant to Myricx stage and modality, not
        an exhaustive database of every deal.
