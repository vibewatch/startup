      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              四个长期驱动因素支撑市场继续投入新 ADC 载荷。第一，全球癌症负担仍然很大，肿瘤预算因此更有韧性。第二，已获批 ADC
              的成功已经证明这一药物形式可以做出重磅产品。第三，持续存在的毒性和耐药问题给更好载荷留下空间。第四，交易市场已经表明，差异化载荷科学可以在商业化很久之前被买走。这些驱动与 Myricx
              的故事高度一致。与此同时，采用约束同样重要。当前市场经济性大多来自已验证、后期或已获批资产，而 Myricx
              没有人体数据。主流载荷类别已经拥有制造熟悉度、医生舒适度和监管先例。大型药企买方可以对新机制兴奋，同时仍要求异常强的临床前证据，才会围绕未验证机制授权或搭建项目。实际含义是，Myricx
              所处市场在战略上渴望创新，但在临床转化执行上很保守。
