              Myricx 处在临床前，常规单位经济指标大多不可得：未披露 ARR，没有产品毛利率，没有客户获客成本（CAC），也没有按合同实现的定价。即便如此，成本结构在高层面仍然看得清。Myricx
              一直在为发现生物学、临床前研究、ADC 工艺开发、领导层扩建和 IND 申报支持工作准备花钱。2025 年 9 月横跨
              CMC、医学、监管和临床运营职能的招聘潮，说明在任何人体证据出现之前，固定运营成本已经上台阶。这对接近首次人体试验的生物技术公司很典型，但也意味着资本充足性比当前货币化更重要。2024 年大额 Series A
              和随后 2026 年收购公告，说明 Myricx
              成功为这次过渡筹到资金；但公开来源没有揭示烧钱速度、月度现金跑道或现金余额。因此，本章任何单位经济模型推演都必须保持定性，并清楚区分已观察事实和仍是尽调缺口的内容。
