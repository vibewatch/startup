              收购说明成熟买方相信这种稀缺性真实存在。但公司暴露的地方，也正是既有玩家最强的地方：人体数据、靶点特异临床先例和组织规模。Pacylex 缩窄了 NMT 生物学的新颖性溢价。Enhertu 和 Kadcyla
              主导 HER2 参照点。Ifinatamab deruxtecan 和 GSK 压缩了 B7-H3 差异化时间表。BioNTech 和 DualityBio
              证明，资本充足的进入者可以通过合作迅速拼出组合。净结果是，Myricx
