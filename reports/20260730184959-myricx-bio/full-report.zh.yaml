  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值框架和核心建议
        blocks:
          - type: paragraph
            body: >-
              Myricx 公告估值应被理解为战略交易价格，而不是由当前运营指标支撑的公允价值标记。公司已披露私募融资约 $120M，并同意以最高 $1.5B 出售，其中 $1.1B
              为首付款。对一家临床前生物科技公司来说，这个结果相当突出，也应立刻让分析师放下普通收入或 EBITDA 框架。正确问题不是 Myricx
              相对当前基本面是否便宜；按传统指标看，它显然不便宜。正确问题是：在人体首次证明之前，战略买家是否有理由为稀缺 payload
              技术支付溢价，因为等待可能意味着失去平台准入。在这个框架下，估值可以说偏紧，但在战略上讲得通。它定价的是选择权、可迁移性和未来组合杠杆，而不是已证明现金流。因此，建议应更有层次：战略变现结果亮眼，若交易交割，价格兑现的信心很高；但如果没有战略控制买家，同一价格能否推广到普通投资者，信心只属中等。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV034
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV034
      - number: '8.2'
        title: 为什么价格能辩护，也为什么显得过高
        blocks:
          - type: paragraph
            body: >-
              支持估值的论点很强。ADC 市场快速增长，payload 集中度制造了正交机制的稀缺性，大型药企也已经证明愿意为肿瘤平台重金买单。Novartis 显然相信 Myricx 的 NMTi payload
              可能跨越不止一个靶点，甚至跨越不止一代资产发挥作用。反向论点同样强。Myricx 没有人体数据、没有产品收入、没有普通商业客户群，也没有公开证据证明其 payload
              能以临床上有意义的方式跨多个构建物移植。Fusion、ImmunoGen 和 Seagen 等可比交易都包含不同的阶段组合，有些还涉及已获批产品或更成熟管线。因此，按阶段调整后，Myricx
              的价格并不便宜。公平的总结是：这笔交易体现的是临床验证前支付的大额平台溢价。对战略收购方来说，这种溢价可以理性；但作为纯财务投资者标记，会显得激进。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: 可比交易，以及它们为什么只能部分锚定 Myricx
        blocks:
          - type: paragraph
            body: >-
              可比交易更适合框定方向，而不是给出精确答案。Pfizer-Seagen 和 AbbVie-ImmunoGen 展示了已验证 ADC 产品组合和后期资产能拿到什么价格。AstraZeneca-Fusion
              展示了买方对经典 ADC 之外差异化肿瘤技术的胃口。Gilead-Tubulis 是最有意思的方向性参照，因为它说明买家可能为下一代 ADC
              平台和临床前选择权支付大额资金，尽管交易结构和阶段组合不同。Nature 和分析师基准来源也都强化了一点：十亿美元级肿瘤押注越来越集中在稀缺使能技术上，而不只围绕已获批产品。但这些类比都有边界。Myricx
              结合了临床前阶段、payload 新颖性和战略收购时点，很难塞进常规可比倍数框架。因此，可比交易的正确用法，是证明战略买家在肿瘤平台竞赛中有先例愿意付高价，同时保留 Myricx 仍处在该区间高风险端这一点。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
          - type: table
            tableRef: TV004
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
      - number: '8.4'
        title: 牛市、基准和熊市情景
        blocks:
          - type: paragraph
            body: >-
              情景框架比单一、确定性的公允价值更诚实。牛市情景下，Myricx 的 NMTi payload 在人体中展现差异化安全性或疗效，验证其可跨多个靶点场景移植，并支撑 Novartis
              内部数十亿美元级的组合逻辑。那时，公告价格最终可能显得有先见，而不是昂贵。基准情景下，平台有意思但没有打破品类；收购仍然说得过去，因为 Novartis
              拿到了选择权、人才和稀缺机制的先发准入。熊市情景下，人体首次数据在安全性或差异化上失败，临床前溢价就显得过高。没有公开运营现金流来锚定估值，情景区间几乎完全由生物学和组合杠杆驱动。因此，这笔交易的估值姿态应描述为偏紧但可辩护，而不是保守或明显定错价。
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
          - type: table
            tableRef: TV003
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV005
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV032
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV022
