              - CR030
      - number: '7.4'
        title: 合作伙伴、依赖和人员风险
        blocks:
          - type: paragraph
            body: >-
              Myricx 还背着实质性的依赖风险。Pacylex 可能降低 NMT 生物学的新颖性，并有机会在 Myricx 之前立下小分子人体基准。在靶点空间里，ifinatamab deruxtecan 和其他
              B7-H3 项目可能在 Myricx 进临床前先设定疗效预期。内部看，技术诀窍集中度仍然重要。Robin Carr 和 Ed Tate 承载了平台相当一部分隐性技术逻辑；而 2025
              年之后的领导团队，作为一个整合运营单元仍相对年轻。Novartis
              交易最终可能降低融资风险，但如果关键科学家或运营人员在过渡期离开，也可能制造整合和留任风险。这些风险不如人体首次生物学那么根本，但高度相关，因为它们会压缩平台证明自己的窗口。因此，执行层面应按高风险处理，结构韧性层面按中高风险处理。
            claimRefs:
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
          - type: table
            tableRef: TR004
            claimRefs:
