chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源与经营逻辑
        blocks:
          - type: paragraph
            body: >-
              Myricx Pharma Ltd 以 Myricx Bio 名义运营，是一家英国肿瘤生物技术公司，2020 年 11 月成立，总部位于伦敦 King's Cross 生物技术集群。公司由 Imperial
              College London 和 Francis Crick Institute 孵化，基础研究显示 N-肉豆蔻酰基转移酶（NMT）是可成药的癌症脆弱点。Myricx 最初围绕新型小分子 NMT 抑制剂起步，但到
              2023 年已把平台重心转向 ADC 载荷，并主张 NMT 抑制剂载荷可以解决当下临床 ADC 三大主流载荷类别在疗效、耐受性和耐药上的天花板。截至 2026 年 7
              月报告日，公司仍处临床前阶段，没有披露人体临床数据，没有产生收入的产品，商业模式围绕临床前发现、融资和战略退出。Novartis 随后宣布以 $1.1B 首付款加最高 $400M 里程碑款收购
              Myricx，这一策略达到高点，也凸显大型药企在首次人体试验验证前就愿意重押差异化 ADC 载荷创新。
