            body: >-
              Myricx 进入市场的时点有利：载荷差异化比以往更重要。Topo-1
              载荷的主导地位建立了商业证明，也带来拥挤和全类别再治疗受限的风险。关于耐药机制、减量和治疗中断的公开讨论，支撑了管理层的说法——正交载荷类别存在战略窗口。不过，市场不会永远只奖励新颖性。Novartis
              交易之所以显得丰厚，正是因为它在人体数据之前为未来可选性定价。如果早期临床结果后来不能显示清晰的疗效或耐受性优势，同一市场结构也可能反过来压制平台，因为买方已经有很多替代 ADC 项目可押注。因此，市场现在给了
              Myricx 很强的战略相关性窗口，但这种相关性高度取决于 NMT 抑制能否不只是一段有趣的临床前故事。
