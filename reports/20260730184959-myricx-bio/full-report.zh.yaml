  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 阶段 / 资产组合
      - 公开价值信号
      - 对 Myricx 的含义
    rows:
      - - Pfizer / Seagen
        - 已验证的 ADC 业务和管线
        - $43B 收购
        - 成熟 ADC 规模的上限参照，不是直接阶段可比
      - - AbbVie / ImmunoGen
        - 已获批产品加 ADC 管线
        - $10.1B 收购
        - 显示后期 ADC 资产可拿到很高战略价值
      - - AstraZeneca / Fusion
        - 差异化肿瘤技术平台
        - $2.4B 收购
        - 支撑买方愿意为稀缺使能技术付费
      - - Gilead / Tubulis
        - 下一代 ADC 平台加历史期权安排
        - 2026 年资料显示战略价值达数十亿美元
        - 最接近的方向性证据：平台稀缺可以很贵
      - - Myricx / Novartis
        - 临床前 NMTi 载荷平台
        - $1.5B 总对价 / $1.1B 首付款
        - 相对阶段偏贵，但并非没有战略先例
    notes: 可比对象只能作方向参考，不应压成一个混合倍数，因为阶段和资产成熟度差异很大。
