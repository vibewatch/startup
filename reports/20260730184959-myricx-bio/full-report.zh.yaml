              - CV024
              - CV025
              - CV026
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV037
              - CV040
      - number: '8.5'
        title: 什么会改变估值判断
        blocks:
          - type: paragraph
            body: >-
              几项尽调问题会实质性收窄估值判断。第一，Novartis 为什么相信 payload 能跨靶点泛化，需要构建物层面的解释；这会澄清平台溢价是否由广度支撑。第二，Myricx 与竞争 payload
              选项的详细比较，会显示买家到底为真实稀缺性付费，还是在不确定性下为选择权付费。第三，交易结构备忘录可以揭示名义价值中有多少经济上稳固，又有多少后置到里程碑或留任。第四，支持 IND
              的资料包和早期临床计划，有助于区分带有纪律性风险管理的平台溢价，和主要由竞争恐惧驱动的溢价。这些问题重要，是因为 Myricx
              已经按稀缺战略资产定价。一家公司过了这条线之后，尽调就不该只问故事是否令人兴奋，而要问溢价是否由持久技术杠杆支撑，而不是一次性竞价时点。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV006
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV033
      - number: '8.6'
        title: 最终估值结论
        blocks:
          - type: paragraph
            body: >-
              最终估值结论是，Myricx 应被标记为战略上昂贵，但并非明显不理性。相对阶段而言，价格偏高，因为没有人体证明、没有收入基础，也没有常规倍数可支撑。但多笔大型肿瘤交易、快速升温的 ADC
              交易活动，以及具备强大资产负债表能力的战略买家，都让这份溢价可以理解——前提是管理层相信 NMTi payload
              能成为可复用的组合优势。就此而言，估值不是在评判今天的基本面，而是在战略控制下押注明天的选择权价值。对财务投资者来说，这意味着谨慎：这是一笔出色退出，但不是干净证据，不能说明临床前 payload
              平台普遍都配得上同样估值。对战略买家来说，它提示下一代 ADC 技术的稀缺性可以证明提前买单合理。这种张力正是估值姿态仍然偏紧的原因。
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 战略溢价比基本面更能解释价格
            body: 这笔交易定价的更多是未来组合选择权和对稀缺 payload 技术的控制，而不是当前运营表现。
            calloutType: insight
            claimRefs:
              - CV003
              - CV005
              - CV034
          - type: callout
            title: 这个价格不是所有临床前 payload 平台的普遍市场出清价
            body: 没有战略控制买家，同一平台未必能拿到同样估值。
            calloutType: risk
            claimRefs:
              - CV006
              - CV013
              - CV040
          - type: callout
            title: 估值姿态：偏紧但可辩护
            body: 相对阶段，价格显得贵；但可比肿瘤交易和买方稀缺性逻辑，使它不至于看起来不理性。
            calloutType: recommendation
            claimRefs:
              - CV014
              - CV021
