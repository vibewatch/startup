        - 严重下行
      - - 没有疗效差异化
        - 削弱其相对在位载荷享有溢价的理由
        - 严重下行
      - - 无法跨靶点移植
        - 平台收缩成狭窄单资产故事
        - 重大下行
      - - 交易交割失败
