        blocks:
          - type: paragraph
            body: >-
              最重要的风险很简单：Myricx
              没有人体疗效或安全性数据。支撑平台的每一项公开主张仍依赖临床前模型。这里的分量比不少生物科技故事更重，因为公司的差异化价值来自一种宽泛的生物学机制，而不是一条已被狭窄验证的通路。NMT
              抑制在肿瘤中可能威力很强，但进入患者后也可能带来意想不到的毒性，尤其是 ADC 形式如果无法把暴露足够紧地限制住。公开 ADC 文献也反复提示：耐药、payload 行为、linker
              释放和毒性，常常决定原本很有吸引力项目的命运。高额公告收购价抹不掉这种风险；反而凸显 Novartis
              在核心问题尚未回答前已经支付了多少价值。按风险排序，缺乏人体证明和新机制毒性应被视为关键风险，而不只是高风险。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
