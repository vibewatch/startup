      - number: '1.2'
        title: 创始人、科学根基与平台逻辑
        blocks:
          - type: paragraph
            body: >-
              以这一阶段衡量，Myricx 的科学根基很强。公司由 Imperial College London 的 Ed Tate 教授与 Roberto Solari、Andrew Bell 共同创立，Tate
              继续担任创始人、科学顾问委员会主席，也是平台的核心科学面孔。早期支持来自 Cancer Research UK，以及创始投资方 Sofinnova Partners 和 Brandon Capital，帮助
              NMT 抑制的学术成果走向商业化。平台逻辑是，NMT 会修饰 100 多种帮助癌细胞存活的蛋白，选择性抑制可以同时打断多条支撑癌细胞的通路。Myricx 现在把这套生物学定位为差异化 ADC
              载荷引擎，而不只是一个小分子项目。已披露的领先构建物包括以 MYX2449 为核心、靶向 HER2 的 NMTi-ADC 项目，以及面向已对拓扑异构酶 I 载荷产生耐药的实体瘤、靶向 B7-H3 的项目。AACR
              2023 以及后续 2023 数据包中的公开临床前披露，强调完全且持久的肿瘤退缩、旁观者活性，以及通过未折叠蛋白反应压力和巨噬细胞重编程形成的机制差异，而不是传统微管蛋白或 Topo-1 载荷作用。
