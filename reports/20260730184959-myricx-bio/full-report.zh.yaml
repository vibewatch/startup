  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争图谱：直接对手、既有巨头、相邻平台与替代方案
        blocks:
          - type: paragraph
            body: >-
              Myricx 周围的竞争格局是分层的，不是平面的。最直接的同业是 Pacylex，它同样围绕 N-肉豆蔻酰基转移酶抑制展开，并且已经把 zelenirstat 推入临床，同时也与 Heidelberg
              Pharma 讨论 NMTi-ADC 载荷工作。Pacylex 是最接近的科学参照，因为它测试同一个酶靶点，尽管先走的是小分子路线，还没有完全证明 ADC 载荷逻辑。第二层是已经拥有验证商业足迹的 ADC
              既有玩家：HER2 领域的 Enhertu，以及由 ifinatamab deruxtecan 和 GSK 的 risvutatug rezetecan 领衔的多个 B7-H3 项目。第三层包括 BioNTech
              和 DualityBio 这类相邻平台竞争者，它们通过授权和交易搭建差异化 HER2 与 B7-H3 ADC 组合。最后，现状替代方案根本不是另一家创业公司，而是继续使用已经证明有效的
              Topo-1、微管蛋白或其他既有载荷类别。因此，Myricx 同时在两条战线上竞争：面对直接同业比科学新颖性，面对根深蒂固的既有玩家比组合相关性。
