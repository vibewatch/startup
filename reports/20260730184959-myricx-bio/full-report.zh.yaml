              可比生物技术交易有助于解释为什么 Myricx 的结果显得激进，而不是常规。AstraZeneca 收购 Fusion Pharmaceuticals、AbbVie 收购 ImmunoGen、Pfizer 收购
              Seagen，都说明大型药企会为肿瘤平台和 ADC 相邻资产支付高价。但这些先例不能和 Myricx 直接互换。Fusion 是放射性药物公司，模态不同；ImmunoGen 和 Seagen
              带来的是已获批产品或比 Myricx 更成熟的管线。可比交易更适合作为方向性参照：它们证明肿瘤战略稀缺性可以支撑大额估值，但考虑到 Myricx
              仍处临床前，其公告价格依然异常丰厚。因此，这笔收购应被理解为平台稀缺性押注，而不是收入或 EBITDA
              的标准倍数。由于没有披露收入基数可作分母，公开层面无法计算传统运营倍数。正确比较对象是投入资本和战略收购价值，并明确承认阶段调整。
