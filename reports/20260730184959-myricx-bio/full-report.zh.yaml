  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 公司尚未商业化时，谁算客户
        blocks:
          - type: paragraph
            body: >-
              Myricx
              仍处临床前，客户章节不能像软件公司或商业化生物制药公司那样写成客户名录。公开材料没有披露付费医院系统、处方医生或产品用户。真正的当前经济客户，是在产品上市前就看重平台的战略性生物制药买方。最强证据就是
              Novartis 同意收购公司，这实际上把外部客户兴趣转化为所有权。第二类接近客户验证的群体，是 Eli Lilly 等战略投资方；它们参与 Series
              A，即便没有披露商业授权交易，也释放了市场兴趣。下游的最终用户和受益者，会在 Myricx 的载荷通过 Novartis
              或其他合作路径进入临床之后，才变成肿瘤医生、研究者和患者。因此，本章把客户分析当作分阶段链条：今天是战略买方，明天是试验生态，获批之后才是接受治疗的患者。这是唯一符合公司实际阶段的框架。
