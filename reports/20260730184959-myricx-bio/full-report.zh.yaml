            body: >-
              Pacylex 是最重要的直接参照，因为它在 Myricx 之外也验证了投资人和买方对 NMT 生物学的兴趣。Pacylex 的领先项目 zelenirstat 是一种口服 NMT
              抑制剂，已进入血液系统恶性肿瘤临床测试；公司也强调了与 Heidelberg Pharma 围绕 ADC 载荷应用的合作。相较 Myricx，这给 Pacylex 两个优势。第一，即便模态不是
              ADC，它也能更早产出 NMT 抑制的人体安全性和活性数据。第二，它可以主张自己也有通往 NMTi 载荷叙事的路径，而不是把赛道让给 Myricx。同时，模态差异很重要。口服小分子 NMT
              抑制和抗体导向载荷并不能互换，所以 Pacylex 不会自动推翻 Myricx 的逻辑。相反，Pacylex 一方面降低了酶靶点层面的新颖性溢价，另一方面也可能提高市场对 NMT
              本身具有临床兴趣的信心。尽调上，Pacylex 既是威胁，也是部分品类验证者。
