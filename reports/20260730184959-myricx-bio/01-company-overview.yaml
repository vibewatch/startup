- id: milestones-status-risks
  title: Milestones, Current Status, and Overview-Level Risks
  body: The milestone record shows a rapid sequence of scientific validation, financing, leadership expansion, and strategic exit. After Carr joined in 2019 and the company formally launched in 2020, the first major proof point came in 2023 when Myricx unveiled NMTi-ADC data at AACR and later added follow-on preclinical data supporting NMTi as a novel payload class. In late 2023 the board and scientific leadership were strengthened, and in 2024 the company raised a large Series A for clinical advancement. In 2025 management disclosed lead-candidate nomination, an expected 2026 IND timeline, and a more transatlantic organizational footprint. The headline July 2026 acquisition announcement created a strong external validation signal, but it does not remove core diligence concerns. The Novartis transaction is still pending regulatory approvals and expected to close only in the second half of 2026. More importantly, Myricx has no human efficacy or safety data, and the entire valuation logic
    depends on the premise that an NMT inhibitor payload can outperform established Topo-1 and tubulin payloads in the clinic without introducing unacceptable toxicity. At company-overview level, this remains the central unresolved issue despite the attractive exit economics.
