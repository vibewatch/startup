company:
  name: Myricx Bio
chapter:
  number: 1
  title: Company Overview
  summary: Myricx Bio is a London-founded oncology biotech developing first-in-class N-myristoyltransferase inhibitor payloads for antibody-drug conjugates. The company progressed from a 2020 £4.5 million seed to a £90 million Series A in 2024, expanded its leadership bench in 2025, and agreed in July 2026 to be acquired by Novartis for up to $1.5 billion while still in late preclinical development.
sections:
- id: identity-origin
  title: Identity, Origins, and Operating Thesis
  body: Myricx Pharma Ltd, trading as Myricx Bio, is a UK oncology biotechnology company founded in November 2020 and headquartered in London’s King’s Cross biotech cluster. The company was spun out from Imperial College London and the Francis Crick Institute around research showing that N-myristoyltransferase, or NMT, is a targetable cancer vulnerability. Myricx originally launched around novel NMT inhibitors as small molecules, but by 2023 had repositioned the platform around antibody-drug conjugate payloads, arguing that an NMT inhibitor payload can solve the efficacy, tolerability, and resistance limits of the three payload classes that dominate clinical ADCs today. As of the July 2026 run date, the company remains preclinical, with no disclosed human clinical data, no revenue-generating products, and a business model centered on preclinical discovery, capital formation, and strategic exit. That strategy culminated in Novartis announcing an agreement to acquire Myricx for $1.1 billion
    upfront plus up to $400 million in milestones, highlighting how strongly large pharma values differentiated ADC payload innovation even before first-in-human validation.
