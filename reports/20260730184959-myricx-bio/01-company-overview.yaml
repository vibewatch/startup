- id: founders-science
  title: Founders, Scientific Roots, and Platform Logic
  body: The company’s scientific roots are unusually strong for a startup at this stage. Myricx was founded by Professor Ed Tate of Imperial College London together with Roberto Solari and Andrew Bell, with Tate continuing as founder, scientific advisory board chair, and a core scientific face of the platform. Early support came from Cancer Research UK and from founding investors Sofinnova Partners and Brandon Capital, which helped commercialize academic work on NMT inhibition. The platform thesis is that NMT modifies more than one hundred proteins that help cancer cells survive, and that selective inhibition can collapse several cancer-support pathways simultaneously. Myricx now positions this biology as a differentiated ADC payload engine rather than merely a small-molecule program. The lead disclosed constructs include a HER2-targeting NMTi-ADC program centered on MYX2449 and a B7-H3-targeting program intended for solid tumors that have become resistant to topoisomerase-I payloads. Public
    preclinical disclosures from AACR 2023 and subsequent 2023 data packages emphasized complete and durable regressions, bystander activity, and mechanistic differentiation through unfolded-protein-response stress and macrophage reprogramming rather than conventional tubulin or Topo-1 payload action.
  claimRefs:
  - CO009
  - CO010
  - CO011
