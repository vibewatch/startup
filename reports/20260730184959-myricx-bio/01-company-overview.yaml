- id: capital-stakeholders
  title: Funding History, Stakeholders, and Capital Narrative
  body: 'Funding progression has been steep relative to the company’s preclinical status. Myricx launched with a £4.5 million seed in November 2020 led by Sofinnova Partners and Brandon Capital. In July 2024 it raised a £90 million Series A, or roughly $114 million, led by Novo Holdings and Abingworth with participation from British Patient Capital, Cancer Research Horizons, Eli Lilly and Company, Brandon Capital, and Sofinnova Partners. That round repositioned the company from academically promising platform to well-capitalized next-generation ADC contender. Total disclosed private capital before the acquisition announcement was roughly £94.5 million, or about $120 million. The July 2026 Novartis transaction of up to $1.5 billion therefore implies a very large markup on invested capital for a company whose assets remain preclinical. The stakeholder map is also strategically informative: scientific founders and UK translational institutions seeded the company, specialist life-science venture
    firms underwrote early risk, Lilly joined as a strategic investor without a disclosed commercial partnership, and Novartis ultimately chose acquisition rather than option-based collaboration. That pattern is consistent with a platform valued more for payload scarcity and strategic fit than for conventional near-term revenue visibility.'
