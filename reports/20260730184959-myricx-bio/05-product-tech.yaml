  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: payload-portability
    missingEvidence: Head-to-head data across multiple antibodies and linker formats showing that NMTi payload activity and tolerability hold outside disclosed exemplar constructs.
    whyItMatters: Portability is central to the platform thesis; without it, Myricx may be closer to a narrow asset story than a reusable payload engine.
    diligencePath: Request construct-by-construct comparability data across linker chemistries, target antigens, and toxicology packages.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: first-in-human-window
    missingEvidence: IND-enabling tox package and first-in-human starting-dose rationale for the lead construct.
    whyItMatters: Therapeutic index is the primary gating variable between elegant preclinical biology and clinical failure.
    diligencePath: Request full GLP tox, safety pharmacology, and exposure-response package for the lead candidate.
    relatedQuestionRefs:
    - QE019
    - QE023
