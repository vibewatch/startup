  - TE004
  figureRefs:
  - FE004
- id: roadmap
  title: Roadmap, Dependencies, and Technology Verdict
  body: 'The roadmap described publicly is straightforward: nominate a lead candidate, complete IND-enabling work, and enter the clinic. Myricx said in 2025 that a lead development candidate had been nominated and that an IND filing was expected in 2026. From a product-tech angle, the critical dependencies are scientific translation, CMC readiness, and retention of the specialized know-how concentrated in leaders such as Robin Carr and Ed Tate. The platform’s upside is that if one NMTi payload construct works clinically, the chemistry could travel across multiple antibody targets. The downside is equally concentrated: if early clinical data fail on safety or efficacy, much of the payload-platform thesis could collapse at once. The right product verdict is therefore not that Myricx already has a proven product suite, but that it has a scientifically differentiated preclinical payload architecture with plausible portability and unusually strong strategic buyer interest. That is enough to justify
    serious diligence, but not enough to skip the hard questions about linker behavior, target transferability, and first-in-human therapeutic index.'
  claimRefs:
