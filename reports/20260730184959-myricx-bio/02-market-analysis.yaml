chapter:
  number: 2
  title: Market Analysis
  summary: 'Myricx sits inside the fastest-growing part of oncology therapeutics: antibody-drug conjugates. The market is already multibillion-dollar, but most commercial value still depends on only a few payload classes, creating a real strategic opening for differentiated mechanisms such as NMT inhibition if they can solve resistance and tolerability constraints.'
sections:
- id: market-boundary
  title: Market Boundary and Why Myricx Plays a Narrower Slice Than Generic ADC TAM
  body: 'The relevant market for Myricx is not the entire oncology drug market and not even the full antibody-drug conjugate market in its broadest form. The narrowest practical boundary is the subset of oncology programs and buyers searching for next-generation ADC payloads that can improve efficacy or tolerability after topoisomerase-I or tubulin payload experience. That makes Myricx primarily a platform and licensing asset inside the ADC innovation supply chain rather than a near-term seller to hospitals or payers. Public market reports place the overall ADC market in the mid-teens of billions of dollars in 2025 and roughly $20 billion in 2026, with continued rapid growth through the early 2030s. But those top-down figures bundle approved products, clinically validated targets, manufacturing infrastructure, and commercial oncology sales that Myricx does not yet possess. For diligence purposes, the broader ADC market matters because it demonstrates strategic budget availability and M&A
    appetite, while the narrower next-generation-payload market matters because it defines who the real buyer is today: large biopharma organizations willing to pay for differentiated mechanisms before first commercial launch.'
