  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: myricx-specific-sam-som
    missingEvidence: A buyer-level bottoms-up model showing how many realistic strategic acquirers or licensors would pay for an NMTi payload platform and at what stage-gated values.
    whyItMatters: Without a constrained SAM/SOM, broad ADC market size can overstate what is actually monetizable by Myricx today.
    diligencePath: Request management’s target-account list, comparable deal framework, and stage-gated scenario model for partnering versus acquisition.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: minor
    topic: payload-share-precision
    missingEvidence: An openly accessible primary market source that precisely quantifies 2025 Topo-1 payload share using the same market definition across analysts.
    whyItMatters: Public commentary agrees on concentration but not on one canonical percentage, so the analysis uses ranges and direction rather than over-precision.
    diligencePath: Request analyst deck extracts or a licensed database view that normalizes payload share across marketed ADCs.
    relatedQuestionRefs:
    - QM016
