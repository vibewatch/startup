- id: market-size
  title: 'Sizing Lenses: Rapid ADC Growth, Concentrated Payload Economics, and Buyer Capacity'
  body: Multiple external market lenses support the view that ADCs are an expanding and strategically important market, even if absolute estimates vary by methodology. Mordor Intelligence frames the global ADC market at $15.61 billion in 2025, $20.12 billion in 2026, and $71.55 billion by 2031. Other analysts land in a similar range, with The Business Research Company, Grand View Research, and other industry trackers all describing sharp double-digit growth. Importantly, this is not just a large market; it is also a concentrated one. Commercial value is dominated by a few approved assets, especially Enhertu, and by a few payload classes, especially topoisomerase-I payloads. That concentration matters because it creates both a benchmark and a vulnerability. If most revenue is concentrated in one mechanism family, then any credible alternative payload class can command outsize strategic value relative to its stage, which helps explain Novartis’s willingness to buy Myricx preclinically. The
    relevant takeaway is therefore less about picking one TAM number and more about recognizing that the buyer side of the market has real budget, demonstrated appetite for ADC assets, and a clear incentive to secure differentiated payloads before competitors do.
