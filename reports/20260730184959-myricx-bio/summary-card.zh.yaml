  topStrengths:
    - NMTi payload 逻辑具备 first-in-class 属性，科学源头可信，作用机制也区别于既有 ADC payload 类别。
    - 首次人体试验前就获得 Novartis 大额战略验证，说明下一代 ADC payload 确有稀缺价值。
    - 2025 年管理层升级，目标转向 IND 准备、CMC 和战略执行，项目不再停留在纯学术发现阶段。
  topRisks:
    - 全部资产仍处于临床前阶段，平台还没有人体有效性和安全性验证。
    - NMT 机制覆盖面广，即便临床前数据好看，首次人体试验仍可能暴露毒性或治疗窗问题。
    - Novartis 交易虽已宣布但尚未交割；若交易未完成，公司许多运营细节仍不透明。
  unresolvedGaps:
    - Lead construct 完整 IND-enabling 毒理、linker 行为和首次人体起始剂量资料。
    - 交割前公司独立现金、烧钱速度、股权结构表以及债务 / 义务明细。
    - 证明 NMTi payload 可在多个重要抗体场景迁移的 construct 级证据。
