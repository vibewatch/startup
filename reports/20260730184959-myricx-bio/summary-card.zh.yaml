summary:
  headline: Myricx Bio 的 ADC payload 平台在科学上有差异化，但仍是成败分明的临床前资产；Novartis 宣布的 $1.5B 退出更能证明战略稀缺性，而不是临床确定性，值得跟踪，但不能按已去风险资产看待。
