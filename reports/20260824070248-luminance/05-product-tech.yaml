  - FE004
- id: architecture-and-operating-model
  title: Architecture, data, and operating model
  body: 'Public sources give a coherent but still partial architecture story. The AI technology page says Luminance uses a multi-model approach that mixes proprietary systems, fine-tuned open-source models, embedding models, reasoning models, and commercial models. The company calls this a “Panel of Judges”, where multiple models check each other and an orchestration layer acts as a final validator. Official pages also emphasize agentic AI, parallel workflow execution, and legal-specific validation, while the white paper says the system has been informed by 150+ million verified legal documents and built from inception for law. The Compete366 case study adds useful operational detail that the company already had proprietary AI delivered as a SaaS offering on AWS, then experimented with GPT-4 and later worked on Azure OpenAI adoption and optimization for generative extensions such as chat. Put together, the best public read is that Luminance is not a single-model wrapper. It appears to be
    an orchestration layer sitting above proprietary legal models, external model services, contract data, workflow logic, and enterprise interfaces. What remains missing is the engineering detail that would let investors audit latency, benchmark methodology, fallback behavior, or error rates by task. The same gap applies to developer-facing evidence: there is no strong public API or engineering surface in the retained materials.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE029
