    - No public proof of enterprise-scale matter throughput
  - - Collaborate
    - Legal front door, business requesters, legal ops
    - Publicly marketed / workflow layer
    - Ticketing, routing, contract requests, signature requests
    - No public schema or integration map for workflow orchestration
