company:
  name: Luminance
chapter:
  number: 5
  title: Product & Technology
  summary: 'Luminance’s product surface is unusually broad for legal AI: it now markets modules for drafting, negotiation, analysis, compliance, investigations, and collaboration on top of a legal-specific multi-model architecture. The technology story is differentiated and plausible, especially around legal data and orchestration, but public evidence is still stronger on workflow breadth and security posture than on reproducible benchmarks, performance metrics, or detailed architecture disclosures.'
sections:
- id: product-surface-and-user-jobs
  title: Product surface and user workflow
  body: 'Luminance now presents as a full contract-operating platform rather than a single review tool. The official product surface is segmented into Draft, Negotiate, Analyze, Comply, Investigate, and Collaborate, which together cover contract creation, redlining, repository analysis, regulatory checking, investigation workflows, and business-routing around legal. The video overview and resources hub reinforce the same lifecycle framing: Luminance claims to automate and augment every contract touchpoint from first-pass review through chatbot-led Q&A, redrafting, and repository intelligence. That breadth matters because the modules map to distinct user jobs and budgets. Draft and Collaborate reduce legal bottlenecks for business users; Negotiate and Analyze target legal, procurement, and commercial teams; Comply expands into regulatory and risk operations; and Investigate pulls the platform toward disputes, DSARs, and early case assessment. The underwriting implication is that Luminance
    is no longer just a diligence or redlining tool. It is trying to become a system for legal-grade contract intelligence across multiple functions, which can deepen stickiness if the product layers actually work together in production.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
