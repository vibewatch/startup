  - FE001
  - FE003
- id: deployment-trust-and-product-risks
  title: Deployment, trust controls, and product risks
  body: 'Luminance’s trust posture is one of the strongest parts of its public product case. The security page states ISO 27001 and SOC 2 certifications, AWS hosting, and deployment flexibility either in a virtual cloud environment or the customer’s own environment. It also highlights a security advisory board populated by senior cyber and intelligence figures. Product pages add workflow-level controls: compliance checks can run against sanction lists and media exposure; negotiation can use prior language, templates, and playbooks; analysis can trigger obligation alerts and anomaly detection; and investigation workflows can detect and redact PII. The partner page also suggests an implementation ecosystem for readiness assessment, adoption management, and integration support, which matters because product breadth raises rollout complexity. Even so, there are meaningful public gaps. Retained surfaces do not expose a public status page, detailed uptime history, benchmark packets, model-evaluation
    methodology, certificate scope documents, or a public developer/API program comparable to horizontal software leaders. The careers page works only as a weak practitioner proxy that the company continues to hire and invest in product talent. That leaves a balanced conclusion: the control story is credible, but the verification depth remains thinner than the marketing depth. Investors should therefore request private trust-center materials, implementation references, and task-level quality metrics before treating product maturity as fully underwritten. Public evidence alone should not substitute for implementation diligence thoroughly.'
