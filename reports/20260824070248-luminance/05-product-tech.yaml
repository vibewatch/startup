  title: Product architecture map
  type: stack
  layout: wide
  summary: Publicly visible Luminance architecture layers workflow modules over a multi-model legal AI core, contract data, cloud deployment, and trust controls.
  approximationNotes: This stack is synthesized from retained official and partner materials; it does not claim undisclosed internal services or benchmarked performance characteristics.
  data:
    layers:
    - id: workflow
      label: Workflow module layer
      detail: Draft, Negotiate, Analyze, Comply, Investigate, and Collaborate provide the visible user-facing operating surface.
    - id: assistants
      label: Agentic / assistant layer
      detail: Ask Lumi, Ask Lumi Pro, Deep Insights, auto-markup, and auto-negotiate features sit between user workflows and the model layer.
    - id: orchestration
      label: Panel of Judges orchestration
      detail: Multiple selected models check one another and are validated by an orchestration layer acting as a final judge.
    - id: model
      label: Model layer
      detail: Proprietary legal AI works alongside fine-tuned open-source, embedding, reasoning, and commercial models.
    - id: data
      label: Legal data and benchmark layer
      detail: 150+ million or hundreds of millions of verified legal documents plus law-firm validation history inform the system.
    - id: deployment
      label: Deployment substrate
      detail: AWS hosting, customer-environment deployment options, and Azure OpenAI optimization work support delivery.
    - id: trust
      label: Trust and control layer
      detail: ISO 27001, SOC 2, security oversight, sanctions checks, PII redaction, and workflow escalations support enterprise use.
