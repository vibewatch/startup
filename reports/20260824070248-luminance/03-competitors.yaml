    - In-house legal and business teams
    - Workflow, negotiation, repository, analytics, e-signature
    - Opaque / demo-led
    - AI-native contracting narrative with collaboration features
    - Public scale signals are lighter than top incumbents
  - - Harvey
    - Adjacent legal-work platform
    - 2,400+ legal organizations; 200,000+ professionals; 70+ countries
    - Law firms and in-house legal teams
    - Broad legal work platform, drafting, analysis, agentic workflows
    - Opaque / enterprise-led
    - Strong legal adoption momentum and brand
    - Less obviously centered on end-to-end contract repository operations
  - - Thomson Reuters CoCounsel
    - Adjacent incumbent
    - Built on Westlaw and Practical Law authority; enterprise legal distribution
    - Law firms and legal departments
    - Research, drafting, matter reasoning, tabular analysis
    - Opaque / premium
    - Authoritative legal content and reasoning stack
    - Not a full contract-lifecycle operating system
  - - LexisNexis Protégé
    - Adjacent incumbent
    - Embedded across Lexis products and business intelligence tools
    - Law firms, in-house, compliance, business professionals
    - AI assistant across research, drafting, spend, compliance, court data
    - Opaque / platform-led
    - Content, workflow, and dataset distribution across many legal products
    - Contract workflow depth is less explicit than CLM-native rivals
  - - Litera Kira
    - Specialist review tool
    - 1,400+ pre-built smart fields on retained page
    - Transactions, diligence, review teams
    - High-volume review, extraction, diligence summaries
    - Opaque / specialist
    - Legal-grade extraction for diligence-heavy workflows
    - Narrower than full CLM platforms
  - - Workday / Evisort
    - Direct/adjacent enterprise contract platform
    - Claims 70% reduction in outside legal spend and 21-day average deployment
    - Cross-functional enterprises
    - Contract repository, AI extraction, lifecycle automation
    - Opaque / enterprise-led
    - Workday distribution plus contract AI outcomes
    - Retention depends on broader Workday adoption and enterprise fit
  - - LinkSquares
    - Direct contract management platform
    - 4.7 rating from 300+ reviews on retained page
    - Legal teams and adjacent business users
    - Contract analytics, reporting, clause libraries, request workflows
    - Opaque / demo-led
    - Strong repository and legal request-management framing
    - Public retained page shows narrower positioning than full legal-work platforms
  - - ContractSafe / Legito / status quo
    - Lower-end substitute set
    - Simpler repository or document automation alternatives
    - SMB, departmental, or internal-build users
    - Repository, search, document automation, back-office workflow
    - Ranges from simpler SaaS to internal effort
    - Cheaper or easier adoption path
    - Weaker legal-AI depth and enterprise workflow sophistication
