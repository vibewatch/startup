company:
  name: Luminance
chapter:
  number: 3
  title: Competitors
  summary: Luminance competes in a crowded legal-AI stack rather than a single one-to-one market. The sharpest direct pressure comes from enterprise CLM vendors and AI-native contracting platforms, while the hardest strategic squeeze comes from incumbents with proprietary legal content or installed enterprise distribution. Luminance’s differentiation story is credible on legal specificity and workflow breadth, but public pricing opacity and limited third-party win-loss evidence make moat durability moderate rather than decisive.
sections:
- id: landscape-and-segment-positioning
  title: Landscape and segment positioning
  body: 'Luminance sits in a multi-layer field. The direct layer includes enterprise CLM and AI-contracting vendors such as Docusign CLM, Ironclad, SpotDraft, Leah, LinkSquares, Workday/Evisort, Agiloft, and Juro, all of which pitch workflow automation, repository control, and cross-functional value beyond pure legal review. A second layer is made up of legal-work incumbents such as Thomson Reuters CoCounsel and LexisNexis Protégé, which attack adjacent high-value work through authoritative content, reasoning, and drafting rather than end-to-end contract operations. A third layer consists of specialist review tools or smaller substitutes such as Litera Kira, ContractSafe, Legito, and Clio Work, which solve narrower jobs or appeal to different customer segments. The practical substitute set remains internal build and fragmented status quo: Word, email, spreadsheets, shared drives, and generic enterprise systems. That means Luminance is not just selling against one rival product; it is selling
    a wedge that must beat contract platforms on workflow and beat incumbents on trust, legal specificity, and enterprise execution at the same time. Another implication is that budget ownership can move between legal, procurement, and broader transformation teams depending on which rival defines the problem first.'
