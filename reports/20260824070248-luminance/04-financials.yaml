- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / motion
  - Price / unit / contract
  - List vs. realized
  - What it monetizes
  - Source status
  - Implication
  rows:
  - - Enterprise platform contract
    - Public price unavailable
    - Realized pricing unknown
    - Broad legal-grade workflow automation
    - Official pages and funding releases expose no price card
    - Procurement outcomes likely hinge on proof and negotiation rather than transparent list price
  - - Multi-year enterprise license
    - Seven-figure multi-year contracts claimed by Sacra
    - Independent estimate, not official disclosure
    - Large strategic accounts
    - Sacra only
    - Could support strong ACVs, but needs customer-level corroboration
  - - Usage-linked or flexible entry motion
    - Not publicly quantified
    - Estimated by Sacra
    - Specific matters, smaller firms, or document-volume workloads
    - Sacra only
    - May widen top-of-funnel without revealing true blended monetization
  - - Adjacency upsell into procurement/compliance
    - No public pricing
    - Unknown
    - Broader contract-operating-surface monetization
    - Official strategic statements only
    - Expansion path may matter more than initial legal-seat price
  - - Services / implementation
    - No public pricing
    - Unknown
    - Rollout, change management, and integration support
    - No direct public disclosure
    - Could materially affect payback and gross margin despite looking software-like
  notes: Luminance exposes far less pricing data publicly than many horizontal SaaS products, so this table is deliberately heavy on unknowns and exact diligence asks.
