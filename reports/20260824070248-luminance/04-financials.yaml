- id: pricing-and-sales-motion
  title: Pricing model, GTM motion, and sales-efficiency proxies
  body: 'Luminance’s monetization appears enterprise-led and largely opaque in public. The retained official pages do not expose seat pricing, list tiers, or product-package menus, which strongly suggests a quote-led sales motion. Sacra describes a B2B SaaS model sold directly to law firms, corporate legal departments, accounting firms, and alternative legal service providers, with subscription fees that can vary by user count, usage volume, or enterprise license scope. Sacra also claims the company has landed seven-figure multi-year subscriptions, which is directionally consistent with Luminance’s blue-chip customer list and the kinds of legal and procurement workflows it targets. What public sources do reveal about go-to-market is behavioral rather than arithmetic: the Series B blog says proceeds would be used to grow globally, scale demand capture, and sustain innovation; the Series C press release says funding would accelerate U.S. growth, new offices, and adjacent use cases in procurement
    and compliance; and Sacra says legal-tech sales cycles can run six to 12 months, often requiring pilots and reference customers. That combination implies a high-touch enterprise GTM motion with potentially large ACVs, but without public CAC, payback, or discount data the sales-efficiency case remains inferential.'
