- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR
    - 'Sacra estimate: ~$60M at end-2025'
    - Medium
    - Anchors scale and valuation work
    - Request audited 2024-2026 ARR bridge and current run-rate
  - - ARR growth
    - 'Official direction: 5x-6x in two years for core Corporate product'
    - Medium
    - Shows growth velocity but not whole-company base
    - Request absolute ARR by year and product mix
  - - CAC payback
    - 'Null'
    - Low
    - Tests whether enterprise GTM is efficient
    - Request CAC, payback by segment, and pilot-to-close conversion
  - - Gross margin
    - 'Null'
    - Low
    - Determines software economics and valuation quality
    - Request blended and segment gross margin, including services
  - - NRR / expansion
    - 'Null'
    - Low
    - Shows whether product expansion offsets sales-cycle cost
    - Request NRR, GRR, seat expansion, and cross-functional upsell
  - - Implementation margin
    - 'Null'
    - Low
    - Large deployments can hide services burden
    - Request onboarding labor, third-party costs, and services profitability
  - - Inference / cloud cost burden
    - Null, but Azure OpenAI optimization implies relevance
    - Low
    - AI cost structure affects scalability
    - Request COGS split across hosting, models, and support
  - - Sales cycle
    - 'Sacra estimate: 6-12 months'
    - Medium
    - Shapes cash conversion and GTM working capital
    - Request median sales cycle by segment and pilot duration
  notes: Every missing field is material; the table is intentionally explicit about what public sources do not resolve.
