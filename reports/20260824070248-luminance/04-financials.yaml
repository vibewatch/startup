tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public value / status
  - Quality
  - Diligence ask
  rows:
  - - Core platform subscription
    - Recurring software access to drafting, review, negotiation, compliance, and repository workflows
    - Enterprise contract / annual subscription
    - Official pages confirm platform breadth; Sacra describes subscription SaaS monetization
    - Likely high-quality recurring core, but exact mix undisclosed
    - Request ARR by product, logo retention, seat growth, and renewal timing
  - - Enterprise license / multi-year deal
    - Large negotiated contracts for major legal departments or law firms
    - Annual contract value or multi-year license
    - Sacra says some contracts reach seven figures and can be multi-year
    - Potentially strong ACV driver, but evidence is estimate-driven
    - Request ACV distribution, services attach, and ramp structure
  - - Usage or volume-linked pricing
    - Pricing linked to user count, document volume, or matter scope
    - Users, matters, or document volume
    - Sacra says smaller or project-oriented customers may use flexible usage-based pricing
    - Possible wedge into lower-friction adoption, but poorly disclosed
    - Request usage metrics, overage terms, and share of revenue from non-seat pricing
  - - Legal-adjacent workflow expansion
    - Upsell into procurement, compliance, sales, HR, and other contract-heavy teams
    - Expanded enterprise contract scope
    - Official sources repeatedly cite procurement and compliance expansion
    - Important ARPU expansion path, but not a separately reported stream
    - Request expansion ARR and buyer mix outside core legal
  - - Implementation / onboarding services
    - Customer setup, integration, training, and rollout support
    - Project or bundled services
    - Public sources confirm enterprise deployment and product specialization but do not disclose services revenue
    - Could help conversion but dilute gross margin if heavy
    - Request services attach rate, implementation duration, and professional-services margin
  notes: Separates visible monetization mechanisms from the many private metrics still missing from the public record.
