- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2024 growth financing
    - Official $40M Series B led by March Capital
    - High
    - Funded global growth and product investment before Series C
    - Request post-money valuation, ownership changes, and cash bridge
  - - 2025 growth financing
    - Official $75M Series C; >$115M raised in prior 12 months
    - High
    - Supports near-term expansion and innovation spend
    - Request close date, primary vs. secondary split, and closing cash
  - - Total funding to date
    - 'Sacra estimate: $165M'
    - Medium
    - Frames external capital dependence
    - Reconcile official total funding, including all historical rounds
  - - Cash on hand
    - 'Null'
    - Low
    - Core solvency input
    - Request current unrestricted cash and minimum cash policy
  - - Monthly burn
    - 'Null'
    - Low
    - Needed for runway and downside analysis
    - Request monthly burn, burn multiple, and hiring-plan sensitivity
  - - Runway months
    - 'Null'
    - Low
    - Tests capital adequacy directly
    - Request base, downside, and plan runway calculations
  - - Share allotments in 2026
    - Companies House shows April and July 2026 allotments
    - Medium
    - Signals continuing capitalization and option/share administration
    - Request explanation of proceeds, recipients, and dilution impact
  - - Debt / covenant exposure
    - No public debt evidence retained
    - Low
    - Debt can change downside risk materially
    - Request debt schedule, covenants, and any venture-debt facilities
  notes: Capital adequacy can be assessed directionally from funding events and filings, but not precisely without management cash data.
