- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric / artifact
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Audited revenue and ARR bridge
    - Cannot reconcile official growth claims to absolute scale
    - Request audited P&L and monthly ARR bridge for 2024-2026
  - - Cash balance and runway
    - Cannot test downside resilience or financing need
    - Request treasury summary, budget, and downside runway model
  - - Gross margin and COGS split
    - Cannot judge quality of AI-software economics
    - Request COGS split across hosting, models, services, and support
  - - NRR / GRR and cohort retention
    - Cannot tell whether growth is durable or sales-led only
    - Request retention by product, segment, and geography
  - - CAC, payback, and pipeline conversion
    - Cannot assess GTM efficiency or capital intensity
    - Request funnel metrics from lead to closed-won and expansion
  - - Realized pricing and discounting
    - Cannot test pricing power or monetization quality
    - Request ACV distribution, discount waterfall, and pilot conversion economics
  - - Customer concentration and sector mix
    - Cannot assess dependence on a handful of logos
    - Request top-20 customer revenue share and industry mix
  - - Capitalization table and preference stack
    - Cannot model dilution or exit economics cleanly
    - Request full cap table, option pool, and preferred-share rights summary
  notes: This is the minimum private-data package needed before a serious underwriting model can be signed off.
