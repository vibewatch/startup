company:
  name: Luminance
chapter:
  number: 6
  title: Customers
  summary: Luminance’s public customer surface is broad and increasingly enterprise-oriented, spanning multiple industries, geographies, and business functions. The company can show named production-style references and strong review-platform signals, but it still does not disclose the durability metrics—NRR, GRR, churn, contract length, or concentration—that matter most for underwriting customer quality.
sections:
- id: segment-surface-and-buyer-map
  title: Customer segments, buyers, and user surface
  body: The visible customer base is broader than a pure law-firm story. Luminance now says it serves over 1,000 of the world’s largest enterprises in 70+ countries, and its sector and function pages show explicit targeting of chemical, financial services, manufacturing, pharmaceutical, insurance, procurement, sales, finance, and compliance workflows. That matters because it implies multiple buyer and payer paths. Procurement teams can use the platform for vendor and supplier negotiations, finance can use it for obligations and revenue forecasting, compliance can use it for sanctions and regulatory checks, and legal teams remain the core control point across all of those motions. Official reference language also keeps tying Luminance to large, contract-heavy organizations rather than to consumer or SMB segments. The customer advisory board announcement further supports this enterprise shape by naming senior leaders from BBC Studios, Ingram Micro, Staples Canada, Imerys, and Slaughter and
    May. The commercial picture, then, is a cross-functional enterprise customer surface with legal at the center but not at the boundary. The public segment mix also implies that Luminance is trying to avoid dependence on a single buyer archetype or one narrow legal workflow.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
