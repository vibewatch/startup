  - FU003
- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration risks
  body: The public evidence is good enough to support an expansion story, but not a durability model. Official pages and customer-specific releases show clear land-and-expand logic across procurement, compliance, finance, and legal. The customer advisory board and sector pages reinforce that Luminance wants cross-functional, strategic accounts rather than narrow point deployments. Still, almost every retention-critical metric is missing. Luminance does not disclose NRR, GRR, churn, contract length, renewal rates, cohort survival, or top-customer concentration. FeaturedCustomers, Gartner, and TrustRadius show satisfaction signals, yet review platforms are not substitutes for true contract durability. Public diversification across industries and geographies is encouraging, because it cuts against an obvious single-sector dependency, but investors still cannot see how much revenue comes from the largest logos or whether early-law-firm adopters translate into durable expansion inside enterprises.
    The best public conclusion is moderate confidence in adoption breadth and expansion potential, paired with low confidence in retention economics and concentration exposure until management supplies cohort and account-level data. That is the key boundary between a good reference set and a truly underwritten customer ledger. Private cohort tables, renewal histories, and account-level revenue mix would materially improve confidence in customer durability and expansion quality over time across cohorts and renewal cycles globally.
