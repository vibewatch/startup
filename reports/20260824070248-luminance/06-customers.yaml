  - TU001
  figureRefs:
  - FU001
- id: named-proof-and-adoption-signals
  title: Named customer proof and adoption trajectory
  body: Named proof exists and is more specific than a simple logo wall, but it is still uneven. The best evidence comes from customer-quoted official releases and third-party review aggregators. Community Fibre’s release describes a production-style deployment aimed at centralizing contract intelligence, scaling procurement operations, and supporting future due diligence. Bulla Dairy’s release focuses on streamlining contracting and unlocking business insight. The customer advisory board expands the proof set from deployment references to governance-grade engagement, indicating that at least some customers are participating in product-direction dialogue rather than merely appearing as logos. FeaturedCustomers adds breadth with 63 testimonials, 54 case studies, 8 videos, and a 4.8/5.0 score from more than 2,500 reference ratings, including a highlighted story saying review time fell from five months to 10 days. Review platforms add a more cautious signal. Gartner shows a strong rating surface
    but limited visible rating depth, while TrustRadius shows only a tiny review base. The right interpretation is that Luminance has credible evidence of active enterprise use, but the public proof set is still much stronger on case studies and reference quality than on transparent denominators or retention evidence. In other words, the chapter can verify that customers exist and that some are vocal, but not that the whole base is equally deep.
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
