- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public evidence suggests the customer journey starts in legal or procurement pain, lands in one workflow, then expands into adjacent business functions and governance engagement.
  data:
    nodes:
    - id: discover
      label: Discover / shortlist
      detail: Enterprise legal, procurement, and regulated-industry teams identify contract bottlenecks, governance pain, or compliance pressure.
    - id: land
      label: Initial land
      detail: A legal, procurement, or business team adopts one workflow such as review, negotiation, or repository analysis.
    - id: operational
      label: Operational deployment
      detail: The account uses Luminance in production-style workflows such as contract intelligence, procurement operations, or business insight extraction.
    - id: expand
      label: Cross-functional expansion
      detail: Usage extends into finance, compliance, sales, and other contract-heavy functions.
    - id: strategic
      label: Strategic engagement
      detail: Large accounts may participate in advisory-board or governance-level discussions about AI adoption and trust.
  approximationNotes: This journey map synthesizes named proof, segment pages, and advisory-board evidence; it is not a measured conversion funnel.
