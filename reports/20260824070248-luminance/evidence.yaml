evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Authoritative post-money valuation, cap table, and any secondary transactions tied to the latest round.
    whyItMatters: >-
      Without a disclosed valuation it is impossible to test whether current enthusiasm already prices in future growth,
      which weakens any precise investment conclusion.
    diligencePath: >-
      Request board-approved financing documents, latest cap table, and any investor presentation used in the Series C
      process.
    relatedQuestionRefs:
      - QO010
      - QO022
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, burn, and current headcount figures.
    whyItMatters: >-
      Growth claims are directionally strong, but efficiency, durability, and cash needs cannot be evaluated from public
      material alone.
    diligencePath: Obtain audited or management financial statements plus headcount and cohort retention data under NDA.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: A complete and current board roster with observer rights and committee structure.
    whyItMatters: >-
      Governance quality and investor control dynamics matter for a late-stage private company pursuing aggressive
      global expansion.
    diligencePath: Ask management for board composition, committee membership, and any advisory-to-board reporting relationships.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: luminance-som
    missingEvidence: Segment-level pricing, ACV, and customer-mix data specific to Luminance.
    whyItMatters: >-
      Without revenue by customer segment and contract size, a public SOM remains a narrative wedge rather than an
      underwriting-grade market model.
    diligencePath: >-
      Request management data on ACV, seat counts, and revenue split across enterprise legal, law firms, procurement,
      and compliance.
    relatedQuestionRefs:
      - QM020
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-size-dispersion
    missingEvidence: Comparable like-for-like market definitions across legal AI and CLM research publishers.
    whyItMatters: >-
      Publisher TAMs look contradictory when they may simply be measuring different shells; preserving that difference
      avoids false precision.
    diligencePath: >-
      Normalize each report by included workflows, excluded categories, geography, and forecast base year before using
      any single figure in valuation work.
    relatedQuestionRefs:
      - QM006
      - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Win rates, implementation timelines, and renewal or expansion data by buyer segment.
    whyItMatters: >-
      The market is clearly active, but vendor success depends on whether pilots convert into durable enterprise revenue
      with acceptable payback.
    diligencePath: Obtain internal funnel metrics, deployment length, and expansion/retention data under NDA.
    relatedQuestionRefs:
      - QM010
      - QM015
      - QM025
