company:
  name: Luminance
chapter:
  number: 8
  title: Valuation
  summary: 'Luminance looks like a credible category asset, but the public evidence still does not justify paying a clean unicorn-style price with conviction. The strongest public underwriting stance is TRACK with medium confidence and high risk: the company quality story is real, yet the evidence base remains too thin on audited ARR, retention, gross margin, and seniority terms to support a premium mark without a large diligence discount.'
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: The valuation question for Luminance is not whether the company is interesting. It clearly is. The company can show global customer breadth, a legal-specific AI narrative, continuing financing support, and product expansion into multiple contract-centric functions. The harder question is whether public evidence supports paying a premium price today. On that standard the answer is no. Official sources confirm a $40 million-ish 2024 Series B and a $75 million 2025 Series C, but they do not disclose a clean official post-money valuation for either round. Sacra fills part of the gap with an estimated ~$60 million ARR by end-2025 and ~$165 million total funding, yet those are still external estimates rather than audited company disclosures. Public comps also matter. The most relevant selected workflow and trusted-data comps span roughly 3.4x to 11.1x EV/sales, with the median around 6.2x. Applying that framework to the public ARR estimate does not naturally produce a clean, fully supported
    unicorn mark. The chapter recommendation is therefore TRACK with medium confidence, high risk, and a stretched-to-opaque valuation stance. That is not a negative verdict on the business; it is a price-discipline verdict on incomplete evidence.
  claimRefs:
