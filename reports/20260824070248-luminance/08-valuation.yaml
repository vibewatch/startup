- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence anchor
  - What would change the view
  rows:
  - - 'Pro-thesis: Luminance has become a real global legal-AI platform'
    - Official sources support 700+ then 1,000+ customer-scale language, global reach, and continuing capital access.
    - Upgrade if management provides audited ARR, NRR, and expansion proof showing that scale converts into durable premium economics.
  - - 'Pro-thesis: the company may deserve more than generic workflow multiples'
    - Legal-specific AI positioning, product breadth, and enterprise buyer relevance create real category optionality.
    - Upgrade if margin, retention, and cap-table clarity justify a premium-to-median comp stance.
  - - 'Anti-thesis: public evidence still does not support a clean unicorn price'
    - Official funding releases lack explicit valuation disclosure and the public ARR anchor is still a third-party estimate.
    - A clean official valuation bridge plus audited operating metrics would narrow the gap.
  - - 'Anti-thesis: seniority and information risk can erode realized returns'
    - Preferred-share layering is visible in filings but not fully quantified publicly.
    - A full preference and dilution summary would reduce realized-value uncertainty.
  notes: This table separates business-quality positives from price-and-evidence objections so the recommendation remains discipline-driven.
