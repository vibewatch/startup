- id: bull-base-bear-underwriting
  title: Bull, base, and bear underwriting
  body: 'The scenario logic follows directly from the evidence gaps. The bull case assumes Luminance’s 2026 run-rate is materially above the end-2025 Sacra estimate, that expansion beyond core legal really is sticky, and that retention, margin, and capital-structure diligence all land near premium-software levels. In that world, a high-hundreds-of-millions valuation can stretch toward a unicorn threshold. The base case is more conservative and more consistent with what public sources actually prove: Luminance is a strong company, but investors are still mostly underwriting narrative growth with insufficient retention and seniority detail, which points to a mid-hundreds-of-millions range rather than a clean chase above it. The bear case is not business failure. It is repricing. If current ARR is closer to public estimates than private-market enthusiasm, if customer durability is weaker than hoped, or if AI-workflow multiples compress, then valuation support can fall well below any implied
    unicorn aspiration without requiring a collapse in product quality. The crucial point is that downside here is mostly valuation error and information risk, not obvious near-term solvency risk.'
