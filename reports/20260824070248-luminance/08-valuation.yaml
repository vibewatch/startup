- id: financing-context-and-evidence-quality
  title: Financing context and evidence quality
  body: 'Public financing evidence for Luminance is directionally good but mechanically incomplete. The official Series B and Series C announcements, together with corroborating media, support continuing capital access and strong investor interest. The public record also shows meaningful growth language around customer count, U.S. adoption, and multi-function platform expansion. Companies House filings strengthen the view that Luminance is an actively capitalized company rather than a narrative-only startup: there are updated share allotments, evolving articles, and continued governance activity. But those same filings also highlight how much remains hidden. Investors can see that preferred shares and growth shares exist, yet they cannot see a full economic waterfall. They can see that accounts were filed, but they cannot extract the operating statement detail needed for true underwriting. And the most quoted revenue figure in the public domain remains a third-party estimate rather than
    a company disclosure. This is exactly the kind of setup where headline private-market enthusiasm can run ahead of evidence quality. The right interpretation is neither dismissal nor exuberance. It is that Luminance likely deserves serious diligence attention, but not a blind premium multiple.'
