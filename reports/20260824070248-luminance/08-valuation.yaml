- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Key assumptions
  - Implied EV band
  - Headline return logic
  - Probability signal
  rows:
  - - Bull
    - 2026 ARR moves materially above public estimate, retention and gross margin clear premium thresholds, and seniority terms are benign.
    - US$900M-US$1.2B
    - Supports a near-unicorn or low-unicorn framing, but only if premium execution and premium evidence both appear.
    - Possible but not yet publicly proven
  - - Base
    - Luminance remains a strong winner, but public evidence stays partial and investors apply a moderate premium to selected workflow comps rather than a category-exception mark.
    - US$550M-US$800M
    - Solid company, limited justification for paying a full unicorn price on today’s evidence.
    - Most consistent with current public record
  - - Bear
    - ARR is closer to the public estimate range, retention or margins disappoint, or multiple climate weakens.
    - US$300M-US$500M
    - Meaningful repricing downside without requiring business failure.
    - Real if diligence does not close current information gaps
  notes: Bands are headline enterprise-value ranges based on public ARR estimates and public comp logic; they do not attempt exact waterfall math because seniority terms are still private.
