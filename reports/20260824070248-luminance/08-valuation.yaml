- id: thesis-breakers-and-final-diligence
  title: Thesis-breakers and final diligence asks
  body: 'The investment call should move only if either evidence quality improves or price resets. The clean upgrade path is straightforward: audited ARR and retention data, a gross-margin bridge, customer-concentration detail, and a transparent summary of seniority terms would all justify taking the current narrative more seriously. A second path would be price discipline alone. If the entry price moved closer to the range the current public comp bridge can support, the same company could become more attractive without any change in business quality. The thesis-breakers are equally clear. If current ARR is materially below the public estimate range, if NRR or renewal quality fail to clear premium thresholds, if dependence on third-party model economics is greater than expected, or if a future financing reveals aggressive seniority or a softer mark, then investors should treat recent private enthusiasm as a peak narrative rather than a durable valuation floor. The chapter therefore ends
    where the evidence leads: Luminance is worth following closely, but not worth forcing at a price the public record still cannot underwrite cleanly.'
