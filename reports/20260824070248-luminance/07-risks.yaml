  - FR002
- id: commercial-capital-and-customer-risks
  title: Commercial, customer, and capital-structure risks
  body: 'The third risk cluster is commercial opacity. Public customer proof is good enough to support a land-and-expand story, but not good enough to underwrite renewal quality. Sacra and the product/customer materials support an enterprise, multi-stakeholder sales motion with long cycles and meaningful ACV potential. At the same time, the public record still does not disclose NRR, GRR, logo churn, cohort survival, top-customer concentration, or revenue split by geography and function. That matters because legal AI companies can look broad in logos yet shallow in durable production spend. Capital structure adds a second opacity layer. Companies House filings clearly show continuing allotments and a stack that includes preferred shares plus ordinary and growth shares, but public evidence still does not provide a clean waterfall, liquidation-preference summary, or cash-runway bridge. Investors can therefore see that capital has continued to flow, yet cannot fully see how downside would be
    distributed or how much economic value sits beneath any headline mark. The best commercial reading is that Luminance does not look distressed, but investors are still being asked to bridge too much with narrative: public growth claims, reference customers, and financing events are visible; the renewal math and realized equity economics are not.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
