  - - Capital structure surprise
    - Next financing or diligence reveals aggressive seniority or weak runway
    - Terms subordinate new money or imply stressed capital need
    - Treat as valuation reset / downside scenario
  notes: Kill criteria are designed to be monitorable during diligence or post-investment, not abstract risk labels.
