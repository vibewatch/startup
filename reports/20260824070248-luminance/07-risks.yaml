company:
  name: Luminance
chapter:
  number: 7
  title: Risks
  summary: Luminance’s risk profile is shaped less by one obvious existential flaw than by the combination of legal-output trust, platform dependence, customer-opacity, and capital-structure opacity. The company’s positioning in high-stakes legal workflows means even modest hallucination, confidentiality, or uptime failures could transmit quickly into slower sales, weaker renewals, and lower valuation support.
sections:
- id: legal-regulatory-and-output-liability
  title: Legal, regulatory, and output-liability risks
  body: 'Luminance operates in one of the least forgiving application layers in software: enterprise legal work. That does not automatically make it a regulated law firm, but it does mean product mistakes can become trust events very quickly. The retained NCSC legal-practitioner guidance is useful here because it frames the core problem cleanly: legal AI can fabricate authorities, distort holdings, or produce false procedural information that looks plausible enough to be used if humans over-rely on it. Luminance’s own positioning pushes directly into drafting, negotiation, analysis, compliance, investigation, and collaboration, so the company is exposed wherever customers treat outputs as decision support in high-stakes workflows. The EU AI Act adds another layer. The broad rule set is not legal-tech-specific, but it already imposes GPAI-related transparency and copyright expectations and establishes future obligations around higher-risk justice-adjacent uses. Copyright and authorship also
    remain relevant because public legal-tech buyers will care about whether generated drafts are protectable, what human review is needed, and how customer IP rights are handled. Public sources show that Luminance talks a lot about trust and security, but they still do not provide the sort of detailed legal-risk memorandum, training-data provenance summary, or product-liability history that would turn this from a diligence theme into a closed issue.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
