    - Verified data breach, regulator notice, or repeated severe outages
    - Sensitive customer data exposure or repeated service interruptions
    - Move to pass unless incident response and containment are exceptional
  - - Commercial opacity persists
    - Management cannot provide NRR, concentration, and renewal detail in diligence
