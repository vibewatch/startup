companyProfile:
  summary: >-
    Luminance is a legal-AI company founded in 2015 by Cambridge-based AI experts Adam Guthrie
    and Dr Graham Sills. The company now presents itself as a legal-grade AI platform for
    drafting, negotiation, review, compliance, investigation, and collaboration, with Eleanor
    Lightbody as CEO. Current public sources say Luminance serves more than 1,000 organizations
    across 70+ countries and raised a $75 million Series C in 2025 after a roughly $40 million
    2024 Series B, but the public record still does not disclose a clean post-money valuation.
  foundedDate: "2015-01-01"
  founders:
    - name: Adam Guthrie
      role: Co-founder and Chief Technical Architect
      background: Cambridge-based AI expert and early architect of the company's legal-language systems.
      claimRefs: [CO001, CO014]
    - name: Dr Graham Sills
      role: Co-founder and Director of AI
      background: Cambridge-based AI expert publicly described as the architect of Luminance's core algorithms.
