  topStrengths:
    - Broad legal-grade AI product surface across drafting, negotiation, analysis, compliance, investigation, and collaboration.
    - Public customer proof is meaningful, with 1,000+ organizations across 70+ countries and named enterprise references.
    - Funding chronology and continuing Companies House activity suggest ongoing capital support rather than visible distress.
    - The company has credible category relevance in legal AI and contract intelligence, with enterprise use cases beyond core legal teams.
  topRisks:
    - Public evidence still does not disclose audited ARR, retention, gross margin, customer concentration, or a clean official valuation anchor.
    - Preferred-share layering is visible in filings, but realized investor economics remain unclear without a full waterfall and seniority summary.
    - Trust failure in legal workflows—through hallucinations, confidentiality issues, or outages—could damage enterprise references and valuation support quickly.
    - Platform and model dependence, including Azure OpenAI optimization signals, may create margin and roadmap exposure.
    - Competitive compression from Harvey, DocuSign, Thomson Reuters, LexisNexis, and adjacent incumbents can limit premium multiple support.
  unresolvedGaps:
    - Audited 2024-2026 ARR, current run-rate, and revenue mix are still unavailable in retained public sources.
    - NRR, GRR, churn, pilot-to-production conversion, and top-customer concentration remain private.
    - Gross-margin detail and the sensitivity of cost-to-serve to external model or cloud partners are not publicly disclosed.
    - The full preference stack, dilution schedule, and any debt or covenant terms are not publicly visible.
    - No retained public source provides a clean official post-money valuation for the 2024 or 2025 financings.
    - Public resilience evidence remains too thin on uptime, incident history, and external audit outcomes.
