  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market boundary for Luminance is narrower than “all legal services” and broader than pure
              due-diligence review. Official Luminance messaging frames the product as legal-grade AI for every contract
              touchpoint, stretching from drafting and negotiation to compliance, investigation, and collaboration. That
              places the company at the intersection of legal AI and contract lifecycle management rather than in
              generic productivity software. Competing vendor pages reinforce that boundary. Docusign, Ironclad,
              SpotDraft, and Leah all pitch integrated workflow, repository, approval, negotiation, and analytics
              capabilities, while Litera Kira and Harvey show adjacent segments centered on high-stakes review and
              broader legal-work automation. The practical substitute set remains stubbornly old-fashioned: Microsoft
              Word, email chains, outside counsel, fragmented repositories, and slow manual review processes. Ironclad’s
              CLM explainer is particularly useful here because it describes contracts as touching every dollar entering
              or leaving an organization and positions CLM as the cure for a broken, pre-digital legal process. For
              Luminance, the implication is that the addressable market is defined by contract intensity, governance
              burden, and cross-functional workflow pain—not by the total number of lawyers in the world.
            claimRefs:
