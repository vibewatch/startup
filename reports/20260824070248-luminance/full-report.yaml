              says the system has been informed by 150+ million verified legal documents and built from inception for
              law. The Compete366 case study adds useful operational detail that the company already had proprietary AI
              delivered as a SaaS offering on AWS, then experimented with GPT-4 and later worked on Azure OpenAI
