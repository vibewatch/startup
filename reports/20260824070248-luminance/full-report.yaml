      - number: '7.4'
        title: People, execution, and investment implications
        blocks:
          - type: paragraph
            body: >-
              Execution risk is the integrating theme across the chapter. Luminance is hiring, expanding geographically,
              broadening its product surface, and adding governance capacity, all of which are ordinary growth-company
              positives until they start to stretch coordination. Careers signals and director appointments support the
              view that the company is still building organizational depth rather than harvesting a stable mature
              platform. That is consistent with a business that wants to serve legal, procurement, finance, compliance,
              and adjacent workflows across many countries. It is also a setup in which category pressure can bite
              faster than expected. Harvey, Docusign, Thomson Reuters, and LexisNexis all attack pieces of the same
              workflow, and several of them can combine AI with trusted content, broader suites, or existing
              distribution. The investment implication is that Luminance’s most important risks transmit into one
              another: a trust incident weakens enterprise references, which lengthens already complex sales cycles,
              which raises pressure on margins and capital, which in turn reduces valuation support. The company can
              likely manage any one of those issues in isolation. The concern is correlation.
            claimRefs:
