      - number: '3.2'
        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              The public surfaces show clear segmentation by product architecture and buyer story. Luminance, SpotDraft,
              Leah, Docusign, Ironclad, LinkSquares, Workday/Evisort, and Agiloft all frame contracts as an enterprise
              workflow system touching legal, procurement, compliance, finance, or sales. Harvey, CoCounsel, LexisNexis
              Protégé, and Clio Work instead foreground legal reasoning, document analysis, or matter-oriented
              assistance. Litera Kira stays closest to a due-diligence and extraction specialist. Public pricing is
              materially less transparent than capability messaging: Docusign provides ROI and enterprise references but
              no list pricing on the retained page, and most enterprise rivals similarly force a demo or sales motion.
              The lower-friction end of the market is better represented by simpler or more automation-oriented
              substitutes such as ContractSafe, Legito, and some SMB legal tools, but those alternatives look weaker on
              enterprise-grade workflow breadth. The investable implication is that feature breadth can be compared
              publicly, but realized price, ACV, and discounting cannot. Luminance therefore wins or loses more on proof
              of legal-grade accuracy, change-management value, and platform depth than on visible sticker price. That
              also means vendor demos, reference calls, and implementation stories matter more than published price
              sheets when enterprises run selections.
