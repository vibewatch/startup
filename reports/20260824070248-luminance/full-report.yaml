      - number: '8.3'
        title: Comparable valuation bridge
        blocks:
          - type: paragraph
            body: >-
              The cleanest public comp frame for Luminance is a mixed basket of workflow software, professional-services
              software, and trusted-information platforms rather than generic horizontal AI. DocuSign anchors the lower
              end as a scaled workflow platform with CLM adjacency. Intapp is especially relevant because it sells into
              legal and professional-services workflows and therefore reflects a market view on software embedded in
              expert operating loops. Thomson Reuters adds the trusted-data and legal-workflow lens, while Veeva and
              Guidewire show what the public market can pay for deeply embedded, mission-critical vertical platforms
              when disclosure and entrenchment are much stronger. On current public snapshots, those comps span about
              3.4x to 11.1x EV/sales. That does not mean Luminance belongs at the low end. It is growing faster than
              mature incumbents and carries private-market AI optionality. But public comps are more transparent and
              usually deserve less, not more, uncertainty discount than a private company with opaque retention and
              cap-table terms. That is why this chapter treats the upper end of the comp range as conditional rather
              than deserved by default.
            claimRefs:
              - CV014
