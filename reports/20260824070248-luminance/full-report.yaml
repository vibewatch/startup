      - number: '4.3'
        title: Likely unit economics, cost structure, and margin drivers
        blocks:
          - type: paragraph
            body: >-
              The cost stack looks like a modern enterprise AI software company: product R&D, cloud and model-inference
              expense, enterprise onboarding, customer success, and a relatively expensive direct sales motion. Public
              sources do not disclose gross margin, implementation margin, hosting cost, or services intensity, so the
              margin case has to be inferred from mechanism rather than reported numbers. Sacra explicitly describes the
              business as benefiting from software-like marginal economics once the platform is built, but also says
              Luminance continues to invest heavily in R&D and accepts operating losses during the growth phase. The
              Compete366 case study adds an important operational clue by describing Azure OpenAI optimization work for
              Luminance, implying that model and infrastructure choices matter financially, not just technically. The
              absence of inventory, manufacturing, or hardware deployment suggests capital intensity is primarily
              people, compute, and selling effort rather than physical capex. At the same time, long legal-tech sales
              cycles, enterprise implementations, and product specialization can all delay payback if customers take
              time to expand. The bottom line is that Luminance probably has attractive long-run software economics, but
              the public record is too incomplete to quantify CAC efficiency, blended gross margin, or the margin impact
              of AI-inference costs with confidence.
