      - number: '1.3'
        title: Funding record and international expansion
        blocks:
          - type: paragraph
            body: >-
              The clearest public capital record starts with the April 2024 Series B and the early-2025 Series C.
              Official and third-party sources corroborate that Luminance raised $40 million in Series B led by March
              Capital with National Grid Partners and Slaughter and May participating, then raised $75 million in Series
              C led by Point72 Private Investments with Forestay, RPS Ventures, and Schroders joining existing backers.
              The Series C announcement said the latest round took capital raised in the previous twelve months above
              $115 million, while multiple third-party profiles estimate roughly $165 million of total lifetime funding
              by 2025. Importantly, public sources still do not disclose a post-money valuation, so claims of unicorn
              status should be treated as unverified unless management or investors provide direct documentation. What
              is publicly visible is aggressive expansion. Luminance’s contact page now lists London, Cambridge, New
              York, Madrid, San Francisco, Dallas, and Toronto, while the Sydney-office announcement adds Australia and
              notes an existing Singapore presence. Expansion messaging is tied directly to revenue concentration in the
              U.S.: official sources moved from “more than one-third” of revenue in the U.S. around the 2024 Dallas
              announcement to 40% in the 2025 Series C release.
