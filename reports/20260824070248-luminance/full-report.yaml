      - number: '1.4'
        title: Recent momentum and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The operating narrative is strong even though disclosure remains incomplete. Recent 2026 press releases
              show new enterprise wins such as Community Fibre and Bulla Dairy Foods, both of which used Luminance to
              centralize contract intelligence, accelerate negotiation, and extend AI beyond core legal teams into
              procurement and business operations. The company’s own expansion narrative is supported by the Compete366
              case study, which describes how Luminance layered Azure OpenAI onto its proprietary AI stack to build more
              trusted generative workflows for lawyers concerned about hallucinations. That said, investors should
              separate traction from proof of financial quality. There are no audited public financials, no disclosed
              gross margins or burn profile, no current headcount disclosure, and no authoritative public valuation
              figure. Category risk also remains real: NCSC legal guidance on AI hallucinations underscores why
              enterprise buyers still require verification, governance, and strong process controls before trusting AI
              in high-stakes legal work. Luminance’s product messaging directly addresses those concerns, but outside
              investors would still want private diligence on accuracy benchmarks, renewal rates, implementation effort,
              and how much of the platform’s apparent edge comes from proprietary legal data versus distribution and
              workflow design.
            claimRefs:
