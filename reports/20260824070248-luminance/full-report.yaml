      - number: '7.2'
        title: Security, model quality, and platform dependencies
        blocks:
          - type: paragraph
            body: >-
              The second cluster is operational but economically material. Luminance sells into organizations with
              sensitive contracts, procurement records, obligations, and compliance data, so a security incident would
              likely be judged not just as an IT outage but as a breach of professional trust. The company publishes a
              security page and the overall website stresses enterprise credibility, which is directionally positive.
              The harder issue is what cannot be seen. Public materials do not disclose uptime performance, historical
              incident rates, third-party audit findings, model-evaluation benchmarks, or how often customers must
              override or correct generated outputs. The Compete366 case study matters because it points to Azure OpenAI
              optimization work for Luminance. That does not disprove the company’s proprietary-architecture narrative,
              but it does show that at least some of the stack economics and performance depend on third-party model and
              cloud choices. In a category where output quality, latency, and cost-to-serve can all affect enterprise
              trust, that creates exposure to pricing changes, roadmap shifts, and infrastructure concentration. Product
              breadth compounds the issue. Luminance now spans multiple modules and departments, which can improve
              account value, but it also raises testing, reliability, onboarding, and change-management burden across a
              much larger surface area than a single-purpose point solution would face.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
