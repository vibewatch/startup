      - Transmission to thesis
      - Action implication
    rows:
      - - ARR support breaks
        - Audited ARR is materially below the public estimate band used in this chapter
        - Undercuts premium-growth narrative and comp bridge simultaneously
        - Move to pass or re-underwrite at bear-case valuation
      - - Retention disappoints
        - NRR or renewal data fail premium-software thresholds
        - Invalidates bull case and weakens willingness to pay above median comp multiples
        - Reduce valuation band and conviction
      - - Seniority surprise
        - Diligence reveals aggressive preferences, hidden debt, or investor protections
        - Cuts realized value even if headline EV looks stable
        - Demand price reset or pass
      - - Trust event
        - Security incident or widely cited output failure hits flagship enterprise proof
        - Damages customer proof, sales efficiency, and valuation simultaneously
        - Pause investment case until blast radius and remediation are clear
      - - Financing reset
        - Next round or secondary mark comes below implied premium narrative
        - Signals market discipline is harder than recent story suggests
        - Treat as repricing evidence, not temporary noise
    notes: Kill triggers emphasize falsifiable diligence conditions rather than broad category concerns.
    claimRefs:
      - CV020
      - CV031
      - CV033
      - CV034
      - CV035
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - ARR bridge
        - Audited 2024-2026 ARR and current run-rate
        - Turns narrative scale into an actual valuation denominator
        - CFO / finance diligence
      - - Retention quality
        - NRR, GRR, churn, renewal timing, pilot-to-production conversion
        - Determines whether Luminance deserves premium workflow multiples
        - Revenue-operations and board-package diligence
      - - Gross margin / cost-to-serve
        - Margin bridge including cloud/model spend and services intensity
        - Separates premium software from lower-quality growth
        - Finance + product infrastructure diligence
      - - Cap table / seniority
        - Preference stack, dilution, rights, and any debt or covenant detail
        - Determines realized investor economics, not just headline EV
        - Legal / financing diligence
      - - Customer concentration
        - Top-10 / top-20 revenue share and major renewal calendar
        - Tests whether scale is diversified or logo-concentrated
        - CRO / FP&A diligence
      - - Platform dependence
        - Share of cost or performance tied to external model/cloud partners
        - Tests resilience of margin and roadmap assumptions
        - CTO / infrastructure diligence
    notes: >-
      These asks are the minimum data needed to move from price-sensitive tracking to a fully underwritten investment
      call.
    claimRefs:
      - CV009
      - CV020
      - CV030
      - CV032
      - CV036
