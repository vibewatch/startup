    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Bear, base, and bull enterprise-value bands showing why a unicorn-style mark is possible only in the
      best-supported scenario.
    data:
      items:
        - label: Bear repricing band
          low: 300
          high: 500
          unit: USD M
          detail: Public ARR estimate plus lower-end workflow multiples and unresolved opacity
        - label: Base underwriting band
          low: 550
          high: 800
          unit: USD M
          detail: Strong company, but only a moderate premium to selected public comps is supportable today
        - label: Bull execution band
          low: 900
          high: 1200
          unit: USD M
          detail: Requires materially higher ARR, premium retention, and clean seniority terms
