      - number: '3.3'
        title: Switching costs, distribution power, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Luminance’s moat is real, but it is not cleanly winner-take-all. The strong side of the case is that
              contract systems become deeply embedded once clause libraries, review playbooks, workflows, permissions,
              repositories, and integrations are in place. Luminance can also credibly argue that its legal-specific
              architecture matters because official product pages still reveal wide variation in what rivals actually
              optimize for: authoritative legal content, review precision, self-serve document automation, repository
              control, or broad cross-functional workflow. The weak side is that the ecosystem is converging fast.
              Harvey, Leah, SpotDraft, Juro, Ironclad, Agiloft, Workday/Evisort, Docusign, and LinkSquares all now
              market some version of AI-native or agentic contract operations, while CoCounsel and LexisNexis bring
              formidable content moats and existing legal distribution. Multi-homing is also plausible: a company can
              use an incumbent research assistant alongside a CLM, and can keep Microsoft-style status quo tools around
              the edges. Adverse evidence from NCSC and industry surveys reinforces that trust, governance, and proof of
              ROI still gate purchases. Underwriting should therefore view Luminance’s durability as dependent on
              execution, trust, and workflow penetration—not on AI branding alone. Buyers can rationally prefer a mixed
              stack if no single product clearly dominates research authority, contracting workflow, and governance at
              once. That leaves a real diligence burden around implementation depth, renewal behavior, and whether
              customers standardize on Luminance or merely add it beside other tools. Segment-level win rates remain
              private.
            claimRefs:
              - CP002
              - CP003
              - CP018
