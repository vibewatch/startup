  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and segment positioning
        blocks:
          - type: paragraph
            body: >-
              Luminance sits in a multi-layer field. The direct layer includes enterprise CLM and AI-contracting vendors
              such as Docusign CLM, Ironclad, SpotDraft, Leah, LinkSquares, Workday/Evisort, Agiloft, and Juro, all of
              which pitch workflow automation, repository control, and cross-functional value beyond pure legal review.
              A second layer is made up of legal-work incumbents such as Thomson Reuters CoCounsel and LexisNexis
              Protégé, which attack adjacent high-value work through authoritative content, reasoning, and drafting
              rather than end-to-end contract operations. A third layer consists of specialist review tools or smaller
              substitutes such as Litera Kira, ContractSafe, Legito, and Clio Work, which solve narrower jobs or appeal
              to different customer segments. The practical substitute set remains internal build and fragmented status
              quo: Word, email, spreadsheets, shared drives, and generic enterprise systems. That means Luminance is not
              just selling against one rival product; it is selling a wedge that must beat contract platforms on
              workflow and beat incumbents on trust, legal specificity, and enterprise execution at the same time.
              Another implication is that budget ownership can move between legal, procurement, and broader
              transformation teams depending on which rival defines the problem first.
