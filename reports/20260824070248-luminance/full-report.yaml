            body: >-
              The best public solvency signals are financing events and filings, not operating statements. Official
              sources support a $40 million Series B in 2024 and a $75 million Series C in 2025, while Sacra estimates
              total funding at $165 million. Companies House adds useful but still partial detail. The company overview
              page shows last accounts made up to 31 December 2024 and next accounts due by 30 September 2026; filing
              history confirms those 2024 group accounts were filed on 2 October 2025. The 2026 SH01 filings show
              ongoing share allotments, while the April 2026 filing text reveals a layered capital structure including
              Series A, Series B, and Series C preferred shares alongside B ordinary and growth shares, with
              liquidation-preference mechanics attached. Director-appointment filings in late 2025 and mid-2026 suggest
              the board and capitalization environment continued to evolve after the Series C. Those facts are enough to
              show that Luminance is still actively capitalized and not obviously financing-starved. They are not enough
              to measure downside resilience. Public sources still do not disclose cash on hand, monthly burn, runway,
              debt, covenant exposure, gross retention, NRR, or customer concentration. As a result, the chapter can
