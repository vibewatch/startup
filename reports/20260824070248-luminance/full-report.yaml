  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The public financial picture starts with a clear commercial direction but incomplete numeric disclosure.
              Official Luminance sources repeatedly describe an enterprise legal-AI platform sold into large
              organizations, and the company’s own 2024–2025 financing announcements point to subscription-like software
              economics rather than transaction fees or project-only services. The strongest official growth signals are
              directional rather than fully auditable: the Series C release says the core Corporate product saw
              customers increase five times and ARR rise six times in the prior two years, while the Dallas expansion
              release says ARR grew more than five times over two years and U.S. customer adoption of Corporate rose
              225% since January 2023. Sacra provides a more explicit revenue estimate, placing ARR at roughly $60
              million by year-end 2025, up from about $30 million a year earlier. Official scale claims also evolved
              from 700+ organizations in 70+ countries to 1,000+ customers in 70+ countries on the current website. The
              practical read-through is that Luminance likely has genuine recurring revenue momentum, but the company
              still does not publish audited revenue, revenue mix, or cohort-quality metrics.
