      - number: '1.4'
        title: 近期势能与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管披露仍不完整，运营叙事很强。2026 年近期新闻稿显示了 Community Fibre 和 Bulla Dairy Foods 等新增企业客户；两家公司都用 Luminance 集中合同智能、加快谈判，并把
              AI 从核心法律团队延展到采购和业务运营。Compete366 案例研究支撑了公司自己的扩张叙事：Luminance 在自研 AI 栈上叠加 Azure
              OpenAI，为担心幻觉的律师构建更可信的生成式工作流。即便如此，投资人仍应把业务牵引和财务质量证明分开看。公司没有公开经审计财务，没有披露毛利率或烧钱结构，没有当前员工数披露，也没有权威公开估值数字。品类风险也真实存在：NCSC
              关于 AI 幻觉的法律指引说明，企业买家在高风险法律工作中信任 AI 之前，仍需要验证、治理和强流程控制。Luminance
              的产品叙事直接回应了这些担忧，但外部投资人仍会希望私下尽调准确性基准、续约率、实施工作量，以及平台表面优势有多少来自自研法律数据，而不是分发和工作流设计。
