        title: 融资背景与证据质量
        blocks:
          - type: paragraph
            body: >-
              关于 Luminance 的公开融资证据，方向上利好，但条款和机制并不完整。官方 B 轮、C
              轮公告，加上媒体交叉佐证，说明公司仍能拿到资本，也有强投资人兴趣。公开记录还围绕客户数、美国采用、以及多职能平台扩张给出有分量的增长表述。Companies House 文件进一步支持一个判断：Luminance
              是一家持续获得资本支持的公司，不是只有叙事的创业公司；股本配发更新、公司章程演变、治理动作也在继续。但这些文件同样凸显还有多少内容被藏住。投资者能看到优先股和增长股存在，却看不到完整的收益分配瀑布；能看到公司提交了账目，却无法提取真正做投资判断所需的经营报表细节。公开领域引用最多的收入数字，仍是第三方估计，不是公司披露。这正是私人市场热度可能跑在证据质量前面的结构。正确解读既不是否定，也不是亢奋；Luminance
              大概率值得严肃尽调，但不值得盲目给溢价倍数。
