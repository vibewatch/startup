      - number: '5.3'
        title: 部署、信任控制与产品风险
        blocks:
          - type: paragraph
            body: >-
              Luminance 的信任体系是其公开产品论证中最强的部分之一。安全页面列明 ISO 27001 和 SOC 2 认证、AWS
              托管，以及在虚拟云环境或客户自有环境中部署的灵活性。它还强调由高级网络安全和情报人士组成的安全顾问委员会。产品页面增加了工作流层控制：合规检查可以对照制裁名单和媒体曝光运行；谈判可以使用既有措辞、模板和操作手册；分析可以触发义务提醒和异常检测；调查工作流可以检测并遮蔽
              PII。合作伙伴页面还暗示了一个实施生态，覆盖就绪度评估、采用管理和集成支持；这一点很重要，因为产品广度会提高推出复杂度。即便如此，公开缺口仍有意义。本报告保留页面没有公开状态页、详细 uptime
              历史、基准测试包、模型评估方法、证书范围文件，也没有可比于横向软件领导者的公开开发者/API
              计划。招聘页面只能作为很弱的从业者代理信号，说明公司仍在招聘并投入产品人才。平衡后的结论是：控制叙事可信，但验证深度仍薄于营销深度。投资人因此应要求私下查看信任中心材料、实施参考和任务级质量指标，再把产品成熟度视为充分承销。公开证据本身不能替代扎实的实施尽调。
