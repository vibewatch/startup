      - CV009
      - CV011
      - CV012
      - CV021
      - CV029
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 对最可能影响 Luminance 可支撑估值区间的因素给出 0-10 序数敏感性评分。
    data:
      items:
        - label: 经审计 ARR 披露
          value: 10
          unit: /10
          note: 最直接的分母解锁项
        - label: 留存和集中度明细
          value: 10
          unit: /10
          note: 决定能否适用溢价倍数
        - label: 毛利率 / 模型成本清晰度
          value: 9
          unit: /10
          note: 区分优质软件增长和低质量增长
        - label: 股权结构表和受偿顺位清晰度
          value: 9
          unit: /10
          note: 决定名义 EV 之外的实际经济收益
        - label: 跨职能扩张证明
          value: 7
          unit: /10
          note: 支撑公开 ARR 估计的上行空间
        - label: 公开可比公司倍数环境
          value: 6
          unit: /10
          note: 即便执行良好，外部重定价仍有风险
    approximationNotes: 评分是定性敏感性排序，不是百分比变动；分数越高，越有能力移动本章可支撑的价格。
    claimRefs:
      - CV009
      - CV016
      - CV020
      - CV030
      - CV031
      - CV032
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准和乐观企业价值区间显示，只有在支撑最充分的情景下，独角兽式估值标记才可能成立。
    data:
      items:
        - label: 悲观重定价区间
          low: 300
          high: 500
          unit: USD M
          detail: 公开 ARR 估计加较低端工作流倍数，以及尚未解决的不透明问题
        - label: 基准承销区间
          low: 550
          high: 800
          unit: USD M
          detail: 公司质地强，但目前只能支撑相对精选公开可比公司适度溢价
        - label: 乐观执行区间
          low: 900
          high: 1200
          unit: USD M
          detail: 需要 ARR 大幅更高、留存具备溢价水平，且受偿顺位条款干净
    approximationNotes: 区间是稀释、优先权或精确瀑布分配影响之前的企业价值范围，因为这些条款仍有一部分未公开。
    claimRefs:
      - CV013
      - CV017
      - CV018
      - CV019
      - CV020
      - CV022
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 仅使用保留的公开证据，对 Luminance 当前投资逻辑给出 IC 风格评分视图。
    approximationNotes: 评分是基于章节证据综合出的 0-10 定性判断，不来自正式评分模型。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          detail: 法律和合同智能场景很大，具备跨职能扩张潜力
        - label: 产品差异化
          value: 7
          unit: /10
          detail: 法律专用 AI 叙事和广泛工作流覆盖可信，但公开基准验证仍不充分
        - label: 客户证明和规模
          value: 7
          unit: /10
          detail: 全球客户证明已有一定分量，但耐久性指标仍未公开
        - label: 财务透明度
          value: 3
          unit: /10
          detail: 核心 ARR、留存和毛利率证明仍不完整
        - label: 股权结构表清晰度
          value: 3
          unit: /10
          detail: 优先股分层可见，实际经济收益不可见
        - label: 执行风险
          value: 5
          unit: /10
          detail: 多模块、多职能扩张需要承受真实竞争压力
        - label: 入场估值纪律
          value: 4
          unit: /10
          detail: 公开证据目前无法清晰支持支付足额溢价估值
        - label: 证据质量
          value: 5
          unit: /10
          detail: 方向性叙事不错，承销精度不足
    claimRefs:
      - CV008
      - CV009
      - CV011
      - CV012
      - CV020
      - CV021
      - CV029
      - CV036
