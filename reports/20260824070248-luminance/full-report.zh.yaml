chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品边界与当前规模
        blocks:
          - type: paragraph
            body: >-
              Luminance 将自己定位为专为合同和企业法律工作流打造的法律级 AI
              平台，而不是把通用大语言模型重新包装给法律行业。当前官方页面描述的是一套端到端平台，覆盖起草、谈判、分析、合规、调查和协作，并带有可并行执行多项任务的多智能体工作流层。技术页面称，公司采用多模型 “Panel
              of Judges”
              架构，组合自研、微调、向量嵌入、推理和商业模型，输出在交付前先经过检查和验证。这一定位重要，因为法律买家通常更看重可验证性、准确性和工作流适配，而不是模型新颖性本身。公开规模披露也在持续抬升：第三方和公司来源从
              2024 年 Series B 前后的 70 个国家 600 家组织，推进到 2025 年 Series C 时的 700+ 客户，再到 2026 年官方页面和新闻稿中的 70+ 个国家 1,000+
              组织。当前页面还称，公司已进入全部 Big Four 咨询机构以及超过四分之一的 Global Top 100 律所，这支持一种判断：Luminance 已经从小众尽调工具，走向具备实质跨国触达的企业平台。
