  - id: FU004
    title: 留存 / 重复队列
    type: cohort
    layout: standard
    summary: 按部署类型给出的耐久性代理指标；Luminance 不披露真实客户留存队列和全球续约周期。
    data:
      columns:
        - 试点到生产延续
        - 第 1 年活跃使用
        - 第 2 年活跃使用
        - 续约可见度
      rows:
        - label: 仅法务部署（代理指标）
          values:
            - 78
            - 66
            - 54
            - 18
        - label: 跨职能合同智能部署（代理指标）
          values:
            - 86
            - 74
            - 63
            - 24
        - label: 战略治理级账户（代理指标）
          values:
            - 90
            - 80
            - 70
            - 30
    approximationNotes: 仅为代理百分比。这些数值反映公开案例中的相对切换成本和扩张信号，不是公司披露的留存数据，只用于呈现耐久性缺口。
    claimRefs:
