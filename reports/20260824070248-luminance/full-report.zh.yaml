  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 作者编码的热力图显示，信任、依赖和不透明风险的影响仍然很高，尽管短期概率不同。
    data:
      columns:
        - 输出 / 责任
        - 安全 / 保密
        - 平台依赖
        - 客户不透明度
        - 资本 / 治理
      rows:
        - label: 概率
          values:
            - 中
            - 中低
            - 中
            - 高
            - 中
        - label: 影响
          values:
            - 高
            - 极高
            - 中高
            - 高
            - 中高
        - label: 缓释成熟度
          values:
            - 中低
            - 中
            - 中低
            - 低
            - 中低
        - label: 剩余暴露
          values:
            - 高
            - 高
            - 中高
            - 高
            - 中
    approximationNotes: 热力图数值是基于公开证据综合出的分析评级，不是精算概率。
    claimRefs:
      - CR002
      - CR004
      - CR012
      - CR018
      - CR023
      - CR027
      - CR036
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: DAG 展示信任、平台和披露风险如何传导为销售放慢、续约信心走弱、利润率承压和估值支撑下降。
    data:
      nodes:
        - id: hallucination
          label: 输出错误 / 幻觉
        - id: breach
          label: 安全事件
        - id: partner
          label: 平台成本或路线图变化
        - id: opacity
          label: 留存 / 集中度不透明
        - id: trust
          label: 客户信任受损
        - id: sales
          label: 销售周期拉长
        - id: renewal
          label: 续约信心走弱
        - id: margin
          label: 利润率压力
        - id: finance
          label: 融资 / 定价压力
        - id: valuation
          label: 估值压缩
      edges:
        - from: hallucination
          to: trust
        - from: breach
          to: trust
        - from: partner
          to: margin
        - from: opacity
          to: finance
        - from: trust
          to: sales
        - from: trust
          to: renewal
        - from: sales
          to: finance
        - from: renewal
          to: finance
        - from: margin
          to: finance
        - from: finance
          to: valuation
    approximationNotes: 边表示因果路径，不是量化概率或权重。
    claimRefs:
      - CR015
      - CR018
      - CR022
      - CR023
      - CR028
      - CR030
      - CR036
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 依赖图梳理塑造 Luminance 风险画像的几股最显眼外部力量。
    data:
      nodes:
        - id: luminance
          label: Luminance
        - id: azure
          label: Azure / OpenAI 技术栈
        - id: customers
          label: 企业法务 / 采购买方
        - id: investors
          label: 优先股资本基础
        - id: regulators
          label: EU / 版权 / 信任规则
        - id: incumbents
          label: 在位法律科技套件
      edges:
        - from: azure
          to: luminance
        - from: customers
          to: luminance
        - from: investors
          to: luminance
        - from: regulators
          to: luminance
        - from: incumbents
          to: luminance
    approximationNotes: 这张依赖图纳入了结构性力量；即便它们不是双边商业合同，也会塑造经济性。
    claimRefs:
      - CR012
      - CR018
      - CR021
      - CR026
      - CR034
      - CR035
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 逻辑图说明，在当前公开证据下，公司质量信号很强，但结论仍只能到观察，而不是买入。
    data:
      nodes:
        - id: scale
          label: 全球客户和产品规模
        - id: growth
          label: 融资和增长势能
        - id: support
          label: 值得关注的公司
        - id: opacity
          label: ARR / 留存 / 受偿顺位不透明
        - id: comps
          label: 公开可比公司估值纪律
        - id: track
          label: 观察，不是买入
      edges:
        - from: scale
          to: support
        - from: growth
          to: support
        - from: opacity
          to: track
        - from: comps
          to: track
        - from: support
          to: track
    approximationNotes: 这是推荐逻辑链，不是概率决策树或 DCF。
    claimRefs:
