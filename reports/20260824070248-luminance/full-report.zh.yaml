      - number: '2.2'
        title: 规模测算视角：为什么表观 TAM 差异这么大
        blocks:
          - type: paragraph
            body: >-
              已发布市场估计差异很大，因为研究者测量的不是同一件事。广义法律 AI 预测给出的数字远高于聚焦 CLM 的市场，而一些分析师还把研究、eDiscovery、合规和更广泛法律科技自动化纳入其中，这些领域
              Luminance 只能部分覆盖。Fortune Business Insights 将法律 AI 软件市场放在 2026 年 USD 5.21 billion，高于 2025 年的 USD 4.02
              billion；Technavio 的 AI 法律科技报告将 2025 年该细分市场估值为 USD 1.83 billion；Grand View 的法律 AI 市场从 2024 年 USD 1.45
              billion 起步，到 2030 年达到 USD 3.90 billion；另一份 Technavio 报告称，2025 至 2030 年法律 AI 软件将扩张 USD 3.51
              billion。相比之下，The Business Research Company 和 Future Market Insights 的 CLM 专项报告，把 2025–2026 年品类规模放在更接近 USD
              1.7–1.8 billion 的位置。这个区间不是令人困惑，而是有分析价值：它说明广义法律 AI 外壳有意义，但 Luminance
              的可服务市场应从更窄的企业合同楔子来三角定位，而不是直接套用完整软件外壳。因此，最稳妥的投资测算，是把法律 AI 当作外圈语境，把 CLM 式企业合同看作更近的需求池。
