            body: >-
              最好的公开资本存续信号是融资事件和监管文件，而不是经营报表。官方来源支持 2024 年 $40 million Series B 和 2025 年 $75 million Series C，Sacra
              则估计累计融资为 $165 million。Companies House 提供了有用但仍不完整的细节。公司概览页显示，最近账目截至 31 December 2024，下一份账目应于 30 September
              2026 前提交；提交历史确认这些 2024 年集团账目已于 2 October 2025 提交。2026 年 SH01 文件显示公司仍在配发股份，2026 年 4 月文件文本则披露了分层资本结构，包括
              Series A、Series B 和 Series C 优先股，以及 B 普通股和增长股，并附带清算优先权机制。2025 年末和 2026 年中的董事任命文件显示，Series C
              之后董事会和资本化环境仍在演进。这些事实足以说明，Luminance
              仍在积极资本化，且没有明显资金短缺。它们不足以衡量下行韧性。公开来源仍未披露手头现金、月度烧钱速度、现金跑道、债务、契约约束敞口、总留存率（GRR）、净留存率（NRR）或客户集中度。因此，本章只能在表层支持正面的资本充足性判断，不能完成充分承销的下行情景判断。
