            body: >-
              公开页面显示，产品架构和买方叙事存在清晰分层。Luminance、SpotDraft、Leah、Docusign、Ironclad、LinkSquares、Workday/Evisort 和 Agiloft
              都把合同描述为触及法律、采购、合规、财务或销售的企业工作流系统。Harvey、CoCounsel、LexisNexis Protégé 和 Clio Work
              则更突出法律推理、文档分析或事项导向辅助。Litera Kira 最接近尽调与抽取专家。公开定价远不如能力叙事透明：Docusign 在本报告保留页面上提供 ROI
              和企业引用，但没有标价；大多数企业级对手也同样要求演示或销售接洽。市场中摩擦更低的一端，更多由 ContractSafe、Legito 和部分 SMB
              法律工具等更简单或更偏自动化的替代品代表，但这些选择在企业级工作流广度上显得更弱。可投资含义是，功能广度可以公开比较，但实际成交价、年度合同价值（ACV）和折扣无法比较。因此，Luminance
