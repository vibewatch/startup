  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与细分定位
        blocks:
          - type: paragraph
            body: >-
              Luminance 位于一个多层竞争场。直接层包括 Docusign CLM、Ironclad、SpotDraft、Leah、LinkSquares、Workday/Evisort、Agiloft 和 Juro
              等企业 CLM 与 AI 合同厂商，它们都主打工作流自动化、合同库控制，以及超出纯法律审阅的跨职能价值。第二层由 Thomson Reuters CoCounsel 和 LexisNexis Protégé
              等法律工作存量平台组成，它们靠权威内容、推理和起草能力切入相邻高价值工作，而不是端到端合同运营。第三层是 Litera Kira、ContractSafe、Legito 和 Clio Work
              等专门审阅工具或较小替代品，它们解决更窄任务，或面向不同客户细分。现实替代仍是内部自建和碎片化现状：Word、邮件、电子表格、共享驱动器和通用企业系统。这意味着 Luminance
              不只是和某一个对手产品竞争；它卖的是一个切入楔子，必须同时在工作流上胜过合同平台，在信任、法律专属性和企业执行上胜过存量巨头。另一个含义是，预算归属会在法律、采购和更广泛转型团队之间移动，取决于哪个对手先定义问题。
