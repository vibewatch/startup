            body: >-
              情景逻辑直接来自证据缺口。乐观情景假设，Luminance 的 2026 年收入运行率显著高于 Sacra 对 2025
              年底的估计，核心法律以外的扩张确实粘性强，留存、利润率和资本结构尽调结果也都接近高端软件水平。在这种情况下，数亿美元高位的估值可以向独角兽门槛延伸。基准情景更保守，也更贴近公开来源真正能证明的事实：Luminance
              是一家强公司，但投资者仍主要在给叙事增长定价，留存和优先级细节不足，因此更指向数亿美元中段，而不是干净地向上追。悲观情景不是业务失败，而是重定价。如果当前 ARR
              更接近公开估计而非私人市场热情，客户耐久性弱于预期，或 AI
              工作流倍数收缩，那么估值支撑可能远低于任何隐含的独角兽愿望，而且不需要产品质量崩塌。关键在于，这里的下行主要是估值错误和信息风险，不是明显的近期偿付风险。
