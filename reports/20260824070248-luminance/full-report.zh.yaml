            body: >-
              Luminance 的变现看起来由企业销售驱动，公开层面高度不透明。本报告保留的官方页面没有披露席位定价、标价档位或产品包装菜单，这强烈暗示销售动作由报价驱动。Sacra
              将其描述为直接销售给律所、公司法律部门、会计师事务所和替代法律服务提供商的 B2B SaaS 模式，订阅费会随用户数、使用量或企业许可证范围而变化。Sacra 还称，公司已经拿下七位数多年期订阅，这与
              Luminance 的蓝筹客户名单以及其瞄准的法律和采购工作流方向一致。公开来源揭示的商业化路径更多是行为线索，而不是算术：Series B 博文称，资金将用于全球增长、扩大需求承接并维持创新；Series C
              新闻稿称，资金将加速美国增长、新办公室和采购、合规中的相邻用例；Sacra 称，法律科技销售周期可达六到 12 个月，通常需要试点和参考客户。这一组合意味着一种高接触的企业商业化动作，并可能带来较大
