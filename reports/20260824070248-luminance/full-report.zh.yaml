              Luminance 与大型、合同密集型组织绑定，而不是消费者或 SMB 细分。客户顾问委员会公告点名 BBC Studios、Ingram Micro、Staples Canada、Imerys 和
              Slaughter and May 的高级领导，也进一步支持这种企业形态。因此，商业图景是一块跨职能企业客户面：法律位于中心，但不是边界。公开细分结构也暗示，Luminance
