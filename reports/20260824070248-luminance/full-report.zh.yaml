              第三组风险是商业不透明。公开客户证明足以支撑落地后扩张故事，但不足以承销续约质量。Sacra 以及产品/客户材料支持一种企业级、多利益相关方销售动作，销售周期长且具备有意义 ACV
              潜力。与此同时，公开记录仍未披露 NRR、GRR、logo 流失率、队列存续、头部客户集中度，或按地域和职能拆分的收入。这个缺口重要，因为法律 AI 公司可以在 logo
              上显得很宽，却在持久生产支出上很浅。资本结构增加了第二层不透明。Companies House
              文件清楚显示持续配发股份，以及一个包含优先股、普通股和增长股的堆栈；但公开证据仍没有给出清晰分配瀑布、清算优先权摘要或现金跑道桥。投资人因此能看到资本继续流入，却无法完全看清下行会如何分配，或任何表面估值标记之下到底还有多少经济价值。最佳商业解读是，Luminance
              看起来没有陷入困境，但投资人仍被要求用叙事填补太多空白：公开增长主张、参考客户和融资事件可见；续约数学和已实现股权经济性不可见。
