      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 桥接
        - 经审计 2024-2026 ARR 和当前收入运行率
        - 把叙事规模转成实际估值分母
        - CFO / 财务尽调
      - - 留存质量
        - NRR、GRR、流失率、续约时点、试点到生产转化
        - 判断 Luminance 是否配得上溢价工作流倍数
        - 收入运营和董事会材料尽调
      - - 毛利率 / 服务成本
        - 包含云 / 模型支出和服务强度的利润率桥
        - 区分溢价软件和低质量增长
        - 财务 + 产品基础设施尽调
      - - 股权结构表 / 优先级
        - 优先股堆叠、稀释、权利，以及任何债务或契约细节
        - 决定投资者实际经济性，而不只是名义 EV
        - 法务 / 融资尽调
      - - 客户集中度
        - 前 10 / 前 20 收入占比和重大续约日程
        - 检验规模是分散的，还是集中在少数大客户
        - CRO / FP&A 尽调
      - - 平台依赖
        - 与外部模型 / 云伙伴绑定的成本或性能占比
        - 检验利润率和路线图假设的韧性
        - CTO / 基础设施尽调
    notes: 这些要求是从价格敏感的观察推进到能完整背书的投资判断所需的最低数据。
