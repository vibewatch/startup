      - number: '5.2'
        title: 架构、数据与运营模型
        blocks:
          - type: paragraph
            body: >-
              公开来源给出了连贯但仍不完整的架构故事。AI 技术页面称，Luminance 采用多模型方法，混合自研系统、微调开源模型、向量嵌入模型、推理模型和商业模型。公司称之为 “Panel of
              Judges”，多个模型相互检查，编排层充当最终验证者。官方页面还强调智能体 AI、并行工作流执行和法律专用验证；白皮书称，系统吸收了 150+ million
              份经验证法律文档的信息，并从一开始就为法律场景构建。Compete366 案例研究补充了有用的运营细节：公司原本已有作为 SaaS 在 AWS 上交付的自研 AI，之后试验 GPT-4，并进一步推进 Azure
              OpenAI 采用和优化，用于聊天等生成式扩展。合起来看，最好的公开解读是，Luminance
              不是单模型包装器。它更像一个编排层，坐在自研法律模型、外部模型服务、合同数据、工作流逻辑和企业界面之上。缺失的是足以让投资人审计延迟、基准方法、回退行为或按任务拆分错误率的工程细节。同样缺口也存在于面向开发者的证据：本报告保留材料中没有强公开
