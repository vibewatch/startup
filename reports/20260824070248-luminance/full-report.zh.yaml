      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              法律 AI 采用不再局限于顶级律所或 M&A 审阅团队。Luminance 自家网站面向法律、合规、采购、财务、HR、销售、营销和高管；Leah 也明确把自己放在法律、合同、采购和财务之间。SpotDraft 与
              Docusign 在法律控制之外强调业务工作流，Clio Work 则说明，以事项为中心的法律 AI 可以延伸到小型律所和诉讼场景。Luminance
              最高价值的切入点看起来仍是大型企业和成熟律所，它们处理复杂、高量合同，并承担治理义务。在这一细分中，用户可能是律师或采购专业人士，但付款方可能坐在总法律顾问、法律运营、采购负责人、财务转型团队或高管赞助人那里。律所仍是重要早期验证者，因为它们会严苛测试准确性和可辩护性；但企业部门可能是最大的变现池，因为它们既有文档量，也有直接
              ROI 要求。换句话说，Luminance 的买方不只是“律师”，而是希望把合同从瓶颈变成风险、义务和商业情报记录系统的组织。
