      - number: '3.3'
        title: 切换成本、分发力量与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Luminance 的护城河真实存在，但并不是清晰的赢家通吃。强势一面在于，条款库、审阅手册、工作流、权限、合同库和集成落地后，合同系统会深度嵌入组织。Luminance
              也可以可信地主张，法律专用架构很重要，因为官方产品页面仍显示对手优化目标差异很大：权威法律内容、审阅精度、自助文档自动化、合同库控制，或广泛跨职能工作流。弱势一面是，生态正在快速收敛。Harvey、Leah、SpotDraft、Juro、Ironclad、Agiloft、Workday/Evisort、Docusign
              和 LinkSquares 如今都在营销某种 AI 原生或智能体式合同运营；CoCounsel 和 LexisNexis 则带来强大的内容护城河和既有法律分发。多供应商并用也合理：一家公司可以在 CLM
              旁边使用存量研究助手，也可以在边缘继续保留 Microsoft 式现状工具。来自 NCSC 和行业调查的反向证据进一步说明，信任、治理和 ROI 证明仍会卡住采购。因此，投资测算应把 Luminance
              的耐久性看作取决于执行、信任和工作流渗透，而不是单靠 AI 品牌。若没有单一产品同时明确主导研究权威、合同工作流和治理，买家理性上可能偏好混合技术栈。这留下了真实尽调负担：实施深度、续约行为，以及客户是将
              Luminance 标准化，还是只把它放在其他工具旁边。细分市场胜率仍是私有信息。
