  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              判断 Luminance 估值，关键不是公司有没有意思——答案显然是有。公司能拿出全球客户覆盖、法律垂直 AI
              叙事、持续融资支持，以及向多个合同中心职能扩张的产品面。更难的问题是，公开证据是否足以支持今天支付溢价。按这个标准，答案是否定的。官方来源确认了 2024 年 $40 million 左右的 B 轮和 2025
              年 $75 million 的 C 轮，但两轮都没有披露清晰的官方投后估值。Sacra 用估计值补了一部分空白：到 2025 年底年经常性收入（ARR）约 $60 million，累计融资约 $165
              million；但这仍是外部估计，不是经审计的公司披露。公开可比公司也重要。所选工作流和可信数据可比公司，EV/sales 大约在 3.4x 到 11.1x 之间，中位数约 6.2x。把这个框架套到公开 ARR
              估计上，并不能自然推出一个干净、证据充足的独角兽估值。因此，本章给出的建议是「观察」：置信度中等、风险高、估值立场介于偏高与不透明。这不是否定业务，而是在证据不完整时坚持价格纪律。
