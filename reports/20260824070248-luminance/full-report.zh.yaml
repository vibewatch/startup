  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Luminance 的正确市场边界窄于“全部法律服务”，又宽于纯尽调审阅。Luminance 官方叙事把产品定义为覆盖每个合同触点的法律级 AI，从起草、谈判一直延伸到合规、调查和协作。这让公司站在法律 AI
              与合同生命周期管理（CLM）的交叉点，而不是通用生产力软件里。竞争厂商页面也强化了这一边界。Docusign、Ironclad、SpotDraft 和 Leah
              都主打集成工作流、合同库、审批、谈判和分析能力；Litera Kira 和 Harvey 则展示了相邻细分，分别围绕高风险审阅和更广泛的法律工作自动化。现实替代品依旧顽固地老派：Microsoft
              Word、邮件链、外部律师、碎片化合同库，以及缓慢的人工审阅流程。Ironclad 的 CLM 解释页在这里尤其有用，因为它把合同描述为触及组织每一美元流入或流出的对象，并将 CLM
              定位为破损、前数字化法律流程的解法。由此可见，Luminance 的可服务市场由合同密度、治理负担和跨职能工作流痛点定义，而不是由全球律师总数定义。
