      - number: '8.3'
        title: 可比估值桥
        blocks:
          - type: paragraph
            body: >-
              Luminance 最干净的公开可比框架，不是通用横向 AI，而是一篮子工作流软件、专业服务软件和可信信息平台。DocuSign 锚定区间下沿：它是有 CLM 邻近性的规模化工作流平台。Intapp
              尤其有参考价值，因为它卖进法律和专业服务工作流，反映了市场如何看待嵌入专家工作闭环的软件。Thomson Reuters 加入了可信数据和法律工作流视角；Veeva 与 Guidewire
              则说明，当披露和客户嵌入强得多时，公开市场愿意为深度嵌入、任务关键型垂直平台支付什么价格。按当前公开快照，这些可比公司的 EV/sales 大约在 3.4x 到 11.1x 之间。这并不意味着 Luminance
              应落在低端。它增长快过成熟巨头，也带有私人市场 AI 期权价值。但公开可比公司更透明，通常应承受更少而不是更多的不确定性折价；相比之下，Luminance
              的留存和股权条款仍不透明。因此，本章把可比区间上沿视为有条件争取，而非默认应得。
