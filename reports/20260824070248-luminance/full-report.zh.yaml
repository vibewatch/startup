  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ARR 支撑破裂
        - 经审计 ARR 明显低于本章使用的公开估计区间
        - 同时削弱溢价增长叙事和可比公司桥
        - 转向放弃，或按悲观情景估值重新测算
      - - 留存不及预期
        - NRR 或续约数据未达到溢价软件门槛
        - 推翻乐观情景，并削弱支付高于可比公司中位数倍数的意愿
        - 下调估值区间和信心
      - - 优先级意外
        - 尽调暴露激进优先权、隐性债务或投资者保护条款
        - 即便名义 EV 看似稳定，也会削减实际价值
        - 要求价格重置，否则放弃
      - - 信任事件
        - 安全事件或被广泛引用的输出失败打击旗舰企业背书
        - 同时损害客户背书、销售效率和估值
        - 在影响范围和补救措施清楚前暂停投资案
      - - 融资重置
        - 下一轮或老股交易标记低于隐含溢价叙事
        - 表明市场纪律比近期故事暗示的更硬
        - 视为重定价证据，而不是短期噪音
    notes: 否决触发项强调可证伪的尽调条件，而不是宽泛品类担忧。
