  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引
        blocks:
          - type: paragraph
            body: >-
              公开财务图景有清晰商业方向，但数字披露不完整。Luminance 官方来源反复把公司描述为面向大型组织销售的企业法律 AI 平台，公司 2024–2025
              年融资公告也指向订阅式软件经济性，而不是交易费或纯项目服务。最强的官方增长信号是方向性的，并非完全可审计：Series C 新闻稿称，核心 Corporate 产品在此前两年客户数增长五倍、ARR
              增长六倍；Dallas 扩张新闻稿称，ARR 两年增长超过五倍，美国 Corporate 客户采用自 2023 年 1 月以来增长 225%。Sacra 给出更明确的收入估计，称到 2025 年末 ARR 约
              $60 million，高于一年前约 $30 million。官方规模说法也从 70+ 个国家 700+ 组织，演进为当前网站上的 70+ 个国家 1,000+ 客户。实际可读出的信息是，Luminance
              很可能有真实的经常性收入势能，但公司仍未发布经审计收入、收入结构或队列质量指标。
