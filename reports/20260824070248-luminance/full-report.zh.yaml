            body: >-
              成本栈看起来像一家现代企业 AI
              软件公司：产品研发、云与模型推理费用、企业上手、客户成功，以及相对昂贵的直销动作。公开来源没有披露毛利率、实施利润率、托管成本或服务强度，因此利润率判断必须从机制推断，而不是从已报告数字出发。Sacra
              明确称，平台建成后业务受益于类似软件的边际经济性，但也说 Luminance 在增长阶段继续重投研发并接受经营亏损。Compete366 案例研究提供了重要运营线索，描述了面向 Luminance 的 Azure
              OpenAI
              优化工作，意味着模型和基础设施选择不仅在技术上重要，也在财务上重要。没有库存、制造或硬件部署，说明资本强度主要来自人、算力和销售投入，而不是实体资本开支。与此同时，漫长的法律科技销售周期、企业实施和产品专门化，如果客户扩张需要时间，都可能推迟回本。结论是，Luminance
              长期大概率具备有吸引力的软件经济性，但公开记录太不完整，无法有把握量化 CAC 效率、混合毛利率，或 AI 推理成本对利润率的影响。
