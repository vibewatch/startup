  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与输出责任风险
        blocks:
          - type: paragraph
            body: >-
              Luminance 处在软件中最不宽容的应用层之一：企业法律工作。这并不自动让它成为受监管律所，但确实意味着产品错误会很快变成信任事件。本报告保留的 NCSC
              法律从业者指引在这里很有用，因为它清晰界定了核心问题：法律 AI 可能编造权威依据、扭曲裁判要旨，或生成看似足够可信的虚假程序信息；一旦人类过度依赖，就可能直接拿来使用。Luminance
              自身定位直接进入起草、谈判、分析、合规、调查和协作，因此只要客户把输出当作高风险工作流中的决策支持，公司就会暴露。EU AI Act 又增加了一层。广泛规则集并非专门针对法律科技，但已经施加与 GPAI
              相关的透明度和版权预期，并围绕更高风险的司法邻近用途建立未来义务。版权和作者身份同样相关，因为公开法律科技买家会关心生成草稿是否可受保护、需要怎样的人类审阅，以及客户 IP
              权利如何处理。公开来源显示，Luminance 大量谈论信任和安全，但仍未提供详细法律风险备忘录、训练数据来源摘要或产品责任历史，无法把这一问题从尽调主题变成已关闭事项。
