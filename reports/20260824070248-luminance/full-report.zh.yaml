      - number: '2.4'
        title: 增长驱动、采用约束与时点
        blocks:
          - type: paragraph
            body: >-
              采用在加速，但市场并非没有摩擦。Ironclad 2026 年报告称，受访团队在法律工作中使用 AI 已接近普遍；Wolters Kluwer 称，超过 90% 的受访者每天至少使用一种 AI
              工具。Thomson Reuters 2025 和 2026 年的研究显示，律所越来越相信 AI 应进入工作流，但许多律所仍难以把战略商业化落地。WorldCC 的合同调查提供了关键企业视角：买家把 AI
              看作提升能力、创新、生产率和合同价值兑现的方式，但许多组织缺少抓住这一价值所需的数据底座、治理和运营模型。最大约束在各来源中反复出现：幻觉风险、数据隐私、培训不足、变革阻力、网络安全担忧，以及难以形成具体商业案例。NCSC
              法律指引进一步放大了信任问题，说明法律 AI 会编造看似合理却虚假的权威依据，因此部署需要验证和清晰护栏。对 Luminance
              而言，时点判断偏正面，但不会自动兑现。需求真实存在，预算兴趣存在，多年期工作流现代化也在推进；但供应商仍需要信任、ROI 证明和变革管理能力，才能把市场兴奋转化为持久企业支出。
