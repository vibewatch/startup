      - number: '7.4'
        title: 人员、执行与投资含义
        blocks:
          - type: paragraph
            body: >-
              执行风险是本章的主线，因为各类风险会彼此叠加。Luminance
              正在招聘、拓展地域、拓宽产品面、补强治理能力；这些本都是成长型公司的正面信号，直到协同开始被拉紧。招聘信号和董事任命都支持一个判断：公司仍在补组织厚度，而不是收割一个稳定成熟的平台。这符合一家想跨多个国家服务法律、采购、财务、合规及相邻工作流的业务。但这种配置也让品类压力可能比预期更快咬上来。Harvey、Docusign、Thomson
              Reuters 和 LexisNexis 都在切同一工作流的不同片段，其中几家还能把 AI 与可信内容、更宽套件或既有分发渠道绑在一起。投资含义是，Luminance
              最重要的风险会彼此传导：一次信任事件削弱企业客户背书，复杂销售周期进一步拉长，利润率和资本压力上升，估值支撑随之变弱。单看任何一个问题，公司大概率能处理；真正的担忧是这些风险同向发生。
