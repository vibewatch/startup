        title: 投资逻辑破坏点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              只有证据质量改善或价格重置，投资判断才该调整。清晰的上调路径很直接：经审计的 ARR
              和留存数据、毛利率桥、客户集中度细节，以及优先级条款的透明摘要，都能让当前叙事更值得认真定价。第二条路径只靠价格纪律。如果入场价格更接近当前公开可比桥能支撑的区间，同一家公司即使业务质量不变，也会更有吸引力。投资逻辑破坏点同样清楚。如果当前
              ARR 显著低于公开估计区间，如果 NRR
              或续约质量达不到高端软件门槛，如果对第三方模型经济性的依赖高于预期，或未来融资披露激进优先级或更软估值，那么投资者应把近期私人市场热情视为叙事高点，而不是稳固的估值地板。因此，本章回到证据本身：Luminance
              值得持续紧密跟踪，但不值得在公开记录仍无法清晰支撑投资判断的价格上硬追。
