      - number: '1.2'
        title: 领导层深度、创始人-市场匹配与信任架构
        blocks:
          - type: paragraph
            body: >-
              领导层质量是 Luminance 最清晰的优势之一。联合创始人 Graham Sills 仍负责 AI 战略，并明确解释平台背后的 Mixture-of-Experts 方法；联合创始人 Adam Guthrie
              仍担任首席技术架构师，聚焦面向客户的技术落地。这种创始人延续性很有价值，因为企业法律 AI 产品在商业化扩张中一旦稀释原始领域架构，往往会失败。CEO Eleanor Lightbody
              看起来补上了缺失的商业扩张层：官方简历强调她的 Darktrace 背景、领导全球扩张的角色，以及对 2025 年 Series C 的主导。总裁 Dan Head、COO Daniel Lumby、CTO
              Greg Pelander 和幕僚长 Jaeger Glucina 又在商业化、运营、工程和客户增长上加深了管理板凳。Luminance 也投入了可见的信任基础设施。安全页面列出 ISO
              27001:2022、SOC 2 Type II、单租户 AWS 环境、客户显式控制权限，以及由前 MI5 和 Darktrace 人士参与的安全顾问委员会。除安全治理外，2026 年 7
              月客户顾问委员会还围绕采用、信任和企业 AI 转型提供面向客户的治理，成员来自 BBC Studios、Staples Canada、Imerys、Slaughter and May，以及前首席大法官 Lord
              Ian Burnett。
