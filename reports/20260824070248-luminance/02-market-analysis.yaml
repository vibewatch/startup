- id: buyers-and-budget-owners
  title: Buyer, user, and payer segmentation
  body: Legal AI adoption is no longer confined to elite law firms or M&A review teams. Luminance’s own website targets legal, compliance, procurement, finance, HR, sales, marketing, and executives, while Leah explicitly positions itself across legal, contracting, procurement, and finance. SpotDraft and Docusign emphasize business workflows alongside legal control, and Clio Work illustrates how matter-centric legal AI can extend into smaller-firm and litigation settings. The highest-value wedge for Luminance still appears to be large enterprises and sophisticated law firms handling complex, high-volume contracts with governance obligations. In that segment, users may be lawyers or procurement professionals, but payers can sit with general counsel, legal operations, procurement leadership, finance transformation teams, or executive sponsors. Law firms remain important as early validators because they stress-test accuracy and defensibility, yet enterprise departments are likely the biggest
    monetization pool because they combine document volume with a direct ROI mandate. Put differently, Luminance’s buyers are not just “lawyers”; they are organizations trying to turn contracting from a bottleneck into a system of record for risk, obligations, and commercial intelligence.
  claimRefs:
