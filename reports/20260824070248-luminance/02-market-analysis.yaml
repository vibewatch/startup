- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and timing
  body: 'Adoption is accelerating, but the market is not frictionless. Ironclad’s 2026 report says AI usage for legal work is near universal among surveyed teams, while Wolters Kluwer says more than 90% of respondents use at least one AI tool daily. Thomson Reuters’ 2025 and 2026 work suggests firms increasingly believe AI belongs in workflow, but many still struggle to operationalize strategy commercially. WorldCC’s contracting surveys add a critical enterprise lens: buyers see AI as a way to improve capability, innovation, productivity, and contract value realization, yet many lack the data foundations, governance, and operating models needed to capture that value. The biggest constraints repeat across sources: hallucination risk, data privacy, inadequate training, resistance to change, cybersecurity concerns, and difficulty making a concrete business case. NCSC legal guidance sharpens the trust problem by explaining how legal AI can fabricate plausible but false authorities, which means
    deployment requires verification and clear guardrails. The timing implication for Luminance is constructive but not automatic. Demand is real, budget interest exists, and multi-year workflow modernization is underway—but vendors still need trust, ROI proof, and change-management capacity to translate market excitement into durable enterprise spend.'
