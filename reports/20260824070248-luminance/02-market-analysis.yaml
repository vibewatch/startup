  evidenceGaps:
  - type: missing-source
    severity: material
    topic: luminance-som
    missingEvidence: Segment-level pricing, ACV, and customer-mix data specific to Luminance.
    whyItMatters: Without revenue by customer segment and contract size, a public SOM remains a narrative wedge rather than an underwriting-grade market model.
    diligencePath: Request management data on ACV, seat counts, and revenue split across enterprise legal, law firms, procurement, and compliance.
    relatedQuestionRefs:
    - QM020
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-size-dispersion
    missingEvidence: Comparable like-for-like market definitions across legal AI and CLM research publishers.
    whyItMatters: Publisher TAMs look contradictory when they may simply be measuring different shells; preserving that difference avoids false precision.
    diligencePath: Normalize each report by included workflows, excluded categories, geography, and forecast base year before using any single figure in valuation work.
    relatedQuestionRefs:
    - QM006
    - QM024
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Win rates, implementation timelines, and renewal or expansion data by buyer segment.
    whyItMatters: The market is clearly active, but vendor success depends on whether pilots convert into durable enterprise revenue with acceptable payback.
    diligencePath: Obtain internal funnel metrics, deployment length, and expansion/retention data under NDA.
    relatedQuestionRefs:
    - QM010
    - QM015
    - QM025
