- id: sizing-lenses
  title: 'Sizing lenses: why the headline TAM changes so much'
  body: 'Published market estimates vary materially because researchers are not measuring the same thing. Broad legal-AI forecasts produce much larger numbers than CLM-focused markets, while some analysts fold in research, eDiscovery, compliance, and broader legal-tech automation that Luminance can only partly address. Fortune Business Insights puts the legal AI software market at USD 5.21 billion in 2026 after USD 4.02 billion in 2025; Technavio’s AI legal-tech report values the segment at USD 1.83 billion in 2025; Grand View’s legal-AI market starts from USD 1.45 billion in 2024 and reaches USD 3.90 billion by 2030; and another Technavio report says legal AI software will expand by USD 3.51 billion from 2025 to 2030. By contrast, CLM-specific reports from The Business Research Company and Future Market Insights place the 2025–2026 category nearer USD 1.7–1.8 billion. That spread is analytically useful rather than confusing: it shows the broad legal-AI shell is meaningful, but Luminance’s
    serviceable market should be triangulated from the narrower enterprise-contracting wedge rather than from the full software shell. The safest underwriting approach is therefore to treat legal AI as outer-bound context and CLM-like enterprise contracting as the nearer demand pool.'
