    - negative
    - persistent
    - Pushes buyers toward secure, governable, auditable tools
    - How often do security reviews stall procurement?
  - - Unclear monetization models inside law firms
    - negative
    - medium-term
    - May slow expansion from experimentation to profitable production use
    - How are firms pricing or sharing AI-enabled productivity gains?
  notes: Pairs growth catalysts with the operational frictions most likely to delay enterprise conversion or widen deployment cycles.
