- id: leadership-and-governance
  title: Leadership depth, founder-market fit, and trust architecture
  body: 'Leadership quality is one of Luminance’s clearest strengths. Co-founder Graham Sills still leads AI strategy and explicitly describes the Mixture-of-Experts approach behind the platform, while co-founder Adam Guthrie remains the chief technical architect focused on customer-facing technical execution. That founder continuity is valuable because enterprise legal AI products often fail when the original domain architecture gets diluted during go-to-market scaling. CEO Eleanor Lightbody appears to have supplied the missing commercial scaling layer: official biographies highlight her Darktrace background, her role in leading global expansion, and her stewardship of the 2025 Series C. President Dan Head, COO Daniel Lumby, CTO Greg Pelander, and Chief of Staff Jaeger Glucina deepen the bench across GTM, operations, engineering, and customer growth. Luminance has also invested in visible trust infrastructure. Its security page cites ISO 27001:2022, SOC 2 Type II, single-tenant AWS environments,
    explicit customer-controlled permissions, and a security advisory board with former MI5 and Darktrace figures. Separate from security governance, the July 2026 Customer Advisory Board adds customer-facing governance around adoption, trust, and enterprise AI transformation, with members from BBC Studios, Staples Canada, Imerys, Slaughter and May, and former Lord Chief Justice Lord Ian Burnett.'
