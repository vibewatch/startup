  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Authoritative post-money valuation, cap table, and any secondary transactions tied to the latest round.
    whyItMatters: Without a disclosed valuation it is impossible to test whether current enthusiasm already prices in future growth, which weakens any precise investment conclusion.
    diligencePath: Request board-approved financing documents, latest cap table, and any investor presentation used in the Series C process.
    relatedQuestionRefs:
    - QO010
    - QO022
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, burn, and current headcount figures.
    whyItMatters: Growth claims are directionally strong, but efficiency, durability, and cash needs cannot be evaluated from public material alone.
    diligencePath: Obtain audited or management financial statements plus headcount and cohort retention data under NDA.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: A complete and current board roster with observer rights and committee structure.
    whyItMatters: Governance quality and investor control dynamics matter for a late-stage private company pursuing aggressive global expansion.
    diligencePath: Ask management for board composition, committee membership, and any advisory-to-board reporting relationships.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO002
