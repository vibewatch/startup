company:
  name: Luminance
chapter:
  number: 1
  title: Company Overview
  summary: Luminance is a Cambridge-founded, London-headquartered legal AI vendor that has expanded into a global contract-intelligence platform with 1,000+ organizations across 70+ countries on current official pages. Publicly supportable capital disclosures show a $40 million Series B in 2024 and a $75 million Series C in early 2025, while valuation remains undisclosed despite clear evidence of strong customer, office, and product expansion.
sections:
- id: identity-and-scale
  title: Identity, product scope, and current scale
  body: 'Luminance presents itself as a Legal-Grade AI platform built specifically for contracts and enterprise legal workflows rather than a generic large language model repackaged for law. Current official pages describe an end-to-end platform spanning drafting, negotiation, analysis, compliance, investigation, and collaboration, with a multi-agent workflow layer that can execute multiple tasks in parallel. The technology page says the company uses a multi-model “Panel of Judges” architecture, combining proprietary, fine-tuned, embedding, reasoning, and commercial models so outputs are checked and validated before delivery. That positioning matters because legal buyers tend to care more about verifiability, accuracy, and workflow fit than raw model novelty. Public scale disclosures have also stepped up over time: third-party and company sources moved from 600 organizations in 70 countries around the 2024 Series B, to 700+ customers by the 2025 Series C, and to 1,000+ organizations across
    70+ countries on 2026 official pages and press releases. Those current pages also claim penetration across all Big Four consultancies and more than a quarter of the Global Top 100 law firms, which supports a view that Luminance has moved beyond niche due-diligence tooling into an enterprise platform with meaningful multinational reach.'
  claimRefs:
