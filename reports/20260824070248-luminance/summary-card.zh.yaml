  topStrengths:
    - 法律级 AI 产品面广，覆盖起草、谈判、分析、合规、调查和协作。
    - 公开客户证明有分量，覆盖 70+ 国家 1,000+ 机构，并有具名企业背书。
    - 融资时间线和 Companies House 持续动态显示，公司仍有资本支持，而非已经显露困境。
    - 公司在 legal AI 和 contract intelligence 中具备可信品类相关性，企业用例也超出核心法务团队。
  topRisks:
    - 公开证据仍未披露经审计 ARR、留存、毛利率、客户集中度，也没有干净的官方估值锚。
    - 文件能看到优先股层层叠加，但没有完整 waterfall 和优先级摘要，投资人的实际经济性仍不清楚。
    - 法律工作流一旦因幻觉、保密问题或宕机失去信任，企业背书和估值支撑可能很快受损。
    - 平台和模型依赖，包括 Azure OpenAI 优化信号，可能带来利润率和路线图敞口。
    - Harvey、DocuSign、Thomson Reuters、LexisNexis 以及相邻 incumbent 的竞争挤压，可能限制溢价倍数支撑。
  unresolvedGaps:
    - 留存公开来源仍拿不到经审计的 2024-2026 ARR、当前运行率和收入结构。
    - NRR、GRR、流失率、试点转生产转化率和头部客户集中度仍是私有信息。
    - 毛利率细节，以及服务成本对外部模型或云合作伙伴的敏感度，尚未公开披露。
    - 完整优先股堆叠、稀释时间表，以及任何债务或 covenant 条款，公开渠道看不到。
    - 留存公开来源没有给出 2024 年或 2025 年融资的干净官方投后估值。
    - 公开韧性证据在 uptime、事件历史和外部审计结果上仍太薄。
