summary:
  headline: Bolt 是欧洲最可信的 Uber 挑战者，超级 App 经济性已跑到现金流为正；但 IPO 逻辑面临 £200M+ 英国法律负债和欧盟劳动力成本重构周期，投资前必须先建模。
