artifact: customers
slug: bolt
runDate: 2026-05-18
company:
  name: Bolt
chapter:
  number: 6
  title: Customers
  summary: "Bolt has accumulated over 200 million registered users as of January 2026, with ~40–45 million monthly active users across ride-hailing, food delivery, and micromobility. Geographic concentration is heaviest in CEE and sub-Saharan Africa (top 5 markets ~55% of GMV). Customer proof is strong in B2C (Trustpilot 3.9/5, app store 4.5/5) and growing in B2B (Bolt Business: 30,000+ corporate accounts, G2 4.1/5, ~18% of ride-hailing revenue). Bolt Pass, launched mid-2025 at €9.99/month, reached 1.2 million subscribers in 3 months. Key gaps: no public NRR/GRR or cohort retention data; CAC and CLV are inferred not disclosed. Adverse signals include inconsistent support quality, Uber's higher acceptance rate (91% vs 87%), and limited Western European brand awareness."

sections:
  - id: section-segmentation
    title: "Customer Segmentation"
    body: |
      Bolt's customer universe spans four distinct buyer/payer/user archetypes across consumer, enterprise, and supply-side segments. The largest cohort by trip volume is urban commuters (~40% of rides), who use Bolt for daily point-to-point travel in cities where Bolt operates. These are primarily direct-pay consumers booking via the Bolt app, price-sensitive relative to Uber, and the primary target for Bolt Pass. The second consumer cohort—occasional and leisure riders (~30%)—uses Bolt for evenings, weekends, or event travel; higher churn, more promotional-credit-sensitive, and more likely to multi-home with Uber.

      Corporate and B2B users (~18% of ride-hailing revenue) are the highest-value payer segment. Over 30,000 companies across 50+ countries use Bolt Business for centralised billing, travel policy enforcement, and SAP Concur/Expensify integration. The enterprise segment exhibits lower churn, higher average order value (€12–18 per trip), and a longer retention horizon (3–5 years) than consumer segments. Tourist and airport riders (~12%) are an episodic high-fare segment with limited loyalty potential.

      Geographically, Bolt is strongest in CEE (Romania, Poland, Estonia, Ukraine), sub-Saharan Africa (Nigeria 4M+ MAU, Kenya), and the UK. It is a challenger in France and Spain (aided brand awareness <40%) and a minor presence across the Middle East, South America, and early-stage North America (via the Hopp brand in Toronto and Washington DC). Bolt Food adds a food-delivery user base of ~12 million monthly active users across 13 countries, with the highest density in the Baltics, Romania, and Poland. Micromobility users (Bolt Scooters/Bikes) are concentrated in Paris, Tallinn, and Warsaw.

    contentRequirements:
      - Consumer segments: commuters 40%, occasional/leisure 30%, tourist/airport 12%
      - Corporate B2B: 30,000+ companies, 18% of ride-hailing revenue
      - Geographic split: CEE and Africa dominant; Western Europe challenger
      - Bolt Food 12M MAU; 13 countries
      - Micromobility 42M trips in 2025; Paris, Tallinn, Warsaw top cities
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: section-adoption
    title: "Adoption and Usage Trajectory"
    body: |
      Bolt crossed 200 million registered users in January 2026, five months ahead of its internal target—a signal of accelerating adoption velocity. Monthly active users are estimated at 40–45 million across all segments, implying a ~20–22% MAU-to-registered ratio consistent with mature mobility super-apps. Gross merchandise value exceeded €7 billion in 2025, reflecting a platform that has scaled from regional player to global challenger in under a decade.

      Average ride frequency among active users is approximately 3.5 trips per month in dense urban markets, declining to 1.5–2.0 in smaller cities and emerging markets. Repeat users account for roughly 70–75% of rides, with new user cohorts typically converting to repeat within 30 days following promotional first-ride discounts. Bolt Business accounts are accessed by employees at a median of 4–6 trips per month, reflecting commuter and business-travel use cases.

      The ride acceptance rate of 87% in Bolt's top 20 cities (vs Uber's 91%) indicates that driver supply density, a key adoption quality indicator, remains below Uber's levels in premium urban markets. This gap narrows in CEE and African markets where Bolt has deeper driver networks. Bolt Food's average basket size is estimated at €22–26 per order, with order frequency of approximately 2.5 orders per active user per month in high-penetration markets.

    contentRequirements:
      - 200M registered users January 2026; 40–45M MAU
      - GMV >€7B in 2025
      - Average trip frequency ~3.5/month in dense markets
      - Repeat users ~70–75% of rides
      - Acceptance rate 87% vs Uber 91%; Bolt Food 2.5 orders/month
    claimRefs: [CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
    figureRefs: [FU002]

  - id: section-named-proof
    title: "Named Customer Proof"
    body: |
      Bolt's named customer evidence is strongest in its B2B corporate segment. Bolt Business counts Airbus, Nike, PwC, KPMG, Deloitte, and numerous mid-sized European firms among its 30,000+ corporate accounts. These are production deployments—employees booking rides through managed corporate accounts, with automated invoicing and travel policy enforcement. Outcomes cited include a 20–35% reduction in business travel receipts and admin burden versus alternatives, based on case study materials published by Bolt.

      On the consumer B2C side, Bolt's customer proof is aggregated rather than named: 47,000+ Trustpilot reviews (3.9/5), app store ratings of 4.5/5 (iOS/Android composite), and a 2025 gig-worker study across six European markets confirming higher driver satisfaction on Bolt vs Uber. These are production deployments at scale—not pilots. Bolt Business G2 reviewers (4.1/5) cite cost savings as the primary outcome, with specific feedback that Bolt Business integrates cleanly with corporate expense systems.

      Adverse evidence in named proof: several enterprise buyers note that Bolt's global coverage (driver supply outside CEE and Africa) is inferior to Uber, limiting its use for international travel. Consumer reviewers in smaller cities flag inconsistent driver availability. These are genuine deployment limitations relevant to due diligence on enterprise expansion.

    contentRequirements:
      - Named B2B: Airbus, Nike, PwC, KPMG, Deloitte (30,000+ company accounts)
      - Consumer proof: 47,000+ Trustpilot reviews (3.9/5), app store 4.5/5
      - Adverse: global coverage gaps vs Uber; inconsistent supply in smaller cities
      - Outcomes: 20–35% admin/cost reduction (B2B case studies)
      - Production deployment (not pilot) across both B2B and B2C
    claimRefs: [CU013, CU014, CU015, CU016, CU017, CU018]
    tableRefs: [TU003]
    figureRefs: [FU003]

  - id: section-retention
    title: "Retention and Satisfaction"
    body: |
      No publicly disclosed NRR, GRR, or cohort retention series exists for Bolt. Proxy evidence must be assembled from indirect indicators. Bolt Pass, the €9.99/month subscription launched mid-2025, had reached 1.2 million subscribers within three months—a proxy for high-frequency rider lock-in. Subscribers exhibit ~30–40% higher trip frequency than non-subscribers, suggesting the programme is successfully targeting the most retention-sensitive cohort. European mobility platform benchmarks indicate subscriptions reduce monthly churn by 30–45%.

      Driver retention (supply-side) is improved in 12 markets through Bolt's earnings guarantee programme: top-rated drivers in those markets churn at ~22% lower rates than in markets without the guarantee. High driver retention directly improves rider satisfaction (shorter wait times, higher acceptance rates), creating a supply-demand retention flywheel. Ride cancellation rate of 6.2% remains above best-in-class (4–5%), suggesting driver-side service reliability is an ongoing focus area.

      Trustpilot (3.9/5 from 47,000+ reviews) and app store ratings (4.5/5) are strong consumer satisfaction proxies. Glassdoor driver reviews score 3.8–4.0, with drivers citing flexible hours and lower commissions as positives, inconsistent support as a negative. Bolt has not faced a major GDPR fine (contrast: Uber's €290M Dutch fine in 2024), supporting enterprise trust. The primary retention diligence ask is cohort data: what % of new users from a given vintage are still active 6, 12, and 24 months later?

    contentRequirements:
      - No public NRR/GRR; proxy evidence only
      - Bolt Pass 1.2M subscribers in 3 months; 30–40% higher trip frequency
      - Driver retention +22% in 12 markets with earnings guarantee
      - Trustpilot 3.9/5; app store 4.5/5; Glassdoor driver 3.8–4.0
      - Cancellation rate 6.2%; no major GDPR fine (vs Uber €290M)
    claimRefs: [CU019, CU020, CU021, CU022, CU023, CU024]
    tableRefs: [TU004]
    figureRefs: [FU004]

  - id: section-expansion
    title: "Expansion and Concentration Risk"
    body: |
      Bolt's primary expansion mechanism is geographic market entry and vertical cross-sell. Cross-sell within the super-app (riders → food → scooters → car-sharing) is a key CLV expansion lever: Bolt Pass incentivises multi-vertical engagement through combined ride and delivery discounts. Enterprise land-and-expand follows a similar pattern: initial Bolt Business rides adoption, then expansion to food delivery catering and scooter fleet allowances for urban-commute employees.

      Geographic concentration risk is the primary adverse finding in the customer chapter. Bolt's top five markets—Romania, Poland, Nigeria, Estonia, and Kenya—account for an estimated 55% of GMV. Romania and Poland alone represent approximately 20% of GMV. This concentration creates material downside risk if regulatory, competitive, or macroeconomic shocks affect any single dominant market. Romania's regulatory environment has been volatile (multiple taxi-lobby legislative challenges to ride-hailing rules). Nigeria's currency (NGN) has depreciated significantly, compressing USD-equivalent GMV.

      There is no publicly disclosed top-customer revenue concentration risk at the enterprise level (Bolt does not name individual corporate accounts' revenue contribution). The risk of over-dependence on any single B2B client is assessed as low, given 30,000+ accounts and the granular, transactional nature of ride-hailing spend. Procurement friction for new enterprise accounts is moderate: IT integration (SSO, expense API), legal procurement review, and finance controller approval are standard hurdles but typically addressable within 2–6 weeks.

    contentRequirements:
      - Cross-sell: Bolt Pass bundles ride + food discounts; enterprise multi-service
      - Top 5 markets ~55% of GMV; Romania + Poland ~20%
      - Romania and Nigeria regulatory/currency risk
      - No top-client concentration at B2B level (30,000+ accounts)
      - Enterprise procurement friction: IT, legal, finance (2–6 weeks typical)
    claimRefs: [CU025, CU026, CU027, CU028, CU029, CU030]
    tableRefs: [TU005]

