  evidenceGaps:
    - type: missing-data
      severity: high
      topic: NRR/GRR and Cohort Retention
      missingEvidence: "Bolt does not publish NRR, GRR, or cohort retention series; all retention assessment is based on proxy indicators (subscription uptake, trip frequency, review trends)."
      whyItMatters: "Without cohort retention data, customer durability—the core diligence question—cannot be rigorously assessed. Proxy evidence is directionally positive but insufficient for investment-grade underwriting."
      diligencePath: "Request customer cohort retention data (6/12/24-month activity curves) by market vintage and segment. Require NRR and GRR for Bolt Business. Include in data room request list."
      relatedQuestionRefs: [QU010, QU012]

    - type: missing-data
      severity: medium
      topic: Customer Acquisition Cost
      missingEvidence: "Bolt does not publicly disclose per-market CAC; estimates are inferred from marketing spend disclosures and cohort growth data."
      whyItMatters: "CAC is central to CLV/CAC sustainability analysis; without it, unit economics remain partially opaque."
      diligencePath: "Request per-channel, per-market CAC from marketing operations data; cross-check with P&L sales and marketing line."
      relatedQuestionRefs: [QU006]

