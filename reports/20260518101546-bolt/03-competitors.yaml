callouts:
  - id: KP001
    calloutType: strength
    title: "Driver Economics Moat"
    body: "Bolt's 15–20% driver commission vs Uber's 30%+ creates a durable supply-side advantage that manifests as better driver liquidity in key markets, shorter wait times, and competitive pricing for consumers. This moat is real and measurable but is threatened by the EU Platform Work Directive."
    claimRefs: [CP023, CP031]

  - id: KP002
    calloutType: risk
    title: "Multi-Homing Limits Moat Durability"
    body: "Research consistently shows 60–80% of gig drivers in Europe use two or more platforms. This severely limits the exclusivity of Bolt's supply-side network effect and means a well-capitalised competitor can erode Bolt's driver liquidity advantage through sustained incentive spending."
    claimRefs: [CP032]

  - id: KP003
    calloutType: risk
    title: "No Consumer Subscription Lock-In"
    body: "Bolt lacks an equivalent to Uber One, which charges $9.99/month and bundles ride discounts with free Uber Eats deliveries. Without a subscription product, Bolt relies on price competition alone for consumer retention — a strategically inferior position that Uber is actively exploiting."
    claimRefs: [CP029, CP033]

  - id: KP004
    calloutType: insight
    title: "Yango Geopolitical Risk as Bolt Opportunity"
    body: "If EU regulators act decisively against Yango's Russian-origin corporate structure across Eastern European markets, Bolt stands to absorb significant market share in its core stronghold of Poland, Romania, Czech Republic, and the Baltics. Monitoring EU regulatory actions on Yango is a high-priority diligence item."
    claimRefs: [CP011, CP039]

  - id: KP005
    calloutType: recommendation
    title: "Validate City-Level Market Share Data"
    body: "Third-party market share data for ride-hailing by city is extremely limited and largely paywalled. A credible valuation of Bolt's competitive position requires city-level GMV and trip-volume data — ideally from the IPO prospectus or a direct data room request."
    claimRefs: [CP043]

