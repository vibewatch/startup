companyProfile:
  summary: "Bolt Technology OÜ is an Estonian mobility super-app founded in 2013 by Markus Villig in Tallinn. It operates ride-hailing (82% of revenue), food and grocery delivery, micromobility (e-scooters/bikes), car-sharing, and B2B travel management across 50+ countries and 850+ cities. With a €3B revenue run-rate and €12B+ GMV run-rate as of December 2025, Bolt is Europe's largest ride-hailing challenger to Uber and the market leader in Central and Eastern Europe. The company became cashflow positive in 2024 and is exploring a public listing in 2026, though the IPO timeline is complicated by a UK worker-classification ruling creating £200M+ in potential back-pay liability and the EU Platform Work Directive potentially restructuring its driver economics."
  foundedDate: "2013-08-01"
  founders:
    - name: "Markus Villig"
      role: "CEO"
      background: "Estonian entrepreneur who founded Bolt at age 19 in 2013, dropped out of university to run the company full-time; credited with building Europe's largest ride-hailing challenger."
      claimRefs: [CO014]
    - name: "Martin Villig"
      role: "Chairman of the Supervisory Board"
      background: "Markus Villig's brother; previously worked at Skype; co-founded Bolt and serves as board chair."
      claimRefs: [CO015]
    - name: "Oliver Leisalu"
      role: "Co-founder / Technical Lead"
      background: "Engineer and third co-founder; served as technical lead from founding."
      claimRefs: [CO014]
  foundingLocation: "Tallinn, Estonia"
  headquarters: "Vana-Lõuna tn 15, Tallinn, Estonia"
  productSummary: "Multi-modal urban mobility super-app offering on-demand ride-hailing, food delivery (Bolt Food), grocery delivery (Bolt Market), e-scooter/e-bike rentals, self-drive car-sharing (Bolt Drive), and corporate ride management (Bolt for Business)."
  customerFocus: "Urban consumers and corporate clients in Europe (primary) and sub-Saharan Africa (secondary), spanning individual riders, restaurant-goers, micromobility commuters/tourists, and enterprise travel managers."
  businessModel: "Platform intermediary: Bolt takes a commission on each transaction (15–20% of fare for ride-hailing vs 30%+ industry norm; delivery take rates higher). Revenue recognition is primarily as principal/gross for ride-hailing."
  stage: "Late-stage private; pre-IPO (engaging PJT Partners as financial adviser)"
  fundingStatus: "€628M Series F (Jan 2022, Sequoia/Fidelity, peak €7.4B valuation); €220M revolving credit facility (May 2024); 2025 secondary sale at $6.82B implied valuation."
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO002, CO003, CO006, CO010, CO014, CO015, CO021, CO022, CO036, CO037]

summary:
  headline: "Bolt is Europe's most credible Uber challenger with proven cashflow-positive super-app economics, but the IPO thesis faces a material £200M+ UK legal liability and an EU labour-cost restructuring cycle that investors must model before committing."
