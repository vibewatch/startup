      - number: '1.2'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >-
              Bolt 由创始人 Markus Villig 领导，他自公司成立起担任 CEO。Villig 1993 年出生于 Saaremaa 岛，后从大学退学全职经营 Bolt，被广泛认为是欧洲最年轻、打造出估值超过
              €1 billion 公司的创始人。他的兄弟 Martin Villig 曾任职于 Skype，是 Bolt 联合创始人，并担任监事会主席。第三位联合创始人、工程师 Oliver Leisalu
              从创立之初加入，曾担任公司技术负责人。Jevgeni Kabanov 担任总裁，Epp Aasaru 担任首席法务官。截至 FY2024，Bolt 全球约有 4,000–4,206 名员工。Bolt
              的低佣金模式——向司机收取 15–20%，而行业常态超过 30%——一直是其供给侧策略的核心，也反映管理层有意优先守住司机留存，而不是最大化短期收入。Markus Villig
              仍深度参与各层级运营，因此存在关键人物依赖风险。监事会以下的董事会构成未在公开来源中充分披露，这是该阶段私人公司常见的治理透明度缺口。Bolt
              被曝曾就欧盟劳动立法与爱沙尼亚政府保持紧密协调，公司治理也因此受到审视，并引发利益冲突疑问。
