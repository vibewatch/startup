      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >
              情景分析以 2027E ARR 作为主要估值锚，倍数按上市和私有可比公司校准。所有情景中，ARR 增长路径都要靠三件事： 网约车 GMV 持续扩张（核心驱动）、Bolt Business B2B
              交易量推动抽成率继续上行，以及外卖贡献适度增加。 概率权重设为乐观 20%、基准 50%、悲观 30%——反映真实的不对称性：上行需要公司执行到位且没有监管冲击； 下行只需一次重大监管事件，就足以压缩悲观情景。


              乐观情景下，Bolt 守住中东欧和非洲市场领先地位，Bolt Business 收入占比从当前估计 20–25% 提升至 30%， 外卖在核心市场实现贡献利润率转正，并以 6× ARR 的溢价倍数 IPO，对应
              €18 billion 估值。到 2027 年所需 ARR 为 €3 billion，相当于较 2025 年基数实现 35–40% 复合年增长；这可以做到，但在缺乏财务透明度的情况下要求很高。
              基准情景假设既有市场 GMV 温和增长，Bolt Business 维持约 25% 收入占比，监管逆风可控，并以可比公司中位数 5× 倍数 IPO，隐含估值 €10
              billion。悲观情景假设三个或更多市场发生欧盟零工劳动者重新分类（估计成本增加 25–30%）， Uber 持续价格战压低 GMV 15–20%，IPO 延迟或出现降估值融资；在降至 €1.2 billion
              的 ARR 基数上按 3.5× ARR， 隐含估值为 €4.2 billion。各情景概率加权期望值约 €9.1 billion，验证基准情景是最可能结果，也说明乐观情景溢价需要具体执行证明。
