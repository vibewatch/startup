      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >
              Bolt 的主要扩张机制是地理市场进入和垂直交叉销售。超级 App 内部交叉销售（乘客 → 外卖 → 滑板车 → 汽车共享）是关键 CLV 扩张杠杆：Bolt Pass
              通过组合网约车和配送折扣，激励多垂直参与。企业落地后扩张遵循类似模式：先采用 Bolt Business 出行，再扩展到外卖餐饮和面向城市通勤员工的滑板车车队额度。


              地理集中度风险是客户章节的主要反向发现。Bolt 前五大市场——罗马尼亚、波兰、尼日利亚、爱沙尼亚和肯尼亚——估计贡献 55% GMV。仅罗马尼亚和波兰就约占 20%
              GMV。如果监管、竞争或宏观冲击影响任何单一主导市场，下行风险都很大。罗马尼亚监管环境一直波动（出租车游说团体多次在立法层面挑战网约车规则）。尼日利亚货币（NGN）显著贬值，压缩了按 USD 计价的 GMV。


              企业层面没有公开披露的头部客户收入集中度风险（Bolt 不披露单个企业账户的收入贡献）。鉴于有 30,000+ 账户，且网约车支出颗粒度高、以交易为单位，对任何单一 B2B
              客户过度依赖的风险被评估为低。新企业账户采购摩擦中等：IT 集成（SSO、费用 API）、法律采购审查和财务控制人批准是标准门槛，但通常可在 2–6 周内解决。
