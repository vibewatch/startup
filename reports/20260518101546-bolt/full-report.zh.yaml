  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >
              Bolt 的投资逻辑靠三根耐久支柱支撑：在渗透不足的中东欧和非洲出行市场拥有结构性领先地位； 由网约车、外卖、生鲜杂货和微出行拼出的超级应用飞轮正在成形；2026–2027 年存在可信的 IPO 路径，
              为私募投资者提供清晰退出机制。对应的反向逻辑同样具体，集中在三点：完全缺少经审计的公开财务数据， 导致所有估值输入都只是估计；EU Platform Work Directive 可能在受影响市场压缩
              25–30% 利润率； Uber 正靠资本加码进入 Bolt 核心中东欧市场。


              整体建议为有条件正向——具体而言，在入场估值不高于 €7 billion 时进入观察名单或采取联合投资立场。 若 2027 年以 €10B IPO 退出，这一入场水平下基准情景 3–4 年回报约 1.4× 至
              2.0× 可以实现； 乐观情景上行至 €18B，对应 2.6× 回报。若入场估值高于 €8B，悲观情景下的安全边际会被明显挤压； 除非能拿到经审计财务数据，验证支撑基准情景的 ARR、抽成率和 EBITDA
              画像，否则不建议投资。


              该建议的置信度为中等：一方面，Bolt 确有规模和市场领先地位；另一方面，缺少经审计合并账目造成结构性信息不对称。 风险评级为中高，主要由欧盟监管周期和 Uber 竞争压力驱动。投资 KPI
              图（FV004）用信号评级总结八个投资逻辑维度。 建议逻辑图（FV001）则从市场位置、财务轨迹一路推到有条件正向结论。
