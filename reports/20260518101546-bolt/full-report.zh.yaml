      - number: '8.4'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              Bolt 的可比公司分三类：上市网约车平台（Uber、Lyft）、上市超级应用平台（Grab Holdings），以及私有或已被收购的出行 /
              配送业务（InDrive、Rappi、Yango、Deliveroo、Wolt/DoorDash 交易和 Glovo/Delivery Hero 交易）。 Uber 是规模上最直接的可比对象，截至 2026
              年中市值约 $100 billion，交易倍数约 5–7× NTM 收入； 其已验证的盈利能力和全球品牌，为 Bolt IPO 时可达到的倍数设定上限。Grab Holdings 交易倍数约 8× NTM 收入，
              作为发展中市场多垂类超级应用，是结构上最好的类比；但其东南亚市场和金融科技渗透率，使其与 Bolt 的中东欧 / 非洲版图不同。


              最相关的两笔 M&A 先例，是 DoorDash 于 2022 年以 €7 billion 收购 Wolt（约为当时 Wolt 收入的 7×）， 以及 Delivery Hero 以 €2.3 billion
              收购 Glovo（约 4× 收入）。两笔交易都发生在 2021–2022 年的高倍数环境， 应理解为上限先例，而不是 2026–2027 年更常态化市场中的预期。Lyft 当前约 1.5× NTM
              收入倍数，反映美国市场饱和和份额下滑； 它更适合作为下行参照，而不是中心估计。私有可比对象中，InDrive 最近已知估值约 $1.2 billion（2023 Series B）， Rappi 为 $5.25
              billion（2021 Series F），Yango 约 $800 million，均明显低于 Bolt 隐含估值， 反映规模更小、聚焦单一区域或阶段更早。综合来看，对 Bolt 估计的 2027E ARR
              €2 billion 采用 5× NTM 收入倍数， 得出 €10 billion 的基准情景估值。
