  - id: TV005
    title: 投资逻辑破裂与止损触发表
    columns:
      - 触发事件
      - 概率（12 个月）
      - 严重性
      - 对投资逻辑的传导
      - 应对
    rows:
      - - EU Platform Work Directive 执法，并在 ≥3 个 Bolt 欧盟市场作出有约束力的重新分类
        - 30%
        - 致命
        - 受影响市场用工成本增加 25–30%；这些市场 EBITDA 在 12–18 个月内转负；基准情景 ARR 增速明显放缓
        - 退出仓位；法律复核受影响市场；重新评估盈利时间线
      - - Uber 在 ≥10 个 Bolt 中东欧 / 非洲核心城市发起补贴定价战
        - 25%
        - 高
        - Bolt GMV 增长减速；抽成率承压；3–5 个最高价值市场份额流失；悲观情景 GMV 轨迹锁定
        - 降低仓位；加仓前要求看到 Bolt 定价应对有效的证据
      - - GDPR 或竞争主管机构罚款超过 €100M
        - 15%
        - 高
        - 现金头寸明显减少；暴露治理失灵信号；投资者信心受损；IPO 时间线延后 12 个月以上
        - 跟踪；若确认，重新评估现金跑道充足性和 IPO 准备度
      - - IPO 定价估值低于 €6B
        - 20%
        - 高
        - 悲观情景在 IPO 时兑现；€7B 入场意味着上市时亏损 14% 以上；IPO 后情绪可能偏负面
        - IPO 时或 IPO 后不久退出；没有新证据，不在 IPO 后摊低成本
      - - CEO / 创始人离任，或治理出现重大扰动
        - 10%
        - 中
        - 创始人叙事折价扩大；投资者对愿景和执行的信心受损；IPO 时估值倍数可能压缩
        - 重新评估估值模型中的创始人溢价；对基准情景倍数施加 15–20% 治理折价
    claimRefs:
