      - number: '6.4'
        title: 留存与满意度
        blocks:
          - type: paragraph
            body: >
              Bolt 没有公开披露 NRR、GRR 或队列留存序列。留存证据只能从间接指标拼出。Bolt Pass 是 2025 年中推出的 €9.99/month 订阅，三个月内达到 1.2 million
              订阅用户——可作为高频乘客锁定效应的代理指标。订阅用户行程频率比非订阅用户高约 30–40%，说明该计划成功瞄准最看重留存的群体。欧洲出行平台基准显示，订阅可将月流失率降低 30–45%。


              司机留存（供给侧）在 12 个市场通过 Bolt 收入保障计划得到改善：这些市场中的高评分司机流失率比没有保障的市场低约
              22%。高司机留存直接改善乘客满意度（等待时间更短、接单率更高），形成供需留存飞轮。6.2% 的行程取消率仍高于最佳水平（4–5%），说明司机侧服务可靠性仍是持续重点。


              Trustpilot（47,000+ 条评价，3.9/5）和应用商店评分（4.5/5）是强消费者满意度代理指标。Glassdoor 司机评价得分
              3.8–4.0；司机把灵活工时和较低佣金列为正面因素，把支持不稳定列为负面因素。Bolt 未遭遇重大 GDPR 罚款（对比 Uber 2024 年荷兰 €290M
              罚款），支撑企业信任。留存尽调的首要要求是队列数据：某一批新用户在 6、12、24 个月后仍活跃的比例是多少？
