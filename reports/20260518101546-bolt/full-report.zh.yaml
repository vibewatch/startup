  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑
    rows:
      - - 市场地位
        - 'Bolt 在 45 个市场中的 30+ 个位列 #1–2；低收入城市里 Uber 覆盖不足，Bolt 有结构性优势；CEE 和非洲天然竞争较弱、资本强度较低'
        - Uber 的品牌和资产负债表让它能在 6–12 个月内靠补贴切入任何 Bolt 核心市场；Yango（Saudi Aramco 支持）正在成为非洲市场的新竞争者，而 Bolt 正把增长押在非洲
      - - 产品差异化
        - 网约车、外卖、杂货和微出行组成超级应用飞轮，带来多垂直留存和更高生命周期价值；更低抽佣率（15–20%，对比 Uber 25–30%）增强司机忠诚度
        - 相比西欧的 Wolt 和 Glovo，外卖和杂货垂直仍未成规模；按当前 GMV 结构，超级应用更像愿景叙事，而非已被验证的留存护城河
      - - 财务轨迹
        - GMV 复合增长和 Bolt Business 提升抽佣率，让 €3B ARR 路径可见；成熟 CEE 网约车市场估计 15–18% EBITDA 利润率验证单位经济
        - 没有审计 P&L；Sacra 和 CB Insights 估算可能高估抽佣率；到 2028 年跑通 EBITDA 路径，需要五个垂直同时零失误执行
      - - 监管环境
        - Bolt 已在 45+ 个司法辖区扛过监管审查；25+ 人政府事务团队覆盖布鲁塞尔、伦敦和非洲主要首都
        - EU Platform Work Directive（2026 年转化）带来重大成本风险；若 3–4 个关键市场将零工重新归类为雇员，运营成本基数可能增加 25–30%，这些市场 EBITDA 被压到零或转负
      - - 竞争
        - InDrive、Rappi 和 Yango 主要竞争低价值市场；Bolt 在 CEE 和非洲的护城河已在规模化状态下守住 5+ 年；Bolt Business 让收入不完全暴露于纯网约车商品化
        - Uber 有资本、全球数据规模和品牌势能，可发起持续战役；GDPR 和竞争主管机构审查限制 Bolt 的数据优势
      - - 退出路径
        - >-
          鉴于 PJT Partners 银行家介入以及 FT/Reuters 报道，2026–2027 年在 Euronext Paris 或 LSE IPO 具备可信度；Wolt 和 Glovo 的 M&A 先例显示，€7B+
          战略收购也可行
        - IPO 窗口受利率影响，且需要两年审计财务，而 Bolt 尚未发布；鉴于创始人控制结构，超过 €8B 的收购兴趣可能不会出现
