      - number: '4.3'
        title: 公开财务牵引力与关键绩效指标
        blocks:
          - type: paragraph
            body: >-
              Bolt 的财务牵引力在收入端有较充分证据支撑，来源包括公司官方沟通、Sacra 独立收入估计和英国监管文件。最可信的数据点来自公司自身披露：截至 2025 年 12 月，收入运行率 €3 billion、GMV
              运行率 €12 billion+，直接来自 Bolt 投资者页面；FY2024 年度收入 €1.99 billion，则由 Raison（引用经审计的爱沙尼亚注册文件）和 Sacra
              确认。FY2023（€1.70B）到 FY2024（€1.99B）收入增长 17%，多个独立来源口径一致。2025 年 12 月运行率显示增长轨迹在加速：若将 2025 年 12 月 €3B 年化，FY2025
              收入将显著高于 FY2024。在 €12B+ GMV 下，Bolt 隐含抽成率约 ~25%，与所有可得数据点一致。运营 KPI——200M+ 累计客户、4.5M+ 司机 / 骑手 / 商户伙伴、850+
              城市、50+ 国家——均为公司披露，并且至少自 2025 年初起，被多个官方和独立来源持续引用。盈利能力上，Bolt 于 2024 年现金流转正，这是投资者页面明确披露的里程碑。Sacra 估计公司经营亏损
              -€87.7M、自由现金流为正，这与 EBITDA 为正、EBIT 为负的经营状态一致，可能由硬件折旧和法律拨备驱动。每名员工收入约 €499K（€1.99B / ~4,000
              employees），对欧洲科技公司来说健康，且优于行业同业。值得注意的是，公司尚未以可访问英文形式发布完整经审计财务报表；爱沙尼亚 E-Business Register
              是权威来源，但需要翻译和注册访问。英国子公司 FY2024 Companies House 文件提供了最易获取的经审计数据点，显示营业额约 £384M，并在法律拨备后实现接近盈亏平衡的税前结果。
