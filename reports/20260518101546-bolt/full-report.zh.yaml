          label: 报出动态车费 + 显示司机 ETA
          type: process
          note: 定价引擎 + 派单匹配；<2 秒响应
        - id: confirm
          label: 消费者确认行程
          type: process
          note: 一键确认；支付预授权
        - id: driver-accept
          label: 最近司机接收并接受订单
          type: process
          note: 200ms 内派单决策；司机 App 通知
        - id: pickup
          label: 司机导航到上车点；消费者实时追踪
