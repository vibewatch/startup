  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览
        blocks:
          - type: paragraph
            body: >
              Bolt 的风险画像来自其定位：一家资本密集、多垂直的出行平台，在欧洲、非洲、中东及其他地区的 45+
              监管辖区运营。平台不到十年就从单一市场的爱沙尼亚初创公司成长为全球挑战者，增长速度超过制度化治理成熟度，形成的风险栈相对 Series E/F 阶段公司异常宽。最关键的风险聚集在监管维度——EU Platform
              Work Directive 可能成为 Bolt 核心零工劳动模式的生存级重估事件；也聚集在技术依赖维度，Bolt 对 Google Maps API、AWS 云基础设施和 Stripe
              的近乎完全依赖，使一个原本有韧性的消费者平台底层变得脆弱。


              风险热力图（Figure R1）按可能性和严重性的组合定位最严重风险。EU Platform Work Directive 执行位于高可能性和关键严重性的交点，是投资逻辑的定义性风险。TfL 牌照条件和 GDPR
              执法处于中等可能性 / 高严重性象限。技术依赖风险（Google Maps API 成本重定价、AWS 中断）可能性中等，但考虑到短期替代难度，严重性高。风险传导图（Figure
              R2）展示监管冲击如何通过司机供给压力、利润率压缩和投资者信心侵蚀传导到运营和财务结果——说明这些风险并非彼此独立，而是以 Platform Work Directive 为主要传导节点形成一张相连图谱。


              本章分析的五类风险——监管 / 法律、运营、伙伴 / 依赖、财务 / 模型，以及人员 / 执行——中，Bolt 在运营安全上的缓释成熟度最高（已建立事故响应框架、TfL 等级保险要求、ISO 27001
              认证），在监管 / 法律准备上最低，这反映出 Platform Work Directive 实施链条仍早期且辖区碎片化。五类风险的剩余敞口都偏高；缓释措施部分的否决标准和监测指标为持续投资治理提供了结构化框架。
