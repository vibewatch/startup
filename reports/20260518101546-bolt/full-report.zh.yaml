      - number: '3.2'
        title: 主要竞争者画像
        blocks:
          - type: paragraph
            body: >-
              Uber Technologies Inc.（NYSE: UBER）是 Bolt 最重要的单一竞争威胁。截至 2025 年，Uber 全球年收入为 $43.98 billion，毛利率约 37%。在欧洲，Uber
              覆盖 London、Paris、Berlin、Madrid、Warsaw、Prague 等 70+ 座城市。Uber 的欧洲业务承受与 Bolt 相近的监管压力：在英国，Uber 以 $100 million
              和解一项劳动者身份认定案件，并将其英国司机重新分类为享有最低工资和假日薪酬权益的「workers」；这一先例直接影响 Bolt 英国诉讼。Uber 的战略优势包括全球品牌认知、更强的 AV 投资管线（Waymo
              合作、Aurora、Motional 合作）和能产生现金的规模。不过，Uber 30%+ 抽成率在司机经济性上为 Bolt 留出结构性切口。Yango（Yandex N.V./Driverless）原名
              Yandex.Taxi，2023 年为淡化俄罗斯国家关联而更名。它在 25+ 个欧洲和非洲市场运营，包括多个东欧国家。其定价与 Bolt
              接近，但俄罗斯源头架构带来的地缘政治风险，已促使若干欧盟市政当局审查其运营许可。InDriver（iLogic, Inc.）运营一种独特竞价模型：乘客提出价格，附近司机可接受、拒绝或还价，本质上是出行的 C2C
              拍卖。InDriver 2012 年创立于俄罗斯 Yakutsk（后迁册至美国），截至 2024 年覆盖全球 700+ 座城市，估计 GMV 为 $1.2 billion，并在 2021 年从 General
              Atlantic 募得 $150 million Series B。其 5–10% 佣金模式甚至低于 Bolt，但在欧盟市场的品牌投入有限。Cabify 覆盖西班牙、葡萄牙和拉丁美洲，产品定位偏高端，年收入约
              €500 million；其欧盟足迹仅在西班牙和葡萄牙与 Bolt 重叠。Free Now 在 Stellantis 收购 BMW 股权后由 BMW 和 Stellantis 共同持有，业务持续收缩：2024
              年结束英国和爱尔兰运营，并通过聚合模式聚焦法国、德国、西班牙和意大利，同时把乘客连接到出租车。Delivery Hero AG（Glovo）是 Bolt 在东欧和西班牙的主要餐饮配送竞争者，FY2024 收入
              €6.7 billion，是估计 Bolt Food 规模的三倍以上。Just Eat Takeaway（原 Takeaway.com）在英国和荷兰竞争，但 2024 年出售 Grubhub，且在 Bolt
              Food 定位更强的东欧陷入挣扎。微出行中，Lime（Uber 持股 10%）覆盖 30+ 个国家、拥有 50M+ 用户，并在 2023 年实现盈利；合并后的 Tier-Dott 实体覆盖 25
              座欧盟城市，收入约 €300 million。
