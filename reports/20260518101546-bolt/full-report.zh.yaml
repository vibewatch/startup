      - number: '7.3'
        title: 运营风险
        blocks:
          - type: paragraph
            body: >
              Bolt 的运营风险横跨五个维度：平台可靠性、安全事故敞口、司机供给集中、支付完整性和网络安全。鉴于 Bolt 覆盖 45 个国家，且网约车依赖实时匹配，平台正常运行时间是关键服务水平义务；99.5%
              uptime SLA 意味着每年可能约 44 小时停机，在 €7B+ GMV 规模下，如果停机不均匀地落在需求高峰窗口，潜在订单损失敞口每年超过 €35M。Bolt 对 AWS 的主要基础设施依赖（在伙伴 /
              依赖章节进一步讨论）意味着，区域 AWS 服务事件——如 2021 年 12 月影响多个欧洲平台的 EU-WEST-1 中断——可能在所有欧洲市场同时触发级联服务中断。


              安全事故既是运营责任，也是声誉和监管风险向量。Bolt 披露的 2025 年安全统计显示，所有市场严重事故率为每 100,000 次行程 0.6 起，大体可比 Uber 披露的每 100,000 次 0.59
              起。虽然处在行业基准水平，但任何主要市场的高关注度事故——尤其是在 TfL 按季度追踪 Bolt 安全表现的伦敦——都会带来过度放大的监管风险。支付欺诈和拒付敞口估计每年为 GMV 0.8–1.2%，按 2025
              年 GMV 水平约等于 €56–84M；Bolt 的欺诈检测栈高度依赖 Stripe 工具，在支付安全上形成单一供应商依赖。位置数据极度敏感，抬高了网络安全风险：Bolt
              存储了数十亿条精确起终点行程路线，一旦被外泄，可能被用于跟踪、定向犯罪或国家级监控行动——既会触发重大 GDPR 执法责任，也会造成不可逆的消费者信任损害。Bolt Food 供应链进一步增加运营脆弱性：13
              个国家约 35,000 家餐厅伙伴意味着，高 GMV 城市中的伙伴流失会直接削弱订单可得性和客户体验指标。
