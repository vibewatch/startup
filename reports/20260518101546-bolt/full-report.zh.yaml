  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Bolt 所处的全球出行市场竞争激烈，大致分为三层：主要网约车对手、垂直餐饮与配送竞争者，以及微出行专业玩家。最核心的竞争轴是网约车，Uber 是全球领导者，在 70+ 个欧盟城市运营，全球年 GMV 约 $40
              billion。Bolt 在这一层的战略差异点是价格：司机佣金为 15–20%，低于 Uber 的
              30%+，因此吸引更多司机，并为乘客带来更短等候时间、以及相当或更优的价格。这套供给侧策略在中东欧尤其有效——波兰、罗马尼亚、捷克、斯洛伐克和波罗的海国家——Bolt 已建立市场领先位置。第二层包括
              Yango，它在俄罗斯制裁后从 Yandex.Taxi 更名而来，在 25+ 个欧洲和非洲国家运营，定价激进；但随着欧盟监管机构对俄罗斯源头平台更警惕，它面临显著地缘政治逆风。总部位于哈萨克斯坦的
              InDriver 采用点对点竞价定价模式，没有固定车费，对非洲和中亚极度价格敏感的乘客有吸引力，但在欧盟渗透有限。BMW 和 Stellantis 支持的 Free Now 在多个欧洲市场收缩，2024
              年已结束英国和爱尔兰业务；Cabify 则在西班牙、葡萄牙和拉丁美洲守住防御性位置。餐饮配送垂直中，Bolt Food 面对 Delivery
              Hero/Glovo，后者资本显著更强，在南欧和东欧根基更深。微出行层的竞争发生在 Bolt 的滑板车和电动自行车车队（100,000+ 台）、Lime（Uber 关联，50M+ 用户）和 Tier-Dott
              合并实体之间。公共交通和私家车拥有仍是所有网约车与配送服务的主导替代品，约占城市出行的 50–60%。Bolt 的超级应用策略——把所有垂直业务绑在一个 app
              中——创造了纯品类竞争者难以复制的留存和交叉销售动力。
