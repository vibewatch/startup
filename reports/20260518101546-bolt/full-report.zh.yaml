      - number: '1.3'
        title: 融资历史、估值与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2013 年创立以来，Bolt 通过种子轮、风险投资和债务融资累计募集约 €2.22 billion（$2.40 billion）。公司最重要的股权融资是 2022 年 1 月的 Series F：该轮由
              Sequoia Capital 和 Fidelity Management and Research Company 联合领投，融资 €628 million，估值 €7.4 billion（$8.4
              billion），也是 Bolt 至今达到的最高估值。此前仅四个月，Bolt 在 2021 年 8 月完成 Series E，融资 €600 million，估值超过 €4 billion，同样由 Sequoia
              领投。更早的融资里程碑包括 2017 年 DiDi Chuxing 的战略投资，以及 2018 年 5 月 $175 million Series C。Bolt 最近一次一级资本事件是 2024 年 5 月完成
              €220 million 循环信贷额度，贷款银行包括 Barclays、BNP Paribas、Citi、Deutsche Bank、Goldman Sachs、JPMorgan、LHV Pank 和
              Luminor；这显示主流银行债权人在潜在 IPO 前已接受其信用。2025 年一笔老股交易将公司估值定为 $6.82 billion（€6.3 billion），较 2022 年峰值大约低
              14%，与后期私营科技公司估值整体压缩一致。Bolt 正在探索 2026 年 IPO，并已聘请 PJT Partners 担任财务顾问；上市地点可能在欧洲或美国，取决于市场环境。主要股权投资方包括 Sequoia
              Capital、Fidelity Management & Research Company、D1 Capital Partners、Whale Rock Capital Management、G
              Squared、Naya Capital、Mercedes-Benz 和 International Finance Corporation（World Bank Group）。
