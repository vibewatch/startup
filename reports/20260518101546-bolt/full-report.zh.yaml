            body: >-
              Bolt 已成功搭建并验证一个多模式出行平台——网约车、微出行、汽车共享、餐饮配送、杂货配送和 B2B 差旅——覆盖 50+ 个国家、850+ 座城市。凭借 200M+ 累计客户、€3B 收入运行率，以及自
              2024 年起的现金流转正，Bolt 证明了自己具备运营韧性，并在多个垂直和地理市场拥有真实产品市场匹配。
