      - number: '6.3'
        title: 具名客户证据
        blocks:
          - type: paragraph
            body: >
              Bolt 的具名客户证据在 B2B 企业细分中最强。Bolt Business 在 30,000+ 企业账户中包括
              Airbus、Nike、PwC、KPMG、Deloitte，以及许多欧洲中型公司。这些都是生产部署——员工通过托管企业账户预订行程，自动开票并执行差旅政策。Bolt
              发布的案例研究材料称，相比替代方案，商业差旅收据和行政负担降低 20–35%。


              在消费者 B2C 侧，Bolt 的客户证据是汇总而非具名：47,000+ 条 Trustpilot 评价（3.9/5）、应用商店评分 4.5/5（iOS/Android 综合），以及 2025
              年覆盖六个欧洲市场的零工劳动者研究，确认 Bolt 上司机满意度高于 Uber。这些都是规模化生产部署，不是试点。Bolt Business 的 G2 评价者（4.1/5）把成本节约列为主要结果，并具体反馈
              Bolt Business 能顺畅接入企业费用系统。


              具名证据中的反向证据：几位企业买方指出，Bolt 全球覆盖（中东欧和非洲以外的司机供给）弱于 Uber，限制了其国际差旅用途。小城市消费者评价则提示司机可用性不稳定。这些是真实部署限制，关系到企业扩张尽调。
