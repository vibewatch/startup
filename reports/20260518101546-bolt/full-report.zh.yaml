            title: 多平台接单限制护城河耐久性
            body: 研究持续显示，欧洲 60–80% 零工司机使用两个或更多平台。这严重限制 Bolt 供给侧网络效应的独占性，也意味着资本充足的竞争者可以通过持续激励投放侵蚀 Bolt 的司机流动性优势。
            calloutType: risk
