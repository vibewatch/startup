      - number: '6.2'
        title: 采用与使用轨迹
        blocks:
          - type: paragraph
            body: >
              Bolt 在 2026 年 1 月突破 200 million 注册用户，比内部目标提前五个月——这是采用速度加快的信号。全细分月活用户估计为 40–45 million，意味着 MAU / 注册用户比约
              20–22%，与成熟出行超级 App 一致。2025 年商品交易总额超过 €7 billion，反映出一个平台在不到十年内从区域玩家扩张为全球挑战者。


              在高密度城市市场中，活跃用户平均每月乘车约 3.5 次；在小城市和新兴市场中降至 1.5–2.0 次。重复用户贡献约 70–75% 行程，新用户队列通常在首单折扣促销后 30 天内转化为重复使用。Bolt
              Business 账户下员工使用中位数为每月 4–6 次行程，反映通勤和商务出行场景。


              Bolt 前 20 大城市 87% 的接单率（Uber 为 91%）表明，司机供给密度这一关键采用质量指标在高端城市市场仍低于 Uber。在中东欧和非洲市场，Bolt 司机网络更深，这一差距会收窄。Bolt
              Food 平均客单价估计为每单 €22–26，在高渗透市场中，活跃用户每月下单频率约 2.5 单。
