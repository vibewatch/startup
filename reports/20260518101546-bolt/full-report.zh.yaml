      - number: '8.5'
        title: 投资逻辑破裂触发器
        blocks:
          - type: paragraph
            body: >
              投资逻辑破裂触发器，是会让审慎投资者重估或退出 Bolt 持仓的具体事件或阈值，无论此前已经在该投资逻辑上投入多少。 它们不同于风险：风险是已知不确定性，而触发器是已经固化的结果，会从根本上改变回报分布。针对
              Bolt，已识别出五项触发器： 三个或更多市场发生欧盟零工劳动者重新分类（严重程度：关键）；Uber 在 Bolt 十个或更多核心中东欧和非洲城市进行补贴定价 （严重程度：高）；GDPR 或竞争主管机构罚款超过
              €100 million（严重程度：高）；IPO 定价低于 €6 billion（严重程度：高）； 以及创始人或关键管理层重大离职（严重程度：中）。


              影响最大的触发器是零工劳动者重新分类。EU Platform Work Directive 于 2026 年进入各国转化， 对平台劳动者引入雇员身份可反驳推定。EY
              分析显示，若受影响市场发生完全重新分类，Bolt 在欧盟的运营成本可能增加 25–30%； 若 Bolt 前三到五大欧盟收入市场同时触发，相关市场 EBITDA 可能在 12–18 个月内转负，
              使基准情景盈利时间线失效，并把资本需求提前一到两年。Uber 在中东欧的竞争攻势——已可在波兰、罗马尼亚和波罗的海国家观察到——
              是第二危险的触发器，因为它直接攻击三种估值情景共同依赖的核心市场份额假设。上述触发器的监测指标应按季度审阅， 包括前十市场司机活跃小时趋势、Bolt 相对 Uber 的分城市价格指数，以及 EU Platform
              Work Directive 五个实施最靠前司法辖区的立法案卷动态。
            claimRefs:
              - CV012
              - CV013
              - CV028
              - CV033
              - CV041
          - type: table
            tableRef: TV005
            claimRefs:
              - CV012
              - CV013
              - CV028
              - CV033
              - CV041
      - number: '8.6'
        title: 尽调要求与退出准备度
        blocks:
          - type: paragraph
            body: >
              投资前需要完成六项尽调，按优先级排序。最关键的一项，是取得三年经审计合并财务报表。Bolt 尚未以任何可通过 Companies House、Estonian Business Register 或 Bolt
              投资者关系页面访问的形式，公布合并母公司层面（Bolt Technology OÜ）的经审计账目。 缺少这组数据，三种估值情景使用的 ARR、GMV、EBITDA
              利润率和现金头寸数字，都来自分析师估计和媒体报道，而不是一手财务证据。 对一家考虑 2026–2027 年上市的公司而言，这种信息缺口并不寻常，必须在任何资本承诺前解决。


              截至 2026 年 5 月，Bolt 的退出准备度评估为早期。IPO 跑道具备可能性——Reuters 和 Bloomberg 报道确认公司已接触投行 （包括 PJT Partners 担任财务顾问），FT
              则提到 Euronext Paris 和 London Stock Exchange 是主要候选上市地。 但标准 IPO 需要两年经审计财务数据（Euronext 和 LSE 上市规则均有要求），这意味着只有
              Bolt 能证明最迟在 2025 年中已启动并完成首次审计项目， 2026 年 IPO 才可能实现。EY 对高增长科技公司 IPO 准备标准的独立分析，也确认了这一时间约束。若 IPO 市场恶化， 或 Bolt
              的欧洲市场整合逻辑吸引战略买家在 €7–9B 水平出手，战略收购（类似 Wolt/DoorDash 和 Glovo/Delivery Hero 先例） 仍是一条可行的次级退出路径。不过，Markus Villig
              的创始人控制结构可能限制大规模整体收购的买方选择。
            claimRefs:
              - CV027
              - CV032
              - CV042
              - CV014
              - CV016
              - CV017
          - type: table
            tableRef: TV006
            claimRefs:
              - CV027
              - CV032
              - CV042
      - number: '8.7'
        title: 展示材料
        blocks:
          - type: callout
            title: 当前信息水平下，入场纪律不可让步
            body: >-
              在没有经审计合并财务数据的情况下，每个估值输入——ARR、抽成率、EBITDA 利润率和现金头寸——都是分析师估计。 在一手财务数据可用前，以高于 €8 billion 入场无法自洽：若悲观情景估值为
              €4.2B，该入场价意味着 47% 亏损。 对现阶段任何 Bolt 投资而言，最低治理标准是：≤€7B 估值下给出有条件正向建议，并设置强制数据室闸门（经审计账目 + 分垂类单位经济）。
            calloutType: recommendation
            claimRefs:
              - CV023
              - CV027
              - CV030
          - type: callout
            title: EU Platform Work Directive：决定投资逻辑的监管风险
            body: >-
              EU Platform Work Directive 于 2026 年进行具约束力的各国转化，并引入雇佣关系可反驳推定；这是最可能使基准情景失效的单一事件。 EY 分析估计，若 Bolt
              最大欧盟市场发生完全重新分类，劳动力成本会增加 25–30%。这不是尾部风险：30% 概率估计反映法国、 西班牙和波兰立法实施已推进到较深阶段。任何 Bolt
              投资在出资前，都需要针对五个最高敞口司法辖区逐一取得具体法律意见。
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV028
          - type: callout
            title: Wolt 与 Glovo 先例锚定退出案例
            body: >-
              DoorDash 于 2022 年以 €7B 收购 Wolt，以及 Delivery Hero 以 €2.3B 收购 Glovo，为 Bolt 的出行和外卖资产建立了具体 M&A 先例底线。 如果 Bolt 的
              GMV 轨迹和市场位置守得住，即使倍数环境常态化，€7B+ 水平的战略收购兴趣仍然可信—— 这为基准情景退出估值提供了独立于 IPO 路径的下行支撑。
            calloutType: strength
            claimRefs:
              - CV010
              - CV011
              - CV036
          - type: callout
            title: Grab 是最佳可比对象，也设定溢价目标
            body: >-
              Grab Holdings 是最接近 Bolt 超级应用目标的结构类比：新兴市场中多垂类出行与配送平台，交易倍数约 8× NTM 收入。 如果 Bolt
              在中东欧和非洲做到类似的超级应用深度和变现能力，溢价倍数就会成为可触达的上限，而不只是空泛目标，从而支撑乐观情景。 Grab 当前倍数（8×）与 Bolt
              基准情景隐含倍数（5×）之间的差距，正是兑现乐观情景所需的具体执行证明。
            calloutType: insight
            claimRefs:
              - CV008
              - CV029
              - CV031
