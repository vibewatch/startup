      - number: '7.5'
        title: 财务与执行风险
        blocks:
          - type: paragraph
            body: >
              Bolt 的财务与执行风险集中在四个维度：现金消耗和资本充足性、微出行资本强度、新兴市场外汇敞口，以及快速国际扩张、制度厚度有限所带来的人员和治理脆弱性。


              按当前扩张速度，Bolt 年现金消耗估计为 €250–400M；上限来自微出行车队更换周期、Bolt Food 餐厅获取补贴，以及在西欧市场对抗 Uber 的竞争性促销支出。按 Series E/F
              后报告的现金及等价物约 €1.2–1.6B 计算，这意味着无需额外融资可支撑 3–5 年——足够，但考虑完整 EV 车队转型和继续深耕欧洲市场的资本需求，并不宽裕。微出行车队资本强度是持续拖累：Bolt
              的滑板车和电动自行车车队（2025 年 42M+ 次行程）每辆每年需投入 €200–300 用于维护、电池更换和城市主管部门许可续期，而且由于城市许可义务，车队无法快速收缩。在非洲，尼日利亚和肯尼亚合计估计占集团
              GMV 12–15%；尼日利亚奈拉（NGN）自 2022 年以来兑欧元贬值超过 60%，把强劲本币 GMV 增长转化为重大 USD/EUR 损失。据报道，Bolt 外汇对冲计划覆盖约 40% NGN 和 KES
              敞口，留下显著未对冲尾部。与 Uber 在英国、法国和西班牙的竞争性补贴战需要持续促销支出，估计每年 €80–120M，使 Bolt 重点西欧增长市场的 CAC 偏高且结构上难以下降。CEO
              和创始人集中风险也存在：Markus Villig 19 岁创立
              Bolt，保留大量股权和战略权限，也是机构投资人关系的主要持有人；平台叙事、投资者信心和战略方向因此与单一个人高度绑定。塔林、伦敦和阿姆斯特丹的工程人才持续面对 FAANG
              和独角兽竞争者挖角，构成持续运营风险；工程师 Glassdoor 得分 3.6，反映薪酬和职业发展上的竞争压力。
