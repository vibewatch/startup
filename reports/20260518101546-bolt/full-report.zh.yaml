      - number: '3.5'
        title: 替代风险、商品化与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              Bolt 面临几项投资者必须权衡的实质性替代和商品化风险。第一，Uber 持续投资西欧市场——包括 2024 年与 General Motors 合作供应 EV 车队、赞助 UEFA Champions
              League，以及在竞争城市持续高于市场水平地投放司机奖金——说明 Uber 不会在欧洲轻易让地。在 Bolt 与 Uber 共存的市场（如 London、Paris、Berlin），Uber 的品牌和
              Google Maps 分发形成不对称优势，即使 Bolt 有 10–15% 价格优势，也很难完全抵消。第二，网约车技术商品化意味着，任何平台在派单、路径规划和定价算法上的边际技术优势都在下降，因为开源工具和云
              AI 平台降低了模仿门槛。Bolt 的路径规划并非完全自研（部分使用 Google Maps APIs），尽管动态定价算法受商业秘密保护，但通用方法已为行业熟知并广泛使用。第三，Yango 在东欧市场——Bolt
              核心大本营——的低价策略构成持续威胁，尤其是在欧盟成员国间制裁执行仍不均衡时。第四，如果自动驾驶技术在 5–10 年窗口内大规模成熟，将通过彻底消除 15–20%
              佣金成本，从根本上改写网约车经济模型，使持有车辆的车队能用完整经济效率竞争，而不是靠司机佣金套利。Bolt 与 Stellantis 和 NVIDIA 的 AV
              合作仍处早期，在当前投资周期内不代表可部署车队。第五，欧盟平台工作指令（2024/2831）及各国平行落地，可能迫使大规模劳动者重新分类，抹去支撑 Bolt 定价策略的成本结构优势。如果 Bolt 和 Uber
              都面对类似重新分类成本，相对竞争位置会保留，但绝对利润率将急剧收缩。最尖锐的反向竞争证据是 2024 年劳动者裁决后 Bolt 在英国份额下滑——英国子公司 FY2024 税前利润从 £8.2 million
              降至 £133,000，表明诉讼成本已经实质削弱该市场的竞争投入能力。
