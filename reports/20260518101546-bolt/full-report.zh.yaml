              - CP033
          - type: callout
            title: Yango 地缘政治风险给 Bolt 留出机会
            body: 如果欧盟监管机构在东欧市场果断打击 Yango 的俄罗斯源头公司架构，Bolt 有望在波兰、罗马尼亚、捷克和波罗的海国家这些核心大本营吸收大量市场份额。跟踪欧盟针对 Yango 的监管行动，是高优先级尽调事项。
            calloutType: insight
