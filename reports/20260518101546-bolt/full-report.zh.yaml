chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Bolt Technology OÜ——通常称为 Bolt——是一家爱沙尼亚跨国出行公司，总部位于爱沙尼亚塔林 Vana-Lõuna tn 15。公司由当时 19 岁的 Markus Villig 于 2013
              年 8 月创立，最初名为 mTakso，后更名为 Taxify，并在 2019 年 3 月采用 Bolt 品牌。更名标志着公司战略从出租车叫车扩展到多模式城市出行超级应用。Bolt
              目前运营网约车（核心服务）、电动滑板车和电动自行车租赁、汽车共享（Bolt Drive）、餐饮配送（Bolt Food）、杂货配送（Bolt Market）和企业差旅管理（Bolt for
              Business）。截至 2026 年 5 月，Bolt 覆盖 50+ 个国家、850 座城市，累计服务 200M+ 客户，连接 4.5M+ 司机、骑手和商户伙伴。公司收入运行率在 2025 年 12 月达到
              €3 billion，GMV 运行率超过 €12 billion。Bolt 将使命表述为「让城市为人而建，而不是为车而建」，希望用负担得起、可持续的共享出行方案减少私家车使用。公司自 2024
              年起现金流为正，FY2024 报告收入 €1.99 billion。Bolt 是私人公司，主要法律实体在爱沙尼亚 E-Business Register 注册。公司全球员工超过 4,000
              人，在塔林、柏林、华沙、布加勒斯特、里斯本和伦敦设有运营枢纽。
