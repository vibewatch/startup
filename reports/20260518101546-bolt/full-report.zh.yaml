      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Bolt 的依赖栈在三层外部基础设施上高度集中——路径与地图（Google Maps API）、云计算和存储（AWS）、支付处理（Stripe 加本地
              PSP）——其中没有任何一层拥有短期内可完整部署的替代方案。这些依赖不只是商业风险；它们是架构约束。一旦任何单一供应商激进重定价、质量下降，或因平台政策变化终止访问，Bolt 的运营能力都可能受损。


              Google Maps API 支撑 Bolt 在所有市场估计 90%+ 的路径、地图渲染、ETA 预测和位置智能。Google Maps Platform 定价在 2018 年平均上涨 14×，2023
              年进一步 API 重组使高用量出行平台成本约上升 30%。按 2025 年规模，Bolt Maps API 成本估计为每年 €40–80M，并随行程量按比例增长。替代方案存在（HERE
              Maps、Mapbox、基于 OpenStreetMap 的方案），但在达到可比路径质量前，需要 18–36 个月重新训练 ETA 模型，并投入大量工程资源。AWS 承载 Bolt
              大部分核心微服务、实时匹配引擎、数据管道和欺诈检测基础设施；一个以 AWS+GCP 双部署能力为目标的多云迁移计划正在推进，但估计距离完整运营冗余仍需 24–36 个月。Stripe 处理 Bolt
              大部分欧洲银行卡支付，其拒付率管理和欺诈工具直接影响 Bolt 支付转化和 GMV；向 Adyen 的 PSP
              多元化正在三个西欧市场推进。司机供给本身也构成关键依赖：司机是独立承包商，切换成本为零；按行程量看，Bolt 活跃司机池前 20% 贡献约 50%
              已履约行程——在名义上分散的供给网络中形成隐藏的高集中度依赖。依赖地图（Figure R3）展示这些关键节点及其失效传播路径。
