  - id: TR005
    title: 缓释措施与否决标准表
    columns:
      - 标准 / 监控指标
      - 类型
      - 指标 / 触发条件
      - 当前状态（2026 年 5 月）
      - 行动阈值
      - 投资影响
    rows:
      - - 监管监控计划 — 跟踪 PWD 和零工劳动法
        - 缓释措施
        - 政府事务互动质量和立法管线监控
        - 活跃 — 25 人团队；已提交 PWD 技术咨询意见；每周向 CEO 汇报立法动态
        - 任一前三大欧盟市场通过有约束力的雇员重新归类立法
        - 若两个或以上前 5 大欧盟市场通过，升级至否决标准 1 评估
      - - API 多元化 — 从 Google Maps 迁移到 OSM / HERE Maps
        - 缓释措施
        - 非 Google API 承接的路线规划行程占比
        - 2026 年 Q1 OSM 路由覆盖 15%；2026 年 Q4 目标 40%；已签署 HERE Maps API 协议
        - 18 个月后 OSM/HERE 覆盖率低于 10%，说明计划投入不足
        - 若多元化滑坡，Maps 成本风险上升；要求董事会报告按季度披露进展指标
      - - 多云迁移 — 从 AWS 走向 AWS + GCP 双云部署能力
        - 缓释措施
        - GCP 上可双云部署的核心服务占比
        - 2026 年 Q1 可双云部署 20%；2026 年 Q4 目标 60%；2026 年已分配预算 €12M
        - AWS 服务事件导致欧盟范围平台停机超过 4 小时
        - 触发加速迁移；需要投入运营韧性
      - - FX 对冲计划 — NGN 和 KES 敞口覆盖
        - 缓释措施
        - 对 EUR 对冲的非洲 FX 敞口占比
        - 2026 年 Q1 约 40% 已对冲；2026 年 Q4 目标 60%；NGN 使用 NDF 工具
        - 单季度 NGN 贬值超过 20%，且对冲覆盖低于 40%
        - 非洲 GMV 实质受损；下修非洲对集团 GMV 的贡献
      - - PSP 多元化 — 降低 Stripe 集中度
        - 缓释措施
        - Stripe 占欧洲银行卡支付总量的份额
        - 2026 年 Q1 Stripe 份额约 70%；Adyen 已在德国、法国、荷兰上线；2026 年 Q4 目标 50%
        - Stripe 宕机或争议解决故障影响超过 10% 的欧洲支付量
        - 加速 Adyen 推出；欧洲转化率短期受影响
      - - 否决标准 1 — 前 5 大欧盟市场因 EU Platform Work Directive 将劳动者重新归类为雇员
        - 否决标准
        - 5 个或更多欧盟头部市场通过国家立法并发出执法通知
        - 尚未通过；DE、FR、PL、RO 正在推进国家实施；英国走独立路径
        - 德国、法国、英国、波兰、罗马尼亚同时通过有约束力的重新归类立法
        - 投资逻辑破裂 — 雇佣成本水平下利润率模型不可行；建议退出头寸或全面重组
      - - 否决标准 2 — 伦敦 TfL 运营牌照被吊销
        - 否决标准
        - TfL 牌照状态：当前 / 暂停 / 吊销
        - 牌照当前有效；2026 年 Q4 年度审查按标准安全审计流程进行
        - TfL 因任何原因发出暂停令或不续期通知
        - 高收入市场永久丢失；声誉风险向其他欧盟市政监管机构传导
      - - 否决标准 3 — GMV 同比增长连续两个季度低于 15%
        - 否决标准
        - 披露的季度 GMV 同比增长率
        - 2025 年 Q4：+28% YoY；2026 年 Q1：+24% YoY；趋势健康但在放缓
        - 披露的 GMV 同比增长连续两个季度低于 15%
        - 结构性需求放缓信号；重新评估终端增长率和估值路径
      - - 否决标准 4 — 重大网络安全事件导致 GDPR 罚款超过 €100M
        - 否决标准
        - 任一欧盟或英国 DPA 发布 GDPR 执法决定
        - 当前无执法行动；ICO 正式问询仍在进行；截至 2026 年 5 月未开罚单
        - DPA 对 Bolt 实体发布罚款超过 €100M 的执法决定
        - 消费者信任崩塌；多个 DPA 连锁监管；融资严重受阻
      - - 监控指标 — 前 10 大市场每周司机活跃小时
        - 监控
        - 各市场司机活跃小时绝对值周环比
        - 2026 年 Q1 已建立基线；每月向首席风险官和董事会风险委员会报告
        - 任一前三大市场活跃小时连续四周下降超过 15%
        - 供需失衡指标；接单率和 GMV 面临短期风险
