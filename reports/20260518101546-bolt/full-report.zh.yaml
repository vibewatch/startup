  - id: FV004
    title: 投资 KPI
    type: kpi
    insight: >-
      八个投资维度的 KPI 评分：市场机会和用户牵引力强；抽成率走势和利润率表现良好；超级应用仍早期，产品差异化为中等；EU Platform Work Directive
      使监管风险抬高；财务透明度偏弱，是信心的主要约束。综合信号：在财务透明度改善前，有条件正面。
    data:
      items:
        - label: 市场机会
          note: 强：TAM €200B+，2030 年前 CAGR 12%；渗透不足的 CEE 与非洲仍是主要增长方向
        - label: 收入规模
          note: 良好：GMV €7B+，2025E ARR €1.1–1.3B（Sacra 估计）；Bolt 2024 财务业绩于 2025 年 Q1 发布，确认规模
        - label: 用户牵引力
          note: 强：45+ 个国家 200M 注册用户；Bolt Business 同比增长 40%+，贡献约 20–25% 收入
        - label: 抽成率与单位经济
          note: 良好：各业务线混合抽成率 18–22%；成熟 CEE 网约车市场 EBITDA 利润率 15–18%
        - label: 竞争地位
          note: '良好：30+ 个市场排名 #1–2；佣金率（15–20%）低于 Uber（25–30%），在价格敏感市场推动司机忠诚度'
        - label: 产品差异化
          note: 中等：超级应用愿景在增长，但尚未证明能成为留存护城河；外卖和杂货在西欧仍未成规模
        - label: 监管风险
          note: 较高：EU Platform Work Directive 将于 2026 年转化为成员国法律；关键成本增加概率 30%；GDPR 与竞争调查仍在进行
        - label: 财务透明度
          note: 弱：无经审计合并财务报表；ARR 和利润率估计基于分析师代理指标；任何资本承诺前都需填补的关键尽调缺口
