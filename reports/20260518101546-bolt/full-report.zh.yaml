      - number: '8.2'
        title: 估值背景与融资
        blocks:
          - type: paragraph
            body: >
              Bolt 最近一次披露估值约为 $8.4 billion，来自 2022 年 1 月宣布的 $628 million Series F 轮融资。 该轮由既有投资者领投，使累计融资额增至约 $1.9
              billion。锚定投资者包括 Sequoia Capital 成长基金、G Squared、 Naya Capital、European Investment Fund 以及更早期支持者。Bolt 创始人兼
              CEO Markus Villig 仍持有可观股权； 投资圈通常把这解读为创始人信念的信号，但对机构联合投资者而言，也意味着治理集中风险。


              截至 2026 年 5 月，Bolt 尚未宣布新的股权融资轮。老股市场分析师估计的隐含估值区间为 €7–9 billion——大体相当于 2022 年 Series F 水平，在调整 EUR/USD
              变动后，再因缺少公开财务披露而给予适度叙事折价。Sacra 分析师研究估计， 2025 年 ARR 为 €1.1–1.3 billion，平台总 GMV 约 €7 billion，对应混合抽成率约
              18–22%。Bolt 于 2025 年初发布 2024 年财务结果，是迈向透明度的重要一步；但披露指标不包括经审计的合并 P&L 或资产负债表数据，限制了独立验证。


              入场纪律是投资案例的核心。以 €7 billion 估值入场，按 Sacra 的 ARR 估计，EV/NTM 收入倍数约为 5–6×， 基本接近可比公司中位数。若高于 €8 billion，倍数拉伸至
              6–7×，悲观情景下的安全边际被压缩。 既有优先股堆叠带来的稀释悬置未公开披露，构成重大尽调缺口（见第 6 节）； 在低于 €10 billion 的清算场景中，可能影响实际回报。
