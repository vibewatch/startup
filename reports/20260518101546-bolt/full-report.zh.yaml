          - type: callout
            title: 数据室最高优先级要求：覆盖全部 45+ 市场的完整法律风险登记表
            body: >-
              基于公开资料重建的监管风险登记表较完整覆盖欧盟、英国、尼日利亚和罗马尼亚，但无法验证撒哈拉以南非洲、东南亚和拉美市场的敞口。
              数据室最有价值的单项信息要求，是由法律顾问提供逐市场完整风险登记表，并附执法时间线和重要性评级。
