      - number: '5.6'
        title: 证据项
        blocks:
          - type: callout
            title: 超级 App 是结构性产品护城河
            body: Bolt 是唯一一家欧洲起家、并已把六个出行与配送垂直业务在同一消费者身份下商业化部署的平台。这种打包带来数据交叉授粉，降低单用户 CAC，并形成竞争对手若无同等多垂直投资就难以复制的习惯性 App 使用模式。
            calloutType: strength
            claimRefs:
              - CE021
              - CE022
          - type: callout
            title: 覆盖不足城市市场中的数据飞轮
            body: Bolt 来自东欧和非洲城市的 200M+ 行程数据集——这些城市在全球地图产品中覆盖较少——在调度、ETA 和动态定价上形成复利式准确性优势；新进入者若没有同一市场多年的运营历史，现实上很难复制。
            calloutType: strength
            claimRefs:
              - CE014
              - CE023
          - type: callout
            title: 路径能力仍依赖 Google Maps
            body: >-
              尽管 Bolt 已投入自研路径能力，它仍依赖 Google Maps Platform SDK 做地图渲染——这项第三方依赖带来供应商风险、API 成本敞口（按 Bolt 规模可能每年 $100M+），以及
              Google Maps 条款变化或 Google 更深度整合 Uber 时的战略风险。
            calloutType: risk
            claimRefs:
              - CE016
              - CE025
          - type: callout
            title: AV 合作是选择权价值，不是当前差异化
            body: >-
              Bolt 与 Stellantis 和 NVIDIA DRIVE Hyperion 的合作仍处早期，且没有确认的商业部署时间表。它们传递了战略方向，但不构成当前技术差异化，也不能在 2026
              年投资决策中给予显著权重。
            calloutType: risk
            claimRefs:
              - CE019
              - CE020
              - CE026
              - CE027
          - type: callout
            title: 要求提供技术尽调材料
            body: >-
              关键技术尽调事项包括：（1）评估调度引擎可靠性和可扩展性的架构审查；（2）数据平台成熟度评估（数据质量、模型准确性指标）；（3）IoT 平台安全审计；（4）Google Maps API
              成本结构及任何合同保护；（5）AV 合作条款、里程碑和退出权利。
            calloutType: recommendation
