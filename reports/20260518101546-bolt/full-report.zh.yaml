      - number: '2.3'
        title: 需求驱动、约束与结构性风险
        blocks:
          - type: paragraph
            body: >-
              Bolt 核心市场的网约车需求由持久的结构性驱动支撑：（1）城市化——2024 年欧洲城市人口已超过总人口 75%，且仍在上升，为可行的按需出行扩大密度前提；（2）智能手机和 4G/5G 渗透率在欧盟核心市场超过
              95%，新用户的技术接入门槛基本消失；（3）EU Green Deal 政策以及 Amsterdam、Brussels、London、Madrid 和 70+
              座其他欧洲城市扩大的低排放区（LEZ）限制私家车使用，推动出行方式转向共享交通；（4）疫情后欧洲旅游在 2024 年恢复至 2019 年水平的 112%，为旅游走廊带来增量乘车需求；（5）Bolt 对司机收取
              15–20% 佣金，低于行业 30%+ 常态，形成结构性供给充裕和司机忠诚度，从而支撑稳定等候时间并压住高峰加价。与这些驱动并行存在的，是实质性约束和风险：（1）欧盟平台工作指令（Directive
              2024/2831，2026 年生效）为平台劳动者建立可反驳的雇佣推定，可能抬高司机成本 20–30%；（2）2024 年 11 月英国劳动者身份认定诉讼造成 £200M+ 追溯薪酬责任，并将上诉延续至 2026
              年 Q2；（3）约 56% 欧盟 Bolt 司机多平台接单，限制供给独占；（4）司机性别缺口（女性少于
              5%）限制女性偏好场景渗透，也让公司更难遵守新兴欧盟性别平等要求；（5）非洲特有约束包括货币贬值（NGN、KES）、单次行程经济性较低（$2–5，而欧洲为
              €10+）和监管不可预测。非洲的正向需求不对称——移动支付普及（占交易 62%）、年轻人口结构，以及严重不足的公共交通——部分抵消了这些结构性约束。
