      - number: '5.3'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Bolt 的技术平台是部署在主要云服务商（AWS 和 GCP）上的云原生、微服务系统。架构围绕几个核心域搭建：身份与认证（所有垂直业务单点登录）、地图与路径（Google Maps SDK
              负责渲染，自研路径算法负责路线计算的混合系统）、调度与匹配（将司机 /
              骑手实时分配给订单）、动态定价（峰时加价、收益管理）、支付处理（多币种、多方式，包括银行卡、移动支付和数字钱包），以及数据分析（实时行程和订单数据进入 ML 模型）。后端主要由 Go 和 Python
              微服务构成，强调低延迟调度（低于 200ms 的匹配决策）。移动 App 原生开发：Android 用 Kotlin，iOS 用 Swift，并用共享业务逻辑层复用代码。数据飞轮是 Bolt
              最具战略意义的技术资产：每完成一笔行程，都会增加 ETA 预测、需求预测、动态定价校准和司机供给优化的训练数据。Bolt 在 850+ 城市拥有 200M+ 累计客户和 4.5M+ 司机 /
              骑手伙伴；这一数据优势——尤其在大型全球平台覆盖较少的东欧和非洲城市语境中——带来服务质量的复利式提升。Bolt
              的路径和地图能力包含实时交通、滑板车地理围栏区域、城市特定规定（如低排放区、上下车限制）等自研层，使其相较完全依赖第三方地图 API 具备运营优势。微出行车队运营系统使用 IoT
              遥测数据管理滑板车电量、停车合规、维护排程和需求再分配，全部由专用车队管理看板控制。自动驾驶车辆集成计划通过 Stellantis 合作（2025 年 12 月）在 Bolt 平台部署无人驾驶车辆，并通过
              NVIDIA DRIVE Hyperion 平台（2026 年 3 月）提升 AV 技术栈可扩展性；两项合作均处早期，尚无确认的商业部署时间表。
