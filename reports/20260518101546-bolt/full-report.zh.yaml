  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Bolt 的产品更适合被理解为一个实时城市出行与配送协调平台，服务消费者和企业需求履约的最后一公里。站在消费者侧，Bolt App 是城市内出行、用餐或收货需求的单一入口。消费者打开
              App，选择服务（网约车、外卖、滑板车、租车或生鲜杂货），App 在数秒内匹配可用司机、骑手或车辆，撮合交易并完成服务——全部在一个顺滑流程中完成。网约车流程完全按需触发：消费者输入上车点和目的地，Bolt
              的调度算法用自研路径能力匹配最近的可用司机，给出动态价格，消费者实时确认或取消。ETA 准确性是消费者价值主张的核心——Bolt 的数据模型基于 200M+
              客户行程训练，给出的预计到达时间显著比简单按距离计算更准确。外卖（Bolt Food）流程延伸到餐厅发现、菜单浏览、购物车管理、下单、实时配送追踪、收据和评分——与 Glovo 或 Uber Eats
              类似。Bolt Market（杂货）加入即时零售维度，靠前置仓履约，优化 15–30 分钟送达。Bolt Drive（汽车共享）面向计划性而非临时出行：消费者提前预订特定车辆，用 App 通过 NFC 或
              Bluetooth 解锁，驾驶后归还到指定区域。Bolt for Business 的企业流程把 Bolt API 接入企业费用管理系统（如 SAP
              Concur、Expensify），支持集中企业预订、发票管理和差旅政策合规。B2B 集成降低了企业采购层面的摩擦，形成运营粘性，也把企业账户与消费者账户区分开来。司机和骑手流程由独立 Driver App
              管理，覆盖任务分配、路线指引、收入看板，以及紧急按钮和行程分享等安全功能。
