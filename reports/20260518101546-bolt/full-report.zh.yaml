      nodes:
        - label: '规模与市场位置：45 个市场中 30+ 个排名 #1–2，200M 用户，€7B+ GMV'
        - label: 产品差异化：超级应用刚起步但在增长；较低佣金推动司机忠诚度
        - label: 财务走势：2025E ARR €1.1–1.3B；无经审计 P&L；成熟 CEE 市场 EBITDA 为正
        - label: 监管风险：EU Platform Work Directive —— 关键成本增加概率 30%
