      - number: '4.5'
        title: 财务结论与投资人关注点
        blocks:
          - type: paragraph
            body: >-
              从投资尽调角度看，Bolt 的财务画像同时给出高质量信号和重大缺口。高质量信号包括：（1）规模——FY2024 收入 €1.99B，对一家欧洲起家的私人科技公司已经相当可观；（2）增长——收入 CAGR
              17%，且到 2025 年 12 月收入运行率加速至 €3B；（3）资本效率——2022 年后未再进行新股融资，却已实现现金流转正；（4）机构信用品质——八家一线银行提供 €220M
              循环信贷额度。重大财务缺口包括：（1）经审计的全集团损益表和资产负债表未公开，公开来源无法独立核验盈利能力、毛利率和债务水平；（2）英国劳动者身份分类责任 £200M+
              属重大或有索赔，尚未在任何披露准备金数字中得到明确反映；（3）分部经济性（网约车、外卖、微出行）未披露，无法评估交叉补贴动态；（4）城市或市场层面的 GMV 拆分缺失，掩盖真实集中度风险（若 50% GMV 来自
              5 个城市，风险画像会显著改变）；（5）司机和骑手支付经济性——系统内最大的实际成本驱动项——未单独披露。从收入质量看，平台费有粘性（消费者使用 App 已形成习惯）、与 GMV 挂钩，并分散在 50+
              国家，质量较高。不过，利润率路径仍不确定：如果 EU PWD 迫使司机转为雇员，Bolt
              的基本成本结构会大幅改变；在缺乏各国重分类前利润率清晰视图的情况下，无法有把握地建模重分类后的财务影响。资本强度中等：滑板车车队和汽车共享项目带来资本开支，但核心网约车和配送业务在结构上轻资产。总体财务结论：可投资，但有条件——需要经审计财务报表、分部
              P&L、英国责任量化和国家层面 GMV，才能进入高确信度承销。
            claimRefs:
              - CI033
              - CI034
              - CI035
              - CI036
              - CI037
      - number: '4.6'
        title: 证据项
        blocks:
          - type: callout
            title: FY2024 起现金流转正
            body: Bolt 在 FY2024 实现现金流转正——且 2022 年后未再进行新股融资——是重要财务里程碑，验证了平台的经营杠杆，也证明了资本效率。对需要清晰盈利路径的 IPO 投资人而言，Bolt 的位置因此更有利。
            calloutType: strength
            claimRefs:
              - CI021
              - CI025
          - type: callout
            title: 英国法律责任尚未完全量化
            body: >-
              FY2024 英国账目中准备金增加 £50.5M，说明 Bolt 正在为劳动者身份分类案计提，但 £200M+ 的全部潜在责任尚未公开量化。如果 Q2 2026
              救济听证中的上诉失败，这项重大或有负债可能显著削弱财务画像。
            calloutType: risk
            claimRefs:
              - CI022
              - CI023
              - CI030
          - type: callout
            title: 经审计全集团财务报表未公开
            body: >-
              Bolt 的完整合并损益表和资产负债表只在 Estonian Business Register 备案；没有注册处访问权限，无法取得英文版本。透明度不足使独立财务尽调只能依赖 Sacra
              估计和英国子公司账目——这不足以支撑高确信度承销。
            calloutType: risk
            claimRefs:
              - CI033
              - CI036
          - type: callout
            title: 收入运行率加速，预示 FY2025 强劲
            body: >-
              2025 年 12 月 €3B 的收入运行率，意味着 FY2025 收入显著高于 FY2024 的 €1.99B。如果这一运行率在 Q4 2025 得以维持，FY2025 收入可能达到 €2.5–2.9B——对应
              25–45% 增长，将显著强化 IPO 叙事。
            calloutType: insight
            claimRefs:
              - CI016
              - CI017
              - CI018
          - type: callout
            title: IPO 承诺前的关键尽调要求
            body: >-
              在作出任何 IPO 认购承诺前，投资人必须取得：（1）经审计的 FY2024–2025 合并损益表和资产负债表；（2）分部收入和营业利润拆分（网约车、外卖、微出行）；（3）Q2 2026
              听证后的英国法律责任专家意见；（4）国家层面 GMV 集中度分析；（5）司机总支付额，以验证 25% 抽佣率说法。
            calloutType: recommendation
            claimRefs:
