      - number: '4.2'
        title: 成本结构、毛利率与经营经济性
        blocks:
          - type: paragraph
            body: >-
              Bolt 的成本结构符合典型市场平台特征：最大成本项是向司机、骑手和餐厅伙伴的分成，这一成本内嵌在抽成模型中。由于 Bolt 只把佣金确认为收入，COGS 主要包括支付处理费（估计为 GMV 的
              1–2%，按运行率约 ~€120–240M）、司机支持基础设施、保险缴费和直接平台运营成本。平台费用收入的毛利率估计为 40–60%，由每笔增量交易在软件基础设施上的较低可变成本驱动。不过在经营层面，R&D
              和技术投入（估计每年 ~€400–500M）、G&A 与合规（多司法辖区监管负担推高）、营销和司机获客、以及法律拨备，会大幅侵蚀这一利润率。Sacra 估计 Bolt FY2024 经营亏损为 -€87.7
              million，尽管现金流为正；这说明公司在 EBITDA 层面盈利，但由于滑板车硬件折旧、资本化软件和无形资产摊销，EBITDA 与 EBIT 之间存在缺口。资本开支主要由滑板车和电动自行车车队驱动（Bolt
              运营 100,000+ 台），需要持续替换和扩张投入。Bolt
              Drive（汽车共享）也是资本开支较重的子板块。网约车和餐饮配送核心业务主要是轻资产：软件基础设施跑在云上（AWS/GCP），核心「资产」是司机和消费者网络。营运资本动态有利：乘车款先从消费者处收取，短暂持有后再支付给司机，形成温和正浮存。随着固定技术成本摊到不断增长的
              GMV 上，以及微出行硬件车队成熟、续换周期拉长，毛利率有望随时间改善。英国子公司 FY2024 税前利润仅 £133,000（低于 FY2023 的
              £8.2M），说明在法律暴露较高的市场，诉讼拨备可以让经营利润率事实上归零。
