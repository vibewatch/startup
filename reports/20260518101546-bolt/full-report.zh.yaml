      - number: '7.6'
        title: 缓释措施与否决标准
        blocks:
          - type: paragraph
            body: >
              Bolt 的主要风险缓释架构有四根支柱：监管沟通与合规投入、技术依赖分散、财务风险管理，以及治理成熟化。 监管层面，Bolt 在布鲁塞尔、伦敦、塔林、拉各斯和内罗毕部署了一支 25 人的政府事务与法务团队，
              在最重要的司法辖区主动接触立法者和监管机构。Bolt 已向 EU Platform Work Directive 工作组提交详细技术咨询意见，
              主张基于算法管理差异给予平台经济豁免；沟通结果仍不确定，但提交材料的成熟度高于行业平均。技术依赖层面，Bolt 正推进多云迁移， 目标到 2026 年底让 60% 核心服务可同时部署在
              AWS/GCP；公司也在投入基于 OpenStreetMap 的路线能力，并接入 HERE Maps API， 以把 Google Maps 的依赖度从 90%+ 降至 2027 年底目标 60%。支付栈分散包括
              2025 年在 8 个新市场接入 PSP， 将 Stripe 在欧洲银行卡交易量中的占比从约 70% 降至 2026 年底目标 50%。


              财务风险缓释包括部分外汇对冲计划，覆盖约 40% 的 NGN/EUR 和 KES/EUR 敞口（目标到 2026 年 Q4 达到 60%）； 2025 年起进入新市场时采用轻资产微出行合作模式；以及以 2027
              年集团 EBITDA 打平为目标的盈利计划。治理层面， Bolt 在 2024 年 Series E 之后启动董事会继任规划，2025 年设立直接向 CEO 汇报的首席风险官职能， 并推出为期 12
              个月的工程领导层继任纵深计划。


              否决标准——需要全面重估投资逻辑的条件——定义为：（1）EU Platform Work Directive 在 Bolt 前五大欧盟市场同时落地 具约束力的雇员重新分类立法；（2）伦敦的 TfL
              牌照被暂停或撤销；（3）Bolt GMV 同比增速连续两个披露季度低于 15%； （4）重大网络安全事件导致 GDPR 执法罚款超过 €100M。董事会层面审阅的监测指标包括前 10 大市场每周司机活跃小时、
              月度 GMV 同比增速、欧盟和英国监管案卷动态，以及季度平台可用性 SLA 表现。触发否决标准之前， 这些指标能提前预警业务恶化。
