      - number: '5.4'
        title: 技术差异化、IP 与数据优势
        blocks:
          - type: paragraph
            body: >-
              Bolt 的技术差异化建立在四根支柱上：超级 App 平台护城河、数据飞轮、自研 IoT 硬件 / 固件，以及 AV 选择权价值。超级 App
              护城河主要是产品和运营成就，而不是纯技术成就：没有一家欧洲起家的竞争对手能在大陆级规模上，把 Bolt
              的六个垂直业务并入同一套消费者身份和支付钱包。打包带来数据优势——用户的外卖行为会反馈需求模式，提升网约车调度，反过来也一样——单一垂直竞争对手难以复制。数据飞轮是 Bolt
              最深的技术护城河：路径、定价和匹配算法基于 850+ 城市的城市级历史数据训练，其中很多城市在全球地图产品里覆盖稀疏。在塔林、华沙、布加勒斯特和内罗毕等城市，Bolt
              模型使用的本地行程数据比任何竞争对手都多，带来增量 ETA 和定价准确性优势，并随时间复利扩大。Bolt 尚未公开披露覆盖其路径或定价算法的专利；保护依赖商业秘密、数据独占性，以及复制多年训练集的现实难度。微出行
              IoT 硬件带来中等程度的自研优势：滑板车底盘来自 OEM，但 IoT 模块规格、固件和车队管理软件归 Bolt 自有。Bolt
              因而能控制实物车队的完整软件层，支持远程诊断、预测性维护和地理围栏合规等依赖软硬件垂直集成的功能。与 Stellantis 和 NVIDIA DRIVE Hyperion 的 AV 合作，为商业化 AV
              技术成熟后转向自动驾驶车队运营提供选择权价值。这些合作尚未商业部署；它们代表战略卡位，而不是当下技术差异化。Bolt 面向 B2B 集成的开放开发者 API 是网络效应放大器：每家企业把 Bolt API 接入
              ERP，都会产生切换成本，并降低企业细分市场中员工层面多平台并用的可能性。
