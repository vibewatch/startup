  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价模型与收入结构
        blocks:
          - type: paragraph
            body: >-
              Bolt 的收入模型是平台抽成业务：公司对平台处理的总交易价值（GMV）按多条垂直线收取服务费（佣金）。最主要收入来源是网约车，估计占 FY2024 €1.99 billion 收入的 82%——约 €1.63
              billion——来自每笔车费 15–20% 的佣金。餐饮配送（Bolt Food）贡献约 18%（~€358M），来自餐厅订单抽成，估计抽成率为 25–30%。微出行（Bolt Scooters/Bolt
              Bikes）通过按分钟或按次收费，以及市政许可合同产生收入；目前占总收入比例很小，但战略上重要。Bolt Market（杂货配送）和 Bolt Drive（汽车共享订阅）贡献于正在增长的配送与出行订阅板块，但
              Bolt 尚未单独拆分。Bolt for Business 通过谈判确定的企业合同向 B2B 客户收费，向企业客户提供阶梯价格和发票结算。收入确认遵循标准数字平台会计：公司只将净佣金确认为收入（而非完整
              GMV），符合 IFRS 15 下的代理模式会计。这意味着 Bolt FY2024 报告的 €1.99B，是向司机、骑手和餐厅伙伴支付分成后保留下来的净费用收入。合并层面的整体抽成率约为 GMV 的
              25%（€3B 收入 / €12B+ GMV =
              ~25%），与披露指标一致。随着平台多元化，收入结构略向配送（餐饮、杂货）倾斜，但网约车仍占主导，预计继续作为核心收入引擎。季节性存在但温和：秋冬通勤需求带来更高乘车量，休闲城市有夏季高峰；餐饮配送全年相对稳定。
