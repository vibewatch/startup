  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >
              Bolt 的客户宇宙横跨消费者、企业和供给侧细分市场，包含四类不同的买方 / 付款方 / 用户原型。按行程量看，最大群体是城市通勤者（约 40% 行程），他们在 Bolt 运营城市中用 Bolt
              做日常点到点出行。这类用户主要是通过 Bolt App 直接付款的消费者，相比 Uber 更价格敏感，也是 Bolt Pass 的主要目标。第二类消费者群体——偶发和休闲乘客（约
              30%）——在夜间、周末或活动出行时使用 Bolt；流失率更高，对促销积分更敏感，也更可能与 Uber 多平台并用。


              企业和 B2B 用户（约占网约车收入 18%）是价值最高的付款方细分。50+ 国家超过 30,000 家公司使用 Bolt Business 做集中计费、差旅政策执行，并接入 SAP
              Concur/Expensify。相较消费者细分，企业细分流失率更低，平均订单价值更高（每次行程 €12–18），留存周期更长（3–5 年）。游客和机场乘客（约 12%）属于偶发性高票价细分，忠诚度潜力有限。


              从地域看，Bolt 在中东欧（罗马尼亚、波兰、爱沙尼亚、乌克兰）、撒哈拉以南非洲（尼日利亚 4M+ MAU、肯尼亚）和英国最强。在法国和西班牙，Bolt 是挑战者（有提示品牌认知度
              <40%）；在中东、南美和早期北美（通过多伦多和华盛顿特区的 Hopp 品牌）存在感较小。Bolt Food 增加了一个约 12 million 月活用户的外卖用户基础，覆盖 13
              个国家，密度最高的是波罗的海地区、罗马尼亚和波兰。微出行用户（Bolt Scooters/Bikes）集中在巴黎、塔林和华沙。
