    description: 端到端运营流程，覆盖核心网约车用例：从消费者出行需求，到司机派单，再到行程完成和支付结算。
    approximationNotes: 工作流步骤基于公开 App 文档和用户体验指南整理，具有代表性。内部步骤数量和系统延迟为估计值。
