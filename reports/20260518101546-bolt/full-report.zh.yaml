      - number: '2.2'
        title: 市场规模与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              2026 年全球网约车和出租车市场估计为 $179.1B（Business Research Company，5.8% CAGR）至
              $216.9B（Statista，更宽口径）。欧洲估计分歧很大：6WResearch 采用狭义平台口径，将欧洲网约车市场定为 $18.4B；Verified Market Research 以约 $17.5B
              佐证这一量级；Market Data Forecast 采用包含出租车和物流的广义共享出行定义，给出 $64.3B。欧洲按需客运市场一个可辩护的中点是 $28–40B。欧洲餐饮配送 2026 年估计为
              $83.1B（Mordor Intelligence，7.0% CAGR），而 Statista 更宽的电商配送定义达到 $131.6B；与 Bolt Food 最相关的是餐厅配送子市场，估计占 Mordor
              总量中的 $35–45B。非洲网约车规模更小但在增长，2026 年为 $2.64B（Mordor Intelligence，4.25% CAGR）。截至 2025 年 12 月，Bolt 全市场、全产品 GMV
              运行率为 €12B+。按 Sacra 估计的收入结构（82% 网约车、18% 配送），Bolt 网约车 GMV 约为 €9.8B，餐饮配送 GMV 约为 €2.2B。若对照欧洲狭义 TAM 约 €17B，Bolt
              网约车渗透率接近 ~58%；若对照广义 €64B TAM，渗透率降至 ~15%。按历史 CAGR 推进，2030 年前瞻市场全球约可达 $250–290B；如果 Bolt
              能在监管和竞争逆风中守住或扩大份额，增长池仍然很大。相互矛盾的估计被保留为证据缺口（见 GM001），因为定义不一致本身就是重要尽调发现。
