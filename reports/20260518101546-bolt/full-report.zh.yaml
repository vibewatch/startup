            title: 没有消费者订阅锁定
            body: >-
              Bolt 没有 Uber One 的对应产品；Uber One 收取 $9.99/month，并把乘车折扣与免费 Uber Eats 配送打包。没有订阅产品，Bolt 只能靠价格竞争留住消费者——这一战略位置弱于
              Uber，且 Uber 正在主动利用这点。
            calloutType: risk
