  - id: FR001
    title: 风险热力图
    type: matrix
    insight: >-
      综合风险优先级最高（发生可能性 × 严重性）的是 EU Platform Work Directive 执法：可能性高、严重性关键，因此落在右上象限，是定义本轮投资的核心风险。TfL 牌照条件与 GDPR / ICO
      执法均为中等可能性、高严重性。非洲汇率侵蚀（NGN/KES）是高可能性、高严重性的运营风险。网络安全泄露和 CEO 离任可能性低，但属于关键 / 高严重性的尾部风险，需要董事会层面监测。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重性：关键
          values:
            - label: 网络安全泄露（位置数据）
            - label: TfL 牌照吊销
            - label: Platform Work Directive 执法
        - label: 严重性：高
          values:
            - label: CEO / 创始人离任
            - label: GDPR / ICO 执法行动
            - label: 非洲汇率侵蚀（NGN/KES）
        - label: 严重性：中
          values:
            - label: AWS 长时间宕机（多日）
            - label: Google Maps API 成本重新定价
            - label: 罗马尼亚监管扰动
        - label: 严重性：低
