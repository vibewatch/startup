  - id: FV001
    title: 推荐逻辑
    type: flow
    insight: >-
      推荐逻辑从 Bolt 已验证的规模和市场位置出发，经产品差异化和财务走势证据，推导出有条件正面结论。关键分叉点是入场估值：高于 €8B 后，风险回报会明显恶化。EU Platform Work Directive 与 Uber
      竞争风险是两个主要负向修正项，把建议从明确正面压到有条件正面。
