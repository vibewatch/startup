      - number: '1.4'
        title: 关键里程碑、反向事件与监管暴露
        blocks:
          - type: paragraph
            body: >-
              2013 至 2026 年，Bolt 的运营轨迹涵盖创立、快速国际扩张、产品多元化、重大融资事件，以及显著的法律与监管逆风。公司最初靠一笔 €5,000 家庭借款和塔林 50 名招募司机起步，2014
              年扩张至波罗的海国家，2016 年进入非洲（南非、尼日利亚、肯尼亚），2017 年吸引 DiDi Chuxing 投资。2019 年 3 月从 Taxify 更名为
              Bolt，标志着公司从出租车聚合器转向多模式城市出行平台；同一时期，餐饮配送服务和电动滑板车业务也正式推出。2021–2022 年资本里程碑快速抬升，最终以 €628 million Series F、峰值估值
              €7.4 billion 告一段落。重大反向里程碑出现在 2024 年 11 月：英国就业法庭裁定 Bolt 英国司机——由 Leigh Day 律所代理的 15,000 名原告代表超过 100,000
              人——属于劳动者，而非自雇承包商。该裁决可能使 Bolt 面临 £200 million 或更高的追溯薪酬索赔。Bolt 于 2024 年 12 月上诉，财务补救听证定于 2026 年
              Q2。另一起事件中，Corporate Europe Observatory 于 2024 年 5 月披露，Bolt
              曾为爱沙尼亚政府起草一封拟转交欧盟理事会、反对平台工作指令的信件；这一发现引发爱沙尼亚公众抗议，也让外界质疑 Bolt 政治影响力的深度。FY2024，Bolt 英国利润几乎被抹去：税前利润从 2023 年的
              £8.2M 跌至 £133,355，原因是法律拨备成本增加 £50.5 million。正面进展是，Bolt 于 2025 年 3 月赢得一项关键 VAT 争议，上级税务法庭驳回 HMRC 关于 Tour
              Operators' Margin Scheme 的上诉，使 Bolt 只需按其利润缴纳 VAT。近期战略合作包括与 Stellantis 合作在欧洲推进大规模无人驾驶出行（2025 年 12
              月），以及为自动驾驶汽车扩张建立 NVIDIA DRIVE Hyperion AI 合作（2026 年 3 月）。
