  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              Bolt 处在三个独立市场的交叉点：按需地面交通（网约车）、按需餐饮和杂货配送，以及微出行（电动滑板车和电动自行车）。网约车是公司创立时的业务，也是最大板块，涵盖消费者通过 Bolt app 预订的 B2C
              乘车服务，供给侧来自私人租赁车辆和持牌出租车。该定义不包括公交、铁路、汽车租赁和企业车队租赁；但 Bolt for Business（B2B 用车管理）与核心消费者服务相邻。餐饮配送（Bolt
              Food）覆盖餐厅到消费者的最后一公里配送；杂货配送（Bolt Market）覆盖按需暗仓履约。两者在 TAM
              计算中都归入「餐饮和杂货配送」板块。微出行——电动滑板车和电动自行车——被计入网约车收入线，未单独披露。从地域看，Bolt 的主市场是欧洲：50+
              个国家横跨西欧、中欧、东欧和英国。撒哈拉以南非洲是活跃的第二市场，自 2016 年起在南非、尼日利亚、肯尼亚、坦桑尼亚、加纳等地运营。中东业务集群仍处早期，北美试点（Hopp 品牌，多伦多和 Washington
              DC，2025 年）截至 2026 年 5 月在 GMV
              上尚不具备重要性。现状替代品因板块而异：网约车的替代品是私家车拥有、路边扬招出租车和公共交通；杂货配送的替代品是超市到店购物；微出行的替代品是骑行和步行。每类替代都有明显存量优势，切换成本中等，主要来自习惯，而非合同约束。
