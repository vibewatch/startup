              2024 年 11 月，英国就业法庭裁定 Bolt 司机属于劳动者（而非自雇），使公司可能面临来自 100,000+ 名司机的 £200M+ 追溯薪酬索赔。Bolt 已经上诉，但财务补救听证定于 2026 年
