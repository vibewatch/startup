      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              EU Platform Work Directive（PWD）于 2024 年 4 月获欧洲议会原则性通过，并将在 2026 年进入各国实施阶段，是 Bolt 组合中最重大的法律风险。PWD
              引入可反驳推定：数字劳动平台上的零工劳动者被推定为雇员，除非平台能对照一组法定控制和依赖标准证明并非如此。对 Bolt 而言，其在欧洲约有 2.5–3 million
              注册司机以独立承包商身份运营；一旦重分类，将触发雇佣成本——社会保险缴款、国家最低工资义务、带薪休假权利和解雇保护——估计会使受影响市场的平台贡献利润率压缩 15–25 个百分点。英国最高法院 2021 年 2
              月针对 Uber 的裁决、西班牙最高法院 2024 年把雇员身份延伸至 Glovo 骑手的裁决，以及多个法国社会保障法庭结论，已经形成级联式判例环境，单靠合同架构无法中和。


              在英国，TfL 向 Bolt 发放的有条件运营牌照要求年度安全审计、行程接受时强制验证司机保险，以及向监管方实时共享行程数据。若无法满足条件，牌照可能被暂停或撤销，Bolt
              将被排除在欧洲票价最高的网约车市场之一之外。UK Information Commissioner's Office 对出行平台运营商位置数据留存实践有一项正式公开调查——Bolt 与 Uber
              均被点名——重点审查其是否符合 UK GDPR 数据最小化义务。在爱尔兰，Data Protection Commission 正审查跨境 EU 司机数据转移；荷兰监管机构曾在 2024 年因这一领域问题对
              Uber 处以 €290M 罚款。尼日利亚内政部要求每年续签运营牌照，且受部长裁量影响；若不续签，Bolt 最大单一非洲市场将被清除，估计约占集团 GMV 8%。罗马尼亚出租车游说团体在 2023–2025
              年两次成功推动限制网约车平台运营的立法修订，使 Bolt 最大中东欧市场（约 10% GMV）持续处于监管不稳定中。如果 Bolt 在 EU 的市场地位跨过指定门槛，EU Digital Markets Act
              可能对其施加守门人义务——数据可携带、互操作和算法透明要求；这项敞口的法律分析仍处早期。
