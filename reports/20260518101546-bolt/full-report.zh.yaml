      - number: '2.5'
        title: 要点陈列
        blocks:
          - type: callout
            title: 大且增长中的市场，Bolt 在服务不足地区领先
            body: >-
              Bolt 运营于欧洲和非洲的网约车与餐饮配送市场，合计可服务池为 $100–150B。在中东欧——Uber 历史上竞争不那么激进的地区——Bolt 以价格和司机供给领先。在撒哈拉以南非洲，Bolt
              受益于先发优势，并集成了本地竞争对手难以轻易复制的移动支付。这些地区资本竞争弱于西欧，为收入防御性和上行空间提供支撑。
            calloutType: strength
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM031
              - CM032
          - type: callout
            title: 欧盟平台工作指令可能抹去 Bolt 的佣金率竞争护城河
            body: >-
              Bolt 的核心竞争优势——向司机收取 15–20% 佣金，而行业常态为 30%+——依赖司机被认定为自雇。欧盟平台工作指令（2026 年生效）在欧盟成员国建立可反驳的雇佣推定。如果 Bolt
              无法推翻该推定，强制司机重新分类可能把用工成本抬高 20–30%，抹去佣金优势，并迫使公司要么涨价（削弱乘客需求），要么压缩利润率。英国劳动者身份认定裁决（上诉中）进一步放大了这一风险。
            calloutType: risk
            claimRefs:
              - CM022
              - CM023
              - CM025
          - type: callout
            title: TAM 定义范围很宽，制造 SAM 不确定性
            body: >-
              公开分析师报告的欧洲网约车 TAM 估计从 $18.4B 到 $64.3B，相差 4×，原因是范围定义不一致。这一跨度使外界无法精确量化 Bolt 的欧洲市场渗透率；根据采用的 TAM 不同，渗透率从 ~15%
              到 ~58% 不等。分析师和投资者在建模可服务收入、评估 Bolt 增长主张时，应同时纳入两种定义做情景分析。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM016
              - CM017
          - type: callout
            title: 餐饮配送 GMV 仅占欧洲 TAM 的 2–3%，战略上仍是问号
            body: >-
              尽管 Bolt 自 2019 年起运营 Bolt Food，估计欧洲餐饮配送 GMV 约 ~€2.2B，仅占 €83B 欧洲餐饮配送 TAM 的约
              2–3%。这要么意味着巨大的增长机会，要么提出一个战略问题：Bolt 能否有效对抗 Delivery Hero（Glovo）、Just Eat
              等资本充足的专业玩家。高渗透网约车核心与仍处早期的餐饮配送板块之间如何分配资本，是投资者应在管理层尽调中重点压力测试的战略决策。
            calloutType: insight
            claimRefs:
              - CM013
              - CM018
