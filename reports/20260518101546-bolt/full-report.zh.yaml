      - number: '5.5'
        title: 信任、安全、信息安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              信任与安全处在 Bolt 商业模式的运营核心：其市场经济性依赖消费者和司机相信平台能够撮合安全、可靠、无欺诈的交易。主要消费者安全功能包括行程后双向评分（司机给乘客评分，乘客给司机评分）、紧急按钮（App
              内紧急联系，并向急救服务或可信联系人实时共享位置）、行程分享（向朋友或家人分享实时行程进度）、司机上线时强制身份和背景核查，以及车牌验证。司机安全功能包括车费保护、App
              内消息以避免直接分享电话号码，以及举报攻击性乘客行为的能力。所有背景核查和身份验证要求都按国家设定；在 EU 市场，Bolt 遵守当地运输牌照法律，并常常高于最低要求，以维持运营牌照。在数据隐私上，Bolt
              在全部 27 个 EU 成员国受 EU General Data Protection Regulation（GDPR）约束，英国脱欧后还受 UK GDPR 约束。Bolt 将 EU 客户数据存放在 EU
              境内数据中心，满足 GDPR 数据驻留要求。Bolt 对 200M+ 客户的数据处理构成欧洲出行领域规模最大的 GDPR 监管数据集之一；任何重大泄露都可能导致最高达全球年营业额 4% 的罚款（按 FY2024
              收入约为 €120M+）。网络安全由专门的信息安全团队管理；截至 2026 年 5 月，尚无已披露重大泄露。Bolt 在所有市场的支付卡处理均保持 PCI-DSS 合规。在微出行领域，Bolt
              遵守城市特定许可和运营要求，包括地理围栏区域、最高车队规模上限、停车要求和滑板车硬件安全认证。50+ 国家监管合规由专门本地法律和公共事务团队管理，并由 Bolt 首席法务官监督的集中合规职能统筹。随着 EU
              自动驾驶车辆法规演进，NVIDIA DRIVE Hyperion AV 合作将需要额外监管合规。
