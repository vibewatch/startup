      - number: '3.3'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              对 Bolt 及其主要竞争者在网约车、餐饮配送、微出行、汽车共享、B2B 和自动驾驶能力上的比较显示，Bolt 最强的竞争位置来自超级应用供给宽度与司机经济性优势的结合。消费者定价上，在
              Warsaw、Bucharest、Tallinn 等共同市场，Bolt 通常比 Uber 低 5–15%，等候时间也更短，原因是这些城市中 Bolt 的相对司机池更大。Uber 的高端 UberX 和
              Comfort 产品有价格溢价，而 Bolt 的同类产品定价更具竞争力。司机佣金上，Bolt 15–20% 抽成率优于 Uber 全球报告的 25–30%+ 有效抽成率。InDriver 的 5–10%
              名义费率看似更低，但其不可预测的定价模型和缺少高峰加价，使司机实际收入更不稳定。Yango 在重叠市场收取与 Bolt 接近的佣金，但欧盟牌照风险可能约束供给。功能宽度上，Bolt 是唯一一家源自欧洲、在单一
              app 中同时提供网约车、餐饮配送、杂货、微出行、汽车共享和 B2B 企业差旅的平台。Uber 在全球范围能匹配这一范围，但在多数欧盟市场并不原生运营杂货配送，欧洲汽车共享也仅限于有限试点。Delivery
              Hero/Glovo 只专注配送，没有网约车。Free Now 提供聚合器（出租车 + 网约车），但当前形态没有餐饮或微出行产品。分发能力上，Uber 在西欧的品牌认知、与 Google Maps
              的合作（Uber 会原生出现在 Maps 搜索结果中），以及 Uber Eats 交叉营销，构成 Bolt 尚未完全匹配的真实 GTM 优势。Bolt 新市场 GTM
              高度依赖司机经济性叙事和价格竞争，这一打法有效，但建立自然品牌认知更慢。监管姿态上，Bolt 和 Uber 在欧洲都面临劳动者身份认定风险；但 Bolt 在 2024
              年前英国市场份额更小，并依赖爱沙尼亚法律实体结构，带来额外复杂度。Yango 的俄罗斯源头公司架构受到欧盟监管审查，因此面临急性牌照风险。
