      - SV027
      - SV028
      - SV004
    notes: 概率估计反映分析师截至 2026 年 5 月基于监管管线监测和竞争情报作出的判断，并非模型推导。
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 尽调事项
      - 目的
      - 优先级
      - 阈值 / 红旗
    rows:
      - - 经审计合并损益表、资产负债表和现金流量表（FY2023–FY2025）
        - 验证 ARR / GMV 估计；确认 EBITDA 利润率轨迹；评估现金头寸和跑道；核验各垂直抽成率
        - 关键
        - 红旗：网约车业务在规模化后 EBITDA 仍为负；净债务高于 €500M；审计师出具保留意见
      - - 按垂直和地区拆分的单位经济性（贡献利润率、CAC、LTV）
        - 确认中东欧网约车 EBITDA 利润率估计值 15–18%；评估外卖和杂货相对 GMV 的烧钱；识别垂直之间的交叉补贴
        - 高
        - 红旗：按 2025 年运行率，两项或更多垂直贡献利润率为负；外卖每新增用户 CAC 高于 €25
      - - 股权结构表、优先清算瀑布和期权池明细
        - 量化稀释压力；建模 €4–5B、€7B 和 €10B 退出时的清算优先权堆叠；评估 IPO 时创始人持股保留
        - 高
        - 红旗：超过 20% 的股权对应高于 2× 的清算优先权；IPO 后期权池摊薄压力超过 15%
      - - 管理层 IPO 准备计划、审计时间线和治理结构
        - 确认在两年审计要求下 2026–2027 年 IPO 是否可行；评估董事会独立性、审计委员会结构和 ESG 报告准备度
        - 高
        - 红旗：截至 2026 年 5 月尚未启动审计聘约；除投资者提名人外没有独立董事；没有具备上市公司经验的 CFO
      - - Platform Work Directive 后欧盟市场的司机合同状态
        - 评估重新分类法律风险；若 25–30% 欧盟司机被重新分类，量化成本；审查 2025–2026 年针对 Bolt 的现有诉讼和任何就业法庭案件
        - 关键
        - 红旗：三个以上欧盟市场存在就业法庭程序；未计提法律准备金；未制定应急用工模型
      - - Bolt 前 10 大中东欧和非洲市场的竞争性市场份额数据（2024–2026）
        - 验证市场领导地位主张；确认 Bolt 在 30+ 个市场排名第 1 或第 2；识别 2025–2026 年 Uber 或本土竞争者夺取份额的市场
        - 中
        - 红旗：Bolt 在三个或更多前 10 大市场的份额下滑；Uber 已在五个或更多 Bolt 核心城市上线或宣布进入
    claimRefs:
      - CV027
      - CV032
      - CV042
    sourceRefs:
      - SV010
      - SV016
      - SV017
      - SV027
    notes: 六项均为标准 IPO 前数据室请求。第 1 和第 5 项列为关键，因为它们决定投资逻辑；未解决前，不建议投入资本。
