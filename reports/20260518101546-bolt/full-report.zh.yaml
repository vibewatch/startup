      - number: '5.2'
        title: 产品模块与资产地图
        blocks:
          - type: paragraph
            body: >-
              Bolt 的产品组合包括六个面向消费者的服务模块、两个运营侧应用，以及一个 B2B 集成层——全部由共享平台基础设施编排。主要模块包括：Bolt Rides（网约车，核心产品）、Bolt
              Food（餐厅配送）、Bolt Market（通过前置仓配送杂货）、Bolt Scooters 和 Bolt Bikes（微出行租赁）、Bolt Drive（汽车共享订阅），以及 Bolt for
              Business（企业差旅管理）。每个模块都有自己的产品团队，但都共享同一套消费者身份层（单一登录、共享支付钱包、统一评分历史）、同一套地图和路径引擎（Bolt 已建立大量自研路径能力，尽管部分地图渲染仍使用
              Google Maps SDK），以及同一套动态定价基础设施。实物资产包括部署在 30 个 EU 城市的 100,000+ 辆电动滑板车和电动自行车微出行车队。每辆滑板车都配有自研 IoT
              硬件（蜂窝模块、GPS、加速度计、防篡改检测），可实现远程上锁 / 解锁、地理围栏停车合规、蓄电池监测和实时遥测。IoT 固件由 Bolt 硬件工程团队管理；滑板车整车由第三方 OEM（主要是中国供应商）制造，但
              IoT 模块由 Bolt 指定。Bolt Drive 在部分城市运营规模更小的共享汽车车队，通过第三方车队管理系统管理。两个面向运营者的应用分别是 Bolt Driver App（iOS 和
              Android，用于网约车 / 配送司机）和 Bolt Courier App（面向外卖 / 杂货骑手，针对 Android 优化）。Bolt for Business API 是 B2B 集成层——一个
              RESTful API，开发者文档位于 developer.bolt.eu，允许企业系统代表员工创建、管理并开票行程，无需员工拥有个人消费者账户。
