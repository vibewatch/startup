      - number: '7.7'
        title: 展示材料
        blocks:
          - type: callout
            title: EU Platform Work Directive：投资逻辑级监管风险
            body: >-
              如果 EU Platform Work Directive 在 Bolt 前五大欧洲市场同时落地具约束力的雇员重新分类，Bolt 的贡献利润率估计会被压缩 15–25
              个百分点——原本可信的盈利路径叙事会变成结构性亏损模型，迫使公司彻底重设商业模式。这是投资尽调中优先级最高的单一风险， 也是首要的投资逻辑破裂触发器。
            calloutType: risk
            claimRefs:
              - CR001
              - CR029
          - type: callout
            title: Google Maps API：12 个月内没有替代方案的关键依赖
            body: >-
              Bolt 90%+ 行程通过 Google Maps API 路由，估计年成本 €40–80M。Google 在 2018 年曾对 Maps Platform 进行 14×
              定价重构，说明其有意愿单方面、大规模重新定价。基于 OSM 的路线能力已在投入，但距离形成有意义覆盖还需 24+ 个月。 这一依赖是平台最被低估的单点风险。
            calloutType: risk
            claimRefs:
              - CR014
              - CR038
          - type: callout
            title: 明确否决标准与董事会层面风险治理
            body: >-
              Bolt 已定义四项明确否决标准，包括 Platform Work Directive 执行、TfL 撤销、GMV 增速低于 15%，以及重大 GDPR 罚款； 相关监测指标由董事会层面审阅。以 Bolt
              的规模和阶段看，这种治理成熟度并不常见，也为投资者提供了持续尽调的结构化框架。
            calloutType: strength
            claimRefs:
