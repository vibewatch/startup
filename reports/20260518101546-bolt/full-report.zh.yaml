        title: 要点陈列
        blocks:
          - type: callout
            title: 司机经济模型护城河
            body: >-
              Bolt 向司机收取 15–20% 佣金，而 Uber 为
              30%+，这形成持久的供给侧优势，并在关键市场体现为更好的司机流动性、更短等候时间和有竞争力的消费者价格。这条护城河真实且可衡量，但受到欧盟平台工作指令威胁。
