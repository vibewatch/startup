      - number: '2.4'
        title: Bolt 市场位置与可服务空间
        blocks:
          - type: paragraph
            body: >-
              Bolt 的市场位置由低成本领先、地域覆盖广和多产品超级应用构成，后者带来跨板块捆绑优势；但相对 Uber
              的资本约束，以及在西欧高端板块有限的品牌认知，抵消了部分优势。在中东欧——罗马尼亚、爱沙尼亚、立陶宛、拉脱维亚、波兰、匈牙利——Bolt 是市场领导者或并列领导者，在司机供给深度和价格上胜过
              Uber。在西欧，Bolt 是 Uber 身后的强二号；Free Now（BMW/Stellantis）已退出多个市场，多数城市的三方竞争缩成双寡头。在撒哈拉以南非洲，Bolt
              在南非、尼日利亚、肯尼亚、坦桑尼亚和加纳领先或并列领先，靠 2016 年先发优势和移动支付集成发力。在餐饮配送，Bolt Food 相对 Delivery Hero/Glovo 和 Just Eat
              在东欧拥有实质位置，但在西欧存在感很弱。可服务空间评估：若按欧洲狭义网约车 TAM 约 €17B，Bolt 约 €9.8B 网约车 GMV 意味着 ~58%
              渗透率，水平很高，也暗示其最强市场正在接近饱和。若按广义 €64B TAM，渗透率为 ~15%，意味着出租车、企业车队和城际出行等相邻板块仍有大量空间。餐饮配送约 €2.2B GMV 对照 €83B 欧洲餐饮配送
              TAM，渗透率约 ~2.7%，显示增长潜力显著，但也引出 Bolt Food 能否与资本更充足的专业玩家竞争的问题。非洲网约车约 €0.3B GMV 对照 $2.64B TAM，渗透率约
              11–13%；考虑到非洲单次行程经济性更低，这一水平高于预期，说明 Bolt
              在其非洲足迹中拿到了相对强的份额。买方分层差异明显：城市消费者优先考虑价格和等候时间；企业客户重视照护责任和费用管理集成；游客需要可靠性和语言支持；非洲城市乘客需要移动支付选项，并在部分市场需要现金接受能力。
