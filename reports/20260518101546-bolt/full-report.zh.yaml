      - number: '4.4'
        title: 资本充足性、融资依赖与现金跑道
        blocks:
          - type: paragraph
            body: >-
              Bolt 的资本结构呈现出一家私人公司已经完成主要成长股权融资阶段，现在靠留存现金流、循环信贷额度和 IPO 选择权价值继续管理。2013 至 2022 年多轮累计股权融资约 €2.22
              billion，构成资本基础；最近一次一级股权事件是 2022 年 1 月 €628 million 的 Series F。此后未宣布新的一级股权轮次——近 4 年空窗值得注意，说明 Bolt
              正在转向现金流自给。最近一次一级资本事件是 2024 年 5 月关闭的 €220 million 循环信贷额度，由八家大型银行组成的银团提供：Barclays、BNP Paribas、Citi、Deutsche
              Bank、Goldman Sachs、JPMorgan、LHV Pank 和 Luminor。Goldman Sachs、JPMorgan 和 Citi 未来都可能为 IPO
              提供顾问服务；它们参与进来有战略意义，也释放出机构对 Bolt 信用品质的信心。2024 年以来现金流转正，意味着 Bolt 不再像 2020–2022
              年扩张期那样快速消耗储备。不过，确切现金余额和现金跑道未公开披露。循环信贷额度为营运资金需求提供流动性缓冲，也可被动用来支付法律责任（英国劳动者案）或战略投资（滑板车车队、新市场进入）。重大财务风险包括：（1）英国劳动者身份分类案，Q2
              2026 救济听证可能把 £200M+ 义务坐实；（2）EU Platform Work Directive（PWD）转置成本，可能需要为雇佣福利义务准备大量营运资金；（3）Stellantis/NVIDIA
              AV 合作若推高资本强度，可能需要股权或债务融资；（4）IPO 定价偏低或延迟风险。2025 年二级股份出售估值 $6.82 billion，加上 €220M 循环信贷，表明 Bolt
              财务位置稳定，但资本并不冗余。若以收入 2–3x 的估值
              IPO（$6–9B），公司将获得可观新增资本，支持下一阶段增长并降低资产负债表风险。公司的财务结论是：平台正在成熟，已证明收入规模和现金流管理能力，但透明度不足，且英国法律责任带来更高的表外风险。
