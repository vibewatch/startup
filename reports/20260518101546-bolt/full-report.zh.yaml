  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 理由
    rows:
      - - 整体建议
        - 有条件看多 — 观察名单 / ≤€7B 共同投资
        - CEE 和非洲市场领先（200M 用户、45+ 个国家、超级应用可选性）；入场价格纪律至关重要；未审计财务限制确定性
      - - 置信度
        - 中等
        - 规模和市场验证真实存在；但 ARR/GMV 估算是分析师代理值，不是审计账；监管周期结果二元且重要
      - - 风险评级
        - 中高
        - EU Platform Work Directive 转化（2026）、Uber 在 CEE 进攻、私募市场流动性不足；三者各自都有能力拖累基准情景
      - - 估值立场
        - €7B 合理 / 高于 €8B 偏贵
        - 按 €1.3B 2025E ARR 计，5× NTM 收入 = €6.5B；基准情景 IPO 估值为 5× €2B 2027E ARR = €10B；若入场估值高于 €8B，相比 €4.2B 悲观情景安全边际有限
      - - 目标回报（基准情景）
        - ≤€7B 入场，3–4 年 1.4–2.0×
        - 基准情景 €10B IPO 意味着 €7B 入场回报 1.4×；乐观情景 €18B 意味着 €7B 入场回报 2.6×；悲观情景 €4.2B 意味着 0.6× 亏损
      - - 持有 / 再平衡 / 退出触发条件
        - 悲观情景触发条件出现即退出（零工重新归类 ≥3 个欧盟市场、Uber 在 ≥10 个核心城市价格战、IPO 定价 <€6B）
        - 任一触发条件都会推翻通往盈利的叙事，并提前引发资本需求；€4.2B 悲观情景意味着 €8B 入场亏损 40–50%
