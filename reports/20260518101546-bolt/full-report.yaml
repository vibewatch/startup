              While Bolt has invested in proprietary routing, it still relies on the Google Maps Platform SDK for map
              rendering — a third-party dependency that carries vendor risk, API cost exposure (potentially $100M+
              annually at Bolt's scale), and strategic risk if Google Maps terms change or if Google integrates Uber
              more deeply.
