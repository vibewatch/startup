      - number: '7.5'
        title: Financial and Execution Risk
        blocks:
          - type: paragraph
            body: >
              Bolt's financial and execution risks are concentrated across four dimensions: cash burn and capital
              adequacy, micromobility capital intensity, foreign exchange exposure in emerging markets, and people and
              governance fragility arising from rapid international expansion at pace with limited institutional depth.


              Bolt's cash burn is estimated at €250–400M annually at current expansion rates, with the upper end driven
              by micromobility fleet replacement cycles, Bolt Food restaurant acquisition subsidies, and competitive
              promotional spend against Uber in Western European markets. At a reported cash and equivalents position of
              approximately €1.2–1.6B post-Series E/F, this implies a runway of 3–5 years without additional
              fundraising—adequate but not comfortable given the capital demands of a full EV fleet transition and
              continued European market deepening. Micromobility fleet capital intensity is a persistent drag: Bolt's
              scooter and e-bike fleet (42M+ trips in 2025) requires capital reinvestment of €200–300 per unit per year
              for maintenance, battery replacement, and city authority permit renewal, and the fleet cannot be rapidly
              wound down without city permit obligations. In Africa—where Nigeria and Kenya together account for an
              estimated 12–15% of group GMV—the Nigerian naira (NGN) has depreciated over 60% against the euro since
              2022, converting strong local-currency GMV growth into material USD/EUR losses. Bolt's FX hedging
              programme reportedly covers approximately 40% of NGN and KES exposure, leaving a significant unhedged
              tail. Competitive subsidy wars with Uber in the UK, France, and Spain require ongoing promotional spend
              estimated at €80–120M annually, creating elevated and structurally difficult-to-reduce CAC in Bolt's
              priority Western European growth markets. CEO and founder concentration risk—Markus Villig founded Bolt at
              age 19, retains significant equity and strategic authority, and is the primary relationship holder with
              institutional investors—means platform narrative, investor confidence, and strategic direction are closely
              tied to a single individual. Engineering talent attrition against FAANG and unicorn competitors in
              Tallinn, London, and Amsterdam is an ongoing operational risk, with Glassdoor scores among engineers at
              3.6 reflecting competitive pressure on compensation and career development.
