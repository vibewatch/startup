  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Bolt's product is best understood as a real-time urban mobility and delivery coordination platform that
              operates in the final mile of consumer and business need fulfilment. From the consumer perspective, the
              Bolt app serves as a single touchpoint for any need to move, eat, or receive goods within a city. A
              consumer opens the app, selects a service (ride, food delivery, scooter, car rental, or groceries), the
              app matches them with an available driver, courier, or vehicle within seconds, facilitates the
              transaction, and completes the service — all within a single seamless flow. The ride-hailing workflow is
              fully on-demand: the consumer specifies pickup and destination, Bolt's dispatch algorithm matches the
              nearest available driver using proprietary routing, quotes a dynamic fare, and the consumer confirms or
              cancels in real-time. ETA accuracy is central to the consumer value proposition — Bolt's data models
              trained on 200M+ customer trips drive significantly more accurate estimated arrival times than simple
              distance-based calculations. For food delivery (Bolt Food), the workflow extends to restaurant discovery,
              menu browsing, cart management, order placement, real-time delivery tracking, and receipt/rating — a
              workflow comparable to Glovo or Uber Eats. Bolt Market (grocery) adds a rapid commerce dimension with dark
              store fulfilment optimised for 15–30 minute delivery. Bolt Drive (car-sharing) targets planned rather than
              spontaneous trips: consumers book a specific vehicle in advance, unlock it via the app using NFC or
              Bluetooth, drive, and return to a designated zone. For Bolt for Business, the corporate workflow
              integrates Bolt's API with enterprise expense management systems (e.g., SAP Concur, Expensify), enabling
              centralised corporate booking, invoice management, and travel policy compliance. This B2B integration
              reduces friction at the enterprise procurement level, creating operational stickiness that distinguishes
              corporate from consumer accounts. The driver and courier workflow is managed through a separate Driver
              app, which handles job assignment, routing instructions, earnings dashboards, and safety features
              including the panic button and trip-sharing.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
