      - number: '5.5'
        title: Trust, Safety, Security, Privacy, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Trust and safety are operationally central to Bolt's business model: its marketplace economics depend on
              consumers and drivers trusting that the platform will facilitate safe, reliable, and fraud-free
              transactions. The primary consumer safety features include two-way post-trip ratings (driver rates
              passenger; passenger rates driver), panic button (in-app emergency contact with real-time location sharing
              to emergency services or trusted contacts), trip sharing (share live trip progress with friends or
              family), mandatory driver identity and background check at onboarding, and vehicle licence plate
              verification. Driver safety features include fare protections, in-app messaging to avoid direct phone
              number sharing, and the ability to report aggressive passenger behaviour. All background check and
              identity verification requirements are country-specific; in EU markets, Bolt complies with local transport
              licensing laws and often goes beyond minimum requirements to maintain operating licences. On data privacy,
              Bolt is subject to the EU General Data Protection Regulation (GDPR) across all 27 EU member states, as
              well as the UK GDPR post-Brexit. Bolt stores EU customer data in EU-based data centres, satisfying GDPR
              data residency requirements. Bolt's data processing operations across 200M+ customers constitute one of
              the largest GDPR-regulated datasets in European mobility; any significant breach could result in fines of
              up to 4% of global annual turnover (≈€120M+ at FY2024 revenue). Cybersecurity is managed by a dedicated
              information security team; no major disclosed breach has been reported as of May 2026. Bolt maintains
              PCI-DSS compliance for payment card processing across all markets. In micromobility, Bolt complies with
              city-specific permit and operating requirements, including geofencing zones, maximum fleet size caps,
              parking requirements, and safety certification for scooter hardware. Regulatory compliance across 50+
              countries is managed by dedicated local legal and public affairs teams, with a centralised compliance
              function overseen by Bolt's Chief Legal Officer. The NVIDIA DRIVE Hyperion AV partnership will require
              additional regulatory compliance as autonomous vehicle regulations evolve across the EU.
