  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview
        blocks:
          - type: paragraph
            body: >
              Bolt's risk profile reflects its position as a capital-intensive, multi-vertical mobility platform
              operating across 45+ regulatory jurisdictions in Europe, Africa, the Middle East, and beyond. The
              platform's rapid growth from a single-market Estonian startup to a global challenger in under a decade has
              outpaced institutional governance maturity, creating a risk stack that is unusually wide relative to a
              Series E/F-stage company. The most consequential risks cluster in the regulatory dimension—the EU Platform
              Work Directive represents a potential existential repricing event for Bolt's core gig-economy labour
              model—and in the technology dependency dimension, where near-total reliance on Google Maps API, AWS cloud
              infrastructure, and Stripe creates brittle foundations beneath an otherwise resilient consumer platform.


              The Risk Heatmap (Figure R1) positions the most severe risks by combined likelihood and severity. EU
              Platform Work Directive enforcement sits at the intersection of high likelihood and critical severity—the
              defining risk of the investment thesis. TfL licence conditions and GDPR enforcement occupy the
              medium-likelihood / high-severity quadrant. Technology dependency risks (Google Maps API cost repricing,
              AWS outage) are medium likelihood but high severity given substitution difficulty on short notice. The
              Risk Transmission Map (Figure R2) illustrates how regulatory shocks cascade into operational and financial
              outcomes via driver supply pressure, margin compression, and investor confidence erosion—showing that the
              risks are not independent but form a connected graph with the Platform Work Directive as the primary
              transmission node.


              Across the five risk categories analysed in this chapter—regulatory/legal, operational,
              partner/dependency, financial/model, and people/execution—Bolt's mitigation maturity is highest in
              operational safety (established incident-response frameworks, TfL-grade insurance requirements, ISO 27001
              certification) and lowest in regulatory/legal preparedness, reflecting the early-stage and
              jurisdictionally fragmented nature of the Platform Work Directive implementation pipeline. Residual
              exposure remains elevated across all five categories; the kill criteria and monitoring indicators in the
              Mitigations section provide a structured framework for ongoing investment governance.
