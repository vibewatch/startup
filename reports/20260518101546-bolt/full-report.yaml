            body: >-
              Bolt's 200M+ trip dataset from Eastern European and African cities — where global mapping products have
              less coverage — creates a compounding accuracy advantage in dispatch, ETA, and dynamic pricing that is
              practically difficult for newer entrants to replicate without years of operational history in the same
              markets.
