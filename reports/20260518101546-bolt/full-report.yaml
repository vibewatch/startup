      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large and Growing Markets With Bolt Leading in Under-Served Geographies
            body: >-
              Bolt operates in European and African ride-hailing and food delivery markets with combined addressable
              pools of $100–150B. In Central and Eastern Europe — where Uber has historically competed less aggressively
              — Bolt leads on price and driver supply. In sub-Saharan Africa, Bolt benefits from first-mover advantage
              with mobile-money payment integration that local competitors cannot easily replicate. These geographies
              provide revenue defensibility and upside in markets with lower capital competition than Western Europe.
            calloutType: strength
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM031
              - CM032
          - type: callout
            title: EU Platform Work Directive Could Eliminate Bolt's Commission-Rate Competitive Moat
            body: >-
              Bolt's central competitive advantage — a 15–20% driver commission versus the 30%+ industry norm — depends
              on drivers being classified as self-employed. The EU Platform Work Directive (effective 2026) creates a
              rebuttable employment presumption across EU member states. If Bolt cannot rebut this presumption,
              mandatory driver reclassification could raise labor costs by 20–30%, eliminating the commission advantage
              and requiring either price increases (reducing rider demand) or margin compression. The UK
              worker-classification ruling (under appeal) compounds this risk.
            calloutType: risk
            claimRefs:
              - CM022
              - CM023
              - CM025
          - type: callout
            title: Wide TAM Definition Range Creates SAM Uncertainty
            body: >-
              European ride-hailing TAM estimates span a 4× range ($18.4B to $64.3B) across published analyst reports
              due to inconsistent scope definitions. This range makes it impossible to precisely quantify Bolt's
              European market penetration, which varies from ~15% to ~58% depending on the TAM applied. Analysts and
              investors should apply scenario analysis across both definitions when modelling addressable revenue and
              evaluating Bolt's growth claims.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM016
