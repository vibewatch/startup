      - number: '8.2'
        title: Valuation Context and Financing
        blocks:
          - type: paragraph
            body: >
              Bolt's most recent disclosed valuation is approximately $8.4 billion, established during a $628 million
              Series F round announced in January 2022. The round was led by existing investors and brought total
              capital raised to approximately $1.9 billion. Anchor investors include Sequoia Capital's growth fund, G
              Squared, Naya Capital, and the European Investment Fund, alongside earlier backers. Bolt's founder and CEO
              Markus Villig retains a significant equity stake, which the investor community has typically interpreted
              as a signal of founder conviction but also as a governance concentration risk for institutional
              co-investors.


              As of May 2026, Bolt has not announced a new equity round. Secondary market analyst estimates place the
              implied valuation range at €7–9 billion — broadly in line with the 2022 Series F level adjusted for
              EUR/USD movements and a modest narrative discount for the absence of public financial disclosure. Sacra's
              analyst research estimates 2025 ARR at €1.1–1.3 billion on total platform GMV of approximately €7 billion,
              implying a blended take rate of approximately 18–22%. Bolt published its 2024 financial results in early
              2025 — a notable step toward transparency — but the disclosed metrics did not include audited consolidated
              P&L or balance sheet data, limiting independent verification.


              Entry discipline is central to the investment case. At an entry valuation of €7 billion, the EV/NTM
              revenue multiple is approximately 5–6× on Sacra's ARR estimate, broadly in line with the peer median.
              Above €8 billion, the multiple stretches to 6–7×, which compresses the margin of safety against the bear
              case. Dilution overhang from existing preference stacks is not publicly disclosed, representing a material
              diligence gap (see Section 6) that could affect the effective return in liquidation scenarios below €10
              billion.
            claimRefs:
              - CV001
              - CV002
              - CV003
