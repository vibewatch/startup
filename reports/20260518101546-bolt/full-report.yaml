  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and Revenue Mix
        blocks:
          - type: paragraph
            body: >-
              Bolt's revenue model is a platform take-rate business: the company charges a service fee (commission) on
              gross transaction value (GMV) processed through its platform, across multiple verticals. The primary
              revenue stream is ride-hailing, which accounted for an estimated 82% of FY2024 revenue of €1.99 billion —
              approximately €1.63 billion — derived from a 15–20% commission on each ride fare. Food delivery (Bolt
              Food) contributed approximately 18% (~€358M), through take-rates on restaurant orders estimated at 25–30%.
              Micromobility (Bolt Scooters/Bolt Bikes) generates revenue through per-minute or per-ride fees and
              municipal permit contracts; as a fraction of total revenue it is currently small but strategically
              important. Bolt Market (grocery delivery) and Bolt Drive (car-sharing subscription) contribute to a
              growing delivery and mobility subscription segment that Bolt has not broken out separately. Bolt for
              Business generates B2B fees through negotiated enterprise contracts, offering volume pricing and invoice
              billing to corporate clients. Revenue recognition follows standard digital-platform accounting: the
              company recognises only its net commission as revenue (not the full GMV), consistent with agent-model
              accounting under IFRS 15. This means Bolt's reported €1.99B in FY2024 represents the net fee income
              retained after paying driver, courier, and restaurant partners their share. The overall take rate is
              approximately 25% of GMV at the consolidated level (€3B revenue / €12B+ GMV = ~25%), consistent with
              reported metrics. Revenue mix has been shifting slightly toward delivery (food, grocery) as the platform
              diversifies, but ride-hailing dominates and is expected to remain the core revenue engine. Seasonality
              exists but is moderate: ride volumes are higher in autumn/winter (commuting demand) and summer peaks exist
              in leisure cities; food delivery is relatively stable year-round.
