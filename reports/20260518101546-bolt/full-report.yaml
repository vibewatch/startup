  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >
              Bolt's investment thesis rests on three durable pillars: structural market leadership in underpenetrated
              CEE and African mobility markets, an emergent super-app flywheel combining ride-hailing, food delivery,
              grocery, and micromobility, and a credible IPO pathway in 2026–2027 that creates a defined exit mechanism
              for private investors. Against these pillars, the anti-thesis centres on three equally concrete
              challenges: the complete absence of audited public financials (making all valuation inputs estimates), the
              EU Platform Work Directive's potential to compress margins by 25–30% in affected markets, and Uber's
              intensifying capital-backed market entry into Bolt's core CEE geographies.


              The overall recommendation is conditional positive — specifically, a watchlist or co-invest stance at an
              entry valuation at or below €7 billion. At this entry level, base-case returns of approximately 1.4× to
              2.0× over three to four years are achievable assuming a €10B IPO in 2027; bull-case upside to €18B implies
              a 2.6× return. Entry above €8B narrows the margin of safety to the bear case materially and is not
              recommended without access to audited financials that confirm the ARR, take-rate, and EBITDA profile
              underpinning the base scenario.


              The confidence level for this recommendation is moderate, reflecting Bolt's genuine scale and market
              leadership on one hand, and the structural information asymmetry arising from the absence of audited
              consolidated accounts on the other. The risk rating is medium-high, driven predominantly by the EU
              regulatory cycle and competitive pressure from Uber. The Investment KPIs figure (FV004) summarises the
              eight thesis dimensions with signal ratings. The Recommendation Logic figure (FV001) traces the decision
              chain from market position through financial trajectory to the conditional positive conclusion.
