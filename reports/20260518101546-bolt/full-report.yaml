      - number: '4.2'
        title: Cost Structure, Gross Margin, and Operating Economics
        blocks:
          - type: paragraph
            body: >-
              Bolt's cost structure is typical of a marketplace platform: the largest cost element is the
              driver/courier/restaurant partner pay-out, which is implicit in the take-rate model. Since Bolt recognises
              only its commission as revenue, COGS primarily consists of payment processing fees (estimated 1–2% of GMV
              = ~€120–240M at run-rate), driver support infrastructure, insurance contributions, and direct platform
              operating costs. Gross margins on the platform's fee income are estimated at 40–60%, driven by the
              relatively low variable cost of each incremental transaction on software infrastructure. However, this
              margin is eroded substantially at the operating level by R&D and technology investment (~€400–500M
              annually estimated), G&A and compliance (elevated due to multi-jurisdictional regulatory burden),
              marketing and driver acquisition, and legal provisions. Bolt's operating loss for FY2024 has been
              estimated at -€87.7 million by Sacra, despite positive cashflow — suggesting EBITDA-level profitability
              but a gap between EBITDA and EBIT due to depreciation on scooter hardware, capitalized software, and
              amortisation of intangibles. Capital expenditure is driven primarily by the scooter and e-bike fleet (Bolt
              operates 100,000+ units), which requires continuous replacement and expansion investment. Bolt Drive
              (car-sharing) represents a further capex-intensive sub-segment. The ride-hailing and food delivery core
              business is predominantly capital-light: software infrastructure runs on cloud (AWS/GCP), and the primary
              'asset' is the driver and consumer network. Working capital dynamics are favourable: ride payments are
              collected in advance from consumers and held briefly before payout to drivers — creating a modest positive
              float. Gross margin improvement is expected over time as fixed technology costs are spread across rising
              GMV, and as the micromobility hardware fleet matures and renewal cycles extend. The UK subsidiary's FY2024
              pre-tax profit of just £133,000 (down from £8.2M in FY2023) demonstrates that in markets with elevated
              legal exposure, operating margins can be functionally eliminated by litigation provisions.
