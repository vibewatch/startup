      - number: '4.3'
        title: Public Financial Traction and Key Performance Indicators
        blocks:
          - type: paragraph
            body: >-
              Bolt's financial traction is well-evidenced at the top-line level by a combination of official company
              communications, Sacra's independent revenue estimates, and UK regulatory filings. The most credible data
              points are the company's own disclosures: €3 billion revenue run-rate and €12 billion+ GMV run-rate as of
              December 2025, sourced directly from the Bolt investor page; and the FY2024 annual result of €1.99 billion
              revenue confirmed by Raison (citing audited Estonian registry filings) and Sacra. Revenue growth of 17%
              from FY2023 (€1.70B) to FY2024 (€1.99B) is consistent across multiple independent sources. The December
              2025 run-rate implies an accelerating growth trajectory: annualising December 2025 at €3B suggests FY2025
              revenue significantly above FY2024. At €12B+ GMV, Bolt's implied take rate of ~25% is consistent across
              all available data points. Operational KPIs — 200M+ lifetime customers, 4.5M+ driver/courier/merchant
              partners, 850+ cities, 50+ countries — are company-stated and have been consistently cited across multiple
              official and independent sources since at least early 2025. On profitability, Bolt became cashflow
              positive in 2024 — a milestone explicitly stated on the investor page. The Sacra estimate of -€87.7M
              operating loss with positive free cash flow is consistent with EBITDA-positive, EBIT-negative operations,
              likely driven by hardware depreciation and legal provisions. Revenue per employee of approximately €499K
              (€1.99B / ~4,000 employees) is healthy for a European tech company and compares favourably to sector
              peers. Notably, the company has not published full audited financial statements in English in accessible
              form; the Estonian E-Business Register is the definitive source but requires translation and registry
              access. The UK subsidiary's Companies House filing for FY2024 provides the most accessible audited data
              point, showing turnover of approximately £384M and a near-breakeven pre-tax result after legal provisions.
