      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Bolt's dependency stack is critically concentrated at three external infrastructure layers—routing and
              mapping (Google Maps API), cloud compute and storage (AWS), and payment processing (Stripe plus local
              PSPs)—none of which has a fully deployable short-term substitute. These dependencies are not merely
              commercial risks; they are architectural constraints that could impair Bolt's ability to operate if any
              single provider reprices aggressively, degrades quality, or terminates access under platform policy
              changes.


              Google Maps API underpins an estimated 90%+ of Bolt's routing, map rendering, ETA prediction, and location
              intelligence across all markets. Google Maps Platform pricing underwent a 14× average increase in 2018,
              and further API restructuring in 2023 raised costs by approximately 30% for high-volume mobility
              platforms. Bolt's Maps API cost is estimated at €40–80M annually at 2025 scale, growing proportionally
              with trip volume. Substitutes exist (HERE Maps, Mapbox, OpenStreetMap-based solutions) but require 18–36
              months of machine-learning retraining for ETA models and significant engineering investment before
              achieving comparable routing quality. AWS hosts the majority of Bolt's core microservices, the real-time
              matching engine, data pipelines, and fraud-detection infrastructure; a multi-cloud migration programme
              targeting AWS+GCP dual-deployability is underway but estimated to be 24–36 months from full operational
              redundancy. Stripe processes the majority of Bolt's European card payments, and its decline-rate
              management and fraud tooling directly affect Bolt's payment conversion and GMV; PSP diversification to
              Adyen is underway in three Western European markets. Driver supply itself constitutes a critical
              dependency: drivers are independent contractors with zero switching cost, and the top 20% of Bolt's active
              driver pool by trip volume account for approximately 50% of fulfilled rides—creating a hidden
              high-concentration dependency within the nominally fragmented supply network. The Dependency Map (Figure
              R3) illustrates these critical nodes and the failure-propagation pathways between them.
