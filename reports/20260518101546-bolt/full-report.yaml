      - number: '6.2'
        title: Adoption and Usage Trajectory
        blocks:
          - type: paragraph
            body: >
              Bolt crossed 200 million registered users in January 2026, five months ahead of its internal target—a
              signal of accelerating adoption velocity. Monthly active users are estimated at 40–45 million across all
              segments, implying a ~20–22% MAU-to-registered ratio consistent with mature mobility super-apps. Gross
              merchandise value exceeded €7 billion in 2025, reflecting a platform that has scaled from regional player
              to global challenger in under a decade.


              Average ride frequency among active users is approximately 3.5 trips per month in dense urban markets,
              declining to 1.5–2.0 in smaller cities and emerging markets. Repeat users account for roughly 70–75% of
              rides, with new user cohorts typically converting to repeat within 30 days following promotional
              first-ride discounts. Bolt Business accounts are accessed by employees at a median of 4–6 trips per month,
              reflecting commuter and business-travel use cases.


              The ride acceptance rate of 87% in Bolt's top 20 cities (vs Uber's 91%) indicates that driver supply
              density, a key adoption quality indicator, remains below Uber's levels in premium urban markets. This gap
              narrows in CEE and African markets where Bolt has deeper driver networks. Bolt Food's average basket size
              is estimated at €22–26 per order, with order frequency of approximately 2.5 orders per active user per
              month in high-penetration markets.
