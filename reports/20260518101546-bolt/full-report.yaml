      - number: '5.3'
        title: Technology Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Bolt's technology platform is a cloud-native, microservices-based system deployed on major cloud providers
              (AWS and GCP). The architecture is structured around several core domains: identity and authentication
              (single sign-on across all verticals), mapping and routing (hybrid system combining Google Maps SDK for
              rendering with proprietary routing algorithms), dispatch and matching (real-time assignment of
              drivers/couriers to orders), dynamic pricing (surge pricing, yield management), payment processing
              (multi-currency, multi-method including card, mobile money, and digital wallets), and data analytics
              (real-time trip and order data feeding ML models). The backend is primarily built on Go and Python
              microservices, with a strong emphasis on low-latency dispatch (sub-200ms matching decisions). Mobile apps
              are built natively: Kotlin for Android, Swift for iOS, with shared business logic layers for code reuse.
              The data flywheel is Bolt's most strategically significant technical asset: every completed trip adds to
              training datasets for ETA prediction, demand forecasting, dynamic pricing calibration, and driver supply
              optimisation. With 200M+ lifetime customers and 4.5M+ driver/courier partners across 850+ cities, Bolt's
              data advantage — particularly for the Eastern European and African city contexts that larger global
              platforms have less coverage on — creates a compounding improvement in service quality. Bolt's routing and
              mapping capabilities include proprietary layers for real-time traffic, scooter geofencing zones, and
              city-specific regulations (e.g., low emission zones, pickup/drop restrictions), giving it operational
              advantages over relying solely on third-party mapping APIs. The fleet operations system for micromobility
              uses IoT telemetry data to manage scooter battery levels, parking compliance, maintenance scheduling, and
              demand redistribution — all controlled through a dedicated fleet management dashboard. Autonomous vehicle
              integration is planned through the Stellantis partnership (Dec 2025) for deploying driverless vehicles on
              the Bolt platform, and the NVIDIA DRIVE Hyperion platform (Mar 2026) for AV stack scalability; both are
              early-stage with no commercial deployment timeline confirmed.
