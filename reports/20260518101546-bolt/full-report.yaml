      - number: '8.3'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              The scenario analysis uses 2027E ARR as the primary valuation anchor, with multiples calibrated to the
              public and private comparable set. In all scenarios, the path to ARR growth runs through sustained GMV
              expansion in ride-hailing (core driver), continued take-rate uplift via Bolt Business B2B volumes, and
              moderate food delivery contribution. The probability weights assigned are 20% bull, 50% base, and 30% bear
              — reflecting the genuine asymmetry between the upside (requires execution without regulatory shocks) and
              the downside (one material regulatory event is enough to compress the bear case).


              In the bull scenario, Bolt sustains its CEE and African market leadership, Bolt Business reaches 30% of
              revenue (from an estimated 20–25% today), food delivery achieves contribution margin positivity in core
              markets, and an IPO at a premium multiple of 6× ARR yields a €18 billion valuation. The required ARR of €3
              billion by 2027 implies a 35–40% compound annual growth rate from the 2025 base, which is achievable but
              demanding given the absence of financial transparency. The base scenario assumes moderate GMV growth in
              existing markets, Bolt Business maintaining approximately 25% of revenue, manageable regulatory headwinds,
              and an IPO at the peer-median multiple of 5× for an implied €10 billion valuation. The bear scenario
              assumes EU gig-worker reclassification in three or more markets (estimated 25–30% cost increase), a
              sustained Uber price war depressing GMV by 15–20%, delayed IPO or a down-round financing, and an implied
              valuation of €4.2 billion at 3.5× ARR on a reduced base of €1.2 billion. The probability-weighted expected
              value across scenarios is approximately €9.1 billion, which validates the base case as the most likely
              outcome and underscores that the bull case premium requires specific execution proof.
