          - type: callout
            title: Food Delivery GMV Represents Only 2-3% of the European TAM — Strategic Question Mark
            body: >-
              Despite operating Bolt Food since 2019, Bolt's estimated European food delivery GMV of ~€2.2B represents
              approximately 2–3% of the €83B European food delivery TAM. This either signals a large growth opportunity
              or raises a strategic question about whether Bolt can compete effectively against well-capitalised
              specialists such as Delivery Hero (Glovo) and Just Eat. Capital allocation between the high-penetration
              ride-hailing core and the nascent food delivery segment is a key strategic decision that investors should
              pressure-test in management diligence.
