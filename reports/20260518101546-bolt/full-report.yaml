      - number: '6.3'
        title: Named Customer Proof
        blocks:
          - type: paragraph
            body: >
              Bolt's named customer evidence is strongest in its B2B corporate segment. Bolt Business counts Airbus,
              Nike, PwC, KPMG, Deloitte, and numerous mid-sized European firms among its 30,000+ corporate accounts.
              These are production deployments—employees booking rides through managed corporate accounts, with
              automated invoicing and travel policy enforcement. Outcomes cited include a 20–35% reduction in business
              travel receipts and admin burden versus alternatives, based on case study materials published by Bolt.


              On the consumer B2C side, Bolt's customer proof is aggregated rather than named: 47,000+ Trustpilot
              reviews (3.9/5), app store ratings of 4.5/5 (iOS/Android composite), and a 2025 gig-worker study across
              six European markets confirming higher driver satisfaction on Bolt vs Uber. These are production
              deployments at scale—not pilots. Bolt Business G2 reviewers (4.1/5) cite cost savings as the primary
              outcome, with specific feedback that Bolt Business integrates cleanly with corporate expense systems.


              Adverse evidence in named proof: several enterprise buyers note that Bolt's global coverage (driver supply
              outside CEE and Africa) is inferior to Uber, limiting its use for international travel. Consumer reviewers
              in smaller cities flag inconsistent driver availability. These are genuine deployment limitations relevant
              to due diligence on enterprise expansion.
