  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation
        blocks:
          - type: paragraph
            body: >
              Bolt's customer universe spans four distinct buyer/payer/user archetypes across consumer, enterprise, and
              supply-side segments. The largest cohort by trip volume is urban commuters (~40% of rides), who use Bolt
              for daily point-to-point travel in cities where Bolt operates. These are primarily direct-pay consumers
              booking via the Bolt app, price-sensitive relative to Uber, and the primary target for Bolt Pass. The
              second consumer cohort—occasional and leisure riders (~30%)—uses Bolt for evenings, weekends, or event
              travel; higher churn, more promotional-credit-sensitive, and more likely to multi-home with Uber.


              Corporate and B2B users (~18% of ride-hailing revenue) are the highest-value payer segment. Over 30,000
              companies across 50+ countries use Bolt Business for centralised billing, travel policy enforcement, and
              SAP Concur/Expensify integration. The enterprise segment exhibits lower churn, higher average order value
              (€12–18 per trip), and a longer retention horizon (3–5 years) than consumer segments. Tourist and airport
              riders (~12%) are an episodic high-fare segment with limited loyalty potential.


              Geographically, Bolt is strongest in CEE (Romania, Poland, Estonia, Ukraine), sub-Saharan Africa (Nigeria
              4M+ MAU, Kenya), and the UK. It is a challenger in France and Spain (aided brand awareness <40%) and a
              minor presence across the Middle East, South America, and early-stage North America (via the Hopp brand in
              Toronto and Washington DC). Bolt Food adds a food-delivery user base of ~12 million monthly active users
              across 13 countries, with the highest density in the Baltics, Romania, and Poland. Micromobility users
              (Bolt Scooters/Bikes) are concentrated in Paris, Tallinn, and Warsaw.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
