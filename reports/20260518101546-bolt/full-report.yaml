      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              The EU Platform Work Directive (PWD), adopted in principle by the European Parliament in April 2024 and
              entering national implementation by 2026, represents the most material legal risk in Bolt's portfolio.
              Under the rebuttable presumption introduced by the PWD, gig workers on digital labour platforms are
              presumed to be employees unless the platform can demonstrate otherwise against a statutory set of control
              and dependency criteria. For Bolt, which operates approximately 2.5–3 million registered European drivers
              as independent contractors, reclassification would trigger employment costs—social insurance
              contributions, national minimum wage obligations, paid leave entitlements, and dismissal
              protections—estimated to compress platform contribution margins by 15–25 percentage points in affected
              markets. The UK Uber Supreme Court ruling of February 2021, Spain's Supreme Court ruling extending
              employee status to Glovo couriers in 2024, and multiple French social security tribunal findings have
              created a cascading jurisprudential environment that contractual architecture alone cannot neutralise.


              In the United Kingdom, TfL's conditional operating licence for Bolt requires annual safety audits,
              mandatory driver insurance verification at the point of trip acceptance, and real-time trip data sharing
              with the regulator. Failure to satisfy conditions could result in licence suspension or revocation,
              shutting Bolt out of one of Europe's highest-fare ride-hailing markets. The UK Information Commissioner's
              Office has an open formal inquiry into location data retention practices by mobility platform
              operators—Bolt is named alongside Uber—examining compliance with UK GDPR data minimisation obligations. In
              Ireland, the Data Protection Commission is reviewing cross-border EU driver data transfers, in an area
              where Dutch regulators fined Uber €290M in 2024. Nigeria's Ministry of Interior requires annual operating
              licence renewal subject to ministerial discretion; non-renewal would eliminate Bolt's single largest
              African market, representing an estimated 8% of group GMV. Romania's taxi lobby has twice successfully
              triggered legislative amendments constraining ride-hailing platform operations in 2023–2025, creating
              ongoing regulatory instability in Bolt's largest CEE market (~10% of GMV). The EU Digital Markets Act may
              impose gatekeeper obligations—data portability, interoperability, and algorithmic transparency
              requirements—on Bolt if its EU market position crosses designation thresholds; legal analysis of this
              exposure is at an early stage.
