      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Bolt is led by its founder, Markus Villig, who has served as CEO since the company's inception. Born in
              1993 on Saaremaa island, Villig dropped out of university to run Bolt full-time and is widely recognised
              as Europe's youngest founder to build a company valued at over €1 billion. His brother Martin Villig, who
              previously worked at Skype, co-founded Bolt and serves as Chairman of the Supervisory Board. Oliver
              Leisalu, the third co-founder and an engineer, joined at the outset and served as the company's technical
              lead. Jevgeni Kabanov holds the title of President, while Epp Aasaru serves as Chief Legal Officer. Bolt
              employs approximately 4,000–4,206 people globally as of FY2024. Bolt's low-commission model — charging
              drivers 15–20% compared to industry norms above 30% — has been central to its supply-side strategy and
              reflects deliberate leadership choices to prioritise driver retention over short-term revenue
              maximisation. A key-person dependency risk exists around Markus Villig, given his continued hands-on
              involvement at all operational levels. Board composition below the supervisory level is not fully
              disclosed in public sources, representing a governance transparency gap typical of private companies at
              this stage. The company's governance has also been scrutinised following revelations that Bolt maintained
              close coordination with the Estonian government on EU labour legislation, raising conflicts-of-interest
              questions.
