      - number: '1.3'
        title: Funding History, Valuation, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Bolt has raised approximately €2.22 billion ($2.40 billion) in total funding across seed, venture, and
              debt rounds since its founding in 2013. The company's most significant equity round was the Series F in
              January 2022, when it raised €628 million co-led by Sequoia Capital and Fidelity Management and Research
              Company at a valuation of €7.4 billion ($8.4 billion) — the highest valuation it has achieved. This
              followed a Series E just four months prior in August 2021, which raised €600 million at a €4 billion+
              valuation, also led by Sequoia. Earlier venture milestones include a strategic investment from DiDi
              Chuxing in 2017 and a $175 million Series C raise in May 2018. Bolt's most recent primary capital event
              was a €220 million revolving credit facility closed in May 2024, with lending banks including Barclays,
              BNP Paribas, Citi, Deutsche Bank, Goldman Sachs, JPMorgan, LHV Pank, and Luminor — indicating acceptance
              by mainstream bank creditors ahead of a potential IPO. A secondary share sale in 2025 valued the company
              at $6.82 billion (€6.3 billion), a roughly 14% decrease from the 2022 peak, consistent with broader
              late-stage valuation compression. Bolt is exploring an IPO in 2026 and has engaged PJT Partners as a
              financial adviser; the listing could take place in Europe or the US depending on market conditions. Key
              equity investors include Sequoia Capital, Fidelity Management & Research Company, D1 Capital Partners,
              Whale Rock Capital Management, G Squared, Naya Capital, Mercedes-Benz, and the International Finance
              Corporation (World Bank Group).
