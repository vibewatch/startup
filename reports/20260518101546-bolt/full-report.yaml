  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Bolt operates in a highly competitive global mobility market structured around three tiers: primary
              ride-hailing rivals, vertical food-and-delivery competitors, and micromobility specialists. The primary
              competitive axis is ride-hailing, where Uber stands as the global leader with operations in 70+ EU cities
              and roughly $40 billion in annual GMV globally. Bolt's strategic differentiator at this layer is price: by
              charging drivers 15–20% commission compared to Uber's 30%+, Bolt attracts more drivers, which generates
              lower wait times and pricing parity or advantage for riders. This supply-side strategy has proven
              particularly effective in Central and Eastern Europe — Poland, Romania, Czech Republic, Slovakia, and the
              Baltics — where Bolt has established market-leading positions. The second tier includes Yango (rebranded
              from Yandex.Taxi following Russia sanctions), which operates across 25+ European and African countries
              with aggressive pricing but faces significant geopolitical headwinds as EU regulators grow wary of
              Russian-origin platforms. InDriver, based in Kazakhstan, employs a peer-to-peer bid pricing model with no
              fixed fares, appealing to extremely price-sensitive riders in Africa and Central Asia, though it has
              limited penetration in the EU. Free Now, backed by BMW and Stellantis, has been retreating from several
              European markets after winding down in the UK and Ireland in 2024, while Cabify holds a defensive position
              in Spain, Portugal, and Latin America. In the food delivery vertical, Bolt Food competes against Delivery
              Hero/Glovo, which has significantly greater capital and stronger entrenched positions in Southern and
              Eastern Europe. The micromobility layer is contested between Bolt's scooter and e-bike fleet (100,000+
              units), Lime (Uber-affiliated, 50M+ users), and the Tier-Dott merged entity. Public transit and personal
              car ownership remain the dominant substitutes for all ride-hailing and delivery services, accounting for
              roughly 50–60% of urban trips. Bolt's super-app strategy — tying all these verticals in one app — creates
              retention and cross-sell dynamics that pure-play competitors cannot replicate.
