  - id: FV004
    title: Investment KPIs
    type: kpi
    insight: >-
      KPI scoring across eight investment dimensions: market opportunity and user traction score strong; take-rate
      trajectory and margin profile score good; product differentiation scores moderate given super-app nascency;
      regulatory risk scores elevated due to EU Platform Work Directive; financial transparency scores weak and is the
      primary constraint on confidence. Aggregate signal: conditional positive pending financial transparency
      improvement.
    data:
      items:
        - label: Market Opportunity
          note: 'Strong: €200B+ TAM, 12% CAGR through 2030, underpenetrated CEE and Africa remain primary growth vectors'
        - label: Revenue Scale
          note: >-
            Good: €7B+ GMV, €1.1–1.3B 2025E ARR (Sacra estimate); Bolt 2024 financial results released Q1 2025 confirm
            scale
        - label: User Traction
          note: >-
            Strong: 200M registered users across 45+ countries; Bolt Business growing 40%+ YoY and contributing ~20–25%
            of revenue
        - label: Take Rate and Unit Economics
          note: 'Good: 18–22% blended take rate across verticals; 15–18% EBITDA margin in mature CEE ride-hailing markets'
        - label: Competitive Position
          note: >-
            Good: #1–2 in 30+ markets; lower commission rates (15–20%) vs Uber (25–30%) drive driver loyalty in
            cost-sensitive markets
        - label: Product Differentiation
          note: >-
            Moderate: Super-app vision growing but not yet proven as a retention moat; food and grocery subscale in
            Western Europe
        - label: Regulatory Risk
          note: >-
            Elevated: EU Platform Work Directive transposing in 2026; 30% probability of critical cost increase; GDPR
            and competition inquiries active
        - label: Financial Transparency
          note: >-
            Weak: No audited consolidated financials; ARR and margin estimates based on analyst proxies; critical
            diligence gap before any capital commitment
