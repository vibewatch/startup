  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis
      - Anti-thesis
    rows:
      - - Market Position
        - >-
          Bolt holds #1–2 market share in 30+ of its 45 markets with structural advantage in lower-income cities where
          Uber is underrepresented; CEE and Africa are intrinsically less competitive and capital-intensive
        - >-
          Uber's brand and balance sheet enable subsidised market entry into any Bolt core market within 6–12 months;
          Yango (Saudi Aramco-backed) is an emerging competitor in African markets Bolt is counting on for growth
      - - Product Differentiation
        - >-
          Super-app flywheel combining ride-hailing, food delivery, grocery, and micromobility creates multi-vertical
          retention and higher lifetime value; lower commission rates (15–20% vs Uber's 25–30%) drive driver loyalty
        - >-
          Food and grocery verticals remain subscale relative to Wolt and Glovo in Western Europe; super-app is an
          aspirational narrative rather than a demonstrated retention moat at current GMV mix
      - - Financial Trajectory
        - >-
          Path to €3B ARR visible through compounding GMV growth and take-rate expansion via Bolt Business; estimated
          15–18% EBITDA margins in mature CEE ride-hailing markets validate unit economics
        - >-
          No audited P&L available; Sacra and CB Insights estimates may overstate take rates; EBITDA path to 2028
          requires flawless execution across five verticals simultaneously
      - - Regulatory Environment
        - >-
          Bolt has successfully navigated regulatory scrutiny across 45+ jurisdictions; government affairs team of 25+
          engaged across Brussels, London, and major African capitals
        - >-
          EU Platform Work Directive (transposing 2026) poses material cost risk; gig-worker reclassification in 3–4 key
          markets could increase operating cost base 25–30% and compress EBITDA to zero or negative in those markets
      - - Competition
        - >-
          InDrive, Rappi, and Yango compete in lower-value markets; Bolt's CEE and Africa moat has been sustained for 5+
          years at scale; Bolt Business insulates revenue from pure ride-hailing commoditisation
        - >-
          Uber has capital, global data scale, and brand momentum to mount sustained campaigns; GDPR and competition
          authority scrutiny constrains Bolt's data advantage
      - - Exit Pathway
        - >-
          Euronext Paris or LSE IPO in 2026–2027 is credible given PJT Partners banker engagement and FT/Reuters
          reporting; Wolt and Glovo M&A precedents show strategic acquisition also viable at €7B+
        - >-
          IPO window is rate-sensitive and requires two years of audited financials that Bolt has not yet published;
          acquisition interest may not materialise above €8B given founder control structure
