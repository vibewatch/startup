companyProfile:
  summary: >-
    Bolt Technology OÜ is an Estonian mobility super-app founded in 2013 by Markus Villig in Tallinn. It operates
    ride-hailing (82% of revenue), food and grocery delivery, micromobility (e-scooters/bikes), car-sharing, and B2B
    travel management across 50+ countries and 850+ cities. With a €3B revenue run-rate and €12B+ GMV run-rate as of
    December 2025, Bolt is Europe's largest ride-hailing challenger to Uber and the market leader in Central and Eastern
    Europe. The company became cashflow positive in 2024 and is exploring a public listing in 2026, though the IPO
    timeline is complicated by a UK worker-classification ruling creating £200M+ in potential back-pay liability and the
    EU Platform Work Directive potentially restructuring its driver economics.
