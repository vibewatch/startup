  - id: FV001
    title: Recommendation logic
    type: flow
    insight: >-
      The recommendation logic chains from Bolt's demonstrated scale and market position through the product
      differentiation and financial trajectory evidence to the conditional positive conclusion. The key branching point
      is entry valuation: above €8B the risk-reward deteriorates materially. The EU Platform Work Directive and Uber
      competitive risk are the two primary negative modifiers that cap the recommendation from outright positive to
      conditional positive.
    data:
      nodes:
        - label: 'Scale and Market Position: #1–2 in 30+ of 45 markets, 200M users, €7B+ GMV'
        - label: 'Product Differentiation: Super-app nascent but growing; lower commissions drive driver loyalty'
        - label: 'Financial Trajectory: €1.1–1.3B 2025E ARR; no audited P&L; EBITDA positive in mature CEE'
        - label: 'Regulatory Risk: EU Platform Work Directive — 30% probability of critical cost increase'
        - label: 'Competitive Risk: Uber CEE aggression — 25% probability of material market share loss'
        - label: 'Exit Pathway: IPO 2026–2027 credible; M&A also viable (Wolt/Glovo precedents at €2.3–7B)'
        - label: 'Entry Discipline: ≤€7B = conditional positive; >€8B = caution; margin of safety narrows'
        - label: Conditional Positive Recommendation (Watchlist / Co-Invest at ≤€7B)
    claimRefs:
      - CV030
      - CV021
      - CV005
      - CV029
      - CV023
      - CV035
