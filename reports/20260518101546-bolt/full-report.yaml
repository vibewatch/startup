      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Runway
        blocks:
          - type: paragraph
            body: >-
              Bolt's capital structure reflects a private company that has completed its primary growth-equity
              fundraising phase and is now managing through a combination of retained cash flows, a revolving credit
              facility, and IPO option value. Total equity raised of approximately €2.22 billion across multiple rounds
              from 2013 to 2022 provides the foundation; the most recent primary equity event was the January 2022
              Series F at €628 million. No new primary equity round has been announced since then — a notable 4-year gap
              that reflects Bolt's transition to cashflow self-sufficiency. The most recent primary capital event was
              the €220 million revolving credit facility closed in May 2024, provided by a syndicate of eight major
              banks: Barclays, BNP Paribas, Citi, Deutsche Bank, Goldman Sachs, JPMorgan, LHV Pank, and Luminor. The
              participation of Goldman Sachs, JPMorgan, and Citi — all of whom could advise on an eventual IPO — is
              strategically significant and signals institutional confidence in Bolt's credit quality. Cashflow
              positivity since 2024 means Bolt is no longer burning through reserves at the pace of its 2020–2022
              expansion phase. However, the exact cash balance and runway are not publicly disclosed. The revolving
              credit facility provides a liquidity buffer for working capital needs and could be drawn upon to fund
              legal liabilities (UK worker case) or strategic investments (scooter fleet, new market entry). Material
              financial risks include: (1) the UK worker-classification case, with a Q2 2026 remedy hearing that could
              crystallise £200M+ in obligations; (2) EU Platform Work Directive transposition costs that could require
              significant working capital for employment benefit obligations; (3) any capital intensity increase from
              the Stellantis/NVIDIA AV partnerships that could require equity or debt financing; and (4) IPO
              underpricing or delay risk. The 2025 secondary share sale at $6.82 billion and the €220M revolving credit
              suggest Bolt is in a stable but not over-capitalised financial position. An IPO at 2–3x revenue ($6–9B)
              would provide significant fresh capital to fund the next growth phase and de-risk the balance sheet. The
              company's financial verdict is one of a maturing platform that has demonstrated top-line scale and
              cashflow management, but faces opacity and elevated off-balance-sheet risks in the form of the UK legal
              liability.
