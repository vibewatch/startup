      - number: '6.4'
        title: Retention and Satisfaction
        blocks:
          - type: paragraph
            body: >
              No publicly disclosed NRR, GRR, or cohort retention series exists for Bolt. Proxy evidence must be
              assembled from indirect indicators. Bolt Pass, the €9.99/month subscription launched mid-2025, had reached
              1.2 million subscribers within three months—a proxy for high-frequency rider lock-in. Subscribers exhibit
              ~30–40% higher trip frequency than non-subscribers, suggesting the programme is successfully targeting the
              most retention-sensitive cohort. European mobility platform benchmarks indicate subscriptions reduce
              monthly churn by 30–45%.


              Driver retention (supply-side) is improved in 12 markets through Bolt's earnings guarantee programme:
              top-rated drivers in those markets churn at ~22% lower rates than in markets without the guarantee. High
              driver retention directly improves rider satisfaction (shorter wait times, higher acceptance rates),
              creating a supply-demand retention flywheel. Ride cancellation rate of 6.2% remains above best-in-class
              (4–5%), suggesting driver-side service reliability is an ongoing focus area.


              Trustpilot (3.9/5 from 47,000+ reviews) and app store ratings (4.5/5) are strong consumer satisfaction
              proxies. Glassdoor driver reviews score 3.8–4.0, with drivers citing flexible hours and lower commissions
              as positives, inconsistent support as a negative. Bolt has not faced a major GDPR fine (contrast: Uber's
              €290M Dutch fine in 2024), supporting enterprise trust. The primary retention diligence ask is cohort
              data: what % of new users from a given vintage are still active 6, 12, and 24 months later?
            claimRefs:
