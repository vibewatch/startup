      - number: '2.4'
        title: Bolt Market Position and Addressability
        blocks:
          - type: paragraph
            body: >-
              Bolt's market position is characterised by low-cost leadership, geographic breadth, and a multi-product
              super-app that provides cross-segment bundling advantages, offset by capital constraints relative to Uber
              and limited brand recognition in Western European premium segments. In Central and Eastern Europe —
              Romania, Estonia, Lithuania, Latvia, Poland, Hungary — Bolt is the market leader or co-leader,
              outcompeting Uber on driver supply depth and price. In Western Europe, Bolt is a strong #2 behind Uber;
              Free Now (BMW/Stellantis) has wound down in several markets, reducing the three-way competition to a
              duopoly in most cities. In sub-Saharan Africa, Bolt leads or co-leads in South Africa, Nigeria, Kenya,
              Tanzania, and Ghana, leveraging its 2016 first-mover advantage and mobile-money payment integration. In
              food delivery, Bolt Food holds a material Eastern European position against Delivery Hero/Glovo and Just
              Eat, but has negligible Western European presence. Addressability assessment: at the narrow European
              ride-hailing TAM of ~€17B, Bolt's ~€9.8B ride-hailing GMV implies ~58% penetration — high, but suggesting
              the segment is approaching saturation in its strongest markets. At the broad €64B TAM, penetration is
              ~15%, implying substantial headroom in adjacent segments such as taxis, corporate fleets, and inter-city
              rides. Food delivery penetration of ~€2.2B GMV against an €83B European food delivery TAM represents
              ~2.7%, indicating significant growth potential but also questions about Bolt Food's competitive viability
              against better-capitalised specialists. Africa ride-hailing penetration at an estimated €0.3B GMV against
              a $2.64B TAM represents approximately 11–13%, higher than expected given Africa's smaller per-trip
              economics — suggesting Bolt is extracting relatively strong share in its African footprint. Buyer segments
              vary significantly: urban consumers prioritise price and wait time; corporate clients value duty-of-care
              and expense management integration; tourists need reliability and language support; African urban riders
              require mobile-money payment options and cash acceptance in certain markets.
            claimRefs:
