  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Bolt Technology OÜ — commonly known as Bolt — is an Estonian multinational mobility company headquartered
              at Vana-Lõuna tn 15, Tallinn, Estonia. Founded in August 2013 by Markus Villig (then 19 years old), the
              company started as mTakso and later rebranded as Taxify before adopting the Bolt name in March 2019. The
              rebranding signalled the company's strategic evolution beyond taxi-hailing into a multi-modal urban
              mobility super-app. Bolt now operates ride-hailing (its core service), e-scooter and e-bike rentals,
              car-sharing (Bolt Drive), food delivery (Bolt Food), grocery delivery (Bolt Market), and corporate travel
              management (Bolt for Business). As of May 2026, Bolt operates in more than 50 countries and 850 cities,
              serves 200M+ lifetime customers, and supports 4.5M+ driver, courier, and merchant partners. The company's
              revenue run-rate reached €3 billion in December 2025, with a GMV run-rate exceeding €12 billion. Bolt
              describes its mission as 'making cities for people, not cars', pursuing the reduction of private vehicle
              use through affordable, sustainable shared mobility options. The company has been cashflow positive since
              2024 and reported €1.99 billion in revenue for FY2024. Bolt is a private company and its primary legal
              entity is registered in Estonia under the E-Business Register. It employs over 4,000 people globally with
              operational hubs in Tallinn, Berlin, Warsaw, Bucharest, Lisbon, and London.
