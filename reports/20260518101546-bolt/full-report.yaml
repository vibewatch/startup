      - number: '7.6'
        title: Mitigations and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Bolt's primary risk mitigation architecture spans four pillars: regulatory engagement and compliance
              investment, technology dependency diversification, financial risk management, and governance maturation.
              On the regulatory front, Bolt deploys a 25-person government affairs and legal team across Brussels,
              London, Tallinn, Lagos, and Nairobi, providing active engagement with legislators and regulators in its
              most material jurisdictions. Bolt has submitted detailed technical consultations to the EU Platform Work
              Directive working groups arguing for a platform-economy carve-out grounded in algorithmic management
              distinctions; the outcome of this engagement remains uncertain but the sophistication of the submission is
              above industry average. On technology dependencies, Bolt has an active multi-cloud migration programme
              targeting dual AWS/GCP deployability by late 2026 for 60% of core services, and is co-investing in
              OpenStreetMap-based routing capabilities alongside HERE Maps API integration to reduce Google Maps
              concentration from 90%+ to a target 60% by end-2027. Payment stack diversification includes PSP onboarding
              in eight new markets in 2025, reducing Stripe's share of European card volume from approximately 70% to a
              target of 50% by end-2026.


              Financial risk mitigations include a partial FX hedging programme covering approximately 40% of NGN/EUR
              and KES/EUR exposures (target 60% by Q4 2026), a capital-light micromobility partnership model for new
              market entries from 2025 onward, and a profitability programme targeting group EBITDA breakeven by 2027.
              Governance mitigations include a Board succession planning process initiated post-2024 Series E, a Chief
              Risk Officer function established in 2025 reporting directly to the CEO, and a 12-month engineering
              leadership succession depth programme.


              Kill criteria—conditions requiring full investment thesis reassessment—are defined as: (1) EU Platform
              Work Directive enacted with binding employee reclassification legislation in Bolt's top five EU markets
              simultaneously; (2) TfL licence suspended or revoked in London; (3) Bolt GMV year-on-year growth falls
              below 15% for two consecutive reported quarters; and (4) a major cybersecurity breach results in a GDPR
              enforcement fine exceeding €100M. Monitoring indicators reviewed at board level include weekly driver
              active hours in the top 10 markets, monthly GMV growth rate versus prior year, regulatory docket activity
              in the EU and UK, and quarterly platform uptime SLA performance. These indicators provide early warning of
              deterioration before kill criteria are triggered.
