      - number: '8.4'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: >
              The comparable set for Bolt spans three categories: public ride-hailing platforms (Uber, Lyft), public
              super-app platforms (Grab Holdings), and private or acquired mobility/delivery businesses (InDrive, Rappi,
              Yango, Deliveroo, the Wolt/DoorDash transaction, and the Glovo/Delivery Hero transaction). Uber is the
              most directly comparable at scale, trading at approximately 5–7× NTM revenue with a roughly $100 billion
              market cap as of mid-2026; its proven profitability and global brand set a ceiling for what Bolt's
              multiple could reach at IPO. Grab Holdings, trading at approximately 8× NTM revenue, provides the best
              structural analog as a multi-vertical super-app in a developing market, though its Southeast Asian market
              and fintech penetration distinguish it from Bolt's CEE/Africa footprint.


              The two most relevant M&A precedent transactions are DoorDash's acquisition of Wolt for €7 billion in 2022
              (approximately 7× Wolt's revenue at the time) and Delivery Hero's acquisition of Glovo for €2.3 billion
              (approximately 4× revenue). Both transactions occurred in the high-multiple environment of 2021–2022 and
              should be interpreted as upper-bound precedents rather than expectations in a more normalised 2026–2027
              market. Lyft's current multiple of approximately 1.5× NTM revenue reflects US market saturation and
              declining market share, and is most useful as a downside reference rather than a central estimate. Among
              private comparables, InDrive's last known valuation of approximately $1.2 billion (2023 Series B), Rappi's
              $5.25 billion (2021 Series F), and Yango's approximately $800 million are all substantially below Bolt's
              implied valuation and reflect smaller scale, single-region focus, or earlier stage. On a blended basis,
              applying a 5× NTM revenue multiple to Bolt's estimated 2027E ARR of €2 billion yields the base case
              valuation of €10 billion.
