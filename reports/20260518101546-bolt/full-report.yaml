      - number: '3.3'
        title: Capability, Pricing, and GTM Comparison
        blocks:
          - type: paragraph
            body: >-
              A comparative analysis of Bolt and its primary competitors across ride-hailing, food delivery,
              micromobility, car-sharing, B2B, and autonomous vehicle capabilities reveals Bolt's strongest competitive
              position is the breadth of its super-app offering combined with its driver-economics advantage. On pricing
              for consumers, Bolt consistently prices 5–15% below Uber in shared markets such as Warsaw, Bucharest, and
              Tallinn, with shorter wait times attributed to its larger relative driver pool in those cities. Uber's
              premium UberX and Comfort products command price premiums, with Bolt's equivalent products more
              competitively priced. On driver commissions, Bolt's 15–20% take rate compares favourably to Uber's
              reported 25–30%+ effective take rate globally. InDriver's 5–10% nominal rate appears lower, but its
              unpredictable pricing model and lack of surge pricing mean effective driver earnings are less stable.
              Yango charges comparable commissions to Bolt in overlapping markets but its EU license risks could
              constrain supply. On feature breadth, Bolt is the only European-originated platform to offer ride-hailing,
              food delivery, grocery, micromobility, car-sharing, and B2B corporate travel in a single app. Uber matches
              this scope globally but does not operate grocery delivery natively in most EU markets and lacks
              car-sharing in Europe beyond limited pilots. Delivery Hero/Glovo focuses purely on delivery and has no
              ride-hailing. Free Now provides an aggregator (taxi + ride-hailing) but has no food or micromobility
              offering in its current form. On distribution power, Uber's brand recognition in Western Europe, its
              partnership with Google Maps (Uber appears natively in Maps search results), and its Uber Eats
              cross-marketing represent genuine GTM advantages that Bolt does not fully match. Bolt's GTM in new markets
              relies heavily on driver-economics storytelling and price competition, which is effective but slower to
              build organic brand awareness. On regulatory posture, both Bolt and Uber face worker-classification risks
              across Europe, but Bolt's smaller pre-2024 market share in the UK and reliance on Estonian legal entity
              structures creates incremental complexity. Yango faces acute licensing risk as EU regulators scrutinise
              its Russian-origin corporate structure.
