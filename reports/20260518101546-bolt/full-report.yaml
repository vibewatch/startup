  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              Bolt operates at the intersection of three distinct markets: on-demand ground transport (ride-hailing),
              on-demand food and grocery delivery, and micro-mobility (e-scooters and e-bikes). Ride-hailing — the
              founding and largest segment — encompasses B2C passenger trips booked via the Bolt app, with private hire
              vehicles and licensed taxis as the supply-side. Excluded from this definition are bus and rail transit,
              car rental, and corporate fleet leasing, though Bolt for Business (B2B ride management) sits adjacent to
              the core consumer service. Food delivery (Bolt Food) covers restaurant-to-consumer last-mile delivery;
              grocery delivery (Bolt Market) covers on-demand dark-store fulfilment. Both are included in the 'food and
              grocery delivery' segment for TAM purposes. Micromobility — e-scooters and e-bikes — are reported within
              the ride-hailing revenue line and are not separately disclosed. Geographically, Bolt's primary market is
              Europe: 50+ countries spanning Western, Central, and Eastern Europe, plus the UK. Sub-Saharan Africa is an
              active secondary market with operations in South Africa, Nigeria, Kenya, Tanzania, Ghana, and others since
              2016. A nascent Middle East cluster and a North American pilot (Hopp brand, Toronto and Washington DC,
              2025) are pre-material in GMV terms as of May 2026. Status-quo substitutes differ by segment: private car
              ownership, taxis hailed on-street, and public transit for ride-hailing; supermarket in-store shopping for
              grocery delivery; cycling and walking for micromobility. Each substitute has meaningful incumbency, and
              switching costs are moderate — primarily habitual rather than contractual.
