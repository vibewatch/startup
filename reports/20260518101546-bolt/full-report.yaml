      - number: '3.4'
        title: Moats, Switching Costs, and Lock-In
        blocks:
          - type: paragraph
            body: >-
              Bolt's competitive moats operate at multiple layers, each with a different durability rating. The
              supply-side network effect is Bolt's strongest moat: the 4.5 million+ driver and courier partners create
              genuine liquidity in served cities, and this liquidity directly improves wait times and pricing
              reliability for consumers. In markets where Bolt has critical supply mass (Warsaw, Tallinn, Riga,
              Bucharest, Nairobi, Lagos), a new entrant would need to absorb significant losses to achieve equivalent
              driver liquidity. However, multi-homing by drivers is extremely common — research suggests 60–80% of gig
              economy drivers in Europe use two or more platforms simultaneously — which limits the exclusivity of this
              moat. On the consumer side, switching costs are low: the Bolt app is free to download, rides can be
              compared across platforms in seconds via aggregators, and there is no subscription lock-in for most
              ride-hailing consumers. Bolt's loyalty programme for consumers is underdeveloped compared to Uber's Uber
              One membership ($9.99/month in the US, with free Uber Eats deliveries and 5–10% discounts), which creates
              meaningful consumer lock-in that Bolt lacks. However, Bolt's lower prices in key markets effectively
              function as an economic lock-in — consumers who prioritise cost over brand will default to Bolt when it is
              available. For corporate clients (Bolt for Business, 50,000+ companies), switching costs are materially
              higher: enterprise accounts require procurement workflows, invoice and expense system integrations, and
              travel policy approvals. These B2B relationships drive higher retention rates and lower price sensitivity
              than the consumer segment. Bolt's data flywheel — 200M+ consumer trips generating dynamic pricing, ETA,
              and demand models — creates incremental operational advantages that are difficult to replicate from
              scratch but not insurmountable for well-capitalised rivals. On supply-chain lock-in for hardware
              (scooters, e-bikes), Bolt sources primarily from Chinese OEM manufacturers; switching to alternatives
              would be feasible within 6–12 months and does not constitute a structural moat. The multi-modal super-app
              itself represents a distribution moat — once a user has linked payment, set preferences, and used multiple
              services, the app becomes a habitual entry point for urban mobility broadly, reducing the likelihood of
              installing and habitually using a competing app. This bundling advantage is real but requires continuous
              product investment to maintain.
