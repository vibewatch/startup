      - number: '2.3'
        title: Demand Drivers, Constraints, and Structural Risks
        blocks:
          - type: paragraph
            body: >-
              Ride-hailing demand in Bolt's core markets is supported by durable structural drivers: (1) Urbanisation —
              Europe's urban population exceeded 75% of total in 2024 and continues rising, expanding the density
              prerequisite for viable on-demand mobility; (2) Smartphone and 4G/5G penetration exceeds 95% across EU
              core markets, eliminating the technology access barrier for first-time users; (3) EU Green Deal policies
              and expanding low-emission zones (LEZ) in Amsterdam, Brussels, London, Madrid, and 70+ other European
              cities constrain private-car use, accelerating modal shift to shared transport; (4) Post-pandemic European
              tourism reached 112% of 2019 levels in 2024, generating incremental ride demand in tourist corridors; (5)
              Bolt's 15–20% driver commission versus the 30%+ industry norm creates structural supply abundance and
              driver loyalty that enables consistent wait times and surge-price containment. Against these drivers,
              material constraints and risks operate simultaneously: (1) EU Platform Work Directive (Directive
              2024/2831, effective 2026) establishes a rebuttable employment presumption for platform workers,
              potentially raising driver costs 20–30%; (2) UK worker-classification litigation from November 2024
              creates a £200M+ back-pay liability under appeal through Q2 2026; (3) Multi-homing by approximately 56% of
              EU Bolt drivers limits supply exclusivity; (4) A driver gender gap (fewer than 5% women) limits
              penetration in female-preference segments and makes compliance with emerging EU gender-equity mandates
              harder; (5) Africa-specific constraints include currency depreciation (NGN, KES), lower per-trip economics
              ($2–5 versus €10+ in Europe), and regulatory unpredictability. Africa's positive demand asymmetries —
              mobile money ubiquity (62% of transactions), young demographics, and severely underdeveloped public
              transit — partially offset these structural constraints.
            claimRefs:
