      - number: '3.2'
        title: Key Competitor Profiles
        blocks:
          - type: paragraph
            body: >-
              Uber Technologies Inc. (NYSE: UBER) is the single most significant competitive threat to Bolt. As of 2025,
              Uber reported $43.98 billion in annual revenue globally, with a gross margin of approximately 37%. In
              Europe, Uber operates in 70+ cities including London, Paris, Berlin, Madrid, Warsaw, and Prague. Uber's
              European operations are under a comparable regulatory burden to Bolt's: in the UK, Uber settled a
              worker-classification case for $100 million and reclassified its UK drivers as 'workers' with minimum wage
              and holiday pay entitlements — a precedent that directly affects the Bolt UK litigation. Uber's strategic
              advantage includes its global brand recognition, superior AV investment pipeline (Waymo collaboration,
              Aurora, Motional partnerships), and cash-generating scale. However, Uber's 30%+ take rate creates a
              structural opening for Bolt on driver economics. Yango (Yandex N.V./Driverless), formerly Yandex.Taxi,
              rebranded in 2023 to distance itself from Russian state associations following sanctions. It operates in
              25+ European and African markets including multiple Eastern European countries. Its pricing is comparable
              to Bolt, but the geopolitical risk of its Russian-origin structure has led several EU municipalities to
              review its operating licenses. InDriver (iLogic, Inc.) operates a unique bidding model in which riders
              propose a price and nearby drivers can accept, decline, or counter-offer — effectively a C2C auction for
              mobility. Founded in 2012 in Yakutsk, Russia (later redomiciled to the US), InDriver reached 700+ cities
              globally as of 2024 with estimated $1.2 billion GMV, and raised $150 million in Series B funding from
              General Atlantic in 2021. Its 5–10% commission model undercuts even Bolt, but its brand investment in EU
              markets has been limited. Cabify operates across Spain, Portugal, and Latin America with premium product
              positioning and approximately €500 million in annual revenue; its EU footprint overlaps with Bolt only in
              Spain and Portugal. Free Now, jointly owned by BMW and Stellantis following Stellantis's acquisition of
              BMW's stake, has been contracting: it wound down UK and Ireland operations in 2024 and is focusing on
              France, Germany, Spain, and Italy via an aggregator model that also connects riders to taxis. Delivery
              Hero AG (Glovo) is Bolt's primary food delivery competitor in Eastern Europe and Spain, with €6.7 billion
              in FY2024 revenue — more than three times Bolt Food's estimated size. Just Eat Takeaway (formerly
              Takeaway.com) competes in the UK and Netherlands but sold Grubhub in 2024 and is struggling in Eastern
              Europe where Bolt Food has stronger positioning. In micromobility, Lime (10% owned by Uber) operates in
              30+ countries with 50M+ users and turned profitable in 2023, while the merged Tier-Dott entity operates 25
              EU cities with approximately €300 million in revenue.
