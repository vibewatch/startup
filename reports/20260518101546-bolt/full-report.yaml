      - number: '2.2'
        title: Market Sizing and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              The global ride-hailing and taxi market in 2026 is estimated at $179.1B (Business Research Company, 5.8%
              CAGR) to $216.9B (Statista, broader definition). European estimates diverge sharply: 6WResearch places
              European ride-hailing at $18.4B using a narrow platform-only scope; Verified Market Research corroborates
              this at approximately $17.5B; Market Data Forecast reaches $64.3B on a broad shared-mobility definition
              that includes taxis and logistics. A defensible midpoint for European on-demand passenger transport is
              $28–40B. European food delivery is estimated at $83.1B in 2026 (Mordor Intelligence, 7.0% CAGR), with
              Statista's broader e-commerce delivery definition reaching $131.6B; the relevant segment for Bolt Food is
              the restaurant-delivery sub-market, estimated at $35–45B of the Mordor total. Africa ride-hailing is a
              smaller but growing segment at $2.64B in 2026 (Mordor Intelligence, 4.25% CAGR). Bolt's total GMV run-rate
              of €12B+ as of December 2025 spans all markets and products. Using the Sacra-estimated revenue mix (82%
              ride-hailing, 18% delivery), Bolt's ride-hailing GMV is approximately €9.8B and food delivery GMV
              approximately €2.2B. Set against the European narrow TAM of ~€17B, Bolt's ride-hailing penetration
              approaches ~58%; against the broad €64B TAM, penetration falls to ~15%. The 2030 forward market at
              historical CAGR would reach approximately $250–290B globally, providing a large growth pool if Bolt can
              hold or grow its share amid regulatory and competitive headwinds. Contradictory estimates are preserved as
              evidence gaps (see GM001) because the definitional inconsistency is itself a material diligence finding.
