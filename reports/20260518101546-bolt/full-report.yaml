      - number: '5.2'
        title: Product Module and Asset Map
        blocks:
          - type: paragraph
            body: >-
              Bolt's product portfolio comprises six distinct consumer-facing service modules, two operator-side
              applications, and a B2B integration layer — all orchestrated by a shared platform infrastructure. The
              primary modules are: Bolt Rides (ride-hailing, core product), Bolt Food (restaurant delivery), Bolt Market
              (grocery delivery via dark stores), Bolt Scooters and Bolt Bikes (micromobility rental), Bolt Drive
              (car-sharing subscription), and Bolt for Business (corporate travel management). Each module has its own
              product team, but all share the same consumer identity layer (single login, shared payment wallet, unified
              rating history), the same mapping and routing engine (Bolt has developed substantial in-house routing
              capabilities, though Google Maps SDK is used for some map rendering), and the same dynamic pricing
              infrastructure. Physical assets include the micromobility fleet of 100,000+ electric scooters and e-bikes
              deployed across 30 EU cities. Each scooter is equipped with proprietary IoT hardware (cellular module,
              GPS, accelerometer, tamper detection) that enables remote locking/unlocking, geofencing enforcement for
              parking compliance, battery monitoring, and real-time telemetry. The IoT firmware is managed by Bolt's
              hardware engineering team; scooter units are manufactured by third-party OEMs (primarily Chinese
              suppliers), but the IoT module is Bolt-specified. Bolt Drive maintains a smaller fleet of shared cars in
              select cities, managed through third-party fleet management systems. The two operator-facing applications
              are the Bolt Driver App (iOS and Android for ride-hailing/delivery drivers) and the Bolt Courier App
              (Android-optimised for food/grocery couriers). The Bolt for Business API represents the B2B integration
              layer — a RESTful API documented at developer.bolt.eu that allows enterprise systems to create, manage,
              and invoice rides on behalf of employees without requiring individual consumer accounts.
            claimRefs:
