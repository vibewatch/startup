      Bolt's platform rests on three critical external infrastructure nodes—Google Maps API, AWS cloud, and Stripe—none
      of which has a deployable substitute within 12 months. The driver gig network is a supply-critical dependency
      governed by regulatory conditions outside Bolt's control. Apple and Google app stores represent a distribution
      chokepoint with no alternative channel. Food delivery adds restaurant partner dependency as a secondary but
      high-GMV supply chain. The convergence of all dependencies onto a single Bolt Platform node illustrates the
      systemic risk of multi-point simultaneous failure.
