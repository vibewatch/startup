      - number: '6.5'
        title: Expansion and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              Bolt's primary expansion mechanism is geographic market entry and vertical cross-sell. Cross-sell within
              the super-app (riders → food → scooters → car-sharing) is a key CLV expansion lever: Bolt Pass
              incentivises multi-vertical engagement through combined ride and delivery discounts. Enterprise
              land-and-expand follows a similar pattern: initial Bolt Business rides adoption, then expansion to food
              delivery catering and scooter fleet allowances for urban-commute employees.


              Geographic concentration risk is the primary adverse finding in the customer chapter. Bolt's top five
              markets—Romania, Poland, Nigeria, Estonia, and Kenya—account for an estimated 55% of GMV. Romania and
              Poland alone represent approximately 20% of GMV. This concentration creates material downside risk if
              regulatory, competitive, or macroeconomic shocks affect any single dominant market. Romania's regulatory
              environment has been volatile (multiple taxi-lobby legislative challenges to ride-hailing rules).
              Nigeria's currency (NGN) has depreciated significantly, compressing USD-equivalent GMV.


              There is no publicly disclosed top-customer revenue concentration risk at the enterprise level (Bolt does
              not name individual corporate accounts' revenue contribution). The risk of over-dependence on any single
              B2B client is assessed as low, given 30,000+ accounts and the granular, transactional nature of
              ride-hailing spend. Procurement friction for new enterprise accounts is moderate: IT integration (SSO,
              expense API), legal procurement review, and finance controller approval are standard hurdles but typically
              addressable within 2–6 weeks.
