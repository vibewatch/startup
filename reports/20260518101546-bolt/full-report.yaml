      The bar chart illustrates valuation sensitivity across methodologies. The base case (5× ARR on €2.0B 2027E ARR)
      yields €10B — consistent with the public peer median. The bull case (6× ARR) reaches €18B. The bear case (3.5× ARR
      on €1.2B) yields €4.2B. The Uber public comp at 5–7× NTM revenue on Sacra's €1.3B 2025E ARR implies €6.5–9.1B
      today. The Wolt M&A precedent multiple (7× revenue) applied to current ARR implies €9.1B.
