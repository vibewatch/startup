            title: Super-App as Structural Product Moat
            body: >-
              Bolt is the only European-originated platform to have commercially deployed all six mobility and delivery
              verticals under one consumer identity. This bundling creates data cross-pollination, reduces per-user CAC,
              and builds habitual app usage patterns that competitors cannot replicate without equivalent multi-vertical
              investment.
