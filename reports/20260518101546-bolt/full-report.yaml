      - number: '7.3'
        title: Operational Risk
        blocks:
          - type: paragraph
            body: >
              Bolt's operational risk profile spans five dimensions: platform reliability, safety incident exposure,
              driver supply concentration, payment integrity, and cybersecurity. Platform uptime is a critical
              service-level obligation given Bolt's 45-country footprint and the real-time matching nature of
              ride-hailing; a 99.5% uptime SLA implies approximately 44 hours of potential downtime per year, which at
              €7B+ GMV translates to potential lost-booking exposure of over €35M annually if outages are unevenly
              distributed across peak demand windows. Bolt's primary infrastructure dependency on AWS (addressed further
              in the Partner/Dependency section) means that a regional AWS service event—such as the EU-WEST-1
              disruption in December 2021 that affected multiple European platforms—could trigger cascading service
              disruption across all European markets simultaneously.


              Safety incidents represent both an operational liability and a reputational and regulatory risk vector.
              Bolt's disclosed 2025 safety statistics show a serious incident rate of 0.6 per 100,000 trips across all
              markets, broadly comparable to Uber's disclosed rate of 0.59 per 100,000. While at industry benchmark
              levels, any high-profile incident in a major market—particularly London where TfL tracks Bolt's safety
              performance quarterly—carries outsized regulatory amplification risk. Payment fraud and chargeback
              exposure is estimated at 0.8–1.2% of GMV annually, equating to approximately €56–84M at 2025 GMV levels;
              Bolt's fraud detection stack relies heavily on Stripe's tooling, creating a single vendor dependency in
              payment security. Cybersecurity risk is elevated by the extreme sensitivity of location data: Bolt stores
              billions of precise origin-destination trip routes which, if exfiltrated, could enable stalking, targeted
              crime, or state-level surveillance operations—triggering both material GDPR enforcement liability and
              irreversible consumer trust damage. Bolt Food's supply chain adds further operational fragility:
              approximately 35,000 restaurant partners across 13 countries mean that partner attrition in high-GMV
              cities directly degrades order availability and customer experience metrics.
            claimRefs:
