    insight: >-
      The EU Platform Work Directive is the primary risk transmission node: reclassification triggers employment cost
      increases, which simultaneously compress margins and reduce driver recruitment, impairing supply density and
      ultimately depressing GMV. A parallel cybersecurity breach pathway propagates through GDPR fines and user trust
      erosion to demand reduction. Both chains converge on investor confidence decline and capital-raise difficulty,
      creating compounding downside scenarios if multiple risks activate concurrently.
