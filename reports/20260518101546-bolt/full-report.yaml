      - number: '8.5'
        title: Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Thesis-break triggers are the specific events or thresholds that would cause a prudent investor to
              reassess or exit the Bolt position, regardless of prior investment in the thesis. They are distinct from
              risks (which are known uncertainties) in that they represent crystallised outcomes that fundamentally
              alter the return distribution. For Bolt, five triggers have been identified: EU gig-worker
              reclassification in three or more markets (critical severity), Uber subsidised pricing in ten or more of
              Bolt's core CEE and African cities (high severity), a GDPR or competition authority fine exceeding €100
              million (high severity), an IPO priced below €6 billion (high severity), and a material founder or key
              management departure (medium severity).


              The most consequential trigger is gig-worker reclassification. The EU Platform Work Directive, which
              entered national transposition in 2026, introduces a rebuttable presumption of employee status for
              platform workers. EY analysis suggests full reclassification could increase Bolt's EU operating costs by
              25–30% in affected markets; if triggered in Bolt's top three to five EU revenue markets simultaneously,
              EBITDA in those markets could turn negative within twelve to eighteen months, invalidating the base-case
              profitability timeline and pulling forward capital requirements by one to two years. Uber's competitive
              aggression in CEE — already observable in Poland, Romania, and the Baltic states — represents the second
              most dangerous trigger because it directly attacks the core market share assumption that underpins all
              three valuation scenarios. Monitoring indicators for these triggers should be reviewed quarterly and
              include driver active-hours trends in the top ten markets, Bolt's price index versus Uber by city, and
              legislative docket activity in the EU Platform Work Directive's five most advanced implementation
              jurisdictions.
            claimRefs:
              - CV012
              - CV013
              - CV028
              - CV033
              - CV041
          - type: table
            tableRef: TV005
            claimRefs:
              - CV012
              - CV013
              - CV028
              - CV033
              - CV041
      - number: '8.6'
        title: Diligence Asks and Exit Readiness
        blocks:
          - type: paragraph
            body: >
              Six diligence items are required before committing capital, ordered by priority. The most critical is
              access to three years of audited consolidated financial statements. Bolt has not published audited
              accounts at the consolidated parent level (Bolt Technology OÜ) in any form accessible through Companies
              House, the Estonian Business Register, or Bolt's investor relations pages. Without this data, the ARR,
              GMV, EBITDA margin, and cash position figures used in all three valuation scenarios are derived from
              analyst estimates and press coverage rather than primary financial evidence. This is an unusual
              information deficit for a company considering a 2026–2027 public listing and must be resolved before any
              capital commitment.


              Exit readiness for Bolt as of May 2026 is assessed as early-stage. The IPO runway is plausible — Reuters
              and Bloomberg reporting confirms engagement with investment banks (including PJT Partners as financial
              advisor), and the FT has cited Euronext Paris and London Stock Exchange as the lead venue candidates.
              However, the two-year audited financial requirement for a standard IPO (required by both Euronext and LSE
              listing rules) means that a 2026 IPO is likely achievable only if Bolt can demonstrate completion of a
              first-time audit engagement started no later than mid-2025. An independent EY analysis of IPO readiness
              standards for high-growth technology companies confirms this timeline constraint. Strategic acquisition
              (analogous to the Wolt/DoorDash and Glovo/Delivery Hero precedents) remains a viable secondary exit
              pathway if IPO markets deteriorate or Bolt's European market consolidation thesis attracts a strategic
              buyer at a €7–9B level. However, Markus Villig's founder control structure may limit buyer optionality for
              outright acquisition at scale.
            claimRefs:
              - CV027
              - CV032
              - CV042
              - CV014
              - CV016
              - CV017
          - type: table
            tableRef: TV006
            claimRefs:
              - CV027
              - CV032
              - CV042
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry Discipline is Non-Negotiable at Current Information Levels
            body: >-
              With no audited consolidated financials, every valuation input — ARR, take rate, EBITDA margin, and cash
              position — is an analyst estimate. Entry above €8 billion before primary financial data is available is
              not defensible: the bear case at €4.2B implies a 47% loss at that entry price. A conditional positive
              recommendation at ≤€7B with a mandatory data-room gate (audited accounts + unit economics by vertical) is
              the minimum governance standard for any investment in Bolt at this stage.
            calloutType: recommendation
            claimRefs:
              - CV023
              - CV027
              - CV030
          - type: callout
            title: 'EU Platform Work Directive: The Thesis-Determinative Regulatory Risk'
            body: >-
              The EU Platform Work Directive's binding national transposition in 2026 — and the rebuttable presumption
              of employment it introduces — is the single event most capable of invalidating the base case. EY analysis
              estimates a 25–30% labour cost increase if full reclassification occurs in Bolt's top EU markets. This is
              not a tail risk: the 30% probability estimate reflects the advanced stage of legislative implementation in
              France, Spain, and Poland. Any investment in Bolt requires a specific legal opinion on each of the five
              highest-exposure jurisdictions before committing capital.
            calloutType: risk
            claimRefs:
              - CV012
              - CV013
              - CV028
          - type: callout
            title: Wolt and Glovo Precedents Anchor the Exit Case
            body: >-
              DoorDash's €7B acquisition of Wolt in 2022 and Delivery Hero's €2.3B acquisition of Glovo establish a
              concrete M&A precedent floor for Bolt's mobility and food delivery assets. If Bolt's GMV trajectory and
              market position hold, these precedents suggest strategic acquisition interest at €7B+ remains plausible
              even in a normalised multiple environment — providing downside support for the base case exit valuation
              independent of the IPO pathway.
            calloutType: strength
            claimRefs:
              - CV010
              - CV011
              - CV036
          - type: callout
            title: Grab is the Best Comparable — and Sets a Premium Target
            body: >-
              Grab Holdings is the closest structural analog to Bolt's super-app aspirations: a multi-vertical mobility
              and delivery platform in emerging markets, trading at approximately 8× NTM revenue. If Bolt achieves
              comparable super-app depth and monetisation in CEE and Africa, the premium multiple becomes the ceiling
              rather than the ceiling, supporting the bull case. The gap between Grab's current multiple (8×) and Bolt's
              base-case implied multiple (5×) represents the specific execution proof required to close on the bull
              case.
            calloutType: insight
            claimRefs:
              - CV008
              - CV029
              - CV031
