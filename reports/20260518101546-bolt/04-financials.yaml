callouts:
  - id: KI001
    calloutType: strength
    title: "Cashflow Positive Since FY2024"
    body: "Bolt achieving cashflow positivity in FY2024 — without a new equity raise since 2022 — is a significant financial milestone that validates the platform's operating leverage and demonstrates capital efficiency. This positions Bolt favourably for IPO investors who require a clear path to profitability."
    claimRefs: [CI021, CI025]

  - id: KI002
    calloutType: risk
    title: "UK Legal Liability Not Fully Quantified"
    body: "The £50.5M provision increase in FY2024 UK accounts suggests Bolt is accruing for the worker-classification case, but the full potential liability of £200M+ has not been publicly quantified. This creates a material contingent liability that could impair the financial profile significantly if the appeal is lost at the Q2 2026 remedy hearing."
    claimRefs: [CI022, CI023, CI030]

  - id: KI003
    calloutType: risk
    title: "Audited Full-Group Financials Not Publicly Available"
    body: "Bolt's full consolidated P&L and balance sheet are filed only in the Estonian Business Register and are not available in English without registry access. This opacity makes independent financial diligence reliant on Sacra estimates and UK subsidiary accounts — an inadequate basis for high-conviction underwriting."
    claimRefs: [CI033, CI036]

  - id: KI004
    calloutType: insight
    title: "Revenue Run-Rate Acceleration Signals Strong FY2025"
    body: "The December 2025 run-rate of €3B implies FY2025 revenue substantially above FY2024's €1.99B. If the run-rate was sustained through Q4 2025, FY2025 revenue could reach €2.5–2.9B — a 25–45% growth rate that would significantly strengthen the IPO narrative."
    claimRefs: [CI016, CI017, CI018]

  - id: KI005
    calloutType: recommendation
    title: "Key Diligence Asks Before IPO Commitment"
    body: "Before any IPO subscription commitment, investors must obtain: (1) audited FY2024–2025 consolidated P&L and balance sheet; (2) segment revenue and operating income breakdown (ride vs. food vs. micro); (3) UK legal liability expert opinion post-Q2 2026 hearing; (4) country-level GMV concentration analysis; and (5) driver payout total to validate the 25% take rate claim."
    claimRefs: [CI033, CI034, CI035, CI036, CI037]

