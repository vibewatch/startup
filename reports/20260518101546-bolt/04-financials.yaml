slug: bolt
runDate: 2026-05-18
company:
  name: Bolt
chapter:
  number: 4
  title: Financial Analysis
  summary: "Bolt's financial profile reflects a high-growth platform transitioning from a loss-making expansion phase to cautious profitability. FY2024 revenue reached €1.99 billion (up 17% from €1.70 billion in FY2023), with the company reaching cashflow positivity in 2024. A December 2025 run-rate of €3 billion revenue and €12 billion+ GMV signals continued strong momentum. However, audited financials are not publicly available in full form, limiting independent verification. Key financial risks include the £200M+ UK worker-classification liability, the EU Platform Work Directive cost threat, and reliance on a single €220 million revolving credit facility as the primary recent capital event. The company's capital structure with ~€2.22B total equity raised and IPO exploration in 2026 signals strong investor backing, though the IPO timeline and market conditions remain uncertain."

sections:
  - id: revenue-streams-and-model
    title: Revenue Streams, Pricing Model, and Revenue Mix
    body: "Bolt's revenue model is a platform take-rate business: the company charges a service fee (commission) on gross transaction value (GMV) processed through its platform, across multiple verticals. The primary revenue stream is ride-hailing, which accounted for an estimated 82% of FY2024 revenue of €1.99 billion — approximately €1.63 billion — derived from a 15–20% commission on each ride fare. Food delivery (Bolt Food) contributed approximately 18% (~€358M), through take-rates on restaurant orders estimated at 25–30%. Micromobility (Bolt Scooters/Bolt Bikes) generates revenue through per-minute or per-ride fees and municipal permit contracts; as a fraction of total revenue it is currently small but strategically important. Bolt Market (grocery delivery) and Bolt Drive (car-sharing subscription) contribute to a growing delivery and mobility subscription segment that Bolt has not broken out separately. Bolt for Business generates B2B fees through negotiated enterprise contracts, offering volume pricing and invoice billing to corporate clients. Revenue recognition follows standard digital-platform accounting: the company recognises only its net commission as revenue (not the full GMV), consistent with agent-model accounting under IFRS 15. This means Bolt's reported €1.99B in FY2024 represents the net fee income retained after paying driver, courier, and restaurant partners their share. The overall take rate is approximately 25% of GMV at the consolidated level (€3B revenue / €12B+ GMV = ~25%), consistent with reported metrics. Revenue mix has been shifting slightly toward delivery (food, grocery) as the platform diversifies, but ride-hailing dominates and is expected to remain the core revenue engine. Seasonality exists but is moderate: ride volumes are higher in autumn/winter (commuting demand) and summer peaks exist in leisure cities; food delivery is relatively stable year-round."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: cost-structure-and-margins
    title: Cost Structure, Gross Margin, and Operating Economics
    body: "Bolt's cost structure is typical of a marketplace platform: the largest cost element is the driver/courier/restaurant partner pay-out, which is implicit in the take-rate model. Since Bolt recognises only its commission as revenue, COGS primarily consists of payment processing fees (estimated 1–2% of GMV = ~€120–240M at run-rate), driver support infrastructure, insurance contributions, and direct platform operating costs. Gross margins on the platform's fee income are estimated at 40–60%, driven by the relatively low variable cost of each incremental transaction on software infrastructure. However, this margin is eroded substantially at the operating level by R&D and technology investment (~€400–500M annually estimated), G&A and compliance (elevated due to multi-jurisdictional regulatory burden), marketing and driver acquisition, and legal provisions. Bolt's operating loss for FY2024 has been estimated at -€87.7 million by Sacra, despite positive cashflow — suggesting EBITDA-level profitability but a gap between EBITDA and EBIT due to depreciation on scooter hardware, capitalized software, and amortisation of intangibles. Capital expenditure is driven primarily by the scooter and e-bike fleet (Bolt operates 100,000+ units), which requires continuous replacement and expansion investment. Bolt Drive (car-sharing) represents a further capex-intensive sub-segment. The ride-hailing and food delivery core business is predominantly capital-light: software infrastructure runs on cloud (AWS/GCP), and the primary 'asset' is the driver and consumer network. Working capital dynamics are favourable: ride payments are collected in advance from consumers and held briefly before payout to drivers — creating a modest positive float. Gross margin improvement is expected over time as fixed technology costs are spread across rising GMV, and as the micromobility hardware fleet matures and renewal cycles extend. The UK subsidiary's FY2024 pre-tax profit of just £133,000 (down from £8.2M in FY2023) demonstrates that in markets with elevated legal exposure, operating margins can be functionally eliminated by litigation provisions."
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: public-traction-and-kpis
    title: Public Financial Traction and Key Performance Indicators
    body: "Bolt's financial traction is well-evidenced at the top-line level by a combination of official company communications, Sacra's independent revenue estimates, and UK regulatory filings. The most credible data points are the company's own disclosures: €3 billion revenue run-rate and €12 billion+ GMV run-rate as of December 2025, sourced directly from the Bolt investor page; and the FY2024 annual result of €1.99 billion revenue confirmed by Raison (citing audited Estonian registry filings) and Sacra. Revenue growth of 17% from FY2023 (€1.70B) to FY2024 (€1.99B) is consistent across multiple independent sources. The December 2025 run-rate implies an accelerating growth trajectory: annualising December 2025 at €3B suggests FY2025 revenue significantly above FY2024. At €12B+ GMV, Bolt's implied take rate of ~25% is consistent across all available data points. Operational KPIs — 200M+ lifetime customers, 4.5M+ driver/courier/merchant partners, 850+ cities, 50+ countries — are company-stated and have been consistently cited across multiple official and independent sources since at least early 2025. On profitability, Bolt became cashflow positive in 2024 — a milestone explicitly stated on the investor page. The Sacra estimate of -€87.7M operating loss with positive free cash flow is consistent with EBITDA-positive, EBIT-negative operations, likely driven by hardware depreciation and legal provisions. Revenue per employee of approximately €499K (€1.99B / ~4,000 employees) is healthy for a European tech company and compares favourably to sector peers. Notably, the company has not published full audited financial statements in English in accessible form; the Estonian E-Business Register is the definitive source but requires translation and registry access. The UK subsidiary's Companies House filing for FY2024 provides the most accessible audited data point, showing turnover of approximately £384M and a near-breakeven pre-tax result after legal provisions."
    claimRefs: [CI016, CI017, CI018, CI019, CI020, CI021, CI022, CI023, CI024]
    tableRefs: []
    figureRefs: [FI003]

  - id: capital-adequacy-and-financing
    title: Capital Adequacy, Financing Dependency, and Runway
    body: "Bolt's capital structure reflects a private company that has completed its primary growth-equity fundraising phase and is now managing through a combination of retained cash flows, a revolving credit facility, and IPO option value. Total equity raised of approximately €2.22 billion across multiple rounds from 2013 to 2022 provides the foundation; the most recent primary equity event was the January 2022 Series F at €628 million. No new primary equity round has been announced since then — a notable 4-year gap that reflects Bolt's transition to cashflow self-sufficiency. The most recent primary capital event was the €220 million revolving credit facility closed in May 2024, provided by a syndicate of eight major banks: Barclays, BNP Paribas, Citi, Deutsche Bank, Goldman Sachs, JPMorgan, LHV Pank, and Luminor. The participation of Goldman Sachs, JPMorgan, and Citi — all of whom could advise on an eventual IPO — is strategically significant and signals institutional confidence in Bolt's credit quality. Cashflow positivity since 2024 means Bolt is no longer burning through reserves at the pace of its 2020–2022 expansion phase. However, the exact cash balance and runway are not publicly disclosed. The revolving credit facility provides a liquidity buffer for working capital needs and could be drawn upon to fund legal liabilities (UK worker case) or strategic investments (scooter fleet, new market entry). Material financial risks include: (1) the UK worker-classification case, with a Q2 2026 remedy hearing that could crystallise £200M+ in obligations; (2) EU Platform Work Directive transposition costs that could require significant working capital for employment benefit obligations; (3) any capital intensity increase from the Stellantis/NVIDIA AV partnerships that could require equity or debt financing; and (4) IPO underpricing or delay risk. The 2025 secondary share sale at $6.82 billion and the €220M revolving credit suggest Bolt is in a stable but not over-capitalised financial position. An IPO at 2–3x revenue ($6–9B) would provide significant fresh capital to fund the next growth phase and de-risk the balance sheet. The company's financial verdict is one of a maturing platform that has demonstrated top-line scale and cashflow management, but faces opacity and elevated off-balance-sheet risks in the form of the UK legal liability."
    claimRefs: [CI025, CI026, CI027, CI028, CI029, CI030, CI031, CI032]
    tableRefs: [TI004, TI005]
    figureRefs: [FI004]

  - id: financial-verdict
    title: Financial Verdict and Investor Considerations
    body: "From an investment diligence standpoint, Bolt's financial profile presents a mix of high-quality signals and material gaps. The high-quality signals are: (1) scale — €1.99B FY2024 revenue is substantial for a European-origin private tech company; (2) growth — 17% revenue CAGR with accelerating momentum to a €3B run-rate by December 2025; (3) capital efficiency — cashflow positivity achieved without a new equity raise since 2022; and (4) institutional credit quality — eight tier-one banks providing a €220M revolving facility. The material financial gaps are: (1) audited full-group P&L and balance sheet are not publicly available, making independent verification of profitability, gross margins, and debt levels impossible from public sources; (2) the UK worker-classification liability of £200M+ is a material contingent claim that is not definitively reflected in any disclosed provision figure; (3) segment-level economics (ride-hailing vs. food delivery vs. micromobility) are not disclosed, preventing assessment of cross-subsidy dynamics; (4) city-level or market-level GMV breakdown is unavailable, hiding the true concentration risk (if 50% of GMV comes from 5 cities, that changes the risk profile materially); (5) driver and courier payment economics — the largest actual cost driver in the system — are not separately disclosed. Revenue quality is high in the sense that platform fees are sticky (consumer app usage is habitual), GMV-linked, and diversified across 50+ countries. However, the margin path is uncertain: if EU PWD forces employment reclassification of drivers, Bolt's fundamental cost structure changes dramatically, and without a clear view of pre-reclassification margins by country, it is impossible to model the post-reclassification financial impact with confidence. Capital intensity is moderate: the scooter fleet and car-sharing programme add capex, but the core ride-hailing and delivery business is structurally capital-light. Overall financial verdict: investable with conditions — requires audited financials, segment P&L, UK liability quantification, and country-level GMV to reach high-conviction underwriting."
    claimRefs: [CI033, CI034, CI035, CI036, CI037]
    tableRefs: []
    figureRefs: []

