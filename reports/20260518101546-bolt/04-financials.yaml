figures:
  - id: FI001
    title: Revenue Model Bridge
    type: flow
    description: "Shows how Bolt converts Gross Merchandise Value (GMV) into net revenue across its primary business verticals, illustrating the platform take-rate model and multi-vertical revenue mix."
    approximationNotes: "Node values are estimates based on Sacra analysis and company-stated run-rate figures. Segment splits (82%/18%) are analyst estimates, not audited figures."
    claimRefs: [CI001, CI002, CI003, CI006, CI007]
    data:
      nodes:
        - id: gmv
          label: "GMV Pool (€12B+ run-rate)"
          type: input
          note: "Total gross transaction value processed across all Bolt verticals"
        - id: ride-hailing-gmv
          label: "Ride-hailing GMV (~€9.8B)"
          type: process
          note: "~82% of GMV; 4.5M+ drivers in 850+ cities"
        - id: food-delivery-gmv
          label: "Food & Grocery GMV (~€2.2B)"
          type: process
          note: "~18% of GMV; Bolt Food + Bolt Market"
        - id: other-gmv
          label: "Micro/Drive/B2B GMV (~€0.3B)"
          type: process
          note: "Scooters, Bolt Drive, Bolt for Business"
        - id: driver-payout
          label: "Driver / Partner Earnings (~€7.4B)"
          type: process
          note: "~75% of GMV paid to drivers, couriers, restaurants"
        - id: net-revenue
          label: "Net Platform Revenue (€3B run-rate)"
          type: output
          note: "~25% take rate on GMV; recognised as agent-model net fee income"
      edges:
        - from: gmv
          to: ride-hailing-gmv
          label: "82% allocation"
        - from: gmv
          to: food-delivery-gmv
          label: "18% allocation"
        - from: gmv
          to: other-gmv
          label: "<3% allocation"
        - from: ride-hailing-gmv
          to: driver-payout
          label: "80–85% to driver"
        - from: ride-hailing-gmv
          to: net-revenue
          label: "15–20% commission"
        - from: food-delivery-gmv
          to: driver-payout
          label: "70–75% to partners"
        - from: food-delivery-gmv
          to: net-revenue
          label: "25–30% commission"
        - from: other-gmv
          to: net-revenue
          label: "100% (owned fleet) or ~20%"

