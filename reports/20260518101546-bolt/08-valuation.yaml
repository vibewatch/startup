chapter:
  order: 8
  number: 8
  title: Valuation
  letter: V
  summary: "Bolt's last known official valuation of approximately $8.4 billion (€7.6 billion) stems from its January 2022 Series F round; secondary market signals and analyst estimates in 2025–2026 place the implied range at €7–9 billion. Against a comparable set anchored by Uber (5–7× NTM revenue), the Wolt/DoorDash precedent transaction (€7B, ~7× revenue), and Grab's super-app premium (8× NTM revenue), Bolt's implied multiple appears fair at €7B and rich above €8B. This chapter issues a conditional positive recommendation—watchlist/co-invest at entry ≤€7B—with a base-case IPO target of €10B (5× €2B 2027E ARR) and a bull case of €18B (6× €3B ARR). The bear case of €4.2B is triggered by EU gig-worker reclassification in three or more markets and Uber price-war aggression in core CEE markets. The most critical diligence gap is the complete absence of audited consolidated financials, which limits confidence in scenario inputs and prevents independent verification of the ARR and EBITDA margin estimates that underpin all three scenarios. A conditional positive stance is warranted given Bolt's demonstrated scale (€7B+ GMV, 200M users, 45+ countries) and super-app optionality, but entry discipline above €8B is non-negotiable."

sections:
  - id: section-thesis-recommendation
    title: "Investment Thesis and Recommendation"
    body: |
      Bolt's investment thesis rests on three durable pillars: structural market leadership in underpenetrated CEE and African mobility markets, an emergent super-app flywheel combining ride-hailing, food delivery, grocery, and micromobility, and a credible IPO pathway in 2026–2027 that creates a defined exit mechanism for private investors. Against these pillars, the anti-thesis centres on three equally concrete challenges: the complete absence of audited public financials (making all valuation inputs estimates), the EU Platform Work Directive's potential to compress margins by 25–30% in affected markets, and Uber's intensifying capital-backed market entry into Bolt's core CEE geographies.

      The overall recommendation is conditional positive — specifically, a watchlist or co-invest stance at an entry valuation at or below €7 billion. At this entry level, base-case returns of approximately 1.4× to 2.0× over three to four years are achievable assuming a €10B IPO in 2027; bull-case upside to €18B implies a 2.6× return. Entry above €8B narrows the margin of safety to the bear case materially and is not recommended without access to audited financials that confirm the ARR, take-rate, and EBITDA profile underpinning the base scenario.

      The confidence level for this recommendation is moderate, reflecting Bolt's genuine scale and market leadership on one hand, and the structural information asymmetry arising from the absence of audited consolidated accounts on the other. The risk rating is medium-high, driven predominantly by the EU regulatory cycle and competitive pressure from Uber. The Investment KPIs figure (FV004) summarises the eight thesis dimensions with signal ratings. The Recommendation Logic figure (FV001) traces the decision chain from market position through financial trajectory to the conditional positive conclusion.
    claimRefs: [CV001, CV002, CV030, CV023, CV031, CV035, CV021, CV029]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001, FV004]

  - id: section-valuation-context
    title: "Valuation Context and Financing"
    body: |
      Bolt's most recent disclosed valuation is approximately $8.4 billion, established during a $628 million Series F round announced in January 2022. The round was led by existing investors and brought total capital raised to approximately $1.9 billion. Anchor investors include Sequoia Capital's growth fund, G Squared, Naya Capital, and the European Investment Fund, alongside earlier backers. Bolt's founder and CEO Markus Villig retains a significant equity stake, which the investor community has typically interpreted as a signal of founder conviction but also as a governance concentration risk for institutional co-investors.

      As of May 2026, Bolt has not announced a new equity round. Secondary market analyst estimates place the implied valuation range at €7–9 billion — broadly in line with the 2022 Series F level adjusted for EUR/USD movements and a modest narrative discount for the absence of public financial disclosure. Sacra's analyst research estimates 2025 ARR at €1.1–1.3 billion on total platform GMV of approximately €7 billion, implying a blended take rate of approximately 18–22%. Bolt published its 2024 financial results in early 2025 — a notable step toward transparency — but the disclosed metrics did not include audited consolidated P&L or balance sheet data, limiting independent verification.

      Entry discipline is central to the investment case. At an entry valuation of €7 billion, the EV/NTM revenue multiple is approximately 5–6× on Sacra's ARR estimate, broadly in line with the peer median. Above €8 billion, the multiple stretches to 6–7×, which compresses the margin of safety against the bear case. Dilution overhang from existing preference stacks is not publicly disclosed, representing a material diligence gap (see Section 6) that could affect the effective return in liquidation scenarios below €10 billion.
    claimRefs: [CV001, CV002, CV003, CV004, CV014, CV020, CV027, CV032, CV037, CV040]
    tableRefs: []
    figureRefs: []

  - id: section-scenarios
    title: "Bull / Base / Bear Scenarios"
    body: |
      The scenario analysis uses 2027E ARR as the primary valuation anchor, with multiples calibrated to the public and private comparable set. In all scenarios, the path to ARR growth runs through sustained GMV expansion in ride-hailing (core driver), continued take-rate uplift via Bolt Business B2B volumes, and moderate food delivery contribution. The probability weights assigned are 20% bull, 50% base, and 30% bear — reflecting the genuine asymmetry between the upside (requires execution without regulatory shocks) and the downside (one material regulatory event is enough to compress the bear case).

      In the bull scenario, Bolt sustains its CEE and African market leadership, Bolt Business reaches 30% of revenue (from an estimated 20–25% today), food delivery achieves contribution margin positivity in core markets, and an IPO at a premium multiple of 6× ARR yields a €18 billion valuation. The required ARR of €3 billion by 2027 implies a 35–40% compound annual growth rate from the 2025 base, which is achievable but demanding given the absence of financial transparency. The base scenario assumes moderate GMV growth in existing markets, Bolt Business maintaining approximately 25% of revenue, manageable regulatory headwinds, and an IPO at the peer-median multiple of 5× for an implied €10 billion valuation. The bear scenario assumes EU gig-worker reclassification in three or more markets (estimated 25–30% cost increase), a sustained Uber price war depressing GMV by 15–20%, delayed IPO or a down-round financing, and an implied valuation of €4.2 billion at 3.5× ARR on a reduced base of €1.2 billion. The probability-weighted expected value across scenarios is approximately €9.1 billion, which validates the base case as the most likely outcome and underscores that the bull case premium requires specific execution proof.
    claimRefs: [CV015, CV016, CV017, CV013, CV039, CV038]
    tableRefs: [TV003]
    figureRefs: [FV002, FV003]

  - id: section-comparables
    title: "Comparable Valuation Analysis"
    body: |
      The comparable set for Bolt spans three categories: public ride-hailing platforms (Uber, Lyft), public super-app platforms (Grab Holdings), and private or acquired mobility/delivery businesses (InDrive, Rappi, Yango, Deliveroo, the Wolt/DoorDash transaction, and the Glovo/Delivery Hero transaction). Uber is the most directly comparable at scale, trading at approximately 5–7× NTM revenue with a roughly $100 billion market cap as of mid-2026; its proven profitability and global brand set a ceiling for what Bolt's multiple could reach at IPO. Grab Holdings, trading at approximately 8× NTM revenue, provides the best structural analog as a multi-vertical super-app in a developing market, though its Southeast Asian market and fintech penetration distinguish it from Bolt's CEE/Africa footprint.

      The two most relevant M&A precedent transactions are DoorDash's acquisition of Wolt for €7 billion in 2022 (approximately 7× Wolt's revenue at the time) and Delivery Hero's acquisition of Glovo for €2.3 billion (approximately 4× revenue). Both transactions occurred in the high-multiple environment of 2021–2022 and should be interpreted as upper-bound precedents rather than expectations in a more normalised 2026–2027 market. Lyft's current multiple of approximately 1.5× NTM revenue reflects US market saturation and declining market share, and is most useful as a downside reference rather than a central estimate. Among private comparables, InDrive's last known valuation of approximately $1.2 billion (2023 Series B), Rappi's $5.25 billion (2021 Series F), and Yango's approximately $800 million are all substantially below Bolt's implied valuation and reflect smaller scale, single-region focus, or earlier stage. On a blended basis, applying a 5× NTM revenue multiple to Bolt's estimated 2027E ARR of €2 billion yields the base case valuation of €10 billion.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV024, CV025, CV026, CV036, CV038]
    tableRefs: [TV004]
    figureRefs: []

  - id: section-thesis-break
    title: "Thesis-Break Triggers"
    body: |
      Thesis-break triggers are the specific events or thresholds that would cause a prudent investor to reassess or exit the Bolt position, regardless of prior investment in the thesis. They are distinct from risks (which are known uncertainties) in that they represent crystallised outcomes that fundamentally alter the return distribution. For Bolt, five triggers have been identified: EU gig-worker reclassification in three or more markets (critical severity), Uber subsidised pricing in ten or more of Bolt's core CEE and African cities (high severity), a GDPR or competition authority fine exceeding €100 million (high severity), an IPO priced below €6 billion (high severity), and a material founder or key management departure (medium severity).

      The most consequential trigger is gig-worker reclassification. The EU Platform Work Directive, which entered national transposition in 2026, introduces a rebuttable presumption of employee status for platform workers. EY analysis suggests full reclassification could increase Bolt's EU operating costs by 25–30% in affected markets; if triggered in Bolt's top three to five EU revenue markets simultaneously, EBITDA in those markets could turn negative within twelve to eighteen months, invalidating the base-case profitability timeline and pulling forward capital requirements by one to two years. Uber's competitive aggression in CEE — already observable in Poland, Romania, and the Baltic states — represents the second most dangerous trigger because it directly attacks the core market share assumption that underpins all three valuation scenarios. Monitoring indicators for these triggers should be reviewed quarterly and include driver active-hours trends in the top ten markets, Bolt's price index versus Uber by city, and legislative docket activity in the EU Platform Work Directive's five most advanced implementation jurisdictions.
    claimRefs: [CV012, CV013, CV028, CV033, CV041]
    tableRefs: [TV005]
    figureRefs: []

  - id: section-diligence-exits
    title: "Diligence Asks and Exit Readiness"
    body: |
      Six diligence items are required before committing capital, ordered by priority. The most critical is access to three years of audited consolidated financial statements. Bolt has not published audited accounts at the consolidated parent level (Bolt Technology OÜ) in any form accessible through Companies House, the Estonian Business Register, or Bolt's investor relations pages. Without this data, the ARR, GMV, EBITDA margin, and cash position figures used in all three valuation scenarios are derived from analyst estimates and press coverage rather than primary financial evidence. This is an unusual information deficit for a company considering a 2026–2027 public listing and must be resolved before any capital commitment.

      Exit readiness for Bolt as of May 2026 is assessed as early-stage. The IPO runway is plausible — Reuters and Bloomberg reporting confirms engagement with investment banks (including PJT Partners as financial advisor), and the FT has cited Euronext Paris and London Stock Exchange as the lead venue candidates. However, the two-year audited financial requirement for a standard IPO (required by both Euronext and LSE listing rules) means that a 2026 IPO is likely achievable only if Bolt can demonstrate completion of a first-time audit engagement started no later than mid-2025. An independent EY analysis of IPO readiness standards for high-growth technology companies confirms this timeline constraint. Strategic acquisition (analogous to the Wolt/DoorDash and Glovo/Delivery Hero precedents) remains a viable secondary exit pathway if IPO markets deteriorate or Bolt's European market consolidation thesis attracts a strategic buyer at a €7–9B level. However, Markus Villig's founder control structure may limit buyer optionality for outright acquisition at scale.
    claimRefs: [CV027, CV032, CV042, CV014, CV016, CV017]
    tableRefs: [TV006]
    figureRefs: []

