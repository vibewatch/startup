    insight: "KPI scoring across eight investment dimensions: market opportunity and user traction score strong; take-rate trajectory and margin profile score good; product differentiation scores moderate given super-app nascency; regulatory risk scores elevated due to EU Platform Work Directive; financial transparency scores weak and is the primary constraint on confidence. Aggregate signal: conditional positive pending financial transparency improvement."
