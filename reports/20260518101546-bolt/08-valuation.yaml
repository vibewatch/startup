callouts:
  - calloutType: recommendation
    title: "Entry Discipline is Non-Negotiable at Current Information Levels"
    body: "With no audited consolidated financials, every valuation input — ARR, take rate, EBITDA margin, and cash position — is an analyst estimate. Entry above €8 billion before primary financial data is available is not defensible: the bear case at €4.2B implies a 47% loss at that entry price. A conditional positive recommendation at ≤€7B with a mandatory data-room gate (audited accounts + unit economics by vertical) is the minimum governance standard for any investment in Bolt at this stage."
    claimRefs: [CV023, CV027, CV030]

  - calloutType: risk
    title: "EU Platform Work Directive: The Thesis-Determinative Regulatory Risk"
    body: "The EU Platform Work Directive's binding national transposition in 2026 — and the rebuttable presumption of employment it introduces — is the single event most capable of invalidating the base case. EY analysis estimates a 25–30% labour cost increase if full reclassification occurs in Bolt's top EU markets. This is not a tail risk: the 30% probability estimate reflects the advanced stage of legislative implementation in France, Spain, and Poland. Any investment in Bolt requires a specific legal opinion on each of the five highest-exposure jurisdictions before committing capital."
    claimRefs: [CV012, CV013, CV028]

  - calloutType: strength
    title: "Wolt and Glovo Precedents Anchor the Exit Case"
    body: "DoorDash's €7B acquisition of Wolt in 2022 and Delivery Hero's €2.3B acquisition of Glovo establish a concrete M&A precedent floor for Bolt's mobility and food delivery assets. If Bolt's GMV trajectory and market position hold, these precedents suggest strategic acquisition interest at €7B+ remains plausible even in a normalised multiple environment — providing downside support for the base case exit valuation independent of the IPO pathway."
    claimRefs: [CV010, CV011, CV036]

  - calloutType: insight
    title: "Grab is the Best Comparable — and Sets a Premium Target"
    body: "Grab Holdings is the closest structural analog to Bolt's super-app aspirations: a multi-vertical mobility and delivery platform in emerging markets, trading at approximately 8× NTM revenue. If Bolt achieves comparable super-app depth and monetisation in CEE and Africa, the premium multiple becomes the ceiling rather than the ceiling, supporting the bull case. The gap between Grab's current multiple (8×) and Bolt's base-case implied multiple (5×) represents the specific execution proof required to close on the bull case."
    claimRefs: [CV008, CV029, CV031]

