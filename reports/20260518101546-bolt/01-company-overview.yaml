company:
  name: Bolt
chapter:
  number: 1
  title: Company Overview
  summary: "Bolt (formerly Taxify) is an Estonian multinational mobility super-app founded in 2013 in Tallinn by Markus Villig, Martin Villig, and Oliver Leisalu. The company operates ride-hailing, micromobility, car-sharing, food and grocery delivery services across 50+ countries and 850+ cities, serving 200M+ lifetime customers with a €3B revenue run-rate as of December 2025. Key risks include a landmark UK worker-classification ruling threatening £200M+ in back-pay obligations and a lobbying controversy that exposed close coordination with the Estonian government on EU labour policy."

sections:
  - id: identity-and-business-model
    title: Company Identity and Business Model
    body: "Bolt Technology OÜ — commonly known as Bolt — is an Estonian multinational mobility company headquartered at Vana-Lõuna tn 15, Tallinn, Estonia. Founded in August 2013 by Markus Villig (then 19 years old), the company started as mTakso and later rebranded as Taxify before adopting the Bolt name in March 2019. The rebranding signalled the company's strategic evolution beyond taxi-hailing into a multi-modal urban mobility super-app. Bolt now operates ride-hailing (its core service), e-scooter and e-bike rentals, car-sharing (Bolt Drive), food delivery (Bolt Food), grocery delivery (Bolt Market), and corporate travel management (Bolt for Business). As of May 2026, Bolt operates in more than 50 countries and 850 cities, serves 200M+ lifetime customers, and supports 4.5M+ driver, courier, and merchant partners. The company's revenue run-rate reached €3 billion in December 2025, with a GMV run-rate exceeding €12 billion. Bolt describes its mission as 'making cities for people, not cars', pursuing the reduction of private vehicle use through affordable, sustainable shared mobility options. The company has been cashflow positive since 2024 and reported €1.99 billion in revenue for FY2024. Bolt is a private company and its primary legal entity is registered in Estonia under the E-Business Register. It employs over 4,000 people globally with operational hubs in Tallinn, Berlin, Warsaw, Bucharest, Lisbon, and London."
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO036, CO037]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: leadership-and-governance
    title: Leadership and Governance
    body: "Bolt is led by its founder, Markus Villig, who has served as CEO since the company's inception. Born in 1993 on Saaremaa island, Villig dropped out of university to run Bolt full-time and is widely recognised as Europe's youngest founder to build a company valued at over €1 billion. His brother Martin Villig, who previously worked at Skype, co-founded Bolt and serves as Chairman of the Supervisory Board. Oliver Leisalu, the third co-founder and an engineer, joined at the outset and served as the company's technical lead. Jevgeni Kabanov holds the title of President, while Epp Aasaru serves as Chief Legal Officer. Bolt employs approximately 4,000–4,206 people globally as of FY2024. Bolt's low-commission model — charging drivers 15–20% compared to industry norms above 30% — has been central to its supply-side strategy and reflects deliberate leadership choices to prioritise driver retention over short-term revenue maximisation. A key-person dependency risk exists around Markus Villig, given his continued hands-on involvement at all operational levels. Board composition below the supervisory level is not fully disclosed in public sources, representing a governance transparency gap typical of private companies at this stage. The company's governance has also been scrutinised following revelations that Bolt maintained close coordination with the Estonian government on EU labour legislation, raising conflicts-of-interest questions."
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO035]
    tableRefs: [TO002]
    figureRefs: []

  - id: funding-valuation-capital
    title: Funding History, Valuation, and Capital Structure
    body: "Bolt has raised approximately €2.22 billion ($2.40 billion) in total funding across seed, venture, and debt rounds since its founding in 2013. The company's most significant equity round was the Series F in January 2022, when it raised €628 million co-led by Sequoia Capital and Fidelity Management and Research Company at a valuation of €7.4 billion ($8.4 billion) — the highest valuation it has achieved. This followed a Series E just four months prior in August 2021, which raised €600 million at a €4 billion+ valuation, also led by Sequoia. Earlier venture milestones include a strategic investment from DiDi Chuxing in 2017 and a $175 million Series C raise in May 2018. Bolt's most recent primary capital event was a €220 million revolving credit facility closed in May 2024, with lending banks including Barclays, BNP Paribas, Citi, Deutsche Bank, Goldman Sachs, JPMorgan, LHV Pank, and Luminor — indicating acceptance by mainstream bank creditors ahead of a potential IPO. A secondary share sale in 2025 valued the company at $6.82 billion (€6.3 billion), a roughly 14% decrease from the 2022 peak, consistent with broader late-stage valuation compression. Bolt is exploring an IPO in 2026 and has engaged PJT Partners as a financial adviser; the listing could take place in Europe or the US depending on market conditions. Key equity investors include Sequoia Capital, Fidelity Management & Research Company, D1 Capital Partners, Whale Rock Capital Management, G Squared, Naya Capital, Mercedes-Benz, and the International Finance Corporation (World Bank Group)."
    claimRefs: [CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: milestones-and-adverse-events
    title: Key Milestones, Adverse Events, and Regulatory Exposure
    body: "Bolt's operational history from 2013 to 2026 covers founding, rapid international expansion, product diversification, major funding events, and significant legal and regulatory headwinds. After starting with a €5,000 family loan and 50 recruited drivers in Tallinn, the company expanded to the Baltics in 2014, entered Africa in 2016 (South Africa, Nigeria, Kenya), and attracted DiDi Chuxing as an investor in 2017. The March 2019 Taxify-to-Bolt rebranding marked a strategic pivot from taxi aggregator to multi-modal urban mobility platform, coinciding with the formal launch of food delivery services and e-scooter operations. Capital milestones escalated rapidly through 2021–2022, culminating in the €628 million Series F at a peak €7.4 billion valuation. A major adverse milestone occurred in November 2024, when the UK Employment Tribunal ruled that Bolt's UK drivers — over 100,000 individuals represented by 15,000 plaintiffs via law firm Leigh Day — are workers rather than self-employed contractors. This ruling could expose Bolt to £200 million or more in back-pay claims. Bolt filed an appeal in December 2024, and a financial remedy hearing is scheduled for Q2 2026. Separately, the Corporate Europe Observatory revealed in May 2024 that Bolt had drafted a letter for the Estonian government to forward to the EU Council opposing the Platform Work Directive — a finding that caused public outcry in Estonia and raised questions about the depth of Bolt's political influence. Bolt's UK profits were almost wiped out in FY2024, with pre-tax profit falling from £8.2M in 2023 to £133,355 after legal provision costs rose by £50.5 million. On the positive side, Bolt won a key VAT dispute in March 2025 when the Upper Tax Tribunal rejected HMRC's appeal over the Tour Operators' Margin Scheme, allowing Bolt to pay VAT only on its margin. Recent strategic partnerships include the Stellantis collaboration for large-scale driverless mobility in Europe (December 2025) and an NVIDIA DRIVE Hyperion AI partnership for autonomous vehicle scaling (March 2026)."
    claimRefs: [CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO042]
    tableRefs: [TO004]
    figureRefs: [FO001]

