callouts:
  - calloutType: strength
    title: Proven Multi-Modal Super-App at Scale
    body: "Bolt has successfully built and validated a multi-modal mobility platform — ride-hailing, micromobility, car-sharing, food delivery, grocery delivery, and B2B travel — across 50+ countries and 850+ cities. With 200M+ lifetime customers, a €3B revenue run-rate, and cashflow positivity since 2024, Bolt demonstrates operational resilience and genuine product-market fit across multiple verticals and geographies."
    claimRefs: [CO006, CO007, CO010, CO012, CO036]

  - calloutType: risk
    title: UK Worker Classification Ruling Creates Material Liability
    body: "A November 2024 UK Employment Tribunal ruling that Bolt's drivers are workers (not self-employed) exposes the company to £200M+ in potential back-pay claims from 100,000+ drivers. Bolt has filed an appeal but a financial remedy hearing is scheduled for Q2 2026. If upheld, the ruling could structurally alter Bolt's cost base and force reclassification in other markets, threatening the contractor-model economics that have underpinned Bolt's competitive positioning."
    claimRefs: [CO030, CO031, CO032, CO033, CO034]

  - calloutType: insight
    title: Valuation Has Compressed 14% from Peak Despite Strong Revenue Growth
    body: "Despite revenue growing from €1.70B in 2023 to €1.99B in 2024 and a €3B run-rate in December 2025, Bolt's implied valuation in 2025 secondary transactions ($6.82B) is approximately 14% below the 2022 Series F peak of $8.4B, reflecting late-stage valuation compression across the private tech market. The IPO exploration with PJT Partners offers a potential path to price discovery and liquidity for early investors, but the worker-classification liability may complicate the prospectus."
    claimRefs: [CO021, CO023, CO028, CO036, CO037]

