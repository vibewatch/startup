callouts:
  - calloutType: risk
    title: "EU Platform Work Directive: Thesis-Level Regulatory Risk"
    body: "If the EU Platform Work Directive is enacted with binding employee reclassification in Bolt's top five European markets simultaneously, Bolt's contribution margin would compress by an estimated 15–25 percentage points—transforming a credible path-to-profitability narrative into a structural loss model requiring complete business model redesign. This is the single highest-priority risk for investment diligence and the primary thesis-break trigger."
    claimRefs: [CR001, CR029]

  - calloutType: risk
    title: "Google Maps API: Critical Dependency With No 12-Month Alternative"
    body: "Bolt routes 90%+ of trips via Google Maps API at an estimated cost of €40–80M annually. Google's previous 14× Maps Platform pricing restructuring in 2018 demonstrates willingness to reprice unilaterally and at scale. OSM-based routing investment is underway but is 24+ months from meaningful coverage. This dependency is the platform's most underappreciated single-point risk."
    claimRefs: [CR014, CR038]

  - calloutType: strength
    title: "Explicit Kill Criteria and Board-Level Risk Governance"
    body: "Bolt has defined four explicit kill criteria—including Platform Work Directive enforcement, TfL revocation, GMV growth below 15%, and a major GDPR fine—with monitoring indicators reviewed at board level. This governance maturity is unusual for a platform at Bolt's scale and stage and provides investors with a structured framework for ongoing diligence."
    claimRefs: [CR034, CR035, CR036, CR037]

  - calloutType: recommendation
    title: "Priority Data Room Ask: Full Legal Risk Register Across All 45+ Markets"
    body: "The regulatory risk register reconstructed from public sources covers EU, UK, Nigeria, and Romania comprehensively but cannot verify exposure across sub-Saharan African, South-East Asian, and Latin American markets. Requesting a complete legal counsel market-by-market risk register with enforcement timeline and materiality ratings is the highest single-value data room information request."
    claimRefs: [CR006, CR007]

