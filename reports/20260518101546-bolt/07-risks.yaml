    - type: missing-data
      severity: high
      topic: "Regulatory / legal risk register (TR001) coverage gap — 45+ operating countries not fully verified from public sources"
      missingEvidence: "Bolt does not publish a comprehensive market-by-market regulatory risk register. Public source research identifies major EU, UK, Nigeria, and Romania regulatory risks captured in TR001, but the full legal exposure across sub-Saharan Africa, South-East Asia, Latin America, and the Middle East cannot be verified from public sources alone."
      whyItMatters: "Material regulatory or licensing risks in smaller markets—which individually may be immaterial but in aggregate could represent 10–20% of GMV—are invisible without internal legal counsel's assessment. A regulatory shock in a mid-sized African market could rapidly escalate to multiple simultaneous licence challenges."
