      severity: medium
      topic: "Bolt burn rate, capital adequacy, and profitability path disclosure"
      missingEvidence: "Bolt does not publish audited financial statements. Burn rate estimates (€250–400M annually) are inferred from investor statements and press coverage. Cash position, runway, and the financial structure of any committed credit facilities are not publicly disclosed."
