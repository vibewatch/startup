callouts:
  - calloutType: strength
    title: Large and Growing Markets With Bolt Leading in Under-Served Geographies
    body: "Bolt operates in European and African ride-hailing and food delivery markets with combined addressable pools of $100–150B. In Central and Eastern Europe — where Uber has historically competed less aggressively — Bolt leads on price and driver supply. In sub-Saharan Africa, Bolt benefits from first-mover advantage with mobile-money payment integration that local competitors cannot easily replicate. These geographies provide revenue defensibility and upside in markets with lower capital competition than Western Europe."
    claimRefs: [CM006, CM010, CM011, CM031, CM032]

  - calloutType: risk
    title: EU Platform Work Directive Could Eliminate Bolt's Commission-Rate Competitive Moat
    body: "Bolt's central competitive advantage — a 15–20% driver commission versus the 30%+ industry norm — depends on drivers being classified as self-employed. The EU Platform Work Directive (effective 2026) creates a rebuttable employment presumption across EU member states. If Bolt cannot rebut this presumption, mandatory driver reclassification could raise labor costs by 20–30%, eliminating the commission advantage and requiring either price increases (reducing rider demand) or margin compression. The UK worker-classification ruling (under appeal) compounds this risk."
    claimRefs: [CM022, CM023, CM025]

  - calloutType: risk
    title: Wide TAM Definition Range Creates SAM Uncertainty
    body: "European ride-hailing TAM estimates span a 4× range ($18.4B to $64.3B) across published analyst reports due to inconsistent scope definitions. This range makes it impossible to precisely quantify Bolt's European market penetration, which varies from ~15% to ~58% depending on the TAM applied. Analysts and investors should apply scenario analysis across both definitions when modelling addressable revenue and evaluating Bolt's growth claims."
    claimRefs: [CM010, CM011, CM012, CM016, CM017]

  - calloutType: insight
    title: Food Delivery GMV Represents Only 2-3% of the European TAM — Strategic Question Mark
    body: "Despite operating Bolt Food since 2019, Bolt's estimated European food delivery GMV of ~€2.2B represents approximately 2–3% of the €83B European food delivery TAM. This either signals a large growth opportunity or raises a strategic question about whether Bolt can compete effectively against well-capitalised specialists such as Delivery Hero (Glovo) and Just Eat. Capital allocation between the high-penetration ride-hailing core and the nascent food delivery segment is a key strategic decision that investors should pressure-test in management diligence."
    claimRefs: [CM013, CM018, CM036, CM037]

