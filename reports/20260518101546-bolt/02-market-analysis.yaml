  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: european-ride-hailing-TAM
      missingEvidence: "Published European ride-hailing TAM estimates for 2026 span a 4× range ($18.4B narrow to $64.3B broad) due to inconsistent market definitions across analysts. No authoritative EU body publishes a standardised TAM figure."
      whyItMatters: "The 4× TAM range causes Bolt's European penetration estimate to swing from ~15% to ~58%, materially affecting growth headroom analysis and the narrative of whether Bolt is a growth story or a saturation story in its home market."
      diligencePath: "Request city-level trip data under NDA to build a bottom-up European TAM. Compare analyst scope definitions line by line. Cross-triangulate from Uber's disclosed European GMV in 20-F filings as an independent market anchor."
      relatedQuestionRefs: [QM002, QM006, QM017]

    - type: missing-source
      severity: material
      topic: bolt-segment-GMV-breakdown
      missingEvidence: "Bolt does not publicly disclose GMV or revenue by product segment (ride-hailing vs food delivery vs micromobility). The 82%/18% revenue split is a Sacra third-party estimate, not confirmed by Bolt management."
      whyItMatters: "Without verified segment-level GMV, penetration calculations for food delivery, micromobility, and corporate travel carry high uncertainty. Investors cannot independently assess whether Bolt Food is gaining or losing share."
      diligencePath: "Request segment-level GMV and revenue P&L under NDA during due diligence. Cross-check against country-level regulatory filings (UK Companies House, Estonia Business Register FY2025 accounts)."
      relatedQuestionRefs: [QM005, QM013]

    - type: private-evidence-only
      severity: material
      topic: city-level-GMV-concentration
      missingEvidence: "No public data identifies which specific European cities or countries drive the majority of Bolt's ride-hailing GMV. Top-10 city concentration is not disclosed in any public source."
      whyItMatters: "Heavy GMV concentration in a few markets (e.g. Tallinn, Bucharest, Warsaw) would increase geographic risk and reduce the credibility of the broad-TAM diversification narrative."
      diligencePath: "Request city-level GMV breakdown under NDA. Use SimilarWeb or Sensor Tower app-download data as a proxy for relative city penetration."
      relatedQuestionRefs: [QM018]

    - type: missing-source
      severity: material
      topic: EU-PWD-quantified-cost-impact
      missingEvidence: "The 20–30% driver cost uplift estimate for the EU Platform Work Directive is cited by industry analysts but no primary EU Commission study or official impact assessment has publicly quantified per-company cost impact specifically for Bolt."
      whyItMatters: "If driver reclassification costs are at the high end of the 20–30% range, the PWD could eliminate Bolt's commission-rate advantage and require market exits or structural price increases, materially altering the growth thesis."
      diligencePath: "Review EU Commission Impact Assessment SWD/2021/143 and member-state transposition legislation. Model Bolt-specific cost impact using known driver count and average earnings by market, request from Bolt under NDA."
      relatedQuestionRefs: [QM015]

    - type: missing-source
      severity: minor
      topic: africa-country-level-market-share
      missingEvidence: "Verified market-share percentages for Bolt in specific African countries (South Africa, Nigeria, Kenya) are not publicly available. Leadership claims are based on news coverage and analyst commentary, not audited market-share data."
      whyItMatters: "Africa is described as a strategic growth market but represents a small absolute GMV contribution; without verified share data, the 'market leadership' claim could be overstated and competitive risks from InDriver and local operators underestimated."
      diligencePath: "Request country-level Africa GMV under NDA. Check South African Competition Commission and Kenya Competition Authority filings for market concentration data."
      relatedQuestionRefs: [QM024]

    - type: stale
      severity: minor
      topic: market-sizing-freshness
      missingEvidence: "Most third-party market sizing studies used in this chapter are dated Q4 2025 to Q1 2026. No Q2 2026 European ride-hailing or food delivery TAM update has been identified; post-EU PWD implementation data does not yet exist."
      whyItMatters: "Market sizing can shift materially following regulatory changes (EU PWD effective 2026), economic conditions, and competitor exits; stale estimates may not reflect post-PWD market dynamics."
      diligencePath: "Monitor new report releases from Mordor Intelligence, 6WResearch, and Statista through Q3 2026. Flag any post-PWD market re-sizing studies as they become available."
      relatedQuestionRefs: [QM017]

    - type: missing-source
      severity: minor
      topic: food-delivery-competitive-share-Eastern-Europe
      missingEvidence: "No publicly available market share breakdown compares Bolt Food vs Delivery Hero/Glovo vs Just Eat Takeaway in Eastern European markets (Romania, Poland, Hungary) with quantified city-level data."
      whyItMatters: "Without competitive share data, the strategic value of Bolt Food's Eastern European position cannot be independently assessed; it may be material or marginal."
      diligencePath: "Commission independent delivery-market research for Eastern Europe. Review Delivery Hero investor disclosures for country-level GMV in shared markets."
      relatedQuestionRefs: [QM022]

