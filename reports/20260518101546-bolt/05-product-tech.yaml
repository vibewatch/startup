company:
  name: Bolt
chapter:
  number: 5
  title: Product and Technology
  summary: "Bolt's product is a multi-modal urban mobility super-app that serves consumers, drivers, and businesses across ride-hailing, food delivery, grocery, micromobility, car-sharing, and corporate travel verticals. The technology platform is built by approximately 4,000–4,200 engineers and operates across 50+ countries using a cloud-native, microservices architecture with proprietary routing and dynamic pricing models. Key differentiators include the super-app bundling of all verticals under one consumer identity, a 200M+ customer data flywheel that continuously improves dispatch and pricing algorithms, and a fleet of 100,000+ proprietary IoT-equipped scooters. AV partnerships with Stellantis and NVIDIA DRIVE Hyperion represent early-stage option value. Trust and safety infrastructure includes two-way rating, panic buttons, GDPR-compliant EU data storage, and mandatory background checks for all drivers."

sections:
  - id: product-definition-and-workflow
    title: Product Definition and Customer Workflow
    body: "Bolt's product is best understood as a real-time urban mobility and delivery coordination platform that operates in the final mile of consumer and business need fulfilment. From the consumer perspective, the Bolt app serves as a single touchpoint for any need to move, eat, or receive goods within a city. A consumer opens the app, selects a service (ride, food delivery, scooter, car rental, or groceries), the app matches them with an available driver, courier, or vehicle within seconds, facilitates the transaction, and completes the service — all within a single seamless flow. The ride-hailing workflow is fully on-demand: the consumer specifies pickup and destination, Bolt's dispatch algorithm matches the nearest available driver using proprietary routing, quotes a dynamic fare, and the consumer confirms or cancels in real-time. ETA accuracy is central to the consumer value proposition — Bolt's data models trained on 200M+ customer trips drive significantly more accurate estimated arrival times than simple distance-based calculations. For food delivery (Bolt Food), the workflow extends to restaurant discovery, menu browsing, cart management, order placement, real-time delivery tracking, and receipt/rating — a workflow comparable to Glovo or Uber Eats. Bolt Market (grocery) adds a rapid commerce dimension with dark store fulfilment optimised for 15–30 minute delivery. Bolt Drive (car-sharing) targets planned rather than spontaneous trips: consumers book a specific vehicle in advance, unlock it via the app using NFC or Bluetooth, drive, and return to a designated zone. For Bolt for Business, the corporate workflow integrates Bolt's API with enterprise expense management systems (e.g., SAP Concur, Expensify), enabling centralised corporate booking, invoice management, and travel policy compliance. This B2B integration reduces friction at the enterprise procurement level, creating operational stickiness that distinguishes corporate from consumer accounts. The driver and courier workflow is managed through a separate Driver app, which handles job assignment, routing instructions, earnings dashboards, and safety features including the panic button and trip-sharing."
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: product-module-map
    title: Product Module and Asset Map
    body: "Bolt's product portfolio comprises six distinct consumer-facing service modules, two operator-side applications, and a B2B integration layer — all orchestrated by a shared platform infrastructure. The primary modules are: Bolt Rides (ride-hailing, core product), Bolt Food (restaurant delivery), Bolt Market (grocery delivery via dark stores), Bolt Scooters and Bolt Bikes (micromobility rental), Bolt Drive (car-sharing subscription), and Bolt for Business (corporate travel management). Each module has its own product team, but all share the same consumer identity layer (single login, shared payment wallet, unified rating history), the same mapping and routing engine (Bolt has developed substantial in-house routing capabilities, though Google Maps SDK is used for some map rendering), and the same dynamic pricing infrastructure. Physical assets include the micromobility fleet of 100,000+ electric scooters and e-bikes deployed across 30 EU cities. Each scooter is equipped with proprietary IoT hardware (cellular module, GPS, accelerometer, tamper detection) that enables remote locking/unlocking, geofencing enforcement for parking compliance, battery monitoring, and real-time telemetry. The IoT firmware is managed by Bolt's hardware engineering team; scooter units are manufactured by third-party OEMs (primarily Chinese suppliers), but the IoT module is Bolt-specified. Bolt Drive maintains a smaller fleet of shared cars in select cities, managed through third-party fleet management systems. The two operator-facing applications are the Bolt Driver App (iOS and Android for ride-hailing/delivery drivers) and the Bolt Courier App (Android-optimised for food/grocery couriers). The Bolt for Business API represents the B2B integration layer — a RESTful API documented at developer.bolt.eu that allows enterprise systems to create, manage, and invoice rides on behalf of employees without requiring individual consumer accounts."
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011, CE012]
    tableRefs: [TE001]
    figureRefs: []

  - id: architecture-and-operating-model
    title: Technology Architecture and Operating Model
    body: "Bolt's technology platform is a cloud-native, microservices-based system deployed on major cloud providers (AWS and GCP). The architecture is structured around several core domains: identity and authentication (single sign-on across all verticals), mapping and routing (hybrid system combining Google Maps SDK for rendering with proprietary routing algorithms), dispatch and matching (real-time assignment of drivers/couriers to orders), dynamic pricing (surge pricing, yield management), payment processing (multi-currency, multi-method including card, mobile money, and digital wallets), and data analytics (real-time trip and order data feeding ML models). The backend is primarily built on Go and Python microservices, with a strong emphasis on low-latency dispatch (sub-200ms matching decisions). Mobile apps are built natively: Kotlin for Android, Swift for iOS, with shared business logic layers for code reuse. The data flywheel is Bolt's most strategically significant technical asset: every completed trip adds to training datasets for ETA prediction, demand forecasting, dynamic pricing calibration, and driver supply optimisation. With 200M+ lifetime customers and 4.5M+ driver/courier partners across 850+ cities, Bolt's data advantage — particularly for the Eastern European and African city contexts that larger global platforms have less coverage on — creates a compounding improvement in service quality. Bolt's routing and mapping capabilities include proprietary layers for real-time traffic, scooter geofencing zones, and city-specific regulations (e.g., low emission zones, pickup/drop restrictions), giving it operational advantages over relying solely on third-party mapping APIs. The fleet operations system for micromobility uses IoT telemetry data to manage scooter battery levels, parking compliance, maintenance scheduling, and demand redistribution — all controlled through a dedicated fleet management dashboard. Autonomous vehicle integration is planned through the Stellantis partnership (Dec 2025) for deploying driverless vehicles on the Bolt platform, and the NVIDIA DRIVE Hyperion platform (Mar 2026) for AV stack scalability; both are early-stage with no commercial deployment timeline confirmed."
    claimRefs: [CE013, CE014, CE015, CE016, CE017, CE018, CE019, CE020]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: differentiation-and-ip
    title: Technology Differentiation, IP, and Data Advantages
    body: "Bolt's technology differentiation rests on four pillars: the super-app platform moat, the data flywheel, proprietary IoT hardware/firmware, and AV option value. The super-app moat is primarily a product and operational achievement rather than a pure technology one: no European-originated competitor has combined Bolt's six verticals under a single consumer identity and payment wallet at continental scale. This bundling creates data advantages — a user's food delivery behaviour informs demand patterns that improve ride-hailing dispatch, and vice versa — that single-vertical competitors cannot replicate. The data flywheel is Bolt's deepest technical moat: the routing, pricing, and matching algorithms are trained on city-specific historical data across 850+ cities, many of which have sparse coverage in global mapping products. In cities like Tallinn, Warsaw, Bucharest, and Nairobi, Bolt's models have been trained on more local trip data than any competitor, creating incremental ETA and pricing accuracy advantages that compound over time. No patents covering Bolt's routing or pricing algorithms have been publicly disclosed; protection relies on trade secrets, data exclusivity, and the practical difficulty of replicating multi-year training sets. The IoT hardware for micromobility represents a moderate proprietary advantage: while the scooter chassis is sourced from OEMs, the IoT module specification, firmware, and fleet management software are proprietary. This gives Bolt control over the complete software layer for its physical fleet, enabling features such as remote diagnostics, predictive maintenance, and geofencing compliance that depend on vertical integration of hardware and software. AV partnerships with Stellantis and NVIDIA DRIVE Hyperion provide option value for the transition to autonomous fleet operations if AV technology matures commercially. These partnerships are not yet commercially deployed; they represent strategic positioning rather than current technological differentiation. Bolt's open developer API for B2B integration represents a network-effect amplifier: each enterprise integrating Bolt's API into its ERP creates switching costs and reduces the likelihood of employee-level multi-homing in the corporate segment."
    claimRefs: [CE021, CE022, CE023, CE024, CE025, CE026, CE027]
    tableRefs: []
    figureRefs: [FE003, FE004]

  - id: trust-safety-security-compliance
    title: Trust, Safety, Security, Privacy, and Compliance
    body: "Trust and safety are operationally central to Bolt's business model: its marketplace economics depend on consumers and drivers trusting that the platform will facilitate safe, reliable, and fraud-free transactions. The primary consumer safety features include two-way post-trip ratings (driver rates passenger; passenger rates driver), panic button (in-app emergency contact with real-time location sharing to emergency services or trusted contacts), trip sharing (share live trip progress with friends or family), mandatory driver identity and background check at onboarding, and vehicle licence plate verification. Driver safety features include fare protections, in-app messaging to avoid direct phone number sharing, and the ability to report aggressive passenger behaviour. All background check and identity verification requirements are country-specific; in EU markets, Bolt complies with local transport licensing laws and often goes beyond minimum requirements to maintain operating licences. On data privacy, Bolt is subject to the EU General Data Protection Regulation (GDPR) across all 27 EU member states, as well as the UK GDPR post-Brexit. Bolt stores EU customer data in EU-based data centres, satisfying GDPR data residency requirements. Bolt's data processing operations across 200M+ customers constitute one of the largest GDPR-regulated datasets in European mobility; any significant breach could result in fines of up to 4% of global annual turnover (≈€120M+ at FY2024 revenue). Cybersecurity is managed by a dedicated information security team; no major disclosed breach has been reported as of May 2026. Bolt maintains PCI-DSS compliance for payment card processing across all markets. In micromobility, Bolt complies with city-specific permit and operating requirements, including geofencing zones, maximum fleet size caps, parking requirements, and safety certification for scooter hardware. Regulatory compliance across 50+ countries is managed by dedicated local legal and public affairs teams, with a centralised compliance function overseen by Bolt's Chief Legal Officer. The NVIDIA DRIVE Hyperion AV partnership will require additional regulatory compliance as autonomous vehicle regulations evolve across the EU."
    claimRefs: [CE028, CE029, CE030, CE031, CE032, CE033, CE034, CE035]
    tableRefs: [TE004, TE005]
    figureRefs: []

