callouts:
  - id: KE001
    calloutType: strength
    title: "Super-App as Structural Product Moat"
    body: "Bolt is the only European-originated platform to have commercially deployed all six mobility and delivery verticals under one consumer identity. This bundling creates data cross-pollination, reduces per-user CAC, and builds habitual app usage patterns that competitors cannot replicate without equivalent multi-vertical investment."
    claimRefs: [CE021, CE022]

  - id: KE002
    calloutType: strength
    title: "Data Flywheel in Underserved City Markets"
    body: "Bolt's 200M+ trip dataset from Eastern European and African cities — where global mapping products have less coverage — creates a compounding accuracy advantage in dispatch, ETA, and dynamic pricing that is practically difficult for newer entrants to replicate without years of operational history in the same markets."
    claimRefs: [CE014, CE023]

  - id: KE003
    calloutType: risk
    title: "Google Maps Dependency in Routing"
    body: "While Bolt has invested in proprietary routing, it still relies on the Google Maps Platform SDK for map rendering — a third-party dependency that carries vendor risk, API cost exposure (potentially $100M+ annually at Bolt's scale), and strategic risk if Google Maps terms change or if Google integrates Uber more deeply."
    claimRefs: [CE016, CE025]

  - id: KE004
    calloutType: risk
    title: "AV Partnerships Are Option Value, Not Current Differentiation"
    body: "Bolt's Stellantis and NVIDIA DRIVE Hyperion partnerships are early-stage and have no confirmed commercial deployment timeline. While they signal strategic direction, they do not represent current technological differentiation and cannot be weighted significantly in a 2026 investment decision."
    claimRefs: [CE019, CE020, CE026, CE027]

  - id: KE005
    calloutType: recommendation
    title: "Request Technical Due Diligence Documentation"
    body: "Key technical diligence items include: (1) architecture review of dispatch engine reliability and scalability; (2) data platform maturity assessment (data quality, model accuracy metrics); (3) IoT platform security audit; (4) Google Maps API cost structure and any contractual protections; and (5) AV partnership terms, milestones, and exit rights."
    claimRefs: [CE015, CE016, CE025]

