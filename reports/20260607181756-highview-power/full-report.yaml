      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The real market is policy-defined UK flexibility, not a generic global storage TAM
            body: >-
              The broad global LDES story is large enough to support impressive slides, but the underwritable market for
              Highview is the UK subset where policy, duration thresholds, and grid-stability needs are explicit. That
              is why official UK targets and Ofgem process milestones matter more than the $1 trillion global headline.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM034
              - CM035
              - CM036
          - type: callout
            title: Lithium-ion is the default 8-12 hour benchmark Highview must beat or avoid
            body: >-
              Battery deployment scale, LFP dominance, and falling pack and system costs mean the mainstream 8-12 hour
              market is not waiting for LAES. Highview either has to win nodes that value duration plus stability plus
              locational flexibility, or secure policy-backed carve-outs where non-lithium assets can clear despite
              lower efficiency and higher project complexity.
            calloutType: risk
            claimRefs:
              - CM020
              - CM021
              - CM026
              - CM027
              - CM028
              - CM045
          - type: callout
            title: Highview’s best-fit niche is a hybrid storage-plus-stability platform at constrained nodes
            body: >-
              Carrington’s spec sheet is revealing: the market case is not just six hours of discharge, but also inertia
              and reactive power at a strategic demand-center location. If that multi-service value stack is real and
              repeatable, Highview has a more defendable position than a pure-duration comparison against batteries
              would suggest.
            calloutType: insight
            claimRefs:
              - CM009
              - CM011
              - CM031
              - CM042
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Procurement Benchmark
        blocks:
          - type: paragraph
            body: >-
              Highview’s relevant competitive set is broader than other cryogenic-storage developers. Buyers can solve
              the same reliability problem with infrastructure-style mechanical systems such as Hydrostor’s A-CAES or
              Energy Dome’s CO2 Battery, multiday electrochemical systems such as Form’s iron-air platform,
              daily-cycling flow systems from Invinity or ESS, incumbent lithium-ion projects sold by Tesla-class
              suppliers and integrators such as Fluence, or pumped hydro where geography allows. Procurement therefore
              turns less on whether a technology is technically novel and more on whether it can clear bankability,
              duration, siting, and system-services requirements at an acceptable risk-adjusted cost. Highview does have
              a differentiated bundle: its current UK projects combine long-duration storage with synchronous stability
              services, inertia, voltage support, and reactive power. But that bundle only matters when the node
              actually values those services. In any mainstream 8-12 hour tender where buyers mainly want the cheapest
              well-understood capacity, lithium-ion remains the default benchmark that Highview must either beat, avoid,
              or out-policy.
