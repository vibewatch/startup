  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Highview’s current public materials point to an infrastructure monetization model rather than a simple
              equipment-sale model. The company’s projects, infrastructure, and strategic-investment pages all describe
              a business that develops, finances, builds, owns, and operates long-duration storage and grid-stability
              assets, while also keeping open future monetization through capital recycling, licensing, analytics, and
              “Clean Energy as a Service.” In practical terms, that means Highview appears to earn value by winning
              project sites, structuring capital, constructing assets, and then monetizing a stack of grid services over
              decades, not by publishing a repeatable list price for a battery-like SKU. The monetization stack itself
              is partly visible: Carrington and Hunterston are framed as assets that combine energy shifting with
              synchronous inertia, reactive power, voltage support, short-circuit strength, and frequency services;
              Centrica’s disclosed future energy-optimisation rights hint that dispatch and optimization economics
              matter too. What is missing is the commercial layer that equity underwriters usually want most. There is
              no public tariff card, no per-MWh realized pricing, no disclosed utilization rate, and no public breakdown
              of how much revenue should come from regulated support, merchant arbitrage, ancillary services, licensing,
              or analytics. So the model is legible as infrastructure, but still opaque as a revenue engine.
