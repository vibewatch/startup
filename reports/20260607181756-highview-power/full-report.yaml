      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final diligence agenda is therefore straightforward and unforgiving. First, investors need the current
              cap table and every material term document: convertible instruments, partner rights, project-level debt
              security, liquidation preferences, and any reserved matters that could subordinate new money. Second, they
              need the commercial model for Carrington and Hunterston in numbers rather than marketing language:
              expected revenue mix, contracted versus merchant exposure, utilization assumptions, floor or cap support,
              and operating KPIs tied to commissioning. Third, they need ordinary corporate financials that private
              companies often withhold from the public record but that are essential here: current revenue, margin,
              overhead burden, and burn. Without those three buckets, a valuation opinion is really just a sentiment
              score. The thesis also has visible break points. A major schedule slip at Carrington, a poor cap-and-floor
              outcome, or a financing package that heavily favors incumbent insiders over new common equity would each
              degrade the case quickly. The right public stance is not hostility; it is conditionality backed by
              explicit milestone and term-sheet thresholds.
