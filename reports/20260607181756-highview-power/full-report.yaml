  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Stack and Residual Exposure
        blocks:
          - type: paragraph
            body: >-
              The risk picture is concentrated rather than diffuse. Carrington matters because it is the first
              commercial-scale proof point, and the entire UK roll-out narrative still depends on showing that one
              integrated liquid-air plant can commission, stabilise the local grid, and then translate its engineering
              story into repeatable economics. That makes FOAK delivery the top risk even before policy and competition
              are considered. The second ranked risk is revenue-framework dependence: government consultation papers
              explicitly say long-duration storage has struggled to deploy at scale under current market structures, and
              Highview's next major UK projects still depend on Ofgem and NESO progressing cap-and-floor assessment to
              final award. Third comes project concentration: public traction remains tied mainly to Carrington and
              Hunterston rather than to a broad installed fleet. Fourth is disclosure risk: public filings and partner
              releases still leave unit economics, contract terms, and shareholder-right details thin. Fifth is
              lithium-ion competitive pressure, because cheaper and more bankable 8–12 hour battery projects can absorb
              policy support before LAES becomes repeatable. The mitigants are real but still pre-proof: mature
              components, staged stability-island deployment, policy support, and strong capital partners all help, yet
              residual exposure stays high until commissioning and bankable revenue evidence arrive.
            claimRefs:
              - CR001
              - CR006
