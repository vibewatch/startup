  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Carrington misses a credible energization window
        - Meaningful slip without transparent revised KPI path
        - Removes the cleanest route from financing proof to operating proof.
        - Freeze valuation optimism and reassess the entire commercialization timeline.
      - - Hunterston or other UK projects fail to advance through cap-and-floor support
        - Material policy delay or negative award outcome
        - Weakens bankability and raises probability of dilutive holdco financing.
        - Reduce bull-case weight and assume harsher financing terms.
      - - Lithium-ion economics keep undercutting alternative storage in 2026 tenders
        - Mature battery systems keep winning the economic center of gravity for 8-hour use cases
        - Narrows the addressable window where LAES can command premium economics.
        - Demand node-specific proof that Highview wins where batteries do not.
      - - Preference stack is worse than public clues suggest
        - Convertible, debt, or partner rights materially subordinate new common equity
        - Even strong project execution may not flow through to common-equity upside.
        - Do not invest without term-sheet protection or price reset.
      - - No current financial disclosure emerges during diligence
        - Revenue, margin, and burn remain opaque even in private workstreams
        - Valuation remains a narrative exercise instead of an underwriting exercise.
        - Maintain research-more or move to avoid.
      - - Exit path remains hypothetical after first-project proof
        - No repeat-site financing, strategic interest, or fleet metrics after Carrington
        - The story becomes one exceptional project rather than a scalable platform.
        - Cap position sizing and hold for proof, not for narrative upside.
    notes: >-
