      - number: '8.3'
        title: Scenario analysis and relative range
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is the right tool precisely because absolute valuation data are missing. In the bull
              case, Carrington energizes on a believable timeline, Hunterston progresses through cap-and-floor support,
              and Highview converts its current financing credibility into repeatable project-level or
              infrastructure-style capital rather than a fresh, expensive holdco equity round. In that world, the
              company deserves a stronger valuation-support index because the market would finally have proof that LAES
              can move from construction narrative to operating asset class. The base case is less dramatic and probably
              more realistic today: Carrington makes partial progress, policy support moves but not cleanly, and public
              revenue disclosure still lags, leaving valuation support ambiguous and ownership terms highly relevant.
              The bear case is easy to articulate and hard to dismiss. Lithium-ion keeps getting cheaper, 2026 tenders
              favor mature battery platforms, Carrington or Hunterston slip, and Highview has to finance through
              dilution or preferred structures before operating cash flow is proven. That combination would not mean the
              technology is worthless, but it would weaken the equity case sharply.
            claimRefs:
