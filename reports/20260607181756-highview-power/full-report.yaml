        - id: n1
          label: Excess renewable generation
          description: Wind or solar output exceeds contemporaneous demand and the grid faces curtailment pressure.
        - id: n2
          label: Charge and liquefy air
          description: The plant cleans, dries, compresses, cools, and liquefies ambient air using electricity.
        - id: n3
          label: Store liquid air
          description: Liquid air sits in insulated low-pressure tanks until the system needs energy or stability support.
        - id: n4
          label: Recover heat and cold
          description: Thermal stores and cold recycle loops improve process efficiency and site integration value.
        - id: n5
          label: Discharge electricity
