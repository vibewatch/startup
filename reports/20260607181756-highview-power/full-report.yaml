      - number: '7.3'
        title: Regulatory, Legal, and Counterparty Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Highview's regulatory risk is unusually close to its commercial risk. The UK government says LDES has
              struggled to deploy under current market frameworks, which is why cap-and-floor exists at all; that is
              supportive policy, but it is also direct evidence that the market has not yet validated this asset class
              unaided. Hunterston and Killingholme are still moving through eligibility and customer-benefit assessment,
              so timing remains exposed to Ofgem and NESO process risk. Legal disclosure is also thinner than a
              public-markets investor would want. Companies House records do reveal useful facts — including a
              controlling parent, a May 2026 board change, dormant-company accounts at Highview Power Limited through
              August 2025, and zero registered charges at that specific entity page — but those disclosures still do not
              answer the harder underwriting questions around project-SPV security, intercreditor terms, liquidation
              preferences, or partner veto rights. Counterparty concentration compounds this. Centrica has explicit
              future equity-participation and energy-optimisation rights; UKIB or NWF, SNIB, Goldman, KIRKBI, and Mosaic
              recur as the visible capital stack; and specialist delivery still leans on SHI FW and Sulzer. The net
              effect is a dependency graph in which regulation, financing, and a small partner set can all delay
              scale-up simultaneously.
