  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Highview competes in a narrow but important market: grid-scale long-duration flexibility for a
              decarbonizing power system, not the generic global battery market. The included spend is development,
              financing, construction, and operation of 8-hour-plus storage platforms plus the grid-stability services
              that sit around them, such as inertia, reactive power, voltage support, and curtailment reduction. That
              matters because Highview is not merely selling stored megawatt-hours; its official materials position
              Carrington and the broader UK programme as hybrid infrastructure that combines energy shifting with
              synchronous system services. The UK cap-and-floor scheme reinforces that boundary by screening for
              projects that can deliver at least eight hours of full-power output, which excludes the bulk of today’s
              short-duration battery fleet from the core policy-backed pool.


              The excluded and substitute buckets are equally important. Short-duration 2-4 hour BESS remains the main
              adjacent market and the strongest incumbent in 8-12 hour competition, but it is still a different
              procurement category from cap-floor-backed 8-hour-plus assets. Pumped hydro and compressed-air storage are
              the long-duration benchmarks where geography works, while gas peakers, curtailment payments, and
              standalone synchronous support equipment remain the status quo ways to solve fragments of the same
              reliability problem. Highview’s most relevant market is therefore the subset of nodes where long life,
              flexible siting, and stability services matter more than raw battery efficiency or commoditized pack
              pricing.
            claimRefs:
              - CM001
              - CM003
              - CM008
              - CM009
              - CM011
              - CM038
              - CM040
              - CM044
