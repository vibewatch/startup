      - number: '6.4'
        title: Concentration and Procurement Risk Remain the Main Adverse Lens
        blocks:
          - type: paragraph
            body: >-
              The adverse case is straightforward. Public commercial progress is concentrated in a small number of very
              large UK projects, and those projects still depend on long procurement cycles, technical qualification,
              and public-policy support. Ofgem and NESO still have to complete customer-benefit analysis and
              cap-and-floor decisions for Hunterston and Killingholme. NESO’s own 2026 stability-market results also
              show how demanding the route to grid-services monetization remains: five contracts for 7.3 GVA.s of
              inertia were awarded in Round 2, while independent coverage said no battery storage bids cleared the
              technical bar and that synchronous condensers and gas assets captured the awards. That does not directly
              invalidate Highview’s thesis, but it shows that the market is conservative, technical thresholds can
              tighten, and novel storage assets must clear demanding studies before they monetize. Combined with thin
              named-customer disclosure and the concentration of visible progress in Carrington and Hunterston, that
              creates a customer chapter defined more by underwriting questions than by broad account diversification.
              Highview may still win big if these flagship projects perform, but today the commercial story is
              concentrated, policy-mediated, and slow-moving.
            claimRefs:
