  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision chain from project proof and market need through policy dependence and disclosure gaps to a research-more
      call.
    data:
      nodes:
        - id: market
          label: Market need
          type: input
          detail: LDES policy attention and genuine grid need remain real.
        - id: proof
          label: Financing proof
          type: process
          detail: Carrington and Hunterston show counterparties will fund first projects.
        - id: competition
          label: Competition pressure
          type: process
          detail: Lithium-ion cost compression narrows the economic window for alternatives.
        - id: policy
          label: Policy dependence
          type: process
          detail: Cap-and-floor and other support remain central to bankability.
        - id: disclosure
          label: Disclosure gap
          type: process
          detail: No current revenue, valuation, or preference waterfall is public.
        - id: decision
          label: 'Recommendation: research-more'
          type: output
          detail: Stay engaged, but underwrite on milestones and terms rather than narrative.
      edges:
        - from: market
          to: proof
          label: supports interest
        - from: proof
          to: competition
          label: not enough on its own
        - from: competition
          to: policy
          label: raises hurdle
        - from: policy
          to: disclosure
          label: makes terms matter
        - from: disclosure
          to: decision
          label: keeps call cautious
        - from: proof
          to: decision
          label: keeps diligence alive
    approximationNotes: >-
      This is an investment-committee logic chain, not a mechanical model. It compresses multiple public facts into the
      minimum decision gates that still matter.
    claimRefs:
      - CV006
      - CV015
      - CV028
      - CV029
      - CV033
      - CV034
      - CV035
      - CV045
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: Relative valuation-support score as project and policy milestones accumulate.
    data:
      items:
        - label: Carrington slip + policy delay
          value: 15
          detail: Minimal support for current pricing aspirations; recap risk rises.
        - label: Carrington on time, no clear policy win
          value: 35
          detail: Proof improves, but financing and revenue quality still lack support.
        - label: Carrington + Hunterston phase-one progress
          value: 50
          detail: Two flagship assets improve credibility, but valuation remains term-sensitive.
        - label: Add cap-and-floor clarity + revenue disclosure
          value: 70
          detail: Public evidence starts to support stronger underwriting rather than narrative.
        - label: Add repeat project financing and fleet path
          value: 85
          detail: This is the first point where a premium infrastructure-style view becomes plausible.
    approximationNotes: >-
      Scores are qualitative support scores out of 100, not dollar values. They show how much incremental valuation
      confidence each milestone could add.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV036
      - CV037
      - CV038
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Relative financing-outcome range using 100 as a hypothetical flat round versus the last undisclosed private
      reference.
    data:
      items:
        - label: Bear financing outcome
          low: 40
          mid: 60
          high: 80
          unit: index
          note: Down-round to heavily structured outcome if milestones disappoint.
        - label: Base financing outcome
          low: 80
          mid: 100
          high: 120
          unit: index
          note: Flat or mildly improved outcome if progress is mixed and metrics stay thin.
        - label: Bull financing outcome
          low: 120
          mid: 150
          high: 180
          unit: index
          note: Up-round or stronger strategic/infrastructure mark after operational de-risking.
        - label: Current public-evidence envelope
          low: 60
          mid: 100
          high: 140
          unit: index
          note: Wide range because price, revenue, and preferences are still under-disclosed.
    approximationNotes: >-
      Index values are not USD and do not pretend to know the current private price. They are a disciplined way to
      express scenario dispersion while the real denominator is undisclosed.
    claimRefs:
      - CV033
      - CV036
      - CV037
      - CV038
      - CV041
      - CV042
      - CV043
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: IC-style scorecard showing why the opportunity is interesting but not yet priceable on public evidence.
    data:
      items:
        - label: Market tailwind
          value: 4/5
          detail: System need and policy attention for LDES are real.
        - label: Project proof
          value: 3/5
          detail: Financing and construction proof exist, but steady-state operations do not.
        - label: Competitive defensibility
          value: 2/5
          detail: LAES has differentiated duration and system-service angles, but lithium-ion remains the benchmark.
        - label: Disclosure quality
          value: 1/5
          detail: Current revenue, valuation, and preference stack are not public.
        - label: Financing access
          value: 3/5
          detail: Public and strategic capital support is real, but likely structured.
        - label: Valuation clarity
          value: 1/5
          detail: The public record cannot anchor a clean price view.
        - label: Exit readiness
          value: 1/5
          detail: No fleet metrics or clear public-market path are visible yet.
    approximationNotes: >-
      Scores are qualitative committee shorthand rather than quantitative outputs; they summarize what the public record
      can and cannot prove as of 2026-06-07.
    claimRefs:
      - CV020
      - CV021
      - CV026
      - CV039
      - CV040
      - CV044
      - CV045
