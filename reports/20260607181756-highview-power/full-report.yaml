    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product positioning, and business model shift
        blocks:
          - type: paragraph
            body: >-
              Highview’s current public materials describe the company less as a component vendor and more as a
              solutions-led energy infrastructure business. The homepage, company page, and infrastructure page
              collectively say the company develops, finances, builds, and operates grid-scale energy infrastructure,
              using a proprietary R2X analytics platform plus a portfolio of technologies to solve system-level problems
              for governments, grid operators, and enterprises. That matters for diligence because it implies value
              creation is expected to come from project origination, financing, asset ownership, and grid-services
              monetization rather than from selling a standardized battery box. Highview’s flagship proprietary
              technology remains liquid air energy storage, marketed as a patented long-duration platform that can store
              electricity for hours, days, or weeks while also supplying stability services. The projects page broadens
              that position further by framing Carrington, Hunterston, and the broader UK programme as integrated
              infrastructure platforms that combine long-duration storage and grid-stability functions. The present
              corporate story is therefore an infrastructure-developer thesis anchored by LAES, not just a cryogenic
              hardware thesis.
