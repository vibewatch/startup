      - number: '3.3'
        title: Economics, Bankability, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence across this landscape is thin, so the real comparison is economic posture rather
              than apples-to-apples customer price. Highview’s posture is infrastructure-led: a £300 million Carrington
              financing anchored by the National Wealth Fund and Centrica, then another £130 million for Hunterston,
              signals that the company can attract state-backed and strategic capital before a broad operating fleet
              exists. That is a meaningful strength against battery startups that still need to finance manufacturing
              ramps. Energy-Storage.News explicitly argues that mechanical-storage vendors benefit from off-the-shelf
              components and avoid some of the capital intensity that weighs on novel battery companies. Yet Highview
              does not own the cost-leadership narrative. Energy Solutions still places early-commercial LAES around
              $120-200/MWh with 50-65% efficiency, while Energy Dome publicly markets a more favorable efficiency and
              capex story and Fluence still sets the bankability benchmark through scale, services, and public-company
              disclosure. Highview looks financeable for infrastructure investors, but not obviously cheaper or easier
              to buy than the incumbent battery stack.
