      - number: '1.5'
        title: Founding history, IP base, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The founding narrative is directionally clear but not perfectly clean. Third-party profiles on Tracxn and
              Climatebase both date Highview to 2005 and place the company in London, while current official materials
              avoid giving a precise founding date and instead emphasize 15 to 17 years of innovation. Companies House
              also surfaces a dissolved entity called HIGHVIEW POWER STORAGE LIMITED with a 2009 incorporation number
              and limited readable filing context, implying that the commercial, IP, and legal history may run across
              more than one entity. For underwriting purposes, that does not negate the core point that Highview has
              spent well over a decade developing cryogenic storage know-how. Patent listings assigned to Highview
              Enterprises Limited show continuing protection around heat-of-compression, pressure control, power
              recovery, and broader cryogenic system architecture through 2025, while the 2024 thermodynamic analysis
              paper says Highview’s pilot plant is the only LAES system with public test data. The key unresolved issues
              are therefore not whether there is substantive technology, but whether investors can cleanly map legal
              entities, present-day board rights, private valuation, revenue generation, and the conversion of an
              impressive pipeline into repeatable operating assets.
