  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Grid-Operator Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Highview sells a grid asset rather than a battery pack SKU. In customer workflow terms, the buyer is a
              system operator, utility, infrastructure investor, or large industrial power user that needs to absorb
              excess renewable generation, reduce curtailment, hold energy for later dispatch, and strengthen local grid
              stability without relying on fossil peakers. During charging, the plant uses electricity to draw in
              ambient air, clean and dry it, then compress and refrigerate it until it liquefies. The liquid air is held
              in insulated tanks at low pressure as the energy reservoir. When the grid needs support, the liquid is
              pumped to high pressure, heated, turned back into gas, and expanded through turbines to export
              electricity. Highview positions the same platform to add synchronous inertia, reactive power, voltage
              support, short-circuit strength, reserves, and black start. That makes the customer workflow closer to
              procuring a long-life flexibility-and-stability plant at a constrained node than buying a pure arbitrage
              battery. Carrington is the first commercial expression of that workflow, while Hunterston extends it into
              a hybrid stability-plus-storage platform.
