      - number: '1.3'
        title: Funding history, investor mix, and capital structure signals
        blocks:
          - type: paragraph
            body: >-
              The retained record supports a stepwise financing story tied directly to project delivery. In 2020,
              Sumitomo Heavy Industries invested US$46 million and positioned Sumitomo SHI FW as a technology hub for
              global CRYOBattery deployment, a transaction that looked more like strategic industrial validation than
              simple venture funding. The 2024 Carrington financing marked a much bigger transition. Highview announced
              a £300 million investment package led by UK Infrastructure Bank and Centrica, with Rio Tinto, Goldman
              Sachs, KIRKBI, and Mosaic Capital also participating. National Wealth Fund materials specify that UKIB’s
              commitment was £165 million, while Centrica disclosed a distinct structure: £25 million of convertible
              debt at the holding company and £45 million of project debt at Carrington. That disclosure is valuable
              because it shows Highview increasingly finances through blended holdco and project capital rather than
              equity alone. In November 2025 the company announced another £130 million round for Hunterston phase one
              involving Scottish National Investment Bank, Centrica, Goldman Sachs, KIRKBI, and Mosaic. Public sources
              therefore support more than £500 million secured for commercialization, but not a clean current cap table,
              valuation, or shareholder-rights schedule.
