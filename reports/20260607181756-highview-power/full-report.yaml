  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Highview’s public customer journey runs from system need and policy fit to financing, first stability service, and
      only then full storage expansion.
    data:
      nodes:
        - label: Grid need identified
          detail: >-
            A constrained UK node or system operator identifies curtailment, inertia, or flexibility shortages that a
            long-duration asset could solve.
          tone: neutral
        - label: Policy and market fit
          detail: >-
            Developer aligns the project to cap-and-floor rules, NESO system needs, and deliverability tests rather than
            to a simple one-buyer purchase order.
          tone: neutral
        - label: Anchor capital formation
          detail: >-
            Public and private capital providers such as NWF/UKIB, SNIB, Centrica, and financial investors fund the
            project company.
          tone: positive
        - label: Site engineering and host alignment
          detail: >-
            Brownfield siting, transmission access, and project staging are agreed before the full storage plant is
            commissioned.
          tone: neutral
        - label: First stability-service operation
          detail: >-
            A stability island can reach first service and demonstrate grid value before the full LAES or hybrid
            platform is operational.
          tone: positive
        - label: Full storage deployment and optimization
          detail: >-
            Only after successful commissioning does the model expand into repeat sites, optimization rights, and wider
            portfolio rollout.
          tone: positive
    claimRefs:
      - CU001
      - CU007
      - CU013
      - CU027
      - CU028
      - CU040
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      The public commercialization path is sequential and policy-mediated: system need, eligibility, financing, first
      stability service, and then full storage revenue.
    data:
      nodes:
        - id: n1
          label: System need and site thesis
          description: >-
            Highview identifies a UK node where curtailment, flexibility shortages, or stability needs justify a
            project.
        - id: n2
          label: Cap-and-floor / policy screen
          description: >-
            Hunterston and Killingholme move through Ofgem eligibility and NESO customer-benefit analysis before final
            support decisions.
        - id: n3
          label: Financing close
          description: >-
            Carrington and Hunterston rely on consortium capital rather than on a single named customer prepaying the
            full asset.
        - id: n4
          label: Stability island first service
          description: >-
            Phase-one grid-support assets can begin delivering inertia, short-circuit, and voltage support ahead of full
            storage.
        - id: n5
          label: Full LAES / hybrid asset
          description: The broader storage plant enters service only after a longer construction and qualification period.
        - id: n6
          label: Portfolio expansion
          description: >-
            Only successful commissioning and market fit can convert flagship projects into a repeatable UK site
            portfolio.
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CU007
      - CU013
      - CU021
      - CU027
      - CU038
      - CU039
