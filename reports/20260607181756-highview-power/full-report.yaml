      - number: '7.4'
        title: Financial Model Risk, Competition, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The financial-model risk is that Highview still looks like a project-development platform whose economics
              have to be inferred rather than observed. Public capital formation is impressive, but it is also highly
              concentrated and heavily intertwined with policy-backed or strategic investors. MIT's work is a useful
              external check because it argues that subsidy design can matter more than engineering efficiency in making
              LAES investable, implying that a technically sound plant may still struggle if the policy bridge weakens.
              At the same time, lithium-ion keeps getting cheaper and more dominant in the exact duration bands where
              Highview wants to prove relevance. Energy-Storage.news reports both falling BESS system prices and a 70%
              or greater share for long-duration lithium-ion in the 2030 pipeline, with 2026 tenders likely to decide
              whether non-lithium vendors can keep pace. That does not mean Highview cannot win; it means the win
              condition is narrow and monitorable. The thesis is intact only if Carrington commissions within a
              believable revised window, if Hunterston wins or clearly progresses through cap-and-floor, if management
              starts publishing usable operating and revenue evidence, and if Highview can show that LAES creates value
              at nodes where batteries or pumped alternatives are structurally weaker. If those proof points slip
              together, the equity story breaks quickly.
