      - number: '7.2'
        title: Technology, Commissioning, and Operational Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Highview's key technology risk is not that compressors, pumps, tanks, or turbines are individually exotic;
              it is that the first commercial LAES plant has to make the whole cryogenic system work together at grid
              scale with acceptable efficiency, reliability, and schedule discipline. Independent reviews remain
              constructive but not forgiving. Energy Solutions puts practical round-trip efficiency at roughly 50% to
              65% and says early commercial LCOS can land around US$120–200/MWh, while the pv magazine cold-storage
              review says cryogenic cold losses can dominate overall performance and that experimentally validated,
              scalable designs still matter more than elegant simulations. Sulzer's own Carrington package description
              is helpful and adverse at the same time: it confirms Highview is using credible industrial suppliers, but
              also says the project must integrate cryogenic and molten-salt systems efficiently and carries a 14-month
              manufacturing and delivery window. SHI FW's turnkey-license page likewise supports the case that Highview
              can lean on established EPC capability, but it also shows how concentrated that capability is. The
              practical underwriting implication is simple: mature components reduce science risk, but they do not
              remove integration, lead-time, controls, or commissioning risk, and no retained public source yet gives
              commercial availability, SLA, or measured Carrington RTE data.
