- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Air cleaning and purification
    - Removes moisture and contaminants before deep cooling
    - Adsorption and purification hardware must regenerate reliably
    - Impurity breakthrough can damage cold-box performance and downstream equipment
  - - Compression and liquefaction train
    - Uses electricity to compress, cool, expand, and liquefy ambient air
    - Compressor efficiency, heat exchange, and cold-box integration drive performance
    - Recycle compressor losses are a known pilot bottleneck
  - - Insulated liquid-air tanks
    - Provide low-pressure cryogenic energy reservoir
    - Tank insulation and boil-off management support duration claims
    - Public sources do not disclose commercial hold-loss numbers for Carrington
  - - Pump, heat exchanger, and turbine discharge train
    - Pressurizes, warms, regasifies, and expands stored liquid air to generate electricity
    - Needs dependable turbomachinery and stable heat input
    - Evaporator and turbine conditions materially affect output and efficiency
  - - Thermal stores and cold recycle
    - Capture heat of compression and reuse cold from discharge to improve cycle performance
    - Depends on well-matched thermal fluids, heat exchangers, and site integration
    - Weak thermal integration erodes the economics relative to batteries
  - - Controls and analytics layer (BLU / R2X)
    - Optimizes plant operation, flexibility modes, and grid-modeling assumptions
    - Requires reliable software, sensors, and secure operator workflows
    - Public architecture, cybersecurity, and operator-interface disclosure remain thin
  notes: This architecture table reflects only publicly disclosed layers; it is not an internal P&ID or control narrative.
