  - type: missing-source
    severity: material
    topic: controls-software-disclosure
    missingEvidence: Public technical architecture for BLU and R2X, including operator workflows, cybersecurity controls, telemetry boundaries, and any third-party integrations.
    whyItMatters: Controls quality shapes dispatch performance, plant safety, and differentiation, yet current public disclosure is mostly naming rather than engineering detail.
    diligencePath: Request a technical overview deck or product note for BLU/R2X from Highview or a partner that explains controls scope, cyber posture, and operator interfaces.
    relatedQuestionRefs:
    - QE014
  - type: missing-source
    severity: material
    topic: reliability-and-certifications
    missingEvidence: Third-party availability data, incident history, process-safety certifications, and cybersecurity attestations for live or near-live Highview assets.
    whyItMatters: Trust and safety are central to underwriting first-commercial infrastructure, and narrative safety claims are weaker than audited operating evidence.
    diligencePath: Request incident logs, maintenance KPIs, SLA commitments, safety case materials, and cyber or quality certifications from Highview and EPC partners.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: commercial-round-trip-efficiency
    missingEvidence: Measured or contract-grade round-trip efficiency, auxiliary load assumptions, and thermal-integration assumptions for Carrington specifically.
    whyItMatters: Generic LAES efficiency ranges are not enough to judge the economics of the first commercial plant or compare it fairly with batteries and other LDES options.
    diligencePath: Request Carrington performance guarantees, lender technical due diligence, or measured acceptance-test data once commissioning starts.
