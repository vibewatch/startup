- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - Gap
  rows:
  - - Use of mature industrial components
    - Supported by official, partner, and trade sources
    - Compressors, heat exchangers, cryogenic tanks, pumps, turbines, molten-salt thermal integration
    - No public vendor-by-vendor BOM or redundancy architecture
  - - No combustion during discharge
    - Supported by official and trade descriptions
    - Power recovery process expands heated air without burning fuel
    - Public sources still lack a full hazard-and-operability or emissions disclosure pack
  - - Waste heat / waste cold integration
    - Supported by pilot, partner, and technical sources
    - Pilsworth landfill-engine waste heat; Carrington molten-salt heat storage; LNG/industrial cold synergies in literature
    - Site-specific commercial uplift is not yet published for Carrington
  - - Safety culture and technical hiring
    - Supported by careers page and public technical hiring surface
    - Careers language emphasizes “Beyond Zero” and ongoing engineering recruitment
    - Culture statements are not substitutes for public incident rates or safety certifications
  - - Lifecycle / degradation claim
    - Official and partner sources say 30-50 years with minimal or no degradation
    - Supports infrastructure-style underwriting versus electrochemical replacement cycles
    - No long-run commercial availability data are yet public
  - - First-commercial-scale risk control
    - Carrington construction and partner stack are visible
    - Named investors and suppliers reduce pure concept risk
    - The first plant still has to prove delivered efficiency, uptime, and maintenance burden in service
  notes: The table separates supported trust signals from still-missing third-party performance evidence.
