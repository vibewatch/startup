  title: Product architecture map
  type: stack
  layout: wide
  summary: Public evidence supports a layered asset made of charging, cryogenic storage, discharge, controls, and site-integration blocks.
  data:
    layers:
    - label: Charging train
      detail: Air cleaning, drying, compression, refrigeration, and liquefaction convert surplus electricity into liquid air.
    - label: Cryogenic storage
      detail: Insulated low-pressure tanks hold the liquid-air inventory as the plant’s separable energy reservoir.
    - label: Discharge train
      detail: Pumps, heat exchangers, vaporizers, and turbines return the stored cryogen to electricity.
    - label: Controls and grid optimization
      detail: BLU controller and R2X analytics tune plant operating modes, dispatch flexibility, and siting assumptions.
    - label: Site integration layer
      detail: Stability-island equipment, substations, transmission links, and waste-heat or waste-cold interfaces shape project economics.
