- id: asset-architecture-and-deployment-envelope
  title: Asset Architecture, Module Map, and Deployment Envelope
  body: 'The asset breaks into a charging train, a cryogenic storage block, a discharge train, and site-level controls and balance-of-plant. Public and partner documentation make the physical sequence concrete: air purification and compressor stages feed the liquefaction train; insulated tanks provide the low-pressure liquid-air inventory; then pumps, vaporizers, heat exchangers, thermal-fluid loops, and turbines convert that stored cryogen back into electricity. Carrington adds a stability-island phase before the full storage block, while Hunterston begins with another stability island and later expands into a 300 MW / 3.2 GWh hybrid liquid-air-plus-lithium-ion platform. Highview’s own material and Sumitomo SHI FW’s licensed LAES pages frame the product as modular, locatable, and capable of separating stored-energy volume from charging and discharging rates. That matters commercially: the company can tailor duration and power independently, site assets on brownfield or industrial land near
    substations and demand centers, and optionally integrate adjacent waste heat or waste cold. Sulzer’s announced cryogenic and molten-salt package for Carrington also shows that the current commercial platform is already using named industrial suppliers rather than only lab-scale custom hardware.'
