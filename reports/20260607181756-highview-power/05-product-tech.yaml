- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Highview solution
  - Measurable benefit
  - Limitation
  rows:
  - - Absorb excess renewable generation
    - Wind/solar output exceeds local demand and faces curtailment
    - Charge the air liquefier and store energy as liquid air
    - Turns curtailed electricity into dispatchable stored energy
    - Commercial revenue depends on dispatch rules and market support
  - - Hold multi-hour to multi-day reserves
    - System operator needs longer duration than a short BESS window
    - Low-pressure cryogenic tanks hold liquid air for later discharge
    - Extends duration from hours toward days or weeks depending on tank sizing
    - Exact commercial hold-loss profile is not publicly disclosed for Carrington
  - - Return power during renewable shortfall
    - Low wind or evening peak creates capacity need
    - Pump, heat, regasify, and expand stored air through turbines
    - Dispatchable clean power without fuel combustion at discharge
    - Round-trip efficiency is moderate versus batteries
  - - Provide synchronous grid support
    - Weak-grid node needs inertia, reactive power, voltage and short-circuit strength
    - Stability island and synchronous equipment provide non-energy services
    - Lets one site support both storage and system stability missions
    - Service values are highly location- and contract-dependent
  - - Improve efficiency with site synergies
    - Industrial site has waste heat, waste cold, or LNG-style cryogenic interfaces
    - Thermal integration boosts liquefaction/discharge efficiency and system value
    - Can add efficiency and co-benefit streams beyond pure arbitrage
    - Best economics depend on having suitable nearby integration opportunities
  - - Stage a hybrid project build-out
    - Developer wants early grid-service revenues before full storage completion
    - Hunterston phases stability services first, then adds hybrid storage capacity
    - Reduces time-to-first-service and broadens value stack
    - Adds architecture and execution complexity across multiple technologies
  notes: Benefits are framed in system-operator workflow terms rather than retail end-user terms because Highview sells infrastructure assets.
