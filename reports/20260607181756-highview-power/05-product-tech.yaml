- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Carrington stability island
    - NESO / local grid operators
    - Under construction; phase 1 targeted from 2026
    - Separates stability services from full storage build-out and monetizes inertia, voltage and short-circuit support early
    - Need signed service contracts, tested performance ranges, and commissioning evidence
  - - Carrington LAES block (50 MW / 300 MWh)
    - Grid operators, infrastructure investors, renewable-heavy nodes
    - First commercial-scale asset; construction underway
    - Combines long-duration shifting with synchronous stability services on brownfield substation-linked land
    - Need measured auxiliary load, commercial RTE, and availability once energized
  - - Hunterston stability island
    - Scottish transmission system / system operator
    - Funded phase one; can operate independently of storage elements
    - Extends Highview from pure storage to a dedicated grid-support asset in a weak-grid location
    - Public timetable is inconsistent across announcements and needs current EPC confirmation
  - - Hunterston hybrid LAES + lithium-ion platform (300 MW / 3.2 GWh)
    - System operator / large-scale clean-power portfolio
    - Planned commercial platform after phase one
    - Pairs longer-duration LAES with batteries for higher power flexibility and system-value optimization
    - Need exact architecture split between LAES and BESS plus final cap-and-floor outcome
  - - Pilsworth demonstrator (5 MW / 15 MWh)
    - National Grid balancing-services context
    - Operational pilot since 2018
    - Only publicly discussed operating plant with concrete balancing-service and waste-heat integration evidence
    - Measured pilot data exist, but commercial extrapolation is still imperfect
  - - BLU controller and R2X analytics
    - Asset operator / project-development team
    - Disclosed platform components, but not deeply documented
    - Suggest software-led optimization and system modeling are part of the offering, not just steel-on-site hardware
    - Need public architecture, cyber controls, and user-facing workflow detail
  notes: Rows distinguish physical assets from disclosed software/control modules; maturity is based on public operating or funding evidence as of 2026-06-07.
