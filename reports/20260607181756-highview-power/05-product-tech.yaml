  - type: conflicting-data
    severity: material
    topic: hunterston-phase-timeline
    missingEvidence: A single current project schedule that reconciles stability-island energization, full hybrid storage commissioning, and any staged revenue-service dates for Hunterston.
    whyItMatters: Phase timing is part of product maturity, customer value sequencing, and execution-risk assessment for the Millennium Series platform.
    diligencePath: Obtain the latest Hunterston EPC schedule or investor update that breaks out phase-one grid services, phase-two LAES construction, and full hybrid commercial operation.
    relatedQuestionRefs:
