- id: trust-quality-safety-and-adverse-view
  title: Trust, Quality, Safety, and the Adverse View
  body: 'The trust case rests on physical conservatism more than novelty theater. Highview and its partners repeatedly emphasize that LAES uses mature machinery from industrial gas, power-generation, and turbomachinery sectors; the working medium is air; and no fuel has to be burned during discharge. Public descriptions also emphasize waste-heat and waste-cold integration, which can improve efficiency and make the plant more useful at industrial sites, and the careers page signals a stated “Beyond Zero” safety culture alongside ongoing technical hiring. Those are real positives. The adverse lens is equally important. Independent reviews and trade coverage place LAES round-trip efficiency below batteries, often around the 50% to 65% range unless integration is exceptionally good. The process is mechanically and thermally more complex than lithium-ion, with compressors, heat exchangers, cryogenic tanks, pumps, turbines, and controls all needing to work together. Public evidence also leaves
    notable quality gaps: there is no retained third-party disclosure of Carrington availability, SLA history, cybersecurity certifications, or measured commercial round-trip efficiency. So the chapter verdict is that Highview’s quality and safety framing is plausible and industrially grounded, but the company is still crossing the hardest trust threshold now: proving that a first commercial-scale plant can deliver the promised economics and reliability outside the pilot context.'
