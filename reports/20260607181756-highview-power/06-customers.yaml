- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Public value
  - Segment / counterparty
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current customer or contracted-counterparty count
    - null
    - All projects
    - low
