tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer
  - User
  - Primary payer
  - Named evidence
  - Commercial limitation
  rows:
  - - GB system-operator / stability-services use case
    - Highview plus project sponsors must qualify the asset into NESO / Ofgem processes
    - Transmission system and constrained UK grid nodes
    - System-service revenues and, if awarded, cap-and-floor backed cash flows
    - Projects page calls Highview a critical partner to NESO; Carrington and Hunterston are framed around grid support
    - No signed long-term service contract with NESO or a utility is publicly disclosed
  - - Node-specific storage-and-stability project
    - Developer, site sponsor, and financing counterparties
    - Local transmission node needing energy shifting plus inertia / voltage support
    - Project SPV capital plus future contracted and merchant revenues
    - Carrington and Hunterston are described as site-specific platforms solving local grid constraints
    - Economics are highly site-specific and not yet proven across a fleet
  - - Public infrastructure-capital allocator
    - Investment committees at UKIB/NWF or SNIB
    - Project company rather than end-power consumer
    - Public or publicly backed balance sheet capital
    - NWF anchored Carrington and SNIB joined Hunterston phase one
    - These parties finance construction; they are not recurring end-use energy customers
  - - Strategic energy partner / optimizer
    - Centrica treasury and strategic-investment functions
    - Future project portfolio and optimization workflows
    - Centrica balance sheet and project-level debt or equity rights
    - Centrica disclosed convertible debt, project debt, and future equity-participation / energy-optimisation rights
    - Partner economics are visible, but no end-customer resale or offtake structure is public
  - - Consumer-backed policy channel
    - Ofgem-administered cap-and-floor process
    - Grid beneficiaries through system resilience and reduced curtailment
    - Consumers indirectly underwrite part of downside risk through the floor mechanism
    - Government and Ofgem documents explain floor / cap support for high-capex LDES assets
    - Indirect payer channel depends on award terms and future regulation
  - - Industrial or brownfield site host
    - Developer and host-land negotiations
    - Site plus adjacent grid infrastructure
    - Project company capital and host arrangements
    - Trafford Energy Park and Hunterston site narratives show brownfield, transmission-linked siting
    - Host economics, land terms, and any industrial-service revenues are undisclosed
  notes: Rows separate the technical user from the economic buyer and payer because Highview is selling infrastructure projects rather than a standard end-user software product.
