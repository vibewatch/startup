company:
  name: Highview Power
chapter:
  number: 6
  title: Customers
  summary: 'Highview’s public “customer” evidence is mostly infrastructure and system-level rather than buyer-logo led: the visible users are grid and system operators, the visible payers are public and private infrastructure investors, and the commercial path still runs through site-by-site financing plus Ofgem/NESO policy processes. Carrington and Hunterston provide credible adoption proof for a project-led commercialization model, but named utility offtakers, customer-count metrics, retention data, and contract terms remain largely undisclosed, leaving concentration and procurement-cycle risk materially unresolved.'
sections:
- id: buyer-user-payer-segmentation
  title: Buyer, User, and Payer Segmentation Is Infrastructure-Led
  body: Highview’s “customer” is usually a coalition rather than a single software budget owner. The company’s current project materials frame Carrington and Hunterston as grid infrastructure that absorbs excess renewable generation, releases power later, and supplies stability services such as inertia, short-circuit strength, voltage support, and frequency response. That framing matters because the technical user, economic buyer, and ultimate payer diverge. The technical user is the electricity system and the grid nodes that need flexibility and stability. The visible economic buyers and sponsors are project developers, strategic energy partners, and public or quasi-public capital allocators such as UKIB/National Wealth Fund and SNIB. The ultimate payer can also include consumers through the cap-and-floor mechanism if Ofgem grants a regulated revenue floor. In other words, Highview is not selling a standard battery SKU or enterprise workflow seat; it is assembling site-specific infrastructure
    packages where system benefit, financing structure, and regulatory approval are inseparable from the customer relationship. That is why Carrington, Hunterston, and NESO-facing value propositions sit at the center of the chapter rather than a long list of named end-account logos.
  claimRefs:
