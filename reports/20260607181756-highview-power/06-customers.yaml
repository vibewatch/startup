- id: named-proof-and-project-status
  title: Named Proof Exists, but It Is Mostly Project and Counterparty Proof
  body: 'The retained source set supports real adoption proof, but it is mostly proof of funded projects, named sites, and committed counterparties rather than proof of a broad roster of disclosed end customers. Carrington is under construction and publicly specified as a 300 MWh / 50 MW / 6-hour asset with a 2026 stability-island phase. Hunterston has a separately financed phase-one stability island that multiple sources say can operate independently of the full storage build-out and provide inertia, short-circuit, and voltage support before the full LAES system arrives. Those are meaningful commercialization milestones. However, the named parties around both projects are mostly financiers, policy bodies, advisers, and strategic partners: NWF/UKIB, Centrica, SNIB, Goldman Sachs, KIRKBI, Mosaic, Ofgem, and NESO. Public materials repeatedly discuss customer benefit analysis, grid value, and site deliverability, but they do not name a utility offtaker, corporate power buyer, or multi-site
    operating customer list. The right conclusion is not that the company lacks real traction; it is that traction is currently disclosed through project finance and system-value evidence rather than through classic customer-contract disclosure.'
