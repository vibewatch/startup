    - Request current count of signed projects, operating assets, and revenue-bearing counterparties by project stage
  - - NRR / GRR / churn
    - null
    - All projects
    - low
    - Durability cannot be underwritten without renewal and contraction data once assets are live
    - Request NRR, GRR, churn, and any retained-value bridge once Carrington is operational
  - - Contract length and minimum revenue terms
    - null
    - Carrington / Hunterston
    - low
    - Asset-life economics depend on contract tenor, floor mechanisms, and service obligations
    - Request contract tenor, minimum revenue support, termination rights, and any fixed-availability commitments
  - - Named utility offtaker count
    - null
    - Grid-services customers
    - low
    - The difference between an investor-backed project and a contracted service customer is material to revenue quality
    - Request named utilities, system operators, or corporates with signed offtake or grid-services agreements
  - - Repeat strategic-partner participation
    - Centrica visible in both 2024 Carrington and 2025 Hunterston rounds
    - Strategic partner layer
    - medium
    - This is the only public repeat-relationship signal in the retained set
    - Clarify whether follow-on partner participation converts into recurring optimization, offtake, or only financing rights
  - - Post-commissioning dispatch repetition / satisfaction
    - null
    - Operating assets
    - low
    - True retention for infrastructure assets is demonstrated through repeat dispatch, option exercise, and renewal after commissioning
    - Request dispatch frequency, utilization, curtailment saved, SLA adherence, and counterparty satisfaction after first year of operation
  notes: Nulls are intentional. Public evidence does not support standard retention metrics, so the chapter records exact diligence asks instead of invented figures.
