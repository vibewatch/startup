- id: retention-and-expansion-visibility
  title: Retention, Repeat Usage, and Expansion Data Are Mostly Gaps
  body: 'This chapter has to be explicit about what is not disclosed. No retained public source gives a current customer count, NRR, GRR, churn rate, renewal cadence, contract length, minimum revenue guarantee, satisfaction score, or cohort table for Carrington or Hunterston. The only visible repeat-participation signal is partner persistence: Centrica appears in the 2024 Carrington financing and again in the 2025 Hunterston phase-one round, which suggests relationship continuity but does not substitute for revenue-retention evidence. Expansion proof is similarly pipeline-led rather than cohort-led. Highview cites more than 16 identified UK sites and a 6.4 GWh ambition by 2030, while cap-and-floor eligibility has advanced Hunterston and Killingholme, but that still describes a development funnel, not a disclosed installed customer fleet. Investors therefore have to treat retention and expansion as null-by-default fields until Carrington is commissioned, Hunterston progresses beyond phase
    one, and management discloses actual operating contracts, dispatch repetition, and counterparty concentration. The correct diligence posture here is disciplined skepticism, not forced precision.'
  claimRefs:
