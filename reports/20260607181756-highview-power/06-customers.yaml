- id: TU003
  title: Named customer proof table
  columns:
  - Named counterparty / site
  - Segment
  - Deployment / use case
  - Production vs pilot / stage
  - Outcome / value signal
  - Limitation
  rows:
  - - Carrington, Manchester
    - Commercial grid-scale storage and stability site
    - 300 MWh / 50 MW / 6h LAES plus 2026 stability-island phase
    - Under construction / pre-production
    - Strongest public proof that Highview has moved from pilot lineage into first commercial deployment
    - No named utility offtaker, dispatch contract, or post-commissioning usage data are public
  - - Hunterston, Ayrshire
    - Grid-stability-first long-duration storage site
    - Phase-one stability island with later 3.2 GWh hybrid storage build-out
    - Financed / pre-production
    - Multiple sources confirm independently operable stability services before full storage completion
    - Still a staged project; full commercial operations and contract terms are not public
  - - Centrica
    - Strategic partner / optimizer / capital provider
    - 2024 Carrington financing plus 2025 Hunterston follow-on round
    - Active partner relationship
    - Only named counterparty with visible repeat participation across two flagship projects
    - Public disclosures show investment and optimization rights, not end-customer energy purchase volumes
  - - NWF / UKIB
    - Public infrastructure capital anchor
    - £165M anchor inside Carrington financing package
    - Committed project capital
    - Strong proof that public infrastructure finance is willing to back the first commercial site
    - Capital-provider proof is not the same as customer-demand proof
  - - SNIB
    - Public infrastructure capital co-investor
    - Joined Hunterston phase-one funding round
    - Committed project capital
    - Shows public-capital willingness to finance follow-on Scottish deployment
    - Again, payer proof rather than recurring end-user demand proof
  - - Killingholme, Lincolnshire
    - Named expansion candidate
    - 3.2 GWh project advanced into cap-and-floor assessment
    - Policy-eligible pipeline
    - Demonstrates Highview can name at least one follow-on site beyond Carrington and Hunterston
    - No financing close, operating date, or named customer contract is public in retained sources
  notes: 'The table is intentionally broader than classic “customer logos”: Highview’s retained public proof is mostly site and counterparty proof. Limitation fields preserve the distinction between investor backing, policy progress, and true end-customer contract disclosure.'
  enumerationScope:
    coverage: partial
    basis: Covers the main publicly named sites and counterparties tied directly to commercialization as of 2026-06-07; it does not claim to enumerate every private contract, investor, or host agreement.
