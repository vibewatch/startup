figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Highview’s public customer journey runs from system need and policy fit to financing, first stability service, and only then full storage expansion.
  data:
    nodes:
    - label: Grid need identified
      detail: A constrained UK node or system operator identifies curtailment, inertia, or flexibility shortages that a long-duration asset could solve.
      tone: neutral
    - label: Policy and market fit
      detail: Developer aligns the project to cap-and-floor rules, NESO system needs, and deliverability tests rather than to a simple one-buyer purchase order.
      tone: neutral
    - label: Anchor capital formation
      detail: Public and private capital providers such as NWF/UKIB, SNIB, Centrica, and financial investors fund the project company.
      tone: positive
    - label: Site engineering and host alignment
      detail: Brownfield siting, transmission access, and project staging are agreed before the full storage plant is commissioned.
      tone: neutral
    - label: First stability-service operation
      detail: A stability island can reach first service and demonstrate grid value before the full LAES or hybrid platform is operational.
      tone: positive
    - label: Full storage deployment and optimization
      detail: Only after successful commissioning does the model expand into repeat sites, optimization rights, and wider portfolio rollout.
      tone: positive
  claimRefs:
  - CU001
