  layout: wide
  summary: 'The public commercialization path is sequential and policy-mediated: system need, eligibility, financing, first stability service, and then full storage revenue.'
  data:
    nodes:
    - id: n1
      label: System need and site thesis
      description: Highview identifies a UK node where curtailment, flexibility shortages, or stability needs justify a project.
    - id: n2
      label: Cap-and-floor / policy screen
      description: Hunterston and Killingholme move through Ofgem eligibility and NESO customer-benefit analysis before final support decisions.
    - id: n3
      label: Financing close
      description: Carrington and Hunterston rely on consortium capital rather than on a single named customer prepaying the full asset.
    - id: n4
      label: Stability island first service
      description: Phase-one grid-support assets can begin delivering inertia, short-circuit, and voltage support ahead of full storage.
    - id: n5
      label: Full LAES / hybrid asset
      description: The broader storage plant enters service only after a longer construction and qualification period.
    - id: n6
      label: Portfolio expansion
      description: Only successful commissioning and market fit can convert flagship projects into a repeatable UK site portfolio.
