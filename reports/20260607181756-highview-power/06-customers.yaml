  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Current count of contracted projects, named revenue-bearing counterparties, and any live operating customer relationships.
    whyItMatters: Without a dependable counterparty count, concentration and conversion from pipeline to revenue cannot be quantified.
    diligencePath: Request management’s current customer and contracted-project ledger, segmented by project stage, counterparty type, and revenue contribution.
    relatedQuestionRefs:
    - QU010
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal, and satisfaction metrics once Carrington and future assets are operating.
    whyItMatters: The chapter cannot convert project traction into durability underwriting without operating retention evidence.
    diligencePath: Request renewal schedules, any recurring-service revenue bridge, and post-commissioning counterparty retention reporting.
    relatedQuestionRefs:
    - QU011
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: contract-structure
    missingEvidence: Contract tenor, floor or minimum-revenue terms, availability obligations, termination rights, and who takes merchant risk at each site.
    whyItMatters: Project economics and durability depend on contract structure, not just on financing headlines.
    diligencePath: Request signed principal commercial terms for Carrington and Hunterston, including any capacity, optimization, or grid-services agreements.
    relatedQuestionRefs:
    - QU012
    relatedTableRefs:
    - TU003
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-counterparties
    missingEvidence: A complete list of named customers, hosts, utilities, and offtakers beyond the publicly disclosed sites and financing counterparties.
    whyItMatters: The named proof table is intentionally partial because public evidence does not establish a comprehensive commercial roster.
    diligencePath: Request the full signed counterparty list by site, including utility, host-land, optimization, financing, and any offtake relationships.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU003
  - type: stale
    severity: material
    topic: cap-and-floor-award
    missingEvidence: Final cap-and-floor award terms, customer-benefit analysis outputs, and any resulting revenue-floor parameters for Hunterston and Killingholme.
    whyItMatters: Two large follow-on projects remain materially dependent on award outcomes, so valuation of customer durability and expansion is incomplete without them.
    diligencePath: Refresh the chapter once Ofgem and NESO publish final award decisions or project-level guidance, then reconcile revenue support with project finance assumptions.
    relatedQuestionRefs:
    - QU015
    - QU016
  - type: missing-source
    severity: material
    topic: post-commissioning-usage
    missingEvidence: Measured dispatch frequency, curtailment avoided, contracted utilization, and customer satisfaction after Carrington and Hunterston enter service.
    whyItMatters: First-service outcomes are the bridge from project-led commercialization to real customer durability.
    diligencePath: Request first-year operating dashboards, dispatch logs, SLA performance, and counterparty references after commissioning.
    relatedQuestionRefs:
    - QU005
    - QU009
    - QU025
