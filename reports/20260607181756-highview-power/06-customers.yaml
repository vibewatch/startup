- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver or risk
  - Evidence
  - Impact
  - Current severity
  - Diligence path
  rows:
  - - Carrington first-of-a-kind concentration
    - First commercial site still carries most tangible adoption proof
    - Any commissioning or revenue underperformance would damage the entire proof stack
    - high
    - Request commissioning milestones, signed counterparties, and downside sensitivity if Carrington slips
  - - Hunterston as second flagship rather than diversified fleet
    - Second visible project is also very large and still staged around phase one
    - Portfolio diversification is weaker than the 16-site pipeline headline suggests
    - high
    - Request stage-by-stage site list with probability-weighted commercial close dates
  - - UK cap-and-floor dependence
    - Hunterston and Killingholme still rely on Ofgem/NESO customer-benefit analysis and award decisions
    - Expansion is exposed to policy timing and award design
    - high
    - Request scenario analysis with and without cap-and-floor support and evidence of alternative commercialization paths
  - - Strategic-partner concentration
    - Centrica is the only visibly repeat named partner across major financings
    - A small partner set may hold outsized influence over capital formation and downstream economics
    - medium
    - Request rights map for Centrica, NWF/UKIB, SNIB, and other major counterparties
  - - Thin named-customer disclosure
    - Public sources name sites, investors, and advisers more often than utility or corporate customers
    - Makes revenue-quality and retention underwriting difficult
    - high
    - Request the signed customer / offtaker roster and revenue concentration by top counterparties
  - - Slow technical procurement cycles
    - NESO stability tenders in 2026 cleared conservative assets and imposed demanding technical thresholds
    - Novel storage monetization may take longer than project-finance announcements imply
    - medium
    - Request qualification timeline, study results, and contingency plan if stability-market criteria tighten further
  notes: This risk table focuses on customer concentration and procurement friction rather than on generic project-execution risk already covered elsewhere.
