  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Highview 竞争的市场窄但重要：脱碳电力系统需要的电网级长时灵活性，而不是泛泛的全球电池市场。 纳入这个市场的支出包括 8 小时以上储能平台的开发、融资、建设和运营，以及围绕它们的电网稳定服务，
              如惯量、无功功率、电压支撑和弃电削减。这一点重要，因为 Highview 卖的不只是储存的 MWh； 其官方材料把 Carrington 和更广泛的英国项目定位为把电能时移与同步系统服务结合起来的混合基础设施。
              英国 cap-and-floor 机制强化了这一边界：它筛选的是能够提供至少 8 小时满功率输出的项目， 从而把今天短时电池装机群的主体排除在核心政策支持池之外。


              被排除的桶和替代桶同样重要。短时 2-4 小时 BESS 仍是主要相邻市场，也是 8-12 小时竞争中最强的在位者， 但它和 cap-and-floor 支持的 8
              小时以上资产仍是不同采购类别。抽水蓄能和压缩空气储能是地理条件允许时的 长时标杆；燃气调峰机组、弃电补偿和独立同步支撑设备，仍是解决同一可靠性问题碎片的现状方案。 因此，Highview
              最相关的市场，是那些长寿命、灵活选址和稳定服务比原始电池效率或商品化电池包价格更重要的节点子集。
