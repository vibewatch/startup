  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险栈与剩余敞口
        blocks:
          - type: paragraph
            body: >-
              风险图谱不是分散的，而是高度集中。Carrington
              重要，因为它是第一个商业规模验证点；整个英国铺开叙事仍取决于一座一体化液态空气储能电站能否投运、稳定本地电网，并把工程故事转成可复制经济性。因此，即便还没讨论政策和竞争，FOAK
              交付也是头号风险。第二大风险是收入框架依赖：政府咨询文件明确说，长时储能在现有市场结构下难以规模化部署；Highview 下一个英国重大项目仍要靠 Ofgem 和 NESO 把 cap-and-floor
              评估推进到最终授标。第三是项目集中度：公开牵引力主要绑定 Carrington 和
              Hunterston，而不是广泛投运的机群。第四是披露风险：公开备案和合作方公告仍然看不清单位经济性、合同条款和股东权利细节。第五是锂电竞争压力，因为更便宜、更可融资的 8–12 小时电池项目可能在 LAES
              可复制之前吸走政策支持。缓释因素确实存在，但都还没被证明：成熟部件、分阶段稳定岛部署、政策支持和强资本伙伴都有帮助；不过在投运和可融资收入证据出现前，剩余敞口仍高。
