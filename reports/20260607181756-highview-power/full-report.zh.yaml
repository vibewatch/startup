      - number: '8.3'
        title: 情景分析与相对区间
        blocks:
          - type: paragraph
            body: >-
              正因为缺少绝对估值数据，情景分析才是合适工具。乐观情景下，Carrington 按可信时间线通电，Hunterston 获得 cap-and-floor 支持并向前推进，Highview
              把当前融资信用转成可复制的项目级或基础设施式资本，而不是新一轮昂贵 holdco 股权融资。在这种世界里，公司应获得更强估值支撑指数，因为市场终于有证据表明 LAES
              可以从建设叙事变成运营资产类别。基准情景不那么戏剧化，也可能更接近今天现实：Carrington
              取得部分进展，政策支持在推进但不顺畅，公开收入披露仍滞后，估值支撑含混，所有权条款高度重要。悲观情景很容易讲清，也很难排除。锂电继续变便宜，2026 年招标偏向成熟电池平台，Carrington 或
              Hunterston 延误，Highview 在运营现金流被证明前不得不通过稀释或优先结构融资。这种组合不代表技术毫无价值，但会大幅削弱股权故事。
