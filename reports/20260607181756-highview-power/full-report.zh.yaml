      - number: '1.2'
        title: 领导层延续、交接风险与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层证据既显示延续，也显示变化。2024 年 6 月和 2025 年 11 月融资稿件中， Richard Butland 是 Highview 对外的首席执行官面孔，Colin Roy
              则以董事长兼联合创始人身份出现。 2026 年 5 月，公司宣布 Peter Jones 将出任首席执行官，David Gibson 任 COO，David Hemmings 任 CCO。 Jones 来自
              Neptune Energy 和其他大型基础设施岗位，契合 Highview 当下从首个项目执行走向可复制交付的需要。
              但现行官方披露在治理上比管理层履历更薄。公司页称领导团队横跨发电、输电、基础设施、金融和项目交付， 却没有公布完整董事会名单、委员会结构或投资者控制权图谱。Tracxn 和 2020 年 Sumitomo
              公告显示， 外部董事代表曾经存在，但当前公开材料没有提供可靠的最新董事会名单。结果是治理图景好坏参半： 2026 年管理层厚度提高了，但董事会透明度和关键人依赖仍是部分未解的尽调事项。
