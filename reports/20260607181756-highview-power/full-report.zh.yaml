      - number: '8.2'
        title: 可比边界与估值方法
        blocks:
          - type: paragraph
            body: >-
              可比分析仍有用，但主要是划边界，不是搬倍数。Highview
              不应被硬塞进软件式收入倍数框架，因为证据反复指向基础设施属性：大型、特定场址资产，开发周期长，公私资本混合，通过能量搬移和稳定性服务变现。上市储能同行从不同角度强化这个结论。Fluence
              展示了公开储能平台成熟披露应是什么样。ESS、Eos 和 Invinity 则说明，公开替代化学路线同行即便比 Highview 给投资人更多能见度，仍可能长期饥渴资本。Form Energy、Energy
              Dome、Hydrostor 以及抽水蓄能参照把镜头拉得更宽：长时储能不是一组干净可比公司，而是一堆资产重、时长、制造、场址和政策依赖各不相同的模型。这种异质性让精确声称 Highview
              公允倍数变得危险。更有纪律的做法，是用可比公司判断披露质量、商业化姿态和资本强度，再让 Highview 自己的里程碑路径承担更重的估值工作。
