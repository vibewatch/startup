      - number: '5.2'
        title: 资产架构、模块地图与部署边界
        blocks:
          - type: paragraph
            body: >-
              资产可以拆成充电链、低温储存模块、放电链，以及站点级控制和全厂辅助系统。公开和伙伴文件把物理流程讲得很具体： 空气净化和压缩机阶段进入液化链；绝热储罐提供低压液态空气库存；随后泵、汽化器、换热器、热流体回路和涡轮
              把储存的低温液体再转成电力。Carrington 在完整储能模块前先增加稳定岛阶段，Hunterston 也先从另一个稳定岛开始， 之后扩展为 300 MW / 3.2 GWh
              液态空气加锂离子混合平台。Highview 自身材料和 Sumitomo SHI FW 授权 LAES 页面
              把产品描述为模块化、可选址，并且能够把储能容量与充放电功率解耦。这在商业上重要：公司可以分别定制时长和功率， 把资产布置在变电站和需求中心附近的棕地或工业用地，并可选择接入邻近余热或余冷。Sulzer 为
              Carrington 公布的 低温和熔盐套件也说明，当前商业平台已经在使用具名工业供应商，而不只是实验室级定制硬件。
