        - 声称寿命 50+ 年
        - 声称 30+ 年且无衰减
        - 声称长寿命，但商业机组仍年轻
        - 声称 30+ 年或几乎无衰减
        - 相比机械资产，增容周期更短且有化学体系更换风险
      - - 可融资性 / 分销
        - 英国项目融资已有实质进展，但运营基础仍有限
