      - number: '1.5'
        title: 创立历史、IP 基础与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              创立叙事方向清楚，但并不完全清晰。Tracxn 和 Climatebase 的第三方资料都把 Highview 追溯到 2005 年并定位在伦敦，而当前官方材料避免给出精确创立日期，只强调 15 到 17
              年创新。 Companies House 还显示一个名为 HIGHVIEW POWER STORAGE LIMITED 的已解散实体，2009 年注册， 可读备案背景有限，暗示商业、IP
              和法律历史可能跨过不止一个实体。对承销而言，这不否定核心事实： Highview 已花十多年发展低温储能技术积累。分配给 Highview Enterprises Limited 的专利列表显示， 截至 2025
              年，公司围绕压缩热储存、压力控制、功率回收和更广义低温系统架构仍有持续保护； 2024 年热力学分析论文则称 Highview 试点电站是唯一有公开测试数据的 LAES 系统。因此，关键未解问题
              不是是否存在实质技术，而是投资者能否把法律实体、现时董事会权利、私有估值、收入生成，以及一条亮眼管线 转成可复制运营资产的路径清楚地串起来。
