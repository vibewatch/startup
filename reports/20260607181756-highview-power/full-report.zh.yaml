          description: 更大的储能电站只有经过更长建设和资格确认期后才会投运。
        - id: n6
          label: 组合扩张
          description: 只有成功投运并验证市场适配后，旗舰项目才可能转成可复制的英国站址组合。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    claimRefs:
      - CU007
      - CU013
      - CU021
      - CU027
      - CU038
      - CU039
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 已获融资站址和交易对手的证据质量最高，但终端客户命名、留存和合同披露弱得多。
    data:
      columns:
        - 具名交易对手可见度
        - 运营证明
        - 留存可见度
        - 主要限制
      rows:
        - label: Carrington
          values:
            - 高
            - 中
            - 低
            - 建设和规模可见，但终端客户合同和运营历史不可见
        - label: Hunterston 一期
          values:
            - 高
            - 中
            - 低
            - 稳定性岛功能描述充分，但完整变现和合同条款仍待落地
        - label: Centrica 关系
          values:
            - 高
            - 低
            - 中
            - 重复参与可见，但披露口径仍是投资和优化权利，而不是承购
        - label: 公共资本锚定方
          values:
            - 高
            - 低
            - 低
            - NWF/UKIB 和 SNIB 验证的是融资意愿，不是经常性客户需求
        - label: 具名终端客户名单
          values:
            - 低
            - 低
            - 低
            - 留存公开来源没有点名任何披露收入或续约条款的公用事业或企业买方
    claimRefs:
      - CU012
      - CU019
      - CU020
      - CU033
      - CU037
      - CU042
  - id: FR001
    title: 风险热图
    type: matrix
    layout: wide
    summary: 最高残余风险集中在 FOAK 投运、政策时点、披露不透明和锂离子竞争。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余暴露
      rows:
        - label: Carrington FOAK 投运
          values:
            - 高
            - 严重
            - 早期
            - 高
        - label: cap-and-floor 授予时间
          values:
            - 高
            - 严重
            - 中期
            - 高
        - label: 经济性和权利不透明
          values:
            - 高
            - 高
            - 早期
            - 高
        - label: 锂离子竞争
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 供应商和劳动力爬坡
          values:
            - 中
            - 高
            - 中
            - 中高
    claimRefs:
      - CR006
      - CR015
      - CR032
      - CR035
      - CR041
      - CR044
      - CR050
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 执行、政策和成本压力都会传导为收入延后、融资走弱和估值压缩。
    data:
      nodes:
        - id: foak
          label: FOAK 调试投运风险
          type: risk
        - id: policy
          label: cap-and-floor 时点风险
          type: risk
        - id: supply
          label: 供应商与集成风险
          type: risk
        - id: metrics
          label: 单位经济模型和 KPI 未披露
          type: risk
        - id: battery
          label: 更便宜的锂离子替代方案
          type: market
        - id: revenue
          label: 收入组合延后或偏弱
          type: outcome
        - id: finance
          label: 融资难度上升、摊薄加重
          type: outcome
        - id: value
          label: 估值压缩
          type: outcome
      edges:
        - from: foak
          to: revenue
          label: 延后市场化与服务收入
        - from: policy
          to: revenue
          label: 拖慢监管下限生效
        - from: supply
          to: foak
          label: 推迟调试关键路径
        - from: metrics
          to: finance
          label: 削弱贷款方信心
        - from: revenue
          to: finance
          label: 降低可融资性
        - from: battery
          to: revenue
          label: 压缩可签约价值
        - from: finance
          to: value
          label: 抬高资本成本
        - from: revenue
          to: value
          label: 削弱增长情景可信度
    claimRefs:
      - CR006
      - CR015
      - CR019
      - CR029
      - CR032
      - CR041
      - CR045
      - CR050
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Highview 当前扩产靠少数监管方、出资方和专业交付伙伴撑着。
    data:
      nodes:
        - id: highview
          label: Highview 英国项目计划
          type: hub
        - id: nwf
          label: UKIB / NWF 与公共资本锚定方
          type: capital
        - id: centrica
          label: Centrica 战略权利持有人
          type: capital
        - id: snib
          label: SNIB / Goldman / KIRKBI / Mosaic 财团
          type: capital
        - id: ofgem
          label: Ofgem / NESO cap-and-floor 路径
          type: regulator
        - id: shi
          label: SHI FW 授权 EPC 能力
          type: supplier
        - id: sulzer
          label: Sulzer 专业泵包
          type: supplier
        - id: carrington
          label: Carrington FOAK 资产
          type: asset
        - id: hunterston
          label: Hunterston 后续资产
          type: asset
      edges:
        - from: nwf
          to: highview
          label: 锚定首波资金
        - from: centrica
          to: highview
          label: 资金加未来权利
        - from: snib
          to: hunterston
          label: 资助第一阶段
        - from: ofgem
          to: hunterston
          label: 决定支持路径
        - from: shi
          to: highview
          label: 授权 EPC 能力
        - from: sulzer
          to: carrington
          label: 交付关键包
        - from: highview
          to: carrington
          label: 必须验证 FOAK
        - from: highview
          to: hunterston
          label: 必须可重复扩张
    claimRefs:
