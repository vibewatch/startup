      - number: '2.3'
        title: 买方、付款方与采购路径
        blocks:
          - type: paragraph
            body: >-
              英国 LDES 的买方链条是间接的。DESNZ 和 Ofgem 设定市场设计，NESO 识别系统需求，开发商和发起方提交项目，
              基础设施投资者和战略资本为项目出资，公用事业或交易商最终可能把调度和辅助服务变现。在这个意义上， 终端用户是电力系统，而不是单一客户账户。预算所有权首先落在项目发起方和贷款人手里，但必要时，
              下行支持会通过监管机制围绕消费者兜底的收入下限来设计。这就是为什么长时储能眼下更像基础设施承销问题， 而不是普通设备销售。Carrington 的 £300 million 融资包，包括来自 National
              Wealth Fund 的 £165 million， 比任何装机电池 MWh 头条更能读出市场准入。


              落地路径也受政策牵引。Ofgem 第一个 cap-and-floor 窗口于 2025 年 4 月开启，处理了 171 份申请， 认定 77 个项目合格，并计划在 2026 年 Q2
              作出最终授标决定。Highview 已经位于这个漏斗之内： Carrington 在建，Hunterston 和 Killingholme 已通过资格审查并进入下一评估阶段。因此，触发采用的
              不只是设备成本下降，还有弃电削减、惯量和电压需求，以及长寿命、类监管资产对基础设施投资者的吸引力。 对 Highview 来说，可融资性的证明不是单靠技术营销，而是撑过这个流程，并把入围项目转成有授标背书的建设。
