  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按电网运营商工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Highview 卖的是电网资产，而不是电池包 SKU。放到客户工作流里，买方是系统运营商、公用事业、基础设施投资者或
              大型工业用电方；他们需要吸收多余可再生发电、减少弃电、把电能留到之后调度，并在不依赖化石燃料调峰机组的情况下 加强本地电网稳定。充电时，电站用电吸入环境空气，清洁并干燥，然后压缩和制冷，直到空气液化。
              液态空气以低压存放在绝热罐中，作为能量储库。电网需要支撑时，液体被泵到高压、加热、重新变成气体， 并通过涡轮膨胀输出电力。Highview 还把同一平台定位为可叠加同步惯量、无功功率、电压支撑、短路强度、
              备用和黑启动。这让客户工作流更接近在受限节点采购一座长寿命灵活性加稳定性电站，而不是购买纯套利电池。 Carrington 是这种工作流的首个商业化表达，Hunterston 则把它延伸成稳定加储能的混合平台。
