            body: >-
              这个格局里的公开定价证据很薄，因此真正的比较不是逐项对照客户价格，而是经济姿态。Highview 的姿态由基础设施牵引： 由 National Wealth Fund 和 Centrica 锚定的 £300
              million Carrington 融资，之后又为 Hunterston 拿到 £130 million，说明公司在拥有广泛运营资产之前，就能吸引国家背书和战略资本。相比仍需为制造扩张融资的电池初创公司，
              这是有意义的优势。Energy-Storage.News 明确认为，机械储能供应商受益于现成部件，也避开了压在新型电池公司身上的部分资本强度。 但 Highview 并不拥有成本领先叙事。Energy
              Solutions 仍把早期商业化 LAES 放在约 $120-200/MWh、 50-65% 效率的位置；Energy Dome 公开讲出更有利的效率和资本开支叙事，Fluence
              仍通过规模、服务和上市公司披露设定 可融资性标杆。Highview 对基础设施投资者看起来可融资，但并不明显比在位电池栈更便宜或更容易购买。
