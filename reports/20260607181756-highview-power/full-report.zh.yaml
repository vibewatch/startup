    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品定位与商业模式转向
        blocks:
          - type: paragraph
            body: >-
              Highview 目前公开材料把公司描绘得不像部件供应商，更像解决方案驱动的能源基础设施公司。 官网、公司页和基础设施页合在一起说明，公司开发、融资、建设并运营电网级能源基础设施， 借助自研 R2X
              分析平台和一组技术组合，为政府、电网运营商和企业解决系统级问题。这个定位对尽调重要， 因为它暗示价值创造预期来自项目发起、融资、资产所有权和电网服务变现，而不是销售标准化电池箱。 Highview
              的旗舰自研技术仍是液态空气储能；公司把它包装成专利长时平台，既能把电力储存数小时、 数天或数周，也能提供稳定服务。项目页进一步拉宽这个定位，把 Carrington、Hunterston 和更广泛的
              英国项目描述成兼具长时储能和电网稳定功能的一体化基础设施平台。因此，当前公司叙事是以 LAES 为锚的 基础设施开发商逻辑，不只是低温硬件逻辑。
