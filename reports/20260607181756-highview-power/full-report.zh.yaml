  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Highview 解决方案
      - 可衡量收益
      - 限制
    rows:
      - - 吸收过剩可再生发电
        - 风电 / 太阳能出力超过本地需求，并面临弃电
        - 启动空气液化装置，把能量以液态空气储存
        - 把被弃电力转成可调度储能
        - 商业收入取决于调度规则和市场支持
      - - 持有数小时到数天的备用
        - 系统运营商需要比短时 BESS 窗口更长的时长
        - 低压低温储罐保存液态空气，供后续放电
        - 根据储罐规模，把时长从数小时延伸到数天或数周
        - Carrington 的具体商业持有损耗曲线未公开披露
      - - 在可再生短缺时回送电力
        - 低风或晚高峰造成容量需求
        - 泵送、加热、再气化，并让储存空气通过涡轮膨胀
        - 放电时不燃烧燃料，也能提供可调度清洁电力
        - 往返效率相对电池偏中等
      - - 提供同步电网支撑
        - 弱电网节点需要惯量、无功、电压和短路强度
        - 稳定性岛和同步设备提供非能源服务
        - 让同一场站同时服务储能和系统稳定性任务
        - 服务价值高度依赖地点和合同
      - - 借场站协同提高效率
        - 工业场站拥有废热、废冷或 LNG 式低温接口
        - 热集成提升液化 / 放电效率和系统价值
        - 可在纯套利之外增加效率和协同收益流
        - 最佳经济性取决于附近是否有合适的集成机会
      - - 分阶段建设混合项目
        - 开发商希望在完整储能完工前先获得电网服务收入
        - Hunterston 先分阶段落地稳定性服务，再增加混合储能容量
        - 缩短首项服务上线时间，并拓宽价值叠加
        - 跨多种技术增加架构和执行复杂度
    notes: 收益以系统运营商工作流来表述，而不是零售终端用户，因为 Highview 销售的是基础设施资产。
