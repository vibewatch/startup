      - CR029
      - CR030
      - CR031
      - CR032
      - CR048
      - CR049
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 这条决策链从项目验证和市场需求出发，穿过政策依赖与披露缺口，最终落到继续研究结论。
    data:
      nodes:
        - id: market
          label: 市场需求
          type: input
          detail: LDES 仍有政策关注，电网需求也是真实的。
        - id: proof
          label: 融资验证
          type: process
          detail: Carrington 和 Hunterston 说明，交易对手愿意出资支持首批项目。
        - id: competition
          label: 竞争压力
          type: process
          detail: 锂离子成本下探，把替代技术的经济窗口挤窄。
        - id: policy
          label: 政策依赖
          type: process
          detail: 项目能不能融到钱，cap-and-floor 和其他支持仍是核心。
        - id: disclosure
          label: 披露缺口
          type: process
          detail: 当前收入、估值和优先权瀑布都未公开。
        - id: decision
          label: 建议：继续研究
          type: output
          detail: 保持跟进，但投资判断要押在里程碑和条款上，而不是叙事上。
      edges:
        - from: market
          to: proof
          label: 支撑兴趣
        - from: proof
          to: competition
          label: 单独还不够
        - from: competition
          to: policy
          label: 抬高门槛
        - from: policy
          to: disclosure
          label: 让条款更关键
        - from: disclosure
          to: decision
          label: 让结论保持谨慎
        - from: proof
          to: decision
          label: 保留尽调价值
    approximationNotes: 这是一条投资委员会逻辑链，不是机械模型。它把多项公开事实压缩成仍然关键的最少决策关口。
    claimRefs:
      - CV006
      - CV015
      - CV028
      - CV029
      - CV033
      - CV034
      - CV035
      - CV045
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 随着项目与政策里程碑累积，相对估值支撑分随之变化。
    data:
      items:
        - label: Carrington 延误 + 政策推迟
          value: 15
          detail: 当前定价预期几乎得不到支撑；资本重组风险上升。
        - label: Carrington 按期，但无明确政策利好
          value: 35
          detail: 验证度提高，但融资质量和收入质量仍缺支撑。
        - label: Carrington + Hunterston 第一阶段取得进展
          value: 50
          detail: 两个旗舰资产提升可信度，但估值仍要看条款。
        - label: 叠加 cap-and-floor 明确性 + 收入披露
          value: 70
          detail: 公开证据开始支撑更硬的投资判断，而不是只支撑叙事。
        - label: 再加可复制项目融资和资产群路径
          value: 85
          detail: 到这一步，溢价基础设施式估值才开始说得通。
    approximationNotes: 分数是 100 分制的定性支撑分，不是美元价值。它们展示每个里程碑可能给估值信心增加多少边际支撑。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV036
      - CV037
      - CV038
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 把 100 设为相对上一轮未披露私募参考价的假设平轮，展示相对融资结果区间。
    data:
      items:
        - label: 悲观融资结果
          low: 40
          mid: 60
          high: 80
          unit: index
          note: 若里程碑不及预期，可能出现下调融资轮，或条款结构大幅加重。
        - label: 基准融资结果
          low: 80
          mid: 100
          high: 120
          unit: index
          note: 若进展参差、指标仍薄，结果可能持平或小幅改善。
        - label: 乐观融资结果
          low: 120
          mid: 150
          high: 180
          unit: index
          note: 运营风险解除后，可能上调融资轮，或获得更强的战略 / 基础设施估值标记。
        - label: 当前公开证据区间
          low: 60
          mid: 100
          high: 140
          unit: index
          note: 区间很宽，因为价格、收入和优先权披露仍不足。
    approximationNotes: 指数值不是 USD，也不假装知道当前私募价格。真实分母尚未披露时，这是一种有纪律地表达情景离散度的方式。
    claimRefs:
      - CV033
      - CV036
      - CV037
      - CV038
      - CV041
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 这张 IC 式记分卡说明：机会有吸引力，但公开证据还不足以定价。
    data:
      items:
        - label: 市场顺风因素
          value: 4/5
          detail: LDES 的系统需求和政策关注都是真实的。
        - label: 项目验证
          value: 3/5
          detail: 融资和建设已有验证，但稳态运营尚未验证。
        - label: 竞争防御性
          value: 2/5
          detail: LAES 在储能时长和系统服务角度有差异化，但锂离子仍是基准。
        - label: 披露质量
          value: 1/5
          detail: 当前收入、估值和优先股堆叠未公开。
        - label: 融资可得性
          value: 3/5
          detail: 公共资本和战略资本支持真实存在，但很可能带结构化条款。
        - label: 估值清晰度
          value: 1/5
          detail: 公开记录还无法锚定清晰的价格判断。
        - label: 退出准备度
          value: 1/5
          detail: 目前还看不到资产群指标，也看不到清晰的公开市场路径。
    approximationNotes: 分数是委员会定性速记，不是定量结果；它们总结截至 2026-06-07，公开记录能证明什么、不能证明什么。
    claimRefs:
      - CV020
      - CV021
      - CV026
      - CV039
      - CV040
      - CV044
      - CV045
