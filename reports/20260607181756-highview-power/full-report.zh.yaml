        - 已融资 >£500M；Carrington 在建；Hunterston 和 Killingholme 进入上限-下限评估
        - 受限节点的电网级 6h+ 储能加稳定服务
        - 长资产寿命、地上选址、同步稳定服务、基础设施资本渠道
        - 相比锂离子和 Energy Dome，公开效率较低，公开定价透明度弱
      - - Hydrostor
        - 直接竞争 / A-CAES 基础设施
        - 私营；7 GW 管线，含多个 500 MW 开发项目
        - 需要长寿命 8h+ 储能的公用事业公司和系统规划方
        - 50+ 年设计寿命、辅助服务，相比盐穴 CAES 可灵活选择硬岩场址
        - 仍需要洞室开发和大型项目执行
      - - Energy Dome
