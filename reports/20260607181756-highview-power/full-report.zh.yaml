  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与采购标杆
        blocks:
          - type: paragraph
            body: >-
              Highview 的相关竞争集不只其他低温储能开发商。买方可以用 Hydrostor 的 A-CAES 或 Energy Dome 的 CO2 Battery 等基础设施型机械系统、Form
              铁空气平台等多日级电化学系统、Invinity 或 ESS 的日循环液流系统、 Tesla 级供应商出售的在位锂离子项目，以及 Fluence 等集成商来解决同一个可靠性问题；地理条件允许时还可以用抽水蓄能。
              因此，采购不太取决于一项技术是否新颖，而更取决于它能否以可接受的风险调整成本，满足可融资性、时长、选址和 系统服务要求。Highview
              的确有差异化组合：当前英国项目把长时储能与同步稳定服务、惯量、电压支撑和无功功率结合起来。 但只有当节点确实重视这些服务时，这个组合才有意义。在任何主流 8-12
              小时招标里，如果买方主要想要最便宜、最成熟的容量， 锂离子仍是默认标杆；Highview 必须打赢、避开，或靠政策胜出。
