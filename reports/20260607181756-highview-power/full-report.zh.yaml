      - number: '7.4'
        title: 财务模型风险、竞争与投资逻辑断点
        blocks:
          - type: paragraph
            body: >-
              财务模型风险在于，Highview 仍像一个项目开发平台，经济性要靠推断，而不是观察。公开融资很亮眼，但也高度集中，并与政策背书或战略投资人深度纠缠。MIT
              的研究是有用外部校验，因为它认为补贴设计比工程效率更能决定 LAES 是否可投资；也就是说，即便技术可靠，如果政策桥梁变弱，电站仍可能难以融资。与此同时，锂电在 Highview
              想证明相关性的精确时长区间里持续降价、份额更高。Energy-Storage.news 报道了 BESS 系统价格下跌，也报道 2030 年管线中长时锂电占比达到 70% 或更高；2026
              年招标很可能决定非锂厂商能否跟上。这不等于 Highview 赢不了；它意味着胜利条件很窄，而且可以监测。只有 Carrington 在可信修订窗口内投运、Hunterston 赢得或明确推进
              cap-and-floor、管理层开始发布可用运营和收入证据、Highview 证明 LAES 能在电池或抽蓄等替代方案结构性更弱的节点创造价值，投资逻辑才成立。如果这些验证点一起滑坡，股权故事会很快断裂。
