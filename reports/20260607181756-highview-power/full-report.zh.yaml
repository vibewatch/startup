      - number: '1.3'
        title: 融资历史、投资者组合与资本结构信号
        blocks:
          - type: paragraph
            body: >-
              保留记录支持一个与项目交付直接绑定、分阶段推进的融资故事。2020 年，Sumitomo Heavy Industries 投资 US$46 million，并把 Sumitomo SHI FW 定位为全球
              CRYOBattery 部署的技术枢纽；这笔交易更像 战略性工业验证，而不是普通风险投资。2024 年 Carrington 融资标志着更大的转向。Highview 宣布由 UK Infrastructure
              Bank 和 Centrica 领投的 £300 million 投资包，Rio Tinto、Goldman Sachs、 KIRKBI 和 Mosaic Capital 也参与其中。National
              Wealth Fund 材料说明 UKIB 承诺 £165 million， Centrica 则披露了不同结构：Highview Enterprises 层面的 £25 million 可转债，以及
              Carrington 项目层面的 £45 million 债务。这一披露很有价值，因为它说明 Highview 越来越依赖控股公司层面和 项目层面的混合资本，而不是单靠股权。2025 年 11 月，公司又为
              Hunterston 一期宣布 £130 million 融资，参与方包括 Scottish National Investment Bank、Centrica、Goldman Sachs、KIRKBI 和
              Mosaic。 因此，公开来源支持公司已为商业化获得超过 £500 million，但不支持一张清晰的当前股权结构表、 估值或股东权利清单。
