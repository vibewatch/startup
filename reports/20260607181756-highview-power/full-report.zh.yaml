  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、用户与付款方分层由基础设施牵引
        blocks:
          - type: paragraph
            body: >-
              Highview 的“客户”通常是一个联盟，而不是单一软件预算所有者。公司当前项目材料把 Carrington 和 Hunterston
              描述为电网基础设施：吸收多余可再生发电、之后释放电力，并提供惯量、短路强度、电压支撑和频率响应等稳定服务。
              这种表述重要，因为技术用户、经济买方和最终付款方并不相同。技术用户是电力系统，以及需要灵活性和稳定性的电网节点。 可见的经济买方和发起方是项目开发商、战略能源伙伴，以及 UKIB/National Wealth
              Fund 和 SNIB 等公共或准公共资本配置方。 如果 Ofgem 授予受监管收入下限，最终付款方还可能通过 cap-and-floor 机制包括消费者。换句话说，Highview 卖的不是标准电池 SKU
              或企业工作流席位；它是在拼装站点专属基础设施包，在这些包里，系统收益、融资结构和监管批准 与客户关系不可分割。这就是为什么 Carrington、Hunterston 和面向 NESO 的价值主张位于本章中心，
              而不是一长串具名终端账户标识。
