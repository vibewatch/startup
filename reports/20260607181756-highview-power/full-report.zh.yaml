        - 地上、模块化、靠近受限节点
        - 比盐穴 CAES 灵活，但仍需要硬岩开发
        - 对外宣称几乎可部署在任何地点
        - 比重基础设施系统更产品化
        - 模块化电池选址优势
        - 主流项目中选址最容易，供应链最熟悉
      - - 电网稳定服务
        - 全套服务，包括惯量、电压支撑、无功功率、黑启动
        - 辅助服务，包括黑启动和频率响应
        - 对外推广物理惯量和多种备用服务
        - 主要提供电量时长和资源充裕性价值
        - 主要是电池式储能服务
        - 控制 / 软件能力强；同步稳定性的论证较弱
      - - 寿命 / 衰减姿态
