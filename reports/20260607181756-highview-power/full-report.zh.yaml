companyProfile:
  summary: >-
    Highview Power 是一家总部位于伦敦的长时储能公司，正以 CRYOBattery 品牌商业化液态空气储能， 同时把自己重新定位为更广义的能源基础设施开发商。公开证据支持大曼彻斯特在建的 300 MWh / 50 MW
    Carrington 项目、苏格兰已获一期融资的 3.2 GWh Hunterston 项目，以及到 2030 年在英国部署 6.4 GWh 的公开目标。公司把自研 R2X 分析、专利低温储能技术，以及来自
    UKIB/National Wealth Fund、Centrica、SNIB、Goldman Sachs、KIRKBI、Mosaic Capital 和早期 战略伙伴 Sumitomo Heavy Industries
    的公私混合资本拼在一起。2026 年 5 月，业务进一步转向 项目交付时，领导层从 Richard Butland 交接给 Peter Jones。
  foundedDate: '2005-01-01'
  founders:
    - name: Colin Roy
      role: 联合创始人兼董事长
      background: 公司 2024 年和 2026 年公开稿件显示，Roy 是联合创始人兼董事长，支持商业化推进。
      claimRefs:
        - CO017
  foundingLocation: London, UK
  headquarters: London, UK
  productSummary: Highview 围绕专利液态空气储能，开发、融资、建设并运营电网级长时储能和电网稳定资产。 LAES 流程用电把空气液化，存入绝热储罐，之后通过功率回收设备再气化，输出可调度电力， 并提供惯量、电压支撑等电网服务。
  customerFocus: 需要在大型电网节点获得长时电能时移和同步稳定服务的电网运营商、公用事业、公共基础设施资本提供方 和电力系统用户。
  businessModel: 项目驱动的基础设施模式，把分析、项目发起、融资、EPC / 伙伴交付，以及长时储能与稳定资产的最终运营结合起来。 收入应来自容量、辅助服务、电能时移和政策支持的项目框架，而不是纯设备销售。
