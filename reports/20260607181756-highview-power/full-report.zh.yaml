        - 私营；独立报道突出 300 MW / 100 小时 Xcel-Google 项目和工厂爬坡
        - 多日清洁稳供和韧性应用
        - 100 小时时长和强多日产品叙事
        - 可融资性仍取决于能否证明可重复商业交付
      - - Invinity
        - 替代方案 / 钒液流电池
        - 公开披露日程可见；Endurium 在印度面向公用事业和 C&I 规模推广
        - 高循环公用事业、C&I 和长寿命日循环项目
        - 100% 放电深度、30+ 年寿命、无限循环主张
        - 保留的公开材料没有显示 FID 后 GWh 级项目深度
      - - ESS
        - 相邻基准 / 铁液流电池
        - 上市公司 IR 网站和公用事业 / 商业定位
        - 需要温和材料的商业和公用事业长时储能
        - 铁、盐和水化学体系，叠加非锂供应叙事
        - 商业规模和财务韧性看起来弱于本章领先者
