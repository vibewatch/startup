      - number: '7.3'
        title: 监管、法律与交易对手依赖风险
        blocks:
          - type: paragraph
            body: >-
              Highview 的监管风险和商业风险贴得异常近。英国政府称，LDES 在现有市场框架下难以部署，cap-and-floor
              正是因此存在；这是利好政策，同时也直接证明市场还没有在无支持情况下验证这一资产类别。Hunterston 和 Killingholme 仍在走资格和消费者收益评估，时间表暴露在 Ofgem 与 NESO
              的流程风险下。法律披露也比公开市场投资者希望看到的更薄。Companies House 记录确实透露了一些有用事实——包括控股母公司、2026 年 5 月董事会变动、Highview Power Limited
              截至 2025 年 8 月的休眠公司账目，以及该实体页面零登记担保——但这些披露仍没有回答更难的承销问题：项目 SPV 担保、债权人间条款、清算优先权，或合作方否决权。交易对手集中让问题更重。Centrica
              拥有明确的未来股权参与和能源优化权；UKIB 或 NWF、SNIB、Goldman、KIRKBI 和 Mosaic 反复出现在可见资本栈里；专业交付仍依赖 SHI FW 与
              Sulzer。净结果是一张依赖图：监管、融资和少数合作伙伴可能同时拖慢规模化。
