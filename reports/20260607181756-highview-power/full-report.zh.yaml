      - number: '2.2'
        title: 规模测算视角：全球 TAM、英国 SAM 与 Highview SOM
        blocks:
          - type: paragraph
            body: >-
              测算这个市场需要几副镜头，而不是一个宏大的 TAM 数字。最宽的镜头是全球：Business Wire 发布的 ResearchAndMarkets 摘要把 2026-2046 年长时储能机会框在约 $1
              trillion。这个数字可用来判断方向， 但对承销太宽，因为它横跨许多技术、国家和使用场景。同一摘要还明确警告，互联、电网扩建和其他系统变化等 替代路径，可能显著降低最终 LDES
              需求。更可投资的镜头是英国政策支持市场。Clean Power 2030 称， 英国到 2030 年需要 4-6 GW 长时电力储能，并配套 23-27 GW 电池；POWER Magazine 又把它折算成
              能量容量视角：约 58 GWh 非电池储能和 34 GWh 电池。


              Highview 合理可服务市场还要更窄。它已点名的近端英国管线是 Carrington 加上 Hunterston 和 Killingholme 两个 3.2 GWh 项目；如果全部推进，约为 7
              GWh，而更广泛项目声称有超过 16 个站点和 超过 £10 billion 基础设施机会。这听上去很大，但竞争镜头依然令人冷静：Energy-Storage.News 称， 以 2030 年运行为目标的
              64.7 GWh 全球跨日管线中，锂离子已占 70%；Modo 称，尽管融资数十亿美元， 中国以外的替代 LDES 运营规模仍低于 1 GWh。正确结论是，Highview 的 SAM 是英国等市场里由政策支持、
              非电池、对电网关键的储能，而不是整个醒目的全球 LDES 宇宙。
