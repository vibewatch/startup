      - number: '8.4'
        title: 尽调问题与投资逻辑断点
        blocks:
          - type: paragraph
            body: >-
              最后尽调清单因此直接而严苛。第一，投资人需要当前股权结构表和所有重大条款文件：可转换工具、合作方权利、项目级债务担保、清算优先权，以及任何可能让新钱处于次级地位的保留事项。第二，需要用数字而不是营销语言呈现
              Carrington 和 Hunterston 的商业模型：预期收入组合、合约收入与商户敞口、利用率假设、下限或上限支持，以及与投运绑定的运营
              KPI。第三，需要普通公司财务数据；私营公司常把这些挡在公开记录之外，但在这里必不可少：现时收入、利润率、管理费用负担和烧钱速度。没有这三桶证据，估值意见其实只是情绪分。投资逻辑也有清晰断点。Carrington
              重大进度滑坡、cap-and-floor 结果不佳，或一套显著偏向既有内部人而非新普通股的融资方案，都会迅速削弱个案。正确公开姿态不是敌意，而是由明确里程碑和条款清单阈值支撑的条件性。
