      - - Fluence
        - 上市储能集成商和软件平台
        - 上市申报主体披露面广，2026 年仍有融资活动；实时市场倍数波动大，此处不直接套用。
        - 它是规模化储能平台最佳披露基准。
        - 不是纯 LDES 或 LAES 对标，业务也分散得多。
      - - ESS Tech
        - 上市铁液流储能厂商
        - 上市非锂基准，具备投资者披露和替代化学路线定位。
        - 说明替代储能公司即便资本开支重，仍能进入公开市场。
        - 化学路线、用例组合和规模不同。
      - - Eos Energy
        - 上市锌基储能厂商
        - 上市公司，保持 SEC 文件披露节奏，并围绕专利技术讲故事。
        - 可作为披露深度和制造型替代储能的参考。
        - 化学路线、地域和商业化模式都不同于 Highview。
      - - Invinity
        - AIM 上市钒液流公司
        - 公开市场参照，有投资者门户，且 2026 年市场开发仍在推进。
        - 欧洲式市场中最接近的上市纯替代化学储能参照。
        - 规模更小，时长画像不同。
      - - Form Energy
        - 私营铁空气多日储能平台
        - 私营前沿对标；公开技术材料强调 100 小时时长，而非披露当前估值。
        - 可作为上限时长基准，显示部分同业目标比 Carrington 走得更远。
        - 保留来源未公开其私人定价和当前收入。
      - - Energy Dome / Hydrostor / 抽水蓄能框架
        - 机械式或基础设施式长时储能参照
        - 可作为基础设施型储能的状态基准，而不是软件式估值基准。
        - 支持采用基础设施逻辑和政策调整后的承销判断。
        - 技术、场址和地质差异足够大，无法干净迁移倍数。
      - - 锂离子基准
        - IEA 加 2026 年价格压缩报道
        - 成本快速下行、可融资性强，是部署端主导基准。
        - 界定了 Highview 必须在时长、安全或节点价值上打穿的门槛。
        - 锂离子并非 LAES 的直接可比对象，但为许多招标设定了市场上限。
    notes: 这份枚举刻意不求完整，而是服务建模。它混合上市公司、私营同业和基础设施参照，因为没有一个可比篮子能干净覆盖 LAES。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and semi-public long-duration references available in retained 2026
        materials, emphasizing disclosure standards, technology class, and commercialization model rather than
        pretending Highview has a clean live multiple analogue.
