      - number: '2.4'
        title: 增长驱动、约束与反向观点
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑很直接：政策已经存在，系统需求清晰，Highview 的 LAES 平台可以在抽水蓄能或 CAES 难以落地的地方， 把时长与电网稳定服务结合起来。Clean Power 2030
              给英国市场设定了官方长时目标，cap-and-floor 机制降低了收入风险， Highview 材料强调选址灵活、循环无衰减和 40-50 年资产寿命。Energy Solutions 认为，LAES
              最适合密集城市电网和 工业集群；在这些地方，余热或余冷可以改善经济性，同步稳定也有独立价值。这个组合能让 LAES 具备相关性， 即便它永远不会成为每个节点最便宜的储能技术路线。


              反向逻辑同样强。IEA 称，2025 年全球新增 108 GW 电池储能，约 90% 部署采用 LFP； Energy-Storage.News 称，锂离子已经控制全球 8-12 小时管线的
              70%。成本下降进一步加固了这一领先： Energy-Storage.News 引述 4 小时 BESS 为 $110/kWh、固定式电池包价格为 $70/kWh、电池 LCOS 约 $65/MWh。
              在这个背景下，Energy Solutions 把早期商业化 LAES 放在约 $120-200/MWh、往返效率 50-65% 的位置， Energy China
              仍指出压缩机和蒸发器存在基础热力学瓶颈。抽水蓄能也仍是在位标杆，即使各方估计在 美国公用事业级储能中占 88% 到约 95% 不等。因此，Highview 能赢的市场比泛泛 LDES 叙事暗示的更窄：
              在受限节点，由政策支持、非电池采购，同时需要电能时移和电网稳定的项目。
