        title: 切换成本、替代品与多技术并用
        blocks:
          - type: paragraph
            body: >-
              Highview 的切换成本真实存在，但出现得晚。在项目拿到土地、并网、债务和稳定资产设计之前， 买方仍可以选择锂离子、抽水蓄能、液流电池、CO2 电池或 A-CAES。然而，一旦授标和融资包到位，
              Highview 就难以被替换，因为项目架构已经嵌入土建工程、输电假设、伙伴权利和长寿命服务预期。 这让 Highview
              更像基础设施平台，而不是可随时替换的电池供应商。即便如此，系统规划方也不太可能在所有任务上 标准化到一个赢家。地理条件合适时，抽水蓄能仍是成熟的长时在位方案；锂离子主导主流 8-12 小时采购；
              替代长时资产则会被放进那些对时长、选址灵活性或独立稳定服务足够重视、足以证明复杂度合理的更窄节点。 因此，多技术并用是基准情景：公用事业可以用电池做日循环，用抽水蓄能做地理条件偏好的大宗储能， 用
              Highview 式资产服务那些需要更专门组合的受限节点。
