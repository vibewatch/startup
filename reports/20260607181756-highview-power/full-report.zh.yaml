        - 保留材料无公开单价；100+ MW A-CAES 采用项目开发模式
        - 长时储能加辅助服务，并可后续扩展
        - 土建、地质和融资结构因场址而异
        - 买方核保 Hydrostor 更像核保基础设施，而不是电池 SKU
      - - Form Energy
        - 独立报道复述公司说法：系统成本低于锂离子的十分之一，但未披露已实现合同价格
        - 100 小时多日储能加规划软件
        - 公开成本说法只是方向性，不是同口径交付价格
