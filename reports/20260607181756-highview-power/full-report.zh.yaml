      - number: '4.3'
        title: 牵引力代理、单位经济信号与缺失项
        blocks:
          - type: paragraph
            body: >-
              Highview 的公开牵引力是真实的，但主要是项目规模牵引力，而不是收入牵引力。保留记录支持 Carrington 在建、 两个 3.2 GWh 项目进入英国 cap-and-floor 漏斗、超过 16
              个已识别英国站点、到 2030 年英国交付 6.4 GWh 的目标，以及从 Carrington 700 个岗位到 Hunterston 现场 1,000 个加供应链 650 个岗位的
              就业声明。这些是有意义的商业化代理指标，因为它们显示选址进展、发起方兴趣和政策相关性。但它们不能替代收入质量。
              公开来源没有披露收入、年经常性收入（ARR）、毛利率、EBITDA、客户数量、员工数、现金余额、月度烧钱速度或签署的 承购经济性。独立技术和市场来源也说明这些缺失字段为什么重要：一份综合材料显示早期商业化
              LAES 仍在 120–200 USD/MWh 左右，往返效率通常为 50–65%，即便支持性的行业报道也指出电池常在资本开支、运营开支和效率上胜出。 换句话说，Highview
              的公开证据足以证明资本形成和实体雄心，但不足以证明有吸引力的单位经济或耐久利润率。
