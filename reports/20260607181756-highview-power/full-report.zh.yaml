  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              Highview 的公开证据足以支持继续研究，但不足以支撑价格确定性。作为一家私人长时储能开发商，记录中的正面部分很扎实：Carrington 真实存在、已获融资且在建；Hunterston
              已从概念进入有资金支持的一期执行；公司也说服公共和战略资本方支持首台套项目，而多数 LDES
              同行仍只把这类项目当愿景描述。负面部分对估值更重要。保留的公开来源没有给出现时收入、ARR、利润率或最新股权估值。可见资本结构已经包括可转债、项目债、合作方权利和不完整的公共登记信息。因此，公开结论应是价格纪律，而不是热情。估值缺失并不会默认意味着便宜；它只意味着披露不足。仅凭公开证据，本章结论因此落在继续研究、高风险、估值立场未知；除非管理层披露现时融资条款、运营指标，以及普通股在项目融资栈之后到底如何排序。
