      - number: '5.3'
        title: 成熟度、试点历史、IP 与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Highview 最强的技术成熟度证据，是它已经穿过多代实体设备，而不是停留在 PPT。公开技术和伙伴来源可追溯到更早的 Slough 示范装置，再到 2018 年 4 月开始运行的 5 MW / 15 MWh
              Pilsworth 电站；后者使用垃圾填埋气发动机余热， 并展示了 STOR 和冬季峰值平衡。下一步是 Carrington，它从试点任务进入首个商业规模，随后是 Hunterston 和其他 英国站点的
              Millennium Series 扩展。差异化主张不只是“液态空气”，而是 Highview 的流程集成：其专利组合覆盖 压缩热储存、空气净化集成、压力控制、冷能捕集，以及与独立热过程耦合。Highview
              还披露 BLU 是核心控制器、 R2X 是电网分析平台，暗示软件和控制对调度优化和电站配置重要，尽管公开材料对这些层的技术深度仍然很薄。
              总体看，证据支持公司在热集成和系统架构上有真实技术积累，但也显示唯一公开讨论的实测电站数据仍来自试点谱系， 而不是来自风险已充分出清的商业资产群。
