  - id: TV005
    title: 投资逻辑破裂与终止触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - Carrington 错过可信通电窗口
        - 出现实质延期，且没有透明的修订 KPI 路径
        - 融资证明就少了通往运营证明的最清晰路径。
        - 冻结估值乐观假设，重估完整商业化时间表。
      - - Hunterston 或其他英国项目未能通过 cap-and-floor 支持推进
        - 政策明显延迟或授标结果不利
        - 削弱可融资性，提高控股公司层面融资稀释的概率。
        - 降低乐观情景权重，并假设融资条款更苛刻。
      - - 2026 年招标中，锂离子经济性继续压低替代储能
        - 成熟电池系统在 8 小时用例上继续占住经济重心
        - LAES 能拿到溢价经济性的可寻址窗口收窄。
        - 要求拿出节点级证据，证明 Highview 能在电池赢不了的地方取胜。
      - - 优先股堆叠比公开线索显示的更差
        - 可转债、债务或合作方权利实质性压低新普通股地位
        - 即便项目执行强，收益也未必传导到普通股上行。
        - 没有条款单保护或价格重置，不投资。
      - - 尽调中仍看不到当前财务披露
        - 收入、利润率和烧钱速度即便在私人工作流中仍不透明
        - 估值仍是叙事练习，而非承销练习。
        - 维持继续研究，或转向回避。
      - - 首个项目证明之后，退出路径仍停留在假设
        - Carrington 之后没有重复场址融资、战略兴趣或组合指标
        - 故事会变成一个例外项目，而不是可扩展平台。
        - 限制持仓规模，为证据持有，不为叙事上行持有。
    notes: 这些触发因素必须可观察，并直接连接融资风险、稀释风险，或项目成功转化为企业价值的能力。
    claimRefs:
      - CV015
      - CV017
      - CV030
      - CV031
      - CV032
      - CV038
      - CV040
      - CV041
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调索要清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前股权估值
        - 最新投后估值、股数，以及任何老股交易标记或内部估值备忘录
        - 没有当前分母，估值立场就应保持未知。
        - 向管理层和律师索取董事会材料或融资文件。
      - - 优先股与稀释瀑布
        - 可转债条款、清算优先权、保留事项、项目债务担保包和合作方权利
        - 即便项目执行成功，权利也可能主导普通股结果。
        - 获取股权结构模型以及所有条款清单和附函。
      - - Carrington 商业模型
        - 按套利、稳定服务、合同期限和运营 KPI 目标拆分的收入组合
        - 这是项目故事通向企业估值的桥。
        - 索取项目模型、敏感性材料和月度 KPI 包。
      - - Hunterston 和 Killingholme 政策经济性
        - 实际 cap-and-floor 条款、下行底线、上行上限和决策时间
        - 政策支持是可融资性投资逻辑的关键部分。
        - 索取当前监管工作流和任何评估结果草案。
      - - 公司财务
        - 当前收入、毛利率、运营开支、烧钱速度和现金跑道
        - 缺少普通财务质量指标，无法承销私人估值标记。
        - 索取最新管理账和相对前期内部预算的桥接。
      - - 项目组合扩张证明
        - 证明 Carrington 能带出融资质量相近的第二、第三个可复制项目的证据
        - 企业价值取决于可复制性，而不只是一座旗舰电站。
        - 按项目索取管线转化数据、场址排名和融资沟通。
    notes: 问题按阻断决策的重要性排序：估值和条款堆叠清晰度优先，其次是运营经济性，最后是可复制性。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV030
      - CV031
      - CV040
      - CV041
      - CV045
