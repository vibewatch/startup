  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 投资逻辑
      - 反向逻辑
      - 会改变判断的因素
    rows:
      - - 旗舰项目验证
        - Carrington 和 Hunterston 表明 Highview 已从试点叙事迈向获得融资的商业资产。
        - 这些资产仍然集中、尚未验证，也还不是多元化运营资产组合。
        - Carrington 的运营可用率和调度数据会把融资验证变成性能验证。
      - - 政策路径
        - 在单靠商户经济性无法支撑的地方，上限-下限机制可让高资本开支 LDES 具备融资可行性。
        - 依赖政策也证明，独立市场尚未在无辅助条件下验证这一资产类别。
        - 最终授标条款、时间和项目特定下行保护，比新闻标题更重要。
      - - 基础设施资本支持
        - UKIB/NWF、SNIB、Centrica 和其他支持方意味着严肃机构相信这些项目可融资。
        - 同一批投资人也可能持有权利、债权或优先权，稀释普通股上行。
        - 清晰的股权结构瀑布和新资金保护会改善股权投资逻辑。
      - - 技术定位
        - BNEF 提示，在合适市场中，一些 LDES 技术在超过 8 小时场景可打败锂离子。
        - 锂离子持续降本，仍是 2025–2026 年部署的主导基准。
        - 节点特定经济性若能清楚证明 LAES 优于电池，会让投资逻辑更锋利。
      - - 可比公司组
        - 公开同行有助于框定披露标准和资本强度。
        - 它们差异太大，无法干净地把倍数模型迁移到 Highview。
        - 披露 Highview 收入基数和项目现金流桥，会让可比公司分析更有用。
      - - 退出准备度
        - 基础设施式去风险最终可能支持战略买家或基础设施资本退出。
        - 留存公开来源今天没有显示 IPO 路径、资产组合指标或可重复的经常性经济性。
        - 第二、第三个融资落地场站加上运营 KPI，会让退出路径更具体。
    notes: 每行把一个有效正面信号与其仍无法仅靠公开证据消除估值模糊性的原因配对。
