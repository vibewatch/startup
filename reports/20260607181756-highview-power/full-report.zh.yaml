  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 过程 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - 空气清洁与净化
        - 在深度冷却前去除水分和污染物
        - 吸附和净化硬件必须可靠再生
        - 杂质突破会损害冷箱性能和下游设备
      - - 压缩与液化列车
        - 用电力压缩、冷却、膨胀并液化环境空气
        - 压缩机效率、换热和冷箱集成驱动性能
        - 循环压缩机损耗是已知的试点瓶颈
      - - 保温液态空气储罐
        - 提供低压低温能量储库
        - 储罐保温和蒸发管理支撑时长声明
        - 公开来源未披露 Carrington 的商业持有损耗数字
      - - 泵、换热器和涡轮放电列车
        - 给储存的液态空气加压、升温、再气化并膨胀发电
        - 需要可靠涡轮机械和稳定热输入
        - 蒸发器和涡轮工况会实质影响输出和效率
      - - 热储存与冷量回收
        - 捕捉压缩热，并复用放电冷量，以提升循环性能
        - 依赖匹配良好的热流体、换热器和场站集成
        - 热集成薄弱会削弱相对电池的经济性
      - - 控制与分析层（BLU / R2X）
        - 优化电厂运行、灵活性模式和电网建模假设
        - 需要可靠软件、传感器和安全的运营商工作流
        - 公开架构、网络安全和运营商界面披露仍然很薄
    notes: 该架构表仅反映公开披露层级；不是内部 P&ID 或控制叙事。
