      - number: '7.2'
        title: 技术、投运与运营执行风险
        blocks:
          - type: paragraph
            body: >-
              Highview 的关键技术风险，不是压缩机、泵、储罐或涡轮机单独多么前沿；风险在于第一座商业 LAES
              电站必须让整套低温系统在电网规模协同运行，并守住可接受效率、可靠性和进度纪律。独立评估态度建设性，但并不宽松。Energy Solutions 认为实际往返效率约 50% 至 65%，早期商业 LCOS 可能落在
              US$120–200/MWh；pv magazine 的冷储能综述则称，低温冷量损失可能主导整体表现，经过实验验证、可放大的设计仍比漂亮仿真更重要。Sulzer 对 Carrington
              供货包的说明既有利也不利：它确认 Highview 在使用可信的工业供应商，但也说明项目必须高效整合低温和熔盐系统，并带有 14 个月制造和交付窗口。SHI FW 的交钥匙许可页面同样支持 Highview
              可以借助成熟 EPC 能力的判断，但也暴露这种能力很集中。实际承销含义很简单：成熟部件降低科学风险，却不能消除集成、交付周期、控制或投运风险；保留的公开来源中，仍没有商业可用率、SLA 或 Carrington
              实测 RTE 数据。
