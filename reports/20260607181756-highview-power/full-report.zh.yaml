    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Highview 当前公开材料指向的是基础设施变现模式，而不是简单设备销售模式。公司的项目、基础设施和战略投资页面都描述了
              一个开发、融资、建设、拥有并运营长时储能和电网稳定资产的业务，同时保留未来通过资本循环、许可、分析和 Clean Energy as a Service 变现的可能。实际含义是，Highview
              似乎靠拿下项目站点、设计资本结构、建设资产， 再在数十年里把一组电网服务变现来获取价值，而不是为类似电池的 SKU 发布可复制标价。变现栈本身部分可见： Carrington 和 Hunterston
              被描述为把电能时移与同步惯量、无功功率、电压支撑、短路强度和频率服务结合起来的资产； Centrica 披露的未来能源优化权利也暗示，调度和优化经济性同样重要。缺失的是股权承销方通常最想看的商业层：
              没有公开价目表，没有每 MWh 已实现定价，没有披露利用率，也没有公开拆分多少收入应来自监管支持、商户套利、 辅助服务、许可或分析。因此，这个模式作为基础设施是可读的，但作为收入引擎仍然不透明。
