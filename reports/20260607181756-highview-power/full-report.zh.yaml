            title: 项目融资和政策支持早于公开运营经济性到位
            body: >-
              Highview 显然已经跨过一个有意义的融资门槛，但公开记录看起来仍像收入前的基础设施商业化， 而不是成熟运营业务。Carrington 在首次商业运营前需要 £300 million
              融资包，Hunterston 一期又需要 £130 million，cap-and-floor 支持仍是后续项目的闸门机制。对长寿命基础设施而言，这不必然是负面，
              但意味着公开投资者先承销融资架构和执行逻辑，之后才有条件承销已验证的现金生成。
