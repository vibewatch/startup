      - number: '1.4'
        title: 项目管线、规模指标与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              Highview 的经营规模仍主要由项目和管线证明，而不是由收入或客户数量披露证明。多个来源一致指向： Carrington 正在建设，是一个 300 MWh / 50 MW 的首个商业规模 LAES
              平台，先做稳定岛首期， 目标在 2026 年运行。公司更新的英国材料显著拉大了雄心：超过 16 个已识别英国站点、可为 7.6 million 户家庭供电、超过 £10 billion 基础设施投资，以及到
              2030 年在英国交付 6.4 GWh 的公开目标。 Hunterston 也在演进。较早的 2024 年说法把下一波描述为 2.5 GWh 电站，而 2025 年融资和 2026 年 cap-and-floor
              报道则描述一个 3.2 GWh 混合设施，先做电网稳定首期，之后完整建成。 这些差异不削弱核心方向，但确实说明 Highview 的项目在从概念走向项目融资时不断被重新界定。
              公开里程碑覆盖最强的是融资、破土、获得英国支持框架资格，以及聘用基础设施经验更重的高管团队； 在经审计运营表现、客户合同和已实现项目现金生成上仍然薄弱。
