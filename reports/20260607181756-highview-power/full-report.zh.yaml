              本章必须明确说明哪些内容没有披露。保留公开来源没有给出 Carrington 或 Hunterston 的当前客户数、NRR、GRR、
              流失率、续约节奏、合同长度、最低收入保证、满意度分数或队列表。唯一可见的重复参与信号是伙伴持续性： Centrica 出现在 2024 年 Carrington 融资中，又出现在 2025 年
              Hunterston 一期轮中；这说明关系有延续， 但不能替代收入留存证据。扩张证明同样由管线牵引，而不是由队列牵引。Highview 引述超过 16 个已识别英国站点， 以及到 2030 年 6.4 GWh
              的雄心；cap-and-floor 资格也推进了 Hunterston 和 Killingholme， 但这仍描述的是开发漏斗，而不是已披露的已安装客户资产群。因此，在 Carrington
              投运、Hunterston 推进到一期之后、 管理层披露实际运营合同、调度重复性和对手方集中度之前，投资者必须把留存和扩张视为默认空白字段。 正确的尽调姿态是有纪律的怀疑，而不是强行精确。
