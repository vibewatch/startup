        title: 集中度与采购风险仍是主要反向视角
        blocks:
          - type: paragraph
            body: >-
              反向情形很直接。公开可见的商业进展集中在少数超大型英国项目上，而这些项目仍依赖漫长采购周期、技术资质审查和公共政策支持。Ofgem 和 NESO 还必须完成 Hunterston 与 Killingholme
              的消费者收益分析和 cap-and-floor 决策。NESO 自身的 2026 年稳定性市场结果也说明，电网服务变现这条路要求很高：第二轮授出 5 份合同、覆盖 7.3 GVA.s
              惯量；独立报道称，没有电池储能投标跨过技术门槛，同步调相机和燃气资产拿到了合同。这并不直接推翻 Highview
              的投资逻辑，但说明市场保守、技术门槛会收紧，新型储能资产必须通过严苛研究后才有变现资格。再叠加具名客户披露很薄、可见进展集中在 Carrington 和
              Hunterston，客户章节更像一组承销问题，而不是广泛账户分散化。若这些旗舰项目跑通，Highview 仍可能赢得很大；但今天的商业故事仍然集中、受政策中介，而且推进缓慢。
