  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: uk-ldes-sizing
    missingEvidence: An official DESNZ or NESO publication that translates the 4-6 GW long-duration target into energy, duration mix, and technology allocation comparable with 58 GWh / 34 GWh secondary estimates.
    whyItMatters: Investors can only turn policy ambition into underwriting models when power, energy, duration, and technology share are expressed in one coherent framework.
    diligencePath: Pull the full NESO advice appendices and any later DESNZ implementation papers that quantify long-duration need by duration bucket and technology family.
    relatedQuestionRefs:
    - QM007
    relatedTableRefs:
    - TM002
  - type: stale
    severity: material
    topic: cap-floor-awards
    missingEvidence: The final Q2 2026 Ofgem award list, cap/floor settings, and winning technology mix for window one.
    whyItMatters: Until awards are published, the precise share of UK policy-backed LDES that goes to non-battery assets remains unknown and Highview's likely SAM cannot be sized confidently.
    diligencePath: Re-run the chapter after Ofgem publishes final decisions and replace eligibility-stage claims with actual award outcomes and project economics.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: revenue-stack
    missingEvidence: Project-level contracted revenue stack for Carrington and the follow-on UK projects, including ancillary services, curtailment value, floor support assumptions, and any named offtakers.
    whyItMatters: Without customer-level revenue visibility, market attractiveness can be described qualitatively but not converted into durable project IRR, payback, or valuation support.
    diligencePath: Request lender materials, term sheets, or sponsor presentations showing contracted and merchant revenue mix by project and by service line.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
    - TM004
