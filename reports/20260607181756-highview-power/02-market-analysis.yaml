- id: buyers-payers-and-procurement-path
  title: Buyer, Payer, and Procurement Path
  body: |-
    The buyer stack in UK LDES is indirect. DESNZ and Ofgem set the market design, NESO identifies system need, developers and sponsors submit projects, infrastructure investors and strategic capital fund them, and utilities or traders may ultimately monetize dispatch and ancillary services. In that sense, the end-user is the electricity system rather than a single customer account. Budget ownership first sits with project sponsors and lenders, but downside support is structured around a consumer-backed floor through regulated mechanisms if needed. That is why long-duration storage currently looks more like an infrastructure underwriting problem than a normal equipment sale. Carrington’s £300 million financing package, including £165 million from the National Wealth Fund, is a better read-through on market access than any headline about installed battery megawatt-hours.

    The adoption path is also policy-mediated. Ofgem’s first cap-and-floor window opened in April 2025, processed 171 bids, deemed 77 projects eligible, and is due to make final award decisions in Q2 2026. Highview already sits inside that funnel: Carrington is under construction, while Hunterston and Killingholme have cleared eligibility and moved into the next assessment stage. Adoption triggers are therefore not just falling equipment costs but curtailment reduction, inertia and voltage needs, and the appeal of long-life, regulated-like assets to infrastructure investors. For Highview, proof of bankability comes from surviving this process and converting shortlisted projects into award-backed construction, not from technology marketing alone.
