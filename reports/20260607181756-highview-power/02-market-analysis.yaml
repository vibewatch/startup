callouts:
- calloutType: insight
  title: The real market is policy-defined UK flexibility, not a generic global storage TAM
  body: The broad global LDES story is large enough to support impressive slides, but the underwritable market for Highview is the UK subset where policy, duration thresholds, and grid-stability needs are explicit. That is why official UK targets and Ofgem process milestones matter more than the $1 trillion global headline.
  claimRefs:
  - CM001
  - CM002
  - CM034
  - CM035
  - CM036
- calloutType: risk
  title: Lithium-ion is the default 8-12 hour benchmark Highview must beat or avoid
  body: Battery deployment scale, LFP dominance, and falling pack and system costs mean the mainstream 8-12 hour market is not waiting for LAES. Highview either has to win nodes that value duration plus stability plus locational flexibility, or secure policy-backed carve-outs where non-lithium assets can clear despite lower efficiency and higher project complexity.
  claimRefs:
  - CM020
  - CM021
  - CM026
  - CM027
  - CM028
  - CM045
- calloutType: insight
  title: Highview’s best-fit niche is a hybrid storage-plus-stability platform at constrained nodes
  body: 'Carrington’s spec sheet is revealing: the market case is not just six hours of discharge, but also inertia and reactive power at a strategic demand-center location. If that multi-service value stack is real and repeatable, Highview has a more defendable position than a pure-duration comparison against batteries would suggest.'
