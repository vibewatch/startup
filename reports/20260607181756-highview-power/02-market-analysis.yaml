- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cap-and-floor revenue certainty
    - Driver
    - 2025-2026 and beyond
    - Reduces merchant-risk hurdle and makes long-life projects more financeable
    - Model floor/cap terms once final awards are published
  - - Clean Power 2030 flexibility target
    - Driver
    - To 2030
    - Creates an official policy-backed need for long-duration storage
    - Check whether 4-6 GW target converts into actual procurement volumes
  - - Curtailment and grid-stability needs near demand centres
    - Driver
    - Current and rising with renewable build-out
    - Favors hybrid platforms that can shift energy and deliver inertia/reactive power
    - Quantify monetizable stability-service revenue by node
  - - Long asset life and no-degradation operating claim
    - Driver
    - Multi-decade underwriting horizon
    - Can appeal to infrastructure capital if real operating evidence emerges
    - Validate lifecycle economics against operating data rather than marketing
  - - Falling lithium-ion system and pack costs
    - Constraint
    - Current 2025-2026
    - Compresses the 8-12 hour window where LAES hopes to compete
    - Stress-test LAES against $110/kWh four-hour BESS and battery LCOS benchmarks
  - - Lithium-ion dominance of the inter-day pipeline
    - Constraint
    - To 2030
    - Suggests policy and finance may still back batteries over non-lithium options
    - Track 2026 UK and international tender results by technology
  - - LAES efficiency and custom project complexity
    - Constraint
    - Current
    - Lower RTE and bespoke EPC raise dependence on policy support and site synergies
    - Request realized efficiency, CAPEX, and heat/cold-integration assumptions
  - - Pumped hydro / CAES benchmark where geography works
    - Constraint
    - Long-term structural
    - LAES is unlikely to be first choice everywhere long-duration storage is needed
    - Map which target sites truly require flexible siting or stability co-benefits
  notes: 'This is a market-level register, not a company risk register. Several drivers and constraints can be true simultaneously: UK policy now supports LDES, but lithium-ion pricing and incumbent deployment scale still make the investable market narrower than headline TAM narratives suggest.'
