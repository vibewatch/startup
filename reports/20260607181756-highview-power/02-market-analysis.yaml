- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - UK cap-and-floor-backed 8h+ LDES assets
    - Project development, storage block, EPC, grid connection, cap-floor licensed revenue model
    - Short-duration BESS below the 8-hour threshold
    - Developer and infrastructure investors; downside support socialised through regulated scheme if triggered
    - Core addressable market for Highview
  - - Hybrid storage + grid-stability platforms
    - Inertia, reactive power, voltage support, black start, curtailment reduction with storage
    - Standalone synchronous condensers or single-service stability assets
    - Transmission-system need, project sponsor, and consumers through network value
    - Important because Carrington combines storage with stability services
  - - Short-duration utility batteries
    - 2-4 hour energy shifting and ancillary services
    - Long-duration contracted capacity and multi-service stability platforms
    - Utilities, IPPs, traders
    - Adjacent substitute and strongest adverse incumbent
  - - Pumped hydro and CAES
    - Bulk long-duration storage where geography or subsurface conditions work
    - Urban or geology-constrained nodes without water/cavern options
    - Utilities, governments, infrastructure owners
    - Benchmark long-duration substitutes
  - - Gas peakers and curtailment management
    - Capacity, reserve, renewable-spill mitigation, system balancing
    - Storage asset ownership itself
    - System operators and end consumers
    - Status-quo costs LAES tries to displace
  - - Industrial-cluster or dense-urban LAES deployments
    - Storage plus waste-heat/cold integration near load centres
    - Remote geologically constrained storage sites that do not need locational flexibility
    - Developer plus industrial host or utility partner
    - Best-fit niche if LAES economics are supported by local system value
  notes: Included spend is defined by the system job to be done, not by electrochemistry alone. The core boundary is 8-hour-plus grid-scale infrastructure plus stability services; short-duration batteries remain adjacent substitutes rather than the same market.
