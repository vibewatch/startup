- id: sizing-lenses-and-uk-sam
  title: 'Sizing Lenses: Global TAM, UK SAM, and Highview SOM'
  body: |-
    Sizing this market requires several lenses rather than one grand TAM number. The broadest lens is global: a ResearchAndMarkets summary distributed by Business Wire frames the 2026-2046 long-duration storage opportunity at around $1 trillion. That is useful as a direction-of-travel indicator, but too broad for underwriting because it spans many technologies, countries, and use cases. The same summary explicitly warns that escape routes such as interconnection, grid build-out, and other system changes may reduce eventual LDES demand materially. A more investable lens is the UK policy-backed market. Clean Power 2030 says Britain needs 4-6 GW of long-duration electricity storage by 2030 alongside 23-27 GW of batteries, and POWER Magazine translates that into a secondary energy-basis view of roughly 58 GWh of non-battery storage and 34 GWh of batteries.

    Highview’s plausible serviceable market is narrower still. Its named near-term UK pipeline is Carrington plus two 3.2 GWh projects at Hunterston and Killingholme, implying about 7 GWh if all proceed, while its wider programme claims more than 16 sites and over £10 billion of infrastructure opportunity. That sounds large, but the competitive lens stays sobering: Energy-Storage.News says lithium-ion already represents 70% of the 64.7 GWh global inter-day pipeline targeting 2030 operation, and Modo says alternative LDES remains below 1 GWh operational outside China despite billions in funding. The right conclusion is that Highview’s SAM is policy-backed, non-battery, grid-critical storage in markets like the UK—not the whole headline global LDES universe.
