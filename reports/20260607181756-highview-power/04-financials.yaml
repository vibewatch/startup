  "callouts": [
    {
      "calloutType": "risk",
      "title": "Project finance and policy support arrive before public operating economics",
      "body": "Highview has clearly crossed a meaningful financing threshold, but the public record still looks like pre-revenue infrastructure commercialization rather than a mature operating business. Carrington needed a £300 million package before first commercial operations, Hunterston phase one needed another £130 million, and cap-and-floor support remains a gating mechanism for follow-on projects. That is not automatically negative for long-life infrastructure, but it means public investors are underwriting a financing architecture and execution thesis before they can underwrite demonstrated cash generation.",
      "claimRefs": [
        "CI005",
        "CI011",
        "CI013",
        "CI033",
        "CI037",
        "CI038"
      ]
    },
    {
      "calloutType": "insight",
      "title": "The strongest public signal is monetization intent, not monetization proof",
      "body": "Highview’s strategic-investment page is unusually explicit about asset ownership, capital recycling, licensing, and Clean Energy as a Service. That clarity helps explain how management wants the company to make money. But intent is not the same as realized economics. None of the retained public sources provides revenue, ARR, gross margin, or cash-flow evidence strong enough to show that the intended model has yet matured into a repeatable, disclosed operating business.",
      "claimRefs": [
        "CI002",
        "CI003",
        "CI016",
        "CI017",
        "CI036"
      ]
    }
  ],
