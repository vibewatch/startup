    {
      "id": "traction-proxies-unit-economics-and-disclosure-gaps",
      "title": "Traction Proxies, Unit-Economics Signals, and What Is Missing",
      "body": "Highview’s public traction is real, but it is mostly project-scale traction rather than revenue traction. The retained record supports Carrington under construction, two 3.2 GWh projects inside the UK cap-and-floor funnel, more than 16 identified UK sites, a 6.4 GWh by 2030 UK delivery ambition, and job-creation claims running from 700 for Carrington to 1,000 onsite plus 650 in the supply chain for Hunterston. Those are meaningful commercialization proxies because they show siting progress, sponsor appetite, and policy relevance. They are not substitutes for revenue quality. Public sources do not disclose revenue, ARR, gross margin, EBITDA, customer count, headcount, cash balance, monthly burn, or signed offtake economics. Independent technical and market sources also make clear why those missing fields matter: early-commercial LAES still sits around 120–200 USD/MWh in one synthesis, round-trip efficiency is typically 50–65%, and even supportive trade coverage notes batteries often win on capex, opex, and efficiency. In other words, Highview has enough public evidence to prove capital formation and physical ambition, but not enough to prove attractive unit economics or durable margins.",
