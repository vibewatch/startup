      "id": "capital-intensity-financing-and-cash-generation",
      "title": "Capital Intensity, Financing Structure, and Cash-Generation Timing",
      "body": "The financial story is dominated by financing chronology because public operating economics remain undisclosed. Carrington’s June 2024 package put £300 million behind a 50 MW / 300 MWh first commercial plant, with the National Wealth Fund / UK Infrastructure Bank disclosing a £165 million anchor commitment and Centrica disclosing a separate £70 million structure split between £25 million of convertible debt at Highview Enterprises and £45 million of project debt at Carrington. That disclosure is unusually valuable because it shows Highview already depends on blended holdco and project-level financing rather than plain venture equity. The November 2025 Hunterston round then added £130 million for phase one of a 3.2 GWh hybrid project and pushed cumulative commercialization funding above £500 million. But the same evidence also shows why cash-generation timing is hard to underwrite. Hunterston phase one is a stability island before full storage build-out, cap-and-floor support for Hunterston and Killingholme is only at eligible-project stage pending Q2 2026 decisions, and even Highview’s own public timing around Hunterston phase-one operations spans August 2026 to January 2028. The capital has arrived well before transparent proof of operating cash flow, which is normal for first-of-a-kind infrastructure but still a material underwriting risk.",
