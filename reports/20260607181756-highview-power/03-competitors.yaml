- id: direct-peers-and-alternative-chemistries
  title: Direct Peers and Alternative Chemistries
  body: 'Among the direct non-lithium alternatives, Hydrostor and Energy Dome look closest to Highview on infrastructure-style readiness. Hydrostor also sells a long-life mechanical platform with ancillary services and a global 7 GW-plus pipeline, but it still depends on hard-rock cavern development and geotechnical execution. Energy Dome looks sharper on public efficiency and capex posture: its official materials claim 70%+ net round-trip efficiency, 8-24 hour duration, 30+ years without degradation, and a more standardized project design, while independent ranking work places it ahead of Highview among non-lithium suppliers because it already has two post-FID commercial projects. Form is the clearest multiday battery substitute because it markets a 100-hour product and now has a marquee 300 MW / 100-hour Xcel-Google deal. Invinity and ESS are different again: both emphasize long life and benign materials, but they read more like cycle-life-centric battery substitutes than like full infrastructure
    platforms with project finance and grid-stability assets attached.'
