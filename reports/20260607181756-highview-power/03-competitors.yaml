- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - Price / unit / contract model
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Highview
    - No list pricing; infrastructure project finance around Carrington and Hunterston
    - Energy shifting plus stability island services, inertia, voltage support, analytics
    - Realized $/kWh and EPC economics remain undisclosed publicly
    - Competitive only where buyers value the full infrastructure bundle rather than cheapest storage capacity
  - - Energy Dome
    - Official comparison frames capex at 1x versus 1.7x for lithium-ion; no realized project price disclosed
    - 8-24h storage, 70%+ efficiency claim, reserve services, off-the-shelf components
    - Comparison is vendor-authored and not a customer contract
    - Most aggressive public economic posture among direct mechanical peers
  - - Hydrostor
    - No public unit price in retained set; project-development model for 100+ MW A-CAES
    - Long-duration storage plus ancillary services and later expandability
    - Civil works, geology, and financing structure are site-specific
    - Buyers underwrite Hydrostor more like infrastructure than like a battery SKU
  - - Form Energy
    - Independent coverage repeats company claim of system cost below one-tenth of lithium-ion, but no realized contract pricing disclosed
    - 100-hour multiday storage plus planning software
    - Public cost claims are directional and not apples-to-apples delivered pricing
    - Strong narrative for multiday economics, weak public evidence on delivered project margins
  - - Invinity / ESS
    - No retained list pricing; modular battery packaging for utility or C&I use
    - Cycle life, modular deployment, benign materials narratives
    - Backlog, realized discounting, and full installed cost are not disclosed in retained set
    - Useful substitutes where cycling and safety matter, but public economics are still opaque
  - - Lithium-ion incumbent
    - Public narrative centers on falling system prices, dense packaging, and financeable project structures rather than published list prices
    - Mainstream energy shifting, software, O&M, and proven delivery model
    - Turnkey customer pricing still depends on project specifics
    - This remains the cost-leadership reference point Highview must outperform on value rather than on list price
  notes: Pricing transparency is poor across the whole category, so the table compares economic posture and packaging rather than pretending public sources provide clean realized pricing.
