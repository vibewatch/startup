- id: switching-costs-substitutes-and-multi-homing
  title: Switching Costs, Substitutes, and Multi-Homing
  body: 'Highview’s switching costs are real, but they appear late. Before a project secures land, interconnection, debt, and stability-asset design, a buyer can still choose lithium-ion, pumped hydro, flow batteries, CO2 batteries, or A-CAES. After an award and financing package are in place, however, Highview becomes much harder to replace because the project architecture embeds civil works, transmission assumptions, partner rights, and long-life service expectations. That makes Highview less like a swappable battery vendor and more like an infrastructure platform. Even so, system planners are unlikely to standardize on one winner across all jobs. Pumped hydro remains the mature long-duration incumbent where geography works, lithium-ion dominates mainstream 8-12 hour procurements, and alternative long-duration assets will be slotted into the narrower nodes where duration, locational flexibility, or independent stability services matter enough to justify complexity. Multi-homing is therefore
    the base case: utilities can run batteries for daily cycling, pumped hydro for geography-favored bulk storage, and Highview-style assets for constrained nodes that need a more specialized bundle.'
