tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Highview Power
    - Direct / mechanical LAES infrastructure
    - '>£500M raised; Carrington under construction; Hunterston and Killingholme in cap-floor assessment'
    - Grid-scale 6h+ storage plus stability services at constrained nodes
    - Long asset life, above-ground siting, synchronous stability services, infrastructure capital access
    - Lower public efficiency and weak public pricing transparency versus lithium-ion and Energy Dome
  - - Hydrostor
    - Direct / A-CAES infrastructure
    - Private; 7 GW pipeline with multiple 500 MW developments
    - Utilities and system planners needing long-life 8h+ storage
    - 50+ year design life, ancillary services, flexible hard-rock siting versus salt-cavern CAES
    - Still needs cavern development and major project execution
  - - Energy Dome
    - Direct / CO2 battery mechanical storage
    - Private; two post-FID projects cited by ranking source
    - 8-24 hour utility and large-load applications
    - 70%+ efficiency claim, 30+ year life, strong public capex posture, off-the-shelf parts
    - Commercial fleet still small and official project pipeline detail remains limited in retained set
  - - Form Energy
    - Substitute / multiday iron-air battery
    - Private; 300 MW / 100-hour Xcel-Google project and factory ramp highlighted by independent coverage
    - Multiday clean-firming and resilience applications
    - 100-hour duration and strong multiday product narrative
    - Bankability still depends on proving repeated commercial delivery
  - - Invinity
    - Substitute / vanadium flow battery
    - Public reporting calendar visible; Endurium marketed in India for utility and C&I scale
    - High-cycle utility, C&I, and long-life daily-cycling projects
    - 100% depth of discharge, 30+ year life, unlimited-cycle claim
    - Retained public set does not show post-FID GWh-scale project depth
  - - ESS
    - Adjacent benchmark / iron-flow battery
    - Public-company IR site and utility/commercial positioning
    - Long-duration commercial and utility storage needing benign materials
    - Iron, salt, and water chemistry with non-lithium supply narrative
    - Commercial scale and financial durability appear weaker than leaders in this chapter
  - - Fluence
    - Incumbent benchmark / lithium-ion integrator
    - Public company; global projects across nearly 50 markets with regular SEC reporting
    - Utilities and large energy users wanting financeable battery systems
    - Distribution, services stack, procurement familiarity, and software-plus-operations leverage
    - No retained-source evidence of a differentiated non-lithium or 100-hour offering
  - - Pumped hydro
    - Status-quo incumbent / bulk long-duration storage
    - Mature infrastructure; 88% of US utility-scale storage
    - Geography-favored bulk storage and grid balancing
    - Deep operating history and long-duration credibility
    - Geography, permitting, and siting constraints limit deployment near many load centers
  notes: The profile table mixes direct peers, substitutes, and status-quo incumbents because real buyers can solve the same reliability job through several different procurement paths.
