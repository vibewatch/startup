  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-valuation
    missingEvidence: Latest post-money valuation, share count, and any recent secondary or internal valuation mark.
    whyItMatters: Without a current price denominator, valuation stance should remain unknown rather than forced.
    diligencePath: Request current financing documents, board materials, and any internal fair-value memo from management or counsel.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV001
    - TV003
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: project-contract-economics
    missingEvidence: Contracted revenue mix, floor or cap support, utilization assumptions, and availability-payment logic for Carrington and Hunterston.
    whyItMatters: Project economics are the bridge from engineering success to enterprise valuation.
    diligencePath: Request the project model, financing deck, and any signed or draft commercial contracts tied to the two flagship assets.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: corporate-financials
    missingEvidence: Current revenue, gross margin, operating expense run rate, cash balance, and burn.
    whyItMatters: A private valuation cannot be underwritten responsibly without basic financial quality and runway data.
    diligencePath: Request current management accounts, revenue bridge, and burn/runway reporting from finance leadership.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: dilution-waterfall
    missingEvidence: Full cap-table waterfall including convertibles, partner rights, liquidation preferences, and project-level debt security.
    whyItMatters: Common-equity economics can look attractive on an enterprise-value basis while remaining unattractive after preferences and debt claims.
    diligencePath: Obtain every term sheet, side letter, reserved-matter schedule, and security document affecting holdco and project SPVs.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV001
    - TV006
  - type: stale
    severity: material
    topic: carrington-operating-kpis
    missingEvidence: Measured post-energization availability, efficiency, dispatch profile, and any stability-service performance for Carrington.
    whyItMatters: The valuation case improves dramatically only when first-project performance becomes public and repeatable.
    diligencePath: Track commissioning milestones, request monthly KPI packs after energization, and compare against underwriting assumptions.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV003
    - TV005
