- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Flagship project proof
    - Carrington and Hunterston show Highview has moved beyond pilot rhetoric into financed commercial assets.
    - Those assets are still concentrated, pre-proof, and not yet a diversified operating fleet.
    - Carrington operating availability and dispatch data would turn proof-of-financing into proof-of-performance.
  - - Policy pathway
    - Cap-and-floor can make high-capex LDES bankable where merchant economics alone would not.
    - Reliance on policy also proves the standalone market has not yet validated the asset class unaided.
    - Final award terms, timing, and project-specific downside protection would matter more than headlines.
  - - Infrastructure capital support
    - UKIB/NWF, SNIB, Centrica, and other backers imply serious counterparties believe the projects are financeable.
    - Those same investors may hold rights, debt claims, or preferences that dilute common-equity upside.
    - A clean cap-table waterfall and new-money protections would improve the equity case.
  - - Technology positioning
    - BNEF suggests some LDES technologies can beat lithium-ion beyond eight hours in the right markets.
    - Lithium-ion keeps getting cheaper and remains the dominant deployment benchmark in 2025-2026.
    - Node-specific economics that clearly favor LAES over batteries would sharpen the thesis.
  - - Comparable set
    - Public peers help bound disclosure standards and capital intensity.
    - They are too heterogeneous for a clean multiple-transfer model into Highview.
    - A disclosed Highview revenue base and project-cash-flow bridge would make comp work more useful.
  - - Exit readiness
    - Infrastructure-style de-risking could eventually support strategic or infrastructure-capital exits.
    - No retained public source shows an IPO path, fleet metrics, or repeatable recurring economics today.
    - A second and third financed site plus operating KPIs would make exit pathways more concrete.
  notes: Each row pairs a valid positive signal with the reason it still fails to remove valuation ambiguity on public evidence alone.
