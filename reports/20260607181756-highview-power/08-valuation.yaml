- id: comparable-bounds-and-valuation-method
  title: Comparable bounds and valuation method
  body: 'The comparable exercise is still useful, but mostly as a boundary-setting tool rather than a multiple-transfer model. Highview should not be forced into a software-style revenue-multiple frame when the evidence repeatedly points toward infrastructure characteristics: large site-specific assets, long development cycles, blended public-private capital, and monetization through energy shifting plus stability services. Public storage peers reinforce that conclusion in different ways. Fluence shows what mature disclosure looks like for a public storage platform. ESS, Eos, and Invinity show that public alternative-chemistry peers can remain capital hungry even while giving investors much better visibility than Highview does. Form Energy, Energy Dome, Hydrostor, and pumped-hydro references widen the lens further: long-duration storage is not one clean comparable set but a messy collection of asset-heavy models with different duration, manufacturing, site, and policy dependencies. That
    heterogeneity makes it dangerous to claim a precise fair multiple for Highview. The disciplined move is to use comparables to judge disclosure quality, commercialization posture, and capital intensity, then let Highview''s own milestone path do the heavier valuation work.'
