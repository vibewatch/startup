chapter:
  number: 8
  title: Valuation
  summary: Highview has enough public evidence to justify continued diligence, but not enough to justify a precise public valuation call. The positive case is real — Carrington and Hunterston are financed, policy support is live, and Highview ranks as a serious non-lithium contender — yet current revenue, current valuation, and current preference terms remain undisclosed. The disciplined public stance is therefore research-more with high risk and valuation stance unknown until first-project execution and financing-term evidence improve.
sections:
- id: recommendation-and-entry-discipline
  title: Recommendation and entry discipline
  body: 'Highview has enough public evidence to justify continued work, but not enough to justify price certainty. The positive side of the record is substantial for a private long-duration storage developer: Carrington is real, financed, and under construction; Hunterston has moved beyond concept into funded phase-one execution; and the company has persuaded public and strategic capital providers to support first-of-a-kind projects that most LDES peers still describe aspirationally. The negative side matters more for valuation. No retained public source gives current revenue, ARR, margin, or a current equity mark. The capital structure that is visible already includes convertible debt, project debt, partner rights, and incomplete public registry information. That means the right public call is price discipline rather than enthusiasm. A missing valuation is not secretly cheap by default; it is simply under-disclosed. On public evidence alone, the chapter therefore lands on research-more,
    high risk, and valuation stance unknown until management discloses current financing terms, operating metrics, and how common equity actually sits behind the project-finance stack.'
