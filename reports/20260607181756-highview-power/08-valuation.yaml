- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Key assumptions
  - Relative valuation / round logic
  - Main downside trigger
  - Implication
  rows:
  - - Bull
    - Low-medium
    - Carrington energizes credibly, Hunterston progresses through cap-and-floor, and follow-on financing is mostly project or infrastructure capital.
    - Relative round index 120-180; could justify an up-round or strong strategic infrastructure mark even without public comps mapping cleanly.
    - Failure to convert first-project proof into repeatable financing.
    - Would justify moving from research-more toward track or conditional buy in private diligence.
  - - Base
    - Medium
    - Carrington and Hunterston make partial progress, but revenue disclosure and ownership terms remain incomplete.
    - Relative round index 80-120; flat or mildly structured outcome is the modal public case.
    - Terms become more investor-friendly than expected while metrics stay thin.
    - Continue diligence, but negotiate on structure rather than headline story.
  - - Bear
    - Medium
    - Carrington slips, policy support is delayed, and lithium-ion keeps absorbing the economic center of gravity.
    - Relative round index 40-80; flat-to-down round or preferred recap becomes plausible.
    - Combined execution and policy miss in 2026.
    - Treat as avoid until either price resets or proof improves sharply.
  - - Public-evidence weighted view
    - Medium
    - Financing credibility is better established than operating economics or price support.
    - Relative round index roughly 60-110; the range is wide because the current mark is unknown.
    - New financing terms reveal far more preference overhang than public materials imply.
    - This is a milestone-underwriting story, not a precision-valuation story.
  notes: 'The index is relative, not USD-denominated: 100 represents a hypothetical flat outcome versus the most recent undisclosed private reference price. Using an index is more honest than inventing a dollar value that public evidence cannot support.'
