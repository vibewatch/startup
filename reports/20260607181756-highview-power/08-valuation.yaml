- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current equity valuation
    - Latest post-money, share count, and any secondary mark or internal valuation memo
    - Without a current denominator, valuation stance should remain unknown.
    - Request board materials or financing documents from management and counsel.
  - - Preference and dilution waterfall
    - Convertible terms, liquidation preferences, reserved matters, project-debt security package, and partner rights
    - Rights can dominate common-equity outcomes even if project execution succeeds.
    - Obtain cap-table model plus all term sheets and side letters.
  - - Carrington commercial model
    - Revenue mix by arbitrage, stability services, contract tenor, and operating KPI targets
    - This is the bridge from project story to enterprise valuation.
    - Request project model, sensitivity deck, and monthly KPI pack.
  - - Hunterston and Killingholme policy economics
    - Actual cap-and-floor terms, downside floor, upside cap, and decision timing
    - Policy support is a major part of the bankability thesis.
    - Request current regulatory workstream and any draft assessment outcomes.
  - - Corporate financials
    - Current revenue, gross margin, overhead, burn, and cash runway
    - A private mark cannot be underwritten without ordinary financial quality metrics.
    - Request latest management accounts and bridge versus prior internal budget.
  - - Fleet-scaling proof
    - Evidence that Carrington can lead to repeatable second and third projects with similar financing quality
    - Enterprise value depends on repeatability, not on one flagship plant alone.
    - Request pipeline conversion data, site ranking, and financing conversations by project.
  notes: 'The asks are ordered by decision-blocking importance: valuation and term-stack clarity come first, then operating economics, then repeatability.'
