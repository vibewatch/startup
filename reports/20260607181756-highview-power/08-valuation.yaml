- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Highview Power
    - Private LAES developer with >£500m disclosed commercialization funding
    - Current equity valuation undisclosed; public evidence supports financing proof, not price proof.
    - Subject row clarifies why absolute valuation remains unknown.
    - No current revenue, valuation, or preference stack is public.
  - - Fluence
    - Public storage integrator and software platform
    - Public filer with broad disclosure and active 2026 financing activity; live market multiple is volatile and not transferred here.
    - Best disclosure benchmark for a scaled storage platform.
    - Not a pure LDES or LAES peer and far more diversified.
  - - ESS Tech
    - Public iron-flow storage vendor
    - Public non-lithium benchmark with investor disclosure and alternative-chemistry positioning.
    - Shows that alternative-storage names can reach public markets while staying capital intensive.
    - Different chemistry, use case mix, and scale.
  - - Eos Energy
    - Public zinc-based storage vendor
    - Public company with live SEC-filings cadence and patented-technology narrative.
    - Useful benchmark for disclosure depth and manufacturing-style alternative storage.
    - Chemistry, geography, and commercialization model differ from Highview.
  - - Invinity
    - AIM-listed vanadium-flow company
    - Public-market reference with investor portal and ongoing 2026 market development activity.
    - Closest pure-play listed alternative-chemistry storage reference in Europe-style markets.
    - Smaller scale and different duration profile.
  - - Form Energy
    - Private iron-air multi-day platform
    - Private frontier peer; public technology materials emphasize 100-hour duration rather than a disclosed current valuation.
    - Useful upper-duration benchmark for how far beyond Carrington some peers aim to go.
    - Private pricing and current revenue are not publicly disclosed in retained sources.
  - - Energy Dome / Hydrostor / pumped hydro framing
    - Mechanical or infrastructure-style long-duration references
    - Useful status benchmark for infrastructure-like storage rather than software-like valuation.
    - Supports using infrastructure logic and policy-adjusted underwriting.
    - Technologies, sites, and geology differ enough to block a clean multiple transfer.
  - - Lithium-ion benchmark
    - IEA plus 2026 price-compression reporting
    - Dominant deployment benchmark with sharply falling costs and strong bankability.
    - Defines the hurdle Highview must beat on duration, safety, or node value.
    - Lithium-ion is not a direct LAES comparable, but it sets the market ceiling for many tenders.
  notes: This enumeration is intentionally partial and model-oriented. It mixes public companies, private peers, and infrastructure references because no single comparable basket captures LAES cleanly.
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful public and semi-public long-duration references available in retained 2026 materials, emphasizing disclosure standards, technology class, and commercialization model rather than pretending Highview has a clean live multiple analogue.
