tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Basis
  - What changes the view
  rows:
  - - Recommendation
    - research-more
    - Public financing proof is real, but current revenue and current valuation are undisclosed.
    - Move up only after current terms, current financials, and Carrington KPIs are shared.
  - - Confidence
    - low
    - The chapter can underwrite milestones and risks better than price.
    - A verified post-money mark plus project-level economics would raise confidence materially.
  - - Risk rating
    - high
    - First-project execution, policy timing, and structured-capital overhang all remain live.
    - A clean Carrington ramp and Hunterston progress would reduce risk.
  - - Valuation stance
    - unknown
    - No retained public source supports a disciplined attractive-versus-expensive call today.
    - A conservative private price or stronger operating proof could move the stance.
  - - Decision implication
    - stay engaged, but underwrite on milestones and terms
    - The public case supports diligence, not unconditional price acceptance.
    - If diligence reveals punitive preferences or weak unit economics, step back rather than rationalize.
  notes: 'This table is intentionally conservative: it separates company quality from entry-price quality because public evidence only supports the former in part.'
