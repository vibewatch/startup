company:
  name: Highview Power
chapter:
  number: 1
  title: Company Overview
  summary: Highview Power is now positioned as a UK long-duration energy infrastructure developer rather than a pure technology licensor, combining analytics, patented liquid-air storage technology, project finance and grid-stability assets. Publicly retained evidence supports a £300 million Carrington financing in June 2024, a further £130 million Hunterston financing in November 2025, an active UK pipeline measured in gigawatt-hours, and a leadership transition from Richard Butland to Peter Jones in May 2026. The largest open issues are exact legal-entity history, revenue disclosure, board/control-rights visibility, and whether current pipeline and funding convert into repeatable operating assets on schedule.
sections:
- id: identity-positioning
  title: Identity, product positioning, and business model shift
  body: Highview’s current public materials describe the company less as a component vendor and more as a solutions-led energy infrastructure business. The homepage, company page, and infrastructure page collectively say the company develops, finances, builds, and operates grid-scale energy infrastructure, using a proprietary R2X analytics platform plus a portfolio of technologies to solve system-level problems for governments, grid operators, and enterprises. That matters for diligence because it implies value creation is expected to come from project origination, financing, asset ownership, and grid-services monetization rather than from selling a standardized battery box. Highview’s flagship proprietary technology remains liquid air energy storage, marketed as a patented long-duration platform that can store electricity for hours, days, or weeks while also supplying stability services. The projects page broadens that position further by framing Carrington, Hunterston, and the broader
    UK programme as integrated infrastructure platforms that combine long-duration storage and grid-stability functions. The present corporate story is therefore an infrastructure-developer thesis anchored by LAES, not just a cryogenic hardware thesis.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
