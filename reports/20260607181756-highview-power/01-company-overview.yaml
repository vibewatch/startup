- id: capital-and-investors
  title: Funding history, investor mix, and capital structure signals
  body: 'The retained record supports a stepwise financing story tied directly to project delivery. In 2020, Sumitomo Heavy Industries invested US$46 million and positioned Sumitomo SHI FW as a technology hub for global CRYOBattery deployment, a transaction that looked more like strategic industrial validation than simple venture funding. The 2024 Carrington financing marked a much bigger transition. Highview announced a £300 million investment package led by UK Infrastructure Bank and Centrica, with Rio Tinto, Goldman Sachs, KIRKBI, and Mosaic Capital also participating. National Wealth Fund materials specify that UKIB’s commitment was £165 million, while Centrica disclosed a distinct structure: £25 million of convertible debt at the holding company and £45 million of project debt at Carrington. That disclosure is valuable because it shows Highview increasingly finances through blended holdco and project capital rather than equity alone. In November 2025 the company announced another £130
    million round for Hunterston phase one involving Scottish National Investment Bank, Centrica, Goldman Sachs, KIRKBI, and Mosaic. Public sources therefore support more than £500 million secured for commercialization, but not a clean current cap table, valuation, or shareholder-rights schedule.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO021
  - CO022
  - CO033
  - CO040
  tableRefs:
  - TO003
- id: pipeline-and-scale
  title: Project pipeline, scale indicators, and milestone record
  body: 'Highview’s operational scale is still best evidenced by projects and pipeline rather than by revenue or customer-count disclosures. Carrington is under construction, with multiple sources aligning around a 300 MWh / 50 MW first commercial-scale LAES platform, a stability-island first phase, and a 2026 operating target. The company’s newer UK materials broaden the ambition materially: more than 16 identified UK sites, potential to power 7.6 million homes, more than £10 billion of infrastructure investment, and a stated 6.4 GWh UK delivery ambition by 2030. Hunterston has also evolved over time. Older 2024 language framed a next wave of 2.5 GWh plants, while the 2025 financing and 2026 cap-and-floor reporting describe a 3.2 GWh hybrid facility with a grid-stability first phase and eventual full build-out. Those differences do not undermine the core direction, but they do show that Highview’s programme is being re-scoped as it moves from concept to project finance. Public milestone
    coverage is strongest on funding, groundbreaking, eligibility for UK support frameworks, and hiring of an infrastructure-heavy executive team; it remains weak on audited operating performance, customer contracts, and realized project cash generation.'
