- id: leadership-governance
  title: Leadership continuity, transition risk, and governance visibility
  body: 'Leadership evidence shows both continuity and change. In June 2024 and November 2025 financing releases, Richard Butland was the public face of Highview as chief executive, while Colin Roy appeared as chair and co-founder. In May 2026 the company announced that Peter Jones would become chief executive, with David Gibson appointed COO and David Hemmings appointed CCO. Jones arrived from Neptune Energy and other large-scale infrastructure roles, which fits Highview’s current need to move from first-project execution into repeatable delivery. That said, current official disclosure is thinner on governance than on management biographies. The company page says the leadership team spans energy generation, transmission, infrastructure, finance, and project delivery, but it does not publish a full board roster, committee structure, or investor control-rights map. Tracxn and the 2020 Sumitomo announcement indicate outside board representation has existed, yet current public materials do
    not provide a dependable updated board list. The result is a mixed governance picture: management depth improved in 2026, but board transparency and key-person dependence remain partially unresolved diligence items.'
  claimRefs:
  - CO014
  - CO015
