callouts:
- calloutType: strength
  title: Blended public-private capital is a real moat at first-commercial scale
  body: Highview is unusual among LDES startups in having moved beyond pure venture signaling into blended infrastructure capital. UKIB/NWF, Centrica, industrial investors, and strategic financial names all appear in the retained financing record, and Centrica disclosed actual instrument structure rather than generic partnership language. That does not eliminate execution risk, but it materially improves bankability relative to earlier-stage LDES peers still looking for their first project-finance stack.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO021
  - CO022
- calloutType: risk
  title: Leadership and governance visibility lag the scale of the capital programme
  body: The company has now changed CEOs while executing its first commercial project, and public materials still do not provide a clean board, control-rights, or cap-table view. That opacity is manageable for a narrative profile, but not for underwriting. Investors need confirmation of who controls project sequencing, reserve decisions, conversion rights, and follow-on financing governance before treating Highview as a repeatable infrastructure platform.
  claimRefs:
  - CO014
  - CO016
  - CO019
  - CO040
- calloutType: insight
  title: Highview is becoming an asset platform, not just a cryogenic technology company
  body: 'The most important company-overview insight is strategic, not scientific: current materials emphasize analytics, grid services, financing, and asset ownership alongside LAES. That makes later diligence less about whether the core thermodynamic cycle exists, and more about whether Highview can repeatedly originate, finance, build, and operate long-duration infrastructure under UK support frameworks.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO037
  - CO038
