companyProfile:
  summary: "Highview Power is a London-based long-duration energy storage company commercializing liquid air energy storage under the CRYOBattery brand while repositioning itself as a broader energy infrastructure developer. Public evidence supports a 300 MWh / 50 MW Carrington project under construction in Greater Manchester, a 3.2 GWh Hunterston project funded for phase one in Scotland, and a stated 6.4 GWh UK deployment ambition by 2030. The company combines proprietary R2X analytics, patented cryogenic storage know-how, and blended public-private capital from investors including UKIB/National Wealth Fund, Centrica, SNIB, Goldman Sachs, KIRKBI, Mosaic Capital, and earlier strategic partner Sumitomo Heavy Industries. Leadership transitioned from Richard Butland to Peter Jones in May 2026 as the business moved further into project delivery."
  foundedDate: "2005-01-01"
  founders:
    - name: "Colin Roy"
      role: "Co-founder and Chairman"
      background: "Public 2024 and 2026 company releases identify Roy as co-founder and chair supporting commercialization."
      claimRefs:
        - CO017
  foundingLocation: "London, UK"
  headquarters: "London, UK"
  productSummary: "Highview develops, finances, builds, and operates grid-scale long-duration energy storage and grid-stability assets centered on patented liquid air energy storage. The LAES process liquefies air using electricity, stores it in insulated tanks, and later regasifies it through power-recovery equipment to deliver dispatchable electricity plus inertia, voltage support, and other grid services."
  customerFocus: "Grid operators, utilities, public-infrastructure capital providers, and power-system users that need long-duration energy shifting and synchronous stability services at large grid nodes."
  businessModel: "Project-led infrastructure model combining analytics, project origination, financing, EPC / partner delivery, and eventual operation of long-duration storage and stability assets. Revenue should come from capacity, ancillary services, energy-shifting, and policy-backed project frameworks rather than pure equipment sales."
  stage: "growth / pre-commercial"
  fundingStatus: "£300M Carrington financing announced in June 2024 and £130M Hunterston phase-one financing announced in November 2025; public sources say cumulative commercialization funding now exceeds £500M."
