evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-opacity
    missingEvidence: Current board roster, committee structure, shareholder-rights map, and investor preference stack.
    whyItMatters: >-
      Control rights determine dilution, project sequencing, and whether future capital can be raised without governance
      conflict.
    diligencePath: Request latest cap table, shareholder agreement summary, and current board materials from management.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: founding-history
    missingEvidence: >-
      A current official source that states founding date, original founder roster, and entity lineage from early R&D
      through today.
    whyItMatters: >-
      Founding and entity continuity matter for IP ownership, option history, and assessing whether the current company
      cleanly owns the legacy technology base.
    diligencePath: Request incorporation documents, IP assignment history, and an official corporate-history deck.
    relatedQuestionRefs:
      - QO004
      - QO008
      - QO024
    relatedTableRefs:
      - TO002
      - TO004
  - type: private-evidence-only
    severity: material
    topic: disclosure-gap
    missingEvidence: >-
      Current revenue, customer count, realized project cash generation, and latest implied valuation from the 2025
      round.
    whyItMatters: >-
      Without current operating and pricing evidence, it is impossible to distinguish infrastructure ambition from
      demonstrated commercialization progress.
    diligencePath: >-
      Request management accounts, project finance model, signed customer / offtake contracts, and 2025 round term-sheet
      summary.
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
