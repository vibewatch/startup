- id: TR006
  title: Mitigation and thesis-break criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - Carrington schedule risk
    - Commissioning milestones
    - No synchronisation-ready plan or further slip beyond a believable 2027 window
    - Pause growth-case underwriting and treat Carrington as unresolved FOAK risk.
  - - Operational proof gap
    - Measured plant KPIs
    - No public or diligence-room evidence on availability, auxiliary load, or achieved RTE after commissioning
    - Do not extrapolate Carrington economics to Hunterston or pipeline assets.
  - - Cap-and-floor dependence
    - Ofgem or NESO process status
    - Hunterston or Killingholme fail to secure timely final awards or customer-benefit case weakens materially
    - Cut expansion assumptions and reset valuation to a slower single-project case.
  - - Partner concentration
    - Capital-partner continuity
    - Visible anchor investors or strategic rights holders step back before the next close
    - Assume financing cost rises and execution timeline lengthens.
  - - Lithium competition
    - Tender and price evidence
    - 2026–2027 tenders continue awarding 8–12 hour needs overwhelmingly to lithium-ion with no LAES wins
    - Lower market-share assumptions and require stronger node-specific value proof.
  - - Disclosure risk
    - Unit economics and rights transparency
    - Management still cannot show project revenue stack, covenant package, and investor-rights map after Carrington starts up
    - Treat the business as strategically interesting but not yet bankable.
  notes: Each trigger is designed to be monitorable from project milestones, regulatory process updates, financing events, or disclosed operating data rather than from vague sentiment.
