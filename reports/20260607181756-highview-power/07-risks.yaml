  - CR020
  - CR025
  - CR045
- calloutType: assumption
  title: The current growth case assumes policy support remains available long enough for technical learning to compound.
  body: If cap-and-floor timing slips or customer-benefit assessments disappoint before Carrington proves out, Highview loses both financing momentum and market narrative at once.
  claimRefs:
  - CR013
