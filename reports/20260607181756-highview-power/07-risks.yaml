callouts:
- calloutType: risk
  title: 'Top risk: Carrington has to convert a credible engineering story into repeatable commercial proof.'
  body: Mature components are not enough; the first commercial LAES asset must hit schedule, acceptable efficiency, and a bankable operating profile before the broader platform deserves full-scale underwriting.
  claimRefs:
