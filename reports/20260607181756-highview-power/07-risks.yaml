  evidenceGaps:
  - type: missing-source
    severity: material
    topic: grid-connection-and-planning
    missingEvidence: Named grid-offer milestones, energisation plan, and any remaining planning-condition discharge items for Carrington.
    whyItMatters: These are the practical gates between construction and revenue service, and public timeline conflict makes them more important.
    diligencePath: Request the current critical path, grid-connection agreement status, and local planning-condition tracker from management and owners engineer.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: shareholder-and-creditor-rights
    missingEvidence: Shareholder agreement, intercreditor documents, reserved-matter rights, and security package by entity.
    whyItMatters: Public registry disclosures do not tell an investor who can block financings, control exits, or restructure downside scenarios.
    diligencePath: Inspect the cap table, SHA, debt documents, and any side letters governing future project rights.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: operating-kpis
    missingEvidence: Measured commercial availability, auxiliary load, round-trip efficiency, and maintenance assumptions for Carrington after energisation.
    whyItMatters: Without operating KPIs, later-project economics remain extrapolations rather than bankable evidence.
    diligencePath: Request commissioning acceptance tests, O&M guarantees, and first six to twelve months of operating data once available.
    relatedQuestionRefs:
    - QR013
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: blocking
    topic: revenue-support-terms
    missingEvidence: Actual cap-and-floor term sheet, award timing, or contracted revenue floors for Hunterston and Killingholme.
    whyItMatters: The growth case depends on moving from policy eligibility to bankable revenue certainty; until then follow-on project economics are speculative.
    diligencePath: Track Ofgem and NESO milestones, request management's latest award assumptions, and review lender materials once available.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR002
    - TR006
