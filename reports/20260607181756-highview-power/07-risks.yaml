company:
  name: Highview Power
chapter:
  number: 7
  title: Risks
  summary: Highview Power's risk profile is dominated by first-commercial execution, policy-linked bankability, concentrated counterparties, and thin public operating economics. The mitigants are meaningful — mature industrial components, staged stability-island deployment, strong public-capital anchors, and a live UK cap-and-floor pathway — but residual risk remains high until Carrington commissions credibly, follow-on projects secure revenue support, and management discloses enough operating and contractual evidence to prove that LAES can win against cheaper lithium-ion alternatives in the specific nodes where Highview wants to scale.
sections:
- id: severity-ranked-risk-stack
  title: Severity-Ranked Risk Stack and Residual Exposure
  body: 'The risk picture is concentrated rather than diffuse. Carrington matters because it is the first commercial-scale proof point, and the entire UK roll-out narrative still depends on showing that one integrated liquid-air plant can commission, stabilise the local grid, and then translate its engineering story into repeatable economics. That makes FOAK delivery the top risk even before policy and competition are considered. The second ranked risk is revenue-framework dependence: government consultation papers explicitly say long-duration storage has struggled to deploy at scale under current market structures, and Highview''s next major UK projects still depend on Ofgem and NESO progressing cap-and-floor assessment to final award. Third comes project concentration: public traction remains tied mainly to Carrington and Hunterston rather than to a broad installed fleet. Fourth is disclosure risk: public filings and partner releases still leave unit economics, contract terms, and shareholder-right
    details thin. Fifth is lithium-ion competitive pressure, because cheaper and more bankable 8–12 hour battery projects can absorb policy support before LAES becomes repeatable. The mitigants are real but still pre-proof: mature components, staged stability-island deployment, policy support, and strong capital partners all help, yet residual exposure stays high until commissioning and bankable revenue evidence arrive.'
