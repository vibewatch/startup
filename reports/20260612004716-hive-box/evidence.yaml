evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: succession-plan
    missingEvidence: A board-approved succession plan, current reporting lines, and any finalized replacement for Xu Yubin.
    whyItMatters: >-
      Leadership continuity matters because the founder remains central to operations, narrative, and investor
      confidence.
    diligencePath: >-
      Request current org chart, board minutes on succession, and management bios for any incoming CEO or executive
      chair arrangement.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: >-
      A complete current board roster, committee memberships, and governance-rights summary for controller and major
      investors.
    whyItMatters: >-
      Without a current governance map, investors cannot fully assess oversight quality, minority protections, or IPO
      readiness.
    diligencePath: >-
      Obtain the latest board list, committee charters, shareholder agreement summary, and any post-2024 governance
      changes from company counsel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: >-
      Any post-2024 primary financing, secondary trade, internal mark, or banker range that updates the 2021 financing
      benchmark and 2024 Hurun marker.
    whyItMatters: >-
      Valuation is a core diligence variable, and current public signals are indicative rather than
      transaction-clearing.
    diligencePath: >-
      Request the latest cap table, 409A or internal fair-value materials, recent tender or secondary data, and any
      banker book from the IPO process.
    relatedQuestionRefs:
      - QO026
  - type: access-blocked
    severity: material
    topic: asia-forge-docket
    missingEvidence: >-
      A public Hong Kong court docket, pleadings, or settlement documents that confirm the lawsuit scope and current
      status.
    whyItMatters: >-
      The lawsuit is central to IPO timing, potential cash liability, and shareholding stability, but reporting remains
      second-hand.
    diligencePath: >-
      Have Hong Kong counsel pull docket materials directly from court records and reconcile them against the amended
      2024 investment documents.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: locker-unit-economics
    missingEvidence: City-tier locker utilization, site-level payback, and courier-fee economics by cohort.
    whyItMatters: Without site-level utilization and payback, SOM quality can be overstated even if national parcel demand is large.
    diligencePath: Request cohort data by city tier for occupancy, parcels per locker per day, churn, and payback period.
    relatedQuestionRefs:
      - QM026
  - type: private-evidence-only
    severity: material
    topic: property-manager-economics
    missingEvidence: >-
      Standard site contracts, revenue-share terms, electricity/maintenance burden, and complaint-resolution SLAs with
      property managers.
    whyItMatters: >-
      Property access is a gating variable for expansion and churn, but public sources do not reveal who pays or who
      captures site-side economics.
    diligencePath: Obtain sample property contracts and site-renewal metrics from top city clusters.
    relatedQuestionRefs:
      - QM027
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: reverse-logistics-volume
    missingEvidence: Actual Hive Box sending, return, and merchant reverse-logistics volumes and take rates.
    whyItMatters: >-
      Reverse logistics is a meaningful payer class in the narrative, but its contribution to SAM and margin mix is not
      public.
    diligencePath: Request historical outbound-send and return volumes, merchant counts, and realized take rates by product line.
    relatedQuestionRefs:
      - QM015
      - QM027
  - type: conflicting-data
    severity: minor
    topic: market-size-scope
    missingEvidence: A reconciled bridge between locker-only, last-mile, CEP, and e-commerce-logistics market definitions.
    whyItMatters: Investors can misread broad logistics ceilings as locker TAM unless the category bridge is explicit.
    diligencePath: >-
      Ask management and bankers for the exact industry-study definitions behind each market chart and their revenue
      inclusions.
    relatedQuestionRefs:
      - QM008
      - QM026
    relatedTableRefs:
      - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: regional-site-density
    missingEvidence: A provincial or city-tier map of Hive Box site density, parcel throughput, and property access quality.
    whyItMatters: >-
      The inland-growth story is persuasive, but public data do not show where density is sufficient for locker
      economics versus station-only coverage.
    diligencePath: >-
      Request a heat map of sites, parcels per site, and renewal/churn by city tier before underwriting lower-tier
      expansion.
    relatedQuestionRefs:
      - QM024
      - QM026
  - type: stale
    severity: material
    topic: live-hive-box-fee-table
    missingEvidence: >-
      A current official Hive Box page or mini-program capture showing live city-level overtime storage fees and any
      membership terms as of run date.
    whyItMatters: >-
      Recipient price sensitivity is central to competitive switching, and historical backlash means outdated fee
      assumptions could overstate or understate monetization freedom.
    diligencePath: >-
      Use the Hive Box app or mini-program with city-specific test addresses and capture the live overtime-fee schedule,
      grace period, and membership upsell in several tier-one and lower-tier cities.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: jd-locker-count
    missingEvidence: A current official JD Logistics disclosure breaking out smart-locker count versus staffed pickup points.
    whyItMatters: >-
      Without a clean count split, JD is easier to classify qualitatively than quantitatively, which weakens precision
      in the direct-comparison table.
    diligencePath: >-
      Pull the latest Chinese annual report, sustainability report, or product page that quantifies JD self-pickup
      lockers and stations separately, then refresh the competitor profile table.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: property-contract-exclusivity
    missingEvidence: >-
      Property-contract duration, exclusivity clauses, renewal rates, and site churn data for Hive Box and the main
      rival formats.
    whyItMatters: >-
      The chapter's moat conclusion ultimately turns on whether property access is contractually sticky or merely
      operationally convenient.
    diligencePath: >-
      Ask management for a city-tier sample of property contracts, renewal terms, lockout clauses, and annual
      site-retention metrics, then reconcile them against any regulator or partner complaints.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: material
    topic: debt-obligations
    missingEvidence: Current debt balances, project-finance obligations, guarantees, and committed credit facilities.
    whyItMatters: Hidden obligations could materially change net liquidity, runway, and downside recovery scenarios.
    diligencePath: >-
      Request the latest audited debt schedule, lease and guarantee appendix, and board materials on funding
      obligations.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: realized-fee-rates
    missingEvidence: Realized courier fee per parcel, discount ladders, and return-shipping unit margins by partner or channel.
    whyItMatters: >-
      List-level or secondary pricing proxies do not show whether locker density is translating into strong realized
      monetization.
    diligencePath: >-
      Request current commercial contracts with major courier partners plus realized revenue-per-parcel reporting by
      channel.
    relatedQuestionRefs:
      - QI018
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: segment-margins
    missingEvidence: >-
      Segment gross margins, CAC, payback, retention, and repeat-use behavior for last-mile delivery, consumer smart
      delivery, and value-added services.
    whyItMatters: >-
      Without segment economics, investors cannot tell whether the 2024 profit turn is durable or mostly accounting and
      mix assisted.
    diligencePath: >-
      Request a gross-margin bridge by segment plus cohort retention, CAC, and payback analyses from management
      reporting.
    relatedQuestionRefs:
      - QI019
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: underwriting-support
    missingEvidence: >-
      Current underwriting roster, valuation feedback, cornerstone demand, and exchange-readiness materials for any
      revived Hong Kong process.
    whyItMatters: >-
      A lapsed filing with only public sole-sponsor evidence leaves weak third-party validation of pricing power and
      capital-markets access.
    diligencePath: Request the latest bank engagement letter set, soft-circled demand feedback, and exchange comment tracker.
    relatedQuestionRefs:
      - QI020
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: asia-forge-dispute-status
    missingEvidence: >-
      Court-level filings, settlement terms, payment status, and current shareholder-rights position in the Asia Forge
      dispute.
    whyItMatters: The redemption-right case could consume cash, delay fundraising, and reshape the cap table or control position.
    diligencePath: >-
      Obtain Hong Kong litigation docket materials, settlement correspondence, and a management downside-case memo on
      redemption outcomes.
