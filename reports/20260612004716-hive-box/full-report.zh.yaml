            body: >-
              最强客户证据仍来自 2024 年递表窗口。招股书衍生和相互印证的新闻来源一致认为，截至 2024-05-31，Hive Box 在中国全部 31 个省级行政区约 209,000 个社区运营 330,200
              组柜、约 29.9 million 个格口。同一证据包支持这项规模主张：截至该日，Hive Box 累计服务约 367.8 million 名消费者和 3.5 million
              名快递员。这些数字有意义，因为它们暗示了异常高的网络渗透率，但不能误读为月活或年活留存用户。更好的耐久性代理指标是使用吞吐。2021-2023 年末端投递包裹量一直很大；同一时期，消费者智能投递包裹从 114.3
              million 增至 233.2 million。第二条曲线对本章最重要，因为公开报道把它与逆向物流和自助寄件联系起来，这是用户不只是容忍单向快递员投柜的最清晰信号。
