  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Hive Box 真正服务的任务
        blocks:
          - type: paragraph
            body: >-
              起点是把中国庞大的包裹经济，与 Hive Box 解决的更窄非到户配送问题分开。中国 2024 年处理 174.5 billion 件包裹，2025 年处理 198.95 billion 件快递包裹；2024
              年网上零售额达到 RMB 15.52 trillion。这些数字足够支撑多种履约模式，但 Hive Box
              并不捕获全部快递或电商物流支出。它的相关市场，是配送和寄件活动中能由共享末端节点替代反复上门尝试的那一部分，再叠加可通过广告和相邻服务变现的社区注意力层。


              这个边界重要，因为公开报告至少描述了四个不同市场：中国广义 CEP、电商物流、末端配送和智能快递柜。Hive Box
              招股书使用的分类更具体，叫「末端物流解决方案」，把包裹交接、寄件和相关服务基础设施混在一起。因此，实际 SAM
              不是「中国全部包裹」。它是足够集中、能让共享快递柜或驿站跑通，并且能获得物业和监管允许、居民接受的包裹和退货流量。更宽口径只能作为宏观背景或天花板，不能直接当收入池。
