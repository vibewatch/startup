      - number: '7.2'
        title: 法律和监管暴露是最可能打穿投资逻辑的首要风险
        blocks:
          - type: paragraph
            body: >-
              法律和监管这一组风险应排在最高严重性，因为已经出现可直接观察的后果。中文和英文独立报道都指向同一件事：Asia Forge Capital 的回购权纠纷拖慢了 Hive Box 的香港 IPO，而 2024
              年提交的申请在 2025 年初失效后，公开层面尚未更新。如果问题孤立，仍可处理；但检索到的报道显示，CSRC 的补充问询还涉及 VIE
              架构、业务合规、数据安全以及收费相关收入的合法性。经营端也在收紧：中国修订后的《快递市场管理办法》强化了快递柜投递必须取得用户同意的规则，严重违规可被罚款，直接冲击任何把便利优先放在同意优先之前的增长习惯。隐私义务也在同一风险桶里：委托处理和个人信息处理现在需要更明确的控制和评估。剩余尽调缺口很关键，因为公开检索门户尚未提供诉状，无法判断
              Asia Forge 的法律筹码大小，也无法确认解决时间表。
