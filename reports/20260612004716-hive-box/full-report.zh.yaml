      - number: '4.4'
        title: 资本充足性、IPO 依赖与融资灵活性
        blocks:
          - type: paragraph
            body: >-
              资本故事比收入故事更脆。公开披露显示，截至 2024-05-31，公司只有 RMB 859M 现金及现金等价物；拟 IPO
              募资用途包括低线和海外网络扩张、强化非到户物流能力、拓宽增值服务、R&D、战略投资和营运资本。因此，Longport
              把香港上市解读为战略重要事项，而非单纯机会型融资。这种压力又被融资结构放大。一财报道称，2021 年融资给予投资人赎回权，前提是 Hive Box 未能在 2025-01-27 前上市。公司据称试图支付约 USD
              80M，把期限推迟到 2027 年，但 Asia Forge 拒绝并在香港起诉。一财还报道称，递表在 2025 年 2 月因未补交材料而失效，CSRC 也另行要求就 VIE
              和合规问题作出更多说明。合在一起看，IPO 不只是一次流动性事件：它也是维持融资灵活性、推迟潜在高成本股东退出义务的机制之一。
