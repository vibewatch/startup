        - 收入线存在于增值服务中，但活动定价不公开
        - The Paper、JRJ、官方生态页面
        - 公开证据证明该收入流存在，但不能证明质量高或只是项目型收入
      - - 洗衣和到家服务定价
        - 未公开逐项列示
