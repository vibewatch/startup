      - number: '1.5'
        title: 里程碑、反向事项与停滞的 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              Hive Box 的时间线把亮眼规模里程碑和越来越多的执行、治理摩擦放在一起。公司从 2015 年成立，扩到 2017 年 60,000 组柜，2017 年收购 e栈，2020
              年与中国邮政速递易网络重组整合行业，到了 2024 年既能宣称市场领先，也首次阶段性盈利。但同一段历史也暴露变现压力。2020 年暂存费争议说明，要在不引发用户反弹的情况下支撑重资本快递柜网络有多难；2024
              年监管审视再次触及收费做法的合法性；2024 年 8 月 IPO 递表也没有打通上市路径。招股书在 2025 年 2 月失效，一财随后报道 Asia Forge
              反对修改后的赎回条款，并在香港起诉，把一项合同流动性权利变成直接 IPO 阻碍。截至 run date，Hive Box 仍具战略重要性和运营规模，但已不像干净的短期上市候选人。
