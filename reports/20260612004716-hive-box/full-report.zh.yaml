  - id: TV005
    title: 打破投资论点和终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 如何传导到论点
      - 行动含义
    rows:
      - - 审计数字不及预期
        - 更新后的审计收入仍接近或低于基准区间下沿，且利润质量偏弱
        - 基准和乐观情景都会收缩，因为旧私募估值吃了太多叙事溢价
        - 将估值重新锚定到悲观或低基准区间
      - - 优先权结构冲击超预期
        - 赎回权或 side letter 现金义务实质压低普通股上行空间
        - 名义估值不再适合作为外部投资者回报的输入
        - 在法律清算瀑布建模前暂停承销判断
      - - 监管方仍未被说服
        - 重新申报或澄清此前披露问题看不到可信路径
        - 退出时间拉长，公开市场可比性变差，而不是变好
        - 将公司视为久期更长、退出确定性更低的私人持仓
      - - 利润结构看起来由费用驱动
        - 滞纳金和罚金式变现占利润改善过多
        - 盈利质量下降，溢价倍数论点变弱
        - 下调情景倍数假设
      - - 竞争性资本开支加剧
        - Cainiao、JD 或其他网络抬高密度和服务水平的投资门槛
        - 新增储物柜回报走弱，回本周期拉长
        - 追加资本前要求新的单元经济证明
    notes: 这些是估值终止标准，不是泛泛的经营担忧。任一项都可能明显压缩可支撑倍数。
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV024
      - CV026
      - CV045
      - CV046
      - CV052
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 最新审计财务
        - 2024、2025 年审计报表，以及 2026 年 YTD 管理账
        - 没有新的基准年份，估值论证只能依赖滞后或年化数字
        - CFO、审计师和上市保荐人数据室
      - - 股权结构和清算瀑布
        - 完整优先权结构、side letter 和赎回机制
        - 新资金回报取决于普通股之上的经济安排，而不只是头部估值
        - 公司法律顾问和领投方
      - - 监管往来
        - HKEX 和 CSRC 问询函，以及管理层回复包
        - 退出时点和可行性取决于监管方实际要求
        - 保荐人、总法律顾问和董事会材料
      - - 变现结构
        - 滞纳金、会员、软件、包裹处理和伙伴经济中的收入拆分
        - 更高倍数需要收入质量证明，而不只是装机规模
        - 财务分析和产品负责人
      - - 储物柜利用率 cohort
        - 按城市拆分的利用率、滞留时间、租金续约、维护成本和 cohort 回本
        - 只有 cohort 经济持续复利，网络密度才配得上溢价估值
        - 运营和网络规划团队
      - - IPO 重启计划
        - 具体时间表、保荐人状态和备选融资计划
        - 退出路径决定投资者是否应该支付任何流动性溢价
        - CEO、保荐人和董事会
    notes: 这是从跟踪转向承销判断所需的最低材料包。少于这些，估值论证就会有太多内容停留在暗示里，而不是落在文件上。
    claimRefs:
      - CV007
      - CV010
      - CV037
      - CV038
      - CV045
      - CV051
      - CV052
