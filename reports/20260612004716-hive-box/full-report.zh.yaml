              Hive Box 仍应放在直接对比组的中心，因为其自有界面和递表期报道都指向全国智能快递柜规模、广泛社区渗透，以及混合硬件、软件和开放 API 的产品栈。但最接近的国内对手并不是另一组快递柜。Cainiao
