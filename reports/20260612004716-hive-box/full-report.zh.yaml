      - number: '1.3'
        title: 创始人履历、管理层纵深与控制结构
        blocks:
          - type: paragraph
            body: >-
              创始人故事在 Hive Box 的公开叙事里异常居中。多家媒体把徐育斌描述为这样一位创业者：他在 SF 有快递和运营背景，看到了「最后一公里」错配问题，并在王卫支持下做出 Hive
              Box。招股书阶段，徐育斌任董事长兼 CEO，王卫仍是最终控制锚点：公开文件和后续报道显示，王卫直接经济权益约 36.54%，并通过一致行动安排掌握约 48.45%
              表决权。核心之外的公开能见度低于投资人理想状态。可取得材料提到 CFO 周向东、CMO 李文青和少数持股实体，但没有完整的当代董事会、委员会图谱或接班安排。因此，即使经历多年机构融资，Hive Box
              仍呈现出创始人主导运营、控制人影响较强的样子。
