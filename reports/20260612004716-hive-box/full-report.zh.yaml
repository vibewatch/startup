  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性排序与传导概览
        blocks:
          - type: paragraph
            body: >-
              Hive Box 的风险栈顶部不是普通经营噪音，而是法律和监管暴露。最严重的问题是 Asia Forge Capital 的赎回权纠纷仍未解决：这件事已经拖住香港上市，可能带来回购或资产保全压力，也会和
              CSRC、HKEX
              更广泛的合规审查互相叠加。第二是经营模式问题：公司运营一个规模很大的实体快递柜网络，固定成本不轻，而一块可见的变现来自用户超时费，这类收入已经引发持续反弹，也带来监管敏感的行为问题。第三是合作方集中：包裹流量围绕
              SF 背书的体系、非雇员快递员以及控制柜点位置的物业管理方。第四是隐私和支付控制风险：Hive Box
              自己的政策显示，它把身份、包裹、通知和钱包数据放在同一套流程里处理，而公开证据更多显示合规表面，尚未证明控制成熟度。第五是执行和融资风险，涉及领导层变化、多元化押注，以及上市窗口继续关闭时如何维持重资产网络资金。
