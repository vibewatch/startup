      - number: '8.3'
        title: 只有乐观情景能明确越过头部估值标记
        blocks:
          - type: paragraph
            body: >-
              情景分析比假装上一轮私募标记能自证更适合这里。乐观情景假设 Hive Box 能把 2024 年盈利快照变成稳定全年运行率，把收入推向 RMB6.0-RMB6.5
              billion，并让投资者相信公司不只是成熟物流倍数，因为软件抽佣率、利用率和生态变现正在一起改善。在这套设定下，4.2x-5.0x 销售倍数可以支撑大约 RMB25-RMB32
              billion。这是唯一一条有清晰证据连接、能验证现有头部估值标记的路径。


              基准情景更低，也更符合今天的证据：收入大约 RMB4.8-RMB5.3 billion，倍数 2.8x-3.5x，对应约 RMB13-RMB19
              billion。悲观情景假设递表继续冷却、变现质量令人失望，投资者按资产重的物流基础设施而不是高溢价软件化网络效应给 Hive Box 定价；那会指向大约 RMB6-RMB10
              billion。投资含义很直接。Hive Box 仍可能变得值 25 billion 或更多，但当前公开证据支持跟踪公司，或要求明显更低的入场价格，而不是像市场已经重新确认旧标记那样承销。
