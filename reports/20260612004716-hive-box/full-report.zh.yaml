  - id: TP001
    title: 竞争对手画像表
    columns:
      - 选项
      - 类别
      - 规模或覆盖信号
      - 目标用户 / 点位模式
      - 变现姿态
      - 战略方向或限制
    rows:
      - - Hive Box
        - 直接柜机龙头
        - 330.2k 个柜机；209k 个社区；367.8m+ 用户
        - 住宅社区和合作伙伴末端节点
        - 已知通过派送工作流、SaaS、API 以及有争议的超时取件费变现
        - 装机基础和集成栈很强，但收费姿态和合规审查削弱定价自由度
      - - Cainiao Station / locker（自提网络）
        - 国内直接混合型对手
        - 官方页面强调一款全球使用的物流 app、有人值守站点和广泛站点形态，而不只是柜机
        - 社区驿站、物业服务中心、便利店形态、柜机，以及基于 app 的送货上门选择
        - 驿站运营者赚包裹处理费，也赚流量、广告、回收、洗衣和其他附加收入
        - 有人值守 + 数字化的混合模式拓宽服务范围，也降低快递员采用门槛
      - - JD Logistics pickup / self-pickup（自提网络）
        - 一体化既有替代方案
        - 本报告审阅的公开披露更强调供应链基础设施、零售服务和年报，而不是柜机数量
        - 更大一体化网络内的 JD 零售和物流用户
        - 价值主张捆绑在服务质量和物流能力中，而不是公开柜机变现
        - 竞争压力更多来自生态宽度，而非开放柜机密度
      - - SF Express / SF Intra-City
        - 上门替代方案
        - 主网络覆盖 100% 地级市和 99.8% 县域；同城服务平均 1 小时送达
        - 到家或紧急点对点配送
        - 收费绑定服务等级和紧急程度，而不是无人取件时长
        - 只要收件人更看重便利性或速度而非自助，高服务替代方案就仍然存在
      - - InPost
        - 国际柜机参照
        - 2025 年有 94,536 个非上门取件点和 61,196 台 APM
        - 欧洲非上门包裹用户和商家
        - 把规模化柜机密度转化为收入和包裹量增长，但资本开支很重
        - 成熟柜机市场中，密度飞轮和资本开支负担的最佳参照
      - - Amazon Hub Apartment Locker
        - 国际物业准入参照
        - 物业经理案例研究和居民帮助流程，而非公开全国数量披露
        - 住宅楼宇和物业经理
        - 面向物业的全包、价格有竞争力的方案；居民自助取件
        - 展示了一种主机端护城河：靠节省时间、跨承运商兼容和居民便利性构建
    notes: 本章所说的直接同行，指任何有证据支撑、能解决住宅末端取件或派送问题的方式，不限于另一支中国柜机网络。
