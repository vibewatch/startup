        - 高
        - 说明 IPO 旨在继续为增长融资，而不只是让现有股东套现
        - 要求按柜机投放、软件、M&A 和国际化建设拆分 capex 预算和资金分配
      - - 上市状态
        - Yicai 报道称，因未提交补充材料，备案在 2025 年 2 月失效
        - 中
        - 香港上市路径下，新股资本能多快募到仍存在不确定性
        - 要求披露当前重启时间表、顾问准备情况，以及剩余补充工作
      - - 承销支持
        - 申请版本和报道显示只有一家独家保荐人；留存来源未见公开价格区间或扩大的现场承销团
        - 中
        - 公开承销阵容偏薄，会削弱外部需求和估值支撑的验证力度
        - 要求披露活跃账簿管理人名单、基石投资者管线、估值反馈和最新交易所意见
      - - 债务 / 项目融资义务
        - 留存来源未发现公开披露
        - 低
        - 隐性债务或类租赁承诺可能实质性改变现金跑道和下行情景
        - 提供债务明细、担保、租赁义务，以及任何项目融资或供应商授信安排
      - - 监管跟进
        - Yicai 报道称，CSRC 于 2024 年 10 月要求进一步说明 VIE 架构和合规
        - 中
        - 即便业务改善，流程风险仍可能拖慢资本获取
        - 要求提供交易所和 CSRC 意见日志，以及当前整改状态
    notes: 公开记录对融资压力是否存在支撑较强，但量化资产负债表所需细节较弱。债务、担保和 2024 年后的现金流向仍是最大盲点。
