        - 要求披露最新月度现金余额，以及受限 / 非受限现金拆分
      - - 2021 年融资遗留压力
        - 据报道，若 Hive Box 未能在 2025-01-27 前上市，投资者将获得赎回权
        - 中
        - IPO 延误会从时间表问题升级为资产负债表和控制权问题
        - 要求提供最终融资文件，以及赎回情景下的股权结构表瀑布
      - - 拟议延期付款
        - 据报道，Hive Box 提出支付约 USD 80M，将赎回截止日延至 2027-01-31
        - 中
        - 说明保住上市选择权本身可能就需要大额现金流出
