        title: 快递员集中、SF 影响和点位进入权，是主要客户风险依赖
        blocks:
          - type: paragraph
            body: >-
              本章的核心客户风险结论是，Hive Box
              的用户宽度并没有消除它对一组相对狭窄运营关系的依赖。快递公司仍是基础付费工作流，公开来源也仍把末端投递视为核心业务，即便其收入组合占比已经下降。如果快递员依赖足够分散且被透明计量，这种依赖可以管理；但公开集中度披露很薄。Yicai
              Global 称，其他三家创始快递公司在 2018 年退出，而 SF 创始人王卫仍是控制锚点；即便平台名义上仍向所有快递员开放，这也提高了围绕 SF
              的生态集中度。物业和公共点位业主是第二重依赖，因为他们控制物理进入权和本地密度。最后，监管现在把客户同意纳入运营链，因此快递员行为、通知设置和物业接受度会同时影响客户价值。结果是一张采用真实、覆盖很宽的网络，但其耐久性仍可能被少数快递员、点位业主或收费政策瓶颈削弱。
