      - number: '7.4'
        title: 客户反弹、隐私表面与支付处理抬高信任风险
        blocks:
          - type: paragraph
            body: >-
              Hive Box 的客户风险和控制风险无法分开，因为同一条工作流串起了投柜、通知、身份数据和付款收取。2026 年反向报道显示，用户仍在抱怨强制投柜、通知遗漏、夜间投放，以及通勤者无法在 18
              小时内取件时近乎无法避免的收费。它不只是坏
              PR：与招股书相关的报道显示，超时保管收入在经济上有分量，因此信任问题可能变成模型问题。公司自己的隐私政策确认，它在数字和实体触点上广泛收集身份、地址、生物识别和包裹级数据；钱包协议还加入了实名验证和第三方支付流。已审阅证据没有发现公司披露重大网络安全事件，但这并不会抵消风险，只会把重点转向合规成熟度、可审计性和事件响应准备。尽调要问的是，Hive
              Box 是否具备足够深的控制能力，匹配它已经搭出的隐私、通知和支付综合表面。
            claimRefs:
              - CR013
              - CR016
