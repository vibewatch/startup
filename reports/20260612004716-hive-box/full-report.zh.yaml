  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前价值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 快递末端配送服务
        - 快递员或快递公司把包裹投进柜、让收件人自取时支付入柜配送费
        - RMB / 包裹
        - 2023 年收入 RMB 1.84B，占收入 48.2%；2024 年 1–5 月收入 RMB 777M，占比 40.8%
        - 规模大、可重复，网络密度带来韧性；但结构上仍绑在较低毛利的重资产流程上
        - 要求披露每件包裹实际平均收费、各快递公司的折扣，以及同意规则收紧后的流失风险
      - - 消费者智能寄递 / 逆向物流
        - 消费者用柜子退货、自助寄件及完成其他出站智能寄递流程
        - RMB / 包裹或订单
        - 2023 年收入 RMB 1.02B；2024 年 1–5 月收入 RMB 692M，同比 +107.3%
        - 增长最快的收入流；相较纯入柜费，货币化和交叉销售潜力可能更好
        - 要求按产品拆分退货、自助寄件及其他出站流程的组合，并给出各流程单位利润
      - - 超时保管费和会员
        - 消费者在免费取件窗口后付费，或订阅会员免除费用
        - RMB / 包裹或会员
        - 免费 18 小时，之后每 12 小时 RMB 0.5，单件封顶 RMB 3；2021 年至 2024 年 1–5 月累计披露保管费收入 RMB 808M
        - 小额现金货币化能力强，但政治和声誉敏感度高
        - 要求披露会员渗透率、减免率、投诉率，以及监管或服务政策调整后仍能保住多少费用收入
      - - 广告 / 社区 / 到家 / 洗衣服务
        - 用柜端流量承载媒体和相邻社区服务变现
        - RMB / 活动或订单
        - 包含在增值服务收入内；公开来源提到广告、洗衣和到家服务，但未按业务线拆收入
        - 增量货币化可能有吸引力，但公开披露过于汇总，难以判断耐久性
        - 要求披露 2023–2024 年广告、洗衣、到家服务及其他增值业务线的收入拆分和毛利率
      - - 跨境和低线城市扩张可选项
        - IPO 募资用途拟投向更多柜机，以及低线和海外市场的非到店物流能力
        - 资本开支和收入未公开
        - 已披露增长计划，但尚无公开收入贡献
        - 可能扩大规模并分散地域风险，但回报跑通前会先抬高资本开支需求
        - 要求按新增地域披露预期回本周期、柜机经济性，以及已预先锁定的物业或合作伙伴管线
    notes: 表格把已披露收入桶与公开来源提到、但未单独量化的相邻变现渠道分开。增值服务子线仍有部分推断成分，因为公开披露把它们合并呈现。
