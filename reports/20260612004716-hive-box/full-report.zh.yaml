          values:
            - 快递员和线路团队使用柜组
            - 快递公司通过线路经济或服务费付款
            - 当密度降低人力和失败投递时批准
        - label: 居民家庭
          values:
            - 居民取件或寄件
            - 通常不付费，除非发生超时或使用高级服务
