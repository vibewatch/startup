  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 公开数值 / 代理指标
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 柜网规模
        - 截至 2024-05-31，330,200 组柜机、29.9M 个格口，覆盖约 209K 个社区
        - 高
        - 只要使用率保持高位，规模应改善线路效率并摊薄固定成本
        - 要求按柜机投放年份披露柜机队列回本和 EBITDA 贡献
      - - 消费者智能寄递增长
        - 2024 年 1–5 月收入 RMB 692M，同比 +107.3%；逆向包裹是核心驱动
        - 中
        - 出站场景价值更高且增速快，能改善收入结构，并降低对基础快递入柜费的依赖
        - 要求按逆向物流、自助寄件及其他消费者流程披露贡献利润
      - - 保管费货币化
        - 2021 年至 2024 年 1–5 月累计披露保管费收入 RMB 808M
        - 高
        - 小额费用收入实质性支撑网络变现和柜格周转
        - 要求测算超时费政策变化和会员采用率对 EBITDA 的敏感性
      - - 毛利率拐点
        - 毛利率从 2023 年的 10.6% 升至 2024 年 1–5 月的 26.1%
        - 高
        - 报告中的经营故事明显改善，但改善来源决定可持续性
        - 要求披露分部毛利率，并桥接 2023 到 2024 年毛利率改善
      - - 折旧年限重置
        - 2024 年许多柜机折旧年限从 5 年改为 10 年
        - 中
        - 会计年限拉长会推高短期报告利润，但本身不产生现金
        - 要求审计口径量化对 2024 年毛利、EBITDA 和柜机层面回本的影响
      - - 重资产成本代理
        - 二手分析显示每组柜机硬件 RMB 50K–80K，租金占总成本 40%–50%
        - 低
        - 即便外部代理不精确，也确认硬件和物业经济性仍是模型核心
        - 提供当前柜机 capex、场地租金负担，以及每组活跃柜机维护成本
      - - 流动性缓冲
        - 截至 2024-05-31，现金及现金等价物 RMB 859M
        - 高
        - 即使首次盈利期已经出现，扩网仍吃资本，流动性仍然关键
        - 提供月度烧钱、营运资金波动和最低现金政策
      - - CAC / 回本 / NRR
        - 未公开披露
        - 低
        - 缺少这些指标，投资者无法检验 2024 年盈利是否来自耐久的获客经济性
        - 提供队列留存、CAC、回本、重复使用行为，以及 NRR 或类似参与度指标
    notes: 本表混合了已披露事实和明确标注的外部代理指标。公开证据不足的地方，行内直接列出所需尽调问题，而不是编造精度。
