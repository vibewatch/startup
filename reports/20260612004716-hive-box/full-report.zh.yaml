      - number: '2.2'
        title: TAM、SAM、SOM，以及公开估算为何彼此矛盾
        blocks:
          - type: paragraph
            body: >-
              公开市场规模看似矛盾，是因为分母不同。最宽口径下，第三方研究机构估计中国 CEP 市场 2026 年为 USD 140.9 billion，中国电商物流市场 2026 年为 USD 235.89
              billion。这些口径包括干线运输、仓储、运输、即时服务和许多 Hive Box 并不拥有的物流增值活动。IMARC 对 2025 年末端配送 USD 29.13 billion
              的估算更窄，但仍覆盖人工快递员、自行车、货车、无人机，以及许多不依赖共享快递柜的末端配送形式。


              最相关的自上而下口径，是招股书里的中国「末端物流解决方案」类别；公司称该类别 2023 年收入约 RMB 46.7 billion，到 2028 年可达 RMB 78.8
              billion。即便如此，它仍比单纯柜组更宽，因为包含末端寄件和其他节点型解决方案。Mobility Foresights 对 2025 年中国智能快递柜 USD 1.08 billion
              的估计，是最窄且直接相关的公开市场数字。正确的分析结论不是某个来源「对」、其他来源「错」。而是把单纯快递柜 TAM、更宽的节点型末端 SAM、全国包裹 / CEP 背景分层看。Hive Box 当前 SOM
              最适合定性表达：它有全国密度和最大网络，但即便招股书显示其在更宽「末端解决方案」类别中份额只有 6.1%，其单纯快递柜收入份额也没有被公开拆出。
