        - 完整经审计 2024-2026 YTD 数字和监管往来会提高置信度。
      - - 风险评级
        - 高
        - IPO 时点、赎回权和变现质量问题都可能迅速压缩股权价值。
        - 只有结构和披露栈简化后，风险才会下降。
      - - 估值立场
        - 偏高
        - RMB25 billion 意味着基于可见锚点约 5.5x-6.6x 销售额，高于更干净的上市快递柜或物流参照。
        - 接近基准情景区间，或出现新的乐观情景证据后，立场会转向合理。
      - - 决策含义
        - 不要把旧私募标记承销为当前公允价值
        - 更合适的姿态是把公司留在观察名单，同时要求证据或价格纪律。
        - 新的经审计利润基础，加上更清晰的分配瀑布，可以改变判断。
