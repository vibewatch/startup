        - 与社区节点无关的一般互联网广告和大众媒体
        - 广告主和品牌付费；居民是受众；运营商变现流量
        - 节点密度建立后，重要的第二付款方池
      - - 消费者寄件 / 退货与逆向物流
        - 自助寄件柜、商家退货流，以及挂在取件 / 投递网络上的增值逆向物流
