        title: 融资历史、估值证据与关键利益相关方
        blocks:
          - type: paragraph
            body: >-
              Hive Box 的融资路径显示，它靠重量级物流和私募资本支持放大规模，却比早期投资人预期更久地留在私有市场。公开报道指向 2015 年设立时 RMB 500 million 初始融资、2016 年再融 RMB
              500 million、2017 年融资 RMB 2.5 billion、2018 年战略融资把估值推至约 RMB 9 billion，以及 2021 年 1 月 US$400 million
              战略轮；多家媒体把该轮投后估值放在约 US$3.3-3.4 billion。run date 最重要的公开估值锚点有两个。第一，2024 年 8 月 HKEX 递表和递表衍生报道仍把 2021
              年融资价作为最新硬轮次基准。第二，胡润相关的 2024 年二级报道称 Hive Box 在 2024 全球独角兽榜位列第 270 名，估值 RMB 25
              billion；这与公司仍是大型民营独角兽、而非刚刚被下调估值的故事方向一致。股权结构同样偏控制人：王卫占主导，中国邮政相关资本有分量，Asia Forge 因后续回购纠纷仍是重要变量。
