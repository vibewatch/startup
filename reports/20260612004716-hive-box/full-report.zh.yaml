      - number: '4.3'
        title: 资产强度、利用率与营运资本压力
        blocks:
          - type: paragraph
            body: >-
              Hive Box 仍像重资产网络公司，而不是类软件平台。到 2024 年 5 月，它已在约 209,000 个社区部署 330,200 组柜、29.9M 个格口，服务 367.8M 名消费者和 3.5M
              名快递员。这一足迹创造了有意义的密度和可防守的末端位置，但也带来硬件、点位租金、电力、维护和服务运营上的大额固定义务。二级行业分析把快递柜硬件成本放在每组约 RMB 50K-80K，部分柜体超过 RMB
              100K，并称物业租金可吃掉总成本的
              40%-50%。即便这些代理数字达不到招股书级别，它们也与公司长期亏损历史、以及必须维持高柜体周转的需求方向一致。滞留费、退货增长和相邻服务，有助于推高利用率和单格口收入，但也说明 Hive Box
              仍在处理一个网络经济问题：任何增长或利润率改善，都必须对冲一个建设成本很高的大型存量网络。
