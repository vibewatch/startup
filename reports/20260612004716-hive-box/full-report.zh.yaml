      - number: '8.2'
        title: 公开可比公司更支持战略兴趣，而不是支持当前价格
        blocks:
          - type: paragraph
            body: >-
              最干净的上市快递柜可比公司是 InPost，这个视角会让 Hive Box 多头冷静下来。InPost 规模更大、更成熟、也更透明：2025 年收入 PLN14.7 billion，调整后 EBITDA
              利润率接近 28%，自动包裹机超过 61,000 台，2026 年 6 月公开市场估值约为 2.7x EV-to-sales。以 Hive Box 2024 年 1-5 月收入年化值作粗略锚点，InPost
              的倍数对应大约 RMB12.5 billion 的价值类比；这还没有因为 Hive Box 盈利能力更弱、上市风险悬而未决、披露更嘈杂而打折。它不说明 Hive Box 是坏业务，只说明 25 billion
              估值标记很难用公开证据守住。


              JD Logistics 和 Cainiao 也重要，但主要是战略和警示性可比。JD 说明，当模型资本密集、竞争激烈时，公开市场可以用很低的销售倍数给大型物流网络定价。Cainiao 说明，即使物流资产嵌在
              Alibaba 内部，也可能出现估值重置和 IPO 时间滑坡。Amazon Locker 在战略上同样重要，但 Amazon
              是把快递柜放进更大的商业和履约生态里变现，而不是把它作为独立高倍数上市子公司。合在一起，这些可比公司说明 Hive Box 值得战略关注，因为末端基础设施很重要；但证明 25 billion 独立股权价值的责任在
              Hive Box，不在市场。
