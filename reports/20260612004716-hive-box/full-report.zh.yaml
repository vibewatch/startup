              材料更强调一体化供应链基础设施和零售服务，而非独立快递柜资产，因此 JD 更像宽口径替代渠道，不是纯快递柜同行。国际上，InPost 展示了当快递柜成为全国习惯时，密度加资本开支领导力会是什么样；Amazon
