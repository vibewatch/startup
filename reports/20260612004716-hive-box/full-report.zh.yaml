      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Hive Box 处在一个多边市场里。快递员和快递公司是直接运营用户，因为快递柜把多次上门压缩成一次投递，减少失败尝试，并可能降低路线时间。居民也是直接用户，但并非被锁住的用户：他们看重 24/7
              取件、隐私和无接触取件，但当快递柜未经同意变成默认选项，或超时费来得太快时，也会反弹。物业管理方不一定是经济付费方，却是关键看门人，因为快递柜能否进入小区，决定可达性、利用率和舆论接受度。


              配送之外，广告主和社区品牌也是真实付费类别，因为 Hive Box 能变现高频住宅触点。招股书估计中国社区营销服务市场 2023 年为 RMB 45.4 billion，到 2028 年增长至 RMB 74.0
              billion；Hive Box
              自己的网站也明确把广告列为解决方案垂直。退货商户和电商卖家则通过寄件柜、逆向物流和增值服务构成另一层付费方。因此，采用路径是一条链：商户需求产生包裹，快递员追求密度和成本节约，物业提供点位，居民判断服务是否足够便利而接受；网络足够密之后，广告主或商户再把流量变现。
