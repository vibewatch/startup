  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与产品模型
        blocks:
          - type: paragraph
            body: >-
              Hive Box 更像一家末端物流和智能设备平台，而不是单一用途的快递柜制造商。其英文官方材料描述的是一张 24/7 自助生态网络、一套 SaaS、一组开放平台
              API，以及帮助快递员、商户和消费者完成派件、取件、退货流程的硬件模块。独立的 2024 年 IPO 报道在公司身份和地点上口径一致：Hive Box，中文名为丰巢科技或丰巢控股，是一家深圳运营商，2015
              年成立，解决白天配送路线与下班后取件需求之间的时间错配。后续章节最有证据支撑的短定义是：一家深圳民营公司，靠智能快递柜及相邻软件 / 服务，变现非到户包裹投递、消费者寄退件流程和社区流量。
