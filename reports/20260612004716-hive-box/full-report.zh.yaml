        title: 财务结论与仍需承销的缺口
        blocks:
          - type: paragraph
            body: >-
              财务结论比单看 Hive Box 历史亏损画像更好，但仍不足以完整承销。公司有真实规模、已披露收入增长、向消费者智能投递迁移的清晰组合变化，以及 2024
              年初的一段盈利期。这些都是有意义的正面因素。同时，几个最重要输入仍然隐藏，或只能弱三角验证：实际快递员费率和折扣、分部毛利率、CAC 和回本周期、NRR、当前债务或项目融资义务，以及 Asia Forge
              争议的确切状态和经济影响。市场也缺少正常 IPO 阶段会澄清承销支持的信息，因为申请证明只披露了独家保荐人，并未推进到更广泛、实时的承销团流程，也没有公开基石或定价细节。因此，正确投资判断是有条件的：Hive
              Box 看起来比单纯快递柜收费故事运营更好、战略上也更多元；但资本结构、会计辅助下的利润率拐点，以及缺失的单位经济细节，仍阻止形成高置信估值判断。
