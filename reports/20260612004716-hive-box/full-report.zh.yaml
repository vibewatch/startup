      - number: '1.2'
        title: 网络规模、服务宽度与已披露运营画像
        blocks:
          - type: paragraph
            body: >-
              2024 年 8 月递表文件及其衍生报道，给出了一张扎实、可复用的规模快照。截至 2024-05-31，Hive Box 称其运营 330,200 组智能柜，约 29.9 million 个格口，覆盖中国全部
              31 个省级行政区约 209,000 个社区。同一套披露还称，网络累计服务约 367.8 million 名消费者和 3.5 million 名快递员，处理包裹超过 21.2 billion
              件。公开报道也显示，业务不再只是快递员投柜费。消费者智能投递量、洗护、到家生活服务和广告，都已经成为实质叙事组成部分。这一点重要，因为公司 2024
              年盈利改善看起来不仅靠网络密度，也靠业务组合向增长更快的消费者服务和增值服务转移。
