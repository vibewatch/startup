          label: 快递员投递使用
          description: 快递员使用快递柜网络完成最后一公里投递，以及相关调度或钱包工作流。
        - id: consumers
          label: 消费者取件 / 寄件
          description: 消费者取包裹、自寄，并使用逆向物流服务。
        - id: adjacent
          label: 邻近变现
          description: 广告主和消费者服务合作伙伴把屏幕流量和社区注意力变现。
        - id: retention
          label: 留存 / 续约证明
          description: 这里的公开证据更薄，因为 NRR、GRR、流失率、续约和头部账户集中度都未披露。
      edges:
        - from: sites
          to: couriers
          label: 实体触点打开投递流程
        - from: couriers
          to: consumers
          label: 24/7 取件和寄件 / 退货任务
        - from: consumers
          to: adjacent
          label: 流量生成广告 / 服务库存
        - from: adjacent
          to: retention
          label: 重复消费或重复使用应体现耐久性
        - from: consumers
          to: retention
          label: 队列和投诉可证明粘性
    claimRefs:
      - CU008
      - CU009
      - CU011
      - CU012
      - CU016
      - CU035
      - CU039
      - CU042
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 公开证明在广泛快递员 / 消费者规模和具名地铁部署上最强，在广告主、商户和留存可见性上最弱。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 留存可见性
        - 反向覆盖
      rows:
        - label: 快递员网络
          values:
            - 高：监管文件 + 多篇新闻交叉印证
            - 规模证据高，头部客户细节低
            - 低：无快递员留存或份额数据
            - 中：用户同意规则和快递员行为可能伤害体验
        - label: 居民 / 消费者
          values:
            - 累计触达和收费政策证据高
            - 中：取件、自寄和退货是清晰用例
            - 低：无活跃队列，只有吞吐量代理指标
            - 高：反弹、通知摩擦和费用敏感性均已公开
        - label: Shanghai Metro
          values:
            - 高：官方城市渠道和 People’s Daily 报道
            - 高：具名站点、位置和柜体数量
            - 低：未披露使用量或续约数据
            - 低-中：公共站点经济性未披露
        - label: Shenzhen Metro
          values:
            - 中-高：Shenzhen Daily 加二级 2026 年材料交叉印证
            - 中：具名站点数量和 Hive Box 小程序使用
            - 低：无合同或复用指标
            - 低-中：战略范围仍需一手材料交叉印证
        - label: 广告主
          values:
            - 中：监管文件期证据披露了总量
            - 低：缺少具名客户
            - 低：重复投放和集中度未披露
            - 中：广告覆盖广度未必等于稳定收入质量
        - label: 物业场地方
          values:
            - 中：具名早期合作伙伴，加上官方多物业定位
            - 中：部署角色清晰，商业条款不清楚
            - 低：缺少续约 / 撤柜指标
            - 中：场地方流失可能迅速削弱密度
    claimRefs:
      - CU016
      - CU019
      - CU021
      - CU023
      - CU037
      - CU039
      - CU041
      - CU042
