      - number: '2.4'
        title: 增长驱动、劳动力约束与采用障碍
        blocks:
          - type: paragraph
            body: >-
              结构性驱动很强。国家政策已经明确鼓励更先进的城乡快递体系、智能末端服务设施和共享配送基础设施。包裹量持续复利增长，内陆地区在全国吞吐量中占比提高，二线城市已经贡献电商物流需求的大块份额，低线扩张也仍是管理层
              IPO 募资用途叙事的核心。劳动力压力同样利好非到户节点：在先征得同意的上门配送规则下，快递员反映单件收入低、投入上升；中国邮政—Cainiao 这类数字合作也显示，自动化和共享节点能降低人工成本，并扩大退货 /
              寄件可达性。


              但障碍对承销同样关键。支持更好服务的同一套规则，也防止运营商把快递柜强行嵌入每个流程；同意、收费披露和反复免费派送尝试，都会压住利用率和变现。Hive Box 2020
              年滞留费政策引发居民反弹，说明便利性并不会抹掉价格敏感。天津的学术证据又增加了一层障碍：快递柜增长再快，也可能投错位置，造成家门 300
              米内需求高、供给却更多落在更远处。再加上资本开支、维护、点位谈判、互操作性和利用率风险，正确的市场判断应是选择性密度经济，而不是全国规模下自动赢家通吃。
