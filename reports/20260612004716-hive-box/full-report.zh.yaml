      - - 监管可以保护用户并限制强制策略
        - 同意和披露规则现在直接约束强制入柜
        - 执法可能压缩变现，或要求逐城调整运营
        - 高
        - 索取内部合规审计，以及各城市专项整改成本
      - - 负面的资本市场历史提高竞争脆弱性
        - IPO 延迟、诉讼和收费反弹可能分散管理层精力，并削弱其与场地方或合作伙伴谈判的姿态
        - 若未解决，资本获取和场地方信心可能相对同行进一步恶化
        - 中
        - 索取最新诉讼状态、CSRC / HKEX 整改进展和收费政策复盘结果
