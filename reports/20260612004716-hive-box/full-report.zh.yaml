      - number: '5.2'
        title: 硬件组合与控制系统架构
        blocks:
          - type: paragraph
            body: >-
              硬件栈明显宽于通常定义这个类别的标准智能快递柜。Hive Box
              目录公开展示至少七条硬件线：主快递柜、小尺寸智能柜、自助寄件柜、备件柜、邮政包裹柜、双面柜和蓝牙柜，另有独立报道提到处于试点部署的无人机中转柜。目录重要，因为每个模块都会改变工作流逻辑。小尺寸智能柜把受限空间里的控制推向
              QR 优先的移动端；寄件柜为外寄包裹揽收增加
              Android、4G、摄像头和支付功能；备件柜把网络重新定位到企业补货；邮政包裹柜则优化混合信件和包裹密度。在这些模块上，公司描述了一套一致控制模型：嵌入式柜体逻辑、移动和网页界面、身份与钱包规则，以及可由承运公司和消费者注册使用的
              SaaS 或 Flexi 层，用于 PUDO 场景。公开证据对确切 API 界面的披露弱于硬件描述，但已经清楚显示，产品是一张软件协调的设备网络，不是被动柜体足迹。
