        - 2023 年收入 RMB3.812B；2024 年 1–5 月收入年化约 RMB4.57B
        - 私募估值 RMB25B；约 5.5x–6.6x 销售额
        - 标的公司和直接定价问题
        - 私募估值已经滞后，且没有上市交易价格或新的审计包刷新
      - - InPost
        - 2025 年收入 PLN14.71B；调整后 EBITDA 利润率 27.9%；61,196 台 APM
        - 2026 年 6 月约 2.73x EV/Sales、约 2.10x P/S
        - 最接近的上市储物柜主导可比公司，包裹密度真实、披露成熟
        - 地域不同，包裹量更大，盈利能力更强
      - - JD Logistics
        - 2025 年收入 RMB217.1B；1,600+ 个仓库；覆盖 25 个国家
        - 2026 年 6 月约 0.30x P/S
        - 说明公开市场如何给大型重资产物流基础设施定价
        - 业务范围远宽于储物柜，并嵌在庞大的平台生态里
      - - Cainiao / Alibaba 背景
        - Cainiao 2025 年 3 月季度收入 RMB21.6B；自动化和海外投资仍在继续
        - 尽管战略价值明确，估值仍被重估，IPO 也被推迟
        - 说明即便规模化物流资产也会承受时点和估值压力
        - Cainiao 嵌在 Alibaba 内部，不是干净的独立上市倍数
      - - Amazon Locker 背景
        - 面向住宅的全承运商储物柜产品；2026 年全球网点估计超过 100k 个
        - 战略用途很清楚，但没有独立公开股权倍数
        - 可用于判断品类战略重要性和网络效应
        - Amazon 把储物柜放在更大的电商和履约系统内变现
    notes: 这组可比公司有意混合：一个干净的上市储物柜可比公司、一个宽口径上市物流公司，以及两个战略生态可比对象。这样的组合比硬用单一倍数挤出虚假的精确度更诚实。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and strategic references for a smart-locker operator rather than every
        possible logistics peer.
