  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型、定价机制与组合迁移
        blocks:
          - type: paragraph
            body: >-
              Hive Box
              用分层模型变现最后一公里，而不是只收一项快递员费用。官方中文和全球站把业务描述为自助快递柜网络，通过包裹投递、取件、退货寄件、在线结算和数据共享流程，把快递员、消费者、物业管理方和寄递伙伴连起来。公开市场报道再把这一运营模型对应到三类已披露收入：面向快递员的末端配送费；自助寄件、电商逆向物流等消费者智能投递服务；以及包含暂存费和广告、洗护、到家服务等相邻服务的增值收入。收入组合正远离单纯快递员投柜费。末端配送在
              2023 年仍是最大板块，收入 RMB 1.84B，但占比已低于一半；消费者智能投递升至 RMB 1.02B，增值收入达到 RMB
              956M。这种迁移重要，因为增长更快的流似乎比传统按件付费的投柜业务带来更好的变现选择权。
