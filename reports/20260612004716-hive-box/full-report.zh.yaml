            body: >-
              表面看，收入曲线很强。递表衍生数字显示，收入从 2021 年 RMB 2.526B 增至 2022 年 RMB 2.891B、2023 年 RMB 3.812B；2024 年前五个月达到 RMB 1.904B，较
              2023 年同期增长 33.6%。亏损也在公司最终转正前大幅收窄：净亏损从 2021 年 RMB 2.071B 降至 2022 年 RMB 1.166B、2023 年 RMB 541.5M，随后 2024 年
              1–5 月实现 RMB 71.6M 利润。关键细节是，转折并非单一因素驱动。公开报道反复指向三段故事：消费者智能投递收入同比翻倍以上，逆向物流包裹仍是强增长引擎，快递柜折旧年限变更实质性降低了已报告销售成本。因此
              2024 年拐点是真实的，但还不是干净证据，不能证明稳态经济性已经在没有会计和组合变化帮助下跑通。
