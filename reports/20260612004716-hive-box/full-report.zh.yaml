            body: >-
              Hive Box
              的客户地图，比从柜体取一个包裹这个可见动作更宽。官方中文材料明确把公司定义为连接物流企业、物业管理方、快递员和消费者的平台；英文案例研究则分别展示物流、新零售和广告解决方案。这很重要，因为公司至少有五个具备经济意义的客户界面：为末端投放能力付费的快递公司和快递网点；使用取件、自助寄件和退货流程，并可能支付超时费或会员费的居民；逆向物流需求带动消费者智能投递增长的商户和平台；购买柜屏触达的广告主；以及授予物理进入权和密度的物业或公共点位业主。API
              和钱包材料进一步证明，这不是一张被动快递柜网络。Hive Box 暴露派件、寄件、暂存、路由、支付和取件接口，更符合多边运营模型，而不是单一消费者 App。
