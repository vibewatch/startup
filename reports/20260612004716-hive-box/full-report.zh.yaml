      - number: '5.4'
        title: 信任、隐私、支付与合规控制
        blocks:
          - type: paragraph
            body: >-
              信任现在是产品变量，不只是法律附录。Hive Box
              自己的隐私政策和钱包规则显示，快递柜工作流周边承载了大量受监管信息和资金处理：实名信息、证件、电话、地址、设备和使用日志、钱包充值、委托支付和交易记录。公司称境内个人数据存储在中国，并通过加密、匿名化、审计和事件响应措施保护；Apple
              隐私卡则从更面向用户的角度提醒，位置、使用情况、诊断和追踪标识符可能进入 App
              层。监管也直接塑造产品设计。中国更新后的快递市场规则禁止承运人在未经用户同意时把包裹放入快递柜，并要求披露价格和投诉处理渠道；这意味着便利性不能靠沉默的强制投柜合法取得。在这个背景下，2026
              年广告争议比普通消费者 App 的同类事件更重要：当取件本身被不可关闭弹窗，或 WeChat 与 App 设置差异打断时，变现就开始侵蚀快速、无摩擦取件这一核心价值主张。
