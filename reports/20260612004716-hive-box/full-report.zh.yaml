        - 还有多少比例的派送需要直接同意或重复尝试，这会怎样打击利用率？
      - - 住宅社区内点位错配
        - 约束
        - 当前
        - 即使城市层面包裹需求很强，点位选错也会浪费资本并引发居民投诉
        - Hive Box 有多少比例的点位位于目标住户 5 分钟步行范围内？
