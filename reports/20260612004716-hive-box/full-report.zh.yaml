  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 只有乐观情景能清楚守住或超过旧 RMB25 billion 估值。
    data:
      items:
        - label: 悲观情景
          low: 6
          mid: 8
          high: 10
          displayValue: RMB6B-RMB10B
          detail: IPO 仍卡住，变现质量偏弱，物流倍数更低
          tone: risk
        - label: 基准情景
          low: 13
          mid: 16
          high: 19
          displayValue: RMB13B-RMB19B
          detail: 战略资产，但估值更像成熟物流基础设施
          tone: neutral
        - label: 乐观情景
          low: 25
          mid: 28
          high: 32
          displayValue: RMB25B-RMB32B
          detail: 经审计规模更新，盈利可重复，结构更干净
          tone: positive
        - label: 2024-2025 年头部估值
          low: 25
          mid: 25
          high: 25
          displayValue: RMB25B
          detail: 可作为参考点，但不能证明当前公允价值
          tone: neutral
    approximationNotes: 区间故意拉宽，因为最关键的承销输入仍未公开，或公开来源已经过时。
    claimRefs:
      - CV004
      - CV040
      - CV047
      - CV048
      - CV049
      - CV050
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: IC 式打分显示，这门生意具备战略吸引力，但在旧价格下风险还没有降到足够低。
    data:
      items:
        - label: 战略稀缺性
          value: 8
          unit: /10
          detail: 真实的末端柜机密度和合作伙伴覆盖
          tone: positive
        - label: 规模证明
          value: 7
          unit: /10
          detail: 多个来源都显示网络指标庞大且持续
          tone: positive
        - label: 盈利证明
          value: 4
          unit: /10
          detail: 正在改善，但时间较近，且尚未在经审计公开材料中完整更新
          tone: neutral
        - label: 披露质量
          value: 3
          unit: /10
          detail: 失效申报让当前投资案例仍有太多信息停留在私下
          tone: risk
        - label: 资本结构清洁度
          value: 2
          unit: /10
          detail: 回赎和优先权风险仍未解决
          tone: risk
        - label: 上市可比公司支撑
          value: 3
          unit: /10
          detail: InPost 和 JD 不能清楚支撑旧估值
          tone: risk
        - label: 进入吸引力
          value: 4
          unit: /10
          detail: 值得放入观察名单，但价格和证据都很敏感
          tone: neutral
    claimRefs:
      - CV001
      - CV016
      - CV019
      - CV033
      - CV045
      - CV046
      - CV050
      - CV051
