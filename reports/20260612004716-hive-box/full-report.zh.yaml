      - number: '7.3'
        title: 快递柜资产经济性与合作方依赖会相互放大
        blocks:
          - type: paragraph
            body: >-
              Hive Box
              的网络规模也是它的核心经营风险。装机基础足够大，能形成有意义的切换壁垒；但同样的规模也把公司锁进租金、电费、维护和服务义务里，若不损害密度，很难快速收缩。公开评论和反向报道显示，一些社区已经撤掉或缩小低使用率柜组。这个信号重要，因为模型需要足够密集的本地覆盖，才能维持包裹量和消费者便利性。依赖风险和资产问题紧密相连。SF
              仍是锚定股东和生态赞助方，其他快递股东早已退出，使用快递柜的快递员并非 Hive Box 员工，物业管理方仍决定柜机能否保留点位。因此，修订后的同意规则不只是抽象监管暴露，而是在 Hive
              Box、快递员和物业之间制造现实协同难题。如果包裹流转转向其他末端渠道，或物业续约转弱，利用率下滑会快过固定成本退出。
