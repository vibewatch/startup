  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 要素
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 网络规模
        - Hive Box 在中国拥有稀缺的末端快递柜密度，真实装机基础构成护城河。
        - 仅有装机基础，并不保证高质量经济性或更高公开市场倍数。
        - 展示城市级利用率、回本和续约经济性。
      - - 战略角色
        - Amazon、Cainiao 和 JD 都暗示，快递柜在更大物流生态中具有运营价值。
        - 战略相关性并不能证明独立股权价值应享受高倍数。
        - 展示基础包裹处理之外的软件、数据和抽佣变现。
      - - 财务轨迹
        - 亏损大幅改善，2024 年 1-5 月转为盈利。
        - 盈利窗口可能太短、季节性太强，或过度依赖收费，难以安全年化。
        - 提供完整经审计 2024 和 2025 报表，以及 2026 YTD 桥接。
      - - IPO 可选性
        - 重启香港上市可以带来流动性和新的价格发现。
        - 失效申报和监管问题说明退出时点不确定，窗口可能继续关闭。
        - 分享监管问答包和保荐人重新申报计划。
      - - 资本结构
        - 大额私募轮说明机构投资者曾经有兴趣。
        - 在普通股获得上行前，赎回权和延期付款可能把价值漏给优先股持有人。
        - 披露当前股权结构表、清算瀑布和附属协议。
      - - 竞争定位
        - Cainiao 和 JD 证明物流基础设施仍具战略重要性。
        - 同样的可比公司也说明，规模并不能阻止公开市场估值压缩。
        - 证明 Hive Box 比泛物流基础设施更配得上高质量业务标签。
    notes: 本表把公司质量和价格质量分开：一家公司可以有战略吸引力，同时在公开证据集上仍然定价过高。
