  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与快递员—居民工作流
        blocks:
          - type: paragraph
            body: >-
              Hive Box 的产品最好理解成快递柜网络工作流系统，而不是裸柜 OEM。官方全球和中文站持续描述的是物理快递柜、SaaS
              控制软件、移动端和网页入口、面向伙伴的集成轨道，连接快递员、居民、物业管理方和物流系统。在默认包裹流程里，快递员完成认证、扫描运单、给收件人分配格口，然后把包裹放进柜体。居民随后收到短信或 App
              通知，通过取件码、QR 流程，或越来越多的一键远程开柜取件。基础路径之外，周围又叠加了自助寄件和逆向物流、临时暂存，以及洗护和到家服务等社区服务。来源包最强的结论是，Hive Box
              的核心产品不是快递柜本身，而是柜体接入、App 驱动身份，以及一组让柜网全天保持活跃的居民和快递员流程。
