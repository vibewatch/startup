        - 免费 18 小时，之后每 12 小时 RMB 0.5，单件封顶 RMB 3
        - Sina、Tencent News、China Daily HK 及招股书二手分析
        - 费用表明确，有助于建模费用收入，但争议性让它在政策上脆弱
