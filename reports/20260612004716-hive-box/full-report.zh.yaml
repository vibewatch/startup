  - id: FP002
    title: 护城河就绪 KPI
    type: kpi
    layout: standard
    summary: Hive Box 在装机密度和伙伴工具上得分最高，但监管和替代方案明显削弱纯定价权。
    data:
      items:
        - label: 装机基础优势
          value: High
          detail: 披露的 330.2k 台柜和广泛社区触达仍是真实经营优势
        - label: 物业准入耐久性
          value: Medium
          detail: 准入很重要，但排他性和流失率没有公开披露
        - label: API / 伙伴集成
          value: Medium-High
          detail: 开放 API 和打包运营指引应有助于伙伴粘性
        - label: 收件人定价自由度
          value: Low-Medium
          detail: 反弹和同意规则限制超时费或强制投放经济能推多狠
        - label: 替代压力
          value: High
          detail: 有人值守驿站、上门覆盖和紧急同城服务仍是活跃替代方案
