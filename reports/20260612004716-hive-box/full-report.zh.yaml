        - 末端投递入柜、派送、路由、取件码交接。
        - 累计服务 3.5M 名快递员；2021-2023 末端配送包裹量为 6.204B / 5.823B / 6.463B。
        - 核心传统流程，仍是锚定网络流量来源。
        - 未公开头部快递客户的包裹份额或收入份额集中度。
      - - 居民 / 消费者
        - 购买方 / 付费方：居民在自寄、退货、超时寄存或会员场景下付费。用户：取件收件人和寄件人。
        - 包裹取件、自寄、退货、临时寄存。
        - 累计服务 367.8M 名消费者；2021-2023 消费者智能配送包裹量为 114.3M / 141.7M / 233.2M。
        - 可见使用增长最快，也是超时费和会员变现来源。
        - 未披露活跃用户、队列复购或退款解决情况。
      - - 商家 / 电商平台
        - 购买方 / 付费方：商家或平台间接付费；用户：消费者和快递员。
        - 逆向物流、电商退货、自寄流程。
        - 5M24 消费者智能配送收入同比 +107.3%，与电商逆向包裹相关。
        - 基础入柜费之外，最强的公开扩张驱动。
        - 未公开具名商家客户和合同经济性。
      - - 广告主 / 品牌
        - 购买方 / 付费方：广告主。触达用户：经过快递柜屏幕的居民。
        - 快递柜屏幕 / App 界面的终端广告和投放。
        - 截至 2024-05-31，覆盖 35 个行业、6,000 家广告主。
        - 利用已安装屏幕库存做增值多元化。
        - 未披露具名广告主、复投数据或广告收益率。
      - - 物业 / 社区 / 公共场所主办方
        - 购买方 / 场地主：物业管理方、社区运营方或地铁 / 公共场所合作方。触达用户：居民、通勤者、快递员。
        - 承载快递柜、提升密度，并延伸到公共行李寄存场景。
        - 约 209K 个社区，加上上海、深圳地铁具名部署。
        - 场地准入是护城河的一部分，因为密度和便利性都依赖它。
        - 未披露续约、撤柜或场地方收入分成。
    notes: Hive Box 是多边网络，因此各行拆分付费方、用户和场地方角色。公开证据最能证明广泛客群存在，最缺具名商家和广告主参考。
