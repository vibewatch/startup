  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: RMB25 billion 的估值标记真实存在，但已过时且结构上受限
        blocks:
          - type: paragraph
            body: >-
              Hive Box 不是一个虚假的公司质量故事。公开来源显示，它有真实的私募融资历史、真实的 2024 年 8 月香港递表尝试，也有真实的规模资产：超过 330,000 组快递柜、超过 209,000
              个社区，以及数亿用户。这足以解释为什么曾有 RMB25 billion 的私募估值，也足以说明 Hive Box 仍应留在投资者观察名单上。按 Hurun
              的方法论，它也足以支撑独角兽身份，因为该方法只要求公司未上市且估值至少 US$1 billion。


              这个标记无法证明 2026 年的当前公允价值。上市申请在 2025 年 2 月失效，据报道公司没有完成补充披露；与 2021 年融资相关的赎回权纠纷，又在新钱投资者最需要清晰度的位置形成经济悬置。拟议的大约
              US$80 million 展期付款说明，这不是一个装饰性的法律问题，而是现金和分配瀑布问题。公开财务证据好过没有，但仍然偏薄：2021-2023 年亏损超过 RMB3.7 billion，而 2024 年
              1-5 月的盈利快照虽令人鼓舞，却太短，不能当作稳定的新基准年。因此正确读法是跟踪，而不是否定：战略稀缺性存在，但在管理层刷新证据集之前，IPO 时代的估值标记已经过时且带有负担。
