  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 公开信号
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 账面现金
        - 截至 2024-05-31，现金及现金等价物 RMB 859M
        - 高
