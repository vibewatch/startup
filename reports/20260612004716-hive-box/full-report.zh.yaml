      - number: '3.3'
        title: 定价姿态、切换成本与多归属
        blocks:
          - type: paragraph
            body: >-
              定价争议不太关乎标价有多精细，更关乎每张网络对收件人有多少杠杆。围绕 Hive Box 的公开反弹集中在超时收费和未明确同意的投放上，这正是修订后的快递规则现在要求披露和用户同意的原因。Cainiao
              披露的驿站经济看起来不同：运营方变现来自包裹处理费、流量转化、广告、回收和洗护等服务，同时 App
              仍让上门配送和自提选项可见。这种组合降低了把消费者超时费当作主要收入杠杆的必要性。到门替代也给定价自由加了上限，因为当紧急性或便利性比无人自提更重要时，SF
              标准配送和同城急送仍是可用选项。结果是消费者切换成本低、多归属明显：用户会按包裹类型、紧急程度和本地楼宇规则，在快递柜、有人驿站和送货上门之间切换。不受欢迎的收费变化，更容易被用户迅速惩罚。
