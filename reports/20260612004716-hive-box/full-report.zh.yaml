          tone: risk
        - label: 低位：RMB4.5B × 2.2x
          value: 9.9
          detail: 悲观高点
          tone: risk
        - label: 基准：RMB5.0B × 3.0x
          value: 15
          detail: 基准中点
          tone: neutral
        - label: 基准上沿：RMB5.3B × 3.5x
          value: 18.6
          detail: 基准高点
          tone: neutral
        - label: 牛市：RMB6.0B × 4.2x
          value: 25.2
          detail: 乐观门槛
          tone: positive
        - label: 高位牛市：RMB6.5B × 5.0x
          value: 32.5
          detail: 乐观高点
