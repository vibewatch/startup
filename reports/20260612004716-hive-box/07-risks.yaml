- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Asia Forge litigation and redemption overhang
    - Public settlement, withdrawal, or disclosed hearing progress
    - No resolution path or no refreshed filing by 2026-12-31
    - Treat as thesis-break; avoid new exposure or demand punitive downside pricing
  - - CSRC / HKEX compliance exposure
    - Supplement package, refreshed filing, or new regulator questions
    - Another reporting cycle passes without visible progress or new questions broaden in scope
    - Assume higher compliance spend and longer liquidity bridge; pause growth underwriting
  - - Forced-locker and fee backlash
    - Complaint-platform totals, refund disputes, or local enforcement
    - Complaint counts stay above ~20k and enforcement escalates or fee rules tighten
    - Underwrite lower fee revenue, higher refunds, and slower parcel growth
  - - Locker-network economics
    - Profit trend, site removals, and utilization metrics
    - Two consecutive quarters of loss re-expansion or visible rise in removals
    - Stop assuming network operating leverage; require footprint rationalization plan
  - - SF / courier dependency
    - Parcel-share signals or strategic-support changes
    - Meaningful volume migration by SF or major couriers to other last-mile channels
    - Reset utilization and bargaining-power assumptions downward
  - - Privacy / payment control risk
    - Regulator query, breach disclosure, or wallet dispute issue
    - Formal data-security or payment-control enforcement action
    - Require independent security/payment audit before financing or re-open diligence
  notes: Thresholds are analyst-defined monitoring points intended to convert public signals into clear diligence or investment actions.
