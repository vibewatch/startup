    statement: Independent reporting frames the Asia Forge dispute as material to HKEX review because unresolved repurchase litigation can leave the shareholder roster and ownership ratios unstable during listing review.
    type: third-party-reported
    topic: hkex-review-risk
    sourceRefs:
    - SR003
    - SR005
    confidence: medium
    freshness: current
    answersQuestionRefs:
