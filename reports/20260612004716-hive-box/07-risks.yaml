  - id: CR001
    statement: Hive Box’s Hong Kong IPO has been stalled for more than a year because Asia Forge Capital sued over a share-repurchase dispute, and the August 2024 filing lapsed in February 2025 without a public refresh.
    type: third-party-reported
    topic: ipo-litigation
    sourceRefs:
