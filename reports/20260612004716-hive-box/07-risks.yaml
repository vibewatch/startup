  evidenceGaps:
  - type: missing-source
    severity: material
    topic: asia-forge-litigation-docket
    missingEvidence: The Hong Kong case number, pleadings, hearing schedule, and any asset-preservation orders for the Asia Forge Capital repurchase dispute are not visible in the reviewed public materials.
    whyItMatters: Without the actual pleadings and timetable, investors cannot size probable cash exposure, settlement pressure, or listing-delay duration with precision.
    diligencePath: Request outside counsel to provide the filed writ, defence, interim-order papers, and next hearing dates; cross-check against Hong Kong Judiciary registry search outputs.
    relatedQuestionRefs:
    - QR008
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: cybersecurity-and-payment-controls
    missingEvidence: No public third-party security audit, payment incident log, wallet dispute rate, or formal breach-response testing record was found for Hive Box’s locker, app, and wallet stack.
    whyItMatters: The platform handles identity, parcel, notification, and payment data together; control weakness could create simultaneous regulatory, customer-trust, and listing-compliance fallout.
    diligencePath: Request ISO/SOC or equivalent audit reports, incident-response playbooks, breach logs, and wallet-dispute metrics from the security and finance teams.
    relatedQuestionRefs:
    - QR019
  - type: private-evidence-only
    severity: material
    topic: locker-utilization-and-site-churn
    missingEvidence: City-level utilization, site-level profitability, property-renewal churn, and the share of lockers in low-efficiency or removal-risk locations were not publicly disclosed in the reviewed source set.
    whyItMatters: These metrics determine whether the network can self-fund maintenance and whether property-manager removals could force a value-destructive footprint reset.
    diligencePath: Request a cohort view of locker utilization, renewal status, removal history, and payback by city and property type from operations leadership.
    relatedQuestionRefs:
    - QR012
    - QR013
    relatedTableRefs:
    - TR002
    - TR003
