  - id: CR002
    statement: The 2021 financing round gave investors including Asia Forge Cayman a redemption right if Hive Box failed to list by January 27, 2025.
    type: third-party-reported
    topic: redemption-rights
    sourceRefs:
    - SR003
    - SR004
    confidence: high
    freshness: historical
    answersQuestionRefs:
    - QR002
  - id: CR003
    statement: Hive Box’s 2024 prospectus contemplated extending the redemption deadline to January 31, 2027 by paying about USD80 million in a special-rights adjustment, but Asia Forge did not agree.
    type: third-party-reported
    topic: redemption-rights
    sourceRefs:
    - SR003
    - SR006
    confidence: medium
    freshness: recent
    answersQuestionRefs:
