      - number: '3.2'
        title: Distribution and property access matter more than the box itself
        blocks:
          - type: paragraph
            body: >-
              The strongest competitive pattern in this market is control of access points. Hive Box' Chinese materials
              explicitly describe an open platform that links logistics firms, properties, couriers, and consumers,
              while its API and SaaS stack reduce integration work for merchants and carriers. Cainiao attacks the same
              neighborhood problem from the opposite direction: instead of maximizing unattended hardware only, it
              recruits staffed stations with ground-floor requirements, non-overlapping catchments, city service
              partners, and property-service-center formats. That gives Cainiao a human handoff layer and more room for
              ancillary services. The substitute set also remains real. SF Express still markets broad doorstep
              coverage, and SF Intra-City sells speed for urgent use cases. Regulation reinforces that flexibility:
              current rule explanations say locker or station drop-off cannot be forced without consent. In practice,
              that means access to buildings and resident acceptance drives durable distribution advantage more than
              locker manufacturing alone.
