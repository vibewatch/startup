      - number: '6.4'
        title: Durability proxies are positive, but retention visibility is weak and fee sensitivity remains real
        blocks:
          - type: paragraph
            body: >-
              Hive Box has meaningful durability proxies, but not the clean retention metrics investors would normally
              want. The positive side is straightforward: courier-delivery parcel volumes remain very large, consumer
              smart-delivery parcels have grown quickly, and adjacent services such as laundry, home services, and
              advertising all show real usage. Prospectus-derived evidence says the company had served 35 industries and
              6,000 advertisers by 2024-05-31, while adjacent-service order counts also rose materially. The negative
              side is that none of this discloses NRR, GRR, churn, site renewal, advertiser repeat spend, or active-user
              cohorts. Public sources instead highlight fee sensitivity. China Daily documented the 2020 backlash that
              forced Hive Box to move from 12 to 18 free hours and emphasize courier consent, while a March 2026
              complaint report still described night deposits, missing notices, and disproportionate storage fees on
              low-value parcels. That does not disprove product utility, but it does mean customer durability is still
              being inferred from traffic and breadth rather than verified by retention disclosure.
