      - number: '2.3'
        title: Buyers, users, payers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              Hive Box sits in a multi-sided market. Couriers and courier companies are the immediate operational users
              because lockers compress many door calls into one drop, reduce failed attempts, and can lower route time.
              Residents are also direct users, but they are not captive ones: they value 24/7 pickup, privacy, and
              contactless retrieval, yet they push back when lockers become the default without consent or when overtime
              fees arrive too quickly. Property managers are not always the economic payer, but they are crucial
              gatekeepers because locker placement inside residential compounds determines accessibility, utilization,
              and political acceptance.


              Beyond delivery, advertisers and community brands are real payer classes because Hive Box can monetize
              high-frequency residential touchpoints. The prospectus sizes China's community marketing services market
              at RMB 45.4 billion in 2023 with growth to RMB 74.0 billion by 2028, and Hive Box's own site explicitly
              lists advertising as a solution vertical. Return merchants and e-commerce sellers are another payer layer
              through sending boxes, reverse logistics, and value-added services. Adoption therefore follows a chain:
              merchant demand creates parcels, couriers seek density and cost savings, property managers supply sites,
              residents decide whether the service is convenient enough to accept, and advertisers or merchants monetize
              the traffic once the network is dense enough.
            claimRefs:
              - CM012
              - CM026
