              catalog matters because each module changes the workflow logic. Smart box shifts toward QR-first mobile
              control in constrained footprints; sending box adds Android, 4G, camera, and payment features for outbound
              parcel intake; spare-parts lockers reposition the estate toward enterprise replenishment; and
              post-and-parcel lockers optimize mixed mail and parcel density. Across these modules, the company
              describes a consistent control model: embedded cabinet logic, mobile and web surfaces, identity and wallet
              rules, and a SaaS or Flexi layer that can be registered by both carrier companies and consumers for PUDO
              use. Public evidence is thinner on the exact API surface than on the hardware descriptions, but it is
