        title: Growth cadence and the first profitable period
        blocks:
          - type: paragraph
            body: >-
              The top-line trajectory is strong on its face. Filing-derived numbers show revenue rising from RMB 2.526B
              in 2021 to RMB 2.891B in 2022 and RMB 3.812B in 2023, then reaching RMB 1.904B in the first five months of
              2024, up 33.6% year over year from the comparable 2023 period. Losses also narrowed sharply before the
              company finally crossed into the black: net loss fell from RMB 2.071B in 2021 to RMB 1.166B in 2022 and
              RMB 541.5M in 2023, followed by RMB 71.6M of profit in January-May 2024. The important nuance is that the
              turn is not driven by one factor. Public reporting repeatedly points to a three-part story: consumer smart
              delivery revenue more than doubled year over year, reverse-logistics parcels remained a powerful growth
              engine, and a change in locker depreciation life materially lowered reported cost of sales. That means the
              2024 inflection is real, but not yet clean evidence that steady-state economics are already proven without
              help from accounting and mix changes.
