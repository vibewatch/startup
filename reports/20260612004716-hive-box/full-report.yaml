      - number: '7.3'
        title: Locker asset economics and partner dependencies can amplify each other
        blocks:
          - type: paragraph
            body: >-
              Hive Box’s network scale is also its core operating risk. The installed base is large enough to create
              meaningful switching barriers, but the same scale locks the company into rent, electricity, maintenance,
              and service obligations that are hard to shrink quickly without impairing density. Public commentary and
              adverse reporting suggest some communities have already removed or downsized low-usage cabinets, which
              matters because the model needs dense local coverage to keep parcel volume and consumer convenience high.
              Dependency risk is tightly linked to this asset problem. SF remains the anchor shareholder and ecosystem
              sponsor, other courier shareholders have long exited, couriers using the lockers are not Hive Box
              employees, and property managers still decide whether the boxes keep their site access. The revised
              consent regime therefore does not just create abstract regulatory exposure: it creates a practical
              coordination problem between Hive Box, couriers, and properties. If parcel flow shifts to alternative
              last-mile channels or if property renewals weaken, utilization can fall faster than fixed cost can be
              removed.
