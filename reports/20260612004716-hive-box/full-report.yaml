            - 'Low: no courier retention or share data'
            - 'Medium: user-consent rules and courier behavior can damage the experience'
        - label: Residents / consumers
          values:
            - High on cumulative reach and fee policy
            - 'Medium: pickup, self-ship, and returns are clear use cases'
            - 'Low: no active cohorts, only throughput proxies'
            - 'High: backlash, notification friction, and fee sensitivity are public'
        - label: Shanghai Metro
          values:
            - 'High: official city and People’s Daily coverage'
            - 'High: named stations, locations, and locker counts'
            - 'Low: no disclosed usage or renewal data'
            - 'Low-Medium: public-site economics not disclosed'
        - label: Shenzhen Metro
          values:
            - 'Medium-High: Shenzhen Daily plus secondary 2026 corroboration'
            - 'Medium: named station count and Hive Box mini-program usage'
            - 'Low: no contract or repeat-use metrics'
            - 'Low-Medium: strategic scope still needs primary corroboration'
        - label: Advertisers
          values:
            - 'Medium: aggregate count is in filing-era evidence'
            - 'Low: named customers absent'
            - 'Low: repeat-spend and concentration undisclosed'
            - 'Medium: ad breadth may not equal durable revenue quality'
        - label: Property hosts
          values:
            - 'Medium: named early partners plus official multi-property positioning'
            - 'Medium: deployment role is clear, commercial terms are not'
            - 'Low: renewal/removal metrics absent'
            - 'Medium: host-site churn could weaken density quickly'
