      - number: '1.4'
        title: Funding history, valuation evidence, and key stakeholders
        blocks:
          - type: paragraph
            body: >-
              Hive Box's financing path shows a company that scaled with heavyweight logistics and private-capital
              support but stayed private longer than early investors expected. Public reporting points to an initial RMB
              500 million formation round in 2015, another RMB 500 million follow-on in 2016, a RMB 2.5 billion raise in
              2017, a 2018 strategic financing round that pushed valuation to roughly RMB 9 billion, and a January 2021
              US$400 million strategic round that various outlets place at about US$3.3-3.4 billion post money. Two
              public valuation anchors matter most at run date. First, the August 2024 HKEX filing and filing-derived
              coverage still use that 2021 financing mark as the latest hard round benchmark. Second, Hurun-linked 2024
              secondary coverage says Hive Box ranked No. 270 on the 2024 Global Unicorn List at RMB 25 billion, which
              is directionally consistent with the company remaining a large private unicorn rather than a freshly
              repriced down-round story. The cap table is likewise controller-heavy: Wang Wei dominates, China
              Post-linked capital is meaningful, and Asia Forge remains material because of the later redemption
              dispute.
