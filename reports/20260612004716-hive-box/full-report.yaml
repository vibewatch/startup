  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the job Hive Box is actually serving
        blocks:
          - type: paragraph
            body: >-
              The starting point is to separate China's enormous parcel economy from the narrower out-of-home delivery
              problems Hive Box solves. China processed 174.5 billion parcels in 2024 and 198.95 billion express parcels
              in 2025, while online retail sales reached RMB 15.52 trillion in 2024. Those numbers make the parcel
              stream large enough to support many different fulfillment models, but Hive Box does not capture all
              express or e-commerce logistics spend. Its relevant market is the portion of delivery and sending activity
              where a shared end node can substitute for repeated door-to-door attempts, plus a layer of community
              attention that can be monetized through advertising and adjacent services.


              That boundary matters because public reports describe at least four different markets: broad China CEP,
              e-commerce logistics, last-mile delivery, and smart parcel lockers. The Hive Box prospectus uses an even
              more specific category, “last-mile logistics solutions,” that blends parcel handoff, sending, and related
              service infrastructure. The practical SAM is therefore not “all parcels in China.” It is the subset of
              parcel and return flows concentrated enough for shared lockers or stations to work, permitted by property
              managers and regulators, and accepted by residents. Everything broader is useful as macro context or a
              ceiling, not as a direct revenue pool.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM015
              - CM016
              - CM017
              - CM021
