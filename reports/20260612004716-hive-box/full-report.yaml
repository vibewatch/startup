      - number: '2.4'
        title: Growth drivers, labor constraints, and adoption barriers
        blocks:
          - type: paragraph
            body: >-
              The structural drivers are strong. National policy now explicitly encourages a more advanced, urban-rural
              express system, intelligent end-service facilities, and shared delivery infrastructure. Parcel volumes
              keep compounding, inland regions are taking a larger share of national throughput, tier-2 cities already
              account for a large slice of e-commerce logistics demand, and lower-tier expansion remains central to
              management's own IPO use-of-proceeds story. Labor pressure also favors out-of-home nodes: couriers report
              low per-piece pay and rising effort under consent-first door-delivery rules, while digital partnerships
              such as China Post-Cainiao show that automation and shared nodes can reduce manual labor cost and expand
              return/shipping access.


              But the barriers are just as important for underwriting. The same rules that support better service also
              prevent operators from forcing lockers into every workflow; consent, fee disclosure, and repeated free
              delivery attempts can all cap utilization and monetization. Resident backlash to Hive Box's 2020 late-fee
              policy shows that convenience does not erase price sensitivity. Academic evidence from Tianjin adds
              another barrier: even fast locker growth can overshoot the wrong places, leaving high demand within 300
              meters of home but much of supply farther away. Add capex, maintenance, site negotiation,
              interoperability, and utilization risk, and the right market view becomes one of selective density
              economics rather than automatic national-scale winner-take-all adoption.
            claimRefs:
              - CM004
              - CM006
