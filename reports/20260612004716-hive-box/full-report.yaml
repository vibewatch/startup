  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The RMB25 billion mark was real, but it is now stale and structurally encumbered
        blocks:
          - type: paragraph
            body: >-
              Hive Box is not a fake company-quality story. Public sources show a real private funding history, a real
              August 2024 Hong Kong filing attempt, and a real scale asset: more than 330,000 lockers, more than 209,000
              communities, and hundreds of millions of users. That is enough to explain why a RMB25 billion private mark
              existed and why Hive Box still belongs on an investor watchlist. It is also enough to justify unicorn
              status under Hurun’s methodology, which only requires a private company to be unlisted and worth at least
              US$1 billion.


              What the mark does not prove is current fair value in 2026. The listing lapsed in February 2025, the
              company reportedly did not complete supplemental disclosure, and a redemption-right dispute tied to the
              2021 financing adds economic overhang precisely where new-money investors most need clarity. The proposed
              roughly US$80 million extension payment shows this is not a cosmetic legal issue; it is a cash and
              waterfall issue. Public financial evidence is better than zero but still thin: losses exceeded RMB3.7
              billion over 2021-2023, while the encouraging January-May 2024 profit snapshot remains too short to treat
              as a durable new base year. The right read is therefore track, not dismiss: strategic scarcity exists, but
              the IPO-era mark is stale and encumbered until management refreshes the proof set.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
