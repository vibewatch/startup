  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and the courier-resident workflow
        blocks:
          - type: paragraph
            body: >-
              Hive Box’s product is best understood as a locker-network workflow system rather than as a bare cabinet
              OEM. The official global and Chinese sites consistently describe a combination of physical lockers, SaaS
              control software, mobile and web entry points, and partner-facing integration rails that connect couriers,
              residents, property managers, and logistics systems. In the default parcel flow, the courier
              authenticates, scans a waybill, assigns the recipient to a cell, and drops the parcel into the cabinet.
              The resident then receives an SMS or app notice and retrieves the item through a pickup code, QR flow, or
              increasingly a one-click remote-open path. That base path is now surrounded by adjacent user journeys:
              self-ship and reverse logistics, temporary storage, and community services such as laundry and home
              services. The strongest conclusion from the source pack is that Hive Box’s core product is not the locker
              alone, but the union of cabinet access, app-led identity, and a set of resident and courier workflows that
              keep the locker estate active throughout the day.
