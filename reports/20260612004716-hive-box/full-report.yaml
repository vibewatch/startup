      - number: '1.2'
        title: Network scale, service breadth, and disclosed operating profile
        blocks:
          - type: paragraph
            body: >-
              The August 2024 filing and filing-based coverage give a strong, reusable scale snapshot. As of 2024-05-31,
              Hive Box said it operated 330,200 smart lockers with about 29.9 million compartments, covering about
              209,000 communities across all 31 provincial-level regions in China. The same disclosure set says the
              network had cumulatively served about 367.8 million consumers and 3.5 million couriers and processed more
              than 21.2 billion parcels. Public reporting also shows the business is no longer just about courier
              drop-off fees. Consumer smart-delivery volumes, laundry, home-life services, and advertising have all
              become material narrative components. That matters because the company's improving 2024 profitability
              appears tied not only to network density, but also to a business-mix shift toward higher-growth consumer
              and value-added services.
