              The strongest customer evidence is still the 2024 filing window. Prospectus-derived and corroborating news
              sources agree that as of 2024-05-31 Hive Box operated 330,200 lockers with about 29.9 million compartments
              across about 209,000 communities in all 31 provincial-level regions of China. The same evidence pack
              supports the scale claim that Hive Box had cumulatively served about 367.8 million consumers and 3.5
