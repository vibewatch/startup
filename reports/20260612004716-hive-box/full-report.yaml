  - id: FM003
    title: Buyer / user / payer relationship map
    type: matrix
    layout: wide
    summary: >-
      Hive Box wins only when the operational user, economic payer, and siting gatekeeper all find the node attractive
      enough to participate.
    data:
      columns:
        - Operational user
        - Economic payer
        - Gatekeeper / approval logic
      rows:
        - label: Courier network
          values:
            - Courier and route team use the locker bank
            - Courier company pays through route economics or service fees
            - Approves where density lowers labor and failed attempts
        - label: Resident household
          values:
            - Resident retrieves or sends parcel
            - Usually pays zero unless overtime or premium service applies
            - Approves through consent, convenience, and complaint behavior
        - label: Property manager
          values:
            - Property staff handle access, complaints, and site coordination
            - Often not the direct payer
            - Approves based on amenity value, safety, and space trade-offs
        - label: Advertiser / community brand
          values:
            - Does not operate the locker day-to-day
            - Pays for community traffic and ad inventory
            - Approves only after the network proves footfall and attention density
        - label: Return merchant / platform
          values:
            - Uses the node for sending, return, or reverse-logistics workflow
            - Pays through fulfillment or reverse-logistics budget
            - Approves when returns friction and service cost fall enough to matter
    approximationNotes: The matrix compresses a multi-sided market into role relationships rather than a disclosed revenue-mix chart.
