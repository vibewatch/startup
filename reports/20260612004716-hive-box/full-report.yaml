  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Hive Box depends on external courier systems, app channels, payment rails, privacy/compliance obligations, and
      expanding automation vendors around the cabinet network.
    data:
      nodes:
        - id: lockers
          label: Locker hardware estate
          detail: Base cabinet network and specialized SKUs
        - id: apps
          label: Consumer and operator apps
          detail: App, mini-program, mobile web, and courier tools
        - id: couriers
          label: Courier / logistics partners
          detail: Route, e-waybill, online-order, and settlement counterparts
        - id: payments
          label: Payment rails
          detail: WeChat, Alipay, wallet, and delegated payment logic
        - id: regulation
          label: Privacy and consent regime
          detail: PIPL-era data rules plus locker-delivery consent requirements
        - id: automation
          label: Unmanned relay stack
          detail: UAVs, robots, unmanned vehicles, and cloud operating platform
        - id: user-trust
