chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and product model
        blocks:
          - type: paragraph
            body: >-
              Hive Box presents itself as a last-mile logistics and smart-device platform rather than a single-purpose
              locker manufacturer. Its English-language official materials describe a 24/7 self-service ecological
              network, a SaaS stack, open-platform APIs, and hardware modules meant to help couriers, merchants, and
              consumers complete dispatch, pickup, and return workflows. Independent 2024 IPO coverage is consistent on
              the company's identity and location: Hive Box, known in Chinese as 丰巢科技 or 丰巢控股, is a Shenzhen-based
              operator founded in 2015 to solve the time mismatch between daytime delivery routes and after-work pickup
              demand. The best-supported short description for later chapters is therefore a Shenzhen private company
              that uses smart parcel lockers and adjacent software/services to monetize out-of-home parcel delivery,
              consumer send/return flows, and community traffic.
