              penetration, but they should not be mistaken for active monthly or annual retained users. The better
              durability proxy is usage throughput. End-delivery parcel volume stayed enormous across 2021-2023, while
              consumer smart-delivery parcels rose from 114.3 million to 233.2 million over the same period. That second
