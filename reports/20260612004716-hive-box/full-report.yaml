      - number: '7.5'
        title: Execution, financing, and monitorable thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Execution risk sits on top of every other category because Hive Box is trying to defend network economics,
              answer regulators, manage litigation, and diversify revenue at the same time. The leadership transition
              reported during the stalled IPO period makes that coordination task harder. Diversification into laundry
              and other services may eventually improve the mix, but today it also consumes attention while the core
              locker model still depends on controversial fees and partner compliance. Financing risk is therefore real
              even though 2024 profit improved: if the listing cannot restart and the legal dispute does not settle, the
              company may need to protect liquidity while still maintaining a national locker footprint. The right
              underwriting stance is to watch specific triggers rather than debate the business in the abstract. If
              litigation remains unresolved, if CSRC/HKEX follow-up does not clear, if complaint pressure keeps forcing
              conduct changes, or if parcel-share support from key couriers weakens, the investment case breaks because
              Hive Box loses both capital-market optionality and operating leverage at once.
            claimRefs:
