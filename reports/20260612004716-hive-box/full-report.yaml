  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and host segmentation is broader than the locker brand alone
        blocks:
          - type: paragraph
            body: >-
              Hive Box’s customer map is broader than the visible act of picking up a parcel from a cabinet. Official
              Chinese-language materials explicitly frame the company as a platform linking logistics enterprises,
              property managers, couriers, and consumers, while the English case-studies surface separately marketed
              logistics, new-retail, and advertising solutions. That is important because it means the company has at
              least five economically relevant customer surfaces: courier companies and courier outlets that pay for
              last-mile deposit capability; residents who use pickup, self-ship, and return flows and can be charged
              overtime or membership fees; merchants and platforms whose reverse-logistics demand feeds consumer
              smart-delivery growth; advertisers buying locker-screen reach; and property or public-site hosts that
              grant physical access and density. The API and wallet materials reinforce that this is not a passive
              locker network. Hive Box exposes dispatch, sending, storage, routing, payment, and pickup interfaces,
              which is consistent with a multi-sided operating model rather than a single consumer app.
