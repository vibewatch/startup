        - Without a fresh base year the valuation case relies on stale or annualized figures
        - CFO, auditor, and listing-sponsor data room
      - - Cap table and waterfall
        - Full preference stack, side letters, and redemption mechanics
        - New-money outcomes depend on economics above common equity, not just the headline mark
        - Company counsel and lead investors
      - - Regulator correspondence
        - HKEX and CSRC comment letters plus management response pack
        - Exit timing and feasibility hinge on what regulators actually required
        - Sponsor, general counsel, and board materials
      - - Monetization mix
        - Revenue split across late fees, memberships, software, parcel handling, and partner economics
        - A higher multiple needs proof of revenue quality, not just installed-base scale
        - Finance analytics and product leads
      - - Locker utilization cohorts
        - Utilization, dwell time, rent renewal, maintenance cost, and cohort payback by city
        - Network density only deserves premium valuation if cohort economics compound
        - Operations and network-planning teams
      - - IPO restart plan
        - Concrete timetable, sponsor status, and fallback financing plan
        - The exit path determines whether investors should pay any liquidity premium at all
        - CEO, sponsor, and board
    notes: >-
      This is the minimum packet required to move from track to underwrite. Anything less leaves too much of the
      valuation case in implication rather than documentation.
    claimRefs:
      - CV007
      - CV010
      - CV037
      - CV038
      - CV045
      - CV051
      - CV052
