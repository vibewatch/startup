            body: >-
              Locker networks benefit from parcel growth and labor pressure, but regulation increasingly protects
              residents from default locker placement and undisclosed fees. That means a dense network can still
              under-monetize if operators cannot rely on passive consumer acceptance.
            calloutType: risk
