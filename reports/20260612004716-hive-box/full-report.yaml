      - number: '8.3'
        title: Only the bull case clearly clears the headline mark
        blocks:
          - type: paragraph
            body: >-
              Scenario work is a better tool here than pretending the last private mark self-validates. The bull case
              assumes Hive Box can turn the 2024 profitability snapshot into a durable full-year run rate, push revenue
              toward RMB6.0-RMB6.5 billion, and convince investors that the business deserves more than a mature
              logistics multiple because software take-rate, utilization, and ecosystem monetization are improving
              together. Under that setup, a 4.2x-5.0x sales multiple can support roughly RMB25-RMB32 billion. This is
              the only clearly evidence-linked route that validates the existing headline mark.


              The base case is lower and more plausible today: roughly RMB4.8-RMB5.3 billion of revenue with a 2.8x-3.5x
              multiple, or about RMB13-RMB19 billion. The bear case assumes the filing remains cold, monetization
              quality disappoints, and investors price Hive Box more like asset-heavy logistics infrastructure than
              premium software-enabled network effects; that points to roughly RMB6-RMB10 billion. The investment
              implication is straightforward. Hive Box can still become worth 25 billion or more, but current public
              evidence supports tracking the company or demanding a materially lower entry price, not underwriting the
              old mark as if the market had already reconfirmed it.
            claimRefs:
