  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity ranking and transmission overview
        blocks:
          - type: paragraph
            body: >-
              The risk stack for Hive Box is led by legal and regulatory exposure, not ordinary operating noise. The
              most severe issue is the unresolved Asia Forge Capital redemption-rights dispute because it has already
              stalled the Hong Kong listing, raises the possibility of repurchase or asset-preservation pressure, and
              interacts with broader CSRC and HKEX compliance scrutiny. Second is the operating-model problem: the
              company runs a very large physical locker network with meaningful fixed costs, while a visible slice of
              monetization comes from customer overtime fees that have generated sustained backlash and
              regulator-sensitive conduct questions. Third is partner concentration around SF-backed parcel flow,
              non-employee couriers, and property managers that control locker sites. Fourth is privacy and
              payment-control risk: Hive Box’s own policies show it handles identity, parcel, notification, and wallet
              data together, while public evidence emphasizes compliance surface more than proven control maturity.
              Fifth is execution and financing risk around leadership change, diversification bets, and the need to keep
              a heavy network funded if the listing window stays shut.
