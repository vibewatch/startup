      - number: '1.5'
        title: Milestones, adverse issues, and the stalled IPO path
        blocks:
          - type: paragraph
            body: >-
              Hive Box's chronology mixes impressive scale milestones with a growing set of execution and governance
              frictions. The company scaled from the 2015 founding to a 2017 60,000-locker footprint, bought e栈 in 2017,
              consolidated the sector by reorganizing with China Post's Sudiyi network in 2020, and entered 2024 able to
              claim both market leadership and first-period profitability. But the same history also shows monetization
              stress. Storage-fee disputes in 2020 revealed how hard it was to fund a capital-intensive locker network
              without customer backlash; 2024 regulatory scrutiny revisited the legality of fee practices; and the
              August 2024 IPO filing did not clear the path to listing. Instead, the prospectus lapsed in February 2025,
              and Yicai later reported that Asia Forge objected to amended redemption terms and sued in Hong Kong,
              turning a contractual liquidity right into a direct IPO blocker. By run date, Hive Box still looks
              strategically important and operationally scaled, but no longer like a clean near-term listing candidate.
