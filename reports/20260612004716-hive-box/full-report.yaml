            title: The market-size contradiction is mostly a scope problem
            body: >-
              A USD 1.08 billion China locker market and a USD 140.9 billion China CEP market can both be true because
              they are measuring different things. The underwriting mistake is to let a broad logistics number stand in
              for the narrow node economics that actually determine Hive Box adoption and monetization.
