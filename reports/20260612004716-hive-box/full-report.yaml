      - number: '7.4'
        title: Customer backlash, privacy surface, and payment handling raise trust risk
        blocks:
          - type: paragraph
            body: >-
              Customer and control risk are not separable for Hive Box because the same workflow connects locker
              placement, notifications, identity data, and payment collection. Adverse 2026 reporting shows that users
              still complain about forced locker placement, missed notices, night-time deposits, and charges that feel
              unavoidable for commuters who cannot collect within 18 hours. That matters more than simple bad PR because
              prospectus-linked reporting shows overdue-storage revenue is economically meaningful, so a trust problem
              can become a model problem. The company’s own privacy policy confirms broad collection of identity,
              address, biometric, and parcel-level data across its digital and physical touchpoints, and the wallet
              protocol adds real-name verification plus third-party payment flows. Reviewed evidence did not surface a
              disclosed major cyber incident, but that does not neutralize the risk; it shifts the emphasis toward
              compliance maturity, auditability, and incident readiness. In diligence terms, the question is whether
              Hive Box has control depth that matches the combined privacy, notification, and payment surface it has
              built.
            claimRefs:
