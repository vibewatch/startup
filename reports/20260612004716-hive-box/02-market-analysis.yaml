callouts:
- calloutType: insight
  title: The market-size contradiction is mostly a scope problem
  body: A USD 1.08 billion China locker market and a USD 140.9 billion China CEP market can both be true because they are measuring different things. The underwriting mistake is to let a broad logistics number stand in for the narrow node economics that actually determine Hive Box adoption and monetization.
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM045
- calloutType: risk
  title: Consent-first regulation limits forced utilization
  body: Locker networks benefit from parcel growth and labor pressure, but regulation increasingly protects residents from default locker placement and undisclosed fees. That means a dense network can still under-monetize if operators cannot rely on passive consumer acceptance.
  claimRefs:
  - CM006
  - CM008
  - CM009
  - CM011
  - CM012
  - CM046
- calloutType: assumption
  title: Lower-tier expansion grows parcel volume faster than locker certainty
  body: Management and third-party researchers both see lower-tier and inland parcel growth as real. The diligence assumption is that enough of that growth remains dense, property-accessible, and consent-compatible to support locker economics rather than only cheaper station or door-delivery models.
