  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: locker-unit-economics
    missingEvidence: City-tier locker utilization, site-level payback, and courier-fee economics by cohort.
    whyItMatters: Without site-level utilization and payback, SOM quality can be overstated even if national parcel demand is large.
    diligencePath: Request cohort data by city tier for occupancy, parcels per locker per day, churn, and payback period.
    relatedQuestionRefs:
    - QM026
  - type: private-evidence-only
    severity: material
    topic: property-manager-economics
    missingEvidence: Standard site contracts, revenue-share terms, electricity/maintenance burden, and complaint-resolution SLAs with property managers.
    whyItMatters: Property access is a gating variable for expansion and churn, but public sources do not reveal who pays or who captures site-side economics.
    diligencePath: Obtain sample property contracts and site-renewal metrics from top city clusters.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: reverse-logistics-volume
    missingEvidence: Actual Hive Box sending, return, and merchant reverse-logistics volumes and take rates.
    whyItMatters: Reverse logistics is a meaningful payer class in the narrative, but its contribution to SAM and margin mix is not public.
    diligencePath: Request historical outbound-send and return volumes, merchant counts, and realized take rates by product line.
    relatedQuestionRefs:
    - QM015
    - QM027
  - type: conflicting-data
    severity: minor
    topic: market-size-scope
    missingEvidence: A reconciled bridge between locker-only, last-mile, CEP, and e-commerce-logistics market definitions.
    whyItMatters: Investors can misread broad logistics ceilings as locker TAM unless the category bridge is explicit.
    diligencePath: Ask management and bankers for the exact industry-study definitions behind each market chart and their revenue inclusions.
    relatedQuestionRefs:
    - QM008
    - QM026
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: regional-site-density
    missingEvidence: A provincial or city-tier map of Hive Box site density, parcel throughput, and property access quality.
    whyItMatters: The inland-growth story is persuasive, but public data do not show where density is sufficient for locker economics versus station-only coverage.
    diligencePath: Request a heat map of sites, parcels per site, and renewal/churn by city tier before underwriting lower-tier expansion.
    relatedQuestionRefs:
    - QM024
    - QM026
