- id: tam-sam-som-sizing-lenses
  title: TAM, SAM, SOM, and why public estimates look contradictory
  body: 'Public sizing looks contradictory because the underlying denominators are different. At the broadest end, third-party researchers size China''s CEP market at USD 140.9 billion in 2026 and China''s e-commerce logistics market at USD 235.89 billion in 2026. Those views include long-haul line haul, warehousing, transportation, same-day services, and many value-added logistics activities that Hive Box does not own. IMARC''s USD 29.13 billion 2025 last-mile delivery estimate is narrower, but it still spans human couriers, bikes, vans, drones, and many forms of final delivery that do not rely on shared lockers.


    The most relevant top-down lens is the prospectus category of China “last-mile logistics solutions,” which the company says was about RMB 46.7 billion of revenue in 2023 and could reach RMB 78.8 billion by 2028. Even that is broader than locker banks alone because it includes end-shipping and other node-based solutions. Mobility Foresights'' China smart parcel locker estimate of USD 1.08 billion in 2025 is the narrowest directly relevant public market number. The right analytical conclusion is not that one source is “right” and the others are “wrong.” It is that locker-only TAM, broader node-based last-mile SAM, and national parcel/CEP context should be kept in separate layers. Hive Box''s current SOM is best expressed qualitatively: it has national density and the largest network, but its exact locker-only revenue share is not publicly isolated even though the prospectus shows only 6.1% share in the broader last-mile-solutions category.'
