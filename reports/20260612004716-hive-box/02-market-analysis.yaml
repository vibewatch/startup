company:
  name: Hive Box
chapter:
  number: 2
  title: Market Analysis
  summary: Hive Box operates inside one of the world's largest parcel ecosystems, but the relevant market is narrower than China's full express or e-commerce-logistics spend. The investable lens runs from a huge parcel-demand base and supportive policy backdrop down to out-of-home last-mile delivery, consumer sending/return flows, and community-traffic monetization that can clear resident-consent, property-access, and utilization hurdles. Public market-size estimates range from about USD 1.08 billion for China smart parcel lockers to more than USD 140 billion for China CEP because publishers are measuring very different scopes, so TAM/SAM/SOM discipline matters more than any single headline figure.
sections:
- id: market-boundary-and-job-to-be-done
  title: Market boundary and the job Hive Box is actually serving
  body: 'The starting point is to separate China''s enormous parcel economy from the narrower out-of-home delivery problems Hive Box solves. China processed 174.5 billion parcels in 2024 and 198.95 billion express parcels in 2025, while online retail sales reached RMB 15.52 trillion in 2024. Those numbers make the parcel stream large enough to support many different fulfillment models, but Hive Box does not capture all express or e-commerce logistics spend. Its relevant market is the portion of delivery and sending activity where a shared end node can substitute for repeated door-to-door attempts, plus a layer of community attention that can be monetized through advertising and adjacent services.


    That boundary matters because public reports describe at least four different markets: broad China CEP, e-commerce logistics, last-mile delivery, and smart parcel lockers. The Hive Box prospectus uses an even more specific category, “last-mile logistics solutions,” that blends parcel handoff, sending, and related service infrastructure. The practical SAM is therefore not “all parcels in China.” It is the subset of parcel and return flows concentrated enough for shared lockers or stations to work, permitted by property managers and regulators, and accepted by residents. Everything broader is useful as macro context or a ceiling, not as a direct revenue pool.'
  claimRefs:
