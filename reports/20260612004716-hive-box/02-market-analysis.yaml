- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Courier company / frontline courier
    - Courier network operations manager or route team
    - Courier and locker operator
    - Courier company; sometimes embedded in service fee structure
    - Bulk neighborhood drop-off into a shared node instead of repeated doorstep attempts
    - Last-mile operations budget
    - Route density, lower redelivery, and faster stop productivity
  - - Resident / parcel recipient
    - Usually not the formal buyer
    - Resident or household member
    - Usually not direct payer unless overtime or premium storage fees apply
    - Receive SMS or code, retrieve parcel on own schedule, sometimes use send/return flow
    - Household convenience tolerance; occasional fee outlay
    - 24/7 pickup, privacy, contactless access, and proximity within a short walk
  - - Property manager / community operator
    - Residential compound or building manager
    - Property staff as site gatekeeper, residents as service beneficiaries
    - 'Often indirect: site access rather than direct fee payment'
    - Approve placement, power, access control, and complaint handling inside the compound
    - Property amenity / operations management
    - Reduced lobby congestion, safer parcel handling, and resident-service optics
  - - Advertiser / community brand
    - Brand or ad buyer
    - Hive Box media/marketing team delivers the inventory; residents are audience
    - Advertiser
    - Buy community campaigns tied to locker traffic and neighborhood attention
    - Trade marketing / community ad budget
    - Dense daily footfall in residential compounds
  - - E-commerce merchant / return merchant
    - Merchant or platform logistics manager
    - Residents, couriers, node operator
    - Merchant, platform, or return-logistics budget
    - Use sending boxes, return flows, or value-added reverse logistics linked to shared nodes
    - Fulfillment and reverse-logistics budget
    - Lower return friction, better customer experience, and fewer failed handoffs
  notes: 'Buyer, user, and payer split because Hive Box is multi-sided: couriers use the node, residents accept or reject the workflow, property managers gate siting, and advertisers or merchants can monetize the traffic.'
