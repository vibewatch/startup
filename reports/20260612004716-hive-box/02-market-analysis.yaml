tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Hive Box
  rows:
  - - China CEP / express backbone
    - National express parcel handling, line-haul, sorting, transport, and final delivery tied to 198.95B 2025 express parcels
    - Non-parcel local errands and unrelated freight
    - E-commerce platforms, merchants, courier networks; end consumer demand is the volume engine
    - Macro demand base only; far broader than Hive Box revenue capture
  - - China last-mile delivery
    - Final-mile parcel movement from local node to recipient, including courier labor, bikes/vans, drones, and neighborhood delivery systems
    - Long-haul transport, most warehousing, broader supply-chain software
    - Courier companies and merchants pay; residents receive service
    - Useful outer TAM lens but still broader than lockers
  - - China last-mile logistics solutions / out-of-home nodes
    - Locker-based pickup, shared stations, consumer sending points, and node-based parcel handoff economics
    - Pure door-to-door delivery with no shared node
    - Couriers, merchants, and node operators; residents use, property managers enable
    - Best public SAM proxy for Hive Box core operations
  - - Community marketing through locker traffic
    - Residential attention inventory, locker-screen or touchpoint-based ad services, community campaigns
    - General internet advertising and mass media not tied to community nodes
    - Advertisers and brands pay; residents are audience; operator monetizes traffic
    - Important secondary payer pool once node density is established
  - - Consumer send / return and reverse logistics
    - Self-service sending boxes, merchant return flows, and value-added reverse logistics attached to pickup/drop-off networks
    - Heavy B2B freight and unrelated fulfillment outsourcing
    - E-commerce merchants, platforms, and parcel senders pay; residents and couriers use
    - Adjacency that expands wallet share beyond inbound parcel drop-offs
  notes: Rows intentionally separate parcel-demand context from the narrower out-of-home node market that Hive Box can monetize directly.
