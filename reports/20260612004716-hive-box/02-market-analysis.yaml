- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Parcel volume and online retail growth
    - Driver
    - Current / structural
    - A larger parcel base raises the number of neighborhoods where shared nodes can be economic
    - What share of national parcel growth is still compatible with out-of-home delivery rather than instant or door-only models?
  - - Lower-tier and inland demand expansion
    - Driver with execution risk
    - Current to medium term
    - Tier-2 and inland growth expands Hive Box's reachable parcel base, but density may be weaker than in coastal compounds
    - What city-tier thresholds still generate acceptable locker utilization and payback?
  - - Policy support for intelligent end facilities and shared infrastructure
    - Driver
    - Current
    - National policy explicitly encourages smarter, greener, more shared end-node infrastructure
    - Which local governments actively subsidize, fast-track, or constrain locker deployment?
  - - Courier labor intensity and low piece rates
    - Driver
    - Current
    - Shared drop points remain attractive when doorstep delivery raises labor burden but pay per parcel stays thin
    - How much route time or labor cost does one dense locker bank actually save by city tier?
  - - Consent-first and fee-disclosure regulation
    - Constraint
    - Current
    - Operators cannot assume lockers are the default; fee monetization and forced utilization are regulated
    - What percentage of deliveries still require direct consent or repeat attempts, and how does that hit utilization?
  - - Siting mismatch inside residential communities
    - Constraint
    - Current
    - Wrong placement can waste capital and provoke resident complaints even when city-level parcel demand is strong
    - What share of Hive Box sites are within a 5-minute walk of the target households?
  - - Capex, maintenance, interoperability, and utilization risk
    - Constraint
    - Current to structural
    - Network density is valuable but expensive; fragmented APIs and underused locations can dilute returns
    - What is payback by site cohort and what percent of sites are below utilization threshold?
  - - Fee sensitivity and service backlash
    - Constraint
    - Current
    - Residents may like convenience but reject forced locker use or fees if consent and retrieval windows feel unfair
    - How often do complaints, opt-outs, or community restrictions follow price changes?
  notes: This table distinguishes macro growth from economically usable growth; several “drivers” enlarge parcel throughput without necessarily raising locker SOM unless density, consent, and site economics hold.
