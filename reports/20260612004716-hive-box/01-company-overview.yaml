  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: succession-plan
    missingEvidence: A board-approved succession plan, current reporting lines, and any finalized replacement for Xu Yubin.
    whyItMatters: Leadership continuity matters because the founder remains central to operations, narrative, and investor confidence.
    diligencePath: Request current org chart, board minutes on succession, and management bios for any incoming CEO or executive chair arrangement.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: governance-visibility
    missingEvidence: A complete current board roster, committee memberships, and governance-rights summary for controller and major investors.
    whyItMatters: Without a current governance map, investors cannot fully assess oversight quality, minority protections, or IPO readiness.
    diligencePath: Obtain the latest board list, committee charters, shareholder agreement summary, and any post-2024 governance changes from company counsel.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: current-valuation
    missingEvidence: Any post-2024 primary financing, secondary trade, internal mark, or banker range that updates the 2021 financing benchmark and 2024 Hurun marker.
    whyItMatters: Valuation is a core diligence variable, and current public signals are indicative rather than transaction-clearing.
    diligencePath: Request the latest cap table, 409A or internal fair-value materials, recent tender or secondary data, and any banker book from the IPO process.
    relatedQuestionRefs:
    - QO026
  - type: access-blocked
    severity: material
    topic: asia-forge-docket
    missingEvidence: A public Hong Kong court docket, pleadings, or settlement documents that confirm the lawsuit scope and current status.
    whyItMatters: The lawsuit is central to IPO timing, potential cash liability, and shareholding stability, but reporting remains second-hand.
    diligencePath: Have Hong Kong counsel pull docket materials directly from court records and reconcile them against the amended 2024 investment documents.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
