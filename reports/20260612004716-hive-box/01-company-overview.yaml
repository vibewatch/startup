company:
  name: Hive Box
chapter:
  number: 1
  title: Company Overview
  summary: Hive Box (丰巢科技) is a Shenzhen-founded private last-mile logistics platform that built the world's largest smart parcel locker network, then broadened into consumer smart-delivery, laundry, home-life and advertising services. Public evidence anchors the company in a 2015 founding under SF-backed leadership, an August 2024 HKEX filing with 330,200 lockers across about 209,000 communities, and a 2021 financing benchmark around US$3.3-3.4 billion plus a 2024 Hurun unicorn mark of RMB 25 billion. The main underwriting overhangs are thin public governance disclosure, an unresolved Asia Forge redemption dispute, fee-compliance scrutiny, and an IPO that lapsed in February 2025 without a refiling by run date.
sections:
- id: identity-and-product-model
  title: Identity, headquarters, and product model
  body: 'Hive Box presents itself as a last-mile logistics and smart-device platform rather than a single-purpose locker manufacturer. Its English-language official materials describe a 24/7 self-service ecological network, a SaaS stack, open-platform APIs, and hardware modules meant to help couriers, merchants, and consumers complete dispatch, pickup, and return workflows. Independent 2024 IPO coverage is consistent on the company''s identity and location: Hive Box, known in Chinese as 丰巢科技 or 丰巢控股, is a Shenzhen-based operator founded in 2015 to solve the time mismatch between daytime delivery routes and after-work pickup demand. The best-supported short description for later chapters is therefore a Shenzhen private company that uses smart parcel lockers and adjacent software/services to monetize out-of-home parcel delivery, consumer send/return flows, and community traffic.'
  claimRefs:
  - CO001
  - CO002
  - CO005
  - CO006
  - CO007
  - CO008
  figureRefs:
  - FO002
- id: scale-and-operating-profile
  title: Network scale, service breadth, and disclosed operating profile
  body: The August 2024 filing and filing-based coverage give a strong, reusable scale snapshot. As of 2024-05-31, Hive Box said it operated 330,200 smart lockers with about 29.9 million compartments, covering about 209,000 communities across all 31 provincial-level regions in China. The same disclosure set says the network had cumulatively served about 367.8 million consumers and 3.5 million couriers and processed more than 21.2 billion parcels. Public reporting also shows the business is no longer just about courier drop-off fees. Consumer smart-delivery volumes, laundry, home-life services, and advertising have all become material narrative components. That matters because the company's improving 2024 profitability appears tied not only to network density, but also to a business-mix shift toward higher-growth consumer and value-added services.
  claimRefs:
  - CO009
