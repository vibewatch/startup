  title: Asia Forge turned a financing term into an IPO blocker
  body: The most important adverse signal is not just that the filing lapsed, but that an investor redemption right reportedly escalated into Hong Kong litigation. That creates uncertainty around shareholding stability, potential cash obligations, and the timing of any revived listing.
