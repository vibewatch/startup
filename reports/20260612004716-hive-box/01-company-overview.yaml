- id: leadership-governance-and-control
  title: Founder record, leadership bench, and control structure
  body: 'The founder story is unusually central to Hive Box''s public narrative. Multiple outlets describe Xu Yubin (徐育斌) as the entrepreneur who took a courier-and-operations background inside SF, identified the “last mile” mismatch problem, and built Hive Box with Wang Wei''s backing. By prospectus time, Xu served as chairman and CEO, while Wang Wei remained the ultimate control anchor: public filings and later reporting place Wang''s direct economic stake at about 36.54% and his voting control at roughly 48.45% through concert-party arrangements. Public visibility beyond that core is thinner than investors would ideally want. Accessible materials surface CFO Zhou Xiangdong, CMO Li Wenqing, and a handful of holding entities, but not a full contemporary board, committee map, or succession package. That makes Hive Box look operationally founder-led and controller-influenced even after years of institutional financing.'
  claimRefs:
  - CO003
  - CO004
  - CO028
