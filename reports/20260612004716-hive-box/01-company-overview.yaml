- calloutType: strength
  title: Scale and density are real, not aspirational
  body: 'The 2024 filing window gives Hive Box one of the clearest operating snapshots among private logistics platforms in China: 330,200 lockers, 29.9 million compartments, 209,000 communities, and cumulative service to hundreds of millions of consumers. That density makes the network strategically valuable even before one debates valuation.'
  claimRefs:
