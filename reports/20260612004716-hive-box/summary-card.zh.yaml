  topStrengths:
    - 规模领先是实打实的：公司在约 209,000 个社区铺设 330,200 组柜，累计服务 367.8 million 名消费者。
    - 收入结构正在从快递员投件费向外拓宽，2024 年 1-5 月首次披露盈利期，毛利率也更强。
    - 产品栈从柜机延伸到 SaaS、API、退货、寄存、广告和社区服务工作流，支撑多条变现路径。
  topRisks:
