tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Courier companies and couriers
    - 'Buyer/payer: courier company, outlet, or courier-linked wallet. User: courier.'
    - End-delivery deposit, dispatch, routing, pickup-code handoff.
    - 3.5M cumulative couriers served; 2021-2023 end-delivery parcels 6.204B / 5.823B / 6.463B.
    - Core legacy workflow and still the anchor network traffic source.
    - No public parcel-share or revenue-share concentration by top courier.
  - - Residents / consumers
    - 'Buyer/payer: resident when using self-ship, returns, overtime storage, or membership. User: pickup recipient and sender.'
    - Parcel pickup, self-ship, returns, temporary storage.
    - 367.8M cumulative consumers served; consumer smart-delivery parcels 114.3M / 141.7M / 233.2M in 2021-2023.
    - Fastest-visible usage growth and the source of overtime-fee and membership monetization.
    - No active-user, cohort-repeat, or refund-resolution disclosure.
  - - Merchants / e-commerce platforms
    - 'Buyer/payer: merchant or platform indirectly; user: consumer and courier.'
    - Reverse logistics, e-commerce returns, self-ship workflow.
    - 5M24 consumer smart-delivery revenue +107.3% YoY, tied to e-commerce reverse parcels.
    - Best public expansion driver beyond basic locker deposit fees.
    - Named merchant customers and contract economics are not public.
  - - Advertisers / brands
    - 'Buyer/payer: advertisers. User touched: residents passing locker screens.'
    - Terminal advertising and campaign delivery on locker screens / app surfaces.
    - 35 industries and 6,000 advertisers by 2024-05-31.
    - Value-added diversification using installed-screen inventory.
    - No named advertisers, repeat-booking data, or ad-yield disclosure.
  - - Property / community / public-site hosts
    - 'Buyer/host: property manager, community operator, or metro/public-site partner. User touched: residents, commuters, couriers.'
    - Host lockers, enable density, and extend into public luggage-storage use cases.
    - About 209K communities plus named Shanghai and Shenzhen metro deployments.
    - Site access is part of the moat because density and convenience depend on it.
    - No renewal, removal, or host-revenue-share disclosure.
  notes: Rows distinguish payer, user, and host roles because Hive Box is a multi-sided network. Public evidence is strongest on broad segment existence and weakest on named merchant and advertiser references.
