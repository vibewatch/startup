- id: concentration-and-dependency
  title: Courier concentration, SF influence, and site access are the main customer-risk dependencies
  body: The chapter’s central customer-risk conclusion is that Hive Box’s user breadth does not remove dependence on a relatively narrow set of operating relationships. Courier companies remain the foundational payer workflow, and public sources still frame end-delivery as the core business even as its revenue mix share has declined. That would be manageable if courier dependence were diffuse and transparently measured, but public concentration disclosure is thin. Yicai Global says the three other founding couriers divested in 2018 while SF founder Wang Wei remained the controlling anchor, which increases ecosystem concentration around SF even if the platform remains officially open to all couriers. Property and public-site hosts are the second dependency because they control physical access and local density. Finally, regulation now makes customer consent part of the operating chain, so courier behavior, notification settings, and property acceptance all affect customer value simultaneously.
    The result is a broad network with real adoption, but still one whose durability can be undermined by a small number of courier, host-site, or fee-policy chokepoints.
  claimRefs:
