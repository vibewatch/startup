- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Reverse logistics / self-ship growth
    - Named merchant customers are not public, so volume quality is hard to underwrite.
    - The fastest-growing usage surface could prove less durable than headline growth suggests.
    - Request top merchant/platform accounts, repeat rates, and revenue by reverse-logistics customer.
  - - Advertiser breadth
    - 6,000 advertisers are disclosed in aggregate, but repeat spend and top-account concentration are undisclosed.
    - Ad revenue may be broad but low quality, episodic, or concentrated.
    - Request advertiser cohort retention, top-20 account share, and average revenue per screen.
  - - Courier deposit workflow
    - Core traffic still depends on mainstream courier parcel flow.
    - If top couriers reroute volume, locker utilization and monetization can fall quickly.
    - Request parcel share and revenue share by top courier customer, including SF-linked volume.
  - - SF ecosystem influence
    - Wang Wei remains the control anchor while other founding couriers have exited.
    - Strategic decisions and volume support may be more exposed to SF’s priorities than the “open platform” story suggests.
    - Request board-level related-party, routing, and commercial exposure to SF and affiliated entities.
  - - Property and public-site access
    - Hosts control physical density, renewals, and placement quality.
    - Weak renewals or removals would degrade convenience and reduce usage faster than fixed costs can be removed.
    - Request site renewal, removal, and payback data by city and host type.
  - - Fee and notice UX
    - Consent rules, overtime fees, and notification failures create switching pressure to alternatives such as Cainiao stations or JD pickup points.
    - Customer backlash can become a traffic and brand problem, not just a PR irritant.
    - Request complaint trendlines, refund rates, and experiment results on night-delivery / notification controls.
  notes: The table pairs expansion motions with the concentration or dependency risk that could limit their durability. Most of the missing evidence is internal commercial data rather than public marketing proof.
