    whyItMatters: Cumulative served counts and parcel volumes prove scale, but they do not show whether consumers, couriers, or advertisers remain sticky after fees, complaints, and competition.
    diligencePath: Request monthly active pickup users, repeat self-ship cohorts, courier depositing retention, and any advertiser renewal dashboards.
