figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Hive Box’s journey starts with courier or host-site deployment and then branches into resident pickup, returns, advertising exposure, and host-site expansion loops.
  data:
    items:
    - id: host-contract
      label: Host-site placement
      actor: Property manager / metro operator / public-site host
      description: A host grants physical placement, density, and local permission for lockers or storage cabinets.
      channels:
      - Property deals
      - Metro / public-site agreements
      - Community operations
    - id: courier-deposit
      label: Courier deposit
      actor: Courier or courier outlet
      description: Courier deposits a parcel through Hive Box’s delivery, dispatch, routing, and wallet-linked workflow.
      channels:
      - Locker UI
      - Courier wallet
      - Routing / dispatch APIs
    - id: resident-pickup
      label: Resident pickup
      actor: Recipient / resident / commuter
      description: Consumer receives a notice, picks up the parcel, or incurs overtime-storage friction if timing and notice settings fail.
      channels:
      - SMS
      - WeChat / mini-program
      - Locker QR code
    - id: self-ship
      label: Self-ship / returns
      actor: Consumer + merchant workflow
      description: Consumer uses Hive Box for returns or self-ship, turning the locker from a passive pickup node into an active send node.
      channels:
      - Consumer smart-delivery flow
      - Return labels
      - Merchant reverse logistics
    - id: media-loop
      label: Advertising / value-added loop
      actor: Advertiser / service partner
      description: Screen traffic and community attention become monetizable through advertising, laundry, and home-service add-ons.
      channels:
      - Locker screens
      - Community promotions
      - Value-added service apps
    - id: expand-or-churn
      label: Expand / renew / complain
      actor: All segments
      description: Good density and convenience reinforce site expansion, while fees, complaints, or poor notice settings can weaken repeat usage or site renewal.
      channels:
      - Complaints
      - Renewal decisions
      - Courier / host feedback
  claimRefs:
  - CU001
  - CU003
  - CU005
  - CU024
  - CU027
  - CU031
  - CU032
  - CU034
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: The public evidence is strongest on network installation, courier deposit scale, and cumulative reach; it becomes materially weaker at active-retention and concentration layers.
  data:
    nodes:
    - id: sites
      label: Site installation
      description: Lockers are placed in communities, property sites, and metro/public locations where density can be monetized.
    - id: couriers
      label: Courier deposit usage
      description: Couriers use the locker network for last-mile delivery and related dispatch or wallet workflows.
    - id: consumers
      label: Consumer pickup / send
      description: Consumers pick up parcels, self-ship, and use reverse-logistics services.
    - id: adjacent
      label: Adjacent monetization
      description: Advertisers and consumer-service partners monetize screen traffic and community attention.
    - id: retention
      label: Retention / renewal proof
      description: Public evidence gets thinner here because NRR, GRR, churn, renewals, and top-account concentration are not disclosed.
    edges:
    - from: sites
      to: couriers
      label: physical access enables deposit flow
    - from: couriers
      to: consumers
      label: 24/7 pickup and send / return tasks
    - from: consumers
      to: adjacent
      label: traffic creates ad / service inventory
    - from: adjacent
      to: retention
      label: repeat spend or repeat use should show durability
    - from: consumers
      to: retention
      label: cohorts and complaints would prove stickiness
  claimRefs:
  - CU008
  - CU009
  - CU011
  - CU012
  - CU016
  - CU035
  - CU039
  - CU042
