- id: TU006
  title: Customer proof vs backlash table
  columns:
  - Supportive proof
  - Adverse counterpoint
  - What it means
  - Confidence
  - Diligence ask
  rows:
  - - 367.8M consumers and 3.5M couriers served by 2024-05-31
    - Counts are cumulative, not active or retained users.
    - Scale is real, but habit strength still has to be inferred from throughput and repeat tasks.
    - High on scale; medium on durability
    - Provide MAU/WAU, repeat-use, and active-account definitions.
  - - 209K communities and named metro deployments
    - No public renewal or removal rates by site host.
    - Footprint breadth is strong, but site durability is not directly visible.
    - Medium
    - Provide property/metro renewal history and locker removal reasons.
  - - 35 industries and 6,000 advertisers
    - No named advertisers or repeat-spend disclosure surfaced.
    - Ad customer breadth looks real but reference quality is weak.
    - Medium
    - Provide named references, revenue mix, and repeat-booking cohorts.
  - - Reverse-logistics growth lifted consumer smart-delivery revenue by 107.3% YoY in 5M24
    - Named merchants or platforms behind that growth were not publicly disclosed.
    - The growth engine appears real but customer quality remains under-specified.
    - Medium
    - Provide top merchants/platforms and reverse-logistics margin by account.
  - - 2020 backlash led to an 18-hour free window and consent commitments
    - 2026 complaint reporting still cites unauthorized locker use, night deposit, and forced fees.
    - The product can improve policies without fully removing user-friction risk.
    - High on 2020 reset; low-medium on 2026 complaint scale
    - Provide post-2024 complaint trendlines, refund rates, and courier retraining outcomes.
  notes: This table intentionally contrasts positive adoption proof with the specific public facts that still weaken underwriting confidence. It is a synthesis table rather than a company-disclosed dashboard.
