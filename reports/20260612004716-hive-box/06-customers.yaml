schemaVersion: report-v2
artifact: customers
slug: hive-box
runDate: '2026-06-12'
company:
  name: Hive Box
chapter:
  number: 6
  title: Customers
  summary: 'Hive Box has real customer-surface breadth: courier companies and couriers remain the core monetized workflow, but the platform also serves hundreds of millions of residents, fast-growing return and self-ship users, thousands of advertisers, and property or public-site hosts. Adoption proof is strongest in the 2024 filing window, which supports the 367.8 million consumer and 3.5 million courier scale claim as cumulative reach rather than active retention. The durability question is less flattering: named customer proof is concentrated in public-site/property examples, while retention, concentration, and complaint-resolution data remain largely undisclosed and fee backlash still shapes customer risk.'
sections:
- id: segment-architecture
  title: Buyer, user, and host segmentation is broader than the locker brand alone
  body: 'Hive Box’s customer map is broader than the visible act of picking up a parcel from a cabinet. Official Chinese-language materials explicitly frame the company as a platform linking logistics enterprises, property managers, couriers, and consumers, while the English case-studies surface separately marketed logistics, new-retail, and advertising solutions. That is important because it means the company has at least five economically relevant customer surfaces: courier companies and courier outlets that pay for last-mile deposit capability; residents who use pickup, self-ship, and return flows and can be charged overtime or membership fees; merchants and platforms whose reverse-logistics demand feeds consumer smart-delivery growth; advertisers buying locker-screen reach; and property or public-site hosts that grant physical access and density. The API and wallet materials reinforce that this is not a passive locker network. Hive Box exposes dispatch, sending, storage, routing, payment,
    and pickup interfaces, which is consistent with a multi-sided operating model rather than a single consumer app.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU034
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-and-usage-proof
  title: Adoption proof is real, but the headline scale numbers describe cumulative reach
  body: The strongest customer evidence is still the 2024 filing window. Prospectus-derived and corroborating news sources agree that as of 2024-05-31 Hive Box operated 330,200 lockers with about 29.9 million compartments across about 209,000 communities in all 31 provincial-level regions of China. The same evidence pack supports the scale claim that Hive Box had cumulatively served about 367.8 million consumers and 3.5 million couriers by that date. Those figures are meaningful because they imply exceptional network penetration, but they should not be mistaken for active monthly or annual retained users. The better durability proxy is usage throughput. End-delivery parcel volume stayed enormous across 2021-2023, while consumer smart-delivery parcels rose from 114.3 million to 233.2 million over the same period. That second curve matters most for this chapter because public coverage ties it to reverse logistics and self-ship, which is the clearest sign that users are doing more than tolerating
    one-way courier deposits.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU036
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof
  title: Named customer proof is strongest in property and public-infrastructure deployments, not in merchants or advertisers
  body: 'Named production proof exists, but it is unevenly distributed across segments. The most concrete examples are public-infrastructure deployments. Shanghai Metro officially showed Hive Box luggage lockers in stations, then expanded the service after trial operation to 31 locations in 12 stations with 736 lockers. Shenzhen Daily/EYESHENZHEN separately documented luggage lockers at 25 Shenzhen Metro stations that could be reserved through the Hive Box mini-program. Historical property proof exists too: Baidu Baike names Vanke Property, AVIC Property, and China Overseas Property as early partners, and that is directionally consistent with Hive Box’s official claim that it already serves multi-property scenarios. What is missing is equally important. The retained evidence set does not provide similarly strong named merchant-return customers or named advertisers, even though aggregate breadth on both surfaces is real. So customer proof is not fake, but it skews toward host sites and public
    facilities instead of revenue-bearing logos with public outcomes and renewal visibility.'
  claimRefs:
  - CU016
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU041
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: durability-and-fee-sensitivity
  title: Durability proxies are positive, but retention visibility is weak and fee sensitivity remains real
  body: 'Hive Box has meaningful durability proxies, but not the clean retention metrics investors would normally want. The positive side is straightforward: courier-delivery parcel volumes remain very large, consumer smart-delivery parcels have grown quickly, and adjacent services such as laundry, home services, and advertising all show real usage. Prospectus-derived evidence says the company had served 35 industries and 6,000 advertisers by 2024-05-31, while adjacent-service order counts also rose materially. The negative side is that none of this discloses NRR, GRR, churn, site renewal, advertiser repeat spend, or active-user cohorts. Public sources instead highlight fee sensitivity. China Daily documented the 2020 backlash that forced Hive Box to move from 12 to 18 free hours and emphasize courier consent, while a March 2026 complaint report still described night deposits, missing notices, and disproportionate storage fees on low-value parcels. That does not disprove product utility,
    but it does mean customer durability is still being inferred from traffic and breadth rather than verified by retention disclosure.'
