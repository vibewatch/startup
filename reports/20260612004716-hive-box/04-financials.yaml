- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current debt, guarantees, and project-finance obligations
    - Without this, net liquidity and downside cases cannot be modeled
    - Request latest audited debt schedule, lease commitments, guarantees, and any supplier-credit or project-finance documents
  - - Realized courier fee per parcel and rebate structure
    - List-level pricing proxies do not reveal actual monetization or pricing power by courier
    - Request contract terms, discount ladders, and realized revenue per parcel by courier customer
  - - Segment gross margins
    - The company disclosed an overall margin inflection, but not whether last-mile, returns, or value-added services each earn their cost of capital
    - Request gross margin by segment and a bridge showing the impact of depreciation-life changes
  - - CAC, payback, retention, and repeat-use behavior
    - Growth does not prove efficient acquisition or durable customer economics
    - Request channel-level CAC, payback, cohort retention, and repeat-use behavior for reverse logistics and self-ship flows
  - - Status and economics of the Asia Forge dispute
    - The redemption-right litigation could alter cash needs, listing timing, and shareholder structure
    - Request court filings, settlement status, side letters, and management’s downside scenario analysis
  - - Live underwriting support and valuation feedback
    - Because the filing lapsed before a normal public IPO process completed, external demand signals are thin
    - Request current sponsor/bookrunner roster, exchange comment status, soft-circled demand, and valuation feedback from recent relaunch work
  notes: These gaps are the main reasons the chapter stops short of a fully underwritable financial view despite the visible revenue growth and early-2024 profitability turn.
