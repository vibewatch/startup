- id: SI003
  title: Asset intensity, utilization, and working-capital pressure
  body: 'Hive Box still looks like a heavy-asset network business rather than a software-like platform. By May 2024 it had deployed 330,200 lockers and 29.9M compartments across about 209,000 communities, serving 367.8M consumers and 3.5M couriers. That footprint creates meaningful density and a defendable last-mile position, but it also creates large fixed obligations around hardware, site rent, electricity, maintenance, and service operations. Secondary industry analysis puts locker hardware cost at roughly RMB 50K-80K per unit, with some cabinets above RMB 100K, and suggests property rent can consume 40%-50% of total cost. Even where those proxy figures are not prospectus-grade, they are directionally consistent with the company’s long loss history and with the need to keep locker turnover high. Overstay charges, returns growth, and adjacent services help push utilization and revenue per compartment higher, but they also show that Hive Box is still managing a network economics problem:
    every improvement in growth or margin must work against a large installed base that was expensive to build.'
