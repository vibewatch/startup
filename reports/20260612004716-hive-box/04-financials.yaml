- id: SI004
  title: Capital adequacy, IPO dependence, and financing flexibility
  body: 'The capital story is more fragile than the revenue story. Public disclosures show only RMB 859M of cash and cash equivalents as of 2024-05-31, while the stated IPO uses of proceeds include lower-tier and overseas network expansion, stronger out-of-home logistics capabilities, broader value-added services, R&D, strategic investments, and working capital. Longport therefore reads the Hong Kong listing as strategically important rather than merely opportunistic. That pressure is compounded by financing structure. Yicai reported that a 2021 financing gave investors redemption rights if Hive Box failed to list by 2025-01-27. The company reportedly tried to push that deadline to 2027 by paying about USD 80M, but Asia Forge refused and sued in Hong Kong. Yicai further reported that the filing lapsed in February 2025 after missed supplemental materials and that CSRC had separately asked for more explanation on VIE and compliance issues. Taken together, those points mean the IPO was not
    just a liquidity event: it was part of the mechanism for preserving financing flexibility and deferring a potentially costly shareholder exit obligation.'
