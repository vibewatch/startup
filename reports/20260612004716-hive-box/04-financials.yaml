  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: debt-obligations
    missingEvidence: Current debt balances, project-finance obligations, guarantees, and committed credit facilities.
    whyItMatters: Hidden obligations could materially change net liquidity, runway, and downside recovery scenarios.
    diligencePath: Request the latest audited debt schedule, lease and guarantee appendix, and board materials on funding obligations.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: realized-fee-rates
    missingEvidence: Realized courier fee per parcel, discount ladders, and return-shipping unit margins by partner or channel.
    whyItMatters: List-level or secondary pricing proxies do not show whether locker density is translating into strong realized monetization.
    diligencePath: Request current commercial contracts with major courier partners plus realized revenue-per-parcel reporting by channel.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: material
    topic: segment-margins
    missingEvidence: Segment gross margins, CAC, payback, retention, and repeat-use behavior for last-mile delivery, consumer smart delivery, and value-added services.
    whyItMatters: Without segment economics, investors cannot tell whether the 2024 profit turn is durable or mostly accounting and mix assisted.
    diligencePath: Request a gross-margin bridge by segment plus cohort retention, CAC, and payback analyses from management reporting.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: underwriting-support
    missingEvidence: Current underwriting roster, valuation feedback, cornerstone demand, and exchange-readiness materials for any revived Hong Kong process.
    whyItMatters: A lapsed filing with only public sole-sponsor evidence leaves weak third-party validation of pricing power and capital-markets access.
    diligencePath: Request the latest bank engagement letter set, soft-circled demand feedback, and exchange comment tracker.
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: asia-forge-dispute-status
    missingEvidence: Court-level filings, settlement terms, payment status, and current shareholder-rights position in the Asia Forge dispute.
    whyItMatters: The redemption-right case could consume cash, delay fundraising, and reshape the cap table or control position.
    diligencePath: Obtain Hong Kong litigation docket materials, settlement correspondence, and a management downside-case memo on redemption outcomes.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
