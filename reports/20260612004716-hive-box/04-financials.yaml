tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Courier last-mile delivery service
    - Courier or courier company pays locker-delivery fee when parcels are deposited for recipient pickup
    - RMB per parcel
    - 2023 revenue RMB 1.84B; 48.2% of revenue. Jan-May 2024 revenue RMB 777M; 40.8% share
    - Large, scaled, and recurring with network density, but structurally tied to a lower-margin heavy-asset workflow
    - Request realized average fee per parcel, discounts by courier, and churn risk under stricter consent rules
  - - Consumer smart delivery / reverse logistics
    - Consumers use lockers for returns, self-ship, and other outbound smart-delivery flows
    - RMB per parcel / order
    - 2023 revenue RMB 1.02B; Jan-May 2024 revenue RMB 692M and +107.3% YoY
    - Fastest-growing stream; likely better monetization and cross-sell potential than pure deposit fees
    - Request product-level mix between returns, self-ship, and other outbound flows plus unit margin by flow
  - - Overstay storage fees and memberships
    - Consumers pay after the free pickup window or subscribe to waive fees
    - RMB per parcel / membership
    - 18 hours free, then RMB 0.5 per 12 hours capped at RMB 3; cumulative disclosed storage-fee revenue RMB 808M across 2021 to Jan-May 2024
    - High-cash micro-monetization but politically and reputationally sensitive
    - Request membership penetration, waiver rates, complaint rates, and how much fee income survives regulation or service-policy changes
  - - Advertising / community / home / laundry services
    - Locker traffic is monetized through media and adjacent community services
    - RMB per campaign / order
    - Contained inside value-added revenue; public sources mention advertising, laundry, and home services but do not break out revenue by line
    - Potentially attractive incremental monetization, but public disclosure is too aggregated to score durability
    - Request 2023-2024 revenue split and gross margin by advertising, laundry, home services, and other value-added lines
  - - Cross-border and lower-tier expansion optionality
    - IPO proceeds were intended to finance more lockers and out-of-home logistics capability in lower-tier and overseas markets
    - Capex and revenue not public
    - Growth plan disclosed, but no public revenue contribution yet
    - Could add scale and diversify geography, but raises capex demands before returns are proven
    - Request expected payback period, cabinet economics, and pre-committed property or partner pipeline by new geography
  notes: Rows separate disclosed revenue buckets from adjacent monetization channels that public sources mention but do not quantify separately. Value-added sub-lines remain partially inferred because public disclosure aggregates them.
