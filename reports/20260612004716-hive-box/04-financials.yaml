- id: TI002
  title: Pricing / monetization table
  columns:
  - Plan / motion
  - List vs. realized pricing
  - Current public price / status
  - Source
  - Implication
  rows:
  - - Courier locker deposit fee
    - Secondary estimate only; realized rate and rebates not publicly disclosed
    - About RMB 0.2-0.4 per parcel in retained secondary analysis
    - Sohu analysis citing prospectus mechanics
    - Public monetization seems low per parcel, which helps explain why density and ancillary services matter so much
  - - Consumer overstay fee
    - Explicit consumer-facing tariff
    - 18 hours free, then RMB 0.5 per 12 hours, capped at RMB 3 per parcel
    - Sina, Tencent News, China Daily HK, and secondary prospectus analysis
    - Clear disclosed fee schedule supports fee-income modeling, but the controversy makes it politically fragile
  - - Membership plan
    - Explicit consumer-facing tariff
    - RMB 5 monthly, RMB 15 quarterly, RMB 55 annual
    - Tencent News customer-service quote
    - Membership converts punitive overstay into recurring small-ticket subscription revenue and can reduce fee backlash
  - - Reverse-logistics / return shipping pricing
    - Not publicly itemized
    - Service is live, but per-order price and revenue share are not disclosed
    - Official Hive Box pages plus prospectus-based coverage
    - Strong usage growth does not automatically reveal unit margin or take rate
  - - Advertising / community services pricing
    - Not publicly itemized
    - Revenue line exists inside value-added services, but campaign pricing is not public
    - The Paper, JRJ, official ecosystem pages
    - Public evidence proves the stream exists, not whether it is high quality or episodic
  - - Laundry and home-service pricing
    - Not publicly itemized
    - Operationally live in retained coverage; prices and realized margins not public
    - JRJ and other secondary coverage
    - Useful diversification story, but still not a line item investors can independently underwrite
  notes: Public evidence is much stronger on pickup-fee tariffs than on realized B2B pricing or adjacent-service unit economics. The table therefore separates explicit tariffs from monetization lines whose ASP remains undisclosed.
  claimRefs:
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
  - CI030
