- id: SI005
  title: Financial verdict and the underwriting gaps that still matter
  body: 'The financial verdict is better than Hive Box’s historical loss profile alone would suggest, but still short of full underwriteability. The company has real scale, disclosed revenue growth, a visible mix shift toward consumer smart delivery, and a first profitable stretch in early 2024. Those are meaningful positives. At the same time, several of the most important inputs remain hidden or only weakly triangulated: realized courier fee rates and discounting, segment gross margins, CAC and payback, NRR, current debt or project-finance obligations, and the exact status and economics of the Asia Forge dispute. The market also lacks the normal IPO-era disclosures that would clarify underwriting support because the application proof disclosed a sole sponsor but never advanced to a broader, live syndication process with public cornerstone or pricing detail. The right investment read is therefore conditional: Hive Box looks operationally better and strategically more diversified than a
    simple locker-fee story, but the capital structure, accounting-aided margin inflection, and missing unit-economics detail still block a high-conviction valuation case.'
