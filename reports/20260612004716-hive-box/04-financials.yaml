- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Locker network scale
    - 330,200 lockers and 29.9M compartments across about 209K communities as of 2024-05-31
    - High
    - Scale should improve route efficiency and spread fixed costs if usage remains high
    - Request cabinet cohort payback and EBITDA contribution by locker vintage
  - - Consumer smart delivery growth
    - Jan-May 2024 revenue RMB 692M and +107.3% YoY; reverse parcels are a core driver
    - Medium
    - Fast growth in a higher-value outbound use case can improve mix and reduce dependence on basic courier deposit fees
    - Request contribution margin by reverse logistics, self-ship, and other consumer flows
  - - Storage-fee monetization
    - RMB 808M cumulative disclosed storage-fee revenue from 2021 through Jan-May 2024
    - High
    - Small-ticket fee income materially supports network monetization and locker turnover
    - Request sensitivity of EBITDA to overstay-fee policy changes and membership adoption
  - - Gross-margin inflection
    - Gross margin improved from 10.6% in 2023 to 26.1% in Jan-May 2024
    - High
    - The reported operating story improved sharply, but the source of that improvement matters for sustainability
    - Request segment gross margins and bridge from 2023 to 2024 margin improvement
  - - Depreciation-life reset
    - Many lockers were moved from 5-year to 10-year depreciation in 2024
    - Medium
    - Accounting life extension boosts short-term reported profit without generating cash by itself
    - Request audited effect on 2024 gross profit, EBITDA, and cabinet-level payback
  - - Heavy-asset cost proxy
    - Secondary analysis suggests RMB 50K-80K hardware per locker and rent at 40%-50% of total cost
    - Low
    - Even imprecise external proxies confirm that hardware and property economics remain central to the model
    - Provide current cabinet capex, site rent burden, and maintenance cost per active locker
  - - Liquidity cushion
    - Cash and cash equivalents were RMB 859M at 2024-05-31
    - High
    - Even after the first profitable period, liquidity still matters because network expansion remains capital hungry
    - Provide monthly burn, working-capital swing, and minimum cash policy
  - - CAC / payback / NRR
    - Not publicly disclosed
    - Low
    - Without these metrics, investors cannot test whether 2024 profitability reflects durable acquisition economics
    - Provide cohort retention, CAC, payback, repeat-use behavior, and NRR or analogous engagement metrics
  notes: This table mixes disclosed facts with explicitly labeled external proxies. Wherever public evidence is insufficient, the row states the exact diligence request needed instead of inventing precision.
