- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public signal
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Cash on hand
    - RMB 859M cash and cash equivalents as of 2024-05-31
    - High
    - Defines the visible liquidity buffer before any new equity proceeds or redemption payments
    - Request latest monthly cash balance and unrestricted-vs-restricted split
  - - 2021 financing overhang
    - Investors reportedly received redemption rights if Hive Box failed to list by 2025-01-27
    - Medium
    - Turns a delayed IPO into a balance-sheet and control issue rather than just a timetable issue
    - Request definitive financing documents and cap-table waterfall under redemption scenarios
  - - Proposed extension payment
    - Hive Box reportedly offered about USD 80M to extend the redemption deadline to 2027-01-31
    - Medium
    - Shows that preserving listing optionality may itself require substantial cash outflow
    - Request term sheet, who accepted, and whether any partial settlement has already been funded
  - - Use of IPO proceeds
    - Lower-tier and overseas expansion, out-of-home logistics capability, value-added services, R&D, strategic investments, and working capital
    - High
    - Confirms that the IPO was intended to finance continued growth rather than simply monetize existing shareholders
    - Request capex budget and allocation by cabinet deployment, software, M&A, and international build-out
  - - Listing status
    - Yicai reported the filing lapsed in Feb 2025 after missed supplemental materials
    - Medium
    - Raises uncertainty over how quickly new primary capital can be raised through the planned Hong Kong path
    - Request current relaunch timetable, adviser readiness, and what supplemental work remains
  - - Underwriting support
    - Application proof and coverage identify a sole sponsor, with no public price range or broadened live syndicate visible in retained sources
    - Medium
    - A shallow public underwriting profile limits external validation of demand and valuation support
    - Request active bookrunner list, cornerstone pipeline, valuation feedback, and latest exchange comments
  - - Debt / project-finance obligations
    - No public disclosure found in retained sources
    - Low
    - Hidden debt or lease-like commitments could materially change runway and downside risk
    - Provide debt schedule, guarantees, lease obligations, and any project-finance or supplier-credit facilities
  - - Regulatory follow-up
    - Yicai reported CSRC asked for more explanation on VIE structure and compliance in Oct 2024
    - Medium
    - Adds process risk and can delay access to capital even if the business itself is improving
    - Request exchange and CSRC comment log plus current remediation status
  notes: The public record is relatively strong on the existence of financing pressure but weak on the balance-sheet detail needed to quantify it. Debt, guarantees, and post-2024 cash movements remain the biggest blind spots.
