company:
  name: Hive Box
chapter:
  number: 4
  title: Financials
  summary: Hive Box disclosed RMB 3.81B of revenue in 2023 and RMB 1.904B in the first five months of 2024, when it also reported its first profitable period with RMB 71.6M of profit. The revenue mix is shifting from courier locker-delivery fees toward consumer smart delivery and value-added monetization, but the margin inflection depends partly on a locker-depreciation-life reset and a still heavy fixed-cost network. With only RMB 859M of cash as of May 2024, IPO proceeds earmarked for more expansion and an unresolved redemption-right dispute that stalled the listing, the business is improving operationally but remains under-disclosed for full underwriting.
sections:
- id: SI001
  title: Revenue model, pricing mechanics, and mix shift
  body: 'Hive Box monetizes the last mile through a layered model rather than a single courier fee. The official Chinese and global sites frame the business as a self-service locker network that links couriers, consumers, property managers, and shipping partners through parcel drop-off, pickup, return shipping, online settlement, and data-sharing workflows. Public market coverage then ties that operating model to three disclosed revenue buckets: courier-facing last-mile delivery fees, consumer smart delivery services such as self-ship and e-commerce reverse logistics, and a value-added bucket that includes storage fees plus adjacent services such as advertising, laundry, and home services. The mix is moving away from pure courier deposit fees. Last-mile delivery remained the largest segment in 2023 at RMB 1.84B, but its share had already fallen below half of revenue, while consumer smart delivery rose to RMB 1.02B and value-added revenue reached RMB 956M. That shift matters because the faster-growing
    streams appear to carry better monetization optionality than the legacy pay-per-parcel locker deposit business.'
  claimRefs:
