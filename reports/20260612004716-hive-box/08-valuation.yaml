- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Element
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Network scale
    - Hive Box has rare last-mile locker density in China and a real installed-base moat.
    - Installed base alone does not guarantee premium economics or a premium public multiple.
    - Show city-level utilization, payback, and renewal economics.
  - - Strategic role
    - Lockers matter operationally inside broader logistics ecosystems, as Amazon, Cainiao, and JD all imply.
    - Strategic relevance does not prove standalone equity value at a premium multiple.
    - Show software, data, and take-rate monetization beyond basic parcel handling.
  - - Financial trajectory
    - Losses improved sharply and January-May 2024 turned profitable.
    - The profitable window may be too short, too seasonal, or too fee-driven to annualize safely.
    - Provide full audited 2024 and 2025 statements plus 2026 YTD bridge.
  - - IPO optionality
    - A reopened Hong Kong listing could create liquidity and fresh price discovery.
    - The lapsed filing and regulator questions show that exit timing is uncertain and could stay closed.
    - Share the regulator Q&A pack and sponsor plan for re-filing.
  - - Capital structure
    - A large private round shows institutional investor interest existed.
    - Redemption rights and extension payments can leak value to preferred holders before common upside accrues.
    - Disclose the current cap table, liquidation waterfall, and side letters.
  - - Competitive positioning
    - Cainiao and JD validate that logistics infrastructure remains strategically important.
    - Those same comps also show scale does not stop valuation compression in public markets.
    - Prove Hive Box deserves a higher-quality business label than generic logistics infrastructure.
  notes: 'This table separates company quality from price quality: a business can be strategically interesting while still being overpriced on the public evidence set.'
