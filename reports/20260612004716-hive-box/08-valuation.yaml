- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / anchor
  - Multiple or valuation signal
  - Relevance
  - Key limitation
  rows:
  - - Hive Box reference
    - RMB3.812B 2023 revenue; ~RMB4.57B annualized Jan-May 2024 revenue
    - RMB25B private mark; ~5.5x-6.6x sales
    - Subject company and direct pricing question
    - Private mark is stale and not refreshed by a live listing or new audited pack
  - - InPost
    - 2025 revenue PLN14.71B; adj. EBITDA margin 27.9%; 61,196 APMs
    - ~2.73x EV/Sales and ~2.10x P/S in June 2026
    - Closest public locker-led comp with real parcel density and mature disclosure
    - Different geography, larger parcel volume, and stronger profitability
  - - JD Logistics
    - 2025 revenue RMB217.1B; 1,600+ warehouses; 25-country network
    - ~0.30x P/S in June 2026
    - Shows how public markets price large asset-heavy logistics infrastructure
    - Much broader business scope than lockers and embedded in a huge platform ecosystem
  - - Cainiao / Alibaba context
    - March-quarter 2025 Cainiao revenue RMB21.6B; continuing automation and overseas investment
    - Valuation reset and delayed IPO despite strategic relevance
    - Shows that even scaled logistics franchises can see timing and valuation pressure
    - Cainiao is nested inside Alibaba and not a clean standalone public multiple
  - - Amazon Locker context
    - All-carrier residential locker product; 100k+ estimated global locations in 2026
    - Strategic utility is obvious, but no standalone public equity multiple exists
    - Useful for strategic importance of the category and network effects
    - Amazon monetizes lockers inside a much larger commerce and fulfillment system
  notes: 'The set is intentionally mixed: one clean public locker comp, one broad public logistics comp, and two strategic ecosystem comps. That mix is more honest than forcing false precision from a single multiple.'
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful public and strategic references for a smart-locker operator rather than every possible logistics peer.
