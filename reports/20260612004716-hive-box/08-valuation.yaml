  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-audited-financials
    missingEvidence: Audited full-year 2024 financial statements, 2025 full-year statements, and 2026 year-to-date management accounts with revenue, gross margin, EBITDA, and cash flow.
    whyItMatters: The present public range depends on stale or annualized revenue anchors; without updated audited numbers the 25 billion RMB mark cannot be underwritten with confidence.
    diligencePath: Request the last two audited financial packages plus current monthly KPI bridge from the CFO and listing sponsor materials.
    relatedQuestionRefs:
    - QV007
    - QV021
    - QV022
    - QV023
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Full cap table, liquidation waterfall, investor side letters, anti-dilution terms, and exact redemption or buyback obligations tied to the 2021 round and any later amendments.
    whyItMatters: The economic value available to new common-equity investors can differ materially from the headline equity valuation if preference overhang or cash settlement rights are large.
    diligencePath: Obtain legal closing binder, current shareholder agreement, and scenario waterfall from counsel before pricing any entry.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: regulator-correspondence
    missingEvidence: The exact CSRC and HKEX supplemental disclosure requests, management responses, and any updated timetable for re-filing or abandoning the listing path.
    whyItMatters: Exit timing, governance risk, and diligence burden all hinge on whether regulators raised fixable process issues or more structural compliance questions.
    diligencePath: Request the regulator Q&A pack, board materials on listing strategy, and sponsor workplan for any renewed filing.
    relatedQuestionRefs:
    - QV029
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: monetization-mix
    missingEvidence: Detailed revenue split among pickup fees, late fees, memberships, software, end-to-end delivery, and any advertiser or partner economics, plus contribution margins by stream.
    whyItMatters: The valuation multiple should be higher only if revenue quality is shifting toward recurring software and network economics rather than penalty-style fees.
    diligencePath: Request SKU-level or stream-level revenue bridge with gross margin and repeat-rate metrics for each monetization layer.
    relatedQuestionRefs:
    - QV008
    - QV026
    relatedTableRefs:
    - TV002
    - TV006
  - type: private-evidence-only
    severity: material
    topic: locker-utilization-and-unit-economics
    missingEvidence: Cohort data on locker utilization, dwell time, route density, same-site retention, maintenance cost, and property-rent renewal economics by city and locker format.
    whyItMatters: A higher multiple is easier to justify if the network is demonstrably compounding through utilization and contribution margin rather than just through installed base growth.
    diligencePath: Request city cohort deck and operations dashboard showing utilization, occupancy, labor substitution, and payback period by locker cohort.
    relatedQuestionRefs:
    - QV013
    - QV021
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: minor
    topic: TV004 comparable set still lacks private secondary marks and cleaner standalone locker peers
    missingEvidence: A fuller public comp set with disclosed private secondary marks or more directly comparable listed locker-only operators.
    whyItMatters: The comparable valuation table is intentionally partial because the best public references are strategic or model-mismatched rather than perfect like-for-like peers.
    diligencePath: Collect banker comp sheets, secondary transactions, and any future public filings from smart-locker specialists before tightening the range.
    relatedQuestionRefs:
    - QV012
    - QV019
    relatedTableRefs:
    - TV004
