tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - What changes the view
  rows:
  - - Recommendation
    - track
    - Strategic scarcity is real, but current public evidence does not fully clear the RMB25 billion mark.
    - Upgrade only after audited refresh plus resolved preference overhang, or on a materially lower entry price.
  - - Confidence
    - medium
    - The direction of travel is clear, but the current audited base year and cap-table economics are not public.
    - Confidence rises with full audited 2024-2026 YTD numbers and regulator correspondence.
  - - Risk rating
    - high
    - IPO timing, redemption rights, and monetization-quality questions can all compress equity value quickly.
    - Risk falls only if the structure and disclosure stack simplify.
  - - Valuation stance
    - stretched
    - RMB25 billion implies roughly 5.5x-6.6x sales on visible anchors, above cleaner public locker or logistics references.
    - The stance moves toward fair near the base-case range or after fresh bull-case proof.
  - - Decision implication
    - Do not underwrite the old private mark as current fair value
    - The better posture is to keep the company on the watchlist while demanding proof or price discipline.
    - A new audited profit base plus cleaner waterfall can change the call.
  notes: Assessment uses only public evidence available by 2026-06-12; it does not assume access to sponsor diligence, private financial packs, or shareholder agreements.
