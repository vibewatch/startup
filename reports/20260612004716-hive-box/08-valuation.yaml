- id: public-comps-support-strategic-interest-more-than-the-current-price
  title: Public comps support strategic interest more than they support the current price
  body: 'The cleanest listed locker comp is InPost, and that lens is sobering for Hive Box bulls. InPost is larger, more mature, and more transparent: 2025 revenue of PLN14.7 billion, adjusted EBITDA margin near 28%, more than 61,000 automated parcel machines, and public-market valuation around 2.7x EV-to-sales in June 2026. Using Hive Box’s annualized January-May 2024 revenue as a rough anchor, InPost’s multiple implies a value analogue around RMB12.5 billion before even penalizing Hive Box for weaker profitability, heavier unresolved listing risk, and noisier disclosure. That does not make Hive Box a bad business; it makes the 25 billion mark hard to defend with public evidence.


    JD Logistics and Cainiao matter, but mainly as strategic and cautionary comps. JD shows public markets can value huge logistics networks at very low sales multiples when the model is capital- and competition-intensive. Cainiao shows that even a logistics franchise nested inside Alibaba can see valuation reset and IPO timing slip. Amazon Locker is strategically important too, but Amazon monetizes lockers inside a much larger commerce and fulfillment ecosystem, not as a standalone premium-multiple listed subsidiary. Taken together, these comparables say Hive Box deserves strategic attention because last-mile infrastructure matters, yet the burden of proof for a 25 billion standalone equity value remains on Hive Box, not on the market.'
