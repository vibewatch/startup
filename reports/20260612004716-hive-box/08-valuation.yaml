- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited numbers underwhelm
    - Updated audited revenue remains near or below the low end of the base range and profit quality is weak
    - The base and bull cases compress because the old private mark was using too much narrative premium
    - Re-anchor valuation toward the bear or low-base range
  - - Preference stack bites harder than expected
    - Redemption or side-letter cash obligations materially reduce common-equity upside
    - Headline valuation ceases to be the right input for outside-investor returns
    - Pause underwriting until the legal waterfall is modeled
  - - Regulators stay unconvinced
    - No credible path to re-file or clear prior disclosure questions
    - Exit timing extends and public-market comparability gets worse, not better
    - Treat the company as a longer-duration private hold with lower exit certainty
  - - Profit mix looks fee-driven
    - Late fees and penalty-style monetization account for too much of the profit bridge
    - Quality of earnings falls and premium-multiple argument weakens
    - Cut the scenario multiple assumptions
  - - Competitive capex race intensifies
    - Cainiao, JD, or other networks raise the investment bar for density and service levels
    - Returns on incremental lockers weaken and payback periods stretch
    - Demand fresh unit-economics proof before adding capital
  notes: These are valuation kill criteria, not generic operating concerns. Any one of them can materially compress the supportable multiple.
  claimRefs:
