  topStrengths:
    - >-
      Scale leadership is real, with 330,200 lockers across about 209,000 communities and 367.8 million cumulative
      consumers served.
    - >-
      The revenue mix is broadening beyond courier drop-off fees, while January-May 2024 showed the first disclosed
      profitable period and stronger gross margin.
    - >-
      The product stack extends beyond cabinets into SaaS, APIs, returns, storage, advertising, and community-service
      workflows, supporting multiple monetization vectors.
  topRisks:
    - >-
      The Asia Forge redemption-right dispute and lapsed February 2025 IPO leave capital-structure and financing risk
      unresolved.
    - >-
      Consent enforcement, overtime-fee backlash, and data-security scrutiny can directly impair locker utilization,
      monetization, and listing readiness.
    - >-
      The business remains asset-heavy, and the 2024 profit inflection was helped partly by a depreciation-life change
      rather than only clean operating leverage.
  unresolvedGaps:
    - No updated audited financials or renewed prospectus were publicly available after the February 2025 filing lapse.
    - >-
      Public evidence still does not disclose current debt, retention or churn, customer concentration, or advertiser
      repeat-spend metrics.
    - >-
      Reviewed public sources did not surface Asia Forge pleadings, a clear case timetable, or a precise downside map
      for redemption enforcement.
