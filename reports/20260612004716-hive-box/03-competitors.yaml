- id: TP004
  title: Pricing and packaging comparison
  columns:
  - Player or mode
  - Public monetization signal
  - Recipient cost posture
  - Partner economics or subsidy clue
  - Implication
  rows:
  - - Hive Box
    - Public adverse coverage emphasizes overtime pickup fees plus broader workflow monetization
    - Recipient fee posture appears more aggressive than the best-liked substitutes
    - APIs, SaaS, and network services diversify revenue but do not erase fee sensitivity
    - Pricing power exists, but it is politically and competitively constrained
  - - Cainiao Station
    - Station operator page foregrounds per-parcel dispatch and send fees plus ancillary commerce
    - Recipient cost posture is softened by staffed pickup and home-delivery choices inside the app
    - Traffic conversion, ads, recycling, and service add-ons create non-fee revenue
    - Ancillary revenue lowers the need to rely on recipient overtime fees alone
  - - JD ecosystem
    - Reviewed public pages do not foreground locker-specific pricing
    - Recipient economics are bundled inside broader retail and logistics service
    - Scale economics sit at the ecosystem level
    - JD competes more on service bundle than on pickup-fee optimization
  - - Standard doorstep delivery
    - Monetization is service-level based rather than locker-time based
    - Recipient pays for convenience through the courier service or merchant fulfillment economics
    - Route density and service quality drive economics
    - Strong substitute for high-value or time-sensitive use cases
  - - Same-city urgent delivery
    - Premium speed offer with one-hour average delivery claim
    - Recipient pays for urgency, not storage time
    - Economics favor urgent parcels, not overflow locker storage
    - Keeps a premium benchmark in the market
  - - Amazon Apartment Locker
    - Property-side marketing says the solution is all-inclusive and competitively priced
    - Resident pickup is typically framed as convenience, not itemized storage pricing
    - Host case studies emphasize time savings and lower recurring locker fees
    - Shows another way to monetize through host relationships instead of recipient overtime charges
  notes: Recipient cost posture is intentionally qualitative because the live 2026 city-by-city Hive Box fee table and JD locker fee specifics were not fully recoverable from open official pages during this run.
