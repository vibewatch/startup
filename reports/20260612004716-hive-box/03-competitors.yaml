tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Option
  - Category
  - Scale or coverage signal
  - Target user / location model
  - Monetization posture
  - Strategic direction or limitation
  rows:
  - - Hive Box
    - Direct locker leader
    - 330.2k lockers; 209k communities; 367.8m+ users
    - Residential communities and partner last-mile nodes
    - Known to monetize through delivery workflows, SaaS, APIs, and controversial overtime pickup fees
    - Strong installed base and integration stack, but fee posture and compliance scrutiny weaken pricing freedom
  - - Cainiao Station / locker
    - Direct domestic hybrid rival
    - Official pages stress a globally used logistics app, staffed stations, and broad station formats rather than only cabinets
    - Neighborhood stations, property service centers, convenience-store formats, lockers, and app-based home-delivery choices
    - Station operators earn parcel-handling fees plus traffic, ads, recycling, laundry, and other ancillary income
    - Hybrid staffed-plus-digital model broadens service scope and eases courier adoption
  - - JD Logistics pickup / self-pickup
    - Integrated incumbent substitute
    - Public disclosures reviewed here emphasize supply-chain infrastructure, retail service, and annual reporting rather than locker counts
    - JD retail and logistics users inside a broader integrated network
    - Value proposition is bundled service quality and logistics capability, not public locker monetization
    - Competitive pressure comes from ecosystem breadth more than open locker density
  - - SF Express / SF Intra-City
    - Doorstep substitute
    - 100% prefecture and 99.8% county coverage on the main network; 1-hour average delivery in same-city service
    - Home or urgent point-to-point delivery
    - Charges are tied to service level and urgency rather than unattended pickup time
    - Keeps a high-service alternative alive whenever a recipient values convenience or speed over self-service
  - - InPost
    - International locker reference
    - 94,536 out-of-home points and 61,196 APMs in 2025
    - European out-of-home parcel users and merchants
    - Scaled locker density into revenue and parcel-volume growth, but with heavy capex
    - Best reference for density flywheel and capex burden in a mature locker market
  - - Amazon Hub Apartment Locker
    - International property-access reference
    - Property-manager case studies and resident help flows, rather than public national count disclosures
    - Residential buildings and property managers
    - All-inclusive, competitively priced property offer; resident pickup is self-service
    - Shows a host-side moat based on time savings, cross-carrier compatibility, and resident convenience
  notes: A direct peer in this chapter means any evidence-backed way to solve residential last-mile pickup or delivery, not only another Chinese locker fleet.
