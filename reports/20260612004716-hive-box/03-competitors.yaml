    severity: material
    topic: live-hive-box-fee-table
    missingEvidence: A current official Hive Box page or mini-program capture showing live city-level overtime storage fees and any membership terms as of run date.
    whyItMatters: Recipient price sensitivity is central to competitive switching, and historical backlash means outdated fee assumptions could overstate or understate monetization freedom.
    diligencePath: Use the Hive Box app or mini-program with city-specific test addresses and capture the live overtime-fee schedule, grace period, and membership upsell in several tier-one and lower-tier cities.
