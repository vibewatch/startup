company:
  name: Hive Box
chapter:
  number: 3
  title: Competitors
  summary: 'Hive Box still looks like the density leader in China''s smart-locker niche, but the real competitive battle is broader: Cainiao fights with staffed stations and app-led flexibility, SF and JD keep doorstep or integrated-network substitutes alive, and international references show the moat lives in property access and workflow integration more than cabinet hardware. The chapter conclusion is that Hive Box has a real but medium-durability moat because scale matters, yet multi-homing, consent regulation, and service substitutes limit pricing power.'
sections:
- id: landscape-map
  title: 'Direct landscape: lockers, stations, and integrated networks'
  body: 'Hive Box still deserves to anchor the direct-comparison set because its own surfaces and filing-era coverage point to national scale in smart parcel lockers, broad community penetration, and a product stack that mixes hardware, software, and open APIs. But the closest domestic rival is not simply another bank of lockers. Cainiao competes with a hybrid model: official pages foreground staffed neighborhood stations, merchant and property-service-center formats, and a consumer app that spans stations, lockers, and home-delivery choices. JD Logistics is relevant as a public-market incumbent, yet the JD materials reviewed here emphasize integrated supply-chain infrastructure and retail service rather than a standalone locker estate, which makes JD a broader substitute channel more than a pure locker peer. Internationally, InPost shows what density-plus-capex leadership can look like when lockers become a national habit, while Amazon Hub Apartment Locker shows how the property-manager
    sales motion can become part of the moat.'
  claimRefs:
