- id: TP005
  title: Moat durability and competitive risk register
  columns:
  - Moat claim
  - Supporting evidence
  - Threat
  - Severity
  - Diligence ask
  rows:
  - - Installed locker density matters
    - Hive Box filing-era counts are very large and InPost shows mature density can scale
    - Density can be neutralized if recipients or couriers shift to staffed stations or doorstep alternatives
    - medium
    - Request utilization, parcel-per-cabinet, and city-level retention by property type
  - - Property access is a real moat input
    - Hive Box links properties explicitly; Cainiao uses ground-floor and non-overlap rules; Amazon sells to property managers
    - Property contracts may be non-exclusive or short duration, reducing lock-in
    - high
    - Request contract duration, renewal, exclusivity, and churn metrics by city tier
  - - API and workflow integration raise partner switching costs
    - Hive Box exposes APIs and end-to-end SaaS/ops support
    - Competing ecosystems may still multi-home if consumer demand shifts
    - medium
    - Request partner count by integration type and gross parcel share from API-linked flows
  - - Consumer lock-in is weak
    - Pickup workflows are familiar across locker brands and substitutes remain visible
    - Low consumer friction limits pricing leverage
    - high
    - Request cohort behavior after fee changes and share of users who reroute to other modes
  - - Regulation can defend users and cap coercive tactics
    - Consent and disclosure rules now directly constrain forced locker placement
    - Enforcement can compress monetization or require operational changes city by city
    - high
    - Request internal compliance audits and any city-specific remediation costs
  - - Adverse capital-market history increases competitive vulnerability
    - IPO delay, litigation, and fee backlash can distract management and weaken negotiating posture with hosts or partners
    - If unresolved, capital access and host confidence could worsen relative to peers
    - medium
    - Request latest litigation status, CSRC/HKEX remediation progress, and fee-policy review results
  notes: This risk register evaluates moat durability instead of repeating raw market share numbers; severity reflects competitive effect, not legal outcome alone.
