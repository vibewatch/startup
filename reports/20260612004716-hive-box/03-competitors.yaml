    whyItMatters: Without a clean count split, JD is easier to classify qualitatively than quantitatively, which weakens precision in the direct-comparison table.
    diligencePath: Pull the latest Chinese annual report, sustainability report, or product page that quantifies JD self-pickup lockers and stations separately, then refresh the competitor profile table.
