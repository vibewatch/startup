- id: moat-durability
  title: 'Moat durability: real density advantage, but not unbreakable lock-in'
  body: 'Hive Box does have real advantages. Scale matters for courier habit, utilization, and the economics of software integration, and international references show that dense locker networks can compound. InPost''s 2025 results demonstrate how large automated out-of-home footprints can support billion-parcel throughput, while Amazon Apartment Locker shows that property-manager time savings and cross-carrier compatibility can create durable host-side appeal. Even so, Hive Box'' moat looks medium rather than absolute. The technology is useful but not unique; consumers already understand self-service retrieval workflows across several brands. The harder-to-replicate piece is a combination of property relationships, routing integrations, and enough density to stay convenient for couriers and residents. Adverse evidence matters here: Hive Box'' IPO delay, litigation, and fee-related backlash show that a large footprint does not automatically translate into unconstrained pricing power or low
    regulatory risk. The durable moat is distribution access plus workflow integration, not simply owning more cabinets.'
  claimRefs:
  - CP038
  - CP040
  - CP041
  - CP042
  - CP043
  - CP045
  - CP046
