- id: pricing-switching
  title: Pricing posture, switching costs, and multi-homing
  body: 'The pricing debate is less about sticker-price sophistication than about how much leverage each network has over the recipient. Public backlash around Hive Box focused on overtime charges and placement without clear consent, which is exactly why the revised delivery-rule regime now requires disclosure and user agreement. Cainiao''s disclosed station economics look different: operator monetization comes from parcel handling fees, traffic conversion, ads, recycling, and services such as laundry, while the app keeps home-delivery and pickup options visible. That mix reduces the need to push consumer overtime monetization as the main revenue lever. Doorstep substitutes add another cap on pricing freedom because SF standard delivery and same-city rush both remain live alternatives when urgency or convenience matters more than unattended pickup. The result is low consumer switching cost and meaningful multi-homing: users can move among locker, staffed station, and home-delivery modes
    by parcel type, urgency, and local building rules. That makes unpopular fee changes easier for users to punish quickly.'
  claimRefs:
  - CP017
  - CP018
  - CP021
  - CP022
