- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / issue
  - Status
  - Scope
  - Why it matters
  - Gap
  rows:
  - - Data localization and policy controls
    - Publicly disclosed
    - Mainland user data storage and policy-level controls
    - Consumer logistics, identity, and location data are central to the product experience
    - No external audit or certification pack was visible
  - - Real-name / identity verification
    - Publicly disclosed
    - Registration, shipping, and wallet setup flows
    - Required for regulated dispatch and payments, but expands sensitive-data exposure
    - No public false-positive / fraud-loss statistics
  - - Consent before locker delivery
    - Mandated by regulation
    - All express deliveries that could be pushed into lockers or service stations
    - This rule constrains pure convenience-maximization and requires clean opt-in flows
    - Operational compliance metrics are not public
  - - Advertising controls in pickup flow
    - Contested / partially controllable
    - App can suppress some ads; WeChat scan pickup cannot fully do so
    - A monetization layer can directly degrade the pickup experience and create data-collection pressure
    - Live controversy shows the product surface is not fully aligned with convenience claims
  - - Wallet payment constraints
    - Publicly disclosed
    - Recharge and delegated payment flows across apps and operator tools
    - Clarifies payment scope and settlement logic
    - No public disclosure on chargeback, wallet balances, or abuse controls
  - - Security / reliability assurance
    - Only implicitly described
    - App, locker, and cloud operations
    - The company claims encryption and incident-response capability
    - No public uptime dashboard, SOC / ISO / MLPS artifact, or third-party pentest summary
  notes: The table distinguishes disclosed policy controls from externally proven controls. The public record is strongest on privacy-policy text and regulatory obligations, and weakest on third-party assurance and live operational metrics.
