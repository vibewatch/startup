callouts:
- calloutType: strength
  title: This is a workflow platform, not just a cabinet footprint
  body: The most defensible product takeaway is that Hive Box has already layered software, app channels, payment rules, and multiple cabinet SKUs onto the last-mile locker base. That makes the product richer than a one-function residential locker network.
  claimRefs:
  - CE001
  - CE005
  - CE016
  - CE017
  - CE047
- calloutType: risk
  title: Trust and consent now touch the core pickup moment
  body: Because consent rules, data collection, and ad pop-ups all shape whether a resident can retrieve a package smoothly, product risk now sits directly in the user experience rather than only in the legal department.
  claimRefs:
  - CE027
  - CE030
  - CE042
  - CE043
  - CE044
  - CE052
- calloutType: insight
  title: Drone relay turns the locker into infrastructure, but only in narrow pilots so far
  body: The drone-transfer cabinet is the clearest proof that Hive Box wants the locker to become a logistics node in a larger unmanned network. It is strategically interesting, but still too early to treat as the core thesis for resident parcel delivery.
  claimRefs:
  - CE037
  - CE038
  - CE039
  - CE040
  - CE041
