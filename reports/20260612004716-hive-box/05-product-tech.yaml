- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Hive Box solution
  - Measurable benefit
  - Limitation
  rows:
  - - Courier drop-off
    - Login, scan waybill, enter recipient info, choose a cell, and close the door
    - Standard smart parcel locker workflow
    - 24/7 unattended parcel handoff and better route productivity
    - No public network-wide miss-open or failed-deposit data
  - - Resident pickup
    - Receive SMS / app notice, input code or open remotely, retrieve parcel
    - Code, QR, app, and one-click open pickup modes
    - Pickup can happen outside staffed station hours
    - App-only ad settings still leave WeChat scan retrieval exposed to ads
  - - Reverse logistics / self-ship
    - Create an order in the app, deposit parcel, let courier collect
    - Sending-box plus app-led returns and self-ship flows
    - Supports multiple e-commerce return channels without home pickup wait
    - Per-order pricing and unit economics are not public
  - - Community storage / services
    - Open app, buy storage or service, drop or schedule item / worker
    - Storage, laundry, and home-service modules inside consumer app
    - Turns locker traffic into recurring community services
    - Public evidence proves feature existence, not service-level profitability
  - - Hospital / relay operations
    - Dispatch through cloud platform, UAV relay, auto-sort, pickup-code notice
    - Drone-transfer cabinet plus unmanned operating platform
    - Cuts handoff time in pilot settings and supports ToB relay use cases
    - Still presented as pilot-stage, not mainstream resident product
  notes: Benefit cells reflect public workflow descriptions rather than audited KPIs. The table purposely keeps operational limitations visible, because public materials are much stronger on feature steps than on outcome statistics.
