- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Smart parcel locker
    - Courier + resident
    - Scaled production product
    - IP54-rated 24/7 parcel workflow with SMS code pickup and multiple cell sizes
    - Need public uptime / failure-rate evidence by cohort
  - - Smart box
    - Resident / small-site operator
    - Scaled niche SKU
    - Small-footprint cabinet with QR control, solar option, anti-theft design, and embedded IoT
    - Need field data on theft-prevention lift and battery / maintenance intervals
  - - Sending box
    - Self-shipper + courier
    - Scaled niche SKU
    - Android, 4G, binocular camera, and payment-enabled self-mailing workflow
    - Need live rollout footprint and realized usage by venue type
  - - Spare-parts locker
    - Enterprise operator / field service team
    - Targeted B2B SKU
    - Supports replenishment and automatic shipping instead of passive parcel holding
    - Need customer references and reorder frequency data
  - - Post & parcel locker
    - Postal / campus / mixed-mail operator
    - Targeted mixed-mail SKU
    - Letter-density optimization with optional card reader and XS slots
    - Need evidence of adoption outside brochure copy
  - - Twin-face / Bluetooth variants
    - Takeout / retail / mobile-first users
    - Catalog extensions
    - Two-sided cell access and no-screen Bluetooth access broaden deployment options
    - Need separate deployment counts and customer examples
  - - Drone relay cabinet
    - Hospital / relay operator
    - Pilot / early deployment
    - RTK landing, auto-sorting, cloud control, and 19-slot relay design create a true air-ground transfer node
    - Need production economics, regulator approvals, and scale timeline
  notes: Rows mix mass-deployed lockers with narrower SKUs and pilot modules. Public evidence is strongest on feature definition, weaker on installed base and live customer counts by SKU.
