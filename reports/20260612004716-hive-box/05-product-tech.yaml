  evidenceGaps:
  - type: missing-source
    severity: material
    topic: network-reliability
    missingEvidence: A public uptime dashboard, formal SLA, or third-party reliability audit for the core locker estate.
    whyItMatters: Without network-wide uptime or service-level evidence, the product chapter can only score resilience from module descriptions and pilots rather than from operating proof.
    diligencePath: Request monthly locker uptime, failed-open / failed-delivery incident rates, MTTR, and any vendor or customer SLAs by cabinet cohort.
    relatedQuestionRefs:
    - QE016
    - QE022
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: Named security certifications, penetration-test summaries, or external privacy/security audit reports for locker, app, and wallet systems.
    whyItMatters: Hive Box handles identity, location, dispatch, and payment data, so certification and audit evidence would materially change the underwriting of trust controls.
    diligencePath: Request ISO 27001 / MLPS / app-security audit artifacts, incident history, and current internal control owners for privacy and application security.
    relatedQuestionRefs:
    - QE012
    - QE013
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: api-depth
    missingEvidence: A public or diligence-room API reference, authentication model, webhook set, and production integration examples for Hive Box itself.
    whyItMatters: The business claims route, waybill, and settlement integration, but the reviewed public surface does not show how deep that integration runs or how extensible it is.
    diligencePath: Request the locker-platform API documentation, partner onboarding deck, sample flows, and active partner counts by integration type.
    relatedQuestionRefs:
    - QE009
    - QE010
    - QE022
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: module-economics
    missingEvidence: Service-level adoption, order volume, and margin data for laundry, home services, storage, ad products, and reverse logistics.
    whyItMatters: The app proves these modules exist, but without module economics it is impossible to know whether they are true moats or simply monetization experiments on top of locker traffic.
    diligencePath: Request 2025-2026 GMV, order counts, repeat rates, and contribution margin by service module plus the share of residents using each module.
    relatedQuestionRefs:
    - QE008
    - QE022
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: A stronger public developer or operator community footprint such as SDK docs, repos, forums, or external integration case studies.
    whyItMatters: The chapter can satisfy the required developer-signal gate through recruiting and app-distribution proxies, but the absence of a deeper practitioner surface reduces confidence in ecosystem depth.
    diligencePath: Request partner SDK material, integration case studies, or operator community channels; otherwise document why the business intentionally keeps this surface closed.
    relatedQuestionRefs:
    - QE021
    - QE022
