companyProfile:
  summary: Hive Box is a Shenzhen-founded private last-mile logistics platform built around a very large smart parcel locker network and an adjacent software-and-services layer. Public evidence ties the company to 2015 founding roots under Xu Yubin, strong historical backing from SF-linked investors, and a business that now spans courier drop-off, consumer sending and returns, laundry, home-life, and advertising workflows. The operating footprint is real, but governance visibility, litigation clarity, and post-filing disclosure cadence remain materially weaker than the network narrative.
  foundedDate: null
  founders:
    - name: Xu Yubin
      role: Founder; chairman and CEO during the IPO-filing period
      background: Former SF courier-and-operations veteran who built Hive Box after observing overseas parcel-locker workflows.
      claimRefs:
        - CO003
        - CO004
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: Hive Box sells a 24/7 self-service smart-locker network with hardware, SaaS, open-platform APIs, consumer app flows, and adjacent modules for sending, returns, storage, and community services.
  customerFocus: Courier companies and courier outlets as core payers, residents as pickup and self-ship users, merchants and e-commerce reverse-logistics flows, advertisers, and property or public-site hosts.
  businessModel: Revenue comes from last-mile delivery fees, consumer smart-delivery services, and value-added services such as advertising and community services, with monetization increasingly shifting beyond pure courier drop-off fees.
  stage: Late-stage private, pre-IPO
  fundingStatus: Approx. US$1.08B raised across disclosed rounds; last publicly identified primary round was a US$400M strategic financing in January 2021, and the August 2024 HKEX filing lapsed in February 2025.
