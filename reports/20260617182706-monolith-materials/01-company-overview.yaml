  - id: milestones-adverse-events
    title: Scale, Milestones, and Adverse Events
    body: >-
      Monolith's timeline spans from its 2012 California founding through its transformation into the
      world's only commercial-scale plasma methane pyrolysis operator. Operationally, OC1 commissioned
      in September 2020 at a cost of approximately $100 million, producing ~14,000 metric tons per year
      of carbon black. The OC2 expansion — originally targeted for ~2026 completion — was planned to be
      13 times larger than OC1 and would have made Olive Creek the largest carbon black plant in the US.


      Adverse events include three interlocking risks: (1) Water use controversy — In June 2020, initial
      OC2 environmental disclosures cited a requirement of 2.3 to 4.6 billion gallons of groundwater per
      year, drawing community and regulator criticism; management revised the figure downward to
      450–800 million gallons per year following further engineering. (2) DOE loan cancellation risk —
      In May 2025, Semafor reported the Trump administration's plans to cancel Monolith's $953M
      conditional DOE commitment, which DOE did not confirm but also did not deny. (3) Cash shortage —
      In September 2024, Monolith was reportedly running short on cash and facing OC2 schedule delays,
      necessitating an additional equity round from existing investors.


      Despite these headwinds, investor support has been maintained across seven confirmed distinct
      financing events since founding. SEC Form D filings (CIK 0001574098) track nine exempt offering
      rounds from 2013 through 2021, confirming sustained private capital activity even before the
      landmark 2022 unicorn round. The carbon black from OC1 is now in tires across North America,
      providing the company with at least a modest commercial proof point even as OC2 remains unbuilt.
