  - calloutType: risk
    title: "Dual Adverse Signal: DOE Loan at Risk and OC2 Cash Shortage"
    body: "Monolith's OC2 expansion faces two concurrent adverse signals: (1) As of May 2025, the Trump administration was reportedly planning to cancel the $953M conditional DOE commitment, which is central to OC2 project finance; a DOE spokesperson said 'no decisions have been made' but the risk remains live. (2) In September 2024, Monolith was reportedly running short on cash and facing OC2 project delays, necessitating an emergency equity raise. If the DOE loan is formally cancelled, Monolith must source $953M in alternative debt or curtail OC2 scope significantly, threatening the entire ammonia/fertilizer business case."
    claimRefs:
