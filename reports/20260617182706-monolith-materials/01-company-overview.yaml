company:
  name: Monolith Materials
chapter:
  number: 1
  title: Company Overview
  summary: "Monolith Materials, Inc. (formerly Boxer Industries) is a Lincoln, Nebraska-based clean technology company founded in 2012 that produces carbon black and turquoise hydrogen via plasma methane pyrolysis — a process with no direct CO2 emissions. The company has raised over $570M in total equity, achieved unicorn status (≥$1B valuation) in July 2022, and received a $953M conditional DOE loan guarantee for its planned OC2 expansion, though that loan faces cancellation risk as of May 2025."

sections:
  - id: identity-business-model
    title: Identity and Business Model
    body: >-
      Monolith Materials, Inc. — commonly branded as "Monolith" — is an American clean technology company
      headquartered at 600 P Street, Suite 310, Lincoln, Nebraska 68508-2312. Originally incorporated in 2012
      as Boxer Industries in Redwood City, California, the company is incorporated in Delaware and operates
      its flagship commercial facility — Olive Creek 1 (OC1) — near Hallam, Nebraska, approximately
      25 miles southeast of Lincoln. The company moved its corporate headquarters from California to
      Nebraska in 2018, aligning the corporate center with commercial operations.


      The one-line business model: split natural gas (CH4) into solid carbon black (sold to tire and
      rubber manufacturers) and hydrogen gas (converted to anhydrous ammonia fertilizer) using electric
      plasma arc heat rather than combustion — producing no direct CO2. Monolith claims approximately 95%
      feedstock conversion efficiency versus roughly 55% for conventional furnace carbon black, which
      underpins both the economics and environmental differentiation of its technology. The current commercial
      product is specialty carbon black sold to North American tire makers; the planned co-product is
      anhydrous ammonia for Corn Belt fertilizer markets under a long-term offtake agreement with Koch Fertilizer.


      Monolith is the only company in the world currently operating plasma methane pyrolysis at commercial
      scale. OC1 produces approximately 14,000 metric tons of carbon black per year. The planned Olive Creek 2
      (OC2) expansion would add 180,000–194,000 metric tons of carbon black and 275,000 metric tons of
      anhydrous ammonia capacity annually, making OC2 the largest carbon black plant in the United States
      if completed. As of September 2024, OC2 was behind schedule and the company had been reported as
      running short on cash, though investors extended additional funding.
