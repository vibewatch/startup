  - id: hydrogen-majors-adjacent-players
    title: Hydrogen Majors and Adjacent Players
    body: >
      The broader hydrogen market is dominated by grey hydrogen produced via steam methane
      reforming (SMR). Each tonne of grey hydrogen emits 6.6–9.3 tonnes of CO2. Industrial gas
      majors—Air Products, Air Liquide, Linde—produce and distribute hydrogen at scales
      orders of magnitude larger than Monolith, but their production is greenhouse-gas-intensive.
      The DOE describes natural gas reforming as the "cost-effective near-term pathway" for
      hydrogen, with low-carbon alternatives expected to scale over the long term. Nel Hydrogen
      (Norway) has installed more than 3,800 electrolysers in 80+ countries since 1927, offering
      alkaline and PEM electrolysis for green hydrogen production. Plug Power (US) is a leading
      green hydrogen economy company with a fuel cell and electrolyser product line. Both Nel
      and Plug Power represent the green hydrogen competitive pathway: as electrolyser costs
      decline and renewable electricity prices fall, green H2 from electrolysis becomes more
      cost-competitive with turquoise H2 from pyrolysis. Clean ammonia players—including CF
      Industries, OCI Nitrogen, and Koch Fertilizer (Monolith's offtake partner)—represent the
      end-market for Monolith's hydrogen. Koch's relationship with Monolith as an offtaker
      rather than a competitor provides revenue visibility, but also limits Monolith's
      independent pricing power in the ammonia market.
