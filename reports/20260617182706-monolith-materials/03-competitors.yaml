  - id: direct-peers-turquoise-pyrolysis
    title: "Direct Peers: Turquoise and Pyrolysis Hydrogen Players"
    body: >
      Ekona Power (Vancouver, BC, Canada) is the most commercially advanced turquoise hydrogen
      peer. Ekona's pulsed-combustion methane pyrolysis platform produces both clean hydrogen
      and solid carbon without CCS infrastructure, water, or precious metals. Ekona completed
      its Gen1 Burnaby Pilot in 2025—a 200 kg-H2/day facility—and is developing its Gen2
      xCaliber reactor for commercial deployment. Ekona has raised funding from government
      sources including Natural Resources Canada and Alberta Innovates and positions itself as
      cost-competitive with grey hydrogen via the solid carbon revenue offset. Ekona's roadmap
      moves from pilot expansion to field demonstration programs to early commercial programs,
      suggesting a 2027–2029 commercial timeline. Aurora Hydrogen (Edmonton, AB) uses microwave-
      driven methane pyrolysis—an approach distinct from Monolith's thermal plasma and Ekona's
      pulsed combustion—achieving hydrogen production with no CO2, no precious metals, and no
      new infrastructure. Aurora's 200 kg-H2/day industrial-scale demonstration plant in
      Edmonton has been backed by Chevron, Shell, Williams, and Energy Innovation Capital.
      Modern Hydrogen (US) deploys pyrolysis-based decarbonisation to utilities and transit
      agencies; solid carbon is used in roads and infrastructure rather than sold to tire
      manufacturers. Modern Hydrogen partnered with CPS Energy (Texas) in July 2025 for a gas-
      to-hydrogen power pilot. Hazer Group (ASX-listed, Australia) converts natural gas into
      hydrogen and high-quality graphite—not conventional carbon black—using iron ore as a
      catalyst; KBR is Hazer's global commercialisation partner. Graforce (Germany) deploys
      Plasmacylzer® modules for methane and biomethane pyrolysis; commissioned a plant at RAG
      Austria AG producing ~50 kg H2 and ~150 kg solid carbon per hour; targets European
      industrial decarbonisation. None of these peers has reached Monolith's commercial scale
      or breadth of offtake, but they represent intensifying technology competition.
