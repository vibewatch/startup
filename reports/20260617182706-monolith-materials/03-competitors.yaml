  - id: carbon-black-incumbents
    title: Carbon Black Incumbents
    body: >
      The global carbon black market is dominated by a small number of large, well-capitalised
      producers with entrenched distribution networks and decades of customer relationships.
      Cabot Corporation (NYSE: CBT, Boston, MA) was founded in 1882 and is the world's leading
      producer of carbon black, with >36 manufacturing plants across >20 countries and
      approximately 4,500 employees. Cabot's EVOLVE Sustainable Solutions platform delivers
      lower-emission carbon black products with sustainable feedstock content, representing a
      direct response to the ESG preferences that Monolith is trying to serve. Birla Carbon
      (part of Aditya Birla Group, India) is one of the world's largest carbon black
      manufacturers, with facilities across North and South America, Europe, and Asia. Birla
      Carbon's Continua SCM (Sustainable Carbonaceous Material) product, derived from recycled
      end-of-life tires, provides a circular carbon product that competes for the same tire and
      rubber applications as Monolith's plasma-derived carbon black. Birla Carbon is pursuing
      aggressive capacity expansion in Asia—the fastest-growing carbon black market. Orion S.A.
      (NYSE: OEC) supplies carbon black from 15 plants worldwide, with a corporate heritage of
      >160 years rooted in Germany, where it operates the world's longest-running carbon black
      plant. In June 2026, Orion launched circular carbon black production in China, and its CEO
      has publicly stated that EU climate policy requiring decarbonisation of production could
      disadvantage European manufacturers versus Asian competitors. Tokai Carbon (Japan) is a
      major global carbon black producer known for acquisition-driven scale expansion. These
      incumbents compete on established customer certifications, global logistics, and price
      stability; their shift toward sustainable products directly erodes Monolith's green premium
      differentiation.
