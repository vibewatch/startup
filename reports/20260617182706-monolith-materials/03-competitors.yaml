callouts:
  - calloutType: strength
    title: Unique Commercial First-Mover in Plasma Pyrolysis
    body: >
      Monolith's OC1 facility in Nebraska is the only commercial-scale thermal plasma
      hydrocarbon pyrolysis carbon black plant in the world. No turquoise-hydrogen peer—Ekona,
      Aurora, Modern Hydrogen, or Hazer—has yet produced tire-grade carbon black at commercial
      volumes. This operational track record is the prerequisite for tire-manufacturer technical
      certifications and constitutes a multi-year head start that is difficult to replicate.
    claimRefs:
      - CP022
      - CP021

  - calloutType: risk
    title: Carbon Black Incumbents Rapidly Closing the Sustainability Gap
    body: >
      Cabot, Birla Carbon, and Orion S.A. are all investing in sustainable and circular carbon
      black products—Cabot's EVOLVE platform, Birla's Continua SCM from recycled tires, and
      Orion's China circular CB launch in June 2026. As these products scale, the sustainability
      premium available to Monolith's plasma carbon black may compress, removing a key revenue
      justification for the higher capex of its pyrolysis process versus conventional furnace black.
    claimRefs:
      - CP026
      - CP027
      - CP034

  - calloutType: risk
    title: DOE Loan Cancellation Risk Creates Financing Cliff
    body: >
      As of May 2025, the Trump administration planned to cancel 7 DOE conditional clean-energy
      loan commitments, including Monolith's $953M conditional guarantee (Semafor report). The
      DOE stated "no decisions have been made." If cancelled, Monolith would face a significant
      financing gap for OC2 construction, at a time when September 2024 reporting already
      flagged the company as "running short on cash and facing project delays."
    claimRefs:
      - CP023
      - CP038

  - calloutType: insight
    title: Dual-Product Co-Economics Are Structurally Defensible
    body: >
      Unlike single-product green-hydrogen competitors (Nel, Plug Power) and single-product
      carbon-black incumbents (Cabot, Orion), Monolith's co-production model creates a revenue
      cross-subsidy that improves unit economics for both outputs. Ekona and Aurora are pursuing
      a similar dual-product logic, but Monolith has demonstrated this model at commercial scale.
      The economic case for methane pyrolysis is strengthened by the solid-carbon offset
      reducing effective H2 production cost below that of blue hydrogen (which bears CCS capex).
    claimRefs:
      - CP033
      - CP030
      - CP011

