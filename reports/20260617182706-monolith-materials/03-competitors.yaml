    type: quadrant
    layout: wide
    summary: >
      Monolith (OC1) occupies the upper-right quadrant (high decarbonisation + commercial
      operations), uniquely straddling clean credentials and production reality. Carbon black
      incumbents are mature at scale but lack clean process credentials. Turquoise H2 peers are
      highly decarbonised but pre-commercial. Green H2 electrolysis (Nel, Plug Power) offers
      maximum decarbonisation but limited commercial carbon black equivalent.
