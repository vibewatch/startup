    title: "Concentrated Revenue Dependency on Koch Fertilizer"
    body: "Koch Fertilizer is the sole publicly disclosed ammonia offtake customer for OC2. This represents a structurally dangerous customer concentration for a first-of-kind facility with no track record at OC2 scale. Investors should request the full Koch offtake contract including volume commitments, pricing mechanisms, termination provisions, and force-majeure clauses before finalizing any investment decision."
