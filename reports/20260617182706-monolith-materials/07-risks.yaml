chapter:
  number: 7
  title: Risks
  summary: "Monolith faces an existential near-term risk from potential cancellation of its $953M DOE conditional loan guarantee—its primary OC2 financing mechanism—compounded by cash shortfalls reported in September 2024, unprecedented plasma-reactor scale-up to roughly 14× OC1 capacity, single-customer ammonia concentration with Koch Fertilizer, and a key-person dependency on CEO Rob Hanson; the aggregate residual risk profile is high and the investment thesis rests heavily on resolving DOE financing under an adversarial regulatory environment before capital is deployed."

sections:
  - id: regulatory-legal-risks
    title: Regulatory and Legal Risks
    body: >-
      The single largest risk to Monolith's investment thesis is cancellation of the $953 million conditional loan guarantee committed by the DOE in December 2021 under Title 17 Section 1703 of the Energy Policy Act of 2005. As of May 2025, Semafor reported that the Trump administration's Department of Energy—now rebranded as the Office of Energy Dominance Financing (EDF)—was planning to cancel seven conditional commitments for clean energy, with Monolith explicitly named. Reason.com described Monolith as one of three companies expected to lose federal green energy loan backing. DOE's spokesperson stated "no decisions have been made" but the political risk remains acute given the administration's stated posture toward clean-energy subsidies. The conditional nature of the loan means Monolith must satisfy due-diligence milestones, project readiness benchmarks, and financial conditions before funds are disbursed; failure to meet any condition could also constitute a self-cancellation event independent of political decisions.

      Beyond the DOE loan, construction and operation of OC2 in Nebraska requires multiple layers of environmental permitting. Under the federal Clean Air Act, new major stationary sources of air pollution must obtain pre-construction permits through New Source Review (NSR), and industrial facilities emitting above major-source thresholds must obtain Title V operating permits administered at the state level by the Nebraska Department of Environment and Energy (NDEE). Permit delays, denials, or additional conditions could materially extend OC2's timeline or require costly emission-control modifications. Monolith's proprietary plasma technology has no direct regulatory precedent for air-permit purposes, meaning regulators may require additional environmental review or impose novel conditions. Intellectual-property and patent risk is relatively lower for a vertically integrated process technology company, but trade-secret exposure and potential patent challenges from emerging pyrolysis competitors (C-Zero, Aurora Hydrogen, Hazer Group) represent latent legal exposure.
    claimRefs:
      - CR001
      - CR002
