    body: "Cancellation of Monolith's $953M conditional loan guarantee by the Trump administration's DOE (now EDF) would eliminate the primary OC2 financing mechanism. Without a replacement, Monolith would need to raise $953M+ from private markets at terms likely to be highly dilutive or impossible in current climate-tech conditions. This is the single highest-priority diligence item and should be tracked in real time via DOE announcements and Monolith investor communications."
