  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Monolith Materials competes across two inter-linked markets: carbon black (where it sells the solid-carbon
              co-product of its plasma pyrolysis process) and clean hydrogen (where it produces turquoise hydrogen for
              conversion to ammonia). These two markets have distinct incumbent structures. In carbon black, three to
              four global conglomerates—Cabot Corporation, Birla Carbon, Orion S.A., and Tokai Carbon—collectively
              control the majority of global production capacity, with Asia Pacific accounting for roughly 63% of a $22
              billion market. In hydrogen, the status quo is grey hydrogen from steam methane reforming (SMR), which is
              produced at hundreds of facilities globally and priced at approximately $1–2 per kilogram before carbon
              externalities; electrolysis-based green hydrogen (Nel, Plug Power, ITM Power) represents the aspirational
              substitute while blue hydrogen (SMR + carbon capture) is the incremental decarbonisation alternative
              favoured by industrial gas majors like Air Products, Air Liquide, and Linde. Turquoise hydrogen via
              methane pyrolysis is pursued by several venture-backed startups including Ekona Power (Vancouver), Aurora
              Hydrogen (Edmonton), Modern Hydrogen (Seattle), Hazer Group (ASX), and Graforce (Berlin), though none has
              reached commercial scale. Likely entrants include existing industrial gas majors licensing pyrolysis
              technology, and chemical companies with natural gas assets seeking on-site hydrogen and carbon black
              production.
            claimRefs:
              - CP001
              - CP004
