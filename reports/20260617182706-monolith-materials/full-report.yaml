      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >
              Monolith has raised more than $570M in disclosed equity (canonical figure), with the third-party tracker
              Tracxn citing approximately $593M across 15 rounds since the company's founding in 2012 as Boxer
              Industries. The most recent disclosed event was a September 2024 round of "more than $300 million" from
              existing investors—Azimuth Capital, Cornell Capital, Decarbonization Partners, TPG Rise Climate, and
              Warburg Pincus—without introducing new institutional backers. This structure, combined with the
              cash-shortage reporting preceding the announcement, is consistent with a protective bridge from an
              incumbent syndicate rather than a market-tested new-investor round.


              Monolith's SEC EDGAR filing record shows nine Form D notices from 2015 through June 2021 (the most recent
              is for a $120M round). No Form D was filed for the July 2022 $300M raise or the September 2024 $300M+
              raise. This absence limits third-party verification of security type, share price, and implied post-money
              valuation. Combined with no public revenue or EBITDA disclosures, the valuation evidence is almost
              entirely inference-based: CB Insights awarded unicorn status in 2022, and the Reason.com article confirmed
              a stated valuation "over $1 billion in 2022." Whether value has been maintained, grown, or internally
              marked down since is unknown.


              The $953M DOE conditional loan guarantee, announced December 2021 and reaffirmed through the 2022
              BusinessWire announcements, was the primary financing pillar for OC2. If cancelled, Monolith would need to
              replace nearly $1B of committed project finance through private markets—an unlikely feat without
              significant dilution in the current climate-tech capital environment, especially given CF-tech multiple
              compression since 2022.


              Entry discipline demands full diligence on (a) actual post-money cap-table, preference stack, and
              liquidation waterfall; (b) OC1 operating cash flow and burn; (c) OC2 CapEx commitment and timeline with or
              without DOE funding; and (d) the current status of DOE negotiations.
