            completion delayed, timing uncertain as of 2026
          tone: risk
        - label: 6. Expansion / Repeat
          detail: >-
            Land-and-expand: additional tire grades (battery CB, specialty), additional Corn Belt distributors; SK/MHI
            commercial deployment in Asia (no agreement yet)
          tone: neutral
