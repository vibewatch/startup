companyProfile:
  summary: >-
    Monolith Materials, Inc. ('Monolith') is a Lincoln, Nebraska clean-technology company founded in 2012 (originally
    Boxer Industries). It operates a proprietary plasma methane-pyrolysis process that converts natural gas into clean
    'turquoise' hydrogen and solid carbon black with no direct CO2 emissions. Its Olive Creek 1 (OC1) facility near
    Hallam, Nebraska is the world's only commercial-scale plasma-pyrolysis carbon black plant (~14,000 t/yr); a much
    larger OC2 expansion is planned. Monolith has raised $570M+ in equity (including a $300M+ September 2024 round led
    by TPG Rise Climate and Decarbonization Partners) and holds a $953M DOE Title 17 conditional loan guarantee that, as
    of 2025, is reportedly at risk of cancellation. The company has faced reported cash-flow pressure and project
    delays.
