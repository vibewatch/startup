      - number: '7.2'
        title: Operational and Technology Risks
        blocks:
          - type: paragraph
            body: >-
              The most severe operational risk is failure to scale plasma pyrolysis from OC1's ~14,000 metric tons per
              year of carbon black to OC2's planned ~180,000–194,000 metric tons per year—a roughly 14× expansion with
              no direct industry precedent at commercial scale. Power Magazine's analysis of the DOE loan noted that
              Title XVII requires "new or significantly improved technologies," underscoring the technology's novelty
              and the scale-up uncertainties recognized even by its government sponsor. Each OC2 production unit adds
              additional plasma reactors with complex high-temperature process management, increasing the probability of
              systematic engineering challenges that may not be apparent in OC1 operations. Construction of OC2 also
              introduces significant execution risk: the CBC article noted an original completion target of
              approximately 2025 that has not been met, suggesting schedule slippage has already occurred.

              Natural gas is Monolith's primary feedstock and its largest variable cost driver. The EIA reports that
              Henry Hub spot prices rose from $3.12/MMBtu to $4.98/MMBtu during a single week in January 2026,
              illustrating significant short-term price volatility. Industrial natural gas users in the Midwest face
              additional basis differentials. Monolith has not publicly disclosed natural gas price hedging, fixed-price
              purchase agreements, or pass-through provisions in customer contracts. A sustained 50% increase in natural
              gas prices would materially compress hydrogen and carbon black margins, potentially eliminating
              profitability before OC2 achieves nameplate capacity. Carbon black product quality consistency is also a
              risk: specialty tire-grade carbon black requires narrow specification compliance, and any batch
              variability from the plasma process could trigger customer quality-hold events, contract penalties, or
              loss of qualification at major tire manufacturers.

              Hydrogen safety is an inherent operational risk: hydrogen has a wide flammability range (approximately
              4–75% in air), very low ignition energy, and poses explosion and fire hazards at production scale. The
              DOE-sponsored H2 Tools portal identifies industrial hydrogen facilities as requiring rigorous safety
              management systems, codes compliance (NFPA 2), and incident response planning. An incident at OC1 or
              during OC2 construction could trigger regulatory investigation, operational shutdowns, reputational
              damage, and material liability.
