            body: >
              Monolith addresses two structurally distinct end markets through its plasma pyrolysis process. The first
              is the carbon black market — a global commodity used primarily in tire and rubber manufacturing (~70% of
              consumption), with additional applications in specialty coatings, inks, batteries, and mechanical rubber
              goods. Current OC1 output (~14,000 metric tons/year) is sold into the North American tire supply chain.
