      - number: '1.3'
        title: Funding History and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Monolith has raised over $570 million in total equity financing across multiple rounds since 2012, making
              it one of the most heavily capitalized private clean technology companies in the turquoise hydrogen and
              carbon black sectors. Early investors — Cornell Capital, Warburg Pincus, and Azimuth Capital Management —
              backed the company from its early rounds, and by October 2020 Monolith had raised approximately $274
              million. Strategic investors Mitsubishi Heavy Industries (December 2020) and SK Inc. / NextEra Energy
              (June 2021) subsequently joined the cap table, validating the technology's appeal to Asian industrials and
              US energy utilities.


              In July 2022, Monolith closed a pivotal $300 million equity round led by TPG Rise Climate and
              Decarbonization Partners (a joint venture between BlackRock and Temasek Holdings), alongside Warburg
              Pincus and Cornell Capital. This round elevated Monolith's valuation above $1 billion, conferring unicorn
              status. In September 2024, the same existing investor consortium closed an additional round exceeding $300
              million — though press and third-party sources reported that the company was running short on cash and
              facing delays at OC2, making this round partly a defensive extension of runway.


              In December 2021, Monolith received a conditional loan guarantee commitment of $953 million from the U.S.
              Department of Energy Loan Programs Office (DOE LPO) under Title 17, Section 1703 of the Energy Policy Act
              of 2005. This was the DOE's first non-nuclear conditional loan in years and the linchpin of OC2 project
              finance. As of May 2025, the Trump administration was reportedly planning to cancel this commitment along
              with six other clean energy conditional commitments; a DOE spokesperson stated that "no decisions have
              been made." The formal status of this loan as of June 2026 is unknown, creating material uncertainty for
              the OC2 business case. Monolith's valuation has never been precisely disclosed; the $1B unicorn threshold
              established in July 2022 is the floor. Revenue is not publicly disclosed.
