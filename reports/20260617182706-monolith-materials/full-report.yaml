      commitment across Monolith's two product streams.
    data:
      nodes:
        - label: 1. Market Awareness
          detail: >-
            OEM sustainability mandates and supply-chain resilience concerns drive interest in low-emission carbon black
            and clean ammonia
          tone: neutral
        - label: 2. Technical Evaluation
          detail: >-
            Tire buyers test carbon black grades (GreenBlack/Bolt/True) against OEM tire specifications; fertilizer
            buyers assess NH3 quality vs. conventional
          tone: neutral
        - label: 3. Agreement / LOI
          detail: >-
            Goodyear signed collaboration agreement Dec 2021; unnamed second tire maker signed LOI; Koch Fertilizer
            signed long-term offtake July 2022
          tone: positive
        - label: 4. OC1 Trial Supply (CB)
          detail: >-
            Monolith supplies ~14,000 t/yr CB from OC1 to North American tire manufacturers including Goodyear;
            qualification confirmed by 2023 tire launch
          tone: positive
        - label: 5. OC2 Production Scale
          detail: >-
