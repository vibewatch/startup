      - number: '8.5'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Monolith's exit readiness is early. No IPO filings, no disclosed banker engagement, and no
              secondary-market transaction data are publicly known. The company remains private with a concentrated cap
              table. Potential exit paths include: (a) strategic acquisition by a major carbon-black producer (Cabot,
              Birla Carbon) or industrial-gas company (Air Products, Linde, Air Liquide) seeking turquoise-hydrogen
              capacity; (b) IPO once OC2 is operational and revenue is material; or (c) continuation via further private
              rounds or project-finance refinancing after DOE loan resolution.


              A strategic acquirer would likely value the platform at a premium to OC1's stand-alone value but might
              significantly discount OC2 option value given regulatory uncertainty. An IPO is 3–5 years away at minimum
              under base-case assumptions. Secondary liquidity for early investors is limited without a defined exit
              event.


              Given the evidence gaps—undisclosed exact valuation, no Form D for recent rounds, no public revenue
              figures, unresolved DOE status, and unknown preference stack—the chapter's firm recommendation is
              **research-more**. Specific diligence actions that would materially change the call: (1) Confirm OC1
              EBITDA and carbon-black realized price; (2) Obtain cap-table and liquidation waterfall analysis; (3)
              Clarify DOE decision timeline; (4) Inspect OC2 CapEx budget and financing plan without DOE guarantee; (5)
              Assess management retention and succession given 14-year tenure of CEO Rob Hanson.
