  - id: FE001
    title: Monolith Plasma Pyrolysis Product Architecture Stack
    type: stack
    layout: standard
    summary: Six-layer process architecture from feedstock supply through finished products at the Olive Creek facility.
    data:
      layers:
        - label: Feedstock Supply
          detail: >-
            Natural gas (primary CH4 source); carbon black oil (CBO) as alternative feedstock; pipeline-connected to
            Olive Creek site
        - label: Plasma Power System
          detail: >-
            DC plasma torches with concentric graphite electrodes; hydrogen as plasma-forming gas; renewable electricity
            via RECs; power supply >2× average operating voltage for torch stability
        - label: Plasma Reactor / Cracking Zone
          detail: >-
            High-temperature zone >800°C; CH4 → C + 2H₂; aerodynamic feedstock injection; no oxygen; no combustion;
            reaction zone does not contact wall surfaces; quench-cooling downstream
        - label: Separation & Conditioning
          detail: >-
            Solid carbon (carbon black) collected and pelleted; H₂ gas stream separated; carbon black classified by
            grade; water cooling system (420M gal/yr permit for OC2)
        - label: Downstream Processing
          detail: >-
            Carbon black graded into GreenBlack®, Bolt™, True™, Core®; H₂ compressed for on-site energy (OC1) or piped
            to Haber–Bosch unit (OC2); N₂ from air separation combined with H₂ → NH₃
        - label: Products & Markets
          detail: >-
            Carbon black → tire/rubber/specialty/battery markets (Goodyear, North American OEMs); clean ammonia → Corn
            Belt fertilizer markets (Koch Fertilizer offtake); clean H₂ → energy co-product
    claimRefs:
      - CE001
      - CE005
      - CE014
      - CE016
