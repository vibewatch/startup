      - number: '8.3'
        title: Public Comparable and Private Round Analysis
        blocks:
          - type: paragraph
            body: >
              Monolith occupies an unusual space that spans two public comp sets: carbon-black specialty chemicals
              (Cabot CBT, Orion OEC) and clean hydrogen/industrial gas (Plug Power PLUG, Air Products APD, Linde LIN).
              No single public company matches its dual-product, early-commercial, heavy-CapEx profile; the closest
              analogue in the private domain is C-Zero, which raised a $50M Series B in May 2022 for methane pyrolysis—a
              much earlier-stage company.


              Carbon-black comparables suggest modest revenue multiples. Cabot Corporation, the global
              specialty-chemicals and carbon-black leader, trades at roughly 1.15× trailing revenue (~$4.6B market cap
              on ~$4.0B revenue). Orion S.A.—a purer carbon-black play—trades at a deep discount (~$436M market cap, EPS
              negative, in financial distress). At OC1's estimated $14–20M annual carbon-black revenue, even a generous
              3–5× premium-to-Cabot P/S implies a carbon-black-segment value of only $42–100M.


              Hydrogen comparables are more supportive of a stretched multiple. Plug Power traded at ~23× EV/revenue on
              $164M LTM revenue, reflecting market patience for clean-hydrogen scale-up. Air Products and Linde are
              large integrated industrial-gas companies with fundamentally different earnings quality. BNEF notes that
              turquoise hydrogen can approach cost parity with grey hydrogen at scale, supporting a long-run premium.
              But Monolith is not yet at that scale.


              The honest comp-set conclusion: Monolith's $1B+ valuation is defensible only as an option on OC2, priced
              at peak 2021-22 clean-energy venture multiples. The CB Insights unicorn market map shows 1,276 unicorns
              globally as of 2026, many facing multiple compression. Climate-tech venture funding has been under
              pressure since 2023. Monolith's unicorn tag is legacy, not current-market-confirmed.
