      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large, Established Carbon Black Market with Low-Carbon Niche Tailwind
            body: >
              Carbon black is a $25.95 billion market (2026) with a well-understood buyer base concentrated in a small
              number of global tire OEMs. The low-carbon niche within this market is growing as Scope 3 reporting
              mandates and EU due-diligence regulation make low-emission inputs commercially valuable. Monolith's plasma
              process produces certified low-emission carbon black — a differentiated position in a commodity-dominant
              market where only a handful of players are pursuing the low-carbon pathway.
            calloutType: strength
            claimRefs:
              - CM009
              - CM023
              - CM032
          - type: callout
            title: Clean Hydrogen Demand Gap — 38 Mt Announced vs 12–18 Mt Expected by 2030
            body: >
              The Hydrogen Council's 2023 project-tracking survey documents a 50–70% attrition gap between announced
              clean hydrogen capacity (38 Mt/yr by 2030) and realistic deployment (12–18 Mt/yr). Regulatory uncertainty
              around IRA 45V, higher-than-expected costs, and macroeconomic headwinds are cited as contributors.
              Monolith's hydrogen and ammonia revenue depends on this market developing; the attrition gap suggests the
              overall clean hydrogen demand signal is less reliable than headline announcement figures imply.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM037
              - CM038
          - type: callout
            title: Dual-Product Model Creates Natural Market Hedge
            body: >
              Monolith's plasma pyrolysis simultaneously produces carbon black (established $26B commodity market) and
              hydrogen (nascent clean energy market). This dual-product structure means that carbon black revenues can
              subsidise hydrogen infrastructure investment while demand for clean hydrogen scales. The hedge is
              imperfect — both products use the same feedstock (natural gas) and share the same capital project — but
              the carbon black market provides a nearer-term, more certain revenue anchor than turquoise hydrogen alone.
            calloutType: insight
            claimRefs:
              - CM006
              - CM009
              - CM012
          - type: callout
            title: Turquoise Hydrogen Niche Market Not Independently Sized
            body: >
              No major market research publisher (Mordor, Allied, Precedence, IEA) publishes a separate market-size
              estimate for turquoise hydrogen specifically. Published clean hydrogen figures aggregate all low-emission
              pathways (green, blue, and turquoise). The turquoise hydrogen SOM estimate of $1–5 billion by 2031 in this
              chapter is a residual inferred figure. Investors should treat this figure as directional only and request
              Monolith's own market-sizing methodology for the turquoise niche.
