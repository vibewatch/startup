      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Robert (Rob) J. Hanson has served as co-founder and CEO since the company's founding in 2012. His
              background includes prior experience at AREVA Solar, where he worked on concentrated solar power before
              pivoting to clean chemicals. Hanson is the public face and driving commercial force behind Monolith's
              technology and fundraising; he signed the 2020 and 2021 SEC Form D filings as President.


              The second co-founder's identity is a verified conflict in available sources. Wikipedia (citing a 2013
              Silicon Valley Business Journal article) and Crunchbase identify Pete Johnson as the co-founder alongside
              Hanson. However, the engagement brief for this report named Cody Finke as the second co-founder. These two
              accounts disagree, and no independent source was found that names Cody Finke in connection with Monolith's
              founding. This discrepancy must be resolved through direct inquiry with the company before propagating any
              founder identity claim to later chapters.


              On board governance, the only publicly identified independent board member is Bob Kerrey — former U.S.
              Senator from Nebraska (1989–2001) and 35th Governor of Nebraska (1983–1987) — who joined Monolith's board
              in 2019. Kerrey's presence provides policy access and Nebraska community credibility. No other board
              members have been confirmed through public sources, suggesting high key-person dependence at the CEO level
              and an opaque governance structure. No Chief Operating Officer, Chief Financial Officer, or Chief
              Technology Officer has been identified in public sources, indicating strategic authority is heavily
              concentrated in Hanson.
