              applications), True (high-purity specialty), and Core (general purpose) — enabling segmentation by
              application and specification. The second end market is clean ammonia / fertilizer, targeted at the US
              Corn Belt (Iowa, Illinois, Indiana, Nebraska, and adjacent states), which collectively imports more than
              1.7 million metric tons per year of anhydrous ammonia. OC2 is expected to produce approximately 275,000
              metric tons per year of ammonia, partially addressing this domestic supply deficit. Strategic
              investor-partners SK Inc. (South Korea) and Mitsubishi Heavy Industries (Japan) represent a third category
              — industrial conglomerates with potential commercial interest in hydrogen and carbon black technology
              deployment across their broader operations — but no commercial offtake agreement with either has been
              publicly disclosed. Geography is currently concentrated in the US Corn Belt and domestic tire supply
