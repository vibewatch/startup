            title: Unique Commercial First-Mover in Plasma Pyrolysis
            body: >
              Monolith's OC1 facility in Nebraska is the only commercial-scale thermal plasma hydrocarbon pyrolysis
              carbon black plant in the world. No turquoise-hydrogen peer—Ekona, Aurora, Modern Hydrogen, or Hazer—has
              yet produced tire-grade carbon black at commercial volumes. This operational track record is the
              prerequisite for tire-manufacturer technical certifications and constitutes a multi-year head start that
              is difficult to replicate.
            calloutType: strength
            claimRefs:
              - CP022
