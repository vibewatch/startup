            title: First-Mover at Commercial Scale in Plasma Methane Pyrolysis
            body: >-
              Monolith is the only company globally operating plasma methane pyrolysis for carbon black at commercial
              scale, with OC1 running since September 2020. This provides real operational data — not just pilot or lab
              evidence — that creates a moat over competitors still in development. The process achieves approximately
              95% feedstock conversion versus approximately 55% for conventional furnace carbon black, and produces no
              direct CO2. The OC1 track record is the company's most defensible commercial and technical asset.
