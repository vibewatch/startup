  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Monolith Materials, Inc. — commonly branded as "Monolith" — is an American clean technology company
              headquartered at 600 P Street, Suite 310, Lincoln, Nebraska 68508-2312. Originally incorporated in 2012 as
              Boxer Industries in Redwood City, California, the company is incorporated in Delaware and operates its
              flagship commercial facility — Olive Creek 1 (OC1) — near Hallam, Nebraska, approximately 25 miles
              southeast of Lincoln. The company moved its corporate headquarters from California to Nebraska in 2018,
              aligning the corporate center with commercial operations.


              The one-line business model: split natural gas (CH4) into solid carbon black (sold to tire and rubber
              manufacturers) and hydrogen gas (converted to anhydrous ammonia fertilizer) using electric plasma arc heat
              rather than combustion — producing no direct CO2. Monolith claims approximately 95% feedstock conversion
              efficiency versus roughly 55% for conventional furnace carbon black, which underpins both the economics
              and environmental differentiation of its technology. The current commercial product is specialty carbon
              black sold to North American tire makers; the planned co-product is anhydrous ammonia for Corn Belt
              fertilizer markets under a long-term offtake agreement with Koch Fertilizer.


              Monolith is the only company in the world currently operating plasma methane pyrolysis at commercial
              scale. OC1 produces approximately 14,000 metric tons of carbon black per year. The planned Olive Creek 2
              (OC2) expansion would add 180,000–194,000 metric tons of carbon black and 275,000 metric tons of anhydrous
              ammonia capacity annually, making OC2 the largest carbon black plant in the United States if completed. As
              of September 2024, OC2 was behind schedule and the company had been reported as running short on cash,
              though investors extended additional funding.
