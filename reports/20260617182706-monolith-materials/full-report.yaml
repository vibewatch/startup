      - number: '5.3'
        title: Facility Map and Scale-Up Roadmap
        blocks:
          - type: paragraph
            body: >
              Monolith's Olive Creek 1 (OC1) facility in Hallam, Nebraska became the first commercial-scale methane
              pyrolysis plant in the world when it began production in September 2020. OC1 was designed and built with
              Fagen Inc. as the engineering, procurement, and construction (EPC) contractor and has a nameplate carbon
              black capacity of approximately 14,000 metric tons per year. The facility runs entirely on renewable
              electricity sourced via renewable energy certificates (RECs) and produces clean hydrogen as a co-product
              that is converted into steam and electricity to serve local energy consumers.

              The planned Olive Creek 2 (OC2) expansion—announced in 2020 and intended to be constructed by Kiewit with
              front-end engineering and design (FEED) work already completed—would add approximately 180,000– 194,000
              metric tons per year of carbon black capacity and include a 275,000 metric ton per year clean ammonia
              synthesis unit. OC2 would make Monolith the largest carbon black producer in the United States. As of the
              September 2024 funding round, Monolith confirmed ongoing commercial operations at OC1 and its intent to
              advance toward OC2 expansion; however, the Wall Street Journal reported in the same period that the
              company was running short on cash and facing project delays. The DOE conditional loan guarantee of $953
              million (Title XVII), originally announced in December 2021, was named in May 2025 reports as one of seven
              conditional commitments the Trump administration planned to cancel—creating a material risk to the OC2
              financing plan. Monolith's 2026 corporate materials describe readiness to "grow at its Nebraska site with
              a planned advanced manufacturing campus," indicating OC2 intent persists but a firm construction start
              date is not publicly confirmed.
