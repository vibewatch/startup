            title: Carbon Black Incumbents Rapidly Closing the Sustainability Gap
            body: >
              Cabot, Birla Carbon, and Orion S.A. are all investing in sustainable and circular carbon black
              products—Cabot's EVOLVE platform, Birla's Continua SCM from recycled tires, and Orion's China circular CB
              launch in June 2026. As these products scale, the sustainability premium available to Monolith's plasma
              carbon black may compress, removing a key revenue justification for the higher capex of its pyrolysis
              process versus conventional furnace black.
            calloutType: risk
            claimRefs:
