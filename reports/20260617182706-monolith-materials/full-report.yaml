  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Plasma Methane Pyrolysis: Technology Architecture'
        blocks:
          - type: paragraph
            body: >
              Monolith's core process is thermal plasma methane pyrolysis, which uses direct-current (DC) plasma torches
              powered by renewable electricity to generate a high-temperature plasma jet exceeding 800°C. Natural gas
              (methane, CH4) is injected into the plasma reaction zone where aerodynamic and electromagnetic forces
              drive intense rapid mixing between the plasma gas and feedstock. With no oxygen present, no combustion
              occurs; the CH4 molecules split thermally into solid carbon and hydrogen gas (CH4 → C + 2H2). The solid
              carbon is collected, conditioned, and processed into commercial-grade carbon black. The hydrogen
              co-product is separated and can either feed energy systems on-site or, in the planned OC2 expansion, be
              converted to ammonia via the Haber–Bosch process.

              The plasma torch design employs two concentric cylinder graphite electrodes with hydrogen as the plasma-
              forming gas. A power supply set to at least twice the average operating voltage maintains torch stability,
              with an ignition pulse voltage of at least 20 kilovolts. The reactor is designed so that the reaction zone
              does not immediately contact any wall surfaces, and the products are quench-cooled to preserve carbon
              black morphology. Monolith claims ~95% feedstock conversion efficiency versus ~55% for conventional
              oil-furnace carbon black processes, uses ~50% less fossil fuel feedstock for equivalent carbon black
              output, consumes 40% less water, requires 50% less land, and achieves up to 80% lower CO2, SOx, and NOx
              emissions compared with traditional furnace black manufacturing. The modular design of each production
              unit (called a "train") enables incremental capacity growth by replicating the end-to-end footprint at the
              same site.
