            title: DOE Loan Cancellation Risk Creates Financing Cliff
            body: >
              As of May 2025, the Trump administration planned to cancel 7 DOE conditional clean-energy loan
              commitments, including Monolith's $953M conditional guarantee (Semafor report). The DOE stated "no
              decisions have been made." If cancelled, Monolith would face a significant financing gap for OC2
              construction, at a time when September 2024 reporting already flagged the company as "running short on
              cash and facing project delays."
            calloutType: risk
            claimRefs:
              - CP023
              - CP038
          - type: callout
            title: Dual-Product Co-Economics Are Structurally Defensible
            body: >
              Unlike single-product green-hydrogen competitors (Nel, Plug Power) and single-product carbon-black
              incumbents (Cabot, Orion), Monolith's co-production model creates a revenue cross-subsidy that improves
              unit economics for both outputs. Ekona and Aurora are pursuing a similar dual-product logic, but Monolith
              has demonstrated this model at commercial scale. The economic case for methane pyrolysis is strengthened
              by the solid-carbon offset reducing effective H2 production cost below that of blue hydrogen (which bears
              CCS capex).
