      - number: '8.4'
        title: Scenario Analysis and Valuation Ranges
        blocks:
          - type: paragraph
            body: >
              Three scenarios frame Monolith's investment value. In the **bull case**, OC2 is completed by 2028–29 with
              a replacement financing package or reinstated DOE loan. Full-capacity revenues reach ~$300–350M annually
              (180,000 MT carbon black × ~$1,100/MT + 275,000 MT ammonia × ~$400/MT). At a 3–4× EV/revenue multiple
              consistent with climate-tech growth premium, enterprise value reaches $900M–$1.4B. After preference stack
              and dilution, common-equity returns are 1–2× on current $1B entry. This is a "capital preservation"
              outcome, not venture-scale.


              In the **base case**, the DOE loan is delayed or partially replaced; OC2 is built in phases over 5–7
              years. Revenue ramps to $100–200M by 2030. At 2–3× EV/revenue, enterprise value is $200–600M. Preference
              overhang from $570M raised (plus accrued dividends if any) likely wipes out most common equity gains. A
              bridge round at potentially lower implied valuation triggers a technical down-round.


              In the **bear case**, the DOE loan is formally cancelled. Monolith cannot raise OC2 capital on acceptable
              terms. OC1 continues but generates insufficient cash flow to fund expansion; the company either sells
              assets or enters a distressed recap. Enterprise value at OC1 alone (using 5× estimated $17M revenue =
              $85M) suggests significant impairment vs. $1B+ entry. Principal at-risk.


              Probability weights (highly uncertain): bull 20%, base 45%, bear 35%. Weighted EV: ~$450M vs $1B+ ask.
              This underpins the "stretched" valuation stance.
