      - number: '7.4'
        title: Mitigation Framework and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Investors and stakeholders should monitor a defined set of leading indicators and thesis-break triggers
              across the four risk categories. On the regulatory front, the most critical near-term observable is any
              formal announcement from DOE's Office of Energy Dominance Financing regarding the status of Monolith's
              conditional commitment. A formal cancellation notice triggers an immediate portfolio reassessment because
              Monolith has no disclosed equivalent replacement facility; the company would need to raise $953M+ in
              private capital or significantly downscale OC2 plans. Conversely, conversion of the conditional commitment
              to a closed loan would be a major de-risking event. Pre-construction air permit applications filed with
              Nebraska NDEE, and their approval or denial, are another trackable regulatory signal.

              Operational monitoring should focus on OC2 construction progress announcements: any announcement
              confirming substantial completion milestones, equipment orders, or site preparation progress reduces
              scale-up uncertainty. The absence of such announcements beyond 2026 would signal further delay. Natural
              gas price monitoring via EIA Henry Hub data provides a real-time feedstock cost proxy; sustained prices
              above $5/MMBtu warrant immediate margin stress modeling. Carbon black spot prices (N330 grade) below
              $800/metric ton for two consecutive quarters would represent meaningful margin compression for a
              premium-priced turquoise product facing conventional competition.

              The key-person risk to Rob Hanson should be monitored via LinkedIn, press releases, and any company
              communications. The partner risk around Koch concentration should be monitored by tracking whether
              Monolith announces any additional ammonia offtake agreements; the absence of diversification by OC2
              commercial operations significantly concentrates revenue. The financial kill criterion is straightforward:
              if Monolith requires an emergency dilutive capital raise (>50% dilution) or converts to bridge debt
              financing, the equity return profile is materially impaired. Investors seeking to diligence these risks
              should request: the full DOE conditional commitment term sheet; OC2 construction contract terms and
              completion guarantees; natural gas supply agreements; Koch offtake contract terms including termination
              provisions; and a confirmed succession plan for executive leadership.
