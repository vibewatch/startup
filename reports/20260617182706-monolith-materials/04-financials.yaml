  - id: capital-adequacy
    title: Capital Adequacy and Financing Architecture
    body: >
      Monolith has raised more than $570M in equity financing across multiple rounds since its founding in 2012 (formerly Boxer Industries). The funding history includes a July 2022 round of $300M and a September 2024 round of $300M+ from existing investors including TPG Rise Climate, Decarbonization Partners, Warburg Pincus, Cornell Capital, and Azimuth Capital Management. The September 2024 raise came amid reports — citing the Wall Street Journal — that the company was "running short on cash and facing project delays," implying the round was at least partially emergency-driven rather than purely opportunistic.

      The company holds no publicly disclosed bank debt or project-finance facilities separate from the DOE conditional loan guarantee. The DOE Title 17 $953M conditional commitment was announced in December 2021 and has not been reported as formally closed into a final loan agreement. As of May 2025, the Trump administration was reported to be planning to cancel seven clean-energy conditional commitments including Monolith's, though DOE stated "no decisions have been made." If the DOE loan is cancelled, Monolith would face a financing gap estimated in the hundreds of millions of dollars for OC2 construction, requiring a replacement of federal leverage with commercial project finance or additional equity.

      Cash on hand is undisclosed, as is the monthly burn rate. The company's fractional CFO and recent leadership transition (Russell Webb as CEO, replacing Rob Hanson who co-founded the company in 2012) add uncertainty to financial management continuity. The full round-by-round chronology is detailed in the Company Overview chapter; this chapter mints local claims for capital adequacy metrics needed to assess forward runway and next-round triggers.
