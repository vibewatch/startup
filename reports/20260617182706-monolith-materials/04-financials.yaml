  - id: financial-verdict
    title: Financial Verdict and Diligence Blockers
    body: >
      Monolith's revenue quality is low by conventional standards: a single commodity-adjacent revenue stream from a 14,000 t/yr plant, with no public revenue figures, no disclosed margin, and no signed OFftake for the company-defining OC2 project. The capital intensity is extreme — OC2 requires well over $1B in combined DOE loan and equity, and the DOE commitment remains conditional and politically imperilled. The September 2024 cash shortage report is a red flag that the company exhausted its prior equity buffer before closing the critical milestones needed to trigger DOE loan finalization.

      That said, the installed OC1 asset generates real carbon black revenue, the technology is proven at commercial scale (first in the world to do so at this scale for plasma methane pyrolysis), and the investor syndicate — TPG Rise Climate, Decarbonization Partners (BlackRock/Temasek), Warburg Pincus — is credible and repeat-committed. The green carbon black premium thesis is directionally sound as tire-makers face Scope 3 pressure. If the DOE loan closes and OC2 is built, the revenue profile would transform from small-scale to potentially $300–400M/yr. The binary nature of this outcome makes Monolith a high-risk, high-upside story that cannot be underwritten without a full data-room review.

      Three blocking diligence items: (1) Audited OC1 financials and margin disclosure; (2) DOE loan status confirmation and conditions checklist; (3) Koch ammonia offtake signed terms and pricing floor.
