  - id: cost-structure-unit-economics
    title: Cost Structure and Unit Economics
    body: >
      Monolith's process uses electrical plasma to split natural gas (methane) into carbon black and hydrogen, replacing the conventional furnace black process. The key cost drivers are electricity, natural gas feedstock, capex depreciation, and plant O&M. The company claims approximately 95% feedstock conversion efficiency compared to roughly 55% for conventional furnace carbon black, which should in principle improve yield economics. However, the plasma process is electricity-intensive, making power price a dominant variable in the unit cost structure. No official cost-per-ton, EBITDA margin, or gross margin figure has been disclosed.

      For benchmarking, publicly traded carbon black producers Cabot Corporation and Orion Engineered Carbons generate gross margins in the range of 20–35% for specialty grades. Monolith's process is likely to carry higher electricity costs and capex depreciation per ton than incumbent furnace-based processes at OC1 scale, potentially compressing margins at current volumes. Premium pricing for low-emission "green" carbon black is central to the company's margin thesis — both from sustainability mandates at customers like Goodyear and from the lower-sulfur profile of the product. The exact magnitude of any realized green premium versus commodity grades is undisclosed.

      Working capital needs at OC1 are modest relative to the planned OC2 build. The capital-intensity inflection occurs entirely at OC2, where the DOE loan guarantee of $953M combined with equity already deployed suggests total project cost likely exceeds $1.5–2B for the full OC2 campus. The fractional CFO structure (Tim Rens) suggests lean financial management capacity at a stage requiring sophisticated project-finance execution.
