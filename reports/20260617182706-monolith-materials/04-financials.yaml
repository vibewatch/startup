    - type: private-evidence-only
      severity: blocking
      topic: financial-statements
      missingEvidence: Audited financial statements for OC1 operations (P&L, balance sheet, cash flow) for fiscal years 2021–2025
      whyItMatters: Cannot assess OC1 revenue, gross margin, cash burn, or unit economics without audited financials
      diligencePath: Request data room with CPA-reviewed or audited OC1 P&L; require board-level financial package
      relatedQuestionRefs:
        - QI001
        - QI007
      relatedTableRefs:
        - TI003

    - type: missing-source
      severity: blocking
      topic: doe-loan-status
      missingEvidence: DOE LPO conditional commitment letter, checklist of conditions, and any 2025–2026 correspondence on cancellation status
      whyItMatters: The $953M DOE loan is the keystone capital source for OC2; unresolved status blocks any OC2 financial model
      diligencePath: Obtain DOE LPO correspondence directly; confirm with DOE spokesperson or via FOIA; request company's attorney communication
      relatedQuestionRefs:
        - QI006
        - QI021
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: blocking
      topic: offtake-terms
      missingEvidence: Executed Koch Fertilizer ammonia offtake agreement including price floor, volume, take-or-pay, term, and force majeure
      whyItMatters: OC2 revenue quality is entirely dependent on the Koch offtake; without terms, revenue cannot be underwritten
      diligencePath: Request executed offtake agreement and review with legal counsel; confirm validity post any leadership changes
      relatedQuestionRefs:
        - QI010
        - QI015
        - QI017
      relatedTableRefs:
        - TI001

    - type: private-evidence-only
      severity: material
      topic: oc2-project-finance
      missingEvidence: OC2 capital cost budget, EPC contract, project finance term sheet, and financing sources other than DOE
      whyItMatters: Cannot assess capital adequacy, equity dilution, or project IRR without project finance package
      diligencePath: Request EPC contract (Kiewit or successor), capital cost estimate, debt financing term sheets
      relatedQuestionRefs:
        - QI021
        - QI027
      relatedTableRefs:
        - TI004

    - type: missing-source
      severity: material
      topic: natural-gas-pricing
