  - id: financial-gaps
    title: Public Financial Metrics Gaps
    body: >
      The depth of financial opacity at Monolith is a material diligence blocker. As a private company with no SEC reporting obligation (all EDGAR filings are Form D exempt offering notices), there are no audited financial statements, no disclosed revenue, gross margin, EBITDA, or cash flow figures available in the public domain. The Form D filings confirm multiple rounds of exempt equity offerings under Regulation D Rule 506(b) but do not disclose total amounts raised per round, individual investor economics, or use of proceeds detail beyond the generic "business development" characterization.

      The most significant gap is the status and terms of the OC2 project finance package. Without a final DOE loan close or confirmed commercial project-finance commitment, the path from OC1 revenue (~$14–17M estimated, per capacity and market pricing) to OC2 ($300M+ revenue potential at full scale) requires capital that remains contingent and partially at political risk. A diligence-room request should target: audited financials for OC1 operations, signed Koch offtake agreement terms, confirmed DOE loan status, OC2 capital cost estimate, and projected timeline to first ammonia revenue.
