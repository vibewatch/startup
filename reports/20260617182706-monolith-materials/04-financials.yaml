callouts:
  - calloutType: risk
    title: DOE Loan Cancellation Creates Capital-Adequacy Cliff
    body: >
      The $953M DOE Title 17 conditional commitment is the largest single capital source in Monolith's financing plan
      and has never been formally closed into a loan agreement. As of May 2025, the Trump administration was reported
      to be planning to cancel this commitment. If cancelled, Monolith faces a ~$953M hole in the OC2 financing plan
      that cannot be filled with equity alone at a ~$1B valuation without extraordinary dilution.
    claimRefs:
      - CI007
      - CI009
      - CI010
      - CI015
      - CI031

  - calloutType: risk
    title: September 2024 Cash Shortage Signals Burn Outpacing Revenue
    body: >
      Reports from September 2024 citing the Wall Street Journal stated Monolith was "running short on cash and
      facing project delays" — precisely when the company closed a $300M+ emergency equity round. This pattern
      suggests the company's operating and development burn consistently outpaces its small OC1 revenue base,
      requiring repeated equity injections to maintain operations.
    claimRefs:
      - CI011
      - CI037
      - CI003

  - calloutType: strength
    title: OC1 Commercial Proof-of-Concept Is Real
    body: >
      OC1 is genuinely operational: Monolith's carbon black is in millions of tires across North America and in
      plastic components of American vehicles. This provides a commercial proof of technology and an existing
      customer relationship with Goodyear that de-risks the technology viability question, even if OC1 revenues
      are insufficient to sustain the company's capital needs.
    claimRefs:
      - CI001
      - CI012
      - CI030

  - calloutType: recommendation
    title: Full Data-Room Disclosure Required Before Any Underwriting
    body: >
      The absence of audited financials, disclosed revenue, burn rate, gross margin, DOE loan conditions, and Koch
      offtake terms makes it impossible to underwrite Monolith's financial position from public data alone.
      Any investment thesis must be predicated on a full data-room review covering OC1 actuals, OC2 project budget,
      DOE correspondence, and offtake contract.
    claimRefs:
      - CI003
      - CI015
      - CI040

