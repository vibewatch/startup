chapter:
  number: 4
  title: Financials
  summary: >
    Monolith's sole current revenue stream is carbon black sales from the 14,000 t/yr OC1 facility; no public revenue figures exist, making financial underwriting impossible without a data-room request. The $953M DOE conditional loan guarantee — the linchpin of the OC2 expansion — remained unfinished and was reported to be at risk of cancellation by the Trump administration as of May 2025. A September 2024 cash-shortage report coincided with a $300M+ emergency raise, signalling a capital-intensive business with a long pre-revenue OC2 timeline and inadequate public disclosure to underwrite margin, burn, or runway independently.

sections:
  - id: revenue-model
    title: Revenue Model and Commercial Traction
    body: >
      Monolith's current revenue comes entirely from the sale of carbon black produced at OC1, its commercial facility in Hallam, Nebraska. OC1 has an installed capacity of approximately 14,000 metric tons per year — a small fraction of the planned OC2 expansion. Carbon black from OC1 is sold primarily for tire reinforcement and industrial rubber applications; the company's products include the GreenBlack®, Bolt™, True™, and Core® product lines targeting different purity and reinforcement profiles. Goodyear is the most publicly confirmed tire-sector customer, having announced collaboration with Monolith for low-emission carbon black in 2021. The company's about page confirms OC1 carbon black is currently going into "millions of tires across North America" and into plastic brackets and bumper fascia of American vehicles, representing early commercial traction.

      No public revenue figures, annual recurring revenue, or volume sold have been disclosed. All revenue must currently be inferred from capacity utilization assumptions and prevailing market prices for specialty and tire-grade carbon black. Ammonia and clean hydrogen revenue — the larger long-term revenue stream — remain entirely pre-commercial, pending OC2 construction, DOE loan closure, and commissioning. The original OC2 startup scheduled for 2024 has not been met as of the 2026 run date.

      Koch Fertilizer (Koch Industries) has been publicly named as the planned long-term ammonia offtake partner for OC2, with ammonia targeting farmers in the US Corn Belt, a region that imports over 1.7 million tonnes per year of ammonia. However, no contract terms, pricing floors, or take-or-pay provisions have been publicly disclosed.
