      - number: '7.2'
        title: 运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              最严峻的运营风险，是等离子热解能否从 OC1 每年约 14,000 公吨炭黑，放大到 OC2 计划的每年约 180,000–194,000 公吨——这是约 14× 扩张，商业规模上没有直接行业先例。Power
              Magazine 对 DOE 贷款的分析指出，Title XVII 要求“新的或显著改进的技术”，这凸显技术新颖性，也说明连政府资助方都承认规模化不确定性。每个 OC2
              生产单元都会增加更多等离子反应器，且高温工艺管理复杂，系统性工程问题出现的概率上升；这些问题在 OC1 运营中未必显现。OC2 建设还带来重大执行风险：CBC 文章提到，项目原本大约以 2025
              年完工为目标，但该目标未实现，说明进度滑坡已经发生。

              天然气是 Monolith 的主要原料，也是最大的可变成本驱动项。EIA 报告显示，Henry Hub 现货价在 2026 年 1 月单周内从 $3.12/MMBtu 升至
              $4.98/MMBtu，短期价格波动显著。Midwest 工业天然气用户还面临额外基差。Monolith 没有公开披露天然气价格套保、固定价格采购协议，或客户合同中的成本传导条款。天然气价格若持续上涨
              50%，将显著压缩氢和炭黑利润率，甚至可能在 OC2
              达到名义产能前消除盈利能力。炭黑产品质量一致性也是风险：特种轮胎级炭黑要求严格规格合规，等离子工艺任何批次波动都可能触发客户质量冻结、合同罚款，或失去主要轮胎制造商认证。

              氢安全是内生运营风险：氢气可燃范围宽（空气中约 4–75%）、点火能极低，在生产规模下存在爆炸和火灾危险。DOE 赞助的 H2 Tools 门户指出，工业氢设施需要严格安全管理体系、规范合规（NFPA
              2）和事故响应规划。OC1 或 OC2 施工期间若发生事故，可能引发监管调查、停产、声誉损害和重大责任。
