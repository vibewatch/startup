  - id: TV005
    title: 投资逻辑破裂与终止触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - DOE 贷款正式取消
        - DOE 针对 Monolith OC2 有条件承诺发出正式终止函，或 Federal Register 公告
        - 切断 OC2 主要融资路径；迫使公司进行稀释性私募融资或资产出售；EV 跌回仅 OC1 区间（$70–120M）
        - 投资逻辑立即破裂；除非 60 天内确认新债务计划，否则转为放弃
      - - OC1 经营性现金消耗得到确认
        - 经审计财务显示 OC1 经营现金流为负，且跑道 <12 个月
        - 坐实现金短缺报道；提示短期资本危机；保护优先权的资本重组可能抹掉低顺位股权
        - 加速尽调资本结构表；任何新投资前要求过桥承诺
      - - 炭黑承购价格崩盘
        - 已实现炭黑价格跌破 $700/MT，或 Goodyear 合作结束
        - 消除 OC1 收入充足性；对靠炭黑补贴的氢经济性提出可行性问题
        - 按修订价格重建单位经济模型；可能需要暂停
      - - 管理层离任
        - CEO Rob Hanson 或 CFO 离任，且未宣布继任者
        - 失去关键创始人 / 商业化架构师；投资者信心承压；可能触发表述违约
        - 暂停；要求管理层稳定性承诺
      - - 竞争对手达到商业规模
        - 到 2028 年，替代商业规模等离子体热解设施（>50,000 MT/yr）宣布建设
        - 削弱估值中嵌入的先发溢价；炭黑定价权下降
        - 监控 C-Zero、Aurora Hydrogen、HiiROC；修订护城河评估
