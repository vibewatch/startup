          - type: paragraph
            body: >
              Monolith 以四条品牌产品线销售炭黑。GreenBlack® 面向补强应用（胎面、胎体帘布层、钢丝覆胶、内衬层），这些场景要求高结构碳含量。Bolt™
              针对低硫含量应用，如机械橡胶制品（软管、皮带、密封件、垫片）。True™ 提供最高纯度等级，面向最严苛场景——特种塑料、涂料、油墨、电池电极和食品接触包装。Core® 覆盖通用炭黑应用。OC1
              生产的炭黑已经进入北美数百万条轮胎和塑料部件。

              轮胎制造商的客户工作流可重复：制造商按 ASTM 牌号和应用要求指定炭黑等级；Monolith 的 OC1 工厂生产并调质相应等级；从 Nebraska Hallam 发货前，质量按 ASTM
              规格验证；客户在混炼厂把炭黑加入橡胶配方；混炼胶再硫化成成品轮胎。Goodyear Tire & Rubber 是唯一总部在美国的轮胎制造商，已签署协议评估 Monolith 炭黑用于轮胎补强，并预计获得未来
              OC2 炭黑产出的约三分之一。

              下游氢路径上，OC1 的清洁 H2 目前补充现场能源使用。按规划中的 OC2 建设方案，氢气将通过 Haber–Bosch 合成回路（N2 + 3H2 ⇌
              2NH3）转化为无水氨，并销售给美国玉米带农户，直接对应当地每年约 175 万吨的氨缺口。Koch Fertilizer 已就 OC2 产出签署长期氨承购协议。
