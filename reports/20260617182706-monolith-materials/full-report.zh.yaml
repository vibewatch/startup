  - id: TV006
    title: 最终尽调要求
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 精确估值
        - 2022 年 7 月和 2024 年 9 月融资轮的投后估值；清算瀑布和优先权栈
        - 计算真实股权回报和下轮风险所必需；所有公开申报均缺失
        - 公司 CFO；作为任何 term sheet 的条件要求提供
      - - OC1 财务表现
        - 经审计或审阅的 OC1 EBITDA、炭黑实现价格和经营现金流
        - 验证或反驳现金短缺报道；锚定收入倍数分析
        - 公司 CFO；要求提供过去 4 个季度的管理账
      - - OC2 融资计划
        - 若 DOE 贷款被取消，OC2 的替代融资方案；CapEx 预算；建设时间表
        - OC2 是整个牛市情景；没有已落实的融资计划，$1B+ 估值就缺少根基
        - 公司 COO/CFO；要求提供正式项目融资条款清单或承诺函
      - - DOE 贷款状态
        - 截至 2026 年 6 月，DOE 条件性承诺的最新状态；是否有豁免、延期或取消通知
        - 2025 年 5 月信号显示取消风险仍在；结果是最大的单一二元风险
        - 公司法务团队；DOE Loan Programs Office FOIA 请求；国会联系人
      - - 股权结构与稀释表
        - 完整股权结构，包括所有轮次、期权池和反稀释条款
        - 没有这项信息，就无法建模回报情景，也无法评估退出分配瀑布
        - 向公司法务 / Carta 数据室请求
      - - 炭黑市场定价
        - Monolith 实现炭黑价格 vs. 基准 N330 市场价格；Goodyear 合同条款
        - 炭黑是 OC1 的主要收入来源；定价权决定 OC1 能否自我维持
        - 向公司请求；与 Cabot/Orion 披露的价格趋势交叉核对
