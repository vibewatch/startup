            title: 赋予市场溢价前先验证承购协议
            body: >
              已发布的清洁氢和清洁氨市场规模体现了成长型市场，但 Monolith 近期已实现收入完全取决于 Koch Fertilizer 承购协议（氨）以及 Goodyear / 其他轮胎 OEM
              合同（碳黑）。在给予市场溢价估值前，投资人应验证这些协议是否包含固定量和固定价格，还是仅为尽力安排，并验证 OC2 融资关闭是否取决于这些条款。
