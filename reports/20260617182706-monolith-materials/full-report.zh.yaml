        - 在 Monolith Nebraska 场址附近为 H2 创造需求锚点；降低获客成本
        - Monolith 是否已被指定为任何 H2 Hub 的优先供应商？
      - - 欧盟 RED III 氢目标与碳边境调节
        - 驱动因素
        - 2025–2030
        - 位于欧盟的轮胎 / 汽车 OEM 需要低碳投入品，以满足 CBAM 和 Scope 3 披露；推动溢价
        - Goodyear 和其他与欧盟相关的 OEM 是否已签署认证低碳 CB 采购协议？
      - - OEM 供应链 Scope 3 / ESG 报告要求
        - 驱动因素
        - Now–2028
        - 轮胎和工业买方偏好低碳供应商；愿为认证 CB 支付溢价
        - Monolith 从现有客户处拿到的认证产品相对炉法碳黑溢价是多少？
