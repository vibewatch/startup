        title: 采用轨迹与具名客户验证
        blocks:
          - type: paragraph
            body: >
              Monolith 的 OC1 工厂于 2020 年 9 月开始商业化生产炭黑，此后一直向北美轮胎制造商供货。最突出的具名关系是 Goodyear Tire & Rubber
              Co.，也是唯一总部在美国的轮胎制造商。2021 年 12 月，Goodyear 签署合作协议和意向书，评估 Monolith 炭黑作为轮胎补强材料。Goodyear CEO Richard Kramer
              公开表示，公司对与 Monolith 合作以降低碳足迹“感到兴奋”。据 Chemical & Engineering News，Monolith 预计向 Goodyear 提供 OC2
              总炭黑产出的约三分之一（计划 194,000 t/yr 中约 65,000 公吨 / 年）。2023 年 5 月，Goodyear 推出一款加入 Monolith
              可持续炭黑的轮胎，标志着首款使用该材料的商业轮胎问世。AP News 对 DOE 贷款公告的报道显示，2022 年 1 月前，另一家未具名轮胎制造商也已签署从 Monolith
              购买炭黑的意向书。氨业务方面，Koch Fertilizer——Koch Industries 子公司，也是北美最大的化肥分销商之一——于 2022 年 7 月宣布与 Monolith
              签署长期承购协议，购买规划中 OC2 工厂的清洁氨。协议条款未公开披露。Goodyear 供货承诺和 Koch Fertilizer 交易均取决于 OC2 建成投产；截至 2024 年 9 月，OC2
              面临延期和据报现金短缺。Ammonia Energy Association 形容 Monolith 的甲烷热解路线能够“在正确地点、以正确规模和正确成本交付低碳氨”。
