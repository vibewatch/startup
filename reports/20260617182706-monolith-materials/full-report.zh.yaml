      - number: '8.4'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >
              三种情景框定 Monolith 的投资价值。**牛市情景**下，OC2 在 2028–29 年建成，并获得替代融资包或恢复 DOE 贷款。满产收入每年达到约 $300–350M（180,000 MT 炭黑 ×
              ~$1,100/MT + 275,000 MT 氨 × ~$400/MT）。按符合气候科技增长溢价的 3–4× EV/revenue 倍数，企业价值达到
              $900M–$1.4B。扣除优先权结构和稀释后，普通股按当前 $1B 进入价回报为 1–2×。这是“保本”结果，不是风投级回报。


              **基准情景**下，DOE 贷款延期或被部分替代；OC2 分阶段用 5–7 年建成。到 2030 年，收入爬升至 $100–200M。按 2–3× EV/revenue，企业价值为 $200–600M。已融资
              $570M 带来的优先权压力（如有应计股息则更甚）很可能抹去大部分普通股收益。潜在更低隐含估值的过桥轮会触发技术性下行轮。


              **熊市情景**下，DOE 贷款被正式取消。Monolith 无法以可接受条款筹集 OC2 资本。OC1 继续运营，但现金流不足以资助扩张；公司要么出售资产，要么进入困境重组。仅按 OC1 估值（用 5× 估计
              $17M 收入 = $85M）意味着相对 $1B+ 进入价有显著减值。本金处于风险中。


              概率权重（高度不确定）：牛市 20%，基准 45%，熊市 35%。加权 EV：约 $450M，对比 $1B+ 要价。这支撑了“偏高”估值立场。
