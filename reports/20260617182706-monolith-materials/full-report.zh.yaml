      - number: '2.4'
        title: 增长驱动与采纳约束
        blocks:
          - type: paragraph
            body: >
              Monolith 所在市场的核心增长驱动是脱碳政策，尤其是美国 Inflation Reduction Act 的 45V 清洁氢生产税收抵免（最高 $3/kg H2）、45Q 碳封存抵免，以及 DOE
              条件性贷款担保计划。EU 气候政策——包括 Renewable Energy Directive III 对 2030 年工业和交通可再生氢的目标，以及 Hydrogen and Decarbonised Gas
              Market Package——会从需要低碳投入品的欧洲买家那里形成拉动。大型 OEM（轮胎、汽车和工业制造商）的 Scope 3 供应链报告要求构成第二个结构性驱动，使客户愿意为接近零直接 CO2
              排放认证的低碳碳黑支付溢价。但采纳也面临实质约束。天然气价格波动是最直接的原料风险：甲烷是等离子体热解的主要投入，价格波动超过约 $5/MMBtu
              会显著压缩绿松石氢利润。等离子体工艺的资本强度是第二项约束：OC2 设施已需要 $570M+ 私募股权、$953M DOE 条件性贷款担保，并且商业交割资金仍未落实——建设延误和 2024 年 9
              月现金短缺报道突出了这一风险。政策反转风险很尖锐：Semafor 2025 年 5 月报道称 Trump 政府计划取消 Monolith 的 DOE 条件性承诺，Reason Foundation
              则引用项目延误和现金约束，作为政府投资错配的证据。SMR 灰氢成本为 $1–1.5/kg，形成价格地板；估算全成本 $2–4/kg 的绿松石氢在无差异化工业市场尚无法竞争。需求侧不确定性还体现在 S&P
              Global Commodity Insights 的报道（2023 年 3 月和 4 月）：氢生产商面对高成本和需求不确定性，IEA 数据也显示氢需求预计爬坡慢于最初预期。2030–2032 年氢市场规模估计从
              $90 billion 到 $642 billion 不等，说明市场如何划界和定价存在根本不确定性；这应保留为尽调缺口，而不是用单点估计消解。
