      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >
              Monolith 已披露股权融资超过 $570M（标准口径）；第三方追踪机构 Tracxn 称，自 2012 年以 Boxer Industries 创立以来，公司约 15 轮融资合计
              $593M。最近一次披露事件是 2024 年 9 月来自既有投资人的“超过 $300 million”融资——Azimuth Capital、Cornell Capital、Decarbonization
              Partners、TPG Rise Climate 和 Warburg Pincus——没有引入新的机构支持者。结合公告前的现金短缺报道，这种结构更像既有投资人联盟的防御性过桥，而非经市场检验的新投资人轮。


              Monolith 在 SEC EDGAR 的备案记录显示，2015 年至 2021 年 6 月共有九份 Form D 通知（最近一份对应 $120M 轮）。2022 年 7 月 $300M 融资和 2024 年
              9 月 $300M+ 融资没有提交 Form D。这一缺口限制了第三方对证券类型、股价和隐含投后估值的验证。公司也没有公开收入或 EBITDA 披露，因此估值证据几乎完全建立在推断上：CB Insights 于
              2022 年授予独角兽身份，Reason.com 文章确认 2022 年曾称估值“超过 $1 billion”。此后价值是维持、增长，还是内部下调，均未知。


              2021 年 12 月宣布并通过 2022 年 BusinessWire 公告重申的 $953M DOE 有条件贷款担保，是 OC2 的主要融资支柱。若被取消，Monolith 将需要通过私人市场替代近 $1B
              已承诺项目融资；在当前气候科技资本环境下，这很难实现，尤其自 2022 年以来 CF-tech 倍数已经压缩，除非承受显著稀释。


              进入纪律要求完整尽调：（a）实际投后股权结构表、优先权结构和清算瀑布；（b）OC1 经营现金流和烧钱；（c）有无 DOE 资金两种情况下的 OC2 资本开支承诺和时间表；（d）DOE 谈判当前状态。
