      - number: '5.5'
        title: 信任、质量、安全与合规
        blocks:
          - type: paragraph
            body: >
              Monolith 的炭黑按 ASTM International 标准等级生产和测试；这些标准规定轮胎和橡胶制造商要求的粒径、比表面积、结构（DBP
              吸收）及其他物理化学性质。炭黑必须满足这些规格后才能发给客户，在生产和交付之间形成质量闸口。该工艺不产生直接 CO2 排放（无燃烧，反应区无氧），且根据公司 DOE 贷款申请文件，相较传统炉法工艺，生命周期
              CO2、SOx 和 NOx 最多降低 80%。

              OC1 的环境许可按 Nebraska 州法规办理；规划中的 OC2 扩建还需要 Lower Platte South Natural Resources District 额外地下水许可（2021 年 7
              月获批，最高每年 4.2 亿加仑）。许可附带监测和报告要求，用以回应社区对用水的担忧。公司每生产 3 吨炭黑，大约会处理 1 吨副产氢；这些氢用于现场发电，减少外部公用事业净需求。IARC
              将炭黑归类为“可能对人类致癌（Group 2B）”，Monolith 按行业规范执行标准职业暴露控制。公开资料未报告 OC1 发生产品召回或重大安全事故。DOE 贷款担保项目要求 Monolith
              满足具体技术、财务和环境条件；这套严格尽调也相当于对技术成熟度的外部质量闸口。
