      - number: '5.3'
        title: 工厂地图与规模化路线图
        blocks:
          - type: paragraph
            body: >
              Monolith 位于 Nebraska Hallam 的 Olive Creek 1（OC1）工厂于 2020 年 9 月投产，成为全球首座商业规模甲烷热解工厂。OC1 由 Fagen Inc.
              担任工程、采购和施工（EPC）承包商设计建造，名义炭黑产能约为每年 14,000
              公吨。工厂完全使用通过可再生能源证书（RECs）采购的可再生电力，并生产清洁氢作为副产品；这些氢转化为蒸汽和电力，服务当地能源消费者。

              规划中的 Olive Creek 2（OC2）扩建于 2020 年宣布，拟由 Kiewit 承建，前端工程设计（FEED）已完成；项目将新增约每年 180,000– 194,000 公吨炭黑产能，并配套每年
              275,000 公吨清洁氨合成单元。OC2 将使 Monolith 成为美国最大的炭黑生产商。截至 2024 年 9 月融资轮，Monolith 确认 OC1 仍在商业运营，并表示有意推进 OC2 扩建；但
              Wall Street Journal 同期报道称，公司现金吃紧并面临项目延期。最初于 2021 年 12 月宣布的 $953 million DOE 有条件贷款担保（Title XVII），在 2025 年 5
              月报道中被列为 Trump 政府计划取消的七项有条件承诺之一——这给 OC2 融资计划带来重大风险。Monolith 2026 年公司材料称，公司准备“在其 Nebraska
              场址以规划中的先进制造园区实现增长”，说明 OC2 意图仍在，但明确开工日期尚未公开确认。
