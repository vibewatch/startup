      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Robert (Rob) J. Hanson 自公司 2012 年创立以来一直担任联合创始人兼 CEO。他此前在 AREVA Solar 工作，负责聚光太阳能，之后转向清洁化学品。Hanson 是
              Monolith 技术和融资的公开代言人，也是商业推进核心；他以 President 身份签署了 2020 年和 2021 年 SEC Form D 备案。


              第二位联合创始人的身份，是现有来源中已验证的冲突点。Wikipedia（引用 2013 年 Silicon Valley Business Journal 文章）和 Crunchbase 均将 Pete
              Johnson 列为与 Hanson 并列的联合创始人。但本报告委托简报称第二位联合创始人为 Cody Finke。两种说法相互矛盾，且未找到任何独立来源把 Cody Finke 与 Monolith
              创立联系起来。后续章节引用任何创始人身份主张前，必须先向公司直接核实。


              董事会治理方面，唯一公开确认的独立董事是 Bob Kerrey——Nebraska 州前美国参议员（1989–2001）和 Nebraska 第 35 任州长（1983–1987）——他于 2019 年加入
              Monolith 董事会。Kerrey 带来政策通道和 Nebraska 社区背书。公开来源没有确认其他董事，说明公司在 CEO
              层面存在较高关键人依赖，治理结构也不透明。公开来源未识别出首席运营官、首席财务官或首席技术官，显示战略权力高度集中在 Hanson 手中。
