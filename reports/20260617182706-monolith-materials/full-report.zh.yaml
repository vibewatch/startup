  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              Monolith
              的总可服务市场横跨等离子体甲烷热解同时产出的三类产品：碳黑（固体碳）、清洁氢（用于合成无水氨）以及氨本身。三者之中，碳黑市场最宽、也最成熟。全球碳黑市场覆盖特种、通用和传统炉法碳黑等级，主要用于轮胎增强、工业橡胶制品、涂料、油墨以及电池
              / 电子应用。Monolith
              的产品竞争于特种和低碳认证子赛道；传统石油基炉法碳黑（通过油的部分燃烧生产）是占主导地位的在位技术，也是主要现状替代品。来自废旧轮胎的再生碳黑（rCB）代表第三类新兴替代方案。清洁氢市场边界覆盖生命周期温室气体排放显著低于未减排蒸汽甲烷重整（SMR）灰氢的氢；等离子体甲烷热解制成的绿松石氢符合该定义，因为碳以固体碳黑形式被捕获，而非以
              CO2 排放。SMR 灰氢和带 CCS 的 SMR 蓝氢是占主导地位的现状替代品；两者合计占当今全球氢产量的 99% 以上。氨市场边界覆盖 Haber-Bosch 产品链：Monolith
              的氢原料可生产用于化肥、工业化学品和（新兴）混烧能源应用的无水氨。传统基于灰氢的氨（SMR + Haber-Bosch）是清洁氨压倒性的现状替代品。Monolith
              的主要市场不包括：燃料电池用交通级氢（供应链不同）、电解绿氢（生产路径不同），以及 Koch Fertilizer 分销网络未覆盖的非农业用途氨。
