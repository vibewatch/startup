      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 大而成熟的碳黑市场，低碳利基顺风
            body: >
              碳黑是一个 $25.95 billion 市场（2026），买方群体清晰，集中在少数全球轮胎 OEM 手中。随着 Scope 3 报告要求和 EU
              尽职调查监管让低排放投入品具备商业价值，该市场内的低碳利基正在增长。Monolith 的等离子体工艺生产经认证的低排放碳黑，在一个大宗商品占主导的市场中形成差异化；目前只有少数玩家在走低碳路径。
            calloutType: strength
            claimRefs:
              - CM009
              - CM023
              - CM032
          - type: callout
            title: 清洁氢需求缺口——已宣布 38 Mt，对 2030 年预期仅 12–18 Mt
            body: >
              Hydrogen Council 2023 年项目跟踪调查显示，已宣布清洁氢产能（到 2030 年 38 Mt/yr）与现实部署（12–18 Mt/yr）之间存在 50–70% 的流失缺口。IRA 45V
              监管不确定性、成本高于预期以及宏观逆风被列为原因。Monolith 的氢和氨收入依赖该市场成形；流失缺口说明，整体清洁氢需求信号不如标题式宣布数字可靠。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM037
              - CM038
          - type: callout
            title: 双产品模式形成天然市场对冲
            body: >
              Monolith 的等离子体热解同时生产碳黑（成熟的 $26B
              大宗商品市场）和氢（新生清洁能源市场）。这种双产品结构意味着，在清洁氢需求扩大之前，碳黑收入可以补贴氢基础设施投资。对冲并不完美——两个产品使用同一原料（天然气），也共享同一个资本项目——但与单一绿松石氢相比，碳黑市场提供了更近、更确定的收入锚。
            calloutType: insight
            claimRefs:
              - CM006
              - CM009
              - CM012
          - type: callout
            title: 绿松石氢利基市场尚无独立规模测算
            body: >
              没有主要市场研究发布方（Mordor、Allied、Precedence、IEA）单独发布绿松石氢市场规模估计。已发布的清洁氢数字把所有低排放路径（绿色、蓝色和绿松石）汇总在一起。本章给出的 2031 年绿松石氢
              SOM 估计为 $1–5 billion，是残差推断数字。投资人应只把该数字视为方向性参考，并要求 Monolith 提供其针对绿松石利基的市场规模方法论。
            calloutType: assumption
            claimRefs:
              - CM011
              - CM022
