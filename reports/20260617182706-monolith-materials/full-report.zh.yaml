companyProfile:
  summary: >-
    Monolith Materials, Inc.（“Monolith”）是一家位于 Nebraska 州 Lincoln 的清洁技术公司，2012 年创立，原名 Boxer
    Industries。公司用自研等离子体甲烷热解工艺，把天然气转化为清洁“绿松石”氢和固体碳黑，过程不产生直接 CO2 排放。其位于 Nebraska 州 Hallam 附近的 Olive Creek
    1（OC1）是全球唯一商业规模的等离子体热解碳黑工厂（约 14,000 吨 / 年）；公司还规划了大得多的 OC2 扩建。Monolith 已完成 $570M+ 股权融资（包括 2024 年 9 月由 TPG Rise
    Climate 和 Decarbonization Partners 领投的 $300M+ 轮），并持有 $953M 的 DOE Title 17 条件性贷款担保；截至 2025
    年，该担保据称面临取消风险。公司也被报道遭遇现金流压力和项目延误。
