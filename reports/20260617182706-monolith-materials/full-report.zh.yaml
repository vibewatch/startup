  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Monolith Materials 横跨两个相互关联的市场竞争：碳黑（销售等离子体热解过程的固体碳联产品）和清洁氢（生产绿松石氢并转化为氨）。这两个市场的在位结构不同。碳黑领域，三到四家全球集团——Cabot
              Corporation、Birla Carbon、Orion S.A. 和 Tokai Carbon——合计控制全球大部分产能，Asia Pacific 约占 $22 billion 市场的
              63%。氢领域，现状是来自蒸汽甲烷重整（SMR）的灰氢，全球数百座设施生产，未计碳外部性前价格约 $1–2/kg；基于电解的绿氢（Nel、Plug Power、ITM Power）是理想替代品，而蓝氢（SMR +
              碳捕集）是 Air Products、Air Liquide、Linde 等工业气体巨头偏好的渐进式脱碳替代方案。多家风险投资支持的初创公司也在做甲烷热解制绿松石氢，包括 Ekona
              Power（Vancouver）、Aurora Hydrogen（Edmonton）、Modern Hydrogen（Seattle）、Hazer Group（ASX）和
              Graforce（Berlin），但都尚未达到商业规模。可能进入者包括授权热解技术的既有工业气体巨头，以及拥有天然气资产、寻求现场生产氢和碳黑的化工公司。
