        - 稀释 >50% 的融资轮，或以重大折价进行股权转换的过桥债融资
        - 评估稀释对现有股权的影响；下轮融资风险升高；重新考虑仓位规模
      - - CEO 离任
        - LinkedIn 更新；公司新闻稿；新闻媒体报道
        - Rob Hanson 宣布离任、长期休假，或辞去 CEO 职务
        - 强化监控；继任者质量未明前，投资逻辑可能破裂；DOE 风险可能加速
