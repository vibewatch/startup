      - number: '3.5'
        title: 转换成本、护城河与替代风险
        blocks:
          - type: paragraph
            body: >
              Monolith 的竞争护城河建立在四根支柱上：（1）商业规模先发优势——OC1
              是全球唯一正在运营的热等离子体烃热解碳黑工厂；（2）专利等离子体热解技术，对直接复制构成法律屏障；（3）双产品经济性——从单一原料联产碳黑和氢 /
              氨，形成单产品竞争者无法匹配的收入结构；（4）运营记录，这是获得轮胎制造商技术认证的前提，而这些认证出了名难拿。碳黑规格高度客户定制；轮胎制造商批准新供应商前会运行漫长认证项目，形成保护既有生产商的多年转换成本。Monolith
              必须完成这些认证周期，才能在规模上替代在位企业——也就是说，客户锁定目前掌握在 Cabot、Birla Carbon 和 Orion 手里，而不是 Monolith
              手里。主要替代风险包括：（a）碳黑在位企业加速可持续和循环碳产品；（b）绿氢电解成本下降，压低绿松石氢生产商可获得的碳溢价；（c）清洁氢监管顺风被政策变化侵蚀（例如截至 2025 年 5 月，Trump
              政府威胁取消 Monolith 的 $953M DOE 条件性贷款担保）；以及（d）资本更充足或技术更优的后进入者。OC2 扩建目标为约 180,000–194,000 t/yr 碳黑和约 275,000
              t/yr 氨，对降低单位成本并在商业规模竞争至关重要，但 DOE 贷款风险和 2024 年 9 月现金短缺报道带来执行不确定性。
