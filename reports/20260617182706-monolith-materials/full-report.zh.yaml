      - number: '7.3'
        title: 伙伴、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              Monolith 规划中的 OC2 收入高度集中在 Koch Fertilizer，这是唯一已披露的长期氨承购伙伴。单一交易对手依赖意味着，Koch 任何重新谈判、援引不可抗力或终止协议，都会抹去 OC2
              预计收入的大部分，并直接削弱贷款偿还计划和股权估值。Koch Industries 是成熟且资本雄厚的伙伴，但在公司签下更多氨承购协议前，集中风险在结构上没有缓释。炭黑侧，Goodyear 是 OC1
              产出的主要已披露客户，但并非在 OC2 规模上被合同锁定的买方；大型在位企业 Cabot Corporation、Birla Carbon 和 Orion Engineered Carbons
              在价格和全球供给上竞争，且据 S&P Global 和 Chemweek 分析，2023–2024 年炭黑价格已承压。

              财务风险尖锐。Lincoln Journal Star 2024 年 9 月报道称，Monolith “现金吃紧并面临项目延期”，随后 TPG Rise Climate、Warburg
              Pincus、Cornell Capital 等投资人参与了 $300M+ 股权轮。该轮解决了眼前流动性危机，但没有解决 OC2 的结构性资本需求；OC2 除股权外还需要 $953M DOE
              贷款。根据已发布贷款和股权融资披露，OC2 总资本需求约为 $1.1–1.3B；首创型建设完成前，OC2 不可能产生外部收入。建设烧钱、既有 OC1 工厂运营和公司管理费用叠加，持续消耗现金。多份 SEC
              Form D 备案（2013–2021）记录了 Monolith 多轮依赖股权融资；2021 年 Form D 提到 $120M 营运资本需求，说明即便在 OC2 之前，该业务已经高度资本密集。

              执行风险集中体现在 CEO Rob Hanson 身上。Hanson 是创始 CEO，自 2012 年起领导 Monolith；他是公司最主要的外部面孔、DOE
              贷款流程的政府关系牵头人，也是战略伙伴关系架构师。公司未公开披露继任计划。在 OC2 建设和融资关键阶段，如果 Hanson 因离职、疾病或外部任命离开，将构成实质性 thesis-break 事件。Hanson
              之外，Monolith 的等离子工程团队掌握全球稀缺专业能力；商业等离子甲烷热解人才池极小，Nebraska 乡村地理位置又加剧留才风险。MIT Technology Review 2023
              年对氢初创公司热潮的分析提醒，清洁氢公司常常高估近期商业牵引力，这也为执行怀疑提供了行业背景。
