        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >
              Monolith 工艺用电等离子体把天然气（甲烷）拆成碳黑和氢，替代传统炉法碳黑工艺。关键成本驱动是电力、天然气原料、capex 折旧和工厂 O&M。公司称其原料转化效率约 95%，相比传统炉法碳黑约
              55%，原则上应改善收率经济性。但等离子体工艺耗电强，使电价成为单位成本结构中的主导变量。公司没有披露官方每吨成本、EBITDA 利润率或毛利率数字。

              作为基准，上市碳黑生产商 Cabot Corporation 和 Orion Engineered Carbons 在特种等级上毛利率约为 20–35%。在 OC1 规模下，Monolith
              工艺相较在位炉法工艺很可能承担更高每吨电力成本和 capex 折旧，可能压缩当前产量下的利润率。低排放“绿色”碳黑溢价定价是公司利润率论点的核心——既来自 Goodyear
              等客户的可持续要求，也来自产品低硫特性。相较大宗等级，任何已实现绿色溢价的确切幅度均未披露。

