      - number: '3.3'
        title: 碳黑在位企业
        blocks:
          - type: paragraph
            body: >
              全球碳黑市场由少数大型、资本雄厚的生产商主导，它们拥有根深蒂固的分销网络和数十年客户关系。Cabot Corporation（NYSE: CBT, Boston, MA）成立于 1882
              年，是全球领先碳黑生产商，在 20 多个国家拥有 36 座以上制造工厂，约 4,500 名员工。Cabot 的 EVOLVE Sustainable Solutions
              平台提供含可持续原料的低排放碳黑产品，直接回应 Monolith 想服务的 ESG 偏好。Birla Carbon（Aditya Birla Group 旗下，India）是全球最大碳黑制造商之一，在 North
              and South America、Europe 和 Asia 均有设施。Birla Carbon 的 Continua SCM（Sustainable Carbonaceous
              Material）产品来自回收废旧轮胎，提供循环碳产品，与 Monolith 的等离子体衍生碳黑竞争同一批轮胎和橡胶应用。Birla Carbon 正在 Asia 这一增长最快的碳黑市场积极扩产。Orion
              S.A.（NYSE: OEC）从全球 15 座工厂供应碳黑，公司传承超过 160 年，根植于 Germany，并在那里运营全球运行时间最长的碳黑工厂。2026 年 6 月，Orion 在 China
              启动循环碳黑生产，其 CEO 曾公开表示，EU 气候政策要求生产脱碳，可能让欧洲制造商相较亚洲竞争者处于劣势。Tokai
              Carbon（Japan）是重要的全球碳黑生产商，以收购驱动的规模扩张著称。这些在位企业在既有客户认证、全球物流和价格稳定性上竞争；它们转向可持续产品，会直接侵蚀 Monolith 的绿色溢价差异化。
