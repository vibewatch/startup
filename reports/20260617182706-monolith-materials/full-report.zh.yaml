  - id: FM001
    title: 市场规模金字塔 — TAM / SAM / SOM
    type: pyramid
    layout: standard
    summary: |
      用三层口径估算 Monolith 可触达市场：从最宽的全球市场（TAM），到合并清洁产品可服务市场（SAM），再到 Monolith 满负荷 OC2 收入潜力（SOM）。
    data:
      items:
        - label: TAM — 全球炭黑 + 制氢 + 氨市场
          detail: 合并全球 TAM 约 $380B+（2026E）；因买家重叠，单个市场不能简单相加
        - label: SAM — 清洁 / 低碳炭黑 + 清洁 H2 + 绿氨
