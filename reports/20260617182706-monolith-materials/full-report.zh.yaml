chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Monolith Materials, Inc.——通常以 “Monolith” 品牌对外——是一家美国清洁技术公司，总部位于 600 P Street, Suite 310, Lincoln, Nebraska
              68508-2312。公司 2012 年最初以 Boxer Industries 名义在 California 州 Redwood City 注册成立，现注册地为 Delaware，并在 Nebraska 州
              Hallam 附近运营其旗舰商业设施 Olive Creek 1（OC1），距 Lincoln 东南约 25 英里。2018 年，公司把总部从 California 迁至
              Nebraska，让公司中心贴近商业化运营。


              一句话概括商业模式：用电等离子弧加热而非燃烧，把天然气（CH4）拆成固体碳黑（卖给轮胎和橡胶制造商）和氢气（转化为无水氨化肥），且不产生直接 CO2。Monolith 称其原料转化效率约
              95%，高于传统炉法碳黑的约 55%；这同时支撑了技术经济性和环境差异化。当前商业产品是面向 North America 轮胎制造商销售的特种碳黑；规划中的联产品是供应 Corn Belt 化肥市场的无水氨，并与
              Koch Fertilizer 签有长期承购协议。


              Monolith 是目前全球唯一以商业规模运营等离子体甲烷热解的公司。OC1 每年生产约 14,000 公吨碳黑。规划中的 Olive Creek 2（OC2）扩建每年将新增 180,000–194,000
              公吨碳黑和 275,000 公吨无水氨产能；若建成，OC2 将成为美国最大的碳黑工厂。截至 2024 年 9 月，OC2 已落后于进度，公司也被报道现金吃紧，但投资人追加了资金。
