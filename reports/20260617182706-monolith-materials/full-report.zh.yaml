      - number: '3.4'
        title: 氢气巨头与相邻玩家
        blocks:
          - type: paragraph
            body: >
              更广义的氢市场由蒸汽甲烷重整（SMR）生产的灰氢主导。每吨灰氢排放 6.6–9.3 吨 CO2。工业气体巨头——Air Products、Air Liquide、Linde——生产和分销氢的规模比
              Monolith 大几个数量级，但生产过程温室气体强度高。DOE 将天然气重整描述为氢的“近期具成本效益路径”，并预期低碳替代方案会在长期扩张。Nel Hydrogen（Norway）自 1927 年以来已在
              80 多个国家安装 3,800 多台电解槽，提供碱性和 PEM 电解制绿氢。Plug Power（US）是领先的绿氢经济公司，拥有燃料电池和电解槽产品线。Nel 和 Plug Power
              都代表绿氢竞争路径：电解槽成本下降、可再生电力价格走低之后，电解绿氢会相对热解绿松石氢更具成本竞争力。清洁氨玩家——包括 CF Industries、OCI Nitrogen 和 Koch
              Fertilizer（Monolith 的承购伙伴）——代表 Monolith 氢的终端市场。Koch 与 Monolith 的关系是承购方而非竞争者，能提供收入可见性，但也限制了 Monolith
              在氨市场的独立定价权。
