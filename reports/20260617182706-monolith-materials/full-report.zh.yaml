              Monolith 计划向 OC2 扩产——对应 13× 炭黑产能和整个氨业务——截至 2026 年 6 月仍未建成。2024 年 9 月融资轮源于据报的现金短缺和项目延期。$953M 的 DOE
              有条件贷款担保（OC2 规划中的主要债务工具）于 2025 年 5 月被 Trump 政府列为七项拟取消有条件承诺之一。失去 DOE 融资后，Monolith 需要找到约 $1 billion
              替代债务或股权资本，才能推进 OC2。
