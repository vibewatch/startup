            title: 原料与产品灵活性驱动韧性
            body: >
              Monolith
              工艺可接受天然气或炭黑油（CBO）作为原料，一旦天然气价格飙升，公司仍有供应链选择权。四个品牌炭黑等级（GreenBlack®、Bolt™、True™、Core®）覆盖轮胎、MRG、特种和通用市场，把客户集中风险分散到多个工业细分。副产氢可用于能源、氨或未来氢应用，提供额外商业灵活性。
