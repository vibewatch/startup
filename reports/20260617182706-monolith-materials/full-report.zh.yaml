      - number: '8.3'
        title: 公开可比公司与私募轮分析
        blocks:
          - type: paragraph
            body: >
              Monolith 处在一个不寻常的位置，横跨两个公开可比公司集合：炭黑特种化学品（Cabot CBT、Orion OEC）和清洁氢 / 工业气体（Plug Power PLUG、Air Products
              APD、Linde LIN）。没有一家公开公司完全匹配其双产品、早期商业化、重 CapEx 画像；私营领域最接近的参照是 C-Zero，该公司于 2022 年 5 月为甲烷热解完成 $50M Series
              B，但阶段更早。


              炭黑可比公司显示收入倍数较温和。Cabot Corporation 是全球特种化学品和炭黑龙头，约以 1.15× trailing revenue 交易（约 $4.6B 市值，对应约 $4.0B
              收入）。Orion S.A. 是更纯粹的炭黑公司，交易价格大幅折价（约 $436M 市值，EPS 为负，处于财务困境）。按 OC1 估计每年 $14–20M 炭黑收入，即便给予相对 Cabot P/S 3–5×
              的慷慨溢价，炭黑业务价值也只有 $42–100M。


              氢可比公司更能支持偏高倍数。Plug Power 以 $164M LTM 收入约 23× EV/revenue 交易，反映市场愿意等待清洁氢规模化。Air Products 和 Linde
              是大型一体化工业气体公司，盈利质量根本不同。BNEF 指出，绿松石氢在规模化后可接近灰氢成本平价，支撑长期溢价。但 Monolith 尚未达到该规模。


              诚实的可比结论是：Monolith 的 $1B+ 估值只有作为 OC2 期权才站得住，而且定价来自 2021–22 年清洁能源风投倍数高点。CB Insights 独角兽市场地图显示，截至 2026 年全球有
              1,276 家独角兽，许多正面临倍数压缩。气候科技风投资金自 2023 年以来承压。Monolith 的独角兽标签是遗留标签，不是当前市场确认。
