      - number: '8.5'
        title: 退出就绪度与最终尽调要求
        blocks:
          - type: paragraph
            body: >
              Monolith 的退出准备还很早。公司没有 IPO 申报、没有披露聘请投行，也没有公开可查的二级市场交易数据。公司仍是私营状态，股权结构集中。潜在退出路径包括：（a）被大型炭黑生产商（Cabot、Birla
              Carbon）或工业气体公司（Air Products、Linde、Air Liquide）战略收购，买方寻求绿松石氢产能；（b）OC2 投产且收入形成规模后 IPO；或（c）DOE
              贷款结果落定后，继续靠私募融资或项目融资再融资推进。


              战略买家可能会按高于 OC1 独立价值的溢价给平台定价，但考虑监管不确定性，可能大幅折价 OC2 的期权价值。基准情形下，IPO 至少还要 3–5 年。没有明确退出事件，早期投资人的二级流动性有限。


              证据缺口仍然关键：精确估值未披露、近期融资没有 Form D、没有公开收入数据、DOE 状态未决、优先权结构未知。因此本章的明确建议是 **research-more**。以下尽调动作会实质改变判断：（1）确认
              OC1 EBITDA 和炭黑实际成交价；（2）取得股权结构表和清算瀑布分析；（3）厘清 DOE 决策时间表；（4）核查 OC2 CapEx 预算，以及没有 DOE 担保时的融资计划；（5）鉴于 CEO Rob
              Hanson 已任职 14 年，评估管理层留任和接班安排。
