  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 等离子甲烷热解：技术架构
        blocks:
          - type: paragraph
            body: >
              Monolith 的核心工艺是热等离子甲烷热解：用可再生电力驱动直流（DC）等离子炬，生成超过 800°C
              的高温等离子射流。天然气（甲烷，CH4）注入等离子反应区后，气动和电磁力推动等离子气体与原料快速强混合。没有氧气参与，因此不发生燃烧；CH4 分子受热裂解为固体碳和氢气（CH4 → C +
              2H2）。固体碳被收集、调质，并加工成商业级炭黑。副产氢被分离后，可以在现场供能；在规划中的 OC2 扩建中，也可以通过 Haber–Bosch 工艺转化为氨。

              等离子炬采用两个同心圆柱石墨电极，并以氢气作为成等离子气体。电源设定为至少两倍平均运行电压，以保持炬稳定；点火脉冲电压至少 20
              千伏。反应器设计让反应区不直接接触任何壁面，产物随后急冷，以保留炭黑形貌。Monolith 声称，其原料转化效率约 95%，而传统油炉法炭黑约为 55%；在等量炭黑产出下，化石原料用量减少约 50%，耗水减少
              40%，用地减少 50%，相较传统炉黑制造，CO2、SOx 和 NOx 排放最多降低 80%。每个生产单元（称为一列 “train”）采用模块化设计，可以在同一场址复制端到端占地，逐步增加产能。
