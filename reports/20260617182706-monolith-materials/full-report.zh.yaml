  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Monolith 投资逻辑中最大的单一风险，是 DOE 于 2021 年 12 月按 2005 年 Energy Policy Act 第 17 章第 1703 条承诺的 $953 million
              有条件贷款担保被取消。截至 2025 年 5 月，Semafor 报道称，Trump 政府的 Department of Energy——现已更名为 Office of Energy Dominance
              Financing（EDF）——计划取消七项清洁能源有条件承诺，Monolith 被明确点名。Reason.com 称 Monolith 是三家预计将失去联邦绿色能源贷款支持的公司之一。DOE
              发言人表示“尚未作出决定”，但考虑到政府对清洁能源补贴的公开立场，政治风险仍然尖锐。贷款的有条件性质意味着，在资金拨付前，Monolith
              必须满足尽调里程碑、项目就绪基准和财务条件；任何条件未达成，也可能在政治决策之外构成自我取消事件。

              DOE 贷款之外，OC2 在 Nebraska 的建设和运营需要多层环境许可。根据联邦 Clean Air Act，新的主要固定污染源必须通过 New Source
              Review（NSR）取得预施工许可；排放超过主要源门槛的工业设施必须取得 Title V 运营许可，由 Nebraska Department of Environment and
              Energy（NDEE）在州层面管理。许可延误、拒批或附加条件，可能实质拉长 OC2 时间表，或迫使公司进行高成本排放控制改造。Monolith
              的专有等离子技术在空气许可上没有直接监管先例，监管方可能要求额外环境审查或施加新条件。对一家纵向一体化工艺技术公司而言，知识产权和专利风险相对较低，但商业秘密暴露，以及新兴热解竞争者（C-Zero、Aurora
              Hydrogen、Hazer Group）发起潜在专利挑战，仍构成潜在法律风险。
