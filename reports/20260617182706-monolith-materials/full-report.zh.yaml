      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              估算 Monolith 的可服务市场，需要在三个子市场之间三角验证，而各发布方采用的方法和口径并不相同。全球碳黑市场规模最一致：Mordor Intelligence（2026 更新）估计 2026 年为
              $25.95 billion，2031 年增至 $33.82 billion，CAGR 为 5.44%。轮胎和工业橡胶贡献 2026 年收入的 73.85%；Asia-Pacific 占销量的
              61.85%。2023 年新闻稿引用的 Grand View Research 数字称 2030 年市场价值为 $26.9 billion，CAGR 为 5.0%，大体一致。Transparency Market
              Research 估计 2031 年为 $27.46 billion，略低。2030–2031 年碳黑发布方区间为 $27–34 billion，可信中点接近 $30
              billion。氢市场方面，估算因定义范围不同而差异巨大。Allied Market Research 预计 2031 年总氢气生产为 $262 billion（所有类型）。2024 年
              GlobeNewswire 引用的 Precedence Research 数字称更广义氢市场到 2032 年达 $642 billion，CAGR 为 9.28%，反映了不同口径（包括氢衍生产品和燃料）。更早的
              Brandessence 估计称氢气生产到 2030 年为 $410 billion。清洁氢（低排放子集）今天要小得多：Mordor Intelligence 预计 2031 年清洁氢供应为 13.75
              MTPA，CAGR 为 25.03%。2023 年全球实际运营的清洁氢仅 0.8 Mt / 年（Hydrogen Council）。Hydrogen Council 跟踪到已通过 FID 的产能为 3
              Mt/yr，2030 年前已宣布产能为 38 Mt/yr，但其预计到 2030 年现实部署仅 12–18 Mt/yr，意味着 50–70% 的流失缺口。氨市场 2026 年按量约为每年 197 million
              吨（Mordor Intelligence），2031 年增至 216 million 吨，CAGR 为 1.89%。Polaris Market Research 2023 年数字预计 2030 年氨市场价值为
              $100.8 billion；Research Nester 估计 2033 年为 $94.4 billion。绿色 / 清洁氨今天仍只占很小一部分。Monolith 在 OC2 满产规模下的
              SOM（180,000–194,000 t/yr 碳黑 + 275,000 t/yr 氨）意味着，按碳黑约 $1,500/t 可贡献约 $270–300 million/yr，按氨约 $600–800/t
              可贡献约 $165–220 million/yr，合计峰值收入约 $440–520 million/yr。这不到碳黑加氨合并市场的 2%，反映其在大市场中的利基位置。
