      - number: '1.4'
        title: 规模、里程碑与负面事件
        blocks:
          - type: paragraph
            body: >-
              Monolith 的时间线从 2012 年在 California 创立开始，一直延伸到成为全球唯一商业规模等离子体甲烷热解运营商。运营上，OC1 于 2020 年 9 月投产，成本约 $100
              million，每年生产约 14,000 公吨碳黑。OC2 扩建最初目标约 2026 年完工，规划规模是 OC1 的 13 倍，并将使 Olive Creek 成为美国最大的碳黑工厂。


              负面事件包括三项相互交织的风险：（1）用水争议——2020 年 6 月，OC2 初始环境披露称每年需要 2.3 至 4.6 billion
              加仑地下水，引发社区和监管批评；管理层随后根据进一步工程设计，将数字下调至每年 450–800 million 加仑。（2）DOE 贷款取消风险——2025 年 5 月，Semafor 报道 Trump
              政府计划取消 Monolith 的 $953M DOE 条件性承诺，DOE 既未确认也未否认。（3）现金短缺——2024 年 9 月，Monolith 据称现金吃紧且 OC2
              进度延误，需要既有投资人追加一轮股权融资。


              尽管逆风存在，投资人自公司创立以来仍在七次已确认的不同融资事件中持续支持。SEC Form D 备案（CIK 0001574098）记录了 2013 年至 2021 年九轮豁免发行，确认了即便在 2022
              年标志性独角兽轮之前，私人资本活动也持续存在。OC1 生产的碳黑如今已进入 North America 各地的轮胎；即便 OC2 尚未建成，这也至少给公司提供了一个温和的商业验证点。
