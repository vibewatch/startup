      - number: '7.4'
        title: 缓释框架与终止标准
        blocks:
          - type: paragraph
            body: >-
              投资人和利益相关方应围绕四类风险，监控一组明确的先行指标和论点破裂触发器。监管方面，近期最关键的可观察事项，是 DOE Office of Energy Dominance Financing 是否就
              Monolith 有条件承诺状态发布正式公告。一旦出现正式取消通知，应立即重新评估组合，因为 Monolith 没有披露等效替代融资工具；公司将需要筹集 $953M+ 私人资本，或大幅缩小 OC2
              计划。反过来，有条件承诺转为已关闭贷款，将是重大降风险事件。提交给 Nebraska NDEE 的预施工空气许可申请及其批准或拒绝，也是可跟踪的监管信号。

              运营监控应聚焦 OC2 建设进度公告：任何确认实质完工里程碑、设备订单或场地准备进展的公告，都会降低规模化不确定性。若 2026 年后仍缺少这类公告，则显示进一步延期。通过 EIA Henry Hub
              数据监控天然气价格，可实时代理原料成本；价格持续高于 $5/MMBtu 时，应立即做利润率压力测试。炭黑现货价（N330 等级）若连续两个季度低于
              $800/公吨，将意味着高溢价绿松石路线产品在面对传统竞争时遭遇显著利润率压缩。

              Rob Hanson 的关键人风险应通过 LinkedIn、新闻稿和公司任何沟通来监控。Koch 集中带来的伙伴风险，应通过跟踪 Monolith 是否宣布任何额外氨承购协议来监控；如果到 OC2
              商业运营时仍没有多元化，收入将高度集中。财务终止标准很直接：如果 Monolith 需要一轮紧急稀释性融资（>50% 稀释），或转向过桥债融资，股权回报曲线将实质受损。希望尽调这些风险的投资人应索取：完整 DOE
              有条件承诺条款书；OC2 施工合同条款和完工保证；天然气供应协议；Koch 承购合同条款，包括终止条款；以及经确认的高管继任计划。
