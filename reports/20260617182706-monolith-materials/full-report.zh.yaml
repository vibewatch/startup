    rows:
      - - 炭黑（低碳 / 特种）
        - 相比传统炉法炭黑的溢价；全球市场约 $26B（2026）；特种牌号（轮胎、电池、涂料）
        - 传统石油炉法炭黑（不计碳）；回收 / 再生炭黑（rCB）
        - 轮胎 OEM（Goodyear、Michelin、Bridgestone）、工业橡胶制造商、电池生产商
        - OC1 当前核心产品；OC2 扩建的价值驱动来自低碳认证溢价
      - - 绿松石 / 清洁氢
        - 等离子体甲烷裂解制氢（无直接 CO2）；按 DOE / IEA 定义可作为低碳 H2
        - 未减排 SMR 制灰氢；SMR+CCS 制蓝氢；电解制绿氢（生产路径不同）
        - 氨生产商、工业 H2 用户、DOE 区域 H2 Hub 锚定买家
        - Monolith 制氨的中间原料；H2 收入取决于清洁 H2 价格溢价能否建立
      - - 清洁 / 绿色无水氨
        - 以绿松石 H2 通过 Haber-Bosch 制氨；覆盖有低碳认证的化肥和工业市场
        - 传统 SMR+HB 灰氨（当前占全球供应 >98%）
        - 化肥分销商（Koch Fertilizer）、农业合作社、工业化学品买家
        - OC2 的主要收入产品；Koch 长期承购协议是核心需求锚
      - - 工业脱碳（H2 邻近）
        - 钢铁、炼油和数据中心使用的工业氢，需要低碳供应链
        - 交通领域燃料电池车辆用 H2（物流链不同）；电网调峰用氢
        - 寻求低碳能源的炼厂、钢厂、数据中心运营商
        - 较长期邻近市场；不是近期 OC2 主要收入线；取决于区域 H2 Hub 需求发展
    notes: 细分边界反映截至运行日期 Monolith 的实际和计划产品组合。清洁氨和清洁 H2 溢价尚未在公开市场定价中确立。
