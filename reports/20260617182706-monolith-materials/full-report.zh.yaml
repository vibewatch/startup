      - number: '5.4'
        title: 差异化：专有 IP 与制造诀窍
        blocks:
          - type: paragraph
            body: >
              Monolith 最主要的技术差异化，来自其覆盖等离子炬设计、反应器架构、炭黑表面功能化和下游加工的专有专利组合。已授权专利包括：等离子炬设计专利（US12144099，2024 年 11
              月授权），覆盖提升效率和效果的同心电极几何改进；DC 等离子炬电源设计（US12250764，2025 年 3 月授权），规定稳定炬运行的电源与运行电压比；炭黑生成系统（US11987712，2024 年 5
              月授权），覆盖定义 OC1 工艺的气动原料注入和无再循环反应器几何；以及定制炭黑制备方法（US12497517，2025 年 12 月授权），覆盖颗粒形成过程中及之后的表面功能化，以适配特定终端用途。

              等离子工艺本身的技术谱系可追溯至挪威公司 Kværner（现 Aker Solutions）。Kværner 在 1997 至 2003
              年运营过此前唯一的商业规模甲烷热解工厂；该工厂因炭黑质量不足而退役。Monolith 约在 2013–2020 年间打磨技术，先在 California Redwood City 的 Seaport
              示范工厂，再到 OC1，目标是解决质量问题，达到高端轮胎和特种市场要求的高纯度等级。Wall Street Journal 引述 Monolith 可实现较传统方法约少 95%
              排放，这既凸显工艺优势，也强化公司作为唯一商业规模运营生产商的定位。该工艺的原料灵活性（不仅可用天然气，也可用炭黑油 CBO）带来额外供应链韧性。OC1 也是美国 50
              多年来新建的第一座炭黑工厂，对国防和汽车客户形成国内供应安全优势。
