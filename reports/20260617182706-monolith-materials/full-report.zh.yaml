      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: DOE 贷款取消是最核心的二元风险
            body: >-
              $953M 的 DOE 有条件贷款担保是 OC2 的融资支柱。如果如 2025 年 5 月信号所示被取消，Monolith 就要在气候科技资本市场收紧的窗口里替换近 $1B
              项目融资，很可能付出显著稀释代价。单一事件就可能把企业价值从 $1B+ 区间拉回 $70–120M 的 OC1 独立估值区间。任何投资论证都必须明确测算“没有 DOE 贷款”的情形。
            calloutType: risk
            claimRefs:
              - CV026
              - CV027
              - CV028
              - CV037
          - type: callout
            title: 2022 年或 2024 年融资没有公开 Form D，是重大证据缺口
            body: >-
              Monolith 最近一次 SEC Form D 申报日期是 2021 年 6 月（金额 $120M）。2022 年 7 月 $300M 和 2024 年 9 月 $300M+ 轮次没有对应的公开 Form
              D，外部无法独立验证证券类型、每股价格或隐含投后估值。对这种规模的股权融资而言，这一缺失并不寻常，尽调需要专门追问。
            calloutType: insight
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
          - type: callout
            title: $1B+ 估值押注的是 OC2 期权，不是 OC1 经济性
            body: >-
              Monolith 的独角兽标签建立在 OC2 的未来价值上，而不是当前 OC1 运营。按 Cabot 约 1.15× 炭黑 P/S 乘数套用到 OC1 估计 $14–20M 收入，价值只有 $16–23M，远低于
              $1B+ 标记。两种估算之间的差额就是 OC2 期权溢价；DOE 取消风险和现金短缺报道已经严重削弱这部分溢价。
            calloutType: assumption
            claimRefs:
              - CV013
              - CV015
              - CV034
              - CV036
              - CV037
          - type: callout
            title: 继续研究 — 可能改变判断的三项尽调事件
            body: >-
              只有满足三项条件，建议才会升至「跟踪」或「买入」：（1）DOE 贷款正式恢复，或可信的替代 OC2 债务融资方案已经到位；（2）经审计的 OC1 财务数据确认 EBITDA
              为正，且流动性跑道已有资金覆盖；（3）完整股权结构表和清算瀑布披露，并显示入场时普通股回报潜力可接受。没有这些证据，$1B+ 估值无法充分压力测试。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV022
              - CV026
              - CV027
