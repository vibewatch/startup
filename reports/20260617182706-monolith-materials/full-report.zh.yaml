      - number: '6.3'
        title: 留存、集中风险与扩张前景
        blocks:
          - type: paragraph
            body: >
              Monolith 的客户耐久性建立在狭窄但战略意义重大的基础上。Goodyear 合作协议和 Koch Fertilizer
              长期承购交易构成锚定承诺，但两者都没有披露续约条款、定价机制或终止条款。Monolith
              是私营公司，没有公开投资者报告义务，也未发布经审计商业指标，因此没有披露净收入留存（NRR）、总收入留存（GRR）或流失指标。客户集中风险实质存在：两个具名锚定买方——炭黑侧的 Goodyear 和氨侧的
              Koch Fertilizer——占据 Monolith 可见需求管线的大部分。如果任何一段关系恶化，或 OC2 建设进一步延期或取消（2025 年 5 月潜在 DOE 贷款取消和 2024 年 9
              月现金短缺都凸显该风险），收入预测可能显著受损。更广泛采用也有真实采购摩擦：新的轮胎行业客户必须按严格 OEM 规格认证 Monolith 炭黑等级，这通常是多年流程。如果 Monolith
              成功进入电池级炭黑市场（True 产品线），且 SK 或 MHI 在亚洲市场借助该技术部署氢或炭黑业务，扩张上行仍然存在。若 OC2 完工，Koch Fertilizer
              覆盖全区的分销网络使玉米带氨市场成为近期扩张路径。但在 OC2 投产前，大多数具名商业协议仍是有条件的。
