      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2012 年以来，Monolith 多轮股权融资累计超过 $570 million，是绿松石氢和碳黑领域资本最充足的私营清洁技术公司之一。早期投资方 Cornell Capital、Warburg
              Pincus 和 Azimuth Capital Management 从早期轮次就支持公司；到 2020 年 10 月，Monolith 已融资约 $274 million。战略投资方 Mitsubishi
              Heavy Industries（2020 年 12 月）和 SK Inc. / NextEra Energy（2021 年 6 月）随后进入股东名单，验证了该技术对亚洲工业企业和美国能源公用事业公司的吸引力。


              2022 年 7 月，Monolith 完成关键的 $300 million 股权融资，由 TPG Rise Climate 和 Decarbonization Partners（BlackRock 与
              Temasek Holdings 的合资平台）领投，Warburg Pincus 和 Cornell Capital 参投。这轮融资把 Monolith 估值推至 $1 billion
              以上，使其获得独角兽地位。2024 年 9 月，同一批既有投资人又完成一轮超过 $300 million 的融资——但媒体和第三方来源称公司现金吃紧且 OC2 延误，因此该轮在一定程度上是防守性的 runway
              延长。


              2021 年 12 月，Monolith 获得 U.S. Department of Energy Loan Programs Office（DOE LPO）依据 2005 年 Energy Policy Act
              Title 17, Section 1703 作出的 $953 million 条件性贷款担保承诺。这是 DOE 多年来第一笔非核能条件性贷款，也是 OC2 项目融资的关键支柱。截至 2025 年 5
              月，Trump 政府据称计划取消该承诺以及另外六项清洁能源条件性承诺；DOE 发言人表示“尚未作出决定”。截至 2026 年 6 月，该贷款的正式状态未知，给 OC2 商业案例带来重大不确定性。Monolith
              从未精确披露估值；2022 年 7 月确立的 $1B 独角兽门槛只是下限。收入未公开披露。
