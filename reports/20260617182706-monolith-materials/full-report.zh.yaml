      - - 正方
        - 商业规模等离子体甲烷热解的先行者，没有直接的大规模竞争对手
        - IP 保护丧失，或有资金支持的竞争对手进入商业规模
      - - 正方
        - 双产品收入模型用清洁氢溢价对冲炭黑大宗商品风险
        - 非轮胎用途拉低炭黑需求，或氢价崩盘
      - - 正方
        - 一线投资者财团（TPG Rise Climate、Warburg Pincus、Decarbonization Partners）提供资本跑道和政策通道
        - 财团收缩，或在没有 DOE 担保时无力填补 OC2 资金缺口
      - - 正方
        - Koch Fertilizer 长期氨承购协议降低 OC2 氢收入风险
        - Koch 违约或重谈承购；氨市场状况恶化
      - - 反方
        - 当前 OC1 收入（估计约 $14–20M）意味着 $1B+ 估值对应 >50× 收入倍数
