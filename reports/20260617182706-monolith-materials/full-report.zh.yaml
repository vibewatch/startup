        title: 客户群体细分
        blocks:
          - type: paragraph
            body: >
              Monolith 通过等离子热解工艺服务两个结构上不同的终端市场。第一是炭黑市场——这是一种全球大宗品，主要用于轮胎和橡胶制造（约 70% 消费量），也用于特种涂料、油墨、电池和机械橡胶制品。当前 OC1
              产出（约 14,000 公吨 / 年）销售给北美轮胎供应链。Monolith
              提供四条品牌产品线——GreenBlack（轮胎补强）、Bolt（低硫应用）、True（高纯特种）、Core（通用）——可按应用和规格细分。第二个终端市场是清洁氨 /
              化肥，目标是美国玉米带（Iowa、Illinois、Indiana、Nebraska 及相邻州）；该区域合计每年进口超过 170 万公吨无水氨。OC2 预计每年生产约 275,000
              公吨氨，部分填补这一本土供应缺口。战略投资伙伴 SK Inc.（韩国）和 Mitsubishi Heavy
              Industries（日本）构成第三类——工业集团，可能对在更广泛业务中部署氢和炭黑技术有商业兴趣——但两者均未公开披露商业承购协议。地域目前集中在美国玉米带和本土轮胎供应链；国际商业化仍是中期愿望。
