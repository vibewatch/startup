  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反面逻辑
        blocks:
          - type: paragraph
            body: >
              Monolith 的投资逻辑建立在三根支柱上：（1）专有等离子甲烷热解平台，是全球唯一大规模商业化实现，形成可专利化的先发护城河；（2）双产品收入模型，同时变现炭黑和绿松石氢 /
              氨，让每条产品线补贴另一条的成本；（3）高质量投资人联盟（TPG Rise Climate、Warburg Pincus、Decarbonization Partners、Cornell
              Capital、Azimuth Capital），既提供资本，也提供政策可信度。


              反面逻辑同样有力。Monolith 唯一运营中的工厂 OC1 每年生产约 14,000 公吨炭黑，意味着估计年收入约 $14–20M——远低于用市场可比公司支撑 $1B+ 估值所需的任何财务门槛。规划中的 OC2
              扩建将产能提升至约 180,000–194,000 MT/yr 炭黑，并新增约 275,000 MT/yr 氨，但完全取决于 2021 年 12 月宣布的 $953M DOE 有条件贷款担保。截至 2025 年
              5 月，Trump 政府释放计划取消该担保及另外六项担保的信号；DOE 表示尚未作出最终决定。与此同时，Wall Street Journal 于 2024 年 9 月报道称 Monolith
              “现金吃紧并面临项目延期”——当地 Lincoln 报道也印证了这一点。同月披露的 $300M+ 追加轮完全来自既有投资人，更像一笔过桥融资，而非强劲的新投资人背书。公开股权可比公司（Cabot
              CBT、Orion OEC）交易在 1–1.15x 收入；按 OC1 收入计，Monolith 隐含估值倍数超过 50–70x——这个溢价只能靠 OC2 期权价值维持。监管和融资不确定性已经削弱了该期权价值。


              因此，估值立场是 **偏高**：在乐观的 OC2 完工情景下，$1B+ 标记技术上可以解释，但当前运营和公开可验证财务披露并不足以支撑。建议是 **research-more（继续研究）**，不是放弃：如果
              DOE 贷款恢复、现金头寸确认稳健，且 OC2 按计划重启建设，投资逻辑可以支撑更高估值。
