      - number: '3.2'
        title: 直接同业：绿松石氢与热解氢玩家
        blocks:
          - type: paragraph
            body: >
              Ekona Power（Vancouver, BC, Canada）是商业推进最靠前的绿松石氢同业。Ekona 的脉冲燃烧甲烷热解平台同时生产清洁氢和固体碳，不需要 CCS 基础设施、水或贵金属。Ekona 于
              2025 年完成 Gen1 Burnaby Pilot——一座 200 kg-H2/day 设施——并正在开发面向商业部署的 Gen2 xCaliber 反应器。Ekona 已获得 Natural
              Resources Canada 和 Alberta Innovates 等政府资金支持，并以固体碳收入抵扣来定位为可与灰氢成本竞争。Ekona
              路线图从试点扩张走向现场示范项目，再到早期商业项目，暗示商业化时间线为 2027–2029 年。Aurora Hydrogen（Edmonton, AB）采用微波驱动甲烷热解，路径不同于 Monolith
              的热等离子体和 Ekona 的脉冲燃烧，可在无 CO2、无贵金属、无需新增基础设施的条件下制氢。Aurora 位于 Edmonton 的 200 kg-H2/day 工业规模示范装置得到
              Chevron、Shell、Williams 和 Energy Innovation Capital 支持。Modern
              Hydrogen（US）向公用事业和交通机构部署基于热解的脱碳方案；固体碳用于道路和基础设施，而不是卖给轮胎制造商。Modern Hydrogen 于 2025 年 7 月与 CPS
              Energy（Texas）合作，开展天然气制氢发电试点。Hazer Group（ASX-listed, Australia）以铁矿石为催化剂，把天然气转化为氢和高品质石墨，而非常规碳黑；KBR 是 Hazer
              的全球商业化伙伴。Graforce（Germany）部署 Plasmacylzer® 模块用于甲烷和生物甲烷热解；其在 RAG Austria AG 投运一座工厂，每小时生产约 50 kg H2 和约 150
              kg 固体碳；目标是欧洲工业脱碳。这些同业都尚未达到 Monolith 的商业规模或承购广度，但代表技术竞争正在加剧。
