      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >
              碳黑买家集中在少数全球轮胎制造商和工业橡胶制品生产商手中；切换供应商前，他们会走严格的等级认证流程。前五大轮胎 OEM——包括 Bridgestone、Michelin、Continental、Goodyear
              和 Sumitomo——贡献全球碳黑需求的大部分。Goodyear 是已确认的 Monolith 碳黑客户。这些买家的采纳触发点主要是企业可持续承诺中嵌入的 Scope 3 减排要求，以及 EU
              供应链尽职调查法规（CSDDD）和 SEC 气候披露规则日益强化的要求。预算所有权在 OEM 的采购和可持续职能部门，新供应商认证审批周期为一至三年。绿松石氢和无水氨方面，主要买方是美国最大的农业氨生产商
              Koch Fertilizer。Koch 已与 Monolith 签署长期承购协议，采购规划中 OC2 设施生产的氨。这使 Koch 同时成为买方和物流伙伴，因为 Koch 运营着毗邻天然气枢纽的
              Oklahoma 州 Verdigris 氨综合体。预算所有权在 Koch 的大宗商品采购部门；承购合同为 Monolith 项目融资提供量价确定性。下游化肥分销商和农业合作社是最终付款方；截至 2026
              年，氨仍按大宗商品定价，尚无成熟绿色溢价。工业氢买家——炼油厂、钢厂和新兴数据中心电力客户——可能是更长期进入的细分市场。DOE 的 Regional Clean Hydrogen Hubs 计划（IRA 资金
              $8 billion）旨在围绕生产集群聚合工业 H2 需求，可能在 Nebraska 附近创造拉动型市场条件。特种碳黑在电池和 EV 领域的买家是新兴细分市场：Mordor Intelligence
              称涂层应用（包括电池用导电碳黑）到 2031 年 CAGR 为 6.92%，高于整体市场增速。
