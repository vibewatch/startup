  evidenceGaps:
    - type: missing-source
      severity: material
      topic: turquoise hydrogen market
      missingEvidence: "A dedicated market sizing study for turquoise hydrogen specifically (separate from green and blue hydrogen), with volume, value, and CAGR estimates for the methane-pyrolysis production pathway."
      whyItMatters: "Without a turquoise-specific TAM, the chapter cannot isolate Monolith's addressable niche within the broader clean hydrogen market; the current estimate is a residual derived from 13.75 MTPA total clean H2."
      diligencePath: "Commission proprietary market research on turquoise hydrogen niche or request Monolith's internal market-sizing model."
      relatedQuestionRefs:
        - QM021
        - QM022

    - type: private-evidence-only
      severity: material
      topic: carbon black premium pricing
      missingEvidence: "Verified price premium for certified low-carbon carbon black over conventional furnace black in commercial contracts."
      whyItMatters: "The commercial case for Monolith's OC1 and OC2 depends on achieving a price premium over furnace black. No public price data for certified low-carbon CB exists; ChemAnalyst covers commodity N330 grades only."
      diligencePath: "Request Monolith's realized average selling price for OC1 carbon black vs benchmark N330 grade; request contracted OC2 price terms."
      relatedQuestionRefs:
        - QM011

    - type: private-evidence-only
      severity: blocking
      topic: OC2 financing status
      missingEvidence: "Current status of OC2 project financing, including whether the DOE conditional commitment has been formally withdrawn and what alternative capital sources have been secured."
      whyItMatters: "OC2 is the primary source of projected TAM penetration and revenue scale; without financing closure, the entire SOM analysis is contingent."
      diligencePath: "Request current OC2 financing status, DOE communication on conditional commitment, and backup capital plan from Monolith directly."
      relatedQuestionRefs:
        - QM016
        - QM024

    - type: conflicting-data
      severity: material
      topic: hydrogen market sizing
      missingEvidence: "Resolution of the 4x+ spread in global hydrogen market size estimates (AMR $262B by 2031 vs Precedence $642B by 2032), including scope definitions, geographic coverage, and product boundary used by each publisher."
      whyItMatters: "Investors cannot derive reliable TAM or SAM figures without understanding why estimates differ so dramatically; the spread is large enough to change investment conclusions."
      diligencePath: "Obtain methodology appendices from at least two of the major market research publishers or engage an independent analyst with proprietary H2 market models."
      relatedQuestionRefs:
        - QM014
        - QM020

    - type: missing-source
      severity: minor
      topic: Koch ammonia offtake terms
      missingEvidence: "Specific terms of Koch Fertilizer's long-term ammonia offtake agreement: volume, pricing, term length, and conditionality (e.g., contingent on OC2 financing close)."
      whyItMatters: "If the Koch agreement is best-efforts or contingent on OC2 closing, the apparent demand anchor is weaker than stated."
      diligencePath: "Request offtake agreement term sheet or summary from Monolith; review any SEC or DOE filings referencing the Koch agreement."
      relatedQuestionRefs:
