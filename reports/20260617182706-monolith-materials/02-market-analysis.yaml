  - id: buyer-segmentation
    title: Buyer and User Segmentation
    body: >
      Carbon black buyers are concentrated among a small number of global tire manufacturers and industrial
      rubber goods producers who run rigorous grade-qualification processes before switching suppliers. The
      top five tire OEMs — including Bridgestone, Michelin, Continental, Goodyear, and Sumitomo — account
      for a majority of global carbon black demand. Goodyear is a confirmed Monolith customer for carbon
      black. Adoption trigger for these buyers is primarily Scope 3 emissions reduction mandates embedded in
      corporate sustainability commitments and increasingly in supply-chain due-diligence regulations in the
      EU (CSDDD) and SEC climate disclosure rules. Budget ownership sits with procurement and sustainability
      functions at OEMs, with approval cycles of one to three years for new supplier qualification.
      For turquoise hydrogen and anhydrous ammonia, the primary buyer is Koch Fertilizer, the largest US
      producer of agricultural ammonia. Koch has signed a long-term offtake agreement with Monolith for
      ammonia from the planned OC2 facility. This makes Koch both buyer and logistics partner, as Koch
      operates the Verdigris, Oklahoma ammonia complex adjacent to a natural gas hub. Budget ownership is
      commodity procurement at Koch, with the offtake contract providing volume and price certainty for
      Monolith's project finance. Fertilizer distributors and agricultural cooperatives downstream represent
      the end payers, with ammonia priced as a commodity with no established green premium as of 2026.
      Industrial hydrogen buyers — refineries, steel mills, and emerging data-center power customers — are
      potential longer-term segment entrants. DOE's Regional Clean Hydrogen Hubs program ($8 billion from
      IRA) is designed to aggregate industrial H2 demand around production clusters, which could create
      pull-market conditions near Nebraska. Battery and EV-sector buyers of specialty carbon black are an
      emerging segment: Mordor Intelligence cites coating applications (which include conductive carbon black
      for batteries) growing at 6.92% CAGR through 2031, above the overall market rate.
