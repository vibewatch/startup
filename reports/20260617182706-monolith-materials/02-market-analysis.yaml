  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Monolith
      - Diligence Ask
    rows:
      - - US IRA 45V clean hydrogen tax credit (up to $3/kg H2)
        - Driver
        - 2023–2032 (IRA term)
        - Improves turquoise H2 project economics; increases willingness-to-pay from industrial buyers if credits flow through to pricing
        - Will Trump-era IRA modifications reduce or revoke 45V for methane-pyrolysis H2?
      - - DOE Regional Clean Hydrogen Hubs ($8B IRA)
        - Driver
        - 2025–2030
        - Creates demand anchors for H2 near Monolith's Nebraska site; reduces buyer acquisition cost
        - Has Monolith been designated as a preferred supplier to any H2 Hub?
      - - EU RED III hydrogen targets and carbon border adjustment
        - Driver
        - 2025–2030
        - EU-based tire/auto OEMs require low-carbon inputs to comply with CBAM and Scope 3 reporting; drives premium
        - Confirmed Goodyear and other EU-linked OEM procurement agreements for certified low-carbon CB?
      - - Scope 3 / ESG reporting mandates for OEM supply chains
        - Driver
        - Now–2028
        - Tire and industrial buyers adopt low-carbon supplier preferences; willingness to pay premium for certified CB
        - What certified price premium over furnace black has Monolith achieved with existing customers?
      - - Natural gas feedstock cost volatility
        - Constraint
        - Ongoing
        - Methane is the primary feedstock; gas price spikes compress margin; no natural gas price hedge disclosed
        - What is Monolith's gas price sensitivity per $1/MMBtu move, and are gas prices locked in OC2 contracts?
      - - Capital intensity of plasma pyrolysis scale-up
        - Constraint
        - 2025–2028
        - OC2 requires $1.5B+ in total capital (equity + DOE loan); relies on conditional DOE financing not yet closed
        - Has Monolith secured bridge financing or alternative capital for OC2 in the event DOE loan is cancelled?
      - - DOE conditional loan cancellation risk
        - Constraint
        - 2025–2026
        - Semafor (May 2025) reported Trump administration plans to cancel Monolith's $953M conditional commitment; loss would require full private refinancing
        - Has DOE formally withdrawn the conditional commitment letter? What is Monolith's backup financing plan?
      - - Grey hydrogen price competition ($1–1.5/kg from SMR)
        - Constraint
        - Ongoing
        - Turquoise hydrogen estimated at $2–4/kg all-in; no established clean-H2 premium in US wholesale market prevents cost-competitive entry without policy support
        - What is current realised turquoise H2 price vs grey H2, and is there a documented buyer premium?
      - - Scale-up execution risk (OC2 not yet operational)
        - Constraint
        - 2025–2030
        - OC2 remains in development; Wall Street Journal and Reason Foundation reported cash shortages and delays in September 2024; missing OC2 delays revenue 3–5 years
        - Current OC2 construction status, funding close date, and revised commissioning timeline?
    notes: "Timing indicates when each driver/constraint is most acute. Diligence asks are unresolved as of run date. Policy drivers are subject to US administration change risk."
