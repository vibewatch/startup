  - id: market-sizing
    title: Market Sizing — TAM, SAM, and SOM
    body: >
      Sizing Monolith's addressable market requires triangulating across three sub-markets, each measured by
      different publishers using different methodologies. The global carbon black market is the most
      consistently sized: Mordor Intelligence (2026 update) puts it at $25.95 billion in 2026 growing to
      $33.82 billion by 2031 at a 5.44% CAGR. Tire and industrial rubber constitute 73.85% of 2026 revenue;
      Asia-Pacific accounts for 61.85% of volume. A Grand View Research figure cited in a 2023 press release
      put the 2030 value at $26.9 billion at 5.0% CAGR, largely consistent. A Transparency Market Research
      estimate put 2031 at $27.46 billion — marginally lower. Publisher range for carbon black 2030-2031:
      $27–34 billion, with a credible midpoint near $30 billion.
      For the hydrogen market, estimates diverge dramatically due to definitional scope. Allied Market
      Research projects total hydrogen generation at $262 billion by 2031 (all types). A Precedence Research
      figure cited via GlobeNewswire in 2024 puts the broader hydrogen market at $642 billion by 2032 at 9.28%
      CAGR — reflecting different scope (including hydrogen-derived products and fuel). An earlier Brandessence
      estimate put hydrogen generation at $410 billion by 2030. Clean hydrogen specifically (low-emission
      subset) is much smaller today: Mordor Intelligence projects 13.75 MTPA of clean hydrogen supply by 2031
      at 25.03% CAGR. Only 0.8 Mt per year of clean hydrogen was operational globally in 2023 (Hydrogen
      Council). The Hydrogen Council tracks 3 Mt/yr of capacity having passed FID and 38 Mt/yr announced
      through 2030 — but projects only 12–18 Mt/yr will realistically be deployed by 2030, meaning a 50-70%
      attrition gap. The Ammonia market is valued at roughly 197 million tons per year of volume in 2026
      (Mordor Intelligence), growing to 216 million tons by 2031 at 1.89% CAGR. A Polaris Market Research
      figure from 2023 projects ammonia value at $100.8 billion by 2030; a Research Nester estimate puts it
      at $94.4 billion by 2033. Green/clean ammonia is a small fraction today. Monolith's SOM at full OC2
      scale (180,000–194,000 t/yr carbon black + 275,000 t/yr ammonia) implies roughly $270–300 million/yr
      from carbon black at ~$1,500/t and $165–220 million/yr from ammonia at ~$600–800/t — approximately
      $440–520 million/yr combined peak revenue. This represents less than 2% of the combined carbon black
      plus ammonia market, reflecting a niche position within a large market.
