company:
  name: Monolith Materials
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Monolith competes across three intersecting markets: global carbon black (~$26B in 2026, 5.4% CAGR to 2031),
    clean/turquoise hydrogen (forecast 13.75 MTPA by 2031 at 25% CAGR), and anhydrous ammonia (~200 Mt/yr, 1.9%
    CAGR). Market sizing estimates vary by two to five times across publishers, reflecting definitional
    differences and the nascent state of clean-hydrogen demand. Decarbonization policy and Scope 3 procurement
    pressure create a premium niche, but near-term turquoise hydrogen demand is unproven at scale, DOE loan
    uncertainty introduces financing risk, and grey-hydrogen price competition depresses willingness to pay for
    turquoise variants.

sections:
  - id: market-boundary
    title: Market Boundary and Definition
    body: >
      Monolith's total addressable market spans three product dimensions produced simultaneously from plasma
      methane pyrolysis: carbon black (solid carbon), clean hydrogen (used to synthesise anhydrous ammonia),
      and the ammonia itself. The carbon black market is the broadest and most established of the three. The
      global carbon black market encompasses specialty, commodity, and conventional furnace-black grades used
      primarily in tire reinforcement, industrial rubber goods, coatings, inks, and battery/electronics
      applications. Monolith's product competes within the specialty and low-carbon-certified sub-segment;
      conventional petroleum-derived furnace black (produced by partial combustion of oil) is the dominant
      incumbent technology and the primary status-quo substitute. Recovered carbon black (rCB) from end-of-life
      tires represents a third, emerging alternative. The clean hydrogen market boundary covers hydrogen
      produced with meaningfully lower lifecycle greenhouse-gas emissions than grey hydrogen from unabated
      steam-methane reforming (SMR); turquoise hydrogen from plasma methane pyrolysis qualifies under this
      definition because carbon is captured as solid carbon black rather than emitted as CO2. Grey hydrogen
      from SMR and blue hydrogen from SMR with CCS are the dominant status-quo substitutes; together they
      account for more than 99% of hydrogen produced globally today. The ammonia market boundary covers the
      Haber-Bosch product chain: Monolith's hydrogen feedstock enables production of anhydrous ammonia used
      in fertilizers, industrial chemicals, and (emerging) co-firing energy applications. Conventional
      grey-hydrogen-based ammonia (produced via SMR + Haber-Bosch) is the overwhelming status-quo substitute
      for clean ammonia. Excluded from Monolith's primary market are: transport-grade hydrogen for fuel cells
      (different supply chain), electrolytic green hydrogen (different production pathway), and ammonia for
      non-agricultural end uses not covered by Koch Fertilizer's distribution network.
    claimRefs:
