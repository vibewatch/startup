    rows:
      - - Carbon Black (low-carbon / specialty)
        - Premium over conventional furnace black; global market ~$26B (2026); specialty grades (tire, battery, coatings)
        - Conventional petroleum furnace black (no carbon accounting); recovered/recycled CB (rCB)
        - Tire OEMs (Goodyear, Michelin, Bridgestone), industrial rubber manufacturers, battery producers
        - Core product from OC1 today; value driver via low-carbon certification premium for OC2 expansion
      - - Turquoise / Clean Hydrogen
        - Hydrogen from plasma methane pyrolysis (no direct CO2); eligible as low-carbon H2 under DOE / IEA definitions
        - Grey H2 from unabated SMR; blue H2 from SMR+CCS; green H2 from electrolysis (different production pathway)
        - Ammonia producers, industrial H2 users, DOE Regional H2 Hub anchor buyers
        - Intermediate feedstock for Monolith's ammonia; revenue from H2 dependent on establishing clean-H2 price premium
      - - Clean / Green Anhydrous Ammonia
        - Ammonia from turquoise H2 via Haber-Bosch; fertilizer and industrial markets with low-carbon certification
        - Conventional grey ammonia from SMR+HB (>98% of global supply today)
        - Fertilizer distributors (Koch Fertilizer), agricultural cooperatives, industrial chemical buyers
        - OC2's primary revenue product; Koch long-term offtake agreement is primary demand anchor
      - - Industrial Decarbonization (H2 adjacency)
        - Industrial hydrogen used in steel, refining, and data centers requiring low-carbon supply chain
        - Transport-sector H2 for fuel-cell vehicles (different logistics chain); hydrogen for power grid balancing
        - Refineries, steel mills, data center operators seeking low-carbon energy
        - Longer-term adjacency; not primary near-term OC2 revenue line; depends on Regional H2 Hub demand development
    notes: "Segment boundaries reflect Monolith's actual and planned product mix as of run date. Clean ammonia and clean H2 premiums are not yet established in open-market pricing."
