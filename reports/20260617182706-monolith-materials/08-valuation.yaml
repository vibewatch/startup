  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation
      missingEvidence: "Post-money equity valuation from the July 2022 $300M and September 2024 $300M+ rounds, including share price, preference stack, and liquidation waterfall."
      whyItMatters: "Without the cap-table and preference overhang, it is impossible to model real returns to new common-equity investors or confirm whether $1B+ unicorn status is current rather than legacy."
      diligencePath: "Request full cap-table and liquidation waterfall from company CFO as a condition of any term sheet; cross-reference with Carta equity management records."
      relatedQuestionRefs: [QV001, QV021, QV031]

    - type: missing-source
      severity: blocking
      topic: regulatory-risk
      missingEvidence: "Final DOE decision on the Monolith OC2 $953M conditional loan guarantee cancellation or continuation as of June 2026."
      whyItMatters: "This single binary event determines whether OC2 is financeable at all on the current timeline; resolution would shift the scenario probability weights substantially."
      diligencePath: "Monitor DOE Loan Programs Office announcements; file FOIA request for correspondence; engage Congressional contacts in Nebraska delegation."
      relatedQuestionRefs: [QV006, QV011]

    - type: private-evidence-only
      severity: material
      topic: financial-risk
      missingEvidence: "Audited or management-reviewed OC1 EBITDA, operating cash flow, and carbon-black realised pricing for trailing 4–8 quarters."
      whyItMatters: "Validates or refutes the September 2024 cash-shortage reporting; determines whether OC1 can self-fund operations and debt service without new equity infusions."
      diligencePath: "Request management accounts and audited financials from company CFO; require as data-room precondition."
      relatedQuestionRefs: [QV007, QV016, QV022]

    - type: missing-source
      severity: material
      topic: regulatory-disclosure
      missingEvidence: "SEC Form D filings for the July 2022 $300M round and the September 2024 $300M+ round."
      whyItMatters: "Absence of Form D prevents independent verification of equity security type, per-share price, and implied valuation; anomalous for rounds of this size."
      diligencePath: "Query EDGAR for any subsequent Form D; ask company counsel for explanation of exemption used; obtain from counsel or data room."
      relatedQuestionRefs: [QV004, QV005]

    - type: private-evidence-only
      severity: material
      topic: financing
      missingEvidence: "OC2 total CapEx budget, current completion percentage, remaining capital needed, and alternative financing plan if DOE loan is cancelled."
      whyItMatters: "OC2 is the entire bull-case; without a funded and credible alternative plan, the $1B+ valuation option premium lacks foundation."
      diligencePath: "Request OC2 project-finance model, engineering progress reports, and commitment letters from alternative lenders."
      relatedQuestionRefs: [QV025]

    - type: missing-source
      severity: material
