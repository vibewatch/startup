callouts:
  - calloutType: risk
    title: DOE Loan Cancellation Is the Dominant Binary Risk
    body: "The $953M DOE conditional loan guarantee is the financing pillar for OC2. If cancelled—as May 2025 signals suggest—Monolith would need to replace nearly $1B of project finance in a compressed climate-tech capital market, likely at significant dilution. This single event could move the enterprise value from the $1B+ range to the $70–120M OC1-standalone range. Any investment thesis must explicitly scenario the no-DOE-loan case."
    claimRefs: [CV026, CV027, CV028, CV037]

  - calloutType: insight
    title: No Public Form D for 2022 or 2024 Raises Is a Material Evidence Gap
    body: "Monolith's most recent SEC Form D filing is dated June 2021 (for $120M). The July 2022 $300M and September 2024 $300M+ rounds have no corresponding public Form D, preventing independent verification of the security type, price per share, or implied post-money valuation. This absence is anomalous for equity rounds of this size and warrants specific due-diligence inquiry."
    claimRefs: [CV008, CV009, CV010, CV011]

  - calloutType: assumption
    title: $1B+ Valuation Is an Option on OC2, Not a Reflection of OC1 Economics
    body: "Monolith's unicorn tag is predicated on the future value of OC2—not current OC1 operations. Applying Cabot's carbon-black P/S of ~1.15× to OC1's estimated $14–20M revenue produces a value of $16–23M, far below the $1B+ mark. The gap between these two estimates is the OC2 option premium, which is now highly impaired by the DOE cancellation risk and the cash-shortage reporting."
    claimRefs: [CV013, CV015, CV034, CV036, CV037]

  - calloutType: recommendation
    title: Research-More — Three Diligence Events That Could Change the Call
    body: "The recommendation would upgrade to 'track' or 'buy' if three conditions are met: (1) the DOE loan is formally reinstated or a credible alternative OC2 debt package is in place; (2) audited OC1 financials confirm positive EBITDA and funded liquidity runway; and (3) the full cap-table and liquidation waterfall are disclosed and show acceptable common-equity return potential at entry. Without these, the $1B+ valuation cannot be adequately stress-tested."
    claimRefs: [CV002, CV009, CV010, CV022, CV026, CV027]

