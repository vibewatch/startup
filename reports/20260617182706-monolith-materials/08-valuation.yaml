      missingEvidence: "Comparable private-market valuations for methane-pyrolysis or turquoise-hydrogen peers (e.g. Ekona Power, Hazer Group, Monolith-adjacent rounds) and current analyst EV/EBITDA estimates for Cabot and Orion; partial coverage in table TV004 reflects absence of disclosed private-market comparables beyond C-Zero."
