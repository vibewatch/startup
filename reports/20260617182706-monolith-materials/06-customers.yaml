callouts:
  - calloutType: strength
    title: Anchor Customer Proof with Named Buyers
    body: >
      Goodyear — the only US-headquartered tire maker — publicly committed to Monolith's carbon
      black with a collaboration agreement (Dec 2021), a CEO endorsement, and a commercial
      tire launch (2023). Koch Fertilizer, one of North America's largest NH3 distributors,
      signed a long-term ammonia offtake agreement in July 2022. Both are marquee names that
      provide strong commercial validation for Monolith's technology and demand for OC2 output.
    claimRefs: [CU016, CU017, CU019, CU020, CU023]

  - calloutType: risk
    title: High Customer Concentration and OC2 Dependency
    body: >
      Virtually all of Monolith's named commercial pipeline is concentrated in two anchor
      buyers (Goodyear, Koch Fertilizer) and is contingent on OC2 construction completing.
      OC2 has faced delays and a cash shortfall (reported Sept 2024), and the DOE's $953M
      conditional loan guarantee may be cancelled (Semafor, May 2025). If OC2 is delayed
      or cancelled, neither the Koch Fertilizer ammonia offtake nor the Goodyear scale-up
      commitment can generate material revenue — leaving Monolith with only OC1's ~14,000
      t/yr output as its revenue base.
    claimRefs: [CU027, CU029, CU030, CU031, CU032, CU033]

  - calloutType: insight
    title: Strategic Partners Not Yet Converted to Commercial Customers
    body: >
      SK Inc. and Mitsubishi Heavy Industries are strategic investors with strong stated interest
      in hydrogen value chain opportunities. MHI explicitly said Monolith solves a "century-old"
      methane pyrolysis scaling problem. However, neither has publicly disclosed a commercial
      offtake, licensing, or deployment agreement. Converting these strategic investors into
      paying commercial customers would materially reduce concentration risk and open Asian markets.
    claimRefs: [CU010, CU011, CU012, CU028, CU034]

  - calloutType: recommendation
    title: Diligence Must Verify LOI-to-Contract Conversion and OC2 Status
    body: >
      The Goodyear collaboration remains at LOI / evaluation stage with no publicly disclosed
      binding supply volume or price. Similarly, Koch Fertilizer's offtake agreement terms
      are entirely opaque. Any investment thesis dependent on named customer revenue must
      confirm: (1) whether LOIs have converted to binding supply contracts; (2) walk-away
      provisions and volume minimums; (3) OC2 construction schedule update given 2024 delays;
      and (4) DOE loan status as of H2 2025/2026.
    claimRefs: [CU025, CU026, CU027, CU029, CU030]

