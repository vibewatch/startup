company:
  name: Monolith Materials
chapter:
  number: 6
  title: Customers
  summary: >
    Monolith serves two distinct industrial buyer segments: tire/rubber manufacturers purchasing
    carbon black from its operational OC1 facility (notably Goodyear, which signed a collaboration
    agreement and launched a sustainable-carbon-black tire in 2023), and fertilizer distributors
    anchored by Koch Fertilizer's long-term ammonia offtake agreement for planned OC2 output.
    Strategic investor-partners SK Inc. and Mitsubishi Heavy Industries supplement commercial
    traction, but customer concentration is high — Goodyear and Koch Fertilizer represent the
    two named anchor relationships, and OC2 delays combined with a 2024 cash shortfall create
    material risk that committed offtake revenues may not materialise on schedule.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation
    body: >
      Monolith addresses two structurally distinct end markets through its plasma pyrolysis process.
      The first is the carbon black market — a global commodity used primarily in tire and rubber
      manufacturing (~70% of consumption), with additional applications in specialty coatings,
      inks, batteries, and mechanical rubber goods. Current OC1 output (~14,000 metric tons/year)
      is sold into the North American tire supply chain. Monolith offers four branded product
      lines — GreenBlack (tire reinforcement), Bolt (low-sulfur applications), True (high-purity
      specialty), and Core (general purpose) — enabling segmentation by application and
      specification. The second end market is clean ammonia / fertilizer, targeted at the
      US Corn Belt (Iowa, Illinois, Indiana, Nebraska, and adjacent states), which collectively
      imports more than 1.7 million metric tons per year of anhydrous ammonia. OC2 is expected
      to produce approximately 275,000 metric tons per year of ammonia, partially addressing this
      domestic supply deficit. Strategic investor-partners SK Inc. (South Korea) and Mitsubishi
      Heavy Industries (Japan) represent a third category — industrial conglomerates with
      potential commercial interest in hydrogen and carbon black technology deployment across
      their broader operations — but no commercial offtake agreement with either has been
      publicly disclosed. Geography is currently concentrated in the US Corn Belt and domestic
      tire supply chain; international commercialisation remains a medium-term aspiration.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]

  - id: adoption-trajectory-and-named-proof
    title: Adoption Trajectory and Named Customer Proof
    body: >
      Monolith's OC1 plant commenced commercial carbon black production in September 2020 and
      has been supplying tire manufacturers across North America since then. The most prominent
      named relationship is Goodyear Tire & Rubber Co., the only US-headquartered tire
      manufacturer. In December 2021, Goodyear signed a collaboration agreement and letter of
      intent to evaluate Monolith's carbon black as a tire reinforcement material. Goodyear CEO
      Richard Kramer publicly stated the company was "excited" to work with Monolith to reduce
      its carbon footprint. According to Chemical & Engineering News, Monolith expected to
      provide Goodyear with approximately one-third of OC2's total carbon black output
      (~65,000 metric tons per year of the planned 194,000 t/yr). In May 2023, Goodyear launched
      a tire incorporating Monolith's sustainable carbon black, marking the first commercial tire
      produced with the material. A second unnamed tire maker had also signed a letter of intent
      to purchase carbon black from Monolith prior to January 2022, per AP News coverage of the
      DOE loan announcement. On the ammonia side, Koch Fertilizer — a Koch Industries subsidiary
      and one of North America's largest fertilizer distributors — announced a long-term offtake
      agreement with Monolith for clean ammonia from the planned OC2 facility in July 2022.
      Terms of the agreement are not publicly disclosed. Both the Goodyear supply commitment and
      the Koch Fertilizer deal are contingent on OC2 construction reaching completion, which
      faced delays and a reported cash shortfall as of September 2024. The Ammonia Energy
      Association described Monolith's methane pyrolysis approach as able to "deliver low-carbon
      ammonia in the right place, at the right scale and at the right cost."
    claimRefs: [CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU023, CU024]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]

  - id: retention-concentration-and-risk
    title: Retention, Concentration Risk, and Expansion Outlook
    body: >
      Monolith's customer durability rests on a narrow but strategically significant base. The
      Goodyear collaboration agreement and the Koch Fertilizer long-term offtake deal represent
      anchor commitments, but neither has disclosed renewal provisions, pricing mechanisms, or
      termination clauses. No net revenue retention (NRR), gross revenue retention (GRR), or
      churn metrics have been publicly disclosed because Monolith is a private company with
      no public investor reporting obligation and has not released audited commercial metrics.
      Customer concentration risk is material: two named anchor buyers — Goodyear for carbon
      black and Koch Fertilizer for ammonia — account for the majority of Monolith's visible
      demand pipeline. If either relationship deteriorates or if OC2 construction is further
      delayed or cancelled (a risk highlighted by the potential DOE loan cancellation in May
      2025 and the September 2024 cash shortage), revenue projections could be substantially
      impaired. Procurement friction is a real barrier for broader adoption: new tire-industry
      customers must qualify Monolith's carbon black grades against stringent OEM specifications,
      a multi-year process. Expansion upside exists if Monolith successfully enters battery-grade
      carbon black markets (True product line) and if SK or MHI leverage the technology for
      hydrogen or carbon black deployment in Asian markets. The Corn Belt ammonia market
      represents a near-term expansion avenue if OC2 is completed, given Koch Fertilizer's
      distribution network spans the region. However, without OC2 operational, the majority of
      named commercial agreements remain contingent.
    claimRefs: [CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]

