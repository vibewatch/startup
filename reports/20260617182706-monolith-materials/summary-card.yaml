  topStrengths:
    - >-
      Only commercial-scale plasma methane-pyrolysis plant in the world (OC1), with proprietary plasma-torch IP and a
      genuinely emissions-advantaged process producing both clean hydrogen and salable carbon black.
    - >-
      Blue-chip investor syndicate (TPG Rise Climate, Decarbonization Partners/BlackRock-Temasek, Warburg Pincus,
      Cornell Capital) and marquee offtake/partners (Koch, Goodyear, SK, Mitsubishi).
    - >-
      Dual-revenue model (carbon black today, clean ammonia at scale) gives multiple paths to monetize a decarbonization
      tailwind.
  topRisks:
    - >-
      $953M DOE Title 17 conditional loan reportedly targeted for cancellation under the Trump administration (2025),
      jeopardizing OC2 project finance.
    - >-
      Reported cash shortage and project delays (late 2024) against a highly capital-intensive scale-up from a single
      ~14,000 t/yr plant.
    - >-
      Revenue, margin, burn and customer economics are entirely undisclosed, and offtake/customer concentration (Koch,
      Goodyear) plus carbon-black price competition from Cabot/Birla/Orion create demand and pricing risk.
  unresolvedGaps:
    - No public revenue, gross margin, cash-on-hand, burn or runway figures to underwrite capital adequacy.
    - >-
      Current valuation is undisclosed beyond unicorn status; no recent priced round terms or preference stack
      visibility.
    - DOE loan final status unresolved; OC2 construction timeline, financing close and cost remain uncertain.
    - Headcount and second-co-founder identity conflict across sources.
