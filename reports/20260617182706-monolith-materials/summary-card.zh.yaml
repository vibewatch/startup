summary:
  headline: Monolith 是首个跑通商业化的等离子体热解生产商，技术真实、蓝筹股东背书强；但公开财务太薄，规模仍押在单一工厂，客户和贷款集中，DOE 贷款还面临取消威胁，支撑 $1B+ 估值前需要更深尽调。
