  - id: trust-quality-compliance
    title: "Trust, Quality, Safety, and Compliance"
    body: >
      Monolith's carbon black is produced and tested to ASTM International standard grades, which specify
      particle size, surface area, structure (DBP absorption), and other physical-chemical properties required by
      tire and rubber manufacturers. The carbon black must meet these specifications before being shipped to
      customers, establishing a quality gate between production and delivery. The process generates no direct
      CO2 emissions (no combustion, no oxygen in the reaction zone) and achieves up to 80% lower lifecycle
      CO2, SOx, and NOx relative to conventional furnace processes according to the company's DOE loan
      application documentation.

      Environmental permitting for OC1 was conducted under Nebraska state regulations, and the planned OC2
      expansion required additional groundwater permits from the Lower Platte South Natural Resources District
      (approved in July 2021 for up to 420 million gallons per year). Community concerns about water use were
      addressed through monitoring and reporting requirements tied to the permits. The company processes
      approximately 1 ton of hydrogen co-product for every 3 tons of carbon black produced, and that hydrogen
      is used on-site for energy generation, reducing net external utility demand. Carbon black is classified by
      IARC as "possibly carcinogenic to humans (Group 2B)," and Monolith follows standard occupational
      exposure controls consistent with industry norms. No product recalls or major safety incidents at OC1 have
      been publicly reported. The DOE loan guarantee program required Monolith to meet specific technical,
      financial, and environmental conditions—a rigorous diligence process that functions as an external quality
      gate on the technology's maturity.
