  - id: product-portfolio-workflow
    title: "Product Portfolio and Customer Workflow"
    body: >
      Monolith sells carbon black under four branded product lines. GreenBlack® targets reinforcing applications
      (tire treads, carcass plies, wire-skim, innerliners) where high structural-carbon content is critical. Bolt™ is
      formulated for applications requiring low-sulfur content, such as mechanical rubber goods (hoses, belts,
      seals, gaskets). True™ provides the highest purity grades for the most stringent applications—specialty
      plastics, coatings, inks, battery electrodes, and food-contact packaging. Core® covers general-purpose
      carbon black applications. Carbon black from OC1 is already making its way into millions of tires and plastic
      components across North America.

      Customer workflow for tire manufacturers follows a repeatable cycle: the manufacturer specifies a carbon
      black grade by ASTM designation and application requirement; Monolith's OC1 facility produces and
      conditions the appropriate grade; quality is verified against ASTM specifications before shipment from
      Hallam, Nebraska; the customer incorporates the carbon black into a rubber compound at a mixing plant;
      and the compound is vulcanized into finished tires. Goodyear Tire & Rubber, the only US-headquartered
      tire manufacturer, signed an agreement to evaluate Monolith's carbon black for tire reinforcement and is
      expected to receive approximately one-third of the future OC2 carbon black output.

      For the downstream hydrogen pathway, OC1's clean H2 currently supplements on-site energy use. Under
      the planned OC2 build-out, hydrogen will be converted to anhydrous ammonia using a Haber–Bosch
      synthesis loop (N2 + 3H2 ⇌ 2NH3) and sold to farmers in the US Corn Belt, directly addressing a
      roughly 1.75-million-ton annual ammonia deficit in that region. Koch Fertilizer has a long-term ammonia
      offtake agreement for OC2 output.
