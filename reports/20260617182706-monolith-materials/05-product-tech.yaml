  - id: differentiation-ip
    title: "Differentiation: Proprietary IP and Manufacturing Know-How"
    body: >
      Monolith's primary technological differentiator is its portfolio of proprietary patents covering plasma torch
      design, reactor architecture, carbon black surface functionalization, and downstream processing. Granted
      patents include a plasma torch design patent (US12144099, granted November 2024) covering concentric
      electrode geometry improvements for efficiency and effectiveness; a DC plasma torch electrical power
      supply design (US12250764, granted March 2025) specifying the power-supply-to-operating-voltage ratio
      that stabilizes torch operation; a carbon black generating system (US11987712, granted May 2024) covering
      the aerodynamic feedstock injection and no-recirculation reactor geometry that defines the OC1 process;
      and a method of making tailored carbon black (US12497517, granted December 2025) covering surface
      functionalization during and after particle formation to adapt carbon black for specific end-uses.

      The plasma process itself traces an intellectual lineage to the Norwegian company Kværner (now Aker
      Solutions), which operated the first and only prior commercial-scale methane pyrolysis plant from 1997 to
      2003. Kværner's plant was decommissioned because of insufficient carbon black quality. Monolith spent
      approximately 2013–2020 refining the technology—first at the Seaport demonstration plant in Redwood City,
      California, then at OC1—to solve the quality problem and achieve the high-purity grades required by
      premium tire and specialty markets. The Wall Street Journal cited Monolith as achieving approximately 95%
      fewer emissions than traditional methods, underscoring both the process superiority and the company's
      positioning as the only producer operating at commercial scale. The feedstock flexibility of the process
      (accepting not just natural gas but also carbon black oil, CBO) provides additional supply-chain resilience.
      OC1 also represents the first carbon black plant built in the United States in over 50 years, creating a
      domestic supply security advantage with defense and automotive customers.
