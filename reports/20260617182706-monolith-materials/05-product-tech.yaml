callouts:
  - calloutType: strength
    title: "World's First Commercial-Scale Methane Pyrolysis"
    body: >
      OC1 at Olive Creek is the only commercial-scale thermal plasma methane pyrolysis facility operating
      anywhere in the world as of 2026. This first-mover position provides Monolith with accumulated
      operational know-how, a growing patent estate (15+ issued patents including plasma torch and reactor
      designs), and customer validation data that cannot be easily replicated by new entrants in the near term.
    claimRefs:
      - CE025
      - CE011
      - CE012

  - calloutType: risk
    title: "OC2 Delay and DOE Loan Cancellation Risk"
    body: >
      Monolith's planned scale-up to OC2—representing 13× the carbon black capacity and the entire ammonia
      business—remains unbuilt as of June 2026. The September 2024 financing round was necessitated by a
      reported cash shortfall and project delays. The $953M conditional DOE loan guarantee (the primary planned
      debt facility for OC2) was named by the Trump administration in May 2025 as one of seven conditional
      commitments targeted for cancellation. Loss of DOE financing would require Monolith to find
      approximately $1 billion in alternative debt or equity capital to execute OC2.
    claimRefs:
      - CE026
      - CE027

  - calloutType: insight
    title: "Feedstock and Product Flexibility as Resilience Driver"
    body: >
      Monolith's process accepts natural gas or carbon black oil (CBO) as feedstock, giving it supply-chain
      optionality if natural gas prices spike. The four branded carbon black grades (GreenBlack®, Bolt™, True™,
      Core®) span tire, MRG, specialty, and general-purpose markets, spreading customer concentration risk
      across multiple industrial segments. The hydrogen co-product can be used for energy, ammonia, or future
      hydrogen applications, providing additional commercial flexibility.
    claimRefs:
      - CE031
      - CE014
      - CE015

  - calloutType: recommendation
    title: "Diligence Priority: OC2 Financing Path and Technology Scale-Up Plan"
    body: >
      Investors should require a fully updated OC2 capital plan detailing the alternative financing path if DOE
      cancels its conditional commitment, the specific construction schedule milestones, and independent
      engineering confirmation that OC2's larger plasma reactors can achieve OC1-comparable product yields
      and uptime. OC1 operational metrics (utilization rate, planned vs. actual yields per train) should also be
      diligenced as a proxy for OC2 risk.
    claimRefs:
      - CE026
      - CE027
      - CE042

