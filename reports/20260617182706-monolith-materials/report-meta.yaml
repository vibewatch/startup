companyProfile:
  summary: "Monolith Materials, Inc. ('Monolith') is a Lincoln, Nebraska clean-technology company founded in 2012 (originally Boxer Industries). It operates a proprietary plasma methane-pyrolysis process that converts natural gas into clean 'turquoise' hydrogen and solid carbon black with no direct CO2 emissions. Its Olive Creek 1 (OC1) facility near Hallam, Nebraska is the world's only commercial-scale plasma-pyrolysis carbon black plant (~14,000 t/yr); a much larger OC2 expansion is planned. Monolith has raised $570M+ in equity (including a $300M+ September 2024 round led by TPG Rise Climate and Decarbonization Partners) and holds a $953M DOE Title 17 conditional loan guarantee that, as of 2025, is reportedly at risk of cancellation. The company has faced reported cash-flow pressure and project delays."
  foundedDate: "2012-01-01"
  founders:
    - name: Rob Hanson
      role: Co-founder & CEO
      background: "Co-founded Monolith in 2012; previously worked at AREVA Solar on concentrated solar power technology."
      claimRefs: [CO003, CO031]
    - name: Pete Johnson
      role: Co-founder (disputed)
      background: "Identified by Wikipedia and Crunchbase as Monolith's second co-founder; the engagement brief instead names Cody Finke, a conflict no independent source resolves."
      claimRefs: [CO004, CO005]
  foundingLocation: Redwood City, California, USA
  headquarters: Lincoln, Nebraska, USA
  productSummary: "Sustainable carbon black (for tires, rubber, pigments and batteries) and clean hydrogen converted to anhydrous ammonia (fertilizer), produced via emissions-free plasma methane pyrolysis."
  customerFocus: "Industrial buyers of carbon black (tire/rubber/pigment makers such as Goodyear) and ammonia/fertilizer offtakers (Koch); strategic investors/partners include SK and Mitsubishi Heavy Industries."
  businessModel: "Sells physical commodities — carbon black and hydrogen-derived ammonia — under long-term offtake agreements, underpinned by capital-intensive plant build-outs financed with equity and (conditionally) DOE-guaranteed debt."
  stage: Late-stage private (unicorn since 2022)
