companyProfile:
  summary: Fireflies.ai is a profitable, capital-efficient AI meeting assistant that joins virtual meetings as a bot to
    record, transcribe, summarize, and analyze conversations, syncing notes and action items into CRMs and collaboration
    tools. It reached a $1 billion valuation via a June 2025 secondary transaction rather than a primary round, having
    raised only about $19 million in total. Its adoption is broad and bottom-up — the company claims more than 20 million
    users and use by 75% of the Fortune 500 — but every headline metric is self-reported or third-party-estimated and never
    audited, leaving revenue magnitude, retention, and the valuation difficult to verify from public evidence.
  foundedDate: '2016-01-01'
  founders:
  - name: Krish Ramineni
    role: Co-founder / CEO
    background: MIT-affiliated founder who led Fireflies from a pivot-heavy early stage to a profitable AI unicorn without
      heavy venture funding.
    claimRefs: []
  - name: Sam Udotong
    role: Co-founder / CTO
    background: MIT-trained engineer who built Fireflies' transcription and meeting-intelligence technology stack.
    claimRefs: []
  foundingLocation: San Francisco, California (MIT founders)
  headquarters: San Francisco, California (distributed team)
  productSummary: Fireflies sells a freemium SaaS AI notetaker that automatically records and transcribes meetings, generates
    summaries and action items, offers smart search across meeting history, conversation-intelligence analytics, an API, and
    integrations with Zoom, Meet, Teams, Salesforce, HubSpot, and Slack.
  customerFocus: Individual professionals and SMBs on the freemium ladder up to enterprise revenue, recruiting, and
    customer-success teams, skewed toward English-speaking, services-heavy verticals.
  businessModel: Recurring SaaS subscriptions across Free, Pro ($10), Business ($19), and Enterprise ($39) per-seat tiers
    plus API access.
  stage: Late-stage private / secondary-priced unicorn
  fundingStatus: Reached a $1B valuation via a June 2025 secondary (employee-liquidity) transaction; only ~$19M of primary
    capital ever raised (~$4.5M seed led by Canaan, $14M Series A led by Khosla Ventures), none since 2021.
