chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Fireflies.ai is an AI meeting assistant — a notetaker bot (branded Fred) that joins Zoom, Google Meet, Microsoft
    Teams, and other calls to record, transcribe (100+ languages), and summarize meetings, extract action items, and make
    the entire meeting history searchable. On top of capture it layers AskFred (a conversational assistant over meeting
    content), conversation intelligence (speaker talk-time, sentiment, and team analytics), and Talk to Fireflies, a
    real-time voice agent with Perplexity-powered web search. The platform is delivered through web, desktop, mobile, and
    a Chrome extension, plus a GraphQL API at api.fireflies.ai with API-key auth and Webhooks V2 for event-driven
    integrations, and it connects to 100-plus tools including Salesforce, HubSpot, Slack, and Zapier. Architecturally it
    is a thin-but-sticky workflow layer over commoditized speech-to-text and third-party LLMs: the transcription core is
    not proprietary, so differentiation rests on integration breadth, workflow lock-in, and an enterprise trust posture
    (SOC 2 Type II, GDPR, HIPAA BAA, and a no-training-on-customer-data policy) rather than on a unique technical moat.
sections:
  - id: product-surface-workflow
    title: Product surface, modules, and customer workflow
    body: >-
      In customer-workflow terms, Fireflies removes the manual work around meetings: a user connects their calendar, and
      the Fireflies bot automatically joins scheduled Zoom, Google Meet, or Teams calls, records audio and video,
      transcribes the conversation in more than 100 languages, and within minutes delivers a structured summary, a list of
      action items, and a fully searchable transcript. The product surface spans several modules. Capture is the base
      layer — the meeting bot plus audio/video upload via the app or API. On top sit AI notes and summaries, an action-item
      and task manager, and smart search across the entire meeting archive. AskFred (also surfaced as the Personal
      Assistant) is a conversational layer that lets users ask questions about a meeting, extract details, and generate
      follow-ups, emails, or social posts. Conversation intelligence adds speaker talk-time, sentiment, and team analytics
      aimed at revenue and customer-success teams. The newest module, Talk to Fireflies, is a voice agent that performs
      real-time, Perplexity-powered web search during a live meeting. These modules are delivered across web, desktop,
      mobile (iOS and Android), and a Chrome extension, so the same capture-to-insight workflow follows the user across
      surfaces. The dominant use cases are sales call capture and CRM sync, recruiting interviews, customer-success calls,
      and internal team meetings, with the free tier serving individuals and paid tiers unlocking analytics and storage.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
