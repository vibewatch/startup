  evidenceGaps:
    - type: missing-source
      severity: material
      topic: model and infrastructure stack
      missingEvidence: >-
        Fireflies does not disclose which speech-to-text and large language models it uses, whether any are proprietary,
        or how inference is hosted.
      whyItMatters: >-
        The defensibility and gross-margin profile of the product depend heavily on whether the core models are
        proprietary or rented from third parties.
      diligencePath: >-
        Request the model and infrastructure architecture, vendor contracts (e.g., ASR and LLM providers), and any
        in-house model details under NDA.
      relatedQuestionRefs:
        - QE009
        - QE014
      relatedTableRefs:
        - TE003
    - type: missing-source
      severity: minor
      topic: reliability and SLAs
      missingEvidence: >-
        No public service-level agreement, uptime history, or support-response guarantee by tier is available.
      whyItMatters: >-
        Enterprise buyers underwrite on reliability and support guarantees, which affect renewal and expansion.
      diligencePath: >-
        Obtain Fireflies' SLA, status-page history, and tier-level support commitments from the company.
      relatedQuestionRefs:
        - QE013
        - QE024
      relatedTableRefs:
        - TE005
    - type: access-blocked
      severity: minor
      topic: independent compliance verification
      missingEvidence: >-
        Compliance certifications (SOC 2 Type II, HIPAA BAA) are asserted on company pages but the underlying audit
        reports are not public.
      whyItMatters: >-
        Regulated buyers require the actual audit artifacts, not marketing claims, before deployment.
      diligencePath: >-
        Request the SOC 2 Type II report and HIPAA BAA template directly from Fireflies under NDA.
      relatedQuestionRefs:
        - QE015
        - QE023
      relatedTableRefs:
        - TE004
