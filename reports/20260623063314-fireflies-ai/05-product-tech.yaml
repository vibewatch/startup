  - id: architecture-platform
    title: Architecture, developer platform, integrations, and deployment
    body: >-
      The operating architecture is a layered software stack. At the bottom is the capture and ingestion layer — the
      meeting bot and audio/video upload — feeding a speech-to-text transcription engine that supports 100-plus languages.
      Above transcription sit AI processing services that generate summaries, action items, and analytics using large
      language models, and a search/index layer that makes transcripts and their metadata queryable. The application layer
      exposes these through the web app, desktop and mobile clients, the Chrome extension, and AskFred. Crucially for
      extensibility, Fireflies ships a developer platform: a GraphQL API hosted at api.fireflies.ai that requires an API
      key for all requests, with queries and mutations to pull transcripts, summaries, sentences, and speaker data and to
      upload audio, plus Webhooks V2 that push real-time meeting.transcribed and meeting.summarized events with HMAC
      signature verification. This API underpins integrations: Fireflies connects to 100-plus tools — Salesforce, HubSpot,
      Pipedrive, Zoho, Slack, Notion, Zapier, and ATS systems like Greenhouse and Lever — pushing notes and action items
      into the systems of record where revenue and recruiting teams already work. Deployment is pure cloud SaaS, with
      reliability and support tiered by plan and dedicated account management at Enterprise. The architectural reality is
      that the transcription and summarization primitives lean on commoditized and third-party models — the same Whisper-
      class ASR and general LLM capabilities available to rivals — so the defensible engineering is in orchestration,
      integration plumbing, search over meeting data, and the reliability of the always-on bot rather than in the core
      models themselves.
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE014
      - CE015
      - CE016
      - CE017
      - CE018
      - CE019
      - CE020
      - CE033
      - CE034
    tableRefs:
      - TE003
    figureRefs:
      - FE001
      - FE003
  - id: trust-differentiation
    title: Trust, compliance, differentiation, and product maturity
    body: >-
      Fireflies leans heavily on an enterprise trust posture to win regulated and security-conscious buyers. It advertises
      SOC 2 Type II, GDPR compliance, and HIPAA BAA support for healthcare (Enterprise only), private storage and custom
      data retention, SSO/SCIM, audit logs, and — central to the privacy pitch — a policy of not training AI models on
      customer data. These controls are the principal counterweight to the core risk of meeting-recording products:
      customers routinely share confidential information in meetings, so data handling is a gating purchase criterion. On
      differentiation, the durable advantages are integration breadth (100-plus connectors), a generous free tier and low
      price that drive bottom-up adoption, workflow lock-in via CRM sync, and a growing data asset of meeting history that
      powers search and analytics; the brand and the Fred bot add recognition. The weaknesses, evident in user reviews on
      G2 and TrustRadius, include imperfect accuracy on some languages and accents (for example Hindi), CRM-integration
      friction, and the fact that the underlying transcription is not unique. On maturity, capture, transcription,
      summaries, action items, and integrations are mature and proven at scale; conversation intelligence and analytics
      are established but less differentiated; and the voice-agent and multilingual roadmap (Talk to Fireflies, AI voice
      agents) is early. The net technical verdict is a highly capable, well-integrated product whose moat is operational
      and data-driven rather than a proprietary model edge, leaving it exposed to platform incumbents that bundle similar
      capability.
    claimRefs:
      - CE021
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026
      - CE027
      - CE028
      - CE029
      - CE030
