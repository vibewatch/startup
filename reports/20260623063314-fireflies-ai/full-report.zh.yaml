        - 获取经审计报表，以及口径明确的 ARR
      - - 盈利能力和利润率
        - 盈利能力来自公司自报，未经审计
        - 支撑资本效率溢价
        - 审阅经审计 P&L，以及毛利率 / 经营利润率
      - - 留存 / NRR
        - 未披露流失、NRR 或 cohort 数据
        - 持久 SaaS 价值最关键的单一驱动项
        - 获取 cohort 留存和金额 / logo 流失
      - - 二级交易条款
        - 每股价格、卖方、折扣、优先权未知
        - 界定 $1B 数字到底代表什么
        - 审阅 tender 文件和 cap table
      - - 付费基础和使用口径
        - 用户数和 Fortune 500 客户数未经核验
        - 衡量倍数背后的收入基础
        - 第三方使用审计；拆分付费与免费
    notes: 只要补齐经审计 ARR、盈利能力和留存三项资料，大部分估值不确定性就能消除；在此之前，$1B 标记仍建立在公司自报数字之上。
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Fireflies 的里程碑串起了一段漫长的产品市场匹配前磨合期、COVID 时期的拐点、盈利，以及由二级交易推上独角兽的节点；但创始故事争议也一直投下阴影。
    data:
      items:
        - date: '2016-01-01'
          label: 成立
