      - number: '2.2'
        title: 多重镜头下的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有单一可信 TAM 能定义 Fireflies 的机会，因此更适合用嵌套镜头框定市场。最窄处，AI 会议助手市场本身规模不大但增长很快：Statifacts 估计 2025 年约 $3.50B、2026 年
              $4.41B，并以 25.9% CAGR 增至 2035 年约 $35B；Market.us 则估计 2024 年为 $3.67B，并预测到 2034 年达到 $72.17B，CAGR 高达
              34.7%。上一层，AI 转写和 speech-to-text API 细分市场 2026 年规模约在 $4.5B 至 $5.4B 之间，其中 MarketsandMarkets 预计 STT API 市场到
              2026 年达到 $5.4B，CAGR 为 19.2%。再往外，支撑这些应用的语音和语音识别市场 2023 年约 $20.25B，预计到 2030 年达到 $53.67B，CAGR 为
              14.6%。相邻的会话智能软件市场更大，按不同发布方口径，2025-2026 年约从 $26.7B 增至 $32.2B。北美在每个镜头下都占主导，2024 年占会议助手市场 35.3%，2023 年占语音 /
              语音识别市场 30.8%。这些预测分歧很大——CAGR 从 7% 到接近 35%——本身就是核心发现：当下还无法精确测算该市场，任何估值论点都应把 TAM 当作区间，而不是点估计。
