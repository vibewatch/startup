chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              Fireflies.ai 是一款 AI 会议助手，可在 Zoom、Google Meet、Microsoft Teams 及其他平台上自动录音、转写、总结并分析对话。其法律实体为 Fireflies.AI
              Corp.，在 Delaware 注册，主要营业地在 California；公司自称是「#1 AI assistant for meetings」，被 75% 的 Fortune 500 公司员工使用。公司由
              Krish Ramineni 和 Sam Udotong 于 2016 年创立，前者担任 CEO，后者担任 CTO。Udotong 2016 年毕业于 MIT，专业为航空航天；两人在 MIT 黑客松相识，当时
              Ramineni 是 University of Pennsylvania 学生，后来曾短暂在 Microsoft
              担任产品经理。创始人在大约六次失败迭代后，才把「Fireflies」这个名字落到会议转写助手上。领导层异常稳定：两位创始人自公司成立起一直掌舵，这带来关键人依赖，也显示战略、产品和股权结构都由创始人紧密控制。公司有意采用远程优先模式，称自己是一个全球组织，约
              100 至 120 人分布在 20 多个国家，没有中心办公室。该结构构成公司身份和成本纪律叙事的一部分，但也意味着外部只能依赖公司陈述和第三方数据库，难以实地核验员工数和运营情况。
