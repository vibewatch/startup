      - number: '6.3'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              耐久性方面，Fireflies 没有披露留存指标——net revenue retention、gross retention、churn、续约或合同期限数据均未公开——因此 stickiness
              只能推断。留存的结构性论点是合理的：一旦会议自动流入 Fireflies，笔记同步到 Salesforce、HubSpot 和 Slack，累积的可搜索会议历史就会变成 system of
              record，放弃成本上升；席位扩张也会跟随账户内自下而上采用。反面是，核心捕获用例的切换成本确实低，多工具并用容易，竞争者免费层和打包型平台 AI 都给用户便宜替代方案，因此留存并不确定。扩张经济靠
              land-and-expand：单个用户的 bot
              传播到团队，再到部门，最终触发企业安全审查和年度合同。客户侧集中度风险看起来低，因为基础高度分散、规模达数百万，且未披露大客户收入集中；更重要的依赖在渠道和平台——依赖 Zoom、Google Meet 和
              Teams 会议 API，以及 CRM 伙伴——再加上企业层采购摩擦，买方要求 Fireflies 尚未公开的经审计合规材料和
              SLA。客户净结论是：产品触达异常广、满意度强，但留存、付费基础规模和企业深度在公开证据中仍未证明，来自免费打包替代品的竞争可能侵蚀这些优势。
