      - number: '3.3'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Fireflies 的可防守性是竞争分析的关键。横向记录工具切换成本低，多工具并用常见，用户可以并排运行多个免费工具，这削弱了每一家独立供应商的锁定能力。随着开源和商品化 ASR
              把准确率推向同质化，转写护城河在全行业侵蚀；持久优势必须来自集成、工作流深度、积累的会议数据和价格，而不是原始转写能力。最严峻的结构性威胁是分发权：Microsoft、Google 和 Zoom 能把足够好的会议
              AI 打包进数亿用户已经付费的套件，压缩独立工具的付费意愿。规模对比会放大风险——Otter 收入已约为 Fireflies 的 10 倍，Gong 约 $7B
              估值也显示，该空间最丰厚的价值攫取在更上游的收入智能，而不是横向会议记录。Fireflies
              的反制组合是慷慨免费层、激进定价、集成宽度、大规模自报用户和数据足迹，以及无需烧风投资金也能竞争的资本高效盈利能力。该组合究竟构成持久护城河，还是只是面对拥有更强分发与资本的平台在位者时的一段临时领先，是尽调中尚未解决的核心问题；估值章节也应在这个镜头下阅读。
