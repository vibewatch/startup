      - number: '1.3'
        title: 规模、里程碑与负面标记
        blocks:
          - type: paragraph
            body: >-
              Fireflies 披露的运营规模很大：超过 20M 用户、覆盖 500,000 多个组织、处理超过 2B 分钟会议内容、被 75% 的 Fortune 500 使用，并且在 2025 年 6 月里程碑前 18
              个月用户增长 8 倍。GetLatka 的第三方收入估算显示，2024 年收入接近 $10.9M，高于 2023 年的 $5.8M；但这只是估算，不是审计数字。产品增长几乎完全来自自然传播：公司称直到 2025
              年基本没有投放营销，靠会议 bot 显眼加入通话形成病毒循环。关键技术关系来自投资人 Vinod Khosla，他把 Ramineni 介绍给 OpenAI 的 Sam Altman，使 Fireflies
              早期获得 GPT-3.5 访问权，并成为 OpenAI 较大的 token 消耗方之一。最重要的负面标记是声誉风险。2025 年 11 月，CTO Sam Udotong 公开讲述，2016 和 2017
              年，他和 Ramineni 曾亲自以名为「Fred」的静默人工记录员身份拨入客户会议，每月收费约 $100，同时告诉客户加入的是 AI——这是一种「Wizard of Oz」验证手法，被
              Futurism、Business Insider、Forbes 等媒体定性为「fake it till you make
              it」式欺骗。该事件发生在历史早期，产品现在确实已自动化，但在尽调中仍然相关，因为产品会记录敏感对话，管理层的信息披露规范因此要被审视。公司还曾三次被 Y Combinator
              拒绝。基于公开证据可发布的结论是：Fireflies 确实是一家盈利、资本效率高的品类领导者，自报规模很大且得到广泛侧面印证；但其头部财务和估值数字主要依赖公司陈述与私募市场定价，而不是独立审计。
