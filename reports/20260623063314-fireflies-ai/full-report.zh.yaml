  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面、模块与客户工作流
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Fireflies 消除了会议周边的手工劳动：用户连接日历后，Fireflies bot 自动加入已排期的 Zoom、Google Meet 或 Teams 通话，录制音频和视频，用 100
              多种语言转写对话，并在数分钟内交付结构化摘要、行动项列表和可全文搜索的转写稿。产品表面由多个模块组成。捕获是基础层——会议 bot 加上通过 app 或 API 上传音频 / 视频。其上是 AI
              笔记与摘要、行动项和任务管理器，以及覆盖整个会议档案的智能搜索。AskFred（也以 Personal Assistant
              形式呈现）是会话层，允许用户围绕会议提问、提取细节，并生成后续跟进、邮件或社交帖。会话智能增加发言人说话时长、情绪和团队分析，面向收入和客户成功团队。最新模块 Talk to Fireflies 是一个语音
              agent，可在实时会议中进行由 Perplexity 驱动的网页搜索。这些模块覆盖 Web、桌面、移动端（iOS 和 Android）以及 Chrome
              扩展，因此同一条从捕获到洞察的工作流会跟随用户跨表面运行。主导用例是销售通话捕获和 CRM 同步、招聘面试、客户成功通话和内部团队会议；免费层服务个人，付费层解锁分析和存储。
