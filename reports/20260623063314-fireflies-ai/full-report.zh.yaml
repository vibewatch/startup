  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与采用轨迹
        blocks:
          - type: paragraph
            body: >-
              Fireflies 的客户基础沿免费增值阶梯分层。个人专业人士和极小团队从免费层进入；专业人士和小团队转成 Pro；快速增长企业和收入团队购买
              Business，以获得会话智能和分析；大型企业则为安全、合规和管理控制签年度 Enterprise 合同。按职能看，采用集中在销售与 revenue
              operations、招聘和客户成功——这些团队的工作本身就是通话——也广泛用于一般内部会议。按垂直行业看，使用偏向服务占比高的领域，如专业服务、IT
              和咨询、营销、金融；按地域看，偏向英语市场，且英语界面进一步强化了这一点。主导渠道是产品驱动、自下而上的自助采用，bot
              在会议中的出现推动其在组织内病毒式扩散，先于任何自上而下销售。轨迹上，公司披露增长迅速——超过 20M 用户、覆盖 500,000 个组织，处理超过 2B 分钟会议内容——而早前公开数据称 2024 年约 10M
              用户，并有三位数年度用户增长；两者差异显示这些自报口径定义较松。定价页声称 1M+ 公司，高于其他地方引用的 500,000 个组织，也再次说明头部采用数字更偏方向性，而非经审计结果。
