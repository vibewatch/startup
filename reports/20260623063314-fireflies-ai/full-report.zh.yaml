  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Fireflies 最核心的法律风险是录音同意。产品的核心机制——一个自主 bot 以参会者身份加入会议，捕获音频，并将其流式传输到 Fireflies 云端转写——正面触及
              all-party（two-party）consent 窃听法。在联邦 Electronic Communications Privacy Act 下，Wiretap Act
              禁止故意拦截电子通信；约十几个州要求记录保密对话前必须获得所有参与方同意，其中最突出的是 California 的 California Invasion of Privacy
              Act。若记录工具只取得会议主持人的许可（并把收集其他所有人同意的负担转嫁给自己的客户），供应商和客户都会暴露在风险中。该理论并非假设：合并后的 Otter.ai 集体诉讼（In re Otter.AI
              Privacy Litigation, No. 5:25-cv-06911, N.D. Cal.）汇集了 2025 年 8-9 月提起的投诉，2026
              年中处于驳回动议阶段，指控的正是这一事实模式——OtterPilot 加入通话、记录非用户，并在未获所有方同意的情况下用录音训练模型——诉由包括 ECPA、CIPA、CFAA、intrusion upon
              seclusion 和 unfair competition。由于 Fireflies 使用同样的加入并记录架构，该案可直接类比其剩余风险。其上还叠加数据保护制度：GDPR
              要求处理个人数据必须有合法基础（同意或合法利益），并对特殊类别数据施加更严格条件；HIPAA 则约束任何出现受保护健康信息的会议。Fireflies 宣传 SOC 2、GDPR 和 HIPAA
              支持，并发布隐私政策与安全页面，这些是真实缓释；但公司没有公开披露诉讼历史、经审计 DPA、带数据驻留保证的 sub-processor 清单，或会议内容如何用于模型训练——这些正是尽调买方必须补齐的缺口。
