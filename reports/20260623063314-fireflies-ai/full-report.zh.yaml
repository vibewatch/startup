      - number: '1.2'
        title: 融资、估值与治理
        blocks:
          - type: paragraph
            body: >-
              Fireflies.ai 的融资历史是其投资故事的核心。公司约在 2018 年完成一笔小额 pre-seed，2019 年由 Canaan Partners 领投约 $5M 种子轮，2021 年由 Khosla
              Ventures 领投 $14M Series A；三轮累计融资估算约 $19M。Series A 后，Khosla 合伙人 Sandhya Venkatachalam 与 Canaan 合伙人 Rayfe
              Gaspar-Asaoka 加入董事会；早期天使据称包括 Salesforce、Slack 和 Dropbox 的高管。决定性事件发生在 2025 年 6 月 12 日：Fireflies 宣布首次 tender
              offer 后估值超过 $1B。这是一笔二级交易，为长期早期员工提供流动性，而不是注入一级资本或稀释股权结构。公司称其自 2023 年起已盈利，2021
              年以来未再进行一级融资，并保持三位数同比增长。Crunchbase 佐证了这一里程碑，称这家成立 9 年、位于 San Francisco 的公司完成了一笔「面向早期团队成员的二级融资」，估值达到
              $1B。治理仍像典型 VC 支持的私营公司一样不透明：优先股清算优先权、董事会控制权和精确股权结构均未披露，Fireflies 也无义务向 SEC 提交财务报表。员工股份在 Nasdaq Private
              Market 交易，管理层已表示未来计划定期进行 tender offer。因此，该估值作为二级市场清算价是真实的，但并未锚定经审计财务数据；后续章节应把 $1B 视为投资者需求的证据，而不是可用于承销的数字。
