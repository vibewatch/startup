      - number: '6.2'
        title: 具名客户证明、引用质量与满意度
        blocks:
          - type: paragraph
            body: >-
              Fireflies 的公开客户证明覆盖面广、情绪积极，但缺少量化企业结果。公司客户页展示了高级领导者的具名推荐，包括 April Underwood（时任 Slack Chief Product
              Officer）、Susan Kimberlin（与 Salesforce 相关的搜索负责人）、Sarup Banskota（Vercel Head of Growth），以及
              CyberBytes、Qualytics、Brado 等较小公司的创始人和高管。这些声音可信，显示知名操盘手背书，但它们是推荐语，不是绑定具名生产部署和 ROI
              的结构化、指标化案例研究。第三方评论在数量上更强：Fireflies 在 G2 上数百至数千条评论中约为 4.8/5，TrustRadius 和 PeerSpot 评分有利，在 Chrome Web Store
              上也高分；评论者持续赞赏转写速度、摘要、行动项和节省时间。独立评论也暴露了影响引用质量的真实限制：只有英文界面令国际团队不满，发言重叠时串音处理一般，AI
              摘要能抓事实但错过情绪细节，会话智能也浅于专门的辅导工具。整体图景是：产品让庞大的 SMB 和 prosumer 基础满意；企业证明更多建立在 logo
              和评分上，而不是披露的、结果量化的生产部署——尽调买方需要通过直接客户访谈弥补这一缺口。
