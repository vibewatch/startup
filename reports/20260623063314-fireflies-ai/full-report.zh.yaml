      - number: '5.3'
        title: 信任、合规、差异化与产品成熟度
        blocks:
          - type: paragraph
            body: >-
              Fireflies 强调企业级信任姿态，以赢得受监管和重视安全的买方。公司宣传 SOC 2 Type II、GDPR 合规、面向医疗的 HIPAA BAA 支持（仅
              Enterprise）、私有存储和自定义数据留存、SSO/SCIM、审计日志，以及隐私卖点的核心：不使用客户数据训练 AI
              模型。这些控制是抵消会议录制产品核心风险的主要砝码：客户经常在会议中分享机密信息，因此数据处理是采购的门槛条件。差异化方面，持久优势来自集成宽度（100 多个连接器）、推动自下而上采用的慷慨免费层和低价、通过
              CRM 同步形成的工作流锁定，以及不断增长的会议历史数据资产，为搜索和分析提供动力；品牌和 Fred bot 也增加识别度。G2 和 TrustRadius
              用户评论中暴露的弱点包括：部分语言和口音准确率不完美（例如 Hindi）、CRM
              集成摩擦，以及底层转写并不独特。成熟度上，捕获、转写、摘要、行动项和集成已经成熟，并在规模上得到验证；会话智能和分析已建立但差异化较弱；语音 agent 与多语言路线图（Talk to Fireflies、AI
              voice agents）仍处早期。技术净结论是：产品能力强、集成度高，护城河来自运营和数据，而不是专有模型优势，因此仍暴露在平台在位者打包相似能力的风险下。
