      - number: '2.3'
        title: 买方、需求驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场覆盖很宽的买方光谱，从自助使用免费或约 $10/月计划的个人专业用户，到通过采购流程购买 Business 和 Enterprise 层级的企业 IT 与 revenue operations
              团队。付款人与预算负责人会随细分市场变化：一端是单个知识工作者报销一个席位，另一端是 CIO 或销售 VP 在数千名用户中标准化部署。会话智能需求集中在企业销售分析，占该邻近市场
              54%，说明最高价值预算在收入团队手中。需求驱动强且持久：混合和远程办公延续，美国约五分之一员工完全远程，超过一半拥有混合办公权限；Microsoft 报告称，30% 的会议现在跨多个时区，较 2021 年上升
              8 个百分点。生成式 AI 集成持续扩大功能边界，企业愿意为 AI 助手付费，也可从 ServiceNow 约 $2.85B 收购 Moveworks 等交易中看到。与这些驱动相对的是严肃约束。以 OpenAI
              Whisper 为代表的开源语音识别每月下载约 5M 次，词错误率低于 2%，已把核心转写输入商品化，因此准确率不再构成差异点。Microsoft、Google 和 Zoom
              的原生助手把重叠能力打包进买方已付费的平台；横向会议记录工具切换成本低，多工具并用容易；隐私和 GDPR
              义务也推动企业严格审查会议录制供应商。市场在扩张，但价值正在沿栈上移，流向分析、工作流和信任，而不是转写本身。
