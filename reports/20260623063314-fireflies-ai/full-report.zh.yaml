      - number: '7.3'
        title: 财务、依赖、人员与治理风险
        blocks:
          - type: paragraph
            body: >-
              Fireflies 的财务和治理风险集中在无法核验的自报指标，以及通往十亿美元估值的异常路径。头部数字——超过 20M 用户、被 75% 的 Fortune 500
              使用、以及盈利说法——都来自公司且未经审计；公开第三方对收入和用户数的估算分歧很大，因此外部无法确认底层经济性。$1B 估值来自 2025 年 6
              月的二级交易，为早期团队成员提供流动性，而不是有新领投方尽调和新资产负债表的一级融资，这削弱了该数字代表公平交易融资估值的信号。负面报道进一步放大可信度风险：一位创始人公开回忆，公司最早的「AI
              transcription」其实是他本人加入会议手工记笔记；这个病毒式故事被多家媒体描述为 fake-it-till-you-make-it
              警示案例——声誉上可控，但在尽调流程中是治理和披露警讯。依赖和集中风险具有结构性：Fireflies 依赖 Zoom、Google Meet 和 Teams 的会议访问，也依赖 CRM
              伙伴（Salesforce、HubSpot）来兑现工作流价值；其中任何一方都可能限制 bot 访问或打包竞争功能。核心捕获用例切换成本低，多工具并用容易；执行也高度依赖两位创始人（Krish Ramineni 和
              Sam Udotong），属于关键人集中，且没有披露继任计划或深厚的公开管理梯队。Burn、runway 和 cap table
              细节均未披露。下文将每项风险配对一个可监控触发器和一个尽调问题，使论点可随着证据到来重新承销。
