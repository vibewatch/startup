      - number: '3.2'
        title: 能力、定价与市场进入方式对比
        blocks:
          - type: paragraph
            body: >-
              核心能力上，行业已经收敛：转写、AI 摘要和行动项已成为 Fireflies、Otter、Fathom、Avoma 以及打包型平台工具的标配，技术核心基本商品化。差异化现在在边缘：Fireflies 依托 100
              多个与 CRM、Slack、项目工具的集成和工作流自动化；Otter 强调实时协作笔记；Avoma 和 Gong
              加入辅导、预测和更深的收入分析；平台在位者则胜在会议发生处已经预装。直接同业定价高度集中：Fireflies Pro 约 $10/月，Otter Pro 约 $8 至 $17、Business 约
              $30/用户，Avoma 记录员席位约 $19 起、Business 约升至 $49，Fathom 用永久免费计划和 $19 升级价锚定低端。免费层是活跃战场——Fireflies 每月给 800
              分钟，Otter 给 300 分钟，Fathom 和 tl;dv 推不限量或不限时免费使用。企业会话智能定价完全不同：Gong
              采用定制化高价，反映其对收入团队价值的攫取。市场进入方式也明显分化：Fireflies 和 Otter 依靠产品驱动增长与会议中的病毒式 bot，Gong
              和平台在位者则使用企业销售动作与打包销售。在信任与合规上，Fireflies 宣传 SOC 2、GDPR 和 HIPAA 合规姿态，并称不会用客户数据训练模型；Otter
              则因训练实践受到审查，这提醒市场：信任仍是活的竞争轴。
