  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近市场与替代方案
        blocks:
          - type: paragraph
            body: >-
              Fireflies.ai 竞争的赛道是 AI 会议助手。G2 等行业追踪机构把该类别定义得较窄：软件利用 AI
              和自然语言处理来转写会议、追踪发言人和对话、生成摘要并提取行动项，并且主动参与会议，而不仅是安排会议。纳入的支出是跨 Zoom、Google Meet、Microsoft Teams
              等视频平台，围绕自动录音、转写、总结和会后工作流产生的经常性 SaaS 订阅收入。边界之外是纯听写工具、媒体字幕服务，以及规模巨大的医疗和法律转写市场；这些市场服务的买方和流程不同，仅医疗转写市场 2026
              年规模就接近 $97B，比会议助手细分赛道大一个数量级，也不是 Fireflies 触达的市场。该类别嵌在三个相互重叠的邻近市场中：语音和语音识别、speech-to-text（STT）API
              层，以及会话智能软件；三者可视为逐层放大的测算镜头。这个边界最重要的竞争特征是：现状方案便宜且已嵌入。买方可以用手工记录、指定人工记录员、Zoom、Teams 和 Google Meet 已内置的原生录制与 AI
              功能，或开源转写来替代。因此市场真实且在增长，但边缘也很拥挤，因为同一项待完成任务越来越多地由用户已拥有的工具完成。
