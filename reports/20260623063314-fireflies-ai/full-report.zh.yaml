      - number: '5.2'
        title: 架构、开发者平台、集成与部署
        blocks:
          - type: paragraph
            body: >-
              其运行架构是分层软件栈。底部是捕获和摄取层——会议 bot 与音频 / 视频上传——接入支持 100 多种语言的 speech-to-text 转写引擎。转写之上是 AI
              处理服务，利用大语言模型生成摘要、行动项和分析；再加上搜索 / 索引层，使转写稿及其元数据可查询。应用层通过 Web app、桌面和移动客户端、Chrome 扩展与 AskFred
              暴露这些能力。对可扩展性最关键的是，Fireflies 提供开发者平台：托管在 api.fireflies.ai 的 GraphQL API，所有请求都需要 API
              key，可通过查询和变更拉取转写稿、摘要、句子和发言人数据，也可上传音频；Webhooks V2 则推送实时 meeting.transcribed 和 meeting.summarized 事件，并使用
              HMAC 签名验证。该 API 支撑集成：Fireflies 连接 100 多个工具——Salesforce、HubSpot、Pipedrive、Zoho、Slack、Notion、Zapier，以及
              Greenhouse、Lever 等 ATS 系统——把笔记和行动项推入收入和招聘团队已工作的记录系统。部署形态是纯云 SaaS，可靠性和支持按计划分层，Enterprise
              提供专属账户管理。架构现实是，转写和总结原语依赖商品化及第三方模型——同类 Whisper-class ASR 与通用 LLM 能力竞争者也可获得——因此可防守工程在编排、集成管道、会议数据搜索和常驻 bot
              的可靠性上，而不在核心模型本身。
