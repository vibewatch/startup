      - number: '8.2'
        title: 可比估值与 bull / base / bear 情景
        blocks:
          - type: paragraph
            body: >-
              按可比口径看，$1B 这道线偏紧。最常被引用的 2024 年收入估算约 $10.9 million，对应隐含 trailing multiple 接近 90x；另一个 $3.3 million 的估算会把倍数推向
              300x。相比之下，对话智能龙头 Gong 在 $7.3 billion 估值、约 $400M 收入上大约是 18x；Fathom 的 2024 年 Series A 估值约 $73 million，对应
              $10M–$30M ARR，落在 2–7x；Otter 上一轮风险投资估值接近 $250 million；ZoomInfo 以约 $575 million 收购 Chorus.ai；按 Bessemer
              云基准，广义 SaaS 中位数约为 6–8x 收入，高增长头部四分位公司也只在低双位数到十几倍中段。即便把盈利、资本效率和增长给 Fireflies 加上溢价，一个站得住脚的收入倍数框架也会明显低于 $1
              billion，除非真实 ARR 远高于公开估算。几个情景正是为了框住这种不确定性。熊市情景（$200–400M）假设经审计 ARR 接近约 $11M 的公开数字，且平台把免费会议 AI
              打包后压缩增长，迫使估值重定到 15–25x。基准情景（$500M–$1B）假设真实 ARR 明显更高（或许 $30–60M），且盈利能持续，支撑接近二级交易标记的十几倍中段到 20x
              倍数。牛市情景（$1B–$2B+）假设 ARR 已接近九位数，历史增长为三位数，留存强，并且数据护城河守得住，让 $1B
              标记成为地板而不是天花板。区间本身就是结论：公开证据无法区分一款高价小众工具，还是一家披露不足、ARR 已达九位数的复利型公司。
