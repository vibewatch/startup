  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接、在位与打包型竞争者构成的竞争格局
        blocks:
          - type: paragraph
            body: >-
              竞争集合分为三层。直接 AI 会议助手同业是最近的对手：Otter.ai 是规模领导者，Sacra 估计其 2025 年 3 月 ARR 约 $100M（高于 2024 年末的 $81M），用户超过
              25M；公司融资约 $70M，2021 年最后估值约 $250M。Fathom 主打简单和异常慷慨的永久免费层，Avoma 定位为端到端会议生命周期和会话智能平台，tl;dv 声称其不限时免费记录工具用户超过
              2M，MeetGeek 与 Read.ai 则补齐免费层阵营。再上一层，是面向企业收入团队的会话智能在位者：Gong 是独立领导者，收入约 $317.7M，估值约 $7.3B，累计融资 $583M，员工超过
              1,500 人，服务 5,000 多个收入团队；Chorus.ai 已被 ZoomInfo 吸收，如今作为 ZoomInfo Chorus 随一家 2024 年收入 $1.21B
              的上市公司出货。但战略上最重要的竞争者是平台所有者本身：Microsoft 通过 Microsoft 365 Copilot 把会议 AI 打包进 Teams，Google 把 Gemini 嵌入
              Workspace 和 Meet，Zoom 则把 AI Companion 摘要和笔记免费提供给付费 Zoom 计划。未来潜在进入者很可能包括所有 CRM 和 LLM 平台——Salesforce、HubSpot
              等都能加入原生会议捕获能力，使格局保持开放和多孔。
