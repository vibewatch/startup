  summary: >-
    Fireflies.ai 是一款已盈利、资本效率高的 AI 会议助手。它以 bot 身份加入线上会议，录音、转写、总结并分析对话，再把笔记和行动项同步到 CRM 与协作工具。公司在 2025 年 6 月通过一笔二级交易达到 $1B
    估值，并非一级融资；累计融资仅约 $19M。采用面广且自下而上，公司称用户超过 20M，并被 75% 的 Fortune 500 使用；但所有头部指标都来自公司自报或第三方估算，从未审计，公开证据难以核验收入量级、留存和估值。
