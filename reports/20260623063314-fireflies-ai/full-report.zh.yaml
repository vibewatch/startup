  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Fireflies 主要风险如何传导到客户、收入、利润率、融资和估值。
    data:
      nodes:
        - id: consent
          label: 同意 / 窃听暴露
          detail: 全员同意法律叠加 Otter 可类比先例。
          tone: warning
        - id: bundling
          label: 在位者捆绑
          detail: Teams、Meet 和 Zoom 内置免费会议 AI。
          tone: warning
        - id: commodity
          label: 转写商品化
          detail: 开源 Whisper 侵蚀 ASR 护城河。
          tone: warning
        - id: churn
          label: 留存 / 流失压力
          detail: 切换成本低，免费替代品多。
          tone: warning
        - id: pricing
          label: 定价权压缩
          detail: 单独为会议笔记收费更难。
          tone: warning
        - id: revenue
          label: 收入增长承压
          detail: 净新增和扩张收入放慢。
          tone: negative
        - id: valuation
          label: 估值支撑
          detail: 二级市场给出的 $1B 标记更难承销。
          tone: negative
      edges:
        - from: consent
          to: churn
        - from: bundling
          to: churn
        - from: bundling
          to: pricing
        - from: commodity
          to: pricing
        - from: churn
          to: revenue
        - from: pricing
          to: revenue
        - from: revenue
          to: valuation
    approximationNotes: 该图展示传导方向，不展示幅度；Fireflies 未披露量化每条边所需的留存或定价数据。
    claimRefs:
      - CR014
      - CR018
      - CR031
      - CR038
  - id: FR003
    title: 依赖图谱
    type: dag
    layout: wide
    summary: Fireflies 在采集、流程价值和合规上依赖的关键外部方。
    data:
      nodes:
        - id: fireflies
          label: Fireflies.ai
          detail: AI 会议助手；中心节点。
          tone: neutral
        - id: platforms
          label: 会议平台
          detail: Zoom、Google Meet、Microsoft Teams 的 bot 接入。
          tone: warning
        - id: crm
          label: CRM 伙伴
          detail: Salesforce 和 HubSpot 提供流程价值。
          tone: neutral
        - id: models
          label: AI 模型 / 云服务商
          detail: ASR 与 LLM 处理，加上托管。
          tone: neutral
        - id: regulators
          label: 监管机构 / 法律
          detail: ECPA、CIPA、GDPR、HIPAA 合规制度。
          tone: warning
        - id: customers
          label: 客户
          detail: 自下而上的用户和企业买家。
          tone: positive
      edges:
        - from: platforms
          to: fireflies
        - from: models
          to: fireflies
        - from: crm
          to: fireflies
        - from: regulators
          to: fireflies
        - from: fireflies
          to: customers
    approximationNotes: 边表示依赖方向；同一批会议平台既是依赖方，也是竞争对手，伙伴风险登记表突出了这种双重角色。
    claimRefs:
      - CR024
      - CR036
      - CR037
      - CR043
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 判断取决于 Fireflies 的真实质量是否足以支撑约 90x 公开收入的估值标记。
    data:
      nodes:
        - id: n1
          label: 盈利、资本效率高、采用广泛
        - id: n2
          label: 支撑较高的公司质量评分
        - id: n3
          label: $1B 二级市场标记 = 约 90x 公开收入
        - id: n4
          label: 指标未经审计；二级市场不是一手信号
        - id: n5
          label: 公开证据无法承销该价格
        - id: n6
          label: 推荐 = 继续研究 / 跟踪
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 这条逻辑链说明，为什么公司质量高仍只能给出跟踪判断：价格取决于未经验证的收入。
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV013
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 隐含估值对真实 ARR 高度敏感；收入假设小幅变化，就会大幅摆动估值标记。
    data:
      items:
        - label: $11M ARR，20x
          value: 220
          detail: USD M — 公开估算，使用偏慷慨倍数
          tone: negative
        - label: $30M ARR，18x
          value: 540
          detail: USD M — 基准情形下限
          tone: warning
        - label: $50M ARR，20x
          value: 1000
          detail: USD M — 接近二级市场标记的基准 / 乐观交界
          tone: warning
        - label: $1B 二级市场标记
          value: 1000
          detail: USD M — 2025 年 6 月参考值
          tone: neutral
        - label: $80M ARR，20x
          value: 1600
          detail: USD M — 乐观情形
          tone: positive
    approximationNotes: 柱状值是供 IC 讨论使用的 ARR×倍数组合示意，不是 DCF 输出；它们显示，$1B 标记需要约 $50M+ ARR， 才能在类 SaaS 倍数下站得住。
    claimRefs:
      - CV014
      - CV018
      - CV022
      - CV024
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 围绕 $1B 二级市场标记形成的估值包络很宽但有边界，核心驱动是 ARR 尚未厘清。
    data:
      items:
        - label: 悲观情形
          low: 200
          mid: 300
          high: 400
          displayValue: $200M-$400M
          detail: 经审计 ARR 接近 ~$11M；捆绑挤压增长。
        - label: 基准情形
          low: 500
          mid: 750
          high: 1000
          displayValue: $500M-$1B
          detail: 真实 ARR 为 ~$30-60M，且盈利可持续。
        - label: 乐观情形
          low: 1000
          mid: 1500
          high: 2000
          displayValue: $1B-$2B+
          detail: ARR 接近九位数；留存强，数据护城河稳。
        - label: 二级市场标记
          low: 1000
          mid: 1000
          high: 1000
          displayValue: $1B
          detail: 2025 年 6 月员工流动性交易。
    approximationNotes: 区间是供委员会讨论的估值包络，不是 DCF 输出；二级市场标记落在基准情形高端、乐观情形低端。
    claimRefs:
      - CV019
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 若少数高杠杆指标得到确认，推荐结论会转向买入或放弃。
    data:
      items:
        - label: 经审计 ARR 与增长
          value: Undisclosed
          note: 估值倍数的总开关
        - label: 已验证盈利能力 / 利润率
          value: Undisclosed
          note: 确认资本效率溢价
        - label: 净收入留存
          value: Undisclosed
          note: 决定耐久性和倍数
        - label: 二级交易条款
          value: Undisclosed
          note: 界定 $1B 标记代表什么
        - label: 付费与免费用户基数
          value: Undisclosed
          note: 衡量支撑倍数的收入基础
    approximationNotes: 所有高杠杆 KPI 目前都未披露；因此推荐结论受证据门槛约束，而不是认为公司质量不足。
    claimRefs:
      - CV029
      - CV031
      - CV034
      - CV041
