      - number: '8.3'
        title: 打破投资论点的触发器、尽调问题与估值结论
        blocks:
          - type: paragraph
            body: >-
              估值结论可以落到少数可监控触发器和尽调问题上。最关键的尽调项是经审计 ARR 及其增长率：整套估值逻辑取决于真实收入究竟接近约 $11M 的公开估算，还是高出很多；一旦拿到有定义口径的确认
              ARR，大部分不确定性就会被压缩。紧随其后的是经验证的盈利能力和利润率（用来确认资本效率叙事）、队列留存和净收入留存（决定耐久性和倍数），以及二级交易条款——每股价格、卖方是谁、流动性折价和任何优先清算结构——以判断
              $1B 数字到底代表什么。下行的论点失效触发器包括：经审计 ARR 落在公开估算附近（意味着 90x 标记）、现有平台把免费会议 AI 打包后净收入留存降到约 100% 以下，或在某个主要平台失去 bot
              接入；任何一项都足以支持估值重定到熊市区间。上行确认则来自数千万到数亿美元的经审计 ARR，且留存强，这会验证二级交易标记和牛市情景。在这些问题关闭前，负责任的立场是 research-more /
              track：接触公司拿到经审计财务和留存数据，任何进入价格都应落在基准情景区间并带下行保护，避免仅凭公开证据承销完整 $1B。资产质量确实存在；价格纪律必须等到数字被验证。
