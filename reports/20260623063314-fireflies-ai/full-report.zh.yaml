            - 移动端（iOS/Android）
            - Chrome 扩展
          outputs:
            - 用户工作流表面
        - label: 智能层
          detail: AskFred、摘要、对话智能、语音代理
          tone: positive
          modules:
            - AskFred
            - 摘要与行动项
            - 与 Fireflies 对话
          outputs:
            - 洞察和内容
        - label: 搜索与数据
          detail: 覆盖完整会议档案的索引
          tone: positive
          modules:
            - 智能搜索
            - 转录存储
            - 分析
          outputs:
            - 可查询会议历史
        - label: AI 处理
          detail: LLM 摘要和分析
          tone: neutral
          modules:
            - LLM 摘要
            - 情绪 / 发言时长
          outputs:
            - 结构化会议数据
        - label: 转录
          detail: 支持 100+ 种语言的商品化语音转文本
          tone: warning
          modules:
            - ASR 引擎
            - 语言支持
          outputs:
            - 原始转录
        - label: 捕捉与 API
          detail: 会议机器人、上传、GraphQL API、Webhooks V2
          tone: positive
          modules:
            - 会议机器人（Fred）
            - GraphQL API
            - Webhooks V2
          outputs:
            - 已捕捉音频和事件
    approximationNotes: 分层基于开发者文档和产品页面推断；Fireflies 未发布正式架构图。
