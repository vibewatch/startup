      - number: '4.2'
        title: 单位经济、市场进入效率与成本结构
        blocks:
          - type: paragraph
            body: >-
              Fireflies 的市场进入几乎完全由产品驱动：创始人称，公司以几乎零付费营销触达 20M 用户，靠会议中的病毒式
              bot、慷慨免费层和自下而上进入企业的采用路径增长。该自助动作压低获客成本，也构成公司盈利说法的机械基础，因为一款靠口碑增长的免费增值语音产品避开了多数 AI 同业的销售与营销烧钱。扩张经济通过 CRM
              跑通：Fireflies 把通话摘要和行动项推入 Salesforce、HubSpot、Pipedrive、Zoho 以及
              Slack，加深收入团队的工作流锁定，并支持账户内席位扩张。成本结构主要由转写和推理算力、模型与存储成本构成；核心利润率风险在于底层 ASR
              层已商品化。公司部分通过使用开源和第三方模型，而不是从零训练自有模型来抵消这一点。CAC、回本期、net revenue
              retention、毛利率或流失率均未披露，因此单位经济只能从定性图景推断——企业集成深度暗示总留存可能强，但没有量化——而无法直接测量。缺少这些标准 SaaS
              指标，是判断盈利说法到底反映持久单位经济，还是某一时点快照时最大的缺口。
