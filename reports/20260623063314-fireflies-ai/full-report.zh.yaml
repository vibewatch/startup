  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与变现质量
        blocks:
          - type: paragraph
            body: >-
              Fireflies 采用产品驱动的免费增值 SaaS 模型，公开四个层级。Free 计划提供不限量转写和 AI 摘要，但存储有限；Pro 计划标价 $18/席/月，或年付 $10，并增加视频录制、集成和 AI
              credits；Business 计划标价 $29/月，或年付 $19，解锁会话智能、团队分析和不限量存储；Enterprise 计划仅支持年付，每席 $39，并加入 SSO/SCIM、HIPAA
              合规、审计日志和自定义留存。因此，变现依赖把免费记录工具用户转成付费席位，再扩展到分析更重的 Business 和 Enterprise 层级；API 作为补充，可让开发者把第三方通话和会议音频接入
              Fireflies 做转写。收入属于经常性订阅收入，管理层称利润率可比传统 SaaS——这在语音 AI
              中值得注意，因为该垂直是算力最密集的方向之一。收入质量无法独立核验：没有审计报表、没有申报文件，公开收入数字来自第三方估算。GetLatka 估计 2024 年收入约 $10.9M，高于 2023 年 $5.8M
              和 2021 年 $4.2M，意味着持续约 100% 的同比增长；另一家追踪机构 Growjo 则估计年收入更接近 $3.3M——分歧很大，本身就是尽调警讯。
