  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Fireflies 的典型采用路径：个人发现、团队扩散，最后进入企业合同。
    data:
      nodes:
        - id: discover
          label: 发现
          detail: 个人在别人的会议里看到 Fireflies bot 后，把它加入自己的通话。
          tone: positive
        - id: land
          label: 落地（免费 / Pro）
          detail: 用户在日常通话中用免费或 Pro 档做个人笔记。
          tone: neutral
        - id: spread
          label: 团队扩散
          detail: bot 出现在会议现场，推动团队和部门内的病毒式采用。
          tone: positive
        - id: embed
          label: 嵌入流程
          detail: 笔记和行动项同步到 CRM 与 Slack，Fireflies 由此成为记录系统。
          tone: positive
        - id: enterprise
          label: 企业合同
          detail: IT 与安全审查触发带 SSO 和合规要求的年度 Business/Enterprise 交易。
          tone: warning
    approximationNotes: 这条旅程对应公司对外营销的自下而上打法；各阶段转化率未披露。
    claimRefs:
