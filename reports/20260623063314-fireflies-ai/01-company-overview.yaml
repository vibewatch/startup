company:
  name: Fireflies.ai
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Fireflies.ai is a profitable, remote-first AI meeting-assistant company founded in 2016 by Krish Ramineni and Sam
    Udotong that reached a $1 billion valuation in June 2025 through a secondary tender offer rather than a primary
    venture round. Public evidence supports unusual capital discipline, large self-reported scale, and a credible
    founder story, but also a documented "fake-it-till-you-make-it" origin controversy and a private cap table that
    limits independent verification of valuation and profitability claims.
sections:
  - id: identity-and-leadership
    title: Identity, founders, and leadership
    body: >-
      Fireflies.ai is an AI meeting assistant that automatically records, transcribes, summarizes, and analyzes
      conversations across Zoom, Google Meet, Microsoft Teams, and other platforms. The legal entity is Fireflies.AI
      Corp., incorporated in Delaware with its principal place of business in California, and the company presents itself
      as the "#1 AI assistant for meetings" used by people at 75% of Fortune 500 companies. It was founded in 2016 by
      Krish Ramineni, who serves as chief executive officer, and Sam Udotong, who serves as chief technology officer.
      Udotong graduated from MIT in 2016 with a degree in aeronautics and astronautics, and the pair met at an MIT
      hackathon while Ramineni was a University of Pennsylvania student who later worked briefly as a product manager at
      Microsoft. The company name "Fireflies" survived through roughly six failed iterations before the founders settled
      on a meeting transcription assistant. Leadership has been remarkably stable: both founders have run the company
      since inception, which concentrates key-person dependence but also signals tight founder control of strategy,
      product, and the cap table. The company is deliberately remote-first, describing itself as a global organization of
      roughly 100 to 120 people spread across more than 20 countries, with no central office. That structure is part of
      the company's identity and its cost-discipline narrative, but it also means independent on-the-ground verification
      of headcount and operations is limited to company statements and third-party databases.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
