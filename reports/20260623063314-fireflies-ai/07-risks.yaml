  evidenceGaps:
    - type: missing-source
      severity: material
      topic: model-training use of meeting content
      missingEvidence: >-
        Fireflies does not transparently disclose whether or how customer meeting content is used to train its AI models,
        or the opt-out mechanics by tier.
      whyItMatters: >-
        Training-use disclosure is central to both the consent-litigation exposure and enterprise procurement; the Otter
        case turns partly on this very issue.
      diligencePath: >-
        Obtain Fireflies' data-processing addendum, model-training terms, and enterprise opt-out documentation, and confirm
        contractual training-use limits.
      relatedQuestionRefs:
        - QR006
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: litigation and DPA audit history
      missingEvidence: >-
        No public litigation history, audited DPA, sub-processor data-residency list, or breach disclosure is available
        for Fireflies.
      whyItMatters: >-
        A diligence buyer cannot size legal and compliance liability without confirmed litigation status and audited
        data-protection artifacts.
      diligencePath: >-
        Request litigation and regulatory-correspondence history, SOC 2 report, DPA, and sub-processor list directly from
        management under NDA.
      relatedQuestionRefs:
        - QR008
        - QR014
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: profitability, burn, and runway
