  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Recording-consent litigation
        - Suit filed naming Fireflies or adverse Otter ruling
        - Class certified or denial of MTD on ECPA/CIPA
        - Re-price legal liability; demand indemnity / escrow
      - - Incumbent bundling
        - Free native meeting AI parity in Teams/Meet/Zoom
        - Net revenue retention falls below ~100%
        - Cut growth assumptions; widen valuation discount
      - - Metric credibility
        - Audited usage/revenue diverges from claims
        - Paid base or ARR materially below estimates
        - Reset valuation to verified financials
      - - Platform dependency
        - Major platform restricts third-party bots
        - Loss of API access on a top-three platform
        - Stress-test revenue exposed to that channel
      - - Key-person concentration
        - Founder departure or reduced involvement
        - CEO or CTO exit without succession
        - Apply key-person discount; demand retention terms
    notes: >-
      Triggers are designed to be externally monitorable; thresholds convert each top risk into a measurable thesis-break
      event with an explicit action for the investment committee.
