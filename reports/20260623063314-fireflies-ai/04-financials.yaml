  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: revenue estimate
      missingEvidence: >-
        Two third-party trackers disagree by roughly 3x on Fireflies' annual revenue (GetLatka ~$10.9M vs Growjo ~$3.3M),
        and no audited or company-confirmed figure exists to reconcile them.
      whyItMatters: >-
        Revenue magnitude drives every multiple and the credibility of the profitability claim; a 3x spread makes the
        $1 billion valuation impossible to anchor.
      diligencePath: >-
        Request company-confirmed ARR, an audited or reviewed P&L, and Stripe/billing exports under NDA to triangulate
        actual recurring revenue.
      relatedQuestionRefs:
        - QI003
        - QI004
        - QI023
      relatedTableRefs:
        - TI005
    - type: private-evidence-only
      severity: blocking
      topic: unit economics
      missingEvidence: >-
        No CAC, CAC payback, net-revenue-retention, gross-margin, or churn figure is public; the unit-economics picture is
        entirely qualitative.
      whyItMatters: >-
        Without these metrics, it is impossible to judge whether profitability reflects durable unit economics or a
        point-in-time snapshot that could erode under competitive pricing pressure.
      diligencePath: >-
        Obtain cohort retention, gross and net revenue retention, blended and paid CAC, and a hosting/model COGS breakdown
        from management.
      relatedQuestionRefs:
        - QI011
        - QI012
      relatedTableRefs:
        - TI003
    - type: missing-source
      severity: material
      topic: paying customer base
      missingEvidence: >-
        The split between paying seats and free users, and the enterprise-versus-self-serve revenue mix, is not disclosed.
      whyItMatters: >-
        A large free base with a thin paid layer would imply a far smaller revenue base than the headline user count
