company:
  name: Fireflies.ai
chapter:
  number: 4
  title: Financials
  summary: >-
    Fireflies.ai monetizes a freemium SaaS subscription model across four tiers (Free, Pro at $10/seat/month annual,
    Business at $19, and annual-only Enterprise at $39) plus API access, and the company is an unusual profitable AI
    unicorn: it has been profitable since 2023, raised only about $19 million in total (a ~$4.5M seed led by Canaan and a
    $14M Series A led by Khosla Ventures), and has taken no primary capital since 2021. Third-party trackers estimate
    revenue at roughly $10.9 million for 2024 (GetLatka) — though a competing tracker pegs it near $3.3 million, exposing
    the central problem: every headline metric (revenue, profitability, 20M users, 75% of the Fortune 500) is
    company-asserted or third-party-estimated, never audited or filed. The June 2025 tender offer that crystallized the
    $1 billion valuation provided early-employee liquidity rather than primary capital, so capital adequacy is strong on
    paper but the revenue-quality, margin, and churn evidence a diligence buyer needs remains private and unverifiable.
sections:
  - id: revenue-monetization
    title: Revenue model, pricing, and monetization quality
    body: >-
      Fireflies runs a product-led freemium SaaS model with four published tiers. The Free plan offers unlimited
      transcription and AI summaries with limited storage; the Pro plan lists at $18 per seat monthly or $10 billed
      annually and adds video recording, integrations, and AI credits; the Business plan lists at $29 monthly or $19
      annually and unlocks conversation intelligence, team analytics, and unlimited storage; and the Enterprise plan is
      annual-only at $39 per seat and adds SSO/SCIM, HIPAA compliance, audit logs, and custom retention. Monetization
      therefore depends on converting free notetaker users into paid seats and then expanding into analytics-heavy
      Business and Enterprise tiers, supplemented by an API that lets developers pipe third-party calling and conferencing
      audio into Fireflies for transcription. Revenue is recurring subscription revenue, and management says margins are
      comparable to traditional SaaS — a notable claim in voice AI, one of the most compute-intensive verticals. The
      quality of that revenue cannot be independently verified: there are no audited statements, no filings, and the
      public revenue figure is a third-party estimate. GetLatka estimates 2024 revenue at about $10.9 million, up from
      $5.8 million in 2023 and $4.2 million in 2021, implying sustained roughly 100% year-over-year growth, while a second
      tracker, Growjo, estimates annual revenue closer to $3.3 million — a wide spread that is itself a diligence flag.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI031
    tableRefs:
      - TI001
      - TI002
