callouts:
  - calloutType: insight
    title: The market is real and growing, but value is migrating off transcription
    body: >-
      Every sizing lens shows double-digit growth, yet open-source ASR and bundled native tools are commoditizing the
      transcription input. The defensible value is moving up-stack to analytics, workflow integration, and trust, which
      is where Fireflies must out-execute incumbents.
    claimRefs:
      - CM015
      - CM024
      - CM028
      - CM030
  - calloutType: risk
    title: No clean serviceable market and wide estimate dispersion
    body: >-
      Published CAGRs range from 7% to nearly 35% and no retained source isolates a Fireflies-specific SAM/SOM, so any
      valuation anchored to a single TAM is fragile. Fireflies' estimated ~$11M ARR is a tiny slice of even the current
      meeting-assistant market.
    claimRefs:
      - CM015
      - CM039
      - CM041
