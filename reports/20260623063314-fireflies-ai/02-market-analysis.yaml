chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Fireflies.ai sells into the AI meeting-assistant category, a young software layer that independent analysts size in
    the low-single-digit billions of dollars in 2025-2026 and project to grow at roughly 26% to 35% annually, nested
    inside far larger voice/speech-recognition and conversation-intelligence markets. Demand is driven by hybrid work,
    time-zone-spanning meetings, and generative-AI feature expansion, but the category faces two structural headwinds:
    open-source transcription (Whisper) has commoditized the core technical input, and native tools from Microsoft,
    Google, and Zoom bundle similar capabilities into platforms users already pay for. Sizing estimates vary widely and
    no retained source isolates a clean Fireflies-specific serviceable market, so the addressable opportunity should be
    read as a bounded range rather than a single TAM figure.
sections:
  - id: market-boundary-and-substitutes
    title: Market boundary, adjacencies, and substitutes
    body: >-
      Fireflies.ai competes in the AI meeting-assistant category, which industry trackers such as G2 define narrowly:
      software that uses AI and natural-language processing to transcribe meetings, track speakers and conversations,
      generate summaries, and extract action items, and that actively participates in the meeting rather than merely
      scheduling it. The included spend is recurring SaaS subscription revenue for automated recording, transcription,
      summarization, and post-meeting workflow across video platforms like Zoom, Google Meet, and Microsoft Teams.
      Excluded from this boundary are pure dictation tools, media-captioning services, and the very large medical and
      legal transcription markets, which serve different buyers and workflows; the medical transcription market alone is
      sized near $97 billion in 2026, an order of magnitude larger than the meeting-assistant niche and not a market
      Fireflies addresses. The category sits inside three overlapping adjacencies — voice and speech recognition, the
      speech-to-text (STT) API layer, and conversation-intelligence software — each of which can be read as a successive
      sizing lens. The most important competitive feature of the boundary is that the status quo is cheap and embedded:
      buyers can substitute with manual note-taking, an assigned human note-taker, the native recording and AI features
      already built into Zoom, Teams, and Google Meet, or open-source transcription. That makes the market real and
      growing but also crowded at its edges, because the same job-to-be-done is increasingly fulfilled by tools users
      already own.
    claimRefs:
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
      - CM021
    tableRefs:
      - TM001
    figureRefs: []
  - id: market-sizing-multiple-lenses
    title: Market sizing across multiple lenses
    body: >-
      No single credible TAM defines Fireflies' opportunity, so the market is best bounded with nested lenses. At the
      narrowest, the AI meeting-assistant market itself is small but fast-growing: Statifacts values it at about $3.50
      billion in 2025 and $4.41 billion in 2026, rising to roughly $35 billion by 2035 at a 25.9% CAGR, while Market.us
      values it at $3.67 billion in 2024 and projects $72.17 billion by 2034 at a much steeper 34.7% CAGR. One lens up,
      the AI-transcription and speech-to-text API segment is sized between roughly $4.5 billion and $5.4 billion in
      2026, with MarketsandMarkets putting the STT API market at $5.4 billion by 2026 at a 19.2% CAGR. Broader still, the
      voice and speech-recognition market that underpins all of these was about $20.25 billion in 2023 and is projected
      to reach $53.67 billion by 2030 at a 14.6% CAGR. The adjacent conversation-intelligence software market is larger
      again, growing from roughly $26.7 billion to $32.2 billion in 2025-2026 depending on the publisher. North America
      dominates every lens, holding 35.3% of the meeting-assistant market in 2024 and 30.8% of voice/speech recognition
      in 2023. The wide dispersion in these forecasts — CAGRs ranging from 7% to nearly 35% — is itself the headline
      finding: sizing this market precisely is not yet possible, and any valuation thesis must treat the TAM as a range
      rather than a point estimate.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
