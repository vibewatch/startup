        - Native platform recording, manual note-taking, dictation apps
        - Knowledge workers, teams, enterprise IT / RevOps
        - Core market Fireflies sells into directly.
      - - Speech-to-text / transcription API
        - Cloud and on-prem ASR API calls and automated transcription
        - Human transcription services, captioning agencies
        - Developers, ISVs, application builders
        - Upstream input layer; commoditized by open-source models.
      - - Voice and speech recognition (broad)
        - Voice interfaces, ASR, voice biometrics, assistants
        - Non-voice NLP, text analytics
        - Device makers, enterprises, consumers
        - Outermost TAM lens; bounds the technology market.
      - - Conversation intelligence
        - Sales/support call analytics, sentiment, coaching, talk-time
        - General BI, CRM seats without call analytics
        - Sales, customer-success, and support leaders
        - Adjacent up-market expansion path for Fireflies analytics.
      - - Medical / legal transcription
        - Regulated clinical and legal documentation
        - General business meetings
        - Hospitals, clinics, law firms
        - Excluded; different buyers, compliance, and workflow.
