      - FM001
      - FM002
  - id: buyers-drivers-constraints
    title: Buyers, demand drivers, and adoption constraints
    body: >-
      The market spans a wide buyer spectrum, from individual prosumers who self-serve onto free or roughly $10-per-month
      plans to enterprise IT and revenue-operations teams that buy Business and Enterprise tiers through procurement.
      Payer and budget owner therefore shift by segment: a single knowledge worker expensing a seat versus a CIO or VP of
      sales standardizing a deployment across thousands of users. Conversation-intelligence demand concentrates in
      enterprise sales analytics, which accounts for 54% of that adjacent market, signaling that the highest-value budget
      sits with revenue teams. Demand drivers are strong and durable: hybrid and remote work persist, with roughly one in
      five U.S. employees fully remote and over half with hybrid access, while Microsoft reports that 30% of meetings now
      span multiple time zones, up eight points since 2021. Generative-AI integration keeps expanding feature scope, and
      enterprise willingness to pay for AI assistants is visible in deals like ServiceNow's roughly $2.85 billion
      acquisition of Moveworks. Against these drivers sit serious constraints. Open-source speech recognition, led by
      OpenAI's Whisper with about five million monthly downloads and sub-2% word-error rates, has commoditized the core
      transcription input, so accuracy is no longer a differentiator. Native assistants from Microsoft, Google, and Zoom
      bundle overlapping capabilities into platforms buyers already pay for, switching costs for a horizontal note-taker
      are low and multi-homing is easy, and privacy and GDPR obligations push enterprises to scrutinize meeting-recording
      vendors. The market is expanding, but value is migrating up the stack toward analytics, workflow, and trust rather
      than transcription itself.
    claimRefs:
