  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: market sizing dispersion and serviceable market
      missingEvidence: >-
        A reconciled, methodology-transparent market size for the AI meeting-assistant category and a clean
        Fireflies-specific SAM/SOM are not available; published CAGRs range from 7% to 34.7%.
      whyItMatters: >-
        Any valuation anchored to a single TAM is fragile when independent estimates disagree by a factor of more than
        two on growth and no serviceable slice is isolable.
      diligencePath: >-
        Commission a bottom-up sizing from seat counts and ARPU by segment, and request Fireflies' internal TAM/SAM model
        and revenue-by-plan breakdown under NDA.
      relatedQuestionRefs:
        - QM024
        - QM009
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: commoditization and bundling impact on standalone demand
      missingEvidence: >-
        No retained source quantifies how much standalone meeting-assistant demand is displaced as Microsoft, Google, and
        Zoom bundle native AI and as open-source ASR commoditizes transcription.
      whyItMatters: >-
        The durability of Fireflies' growth depends on whether value defensibly sits in workflow and analytics rather than
        in transcription that incumbents now provide for free.
      diligencePath: >-
        Track net revenue retention and churn cohorts before and after native-tool launches, and benchmark feature parity
        against Teams Copilot, Meet Gemini, and Zoom AI Companion.
      relatedQuestionRefs:
        - QM026
      relatedTableRefs:
        - TM004
