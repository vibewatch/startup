  topStrengths:
    - Genuinely rare profitability since 2023 on only ~$19M total raised — exceptional AI capital efficiency.
    - Very broad bottom-up adoption with claimed 20M+ users and use by 75% of the Fortune 500.
    - Sticky product-led motion plus a growing meeting-history data asset that deepens with use.
    - >-
      Strong product breadth (transcription, summaries, action items, smart search, conversation intelligence, API,
      integrations).
    - High customer sentiment — about a 4.8/5 G2 rating across hundreds-to-thousands of reviews.
  topRisks:
    - >-
      Recording-consent and wiretap exposure (ECPA, CIPA, GDPR, HIPAA), with the Otter.ai class action a direct
      read-across precedent.
    - >-
      Incumbent bundling of free meeting AI by Microsoft Teams Copilot, Google Meet Gemini, and Zoom AI Companion
      compressing pricing power.
    - Commoditization of core transcription by open-source Whisper, lowering the technical moat.
    - >-
      Unaudited, conflicting self-reported metrics (revenue estimates span $3.3M–$10.9M; profitability and user counts
      unverified).
    - >-
      A $1B valuation set by a secondary trade, not a primary round, implying a ~90x multiple far above comparables like
      Gong (~18x).
  unresolvedGaps:
    - Audited ARR and growth with revenue-recognition definitions to resolve the $3.3M–$10.9M revenue spread.
    - Verified profitability, gross margin, and unit economics behind the capital-efficiency claim.
    - Cohort retention, net revenue retention, and churn by tier.
    - June 2025 secondary transaction terms — price per share, sellers, liquidity discount, and preference stack.
    - Audited usage and paid-versus-free split behind the 20M-user and 75%-of-Fortune-500 claims.
