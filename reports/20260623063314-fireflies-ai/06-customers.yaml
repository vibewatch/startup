  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: user and organization counts
      missingEvidence: >-
        Public user counts range from ~10 million to 20 million-plus and organization counts from 500,000 to 1 million-plus,
        with no audited figure to reconcile them.
      whyItMatters: >-
        Adoption magnitude underpins the traction and valuation narrative; an unreconciled 2x spread undermines confidence
        in the headline numbers.
      diligencePath: >-
        Request company-confirmed active-user and paying-customer counts with definitions, plus a third-party usage audit.
      relatedQuestionRefs:
        - QU004
        - QU005
      relatedTableRefs:
        - TU002
    - type: private-evidence-only
      severity: blocking
      topic: retention metrics
      missingEvidence: >-
        No NRR, GRR, churn, renewal, or cohort retention data is disclosed; retention is inferred only from integration
        depth.
      whyItMatters: >-
        Retention is the single most important determinant of SaaS value; without it, durability and the valuation cannot
        be underwritten.
      diligencePath: >-
        Obtain cohort retention, logo and dollar churn, and renewal rates by tier directly from management.
      relatedQuestionRefs:
        - QU015
        - QU025
      relatedTableRefs:
        - TU004
    - type: missing-source
      severity: material
      topic: enterprise case studies
      missingEvidence: >-
        Public enterprise proof is testimonial and logo-based; there are no structured, ROI-quantified case studies for
        named production deployments.
      whyItMatters: >-
        The 75%-of-Fortune-500 claim cannot be assessed without named accounts, deployment scope, and outcomes.
      diligencePath: >-
        Request three to five enterprise reference customers with deployment size, use cases, and measured outcomes.
      relatedQuestionRefs:
        - QU013
        - QU026
      relatedTableRefs:
        - TU003
