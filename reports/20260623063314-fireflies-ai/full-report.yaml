      - number: '1.2'
        title: Funding, valuation, and governance
        blocks:
          - type: paragraph
            body: >-
              Fireflies.ai's capital history is the central feature of its investment story. The company raised a small
              pre-seed around 2018, a seed round of roughly $5 million led by Canaan Partners in 2019, and a $14 million
              Series A led by Khosla Ventures in 2021, for an estimated lifetime total of approximately $19 million
              across three rounds. Khosla partner Sandhya Venkatachalam and Canaan partner Rayfe Gaspar-Asaoka joined
              the board after the Series A, and early angels reportedly included senior figures from Salesforce, Slack,
              and Dropbox. The defining event came on June 12, 2025, when Fireflies announced a valuation of over $1
              billion following its first tender offer — a secondary transaction that provided liquidity to long-tenured
              early employees rather than raising primary capital or diluting the cap table. The company says it has
              been profitable since 2023, has not raised primary capital since 2021, and sustains triple-digit
              year-over-year growth. Crunchbase corroborated the milestone, describing a "secondary financing for its
              early team members" that valued the 9-year-old San Francisco company at $1 billion. Governance remains
              opaque in the way typical of venture-backed private companies: preferred-stock liquidation preferences,
              board-control rights, and the precise cap table are undisclosed, and Fireflies has no obligation to file
              financial statements with the SEC. Employee shares trade on the Nasdaq Private Market, and management has
              signaled it intends to run regular tender offers going forward. The valuation is therefore real as a
              secondary-market clearing price but is not anchored to audited financials, so later chapters should treat
              the $1 billion mark as evidence of investor demand rather than as an underwriting-grade figure.
