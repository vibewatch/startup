companyProfile:
  summary: >-
    Fireflies.ai is a profitable, capital-efficient AI meeting assistant that joins virtual meetings as a bot to record,
    transcribe, summarize, and analyze conversations, syncing notes and action items into CRMs and collaboration tools.
    It reached a $1 billion valuation via a June 2025 secondary transaction rather than a primary round, having raised
    only about $19 million in total. Its adoption is broad and bottom-up — the company claims more than 20 million users
    and use by 75% of the Fortune 500 — but every headline metric is self-reported or third-party-estimated and never
    audited, leaving revenue magnitude, retention, and the valuation difficult to verify from public evidence.
