  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and monetization quality
        blocks:
          - type: paragraph
            body: >-
              Fireflies runs a product-led freemium SaaS model with four published tiers. The Free plan offers unlimited
              transcription and AI summaries with limited storage; the Pro plan lists at $18 per seat monthly or $10
              billed annually and adds video recording, integrations, and AI credits; the Business plan lists at $29
              monthly or $19 annually and unlocks conversation intelligence, team analytics, and unlimited storage; and
              the Enterprise plan is annual-only at $39 per seat and adds SSO/SCIM, HIPAA compliance, audit logs, and
              custom retention. Monetization therefore depends on converting free notetaker users into paid seats and
              then expanding into analytics-heavy Business and Enterprise tiers, supplemented by an API that lets
              developers pipe third-party calling and conferencing audio into Fireflies for transcription. Revenue is
              recurring subscription revenue, and management says margins are comparable to traditional SaaS — a notable
              claim in voice AI, one of the most compute-intensive verticals. The quality of that revenue cannot be
              independently verified: there are no audited statements, no filings, and the public revenue figure is a
              third-party estimate. GetLatka estimates 2024 revenue at about $10.9 million, up from $5.8 million in 2023
              and $4.2 million in 2021, implying sustained roughly 100% year-over-year growth, while a second tracker,
              Growjo, estimates annual revenue closer to $3.3 million — a wide spread that is itself a diligence flag.
