      - number: '7.2'
        title: Operational, security, technical, and competitive risk
        blocks:
          - type: paragraph
            body: >-
              The largest going-concern risk is competitive commoditization from the platforms Fireflies depends on.
              Microsoft 365 Copilot now generates meeting notes and recaps natively inside Teams, Google has embedded
              Gemini "take notes for me" into Meet, and Zoom AI Companion ships meeting summaries to paid Zoom accounts
              — in each case bundling meeting AI for free or near-free into a subscription the customer already holds,
              which structurally compresses a standalone notetaker's pricing power and reason to exist. Beneath the
              application layer, OpenAI's open-sourcing of Whisper commoditized high-quality speech-to-text, lowering
              the technical moat around transcription itself and letting rivals and incumbents reach parity cheaply.
              Product-quality risks compound the threat: independent reviews flag an English-only interface, mediocre
              handling of crosstalk when speakers overlap, summaries that capture facts but miss nuance, and
              conversation intelligence that is shallower than purpose-built coaching tools — limitations that cap
              enterprise and international fit. On the operational and security side, Fireflies concentrates highly
              sensitive content — full recordings and transcripts of internal and customer meetings — in one cloud
              store, making it a high-value breach target; a single material security incident or outage would damage
              trust disproportionately because the data is so sensitive. Fireflies publishes a security page citing SOC
              2, GDPR, and HIPAA and encryption practices, but it does not publicly disclose a status/incident page,
              penetration-test cadence, or breach history, so reliability and incident posture cannot be independently
              confirmed and must be verified in diligence.
            claimRefs:
