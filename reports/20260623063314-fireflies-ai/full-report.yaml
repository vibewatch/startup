  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              The defining legal risk for Fireflies is recording consent. The product's core mechanism — an autonomous
              bot that joins a meeting as a participant, captures audio, and streams it to Fireflies' cloud for
              transcription — sits directly against all-party (two-party) consent wiretap law. Under the federal
              Electronic Communications Privacy Act, the Wiretap Act prohibits intentional interception of electronic
              communications, and roughly a dozen states, most prominently California under the California Invasion of
              Privacy Act, require the consent of every party to record a confidential conversation. A notetaker that
              obtains permission only from the meeting host (and shifts the burden of collecting everyone else's consent
              onto its own customer) creates exposure for both vendor and customer. That theory is not hypothetical: the
              consolidated Otter.ai class action (In re Otter.AI Privacy Litigation, No. 5:25-cv-06911, N.D. Cal.),
              bundling complaints filed in August–September 2025 and at the motion-to-dismiss stage in mid-2026, alleges
              exactly this fact pattern — OtterPilot joining calls, recording non-users, and using recordings to train
              models without all-party consent — under ECPA, CIPA, CFAA, intrusion upon seclusion, and unfair
              competition theories. Because Fireflies uses the same join-and-record architecture, the case is a direct
              read-across to its own residual exposure. Layered on top are data-protection regimes: GDPR requires a
              lawful basis (consent or legitimate interest) for processing personal data and imposes stricter conditions
              on special-category data, and HIPAA governs any meeting that surfaces protected health information.
              Fireflies markets SOC 2, GDPR, and HIPAA support and publishes a privacy policy and security page, which
              are genuine mitigations, but it does not publicly disclose litigation history, audited DPAs, sub-processor
              lists with data-residency guarantees, or how meeting content is used for model training — the precise gaps
              a diligence buyer must close.
            claimRefs:
