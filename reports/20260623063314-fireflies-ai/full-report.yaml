      - number: '6.3'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              On durability, Fireflies discloses no retention metrics — no net revenue retention, gross retention,
              churn, renewal, or contract-length data is public — so stickiness must be inferred. The structural case
              for retention is reasonable: once meetings flow automatically into Fireflies and notes sync into
              Salesforce, HubSpot, and Slack, the accumulated searchable meeting history becomes a system of record that
              is costly to abandon, and seat expansion follows bottom-up adoption inside accounts. Against that,
              switching costs are genuinely low for the core capture use case, multi-homing is easy, and the free tiers
              of rivals plus bundled platform AI give users cheap alternatives, so retention is not guaranteed.
              Expansion economics run through land-and-expand: a single user's bot spreads to a team, then a department,
              then triggers an enterprise security review and an annual contract. Concentration risk on the customer
              side appears low given a highly fragmented, millions-strong base with no disclosed large-customer revenue
              concentration; the more material dependencies are channel and platform — reliance on Zoom, Google Meet,
              and Teams meeting APIs and on CRM partners — plus procurement friction at the enterprise tier, where
              buyers demand the audited compliance artifacts and SLAs Fireflies does not publish. The net customer
              verdict is a product with exceptional reach and strong satisfaction, but with retention, paid-base size,
              and enterprise depth that remain unproven from public evidence and that competition from free bundled
              alternatives could erode.
