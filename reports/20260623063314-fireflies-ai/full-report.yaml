  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              Fireflies' customer base segments along a freemium ladder. Individual professionals and very small teams
              enter on the free tier; professionals and small teams convert to Pro; fast-growing businesses and revenue
              teams buy Business for conversation intelligence and analytics; and large enterprises take annual
              Enterprise contracts for security, compliance, and admin controls. By function, adoption concentrates in
              sales and revenue operations, recruiting, and customer success — the teams whose work is calls — with
              broad secondary use for general internal meetings. By vertical, usage skews toward services-heavy sectors
              such as professional services, IT and consulting, marketing, and finance, and by geography toward
              English-speaking markets, reinforced by an English-only product interface. The dominant channel is
              product-led, bottom-up self-serve, with the bot's in-meeting presence driving viral spread across an
              organization before any top-down sale. On trajectory, the company reports rapid growth — more than 20
              million users across 500,000 organizations and over 2 billion meeting minutes processed — and earlier
              public data cited roughly 10 million users in 2024 with triple-digit annual user growth, a discrepancy
              that signals how loosely these self-reported counts are defined. The pricing page's claim of 1
              million-plus companies sits above the 500,000 organizations cited elsewhere, another sign that headline
              adoption figures are directional rather than audited.
