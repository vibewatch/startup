  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Fireflies.ai competes in the AI meeting-assistant category, which industry trackers such as G2 define
              narrowly: software that uses AI and natural-language processing to transcribe meetings, track speakers and
              conversations, generate summaries, and extract action items, and that actively participates in the meeting
              rather than merely scheduling it. The included spend is recurring SaaS subscription revenue for automated
              recording, transcription, summarization, and post-meeting workflow across video platforms like Zoom,
              Google Meet, and Microsoft Teams. Excluded from this boundary are pure dictation tools, media-captioning
              services, and the very large medical and legal transcription markets, which serve different buyers and
              workflows; the medical transcription market alone is sized near $97 billion in 2026, an order of magnitude
              larger than the meeting-assistant niche and not a market Fireflies addresses. The category sits inside
              three overlapping adjacencies — voice and speech recognition, the speech-to-text (STT) API layer, and
              conversation-intelligence software — each of which can be read as a successive sizing lens. The most
              important competitive feature of the boundary is that the status quo is cheap and embedded: buyers can
              substitute with manual note-taking, an assigned human note-taker, the native recording and AI features
              already built into Zoom, Teams, and Google Meet, or open-source transcription. That makes the market real
              and growing but also crowded at its edges, because the same job-to-be-done is increasingly fulfilled by
              tools users already own.
            claimRefs:
              - CM016
              - CM017
              - CM018
              - CM019
              - CM020
              - CM021
          - type: table
            tableRef: TM001
