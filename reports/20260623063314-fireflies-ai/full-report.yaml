  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape across direct, incumbent, and bundled rivals
        blocks:
          - type: paragraph
            body: >-
              The competitive set spans three tiers. Direct AI meeting-assistant peers are the closest rivals: Otter.ai
              is the scale leader, with Sacra estimating roughly $100 million of ARR in March 2025 (up from $81 million
              at the end of 2024) and more than 25 million users, having raised about $70 million and last valued near
              $250 million in 2021. Fathom competes on simplicity and an unusually generous free-forever tier, Avoma
              positions as an end-to-end meeting lifecycle and conversation-intelligence platform, and tl;dv claims more
              than two million users on a no-time-limit free notetaker, with MeetGeek and Read.ai rounding out the
              free-tier field. One tier up sit conversation-intelligence incumbents aimed at enterprise revenue teams:
              Gong is the standalone leader at roughly $317.7 million in revenue, a ~$7.3 billion valuation, and $583
              million raised across 1,500-plus employees and 5,000-plus revenue teams, while Chorus.ai was absorbed by
              ZoomInfo and now ships as ZoomInfo Chorus inside a public company that booked $1.21 billion of revenue in
              2024. The most strategically important rivals, however, are the platform owners themselves: Microsoft
              bundles meeting AI into Teams through Microsoft 365 Copilot, Google embeds Gemini across Workspace and
              Meet, and Zoom gives away AI Companion summaries and notes with paid Zoom plans. Likely future entrants
              include every CRM and LLM platform — Salesforce, HubSpot, and others — that can add native meeting
              capture, which keeps the landscape porous.
