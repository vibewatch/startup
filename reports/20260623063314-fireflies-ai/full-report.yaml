      - number: '3.2'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On core capability the field has converged: transcription, AI summaries, and action items are table stakes
              across Fireflies, Otter, Fathom, Avoma, and the bundled platform tools, so the technical core is largely
              commoditized. Differentiation now lives at the edges — Fireflies leans on 100-plus integrations with CRMs,
              Slack, and project tools plus workflow automation, Otter emphasizes real-time collaborative notes, Avoma
              and Gong add coaching, forecasting, and deeper revenue analytics, and the platform incumbents win on being
              pre-installed where meetings occur. Pricing clusters tightly for direct peers: Fireflies Pro is about $10
              per month, Otter Pro runs roughly $8 to $17 and Business about $30 per user, Avoma is about $19 per
              recorder seat rising to roughly $49 for business, and Fathom anchors the low end with a free-forever plan
              and a $19 upgrade. Free tiers are an active battleground — Fireflies grants 800 monthly minutes versus
              Otter's 300, while Fathom and tl;dv push unlimited or no-time-limit free use. Enterprise conversation
              intelligence is priced very differently: Gong is custom and premium, reflecting its revenue-team value
              capture. Go-to-market also diverges sharply: Fireflies and Otter rely on product-led growth and a viral
              in-meeting bot, whereas Gong and the platform incumbents use enterprise sales motions and bundling. On
              trust and compliance, Fireflies advertises SOC 2, GDPR, and HIPAA posture and says it does not train on
              customer data, while Otter has drawn scrutiny for training practices — a reminder that trust is a live
              competitive axis.
