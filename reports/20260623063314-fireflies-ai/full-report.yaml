          - type: callout
            title: No clean serviceable market and wide estimate dispersion
            body: >-
              Published CAGRs range from 7% to nearly 35% and no retained source isolates a Fireflies-specific SAM/SOM,
              so any valuation anchored to a single TAM is fragile. Fireflies' estimated ~$11M ARR is a tiny slice of
              even the current meeting-assistant market.
