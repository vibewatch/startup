      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real and growing, but value is migrating off transcription
            body: >-
              Every sizing lens shows double-digit growth, yet open-source ASR and bundled native tools are
              commoditizing the transcription input. The defensible value is moving up-stack to analytics, workflow
              integration, and trust, which is where Fireflies must out-execute incumbents.
            calloutType: insight
            claimRefs:
