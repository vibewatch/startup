      - number: '7.3'
        title: Financial, dependency, people, and governance risk
        blocks:
          - type: paragraph
            body: >-
              Fireflies' financial and governance risks center on unverifiable self-reported metrics and the unusual
              path to its billion-dollar mark. Headline figures — more than 20 million users, use by 75% of the Fortune
              500, and a claim of profitability — are company-sourced and unaudited, and public third-party estimates of
              revenue and user counts diverge widely, so the underlying economics cannot be confirmed from outside. The
              $1B valuation came from a June 2025 secondary transaction that provided liquidity to early team members
              rather than a primary round with a new lead investor's diligence and a fresh balance sheet, which weakens
              the signal that the number represents an arm's-length, capital-raising valuation. Credibility risk is
              sharpened by adverse coverage: a founder publicly recounted that the company's earliest "AI transcription"
              was in fact him joining meetings and taking notes by hand, a viral story that several outlets framed as a
              fake-it-till-you-make-it cautionary tale — reputationally manageable but a governance and disclosure flag
              for a diligence process. Dependency and concentration risks are structural: Fireflies relies on Zoom,
              Google Meet, and Teams meeting access and on CRM partners (Salesforce, HubSpot) for its workflow value,
              any of which could restrict bot access or bundle a competing feature; switching costs for the core capture
              use case are low and multi-homing is easy; and execution depends heavily on two founders (Krish Ramineni
              and Sam Udotong), a key-person concentration with no disclosed succession or deep public bench. Burn,
              runway, and cap-table details are undisclosed. Each of these is paired below with a monitorable trigger
