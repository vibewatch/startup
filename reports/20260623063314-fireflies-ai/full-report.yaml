      - number: '5.2'
        title: Architecture, developer platform, integrations, and deployment
        blocks:
          - type: paragraph
            body: >-
              The operating architecture is a layered software stack. At the bottom is the capture and ingestion layer —
              the meeting bot and audio/video upload — feeding a speech-to-text transcription engine that supports
              100-plus languages. Above transcription sit AI processing services that generate summaries, action items,
              and analytics using large language models, and a search/index layer that makes transcripts and their
              metadata queryable. The application layer exposes these through the web app, desktop and mobile clients,
              the Chrome extension, and AskFred. Crucially for extensibility, Fireflies ships a developer platform: a
              GraphQL API hosted at api.fireflies.ai that requires an API key for all requests, with queries and
              mutations to pull transcripts, summaries, sentences, and speaker data and to upload audio, plus Webhooks
              V2 that push real-time meeting.transcribed and meeting.summarized events with HMAC signature verification.
              This API underpins integrations: Fireflies connects to 100-plus tools — Salesforce, HubSpot, Pipedrive,
              Zoho, Slack, Notion, Zapier, and ATS systems like Greenhouse and Lever — pushing notes and action items
              into the systems of record where revenue and recruiting teams already work. Deployment is pure cloud SaaS,
              with reliability and support tiered by plan and dedicated account management at Enterprise. The
              architectural reality is that the transcription and summarization primitives lean on commoditized and
              third-party models — the same Whisper- class ASR and general LLM capabilities available to rivals — so the
              defensible engineering is in orchestration, integration plumbing, search over meeting data, and the
              reliability of the always-on bot rather than in the core models themselves.
