      - number: '4.3'
        title: Capital adequacy, public traction versus private gaps, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Fireflies is capital-light by design. Across its life it has raised only about $19 million — a roughly
              $4.5 million seed led by Canaan Partners with angels including the Salesforce CMO, a former Slack chief
              product officer, and an early Dropbox engineer, followed by a $14 million Series A led by Khosla Ventures
              — and the founders publicly framed the Series A as the last round they intended to raise. The $1 billion
              valuation crystallized in June 2025 came from the company's first tender offer, which provided partial
              liquidity for roughly 10-15% of holdings by early team members rather than injecting primary capital onto
              the balance sheet. Because the company is profitable and not burning venture cash, financing dependency is
              low and there is no obvious next-round trigger or runway cliff; the headline risk is valuation support,
              not solvency. Public traction is large but entirely self-reported or third-party-estimated: more than 20
              million users across 500,000 organizations (the pricing page cites 1 million+ companies), over 2 billion
              meeting minutes processed, and use by 75% of the Fortune 500. None of these are audited, and adverse
              commentary has questioned how much weight to put on founder-supplied metrics in a frothy AI market. The
              financial verdict: revenue quality looks genuinely SaaS-like and the capital efficiency is real and rare,
              but the complete absence of audited financials, unit-economics disclosure, and churn data makes the
              revenue magnitude, margin path, and the $1 billion valuation impossible to underwrite from public evidence
              — the core diligence blocker.
