      - number: '1.3'
        title: Scale, milestones, and adverse markers
        blocks:
          - type: paragraph
            body: >-
              Fireflies reports large operating scale: more than 20 million users across over 500,000 organizations,
              more than 2 billion meeting minutes processed, usage at 75% of Fortune 500 companies, and 8x user growth
              over the 18 months preceding the June 2025 milestone. Third-party revenue estimates from GetLatka put
              revenue near $10.9 million in 2024, up from $5.8 million in 2023, though these are estimates rather than
              audited figures. The product's growth was almost entirely organic: the company says it spent essentially
              zero on marketing until 2025, relying on the viral loop created when the meeting bot visibly joins calls.
              A pivotal technology relationship formed when investor Vinod Khosla introduced Ramineni to OpenAI's Sam
              Altman, giving Fireflies early access to GPT-3.5 and making it one of OpenAI's larger token consumers. The
              most important adverse marker is reputational. In November 2025 CTO Sam Udotong publicly described how, in
              2016 and 2017, he and Ramineni personally dialed into customer meetings as a silent human note-taker named
              "Fred" while charging roughly $100 per month and telling customers an AI was joining — a "Wizard of Oz"
              validation tactic that outlets including Futurism, Business Insider, and Forbes characterized as a "fake
              it till you make it" deception. The episode is historical and the product is now genuinely automated, but
              it is relevant to diligence because it bears on management's disclosure norms around a product that
              records sensitive conversations. The company was also rejected by Y Combinator three times. The
              publishable conclusion from public evidence is that Fireflies is a genuinely profitable, capital-efficient
              category leader whose self-reported scale is large and broadly corroborated, but whose headline financial
              and valuation figures rest substantially on company statements and private-market pricing rather than
              independent audit.
