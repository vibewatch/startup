    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: Capability maturity and differentiation strength across Fireflies' main product areas.
    data:
      columns:
        - Capability area
        - Maturity
        - Differentiation strength
      rows:
        - label: Capture & transcription
          values:
            - Core
            - Mature
            - Low (commoditized)
        - label: Summaries & action items
          values:
            - Core
            - Mature
            - Medium
        - label: Integrations & API
          values:
            - Platform
            - Mature
            - High
        - label: Conversation intelligence
          values:
            - Analytics
            - Established
            - Medium
        - label: Voice agent / multilingual
          values:
            - Roadmap
            - Early
            - Unproven
    approximationNotes: Maturity and differentiation are ordinal judgments from product pages, reviews, and roadmap signals.
    claimRefs:
      - CE021
      - CE026
      - CE027
      - CE030
      - CE037
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: The typical Fireflies adoption path from individual discovery through team spread to an enterprise contract.
    data:
      nodes:
        - id: discover
          label: Discover
          detail: An individual adds the Fireflies bot to a call after seeing it in someone else's meeting.
          tone: positive
        - id: land
          label: Land (free/Pro)
          detail: The user adopts the free or Pro tier for personal notetaking across daily calls.
          tone: neutral
        - id: spread
          label: Team spread
          detail: The bot's in-meeting presence drives viral adoption across a team and department.
          tone: positive
        - id: embed
          label: Workflow embed
          detail: Notes and action items sync into CRM and Slack, making Fireflies a system of record.
          tone: positive
        - id: enterprise
          label: Enterprise contract
          detail: IT and security review triggers an annual Business/Enterprise deal with SSO and compliance.
          tone: warning
    approximationNotes: The journey is the marketed bottom-up motion; conversion rates between stages are not disclosed.
    claimRefs:
      - CU005
      - CU020
      - CU023
      - CU024
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: The freemium funnel from free users down to paid seats and enterprise contracts (proportions illustrative).
    data:
      items:
        - label: Free / trial users
          value: 100
          detail: Large top-of-funnel from viral bot adoption.
        - label: Active repeat users
          value: 60
          detail: Users who keep the bot on across meetings.
        - label: Paid seats (Pro/Business)
          value: 20
          detail: Converted self-serve subscriptions; true rate undisclosed.
        - label: Enterprise contracts
          value: 5
          detail: Governed annual deals after security review.
    approximationNotes: Values are illustrative proportions, not disclosed figures; Fireflies does not publish free-to-paid conversion.
    claimRefs:
      - CU006
      - CU019
      - CU025
      - CU035
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Strength of customer proof by segment across reference type and evidence quality.
    data:
      columns:
        - Segment
        - Proof type
        - Evidence quality
      rows:
        - label: Prosumer / individual
          values:
            - Reviews + ratings
            - High volume
            - Strong sentiment
        - label: SMB
          values:
            - Testimonials + reviews
            - Named CEOs
            - Good but not quantified
        - label: Mid-market revenue teams
          values:
            - Testimonials
            - Some named leaders
            - Moderate; outcomes vague
        - label: Enterprise
          values:
            - Logos / claims
            - 75% Fortune 500 (claimed)
            - Weak; no case studies
    approximationNotes: Evidence-quality judgments are ordinal reads from public testimonials and reviews.
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU034
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: >-
      Illustrative retention cohort for Fireflies users based on integration-lock-in dynamics; Fireflies discloses no
      retention data, so all values are estimates, not reported figures.
    data:
      columns:
        - month-1
        - month-3
        - month-6
        - month-12
      rows:
        - label: Self-serve cohort (estimated)
          values:
            - 100
            - 60
            - 45
            - 35
        - label: CRM-integrated cohort (estimated)
          values:
            - 100
            - 80
            - 70
            - 62
        - label: Enterprise cohort (estimated)
          values:
            - 100
            - 90
            - 85
            - 80
    approximationNotes: >-
      All values are analyst estimates illustrating how integration depth should raise retention; Fireflies has not
      disclosed any cohort or churn metrics.
    claimRefs:
      - CU019
      - CU020
      - CU021
      - CU035
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: Top Fireflies risks scored on likelihood, impact, and residual severity after known mitigations.
    data:
      columns:
        - Likelihood
        - Impact
        - Residual severity
      rows:
        - label: Recording-consent / wiretap litigation
          values:
            - Medium
            - High
            - High
        - label: Incumbent bundling / commoditization
          values:
            - High
            - High
            - High
        - label: Transcription commoditization (Whisper)
          values:
            - High
            - Medium
            - Medium
        - label: Security breach of meeting data
          values:
            - Low-Medium
            - Critical
            - High
        - label: Metric / valuation credibility
          values:
            - High
            - Medium
            - Medium
        - label: Key-person concentration
          values:
            - Medium
            - High
            - Medium
    approximationNotes: >-
      Scores are ordinal analyst judgments synthesizing primary law, peer litigation, competitor bundling moves, and
      independent reviews; they are not probabilistic estimates.
    claimRefs:
      - CR001
      - CR013
      - CR017
      - CR021
      - CR033
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How Fireflies' top risks transmit into customers, revenue, margin, financing, and valuation.
    data:
      nodes:
        - id: consent
          label: Consent / wiretap exposure
          detail: All-party consent law plus the Otter read-across precedent.
          tone: warning
        - id: bundling
          label: Incumbent bundling
          detail: Free meeting AI in Teams, Meet, and Zoom.
          tone: warning
        - id: commodity
          label: Transcription commoditization
          detail: Open-source Whisper erodes the ASR moat.
          tone: warning
        - id: churn
          label: Retention / churn pressure
          detail: Low switching costs and free substitutes.
          tone: warning
        - id: pricing
          label: Pricing power compression
          detail: Harder to charge for standalone notetaking.
          tone: warning
        - id: revenue
          label: Revenue growth at risk
          detail: Slower net new and expansion revenue.
          tone: negative
        - id: valuation
          label: Valuation support
          detail: Secondary-set $1B mark harder to underwrite.
          tone: negative
      edges:
        - from: consent
          to: churn
        - from: bundling
          to: churn
        - from: bundling
          to: pricing
        - from: commodity
          to: pricing
        - from: churn
          to: revenue
        - from: pricing
          to: revenue
        - from: revenue
          to: valuation
    approximationNotes: >-
      The map shows transmission direction, not magnitude; Fireflies does not disclose the retention or pricing data
      needed to quantify each edge.
    claimRefs:
      - CR014
      - CR018
      - CR031
      - CR038
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: Critical external dependencies that Fireflies relies on for capture, workflow value, and compliance.
    data:
      nodes:
        - id: fireflies
          label: Fireflies.ai
          detail: AI meeting assistant; central node.
          tone: neutral
        - id: platforms
          label: Meeting platforms
          detail: Zoom, Google Meet, Microsoft Teams bot access.
          tone: warning
        - id: crm
          label: CRM partners
          detail: Salesforce and HubSpot for workflow value.
          tone: neutral
        - id: models
          label: AI model / cloud providers
          detail: ASR and LLM processing plus hosting.
          tone: neutral
        - id: regulators
          label: Regulators / law
          detail: ECPA, CIPA, GDPR, HIPAA compliance regimes.
          tone: warning
        - id: customers
          label: Customers
          detail: Bottom-up users and enterprise buyers.
          tone: positive
      edges:
        - from: platforms
          to: fireflies
        - from: models
          to: fireflies
        - from: crm
          to: fireflies
        - from: regulators
          to: fireflies
        - from: fireflies
          to: customers
    approximationNotes: >-
      Edges denote reliance direction; the same meeting platforms are simultaneously a dependency and a competitor, the
      dual role highlighted in the partner-risk register.
    claimRefs:
      - CR024
      - CR036
      - CR037
      - CR043
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The call hinges on whether Fireflies' genuine quality is sufficient to justify a ~90x public-revenue mark.
    data:
      nodes:
        - id: n1
          label: Profitable, capital-efficient, broad adoption
        - id: n2
          label: Supports high company-quality score
        - id: n3
          label: $1B secondary mark = ~90x public revenue
        - id: n4
          label: Metrics unaudited; secondary not primary signal
        - id: n5
          label: Price not underwritable on public evidence
        - id: n6
          label: Recommendation = research-more / track
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 'The logic chain shows why high company quality still yields a track call: the price depends on unverified revenue.'
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV013
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Implied valuation is highly sensitive to true ARR; small changes in the revenue assumption swing the mark widely.
    data:
      items:
        - label: $11M ARR at 20x
          value: 220
          detail: USD M — public estimate at a generous multiple
          tone: negative
        - label: $30M ARR at 18x
          value: 540
          detail: USD M — base-case lower bound
          tone: warning
        - label: $50M ARR at 20x
          value: 1000
          detail: USD M — base/bull crossover near secondary mark
          tone: warning
        - label: $1B secondary mark
          value: 1000
          detail: USD M — June 2025 reference
          tone: neutral
        - label: $80M ARR at 20x
          value: 1600
          detail: USD M — bull case
          tone: positive
    approximationNotes: >-
      Bars are illustrative ARR×multiple combinations for IC discussion, not DCF outputs; they show how the $1B mark
      requires roughly $50M+ ARR to be defensible at SaaS-like multiples.
    claimRefs:
      - CV014
      - CV018
      - CV022
      - CV024
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: A wide but bounded valuation envelope around the $1B secondary mark, driven by unresolved ARR.
    data:
      items:
        - label: Bear case
          low: 200
          mid: 300
          high: 400
          displayValue: $200M-$400M
          detail: Audited ARR near ~$11M; bundling compresses growth.
        - label: Base case
          low: 500
          mid: 750
          high: 1000
          displayValue: $500M-$1B
          detail: True ARR ~$30-60M with durable profitability.
        - label: Bull case
          low: 1000
          mid: 1500
          high: 2000
          displayValue: $1B-$2B+
          detail: ARR toward nine figures; strong retention and data moat.
        - label: Secondary mark
          low: 1000
          mid: 1000
          high: 1000
          displayValue: $1B
          detail: June 2025 employee-liquidity transaction.
    approximationNotes: >-
      Ranges are valuation envelopes for committee discussion, not DCF outputs; the secondary mark sits at the high end
      of base and the low end of bull.
    claimRefs:
      - CV019
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: The recommendation would move to buy or pass if a handful of high-leverage metrics were confirmed.
    data:
      items:
        - label: Audited ARR and growth
          value: Undisclosed
          note: Master switch for the valuation multiple
        - label: Verified profitability / margin
          value: Undisclosed
          note: Confirms the capital-efficiency premium
        - label: Net revenue retention
          value: Undisclosed
          note: Determines durability and the multiple
        - label: Secondary transaction terms
          value: Undisclosed
          note: Defines what the $1B mark represents
        - label: Paid vs free base
          value: Undisclosed
          note: Sizes the revenue base behind the multiple
    approximationNotes: >-
      Every high-leverage KPI is currently undisclosed; the recommendation is therefore evidence-gated rather than a
      view that quality is lacking.
    claimRefs:
      - CV029
      - CV031
      - CV034
      - CV041
