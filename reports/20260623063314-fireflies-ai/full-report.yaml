  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface, modules, and customer workflow
        blocks:
          - type: paragraph
            body: >-
              In customer-workflow terms, Fireflies removes the manual work around meetings: a user connects their
              calendar, and the Fireflies bot automatically joins scheduled Zoom, Google Meet, or Teams calls, records
              audio and video, transcribes the conversation in more than 100 languages, and within minutes delivers a
              structured summary, a list of action items, and a fully searchable transcript. The product surface spans
              several modules. Capture is the base layer — the meeting bot plus audio/video upload via the app or API.
              On top sit AI notes and summaries, an action-item and task manager, and smart search across the entire
              meeting archive. AskFred (also surfaced as the Personal Assistant) is a conversational layer that lets
              users ask questions about a meeting, extract details, and generate follow-ups, emails, or social posts.
              Conversation intelligence adds speaker talk-time, sentiment, and team analytics aimed at revenue and
              customer-success teams. The newest module, Talk to Fireflies, is a voice agent that performs real-time,
              Perplexity-powered web search during a live meeting. These modules are delivered across web, desktop,
              mobile (iOS and Android), and a Chrome extension, so the same capture-to-insight workflow follows the user
              across surfaces. The dominant use cases are sales call capture and CRM sync, recruiting interviews,
              customer-success calls, and internal team meetings, with the free tier serving individuals and paid tiers
              unlocking analytics and storage.
