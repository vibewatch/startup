      - number: '3.3'
        title: Moat durability, switching cost, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Fireflies' defensibility is the crux of the competitive analysis. Switching costs for a horizontal
              note-taker are low and multi-homing is common, so users can run several free tools side by side, which
              weakens lock-in for every standalone vendor. The transcription moat is eroding industry-wide as
              open-source and commodity ASR push accuracy toward parity, meaning durable advantage must come from
              integrations, workflow depth, accumulated meeting data, and price rather than raw transcription. The
              gravest structural threat is distribution power: Microsoft, Google, and Zoom can bundle good-enough
              meeting AI into suites that hundreds of millions already pay for, compressing standalone willingness to
              pay. Scale comparisons sharpen the risk — Otter already out-earns Fireflies by roughly ten times on
              revenue, and Gong's ~$7 billion valuation shows that the richest value capture in this space sits
              up-market in revenue intelligence, not in horizontal note-taking. Fireflies' counter is a generous free
              tier, aggressive pricing, breadth of integrations, a large self-reported user and data footprint, and
              capital-efficient profitability that lets it compete without burning venture money. Whether that bundle
              constitutes a durable moat or merely a temporary lead against incumbents with superior distribution and
              capital is the central unresolved question for diligence, and it is the lens through which the valuation
              chapter should be read.
