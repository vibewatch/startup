      - number: '4.2'
        title: Unit economics, go-to-market efficiency, and cost structure
        blocks:
          - type: paragraph
            body: >-
              Fireflies' go-to-market motion is overwhelmingly product-led: the founders describe reaching 20 million
              users with effectively zero paid marketing, relying on a viral in-meeting bot, a generous free tier, and
              bottom-up adoption that lands inside enterprises before a top-down sale. That self-serve motion keeps
              customer-acquisition cost low and is the mechanical basis for the company's profitability claim, because a
              freemium voice product that grows by word of mouth avoids the sales-and-marketing burn that defines most
              AI peers. Expansion economics run through the CRM: Fireflies pushes call summaries and action items into
              Salesforce, HubSpot, Pipedrive, and Zoho and into Slack, which deepens workflow lock-in for revenue teams
              and supports seat expansion within accounts. The cost structure is dominated by transcription and
              inference compute plus model and storage costs, and the principal margin risk is that the underlying ASR
              layer is commoditized; the company offsets this partly by using open and third-party models rather than
              training its own from scratch. No CAC, payback, net-revenue-retention, gross-margin, or churn figure has
              been published, so unit economics must be inferred from the qualitative picture — strong gross retention
              implied by enterprise integration depth, but unquantified — rather than measured. The absence of these
              standard SaaS metrics is the single largest gap in assessing whether the profitability claim reflects
              durable unit economics or a snapshot.
