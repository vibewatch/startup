      - number: '2.2'
        title: Market sizing across multiple lenses
        blocks:
          - type: paragraph
            body: >-
              No single credible TAM defines Fireflies' opportunity, so the market is best bounded with nested lenses.
              At the narrowest, the AI meeting-assistant market itself is small but fast-growing: Statifacts values it
              at about $3.50 billion in 2025 and $4.41 billion in 2026, rising to roughly $35 billion by 2035 at a 25.9%
              CAGR, while Market.us values it at $3.67 billion in 2024 and projects $72.17 billion by 2034 at a much
              steeper 34.7% CAGR. One lens up, the AI-transcription and speech-to-text API segment is sized between
              roughly $4.5 billion and $5.4 billion in 2026, with MarketsandMarkets putting the STT API market at $5.4
              billion by 2026 at a 19.2% CAGR. Broader still, the voice and speech-recognition market that underpins all
              of these was about $20.25 billion in 2023 and is projected to reach $53.67 billion by 2030 at a 14.6%
              CAGR. The adjacent conversation-intelligence software market is larger again, growing from roughly $26.7
              billion to $32.2 billion in 2025-2026 depending on the publisher. North America dominates every lens,
              holding 35.3% of the meeting-assistant market in 2024 and 30.8% of voice/speech recognition in 2023. The
              wide dispersion in these forecasts — CAGRs ranging from 7% to nearly 35% — is itself the headline finding:
              sizing this market precisely is not yet possible, and any valuation thesis must treat the TAM as a range
              rather than a point estimate.
