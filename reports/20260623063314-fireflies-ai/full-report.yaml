            body: >-
              Fireflies' public customer proof is broad and sentiment-rich but light on quantified enterprise outcomes.
              The company's customers page features named testimonials from senior leaders, including April Underwood
              (then Chief Product Officer of Slack), Susan Kimberlin (a search leader associated with Salesforce), Sarup
              Banskota (Head of Growth at Vercel), and founders and executives at smaller companies such as CyberBytes,
              Qualytics, and Brado. These are credible reference voices and signal endorsement from notable operators,
              but they are testimonial quotes rather than structured, metricized case studies tied to named production
              deployments and ROI. Third-party review evidence is stronger on volume: Fireflies holds about a 4.8 out of
              5 rating on G2 across hundreds to thousands of reviews, favorable ratings on TrustRadius and PeerSpot, and
              high marks on the Chrome Web Store, with reviewers consistently praising transcription speed, summaries,
              action items, and time savings. Independent reviews also surface real limitations that bear on reference
              quality: an English-only interface that frustrates international teams, mediocre crosstalk handling when
              speakers overlap, AI summaries that capture facts but miss emotional nuance, and conversation intelligence
              that is shallower than purpose-built coaching tools. The picture is a product that delights a large,
              mostly SMB and prosumer base, with enterprise proof that rests more on logos and ratings than on
              disclosed, outcome-quantified deployments — a gap a diligence buyer would need to close with direct
              references.
