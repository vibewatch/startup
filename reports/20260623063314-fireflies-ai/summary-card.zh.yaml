  topStrengths:
    - 2023 年以来真盈利，累计融资仅约 $19M，AI 公司里资本效率异常突出。
    - 自下而上的采用面很广：公司称拥有 20M+ 用户，并被 75% 的 Fortune 500 使用。
    - 产品驱动的增长动作粘性强，会议历史数据资产随使用不断加深。
    - 产品覆盖面强：转写、摘要、行动项、智能搜索、会话智能、API 和集成。
    - 客户口碑高——数百到数千条 G2 评论下评分约 4.8/5。
  topRisks:
    - 录音同意和窃听法风险（ECPA、CIPA、GDPR、HIPAA）突出，Otter.ai 集体诉讼可直接类比。
    - Microsoft Teams Copilot、Google Meet Gemini、Zoom AI Companion 把免费会议 AI 打包进存量套件，压缩定价权。
    - 开源 Whisper 正在商品化核心转写能力，降低技术护城河。
    - 未经审计且彼此冲突的自报指标：收入估计跨度为 $3.3M–$10.9M，盈利和用户数未核验。
    - $1B 估值由二级交易定价，不是新一轮融资，隐含约 90 倍收入倍数，显著高于 Gong（约 18 倍）等可比公司。
  unresolvedGaps:
    - 需要审计后的 ARR 和增长，以及收入确认口径，以消除 $3.3M–$10.9M 的收入区间。
    - 需要验证盈利、毛利率和支撑资本效率说法的单位经济。
    - 需要按层级拆分的队列留存、净收入留存和流失。
    - 需要 2025 年 6 月二级交易条款——每股价格、卖方、流动性折扣和优先股堆叠。
    - 需要审计使用量，以及 20M 用户和 75% Fortune 500 声明背后的付费 / 免费拆分。
