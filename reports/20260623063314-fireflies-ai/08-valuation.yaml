  - id: triggers-and-diligence
    title: Thesis-break triggers, diligence asks, and valuation verdict
    body: >-
      The valuation verdict converts to a small set of monitorable triggers and diligence asks. The single most important
      diligence item is audited ARR and its growth rate: because the entire valuation case turns on whether true revenue is
      near the ~$11M public estimate or far higher, a confirmed ARR figure with definitions would collapse most of the
      uncertainty. Close behind are verified profitability and margin (to confirm the capital-efficiency narrative), cohort
      retention and net revenue retention (the determinant of durability and the multiple), and the secondary transaction's
      terms — price per share, who sold, liquidity discount, and any preference stack — to understand what the $1B figure
      actually represents. Thesis-break triggers on the downside include audited ARR landing near the public estimate
      (implying a 90x mark), net revenue retention falling below roughly 100% as incumbents bundle free meeting AI, or loss
      of bot access on a major platform; each would justify a rerate toward the bear range. Upside confirmation would come
      from audited ARR in the tens-to-hundreds of millions with strong retention, which would validate the secondary mark
      and the bull case. Until those are closed, the responsible stance is research-more / track: engage to obtain the
      audited financials and retention data, price any entry to the base-case envelope with downside protection, and avoid
      underwriting the full $1B on public evidence. The asset quality is real; the price discipline must wait on verified
      numbers.
    claimRefs:
