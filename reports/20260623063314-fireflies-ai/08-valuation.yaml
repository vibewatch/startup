company:
  name: Fireflies.ai
chapter:
  number: 8
  title: Valuation
  summary: >-
    Fireflies' June 2025 secondary transaction set a $1 billion valuation, but on the public evidence that mark is hard to
    underwrite. The most-cited third-party revenue estimate is roughly $10.9 million for 2024 (GetLatka), with a competing
    tracker near $3.3 million (Growjo); against the higher figure the $1B mark implies about a 90x trailing-revenue
    multiple, and against the lower one roughly 300x — far above the comparable set. Gong trades around 18x ($7.3B on
    ~$400M revenue), Fathom's 2024 Series A was about 2–7x, Otter's last venture mark was near $250M, and broad SaaS
    medians sit near 6–8x revenue. Three factors partly offset the rich multiple: Fireflies is reportedly profitable and
    extraordinarily capital-efficient (only ~$19M ever raised), it has a large meeting-history data asset, and the $1B
    figure came from a secondary trade for employee liquidity rather than a primary round — so it is a softer, less
    diligence-tested price signal in both directions. The investment view is therefore evidence-sensitive: the company is
    genuinely attractive in quality, but a buy at $1B cannot be justified on public data alone. Our recommendation is to
    research more / track, with the bull case ($1B+) contingent on verifying that true ARR is materially higher than the
    ~$11M public estimate and that profitability and retention are real, and the bear case (a rerate toward $200–400M)
    triggered if audited ARR is near the public figure and incumbent bundling compresses growth.
sections:
  - id: recommendation-and-thesis
    title: Recommendation, thesis, and anti-thesis
    body: >-
      The recommendation is research-more / track: Fireflies is a high-quality, rare profitable AI unicorn, but the $1
      billion secondary mark cannot be underwritten as a buy on public evidence alone. The positive thesis is strong on
      quality. Fireflies has been profitable since 2023, raised only about $19 million in total, and reached unicorn
      status without burning venture capital — a genuinely rare capital-efficiency profile in AI. It serves a very broad
      base (the company claims 20M+ users and use by 75% of the Fortune 500), has a sticky product-led motion, and owns a
      growing meeting-history data asset that deepens with use. The anti-thesis is equally clear and centers on price and
      verifiability. Every headline metric — revenue, profitability, user counts, Fortune 500 penetration — is
      company-asserted or third-party-estimated, never audited or filed; the most-cited revenue estimate (~$10.9M for
      2024) implies roughly a 90x multiple at the $1B mark, an order of magnitude above comparables like Gong (~18x); and
      the valuation was set by a secondary trade for employee liquidity, not a primary round with a new lead investor's
      diligence, so it is a soft price signal. Competitive commoditization from Microsoft, Google, and Zoom bundling free
      meeting AI compounds the risk to the growth assumptions the multiple requires. The net: an attractive company at the
      wrong-looking price on public data, where the call hinges on closing the revenue-quality and retention evidence gap.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
