  evidenceGaps:
    - type: conflicting-data
      severity: blocking
      topic: true ARR and revenue
      missingEvidence: >-
        Public revenue estimates span $3.3M (Growjo) to $10.9M (GetLatka) for 2024, and no audited ARR is available, so the
        valuation multiple cannot be pinned down.
      whyItMatters: >-
        True ARR is the master switch of the valuation: it determines whether the $1B mark is ~90x or a defensible
        mid-teens multiple, the difference between the bear and bull cases.
      diligencePath: >-
        Obtain audited financial statements and ARR with revenue-recognition definitions, and reconcile against both
        third-party estimates.
      relatedQuestionRefs:
        - QV007
        - QV022
      relatedTableRefs:
        - TV004
    - type: private-evidence-only
      severity: material
      topic: profitability, retention, and transaction terms
      missingEvidence: >-
        Claimed profitability is unaudited, no NRR or cohort retention is disclosed, and the secondary transaction's
        price-per-share, sellers, and preference stack are unknown.
      whyItMatters: >-
        These determine the durability of the multiple and what the $1B figure actually represents; without them the
        secondary mark cannot be interpreted.
      diligencePath: >-
        Obtain audited P&L and margins, cohort retention and churn, and the tender documents and cap table under NDA.
      relatedQuestionRefs:
