      - CV012
      - CV013
    tableRefs:
      - TV001
      - TV002
    figureRefs:
      - FV001
  - id: valuation-comparables-scenarios
    title: Comparable valuation and bull / base / bear scenarios
    body: >-
      On a comparable basis the $1B mark looks stretched. The most-cited 2024 revenue estimate of about $10.9 million puts
      the implied trailing multiple near 90x; the competing $3.3 million estimate pushes it toward 300x. By contrast, Gong
      — the conversation-intelligence leader — carries roughly an 18x multiple on a $7.3 billion valuation and ~$400M of
      revenue; Fathom's 2024 Series A valued it around $73 million against $10M–$30M of ARR, a 2–7x range; Otter's last
      venture valuation was near $250 million; ZoomInfo acquired Chorus.ai for roughly $575 million; and broad SaaS
      medians per Bessemer's cloud benchmarking sit near 6–8x revenue, with top-quartile high-growth names in the low-to-mid
      teens. Even crediting Fireflies a premium for profitability, capital efficiency, and growth, a defensible
      revenue-multiple framework lands well below $1 billion unless true ARR is far higher than the public estimate. The
      scenarios capture that uncertainty. The bear case ($200–400M) assumes audited ARR is near the ~$11M public figure and
      bundled free meeting AI compresses growth, forcing a rerate to a 15–25x multiple. The base case ($500M–$1B) assumes
      real ARR is meaningfully higher (perhaps $30–60M) with durable profitability, supporting a mid-teens-to-20x multiple
      near the secondary mark. The bull case ($1B–$2B+) assumes ARR has scaled toward nine figures with triple-digit
      historical growth, strong retention, and a defensible data moat, making the $1B mark a floor rather than a ceiling.
      The wide envelope is itself the finding: the public evidence cannot distinguish a richly-priced niche tool from an
      under-disclosed nine-figure-ARR compounder.
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
