        - ~$250M (last venture mark)
        - Est. tens of millions
        - Mid-single-digit (est.)
        - Closest notetaker peer; facing consent litigation
      - - Fathom
        - ~$73M (2024 Series A)
        - $10M–$30M ARR
        - ~2–7x
        - Direct notetaker peer; freemium, Zoom-centric
      - - Chorus.ai (ZoomInfo)
        - ~$575M acquisition (2021)
        - Conversation intelligence
        - n/a
        - Shows incumbents absorbing the category
      - - SaaS median (Bessemer)
        - Public-market benchmark
        - EV / revenue
        - ~6–8x (median)
