        - Primary round or audited ARR supporting the multiple
      - - Capital-efficient AI compounder
        - ~90x public revenue multiple is extreme
        - Confirmed ARR materially above ~$11M estimate
    notes: >-
      Each row pairs a quality argument with its disconfirming counterpart and the specific evidence that would resolve it;
