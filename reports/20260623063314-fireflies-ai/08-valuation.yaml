    notes: >-
      Multiples are approximate and use the best available public revenue figures; Fireflies' own ~90x implied multiple on
      ~$11M revenue sits far outside this comparable set, which is the core valuation tension.
    enumerationScope:
      coverage: partial
      basis: >-
        Captures the most relevant AI-notetaker and conversation-intelligence comparables (Gong, Otter, Fathom,
        Chorus/ZoomInfo) plus a broad SaaS revenue-multiple benchmark drawn from analyst trackers and Bessemer cloud
        benchmarking accessed in June 2026; it is a curated peer sample, not an exhaustive universe, because private
        revenue figures are estimates and many peers do not disclose audited metrics.
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV019
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited ARR near public estimate
        - Confirmed ARR ≈ $11M
        - Implies ~90x mark; quality cannot offset
        - Rerate toward bear range; pass at $1B
      - - Retention erosion from bundling
        - NRR falls below ~100%
        - Undercuts durability and growth multiple
        - Cut growth assumptions; widen discount
      - - Platform restricts bots
        - Loss of API access on a top-three platform
        - Threatens core capture model and revenue
        - Stress-test exposed revenue; re-underwrite
      - - Profitability disproven
        - Audited P&L shows losses
        - Removes capital-efficiency premium
        - Reset to growth-stage loss-making comps
      - - Upside confirmation
        - Audited ARR in tens-to-hundreds of millions
        - Validates secondary mark and bull case
        - Re-engage at or above $1B with protection
    notes: >-
      Triggers are designed to be externally monitorable or confirmable in diligence; the audited-ARR trigger is the
      master switch that resolves the bull/bear split.
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Audited ARR and growth
        - No audited revenue; estimates span $3.3M–$10.9M
        - Determines the entire valuation multiple
        - Obtain audited statements and ARR with definitions
      - - Profitability and margins
        - Profitability is self-reported and unaudited
        - Underpins the capital-efficiency premium
        - Review audited P&L and gross/operating margin
      - - Retention / NRR
        - No churn, NRR, or cohort data disclosed
        - Single biggest driver of durable SaaS value
        - Obtain cohort retention and dollar/logo churn
      - - Secondary transaction terms
        - Price/share, sellers, discount, preferences unknown
        - Defines what the $1B figure actually represents
        - Review tender documents and cap table
      - - Paid-base and usage definitions
        - User and Fortune-500 counts unverified
        - Sizes the revenue base behind the multiple
        - Third-party usage audit; paid vs free split
    notes: >-
      Closing the audited-ARR, profitability, and retention asks would resolve most of the valuation uncertainty; until
      then the $1B mark rests on company-asserted figures.
