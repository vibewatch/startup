companyProfile:
  summary: Princeton Digital Group is a Singapore-headquartered developer and operator of hyperscale, AI-ready data-center infrastructure across Asia Pacific. Public evidence ties the company to a 2017 founding by Rangu Salgame and Varoon Raghavan in partnership with Warburg Pincus, then to a rapid scale-up through Singapore, Japan, India, Indonesia, China, Malaysia, and South Korea. By 2025-2026 the company had assembled a large multi-country campus portfolio, raised billions across debt and preferred equity, and positioned India and adjacent APAC markets as major growth engines, but it still disclosed far less than public-market peers on revenue realization, occupancy, margins, and security terms.
