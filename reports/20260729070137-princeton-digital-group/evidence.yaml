evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-profitability
    missingEvidence: Current revenue, EBITDA, gross margin, and cash-flow disclosure by campus or company level.
    whyItMatters: Capital raised and capacity built do not reveal the quality of earnings or debt-service headroom.
    diligencePath: Request management financial statements, lender presentations, and campus utilization / pricing schedules.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named top customers, contract tenors, renewal profile, and backlog by campus.
    whyItMatters: Hyperscaler dependence can create both upside and concentrated downside that the public record does not quantify.
    diligencePath: Request signed customer roster, top-10 revenue concentration, and committed-versus-built capacity by site.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: footprint-and-scale-counters
    missingEvidence: A reconciled company table for data-center count, country count, and secured versus operational megawatts by date.
    whyItMatters: >-
      Public counters change over time and across releases, so a single reconciled baseline is needed for later chapter
      consistency.
    diligencePath: >-
      Request an internal milestone and portfolio schedule that ties each public disclosure to the current platform
      count.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: >-
      Exact ownership percentages, board rights, liquidation preferences, and covenants after the 2025 debt and
      preferred-equity financings.
    whyItMatters: >-
      Recent financings are large enough that hidden preference or covenant terms could materially change economic value
      to junior holders.
    diligencePath: Request the current cap table, term sheets, shareholder agreement, and holdco / project debt covenant package.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: pdg-specific-tam-sam-som
    missingEvidence: A company-specific revenue bridge from APAC market size to PDG addressable spend by market and tenant class.
    whyItMatters: Large regional TAM figures do not automatically translate into the share PDG can monetize.
    diligencePath: Request internal market-model slides by country, tenant class, and campus phase.
    relatedQuestionRefs:
      - QM014
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: backlog-and-preleasing
    missingEvidence: Committed versus available capacity by campus, tenant mix, and pricing.
    whyItMatters: APAC demand is strong, but underwriting depends on how much of PDG’s pipeline is actually precommitted.
    diligencePath: Request backlog, prelease, and anchor-tenant schedules by market.
    relatedQuestionRefs:
      - QM005
      - QM020
  - type: private-evidence-only
    severity: material
    topic: market-by-market-power-roadmap
    missingEvidence: A detailed power-procurement and grid-connection roadmap for each PDG campus.
    whyItMatters: >-
      Power availability is the main gating factor in APAC, so market growth without power conversion is not
      underwritable.
    diligencePath: Request utility agreements, interconnection timelines, and clean-energy procurement status by site.
    relatedQuestionRefs:
      - QM021
      - QM022
      - QM024
  - type: enumeration-incomplete
    severity: minor
    topic: city-market-coverage
    missingEvidence: A ranked city-by-city opportunity map covering every PDG and competitor market with consistent capacity data.
    whyItMatters: Public sources cover the main markets but not an exhaustive city-level opportunity stack in one place.
    diligencePath: Build a cross-market opportunity model from third-party reports, project trackers, and internal pipeline data.
    relatedQuestionRefs:
      - QM015
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pdg-win-loss-data
    missingEvidence: PDG-level named win/loss comparisons against specific competitors and campus bids.
    whyItMatters: Public positioning alone cannot show where PDG is actually taking or losing share.
    diligencePath: Request bid logs, competitor mentions in customer processes, and market-by-market win rates.
    relatedQuestionRefs:
      - QP018
      - QP019
      - QP020
  - type: private-evidence-only
    severity: material
    topic: pricing-and-commercial-terms
    missingEvidence: Actual contract structures, pricing curves, ramp schedules, and incentives across PDG and peer campuses.
    whyItMatters: The lack of public pricing means a critical competitive dimension remains opaque.
    diligencePath: Request anonymized customer contracts, price-per-MW data, and concession histories.
    relatedQuestionRefs:
      - QP014
      - QP015
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: long-tail-local-peers
    missingEvidence: A country-level list of every relevant domestic data-centre operator in each PDG market.
    whyItMatters: This chapter focuses on the peer set most relevant to PDG’s regional strategy, not every local operator.
    diligencePath: Expand the landscape by country using project trackers, market reports, and local filings.
    relatedQuestionRefs:
      - QP001
      - QP004
      - QP005
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: lease-book-and-pricing
    missingEvidence: Named contract economics, realized price per MW, rent escalators, and weighted average lease term by campus.
    whyItMatters: The commercial engine is visible, but revenue quality cannot be underwritten without the lease book.
    diligencePath: Request anonymized top-customer contracts, occupied MW, lease expiry ladder, and realized pricing by market.
    relatedQuestionRefs:
      - QI002
      - QI004
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: treasury-and-covenants
    missingEvidence: Cash balance, debt maturities, covenant package, hedging policy, and intercompany guarantees.
    whyItMatters: Fundraising headlines are not enough to judge refinancing risk or downside resilience.
    diligencePath: Request debt agreements, lender model, treasury dashboard, and downside liquidity case.
    relatedQuestionRefs:
      - QI015
      - QI021
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: campus-level-profitability
    missingEvidence: Revenue, EBITDA, and yield-on-cost by campus or country.
    whyItMatters: >-
      Without asset-level profitability, investors cannot tell whether rapid growth is value-accretive after financing
      costs.
    diligencePath: >-
      Request board materials showing stabilized yields, margin bridge, and actual-versus-underwritten project
      performance.
    relatedQuestionRefs:
      - QI007
      - QI009
      - QI017
      - QI023
    relatedTableRefs:
      - TI003
    relatedFigureRefs:
      - FI003
  - type: private-evidence-only
    severity: material
    topic: india-absorption
    missingEvidence: Signed MW, occupancy ramps, and customer move-in schedules for PDG's India portfolio.
    whyItMatters: India is now so large in the portfolio that timing risk could dominate the equity story.
