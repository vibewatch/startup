- id: valuation-verdict-and-remaining-gaps
  title: Valuation verdict and remaining gaps
  body: The valuation verdict from public evidence is that PDG is a strategic infrastructure asset with a fair-to-stretched valuation profile rather than an obviously cheap private bargain. The company appears valuable enough to justify serious global-infrastructure capital, and the Bloomberg-linked estimate around USD 4 billion is plausible as an order-of-magnitude reference. But there is still too much missing information to claim that figure confidently as fair value. Investors do not have public access to EBITDA, occupied megawatts, lease terms, customer concentration, leverage, or the economics of Stonepeak’s preferred security. Those omissions matter more here than in a typical startup because valuation is being justified partly on asset quality and downside protection, not only on growth optionality. Until a data room closes those gaps, the prudent stance is to treat PDG as a genuine unicorn-plus platform with meaningful upside, but not as a transparently underpriced opportunity.
  claimRefs:
