- id: scenario-thinking-premiums-and-discounts
  title: Scenario thinking, premiums, and discounts
  body: 'PDG has credible arguments for both a premium and a discount. The premium case rests on scarcity: APAC AI-ready capacity is valuable, the company already has major sponsors, and it has shown it can raise large pools of debt and equity while building across several high-growth markets. The discount case is equally real: private opacity is high, the business is development-heavy, the customer base is likely concentrated, and India now represents an outsized share of the growth story. Public writing about India makes clear that timing of hyperscaler absorption can reshape outcomes materially. That is why a thoughtful range is more honest than a point estimate. A bull case can lean toward the global-leader side of the peer range if AI scarcity and execution keep reinforcing one another. A bear case should lean toward regional-comp levels if occupancy timing or financing terms prove less favorable than headlines imply. A base case belongs between those endpoints. That range-based framing
    is more faithful to the evidence than pretending a single multiple cleanly solves the valuation question.'
