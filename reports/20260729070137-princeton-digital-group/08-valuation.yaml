  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - What must be true
  - Where valuation could lean
  - Main failure mode
  rows:
  - - Bull
    - AI-ready APAC scarcity persists and PDG executes on India / Japan / Korea expansion
    - Closer to global-leader style strategic premium
    - Assumes occupancy and financing stay favorable
  - - Base
    - PDG continues scaling but remains less transparent and more development-heavy than listed leaders
    - Between GDS-like regional multiples and global-leader levels
    - Requires disciplined execution with no major shocks
  - - Bear
    - India timing slips, customer concentration bites, or preferred / debt terms are economically heavier than headlines suggest
    - Closer to regional public comp range
    - Public opacity amplifies downside uncertainty
  notes: These scenarios are qualitative because public data does not support a clean DCF or EBITDA-multiple model.
