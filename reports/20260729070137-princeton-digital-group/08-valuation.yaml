- id: TV006
  title: Valuation diligence gaps table
  columns:
  - Missing item
  - Why it matters
  - Exact diligence path
  rows:
  - - EBITDA / cash flow
    - Needed to translate scale into value
    - Request TTM EBITDA, FFO-style bridge, and cash-conversion metrics
  - - Occupied MW and lease term
    - Needed to judge earnings quality and duration
    - Request signed MW, WALT, and lease-expiry ladder
  - - Customer concentration
    - Needed to gauge downside risk
    - Request top-customer exposure and renewal schedule
  - - Capital-structure economics
    - Needed to understand preferred / debt burden
    - Request Stonepeak terms, covenants, and intercompany guarantees
  - - Project-level yield
    - Needed to assess whether growth creates value
    - Request yield-on-cost and stabilized return assumptions
  - - Country-level profitability
    - Needed to see whether scale is accretive across all markets
    - Request EBITDA by market or campus cluster
  notes: These are the minimum missing inputs that keep the public valuation view from becoming a tighter investment conclusion.
  enumerationScope:
    coverage: exhaustive
    basis: Core missing private valuation inputs required for underwriting.
