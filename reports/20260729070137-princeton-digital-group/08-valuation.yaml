  title: Premiums and discounts table
  columns:
  - Factor
  - Premium or discount
  - Why
  rows:
  - - APAC AI-ready scarcity
    - Premium
    - Large powered sites in strategic growth markets are scarce
  - - Sponsor quality and financing access
    - Premium
    - Blue-chip investors and lenders improve strategic credibility
  - - Multi-country execution footprint
    - Premium
    - Regional consistency matters to hyperscalers
  - - Private opacity
    - Discount
    - No public EBITDA, occupancy, or lease-book data
  - - Development-heavy posture
    - Discount
    - Returns depend on future delivery and absorption
  - - Customer / India concentration risk
    - Discount
    - A few markets and buyers likely drive a large share of value
  notes: Both sides of the valuation argument are real; neither can be ignored.
