    - Capacity released through application exercises
    - Expansion timing can be policy-limited
    - SG+ corridor diversifies growth options
  - - Incident reporting and resilience duties
    - Broader reporting and BCMS expectations
    - More operational scrutiny and audit burden
    - Formal policies and structured processes can reduce surprises
  - - Board-level accountability
    - Regulators framing resilience as CEO / board issue
    - Governance burden rises alongside scale
    - Published governance materials and partner frameworks help but do not eliminate exposure
  notes: Singapore is the single most policy-dense market in the retained public record.
