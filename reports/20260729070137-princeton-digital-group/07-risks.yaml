- id: governance-cyber-and-unresolved-risk-gaps
  title: Governance, cyber, and unresolved risk gaps
  body: 'The governance and cyber picture is becoming stricter. Singapore’s authorities are signaling that incident reporting, business continuity, and top-level accountability are not optional. CNA’s reporting on advanced-persistent-threat notification rules and the IMDA guidance summarized by legal advisers both point toward a future in which boards and executive teams are expected to understand infrastructure resilience in operational detail. PDG’s own privacy policy, terms, supplier code, sustainability reporting, and TCFD-style materials suggest the company recognizes that governance matters. Even so, the public record still does not reveal several underwriting-critical facts: actual outage history, insurance structure, detailed site contingency tests, supplier concentration, or covenant flexibility under stress. Those unknowns are why PDG’s risk profile should be described as manageable but still data-room dependent. The company is effectively managing a portfolio of different rulebooks,
    counterparties, and local operating conditions rather than a single harmonized regime.'
