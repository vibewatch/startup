- id: platform-level-financing-customer-and-ownership-risks
  title: Platform-level financing, customer, and ownership risks
  body: At the platform level, PDG carries the standard risks of a sponsor-backed, capital-intensive infrastructure company that is scaling quickly. The company has repeatedly raised large sums of debt and equity, and public commentary about India makes clear that billions of dollars of value creation depend on large customers taking capacity on time. That does not mean the thesis is weak; it means timing matters. A portfolio heavily geared toward hyperscalers can produce durable, long-life customers, but it can also produce concentration and expansion-timing risk. A PE-backed operator may also feel pressure to keep showing growth through new campuses, new countries, and new financing rounds. The risk question is therefore not whether PDG can tell a compelling growth story, but whether it can keep translating that story into occupied, resilient, cash-generating capacity before financing markets or customer timelines become less forgiving. That is especially true when investor expectations,
    lender discipline, and customer rollout schedules all move on different clocks.
  claimRefs:
  - CR016
  - CR017
  - CR021
  - CR024
  - CR025
  - CR033
  - CR034
  - CR036
  tableRefs:
  - TR002
