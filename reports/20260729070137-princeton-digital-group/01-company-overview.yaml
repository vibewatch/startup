- id: founders-leadership-and-governance
  title: Founders, leadership, and governance
  body: 'The company remains strongly founder-led. PDG’s about-page roadmap says the business was founded in 2017 by Rangu Salgame and Varoon Raghavan in partnership with Warburg Pincus, and the same page identifies Salgame as chairman, chief executive officer, and co-founder. Ontario Teachers’ independently reinforces the core origin story, writing that Salgame identified the need for a pan-Asian platform for hyperscalers and co-founded PDG in 2017. Public leadership evidence points to an operator-heavy bench rather than a financial-shell structure: PDG says its leadership spans digital infrastructure, renewable energy, real estate, and in-country operating expertise, and the company added Niall Hannigan as group chief financial officer in 2024. Sponsor-linked governance is also visible. The July 2025 Stonepeak announcement says Warburg Pincus will remain PDG’s largest shareholder after Stonepeak’s investment, and the about-page leadership section surfaces investor-side figures from Warburg
    Pincus, Ontario Teachers’, and Stonepeak alongside management. That combination suggests professionalized sponsor governance, but public sources still do not disclose voting rights, board committees, ownership percentages, or the exact preference stack attached to recent financings.'
