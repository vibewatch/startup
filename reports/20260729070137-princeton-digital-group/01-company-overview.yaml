- id: adverse-signals-and-open-underwriting-gaps
  title: Adverse signals and open underwriting gaps
  body: 'The same public record that makes PDG look scaled and well financed also highlights meaningful underwriting gaps. Neither the official website nor the reviewed releases disclose revenue, ARR, EBITDA, gross margin, customer concentration, or current headcount. Even the company’s scale counters vary with time and context: one official 2022 release described five countries, 20 data centers, and 600+ MW of secured capacity; the July 2025 Stonepeak release described 1.1+ GW across six countries; and the homepage now highlights seven economies. Those variations are explainable as expansion plus disclosure timing, but they still need management reconciliation in diligence. Customer proof is also broad rather than account-specific. Ontario Teachers’ says PDG serves some of the world’s biggest cloud companies, while WebHosting.Today characterizes PDG as a wholesale infrastructure operator serving global hyperscalers, yet named customer-level tenancy remains sparse in official materials.
    Sustainability proof is stronger than financial proof: PDG and Flexidao describe hourly carbon-free energy matching in Mumbai, while the ESG pages and reports point to a 2030 net-zero target for Scope 1 and 2 emissions. The result is a company that looks strategically important and capital-backed, but still not fully underwritable from public information alone.'
