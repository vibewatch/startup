  - - Mubadala
    - Lead investor in 2022 equity round
    - Added sovereign-capital backing and growth capital.
    - Official 2022 release says Mubadala invested $350M in a $500M+ round.
    - Clarify current ownership and any special protections.
  - - Stonepeak
    - Preferred-equity investor in 2025
    - Introduced a very large fresh capital layer and likely preference considerations.
    - Official and Stonepeak releases say Stonepeak invested $1.3B preferred equity.
    - Review preference terms, dilution impact, and governance package.
  - - Lending bank consortium
    - Debt capital providers
    - Provides holdco and project financing needed for buildout.
    - May 2025 release names Barclays, BNP Paribas, and Deutsche Bank on holdco debt.
    - Obtain covenant package, collateral structure, and recourse terms.
  - - Hyperscaler and cloud customers
    - Demand-side stakeholders
    - Long-term contracts drive campus economics and execution urgency.
    - Ontario Teachers and other sources describe large cloud customers, but not many named tenants.
    - Need account concentration, contract tenor, and backlog by campus.
