- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Risk
  rows:
  - - Land and permitting
    - Establishes where large campuses can exist
    - Regulators, zoning, counterparties
    - Delays can shift revenue start dates materially
  - - Utility power and substations
    - Provides critical IT load and energization path
    - Utilities and grid capacity
    - Power scarcity is a first-order constraint
  - - Cooling system
    - Supports AI rack densities and facility efficiency
    - Equipment vendors, water / energy design choices
    - Liquid-cooling rollout risk and capex intensity
  - - Network and fiber connectivity
    - Connects workloads to clouds, exchanges, and customers
    - Carriers, cloud on-ramps, cable landings
    - Poor adjacency weakens the product even with ample power
  - - Certification and controls
    - Signals readiness, safety, and trust to buyers
    - Independent auditors, operational discipline
    - Public badges do not automatically prove live operating excellence
  - - Operating talent
    - Runs facilities, change management, and incident response
    - Hiring and retention of specialized staff
    - Talent gaps can create service-quality risk
  notes: PDG's architecture is a coordinated operating system across real estate, power, cooling, networks, and people.
