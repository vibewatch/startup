    - 150 MW, hybrid cooling, IGBC Platinum, Uptime Tier III, renewable-energy program
    - Need uptime and utilization disclosures
  - - JH1 Johor
    - Regional hyperscalers
    - Partially delivered / scaling
    - Fast delivery, campus-scale power agreement, AI-ready positioning
    - Need final full-campus technical specs
  - - SG1 / SG3 Singapore
    - Enterprises plus cloud-adjacent users
    - Operational
    - Carrier-neutral multi-tenant footprint with dense network adjacency
    - Need revenue / utilization split between enterprise and hyperscale
  - - JC3 Jakarta
    - Hyperscalers / AI workloads
    - Under development
    - Dual-grid, multiple fiber routes, direct-to-chip cooling
    - Need live operating proof once first phase opens
  - - Planned expansion sites (BT1, JH2, CH1, HY1)
    - Future hyperscale growth
    - Planned / early stage
    - Expansion optionality in key APAC corridors
    - Need final cooling, power, and build timing data
  notes: PDG's product should be read as a campus portfolio with varying maturity rather than a single homogeneous facility type.
