company:
  name: Princeton Digital Group
chapter:
  number: 5
  title: Product & Technology
  summary: PDG's product is not a single software layer but a pan-Asian portfolio of AI-ready data-center campuses whose core technical value comes from power, cooling, connectivity, certifications, and speed of delivery. The public record increasingly supports PDG's claims around high-density AI readiness and clean-energy integration, but still leaves important gaps on uptime telemetry and portfolio-wide performance metrics.
sections:
- id: product-definition-and-campus-map
  title: Product definition and campus map
  body: 'PDG sells hyperscale digital infrastructure, not generic hosting. Its public positioning is consistent across the home page, solutions page, and location pages: the product is a set of market-specific campuses and facilities designed for the world''s largest cloud and AI companies. That means the relevant product modules are campuses such as TY1 in Japan, MU1 in India, JH1 in Johor, SG1/SG3 in Singapore, JC-series sites in Indonesia, and a growing set of planned expansions in Chennai, Hyderabad, Batam, Johor, and South Korea. The product is therefore portfolio-like by design. Customers are not buying a standardized box; they are buying a combination of location, power, floor space, connectivity, certifications, and expansion optionality in the APAC markets where they need to deploy. PDG''s SG+ strategy makes this especially clear because it frames Singapore, Johor, and Batam as one coordinated expansion corridor rather than as isolated sites. The product map matters because each
    campus can be sold as a technical option set with different density, certification, and expansion characteristics, rather than as interchangeable wholesale square footage.'
