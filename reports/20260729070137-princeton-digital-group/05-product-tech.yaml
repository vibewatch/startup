- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - PDG solution
  - Measurable benefit
  - Limitation
  rows:
  - - Enter Singapore fast
    - Deploy into Singapore, then find overflow elsewhere
    - SG+ links Singapore with Johor and Batam for expansion
    - More scalable path than remaining in land-constrained Singapore only
    - Requires cross-border execution and customer willingness to spread workloads
  - - Launch AI capacity in Tokyo
    - Find dense power and cooling near the Tokyo market
    - TY1 offers high-density AI-ready capacity outside the tightest core locations
    - Supports large AI racks with credible certification signals
    - Public data does not show occupancy or SLA history
  - - Scale in India with sustainability overlay
    - Need large campus plus renewable-energy alignment
    - MU1 combines large capacity, certifications, and renewable matching
    - Can align with customer sustainability requirements
    - Public economics of the green overlay remain unclear
  - - Secure cloud adjacency in Singapore
    - Need fast cloud on-ramp and controllable connectivity
    - Console Connect at SG1 exposes cloud endpoints through portal / API
    - Improves customer workflow and connection speed
    - Relies on partner ecosystem, not only PDG-owned tooling
  - - Expand into emerging APAC corridors
    - Need local execution and future campus roadmap
    - PDG offers multiple countries under one operator model
    - Potentially reduces vendor sprawl across APAC
    - Public disclosure varies significantly by site maturity
  notes: The workflow is customer-specific and location-led; PDG's product value comes from execution in constrained infrastructure markets.
