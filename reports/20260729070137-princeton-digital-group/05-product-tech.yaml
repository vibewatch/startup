- id: maturity-dependencies-and-technical-verdict
  title: Maturity, dependencies, and technical verdict
  body: 'PDG''s technology appears most mature where the public record can tie together a specific campus, a power source, a cooling configuration, and an operating milestone. TY1, MU1, and JH1 fit that standard best today. Other sites are promising but less transparent, particularly where only capacity and site plans are public. The key dependencies are not subtle: utilities, renewable-energy suppliers, grid access, connectivity partners, contractors, certification bodies, and local regulatory approval all sit in the critical path. The South Korea entry via a leased ESR site shows that PDG can flex its deployment model, but it also underscores that the company sometimes depends on third-party real-estate infrastructure rather than fully controlling every layer. Overall, the technical story is credible and increasingly corroborated, yet public diligence still lacks portfolio-wide uptime data, redundancy disclosures, incident history, and asset-by-asset performance benchmarks. That missing
    telemetry is especially important because AI racks raise thermal, electrical, and maintenance complexity faster than a generic colocation narrative would suggest.'
