- id: trust-controls-sustainability-and-operating-stack
  title: Trust controls, sustainability, and the operating stack
  body: 'PDG''s public trust story combines site certifications, utility relationships, sustainability systems, and human operating capability. SG1 and MU1 publish the clearest certification stacks, while TY1, JH1, and MU1 have increasingly become the proof points for hyperscale-grade and AI-grade readiness through OCP Ready and DGX-Ready announcements. On sustainability, the company has gone beyond broad ESG language: WAM and Flexidao describe a 25-year renewable-energy arrangement for MU1 and an hourly carbon-free energy matching system supported by automated meter-data collection and proof management. PDG''s own sustainability reporting adds external assurance and a green-finance framework, suggesting the company is trying to make sustainability an operating-system layer rather than a side narrative. Practitioner signals remain modest because PDG is not an open-source company, but recruiting for IT infrastructure engineering and Ontario Teachers'' emphasis on land, power, and operations
    talent still reveal the operational stack required to run the platform.'
