- id: architecture-power-cooling-and-connectivity
  title: Architecture, power, cooling, and connectivity
  body: 'The strongest publicly evidenced part of PDG''s technology story is the physical architecture required for AI infrastructure. TY1 is presented as a 96 MW campus capable of more than 140 kW per rack with advanced liquid cooling, while JC3 is described as a dual-grid, carrier-neutral site with multiple fiber routes and direct-to-chip cooling plus conventional cooling flexibility. MU1 is described as a high-density campus with hybrid cooling capability, extensive certifications, and reliable power and network access in Navi Mumbai. JH1 and the Johor materials reinforce the same theme: the product depends on securing power, designing for large AI loads, and building in a way that can scale over multiple buildings. Console Connect adds an important customer-facing layer by showing that PDG''s Singapore asset is also part of a broader cloud-adjacency workflow, where direct programmable connectivity matters alongside the physical facility itself.'
