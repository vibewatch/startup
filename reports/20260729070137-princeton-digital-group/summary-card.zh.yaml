  topStrengths:
    - PDG 已拼出稀缺的泛亚太超大规模云基础设施版图，在新加坡、日本、印度、印尼、中国、马来西亚和韩国都有实质布局。
    - 作为私有基础设施公司，PDG 的资本后盾罕见地深，Warburg Pincus、Ontario Teachers'、Mubadala 和 Stonepeak 都出现在资本结构中。
    - 2025 年新增债务和优先股融资显示，贷款人和投资人仍想配置 AI 驱动的亚太数据中心产能。
    - 印度、Johor-Batam-Singapore 和日本提供多条增长走廊，而不是单一市场逻辑。
  topRisks:
    - 公开证据仍未披露收入、EBITDA、出租率、租赁价格、客户集中度或常态化现金流质量。
    - Stonepeak 优先股经济条款和整体优先级堆叠未披露，因此名义估值可能高估普通股价值。
    - PDG 建设扩张卡在电力可得性、许可、承包商和多个受监管亚太市场的跨境执行上。
    - 印度似乎越来越成为组合价值核心；一旦当地需求、融资或交付节奏滑坡，集中度风险会上升。
    - Equinix、Digital Realty、GDS、NTT、STT GDC、DayOne 等全球和区域竞争者可能压低收益率，或拖慢出租。
  unresolvedGaps:
    - 按园区或国家拆分的当前收入、EBITDA、出租率和利用率
    - 客户集中度、合同期限、续约率和具名租户经济性
