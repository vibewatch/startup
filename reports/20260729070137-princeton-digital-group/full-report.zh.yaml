  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 必须成立的条件
      - 估值可能偏向
      - 主要失败模式
    rows:
      - - 牛市
        - APAC AI 就绪供给稀缺延续，PDG 在印度 / 日本 / 韩国扩张上跑出来
        - 更接近全球龙头式战略溢价
        - 假设入住率和融资环境保持有利
      - - 基准
        - PDG 继续扩张，但透明度仍低于上市龙头，开发项目也更重
        - 介于类似 GDS 的区域倍数与全球龙头水平之间
        - 需要纪律严明地执行，且不能遭遇重大冲击
      - - 熊市
        - 印度节奏滑坡、客户集中度反噬，或优先股权 / 债务条款的经济负担重于标题数字
        - 更接近区域上市可比公司区间
        - 公开信息不透明会放大下行不确定性
    notes: 这些情景是定性判断，因为公开数据不足以支撑干净的 DCF 或 EBITDA 倍数模型。
    claimRefs:
      - CV018
      - CV023
      - CV030
      - CV031
      - CV034
      - CV035
      - CV036
  - id: TV005
    title: 溢价与折价表
    columns:
      - 因素
      - 溢价或折价
      - 原因
    rows:
      - - APAC AI 就绪供给稀缺
        - 溢价
        - 战略增长市场里有电力保障的大型场址稀缺
      - - 赞助方质量和融资可得性
        - 溢价
        - 蓝筹投资人和贷款人提升战略可信度
      - - 多国执行足迹
        - 溢价
        - 区域一致性对超大规模云厂商很重要
      - - 私有公司透明度低
        - 折价
        - 没有公开 EBITDA、入住率或租约组合数据
      - - 开发项目偏重
        - 折价
        - 回报取决于未来交付和吸纳
      - - 客户 / 印度集中风险
        - 折价
        - 少数市场和买方可能贡献大部分价值
    notes: 估值辩论的两面都真实存在，哪一面都不能忽略。
    claimRefs:
      - CV006
      - CV018
      - CV023
      - CV030
      - CV031
  - id: TV006
    title: 估值尽调缺口表
    columns:
      - 缺失项
      - 重要性
      - 具体尽调路径
    rows:
      - - EBITDA / 现金流
        - 需要用它把规模转成价值
        - 要求提供 TTM EBITDA、类 FFO 口径桥表和现金转化指标
      - - 已租用 MW 和租期
        - 需要判断收益质量和持续期
        - 要求提供已签约 MW、WALT 和租约到期梯队
      - - 客户集中度
        - 需要衡量下行风险
        - 要求提供头部客户敞口和续约时间表
      - - 资本结构经济性
        - 需要看清优先股权 / 债务负担
        - 要求提供 Stonepeak 条款、契约和集团内担保
      - - 项目层面收益率
        - 需要评估增长是否创造价值
        - 要求提供成本收益率和稳定期回报假设
      - - 分国家盈利能力
        - 需要看清规模是否在所有市场增厚收益
        - 要求按市场或园区集群提供 EBITDA
    notes: 这些是最低限度缺失输入；没有它们，公开估值视角无法收敛成更紧的投资结论。
    enumerationScope:
      coverage: exhaustive
      basis: Core missing private valuation inputs required for underwriting.
    claimRefs:
      - CV017
      - CV031
      - CV032
      - CV037
      - CV040
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: PDG 的公开路径从 2017 年由赞助方支持创立，走到 2025-2026 年债务、优先股权和多国 AI 就绪园区扩张密集落地。
    claimRefs:
      - CO003
      - CO013
      - CO014
      - CO019
      - CO021
      - CO024
      - CO025
      - CO030
      - CO031
    data:
      items:
        - date: '2017'
          label: 创立
          detail: Salgame 和 Raghavan 携 Warburg Pincus 合作创立 PDG。
          tone: positive
        - date: '2020'
          label: OTPP 投资
          detail: PDG 扩张泛亚洲平台时，Ontario Teachers 进入股权结构。
          tone: positive
        - date: 2022-02
          label: Mubadala 轮融资
          detail: Mubadala 领投 $500M+ 股权轮，其中包括一笔 $350M 投资。
          tone: positive
        - date: '2023'
          label: Singapore+ 策略
          detail: PDG 宣布一条 US$1B 扩张路径，覆盖新加坡、巴淡岛和柔佛。
          tone: positive
        - date: '2024'
          label: 500 MW 土地储备
          detail: AI 就绪土地收购指向更大的亚洲园区布局野心。
          tone: positive
        - date: 2025-05
          label: 债务融资
          detail: PDG 融资 $1.2B，分为项目融资和控股公司债务。
          tone: positive
        - date: 2025-07
          label: Stonepeak 优先股权
          detail: Stonepeak 承诺投入 $1.3B，2025 年总募资额达到 $2.5B。
          tone: positive
        - date: '2025'
          label: 进入韩国
          detail: PDG 以 KR1 设施为锚，进入韩国，投资路径为 $700M。
          tone: positive
        - date: '2025'
          label: 东京 TY1 启动
          detail: TY1 启动，成为日本最大的 AI 就绪数据中心园区之一。
          tone: positive
        - date: '2026'
          label: 披露缺口仍在
          detail: 独立描述强调 1 GW 规模，但收入和员工人数仍未公开披露。
          tone: negative
