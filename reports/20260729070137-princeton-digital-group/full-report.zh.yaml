  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值证据到底有哪些
        blocks:
          - type: paragraph
            body: >-
              PDG 只有两条直接公开估值线索。第一，公司和 Stonepeak 在 2025 年 7 月披露 USD 1.3 billion 优先股权投资，此前不久 PDG 已宣布 USD 1.2 billion
              债务融资。第二，Mingtiandi 报道称，Bloomberg 此前讨论过一笔可能把 PDG 估值约定在 USD 4 billion
              的交易。单看任何一点，都不能给出干净的公允价值答案。优先股权轮次可以支撑很高的头条估值，同时嵌入会实质影响普通股经济性的条款；Bloomberg
              引出的数字也最好视作外部市场估计，而不是已披露、经董事会批准的估值。交易清楚说明的一点是，超大型基础设施投资人愿意向这个平台投出九位数甚至十位数支票。仅这一点，就足以把 PDG 稳稳推入独角兽以上区间。
