      - number: '3.3'
        title: 能力、定价姿态与切换力量
        blocks:
          - type: paragraph
            body: >-
              这个市场的公开定价透明度很差，所以竞争比较必须更多依赖能力信号和商业模式线索，而不是标价。Equinix 和 Digital Realty
              释放的是广泛托管和数据中心服务组合信号，这很可能帮助它们交叉销售企业和互联服务；PDG 对这些服务的强调没有那么强。AirTrunk、Bridge 和 PDG 等运营商则更强调大型 AI
              就绪园区交付，更直接映射超大规模客户的扩张需求。GDS 和 Chindata 强调中国超大规模专长，PDG
              也有中国业务，但没有同样的本地市场集中度。客户一旦预留或部署容量，切换成本就很高，因为园区受电力约束、交付周期长，工作负载在运营上也有黏性。PDG
              赢下锚定租户后会获得一定耐久性，但这也抬高了第一次土地和电力预留决策失手的成本。因此，这门生意不只是抢客户；它是在正确市场、正确时间争夺稀缺容量选项。互联生态更强、本地公用事业关系更深或资金成本更低的对手，即便产品营销未必更好，也能把优势转成份额增长。
