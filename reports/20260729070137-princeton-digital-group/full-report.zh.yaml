        title: 客户分层与公开点名信息
        blocks:
          - type: paragraph
            body: >-
              公开客户图谱是方向性的，不是穷尽式的，但仍然清楚。PDG 一直把买方框定为超大规模客户、云平台、AI 基础设施用户和大型企业。Ontario Teachers’ 明确称，公司服务世界上一些最大的云公司；Dgtl
              Infra 则给出最强的具名样本，列出 Amazon、Alibaba、Pinduoduo、Lazada、Microsoft Azure、Google Cloud、Alibaba Cloud、IBM Cloud 和
              Meta，作为代表性客户或客户类型。在新加坡，Console Connect 提供了另一种证明：PDG
              客户希望借可编程连接直连领先云。由此看，客户基础更像批发型数字基础设施组合，而不是多元长尾托管名单。仍然缺失的是 PDG
              自己验证过的逐租户客户清单。即便最早保留下来的客户向新闻稿也已经使用超大规模客户话术，说明这一聚焦长期稳定，而不是 AI 时代后期才改定位。
