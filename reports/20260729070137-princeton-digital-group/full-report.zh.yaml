  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 新加坡监管与电力风险
        blocks:
          - type: paragraph
            body: >-
              新加坡既是 PDG 最具战略意义的锚定市场之一，也是风险环境最难的市场之一。政府和法律来源显示，政策已经清晰转向：韧性、安全和可持续性要求，正从自愿指引走向具有约束力的许可制度。新兴的 Digital
              Infrastructure Bill 将对主要数据中心运营商，以及超过低兆瓦门槛的数据中心，引入新义务；IMDA
              也在考虑能源和用水效率，以及能源来源质量。与此同时，第二轮数据中心申请征集显示，新容量受到配给，并与更绿色能源路径绑定，而不是需求出现就自然放量。这意味着，PDG
              与新加坡有关的增长，至少同样受监管和基础设施许可约束，而不只是客户需求。运营商若无法证明韧性、连续性和效率，即便市场需求丰富，也可能被政策拖慢。AI 工作负载推高设施强度后，用水效率和冷却审查也会变得更重要。
