      - number: '2.3'
        title: 买方、需求驱动与采用路径
        blocks:
          - type: paragraph
            body: >-
              PDG 市场中的主要买方，是超大规模客户、主要云平台、neocloud 或高性能计算供应商，以及依赖这些平台的超大型企业。JLL 称，超大规模承诺增加正在推动一个多年增长周期；CBRE 则称，AI
              落地、云采用和数字化是主导需求驱动。Cushman 补充说，受电力约束的执行和未来容量竞争已成为选址策略核心；Deloitte 认为，能源规划事实上已变成一阶市场变量。PDG
              自身定位与这个模式高度吻合。公司称其为全球最大云和 AI 公司定制基础设施，Ontario Teachers’ 也称 PDG
              服务世界上一些最大的云公司。因此，这个市场的采用路径不是轻触式软件销售；它从租户需求预测、土地和电力预留、融资决策，一直跑到园区建设和长期容量承诺。东京、孟买、柔佛、雅加达以及新加坡-柔佛-巴淡走廊之所以重要，是因为这些市场既有需求深度，也可能锁到足够电力和可开发土地。
