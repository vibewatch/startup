      - number: '7.2'
        title: 平台层面的融资、客户与所有权风险
        blocks:
          - type: paragraph
            body: >-
              在平台层面，PDG
              承担的是资方支持、资本密集型基础设施公司快速扩张时的标准风险。公司反复募集大额债务和股权，围绕印度的公开评论也清楚表明，数十亿美元价值创造取决于大客户按时拿走容量。这不代表投资逻辑薄弱，而是说明时点很关键。高度偏向超大规模客户的组合，可以带来耐久、长生命周期客户，也可能带来集中度和扩张时点风险。PE
              支持的运营商还可能承受压力，需要不断用新园区、新国家和新融资轮次证明增长。因此，风险问题不是 PDG
              能否讲出有吸引力的增长故事，而是公司能否在融资市场或客户时间表变得没那么宽容之前，持续把故事转成已出租、具韧性、能产现金的容量。投资人预期、贷款人纪律和客户上线计划各自按不同节奏运行时，这一点尤其重要。
