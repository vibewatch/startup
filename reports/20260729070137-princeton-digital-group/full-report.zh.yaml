    sections:
      - number: '3.1'
        title: 竞争版图与对手类型
        blocks:
          - type: paragraph
            body: >-
              PDG 面对的不是一组完全同类的单一对手。真实竞争场至少横跨四类：具备广泛互联和企业触达的全球上市龙头，聚焦
              APAC、由私募或资方支持的超大规模专家，中国权重较高的本土平台，以及绑定电信或基础设施生态的国家型运营商。PDG 官方定位，加上 Business Wire 摘要的 ResearchAndMarkets
              竞争组，都把公司稳稳放在公认的 APAC 数据中心平台队列中，而不是小众本地建设商。落到实际竞争，PDG 在土地、电力、债务、人才和锚定超大规模客户承诺上，要与 Equinix、Digital
              Realty、GDS、STT GDC、Keppel DC、AirTrunk、Bridge Data Centres 和 Chindata 等公司争夺。这些公司打法并不相同。Equinix 和 Digital
              Realty 带来巨大的公开市场规模和广泛服务组合；GDS 和 Chindata 带来中国和超大规模专长；AirTrunk 和 Bridge 强调大型 AI 就绪区域园区；STT GDC 或 Keppel
              则受益于东南亚本地生态深度。因此，PDG 的竞争问题在于，一个泛亚洲、资方支持的运营商，能否在更大上市龙头和资金充足的区域专家都瞄准同一批超大规模需求的市场里继续赢单。
