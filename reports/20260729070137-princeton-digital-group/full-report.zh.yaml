companyProfile:
  summary: >-
    Princeton Digital Group 是一家总部位于新加坡的超大规模、AI 就绪数据中心基础设施开发商和运营商，业务覆盖亚太。公开证据显示，公司 2017 年由 Rangu Salgame 和 Varoon
    Raghavan 与 Warburg Pincus 共同创立，此后迅速扩展到新加坡、日本、印度、印度尼西亚、中国、马来西亚和韩国。到 2025–2026
    年，公司已拼出一个大型多国园区组合，靠债务和优先股权募集数十亿美元，并把印度及周边亚太市场放在增长引擎位置；但收入兑现、出租率、利润率和担保条款等信息，披露仍远少于公开市场同业。
  foundedDate: '2017-01-01'
