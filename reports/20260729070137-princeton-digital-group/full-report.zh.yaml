        - 需要直接客户推荐
      - - 续约 / 流失可见度
        - 长期合同意味着粘性，但公开续约数据缺失
        - 中高
        - 任务关键叙事暗示切换成本高
        - 需要 WALT、续约和流失历史
      - - 企业客户多元化
        - 新加坡显示一定企业宽度，但组合结构未知
        - 中
        - 云周边和 FSI 信号有帮助
        - 需要按客户类型划分的收入 / MW
    notes: 客户侧最大悬而未决的问题不是产品市场匹配，而是客户账本到底有多集中、粘性多强。
    claimRefs:
      - CU015
      - CU021
      - CU022
      - CU026
      - CU030
      - CU031
      - CU035
      - CU036
      - CU040
  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 风险
      - 公开触发因素
      - 潜在影响
      - 缓释信号
    rows:
      - - DIA 许可
        - 3 MW+ 数据中心牌照和重大 FDI 框架
        - 合规成本更高；许可 / 牌照风险
        - PDG 已强调可持续性和控制
      - - 能耗和用水效率阈值
        - IMDA 将评估设施效率和能源来源质量
        - 改造成本和设计约束
        - PDG 强调绿色设计和可再生能源项目
      - - 有条件的新加坡容量分配
        - 通过申请轮次释放容量
        - 扩张节奏可能受政策限制
        - SG+ 走廊分散增长选项
      - - 事件报告和韧性义务
        - 更广泛的报告和 BCMS 预期
        - 运营审查和审计负担加重
        - 正式政策和结构化流程可降低意外
      - - 董事会层面问责
        - 监管机构将韧性定位为 CEO / 董事会议题
        - 治理负担随规模上升
        - 已发布的治理材料和伙伴框架有帮助，但无法消除敞口
    notes: 新加坡是留存公开记录中政策密度最高的单一市场。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR023
      - CR028
      - CR029
      - CR039
      - CR040
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the principal public regulatory and legal risk vectors affecting PDG; it is not a complete census of
        every local rule in every market.
  - id: TR002
    title: 所有权 / 财务 / 客户风险表
    columns:
      - 风险
      - 重要性
      - 严重程度
      - 公开反向信号
    rows:
      - - 超大规模云时点风险
        - 大型项目在预期客户需求之前或同步建设
        - 高
        - 长期合同表述和反复融资支持这个论点
      - - 印度集中度
        - 印度正在成为组合叙事中很大一部分
        - 高
        - 管理层把印度定义为战略增长引擎，并已锁定电力和审批
      - - PE 支持下的增长压力
        - 发起方和新投资者可能希望快速扩张、看到明确动能
        - 中高
        - 资金雄厚的投资者也可能成为稳定伙伴
      - - 再融资依赖
        - 重资产增长仍需要债务和股权通道
        - 中高
        - 近期大额融资显示通道目前仍打开
      - - 下行韧性不透明
        - 未公开现金、契约或入住率披露
        - 高
        - 除一般性的合作伙伴信心和历史记录外，没有更多信号
    notes: 核心平台风险是高资本强度下能否执行，而不是缺少战略抱负。
    claimRefs:
      - CR016
      - CR017
      - CR024
      - CR025
      - CR033
      - CR034
      - CR036
  - id: TR003
    title: 国家执行风险表
    columns:
      - 国家 / 市场
      - 主要执行风险
      - 证据
      - 含义
    rows:
      - - 新加坡
        - 政策、可持续性和容量配给
        - DIA 方向加数据中心申请征集
        - 增长可能被合规和稀缺新增容量卡住
      - - 日本 / 东京
        - 核心节点的土地和电力约束
        - 围绕埼玉的 TY1 逻辑
        - 二级节点策略有帮助，但会增加执行复杂度
      - - 韩国
        - 土地、电网和许可复杂度
        - SE1 发布稿
        - 高壁垒进入可支撑上行，但也会拖慢爬坡
      - - 印度尼西亚
        - 基础设施集群和伙伴依赖
        - JC4 共享电力 / 连接逻辑
        - 效率提升伴随生态依赖
      - - 印度
        - 巨型建设计划与需求吸收时点的错配
        - WebHosting + 印度发布稿
        - 上行空间大，也制造集中风险
    notes: 不同地理位置的风险差异很大；单一摘要标签会遮掉太多信息。
    claimRefs:
      - CR014
      - CR015
      - CR017
      - CR018
      - CR031
      - CR034
      - CR037
      - CR038
      - CR040
  - id: TR004
    title: 治理 / 法律 / 网络安全表
    columns:
      - 风险面
      - 公开来源显示
      - 薄弱时的风险
      - 缺口
    rows:
      - - 隐私治理
        - PDG 发布隐私政策，新加坡也有强势隐私监管机构
        - 数据处理失败可能造成法律和声誉损害
        - 未公开审计或事件披露
      - - 条款和客户义务
        - PDG 发布使用条款
        - 运营合同中的责任或服务条款如何运作并不清楚
        - 需要审阅客户 MSA 和 SLA
      - - 供应商行为
        - PDG 发布供应商准则
        - 第三方失误可能引发安全、劳工或合规问题
        - 需要供应商集中度和审计数据
      - - 网络安全和事件报告
        - CNA 和 Cybersecurity Act 显示报告要求收紧
        - 延迟报告会放大监管和社会后果
        - 需要实际事件响应手册和过往记录
      - - 业务连续性控制
        - IMDA 相关指引要求 BCMS、测试和恢复规划
        - 准备不足会把单点事件变成系统性中断
        - 需要站点级测试结果证据
    notes: 公开可见的治理材料存在，但不能替代站点级控制证据。
    claimRefs:
      - CR009
      - CR010
      - CR011
      - CR019
      - CR020
      - CR027
      - CR032
      - CR036
  - id: TV001
    title: 估值证据 / 交易表
    columns:
      - 信号
      - 公开内容
      - 解读
      - 局限
    rows:
      - - Stonepeak 优先股
        - 2025 年 7 月宣布 USD 1.3B 投资
        - 显示大型机构对 PDG 有很强信念
        - 优先股条款未公开披露
      - - 2025 年债务融资
        - Stonepeak 之前宣布 USD 1.2B 债务
        - 说明资本市场支持其扩张
        - 债务容量不等于股权公允价值
      - - Mingtiandi 引述的 Bloomberg 相关估算
        - 过程中讨论过约 USD 4B 潜在估值
        - 有用的外部参照点
        - 不是正式披露估值
      - - 战略投资者表述
        - 投资者提到管理层、电力储备和 APAC 规模
        - 支持基础设施平台溢价逻辑
        - 定性而非定量
      - - 组合规模
        - Stonepeak 公告时为 1.1+ GW；2026 年后期为 1.8 GW+
        - 规模对估值很重要
        - 容量不等于收入或 EBITDA
    notes: 交易证据足以确立估值相关性，但不足以计算精确公允价值。
    claimRefs:
