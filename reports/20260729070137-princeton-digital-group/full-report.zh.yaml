              PDG 的公开信任叙事，把场址认证、公用事业关系、可持续系统和人的运营能力组合在一起。SG1 和 MU1 公布了最清楚的认证栈；TY1、JH1 和 MU1 则通过 OCP Ready 与 DGX-Ready
