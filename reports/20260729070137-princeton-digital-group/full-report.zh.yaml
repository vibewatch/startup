        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              财务结论是：融资渠道正面，透明度负面。来自蓝筹资方、全球银行和 Stonepeak 的多次成功募资说明，成熟资本提供方相信 PDG
              能持续把超大规模客户需求转成已签约园区。与此同时，反向公开分析强调，公司战略至少有一部分依赖需求按时出现，尤其在印度，数十亿美元承诺先于充分公开出租证据落地。这个风险是结构性的，不是耸人听闻：如果已锁电容量按时填满，PDG
              的融资策略就显得有先见之明；如果吸纳放慢，同一策略会放大持有成本和再融资依赖。由于公开披露止步于收入、出租率、杠杆、现金流和利润率细节之前，审慎结论是，PDG
              看起来可融资、战略支持强，但没有正式数据室仍无法完整测算。缺失的资金管理和租约台账披露，比任何单一融资头条都更重要。
