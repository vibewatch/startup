  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与园区地图
        blocks:
          - type: paragraph
            body: >-
              PDG 卖的是超大规模数字基础设施，不是通用托管。官网首页、解决方案页和地点页上的公开定位一致：产品是一组针对具体市场、为全球最大云和 AI 公司设计的园区和设施。这意味着，真正的产品模块包括日本 TY1、印度
              MU1、柔佛 JH1、新加坡 SG1/SG3、印度尼西亚 JC 系列场址，以及钦奈、海得拉巴、巴淡、柔佛和韩国日益增加的规划扩张。产品天然是组合型的。客户买的不是标准化盒子，而是在其需要部署的 APAC
              市场中，把地点、电力、楼面空间、连接、认证和扩张选择权打包在一起。PDG 的 SG+
              策略尤其说明这一点，因为它把新加坡、柔佛和巴淡框定为一条协同扩张走廊，而不是彼此孤立的场址。产品地图很重要，因为每个园区都可以作为一组技术选择权出售，密度、认证和扩张特征不同，而不是可互换的批发型平方米。
