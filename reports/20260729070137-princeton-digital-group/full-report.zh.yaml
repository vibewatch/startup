    data:
      items:
        - label: '2024'
          detail: MDDI 在包括 Equinix 故障在内的韧性担忧后宣布 DIA 研究。
        - label: Feb 2025
          detail: IMDA 发布云服务和数据中心咨询指引。
        - label: Feb 2025
          detail: 公开表态称，更严格的能效和事件规则将出台。
        - label: Dec 2025
