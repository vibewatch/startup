      - number: '3.4'
        title: 护城河韧性与反向竞争解读
        blocks:
          - type: paragraph
            body: >-
              反向竞争解读是：PDG 的许多差异化点真实存在，但并非牢不可破。泛亚洲覆盖、超大规模聚焦和 AI 就绪叙事有价值，却不独特。多个 APAC 运营商现在都在推介 AI
              就绪、可持续、大型园区容量。上市龙头还拥有币种、声誉和融资优势；当债务成本上升，或客户想选择最安全交易对手时，这些优势会变得关键。在中国，本土专家可以比外资背景平台更本地化。在东南亚和印度，新一轮土地储备和获电场址收购热潮，也带来今天看似稀缺的资源明天变得更拥挤的风险。另一方面，只要管理层持续锁到电力，并比同业更快把需求转成上线容量，PDG
              的多国版图、资方支持和已证明的园区融资与交付能力仍能形成真实护城河。因此，最有用的投资测算姿态，不是假设 PDG
              拥有不可攻破的竞争位置，而是跟踪其拿地、获电、融资和交付速度，能否继续抵消更大或更根深蒂固对手的规模与资产负债表优势。
