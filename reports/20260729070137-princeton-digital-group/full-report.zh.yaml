      - number: '3.2'
        title: 对手画像、规模与战略方向
        blocks:
          - type: paragraph
            body: >-
              对手画像指向清晰层级。Equinix 和 Digital Realty 是最直接的公开基准，因为两者都是全球规模的上市数据中心运营商，拥有大市值、数十亿美元收入和 APAC 存在。GDS
              是最有用的中国权重上市可比公司，因为它把超大规模聚焦、显著资本需求和更区域化的版图结合在一起。即便公开财务披露更薄，STT GDC、Keppel DC、AirTrunk、Bridge Data Centres 和
              Chindata 也更直接对应 PDG 的 APAC 园区竞争。它们的官网反复强调超大规模、云、AI 和区域增长，说明市场高端细分正在收敛到同一组卖点：电力接入、速度、区域覆盖、可持续设计和客户信任。PDG
              的优势在于，它已经覆盖买方关心的主要走廊；但同一事实也意味着，其目标市场吸引资本最雄厚的竞争者。在这个细分市场里，规模不只是虚荣指标；它决定融资渠道、与公用事业和承包商谈判的筹码，以及在租户签约前提前卡位土地和后续分期的能力。
