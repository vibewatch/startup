          detail: 客户选择新加坡、印度、日本、印度尼西亚或另一个亚太市场。
        - id: u2
          label: 预留容量
          detail: 长期合同逻辑锚定这段关系。
        - id: u3
          label: 上线并连接
          detail: 设施通电，并接入云 / 网络生态。
        - id: u4
          label: 园区内扩张
          detail: 需求增长后，追加更多大厅或楼宇。
        - id: u5
          label: 跨走廊扩张
          detail: 客户随 PDG 进入柔佛、巴淡或另一个国家。
