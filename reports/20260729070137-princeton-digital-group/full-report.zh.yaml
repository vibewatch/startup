      - number: '2.4'
        title: 约束、切换摩擦与未解问题
        blocks:
          - type: paragraph
            body: >-
              PDG 市场最重要的约束，已经不再是需求侧认知，而是供给侧执行和监管边界。CBRE 称电力可得性是运营商的主要挑战；JLL 称电网接入等待期从新兴市场的 24 个月到核心市场的八年以上不等。Cushman
              称，开发管线急剧增长的同时空置率继续小幅下行，意味着强吸纳并未解决容量瓶颈。Deloitte
              用更宽的框架描述同一问题：无协同的数据中心扩张可能加剧电网拥堵和价格波动，因此运营商越来越需要电力优先的增长策略。PDG 自身区域策略也隐含接受了这组约束。其 Singapore+
              计划把增长框架从土地稀缺的新加坡转向柔佛和巴淡；印度、雅加达、东京和韩国扩张也说明，捕捉需求越来越取决于哪里还能锁到电力、土地和许可。未解的市场问题不是云和 AI 需求是否存在，而是 PDG
              想建设的具体市场里，有多少需求能够转成经济性有吸引力、拿到许可且电力充足的容量。
