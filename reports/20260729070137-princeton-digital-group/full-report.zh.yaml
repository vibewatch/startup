chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、版图与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Princeton Digital Group 把自己定位成泛亚洲 AI
              就绪超大规模数据中心基础设施的开发商和运营商，而不是零售托管品牌或软件公司。公司目前的公开页面称，其在新加坡、日本、印度、印度尼西亚、中国、马来西亚和韩国开发并运营数据中心，服务全球超大规模客户、云运营商、企业和数字基础设施需求。官方版图叙事也显示，公司扩张速度很快。2022
              年，PDG 称自己是覆盖五个国家、拥有 20 座数据中心、已锁定容量超过 600 MW 的平台。到 2025 年 7 月，公司称资产组合在六个国家超过 1.1
              GW；而官网首页和关于页面已把可见运营地图扩展到七个经济体，并加入韩国。Ontario Teachers’ 随后在 2026 年称，PDG 是一个覆盖六个亚洲国家、拥有 21 座数据中心的平台，不到七年建成 1
              GW。即使每个公开口径无法按日期完全对齐，方向已经清楚：PDG 已成为一个具备真实区域规模的大型后期私有数字基础设施平台，但投资人仍需要管理层对国家、设施和容量口径之间的差异作出校准。
