      - number: '7.3'
        title: 国家执行与基础设施依赖
        blocks:
          - type: paragraph
            body: >-
              PDG
              的执行风险高度因国而异。韩国和东京很好地展示了这个模式：两者都具备战略吸引力，也都受制于让数字基础设施在当地有价值的同一批因素。韩国叠加土地稀缺、电网限制和许可复杂度；东京则因核心区域面临电力和土地约束，把扩张推向埼玉等次级节点。印度尼西亚呈现另一种模式：园区集群可借共享电力和连接基础设施提高韧性，但也加深了对本地基础设施生态的依赖。可再生能源采购则是另一把双刃剑。它可以降低碳暴露、改善客户匹配，却也带来对交易对手、数据系统和能源核算流程的依赖，而这些流程必须长期可靠运行。在这个行业里，执行风险无法与公用事业、土地和伙伴风险分开。韩国也仍比
              PDG 一些核心市场更早期，这意味着市场进入执行本身就成为风险画像的一部分。
