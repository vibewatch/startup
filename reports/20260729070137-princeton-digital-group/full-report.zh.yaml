      - number: '6.3'
        title: 地理分布与增长走廊
        blocks:
          - type: paragraph
            body: >-
              PDG 的客户组合按市场呈现不同面貌。新加坡强调企业邻近性、金融服务生态接入和直接云连接。印度、日本、柔佛和韩国更直接围绕超大规模客户、AI 和大型科技公司需求展开。印度尼西亚稍微更宽，公开材料提到 JC2
              面向云、内容、商业、AI、金融科技和企业客户。SG+ 策略表明，客户不会一直锁在土地受限的新加坡；工作负载扩张后，客户预期会向柔佛和巴淡放大。印度作为增长走廊的重要性正在上升，因为 PDG
              称当地新容量支持其全球客户，外部评论也清楚说明，投资逻辑取决于超大规模客户继续扩展本地云区域。这种由地理牵引的组合，是 PDG
              最大优势之一；但也意味着少数几个国家的时点风险，会实质影响客户结果。韩国延续同一模式，公司和分发新闻稿都强调区域云和 AI 客户，而非本土零售需求。独立电信行业对 JC2
              的报道也指向同一方向，适度提高了我们对印度尼西亚确实拥有更广企业和平台组合的信心，而不是只重复 PDG 在其他市场更纯粹的超大规模叙事。
