  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 PDG 的位置
        blocks:
          - type: paragraph
            body: >-
              PDG 的市场应界定为面向亚太超大规模客户、云平台和 AI 工作负载的大规模数字基础设施，而不是单纯零售托管。公司自身材料反复强调超大规模客户、云客户、AI 就绪园区，以及跨多个国家的区域执行。这把 PDG
              放进批发型和超大规模细分市场：客户需要大块电力、快速上市，以及多国部署支持。公开市场研究也强化了这个框架。CBRE、JLL、Cushman & Wakefield 和 Deloitte
              都把亚太数据中心需求描述为由超大规模云扩张、AI 基础设施需求和重电力大型园区开发驱动。实际市场边界因此包括批发型数据中心容量、超大规模客户自建替代方案，以及具备 AI
              能力的托管供给，同时排除较小的企业机房支出和无关电信服务。这个边界很重要，因为 PDG 的价值主张不只是卖机柜；它是在全球云和 AI 租户需要规模的具体亚太市场里，拼土地、电力、许可、融资和跨境执行。
