      - number: '6.2'
        title: 合约逻辑与客户流程
        blocks:
          - type: paragraph
            body: >-
              客户流程看起来周期长、由电力牵引，并围绕扩张设计。Ontario Teachers’ 称，PDG 客户签署长期合同，并依赖公司承载关键任务应用；这与批发型基础设施承诺一致，而不是短期零售托管交易。Yahoo 在把
              SG3 资产出售给 PDG 后仍继续托管在那里，展示了一条获客路径：PDG 可以靠收购同时增加容量和锚定客户。Console Connect 展示了另一条路径：在新加坡，客户把 PDG
              场址用作云邻近基础设施，并借门户或 API 配置网络链路。Mindspace
              披露则暗示了印度的第三种模式，即围绕预期租户需求扩建多楼宇定制园区。这些例子反复说明，客户先预留战略容量，需求增长后再跨楼宇、走廊或市场扩张。SG+
              公告也清楚表明，走廊扩张是客户路线图中的设计项，不是机会主义补丁。
