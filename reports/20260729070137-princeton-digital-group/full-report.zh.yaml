      - number: '4.2'
        title: 资本结构与扩张资金
        blocks:
          - type: paragraph
            body: >-
              PDG 公开财务画像中最强的一块，是能够接触大规模扩张资本。2025 年 5 月，公司宣布超过 USD 1.2 billion 融资，其中 USD 800 million 为项目融资，USD 400
              million 为主要全球银行提供的控股公司贷款。两个月后，公司宣布 Stonepeak 投资 USD 1.3 billion 优先股权，使 2025 年披露募集资本达到 USD 2.5 billion。2026
              年，PDG 又单独宣布为印度尼西亚 120 MW JC3 园区获得约 USD 856 million
              融资，包括一笔已全额包销的银团贷款和一笔推进中的增额融资档。这些交易说明资本结构是分层的：资方股权、优先股权、控股公司债务，以及项目层或园区层融资，且常带绿色金融标签。快速增长的私有基础设施平台理应这样扩张。但这也意味着，扩张仍依赖融资。公司持续募资，是因为建设计划同时横跨日本、印度、马来西亚和印度尼西亚多个十亿美元级园区。
