      - number: '4.3'
        title: 单位经济代理指标与公开可比公司
        blocks:
          - type: paragraph
            body: >-
              公开代理指标显示，PDG 应按基础设施型运营商来评估；但同一批指标也凸显，PDG 自身经济性有多不透明。公司披露园区资本开支和容量远比披露收入或利润率积极：TY1 被呈现为 USD 1 billion、96 MW
              园区；JH1 为 USD 1.5 billion、150-plus MW 园区；JC3 为 USD 1 billion、120 MW
              项目。这些数据点足以说明，这是一门资本密集、资产很重的生意，土地、电力、融资和投产时间都会实质影响财务结果。公开上市同业也强化了这个框架。Equinix、Digital Realty 和 GDS
              都有大市值和经常性收入，也都有定期披露入口。相比之下，PDG 仍是私有且不透明。这个比较不能证明 PDG 能赚到同业级利润率，但能说明正确分析口径：公司是带杠杆的基础设施增长平台，不是低资本开支软件公司。
