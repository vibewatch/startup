      - number: '6.4'
        title: 客户质量、风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              PDG 客户基础的上行空间很清楚：大买方、长合同、关键任务工作负载，以及多国生命周期价值的可能性。下行面在于，围绕全球最大云和科技公司构建的组合几乎必然集中。WebHosting.Today
              的反向框架把这一点说得很直接：印度数十亿美元容量取决于超大规模客户的时点。公开证据还显示，具名客户证明常由伙伴、投资人或收购间接传导，而不是来自 PDG
              直接展示的客户标识和披露。可再生能源协议、小时级无碳匹配等可持续性功能之所以重要，是因为这些客户越来越在意可审计的低碳基础设施。不过，没有公开来源披露 PDG
              的租户集中度、已占用兆瓦、净扩张或续约行为。这是核心未解尽调问题。印度尼西亚历史新闻稿显示，多年来公司一直以首选伙伴自居，这提高了匹配度信心，但不能证明多元化。
