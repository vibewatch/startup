      - number: '8.3'
        title: 情景推演、溢价与折价
        blocks:
          - type: paragraph
            body: >-
              PDG 同时有可信的溢价理由和折价理由。溢价逻辑建立在稀缺性上：APAC AI
              就绪容量有价值，公司已有主要资方支持，并已证明自己能在多个高增长市场建设的同时募集大额债务和股权。折价逻辑同样真实：私有公司不透明度高，业务开发权重重，客户基础很可能集中，印度现在承载了过大的增长叙事。关于印度的公开文章清楚说明，超大规模客户吸纳时点会实质改写结果。因此，认真给出区间比给出单点估值更诚实。牛市情景下，如果
              AI
              稀缺和执行继续互相强化，估值可向全球龙头一侧靠近。熊市情景下，如果出租时点或融资条款不如头条暗示的有利，估值应向区域可比公司水平靠近。基准情景则应落在两端之间。与其假装一个倍数能干净解决估值问题，区间框架更忠实于证据。
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
