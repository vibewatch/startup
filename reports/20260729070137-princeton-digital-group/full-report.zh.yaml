  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与真正公开的信息
        blocks:
          - type: paragraph
            body: >-
              即便 PDG 不公布损益表，其收入模式在高层面仍可读。官方新闻稿和投资伙伴评论中，公司始终把自己描述为面向超大规模客户和大型企业的大规模数据中心容量开发商与运营商。Ontario Teachers'
              补充了两条重要财务线索：买方群体包括世界上一些最大的云公司，这些客户会为关键任务应用签署长期合同。这让 PDG
              更接近批发型数字基础设施，而不是交易型托管或软件收入。经济引擎很可能由长期容量承诺、分期园区交付、能源和连接成本转嫁，以及多楼宇场址内扩张共同构成。缺失的正是信贷或股权投资团队仍需要的内容：每 MW
              实现价格、平均期限、续约率、利用率、租户集中度，以及经常性租金经济性与一次性建设或装配收入之间的拆分。公开记录支撑变现机制，但不足以证明这些收益的实际质量。
