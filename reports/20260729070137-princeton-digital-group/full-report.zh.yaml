      - number: '2.2'
        title: 规模测算口径与地域分散
        blocks:
          - type: paragraph
            body: >-
              已复核的市场报告都指向很大的增长预期，但口径各不相同，不能压成一个醒目的 TAM 数字。JLL 2026 年 3 月展望称，亚太预计到 2027 年交付 4.8 GW 新供给，其中 78% 已预租；2025 至
              2030 年更长期的区域扩张可能增加 24 GW 容量，并在设备装配前创造 US$286 billion 房地产价值。CBRE 同样把 APAC 描述为处于前所未有的繁荣期，2025 年直接投资达到创纪录的
              US$11.6 billion，平均新建项目超过 100 MW。Cushman 的 2026 年上半年更新称，区域开发管线达到 26,455 MW，其中 4,764 MW 在建、21,691 MW
              规划中。Deloitte 口径更宽，认为到 2030 年亚太数据中心投资大约可达 US$800 billion。这些数字不能互换，但方向一致：需求足以支撑 PDG
              这样的多国平台，地域分散也在把增长推向东南亚、印度和其他电力可得地区，而不是只停留在传统核心枢纽。
