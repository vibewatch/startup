            body: >-
              公开记录能把具体园区、电力来源、冷却配置和运营里程碑串起来的地方，PDG 的技术成熟度看起来最高。今天最符合这一标准的是 TY1、MU1 和
              JH1。其他场址有潜力但透明度较低，尤其是只公开容量和场址计划的项目。关键依赖并不隐蔽：公用事业、可再生能源供应商、电网接入、连接伙伴、承包商、认证机构和本地监管批准，都在关键路径上。租用 ESR
              场址进入韩国，说明 PDG
              能调整部署模式；但这也凸显，公司有时依赖第三方房地产基础设施，而不是完全控制每一层。整体看，技术故事可信且佐证越来越多，但公开尽调仍缺全组合正常运行时间数据、冗余披露、事故历史和逐资产绩效基准。缺失的遥测尤其重要，因为
              AI 机架把热、电和维护复杂度抬高的速度，快于普通托管叙事所暗示的水平。
