      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              公司仍由创始人强力主导。PDG 关于页面的路线图称，业务由 Rangu Salgame 和 Varoon Raghavan 于 2017 年与 Warburg Pincus 共同创立，同一页面也把 Salgame
              列为董事长、首席执行官兼联合创始人。Ontario Teachers’ 独立强化了核心起源叙事，称 Salgame 识别出超大规模客户需要泛亚洲平台，并在 2017 年共同创立
              PDG。公开领导层证据指向运营色彩很重的班底，而不是金融壳结构：PDG 称其领导团队覆盖数字基础设施、可再生能源、房地产和本地运营专长，公司还在 2024 年任命 Niall Hannigan
              为集团首席财务官。资方治理也清晰可见。2025 年 7 月 Stonepeak 公告称，Stonepeak 投资后 Warburg Pincus 仍将是 PDG 最大股东；关于页面的领导层板块也把 Warburg
              Pincus、Ontario Teachers’ 和 Stonepeak
              的投资方人物与管理层并列展示。这个组合意味着资方治理已经专业化，但公开来源仍未披露投票权、董事会委员会、持股比例，或近期融资所附优先权结构的具体细节。
