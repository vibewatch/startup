      - number: '1.4'
        title: 反向信号与待补投资测算缺口
        blocks:
          - type: paragraph
            body: >-
              同一组公开记录让 PDG 看起来规模已成、融资充分，也暴露出有意义的投资测算缺口。官网和已复核新闻稿都没有披露收入、ARR、EBITDA、毛利率、客户集中度或当前员工数。即便公司规模口径也会随时间和语境变化：一份
              2022 年官方新闻稿写的是五个国家、20 座数据中心、600+ MW 已锁容量；2025 年 7 月 Stonepeak 新闻稿写的是六个国家 1.1+
              GW；官网现在强调七个经济体。这些差异可以用扩张和披露时点解释，但尽调中仍需要管理层对齐。客户证明也偏宽泛，而不是具体到账户。Ontario Teachers’ 称 PDG
              服务世界上一些最大的云公司，WebHosting.Today 则把 PDG 描述为服务全球超大规模客户的批发型基础设施运营商，但官方材料中具名客户级租赁证据仍然稀少。可持续性证明强于财务证明：PDG 和
              Flexidao 描述了孟买的小时级无碳能源匹配，ESG 页面和报告则指向 Scope 1 和 2 排放到 2030 年实现净零的目标。结论是，公司看起来战略重要且有资本托底，但仅凭公开信息仍无法完整测算。
