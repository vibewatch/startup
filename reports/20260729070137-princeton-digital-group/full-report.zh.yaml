      - number: '8.2'
        title: 公开可比公司与正确估值口径
        blocks:
          - type: paragraph
            body: >-
              正确的公开可比公司是基础设施运营商，不是软件公司。Equinix 和 Digital Realty
              是显然的上限参考，因为它们是全球化、具投资级特征的数字基础设施平台，披露深、收入达数十亿美元，也有公开申报历史。GDS 对 PDG 来说是更相关的区域或超大规模风格参考，因为它更接近 APAC
              增长和资本密集动态，尽管中国集中度让它作为代理指标噪音较大。公开市场数据表明，这些公司在规模和倍数上差距巨大。Equinix 和 Digital Realty 市值以数百亿美元计，P/S 和 P/E 指标也远高于
              GDS。这个差距很重要。它说明高信任、深披露和全球耐久性可以获得什么定价，也说明当地理、治理或投资人信心不受青睐时，估值会多快压缩。PDG
              大概率落在这条宽区间内部，而不是任一极端。换句话说，可比组不是一条平滑直线，更像一个顶部区间和一个较低的区域区间；这正是 PDG 应在区间内三角定位的原因。
