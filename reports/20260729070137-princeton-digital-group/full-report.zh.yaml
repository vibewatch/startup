      nodes:
        - label: 外层 TAM：APAC 数字基础设施和数据中心投资
          detail: Deloitte 给出的口径是，到 2030 年区域数据中心投资约 US$800B。
          tone: positive
        - label: 供给增长层：APAC 容量扩张
          detail: JLL 和 Cushman 描述的 APAC 管线到 2027-2030 年将增长数 GW。
          tone: positive
        - label: 投资层：数据中心直接交易和平台投资
          detail: CBRE 报告 2025 年 APAC 直接投资额创纪录。
          tone: positive
        - label: PDG SAM：选定 APAC 市场的超大规模云厂商 / AI 就绪园区需求
          detail: PDG 聚焦主要云、AI 和超大规模买方，前提是所在市场能锁定电力和土地。
          tone: neutral
        - label: PDG SOM：可落地的多国园区
          detail: 真正变现取决于能否把需求转成获批、通电、融到资的园区。
          tone: neutral
