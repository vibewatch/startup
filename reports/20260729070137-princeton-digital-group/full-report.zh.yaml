      - number: '1.3'
        title: 融资历史、资本形成与区域建设
        blocks:
          - type: paragraph
            body: >-
              资本形成是公开记录中最清楚的部分之一。PDG 2022 年 2 月的股权公告称，Mubadala 作为领投方投资 $350 million，轮次规模超过 $500 million，Warburg Pincus 和
              Ontario Teachers’ 也参与。2025 年 5 月，公司称完成超过 $1.2 billion 融资，其中 $800 million 为孟买、廊坊和东京项目融资，$400 million 为
              Barclays、BNP Paribas 和 Deutsche Bank 提供的控股公司贷款。两个月后，PDG 宣布 Stonepeak 投资 $1.3 billion 优先股权，使 2025
              年债务和股权披露募集资本合计达到 $2.5 billion，并让 Warburg Pincus 继续保持最大股东地位。运营建设叙事与融资故事相匹配。PDG 官方披露和配套报道描述了大东京 $1 billion 的
              TY1 园区、$700 million 的韩国进入项目、120 MW 的雅加达 JC3 园区、印度新增 210 MW 组合容量并指向 1 GW
              国家目标，以及亚洲范围内更广的获电土地收购计划。这些披露意味着，公司在以基础设施规模同时融资有机园区开发和土地储备，而不是追逐小幅渐进扩张。
