      - number: '8.4'
        title: 估值结论与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据给出的估值结论很清楚：PDG 是一项战略性基础设施资产，估值画像更接近公允到偏紧， 而不是明显便宜的私募市场捡漏。公司看起来足够有价值，值得全球基础设施资本认真投入； Bloomberg 关联估算约
              USD 4 billion，可以作为量级参考。但公开信息缺口仍然太大， 还不能有把握地说这个数字就是公允价值。投资人拿不到 EBITDA、已占用 MW、租约条款、 客户集中度、杠杆，或 Stonepeak
              优先权益工具的经济条款。这些缺口在 PDG 身上比普通 创业公司更要紧，因为估值依据不只来自增长可选性，也来自资产质量和下行保护。数据室补齐 这些问题之前，审慎判断应是：PDG
              是真实的独角兽级以上平台，上行空间可观，但还不能称为 定价透明偏低的机会。
