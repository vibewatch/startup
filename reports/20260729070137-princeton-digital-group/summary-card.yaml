  topStrengths:
    - >-
      PDG has assembled a rare pan-APAC hyperscale footprint with meaningful presence in Singapore, Japan, India,
      Indonesia, China, Malaysia, and South Korea.
    - >-
      Sponsor support is unusually deep for a private infrastructure company, with Warburg Pincus, Ontario Teachers',
      Mubadala, and Stonepeak all visible in the capital stack.
    - >-
      Fresh 2025 debt and preferred-equity raises show lenders and investors still want exposure to AI-linked APAC
      data-center capacity.
    - India, Johor-Batam-Singapore, and Japan provide multiple growth corridors rather than a single-market thesis.
  topRisks:
    - >-
      Public evidence still does not disclose revenue, EBITDA, occupancy, lease pricing, customer concentration, or
      normalized cash-flow quality.
    - >-
      The economics of Stonepeak's preferred equity and the broader preference stack are undisclosed, so the headline
      valuation may overstate common-equity value.
    - >-
      PDG's buildout depends on power availability, permits, contractors, and cross-border execution across several
      regulated APAC markets.
    - >-
      India appears increasingly central to portfolio value, which raises concentration risk if local demand, financing,
      or delivery timing slips.
    - >-
      Global and regional competition from Equinix, Digital Realty, GDS, NTT, STT GDC, DayOne, and others can compress
      yields or slow leasing.
  unresolvedGaps:
    - Current revenue, EBITDA, occupancy, and utilization by campus or country
    - Customer concentration, contract tenor, renewal rates, and named tenant economics
    - >-
      Full cap table, liquidation preferences, board rights, and coupon or conversion terms on Stonepeak's preferred
      equity
    - Net leverage, debt covenants, project-finance recourse structure, and cash-flow waterfall details
    - Asset-level PUE, uptime, incident history, and operating benchmarks across the broader portfolio
