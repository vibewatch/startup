    title: Country execution risk table
    columns:
      - Country / market
      - Main execution risk
      - Evidence
      - Implication
    rows:
      - - Singapore
        - Policy, sustainability, and capacity rationing
        - DIA direction plus data-centre call for application
        - Growth may be gated by compliance and scarce new capacity
      - - Japan / Tokyo
        - Land and power constraints in core nodes
        - TY1 rationale around Saitama
        - Secondary-node strategy can help but adds execution complexity
      - - South Korea
