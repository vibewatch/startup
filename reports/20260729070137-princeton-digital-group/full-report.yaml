      - number: '4.2'
        title: Capital stack and expansion funding
        blocks:
          - type: paragraph
            body: >-
              The strongest part of PDG's public financial profile is access to large pools of expansion capital. In May
              2025 the company announced more than USD 1.2 billion of financing, split between USD 800 million of
              project financing and a USD 400 million holdco loan from major global banks. Two months later it announced
              USD 1.3 billion of preferred equity from Stonepeak, taking disclosed 2025 capital raised to USD 2.5
              billion. In 2026 PDG separately announced about USD 856 million of financing for its 120 MW JC3 campus in
              Indonesia, including a fully underwritten syndicated facility and an accordion tranche in progress. These
              transactions suggest a layered capital stack: sponsor equity, preferred equity, holdco debt, and
              project-level or campus-level financing, often with green-finance labeling. That is exactly how one would
              expect a fast-growing private infrastructure platform to scale. It also means expansion remains financing
              dependent. The company keeps raising capital because its build plan spans multiple billion-dollar campuses
              across Japan, India, Malaysia, and Indonesia at the same time.
