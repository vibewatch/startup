      - number: '7.3'
        title: Country execution and infrastructure dependencies
        blocks:
          - type: paragraph
            body: >-
              PDG’s execution risk is highly country-specific. South Korea and Tokyo illustrate the pattern well: both
              are strategically attractive, and both are constrained by the very factors that make digital
              infrastructure valuable there. Korea adds land scarcity, grid limits, and permitting complexity, while
              Tokyo pushes expansion into secondary nodes such as Saitama because core areas face power and land
              constraints. Indonesia introduces a different pattern: clustering campuses can improve resilience through
              shared power and connectivity infrastructure, but it also deepens dependence on local infrastructure
              ecosystems. Renewable-energy sourcing offers another double-edged risk. It can reduce carbon exposure and
              improve customer alignment, yet it also creates reliance on counterparties, data systems, and energy
              accounting processes that must work reliably over long periods. In this industry, execution risk is
              inseparable from utility, land, and partner risk. Korea also remains earlier in maturity than some of
              PDG's core markets, which means market-entry execution itself becomes part of the risk profile.
