            body: >-
              Public proxies imply that PDG should be evaluated against infrastructure-style operators, but those same
              proxies highlight how little of PDG's own economics are visible. The company discloses campus capex and
              capacity much more readily than revenue or margins: TY1 is presented as a USD 1 billion, 96 MW campus; JH1
              as a USD 1.5 billion, 150-plus MW campus; and JC3 as a USD 1 billion, 120 MW project. Those data points
              are enough to show that this is a capital-intensive, asset-heavy business where land, power, financing,
              and time to service all matter financially. Public listed peers reinforce that framing. Equinix, Digital
              Realty, and GDS all have large market values and recurring revenues, and all maintain regular filing
              portals. By contrast, PDG remains private and opaque. The comparison does not prove that PDG earns
              peer-like margins, but it does show the correct analytical lens: this is a leveraged infrastructure growth
