  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what is actually public
        blocks:
          - type: paragraph
            body: >-
              PDG's revenue model is legible at a high level even though the company does not publish an income
              statement. Across official releases and investor-partner commentary, the company consistently describes
              itself as a developer and operator of large-scale data-center capacity for hyperscalers and major
              enterprises. Ontario Teachers' adds two important financial clues: the buyer base includes some of the
              world's biggest cloud companies, and those customers sign long-term contracts for mission-critical
              applications. That makes PDG look much closer to wholesale digital infrastructure than to transactional
              colocation or software revenue. The economic engine is therefore likely a mix of long-duration capacity
              commitments, phased campus delivery, energy and connectivity pass-through, and expansion within
              multi-building sites. What is missing is exactly what credit or equity underwriters would still need:
              realized price per MW, average term, renewal rates, utilization, tenant concentration, and the split
              between recurring rental economics and non-recurring construction or fit-out revenues. The public record
              supports the mechanics of monetization, but not the realized quality of those earnings.
