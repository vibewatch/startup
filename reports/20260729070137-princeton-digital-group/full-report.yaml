              reporting, business continuity, and top-level accountability are not optional. CNA’s reporting on
              advanced-persistent-threat notification rules and the IMDA guidance summarized by legal advisers both
              point toward a future in which boards and executive teams are expected to understand infrastructure
              resilience in operational detail. PDG’s own privacy policy, terms, supplier code, sustainability
