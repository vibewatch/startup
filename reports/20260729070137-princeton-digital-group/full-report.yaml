      - number: '3.4'
        title: Moat durability and adverse competitive read
        blocks:
          - type: paragraph
            body: >-
              The adverse competitive read is that many of PDG’s differentiation points are real but not unassailable.
              Pan-Asia coverage, hyperscale focus, and AI-ready messaging are valuable, but none are unique. Multiple
              APAC operators are now pitching AI-ready, sustainable, large-campus capacity. Public incumbents also enjoy
              currency, reputation, and financing advantages that can matter when debt costs rise or customers want the
              safest counterparty. In China, domestic specialists can out-localize foreign-backed platforms. In
              Southeast Asia and India, the rush of new land banking and powered-site acquisitions raises the risk that
              what looks scarce today could become more contested tomorrow. On the other hand, PDG’s multi-country
              footprint, sponsor backing, and demonstrated ability to finance and deliver campuses still create a real
              moat if management can keep securing power and converting demand into live capacity faster than peers. The
              most useful underwriting posture is therefore not to assume PDG has an impregnable competitive position,
              but to track whether its speed of land, power, financing, and delivery continues to offset the scale and
              balance-sheet advantages of larger or more entrenched rivals.
