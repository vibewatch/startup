      - - India concentration
        - India is becoming a very large share of the portfolio story
        - High
        - Management frames India as a strategic growth engine with secured power and approvals
      - - PE-backed growth pressure
        - Sponsors and new investors may want rapid scaling and visible momentum
        - Medium-High
        - Deep-pocketed investors can also be stabilizing partners
      - - Refinancing dependence
        - Asset-heavy growth still needs debt and equity access
        - Medium-High
        - Recent large financings show access remains open for now
      - - Opaque downside resilience
        - No public cash, covenant, or occupancy disclosures
        - High
        - None beyond general partner confidence and track record
    notes: The core platform risk is execution under high capital intensity, not a lack of strategic ambition.
