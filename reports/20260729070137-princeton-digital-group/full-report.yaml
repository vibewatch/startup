      - number: '8.2'
        title: Public comps and the right valuation lens
        blocks:
          - type: paragraph
            body: >-
              The right public comparables are infrastructure operators, not software companies. Equinix and Digital
              Realty are the obvious upper-bound reference points because they are global, investment-grade-style
              digital-infrastructure platforms with deep disclosure, multibillion-dollar revenues, and public filing
              histories. GDS is the more relevant regional or hyperscale-style reference for PDG because it is closer to
              APAC growth and capital-intensity dynamics, though its China concentration makes it a noisy proxy. Public
              market data shows a dramatic spread between those businesses on both size and multiples. Equinix and
              Digital Realty are measured in tens of billions of market capitalization and trade on much higher P/S and
              P/E metrics than GDS. That spread matters. It shows what high trust, deep disclosure, and global
              durability can command, while also showing how quickly valuation compresses when geography, governance, or
              investor confidence are less favored. PDG likely belongs somewhere inside that wide band rather than at
              either extreme. In other words, the comp set is not a smooth line; it is more like a top band and a lower
              regional band, which is exactly why PDG should be triangulated inside a range.
            claimRefs:
              - CV008
              - CV009
