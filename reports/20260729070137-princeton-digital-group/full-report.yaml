chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and current stage
        blocks:
          - type: paragraph
            body: >-
              Princeton Digital Group presents itself as a pan-Asia developer and operator of AI-ready hyperscale
              data-center infrastructure rather than as a retail colocation brand or a software business. Its current
              corporate surfaces say it develops and operates data centers across Singapore, Japan, India, Indonesia,
              China, Malaysia, and South Korea, serving global hyperscalers, cloud operators, enterprises, and related
              digital-infrastructure demand. The official footprint narrative also shows how fast the company has
              scaled. In 2022, PDG described itself as a five-country, 20-data-center platform with more than 600 MW of
              secured capacity. By July 2025, the company said its portfolio exceeded 1.1 gigawatts across six
              countries, while the homepage and about page had already expanded the visible operating map to seven
              economies with South Korea added. Ontario Teachers’ then described PDG in 2026 as a 21-data-center
              platform in six Asian countries that had built 1 gigawatt in less than seven years. The directional
              message is clear even if every public counter does not line up perfectly by date: PDG has become a large,
              late-private digital-infrastructure platform with real regional scale, but investors still need management
              to reconcile the country, facility, and capacity counts across disclosures.
