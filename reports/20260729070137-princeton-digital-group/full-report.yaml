  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and PDG’s place in it
        blocks:
          - type: paragraph
            body: >-
              PDG’s market should be defined as large-scale digital infrastructure for hyperscalers, cloud platforms,
              and AI workloads across Asia Pacific, not as retail colocation alone. The company’s own materials
              consistently emphasize hyperscalers, cloud customers, AI-ready campuses, and regional execution across
              multiple countries. That places PDG in the wholesale and hyperscale segment where customers need large
              blocks of power, fast time-to-market, and multi-country deployment support. Public market research
              reinforces this framing. CBRE, JLL, Cushman & Wakefield, and Deloitte all describe Asia Pacific
              data-centre demand as being led by hyperscaler cloud expansion, AI infrastructure demand, and power-heavy
              large-campus development. The practical market boundary therefore includes wholesale data-centre capacity,
              hyperscale self-build alternatives, and related AI-capable colocation supply, while excluding smaller
              enterprise server-room spending and unrelated telecom services. This boundary matters because PDG’s value
              proposition is not simply selling cabinets; it is assembling land, power, permitting, financing, and
              cross-border execution in the specific APAC markets where global cloud and AI tenants need scale.
            claimRefs:
