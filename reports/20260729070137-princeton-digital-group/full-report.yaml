  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      PDG's product stack layers physical campus assets, power systems, cooling systems, connectivity, and customer
      controls into one infrastructure offer.
    data:
      layers:
        - label: Customer outcomes
          detail: Cloud expansion, AI deployment, and resilience use cases are the commercial outcome of the stack.
