      - number: '2.3'
        title: Buyers, demand drivers, and the adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary buyers in PDG’s market are hyperscalers, major cloud platforms, neocloud or
              high-performance-compute providers, and very large enterprises that depend on those platforms. JLL says
              increasing hyperscale commitments are fueling a multiyear growth cycle, while CBRE says AI implementation,
              cloud adoption, and digitalisation are the dominant demand drivers. Cushman adds that power-constrained
              execution and competition for future capacity are now central to location strategy, and Deloitte argues
              that energy planning has effectively become a first-order market variable. PDG’s own positioning fits this
              pattern closely. The company says it tailors infrastructure to the world’s largest cloud and AI companies,
              and Ontario Teachers’ says PDG serves some of the world’s biggest cloud companies. The adoption path in
              this market is therefore not a light-touch software sale; it runs from tenant demand forecasting, land and
              power reservation, and financing decisions to campus buildout and long-term capacity commitments. Markets
              like Tokyo, Mumbai, Johor, Jakarta, and the Singapore-Johor-Batam corridor matter because they combine
              demand depth with the potential to secure enough power and developable land.
