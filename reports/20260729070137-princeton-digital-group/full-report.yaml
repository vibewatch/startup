        every local rule in every market.
  - id: TR002
    title: Ownership / financial / customer risk table
    columns:
      - Risk
      - Why it matters
      - Severity
      - Public counter-signal
    rows:
      - - Hyperscaler timing risk
        - Large projects are built ahead of or alongside expected customer demand
        - High
