      - number: '1.3'
        title: Funding history, capital formation, and regional buildout
        blocks:
          - type: paragraph
            body: >-
              Capital formation is one of the clearest parts of the public record. PDG’s February 2022 equity
              announcement says Mubadala invested $350 million as lead investor in a round exceeding half a billion
              dollars, with Warburg Pincus and Ontario Teachers’ also participating. In May 2025 the company said it
              raised more than $1.2 billion in financing, split between $800 million of project financing for Mumbai,
              Langfang, and Tokyo and a $400 million holdco loan from Barclays, BNP Paribas, and Deutsche Bank. Two
              months later, PDG announced a $1.3 billion preferred-equity investment from Stonepeak, taking total 2025
              capital raised to $2.5 billion across debt and equity and leaving Warburg Pincus as largest shareholder.
              The operating-buildout narrative matches the financing story. PDG’s official disclosures and related
              coverage describe a $1 billion TY1 campus in Greater Tokyo, a $700 million South Korea entry, a 120 MW
              Jakarta JC3 campus, 210 MW of India portfolio additions toward a 1 GW country target, and a broader
              powered-land acquisition program across Asia. These disclosures imply a company financing both organic
              campus development and land banking at infrastructure scale rather than chasing small incremental
              expansions.
