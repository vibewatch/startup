              source, a cooling configuration, and an operating milestone. TY1, MU1, and JH1 fit that standard best
              today. Other sites are promising but less transparent, particularly where only capacity and site plans are
              public. The key dependencies are not subtle: utilities, renewable-energy suppliers, grid access,
