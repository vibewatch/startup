        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is positive on funding access and negative on transparency. Repeated successful
              raises from blue-chip sponsors, global banks, and Stonepeak suggest that sophisticated capital providers
              believe PDG can keep converting hyperscaler demand into contracted campuses. At the same time, adverse
              public analysis highlights that at least some of the company's strategy rests on demand appearing on
              schedule, particularly in India where billions of dollars are being committed ahead of full public
              evidence of occupancy. That risk is structural, not sensational: if power-secured capacity fills on time,
              PDG's financing strategy looks prescient; if absorption slips, the same strategy amplifies carry costs and
              refinancing dependence. Because public disclosure stops short of revenue, occupancy, leverage, cash-flow
              and margin detail, the prudent conclusion is that PDG looks financeable and strategically well-backed, but
              still cannot be fully underwritten without a proper data room. The missing treasury and lease-book
              disclosures matter more than any one headline raise.
