      - number: '2.4'
        title: Constraints, switching frictions, and open questions
        blocks:
          - type: paragraph
            body: >-
              The most important constraints in PDG’s market are no longer demand-side awareness but supply-side
              execution and regulatory limits. CBRE says power availability is the major challenge for operators, and
              JLL says grid-connection waits can range from 24 months in emerging markets to more than eight years in
              core markets. Cushman says the development pipeline is growing sharply even as vacancy continues to edge
              down, implying that strong absorption has not solved capacity bottlenecks. Deloitte frames the same
              problem more broadly: uncoordinated data-centre expansion risks worsening grid congestion and price
              volatility, so operators increasingly need a power-first growth strategy. PDG’s own regional strategy
              implicitly accepts this constraint set. Its Singapore+ plan shifts the growth frame from land-scarce
              Singapore into Johor and Batam, while its India, Jakarta, Tokyo, and South Korea expansions show that
              demand capture increasingly depends on where power, land, and permitting can still be secured. The
              unresolved market question is not whether cloud and AI demand exist, but how much of that demand can be
              translated into economically attractive, permitted, and sufficiently powered capacity in the specific
              markets where PDG wants to build.
