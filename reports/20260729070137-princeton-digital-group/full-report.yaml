  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Singapore regulatory and power risk
        blocks:
          - type: paragraph
            body: >-
              Singapore is both one of PDG’s most strategic anchor markets and one of its most difficult risk
              environments. Government and legal sources show a clear policy shift: resilience, security, and
              sustainability requirements are moving from voluntary guidance toward a binding licensing regime. The
              emerging Digital Infrastructure Bill would introduce new obligations for major data-centre operators and
              for data centres above low megawatt thresholds, with IMDA considering energy and water efficiency as well
              as energy-source quality. At the same time, the second data-centre call for application demonstrates that
              new capacity is rationed and linked to greener energy pathways, not simply made available whenever demand
              appears. This means PDG’s Singapore-related growth is constrained at least as much by regulatory and
              infrastructure permissions as by customer demand. Operators that cannot prove resilience, continuity, and
              efficiency risk being slowed by policy even in a demand-rich market. Water efficiency and cooling scrutiny
              are also becoming more important as AI workloads push facility intensity higher.
