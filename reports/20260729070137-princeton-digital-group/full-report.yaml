  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What public valuation evidence actually exists
        blocks:
          - type: paragraph
            body: >-
              There are only two direct public valuation clues for PDG. First, the company and Stonepeak disclosed a USD
              1.3 billion preferred-equity investment in July 2025, shortly after PDG had already announced USD 1.2
              billion of debt financing. Second, Mingtiandi reported Bloomberg had earlier discussed a transaction
              potentially valuing PDG at about USD 4 billion. Neither point gives a clean fair-value answer on its own.
              A preferred-equity round can support a very high headline valuation while still embedding terms that
              materially affect common-equity economics, and the Bloomberg-linked figure is best treated as an external
              market estimate rather than as a disclosed board-approved valuation. What the transaction does clearly
              show is that very large infrastructure investors were willing to write nine-figure and even ten-figure
              checks into the platform. That alone is enough to push PDG firmly into unicorn-plus territory.
