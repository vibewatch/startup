  - id: TR004
    title: Governance / legal / cyber table
    columns:
      - Surface
      - What public sources show
      - Risk if weak
      - Gap
    rows:
      - - Privacy governance
        - PDG publishes a privacy policy and Singapore has a strong privacy regulator
        - Data-handling failures could create legal and reputational damage
        - No public audit or incident disclosures
      - - Terms and customer obligations
        - PDG publishes terms of use
        - Unclear how liability or service provisions work in operating contracts
        - Need customer MSA and SLA review
      - - Supplier conduct
        - PDG publishes a supplier code
        - Third-party failures could create safety, labor, or compliance issues
        - Need supplier concentration and audit data
      - - Cyber and incident reporting
        - CNA and Cybersecurity Act show tighter reporting expectations
        - Delayed reporting can increase regulatory and societal consequences
        - Need actual incident-response runbooks and prior history
      - - Business continuity controls
        - IMDA-linked guidance expects BCMS, testing, and recovery planning
        - Poor preparedness turns single events into systemic outages
        - Need evidence of site-level test outcomes
    notes: Public governance surfaces exist, but they are not substitutes for site-level control evidence.
