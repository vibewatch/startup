  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitive classes
        blocks:
          - type: paragraph
            body: >-
              PDG does not compete against a single like-for-like peer set. Its real competitive field spans at least
              four classes: global listed incumbents with broad interconnection and enterprise reach, APAC-focused
              private or sponsor-backed hyperscale specialists, China-heavy domestic platforms, and country-specific
              operators tied to telecom or infrastructure ecosystems. The official PDG positioning, plus the
              ResearchAndMarkets competitive set summarized by Business Wire, places the company firmly inside the
              recognized APAC data-center platform cohort rather than among niche local builders. In practical terms,
              that means PDG is competing for land, power, debt, talent, and anchor hyperscaler commitments against
              firms such as Equinix, Digital Realty, GDS, STT GDC, Keppel DC, AirTrunk, Bridge Data Centres, and
              Chindata. These firms do not all attack the market in the same way. Equinix and Digital Realty bring
              massive public-market scale and broad service portfolios; GDS and Chindata bring China and hyperscale
              specialization; AirTrunk and Bridge emphasize large AI-ready regional campuses; and STT GDC or Keppel
              benefit from local ecosystem depth in Southeast Asia. PDG’s competitive question is therefore whether a
              pan-Asia, sponsor-backed operator can keep winning in markets where bigger public incumbents and
              well-funded regional specialists are targeting the same hyperscale demand.
            claimRefs:
              - CP001
              - CP002
              - CP003
