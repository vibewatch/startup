- id: geographic-distribution-and-growth-corridors
  title: Geographic distribution and growth corridors
  body: PDG’s customer mix looks different by market. Singapore emphasizes enterprise adjacency, financial-services ecosystem access, and direct cloud connectivity. India, Japan, Johor, and South Korea are framed more directly around hyperscaler, AI, and large-technology-company demand. Indonesia looks slightly broader, with public references to cloud, content, commerce, AI, fintech, and enterprise customers at JC2. The SG+ strategy indicates that customers are not expected to stay pinned to land-constrained Singapore; they are expected to scale into Johor and Batam as workloads expand. India looks increasingly central as a growth corridor because PDG says new capacity there supports its global customers and because external commentary makes clear that the thesis depends on hyperscalers continuing to scale local cloud regions. This geography-led mix is one of PDG’s biggest strengths, but it also means timing risk in just a few countries can materially shape customer outcomes. Korea extends
    that same pattern, with both company and distributed newswire coverage emphasizing regional cloud and AI customers rather than domestic retail demand. Independent telecom-sector coverage of JC2 points in the same direction, which modestly improves confidence that Indonesia really does have a broader enterprise-and-platform mix than some of PDG’s more purely hyperscale narratives elsewhere.
