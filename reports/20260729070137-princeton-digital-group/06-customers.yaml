- id: contract-logic-and-customer-workflow
  title: Contract logic and customer workflow
  body: 'The customer workflow appears to be long-cycle, power-led, and expansion-oriented. Ontario Teachers’ says PDG’s customers sign long-term contracts and rely on the company for mission-critical applications, which is consistent with wholesale infrastructure commitments rather than short-term retail hosting deals. Yahoo’s decision to remain hosted at SG3 after selling the asset to PDG shows one path to customer acquisition: PDG can add both capacity and an anchor customer through acquisitions. Console Connect shows another: in Singapore, customers use PDG sites as cloud-adjacent infrastructure and provision network links through a portal or API. The Mindspace disclosures suggest a third pattern in India, where multi-building built-to-suit campuses are being expanded around expected tenant demand. Across these examples, the recurring theme is that customers reserve strategic capacity first and then expand across buildings, corridors, or markets as needs grow. The SG+ announcement also
    makes clear that corridor expansion is part of the designed customer roadmap, not an opportunistic afterthought.'
