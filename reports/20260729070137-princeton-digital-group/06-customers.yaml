- id: TU003
  title: Contract / workflow table
  columns:
  - Stage
  - Who acts
  - What happens
  - Why it matters
  rows:
  - - Capacity planning
    - Hyperscaler / enterprise buyer
    - Identify market, power, and latency requirements
    - Makes geography a central sales variable
  - - Commitment / reservation
    - Buyer and PDG
    - Reserve campus or building capacity under long-term contract logic
    - Switching cost rises before go-live
  - - Delivery / energization
    - PDG and local partners
    - Build, energize, and certify capacity
    - Execution quality becomes customer quality
  - - Connectivity onboarding
    - Buyer and ecosystem partners
    - Add cloud and network links, especially in Singapore
    - Deepens stickiness and operational integration
  - - Expansion / renewal
    - Buyer and PDG
    - Add buildings, campuses, or adjacent countries as demand grows
    - Drives lifetime value and concentration simultaneously
  notes: Public sources indicate a long-cycle workflow centered on power, delivery, and later expansion rather than fast self-serve sales.
