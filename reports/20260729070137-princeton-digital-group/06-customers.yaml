chapter:
  number: 6
  title: Customers
  summary: Public evidence points to PDG serving a concentrated, high-value customer base centered on hyperscalers, cloud platforms, and large technology or enterprise users that need scalable APAC infrastructure. The fit looks strong, but named-customer disclosure remains sparse enough that concentration and renewal risk still require direct diligence.
sections:
- id: customer-segments-and-what-is-publicly-named
  title: Customer segments and what is publicly named
  body: The public customer picture is directional rather than exhaustive, but it is still clear. PDG consistently frames its buyers as hyperscalers, cloud platforms, AI infrastructure users, and large enterprises. Ontario Teachers’ explicitly says the company serves some of the world’s biggest cloud companies, while Dgtl Infra provides the strongest named example set by listing Amazon, Alibaba, Pinduoduo, Lazada, Microsoft Azure, Google Cloud, Alibaba Cloud, IBM Cloud, and Meta as representative customers or customer types. In Singapore, Console Connect adds a different kind of proof by showing that PDG customers want direct access to leading clouds via programmable connectivity. The result is a customer base that looks far more like a wholesale digital-infrastructure portfolio than a diversified long-tail colocation roster. What remains missing is a verified tenant-by-tenant customer list from PDG itself. Even the oldest retained customer-facing releases already used hyperscaler language,
    suggesting the focus has been stable over time rather than a late AI-era repositioning.
