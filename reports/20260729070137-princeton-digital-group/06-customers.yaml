- id: customer-quality-risks-and-diligence-gaps
  title: Customer quality, risks, and diligence gaps
  body: 'The upside of PDG’s customer base is obvious: big buyers, long contracts, mission-critical workloads, and the possibility of multi-country lifetime value. The downside is that a portfolio built around the world’s largest cloud and technology companies is almost certainly concentrated. WebHosting.Today’s adverse framing makes this explicit by arguing that billions of dollars of India capacity depend on hyperscaler timing. Public evidence also suggests that named customer proof is often mediated through partners, investors, or acquisitions rather than through direct customer logos and disclosures from PDG. Sustainability-linked features such as renewable-power agreements and hourly carbon-free matching appear to matter because those customers increasingly care about auditable low-carbon infrastructure. Still, no public source discloses PDG’s tenant concentration, occupied megawatts, net expansion, or renewal behavior. That is the central unresolved diligence issue. Historical releases
    from Indonesia show that the partner-of-choice framing has been persistent for years, which improves confidence in fit but not in diversification.'
