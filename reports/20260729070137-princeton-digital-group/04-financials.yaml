- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Exact diligence path
  - Current public proxy / limitation
  rows:
  - - Revenue and occupied MW by campus
    - Needed to test valuation, debt capacity, and growth quality
    - Request trailing twelve month revenue, occupied MW, backlog, and revenue by country
    - Capacity growth is disclosed; monetization is not
  - - EBITDA and margin by market
    - Needed to underwrite cash generation and debt service
    - Request country-level EBITDA bridge and gross margin by campus type
    - Listed peers are only rough analogs
  - - Lease-book quality
    - Needed to assess churn, step-ups, and customer concentration
    - Request top-10 tenants, weighted average remaining lease term, and escalators
    - Ontario Teachers confirms long-term contracts but not economics
  - - Cash, debt, and covenant headroom
    - Needed to judge solvency and financing resilience
    - Request full debt schedule, covenants, hedging, and unrestricted cash balance
    - Public raise headlines do not equal liquidity visibility
  - - Development yield and cost overrun controls
    - Needed to test whether growth creates value after cost of capital
    - Request board-approved yield-on-cost, contingency budgets, and procurement assumptions
    - Capex figures alone cannot prove returns
  - - India absorption curve
    - Needed because India is now a very large share of platform ambition
    - Request signed MW, expected move-ins, and downside scenario for delayed cloud expansion
    - Adverse public commentary shows timing risk, not current occupancy facts
  notes: These are the minimum data-room requests required to convert public fundraising evidence into a true underwritten financial case.
  enumerationScope:
    coverage: exhaustive
    basis: Core missing disclosures that prevent full underwriting based on the retained public record.
