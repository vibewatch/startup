tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality read
  - Diligence ask
  rows:
  - - Wholesale hyperscale capacity
    - Long-term lease or capacity commitment at campus / building / hall level
    - MW / phased capacity
    - Mechanism visible; realized pricing undisclosed
    - Potentially high quality if contracted and power-backed
    - Request contract term, rent escalators, take-or-pay and termination provisions
  - - Enterprise / large-customer colocation
    - Carrier-neutral space, power, and facility services in multi-tenant sites such as Singapore
    - kW / cage / hall
    - Publicly mentioned but not financially broken out
    - Likely lower scale than hyperscale campus economics
    - Request revenue share by retail-colo versus wholesale
  - - Connectivity and ecosystem services
    - Cross-connect, cloud access, and partner connectivity layered on top of base capacity
    - Port / connection / service order
    - Commercial logic visible through connectivity partnerships, but no pricing disclosure
    - Could improve stickiness more than headline revenue
    - Request attach rates and ancillary gross margin
  - - Build-to-suit expansion
    - Customer-led expansion into new phases or additional buildings on the same campus
    - MW committed / building delivered
    - Strong evidence of phased development model
    - Economics may be attractive but timing-sensitive
    - Request prelease thresholds and capex-to-commitment gates
  - - Sustainability-linked services / energy structures
    - Renewable procurement, green-finance alignment, and reporting support tied to customer requirements
    - MWh / contract overlay
    - Strategically important but not separately monetized publicly
    - Value may be embedded in win rate rather than direct line item
    - Request whether green-power services are pass-through or margin-bearing
  notes: Public evidence shows how PDG likely makes money, but not enough to quantify stream mix or revenue recognition timing.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI029
- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / contract lens
  - Public pricing posture
  - Public proxy
  - Unknowns
  - Implication
  rows:
  - - Hyperscale campus capacity
    - No public list pricing
    - Long-term contract language from Ontario Teachers and campus-specific financing tied to customer demand
    - Rent per MW, escalators, free-rent, security package
    - Revenue quality may be strong, but realized pricing remains opaque
  - - Singapore enterprise-grade facilities
    - No public rate card
    - Facility descriptions mention whitespace rentals, staging rooms, and cloud adjacency
    - Enterprise versus hyperscale mix, utilization, support attach
    - Could diversify revenue but may not move consolidated economics materially
  - - AI-ready high-density deployments
    - No public premium pricing
    - TY1 140 kW per rack and liquid-cooling readiness indicate premium capability
    - Whether high-density design earns higher contracted yield
    - Potential margin upside if premium capacity is scarce
  - - Cross-connect / cloud access
    - No public tariff
    - Console-connect style ecosystem logic exists in the platform, but monetization is undisclosed
    - Pass-through versus high-margin network services
    - More helpful as retention and stickiness driver than as visible revenue line
  - - Green-energy / low-carbon overlay
    - No public surcharge disclosure
    - Renewable procurement and green loans indicate customer relevance
    - Whether sustainability requirements increase price realization or only capex burden
    - Could support win rates even if not separately billed
  notes: The absence of list or realized pricing is normal for hyperscale data centers, but it limits public underwriting precision.
  claimRefs:
