- id: FI004
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: PDG's public financial profile is strongest on financing access and weakest on recurring disclosure.
  data:
    columns:
    - Capital need
    - Revenue visibility
    - Cash-flow visibility
    - Underwriting confidence
    rows:
    - label: Existing operational campuses
      values:
      - label: high
        tone: neutral
        detail: Campuses are power- and capex-heavy assets.
      - label: medium
        tone: neutral
        detail: Customer type and contract style are visible, pricing is not.
      - label: low
        tone: warning
        detail: No public cash-generation metrics by campus.
      - label: medium
        tone: neutral
        detail: Stable business model, thin financial disclosure.
    - label: New greenfield campuses
      values:
      - label: very high
        tone: warning
        detail: Tokyo, Johor, and Jakarta are all billion-dollar-scale developments.
      - label: low-medium
        tone: warning
        detail: Public demand narrative is strong, signed MW detail is sparse.
      - label: low
        tone: warning
        detail: Construction spend arrives before full public monetization evidence.
      - label: medium-low
        tone: warning
        detail: Execution appears strong; absorption remains a key variable.
    - label: Platform-level financing stack
      values:
      - label: high
        tone: neutral
        detail: Preferred equity, holdco debt, and project debt all matter.
      - label: medium
        tone: neutral
        detail: Fundraising is visible, operating returns are not.
      - label: low
        tone: warning
        detail: Treasury and covenant reporting are absent.
      - label: medium
        tone: neutral
        detail: Blue-chip funders help, but diligence is still incomplete.
    - label: India concentration
      values:
      - label: very high
        tone: warning
        detail: About USD 2.5B committed since 2022.
      - label: medium
        tone: neutral
        detail: Demand thesis is clear around hyperscalers.
      - label: low-medium
        tone: warning
        detail: Timing of absorption remains publicly unproven.
      - label: medium-low
        tone: warning
        detail: A major upside case also creates concentration risk.
  approximationNotes: This matrix uses evidence-backed qualitative scoring because public sources describe funding and project scale more clearly than realized cash conversion.
