  - CI019
  - CI029
  - CI036
- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - TY1 capex density
    - USD 1.0B / 96 MW (~USD 10.4M per MW)
    - medium
    - Shows how capital heavy AI-ready Tokyo buildout can be
    - Request all-in development budget, yield-on-cost, and stabilized EBITDA
  - - JH1 capex density
    - USD 1.5B / 150+ MW (~USD 10M per MW using 150 MW floor)
    - medium
    - Suggests Malaysia campus is similarly capital intensive
    - Request final critical IT capacity denominator and phase-level capex
  - - JC3 capex density
    - USD 1.0B / 120 MW (~USD 8.3M per MW)
    - medium
    - Indicates Indonesia may support lower capex-per-MW than Tokyo or Johor
    - Request build-cost bridge and cost of power infrastructure
  - - Financing mix
    - Preferred equity + holdco debt + project debt + green loans
    - high
    - Capital-structure complexity affects returns and downside risk
    - Request legal-entity map, intercompany guarantees, and covenant package
  - - Revenue visibility
    - Undisclosed
    - high
    - Without revenue and occupancy, valuation and leverage cannot be tested
    - Request TTM revenue, EBITDA, occupied MW, and backlog
  - - Cash-flow visibility
    - Undisclosed
    - high
    - Runway and debt-service resilience cannot be assessed
    - Request cash balance, debt service schedule, and base/downside liquidity model
  notes: The public record is rich enough to estimate capex intensity but not to compute realized returns on invested capital.
