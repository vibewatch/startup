company:
  name: Princeton Digital Group
chapter:
  number: 4
  title: Financials
  summary: PDG's public financial picture is best understood as an infrastructure capital story rather than a disclosed operating P&L story. The record clearly shows repeated success raising large pools of equity and debt for AI-ready campus expansion, but it still leaves core underwriting items such as revenue, occupancy, cash generation, leverage, and margin quality largely undisclosed.
sections:
- id: revenue-model-and-what-publicly-exists
  title: Revenue model and what is actually public
  body: 'PDG''s revenue model is legible at a high level even though the company does not publish an income statement. Across official releases and investor-partner commentary, the company consistently describes itself as a developer and operator of large-scale data-center capacity for hyperscalers and major enterprises. Ontario Teachers'' adds two important financial clues: the buyer base includes some of the world''s biggest cloud companies, and those customers sign long-term contracts for mission-critical applications. That makes PDG look much closer to wholesale digital infrastructure than to transactional colocation or software revenue. The economic engine is therefore likely a mix of long-duration capacity commitments, phased campus delivery, energy and connectivity pass-through, and expansion within multi-building sites. What is missing is exactly what credit or equity underwriters would still need: realized price per MW, average term, renewal rates, utilization, tenant concentration,
    and the split between recurring rental economics and non-recurring construction or fit-out revenues. The public record supports the mechanics of monetization, but not the realized quality of those earnings.'
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI029
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: capital-stack-and-expansion-funding
  title: Capital stack and expansion funding
  body: 'The strongest part of PDG''s public financial profile is access to large pools of expansion capital. In May 2025 the company announced more than USD 1.2 billion of financing, split between USD 800 million of project financing and a USD 400 million holdco loan from major global banks. Two months later it announced USD 1.3 billion of preferred equity from Stonepeak, taking disclosed 2025 capital raised to USD 2.5 billion. In 2026 PDG separately announced about USD 856 million of financing for its 120 MW JC3 campus in Indonesia, including a fully underwritten syndicated facility and an accordion tranche in progress. These transactions suggest a layered capital stack: sponsor equity, preferred equity, holdco debt, and project-level or campus-level financing, often with green-finance labeling. That is exactly how one would expect a fast-growing private infrastructure platform to scale. It also means expansion remains financing dependent. The company keeps raising capital because its
    build plan spans multiple billion-dollar campuses across Japan, India, Malaysia, and Indonesia at the same time.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
