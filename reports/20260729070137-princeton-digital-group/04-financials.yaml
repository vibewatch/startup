- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Disclosed value
  - Why it matters
  - Forward read
  - Diligence ask
  rows:
  - - 2025 debt financing
    - USD 1.2B
    - Funds multiple campuses across Mumbai, Langfang, and Tokyo
    - Strong lender appetite but evidence of continued capital need
    - Request maturity schedule, amortization, pricing, and security package
  - - 2025 Stonepeak preferred equity
    - USD 1.3B
    - Adds patient capital and expands growth firepower
    - Supports M&A and greenfield expansion, but preferred terms matter
    - Request preference stack, coupon / accretion, and governance rights
  - - 2026 JC3 financing
    - ~USD 856M
    - Shows project-level financing remains available
    - Positive sign for lender confidence in Indonesia pipeline
    - Request final accordion close, hedging, and DSCR tests
  - - 2022 Mubadala-led equity round
    - USD 505M
    - Shows earlier platform scale and sponsor support
    - Important historical base, but now small relative to 2025-2026 build plan
    - Request full capitalization table over time
  - - India capital commitment
    - ~USD 2.5B since 2022
    - Illustrates concentration and growth ambition in one market
    - Huge upside if absorbed on time; meaningful timing risk if not
    - Request India leasing status, signed MW, and expected RFS cadence
  - - Treasury runway
    - Not publicly disclosed
    - Core missing variable for downside underwriting
    - This is the single biggest unresolved adequacy gap
    - Request current unrestricted cash, revolver headroom, and 24-month runway model
  notes: Historical chronology is condensed to the capital facts most relevant to present funding adequacy and refinancing dependence.
  enumerationScope:
    coverage: partial
    basis: Includes the public financing items most relevant to current adequacy; excludes undisclosed internal cash and covenant data.
