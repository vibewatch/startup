- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Pan-Asia footprint
    - Large rivals can also build or buy regional scale
    - High
    - Track whether PDG keeps adding powered land and converting campuses faster than peers.
  - - Hyperscale focus
    - Many competitors now market themselves as hyperscale or AI-ready
    - High
    - Demand evidence of actual utilization, customer wins, and campus delivery speed.
  - - Sponsor backing
    - Public incumbents may still enjoy lower capital costs and broader equity currency
    - Medium-High
    - Review debt terms and preference overhang versus public peers’ financing flexibility.
  - - China and Southeast Asia presence
    - Local incumbents and domestic specialists can out-localize PDG in certain markets
    - High
    - Assess market-by-market competitive advantage rather than a single global story.
  - - AI-ready positioning
    - Advanced cooling and AI density are becoming table stakes
    - Medium
    - Verify PDG’s technical readiness and power strategy against competitors’ actual deployments.
  - - Cross-border execution
    - Permitting and power delays can erase first-mover advantage
    - High
    - Track live delivery milestones, power contracts, and backlog conversion by site.
  notes: The competitive moat depends less on branding than on continued access to power, land, financing, and delivery capacity.
