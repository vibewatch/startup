    - AI-ready, hyperscale, multi-country execution
    - Unit pricing, concessions, utilization terms
    - Winning depends on bespoke deal-making not advertised price.
  - - Equinix
    - No simple retail-equivalent for hyperscale from reviewed sources
    - Colocation plus broader ecosystem services
    - Enterprise network, interconnection, global platform
    - Hyperscale discounting and APAC-specific terms
    - Can bundle services that raise switching costs.
  - - Digital Realty
    - No public hyperscale list pricing in reviewed sources
    - Colocation and large-scale data-center services
    - Broad services posture and scale
    - Country-specific capacity economics
    - Pricing power may come from breadth and balance sheet.
  - - GDS
    - No public list pricing in reviewed sources
    - Large customer-specific capacity arrangements
    - Hyperscale and China specialization
    - Contract economics and customer concentration
    - Competitive power rests on local scale and delivery.
  - - AirTrunk / Bridge / STT / Keppel
    - Limited public pricing transparency
    - Bespoke large-campus contracts
    - Hyperscale and cloud enterprise positioning
    - Commercial terms, ramp schedules, power pricing pass-through
    - Market pricing remains opaque and relationship-driven.
