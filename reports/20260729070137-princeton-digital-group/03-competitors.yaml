- id: capability-pricing-and-switching-power
  title: Capability, pricing posture, and switching power
  body: Public pricing transparency is poor across this market, so competitive comparison has to lean on capability signals and business-model cues more than list prices. Equinix and Digital Realty signal broad colocation and data-center services portfolios, which likely help them cross-sell enterprise and interconnection services that PDG does not foreground as heavily. Operators such as AirTrunk, Bridge, and PDG instead emphasize large-scale AI-ready campus delivery, which maps more directly to hyperscaler expansion needs. GDS and Chindata highlight hyperscale specialization in China, where PDG also has a presence but not the same local market concentration. Switching costs in this market are substantial once a customer has reserved or deployed capacity because campuses are power-constrained, lead times are long, and workloads are operationally sticky. That creates some durability once PDG wins an anchor tenant, but it also raises the cost of losing on the first land-and-power reservation
    decision. The business is therefore not just a race for customers; it is a race for scarce capacity options in the right markets at the right time. Competitors with stronger interconnection ecosystems, deeper local utility ties, or lower funding costs can convert that advantage into share gains even without obviously better product marketing.
