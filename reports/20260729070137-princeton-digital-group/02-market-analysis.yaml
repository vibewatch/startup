- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Global hyperscalers
    - Regional infrastructure and capacity-planning teams
    - Cloud-region, network, and operations staff
    - Corporate infrastructure capex / opex budgets
    - Reserve land, power, and phased capacity across multiple markets
    - Central infrastructure leadership
    - Need for fast cloud-region expansion and AI training capacity.
  - - Neocloud / HPC providers
    - Founders, COO, and infrastructure teams
    - GPU cluster operators and platform engineers
    - Venture-backed or corporate infra budgets
    - Secure powered capacity quickly for AI workloads
    - Executive team / infra finance
    - Need for near-term power and liquid-cooling-ready capacity.
  - - Large enterprises near cloud ecosystems
    - CIO / digital transformation leaders
    - IT operations and application owners
    - Corporate IT budgets
    - Shift workloads closer to cloud and resilient third-party infrastructure
    - CIO / CFO
    - Need for reliability, geographic resilience, and faster deployment.
  - - National / regional digital platforms
    - Platform and network leadership
    - Operations teams serving domestic digital demand
    - Corporate or sponsor-backed budgets
    - Add local data-centre capacity in growth markets
    - Executive team
    - Need for local compliance and latency plus cloud adjacency.
  - - PDG itself as developer-operator
    - Investment committee and country managers
    - Land, power, engineering, and delivery teams
    - Equity plus project and holdco debt
    - Acquire land and build AI-ready campuses ahead of demand
    - CEO / CFO / country leads
    - Need to lock scarce power and land before competitors do.
  notes: In this market the technical user is often not the budget owner; adoption is driven by infrastructure planning, power access, and regional cloud strategy.
