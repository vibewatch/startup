- id: sizing-lenses-and-geographic-dispersion
  title: Sizing lenses and geographic dispersion
  body: 'The reviewed market reports point to very large growth expectations, but they do so through different lenses that should not be collapsed into a single headline TAM. JLL’s March 2026 outlook says Asia Pacific is expected to deliver 4.8 GW of new supply by 2027, with 78 percent already preleased, while longer-term regional expansion from 2025 to 2030 could add 24 GW of capacity and US$286 billion of real-estate value creation before equipment fit-out. CBRE likewise describes APAC as being in an unprecedented boom, with direct investment reaching a record US$11.6 billion in 2025 and average new builds exceeding 100 MW. Cushman’s H1 2026 update says the regional development pipeline reached 26,455 MW, including 4,764 MW under construction and 21,691 MW in planning. Deloitte goes even broader, arguing that roughly US$800 billion of data-centre investment could be expected across Asia Pacific by 2030. These figures are not interchangeable, but they all point in the same direction: demand
    is large enough to support multi-country platforms like PDG, and geographic dispersion is shifting growth toward Southeast Asia, India, and other power-available locations rather than remaining concentrated only in legacy core hubs.'
