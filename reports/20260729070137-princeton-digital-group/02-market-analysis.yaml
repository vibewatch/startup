- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hyperscaler cloud expansion
    - Growth driver
    - Current / multiyear
    - Supports sustained demand for large campuses across multiple APAC markets
    - Assess backlog, preleasing, and anchor-customer concentration by campus.
  - - AI and GPU-heavy workloads
    - Growth driver
    - Current / accelerating
    - Pushes average build sizes higher and raises demand for high-density cooling and power
    - Verify how much of PDG’s pipeline is truly AI-ready versus marketing language.
  - - Neocloud emergence
    - Growth driver
    - Current / emerging
    - Adds a newer class of AI-native tenant demand
    - Track whether neocloud demand is durable or funding-cycle dependent.
  - - Government digital initiatives and incentives
    - Growth driver
    - Current / medium term
    - Can disperse supply into new markets such as India and Southeast Asia
    - Map which incentives are actually usable by foreign-backed operators.
  - - Power scarcity and grid-connection delays
    - Constraint
    - Current / structural
    - Makes power access the decisive gating factor for deployment speed
    - Demand a market-by-market power roadmap for PDG’s pipeline.
  - - Land and construction-cost inflation
    - Constraint
    - Current
    - Raises capital intensity and can compress returns if pricing lags
    - Check replacement-cost inflation and contingency assumptions.
  - - Sustainability and regulatory compliance burdens
    - Constraint
    - Current / structural
    - Increases cost and makes energy strategy core to market access
    - Review power procurement, water use, and local permitting status.
  - - Core-market saturation spillover
    - Constraint / opportunity
    - Current
    - Shifts growth from land-scarce hubs like Singapore into Johor, Batam, Jakarta, and other peripheral markets
    - Check whether spillover markets preserve pricing power or become overcrowded.
  notes: The same market forces that expand demand also tighten the execution envelope for operators.
