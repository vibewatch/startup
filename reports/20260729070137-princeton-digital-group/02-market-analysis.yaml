tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to PDG
  rows:
  - - Wholesale / hyperscale colocation
    - Large multi-megawatt leased capacity, powered shell, campus land and fit-out support
    - Small cabinet retail colo and on-prem server rooms
    - Hyperscalers, neoclouds, large cloud users
    - Core market PDG explicitly serves.
  - - Hyperscaler self-build
    - Owner-occupied large campuses and cloud-region builds
    - Third-party managed enterprise hosting
    - Global cloud platforms
    - Key substitute when customers choose to own rather than lease.
  - - AI-ready campus supply
    - High-density, liquid-cooling-capable facilities and power-reserved campus space
    - Generic low-density enterprise data rooms
    - Cloud, AI, and HPC buyers
    - Important because PDG markets AI-ready campuses and liquid-cooling capability.
  - - Regional cloud adjacency
    - Interconnection, availability-zone support, cross-border deployment support
    - Consumer broadband or SaaS application spend
    - Hyperscaler regional infrastructure teams
    - Matters because PDG sells multi-country execution rather than a single-site asset only.
  - - Enterprise digital infrastructure spillover
    - Large enterprise workloads colocated near cloud ecosystems
    - General corporate IT budgets unrelated to data-centre outsourcing
    - Enterprises buying proximity to cloud ecosystems
    - Secondary relevance; PDG prioritizes larger-scale cloud and AI demand.
  notes: The boundary is built from PDG’s positioning and third-party APAC market reports rather than from one generic TAM number.
