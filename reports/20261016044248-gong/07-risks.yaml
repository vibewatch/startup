chapter:
  number: 7
  title: "Risks"
  summary: >-
    Gong's highest underwritable risks are deployment and governance risks rather than product-existence risk: independent reviews consistently flag premium pricing, long implementation cycles, CRM-data dependence, and ongoing legal responsibility for call-recording consent even though Gong markets built-in governance. A second risk layer is financial and strategic, because the assigned source set still anchors public valuation evidence to Gong's May 2021 Series E, leaving current downside protection and capital posture hard to verify from public evidence alone.
sections:
  - id: "regulatory-privacy-risk"
    title: "Recording-consent and data-governance risk remain customer-side obligations"
    body: >-
      The clearest legal risk in the public record is that Gong's core product depends on capturing and analyzing calls, meetings, and emails across jurisdictions where consent, retention, and data-processing rules vary. Gong says security, privacy, and compliance are built in, and third-party reviews confirm that the product offers consent tools, DPAs, and data residency options, but those same sources also state that GDPR and similar recording obligations remain the customer's responsibility and often require legal review before deployment. That means underwriting should treat compliance maturity as a go-live blocker, not a marketing claim: if diligence cannot verify jurisdiction-specific consent workflows, retention settings, and acceptable model-governance language for regulated customers, the risk remains high even if the software is otherwise feature-complete. A practical kill criterion is failure to clear legal/security review for the target customer base within the initial pilot scope.
    claimRefs: ["CR002", "CR003", "CR011", "CR012"]
    tableRefs: ["TR001"]
  - id: "operational-adoption-risk"
    title: "Forecasting value is real, but only if integration, data hygiene, and adoption all work"
    body: >-
      Gong's operational risk is a classic enterprise-software problem: the product can automate CRM updates and surface deal-risk signals, but the same evidence set shows that those outputs are only as reliable as the recorded channels, CRM hygiene, and manager adoption behind them. Independent reviews describe 30-90 day implementation cycles, cumbersome navigation, information overload, false alarms in health scores, and occasional transcription or insight-quality misses; several user reviews also say integrations and synchronization take more effort than expected. In practice, Gong is not a turnkey autonomous system but a diagnostic layer that still needs human validation and disciplined workflow design. The diligence question is therefore not whether Gong can generate insights, but whether the company or prospective customers can operationalize those insights at acceptable cost and speed. A measurable break trigger would be pilots that fail to reach stable CRM sync, manager usage, and acceptable false-positive rates inside the first quarter.
    claimRefs: ["CR001", "CR004", "CR005", "CR006", "CR011"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "commercial-and-strategic-risk"
    title: "Premium pricing, substitution pressure, and stale external price discovery raise underwriting risk"
    body: >-
      Commercially, the public evidence supports Gong as a premium enterprise purchase rather than a lightweight tool: multiple independent sources cluster around roughly $100-$200 per user per month, additional platform or implementation fees, annual contracting, and weak ROI for very small teams. That pricing profile creates three linked risks. First, adoption can stall when smaller organizations or low-volume teams cannot justify the spend. Second, CRM-native and adjacent suites from Salesforce, HubSpot, and Clari plus Salesloft can compress willingness to pay by offering a "good enough" bundled workflow. Third, the newest financing anchor in the assigned pool is still Gong's May 2021 Series E at a $7.25 billion post-money valuation, so investors do not have current public evidence for cash position, burn, or a refreshed market-clearing price. Until diligence closes those gaps, the investment case should assume valuation sensitivity and require explicit downside monitoring rather than extrapolating from category leadership alone.
    claimRefs: ["CR007", "CR008", "CR009", "CR010"]
    tableRefs: ["TR003"]
