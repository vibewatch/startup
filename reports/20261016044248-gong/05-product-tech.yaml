    title: Product module / asset matrix
    columns:
      - Module / layer
      - Primary user
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - [Conversation intelligence, Reps and managers, Mature core, "Searchable transcripts, call review, and coaching sit at the center of most retained evidence", "Need primary proof on accuracy by language, consent handling, and retention controls"]
      - [Deal and pipeline intelligence, Managers and RevOps, Established extension, "Combines interaction history with deal boards and risk views instead of relying on CRM notes alone", "Need audited evidence on forecast lift, false-positive risk scoring, and stage coverage"]
      - [Forecast / Engage / agent workflows, Managers and frontline reps, Expanding 2025-2026 surface, "Pushes conversation signals into forecasting, sequencing, follow-up, and assistant workflows", "Need independent proof of how much work is automated versus surfaced for human review"]
      - [Enable / post-sales account surfaces, Enablement and account teams, Newer adjacency, "Mission Andromeda and Account Console broaden use beyond core call analysis", "Need deployment proof outside new-business sales and clearer module adoption mix"]
    notes: >-
      Synthesized from third-party reviews and market profiles; maturity labels describe public
      evidence depth, not vendor-reported GA status.
    claimRefs: [CE001, CE002, CE006, CE008]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Gong solution
      - Measurable benefit
      - Limitation
    rows:
      - [Review customer conversations, "Calls and emails are easy to miss or re-document manually", "Automatic recording, transcripts, summaries, and searchable playback", "Faster call review and easier note capture are repeatedly cited by users", "No retained source gives an audited time-saved benchmark across deployments"]
      - [Inspect deal health and forecast, "Managers depend on rep updates and fragmented CRM activity", "Deal boards, engagement history, risk flags, and forecast views", "Better visibility into stalled or single-threaded deals is a recurring promise", "Public evidence is still mostly post-call analysis rather than real-time intervention"]
      - [Coach reps and reuse patterns, "Best-practice coaching is manual and uneven across teams", "Scorecards, call libraries, topic tracking, and enablement workflows", "Reviewers cite coaching and call-search utility for larger teams", "Value depends on manager adoption and can feel overwhelming without process ownership"]
    notes: >-
      Benefits are qualitative because the assigned pool does not include audited workflow ROI or a
      consistent denominator across deployments.
    claimRefs: [CE004, CE005, CE009, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - [Capture connectors, "Join calls and ingest emails or meeting interactions", "Zoom, Google Meet, Microsoft Teams, Gmail, Outlook, and related channels", "Coverage and consent controls are under-documented in the retained public pool"]
      - [Conversation analysis pipeline, "Transcribe, tag, summarize, and identify topics or objections", "Speech recognition plus Gong's conversation-analysis models", "Accuracy and latency claims vary across sources and use cases"]
      - [Revenue workflow applications, "Feed deal boards, forecasting, coaching, engagement, and account workflows", "Reliable mapping from interaction data into opportunities, users, and teams", "Broad surface area can create clutter or underused modules without RevOps ownership"]
      - [Integration and export surface, "Sync context back to CRM and downstream reporting or AI interfaces", "Salesforce, HubSpot, Dynamics, Slack, APIs, exports, and MCP-linked workflows", "No retained primary source validates data-governance, rate limits, or security controls for every downstream path"]
    notes: >-
      Architecture rows describe the operating model visible in retained public sources; they are
      not a substitute for primary architecture, security, or status documentation.
    claimRefs: [CE003, CE004, CE005, CE011, CE013]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Gong appears to sit on top of communications and CRM systems, then layers analysis and revenue workflows over captured interactions.
    data:
      layers:
        - label: Interaction capture
          summary: Bots and connectors capture customer conversations from existing communication channels.
          modules:
            - Zoom / Google Meet / Microsoft Teams
            - Email and meeting timeline capture
          outputs:
            - Recorded interactions linked to people and deals
        - label: Record matching and context assembly
          summary: Captured interactions are attached to accounts, opportunities, users, and activity history.
          modules:
            - CRM object matching
            - Activity timelines and account context
          outputs:
            - Deal-linked engagement histories
        - label: Conversation intelligence
          summary: Transcription and topic extraction turn raw interactions into searchable signals.
          modules:
            - Transcripts, summaries, and search
            - Topic, objection, competitor, and sentiment-style tagging
          outputs:
            - Structured call intelligence for review and coaching
        - label: Revenue workflow applications
          summary: Managers and reps consume the interaction graph through forecasting, deal, and coaching surfaces.
          modules:
            - Deal boards and forecast views
            - Coaching and enablement surfaces
          outputs:
            - Risk flags and manager review context
        - label: Automation and assistant layer
          summary: Newer 2025-2026 surfaces try to turn analysis into guided next steps and workflow execution.
          modules:
            - Engage, Assistant, and agent workflows
            - MCP or workflow-connected prompts
          outputs:
            - Follow-up drafts and guided next actions
        - label: System-of-record extensions
          summary: Gong extends existing GTM systems instead of replacing them.
          modules:
            - CRM sync and analytics exports
            - Slack, API, and MCP-connected downstream workflows
          outputs:
            - Updated opportunity context and downstream reporting
    claimRefs: [CE003, CE004, CE006, CE013]
callouts:
  - calloutType: risk
    title: Adoption risk is operational, not category-level
    body: >-
      The retained 2026 evidence makes Gong look like a scaled, category-leading platform, but it
      also makes clear that value depends on RevOps discipline, CRM hygiene, and enough deal
      complexity to justify a broad post-call workflow stack. Teams below that threshold can still
      buy a mature product and under-realize it.
    claimRefs: [CE007, CE008, CE010, CE012]
