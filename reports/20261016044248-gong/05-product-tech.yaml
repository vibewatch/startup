  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-and-compliance
      missingEvidence: Dedicated primary evidence on security controls, consent governance, data retention, model governance, and uptime or incident handling.
      whyItMatters: The retained product evidence is strong on feature breadth but weak on the controls that determine whether large enterprises can deploy Gong safely and compliantly.
      diligencePath: Review Gong trust center, security documentation, status history, and customer-facing compliance materials in a later pass that is allowed to retain official sources.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: A public developer or practitioner proxy showing ecosystem usage, openness, or technical adoption outside vendor and review narratives.
      whyItMatters: The chapter brief explicitly asks for developer-signal or an industry proxy, and the assigned pool does not provide enough evidence to validate ecosystem depth or platform openness.
      diligencePath: Retain official API or developer documentation, package or registry signals, public forums, or practitioner talks if they are available in a later allowed evidence pass.
      relatedQuestionRefs: [QE008]
    - type: conflicting-data
      severity: minor
      topic: performance-proof
      missingEvidence: A primary or consistently benchmarked source for transcription accuracy, processing speed, and the measurable automation level of the newer AI workflow layer.
      whyItMatters: Conflicting public figures make it hard to separate baseline product capability from marketing posture when underwriting implementation and competitive durability.
      diligencePath: Request product benchmarks, customer references, or primary technical documentation that pins performance metrics to a named deployment scope and date.
      relatedQuestionRefs: [QE007]
