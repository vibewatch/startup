      - number: '4.2'
        title: 销售方式与公开单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Gong 的上市设计最清晰的公开代理指标是客户适配度：多份来源将产品定位在规模较大、流程较重的收入组织中，在那里部署、预测和培训的广度足以支撑独立平台采购。这些来源也说明了为什么外部难以判断单位经济。Claap
              的买家通话汇总显示真实付费意愿，但 Docket 与 Debriefing 都将产品描述为运营负担重且定价高端，需要持续维护跟踪器并投入不小的实施工作。收入持久性收入持久性与其说取决于轻量席位扩张，不如说取决于
              Gong 能否相较 CRM 原生和低成本替代品保持足够价值， 经受采购审查。
