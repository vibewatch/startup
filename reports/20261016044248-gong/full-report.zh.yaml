  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，法律 / 治理和部署执行是剩余风险最高的两大集群。
    data:
      columns:
        - label: 可能性
          note: 公开证据视角，并非公司概率模型。
        - label: 影响
        - label: 缓释成熟度
      rows:
        - label: 录音同意 / 隐私
          values:
            - label: 高
              tone: high
              note: 客户仍需负责合规的同意流程和数据处理流程。
            - label: 高
              tone: critical
              note: 法律审查未通过，可能阻断目标账户的部署。
            - label: 中
              tone: warning
              note: 工具已经存在，但指定证据池不足以证明端到端的政策合规。
        - label: 预测可靠性 / 数据卫生
          values:
            - label: 高
              tone: high
              note: 多个来源称，CRM 质量和录制渠道覆盖决定输出质量。
            - label: 高
              tone: high
              note: 信号失真会扭曲预测、优先级排序和辅导。
            - label: 中
              tone: warning
              note: 缓释效果更多取决于工作流纪律，而非产品自动防护。
        - label: 实施 / 采用 ROI
          values:
            - label: 高
              tone: high
              note: 独立评测提到设置和采用需要数周。
            - label: 中高
              tone: risk
              note: 价值实现过慢会降低回本速度和扩张信心。
            - label: 中
              tone: warning
              note: 缓释措施存在，但需要管理者改变行为并加强赋能。
        - label: 捆绑压力 / 过时估值锚
          values:
            - label: 中
              tone: warning
              note: 捆绑套件带来的竞争是真实的，但在指定证据中尚未达到生死攸关的程度。
            - label: 中高
              tone: risk
              note: 独立席位定价和公开融资信息更新有限，提高了投资判断对估值的敏感度。
            - label: 中低
              tone: neutral
              note: 公开缓释证据仅限于产品差异化和品类领导地位的声明。
        - label: 转录 / AI 洞察质量
          values:
            - label: 中
              tone: warning
              note: 用户评测提到偶发的转录遗漏和建议不一致。
            - label: 中
              tone: warning
              note: 质量问题可能削弱用户对辅导和风险提醒的信任。
            - label: 中
              tone: warning
              note: 对于后果重大的使用场景，仍需人工核验。
        - label: 小团队 ROI 错配
          values:
            - label: 高
              tone: high
              note: 多位评测者称，该产品最适合规模较大、交易周期复杂的团队。
            - label: 中
              tone: warning
              note: 客户分群不匹配会削弱扩张和续约经济性，而非核心产品本身。
            - label: 中
              tone: warning
              note: 只有在市场进入保持选择性时，ICP 纪律才能缓释这一风险。
    approximationNotes: 热力图标签总结指定来源池所暗示的严重程度，并非披露的内部评分标准。
    claimRefs:
