      - number: '7.3'
        title: 高端定价、替代压力与过时的外部价格发现抬高判断风险
        blocks:
          - type: paragraph
            body: >-
              从商业角度看，公开证据支持把 Gong 视为高端企业采购，而非轻量工具：多份独立来源将价格集中在每用户每月约 $100–$200，另加平台费或实施费，按年度签约，且很小团队的 ROI
              较弱。这一价格结构带来三个关联风险。第一，小型组织 或低通话量团队若无法证明支出合理，采用可能停滞。第二，Salesforce、HubSpot、Clari 及 Salesloft 的 CRM 原生和相邻
              套件提供“足够好”的捆绑工作流，可能压低支付意愿。第三，指定资料中最新融资锚点仍是 Gong 2021 年 5 月的 Series E， 投后估值
              $7.25B，因此投资者没有关于现金、烧钱或重新出清价格的当前公开证据。在尽调填补这些缺口前，投资判断应假设 对估值敏感，并要求明确监测下行风险，而不是仅从品类领先地位外推。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
