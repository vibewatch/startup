        title: 尽调含义与证据边界
        blocks:
          - type: paragraph
            body: >-
              公司概览支持其具备可观的商业规模，但公开承销判断证据的质量不一。指定来源没有披露经审计的 GAAP 收入、毛利率、 现金、烧钱、债务融资、留存率或股权结构表和优先股堆叠条款。G2
              客户评价还指出一些实际产品局限，包括偶发转录错误、管道视图 杂乱，以及可能误读线下交易活动的健康度评分。这些观察并不能证明系统性失败，但意味着准确性、工作流适配和实施控制，
              应与私募财务及治理资料一并列为客户访谈核查主题。
