            body: >-
              看涨、基准和悲观情景都取决于公开证据只能部分解决的事实。乐观情景要求当前 ARR 规模转化为持久的留存、利润率和现金 生成质量，并证明 2026
              年末的产品扩张能在不推高销售成本的情况下加深平台份额。基准情景假设公司仍是规模化品类领导者， 但在下一轮融资、要约收购或经审计 IPO 文件重置基准前，估值仍参考折价的私募市场价格。悲观情景则是预算压力、捆绑竞争
