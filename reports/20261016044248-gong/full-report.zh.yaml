    notes: 本表聚焦于实质影响采用、留存或定价权的平台及市场进入依赖。
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR011
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 跟踪
        - 继续尽调，但不要把当前公开证据视为足以做出买入判断。
      - - 置信度
        - 中
        - 规模证据很强，但留存、利润率和股权表细节仍属非公开信息。
      - - 风险评级
        - 高
        - 过时的融资轮价格、捆绑压力和披露缺口都可能压缩入场回报。
      - - 估值立场
        - 相对 2025 年二级交易属合理至偏高，相对 2021 年公开标价偏高
        - 在出现更新价格前，以 2025 年末二级交易作为更干净的公开锚点。
    notes: 面向读者的引证公开证据综合；评估术语是分析师判断，不是发行方披露或可执行市场报价。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV014
      - CV016
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 论点
      - 方向
      - 证据
      - 什么会改变判断
    rows:
      - - 品类规模
        - 正论
        - $500M+ ARR 和 5,000+ 家组织意味着真正的品类领导力，而不是概念阶段故事。
        - 增长放缓、留存疲弱或客户集中的审计证据会削弱规模论点。
      - - 平台广度
        - 正论
        - 2026 年末的发布和具名客户结果引用显示，Gong 正试图拓展到核心通话录音之外。
        - 如果扩张模块难以变现，或采用仍然浅薄，就应下调平台故事的权重。
      - - 高端定价与捆绑压力
        - 反论
        - 独立指南描述了高端席位、平台和实施成本，同时 CRM 原生 AI 及集成型竞争对手挤压预算。
        - 若非公开交易视图显示扩张经济性强、竞争流失低，定价风险论点会有所缓和。
      - - 估值支撑缺口
        - 反论
        - 清晰的公开估值标记是 2021 年 $7.25B 融资轮和约 $4.5B 的 2025 年末二级交易，两者之间公开单位经济性披露有限。
        - 新融资、经审计的 IPO 文件，或披露优先权条款的经核验要约交易，可能重置基准。
    notes: 本表将业务质量论点与价格风险论点分开；两者可以同时成立。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
      - CV009
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - ARR 持久、留存强劲，Activate、Enrich 和智能体工作流交叉销售成功。
        - 更新后的非公开或公开基准可能将估值推回 2021 至 2025 年公开区间的上半段，支撑溢价入场。
        - 扩张模块令人失望，或采用仍集中在核心录音工作流。
        - 有可能，但尚未得到公开留存或利润率披露支持。
      - - 基准
        - Gong 仍是规模化品类领导者，但单位经济性和优先权条款的公开证据仍很少。
        - 投资判断应更接近约 $4.5B 的二级交易参考，而非 $7.25B 的 2021 年标记；上行空间必须来自尽调确认的质量。
        - 如果价格纪律松动，过时基准可能让一家好公司也变成糟糕的新入场标的。
        - 与当前公开证据集最一致。
      - - 悲观
        - 预算压力、捆绑竞争或产品摩擦信号压缩扩张和支付意愿。
        - 2025 年二级交易参考被证明偏慷慨而非保守，推动公允价值低于该标记。
        - 过度依赖高端席位定价和不透明留存，可能在软件倍数走弱时放大下行。
        - 如果非公开尽调无法填补披露缺口，影响将很大。
    notes: 情景区间是根据引证公开标记得出的定性投资判断区间，不是直接市场报价或管理层指引。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
      - CV016
