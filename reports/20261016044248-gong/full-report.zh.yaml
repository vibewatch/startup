      - number: '5.2'
        title: 运营模式、架构与依赖
        blocks:
          - type: paragraph
            body: >-
              保留来源指向分层运营模式。Gong 连接 Zoom、Google Meet、Microsoft Teams、Gmail、Outlook 等通信系统和邮件服务， 再将捕捉到的互动关联回
              Salesforce、HubSpot、Microsoft Dynamics 及相邻工具中的 CRM 对象。会话数据会被处理成
              转录、摘要、主题标签、异议、竞争者提及和活动信号，随后驱动交易看板、预测视图、培训评分卡、提醒及分析导出。 实际上，Gong 并不取代记录系统；它依赖现有销售技术栈，以及进出 CRM
              的相对干净的数据流。公开产品最强的证明是这套 以互动为中心的工作流及其集成广度，而不是独立基准验证“每个 AI 层都自主或实时”的说法。
