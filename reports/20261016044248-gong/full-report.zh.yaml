      - number: '8.2'
        title: 估值背景与多空平衡
        blocks:
          - type: paragraph
            body: >-
              公开证据同时支持可信的正面论点和清晰的反面论点。正面看，Gong 似乎具备真实的品类规模、高端企业定位，以及足以支撑
              向预测、赋能和工作流自动化扩张的产品路线图。负面看，高端席位加模块定价会造成预算摩擦；独立评论指出 2022–2023 年 留存承压后才重新加速；CRM 原生 AI 或 Clari 加 Salesloft
              式集成栈的低成本捆绑方案也会压低支付意愿。孕育 Gong 的 以色列 AI 生态仍有战略意义，但它只是支撑背景，不能单独作为估值锚点。这种平衡意味着应把 Gong 作为强资产判断，但
              价格仍然重要：公司或许值得健康的软件倍数，但公开证据尚不足以支持高价回到 2021 年旧标记。
