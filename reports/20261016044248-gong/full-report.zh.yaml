      - number: '4.3'
        title: 资本充足性与资产负债表透明度
        blocks:
          - type: paragraph
            body: >-
              公开报道足以重建 Gong 的历史融资和近期估值重置，却无法还原当前流动性。多个第三方数据集都指向累计融资约 $583M 至 $584M，并将 2021 年 5 月列为最近一轮一级融资。Sacra 和 Komo
              还把 2025 年末的价格点描述为二级交易；这很重要， 因为二级流动性有利于员工和投资者，却不会直接增加资产负债表现金。一个核心尽调阻碍仍未解决：公开来源显示规模和企业
              采用，却没有披露当前现金、烧钱、债务或现金跑道，因此仅凭公开证据无法判断资本充足性。
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              当前公开记录支持对收入漏斗顶部质量作出正面判断：Gong 似乎具备有意义的企业客户 traction、经常性合同结构和可信的 模块扩展机会。但同一记录在决定这种 traction
              能否复合成有吸引力的风险投资回报的变量上明显较弱，包括实际折扣、 模块毛利率、CAC 效率、净留存、客户集中度和当前流动性。实际而言，Gong 可以作为规模化后期软件资产进行筛选，却无法
              完整判断。下一步应索取管理层或数据室材料，把报价和 ARR 主张与经审计的收入结构、利润率、留存率及现金跑道披露对应起来。
            claimRefs:
              - CI011
              - CI014
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与买家适配
        blocks:
          - type: paragraph
            body: >-
              Gong 一贯被描述为收入团队软件，而非通用会议录音器：第三方评价、分析解读和市场资料都指向同一套工作流：录制
              销售电话、会议和邮件，再将互动转化为经理和销售代表可搜索的情报。保留证据还显示，产品已从单一会话智能模块扩展到交易检查、预测、互动、培训以及新型智能体或助手等相邻层。这个广度对判断投资很重要，因为它解释了
              Gong 为何在规模较大、流程较重、拥有专职 RevOps 且通话量大的 B2B 销售组织中最有优势：多个团队复用同一互动图谱时，平台更容易证明物有所值；但轻量团队也可能买下全套产品，却只使用其中很小一部分。
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
