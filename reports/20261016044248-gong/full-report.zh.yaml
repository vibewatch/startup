          - type: paragraph
            body: >-
              第三方来源普遍认为 Gong 通过七轮融资累计募集 $584M，最终于 2021 年 5 月完成 $250M 的 Series E，投后估值 $7.25B。Sacra 称 2025 年 11 月的一笔二级交易按
              $4.5B 估值，为员工和现有投资者提供流动性，而非新增一级资本； 因此该数字既不是可用现金，也不是新一轮融资。规模证据较强但未经审计：Gong 自称服务超过 5,000 家机构，Sacra 估计 2026 年
              5 月 ARR 为 $500M，而现有员工数来源在 2,171 人与约 2,500 人之间存在冲突。
