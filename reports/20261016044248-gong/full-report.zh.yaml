            body: >-
              公开证据显示 Amit Bendov 与 Eilon Reshef 是联合创始人，Bendov 任 CEO，Reshef 任首席产品官。这种连续性支撑了
              公司积累的产品知识与品类信誉，但也使公开战略叙事集中在两位创始人身上。现有资料无法确认完整的现任高管名单、 董事会构成、委员会结构、投票控制权或继任计划。因此无法做出确定的治理判断，领导层表格有意保持不完整，
