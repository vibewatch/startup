        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              业务质量信号真实存在：公开参考资料显示 Gong 在 2026 年 5 月 ARR 超过 $500M，服务超过 5,000 家机构，并在 2026 年末
              继续推出有意义的平台扩展。这足以支持继续尽调，却不足以在缺少更新判断依据时按 2021 年的头部估值出价。唯一明确的 公开价值标记是 2021 年 Series E 的 $7.25B，以及 2025 年末约
              $4.5B 的二级市场参考。留存、毛利率、现金生成和优先股堆叠等关键回报驱动因素仍未披露，因此稳妥的公开立场是继续跟踪：保持参与，但要求重置入场价格，或通过私募尽调证明业务 足以支撑高端倍数。
