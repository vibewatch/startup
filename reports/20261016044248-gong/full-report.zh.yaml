      - number: '6.3'
        title: 持久性、扩展与摩擦
        blocks:
          - type: paragraph
            body: >-
              不能把采用故事夸大为已证实的持久性。证据确实显示产品有望横向扩展到营销、客户成功、账户管理和售后工作流， 但也显示采用摩擦不小：评价提到导入困难、学习曲线、集成开销，以及低通话量团队的 ROI
              较弱。定价一贯被描述为 不透明且按年度合同计费；竞争者则强调，增加独立会话智能层会带来额外供应商、安全审查和预算负担。更重要的是， 保留的公开来源没有一个能确认
              NRR、GRR、流失率、平均合同期限或客户集中度，因此续约质量和集中度风险仍是开放的 尽调事项。
