              - CM014
              - CM015
      - number: '2.3'
        title: 买家、用户与预算负责人分层
        blocks:
          - type: paragraph
            body: >-
              买家分层比市场规模计算清晰得多。官方和独立描述显示，Gong 的常见用户包括销售代表、经理、RevOps 团队、销售高管、
              客户成功运营人员及赋能团队；他们需要一份客户会话记录的共同底稿。当这些利益相关方需要用一个系统完成培训、 交易检查、预测及跨职能交接时，价值主张最强。Gong
              自己的材料将其与近乎完整的互动捕捉联系起来，但评价数据也表明， 如果组织缺乏流程纪律，产品的生产力价值虽真实，却可能变得嘈杂。因此预算归属是有方向性的，而非普遍适用：CRO 和 RevOps
              预算是最明确的重心；在培训或售后情报驱动采购时，赋能和客户成功预算也会参与。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 展示
        blocks:
          - type: callout
            title: 公开证据支持按适配度测算，而非 TAM 数学
            body: 保留来源反复界定 Gong 适合谁以及原因，但没有提供透明的按支出计算的市场模型。这足以圈定买家适配度，却不足以在没有 管理层专属材料的情况下判断市场规模主张。
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM013
              - CM014
              - CM015
          - type: callout
            title: 小团队替代风险确实存在
            body: 更小或更简单的团队有明显替代品：CRM 原生会话功能、轻量录音工具和培训工具可以满足更窄的需求，无需承担 Gong 的 定价、实施负担和信息密度。
            calloutType: risk
            claimRefs:
              - CM008
