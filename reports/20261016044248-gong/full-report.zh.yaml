  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 录音同意与数据治理风险仍由客户承担
        blocks:
          - type: paragraph
            body: >-
              公开记录中最明确的法律风险是，Gong 的核心产品依赖在不同司法辖区捕捉并分析电话、会议和邮件，而当地同意、留存和 数据处理规则各不相同。Gong
              称安全、隐私和合规已内建，第三方评价也确认产品提供同意工具、DPA 和数据驻留选项； 但这些来源同样指出，GDPR 及类似录音义务仍由客户承担，部署前通常需要法律审查。因此判断时应把合规成熟度视为上线
              阻断项，而不是营销主张：若尽调无法核实特定司法辖区的同意流程、留存设置，以及面向受监管客户可接受的模型治理措辞， 即使软件功能完整，风险仍然很高。实际止损标准是：目标客户群无法在初始试点范围内通过法律与安全审查。
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
      - number: '7.2'
        title: 预测价值真实存在，但前提是集成、数据卫生与采用都能跑通
        blocks:
          - type: paragraph
            body: >-
              Gong 的运营风险是典型的企业软件问题：产品可以自动更新 CRM 并提示交易风险，但同一组证据显示，这些输出的可靠性 取决于录音渠道、CRM 数据卫生和经理采用程度。独立评价提到 30–90
              天实施周期、导航繁琐、信息过载、健康度评分误报， 以及偶发转录或洞察质量问题；多条用户评价还称集成和同步比预期更费力。实际而言，Gong 不是开箱即用的自主系统，
              而是仍需人工验证和严谨工作流设计的诊断层。因此尽调问题不是 Gong 能否生成洞察，而是公司或潜在客户能否以可接受的 成本和速度把洞察落地。可量化的破坏触发点是：试点在首个季度内未能达到稳定 CRM
              同步、经理使用率和可接受的误报率。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR011
