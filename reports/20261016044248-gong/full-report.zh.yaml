      - number: '3.2'
        title: 能力与定价取舍
        blocks:
          - type: paragraph
            body: >-
              最清晰的直接比较不是“Gong 对所有人”，而是 Gong 对几种不同的采购路径。买家由 RevOps 主导且重视预测控制和收入 数据库广度时，Clari 最强；团队需要 SDR 到 AE
              的工作流及更透明的套餐时，Salesloft 最强；看重 ZoomInfo 捆绑经济性 和联系人数据丰富度时，Chorus 更有吸引力；而买家想在一个高端平台里获得最锐利的会话分析和最深的培训能力时， Gong
              保持优势。公开价格信号也印证了这一分层：Gong 和 Clari 多数仍按定制报价，Salesloft 公布更清晰的梯度， Chorus 则常被描述为 ZoomInfo 账户内的低成本选项。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
