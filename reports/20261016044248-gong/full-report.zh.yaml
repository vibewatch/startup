      - number: '3.3'
        title: 转换成本、多平台并用与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Gong 的护城河不只是品牌，还包括会话数据规模、培训工作流，以及向预测或互动领域延伸的能力。但这些优势并没有把它 变成封闭生态。多份来源表明，高端买家常选择多平台并用，而不是彻底替换，尤其是在 Gong
              负责通话智能、Clari 负责预测 或 ZoomInfo 提供联系人数据杠杆时。实施、导入、用户采用和多年合同条款使替换成本确实较高；但一旦客户认为 CRM 原生 AI
              或捆绑套件对自身销售方式“足够好”，同样的条款也会让 Gong 暴露风险。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP016
      - number: '3.4'
        title: 不利信号与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是 Gong 没有价值，而是价值兑现不均衡且成本高。用户评价认可摘要、通话复盘和集成，但也提到界面杂乱、
              通知过载、偶发转录遗漏，以及相较专门互动工具的编排限制。相邻分析还指出，若没有工程工作、隐私控制，以及用于网站、营销或外部竞争者信号的配套系统，Gong 并不完整。因此买家可以在成熟企业 GTM
              技术栈中证明采购合理，却可能在小团队、重视隐私的环境，或希望用一个更便宜的捆绑方案取代高端专用工具加周边系统的组织中失去经济性。
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 多平台并用是现实结果，不是边缘情况
            body: 高端买家常把 Gong 与另一套系统搭配，而不是要求一套完美套件。这降低了彻底替换风险，但当预测或数据丰富预算流向 其他系统时，也会限制 Gong 的钱包份额。
            calloutType: insight
            claimRefs:
              - CP010
              - CP016
          - type: callout
            title: 高端定价同时抬高锁定与被替代风险
            body: Gong 的合同结构、服务负担和实施投入可以提高转换成本，但当更便宜的捆绑方案或原生 AI 功能看起来已经足够好时， 也会给董事会层面的采购论证增加压力。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
