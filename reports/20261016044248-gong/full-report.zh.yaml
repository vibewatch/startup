  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价质量
        blocks:
          - type: paragraph
            body: >-
              公开来源一致将 Gong 描述为按报价计费的年度订阅业务，收入来自付费用户席位、强制平台费，以及 Forecast、Engage、 Enable
              等产品的单独模块附加费。这种架构支持经典的软件“先落地、再扩展”模式，但也意味着大多数公开定价证据都是 间接的：第三方价格区间、买家轶事，以及 Vendr 的一笔中位合同数据，而不是公司披露的实际
              ASP。因此证据足以说明 Gong 正在变现庞大的经常性软件基础，却不足以判断其装机客户的综合实际价格、折扣或模块级收入结构。
