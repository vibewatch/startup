            body: >-
              Gong 展示规模化企业成果时，公开客户证明最有说服力。本资料中最清晰的量化案例来自 Gong 对 2026 年 9 月大会的报道： AT&T Business 称评分卡、通话复盘和经理反馈带来 54%
              的生产力提升；Cisco 称已将 Gong 部署到 18,000 个许可证和超过 450,000 次会话，早期采用团队的交易规模更大、赢单率更高；Experian 则称围绕一个 AI 平台整合某部门后，赢单率提升
              25%。这些案例显示真实生产使用和先落地后扩展的潜力，但仍是公司筛选的展示证据，而非独立采购记录、经审计案例研究 或客户撰写的参考材料。
