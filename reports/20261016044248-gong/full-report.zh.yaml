  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 规模证明很强，但价格纪律仍主导推荐结论，因为清晰的估值锚点要么过时，要么已经被压缩。
    data:
      nodes:
        - id: scale-proof
          label: 规模证明
          detail: $500M+ ARR 和 5,000+ 家机构表明产品确实契合市场。
          tone: positive
          claimRefs:
            - CV004
            - CV005
        - id: product-breadth
          label: 产品广度
          detail: 2026 年下半年推出的产品让 Gong 超越了核心对话智能。
          tone: positive
          claimRefs:
            - CV011
            - CV012
        - id: premium-economics
          label: 高端经济性
          detail: 对企业落地并扩张型账户而言，席位定价、平台费和模块费可以运转良好。
          tone: neutral
          claimRefs:
            - CV006
            - CV007
        - id: compressed-marker
          label: 压缩后的标记
          detail: 明确的公开价格信号已从 2021 年的 $7.25B 降至 2025 年末约 $4.5B。
          tone: warning
          claimRefs:
            - CV001
            - CV002
        - id: diligence-gap
          label: 尽调缺口
          detail: 留存、利润率、现金创造能力和优先权条款仍未充分公开，不足以支持激进的投资判断。
          tone: risk
          claimRefs:
            - CV013
            - CV014
            - CV016
        - id: call
          label: 推荐 = 跟踪
          detail: 保持关注，但要求重新设定入场价格，或通过私下尽调证明具备高端经济性。
          tone: warning
          claimRefs:
            - CV014
            - CV016
