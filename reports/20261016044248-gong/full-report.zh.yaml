  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              市场边界比“所有销售 AI”更窄。Gong 对品类的定义围绕一类软件：捕捉并分析电话、邮件、会议及相关互动，让收入团队
              培训销售代表、检查交易、预测管道并协同面向客户的执行。公开描述也显示平台正扩展到互动、赋能和账户管理工作流，
              但会话数据仍是锚点，而非泛化的生产力助手。同样重要的是，现有来源明确列出范围外内容：漏斗顶部联系人数据库、
              原生买家意向信息流、匿名网站访客识别，以及外部竞争情报抓取。因此，实际市场定义是以会话为核心的收入执行及相邻 工作流软件；获客数据、访客情报和专门的外部 CI 工具仍属于替代或互补品类，不是 Gong
              的自然支出池。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM010
      - number: '2.2'
        title: 受证据约束的规模测算与采用限制
        blocks:
          - type: paragraph
            body: >-
              公开市场规模是按适配度而非金额界定的。最强的独立证据没有提供分母透明的 TAM/SAM/SOM 计算，而是反复用部署启发式 收窄 Gong 的可服务市场，例如 10 名以上配额销售、25
              名以上面向收入的员工、多利益相关方交易周期和 RevOps 准备度。 这些筛选条件很重要，因为 Gong 的商业模式并不轻量：公开评价提到按报价定价、平台费、实施投入和年度承诺，使小规模
              部署更难证明合理。Tracxn 的大量竞争者数量及多个 5,000+ 装机量引用显示市场相邻空间广、当前渗透有意义，但仍未解决
              分母缺失。结论是，现有证据支持一套实用的买家适配梯度，而不是可复现的按支出计算的市场模型。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM013
              - CM014
              - CM015
