  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 买家分层与使用广度
        blocks:
          - type: paragraph
            body: >-
              保留证据一贯显示，Gong 最适合复杂的 B2B 收入组织，而不是小团队。独立评价反复将其定位于中端市场和企业销售场景， 这些场景拥有足够的通话量、交易复杂度和管理流程，能够证明高端工作流层的合理性。Gong
              自称服务超过 5,000 家机构， 加上 G2 异常庞大的已验证评价库，进一步印证了这一装机基础。使用者也不止一线销售：第三方评价集合包括营销、客户成功、 RevOps
              和开发者型用户，他们把录音、摘要、预测及会话数据作为运营输入，而不是单点功能。
