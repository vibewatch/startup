    rows:
      - [Conversation intelligence depth, "Best-in-class", Strong, Strong, Strong, Gong remains the reference point for deep call analysis]
      - [Forecasting / pipeline management, Strong, "Best-in-class", "Forecast module", Limited, Clari leads when executive forecast control is the primary job]
      - [Sales engagement workflow, "Gong Engage", "Clari Groove", "Cadence core", "Via ZoomInfo Engage", Salesloft and Clari/Salesloft compete hardest when workflow consolidation matters]
      - [Contact-data enrichment, Limited, Limited, Limited, Strong, Chorus is strongest where ZoomInfo data attachment materially improves rep workflow]
      - [External competitor monitoring, Limited, Limited, Limited, Limited, Buyers still need dedicated CI tools for public competitor tracking]
    notes: Matrix cells summarize evidence-backed relative positioning from current comparison sources; "Limited" means the assigned pool did not support parity with a category leader for that criterion.
    claimRefs: [CP003, CP004, CP005, CP009, CP010, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / path
      - Public price signal
      - Contract model
      - Included / caveat
      - Implication
    rows:
      - [Gong, "$5,000/year base fee plus roughly $100-$133 per user per month in buyer-report estimates", "Annual custom contract; competitor-authored and analyst pages also describe multi-year commitments", "Engage and Predict can raise TCV; implementation and services often extra", "Premium positioning is easier to justify in larger, process-mature sales orgs"]
      - [Clari, "Roughly $60-$100 per user per month for Copilot plus Forecast in published estimates", "Custom-priced with typical minimums around $30,000-$50,000 per year", "Adding Groove raises total cost", "Best fit when forecast control is worth enterprise platform overhead"]
      - [Salesloft, "Essentials ~$75, Advanced ~$125, Premier ~$175 per user per month", "Published annual tiers", "Advanced adds Conversations and Deals; Premier adds Forecast and advanced AI", "Most transparent pricing among major direct alternatives in the assigned pool"]
      - [Chorus / ZoomInfo, "$8,000-$15,000/year for a mid-market team in one comparison; roughly $149/user/month as a ZoomInfo add-on in another", "Often bundled or sold as ZoomInfo add-on", "Value depends heavily on existing ZoomInfo subscription", "Most compelling when buyer already pays for the surrounding ZoomInfo data stack"]
    notes: Pricing rows preserve public estimates and competitor-authored caveats rather than treating them as audited realized pricing; unknown discounting, seat floors, and module attach rates remain diligence gaps.
    claimRefs: [CP005, CP006, CP007, CP008]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Gong scores highest on conversation-intelligence depth, while Clari stretches furthest on workflow breadth and CRM-native AI presses the low end with "good enough" substitution.
    data:
      points:
        - label: Gong
          x: 4
          y: 5
          detail: Premium revenue-intelligence suite with strongest conversation-analysis depth in the assigned sources.
        - label: Clari
          x: 5
          y: 3
          detail: Broadest RevOps and forecasting workflow, but weaker call-analysis depth than Gong.
        - label: Salesloft
          x: 4
          y: 3
          detail: Unified SDR-to-AE workflow with transparent packaging and solid conversation tooling.
        - label: Chorus / ZoomInfo
          x: 3
          y: 3
          detail: Competitive where bundled with ZoomInfo data enrichment and prospecting workflow.
        - label: CRM-native AI
          x: 3
          y: 2
          detail: Embedded substitute for smaller teams using Salesforce or HubSpot AI features.
        - label: Dedicated CI stack
          x: 2
          y: 1
          detail: Strong on external competitor monitoring but weak on private buyer-conversation capture.
    approximationNotes: Ordinal 1-5 coordinates are evidence-backed relative scores for workflow breadth (x) and buyer-conversation intelligence depth (y), not source-published benchmark values.
    claimRefs: [CP002, CP003, CP004, CP005, CP009, CP010, CP011]
callouts:
  - calloutType: insight
    title: Multi-homing is a real outcome, not an edge case
    body: Buyers at the high end often pair Gong with another system instead of demanding one perfect suite, which reduces outright rip-and-replace risk but also caps Gong's wallet share when forecasting or enrichment budgets sit elsewhere.
    claimRefs: [CP010, CP016]
  - calloutType: risk
    title: Premium pricing raises both lock-in and displacement risk
    body: Gong's contract structure, services burden, and implementation effort can increase switching costs, but they also create a board-level burden of proof when cheaper bundles or native AI features appear good enough.
    claimRefs: [CP006, CP007, CP008, CP011, CP013]
