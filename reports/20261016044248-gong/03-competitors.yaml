  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Cohort-level realized Gong contract data showing base fee, seat floor, add-on attach rate, onboarding cost, renewal uplift, and discount range by customer size.
      whyItMatters: Public sources establish that Gong is premium and contract-heavy, but not what an underwriter should use as normalized realized pricing.
      diligencePath: Request anonymized recent customer contracts or procurement summaries segmented by seat band and module mix.
      relatedQuestionRefs: [QP009]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: win-loss
      missingEvidence: Independent win-loss or procurement evidence comparing Gong against Salesforce Agentforce, Microsoft Copilot for Sales, and HubSpot AI in live evaluations.
      whyItMatters: The chapter can support downmarket substitution pressure, but not quantify how often native AI actually displaces Gong in real buying cycles.
      diligencePath: Collect customer interviews, partner win-loss notes, or procurement records that name finalists and final selection reasons.
      relatedQuestionRefs: [QP008]
    - type: missing-source
      severity: minor
      topic: multi-homing
      missingEvidence: Quantified attach-rate data showing how often Gong coexists with Clari, Salesloft, or ZoomInfo versus replacing them outright.
      whyItMatters: The evidence supports multi-homing qualitatively, but not its prevalence by segment or contract size.
      diligencePath: Ask management for current integration attach rates and recent competitive displacement narratives by ARR band.
      relatedQuestionRefs: [QP004, QP007]
