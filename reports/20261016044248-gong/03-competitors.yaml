      - [Salesloft, Unified engagement plus conversation workflow, "Public pricing disclosed in tiers; funding/employee scale not established in assigned source pool", "Growth-stage to enterprise teams unifying SDR and AE workflows", "Transparent packaging and combined cadence plus conversation tooling", "Less differentiated if buyer only wants deepest call analytics"]
      - [CRM-native AI, Substitute / likely entrant, "Existing Salesforce or HubSpot estate rather than separate funding event", "Small and mid-market teams with modest conversation needs", "Good-enough call summaries, transcription, and keyword tracking inside existing systems", "Insufficient for sophisticated CI, coaching, and enterprise forecasting needs"]
      - [Dedicated CI stack (Klue / Crayon / Kompyte), Adjacent complement rather than direct substitute, "Pricing and scale vary; assigned sources frame them as separate budget lines", "Teams that prioritize public competitor monitoring and battlecards", "Tracks external pricing, websites, job postings, and product moves", "Does not capture private buyer-conversation signals the way Gong does"]
    notes: Public comparison and market-intelligence sources use mixed units; rows preserve disclosed estimates and mark missing scale explicitly where the assigned pool did not establish it.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP009, CP010, CP011, CP015]
