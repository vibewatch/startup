      - [Risk rating, High, "Stale round pricing, bundle pressure, and disclosure gaps can all compress entry returns."]
      - [Valuation stance, "Fair-to-stretched versus the 2025 secondary and stretched versus the 2021 headline", "Use the late-2025 secondary as the cleaner public anchor until fresher pricing appears."]
    notes: >-
      Reader-facing synthesis from cited public evidence; assessment terms are
      analyst judgment, not issuer disclosures or executable market quotes.
    claimRefs: [CV002, CV004, CV005, CV014, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Direction
      - Evidence
      - What would change the view
    rows:
      - ["Category scale", Thesis, "$500M+ ARR and 5,000+ organizations imply real category leadership, not a concept-stage story.", "Audited evidence of slowing growth, weak retention, or customer concentration would weaken the scale thesis."]
      - ["Platform breadth", Thesis, "Late-2026 launches and named customer outcome references show Gong is trying to broaden beyond core call recording.", "If expansion modules prove hard to monetize or adoption remains shallow, the platform story should be discounted."]
      - ["Premium pricing and bundle pressure", Anti-thesis, "Independent guides describe premium seat, platform, and implementation costs while CRM-native AI and integrated rivals pressure budgets.", "A private deal view showing strong expansion economics and low competitive churn would soften the pricing-risk thesis."]
      - ["Valuation support gap", Anti-thesis, "The clean public valuation markers are a 2021 $7.25B round and an approximately $4.5B late-2025 secondary, with limited public unit-economics disclosure in between.", "A fresh financing, audited IPO filing, or verified tender with disclosed preferences could reset the benchmark."]
    notes: >-
      The table separates business-quality arguments from price-risk arguments;
      both can be true at the same time.
    claimRefs: [CV001, CV002, CV004, CV005, CV007, CV009, CV011, CV012, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "ARR durability, strong retention, and successful cross-sell from Activate, Enrich, and agent workflows.", "A refreshed private or public benchmark could move valuation back toward the upper half of the 2021-to-2025 public range and support a premium entry case.", "Expansion modules disappoint, or adoption remains concentrated in core recording workflows.", "Possible, but not yet supported by public retention or margin disclosure."]
      - [Base, "Gong remains a scaled category leader, but public evidence on unit economics and preferences stays thin.", "Underwrite closer to the approximately $4.5B secondary reference than to the $7.25B 2021 mark, and require upside to come from diligence-confirmed quality.", "A stale benchmark can make even a good company a weak new entry if price discipline slips.", "Most consistent with the current public evidence set."]
      - [Bear, "Budget pressure, bundle competition, or product-friction signals compress expansion and willingness to pay.", "The 2025 secondary reference proves generous rather than conservative, pushing fair value below that marker.", "Overreliance on premium seat pricing and opaque retention can magnify downside in a softer software-multiple tape.", "Material if private diligence cannot close the disclosure gap."]
    notes: >-
      Scenario ranges are qualitative underwriting brackets derived from cited
      public markers, not direct market quotes or management guidance.
    claimRefs: [CV001, CV002, CV004, CV008, CV009, CV010, CV011, CV013, CV014, CV016]
