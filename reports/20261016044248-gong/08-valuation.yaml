    type: flow
    summary: >-
      Public scale proof is strong, but price discipline still dominates the
      recommendation because the clean valuation anchors are old or compressed.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: "$500M+ ARR and 5,000+ organizations indicate real market fit."
          tone: positive
          claimRefs: [CV004, CV005]
        - id: product-breadth
          label: Product breadth
          detail: "Late-2026 launches extend Gong beyond core conversation intelligence."
          tone: positive
          claimRefs: [CV011, CV012]
        - id: premium-economics
          label: Premium economics
          detail: "Seat pricing, platform fees, and module fees can work well for enterprise land-and-expand accounts."
          tone: neutral
          claimRefs: [CV006, CV007]
        - id: compressed-marker
          label: Compressed marker
          detail: "The explicit public price signal moved from $7.25B in 2021 to about $4.5B in late 2025."
          tone: warning
          claimRefs: [CV001, CV002]
        - id: diligence-gap
          label: Diligence gap
          detail: "Retention, margin, cash-generation, and preference terms are still not public enough for aggressive underwriting."
          tone: risk
          claimRefs: [CV013, CV014, CV016]
        - id: call
          label: Recommendation = track
          detail: "Stay engaged, but require a reset entry price or private diligence that proves premium-quality economics."
          tone: warning
          claimRefs: [CV014, CV016]
    approximationNotes: >-
      The node ordering is analytical, not a measured conversion path or a
      probability model.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV007, CV011, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Track, because price sensitivity dominates the conclusion
    body: >-
      Gong looks like a real scaled winner, but the public underwriting window
      is still anchored by an old 2021 primary round and a compressed 2025
      secondary reference rather than by fresh unit-economics disclosure.
    claimRefs: [CV001, CV002, CV004, CV005, CV014]
  - calloutType: risk
    title: What would change the view
    body: >-
      A move from track to buy needs verified private evidence on retention,
      gross margin, burn, and liquidation preferences, plus a fresh market
      price that shows the business can earn back a premium multiple.
    claimRefs: [CV007, CV013, CV016]
