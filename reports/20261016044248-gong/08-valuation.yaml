company:
  name: Gong
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still supports a track recommendation rather than a buy.
    Gong shows real scale and product momentum, but the clean public valuation
    markers remain a stale $7.25B 2021 primary round and an approximately $4.5B
    late-2025 secondary reference, while retention, margin, and preference-stack
    disclosure remain private.
sections:
  - id: recommendation-price-discipline
    title: Recommendation and price discipline
    body: >-
      The business quality signal is real: public references point to Gong
      clearing $500M ARR in May 2026, serving more than 5,000 organizations,
      and still shipping meaningful platform extensions in late 2026. That is
      enough to justify continued diligence, but not enough to justify paying
      against the 2021 headline valuation without fresher underwriting support.
      The only explicit public value markers are the 2021 Series E at $7.25B
      and a late-2025 secondary reference around $4.5B. Because key return
      drivers such as retention, gross margin, cash generation, and preference
      stack remain undisclosed, the defensible public stance is track: stay
      engaged, but require either a reset entry price or private diligence that
      proves the business can support a premium multiple.
    claimRefs: [CV001, CV002, CV004, CV005, CV011, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-context-and-thesis-balance
    title: Valuation context and thesis balance
    body: >-
      Public evidence supports both a credible positive thesis and a clear
      anti-thesis. On the positive side, Gong appears to have real category
      scale, premium enterprise positioning, and a product roadmap broad enough
      to defend expansion into forecasting, enablement, and workflow
      automation. On the negative side, the premium seat-and-module pricing can
      create budget friction, independent commentary points to 2022-2023
      retention pressure before reacceleration, and lower-cost bundle options
      from CRM-native AI or integrated Clari-plus-Salesloft style stacks can
      compress willingness to pay. The Israeli AI ecosystem that helped produce
      Gong remains strategically relevant, but that backdrop is supporting
      context rather than a valuation anchor by itself. That balance argues for
      underwriting Gong as
      a strong asset whose price still matters: the company may deserve a
      healthy software multiple, but public evidence does not yet justify
      paying up to reclaim the old 2021 mark.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-exit-readiness-and-final-asks
    title: Scenarios, exit readiness, and final diligence asks
    body: >-
      The bull, base, and bear cases all hinge on facts that public evidence
      only partially resolves. The bull case requires the current ARR scale to
      translate into durable retention, margin, and cash-generation quality,
      plus proof that late-2026 product expansion can deepen platform share
      without spiking cost of sale. The base case assumes the company remains a
      scaled category leader but is still valued off a compressed private-market
      reference until the next financing, tender, or audited IPO filing resets
      the benchmark. The bear case is that budget pressure, bundle competition,
      and product-friction signals expose the 2025 secondary as optimistic
      rather than conservative. Komo's profile suggests an IPO is not imminent
      in 2026, so the most important next step is not speed but evidence
      quality: retention, margin, burn, and preference terms need to be
      inspected before converting this chapter from track to buy.
    claimRefs: [CV002, CV008, CV010, CV012, CV013, CV014, CV016]
    tableRefs: [TV003]
