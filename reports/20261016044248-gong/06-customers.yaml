      - [Experian, "Large enterprise / data and credit services", "AI-driven platform used to improve coaching, continuity, and renewal-risk decisions", production, "25% lift in win rates after consolidating a division built from four acquisitions", "No independent procurement record or disclosed baseline in the retained evidence"]
