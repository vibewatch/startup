schemaVersion: report-v2
artifact: customers
slug: gong
runDate: 2026-10-16
company:
  name: Gong
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports real enterprise adoption: Gong says it helps more than
    5,000 organizations, G2 shows a large verified-review base, and Gong's 2026
    customer conference highlighted quantified outcomes from AT&T Business, Cisco,
    and Experian. The same evidence set is much weaker on durability, because public
    sources do not disclose NRR, GRR, logo churn, contract terms, or customer concentration.
sections:
  - id: buyer-segmentation-and-usage-breadth
    title: Buyer segmentation and usage breadth
    body: >-
      The retained evidence consistently points to Gong's strongest fit being
      complex B2B revenue organizations rather than small teams. Independent reviews
      repeatedly frame the product for mid-market and enterprise sales motions with
      enough call volume, deal complexity, and managerial process to justify a
      premium workflow layer. That installed-base picture is reinforced by Gong's
      own claim that it serves more than 5,000 organizations and by G2's unusually
      large verified-review corpus. Usage is also broader than frontline sellers:
      the third-party review set includes marketing, customer success, RevOps, and
      developer-style users relying on recordings, summaries, forecasting, and
      conversation data as an operating input rather than a point feature.
    claimRefs: [CU001, CU002, CU003, CU004, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof-and-adoption-trajectory
    title: Named proof and adoption trajectory
    body: >-
      Public customer proof is strongest when Gong showcases scaled enterprise
      outcomes. The clearest quantified examples in this pool come from Gong's
      September 2026 conference coverage: AT&T Business reported a 54% productivity
      improvement from scorecards, call reviews, and manager feedback; Cisco said
      it had rolled Gong out to 18,000 licenses and more than 450,000 conversations,
      with early-adopting teams showing larger deal sizes and higher win rates; and
      Experian reported a 25% win-rate lift after consolidating a division around
      one AI-driven platform. Those examples indicate real production usage and
      land-and-expand potential, but they remain company-curated showcase evidence
      rather than independent procurement records, audited case studies, or
      customer-authored reference material.
    claimRefs: [CU005, CU006, CU007, CU012]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-friction
    title: Durability, expansion, and friction
    body: >-
      The adoption story should not be overstated into proven durability. The
      evidence does show plausible cross-functional expansion into marketing,
      customer success, account management, and post-sales workflows, but it also
      shows meaningful adoption friction: reviews describe steep onboarding, a
      learning curve, integration overhead, and weaker ROI for low-volume teams.
      Pricing is consistently described as opaque and annual-contract based, while
      competitor messaging emphasizes the extra vendor, security-review, and budget
      burden of adding a standalone conversation-intelligence layer. Most
      importantly, none of the retained public sources establishes NRR, GRR, churn,
      average contract length, or customer concentration, so renewal quality and
      concentration risk remain open diligence items.
    claimRefs: [CU008, CU009, CU010, CU011, CU013]
