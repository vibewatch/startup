schemaVersion: report-v2
artifact: financials
slug: gong
runDate: 2026-10-16
company:
  name: Gong
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a large, premium-priced recurring-software business with more
    than $500 million of ARR, but the evidence is mostly quote-based pricing, company-claimed
    scale, and third-party estimates rather than audited operating metrics. The underwriting
    question is therefore not whether Gong has commercial traction, but whether its realized
    pricing, margins, and cash position are strong enough to justify continued standalone
    spending against cheaper bundled alternatives.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing quality
    body: >-
      Public sources consistently describe Gong as a quote-based annual subscription business
      built around paid user seats, a mandatory platform fee, and separately priced module
      attach for products such as Forecast, Engage, and Enable. That architecture supports a
      classic land-and-expand software model, but it also means most public pricing evidence is
      indirect: third-party list ranges, buyer anecdotes, and one median contract datapoint
      from Vendr rather than company-disclosed realized ASPs. The result is enough evidence to
      conclude that Gong monetizes a large recurring software base, but not enough to conclude
      what blended realized pricing, discounting, or module-level revenue mix actually look
      like across its installed base.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: sales-motion-and-unit-economics
    title: Sales motion and public unit-economics proxies
    body: >-
      The clearest public proxy for Gong's go-to-market design is customer fit: multiple
      sources place the product in larger, process-heavy revenue organizations where deployment,
      forecasting, and coaching breadth justify a standalone platform purchase. Those same
      sources also show why unit economics are harder to underwrite from the outside. Claap's
      buyer-call synthesis shows real willingness to pay, but Docket and Debriefing both frame
      the product as operationally heavy and premium-priced, with ongoing tracker maintenance
      and non-trivial implementation work. That suggests revenue durability is tied less to
      lightweight seat expansion and more to whether Gong remains valuable enough to survive
      procurement scrutiny versus CRM-native and lower-cost substitutes.
    claimRefs: [CI005, CI006, CI007, CI008, CI012, CI013]
    tableRefs: [TI003]
  - id: capital-adequacy-and-balance-sheet-visibility
    title: Capital adequacy and balance-sheet visibility
    body: >-
      Public coverage is good enough to reconstruct Gong's historical funding and recent
      valuation reset, but not its current liquidity. Multiple third-party datasets converge on
      roughly $583 million to $584 million of cumulative funding and identify May 2021 as the
      last primary round. Sacra and Komo also describe the late-2025 price point as a
      secondary transaction, which is important because secondary liquidity helps employees and
      investors but does not itself add balance-sheet cash. That leaves a central diligence
      blocker unresolved: public sources show scale and enterprise adoption, yet do not
      disclose current cash, burn, debt, or runway, so capital adequacy cannot be underwritten
      from public evidence alone.
    claimRefs: [CI009, CI010, CI011]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The current public record supports a favorable view on revenue quality at the top of the
      funnel: Gong appears to have meaningful enterprise traction, recurring contract structure,
      and credible module expansion opportunities. The same record is materially weaker on the
      variables that determine whether that traction compounds into attractive venture outcomes:
      realized discounts, gross margin by module, CAC efficiency, net retention, customer
      concentration, and current liquidity. In practice this means Gong can be screened as a
      scaled late-stage software asset, but not fully underwritten. The next diligence step is
      a management or data-room package that ties quoted pricing and ARR claims to audited
      revenue mix, margin, retention, and cash-runway disclosures.
    claimRefs: [CI011, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Core platform subscription
        - Annual Standard-seat software subscription for recorded revenue-team users
        - per paid user per year
        - Active; quote based rather than self-serve
        - Recurring and scalable, but realized ASP is undisclosed
        - Provide current paid-seat count, blended ASP, and renewal cohorts
      - - Platform fee
        - Mandatory account-level fee layered on top of seat subscriptions
        - account per year
        - Active; third-party range of $5k-$50k
        - Recurring fixed component, but negotiated schedule is private
        - Provide current fee schedule by customer-size band
      - - Module attach
        - Separate paid modules for Forecast, Engage, and Enable expand ARPU
        - per user per year
        - Active; half of customers reportedly use more than one product
        - Attractive mix lever if attach and retention are strong
        - Provide module attach, cross-sell conversion, and module churn by cohort
      - - Implementation and onboarding
        - Up-front deployment and setup charges attached to new deals
        - per deployment
        - Active; public estimates range from $7.5k to $65k+
        - Lower-quality evidence and unclear revenue-recognition treatment
        - Clarify whether services are recognized by Gong or partners and at what margin
    notes: >-
      Public pricing is quote-based and mostly third-party; ranges are directional, not audited
      realized pricing, and nulls would indicate undisclosed private metrics rather than zero.
    claimRefs: [CI001, CI002, CI004, CI005]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / term
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Median contract
        - $55,359 per year across 593 Vendr purchases
        - Realized marketplace datapoint, not official list pricing
        - Contract scope, seat count, and modules not fully disclosed
        - Claap
      - - Foundation / base tier
        - ~$1,400-$1,600 per user per year
        - Third-party quoted list range
        - Negotiated pricing can land lower by contract size and term
        - Docket; Komo
      - - Full software bundle
        - ~$2,880-$3,000 per user per year before platform fee
        - Third-party quoted bundle range
        - Depends on Engage and Forecast attach; Enable still quote based
        - Docket
      - - Platform + onboarding
        - Platform fee ~$5,000-$50,000 per year; implementation $7,500+ to $65,000+
        - Quote-only commercial terms
        - Contract term, auto-renewal uplift, and early termination clauses remain private
        - Komo; Docket
    notes: >-
      This table mixes list-style third-party ranges with one realized contract datapoint, so
      it shows monetization structure rather than a clean realized-price schedule.
    claimRefs: [CI001, CI002, CI003]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR scale
        - "> $500M ARR in May 2026"
        - Medium
        - Confirms scale, but not GAAP revenue mix or quality
        - Reconcile ARR to audited revenue and deferred revenue
      - - Growth
        - ">55% year-over-year growth in May 2026"
        - Medium
        - Indicates strong momentum, but source is company-claimed and unaudited
        - Provide monthly ARR bridge and churn / expansion split
      - - Customer base / attach
        - ">5,000 companies; half of customers reportedly use more than one product"
        - Medium
        - Suggests breadth and cross-sell potential
        - Provide customer concentration and module-attach by cohort
      - - Deployment burden
        - 4-8 week implementation; public reports of 40+ hours per month to maintain trackers
        - Medium
        - Implies onboarding cost and ongoing customer-success load
        - Provide services gross margin, implementation staffing, and support ratios
      - - Cash, burn, runway, CAC, payback, gross margin, NRR
        - null
        - Low
        - Core underwriting metrics are not disclosed publicly
        - Provide board or lender package with current cash, burn, retention, and efficiency KPIs
    notes: >-
      Null means the metric is not supported by the reviewed public sources, not that the value
      is zero or immaterial.
    claimRefs: [CI005, CI008, CI009, CI010, CI011, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Gong's revenue path starts with paid seats and account fees, then expands through module
      attach and renewals, while implementation and operating burden shape gross-profit quality.
    data:
      nodes:
        - id: target-account
          label: Target account profile
          detail: Enterprise revenue team with enough scale to absorb a standalone platform
        - id: paid-seats
          label: Annual paid-seat subscription
          detail: Quote-based Standard-seat contracts monetize recorded users
        - id: platform-fee
          label: Mandatory platform fee
          detail: Fixed annual account charge layered on top of seat pricing
        - id: module-attach
          label: Forecast / Engage / Enable attach
          detail: Separate add-ons raise ARPU and expand contract scope
        - id: implementation
          label: Implementation and RevOps burden
          detail: Deployment, tracker upkeep, and support effort affect time-to-value
        - id: renewal-margin
          label: Renewal revenue and gross-profit quality
          detail: Retention, discounting, and support intensity determine durable economics
      edges:
        - from: target-account
          to: paid-seats
          label: Team size and process complexity drive seat demand
        - from: paid-seats
          to: platform-fee
          label: Core subscription is sold with account-level fees
        - from: platform-fee
          to: module-attach
          label: Cross-sell expands annual contract value
        - from: module-attach
          to: implementation
          label: More modules increase deployment and operating complexity
        - from: implementation
          to: renewal-margin
          label: Customer ROI and support burden influence renewal quality
    approximationNotes: >-
      This is a qualitative bridge rather than a numeric waterfall because public sources do not
      disclose enough realized pricing, cost, or margin data to reconcile a cumulative model.
    claimRefs: [CI001, CI002, CI004, CI007, CI008, CI014]
