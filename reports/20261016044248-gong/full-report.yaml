  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              The market boundary is narrower than “all sales AI.” Gong’s own category framing centers on software that
              captures and analyzes calls, emails, meetings, and related interactions so revenue teams can coach reps,
              inspect deals, forecast pipeline, and coordinate customer-facing execution. Public descriptions also show
              the platform expanding into engagement, enablement, and account-management workflows, but still with
              conversation data as the anchor rather than as a generic productivity assistant. Just as important, the
              available sources are explicit about what is outside scope: top-of-funnel contact databases, native
              buyer-intent feeds, anonymous web-visitor resolution, and external competitive-intelligence crawling. That
              means the practical market definition is conversation-led revenue execution and adjacent workflow
              software, with prospecting data, visitor intelligence, and dedicated external CI tools remaining
              substitute or complementary categories rather than part of Gong’s natural spend pool.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM006
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is fit-bounded rather than dollar-bounded. The strongest independent evidence does
              not offer TAM/SAM/SOM calculations with transparent denominators; instead, it repeatedly narrows Gong’s
              addressable market through deployment heuristics such as 10+ quota-carrying reps, 25+ revenue-facing
              employees, multi-stakeholder deal cycles, and RevOps readiness. Those filters matter because Gong’s
              commercial model is not lightweight: public reviews describe quote-based pricing, platform fees,
              implementation effort, and annual commitments that make subscale deployments harder to justify. Tracxn’s
              large competitor count and multiple 5,000+ installed-base references show a broad market adjacency and
              meaningful current penetration, but they do not solve the missing denominator problem. Net result: the
              current evidence supports a practical buyer-fit ladder, not a reproducible spend-based market model.
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM013
