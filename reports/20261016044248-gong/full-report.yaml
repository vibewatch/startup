      - number: '6.3'
        title: Durability, expansion, and friction
        blocks:
          - type: paragraph
            body: >-
              The adoption story should not be overstated into proven durability. The evidence does show plausible
              cross-functional expansion into marketing, customer success, account management, and post-sales workflows,
              but it also shows meaningful adoption friction: reviews describe steep onboarding, a learning curve,
              integration overhead, and weaker ROI for low-volume teams. Pricing is consistently described as opaque and
              annual-contract based, while competitor messaging emphasizes the extra vendor, security-review, and budget
              burden of adding a standalone conversation-intelligence layer. Most importantly, none of the retained
              public sources establishes NRR, GRR, churn, average contract length, or customer concentration, so renewal
              quality and concentration risk remain open diligence items.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU011
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is strongest at enterprise scale
            body: >-
              Gong's public evidence is materially better at showing large-enterprise deployments and broad user
              feedback than at proving downmarket fit. The visible ROI story starts once teams have enough call volume,
              management process, and integration discipline to operationalize the product.
            calloutType: insight
            claimRefs:
              - CU002
              - CU004
              - CU006
          - type: callout
            title: Durability is still under-documented
            body: >-
              The retained sources do not disclose net revenue retention, gross retention, logo churn, average contract
              term, or customer concentration. That leaves a gap between evidence of real adoption and evidence of
              durable, efficient expansion economics.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Recording-consent and data-governance risk remain customer-side obligations
        blocks:
          - type: paragraph
            body: >-
              The clearest legal risk in the public record is that Gong's core product depends on capturing and
              analyzing calls, meetings, and emails across jurisdictions where consent, retention, and data-processing
              rules vary. Gong says security, privacy, and compliance are built in, and third-party reviews confirm that
              the product offers consent tools, DPAs, and data residency options, but those same sources also state that
              GDPR and similar recording obligations remain the customer's responsibility and often require legal review
              before deployment. That means underwriting should treat compliance maturity as a go-live blocker, not a
              marketing claim: if diligence cannot verify jurisdiction-specific consent workflows, retention settings,
              and acceptable model-governance language for regulated customers, the risk remains high even if the
              software is otherwise feature-complete. A practical kill criterion is failure to clear legal/security
              review for the target customer base within the initial pilot scope.
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR011
              - CR012
      - number: '7.2'
        title: Forecasting value is real, but only if integration, data hygiene, and adoption all work
        blocks:
          - type: paragraph
            body: >-
              Gong's operational risk is a classic enterprise-software problem: the product can automate CRM updates and
              surface deal-risk signals, but the same evidence set shows that those outputs are only as reliable as the
              recorded channels, CRM hygiene, and manager adoption behind them. Independent reviews describe 30-90 day
              implementation cycles, cumbersome navigation, information overload, false alarms in health scores, and
              occasional transcription or insight-quality misses; several user reviews also say integrations and
              synchronization take more effort than expected. In practice, Gong is not a turnkey autonomous system but a
              diagnostic layer that still needs human validation and disciplined workflow design. The diligence question
              is therefore not whether Gong can generate insights, but whether the company or prospective customers can
              operationalize those insights at acceptable cost and speed. A measurable break trigger would be pilots
              that fail to reach stable CRM sync, manager usage, and acceptable false-positive rates inside the first
              quarter.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
              - CR011
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR009
              - CR010
              - CR012
      - number: '7.3'
        title: Premium pricing, substitution pressure, and stale external price discovery raise underwriting risk
        blocks:
          - type: paragraph
            body: >-
              Commercially, the public evidence supports Gong as a premium enterprise purchase rather than a lightweight
              tool: multiple independent sources cluster around roughly $100-$200 per user per month, additional
              platform or implementation fees, annual contracting, and weak ROI for very small teams. That pricing
              profile creates three linked risks. First, adoption can stall when smaller organizations or low-volume
              teams cannot justify the spend. Second, CRM-native and adjacent suites from Salesforce, HubSpot, and Clari
              plus Salesloft can compress willingness to pay by offering a "good enough" bundled workflow. Third, the
              newest financing anchor in the assigned pool is still Gong's May 2021 Series E at a $7.25 billion
              post-money valuation, so investors do not have current public evidence for cash position, burn, or a
              refreshed market-clearing price. Until diligence closes those gaps, the investment case should assume
              valuation sensitivity and require explicit downside monitoring rather than extrapolating from category
              leadership alone.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The business quality signal is real: public references point to Gong clearing $500M ARR in May 2026,
              serving more than 5,000 organizations, and still shipping meaningful platform extensions in late 2026.
              That is enough to justify continued diligence, but not enough to justify paying against the 2021 headline
              valuation without fresher underwriting support. The only explicit public value markers are the 2021 Series
              E at $7.25B and a late-2025 secondary reference around $4.5B. Because key return drivers such as
              retention, gross margin, cash generation, and preference stack remain undisclosed, the defensible public
              stance is track: stay engaged, but require either a reset entry price or private diligence that proves the
              business can support a premium multiple.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV011
              - CV014
              - CV016
      - number: '8.2'
        title: Valuation context and thesis balance
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports both a credible positive thesis and a clear anti-thesis. On the positive side,
              Gong appears to have real category scale, premium enterprise positioning, and a product roadmap broad
              enough to defend expansion into forecasting, enablement, and workflow automation. On the negative side,
              the premium seat-and-module pricing can create budget friction, independent commentary points to 2022-2023
              retention pressure before reacceleration, and lower-cost bundle options from CRM-native AI or integrated
              Clari-plus-Salesloft style stacks can compress willingness to pay. The Israeli AI ecosystem that helped
              produce Gong remains strategically relevant, but that backdrop is supporting context rather than a
              valuation anchor by itself. That balance argues for underwriting Gong as a strong asset whose price still
              matters: the company may deserve a healthy software multiple, but public evidence does not yet justify
              paying up to reclaim the old 2021 mark.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.3'
        title: Scenarios, exit readiness, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases all hinge on facts that public evidence only partially resolves. The bull
              case requires the current ARR scale to translate into durable retention, margin, and cash-generation
              quality, plus proof that late-2026 product expansion can deepen platform share without spiking cost of
              sale. The base case assumes the company remains a scaled category leader but is still valued off a
              compressed private-market reference until the next financing, tender, or audited IPO filing resets the
              benchmark. The bear case is that budget pressure, bundle competition, and product-friction signals expose
              the 2025 secondary as optimistic rather than conservative. Komo's profile suggests an IPO is not imminent
              in 2026, so the most important next step is not speed but evidence quality: retention, margin, burn, and
              preference terms need to be inspected before converting this chapter from track to buy.
            claimRefs:
              - CV002
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, because price sensitivity dominates the conclusion
            body: >-
              Gong looks like a real scaled winner, but the public underwriting window is still anchored by an old 2021
              primary round and a compressed 2025 secondary reference rather than by fresh unit-economics disclosure.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV014
          - type: callout
            title: What would change the view
            body: >-
              A move from track to buy needs verified private evidence on retention, gross margin, burn, and liquidation
              preferences, plus a fresh market price that shows the business can earn back a premium multiple.
            calloutType: risk
            claimRefs:
              - CV007
              - CV013
              - CV016
