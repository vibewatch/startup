      - number: '3.2'
        title: Capability and pricing tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The clearest direct comparison is not "Gong versus everyone" but Gong versus a few different buying
              motions. Clari is strongest when a RevOps-led buyer values forecast control and revenue-database breadth;
              Salesloft is strongest when the team wants SDR-to-AE workflow plus more transparent packaging; Chorus
              becomes more compelling when ZoomInfo bundle economics and contact-data enrichment matter; and Gong keeps
              its edge when the buyer wants the sharpest conversation analysis and coaching depth in one premium
              platform. Public price signals reinforce that segmentation: Gong and Clari remain mostly custom-priced,
              while Salesloft publishes clearer tiers and Chorus is often framed as lower-cost inside ZoomInfo accounts.
            claimRefs:
