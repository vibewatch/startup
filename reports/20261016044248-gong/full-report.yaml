  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and category boundaries
        blocks:
          - type: paragraph
            body: >-
              Gong does not compete in a single tidy peer group. Independent market maps and buyer-shortlist guides show
              overlap with revenue-intelligence suites, sales-engagement platforms, bundled data-plus-conversation
              products, dedicated competitive-intelligence tools, and CRM-native AI features. That matters because the
              buyer is often choosing which workflow to consolidate first, not simply which call-recording vendor to
              swap in. Gong's strongest position remains the premium end of buyer-conversation analysis, while its
              weaker zones are external competitor monitoring, cheaper SMB-oriented deployments, and cases where a team
              already prefers forecasting or outbound execution to be the system of record.
