      - CI007
      - CI008
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Gong appears to sit on top of communications and CRM systems, then layers analysis and revenue workflows over
      captured interactions.
    data:
      layers:
        - label: Interaction capture
          summary: Bots and connectors capture customer conversations from existing communication channels.
          modules:
            - Zoom / Google Meet / Microsoft Teams
            - Email and meeting timeline capture
          outputs:
            - Recorded interactions linked to people and deals
        - label: Record matching and context assembly
          summary: Captured interactions are attached to accounts, opportunities, users, and activity history.
          modules:
            - CRM object matching
            - Activity timelines and account context
          outputs:
            - Deal-linked engagement histories
        - label: Conversation intelligence
          summary: Transcription and topic extraction turn raw interactions into searchable signals.
          modules:
            - Transcripts, summaries, and search
            - Topic, objection, competitor, and sentiment-style tagging
          outputs:
            - Structured call intelligence for review and coaching
        - label: Revenue workflow applications
          summary: Managers and reps consume the interaction graph through forecasting, deal, and coaching surfaces.
          modules:
            - Deal boards and forecast views
            - Coaching and enablement surfaces
          outputs:
            - Risk flags and manager review context
        - label: Automation and assistant layer
          summary: Newer 2025-2026 surfaces try to turn analysis into guided next steps and workflow execution.
          modules:
            - Engage, Assistant, and agent workflows
            - MCP or workflow-connected prompts
          outputs:
            - Follow-up drafts and guided next actions
        - label: System-of-record extensions
          summary: Gong extends existing GTM systems instead of replacing them.
          modules:
            - CRM sync and analytics exports
            - Slack, API, and MCP-connected downstream workflows
          outputs:
            - Updated opportunity context and downstream reporting
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE013
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Gong's observable adoption motion starts with enterprise sales-team fit, requires meaningful rollout effort, and
      then expands into manager, RevOps, and post-sales workflows when the deployment sticks.
    data:
      items:
        - label: Target fit screening
          actor: Sales leadership / RevOps
          touchpoints:
            - Enterprise and mid-market B2B revenue teams are the clearest fit.
            - Independent reviews anchor ROI to 10+ or 50+ rep teams with complex deals.
        - label: Budget and procurement approval
          actor: Finance / RevOps / IT
          touchpoints:
            - Pricing is typically custom, opaque, and sold on annual or multi-year contracts.
            - Standalone deployment can trigger extra vendor, integration, and security-review work.
        - label: Core call-intelligence rollout
          actor: Reps and managers
          touchpoints:
            - Recording, transcription, search, summaries, and call review form the first value layer.
            - Managers use scorecards and coaching workflows to turn conversation data into action.
        - label: Operating-rhythm adoption
          actor: Managers / revenue leaders
          touchpoints:
            - Forecasting, deal inspection, and pipeline risk monitoring deepen daily usage.
            - Large review volume on G2 suggests the platform is widely embedded in operating workflows.
        - label: Cross-functional expansion
          actor: Marketing / CS / account teams
          touchpoints:
            - Marketing teams use Gong data for messaging and attribution feedback loops.
            - Customer-success and post-sales workflows appear in both product explainers and user reviews.
        - label: Scaled enterprise standardization
          actor: Enterprise admins / executives
          touchpoints:
            - AT&T Business, Cisco, and Experian are public examples of production use with quantified outcomes.
            - Public proof is strongest for showcased enterprises, while retention and concentration remain undisclosed.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU006
      - CU008
      - CU009
      - CU010
      - CU012
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Public evidence points to legal/governance and deployment execution as the highest residual-risk clusters.
    data:
      columns:
        - label: Likelihood
          note: Public-evidence view, not a company probability model.
        - label: Impact
        - label: Mitigation maturity
      rows:
        - label: Recording consent / privacy
          values:
            - label: High
              tone: high
              note: Customer remains responsible for compliant consent and processing workflows.
            - label: High
              tone: critical
              note: Failed legal clearance can block deployment in target accounts.
            - label: Medium
              tone: warning
              note: Tools exist, but the assigned pool does not prove end-to-end policy clearance.
        - label: Forecast reliability / data hygiene
          values:
            - label: High
              tone: high
              note: Multiple sources say CRM quality and recorded-channel coverage drive output quality.
            - label: High
              tone: high
              note: Bad signals can distort forecasts, prioritization, and coaching.
            - label: Medium
              tone: warning
              note: Mitigation depends on workflow discipline more than an automatic product safeguard.
        - label: Implementation / adoption ROI
          values:
            - label: High
              tone: high
              note: Independent reviews cite multi-week setup and adoption effort.
            - label: Medium-High
              tone: risk
              note: Slow time-to-value reduces payback and expansion confidence.
            - label: Medium
              tone: warning
              note: Mitigations exist but require manager behavior change and enablement.
        - label: Bundling pressure / stale valuation anchor
          values:
            - label: Medium
              tone: warning
              note: Competition from bundled suites is real but not existential in the assigned evidence.
            - label: Medium-High
              tone: risk
              note: Separate-seat pricing and limited public financing freshness increase underwriting sensitivity.
            - label: Low-Medium
              tone: neutral
              note: Public mitigation evidence is limited to product differentiation and category leadership claims.
        - label: Transcription / AI insight quality
          values:
            - label: Medium
              tone: warning
              note: User reviews cite occasional transcription misses and inconsistent recommendations.
            - label: Medium
              tone: warning
              note: Quality misses can reduce trust in coaching and risk alerts.
            - label: Medium
              tone: warning
              note: Human validation remains necessary for consequential use cases.
        - label: Small-team ROI mismatch
          values:
            - label: High
              tone: high
              note: Several reviewers say the product is best suited to larger teams and complex deal cycles.
            - label: Medium
              tone: warning
              note: Poor segment fit weakens expansion and renewal economics rather than the core product.
            - label: Medium
              tone: warning
              note: ICP discipline can mitigate this risk, but only if go-to-market remains selective.
    approximationNotes: >-
      Heatmap labels summarize severity implied by the assigned source pool rather than a disclosed internal scoring
      rubric.
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR007
      - CR009
      - CR010
      - CR012
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public scale proof is strong, but price discipline still dominates the recommendation because the clean valuation
      anchors are old or compressed.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: $500M+ ARR and 5,000+ organizations indicate real market fit.
          tone: positive
          claimRefs:
            - CV004
            - CV005
        - id: product-breadth
          label: Product breadth
          detail: Late-2026 launches extend Gong beyond core conversation intelligence.
          tone: positive
          claimRefs:
            - CV011
            - CV012
        - id: premium-economics
          label: Premium economics
          detail: Seat pricing, platform fees, and module fees can work well for enterprise land-and-expand accounts.
          tone: neutral
          claimRefs:
            - CV006
            - CV007
        - id: compressed-marker
          label: Compressed marker
          detail: The explicit public price signal moved from $7.25B in 2021 to about $4.5B in late 2025.
          tone: warning
          claimRefs:
            - CV001
            - CV002
        - id: diligence-gap
          label: Diligence gap
          detail: >-
            Retention, margin, cash-generation, and preference terms are still not public enough for aggressive
            underwriting.
          tone: risk
          claimRefs:
            - CV013
            - CV014
            - CV016
        - id: call
          label: Recommendation = track
          detail: Stay engaged, but require a reset entry price or private diligence that proves premium-quality economics.
          tone: warning
          claimRefs:
            - CV014
            - CV016
    approximationNotes: The node ordering is analytical, not a measured conversion path or a probability model.
    claimRefs:
