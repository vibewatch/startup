              - CE005
              - CE011
              - CE013
      - number: '5.3'
        title: Maturity, execution risks, and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The product appears commercially mature: public sources cite more than 5,000 customers, thousands of
              reviews, over $500 million of ARR or revenue, and more than 2,000 employees. That scale lowers category
              risk, but the operational risks are still material. Reviewer and customer evidence repeatedly says Gong is
              most helpful after the call rather than during it, and that broad functionality can become clutter,
              notification overload, or underused modules when teams lack a strong RevOps owner. Public performance
              claims also vary materially across sources, including transcription accuracy, processing speed, and how
              autonomous the newer AI agent layer really is, so buyers should treat those figures as directional rather
              than audited. The assigned pool is also thin on primary trust, compliance, and developer-ecosystem proof:
              it contains no dedicated security, status, consent-governance, or practitioner-community artifact, which
              leaves important diligence still open before treating the product architecture as fully de-risked.
            claimRefs:
              - CE007
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Adoption risk is operational, not category-level
            body: >-
              The retained 2026 evidence makes Gong look like a scaled, category-leading platform, but it also makes
              clear that value depends on RevOps discipline, CRM hygiene, and enough deal complexity to justify a broad
              post-call workflow stack. Teams below that threshold can still buy a mature product and under-realize it.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segmentation and usage breadth
        blocks:
          - type: paragraph
            body: >-
              The retained evidence consistently points to Gong's strongest fit being complex B2B revenue organizations
              rather than small teams. Independent reviews repeatedly frame the product for mid-market and enterprise
              sales motions with enough call volume, deal complexity, and managerial process to justify a premium
              workflow layer. That installed-base picture is reinforced by Gong's own claim that it serves more than
              5,000 organizations and by G2's unusually large verified-review corpus. Usage is also broader than
              frontline sellers: the third-party review set includes marketing, customer success, RevOps, and
              developer-style users relying on recordings, summaries, forecasting, and conversation data as an operating
              input rather than a point feature.
            claimRefs:
