companyProfile:
  summary: >-
    Gong is a late-stage private revenue-AI platform built around conversation intelligence, forecasting, coaching, and
    adjacent revenue workflows for B2B sales teams. Public evidence shows real scale — more than 5,000 organizations,
    roughly $500M ARR, and a broadening product surface — but current underwriting remains constrained by private
    economics, stale primary valuation evidence, and incomplete governance disclosure.
