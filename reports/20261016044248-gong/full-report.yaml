      - number: '5.2'
        title: Operating model, architecture, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The retained sources point to a layered operating model. Gong connects to communications systems such as
              Zoom, Google Meet, Microsoft Teams, Gmail, Outlook, and email services, then links captured interactions
              back to CRM objects in Salesforce, HubSpot, Microsoft Dynamics, and adjacent tools. Conversation data is
              processed into transcripts, summaries, topic tags, objections, competitor mentions, and activity signals,
              which then feed downstream deal boards, forecasting views, coaching scorecards, alerts, and analytics
              exports. In practice, that means Gong does not replace the system of record; it depends on an existing
              sales stack and on reasonably clean data flows into and out of CRM. The strongest public product proof is
              the breadth of this interaction-centric workflow and its integrations, not an independently benchmarked
              claim that every AI layer is autonomous or real-time.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE011
              - CE013
