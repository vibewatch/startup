            body: >-
              Public customer proof is strongest when Gong showcases scaled enterprise outcomes. The clearest quantified
              examples in this pool come from Gong's September 2026 conference coverage: AT&T Business reported a 54%
              productivity improvement from scorecards, call reviews, and manager feedback; Cisco said it had rolled
              Gong out to 18,000 licenses and more than 450,000 conversations, with early-adopting teams showing larger
              deal sizes and higher win rates; and Experian reported a 25% win-rate lift after consolidating a division
              around one AI-driven platform. Those examples indicate real production usage and land-and-expand
              potential, but they remain company-curated showcase evidence rather than independent procurement records,
              audited case studies, or customer-authored reference material.
