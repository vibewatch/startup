      - number: '2.3'
        title: Buyer, user, and budget-owner segmentation
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation is clearer than market-size math. Across official and independent descriptions, Gong’s
              recurring users are reps, managers, RevOps teams, executive sales leaders, customer-success operators, and
              enablement teams who need a shared record of what happened in customer conversations. The value
              proposition is strongest when those stakeholders need one system of record for coaching, deal inspection,
              forecasting, and handoffs across functions; Gong’s own materials tie that to near-complete interaction
              capture, while review data suggests the product’s productivity value is real but can become noisy if the
              organization lacks process discipline. That combination makes budget ownership directional rather than
              universal: CRO and RevOps budgets are the clearest center of gravity, with enablement and customer-success
              budgets relevant where coaching or post-sales intelligence drives the purchase.
            claimRefs:
              - CM003
