      - number: '4.3'
        title: Capital adequacy and balance-sheet visibility
        blocks:
          - type: paragraph
            body: >-
              Public coverage is good enough to reconstruct Gong's historical funding and recent valuation reset, but
              not its current liquidity. Multiple third-party datasets converge on roughly $583 million to $584 million
              of cumulative funding and identify May 2021 as the last primary round. Sacra and Komo also describe the
              late-2025 price point as a secondary transaction, which is important because secondary liquidity helps
              employees and investors but does not itself add balance-sheet cash. That leaves a central diligence
              blocker unresolved: public sources show scale and enterprise adoption, yet do not disclose current cash,
              burn, debt, or runway, so capital adequacy cannot be underwritten from public evidence alone.
            claimRefs:
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The current public record supports a favorable view on revenue quality at the top of the funnel: Gong
              appears to have meaningful enterprise traction, recurring contract structure, and credible module
              expansion opportunities. The same record is materially weaker on the variables that determine whether that
              traction compounds into attractive venture outcomes: realized discounts, gross margin by module, CAC
              efficiency, net retention, customer concentration, and current liquidity. In practice this means Gong can
              be screened as a scaled late-stage software asset, but not fully underwritten. The next diligence step is
              a management or data-room package that ties quoted pricing and ARR claims to audited revenue mix, margin,
              retention, and cash-runway disclosures.
            claimRefs:
              - CI011
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and buyer fit
        blocks:
          - type: paragraph
            body: >-
              Gong is consistently described as software for revenue teams rather than a generic meeting recorder:
              third-party reviews, analytics explainers, and market profiles all center on the same workflow of
              recording sales calls, meetings, and emails, then turning those interactions into searchable intelligence
              for managers and reps. The retained evidence also shows that the product surface has expanded beyond a
              single conversation-intelligence module into adjacent layers such as deal inspection, forecasting,
              engagement, coaching, and newer agent or assistant surfaces. That breadth matters for underwriting because
              it helps explain why Gong looks strongest in larger, process-heavy B2B sales organizations with dedicated
              RevOps and large call volume: a company can justify the platform when multiple teams reuse the same
              captured interaction graph, but lighter teams can still buy the full stack and use only a small subset of
              it.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE008
