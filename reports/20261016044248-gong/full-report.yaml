      - number: '4.2'
        title: Sales motion and public unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The clearest public proxy for Gong's go-to-market design is customer fit: multiple sources place the
              product in larger, process-heavy revenue organizations where deployment, forecasting, and coaching breadth
              justify a standalone platform purchase. Those same sources also show why unit economics are harder to
              underwrite from the outside. Claap's buyer-call synthesis shows real willingness to pay, but Docket and
              Debriefing both frame the product as operationally heavy and premium-priced, with ongoing tracker
              maintenance and non-trivial implementation work. That suggests revenue durability is tied less to
              lightweight seat expansion and more to whether Gong remains valuable enough to survive procurement
              scrutiny versus CRM-native and lower-cost substitutes.
            claimRefs:
              - CI005
