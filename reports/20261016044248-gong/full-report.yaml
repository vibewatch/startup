      - number: '3.3'
        title: Switching costs, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Gong's moat is not just brand; it is the combination of conversation-data scale, coaching workflows, and
              adjacency into forecasting or engagement. But those advantages do not make it a closed ecosystem. Multiple
              sources suggest high-end buyers often multi-home rather than rip and replace, especially when Gong covers
              call intelligence while Clari owns forecasting or ZoomInfo adds contact-data leverage. Switching costs are
              real because implementation, onboarding, user adoption, and multi-year contract terms make replacement
              expensive, yet those same terms can make Gong vulnerable if customers conclude that CRM-native AI or a
              bundled suite is "good enough" for their actual motion.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
              - CP016
      - number: '3.4'
        title: Adverse signals and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is not that Gong lacks value; it is that value realization is uneven and expensive.
              User reviews praise summaries, call review, and integrations, but also describe clutter, notification
              overload, occasional transcription misses, and sequencing limitations relative to dedicated engagement
              tools. Adjacent analytics commentary also says Gong is incomplete without engineering work, privacy
              controls, and complementary systems for web, marketing, or external-competitor signals. That means a buyer
              can justify Gong in a mature enterprise GTM stack, yet still lose the economic argument in smaller teams,
              privacy-sensitive environments, or organizations that want one cheaper bundle instead of a premium
              specialist plus surrounding tooling.
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-homing is a real outcome, not an edge case
            body: >-
              Buyers at the high end often pair Gong with another system instead of demanding one perfect suite, which
              reduces outright rip-and-replace risk but also caps Gong's wallet share when forecasting or enrichment
              budgets sit elsewhere.
            calloutType: insight
            claimRefs:
              - CP010
              - CP016
          - type: callout
            title: Premium pricing raises both lock-in and displacement risk
            body: >-
              Gong's contract structure, services burden, and implementation effort can increase switching costs, but
              they also create a board-level burden of proof when cheaper bundles or native AI features appear good
              enough.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing quality
        blocks:
          - type: paragraph
            body: >-
              Public sources consistently describe Gong as a quote-based annual subscription business built around paid
              user seats, a mandatory platform fee, and separately priced module attach for products such as Forecast,
              Engage, and Enable. That architecture supports a classic land-and-expand software model, but it also means
              most public pricing evidence is indirect: third-party list ranges, buyer anecdotes, and one median
              contract datapoint from Vendr rather than company-disclosed realized ASPs. The result is enough evidence
              to conclude that Gong monetizes a large recurring software base, but not enough to conclude what blended
              realized pricing, discounting, or module-level revenue mix actually look like across its installed base.
            claimRefs:
