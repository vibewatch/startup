evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      A complete current executive roster, board list, committee structure, voting-control schedule, and succession
      plan.
    whyItMatters: >-
      Founder continuity is visible, but board independence, decision rights, and succession resilience cannot be
      assessed.
    diligencePath: >-
      Request the current org chart, board and committee roster, voting agreement, and succession materials from
      management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited GAAP revenue, gross margin, cash, burn, debt facilities, retention, and cohort economics.
    whyItMatters: ARR and funding history do not establish profitability, cash availability, leverage, or revenue quality.
    diligencePath: Obtain audited financial statements, monthly management accounts, bank and debt schedules, and retention cohorts.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: investor-rights
    missingEvidence: A complete cap table, security preferences, board or observer rights, and post-2021 secondary transaction details.
    whyItMatters: Investor influence and downside protection cannot be inferred from round participation alone.
    diligencePath: Request the fully diluted cap table, charter, investor-rights agreements, and secondary-sale summaries.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: founding
    missingEvidence: Incorporation and operating-history records that reconcile the 2015 and 2016 founding dates.
    whyItMatters: The discrepancy does not change current scale but affects the canonical company chronology.
    diligencePath: Review Gong's incorporation records and management-provided corporate history.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-issued employee count dated to a defined month and reconciled by geography.
    whyItMatters: Public estimates differ by more than 300 employees, limiting cost-base and operating-leverage analysis.
    diligencePath: Request an HRIS headcount export by function and location as of 2026-09-30.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      A transparent TAM/SAM/SOM model that links target segments, geography, spend, and methodology to Gong's actual
      addressable market.
    whyItMatters: >-
      Public evidence supports fit thresholds and installed-base signals, but not reproducible market-size math for
      underwriting long-term valuation expansion.
    diligencePath: >-
      Request management's segmentation model or investor materials that bridge buyer counts to spend by segment and
      geography.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: customer-count
    missingEvidence: >-
      A same-period primary or investor-grade disclosure that defines whether the metric is customers, companies, or
      accounts and fixes the numerator.
    whyItMatters: >-
      Public 4,000+ versus 5,000+ figures change penetration interpretation and make installed-base trend analysis
      noisy.
    diligencePath: >-
      Request a dated KPI deck or management clarification that reconciles the website, review, and profile-page
      customer counts.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: minor
    topic: budget-ownership
    missingEvidence: >-
      Segment-level evidence showing whether Gong is usually purchased out of CRO, RevOps, enablement, or
      customer-success budgets.
    whyItMatters: >-
      Buyer and user roles are well signaled publicly, but segment-level budget ownership affects sales efficiency and
      expansion assumptions.
    diligencePath: >-
      Review procurement documents, named customer case studies, or reference calls that identify the buying center and
      budget approver.
    relatedQuestionRefs:
      - QM004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Cohort-level realized Gong contract data showing base fee, seat floor, add-on attach rate, onboarding cost,
      renewal uplift, and discount range by customer size.
    whyItMatters: >-
      Public sources establish that Gong is premium and contract-heavy, but not what an underwriter should use as
      normalized realized pricing.
    diligencePath: Request anonymized recent customer contracts or procurement summaries segmented by seat band and module mix.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: win-loss
    missingEvidence: >-
      Independent win-loss or procurement evidence comparing Gong against Salesforce Agentforce, Microsoft Copilot for
      Sales, and HubSpot AI in live evaluations.
    whyItMatters: >-
      The chapter can support downmarket substitution pressure, but not quantify how often native AI actually displaces
      Gong in real buying cycles.
    diligencePath: >-
      Collect customer interviews, partner win-loss notes, or procurement records that name finalists and final
      selection reasons.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: minor
    topic: multi-homing
    missingEvidence: >-
      Quantified attach-rate data showing how often Gong coexists with Clari, Salesloft, or ZoomInfo versus replacing
      them outright.
    whyItMatters: The evidence supports multi-homing qualitatively, but not its prevalence by segment or contract size.
    diligencePath: Ask management for current integration attach rates and recent competitive displacement narratives by ARR band.
    relatedQuestionRefs:
      - QP004
      - QP007
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt or credit facilities, and any project-finance or covenant
