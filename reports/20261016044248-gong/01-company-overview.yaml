schemaVersion: report-v2
artifact: company-overview
slug: gong
runDate: 2026-10-16
company:
  name: Gong
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Gong is a founder-led, late-stage private revenue-software company that now markets a broad
    Revenue AI operating system to more than 5,000 organizations. Public evidence supports
    $584M of cumulative funding, a $7.25B 2021 primary valuation, and a roughly $4.5B November
    2025 secondary reference, but current headcount, governance rights, and audited financial
    metrics remain unresolved or conflicting.
sections:
  - id: identity-product-and-stage
    title: Identity, product, and stage
    body: >-
      Gong's current positioning has expanded beyond conversation recording into a Revenue AI
      operating system that captures customer interactions, analyzes deal and rep signals, and
      automates revenue workflows. Its September 2026 launch added Gong Activate, Gong Enrich,
      Agent Builder, and Deep Mode, indicating a deliberate shift from insight delivery toward
      agent-assisted execution. Komo and Debriefing place the headquarters in San Francisco and
      describe a 2015 founding, while Tracxn reports 2016; the founding-year difference should
      remain explicit until incorporation records reconcile the operating and legal timelines.
    claimRefs: [CO001, CO002, CO003, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Public evidence identifies Amit Bendov and Eilon Reshef as co-founders and describes Bendov
      as CEO and Reshef as Chief Product Officer. That continuity supports institutional product
      knowledge and category credibility, but it also concentrates the public strategy narrative
      in two founders. The retained pool does not establish a complete current executive roster,
      board composition, committee structure, voting control, or succession plan. Those omissions
      prevent a firm governance assessment, so the leadership table is intentionally partial and
      treats founder dependence as a diligence question rather than a quantified risk score.
    claimRefs: [CO002, CO004]
    tableRefs: [TO002]
  - id: funding-valuation-and-scale
    title: Funding, valuation, and operating scale
    body: >-
      Third-party sources converge on $584M raised across seven rounds, culminating in a $250M
      Series E at a $7.25B post-money valuation in May 2021. Sacra reports that a November 2025
      secondary transaction valued Gong at $4.5B and provided liquidity to employees and existing
      investors rather than new primary capital; the figure therefore is neither cash available
      nor a new financing round. Scale evidence is strong but not audited: Gong claims more than
      5,000 organizations, Sacra estimates $500M ARR in May 2026, and current headcount sources
      conflict between 2,171 and approximately 2,500 employees.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: diligence-implications
    title: Diligence implications and evidence limits
    body: >-
      The company overview supports substantial commercial scale, but the quality of public
      underwriting evidence is uneven. The assigned sources do not disclose audited GAAP revenue,
      gross margin, cash, burn, debt facilities, retention, or cap-table preference terms. G2's
      customer-review evidence also identifies practical product limitations, including occasional
      transcription errors, cluttered pipeline views, and health scores that can misread offline
      deal activity. These observations do not establish systemic failure, but they make accuracy,
      workflow fit, and implementation controls appropriate reference-check topics alongside the
      private financial and governance requests.
    claimRefs: [CO010, CO013, CO014, CO016]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date / period
      - Confidence
      - Gap
    rows:
      - [Product, Revenue AI operating system for revenue teams, "2026-10-16", High, Company positioning is broader than an audited product-usage mix.]
      - [Headquarters, San Francisco CA, Current third-party profiles, Medium, Legal domicile and complete office footprint are not established.]
      - [Founded, "2015 reported by Komo and Debriefing; 2016 reported by Tracxn", Historical, Medium, Incorporation records are needed to reconcile the dates.]
      - [Stage, Series E / late-stage private, Since 2021-05-28, Medium, No subsequent primary financing appears in the retained evidence.]
      - [Customers, "More than 5,000 organizations", 2026-09-30 company statement, High, No public customer definition or retention denominator.]
      - [ARR, "$500M estimated", 2026-05, Medium, Sacra estimate is ARR rather than audited GAAP revenue.]
      - [Total funding, "$584M across seven rounds", Through 2021-05-28, Medium, Funding raised is not current cash available.]
      - [Primary valuation, "$7.25B post-money", 2021-05-28 Series E, Medium, The priced round is stale for current valuation work.]
      - [Secondary reference, "$4.5B", 2025-11, Medium, Trade size and security terms are not public.]
      - [Headcount, "2,171 reported by Tracxn; approximately 2,500 reported by Komo", 2026, Low, Sources conflict and no official dated count is retained.]
      - [Audited revenue / cash / debt, null, Current, Low, Request audited statements and the debt schedule.]
    notes: >-
      Values mix company claims and third-party estimates. ARR is not GAAP revenue, a secondary
      valuation is not a primary financing, funding raised is not cash available, and null denotes
      evidence unavailable in the assigned source pool.
    claimRefs: [CO001, CO002, CO003, CO005, CO009, CO010, CO011, CO012, CO013, CO014]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit / functional coverage
      - Key-person dependency
    rows:
      - [Amit Bendov, CEO and co-founder, Former enterprise-software executive described by Komo, Connects sales-leadership pain to Gong's core market, High because the public strategy narrative remains CEO-centered.]
      - [Eilon Reshef, Chief Product Officer and co-founder, Former CTO and prior software founder described by Komo, Provides long-duration product and technical continuity, High because public product leadership is founder-concentrated.]
      - [Tim Riitters, Chief Financial Officer, Finance leader named by Komo, Covers finance and capital planning at late-stage scale, Medium because detailed financial disclosure is unavailable.]
      - [Shane Evans, Chief Revenue Architect, Former CRO and sales executive described by Komo, Adds enterprise go-to-market and rollout coverage, Medium because the current authority split is not independently documented.]
    notes: >-
      Partial public leadership enumeration based on Komo's profile, with founder identities
      corroborated by Debriefing and Gong's launch release; it is not a complete org chart or board list.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the two founders and the finance and revenue executives named in the assigned
        evidence; the pool does not contain a complete official executive or board roster.
    claimRefs: [CO002, CO004, CO015]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
      - [Amit Bendov and Eilon Reshef, Founders and operating leaders, Key-person and potential voting-control relevance, Confirm fully diluted ownership voting rights and succession coverage.]
      - [Franklin Templeton, 2021 Series E lead, Anchored the last priced primary round, Request current ownership board rights and security preferences.]
      - [Coatue, Series D lead and Series E participant, Repeat late-stage capital provider, Confirm current stake liquidation rights and secondary activity.]
      - [Sequoia Capital, Series C lead and later participant, Long-duration institutional investor, Confirm current board or observer rights.]
      - [Salesforce Ventures, Later-round strategic investor, Potential ecosystem and channel relevance beyond economics, Review commercial agreements information rights and competitive constraints.]
      - [Norwest Venture Partners, Early institutional investor, Helped fund initial company formation and product development, Confirm current ownership and any continuing governance rights.]
    notes: >-
      Partial map of founders and prominent investors reported by Komo, Sacra, and Tracxn; no
      complete cap table, voting agreement, board-rights schedule, or preference waterfall is public.
    enumerationScope:
      coverage: partial
      basis: >-
        Includes founders plus the early, lead, repeat, and strategic investors most visible in
        the assigned funding sources rather than every holder in the seven-round capital history.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Gong progressed from a 2015 operating origin through five major financing and valuation
      milestones to a 2026 ARR estimate and product-expansion launch.
    data:
      items:
        - date: "2015"
          label: Operating origin
          detail: Komo and Debriefing report that Amit Bendov and Eilon Reshef founded Gong in 2015.
          tone: neutral
          claimRefs: [CO002]
        - date: "2016-06"
          label: $6M Series A
          detail: Komo reports that Norwest Venture Partners and Shlomo Kramer led the early round.
          tone: positive
          claimRefs: [CO006]
        - date: "2019-12"
          label: $65M Series C at $1B
          detail: Komo and Tracxn identify Sequoia Capital as lead investor at the unicorn milestone.
          tone: positive
          claimRefs: [CO007]
        - date: "2020-08"
          label: $200M Series D at $2.2B
          detail: Komo and Tracxn report Coatue led the round.
          tone: positive
          claimRefs: [CO008]
        - date: "2021-05-28"
          label: $250M Series E at $7.25B
          detail: Franklin Templeton led Gong's last disclosed priced primary round.
          tone: positive
          claimRefs: [CO009]
        - date: "2025-11"
          label: $4.5B secondary reference
          detail: Sacra reports employee and investor liquidity rather than new primary company capital.
          tone: warning
          claimRefs: [CO010]
        - date: "2026-05"
          label: $500M ARR estimate
          detail: Sacra estimates that Gong reached $500M ARR; the amount is not audited GAAP revenue.
          tone: positive
          claimRefs: [CO014]
        - date: "2026-09-30"
          label: Celebrate '26 product expansion
          detail: Gong announced Activate, Enrich, Agent Builder, and Deep Mode.
          tone: positive
          claimRefs: [CO015]
    approximationNotes: >-
      Financing amounts and dates are third-party reported; $500M is an ARR estimate, and the 2025
      value is a secondary-market reference rather than a primary financing valuation.
    claimRefs: [CO002, CO006, CO007, CO008, CO009, CO010, CO014, CO015]
callouts:
  - calloutType: risk
    title: Headline scale exceeds disclosure quality
    body: >-
      Customer scale, ARR estimates, and a large funding history are visible, but audited economics,
      governance rights, and a reconciled current employee count are not.
    claimRefs: [CO005, CO011, CO012, CO013, CO014]
