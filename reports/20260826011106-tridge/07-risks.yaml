    {
      "id": "regulatory-and-platform-risk",
      "title": "Regulatory, legal, and platform-risk stack",
      "body": "Tridge operates in a category where software risk and trade-compliance risk overlap. The company is not merely publishing content; it is encouraging sourcing, supplier discovery, export promotion, procurement decisions, and in some cases agent-assisted workflow acceleration. That makes ordinary software problems more consequential because bad data, weak screening, or unclear accountability boundaries can propagate into trade, sourcing, or contractual disputes. Official sources reviewed for this chapter reinforce that point. WTO SPS rules, GS1 traceability standards, CBP forced-labor enforcement, BIS export-license guidance, and European data-protection obligations all show that global food-trade workflows demand disciplined records and governance. Tridge's privacy and terms pages demonstrate that management is aware of legal and contractual boundaries, but the public evidence does not extend to a full controls package, third-party audit summary, or jurisdiction-by-jurisdiction compliance map. As a result, the regulatory posture is neither a red flag nor a solved problem. It is a real diligence item whose severity rises as Tridge pushes deeper from intelligence into workflow execution.",
