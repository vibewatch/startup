evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-governance
    missingEvidence: Current board roster, committee structure, and investor control provisions.
    whyItMatters: Governance visibility is necessary to assess control risk after the 2024 distress signals.
    diligencePath: Request the latest board deck, board observer list, and shareholders agreement summary.
    relatedQuestionRefs:
      - QO004
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount-quality
    missingEvidence: Verified current employee count and function mix.
    whyItMatters: >-
      Public sources range from company marketing figures to low-quality databases and do not prove current operating
      capacity.
    diligencePath: Request HR roster by function and geography plus monthly headcount trend since 2023.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Cash balance, debt facilities, secondary activity, and full cap table terms.
    whyItMatters: The gap between the 2022 valuation and 2024 distress article cannot be underwritten without actual liquidity data.
    diligencePath: Request cap table, debt schedules, and monthly cash runway model used by management.
    relatedQuestionRefs:
      - QO021
      - QO025
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: named-customers
    missingEvidence: Updated logo roster beyond the 2022 customer names cited in KED Global.
    whyItMatters: Customer logo recency affects how reusable the overview is for later customer and valuation work.
    diligencePath: Ask management for current top accounts and production-status references by region.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Audited or management-confirmed 2024 revenue, gross margin, and recurring vs transactional split.
    whyItMatters: Third-party revenue estimates alone are not enough to assess durability or convert valuation into multiples.
    diligencePath: Request monthly revenue bridge and 2024 management accounts.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: som-conversion
    missingEvidence: Qualified-pipeline conversion rates, ACV, payback, and segment win rates.
    whyItMatters: A real SOM requires evidence on conversion and retention, not only adjacent market estimates.
    diligencePath: Request segment-level sales funnel data and realized ACV by workflow.
    relatedQuestionRefs:
      - QM025
      - QM024
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-size-divergence
    missingEvidence: Comparable-scope analyst market estimates for exactly the same category definition.
    whyItMatters: Third-party market-size reports use overlapping but not identical definitions, which can mislead valuation work.
    diligencePath: Ask management which external category definitions it uses internally and how they reconcile to segment revenue.
    relatedQuestionRefs:
      - QM007
      - QM008
      - QM019
      - QM022
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-budget-owner
    missingEvidence: Actual contract owner and budget-source data across procurement, trader, exporter, and agency segments.
    whyItMatters: Buyer and payer assumptions can materially affect sales-cycle and retention analysis.
    diligencePath: Review sample contracts and CRM records by segment.
    relatedQuestionRefs:
      - QM003
      - QM015
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: public-data-substitution
    missingEvidence: Independent customer interviews on whether free public datasets materially reduce willingness to pay for Tridge.
    whyItMatters: Needed to test whether curation and execution matter enough to beat free alternatives.
    diligencePath: Interview procurement and exporter users who evaluated Tridge against free data sources.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
