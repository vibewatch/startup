    },
    {
      "id": "price-support-and-current-anchor",
      "title": "Why current public price support is weak",
      "body": "The public pricing problem is straightforward. KED Global documented a 2022 round at roughly $2.7 billion, which established Tridge as a Korean unicorn. But KED later reported in 2024 that the company was in trouble, cutting jobs, and struggling to raise new capital. That later disclosure materially weakens the evidentiary value of the old price. A historical round can still matter, especially if a company subsequently compounds revenue and improves margins, but public evidence for those improvements is thin. The strongest visible operating datapoint is a low-confidence third-party estimate from GetLatka that places Tridge around $100 million of 2024 revenue. If that estimate is directionally right, the old mark implies an aggressive revenue multiple near 27x. That could be defendable only if growth, margin structure, and retention are much stronger than the public record currently shows. Without those missing items, the 2022 anchor is best treated as an optimistic historical waypoint rather than a safe current valuation floor.",
      "claimRefs": [
        "CV001",
        "CV002",
        "CV003",
        "CV004",
        "CV005",
        "CV006",
