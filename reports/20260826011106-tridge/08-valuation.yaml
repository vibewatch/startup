    },
    {
      "id": "scenario-framework-and-comp-check",
      "title": "Scenario framework and comparable check",
      "body": "The comp set does not yield false precision, but it does provide a hard reality check. On the downside, Freightos shows that public markets can assign very modest values to trade-tech platforms when growth, scale, or profitability do not command confidence. On the premium side, Xometry and Descartes show that network and workflow businesses can sustain multi-billion values when investors believe the model is durable and strategically important. Xometry is especially useful because its public market cap and revenue create a rough market-cap-to-revenue benchmark that is still far below the implied multiple of Tridge's old round on the GetLatka proxy. That does not prove Tridge is overvalued. It does prove that public evidence today is insufficient to assume a premium outcome automatically. The most defensible scenario framework therefore discounts the old mark in the base case, preserves upside only if hidden quality is later proven, and keeps a meaningful downside range open if financing stress or revenue-quality concerns intensify.",
      "claimRefs": [
