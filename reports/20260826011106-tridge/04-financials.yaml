      "id": "capital-history-and-distress-signal",
      "title": "Capital history and the 2024 distress signal",
      "body": "The financing history is easier to verify than current economic quality. KED Global, Yahoo Finance, Tracxn, and profile databases support the 2022 Series D round at about 37 million dollars and a roughly 2.7 billion dollar valuation, with lifetime capital raised near 121 million dollars. GetLatka adds an unverified but directionally interesting estimate of roughly 100 million dollars in 2024 revenue. On its own, that could support a constructive scaling narrative. But the July 2024 KED report sharply complicates the story by alleging impaired capital at the end of 2023, 115.5 billion won of operating losses over three years, a nil mark on DS Asset Management's stake, funding difficulty, layoffs, and a business-purpose shift toward data services. This chapter therefore cannot treat historical fundraising as a proxy for current liquidity. Instead it has to hold two ideas together at once: Tridge may have meaningful revenue and market presence, and it may still have encountered serious capital stress that changed how aggressively it can invest. Investors therefore need to separate historical fund-raising proof from present balance-sheet resilience. A private company can simultaneously have real customer value, substantial top-line revenue, and a stressed capital structure if losses, service intensity, or failed expansion outrun realized gross profit.",
