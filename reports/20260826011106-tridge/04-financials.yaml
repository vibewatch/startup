    {
      "id": "what-private-diligence-must-prove",
      "title": "What private diligence must still prove",
      "body": "The public record is good enough to map the revenue surfaces but not good enough to underwrite a financial model. No reviewed source discloses gross margin, contribution margin, CAC, payback, NRR, churn, current cash, or debt facilities. Even the strongest commercial proof points—ITA, Jeju, and Hoang Phat Fruit—show use cases and distribution reach rather than contract value or renewal quality. The right diligence target is therefore straightforward: prove how much of revenue is recurring software-like revenue, how much is service-heavy workflow revenue, and whether current cash resources are sufficient to keep shipping product after the 2024 stress episode. If management can produce that evidence, Tridge may still justify serious interest; if it cannot, then the combination of opaque economics and a stale unicorn mark should force a much harsher valuation stance. Management should also show whether recent strategy changes toward data services were defensive cost control, a healthy refocus on the best-margin wedge, or evidence that earlier commercialization motions were not scaling well enough. That distinction is central to any forward model. Until those private numbers appear, every public financial conclusion should be treated as a scenario input rather than as an investable fact pattern. That caution should govern every valuation conversation going forward. internally.",
