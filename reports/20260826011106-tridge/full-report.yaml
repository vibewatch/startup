chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and public operating model
        blocks:
          - type: paragraph
            body: >-
              Tridge now presents itself as more than a directory or a static pricing database. Its current public
              materials describe a layered platform for agri-food trade that combines an intelligence layer, a verified
              network layer, and an AI-driven execution layer. The company homepage and product pages consistently frame
              the core problem as information asymmetry, trust gaps, and manual execution bottlenecks across global food
              trade. That framing matters because it places Tridge at the intersection of data SaaS, buyer-supplier
              matching, and transaction enablement rather than inside a single pure-play software category. The same
              source set also supports a real operating footprint: the company claims 682 million plus trade data
              points, 480 thousand plus verified users, 1 million plus global users, more than 200 markets, and more
              than 200 countries, while the company-introduction page adds 350 thousand plus registered companies, 140
              thousand plus daily queries, and 200 plus employees. These are still company-reported metrics, not audited
              operating disclosures, but they are specific enough to establish how later chapters should define the
              business. The cleanest reusable summary is that Tridge is a Seoul-based agri-food intelligence and
              trade-execution platform monetizing data, networks, and workflow automation.
