  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Peer map and category overlap
        blocks:
          - type: paragraph
            body: >-
              Tridge does not sit in a single clean competitive box. Its public positioning overlaps with procurement
              intelligence, agricultural marketplaces, buyer-supplier discovery, export execution, and selected
              logistics workflows. That is why its peer set includes obviously agri-food-specific names such as
              ProducePay, Ninjacart, and Farmers Business Network, more operational platforms such as Silo, and broader
              trade-orchestration or visibility players such as Flexport and project44. Covantis matters as well because
              it shows what a trusted-industry-rail strategy can look like in specific commodity corridors. The
              practical lesson is that Tridge is differentiated, but not isolated. Each peer attacks a different layer
              of the stack. Some own financing better, some own internal system-of-record workflows better, and some own
              freight visibility or large-trader execution better. Competitive work therefore has to start from workflow
              overlap, not from one broad label like agtech or marketplace. Another reason the peer map is noisy is that
              customers may not run formal bake-offs among all of these names at once. A procurement team might compare
              Tridge with spreadsheets, consultants, and produce-specific sourcing tools, while a large shipper may
              compare only selected workflow pieces with project44 or Flexport. That still matters for diligence because
              the company does not need one single perfect competitor to face pressure; it only needs adjacent platforms
              to erode pricing power in the slice of workflow each buyer cares about most.
