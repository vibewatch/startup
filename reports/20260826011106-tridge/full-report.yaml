  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Tridge still presents a genuine investable story. Earlier chapters established real market relevance,
              visible product breadth, and customer proof that is broader than many private trade-tech companies
              disclose publicly. The product surface spans intelligence, procurement, exporter enablement, and
              AI-assisted workflow expansion, while customer evidence reaches from public-sector programs to exporters
              and global buyer networks. That combination is enough to justify continued work rather than an automatic
              pass. The anti-thesis is just as important. The public record does not establish the quality of the
              revenue base, the stability of retention, the degree of customer concentration, or the state of current
              financing after the 2024 distress article. That means Tridge can simultaneously be a real company with
              meaningful commercial potential and an unattractive deal at the wrong price. This chapter therefore treats
              recommendation as explicitly price-sensitive and evidence-sensitive. The core question is not whether
              Tridge has substance. It is whether the available public evidence is strong enough to defend anything
              close to the old unicorn anchor without a major private-data refresh.
