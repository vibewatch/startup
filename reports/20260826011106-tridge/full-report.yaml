      - number: '2.3'
        title: Sizing discipline and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The most important output from the market chapter is not a single heroic TAM number. It is a disciplined
              view that third-party estimates vary materially because they measure different things: one report sizes a
              broad agriculture e-commerce market, another sizes a digital agriculture marketplace layer, and another
              focuses on OTC agricultural product trading platforms. All are relevant to Tridge, but none isolates the
              company's actual monetizable wedge. The right interpretation is that Tridge operates inside a
              medium-to-large and still-growing category set whose commercial gravity comes from software-plus-services
              workflows rather than raw public-data access alone. That is bullish enough to justify serious diligence,
              yet cautious enough to avoid importing inflated macro market numbers directly into the valuation chapter.
              What is still missing is the internal conversion evidence needed to translate external category growth
              into a real serviceable obtainable market. Until that evidence is produced, the market case should
              emphasize driver strength and budget relevance, not false precision. That missing step is exactly where
              private diligence should focus next. Management should therefore show how many customers begin in content
              or insight products, how many convert into sourcing or execution programs, and which segments generate
              repeat revenue. Without that bridge, a big macro market tells investors very little about realized
              economics.
