  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Ranked risk stack: liquidity and execution first'
        blocks:
          - type: paragraph
            body: >-
              The risk picture for Tridge is dominated by a sequencing problem. Public customer proof, product breadth,
              and market relevance are real, but they sit underneath a financing and execution cloud created by the 2024
              KED Global distress report. For an investor, that matters more than abstract market opportunity because
              liquidity stress can quickly convert into weaker support quality, slower product execution, and lower
              customer retention even if the product thesis is directionally sound. The reviewed evidence therefore
              ranks risks in three tiers. First is liquidity and execution continuity: if Tridge lacks enough capital,
              every other diligence conclusion becomes less durable. Second is regulatory and compliance complexity:
              cross-border food trade requires traceability, sanctions screening, sourcing controls, and data protection
              discipline. Third is customer-quality risk: public proof points show demand, but they do not show
              retention, concentration, or economics. The chapter is therefore not saying Tridge is fatally flawed. It
              is saying the investable debate should focus on whether management can prove operational resilience and
              control maturity quickly enough to offset the financing uncertainty already visible in public reporting.
