  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definition
        blocks:
          - type: paragraph
            body: >-
              Tridge should not be framed as serving the whole of global food trade, even though its branding naturally
              references that much larger economic system. The public evidence shows a narrower monetizable category:
              software and workflow spend around price discovery, supplier discovery, buyer qualification, and export
              execution in agri-food. That distinction matters because many of the underlying raw datasets are public or
              semi-public. FAO, USDA, WFP, and the European Commission all publish market or trade data, and private
              research firms slice the sector into different adjacent categories such as agriculture e-commerce, digital
              agriculture marketplaces, and OTC agricultural trading platforms. Tridge therefore sits in an overlap zone
              rather than a single clean analyst bucket. Its practical market is where buyers and exporters will pay for
              curated intelligence, verified counterparties, and faster workflow execution. This keeps the market
              chapter disciplined: the addressable spend is substantial and growing, but it is still far smaller than
              total agricultural trade value and depends on workflow substitution, not data exclusivity alone. The
              chapter therefore treats adjacent market reports as directional evidence, not as permission to equate
              Tridge with the total value of agricultural trade.
