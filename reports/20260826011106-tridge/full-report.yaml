  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue surfaces and pricing logic
        blocks:
          - type: paragraph
            body: >-
              Tridge's public materials point to a hybrid monetization structure rather than a single clean SaaS motion.
              Tridge Eye is sold as a recurring intelligence layer. Procurement pages sell benchmarked savings and
              supplier discovery. Ark sells qualified buyer engagement, faster market entry, and execution support.
              Customer and agency case studies suggest Tridge also monetizes government or programmatic export
              initiatives. That hybrid structure is important because it expands addressable revenue beyond a narrow
              data subscription, but it also means public pricing is sparse and likely customized. The commercial
              language is outcome-first: ROI multiples, identified savings, response rates, introductions, and
              time-to-results. That points to consultative and value-based packaging rather than transparent per-seat
              pricing. The financial upside of such a model can be meaningful if recurring attach is strong; the
              downside is that service intensity and delivery labor may be materially higher than marketing pages imply.
              The public commercial story is coherent, but it leaves a key ambiguity unresolved: whether Tridge has
              engineered software leverage or whether it is still relying on substantial human delivery effort to close
              and service engagements. That ambiguity matters more than list price because it drives gross margin and
              scalability.
