            body: >-
              Independent reporting and company profiles give Tridge enough public identity to anchor the rest of the
              report, even if governance detail remains sparse. KED Global, Tracxn, and The Company Check all place the
              company in Seoul and date founding to 2015, while founder names consistently resolve to Hoshik Shin and
