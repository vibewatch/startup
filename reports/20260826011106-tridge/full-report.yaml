companyProfile:
  summary: >-
    Tridge is a Seoul-based agri-food intelligence and trade-execution platform founded in 2015. Public materials
    describe a stack that combines market intelligence, verified buyer-supplier networks, procurement tooling, exporter
    enablement, and newer AI-assisted workflow products such as Tridge Ark. Customer evidence spans agencies, exporters,
    and enterprise logos, which supports the conclusion that the company is commercially real. The harder question is
    economic quality. Public reporting supports a 2022 Series D at roughly a $2.7B valuation and a later 2024 period of
    capital stress, while lower-confidence database sources suggest Tridge may have reached roughly $100M of revenue in
    2024. That combination makes Tridge interesting but difficult to price without a much deeper private-data package.
