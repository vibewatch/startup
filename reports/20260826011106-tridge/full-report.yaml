  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Stack and module design
        blocks:
          - type: paragraph
            body: >-
              Tridge's public product story is coherent and fairly specific. The company describes a stack that starts
              with data acquisition and curation, moves through market-intelligence products such as Eye Speaker, Eye
              Shelf, and Eye Book, and extends into execution workflows such as procurement support and Tridge Ark. That
              matters because it makes the product more than a content library. The public materials consistently imply
              a workflow operating system for agri-food trade decisions, where data products feed decision products and
              decision products feed commercial execution. The architecture also looks software-forward rather than
              asset-heavy: the core dependencies are data freshness, counterparty quality, curation logic, and
              orchestration. In product terms, the strongest part of the story is how clearly Tridge links intelligence
              to next actions for different user types. The visible product map also shows why Tridge is not easily
              categorized as just a database vendor. Each module is framed around a job to be done—monitoring markets,
              comparing internal versus external performance, finding counterparties, or directly running outreach and
              qualification. That jobs-to-be-done clarity increases confidence that the platform is intentionally
              designed rather than loosely assembled.
