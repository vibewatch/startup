        title: Final call and diligence path
        blocks:
          - type: paragraph
            body: >-
              The final call is therefore selective rather than enthusiastic. Tridge appears too substantive to ignore,
              but too underdisclosed to underwrite at the historical peak price using public evidence alone.
              Recommendation should be framed as research-more / proceed selectively, with medium confidence and a high
              risk rating. The right valuation stance is below the last round until management can substantiate current
              revenue quality, gross margin, burn, runway, concentration, and cap-table terms. Investors should also
              require hard answers on whether any bridge financing or preference overhang has emerged since the 2022
              round. The thesis-break triggers are concrete: failed financing, a down-round, inability to show retention
              quality, or evidence that customer proof is not converting into durable recurring economics. If management
              can close those gaps credibly, the valuation range can move materially upward. If not, Tridge should
