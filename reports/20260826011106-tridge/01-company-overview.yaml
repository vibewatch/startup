    {
      "id": "founders-capital-and-customer-signals",
      "title": "Founders, capital history, and customer validation",
      "body": "Independent reporting and company profiles give Tridge enough public identity to anchor the rest of the report, even if governance detail remains sparse. KED Global, Tracxn, and The Company Check all place the company in Seoul and date founding to 2015, while founder names consistently resolve to Hoshik Shin and Kangwook Lee. The August 2022 financing is well corroborated across KED Global, Yahoo Finance, AgFunderNews, and Tridge’s own announcement: DS Asset Management invested roughly 50 billion won, or about 37 million dollars, in a Series D that marked Tridge at about 2.7 billion dollars. Profile databases cluster total capital raised near 121 million dollars. Customer validation was also unusually strong in the 2022 coverage, which named Del Monte Foods, Walmart, Carrefour, Australia’s Department of Agriculture, and the Singapore Food Agency. Those names do not prove current customer depth or renewal quality, but they do show that Tridge had broken into large enterprise and public-sector workflows before the more recent pivot toward AI-assisted execution. This chapter therefore has enough evidence to establish capital history and logo quality, but not enough to prove current customer concentration, governance rights, or balance-sheet resilience.",
