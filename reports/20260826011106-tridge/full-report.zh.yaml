      - number: '2.2'
        title: 买方分层、增长驱动和采用逻辑
        blocks:
          - type: paragraph
            body: >-
              公开买方地图比精确市场规模更清楚。Tridge
              直接面向需要基准价格和供应商替代选项的采购团队、希望更快接触国际买家的出口商和品牌、需要更好交易对手情报的贸易商，以及需要为大量中小企业做规模化触达的政府出口促进机构。这些客群共同面对碎片化数据和缓慢手工执行的痛点，但预算负责人和成功指标并不相同。采购团队在意节省金额和谈判杠杆；出口商在意上市速度和分销商发现；贸易商在意合格交易对手和成交速度；机构在意触达和项目吞吐。主要顺风来自持续的食品价格波动、集中的供应结构，以及分散原产地和供应商的需求。主要约束是切换成本、客户对免费公开数据的依赖，以及证明
              Tridge 整理后的工作流足以把免费信息转化为付费经常性支出的难度。实际判断采用时，必须透过分客群 ROI
              和切换摩擦来看。另一层含义是，最好的客户很可能是当下正在承受定价、供应商或市场进入压力的客户，而不是随手采购信息产品的客户；这种压力会立即、反复出现。
