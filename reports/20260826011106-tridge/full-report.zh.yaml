  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 同行地图和类别重叠
        blocks:
          - type: paragraph
            body: >-
              Tridge 不在一个单一、干净的竞争框里。它的公开定位与采购情报、农业市场、买方-供应商发现、出口执行和部分物流工作流重叠。因此，它的同行集合既包括 ProducePay、Ninjacart、Farmers
              Business Network 这类明显聚焦农食的名字，也包括 Silo 这类更偏运营的平台，以及 Flexport、project44 这类更广的贸易编排或可视化玩家。Covantis
              也重要，因为它展示了在特定大宗商品走廊里，可信行业轨道策略可以长什么样。实际教训是，Tridge
              有差异化，但并不孤立。每个同行都攻击技术栈的不同层：有的更擅长融资，有的更擅长内部记录系统工作流，有的更擅长货运可视化或大型贸易商执行。因此，竞争分析必须从工作流重叠出发，而不是从
              农业科技或市场平台这类宽泛标签出发。同行地图嘈杂还有另一个原因：客户未必会把这些公司一次性全部纳入正式比选。采购团队可能把 Tridge 与电子表格、顾问和细分品类寻源工具比较；大型货主可能只拿部分工作流模块与
              project44 或 Flexport 比较。尽调仍必须重视这一点，因为公司并不需要遇到一个完美竞品才会承压；只要相邻平台在买方最在意的工作流切片里侵蚀定价权，就足够形成压力。
