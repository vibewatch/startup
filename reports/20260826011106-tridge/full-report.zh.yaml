      - number: '3.3'
        title: 耐久性风险和下一步尽调
        blocks:
          - type: paragraph
            body: >-
              两类竞争风险需要明确权重。第一，Tridge 所处地带里，免费公共数据、通用外联工具和大型相邻软件供应商都能复制客户工作流的一部分。如果客户一次只购买一个狭窄用例，护城河就会更弱。第二，2024 年 KED
              Global 困境报道提出了一种可能：相比独角兽标题叙事暗示的资源，Tridge
              可能需要用更少的资本灵活性防守自身位置。这些风险不会抹去平台差异化，但会限制我们对任何类别领导地位主张的信心。因此，正确的尽调姿态是测试客户是否真的采用组合，Tridge
              是否靠独特情报加执行取胜，以及公司是否仍有资本基础，能在面对资金更充足或更聚焦的对手时继续累积产品深度。同样重要的是弄清 Tridge
              在哪里输。如果客户主要购买一次性报告、一次性介绍，或有补贴的机构项目，相邻专家就能很快攻击这些表面。如果客户续约是因为数据、交易对手和执行一起改善，那公司就拥有比任何单个竞品页面能展示的更持久切口。
            claimRefs:
              - CP020
              - CP024
              - CP033
              - CP034
              - CP035
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入表面和定价逻辑
        blocks:
          - type: paragraph
            body: >-
              Tridge 的公开材料指向混合变现结构，而不是单一清晰的 SaaS 销售动作。Tridge Eye 作为经常性情报层销售。采购页面销售的是基准化节省和供应商发现。Ark
              销售合格买方互动、更快市场进入和执行支持。客户与机构案例研究显示，Tridge
              也会通过政府或项目化出口计划变现。混合结构很重要，因为它把可寻址收入扩大到狭窄的数据订阅之外；但它也意味着公开定价稀疏，且很可能高度定制化。商业语言以结果为先：ROI
              倍数、识别出的节省、回复率、介绍和见效时间。这指向顾问式、价值定价的打包方式，而不是透明的按席位定价。如果经常性附加足够强，这类模型的财务上行可以很有意义；下行则是服务强度和交付人力可能显著高于营销页面暗示。公开商业故事是连贯的，但留下一个关键含糊点：Tridge
              究竟已经做出软件杠杆，还是仍依赖大量人工交付来成交并服务项目。这个含糊点比标价更重要，因为它决定毛利率和可扩展性。
