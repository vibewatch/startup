      - number: '2.3'
        title: 规模测算纪律和尽调含义
        blocks:
          - type: paragraph
            body: >-
              市场章节最重要的输出，不是一个激进的 TAM 数字，而是一套有纪律的判断：第三方估计差异很大，因为它们衡量的东西不同。一份报告测算宽口径农业电商市场，另一份测算数字农业市场层，还有一份聚焦 OTC
              农产品交易平台。它们都与 Tridge 有关，但没有任何一份能隔离公司的实际可变现切口。正确解读是，Tridge
              处在一组中到大型且仍在增长的类别中，商业重心来自软件加服务的工作流，而不只是原始公共数据访问。这已经足够乐观，值得认真尽调；也足够谨慎，避免把夸大的宏观市场数字直接带进估值章节。仍缺少的，是把外部类别增长转译为真实可服务可获取市场所需的内部转化证据。在证据出来前，市场论证应强调驱动力强度和预算相关性，而不是虚假的精确。这一步缺口正是下一轮私有尽调应聚焦的地方。因此，管理层应展示有多少客户从内容或洞察产品开始，有多少转化为寻源或执行项目，以及哪些客群产生重复收入。没有这座桥，宏观大市场对已实现经济性几乎说明不了什么。
