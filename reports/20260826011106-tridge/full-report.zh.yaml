chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、范围和公开运营模式
        blocks:
          - type: paragraph
            body: >-
              Tridge 现在展示给市场的，已经不只是一个目录或静态价格数据库。当前公开材料把它描述成服务农食贸易的分层平台：有情报层、已验证网络层和 AI
              驱动执行层。公司首页和产品页一直把核心问题定义为全球食品贸易中的信息不对称、信任缺口和手工执行瓶颈。这个叙事很关键，因为 Tridge 被放在数据
              SaaS、买卖双方匹配和交易赋能的交汇处，而不是单一纯软件类别里。同一组来源也支持其真实运营足迹：公司声称拥有超过 682 million 个贸易数据点、超过 480 thousand 名已验证用户、超过 1
              million 名全球用户，覆盖超过 200 个市场和超过 200 个国家；公司介绍页还给出超过 350 thousand 家注册公司、超过 140 thousand 次日查询和超过 200
              名员工。上述仍是公司披露指标，不是经审计的经营披露，但足够具体，可以定义后续章节中的业务口径。最干净的可复用概括是：Tridge 是一家总部位于首尔的农食情报和贸易执行平台，靠数据、网络和工作流自动化变现。
