      - number: '1.3'
        title: 里程碑、治理缺口和 2024 年压力信号
        blocks:
          - type: paragraph
            body: >-
              Tridge 公开画像中最重要的判断，是如何调和 2022 年独角兽叙事与 2024 年困境报道。2024 年 7 月，KED Global 报道称，公司在 2023 年末资本受损，此前三年经营亏损合计
              115.5 billion 韩元；DS Asset Management 将其持股记为零；Tridge 在裁员并把业务目的转向数据服务的同时，筹措新资金遇到困难。这些说法尤其重要，因为它们来自同一家报道过
              2022 年独角兽融资的媒体，显著削弱了把旧估值标记当作当前估值的可靠性。它们不能证明公司失败，但意味着公司概况不能写成一路向上的成功故事。公开来源仍支持真实的产品栈、真实的市场存在和有分量的企业
              标杆企业客户，却没有给出经调和的当前董事会名单、详细所有权图谱，或经审计的现金与负债视图。因此，后续章节的复用规则应当保持平衡：把身份、产品范围和 2022
              年融资视为已成立事实，但把当前财务强度、治理和估值视为仍待尽调的问题，而不是既定真相。正是这一层细微差别，让公司概况有分析价值，而不是沦为宣传稿、过期资料或单线叙事。
