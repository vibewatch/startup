      - number: '4.3'
        title: 私有尽调仍必须证明什么
        blocks:
          - type: paragraph
            body: >-
              公开记录足以绘出收入表面，但不足以承保一套财务模型。已审阅来源没有披露毛利率、贡献利润率、CAC、回本周期、NRR、流失、当前现金或债务工具。即便最强的商业证明点——ITA、Jeju 和 Hoang Phat
              Fruit——展示的是用例和分销覆盖，而不是合同金额或续约质量。因此，正确的尽调目标很直接：证明收入中有多少是经常性、类软件收入，有多少是服务较重的工作流收入，以及经历 2024
              年压力事件后，当前现金资源是否足以继续发货产品。如果管理层能拿出这些证据，Tridge
              仍可能值得认真研究；如果不能，模糊经济性叠加过时独角兽估值，应迫使估值立场严厉得多。管理层还应说明，近期转向数据服务的战略变化，是防御性的成本控制、对最高毛利切口的健康再聚焦，还是早期商业化动作没有足够规模化的证据。这个区分是任何前瞻模型的核心。在这些私有数字出现前，每一个公开财务结论都应被视作情景输入，而不是可投资事实组合。今后每次估值讨论都应受这份谨慎约束。内部也一样。
