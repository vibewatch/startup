      - number: '8.2'
        title: 为什么当前公开价格支撑很弱
        blocks:
          - type: paragraph
            body: >-
              公开定价问题很直接。KED Global 记录了 2022 年一轮约 $2.7 billion 的融资，使 Tridge 成为韩国独角兽。但 KED 后来在 2024
              年报道，公司陷入困难、裁员，并难以筹措新资本。后续披露显著削弱了旧价格的证据价值。历史融资轮仍然可以重要，尤其是在公司随后持续扩大收入并改善利润率时；但公开证据对这些改善的支持很薄。最强的可见经营数据点，是来自
              GetLatka 的低置信度第三方估计：Tridge 2024 年收入约 $100 million。如果这个估计方向正确，旧估值标记意味着接近 27x
              的激进收入倍数。只有在增长、毛利结构和留存明显强于当前公开记录显示时，这个倍数才可能站得住。缺少这些信息时，2022 年锚点最好被视为乐观的历史路标，而不是安全的当前估值底线。
