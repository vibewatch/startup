  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和类别定义
        blocks:
          - type: paragraph
            body: >-
              即便 Tridge
              的品牌天然指向更大的全球食品贸易体系，也不应把它描述成服务整个全球食品贸易。公开证据显示，可变现类别更窄：围绕农食价格发现、供应商发现、买方资质审核和出口执行的软件与工作流支出。这个区分很重要，因为许多底层原始数据来自公开或半公开渠道。FAO、USDA、WFP
              和 European Commission 都发布市场或贸易数据，私营研究机构又把行业切成农业电商、数字农业市场、OTC 农产品交易平台等相邻类别。因此，Tridge
              处在重叠地带，而不是单一清晰的分析师桶里。它的实际市场，是买方和出口商愿意为整理后的情报、已验证的交易对手和更快的工作流执行付费的那一块。这样定义可以让市场章节保持克制：可寻址支出很大且在增长，但仍远小于农业贸易总额，并且依赖工作流替代，而不只是数据独占。本章因此把相邻市场报告视为方向性证据，而不是把
              Tridge 等同于农业贸易总价值的许可。
