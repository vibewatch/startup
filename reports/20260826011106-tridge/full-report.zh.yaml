      - number: '6.3'
        title: 风险视角和尽调优先级
        blocks:
          - type: paragraph
            body: >-
              核心客户风险不是缺少标杆客户，而是标杆客户与经济性之间的缺口。2024 年 KED 困境文章还提出一个额外运营担忧：如果 Tridge
              当时在裁员并难以融资，那么在营销仍继续强调网络覆盖和案例研究的同一时期，服务质量或客户支持可能已经受影响。这不会否定已经可见的客户证明；但它意味着，后期尽调必须索取队列留存、头部账户集中度和项目转化数据，然后才能把公开客户广度当作耐久收入质量的代理。简言之，Tridge
              的客户证据已经足够重要，但客户经济性还不足以放松承保纪律。实际含义是，客户尽调应从收集标杆客户转向评估推荐质量。投资者应追问近期推荐账户是否扩张、机构主导项目是否在没有补贴的情况下续约，以及服务水准是否在
              2024 年资本压力期保持完整。还应把消费内容或一次性匹配帮助的客户，与运行重复寻源或采购工作流的客户分开。如果这些更深检查很强，现有公开证明就会显著更有价值，因为它说明 Tridge
              已经在多个贸易工作流里拥有可信切口。如果检查偏弱，同一批公开证明更像打磨精美的上市获客材料，而不是客户价值持续累积的耐久证据。
            claimRefs:
              - CU022
              - CU031
              - CU032
              - CU033
              - CU034
              - CU035
              - CU039
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序：流动性和执行居首
        blocks:
          - type: paragraph
            body: >-
              Tridge 的风险图景主要由一个顺序问题主导。公开客户证明、产品广度和市场相关性都是真实的，但它们被 2024 年 KED Global
              困境报道制造的融资和执行阴云压在下面。对投资者而言，这比抽象市场机会更重要，因为即使产品逻辑方向正确，流动性压力也能很快转化为支持质量变弱、产品执行变慢和客户留存下降。已审阅证据因此把风险分成三层。第一是流动性和执行连续性：如果
              Tridge
              没有足够资本，其他尽调结论的耐久性都会下降。第二是监管和合规复杂性：跨境食品贸易要求可追溯性、制裁筛查、寻源控制和数据保护纪律。第三是客户质量风险：公开证明点显示需求，但没有显示留存、集中度或经济性。因此，本章并不是说
              Tridge 有致命缺陷，而是说可投资性争论应聚焦管理层能否足够快地证明运营韧性和控制成熟度，从而抵消公开报道中已经可见的融资不确定性。
            claimRefs:
              - CR008
              - CR009
              - CR024
              - CR025
              - CR026
