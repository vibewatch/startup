  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 流动性 / 执行风险与贸易合规风险的综合影响等级最高。
    data:
      columns:
        - 可能性
        - 影响
        - 残余严重度
      rows:
        - label: 流动性 / 执行
          values:
            - 高
            - 高
            - 高
        - label: 贸易合规
          values:
            - 中
            - 高
            - 高
        - label: 客户质量不透明
          values:
            - 高
            - 中高
            - 高
        - label: 自动化 / 数据质量
          values:
            - 中
            - 中高
            - 中高
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR018
      - CR024
      - CR025
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 核心传导路径是：融资压力先压到执行质量，再传到客户稳定性和估值。
    data:
      nodes:
        - id: finance
          label: 融资压力
        - id: staff
          label: 人员 / 支持承压
        - id: service
          label: 执行质量
        - id: retention
          label: 客户留存风险
        - id: valuation
          label: 估值压力
      edges:
        - from: finance
          to: staff
          label: 成本压力
        - from: staff
          to: service
          label: 交付风险
        - from: service
          to: retention
          label: 信任 / SLA 影响
        - from: retention
          to: valuation
          label: 稳定性走弱
    claimRefs:
      - CR008
      - CR020
      - CR022
      - CR028
      - CR030
      - CR032
      - CR038
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Tridge 要靠代理渠道、贸易规则、内部执行和客户验证相互强化。
    data:
      nodes:
        - id: agencies
          label: 代理 / 合作伙伴渠道
        - id: rules
          label: 贸易与隐私规则
        - id: ops
          label: 内部运营人员
        - id: product
          label: 工作流产品质量
        - id: customers
          label: 续约 / 客户验证
      edges:
        - from: agencies
          to: customers
          label: 客群生成
        - from: rules
          to: product
          label: 合规负担
        - from: ops
          to: product
          label: 交付能力
        - from: product
          to: customers
          label: 续约质量
    claimRefs:
      - CR015
      - CR016
      - CR018
      - CR021
      - CR025
      - CR037
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 广度确实存在，但价格支撑单薄，融资风险也未解开，所以判断仍需保持选择性。
    data:
      nodes:
        - id: thesis
          label: 市场、产品、客户确有广度
          description: 公司显然有实质业务。
        - id: gaps
          label: 经济性与控制缺口
          description: 留存、利润率和现金续航期仍披露不足。
        - id: anchor
          label: 过期独角兽锚点
          description: 2022 年价格仍在，但已被 2024 年困境削弱。
        - id: price
          label: 需要估值折价
          description: 入场纪律比故事质量更重要。
        - id: decision
          label: 选择性推进
          description: 继续尽调，而不是盲目给投资背书。
      edges:
        - from: thesis
          to: gaps
        - from: gaps
          to: anchor
        - from: anchor
          to: price
        - from: price
          to: decision
    claimRefs:
      - CV007
      - CV009
      - CV011
      - CV023
      - CV024
      - CV031
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以可信度偏低的收入代理值为基数，可接受倍数一旦压缩或扩张，示意估值会大幅摆动。
    data:
      items:
        - label: 6x × $100M 收入代理值
          value: 0.6
        - label: 10x × $100M 收入代理值
          value: 1
        - label: 15x × $100M 收入代理值
          value: 1.5
        - label: 20x × $100M 收入代理值
          value: 2
        - label: 旧轮隐含 27x
          value: 2.7
    claimRefs:
      - CV006
      - CV028
      - CV029
      - CV030
    approximationNotes: 柱形只是基于 GetLatka 收入代理值的示意输出，用来展示判断对倍数和证据质量有多敏感。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基准情形对过期独角兽锚点打折；只有后续证实隐含质量，才保留上行空间。
    data:
      items:
        - label: 悲观
          low: 0.6
          mid: 0.8
          high: 1
          unit: USDbn
        - label: 基准
          low: 1.2
          mid: 1.5
          high: 1.8
          unit: USDbn
        - label: 乐观
          low: 2
          mid: 2.3
          high: 2.7
          unit: USDbn
        - label: 2022 年锚点
          low: 2.7
          mid: 2.7
          high: 2.7
          unit: USDbn
    claimRefs:
      - CV001
      - CV028
      - CV029
      - CV030
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 四个检查点概括了 Tridge 为何有吸引力，却又难定价。
    data:
      items:
        - label: 2022 轮次锚点
          value: $2.7B
        - label: 2024 年收入代理值
          value: ~$100M
        - label: Xometry 2024 年收入
          value: $546M
        - label: Freightos 公开市场市值
          value: $73.39M
    claimRefs:
      - CV001
      - CV003
      - CV012
      - CV014
      - CV015
