      - number: '5.2'
        title: 工作流依赖和信任控制
        blocks:
          - type: paragraph
            body: >-
              同一组证据也凸显尽调风险在哪里。Tridge 的价值取决于新鲜数据摄入、良好的实体解析、已验证交易对手，以及执行工作流中的流程纪律。Ark
              的营销展示了亮眼的漏斗活动，但公开记录没有清楚区分哪些环节已自动化，哪些仍需要人工服务。信任和合规可见度也比产品营销更薄。平台所处领域里，贸易伙伴在意来源、价格可靠性、制裁暴露和记录留存，但公开页面没有披露详细内部
              QA
              或控制架构。这不意味着控制薄弱；它意味着控制仍未被证明。对尽调来说，这个区分很关键，因为真正的技术问题不是网站是否存在，而是系统能否在规模化下反复交付可信结果。合规环境进一步强化了这一点。在食品贸易中，坏数据或薄弱交易对手控制不仅会造成机会流失，还会带来可追溯性、制裁和声誉风险。因此，任何尽调都应像审视产品
              UX 或商业话术一样，认真测试控制质量。
