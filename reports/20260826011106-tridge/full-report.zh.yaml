      - number: '8.3'
        title: 情景框架和可比公司校验
        blocks:
          - type: paragraph
            body: >-
              可比公司集合不能给出虚假精确，但能提供硬现实校验。下行一侧，Freightos 表明，当增长、规模或盈利能力不能赢得信心时，公开市场可以给贸易科技平台很低的估值。溢价一侧，Xometry 和 Descartes
              表明，只要投资者相信模型耐久且具战略重要性，网络和工作流企业可以维持数十亿美元价值。Xometry 尤其有用，因为它的公开市值和收入构成一个粗略市值 / 收入基准，仍远低于按 GetLatka 代理收入推算的
              Tridge 旧融资隐含倍数。这不能证明 Tridge
              被高估；它证明的是，今天的公开证据不足以自动假设溢价结果。最能防守的情景框架，是在基准情景中折减旧估值；只有当隐藏质量后来被证明时才保留上行；如果融资压力或收入质量担忧加剧，则保留有意义的下行情景区间。
