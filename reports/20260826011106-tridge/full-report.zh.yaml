companyProfile:
  summary: >-
    Tridge 是一家总部位于首尔的农食情报和贸易执行平台，成立于 2015 年。公开材料描述的产品栈把市场情报、已验证的买方-供应商网络、采购工具、出口商赋能，以及 Tridge Ark 等较新的 AI
    辅助工作流产品拼在一起。客户证据覆盖机构、出口商和企业客户名单，足以支持公司商业上真实存在的结论。更难回答的是经济质量。公开报道支持 2022 年 Series D 估值约 $2.7B，后续 2024
    年又出现资本压力；置信度较低的数据库来源显示 Tridge 2024 年收入可能约 $100M。这组证据让 Tridge 值得关注，但没有更深入的私有数据包，很难定价。
