      - number: '8.4'
        title: 最终判断和尽调路径
        blocks:
          - type: paragraph
            body: >-
              因此，最终判断应是选择性推进，而不是热情买入。Tridge 有足够实质，不能忽视；但公开证据披露太少，不足以按历史峰值价格承保。建议应表述为 research-more /
              选择性推进，置信度中等、风险评级高。在管理层能证实当前收入质量、毛利率、烧钱速度、现金跑道、客户集中度和股权结构条款之前，正确估值立场应低于上一轮。投资者还应要求硬答案：2022
              年融资之后，是否出现任何过桥融资或优先权悬置。打破投资逻辑的触发条件很具体：融资失败、下行融资轮、无法展示留存质量，或有证据显示客户证明没有转化为耐久经常性经济性。如果管理层能可信地补上这些缺口，估值区间可以显著上移。否则，Tridge
              应留在观察名单，而不是按确信价格投资。
