      - number: '4.2'
        title: 资本历史和 2024 年困境信号
        blocks:
          - type: paragraph
            body: >-
              融资历史比当前经济质量更容易验证。KED Global、Yahoo Finance、Tracxn 和档案数据库支持 2022 年 Series D 规模约 37 million 美元、估值约 2.7
              billion 美元，累计融资接近 121 million 美元。GetLatka 还给出一个未经验证但方向上值得关注的估计：2024 年收入约 100 million
              美元。单看这一点，可以支撑一个偏正面的扩张叙事。但 2024 年 7 月 KED 报告急剧复杂化了这个故事：报告称公司在 2023 年末资本受损、三年经营亏损 115.5 billion 韩元、DS Asset
              Management 持股被记为零、融资困难、裁员，并把业务目的转向数据服务。因此，本章不能把历史融资当作当前流动性的代理。相反，它必须同时容纳两个判断：Tridge
              可能拥有有意义的收入和市场存在，也可能遭遇严重资本压力，改变其投资进攻能力。投资者因此需要把历史融资证明与当前资产负债表韧性分开。只要亏损、服务强度或失败扩张跑在已实现毛利前面，一家私营公司可以同时拥有真实客户价值、可观收入规模和承压的资本结构。
