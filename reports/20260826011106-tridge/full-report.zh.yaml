  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层和公开证明点
        blocks:
          - type: paragraph
            body: >-
              对一家在专门贸易细分领域运营的私营公司来说，Tridge 的公开客户证明异常宽。独立和官方来源都把它放在触达企业买方、政府机构、出口商、贸易商和渠道合作伙伴的工作流里。KED Global 在 2022
              年点名了大型商业和公共部门客户；较新的 ITA、Jeju 和 Hoang Phat 案例研究则显示，平台被用于中小企业出口促进、买方发现和定价优化。这个广度很重要，因为它说明 Tridge
              并非只卖给一个狭窄买方画像；它也暗示平台可以在多个国家支持商业和机构用例。因此，最强的直接正面信号不是某个客户指标，而是多样化证据：真实交易对手把系统用于真实贸易或出口工作流。本轮补充审阅的自有页面——Stories、Success
              Stories、网络研讨会和大宗商品出口商工作流页面——还显示，Tridge
              把客户证明当作可重复获客系统的一部分，而不是孤立证言。这个点很重要，因为公司似乎销售的是情报、出口赋能和执行支持的组合，所以买方教育很可能是转化的一部分。不过，这些自有引用主要证明信息纪律和客群定位，不能证明合同耐久性。正确解读是，Tridge
              已经拼出足够公开证据，显示多个客户类型存在真实需求；但平均客单、续约行为，以及公共部门或项目客户是否不同于商业账户这些更有投资价值的问题，仍然开放。
