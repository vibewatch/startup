      - number: '1.2'
        title: 创始人、资本历史和客户验证
        blocks:
          - type: paragraph
            body: >-
              独立报道和公司档案给了 Tridge 足够清晰的公开身份，可以支撑本报告后续分析，哪怕治理细节仍然稀疏。KED Global、Tracxn 和 The Company Check
              都把公司定位在首尔，并把成立时间指向 2015 年；创始人姓名也一致落在 Hoshik Shin 和 Kangwook Lee。2022 年 8 月融资在 KED Global、Yahoo
              Finance、AgFunderNews 和 Tridge 自有公告中都有较好交叉印证：DS Asset Management 在 Series D 投入约 50 billion 韩元，约合 37 million
              美元，对 Tridge 的估值约 2.7 billion 美元。档案数据库把累计融资集中在约 121 million 美元。2022 年报道中的客户验证也异常强，点名了 Del Monte
              Foods、Walmart、Carrefour、Australia’s Department of Agriculture 和 Singapore Food
              Agency。这些名字不能证明当前客户深度或续约质量，但说明 Tridge 在更近的 AI 辅助执行转向之前，已经进入大型企业和公共部门工作流。因此，本章有足够证据确认资本历史和
              客户名单质量，但还不足以证明当前客户集中度、治理权利或资产负债表韧性。
