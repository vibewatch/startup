      - number: '7.2'
        title: 监管、法律和平台风险栈
        blocks:
          - type: paragraph
            body: >-
              Tridge
              所处类别里，软件风险和贸易合规风险相互重叠。公司不只是发布内容；它在推动寻源、供应商发现、出口促进、采购决策，并在部分情况下借助智能体辅助工作流提速。这让普通软件问题的后果更重，因为坏数据、薄弱筛查或不清晰的责任边界，可能传导到贸易、寻源或合同纠纷。为本章审阅的官方来源强化了这一点。WTO
              SPS 规则、GS1 可追溯性标准、CBP 强迫劳动执法、BIS 出口许可指南和欧洲数据保护义务都表明，全球食品贸易工作流需要严格记录和治理。Tridge
              的隐私和条款页面显示，管理层知道法律和合同边界，但公开证据没有延伸到完整控制包、第三方审计摘要或按司法辖区展开的合规地图。因此，监管姿态既不是红旗，也不是已解决问题。它是真正的尽调事项；当 Tridge
              从情报更深地推进到工作流执行时，严重性会随之上升。
