    {
      "id": "durability-risks-and-diligence-next-steps",
      "title": "Durability risks and diligence next steps",
      "body": "Two competitive risks deserve explicit weight. First, Tridge competes in a zone where free public data, generic outreach tooling, and large adjacent software vendors can reproduce portions of the customer workflow. That makes the moat weaker if customers buy one narrow use case at a time. Second, the 2024 KED Global distress reporting raises the possibility that Tridge may need to defend its position with less capital flexibility than headline unicorn narratives imply. Those risks do not erase the platform's differentiation, but they do limit confidence in any claim of category leadership. The right diligence posture is therefore to test whether customers actually adopt the bundle, whether Tridge wins because of unique intelligence plus execution, and whether the company still has the capital base to keep compounding product depth against better-financed or more focused rivals. It is equally important to understand where Tridge loses. If customers mainly buy one-off reports, one-off introductions, or subsidized agency programs, then adjacent specialists can attack those surfaces very quickly. If customers instead renew because data, counterparties, and execution all improve together, then the company has a more durable wedge than any single competitor page can show.",
      "claimRefs": [
        "CP020",
        "CP024",
        "CP033",
