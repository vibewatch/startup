    "title": "Customers",
    "summary": "Tridge has real customer proof across enterprise buyers, exporters, and government-linked programs. The unresolved question is not whether customers exist, but whether these proof points convert into durable, well-distributed recurring revenue."
  },
  "sections": [
    {
      "id": "segments-and-proof-points",
      "title": "Customer segments and public proof points",
      "body": "Tridge has unusually broad public customer proof for a private company operating in a specialized trade niche. Independent and official sources place it in workflows touching enterprise buyers, government agencies, exporters, traders, and channel partners. KED Global named large commercial and public-sector customers in 2022, while the more recent ITA, Jeju, and Hoang Phat case studies show the platform being used for SME export promotion, buyer discovery, and pricing optimization. That breadth matters because it demonstrates that Tridge is not selling into only one narrow buyer persona. It also suggests the platform can support both commercial and institutional use cases across countries. The strongest immediate positive is therefore not any single customer metric, but the diversity of evidence that real counterparties use the system for real trade or export workflows. Owned surfaces added during this pass—Stories, Success Stories, webinars, and the commodity-exporter workflow page—also show that Tridge treats customer proof as part of a repeatable acquisition system rather than as isolated testimonials. That matters because the company appears to sell a mix of intelligence, export enablement, and execution support, so buyer education is likely part of conversion. Still, these owned references mostly prove message discipline and segment targeting, not contract durability. The right reading is that Tridge has assembled enough public evidence to show real demand across several customer types, while still leaving open the more investment-relevant questions of average spend, renewal behavior, and whether public-sector or program customers behave differently from commercial accounts.",
