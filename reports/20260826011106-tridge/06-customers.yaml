    {
      "id": "scale-claims-expansion-and-missing-economics",
      "title": "Scale claims, expansion logic, and missing economics",
      "body": "The next question is how much of that breadth translates into durable customer economics. The public record offers many network-size and activity signals—buyers, distributors, sellers, partners, and content reach—but those are not the same as active paying accounts. Programmatic success stories can be strategically valuable, especially if they turn Tridge into the default export-enablement layer for agencies or exporters, yet they can also hide low recurrence or subsidy-heavy economics. The platform logic does suggest plausible expansion paths from insight consumption into procurement, sourcing, and execution workflows. Still, no reviewed source discloses gross retention, NRR, concentration, or ACV. As a result, the customer chapter can be positive on proof and cautious on monetization quality at the same time. External directories and market-profile pages add a small amount of triangulation but not a decisive amount of underwriting comfort. Profiles on F6S, Crunchbase, CB Insights, and RocketReach help confirm that Tridge is recognized as a business software or trade-platform company serving operating customers, and they reinforce that the company built enough visibility to be catalogued across startup data vendors. However, those pages do not solve the main diligence problem. None of them publishes cohort retention, usage intensity, or concentration. In practice, they are best treated as discovery aids and category corroboration, not as evidence that the large top-of-funnel footprint reliably converts into recurring revenue with strong unit economics.",
