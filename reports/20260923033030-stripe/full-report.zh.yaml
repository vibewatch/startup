  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式：处理核心，加上软件和平台附加变现
        blocks:
          - type: paragraph
            body: >-
              Stripe 的财务故事最好被理解为支付 + 软件的混合模式，而不是纯处理商。公开证据支持三层变现。第一层是超大规模的核心支付处理和收单经济性。第二层是借助 Billing、Revenue
              和财务自动化产品面的软件与工作流变现。第三层是通过 Connect 实现的平台资金流转和市场平台变现。公司 2025 年度更新称 Revenue 套件有望在 2026 年达到 $1B
              运行率，让这种组合具体了很多。Billing 和 Connect 定价页也说明，软件和平台变现是明确目标，不只是商户收单的副作用。这一点重要，因为 Stripe
              估值的乐观逻辑依赖软件附加变现推动利润率扩张。弱点在于，公开材料仍没有给出清晰的分部拆分、确认收入桥，或薄利处理经济性与更高价值软件收入之间的毛利率切分。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
