              - CM004
      - number: '2.4'
        title: 佐证材料
        blocks:
          - type: callout
            title: Stripe 从复杂性中受益，胜过从原始 TAM 话术中受益
            body: 最强的公开市场证据表明，当支付方式、地区和产品表面变得难以在内部管理时，Stripe 更容易赢。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: callout
            title: 支付价值增长不保证利润池同步增长
            body: 钱包、A2A 轨道和收入池增速放缓，都可能限制抽佣率扩张，即使数字支付总支出继续上升。
            calloutType: risk
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合：Stripe 很宽，但不是处处位置最好
        blocks:
          - type: paragraph
            body: >-
              Stripe 的竞争地图应按商户问题切分，而不是按简单份额排名。大型企业商户重视直接收单、全渠道宽度和经审计公开披露时，Adyen 和 Worldpay 仍很强。Checkout.com
              是最接近的私有同行，面向需要可配置 API 和本地收单的数字原生全球商户。PayPal 和 Venmo 结账组合影响转化经济性时，Braintree 仍然重要；Square 则主导许多 SMB
              和线下工作流。关键含义是，Stripe 面对的不是单一对手；买方是企业零售商、软件平台、快速成长初创公司，还是线下占比高的商户，对手类别都不同。这种分层反而支持 Stripe
              的定位，因为在开发者体验、产品打包和快速上线最重要的场景里，它仍看起来最强。但这也意味着，不能只凭 Stripe 在互联网原生团队中的品牌强度，就假设它能拿到全球企业份额。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 定价、打包，以及公开费率表在哪里有用、在哪里没用
        blocks:
          - type: paragraph
            body: >-
              公开定价页显示，这个领域的打包方式差异很大。Stripe 的标价对自助商户和平台仍容易理解；Connect 又加入了明确的平台经济性结构，比如按账户收费、付款费用和收入分成选项。Adyen 更偏企业式
              interchange++ 结构，Checkout.com 强调定制交易，Braintree 发布以钱包为重的价格，Square 则明显为 SMB
              和线下简洁性优化。这些差异重要，因为定价部分映射了销售打法。Stripe 的打包对产品驱动采用和平台开发者相对有利；商户想要定制收单经济性时，Adyen 和 Checkout.com
              看起来更强；买方重视简单商户服务包时，Square
              胜出。证据也支持另一个判断：不能只靠费率表决策。独立比较来源强调，欺诈工具、合规、钱包组合和集成深度都是实质购买驱动，这也解释了为什么即使表面费率相近，切换成本仍可能很高。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.3'
        title: 耐久性、切换成本与竞争下行
        blocks:
          - type: paragraph
            body: >-
              Stripe 的护城河真实存在，但有条件。最强的耐久性信号来自集成深度、Connect 带来的平台嵌入、Billing
              带来的软件增购，以及欺诈和付款工作流的运营黏性。独立开发者来源和比较来源也说明，支付基础设施一旦嵌入代码、财务运营和商户工作流，就很难拆掉。同时，公开证据也指向真实侵蚀路径。大型商户越来越多地采用多 PSP
              路由；Adyen、Checkout.com 等企业级同行继续投入本地覆盖和定制经济性；PayPal、Block、Worldpay、Fiserv
              等既有巨头保留庞大装机基础或渠道力量。因此，在价格竞争把核心处理商品化之前，只要 Stripe 能继续复利产品宽度和工程亲和力，它就最强。尽调问题不是 Stripe
              有没有护城河，而是护城河扩张速度是否足以抵消企业客户成熟度和商户议价能力上升。这个框架带来一个实际尽调立场：应按市场、按工作流比较
              Stripe，而不是给它加冕为全能领导者。它在开发者主导的互联网基础设施中看起来最强；在本地收单深度、全渠道地面销售或钱包原生消费者信任主导购买决策的地方更弱。高质量竞争章节因此支持一个耐久但并非无懈可击的护城河。竞争尽调应集中在大商户路由行为、Connect
              留存，以及软件附加价值是否能比价格压力更快地抬高切换成本。这个细节重要，因为未来份额将由定价塑造，而不只是品牌。后续尽调应关注按商户规模划分的胜率、Connect 留存，以及成熟客户在采用多 PSP
              路由时，多大频率不会实质降低 Stripe 在其支付流量中的份额。这些是判断 Stripe
              正在加深护城河，还是只是参与一轮广义支付繁荣的最清晰实证测试。这是最重要的竞争记分板。切换行为证据最关键。竞争耐久性仍需要随时间实证衡量。
