  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与工作流定义
        blocks:
          - type: paragraph
            body: >-
              Stripe 的公开产品定义比支付更宽，也比泛金融科技品牌话术更清晰。公司保留的产品和文档页面显示，一个以结账和资金流转为中心的栈，已经延伸到计费、开票、平台、欺诈、线下收单和更新的 AI
              商务工作流。这种宽度重要，因为客户工作流不只是卡授权。Stripe 越来越想拥有从发起结账，到确认付款、订阅逻辑、税务和开票、付款编排、欺诈控制，再到下游财务运营的整条路径。最强证据就是一手文档：Payments
              覆盖 100 多种支付方式和广泛国家触达；Billing 覆盖定价和按用量变现逻辑；Connect 覆盖入驻、能力、付款和平台经济性。这是真正的产品平台，不只是收单外面包了一层
              API。尽调限制在于，内部账本和清结算架构大多没有披露，因此公开层面的信心更多来自工作流宽度，而不是后端系统设计。
            claimRefs:
              - CE001
