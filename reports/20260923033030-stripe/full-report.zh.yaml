  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：不是所有支付量都是 Stripe 可触达的
        blocks:
          - type: paragraph
            body: >-
              对 Stripe 最稳妥的市场框架，应从数字支付基础设施出发，而不是从全球所有商业交易出发。Stripe
              的经济敞口在于线上结账、账单、平台付款、跨境收单，以及一组不断扩展、由软件中介的资金流。它并不等同暴露于每一美元卡组织交易、每一条银行自有企业资金轨道，或每一个由本地处理商和银行轨道主导的国内支付市场。公开市场数据支持这种区分。Worldpay
              的长期数据集显示，电商和销售点中的数字支付价值大幅上升；BCG 则把全球支付收入定义为一个比原始交易价值更小、增长更慢的变现池。这个差异重要，因为 Stripe
              能从复杂性受益，而不只是从规模受益。钱包增多、本地支付方式碎片化和软件平台分发，都会抬高编排层的价值。但同样的变化也可能压缩抽佣率，如果更多交易量流向非卡或受监管轨道。因此，正确边界是由软件中介的数字支付及相关收入工具，而不是整个全球支付宇宙。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 规模测算视角、买方，以及有利于 Stripe 的驱动因素
        blocks:
          - type: paragraph
            body: >-
              即使没有干净的 Stripe 专属可服务市场（SAM），公开规模数据也支持一个很大的机会。Worldpay 显示数字支付支出将从 2024 年的 $18.7T 升至 2030 年的 $33.5T。BCG 另把
              2024 年支付收入定在 $1.9T，并预计到 2029 年超过 $2.4T；这个视角有用，因为 Stripe 变现的是大规模交易流中的薄薄一层，而不是交易流本身。买方地图也有利于 Stripe
              的模式。真实预算所有者往往是软件、电商或平台团队，他们需要快速落地、跨境覆盖、循环计费、欺诈工具和多方付款，而不只是便宜收单。Capgemini 和 Houlihan Lokey
              的材料进一步说明，即时支付、开放金融和无卡交易增长正在重塑商户和银行的优先级。复杂性本身就是购买理由时，Stripe 的优势最强。全球商户、市场平台、SaaS 公司和 AI
              原生初创公司，都更可能看重一个可编程层：它能在同一栈里处理支付方式多样性和收入运营。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.3'
        title: 约束、矛盾与仍然关键的市场问题
        blocks:
          - type: paragraph
            body: >-
              正面的市场叙事不能被简化成“支付市场很大”。几份保留来源都指向真实约束。BCG 预计 2024 年后增速会放缓，意味着收入池可能不会像交易量那样快扩张。Worldpay 显示钱包在电商和销售点持续拿份额；A2A
              轨道和即时支付也继续普及。这些变化帮助集成商，但也可能把经济性从传统卡利润结构中重新分配出去。TSG 的欧洲排名材料显示，商户收单仍然高度集中且具备地区差异，说明 Stripe
              所处市场里，本地覆盖、牌照和本地银行关系仍然重要。PayPal 和 Visa 文件也展示了成熟巨头在交易量和已沉淀支付凭证上仍大得多。实际含义是，Stripe
              的市场有吸引力，因为它复杂，而不是因为它没有摩擦。因此投资者更应把 Stripe
              看作变化中的支付组合里软件和编排赢家，而不是在静态总可用市场（TAM）里简单抢份额的处理商。本章支持的市场逻辑建立在复杂性租金上，而不是朴素的 TAM
              膨胀上。如果更多商业流量变成软件中介、多轨道、跨境形态，Stripe 应当受益；但投资者也应同时预期抽佣率压力、地区碎片化和监管成本会塑造利润增长斜率。尚未解决的尽调任务是量化：Stripe
              未来变现中，有多少来自更高价值的软件和编排，而不是低利润交易转手。正确的市场结论是，商户需要编排时，Stripe
              受益最大，而不是只需要原始处理时。这个区分应主导后续估值和产品风险分析。这是一个结构上有吸引力、运营上很复杂的市场。它奖励执行，而不是口号。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
