        title: 佐证材料
        blocks:
          - type: callout
            title: 规模和产品宽度是真实的
            body: 公开材料已经能支持一个判断：Stripe 既是超大规模支付处理商，也是更广义的金融软件平台，并且在 AI 商务和稳定币相邻业务上有可信延伸。
            calloutType: strength
