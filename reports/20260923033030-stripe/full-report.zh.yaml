      - number: '6.3'
        title: 耐久性、集中度与反向客户证据
        blocks:
          - type: paragraph
            body: >-
              客户质量很强，但不是单线条。正面信号包括 Substack 上的存卡行为、Anthropic 和 Manus 的 Link 采用，以及企业客户成功完成大型迁移或价格转换。这类运营结果比 logo
              本身更重要。但公开记录也包含警示信号。评论来源显示支持体验参差不齐，并存在账户摩擦投诉；Trustpilot 则明显偏反向。BuiltWith
              等广义技术追踪来源和评论聚合平台，对已安装客户基础广度和产品采用有方向性价值，但不能解决收入集中度、净留存率（NRR）、总留存率（GRR）或合同耐久性问题。因此，Stripe
              看起来是一家公司：具名部署层面的客户证据质量很高，生态层面也有可观宽度，但在集中度和队列耐久性上仍缺少足够公开披露。投资者应把客户证据评为强，再把最终信念留给私人留存和集中度数据。完整投资观点应奖励 Stripe
              异常强的公开客户证据，同时拒绝夸大公开材料能说明的续约质量和集中度。公司最好的证据很深、很现代，尤其是在企业软件和 AI
              变现中；但最弱证据恰好位于投资纪律最在意的地方：队列耐久性、头部客户敞口，以及支持或准备金摩擦如何影响客户终身价值（LTV）。这让客户章节保持正面，但仍取决于私人尽调。因此，客户章节强化了整体逻辑，同时仍留下最后推荐门槛之一：私人留存和集中度数据。公开客户证据足以支撑对采用质量的信念，但还不足以回答投资测算中每一个重要的留存或集中度问题。最后一步需要私人数据。这个缺口仍然重要。
