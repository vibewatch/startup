      - number: '4.3'
        title: 单位经济性，以及阻碍真实投资测算信心的因素
        blocks:
          - type: paragraph
            body: >-
              关键投资测算障碍仍是单位经济性。公开来源说明，支付业务因为交易利润很薄而需要巨大规模；独立报道也反复把 Stripe 的估值描述为对软件组合和持久盈利能力的押注，而不是对纯处理价差的押注。Fiserv 和
              Global Payments 的可比文件有用，因为它们显示，成熟处理商可以做到很大、服务占比很高，同时获得的经济性仍不同于软件倍数。如果软件附加变现、自动化收入和产品深度确实足够快地复利，Stripe
              可能值得溢价；但公开证据还没有揭示按产品线划分的毛利率、商户集中度、净抽佣率、欺诈损失敞口，或有多少资本被准备金和营运资金占用。因此，财务结论是：规模和轨迹偏正面，但对价格敏感的投资测算仍不完整。换句话说，财务案例在方向上有吸引力，但距离完全可承销还差一套尽调材料。公开证据支持它是一个高质量溢价企业，具备真实盈利能力和可观软件扩张；但还没有完全回答，在利润率、资本强度、客户集中度和准备金义务接受上市公司式审视时，这种质量有多少能留存下来。因此，后续估值判断必须对证据敏感，而不能机械看多。在这些披露出现之前，财务章节支持对质量和规模有信心，但不足以让人完全相信正常化盈利能力，或当前私人估值标记下的公允价值。私人尽调仍要补上这个缺口，投资测算才能达到高信心。尤其是，投资者需要产品级利润率、集中度和资产负债表细节，而不只是顶线交易量增长。缺少这些细节，公允价值只能划出区间，不能钉死。缺失的精度是最后一个主要财务障碍。价格纪律应体现这一点。
