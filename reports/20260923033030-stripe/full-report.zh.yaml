  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Stripe 从支付延伸到更高毛利的软件和自动化，客户质量耐久，复利空间由此打开。
        - 经审计的收入结构和毛利率数据会增强信心。
      - - AI 商务、稳定币和全球平台工作流带来新的邻近上行空间。
        - 需要证明变现质量和监管韧性。
      - - 私募市场稀缺性和多次要约交易验证了机构需求。
        - 股权结构表和流动性条款可显示溢价是否真正干净。
      - - 反向逻辑：当前价格已经计入大量利好。
        - 更低入场价格或上市公司式披露可抵消这一担忧。
      - - 公开可比公司仍提示，Stripe 要证明软件经济性，而不只是规模，才能支撑溢价。
        - 更多经审计的产品层面利润率细节会说明这份溢价是否挣得来。
      - - 如果员工出售需求稀薄或阶段性出现，二级市场流动性会扭曲估值标记。
        - 更完整的股权结构表解读可显示当前重估到底有多耐久。
    notes: 建议仍明确受价格约束。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 软件占比加深，Revenue / Billing 规模扩张顺利，盈利保持强劲，AI 商务开始变现
        - $180B-$220B 公允价值区间；当前估值标记可成立
        - 监管和欺诈保持可控
        - 有可能，但需要更好的披露
      - - 基准
        - 交易量保持强劲，软件附加销售推进，但披露仍不完整
        - $130B-$170B 区间；当前 $159B 标记落在其中，但接近上半区
        - 私募市场溢价可能消退
        - 从公开证据看最可信
      - - 悲观
        - 处理业务仍是核心，软件占比不及预期，或治理 / 流动性折价扩大
        - $80B-$120B 区间；当前标记显得过满
        - 倍数压缩和披露缺口都会拖累估值
        - 如果价格跑在证据前面，下行空间不小
    notes: 情景区间是投委会讨论工具，不是管理层指引。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
