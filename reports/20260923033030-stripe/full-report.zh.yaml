chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、平台边界，以及 Stripe 如今如何定义自己
        blocks:
          - type: paragraph
            body: >-
              Stripe 已经不再像一个单一产品的支付网关。它在 About 页面、年度信和文档中，把自己定位为面向企业的金融基础设施：帮助企业收款、提供资金流转，并运营可编程收入流程。这个表述重要，因为 Stripe
              正在卖的是一个打包栈：支付、Billing、平台付款、Atlas、欺诈控制，以及更新的 AI 商务和稳定币工具，都放在同一控制平面下。公司自有公开页面能支撑这种宽度。Payments
              文档和产品页展示了线上和线下收单；2025 年度更新则把叙事推向 AI
              界面、智能体商务和可编程资金流转。结果是一个以支付为分发核心、以软件和工作流工具讲述利润率扩张的商业模式。尽调上的保留是，最强的运营框架仍来自 Stripe
              自己的信件，而不是经审计、逐项列示的公开报告；因此投资者可以把产品宽度视为证据充分，但盈利结构只算部分披露。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: 创始人、控制权背景与资本市场信号
        blocks:
          - type: paragraph
            body: >-
              Stripe 仍与 Patrick 和 John Collison 紧密绑定；公开证据也继续指向一种由创始人塑形的运营模式，尽管公司已经成长为最大的私有金融科技公司之一。2024
              年以来的资本市场故事尤其重要。Stripe 在 2025 年 2 月的流动性事件把公司估值重置到 $91.5B；2026 年 2 月的要约又在短短十二个月内把估值抬到 $159B。现任和前任员工明确受益于
              2026 年要约；即使没有公开董事会材料或股权结构表披露，这也是有意义的治理和留才信号。反复要约也像一个 IPO
              压力阀：管理层可以提供流动性，同时不用承担公开市场报告纪律。这在战略上有用，但也意味着投资者仍看不到优先权、稀释和老股定价机制的完整审计图。资本信号偏正面——稀缺价值和投资者需求显然回来了——但不能等同于上市公司透明度。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
