      - number: '6.2'
        title: 具名部署，以及最佳案例真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              最强的公开客户证据来自带有可衡量结果的具名案例。Atlassian 展示了企业计费深度：它选择 Stripe，而不是内部自建计费栈；双方共同开发十多个功能，并用 Stripe 支撑复杂企业需求。Substack
              证明了平台耐久性，称自己很早就搭在 Stripe 上，并且四年不用改 Connect 入驻代码。Anthropic 提供了尤其相关的现代证据，因为它先用 Stripe 做企业变现，之后再叠加更多自助订阅工具，并在
              Data Pipeline 搭建速度、Link 使用和借助自定义 Radar 规则减少误报方面受益。Manus 和 Intercom 显示，Stripe 在快速成长的 AI 和 SaaS
              客户变现转换期仍能赢。这些例子不能证明普遍留存，但确实证明 Stripe 能同时支撑企业复杂性和极快的初创公司变现，而不会被锁在单一客户原型里。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
