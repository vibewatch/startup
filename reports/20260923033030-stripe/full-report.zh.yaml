      - number: '5.3'
        title: 信任、控制、路线图信号与技术依赖
        blocks:
          - type: paragraph
            body: >-
              Stripe 的信任姿态公开展示得比较充分，但仍带有部分营销包装。安全文档支持 PCI Level 1 定位、安全和隐私工具、Terminal 认证，以及更广泛的开发者控制表面。Radar
              提出一项有意义的技术和数据网络主张：在支付、账户滥用和争议中提供统一欺诈控制，并由大型网络训练。Terminal 显示，Stripe 的产品雄心已经超出浏览器结账，进入读卡器、离线支付、MOTO
              流程，以及多个国家的钱包支持。路线图信号也很强。Stripe 关于智能体工作流的开发者博客说明，AI
              商务定位不只是高管品牌叙事；公司正在发布落地指南，并把产品面延伸到面向智能体的支付。不过，依赖地图仍然重要。Stripe
              依赖卡网络、本地支付方式、合规工作流、云和事件基础设施，以及商户侧实施质量。公开来源支持高质量产品姿态，但不支持无风险判断。正确的产品技术结论是：Stripe
              公开可见的工程系统看起来凝聚、成熟，并且异常深入地分布到开发者工作流中。剩余未知数藏在接口边界之后——内部账本架构、硬可靠性目标、云集中度，以及服务如此宽广产品面的真实运营成本。因此，产品质量应得高分，但技术尽调仍需要更深的基础设施证据。对投资委员会来说，含义是产品质量应得高分，但基础设施尽调仍要在可靠性、云依赖和账本
              / 清结算内部机制上取得更深证据。公开记录支持相信 Stripe
              暴露给开发者的东西，但还不能让人相信这些表面之下的每一个隐藏基础设施依赖。这就是投资者剩余的技术尽调任务。它是一个强平台故事，但基础设施审计轨迹仍不完整。在当前私人估值下承销之前，深度基础设施尽调仍然必要。投资者应牢记这个区分。隐藏基础设施细节仍是最后的尽调前沿。
