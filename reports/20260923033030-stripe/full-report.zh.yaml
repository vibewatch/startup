              - CO002
      - number: '1.3'
        title: 规模、里程碑顺序与后续需要保留的反向标记
        blocks:
          - type: paragraph
            body: >-
              从 2024 年到 2025 年年度更新周期，Stripe 的公开增长表述明显变强。公司称总交易量 2024 年达到 $1.4T，2025 年又达到 $1.9T，后者被描述为约占全球 GDP 的
              1.6%。公司还称 Revenue 套件有望在 2026 年达到 $1B 运行率，2025 年加入的新公司数量超过任何此前年份，国际新增业务占比继续上升。客户品牌证据仍然是自上而下的表述，而不是完整枚举；但
              Stripe 也称自己在 Fortune 100、Nasdaq 100、Forbes AI 50 和通过 Atlas 注册的 Delaware 公司中渗透很深。2025–2026
              年新增的最大里程碑更偏战略，而不只是交易规模：Bridge 扩张、智能体商务发布、OpenAI 和 Microsoft
              商务绑定，以及稳定币交易量放大。主要反向保留不是存在性问题，而是证据问题。许多最强的规模指标仍位于公司自述页面，因此后续章节应区分已经被佐证的平台重要性，以及尚未解决的经审计财务和治理细节。基于公开证据，可以发布的结论是：Stripe
              已经从顶级初创公司跨入机构级私有基础设施，但仍没有上市公司的治理透明度。这个缺口重要，因为估值、领导层深度和监管准备度如今至少和增长速度一样关键。投资者应把这里的时间线作为后续章节的标准版本；在拿到直接尽调材料前，不要对员工数、股权结构表条款或确切总部机制制造虚假精度。公开尽调下一步应聚焦董事会结构、要约机制和经审计经济性，而不是
              Stripe 是否已经有重要性。重要性很清楚；投资测算精度还不清楚。剩余尽调工作关乎精度，而不是合法性。公开市场投资者也会问同样的问题。
            claimRefs:
