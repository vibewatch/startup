  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与采用广度
        blocks:
          - type: paragraph
            body: >-
              Stripe 的客户基础横跨企业软件、创作者平台、AI 原生初创公司和一般互联网企业；但公开证据按子分群拆开看最强，而不是把它当作一整面客户 logo 墙。公司关于市场渗透的说法有意义：Fortune 100
              的一半、Forbes Cloud 100 的大多数，以及 Forbes AI 50 的很大多数据称都使用 Stripe。关于 Billing
              的具体说法也重要，因为它显示的是装机客户中的产品宽度，而不只是结账份额。Stripe 称超过 300,000 家公司使用 Billing，并管理近 200M 个活跃订阅。这说明客户证据不只限于顶线
              TPV。买方地图因分群而异。企业客户常由财务和支付团队购买 Stripe；SaaS 和 AI
              公司常由产品和工程购买；平台则由运营和风险团队购买。这种多样性是优势，但也意味着没有一个单一留存或满意度指标能代表整个客户基础。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
