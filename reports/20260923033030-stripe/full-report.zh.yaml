      - number: '4.2'
        title: 规模、盈利能力与资本充足性信号
        blocks:
          - type: paragraph
            body: >-
              Stripe 的规模披露已经足以支撑方向性测算。公司称 2025 年平台上企业产生了 $1.9T 交易量，较 2024 年增长 34%，并表示自己在 2025
              年保持强劲盈利。分析师和交易导向来源补上了一部分图像。Sacra 估计 2025 年净收入约 $6.9B，EBITDA 约 $1.2B；PM Insights
              指向相近但略低的收入轨迹。这些不是经审计数字，但能在平台交易量、盈利能力和 2026
              年估值快速反弹之间搭起一座可信桥。资本充足性也比典型私有金融科技公司更强，因为反复要约暗示资产负债表信心和投资者支持，而不是迫在眉睫的融资压力。即便如此，公开记录仍没有给出手头现金、月度烧钱、现金跑道、债务额度或契约条款细节。投资者可以得出
              Stripe 看不出明显资本受限的结论，但不能把资产负债表强度视为已经完成充分尽调。
            claimRefs:
              - CI001
