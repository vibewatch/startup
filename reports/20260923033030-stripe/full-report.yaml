  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and adoption breadth
        blocks:
          - type: paragraph
            body: >-
              Stripe’s customer base is broad across enterprise software, creator platforms, AI-native startups, and
              general internet businesses, but the public evidence is strongest when broken into sub-segments rather
              than treated as a single logo wall. Company claims about market penetration are meaningful: half of the
              Fortune 100, most of the Forbes Cloud 100, and a large majority of the Forbes AI 50 reportedly use Stripe.
              Billing-specific claims are also important because they show product breadth inside the installed base
              rather than only checkout share. Stripe says more than 300,000 companies use Billing and that it manages
              nearly 200 million active subscriptions. That suggests customer proof is not limited to top-line TPV. The
              buyer map varies by segment. Enterprises often buy Stripe through finance and payments teams; SaaS and AI
              companies often buy through product and engineering; platforms buy through operations and risk teams. That
              diversity is a strength, but it also means no single retention or satisfaction metric can speak for the
              whole customer base.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Named deployments and what the best case studies actually prove
        blocks:
          - type: paragraph
            body: >-
              The strongest public customer proof comes from named case studies with measurable outcomes. Atlassian
              shows enterprise billing depth: it chose Stripe instead of building a billing stack internally,
              co-developed a dozen-plus features, and used Stripe to support complex enterprise needs. Substack
              demonstrates platform durability, saying it built on Stripe early and did not need to change its Connect
              onboarding code for four years. Anthropic provides particularly relevant modern proof because it used
              Stripe first for enterprise monetization and then layered more self-serve subscription tooling, with
              benefits around Data Pipeline setup speed, Link usage, and reduced false positives via custom Radar rules.
              Manus and Intercom show that Stripe still wins fast-growing AI and SaaS customers during monetization
              transitions. These examples do not prove universal retention, but they do prove that Stripe can support
              both enterprise complexity and very rapid startup monetization without being trapped in only one customer
              archetype.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.3'
        title: Durability, concentration, and adverse customer evidence
        blocks:
          - type: paragraph
            body: >-
              Customer quality is strong but not one-dimensional. Positive signals include saved-card behavior on
              Substack, Link adoption at Anthropic and Manus, and successful large migrations or pricing shifts at
              enterprise customers. Those are the kinds of operational outcomes that matter more than logos alone. But
              the public record also includes caution signals. Review sources show mixed support experience and
              account-friction complaints, while Trustpilot is materially adverse. Broad technology-tracking sources
              such as BuiltWith and review aggregators are useful directional evidence for installed-base breadth and
              product adoption, but they do not solve for revenue concentration, NRR, GRR, or contract durability.
              Stripe therefore looks like a company with high-quality customer proof at the named-deployment level and
              meaningful breadth at the ecosystem level, yet still insufficient public disclosure on concentration and
              cohort durability. Investors should score customer evidence as strong, then reserve final conviction for
              private retention and concentration data. A complete investment view should therefore reward Stripe for
              unusually strong public customer proof while refusing to overstate what public materials can show about
              renewal quality and concentration. The company’s best evidence is deep and modern, especially in
              enterprise software and AI monetization, but the weakest evidence is exactly where underwriting discipline
              matters most: cohort durability, top-customer exposure, and how support or reserve friction affects
              lifetime value. That keeps the customer chapter positive, but still conditional on private diligence. That
              is why the customer chapter strengthens the overall thesis while still leaving one of the final
              recommendation gates unresolved: private retention and concentration data. Public customer evidence is
              therefore good enough to support conviction in adoption quality, but not good enough to answer every
              retention or concentration question that matters for underwriting. That final step needs private data.
              That gap is still material.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named customer proof is unusually strong for a private company
            body: >-
              Stripe has credible production deployments across large enterprises, creator ecosystems, and AI-native
              companies, with several case studies containing real operational outcomes.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: callout
            title: Support and concentration quality still need private diligence
            body: >-
              Public review evidence and missing NRR / concentration disclosure mean customer quality should not be
              treated as uniformly pristine.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is the first structural category
        blocks:
          - type: paragraph
            body: >-
              Stripe’s most durable risk is regulatory and legal rather than purely technical. Payments businesses
              operate inside constantly shifting rules set by regulators, card networks, and financial institutions, and
              Stripe’s own documentation says as much. The retained regulatory corpus shows multiple live pressures. In
              the U.S., the CFPB’s personal-financial-data-rights rule expands open-banking and consent obligations
              around financial data access. In Europe, PSD3 and the proposed PSR would reset payment-services
              requirements at the same time that UK APP-fraud expectations and reimbursement protections are tightening
              operational standards. Stripe’s own Connect requirements updates also show that remediation work tied to
              FCA and Central Bank of Ireland expectations remains active into 2026. The March 2026 FTC warning letter
              about alleged debanking practices adds a separate consumer-protection and political scrutiny vector. None
              of these items by itself breaks the thesis, but together they show that regulatory workload is structural,
              not episodic. Investors should expect recurring compliance cost, remediation work, and reputational
              exposure around merchant access decisions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
      - number: '7.2'
        title: Operational, fraud, and merchant-account risk remain central
        blocks:
          - type: paragraph
            body: >-
              Operationally, Stripe looks strong but not invulnerable. Public documentation supports a serious security
              and fraud posture: PCI Level 1 status, a public SOC 3 report, detailed Radar controls, and an open status
              page all help. But the same documentation also makes residual risk explicit. Merchants remain responsible
              for many disputed or fraudulent payments, Stripe can suspend access when it believes fraud risk is rising,
              and the Services Agreement gives the company broad rights around reserves, setoff, and account action.
              Those provisions are commercially understandable for a high-risk payments platform, but they are also the
              substrate for customer complaints. BBB records show repeated public complaints around held funds and
              account suspensions, with a large multi-year complaint count. That does not prove systemic failure, but it
              does show that contract-driven risk management can create merchant pain, reputational damage, and support
              burden. The practical risk is not only fraud losses or outages; it is the combination of risk controls,
              reserve practices, and merchant perception.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.3'
        title: Dependency, people, and thesis-break transmission paths
        blocks:
          - type: paragraph
            body: >-
              Several softer risks deserve hard attention. Stripe depends on bank rails, payment networks, cloud and
              event infrastructure, regulators, and merchant-side implementation quality. Any weakness in those
              dependencies can flow into delays, payment failures, or compliance breaches. People and execution risk are
              also live. CNBC and TechCrunch reported 300 layoffs in January 2025, concentrated in product, engineering,
              and operations, even as management still planned to grow headcount later in the year. In isolation that is
              manageable, but the specific functions affected are the exact ones that matter most for platform
              reliability, support quality, and regulatory remediation. The investment implication is that risk should
              be tracked as a transmission system, not a list. Regulatory changes can raise onboarding friction; fraud
              or reserve actions can increase complaints; support or org churn can make remediation slower; and all of
              that can feed into customer quality and valuation compression. The thesis therefore survives only if
              Stripe continues to pair product breadth with disciplined compliance and merchant-trust execution. The
              right risk posture is therefore neither panic nor complacency. Stripe’s controls are real and its risk
              tooling is more mature than that of a typical startup, but the downside pathways are also unusually direct
              because payments infrastructure sits so close to customer cash flow. A great product can still be repriced
              lower if regulation, reserve practices, support friction, or org churn begin to degrade merchant trust
              faster than the company can remediate. Investors should therefore treat risk as a live operating variable
              rather than a static appendix. Stripe can keep the thesis intact if controls and remediation continue to
              scale with product ambition. That operating discipline is the real risk-management test for Stripe over
              the next phase of growth.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Merchant trust is the key transmission variable
            body: >-
              Many Stripe risks—from regulation to reserves to support quality—matter because they ultimately shape
              merchant trust and willingness to expand on the platform.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: The thesis assumes Stripe can keep compliance and support quality ahead of product breadth
            body: >-
              If product expansion outruns compliance remediation or merchant-support execution, the company’s quality
              premium can compress quickly.
            calloutType: assumption
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case for Stripe is straightforward and powerful. Public evidence supports enormous scale, a
              return to full-year profitability, meaningful software and automation attach, and continued product
              innovation across AI commerce and stablecoins. The customer base looks strategic, the product surface is
              hard to replicate quickly, and the private-market rerating from 2025 to 2026 reflects genuine confidence
              rather than only narrative momentum. The anti-thesis is equally clear. Stripe is still priced off private
              tenders rather than full public-market discipline, and the most important underwriting variables—audited
              revenue mix, gross margin, concentration, working capital, and governance terms—remain only partially
              visible. A high-quality company is not automatically a good entry price. Stripe therefore looks like an
              investment that is fundamentally attractive at the company level but still evidence-sensitive at the
              current price level.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Comparable framing and scenario logic
        blocks:
          - type: paragraph
            body: >-
              The comp set argues for price discipline. Stripe’s $159 billion tender mark sits above the public equity
              values of PayPal and Adyen but far below Visa and Mastercard. That is directionally sensible if investors
              see Stripe as more structurally valuable than slower-growth merchant processors but still far smaller and
              less dominant than the global card networks. The challenge is that tender marks also embed scarcity,
              private-market supply dynamics, and employee-liquidity optics. Public filings from PayPal, Visa, Block,
              Fiserv, Global Payments, and Adyen are therefore more useful than private snapshot services alone when
              triangulating what kind of revenue base and margin profile Stripe would need to justify the current mark.
              The comp conclusion is not that Stripe is obviously overpriced; it is that the current mark already
              assumes Stripe deserves a material premium to public processors. That premium is defensible only if
              software mix, profitability quality, and liquidity-governance discount remain favorable.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.3'
        title: Recommendation, price sensitivity, and what would change the call
        blocks:
          - type: paragraph
            body: >-
              The right recommendation at the current public-evidence level is track rather than buy. Stripe is almost
              certainly one of the strongest private fintech / infrastructure assets in the market, and there is no
              obvious thesis-break in product or customer quality. But investors do not need more proof that Stripe is
              good; they need more proof that the current price is sufficiently supported. The public record still
              leaves too much uncertainty around audited economics, cap-table structure, concentration, and how much of
              the premium is driven by true software economics versus private-market scarcity. A better entry price,
              audited segment financials, or explicit evidence that software / automation revenue is sustaining high
              margins would improve the call materially. Until then, Stripe deserves close tracking and likely
              aggressive diligence, but not a publishable buy recommendation from public evidence alone. That keeps the
              investment posture constructive but disciplined. Stripe is good enough that a buy case may eventually be
              justified, especially if audited financials confirm a durable software-and-automation margin layer on top
              of huge processing scale. But a report-v2 judgment is supposed to be evidence-sensitive, and the current
              evidence does not yet close the distance between admiration for the asset and conviction at the current
              price. Track is therefore the honest call. The burden of proof now sits with audited economics and
              governance detail, not with proving that Stripe matters. The company clearly matters; the remaining
              question is whether this entry price leaves enough upside for new capital. That is why price discipline
              still matters so much in this case. A better disclosed or cheaper entry would move the recommendation
              faster than another round of general company praise. It is better to miss some upside than to pay a full
              price on incomplete evidence. A disciplined investor can admire the company while still waiting for
              cleaner proof or a wider margin of safety. That standard is appropriate at this price. The premium is
              earned only with proof.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track'
            body: >-
              Stripe is one of the strongest private infrastructure assets in the market, but the current $159B private
              mark still needs more audited financial and governance detail before it earns a public-evidence buy call.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: callout
            title: The main risk is valuation-to-disclosure mismatch
            body: >-
              The company quality looks premium; the unresolved question is whether the current price already assumes a
              cleaner software-margin and governance profile than public evidence can prove.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
