  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow definition
        blocks:
          - type: paragraph
            body: >-
              Stripe’s public product definition is broader than payments and sharper than generic fintech branding. The
              company’s retained product and documentation surfaces show a stack centered on checkout and money movement
              but extended into billing, invoicing, platforms, fraud, in-person acceptance, and newer AI-commerce
              workflows. That breadth matters because the customer workflow is not simply card authorization. Stripe
              increasingly wants to own the path from checkout initiation through payment confirmation, subscription
              logic, tax and invoicing, payout orchestration, fraud controls, and downstream finance operations. The
              strongest evidence is the first-party docs themselves: Payments covers 100-plus methods and broad country
              reach, Billing covers pricing and usage-based monetization logic, and Connect covers onboarding,
              capabilities, payouts, and platform economics. This is a real product platform, not merely an API wrapper
              around acquiring. The diligence limitation is that internal ledger and settlement architecture remain
              largely undisclosed, so public confidence is stronger on workflow breadth than on back-end system design.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Architecture, integration model, and developer distribution
        blocks:
          - type: paragraph
            body: >-
              Stripe’s technical differentiation is most visible in its integration model. The public API reference
              confirms a resource-oriented, JSON-based system with explicit versioning, request IDs, pagination, and
              idempotency primitives. The webhook system extends that event-driven model into operational workflows,
              including retry logic, signature verification, thin-event migration, and integrations with Amazon
              EventBridge and Azure Event Grid. Connect documentation shows how Stripe exposes multi-party money
              movement as a programmable set of account, onboarding, capability, and payout workflows rather than as
              manual bank operations. That developer posture is reinforced by official SDK maintenance across GitHub,
              npm, PyPI, RubyGems, Packagist, NuGet, and Maven ecosystems. This is one of Stripe’s clearest moats: the
              company distributes product not only through sales and marketing pages but through the daily tools
              developers actually use. The remaining diligence question is whether product architecture quality is
              translating into commensurate reliability, support, and margin strength at very large scale.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.3'
        title: Trust, controls, roadmap signals, and technical dependencies
        blocks:
          - type: paragraph
            body: >-
              Stripe’s trust posture is well surfaced publicly but still partly marketing-mediated. Security
              documentation supports PCI Level 1 positioning, security and privacy tooling, terminal certifications, and
              broader developer-control surfaces. Radar adds a meaningful technical and data-network claim: unified
              fraud controls across payments, account abuse, and disputes trained on a large network. Terminal shows
              that Stripe’s product ambition reaches beyond browser checkout into readers, offline payments, MOTO flows,
              and wallet support across multiple countries. The roadmap signal is also strong. Stripe’s developer blog
              on agentic workflows shows that AI-commerce positioning is not only executive branding; the company is
              publishing implementation guidance and extending its surface area into agent-facing payments. The
              dependency map is still important, though. Stripe depends on networks, local methods, compliance
              workflows, cloud and event infrastructure, and merchant-side implementation quality. Public sources
              support a high-quality product posture, but not a risk-free one. That is the right product-technology
              bottom line: Stripe’s publicly visible engineering system looks cohesive, mature, and unusually well
              distributed into developer workflows. The remaining unknowns sit behind the interface boundary—internal
              ledger architecture, hard reliability targets, cloud concentration, and the real operating cost of serving
              such a broad surface area. Product quality should therefore score high, while technical diligence still
              needs deeper infrastructure evidence. For an investment committee, that means product quality should score
              high, but infrastructure diligence still needs deeper evidence on reliability, cloud dependency, and
              ledger / settlement internals. The public record supports confidence in what Stripe exposes to builders,
              but not yet in every hidden infrastructure dependency that sits underneath those surfaces. That is the
              remaining technical-diligence assignment for an investor. It is a strong platform story with a
              still-partial infrastructure audit trail. Deep infrastructure diligence remains essential before
              underwriting at the current private valuation. Investors should keep that distinction in mind. Hidden
              infrastructure details remain the final diligence frontier.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Developer distribution is a real moat
            body: >-
              Stripe’s product quality is reinforced by unusually broad official documentation and active official SDKs
              across the major software ecosystems.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: callout
            title: Back-end architecture and reliability evidence remain thinner than front-end docs
            body: >-
              The public record is rich on API surfaces and workflows but lighter on internal ledger, settlement, and
              hard SLA detail.
            calloutType: risk
