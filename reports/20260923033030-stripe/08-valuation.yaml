- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Software mix deepens, Revenue / Billing scale well, profitability stays robust, AI commerce monetizes
    - $180B-$220B fair-value envelope; current mark can work
    - Regulation and fraud remain controlled
    - Possible but needs better disclosure
  - - Base
    - Volume remains strong, software attaches but disclosure stays incomplete
    - $130B-$170B envelope; current $159B mark sits inside but near top half
    - Private-market premium could fade
    - Most plausible on public evidence
  - - Bear
    - Processing remains core, software mix disappoints, or governance / liquidity discount widens
    - $80B-$120B envelope; current mark proves too full
    - Multiple compression and disclosure gaps matter
    - Meaningful downside if price outruns evidence
  notes: Scenario ranges are committee discussion tools, not management guidance.
