- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Stripe compounds from payments into higher-margin software and automation with durable customer
      quality.
    - Audited revenue mix and gross-margin data would strengthen confidence.
  - - AI-commerce, stablecoins, and global platform workflows create new adjacency upside.
    - Evidence of monetization quality and regulatory resilience would be needed.
  - - Private-market scarcity and repeated tenders validate institutional demand.
    - Cap-table and liquidity terms could show whether the premium is truly clean.
  - - 'Anti-thesis: current price already capitalizes much of the good news.'
    - A lower entry price or public-company style disclosure could offset the concern.
  - - Public comps still suggest Stripe must prove software economics, not just scale, to justify the
      premium.
    - More audited product-level margin detail would clarify whether the premium is earned.
  - - Secondary-market liquidity can distort the mark if employee-sale demand is thin or episodic.
    - A fuller cap-table read would show how durable the current rerating really is.
  notes: Recommendation remains explicitly price-sensitive.
