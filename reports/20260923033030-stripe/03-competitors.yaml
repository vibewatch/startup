    - Large digital-native brands and fintechs
    - Configurable APIs and local acquiring
    - Less broad public product ecosystem than Stripe
  - - Braintree
    - Wallet-centric PSP
    - Owned by PayPal
    - Merchants wanting PayPal/Venmo plus card processing
    - Wallet conversion and subscriptions
    - Less expansive platform tooling than Stripe
  - - Square
    - SMB / offline payments incumbent
    - Public Block ecosystem
    - SMBs and offline-led merchants
    - Simple merchant-services bundle and POS reach
    - Weaker fit for complex global platforms
  - - Worldpay / Global Payments
    - Incumbent enterprise acquirer
    - $3.7T combined post-deal volume per filing
    - Enterprise and commerce processing
    - Scale, bank-like coverage, optimization research
    - Lower developer-first affinity
