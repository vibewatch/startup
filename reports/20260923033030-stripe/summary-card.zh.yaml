  topStrengths:
    - 规模极强，2025 年总交易量达 $1.9T，且重新实现盈利。
    - 开发者优先的产品面很宽，覆盖支付、计费、平台、欺诈防控和线下收单。
    - 企业、平台和 AI-native 公司客户证明质量高。
    - 向稳定币、自动化和智能体商务工作流扩张具备可信度。
    - 多轮要约和估值大幅重定价反映出强劲私募市场需求。
  topRisks:
    - 审计后的财务结构、毛利率和资产负债表细节披露不足，限制了对价格敏感的承销判断。
    - 美国、欧盟和英国支付监管体系下，监管与合规负担具有结构性。
    - 保留金、账户暂停或支持摩擦都可能损害商户信任。
    - Adyen、Checkout.com、PayPal/Braintree、Square 和传统收单机构的竞争压力仍然真实存在。
    - 如果软件附加收入或治理质量弱于当前私募市场预期，估值溢价可能压缩。
  unresolvedGaps:
