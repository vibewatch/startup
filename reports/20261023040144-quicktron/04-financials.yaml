  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: revenue-quality
      missingEvidence: Audited income statements separating robot hardware, integration, software, service, and recurring revenue for at least the latest three fiscal years.
      whyItMatters: Without revenue mix and recognition policy, reported deployments cannot be converted into revenue quality, growth, or recurring-revenue confidence.
      diligencePath: Request audited financial statements, revenue-recognition notes, backlog roll-forward, and contract-level examples under confidentiality.
      relatedQuestionRefs: [QI001, QI002]
      relatedTableRefs: [TI001]
    - type: missing-source
      severity: material
      topic: unit-economics
      missingEvidence: Realized pricing, gross-margin bridge, implementation cost, warranty and service cost, CAC, sales cycle, payback, and renewal or software-attach data.
      whyItMatters: A modular robotics platform can grow deployments while still producing weak contribution margins or long cash-conversion cycles.
      diligencePath: Obtain cohort-level bookings-to-cash data, bill of materials, labor hours, warranty reserves, support costs, and customer ROI studies.
      relatedQuestionRefs: [QI003, QI004, QI005]
      relatedTableRefs: [TI002, TI003]
    - type: missing-source
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash, monthly burn, runway, debt and lease obligations, restricted cash, committed capex, and financing triggers after the 2024 Series D.
      whyItMatters: The disclosed financing amount does not establish whether expansion is self-funded or dependent on another round.
      diligencePath: Request the latest management accounts, cash-flow forecast, debt and lease schedules, capex plan, and board-approved financing scenarios.
      relatedQuestionRefs: [QI006, QI007]
    - type: conflicting-data
      severity: material
      topic: traction
      missingEvidence: A reconciled definition and time series for customers, installed robots, deployments, and operating units.
      whyItMatters: Quicktron's current pages cite 45,000 installations while a 2026 trade release cites more than 42,000 robots as of 2025; scope and timing are not identical.
      diligencePath: Request a signed KPI dictionary and monthly installed-base roll-forward by geography, customer, and robot status.
      relatedQuestionRefs: [QI008]
    - type: missing-source
      severity: material
      topic: pricing-pressure
      missingEvidence: Win/loss, discounting, competitor bids, backlog, cancellation, and customer-concentration data.
      whyItMatters: Peer reporting indicates price competition can compress margins even as market demand expands.
      diligencePath: Request the last twelve months of pipeline, backlog, discount approvals, cancellations, top-customer concentration, and competitive-loss analysis.
      relatedQuestionRefs: [QI009]
