callouts:
  - calloutType: strength
    title: Commercial breadth is visible
    body: Quicktron reports a broad installed base and a modular platform spanning multiple warehouse workflows, which supports a credible systems-selling proposition even though financial conversion is undisclosed.
    claimRefs: [CI001, CI002, CI003]
  - calloutType: risk
    title: Capital adequacy cannot be underwritten
    body: The assigned evidence confirms a prior financing announcement but provides no current cash, burn, runway, debt, or margin data; a new financing dependency therefore remains a material risk.
    claimRefs: [CI009, CI010, CI011, CI012]
  - calloutType: recommendation
    title: Require finance-room evidence before pricing
    body: Treat deployment and funding figures as directional until Quicktron supplies audited statements, realized contract economics, cohort cash conversion, and a current capitalization and liquidity package.
    claimRefs: [CI004, CI007, CI010, CI012]
