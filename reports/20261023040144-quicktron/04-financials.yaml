      - ["Systems integration", "Site design, commissioning, WES/WCS/RCS integration", "Per deployment", "Not disclosed", "Inferred from deployment model; not separately reported", "Project P&L and acceptance milestones"]
      - ["Software orchestration", "RCS and related warehouse-control software", "Per site or contract; recurring basis unknown", "Not disclosed", "Official product description", "License, maintenance, attach, renewal, and hosting terms"]
      - ["Support and services", "Global technical support and local delivery", "Contract basis unknown", "Not disclosed", "Company-described capability", "Service revenue, SLA, utilization, and cost-to-serve"]
    notes: Revenue streams are an analytical decomposition of the disclosed offer, not reported segment data; null or not-disclosed values are not zero.
    claimRefs: [CI001, CI005, CI008]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Offer, Published price, Contract model, Realized pricing or discount, Evidence status, Underwriting implication]
    rows:
      - [QuickMix hybrid automation, "Not published", "Integrated multi-robot project", "Unknown", "Company materials describe scope only", "Assess project gross margin and expansion revenue"]
      - [QuickBin Ultra, "Not published", "Tote-storage and picking system", "Unknown", "Throughput is described; price is absent", "Test equipment, integration, and service contribution"]
      - [QuickCube, "Not published", "Pallet automation system", "Unknown", "System capabilities are described; price is absent", "Test capex intensity and payback by site"]
      - [RCS software, "Not published", "Control-platform component of deployment", "Unknown", "Software role is described; recurring terms are absent", "Establish software attach, renewal, and support economics"]
    notes: Official product descriptions are not list prices or realized revenue; all pricing, discounting, and contract-term fields are unavailable in the assigned evidence.
    claimRefs: [CI005, CI006, CI008]
  - id: TI003
    title: Unit-economics and capital diligence matrix
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, low, "Hardware and project mix may dominate contribution economics", "Audited gross-margin bridge by stream and cohort"]
      - [CAC or sales efficiency, null, low, "Global direct and partner expansion may require substantial selling cost", "Bookings, selling expense, cycle length, and payback"]
      - [Customer payback, null, low, "Customer ROI supports demand but does not equal Quicktron margin", "Signed ROI cases with capex, labor baseline, and ramp"]
      - [Cash burn and runway, null, low, "The Series D amount is not current cash availability", "Monthly cash flow, runway, debt, leases, and financing plan"]
      - [Revenue concentration, null, low, "Large project customers can create volatility and working-capital exposure", "Top-10 customer share, backlog, cancellations, and receivables aging"]
    notes: No public value was found for these metrics in the assigned successful prefetched sources; null means unavailable, not zero.
    claimRefs: [CI007, CI009, CI010, CI011, CI012]
