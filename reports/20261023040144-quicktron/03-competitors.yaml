      - ["Locus Robotics", "Focused AMR and orchestration competitor", "More than 15,000 AMRs claimed in a 2025 executive interview", "High-velocity fulfillment and multi-site warehouse operations", "Cloud-native orchestration and RaaS fleet elasticity", "Scale and payback statements are competitor claims, not independent benchmarks"]
      - ["Dematic / Daifuku / Swisslog", "Full-line incumbents and integrators", "Individual scale and funding are not established in retained sources", "Large automotive, pharmaceutical, retail, and complex greenfield sites", "Service networks, integration expertise, and end-to-end delivery", "Potentially longer, more capital-intensive projects; comparable terms are unavailable"]
      - ["AutoStore / Exotec / Symbotic", "Specialist and software-rich disruptors", "Individual funding and installed bases are not established in retained sources", "Small-format, retrofit, high-density, and large-distribution-center use cases", "Focused storage or automation architectures and faster deployment positioning", "Coverage may be narrower than a full mixed-workflow platform"]
      - ["Geek+ / GreyOrange", "Direct AMR and goods-to-person peers", "Named as warehouse-automation competitors; comparable scale is unavailable", "Picking, storage, sortation, retail, and 3PL", "Focused AMR and goods-to-person alternatives", "Retained evidence does not support normalized feature, price, or service comparisons"]
      - ["Internal build", "Likely entrant / substitute", "Funding and scale depend on the buyer", "Large operators with engineering talent and strategic volume", "Maximum workflow and data control", "High development burden, integration risk, and ongoing support cost"]
      - ["Manual operation plus point tools", "Status quo substitute", "No vendor funding requirement", "Lower-volume or uncertain facilities", "Low upfront automation commitment and human adaptability", "Labor availability, throughput, accuracy, and service-level constraints"]
    notes: "Scale and funding entries preserve the retained sources' dates and denominators; 'not established' means the assigned evidence does not support a comparable value."
    claimRefs: [CP001, CP006, CP007, CP009, CP010, CP012]
