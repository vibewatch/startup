      - ["Fleet orchestration", "One RCS coordinates multiple Quicktron robot types", "Cloud-native LocusONE coordinates fleets and warehouse workflows", "Software depth varies; analyst source emphasizes orchestration as strategic", "Unknown for internal build and manual status quo"]
      - ["Deployment flexibility", "Modular expansion is company-claimed", "Fleet scaling without warehouse reconfiguration is competitor-claimed", "Fixed systems may require longer implementation and higher capex", "Manual work is flexible but does not automate throughput"]
      - ["Pallet handling", "QuickCube and pallet-moving workflows are described", "Not established in the retained Locus interview", "Common within full-line material-handling portfolios", "Varies by specialist; manual handling remains a substitute"]
      - ["Commercial model", "Hardware, software, and services are visible; contract model is unknown", "RaaS subscription model is described; pricing is unknown", "Project and lifecycle-service model; pricing is unknown", "Internal payroll/capex or manual operating cost; no comparable basis"]
      - ["Trust / compliance signal", "No independently verified certification comparison retained", "No comparable certification evidence retained", "Procurement strength is described through service and integration capability", "Unknown on a normalized basis"]
      - ["Independent proof", "No independent head-to-head benchmark retained", "No independent head-to-head benchmark retained", "Analyst discussion is category-level, not vendor-specific", "No common protocol, cohort, or denominator retained"]
    notes: "The matrix marks unsupported comparisons as unknown and does not convert company or competitor claims into independent performance proof."
    claimRefs: [CP002, CP003, CP004, CP007, CP008, CP010, CP012, CP014, CP015]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns:
      - Dimension
      - Quicktron
      - Locus Robotics
      - Other alternatives
      - Diligence implication
    rows:
      - ["Public list price", "Unknown", "Unknown", "Unknown", "Obtain like-for-like site quotes; do not infer realized price from product pages"]
      - ["Packaging", "Robots, QuickMix systems, RCS, integration, and support", "AMRs, LocusONE, services, and RaaS", "Turnkey projects, specialist systems, internal build, or labor", "Separate hardware, software, implementation, and support economics"]
      - ["Upfront capital", "Unknown; modular positioning may phase deployment", "RaaS is positioned as lowering upfront commitment", "Fixed automation can have high upfront capex; internal build consumes engineering capacity", "Compare cash timing and acceptance payments by site"]
      - ["Expansion", "Additional workflows under a unified architecture are claimed", "Robots and workflows can be scaled with demand, per competitor", "Expansion paths vary by integrator and specialist", "Require multi-site cohort evidence and incremental deployment cost"]
      - ["Integration lock-in", "RCS and upstream-system interfaces may create reuse and dependence", "LocusONE and ecosystem integrations create workflow dependence", "Lifecycle services and custom integration can be sticky", "Test data rights, interface ownership, and migration cost"]
      - ["Service / distribution", "Global subsidiaries, local partners, and 24/7 support are claimed", "International platform and partner ecosystem are claimed", "Incumbent service networks or in-house teams", "Validate response times, spare-parts coverage, and channel economics"]
    notes: "No retained source provides comparable realized pricing, discounts, contract duration, service-level credits, or total-cost definitions; unknown is not zero."
    claimRefs: [CP008, CP013, CP015, CP016]
figures:
  - id: FP001
    title: "Ordinal positioning: workflow breadth (x) versus deployment flexibility (y)"
    type: quadrant
    summary: >-
      Quicktron screens as a broad platform, while focused AMR vendors emphasize
      flexible deployment and incumbents emphasize full-line scope and service depth.
    data:
      points:
        - label: Quicktron
          x: 5
          y: 4
          note: "Broad mixed-workflow portfolio; flexibility is company-claimed."
        - label: Locus Robotics
          x: 3
          y: 5
          note: "Narrower retained hardware scope with strong orchestration and fleet-elasticity claims."
        - label: Full-line incumbents
          x: 5
          y: 2
          note: "Broad delivery capability with greater fixed-system and integration intensity."
        - label: Specialist disruptors
          x: 3
          y: 4
          note: "Focused storage or automation systems positioned for retrofit or specialized use cases."
        - label: Internal build
          x: 4
          y: 2
          note: "Potentially broad custom scope but high engineering and support burden."
        - label: Manual status quo
          x: 1
          y: 4
          note: "Operationally adaptable but low in automated workflow coverage."
    approximationNotes: >-
      Analyst-authored 1-5 ordinal scores synthesize retained descriptions; they are
      not market share, measured performance, or an independent benchmark.
    claimRefs: [CP016]
callouts:
  - calloutType: risk
    title: Pricing and benchmark evidence is missing
    body: >-
      The assigned evidence does not disclose comparable realized pricing, uptime,
      implementation duration, or lifecycle cost across Quicktron and peers.
    claimRefs: [CP015]
  - calloutType: recommendation
    title: Require customer-level competitive proof
    body: >-
      Underwriting should remain research-more until reference calls, operating logs,
      and like-for-like bids validate expansion economics and service quality.
    claimRefs: [CP016]
