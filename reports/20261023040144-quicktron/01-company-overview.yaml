company:
  name: Quicktron
chapter:
  number: 1
  title: Company Overview
  summary: Quicktron is a Shanghai-founded warehouse-automation company selling autonomous mobile robots and coordinating software. Public evidence supports a 2014 founding, a Series D financing of more than $100 million, broad claimed deployment, and a 2025-2026 push toward integrated multi-scenario automation; audited financials, valuation, and governance detail remain undisclosed in the assigned evidence.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Quicktron was founded in 2014 and is headquartered in Shanghai. Its public materials describe an intralogistics automation business built around autonomous mobile robots for warehouses, fulfillment centers, and factories, with software coordinating robot fleets and customer workflows. The portfolio spans M-Series, C-Series, and F-Series robots, while the company also markets goods-to-person, pallet-to-person, shelf-to-person, storage, and material-handling solutions. This is a systems business rather than a single-purpose robot product: Quicktron positions its RCS software as the layer that coordinates multiple device types and interfaces with upstream business systems. The operating model is therefore exposed to both hardware delivery and integration complexity. The company claims 1,000+ clients, 45,000+ AMR installations, 20+ countries, 600+ patent applications, and 700+ employees, but those figures are company-issued and should not be treated as independently audited.
    claimRefs: [CO001, CO002, CO003, CO004, CO006, CO009]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Public evidence identifies Yang Wei as founder and CEO. Quicktron's public about page describes a 700-plus-person team and subsidiaries in the United States, United Kingdom, Germany, Australia, South Korea, Japan, and Singapore, but it does not provide a complete executive roster, board composition, ownership table, or governance rights. Tracxn independently lists Yang Wei as founder and CEO and displays 143 employees with the ambiguous label "as of Sep 26," a materially different scale figure from Quicktron's 700-plus company claim. The discrepancy is not resolvable from the assigned evidence and may reflect differing dates, scopes, or stale or partial coverage; it is a diligence issue rather than a basis for selecting one number. Key-person dependence is therefore potentially material because the public record clearly names the founder but does not disclose succession depth or board oversight.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and disclosure
    body: >-
      Quicktron's assigned evidence supports a Series D financing exceeding $100 million in 2024, with coverage naming Golden Oriole Capital, FarGlory Group, Wuxi Liangxi Technology Innovation Fund, and Weifang Yuanfei Industrial Fund as leads. These records support the existence and approximate size of the financing, not cash available, valuation, liquidation preferences, or current runway. A sector article places Quicktron among the ten largest AGV/AMR companies by cumulative funding and says it passed Scallog after two funding rounds in September 2024 and May 2025, but the article does not provide a fully reconciled company-level cap table. The current assigned evidence contains no audited revenue, ARR, gross margin, customer concentration, or valuation disclosure.
    claimRefs: [CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-forward-risk
    title: Milestones and forward risk
    body: >-
      The documented trajectory runs from a 2014 founding through successive financing and product milestones to international expansion and a 2025-2026 integrated-platform push. The official milestone page lists an overseas project in Southeast Asia in 2017, a 1,000-plus-AMR Cainiao warehouse in 2018, CE certification and a third-generation robot launch in 2019, a KION strategic partnership in 2020, new subsidiaries in Japan, Singapore, South Korea, and Germany in 2021, and 1,000-plus clients in 15-plus countries in 2022. More recent coverage describes the November 2025 US launch of QuickMix and the March 2026 US debut of QuickMix at MODEX. Quicktron's own 2026 materials claim more than 42,000 robots and over 1,000 customers across more than 20 countries as of 2025, but those remain company or company-syndicated claims. The principal overview risks are disclosure opacity, metric inconsistency, execution complexity in multi-robot deployments, and reliance on unverified commercial-scale claims.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
