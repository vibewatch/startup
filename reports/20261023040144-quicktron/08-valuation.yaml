      - CV003
      - CV005
      - CV006
      - CV009
      - CV012
      - CV014
      - CV016
callouts:
  - calloutType: recommendation
    title: Research-more until price and proof converge
    body: >-
      Consider investment only after audited economics and deal terms support an entry at or below
      the independently estimated range, or justify paying more through demonstrable outperformance.
    claimRefs:
      - CV007
      - CV014
      - CV015
      - CV016
  - calloutType: risk
    title: Financing is not valuation
    body: >-
      The announced Series D amount cannot be used as cash available, enterprise value, or evidence
      that future investors will receive acceptable rights.
    claimRefs:
      - CV003
      - CV008
      - CV014
