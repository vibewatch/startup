  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-quality
      missingEvidence: >-
        Audited revenue, gross margin, cash flow, backlog conversion, software attach, retention,
        warranty cost, and service-cost history.
      whyItMatters: >-
        These inputs determine whether reported installation scale converts into durable earnings
        and whether any valuation multiple is supportable.
      diligencePath: >-
        Obtain three years of audited statements, monthly management accounts, cohort schedules,
        backlog roll-forward, and hardware-plus-software margin bridges.
      relatedQuestionRefs:
        - QV002
        - QV004
        - QV005
        - QV006
    - type: private-evidence-only
      severity: material
      topic: transaction-terms
      missingEvidence: >-
        Current cap table, preferred-security terms, liquidation waterfall, debt, cash balance,
        governance rights, and actual proposed entry price.
      whyItMatters: >-
        Headline financing and enterprise value do not determine investor proceeds when dilution,
        preferences, debt, and governance protections are unknown.
      diligencePath: >-
        Review the fully diluted cap table, financing documents, debt agreements, side letters,
        board rights, and modeled exit waterfalls before price negotiation.
      relatedQuestionRefs:
        - QV001
        - QV002
        - QV005
        - QV009
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: >-
        Primary-source IPO filing, audited prospectus data, confirmed timetable, offer size, and
        exchange review status.
      whyItMatters: >-
        Third-party reporting identifies a potential exit route but cannot establish completion,
        valuation, timing, or proceeds.
      diligencePath: >-
        Obtain the confidential filing or issuer-authorized equivalent and confirm status with Hong
        Kong counsel, underwriters, and the exchange process owner.
      relatedQuestionRefs:
        - QV008
