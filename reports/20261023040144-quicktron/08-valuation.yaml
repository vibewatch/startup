    title: Recommendation logic from operating signal to decision
    type: flow
    summary: >-
      Visible scale and financing improve credibility, but missing audited economics and deal terms
      keep the recommendation at research-more.
    data:
      nodes:
        - id: operating-scale
          label: Company-reported operating scale
          detail: 45,000+ installations and 1,000+ clients
        - id: external-verification
          label: Narrower independent verification
          detail: DEPLOY verifies two deployments and a top-31% AMR peer rank
        - id: financing
          label: Financing capacity
          detail: More than $100M Series D announced
        - id: exit-option
          label: Potential exit route
          detail: Confidential Hong Kong IPO filing reported, with timing uncertain
        - id: valuation-gap
          label: Valuation evidence gap
          detail: Only a partial-confidence $800M-$1.2B estimate is public
        - id: recommendation
          label: Research-more
          detail: Require audited economics, customer cohorts, and protective terms
      edges:
        - from: operating-scale
          to: external-verification
          label: test claims
        - from: external-verification
          to: financing
          label: supports credibility
        - from: financing
          to: exit-option
          label: funds expansion
        - from: exit-option
          to: valuation-gap
          label: does not set price
        - from: valuation-gap
          to: recommendation
          label: requires diligence
    approximationNotes: >-
      The flow is a decision sequence, not a causal model; displayed amounts preserve their
      different financing, fundraising, and valuation meanings.
