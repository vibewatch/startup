company:
  name: Quicktron
chapter:
  number: 6
  title: Customers
  summary: Quicktron presents a broad warehouse-automation customer base across e-commerce, manufacturing, retail, healthcare, and 3PL, with public evidence strongest for named deployments and solution fit rather than retention or revenue durability. The clearest reference deployment is Radial Europe, while customer concentration, cohort expansion, renewal, and account-level economics remain undisclosed.
sections:
  - id: customer-segments
    title: Who buys and uses Quicktron
    body: >-
      Quicktron's public materials describe a multi-vertical customer model rather than a single end market. The company names e-commerce, manufacturing, retail, healthcare, and third-party logistics as served industries, while its product pages separate goods-to-person picking from factory material movement. Buyers are likely warehouse operators, 3PLs, retailers, manufacturers, and system integrators; users include pickers, warehouse operators, and production-line staff. This is a useful segmentation hypothesis, not a disclosed revenue mix: the available evidence does not identify payer by account, contract value by vertical, or the share of direct sales versus partner-led deployments.
    claimRefs: [CU001, CU002, CU003]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption proof and operating scale
    body: >-
      Public adoption evidence is more concrete at the deployment level than at the company-wide retention level. Quicktron's current home page displays 1,000+ clients and 45,000+ AMR installations, while Medbot reports service across more than 20 countries. Craft's directory lists one Shanghai office, but office count and country reach are not equivalent measures and do not establish field-service coverage. A customer case study documents 299 Quicktron AGVs operating across 45 pick-and-pack stations and 10 transfer stations at Radial Europe's Groningen site. That project moved from 2021 design work to a May 2023 go-live and reports higher picking and packing efficiency, but these are site-level outcomes and do not establish recurring revenue, customer retention, or a comparable company-wide utilization rate.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU011, CU016]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named customer proof, expansion, and concentration
    body: >-
      Named references span consumer fulfillment, fashion e-commerce, manufacturing, and logistics integration. Quicktron identifies customers and use cases in its own materials, while Radial and its implementation partners provide the most decision-useful external evidence because they describe the operating environment, system scale, and results. The public record does not disclose renewal rates, GRR, NRR, churn, contract duration, customer-level revenue, or top-account concentration. The 2024 financing announcement says Quicktron intends to expand overseas teams and local partnerships, which supports a growth orientation but also creates execution and channel-dependence questions. Treat customer count, logos, and claimed outcomes as separate evidence categories rather than as proof of durable recurring demand.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU015]
    tableRefs: [TU003]
  - id: diligence-gaps
    title: Customer diligence priorities
    body: >-
      The next diligence pass should request an account-level cohort file covering signed, live, paused, and churned deployments; revenue and gross margin by vertical; direct versus partner-sourced bookings; and expansion from one site to multiple sites. For each named reference, investors should verify production status, acceptance criteria, uptime, support response, implementation cost, and renewal or follow-on orders with the customer. Radial's successful deployment demonstrates that Quicktron can participate in a complex, human-and-robot workflow, but it does not answer whether the economics generalize across smaller sites or whether hardware deployments produce software-like retention. Concentration and durability therefore remain material open questions rather than negative findings.
    claimRefs: [CU012, CU013, CU014, CU015]
