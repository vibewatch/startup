      - [Radial Europe, E-commerce / 3PL, Groningen goods-to-person fulfillment, "Live in May 2023", "299 AGVs; 45 pick-and-pack stations; reported 400% higher picking efficiency", "Single site; outcome is partner/customer-reported"]
      - [Cainiao, E-commerce logistics, Warehouse automation and goods-to-person workflows, "Historical deployment described by Quicktron", "Named in Quicktron's milestone history", "No current operating or renewal metrics"]
      - [Stellantis, Automotive manufacturing, Material handling and kitting, "Official case page presents an installed case", "Official product page lists 125 AMRs and 15,000 square meters automated", "No customer quote or longitudinal KPI in retained text"]
      - [Sinopharm, Pharmaceutical distribution, Smart robotic systems, "Named by Quicktron as customer", "Appears in official customer examples", "No deployment size, outcome, or renewal evidence"]
      - ["Cubyn, Winit, Runbow, and LF Logistics", E-commerce / 3PL, QuickBin goods-to-person workflows, "Named by Quicktron; individual status not disclosed", "Company page presents them as automated customer processes", "No customer quote, deployment size, or renewal evidence"]
      - [Prism Solutions customers, E-commerce / retail / 3PL / manufacturing, Goods-to-person automation integration, "Partner offering; customer deployments not named", "Partner describes density, process, labor, and lead-time benefits", "No named end-customer or measured deployment"]
    notes: "Enumeration is partial: it covers named examples present in the retained source set, not Quicktron's full customer population. Logos and named examples do not prove retention."
    enumerationScope:
      coverage: partial
      basis: "Named customer examples retained from public Quicktron, customer, partner, and industry sources accessed for the 2026 refresh."
    claimRefs: [CU002, CU005, CU006, CU007, CU008, CU010]
figures:
  - id: FU001
    title: Customer journey from selection to expansion
    type: journey-map
    summary: Public evidence supports a path from workflow pain to integrated deployment and potential expansion, but not the renewal stage.
    data:
      items:
        - label: "1. Operational pain"
          stage: "1. Operational pain"
          title: "Throughput and footprint pressure"
          description: "Radial faced tens of thousands of box locations, 20,000 SKUs, and a two-kilometre picking line."
          touchpoints: ["SKU breadth", "cut-off pressure", "manual fulfillment limits"]
        - label: "2. Solution selection"
          stage: "2. Solution selection"
          title: "Hybrid goods-to-person design"
          description: "Radial and Dematic selected a hybrid AMR solution after workflow analysis."
          touchpoints: ["integrator search", "data analysis", "human-robot workflow"]
        - label: "3. Deployment"
          stage: "3. Deployment"
          title: "Site integration and testing"
          description: "The Groningen project moved through construction, software testing, field testing, and go-live."
          touchpoints: ["rack build", "software testing", "field validation"]
        - label: "4. Live usage"
          stage: "4. Live usage"
          title: "Robots serve pickers and packers"
          description: "299 AGVs work across pick-and-pack and transfer stations, transporting pallets and totes."
          touchpoints: ["picking", "packing", "transfer stations"]
        - label: "5. Measured outcome"
          stage: "5. Measured outcome"
          title: "Efficiency and ergonomics"
          description: "The retained case reports higher picking and packing efficiency plus ergonomic and safety benefits."
          touchpoints: ["picking speed", "packing efficiency", "operator safety"]
        - label: "6. Expansion question"
          stage: "6. Expansion question"
          title: "Renewal and multi-site growth"
          description: "Public sources do not disclose renewal, follow-on orders, or expansion cohorts."
          touchpoints: ["renewal", "multi-site rollout", "account concentration"]
    claimRefs: [CU005, CU006, CU007, CU012, CU013]
callouts:
  - calloutType: insight
    title: Reference quality is uneven
    body: "Radial provides the strongest retained customer proof because it describes a live site, implementation chronology, fleet size, and operating outcomes; company pages provide breadth but not account-level durability."
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Retention and concentration are unverified
    body: "No retained source discloses churn, renewal, NRR, GRR, contract length, top-customer share, or direct-versus-partner bookings."
    claimRefs: [CU012, CU013, CU014, CU015]
