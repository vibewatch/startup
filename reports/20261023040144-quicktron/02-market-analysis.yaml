      - [Manufacturing logistics, "Plant or distribution operations", "Material-handling staff", "Manufacturer", "Pallet and component movement", "Plant engineering", "Throughput and floor-space constraints"]
      - [Regulated sectors, "Pharmaceutical or healthcare operator", "Warehouse and compliance teams", "Regulated operator", "Traceable storage and picking", "Quality and capital committee", "Auditability and error reduction"]
