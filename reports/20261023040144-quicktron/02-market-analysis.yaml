callouts:
  - calloutType: insight
    title: "The market is large, but the category is not clean"
    body: "The spread between published forecasts is itself diligence evidence: Quicktron should be valued against a defined mobile-robot and mixed-workflow serviceable segment, not against the largest top-down warehouse-automation number."
    claimRefs: [CM005, CM006, CM009]
  - calloutType: risk
    title: "Adoption depends on proof, not only growth"
    body: "Capital intensity, integration, and a mobile-robot slowdown in China can defer projects even while long-range market forecasts remain positive."
    claimRefs: [CM011, CM012, CM013, CM014]

