callouts:
  - calloutType: strength
    title: Breadth plus orchestration is the core product thesis
    body: Quicktron's public product case is strongest where one customer needs tote, shelf, pallet, and material-handling workflows coordinated through a shared control layer.
    claimRefs: [CE001, CE004, CE005]
  - calloutType: risk
    title: Assurance evidence trails product breadth
    body: Public materials describe performance and deployment scale but do not provide comparable field reliability, certification scope, cyber controls, or lifecycle-service evidence.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014]
