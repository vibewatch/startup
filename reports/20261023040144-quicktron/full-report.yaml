chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Quicktron was founded in 2014 and is headquartered in Shanghai. Its public materials describe an
              intralogistics automation business built around autonomous mobile robots for warehouses, fulfillment
              centers, and factories, with software coordinating robot fleets and customer workflows. The portfolio
              spans M-Series, C-Series, and F-Series robots, while the company also markets goods-to-person,
              pallet-to-person, shelf-to-person, storage, and material-handling solutions. This is a systems business
              rather than a single-purpose robot product: Quicktron positions its RCS software as the layer that
              coordinates multiple device types and interfaces with upstream business systems. The operating model is
              therefore exposed to both hardware delivery and integration complexity. The company claims 1,000+ clients,
              45,000+ AMR installations, 20+ countries, 600+ patent applications, and 700+ employees, but those figures
              are company-issued and should not be treated as independently audited.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO006
              - CO009
