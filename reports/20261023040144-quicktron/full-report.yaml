      - number: '1.4'
        title: Milestones and forward risk
        blocks:
          - type: paragraph
            body: >-
              The documented trajectory runs from a 2014 founding through successive financing and product milestones to
              international expansion and a 2025-2026 integrated-platform push. The official milestone page lists an
              overseas project in Southeast Asia in 2017, a 1,000-plus-AMR Cainiao warehouse in 2018, CE certification
              and a third-generation robot launch in 2019, a KION strategic partnership in 2020, new subsidiaries in
              Japan, Singapore, South Korea, and Germany in 2021, and 1,000-plus clients in 15-plus countries in 2022.
              More recent coverage describes the November 2025 US launch of QuickMix and the March 2026 US debut of
              QuickMix at MODEX. Quicktron's own 2026 materials claim more than 42,000 robots and over 1,000 customers
              across more than 20 countries as of 2025, but those remain company or company-syndicated claims. The
              principal overview risks are disclosure opacity, metric inconsistency, execution complexity in multi-robot
              deployments, and reliance on unverified commercial-scale claims.
