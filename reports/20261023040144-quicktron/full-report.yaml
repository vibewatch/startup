  - id: FU001
    title: Customer journey from selection to expansion
    type: journey-map
    summary: >-
      Public evidence supports a path from workflow pain to integrated deployment and potential expansion, but not the
      renewal stage.
    data:
      items:
        - label: 1. Operational pain
          stage: 1. Operational pain
          title: Throughput and footprint pressure
          description: Radial faced tens of thousands of box locations, 20,000 SKUs, and a two-kilometre picking line.
          touchpoints:
            - SKU breadth
            - cut-off pressure
            - manual fulfillment limits
        - label: 2. Solution selection
          stage: 2. Solution selection
          title: Hybrid goods-to-person design
          description: Radial and Dematic selected a hybrid AMR solution after workflow analysis.
          touchpoints:
            - integrator search
            - data analysis
            - human-robot workflow
        - label: 3. Deployment
          stage: 3. Deployment
          title: Site integration and testing
          description: The Groningen project moved through construction, software testing, field testing, and go-live.
          touchpoints:
            - rack build
            - software testing
            - field validation
        - label: 4. Live usage
          stage: 4. Live usage
          title: Robots serve pickers and packers
          description: 299 AGVs work across pick-and-pack and transfer stations, transporting pallets and totes.
          touchpoints:
            - picking
            - packing
            - transfer stations
        - label: 5. Measured outcome
          stage: 5. Measured outcome
          title: Efficiency and ergonomics
          description: The retained case reports higher picking and packing efficiency plus ergonomic and safety benefits.
          touchpoints:
            - picking speed
            - packing efficiency
            - operator safety
        - label: 6. Expansion question
          stage: 6. Expansion question
          title: Renewal and multi-site growth
          description: Public sources do not disclose renewal, follow-on orders, or expansion cohorts.
          touchpoints:
            - renewal
            - multi-site rollout
            - account concentration
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU012
      - CU013
  - id: FR001
    title: Qualitative residual-risk heatmap
    type: matrix
    summary: >-
      Disclosure, integrated-system execution, and partner/capital dependencies remain high-impact risks; likelihood
      labels reflect evidence availability rather than measured event frequency.
    data:
      columns:
        - label: Likelihood signal
          detail: Qualitative assessment from the retained public evidence, not a modeled probability.
        - label: Residual impact
          detail: Potential investment impact before management diligence closes the named gaps.
      rows:
        - label: Disclosure and listing
          note: Confidential filing was reported, but current filing status and eligibility evidence are unavailable.
          values:
            - label: Medium
              tone: medium
              detail: A filing was reported by two outlets, but completion and current status remain unverified.
            - label: High
              tone: high
              detail: >-
                Missing prospectus-level financial, legal, and governance disclosure could change valuation and
                investability.
        - label: Systems and reliability
          note: Integrated control and workflow claims create a broad operational diligence surface.
          values:
            - label: Medium
              tone: medium
              detail: Architecture complexity is evidenced, while failure frequency is not.
            - label: High
              tone: high
              detail: A control or integration failure can affect multiple robot and fulfillment workflows.
        - label: Partner and capital dependency
          note: Expansion plans rely on overseas teams, local partners, and continued financing.
          values:
            - label: Medium
              tone: medium
              detail: Dependencies are stated, but concentration and contractual protections are not quantified.
            - label: High
              tone: high
              detail: Service failure or financing delay could impair deployment, support, and growth.
        - label: Certification coverage
          note: Public announcements identify certifications but not complete model and software-version coverage.
          values:
            - label: Medium
              tone: medium
              detail: Certification activity is visible, while jurisdiction and product scope remain unverified.
            - label: High
              tone: high
              detail: A scope gap could delay deployment or expose customers to safety and compliance risk.
        - label: Fleet support capacity
          note: Large deployment counts increase the service, spares, and incident-response burden.
          values:
            - label: Medium
              tone: medium
              detail: Claimed scale is material, but active-fleet and incident denominators are unavailable.
            - label: High
              tone: high
              detail: Support shortfalls could affect uptime, acceptance, renewal, and referenceability.
        - label: Financial runway
          note: Financing history does not establish cash availability, burn, margins, or committed deployment costs.
          values:
            - label: Medium
              tone: medium
              detail: Capital was raised and another raise was contemplated, but current liquidity is undisclosed.
            - label: High
              tone: high
              detail: A financing delay could constrain engineering, inventory, overseas teams, and service.
    approximationNotes: >-
      Ordinal labels are analyst judgments anchored to cited evidence and explicit gaps; they are not probabilities,
      loss estimates, or a complete enterprise-risk assessment.
    claimRefs:
      - CR002
      - CR003
      - CR008
      - CR010
      - CR012
      - CR014
  - id: FV001
    title: Recommendation logic from operating signal to decision
    type: flow
    summary: >-
      Visible scale and financing improve credibility, but missing audited economics and deal terms keep the
      recommendation at research-more.
    data:
      nodes:
        - id: operating-scale
          label: Company-reported operating scale
          detail: 45,000+ installations and 1,000+ clients
        - id: external-verification
          label: Narrower independent verification
          detail: DEPLOY verifies two deployments and a top-31% AMR peer rank
        - id: financing
          label: Financing capacity
          detail: More than $100M Series D announced
        - id: exit-option
          label: Potential exit route
          detail: Confidential Hong Kong IPO filing reported, with timing uncertain
        - id: valuation-gap
          label: Valuation evidence gap
          detail: Only a partial-confidence $800M-$1.2B estimate is public
        - id: recommendation
          label: Research-more
          detail: Require audited economics, customer cohorts, and protective terms
      edges:
        - from: operating-scale
          to: external-verification
          label: test claims
        - from: external-verification
          to: financing
          label: supports credibility
        - from: financing
          to: exit-option
          label: funds expansion
        - from: exit-option
          to: valuation-gap
          label: does not set price
        - from: valuation-gap
          to: recommendation
          label: requires diligence
    approximationNotes: >-
      The flow is a decision sequence, not a causal model; displayed amounts preserve their different financing,
      fundraising, and valuation meanings.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV009
      - CV012
      - CV014
      - CV016
