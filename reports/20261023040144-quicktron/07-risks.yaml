  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: listing-eligibility
      missingEvidence: >-
        Current filing status and classification, draft prospectus, audited revenue and R&D calculations,
        working-capital analysis, investor-validation evidence, governance rights, related parties, and
        material legal proceedings.
      whyItMatters: >-
        The reported confidential filing and generic Chapter 18C rules do not establish eligibility,
        timetable, valuation support, legal exposure, or completion probability.
      diligencePath: >-
        Obtain the latest filing package and HKEX correspondence under NDA; reconcile each eligibility test
        to audited schedules with counsel and the reporting accountant.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: reliability-and-incidents
      missingEvidence: >-
        Cohort-level uptime, MTBF, MTTR, severe incident, cybersecurity event, safety event, recall,
        acceptance-test, exception-rate, and support-resolution records.
      whyItMatters: >-
        Architecture and throughput marketing cannot quantify failure frequency, blast radius, remediation
        cost, customer disruption, or recurring support burden.
      diligencePath: >-
        Sample representative deployments by product, region, age, and partner; reconcile system telemetry,
        ticketing, root-cause analyses, customer acceptance records, and insurance claims.
      relatedQuestionRefs: [QR005]
      relatedTableRefs: [TR002]
    - type: missing-source
      severity: material
      topic: concentration-and-dependencies
      missingEvidence: >-
        Top-customer and supplier shares, direct-versus-partner bookings, partner scorecards, software and
        hardware single-source dependencies, service SLAs, renewal cohorts, and regional support capacity.
      whyItMatters: >-
        The public client and deployment counts do not reveal economic concentration, substitutability, or
        whether local partners can meet support obligations.
      diligencePath: >-
        Review customer-, supplier-, and partner-level revenue, gross margin, backlog, churn, contracts,
        incidents, staffing, certifications, and replacement lead times.
      relatedTableRefs: [TR003]
