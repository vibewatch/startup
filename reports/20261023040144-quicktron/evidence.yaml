evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: disclosure
    missingEvidence: Audited financial statements, valuation, cap table, round terms, cash balance, and runway.
    whyItMatters: >-
      Funding raised is not cash available, and without ownership and financial terms the economic and governance
      profile cannot be assessed.
    diligencePath: >-
      Request the latest audited or management financial package, capitalization table, financing documents, and a
      cash-runway bridge under NDA.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A dated employee-count definition reconciling the company's 700-plus claim with Tracxn's 143-person September 2026
      figure.
    whyItMatters: >-
      Headcount is a core scale and cost indicator, and the discrepancy affects interpretation of operating maturity and
      burn.
    diligencePath: Obtain a current payroll or contractor schedule with entity, geography, and inclusion definitions.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete executive, board, ownership, and succession roster.
    whyItMatters: >-
      Only the founder/CEO and one CFO-level executive are named in the assigned evidence, leaving key-person and
      governance risk unresolved.
    diligencePath: Request the current organization chart, board composition, reserved-matters schedule, and succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: Independent customer references and deployment records supporting client, robot, country, and utilization counts.
    whyItMatters: >-
      The strongest scale numbers are company or company-syndicated claims and may not be comparable across reporting
      periods.
    diligencePath: >-
      Obtain named-customer references, installation acceptance records, and a cohort schedule showing active versus
      historical deployments.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: Publicly verifiable legal, regulatory, outage, and customer-incident search results beyond the assigned sources.
    whyItMatters: The available pool does not establish that no adverse events occurred; it only leaves the issue unresolved.
    diligencePath: >-
      Run a dedicated multilingual legal, regulatory, incident, and customer-reference review using primary registries
      and local-language sources.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: >-
      A harmonized bottom-up SAM and SOM for Quicktron's target geographies, facility sizes, and mixed-workflow
      deployments.
    whyItMatters: Top-down estimates use inconsistent category boundaries and do not establish the portion Quicktron can serve.
    diligencePath: >-
      Obtain management's pipeline and installed-base segmentation, then reconcile it to facility counts, software
      attach, and deployment economics.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-constraints
    missingEvidence: Customer-level payback, implementation time, uptime, expansion, and renewal data by deployment type.
    whyItMatters: Market growth does not demonstrate that Quicktron converts demand into durable, profitable deployments.
    diligencePath: Request anonymized cohort data and reference calls covering tote, pallet, and mixed sites.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized hardware, software, implementation, service, discount, and contract-duration terms for comparable sites.
