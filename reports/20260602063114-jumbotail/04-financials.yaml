- id: profitability-claims-fy24-opacity-and-diligence-blockers
  title: Profitability claims, FY24 opacity, and the main underwriting blockers
  body: 'The most important diligence fact is not a reported metric but the absence of one. As of run date, public sources do not provide a clean, widely corroborated FY24 audited revenue, profit, cash, or burn picture. Tracxn''s legal-entity page says FY24 revenue was ₹914 crore, while Tofler''s public snippet shows a far lower ₹100-150 crore band, and Financial Express reported in May 2025 that FY24 figures had still not been filed publicly. That conflict is too large to average away. At the same time, management and partner messaging kept claiming a path to profitability: the debt round spoke about full operational profitability in 12 months, the March 2024 commentary moved to city-level profitability by end-2025, and SC Ventures described the merged Jumbotail-Solv platform as having strong fundamentals and a clear path to profitability. Public adverse evidence stops those claims from being underwritten at face value. Financial Express reported that audit work on Solv flagged related-party
    transactions that may have inflated revenue and could force a valuation reset, while ETRetail documented management exits and additional merger noise. Publicly, the prudent judgment is that Jumbotail has proved demand and financing access, but not yet revenue quality, consolidated margin durability, or self-funded growth. Underwrite FY23 as the last relatively solid base year, treat FY24-FY25 as opaque, and request direct financial packets before assuming the Solv deal solved the business model rather than merely recapitalized it.'
