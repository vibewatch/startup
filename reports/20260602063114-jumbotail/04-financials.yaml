- id: TI004
  title: Capital adequacy table
  columns:
  - item
  - public evidence
  - amount or status
  - why it matters
  - evidence quality
  - diligence ask
  rows:
  - - Capital raised before Series D
    - Management said $143 million equity + $14 million debt by Mar-2024
    - About $157 million cumulative before the 2025 step-up
    - Shows the business had already consumed a meaningful funding base before the Solv deal
    - Medium
    - Reconcile every round and instrument in a cap-table schedule
  - - 2025 Series D refresh
    - Widely reported June 2025 round led by SC Ventures
    - $120 million
    - Main capital reset before or alongside the Solv combination
    - High
    - Provide use-of-funds bridge and current unrestricted cash
  - - Total disclosed capital raised
    - Tracxn and multiple 2025 outlets
    - About $263 million; Inc42 tracker shows a higher $287.76 million+ figure
    - Headline capital number already needs reconciliation across databases
    - Medium
    - Provide audited cumulative financing schedule including debt, extensions, and merger-linked funding
  - - Visible venture debt round
    - Debt round disclosed in Mar-2023
    - ₹75 crore from Alteria and InnoVen
    - Confirms non-equity financing dependence
    - High
    - Provide current outstanding balance, maturity, and security terms
  - - Open and satisfied charges
    - CompanyCheck early-2026 company profile
    - ₹65.66 crore open charges; ₹146.00 crore satisfied charges
    - Suggests ongoing secured obligations plus meaningful historical financing activity
    - Medium
    - Provide MCA charge register with current status and lender-by-lender security package
  - - Charge-holder / lender mosaic
    - Tracxn legal-entity loan preview
    - 19 loans visible, including BlackSoil, ICICI, Holy Basil, Orbis, Catalyst, RBL, HDFC, Axis, and Kotak
    - Supports the thesis that working capital and structured debt matter operationally
    - Medium
    - Provide complete debt schedule, covenants, and collateral mapping
  - - Post-Solv transaction economics
    - Financial Express reported a $50 million cash-equity deal plus expected ~$120 million SC investment for ~30% of the combined entity
    - Deal structure publicly visible but audit-sensitive
    - Combined-company capitalization may differ from headline round coverage
    - Medium
    - Provide final signed transaction summary, ownership split, and opening balance sheet
  - - Cash on hand / runway
    - No public disclosure
    - Undisclosed; FY23 net loss only gives a rough burn proxy
    - Runway cannot be responsibly inferred from fundraising totals alone
    - Low
    - Provide monthly cash bridge, current cash, and minimum liquidity thresholds
  notes: Capital adequacy is only partially public; the table separates observed funding and charge evidence from the many cash and covenant items that remain private.
