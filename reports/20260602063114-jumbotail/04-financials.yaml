- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on the analysis
  - current public proxy
  - exact diligence path
  rows:
  - - FY24 audited revenue, gross margin, EBITDA, and net loss
    - Without a signed FY24 P&L, current performance and post-FY23 momentum cannot be underwritten
    - Tracxn shows ₹914 crore while Tofler shows a far lower band and Financial Express said FY24 was not yet filed
    - Obtain signed FY24 financial statements plus a reconciliation memo for every external database figure
  - - Current cash balance and monthly burn
    - Runway cannot be inferred from capital raised or annual loss alone
    - FY23 loss is a weak burn proxy; no cash balance is public
    - Request monthly management accounts, bank balances, and a 12-month liquidity bridge
  - - Lending-book size and credit-loss performance
    - Fintech can improve retention or destroy margins depending on losses and funding cost
    - Public sources confirm credit products but not NPA, write-off, or yield data
    - Request lending dashboard with vintages, delinquency buckets, expected credit loss, and partner economics
  - - Realized gross margin by stream
    - Revenue quality depends on how much margin sits in trade, software, ads, and private label
    - Public sources show mechanisms but not realized rates
    - Request segment-level gross margin and rebate bridge
  - - J24 store and city-level contribution economics
    - Profitability claims cannot be tested without unit economics below the corporate level
    - Public sources mention J24 expansion and service income only
    - Request store-cohort payback, city EBITDA, and merchant retention by channel
  - - Post-Solv consolidation and revenue-recognition adjustments
    - Audit concerns at Solv could change the quality of the combined company’s revenue and valuation
    - Public reporting only describes the audit issue and broad transaction terms
    - Request opening post-merger balance sheet, purchase accounting, and remediation of flagged related-party items
  - - Debt covenant and charge-status schedule
    - Open-charge headlines do not reveal which facilities are still binding or what assets secure them
    - CompanyCheck and Tracxn show charges and lenders, but not a clean covenant table
    - Request MCA charge documents, sanction letters, trustee deeds, and covenant compliance status
  notes: These are the highest-value finance diligence requests surfaced by the public record; blank public data is treated as a blocker, not a hole to fill with narrative.
