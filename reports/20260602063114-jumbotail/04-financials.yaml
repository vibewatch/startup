  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: fy24-financials
    missingEvidence: Signed FY24 revenue, gross margin, EBITDA, and net loss plus a reconciliation of Tracxn, Tofler, and any FY25 filing status.
    whyItMatters: Current-year valuation, growth, and margin claims cannot be trusted while public FY24 figures conflict by hundreds of crores.
    diligencePath: Obtain signed FY24 financial statements, ROC filing acknowledgement, and a management reconciliation memo for every external database figure.
    relatedQuestionRefs:
    - QI012
    - QI013
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: pricing-and-margins
    missingEvidence: Realized pricing, take rates, supplier rebates, and gross margin by stream for trade revenue, private label, ads, J24, and GoldenEye.
    whyItMatters: Revenue quality depends on margin capture, not on topline alone, and public sources never show what Jumbotail keeps after discounts and logistics.
    diligencePath: Request segment gross-margin bridge, supplier-term schedule, pricing card, and merchant-level take-rate analysis.
    relatedQuestionRefs:
    - QI005
    - QI022
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, unrestricted cash, monthly burn, runway months, and debt covenant headroom.
    whyItMatters: Runway is the central underwriting variable for a loss-making, working-capital-heavy platform and it is not inferable from capital raised alone.
    diligencePath: Obtain monthly management accounts, bank balances, debt covenant certificates, and a 12-month liquidity bridge.
    relatedQuestionRefs:
    - QI016
    - QI023
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: credit-book
    missingEvidence: Lending-book size, risk ownership, delinquency, write-offs, expected credit loss, and lender or NBFC economics.
    whyItMatters: Credit can support merchant retention while quietly consuming capital and margin if losses or funding costs are high.
    diligencePath: Request credit dashboard with vintages, NPA buckets, loss curves, partner contracts, and provisioning policy.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: j24-unit-economics
    missingEvidence: J24 store build cost, store-level payback, city contribution margin, and advertising or brand-service unit economics.
    whyItMatters: Repeated profitability guidance cannot be tested while the economics of J24, city operations, and brand monetization remain private.
    diligencePath: Request cohort-level J24 P&L, city EBITDA bridge, merchant retention by channel, and advertising gross-margin analysis.
    relatedQuestionRefs:
    - QI006
    - QI017
    - QI022
    - QI025
    relatedTableRefs:
    - TI002
    - TI003
  - type: conflicting-data
    severity: material
    topic: solv-consolidation
    missingEvidence: Solv stand-alone audited FY24, purchase-accounting adjustments, related-party remediation, and the merged opening balance sheet.
    whyItMatters: Audit concerns at Solv could materially change the quality of revenue and valuation for the combined company rather than simply its scale narrative.
    diligencePath: Request diligence room access to Solv audit findings, signed transaction documents, and post-close consolidation schedules.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI020
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: access-blocked
    severity: minor
    topic: charge-documents
    missingEvidence: Underlying MCA charge filings showing exact status, collateral, and closure date for each visible lender or trustee entry.
    whyItMatters: Public company-profile previews prove borrowing complexity but do not cleanly show which obligations remain live today.
    diligencePath: Pull MCA charge documents and sanction letters lender by lender, then map them to the current debt schedule.
    relatedQuestionRefs:
    - QI009
