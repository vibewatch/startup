- id: cost-structure-and-unit-economics
  title: Cost structure, unit-economics proxies, and why the model is capital intensive
  body: 'Public cost detail is most useful in FY23 because later audited disclosure is not cleanly available. Procurement or stock-in-trade dominated the income statement: filings-derived reports put purchase costs around ₹761 crore, roughly two-thirds of total expense. Employee expense rose to about ₹101.5 crore, transportation and distribution to about ₹60.4 crore, and advertising to about ₹17.1 crore. EBITDA margin stayed around -9.8%, only slightly worse than FY22, but the headline that matters more is the rupee-on-rupee efficiency proxy: Jumbotail spent about ₹1.36 to earn ₹1 of operating revenue in FY23. Public data also does not show realized pricing, supplier rebates, or gross margin by stream. We know merchandise dominates revenue, we know services, ads, J24, and private labels exist, and we know fintech or credit is part of the offer stack, but we do not know what those adjacencies contribute after logistics, working-capital carry, and credit risk. That makes the economics look
    more like a logistics-and-inventory platform with emerging higher-margin overlays than like a pure software marketplace. Any path to margin improvement therefore depends on better procurement terms, higher basket density, better warehouse and route utilization, tighter credit performance, and more contribution from software or brand services than public reporting currently proves.'
