tables:
- id: TI001
  title: Revenue streams table
  columns:
  - stream
  - mechanism
  - public FY23/FY24 evidence
  - current value or status
  - evidence quality
  - diligence ask
  rows:
  - - Merchandise resale / traded goods
    - Jumbotail procures or buys inventory and resells to kiranas and MSMEs
    - ₹766.59-767 crore in FY23; about 94% of operating revenue
    - Dominant stream
    - High for FY23 scale, low for realized margin
    - Provide category gross margin, supplier rebates, and inventory-turn data
  - - Marketplace commission and shipping
    - Commission, fee, and shipping income layered on marketplace transactions
    - Entrackr says the residual FY23 revenue after traded goods came from marketplace commission and shipping
    - Visible but much smaller than product resale
    - Medium
    - Disclose fee take rate, shipping pass-through economics, and merchant attach rates
  - - Services including J24 / GoldenEye
    - Service income tied to store tech, omnichannel, and operating-system-led offers
    - Inc42 reports ₹52.42 crore of FY23 service revenue and links it to J24 and GoldenEye
    - Minority but non-zero stream
    - Medium
    - Split J24, GoldenEye, store services, and any software fees separately
  - - Private label brands
    - Own-brand or managed-brand product margin on top of core trade flow
    - Management said private labels were 10-15% of revenue by Mar-2024
    - Meaningful adjunct, not the core business
    - Medium but management-quoted
    - Share private-label GMV, gross margin, and inventory holding period
  - - Advertising / brand GTM services
    - Brand activation, visibility, and demand-generation services sold into the kirana network
    - Management said it was driving revenue from advertisements and GTM products
    - Emerging adjunct stream
    - Low-Medium
    - Provide campaign revenue, repeat brand spend, and incremental margin
  - - Fintech / credit / payments
    - Working-capital, payment, and financial-service monetization around merchant relationships
    - Credit stack is described publicly, but no separate revenue line or loss line is disclosed
    - Economically visible but financially opaque
    - Low
    - Provide lending-book size, net interest or fee income, credit losses, and partner splits
  notes: FY23 mix is assembled from filings-derived media coverage and management commentary; it is not an audited segment note and null-equivalent disclosures remain private.
