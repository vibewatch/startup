  - id: capital-transaction-scale
    title: Funding history, Solv transaction, and scale claims
    body: >-
      The defining capital event for chapter 1 is the June 2025 Series D. Jumbotail said it raised $120 million led by
      SC Ventures with Artal Asia participating, and that the same period marked the completion of its acquisition of
      Solv India. Multiple outlets repeated the same core facts and put total disclosed capital at $263 million after
      the round. What remains notably less clean is valuation disclosure. Jumbotail's own release did not publish an
      exact post-money number, but several business publications treated the round as the company's unicorn moment, with
      Economic Times and Entrackr placing the pre-money range around $900-950 million and the post-money outcome above
      $1 billion once the merger-adjusted round was taken into account.

      The Solv acquisition changed more than the headline valuation narrative. Pre-close announcements described Solv as
      bringing multi-category B2B commerce and fintech capabilities outside Jumbotail's historical food-and-grocery
      focus, and post-close announcements presented the combined entity as a broader horizontal platform. That strategic
      broadening also explains the jump in claimed retailer and city coverage. Historical funding before 2025 is only
      partially reconstructible from secondary databases and long-form founder profiles: 2019 and 2021 rounds are well
      enough attested to establish continuity, while some 2024 funding data is still tracker-heavy rather than primary-
      source clean. Just as importantly, public operating disclosure still lags capital disclosure. Accessible sources at
      chapter run time did not provide current audited FY24/FY25 financials, a clean post-Solv headcount, or a post-
      merger active-retailer/GMV split, so those metrics are presented as gaps rather than guessed facts.
    claimRefs:
