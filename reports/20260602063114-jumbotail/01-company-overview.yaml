  evidenceGaps:
    - type: missing-source
      severity: material
      topic: exact-valuation-and-cap-table
      missingEvidence: Exact post-money valuation, fully diluted cap table, and ownership percentages after the Series D and Solv close
      whyItMatters: The unicorn label is public, but governance rights, dilution, and control depend on the actual priced terms and board rights
      diligencePath: Request the signed financing summary, post-close cap table, shareholder agreement highlights, and board observer rights from management
      relatedQuestionRefs:
        - QO013
        - QO023
      relatedTableRefs:
        - TO003
    - type: enumeration-incomplete
      severity: minor
      topic: leadership-and-board-completeness-for-TO002
      missingEvidence: Full board roster, committee structure, independent directors, and executive org chart beyond the named founders and investor-linked directors
      whyItMatters: Founder dependence is high, but governance quality cannot be judged fully without the complete board and committee map behind TO002
      diligencePath: Request a current board list, committee charter pack, and leadership org chart from management or counsel
      relatedQuestionRefs:
        - QO010
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: material
      topic: historical-funding-history
      missingEvidence: Primary documentation for every pre-2025 equity and debt round, including exact dates, instruments, and investor names
      whyItMatters: Chapter 1 can establish trajectory, but underwriting dilution and investor behavior requires a primary-source funding history rather than tracker aggregation
      diligencePath: Request the financing history schedule from management and reconcile it against MCA filings, debt documents, and board approvals
      relatedQuestionRefs:
        - QO014
      relatedTableRefs:
        - TO004
    - type: private-evidence-only
      severity: material
      topic: current-financials-and-gmv
      missingEvidence: Current audited FY24/FY25 revenue, gross margin, EBITDA, GMV, and profitability disclosures
      whyItMatters: Capital raised and retailer reach are insufficient to assess operating leverage, cash burn, or valuation support without current financial data
      diligencePath: Request the latest audited financial statements, MIS pack, and category-level contribution margins
      relatedQuestionRefs:
        - QO021
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: post-solv-headcount-and-active-retailers
      missingEvidence: Post-Solv headcount, active-retailer count, overlap between Jumbotail and Solv accounts, and active-city definition
      whyItMatters: The 500,000+/400+ claim is strategically important, but diligence needs the active and de-duplicated operating base, not only the combined marketing figure
      diligencePath: Request a post-merger operating dashboard with active retailers, active buyers, cities served, and headcount by function
      relatedQuestionRefs:
        - QO016
        - QO017
        - QO022
      relatedTableRefs:
        - TO001
    - type: missing-source
      severity: material
      topic: adverse-resolution-status
      missingEvidence: Documented resolution of the Adani counterfeit allegation and the full audit package behind the reported Solv diligence concerns
      whyItMatters: Chapter 1 can only preserve the existence of the allegations; unresolved compliance or diligence findings could affect reputation, valuation, and indemnity risk
      diligencePath: Request litigation status, internal investigation outputs, supplier-remediation controls, and the full merger due-diligence report
      relatedQuestionRefs:
        - QO024
        - QO025
      relatedTableRefs:
        - TO005
