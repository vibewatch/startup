company:
  name: Jumbotail
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Jumbotail is a Bengaluru-headquartered B2B food-and-grocery marketplace and new retail platform founded in 2015 by
    Ashish Jhina and S. Karthik Venkateswaran. Official and partner releases say its June 2025 $120 million Series D,
    Solv acquisition, and Gautam Jain board appointment created a combined platform serving 500,000+ retailers across
    400+ cities, while exact post-money valuation, current financials, and post-merger operating metrics remain only
    partially public.
sections:
  - id: identity-platform
    title: Identity, headquarters, and what Jumbotail actually does
    body: >-
      Jumbotail operates through Jumbotail Technologies Private Limited, a Bengaluru-based private company incorporated
      in November 2015. Public company-profile data places its registered office at Eastland Citadel on Hosur Road in
      Bengaluru, while Jumbotail's own site frames the business more simply: an India-focused B2B marketplace and new
      retail platform for food and grocery. That framing matters because Jumbotail is not just a catalog app for kirana
      stores. Its public materials consistently describe a stack that combines procurement, warehousing and logistics,
      payments and working-capital enablement, the J24 store-modernisation format, and the GoldenEye retail operating
      system.

      The company narrative is therefore a "new retail infrastructure" story rather than a narrow wholesale-marketplace
      story. Official pages emphasize reengineering the food-and-grocery value chain with technology, data science, and
      design, while partner and media profiles describe the platform as serving kirana stores, supermarkets, brands,
      traders, and MSMEs. The most current public scale claim is materially larger than older profile pages: after the
      Solv transaction, management and major business outlets said the combined platform reached 500,000+ small
      retailers across 400+ cities and towns, versus older standalone descriptions of roughly 250,000+ kiranas in 50+
      cities. For diligence, those figures should not be read as a clean apples-to-apples organic growth series because
      they mix different dates and, likely, different measurement scopes.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO024
      - CO025
      - CO026
      - CO038
      - CO039
      - CO040
