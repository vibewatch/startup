  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: credit-loss-disclosure
    missingEvidence: Partner roster, approval-rate splits, delinquency vintages, loss rates, recoveries, and write-offs for Jumbotail-linked working-capital products.
    whyItMatters: Credit can lift order frequency but can also destroy margin and retention if losses are subsidising GMV.
    diligencePath: Request lender-by-lender vintage curves, policy documents, cohort NPA data, and direct recourse terms for each credit product.
    relatedQuestionRefs:
    - QR014
  - type: private-evidence-only
    severity: blocking
    topic: current-financials
    missingEvidence: Current audited FY24/FY25 consolidated P&L, cash flow, burn, runway, and category-level gross-margin data.
    whyItMatters: Without current audited numbers, investors cannot tell whether the post-Solv strategy has improved economics or merely postponed pressure.
    diligencePath: Obtain the latest audited financial statements, management accounts, board materials, and lender covenant packages.
    relatedQuestionRefs:
    - QR016
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: conflicting-data
    severity: material
    topic: j24-rollout-baseline
    missingEvidence: A reconciled live J24 store roster, opening/closure history, and overlap-adjusted post-Solv retailer count by city.
    whyItMatters: Store-scale claims and city-expansion narratives are inconsistent in public reporting, which makes rollout execution hard to underwrite.
    diligencePath: Request a location-level store list, cohort payback, closures, and city-level active-buyer counts for J24 and legacy grocery operations.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: cyber-and-service-incidents
    missingEvidence: Independent disclosures on uptime, major incident history, penetration tests, cloud concentration, and vendor-business-continuity plans.
    whyItMatters: An app-led, vendor-portal-driven supply chain can fail quietly until merchants lose trust, and the public record does not provide strong audit evidence here.
    diligencePath: Ask for incident logs, security attestations, uptime dashboards, dependency map, and any regulator, insurer, or customer notices.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR002
    - TR003
  - type: private-evidence-only
    severity: material
    topic: post-merger-governance-remediation
    missingEvidence: Board minutes, remediation plan for Solv diligence findings, system-integration milestones, and executive-retention plan.
    whyItMatters: The main downside in this chapter is not lack of ambition but the chance that governance and integration drag erase the strategic upside.
    diligencePath: Review integration PMO documents, board papers, internal audit outputs, and retention packages for key finance and operations leaders.
    relatedQuestionRefs:
    - QR002
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: Case-status follow-through on the counterfeit matter plus current seller-level license, grievance, and recall-compliance evidence for the live platform.
    whyItMatters: The highest-severity public legal risks are visible, but the operating proof that controls were tightened after the incident is still missing.
    diligencePath: Request litigation or police-case status, seller KYC audits, product-authenticity controls, grievance logs, and FSSAI audit trail by warehouse.
    relatedQuestionRefs:
    - QR021
    - QR024
    - QR025
    - QR030
    relatedTableRefs:
    - TR001
