callouts:
- calloutType: risk
  title: The Solv deal is strategically logical but risk-raising before it is risk-reducing
  body: Jumbotail may eventually benefit from Solv’s category breadth and seller network, but the public record first shows audit questions, leadership churn, and valuation stretch. Until current audited data and remediation evidence are available, integration is a risk multiplier more than a proven moat.
  claimRefs:
  - CR001
  - CR002
  - CR027
  - CR028
  - CR029
  - CR030
- calloutType: risk
  title: Counterfeit exposure proves seller governance and product integrity are not theoretical
  body: The Adani Wilmar FIR matters because it turns an abstract marketplace-liability discussion into a realized operating failure mode. Jumbotail’s cooperation is a positive signal, but investors still need evidence that seller-vetting and post-incident controls were tightened enough to prevent recurrence.
  claimRefs:
  - CR035
  - CR036
  - CR037
  - CR032
  - CR034
- calloutType: insight
  title: In this model, daily service discipline is both the moat and the failure mode
  body: Jumbotail’s strongest public strengths—app-led ordering, dense logistics, and working-capital support—are also the reasons service or credit mistakes can destroy trust quickly. If the company cannot keep execution and underwriting tighter than rivals, horizontal expansion will amplify risk instead of absorbing it.
  claimRefs:
  - CR013
  - CR014
  - CR017
  - CR024
  - CR047
