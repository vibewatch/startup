summary:
  headline: Jumbotail 为 kirana 和 MSME 搭起了具战略相关性的 B2B 商贸与新零售平台；但公开证据仍指向批发占比高、持续亏损的经济模型，整合和控制风险也偏高，因此当前独角兽定价更适合放在观察名单，而不是进入组合。
