evidenceGaps:
  - type: missing-source
    severity: material
    topic: exact-valuation-and-cap-table
    missingEvidence: Exact post-money valuation, fully diluted cap table, and ownership percentages after the Series D and Solv close
    whyItMatters: >-
      The unicorn label is public, but governance rights, dilution, and control depend on the actual priced terms and
      board rights
    diligencePath: >-
      Request the signed financing summary, post-close cap table, shareholder agreement highlights, and board observer
      rights from management
    relatedQuestionRefs:
      - QO013
      - QO023
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-board-completeness-for-TO002
    missingEvidence: >-
      Full board roster, committee structure, independent directors, and executive org chart beyond the named founders
      and investor-linked directors
    whyItMatters: >-
      Founder dependence is high, but governance quality cannot be judged fully without the complete board and committee
      map behind TO002
    diligencePath: Request a current board list, committee charter pack, and leadership org chart from management or counsel
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: historical-funding-history
    missingEvidence: >-
      Primary documentation for every pre-2025 equity and debt round, including exact dates, instruments, and investor
      names
    whyItMatters: >-
      Chapter 1 can establish trajectory, but underwriting dilution and investor behavior requires a primary-source
      funding history rather than tracker aggregation
    diligencePath: >-
      Request the financing history schedule from management and reconcile it against MCA filings, debt documents, and
      board approvals
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: current-financials-and-gmv
    missingEvidence: Current audited FY24/FY25 revenue, gross margin, EBITDA, GMV, and profitability disclosures
    whyItMatters: >-
      Capital raised and retailer reach are insufficient to assess operating leverage, cash burn, or valuation support
      without current financial data
    diligencePath: Request the latest audited financial statements, MIS pack, and category-level contribution margins
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: post-solv-headcount-and-active-retailers
    missingEvidence: >-
      Post-Solv headcount, active-retailer count, overlap between Jumbotail and Solv accounts, and active-city
      definition
    whyItMatters: >-
      The 500,000+/400+ claim is strategically important, but diligence needs the active and de-duplicated operating
      base, not only the combined marketing figure
    diligencePath: >-
      Request a post-merger operating dashboard with active retailers, active buyers, cities served, and headcount by
      function
    relatedQuestionRefs:
      - QO016
      - QO017
      - QO022
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-resolution-status
    missingEvidence: >-
      Documented resolution of the Adani counterfeit allegation and the full audit package behind the reported Solv
      diligence concerns
    whyItMatters: >-
      Chapter 1 can only preserve the existence of the allegations; unresolved compliance or diligence findings could
      affect reputation, valuation, and indemnity risk
    diligencePath: >-
      Request litigation status, internal investigation outputs, supplier-remediation controls, and the full merger
      due-diligence report
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO005
  - type: private-evidence-only
    severity: material
    topic: jumbotail-sam-som-isolation
    missingEvidence: >-
      Current active-retailer count, repeat-order cohorts, take rate, category mix, and cluster-level share for
      Jumbotail after the Solv combination.
    whyItMatters: >-
      Without company-level operating disclosure, public sources can bracket the market but cannot isolate Jumbotail’s
      real SAM or SOM with confidence.
    diligencePath: >-
      Request active-retailer, GMV, take-rate, and cluster penetration dashboards for the last 12 months, split between
      food-grocery and broader post-Solv categories.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: retailer-base-definition
    missingEvidence: >-
      A reconciled methodology for what counts as a kirana, grocery outlet, or small retail outlet across the 12
      million, 13 million, and 15 million-plus estimates.
    whyItMatters: >-
      Store-base assumptions drive every TAM or adoption calculation, and the public estimates are definition-dependent
      rather than truly apples to apples.
    diligencePath: >-
      Ask management and sector experts which retailer taxonomy they use internally and reconcile that with channel
      definitions in analyst and trade data.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: embedded-finance-loss-performance
    missingEvidence: >-
      Credit approval rates, loss curves, delinquency buckets, provisioning, and recovery outcomes for retailer
      working-capital products sold through Jumbotail’s ecosystem.
    whyItMatters: >-
      The credit gap proves demand, but underwriting quality determines whether embedded finance deepens value or
      destroys it.
    diligencePath: >-
      Request vintage curves, NPA data, underwriting variables, and lender-partner risk-sharing terms for all active
      retailer-credit products.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: public-buyer-budget-disclosure
    missingEvidence: >-
      Publicly disclosed contract values or budget ranges for brand-distribution programs, retailer software
      subscriptions, and embedded-finance attachment rates.
    whyItMatters: Buyer paths are visible, but public budget sizes are not, which limits bottoms-up public SAM building.
    diligencePath: >-
      Request example brand contracts, pricing sheets, credit-product fee structures, and retailer cohort monetization
      metrics.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Comparable realized take rates, rebate structures, credit pricing, and retailer margin sharing across Jumbotail,
      Udaan, Reliance or METRO, and Amazon Business.
    whyItMatters: >-
      Without real commercial terms, the chapter can compare capability shapes but cannot prove who wins on contribution
      economics or pricing power.
    diligencePath: >-
      Request anonymized contract templates, category-level contribution margins, and examples of retailer invoices or
      credit statements from management and channel partners.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: peer-cohort-economics
    missingEvidence: >-
      Repeat-order frequency, cohort retention, share of wallet, delinquency, and credit-loss data for Jumbotail and its
      direct peers.
    whyItMatters: >-
      These are the core metrics needed to test whether workflow lock-in is real or whether merchants simply multi-home
      while chasing availability and price.
    diligencePath: >-
      Ask management for vintage credit performance, reorder cohorts by city and category, and merchant-level
      wallet-share studies benchmarked against competing procurement rails.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: material
    topic: goldeneye-installed-base
    missingEvidence: >-
      Installed store count, attach rates, retention outcomes, and unit economics for J24 and GoldenEye versus merchants
      who only use marketplace procurement.
    whyItMatters: >-
      Jumbotail’s clearest claimed wedge is the retail-operating-system layer, but public evidence does not yet show
      whether that layer materially improves durability or profitability.
    diligencePath: >-
      Request product-level KPIs for GoldenEye and J24, merchant case studies with before and after economics, and
      breakdowns of software-led versus commerce-led contribution.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: fy24-financials
    missingEvidence: >-
      Signed FY24 revenue, gross margin, EBITDA, and net loss plus a reconciliation of Tracxn, Tofler, and any FY25
