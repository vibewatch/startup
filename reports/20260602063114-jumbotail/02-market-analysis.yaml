tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Kirana grocery procurement
    - Store replenishment, staples, FMCG, fresh and packaged grocery procurement for small retailers
    - Consumer quick-commerce orders and large-format modern-trade sell-through
    - Independent kirana owner-operator buying for own store
    - Core Jumbotail-adjacent spend pool because procurement reliability and assortment drive reorder
      behavior
  - - Retail digitization workflow
    - Inventory, order capture, retailer OS, analytics, and QR-linked ordering or visibility tools
    - Generic consumer internet usage or unrelated SMB software
    - Retail owner, store staff, or small-business manager
    - Relevant because digitization makes procurement and financing products stickier
  - - Embedded finance for retailers
    - Working-capital loans, BNPL-style procurement credit, and credit-line products tied to merchant
      activity
    - Unsecured consumer loans and large-corporate balance-sheet financing
    - Retailer as user; lender or platform as capital provider; retailer repays
    - Important monetization adjacency because cash-flow pain is structural in small retail
  - - Brand and distributor route-to-market
    - Tools or supply programs that help FMCG brands and distributors reach kiranas more efficiently
    - National media spend, unrelated brand marketing, and modern-trade-only channel programs
    - Brand sales head, distributor owner, or trade-marketing budget owner
    - Relevant because brands still need general-trade reach and service quality
  - - Broader India retail and e-commerce context
    - National retail, grocery, and MSME commerce growth narratives that frame the outer boundary
    - Assuming all retail GMV is monetizable by one B2B grocery platform
    - Investors and strategists using high-level market narratives
    - Useful as context, but too broad to serve as Jumbotail’s practical TAM by itself
  notes: The table separates Jumbotail-adjacent monetization surfaces from much larger retail and e-commerce
    narratives. The core decision lens is small-retailer procurement plus digitization and finance, not
    all Indian retail spend.
