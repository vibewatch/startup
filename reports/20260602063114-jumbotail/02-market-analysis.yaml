    statement: Included spend in that served market covers retailer procurement, logistics-linked reorder
      workflows, store-operating software, brand-distribution enablement, and working-capital products
      that monetize through retailer activity.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM013
    - SM019
    - SM020
    - SM021
    confidence: medium
    freshness: current
    answersQuestionRefs:
