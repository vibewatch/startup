  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: jumbotail-sam-som-isolation
    missingEvidence: Current active-retailer count, repeat-order cohorts, take rate, category mix, and
      cluster-level share for Jumbotail after the Solv combination.
    whyItMatters: Without company-level operating disclosure, public sources can bracket the market but
      cannot isolate Jumbotail’s real SAM or SOM with confidence.
    diligencePath: Request active-retailer, GMV, take-rate, and cluster penetration dashboards for the
      last 12 months, split between food-grocery and broader post-Solv categories.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM002
    - TM003
  - type: conflicting-data
    severity: material
    topic: retailer-base-definition
    missingEvidence: A reconciled methodology for what counts as a kirana, grocery outlet, or small retail
      outlet across the 12 million, 13 million, and 15 million-plus estimates.
    whyItMatters: Store-base assumptions drive every TAM or adoption calculation, and the public estimates
      are definition-dependent rather than truly apples to apples.
    diligencePath: Ask management and sector experts which retailer taxonomy they use internally and reconcile
      that with channel definitions in analyst and trade data.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: embedded-finance-loss-performance
    missingEvidence: Credit approval rates, loss curves, delinquency buckets, provisioning, and recovery
      outcomes for retailer working-capital products sold through Jumbotail’s ecosystem.
    whyItMatters: The credit gap proves demand, but underwriting quality determines whether embedded finance
      deepens value or destroys it.
    diligencePath: Request vintage curves, NPA data, underwriting variables, and lender-partner risk-sharing
      terms for all active retailer-credit products.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: public-buyer-budget-disclosure
    missingEvidence: Publicly disclosed contract values or budget ranges for brand-distribution programs,
      retailer software subscriptions, and embedded-finance attachment rates.
    whyItMatters: Buyer paths are visible, but public budget sizes are not, which limits bottoms-up public
      SAM building.
    diligencePath: Request example brand contracts, pricing sheets, credit-product fee structures, and
      retailer cohort monetization metrics.
    relatedQuestionRefs:
    - QM022
    - QM023
    relatedTableRefs:
    - TM003
    - TM004
