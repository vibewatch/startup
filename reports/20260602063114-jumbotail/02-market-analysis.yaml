- id: multiple-sizing-lenses
  title: 'Multiple sizing lenses: preserve the contradictions instead of flattening them'
  body: 'The public record does not support one clean TAM-SAM-SOM stack, but it does support several useful
    lenses that bracket the opportunity. At the outer edge are broad India retail narratives such as KPMG’s
    INR 82 trillion 2024 market, Redseer-linked INR 116-125 trillion 2028 retail, and larger long-term
    grocery or retail growth narratives. A more relevant layer is India grocery itself, where Redseer
    places the market at roughly $598 billion in 2026 and $849 billion by 2030. Narrower still is the
    kirana-led channel: Redseer says kiranas still hold about 91% share in 2025 and remain around 85-86%
    by 2030. Even the served-store base is contradictory and should stay that way in the chapter: McKinsey’s
    older grocery-ecosystem lens used roughly 12 million retail outlets, Cornell cited roughly 13 million
    kiranas in 2021, and Redseer-linked eB2B reporting now talks about more than 15 million kirana stores.
    The decision-useful takeaway is not a single precise base; it is that the market is undeniably large,
    but that the answer changes materially with definition, date, and channel scope.'
