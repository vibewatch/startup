- id: drivers-constraints-and-valuation
  title: Adoption drivers, constraints, and valuation relevance
  body: 'The strongest market drivers are structural rather than cyclical. Redseer, KPMG, ICRIER, RBI,
    and the MSME policy stack all point to the same underlying forces: a fragmented supply chain, chronic
    working-capital pain, mass merchant digitization through UPI and QR, and ongoing brand need for general-trade
    reach. These are precisely the conditions under which Jumbotail’s procurement-plus-finance model can
    matter. But the same evidence base also shows why monetization is harder than the headline market
    size suggests. ICRIER highlights the sector’s informal, data-poor nature; SIDBI and BW show how large
    the formal-credit gap remains; KPMG notes limited delivery reach and channel frictions; and recent
    Economic Times and Business Standard coverage shows both the pressure of quick commerce and the need
    for brands to repair kirana relationships with better margins and service. Put differently, the opportunity
    is durable, but the value-capture math depends on density, trust, logistics discipline, and credit
    outcomes. That is why the right valuation lens is not total grocery GMV, but the subset of retailers
    and brands where Jumbotail can sustainably improve economics without blowing up credit or fulfillment
    risk.'
