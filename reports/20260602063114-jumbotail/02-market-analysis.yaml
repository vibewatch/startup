  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer
  - workflow
  - budget owner
  - adoption trigger
  rows:
  - - Cash-heavy kirana owner-operator
    - Store owner
    - Store owner and family staff
    - Store owner
    - Frequent replenishment, informal bookkeeping, thin-margin inventory turns
    - Owner-managed working capital
    - Need for reliable supply, better assortment, and procurement-linked credit
  - - More formal kirana or small supermarket
    - Owner or store manager
    - Store staff and store manager
    - Owner or entity account
    - Recurring app-based ordering, category planning, payments, and GST-linked records
    - Owner or operations manager
    - Desire to improve availability, margin mix, and digital process control
  - - Rural or remote retailer
    - Owner ordering by app, phone, or assisted channel
    - Retail owner and local delivery or sales contact
    - Owner
    - Hard-to-service replenishment with uneven traditional wholesaler access
    - Owner-managed inventory budget
    - Need for dependable delivery and formal credit where local wholesale is weak
  - - FMCG brand or distributor
    - Sales head, distributor principal, or trade-marketing lead
    - Field sales teams and channel partners
    - Brand or distributor budget
    - Route-to-market expansion, assortment placement, trade schemes, and sell-through support
    - Trade marketing or distribution budget owner
    - Need to maintain general-trade reach and service quality despite quick-commerce growth
  - - ONDC-enabled or digitally discoverable local seller
    - Seller network participant plus merchant owner
    - Merchant owner or store operator
    - Merchant owner
    - Cross-app discovery, QR-linked storefront, catalog and order management
    - Merchant owner with enablement support
    - Need for low-cost digital visibility without being locked into one marketplace
  notes: The buyer map matters because Jumbotail can monetize through retailer procurement, brand-distribution
    enablement, and finance-linked workflows. Budget ownership is highly localized in kiranas and more
    centralized in brands and distributors.
