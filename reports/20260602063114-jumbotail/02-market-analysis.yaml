- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Fragmented traditional supply chains
    - up
    - current
    - Creates a durable reason for digital procurement and service-layer consolidation
    - Request Jumbotail fill-rate, on-time delivery, and reorder-frequency data by cluster
  - - UPI and merchant-QR diffusion
    - up
    - current
    - Reduces activation friction for software and finance products aimed at small merchants
    - Request merchant-payment adoption and credit attach rates inside active retailer cohorts
  - - MSME formalization and policy support
    - up
    - 12-24 months
    - Udyam, ONDC, credit guarantees, and micro-enterprise cards can widen formal participation
    - Request management view on how many active retailers are GST or Udyam registered
  - - Working-capital shortage
    - up
    - current
    - Strengthens retailer demand for embedded-finance products tied to procurement
    - Request retailer borrowing penetration, approval rates, and renewal behavior
  - - Brand need for general-trade reach
    - up
    - current
    - Supports brand-distribution and retailer-enablement value propositions
    - Request brand-side revenue mix and retention for distribution-led accounts
  - - Thin retailer margins
    - down
    - current
    - Limits willingness to pay and raises sensitivity to delivery fees or pricing changes
    - Request retailer cohort margins before and after adoption
  - - Logistics intensity
    - down
    - current
    - Physical fulfillment makes the market operationally harder than pure software categories
    - Request city-wise drop density, warehouse utilization, and last-mile cost curves
  - - Trust and informal behavior
    - down
    - current
    - Owner-managed stores still prefer familiar relationships and may adopt slowly
    - Request assisted-ordering mix, digital-order retention, and field-sales dependency
  - - Quick-commerce pressure
    - down
    - current and rising
    - Urban basket migration can squeeze kirana relevance and retailer attention in some clusters
    - Request exposure by metro, basket type, and retailer-category mix
  - - Credit risk and underwriting opacity
    - down
    - current
    - Large MSME credit gaps create opportunity but also real default and loss risk for embedded finance
    - Request loss rates, NPA trends, and underwriting model inputs for retailer credit books
  notes: The same factors that create the opportunity also narrow the monetizable slice. Working-capital
    pain, payment digitization, and brand reach are clear drivers, but logistics, margin pressure, trust,
    and credit risk are equally material constraints.
