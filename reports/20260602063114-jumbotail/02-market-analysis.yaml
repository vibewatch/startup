    statement: Jumbotail’s practical served market is narrower than all Indian retail because the relevant
      pool is kirana digitization, B2B grocery procurement, MSME commerce workflows, and embedded finance
      tied to retailer operations.
    type: inferred
    topic: market-boundary
    sourceRefs:
