- id: FM002
  title: Buyer / segment map
  type: matrix
  layout: wide
  summary: The most attractive near-term segments combine acute procurement pain with visible budget authority,
    while brand and distributor use cases expand the market beyond pure retailer software.
  data:
    columns:
    - Budget ownership
    - Procurement pain
    - Embedded-finance need
    - Adoption trigger
    rows:
    - label: Independent kirana
      values:
      - label: High
        tone: positive
        detail: Owner directly controls buying and working-capital decisions.
      - label: High
        tone: positive
        detail: Fragmented supply and stockouts directly hit store economics.
      - label: High
        tone: positive
        detail: Thin cash cycles create demand for procurement-linked credit.
      - label: High
        tone: positive
        detail: Reliable assortment, delivery, and credit can change repeat ordering fast.
    - label: Formalizing small supermarket
      values:
      - label: Medium
        tone: neutral
        detail: Budget is still owner-led but more process-driven than a pure kirana.
      - label: Medium
        tone: neutral
        detail: Pain is still meaningful but partially solved by existing distributor links.
      - label: Medium
        tone: neutral
        detail: Needs credit, but often with better records and payment history.
      - label: High
        tone: positive
        detail: Digitization, analytics, and service levels matter more as assortment broadens.
    - label: Rural or remote retailer
      values:
      - label: High
        tone: positive
        detail: Owner usually decides alone because local channel options are limited.
      - label: High
        tone: positive
        detail: Traditional supply is weakest in remote and rural service areas.
      - label: High
        tone: positive
        detail: Formal credit access is especially valuable where informal finance dominates.
      - label: Medium
        tone: neutral
        detail: Activation may require assisted onboarding and trust-building.
    - label: FMCG brand or distributor
      values:
      - label: High
        tone: positive
        detail: Trade and distribution budgets are explicit and centrally managed.
      - label: Medium
        tone: neutral
        detail: Pain is route-to-market reach and service quality, not store replenishment itself.
      - label: Low
        tone: neutral
        detail: Credit is less about financing the brand and more about financing the retailer channel.
      - label: High
        tone: positive
        detail: Need to maintain general-trade relevance as quick commerce captures attention.
    - label: ONDC-enabled small seller
      values:
      - label: Medium
        tone: neutral
        detail: Merchant owns the economics but may rely on external enablement partners.
      - label: Medium
        tone: neutral
        detail: Discovery pain is meaningful, especially outside one marketplace.
      - label: Medium
        tone: neutral
        detail: Finance need exists but can vary with turnover and inventory mix.
      - label: Medium
        tone: neutral
        detail: Cross-app visibility and QR-led storefronts lower digital-entry friction.
