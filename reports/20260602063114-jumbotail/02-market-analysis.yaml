  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: 'Public market sizing is best treated as nested lenses: broad retail, broad grocery, kirana-led
    grocery share, and the narrower digitizing-retailer plus embedded-finance surface that Jumbotail can
    plausibly monetize.'
  data:
    nodes:
    - label: Broad India retail envelope
      detail: KPMG and Redseer-linked public sources put India retail in the INR82T 2024 to INR116-125T
        2028 range, which is too broad to serve as Jumbotail’s practical TAM.
      tone: neutral
    - label: India grocery market lens
      detail: Redseer’s public lens puts grocery at about $598B in 2026 and about $849B by 2030.
      tone: positive
    - label: Kirana-led grocery channel lens
      detail: Redseer says kiranas still hold ~91% share in 2025 and remain ~85-86% by 2030.
      tone: positive
    - label: Jumbotail-adjacent monetization surface
      detail: The monetizable slice is the digitizing subset of retailers and brands using procurement,
        software, and finance-linked workflows.
      tone: neutral
  approximationNotes: This is a lens stack, not a strict TAM-SAM-SOM waterfall. The underlying sources
    use different boundaries, time frames, and units.
