      - number: '3.3'
        title: 既有巨头、横向采购通道与资本力量
        blocks:
          - type: paragraph
            body: >-
              Reliance、METRO、JioMart 和 Amazon Business 比许多创业公司对创业公司的图谱暗示的更危险，因为它们用更强基础设施和采购可信度攻击同一笔商户支出。Reliance 的 New
              Commerce 主张公开承诺为数十万商户提供选品、数字支付、营运资金和供应链支持；其 Metro 整合已经扩大了大型 B2B 门店足迹，并把商户活动迁移到更稳固的批发通道上。JioMart
              的即时零售推进增加了另一个压力点，尤其是 Reliance 可以使用门店和履约中心，而不只依赖前置仓。Amazon Business
              又不同：它是横向采购平台，公开的合规和发票工具远强于创业同行，同时有广泛的全国选品和配送。这让它很容易成为尾部 SKU、机构需求，以及更重视采购治理而非一体化 kirana
              操作系统的商户的第二通道。Flipkart Minutes 和 Amazon Now 把同一逻辑延伸到急单篮子竞争。
