      - number: '4.3'
        title: 已融资本、债务信号与资产负债表代理
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 在搭建这个模式时反复需要新资本。2023 年 3 月，公司从 Alteria Capital 和 InnoVen Capital 融得 ₹75 crore 风险债，并承诺一年内实现运营盈利。到
              2024 年 3 月，管理层称公司自成立以来累计融资为 $143 million 股权加 $14 million 债务；2025 年 6 月，公司又融得 $120 million D 轮并完成 Solv
              交易。多家 2025 年媒体和 Tracxn 将该轮后已披露总资本放在约 $263 million；Inc42 Datalabs 则显示超过 $287.76 million
              的更高数字，因此即便是基本融资总额，也需要核对每个数据库到底包含什么。备案口径的公司资料还显示，业务在风险债头条之外使用过贷款人和受托人结构。CompanyCheck 显示，截至 2026 年初，公司有
              ₹65.66 crore 未结清抵押权和 ₹146 crore 已清偿抵押权；Tracxn 的法律实体摘要列出 19 笔贷款，可见名称包括 BlackSoil、ICICI Bank、Holy
              Basil、Orbis、Catalyst、RBL Bank、HDFC Bank、Axis Bank 和 Kotak Mahindra Bank。Tracxn
              公开预览中确切状态字符串部分被遮挡，因此公开记录更适合证明借款复杂度，而不是确认契约状态或当前未偿余额。但结论仍清楚：Jumbotail
              并非只靠股权扩张，公开债务或抵押权证据与一个承担实质营运资金和融资需求的业务相一致。
