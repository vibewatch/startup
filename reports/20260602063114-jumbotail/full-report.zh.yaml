  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景，以及独角兽故事为何在战略上说得通
        blocks:
          - type: paragraph
            body: >-
              不能把 Jumbotail 2025 年 6 月融资简单看成纯粹抬估值的戏码。公开报道和 SC Ventures 公告显示，公司获得 $120 million 新资本，与 Standard Chartered
              的风险投资部门关系更深，并完成 Solv 交易，从杂货延伸到服装、家居、玩具、体育、鞋类、消费电子等品类。SC Ventures 称，合并平台已经服务 500,000+ 家小零售商，覆盖 400
              个城市。这一点重要，因为它把 Jumbotail 从较窄的 B2B
              杂货运营商，变成更宽的商户基础设施故事：品类密度更高、卖家流动性更强，也为金融科技、J24、GoldenEye、自有品牌和品牌服务打开更多交叉销售面。


              这条战略逻辑真实存在。它解释了外部投资者为什么愿意为合并出资，也解释了多家媒体为什么在本轮后把 Jumbotail 称为独角兽。但估值标题跑在经审计事实前面。Indian Retailer 将公司估值描述为约
              $950 million，并称完全交割预计会把估值推过 $1 billion；其他报道则直接称其为独角兽，却没有调和投前估值、投后估值和交割机制。更重要的是，最后一份干净的公开 P&L 仍指向 FY23 收入约
              ₹819 crore、净亏损约 ₹264 crore，FY24 和 FY25 仍不透明，或主要靠估计。因此，本轮融资在战略上可以理解，但财务上还没有被充分承销。
