      - number: '4.2'
        title: 成本结构、单位经济性代理指标，以及为什么模式资本密集
        blocks:
          - type: paragraph
            body: >-
              公开成本细节在 FY23 最有用，因为之后经审计披露并不干净。采购或库存商品主导损益表：备案口径报道显示采购成本约 ₹761 crore，约占总费用三分之二。员工费用升至约 ₹101.5 crore，运输与分销约
              ₹60.4 crore，广告约 ₹17.1 crore。EBITDA 利润率约 -9.8%，只比 FY22 略差，但更重要的头条是卢比对卢比的效率代理：FY23，Jumbotail 每赚 ₹1 运营收入，要花约
              ₹1.36。公开数据也没有披露实际定价、供应商返利或分业务流毛利。我们知道商品主导收入，知道服务、广告、J24
              和自有品牌存在，也知道金融科技或信贷是产品栈的一部分，但不知道这些相邻业务扣除物流、营运资金占用和信贷风险后贡献多少。这让经济性看起来更像一个物流加库存平台，外加正在成长的高毛利覆盖层，而不像纯软件交易平台。任何利润率改善路径，都取决于更好的采购条款、更高的购物篮密度、更好的仓库和线路利用率、更紧的信贷表现，以及软件或品牌服务贡献高于当前公开报道所能证明的水平。
