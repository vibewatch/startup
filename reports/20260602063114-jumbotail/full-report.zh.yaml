      - number: '8.3'
        title: 情景区间和价格纪律
        blocks:
          - type: paragraph
            body: >-
              这里用情景逻辑比假精确更合适。乐观情景假设 Solv 合并撑得住，当前经审计收入明显高于 FY23 基础，并且更高毛利层——金融科技、自有品牌、J24、GoldenEye、广告和品类扩张——开始重要到让投资者把
              Jumbotail 视为不止批发分销商。在这种设定下，约 $180 million–$200 million 可信收入、5x–6x 销售额倍数，可以支撑约 $0.9 billion–$1.2
              billion；这是唯一真正验证独角兽估值标记的路径。


              基准情景更保守：约 $140 million–$170 million 可信收入、持续薄利，以及 3.5x–4.5x 倍数，得出约 $0.5 billion–$0.75
              billion。悲观情景假设审计或整合噪音、没有有意义的收入结构转移，并且披露改善前又需要融资；那么 $110 million–$140 million 收入、2x–3x 倍数，只能得到约 $0.22
              billion–$0.42 billion。这个区间故意保持粗略，但仍比把上一轮融资当成自我验证更诚实。当前公开记录支持的是偏高但并非不可能的估值：上行空间存在，但举证责任在管理层。
