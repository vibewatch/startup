      - number: '4.4'
        title: 盈利主张、FY24 不透明，以及主要承销阻碍
        blocks:
          - type: paragraph
            body: >-
              最重要的尽调事实不是某个已报告指标，而是指标缺席。截至本次运行日期，公开来源没有提供干净、被广泛交叉印证的 FY24 经审计收入、利润、现金或烧钱图景。Tracxn 的法律实体页面称 FY24 收入为 ₹914
              crore，Tofler 的公开摘要却显示低得多的 ₹100-150 crore 区间；Financial Express 2025 年 5 月报道，FY24
              数据仍未公开提交。这个冲突太大，不能取平均糊过去。与此同时，管理层和合作伙伴信息仍在声称通往盈利的路径：债务轮提到 12 个月内全面运营盈利，2024 年 3 月评论转向到 2025 年底实现城市级盈利，SC
              Ventures 则称合并后的 Jumbotail-Solv 平台基本面强、盈利路径清晰。公开反向证据阻止这些主张被照单承销。Financial Express 报道，Solv
              审计发现关联方交易，可能夸大收入并迫使估值重置；ETRetail 则记录了管理层离职和更多并购噪音。公开层面，审慎判断是：Jumbotail
              已证明需求和融资能力，但尚未证明收入质量、合并利润率耐久性或自我融资增长。应把 FY23 作为最后一个相对扎实的基准年，把 FY24-FY25 视为不透明，并在假定 Solv
              交易解决业务模型、而不只是为其再资本化之前，要求公司直接提供财务资料包。
