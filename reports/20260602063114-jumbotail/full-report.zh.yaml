  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及为什么可服务市场窄于头条零售市场
        blocks:
          - type: paragraph
            body: >-
              评估 Jumbotail，应看印度商业栈中小型零售商真正需要帮助的部分：补货、选品、营运资金、数字化下单，以及品牌或分销商触达。公开市场来源反复说明，宽泛的印度零售数字不是正确决策镜头。KPMG 和 Invest
              India 描绘的是一个很大的全国零售和电商背景；但 McKinsey、Redseer、ONDC 和 Policy Circle 都表明，经济上真正相关的问题，是碎片化、仍主要在线下的食品杂货与 MSME
              渠道。实际看，Jumbotail 的可服务市场包括 kirana 采购、零售商运营工作流、品牌分销赋能，以及与复购行为挂钩的嵌入式金融。它排除了大量组织化零售、纯消费者即时零售
              GMV，以及从不经过小型零售商的广义数字商业增长。这个边界很重要，否则市场看起来轻松巨大，真正的待完成任务、激活摩擦和变现面反而消失。
