        - 整改计划延期、关键财务负责人离职，或剔除重叠后的卖家指标仍不透明
        - 任何整合里程碑延误，或拒绝共享整改证据
        - 重估协同假设，并在承销上行空间前升级治理尽调
      - - 毛利与物流脆弱性
        - 履约率、次日达或服务水平证据恶化，而成本仍居高不下
        - 在声称已有规模收益的情况下，服务持续不达标或成本 / 收入继续恶化
        - 降低确信度，并要求先看到城市层面的单位经济性，再支持扩张
      - - 信贷 / 违约风险
        - 贷款方收缩、批准额度降低，或商户分群压力上升
        - 任何合作方收紧或催收趋势恶化，且没有盈利改善抵消
        - 下调 GMV、留存和营运资金假设
      - - 竞争强度
        - JioMart、Amazon、Flipkart 或 udaan 在核心集群出现可观察的价差、更快服务或更宽 SKU
        - 现有巨头在 Jumbotail 目标商户走廊反复压过公司
        - 假设份额增长更慢、毛利更低；不要按轻松扩品类承销
      - - 合规与商品真伪
        - 再次出现假货案件、FSSAI 警告，或与真伪 / 处理环节相关的投诉激增
        - 任何重复事件，若没有清晰根因修复和供应商控制证明
        - 暂停投资判断，直到卖家审核和合规控制被重新验证
      - - 数据 / 平台集中风险
        - 商户 app 或供应商门户宕机、安全事件，或隐私投诉外溢到运营
        - 重大事件若没有可信披露和整改计划
        - 视为打破投资论点，直到控制成熟度得到证明
    notes: 这些否决标准把本章证据转成可观察阈值；它们不是预测，但定义了继续乐观何时会变得不负责任。
