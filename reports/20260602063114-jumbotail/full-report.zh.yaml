        - 索取零售商队列采用前后的利润率
      - - 物流强度
        - 下行
        - 当前
        - 实物履约让市场运营难度高于纯软件品类
        - 按城市索取配送点密度、仓库利用率和最后一公里成本曲线
      - - 信任与非正式行为
        - 下行
        - 当前
        - 店主管理门店仍偏好熟人关系，采用可能较慢
        - 索取辅助下单占比、数字订单留存和一线销售依赖度
