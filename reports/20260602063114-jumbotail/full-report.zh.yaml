      - number: '8.2'
        title: 可比口径显示当前估值标记偏高
        blocks:
          - type: paragraph
            body: >-
              基于可比公司的读法，比战略叙事严苛得多。Inc42 的交易分析认为，B2B 杂货供应业务通常只能拿到约 2x–4x 收入倍数，除非它们是已经盈利的市场领导者；它估计 Jumbotail FY24 收入接近
              ₹1,200 crore。即使用这个乐观估计，$900 million–$1 billion 的估值也意味着约 6x–7x 收入；若用最后一份扎实的 FY23 数字 ₹819 crore，隐含倍数会更接近
              9x–10x。这高于 Udaan 2025 年约 $1.8 billion 的平轮信号，尽管 Udaan 披露收入规模大得多，仍在为走向盈利融资，并且已经从 2021 年峰值经历过一次大幅重定价。


              它也高于 Uber、InPost 等有物流支撑的平台类上市可比公司，这些公司交易更接近 2x–3x 销售额；也高于 DoorDash 约 5x 销售额，尽管 DoorDash 的规模、流动性和 EBITDA
              证明强得多。唯一处在相近区间的可比公司是 IndiaMART，约 5.6x EV/sales，但 IndiaMART 恰恰代表 Jumbotail
              尚未公开证明的轻资产、现金生成、类平台结果。因此，IndiaMART 是上行情景参照，不是基准情景标尺。ElasticRun FY25 仍为负的盈利，以及 Udaan
              重组，都强化了同一教训：印度商业基础设施可以很早跑出规模，但很久之后才赚到溢价倍数。
