  - id: TP003
    title: 嵌入式金融、零售 OS 与商品经营杠杆对比
    columns:
      - 竞争对手
      - 金融姿态
      - 零售 OS 或门店技术
      - 自有品牌或商品经营杠杆
      - 含义
    rows:
      - - Jumbotail
        - 嵌入式金融科技和营运资金优化是核心卖点的一部分
        - GoldenEye 和 J24 是明确的商户运营产品
        - 品牌网关叙事很强；公开自有品牌细节仍稀疏
        - 护城河取决于 OS 加金融能否真正加深留存
      - - Udaan
        - UdaanCapital 可见，并已嵌入贸易工作流
        - 工作流工具可见，但不如 Jumbotail 那样明确由门店 OS 驱动
        - 大宗基础品自有品牌动作已有公开披露
        - 在金融和周期性采购闭环上，是最相似的挑战者
      - - Reliance / METRO / JioMart
        - 营运资金和数字支付支持是 New Commerce 的一部分
        - 商户赋能存在，但更多被描述为全渠道支持，而不是深度软件能力
        - 大型既有玩家拥有商品经营能力和选品采购肌肉
        - 既有规模可抵消较轻的软件叙事
      - - Amazon Business
        - 符合条件的买家可用免息或先买后付式信贷
        - 控制点在采购、合规和支出管理，不在店内运营
        - 商品杠杆来自选品宽度和价格透明度，而不是面向 kirana 的自有品牌
        - 即使没有商户工作流深度，也是强大的补充采购轨道
      - - Ninjacart
        - 与供应链细节相比，公开金融细节有限
        - 零售工具不是公开叙事核心
        - 商品杠杆来自新鲜度和供应效率
        - 品类专家很强，全店锁定较弱
      - - ElasticRun
        - 金融不是公开叙事核心
        - 技术深度面向履约和 SaaS 基础设施，而非 kirana 门店运营
        - 自有品牌和区域品牌经济性是利润率故事的一部分
        - 是有用的基础设施参照，但不是纯粹的商户 OS 对手
    notes: 本表拆出市场最常讨论的商户锁定杠杆：融资、门店运营和商品经营权。
