  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、专门玩家、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 现在所处的竞技场，比旧有「B2B 食品杂货应用」标签暗示的更宽。Solv 交易和 NEC
              合作，把它推向更广的商户基础设施位置，横跨多品类采购、物流、嵌入式金融和门店数字化。竞争场由此扩成四类。Udaan 是最接近的同类对手，因为它也把 SKU 宽度、物流控制和面向 kirana
              及相邻小企业的营运资金产品打包在一起。Ninjacart 和 WayCool 在生鲜与农食供应链深度上有较窄重叠；ElasticRun
              的重叠则来自履约基础设施和品牌分销触达，而不是商户操作系统。Reliance、METRO 和 JioMart 带来另一种威胁：资产负债表支持、全渠道批发和门店支撑分销都强得多。Amazon Business 以及
              Flipkart 和 Amazon 的即时零售动作，更像替代方案而非干净同行，但仍会争夺商户注意力、购物篮份额和采购相关性。
