      - - UPI 和商户 QR 普及
        - 上行
        - 当前
        - 降低面向小商户的软件和金融产品激活摩擦
        - 索取活跃零售商队列内的商户支付采用率和信贷附加率
      - - MSME 正规化和政策支持
        - 上行
