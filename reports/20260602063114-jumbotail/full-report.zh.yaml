  - id: TP004
    title: 定价、资本强度与战略背书对比
    columns:
      - 竞争对手
      - 资本模式
      - 战略背书
      - 定价可见度
      - 含义
    rows:
      - - Jumbotail
        - 库存、履约、金融科技和门店技术模式意味着需要真正的经营杠杆
        - SC Ventures，加上 NEC 和既有风投投资者
        - 低
        - 需要密度和商户留存来证明资本强度合理
      - - Udaan
        - 大规模 eB2B 加上信贷和物流，即便为效率重组，仍然很吃资本
        - M&G、Lightspeed、DST Global，以及庞大的历史融资基础
        - 低
        - 最接近的直接对手，已披露融资历史也最深
      - - ElasticRun
        - 网络履约和更快配送需要共享基础设施和有纪律的单位经济模型
        - SoftBank、Prosus、Goldman Sachs 的历史背书仍然重要
        - 低
        - 基础设施能力真实存在，但盈利证明仍不完整
      - - WayCool
        - 全栈农业食品采购、分销和加工都高度资本密集
        - Lightrock、IFC、FMO 和其他投资者，但资本重组已转向防守
        - 低
        - 物理食品分销要有利可图地规模化有多难，这是一个警示案例
      - - Reliance / METRO / JioMart
        - 既有零售和批发网络由大得多的公司资产负债表供血
        - Reliance 资产负债表和门店资产
        - 中低
        - 为了战略渠道控制，可以承受较低短期回报
      - - Amazon Business
        - 轻资产平台和合规工具比自营批发供应链资本强度更低
        - Amazon 公司资产负债表和全国物流
        - 高
        - 买方更容易做基准比较，并把它作为并行采购通道采用
      - - Flipkart / Amazon 快商贸
        - 前置仓和微履约规模化需要重投入，但背后是更富的公司母体
        - Walmart 和 Amazon
        - 中
        - 即时便利即便经济性仍有争议，也能比创业同行砸更多钱
    notes: 这里的定价可见度指商业条款的公开可比性，不等于公司在实践中对商户是否便宜。
