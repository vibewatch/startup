        - id: cash-use
          label: 主要现金用途
          values:
            - 预付采购款、库存持有、供应商结算
            - 仓储、干线、最后一公里、路线密度
            - 营运资金授信、放贷方利差、违约准备金
            - 门店翻新、店内技术、启动支持
            - 交易执行、品类扩张、整合成本
        - id: public-evidence
          label: 公开证据
          values:
            - 贸易货品主导收入；采购主导成本
            - 分销成本重要，供应链扩张也很明确
            - 信贷栈、风险债务、抵押登记和受托设施都可见
            - J24 是服务收入的一部分，也在增长计划中
            - 审计发现和交易重组已有公开报道
        - id: underwriting-risk
          label: 承销启示
          values:
            - 毛利率取决于账期和周转，不只是 GMV 增长
            - 利用率和订单密度必须改善，经营杠杆才会出来
            - 信贷能拉动 GMV，也可能藏住损失
            - 门店经济性可能有吸引力，也可能吞现金；公开数据很薄
            - 合并收入质量和估值仍需证明
