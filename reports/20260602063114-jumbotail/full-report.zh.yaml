      - number: '7.3'
        title: 治理、整合与私营公司不透明度，仍是公开证据最难排除的风险
        blocks:
          - type: paragraph
            body: >-
              最严重的剩余风险，是一项变得更大、更复杂的战略，其治理透明度并没有随着公开披露同步提升。Financial Express 和 Inc42 都描述了围绕 Solv 收入质量的尽调担忧；Inc42
              还报道了领导层更替，以及一个曾公开讨论 IPO 路径的业务为何最终被出售的疑问。即便 CCI
              已批准，问题也没有消失；这只说明交易结构通过了反垄断审查。公司自己的公告强调战略逻辑、新资本和更清晰的董事会架构，这些都是真实的缓释信号。但投资者仍被要求在当前经审计披露有限的情况下，接受合并后的大规模主张。Financial
              Express 明确称，截至 2025 年 5 月，Jumbotail 的 FY24 数据尚未提交；Entrackr 的硬数字停在
              FY23；公开实体页面也碎片化，而非合并口径。因此，主要治理风险不是某一条丑闻标题，而是整合、品类扩张和信贷敞口可能跑得比公司的公开控制、报告和补救能力更快。
