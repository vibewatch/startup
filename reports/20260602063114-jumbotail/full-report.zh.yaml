      - number: '8.4'
        title: 最终建议、尽调关口和投资逻辑破坏点
        blocks:
          - type: paragraph
            body: >-
              因此，建议是观察，信心中等，风险高。Jumbotail 仍值得关注，因为很少有印度 B2B 商业玩家能在这个规模上同时结合食品分销、多品类供给、嵌入式信贷、零售商 OS
              工具和品牌触达。但今天买入独角兽故事，意味着在投资者看到干净合并数据、收入质量、信贷损失或优先权堆叠之前，就为 Solv 后的执行付费。纪律点很简单：要么等当前经审计合并报表和收入结构 /
              毛利率披露，要么坚持以显著低于独角兽头条估值的价格进入。


              更接近约 $700 million–$800 million 的估值，会给外部投资者更好的缓冲，同时仍承认战略进展。主要尽调阻塞点包括：当前经审计 FY24-FY25
              报表、合并实体期初资产负债表、精确的本轮融资和优先权条款，以及软件、金融科技、自有品牌和操作系统层正在产生实质经济贡献的硬证据。没有这些，再来一轮高价融资不是确认信号，而是警示信号。如果 Solv
              的收入质量担忧扩大、整合后经济性依旧顽固地像批发业务，或者披露改善前新一轮融资低于预期，估值逻辑会很快破裂。
