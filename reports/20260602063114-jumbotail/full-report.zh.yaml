      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图比单一 kirana 应用叙事更宽。核心经济用户是 kirana 或小型超市的业主经营者，他们亲自管理现金流、选品和补货时点。同一市场还包括更正规、已注册 GST
              或数字素养更高的成长型零售商；需要更好触达传统通路的品牌和分销商；以及帮助小卖家在多个买方应用中被发现的 ONDC 或其他数字网络参与方。公开 ONDC 材料显示，跨应用可见性和 QR
              驱动的线上店面如何降低入驻摩擦；Redseer 的 udaan
              案例则显示，密度和微市场执行能在特定集群显著加深钱包份额。因此采用路径不只是软件发现。它往往从支付就绪和数字化订货，推进到更可靠的采购，再进入正式信贷或营运资金使用，最后才形成更深的软件或渠道集成依赖。这个路径解释了为什么
              Jumbotail 能同时为零售商、品牌和金融合作伙伴创造价值，也解释了为什么采用通常是本地化、信任密集、运营驱动的，而不是纯病毒式扩散。
