  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 公开 P&L 历史，以及收入到底由什么构成
        blocks:
          - type: paragraph
            body: >-
              最干净的公开财务脊柱仍停在 FY23。Entrackr、Inc42 和 ETRetail 的备案口径报道彼此一致：公司扩张很快，但成本不低。FY22 运营收入约 ₹377 crore，亏损约 ₹122-125
              crore，GMV 为 ₹1,128 crore；FY23 收入升至约 ₹819 crore，GMV 达 ₹2,262 crore，净亏损约 ₹264
              crore。收入质量的关键点在于，这不是一张软件优先的损益表。公开拆分称，FY23 收入中约 ₹766-767 crore 来自产品销售或交易商品，约占运营收入
              94%；其余来自交易平台佣金、配送和服务。Inc42 补充说，服务收入约 ₹52 crore，并把它与 J24 和 GoldenEye 联系起来。2024 年 3
              月，管理层也说交易平台仍贡献多数收入，自有品牌贡献 10-15%，广告加 J24 是额外变现线。这意味着公开证据支持分层收入模型，但也显示，投资人可能想给软件式倍数的那一层，相比库存挂钩贸易收入仍很小。
