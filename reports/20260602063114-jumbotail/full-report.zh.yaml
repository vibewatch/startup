        title: 互动和留存代理指标有建设性，但真实队列仍未公开
        blocks:
          - type: paragraph
            body: >-
              公开证据支持复用代理指标，但不支持可承销的留存数学。最好的商户侧代理是 FY23 披露：每笔订单都由应用驱动，且每家 kirana
              的月均购买频次显著高于同行；最好的运营侧代理，是管理层强调每日到店可靠性、可重复性和补货周期缩短。消费者边缘上，J24
              展示出通常只有门店上线后才重要的持续行为——购买历史、待结账单结清、返现、优惠和门店联系；应用商店列表也显示至少有温和的实时足迹和一些评分数据。NEC
              的合作措辞更进一步，明确承诺提高客户留存，但这仍是公司愿景语言，不是已披露业绩。没有保留来源发布商户 GRR、NRR、品牌续约曲线、J24
              重复购物队列、违约调整后信贷留存，甚至每个活跃商户的绝对下单频次。因此正确姿态是把耐久性视为方向上正面、运营上可信，但在投资人最终需要的指标上仍未证实。
