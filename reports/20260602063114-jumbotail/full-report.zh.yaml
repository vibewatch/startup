        title: 具名公开证明存在，但偏向卖家和品牌伙伴，而非具名 kirana 账户
        blocks:
          - type: paragraph
            body: >-
              保留证据集中，最清晰的具名公开客户证明来自 Jumbotail 自己的品牌伙伴证言，而不是公开 kirana 案例研究。Mohini Mill 说平台触达了它无法直接营销的客户；Sri Mookambika 说
              Jumbotail 的反馈改善了产品质量；Sree Durga 说平台在 Bangalore
              建立了品牌存在感。这些证据有意义，因为它们展示了卖家侧客户结果：分销、定向触达和反馈循环。它们也符合更广的创始人叙事：区域品牌需要现代进入市场路径支持，才能走出本地主场半径。公开记录没有提供同样强的具名
              kirana 证明，例如门店级销售提升、留存或扩张历史。即便 J24
              消费者证据，也主要是产品界面证明——应用功能、下载和小规模评分足迹——而不是具名零售商故事。因此本章可以确认客户证明存在，但也必须明确，最好的具名证明仍由证言主导，并且更面向品牌而不是零售商。
