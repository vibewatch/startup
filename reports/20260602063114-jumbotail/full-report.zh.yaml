      - number: '7.2'
        title: 薄利物流、服务可靠性与信贷敞口在结构上相互绑定
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 自己的披露显示，这门生意赢在运营强度，而不是只靠软件毛利率。FY23，公司称每笔订单都由 app 驱动，不设最低订单金额，处理了超过 15 million 笔订单，超过 75%
              次日送达。这些是优势，也是义务。管理层访谈把 SLA 达成率称为信任基础，并指出失误往往出在仓储、库存架构、人力规划和供应商准备度。Entrackr 对 FY23
              的分析解释了其财务意义：采购是最大成本，运输和配送是重要开销，公司每赚 1 卢比收入仍要花超过 1 卢比。信贷又加了一层风险。SIDBI 和 ICRIER 都描述了一个贸易属性很重的 MSME
              信贷市场：营运资金获取仍然痛，NBFC 发挥很大作用，尽管表观资产质量改善，局部逾期仍存在。因此，运营风险不只是配送失误；服务失败、营运资金压力和任何放贷方收缩，都会共同影响商户留存和下单频率。
