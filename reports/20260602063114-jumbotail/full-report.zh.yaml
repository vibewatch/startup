      - number: '1.4'
        title: 里程碑、时间线与反向事项
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 的公开时间线顶层清晰，细节混乱。最干净的日期脊柱是：2015 年底注册成立；2019 年和 2021 年完成主要扩张轮；2024 年一笔较小的延伸轮或桥接融资；2025 年 3 月宣布
              Solv 交易；2025 年 5 月审计延迟报道带来负面并购噪音；同月稍晚获得 CCI 批准；6 月底 Gautam Jain 获任董事；2025 年 6 月 30 日正式完成 Solv 收购和 D
              轮融资。这个顺序支撑了核心叙事：2025 年是 Jumbotail 变成更横向、更机构化、融资可见度更高的年份。

              但第 1 章应保留两条反向线索，而不是把它们藏在增长叙事背后。第一，BW Businessworld 2023 年报道，Adani Wilmar 提起法律行动，指控 Jumbotail 平台流通过假冒
              Fortune 品牌产品，执法部门突击搜查了一处仓库。同一报道也引用了 Jumbotail 的回应：公司对假冒商品零容忍，并正配合调查。因此事实形态是指控加公司回应，不是已裁决有责。第二，Financial
              Express 2025 年 5 月报道，Solv 关联方交易审计发现导致并购延迟，并可能迫使估值重置。尽管交易后来获得 CCI 批准并完成，这篇文章仍重要，因为它说明执行和尽调风险存在于头条成功故事内部。第 1
              章正确的姿态，是把这些事项记为真实尽调警示，同时说明交易最终完成。
