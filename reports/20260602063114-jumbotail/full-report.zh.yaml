      - number: '3.4'
        title: 护城河耐久性、多栖使用与反向信号
        blocks:
          - type: paragraph
            body: >-
              证据支持 Jumbotail 有真实竞争楔子，但不是牢不可破。最强的公开论据是，Jumbotail
              比多数同行更紧地打包了供应、金融、品牌触达和门店工具。这应当比纯交易平台或一次性批发渠道带来更高切换成本。但同一组来源也说明，护城河仍是运营型，而不是结构型。商户可以按不同任务多栖：用 Jumbotail 或
              Udaan 做计划性补货，用 Amazon Business 做合规长尾采购，用即时零售或本地批发补急缺。几乎所有重要对手的公开定价都不透明，因此很难证明持久定价权。行业反向证据也重要：WayCool
              重组、ElasticRun 盈利仍为负，显示当物流和营运资金承担大部分工作时，经济性会非常残酷。除非 Jumbotail 能展示比公开来源可推断水平更好的留存、信贷表现，以及 J24 或 GoldenEye
              经济性，否则护城河主张应被视为合理但仍未证实。
