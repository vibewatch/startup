      - 具体尽调路径
    rows:
      - - FY24 经审计收入、毛利率、EBITDA 和净亏损
        - 没有签署版 FY24 P&L，就无法支撑对当前表现和 FY23 后动能的尽调判断
        - Tracxn 显示 ₹914 crore，Tofler 显示低得多的区间，Financial Express 称 FY24 尚未提交
        - 获取已签署的 FY24 财务报表，以及每个外部数据库数字的对账备忘录
      - - 当前现金余额和月度烧钱
        - 现金跑道不能只靠已融资本或年度亏损推断
