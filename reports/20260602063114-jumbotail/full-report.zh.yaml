  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 原因
      - 改变判断的条件
    rows:
      - - 建议
        - 跟踪
        - 战略平台潜力真实存在，但当前独角兽估值领先于公开证据。
        - 只有在拿到最新经审计合并报表，或入场价格显著降低后，才上调判断。
      - - 确信度
        - 中
        - 现有证据足以方向性判断价格偏贵，但关键估值输入仍未公开。
        - 经审计 FY24-FY25 数字、收入结构披露和股权表清晰后，确信度会上升。
      - - 风险评级
        - 高
        - 估值取决于 Solv 整合成功、薄利执行和融资纪律。
        - 如果 Solv 之后的利润率、信贷质量和披露同步改善，风险会下降。
      - - 估值立场
        - 偏高
        - 隐含 6x-10x 收入倍数跑在当前披露经济性前面，也高于多数与模型相关的可比公司。
        - 若估值降至大约 $700M-$800M 以下，或牛市情形得到证明，立场才会接近合理。
      - - 决策含义
        - 不要盲目支付名义独角兽价格
        - 公开证据支持列入观察名单，不支持按当前估值激进承销。
        - 干净的合并收入 / 利润率跃升会改变判断。
    notes: 评估反映截至 2026-06-02 的公开证据；最新经审计合并财务和优先权条款仍不可得。
