  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争和横向品类扩张同时抬高门槛
        blocks:
          - type: paragraph
            body: >-
              竞争不是留到后续尽调才处理的理论下行项。到 2026 年，公开资料已经显示：Reliance 的 JioMart 借 3,100+ 家门店网络放大超本地订单；Amazon Business 用 GST
              和分析工具面向全国推广 B2B 采购；Amazon 和 Flipkart 加码快速配送基础设施；udaan 仍用信贷和快速交付向数百万小企业推销。这一点很关键，因为 Jumbotail
              已经不只是在守一个杂货细分市场。Solv 交易和 NEC 合作把公司推向服装、家居、玩具、体育、电子等品类，也带来更广的卖家和零售商基础。公司公开材料把这种宽度描述成打造更强 AI
              原生商业和信贷栈的路径。风险视角更严苛：公司现在必须整合更多品类、更多流程、更多交易对手和更多竞争价格参照，同时证明横向扩张不会冲淡运营纪律。交易记录里已经能看到压力：在合并完全完成之前，审计相关问题、领导层更替和估值偏高都已经出现。
