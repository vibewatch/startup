  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 全栈产品定义：商户基础设施，而不是单一应用
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 自己的产品界面持续描述的是分层商户基础设施栈，而不是狭义订货工具。最强的可直接观察证据，来自官网首页、交易平台合作材料和公司资料页，它们都指向同一组组件：B2B
              订货交易平台、自营仓储和到店配送网络、嵌入式支付与营运资金信贷、作为门店改造形态的 J24，以及支撑该形态的操作系统 GoldenEye。这个组合重要，因为它改变了产品本身的定义。kirana
              买家不只是在使用目录；商户进入的是一条工作流，补货、门店运营、融资和品牌触达都可以由 Jumbotail
              介入。公司还声称这套栈由技术、数据科学和设计搭建，独立资料页也大致重复这个框架。需要注意的是，公开证据对模块存在和工作流语言的证明，远强于对软件采用深度的证明。公开页面可以验证有哪些模块，以及它们应如何拼在一起，但没有披露
              GoldenEye 席位数、门店级留存或模块级收入贡献，无法让投资人按纯 SaaS 逻辑承销软件层。
