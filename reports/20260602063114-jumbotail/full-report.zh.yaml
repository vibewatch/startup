chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部，以及 Jumbotail 到底做什么
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 由 Jumbotail Technologies Private Limited 运营，这是一家总部位于 Bengaluru 的私营公司，2015 年 11
              月注册成立。公开公司资料显示，其注册地址在 Bengaluru Hosur Road 的 Eastland Citadel；Jumbotail 自己的网站则把业务说得更简单：面向印度食品杂货的新零售 B2B
              交易平台。这个定位很关键，因为 Jumbotail 不只是 kirana 门店的目录式订货应用。它的公开材料持续描述一套组合栈：采购、仓储物流、支付与营运资金支持、J24 门店现代化形态，以及 GoldenEye
              零售操作系统。

              因此，公司的叙事更像「新零售基础设施」，而不是狭义的批发交易平台。官方页面强调用技术、数据科学和设计重构食品杂货价值链；合作伙伴和媒体资料则说平台服务 kirana 门店、超市、品牌、贸易商和
              MSME。最新公开规模口径明显大于旧资料页：Solv 交易后，管理层和主要商业媒体称合并平台触达 400+ 个城市和城镇的 500,000+ 家小型零售商；旧的独立公司描述则是约 50+ 个城市的
              250,000+ 家 kirana。做尽调时，这些数字不应被当成干净的同口径自然增长序列，因为它们混合了不同日期，也很可能混合了不同统计范围。
