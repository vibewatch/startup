      - number: '7.4'
        title: 监管合规和产品完整性风险已经部分落地
        blocks:
          - type: paragraph
            body: >-
              本章需要把已发生事件和前瞻性法律风险分清楚。已发生事件是 Adani Wilmar 假冒案：多家媒体报道，FIR 已立案，179 件商品被查扣，调查人员发现假 QR 码、批次不匹配和包装差异。Jumbotail
              的回应是配合调查，并强调零容忍和供应商追溯。这有帮助，但不能免责；它说明公司承认问题存在，而不是证明平台管控已经足够强。前瞻层面更广，也更结构性。FSSAI 和 PIB
              指引明确，食品电商运营者必须持有有效许可，满足保质期和标签一致性要求，培训配送人员，并把食品与非食品配送分开。消费者保护规则还增加投诉、卖家记录、真实性和不公平交易行为等义务，带来持续合规成本和运营方责任。Jumbotail
              以杂货为核心，同时扩大品类和供应关系，法律 / 合规风险不是一次性法庭戏码，而是控制系统落后于品类增长、下一次事件源自卖家治理薄弱而非需求疲软的风险。
