  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 要素
      - 投资论点
      - 反论点
      - 改变看法的条件
    rows:
      - - 战略规模
        - 覆盖 400 个城市的 500,000+ 零售商，带来真实分销杠杆。
        - 规模本身不能证明经济性有利润或可持续。
        - 展示 Solv 后留存、复购密度和最新城市层面贡献利润率。
      - - 一体化堆栈
        - 金融科技、J24、GoldenEye、自有品牌和品牌服务，给更高质量收入提供路径。
        - 公开披露仍显示公司偏贸易驱动，叠加层在经济上是否重要，证据有限。
        - 按业务流披露收入结构、毛利率和采用数据。
      - - Solv 合并
        - 品类宽度可以把 Jumbotail 推成更宽的商户基础设施平台。
        - 审计疑虑、领导层流动和收入质量问题意味着整合可能毁价值。
        - 提供 Solv 收入质量和并购后期初余额的经审计调节表。
      - - 可比公司上行空间
        - IndiaMART 证明，质量足够强时，印度 B2B 平台可以按 5x 以上销售额交易。
        - IndiaMART 已盈利、能产生现金且资产轻；公开证据下 Jumbotail 还没到这一步。
        - 证明接近 IndiaMART 的现金转换或 EBITDA 轨迹。
      - - 私募可比支撑
        - Udaan 等大型同行显示，投资者仍愿意给这个品类投钱。
        - Udaan 规模大得多，重定价后仍只在约 $1.8B 完成平轮融资。
        - 若 Jumbotail 以干净经审计数字完成超过 $1B 的新一轮融资，会增强论点。
      - - 资本支撑
        - 新资本和战略投资者降低了眼前融资压力。
        - 未知优先权、担保权益和债务复杂性，仍可能损害外部投资者经济性。
        - 披露清算优先权、反稀释条款和债务 / 担保权益时间表。
    notes: 投资论点和反论点都对价格敏感：公司具备战略吸引力、但当前估值难以证明时，两者可以同时成立。
