  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 模式 / 规模信号
      - 收入或经营锚点
      - 估值 / 倍数信号
      - 相关性
      - 关键局限
    rows:
      - - Jumbotail 参照
        - 印度私营 B2B 商贸 + 零售基础设施
        - FY23 收入 ₹819 Cr；FY24E ~₹1,200 Cr（第三方估算）
        - ~$950M 交割前估算 / >$1B 交割叙事；~6x-10x 销售额
        - 标的公司和当前轮次信号
        - FY24-FY25 经审计数字仍缺失；收入结构仍偏贸易驱动
      - - Udaan
        - 印度私营 eB2B 同行
        - FY24 收入 ₹5,706 Cr；2025 年融资 + 盈利能力主张
        - 2025 年 $1.8B 平轮融资
        - 披露规模大得多、最接近的全栈私营可比公司
        - 仍在重组，不是干净的一一对应利润率可比对象
      - - IndiaMART
        - 印度上市 B2B 市场平台
        - FY26 收入 ₹1,569 Cr；36% EBITDA 利润率；220K 付费供应商
        - EV/Sales 5.63x 倍数
        - 印度 B2B 平台价值的质量上限可比对象
        - 资产轻市场平台经济性，不是库存驱动的商贸
      - - DoorDash
        - 上市物流赋能型市场平台
        - Q1 2026 收入 $4.0B；调整后 EBITDA $754M
        - 市销率 ~4.94x；EV ~$69.55B
        - 显示大型、流动性好且盈利的市场平台物流可拿到溢价倍数
        - 消费者业务占比高，规模也远大于 Jumbotail
      - - Uber
        - 上市配送 + 出行平台
        - Q1 2026 收入 $13.2B；调整后 EBITDA $2.5B
        - 市销率 ~2.90x；EV ~$156.49B
        - 有用的低倍数物流平台基准
        - 已多元化到商贸采购和商户分销之外
      - - InPost
        - 上市包裹 / 物流网络
        - TTM 收入 15.62B PLN；2025 收入 14.71B PLN
        - 市销率 ~2.11x；市值 ~€7.67B
        - 显示规模化物流网络在公开市场的定价水平
        - 包裹柜经济性不同于 B2B 商贸市场平台
      - - ElasticRun
        - 印度私营物流商贸赋能方
        - FY25 收入 ₹2,653 Cr；亏损 ₹145 Cr
        - 没有披露干净的公开估值
        - 提醒我们，在印度物流商贸里，规模可以与仍然偏薄的利润并存
        - 不是直接的商户 OS 或金融科技可比公司
    notes: 可比集合混合了公开市场倍数和私募轮信号。它用于框定 Jumbotail 的区间，不表示存在任何单一干净可比公司。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public and private comps available as of runDate, but the closest Indian private peers
