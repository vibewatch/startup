  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 横跨 kirana、J24、品牌和贷款方的买方、用户、付款方与受益方地图
        blocks:
          - type: paragraph
            body: >-
              理解 Jumbotail 的客户基础，最好把它看成一组角色栈，而不是单一商户桶。核心买方侧，kirana 店主和超市通过交易平台采购库存，也是主要付款方；运营侧，门店员工和创业者使用 J24 与
              GoldenEye 运行开票、库存、CRM、忠诚度和日常零售工作流；受益方侧，社区购物者通过 J24 查看购买历史、支付待结账单、使用返现和优惠。平台还服务需要进入碎片化零售渠道的品牌、区域制造商和 MSME
              卖家；贷款合作伙伴也重要，因为营运资金嵌在面向客户和卖家的价值主张里。这个区分对尽调很重要，因为 Jumbotail
              同时在变现和留住多个群体，公开证据最强的是买方工作流宽度和卖方分销价值，而不是干净的分客户段收入拆分。
