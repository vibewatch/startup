        - 即便更广的堆栈更强，生鲜深度和农供关系也可能削弱 Jumbotail 的品类控制
        - 中
        - 索取生鲜与干杂货的品类级份额，以及按品类划分的品牌独家性
      - - 资本强度与证明负担
        - ElasticRun 和 WayCool 案例
