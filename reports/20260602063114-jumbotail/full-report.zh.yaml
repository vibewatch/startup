  - id: TV005
    title: 打破投资论点与否决触发表
    columns:
      - 触发项
      - 阈值 / 信号
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 经审计合并收入不及预期
        - 最新经审计收入低于约 $140M 等值，或没有显示有意义的结构改善
        - 压塌基准情景区间，使独角兽估值失去支撑
        - 在当前价格下，从跟踪转向回避
      - - 下一轮融资低于预期
        - 新一轮明显低于 ~$800M，或附带惩罚性结构
        - 会确认私募市场同样拒绝当前名义估值
        - 按新的重设价格重新锚定估值
      - - Solv 收入质量问题扩大
        - 与 Solv 时期收入相关的重述、审计保留意见或重大减记
        - 摧毁对整合以及当前规模桥接的信心
        - 暂停尽调，直到调节完成
      - - 下次融资前仍无经审计披露
        - 管理层在没有最新 FY24-FY25 经审计合并报表时继续融资
        - 说明叙事再次跑在证据前面
        - 把新一轮视为警讯，而不是验证
      - - 经济性仍像批发
        - 没有证据显示金融科技、自有品牌、OS、广告或服务正在变得具备经济实质
        - 即使有战略故事，Jumbotail 仍会留在低倍数区间
        - 只按较低的物流 / 商贸可比公司估值
      - - 信贷或营运资金压力浮出
        - 信贷质量、现金转换或债务 / 担保权益复杂性显著恶化
        - 会挤压利润率，并迫使市场接受更低倍数
        - 要求修订下行情景和融资计划
    notes: 这些是与估值相连的可观察投资论点打破信号，而不是泛泛的运营担忧。任何一个出现，都会显著压缩可辩护区间。
    enumerationScope:
      coverage: sample
      basis: >-
        Lists the highest-conviction price-breaking events visible from public evidence. Other negative scenarios could
        matter, but these are the most directly linked to valuation support.
