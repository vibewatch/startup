        title: 采用强度和地理扩张真实存在，但干净分母缺失
        blocks:
          - type: paragraph
            body: >-
              最强的公开采用证据是运营性，而不是合同性。Jumbotail 的 FY23 披露称，平台服务 50+ 个城市和 3,600 个邮政编码区域的超过 250,000 家 kirana
              门店，所有订单都通过应用完成，而不是由销售队伍手工下单；每家 kirana 的平均购买频次超过其他平台 3 倍。同一披露还把这与 15 million
              笔订单、单件配送以及多数订单次日达联系起来；这正是一个真实补货工作流应有的形态，而不是偶发批发目录。消费者边缘上，J24
              的可见足迹小得多，但仍明显在线：购物者应用展示账单、优惠、返现和门店联系界面，商户应用则显示 500K+ Play 下载。地理范围需要更细致。平台从 2023 年 50+ 个城市的 250K+ 家
              kirana，扩到 Solv 后 400+ 个城市的 500K+ 家零售商和 MSME；但公开记录没有干净拆分原 Jumbotail、Solv 重叠和实时 J24 覆盖。
