      - number: '7.5'
        title: 数据和平台集中度加深了对明确否决标准的需求
        blocks:
          - type: paragraph
            body: >-
              关于网络安全或宕机历史的公开证据弱于运营强度证据，但这不等于数据风险小。Jumbotail 的模式由 app 驱动、通过门户串联；Google Play
              自己的数据安全页面只给出加密传输、删除请求、有限披露的收集类别等基础声明。这里没有保留下来的公开证据集，能让投资者对正常运行时间、渗透测试、云集中度或事件响应形成成熟的外部保证。正确姿态是不编造隐藏泄露故事，但也要承认真实依赖：订购
              app、供应商门户或上游数据管道一旦失效，商户和供应商无法简单退回低摩擦线下流程。公开缓释手段主要是运营性的——AI 工具、自建物流、每日服务纪律和配合式事件响应——而不是经审计的合并后 KPI
              透明度。因此，本章的否决标准必须具体：履约率或次日达服务恶化、出现信贷收紧证据、假冒或合规问题重复发生，或在当前经审计披露缺位时再次融资，都应视为打破投资逻辑，直到管理层证明不是。
