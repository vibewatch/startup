  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: 公开市场规模最好拆成嵌套视角：广义零售、广义杂货、kirana 主导的杂货份额，以及 Jumbotail 有望变现、更窄的「数字化零售商 + 嵌入式金融」空间。
    data:
      nodes:
        - label: 印度广义零售大盘
          detail: KPMG 和 Redseer 相关公开来源把印度零售规模估在 2024 年 INR82T 到 2028 年 INR116-125T 区间；这个口径太宽，不能当作 Jumbotail 的实际 TAM。
          tone: neutral
        - label: 印度杂货市场视角
          detail: Redseer 的公开口径显示，杂货市场 2026 年约 $598B，2030 年约 $849B。
          tone: positive
        - label: kirana 主导的杂货渠道视角
          detail: Redseer 称，kirana 2025 年仍占约 91%，到 2030 年仍有约 85-86%。
          tone: positive
        - label: Jumbotail 相邻变现空间
          detail: 可变现部分，是那些正在数字化、并使用采购、软件与金融联动工作流的零售商和品牌。
          tone: neutral
    approximationNotes: 这是一组口径堆叠，不是严格的 TAM-SAM-SOM 瀑布。底层来源的边界、时间范围和单位都不同。
