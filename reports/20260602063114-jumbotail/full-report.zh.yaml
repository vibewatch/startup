      - number: '2.2'
        title: 多重规模口径：保留矛盾，不要抹平
        blocks:
          - type: paragraph
            body: >-
              公开记录无法支撑一个干净的 TAM-SAM-SOM 栈，但能提供几组有用镜头来框定机会。最外层是宽泛的印度零售叙事，例如 KPMG 的 2024 年 INR 82 trillion 市场、Redseer 相关的
              2028 年 INR 116-125 trillion 零售市场，以及更长期的食品杂货或零售增长叙事。更相关的一层是印度食品杂货本身，Redseer 估计该市场 2026 年约 $598 billion、2030
              年达 $849 billion。再窄一层是 kirana 主导的渠道：Redseer 称 kirana 在 2025 年仍占约 91% 份额，到 2030 年仍约
              85-86%。即便是可服务门店基础也存在矛盾，本章应保留这种矛盾：McKinsey 较早的食品杂货生态镜头使用约 12 million 个零售网点，Cornell 在 2021 年引用约 13 million 家
              kirana，Redseer 相关 eB2B 报道现在说 kirana 门店超过 15 million 家。对决策有用的结论不是一个精确基数，而是：市场无疑很大，但答案会随定义、日期和渠道范围明显变化。
