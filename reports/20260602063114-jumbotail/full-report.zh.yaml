      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 的创始人故事在投资案中格外重要，因为公司正落在供应链执行和交易平台产品设计的交叉点。Ashish Jhina 多次被描述为第三代苹果种植者、前 BCG 顾问，直接接触过农业和供应链问题。S.
              Karthik Venkateswaran 被描述为 Stanford MBA、前印度陆军军官，以及 eBay 和 Flipkart 前产品负责人。这个组合解释了为什么 Jumbotail 选择更难的全栈 B2B
              模式，而不是更轻的消费者配送模式：一位创始人理解碎片化实体商业的经营痛点，另一位带来交易平台、软件和运营纪律经验。

              运营控制仍由创始人主导。当前交易交割材料确认 Karthik 为 CEO、Ashish 为 COO，两人也被明确列为合并后 Jumbotail-Solv 平台的负责人。2025 年，治理更机构化。作为 Solv
              出售和 D 轮融资的一部分，SC Ventures 的 Gautam Jain 获得董事会席位；公开公司资料还显示 Benjamin Felt、Thomas Joseph Lloyd Williams
              等与投资方相关或非创始人董事。同一份备案口径资料显示，公司有实质性的未结清和已结清抵押权，意味着 Jumbotail 在股权融资之外也使用了债权资金。实际结论是，Jumbotail
              已不再按纯创始人驱动的创业公司来治理，但对两位创始人的关键人依赖仍高，因为战略、产品方向、品类扩张和投资人可信度仍与他们高度绑定。
