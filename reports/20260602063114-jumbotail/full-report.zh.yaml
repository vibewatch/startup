        - label: 正在正规化的小型超市
          values:
            - label: 中
              tone: neutral
              detail: 预算仍由店主主导，但流程比纯 kirana 更规范。
            - label: 中
              tone: neutral
              detail: 痛点仍明显，但现有分销商关系已解决一部分。
            - label: 中
              tone: neutral
              detail: 需要授信，但记录和付款历史往往更好。
            - label: 高
              tone: positive
              detail: 品类拓宽后，数字化、分析和服务水准更重要。
        - label: 农村或偏远零售商
          values:
            - label: 高
              tone: positive
              detail: 本地渠道选择有限，店主通常单独决策。
            - label: 高
              tone: positive
              detail: 偏远和农村服务区的传统供应最弱。
            - label: 高
              tone: positive
              detail: 非正规金融占主导时，正规信贷入口尤其有价值。
            - label: 中
              tone: neutral
              detail: 激活可能需要辅助入驻和建立信任。
        - label: FMCG 品牌或分销商
          values:
            - label: 高
              tone: positive
              detail: 贸易和分销预算明确，且由中央管理。
            - label: 中
              tone: neutral
              detail: 痛点在通路触达和服务质量，不在门店补货本身。
            - label: 低
              tone: neutral
