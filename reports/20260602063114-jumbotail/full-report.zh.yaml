      - number: '5.5'
        title: 采用摩擦、服务质量风险，以及为什么护城河仍像运营能力
        blocks:
          - type: paragraph
            body: >-
              尽调中最强的谨慎点，是 Jumbotail
              的产品优势看起来仍更偏执行，而非纯技术。公司和创始人材料明确显示，印度大众市场机会被触达、语言、价格点和地区差异切碎；这意味着即便在叠加物流和信贷之前，多语言和本地化需求也真实存在。公开入驻证据也偏外勤：信贷使用依赖线下教育和激活团队，门店成功依赖仓储、路线和店内运营的日常稳定执行。独立报道进一步强化风险。Financial
              Express 报道，围绕 Solv 的尽调提出了足以威胁交易时点和估值的收入质量问题；Inc42 则认为，合并实体在非食品杂货经济性、裁员和 J24 执行方面仍有未解问题。即便面向消费者的 J24
              应用界面，也能看到登录和投诉处理摩擦。合在一起，证据支持一个可信的全栈产品，也显示出真实运营复杂度；但它还不是一个已经摆脱承销、门店改造、服务质量和跨品类整合混乱现实的无摩擦零售操作系统。
