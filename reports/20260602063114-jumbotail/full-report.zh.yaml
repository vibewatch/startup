  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 FY24-FY25 合并财务
        - 已签署 P&L、资产负债表、现金流量表和最新月度运行率
        - 没有这些，投资者就是在用过时 FY23 数字和第三方估算，为一个私营故事估值
        - 索取经审计财务包和交割后管理账
      - - Solv 后收入调节
        - 期初资产负债表，以及从独立 Jumbotail + Solv 到合并实体的桥接
        - 这是检验战略规模主张是否有真实经济性的最干净测试
        - 索取交易交割备忘录、整合包和审计师调节表
      - - 收入结构与利润率
        - 按贸易商品、服务、金融科技、广告、自有品牌和 OS 产品拆分毛利率、贡献利润率和增长
        - 倍数取决于更高质量收入流是否正在变得重要
        - 索取业务流层面的分群经济性，以及城市 / 品类贡献利润率
      - - 信贷账簿质量
        - 账簿规模、贷款方结构、逾期、核销、抽佣率和担保敞口
        - 内嵌信贷可能美化 GMV，同时隐藏风险和资本强度
        - 索取贷款方协议和组合质量仪表盘
      - - 股权结构与优先权堆栈
        - 清算优先权、反稀释、按比例跟投权，以及与 2025 轮和 Solv 交易相关的任何附函
        - 外部投资者回报取决于结构，不只是名义估值
        - 从律师处获取股权结构分配瀑布和法律文件
      - - J24 / GoldenEye / 自有品牌证明
        - 门店数、采用率、ARPU、利润率，以及高质量变现层的复购率证据
        - 这些是支付高于批发或物流类倍数的主要理由
        - 按产品和城市索取分群经济性
    notes: 优先级反映今天最直接改变可辩护价格的因素：先是经审计数字，其次是结构，第三是更高质量收入证明。
