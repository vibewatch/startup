  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模或背书信号
      - 商户重点
      - 与 Jumbotail 的独特重叠
      - 主要局限
    rows:
      - - Jumbotail
        - 全栈商户基础设施
        - 收购 Solv 后覆盖 400 个城市、500,000+ 家零售商；SC Ventures 和 NEC 背书可见
        - kirana 小店、MSME、品牌、多品类大众零售
        - 交易平台 + 履约、金融科技、GoldenEye OS、J24 门店
        - 公开单位经济和 OS 采用证据仍薄
      - - Udaan
        - 直接全栈同行
        - 自称印度最大 eB2B；2025 年 Series G 融资 $114M；历史融资基础大得多
        - kirana 小店、HoReCa、药房、办公室、小企业
        - 在选品宽度、物流控制和营运资金产品组合上最接近
        - 公开数据仍看不清抽佣率和信贷损失质量
      - - Reliance / METRO / JioMart
        - 既有批发与全渠道商户轨道
        - 180+ 城市有 200+ 家 B2B 门店；数十万商户；3,100+ 门店网络支撑超本地推进
        - kirana 小店、HoReCa、SME、办公室、大众市场消费者
        - 更厚的资产负债表、批发选品和门店支撑执行
        - 较少公开证据显示其有创业公司式商户 OS 或软件优先切入口
      - - Ninjacart
        - 生鲜与农业食品专家
        - Inc42 披露 FY24 收入 ₹2,081.1 crore+；融资 $406.74M+
        - 零售商、贸易商、生鲜渠道、农业生态
        - 高频生鲜供给重叠，且具备农业供应可信度
        - 商户工作流窄于 Jumbotail 收购 Solv 后的堆栈
      - - ElasticRun
        - 履约与品牌分销赋能方
        - 1,000+ 个站点；600+ 个城镇；2.5M+ sq. ft. 仓储
        - 品牌、D2C、交易平台、B2B、即时零售渠道
        - 白标快速履约和泛印度基础设施
        - 并不明显是 kirana 采购的商户主记录系统
      - - WayCool
        - 农业食品分销专家
        - 继此前债务后，通过配股融资 Rs 210 crore；FY23 收入 ₹1,251 crore、亏损 ₹685 crore
        - 零售商、食品品牌、机构买家、kirana 小店、HoReCa
        - 最接近 Jumbotail 供应链层的生鲜与食品对照
        - 可见的重组压力让持续性存疑
      - - Amazon Business
        - 横向采购替代
        - 19 crore+ 商品、16 lakh+ 卖家、接近泛印度配送
        - MSME、企业、零售商、酒店餐饮、医疗和工业买家
        - 补充采购中，GST、合规和长尾选品很强
        - 一线执行和门店级操作系统深度较弱
      - - Flipkart 与 Amazon 即时零售
        - 即时购物篮替代
        - 到 Apr-2026，Flipkart 暗店达 800+；Amazon Now 目标覆盖 100 个城市和 1,000+ 个微履约中心
        - 城市和新兴城镇的即时杂货与百货需求
        - 速度、折扣和便利性抬高商户预期压力
        - 不是完整的计划性批发或商户金融系统
    notes: 规模信号混合了官方说法和最新报道；这些私营公司指标之间并非完全可比。
