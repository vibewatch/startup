      - - 急单篮子替代
        - Flipkart、Amazon Now、JioMart 快商贸
        - 前置仓和门店网络扩张能改道高频应急订单，并重置速度预期
        - 高
        - 按篮子类型索取城市敞口、急单占比，以及与即时零售区域重叠的零售商情况
      - - 生鲜专业竞争
