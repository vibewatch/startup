        - 索取月度管理账、银行余额和 12 个月流动性桥表
      - - 贷款账簿规模和信用损失表现
        - 金融科技可能提升留存，也可能因损失和资金成本摧毁利润率
        - 公开来源确认信贷产品，但没有 NPA、核销或收益率数据
        - 索取贷款看板，涵盖批次、逾期分桶、预期信用损失和合作伙伴经济性
      - - 各收入流实际毛利率
        - 收入质量取决于贸易、软件、广告和自有品牌各自沉淀多少毛利
        - 公开来源显示机制，但不显示实际费率
        - 索取分部级毛利率和返利桥表
      - - J24 门店和城市级贡献经济性
        - 没有公司层级以下的单位经济模型，就无法验证盈利能力说法
        - 公开来源只提到 J24 扩张和服务收入
        - 需索取门店队列回本周期、城市 EBITDA，以及按渠道拆分的商户留存
      - - 并入 Solv 后的合并口径和收入确认调整
        - Solv 的审计疑虑可能改变合并后公司收入质量和估值
        - 公开报道只描述审计问题和大致交易条款
        - 需索取合并后期初资产负债表、收购会计处理，以及被标记关联方事项的整改情况
      - - 债务契约条款和担保登记状态明细
        - 未结清担保登记的摘要看不出哪些融资额度仍然有效，也看不出哪些资产提供担保
        - CompanyCheck 和 Tracxn 能看到担保登记和贷款方，但没有清晰的契约条款表
        - 需索取 MCA 担保登记文件、授信批准函、受托人契据，以及契约合规状态
    notes: 这些是公开记录暴露出的最高价值财务尽调请求；公开数据留白视为阻断项，而不是可以用叙事补上的空洞。
