      - number: '3.2'
        title: 直接同行、专门玩家，以及能力重叠真正存在的地方
        blocks:
          - type: paragraph
            body: >-
              最接近的运营参照仍是 Udaan。它的官方和报道定位，在核心商户任务上与 Jumbotail 对齐：广泛的 B2B 选品、快速配送和贸易挂钩金融。Udaan
              也披露过更重的历史融资基础，这在物流密集市场中很重要。Jumbotail 相对这个对手最清晰的公开楔子，是围绕 GoldenEye 和 J24
              构建的更明确零售操作系统叙事。专门玩家的重要性不同。Ninjacart 是最强的生鲜和农业专门玩家，只要生鲜采购频率或农户网络深度比宽商户栈更重要，它就相关。WayCool
              曾处在相似农食赛道，但现在更像警示：资本密集的食品分销会多快陷入融资压力。ElasticRun 具备战略重要性，因为它向品牌和商业玩家出售多速度履约、仓储和白标快速配送。这让 Jumbotail
              在物流能力和品牌进入市场路径上面对竞争，但不等于对方拥有同等程度的商户工作流控制。
