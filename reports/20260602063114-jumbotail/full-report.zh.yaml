      - number: '2.4'
        title: 采用驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动来自结构性因素，而不是周期性因素。Redseer、KPMG、ICRIER、RBI 和 MSME 政策栈都指向同一组底层力量：碎片化供应链、长期营运资金痛点、UPI 和 QR
              推动的大规模商户数字化，以及品牌持续需要传统通路触达。这正是 Jumbotail 的采购加金融模式能够发挥作用的条件。但同一证据基础也说明，变现比头条市场规模暗示的更难。ICRIER
              强调行业非正规、数据贫乏；SIDBI 和 BW 显示正式信贷缺口仍很大；KPMG 提到配送触达有限和渠道摩擦；近期 Economic Times 和 Business Standard
              报道同时显示即时零售的压力，以及品牌需要用更好利润率和服务修复 kirana 关系。换句话说，机会具备耐久性，但价值捕获算式取决于密度、信任、物流纪律和信贷结果。因此，正确估值镜头不是总食品杂货 GMV，而是
              Jumbotail 能在不放大信贷或履约风险的情况下，持续改善经济性的那部分零售商和品牌。
