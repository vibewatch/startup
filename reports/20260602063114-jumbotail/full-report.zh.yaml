      - number: '6.5'
        title: 扩张动作可信，但集中度、多栖使用和信贷依赖仍是关键客户风险
        blocks:
          - type: paragraph
            body: >-
              Jumbotail 的扩张动作容易看见。Solv 把客户基础从食品杂货 kirana 扩到软品和百货里的 MSME、品牌和卖家；NEC
              旨在加深店内数字化、定向促销和消费者互动；管理层访谈称，公司优先加深现有城市，同时仍瞄准 Tier 2 和 Tier 3
              增长。风险同样清楚。第一，公开集中度数据缺席：没有披露头部零售商、头部品牌、调整重叠后的活跃账户，或按城市的钱包份额。第二，零售商忠诚度在结构上可被争夺，因为 kirana 同时被 ONDC
              相关软件供应商、即时零售混合体、Pincode 式赋能方案和 FMCG 直营项目争抢。第三，入驻并非无摩擦：可比 kirana
              数字化仍需要培训和手把手支持。第四，信贷是产品承诺的核心，因此如果贷款经济性或合作伙伴意愿恶化，采用可能走弱。最后，Solv 整合带来自己的客户读数风险，因为审计疑虑以及第三方对 J24
              或城市规模的冲突报道，让当前并购后基线更难钉住。
