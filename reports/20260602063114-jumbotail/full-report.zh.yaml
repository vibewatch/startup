  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 计入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - kirana 杂货采购
        - 小零售商的门店补货、主食、FMCG、生鲜和包装杂货采购
        - 消费者即时零售订单和大型现代零售渠道售出
        - 独立 kirana 店主为自家门店采购
        - Jumbotail 核心相邻支出池，因为采购可靠性和商品丰富度驱动复购行为
      - - 零售数字化工作流
        - 库存、订单捕获、零售商 OS、分析，以及与 QR 相关的下单或可视化工具
        - 通用消费者互联网使用或无关 SMB 软件
        - 零售店主、门店员工或小企业经理
        - 相关，因为数字化让采购和融资产品更有黏性
      - - 面向零售商的嵌入式金融
        - 营运资金贷款、BNPL 式采购信贷，以及与商户活动绑定的信用额度产品
        - 无担保消费贷款和大型企业资产负债表融资
        - 零售商作为用户；放贷方或平台作为资本提供方；零售商还款
        - 重要的变现相邻项，因为现金流痛点在小零售里是结构性的
      - - 品牌和分销商上市路径
        - 帮助 FMCG 品牌和分销商更高效触达 kirana 的工具或供给项目
        - 全国媒体支出、无关品牌营销和仅限现代零售的渠道项目
        - 品牌销售负责人、分销商老板或贸易营销预算负责人
        - 相关，因为品牌仍需要一般贸易触达和服务质量
      - - 更广印度零售和电商背景
        - 用于界定外边界的全国零售、杂货和 MSME 商业增长叙事
        - 假设所有零售 GMV 都能被一家 B2B 杂货平台变现
        - 使用高层市场叙事的投资者和战略人士
        - 可作背景，但单靠它太宽，无法成为 Jumbotail 的实用 TAM
    notes: 该表把 Jumbotail 相邻变现面，与更大的零售和电商叙事分开。核心决策口径是小零售商采购，加上数字化和金融，而不是全部印度零售支出。
