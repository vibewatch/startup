      - number: '1.3'
        title: 融资历史、Solv 交易与规模声明
        blocks:
          - type: paragraph
            body: >-
              第 1 章最关键的资本事件是 2025 年 6 月 D 轮。Jumbotail 称其融资 $120 million，由 SC Ventures 领投、Artal Asia 参投；同一时期还完成了对 Solv
              India 的收购。多家媒体重复了这些核心事实，并称该轮后已披露总融资为 $263 million。更不清楚的是估值披露。Jumbotail
              自己的新闻稿没有给出确切投后估值，但多家商业媒体把这一轮视为公司的独角兽时刻；Economic Times 和 Entrackr 将投前区间放在约 $900-950 million，合并调整后的投后估值超过 $1
              billion。

              Solv 收购改变的不只是头条估值叙事。交割前公告称，Solv 带来 Jumbotail 历史食品杂货重点之外的多品类 B2B
              商贸和金融科技能力；交割后公告则把合并实体描述为更横向的平台。这个战略外扩也解释了零售商和城市覆盖口径的跃升。2025 年之前的融资历史，只能从二级数据库和长篇创始人访谈中部分复原：2019 年和 2021
              年轮次证据足以证明延续性，一些 2024 年融资数据仍更依赖追踪库，缺少一手来源的干净确认。同样重要的是，公开运营披露仍落后于资本披露。第 1 章撰写时，可访问来源没有提供当前经审计的 FY24/FY25
              财务、干净的 Solv 后员工数，或并购后活跃零售商 / GMV 拆分，因此这些指标应列为缺口，而不是猜测事实。
