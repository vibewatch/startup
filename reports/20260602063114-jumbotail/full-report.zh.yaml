companyProfile:
  summary: >-
    Jumbotail 是一家总部位于 Bengaluru 的 B2B 商贸与新零售平台，由 Ashish Jhina 和 S. Karthik Venkateswaran 于 2015 年创立。公司面向 kirana
    小店、小型零售商、品牌和 MSME，组合商户采购、仓储物流、支付与营运资金支持、J24 门店改造，以及 GoldenEye 零售软件。2025 年 6 月的 $120 million D 轮和 Solv
    收购，让公司从食品杂货专营商扩成更横向的商贸与金融服务平台；管理层称平台触达 400+ 个城市的超过 500,000 家小型零售商和 MSME。承销问题已经不是 Jumbotail
    是否具备战略相关性，而是这个仍不透明、批发占比高且亏损的模式，能否赚出足够利润率和管控纪律，支撑当前独角兽信号。
