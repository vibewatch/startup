summary:
  headline: >-
    Jumbotail has built a strategically relevant B2B commerce and new-retail platform for kiranas and MSMEs, but public
    evidence still shows wholesale-heavy, loss-making economics and elevated integration or control risk, so the current
    unicorn pricing belongs on a watchlist rather than in the portfolio.
