  topStrengths:
    - >-
      Jumbotail has real merchant reach and ecosystem breadth: retained sources support a combined platform serving
      500,000-plus small retailers and MSMEs across 400-plus cities, with category breadth expanded by Solv.
    - >-
      The product is more than a sourcing app: procurement, logistics, payments, credit enablement, J24, and GoldenEye
      create a fuller operating system for kiranas and other small merchants.
    - >-
      The June 2025 Series D and SC Ventures-backed Solv combination provide capital, board-level sponsorship, and
      strategic room to broaden into a larger horizontal B2B commerce platform.
  topRisks:
    - >-
      Public economics remain too weak and opaque for aggressive underwriting: FY23 evidence still shows loss-making,
      traded-goods-heavy operations, while FY24 and post-Solv audited consolidateds remain unavailable or conflicted.
    - >-
      The Solv deal adds integration, governance, and control risk rather than resolving it immediately, especially
      after public reporting on audit questions, Solv losses, and the need to prove cleaner post-close disclosure.
    - >-
      Merchant durability is not yet proven: kiranas are contested by Udaan, quick-commerce-linked platforms, FMCG
      programs, and other digitization rails, while credit performance and retention data remain private.
  unresolvedGaps:
    - >-
      Current audited consolidated post-Solv revenue, gross margin, EBITDA, burn, runway, and cash-flow detail are not
      public.
    - Public sources do not show credit-loss, underwriting, and collection performance for the working-capital layer.
    - >-
      Merchant retention, concentration, cohort behavior, and the reconciled live footprint of J24 and GoldenEye remain
      insufficiently disclosed.
    - >-
      Cap-table structure, liquidation preferences, and other downside-protection terms from the 2025 financing are
      undisclosed.
