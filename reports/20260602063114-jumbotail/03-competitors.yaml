- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - risk vector
  - who applies pressure
  - evidence-backed concern
  - severity
  - diligence ask
  rows:
  - - Direct full-stack rivalry
    - Udaan
    - Closest overlap on assortment, logistics, and embedded finance means win-loss dynamics could be local and operational, not conceptual
    - High
    - Request city-level merchant overlap, win-loss data, and relative service-level benchmarks
  - - Incumbent balance-sheet power
    - Reliance / METRO / JioMart
    - Store-backed wholesale plus working-capital support can compress acquisition cost and merchant trust
    - High
    - Request cluster economics versus store-backed competitors and evidence on merchant churn when Reliance enters a city
  - - Horizontal multi-homing
    - Amazon Business
    - Compliance-led procurement and long-tail assortment can be added without replacing the primary replenishment rail
    - Medium-High
    - Request data on secondary-rail usage, tail-SKU leakage, and share-of-wallet loss
  - - Urgent-basket substitution
    - Flipkart, Amazon Now, JioMart quick commerce
    - Dark-store and store-network expansion can redirect high-frequency emergency orders and reset speed expectations
    - High
    - Request urban exposure by basket type, urgency mix, and retailer overlap with quick-commerce zones
  - - Specialist fresh competition
    - Ninjacart and WayCool
    - Fresh-produce depth and agrisupply relationships can weaken Jumbotail’s category hold even if the broader stack is stronger
    - Medium
    - Request category-level share by fresh versus dry grocery and brand exclusivity by category
  - - Capital intensity and proof burden
    - ElasticRun and WayCool case studies
    - Supply-chain scale has not automatically produced transparent or durable profitability in adjacent models
    - High
    - Request warehouse utilisation, delivery density, and contribution margin by city and category
  - - Evidence opacity
    - Entire peer set
    - Public data does not reveal comparable take rates, retention, or credit losses, making moat claims easier to market than to underwrite
    - High
    - Request cohort, take-rate, and lending-vintage data before underwriting durable advantage
  notes: Severity reflects likely impact on retention, margin durability, or funding needs, not a modeled financial loss.
