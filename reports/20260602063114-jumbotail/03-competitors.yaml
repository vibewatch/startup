  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Comparable realized take rates, rebate structures, credit pricing, and retailer margin sharing across Jumbotail, Udaan, Reliance or METRO, and Amazon Business.
    whyItMatters: Without real commercial terms, the chapter can compare capability shapes but cannot prove who wins on contribution economics or pricing power.
    diligencePath: Request anonymized contract templates, category-level contribution margins, and examples of retailer invoices or credit statements from management and channel partners.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: blocking
    topic: peer-cohort-economics
    missingEvidence: Repeat-order frequency, cohort retention, share of wallet, delinquency, and credit-loss data for Jumbotail and its direct peers.
    whyItMatters: These are the core metrics needed to test whether workflow lock-in is real or whether merchants simply multi-home while chasing availability and price.
    diligencePath: Ask management for vintage credit performance, reorder cohorts by city and category, and merchant-level wallet-share studies benchmarked against competing procurement rails.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP005
  - type: private-evidence-only
    severity: material
    topic: goldeneye-installed-base
    missingEvidence: Installed store count, attach rates, retention outcomes, and unit economics for J24 and GoldenEye versus merchants who only use marketplace procurement.
    whyItMatters: Jumbotail’s clearest claimed wedge is the retail-operating-system layer, but public evidence does not yet show whether that layer materially improves durability or profitability.
    diligencePath: Request product-level KPIs for GoldenEye and J24, merchant case studies with before and after economics, and breakdowns of software-led versus commerce-led contribution.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
