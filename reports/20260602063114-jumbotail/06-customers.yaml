    - {id: CU028, statement: 'A 2025 Logistics Insider interview said Jumbotail addresses kirana pain points such as lack of doorstep delivery, limited organised credit access, and the need to buy large quantities by offering next-day delivery, lower-order flexibility, seamless payments, and digital credit.', type: third-party-reported, topic: retailer-pain-points, sourceRefs: [SU011, SU002], confidence: medium, freshness: recent, answersQuestionRefs: [QU008, QU022]}
