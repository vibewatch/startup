figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: Jumbotail spans a multi-step journey from brand and retailer onboarding through replenishment, store operations, and shopper engagement inside J24.
    data:
      items:
        - id: discover
          label: Discover / qualify
          actor: Kirana owner, supermarket buyer, brand manager, MSME seller
          description: Retailers come in with assortment, delivery, or working-capital pain points; brands and sellers come in looking for fragmented-market access and customer discovery.
          channels: ['Word of mouth', 'Founder / media interviews', 'Brand-partner outreach', 'Merchant app surface']
        - id: onboard
          label: Onboard / list
          actor: Merchant owner, procurement staff, or partner-side account team
          description: The retailer or partner enters the platform, browses assortment, and begins transacting through the app-led workflow instead of relying on a sales rep or a patchwork of wholesalers.
          channels: ['Jumbotail merchant app', 'Partner onboarding', 'Category listing', 'Credit / payment set-up']
        - id: order-pay
          label: Order / pay / finance
          actor: Kirana owner or store operator
          description: Orders are placed digitally, often with tight cash-flow constraints and occasional need for working-capital support or payment flexibility.
          channels: ['App ordering', 'Payments', 'Lending partners', 'No-minimum replenishment']
        - id: fulfil-store
          label: Fulfil / store operate
          actor: Jumbotail logistics plus store team
          description: Delivery reliability, inventory availability, and store operations become the real proof of product quality; J24 and GoldenEye extend the relationship into the operating system of the store.
          channels: ['Warehousing / fulfilment', 'Storefront delivery', 'GoldenEye POS / CRM', 'Store-team workflows']
        - id: shopper-loop
          label: Shopper loop / repeat
          actor: Neighbourhood shopper and brand partner
          description: J24 shoppers see bills, offers, rewards, and pending balances, while brands observe whether the platform generates discovery, targeted promotions, feedback, and repeat demand.
          channels: ['J24 app', 'Cashback / offers', 'Consumer insights', 'Brand feedback loops']
    claimRefs: [CU003, CU004, CU005, CU019, CU026, CU027, CU028, CU039]
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: standard
    summary: The distinct lens is not a SaaS funnel but a value-loop—assortment and credit pull retailers in, dependable fulfilment and store tooling create repeat demand, and shopper data feeds back into seller and brand value.
    data:
      nodes:
        - id: brands
          label: Brands / MSME sellers
          description: Need route to fragmented retail, targeting, and consumer feedback.
        - id: marketplace
          label: Jumbotail marketplace
          description: Assortment, ordering, logistics, and data layer.
        - id: credit
          label: Payments / lending partners
          description: Working-capital and payment support inside the merchant workflow.
        - id: kirana
          label: Kirana owner / buyer
          description: Places replenishment orders and decides wallet share.
        - id: j24
          label: J24 / GoldenEye store operations
          description: POS, billing, loyalty, merchandising, and store execution layer.
        - id: shopper
          label: Neighbourhood shopper
          description: End beneficiary using offers, bills, and loyalty at J24 stores.
        - id: repeat
          label: Repeat demand / insights
          description: Replenishment cadence, customer feedback, and targeting signals feed back into the system.
      edges:
        - {from: brands, to: marketplace, label: 'list / target / distribute'}
        - {from: credit, to: kirana, label: 'working capital / payments'}
        - {from: marketplace, to: kirana, label: 'order / deliver'}
        - {from: kirana, to: j24, label: 'operate / merchandise'}
        - {from: j24, to: shopper, label: 'sell / bill / reward'}
        - {from: shopper, to: repeat, label: 'purchase data / offers / loyalty'}
        - {from: repeat, to: brands, label: 'feedback / promotion ROI'}
        - {from: repeat, to: marketplace, label: 'replenishment / wallet share'}
    claimRefs: [CU003, CU006, CU019, CU021, CU026, CU028, CU029, CU031, CU039, CU040]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: standard
    summary: Named proof is strongest on the seller side; retailer and shopper proof exists, but with much thinner publicly verifiable outcome and retention detail.
    data:
      columns: ['Evidence quality', 'Outcome specificity', 'Retention visibility', 'Production maturity']
      rows:
        - label: Mohini Mill / Raghav Gupta
          values: ['Medium — official testimonial', 'High — explicit customer-reach outcome', 'Low — no repeat or GMV metric', 'High — framed as live partner relationship']
        - label: Sri Mookambika / Kapil
          values: ['Medium — official testimonial', 'Medium — feedback loop into quality improvement', 'Low — no repeat or scale metric', 'High — framed as active partnership']
        - label: Sree Durga / Nandish
          values: ['Medium — official testimonial', 'Medium — Bangalore presence and brand-image signal', 'Low — no retention or reorder metric', 'High — framed as active partnership']
        - label: Kirana buyer network
          values: ['High — multiple official and news sources', 'Medium — app-led ordering, delivery cadence, and frequency proxy', 'Medium — strong proxy but no cohort disclosure', 'High — clearly production, not pilot']
        - label: J24 shopper layer
          values: ['Medium — app-store surfaces and ratings', 'Medium — bills, cashback, offers, and live app footprint', 'Low — only ratings and downloads are public', 'High — clearly live product surface']
    claimRefs: [CU007, CU008, CU009, CU011, CU012, CU013, CU023, CU024, CU025, CU026]
callouts:
  - calloutType: strength
    title: Jumbotail has a verified multi-sided customer network, not just a merchant list
    body: 'Public evidence supports a real customer system with multiple economic actors: kirana owners ordering digitally, store teams using J24 and GoldenEye, shoppers interacting with loyalty and bill-payment surfaces, and brands or MSME sellers using the platform for distribution and targeting. That breadth increases the potential strategic value of each active retailer if the cross-side loops are genuine.'
    claimRefs: [CU004, CU005, CU017, CU019, CU021, CU026]
  - calloutType: risk
    title: Durability is less transparent than scale, and retailer loyalty is contested
    body: 'Jumbotail has credible scale and workflow proof, but public evidence still does not reveal exact retention, concentration, credit performance, or the reconciled current J24 footprint. At the same time, kiranas are actively courted by multiple digital, quick-commerce, and FMCG programs, which means multihoming risk is real and onboarding friction matters.'
    claimRefs: [CU022, CU034, CU035, CU036, CU037, CU038, CU039]
