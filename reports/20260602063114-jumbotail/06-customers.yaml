  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named kirana-owner case studies, brand ROI studies, or retailer conference talks that identify the account, workflow, and outcome beyond homepage testimonials.
      whyItMatters: Public named proof is skewed toward seller-side testimonials and light consumer-app evidence, so production depth on the retailer side remains harder to underwrite.
      diligencePath: Request top retailer references by city and format, plus at least three brand-partner ROI case studies with campaign or distribution outcomes.
      relatedQuestionRefs: [QU010]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-opacity
      missingEvidence: Merchant and shopper cohorts showing repeat-order frequency, churn, NRR or GRR, J24 repeat-visit behaviour, and brand rebooking or campaign repeat rates.
      whyItMatters: Operational proxies suggest stickiness, but underwriting customer durability without actual cohorts or churn metrics would overstate confidence.
      diligencePath: Request merchant cohort tables by city and acquisition month, J24 user retention by store cluster, and brand repeat-spend curves by partner.
      relatedQuestionRefs: [QU019]
      relatedTableRefs: [TU004]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Any public disclosure of top-customer, top-brand, category, or city revenue concentration and overlap between legacy Jumbotail and Solv accounts.
      whyItMatters: Combined 500K+ retailer scale does not reveal whether revenue is diversified or concentrated in a few cities, categories, or anchor brands.
      diligencePath: Request top-20 retailers, top-20 brands, top-10 cities, and overlap-adjusted active-account concentration with GMV and margin contribution.
      relatedQuestionRefs: [QU020]
      relatedTableRefs: [TU005]
    - type: conflicting-data
      severity: material
      topic: j24-scale
      missingEvidence: A current, reconciled list of live J24 stores, openings, closures, and city coverage after the Solv transaction.
      whyItMatters: Older official growth targets and later third-party scale-down reporting point in different directions, so the real durability of the store format is unclear.
      diligencePath: Request current store roster, closed-store list, same-store sales trends, and city-by-city J24 profitability or contribution margin.
      relatedQuestionRefs: [QU023]
      relatedTableRefs: [TU002, TU006]
    - type: private-evidence-only
      severity: material
      topic: credit-dependence
      missingEvidence: Lender roster, attachment rates, approval rates, default and loss metrics, and economic risk sharing between Jumbotail and financing partners.
      whyItMatters: Credit is part of the value proposition to retailers and sellers, but public evidence does not reveal whether growth is dependent on subsidised or fragile credit supply.
      diligencePath: Request partner list, portfolio vintage curves, delinquency buckets, write-off policy, and channel-level sales lift for credit-enabled merchants.
      relatedQuestionRefs: [QU025]
      relatedTableRefs: [TU005]
