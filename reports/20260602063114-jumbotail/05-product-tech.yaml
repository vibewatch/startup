- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / quality signal
  - Status
  - Scope
  - What it does prove
  - Gap / concern
  rows:
  - - App-store privacy disclosure and deletion request
    - Visible
    - Jumbotail and J24 app surfaces
    - Basic disclosure of data collection/sharing and user deletion path
    - No public security architecture, audit, or certification detail
  - - Marketplace quality-control promise
    - Visible in official copy
    - Seller onboarding and supply quality
    - Company says product experts and sourcing specialists maintain quality
    - No independent quality-error or return-rate disclosure
  - - J24 trained store teams and hygiene promise
    - Visible in consumer app copy
    - Store-level shopper experience
    - Shows store operations are part of the product promise
    - No public mystery-shopping or complaint-rate data
  - - Service-level operating metrics
    - Visible for FY23
    - In-stock, fill rate, next-day delivery
    - Suggests repeatable logistics performance at some scale
    - Metrics are company-reported and not broken out by city, category, or recent period
  - - Field onboarding for credit products
    - Visible in hiring
    - Merchant education and adoption
    - Shows Jumbotail acknowledges adoption complexity and uses human controls
    - Human-heavy onboarding can slow scale and create inconsistent execution
  - - App-review complaint signal
    - Visible on Apple App Store
    - Login and support experience
    - Independent users report that account and complaint handling can fail
    - Sample is anecdotal and complaint volume is not published
  - - Solv diligence and valuation flag
    - Visible in independent reporting
    - Post-merger integration and governance
    - Shows integration risk extends beyond catalog expansion
    - No public remediation plan or milestone-based integration disclosure
  notes: Trust and quality evidence is mostly operational and privacy-surface based; public proof of formal security or compliance maturity remains thin.
