tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary buyer or user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - B2B ordering marketplace
    - Kirana stores and supermarkets
    - GA
    - Daily replenishment rail tied to broad assortment and brand access
    - No public take-rate, cohort retention, or module-level revenue split
  - - In-house supply chain and logistics
    - Retailers, brands, and marketplace sellers
    - GA
    - Company claims owned warehousing, fulfilment, and storefront delivery rather than pure pass-through brokerage
    - No public warehouse-utilisation, cost-per-drop, or SLA-breach disclosures
  - - Payments and working-capital credit
    - Retailers, sellers, and lending partners
    - GA but opaque economics
    - Embedded into merchant workflow instead of being a separate fintech app
    - No public delinquency, partner roster, risk-sharing, or loss-rate data
  - - GoldenEye retail OS
    - J24 operators and kirana entrepreneurs
    - GA claims; public module list visible
    - Combines POS, inventory, CRM, loyalty, payments, credit, and analytics in one store stack
    - No public install base, seat count, or software ARPU
  - - J24 new retail format
    - Kirana entrepreneurs and local shoppers
    - Live consumer/store surface
    - Extends Jumbotail from merchant procurement into shopper-facing store operations
    - Store count, payback, same-store sales, and closure rates are not publicly reconciled
  - - Brand / marketplace partnerships layer
    - National and regional brands, manufacturers, and sellers
    - GA claims
    - Data-led merchandising and lower-cost access to fragmented retail are core brand promises
    - Partner ROI is testimonial-led, not independently audited
  - - Post-Solv multi-category commerce layer
    - MSMEs, brands, and non-grocery retailers
    - Expansion stage
    - Adds softlines and general merchandise to the platform without abandoning kirana roots
    - Migration path, category-by-category adoption, and cross-sell rates are not public
  notes: Rows separate clearly verified modules from the unverified adoption and economics detail that remains private.
