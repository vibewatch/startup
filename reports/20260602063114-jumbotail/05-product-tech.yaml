- id: workflow-and-offline-enablement
  title: Workflow, offline enablement, and what the store format actually changes
  body: 'The workflow evidence shows why Jumbotail should be read as an execution-heavy retail system. On the merchant side, the FY23 operating update says orders already flowed digitally through the app without a salesforce placing them manually, while logistics metrics suggest a model designed for frequent replenishment rather than occasional wholesale drops. On the consumer and store-operations side, the J24 app surfaces a different job to be done: shoppers can track purchases, pay pending bills, use loyalty rewards, browse offers, and contact the local store, while the app description promises real-time billing and a trained store team. In other words, J24 is not just branding around kiranas; it is an attempt to turn the local store into an operating node with digital checkout, loyalty, and customer-contact loops. But the same evidence also highlights friction. The credit-adoption role explicitly depends on field onboarding and education teams, and the app-store review trail shows that
    account lookup and complaint handling can still break down at the last mile. That combination implies a product whose usability depends heavily on offline store operations, field execution, and support discipline, not just clean software flows.'
