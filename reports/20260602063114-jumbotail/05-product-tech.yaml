  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: Publicly documented security architecture, audit reports, or certifications for GoldenEye, J24, or merchant apps.
    whyItMatters: Trust and compliance are product-critical for payments, loyalty, and merchant data, but public surfaces only show app-store privacy disclosures.
    diligencePath: Request security overview, third-party audit summaries, certification status, and internal access-control documentation from management.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: credit-governance
    missingEvidence: Named lending partners, underwriting policy, delinquency or write-off data, and any guarantee or first-loss structure.
    whyItMatters: Embedded credit can boost adoption and GMV while hiding loss exposure or operational drag if governance is weak.
    diligencePath: Request credit-product pack with partner list, risk-sharing terms, cohort performance, and collections operating model.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
    - TE004
  - type: missing-source
    severity: material
    topic: module-adoption
    missingEvidence: Quantified deployment and active-usage metrics for GoldenEye, J24 stores, loyalty, and merchant-credit modules.
    whyItMatters: Without module adoption and retention data, the software and store-format narrative cannot be valued separately from wholesale execution.
    diligencePath: Request monthly active stores, merchant attach rates, J24 store count history, credit penetration, and module-level churn or retention.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: post-solv-integration
    missingEvidence: A dated integration plan showing which Solv categories, sellers, credit flows, and operating systems are already merged versus still separate.
    whyItMatters: The category-expansion thesis depends on successful systems and operating integration, not just acquisition headlines.
    diligencePath: Request integration roadmap, org chart, platform migration milestones, category P&Ls, and service-level metrics before and after the combination.
    relatedQuestionRefs:
    - QE023
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: language-and-localization
    missingEvidence: Public product documentation listing supported languages, vernacular onboarding flows, or localized store-operating assets.
    whyItMatters: Mass-market retailer adoption in India is likely shaped by language and local workflow fit, but the public product surfaces do not enumerate this clearly.
    diligencePath: Ask for screenshots, rollout maps, training materials, and usage by language or region for merchant and J24 consumer products.
    relatedQuestionRefs:
    - QE015
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: minor
    topic: service-transparency
    missingEvidence: Recent city-level SLA dashboards, complaint volumes, incident history, and store-support response metrics.
    whyItMatters: Execution is positioned as the moat, so reliability needs better public proof than a few historical metrics and anecdotal reviews.
    diligencePath: Request rolling fill-rate, on-time delivery, support ticket, complaint-resolution, and store-ops scorecard data by city and category.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE004
