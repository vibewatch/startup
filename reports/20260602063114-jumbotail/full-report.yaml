  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, specialists, incumbents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Jumbotail now competes in a wider arena than the old “B2B grocery app” label implies. The Solv transaction
              and NEC partnership push it into a broader merchant-infrastructure position spanning multi-category
              procurement, logistics, embedded finance, and store digitisation. That widens the field into four distinct
              classes. Udaan is the closest like-for-like rival because it also bundles assortment breadth, logistics
              control, and working-capital products for kiranas and adjacent small businesses. Ninjacart and WayCool
              overlap more narrowly through fresh and agrifood supply-chain depth, while ElasticRun overlaps through
              fulfilment infrastructure and brand-distribution reach rather than a merchant OS. Reliance, METRO, and
              JioMart bring a different threat: far stronger balance-sheet support, omnichannel wholesale, and
              store-backed distribution. Amazon Business, plus Flipkart and Amazon quick-commerce moves, are substitutes
              rather than clean peers, but they still compete for merchant attention, basket share, and procurement
              relevance.
