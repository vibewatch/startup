  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited consolidated revenue disappoints
        - Current audited revenue lands below roughly $140M equivalent or shows no meaningful mix improvement
        - Collapses the base-case range and leaves the unicorn mark unsupported
        - Move from track toward avoid at the current price
      - - Another financing round below expectations
        - New round lands materially below ~$800M or comes with punitive structure
        - Would confirm that private markets also reject the current headline valuation
        - Re-anchor valuation to the new reset price
      - - Solv revenue-quality issue widens
        - Restatement, audit qualification, or material write-down tied to Solv-era revenue
        - Destroys confidence in integration and in the current bridge to scale
        - Pause diligence until reconciliation is complete
      - - No audited disclosure before next fundraise
        - Management seeks more capital without current FY24-FY25 audited consolidateds
        - Signals that narrative is again outrunning proof
        - Treat new round as a warning sign, not validation
      - - Economics remain wholesale-like
        - No proof that fintech, private label, OS, ads, or services are becoming economically material
        - Keeps Jumbotail in low-multiple territory despite strategic story
        - Value on lower logistics/commerce comps only
      - - Credit or working-capital stress surfaces
        - Material deterioration in credit quality, cash conversion, or debt/charge complexity
        - Would pressure margins and force lower multiple tolerance
        - Demand revised downside case and financing plan
    notes: >-
      These are observable thesis-breakers tied to valuation rather than generic operating worries. Any one of them
      would materially compress the defensible range.
    enumerationScope:
      coverage: sample
      basis: >-
        Lists the highest-conviction price-breaking events visible from public evidence. Other negative scenarios could
        matter, but these are the most directly linked to valuation support.
