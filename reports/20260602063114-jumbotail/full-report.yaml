  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and why the served market is narrower than headline retail
        blocks:
          - type: paragraph
            body: >-
              Jumbotail should be evaluated against the part of India’s commerce stack where small retailers actually
              need help: replenishment, assortment, working capital, digital order capture, and brand or distributor
              access. Public market sources consistently show why a broad India retail number is the wrong decision
              lens. KPMG and Invest India describe a very large national retail and e-commerce backdrop, but McKinsey,
              Redseer, ONDC, and Policy Circle make clear that the economically relevant problem is the fragmented,
              still mostly offline grocery-and-MSME channel. In practice, Jumbotail’s served market includes kirana
              procurement, retailer-operating workflows, brand-distribution enablement, and embedded finance linked to
              reorder behavior. It excludes much of organized retail, pure consumer quick-commerce GMV, and broad
              digital-commerce growth that never passes through a small retailer. That boundary matters because
              otherwise the market looks effortlessly huge while the actual jobs-to-be-done, activation friction, and
              monetization surfaces disappear.
