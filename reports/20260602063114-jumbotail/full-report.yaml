      - number: '8.2'
        title: Comparable lenses make the current mark look stretched
        blocks:
          - type: paragraph
            body: >-
              A comp-based read is much harsher than the strategic narrative. Inc42’s deal analysis argues that B2B
              grocery-supply businesses usually command roughly 2x–4x revenue unless they are profitable market leaders,
              and it estimated Jumbotail’s FY24 revenue near ₹1,200 crore. Even using that optimistic estimate, a $900
              million–$1 billion mark implies roughly 6x–7x revenue; using the last solid FY23 figure of ₹819 crore
              pushes the implied multiple closer to 9x–10x. That is above Udaan’s 2025 flat-round signal at about $1.8
              billion despite Udaan being far larger on disclosed revenue, still financing toward profitability, and
              already through a major repricing from its 2021 peak.


              It is also above public logistics-enabled platform comps such as Uber and InPost, which trade closer to
              2x–3x sales, and above DoorDash’s roughly 5x sales despite DoorDash’s radically stronger scale, liquidity,
              and EBITDA proof. The only comp in similar territory is IndiaMART at roughly 5.6x EV/sales, but IndiaMART
              is precisely the asset-light, cash-generative, marketplace-like outcome Jumbotail has not yet publicly
              proved. That makes IndiaMART an upside reference, not a base-case benchmark. ElasticRun’s still-negative
              FY25 earnings and Udaan’s restructuring reinforce the same lesson: Indian commerce infrastructure can
              create scale long before it earns a premium multiple.
