      - number: '8.4'
        title: Final recommendation, diligence gates, and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              That leads to a track recommendation with medium confidence and high risk. Jumbotail still deserves
              attention because few Indian B2B commerce players combine food distribution, multi-category supply,
              embedded credit, retailer OS tools, and brand reach at this scale. But buying the unicorn story today
              would mean paying for post-Solv execution before investors can see clean consolidated numbers, revenue
              quality, credit losses, or a preference stack. The discipline point is simple: either wait for current
              audited consolidateds and mix/margin disclosure, or insist on entry well below the headline unicorn mark.


              A valuation closer to roughly $700 million–$800 million would give outside investors a better buffer while
              still recognizing strategic progress. The main diligence blockers are current audited FY24-FY25
              statements, an opening balance sheet for the combined entity, exact round and preference terms, and hard
              proof that software, fintech, private-label, and operating-system layers are becoming economically
              material. Without those, another high-priced round would be a warning sign rather than confirmation. The
              valuation thesis breaks quickly if Solv’s revenue-quality concerns widen, if integrated economics remain
              stubbornly wholesale-like, or if a new financing round lands below expectations before disclosure
              improves.
