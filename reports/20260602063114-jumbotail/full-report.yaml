      - number: '7.3'
        title: Governance, integration, and private-company opacity remain the hardest risks to clear from public evidence
        blocks:
          - type: paragraph
            body: >-
              The most serious residual risk is governance opacity around a strategy that got larger and more complex
              faster than public disclosure improved. Financial Express and Inc42 both describe due-diligence concerns
              around Solv’s revenue quality, while Inc42 also reports leadership churn and questions around why a
              business that had publicly discussed an IPO path ended up being sold. Even after CCI approval, that does
              not disappear; it only means the structure cleared antitrust review. The company’s own release emphasizes
              strategic logic, fresh capital, and a clearer board structure, which are real mitigation signals. But
              investors are still being asked to accept large post-merger claims with limited current audited
              disclosure. Financial Express explicitly said FY24 Jumbotail figures had not been filed as of May 2025,
              Entrackr’s hard numbers stop at FY23, and public entity pages are fragmented rather than consolidated.
              This is why the main governance risk is not a single scandal headline. It is the possibility that
              integration, category expansion, and credit exposure are moving faster than the company’s public control,
              reporting, and remediation surface.
