    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Solv integration and control risk
        - Remediation plan slips, key finance leaders leave, or overlap-adjusted seller metrics stay opaque
        - Any missed integration milestone or refusal to share remediation evidence
        - Re-cut synergy assumptions and escalate governance diligence before underwriting upside
      - - Margin and logistics fragility
        - Fill-rate, next-day-delivery, or service-level evidence deteriorates while costs stay elevated
        - Sustained service miss or cost-to-revenue worsening despite claimed scale benefits
        - Lower conviction and require city-level unit economics before supporting expansion
      - - Credit/default risk
        - Lender pullback, lower approved limits, or rising merchant-vintage stress
        - Any partner tightening or worsening collections trend without offsetting profitability gains
        - Haircut GMV, retention, and working-capital assumptions
      - - Competition intensity
        - >-
          Observable price gap, faster service, or broader assortment from JioMart, Amazon, Flipkart, or udaan in core
          clusters
        - Repeated incumbent overmatch in Jumbotail’s target merchant corridors
        - Assume slower share gains and lower gross margin; do not underwrite easy category expansion
      - - Compliance and product integrity
        - Repeat counterfeit case, FSSAI warning, or grievance spike tied to authenticity or handling
        - Any repeat incident without clear root-cause fix and vendor-control proof
        - Pause investment case until seller-vetting and compliance controls are re-verified
      - - Data/platform concentration
        - Merchant app or vendor portal outage, security incident, or privacy complaint with operational spillover
        - Material incident without credible disclosure and remediation plan
        - Treat as thesis-break until control maturity is demonstrated
