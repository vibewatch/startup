  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Public P&L history and what revenue actually consists of
        blocks:
          - type: paragraph
            body: >-
              The cleanest public financial spine still stops at FY23. Filings-derived coverage across Entrackr, Inc42,
              and ETRetail lines up on a business that scaled quickly but not cheaply: FY22 revenue from operations was
              about ₹377 crore on roughly ₹122-125 crore of loss and ₹1,128 crore of GMV, while FY23 revenue rose to
              about ₹819 crore, GMV to ₹2,262 crore, and net loss to roughly ₹264 crore. The important
              quality-of-revenue point is that this is not a software-first income statement. Public breakdowns say
              about ₹766-767 crore of FY23 revenue came from sale of products or traded goods, roughly 94% of operating
              revenue, while the rest came from marketplace commission, shipping, and services. Inc42 adds that services
              revenue was about ₹52 crore and links it to J24 and GoldenEye. In March 2024, management also said the
              marketplace still generated the majority of revenue, private labels contributed 10-15%, and advertisements
              plus J24 were additional monetization lines. That means public evidence supports a layered revenue model,
              but it also shows that the layer investors might want to reward with software-style multiples was still
              small beside inventory-linked trade revenue.
