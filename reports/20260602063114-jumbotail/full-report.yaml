  - id: TP003
    title: Embedded finance, retail OS, and merchandising leverage comparison
    columns:
      - competitor
      - finance posture
      - retail OS or store tech
      - private-label or merchandising leverage
      - implication
    rows:
      - - Jumbotail
        - Embedded fintech and working-capital optimisation are part of the core pitch
        - GoldenEye and J24 are explicit merchant-operations products
        - Brand gateway language is strong; public private-label detail is still sparse
        - The moat case depends on whether OS plus finance actually deepens retention
      - - Udaan
        - UdaanCapital is visible and integrated with trade workflows
        - Workflow tooling is visible, but less explicitly store-OS-led than Jumbotail
        - Staples private-label initiatives are publicly disclosed
        - Most like-for-like challenger on finance and recurring procurement loops
      - - Reliance / METRO / JioMart
        - Working-capital and digital-payment support are part of New Commerce
        - Merchant enablement is present but described more as omnichannel support than deep software
        - Large incumbent merchandising power and assortment buying muscle
        - Incumbent scale can offset lighter software narratives
      - - Amazon Business
        - Interest-free or pay-later style credit exists for eligible buyers
        - Control is procurement, compliance, and spend management rather than in-store operations
        - Merch leverage comes from assortment breadth and pricing transparency, not private labels for kiranas
        - Powerful secondary rail even without merchant workflow depth
      - - Ninjacart
        - Public finance detail is limited versus supply-chain detail
        - Retail tooling is not the central public message
        - Merch leverage comes from freshness and supply efficiency
        - Strong category specialist, weaker full-store lock-in
      - - ElasticRun
        - Finance is not the core public message
        - Tech depth is aimed at fulfilment and SaaS infrastructure, not kirana store ops
        - Private-label and regional-brand economics are part of the margin story
        - Useful infrastructure peer but not a clean merchant-OS rival
    notes: >-
      This exhibit isolates the merchant-lock-in levers the market talks about most: financing, store operations, and
      merchandising power.
