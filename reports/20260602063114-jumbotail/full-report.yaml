  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Element
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Strategic scale
        - 500,000+ retailers across 400 cities creates real distribution leverage.
        - Scale alone does not prove profitable or durable economics.
        - Show post-Solv retention, repeat-order density, and current city-level contribution margins.
      - - Integrated stack
        - Fintech, J24, GoldenEye, private label, and brand services create a route to higher-quality revenue.
        - Public disclosures still show a trade-heavy model with limited proof that overlays are economically material.
        - Publish revenue mix, gross margin, and adoption data by stream.
      - - Solv combination
        - Category breadth can turn Jumbotail into a broader merchant-infrastructure platform.
        - Audit concerns, leadership churn, and revenue-quality questions mean integration could be value-destructive.
        - Provide audited reconciliation of Solv revenue quality and post-merger opening balances.
      - - Comparable upside
        - IndiaMART shows Indian B2B platforms can trade above 5x sales when quality is strong.
        - IndiaMART is profitable, cash generative, and asset-light; Jumbotail is not there publicly.
        - Demonstrate IndiaMART-like cash conversion or EBITDA trajectory.
      - - Private comp support
        - Large peers like Udaan show investors still fund the category.
        - Udaan’s much larger scale still only attracted a flat round at ~$1.8B after repricing.
        - A new round for Jumbotail above $1B with clean audited numbers would strengthen the case.
      - - Capital support
        - Fresh capital and strategic investors reduce immediate funding pressure.
        - Unknown preferences, charges, and debt complexity can still hurt outside-investor economics.
        - Disclose liquidation preferences, anti-dilution, and debt / charge schedules.
    notes: >-
      The thesis and anti-thesis are price-sensitive: both can be true at once when the company is strategically
      attractive but the current mark is hard to justify.
