        - Request retailer cohort margins before and after adoption
      - - Logistics intensity
        - down
        - current
        - Physical fulfillment makes the market operationally harder than pure software categories
        - Request city-wise drop density, warehouse utilization, and last-mile cost curves
      - - Trust and informal behavior
        - down
