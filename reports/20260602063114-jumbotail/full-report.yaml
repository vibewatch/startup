      - number: '1.4'
        title: Milestones, chronology, and adverse items
        blocks:
          - type: paragraph
            body: >-
              Jumbotail's public chronology is straightforward at the top level and messy in the details. The cleanest
              dated spine is: incorporation in late 2015; major scaling rounds through 2019 and 2021; a smaller 2024
              extension or bridge financing; Solv deal announcement in March 2025; adverse merger-noise from a May 2025
              audit-delay report; CCI approval later that same month; Gautam Jain's board appointment in late June; and
              formal close of both the Solv acquisition and Series D financing on June 30, 2025. That sequence supports
              the core narrative that 2025 was the year Jumbotail became a broader, more institutional, more visibly
              financed business.

              There are, however, two adverse threads worth preserving in the chapter rather than hiding behind the
              growth narrative. First, BW Businessworld reported in 2023 that Adani Wilmar filed legal action alleging
              counterfeit Fortune-branded products had moved through Jumbotail's platform, with law enforcement raiding
              a warehouse. The same report also carried Jumbotail's response that it had zero tolerance for counterfeits
              and was cooperating with investigators, so the fact pattern is allegation-plus-company-response, not
              adjudicated guilt. Second, Financial Express reported in May 2025 that audit findings around related-party
              transactions at Solv had delayed the merger and could have forced a valuation reset. Even though the deal
              later cleared CCI and closed, the article matters because it shows that execution and diligence risk
              existed inside the headline success story. For chapter 1, the correct posture is to record those items as
              real diligence flags while also noting that the transaction ultimately completed.
