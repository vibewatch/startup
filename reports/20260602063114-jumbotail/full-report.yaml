  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, payer, and beneficiary map across kiranas, J24, brands, and lenders
        blocks:
          - type: paragraph
            body: >-
              Jumbotail's customer base is best understood as a stack of roles rather than a single merchant bucket. On
              the core buy side, kirana owners and supermarkets procure inventory through the marketplace and are the
              primary payers; on the operating side, store staff and entrepreneurs use J24 and GoldenEye to run billing,
              inventory, CRM, loyalty, and day-to-day retail workflows; on the beneficiary side, neighbourhood shoppers
              interact with J24 for purchase history, pending-bill payments, cashback, and offers. The platform also
              serves brands, regional manufacturers, and MSME sellers that need route-to-market access into fragmented
              retail, while lending partners matter because working capital is embedded in the proposition for customers
              and sellers. That distinction matters for diligence because Jumbotail is monetising and retaining several
              different constituencies at once, and public proof is strongest for buyer workflow breadth and seller-side
              distribution value rather than for clean segment revenue splits.
