      - number: '4.3'
        title: Capital raised, debt signals, and balance-sheet proxies
        blocks:
          - type: paragraph
            body: >-
              Jumbotail has repeatedly needed fresh capital while building this model. In March 2023 it raised ₹75 crore
              of venture debt from Alteria Capital and InnoVen Capital while promising operational profitability within
              a year. By March 2024 management said total capital raised since inception stood at $143 million of equity
              plus $14 million of debt, then in June 2025 the company raised a further $120 million Series D and
              completed the Solv transaction. Multiple 2025 outlets and Tracxn place total disclosed capital around $263
              million after that round, while Inc42 Datalabs shows a higher $287.76 million-plus figure, so even basic
              fundraising totals need reconciliation of what each database includes. Filings-derived company-profile
              evidence also shows the business has used lender and trustee structures beyond venture debt headlines.
              CompanyCheck reports ₹65.66 crore of open charges and ₹146 crore of satisfied charges as of early 2026,
              and Tracxn's legal-entity summary lists 19 loans with visible names including BlackSoil, ICICI Bank, Holy
              Basil, Orbis, Catalyst, RBL Bank, HDFC Bank, Axis Bank, and Kotak Mahindra Bank. The exact status strings
              are partially obscured in Tracxn's public preview, so the public record is better for proving borrowing
              complexity than for confirming covenant status or current outstanding balances. Still, the takeaway is
              clear: Jumbotail did not scale on equity alone, and public debt or charge evidence is consistent with a
              business carrying meaningful working-capital and financing demands.
