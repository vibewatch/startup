  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competition and horizontal category expansion raise the bar at the same time
        blocks:
          - type: paragraph
            body: >-
              Competition is not a theoretical downside reserved for future diligence. As of 2026, public sources show
              Reliance’s JioMart scaling hyperlocal orders off a 3,100+ store network, Amazon Business marketing
              nationwide B2B procurement with GST and analytics tooling, Amazon and Flipkart adding rapid-delivery
              infrastructure, and udaan still pitching millions of small businesses with credit and fast delivery. That
              matters because Jumbotail is no longer defending only a grocery niche. The Solv transaction and NEC
              partnership push the company into apparel, home, toys, sports, electronics, and a much broader seller and
              retailer base. Public company materials frame that breadth as the path to a stronger AI-native commerce
              and credit stack. The risk view is harsher: the company must now integrate more categories, more
              workflows, more counterparties, and more competitive price references while proving that horizontal
              expansion does not dilute operational discipline. Realized stress is already visible in the deal record,
              where audit-related questions, leadership churn, and valuation stretch appeared before the combination
              fully closed.
