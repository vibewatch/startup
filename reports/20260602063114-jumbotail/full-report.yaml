      - number: '7.2'
        title: Thin-margin logistics, service reliability, and credit exposure are structurally linked
        blocks:
          - type: paragraph
            body: >-
              Jumbotail’s own disclosures show a business that wins through operating intensity, not through software
              gross margins alone. In FY23 the company said every order was app-led, no minimum order value was
              enforced, more than 15 million orders were handled, and more than 75% arrived the next day. Those are
              strengths, but they are also obligations. Leadership interviews describe SLA adherence as the basis of
              trust and say failures often originate in warehousing, inventory architecture, manpower planning, and
              vendor readiness. Entrackr’s FY23 analysis then shows why this matters financially: procurement was the
              dominant cost, transportation and distribution were meaningful overheads, and the company still spent more
              than a rupee to earn a rupee of revenue. Credit adds another layer. SIDBI and ICRIER both describe a
              trade-heavy MSME credit market where working-capital access remains painful, NBFCs play a large role, and
              pockets of delinquency still exist even though headline asset quality improved. So the operating risk is
              not just delivery misses; it is the combined effect of service failure, working-capital pressure, and any
              lender pullback on merchant retention and order frequency.
