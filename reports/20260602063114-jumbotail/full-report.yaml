      - number: '8.3'
        title: Scenario range and price discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario logic works better here than false precision. The bull case assumes the Solv combination holds
              together, current audited revenue proves materially above the FY23 base, and higher-margin layers—fintech,
              private label, J24, GoldenEye, ads, and category expansion—start to matter enough for investors to treat
              Jumbotail as more than a wholesale distributor. Under that setup, roughly $180 million–$200 million of
              credible revenue at 5x–6x sales can support about $0.9 billion–$1.2 billion, which is the only path that
              really validates the unicorn mark.


              The base case is more conservative: around $140 million–$170 million of credible revenue, ongoing thin
              margins, and a 3.5x–4.5x multiple produce about $0.5 billion–$0.75 billion. The bear case assumes audit or
              integration noise, no meaningful mix shift, and another financing need before disclosure improves; then
              $110 million–$140 million at 2x–3x yields roughly $0.22 billion–$0.42 billion. This range logic is
              intentionally rough, but it is still more honest than treating the last round as self-validating. The
              current public record supports a stretched, not impossible, valuation: the upside exists, but the burden
              of proof sits on management.
            claimRefs:
