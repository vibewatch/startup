      - number: '3.3'
        title: Incumbents, horizontal procurement rails, and capital power
        blocks:
          - type: paragraph
            body: >-
              Reliance, METRO, JioMart, and Amazon Business are more dangerous than many startup-vs-startup maps suggest
              because they attack the same merchant spend with stronger infrastructure and procurement credibility.
              Reliance’s New Commerce pitch openly promises assortment, digital payments, working capital, and
              supply-chain support for lakhs of merchants, while its Metro integration has already scaled a large B2B
              store footprint and migrated merchant activity onto a more robust wholesale rail. JioMart’s quick-commerce
              push adds another pressure point, particularly because Reliance can use stores and fulfilment centres
              rather than relying only on dark stores. Amazon Business is different again: it is a horizontal
              procurement platform with much stronger public compliance and invoice tooling than startup peers, plus
              broad national assortment and delivery. That makes it an easy secondary rail for tail SKUs, institutional
              needs, and merchants who care more about procurement governance than about an integrated kirana operating
              system. Flipkart Minutes and Amazon Now extend the same logic into urgent-basket competition.
