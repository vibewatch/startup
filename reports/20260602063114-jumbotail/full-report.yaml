      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is broader than a single kirana app narrative. The core economic user is the owner-operator
              of a kirana or small supermarket who manages cash flow, assortment, and reorder timing personally. The
              same market also includes growth retailers that are more formal, GST-registered, or digitally literate;
              brands and distributors that need better reach into general trade; and ONDC or other digital-network
              participants that help small sellers become discoverable across multiple buyer applications. Public ONDC
              materials show how cross-app visibility and QR-led storefronts reduce onboarding friction, while Redseer’s
              udaan case shows that density and micro-market execution can materially deepen wallet share in specific
              clusters. The adoption path is therefore not only software discovery. It often runs from payment readiness
              and digital ordering into better procurement reliability, then into formal credit or working-capital use,
              and only later into deeper software or channel-integration dependence. That path explains why Jumbotail
              can create value for retailers, brands, and finance partners at the same time, but also why adoption tends
              to be local, trust-heavy, and operational rather than purely viral.
