              merchant-side proxy is the FY23 disclosure that every order was app-led and that average monthly buying
              frequency per kirana materially exceeded peers; the best operations-side proxy is leadership emphasis on
              daily doorstep reliability, repeatability, and shrinking replenishment cycles. On the consumer edge, J24
              exposes persistent behaviours that usually matter only after the store is live—purchase history,
              pending-bill settlement, cashback, offers, and store contact—while the app-store listings show at least a
              modest live footprint and some rating data. NEC's collaboration language goes one step further by
              explicitly promising higher customer retention, but that is still aspirational company language rather
              than disclosed performance. No retained source publishes merchant GRR, NRR, brand renewal curves, J24
              repeat-shop cohorts, default-adjusted credit retention, or even absolute order frequency per active
              merchant. The right posture is therefore to treat durability as directionally positive and operationally
              believable, but still unproven in the metrics an investor would ultimately want.
