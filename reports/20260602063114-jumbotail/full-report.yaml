        title: Expansion motion is credible, but concentration, multihoming, and credit dependence remain key customer risks
        blocks:
          - type: paragraph
            body: >-
              Jumbotail's expansion motion is easy to see. Solv broadens the customer base from grocery kiranas into
              MSMEs, brands, and sellers in softlines and general merchandise; NEC aims to deepen in-store digitisation,
              targeted promotions, and consumer engagement; and management interviews say the company is prioritising
              depth in existing cities while still targeting Tier 2 and Tier 3 growth. The risks are equally clear.
              First, public concentration data is absent: there is no disclosure of top retailers, top brands,
              overlap-adjusted active accounts, or wallet share by city. Second, retailer loyalty is structurally
              contestable because kiranas are simultaneously being courted by ONDC-linked software providers,
              quick-commerce hybrids, Pincode-style enablement, and FMCG direct programs. Third, onboarding is not
              frictionless: comparable kirana digitisation still requires training and handholding. Fourth, credit is
              integral to the product promise, so adoption could weaken if lending economics or partner appetite
              deteriorate. Finally, the Solv integration introduces its own customer-read-through risks because audit
              concerns and conflicting third-party reporting on J24 or city scale make the current post-merger baseline
              harder to pin down.
