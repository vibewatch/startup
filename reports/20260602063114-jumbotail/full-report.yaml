companyProfile:
  summary: >-
    Jumbotail is a Bengaluru-based B2B commerce and new retail platform founded in 2015 by Ashish Jhina and S. Karthik
    Venkateswaran. The company combines merchant procurement, warehousing and logistics, payments and working-capital
    enablement, J24 store transformation, and GoldenEye retail software for kiranas, small retailers, brands, and MSMEs.
    Its June 2025 $120 million Series D and Solv acquisition expanded the business from a food-and-grocery specialist
    into a broader horizontal commerce-and-financial-services platform that management says reaches more than 500,000
    small retailers and MSMEs across 400+ cities. The underwriting question is no longer whether Jumbotail is
    strategically relevant; it is whether a still-opaque, wholesale-heavy, loss-making model can earn enough margin and
    control discipline to justify the current unicorn signal.
