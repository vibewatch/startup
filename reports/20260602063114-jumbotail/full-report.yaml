  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Full-stack product definition: merchant infrastructure rather than a single app'
        blocks:
          - type: paragraph
            body: >-
              Jumbotail's own product surfaces consistently describe a layered merchant-infrastructure stack rather than
              a narrow ordering tool. The strongest directly observable proof comes from the homepage,
              marketplace-partnerships material, and company-profile pages that all point to the same components: a B2B
              ordering marketplace, an in-house warehousing and storefront-delivery network, embedded payments and
              working-capital credit, J24 as a store-transformation format, and GoldenEye as the operating system behind
              that format. That combination matters because it changes what the product actually is. A kirana buyer is
              not only using a catalog; the merchant is entering a workflow where replenishment, store operations,
              financing, and brand access can all be mediated by Jumbotail. The company also claims the stack is built
              with technology, data science, and design, and independent profile pages broadly repeat that framing. The
              caveat is that public proof is much stronger on module existence and workflow language than on
              software-adoption depth. Public pages verify what modules exist and how they are supposed to fit together,
              but they do not publish GoldenEye seat counts, store-level retention, or module-level revenue contribution
              in a way that would let an investor underwrite the software layer on pure SaaS terms.
            claimRefs:
