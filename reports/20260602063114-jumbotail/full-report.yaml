  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited FY24-FY25 consolidated financials
        - Signed P&L, balance sheet, cash flow, and latest monthly run-rate
        - Without this, investors are valuing a private story on stale FY23 numbers and third-party estimates
        - Request audited financial packet and post-close management accounts
      - - Post-Solv revenue reconciliation
        - Opening balance sheet and bridge from standalone Jumbotail + Solv to the combined entity
        - This is the cleanest test of whether the strategic scale claim is economically real
        - Request transaction close memo, integration pack, and auditor reconciliation
      - - Revenue mix and margins
        - >-
          Gross margin, contribution margin, and growth by traded goods, services, fintech, ads, private label, and OS
          products
        - The multiple hinges on whether higher-quality streams are becoming material
        - Request stream-level cohort economics and city/category contribution margins
      - - Credit book quality
        - Book size, lender structure, delinquencies, write-offs, take rates, and guarantee exposure
        - Embedded credit can flatter GMV while hiding risk and capital intensity
        - Request lender agreements and portfolio-quality dashboard
      - - Cap table and preference stack
        - >-
          Liquidation preferences, anti-dilution, pro-rata, and any side letters tied to the 2025 round and Solv
          transaction
        - Outside-investor returns depend on structure, not just headline valuation
        - Obtain cap-table waterfall and legal docs from counsel
      - - J24 / GoldenEye / private-label proof
        - Store count, adoption, ARPU, margin, and repeat-rate evidence for higher-quality monetization layers
        - These are the main reasons to pay above wholesale or logistics-like multiples
        - Request cohort economics by product and city
    notes: >-
      Priority order reflects what most directly changes the defensible price today: audited numbers first, structure
      second, and higher-quality revenue proof third.
    enumerationScope:
      coverage: partial
      basis: >-
        Focuses on the minimum diligence packet required to underwrite valuation, not every operational diligence
        request that could be made on the business.
