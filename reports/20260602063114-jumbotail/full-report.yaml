      - number: '7.5'
        title: Data and platform concentration deepen the need for explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              Public evidence on cyber or outage history is weaker than evidence on operational intensity, but that does
              not make data risk small. Jumbotail’s model is app-led and portal-mediated, and Google Play’s own
              data-safety page only provides basic declarations such as encrypted transit, deletion requests, and
              limited disclosed collection categories. There is no retained public evidence set here that gives
              investors mature external assurance on uptime, penetration testing, cloud concentration, or incident
              response. That means the right posture is to avoid inventing a hidden breach story while still recognising
              a real dependency: if the ordering app, vendor portal, or upstream data pipelines fail, merchants and
              suppliers cannot simply fall back to a low-friction analogue workflow. The public mitigations are mostly
              operational—AI tooling, in-house logistics, daily-service discipline, and cooperative incident
              response—not audited post-merger KPI transparency. So the chapter’s kill criteria have to be concrete:
              deterioration in fill rate or next-day service, evidence of credit tightening, repeat counterfeit or
              compliance issues, or another funding cycle without current audited disclosure should all be treated as
              thesis-breaking until management proves otherwise.
            claimRefs:
              - CR014
