      - number: '7.4'
        title: Regulatory compliance and product integrity risk are already partially realized
        blocks:
          - type: paragraph
            body: >-
              This chapter should distinguish cleanly between realized incidents and forward-looking legal risk. The
              realized incident is the Adani Wilmar counterfeit case: multiple outlets reported that an FIR was filed,
              179 units were seized, and investigators found fake QR codes, batch mismatches, and packaging
              discrepancies. Jumbotail’s response was cooperative and framed around zero tolerance plus vendor
              traceback. That is helpful but not exculpatory; it shows the company recognized the issue, not that
              marketplace controls were already strong enough. The forward-looking layer is broader and more structural.
              FSSAI and PIB guidance make clear that food ecommerce operators must maintain valid licensing, meet
              shelf-life and label-alignment requirements, train delivery personnel, and separate food from non-food
              deliveries. The Consumer Protection rules add grievance, seller-record, authenticity, and
              unfair-trade-practice obligations that create recurring compliance cost and operator liability. Because
              Jumbotail is a grocery-focused platform that is simultaneously broadening categories and supply
              relationships, the legal/compliance risk is not a one-off courtroom drama. It is the risk that control
              systems lag assortment growth and that the next incident comes from weak seller governance rather than
              weak demand.
            claimRefs:
              - CR032
              - CR033
