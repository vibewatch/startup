  - id: TP001
    title: Competitor profile table
    columns:
      - competitor
      - category
      - scale or backing signal
      - merchant focus
      - distinctive overlap with Jumbotail
      - main limitation
    rows:
      - - Jumbotail
        - Full-stack merchant infrastructure
        - 500,000+ retailers across 400 cities post-Solv; SC Ventures and NEC backing visible
        - Kirana stores, MSMEs, brands, multi-category mass retail
        - Marketplace plus fulfilment, fintech, GoldenEye OS, J24 stores
        - Public unit economics and OS adoption remain thin
      - - Udaan
        - Direct full-stack peer
        - India’s largest eB2B claim; $114M Series G in 2025; much larger historical funding base
        - Kiranas, HoReCa, chemists, offices, small businesses
        - Closest mix of assortment breadth, logistics control, and working-capital products
        - Public data still leaves take rates and credit-loss quality opaque
      - - Reliance / METRO / JioMart
        - Incumbent wholesale and omnichannel merchant rail
        - 200+ B2B stores in 180+ cities; lakhs of merchants; 3,100+ store network behind hyperlocal push
        - Kiranas, HoReCa, SMEs, offices, mass-market shoppers
        - Broader balance sheet, wholesale assortment, and store-backed execution
        - Less public evidence of a startup-style merchant OS or software-first wedge
      - - Ninjacart
        - Fresh and agrifood specialist
        - FY24 revenue ₹2,081.1 crore+ on Inc42; $406.74M+ funding
        - Retailers, traders, fresh-produce channels, agri ecosystem
        - High-frequency fresh supply overlap and agrisupply credibility
        - Narrower merchant workflow than Jumbotail’s post-Solv stack
      - - ElasticRun
        - Fulfilment and brand-distribution enabler
        - 1,000+ stations; 600+ cities and towns; 2.5M+ sq. ft. warehousing
        - Brands, D2C, marketplaces, B2B, q-commerce channels
        - White-label fast fulfilment and pan-India infrastructure
        - Not obviously the merchant system of record for kirana procurement
      - - WayCool
        - Agrifood distribution specialist
        - Raised Rs 210 crore rights issue after prior debt; FY23 revenue ₹1,251 crore and loss ₹685 crore
        - Retailers, food brands, institutional buyers, kiranas, HoReCa
        - Closest fresh-and-food analogue to Jumbotail’s supply-chain layer
        - Visible restructuring stress makes durability uncertain
      - - Amazon Business
        - Horizontal procurement substitute
        - 19 crore+ products, 16 lakh+ sellers, near-pan-India delivery
        - MSMEs, enterprises, retailers, hospitality, medical and industrial buyers
        - Strong GST, compliance, and long-tail assortment for secondary procurement
        - Weaker field execution and store-level operating-system depth
      - - Flipkart and Amazon quick commerce
        - Urgent-basket substitute
        - 800+ Flipkart dark stores by Apr-2026; Amazon Now targeting 100 cities and 1,000+ micro-fulfilment centres
        - Urban and emerging-town urgent grocery and general-merchandise demand
        - Speed, discounting, and convenience pressure on merchant expectations
        - Not a full scheduled wholesale or merchant-finance system
