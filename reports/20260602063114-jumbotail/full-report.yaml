      - number: '3.2'
        title: Direct peers, specialists, and where capability overlap is real
        blocks:
          - type: paragraph
            body: >-
              The closest operational comparison remains Udaan. Its official and reported position matches Jumbotail on
              the core merchant job: broad B2B assortment, fast delivery, and trade-linked finance. Udaan also carries a
              heavier disclosed historical funding base, which matters in a logistics-heavy market. Jumbotail’s clearest
              public wedge versus that peer is the more explicit retail-operating-system story built around GoldenEye
              and J24. Specialists matter differently. Ninjacart is the strongest fresh and agri specialist, making it
              relevant wherever fresh procurement frequency or farmer-network depth matters more than a broad merchant
              stack. WayCool once occupied a similar agrifood lane but now serves more as a warning about how quickly
              capital-heavy food distribution can run into funding stress. ElasticRun is strategically important because
              it is selling multi-speed fulfilment, warehousing, and white-label fast delivery to brands and commerce
              players. That gives Jumbotail competition on logistics capability and brand route-to-market access, but
              not the same level of merchant workflow ownership.
