- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Model / scale signal
  - Revenue or operating anchor
  - Value / multiple signal
  - Relevance
  - Key limitation
  rows:
  - - Jumbotail reference
    - Private Indian B2B commerce + retail infrastructure
    - FY23 revenue ₹819 Cr; FY24E ~₹1,200 Cr (third-party estimate)
    - ~$950M pre-close estimate / >$1B close narrative; ~6x-10x sales
    - Subject company and current round signal
    - FY24-FY25 audited numbers still missing; revenue mix remains trade-heavy
  - - Udaan
    - Private Indian eB2B peer
    - FY24 revenue ₹5,706 Cr; 2025 funding + profitability claims
    - $1.8B flat round in 2025
    - Closest full-stack private comp with much larger disclosed scale
    - Still restructuring and not a clean like-for-like margin comp
  - - IndiaMART
    - Public Indian B2B marketplace
    - FY26 revenue ₹1,569 Cr; 36% EBITDA margin; 220K paying suppliers
    - EV/Sales 5.63x
    - Upper-bound quality comp for Indian B2B platform value
    - Asset-light marketplace economics, not inventory-led commerce
  - - DoorDash
    - Public logistics-enabled marketplace
    - Q1 2026 revenue $4.0B; adj. EBITDA $754M
    - Price/Sales ~4.94x; EV ~$69.55B
    - Shows premium multiple for large, liquid, profitable marketplace logistics
    - Consumer-heavy and vastly larger than Jumbotail
  - - Uber
    - Public delivery + mobility platform
    - Q1 2026 revenue $13.2B; adj. EBITDA $2.5B
    - Price/Sales ~2.90x; EV ~$156.49B
    - Useful lower-multiple logistics-platform benchmark
    - Diversified beyond commerce procurement and merchant distribution
  - - InPost
    - Public parcel / logistics network
    - TTM revenue 15.62B PLN; 2025 revenue 14.71B PLN
    - Price/Sales ~2.11x; market cap ~€7.67B
    - Shows what scaled logistics networks command in public markets
    - Parcel-locker economics differ from B2B commerce marketplaces
  - - ElasticRun
    - Private Indian logistics-commerce enabler
    - FY25 revenue ₹2,653 Cr; loss ₹145 Cr
    - No clean public valuation disclosed
    - Reminds that scale can coexist with still-thin earnings in India logistics commerce
    - Not a direct merchant-OS or fintech comp
  notes: Comparable set mixes public multiples and private-round signals. It is designed to bracket Jumbotail’s range, not to imply any single clean comp exists.
