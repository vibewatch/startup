  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why
  - What would change it
  rows:
  - - Recommendation
    - track
    - Strategic platform potential is real, but the current unicorn mark is ahead of the public proof set.
    - Upgrade only after current audited consolidateds or materially lower entry price.
  - - Confidence
    - medium
    - Directionally enough evidence exists to judge the price as stretched, but crucial valuation inputs remain private.
    - Confidence rises after audited FY24-FY25 numbers, mix disclosure, and cap-table clarity.
  - - Risk rating
    - high
    - Valuation depends on successful Solv integration, thin-margin execution, and financing discipline.
    - Risk would fall if post-Solv margins, credit quality, and disclosure improve together.
  - - Valuation stance
    - stretched
    - Implied 6x-10x revenue outruns current disclosed economics and sits above most model-relevant comps.
    - Moves toward fair below roughly $700M-$800M or after bull-case proof.
  - - Decision implication
    - Do not pay the headline unicorn price blindly
    - Public evidence supports watchlist status, not aggressive underwriting at the current mark.
    - A clean consolidated revenue/margin step-up changes the call.
  notes: Assessment reflects public evidence as of 2026-06-02; current audited consolidated financials and preference terms remain unavailable.
