  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-headline-reconciliation
    missingEvidence: Exact signed share count, pre-money, post-money, and close mechanics for the June 2025 round.
    whyItMatters: Public sources disagree between a ~$950M estimate and a unicorn headline, which directly affects the entry price conversation.
    diligencePath: Obtain the signed term sheet, cap-table update, and board-approved close memo.
    relatedQuestionRefs:
    - QV002
  - type: private-evidence-only
    severity: blocking
    topic: current-consolidated-financials
    missingEvidence: Audited FY24-FY25 consolidated P&L, balance sheet, cash flow, and latest monthly run-rate for the combined entity.
    whyItMatters: Base-case and recommendation logic should not depend on stale FY23 numbers and third-party FY24 estimates alone.
    diligencePath: Request the audit package and current management accounts before underwriting price.
    relatedQuestionRefs:
    - QV007
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Liquidation preferences, anti-dilution terms, pro-rata rights, and any round-linked side letters.
    whyItMatters: Outside-investor returns depend on structure as much as on headline valuation.
    diligencePath: Review the post-round cap table, shareholder agreement, and counsel summary.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: post-solv-margin-and-credit-quality
    missingEvidence: Stream-level revenue mix, gross margin, contribution margin, credit book quality, delinquencies, and write-offs after the Solv combination.
    whyItMatters: The premium case depends on proving that Jumbotail is becoming more than a wholesale resale engine.
    diligencePath: Request stream-level cohort economics, lender dashboards, and post-close integration reporting.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set
    missingEvidence: A closer set of public Indian B2B commerce comps with fully disclosed current unit economics and capital structure.
    whyItMatters: The current comp set is useful but still forced to mix Indian marketplace, global logistics, and private-round references.
    diligencePath: Refresh the comp set after any Indian B2B commerce IPO or fuller private disclosure; for now use scenario ranges instead of a single-point comp.
    relatedQuestionRefs:
    - QV017
    - QV018
    relatedTableRefs:
    - TV004
