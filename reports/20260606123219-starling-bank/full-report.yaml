      - number: '2.4'
        title: Engine by Starling – Core Banking Software and BaaS Market
        blocks:
          - type: paragraph
            body: >
              Engine by Starling is Starling's cloud-native core banking platform, commercially separated from the bank
              and positioned as a licensed-bank-to-licensed-bank SaaS product. The Engine website states it has powered
              Starling Bank since 2016 and positions its competitive proposition on pre-integrated completeness,
              cloud-native architecture, and real-time 24/7 availability. Salt Bank (Romania), named on the Engine case
              studies page as CEO Gabriela Nistor, appears to be a confirmed reference customer. Engine describes itself
              as a "complete, pre-integrated solution" enabling banks to "modernise rapidly, grow strategically, and
              innovate continuously." The total addressable market for Engine sits within the global
              digital-banking-platforms segment estimated by MarketsandMarkets at USD 13.9 billion by 2026 (CAGR 11.3
              %). Competing vendors include Temenos (Transact), Finastra (Fusion), Mambu, and Thought Machine—all
              credible alternatives for an established bank undertaking transformation. Engine's competitive
              differentiation is its claim of being "proven at scale" at Starling (Starling's FY2025 annual report
              referenced on the Engine website), which provides a live production reference that pure-software vendors
              cannot match. The buyer universe for Engine is narrow but high-value: it targets licensed deposit-taking
              banks, not fintechs or e-money institutions. This limits TAM to institutions with the regulatory standing
              and capital base to run a full bank, but it also means each contract is large and sticky. Engine's revenue
              contribution to Starling's consolidated financials is not publicly disclosed, representing a material
              evidence gap in assessing this segment's valuation significance.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
