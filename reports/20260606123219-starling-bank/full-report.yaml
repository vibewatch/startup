companyProfile:
  summary: >-
    Starling Bank is a London-headquartered digital bank founded in 2014 by Anne Boden and licensed in the UK in 2016.
    It operates personal, joint, euro, business, and Kite youth-linked accounts, plus lending, marketplace distribution,
    and payment infrastructure services from a branchless app-first model. Starling's core franchise is a profitable UK
    retail and SME bank, while Engine by Starling extends the same core banking stack to third-party institutions such
    as Salt Bank and AMP Bank. The company remains private following a £130M Series D in 2022 at a £2.5B valuation, with
    adviser-led 2024 reporting suggesting a possible IPO around £4B but no formal filing as of the run date.
