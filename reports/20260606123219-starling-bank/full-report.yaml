  - id: FI001
    title: Starling Bank Revenue Model — Customer Activity to Revenue Bridge
    type: flow
    layout: standard
    summary: >
      How customer and institutional activity converts into Starling's revenue lines, from deposit attraction through to
      net interest income and fee generation.
    data:
      nodes:
        - id: deposits
          label: Customer Deposits (Personal + Business)
          description: >
            Over 4m accounts deposit funds; large FSCS-protected retail/SME base. Estimated £11–12bn (not confirmed from
            filed accounts).
        - id: boe_reserves
          label: Bank of England Reserves + Gilts
          description: |
            Majority of deposits held at BoE earning base rate (5.25% peak FY2024; ~4.5% FY2025). Primary driver of NII.
        - id: loan_book
          label: Loan Book (Overdrafts + SME + BBL)
          description: >
            Personal overdraft, business term loans, Bounce Back Loans. BBL losses ~£28m in FY2025; total book size not
            confirmed.
        - id: nii
          label: Net Interest Income
          description: >
            Spread between deposit cost (near zero) and asset yield (BoE rate + loan spread). FY2023 confirmed at
            £452.8m total revenue; NII share dominant.
        - id: fee_income
          label: Non-Interest Fee Income
          description: >
            Business account subscriptions, overdraft fees, card interchange, Marketplace commissions. Recurring, lower
            rate-sensitivity.
        - id: engine_rev
          label: Engine by Starling Licensing Revenue
          description: >
            B2B SaaS revenue from white-label banking platform customers (e.g. Salt Bank). Segment revenue not publicly
            disclosed.
        - id: total_revenue
          label: 'Total Revenue (FY2023: £452.8m confirmed; FY2025 estimated ~£600–660m)'
          description: |
            Consolidated P&L revenue line. FY2025 pre-tax profit £223m after FCA fine, BBL losses, and elevated bonuses.
        - id: pretax_profit
          label: 'Pre-tax Profit (FY2025: £223m)'
          description: >
            Fourth consecutive year of profitability. One-off FY2025 charges: FCA fine £28.9m, BBL losses ~£28m, bonuses
            £24.6m.
    approximationNotes: >
      Deposit base and NII share are estimates; Engine revenue contribution is unknown. Flow reflects the qualitative
      funding-to-revenue model only; balances are not confirmed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI009
  - id: FI002
    title: Unit Economics Bridge — From Account to Profit
    type: flow
    layout: standard
    summary: >
      Qualitative flow illustrating the cost and revenue drivers per account, with approximationNotes on unconfirmed
      figures.
    data:
      nodes:
        - id: account_acquisition
          label: Account Acquisition (>4m accounts)
          description: >
            Digital-only onboarding; low marginal CAC relative to branch bank. No branch network cost. CAC not publicly
            disclosed.
        - id: deposit_per_acct
          label: Deposits per Account (estimated ~£2,750–3,000)
          description: >
            Estimated average deposit per account assuming £11bn base / 4m accounts. Personal current account average
            likely lower than business account.
        - id: revenue_per_acct
          label: Revenue per Account (estimated ~£150–165/yr)
          description: |
            Estimated: FY2023 £452.8m revenue / 3.6m accounts ≈ £126/account. FY2024 higher due to rate uplift.
        - id: nii_spread
          label: NII Spread (policy rate minus cost of deposits ~0%)
          description: >
            Near-zero cost of retail deposits; return on BoE reserves = base rate. FY2024 peak NIM estimated 4%+ on
            reserves. Compressing in FY2025.
        - id: compliance_cost
          label: Compliance / Regulatory Cost
          description: >
            Post-FCA fine: Economic Crime Enhancement Plan, enlarged financial crime team. FCA fine £28.9m one-off +
            ongoing compliance opex uplift.
        - id: profit_per_acct
          label: Pre-tax Profit per Account (estimated £55–75)
          description: |
            FY2025: £223m / ~4m accounts ≈ £56/account. FY2024 higher. Industry-leading for digital bank at this scale.
    approximationNotes: >
