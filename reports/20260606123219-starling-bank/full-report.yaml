            body: >-
              Over four million accounts, 450,000+ businesses, a sixth consecutive Which? Recommended Provider award,
              and a 97% Finder recommendation rate collectively represent among the strongest publicly verifiable
              customer proof sets of any UK digital bank. The FCA's independent confirmation of 3.6 million accounts in
