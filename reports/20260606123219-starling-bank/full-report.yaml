      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Switching Inertia Remains the Primary Market Constraint
            body: >
              Despite 49 % digital-bank adoption, the average UK adult last switched bank accounts six years ago and 50
              % of non-adopters cite existing bank loyalty as the primary barrier. This means challenger banks—including
              Starling—are growing primarily through new-to-banking customers, secondary-account acquisition, and
              dormant branch-closure cohorts rather than displacing established primary banking relationships at the
              rates their total customer counts might imply. Investors should weight SME primary-account switching rates
              separately from consumer rates, as MTD regulatory forcing functions create more durable conversion
              pressure for the business segment.
            calloutType: insight
            claimRefs:
              - CM037
              - CM038
              - CM039
          - type: callout
            title: Grand View CAGR Outlier Signals Sizing Uncertainty
            body: >
              The Grand View Research estimate of a 61.9 % global neobanking CAGR through 2033 is not independently
              corroborated by other analysts reviewed during this research; Statista and MarketsandMarkets both apply
              more conservative growth assumptions. Investors relying on large-market narratives for Starling's
              valuation should verify whether any preferred market-sizing source uses a comparable methodology and
              explicitly state which market definition (revenue, deposits, users, or global NII) they are sizing before
              applying a multiple to it.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
              - CM017
          - type: callout
            title: Open Banking Infrastructure Creates Durable Competitive Infrastructure
            body: >
              The UK's CMA-mandated open-banking standard is the world's most mature regulatory open-banking
              architecture and now serves 13 million active users. This infrastructure enables Starling—and Engine's
              bank clients—to build richer data-driven products (cash-flow forecasting, embedded lending decisions,
              cross-account dashboards) that are structurally unavailable to banks operating in markets without a
              comparable mandate. This regulatory moat is an underappreciated element of the UK's challenger-bank
              competitive landscape.
            calloutType: strength
            claimRefs:
