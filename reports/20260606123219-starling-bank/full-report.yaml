      - number: '2.2'
        title: Consumer Banking – Digital Adoption and Market Scale
        blocks:
          - type: paragraph
            body: >
              UK digital banking adoption has reached a structural inflection point. A nationally representative Finder
              survey conducted by Censuswide in January 2026 (n = 2,000) found that 49 % of UK adults—approximately 27.1
              million people—have opened a digital-only bank account, up from 36 % in 2024 and 24 % in early 2023. A
              further 15 % intend to open one, implying a potential penetration ceiling above 65 %. Broader digital
              banking usage is near saturation: 88 % of UK adults (roughly 48 million) use some form of online or remote
              banking as of 2024 data, and 75 % use mobile banking specifically. Starling's own product pages report
              over 3.5 million personal current-account customers; Monzo, the leading UK challenger by customer count,
              reports 15 million customers across personal and business products. Barclays, the largest incumbent by
              mobile app users, reports twelve million customers using its app. These figures reveal that challengers
              collectively account for a large and fast-growing minority of primary banking relationships—but incumbents
              retain the majority and compete actively through switching incentives (NatWest offered £200; HSBC offered
              up to £500 in 2026) and digital product investment. On a TAM basis, the difficulty lies in sizing revenue,
              not customers: no public primary source discloses total UK current-account net-interest income or fee
              revenue. Grand View Research estimated the global neobanking market at USD 211.20 billion in 2025,
              projecting a CAGR of 61.9 % through 2033—a figure that should be treated with caution as it reflects
              global aggregate balance-sheet exposure rather than the UK addressable revenue opportunity. Statista's
              modelling approach uses NII, deposit volumes, and user penetration to project market sizes from a combined
              top-down and bottom-up methodology, while MarketsandMarkets sized the broader digital banking platforms
              infrastructure market at USD 13.9 billion by 2026 at a CAGR of 11.3 %—a narrower and arguably more
              actionable lens for Engine's competition.
