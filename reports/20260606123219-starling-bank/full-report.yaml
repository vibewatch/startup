      - number: '2.3'
        title: SME Banking – Challenger Penetration and Segment Economics
        blocks:
          - type: paragraph
            body: >
              SME banking represents one of Starling's highest-conviction growth levers and a structurally
              under-disrupted market. Starling's business account page states over 450,000 businesses bank with
              Starling, making it one of the largest digital challengers in the SME segment. Against an estimated 5.5
              million UK SMEs (including sole traders and micro-businesses), this represents an approximately 8 %
              capture rate—a figure that, if directionally accurate, suggests substantial headroom. The SME segment has
              historically been dominated by the four large incumbent banks (Barclays, HSBC, Lloyds, NatWest), which
              together held the vast majority of UK SME primary banking relationships for decades. The challenger SME
              segment is differentiated by no-monthly-fee pricing, mobile-first account management, integrated
              accounting software (Starling's built-in Starling Accounting, Tide's MTD integration, Mettle's bundled
              FreeAgent), and faster onboarding. Tide, which is not a licensed bank but operates via ClearBank under an
              e-money licence, competes in the same segment. Atom Bank differentiates through SME business loans and
              competitive savings products rather than transaction banking. Structural demand signals include the UK
              government's Making Tax Digital rollout, which requires digital record-keeping from April 2026 for sole
              traders with qualifying income above £50,000—creating a forcing function for SME digital banking adoption.
              A key adverse signal: Tide's lack of a full banking licence means SME deposits above the ClearBank FSCS
              limit (£120,000) receive different protection, which could limit adoption among larger SMEs.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
