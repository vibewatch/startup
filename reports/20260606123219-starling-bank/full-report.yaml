      - number: '7.3'
        title: Operational, Technology, Cybersecurity and Cloud Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Starling's fully digital, app-only model concentrates operational risk onto a narrow technology stack and
              a small set of critical infrastructure dependencies. As an AWS-hosted cloud-native bank, any prolonged AWS
              outage or provider-level incident would simultaneously disrupt all banking services with no branch network
              to absorb partial failures. Starling's status page records 100% uptime across all core services over the
              90-day window ending June 2026, indicating strong recent stability, but absence of disclosed incidents is
              not immunity to future events. The bank participates in Faster Payments, BACS, CHAPS, Direct Debits, and
              international payment networks; systemic disruption to any of these schemes would impair core
              functionality regardless of Starling's own infrastructure health. APP fraud liability under the PSR's
              mandatory reimbursement policy—effective October 2023, requiring 50:50 cost-sharing between sending and
              receiving firms—creates an ongoing structural loss stream; £459.7m was lost to APP scams across the UK in
              2023. Starling's mobile-first, app-only customer base conducts all financial activity through a single
              channel, elevating scam exposure, and the fraud guidance page acknowledges sophisticated
              social-engineering attacks including spoofed caller-ID fraud. No material cybersecurity breaches or data
              incidents are publicly disclosed as of June 2026, but the bank's Privacy Notice reveals extensive
              processing of personal, financial, biometric, and transactional data—a large GDPR footprint that heightens
              ICO enforcement exposure. Any vulnerability in the shared Engine-by-Starling codebase could simultaneously
              affect Starling and its licensee bank clients, creating a compound reputation risk that does not exist for
              non-platform peers.
