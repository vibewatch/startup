chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Licensing, and Corporate Structure
        blocks:
          - type: paragraph
            body: >-
              Starling Bank Limited is a UK private limited company (Companies House no. 09092149) incorporated on 18
              June 2014. It was originally registered under the name POSSIBLE FS LIMITED, renamed to STARLING FS LIMITED
              in January 2016, and adopted its current trading name shortly thereafter. The bank holds a full UK banking
              licence: it was authorised by the Prudential Regulation Authority (PRA) on 12 July 2016 and has been
              regulated by both the Financial Conduct Authority (FCA) and the PRA under registration number 730166 ever
              since.

              The company describes itself as 100% independent — not owned by any other bank — with equity held by
              founder Anne Boden and current employees, an employee benefits trust, and several external financial
              investors. Its registered address is the 5th Floor, London Fruit and Wool Exchange, 1 Duval Square, London
              E1 6PW.

              Starling operates as a branchless, app-first digital bank offering personal current accounts, business
              bank accounts, joint accounts, overdrafts, unsecured loans, mortgages (via intermediary), and the Kite
              debit card for children under 16. Beyond retail banking, it provides B2B banking infrastructure services
              (Faster Payments indirect access) and has spun out a separate SaaS banking technology business called
              Engine by Starling. Its SIC classification is 64191 (Banks). The bank is protected under the FSCS up to
              £85,000 per eligible customer.
