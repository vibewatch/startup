      - number: '8.2'
        title: Comparable Set Analysis
        blocks:
          - type: paragraph
            body: >-
              Constructing a peer set for Starling is non-trivial because the company is simultaneously a profitable
              retail and SME bank, a nascent B2B software vendor (Engine), and a private company without audited segment
              disclosures. Four reference groups are used: (1) UK private neobanks — Monzo (last marked at £5bn in June
              2024 despite operating losses) and Revolut (last marked at $33bn in secondary transactions in 2023, since
              reset by its profitable FY2023/FY2024 results and UK banking licence obtained in July 2024); (2) the
              public UK fintech — Wise plc (LSE: WISE), a profitable cross-border payments company that provides the
              most transparent earnings-multiple benchmark among UK digital financial firms; (3) global neobank peers —
              Nubank (NYSE: NU), profitable and trading at 20-30x earnings with Latin American growth premium; and (4)
              UK challenger bank cautionary references — Metro Bank, which completed an emergency recapitalisation in
              October 2023 after compliance and capital failures, illustrating the valuation consequences of regulatory
              breakdown in the UK. Among these, Wise is the most analytically useful: it is profitable,
              UK-headquartered, has a transparent fee-driven model with a NIM overlay, and is publicly quoted. At an
              estimated P/S of 5–8x and P/E of 20–30x as of run date (the latter based on Wise's FY2025 revenues and
              profits using analyst estimates, not independently verifiable from this review), Wise sets a plausible
              upper bound on what a profitable UK digital financial firm can sustain on public markets. Monzo's £5B mark
              at a loss-making stage implies the market was valuing growth and user trajectory heavily, providing
              context for why Starling's similar-sized but profitable base should trade at a premium on earnings but a
              discount on growth multiples. Revolut's $33B mark reflects a much larger, globally diversified business
              with payment-network ambitions and is not a valid direct comp for Starling's UK-concentrated retail/SME
              model. The Engine by Starling licensing pipeline (ABN AMRO, AMP Bank Australia, Salt Bank Romania,
              confirmed by Finextra reporting) creates a modest SaaS optionality argument, but with no disclosed Engine
              ARR, this cannot be incorporated into a base-case multiple; it is reserved for the bull case.
