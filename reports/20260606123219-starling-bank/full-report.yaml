  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation History and Current Context
        blocks:
          - type: paragraph
            body: >-
              Starling Bank last raised external equity in April 2022, closing a £130m Series D at a post-money
              valuation of £2.5bn. That round was widely reported by Bloomberg, Reuters, and The Guardian, and remains
              the last hard anchor in the cap table. No equity raise has been disclosed since, making £2.5bn the
              institutional cost basis floor. In August 2024, Bloomberg and Reuters reported that Starling was exploring
              an IPO at approximately £4bn, implying a 60% appreciation on the Series D basis over roughly 28 months.
              Multiple City sources cited adviser conversations rather than a formal prospectus process, and no filing
              with Companies House or the FCA confirmed any listing intent. The timing of the reported IPO discussions
              was immediately complicated by the FCA's October 2024 Final Notice imposing a £29.25m fine for inadequate
              financial crime screening controls operative between 2021 and 2023. Nils Pratley of The Guardian wrote
              that the bank was "simply not fit to float," a view widely shared in institutional investor circles. By
              May 2025, Starling reported its first annual profit decline — FY2025 pre-tax profit of £223m, down 25%
              year-on-year from an estimated £297m in FY2024 — driven partly by Bounce Back Loan losses and partly by
              early-stage NIM compression as the Bank of England reduced rates from their August 2024 peak of 5.25%. As
              of run date June 2026, Starling Bank Limited remains a private limited company per Companies House (number
              09092149); no listing prospectus or intention to float has been publicly filed. The IPO window is
              therefore open but contingent on regulatory rehabilitation, profit recovery, and broader market conditions
              for UK fintech listings. Chrysalis Investments Limited, a listed investment trust that holds a stake in
              Starling, provides some investor-facing commentary but its website gates all substantive NAV data behind a
              UK-investor access disclaimer, making independent verification of the holding mark unavailable in public
              sources.
