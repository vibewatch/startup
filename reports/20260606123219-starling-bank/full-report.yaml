      - number: '4.6'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Starling Bank's financial trajectory — from zero to £452.8m revenue in seven years with four consecutive
              profitable years — is among the most impressive achieved by any European digital bank at comparable scale.
              The FY2025 profit of £223m, even after a 25% YoY decline, would represent strong absolute profitability
              for a UK challenger bank.

              However, significant diligence blockers remain. First, the FCA fine represents a concluded regulatory
              enforcement action but does not preclude further regulatory scrutiny; the VREQ was only closed in April
              2024 and the Economic Crime Enhancement Plan runs through 2025. Second, the BBL credit loss suggests asset
              quality risk in the lending book that requires further investigation. Third, the structural NIM
              compression risk as UK base rates decline from 5.25% will disproportionately affect Starling compared to
              traditional banks that match-fund liabilities more tightly.

              Fourth, the IPO pathway — which was contemplated at ~£4bn valuation per Bloomberg/ Reuters reporting in
              August 2024 — was explicitly criticised by Guardian columnist Nils Pratley (October 2024) as premature
              given the FCA fine timing. The subsequent CEO change (Raman Bhatia stepping down, per Finextra, 2025) adds
              governance uncertainty.

              The filed annual accounts for FY2025 (Companies House, 226 pages) and FY2024 (235 pages) represent the
              primary evidence base that would resolve material gaps in deposit size, loan book composition, capital
              ratios, NIM, and CIR. These documents were not directly accessible during this review and remain the
              primary diligence ask.
