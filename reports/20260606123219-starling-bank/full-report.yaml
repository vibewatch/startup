      - number: '7.5'
        title: Governance, Leadership, IPO Timing and Investor Risk
        blocks:
          - type: paragraph
            body: >
              Starling's governance risk crystallised in mid-2023 when founder and CEO Anne Boden resigned, removing the
              individual who had led the bank's product vision, regulatory relationships, and fundraising strategy since
              inception. The successor CEO's identity, background, and track record in regulated banking were not
              confirmed in sources reviewed during this research, representing a material diligence gap. The bank's
              governance response to the FCA enforcement—authorising a fivefold bonus payout of approximately £24.6m in
              June 2025 despite the fine and falling profits—drew adverse commentary and raises questions about whether
              the board has fully internalised the cultural remediation the FCA expects. The Guardian's October 2024
              editorial that Starling is "simply not fit to float" captures the dominant market view: the FCA
              enforcement history must be substantially resolved before an IPO is viable. Finextra and Fintech Futures
              reported in August 2024 that Starling was considering an IPO at a £4bn valuation; no IPO has occurred as
              of June 2026, implying at least 18 months of slippage. Chrysalis Investments, a listed investment trust
              with significant exposure, faces secondary-market pricing pressure; extended IPO delay prolongs the
              marked-to-model duration of this position and may create shareholder pressure that complicates Starling's
              strategic optionality. The combination of FCA enforcement, management transition, bonus controversy, and
              unresolved IPO timing creates a governance risk profile materially above average for a UK bank of
              Starling's scale. Thesis-break triggers in this category include: any second FCA enforcement action,
              disclosure of a material data breach, departure of the current CEO within 12 months, or another
              significant profit decline. Starling's near-total UK revenue concentration also means there is no
              international earnings buffer against a UK-specific shock.
