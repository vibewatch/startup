      - number: '2.5'
        title: Adoption Drivers
        blocks:
          - type: paragraph
            body: >
              Several structural forces are converting digital-banking awareness into primary-account adoption. First,
              mobile-first consumer expectations have shifted decisively: 75 % of UK adults now use mobile banking, up
              from 60 % in 2023. Branch closures have accelerated this—11 % of new digital bank openers cited branch
              closures as a trigger, per the Finder 2026 survey, a figure that reflects the ongoing rationalisation of
              the incumbent branch networks. Second, the UK's open-banking regime provides an uncommonly rich
              data-portability infrastructure; Open Banking Limited describes the UK as having the world's leading
              open-banking standard, now serving 13 million active users. This infrastructure lowers switching friction
              and enables third-party personal financial management tools to drive awareness of better-value
              alternatives. Third, the interest rate cycle from 2022 onward made deposit rates a live competitive
              variable: the FCA's Consumer Duty (effective July 2023) obliges firms to deliver fair outcomes for retail
              customers, and together with heightened regulator scrutiny of savings rate pass-through, this has kept
              deposit rates visible and contested. Fourth, the Making Tax Digital mandate creates a recurring,
              government-driven forcing function for SME digital banking adoption through 2026–2028. Fifth, Europe
              dominated the global neobanking market with a 28.54 % revenue share in 2025, indicating that UK challenger
              expansion benefits from comparable market tailwinds across the continent—though Engine is the more direct
              beneficiary of cross-border growth.
            claimRefs:
              - CM031
              - CM032
              - CM033
