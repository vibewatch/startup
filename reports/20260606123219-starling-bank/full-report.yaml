      - number: '3.3'
        title: Adjacent, Substitute, and BaaS Competitors
        blocks:
          - type: paragraph
            body: >-
              Wise is the leading adjacent and substitute competitor for Starling's international banking capability.
              More than 700,000 global businesses use Wise Business to move and spend £12 billion monthly, with 70% of
              transfers arriving in under 20 seconds and 95% within 24 hours (Q3 2025 data). Wise is a payment
              institution—not a full-service bank—but its multi-currency accounts, physical and virtual team cards, and
              accounting integrations replicate the core overseas-payment and FX use cases that draw internationally
              active customers to Starling's global debit and business accounts. OakNorth, founded in 2015 for
              entrepreneur-led lending, has deployed billions across commercial real estate, C&I, and fund finance but
              has shifted strategic emphasis to the US market, materially reducing its competitive relevance to
              Starling's UK SME everyday banking segment. The status quo—legacy banks and incumbent branch-based
              processes—remains the dominant substitute for UK SME customers who have not yet switched, and
              incentive-driven CASS switching campaigns from NatWest reinforce that incumbents are fighting to reclaim
              market share. Starling's Engine by Starling platform competes in the BaaS and core-banking-as-a- service
              market against Thought Machine, Mambu, and 10x Banking. Engine has powered Starling's own cloud-native
              operations since 2016 and lists Salt Bank in Romania as a live bank client. No peer UK neobank—Monzo or
              Revolut—has licensed its core banking technology to third parties, making Engine a structural
              differentiator. Starling's Banking Services division also provides indirect Faster Payments rail access
              through 100% API-based, cloud-native infrastructure at zero downtime, positioning Starling as the first UK
              bank to offer Faster Payment access via APIs.
