  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Competitive Context
        blocks:
          - type: paragraph
            body: >
              Starling's addressable universe spans three distinct, partially overlapping segments. The primary segment
              is UK personal current-account banking, where roughly 55 million adults hold one or more bank accounts and
              the status-quo alternative is a legacy high-street bank or building society. The second segment is UK SME
              banking, encompassing the approximately 5.5 million businesses that require a business current account for
              payments, cash management, lending, and integrated accounting. The third segment is core banking
              infrastructure, where Engine by Starling competes for licensed-bank technology transformation contracts
              globally, displacing incumbent core-banking vendors (Temenos, Finastra, Oracle FLEXCUBE). Excluded from
              each boundary: investment banking, brokerage, insurance underwriting, and cross-border remittance as a
              primary product. The 2016 CMA retail banking investigation established that incumbent UK banks did not
              compete hard enough for customers and that challengers faced barriers to growth— a finding that has shaped
              the entire open-banking regulatory apparatus under which Starling operates. Open Banking Limited, the
              CMA-mandated implementation entity, now reports thirteen million active users of open-banking-powered
              tools in the UK, signalling that the regulatory architecture is delivering measurable ecosystem effects.
              For consumer banking, status-quo substitutes include remaining with a legacy current account, using a
              payments app as a secondary account, or relying on a credit union. For Engine, the primary substitute is a
              multi-year legacy core replacement programme from an established vendor or in-house build—both
              historically slow, expensive, and failure-prone.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
