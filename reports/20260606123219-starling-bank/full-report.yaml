      - number: '1.5'
        title: Milestone Chronology and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Starling Bank's history from 2014 to the present covers founding, financing, product launches, regulatory
              engagement, leadership transitions, and adverse events. The most material adverse event in the company's
              public history is the FCA Final Notice issued on 1 October 2024, which imposed a financial penalty of
              £28,959,426 for failures in financial crime controls. These failures had two components: (1) Starling
              opened 54,359 accounts for 49,183 high or higher-risk customers in breach of a Voluntary Requirement
              (VREQ) imposed by the FCA in September 2021 as part of a broader anti-money-laundering enhancement plan;
              and (2) since 2017, Starling's automated sanctions screening had only been checking customers against a
              fraction of the names on the HM Treasury Consolidated List (due to a system misconfiguration affecting
              customers not identified as having UK citizenship or residency). The original penalty before discount was
              £40,959,426; Starling received a 30% reduction for early settlement.

              The FCA enforcement record, combined with the CEO transition in mid-2024, IPO speculation, and falling
              FY2025 profits, means the period 2023-2025 was materially more complex than Starling's earlier growth
              story. The bank's FY2025 profit of £223M still represents its fourth consecutive year of profitability
              (FY2022 was the first profitable year), but the 25% year-on-year decline and the Bounce Back Loan losses
              inject uncertainty into the prior trajectory of rapid profit growth.

              Despite the FCA action, the bank continued operating with no suspension of its banking licence, launched
              new products (agentic AI in March 2026, AI anti-scam tool in October 2025), and maintained its regulatory
              authorisation. The FCA notice confirms the sanctions screening misconfiguration was identified by Starling
              itself in January 2023 and remediated, with third-party testing confirming effectiveness by the end of the
              relevant period.
            claimRefs:
              - CO034
