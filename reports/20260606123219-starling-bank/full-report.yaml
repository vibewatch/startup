      - number: '4.5'
        title: Cost Structure, Operational Efficiency, and Personnel Costs
        blocks:
          - type: paragraph
            body: >
              Starling operates with a branchless, digital-native model across four offices (London, Cardiff,
              Southampton, Manchester) with "a team of thousands" according to the about page (exact headcount not
              publicly disclosed for FY2025). The careers page indicates global recruitment from these four primary UK
              sites, with the engineering function central to product delivery. The cost-to-income ratio (CIR) was not
              extractable from publicly accessible sources during this review.

              The bank incurred £24.6m in staff bonuses in FY2025 — a fivefold increase above normalised levels, per
              Guardian reporting. This is exceptional and likely reflects a management decision to sustain talent
              retention in a year of regulatory headwinds, funded from what management deemed a strong underlying
              trading result. The FCA fine of £28.9m and ~£28m of BBL credit provisions represent approximately £57m of
              one-off costs in FY2025 that, if stripped out, would imply an underlying pre-tax profit closer to ~£280m.

              The cumulative revenue from December 2019 to November 2023 of £1.119bn against which the FCA calculated
              the Level 4 fine implies a four-year cost base that must have been well below that level given the
              reported profitability in FY2022–FY2023. However, operating leverage metrics (gross margin,
              cost-per-account, technology unit cost) require the filed accounts to quantify.

              Financial crime compliance is now a material permanent cost centre. The bank stated in its VREQ
              remediation that it had "significantly increased its financial crime compliance resource" and was
              operating an Economic Crime Enhancement Plan (2023–2025). This spend is incremental to ongoing baseline
              regulatory compliance and will partially offset any NIM-driven revenue growth in FY2026.
            claimRefs:
              - CI032
              - CI033
              - CI034
