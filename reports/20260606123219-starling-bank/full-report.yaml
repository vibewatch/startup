      - number: '8.3'
        title: Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis for Starling must anchor on verifiable earnings and multiple assumptions rather than on
              revenue projections that have not been independently audited. The three-case framework is built from the
              FY2025 pre-tax profit of £223m (confirmed by The Guardian, Finextra, and multiple news sources citing the
              company's announcement) and the FY2024 estimate of approximately £297m derived from the reported 25%
              year-on-year decline. The base case assumes a modest FY2026 profit recovery to £240–260m, reflecting
              partial NIM stabilisation as the BoE rate-cut cycle plateaus and Bounce Back Loan provisioning normalises.
              At a 14–16x earnings multiple (consistent with a UK-listed profitable neobank commanding a premium to
              legacy banks but a discount to high-growth international peers), the implied valuation is £3.4–4.2bn. This
              range straddles the reported £4bn IPO target, suggesting the IPO price is achievable at the top of the
              base case range but only if profit recovery is confirmed and no further regulatory actions emerge. The
              bull case adds an Engine licensing premium: if Engine revenues scale to £100–150m in disclosed ARR by IPO,
              a blended bank/SaaS multiple might justify a £5.5–7bn range; this requires disclosures that do not
              currently exist in public filings. The bear case captures a scenario where a second FCA enforcement
              action, sustained NIM compression from further rate cuts, or a third year of profit decline keeps earnings
              at £180–200m; at a 10–12x multiple, the implied valuation is £1.8–2.4bn, which would represent a
              down-round relative to the 2022 Series D basis and likely force a distressed IPO or further private
              capital. The key sensitivity is the earnings multiple, which is itself driven primarily by the regulatory
              narrative and the BoE base rate trajectory. A one-turn reduction in P/E (from 15x to 14x) changes implied
              valuation by approximately £223m on FY2025 earnings — significant but not catastrophic; the real risk is a
              structural de-rating if the AML pattern recurs.
