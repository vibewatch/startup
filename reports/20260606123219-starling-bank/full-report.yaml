  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Threat Actor
      - Severity
      - Mitigation or Diligence Ask
    rows:
      - - Zero-fee personal and business banking creates price loyalty
        - Monzo (free tier + paid premium); Tide (free SME)
        - High
        - >-
          Fee-free is replicable; Starling needs product breadth and data depth as the real moat, not price alone.
          Assess primary banking retention rate.
      - - Full banking licence (PRA/FCA FRN 730166) vs e-money peers
        - Tide (e-money via ClearBank); Wise (payment institution)
        - Low–Medium
        - >-
          Advantage may narrow as ClearBank's bank-grade FSCS (£120K) already exceeds Starling's £85K standard; but
          lending and overdraft capability remain differentiators.
      - - API-first Faster Payments access (first UK bank)
        - Chase UK (JPMorgan tech scale); NatWest, Barclays (API investment)
        - Medium
        - >-
          Technical first-mover advantage is eroding as incumbents modernise; Starling's advantage lies in zero-legacy
          architecture speed, not exclusivity.
      - - 4M+ account base with integrated accounting and invoicing data lock-in
        - Revolut (75M+ global; multi-tool); Monzo (expanding SME)
        - High
        - >-
          Multi-homing common; assess share of customers using Starling as primary bank vs. secondary account.
          Accounting integration is the strongest SME retention mechanism.
      - - Engine by Starling BaaS platform as B2B revenue and moat
        - Mambu, Thought Machine, 10x Banking (specialist BaaS)
        - Medium
        - >-
          Only one live external BaaS client (Salt Bank) publicly confirmed; pipeline depth is opaque. Client
          diversification is key to moat durability. Assess pricing vs. Mambu/Thought Machine.
      - - Profitable operations (per annual reporting)
        - Chase UK (JPMorgan capital; can sustain loss-making cashback offers)
        - High
        - >-
          Chase UK's 2% cashback offer, backed by unlimited JPMorgan capital, can attract Starling's retail deposit base
          without needing to be profitable; Starling cannot price-match indefinitely.
      - - SME business banking specialisation and 450K+ business customers
        - NatWest Mettle (FreeAgent); HSBC (no-fee SME); Monzo Business
        - Medium
        - >-
          Incumbent sub-brands closing the gap on bookkeeping and accounting integrations; Starling must continue to
          deepen lending, FX, and multi-entity business tools.
      - - Branchless model = lower structural cost base
        - Metro Bank (physical-branch challenger model; 2023 rescue)
        - Low
        - >-
          Metro Bank's 2023 near-collapse confirms physical-branch challenger economics are difficult; branchless model
          is validated, but operational leverage must translate to product investment.
    notes: >-
      Severity ratings are analytical assessments based on publicly available evidence as of June 2026. Moat durability
      assessments are indicative; definitive judgments require access to internal retention data, Engine pipeline, and
      unit economics.
