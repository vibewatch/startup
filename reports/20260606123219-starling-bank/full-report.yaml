  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for Starling
      - Diligence Ask
    rows:
      - - Mobile-first consumer expectations
        - Tailwind
        - Current / ongoing
        - Structural advantage for digital-only banks; 75 % of UK adults use mobile banking
        - Track mobile banking penetration rate annually; confirm Starling app rating vs. incumbents
      - - Open banking regime (CMA mandate)
        - Tailwind
        - Current / ongoing
        - 13M active open-banking users improve switching friction; enables data-driven products
        - Confirm OBL projected longevity of mandate; assess JROC timeline for future entity
      - - Branch closures by incumbents
        - Tailwind
        - Current / ongoing
        - 11 % of digital-bank adopters cited branch closures as trigger; drives underserved demand
        - Quantify geographic concentration of branch closures vs. Starling acquisition funnel
      - - Making Tax Digital (MTD) mandate
        - Tailwind
        - 'Near-term: April 2026 for £50K+ sole traders; 2027 for £30K+; 2028 for £20K+'
        - Phased SME demand forcing function for integrated digital banking + accounting
        - Track Starling Accounting adoption rate among new SME customers in each MTD tranche
      - - FCA Consumer Duty (effective July 2023)
        - Mixed
        - Current / ongoing
        - Raises bar for all retail banks; challengers can position as inherently compliant by design
        - Assess FCA enforcement actions specific to savings rate pass-through vs. challenger positioning
      - - Switching inertia (avg. 6 years since last switch)
        - Headwind
        - Persistent / structural
        - Caps market-share velocity; secondary-account growth faster than primary account displacement
        - Measure what share of Starling personal accounts are primary vs. secondary accounts
      - - Incumbent digital investment and switching bonuses
        - Headwind
        - Current / intensifying
        - NatWest £200, HSBC £500 bonuses in 2026 signal incumbents actively defending market share
        - Monitor incumbent switching bonus values and digital product feature parity over time
      - - NIM compression in a falling rate cycle
        - Headwind
        - Cyclical; dependent on Bank Rate path
        - Digital challengers built NIM advantage during 2022–2024 high-rate cycle; rate cuts reduce deposit spread
        - Stress-test Starling's NII sensitivity to 100 bp and 200 bp rate cuts; compare to incumbent NIM profiles
      - - Regulatory capital requirements (CCyB at 2 %)
        - Headwind / Constraint
        - Structural; FPC-managed
        - Capital intensity limits lending product expansion; maintains incumbents' lending scale advantage
        - Confirm Starling's CET1 ratio trajectory and capital plan as reported in FY2025 annual accounts
      - - Geopolitical risk and macro uncertainty
        - Headwind
        - Near-term / uncertain
        - BoE FSR July 2025 highlights elevated geopolitical and trade-policy risk affecting UK financial stability
        - Monitor BoE FPC statements; assess Starling liquidity buffer vs. deposit volatility scenarios
    notes: >
      Direction is assessed from Starling's perspective. Timing is qualitative; no claim that any specific event will
