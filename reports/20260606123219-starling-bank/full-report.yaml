      - number: '6.2'
        title: Adoption Trajectory and Customer Acquisition
        blocks:
          - type: paragraph
            body: >-
              The FCA's 2024 Final Notice provides the most authoritative independent data point on Starling's customer
              growth, confirming that the bank's customer base increased from approximately 43,000 accounts at launch to
              approximately 3.6 million by FY2023 (year ended March 2023), while revenue grew to £452.8 million over the
              same period. The FCA characterised this as "exponential growth between 2016 and 2023," making it one of
              the fastest-growing retail banking customer bases in the UK. By mid-2026, the about page discloses over
              four million accounts — a further step-up from the FCA-confirmed 3.6 million in 2023.

              Starling's core acquisition model is app-first and fee-free. Personal current accounts carry no monthly
              fee, no foreign transaction fees, and require only a short video ID and document upload to open, typically
              completed within minutes. The Current Account Switch Service (CASS) enables frictionless switching from
              legacy banks. A referral programme awarded National Trust day passes to referrers; that scheme has since
              ended, suggesting it was a temporary boost rather than a structural acquisition channel.

              For SME customers, Starling operates a dedicated accountant referral partnership programme, providing
              accountants with personalised application links, QR codes, a resources pack, and a dedicated account
              contact. Business accounts are available to limited companies, limited liability partnerships, and
              start-ups with no monthly fee. Integration with leading accounting software packages is a key value
              proposition. Starling also operates an open marketplace (Marketplace) offering third-party services for
              insurance, pensions, mortgage brokerage, and investments, which increases customer engagement and deepens
              the financial services relationship beyond a single current account.
