      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - AML / regulatory recurrence
        - FCA supervisory correspondence; new enforcement notice; Skilled Person re-appointment
        - Any new FCA enforcement action or material breach of ECEA successor commitments
        - Immediate thesis break; halt any incremental capital deployment
      - - NIM compression / profit erosion
        - Bank Rate MPC decisions; Starling interim and annual profit announcements
        - Pre-tax profit decline greater than 30% YoY or NIM falling below 2% (if disclosed)
        - Re-assess valuation; materially reduce growth assumptions; widen risk premium
      - - BBL / credit loss escalation
        - Annual report BBL impairment charges; management credit-quality commentary
        - BBL/CBILS impairment greater than £50m in any single year
        - Capital adequacy review; increase risk premium on equity; probe PRA buffer headroom
      - - Engine commercialisation failure
        - Named client go-live status; Engine revenue disclosure if IPO prospectus filed
        - No new Engine client signed within 18 months or named client publicly exits
        - Downgrade Engine to zero in sum-of-parts; reassess standalone Starling multiple
