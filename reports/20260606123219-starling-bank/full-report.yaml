            body: >-
              The October 2024 FCA fine for opening 54,359 accounts for 49,183 high or higher-risk customers in breach
              of the VREQ demonstrates that Starling's rapid customer acquisition rate outpaced its compliance controls.
              This is an adverse signal for investors evaluating customer quality, not just regulatory risk — the breach
              directly relates to the bank's ability to screen and manage its customer base as it scales.
