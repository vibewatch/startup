      - number: '1.3'
        title: Funding History, Valuation, and Investor Map
        blocks:
          - type: paragraph
            body: >-
              Starling Bank has raised capital through multiple private rounds. The last publicly confirmed equity
              financing was a £130M round completed in April 2022, which valued the company at approximately £2.5
              billion post-money. This round was widely reported in the financial press (Reuters, Bloomberg, Financial
              Times) and was led by Fidelity, with participation from Qatar Investment Authority (QIA), Goldman Sachs,
              RPMI Railpen, Millennium Management, and other existing investors. The round was Starling's largest single
              raise and established it as one of the UK's most valuable private fintech companies.

              Prior to the 2022 round, Starling had raised through a series of earlier tranches funded by Harry McPike
              (global private investor and early backer), Chrysalis Investments Ltd (formerly Merian Chrysalis, a listed
              investment trust), and others. Full documentation of the complete funding history and precise amounts
              raised per round was not available through publicly accessible sources in this research run, representing
              an evidence gap.

              As of the Starling About page, the investor roster includes: Harry McPike, Chrysalis Investments Ltd,
              Fidelity, Railpen (RPMI), Qatar Investment Authority, Millennium Management, and Goldman Sachs. The
              company describes itself as "part-owned by our founder Anne, employees and an employee benefits trust with
              investment from" these named investors. The Chrysalis Investments website acknowledges the investment in
              its publicly disclosed portfolio.

              In 2024, multiple media reports (Reuters, Bloomberg) cited Starling as targeting an IPO at an implied
              valuation of approximately £4 billion. This discussion coincided with the appointment of Raman Bhatia as
              CEO. However, the October 2024 FCA fine (£28.96M for financial crime control failures) prompted adverse
              commentary from financial columnists including the Guardian's Nils Pratley, who wrote a column headlined
              "Starling Bank is simply not fit to float." As of the run date of this report, no formal IPO prospectus
              has been filed and the current IPO timeline and target valuation are unresolved evidence gaps.
            claimRefs:
