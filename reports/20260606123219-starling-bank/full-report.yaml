      - number: '2.6'
        title: Constraints, Switching Inertia, and Adverse Dynamics
        blocks:
          - type: paragraph
            body: >
              Multiple structural constraints limit the pace of challenger penetration. Switching inertia is the most
              durable: the average UK adult last switched bank accounts six years ago per a Finder/Censuswide survey
              (September 2025, n = 2,000). Among those who have not opened a digital account and do not intend to, 50 %
              cite loyalty to their current bank as the primary barrier; 34 % prefer in-person or branch access; and 26
              % cite concerns about payment fraud or cybersecurity. These responses are consistent with academic
              literature on bank switching costs and trust anchors—and they underpin the relatively slow market-share
              gains by challengers relative to their rapid customer acquisition headline numbers, many of which reflect
              secondary or inactive accounts. Trust and FSCS awareness are related constraints: challenger banks with
              full licences (Starling, Monzo) have equivalent FSCS protection to incumbents, but consumer perception may
              lag. Regulatory capital intensity creates a durable moat against lower-capitalised challengers for the
              lending business: the Bank of England maintained its countercyclical capital buffer at the neutral 2 %
              setting in June 2024, and the July 2025 Financial Stability Report highlighted that UK bank resilience is
              strong but that geopolitical risk and global trade-policy uncertainty remain material. Net-interest margin
              compression is a cyclical risk as the rate cycle turns: challenger banks that built deposit-rate advantage
              in a rising-rate environment face NIM dilution if the Bank Rate falls materially. Finally, incumbents are
              not passive: Barclays has 12 million mobile-app users, NatWest offers £200 switching bonuses, and Chase UK
              entered the market in 2021 with competitive cashback offerings—illustrating that incumbents and new
              entrants alike are competing for the same digitally engaged customer.
            claimRefs:
              - CM037
              - CM038
              - CM039
