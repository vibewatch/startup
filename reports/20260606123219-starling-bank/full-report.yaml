        - >-
          IPO window closes for minimum 24 months; institutional investor demand collapses; valuation re-rates to bear
          case
        - Exit or strong pass on any new investment; seek full diligence on remediation plan
      - - NIM below 2.5%
        - BoE base rate sustained below 3% and Starling's lending deployment insufficient to offset
        - FY2026 profit drops toward £150–180m; P/E at £4bn valuation exceeds 22×; value destructive
        - Downgrade to avoid until margin recovery demonstrated
      - - Third year of profit decline
        - FY2026 pre-tax profit below £200m
        - Trend break from profitable growth narrative; questions sustainability of model
        - Reassess investment case; require management explanation of structural vs cyclical
      - - Series D anchor sell-down below £2.5bn implied
        - Chrysalis, Softbank, or QIA secondary sale at sub-£2.5bn implied price
        - Signals insider view that cost basis is not supportable; resets market anchor
        - Immediate reassessment; likely exit any open position
