  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Scale
        blocks:
          - type: paragraph
            body: >-
              Starling Bank serves customers across four primary retail account types — personal current accounts,
              business bank accounts, joint accounts, and multi-currency accounts — plus the Kite debit card for
              children aged 6 to 15 linked to a parent's personal or joint account. As of mid-2026, the About page
              discloses "over four million accounts," while the personal current account page states "join over 3.5
              million customers," indicating that personal account holders constitute the large majority of the total
              account base. The business bank account page separately confirms "450,000+ businesses bank with Starling,"
              representing approximately 11% of total accounts.

              Starling operates exclusively in the UK for retail customers. There are no international branches, no
              retail banking partnerships outside the UK, and no separately reported international retail customer
              count. The bank positions itself as branchless and app-first, with 24/7 UK-based human support via in-app
              chat and telephone. All eligible deposits are protected by the Financial Services Compensation Scheme
              (FSCS) up to £120,000 per depositor, covering both personal and business account holders.

              Beyond retail, Starling serves two B2B customer segments. Engine by Starling licences its core banking
              technology to digital banks globally — Salt Bank in Romania is a publicly named client — positioning
              Starling as a platform business with a revenue stream decoupled from UK-only retail concentration. The B2B
              Banking Services division provides indirect access to the Faster Payments System via API, serving
              fintechs, electronic money institutions, and payment service providers in the UK, making Starling the
              first UK bank to offer Faster Payments access through a RESTful API interface. Neither the Engine customer
              count nor the B2B Banking Services revenue is publicly disclosed.
