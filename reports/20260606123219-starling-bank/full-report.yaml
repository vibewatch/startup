      - number: '7.2'
        title: Financial Model Risk — NIM Compression, BBL Losses, Capital and Credit
        blocks:
          - type: paragraph
            body: >
              Starling's revenue model is heavily weighted toward net interest income, making it acutely sensitive to
              changes in the UK Bank Rate and the spread between what depositors receive and what borrowers pay. As of
              the April 2026 MPC decision, Bank Rate stands at 3.75%, held against a backdrop of Middle East
              energy-price pressure and inflation at 2.8%; the next decision is due 18 June 2026. Having peaked at 5.25%
              in mid-2023, rates have been cut and further cuts are plausible if inflation returns to target in H2 2026
              or 2027. Starling's retail current-account deposits pay little or no interest while loan and overdraft
              yields track the policy rate, meaning each cut squeezes NIM directly. FY2025 pre-tax profits fell
              approximately 25% to around £223m, and the CEO publicly admitted that weak internal controls caused
              approximately £28m of BBL losses—an unusual admission that simultaneously flags credit quality failure and
              the residual remediation task. The UK government's 100% BBL guarantee means primary credit losses accrue
              to the public sector, but fraud-related losses or write-offs arising from admitted control failures fall
              squarely on Starling; the NAO documented over £36.9bn in BBL loans to 1.2m businesses, and the fraud tail
              is a multi-year exposure industry-wide. Capital adequacy is a latent risk: PRA minimum requirements under
              UK Basel III constrain Starling's ability to scale credit or acquire assets without capital issuance, and
              the specific Pillar 1 and Pillar 2A ratios and CET1 headroom are not publicly disclosed. The fivefold
              bonus payout of approximately £24.6m in June 2025—made despite the fine and a declining profit—signals a
              culture tension between capital conservation and retention incentives, which an institutional investor
              would need to scrutinise. Deposit runoff risk is partially mitigated by FSCS protection (£85,000 per
              depositor) but UK geographic concentration (essentially 100% UK) leaves no buffer against a UK-specific
              regulatory or macroeconomic shock.
