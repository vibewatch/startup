      - number: '3.4'
        title: Switching Costs, Lock-in, and Multi-homing
        blocks:
          - type: paragraph
            body: >-
              The UK retail banking market has structurally low switching friction: the Current Account Switch Service
              (CASS) enables account portability in seven working days, and NatWest's £200 cash incentive demonstrates
              that incumbents believe the marginal cost of winning a switch is competitive enough to subsidise direct
              payments. Finder's 2026 digital banking survey of UK adults found that the average Briton last switched
              their bank account six years ago, confirming that despite CASS, behavioural inertia remains high. This
              inertia benefits established incumbents disproportionately over younger neobanks that are still building
              primary-banking penetration. For Starling's business customers, switching costs are materially higher: the
              integration of Starling Accounting, free invoicing, tax Spaces, open banking API access, and direct Faster
              Payments rails creates a data and workflow lock-in that is absent from competitors who offer only basic
              current accounts. Tide's e-money model introduces a structural ceiling on its business customers' banking
              depth—the inability to access direct bank lending without ClearBank partnerships limits Tide's ability to
              create the same multi-product lock-in that a full banking licence enables. Multi-homing is pervasive:
              Finder's survey found 49% of UK adults had already opened a digital-only bank account by 2026 (up from 40%
              in 2025), yet incumbents retain primary banking relationships for the majority. Neobank users frequently
              hold both a legacy account and one or more challenger accounts for specific use cases (FX, budgeting,
              business), meaning the competitive battle is for share of wallet within multi-banked customers rather than
              exclusive primary-bank status.
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
