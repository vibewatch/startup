company:
  name: Starling Bank

chapter:
  number: 3
  title: Competitors
  summary: >-
    Starling Bank competes in a fragmented UK banking market against direct neobank peers
    (Monzo, Revolut, Chase UK), SME-focused challengers (Tide, Mettle), specialist digital
    lenders (Atom Bank, OakNorth), adjacent payment providers (Wise), and all four major
    incumbents. Starling's fullyfee-free business account, full PRA/FCA banking licence,
    API-first Faster Payments infrastructure, and the Engine BaaS platform are its primary
    structural differentiators; multi-homing behaviour and the replicability of the
    fee-free model represent the most material commoditization risks.

sections:
  - id: direct-neobank-peers
    title: Direct Neobank Peer Analysis
    body: >-
      Starling's closest direct competitors are the three other fully-app-based UK retail
      banks—Monzo, Revolut, and Chase UK—together with Atom Bank as a specialist digital
      lender. Monzo operates a tiered personal account range: a free current account
      earns 2.75% AER on Instant Access Savings Pots, while the flagship Max plan costs
      £17 per month and adds worldwide travel and phone insurance, a 3.25% AER savings
      rate, a Railcard, and a monthly cinema ticket. Monzo's June 2026 engineering blog
      reveals active development of an integrated mortgage product—a material expansion
      into territory where Starling currently has no offering—alongside deployment of
      large-language-model-based customer operations. Revolut obtained a full UK banking
      licence through Revolut Bank UK Ltd (FRN 981170), authorised by the PRA and
      regulated by the FCA and PRA, resolving years of regulatory uncertainty; it now
      offers multi-currency accounts across 25+ currencies, transfers to 150+ destinations,
      and Revolut Pay access to 75+ million global customers. Revolut Business integrates
      with Xero, Sage, QuickBooks, and 45+ other accounting tools, providing depth on the
      SME side that exceeds Starling's current integration breadth. Chase UK, operated by
      J.P. Morgan Europe Limited (FRN 124579, PRA/FCA authorised), differentiates on a
      2% cashback offer—up to £20 per month—on groceries, restaurants, transport, and
      EV charging, bundled with J.P. Morgan Personal Investing through the Chase app.
      Chase is currently a retail-only offering with no SME or business banking product,
      limiting direct overlap with Starling's 450,000+ business customer base. Atom Bank,
      the UK's first app-based digital bank (launched 2016 with FCA/PRA regulation), does
      not offer current accounts at all; its competitive surface is savings accounts,
      residential mortgages, and Growth Guarantee Scheme business loans, positioning it
      as a specialist challenger rather than a full-service Starling rival.
