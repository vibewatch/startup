  - id: incumbents-and-hybrid-challengers
    title: Incumbent Banks and Hybrid Challengers
    body: >-
      The four major UK retail incumbents—Barclays, HSBC, NatWest, and Lloyds—remain
      the dominant competitive reference points for Starling on both personal and SME
      banking. Barclays had 12 million customers banking through its mobile app, a scale
      that dwarfs any single UK neobank. NatWest actively incentivises CASS switching
      with a £200 cash bonus for new and eligible existing customers who had not held a
      NatWest account on 6 May 2026—a direct tactic to recapture customers lost to
      challengers. HSBC's Bank Account carries no monthly fee and offers a Global Money
      Account for multi-currency management, competing with Starling's zero-fee and
      international debit offering on cost alone. Lloyds, as part of Lloyds Banking Group
      alongside Halifax and Bank of Scotland, can cross-sell across brands in ways no
      standalone neobank can replicate. Metro Bank occupies a hybrid position: a
      challenger bank with physical stores across England and Wales, now strategically
      refocused on SME and commercial relationship banking under CEO Daniel Frumkin
      following its 2023 financial rescue. Tide, the leading UK SME e-money challenger,
      is authorised by the FCA as an electronic money institution (FRN 900843) and
      not as a bank—it provides accounts through a ClearBank (FRN 754568) banking
      infrastructure layer that delivers FSCS protection up to £120,000 per depositor.
      Tide offers free and paid monthly plans targeting SMEs, but its e-money model
      constrains its ability to extend direct lending or overdrafts without third-party
      partners. NatWest's Mettle sub-brand competes directly with Starling's business
      account: it targets sole traders and limited companies with up to two owners,
      integrates FreeAgent bookkeeping at no extra cost for active account holders, and
      as of a February 2026 independent survey of 1,200 customers across the 15 largest
      UK business current account providers, was experiencing high application demand.
