callouts:
  - calloutType: strength
    title: Engine by Starling Is the Only Active BaaS Licensing Operation Among UK Neobanks
    body: >-
      Neither Monzo nor Revolut has licensed its core banking technology to third-party
      financial institutions. Starling's Engine platform has been proven at the scale of
      Starling's own operations since 2016 and has Salt Bank (Romania) as a live external
      client. This creates a second, B2B revenue stream and a structural moat that is
      architecturally impossible for pure retail-facing neobanks to replicate without
      a multi-year engineering build.
    claimRefs:
      - CP024
      - CP036

  - calloutType: risk
    title: Multi-homing Limits Primary Banking Capture for All UK Neobanks
    body: >-
      Finder's 2026 UK survey found that 49% of British adults now hold a digital-only
      bank account—up from 40% in 2025—yet incumbent banks retain primary banking
      relationships for the majority. The average UK adult last switched their main bank
      six years ago. Most neobank accounts (including Starling) are secondary accounts
      used for specific use cases such as FX, budgeting tools, or business invoicing
      rather than as sole primary accounts. This multi-homing equilibrium caps the total
      addressable primary relationship market for Starling, Monzo, and Revolut alike and
      limits the deposit and lending cross-sell opportunity.
    claimRefs:
      - CP028
      - CP029
      - CP030

  - calloutType: risk
    title: Chase UK's JPMorgan Capital Provides a Loss-tolerant Cashback Competitor Starling Cannot Price Against
    body: >-
      Chase UK is operated by J.P. Morgan Europe Limited with effectively unlimited
      capital from JPMorgan Chase. Its 2% cashback offer on everyday retail spending—up
      to £20 per month—is economically unsustainable for a standalone neobank but trivial
      for JPMorgan. Starling operates on a fee-free, no-cashback model. If Chase UK
      expands into SME banking or increases cashback scope, Starling would face competitive
      pressure it cannot match without either raising fees (against its brand position)
      or accepting deposit outflow to Chase.
    claimRefs:
      - CP009
      - CP038
      - CP039

