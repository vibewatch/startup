callouts:
  - calloutType: recommendation
    title: "TRACK at Medium Confidence — Valuation Stretched"
    body: >-
      Starling is a fundamentally profitable UK neobank with genuine competitive strengths. The
      recommended stance is TRACK rather than BUY because the implied £4bn valuation (~17.9× FY2025
      earnings) embeds a recovery and regulatory clearance narrative that is not yet confirmed by
      public evidence. A conviction BUY would require a clean post-fine FCA record, profit
      recovery above £260m, and Engine revenue disclosure. Entry at £3.2–3.5bn would provide a
      more defensible margin of safety.
    claimRefs: [CV039, CV040, CV044, CV045]

  - calloutType: risk
    title: "AML Recurrence Is the Primary Thesis-Break Trigger"
    body: >-
      The October 2024 FCA enforcement action is the single most important risk in the investment
      thesis. It established a pattern of compliance-infrastructure-lag that is inconsistent with
      IPO readiness. If any further FCA enforcement action is announced — regardless of scale —
      the IPO window should be treated as closed for a minimum of 24 months, and the valuation
      will likely re-rate to the bear-case range (£1.8–2.4bn).
    claimRefs: [CV031, CV032, CV043]

  - calloutType: insight
    title: "Engine Licensing Changes the Valuation Framework — If Disclosed"
    body: >-
      Engine by Starling has the potential to add a significant SaaS premium to the enterprise
      valuation. Three confirmed licensees (ABN AMRO, AMP Bank, Salt Bank) validate the model.
      However, without disclosed ARR, contract terms, or segment revenues, any Engine premium
      cannot be included in the base case. At the point of IPO prospectus filing, Engine disclosures
      will be the most closely watched input for the valuation debate.
    claimRefs: [CV019, CV026, CV042]

  - calloutType: assumption
    title: "Key Assumption: FY2025 Pre-Tax Profit of £223m Is the Earnings Base"
    body: >-
      All scenario analysis and multiple calculations in this chapter use FY2025 pre-tax profit
      of £223m, as reported by multiple press sources citing Starling's annual results announcement.
      This figure has not been independently verified against the full 226-page Companies House
      annual accounts. Any material restatement would shift all implied multiples and valuations
      proportionally.
    claimRefs: [CV004, CV005, CV041]

