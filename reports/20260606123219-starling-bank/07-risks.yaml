company:
  name: Starling Bank

chapter:
  number: 7
  title: Risks
  summary: >
    Starling Bank carries elevated regulatory risk anchored by a £28.96m FCA fine (September
    2024) for systemic AML and financial-sanctions failures, with ongoing active supervision and
    a remediation plan that remains open as of June 2026. Financial model risk is rising as the
    UK rate cycle turns—Bank Rate is held at 3.75% with downward pressure building—and
    BBL credit losses acknowledged at £28m by the CEO add a multi-year credit tail; governance
    risk intensified after Anne Boden's 2023 departure and the IPO timeline has slipped at least
    18 months since the August 2024 £4bn contemplation, meaning investors including Chrysalis
    face an extended illiquidity period.

sections:
  - id: regulatory-enforcement-risk
    title: AML/KYC Enforcement and FCA Regulatory Risk
    body: >
      The most acute near-term risk is the regulatory overhang from the FCA's September 2024
      enforcement action and the unfinished rehabilitation of Starling's financial crime
      controls. The FCA Final Notice (27 September 2024) imposed a financial penalty of
      £28,959,426—reduced from £40,959,426 only by a 30% settlement discount—for breaching the
      Voluntary Requirement (VREQ) imposed on 17 September 2021 and for systemic failures in
      financial-sanctions screening. The VREQ prohibited Starling from opening accounts for high
      or higher-risk customers while it remediated its AML framework; despite this explicit
      prohibition, Starling opened 54,359 accounts for 49,183 such customers between December
      2019 and November 2023. Separately, Starling identified in January 2023 that its automated
      sanctions-screening system had, since 2017, been checking customer names against only a
      fraction of the UK Consolidated List—a systemic deficiency undetected for six years. A
      Starling internal audit from November 2018 had already flagged significant gaps in the
      financial crime framework but was not fully escalated to the Board, pointing to a deep
      governance failure that predated and enabled the later regulatory action. The FCA invoked
      section 166 of FSMA 2000 on 28 May 2021 to appoint a Skilled Person to test Starling's
      transaction monitoring and governance; the findings deepened the regulator's concerns and
      directly triggered the VREQ. The Economic Crime Enhancement Plan (2023–2025) is the current
      remediation vehicle, but FCA active supervision continues and completion sign-off is not
      publicly confirmed as of June 2026. The FCA's 2022 multi-firm challenger-bank review—covering
      six banks with 8 million+ customers—found sector-wide weaknesses including inadequate enhanced
      due diligence, failure to collect income and occupation data, and inconsistent alert management.
      Starling is no longer the only subject, but the regulator has flagged repeatedly that financial
      crime controls must scale with growth, a standard Starling historically failed to meet. Consumer
      Duty obligations (effective July 2023) and ICO-enforced UK GDPR requirements add further
      compliance layers; the ICO can fine up to £17.5m or 4% of global annual turnover for data
      breaches. PSR mandatory 50:50 APP-fraud reimbursement rules create a direct ongoing loss
      exposure for every eligible Faster Payments transaction.
    claimRefs:
