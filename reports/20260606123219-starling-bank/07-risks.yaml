  - id: engine-execution-risk
    title: "Engine Commercialisation and Strategic Execution Risk"
    body: >
      Engine by Starling—Starling's cloud-native core banking platform licensed to third-party
      banks—represents the largest long-term strategic upside but introduces a distinct
      execution risk category. Engine has secured a handful of publicly named clients: ABN AMRO
      (Netherlands), AMP Bank (Australia), and Salt Bank (Romania). The client roster is small
      in absolute terms; concentration in a narrow early-adopter set creates meaningful revenue
      and reputation risk at this stage of commercialisation. Core banking implementations are
      long-cycle, technically complex projects requiring deep integration with client systems,
      regulatory infrastructure, and operational processes; a material go-live delay or
      deployment failure at any of the named clients could undermine Engine's credibility in a
      market where incumbent vendors (Thought Machine, Mambu, Temenos, Finastra) compete for
      the same mandates. The IP ownership structure is also a potential constraint: Engine
      Limited (company No. 13925405) is a separate entity but depends on technology developed
      inside Starling Bank and continuously refined by its engineering team—a strategic pivot,
      regulatory restriction, or capital constraint at the bank level could disrupt the Engine
      development roadmap. Contract terms, contract duration, and client-specific revenue
      are not publicly disclosed, creating an evidence gap on the recurring-income quality of
      Engine revenues. The FCA fine and Starling's recent regulatory embarrassment may affect
      prospective bank clients' vendor due-diligence assessments. The 2025–2026 IPO delay also
      removes a near-term capital injection that could fund Engine's international expansion into
      larger markets.
