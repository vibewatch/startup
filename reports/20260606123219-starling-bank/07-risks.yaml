callouts:
  - calloutType: risk
    title: AML Remediation Is Not Formally Signed Off
    body: >
      The FCA fine is paid but Starling's Economic Crime Enhancement Plan runs to 2025 and
      active FCA supervision continues. Completion and sign-off documentation are not publicly
      available as of June 2026. A new financial crime incident before the plan receives formal
      regulatory sign-off could trigger a second enforcement action—at substantially higher
      penalty multiples and with IPO-blocking consequences. The FCA's track record with
      recidivist firms is well-established and the Skilled Person's findings were serious enough
      to trigger the VREQ in 2021; investors should treat this as an open regulatory position.
    claimRefs: [CR001, CR003, CR007, CR008]

  - calloutType: risk
    title: IPO Window Has Slipped Materially
    body: >
      Starling was reported to be considering an IPO at a £4bn valuation in August 2024. As of
      June 2026 no IPO has occurred—implying at least 18 months of slippage. The FCA
      enforcement, declining profits, bonus controversy, and unresolved regulatory rehabilitation
      collectively narrow the window further. For investors including Chrysalis, this extends the
      illiquidity duration and increases marked-to-model valuation risk.
    claimRefs: [CR037, CR038, CR039, CR043]

  - calloutType: risk
    title: Engine Client Concentration Carries Undisclosed Revenue Risk
    body: >
      Engine by Starling has three publicly named clients: ABN AMRO, AMP Bank, and Salt Bank.
      Contract terms, durations, and go-live status are not publicly disclosed. Until Engine
      reaches a diversified client base of 10 or more independent contracts, a single client
      departure or failed deployment would materially damage the Engine commercial thesis and
      disproportionately affect any sum-of-parts valuation applied to Starling.
    claimRefs: [CR026, CR027, CR028, CR029, CR030]

  - calloutType: assumption
    title: BBL Loss Quantum Is Based on Unaudited CEO Commentary
    body: >
      The £28m BBL loss figure is derived from CEO commentary reported in the press (Guardian,
      This Is Money) and has not been verified against audited FY2025 statutory accounts, which
      are not yet available. Actual crystallised and expected impairment charges may differ.
      Diligence should request the detailed credit-loss schedule and provisions methodology from
      the FY2025 annual report before relying on this figure.
    claimRefs: [CR015, CR020]

