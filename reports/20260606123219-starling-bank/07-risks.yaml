  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital adequacy
      missingEvidence: >
        Starling's Pillar 1 and Pillar 2A minimum capital requirements, its CET1 ratio, and
        headroom above PRA regulatory floors are not publicly disclosed; Pillar 3 disclosures
        may contain partial data but were not accessible during this review.
      whyItMatters: >
        Without capital ratio data it is impossible to assess how close Starling is to PRA
        minimum floors—which directly affects its ability to absorb BBL losses, expand credit,
        or raise an IPO at an attractive price.
      diligencePath: >
        Request current Pillar 3 disclosure from Starling investor relations; review most
        recent Companies House accounts filing; ask for the PRA ICG letter if accessible.
      relatedQuestionRefs: [QR013]

    - type: missing-source
      severity: material
      topic: BBL credit losses
      missingEvidence: >
        Audited FY2025 statutory accounts showing detailed BBL/CBILS impairment charges,
        provisioning methodology, remaining portfolio size, and fraud vs default split are
        not yet publicly available; the CEO's £28m figure is unaudited press commentary.
      whyItMatters: >
        Actual crystallised and expected losses could be materially higher than the CEO's
        comment suggests, affecting capital adequacy, the profit trajectory, and the PRA's
        supervisory stance.
      diligencePath: >
        Request FY2025 audited accounts and credit-loss schedule; cross-reference against
        NAO sector-level fraud data for BBL lender cohort; seek management credit-quality
        commentary in the annual report.
      relatedQuestionRefs: [QR011]

    - type: missing-source
      severity: material
      topic: leadership succession
      missingEvidence: >
        The specific identity, tenure start date, banking regulatory experience, and track
        record of the current Starling CEO (who succeeded Anne Boden in 2023) were not
        confirmed in publicly accessible sources reviewed during this research.
      whyItMatters: >
        Post-founder CEO quality is a primary governance risk factor; leadership instability
        or a poorly regarded succession materially affects both execution credibility and the
        FCA's confidence in management during the ongoing remediation period.
      diligencePath: >
        Review Starling press releases, Companies House director filings, LinkedIn profile,
        and industry coverage for current CEO appointment announcement and background.
      relatedQuestionRefs: [QR024]

    - type: private-evidence-only
      severity: material
      topic: Engine commercialisation
      missingEvidence: >
        Engine by Starling's contract values, contract duration, revenue recognised, and
        current go-live implementation status for each named client (ABN AMRO, AMP Bank,
        Salt Bank) are not publicly disclosed.
      whyItMatters: >
        Without revenue and go-live data it is impossible to determine whether Engine is a
        material or de minimis contributor to Starling's valuation, or whether the
        commercial thesis is tracking to plan.
      diligencePath: >
        Request Engine commercial terms in due diligence; conduct reference calls with ABN
        AMRO and AMP Bank product teams; review Engine Limited annual accounts at Companies
        House (No. 13925405).
      relatedQuestionRefs: [QR020, QR022, QR023]

    - type: missing-source
      severity: minor
      topic: FCA further enforcement
      missingEvidence: >
        No public evidence of further FCA, OFSI, or PRA enforcement actions against Starling
        beyond the September 2024 fine was identified during this review.
      whyItMatters: >
        A second enforcement action or unresolved OFSI inquiry would be a thesis-break event
        and directly prevent an IPO; confirming the absence of further proceedings is a
        required diligence step.
      diligencePath: >
        Search FCA final notices and warning notices register for post-October 2024 entries;
        check OFSI enforcement register; request management confirmation of outstanding
