            title: 主要尽调事项：获取已提交年度账户
            body: >
              FY2025 年度账户（Companies House，226 页）和 Pillar 3 披露（Starling
              投资者页面提及）是在形成财务观点前必须取得的主要信息项。包括总收入、NIM、存款基础、贷款账簿、CET1 资本比率和成本收入比在内的 12 项重要数据，没有这些文件就无法评估。账户已提交并在 Companies
