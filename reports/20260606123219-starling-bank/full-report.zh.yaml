              履历。创始人的个人品牌曾是关键营销资产（「英国历史上唯一由女性创立的银行」）。关键人物依赖已从一种风险形态（创始人集中）转向另一种风险形态（受 FCA 审视的受监管银行由未经验证的 CEO 掌舵）。
