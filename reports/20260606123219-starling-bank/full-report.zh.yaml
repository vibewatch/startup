      - number: '6.4'
        title: 扩张循环、集中度风险和客户经济性
        blocks:
          - type: paragraph
            body: >-
              Starling 的核心集中度风险是地理集中：全部零售客户基础仅在英国，收入、监管暴露和宏观风险都未分散。英国特定银行业冲击、重大不利监管行动，或 Bank of England 基准利率下行（自 2022
              年以来一直是净息差提升的主要驱动）都会比对国际多元化竞争者更不成比例地冲击 Starling。主要账户占比未公开披露——该行不报告把 Starling
              作为唯一或主要账户的客户比例。这让零售客户关系的耐久性和深度存在显著不透明。

              现有英国客户基础内的扩张驱动包括：账户类型的落地后扩张路径（个人 → 联名 → 企业 → Kite）、Marketplace 参与带来的第三方产品连接，以及会计师转介绍计划形成进入 450,000+
              企业账户分层的 B2B 获客循环。但 October 2024 £28.96 million FCA 罚款暴露，快速获客直接削弱了合规：Starling 违反 September 2021 施加的
              Voluntary Requirement，为 49,183 名高风险或更高风险客户开设了 54,359 个账户。这增加了声誉阴影，媒体评论已将其与计划 IPO 推迟联系起来。

              Engine by Starling 首页把 NPS 列为 “Starling Annual Report and Accounts 2025” 披露 KPI 之一，但公开来源无法取得具体 NPS
              值——只有已提交的 Companies House 账户（226 页）能确认。年度流失率、GRR 和 NRR 也未公开披露。FY2025 约 £28 million 的 Bounce Back Loan
              Scheme 损失——归因于该行自身薄弱控制——指向 COVID 贷款时期 SME 客户队列中的信用风险。
