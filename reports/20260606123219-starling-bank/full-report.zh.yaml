      - number: '8.3'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              Starling 的情景分析必须锚定可核验盈利和倍数假设，而不是未经独立审计的收入预测。三情景框架从 FY2025 税前利润 £223m 出发（由 The Guardian、Finextra
              以及多家新闻来源援引公司公告确认），再结合由已披露同比下降 25% 推导出的 FY2024 约 £297m 估计值。基准情景假设 FY2026 利润温和恢复至 £240–260m，反映 BoE
              降息周期进入平台期后，NIM 部分企稳，Bounce Back Loan 拨备正常化。在 14–16x 盈利倍数下（符合英国上市盈利 neobank
              相对传统银行有溢价、但相对高增长国际同行有折价的定位），隐含估值为 £3.4–4.2bn。这个区间横跨据报道的 £4bn IPO 目标，说明 IPO
              定价若落在基准情景高端可以实现，但前提是利润恢复得到确认，且不再出现新的监管行动。乐观情景加入 Engine 授权溢价：如果到 IPO 时 Engine 收入能放大到披露 ARR £100–150m，银行 /
              SaaS 混合倍数或可支撑 £5.5–7bn 区间；但这需要目前公开文件中尚不存在的披露。悲观情景覆盖另一种情况：第二次 FCA 执法、进一步降息带来的持续 NIM 压缩，或连续第三年利润下滑，将盈利压在
              £180–200m；按 10–12x 倍数，隐含估值为 £1.8–2.4bn，相比 2022 年 Series D 基准会成为下轮，且可能迫使公司以受压 IPO
              或更多私募资本续命。关键敏感项是盈利倍数，而盈利倍数主要由监管叙事和 BoE 基准利率路径驱动。P/E 每下降一圈（从 15x 到 14x），按 FY2025 盈利计算，隐含估值变化约
              £223m——影响显著但不致命；真正的风险是 AML 模式复发带来的结构性重估下调。
