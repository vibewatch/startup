      - number: '7.5'
        title: 治理、领导层、IPO 时间和投资者风险
        blocks:
          - type: paragraph
            body: >
              Starling 的治理风险在 mid-2023 具象化：创始人兼 CEO Anne Boden 辞职，离开了这位自创立以来主导产品愿景、监管关系和融资策略的人。后任 CEO
              的身份、背景和受监管银行履历，在本次研究审阅的来源中未得到确认，构成重要尽调缺口。董事会对 FCA 执法的治理回应——在罚款且利润下滑后，仍于 June 2025 批准约
              £24.6m、五倍于常态的奖金发放——引发负面评论，也让人质疑董事会是否真正内化 FCA 期待的文化整改。Guardian October 2024 社论称
              Starling“根本不适合上市”，概括了市场主流看法：FCA 执法历史必须基本解决，IPO 才可行。Finextra 和 Fintech Futures 在 August 2024 报道 Starling
              考虑以 £4bn 估值 IPO；截至 June 2026 仍未 IPO，意味着至少 18 个月 延误。Chrysalis Investments 是持有 Starling
              重大敞口的上市投资信托，面临二级市场定价压力；IPO 长期推迟拉长了该持仓的模型估值持有期，并可能制造股东压力，进而复杂化 Starling 的战略选项。FCA 执法、管理层交接、奖金争议和 IPO
              时间未决叠加，使 Starling 的治理风险画像显著高于同等规模英国银行平均水平。本类投资逻辑失效触发器包括：第二起 FCA 执法、披露重大数据泄露、现任 CEO 在 12 个月
              内离职，或再次显著利润下滑。Starling 几乎全部收入集中在英国，也意味着面对英国特定冲击时没有国际盈利缓冲。
