  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与历史增长轨迹
        blocks:
          - type: paragraph
            body: >
              Starling Bank 运营多收入流的英国银行业务，收入主要来自客户存款和贷款的净利息收入、非利息费用收入（透支、银行卡交换费、商业账户订阅），以及正在增长的 B2B 分部。该行持有 PRA 于 2016 年
              7 月 12 日授予的完整银行牌照（FCA/PRA FRN 730166），并同时受 FCA 和 PRA 监管。Companies House 将其归类为 SIC 64191（Banks）（公司编号
              09092149）。

              收入增长极其陡峭：从 FY2016 的 £13,000 增至 FY2023（截至 2023 年 3 月）£452.8m——七年增长约 34,800 倍。FCA 2024 年 9 月 Final Notice
              独立验证了 FY2023 £452.8m 收入，并计算 2019 年 12 月至 2023 年 11 月累计收入为 £1,119,042,195——确认了 2021
              年末以来利率上升后的一条陡峭增长曲线。公司报告截至 2026 年中拥有超过 4 million 个账户，并且到 FY2025 已连续四年盈利；Starling 已跑通多数挑战者银行同行尚未复制的规模化单位经济性。

              收入流包括：（i）个人活期账户（主要吸收存款，标准层免费，通过透支变现）；（ii）商业活期账户（付费订阅分层，每月 £7–£35，另收单笔交易费）；（iii）存放于 Bank of England
              的存款和贷款发放带来的净利息收入；（iv）Starling Marketplace 的 App 内第三方金融产品分发；以及（v）Engine by Starling（B2B SaaS 核心银行即服务平台）。B2B
              银行服务部门还向金融机构提供 FPS 间接接入和基于 API 的支付清算。截至本次审阅时，公开信息没有披露 B2B 与零售之间的拆分收入线。
