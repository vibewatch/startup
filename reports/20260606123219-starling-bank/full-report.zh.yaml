  - id: FI001
    title: Starling Bank 收入模型——从客户活动到收入桥
    type: flow
    layout: standard
    summary: |
      客户和机构活动如何转化为 Starling 的收入线：从吸引存款，到净利息收入和费用收入。
    data:
      nodes:
        - id: deposits
          label: 客户存款（个人 + 企业）
          description: |
            超过 4m 个账户沉淀资金；FSCS 保障下的零售 / SME 客群规模大。估计 £11–12bn（未从已提交账目确认）。
        - id: boe_reserves
          label: Bank of England 准备金 + 英国国债
          description: |
            大部分存款放在 BoE，按基准利率计息（FY2024 峰值 5.25%；FY2025 ~4.5%）。这是 NII 的主要驱动。
        - id: loan_book
          label: 贷款账簿（透支 + SME + BBL）
          description: |
            个人透支、企业定期贷款、Bounce Back Loans。FY2025 BBL 损失 ~£28m；总账簿规模未确认。
        - id: nii
          label: 净利息收入
          description: |
            存款成本（接近零）与资产收益率（BoE 利率 + 贷款利差）之间的利差。FY2023 已确认总收入 £452.8m；NII 占比最高。
        - id: fee_income
          label: 非利息费用收入
          description: |
            企业账户订阅、透支费、银行卡交换费、Marketplace 佣金。收入更经常性，对利率敏感度较低。
        - id: engine_rev
          label: Engine by Starling 授权收入
          description: |
            来自白标银行平台客户（如 Salt Bank）的 B2B SaaS 收入。分部收入未公开披露。
        - id: total_revenue
          label: 总收入（FY2023：£452.8m 已确认；FY2025 估计 ~£600–660m）
          description: |
            合并损益表收入线。FY2025 税前利润 £223m，已扣除 FCA 罚款、BBL 损失和提高后的奖金。
        - id: pretax_profit
          label: 税前利润（FY2025：£223m）
          description: |
            连续第四年盈利。FY2025 一次性费用：FCA 罚款 £28.9m、BBL 损失 ~£28m、奖金 £24.6m。
    approximationNotes: |
      存款基础和 NII 占比为估计；Engine 收入贡献未知。流程只反映从资金来源到收入的定性模型；余额未确认。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI009
  - id: FI002
    title: 单位经济桥——从账户到利润
    type: flow
    layout: standard
    summary: |
      定性流程展示单账户的成本与收入驱动因素，并说明未确认数字的近似口径。
    data:
      nodes:
        - id: account_acquisition
          label: 账户获取（>4m 个账户）
          description: |
            纯数字开户；相对分行银行，边际 CAC 低。没有分行网络成本。CAC 未公开披露。
        - id: deposit_per_acct
          label: 单账户存款（估计 ~£2,750–3,000）
          description: |
            按 £11bn 存款基础 / 4m 个账户估算，平均每账户存款约为该水平。个人活期账户均值可能低于企业账户。
        - id: revenue_per_acct
          label: 单账户收入（估计 ~£150–165/yr）
          description: |
            估算：FY2023 £452.8m 收入 / 3.6m 个账户 ≈ £126/account。FY2024 因利率上行而更高。
        - id: nii_spread
          label: NII 利差（政策利率减存款成本 ~0%）
          description: |
            零售存款成本接近零；BoE 准备金收益 = 基准利率。FY2024 准备金 NIM 峰值估计超过 4%。FY2025 在压缩。
        - id: compliance_cost
          label: 合规 / 监管成本
          description: |
            FCA 罚款后：Economic Crime Enhancement Plan、扩大金融犯罪团队。FCA 一次性罚款 £28.9m + 持续合规 opex 上升。
        - id: profit_per_acct
          label: 单账户税前利润（估计 £55–75）
          description: |
            FY2025：£223m / ~4m 个账户 ≈ £56/account。FY2024 更高。按这一规模看，在数字银行中居行业领先。
    approximationNotes: |
      所有单账户估计都由已确认总数和估计账户数计算得出。实际单位经济（CAC、LTV、单账户毛利率）需要管理账目或分部报告，公开渠道拿不到。
    claimRefs:
      - CI004
      - CI009
      - CI020
