      - number: '6.2'
        title: 采用轨迹和获客
        blocks:
          - type: paragraph
            body: >-
              FCA 2024 Final Notice 是关于 Starling 客户增长最权威的独立数据点，确认该行客户基础从上线时约 43,000 个账户增至 FY2023（截至 March 2023 的年度）约 360
              万个，同时收入在同期增至 £452.8 million。FCA 将其称为“2016 到 2023 年的指数级增长”，使其成为英国增长最快的零售银行客户基础之一。到 mid-2026，关于页面披露超过 400
              万个账户，较 FCA 确认的 2023 年 360 万进一步上台阶。

              Starling 核心获客模式是 App 优先和免手续费。个人活期账户无月费、无外币交易费，开户只需简短视频 ID 和文件上传，通常数分钟内完成。Current Account Switch
              Service（CASS）让用户可从传统银行无摩擦切换。转介绍计划向推荐人奖励 National Trust 一日通行证；该计划后来结束，说明它更像临时助推，而不是结构性获客渠道。

              对于 SME 客户，Starling
              运营专门的会计师转介绍合作计划，为会计师提供个性化申请链接、二维码、资源包和专属账户联系人。企业账户面向有限公司、有限责任合伙和初创公司，无月费。与主流会计软件包集成是关键价值主张。Starling 还运营开放
              Marketplace，为保险、养老金、抵押贷款经纪和投资提供第三方服务，提升客户参与度，并把金融服务关系从单一活期账户向外加深。
