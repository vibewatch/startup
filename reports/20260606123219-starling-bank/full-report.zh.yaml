      - number: '8.2'
        title: 可比公司组分析
        blocks:
          - type: paragraph
            body: >-
              给 Starling 拼可比公司并不简单：它同时是一家已盈利的零售和 SME 银行、一个刚起步的 B2B 软件供应商（Engine），又是一家没有经审计分部披露的私人公司。这里采用四组参照：（1）英国私人
              neobank——Monzo（尽管仍在亏损，2024 年 6 月最新标记估值为 £5bn）和 Revolut（2023 年老股交易中最新标记估值为 $33bn，之后其已盈利的 FY2023/FY2024
              业绩，以及 2024 年 7 月取得英国银行牌照，重置了估值叙事）；（2）英国上市 fintech——Wise plc（LSE:
              WISE），这家已盈利的跨境支付公司，是英国数字金融公司里最透明的盈利倍数基准；（3）全球 neobank 同行——Nubank（NYSE: NU），已盈利，交易在 20-30x
              盈利，并带有拉美增长溢价；（4）英国 challenger bank 的警示参照——Metro Bank，在合规和资本失误后于 2023 年 10
              月完成紧急再资本化，说明英国监管失灵会如何落到估值上。几组里，Wise 的分析价值最高：公司已盈利、总部在英国，收费驱动模型透明，并叠加净息差（NIM），且有公开报价。截至报告生成日，Wise 估计 P/S 为
              5–8x、P/E 为 20–30x（后者基于 Wise FY2025 收入和利润的分析师估计，本次审阅无法独立核验），为已盈利英国数字金融公司在公开市场上能撑住的估值给出一个合理上限。Monzo 在亏损阶段仍标记
              £5B，说明市场高度看重增长和用户轨迹；这也解释了为什么 Starling 规模相近但已经盈利的底盘，在盈利倍数上应有溢价，在增长倍数上则应打折。Revolut 的 $33B
              标记反映的是一个规模大得多、全球多元化、带有支付网络野心的业务，不能直接拿来比 Starling 这种集中在英国的零售 / SME 模型。Engine by Starling 的授权管线（ABN AMRO、AMP
              Bank Australia、Salt Bank Romania，由 Finextra 报道确认）提供了温和的 SaaS 可选性论据；但 Engine ARR 没有披露，不能纳入基准情景倍数，只能留给乐观情景。
