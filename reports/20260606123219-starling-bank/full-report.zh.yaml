      - number: '7.3'
        title: 运营、技术、网络安全和云依赖风险
        blocks:
          - type: paragraph
            body: >
              Starling 完全数字化、仅 App 的模式，把运营风险集中在狭窄技术栈和少数关键基础设施依赖上。作为 AWS 托管的云原生银行，任何持续 AWS
              中断或供应商层级事故都会同时扰动所有银行服务，且没有网点网络吸收部分故障。Starling 状态页记录，截至 June 2026 的 90 天窗口内所有核心服务 100%
              可用，说明近期稳定性强，但未披露事故不等于未来免疫。该行参与 Faster Payments、BACS、CHAPS、Direct Debits 和国际支付网络；这些系统中任何一个发生系统性中断，即便
              Starling 自身基础设施健康，也会损害核心功能。PSR 强制赔付政策下的 APP 欺诈责任——October 2023 生效，要求付款与收款机构 50:50 分担成本——会形成持续结构性损失流；2023
              年英国 APP 诈骗损失 £459.7m。Starling 移动优先、仅 App 的客户基础通过单一渠道完成所有金融活动，抬高诈骗暴露；欺诈指南页面承认复杂社会工程攻击，包括伪造 caller-ID 的欺诈。截至
              June 2026，未公开披露重大网络安全漏洞或数据事件，但该行 Privacy Notice 显示其广泛处理个人、金融、生物识别和交易数据——GDPR 足迹很大，也提高 ICO 执法暴露。共享
              Engine-by-Starling 代码库中的任何漏洞，都可能同时影响 Starling 及其持牌银行客户，形成非平台型同行不存在的复合声誉风险。
