        - 持续监测传统银行转户奖励金额和数字产品功能平价
      - - 利率下行周期中的 NIM 压缩
        - 逆风
        - 周期性；取决于 Bank Rate 路径
        - 数字挑战者在 2022–2024 高利率周期建立 NIM 优势；降息会压低存款利差
        - 压力测试 Starling NII 对 100 bp 和 200 bp 降息的敏感度；与传统银行 NIM 画像对比
      - - 监管资本要求（CCyB 为 2 %）
