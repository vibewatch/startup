      - number: '1.3'
        title: 融资历史、估值与投资人图谱
        blocks:
          - type: paragraph
            body: >-
              Starling Bank 通过多轮私募融资募集资本。最后一次公开确认的股权融资是 2022 年 4 月完成的 £130M 轮，投后估值约 £2.5
              billion。金融媒体广泛报道了该轮融资（Reuters、Bloomberg、Financial Times），由 Fidelity 领投，Qatar Investment
              Authority（QIA）、Goldman Sachs、RPMI Railpen、Millennium Management 和其他现有投资人参与。该轮是 Starling
              单笔最大融资，也让公司成为英国估值最高的私有 fintech 公司之一。

              2022 年融资之前，Starling 曾通过一系列较早批次融资，出资方包括 Harry McPike（全球私人投资人、早期支持者）、Chrysalis Investments Ltd（前 Merian
              Chrysalis，上市投资信托）等。本轮研究未能从公开可访问来源取得完整融资历史和每轮精确募资额；这构成证据缺口。

              按 Starling About 页面，投资人名单包括：Harry McPike、Chrysalis Investments Ltd、Fidelity、Railpen（RPMI）、Qatar Investment
              Authority、Millennium Management 和 Goldman Sachs。公司称自己「由创始人 Anne、员工和员工福利信托部分持有，并获得」上述投资人投资。Chrysalis
              Investments 网站在其公开披露的投资组合中确认了这笔投资。

              2024 年，多家媒体报道（Reuters、Bloomberg）称 Starling 目标以约 £4 billion 的隐含估值 IPO。讨论发生在 Raman Bhatia 获任 CEO 的同一时期。但
              2024 年 10 月 FCA 罚款（因金融犯罪控制失败罚款 £28.96M）引发金融专栏作者的负面评论，包括 Guardian 的 Nils Pratley 发表题为「Starling Bank
              根本不适合上市」的专栏。截至本报告运行日，公司尚未提交正式 IPO 招股说明书，当前 IPO 时间表和目标估值仍是未解决的证据缺口。
