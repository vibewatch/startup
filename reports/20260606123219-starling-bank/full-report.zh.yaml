      - number: '4.7'
        title: 展品
        blocks:
          - type: callout
            title: NIM 压缩是最大的未量化风险
            body: >
              Starling 在 FY2023–FY2024 的盈利，很大程度上来自大规模零售存款基础：存款成本接近零，却能赚取 Bank of England 基准利率。随着 BoE 基准利率从 5.25%（August
              2023–August 2024）降向 end-2025 估计 3.5–4%，且 Starling 存款基础估计为 £11–12bn，100bps 的降息可能使年度 NII 减少约
              £110–120m。完整影响取决于存款余额中留在 BoE 的比例、投放到贷款账簿的比例，以及贷款账簿本身的利率敏感性——没有已提交账户就无法取得这些数据。
            calloutType: risk
            claimRefs:
              - CI022
              - CI023
              - CI034
          - type: callout
            title: FCA 执法罚款和监管尾部风险
            body: >
              October 2024 FCA 因 AML / 制裁控制失灵（December 2019–November 2023）处以 £28,959,426
              罚款，这是英国挑战者银行遭遇的最大执法行动，也释放出结构性治理风险信号。尽管 VREQ 已在 April 2024 正式关闭，Economic Crime Enhancement Plan 持续到
              2025，FCA 2022 年对挑战者银行的多公司审查（最后更新于 December 2025）仍强调，监管机构继续主动审视这一行业。进一步执法或 PRA 资本附加要求是尾部风险。
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI015
              - CI016
          - type: callout
            title: 规模化后连续四年盈利
            body: >
              FY2025 实现 £223m 税前利润——连续第四年盈利——同时吸收 £57m 一次性费用（FCA 罚款 + BBL 损失），说明底层业务韧性很强。收入从 FY2023 的 £452.8m 增至 FY2025
              估计 £630–680m，证实 Starling 已跨过早期挑战者银行常见的单位经济性试验阶段。其完全数字化、无网点模式保留了相对传统银行的结构性成本优势。
            calloutType: strength
            claimRefs:
              - CI009
              - CI010
              - CI020
              - CI037
