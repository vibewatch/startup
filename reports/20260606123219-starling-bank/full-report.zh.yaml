      - number: '1.4'
        title: 规模、指标与产品版图
        blocks:
          - type: paragraph
            body: >-
              FCA Final Notice（2024 年 10 月）给出了 Starling 2024 年以前增长轨迹中最权威的第三方数据。通知称，Starling 收入从 2016 年的 £13,000 增至截至
              2023 年 3 月财年的 £452.8 million（FY2023），客户基数从 2017 年约 43,000 增至 2023 年约 3.6 million。这些数字由监管机构引用，是历史规模最强的公开证据。

              FY2024（截至 2024 年 3 月 31 日财年）的账目已于 2024 年 7 月 3 日提交 Companies
              House，但本轮研究未能从公开来源取回这些账目中的具体利润、收入和客户数据；这构成重大证据缺口。FY2025（截至 2025 年 3 月 31 日财年）方面，Guardian 主题页标题摘要称税前利润下降约
              25% 至 £223 million，其中 £28 million 损失来自政府 Bounce Back Loan Scheme。Engine by Starling 主页在自身案例研究中引用「Starling
              Annual report and accounts 2025」作为数据源，但具体数值无法以文本形式取得。

              从产品看，Starling 的核心产品包括：个人活期账户（2017 年 5 月推出）；联名账户；面向 16 岁以下儿童的 Kite 借记卡；商业活期账户（2018 年 3
              月推出，新闻室称其为「英国首个数字商业银行账户」）；Starling Marketplace（App 内与 PensionBee、Wealthsimple、Habito、Kasko 等第三方 fintech
              集成）；B2B 银行基础设施服务（首家通过 API 提供 Faster Payments 接入的英国银行）；以及 Engine by Starling（面向 Salt Bank 等第三方银行客户的 SaaS
              银行平台，Salt Bank 位于罗马尼亚）。

              2026 年 3 月，Starling 推出 Starling Assistant，这是一款基于 Google Gemini 和 Google Cloud 构建的智能体 AI
              金融助理，最初以选择加入方式向个人账户客户开放。该产品被列为自 2021–2022 年产品扩张浪潮以来该行最重要的技术进展之一。
