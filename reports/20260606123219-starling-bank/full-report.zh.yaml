      - number: '7.4'
        title: Engine 商业化和战略执行风险
        blocks:
          - type: paragraph
            body: >
              Engine by Starling 是 Starling 授权给第三方银行的云原生核心银行平台，代表最大长期战略上行，但也引入独立执行风险类别。Engine 已拿下一小批公开点名客户：ABN
              AMRO（荷兰）、AMP Bank（澳大利亚）和 Salt
              Bank（罗马尼亚）。客户名单绝对规模仍小；商业化当前阶段集中在狭窄早期采用者集合中，带来有意义的收入和声誉风险。核心银行实施周期长、技术复杂，需要与客户系统、监管基础设施和运营流程深度集成；任何已点名客户出现重大上线延迟或部署失败，都可能削弱
              Engine 在市场中的可信度，而既有供应商（Thought Machine、Mambu、Temenos、Finastra）正在争夺同类委托。IP 所有权结构也是潜在约束：Engine Limited（公司编号
              13925405）是独立实体，但依赖 Starling Bank 内部开发并由其工程团队持续打磨的技术——银行层面的战略转向、监管限制或资本约束都可能扰动 Engine
              开发路线图。合同条款、合同期限和客户特定收入未公开披露，造成 Engine 经常性收入质量的证据缺口。FCA 罚款和 Starling 近期监管尴尬，可能影响潜在银行客户的供应商尽调判断。2025–2026
              IPO 推迟也移除了短期资本注入，而这笔资金本可支持 Engine 向更大市场国际扩张。
