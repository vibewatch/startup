  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: AML/KYC 执法和 FCA 监管风险
        blocks:
          - type: paragraph
            body: >
              最急迫的短期风险，是 FCA 在 September 2024 执法行动留下的监管阴影，以及 Starling 金融犯罪控制尚未完成的修复。FCA Final Notice（27 September
              2024）处以 £28,959,426 罚款——仅因 30% 和解折扣从 £40,959,426 降低——原因是 Starling 违反 17 September 2021 施加的 Voluntary
              Requirement（VREQ），并在金融制裁筛查上存在系统性失灵。VREQ 禁止 Starling 在整改 AML 框架期间为高风险或更高风险客户开户；尽管禁令明确，Starling 在 December
              2019 至 November 2023 期间仍为 49,183 名此类客户开设 54,359 个账户。另一起问题是，Starling 在 January 2023 发现其自动制裁筛查系统自 2017
              年以来只将客户姓名与 UK Consolidated List 的一小部分比对——这是一个六年未被发现的系统性缺陷。Starling November 2018
              的内部审计早已标出金融犯罪框架中的重大缺口，但没有充分上报董事会，指向一个更深的治理失灵；这一问题早于后续监管行动，并为后续问题创造了条件。FCA 于 28 May 2021 根据 FSMA 2000 第 166
              条任命 Skilled Person，测试 Starling 的交易监控和治理；调查结果加深监管担忧，并直接触发 VREQ。Economic Crime Enhancement
              Plan（2023–2025）是当前整改载体，但 FCA 主动监管仍在继续，截至 June 2026，完成签字确认尚未公开。FCA 2022 年多公司挑战者银行审查覆盖 6 家银行、800 万+
              客户，发现全行业薄弱点，包括强化尽调不足、未收集收入和职业数据，以及告警管理不一致。Starling 已不再是唯一对象，但监管机构反复强调金融犯罪控制必须随增长扩容，而 Starling
              历史上未达到这一标准。Consumer Duty 义务（July 2023 生效）和 ICO 执法的 UK GDPR 要求又叠加了合规层；数据泄露时，ICO 最高可罚 £17.5m 或全球年度营业额 4%。PSR
              强制 50:50 APP 欺诈赔付规则，对每一笔合格 Faster Payments 交易都形成直接持续损失敞口。
