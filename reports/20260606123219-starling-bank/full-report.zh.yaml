    rows:
      - - Starling Bank（Series D 轮）
        - £2.5bn
        - 2022 年 4 月；£130m 一级融资
        - ~3.7× FY2022 估算收入（尚未规模化盈利）
        - 直接——确立机构成本基础
        - 2022 年轮次早于规模化盈利；数据已陈旧
      - - Starling Bank（IPO 讨论）
        - ~£4bn
        - 2024 年 8 月；Bloomberg/Reuters 报道；未提交招股书
        - ~17.9× FY2025 利润（£223m）；~5.9× FY2025 估算收入
        - 直接——已报道目标 IPO 价格；无约束性承诺
        - 记者援引的顾问讨论；无正式招股书；可能不反映当前看法
      - - Monzo Bank
        - £5bn
        - 2024 年 6 月；£190m 一级融资
        - 募资时仍亏损；隐含 P/S 约 5–8×（收入未披露）
        - 强可比——英国数字银行、账户基础相近；盈利能力落后于 Starling
        - Monzo 在募资日仍亏损；此后盈利情况无法从公开文件看清
      - - Revolut Ltd
        - $33bn
        - 2023 年员工股份二级出售；2024 年 7 月获英国银行牌照
        - 估算 P/S 8–12×（FY2023 账目显示 FY2023 收入约 $2.2bn）
        - 国际规模溢价；英国银行牌照提供新锚点
        - 全球多元化不适用；考虑宏观 / 利率变化，$33bn 标记可能已陈旧
      - - 'Wise plc（LSE: WISE）上市可比'
