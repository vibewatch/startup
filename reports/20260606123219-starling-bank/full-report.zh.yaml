        - 估算 P/S 5–8×；P/E 20–30×（分析师一致预期，未独立核验）
        - 最佳上市可比：盈利、总部在英国、费用 / NIM 混合、受监管
        - 跨境支付 ≠ 零售 / SME 银行；直接重叠有限
      - - 'Nubank（NYSE: NU）'
        - $30–50bn 区间（公开市场）
        - 持续交易；NYSE 上市；截至 2023 年已盈利
        - P/E 20–35×（高增长溢价；拉美市场）
        - 全球数字银行盈利先例；仅作盈利倍数参考
        - 拉美增长溢价不适用于英国市场
      - - Metro Bank PLC
        - 低于 £500m（资本重组后市值）
        - 2023 年 10 月紧急融资；合规与资本失灵
        - 相对账面价值大幅折价；谷底 P/B <0.5×
