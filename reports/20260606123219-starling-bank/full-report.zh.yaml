  - id: TP004
    title: 护城河持久性与竞争风险登记表
    columns:
      - 护城河主张
      - 威胁方
      - 严重性
      - 缓释措施或尽调问题
    rows:
      - - 个人与企业银行零费用，带来价格黏性
        - Monzo（免费档 + 付费高级档）；Tide（免费 SME）
        - 高
        - 零费用容易复制；Starling 真正的护城河应是产品宽度和数据深度，而不是单靠价格。需要评估主银行留存率。
      - - 完整银行牌照（PRA/FCA FRN 730166）相对电子货币同业
        - Tide（通过 ClearBank 提供电子货币）；Wise（支付机构）
        - 低–中
        - ClearBank 银行级 FSCS（£120K）已高于 Starling 的 £85K 标准，优势可能收窄；但贷款和透支能力仍是差异点。
      - - API 优先的 Faster Payments 接入（英国首家银行）
        - Chase UK（JPMorgan 技术规模）；NatWest、Barclays（API 投资）
        - 中
        - 存量银行现代化之后，技术先发优势在削弱；Starling 的优势在于无遗留架构带来的速度，而非独占性。
      - - 4M+ 账户基盘叠加会计和开票数据锁定
        - Revolut（全球 75M+；多工具）；Monzo（扩张 SME）
        - 高
        - 多平台开户很常见；需要评估把 Starling 当主银行而非副账户的客户占比。会计集成是最强的 SME 留存机制。
      - - Engine by Starling BaaS 平台作为 B2B 收入和护城河
        - Mambu、Thought Machine、10x Banking（专业 BaaS）
        - 中
        - 公开确认的外部 BaaS 在跑客户只有一个（Salt Bank）；管线深度不透明。客户多元化是护城河能否持久的关键。需评估定价相对 Mambu/Thought Machine 的位置。
      - - 盈利运营（按年报口径）
        - Chase UK（JPMorgan 资本；可承受亏损型返现）
        - 高
        - Chase UK 的 2% 返现背靠 JPMorgan 几乎无限的资本，不必盈利也能吸走 Starling 的零售存款基盘；Starling 无法无限期跟价。
      - - SME 企业银行专注度和 450K+ 企业客户
        - NatWest Mettle（FreeAgent）；HSBC（无费用 SME）；Monzo Business
        - 中
        - 传统银行子品牌正在补齐记账和会计集成差距；Starling 必须继续加深贷款、外汇和多实体企业工具。
      - - 无网点模式 = 更低结构性成本
        - Metro Bank（实体网点挑战者模式；2023 年纾困）
        - 低
        - Metro Bank 2023 年几近倒闭，印证实体网点挑战者的经济模型很难跑；无网点模式得到验证，但经营杠杆必须转化为产品投入。
    notes: 严重性评级是截至 2026 年 6 月基于公开证据的分析判断。护城河持久性评估仅为指示性；要下定论，需要访问内部留存数据、Engine 管线和单位经济。
