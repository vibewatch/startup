      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: Engine by Starling 是英国 Neobank 中唯一活跃的 BaaS 授权业务
            body: >-
              Monzo 和 Revolut 都没有把核心银行技术授权给第三方金融机构。Starling 的 Engine 平台自 2016 年起已在 Starling 自身运营规模上得到验证，并拥有 Salt
              Bank（罗马尼亚）这一在产外部客户。这创造了第二条 B2B 收入流，也形成结构性护城河；纯零售型 neobank 若没有多年工程建设，架构上无法复制。
            calloutType: strength
            claimRefs:
              - CP024
              - CP036
          - type: callout
            title: 多栖开户限制所有英国 Neobank 获取主银行关系
            body: >-
              Finder 2026 年英国调查发现，49% 的英国成年人现在持有纯数字银行账户——高于 2025 年的 40%——但传统银行仍保有多数主银行关系。英国成年人平均上一次更换主银行是在六年前。多数 neobank
              账户（包括 Starling）是副账户，用于外汇、预算工具或商业开票等特定用例，而不是唯一主账户。这种多栖均衡限制了 Starling、Monzo 和 Revolut
              的总可触达主关系市场，也限制了存款和贷款交叉销售机会。
            calloutType: risk
            claimRefs:
              - CP028
              - CP029
              - CP030
          - type: callout
            title: Chase UK 的 JPMorgan 资本让 Starling 面对可容忍亏损的 Cashback 竞争者
            body: >-
              Chase UK 由 J.P. Morgan Europe Limited 运营，实际上可获得 JPMorgan Chase 的无限资本。它在日常零售支出上提供 2% cashback——每月最高
              £20——对独立 neobank 来说经济上不可持续，但对 JPMorgan 微不足道。Starling 运营的是免手续费、无 cashback 模式。如果 Chase UK 扩展到 SME 银行，或提高
              cashback 覆盖范围，Starling 将面对一种无法匹配的竞争压力；否则只能提高费用（违背品牌定位），或接受存款流向 Chase。
            calloutType: risk
