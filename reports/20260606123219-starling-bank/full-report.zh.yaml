  - id: TI006
    title: 财务风险登记表
    columns:
      - 风险
      - 证据
      - 严重性
      - 缓释措施 / 状态
    rows:
      - - 英国基准利率下降导致 NIM 压缩
        - BoE 到 2025 年 6 月将基准利率从 5.25% 下调至 4.5%；预计还会继续降息
        - 重大
        - 建模收入敏感性：~£12bn 存款上 100bps 降息 ≈ 年收入影响 £120m
      - - Bounce Back Loan 信贷损失
        - FY2025 损失约 £28m；CEO 承认自身控制失效是因素之一
        - 重大
        - BBL 组合逐步到期；政府担保可能追回部分损失
      - - 监管成本上升（FCA 罚款之后）
        - Economic Crime Enhancement Plan 2023–2025；金融犯罪团队人数大幅增加
        - 重大
        - 计划仍在推进；第三方测试确认 VREQ 期末系统有效运行
      - - FCA 执法尾部风险
        - VREQ 于 2024 年 4 月结束；FCA 可施加进一步要求；挑战者银行板块受到审查
        - 中等
        - 截至 2026 年 6 月未有新的执法行动公开报道；整改完成
      - - 领导层 / 治理连续性
        - 据报道，CEO Raman Bhatia 于 2025 年卸任（Finextra）；创始人 Anne Boden 于 2023 年离任
        - 中等
        - 现有公开来源尚未确认继任安排
      - - IPO 时点风险
        - 2024 年 8 月曾考虑按约 £4bn 估值 IPO；Nils Pratley 2024 年 10 月称其“不适合上市”
        - 轻微（投资人退出，不涉及运营）
        - 罚款后 IPO 时间表推迟；资本充足性不受威胁
      - - 集中度风险（央行准备金 NIM）
        - 大量存款停放在 BoE；NIM 由政策利率而非信用利差驱动
        - 重大
        - 贷款账簿增长（包括借 Kensington 收购意向扩展按揭能力）会降低集中度
      - - Kensington Mortgage Platform 收购意向
        - City A.M.（2022 年 1 月）：Starling 是 Kensington 借贷平台竞标方之一
        - 信息性
        - 收购意向显示其有意扩大有担保贷款；结果未确认
    notes: |
      风险严重性评级是基于公开信息的定性判断。量化 NIM 敏感性假设存款基数约 £12bn（根据行业背景估计； 未由已提交账目确认）。实际敏感性取决于固定利率与浮动利率资产的组合，以及不计息负债（活期账户与 储蓄产品）的占比。
