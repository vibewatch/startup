      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Starling Bank 由 Anne Boden 创立。Boden 是职业银行高管，此前曾在 Allied Irish Banks、UBS、RBS 和 ABN AMRO
              担任高层职务。她是英国银行史上唯一创办银行的人，并从公司 2014 年成立一直担任 CEO 至 2024 年 6 月底。Starling 的 About 页面称，该行是「英国历史上唯一由女性创立的银行」。Anne
              Boden 还合著过讲述 Starling 创立过程的书《Banking On It》，进一步强化了主导公司身份的创始人叙事。

              根据 Companies House 申报历史，Raman Bhatia 于 2024 年 6 月 24 日正式获任 Starling Bank Limited 董事。Anne Boden 的董事任命于 2024
              年 6 月 30 日终止，确认了此前媒体报道中的 CEO 交接。截至本报告运行日（2026 年 6 月），Raman Bhatia 是在任 CEO。Bhatia 此前是 OVO Energy
              CEO，背景更多来自消费科技服务，而非传统银行。

              Boden 到 Bhatia 的交接实质性改变了关键人物依赖。Anne Boden 不只是创始 CEO，还是重要股东和挑战者银行叙事的公众面孔。交接表面上有序，但创始人已离开日常管理。其他已知高管包括
              Harriet Rees（集团首席信息官，见 2026 年 AI 新闻稿），但本轮抓取来源未能公开确认完整董事会构成和非执行董事名单；这构成重大治理证据缺口。

              Starling 称其高级管理人员中 43% 为女性，并计划到 2027 年达到 50%；公司已参与 Women in Finance Charter 八年。
