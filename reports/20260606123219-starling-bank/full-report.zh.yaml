      - number: '8.6'
        title: 附录要点
        blocks:
          - type: callout
            title: 观察，中等信心——估值偏高
            body: >-
              Starling 底层是一家已盈利的英国 neobank，也确有竞争优势。建议为观察而非买入，因为隐含 £4bn 估值（约 17.9× FY2025
              盈利）嵌入了恢复和监管放行叙事，但公开证据尚未确认。高确信度买入需要罚款后 FCA 记录干净、利润恢复至 £260m 以上，并披露 Engine 收入。若能以 £3.2–3.5bn 入场，安全边际会更站得住。
            calloutType: recommendation
            claimRefs:
              - CV039
              - CV040
              - CV044
              - CV045
          - type: callout
            title: AML 复发是首要投资逻辑破坏触发点
            body: >-
              2024 年 10 月 FCA 执法行动是投资逻辑里最重要的单一风险。它确立了一种合规基础设施滞后于增长的模式，与 IPO 准备度不一致。若再出现任何 FCA 执法行动——无论规模大小——IPO
              窗口都应视为至少关闭 24 个月，估值也可能重估到悲观情景区间（£1.8–2.4bn）。
            calloutType: risk
            claimRefs:
              - CV031
              - CV032
              - CV043
          - type: callout
            title: Engine 授权会改变估值框架——前提是披露
            body: >-
              Engine by Starling 有潜力为企业估值带来显著 SaaS 溢价。三家已确认被授权方（ABN AMRO、AMP Bank、Salt Bank）验证了模型。但在
              ARR、合同条款或分部收入没有披露前，任何 Engine 溢价都不能纳入基准情景。到 IPO 招股书提交时，Engine 披露会成为估值争论中最受关注的输入。
            calloutType: insight
            claimRefs:
              - CV019
              - CV026
              - CV042
          - type: callout
            title: 关键假设：FY2025 税前利润 £223m 是盈利基数
            body: >-
              本章所有情景分析和倍数计算都使用 FY2025 税前利润 £223m，这一数字来自多家媒体援引 Starling 年度业绩公告的报道。该数字尚未与完整 226 页 Companies House
              年报独立核验。任何重大重述都会按比例改变所有隐含倍数和估值。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV005
              - CV041
