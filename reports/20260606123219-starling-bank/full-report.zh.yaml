        - 评估 FCA 针对存款利率传导的执法动作，并对照挑战者定位
      - - 转户惯性（上次转户距今平均 6 年）
        - 逆风
        - 持续 / 结构性
        - 压住份额提升速度；第二账户增长快于主账户替换
        - 测算 Starling 个人账户中主账户与第二账户的占比
      - - 传统银行数字投入和转户奖励
        - 逆风
        - 当前 / 加剧
