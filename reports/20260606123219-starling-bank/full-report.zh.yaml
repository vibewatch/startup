      - number: '1.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 完整英国银行牌照和已验证盈利能力
            body: >-
              Starling 于 2016 年取得完整 PRA/FCA 银行授权，这让它区别于许多 fintech 同行。叠加连续四年盈利（FY2022–FY2025），该行更像成熟平台，而不是仍在烧钱的成长期
              startup。消费者银行、商业银行、B2B 支付服务和 Engine by Starling SaaS 平台的组合带来了有意义的多元化。
            calloutType: strength
            claimRefs:
              - CO003
              - CO025
              - CO026
          - type: callout
            title: FCA 执法给 IPO 和估值带来逆风
            body: >-
              2024 年 10 月 FCA Final Notice（£28.96M 罚款）指出其金融犯罪控制「松懈得令人震惊」，并引发外界对治理和监督充分性的质疑。Guardian 的 Nils Pratley
              在罚款后写道，Starling「根本不适合上市」。FY2025 盈利下降 25%，部分来自罚款和 £28M Bounce Back Loan 损失。这些因素合在一起，给任何 2025–2026 年 IPO
              造成重大逆风。
