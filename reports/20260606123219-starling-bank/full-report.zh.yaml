      - number: '3.4'
        title: 切换成本、锁定效应与多栖开户
        blocks:
          - type: paragraph
            body: >-
              英国零售银行市场的结构性切换摩擦较低：Current Account Switch Service（CASS）可在七个工作日内完成账户可携带迁移，NatWest 的 £200
              现金激励说明，传统银行认为赢得一次转户的边际成本足够有竞争力，值得用直接付款补贴。Finder 2026 年英国成年人数字银行调查发现，英国人平均上一次更换银行账户是在六年前，证明即便有
              CASS，行为惯性仍然很高。这种惯性更有利于成熟传统银行，而不是仍在建立主银行渗透率的年轻 neobank。对 Starling 商业客户来说，切换成本明显更高：Starling
              Accounting、免费发票、税务 Spaces、开放银行 API 接入和直接 Faster Payments 轨道集成，形成了数据和工作流锁定，这是只提供基础活期账户的竞争对手没有的。Tide
              的电子货币模式给其商业客户的银行深度设置了结构性上限——无法在没有 ClearBank 合作的情况下获得直接银行贷款，限制了 Tide 打造与完整银行牌照相同的多产品锁定能力。多栖开户普遍存在：Finder
              调查发现，到 2026 年，49% 的英国成年人已经开设纯数字银行账户（高于 2025 年的 40%），但传统银行仍保留多数主银行关系。Neobank
              用户经常同时持有一个传统账户和一个或多个挑战者账户，用于特定用例（外汇、预算、商业开票），这意味着竞争焦点是多银行客户的钱包份额，而不是排他性主银行地位。
            claimRefs:
