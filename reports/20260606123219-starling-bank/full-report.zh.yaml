  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Starling 的含义
      - 尽调追问
    rows:
      - - 移动优先的消费者预期
        - 顺风
        - 当前 / 持续
        - 纯数字银行有结构性优势；75 % 的英国成年人使用手机银行
        - 每年跟踪手机银行渗透率；确认 Starling App 评分相对传统银行的表现
      - - 开放银行制度（CMA 强制要求）
        - 顺风
        - 当前 / 持续
        - 13M 活跃开放银行用户降低转户摩擦；也让数据驱动产品跑得通
        - 确认 OBL 对强制要求存续期的预期；评估 JROC 未来实体时间表
      - - 传统银行关闭网点
        - 顺风
        - 当前 / 持续
        - 11 % 的数字银行采用者把网点关闭列为触发因素；带来未被充分服务需求
        - 量化网点关闭的地域集中度，与 Starling 获客漏斗对比
      - - Making Tax Digital（MTD）强制要求
        - 顺风
        - 近期：£50K+ 个体经营者 2026 年 4 月；£30K+ 为 2027 年；£20K+ 为 2028 年
        - 分阶段倒逼 SME 采用一体化数字银行 + 会计
        - 跟踪每个 MTD 批次中新 SME 客户采用 Starling Accounting 的比例
      - - FCA 消费者责任（2023 年 7 月生效）
        - 混合
        - 当前 / 持续
