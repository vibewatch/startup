      - number: '2.4'
        title: Engine by Starling——核心银行软件与 BaaS 市场
        blocks:
          - type: paragraph
            body: >
              Engine by Starling 是 Starling 的云原生核心银行平台，与银行业务商业分离，定位为持牌银行对持牌银行的 SaaS 产品。Engine 网站称其自 2016 年起支撑 Starling
              Bank，并把竞争主张放在预集成完整性、云原生架构和实时 24/7 可用性上。Engine 案例研究页面提到 Salt Bank（罗马尼亚）及其 CEO Gabriela
              Nistor，看起来是已确认的参考客户。Engine 将自己描述为「完整、预集成解决方案」，帮助银行「快速现代化、战略性增长并持续创新」。Engine
              的总可用市场位于全球数字银行平台分部内，MarketsandMarkets 估计该分部到 2026 年达到 USD 13.9 billion（CAGR 11.3 %）。竞争供应商包括
              Temenos（Transact）、Finastra（Fusion）、Mambu 和 Thought Machine——这些都是成熟银行推进转型时的可信替代方案。Engine 的竞争差异化在于声称已在
              Starling「规模化验证」（Engine 网站引用 Starling FY2025 年度报告），这提供了纯软件供应商无法匹配的在产参照。Engine 的买方范围窄但价值高：它瞄准吸收存款的持牌银行，而不是
              fintech 或电子货币机构。这把 TAM 限定在具备监管资质和资本基础、能运营完整银行的机构，但也意味着每份合同金额大且粘性强。Engine 对 Starling
              合并财务的收入贡献未公开披露，是评估该分部估值意义时的重大证据缺口。
