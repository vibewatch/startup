      - number: '2.2'
        title: 消费银行——数字化采用与市场规模
        blocks:
          - type: paragraph
            body: >
              英国数字银行采用率已到结构性拐点。Finder 委托 Censuswide 于 2026 年 1 月开展的全国代表性调查（n = 2,000）发现，49 % 的英国成年人——约 27.1 million
              人——已开设纯数字银行账户，高于 2024 年的 36 % 和 2023 年初的 24 %。另有 15 % 打算开设，意味着潜在渗透率上限超过 65 %。更广义的数字银行使用已接近饱和：按 2024 年数据，88
              % 的英国成年人（约 48 million）使用某种形式的线上或远程银行服务，75 % 具体使用手机银行。Starling 自身产品页报告其个人活期账户客户超过 3.5 million；按客户数领先的英国挑战者
              Monzo 报告个人和商业产品合计 15 million 客户。移动 App 用户最多的传统银行 Barclays 报告有 12 million 客户使用其
              App。这些数字显示，挑战者合计已占主要银行关系中很大且快速增长的少数份额——但传统银行仍保住多数，并通过转户激励（NatWest 2026 年提供 £200；HSBC 最高提供
              £500）和数字产品投入积极竞争。从 TAM 看，难点不在客户数，而在收入规模测算：没有公开一手来源披露英国活期账户净利息收入或手续费收入总额。Grand View Research 估计 2025 年全球
              neobanking 市场为 USD 211.20 billion，并预计到 2033 年 CAGR 为 61.9
              %——这一数字应谨慎使用，因为它反映的是全球资产负债表敞口汇总，而非英国可触达收入机会。Statista 的建模方法使用
              NII、存款量和用户渗透率，并结合自上而下与自下而上的方法预测市场规模；MarketsandMarkets 则估计更广义的数字银行平台基础设施市场到 2026 年达到 USD 13.9 billion，CAGR
              为 11.3 %——这对 Engine 的竞争来说是更窄、也可说更可操作的视角。
