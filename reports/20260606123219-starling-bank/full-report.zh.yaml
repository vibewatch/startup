      - number: '4.3'
        title: FY2024 背景、收入质量和利差结构
        blocks:
          - type: paragraph
            body: >
              FY2024（截至 31 March 2024 的年度）是 Starling Bank 连续第三个盈利年度。年度账户约在 3 July 2024 提交 Companies House（235 页）。FY2024
              税前利润估计约 £297m，按 FY2025 税前利润降至 £223m、同比下滑 25% 推算。本次审查未能找到独立材料核验 FY2024 收入；结合 FCA 确认的收入轨迹和英国基准利率上行环境（BoE
              基准利率在 August 2023 至 August 2024 达到 5.25% 峰值），FY2024 收入估计约
              £650–700m，主要由大规模客户存款基础上的净利息收入驱动，这些存款在央行准备金和贷款上获得更高收益。

              相对于典型挑战者银行同行，Starling 收入质量较高：存款融资的利息收入模型是结构性而非投机性，该行持有完整银行牌照（不是电子货币机构），并有 FSCS
              存款保护。企业账户订阅用户带来低边际成本的经常性费用收入。Engine by Starling 提供技术许可收入，非存款且可能利润率更高，但分部披露不可得。

              收入质量的关键风险是 NIM 被压缩。随着英国基准利率到 June 2025 从 5.25% 降至 4.5%，Starling 在央行准备金和浮动利率贷款上的利息收入会承压。Bank of England
              提到了持续降息路径。此外，FY2025 约 £28m 的 Bounce Back Loan 信用损失说明政府担保贷款组合存在不小的资产质量风险。

              FCA 2022 年挑战者银行审查（发布于 22 April 2022，最后更新于 3 December 2025）指出全行业金融犯罪控制薄弱；Starling 随后收到正式罚款，并一直实施 Economic
              Crime Enhancement Plan（2023–2025）。金融犯罪控制上的持续监管投入会成为成本驱动因素，在 FY2025 之后仍会延续。
