  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值历史和当前背景
        blocks:
          - type: paragraph
            body: >-
              Starling Bank 最近一次外部股权融资是在 April 2022，以 £2.5bn 投后估值完成 £130m Series D。该轮被 Bloomberg、Reuters 和 The Guardian
              广泛报道，仍是股权结构表中最后一个硬锚。此后未披露股权融资，因此 £2.5bn 是机构成本基础下限。August 2024，Bloomberg 和 Reuters 报道 Starling 正探索约 £4bn 的
              IPO，意味着相对 Series D 基础在约 28 个月内升值 60%。多位伦敦金融城消息人士提到顾问沟通，而非正式招股书流程；Companies House 或 FCA 均无文件确认任何上市意图。所报道
              IPO 讨论的时点，立即受到 FCA October 2024 Final Notice 的复杂化：FCA 因 2021 至 2023 年期间金融犯罪筛查控制不足，对其处以 £29.25m 罚款。The
              Guardian 的 Nils Pratley 写道，该行“根本不适合上市”，这一看法在机构投资者圈内广泛存在。到 May 2025，Starling 报告首次年度利润下滑——FY2025 税前利润
              £223m，较 FY2024 估计 £297m 同比下降 25%——部分由 Bounce Back Loan 损失驱动，也部分由 Bank of England 将利率从 August 2024 的 5.25%
              峰值下调后，早期 NIM 压缩驱动。截至本次运行日期 June 2026，按 Companies House（编号 09092149），Starling Bank Limited
              仍是私人有限公司；没有公开提交上市招股书或上市意向。因此 IPO 窗口仍开着，但取决于监管修复、利润恢复和英国金融科技上市的整体市场环境。Chrysalis Investments Limited 是持有
              Starling 股份的上市投资信托，提供部分面向投资者的评论；但其网站把所有实质 NAV 数据都挡在英国投资者访问免责声明之后，使外部无法用公开来源独立核验持仓估值标记。
