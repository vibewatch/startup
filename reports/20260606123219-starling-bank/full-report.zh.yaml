      - number: '2.5'
        title: 采用驱动因素
        blocks:
          - type: paragraph
            body: >
              几股结构性力量正在把数字银行认知转化为主账户采用。第一，移动优先的消费者预期已经决定性转向：75 % 的英国成年人现在使用手机银行，高于 2023 年的 60 %。网点关闭加速了这一点——按 Finder
              2026 调查，11 % 的数字银行新开户者把网点关闭列为触发因素，这反映出现有银行网点网络仍在持续收缩。第二，英国开放银行制度提供了异常丰富的数据可携带基础设施；Open Banking Limited
              将英国描述为拥有全球领先开放银行标准，目前服务 13 million 活跃用户。该基础设施降低切换摩擦，也让第三方个人财务管理工具能够提升用户对更高性价比替代方案的认知。第三，2022
              年以来的利率周期让存款利率成为实时竞争变量：FCA 的 Consumer Duty（2023 年 7
              月生效）要求机构为零售客户交付公平结果，叠加监管机构提高对储蓄利率传导的审视，使存款利率保持可见并处于竞争中。第四，Making Tax Digital 强制令在 2026–2028 年给 SME
              数字银行采用制造反复出现的、政府驱动的强制函数。第五，2025 年欧洲以 28.54 % 收入份额主导全球 neobanking 市场，说明英国挑战者扩张受益于欧洲大陆类似市场顺风——尽管跨境增长更直接的受益者是
              Engine。
            claimRefs:
