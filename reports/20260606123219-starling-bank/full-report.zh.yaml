  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与竞争语境
        blocks:
          - type: paragraph
            body: >
              Starling 的可触达版图横跨三个不同但部分重叠的细分市场。第一块是英国个人活期账户银行，约 55 million 成年人持有一个或多个银行账户，现状替代方案是传统高街银行或建房互助会。第二块是英国 SME
              银行，覆盖约 5.5 million 家需要商业活期账户来处理支付、现金管理、贷款和集成会计的企业。第三块是核心银行基础设施，Engine by Starling
              在全球争夺持牌银行技术转型合同，替代现有核心银行供应商（Temenos、Finastra、Oracle FLEXCUBE）。各边界之外的业务包括：投行业务、证券经纪、保险承保，以及作为主要产品的跨境汇款。2016
              年 CMA 零售银行调查认定，英国现有银行争夺客户不够积极，挑战者面临增长障碍——这一结论塑造了 Starling 所处的整套开放银行监管体系。CMA 授权的实施主体 Open Banking Limited
              目前报告英国有 13 million 活跃用户使用开放银行驱动的工具，说明监管架构正在带来可衡量的生态效果。消费银行的现状替代方案包括继续使用传统活期账户、把支付 App 作为副账户，或依赖信用合作社。对
              Engine 来说，主要替代方案是由成熟供应商推进多年传统核心系统更换项目，或内部自建——两者历史上都慢、贵且容易失败。
