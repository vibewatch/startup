      - number: '4.5'
        title: 成本结构、运营效率和人员成本
        blocks:
          - type: paragraph
            body: >
              Starling 采用无网点、数字原生模式，在四个办公室（London、Cardiff、Southampton、Manchester）运营；关于页面称有“数千人的团队”（FY2025
              具体员工数未公开披露）。招聘页面显示，全球招聘围绕这四个主要英国地点展开，工程职能是产品交付核心。成本收入比（CIR）本次审查无法从公开来源提取。

              该行在 FY2025 发生 £24.6m 员工奖金——按 Guardian 报道，是正常化水平的五倍。这一项属例外，可能反映管理层在监管逆风之年决定用奖金留住人才，资金来自管理层认定的强劲底层交易结果。FCA
              £28.9m 罚款和约 £28m BBL 信用拨备合计约 £57m 一次性成本；若剔除，底层税前利润接近约 £280m。

              FCA 计算 Level 4 罚款所依据的 December 2019 至 November 2023 累计收入为 £1.119bn；考虑到 FY2022–FY2023
              已报告盈利，四年成本基数必然远低于这一水平。不过，要量化运营杠杆指标（毛利率、单账户成本、技术单位成本），仍需要已提交账户。

              金融犯罪合规现在是实质性的永久成本中心。该行在 VREQ 整改中称已“大幅增加金融犯罪合规资源”，并在执行 Economic Crime Enhancement
              Plan（2023–2025）。这部分支出叠加在持续基线监管合规之上，会部分抵消 FY2026 任何由 NIM 推动的收入增长。
            claimRefs:
              - CI032
              - CI033
              - CI034
              - CI035
              - CI036
      - number: '4.6'
        title: 财务结论和尽调阻塞点
        blocks:
          - type: paragraph
            body: >
              Starling Bank 从零到七年内实现 £452.8m 收入，并连续四年盈利；在同等规模欧洲数字银行中，这条财务轨迹非常突出。FY2025 利润 £223m，即便同比下降
              25%，对英国挑战者银行来说仍是强劲绝对盈利。

              但重大尽调阻塞点仍在。第一，FCA 罚款是已结案的监管执法，但不排除进一步监管审查；VREQ 到 April 2024 才关闭，Economic Crime Enhancement Plan 持续到
              2025。第二，BBL 信用损失说明贷款账簿中存在需要进一步调查的资产质量风险。第三，英国基准利率从 5.25% 下行带来的结构性 NIM 压缩，会比传统银行更不成比例地冲击
              Starling，因为传统银行的负债匹配更紧。

              第四，IPO 路径曾在 August 2024 的 Bloomberg / Reuters 报道中被设想为约 £4bn 估值，但 Guardian 专栏作者 Nils Pratley（October
              2024）明确批评其为时过早，尤其是 FCA 罚款刚落地。随后 CEO 变动（Finextra 2025 报道 Raman Bhatia 离任）增加了治理不确定性。

              FY2025（Companies House，226 页）和 FY2024（235 页）的已提交年度账户，是填补存款规模、贷款账簿构成、资本比率、NIM 和 CIR
              等重要缺口的主要证据基础。本次审查未能直接获取这些文件，它们仍是首要尽调索取项。
