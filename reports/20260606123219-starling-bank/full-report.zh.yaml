      - number: '3.2'
        title: 传统银行与混合型挑战者
        blocks:
          - type: paragraph
            body: >-
              英国四大零售传统银行——Barclays、HSBC、NatWest 和 Lloyds——在个人和 SME 银行业务上仍是 Starling 的主导竞争参照。Barclays 有 12 million
              客户通过其移动 App 办理银行业务，规模压过任何单一英国 neobank。NatWest 用 £200 现金奖金主动激励 CASS 转户，面向此前在 2026 年 5 月 6 日未持有 NatWest
              账户的新客户和合格现有客户——这是直接夺回流向挑战者客户的策略。HSBC 的 Bank Account 不收月费，并提供 Global Money Account 做多币种管理，仅在成本维度就与 Starling
              的零费用和国际借记产品竞争。Lloyds 作为 Lloyds Banking Group 的一部分，与 Halifax 和 Bank of Scotland 并列，可跨品牌交叉销售，这是任何独立 neobank
              都无法复制的。Metro Bank 处在混合位置：它是拥有英格兰和威尔士实体门店的挑战者银行，2023 年金融救援后，在 CEO Daniel Frumkin 领导下战略重新聚焦 SME 和商业关系银行。Tide
              是英国领先的 SME 电子货币挑战者，获 FCA 授权为电子货币机构（FRN 900843），而非银行；它通过 ClearBank（FRN 754568）银行基础设施层提供账户，每名存款人享有最高
              £120,000 的 FSCS 保护。Tide 提供面向 SME 的免费和付费月度计划，但电子货币模式限制了其在没有第三方伙伴时直接提供贷款或透支的能力。NatWest 的 Mettle 子品牌直接与
              Starling 商业账户竞争：它面向最多两名所有者的个体经营者和有限公司，对活跃账户持有人免费集成 FreeAgent 记账；按 2026 年 2 月对 15 家最大英国商业活期账户提供商共 1,200
              名客户的独立调查，Mettle 正经历高申请需求。
