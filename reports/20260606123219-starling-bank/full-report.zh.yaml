      - - 反向：BoE 利率从 5.25% 峰值下调后，NIM 压缩成为结构性风险
        - BoE 于 2024 年 8 月开始降息；基于存款的 NIM 是主要收入驱动因素
        - 利率稳定在 3.5%+，或贷款账簿增长降低对存款收入的依赖
    notes: 反论点来自负面评论和监管证据；正向论点来自公司披露和第三方报道。刻意保持两端平衡。
