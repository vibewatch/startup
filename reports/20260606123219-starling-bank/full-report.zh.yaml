  - id: FU001
    title: 消费者与企业客户旅程图
    type: journey-map
    layout: wide
    summary: 个人和企业客户从发现到多产品扩展的端到端旅程。
    data:
      items:
        - id: stage-1
          label: 认知
          description: 通过口碑、应用商店搜索、比较网站（Finder、Which?）、社交媒体，以及会计师推荐（针对 SME 客群）发现产品。
        - id: stage-2
          label: 申请
          description: App 内 KYC：视频自拍、上传政府身份证件；通常 24 小时内批准。无需到访分行；全程手机或网页完成。
        - id: stage-3
          label: 开户上手
          description: 借记卡 3–5 天送达；Apple Pay / Google Pay 可立即绑定；初始 Spaces 设置完成；换户客户通过 CASS 迁移已有定期付款指令。
        - id: stage-4
          label: 日常银行
          description: 即时付款通知；Spending Insights；Bills Manager 和 Spaces 用于预算；符合条件的账户可用透支额度；24/7 App 内支持。
        - id: stage-5
          label: 深度使用
          description: 连接 Marketplace（保险、养老金、抵押贷款经纪、投资）；向 34 个国家转账；AI Scam Intelligence；Spending Intelligence；为企业客户提供会计集成。
        - id: stage-6
          label: 扩展
          description: 联名账户；Kite（6–15 岁儿童）；专门的企业账户（个人 → SME 重叠）；多币种账户；Engine B2B（面向机构客户）。
