      - number: '6.3'
        title: 客户满意度、奖项和体验质量
        blocks:
          - type: paragraph
            body: >-
              Trustpilot 截至 February 2026 载有 45,462 条 Starling 评论，综合评分 4.1/5（“Great”）。Trustpilot 上 AI
              生成的评论摘要显示，易用性、即时通知、作为突出预算工具的 Spending Spaces 以及 App 现代设计，是主要正面主题。Finder.com 在 2026 年进行的客户满意度调查发现，97% 的受访
              Starling 客户会向朋友推荐该行；Finder 将这一指标归因于 App 质量、零海外费用和 24/7 App 内支持的组合。Finder 还授予 Starling 2025 Provider of the
              Year Award for Travel Debit Card 和 2024 Customer Satisfaction Award for Current Accounts。

              Google Play 列表确认，Starling 已连续第六年获得 Which? Recommended Provider 身份。Which? Recommended Provider
              认定要求在服务满意度、透明度和产品价值上保持表现；连续六年入选是实质可信信号。Google Play 商店还确认“Voted Best Business Banking Provider 2023”这一单独奖项。

              也有反向信号。Trustpilot 有少数负面评论，集中在投诉处理、待处理交易，以及一例与 Monzo 的不利比较。Guardian 专题页记录了 March 2024 的读者问题：一名丧偶丈夫被拒绝
              £10,000 诈骗退款，显示欺诈索赔处理存在摩擦；在 Payment Systems Regulator 自 October 2024 生效的强制赔付制度下，这一风险类别越来越受监管关注。Starling
              的欺诈页面和移动安全页面确认，该行已落地主动措施：AI 驱动的 Scam Intelligence 工具会分析交易平台截图；Call status banners 确认真正来自 Starling
              的来电；并承诺绝不通过电话索取 PIN 或密码。生活成本支持页体现了对客户财务压力的主动倾听，包括向非客户开放免费预算工具。
