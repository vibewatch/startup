      - number: '4.2'
        title: FY2025 业绩：连续第四年盈利
        blocks:
          - type: paragraph
            body: >
              截至 31 March 2025 的财年，Starling Bank 报告税前利润 £223m，较 FY2024 同比下降 25%（FY2024 结果按已披露百分比变化推算约为 £297m）。账户文件已提交
              Companies House，共 226 页，但本次审查未能直接获取完整文件。

              三项非经常性项目显著拖累 FY2025 盈利。第一，FCA 于 27 September 2024 处以 £28,959,426 罚款（11 October 2024 应付），原因是 December 2019
              至 November 2023 期间存在严重金融犯罪控制失灵，包括违反 Voluntary Requirement（VREQ）以及金融制裁筛查不足。第二， Guardian 报道约 £28m 信用损失来自
              Bounce Back Loans（政府担保的 COVID 支持贷款），该行承认自身控制不足。第三，公司在 FY2025 向员工支付 £24.6m
              奖金——据称是正常水平的五倍——说明即便表观利润下滑，管理层仍把底层经营表现视为强劲。

              FCA 将罚款严重程度定为 Level 4（违规期间 £1.119bn 累计收入的 15% = £167.9m，因比例原则降至 £40m，再因配合调查折价 30% 至 £28.9m）。该罚款计入 FY2025
              费用。

              截至 June 2026，Engine by Starling 面向投资者的网站将 Starling Annual Report and Accounts 2025 列为账户数、活跃客户、NPS
              分数、收入、税前利润和 NIM 等 KPI 的来源；这说明 NIM 是已提交账户中的披露指标。本次审查未能获取具体 NIM 数值。
