  - id: TV005
    title: 打破投资逻辑与止损触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 第二次 FCA 执法行动
        - 2024 年 10 月之后任何新的 FCA Final Notice 或监管指令
        - IPO 窗口至少关闭 24 个月；机构投资者需求坍塌；估值重定价至熊市情景
        - 退出或坚决放弃任何新投资；对整改计划做完整尽调
      - - NIM 低于 2.5%
        - BoE 基准利率持续低于 3%，且 Starling 贷款投放不足以抵消
        - FY2026 利润跌向 £150–180m；£4bn 估值下 P/E 超过 22×；价值受损
        - 下调至规避，直至利润率修复得到证明
      - - 利润连续第三年下滑
        - FY2026 税前利润低于 £200m
        - 打破盈利增长叙事；模型可持续性受质疑
        - 重估投资案例；要求管理层解释结构性因素与周期性因素
      - - Series D 轮锚定投资者以低于 £2.5bn 隐含估值卖出
        - Chrysalis、Softbank 或 QIA 以低于 £2.5bn 隐含价格进行二级出售
        - 释放内部人认为成本基础无法支撑的信号；重设市场锚
        - 立即重估；很可能退出任何未平仓头寸
    notes: 触发项是指示性监测点，不是合同契约。阈值基于作者对证据集的判断，应由合格分析师校准。
    claimRefs:
      - CV031
      - CV033
      - CV037
      - CV043
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 责任方 / 尽调路径
    rows:
      - - FY2025 和 FY2024 完整经审计账目
        - Companies House 账目（FY2025 226 页；FY2024 235 页）在本次审阅期间无法从公开文件完整获取
        - 没有完整账目，NIM 拆分、贷款账簿质量、Engine 分部披露和运营费用结构都无法独立核验
        - 直接向公司索取；Companies House 文件可获取（需下载账户）
      - - 股东协议和投资协议
        - 优先股条款、清算优先权瀑布、反稀释条款和强制出售权
        - 没有优先权条款，无法建模 IPO 时的稀释和 Series D 投资者回报瀑布
        - 公司 VDR 或法律顾问；非公开
      - - Engine by Starling ARR 和合同条款
        - 年报未披露 Engine 分部收入；与 ABN AMRO、AMP Bank、Salt Bank 的合同结构未披露
        - 没有 ARR 数据，Engine 的牛市估值溢价完全是推测
        - 直接管理层简报；公司可能在 IPO 招股书中披露
      - - Chrysalis Investments 所持 Starling 股权的 NAV
        - Chrysalis 网站将 NAV 披露置于英国投资者免责声明之后；未提取单项投资 NAV 数据
        - Chrysalis NAV 可为 Starling 当前隐含估值提供独立机构标记
        - 向 Chrysalis 索取投资者关系资料包，或通过 LSE 文件阅读其最新年报
      - - 罚款后独立 FCA 合规鉴证
        - 没有公开鉴证显示 Starling 自 2024 年 10 月罚款以来已获得 FCA 清洁结论
        - 没有合规清理信号，公开发行中的机构投资者会计入持续监管风险
        - 公司提供 FCA 往来函件摘要；或监测 FCA register 的监管通知
    notes: 尽调事项按截至运行日期对投资决策的重要性排序。第 1–3 项会阻断高置信买入；第 4–5 项重要， 但单项不至于打破投资逻辑。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
