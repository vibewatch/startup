      - number: '4.4'
        title: 资本充足率、融资结构和存款基础
        blocks:
          - type: paragraph
            body: >
              Starling Bank 受 PRA 按英国资本要求框架监管。作为吸收存款的银行，它必须维持 PRA 在个别资本指引（ICG）下设定的最低 CET1 资本比率。公司同时获得 FCA 和 PRA
              授权并受其监管（FRN 730166）。除 March 2019 的固定押记（编号 0909 2149 0005）外，该行在 Companies House
              押记登记簿没有外部债务发行记录，说明资本结构依赖股权融资和留存收益，而不是批发市场债务。

              该行主要资金来源是客户存款基础，且与账户增长同步扩大。FY2023 时该行服务 360 万名客户；截至 mid-2026，关于页面报告超过 400 万个账户。已提交 FY2025 账户中的具体存款余额、贷存比和
              CET1 资本比率，本次审查未能直接获取，这是实质性证据缺口。

              Starling 的投资者包括 Goldman Sachs、Fidelity、Qatar Investment Authority、Chrysalis Investments、Railpen（Railway
              Pension Scheme）、Millennium Management 和 Harry McPike；该行称自己“100% 独立”，不归任何其他银行所有。FY2024 或 FY2025
              未公开报道新的外部股权融资，说明在当前发展阶段，该行正靠留存收益自我供血。

              Companies House 上 March 2019 的固定押记是记录中唯一正式担保安排；截至本次审查日期，申报历史中没有可见更新押记。没有批发债务融资（私营公司无 CDS
              利差）意味着资本充足率评估完全依赖已提交账户和 PRA 监管披露，而两者都未能直接取得。
