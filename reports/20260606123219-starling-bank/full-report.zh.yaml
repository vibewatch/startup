      - number: '2.3'
        title: SME 银行——挑战者渗透与分部经济性
        blocks:
          - type: paragraph
            body: >
              SME 银行是 Starling 置信度最高的增长杠杆之一，也是结构上仍未被充分颠覆的市场。Starling 商业账户页面称，超过 450,000 家企业在 Starling 办理银行业务，使其成为 SME
              细分市场最大的数字挑战者之一。以估计 5.5 million 家英国 SME（含个体经营者和微型企业）为基数，这代表约 8 % 捕获率——如果方向上准确，说明剩余空间很大。SME
              细分市场长期由四大传统银行（Barclays、HSBC、Lloyds、NatWest）主导，数十年来它们合计持有绝大多数英国 SME 主银行关系。挑战者 SME
              分部的差异化来自无月费定价、移动优先账户管理、集成会计软件（Starling 内置 Starling Accounting、Tide 的 MTD 集成、Mettle 捆绑
              FreeAgent）和更快开户注册。Tide 不是持牌银行，而是在电子货币牌照下通过 ClearBank 运营，也在同一细分市场竞争。Atom Bank 的差异化来自 SME
              商业贷款和有竞争力的储蓄产品，而非交易银行。结构性需求信号包括英国政府 Making Tax Digital 推进：自 2026 年 4 月起，合格收入超过 £50,000 的个体经营者必须保留数字记录——这给
              SME 数字银行采用制造了强制函数。一个关键负面信号是：Tide 没有完整银行牌照，意味着 SME 存款超过 ClearBank FSCS 上限（£120,000）后获得不同保护，可能限制较大型 SME 采用。
