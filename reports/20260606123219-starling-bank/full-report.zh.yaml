  - id: TV003
    title: 牛市、基准、熊市情景摘要
    columns:
      - 情景
      - 关键假设
      - 隐含估值区间（£m）
      - P/E 基础
      - 概率信号
    rows:
      - - 牛市（24 个月）
        - FY2026 利润恢复至 £270m+；Engine 达到 £100m ARR；以 20–22× 混合倍数 IPO；监管记录干净
        - 5,000–7,000
        - ~22× FY2026 盈利，加 Engine SaaS 溢价
        - 低（需要多个正向条件同时兑现；Engine ARR 未确认）
      - - 基准（12–18 个月）
        - FY2026 利润恢复至 £240–260m；无 Engine 披露；以 14–17× 盈利 IPO；监管尾部风险可控
        - 3,400–4,400
        - ~16× FY2026 盈利中点 £250m
        - 中（需要利润修复且没有第二次 FCA 行动；合理但不确定）
      - - 熊市（开放式）
        - 第二次 FCA 行动或利润连续第三年下滑；盈利 £180–200m；IPO 延后；倍数 10–12×
        - 1,800–2,400
        - 压力情景下 FY2025 盈利 £200m 的 ~11×
        - 中低（AML 风险真实存在；NIM 压缩真实存在；单独可控，叠加后风险显著）
    notes: 所有估值均为基于公开盈利报道和可比公司倍数的估算。P/E 倍数由作者估算，并非来自银行家或顾问指引。 FY2026 盈利尚不可得；估算由 FY2024–FY2025 趋势外推。
