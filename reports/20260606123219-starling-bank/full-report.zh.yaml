      - number: '7.2'
        title: 财务模型风险——NIM 压缩、BBL 损失、资本和信用
        blocks:
          - type: paragraph
            body: >
              Starling 收入模型高度偏向净利息收入，因此对英国 Bank Rate 变化以及存款人所得与借款人支付之间的利差极其敏感。截至 April 2026 MPC 会议决定，Bank Rate 为
              3.75%，背景是中东能源价格压力和 2.8% 通胀；下一次决定在 18 June 2026。利率在 mid-2023 达到 5.25% 峰值后已经下调；如果通胀在 H2 2026 或 2027
              回到目标，进一步降息是可能的。Starling 的零售活期账户存款支付很少或不支付利息，而贷款和透支收益率跟随政策利率，因此每次降息都会直接挤压 NIM。FY2025 税前利润约降 25% 至约
              £223m，CEO 公开承认薄弱内部控制造成约 £28m BBL 损失——这一罕见承认同时暴露信用质量失灵和剩余整改任务。英国政府对 BBL 提供 100%
              担保，意味着主要信用损失由公共部门承担，但由已承认控制失灵引发的欺诈相关损失或核销会直接落在 Starling 身上；NAO 记录 BBL 贷款超过 £36.9bn、覆盖 1.2m
              家企业，欺诈尾部风险是全行业多年暴露。资本充足率是潜在风险：UK Basel III 下 PRA 最低要求限制 Starling 在不发行资本的情况下扩大信贷或收购资产，具体 Pillar 1、Pillar 2A
              比率和 CET1 缓冲未公开披露。June 2025 约 £24.6m 的五倍奖金支出——在罚款且利润下滑的情况下发放——释放出资本保全与留才激励之间的文化张力，机构投资者需要审视。FSCS 保护（每名存款人
              £85,000）部分缓解存款流失风险，但英国地域集中（基本 100% 英国）让 Starling 面对英国特定监管或宏观冲击时没有缓冲。
