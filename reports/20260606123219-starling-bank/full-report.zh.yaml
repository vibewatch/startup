chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、牌照与公司结构
        blocks:
          - type: paragraph
            body: >-
              Starling Bank Limited 是一家英国私人有限公司（Companies House 编号 09092149），成立于 2014 年 6 月 18 日。公司最初以 POSSIBLE FS
              LIMITED 注册，2016 年 1 月更名为 STARLING FS LIMITED，随后不久采用当前交易名称。该行持有完整英国银行牌照：2016 年 7 月 12 日获 Prudential
              Regulation Authority（PRA）授权，此后一直同时受 Financial Conduct Authority（FCA）和 PRA 监管，注册编号为 730166。

              公司称自己 100% 独立——不由任何其他银行持有——股权由创始人 Anne Boden、现任员工、员工福利信托和数家外部金融投资人持有。注册地址为 5th Floor, London Fruit and
              Wool Exchange, 1 Duval Square, London E1 6PW。

              Starling 以无网点、App 优先数字银行模式运营，提供个人活期账户、商业银行账户、联名账户、透支、无抵押贷款、抵押贷款（通过中介）和面向 16 岁以下儿童的 Kite 借记卡。零售银行之外，它提供 B2B
              银行基础设施服务（Faster Payments 间接接入），并孵化出独立 SaaS 银行技术业务 Engine by Starling。SIC 分类为 64191（Banks）。每名符合条件的客户在 FSCS
              下最高受 £85,000 保护。
