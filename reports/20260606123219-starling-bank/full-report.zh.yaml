  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层和规模
        blocks:
          - type: paragraph
            body: >-
              Starling Bank 服务四类主要零售账户客户——个人活期账户、企业银行账户、联名账户和多币种账户——另有面向 6 至 15 岁儿童的 Kite 借记卡，挂接父母的个人或联名账户。截至
              mid-2026，About 页面披露“超过 400 万个账户”，个人活期账户页面则称“加入超过 350 万名 客户”，说明个人账户持有人占总账户基础的大多数。企业银行账户页面另行确认“450,000+
              家企业使用 Starling 银行服务”，约占总账户的 11%。

              Starling 零售客户业务仅在英国运营。没有国际分行，没有英国以外的零售银行合作，也没有单独报告的国际零售客户数。该行把自己定位为无网点、App 优先，并通过 App 内聊天和电话提供 24/7
              英国本土真人支持。所有合格存款均受 Financial Services Compensation Scheme（FSCS）保护，每名存款人最高 £120,000，覆盖个人和企业账户持有人。

              零售之外，Starling 服务两个 B2B 客户分层。Engine by Starling 向全球数字银行许可其核心银行技术——罗马尼亚的 Salt Bank 是公开点名客户——使 Starling
              成为平台业务，拥有与仅英国零售集中度脱钩的收入流。B2B Banking Services 部门通过 API 间接接入 Faster Payments
              System，服务英国的金融科技公司、电子货币机构和支付服务提供商，使 Starling 成为第一家通过 RESTful API 接口提供 Faster Payments 接入的英国银行。Engine 客户数和
              B2B Banking Services 收入均未公开披露。
