      - number: '1.5'
        title: 里程碑时间线与负面事件
        blocks:
          - type: paragraph
            body: >-
              Starling Bank 自 2014 年至今的历史涵盖创立、融资、产品发布、监管互动、领导层交接和负面事件。公司公开历史中最重大的负面事件，是 FCA 于 2024 年 10 月 1 日发布 Final
              Notice，对金融犯罪控制失败处以 £28,959,426 罚款。这些失败分为两部分：（1）Starling 违反 FCA 于 2021 年 9 月作为更广泛反洗钱强化计划一部分施加的 Voluntary
              Requirement（VREQ），为 49,183 名高或更高风险客户开立了 54,359 个账户；（2）自 2017 年以来，Starling 的自动制裁筛查只将客户与 HM Treasury
              Consolidated List 中一小部分姓名核对（原因是系统配置错误，影响未被识别为拥有英国公民身份或居留权的客户）。折扣前原始罚款为 £40,959,426；Starling 因提前和解获得 30%
              减免。

              FCA 执法记录叠加 2024 年中 CEO 交接、IPO 猜测和 FY2025 利润下滑，使 2023–2025 年远比 Starling 早期增长故事复杂。该行 FY2025 £223M
              利润仍代表连续第四年盈利（FY2022 是首个盈利年度），但同比下降 25% 和 Bounce Back Loan 损失给此前快速利润增长轨迹注入不确定性。

              尽管受到 FCA 行动，该行仍在运营，银行牌照未被暂停，还推出了新产品（2026 年 3 月智能体 AI、2025 年 10 月 AI 反诈骗工具），并维持监管授权。FCA 通知确认，制裁筛查配置错误由
              Starling 于 2023 年 1 月自行发现并修复，第三方测试到相关期间结束时确认修复有效。
