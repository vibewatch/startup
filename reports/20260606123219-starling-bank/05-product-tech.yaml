  - FE002
- id: engine-platform-and-client-proof
  title: Engine by Starling Platform and Client Proof
  body: 'Engine is the strongest technology evidence in the chapter because it converts Starling’s internal core into an externally
    sold banking-software platform. Engine and partner pages consistently describe it as cloud-native, modular, API-based
    and SaaS-delivered, with configurable products across spending, savings, borrowing and investing. The client proof is
    now broader than a single reference: AMP’s own announcement evidences a SaaS agreement for a small-business digital bank
    in Australia; Engine and GFT evidence Salt Bank’s Romanian launch; and Tangerine’s own announcement evidences a 10-year
    agreement for more than two million Canadian clients. The retained public evidence did not corroborate ABN AMRO as a current
    Engine client, so the chapter uses Salt, AMP, Tangerine and the FY26 SBS mention as the evidenced client set.'
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE017
  - CE020
  - CE021
  - CE022
  - CE024
  - CE025
  - CE044
