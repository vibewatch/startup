  evidenceGaps:
  - type: missing-source
    severity: material
    topic: abn-amro-client-proof
    missingEvidence: A public official ABN AMRO or Engine page confirming an active Engine by Starling partnership.
    whyItMatters: The prompt named ABN AMRO, but retained public Engine evidence did not corroborate it as a current client.
    diligencePath: Ask Engine or ABN AMRO for an official announcement, contract reference, or permissioned customer proof.
    relatedQuestionRefs:
    - QE023
  - type: private-evidence-only
    severity: material
    topic: architecture-detail
    missingEvidence: Detailed architecture, microservice boundaries, event buses, reliability SLOs and incident postmortems.
    whyItMatters: Cloud-native and API-based claims are credible but not sufficient for technical underwriting without operational
      detail.
    diligencePath: Request architecture diagrams, SOC reports, incident reviews, change-management metrics and cloud exit
      plans.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: Richer public developer portal, API documentation, SDK activity, package metrics or source repository
      evidence.
    whyItMatters: The public developer page fetched only a title, limiting external validation of API maturity.
    diligencePath: Request partner API docs, sandbox access, SDK changelogs and developer support metrics.
    relatedQuestionRefs:
    - QE025
  - type: private-evidence-only
    severity: material
    topic: compliance-remediation
    missingEvidence: Independent post-remediation assurance on AML, sanctions screening and financial-crime controls.
    whyItMatters: The FCA notice documents remediation, but lasting control effectiveness is critical for banking product
      quality.
    diligencePath: Review FCA correspondence, internal audit reports, sanctions-screening test results and board risk packs.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004

