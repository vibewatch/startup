  - TE005
  figureRefs:
  - FE004
- id: technical-architecture-and-dependencies
  title: Technical Architecture and Dependencies
  body: 'Public architecture evidence is directional rather than source-code level. Engine’s own platform page and PwC case
    study establish a modular, API-based, cloud-native core with managed-service operation, product toggles and near-real-time
    customer data. Open Banking Excellence and Ozone API add an API-first open-banking integration layer and describe Engine
    as fully managed and modular. Finextra and the Salt/GFT case study support AWS dependence: Starling chose AWS as cloud
    provider, while Salt’s deployment ran as SaaS on AWS tooling through a private-cloud implementation. The public developer
    signal is thinner than expected for a technology vendor; the Starling Developers page fetched only a title, so the better
    public developer evidence comes from Banking Services’ RESTful API claim and the status page’s monitored Starling Bank
    API component.'
  claimRefs:
  - CE012
  - CE016
  - CE017
  - CE018
  - CE019
  - CE035
  - CE037
  - CE045
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: trust-quality-and-compliance
  title: Trust, Quality, Reliability and Compliance
  body: 'Trust evidence is mixed, which is important for diligence. Starling has strong public app-quality signals: 4.9/5
    from 601k App Store ratings, a 4.1 Trustpilot rating in the fetched archive and a Which? Recommended Provider score of
    86%. Starling also publishes a status page with monitored components for cards, Faster Payments, mobile apps, support,
    Marketplace and API, and the fetched panel showed 100.0% uptime over the displayed 90-day period. Security controls are
    well articulated at the product level, including identity verification, biometrics, 3D Secure, card controls, Confirmation
    of Payee, Call status indicators, Scam Intelligence and responsible disclosure. The counterweight is regulatory: the FCA’s
    2024 Final Notice found financial-crime controls and sanctions screening had failed to keep pace with growth, although
    it also noted remediation work, third-party testing and increased compliance resources.'
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE034
  - CE036
  - CE041
  tableRefs:
  - TE004
- id: roadmap-and-evidence-gaps
  title: Roadmap and Evidence Gaps
  body: 'The roadmap evidenced publicly is product and platform expansion rather than a detailed engineering changelog. FY26
    sources point to AI-assisted consumer features such as Spending Intelligence, Scam Intelligence and Starling Assistant;
    savings expansion through Cash ISA and Easy Saver; the Ember acquisition and HMRC-recognised Making Tax Digital solution
    for SMEs; and Engine scaling toward £100 million of committed ARR. This is a positive signal of product velocity, but
    it leaves several diligence gaps: no public source-code repository, no detailed incident postmortems, limited public microservice
    or event-driven design specifics, and no independently audited proof that post-FCA financial-crime remediation is durable.
    Those gaps do not invalidate the product, but they define the next diligence work before underwriting Engine-like technology
    claims at face value.'
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE032
  - CE033
  - CE042
