schemaVersion: report-v2
artifact: product-tech
slug: starling-bank
runDate: '2026-06-06'
company:
  name: Starling Bank
chapter:
  number: 5
  title: Product & Technology
  summary: Starling Bank’s product layer is a mature UK app-banking suite spanning personal, joint, business, Under 16s/Kite,
    savings, Marketplace and SME accounting workflows, while Engine by Starling turns the bank’s core into a cloud-native
    SaaS platform with evidenced Salt, AMP and Tangerine clients. The strongest technical proof is Engine’s API-based, cloud-native
    positioning corroborated by partners and clients; the main caveats are sparse public developer detail and the FCA’s 2024
    finding that financial-crime controls and sanctions screening failed to keep pace with growth.
sections:
- id: retail-and-sme-product-map
  title: Retail and SME Product Map
  body: 'Starling’s product surface is broad for a single UK mobile bank, but it is still organised around a current-account
    anchor rather than a universal financial supermarket. The personal account page presents the current account as the entry
    product and then routes users to savings accounts, a joint account and children’s cards inside the app. The homepage and
    app-store evidence add Spaces, Bills Manager, spending notifications, card controls, no Starling overseas card fees, Scam
    Intelligence and Spending Intelligence. Business customers get a separate current-account workflow with no monthly fee,
    web and mobile access, invoicing, tax ring-fencing, spending analytics, Post Office cash handling, cheque imaging and
    Starling Accounting. The best caveat is Marketplace: it is useful integration surface, but Starling discloses that it
    covers only a fraction of the wider market and may earn referral fees from some partners.'
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE043
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: customer-and-client-workflows
  title: User and Client Workflows
  body: 'The retail workflow is intentionally app-led: apply online, prove identity with documents and video, wait for a decision,
    and then manage day-to-day money through notifications, Spaces, card controls, support and optional add-ons. Children’s
    banking is not a standalone deposit product; it is a controlled Under 16s Space linked to an adult Starling account. SME
    workflows are more operational: a business owner can open an account, use invoicing, categorise transactions, attach receipts,
    ring-fence tax, produce reports and submit HMRC workflows where eligible. Engine’s workflow is different again. A client
    bank starts from a launch, migration or sidecar proposition, selects and configures products and operating workflows,
    then deploys in a managed cloud environment with local compliance and implementation partners where needed.'
  claimRefs:
  - CE002
  - CE006
  - CE009
  - CE010
  - CE011
  - CE038
  - CE039
  - CE040
  tableRefs:
  - TE002
