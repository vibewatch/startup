  - Diligence gap
  rows:
  - - Personal current account
    - UK consumers
    - Core app account; 3.5m customer marketing claim on page
    - No Starling overseas card fees, Spaces, notifications, support
    - Detailed active-user cohort economics not public
  - - Joint account
    - Households and partners
    - Supported in app-store evidence
    - Shared budgeting and household expense workflow
    - Dedicated fetched product page was not usable
  - - Business account
    - Sole traders and companies
    - 450,000+ businesses marketing claim
    - No monthly fees, invoicing, tax tools, analytics
    - Acceptance criteria and decline rates not public
  - - Starling Accounting
    - SMEs, landlords and sole traders
    - Built into business account; MTD workflows evidenced
    - Banking, bookkeeping and tax in one app
    - Pricing boundaries for upgrades need contract review
  - - Under 16s / Kite
    - Children aged 6-15, managed by adults
    - Free debit card and app linked to adult account
    - Parental controls, top-ups, child app
    - Not standalone child deposit account
  - - Savings Spaces and savings accounts
    - Retail savers
    - Spaces, Easy Saver, Fixed Saver and Cash ISA evidenced
    - Goal budgeting plus app-native savings
    - Rates are volatile and must be refetched
  - - Marketplace
    - Retail customers
    - Curated partner marketplace evidenced
    - API-enabled partner data sharing in app
    - Only a fraction of market; referral incentives
  - - Overdraft / borrowing
    - Eligible app users and Engine clients
    - Retail app evidence is limited; Engine/Tangerine evidence includes overdrafts and loans
    - Configurable borrowing in Engine stack
    - UK retail overdraft page fetch did not yield content
  - - B2B Banking Services
    - Fintechs and payment firms
    - Faster Payments API access evidenced
    - Cloud-native RESTful API access to FPS
    - Named customer proof not in retained sources
  - - Engine by Starling
    - Banks modernising or launching digital banks
    - SaaS core-banking platform with named clients
    - Cloud-native, API-based, managed-service core
    - Client implementation economics mostly private
  notes: Rows combine fetched official pages, app-store pages, and Engine/client proof; gaps identify unsupported or private
    items.
