    - type: missing-source
      severity: minor
      topic: customers
      missingEvidence: >-
        Updated customer count for Starling Bank as of 2025 or 2026 to compare against the ~3.6M
        figure from FY2023 cited in the FCA Final Notice.
      whyItMatters: >-
        Customer growth trajectory is central to the bank's scale and unit-economics narrative for
        later financial and valuation chapters.
      diligencePath: >-
        Access Starling Bank FY2025 annual report; monitor Starling press releases and newsroom
        for updated customer count disclosures; check the Engine by Starling website which references
        annual report figures.
      relatedQuestionRefs:
        - QO016
    - type: private-evidence-only
      severity: blocking
      topic: funding
      missingEvidence: >-
        Total lifetime capital raised by Starling Bank across all pre-2022 rounds, including specific
        round sizes for Series A, B, C, and any interim tranches; participation by investor across rounds;
        and any convertible notes, debt facilities, or SAFE instruments.
      whyItMatters: >-
        Without the full capital history, diligence on dilution, effective cost of capital, and
        preferences/liquidation waterfalls is impossible. The £2.5B 2022 valuation cannot be contextualised
        against prior invested capital without this data.
      diligencePath: >-
        Request full cap table from management; review Companies House PSC register and share allotment
        history; seek Chrysalis Investments NAV disclosure for carrying value benchmarks.
      relatedQuestionRefs:
        - QO007
