company:
  name: Starling Bank
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Starling Bank Limited is a fully licensed UK digital bank founded in 2014 by Anne Boden,
    authorised by the Prudential Regulation Authority in July 2016, and headquartered in London.
    It is the first bank in British history founded by a woman, has grown to approximately 3.6 million
    customers by 2023, and has reached pre-tax profitability in each year from FY2022 onwards. The
    bank was fined £28.96M by the FCA in October 2024 for financial crime control failures, and its
    FY2025 pre-tax profit fell 25% year-on-year to approximately £223M. Current CEO Raman Bhatia
    took over from Anne Boden in June 2024.
sections:
  - id: section-identity
    title: Identity, Licensing, and Corporate Structure
    body: >-
      Starling Bank Limited is a UK private limited company (Companies House no. 09092149) incorporated
      on 18 June 2014. It was originally registered under the name POSSIBLE FS LIMITED, renamed to
      STARLING FS LIMITED in January 2016, and adopted its current trading name shortly thereafter.
      The bank holds a full UK banking licence: it was authorised by the Prudential Regulation Authority
      (PRA) on 12 July 2016 and has been regulated by both the Financial Conduct Authority (FCA) and
      the PRA under registration number 730166 ever since.

      The company describes itself as 100% independent — not owned by any other bank — with equity held
      by founder Anne Boden and current employees, an employee benefits trust, and several external
      financial investors. Its registered address is the 5th Floor, London Fruit and Wool Exchange,
      1 Duval Square, London E1 6PW.

      Starling operates as a branchless, app-first digital bank offering personal current accounts,
      business bank accounts, joint accounts, overdrafts, unsecured loans, mortgages (via intermediary),
      and the Kite debit card for children under 16. Beyond retail banking, it provides B2B banking
      infrastructure services (Faster Payments indirect access) and has spun out a separate SaaS
      banking technology business called Engine by Starling. Its SIC classification is 64191 (Banks).
      The bank is protected under the FSCS up to £85,000 per eligible customer.
