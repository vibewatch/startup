      severity: material
      topic: fy2024-metrics
      missingEvidence: >-
        Specific revenue, pre-tax profit, customer count, total deposits, and net interest margin for
        FY2024 (year to 31 March 2024) from the published Companies House accounts or a primary news
        article.
      whyItMatters: >-
