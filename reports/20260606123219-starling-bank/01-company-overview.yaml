  - id: section-leadership
    title: Founders, Leadership, and Governance
    body: >-
      Starling Bank was founded by Anne Boden, a career banking executive who previously held senior
      roles at Allied Irish Banks, UBS, RBS, and ABN AMRO. She is the only person in British banking
      history to have founded a bank, and was CEO from the company's incorporation in 2014 through
      the end of June 2024. The Starling About page states the bank is "the only bank in British
      history that's been founded by a woman." Anne Boden had also co-authored a book about the
      founding of Starling ("Banking On It"), reinforcing the founder narrative that dominates
      the company's identity.

      Raman Bhatia was formally appointed as a director of Starling Bank Limited on 24 June 2024,
      per the Companies House filing history. Anne Boden's appointment as director was terminated on
      30 June 2024, confirming the CEO succession that had been described in prior press reporting. As
      of the run date of this report (June 2026), Raman Bhatia is the serving CEO. Bhatia was
      previously CEO of OVO Energy, giving him a background in consumer tech services rather than
      traditional banking.

      Key-person dependence shifted materially with the Boden-to-Bhatia transition. Anne Boden was
      not merely the founding CEO but also a significant equity holder and the public face of the
      challenger-bank narrative. The transition, while apparently orderly, removes the founder from
      day-to-day management. Other known senior executives include Harriet Rees (Group Chief
      Information Officer, cited in 2026 AI press release), but full board composition and non-executive
      director names were not publicly confirmed in sources fetched for this run; that represents a
      material governance gap.

      Starling notes that 43% of its Senior Managers are women and it targets 50% by 2027, and has
      participated in the Women in Finance Charter for eight years.
