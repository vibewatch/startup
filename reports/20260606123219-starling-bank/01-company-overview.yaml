callouts:
  - calloutType: strength
    title: Full UK banking licence and proven profitability
    body: >-
      Starling's full PRA/FCA banking authorisation, achieved in 2016, sets it apart from many fintech
      peers. Combined with four consecutive profitable years (FY2022-FY2025), this positions the bank
      as a mature platform rather than a growth-stage startup burning cash. The combination of the
      consumer bank, business bank, B2B payments service, and Engine by Starling SaaS platform
      represents meaningful diversification.
    claimRefs:
      - CO003
      - CO025
      - CO026
  - calloutType: risk
    title: FCA enforcement creates IPO and valuation headwind
    body: >-
      The October 2024 FCA Final Notice (£28.96M fine) cited "shockingly lax" financial crime controls
      and raised questions about governance and oversight sufficiency. The Guardian's Nils Pratley wrote
      that Starling was "simply not fit to float" after the fine. FY2025 profitability declined 25%,
      partly due to the fine and £28M in Bounce Back Loan losses. Together these create a material
      headwind for any 2025-2026 IPO.
    claimRefs:
      - CO034
      - CO035
      - CO036
      - CO037
      - CO038
  - calloutType: insight
    title: CEO transition removes the founder narrative
    body: >-
      Anne Boden's departure as director in June 2024 ends a decade of founder-led operations. Raman
      Bhatia brings consumer-tech experience (OVO Energy) but no banking-CEO track record. The founder's
      personal brand was a key marketing asset ("the only bank in British history founded by a woman").
      Key-person dependence has shifted from one risk profile (founder-concentration) to another
      (untested CEO in a regulated bank under FCA scrutiny).
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
  - calloutType: assumption
    title: Revenue and headcount for FY2024 and FY2025 are evidence gaps
    body: >-
      Specific revenue figures and headcount for FY2024 (year to 31 March 2024) and FY2025 (year to
      31 March 2025) were not accessible in text form from publicly available sources during this
      research run. Starling Bank's newsroom was blocked (403 Forbidden) and the annual report PDFs
      were not retrievable. The FY2025 pre-tax profit figure of ~£223M and the 25% year-on-year decline
      are sourced from Guardian headline summaries, not the primary annual report.
    claimRefs:
      - CO042
      - CO043
      - CO044
