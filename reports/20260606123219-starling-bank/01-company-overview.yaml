  - id: section-metrics
    title: Scale, Metrics, and Product Footprint
    body: >-
      The FCA Final Notice (October 2024) provides the most authoritative third-party data on Starling's
      pre-2024 growth trajectory. The notice states that Starling's revenue grew from £13,000 in 2016
      to £452.8 million in the financial year ending March 2023 (FY2023), and that the customer base
      grew from approximately 43,000 in 2017 to approximately 3.6 million in 2023. These figures are
      cited by a regulator and represent the strongest available public evidence on historical scale.

      For FY2024 (year ending 31 March 2024), accounts were filed at Companies House on 3 July 2024
      but specific profit, revenue, and customer figures from those accounts were not retrievable
      through public sources during this research run; this represents a material evidence gap. For
      FY2025 (year ending 31 March 2025), the Guardian topic page headline summaries report that
      pre-tax profit fell approximately 25% to £223 million, with £28 million of losses attributed
      to the government's Bounce Back Loan Scheme. Engine by Starling's homepage references the
      "Starling Annual report and accounts 2025" as the data source for its own case study but the
      specific numerical figures were not accessible in text form.

      From a product perspective, Starling's core offerings include: personal current accounts
      (launched May 2017); joint accounts; the Kite debit card for children under 16; business current
      accounts (launched March 2018, which the newsroom describes as the "UK's first digital business
      bank account"); the Starling Marketplace (in-app integrations with third-party fintechs including
      PensionBee, Wealthsimple, Habito, and Kasko); B2B banking infrastructure services (first UK bank
      to offer Faster Payments access via API); and Engine by Starling (a SaaS banking platform for
      third-party bank clients including Salt Bank in Romania).

      In March 2026, Starling launched Starling Assistant, an agentic AI financial assistant built on
      Google Gemini and Google Cloud, initially available on an opt-in basis to personal account
      customers. This was cited as one of the bank's most significant technology developments since
      the 2021-2022 product expansion wave.
