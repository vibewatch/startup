        - label: "Total UK adult population"
          value: "~55 million adults"
          detail: "Approximate; UK population 18+ per ONS estimates"
        - label: "Online/remote banking users (TAM)"
          value: "~48 million (88 %)"
          detail: "Finder survey 2024; includes all UK adults using any digital banking channel"
        - label: "Digital-only bank account holders (SAM)"
