  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: engine-market
      missingEvidence: >
        Engine by Starling's revenue contribution, licensing fee structure, total number of
        live bank clients, and contract terms are not publicly disclosed. No filed accounts,
        press releases, or third-party analyst coverage providing Engine-specific financial
        metrics were found during this research.
      whyItMatters: >
        Engine is a potential second revenue pillar and international growth vector for
        Starling; without visibility into its revenue scale, contract economics, or customer
        pipeline, investors cannot properly assess its valuation contribution or execution risk.
      diligencePath: >
        Request Engine by Starling revenue breakdown and client list via management
        presentation; review any separately filed accounts for Engine by Starling Limited
        (Companies House No. 13925405); check FCA register for any Engine-specific regulatory
        filings.
      relatedQuestionRefs: [QM018]

    - type: missing-source
      severity: material
      topic: sme-market
      missingEvidence: >
        A verified primary-source count of UK SMEs with active business bank accounts, and
        Starling's verified percentage share of the UK SME banking market, were not found
        in accessible public sources during this research. The FSB and UK Government business
        population estimates pages returned 404 errors at the time of research.
      whyItMatters: >
        Without a verified denominator for UK SME banking relationships, Starling's ~450,000
        SME customer figure cannot be placed in authoritative market-share context, limiting
        conviction in the SME segment sizing.
      diligencePath: >
        Retrieve DBEIS Business Population Estimates 2024 report directly from GOV.UK/ONS
        or DBEIS; cross-reference with UK Finance SME lending and deposit data; request
        Starling management's own TAM analysis for SME banking.
      relatedQuestionRefs: [QM014, QM004]

    - type: missing-source
      severity: minor
      topic: market-sizing
      missingEvidence: >
        No UK-specific neobanking revenue market size figure from a paywalled-free tier
        analyst source (Statista, Euromonitor, IBISWorld) was accessible during this research.
        Grand View Research's aggregate neobanking figure blends global geographies and
        balance-sheet volumes, not UK-only fee/NII revenue.
      whyItMatters: >
        Without a UK-specific TAM in revenue terms, market-size claims in this chapter
        rely on user counts and adoption percentages rather than commercially relevant
        addressable revenue pools, which could lead to over- or under-statement of
        Starling's market opportunity.
      diligencePath: >
        Obtain a Statista Market Insights subscription for UK neobanking NII forecasts;
        alternatively, derive an implied revenue TAM from BoE Bankstats household overnight
        deposit data multiplied by Bank Rate spreads and compare to Starling's disclosed NIM.
      relatedQuestionRefs: [QM016, QM024]

    - type: enumeration-incomplete
      severity: minor
      topic: engine-market
      missingEvidence: >
        Only Salt Bank (Romania) was publicly confirmed as an Engine by Starling client. News
        reports have referenced ABN AMRO discussions but no confirmed contract was identified
        in accessible sources. The total number of Engine clients and their geographies remain
        unconfirmed from primary sources.
      whyItMatters: >
        Engine's commercial traction and geographic diversification directly affect the
        credibility of Starling's international growth narrative; single-client exposure
        introduces concentration risk.
      diligencePath: >
        Search Companies House filings for Engine by Starling Limited; monitor press releases
        from Engine by Starling; review any analyst coverage in The Banker, Finextra, or
        FinTech Futures that may reference signed clients post-2024.
      relatedQuestionRefs: [QM005]
