callouts:
  - calloutType: risk
    title: NIM Compression Is the Single Largest Unquantified Risk
    body: >
      Starling's profitability in FY2023–FY2024 was disproportionately driven by earning the
      Bank of England base rate on a large retail deposit base at near-zero deposit cost. With
      the BoE base rate declining from 5.25% (August 2023–August 2024) toward an estimated
      3.5–4% by end-2025, and Starling's deposit base estimated at £11–12bn, a 100bps rate
      reduction could reduce annual NII by approximately £110–120m. The full impact depends on
      the proportion of deposit balance held at BoE vs. deployed into the loan book, and the
      rate sensitivity of the loan book itself — data not available without the filed accounts.
    claimRefs:
      - CI022
      - CI023
      - CI034

  - calloutType: risk
    title: FCA Enforcement Fine and Regulatory Tail Risk
    body: >
      The October 2024 FCA fine of £28,959,426 for AML/sanctions control failures (December
      2019–November 2023) was the largest enforcement action against a UK challenger bank and
      represents a structural governance risk signal. While the VREQ was formally closed in
      April 2024 and the Economic Crime Enhancement Plan runs through 2025, the FCA's 2022
      multi-firm review of challenger banks (last updated December 2025) underscores that the
      regulator continues active sectoral scrutiny. Further enforcement actions or PRA capital
      add-ons are a tail risk.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI015
      - CI016

  - calloutType: strength
    title: Four Consecutive Profitable Years at Scale
    body: >
      Achieving £223m pre-tax profit in FY2025 — the fourth consecutive year of profitability
      — while absorbing £57m in one-off charges (FCA fine + BBL losses) demonstrates a
      remarkably resilient underlying business. The revenue trajectory from £452.8m in FY2023
      to an estimated £630–680m in FY2025 confirms that Starling has moved beyond the unit
      economics experimentation phase characteristic of earlier-stage challenger banks. Its
      fully digital, branchless model preserves structural cost advantage over incumbent banks.
    claimRefs:
      - CI009
      - CI010
      - CI020
      - CI037

  - calloutType: recommendation
    title: "Primary Diligence: Access the Filed Annual Accounts"
    body: >
      The FY2025 annual accounts (Companies House, 226 pages) and the Pillar 3 disclosure
      (referenced on Starling's investor page) are the primary information items required
      before forming a financial view. Twelve material data items — including total revenue,
      NIM, deposit base, loan book, CET1 capital ratio, and cost-to-income ratio — cannot be
      assessed without these documents. The accounts are filed and publicly available at
      Companies House; access was blocked by Starling's website during this review.
    claimRefs:
      - CI038
      - CI039
      - CI040
      - CI041
      - CI042

