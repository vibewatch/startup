company:
  name: Starling Bank

chapter:
  number: 4
  title: Financials
  summary: >
    Starling Bank posted its fourth consecutive year of pre-tax profitability in FY2025 (year to
    31 March 2025), earning £223m pre-tax — a 25% decline from FY2024 driven by a £28.9m FCA
    enforcement fine, approximately £28m of Bounce Back Loan credit losses, and elevated
    remediation spend. Revenue grew from £13,000 in FY2016 to £452.8m in FY2023, and FY2024
    is estimated to have reached approximately £650–700m on rising net interest income, before
    FY2025 saw margin compression begin. Capital and liquidity positions remain opaque to external
    reviewers pending full access to filed accounts; the FY2025 annual report (226 pages, filed
    Companies House) is the primary source for capital ratio and deposit data that were not
    directly accessible during this review.

sections:
  - id: revenue-model-and-growth
    title: Revenue Model and Historical Growth Trajectory
    body: >
      Starling Bank operates a multi-stream UK banking business with revenue derived principally
      from net interest income on customer deposits and loans, non-interest fee income (overdraft,
      card interchange, business-account subscription), and a growing B2B segment. The bank
      holds a full banking licence granted by the PRA on 12 July 2016 (FCA/PRA FRN 730166) and
      is regulated under both the FCA and PRA. It is classified SIC 64191 (Banks) at Companies
      House (company number 09092149).

      Revenue growth has been extraordinary: from £13,000 in FY2016 to £452.8m in FY2023
      (year to March 2023) — a ~34,800-fold increase in seven years. The FCA's September 2024
      Final Notice independently verified FY2023 revenue of £452.8m and calculated cumulative
      revenue from December 2019 to November 2023 at £1,119,042,195 — confirming a sharp
      growth arc as interest rates rose from late 2021. With over four million accounts reported
      by the company as of mid-2026, and a track record of four consecutive profitable years
      through FY2025, Starling has achieved at-scale unit economics that most challenger bank
      peers have not replicated.

      Revenue streams include: (i) personal current accounts (primary deposit-gathering, free
      at standard tier with overdraft monetisation); (ii) business current accounts (paid
      subscription tiers £7–£35/month plus per-transaction fees); (iii) net interest income
      on deposits placed with the Bank of England and loan origination; (iv) Starling
      Marketplace in-app third-party financial product distribution; and (v) Engine by Starling
      (B2B SaaS core-banking-as-a-service platform). The B2B banking services arm also offers
      FPS indirect access and API-based payment clearing to financial institutions. At the
      time of this review, no disaggregated revenue line disclosure was publicly available for
      the B2B vs. retail split.
