  - id: capital-adequacy-funding-deposits
    title: Capital Adequacy, Funding Profile, and Deposit Base
    body: >
      Starling Bank is regulated by the PRA under the UK Capital Requirements framework. As a
      deposit-taking bank, it must maintain minimum CET1 capital ratios set by the PRA under
      its individual capital guidance (ICG). The company is authorised and regulated by both
      the FCA and PRA (FRN 730166). The bank has no external debt issuance recorded in its
      Companies House charges register beyond a March 2019 fixed charge (code 0909 2149 0005),
      suggesting capital structure reliance on equity funding and retained earnings rather than
      wholesale market debt.

      The bank's primary funding source is its customer deposit base, which has grown in
      tandem with account growth. As of FY2023 the bank served 3.6 million customers;
      as of mid-2026 the about-page reports over four million accounts. Specific deposit
      balances, loan-to-deposit ratios, and CET1 capital ratios from the filed FY2025 accounts
      were not directly accessible during this review and represent a material evidence gap.

      Starling's investors include Goldman Sachs, Fidelity, Qatar Investment Authority, Chrysalis
      Investments, Railpen (the Railway Pension Scheme), Millennium Management, and Harry
      McPike; the bank describes itself as "100% independent" and not owned by any other bank.
      No new external equity capital raise was publicly reported during FY2024 or FY2025,
      suggesting the bank is self-funding on retained earnings at this stage of its development.

      The March 2019 fixed charge on Companies House is the only formal security arrangement
      on record; no newer charges were visible in the filing history as of the date of this
      review. The absence of wholesale debt raises (CDS spreads unavailable as a private company)
      means capital adequacy assessment depends entirely on the filed accounts and PRA
      supervisory disclosures, neither of which was directly available.
    claimRefs:
      - CI026
      - CI027
      - CI028
