  - id: fy2024-trend-and-revenue-quality
    title: FY2024 Context, Revenue Quality, and Margin Mix
    body: >
      FY2024 (year to 31 March 2024) was Starling Bank's third consecutive profitable year.
      Annual accounts were filed at Companies House on or around 3 July 2024 (235 pages). The
      FY2024 pre-tax profit is estimated at approximately £297m, derived from the reported
      25% YoY decline to £223m in FY2025. No independent corroboration of FY2024 revenue was
      accessible during this review; based on the FCA-confirmed revenue trajectory and rising
      UK base rate environment (BoE base rate peaked at 5.25% August 2023 to August 2024),
      FY2024 revenue is estimated to have been approximately £650–700m, driven predominantly
      by net interest income on a large customer deposit base earning higher yields on central
      bank reserves and loans.

      Revenue quality is high relative to typical challenger bank peers: the deposit-funded
      interest income model is structural rather than speculative, and the bank carries a
      full banking licence (not an e-money institution) with FSCS deposit protection. The
      business account subscriber base adds recurring fee revenue with low marginal cost.
      Engine by Starling provides a technology licensing revenue stream that is non-deposit
      and potentially higher-margin, though segment disclosure is unavailable.

      The key risk to revenue quality is NIM compression. As UK base rates fell from 5.25% to
      4.5% by June 2025, Starling's interest income on central bank reserves and variable-rate
      loans will be under pressure. The Bank of England cited ongoing rate reduction path.
      Additionally, the Bounce Back Loan credit loss of ~£28m in FY2025 indicates non-trivial
      asset quality risk in the government-guaranteed lending portfolio.

      The FCA's 2022 challenger bank review (published 22 April 2022, last updated 3 December
      2025) identified sector-wide financial crime control weaknesses; Starling subsequently
      received its formal fine and has been implementing an Economic Crime Enhancement Plan
      (2023–2025). Sustained regulatory investment in financial crime controls is a cost driver
      that will persist beyond FY2025.
