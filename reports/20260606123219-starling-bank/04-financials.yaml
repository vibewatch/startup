  - id: fy2025-annual-results
    title: "FY2025 Results: Fourth Consecutive Year of Profit"
    body: >
      For the financial year ended 31 March 2025, Starling Bank reported a pre-tax profit of
      £223m, representing a 25% year-on-year decline from the FY2024 result (estimated ~£297m
      derived from the reported percentage change). The accounts were filed at Companies House
      with 226 pages, though the full document was not directly accessible during this review.

      Three non-recurring items significantly weighed on FY2025 profitability. First, the FCA
      imposed a financial penalty of £28,959,426 on 27 September 2024 (payable 11 October 2024)
      for serious financial crime control failures between December 2019 and November 2023,
      including breaches of a Voluntary Requirement (VREQ) and deficient financial sanctions
      screening. Second, the Guardian reported approximately £28m of credit losses attributable
      to Bounce Back Loans (government-guaranteed COVID support loans) in which the bank
      acknowledged its own controls as insufficient. Third, the company paid staff bonuses of
      £24.6m — described as a fivefold increase above normal — in FY2025, suggesting that
      despite the headline profit decline, management treated underlying performance as strong.

      The FCA fine was assessed at Level 4 seriousness (15% of £1.119bn cumulative revenue
      over the breach period = £167.9m, reduced to £40m for proportionality, then discounted
      30% for cooperation to £28.9m). The penalty was an expense in FY2025.

      Engine by Starling's investor-facing website (as of June 2026) references the Starling
      Annual Report and Accounts 2025 as the source for KPIs including: account count, active
      customers, NPS score, revenue, pre-tax profit, and NIM — indicating that NIM is a
      published metric in the filed accounts. Exact NIM figures were not accessible in this
      review.
