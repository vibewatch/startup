  - id: cost-structure-efficiency
    title: Cost Structure, Operational Efficiency, and Personnel Costs
    body: >
      Starling operates with a branchless, digital-native model across four offices (London,
      Cardiff, Southampton, Manchester) with "a team of thousands" according to the about page
      (exact headcount not publicly disclosed for FY2025). The careers page indicates global
      recruitment from these four primary UK sites, with the engineering function central to
      product delivery. The cost-to-income ratio (CIR) was not extractable from publicly
      accessible sources during this review.

      The bank incurred £24.6m in staff bonuses in FY2025 — a fivefold increase above
      normalised levels, per Guardian reporting. This is exceptional and likely reflects a
      management decision to sustain talent retention in a year of regulatory headwinds,
      funded from what management deemed a strong underlying trading result. The FCA fine of
      £28.9m and ~£28m of BBL credit provisions represent approximately £57m of one-off costs
      in FY2025 that, if stripped out, would imply an underlying pre-tax profit closer to
      ~£280m.

      The cumulative revenue from December 2019 to November 2023 of £1.119bn against which
      the FCA calculated the Level 4 fine implies a four-year cost base that must have been
      well below that level given the reported profitability in FY2022–FY2023. However,
      operating leverage metrics (gross margin, cost-per-account, technology unit cost)
      require the filed accounts to quantify.

      Financial crime compliance is now a material permanent cost centre. The bank stated
      in its VREQ remediation that it had "significantly increased its financial crime compliance
      resource" and was operating an Economic Crime Enhancement Plan (2023–2025). This spend
      is incremental to ongoing baseline regulatory compliance and will partially offset any
      NIM-driven revenue growth in FY2026.
    claimRefs:
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036

  - id: financial-verdict-diligence-blockers
    title: Financial Verdict and Diligence Blockers
    body: >
      Starling Bank's financial trajectory — from zero to £452.8m revenue in seven years with
      four consecutive profitable years — is among the most impressive achieved by any
      European digital bank at comparable scale. The FY2025 profit of £223m, even after a
      25% YoY decline, would represent strong absolute profitability for a UK challenger bank.

      However, significant diligence blockers remain. First, the FCA fine represents a
      concluded regulatory enforcement action but does not preclude further regulatory scrutiny;
      the VREQ was only closed in April 2024 and the Economic Crime Enhancement Plan runs
      through 2025. Second, the BBL credit loss suggests asset quality risk in the lending
      book that requires further investigation. Third, the structural NIM compression risk
      as UK base rates decline from 5.25% will disproportionately affect Starling compared
      to traditional banks that match-fund liabilities more tightly.

      Fourth, the IPO pathway — which was contemplated at ~£4bn valuation per Bloomberg/
      Reuters reporting in August 2024 — was explicitly criticised by Guardian columnist
      Nils Pratley (October 2024) as premature given the FCA fine timing. The subsequent
      CEO change (Raman Bhatia stepping down, per Finextra, 2025) adds governance uncertainty.

      The filed annual accounts for FY2025 (Companies House, 226 pages) and FY2024 (235 pages)
      represent the primary evidence base that would resolve material gaps in deposit size,
      loan book composition, capital ratios, NIM, and CIR. These documents were not directly
      accessible during this review and remain the primary diligence ask.
    claimRefs:
      - CI037
      - CI038
      - CI039
      - CI040
      - CI041
      - CI042
