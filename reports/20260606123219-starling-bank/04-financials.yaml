  - id: TI006
    title: Financial Risk Register
    columns:
      - Risk
      - Evidence
      - Severity
      - Mitigation / Status
    rows:
      - - NIM compression as UK base rates decline
        - "BoE cut base rate from 5.25% to 4.5% by June 2025; further cuts expected"
        - Material
        - "Model revenue sensitivity: 100bps rate cut on ~£12bn deposits ≈ £120m annual revenue impact"
      - - Bounce Back Loan credit losses
        - "~£28m loss in FY2025; CEO acknowledged own control failures as a factor"
        - Material
        - BBL portfolio run-off; government guarantee may recover some losses
      - - Regulatory cost escalation (post-FCA fine)
        - "Economic Crime Enhancement Plan 2023–2025; financial crime headcount significantly increased"
        - Material
        - Plan in-progress; third-party testing confirmed systems operating effectively by end of VREQ period
      - - FCA enforcement tail risk
        - "VREQ closed April 2024; FCA can impose further requirements; challenger bank sector under scrutiny"
        - Moderate
        - No new enforcement action publicly reported as of June 2026; remediation complete
      - - Leadership / governance continuity
        - "CEO Raman Bhatia reportedly stepped down in 2025 (Finextra); founder Anne Boden departed 2023"
        - Moderate
        - Succession not yet confirmed in available public sources
      - - IPO timing risk
        - "IPO considered at ~£4bn valuation August 2024; Nils Pratley: 'not fit to float' October 2024"
        - Minor (investor exit, not operational)
        - Post-fine IPO timeline delayed; capital adequacy not at risk
      - - Concentration risk (NIM on central bank reserves)
        - Large deposit base parked at BoE; NIM driven by policy rate not credit spread
        - Material
        - Loan book growth (including mortgage capability via Kensington interest) reduces concentration
      - - Kensington Mortgage Platform acquisition interest
        - "City A.M. (January 2022): Starling among bidders for Kensington lending platform"
        - Informational
        - Acquisition interest suggests intent to grow secured lending; outcome not confirmed
    notes: >
      Risk severity ratings are qualitative assessments based on publicly available information.
      Quantitative NIM sensitivity assumes an approximate deposit base of £12bn (estimated from
      industry context; not confirmed from filed accounts). Actual sensitivity depends on the
      mix of fixed vs. variable rate assets and the proportion of liabilities that are
      non-interest-bearing (current accounts vs. savings products).
