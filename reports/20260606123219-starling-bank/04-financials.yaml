  evidenceGaps:
    - type: access-blocked
      severity: blocking
      topic: annual-report-access
      missingEvidence: >
        Full FY2025 and FY2024 Starling Bank annual accounts (Companies House, 226 and 235 pages
        respectively), including income statement, balance sheet, capital ratios (CET1, TNAV),
        deposit balance, loan book, NIM, CIR, and segment reporting.
      whyItMatters: >
        Without the filed accounts, revenue, NIM, deposit base, loan book, capital adequacy,
        and efficiency metrics cannot be assessed — representing approximately twelve of the
        planned unit economics and capital adequacy table fields that appear as nulls.
      diligencePath: >
