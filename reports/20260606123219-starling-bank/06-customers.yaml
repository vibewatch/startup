  - id: TU005
    title: Expansion Drivers and Concentration Risks
    columns:
      - Expansion Driver
      - Concentration / Dependency Risk
      - Impact Level
      - Diligence Path
    rows:
      - - CASS switching inflows (UK account switchers)
        - "100% UK customer base; single-jurisdiction regulatory, macro, and FX exposure"
        - High
        - Review UK Finance CASS dashboard for Starling net gain / loss over 2023–2026; compare to Monzo and Revolut
      - - Accountant referral programme (SME channel)
        - Intermediary dependency; accountant churn or recommendation shift could reduce SME acquisition pipeline
        - Medium
        - Quantify % of 450k+ business accounts sourced via accountant referral vs. organic; test concentration in top accounting firms
      - - Marketplace ecosystem (third-party financial products)
        - Platform lock-in depends on partner contract continuity; Marketplace take-rate and engagement undisclosed
        - Medium
        - Obtain Marketplace partner count, active-connection rate, and commission revenue from filed accounts
      - - Engine by Starling international expansion
        - UK retail concentration partially offset by Engine's global licensing; but Engine revenue is undisclosed
        - Medium-positive
        - Request Engine revenue as % of total from FY2025 filed accounts; review contract terms with Salt Bank and other clients
      - - FCA fine reputational impact (Oct 2024)
        - Trust damage from VREQ breach revelations; IPO delayed; FCA enhanced scrutiny ongoing
        - High
        - Monitor customer switching-away volumes post-fine; review FCA biannual complaints data and any further remedial requirements
    notes: >-
      Expansion drivers and concentration risks are partially inferrable from public sources but
      key metrics (CASS net flows, Marketplace engagement, Engine revenue, post-fine churn) are
      not publicly available and require diligence access or filed accounts review.
