company:
  name: Starling Bank
chapter:
  number: 6
  title: Customers
  summary: >-
    Starling Bank has grown from approximately 43,000 accounts at launch in 2017 to over four
    million accounts by mid-2026, comprising more than 3.5 million personal current account
    holders and over 450,000 business accounts, all in the UK. Customer satisfaction signals
    are strong — 4.1/5 on Trustpilot from 45,462 reviews, a 97% recommendation rate in Finder's
    2026 survey, and a sixth consecutive Which? Recommended Provider award. The FCA's October
    2024 fine of £28.96 million for opening 54,359 accounts for high or higher-risk customers in
    breach of a Voluntary Requirement highlights a material gap between the bank's aggressive
    growth posture and its compliance controls, tempering an otherwise compelling customer proof
    story and deferring a planned IPO.

sections:
  - id: customer-segments-and-scale
    title: Customer Segments and Scale
    body: >-
      Starling Bank serves customers across four primary retail account types — personal current
      accounts, business bank accounts, joint accounts, and multi-currency accounts — plus the
      Kite debit card for children aged 6 to 15 linked to a parent's personal or joint account.
      As of mid-2026, the About page discloses "over four million accounts," while the personal
      current account page states "join over 3.5 million customers," indicating that personal
      account holders constitute the large majority of the total account base. The business bank
      account page separately confirms "450,000+ businesses bank with Starling," representing
      approximately 11% of total accounts.

      Starling operates exclusively in the UK for retail customers. There are no international
      branches, no retail banking partnerships outside the UK, and no separately reported
      international retail customer count. The bank positions itself as branchless and app-first,
      with 24/7 UK-based human support via in-app chat and telephone. All eligible deposits are
      protected by the Financial Services Compensation Scheme (FSCS) up to £120,000 per depositor,
      covering both personal and business account holders.

      Beyond retail, Starling serves two B2B customer segments. Engine by Starling licences its
      core banking technology to digital banks globally — Salt Bank in Romania is a publicly named
      client — positioning Starling as a platform business with a revenue stream decoupled from
      UK-only retail concentration. The B2B Banking Services division provides indirect access to
      the Faster Payments System via API, serving fintechs, electronic money institutions, and
      payment service providers in the UK, making Starling the first UK bank to offer Faster
      Payments access through a RESTful API interface. Neither the Engine customer count nor the
      B2B Banking Services revenue is publicly disclosed.
    claimRefs:
