  - id: satisfaction-awards-and-experience
    title: Customer Satisfaction, Awards, and Experience Quality
    body: >-
      Trustpilot carries 45,462 reviews for Starling as of February 2026, with an aggregate
      rating of 4.1/5 ("Great"). An AI-generated review summary on Trustpilot highlights
      ease of use, instant notifications, Spending Spaces as a standout budgeting tool, and the
      app's modern design as the dominant positive themes. A Finder.com customer satisfaction
      survey conducted in 2026 found that 97% of surveyed Starling customers would recommend the
      bank to a friend — a metric Finder attributed to a combination of app quality, zero overseas
      fees, and 24/7 in-app support. Finder also awarded Starling its 2025 Provider of the Year
      Award for Travel Debit Card and its 2024 Customer Satisfaction Award for Current Accounts.

      The Google Play listing confirms that Starling has been awarded Which? Recommended Provider
      status for a sixth consecutive year. Which? Recommended Provider designation requires
      sustained performance across service satisfaction, transparency, and product value, making a
      consecutive run of six years a materially credible signal. The Google Play store also
      confirms "Voted Best Business Banking Provider 2023" as a separate award.

      Adverse signals exist. Trustpilot contains a minority of critical reviews focused on
      complaint handling, pending transactions, and in one instance a comparison unfavourably with
      Monzo. The Guardian topic page documents a March 2024 reader problem where a grieving husband
      was refused a £10,000 scam refund — indicative of friction in fraud claim handling, a risk
      category of growing regulatory focus under the Payment Systems Regulator's mandatory
      reimbursement regime effective October 2024. Starling's fraud page and mobile security page
      confirm the bank has implemented proactive measures: an AI-powered Scam Intelligence tool
      that analyses marketplace screenshots, call status banners that confirm when a call is
      genuinely from Starling, and a commitment never to request PIN or password over the phone.
      The cost of living support page reflects active listening to customer financial distress,
      including free budgeting tools open to non-customers.
