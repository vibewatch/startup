tables:
  - id: TU001
    title: Customer Segment Map
    columns:
      - Segment
      - Buyer / User / Payer
      - Use Case
      - Scale (public data)
      - Revenue / Strategic Value
      - Evidence Gap
    rows:
      - - Personal current account
        - UK adults (individuals)
        - Day-to-day banking, budgeting (Spaces), travel spending (zero overseas fees), savings, overdraft
        - "3.5M+ (company-stated, mid-2026)"
        - Fee-free; monetised via overdraft interest (15–35% EAR), interchange, net interest on deposits
        - Primary bank share undisclosed; NPS and churn not public
      - - Business bank account
        - UK SMEs — sole traders, limited companies, LLPs, start-ups
        - Business payments, invoicing, accounting integration, tax ring-fencing (Spaces)
        - "450k+ businesses (company-stated, mid-2026)"
        - Fee-free standard tier; accounting integrations increase stickiness; contributes to deposit base
        - Revenue per account, paid-vs-free split, and average tenure not disclosed
      - - Joint account
        - UK adult couples or households
        - Shared household expense management; paired with personal accounts
        - Not separately disclosed
        - Same monetisation tier as personal; joint-account adoption adds incremental deposits
        - Joint account count not reported independently
      - - Multi-currency account
        - UK residents with international payment or travel needs
        - International spending and FX transfers to 34 countries
        - Not separately disclosed
        - Zero FX fee from Starling; Mastercard exchange rate applied
        - Count not reported; revenue contribution not disclosed
      - - Kite debit card (ages 6–15)
        - Parents (account holders); children (users)
        - Pocket money management, controlled spending for children linked to parent account
        - Not separately disclosed
        - Retention/engagement instrument for family banking; no direct revenue line disclosed
        - Uptake not reported; attrition of family accounts at child's adulthood unknown
      - - Engine by Starling (B2B SaaS)
        - Banks and financial institutions worldwide seeking core banking platform
        - Full-stack cloud-native core banking software for launching or modernising digital banks
        - Not disclosed; Salt Bank (Romania) is publicly named client
        - SaaS licensing and setup fees; geographic diversification away from UK retail
        - Named client list largely private; Engine revenue as % of total not disclosed
      - - B2B Banking Services (Faster Payments)
        - UK fintechs, EMIs, payment service providers
        - Indirect API access to Faster Payments System; cloud-native payments infrastructure
        - Not disclosed
        - Transaction fee-based; differentiator as first UK bank with API-native FPS access
        - Customer count and revenue not disclosed
    notes: >-
      Scale figures for personal and business accounts are company-stated from website copy as of
      mid-2026 and carry a "+" qualifier; exact counts require filed annual accounts. Joint,
      multi-currency, and Kite counts are undisclosed. Engine and B2B Banking Services customer
      counts are not public.
