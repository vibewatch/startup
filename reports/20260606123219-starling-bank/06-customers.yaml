  - id: expansion-concentration-and-risks
    title: Expansion Loops, Concentration Risks, and Customer Economics
    body: >-
      Starling's core concentration risk is geographic: the entire retail customer base is UK-only,
      meaning revenue, regulatory exposure, and macro risk are undiversified. A UK-specific banking
      sector shock, a materially adverse regulatory action, or a deterioration in the Bank of
      England base rate (which has been the primary driver of net interest margin uplift since
      2022) would disproportionately affect Starling relative to internationally diversified
      competitors. No primary bank share is publicly disclosed — the bank does not report the
      proportion of customers who use Starling as their sole or primary account. This creates
      significant opacity around the durability and depth of the retail customer relationship.

      Expansion drivers within the existing UK customer base include a land-and-expand pattern
      across account types (personal → joint → business → Kite), Marketplace engagement driving
      third-party product connections, and the accountant referral programme creating a B2B
      acquisition loop into the 450,000+ business account segment. The FCA fine of £28.96 million
      in October 2024, however, revealed that rapid customer acquisition directly undermined
      compliance: 54,359 accounts were opened for 49,183 high or higher-risk customers in breach
      of a Voluntary Requirement imposed in September 2021. This adds a reputational overhang
      that has been linked by media commentary to the deferral of a planned IPO.

      NPS is cited by the Engine by Starling homepage as one of its disclosed KPIs from the
      "Starling Annual Report and Accounts 2025," but the specific NPS value is not accessible
      in public sources — only the filed Companies House accounts (226 pages) would confirm it.
      Annual churn rates, GRR, and NRR are also not publicly disclosed. Bounce Back Loan Scheme
      losses of approximately £28 million in FY2025 — attributed to the bank's own weak controls —
      point to credit risk in the SME customer cohort from the COVID lending period.
