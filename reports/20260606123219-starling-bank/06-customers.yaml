        - "Yes — 6th consecutive year (as of 2025)"
        - Personal
        - medium
        - Obtain Which? full scoring methodology and Starling's margin above threshold vs. peers
      - - App quality rating (Finder assessment)
        - Rated "Excellent" for App Store and Google Play presence (2026)
        - Personal and business
        - medium
        - Fetch Apple App Store numeric star rating and total review count directly; benchmark vs. Monzo
      - - NPS score
        - Not publicly disclosed; cited as a filed KPI in FY2025 Annual Report
        - All segments
        - low
        - Request from Companies House FY2025 filing (226 pages) or management accounts in due diligence
      - - Annual churn / account closure rate
        - Not publicly disclosed
        - All segments
        - low
        - Calculate from year-on-year active account data in filed annual accounts; benchmark vs. Monzo (also undisclosed publicly)
