figures:
  - id: FU001
    title: Consumer and Business Customer Journey Map
    type: journey-map
    layout: wide
    summary: End-to-end customer journey from discovery to multi-product expansion for personal and business segments.
    data:
      items:
        - id: stage-1
          label: Awareness
          description: >-
            Discovery via word-of-mouth, app store search, comparison sites (Finder, Which?),
            social media, and accountant recommendation (for SME segment).
        - id: stage-2
          label: Application
          description: >-
            In-app KYC: video selfie, government ID upload; typically sub-24-hour approval.
            No branch visit required; purely mobile or web.
        - id: stage-3
          label: Onboarding
          description: >-
            Debit card delivered in 3–5 days; Apple Pay / Google Pay linked immediately;
            initial Spaces set up; existing standing orders ported via CASS for switchers.
        - id: stage-4
          label: Day-to-day Banking
          description: >-
            Instant payment notifications; Spending Insights; Bills Manager and Spaces for
            budgeting; overdraft facility for eligible accounts; 24/7 in-app support.
        - id: stage-5
          label: Deep Engagement
          description: >-
            Marketplace connections (insurance, pensions, mortgage brokerage, investments);
            international transfers to 34 countries; AI Scam Intelligence; Spending Intelligence;
            Accounting integrations for business customers.
        - id: stage-6
          label: Expansion
          description: >-
            Joint account; Kite (children 6–15); dedicated Business account (personal → SME
            overlap); multi-currency account; Engine B2B (for institutional clients).
