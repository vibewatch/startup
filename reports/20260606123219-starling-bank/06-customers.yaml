callouts:
  - calloutType: strength
    title: Verified Scale and Standout Consumer Satisfaction
    body: >-
      Over four million accounts, 450,000+ businesses, a sixth consecutive Which? Recommended
      Provider award, and a 97% Finder recommendation rate collectively represent among the
      strongest publicly verifiable customer proof sets of any UK digital bank. The FCA's
      independent confirmation of 3.6 million accounts in 2023 anchors the growth narrative
      to a primary regulatory source rather than self-reported marketing copy.
    claimRefs:
      - CU001
      - CU008
      - CU012
      - CU013

  - calloutType: risk
    title: FCA Enforcement Reveals Customer Onboarding Control Failure
    body: >-
      The October 2024 FCA fine for opening 54,359 accounts for 49,183 high or higher-risk
      customers in breach of the VREQ demonstrates that Starling's rapid customer acquisition
      rate outpaced its compliance controls. This is an adverse signal for investors evaluating
      customer quality, not just regulatory risk — the breach directly relates to the bank's
      ability to screen and manage its customer base as it scales.
    claimRefs:
      - CU016
      - CU017
      - CU040

  - calloutType: risk
    title: Primary Bank Share and Retention Depth Unquantified
    body: >-
      No public disclosure of what proportion of Starling's personal customers use it as
      their primary account, and no churn rate, NRR, or GRR is reported. The absence of these
      metrics means the depth and durability of the customer relationship cannot be assessed
      from public sources. NPS is cited by Engine's homepage as a filed KPI but the specific
      value in the FY2025 annual accounts is not accessible without the Companies House filing.
    claimRefs:
      - CU025
      - CU041

  - calloutType: recommendation
    title: Diligence Priority — Customer Economics and Retention Metrics
    body: >-
      Request from management: (1) NPS score and trend from FY2025 filed accounts, (2) annual
      account closure / churn rate by segment, (3) primary bank share (deposits per account
      and active monthly transaction count), (4) Engine revenue as a % of total, and (5)
      CASS switching net flows over the past 24 months to assess whether net account growth
      is decelerating as the digital-native cohort saturates.
    claimRefs:
      - CU025
      - CU035
      - CU042

