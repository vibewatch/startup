  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: NPS score
      missingEvidence: >-
        Starling Bank NPS score from the FY2025 Annual Report and Accounts (226 pages, filed at
        Companies House); Engine homepage confirms NPS is a disclosed metric in this filing.
      whyItMatters: >-
        NPS is the most widely used single-metric proxy for customer advocacy and retention
        durability; without it, the satisfaction picture relies solely on third-party survey
        proxies (Trustpilot, Finder) that carry selection bias.
      diligencePath: >-
        Request Companies House FY2025 annual accounts (09092149) and locate the NPS disclosure;
        alternatively request from management in due diligence.
      relatedQuestionRefs:
        - QU011

    - type: private-evidence-only
      severity: material
      topic: annual churn rate
      missingEvidence: >-
        Annual account closure rate (churn) by segment — personal vs. business; or active/inactive
        account split to derive an activity-based retention proxy.
      whyItMatters: >-
        Four million accounts on a fee-free model could mask high dormancy or low-balance accounts
        that contribute minimal revenue; churn also calibrates the durability of the customer
        acquisition engine.
      diligencePath: >-
        Request year-on-year active customer count (defined by at least one transaction in trailing
        12 months) from management; review FCA-filed data returns for Starling's active account
        definitions.
      relatedQuestionRefs:
        - QU005
        - QU016

    - type: private-evidence-only
      severity: material
      topic: primary bank share
      missingEvidence: >-
        The proportion of personal current account holders who use Starling as their primary
        bank (salary deposit account); or average balance and transaction frequency by customer
        cohort.
      whyItMatters: >-
        Primary bank share determines net interest income durability and the depth of the deposit
        franchise; without it, account count overstates the quality of the retail customer base.
      diligencePath: >-
        Request from management; alternatively derive from filed accounts average deposit balance
        per account vs. UK average current account balance.
      relatedQuestionRefs:
        - QU005
        - QU016

    - type: enumeration-incomplete
      severity: minor
      topic: Engine B2B client list
      missingEvidence: >-
        A complete or partial list of Engine by Starling's licensed banking clients beyond Salt
        Bank (Romania), with production status and contract scope.
      whyItMatters: >-
        Engine is cited as a strategic diversification from UK-only retail concentration; without
        client count or revenue, its materiality cannot be assessed.
      diligencePath: >-
        Request from management or review Engine marketing materials and press releases for
        additional client announcements.
      relatedQuestionRefs:
        - QU014
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: minor
      topic: CASS switching net flows
      missingEvidence: >-
        UK Finance Current Account Switch Service data showing Starling Bank's quarterly net
        switching gains or losses from 2023 to 2026.
      whyItMatters: >-
        Net switching flows are a leading indicator of whether account growth is continuing
        via new acquisition or reversing as the digital-native cohort saturates.
      diligencePath: >-
        Access UK Finance CASS dashboard (published quarterly); search for Starling-specific
        switching data; note that not all providers publish granular switching data.
      relatedQuestionRefs:
        - QU008

    - type: private-evidence-only
      severity: material
      topic: revenue split by customer segment
      missingEvidence: >-
        Breakdown of Starling Bank's total revenue between personal and business customer
        segments, including average revenue per account by segment.
      whyItMatters: >-
        Without a revenue split, the disproportionate contribution of 450k+ business accounts
        (likely at higher margin from fee-based accounting tiers and higher deposit balances)
        cannot be quantified; this matters for assessing segment concentration and unit economics.
      diligencePath: >-
        Request from FY2025 annual accounts (Companies House, 226 pages) or management accounts;
        triangulate from disclosed overdraft yield, interchange per account, and business tier pricing.
      relatedQuestionRefs:
        - QU025

    - type: partial
      severity: minor
      topic: business peer comparison
      missingEvidence: >-
        Published customer count and product scope data for Monzo Business and Tide as of 2026
        to benchmark Starling's 450k+ business accounts against direct competitors.
      whyItMatters: >-
        Without peer comparison data, Starling's 450k+ business account figure cannot be
        assessed for relative market share or competitive positioning in UK SME digital banking.
      diligencePath: >-
        Search Monzo and Tide investor or press release disclosures for their 2025–2026 business
        account customer counts; Monzo Business had approximately 500k accounts as of 2023 per
        media reports — re-verify with current sources.
      relatedQuestionRefs:
        - QU022

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The planned retention/repeat cohort figure (type: cohort) was replaced with a customer
      and regulatory milestones timeline (type: timeline, FU004) because no time-series
      retention percentage data by cohort is publicly available for Starling Bank; the timeline
      provides a distinct temporal lens on growth and adverse regulatory events that is
      complementary to the acquisition funnel figure and avoids inventing unsupported numbers.
