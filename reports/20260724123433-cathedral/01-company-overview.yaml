- id: funding-governance-and-stakeholders
  title: Funding, governance, and stakeholder map
  body: 'Chapter 1 owns the core funding facts. The ground-truth public financing record is a $160 million round closed shortly
    before July 22, 2026, at a $1.4 billion post-money valuation. Andreessen Horowitz and Sequoia Capital led the round and
    both took board seats. No earlier Cathedral financing was found, so $160 million is the disclosed total raised, not a
    verified lifetime total if undisclosed pre-seed capital exists. Governance disclosure is thinner than the valuation implies:
    the public file names the four founders and the two lead-investor board seats, but not a complete board, voting rights,
    option pool, founder ownership, secondaries, or observer rights. The stakeholder map therefore includes investors, founders,
    U.S. government buyers, potential compute providers, and the political/regulatory environment. a16z’s American Dynamism
    materials and Sequoia’s AI programming make the investor fit plausible, yet the absence of company confirmation keeps
    governance transparency a major diligence ask.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
