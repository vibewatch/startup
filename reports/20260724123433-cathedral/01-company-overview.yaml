company:
  name: Cathedral
chapter:
  number: 1
  title: Company Overview
  summary: Cathedral is a stealth AI-powered military cybersecurity startup founded by former DOGE staffers and financed with
    a $160 million round at a $1.4 billion post-money valuation. The public record supports the mission, founders, lead investors,
    and policy context, but leaves revenue, contracts, headcount, headquarters, and complete governance undisclosed.
sections:
- id: identity-stage-and-model
  title: Identity, stage, and business model
  body: 'Cathedral is visible in the public record as a stealth AI-powered military cybersecurity company rather than as a
    conventional launched software vendor. Reuters’ David Jeans, republished by U.S. News, and follow-on coverage from The
    Next Web, Hoodline, Gizmodo, and Cyber Daily consistently describe a company formed by former DOGE operators to expand
    U.S. military cyber capabilities. The supportable business model is therefore narrow but important: win U.S. government
    contracts for AI-driven offensive and defensive cyber operations, potentially with dedicated compute supplied by an acquisition
    or data-center partnership. The headquarters is not disclosed in the reviewed sources; the strongest geographic signal
    is Washington/Pentagon proximity, not a corporate address. I use 2025 as the founding year with medium confidence because
    the July 2026 Reuters account says the company launched in recent months after the founders’ 2025 DOGE tenure. Stage should
    be recorded as stealth/private-undisclosed: the round is large, but product documentation, customers, revenue, and headcount
    are absent.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO018
  - CO040
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-leadership-and-key-person-risk
  title: Founders, leadership, and key-person risk
  body: 'The named leadership bench is concentrated in four founders: Gavin Kliger, Luke Farritor, Marko Elez, and Jack Stein.
    Public diligence should treat that enumeration as complete only for founders reported by Reuters, not as a full management
    or board list. Kliger is the most strategically important public figure because he was reported as the Pentagon chief
    data officer and as involved in the Department of Defense’s dispute with Anthropic over how Claude would be used by the
    military. Farritor brings DOGE/GSA cost-cutting and SpaceX intern context, while Elez brings both technical pedigree and
    a material reputational/control-risk history from Treasury access and the social-media-post episode. Stein is named, but
    the reviewed free public record gives less role detail. This creates founder-market fit and key-person dependence at the
    same time: Cathedral’s access story is valuable precisely because it is also politically sensitive and difficult to diligence
    through company-authored materials.'
  claimRefs:
