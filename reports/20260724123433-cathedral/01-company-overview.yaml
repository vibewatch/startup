  evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters-identity
    missingEvidence: An official Cathedral incorporation record, website, company profile, or management confirmation of headquarters
      and legal entity.
    whyItMatters: Headquarters and legal entity affect procurement eligibility, export-control review, security clearances,
      tax, and recruiting diligence.
    diligencePath: Request company formation documents, SAM.gov registration, CAGE/UEI identifiers, and current office footprint
      from management.
    relatedQuestionRefs:
    - QO001
    - QO020
  - type: private-evidence-only
    severity: material
    topic: revenue-customers-contracts
    missingEvidence: Management-provided revenue, ARR, contract pipeline, awarded contract vehicles, named customers, pilots,
      and revenue-recognition policy.
    whyItMatters: The $1.4 billion valuation cannot be underwritten from public operating traction because no customers or
      revenue are disclosed.
    diligencePath: Request data room extracts covering bookings, pipeline stage, contract vehicles, customer references, and
      audited or management financials.
    relatedQuestionRefs:
    - QO008
    - QO009
    - QO021
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Current employee count, hiring plan, functional org chart, and founder/non-founder operating leadership
      list.
    whyItMatters: Headcount determines whether Cathedral can execute military cyber delivery, security operations, and data-center
      plans without relying solely on founders.
    diligencePath: Request HR roster by function, cleared-personnel count, recruiting plan, and contractor/vendor list.
    relatedQuestionRefs:
    - QO010
  - type: enumeration-incomplete
    severity: material
    topic: governance-cap-table
    missingEvidence: Full board roster, observer seats, voting rights, ownership by investor and founder, secondary-sale details,
      and conflict-of-interest policies.
    whyItMatters: Public reporting only names two investor board seats and four founders, leaving control and oversight unresolved
      for a politically sensitive contractor.
    diligencePath: Request financing documents, board consents, investor-rights agreement, side letters, and ethics/conflict
      reviews.
    relatedQuestionRefs:
    - QO005
    - QO022
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: compute-strategy
    missingEvidence: Identity of any data-center acquisition target or partner, capacity need, security architecture, cost
      model, and vendor commitments.
    whyItMatters: Dedicated compute could be a defensibility advantage or a capital-intensive distraction depending on economics
      and government-security requirements.
    diligencePath: Request infrastructure roadmap, make-versus-buy analysis, contracts or LOIs, and security/compliance architecture
      review.
    relatedQuestionRefs:
    - QO012
    - QO026
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: Private company formation documents, board consents, product roadmap records, contract pipeline records,
      and compute counterparty agreements that would close undisclosed chronology intervals.
    whyItMatters: The public milestone table is useful as a chronology of record, but it cannot be exhaustive without nonpublic
      Cathedral operating documents.
    diligencePath: Request management timeline, financing documents, product roadmap, contract pipeline evidence, and infrastructure
      agreements, then reconcile them against the public chronology.
    relatedQuestionRefs:
    - QO013
    - QO025
    - QO026
    relatedTableRefs:
    - TO004
