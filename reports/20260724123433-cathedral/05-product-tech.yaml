  title: Analogue-systems comparison table
  columns:
  - Analogue
  - Relevant capability
  - What it proves
  - Limit when applying to Cathedral
  - Evidence status
  rows:
  - - DARPA AIxCC
    - Autonomous cyber reasoning for open-source vulnerabilities
    - AI systems can find and repair vulnerabilities in controlled competition settings
    - Competition success does not prove classified operational readiness
    - Primary and developer-signal evidence
  - - XBOW validation benchmarks
    - Autonomous offensive-security benchmarking
    - Public benchmark infrastructure exists for AI security agents
    - Benchmarks can saturate and may not predict real zero-day performance
    - Developer-signal evidence
  - - Horizon3.ai NodeZero
    - Commercial autonomous penetration testing
    - There is a market pattern for continuous self-directed pentesting
    - Enterprise exposure management differs from military offensive missions
    - Official and docs evidence
  - - Dreadnode
    - Security-agent infrastructure and evaluations
    - Teams are building platforms to evaluate and deploy offensive agents
    - Infrastructure tooling is not equivalent to government ATO or mission authority
    - Official and docs evidence
  - - HackerOne Hai / AI red teaming
    - Human-plus-agent vulnerability validation
    - Hybrid workflows may compress exploitability validation time
    - HackerOne itself warns AI alone is insufficient
    - Company and adverse review evidence
  - - Anthropic Claude cyber / Claude Gov
    - Frontier-model cyber capability and classified-model packaging
    - Frontier vendors can support national-security environments and cyber evals
    - Anthropic emphasizes safety boundaries and remaining limitations
    - Official research evidence
  - - OpenAI threat-actor disruption
    - Monitoring malicious AI use
    - Model providers can detect and disrupt misuse patterns
    - Does not prove offensive automation is safe for military use
    - Official adverse-use evidence
  - - Palantir AIP
    - Operational AI workflow integration
    - AI can be embedded in mission workflows with controls
    - AIP is broader operating software, not a cyber exploit engine
    - Official analogue evidence
