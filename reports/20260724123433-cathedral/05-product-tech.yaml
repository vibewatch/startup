  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: product-documentation
    missingEvidence: Cathedral product documentation, architecture diagrams, module list, benchmark reports, and screenshots
      or operator workflow artifacts.
    whyItMatters: Without product artifacts, the line between fundraising narrative and deployable military cyber system cannot
      be underwritten.
    diligencePath: Request a cleared product walkthrough, demo environment, architecture pack, model cards, and benchmark
      reproduction package from management.
    relatedQuestionRefs:
    - QE001
    - QE004
    - QE022
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: blocking
    topic: compliance-ato
    missingEvidence: System security plan, ATO path, FedRAMP or inherited-control evidence, CMMC boundary, and classification/impact-level
      target.
    whyItMatters: DoD deployment can stall for months or years if authorization and control inheritance are unresolved.
    diligencePath: Obtain the compliance roadmap, sponsor or authorizing official correspondence, control matrix, and POA&M.
    relatedQuestionRefs:
    - QE014
    - QE015
    - QE016
    - QE017
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: technical-benchmarks
    missingEvidence: Independent evaluation of Cathedral model reliability, false-positive rates, exploit validity, defensive
      triage accuracy, and robustness to adversarial prompts.
    whyItMatters: Autonomous cyber agents can produce plausible but wrong or unsafe output, especially in exploit generation.
    diligencePath: Run a blind benchmark on representative military software and require reproduction logs, failure analysis,
      and human override metrics.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE027
    relatedTableRefs:
    - TE004
    - TE005
