  - FE004
  - FE005
- id: roadmap-and-technical-risk
  title: Roadmap and technical risk
  body: The credible roadmap is incremental rather than magical autonomy. A sane sequence would start with analyst copilots
    and vulnerability triage, then move to sandboxed exploit validation, classified compute accreditation, controlled defensive
    pilots, and only later tightly authorized offensive mission support. The core technical risks are model hallucination,
    invalid exploit chains, adversarial prompt and tool manipulation, evaluation on classified data that outsiders cannot
    reproduce, and governance failures when offensive recommendations look plausible but are wrong. Gold Eagle and defensive-agent
    analogues suggest near-term value in vulnerability coordination and remediation prioritization. The riskiest claims are
    autonomous exploit generation and C2-adjacent automation, because they combine safety, legality, reliability, and escalation
    concerns. Until Cathedral releases evidence or customers validate deployments under clearance, the product verdict is
    high-upside but unproven.
  claimRefs:
  - CE009
  - CE016
