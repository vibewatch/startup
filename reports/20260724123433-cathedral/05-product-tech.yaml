schemaVersion: report-v2
artifact: product-tech
slug: cathedral
runDate: '2026-07-24'
company:
  name: Cathedral
chapter:
  number: 5
  title: Product & Technology
  summary: 'Cathedral’s public product evidence is mission-level, not product-level: sources support a stealth AI military
    cyber platform for offensive and defensive operations, but not specific SKUs, architecture, deployments, or certifications.
    The likely technology stack is agentic LLM-driven vulnerability discovery, exploit validation, defensive triage, and classified
    compute, with the largest diligence risks in reliability, authorization, and DoD accreditation.'
sections:
- id: product-surface-and-evidence-boundary
  title: Product surface and evidence boundary
  body: 'Cathedral’s product should be underwritten as a classified or near-classified cyber-operations platform, not as a
    publicly documented SaaS product. The public record supports only a mission-level definition: AI-driven military cyber
    operations for U.S. government buyers, spanning both offensive and defensive capabilities against adversaries such as
    China. No reviewed source provides Cathedral product names, screenshots, API documentation, deployment diagrams, performance
    claims, ATO status, or named users. Therefore the chapter treats the offensive and defensive modules below as inferred
    capability buckets derived from public reporting and comparable systems, while marking Cathedral-specific maturity as
    stealth. The likely customer workflow starts with an authorized mission or network-defense requirement, moves through
    AI-assisted discovery and analysis, and ends with human approval, remediation, or mission packaging. That evidence boundary
    is not a footnote; it is the central product risk.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE036
  - CE045
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture-stack-and-compute-model
  title: Architecture stack and compute model
  body: 'The most plausible architecture is an agentic stack wrapped by classified data controls: model orchestration, cyber
    tool use, security-data retrieval, sandboxed exploit testing, operator review, and deployment connectors into government
    environments. Cathedral’s reported interest in a data-center acquisition or partnership is unusually important because
    offensive cyber AI cannot be evaluated only in commodity cloud terms. Training corpora may contain vulnerability intelligence,
    exploit artifacts, telemetry from sensitive networks, or classified mission context; inference may generate exploit chains
    or remediation instructions that cannot leave accredited boundaries. Kliger’s reported Pentagon chief data officer role
    and Anthropic/Claude-in-DoD exposure add founder-market context, but they do not prove Cathedral has solved model governance.
    The architecture table therefore separates inferred layers from verified dependencies and flags where management must
    produce diagrams, model cards, isolation controls, logging plans, and evaluation results.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE019
  - CE040
  - CE041
  - CE045
  tableRefs:
  - TE002
  figureRefs:
  - FE002
- id: analogues-and-capability-benchmarks
  title: Analogues and capability benchmarks
  body: 'Public analogues make Cathedral technically plausible while also narrowing what should not be assumed. DARPA AIxCC
    shows that autonomous cyber reasoning systems can compete on vulnerability discovery and repair in controlled open-source
    settings. Horizon3.ai NodeZero and Dreadnode show that autonomous pentesting and offensive-security-agent tooling are
    already product categories. Anthropic, OpenAI, and Google show that frontier models can assist cyber work, but their materials
    also emphasize safety boundaries, misuse monitoring, and benchmark limitations. HackerOne and arXiv sources are especially
    useful adverse checks: they suggest AI can multiply offensive work, but fully autonomous real-world exploitation remains
    unreliable and needs human validation. Cathedral’s differentiation, if real, would come from classified data, mission
    integration, and cleared compute rather than from the generic fact of using LLM agents.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
