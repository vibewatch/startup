callouts:
- calloutType: risk
  title: Stealth means no public product proof
  body: The chapter can frame plausible modules, but Cathedral has not publicly disclosed product documentation, benchmarks,
    ATO evidence, or named deployments. Treat all capability labels as inferred until management produces artifacts.
  claimRefs:
  - CE002
  - CE036
  - CE045
- calloutType: insight
  title: Compute strategy is product strategy
  body: For Cathedral, dedicated compute is not just cost structure; it is part of the product boundary because classified
    cyber data, exploit validation, and audit logs may need accredited isolation.
  claimRefs:
  - CE007
  - CE008
  - CE019
  - CE041
- calloutType: risk
  title: Autonomy should be staged behind humans
  body: Public analogues support AI-assisted discovery and triage, but adverse sources argue agentic AI alone is not yet reliable
    enough for unsupervised offensive operations.
  claimRefs:
  - CE016
  - CE018
  - CE034
  - CE035
  - CE043
