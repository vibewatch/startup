- id: deployment-integration-compliance
  title: Deployment, integration, and compliance surface
  body: 'The deployment surface is likely harder than the model demo. A military cyber product touching NIPR, SIPR, JWICS,
    mission clouds, or tactical DDIL environments would need identity, logging, enclave, data-labeling, export-control, vulnerability-disclosure,
    and operator-authorization controls. FedRAMP and DoD impact-level assessment matter if Cathedral ships a cloud service;
    NIST RMF and SP 800-53 matter for ATO; CMMC matters for defense-contractor CUI; NIAP may matter if evaluated endpoint
    or appliance components appear. DefenseScoop’s JWCC reporting shows the Pentagon is seeking AI and ML across classifications
    and impact levels, but that is a demand signal, not Cathedral authorization. The diligence ask is concrete: request the
    system security plan, inherited-control matrix, deployment boundary diagram, clearance roster, red-team reports, model-evaluation
    protocol, and any sponsor or authorizing official correspondence.'
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
  - CE040
  - CE041
  - CE042
