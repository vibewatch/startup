- id: growth-drivers
  title: Growth drivers
  body: The demand case rests on four drivers. First, China and other nation-state cyber threats make speed and scale in cyber
    operations strategically important. Second, DARPA’s AI Cyber Challenge validates the specific idea that AI can automate
    vulnerability discovery and remediation, which is close to Cathedral’s claimed mission space. Third, defense-tech venture
    investors have already rewarded companies that promise national-security modernization, with Anduril serving as the category’s
    most visible comp even though its autonomy and hardware profile differs from Cathedral’s cyber-software wedge. Fourth,
    a government efficiency push could favor software and AI products that substitute automation for scarce cleared labor.
    These drivers support a large opportunity narrative, but they are not proof of procurement conversion, repeat usage, or
    willingness to authorize autonomous offensive cyber workflows.
  claimRefs:
  - CM010
  - CM022
  - CM023
  - CM024
  - CM032
  - CM033
  - CM034
  - CM035
  - CM043
  tableRefs:
  - TM004
  figureRefs: []
- id: constraints-and-gaps
  title: Constraints, adverse view, and diligence gaps
  body: 'The adverse market view is straightforward: Cathedral may be valued like a once-in-a-generation defense-tech platform
    while competing for a much smaller, slower, and more classified spend pool than headline TAMs imply. Procurement cycles
    can stretch 18-24 months or longer once ATO, zero-trust alignment, security clearances, data handling, and contracting
    mechanics are included. Incumbent contractors also have award history, cleared personnel, and contracting infrastructure
    that a stealth startup must either build or partner around. Public sources do not yet verify Cathedral revenue, customers,
    contracts, authority-to-operate status, or classified deployment footprint. The next diligence step is therefore account-level:
    identify funded program offices, active solicitations, sponsor users, security accreditation path, and whether the company
    is selling tools, services, or mission outcomes.'
  claimRefs:
  - CM008
  - CM027
  - CM031
  - CM036
  - CM037
  - CM044
  - CM045
