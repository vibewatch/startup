  title: The most honest TAM is a stack of imperfect lenses
  body: Federal cyber budget, DoD mission cyber, military AI, and cyber-warfare forecasts all matter, but none is a clean
    Cathedral TAM. The investable question is whether Cathedral can convert a classified mission wedge into recurring program
    spend.
