  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cathedral-traction
    missingEvidence: Named Cathedral revenue, contracts, program sponsors, customer references, or funded pilots.
    whyItMatters: Without this evidence, SOM is a pipeline hypothesis rather than observed market capture.
    diligencePath: Request customer list, contract vehicles, award identifiers, revenue by program, and redacted sponsor references
      from the company.
    relatedQuestionRefs:
    - QM023
  - type: missing-source
    severity: material
    topic: offensive-cyber-gap
    missingEvidence: A public source that isolates authorized U.S. offensive cyber tools or cyber-weapons spend by budget
      owner.
    whyItMatters: Offensive cyber may be Cathedral’s highest-value wedge, but public analyst categories mix sensitive tools,
      services, and broad cyber defense.
    diligencePath: Review classified or investor-room materials under appropriate clearance/NDA and map spend to named DoD
      or IC budget owners.
    relatedQuestionRefs:
    - QM006
    - QM020
    - QM024
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: military-ai-market
    missingEvidence: A harmonized analyst dataset using the same geography, definition, and forecast year for military AI
      cyber operations.
    whyItMatters: MarketsandMarkets and Grand View imply materially different growth rates, which affects valuation narratives.
    diligencePath: Normalize analyst scopes and purchase underlying tables or triangulate with DoD budget lines and procurement
      awards.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: procurement-cycle
    missingEvidence: Cathedral-specific procurement stage, ATO status, clearance status, and expected conversion dates.
    whyItMatters: The public 18-24 month procurement-cycle assumption could be too optimistic or too conservative.
    diligencePath: Ask management for each active opportunity’s sponsor, authority path, contract vehicle, security gate,
      and forecast close date.
    relatedQuestionRefs:
    - QM021
