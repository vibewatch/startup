  title: The adverse case is procurement drag, not lack of threat urgency
  body: Threat urgency and AI automation are real drivers, but ATO, zero trust, clearance, contracting, and incumbent lock-in
    can delay conversion long enough to make a $1.4B post-money valuation difficult to underwrite without contract proof.
