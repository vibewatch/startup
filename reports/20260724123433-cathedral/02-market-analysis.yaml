slug: cathedral
runDate: '2026-07-24'
company:
  name: Cathedral
chapter:
  number: 2
  title: Market Analysis
  summary: Cathedral competes in a narrow AI cyber operations wedge inside federal cybersecurity, DoD mission cyber, military
    AI, and cyber-warfare markets. The public evidence supports a large threat-driven market, but the investable SAM/SOM remains
    constrained by classified budgets, procurement conversion, security accreditation, and no disclosed Cathedral revenue
    or contracts.
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: 'Cathedral should be sized inside a narrow national-security cyber market: AI-enabled defensive and offensive cyber
    tools, vulnerability discovery, workflow software, and related services sold to DoD and intelligence-community operators.
    That boundary intentionally excludes broad enterprise security, consumer cybersecurity, generic federal IT services, and
    physical defense hardware, even though those categories create context and comparable valuations. The core user problem
    is not simply buying another SOC tool; it is accelerating cyber operations against nation-state adversaries while satisfying
    classified-network, zero-trust, and command-authority requirements. The strongest substitutes are therefore internal Cyber
    Command and NSA capability, incumbent defense contractors, manual red-team or penetration-testing teams, and civilian
    CISA-style practices for defensive hygiene. This framing keeps Cathedral’s opportunity tied to mission cyber workflows
    rather than a generic cybersecurity TAM.'
  claimRefs:
  - CM001
  - CM002
  - CM005
  - CM006
  - CM007
  - CM021
  - CM025
  - CM026
  - CM027
  - CM028
  - CM041
