companyProfile:
  summary: Cathedral is a stealth defense-technology company founded in 2025 by four former Department of Government Efficiency (DOGE) staffers to apply AI to US military cyber operations, spanning both offensive capabilities (vulnerability discovery and exploitation against adversary systems) and defensive capabilities (protecting US military networks). In the weeks before a 22 July 2026 Reuters report it closed a $160 million round at a $1.4 billion post-money valuation co-led by Andreessen Horowitz and Sequoia Capital, both of which took board seats. The company has no disclosed product, revenue, or contracts, and its valuation reflects investor conviction in the founding team's recent senior government access rather than any commercial track record.
  foundedDate: '2025-01-01'
  founders:
    - name: Gavin Kliger
      role: Co-founder
      background: Former Pentagon chief data officer; involved in the DoD's legal dispute with Anthropic over military use of Claude.
      claimRefs: [CO007]
    - name: Luke Farritor
      role: Co-founder
      background: Former SpaceX intern and DOGE operator active in GSA-related work.
      claimRefs: [CO008]
    - name: Marko Elez
      role: Co-founder
      background: Former SpaceX engineer and DOGE/Treasury staffer whose access drew security-control scrutiny.
      claimRefs: [CO009]
    - name: Jack Stein
      role: Co-founder
      background: Former DOGE staffer.
      claimRefs: [CO010]
  foundingLocation: United States
  headquarters: United States (undisclosed)
  productSummary: AI-driven platform (undisclosed and presumptively classified) intended to support US military cyber operations, combining offensive vulnerability discovery and exploitation with defensive threat detection and response; the company is also seeking dedicated data-center compute to run those operations.
  customerFocus: US Department of Defense, US Cyber Command, the NSA, and the broader intelligence community, with adversary systems (notably China) as the operational target set.
  businessModel: US government contracts (expected via SBIR/STTR, OTA, and direct/program-of-record vehicles) for AI-powered offensive and defensive cyber tools and services.
