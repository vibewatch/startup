- id: TV005
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence supporting it
  - What would change the view
  rows:
  - - 'Thesis: elite team can navigate government cyber demand'
    - Reported DOGE alumni founders and military-cyber focus
    - Verified technical leadership and classified-capable delivery team
  - - 'Thesis: investors are underwriting a real defense-tech boom'
    - Anduril, Shield AI and a16z American Dynamism support category tailwinds
    - Evidence that Cathedral wins differentiated programs, not just attention
  - - 'Thesis: cyber operations can scale faster than hardware defense'
    - Software/cyber focus could avoid some hardware manufacturing constraints
    - Proof of deployable product and accreditation path
  - - 'Anti-thesis: valuation precedes traction'
    - No disclosed revenue, contracts, or product page
    - Signed paid pilots or program-of-record path
  - - 'Anti-thesis: political access is not durable moat'
    - DOGE/Trump ties could invite scrutiny or change with politics
    - Bipartisan customer pull and career-government sponsorship
  - - 'Anti-thesis: defense-tech bubble risk'
    - Adverse sources warn capital may outrun procurement reality
    - Reasonable entry price or independently validated contract backlog
  notes: The anti-thesis is valuation-specific; it does not deny that defense cyber demand is real.
