- id: TV003
  title: Bull / base / bear scenario and sensitivity table
  columns:
  - Scenario
  - 18-24 month contract/revenue assumption
  - Valuation logic
  - Probability signal
  - Downside trigger
  rows:
  - - Bull
    - Converts access into $100M-$150M+ annualized contract revenue or equivalent funded programs
    - At 10x-15x revenue, $93M-$140M supports the current mark
    - Only plausible if paid government work arrives quickly
    - No paid pilot or program path by month 24
  - - Base
    - Builds team and pilots but has limited revenue visibility
    - Current $1.4B remains hard to justify until revenue approaches $140M at 10x
    - Most consistent with public evidence today
    - Pilot activity stays unpaid or procurement slips
  - - Bear
    - Political scrutiny or procurement drag blocks meaningful contracts
    - Valuation reprices toward early-stage defense benchmarks or requires heavy dilution
    - Supported by adverse bubble and no-traction evidence
    - Round becomes an access story without technical proof
  - - Low-multiple grow-in
    - Needs about $280M revenue at 5x
    - Implies a very steep ramp for a new cyber company
    - Unlikely without major multi-year awards
    - Budget or accreditation delays
  - - High-multiple grow-in
    - Needs about $93M revenue at 15x
    - Requires Palantir/Anduril-like software premium before public proof
    - Possible only with exceptional strategic contract capture
    - Multiple compression in defense tech
  notes: Ranges are what-if underwriting math, not management guidance; revenue remains undisclosed.
