schemaVersion: report-v2
artifact: valuation
slug: cathedral
runDate: '2026-07-24'
company:
  name: Cathedral
chapter:
  number: 8
  title: Valuation
  summary: Cathedral’s $160 million raise at a $1.4 billion post-money valuation implies a roughly $1.24 billion pre-money
    mark and about 11.4% ownership sold, but public evidence shows no disclosed revenue or contracts. The valuation is best
    explained by team access, a16z and Sequoia conviction, and defense-tech market heat rather than traction, so the chapter
    assigns an expensive valuation stance and a research-more recommendation.
sections:
- id: mark-and-recommendation
  title: The mark and the recommendation
  body: Cathedral’s valuation chapter starts with unusually clean round math and unusually weak operating proof. The reported
    $160 million financing at a $1.4 billion post-money valuation implies about $1.24 billion pre-money and roughly 11.4%
    primary dilution. That is an extraordinary price for a company founded around 2025 with no disclosed revenue, no disclosed
    ARR and no disclosed contract wins. Because the denominator is missing, no revenue multiple or ARR multiple can be computed;
    using zero would be misleading, so the correct field is null. The investment stance is therefore research-more with low
    confidence, high risk and an expensive valuation stance. The mark can be explained by the founders’ DOGE-linked government
    access, elite investor sponsorship, and defense-tech market heat, but public evidence does not yet support a fundamentals-backed
    buy recommendation.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV034
  - CV035
  - CV036
  - CV037
  tableRefs:
  - TV001
  figureRefs: []
- id: comparables-and-multiples
  title: Comparable companies and multiples
  body: The comparable set shows why Cathedral is both plausible and alarming. Anduril and Shield AI prove that private defense-tech
    winners can command very large valuations in 2026, but both are much further along than Cathedral. Anduril’s reported
    $61 billion valuation sits on public revenue scale and a visible product footprint, while Shield AI’s 2026 round is tied
    to autonomous aircraft and Air Force-related traction. Palantir is even less stage-comparable, but it is useful as the
    public-market upper-bound because its high multiple is backed by SEC filings, revenue disclosure and government growth.
    Rebellion Defense is a private software reference, not a valuation anchor, because the fetched sources do not provide
    a clean current multiple. Against seed and Series A benchmarks, Cathedral’s founding-stage mark remains an extreme outlier.
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
