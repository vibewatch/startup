- id: grow-in-scenarios
  title: Grow-in scenarios and sensitivity
  body: The cleanest way to underwrite a pre-revenue mark is to ask what future contract revenue must arrive for the price
    to become ordinary. At a 10x revenue multiple, Cathedral needs roughly $140 million of annual revenue to support $1.4
    billion; at 5x, it needs about $280 million; even at an aggressive 15x, it needs roughly $93 million. That frames the
    18-to-24-month test. The bull case requires rapid conversion of access into paid military-cyber programs and repeatable
    software economics. The base case is a well-funded product and pilot buildout that still leaves the current valuation
    hard to defend. The bear case is a procurement or political delay that forces dilution, down-round pricing, or a long
    period where the valuation is merely a narrative mark.
  claimRefs:
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
  - CV031
  - CV038
  - CV039
  - CV044
