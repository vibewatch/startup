  - FV003
- id: final-diligence-asks
  title: Final diligence asks and thesis-break triggers
  body: 'The IC should not treat Cathedral as uninvestable forever; it should treat the current price as unproven. A credible
    path to justify the mark exists if the company can show paid government cyber demand, defensible technical capability,
    an accreditation path, and software-like economics. The required diligence package is therefore specific: contract pipeline
    and bid status, customer conversations where permissible, product demonstrations, security and deployment architecture,
    cap-table preferences, data-center economics, and ethics controls around political relationships. The thesis breaks if
    no paid pilot or government contracting path emerges within 18 to 24 months, if the business depends mostly on political
    access, or if future rounds reveal that the upfront valuation created a preference overhang. Until those checks clear,
    the right conclusion is research-more, not buy.'
