- id: TV006
  title: Final diligence asks and thesis-break triggers
  columns:
  - Diligence topic
  - Missing evidence
  - Why it matters
  - Thesis-break threshold
  rows:
  - - Contract pipeline
    - Named agencies, bid stages, paid pilots, award probability and timing
    - Determines whether $140M+ revenue can become plausible
    - No credible paid path within 18-24 months
  - - Revenue model
    - Pricing, contract type, gross margin and services/software mix
    - Determines fair multiple and cash needs
    - Only bespoke services with weak margin profile
  - - Technical proof
    - Demo evidence, cyber capability boundaries, accreditation and security controls
    - Separates capability from access narrative
    - No independently validated product capability
  - - Cap table and preferences
    - Liquidation preferences, option pool, pro-rata and governance terms
    - Large round may create preference overhang
    - Terms make common or later entry unattractive
  - - Political / procurement risk
    - Ethics review, conflict controls and bipartisan customer sponsorship
    - Access can become liability under scrutiny
    - Contracts appear dependent on political relationships
  - - Infrastructure plan
    - Data-center partner, compute cost and classified deployment plan
    - Capital needs can drive dilution
    - Compute or compliance cost overwhelms budget
  notes: These asks define the path from research-more to investable; each is currently private evidence.
