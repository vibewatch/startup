      - number: '4.2'
        title: Path to revenue and contract economics
        blocks:
          - type: paragraph
            body: >-
              The most realistic path to revenue is staged rather than SaaS-linear. Cathedral can pursue non-dilutive
              SBIR or STTR awards, prototype work through OTA-style channels, CRADA collaboration with federal labs,
              DIU-style commercial-technology solicitations, and eventually IDIQ task orders or program-of-record
              procurement. Each route has different unit-economics consequences. Firm-fixed-price work can create better
              upside if Cathedral productizes cyber-AI capabilities and controls delivery cost, but it also pushes cost
              overrun risk onto the contractor. Cost-reimbursement work can de-risk early R&D cash conversion, yet it
              usually limits margin upside and is less proof of product repeatability. IDIQ vehicles and task orders can
              create sticky revenue once a mission owner standardizes around a tool, but the order flow is not
              automatic. With no disclosed pipeline, CAC and payback should be proxied through procurement-cycle
              duration, proposal burden, security accreditation effort, and conversion from prototype to production.
