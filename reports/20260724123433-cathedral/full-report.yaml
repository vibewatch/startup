      - number: '8.2'
        title: Comparable companies and multiples
        blocks:
          - type: paragraph
            body: >-
              The comparable set shows why Cathedral is both plausible and alarming. Anduril and Shield AI prove that
              private defense-tech winners can command very large valuations in 2026, but both are much further along
              than Cathedral. Anduril’s reported $61 billion valuation sits on public revenue scale and a visible
              product footprint, while Shield AI’s 2026 round is tied to autonomous aircraft and Air Force-related
              traction. Palantir is even less stage-comparable, but it is useful as the public-market upper-bound
              because its high multiple is backed by SEC filings, revenue disclosure and government growth. Rebellion
              Defense is a private software reference, not a valuation anchor, because the fetched sources do not
              provide a clean current multiple. Against seed and Series A benchmarks, Cathedral’s founding-stage mark
              remains an extreme outlier.
