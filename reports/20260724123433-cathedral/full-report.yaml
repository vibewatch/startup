      - number: '3.3'
        title: Cyber-specific competitors and exploit-market context
        blocks:
          - type: paragraph
            body: >-
              Cyber-specific competitors are more product-adjacent to Cathedral than most defense platforms.
              Horizon3.ai’s NodeZero offers autonomous pentesting with public adoption claims, XBOW has raised large
              2026 capital around autonomous offensive security and has a strategic Accenture relationship, and
              Dreadnode is building AI infrastructure for security agents and offensive AI research. RunSafe is a
              different defensive-hardening rival focused on memory safety and critical infrastructure rather than
              offensive cyber operations. Exploit brokers and offensive-cyber intermediaries are not conventional SaaS
              competitors, but they matter because a government buyer can source tools, talent, and capabilities through
              opaque supply chains instead of buying a new platform. Cathedral’s biggest product-level risk is therefore
              not one clone; it is a bundle of automated pentesting, exploit supply, red-team tooling, and internal
              cyber teams that can substitute for pieces of its promised mission.
