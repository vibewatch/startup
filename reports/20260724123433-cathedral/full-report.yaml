      - number: '8.4'
        title: Premium decomposition and risks to the mark
        blocks:
          - type: paragraph
            body: >-
              The valuation premium decomposes into four positive pieces and one large negative offset. Team premium is
              real because the founders’ government experience may reduce procurement friction. Investor-signal premium
              is also real because a16z and Sequoia leading with board seats changes market perception. Market premium
              is supported by Anduril, Shield AI, Palantir enthusiasm, and a16z’s American Dynamism thesis. Scarcity
              premium reflects the small number of visible AI-native military cyber teams. The offset is the largest
              diligence problem: no public product, revenue, or contract evidence. Adverse defense-tech-bubble
              commentary is directly relevant because it warns that venture prices can run ahead of procurement reality.
              Political scrutiny, future dilution, data-center or compliance capex, and comparison with more mature
              comps are the main ways the $1.4 billion mark can fail.
