  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The mark and the recommendation
        blocks:
          - type: paragraph
            body: >-
              Cathedral’s valuation chapter starts with unusually clean round math and unusually weak operating proof.
              The reported $160 million financing at a $1.4 billion post-money valuation implies about $1.24 billion
              pre-money and roughly 11.4% primary dilution. That is an extraordinary price for a company founded around
              2025 with no disclosed revenue, no disclosed ARR and no disclosed contract wins. Because the denominator
              is missing, no revenue multiple or ARR multiple can be computed; using zero would be misleading, so the
              correct field is null. The investment stance is therefore research-more with low confidence, high risk and
              an expensive valuation stance. The mark can be explained by the founders’ DOGE-linked government access,
              elite investor sponsorship, and defense-tech market heat, but public evidence does not yet support a
              fundamentals-backed buy recommendation.
            claimRefs:
              - CV001
