      - number: '1.5'
        title: Milestones and policy context
        blocks:
          - type: paragraph
            body: >-
              The chronology is inseparable from DOGE, defense procurement, and AI-cyber policy. DOGE was created by
              executive order in January 2025, became associated with aggressive federal cost-cutting and more than
              250,000 workforce exits, and ended on July 4, 2026. Cathedral then surfaced publicly weeks later as a
              DOGE-alumni company with defense-cyber ambitions and large venture backing. The same period included the
              Anthropic-Pentagon dispute, where Kliger’s reported involvement matters because it shows proximity to
              AI-use rules for military systems, and Gold Eagle, the White House’s July 2026 AI-enabled vulnerability
              coordination clearinghouse. Those facts do not prove Cathedral has a contract, but they explain why
              investors may believe the timing is unusually favorable. They also create adverse risk: the DOGE
              revolving-door narrative, Elez’s prior controversy, and potential congressional scrutiny of future
              contracts all belong in the overview rather than being deferred to a later risk chapter.
