      - number: '6.5'
        title: Comparable adoption lessons
        blocks:
          - type: paragraph
            body: >-
              Anduril, Palantir, and Shield AI show what Cathedral must eventually prove. Shield AI’s valuation step-up
              after a U.S. Air Force deal suggests that mission validation can unlock private financing, but it also
              shows that a named service relationship is the proof point investors want. Anduril’s $5 billion Series H
              and manufacturing expansion show the scale of capital and production credibility that defense buyers
              reward once a company moves beyond demos. Palantir is the durability benchmark: its Form 10-K describes
              Gotham serving defense and intelligence users for over a decade and discloses more than $1 billion of
              government revenue for 2024. Cathedral has none of that customer proof yet. Its near-term customer story
              is therefore a high-access pipeline thesis, not a validated adoption thesis.
