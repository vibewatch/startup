            body: >-
              The named leadership bench is concentrated in four founders: Gavin Kliger, Luke Farritor, Marko Elez, and
              Jack Stein. Public diligence should treat that enumeration as complete only for founders reported by
              Reuters, not as a full management or board list. Kliger is the most strategically important public figure
              because he was reported as the Pentagon chief data officer and as involved in the Department of Defense’s
              dispute with Anthropic over how Claude would be used by the military. Farritor brings DOGE/GSA
              cost-cutting and SpaceX intern context, while Elez brings both technical pedigree and a material
              reputational/control-risk history from Treasury access and the social-media-post episode. Stein is named,
              but the reviewed free public record gives less role detail. This creates founder-market fit and key-person
              dependence at the same time: Cathedral’s access story is valuable precisely because it is also politically
              sensitive and difficult to diligence through company-authored materials.
