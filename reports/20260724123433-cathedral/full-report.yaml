      - number: '6.4'
        title: Founder access advantage and revolving-door critique
        blocks:
          - type: paragraph
            body: >-
              Cathedral’s unusual go-to-market advantage is also its most obvious adverse diligence angle. Reuters
              reported that the founding team has deep ties to the Trump administration and national-security officials,
              including the Pentagon, and those relationships could reduce the cost of finding a mission owner. In
              defense technology, that access is valuable because the hardest early step is often getting a real sponsor
              to define an urgent, funded problem. The same fact pattern creates a revolving-door and
              conflict-of-interest risk: critical coverage has already framed the ex-DOGE transition into military
              technology as controversial, and Reuters warned that government-contract scrutiny could intensify if
              political control changes. The diligence ask is not only whether Cathedral can get meetings; it is whether
              those meetings can survive ethics review, contracting-office scrutiny, protests, congressional oversight,
              and changes in administration.
            claimRefs:
              - CU003
