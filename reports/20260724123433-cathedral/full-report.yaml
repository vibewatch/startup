              prototypes and follow-on production outside standard procurement contracts, but GAO also notes planning
              and consortia discipline issues. GSA schedules and public contract portals matter later, once product
              scope, pricing, compliance, and agency demand are clearer. A realistic sales-cycle model is therefore
              twelve to twenty-four months from first mission conversation to meaningful revenue, and longer for
