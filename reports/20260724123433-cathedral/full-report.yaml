              July 2026 coverage reports a $160 million primary financing at a $1.4 billion post-money valuation, led by
              Andreessen Horowitz and Sequoia Capital. On a pure primary-round basis, that implies roughly 11.4%
              new-money dilution and a pre-money valuation around $1.24 billion. The important underwriting point is not
              the arithmetic; it is the sequencing. Public sources describe Cathedral as a stealth military cyber
              startup founded by four former DOGE staffers, but they do not disclose revenue, ARR, recognized backlog,
              gross margin, paying customers, or awarded contracts. Therefore this chapter treats revenueRunRate and ARR
              as null, not small. The $160 million round is enough to fund a serious product-and-capture campaign, but
