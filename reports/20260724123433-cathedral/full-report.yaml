      - number: '2.4'
        title: Growth drivers
        blocks:
          - type: paragraph
            body: >-
              The demand case rests on four drivers. First, China and other nation-state cyber threats make speed and
              scale in cyber operations strategically important. Second, DARPA’s AI Cyber Challenge validates the
              specific idea that AI can automate vulnerability discovery and remediation, which is close to Cathedral’s
              claimed mission space. Third, defense-tech venture investors have already rewarded companies that promise
              national-security modernization, with Anduril serving as the category’s most visible comp even though its
              autonomy and hardware profile differs from Cathedral’s cyber-software wedge. Fourth, a government
              efficiency push could favor software and AI products that substitute automation for scarce cleared labor.
              These drivers support a large opportunity narrative, but they are not proof of procurement conversion,
              repeat usage, or willingness to authorize autonomous offensive cyber workflows.
