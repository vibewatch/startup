      - number: '7.4'
        title: Regulatory, export-control, and verification risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory risk is broader than ordinary cybersecurity compliance. If Cathedral builds tools,
              services, models, or operational support for U.S. military cyber missions, counsel must map ITAR, EAR,
              Wassenaar, procurement-integrity, post-employment, and classified-contracting constraints before the
              company hires abroad, shares technical data, partners with a data center, sells to allies, or accepts
              non-U.S. strategic investors. ITAR and EAR analysis is not optional if cyber capabilities become defense
              articles, defense services, controlled technical data, advanced computing items, or dual-use controlled
              technology. The verification risk is equally important: the very secrecy that protects national-security
              work also prevents outside investors from independently validating contract scope, operational
              performance, legal authorizations, and customer acceptance. A clean diligence process therefore needs a
              secure data room, counsel memo, export-control classification matrix, facility-clearance roadmap,
              contracting-history evidence, and a protocol for investors to verify classified claims through cleared
              counsel rather than press narratives.
