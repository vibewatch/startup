      - number: '2.2'
        title: Multiple market-sizing lenses
        blocks:
          - type: paragraph
            body: >-
              No single public TAM number is decision-grade for Cathedral. The broadest lens is U.S. federal
              cybersecurity spending, which provides at least a roughly $26 billion annual context but includes civilian
              and infrastructure spend that Cathedral should not count as core SAM. A second lens is DoD and mission
              cyber spend, but public budget books do not fully isolate classified offensive cyber programs. A third
              lens is military AI: MarketsandMarkets and Grand View both show a multibillion-dollar market but differ
              sharply on growth rate and endpoint, so a range is more honest than a point estimate. A fourth lens is
              cyber-warfare market research, where Mordor’s 2026-to-2031 estimate is closer to Cathedral’s
              job-to-be-done but still mixes products, services, and end users. The SOM lens should remain
              contract-pipeline based until Cathedral discloses revenue or awards.
