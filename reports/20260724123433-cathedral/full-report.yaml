      - number: '8.3'
        title: Grow-in scenarios and sensitivity
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to underwrite a pre-revenue mark is to ask what future contract revenue must arrive for
              the price to become ordinary. At a 10x revenue multiple, Cathedral needs roughly $140 million of annual
              revenue to support $1.4 billion; at 5x, it needs about $280 million; even at an aggressive 15x, it needs
              roughly $93 million. That frames the 18-to-24-month test. The bull case requires rapid conversion of
              access into paid military-cyber programs and repeatable software economics. The base case is a well-funded
              product and pilot buildout that still leaves the current valuation hard to defend. The bear case is a
              procurement or political delay that forces dilution, down-round pricing, or a long period where the
              valuation is merely a narrative mark.
