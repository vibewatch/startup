              The incumbent contractor threat is distribution-led. Booz Allen, Leidos, SAIC, CACI, Peraton, ManTech, and
              Parsons all market cyber capabilities, and public contract coverage shows the same names appearing around
              Navy cyberspace operations support, Army cyber-warfare work, and GSA Alliant 3. This matters because the
              buyer Cathedral wants—the U.S. military and adjacent national-security agencies—already has pathways to
              procure cyber operations, systems integration, AI, and managed services without waiting for a new stealth
              startup to mature. Cathedral can still win if it provides a step-function AI advantage or if founders
              convert relationships into rapid pilots, but the practical sales hurdle is severe: incumbents know
              compliance, cleared staffing, recompetes, protests, and program-office rhythms. A new entrant must either
