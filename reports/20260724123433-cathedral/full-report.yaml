  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Cathedral should be sized inside a narrow national-security cyber market: AI-enabled defensive and
              offensive cyber tools, vulnerability discovery, workflow software, and related services sold to DoD and
              intelligence-community operators. That boundary intentionally excludes broad enterprise security, consumer
              cybersecurity, generic federal IT services, and physical defense hardware, even though those categories
              create context and comparable valuations. The core user problem is not simply buying another SOC tool; it
              is accelerating cyber operations against nation-state adversaries while satisfying classified-network,
              zero-trust, and command-authority requirements. The strongest substitutes are therefore internal Cyber
              Command and NSA capability, incumbent defense contractors, manual red-team or penetration-testing teams,
              and civilian CISA-style practices for defensive hygiene. This framing keeps Cathedral’s opportunity tied
              to mission cyber workflows rather than a generic cybersecurity TAM.
