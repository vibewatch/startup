    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and business model
        blocks:
          - type: paragraph
            body: >-
              Cathedral is visible in the public record as a stealth AI-powered military cybersecurity company rather
              than as a conventional launched software vendor. Reuters’ David Jeans, republished by U.S. News, and
              follow-on coverage from The Next Web, Hoodline, Gizmodo, and Cyber Daily consistently describe a company
              formed by former DOGE operators to expand U.S. military cyber capabilities. The supportable business model
              is therefore narrow but important: win U.S. government contracts for AI-driven offensive and defensive
              cyber operations, potentially with dedicated compute supplied by an acquisition or data-center
              partnership. The headquarters is not disclosed in the reviewed sources; the strongest geographic signal is
              Washington/Pentagon proximity, not a corporate address. I use 2025 as the founding year with medium
              confidence because the July 2026 Reuters account says the company launched in recent months after the
              founders’ 2025 DOGE tenure. Stage should be recorded as stealth/private-undisclosed: the round is large,
              but product documentation, customers, revenue, and headcount are absent.
