      - number: '2.5'
        title: Constraints, adverse view, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The adverse market view is straightforward: Cathedral may be valued like a once-in-a-generation
              defense-tech platform while competing for a much smaller, slower, and more classified spend pool than
              headline TAMs imply. Procurement cycles can stretch 18-24 months or longer once ATO, zero-trust alignment,
              security clearances, data handling, and contracting mechanics are included. Incumbent contractors also
              have award history, cleared personnel, and contracting infrastructure that a stealth startup must either
              build or partner around. Public sources do not yet verify Cathedral revenue, customers, contracts,
              authority-to-operate status, or classified deployment footprint. The next diligence step is therefore
              account-level: identify funded program offices, active solicitations, sponsor users, security
              accreditation path, and whether the company is selling tools, services, or mission outcomes.
            claimRefs:
              - CM008
              - CM027
              - CM031
              - CM036
              - CM037
              - CM044
              - CM045
