      - number: '1.4'
        title: Cover metrics, gaps, and valuation context
        blocks:
          - type: paragraph
            body: >-
              The cover metrics should be explicit rather than embellished: valuation is $1.4 billion; disclosed capital
              raised is $160 million; revenue, ARR, customer count, contracts, pilots, headquarters, and headcount are
              null in the reviewed public record. That gap is not a trivial private-company nuisance because Cathedral
              is already priced like a breakout defense-AI company while remaining stealth on commercial proof. The $1.4
              billion valuation can be contextualized against Anduril’s 2026 $5 billion Series H at a $61 billion
              valuation, but the comparison cuts both ways. It shows investor willingness to pay premium prices for
              defense technology, while also highlighting Cathedral’s much earlier evidence base: no disclosed
              contracts, no product documentation, no operating metrics, and no official company announcement. Later
              chapters should not infer traction from financing alone. The right diligence path is management-provided
              pipeline detail, contract status, revenue recognition policy, compute strategy, security controls, and
              hiring plan.
