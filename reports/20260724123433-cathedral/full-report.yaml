      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-party. DoD program offices and service cyber components are likely budget owners;
              Cyber Command, NSA collaborators, and mission teams are likely users and technical evaluators; contracting
              officers and security authorities can determine whether a pilot becomes real spend. Cathedral’s most
              plausible adoption path is not a consumer-style launch but a staged government sale: SBIR or DIU-style
              entry, prototype work under Other Transaction authority or similar mechanisms, then conversion into a FAR
              contract or program of record if mission value, security controls, and funding line up. That path creates
              upside because a successful tool can become embedded in mission workflows, but it also makes public
              traction hard to observe. SAM.gov, USAspending, and DoD contract releases are useful monitors, not
              complete truth for classified cyber work.
