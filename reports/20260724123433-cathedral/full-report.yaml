          x: 2
          'y': 9
          quadrant: low proof / high valuation risk
          note: No disclosed revenue or contracts.
        - label: Anduril
          x: 9
          'y': 7
          quadrant: high proof / high valuation
          note: Large valuation but material revenue and product proof.
        - label: Shield AI
          x: 8
          'y': 6
          quadrant: high proof / high valuation
          note: Aircraft autonomy traction and late-stage financing.
        - label: Palantir
          x: 10
          'y': 5
          quadrant: public proof / high multiple
          note: Public filing and revenue disclosure.
        - label: Typical seed startup
          x: 1
          'y': 2
