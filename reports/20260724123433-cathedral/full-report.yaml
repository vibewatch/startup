      - number: '7.2'
        title: Founder and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Cathedral’s key-person risk is unusually high for a unicorn-priced company because the investment case is
              inseparable from four young founders’ access, credibility, and execution. Public reporting identifies
              Gavin Kliger, Luke Farritor, Marko Elez, and Jack Stein as ex-DOGE staffers, but it does not show a
              seasoned management bench, revenue leadership, program-management leadership, cleared contracting
              leadership, or a public track record of delivering classified cyber programs. Kliger’s Pentagon AI
              proximity may help product discovery, but it also concentrates political and ethics exposure. Elez adds a
              separate reputational tail risk: AP reported his resignation after racist posts were linked to him,
              followed by support for his return from Musk, Vance, and Trump. In defense procurement, where trust,
              security-clearance judgment, and congressional optics matter, that controversy can become a contract
              diligence issue rather than a mere HR footnote. The mitigation is a credible operating bench, independent
              security leadership, founder-conduct covenants, and succession planning.
