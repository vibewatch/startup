      - number: '7.5'
        title: Commercial, concentration, and procurement risk
        blocks:
          - type: paragraph
            body: >-
              Commercially, Cathedral has the risk profile of a pre-revenue government-market option priced like a
              proven defense-tech platform. Reuters and follow-on coverage establish the financing, mission, investors,
              and founder access, but the public record reviewed here does not establish revenue, signed contracts,
              production users, renewal behavior, or mission outcomes. The buyer universe is also concentrated:
              Cathedral is explicitly pursuing U.S. government contracts, while export controls and classified work
              constrain rapid international diversification. Even if the Pentagon wants faster commercial adoption,
              procurement still favors incumbents with contract vehicles, past performance, cleared workforces, program
              managers, and agency relationships. Booz Allen, Leidos, Palantir, Anduril, and Washington Technology’s
              government-contractor ranking illustrate the competitive asymmetry. Cathedral’s mitigants are real only
              when evidenced: signed pilots, funded awards, contracting vehicles, security authorizations, referenceable
              program sponsors, and nonpolitical procurement wins that survive leadership changes.
