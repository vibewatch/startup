companyProfile:
  summary: >-
    Cathedral is a stealth defense-technology company founded in 2025 by four former Department of Government Efficiency
    (DOGE) staffers to apply AI to US military cyber operations, spanning both offensive capabilities (vulnerability
    discovery and exploitation against adversary systems) and defensive capabilities (protecting US military networks).
    In the weeks before a 22 July 2026 Reuters report it closed a $160 million round at a $1.4 billion post-money
    valuation co-led by Andreessen Horowitz and Sequoia Capital, both of which took board seats. The company has no
    disclosed product, revenue, or contracts, and its valuation reflects investor conviction in the founding team's
    recent senior government access rather than any commercial track record.
  foundedDate: '2025-01-01'
  founders:
    - name: Gavin Kliger
