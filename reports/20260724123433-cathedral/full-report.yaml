  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape map
        blocks:
          - type: paragraph
            body: >-
              Cathedral enters a defense-AI and cyber market where the relevant competitor set is broader than startups
              that literally say “military cybersecurity.” The first ring is defense-tech AI software and autonomy
              companies: Anduril, Palantir, Shield AI, Rebellion Defense, Vannevar Labs, and Two Six Technologies
              compete for defense modernization budgets, national-security credibility, and AI-native mission workflows.
              The second ring is cyber-specific: Horizon3.ai, XBOW, Dreadnode, RunSafe, IronNet as a failed precedent,
              and the exploit-broker ecosystem. The third ring is incumbent government contractors—Booz Allen, Leidos,
              SAIC, CACI, Peraton, ManTech, and Parsons—that already hold contract vehicles, cleared staff, and program
              relationships. Cathedral’s reported wedge is the combination of ex-DOGE government access and an
              offensive-plus-defensive AI cyber mission; the weakness is that public sources show plans rather than
              demonstrated contracts.
