  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: compute-commitment
    missingEvidence: Exact Cathedral compute commitments, data-center acquisition budget, cloud minimums, and any power or
      lease obligations.
    whyItMatters: Compute commitments determine whether the $160 million round supports multiyear runway or is rapidly consumed
      by capex and opex.
    diligencePath: Request board-approved budget, signed LOIs, leases, cloud contracts, data-center purchase documents, and
      vendor minimum commitments.
    relatedQuestionRefs:
