- id: defense-tech-comparables
  title: Defense-tech comparables and revenue trajectory
  body: 'The better comparable lesson is that defense-tech revenue can scale, but usually after years of productization, procurement
    wins, and facility buildout. Palantir is the mature public software comparator: its SEC filings show multibillion-dollar
    revenue and major government contribution, including 2025 growth in government revenue and significant U.S. government
    revenue. Anduril is the private defense-tech scale comparator: Sacra estimates it reached $2.2 billion of 2025 revenue,
    projects $4.3 billion for 2026, and reports a $5 billion Series H at a $61 billion valuation alongside a projected 2026
    operating loss. Shield AI is a smaller but relevant autonomous-systems comparator with Sacra-estimated revenue around
    $300 million for the year ending March 2025. Cathedral is much earlier than all three: its valuation resembles a late-stage
    defense-tech premium, while its disclosed revenue base resembles a seed-stage evidence gap.'
  claimRefs:
  - CI025
  - CI026
  - CI027
  - CI028
  - CI029
