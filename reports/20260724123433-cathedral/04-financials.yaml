- id: TI002
  title: Unit economics and contract-vehicle table
  columns:
  - Vehicle / model
  - Revenue mechanism
  - Margin / cash-flow implication
  - Likely Cathedral use
  - Disclosure status
  rows:
  - - SBIR / STTR
    - Non-dilutive R&D funding and commercialization bridge
    - Helpful for early validation; not proof of scalable ARR
    - Prototype cyber-AI work before production awards
    - No Cathedral award disclosed
  - - OTA / prototype pathway
    - Prototype agreement outside standard FAR contract pattern
    - Can accelerate adoption but still needs production transition
    - Mission prototype or rapid capability test
    - No Cathedral OTA disclosed
  - - CRADA
    - Federal lab collaboration with non-federal entity
    - Validation without government funding to the company
    - Technical collaboration or test environment
    - No Cathedral CRADA disclosed
  - - Firm-fixed-price
    - Fixed price for deliverables or services
    - Higher upside if productized; contractor bears cost-overrun risk
    - Future packaged cyber tool or managed capability
    - No pricing disclosed
  - - Cost-reimbursement
    - Payment of allowable incurred costs within a ceiling
    - Lower loss risk but lower margin upside and weaker product proof
    - Early R&D or bespoke defense work
    - No contract disclosed
  - - IDIQ / task orders
    - Umbrella vehicle with orders for defined work
    - Sticky if task orders recur; revenue arrives only as orders are placed
    - Program-of-record or agency-wide cyber vehicle
    - No vehicle disclosed
  notes: The table describes financially relevant contract paths, not Cathedral contracts. Each row is a potential path because
    no public Cathedral award is disclosed.
