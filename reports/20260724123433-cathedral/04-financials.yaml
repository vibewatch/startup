    severity: blocking
    topic: contract-pipeline
    missingEvidence: Named agency sponsor, award document, OTA, SBIR/STTR award, CRADA, IDIQ vehicle, or program-office letter
      for Cathedral.
    whyItMatters: Without contract evidence, sales-cycle, CAC/payback, revenue recognition, and valuation support remain speculative.
    diligencePath: Request procurement documents, agency contacts, pipeline export, DSIP/SBIR records, SAM opportunity identifiers,
      and USAspending award IDs.
    relatedQuestionRefs:
