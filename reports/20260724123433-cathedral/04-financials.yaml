- id: capital-intensity-burn-and-runway
  title: Capital intensity, burn, and runway
  body: 'The compute strategy is the biggest financial swing factor. CityBiz, EquityPandit, and Startup Fortune all report
    that Cathedral is exploring acquiring or partnering with a data center, which moves the company away from a purely variable-cloud-cost
    profile. Broader AI infrastructure sources support taking that seriously: Goldman Sachs expects AI to drive a large increase
    in data-center power demand, DOE expects domestic data-center energy use to double or triple by 2028, and Epoch AI estimates
    frontier training compute has been growing by roughly 4x to 5x annually. None of those sources gives Cathedral’s actual
    compute bill, so the chapter uses scenarios rather than pretending precision. A $160 million round can last about 40 months
    at $4 million of monthly burn, about 20 months at $8 million, and roughly 13 months at $12 million; a single $40 million
    compute outlay would materially shorten every case.'
  claimRefs:
