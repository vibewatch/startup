  - FI002
- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is track-with-caution: the balance sheet is strong for a newly formed stealth startup, but
    the underwriting file is thin. Cathedral has enough primary capital to recruit, build, clear security hurdles, and chase
    early defense programs, yet there is no public evidence of revenue quality, margin path, contract backlog, customer concentration,
    or sales efficiency. The most important diligence blockers are therefore precise and obtainable: current cash balance
    after round expenses; monthly burn by payroll, compute, security, and capture; committed data-center capex or minimum
    take-or-pay obligations; pipeline by agency and contract vehicle; and any letter, award, OTA, CRADA, SBIR, or classified
    sponsor that explains why a $1.4 billion valuation is rational before revenue. Until those items are produced, investors
    should underwrite the round as a well-financed option on government cyber-AI adoption rather than as a revenue-backed
    defense software company.'
