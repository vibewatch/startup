company:
  name: Cathedral
chapter:
  number: 4
  title: Financials
  summary: Cathedral has a large balance sheet for a stealth startup—$160 million raised at a $1.4 billion post-money valuation—but
    no disclosed revenue, ARR, contracts, or customers. The financial thesis is therefore a capital-adequacy and contract-conversion
    thesis, with compute/data-center intensity as the main burn and runway risk.
sections:
- id: capital-structure-and-current-financial-state
  title: Capital structure and current financial state
  body: 'Cathedral’s finance chapter starts with a simple but unusually aggressive capital structure: the reviewed July 2026
    coverage reports a $160 million primary financing at a $1.4 billion post-money valuation, led by Andreessen Horowitz and
    Sequoia Capital. On a pure primary-round basis, that implies roughly 11.4% new-money dilution and a pre-money valuation
    around $1.24 billion. The important underwriting point is not the arithmetic; it is the sequencing. Public sources describe
    Cathedral as a stealth military cyber startup founded by four former DOGE staffers, but they do not disclose revenue,
    ARR, recognized backlog, gross margin, paying customers, or awarded contracts. Therefore this chapter treats revenueRunRate
    and ARR as null, not small. The $160 million round is enough to fund a serious product-and-capture campaign, but the valuation
    is being carried by founder access, investor conviction, and defense-AI market appetite rather than by disclosed financial
    traction.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI044
  tableRefs:
  - TI001
  - TI005
  figureRefs:
  - FI001
- id: path-to-revenue-and-contract-economics
  title: Path to revenue and contract economics
  body: The most realistic path to revenue is staged rather than SaaS-linear. Cathedral can pursue non-dilutive SBIR or STTR
    awards, prototype work through OTA-style channels, CRADA collaboration with federal labs, DIU-style commercial-technology
    solicitations, and eventually IDIQ task orders or program-of-record procurement. Each route has different unit-economics
    consequences. Firm-fixed-price work can create better upside if Cathedral productizes cyber-AI capabilities and controls
    delivery cost, but it also pushes cost overrun risk onto the contractor. Cost-reimbursement work can de-risk early R&D
    cash conversion, yet it usually limits margin upside and is less proof of product repeatability. IDIQ vehicles and task
    orders can create sticky revenue once a mission owner standardizes around a tool, but the order flow is not automatic.
    With no disclosed pipeline, CAC and payback should be proxied through procurement-cycle duration, proposal burden, security
    accreditation effort, and conversion from prototype to production.
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI015
