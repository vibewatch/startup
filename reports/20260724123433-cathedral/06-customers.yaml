  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer proof
    missingEvidence: Named Cathedral customers, contract identifiers, pilot sponsors, production deployment dates,
      and prime/subcontract role by program.
    whyItMatters: Without named proof the chapter cannot distinguish relationship access from actual adoption or
      revenue.
    diligencePath: Request a customer schedule under NDA with award IDs, contracting office, classification level,
      deployment status, and reference contacts.
    relatedQuestionRefs:
    - QU004
    - QU005
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: retention metrics
    missingEvidence: NRR, GRR, churn, renewal, satisfaction, utilization, and cohort expansion metrics for any Cathedral
      pilots or contracts.
    whyItMatters: Retention and repeat usage determine whether early defense access can become durable recurring
      revenue.
    diligencePath: Ask management for cohort tables by buyer segment and reconcile them to invoices, award modifications,
      or usage logs.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: material
    topic: compliance status
    missingEvidence: FedRAMP package, DoD IL or ATO status, CMMC evidence, NIAP applicability, facility clearance,
      personnel-clearance roster, and classified-program approvals.
    whyItMatters: Compliance gaps can delay or block deployment even when buyers like the technology.
    diligencePath: Review security authorization artifacts, DCSA correspondence, CMMC self-assessment evidence,
      and cleared personnel records under counsel-led diligence.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: Named customer proof table
    missingEvidence: Exhaustive classified and unclassified award search results for all Cathedral legal entities
      and subsidiaries.
    whyItMatters: Public portals may miss classified awards or work performed as a subcontractor, so the public
      inventory remains partial.
    diligencePath: Obtain legal entity names, UEIs, CAGE codes, subcontract notices, and classified-program attestations
      from management.
    relatedQuestionRefs:
    - QU006
    - QU022
    relatedTableRefs:
    - TU005
