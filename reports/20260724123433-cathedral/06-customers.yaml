- id: TU004
  title: Comparable-adoption table
  columns:
  - Comparable
  - Early DoD customer proof
  - How adoption scaled
  - Lesson for Cathedral
  - Limitation of analogy
  rows:
  - - Shield AI
    - Reported U.S. Air Force deal preceded a $12.7B valuation
    - Mission-specific autonomous aircraft validation drew large financing
    - A named service deal can re-rate a defense AI startup
    - Autonomy aircraft is not cyber operations
  - - Anduril
    - Public reporting shows massive financing and defense manufacturing expansion
    - Scaled hardware/software programs and facilities reinforced credibility
    - DoD adoption tends to require production capacity, not only pitch access
    - Anduril has a longer operating history
  - - Palantir
    - 10-K says Gotham served defense and intelligence users for over a decade
    - Government revenue exceeded $1B in 2024 after long embedding cycle
    - Deep government software accounts can become durable and large
    - Palantir’s path took many years
  - - UK MOD AI partnership
    - UK official source shows allied defense ministries seeking strategic AI modernization
    - Allied AI modernization creates later expansion surfaces
    - Five Eyes expansion is plausible after U.S. validation
    - No Cathedral allied customer evidence
  notes: Comparables show adoption patterns and proof thresholds; none are evidence that Cathedral has won a customer.
