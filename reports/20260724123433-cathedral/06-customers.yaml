- id: procurement-pathways
  title: Buying process and procurement vehicles
  body: The most plausible first sale is not a conventional enterprise SaaS close; it is a defense procurement sequence.
    DIU, SBIR/STTR, AFWERX, SOFWERX, DEFENSEWERX, and OTA pathways can make a prototype possible before Cathedral
    is mature enough for a program-of-record competition. DIU explicitly invites commercial entities, including
    first-time government sellers, to submit solution briefs, while SBIR/STTR offers non-dilutive prototype funding
    and transition language. OTAs are especially relevant because they can fund prototypes and follow-on production
    outside standard procurement contracts, but GAO also notes planning and consortia discipline issues. GSA schedules
    and public contract portals matter later, once product scope, pricing, compliance, and agency demand are clearer.
    A realistic sales-cycle model is therefore twelve to twenty-four months from first mission conversation to meaningful
    revenue, and longer for classified scale.
  claimRefs:
