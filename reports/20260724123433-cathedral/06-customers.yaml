chapter:
  number: 6
  title: Customers
  summary: Cathedral has no disclosed customers or contracts, so the customer case is an addressable-buyer and go-to-market
    analysis rather than an adoption proof case. The strongest evidence supports DoD/IC mission fit and unusual
    buyer access; the largest gaps are named customer proof, compliance status, retention, and concentration.
sections:
- id: addressable-buyer-set
  title: Addressable buyer set, not disclosed customers
  body: 'Cathedral’s customer chapter has to start with an evidence boundary: public sources support a large addressable
    national-security buyer set, but they do not support any named Cathedral customer. Reuters describes the company
    as a recently launched stealth military cybersecurity startup trying to secure U.S. government contracts for
    AI-driven offensive and defensive cyber operations, and other 2026 coverage repeats the military-cyber mission
    without adding customers, deployments, pilots, or contract IDs. The most direct buyer is U.S. Cyber Command,
    with NSA and service cyber components as natural mission owners; CISA, CIA, DIA, and close allied defense ministries
    are plausible adjacent surfaces. That is market access, not adoption. For diligence, the active-customer count,
    production-deployment count, NRR, churn, renewal rate, and revenue concentration should remain null until Cathedral
    provides award documents or customer references.'
