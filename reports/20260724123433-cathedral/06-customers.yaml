- id: TU006
  title: Retention, expansion, and concentration diligence table
  columns:
  - Metric / risk
  - Public value
  - Implication
  - Investor diligence path
  rows:
  - - Customer count
    - null
    - No denominator for adoption, retention, or concentration
    - Request active customers, pilots, and funded contracts split by classification
  - - NRR / GRR / churn
    - null
    - Durability cannot be underwritten from public data
    - Request cohort retention, renewal rates, and lost-pilot reasons
  - - Top-customer concentration
    - null
    - A single classified sponsor could dominate early revenue
    - Request revenue concentration by customer and program
  - - Land-and-expand path
    - Prototype to OTA to program of record
    - Expansion is plausible but depends on compliance and mission proof
    - Ask for funded milestones and transition sponsor
  - - Revolving-door scrutiny
    - Material adverse risk
    - Government access could accelerate sales or trigger oversight backlash
    - Review ethics opinions, recusals, cooling-off rules, and communications logs
  notes: This table intentionally preserves null customer metrics instead of fabricating early traction.
