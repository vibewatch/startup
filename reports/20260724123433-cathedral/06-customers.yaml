- id: TU002
  title: Procurement-vehicle table
  columns:
  - Vehicle
  - Best fit for Cathedral
  - Typical entry point
  - Scale path
  - Key friction
  rows:
  - - DIU Commercial Solutions Opening
    - Commercial AI cyber prototype with urgent mission pull
    - Solution brief to DIU solicitation
    - Prototype OT or transition to DoD sponsor
    - Requires mission owner and operational evaluation
  - - SBIR/STTR
    - Non-dilutive R&D for eligible small business
    - Topic proposal and Phase I award
    - Phase II, transition, commercialization
    - Eligibility, topic fit, and transition funding
  - - Other Transaction Authority
    - Prototype or follow-on production outside standard FAR contract
    - Service, DIU, or consortium OTA
    - Follow-on production if statutory conditions met
    - Planning, consortium fees, and transition discipline
  - - GSA Multiple Award Schedule
    - Later repeat buying for less-classified software/services
    - Schedule award and agency ordering
    - Multi-agency ordering surface
    - Not ideal before product, pricing, and compliance mature
  - - AFWERX / SpaceWERX
    - Air Force or Space Force cyber and AI pilots
    - SBIR/STTR open topic or challenge
    - Program office or Space Force transition
    - Pilot-to-program handoff risk
  - - SOFWERX / DEFENSEWERX
    - SOCOM or service problem discovery
    - Challenge, prize, assessment, demo event
    - Sponsor-funded prototype or OTA
    - Often pre-procurement and non-binding
  - - Program of record
    - Enduring budget and scaled deployment
    - Requirement, acquisition strategy, competition
    - Multi-year sustainment and expansion
    - Slowest path; requires proof, budget, and compliance
  notes: Vehicles are ordered roughly from entry-friendly experimentation to durable program scale; actual path
    depends on classified sponsor demand.
