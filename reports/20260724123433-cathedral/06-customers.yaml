- id: TU003
  title: Compliance-requirements table
  columns:
  - Requirement
  - Why it matters for Cathedral
  - Likely evidence needed
  - Current public status
  - GTM implication
  rows:
  - - FedRAMP
    - Cloud services used by federal agencies usually need authorization
    - Marketplace listing, agency ATO package, assessor evidence
    - No Cathedral listing disclosed
    - Blocks unclassified SaaS-style deployment until solved
  - - DoD Impact Levels IL4/IL5/IL6
    - DoD cloud workloads require impact-level posture and provisional authorization
    - DoD SRG mapping, PA/ATO evidence, hosting boundary
    - No public DoD IL evidence
    - May force GovCloud/DoD cloud architecture early
  - - Authority to Operate
    - Mission systems generally need customer authorization before operational use
    - System security plan, controls, testing, authorizing official
    - No ATO disclosed
    - Can add months after prototype selection
  - - CMMC / DIB cyber hygiene
    - Defense contractors handling CUI face cybersecurity self-assessment or certification obligations
    - SPRS/CMMC records, policy scope, assessor outputs
    - No Cathedral status disclosed
    - Diligence ask before any CUI work
  - - NIAP / Common Criteria
    - Security products may face product-assurance expectations in national-security environments
    - Protection profile mapping or evaluated-products status
    - No validation disclosed
    - May matter for endpoint/network products
  - - Facility clearance and FOCI
    - Classified contract performance requires cleared entity vetting
    - DCSA facility clearance and FOCI clearance
    - No FCL disclosed
    - Hard gate for classified programs
  - - Personnel clearances / TS/SCI
    - Operators and engineers may need access to classified networks and data
    - Cleared personnel roster and program access approvals
    - No public staffing detail
    - Limits how fast pilots can become classified deployments
  notes: Rows are compliance gates likely to apply to a defense cyber vendor; null public status is a diligence
    gap, not proof the control is absent.
