- id: compliance-and-classified-access
  title: Compliance and classified-access gates
  body: 'Compliance is likely to be as important as model quality for Cathedral’s customer conversion. A cyber capability
    delivered into federal or DoD environments can face FedRAMP, DoD impact-level, ATO, CMMC, product assurance,
    and classified-access gates. DCSA’s facility-clearance language is particularly important: any entity providing
    goods or services involving classified information generally needs facility clearance before performance. Microsoft’s
    DoD IL5 documentation also illustrates that DoD cloud authorization adds requirements beyond ordinary commercial
    hosting. Cathedral has not publicly disclosed any FedRAMP listing, ATO, DoD IL authorization, CMMC posture,
    NIAP validation, facility clearance, TS/SCI-cleared staffing base, or classified program access. That absence
    should not be over-read for a stealth company, but it is a gating diligence package before investors can underwrite
    deployability.'
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU039
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: founder-access-and-adverse-angle
  title: Founder access advantage and revolving-door critique
  body: 'Cathedral’s unusual go-to-market advantage is also its most obvious adverse diligence angle. Reuters reported
    that the founding team has deep ties to the Trump administration and national-security officials, including
    the Pentagon, and those relationships could reduce the cost of finding a mission owner. In defense technology,
    that access is valuable because the hardest early step is often getting a real sponsor to define an urgent,
    funded problem. The same fact pattern creates a revolving-door and conflict-of-interest risk: critical coverage
    has already framed the ex-DOGE transition into military technology as controversial, and Reuters warned that
    government-contract scrutiny could intensify if political control changes. The diligence ask is not only whether
    Cathedral can get meetings; it is whether those meetings can survive ethics review, contracting-office scrutiny,
    protests, congressional oversight, and changes in administration.'
  claimRefs:
  - CU003
  - CU007
  - CU041
  - CU042
  - CU043
  tableRefs:
  - TU006
- id: comparable-adoption-lessons
  title: Comparable adoption lessons
  body: 'Anduril, Palantir, and Shield AI show what Cathedral must eventually prove. Shield AI’s valuation step-up
    after a U.S. Air Force deal suggests that mission validation can unlock private financing, but it also shows
    that a named service relationship is the proof point investors want. Anduril’s $5 billion Series H and manufacturing
    expansion show the scale of capital and production credibility that defense buyers reward once a company moves
    beyond demos. Palantir is the durability benchmark: its Form 10-K describes Gotham serving defense and intelligence
    users for over a decade and discloses more than $1 billion of government revenue for 2024. Cathedral has none
    of that customer proof yet. Its near-term customer story is therefore a high-access pipeline thesis, not a validated
    adoption thesis.'
