  - id: FE005
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 根据推断，Cathedral 产品要跑通，算力、涉密资质、模型、数据、ATO 和任务买方依赖都要同时到位。
    data:
      nodes:
        - id: funding
          label: $160M 资本基础
        - id: compute
          label: 专用 / 涉密算力
        - id: cleared
          label: 具备许可的人员和设施
        - id: models
          label: 前沿或网络安全专用模型
        - id: data
          label: 漏洞与任务数据
        - id: evals
          label: 网络能力评估框架
        - id: ato
          label: RMF / ATO 材料包
        - id: dod
          label: DoD 网络集成
        - id: ops
          label: 获授权网络行动
      edges:
        - from: funding
          to: compute
          label: 资本撬动
        - from: compute
          to: models
          label: 训练 / 推理
        - from: cleared
          to: data
          label: 访问控制
        - from: data
          to: evals
          label: 真实标注
        - from: models
          to: evals
          label: 能力测试
        - from: evals
          to: ato
          label: 控制证据
        - from: compute
          to: ato
          label: 边界
        - from: ato
          to: dod
          label: 授权
        - from: dod
          to: ops
          label: 部署
        - from: cleared
