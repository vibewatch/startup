      - CV023
      - CV024
      - CV025
  - id: FV002
    title: 乐观 / 基准 / 悲观估值区间
    type: range
    layout: standard
    summary: 当前估值只有在乐观路径下才说得通；基准和悲观情形都指向等待或重定价。
    data:
      items:
        - label: 悲观重定价
          low: 0.05
          mid: 0.3
          high: 0.8
          unit: USD B
          note: 若合同迟迟未到，用早期基准 / 重定价框架衡量。
        - label: 基准观察名单价值
          low: 0.8
          mid: 1
          high: 1.4
          unit: USD B
          note: 产品和试点推进，但收入证据仍有限。
        - label: 乐观成长兑现价值
          low: 1.4
          mid: 2
          high: 4
          unit: USD B
          note: 大额政府网络合同支撑溢价倍数。
    approximationNotes: 区间是情景启发式估算，锚定成长兑现收入测算和公开可比公司。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV037
  - id: FV003
    title: 溢价构成瀑布图
    type: waterfall
    layout: standard
    summary: 估值叙事先加上团队、投资人和市场溢价，再扣掉大额业务牵引折价。
    data:
      items:
        - label: 普通早期国防基线
          value: 0.05
          unit: USD B
        - label: 团队 / 政府触达溢价
          value: 0.55
          unit: USD B
        - label: a16z + Sequoia 信号
          value: 0.35
          unit: USD B
        - label: 国防 AI 热潮与稀缺性溢价
          value: 0.7
          unit: USD B
        - label: 无收入 / 无合同折价
          value: -0.25
          unit: USD B
    approximationNotes: 瀑布图数值是示意性拆解，不是独立估值。
    claimRefs:
      - CV008
      - CV009
      - CV025
      - CV032
      - CV041
      - CV042
  - id: FV004
    title: 证据与估值风险象限
    type: quadrant
    layout: wide
    summary: 与更成熟的国防科技参照相比，Cathedral 落在高估值风险 / 低证据象限。
    data:
      points:
        - label: Cathedral
          x: 2
          'y': 9
          quadrant: low proof / high valuation risk
          note: 未披露收入或合同。
        - label: Anduril
          x: 9
          'y': 7
          quadrant: high proof / high valuation
          note: 估值很大，但有实质收入和产品证据。
        - label: Shield AI
          x: 8
          'y': 6
          quadrant: high proof / high valuation
          note: 飞行器自主业务有牵引力，且已完成后期融资。
        - label: Palantir
          x: 10
          'y': 5
          quadrant: public proof / high multiple
          note: 公开申报和收入披露。
        - label: 典型种子期创业公司
          x: 1
          'y': 2
          quadrant: low proof / low valuation
          note: 小估值基线。
        - label: Rebellion Defense
          x: 5
          'y': 4
          quadrant: private proof / opaque valuation
          note: 私营产品参照，缺少公开倍数。
    approximationNotes: 轴为定性评分：x=公开证据，y=估值风险。
    claimRefs:
      - CV004
      - CV011
      - CV014
      - CV017
      - CV018
      - CV019
      - CV022
      - CV023
