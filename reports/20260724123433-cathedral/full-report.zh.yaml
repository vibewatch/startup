    title: 溢价拆解表
    columns:
      - 组成项
      - 对 $1.4B 故事的指示性贡献
      - 证据依据
      - 投资含义
    rows:
      - - 团队 / 资源入口溢价
        - 很高
        - 创始人据报道是有政府关系的前 DOGE 员工
        - 信号真实，但政治上脆弱
      - - 投资人信号溢价
        - 高
        - a16z 和 Sequoia 领投并取得董事席位
        - 验证机会，也可能放大价格
      - - 国防 AI 市场溢价
        - 高
        - Anduril、Shield AI 与赛道融资热说明需求强
        - 支撑品类热度
      - - 稀缺性溢价
        - 中
        - 具备这种资源入口的 AI 原生军事网络安全创业公司很少公开可见
        - 更多团队进入后可能消退
      - - 牵引力折价
        - 大幅负向
        - 没有公开收入、公开合同或产品披露
        - 无法给出基本面支撑的买入结论
      - - 稀释 / 优先权压力
        - 负向
        - 大额前置融资后面可能跟着昂贵的基础设施和合规支出
        - 入场前必须看后续融资条款
    notes: 仅作定性拆解；它解释估值标记，但不证明公允价值。
