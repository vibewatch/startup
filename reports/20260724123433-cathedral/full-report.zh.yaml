              报道过的创始人清单，而不是完整管理层或董事会名单。Kliger 是公开人物里战略重要性最高的一位，因为报道称他曾任五角大楼首席数据官，并参与美国国防部与 Anthropic 围绕 Claude
              军事使用方式的争议。Farritor 带来 DOGE / GSA 降本经验和 SpaceX 实习背景；Elez 同时带来技术履历，以及来自财政部访问权限和社交媒体发帖事件的实质声誉 / 控制风险。Stein
