      - number: '7.5'
        title: 商业、集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              商业上，Cathedral 的风险画像更像一个尚无收入的政府市场期权，却按已验证的防务科技平台定价。Reuters 及后续报道可以坐实融资、
              使命、投资人和创始人的政府通道，但本报告审阅的公开记录尚未坐实收入、已签合同、生产环境用户、续约行为或任务结果。 买方范围也高度集中：Cathedral
              明确追逐美国政府合同，而出口管制和涉密工作限制它快速走向国际多元化。 即便 Pentagon 希望更快采用商业技术，采购仍然偏向已有合同载体、过往业绩、涉密资质员工、项目经理和机构关系的既有承包商。 Booz
              Allen、Leidos、Palantir、Anduril，以及 Washington Technology 的政府承包商排名，都说明这种竞争不对称。 Cathedral
              的缓释项只有在有证据时才成立：已签试点、有资金支持的授标、合同载体、安全授权、可背书的项目赞助方， 以及能经受领导层更替的非政治性采购胜利。
