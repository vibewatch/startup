  - id: FV001
    title: 可比估值条形图
    type: bar
    layout: wide
    summary: 按绝对估值，Cathedral 远低于后期国防赢家；但相较常规创立阶段基准又高出很多。
    data:
      items:
        - label: Cathedral 投后估值
          value: 1.4
          unit: USD B
        - label: Anduril 2026
          value: 61
          unit: USD B
        - label: Shield AI 2026
          value: 12.7
          unit: USD B
        - label: Shield AI 2025
          value: 5.3
          unit: USD B
        - label: 典型种子轮高端
          value: 0.05
          unit: USD B
        - label: 典型 Series A 高端
          value: 0.055
          unit: USD B
    approximationNotes: 基准条使用已抓取基准来源中的高端代表区间。
