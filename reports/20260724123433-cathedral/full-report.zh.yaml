              校友曾担任敏感角色、访问政府系统、成为政治焦点，然后进入风险资本支持、可能再卖回同一政府的业务。这同时提出三个尽调问题。第一，是否有创始人获得过非公开的涉密或采购敏感需求知识，从而形成不公平竞争优势？第二，在
              DOGE 任职后这么快授予合同，合同官和伦理官员是否会接受？第三，2028 年后的政府或民主党国会是否会把 Cathedral 变成 DOGE
              相关监督的测试案例？缓释手段很窄：独立伦理审查、回避、冷却期合规、洁净室式产品需求，以及投标前的董事会级文件记录。
