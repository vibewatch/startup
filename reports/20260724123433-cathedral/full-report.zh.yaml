  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值与建议
        blocks:
          - type: paragraph
            body: >-
              Cathedral 的估值章节从两点开始：融资轮次计算异常干净，运营证据异常薄弱。已报道的 $160 million 融资、$1.4 billion 投后估值， 意味着约 $1.24 billion 投前估值和约
              11.4% 的主融资稀释。对于一家 2025 年左右创立、未披露收入、 ARR 或合同胜利的公司，这是极高价格。分母缺失，无法计算收入倍数或 ARR 倍数；用零会误导，因此正确字段是 null。
              投资立场因此是继续研究，信心低、风险高，估值立场偏贵。这个估值可由创始人与 DOGE 关联的政府通道、顶级投资人背书和防务科技市场热度解释， 但公开证据尚不足以支持由基本面兜底的买入建议。
