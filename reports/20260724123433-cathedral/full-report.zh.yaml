    - name: Marko Elez
      role: 联合创始人
      background: 前 SpaceX 工程师、DOGE / 财政部工作人员；其系统访问曾引发安全控制审查。
      claimRefs:
        - CO009
    - name: Jack Stein
      role: 联合创始人
      background: 前 DOGE 工作人员。
      claimRefs:
        - CO010
  foundingLocation: United States
  headquarters: United States (undisclosed)
  productSummary: AI 驱动的平台（未披露，且大概率涉密），拟支持美国军方网络行动，把进攻性漏洞发现和利用、防御性威胁检测和响应结合起来；公司也在寻求专用数据中心算力来运行这些行动。
  customerFocus: 美国国防部、美国网络司令部、NSA 以及更广泛的情报共同体；作战目标集则是对手系统，尤其是中国。
  businessModel: 面向 AI 驱动的进攻和防御网络工具与服务，获取美国政府合同，预计路径包括 SBIR/STTR、OTA 以及直接合同 / 正式项目合同工具。
