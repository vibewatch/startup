  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Cathedral 的规模测算应放在狭义国家安全网络市场里：面向 DoD 和情报共同体操作人员销售的 AI
              赋能防御和进攻网络工具、漏洞发现、工作流软件及相关服务。这个边界有意排除广义企业安全、消费者网络安全、通用联邦 IT 服务和实体国防硬件，尽管这些类别能提供背景和可比估值。核心用户问题不是再买一个 SOC
              工具，而是在满足涉密网络、零信任和指挥授权要求的同时，加速针对国家级对手的网络行动。因此，最强替代方案是内部 Cyber Command 和 NSA 能力、既有国防承包商、人工红队或渗透测试团队，以及 CISA
              式民用防御卫生实践。这样的框架把 Cathedral 的机会绑定在任务网络工作流上，而不是泛化的网络安全 TAM。
