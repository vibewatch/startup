            body: >-
              这条时间线离不开 DOGE、国防采购和 AI 网络政策。DOGE 由 2025 年 1 月行政令创建，随后与激进的联邦降本和超过 250,000 名员工离职联系在一起，并于 2026 年 7 月 4
              日终止。几周后，Cathedral 以 DOGE 校友公司身份公开浮出水面，带着国防网络雄心和大额风险资本。同一时期还包括 Anthropic-Pentagon 争议，Kliger
              被报道参与其中，这一点重要，因为它显示他靠近军用系统 AI 使用规则；还包括 Gold Eagle，即白宫 2026 年 7 月推出的 AI 赋能漏洞协调清算平台。这些事实不能证明 Cathedral
              已有合同，但解释了为什么投资人可能相信时点异常有利。反过来，它们也制造反向风险：DOGE 旋转门叙事、Elez 过往争议，以及未来合同可能遭遇国会审查，都应该放进概览，而不是推迟到后面的风险章节。
