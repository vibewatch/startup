chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              公开记录里，Cathedral 更像一家隐身的 AI 军事网络安全公司，而不是一家常规已发布的软件供应商。Reuters 的 David Jeans 经 U.S. News 转载的报道，以及 The Next
              Web、Hoodline、Gizmodo、Cyber Daily 的后续报道，都一致描述这家公司由前 DOGE 执行人员创立，目标是扩展美国军方网络能力。因此，可支撑的商业模式很窄但重要：为 AI
              驱动的进攻和防御网络行动赢得美国政府合同，潜在还要靠收购或数据中心合作拿到专用算力。受审阅来源没有披露总部；最强地理信号是靠近 Washington / Pentagon，而不是公司地址。我以中等置信度把
              2025 年作为成立年份，因为 2026 年 7 月 Reuters 报道称，公司是在创始人 2025 年 DOGE 任期之后的近几个月启动。阶段应记录为隐身 /
              私有未披露：融资规模很大，但产品文档、客户、收入和员工人数都缺席。
