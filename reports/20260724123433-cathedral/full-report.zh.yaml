      - number: '4.5'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              财务结论是谨慎跟踪：对一家新成立的隐身初创公司而言，资产负债表很强，但承销文件很薄。Cathedral
              有足够主融资去招聘、建设、跨过安全门槛并争取早期国防项目，却没有公开证据证明收入质量、利润率路径、合同积压、客户集中度或销售效率。因此，最重要的尽调卡点具体且可取得：扣除融资费用后的当前现金余额；按薪酬、算力、安全和项目捕获
              拆分的月度烧钱；已承诺的数据中心资本开支或最低照付不议义务；按机构和合同工具拆分的管线；以及任何信函、中标、OTA、CRADA、SBIR 或涉密赞助方，能够解释为什么收入前 $1.4 billion
              估值是合理的。在拿出这些材料前，投资人应把这轮融资承销为一个资金充足的政府网络 AI 采用期权，而不是一家收入支撑的国防软件公司。
