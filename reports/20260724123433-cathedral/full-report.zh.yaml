  - id: FU001
    title: 国防客户旅程图
    type: journey-map
    layout: wide
    summary: Cathedral 可能先靠关系触达和任务匹配切入客户，但收入要等采购、合规和部署证据跑通。
    data:
      items:
        - label: 触达
          detail: 创始人关系和投资人背书，打开与国家安全买方的第一轮对话。
        - label: 任务问题
          detail: USCYBERCOM、NSA 和各军种单位定义进攻或防御网络用例。
        - label: 原型载体
          detail: DIU、SBIR/STTR、AFWERX、SOFWERX 或 OTA 为评估买单。
        - label: 安全授权
          detail: FedRAMP、DoD IL、ATO、CMMC、设施许可和人员许可成为闸口事项。
        - label: 作战部署
          detail: 涉密或非涉密系统从试点进入任务环境。
        - label: 项目扩张
          detail: 后续量产、GSA 采购或列装项目，把使用转成可持续收入。
    approximationNotes: 旅程来自公开采购和合规路径推断，并非来自 Cathedral 已披露销售。
    claimRefs:
      - CU007
      - CU018
      - CU020
      - CU023
      - CU026
      - CU029
      - CU037
      - CU038
