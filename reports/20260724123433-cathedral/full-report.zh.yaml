      - number: '4.2'
        title: 收入路径与合同经济性
        blocks:
          - type: paragraph
            body: >-
              最现实的收入路径是分阶段推进，而不是 SaaS 线性增长。Cathedral 可以争取非稀释性 SBIR 或 STTR 资助，通过 OTA 式渠道做原型，与联邦实验室开展 CRADA 合作，参与 DIU
              式商业技术征集，最终进入 IDIQ 任务订单或正式项目采购。每条路径都会带来不同的单位经济性后果。若 Cathedral 把网络 AI
              能力产品化并控制交付成本，固定总价工作可以带来更好上行空间，但也把成本超支风险压到承包商身上。成本补偿型工作能降低早期 R&D
              现金转化风险，却通常限制利润率上行，也较难证明产品可重复性。一旦任务所有者围绕某个工具标准化，IDIQ 工具和任务订单可以产生黏性收入，但订单流不会自动到来。没有披露管线时，CAC
              和回本周期应通过采购周期长度、投标负担、安全认证工作量，以及从原型转生产的转化率来代理。
