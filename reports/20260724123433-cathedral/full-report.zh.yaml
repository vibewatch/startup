companyProfile:
  summary: >-
    Cathedral 是一家隐身国防科技公司，2025 年由四名前政府效率部（DOGE）工作人员创立，目标是把 AI 用于美国军方网络行动，同时覆盖进攻能力（发现并利用对手系统漏洞）和防御能力（保护美国军方网络）。在 Reuters
    2026 年 7 月 22 日报道前数周，公司完成 $160 million 融资，投后估值 $1.4 billion，由 Andreessen Horowitz 和 Sequoia Capital
    共同领投，两家均获得董事席位。公司没有披露产品、收入或合同，估值押注的是创始团队近期接触美国政府高层的能力，而不是任何商业化记录。
  foundedDate: '2025-01-01'
  founders:
    - name: Gavin Kliger
      role: 联合创始人
      background: 前五角大楼首席数据官；曾参与 DoD 与 Anthropic 围绕 Claude 军事用途的法律争议。
      claimRefs:
        - CO007
    - name: Luke Farritor
      role: 联合创始人
      background: 前 SpaceX 实习生、DOGE 执行人员，参与 GSA 相关工作。
