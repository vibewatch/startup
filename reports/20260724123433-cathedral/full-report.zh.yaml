      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              需求故事靠四个驱动因素支撑。第一，中国和其他国家级网络威胁让网络行动的速度和规模具有战略重要性。第二，DARPA 的 AI Cyber Challenge 验证了 AI 可以自动化漏洞发现和修复的具体想法，这与
              Cathedral 声称的任务空间接近。第三，国防科技风险投资人已经奖励那些承诺国家安全现代化的公司，Anduril 是该类别最显眼的可比公司，尽管它的自治和硬件画像不同于 Cathedral
              的网络软件切口。第四，政府效率推进可能偏好用软件和 AI 自动化替代稀缺持证劳动力。这些驱动因素支撑了大机会叙事，但不能证明采购转化、重复使用，或买方愿意授权自主进攻性网络工作流。
