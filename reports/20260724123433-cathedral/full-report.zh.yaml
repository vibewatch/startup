      - number: '7.3'
        title: 进攻性网络行动的伦理与升级风险
        blocks:
          - type: paragraph
            body: >-
              Cathedral 披露的使命——用 AI 支撑进攻和防御性的军事网络行动——落在一个敏感领域：私营承包商即便不像常规武器项目那样透明， 也可能制造国家层面的效果。Lawfare
              的框架直接切中要害：私营公司参与进攻性网络活动前，政策制定者必须先界定目标、可做动作、目标范围、法律授权、 责任，以及对无辜第三方损害的归责。Atlantic Council
              进一步指出，进攻性网络供应链不透明、碎片化且具战略敏感性； 当零日漏洞、AI 驱动的漏洞发现和对华竞争交叠时尤其如此。CSIS 还警告，低于门槛的网络活动可能绕开威慑逻辑； 关于自主性政策的评论也显示，即便
              DOD 内部人士也可能误解人类控制和网络豁免的边界。Cathedral 只有靠严格的交战规则、审计日志、法律审查、 人类授权边界、漏洞权益治理，以及独立于增长激励的红队监督，才能缓释风险。
            claimRefs:
