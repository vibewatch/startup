            body: >-
              更好的可比经验是，国防科技收入可以扩张，但通常要经历多年产品化、采购胜利和设施建设。Palantir 是成熟上市软件可比公司：其 SEC 文件显示收入达到数十亿美元，并有重大政府贡献，包括 2025
              年政府收入增长和显著美国政府收入。Anduril 是私营国防科技规模可比公司：Sacra 估算其 2025 年收入达到 $2.2 billion，预计 2026 年达到 $4.3 billion，并报道其以
