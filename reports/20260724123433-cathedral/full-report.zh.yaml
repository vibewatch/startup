      - number: '5.5'
        title: 路线图与技术风险
        blocks:
          - type: paragraph
            body: >-
              可信路线图是渐进式，而不是魔法般的自治。合理顺序应从分析师副驾驶工具和漏洞分诊开始，再推进到沙箱化漏洞利用验证、涉密算力认证、受控防御试点，最后才是严格授权的进攻性任务支持。核心技术风险包括模型幻觉、无效漏洞利用链、对抗性提示和工具操纵、外部无法复现的涉密数据评估，以及当进攻性建议看似可信却实际错误时的治理失败。Gold
              Eagle 和防御智能体类比显示，短期价值在漏洞协调和修复优先级排序。风险最高的主张是自主漏洞利用生成和接近 C2 的自动化，因为它们把安全、合法性、可靠性和升级担忧叠在一起。在 Cathedral
              发布证据或客户在许可环境下验证部署之前，产品结论是高上行、未证实。
