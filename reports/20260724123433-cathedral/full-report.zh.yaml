              交付云服务，FedRAMP 和 DoD 影响级别评估重要；ATO 需要 NIST RMF 和 SP 800-53；防务承包商 CUI 需要 CMMC；若出现经评估的端点或设备组件，NIAP
              可能重要。DefenseScoop 关于 JWCC 的报道显示，五角大楼正在跨密级和影响级别寻求 AI 和 ML，但那只是需求信号，不是 Cathedral
