        title: 最终尽调要求与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              投资委员会不应把 Cathedral 永久视为不可投；它应把当前价格视为尚未被证明。若公司能展示付费政府网络需求、可防守的技术能力、认证路径和软件式经济性，
              估值就存在可信的辩护路径。因此，所需尽调材料包很具体：合同管线和投标状态、在允许范围内的客户访谈、产品演示、安全和部署架构、 股权结构中的优先权、数据中心经济性，以及围绕政治关系的伦理控制。若 18 至 24
              个月内没有付费试点或政府合同路径浮现， 若业务主要依赖政治通道，或若未来轮次显示前期估值造成了清算优先权悬垂，投资论点就会破裂。在这些检查通过前，正确结论是继续研究，而不是买入。
