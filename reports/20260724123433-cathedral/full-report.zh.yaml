              SAM。第二个口径是 DoD 和任务网络支出，但公开预算书无法完全拆出涉密进攻性网络项目。第三个口径是军用 AI：MarketsandMarkets 和 Grand View
              都显示这是一个数十亿美元市场，但增长率和终点差异很大，因此区间比点估计更诚实。第四个口径是网络战市场研究，Mordor 的 2026 至 2031 年估算更接近 Cathedral
              的待完成任务，但仍混合了产品、服务和终端用户。在 Cathedral 披露收入或中标前，SOM 口径应继续以合同管线为基础。
