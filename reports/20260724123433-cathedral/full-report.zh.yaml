  - id: TV005
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 支持证据
      - 哪些证据会改变判断
    rows:
      - - 正方：精英团队能撬动政府网络安全需求
        - 据报道，创始人为 DOGE 前成员，方向聚焦军事网络安全
        - 技术负责人经过验证，交付团队具备涉密能力
      - - 正方：投资人在押注真实的国防科技景气
        - Anduril、Shield AI 和 a16z American Dynamism 支撑品类顺风
        - 证据显示 Cathedral 拿到差异化项目，而不只是获得关注
      - - 正方：网络作战比硬件国防更容易快速扩张
        - 软件 / 网络安全方向可能避开部分硬件制造约束
        - 可部署产品和认证路径的证明
      - - 反方：估值跑在牵引力前面
        - 未披露收入、合同或产品页
        - 签约付费试点或正式列装项目路径
      - - 反方：政治资源入口不是持久护城河
        - DOGE / Trump 关系可能招致审查，也可能随政治风向变化
        - 两党客户拉力和职业政府官员背书
      - - 反方：国防科技存在泡沫风险
        - 反向来源警告资本可能跑在采购现实前面
        - 合理入场价，或独立验证的合同储备
    notes: 反方论点聚焦估值，并不否认国防网络安全需求真实存在。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV010
      - CV032
      - CV040
      - CV046
  - id: TV006
    title: 最终尽调问题与论点破裂触发点
    columns:
      - 尽调议题
      - 缺失证据
      - 重要性
      - 推翻论点的阈值
    rows:
      - - 合同管线
        - 具名机构、投标阶段、付费试点、中标概率与时间
        - 决定 $140M+ 收入是否可能成立
        - 18-24 个月内没有可信付费路径
      - - 收入模式
        - 定价、合同类型、毛利率以及服务 / 软件组合
        - 决定公允倍数和现金需求
        - 只有定制服务，毛利结构弱
      - - 技术证明
        - 演示证据、网络能力边界、认证与安全控制
        - 把真实能力与资源入口叙事分开
        - 没有独立验证的产品能力
      - - 股权结构和优先权
        - 清算优先权、期权池、按比例认购权和治理条款
        - 大额融资轮可能形成优先权压力
        - 条款让普通股或后续入场没有吸引力
      - - 政治 / 采购风险
        - 伦理审查、冲突控制和两党客户背书
        - 资源入口在审查下可能变成负债
        - 合同看起来依赖政治关系
      - - 基础设施计划
        - 数据中心合作方、算力成本和涉密部署计划
        - 资本需求可能推高稀释
        - 算力或合规成本压垮预算
    notes: 这些问题定义了从继续研究走向可投资的路径；每一项目前都只能靠私有证据回答。
    claimRefs:
      - CV035
      - CV036
      - CV038
      - CV039
