      - number: '5.2'
        title: 架构栈与算力模型
        blocks:
          - type: paragraph
            body: >-
              最可能的架构，是在涉密数据控制包裹下的智能体栈：模型编排、网络工具使用、安全数据检索、沙箱化漏洞利用测试、操作员复核，以及接入政府环境的部署连接器。Cathedral
              被报道有意收购或合作数据中心，这一点异常重要，因为进攻性网络 AI
              不能只按商品云来评估。训练语料可能包含漏洞情报、漏洞利用工件、敏感网络遥测或涉密任务背景；推理可能生成漏洞利用链或修复指令，不能离开经认证边界。Kliger 被报道担任五角大楼首席数据官，并接触
              Anthropic / Claude 在 DoD 的使用场景，增加了创始人-市场背景，但不能证明 Cathedral
              已解决模型治理。因此，架构表把推断层和已验证依赖拆开，并标记管理层必须拿出架构图、模型卡、隔离控制、日志计划和评估结果的位置。
