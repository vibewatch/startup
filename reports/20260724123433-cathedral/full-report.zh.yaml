  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本结构与当前财务状态
        blocks:
          - type: paragraph
            body: >-
              Cathedral 的财务章节从一个简单但异常激进的资本结构开始：受审阅的 2026 年 7 月报道显示，公司以 $1.4 billion 投后估值完成 $160 million 主融资，由 Andreessen
              Horowitz 和 Sequoia Capital 领投。按纯主融资轮计算，这意味着约 11.4% 新钱稀释，投前估值约 $1.24 billion。关键承销点不是算术，而是顺序。公开来源把 Cathedral
              描述为由四名前 DOGE 工作人员创立的隐身军事网络初创公司，但没有披露收入、ARR、已确认积压订单、毛利率、付费客户或已授予合同。因此，本章把 revenueRunRate 和 ARR 视为
              null，而不是很小。$160 million 融资足以资助严肃的产品开发和项目捕获，但估值靠的是创始人准入、投资人信念和国防 AI 市场胃口，而非已披露财务牵引力。
