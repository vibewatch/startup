      - number: '7.2'
        title: 创始人与关键人风险
        blocks:
          - type: paragraph
            body: >-
              对一家按独角兽定价的公司而言，Cathedral 的关键人风险异常高，因为投资逻辑离不开四位年轻创始人的准入、可信度和执行力。公开报道确认 Gavin Kliger、Luke Farritor、Marko
              Elez 和 Jack Stein 是前 DOGE 工作人员，但没有显示成熟管理班底、收入负责人、项目管理负责人、持证合同负责人，或交付涉密网络项目的公开记录。Kliger 靠近五角大楼 AI
              可能帮助产品发现，但也集中政治和伦理暴露。Elez 还带来单独的声誉尾部风险：AP 报道称，种族主义帖文与他相关后他辞职，随后 Musk、Vance 和 Trump
              支持他回归。在信任、安全许可判断和国会观感都重要的国防采购中，这场争议可能成为合同尽调问题，而不只是 HR 脚注。缓释需要可信运营班底、独立安全领导、创始人行为契约和继任计划。
