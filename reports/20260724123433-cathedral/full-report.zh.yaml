              AI 基础设施来源也支持认真看待这一点：Goldman Sachs 预计 AI 将大幅推高数据中心电力需求，DOE 预计国内数据中心能耗到 2028 年翻倍或增至三倍，Epoch AI 估算前沿训练算力约以每年
              4x 到 5x 增长。没有任何来源给出 Cathedral 实际算力账单，所以本章采用情景，而不是假装精确。$160 million 融资在每月烧钱 $4 million 时可支撑约 40 个月，在 $8
