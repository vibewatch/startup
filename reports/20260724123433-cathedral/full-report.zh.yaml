            title: 最诚实的 TAM 是一组不完美口径的叠加
            body: 联邦网络预算、DoD 任务网络、军用 AI 和网络战预测都重要，但没有一个是干净的 Cathedral TAM。可投资问题在于 Cathedral 能否把一个涉密任务切口转成经常性项目支出。
