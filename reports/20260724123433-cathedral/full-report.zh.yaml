      - number: '2.5'
        title: 约束、反向观点与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              反向市场观点很直接：Cathedral 可能按一代一遇的国防科技平台估值，却在争夺一个比表层 TAM 暗示更小、更慢、更涉密的支出池。把 ATO、零信任对齐、安全许可、数据处理和合同机制纳入后，采购周期可能拉长到
              18-24 个月甚至更久。既有承包商也有中标历史、持证人员和合同基础设施；隐身初创公司要么自己搭建，要么围绕它们合作。公开来源尚未验证 Cathedral 的收入、客户、合同、ATO
              状态或涉密部署足迹。因此下一步尽调应落到账户层面：识别有资金的项目办公室、活跃招标、赞助用户、安全认证路径，以及公司销售的是工具、服务还是任务结果。
            claimRefs:
