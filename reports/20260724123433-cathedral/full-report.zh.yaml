            body: >-
              Cathedral 进入的是国防 AI 和网络市场，相关竞争集比字面上说“军事网络安全”的初创公司更宽。第一圈是国防科技 AI 软件和自主系统公司：Anduril、Palantir、Shield
              AI、Rebellion Defense、Vannevar Labs 和 Two Six Technologies，它们争夺国防现代化预算、国家安全可信度和 AI
              原生任务工作流。第二圈是网络垂直公司：Horizon3.ai、XBOW、Dreadnode、RunSafe、作为失败先例的 IronNet，以及漏洞交易生态。第三圈是既有政府承包商——Booz
              Allen、Leidos、SAIC、CACI、Peraton、ManTech 和 Parsons——它们已经握有合同工具、持证员工和项目关系。Cathedral 被报道的切口，是前 DOGE 政府准入与进攻加防御
              AI 网络任务的组合；弱点在于公开来源展示的是计划，而不是已证明的合同。
