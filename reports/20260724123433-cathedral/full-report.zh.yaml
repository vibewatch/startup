  - id: TV003
    title: 乐观 / 基准 / 悲观情景与敏感性表
    columns:
      - 情景
      - 18-24 个月合同 / 收入假设
      - 估值逻辑
      - 概率信号
      - 下行触发点
    rows:
      - - 乐观
        - 将资源入口转成 $100M-$150M+ 年化合同收入，或等值的已获经费项目
        - 按 10x-15x 收入倍数，$93M-$140M 收入即可支撑当前估值
        - 只有付费政府项目很快落地才说得通
        - 24 个月内没有付费试点或项目路径
      - - 基准
        - 搭起团队和试点，但收入可见度有限
        - 在收入按 10x 倍数接近 $140M 之前，当前 $1.4B 仍难解释
        - 最符合今天的公开证据
        - 试点仍未付费，或采购延期
      - - 悲观
        - 政治审查或采购拖延挡住实质性合同
        - 估值向早期国防基准重定价，或需要大幅稀释
        - 泡沫反向证据和缺少牵引力证据支撑该情景
        - 融资轮变成没有技术证明的资源入口故事
      - - 低倍数长入
        - 按 5x 需要约 $280M 收入
        - 意味着一家新网络安全公司要爬出很陡的收入曲线
        - 没有大型多年期合同则不太可能
        - 预算或认证延期
      - - 高倍数长入
        - 按 15x 需要约 $93M 收入
        - 在公开证明前就需要 Palantir / Anduril 式软件溢价
        - 只有拿下异常强的战略合同才可能
        - 国防科技倍数压缩
    notes: 区间只是情景承销测算，不是管理层指引；收入仍未披露。
