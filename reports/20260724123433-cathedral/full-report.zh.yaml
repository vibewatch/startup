        blocks:
          - type: paragraph
            body: >-
              估值溢价可拆成四个正项和一个巨大负项。团队溢价真实存在，因为创始人的政府经验可能降低采购摩擦。 投资人信号溢价也真实存在，因为 a16z 和 Sequoia 领投并拿到董事会席位，会改变市场感知。市场溢价由
              Anduril、Shield AI、 Palantir 热度，以及 a16z 的 American Dynamism 论点支撑。稀缺性溢价来自可见的 AI 原生军事网络团队数量很少。
              抵消项才是最大尽调问题：没有公开产品、收入或合同证据。关于防务科技泡沫的负面评论直接相关，因为它警告风险投资价格可能跑在采购现实前面。 政治审视、未来稀释、数据中心或合规资本开支，以及同更成熟可比公司的比较，是
              $1.4 billion 估值失守的主要路径。
