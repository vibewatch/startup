      - number: '8.2'
        title: 可比公司与倍数
        blocks:
          - type: paragraph
            body: >-
              可比公司组合解释了 Cathedral 为什么既合理又令人警惕。Anduril 和 Shield AI 证明，2026 年的私营防务科技赢家可以拿到很高估值， 但两家公司都比 Cathedral
              走得远得多。Anduril 据报 $61 billion 的估值，有公开收入规模和可见产品足迹支撑； Shield AI 的 2026 年轮次则绑定自主飞行器和空军相关进展。Palantir
              的阶段可比性更低，但可作为公开市场上限， 因为其高倍数背后有 SEC 文件、收入披露和政府业务增长。Rebellion Defense 是私营软件参照，不是估值锚，
              因为抓取来源没有给出干净的当前倍数。相对于种子轮和 Series A 基准，Cathedral 的创始期估值仍是极端离群点。
