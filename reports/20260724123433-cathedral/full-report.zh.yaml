  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与证据边界
        blocks:
          - type: paragraph
            body: >-
              Cathedral 的产品应按涉密或近涉密网络行动平台承销，而不是按公开文档齐全的 SaaS 产品承销。公开记录只支持一个任务级定义：面向美国政府买方的 AI
              驱动军事网络行动，同时覆盖针对中国等对手的进攻和防御能力。没有受审阅来源提供 Cathedral 产品名称、截图、API 文档、部署图、性能声明、ATO
              状态或点名用户。因此，本章把下文进攻和防御模块视为由公开报道和可比系统推导出的能力桶，同时把 Cathedral 特定成熟度标记为隐身。可能的客户工作流从授权任务或网络防御要求开始，经过 AI
              辅助发现和分析，最后到人类批准、修复或任务打包。这个证据边界不是脚注，而是核心产品风险。
