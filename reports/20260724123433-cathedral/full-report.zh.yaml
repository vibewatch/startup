            body: >-
              承销一个尚无收入的估值，最干净的方法是反推未来需要多少合同收入，当前价格才会变得普通。按 10x 收入倍数，Cathedral 需要约 $140 million 年收入才能支撑 $1.4 billion；按
              5x，需要约 $280 million；即便按激进的 15x，也需要约 $93 million。这划出了 18 至 24 个月的测试窗口。乐观情形要求公司迅速把通道转成付费军事网络项目，并跑出可重复的软件经济性。
              基准情形是资金充足地建设产品和试点，但当前估值仍难自圆其说。悲观情形是采购或政治延误迫使公司稀释、降价融资， 或长期停留在仅靠叙事支撑估值的阶段。
