      - number: '5.3'
        title: 类比对象与能力基准
        blocks:
          - type: paragraph
            body: >-
              公开类比对象让 Cathedral 在技术上显得可信，同时也收窄了不该假设的内容。DARPA AIxCC 表明，自主网络推理系统可以在受控开源环境中竞争漏洞发现和修复。Horizon3.ai NodeZero 和
              Dreadnode 表明，自主渗透测试和进攻性安全智能体工具已经是产品类别。Anthropic、OpenAI 和 Google
              表明前沿模型可以辅助网络工作，但它们的材料也强调安全边界、滥用监控和基准限制。HackerOne 和 arXiv 来源尤其适合做反向校验：它们提示 AI
              可以放大进攻性工作，但完全自主的真实世界漏洞利用仍不可靠，需要人类验证。如果 Cathedral 的差异化真实存在，它更可能来自涉密数据、任务集成和持证算力，而不是“使用 LLM 智能体”这个泛化事实。
