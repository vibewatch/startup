            body: >-
              买方图谱是多方结构。DoD 项目办公室和各军种网络组件可能掌握预算；Cyber Command、NSA 合作方和任务团队可能是用户和技术评估方；合同官和安全授权方决定试点能否变成真实支出。Cathedral
              最可能的采用路径不是消费者式发布，而是分阶段政府销售：通过 SBIR 或 DIU 式入口切入，在其他交易授权（OTA） 或类似机制下做原型，再在任务价值、安全控制和资金都对齐后转成 FAR
              合同或正式项目。这条路径有上行空间，因为成功工具可以嵌入任务工作流；但它也让公开牵引力很难观察。SAM.gov、USAspending 和 DoD 合同发布是有用监测器，却不是涉密网络工作的完整真相。
