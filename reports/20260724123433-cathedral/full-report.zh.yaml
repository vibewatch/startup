      - number: '7.4'
        title: 监管、出口管制与核验风险
        blocks:
          - type: paragraph
            body: >-
              监管风险远不止普通网络安全合规。若 Cathedral 为美国军事网络任务打造工具、服务、模型或运营支持，法律顾问必须先梳理 ITAR、EAR、
              Wassenaar、采购诚信、离职后限制和涉密合同约束，再让公司在海外招聘、共享技术数据、与数据中心合作、向盟友销售，或接受非美国战略投资者。
              一旦网络能力构成防务物项、防务服务、受控技术数据、先进计算物项或军民两用受控技术，ITAR 和 EAR 分析就不是可选项。
              核验风险同样关键：保护国家安全工作的保密性，也会阻止外部投资者独立验证合同范围、运营表现、法律授权和客户验收。 干净的尽调流程因此需要安全数据室、法律顾问备忘录、出口管制分类矩阵、设施许可路线图、签约历史证据，
              以及让投资者借助具备涉密资质的法律顾问核验涉密主张的协议，而不是依赖媒体叙事。
