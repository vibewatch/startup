- id: defense-ai-peers
  title: Defense-tech AI peers
  body: 'The defense-tech AI peer set is not a clean one-to-one product comparison, but it sets the bar Cathedral must clear. Anduril is the venture-backed scale outlier after a $5 billion Series H and a $61 billion valuation, with public reporting tying Lattice to missile-defense battle management. Palantir is even more institutionally embedded: its 10-K describes Gotham, AIP, Foundry, and Apollo, with Gotham serving defense and intelligence users for over a decade and government customers accounting for most 2024 revenue. Shield AI is autonomy-first rather than cyber-first, but its Hivemind AI pilot and 2026 valuation step-up show how quickly mission-proven AI systems can command capital. Rebellion and Vannevar show adjacent defense-software positioning, while Two Six is a smaller but highly relevant mission contractor because it names U.S. Cyber Command, DARPA, and DoD among its customer set.'
