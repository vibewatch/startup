  - - Shield AI
    - Defense autonomy startup
    - Reported $12.7B valuation in 2026
    - Autonomy and AI pilot for aircraft
    - Hivemind used with U.S. and allied forces
    - Mission-proven autonomy; less direct cyber overlap
  - - Rebellion Defense
    - Defense AI / critical asset software
    - No reliable current valuation in reviewed pack
    - AI fusion and asset protection
    - Defense positioning but unclear contract depth
    - Adjacent intelligence-shield positioning; status remains less transparent
  - - Vannevar Labs
    - Defense AI software
    - Private; no public valuation retained
    - National-security software / deterrence
    - Targets warfighters and federal users
    - Adjacent intelligence workflow rather than explicit cyber ops
  - - Two Six Technologies
    - Defense AI and cyber contractor
    - Private contractor; $4B DTRA IDIQ award participant
    - Cyber, information operations, agentic AI
    - Names DoD, SOCOM, Cyber Command, DARPA
    - More customer proof and contract posture; less stealth-venture upside
  - - Horizon3.ai
    - Autonomous pentesting startup
    - 5,200+ organizations claimed in 2026
    - Defensive validation via offensive testing
    - Government and critical-infrastructure use cases claimed
    - More public product proof; less military offensive mission framing
  - - XBOW
    - Autonomous offensive-security startup
    - '>$1B valuation after $120M Series C'
    - Offensive security and continuous testing
    - Enterprise/partner route via Accenture
    - Closest AI-offensive cyber startup; less explicit DoD access
  - - Dreadnode
    - Offensive AI security startup
    - ~$14M Series A in 2025
    - AI red-team infrastructure and research
    - Government potential but not proven in reviewed pack
    - AI-native offensive research; much smaller scale
  - - RunSafe Security
    - Cyber resilience startup
    - $12M Series B in 2024
    - Defensive hardening / memory safety
    - Critical infrastructure and safety-critical framing
    - Defensive niche; lower overlap with offensive mission
  - - Booz Allen / Leidos / SAIC / CACI / Peraton / ManTech / Parsons
    - Incumbent contractors
    - Top federal contractor rankings and multi-year cyber vehicles
    - Offensive, defensive, resilience, and systems integration
    - Established federal contract vehicles and program relationships
    - Distribution and trust advantage; less AI-native startup DNA
  - - Exploit brokers / offensive-cyber vendors
    - Specialized supply chain
    - Opaque market; prices and supply not transparent
    - Offensive exploit development and brokerage
    - Government customers can buy specific capabilities
    - Substitute for components of Cathedral’s mission, not a platform peer
