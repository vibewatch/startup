  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cathedral-contracts
    missingEvidence: Named pilots, contracts, contracting authority, and procurement path for Cathedral’s military cyber product.
    whyItMatters: Without contract proof, Cathedral’s reported access cannot be distinguished from a non-durable relationship advantage.
    diligencePath: Request contract register, pilot sponsors, statement-of-work excerpts, and revenue schedule under NDA.
  - type: missing-source
    severity: material
    topic: cathedral-product-proof
    missingEvidence: Technical demo, benchmark, security evaluation, or third-party assessment of Cathedral’s AI cyber capability.
    whyItMatters: The chapter can map competitors but cannot validate whether Cathedral outperforms Horizon3.ai, XBOW, Dreadnode, or incumbents.
    diligencePath: Run a controlled technical bake-off against autonomous pentesting and red-team alternatives.
  - type: conflicting-data
    severity: minor
    topic: rebellion-status
    missingEvidence: Authoritative corporate transaction or shutdown filing for Rebellion Defense if one exists.
    whyItMatters: The prompt asked to verify acquisition or wind-down; reviewed public evidence showed an active site but not a definitive corporate-status certificate.
    diligencePath: Check Delaware filings, PitchBook/CapIQ under license, and direct company confirmation.
  - type: enumeration-incomplete
    severity: minor
    topic: TP001 competitor enumeration
    missingEvidence: Classified or non-public offensive-cyber vendors and task-order incumbents that are not visible in public sources.
    whyItMatters: The most sensitive competitors in military cyber may not market publicly, so the public landscape likely undercounts classified suppliers.
    diligencePath: Ask former cyber-command procurement leads and review classified acquisition channels where permissible.
    relatedTableRefs:
    - TP001
    - TP003
