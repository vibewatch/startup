- id: differentiation-verdict
  title: Differentiation durability verdict
  body: 'Cathedral’s differentiation is plausible but unproven. The bull case is that an AI-native team with recent government operating access can combine offensive and defensive cyber workflows faster than legacy contractors, while avoiding the narrower product definitions of autonomous pentest vendors or memory-safety tools. The bear case is stronger on evidence today: the company has no disclosed revenue, no named contracts, no public product demos, and no operating history comparable to Palantir, Anduril, Shield AI, or the primes. IronNet shows that elite government pedigrees and cyber ambition can still fail when product-market fit and revenue quality do not materialize. The right diligence stance is therefore to treat founder access as an entry ticket, not a moat. The moat becomes real only if Cathedral proves cleared deployments, repeatable government procurement, and defensible proprietary cyber-AI capability.'
