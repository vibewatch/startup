company:
  name: Cathedral
chapter:
  number: 7
  title: Risks
  summary: Cathedral’s risk profile is dominated by DOGE-linked political scrutiny, founder/key-person exposure, opaque offensive-cyber
    governance, export-control constraints, and a $1.4 billion pre-revenue valuation with no disclosed contracts. The investable
    path requires proof that ethics controls, procurement access, classified verification, and customer traction survive outside
    the founders’ recent government proximity.
sections:
- id: political-reputational-and-ethics-risk
  title: Political, reputational, and ethics risk
  body: 'Cathedral’s highest-risk issue is not simply that its founders know government; it is that the company’s public identity
    is built around the DOGE-to-defense pipeline. Reuters, Vanity Fair, WIRED, AP, CREW, and GovExec collectively create an
    adverse record that investors cannot treat as noise: DOGE alumni held sensitive roles, accessed government systems, became
    politically salient, then moved into venture-backed businesses that may sell back to the same government. That raises
    three diligence questions at once. First, did any founder obtain nonpublic knowledge of classified or procurement-sensitive
    requirements that could create an unfair competitive advantage? Second, will contracting officers and ethics officials
    be comfortable with awards so soon after DOGE service? Third, will a post-2028 administration or a Democratic Congress
    turn Cathedral into a test case for DOGE-related oversight? The mitigant is narrow: independent ethics review, recusals,
    cooling-off compliance, clean-room product requirements, and board-level documentation before any bid.'
  claimRefs:
  - CR006
  - CR007
  - CR009
  - CR010
  - CR013
  - CR014
  - CR015
  - CR017
