- id: offensive-cyber-ethics-and-escalation-risk
  title: Offensive-cyber ethics and escalation risk
  body: 'Cathedral’s reported mission—AI-enabled offensive and defensive military cyber operations—sits in a domain where
    private contractors can create state effects without the same visibility as conventional weapons programs. Lawfare’s framework
    is directly relevant: before private firms participate in offensive cyber activity, policymakers need to define objectives,
    permissible actions, target scope, legal authority, liability, and responsibility for harms to innocent third parties.
    The Atlantic Council adds that offensive cyber supply chains are opaque, fragmented, and strategically sensitive, especially
    where zero-day exploits, AI-enabled vulnerability discovery, and China competition overlap. CSIS further warns that below-threshold
    cyber activity can evade deterrence logic, while autonomy-policy commentary shows that even DOD insiders can misunderstand
    where human control and cyber exemptions fit. Cathedral can mitigate this only with rigorous rules of engagement, audit
    logs, legal review, human authorization boundaries, vulnerability-equities governance, and red-team oversight independent
    from growth incentives.'
  claimRefs:
  - CR003
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR046
