- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Political / DOGE scrutiny
    - Congressional, GAO, IG, or FOIA activity names Cathedral or a founder
    - Formal inquiry, subpoena, award pause, or negative contracting-officer finding
    - Suspend valuation step-up and require legal remediation plan
  - - Conflict-of-interest challenge
    - Competitor protest or agency ethics review challenges access to nonpublic information
    - Any sustained OCI or procurement-integrity finding
    - Treat as thesis-breaking until bids are restructured
  - - Founder conduct risk
    - Customer security office or clearance process raises Elez or other founder concerns
    - Denied clearance, sponsor objection, or board investigation
    - Require role change or governance remedy before investing
  - - Offensive-cyber oversight failure
    - Product roadmap lacks legal authorization, logging, human authorization, or target-scope controls
    - No documented ROE or customer-authority chain
    - Block deployment-dependent revenue underwriting
  - - Export-control blocker
    - Counsel cannot classify tools/data or license path for planned foreign work
    - No usable ITAR/EAR matrix before non-U.S. transfer
    - Assume U.S.-only TAM and reduce upside case
  - - Commercial proof gap
    - No signed funded government award or referenceable pilot by next financing milestone
    - Only press/investor narrative supports traction
    - Do not underwrite $1.4B+ mark without a deep discount
  - - Incumbent displacement failure
    - Pipeline loses to primes or lacks contract vehicle access
    - No credible vehicle, sponsor, or integration path
    - Reframe as acquisition/partner target rather than standalone platform
  - - Single-buyer concentration
    - Revenue, if any, depends on one office, one administration, or one classified program
    - Top customer or sponsor effectively controls survival
    - Require multi-program pipeline and budget-line visibility
  notes: Kill criteria convert broad risks into observable diligence triggers for an investment committee or later refresh.
