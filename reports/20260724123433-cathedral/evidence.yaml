evidenceGaps:
  - type: missing-source
    severity: material
    topic: headquarters-identity
    missingEvidence: >-
      An official Cathedral incorporation record, website, company profile, or management confirmation of headquarters
      and legal entity.
    whyItMatters: >-
      Headquarters and legal entity affect procurement eligibility, export-control review, security clearances, tax, and
      recruiting diligence.
    diligencePath: >-
      Request company formation documents, SAM.gov registration, CAGE/UEI identifiers, and current office footprint from
      management.
    relatedQuestionRefs:
      - QO001
      - QO020
  - type: private-evidence-only
    severity: material
    topic: revenue-customers-contracts
    missingEvidence: >-
      Management-provided revenue, ARR, contract pipeline, awarded contract vehicles, named customers, pilots, and
      revenue-recognition policy.
    whyItMatters: >-
      The $1.4 billion valuation cannot be underwritten from public operating traction because no customers or revenue
      are disclosed.
    diligencePath: >-
      Request data room extracts covering bookings, pipeline stage, contract vehicles, customer references, and audited
      or management financials.
    relatedQuestionRefs:
      - QO008
      - QO009
      - QO021
