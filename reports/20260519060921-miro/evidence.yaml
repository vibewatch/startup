evidenceGaps:
  - id: EO001
    type: missing-source
    severity: material
    topic: series-d-or-ipo
    missingEvidence: >-
      No public Series D, tender, or IPO filing information was retained in the fetch trail after the January 2022
      Series C.
    whyItMatters: >-
      Without a later financing or filing event, investors must treat the 2022 valuation as stale and rely on secondary
      inference rather than a fresh price signal.
    diligencePath: >-
      Request internal financing history, secondary transaction data, or board materials showing any post-2022 priced
      round or liquidity event.
  - id: EO002
    type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Exact revenue mix across Free, Starter, Business, Enterprise, and add-on products is not publicly disclosed.
    whyItMatters: >-
      Pricing power and margin durability depend on understanding how much ARR comes from enterprise governance and AI
      upsell rather than lower-priced collaboration seats.
    diligencePath: >-
      Ask management for revenue segmentation by plan, attach rates for Enterprise Guard and AI products, and cohort
      expansion data by customer segment.
  - id: EO003
    type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: Public sources did not disclose churn, net revenue retention, gross retention, or cohort-level expansion dynamics.
    whyItMatters: >-
      Competitive pressure from bundled alternatives makes retention quality central to judging whether Miro's
      enterprise moat is actually compounding.
    diligencePath: Request NRR, GRR, logo churn, seat churn, and expansion rates by customer size and product bundle.
  - id: EO004
    type: conflicting-data
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: Public sources disagree on the identity of Miro's second co-founder.
    whyItMatters: >-
      Founding history is a baseline identity fact that later governance, culture, and founder-market-fit analysis
      should not inherit ambiguously.
    diligencePath: >-
      Confirm the canonical founder roster from corporate records, internal biographies, or direct company confirmation
      before reusing founder data elsewhere.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: forecast methodology
    missingEvidence: An independent audit of Mordor's market-sizing methodology and forecast intervals.
    whyItMatters: The chapter relies on one analyst model for the narrow SAM and CAGR, so interval quality is hard to underwrite.
    diligencePath: Obtain Gartner, IDC, or management-prepared market studies and reconcile assumptions against Mordor.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: geographic revenue mix
    missingEvidence: Miro's actual regional revenue and customer mix by geography.
    whyItMatters: >-
      North America leadership and Asia-Pacific growth matter for go-to-market and valuation, but Miro does not disclose
      its own split.
    diligencePath: Request internal regional ARR, pipeline, and retention dashboards from management.
    relatedQuestionRefs:
      - QM022
      - QM023
  - type: private-evidence-only
    severity: material
    topic: retention and cohort health
    missingEvidence: Category-level net retention, churn, and seat-expansion data for visual collaboration vendors.
    whyItMatters: PLG durability and bundling risk cannot be fully evaluated without renewal and expansion evidence.
    diligencePath: Ask management for cohort, GRR, NRR, and seat-expansion data by segment and competitor-displacement stories.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: minor
    topic: segment revenue split
    missingEvidence: Miro's own SME versus large-enterprise revenue mix and regulated-vertical exposure.
    whyItMatters: >-
      Public market segmentation does not reveal whether Miro over-indexes to the faster-growing or more defensible
      segments.
    diligencePath: Request segment ARR bridge, top-vertical mix, and win/loss data by buyer persona.
    relatedQuestionRefs:
      - QM003
      - QM017
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
