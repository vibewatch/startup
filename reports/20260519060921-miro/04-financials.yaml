- id: TI005
  title: Public financial gaps table
  layout: default
  summary: Five categories of financial data are structurally unavailable from public sources and must be resolved through
    private-company due diligence to support any investment decision.
  columns:
  - Missing metric
  - Why it matters
  - Current best proxy
  - Exact diligence path
  rows:
  - - Gross margin %
    - Defines sustainable EBITDA path; AI inference costs may compress it below horizontal SaaS norms
    - Benchmark range 60–80%; no Miro-specific data
    - Request P&L with COGS breakdown; AWS invoice samples; per-user compute cost
  - - Net revenue retention (NRR)
    - Key indicator of moat compounding (>120%) vs. erosion (<100%)
    - PLG model suggests >100%; unconfirmed
    - Request NRR by customer cohort and tier for last 4 quarters
  - - Burn rate and cash runway
    - Determines urgency of next financing event and negotiating leverage
    - Series C $400M raised Jan 2022; current burn unknown
    - Request monthly P&L; cash balance sheet; CFO commentary on runway
  - - Starter and Business per-seat pricing
    - Enables pricing power and ASP trend analysis
    - Sacra estimate $8–16/user; not confirmed by Miro
    - Request current rate card and any historical pricing changes
  - - Customer revenue concentration
    - If top 10 customers represent >30% of ARR, churn risk is material
    - 20 customers >$1M ACV at Jan 2022 = >$20M floor (stale)
    - Request top-20 customer ARR list with tenure; request churn data by ACV band
  notes: These five gaps are the minimum financial diligence agenda for any material investment in Miro. None can be resolved
    from public sources as of May 2026.
figures:
- id: FI001
  title: Revenue model bridge — free-to-paid conversion flow
  type: flow
  layout: standard
  summary: Miro's PLG-driven revenue model progresses from viral free-user adoption through individual seat upgrades to department-level
    expansion and finally enterprise contract capture; each stage has a distinct economic profile and upgrade trigger.
  data:
    nodes:
    - id: free-tier
      label: Free tier (3 boards)
      description: Zero-cost viral entry; no credit card; unlimited members; 10 AI credits/team/month
    - id: starter-trigger
      label: Board-limit upgrade trigger
      description: Users hit 3-board cap or require 25 AI credits; upgrade to Starter (~$8/user/month est.)
    - id: business-trigger
      label: Enterprise-feature upgrade trigger
      description: Teams need Azure DevOps integration, AI Workflows, or 50 AI credits; upgrade to Business
    - id: enterprise-contract
      label: Enterprise negotiated contract
      description: 30+ seats, SSO/SAML, data residency, compliance; ACV >$1M for top-tier accounts
    - id: addon-upsell
      label: Add-on upsell (Enterprise Guard / AI Workflows)
      description: Post-contract add-on capture; Enterprise Guard governance add-on; AI Workflows on Enterprise
    - id: platform-expansion
      label: Platform expansion (API / MCP ecosystem)
      description: Developer-API, MCP server, and marketplace revenue; currently pre-monetisation
    edges:
    - from: free-tier
      to: starter-trigger
      label: Viral collaboration drives board exhaustion
    - from: starter-trigger
      to: business-trigger
      label: Team growth drives enterprise-feature need
    - from: business-trigger
      to: enterprise-contract
      label: Sales team captures department-level demand
    - from: enterprise-contract
      to: addon-upsell
      label: Post-close upsell via governance and AI add-ons
    - from: enterprise-contract
      to: platform-expansion
      label: Enterprise customers become platform API consumers
