  evidenceGaps:
  - type: missing-source
    severity: critical
    topic: Gross margin and COGS breakdown
    missingEvidence: Miro has never disclosed its gross margin, COGS breakdown, or AWS infrastructure costs as a percentage
      of revenue; no proxy data exists in any fetched source.
    whyItMatters: Gross margin is the foundational metric for assessing whether Miro can achieve sustainable EBITDA; AI inference
      costs via AWS Bedrock could compress margins below horizontal SaaS norms, materially affecting the valuation thesis.
    diligencePath: Request audited or management-account P&L with COGS line items; obtain AWS invoice data; model per-user
      compute costs at current and projected AI feature adoption rates.
    relatedQuestionRefs:
    - QI013
  - type: missing-source
    severity: critical
    topic: Net revenue retention (NRR)
    missingEvidence: NRR has never been publicly disclosed by Miro; PLG model structurally suggests >100% but this is an inference,
      not evidence.
    whyItMatters: NRR is the primary indicator of whether Miro's competitive moat is compounding (>120%) or eroding (<100%);
      it distinguishes between durable enterprise value and at-risk growth.
    diligencePath: Request NRR by customer segment (SMB, mid-market, enterprise) for the last 4 quarters; compare to Figma
      pre-Adobe (~130%) and Notion (~100–110%) as horizontal SaaS benchmarks.
    relatedQuestionRefs:
    - QI022
