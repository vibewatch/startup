- id: section-cost-structure
  title: Cost structure, gross margin, and capital adequacy
  body: 'Miro''s cost structure is not publicly disclosed. The company is infrastructure-intensive relative to pure workflow
    SaaS: real-time canvas synchronisation across 90M+ users, AI model inference via AWS Bedrock and SageMaker, and an always-on
    multiplayer architecture all carry meaningful cloud compute costs. AWS is the confirmed primary cloud vendor per the AWS
    case study; compute costs are therefore an operating expense that scales with user engagement. Comparable horizontal SaaS
    companies in the $500M–$1B ARR range typically achieve gross margins of 70–80%, but AI-first or infrastructure-heavy platforms
    can be 10–15 percentage points lower due to inference costs. Miro''s gross margin is unknown and is a first- order due
    diligence priority.

    Miro''s headcount of approximately 1,864 employees (Forbes, September 2025) implies a revenue-per-employee of roughly
    $356K annually on a $665M ARR base, which is consistent with mid-efficiency SaaS benchmarks (top-tier is >$500K; median
    is ~$200K). The company raised $476M in total and was profitable before Series C; the burn rate post-Series C and the
    current cash position are both unknown. No bridge financing, convertible note, or down-round activity has been confirmed
    since January 2022, which is consistent with either genuine profitability or adequate Series C runway. The use-of-funds
    from the Series C—product development, global expansion, and brand investment per BusinessWire—is consistent with growth
    spending that could compress profitability from the pre-Series C baseline.

    The primary risk flag is AI infrastructure scaling costs. AWS Bedrock inference costs for the Flows and Sidekicks features,
    launched at Canvas 25 in late 2024, could materially increase COGS relative to the 2022 cost structure if adoption accelerates.
    This is unmodelable from public data and represents the primary operating-leverage uncertainty.'
