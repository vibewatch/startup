company:
  name: Miro
chapter:
  number: 4
  title: Financials
  summary: Miro's financial profile is that of a high-growth private SaaS company operating in near-total disclosure opacity.
    Sacra's third-party estimate of $665M ARR in 2024 (33% year-over-year growth from ~$420M in 2022) is the most credible
    public data point and implies a structurally sound business with PLG-driven expansion dynamics. The company was confirmed
    profitable before its January 2022 Series C, raised $476M in total, and has not disclosed any further fundraising since.
    Key financial unknowns—gross margin, burn rate, NRR, exact per-seat pricing for paid tiers—cannot be resolved from public
    sources. The $17.5B Series C valuation implies a ~26x ARR multiple on 2024 estimates, which is elevated relative to 2024
    public SaaS comps but may be defensible if enterprise NRR exceeds 120% and AI upsell monetization compounds. Financial
    diligence is highly dependent on private-company access.
sections:
- id: section-revenue-model
  title: Revenue model and pricing visibility
  body: 'Miro operates a freemium SaaS subscription model anchored on four tiers: Free, Starter, Business, and Enterprise.
    The Free tier provides 3 editable boards and 10 AI credits per team per month, creating a zero-friction entry point that
    drives product-led growth. The Starter tier adds unlimited boards and 25 AI credits per member per month, targeting small
    teams that have exceeded the Free cap. The Business tier includes 50 AI credits per member per month, the AI Workflows
    module (Flows and Sidekicks), and adds Azure DevOps and CA Rally integrations for enterprise engineering workflows. The
    Enterprise tier provides custom AI credit allocation, full governance controls via Enterprise Guard (a paid add-on), advanced
    SSO/SAML, data residency, and dedicated support.

    Miro''s pricing page (fetched May 2026) does not display dollar amounts for Starter or Business tiers publicly; Sacra
    estimates these at approximately $8/user/month and $16/user/month respectively billed annually. Enterprise pricing is
    negotiated per contract. This deliberate opacity makes independent pricing verification impossible without a live sales
    conversation. The AI Workflows module and Enterprise Guard represent upsell vectors above the base subscription, creating
    a land-and-expand model where initial seat purchase is followed by capability-driven expansion.

    Revenue streams are dominated by per-seat subscription revenue, supplemented by add-on module revenue (Enterprise Guard,
    AI Workflows), potential professional-services fees for enterprise onboarding, and the market-development platform opportunity
    (marketplace, API ecosystem). Miro''s 2022 revenue of ~$420M (Sacra estimate) and confirmed 130,000 paying customers implies
    an average revenue per paying customer of approximately $3,230 per year in 2022, consistent with a mixed SMB-to-enterprise
    book of business.'
