    whyItMatters: Per-seat pricing determines ASP trajectory and pricing-power assessment; opaque pricing prevents independent
      competitive benchmarking.
    diligencePath: Request current rate card from Miro sales; verify Sacra estimates against actual invoices from reference
      customers; request historical pricing change log.
