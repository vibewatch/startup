- id: section-gtm-traction
  title: GTM motion and traction proxies
  body: 'Miro''s go-to-market is primarily product-led growth: a free tier that requires no credit card, supports unlimited
    team members, and generates organic viral expansion as users invite colleagues to collaborate on boards. This bottom-up
    PLG motion is evidenced by the company''s trajectory from 20,000 paying customers in April 2020 (Series B close) to 130,000
    paying customers by January 2022 (Series C close), a 550% increase in approximately 22 months driven without a disclosed
    change in sales headcount. The concurrent user-base growth from 5 million to 30 million (500% in the same period) confirms
    that the viral loop—free users inviting paid collaborators who then hit upgrade triggers—is structurally intact.

    By September 2025 (Forbes), Miro had grown to 90 million users and 250,000 organisations, consistent with continued but
    decelerating organic expansion from the 2022 base. Sacra reports 33% year-on-year ARR growth at $665M for 2024, which
    is strong for a company at this scale but lower than the triple-digit rates the company reported pre-Series C. The 20
    confirmed enterprise customers with >$1M annual contract value as of January 2022 is the only public enterprise-tier benchmark
    and is now over three years stale.

    PA Consulting and ASOS case studies confirm active use of Miro''s paid tiers at enterprise scale, validating that the
    PLG bottom-up motion converts to enterprise spend. The AWS Bedrock/SageMaker partnership and active GitHub repository
    (miro-ai) confirm engineering depth that supports the enterprise premium pricing required to sustain CAC payback at enterprise
    GTM costs. No public CAC or LTV/CAC ratio data exists; both must be requested in due diligence.'
