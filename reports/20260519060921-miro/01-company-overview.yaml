  evidenceGaps:
  - id: EO001
    type: missing-source
    severity: material
    topic: series-d-or-ipo
    missingEvidence: No public Series D, tender, or IPO filing information was retained in the fetch trail
      after the January 2022 Series C.
    whyItMatters: Without a later financing or filing event, investors must treat the 2022 valuation as
      stale and rely on secondary inference rather than a fresh price signal.
    diligencePath: Request internal financing history, secondary transaction data, or board materials
      showing any post-2022 priced round or liquidity event.
  - id: EO002
    type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Exact revenue mix across Free, Starter, Business, Enterprise, and add-on products
      is not publicly disclosed.
    whyItMatters: Pricing power and margin durability depend on understanding how much ARR comes from
      enterprise governance and AI upsell rather than lower-priced collaboration seats.
    diligencePath: Ask management for revenue segmentation by plan, attach rates for Enterprise Guard
      and AI products, and cohort expansion data by customer segment.
  - id: EO003
    type: private-evidence-only
    severity: material
    topic: retention-and-churn
    missingEvidence: Public sources did not disclose churn, net revenue retention, gross retention, or
      cohort-level expansion dynamics.
    whyItMatters: Competitive pressure from bundled alternatives makes retention quality central to judging
      whether Miro's enterprise moat is actually compounding.
    diligencePath: Request NRR, GRR, logo churn, seat churn, and expansion rates by customer size and
      product bundle.
  - id: EO004
    type: conflicting-data
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: Public sources disagree on the identity of Miro's second co-founder.
    whyItMatters: Founding history is a baseline identity fact that later governance, culture, and founder-market-fit
      analysis should not inherit ambiguously.
    diligencePath: Confirm the canonical founder roster from corporate records, internal biographies,
      or direct company confirmation before reusing founder data elsewhere.
    relatedQuestionRefs:
    - QO001
    relatedTableRefs:
    - TO002
