- id: section-funding-and-capital-structure
  title: Funding and capital structure
  body: Miro's last major disclosed financing event remains the January 2022 Series C. The round brought
    in $400 million and set a $17.5 billion post-money valuation, with total funding rising to roughly
    $476 million. ICONIQ Growth led and was joined by Accel, Atlassian, Dragoneer, GIC, Salesforce Ventures,
    and TCV, creating a syndicate dominated by global growth investors and strategic software backers.
    The same announcement said Miro was already profitable, making the financing notable as acceleration
    capital rather than rescue capital. No retained source in this chapter shows a subsequent Series D,
    tender process, or IPO filing, so the 2022 valuation remains the last clear mark even as later scale
    signals imply a meaningfully larger business than in 2022. Sacra's 2024 estimate of $665 million ARR
    means the company may now be trading internally or in secondary narratives at a much lower revenue
    multiple than the 2022 peak if private-market sentiment has compressed. That combination—substantial
    scale, no new disclosed priced round, and limited public cap-table detail—is a material diligence
    feature, not noise.
  claimRefs:
