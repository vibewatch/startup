chapter:
  number: 1
  title: Company Overview
  summary: 'Miro is a large private collaboration software company that has grown from a 2011 remote-design
    tool called RealtimeBoard into one of the best-known visual-work platforms in enterprise software.
    The company remains founder-led by Andrey Khusid, is publicly associated with both Amsterdam and San
    Francisco, and monetizes through a freemium SaaS model that starts with a free plan and expands into
    paid team and enterprise tiers. The last clearly disclosed financing event was the January 2022 $400
    million Series C at a $17.5 billion post-money valuation, which official and media sources said was
    raised while the company was already profitable. Since then, public scale signals have continued to
    rise: Miro cited 30 million users at the Series C, Forbes said more than 90 million users in 2025,
    and Miro''s current enterprise surfaces say more than 100 million users and 250,000 organizations.
    That scale, plus 99% Fortune 100 penetration claims, makes Miro more than a pandemic whiteboard story;
    it looks like a broadly deployed enterprise workflow layer. The main diligence caveats are private-company
    opacity on current financials, a documented conflict over the identity of the second co-founder, and
    increasing risk from feature commoditization, bundled rivals, and security sensitivity as enterprise
    usage deepens.'
sections:
- id: section-identity-and-business-model
  title: Identity and business model
  body: 'Miro is a private visual collaboration software company best known for its infinite canvas and,
    more recently, its AI Innovation Workspace positioning. The product started as RealtimeBoard and today
    sits at the intersection of brainstorming, diagramming, product planning, and cross-functional execution.
    Official materials still describe the core experience as a free-to-start collaboration product: new
    users land on a Free plan by default, then expand into Starter, Business, and contact-sales Enterprise
    tiers as governance, security, and scale requirements increase. That packaging underpins a classic
    product-led growth motion. BusinessWire explicitly described Miro''s success as built on sound business
    fundamentals and product-led growth, while TechCrunch tied the 2020-2022 expansion to rapid user and
    paying-customer growth. The current enterprise pitch broadens the story beyond whiteboarding. Miro
    now frames itself as an Innovation Workspace with 100 million-plus users, 250,000 organizations, 250-plus
    integrations, enterprise security controls, and AI layers such as Flows and Sidekicks. The business
    model therefore combines freemium top-of-funnel acquisition with land-and-expand monetization across
    teams that start on lightweight collaboration and later buy workflow depth, governance, and enterprise
    support. Current pricing promises pre-built templates across plans, while 2022 reporting said the
    platform already had nearly 1,000 templates.'
