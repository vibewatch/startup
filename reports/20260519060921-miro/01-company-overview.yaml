- id: section-leadership-and-governance
  title: Leadership and governance
  body: Leadership is founder-centered. Andrey Khusid is consistently identified as co-founder and CEO
    across Miro's about materials, BusinessWire, and Forbes. Public sources also consistently place the
    company between Amsterdam and San Francisco, but they are less clean on the second co-founder. BusinessWire,
    TechCrunch, and Forbes name Oleg Shardin; Sacra instead names Nikolay Alexeyev. That discrepancy matters
    because this chapter is the baseline record later chapters inherit, and it signals that even basic
    corporate-history fields need reconciliation against internal docs. Governance disclosure is otherwise
    thin for a private company. The Series C press release quoted ICONIQ Growth general partner Matthew
    Jacobson specifically as a Miro board member, indicating formal investor-board representation by 2022,
    but public sources do not provide a full contemporary board roster. The observable governance model
    is therefore founder-led with institutional investor oversight rather than a richly disclosed public-company
    board structure. For diligence, key-person risk centers on Khusid because he is the clear public face
    of product strategy, company narrative, and enterprise expansion, while the company's 11-hub footprint
    suggests a distributed operating structure rather than a single-office startup.
  claimRefs:
  - CO004
