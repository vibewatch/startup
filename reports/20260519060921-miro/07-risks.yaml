  evidenceGaps:
  - type: missing-source
    severity: material
    topic: gdpr-dpa-audit-results
    missingEvidence: Current DPA text, subprocessor schedules, and audit artifacts linked from the requested DPA / trust surfaces.
    whyItMatters: Cross-border transfer and enterprise procurement risk are central to Miro's diligence story, but the requested DPA and trust URLs were not accessible on the run date.
    diligencePath: Request the current DPA package, subprocessor list, and enterprise privacy attachments directly from Miro.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: penetration-testing-and-incident-response
    missingEvidence: Recent penetration-test summary, incident history, remediation log, and current trust package.
    whyItMatters: Public pages describe controls, but investors cannot validate control effectiveness or security-operating maturity from those pages alone.
    diligencePath: Request the latest pen-test executive summary, incident-response procedures, and customer-facing trust documents under NDA.
    relatedQuestionRefs:
    - QR025
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: nrr-and-retention-data
    missingEvidence: Enterprise NRR, GRR, logo churn, seat expansion, and add-on attach rates by segment.
    whyItMatters: The biggest risk in the investment case is whether product breadth converts into durable monetization.
    diligencePath: Request cohort tables and plan-level expansion metrics from finance or customer-success leadership.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-profitability-bridge
    missingEvidence: Current audited financials, ARR bridge, gross-margin profile, and a reconciliation from the 2022 fundraising narrative to the present growth profile.
    whyItMatters: Public growth estimates diverge from the old financing narrative, and investors need audited data to know whether the valuation overhang is temporary or structural.
    diligencePath: Request audited statements and a finance-side bridge from ARR, revenue, and profitability history to current run-rate.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: ai-act-compliance-opinion
    missingEvidence: A written legal opinion explaining how Miro's AI workflows, knowledge integrations, and MCP-connected surfaces map to EU AI Act obligations.
    whyItMatters: The public materials emphasize AI breadth and governance but do not show how counsel classifies the resulting product surface under the Act.
    diligencePath: Obtain product-counsel analysis and buyer-facing compliance documentation before assuming AI can expand in regulated EU accounts without friction.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR001
