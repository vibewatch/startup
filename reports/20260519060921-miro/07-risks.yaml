- id: TR005
  title: Mitigation and Kill-Criteria Table
  columns:
  - Risk
  - Monitorable Trigger
  - Threshold / Event
  - Action Implication
  rows:
  - - Security breach or data-leak event
    - Public incident disclosure or regulator complaint
    - Material enterprise-content exposure or repeated identity-compromise pattern
    - Pause underwriting and request incident postmortem and remediation evidence
  - - AI compliance escalation
    - EU legal review or customer objection tied to Miro AI workflows
    - Counsel concludes current AI workflows need materially more controls before broad EU rollout
    - Re-cut adoption assumptions for AI-led upsell
  - - Growth and retention weakness
    - Private diligence on NRR / GRR / seat expansion
    - Enterprise NRR below 100% or meaningful churn in strategic accounts
    - Treat workflow breadth as defensive rather than expansionary
  - - Competitive bundle displacement
    - Named loss to Microsoft, Figma, or another suite rival
    - A reference account standardizes away from Miro because bundled tooling is good enough
    - Reduce terminal-multiple assumptions
  - - Valuation reset
    - New financing, tender, or secondary clears below $17.5B
    - Series D or significant secondary prices materially below the 2022 mark
    - Assume down-round dynamics and revisit return hurdles
  - - Diligence opacity persists
    - Requested audit, trust, retention, and financial artifacts remain unavailable
    - Management cannot provide current audit package, pen-test summary, NRR, or audited financials under NDA
    - Stop at Track/Research More and do not underwrite a conviction upside case
  notes: These kill criteria translate public risk observations into concrete diligence and monitoring actions.
