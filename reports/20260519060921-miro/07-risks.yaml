  - FR002
- id: mitigations-and-kill-criteria
  title: Mitigations and kill criteria
  body: 'Miro is not defenseless. The company can point to scale, integrations, enterprise controls, customer ROI proof, and rapid feature shipping as evidence that the platform still matters. The strongest mitigants are the installed base, the breadth of the workflow surface, the security package, and the fact that customers like ASOS report measurable productivity and consolidation benefits after standardizing on Miro. Still, those mitigants matter only if they remain visible in commercial outcomes. Investors should therefore focus on kill criteria rather than brand narratives: a material security event, evidence that AI features trigger new compliance friction, weak enterprise retention, a financing event below the 2022 price, or clear competitive displacement by bundled alternatives. The diligence path is equally clear: request current DPA and trust artifacts, penetration-test and incident summaries, retention metrics, audited financials, and a legal memo on AI Act exposure before underwriting
    any aggressive upside case.'
  claimRefs:
  - CR006
  - CR007
  - CR020
  - CR025
  - CR039
  - CR041
