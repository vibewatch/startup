- id: financial-model-execution-risks
  title: Financial model and execution risks
  body: The key investment risk is not that Miro lacks a product or a market. It is that a company marked at $17.5 billion in 2022 may now be operating in a lower-growth and more competitive environment while trying to expand from whiteboarding into an AI Innovation Workspace. Sacra's ARR estimate implies much slower growth than the fundraising narrative, and the public record still lacks NRR, GRR, audited financials, and a clean profitability bridge. At the same time, Miro is trying to sell Flows, Sidekicks, Portfolios, Insights, Prototypes, Specs, and MCP as one coherent system. That may prove defensible, but it also creates execution risk in packaging, onboarding, and enterprise GTM. The ASOS case study proves that standardization can create real ROI, yet investors still need evidence that the newer workflow layers are monetizing broadly enough to justify a premium multiple rather than merely supporting retention.
  claimRefs:
  - CR016
  - CR018
  - CR020
  - CR021
  - CR025
  - CR026
  - CR027
  - CR028
  - CR030
  - CR031
