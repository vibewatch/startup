callouts:
- calloutType: strength
  title: Enterprise controls are real, not purely cosmetic
  body: Miro publicly advertises SSO, SCIM, SIEM integrations, data residency, Enterprise Guard controls, and ISO / SOC-style compliance claims across its pricing, enterprise, and AI pages.
  claimRefs:
  - CR006
  - CR007
  - CR043
- calloutType: risk
  title: EU AI Act scope risk rises as Miro moves from whiteboarding into agents and workflows
  body: The more Miro turns the canvas into a prompt for Sidekicks, Flows, MCP-connected coding, and enterprise knowledge retrieval, the more its AI surface starts to matter for legal review.
  claimRefs:
  - CR008
  - CR009
  - CR039
- calloutType: recommendation
  title: Request the DPA, trust package, pen-test summary, and current retention data before underwriting upside
  body: 'The fastest way to de-risk Miro is to replace missing public trust artifacts with current private diligence: DPA schedules, a trust-center package, pen-test and incident summaries, NRR / GRR cohorts, and audited financials.'
  claimRefs:
  - CR020
  - CR041
- calloutType: insight
  title: Russian-origin history is mostly a perception issue now, but it still matters in procurement
  body: For many buyers the Perm origin story is a historical footnote. For security-sensitive accounts, it can still trigger extra vendor-screening questions around legal entities, hosting footprints, and governance.
  claimRefs:
  - CR042
