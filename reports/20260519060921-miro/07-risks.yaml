company:
  name: Miro
chapter:
  number: 7
  title: Risk Register
  summary: Miro's highest-priority risks are about whether the company can defend pricing and valuation while expanding its AI and workflow surface under tighter privacy and AI-governance expectations. Public sources show real enterprise controls, large-scale adoption, and rapid product shipping, but also reveal bundle pressure, slower externally estimated growth, missing trust artifacts, and unresolved diligence on retention, audits, and AI Act exposure.
sections:
- id: regulatory-legal-privacy-risks
  title: Regulatory, legal, and privacy risks
  body: Miro's legal-risk stack is shaped by the fact that the product stores strategic collaboration data and increasingly embeds AI rather than pointing to separate tools. The privacy policy says cross-border transfers rely on the Data Privacy Framework and Standard Contractual Clauses, and the FTC makes clear that privacy promises and DPF commitments are enforceable. That is a meaningful mitigation, but the requested DPA and Trust Center pages were not accessible on the report date, leaving a public-proof gap around current audits and supporting artifacts. The terms also place real responsibility on the customer for user behavior, credential hygiene, and board-sharing choices, which can complicate liability allocation after an incident. On the AI side, the EU AI Act is already live for GPAI obligations and will fully switch on transparency requirements in August 2026. Miro advertises ISO 42001 and AI governance controls, but investors still need a legal view on whether the current workflow,
    knowledge, and MCP features create extra compliance obligations in regulated accounts.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR006
  - CR038
  - CR039
  - CR041
  - CR049
  - CR050
  tableRefs:
  - TR001
  figureRefs: []
- id: operational-security-technical-risks
  title: Operational, security, and technical risks
  body: Operational risk at Miro is less about factories and more about the reliability and safety of a complex workspace used for diagrams, workshops, research synthesis, prototypes, and AI workflows. Microsoft flags Miro as a store of critical organizational data and highlights compromised accounts, insider misuse, data leakage, and unmanaged devices as the main threat classes around the app. Miro has responded with SSO, SCIM, data residency, audit logs, SIEM integrations, and Enterprise Guard controls, so this is not a thin security posture. Even so, the G2 evidence says large boards can lag, which matters because the highest-value use cases involve dense, persistent canvases and many collaborators. The public evidence also does not include penetration-test findings, incident metrics, or current trust-package detail from the requested URLs. That means the control surface looks credible, but the control effectiveness still depends on private diligence.
  claimRefs:
  - CR006
  - CR007
  - CR012
  - CR013
  - CR014
  - CR041
  - CR043
  - CR044
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: partner-dependency-competitive-risks
  title: Partner, dependency, and competitive risks
  body: Miro's platform breadth is also a dependency story. The AI roadmap leans on hyperscalers and model vendors, the workflow story leans on Jira, Azure DevOps, GitHub Copilot, Microsoft Copilot, and other connected tools, and the monetization story leans on customers continuing to prefer a standalone collaboration hub over bundled functionality. AWS says Miro can stand up generative AI services quickly and the AI launch says the platform supports multiple model vendors plus BYOK, which creates flexibility but also ties the roadmap to partner economics and partner policy. Competitive pressure is real. FigJam is included with all Figma seats. Microsoft Whiteboard rides inside Microsoft 365. Mural and Conceptboard keep low-friction entry points. Miro can still win because it is broader than a whiteboard, but the bundle pressure directly matters for pricing power and for the return case behind any new investment.
  claimRefs:
  - CR010
  - CR011
  - CR022
  - CR029
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  - CR047
  - CR048
