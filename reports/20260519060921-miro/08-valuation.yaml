  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Current audited revenue, ARR bridge, profitability, and cash-flow statements.
    whyItMatters: The entire recommendation depends on whether the current business has grown into or away from the 2022 round price.
    diligencePath: Request audited statements and a management bridge from revenue to ARR and profitability under NDA.
    relatedQuestionRefs:
    - QV022
  - type: private-evidence-only
    severity: material
    topic: nrr-grr-cohorts
    missingEvidence: Net and gross retention cohorts, seat expansion, add-on attach, and logo churn by customer segment.
    whyItMatters: A large installed base matters only if it expands and renews; otherwise the platform story does not support a premium multiple.
    diligencePath: Request NRR / GRR cohort tables and plan-level customer expansion data.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: cap-table-preference-stack
    missingEvidence: Liquidation waterfall, preference terms, anti-dilution clauses, and employee/common dilution detail.
    whyItMatters: Downside return math and any financing-reset analysis are incomplete without the preference stack.
    diligencePath: Legal review of charter, investor-rights documents, and latest financing papers.
    relatedQuestionRefs:
    - QV024
  - type: private-evidence-only
    severity: material
    topic: ai-monetization-metrics
    missingEvidence: Revenue, attach rate, and usage-to-paid conversion for AI Workflows, Insights, Prototypes, Portfolios, and MCP-driven workflow products.
    whyItMatters: The upside case requires AI-led reacceleration rather than just preserving an installed base.
    diligencePath: Request product finance breakdown by module, attach rates, and expansion contribution to ARR.
    relatedQuestionRefs:
    - QV028
  - type: missing-source
    severity: material
    topic: private-comparable-arr-data
    missingEvidence: Reliable current ARR or revenue data for private comparable companies such as Notion, Mural, and Lucid, plus cleaner public-company comp extractions from the requested pages.
    whyItMatters: TV004 is useful directionally, but several rows cannot be turned into precise multiple comparisons from the current source pack.
    diligencePath: Refresh comparable work with live analyst databases, usable filing pages, and direct company disclosures where available.
    relatedQuestionRefs:
    - QV025
    - QV026
    relatedTableRefs:
    - TV004
