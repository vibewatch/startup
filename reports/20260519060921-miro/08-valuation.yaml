- id: TV005
  title: Thesis-Break and Kill Triggers
  columns:
  - Trigger
  - Threshold
  - Transmission to Thesis
  - Action Implication
  rows:
  - - Visible financing below the 2022 $17.5B mark
    - Series D, tender, or large secondary prices materially under the old round
    - Turns the old valuation from anchor to overhang and compresses upside expectations
    - Move from Track toward Avoid unless disclosure quality improves at the same time
  - - Growth stays around mid-single digits despite AI launches
    - No visible reacceleration in ARR or enterprise expansion after 2026 product breadth rollout
    - Undermines the platform-premium story and points to mature-collaboration economics
    - Lower exit-multiple assumptions and require stronger entry discipline
  - - Enterprise retention or expansion is weak
    - NRR below 100% or meaningful strategic-logo churn in private diligence
    - Installed-base moat does not monetize into durable revenue quality
    - Do not underwrite buy-side upside until retention improves
  - - Bundle competition wins strategic accounts
    - Named displacement by Figma / Microsoft / other suite tools in reference accounts
    - Shows Miro is a feature that can be absorbed, not a platform that must be bought
    - Cut premium-multiple assumptions immediately
  - - Audit, cap-table, and AI-monetization proof remain unavailable
    - Management cannot provide audited financials, preference stack, or AI revenue evidence under NDA
    - Evidence risk overwhelms the company-quality debate
    - Keep the posture at Track or move to Research More instead of paying peak-like prices
  notes: Each trigger is observable and directly tied to price, evidence quality, or competitive positioning.
  claimRefs:
  - CV014
