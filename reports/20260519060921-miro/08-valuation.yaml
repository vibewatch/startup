company:
  name: Miro
chapter:
  number: 8
  title: Valuation & Investment Recommendation
  summary: Miro remains strategically important because it combines a large collaboration footprint with an increasingly broad AI and workflow platform story, but the public evidence still does not justify paying up against the 2022 $17.5B mark. External estimates point to slower growth than the Series C narrative implied, comparable work is weakened by blocked or stale private-company sources, and the most important diligence items — audited financials, retention cohorts, cap-table terms, and AI monetization — remain private. The right posture is Track.
sections:
- id: valuation-context-financing-history
  title: Valuation context and financing history
  body: 'Miro''s public valuation context is dominated by one number: the $17.5B post-money mark set in January 2022. BusinessWire and TechCrunch confirm that the Series C raised $400M and brought total capital raised to roughly $476M. That financing happened when the company had about 30M users, hypergrowth momentum, and strong remote-work tailwinds. The newer public picture is different. Forbes says Miro had more than 90M users and 250,000 organizations by September 2025, while the company''s own pages now say more than 100M users and 250,000 companies. Scale is not the problem. The issue is what that scale converts into financially. Sacra estimates about $665M ARR in 2024 with only mid-single-digit growth from the prior year. If that estimate is directionally right, the old round price still embeds a demanding multiple and creates a valuation overhang rather than a clean current reference point.'
  claimRefs:
  - CV001
  - CV002
  - CV005
  - CV006
  - CV014
  - CV015
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV004
- id: investment-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: The thesis for Miro is that it already owns a massive collaboration footprint and is trying to convert that footprint into a higher-value workflow system. The company has real enterprise evidence, strong security packaging, published AI governance claims, and a broad 2026 roadmap that reaches from Flows and Sidekicks to Portfolios, Specs, MCP, and Microsoft Copilot integrations. The ASOS case study shows that when Miro becomes a system of work rather than a brainstorming accessory, customers can save time, cut tool sprawl, and improve planning quality. The anti-thesis is that the installed base may be easier to admire than to monetize at premium multiples. Growth looks slower in public estimates, bundled substitutes are everywhere, some of the best comparable sources were blocked on the run date, and investors still lack audited financials, retention metrics, and cap-table detail. Miro may still be a good company; the question is whether the current evidence supports buying the old
    price.
  claimRefs:
  - CV009
  - CV010
  - CV021
  - CV024
  - CV038
  - CV039
  - CV045
  tableRefs:
  - TV003
  figureRefs:
