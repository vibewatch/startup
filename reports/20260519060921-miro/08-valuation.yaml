- id: TV002
  title: Thesis / Anti-thesis
  columns:
  - Argument
  - Supporting Evidence
  - What Would Change the View
  rows:
  - - 'Thesis: Miro has an unusually large collaboration footprint and brand'
    - 100M+ user claim, 250k companies, enterprise references, and category leadership
    - Independent retention, seat-expansion, and monetization data would convert scale from story to proof
  - - 'Thesis: The platform is expanding beyond whiteboarding into AI and workflow orchestration'
    - Flows, Sidekicks, MCP, Prototypes, Portfolios, Insights, Technical Design, and Copilot integrations shipped or launched in 2026
    - Attach-rate and revenue-by-module data would show whether breadth is monetizing rather than just shipping
  - - 'Thesis: Enterprise controls can support premium ARPU'
    - Enterprise Guard, SSO, SCIM, SIEM hooks, data residency, and “do not train on enterprise customer data” positioning
    - Proof of enterprise upsell, renewal, and compliance win rates would strengthen the premium-ARPU case
  - - 'Anti-thesis: Growth appears far slower than the old round price implies'
    - Sacra's ARR and growth estimate plus the 41.7x implied 2022 revenue multiple
    - Audited financials showing materially faster current growth or much higher ARR would soften this objection
  - - 'Anti-thesis: Bundle competition and weak comparable transparency reduce conviction'
    - FigJam included on every Figma seat, Whiteboard in Microsoft 365, and multiple blocked or stale private-comp sources
    - A new financing or secondary that validates price plus better private-comp revenue disclosure would improve confidence
  notes: The thesis and anti-thesis are both evidence-backed.
