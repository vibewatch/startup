  - CV039
  - CV040
- id: TV006
  title: Final Diligence Asks
  columns:
  - Topic
  - Missing Evidence
  - Why It Matters
  - Owner / Diligence Path
  rows:
  - - Audited financials
    - Current audited revenue, ARR bridge, and profitability metrics are not public
    - They determine whether the old round price is remotely defendable
    - CFO data room request and audit-package review
  - - NRR / GRR cohort data
    - No public retention or expansion cohorts
    - Installed-base quality is the central unanswered valuation question
    - Finance / customer-success cohort tables under NDA
  - - Cap table and preference stack
    - No public liquidation waterfall or preference detail
    - Downside return math cannot be trusted without it
    - Legal review of charter, investor-rights docs, and latest term sheet
  - - AI monetization metrics
    - No module-level revenue, attach-rate, or conversion data for AI Workflows, Insights, or MCP-driven products
    - The bull case depends on AI-led reacceleration rather than seat growth alone
    - Product / finance package with attach and revenue by module
  - - Private comparable ARR data
    - Requested private-comp pages were blocked or stale
    - TV004 remains directional without usable revenue detail
    - Supplement with fresh analyst-database work
  - - Current financing mark
    - No tender, secondary, or new round price is publicly confirmed after 2022
    - Price discovery matters more than brand strength at this stage
    - Ask management and major investors for latest transaction or indicative pricing
  - - Security and trust package
    - Requested trust-center and DPA surfaces were unavailable on the run date
    - Enterprise premium and regulated-account upside depend on this being real and current
    - Request trust package, pen-test summary, and compliance bridge directly from Miro
  notes: These asks are the minimum package needed to move the recommendation.
