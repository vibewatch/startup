callouts:
- calloutType: strength
  title: PLG moat remains real at 90M+ to 100M+ user scale
  body: Even allowing for inconsistent public counters across pages, Miro clearly operates at a scale few collaboration startups ever reach. That installed base gives the company multiple ways to monetize more workflow surface over time.
  claimRefs:
  - CV005
  - CV006
- calloutType: risk
  title: Valuation overhang is hard to ignore at roughly 26x ARR on mid-single-digit growth
  body: If the public ARR and growth estimates are directionally right, Miro is still carrying a pandemic-era price anchor that looks rich for its current maturity and competition set.
  claimRefs:
  - CV014
  - CV015
  - CV038
- calloutType: recommendation
  title: Track the company; do not chase the old price without AI-led reacceleration and better disclosure
  body: The right move is to keep Miro on the radar and revisit quickly if management can show audited ARR, healthy NRR, visible monetization of AI workflows, and a financing-clearing price that still validates the platform story.
  claimRefs:
  - CV031
  - CV039
  - CV044
- calloutType: insight
  title: A future round below $17.5B would turn the 2022 halo into a visible down-round signal
  body: Because the last disclosed round was so large and so visible, any financing below that mark would reshape external perception immediately.
  claimRefs:
  - CV001
  - CV040
