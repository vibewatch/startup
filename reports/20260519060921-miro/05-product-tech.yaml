schemaVersion: "report-v2"
artifact: product-tech
slug: miro
runDate: "2026-05-19"
company:
  name: Miro
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Miro has evolved from an online whiteboard into a broad visual collaboration and AI-enabled
    work platform spanning the core canvas, enterprise governance, developer tooling, and newer
    product-acceleration workflows. The core canvas and ecosystem look mature and well adopted,
    while the fastest-moving AI surfaces are credible, recently shipped, and strategically important
    but still require deeper diligence on adoption depth, performance, and reliability at enterprise
    scale.
sections:
  - id: product-definition
    title: Product definition
    body: >-
      Miro's product is no longer best understood as a standalone digital whiteboard. The current
      workflow proposition starts with an infinite canvas used for brainstorming, diagramming,
      planning, async review, and meeting facilitation, then layers on structured objects such as
      tables, timelines, kanban, and templates so teams can turn workshop artifacts into operating
      plans. The 2025-2026 product narrative shifts further toward an AI Innovation Workspace: Flows
      turns canvas context into multi-step AI workflows, Sidekicks adds persistent AI collaborators,
      and newer modules such as Specs, Technical Design, Roadmaps, Prototypes, and Insights try to
      move Miro upstream into product-development execution. In customer workflow terms, Miro is
      positioning itself as a system that captures messy collaboration inputs, structures them, and
      exports them into engineering, project, and governance systems. That definition matters because
      Miro's differentiation depends less on whiteboard novelty and more on whether enterprises keep
      the board as the context layer where planning, AI assistance, and execution coordination begin.
    claimRefs: [CE003, CE005, CE008, CE010, CE011, CE029, CE031, CE032]
    tableRefs: [TE002]
    figureRefs: [FE002]
  - id: product-module-map
    title: Product module map
    body: >-
      The product surface now breaks into several coherent module groups. First is the mature core
      workspace: canvas collaboration, sticky notes, diagramming, templates, and meeting artifacts.
      Second is enterprise control: admin, governance, security, privacy, and Enterprise Guard.
      Third is extensibility: the REST API, Web SDK, Live Embed, integrations, and the newer MCP
      server path into coding tools. Fourth is the product-acceleration bundle aimed at product and
      engineering organizations through Roadmaps, Specs, Technical Design, Portfolios, Prototypes,
      and Insights. Fifth is engagement and community, including Miroverse, Academy, and large-group
      facilitation through Engage. The practical diligence question is not whether these assets
      exist—they do—but how consistently they are sold, packaged, and adopted together. Core canvas
      collaboration appears highly mature; newer AI workflow products and some add-on surfaces look
      strategically promising but are still early enough that buyers should ask for module-level
      adoption, attach rates, and proof of repeat usage by segment.
    claimRefs: [CE005, CE006, CE010, CE013, CE015, CE023, CE029, CE033, CE034, CE036]
    tableRefs: [TE001]
    figureRefs: []
  - id: architecture-and-operating-model
    title: Architecture and operating model
    body: >-
      Public technical evidence points to a cloud-native, partner-dependent operating model rather
      than an unusually proprietary infrastructure stack. Miro's developer surface spans APIs, SDKs,
      Live Embed, and a GitHub-hosted AI repository, while its AI workflow claims rely on board
      context, integrations, and external model providers. AWS is important on the infrastructure
      side: Miro describes production generative-AI services built quickly on AWS and identifies EKS,
      autoscaling, IAM, and encryption controls in the surrounding architecture narrative. On the
      application side, integrations with Jira, Azure DevOps, Confluence, Notion, Slack, Teams, and
      other work systems are core to making the board operational rather than ornamental. The key
      technical takeaway is that Miro's architecture appears robust for extensibility and enterprise
      deployment, but it is also meaningfully dependent on third-party clouds, model vendors, and
      collaboration ecosystems. Investors and enterprise buyers should therefore diligence platform
      resilience, model-governance defaults, integration reliability, and any throughput limits for
      large boards, AI workflows, and embedded deployments.
    claimRefs: [CE008, CE014, CE015, CE016, CE017, CE018, CE019, CE024]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: developer-platform-and-ecosystem
    title: Developer platform and ecosystem
    body: >-
      Miro has more real developer surface than many collaboration products, and that matters for
      both adoption durability and distribution. The public developer portal documents the REST API,
      Web SDK, and Live Embed, while the MCP documentation and miro-ai GitHub repository extend the
      platform into agentic coding and AI workflow tools. This is strategically useful because it
      makes Miro not just a destination app but a context layer other tools can read from and write
      to. Developer-signal evidence is unusually concrete for a productivity company: the platform won
      multiple DevPortal awards, maintains public docs, runs a public GitHub surface for AI-related
      tooling, and ties integrations to concrete workflows. At the same time, the ecosystem is also a
      dependency map: value creation depends on continued interoperability with GitHub, Anthropic,
      OpenAI, Microsoft, Atlassian, and other surrounding systems. If those partners narrow access,
      copy comparable workflow features, or privilege their own canvases, Miro's extensibility can
      become a competitive vulnerability rather than a moat.
    claimRefs: [CE008, CE014, CE015, CE016, CE024, CE035, CE037]
    tableRefs: []
    figureRefs: [FE003]
  - id: trust-security-compliance
    title: Trust, security, and compliance
    body: >-
      Miro's trust posture is strong enough to support serious enterprise evaluation, but the public
      record is still heavier on control statements than on independently inspectable operating
      metrics. Official materials describe encryption in transit and at rest, enterprise governance,
      privacy commitments, and a notable certification set that includes ISO 27001, SOC 2 Type II,
      ISO 42001, TISAX, and GDPR-oriented controls. Enterprise Guard expands this posture into
      content classification, sensitive-content detection, lifecycle management, and eDiscovery, and
      Microsoft documents a Defender for Cloud Apps integration for Enterprise customers. Miro also
      makes an important AI-governance claim: enterprise customer data on Enterprise plans is not used
      to train models. Those are meaningful positives. The main diligence gaps are elsewhere: public
      uptime SLA evidence is thin, incident-history transparency is limited in the retained source
      set, and buyers still need product-level detail on model routing, logging, tenant isolation,
      and how governance differs across plans and AI-enabled modules.
    claimRefs: [CE020, CE021, CE022, CE023, CE024, CE044]
    tableRefs: [TE004]
    figureRefs: []
  - id: roadmap-and-releases
    title: Roadmap and releases
    body: >-
      The release cadence around Miro's AI and product-development surfaces is active and recent.
      March 2026 updates included screenshot-to-prototype generation, AI search for boards, Sidekick
      conversation history, reMarkable integration, and a refreshed Presentation Mode. April 2026
      extended the roadmap with PDF-as-Flows input, markdown drag-and-drop, Jira issue import into
      Tables, Microsoft Copilot integration, and new Ranking plus Scales activities for Engage. These
      releases suggest the company is pushing toward a multi-surface operating system for product,
      workshop, and AI-assisted planning work, not merely maintaining a mature collaboration core.
      That is directionally positive because it creates more land-and-expand opportunities inside the
      same customer base. The caution is maturity asymmetry: core board collaboration is battle
      tested, whereas newer AI modules, add-ons, and plan-gated features are still in a proof phase
      where decision-makers should request rollout data, attach rates, and examples of sustained
      usage after initial launch excitement.
    claimRefs: [CE026, CE027, CE028, CE029, CE031, CE036]
    tableRefs: [TE005]
    figureRefs: [FE004]
