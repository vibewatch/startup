callouts:
  - calloutType: strength
    title: "Board-native AI is the strategic wedge"
    body: "Miro's strongest strategic move is keeping the board as the context object for AI workflows, delivery artifacts, and coding-tool handoff rather than treating AI as a disconnected chat layer."
    claimRefs: [CE010, CE011, CE013, CE014, CE029]
  - calloutType: risk
    title: "Newest AI surfaces still need operating proof"
    body: "The 2025-2026 roadmap is active and credible, but public evidence remains stronger on feature shipment than on enterprise-scale adoption, reliability, and repeat usage for Flows, Sidekicks, Specs, and Prototypes."
    claimRefs: [CE027, CE028, CE031, CE036, CE044]
  - calloutType: recommendation
    title: "Ask for module-level adoption and SLA evidence"
    body: "Diligence should request module attach rates, active usage by feature, large-board performance data, uptime terms, and tenant-level AI governance documentation before underwriting the full platform thesis."
    claimRefs: [CE021, CE025, CE036, CE044]
