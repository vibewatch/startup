chapter:
  number: 2
  title: Market Analysis
  summary: Miro operates inside a market that is narrow enough to size and broad enough to expand. The narrow serviceable lens is collaborative whiteboard software, which Mordor sizes at $3.17B in 2025 and $3.81B in 2026, growing to $9.59B by 2031 at a 20.28% CAGR. The broader adjacency lens is enterprise collaboration and visual productivity software, where Sacra points to a $16.7B competitive frame and a $45B enterprise-collaboration opportunity. That split matters because Miro is still bought most often as a whiteboard or visual-collaboration tool, yet it increasingly sells an AI-enabled workspace that touches planning, facilitation, and workflow orchestration budgets. Buyer mix also matters. Large enterprises already account for 58.05% of category revenue, while SMEs grow faster; education is the largest vertical today, but healthcare and Asia-Pacific are growing more quickly. For Miro specifically, Sacra's $665M ARR estimate implies roughly 21% share of the narrow whiteboard SAM, which
    is strong but not unassailable. Growth remains supported by persistent hybrid work, cloud-native toolchains, and AI facilitation, but constrained by privacy requirements, bundled substitutes from Microsoft and Figma, and the risk that whiteboarding features become commoditized faster than Miro can move up-market.
sections:
- id: section-market-definition-and-scope
  title: Market definition and scope
  body: >-
    The cleanest market definition for Miro is collaborative whiteboard software: cloud-delivered, multi-user canvas products used for brainstorming, diagramming, planning, workshops, and asynchronous visual collaboration. That is the category Mordor sizes directly, and it is the category in which core feature parity matters most: infinite canvas, facilitation controls, templates, integrations, and increasingly AI summarization or clustering. The category also sits inside a wider enterprise-collaboration budget pool. Sacra frames Miro against a broader collaboration opportunity of roughly $16.7B in Q3 2023 and points to a $45B enterprise-collaboration software market by 2025. Those wider lenses matter because buyers often compare Miro not only with dedicated whiteboards, but also with adjacent tools that absorb the same workflow budget, including Microsoft, Figma, Notion, or work-management suites with embedded canvas features.


    For diligence, the key inclusion and exclusion rules are important. Included spend should cover visual-collaboration subscriptions, governance add-ons, facilitation tooling, and workflow-embedded whiteboard products. Excluded spend should generally include generic chat, standalone video conferencing, and broad office-suite spend unless the whiteboard capability is a specific buying criterion. Miro itself is trying to stretch upward from the narrow category into an AI-enabled innovation workspace, but buyers still evaluate the product through whiteboard jobs to be done: remote brainstorming, agile ceremonies, planning, synthesis, and cross-functional alignment. That means the narrow SAM is the best lens for competitive position, while the broader TAM is the better lens for expansion upside.
  claimRefs:
  - CM001
  - CM002
  - CM005
  - CM006
