- id: section-buyer-segmentation
  title: Buyer segmentation
  body: >-
    Buyer and user segmentation explains why Miro has been able to scale from team-led adoption into enterprise procurement. Large enterprises already account for 58.05% of market revenue, which signals that whiteboard software is not confined to small creative teams; it has become a governed collaboration layer purchased by large organizations. At the same time, SMEs are the faster-growing cohort, helped by freemium onboarding and card-based self-serve expansion. That split matches Miro's product-led model. Teams can start with a lightweight collaboration need, then move toward governance, integrations, and add-ons as usage spreads.


    Vertical and geographic mixes also shape buying motion. Education is the largest vertical today, reflecting broad adoption for interactive teaching and remote learning, while healthcare is the faster-growing vertical as visual coordination gets pulled into more regulated workflows. North America is the current revenue center, but Asia-Pacific is the faster-growing region, which matters for pricing localization, mobile performance, and channel strategy. Buyer personas typically start with product managers, designers, facilitators, or transformation leaders; budget ownership often migrates later toward IT, operations, or collaboration-platform owners once security and governance matter. Miro's enterprise page claims more than 100M users, 250,000 companies, and 99% of the Fortune 100, suggesting the company is already deeply embedded in the enterprise buyer universe. The open diligence question is not whether Miro has reached large buyers, but how much of its revenue mix comes from the
    most defensible segments versus more price-sensitive or bundle-exposed teams.
  claimRefs:
