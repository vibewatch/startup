      - number: '8.3'
        title: Scenario analysis
        blocks:
          - type: paragraph
            body: >-
              The scenario range for Miro is driven less by market existence than by monetization quality and multiple
              compression. In a bull case, the installed base upgrades into an AI-led workflow platform with attach
              rates for enterprise governance, AI Workflows, product-acceleration modules, and MCP-enabled engineering
              use cases. In a base case, Miro remains the leader in visual collaboration and monetizes some of the new
              workflow surfaces, but growth stays below the level required to sustain the old round price. In a bear
              case, buyers choose good-enough bundle options, performance complaints remain meaningful on large boards,
              and financing or secondary transactions clear below the last headline mark. The important insight is that
              even if Miro keeps growing, the return profile can still disappoint if the exit multiple resets to
              something closer to mature workflow software norms rather than a pandemic-era collaboration premium.
            claimRefs:
