chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Miro is a private visual collaboration software company best known for its infinite canvas and, more
              recently, its AI Innovation Workspace positioning. The product started as RealtimeBoard and today sits at
              the intersection of brainstorming, diagramming, product planning, and cross-functional execution. Official
              materials still describe the core experience as a free-to-start collaboration product: new users land on a
              Free plan by default, then expand into Starter, Business, and contact-sales Enterprise tiers as
              governance, security, and scale requirements increase. That packaging underpins a classic product-led
              growth motion. BusinessWire explicitly described Miro's success as built on sound business fundamentals
              and product-led growth, while TechCrunch tied the 2020-2022 expansion to rapid user and paying-customer
              growth. The current enterprise pitch broadens the story beyond whiteboarding. Miro now frames itself as an
              Innovation Workspace with 100 million-plus users, 250,000 organizations, 250-plus integrations, enterprise
              security controls, and AI layers such as Flows and Sidekicks. The business model therefore combines
              freemium top-of-funnel acquisition with land-and-expand monetization across teams that start on
              lightweight collaboration and later buy workflow depth, governance, and enterprise support. Current
              pricing promises pre-built templates across plans, while 2022 reporting said the platform already had
              nearly 1,000 templates.
