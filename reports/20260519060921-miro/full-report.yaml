  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and scope
        blocks:
          - type: paragraph
            body: >-
              The cleanest market definition for Miro is collaborative whiteboard software: cloud-delivered, multi-user
              canvas products used for brainstorming, diagramming, planning, workshops, and asynchronous visual
              collaboration. That is the category Mordor sizes directly, and it is the category in which core feature
              parity matters most: infinite canvas, facilitation controls, templates, integrations, and increasingly AI
              summarization or clustering. The category also sits inside a wider enterprise-collaboration budget pool.
              Sacra frames Miro against a broader collaboration opportunity of roughly $16.7B in Q3 2023 and points to a
              $45B enterprise-collaboration software market by 2025. Those wider lenses matter because buyers often
              compare Miro not only with dedicated whiteboards, but also with adjacent tools that absorb the same
              workflow budget, including Microsoft, Figma, Notion, or work-management suites with embedded canvas
              features.


              For diligence, the key inclusion and exclusion rules are important. Included spend should cover
              visual-collaboration subscriptions, governance add-ons, facilitation tooling, and workflow-embedded
              whiteboard products. Excluded spend should generally include generic chat, standalone video conferencing,
              and broad office-suite spend unless the whiteboard capability is a specific buying criterion. Miro itself
              is trying to stretch upward from the narrow category into an AI-enabled innovation workspace, but buyers
              still evaluate the product through whiteboard jobs to be done: remote brainstorming, agile ceremonies,
              planning, synthesis, and cross-functional alignment. That means the narrow SAM is the best lens for
              competitive position, while the broader TAM is the better lens for expansion upside.
