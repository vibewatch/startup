            body: >-
              Named customer proof exists, but its quality varies sharply across the evidence set. The best public proof
              comes from case studies with concrete operating outcomes. ASOS reported 60-plus agile teams on Miro, 71%
              more effective meetings, about 50% less time on product planning, 3.75 hours saved per user each week, and
              a 75% cut in diagramming-license costs. Endava publicly tied Miro to a 40% cycle-time reduction in parts
              of its AI-native delivery motion. PA Consulting and Collective Next provide more workflow-rich than
              metric-rich evidence: both show Miro embedded in live client or facilitation work, but without the same
              denominator quality as ASOS. Official customer pages and the 2022 BusinessWire roster add recognizable
              names such as Nike, IKEA, WPP, Cisco, Dell, HP, Kaiser Permanente, Liberty Mutual, and Okta, yet those
              logo references do not prove present-day deployment depth or retention. Overall, Miro's named proof is
              credible and real, but still more concentrated in company-authored success narratives than in
              independently verified deployment or renewal data.
