  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition
        blocks:
          - type: paragraph
            body: >-
              Miro's product is no longer best understood as a standalone digital whiteboard. The current workflow
              proposition starts with an infinite canvas used for brainstorming, diagramming, planning, async review,
              and meeting facilitation, then layers on structured objects such as tables, timelines, kanban, and
              templates so teams can turn workshop artifacts into operating plans. The 2025-2026 product narrative
              shifts further toward an AI Innovation Workspace: Flows turns canvas context into multi-step AI workflows,
              Sidekicks adds persistent AI collaborators, and newer modules such as Specs, Technical Design, Roadmaps,
              Prototypes, and Insights try to move Miro upstream into product-development execution. In customer
              workflow terms, Miro is positioning itself as a system that captures messy collaboration inputs,
              structures them, and exports them into engineering, project, and governance systems. That definition
              matters because Miro's differentiation depends less on whiteboard novelty and more on whether enterprises
              keep the board as the context layer where planning, AI assistance, and execution coordination begin.
