      - number: '2.4'
        title: Growth drivers, constraints, and competitive dynamics
        blocks:
          - type: paragraph
            body: >-
              The category still has multiple structural tailwinds. Mordor attributes positive growth impact to
              persistent hybrid work, cloud-native SaaS expansion, tighter integration with communications and project
              systems, and AI-assisted facilitation. Those drivers all favor Miro's product direction. The company is
              not merely selling a canvas; it is trying to sell a workflow layer with AI Flows, Sidekicks, governance
              packaging, and partner-integrated infrastructure. Customer examples from ASOS and PA Consulting reinforce
              the point that buyers increasingly want measurable workflow throughput, not just a place to place sticky
              notes.


              The constraints are equally clear. Privacy and compliance requirements lengthen sales cycles, especially
              where GDPR, HIPAA, or public-sector controls matter. Microsoft Defender explicitly classifies Miro as a
              system holding critical organizational data and therefore a target for malicious actors, which raises the
              security bar as adoption deepens. Competitive pressure also works from both directions. Bundled
              substitutes such as Microsoft Whiteboard and FigJam attack the low end by driving the marginal price of
              basic whiteboarding toward zero. At the same time, specialized competitors such as MURAL and Conceptboard
              compete on facilitation depth or sovereignty-sensitive deployments. Sacra's two biggest strategic
              warnings—commoditization and remote-work reversion—therefore remain relevant. Miro's best defense is to
              keep moving the buying conversation away from simple whiteboarding and toward secure, AI-enabled,
              workflow-embedded collaboration that is harder to bundle away.
