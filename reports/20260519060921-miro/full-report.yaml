      - number: '1.5'
        title: Milestones and trajectory
        blocks:
          - type: paragraph
            body: >-
              Miro's trajectory breaks into four phases. First came origin: RealtimeBoard was founded in 2011 in Perm,
              Russia as a way for Khusid's design agency to communicate visually with remote clients. Second came
              category formation: the company rebranded to Miro in 2019 and then rode the 2020-2022
              remote-and-hybrid-work wave from roughly 5 million to 30 million users, raising a $50 million Series B in
              April 2020 and then the $400 million Series C in January 2022. Third came scale normalization: by 2024,
              Sacra estimated $665 million ARR, while risk analysis shifted from pure growth to commoditization and
              remote-work reversion. Fourth is the AI-workflow phase. Canvas 25 introduced the AI Innovation Workspace,
              Flows, and Sidekicks; March and April 2026 releases added screenshot-to-prototype workflows, AI search,
              PDF and markdown inputs, and Canvas 26 events across four cities. The through-line is clear: Miro is
              attempting to evolve from digital whiteboard vendor into the shared context layer where product, design,
              and AI-assisted execution begin. The open question is whether that trajectory compounds differentiation
              faster than bundled rivals and market normalization compress it.
