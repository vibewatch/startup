      - number: '6.4'
        title: Retention and satisfaction
        blocks:
          - type: paragraph
            body: >-
              The public record on retention is the clearest weakness in customer diligence. Miro does not publicly
              disclose net revenue retention, gross retention, churn, or renewal rates in the retained source set, so
              any durability conclusion must be indirect. That indirect evidence is still useful. Review surfaces such
              as G2, Capterra, TrustRadius, and GetApp show that Miro has a broad installed base willing to leave public
              feedback. Official case studies also imply repeat usage in product planning, facilitation, and consulting
              workflows rather than one-off pilots. Those signals suggest stickiness, especially where boards become
              shared operating context for ongoing planning and execution. But review density is not retention proof,
              and company-authored stories rarely identify contract length, multi-year renewals, or product-level
              expansion. The result is a plausible but unverified durability thesis: customer satisfaction likely
              supports repeat usage, yet the absence of disclosed cohort and churn data remains a material diligence gap
              for underwriting long-term customer quality.
