            body: >-
              Public customer evidence shows Miro serving a broad enterprise mix rather than a narrow, single-function
              niche. Official customer surfaces highlight global brands such as Nike, IKEA, Deloitte, WPP, and Cisco,
              while named case studies and partner stories add retail, consulting, and transformation-heavy use cases.
              The common thread is not industry alone but workflow shape: Miro sells into organizations where
              cross-functional planning, workshops, product development, consulting delivery, and visual coordination
              matter enough to justify a shared workspace. Buyers and users split. Economic sponsorship often sits with
              enterprise transformation, product, or IT leaders; daily users are product managers, designers,
              facilitators, consultants, and broader cross-functional teams; procurement and security get pulled in as
              governance requirements rise. That multi-stakeholder pattern helps explain why Miro can expand from
              self-serve adoption into enterprise packaging, but it also means public evidence on payer ownership,
              segment ARR mix, and regional concentration is much thinner than logo breadth.
