      - number: '6.2'
        title: Adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              Miro's adoption story is best framed as broad footprint first, governed monetization second. Official
              sources claim more than 100 million users and more than 250,000 organizations, which is far beyond a niche
              workshop tool. The same public record also shows enterprise depth: 99% of the Fortune 100 are customers,
              and BusinessWire said in early 2022 that 20 enterprise customers were already paying more than $1 million
              annually. Those facts do not produce a clean SaaS funnel, but they do show that Miro spans free or
              team-led entry, organization-wide penetration, and large-governed enterprise contracts. More recent 2026
              release cadence around AI workflows, Copilot integration, and product-acceleration tools likely supports
