      - number: '6.5'
        title: Expansion and concentration
        blocks:
          - type: paragraph
            body: >-
              Miro's expansion paths are visible even though the company does not disclose enough financial granularity
              to quantify them cleanly. The first path is packaging: free or team-led board usage can expand into
              Business or Enterprise plans with governance, integrations, and AI credits. The second is workflow depth:
              product-acceleration modules, AI workflows, Specs, Technical Design, and Copilot-linked flows create
              reasons for existing customers to add seats and use cases. The third is enterprise control: security
              features such as Enterprise Guard and Microsoft control integrations can turn a collaboration deployment
              into a governed workspace. Counterbalancing that opportunity are real concentration and competitive risks.
              Miro does not disclose top- customer share, channel-sourced revenue, segment ARR mix, or active
              enterprise-account counts. Sacra also warns that Microsoft, Google, and Figma can compress differentiation
              in commoditized whiteboarding use cases. That means the expansion thesis is real, but its magnitude and
              quality still need management-supplied evidence.
