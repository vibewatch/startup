  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and privacy risks
        blocks:
          - type: paragraph
            body: >-
              Miro's legal-risk stack is shaped by the fact that the product stores strategic collaboration data and
              increasingly embeds AI rather than pointing to separate tools. The privacy policy says cross-border
              transfers rely on the Data Privacy Framework and Standard Contractual Clauses, and the FTC makes clear
              that privacy promises and DPF commitments are enforceable. That is a meaningful mitigation, but the
              requested DPA and Trust Center pages were not accessible on the report date, leaving a public-proof gap
              around current audits and supporting artifacts. The terms also place real responsibility on the customer
              for user behavior, credential hygiene, and board-sharing choices, which can complicate liability
              allocation after an incident. On the AI side, the EU AI Act is already live for GPAI obligations and will
              fully switch on transparency requirements in August 2026. Miro advertises ISO 42001 and AI governance
              controls, but investors still need a legal view on whether the current workflow, knowledge, and MCP
              features create extra compliance obligations in regulated accounts.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR038
              - CR039
