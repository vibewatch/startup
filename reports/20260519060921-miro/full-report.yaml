      - number: '1.4'
        title: Scale metrics and market position
        blocks:
          - type: paragraph
            body: >-
              Scale signals point to a platform with real enterprise penetration but some disclosure drift. At Series C,
              Miro said it had 30 million users, 130,000 paying customers, 20 enterprise accounts spending more than $1
              million annually, and coverage across 99% of the Fortune 100. By 2025-2026, the company's own materials
              say more than 100 million users and 250,000 organizations, while Forbes reported more than 90 million
              users and 1,864 employees. The most reasonable interpretation is continued expansion with fuzzy public
              rounding rather than contraction, but the >90M versus >100M discrepancy should still be preserved as a
              conflict because later chapters may reuse user-scale assumptions in valuation or customer-concentration
              analysis. Sacra adds a financial lens: an estimated $665 million ARR in 2024, up from $630 million, and
              $420 million revenue in 2022. That implies Miro is no longer simply a pandemic-era collaboration tool; it
              is a large private software platform with broad multinational adoption. Customer-name evidence reinforces
              that point. Official and media sources name organizations such as Nike, PepsiCo, Deloitte, IKEA, WPP, and
              Cisco. At the same time, Microsoft explicitly classifies Miro as an app that holds critical organizational
              data and is therefore a target for malicious actors, reminding buyers that scale increases security
              importance as much as product credibility.
