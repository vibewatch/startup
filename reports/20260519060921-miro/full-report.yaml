  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and financing history
        blocks:
          - type: paragraph
            body: >-
              Miro's public valuation context is dominated by one number: the $17.5B post-money mark set in January
              2022. BusinessWire and TechCrunch confirm that the Series C raised $400M and brought total capital raised
              to roughly $476M. That financing happened when the company had about 30M users, hypergrowth momentum, and
              strong remote-work tailwinds. The newer public picture is different. Forbes says Miro had more than 90M
              users and 250,000 organizations by September 2025, while the company's own pages now say more than 100M
              users and 250,000 companies. Scale is not the problem. The issue is what that scale converts into
              financially. Sacra estimates about $665M ARR in 2024 with only mid-single-digit growth from the prior
              year. If that estimate is directionally right, the old round price still embeds a demanding multiple and
              creates a valuation overhang rather than a clean current reference point.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV014
