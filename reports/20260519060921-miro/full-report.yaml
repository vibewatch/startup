      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Miro is that it already owns a massive collaboration footprint and is trying to convert
              that footprint into a higher-value workflow system. The company has real enterprise evidence, strong
              security packaging, published AI governance claims, and a broad 2026 roadmap that reaches from Flows and
              Sidekicks to Portfolios, Specs, MCP, and Microsoft Copilot integrations. The ASOS case study shows that
              when Miro becomes a system of work rather than a brainstorming accessory, customers can save time, cut
              tool sprawl, and improve planning quality. The anti-thesis is that the installed base may be easier to
              admire than to monetize at premium multiples. Growth looks slower in public estimates, bundled substitutes
              are everywhere, some of the best comparable sources were blocked on the run date, and investors still lack
              audited financials, retention metrics, and cap-table detail. Miro may still be a good company; the
              question is whether the current evidence supports buying the old price.
            claimRefs:
              - CV009
              - CV010
