            body: >-
              Miro's financial position as reconstructed from public sources is: $665M estimated ARR growing at ~33%
              year-over-year, a $17.5B post-money valuation that implies a ~26x ARR multiple on 2024 estimates, $476M in
              total disclosed funding, no confirmed fundraising since January 2022, and a pre-Series C confirmed
              profitable status that may or may not persist post-investment. The company's PLG motion appears
              structurally sound based on user and organisation growth proxies, and enterprise conversion is evidenced
              by case studies and the >$1M ACV customer cohort.

              The core adverse risk is valuation: the January 2022 $17.5B post-money valuation was set at peak SaaS
              multiples. At 2024 SaaS ARR multiples (typically 5–15x for comparable horizontal tools), the supportable
              fair-value range on $665M ARR is approximately $3.3B–$10B. The 26x implied multiple is material premium to
              this range. Sacra's own report acknowledges commoditisation risk as the primary bear case: if Microsoft
              Whiteboard and FigJam continue eroding Miro's mid-market base, revenue-growth deceleration below 20% could
              compress the defensible multiple further. The absence of NRR data, gross margin disclosure, and any
              post-2022 financial update constitutes a material due diligence blockers cluster that must be resolved
              through private-company data access before any investment decision.

              Miro's legal entity as "RealtimeBoard Inc. dba Miro" is confirmed via the Sprinklr S-1 SEC filing (May
              2021), which names Matthew Jacobson of ICONIQ Growth as a board director with simultaneous board seats at
