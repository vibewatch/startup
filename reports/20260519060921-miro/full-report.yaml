      - number: '3.2'
        title: 'Competitor profiles: scale, pricing, and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              MURAL is Miro's most direct head-to-head enterprise rival. Its Team+ plan is $12.99 per member per month
              billed annually and its Business plan is $17 per member per month billed annually. MURAL's differentiation
              centres on facilitation-focused features (Facilitation Superpowers, LUMA methodology frameworks) and
              claims coverage of more than 50% of the Fortune 100. Its integration ecosystem is narrower than Miro's and
              its standalone AI roadmap has not been publicly detailed with the same product depth as Miro's Flows and
              Sidekicks launches. FigJam (Figma) is now embedded in all Figma subscription tiers at no additional cost,
              making it the most dangerous bundled disruptor for design-led teams. FigJam's AI template generation,
              sticky-note sorting, and Asana, Jira, and GitHub integrations are directly competitive with Miro's core
              use cases. Microsoft Whiteboard receives continuous investment from Microsoft, which reported cloud
              revenue of $46.7 billion in Q4 FY25 growing 27% year over year; the whiteboard surface integrates with
              Azure OpenAI for session summaries and Planner task conversion, and connects directly with Microsoft
              Defender for Cloud Apps for enterprise governance. Conceptboard occupies a defensible niche targeting
              GDPR-sensitive European enterprises with Germany-hosted infrastructure (IONOS/StackIT), ISO 27001, 27017,
              and 27018 certifications, and a free tier of three boards. Notion ($10 per seat per month on Plus, $20 on
              Business) competes for the same cross-functional team budgets with a documents-and-database approach
              rather than a canvas approach; it lacks whiteboarding depth but excels at knowledge management. Zoom
              Whiteboard is positioned as a free collaborative canvas bundled within Zoom subscriptions, benefiting from
              Zoom's large installed meeting base but limited in standalone depth.
