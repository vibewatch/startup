      - number: '7.2'
        title: Operational, security, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk at Miro is less about factories and more about the reliability and safety of a complex
              workspace used for diagrams, workshops, research synthesis, prototypes, and AI workflows. Microsoft flags
              Miro as a store of critical organizational data and highlights compromised accounts, insider misuse, data
              leakage, and unmanaged devices as the main threat classes around the app. Miro has responded with SSO,
              SCIM, data residency, audit logs, SIEM integrations, and Enterprise Guard controls, so this is not a thin
              security posture. Even so, the G2 evidence says large boards can lag, which matters because the
              highest-value use cases involve dense, persistent canvases and many collaborators. The public evidence
              also does not include penetration-test findings, incident metrics, or current trust-package detail from
              the requested URLs. That means the control surface looks credible, but the control effectiveness still
              depends on private diligence.
            claimRefs:
              - CR006
              - CR007
