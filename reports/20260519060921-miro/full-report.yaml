      - number: '8.4'
        title: Comparable valuation
        blocks:
          - type: paragraph
            body: >-
              The comparable set is imperfect, which is itself an important finding. Public software leaders such as
              Atlassian and monday.com provide workflow, collaboration, and enterprise-governance context, but they are
              broader multi-product companies. Private product and design platforms such as Figma and Notion are
              strategically relevant, but several of the requested source pages for current valuation detail were
              blocked or unavailable on the report date. Mural and Lucid are operationally closer to Miro on the
              whiteboarding and visual-workflow dimension, yet public valuation disclosure is weak. That leaves Miro in
              an awkward middle: too big and multi-surface to value like a niche whiteboard, but not transparent enough
              to support high-precision platform-multiple underwriting from public evidence alone. The comparable table
              should therefore be read as a directional benchmarking tool rather than a precise pricing engine.
            claimRefs:
              - CV024
              - CV026
              - CV027
              - CV028
              - CV029
              - CV037
              - CV046
          - type: table
            tableRef: TV004
            claimRefs:
