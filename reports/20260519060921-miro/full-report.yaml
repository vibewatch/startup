      - number: '3.4'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Miro's structural moat rests on four reinforcing elements. First, network effects from shared boards and
              team workflows create account-level stickiness; once 60-plus Agile teams at a company like ASOS are
              running semester planning in Miro, migration requires coordinating exit across every team simultaneously.
              Second, deep integration lock-in through 250-plus connectors—Jira, Azure DevOps, Slack, Salesforce,
              Linear, Asana, Zoom, Microsoft Teams, Confluence—embeds Miro inside existing tooling workflows. Third, the
              Miro AI ecosystem creates compound stickiness: boards accumulate visual context (diagrams, specs,
              research), which becomes increasingly valuable as AI (Flows, Sidekicks, MCP) can operate on that
              institutional memory. Switching means losing that accumulated context. Fourth, enterprise governance
              tooling (audit logs, SCIM, SIEM integration, content lifecycle management, eDiscovery) creates procurement
              lock-in for legal and security teams. The adversarial reading of moat durability is also important: Sacra
              warns explicitly that commoditisation risk is rising as Microsoft, Google, and Figma offer similar core
              whiteboarding functionality, that Miro's 80% direct-traffic dependency signals brand concentration risk,
              and that remote-work reversion threatens the urgency that drove explosive 2020–2022 growth. Multi-homing
              is low-friction for teams that casually use whiteboarding; an engineer might use FigJam for quick diagrams
              while the enterprise contract remains with Miro. The net assessment is that Miro's moat is durable at the
              enterprise seat level (governance, integration, AI context), but is meaningfully weaker for freelancers,
              SMBs, and design-only workloads where bundled-free alternatives provide adequate functionality. The
              diligence focus must be on enterprise NRR trends and whether the AI differentiation gap is compounding or
              narrowing.
