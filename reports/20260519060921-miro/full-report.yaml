      - number: '7.3'
        title: Partner, dependency, and competitive risks
        blocks:
          - type: paragraph
            body: >-
              Miro's platform breadth is also a dependency story. The AI roadmap leans on hyperscalers and model
              vendors, the workflow story leans on Jira, Azure DevOps, GitHub Copilot, Microsoft Copilot, and other
              connected tools, and the monetization story leans on customers continuing to prefer a standalone
              collaboration hub over bundled functionality. AWS says Miro can stand up generative AI services quickly
              and the AI launch says the platform supports multiple model vendors plus BYOK, which creates flexibility
              but also ties the roadmap to partner economics and partner policy. Competitive pressure is real. FigJam is
              included with all Figma seats. Microsoft Whiteboard rides inside Microsoft 365. Mural and Conceptboard
              keep low-friction entry points. Miro can still win because it is broader than a whiteboard, but the bundle
              pressure directly matters for pricing power and for the return case behind any new investment.
