      - number: '2.2'
        title: Market sizing and forecast
        blocks:
          - type: paragraph
            body: >-
              The narrowest sizing lens is also the most actionable one. Mordor values collaborative whiteboard software
              at $3.17B in 2025, expects $3.81B in 2026, and projects $9.59B by 2031. That implies a category CAGR of
              20.28%, which is still fast by enterprise-software standards. The mix behind that growth is revealing:
              cloud delivery already dominates, large enterprises already represent most revenue, and the strongest
              acceleration comes from AI facilitation, platform integration, and device-agnostic deployment. In other
              words, the market is no longer just a pandemic artifact; it is a workflow layer being pulled deeper into
              enterprise systems.


              Miro looks large relative to this narrow SAM. Sacra's $665M ARR estimate implies roughly 21% share of the
              2025 whiteboard market lens. That is substantial enough to matter for pricing power, product standards,
              and buyer awareness, but not large enough to make the category winner-take-all. The broader TAM story is
              more generous. Sacra's $16.7B and $45B lenses suggest Miro can grow by expanding into adjacent workflow
              categories even if whiteboard-specific penetration matures. The practical diligence conclusion is that
              both lenses are useful. The narrow SAM is the right way to judge competitive share, category maturity, and
              bundling pressure. The broader TAM is the right way to judge whether Miro's AI-workspace narrative can
              justify durable expansion beyond classic whiteboarding. The biggest gap is methodological: public evidence
              does not independently audit the assumptions behind the third-party forecast intervals.
            claimRefs:
