      - number: '8.5'
        title: Recommendation and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is Track. Miro has enough product breadth, customer proof, and strategic relevance to
              stay on the investment radar, but not enough current financial disclosure to justify paying up against the
              2022 mark. The deciding issue is evidence quality. If management can show audited ARR, healthy NRR,
              defensible add-on monetization for AI and governance, and a financing-clearing price that still validates
              the business, the recommendation can move up. If the next financing happens below $17.5B or if growth
              remains in the mid-single digits, the old mark turns from a halo into an overhang. Investors should
              therefore treat Miro as a company worth following, not a price worth chasing. The diligence asks in this
              chapter are designed to answer exactly what needs to happen before the posture changes from Track to Buy
              or to Avoid.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
