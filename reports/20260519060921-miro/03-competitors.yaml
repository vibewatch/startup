  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - Moat Claim
      - Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - 100M+ users and 250,000 enterprise orgs create cross-org network effects and switching friction
        - Low-friction multi-homing; FigJam or Zoom Whiteboard adopted for lighter use cases without displacing Miro contract
        - Medium
        - Verify enterprise NRR trends; confirm whether active-board expansion or contraction YoY in large accounts
      - - 250+ integrations create workflow lock-in (Jira, Azure DevOps, Slack, Teams, Salesforce, Linear)
        - Competitors adding integrations rapidly; FigJam already has Asana, Jira, GitHub; Microsoft Whiteboard has Loop/Teams
        - Medium
        - Audit integration exclusivity or depth advantages; confirm whether any integrations are exclusive vs. commonly available
      - - AI Flows and Sidekicks create compounding canvas context moat
        - MURAL and FigJam are developing AI features; Microsoft Whiteboard has Azure OpenAI; speed of AI parity closing
        - High
        - Confirm Miro AI differentiation timeline vs. competitor releases; track whether Flows/Sidekicks have exclusive capabilities
      - - Enterprise governance (Enterprise Guard, audit logs, SCIM, eDiscovery, SIEM) creates procurement lock-in
        - Microsoft Whiteboard governance embedded in M365 Compliance; FigJam governance within Figma Enterprise
        - Medium
        - Compare Miro Enterprise Guard to Figma and Microsoft enterprise governance depth for regulated-industry buyers
      - - Free tier and PLG viral growth sustain top-of-funnel and reduce CAC
        - FigJam, Microsoft Whiteboard, Notion, and Zoom Whiteboard all have zero-cost tiers; free-to-paid conversion requires active management
        - High
        - Obtain conversion rate from free to Starter/Business; confirm free-tier retention signals new enterprise deals
      - - MCP developer platform and API ecosystem create developer community stickiness
        - Limited independent evidence of developer ecosystem scale relative to Figma's plugin marketplace
        - Low
        - Confirm GitHub Miro AI plugin adoption metrics; compare MCP developer activity to Figma community plugin volume
      - - Data residency options (EU/US/AU) and ISO 42001 AI compliance create regulated-sector moat
        - Conceptboard is structurally stronger in GDPR-sovereign Germany; Microsoft has FedRAMP and DOD IL4 pathway
        - Medium
        - Confirm Miro FedRAMP status and government-sector pipeline; assess whether Conceptboard or Bluescape pose risk in public sector
      - - Miroverse template marketplace (1000+ templates) creates community and brand moat
        - Template libraries commoditising rapidly; Microsoft Whiteboard, MURAL, and FigJam all offer template libraries
        - Low
        - Confirm template creation/usage growth rate; assess whether Miroverse drives differentiated enterprise renewals
    notes: >-
      Severity ratings are evidence-based assessments: High = structural threat with active market evidence; Medium =
      real risk but Miro maintains current advantage; Low = long-term risk without near-term materialisation. All
      severity ratings reflect publicly available evidence as of 2026-05-19.
