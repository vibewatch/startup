      - - Notion
        - Adjacent — docs and databases collaboration
        - Private; ~$10B valuation; Plus $10/seat/month, Business $20/seat/month, Enterprise custom
        - Cross-functional teams needing docs, wikis, and databases; knowledge management use cases
        - Documents + databases + wikis in one platform; Notion Agent for AI workflows; broad template library
        - No true infinite canvas or whiteboard surface; different primary job-to-be-done than visual collaboration
      - - Zoom Whiteboard
        - Adjacent — bundled in UC platform
        - "Zoom public (NASDAQ: ZM); whiteboard bundled in Zoom subscriptions at no additional per-seat cost"
        - Zoom-centric enterprises using whiteboarding for meeting collaboration; brainstorming adjacent to video meetings
        - Bundled distribution; AI-assisted board summaries; low adoption friction for existing Zoom users
        - Meeting-centric; limited standalone asynchronous use; weaker template library; no deep enterprise governance
      - - LucidSpark / Lucidchart (Lucid Software)
        - Direct peer — diagramming-led
        - Private; exact funding not confirmed; pricing pages returned 404 errors as of run date
        - Technical teams combining diagramming (Lucidchart) with whiteboarding (LucidSpark); enterprise architects
        - Strong diagramming heritage; Lucidscale for cloud architecture; established enterprise diagramming base
        - Pricing not independently verified as of 2026-05-19; less brand differentiation vs. Miro in pure whiteboarding
      - - ClickUp (Whiteboards)
        - Adjacent — PM-bundled whiteboarding
        - Private; ~$4B valuation (estimated); whiteboard bundled within ClickUp project management platform
        - ClickUp customers wanting integrated PM and whiteboarding; task-centric collaboration workflows
        - Whiteboarding bundled at no extra cost within ClickUp; PM-canvas integration; broad plan availability
        - Whiteboarding secondary to task management; not a competitive standalone whiteboard platform
      - - Internal build
        - Substitute
        - Varies by organisation; typically engineering investment in custom tooling
        - Engineering-heavy organisations with specific governance, integration, or data-sovereignty requirements
        - Maximum control; custom integration options; no vendor lock-in
        - Long time to value; ongoing maintenance burden; PLG advantage for purchased platforms means purchased tools now dominate
