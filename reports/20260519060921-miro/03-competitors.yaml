  - id: section-feature-pricing
    title: 'Feature and capability comparison: where Miro leads and where gaps narrow'
    body: >-
      Miro's clearest capability advantage over all direct competitors is its AI Innovation Workspace—Flows (multi-step
      AI workflows) and Sidekicks (specialised AI collaborators)—launched at Canvas 25 and extended with PDF-to-workflow
      inputs, markdown import, and Jira two-way sync in April 2026. These features convert the canvas from a static
      artifact into a proactive workflow engine. PA Consulting's enterprise use of Miro Flows and Sidekicks for live
      client engagements demonstrates production-grade deployment by a large professional-services firm. ASOS achieved
      71% more effective meetings and approximately 50% less time on product planning after adopting Miro at scale
      across 60-plus Agile teams. Miro's enterprise security stack—ISO/IEC 27001, SOC 2 Type II, TISAX, GDPR, ISO/IEC
      42001 (AI management), EU/US/AU data residency, Enterprise Guard content governance, and Microsoft Defender
      integration—is deeper than MURAL's published compliance posture and significantly deeper than FigJam or Microsoft
      Whiteboard for regulated-industry buyers. The developer-platform layer (MCP server, REST APIs, WebSDKs, Live
      Embed) with integrations connecting to Claude Code, Gemini CLI, Cursor, and VSCode creates a developer-ecosystem
      moat that competitors have not publicly matched. Where gaps narrow: FigJam's zero-cost inclusion in Figma rapidly
      reduces Miro's advantage for pure whiteboarding in design-led teams. Microsoft Whiteboard's native Teams
      integration and Azure OpenAI summaries are improving in quality with Microsoft's $46.7B-per-quarter cloud
      investment. MURAL's facilitation tooling (LUMA frameworks, built-in voting, timer, laser pointer) remains
      competitive for workshop-focused buyers.
