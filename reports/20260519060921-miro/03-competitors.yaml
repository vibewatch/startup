callouts:
  - calloutType: strength
    title: AI Innovation Workspace creates compounding workflow differentiation
    body: >-
      Miro's Flows and Sidekicks—launched in late 2024 and extended with PDF, markdown, and Jira inputs in
      early 2026—transform the canvas from a static visual artifact into an active workflow engine. Enterprise
      deployments that use Flows accumulate visual context (specs, research, retrospectives) that powers
      future AI steps. This creates stickiness that core whiteboarding alone does not provide, and it is a
      differentiation that neither Microsoft Whiteboard nor FigJam has matched at the same workflow depth.
    claimRefs:
      - CP023
      - CP024
      - CP032
      - CP040
  - calloutType: risk
    title: Free-bundling displacement is a structural threat in SMB and design-team segments
    body: >-
      FigJam is now included at zero incremental cost in all Figma plans, and Microsoft Whiteboard ships with
      every Microsoft 365 seat at zero incremental cost. For organisations already committed to Figma for
      design or Microsoft 365 for productivity, upgrading to a paid Miro seat requires justifying a positive-
      cost alternative against a free substitute. The Mordor market report quantifies "good-enough free
      whiteboards bundled with UC platforms" as a -2.1% drag on category CAGR. Sacra warns that Miro's 80%
      direct-traffic share signals brand concentration risk that could erode if free alternatives improve.
      The mid-market is the most exposed segment.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP020
      - CP021
      - CP026
  - calloutType: insight
    title: Competitive advantage is layered, not monolithic
    body: >-
      Miro's competitive position is strongest where multiple moat layers overlap: enterprise governance,
      deep integrations, AI Flows context, and the Miroverse template ecosystem all reinforce each other for
      large accounts. The position is weakest where only one layer applies—pure whiteboarding use cases
      without AI or governance requirements. Diligence should probe whether large-account NRR reflects the
      compounding advantage or whether free tools are quietly eroding the mid-market base that feeds pipeline.
    claimRefs:
      - CP001
      - CP022
      - CP023
      - CP024
      - CP030
      - CP041
