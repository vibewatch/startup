    - type: missing-source
      severity: material
      topic: Enterprise NRR and churn
      missingEvidence: >-
        No public evidence of Miro's net revenue retention, enterprise churn rate, or cohort-level expansion
        metrics exists.
      whyItMatters: >-
        NRR is the key metric for determining whether the moat is compounding (>120%) or eroding (<100%).
        Without it, the commoditisation risk argument cannot be quantified.
      diligencePath: >-
        Request NRR data in due diligence; benchmark against comparable SaaS tools including Figma (~130% NRR
        prior to Adobe acquisition attempt) and Monday.com (public filings).
