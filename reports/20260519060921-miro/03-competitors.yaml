chapter:
  number: 3
  title: Competitors
  summary: >-
    Miro holds the broadest enterprise deployment footprint in visual collaboration—100 million-plus users, 250,000
    organisations, and 99% Fortune 100 coverage—but its competitive position is materially threatened by two structural
    forces: free bundling of whiteboarding into Microsoft 365 and FigJam into Figma, and the risk of feature
    commoditisation as AI narrows functional gaps. Miro's real moat lies in integration depth (250-plus connectors),
    enterprise governance tooling, an expanding AI workflow layer (Flows, Sidekicks), and a template ecosystem
    accumulated over more than a decade. The key diligence question is not whether Miro is the market leader today, but
    whether its differentiation compounds faster than the bundled-free attack erodes its mid-market base.
sections:
  - id: section-landscape
    title: 'Landscape: direct peers, bundled incumbents, adjacents, substitutes, and likely entrants'
    body: >-
      Miro does not compete in a market with a single alternative set. The practical competitive universe is layered
      across five categories. Direct whiteboard peers—MURAL, Conceptboard, and Lucid's LucidSpark surface—compete on
      comparable infinite-canvas feature sets and enterprise pricing. Bundled incumbents represent the most structurally
      threatening category: Microsoft Whiteboard is included at zero incremental cost in every Microsoft 365 business
      and enterprise subscription and integrates natively with Microsoft Teams, while FigJam is now embedded at no
      additional charge in every Figma plan, giving design-led organisations a free whiteboard already connected to
      their existing design workflow. Adjacent collaboration platforms—Notion, Zoom Whiteboard, ClickUp's whiteboard
      module—compete for the same enterprise collaboration budget without matching Miro's canvas depth. Status-quo
      alternatives (physical whiteboards, slide decks, email-based ideation) remain the baseline the entire category
      displaces. Internal build is a residual substitute: Sacra data shows the visual-collaboration category is now
      purchase-dominated rather than build-dominated, but engineering-heavy organisations may still build lightweight
      canvases for specific workflows. Likely entrants include AI-native tools embedding collaborative diagramming
      and project-context capabilities (Cursor, Linear, GitHub Copilot) and work-management suites expanding their
      canvas surface, as evidenced by Wrike's announced acquisition of Klaxoon in December 2024 and Atlassian's
      acquisition of The Browser Company in September 2025. The market's Mordor Intelligence forecast of 20.28%
      CAGR through 2031 creates strong entrant incentives, but scale and integrations create high switching friction
      for established enterprise deployments.
