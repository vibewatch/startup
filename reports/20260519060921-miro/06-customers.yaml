    title: "Retention remains the biggest public-data hole"
    body: "Miro's public customer proof is broad, but underwriting customer quality still requires management-supplied NRR, GRR, churn, contract term, and top-customer concentration data."
    claimRefs: [CU017, CU018, CU036, CU041]
