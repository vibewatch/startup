artifact: customers
slug: miro
runDate: "2026-05-19"
company:
  name: Miro
chapter:
  number: 6
  title: Customers
  summary: >-
    Miro's customer base is clearly enterprise-scaled, with official claims of 100 million users,
    250,000 organizations, 99% of the Fortune 100, and historical evidence of at least 20
    seven-figure enterprise accounts. Customer proof is strongest where case studies quantify
    outcomes such as ASOS and Endava, while retention, concentration, and channel-mix disclosure
    remain materially underdeveloped in public sources.
sections:
  - id: customer-segmentation
    title: Customer segmentation
    body: >-
      Public customer evidence shows Miro serving a broad enterprise mix rather than a narrow,
      single-function niche. Official customer surfaces highlight global brands such as Nike, IKEA,
      Deloitte, WPP, and Cisco, while named case studies and partner stories add retail, consulting,
      and transformation-heavy use cases. The common thread is not industry alone but workflow shape:
      Miro sells into organizations where cross-functional planning, workshops, product development,
      consulting delivery, and visual coordination matter enough to justify a shared workspace.
      Buyers and users split. Economic sponsorship often sits with enterprise transformation,
      product, or IT leaders; daily users are product managers, designers, facilitators,
      consultants, and broader cross-functional teams; procurement and security get pulled in as
      governance requirements rise. That multi-stakeholder pattern helps explain why Miro can expand
      from self-serve adoption into enterprise packaging, but it also means public evidence on payer
      ownership, segment ARR mix, and regional concentration is much thinner than logo breadth.
    claimRefs: [CU001, CU003, CU004, CU005, CU009, CU024, CU033]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory
    body: >-
      Miro's adoption story is best framed as broad footprint first, governed monetization second.
      Official sources claim more than 100 million users and more than 250,000 organizations, which
      is far beyond a niche workshop tool. The same public record also shows enterprise depth: 99%
      of the Fortune 100 are customers, and BusinessWire said in early 2022 that 20 enterprise
      customers were already paying more than $1 million annually. Those facts do not produce a clean
      SaaS funnel, but they do show that Miro spans free or team-led entry, organization-wide
      penetration, and large-governed enterprise contracts. More recent 2026 release cadence around
      AI workflows, Copilot integration, and product-acceleration tools likely supports expansion
      inside existing tenants. The biggest analytical limitation is missing denominator data: public
      sources do not disclose active paid accounts, product-by-product penetration, free-to-paid
      conversion, or usage cohorts, so the adoption picture is impressive but still coarse.
    claimRefs: [CU001, CU002, CU006, CU008, CU015, CU016, CU025, CU034, CU040, CU041]
    tableRefs: [TU002]
    figureRefs: [FU002]
  - id: named-customer-proof
    title: Named customer proof
    body: >-
      Named customer proof exists, but its quality varies sharply across the evidence set. The best
      public proof comes from case studies with concrete operating outcomes. ASOS reported 60-plus
      agile teams on Miro, 71% more effective meetings, about 50% less time on product planning, 3.75
      hours saved per user each week, and a 75% cut in diagramming-license costs. Endava publicly
      tied Miro to a 40% cycle-time reduction in parts of its AI-native delivery motion. PA
      Consulting and Collective Next provide more workflow-rich than metric-rich evidence: both show
      Miro embedded in live client or facilitation work, but without the same denominator quality as
      ASOS. Official customer pages and the 2022 BusinessWire roster add recognizable names such as
      Nike, IKEA, WPP, Cisco, Dell, HP, Kaiser Permanente, Liberty Mutual, and Okta, yet those logo
      references do not prove present-day deployment depth or retention. Overall, Miro's named proof
      is credible and real, but still more concentrated in company-authored success narratives than in
      independently verified deployment or renewal data.
    claimRefs: [CU003, CU010, CU011, CU012, CU013, CU014, CU023, CU030, CU031, CU032]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: retention-and-satisfaction
    title: Retention and satisfaction
    body: >-
      The public record on retention is the clearest weakness in customer diligence. Miro does not
      publicly disclose net revenue retention, gross retention, churn, or renewal rates in the
      retained source set, so any durability conclusion must be indirect. That indirect evidence is
      still useful. Review surfaces such as G2, Capterra, TrustRadius, and GetApp show that Miro has
      a broad installed base willing to leave public feedback. Official case studies also imply repeat
      usage in product planning, facilitation, and consulting workflows rather than one-off pilots.
      Those signals suggest stickiness, especially where boards become shared operating context for
      ongoing planning and execution. But review density is not retention proof, and company-authored
      stories rarely identify contract length, multi-year renewals, or product-level expansion. The
      result is a plausible but unverified durability thesis: customer satisfaction likely supports
      repeat usage, yet the absence of disclosed cohort and churn data remains a material diligence
      gap for underwriting long-term customer quality.
    claimRefs: [CU017, CU018, CU019, CU021, CU035, CU042, CU043]
    tableRefs: [TU004]
    figureRefs: []
  - id: expansion-and-concentration
    title: Expansion and concentration
    body: >-
      Miro's expansion paths are visible even though the company does not disclose enough financial
      granularity to quantify them cleanly. The first path is packaging: free or team-led board usage
      can expand into Business or Enterprise plans with governance, integrations, and AI credits. The
      second is workflow depth: product-acceleration modules, AI workflows, Specs, Technical Design,
      and Copilot-linked flows create reasons for existing customers to add seats and use cases. The
      third is enterprise control: security features such as Enterprise Guard and Microsoft control
      integrations can turn a collaboration deployment into a governed workspace. Counterbalancing
      that opportunity are real concentration and competitive risks. Miro does not disclose top-
      customer share, channel-sourced revenue, segment ARR mix, or active enterprise-account counts.
      Sacra also warns that Microsoft, Google, and Figma can compress differentiation in commoditized
      whiteboarding use cases. That means the expansion thesis is real, but its magnitude and quality
      still need management-supplied evidence.
    claimRefs: [CU008, CU020, CU022, CU025, CU026, CU027, CU036, CU037, CU038, CU040, CU041]
    tableRefs: [TU005]
    figureRefs: [FU004]
