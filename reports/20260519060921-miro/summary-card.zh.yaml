    - Microsoft、Figma/FigJam、Atlassian 和其他相邻工具的捆绑压力，可能压缩定价权。
    - 未来融资若低于上一轮价格，会形成明显 down round 信号。
    - AI 和工作流产品宽度可能扩张得比变现证据更快。
  unresolvedGaps:
