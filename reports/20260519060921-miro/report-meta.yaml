companyProfile:
  summary: >-
    Miro began in 2011 as RealtimeBoard and has grown into a large private visual collaboration platform
    spanning whiteboarding, diagramming, product planning, workshops, and newer AI- and workflow-oriented
    modules. The company is founder-led by Andrey Khusid, publicly associated with Amsterdam and San
    Francisco, and last raised a disclosed round in January 2022, when it announced a $400M Series C at a
    $17.5B post-money valuation while already profitable. Public scale signals remain strong at 100M+
    users and roughly 250,000 organizations, but current financial transparency remains limited.
  foundedDate: '2011-01-01'
  founders:
    - name: Andrey Khusid
      role: Co-founder and CEO
      background: Founded RealtimeBoard in 2011 and still leads Miro as CEO.
      claimRefs: [CO004]
  foundingLocation: Perm, Russia
  headquarters: Amsterdam, Netherlands and San Francisco, CA
  productSummary: >-
    Miro sells a freemium, seat-based collaboration platform built around an infinite canvas and expanded
    into diagrams, docs, tables, workshops, enterprise controls, AI assistants, workflows, and newer
    modules such as prototypes, roadmaps, specs, technical design, and planning/delivery surfaces.
  customerFocus: >-
    Cross-functional product, engineering, design, strategy, and enterprise transformation teams, with a
    particular emphasis on large organizations that need shared planning, workshop, and governance tools.
  businessModel: >-
    Freemium SaaS model with Free, Starter, Business, and Enterprise tiers; monetization expands through
    paid seats, enterprise governance/security controls, and potentially newer AI and workflow modules.
  stage: Late-stage private
  fundingStatus: >-
    Last disclosed financing was a $400M Series C in January 2022 at a $17.5B post-money valuation,
    bringing total disclosed funding to about $476M.
  disclosureProfile: private-undisclosed
  claimRefs: [CO002, CO004, CO006, CO012, CO013, CO014, CO017, CV006]
summary:
  headline: >-
    Miro has real platform scale and strategic relevance, but the public evidence does not justify paying
    toward the 2022 $17.5B mark without fresh proof on ARR quality, retention, and current price.
  overallScore: 5.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: expensive
  keyMetrics:
    valuationUsdM: 17500
    revenueRunRateUsdM: 665
    arrUsdM: 665
    revenueGrowthYoYPct: 5.6
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 476
    customerCount: 250000
    headcount: 1864
  topStrengths:
    - 100M+ users and roughly 250,000 organizations indicate durable category scale and brand reach.
    - Product breadth is expanding beyond whiteboarding into AI, governance, and workflow modules.
    - Enterprise proof exists across major customers and security/governance packaging.
    - The company had already reached profitability by the January 2022 Series C.
    - Founder-led leadership and strong product-led distribution remain strategic assets.
  topRisks:
    - The 2022 $17.5B valuation still looks stretched against externally estimated mid-single-digit growth.
    - 'Public financial disclosure is thin: no audited ARR, NRR, gross margin, or current financing-clearing price.'
    - Bundle pressure from Microsoft, Figma/FigJam, Atlassian, and other adjacent tools can compress pricing power.
    - A future financing below the last round would create a visible down-round signal.
    - AI and workflow breadth may expand faster than monetization proof.
  unresolvedGaps:
    - Audited current ARR, revenue, and margin statements remain unavailable.
    - Net revenue retention, gross retention, and cohort renewal data are not publicly disclosed.
    - Cap-table terms and any post-2022 secondary or financing-clearing price remain unclear.
    - AI attach rates, unit economics, and module-level monetization are not publicly quantified.
    - Comparable private-company valuation evidence was partially blocked or stale on the run date.
