        title: 竞争对手画像：规模、定价与战略方向
        blocks:
          - type: paragraph
            body: >-
              MURAL 是 Miro 最直接的企业正面竞争对手。其 Team+ 计划按年计费为每成员每月 $12.99，Business 计划按年计费为每成员每月 $17。MURAL
              的差异化集中在引导型功能（Facilitation Superpowers、LUMA 方法论框架），并声称覆盖 Fortune 100 超过 50%。它的集成生态窄于 Miro，独立 AI 路线图也没有像
              Miro 的 Flows 和 Sidekicks 发布那样公开到同等产品深度。FigJam（Figma）如今以无额外费用嵌入所有 Figma 订阅层级，是设计主导团队最危险的捆绑型破坏者。FigJam 的 AI
              模板生成、便利贴排序，以及 Asana、Jira、GitHub 集成，直接与 Miro 核心用例竞争。Microsoft Whiteboard 持续获得 Microsoft 投入；Microsoft 报告
              FY25 Q4 云收入 $46.7B，同比增长 27%。其白板界面与 Azure OpenAI 集成，可生成会议总结并转换 Planner 任务，还直接连接 Microsoft Defender for
              Cloud Apps 做企业治理。Conceptboard 占据一个可防守细分，面向 GDPR 敏感的欧洲企业，提供德国托管基础设施（IONOS/StackIT）、ISO 27001、27017、27018
              认证，以及 3 块白板的免费层。Notion（Plus 每席每月 $10，Business 每席每月 $20）用文档和数据库路径争夺同一批跨职能团队预算，而不是画布路径；它缺少白板深度，但擅长知识管理。Zoom
              Whiteboard 定位为 Zoom 订阅内免费捆绑的协作画布，受益于 Zoom 庞大的会议安装基础，但独立深度有限。
