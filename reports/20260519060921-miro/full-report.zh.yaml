  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Miro 公开可见的客户旅程，通常从团队自发使用白板开始，再靠工作流加深和企业级控制扩展开来。
    approximationNotes: 旅程阶段综合了定价、客户故事和企业版打包，并非公司披露的转化漏斗。
    claimRefs:
      - CU004
      - CU005
      - CU008
      - CU024
      - CU034
    data:
      items:
        - label: 团队发现
          note: 职能团队先把白板用于规划或工作坊。
        - label: 跨团队扩散
          note: 更多团队在同一工作区里跑产品、设计或咨询工作流。
        - label: 工作流嵌入
          note: 集成、AI 工作流和产品加速模块把使用做深。
        - label: 受控推广
          note: 安全、管理和企业版打包把 IT 与采购纳入流程。
        - label: 扩张循环
          note: 客户在同一租户内增加部门、用例和受控功能。
