      - number: '5.2'
        title: 产品模块地图
        blocks:
          - type: paragraph
            body: >-
              当前产品界面可拆成几个相对清晰的模块组。第一是成熟核心工作区：画布协作、便利贴、图表、模板和会议工件。第二是企业控制：管理员、治理、安全、隐私和 Enterprise Guard。第三是可扩展性：REST
              API、Web SDK、Live Embed、集成，以及通向编码工具的新 MCP server 路径。第四是面向产品和工程组织的产品加速包，包括 Roadmaps、Specs、Technical
              Design、Portfolios、Prototypes 和 Insights。第五是参与和社区，包括 Miroverse、Academy，以及通过 Engage
              实现的大型团队引导。实际尽调问题不是这些资产是否存在——它们确实存在——而是它们被销售、打包和共同采用的稳定性如何。核心画布协作看起来高度成熟；较新的 AI
              工作流产品和部分附加界面有战略潜力，但仍足够早，买方应索取模块级采用率、附加率，以及按细分验证的重复使用证据。
