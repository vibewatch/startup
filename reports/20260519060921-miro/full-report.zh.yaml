      - number: '2.2'
        title: 市场规模与预测
        blocks:
          - type: paragraph
            body: >-
              最窄口径也是最可执行的口径。Mordor 估算协作白板软件 2025 年市场规模为 $3.17B，预计 2026 年 $3.81B，2031 年达到 $9.59B。这意味着品类 CAGR 为
              20.28%，按企业软件标准仍很快。增长背后的结构很有启发：云交付已经占主导，大型企业已经贡献多数收入，最强加速来自 AI
              引导、平台集成和跨设备部署。换句话说，市场已不只是疫情产物，而是被更深拉入企业系统的工作流层。


              按这个窄口径 SAM 看，Miro 已经很大。Sacra 的 $665M ARR 估计意味着，按 2025 年白板市场口径，它约有 21%
              份额。这足以影响定价权、产品标准和买方认知，但还不足以让品类赢家通吃。更宽的 TAM 叙事更宽松。Sacra 的 $16.7B 和 $45B 口径说明，即便白板专用品类渗透成熟，Miro
              仍可通过进入相邻工作流品类增长。实际尽调结论是，两套口径都有用。窄口径 SAM 用来判断竞争份额、品类成熟度和捆绑压力；宽口径 TAM 用来判断 Miro 的 AI
              工作空间叙事能否支撑其持续扩张到经典白板之外。最大缺口在方法：公开证据不能独立审计第三方预测区间背后的假设。
