  - id: TV002
    title: 投资逻辑 / 反向逻辑
    columns:
      - 论点
      - 支撑证据
      - 什么会改变判断
    rows:
      - - 投资逻辑：Miro 拥有异常庞大的协作触达和品牌
        - 100M+ 用户声称、250k 家公司、企业客户参考和品类领导地位
        - 独立的留存、席位扩张和货币化数据，才能把规模从故事变成证据
      - - 投资逻辑：平台正从白板扩展到 AI 和工作流编排
        - Flows、Sidekicks、MCP、Prototypes、Portfolios、Insights、Technical Design 和 Copilot 集成已在 2026 年发布或上线
        - 附加购买率和分模块收入数据会显示，产品广度是在变现，而不只是发版
      - - 投资逻辑：企业级控制可支撑更高 ARPU
        - Enterprise Guard、SSO、SCIM、SIEM hooks、数据驻留，以及「不使用企业客户数据训练」的定位
        - 企业增购、续约和合规胜率证据，会强化高 ARPU 逻辑
      - - 反向逻辑：增长看起来远慢于上一轮价格隐含水平
        - Sacra 的 ARR 和增长估计，加上 2022 年隐含收入倍数 41.7x
        - 如果经审计财务显示当前增长显著更快，或 ARR 高得多，这个质疑会缓和
      - - 反向逻辑：套件竞争和可比公司透明度不足削弱确信度
        - 每个 Figma 席位都包含 FigJam、Microsoft 365 内置 Whiteboard，且多个私有可比来源被挡住或已过时
        - 新融资或老股交易若验证价格，再加上更好的私有可比收入披露，确信度会提高
    notes: 投资逻辑和反向逻辑都有证据支撑。
