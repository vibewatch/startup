  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              Miro 的法律风险来自一个事实：产品承载战略协作数据，并且越来越把 AI 嵌进工作流，而不是只指向外部工具。隐私政策称，跨境传输依靠 Data Privacy Framework 和 Standard
              Contractual Clauses；FTC 也明确，隐私承诺和 DPF 承诺可以被执行。这是有意义的缓释，但报告日无法访问所要求的 DPA 和 Trust Center
              页面，留下了围绕当前审计和支持材料的公开证明缺口。条款还把用户行为、凭证卫生和白板共享选择的真实责任放在客户身上，一旦出事，责任分配会更复杂。AI 侧，EU AI Act 已经对 GPAI 义务生效，并将在
              2026 年 8 月全面开启透明度要求。Miro 宣称具备 ISO 42001 和 AI 治理控制，但投资人仍需要法律意见，判断当前工作流、知识和 MCP 功能是否会在受监管账户里带来额外合规义务。
