    data:
      nodes:
        - id: discover
          label: 捕捉上下文
          type: stage
          note: 工作坊、会议和异步审阅形成共享白板。
        - id: structure
          label: 结构化白板
          type: stage
          note: 模板、表格、图表和聚类把笔记转成产物。
        - id: ai
          label: 运行 AI 辅助
          type: stage
          note: Flows 或 Sidekicks 分析白板上下文并生成下一步产出。
        - id: spec
          label: 创建交付产物
          type: stage
          note: Specs、Technical Design、路线图和原型把工作打包。
        - id: sync
          label: 同步到系统
          type: stage
          note: Jira、Azure DevOps、Confluence、Notion 及相关工具接收结构化输出。
        - id: govern
          label: 治理并迭代
          type: stage
          note: 企业控制、评论和后续协作让循环保持运转。
      edges:
        - from: discover
          to: structure
          label: 组织
        - from: structure
          to: ai
          label: 补充上下文
        - from: ai
          to: spec
          label: 生成
        - from: spec
          to: sync
          label: 交接
        - from: sync
          to: govern
          label: 运营
  - id: FE003
    title: 关键依赖图
    type: dag
    summary: Miro 的产品价值依赖周边云、模型供应商、安全合作伙伴和工作管理平台。
    approximationNotes: 依赖类别面向公开信息且只表示方向；内部供应商集中度未披露。
    claimRefs:
      - CE008
      - CE014
      - CE017
      - CE018
      - CE019
      - CE024
      - CE037
    data:
      nodes:
        - id: miro
          label: Miro 工作区
          type: core
          note: 白板系统和工作流枢纽。
        - id: aws
          label: AWS
          type: platform
          note: 云托管、EKS、自动扩展、IAM 和生成式 AI 部署支持。
        - id: models
          label: 模型供应商
          type: partner
          note: OpenAI、Anthropic、Google 和 Azure 模型选项支持 AI 功能。
        - id: microsoft
          label: Microsoft 生态
          type: partner
          note: Defender 和 Copilot 集成扩展治理和工作流触达。
        - id: atlassian
          label: 交付系统
          type: partner
          note: Jira、Azure DevOps 及相关系统把白板转成执行产物。
        - id: devtools
          label: 编码工具
          type: partner
          note: GitHub Copilot、Claude Code 和类似客户端通过 MCP 消费 Miro 上下文。
      edges:
        - from: aws
          to: miro
          label: 托管
        - from: models
          to: miro
          label: 驱动 AI
        - from: microsoft
          to: miro
          label: 治理并扩展
        - from: miro
          to: atlassian
          label: 同步工作
        - from: miro
          to: devtools
          label: 共享上下文
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    summary: 核心协作是公开能力集中最成熟的部分；较新的 AI 和产品加速界面看起来有潜力，但推出时间更短。
    approximationNotes: 单元格值是成熟度判断，来自发布时间、包装可见度和文档深度。
