      - number: '2.3'
        title: 买方分层
        blocks:
          - type: paragraph
            body: >-
              买方和用户分层解释了 Miro 为什么能从团队自发采用扩展到企业采购。大型企业已经占市场收入的 58.05%，说明白板软件并不局限于小型创意团队；它已经变成大型组织采购的治理型协作层。与此同时，SME
              增长更快，受益于免费增值引导和基于信用卡的自助扩张。这种拆分与 Miro 的产品驱动模型吻合。团队可以先从轻量协作需求起步，随着使用扩散，再走向治理、集成和附加模块。


              垂直和地域结构也塑造购买动作。教育是当前最大垂直，反映互动教学和远程学习的广泛采用；医疗则是增长更快的垂直，因为视觉协调正在被拉入更多受监管工作流。North America 是当前收入中心，但
              Asia-Pacific 增长更快，这会影响价格本地化、移动性能和渠道策略。买方画像通常从产品经理、设计师、引导师或转型负责人开始；当安全和治理变重要，预算所有权往往随后迁移到
              IT、运营或协作平台负责人。Miro 企业页面称其有超过 100M 用户、250,000 家公司，并覆盖 Fortune 100 的 99%，说明公司已深度嵌入企业买方宇宙。开放尽调问题不是 Miro
              是否已触达大型买方，而是收入组合中有多少来自最可防守的细分，多少来自价格更敏感或更暴露于捆绑替代的团队。
