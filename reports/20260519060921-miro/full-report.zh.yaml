      - number: '1.4'
        title: 规模指标与市场位置
        blocks:
          - type: paragraph
            body: >-
              规模信号指向一个已经真正打入企业的大平台，但披露口径有漂移。Series C 时，Miro 称其有 30M 用户、130,000 个付费客户、20 个年支出超过 $1M 的企业账户，并覆盖 Fortune 100
              的 99%。到 2025–2026 年，公司自己的材料称用户超过 100M、组织达到 250,000 家；Forbes 则报道称用户超过 90M、员工 1,864
              人。最合理的解读是，公司仍在扩张，只是公开口径四舍五入模糊，而不是收缩；但 >90M 与 >100M 的差异仍应保留为冲突，因为后续章节可能复用用户规模假设做估值或客户集中度分析。Sacra
              加上一层财务视角：2024 年估计 ARR 为 $665M，高于 $630M；2022 年收入为 $420M。这意味着 Miro
              已不只是疫情时期的协作工具，而是一个被跨国广泛采用的大型私营软件平台。客户名称证据也支持这一点。官方和媒体来源列出 Nike、PepsiCo、Deloitte、IKEA、WPP、Cisco
              等组织。同时，Microsoft 明确把 Miro 归类为持有关键组织数据的应用，因此会成为恶意攻击者目标；这提醒买方，规模提升安全重要性，也提升产品可信度。
