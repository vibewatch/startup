      - number: '4.4'
        title: 单位经济缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              用公开来源重建的 Miro 财务位置是：估计 ARR $665M、同比增长约 33%；$17.5B 投后估值，按 2024 年估计值隐含约 26x ARR 倍数；累计披露融资 $476M；2022 年 1
              月以来无确认融资；Series C 前确认盈利，但投资后是否持续未知。基于用户和组织增长代理指标，公司 PLG 动作看起来结构上健康；案例研究和 >$1M ACV 客户队列也证明其能够转化到企业端。

              核心反向风险是估值：2022 年 1 月 $17.5B 投后估值是在 SaaS 倍数高峰设定的。按 2024 年 SaaS ARR 倍数（可比横向工具通常为 5–15x），在 $665M ARR
              上可支撑的公允价值区间约为 $3.3B–$10B。26x 隐含倍数相对该区间明显溢价。Sacra 自身报告承认商品化风险是主要悲观情景：如果 Microsoft Whiteboard 和 FigJam 继续侵蚀
              Miro 的中端市场基础，收入增长放缓到 20% 以下，可能进一步压缩可防守倍数。缺少 NRR 数据、毛利率披露和任何 2022
              年后财务更新，构成一组重大尽调阻塞项；在任何投资决策前，必须通过私营公司数据访问解决。

              Sprinklr S-1 SEC 申报文件（2021 年 5 月）确认 Miro 的法律实体为 “RealtimeBoard Inc. dba Miro”，并列明 ICONIQ Growth 的 Matthew
              Jacobson 同时担任 Sprinklr 和 Miro 董事。这提供了公开监管文件中可用的独立法律实体确认。Miro 自身没有公开收入或资产负债表申报；Sprinklr 引用是本次尽调中唯一 SEC
              级别来源触点。
