        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开技术证据指向云原生、依赖伙伴的运营模式，而不是异常自研的基础设施栈。Miro 的开发者界面覆盖 API、SDK、Live Embed 和 GitHub 托管的 AI 仓库；其 AI
              工作流主张则依赖白板上下文、集成和外部模型提供商。AWS 在基础设施侧很重要：Miro 描述了在 AWS 上快速构建的生产级生成式 AI 服务，并在相关架构叙事中点名 EKS、自动扩缩容、IAM
              和加密控制。应用侧，与 Jira、Azure DevOps、Confluence、Notion、Slack、Teams 和其他工作系统的集成，是让白板具备运营属性而不只是装饰的核心。关键技术结论是，Miro
              的架构看起来足以支撑扩展性和企业部署，但也明显依赖第三方云、模型供应商和协作生态。因此，投资人和企业买方应尽调平台韧性、模型治理默认设置、集成可靠性，以及大型白板、AI 工作流和嵌入式部署的吞吐上限。
