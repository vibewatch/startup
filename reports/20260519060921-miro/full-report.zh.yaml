  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、捆绑型巨头、相邻平台、替代方案与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              Miro 所在市场并不存在一组单一替代品。实际竞争宇宙分成五层。直接白板同行——MURAL、Conceptboard 和 Lucid 的 LucidSpark
              界面——在可比的无限画布功能集和企业定价上竞争。捆绑型巨头是结构上最危险的一类：Microsoft Whiteboard 以零增量成本包含在每个 Microsoft 365 商业和企业订阅中，并与
              Microsoft Teams 原生集成；FigJam 现在也以无额外费用嵌入每个 Figma 计划，让设计主导型组织获得一个已经连接现有设计工作流的免费白板。相邻协作平台——Notion、Zoom
              Whiteboard、ClickUp 的白板模块——争夺同一份企业协作预算，但不具备 Miro
              的画布深度。现状替代方案（实体白板、幻灯片、基于邮件的创意讨论）仍是整个品类要替代的基线。内部自建是剩余替代：Sacra
              数据显示，视觉协作品类如今采购主导而非自建主导，但工程密集型组织仍可能为特定工作流搭建轻量画布。潜在进入者包括嵌入协作图表和项目上下文能力的 AI 原生工具（Cursor、Linear、GitHub
              Copilot），以及扩展画布界面的工作管理套件；Wrike 于 2024 年 12 月宣布收购 Klaxoon，Atlassian 于 2025 年 9 月收购 The Browser
              Company，都是证据。Mordor Intelligence 预测该市场到 2031 年 CAGR 为 20.28%，这会强烈吸引新进入者；但规模和集成也为成熟企业部署制造了高切换摩擦。
