  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              对 Miro 最干净的市场定义是协作白板软件：云交付、多用户画布产品，用于头脑风暴、图表、规划、工作坊和异步视觉协作。Mordor
              直接测算的就是这个品类，也是核心功能同质化最关键的品类：无限画布、引导控制、模板、集成，以及越来越常见的 AI 总结或聚类。这个品类也嵌在更宽的企业协作预算池里。Sacra 把 Miro
              放进更大的协作机会中：2023 年 Q3 约 $16.7B，并指向 2025 年 $45B 的企业协作软件市场。这些更宽口径很重要，因为买方比较 Miro
              时，不只看专用白板，也会看吸收同一工作流预算的相邻工具，包括 Microsoft、Figma、Notion，或内嵌画布功能的工作管理套件。


              尽调上，纳入和排除规则很关键。纳入支出应覆盖视觉协作订阅、治理附加项、引导工具，以及嵌入工作流的白板产品。排除支出通常应包括通用聊天、独立视频会议和宽泛办公套件支出，除非白板能力本身是明确采购标准。Miro
              自身正在从窄品类向 AI 驱动的 Innovation Workspace 向上拉伸，但买方仍会按白板任务来评估产品：远程头脑风暴、敏捷仪式、规划、综合和跨职能对齐。因此，窄口径 SAM
              最适合判断竞争位置；更宽的 TAM 则更适合判断扩张上限。
