      - number: '4.3'
        title: 成本结构、毛利率与资本充足性
        blocks:
          - type: paragraph
            body: >-
              Miro 的成本结构没有公开披露。相对纯工作流 SaaS，公司更吃基础设施：面向 90M+ 用户的实时画布同步、通过 AWS Bedrock 和 SageMaker 进行的 AI
              模型推理、以及常在线多人架构，都会带来有意义的云计算成本。AWS 案例研究确认 AWS 是主要云厂商；因此，计算成本是随用户参与度扩张的运营支出。$500M–$1B ARR 区间的可比横向 SaaS
              公司通常可做到 70–80% 毛利率，但 AI 优先或基础设施重的平台可能因推理成本低 10–15 个百分点。Miro 毛利率未知，是一阶尽调优先项。

              Miro 约 1,864 名员工（Forbes，2025 年 9 月）意味着，在 $665M ARR 基础上，年人均收入约 $356K；这与中等效率 SaaS 基准一致（顶级 >$500K，中位数约
              $200K）。公司累计融资 $476M，并在 Series C 前已经盈利；Series C 后烧钱速度和当前现金头寸均未知。2022 年 1 月以来，没有确认桥接融资、可转债或降价轮
              活动；这既可能说明公司确实盈利，也可能说明 Series C 跑道充足。BusinessWire 披露的 Series C 资金用途——产品开发、全球扩张和品牌投入——符合增长支出，也可能压缩 Series C
              前的盈利基线。

              主要风险标记是 AI 基础设施扩张成本。Flows 和 Sidekicks 功能于 2024 年末在 Canvas 25 推出；如果采用加速，AWS Bedrock 推理成本可能相对 2022 年成本结构显著推高
              COGS。公开数据无法建模这一点，它代表主要经营杠杆不确定性。
