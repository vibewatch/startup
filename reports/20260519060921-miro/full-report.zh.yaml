  - id: FI001
    title: 收入模型桥：免费到付费转化流
    type: flow
    layout: standard
    summary: Miro 的产品驱动增长（PLG）收入模型从病毒式免费用户采用开始，经个人席位升级、部门级扩张，最终拿下企业合同；每个阶段都有不同经济画像和升级触发点。
    data:
      nodes:
        - id: free-tier
          label: 免费层（3 个白板）
          description: 零成本病毒式入口；无需信用卡；成员不限；每团队每月 10 个 AI 积分
        - id: starter-trigger
          label: 白板数量上限升级触发
          description: 用户触达 3 个白板上限，或需要 25 个 AI 积分；升级到 Starter（估计约 $8/用户/月）
        - id: business-trigger
          label: 企业功能升级触发
          description: 团队需要 Azure DevOps 集成、AI Workflows 或 50 个 AI 积分；升级到 Business
        - id: enterprise-contract
          label: 企业协商合同
          description: 30+ 席位、SSO/SAML、数据驻留、合规；顶级账户 ACV >$1M
        - id: addon-upsell
          label: 附加组件增购（Enterprise Guard / AI Workflows）
          description: 合同后捕获附加组件；Enterprise Guard 治理附加组件；Enterprise 方案上的 AI Workflows
        - id: platform-expansion
          label: 平台扩张（API / MCP 生态）
          description: 开发者 API、MCP 服务器和应用市场收入；当前尚未货币化
      edges:
        - from: free-tier
          to: starter-trigger
          label: 病毒式协作推高白板消耗
        - from: starter-trigger
          to: business-trigger
          label: 团队增长带来企业功能需求
        - from: business-trigger
          to: enterprise-contract
          label: 销售团队捕获部门级需求
        - from: enterprise-contract
          to: addon-upsell
          label: 成交后靠治理和 AI 附加组件增购
        - from: enterprise-contract
          to: platform-expansion
          label: 企业客户转为平台 API 消费者
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI022
      - CI023
