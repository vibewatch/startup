  - id: TV005
    title: 投资逻辑破裂与否决触发因素
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 融资价格可见低于 2022 年 $17.5B 标记
        - Series D 轮、要约或大额老股交易价格显著低于旧轮
        - 把旧估值从锚点变成包袱，并压缩上行预期
        - 除非披露质量同时改善，否则从观察转向回避
      - - AI 发布后增长仍在中个位数附近
        - 2026 年产品广度铺开后，ARR 或企业扩张没有可见再加速
        - 削弱平台溢价故事，指向成熟协作工具经济学
        - 下调退出倍数假设，并要求更强的进入价格纪律
      - - 企业留存或扩张走弱
        - 私下尽调中 NRR 低于 100%，或战略客户明显流失
        - 存量基础护城河未能变现为持久收入质量
        - 留存改善前，不承销买方上行
      - - 套件竞争拿下战略客户
        - 参考客户中出现被 Figma / Microsoft / 其他套件工具明确替代
        - 说明 Miro 是可被吸收的功能，而不是必须购买的平台
        - 立即削减高溢价倍数假设
      - - 审计、股权结构和 AI 变现证据仍拿不到
        - 管理层无法在 NDA 下提供经审计财务、优先股堆叠或 AI 收入证据
        - 证据风险压过公司质量讨论
        - 保持观察，或转为继续研究，而不是按接近峰值的价格买入
    notes: 每个触发因素都可观察，并直接绑定价格、证据质量或竞争定位。
    claimRefs:
      - CV014
      - CV031
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - 当前经审计收入、ARR 桥接和盈利能力指标未公开
        - 这些数据决定旧轮价格是否还有辩护空间
        - 向 CFO 数据室索取并审阅审计包
      - - NRR / GRR 队列数据
        - 没有公开留存或扩张队列
        - 存量基础质量是估值中最核心的未解问题
        - 在 NDA 下索取财务 / 客户成功队列表
      - - 股权结构表和优先股堆叠
        - 没有公开清算瀑布或优先权细节
        - 没有这些数据，无法信任下行情形的回报测算
        - 法律审阅章程、投资者权利文件和最新投资条款清单
      - - AI 变现指标
        - AI Workflows、Insights 或 MCP 驱动产品没有模块级收入、附加购买率或转化数据
        - 乐观情景依赖 AI 带来的再加速，而不只是席位增长
        - 产品 / 财务材料，列明各模块附加购买率和收入
      - - 私有可比公司 ARR 数据
        - 索取的私有可比页面被挡住或已过时
        - 没有可用收入细节，TV004 仍只具方向性
        - 补充最新分析师数据库工作
      - - 当前融资标记
        - 2022 年后，没有公开确认的要约、老股交易或新一轮价格
        - 在这个阶段，价格发现比品牌强度更重要
        - 向管理层和主要投资人询问最新交易或指示性定价
      - - 安全与信任包
        - 索取的信任中心和 DPA 页面在运行日期不可用
        - 企业溢价和受监管客户上行，取决于这些控制是否真实且最新
        - 直接向 Miro 索取信任包、渗透测试摘要和合规桥接材料
    notes: 这些请求是推动建议变化所需的最低材料包。
    claimRefs:
      - CV031
      - CV037
      - CV038
      - CV039
      - CV044
