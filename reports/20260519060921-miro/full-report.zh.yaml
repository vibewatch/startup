      - number: '1.3'
        title: 融资与资本结构
        blocks:
          - type: paragraph
            body: >-
              Miro 最近一次重大披露融资仍是 2022 年 1 月 Series C。该轮引入 $400M，投后估值 $17.5B，累计融资增至约 $476M。ICONIQ Growth
              领投，Accel、Atlassian、Dragoneer、GIC、Salesforce Ventures 和 TCV 参投，股东团由全球成长投资人和战略软件支持方主导。同一公告称 Miro
              已经盈利，因此这笔融资更像加速资本，而不是救助资本。本章保留来源没有显示后续 Series D、老股要约流程或 IPO 申报，所以 2022
              年估值仍是最后一个清晰价格标记，尽管之后的规模信号暗示业务体量已显著大于 2022 年。Sacra 对 2024 年 $665M ARR
              的估计意味着，如果私募市场情绪已压缩，公司如今在内部或二级市场叙事中的收入倍数可能远低于 2022 年高点。规模可观、没有新披露定价轮、公开股权结构细节有限——这组组合是重要尽调特征，不是噪音。
