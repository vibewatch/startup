      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层以创始人为中心。Miro 的关于页面、BusinessWire 和 Forbes 均一致把 Andrey Khusid 列为联合创始人兼 CEO。公开来源也一致把公司与 Amsterdam 和 San
              Francisco 联系在一起，但第二位联合创始人的信息不够干净：BusinessWire、TechCrunch 和 Forbes 提到 Oleg Shardin；Sacra 则写 Nikolay
              Alexeyev。这个差异值得关注，因为本章是后续章节沿用的基础记录，也说明即便是基础公司历史字段，也需要用内部文件校准。作为私营公司，Miro 的治理披露本就有限。Series C 新闻稿专门引用 ICONIQ
              Growth 普通合伙人 Matthew Jacobson，并注明其为 Miro 董事，说明到 2022
              年已有正式投资人董事席位；但公开来源没有给出完整的现任董事会名单。因此，可观察到的治理模式是创始人主导、机构投资人监督，而不是信息充分披露的上市公司式董事会。尽调上，关键人风险集中在
              Khusid：他是产品战略、公司叙事和企业扩张的清晰公众面孔；而公司 11 个枢纽的布局则显示，它更像分布式运营组织，而非单办公室创业公司。
