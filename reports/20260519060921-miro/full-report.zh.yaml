    Amsterdam 和 San Francisco 联系紧密；最近一次披露融资是在 2022 年 1 月，当时公司以 $17.5B 投后估值宣布 $400M Series C，且已经盈利。公开规模信号仍然强劲：100M+ 用户、约
    250,000 家组织；但当前财务透明度仍有限。
