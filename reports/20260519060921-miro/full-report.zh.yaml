  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分
      - 差异化
      - 限制
    rows:
      - - Miro
        - 直接龙头——视觉协作平台
        - $17.5B 估值（2022 年 1 月 Series C 轮）；累计融资 $476M；Sacra 估计 2024 年 ARR 为 $665M；100M+ 用户；250,000 个组织
        - 企业、产品 / 设计团队、Fortune 100（声称覆盖 99%）
        - AI Flows & Sidekicks、250+ 集成、ISO 42001/27001/SOC 2/TISAX、企业治理、MCP 开发者层
        - 估值定在 2022 年牛市；无公开财务；免费捆绑竞品带来商品化风险
      - - MURAL
        - 直接同业——企业引导
        - 私有公司；确切融资未披露；声称覆盖 50%+ Fortune 100；聚焦引导
        - 企业设计思维、引导密集型工作坊、LUMA 方法论买家
        - LUMA 框架、Facilitation Superpowers、具有竞争力的 SSO/合规姿态、$12.99–$17/member/month 定价
        - 集成生态更窄；AI 路线图深度未证实；准确 ARR 未公开
      - - FigJam（Figma）
        - 直接同业——捆绑在 Figma 中
        - Figma 保持独立（$20B Adobe 收购案受阻）；FigJam 免费包含在所有 Figma 方案中
        - 使用 Figma 做 UX 和产品工作流的设计主导组织；图表绘制、头脑风暴与设计文件相邻
        - 零增量成本；无缝 Figma 设计交接；AI 模板生成；Asana、Jira、GitHub 集成
        - 不是独立白板平台；离开 Figma 原生工作流后深度有限；企业治理更弱
      - - Microsoft Whiteboard
        - 在位者——捆绑在 Microsoft 365 中
        - Microsoft（上市公司，市值约 $3T）；Whiteboard 以零成本捆绑在 M365 商业 / 企业层级
        - Microsoft 365 企业租户；以 Teams 为中心的协作；教育行业
        - M365 客户无增量成本；原生接入 Teams/Loop；Azure OpenAI 生成会话摘要
        - 模板和集成少于 Miro；离开 Microsoft 生态后独立价值更弱
      - - Conceptboard
        - 直接细分对手——GDPR 主权
        - 私营公司；总部在德国；定价层级聚焦欧盟；免费层（3 个看板，每个看板 100 个对象）
        - 需要 GDPR、数据驻留（德国——IONOS/StackIT/AWS Frankfurt）的欧洲企业，以及受监管行业买家
        - 获 ISO 27001/27017/27018 认证；德国数据主权；原生适配 GDPR；细分合规定位有竞争力
        - 主要面向欧洲市场；集成生态更小；DACH 区域以外品牌认知有限
      - - Notion
        - 相邻——文档与数据库协作
        - 私营公司；估值约 $10B；Plus $10/seat/month，Business $20/seat/month，Enterprise 定制
        - 需要文档、wiki 和数据库的跨职能团队；知识管理场景
        - 文档、数据库、wiki 放在同一平台；Notion Agent 支持 AI 工作流；模板库广
        - 没有真正的无限画布或白板界面；核心任务不同于视觉协作
      - - Zoom Whiteboard
        - 相邻——捆绑在 UC 平台中
        - 'Zoom 上市公司（NASDAQ: ZM）；白板以无额外席位成本捆绑在 Zoom 订阅中'
        - 以 Zoom 为中心、用白板做会议协作的企业；视频会议旁边的头脑风暴场景
        - 捆绑分发；AI 辅助看板摘要；现有 Zoom 用户采用阻力低
        - 以会议为中心；独立异步使用有限；模板库更弱；没有深度企业治理
      - - LucidSpark / Lucidchart (Lucid Software)
        - 直接同类——以图表为先
        - 私营公司；确切融资未确认；截至运行日，定价页面返回 404 错误
        - 将图表（Lucidchart）与白板（LucidSpark）结合的技术团队；企业架构师
        - 图表基因强；Lucidscale 面向云架构；已有企业图表用户基础
        - 截至 2026-05-19，定价未能独立验证；在纯白板场景下，品牌差异化弱于 Miro
      - - ClickUp (Whiteboards)
