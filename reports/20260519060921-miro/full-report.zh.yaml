  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价可见度
        blocks:
          - type: paragraph
            body: >-
              Miro 采用免费增值 SaaS 订阅模式，锚定四个层级：Free、Starter、Business 和 Enterprise。Free 层每团队每月提供 3 块可编辑白板和 10 个 AI
              点数，制造零摩擦入口，推动产品驱动增长。Starter 层增加无限白板和每成员每月 25 个 AI 点数，面向已超过 Free 上限的小团队。Business 层包含每成员每月 50 个 AI 点数、AI
              Workflows 模块（Flows 和 Sidekicks），并增加 Azure DevOps 和 CA Rally 集成，服务企业工程工作流。Enterprise 层提供定制 AI 点数 分配、通过
              Enterprise Guard（付费附加项）实现的完整治理控制、高级 SSO/SAML、数据驻留和专属支持。

              Miro 定价页（2026 年 5 月抓取）没有公开展示 Starter 或 Business 层的美元价格；Sacra 估计两者按年计费分别约为 $8/user/month 和
              $16/user/month。Enterprise 定价逐合同谈判。没有实时销售沟通，就无法独立验证这种有意的不透明定价。AI Workflows 模块和 Enterprise Guard
              是基础订阅之上的增购向量，形成先落地再扩张模型：初始席位购买之后，由能力驱动扩张。

              收入流以按席位订阅收入为主，并由附加模块收入（Enterprise Guard、AI Workflows）、企业入门可能产生的专业服务费，以及市场开发平台机会（市场、API 生态）补充。Sacra 估计 Miro
              2022 年收入约 $420M；结合已确认的 130,000 个付费客户，可推导 2022 年每付费客户平均年收入约 $3,230，符合 SMB 到企业混合客群。
