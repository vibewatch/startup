        - 完整治理；数据驻留；专属 CSM；SSO/SAML；Enterprise Guard 附加模块
        - 来源：miro.com/enterprise/ (SI002)
      - - MURAL Team
        - $17.99/user/month（已确认）
        - 相比估计的 Miro Business，在名义功能水平相同下溢价 20%+
        - 可选择年度计费；提供免费试用
        - 来源：mural.co/pricing (SI012)
      - - FigJam (Figma Professional)
        - $0 增量（包含在 $15/user/month 起的 Figma 计划中）
        - 对 Figma 用户是零成本白板；对 Miro 定价护城河构成最大威胁
        - FigJam 没有独立定价；价值随套件捆绑提供
        - 来源：figma.com/pricing/ (SI014)
    notes: >-
      Miro 有意保持价格不透明，逐项对比很难。Sacra 的估计来自单一分析师来源，应通过直接销售沟通核验。FigJam 捆绑在 Figma 中，意味着对已采用 Figma 的设计主导型组织来说，Miro 真正面对的竞争价格门槛是
      $0。
  - id: TI003
    title: 单位经济模型表
    layout: default
    summary: >-
      Miro's unit economics are almost entirely unconfirmed from public sources; only topline ARR estimate, paying
      customer count (stale), enterprise ACV floor, and employee count are available.
    columns:
      - 指标
      - 当前最佳估计
      - 置信度
      - 重要性
      - 尽调路径
    rows:
      - - ARR（2024）
        - $665M（Sacra 估计）
        - 低至中（单一分析师来源）
        - 核心估值输入；所有倍数分析的基础
        - 要求 Miro 提供经审计或内部确认的 ARR；核验 Sacra 方法论
      - - ARR 增速（2023–2024 同比）
        - ~33%（Sacra 估计）
        - 低（由同一单一来源估计推导）
        - 增长轨迹决定终值假设
        - 要求按季度提供 ARR 队列；与内部报表核对
      - - 毛利率
        - 未知；可比横向 SaaS：70–80%；AI 重负载平台：60–70%
        - 极低（仅为基准区间）
        - 毛利率决定可防守的 EBITDA 路径；AI 推理成本可能压缩毛利率
        - 要求 P&L 及 COGS 拆分；量化每活跃用户 AWS 推理成本
      - - 净留存率（NRR）
        - 未知；PLG 模式显示可能 >100%，但未确认
        - 极低（仅基于结构推断）
        - NRR >120% 将验证复合型护城河；<100% 则提示流失威胁
        - 要求按队列和客户分层提供 NRR；与 Figma（Adobe 收购前约 ~130%）比较
      - - 获客成本（CAC）
        - 未知；PLG 降低混合 CAC，但企业销售团队增加成本
        - 极低（无数据）
        - CAC 回本周期决定增长的资本效率
        - 要求混合和分层 CAC；按层级提供 LTV/CAC 比率
      - - 平均合同价值（ACV）— 企业
        - 20 家客户已确认 >$1M/year（Jan 2022；下限，已过时）
        - 中（BusinessWire / TechCrunch；2 个来源交叉印证）
        - 企业 ACV 放大收入集中度风险
        - 要求当前企业 ACV 分布；前 10 大客户收入集中度
      - - 人均收入
        - ~$356K/year，基于 $665M ARR / 1,864 名员工（Forbes Sep 2025）
        - 中（两个独立来源输入）
        - 效率代理指标；相对顶级 SaaS 处于中档（>$500K 门槛）
        - 用包含承包商的实际员工数据交叉核验
    notes: “极低”置信度 = 从商业模式或基准结构性推断，并非公司特定数据。“中” = 存在 2 个独立公开来源，但可能已经过时。所有单位经济指标都需要私营公司披露才能确认。
