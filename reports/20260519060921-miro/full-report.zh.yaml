  - id: TI005
    title: 公开财务缺口表
    layout: default
    summary: >-
      Five categories of financial data are structurally unavailable from public sources and must be resolved through
      private-company due diligence to support any investment decision.
    columns:
      - 缺失指标
      - 重要性
      - 当前最佳代理
      - 精确尽调路径
    rows:
      - - 毛利率 %
        - 定义可持续 EBITDA 路径；AI 推理成本可能把它压到横向 SaaS 常规水平以下
        - 基准区间 60–80%；无 Miro 特定数据
        - 要求 P&L 及 COGS 拆分；AWS 账单样本；单用户计算成本
      - - 净留存率（NRR）
        - 衡量护城河是复合（>120%）还是侵蚀（<100%）的关键指标
        - PLG 模式显示 >100%；未确认
        - 要求过去 4 个季度按客户队列和层级提供 NRR
      - - 烧钱速度和现金跑道
        - 决定下一次融资事件的紧迫性和谈判筹码
        - Series C 于 Jan 2022 融资 $400M；当前烧钱速度未知
        - 要求月度 P&L；现金资产负债表；CFO 对现金跑道的说明
      - - Starter 和 Business 单席价格
        - 支撑定价权和 ASP 趋势分析
        - Sacra 估计 $8–16/user；Miro 未确认
        - 要求当前价目表以及任何历史价格调整
      - - 客户收入集中度
        - 若前 10 大客户占 ARR >30%，流失风险很大
        - 20 家客户在 Jan 2022 ACV >$1M = >$20M 下限（已过时）
        - 要求前 20 大客户 ARR 清单及合作年限；要求按 ACV 区间提供流失数据
    notes: 这五个缺口是任何 Miro 重大投资的最低财务尽调清单。截至 2026-05-19，公开来源无法解决任何一项。
