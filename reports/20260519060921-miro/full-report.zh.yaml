  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              公开客户证据显示，Miro 服务的是宽泛企业组合，而非狭窄的单一职能利基。官方客户页面突出 Nike、IKEA、Deloitte、WPP、Cisco
              等全球品牌；具名案例研究和伙伴故事又补充了零售、咨询和转型密集型用例。共性不只是行业，而是工作流形态：Miro
              销售给那些跨职能规划、工作坊、产品开发、咨询交付和视觉协调重要到足以证明共享工作区价值的组织。买方和用户分开。经济赞助人常在企业转型、产品或 IT
              负责人那里；日常用户是产品经理、设计师、引导师、顾问和更广泛的跨职能团队；随着治理要求上升，采购和安全团队会被拉进来。这种多利益相关方模式解释了 Miro
              为什么能从自助采用扩张到企业包装，但也意味着，关于付款方所有权、细分 ARR 组合和区域集中度的公开证据远薄于客户名称广度。
