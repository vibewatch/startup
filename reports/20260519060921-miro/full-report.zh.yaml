      - number: '1.5'
        title: 里程碑与轨迹
        blocks:
          - type: paragraph
            body: >-
              Miro 的轨迹可拆成四个阶段。第一是起源：RealtimeBoard 于 2011 年在俄罗斯 Perm 创立，最初是 Khusid 的设计机构用来与远程客户做视觉沟通的工具。第二是品类形成：公司 2019
              年更名为 Miro，随后借 2020–2022 年远程和混合办公浪潮，从约 5M 用户增长到 30M 用户，并在 2020 年 4 月完成 $50M Series B、2022 年 1 月完成 $400M
              Series C。第三是规模常态化：到 2024 年，Sacra 估计 ARR 为 $665M，而风险分析从纯增长转向商品化和远程办公回流。第四是 AI 工作流阶段。Canvas 25 推出 AI
              Innovation Workspace、Flows 和 Sidekicks；2026 年 3 月和 4 月版本加入截图转原型工作流、AI 搜索、PDF 和 markdown 输入，以及横跨四座城市的
              Canvas 26 活动。主线很清楚：Miro 试图从数字白板供应商，演进为产品、设计和 AI 辅助执行开始时共享上下文的层。开放问题在于，这条轨迹能否让差异化积累得快过捆绑型对手和市场常态化带来的挤压。
