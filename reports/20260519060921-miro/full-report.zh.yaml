      - number: '3.4'
        title: 切换成本、锁定与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Miro 的结构性护城河建立在四个相互强化的要素上。第一，共享白板和团队工作流带来的网络效应会制造账户级粘性；一旦 ASOS 这样的公司有 60 多个 Agile 团队在 Miro
              中跑学期规划，迁移就需要所有团队同时协调退出。第二，250 多个连接器带来的深度集成锁定——Jira、Azure
              DevOps、Slack、Salesforce、Linear、Asana、Zoom、Microsoft Teams、Confluence——把 Miro 嵌进既有工具工作流。第三，Miro AI
              生态会制造复合粘性：白板积累视觉上下文（图表、Specs、研究），随着
              AI（Flows、Sidekicks、MCP）能够在这段机构记忆上工作，价值越来越高。切换意味着丢掉已积累的上下文。第四，企业治理工具（审计日志、SCIM、SIEM
              集成、内容生命周期管理、eDiscovery）为法务和安全团队制造采购锁定。对护城河耐久性的反向解读同样重要：Sacra 明确警告，随着 Microsoft、Google 和 Figma
              提供相似核心白板功能，商品化风险正在上升；Miro 80% 直接流量依赖说明存在品牌集中风险；远程办公回流也威胁 2020–2022 年爆发式增长的紧迫性。随手使用白板的团队多栖成本很低；工程师可能用
              FigJam 快速画图，而企业合同仍留在 Miro。净评估是，Miro 在企业席位层面的护城河较耐久（治理、集成、AI 上下文），但在自由职业者、SMB
              和纯设计工作负载中明显更弱，因为免费捆绑替代品已足够好。尽调重点必须放在企业 NRR 趋势，以及 AI 差异化差距是在复利扩大还是收窄。
