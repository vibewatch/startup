      - number: '4.2'
        title: GTM 动作与牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Miro 的 GTM 主要靠产品驱动增长：免费层不需要信用卡，支持不限量团队成员，并在用户邀请同事协作白板时产生有机病毒式扩张。公司从 2020 年 4 月 20,000 个付费客户（Series B
              结束）增长到 2022 年 1 月 130,000 个付费客户（Series C 结束），约 22 个月增长 550%，且没有披露销售团队人数变化，这证明了自下而上的 PLG 动作。同一时期用户基数从 5M 增至
              30M（增长 500%），确认病毒循环——免费用户邀请付费协作者，随后触发升级——结构上仍完整。

              到 2025 年 9 月（Forbes），Miro 已增长到 90M 用户和 250,000 家组织，与从 2022 年基数继续但放缓的有机扩张一致。Sacra 报告 2024 年 ARR 为
              $665M，同比增长 33%；对于这个规模的公司，这仍然强劲，但低于 Series C 前公司报告的三位数增长率。截至 2022 年 1 月，20 个已确认年合同价值 >$1M
              的企业客户是唯一公开的企业层级基准，如今已经过期三年多。

              PA Consulting 和 ASOS 案例研究确认，Miro 的付费层在企业规模上仍被主动使用，验证 PLG 自下而上动作能够转化为企业支出。AWS Bedrock/SageMaker 合作伙伴关系和活跃
              GitHub 仓库（miro-ai）确认了支撑企业溢价定价的工程深度；这种定价是企业 GTM 成本下维持 CAC 回本所必需的。没有公开 CAC 或 LTV/CAC 比率数据；两者都必须在尽调中索取。
