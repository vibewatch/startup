  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义
        blocks:
          - type: paragraph
            body: >-
              Miro
              的产品已不宜再理解为独立数字白板。当前工作流主张从用于头脑风暴、图表、规划、异步评审和会议引导的无限画布起步，再叠加表格、时间线、看板和模板等结构化对象，让团队把工作坊产物转化为运营计划。2025–2026
              年产品叙事进一步转向 AI Innovation Workspace：Flows 把画布上下文转成多步骤 AI 工作流，Sidekicks 增加持续存在的 AI 协作者，Specs、Technical
              Design、Roadmaps、Prototypes、Insights 等新模块则试图把 Miro 上移到产品开发执行环节。按客户工作流看，Miro
              正把自己定位为一个系统：捕捉杂乱协作输入，结构化整理，再导出到工程、项目和治理系统。这个定义很重要，因为 Miro 的差异化不再主要取决于白板新鲜感，而是取决于企业是否继续把白板作为规划、AI
              辅助和执行协调开始时的上下文层。
