            title: 在 90M+ 到 100M+ 用户规模上，PLG 护城河仍然真实
            body: 即便考虑到不同页面上的公开计数不一致，Miro 的规模也明显达到少数协作创业公司才能触及的层级。这块安装基础给公司留下多条路径，未来可以让更多工作流表面变现。
            calloutType: strength
            claimRefs:
              - CV005
              - CV006
          - type: callout
            title: 中个位数增长对应约 26x ARR，估值悬压很难忽视
            body: 如果公开 ARR 和增长估计方向正确，Miro 仍背着一个疫情时代的价格锚；以当前成熟度和竞争格局看，这个价格偏高。
            calloutType: risk
            claimRefs:
              - CV014
              - CV015
              - CV038
          - type: callout
            title: 跟踪公司；没有 AI 驱动再加速和更好披露，就不要追旧价格
            body: 正确动作是把 Miro 留在雷达上；如果管理层能证明审计 ARR、健康 NRR、AI 工作流变现可见，以及融资成交价仍能验证平台故事，再快速重看。
            calloutType: recommendation
            claimRefs:
              - CV031
              - CV039
              - CV044
          - type: callout
            title: 未来融资若低于 $17.5B，2022 年光环会变成清晰的降价融资信号
            body: 上一轮披露金额很大、可见度很高，因此任何低于该估值的融资都会立刻重塑外部认知。
            calloutType: insight
            claimRefs:
              - CV001
              - CV040
