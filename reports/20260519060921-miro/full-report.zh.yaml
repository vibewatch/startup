chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Miro 是一家私营视觉协作软件公司，最知名的是无限画布；近来则主推 AI Innovation Workspace 定位。产品最早叫
              RealtimeBoard，如今位于头脑风暴、图表绘制、产品规划和跨职能执行的交汇处。官方材料仍把核心体验描述为可免费起步的协作产品：新用户默认进入 Free 计划，随着治理、安全和规模要求上升，再扩展到
              Starter、Business 以及需要联系销售的 Enterprise 层级。这套包装支撑了典型的产品驱动增长路径。BusinessWire 明确称 Miro
              的成功建立在稳健商业基本面和产品驱动增长之上，TechCrunch 则把 2020–2022 年扩张与用户和付费客户快速增长联系起来。当前企业销售话术已不止白板。Miro 如今把自己定义为 Innovation
              Workspace，拥有 100M+ 用户、250,000 家组织、250 多项集成、企业安全控制，以及 Flows、Sidekicks 等 AI
              层。因此，商业模式把免费增值的漏斗获客与团队内先落地再扩张的商业化结合起来：团队先用轻量协作，后续再购买更深的工作流、治理和企业支持。当前定价承诺各层级都提供预构建模板；而 2022 年报道曾称平台已经有近
              1,000 个模板。
