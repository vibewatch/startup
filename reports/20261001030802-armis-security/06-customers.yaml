  title: "Customers"
  summary: "Armis secures over 640 enterprise and critical infrastructure customers—including 35+ Fortune 100 leaders such as United Airlines, Colgate-Palmolive, and Mondelēz International—delivering 351% annual ROI and 61% operational efficiency gains. Following its landmark $7.75B acquisition by ServiceNow in April 2026, Armis anchors enterprise-wide autonomous risk governance across IT, OT, IoT, and IoMT environments, though customer contract retention metrics (NRR/GRR) remain undisclosed."
sections:
  - id: "customer-base-segmentation"
    title: "Enterprise Customer Base Segmentation"
    body: "Armis Security focuses on Global 2000 enterprises, national healthcare systems, critical infrastructure operators, and federal defense agencies that require unified, agentless asset intelligence across heterogeneous environments. Analysis of technographic data reveals a highly concentrated presence in large-scale organizations: over 27% of verified deployments operate within enterprises exceeding 10,000 employees, spanning manufacturing, healthcare, technology, and financial services. Key economic buyers include Chief Information Security Officers (CISOs), Chief Information Officers (CIOs), and VP-level Operational Technology (OT) security directors who must comply with stringent regulatory frameworks such as NIST CSF, NIS2, and HIPAA. While Armis holds a leading position in agentless device exposure management, its customer footprint remains anchored in North America (representing 68.2% of verified accounts), creating substantial geographical expansion potential alongside vulnerability to regional procurement cycles."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"

  - id: "adoption-trajectory"
    title: "Adoption Trajectory & Operational Economic Impact"
    body: "Armis Centrix operates as an agentless exposure management and asset intelligence platform tracking over 3 billion connected devices globally. Rigorous economic impact assessment conducted by technology research firm Omdia indicates that enterprise deployments deliver an average annual return on investment (ROI) of 351%, driven by a 61% improvement in security team operational efficiency. Enterprise customers report identifying 3X more network assets than previously cataloged, with automated prioritization eliminating up to 98% of vulnerability alert backlogs. Furthermore, mean time to resolution (MTTR) for critical exposures drops by 90%, and patch cycle durations decline by 59%. These substantial quantifiable efficiency gains translate directly into hard cost savings, including 10% to 15% reductions in software licensing overhead through unused capacity reclamation and a 25% decrease in cyber insurance premiums resulting from verifiable control audits."
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"

  - id: "named-customer-proof"
    title: "Named Customer Proof & Production Deployments"
    body: "Armis demonstrates validated enterprise adoption across Fortune 500 conglomerates, multinational industrial manufacturers, healthcare providers, and high-volume logistics networks. Public customer deployments include United Airlines, Colgate-Palmolive, Mondelēz International, DocuSign, Allegro MicroSystems, and Takeda Pharmaceuticals. In industrial and manufacturing settings, customers leverage Armis Centrix alongside deep operational technology integrations—such as Fortinet FortiGate firewalls and Cisco infrastructure—to detect behavioral anomalies without interrupting live production lines. In healthcare and public sector environments, organizations such as the Los Angeles County Department of Health Services deploy Armis to inventory IoMT medical devices and enforce real-time zero-trust segmentation. Production case studies highlight rapid time-to-value, with organizations uncovering multi-year audit backlogs and achieving comprehensive network visibility within weeks of sensor deployment."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"

  - id: "retention-expansion-risks"
    title: "Platform Integration, Expansion & Concentration Dynamics"
    body: "The strategic trajectory of Armis underwent a structural transformation with its $7.75 billion acquisition by ServiceNow, closed in April 2026. Rather than functioning as a standalone point solution, Armis Centrix has been designated as the foundational asset intelligence engine powering ServiceNow's newly launched Autonomous Security & Risk suite. This integration directly connects Armis's real-time telemetry across IT, OT, IoT, and AI agent identities into the ServiceNow CMDB and Security Incident Response workflows. ServiceNow's security and risk business reached $1 billion in annual contract value (ACV) prior to the transaction, providing an expansive cross-sell channel across thousands of joint global enterprises. However, critical subscription durability metrics—specifically Net Revenue Retention (NRR) and Gross Revenue Retention (GRR)—have never been publicly disclosed by Armis or ServiceNow. This lack of transparency conceals underlying churn dynamics and creates integration friction risks if legacy customers resist forced bundling into the broader ServiceNow platform."
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"

