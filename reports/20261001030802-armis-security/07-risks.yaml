schemaVersion: "report-v2"
artifact: risks
slug: armis-security
runDate: 2026-10-01
company:
  name: Armis Security
chapter:
  number: 7
  title: Risks
  summary: >-
    Armis operates in high-consequence customer environments while depending on broad data ingestion,
    cloud delivery, and workflow integrations, making data fidelity, availability, and post-acquisition
    execution the principal evidenced risks. Public materials show a current legal/compliance surface
    but do not establish incident history, underlying SLA terms, regulatory outcomes, profitability,
    customer concentration, or integration milestones, so those items require direct diligence.
sections:
  - id: regulatory-legal-exposure
    title: Regulatory and legal exposure is broad but only partially evidenced
    body: >-
      Armis markets coverage across operational technology, medical devices, government, financial
      services, and critical infrastructure, where a missed asset or delayed alert can carry operational,
      privacy, and safety consequences beyond ordinary enterprise software. Its legal hub identifies
      platform terms, a support SLA, a data processing addendum, a subprocessor list, an information
      security disclosure, a vulnerability disclosure policy, a bug bounty program, and security
      advisories. That is evidence of a formal compliance surface, not proof of the underlying control
      design, certification scope, contractual remedies, or absence of enforcement. The assigned pool
      contains no regulator or court record and no underlying policy text, so legal exposure must be
      treated as partially mapped rather than cleared.
    claimRefs: [CR001, CR002, CR006, CR007, CR015]
    tableRefs: [TR001]
  - id: operational-security-exposure
    title: Data fidelity and service continuity are the central operating risks
    body: >-
      The product's value proposition depends on continuously reconciling telemetry across heterogeneous
      environments. One company-issued financial-services case study describes data flowing from about
      twelve sources and previously conflicting inventories; Armis's integration catalog separately
      describes transfers of alerts, activities, device records, vulnerabilities, and user information
      into or from third-party systems. This breadth improves coverage but creates failure modes in API
      compatibility, permissions, normalization, stale records, duplicate identities, and customer-side
      configuration. The same evidence does not quantify false positives, false negatives, latency,
      uptime, recovery objectives, or model validation. Those missing measures prevent a conclusion that
      the mitigation is mature enough for safety-sensitive or mission-critical deployments.
    claimRefs: [CR003, CR004, CR005, CR013, CR014]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-and-integration
    title: ServiceNow ownership concentrates both upside and execution risk
    body: >-
      Armis's current homepage states that ServiceNow completed the acquisition, while Startup Nation
      Central records the prior company as acquired and reports a $7.75 billion exit. Existing Armis
      materials already describe multiple ServiceNow data and incident-workflow integrations. The
      combination can shorten distribution and workflow integration, but it also concentrates roadmap,
      packaging, migration, identity, and go-to-market decisions in the parent. The pool contains no
      integration milestones, retention commitments, product sunset policy, customer migration schedule,
      or quantified partner concentration. Investors should therefore monitor continuity of the Centrix
      roadmap and third-party adapters rather than treating strategic fit as evidence that execution risk
      has disappeared.
    claimRefs: [CR004, CR005, CR008, CR009, CR016]
    tableRefs: [TR003]
  - id: financial-model-and-kill-criteria
    title: Financial opacity shifts the decision toward monitored diligence
    body: >-
      Independent secondary sources document a November 2025 $435 million financing at a valuation above
      $6.1 billion and an earlier 2024 valuation of $4.3 billion, but funding raised is not cash available
      and valuation is not operating performance. The pool does not provide gross margin, accounting
      profit or loss, cash flow, burn, runway, retention, customer concentration, or post-close segment
      economics. The investment implication is not a precise downside estimate; it is a set of proof
      thresholds. Thesis-break signals include material deterioration in detection quality or service
      availability, forced customer migrations without equivalent controls, loss of critical adapters,
      undisclosed regulatory action, or failure to produce auditable retention and unit-economics data
      during diligence.
    claimRefs: [CR010, CR011, CR012, CR015, CR016]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk area
      - Jurisdiction or scope
      - Evidenced status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Data processing and subprocessors
        - Multi-jurisdictional; exact customer-data scope not disclosed
        - Legal hub lists a DPA and a subprocessor list
        - Medium
        - High
        - Partial
        - Material until data flows, locations, and change rights are reviewed
        - Obtain the current DPA, subprocessor annex, data-flow map, and customer notification history
      - - Security and service commitments
        - Enterprise and regulated customers
        - Legal hub lists support terms, disclosure policies, bug bounty, and advisories
        - Medium
        - High
        - Partial
        - Material because uptime, remedy, audit, and incident terms are absent from the pool
        - Review SLA credits, RTO/RPO, audit reports, incident notices, and security-advisory history
      - - Sector-specific regulatory and safety exposure
        - Healthcare, government, finance, OT, and critical infrastructure
        - Official materials claim use across high-consequence environments
        - Medium
        - Critical
        - Unverified
        - High where asset or alert failure can affect operations, privacy, or safety
        - Obtain regulatory mapping, certification scope, safety-case evidence, claims history, and regulator correspondence
    notes: >-
      Partial register based only on the assigned prefetched pool; no regulator docket, court record,
      underlying contract, certification report, or incident file was available, and likelihood is an
      analytical rating rather than a disclosed frequency.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible legal and compliance categories plus product sectors in the eight assigned sources
        as of 2026-10-01; specific laws, cases, and jurisdictions remain unverified.
    claimRefs: [CR001, CR002, CR006, CR007, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Evidenced mitigation
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap or trigger
    rows:
      - - Incomplete or conflicting asset inventory from heterogeneous inputs
        - Medium
        - High
        - Multi-source correlation and passive discovery are described
        - Partial
        - High if source coverage, permissions, or identity resolution drift
        - Require measured coverage, reconciliation error, and stale-asset rates
      - - Alert or model quality fails to distinguish normal behavior from compromise
        - Medium
        - High
        - Cloud-based detection and contextualization are described
        - Unverified
        - High without false-positive, false-negative, and latency evidence
        - Kill criterion is material degradation against agreed detection benchmarks
      - - Cloud or workflow interruption delays visibility and remediation
        - Medium
        - High
        - A support SLA is listed and incident workflows are integrated
        - Partial
        - Material because uptime and recovery terms are not in the pool
        - Obtain twelve months of availability, severity-one incidents, RTO, and RPO
      - - Post-acquisition roadmap or migration disrupts Centrix deployments
        - Medium
        - High
        - ServiceNow integration existed before completion of the acquisition
        - Early
        - Material pending milestones and customer migration evidence
        - Kill criterion is forced migration or control regression without contractual protection
    notes: >-
      Ratings synthesize disclosed architecture and customer-environment evidence; the sources do not
      publish failure frequencies, service levels, model-quality metrics, or post-acquisition milestones.
    claimRefs: [CR003, CR004, CR005, CR008, CR013, CR014, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Parent ownership and enterprise workflow
        - ServiceNow
        - Ownership is concentrated; revenue dependence is undisclosed
        - Roadmap, packaging, or migration priorities displace customer requirements
        - High
        - Existing CMDB, incident, ticketing, and vulnerability integrations
        - Material until governance and migration milestones are documented
      - - Cloud, identity, endpoint, and network adapters
        - Google, Microsoft, Cisco, and other ecosystem providers
        - Adapter count and revenue concentration are undisclosed
        - API, permission, schema, or licensing change reduces visibility
        - High
        - Broad adapter catalog and correlation across sources
        - Material because compatibility performance and ownership are not quantified
      - - Resellers, services, and subcontractors
        - Channel and delivery partners
        - Partner terms are listed; partner contribution is undisclosed
        - Service quality or channel conflict weakens implementation and support
        - Medium
        - Published partner and subcontracted-services terms
        - Unknown without partner concentration, audit, and escalation data
      - - Customer telemetry and configuration
        - Customer security teams and source systems
        - One case study reports about twelve integrated sources
        - Missing or conflicting inputs produce incomplete inventory and weak alerts
        - High
        - Reconciliation, enrichment, and collaborative support
        - High without source-health monitoring and coverage benchmarks
    notes: >-
      Dependency coverage is a sample drawn from the assigned sources; no supplier register, revenue
      concentration schedule, adapter uptime series, or partner-level performance data was available.
    claimRefs: [CR003, CR004, CR005, CR006, CR008, CR009, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      High-impact risks remain only partially mitigated in public evidence, with model quality and financial
      transparency carrying the lowest demonstrated mitigation maturity.
    data:
      columns:
        - label: Likelihood
          detail: Analytical rating from assigned evidence, not disclosed incident frequency.
        - label: Impact
          detail: Consequence for regulated and mission-critical deployments.
        - label: Mitigation maturity
          detail: Strength of mitigation demonstrated in the assigned public evidence.
      rows:
        - label: Asset-data fidelity
          note: Heterogeneous input quality can weaken inventory completeness.
          values: [Medium, High, Partial]
        - label: Detection and alert quality
          note: No false-positive, false-negative, or latency metrics were available.
          values: [Medium, High, Unverified]
        - label: Cloud and workflow availability
          note: An SLA is listed, but its service objectives were not in the pool.
          values: [Medium, High, Partial]
        - label: Privacy and subprocessor control
          note: The legal hub identifies documents without exposing their terms here.
          values: [Medium, High, Partial]
        - label: ServiceNow integration execution
          note: Acquisition completion is current, while milestones remain undisclosed.
          values: [Medium, High, Early]
        - label: Financial and concentration opacity
          note: Margin, cash flow, retention, and concentration evidence was unavailable.
          values: [Unknown, High, Unverified]
    approximationNotes: >-
      Qualitative placement only; no numerical probability, loss estimate, or incident rate is implied.
    claimRefs: [CR002, CR007, CR012, CR015, CR016]
callouts:
  - calloutType: risk
    title: Public compliance inventory is not control assurance
    body: >-
      Treat listed policies and programs as a diligence index. The investment case still requires the
      underlying terms, audit scope, exceptions, incident record, and customer-specific obligations.
    claimRefs: [CR006, CR007]
  - calloutType: recommendation
    title: Monitor measurable integration and reliability triggers
    body: >-
      Escalate or break the thesis if ServiceNow-driven migration reduces controls, critical adapters lose
      support, service quality materially deteriorates, or management cannot produce auditable retention,
      concentration, margin, and incident evidence.
    claimRefs: [CR012, CR016]
