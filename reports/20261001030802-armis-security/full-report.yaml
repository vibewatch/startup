      - number: '6.2'
        title: Adoption Trajectory & Operational Economic Impact
        blocks:
          - type: paragraph
            body: >-
              Armis Centrix operates as an agentless exposure management and asset intelligence platform tracking over 3
              billion connected devices globally. Rigorous economic impact assessment conducted by technology research
              firm Omdia indicates that enterprise deployments deliver an average annual return on investment (ROI) of
              351%, driven by a 61% improvement in security team operational efficiency. Enterprise customers report
              identifying 3X more network assets than previously cataloged, with automated prioritization eliminating up
              to 98% of vulnerability alert backlogs. Furthermore, mean time to resolution (MTTR) for critical exposures
              drops by 90%, and patch cycle durations decline by 59%. These substantial quantifiable efficiency gains
              translate directly into hard cost savings, including 10% to 15% reductions in software licensing overhead
              through unused capacity reclamation and a 25% decrease in cyber insurance premiums resulting from
              verifiable control audits.
            claimRefs:
              - CU004
              - CU005
