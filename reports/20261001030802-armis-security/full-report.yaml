      - number: '7.2'
        title: Data fidelity and service continuity are the central operating risks
        blocks:
          - type: paragraph
            body: >-
              The product's value proposition depends on continuously reconciling telemetry across heterogeneous
              environments. One company-issued financial-services case study describes data flowing from about twelve
              sources and previously conflicting inventories; Armis's integration catalog separately describes transfers
              of alerts, activities, device records, vulnerabilities, and user information into or from third-party
              systems. This breadth improves coverage but creates failure modes in API compatibility, permissions,
              normalization, stale records, duplicate identities, and customer-side configuration. The same evidence
              does not quantify false positives, false negatives, latency, uptime, recovery objectives, or model
              validation. Those missing measures prevent a conclusion that the mitigation is mature enough for
              safety-sensitive or mission-critical deployments.
