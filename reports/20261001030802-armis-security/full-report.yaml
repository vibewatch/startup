      - number: '7.3'
        title: ServiceNow ownership concentrates both upside and execution risk
        blocks:
          - type: paragraph
            body: >-
              Armis's current homepage states that ServiceNow completed the acquisition, while Startup Nation Central
              records the prior company as acquired and reports a $7.75 billion exit. Existing Armis materials already
              describe multiple ServiceNow data and incident-workflow integrations. The combination can shorten
              distribution and workflow integration, but it also concentrates roadmap, packaging, migration, identity,
              and go-to-market decisions in the parent. The pool contains no integration milestones, retention
              commitments, product sunset policy, customer migration schedule, or quantified partner concentration.
              Investors should therefore monitor continuity of the Centrix roadmap and third-party adapters rather than
              treating strategic fit as evidence that execution risk has disappeared.
