      - number: '6.4'
        title: Platform Integration, Expansion & Concentration Dynamics
        blocks:
          - type: paragraph
            body: >-
              The strategic trajectory of Armis underwent a structural transformation with its $7.75 billion acquisition
              by ServiceNow, closed in April 2026. Rather than functioning as a standalone point solution, Armis Centrix
              has been designated as the foundational asset intelligence engine powering ServiceNow's newly launched
              Autonomous Security & Risk suite. This integration directly connects Armis's real-time telemetry across
              IT, OT, IoT, and AI agent identities into the ServiceNow CMDB and Security Incident Response workflows.
              ServiceNow's security and risk business reached $1 billion in annual contract value (ACV) prior to the
              transaction, providing an expansive cross-sell channel across thousands of joint global enterprises.
              However, critical subscription durability metrics—specifically Net Revenue Retention (NRR) and Gross
              Revenue Retention (GRR)—have never been publicly disclosed by Armis or ServiceNow. This lack of
              transparency conceals underlying churn dynamics and creates integration friction risks if legacy customers
              resist forced bundling into the broader ServiceNow platform.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Quantifiable ROI as a Procurement Catalyst
            body: >-
              Armis Centrix's validated economic profile—delivering 351% annual ROI, a 90% drop in MTTR, and a 61%
              reduction in manual investigative overhead—serves as the primary operational justification for enterprise
              procurement. By translating esoteric cyber risk mitigation into hard dollar savings across IT software
              licensing (10%–15%) and cyber insurance premiums (25%), Armis elevates security tooling from an
              unavoidable cost center into a self-funding platform investment.
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Retention Opacity and Integration Friction Risks
            body: >-
              Despite boasting 35+ Fortune 100 accounts and a $7.75B valuation, neither Armis nor ServiceNow discloses
              Net Revenue Retention (NRR) or Gross Revenue Retention (GRR). This opacity represents a material diligence
              gap for investors evaluating post-acquisition platform durability. Furthermore, as ServiceNow assimilates
              Armis into its $1B ACV security suite, legacy customers using competitive ITSM tools (such as Jira Service
              Management or BMC) face potential integration deprioritization, increasing long-term churn vulnerability.
            calloutType: risk
            claimRefs:
              - CU013
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure is broad but only partially evidenced
        blocks:
          - type: paragraph
            body: >-
              Armis markets coverage across operational technology, medical devices, government, financial services, and
              critical infrastructure, where a missed asset or delayed alert can carry operational, privacy, and safety
              consequences beyond ordinary enterprise software. Its legal hub identifies platform terms, a support SLA,
              a data processing addendum, a subprocessor list, an information security disclosure, a vulnerability
              disclosure policy, a bug bounty program, and security advisories. That is evidence of a formal compliance
              surface, not proof of the underlying control design, certification scope, contractual remedies, or absence
              of enforcement. The assigned pool contains no regulator or court record and no underlying policy text, so
              legal exposure must be treated as partially mapped rather than cleared.
            claimRefs:
              - CR001
              - CR002
