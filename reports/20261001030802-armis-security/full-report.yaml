              - CM012
      - number: '2.2'
        title: Sizing Slices, Growth Vectors, and Sizing Discrepancies
        blocks:
          - type: paragraph
            body: >
              Evaluating the total market opportunity requires analyzing concentric addressable boundaries rather than
              relying on a single top-down macroeconomic figure. At the broadest macroeconomic layer, worldwide end-user
              spending on information security is projected by Gartner to expand by 12.5% in 2026 to reach $240 billion,
              propelled by escalating threat volumes and enterprise-wide artificial intelligence adoption. Within this
              comprehensive budget, enterprise cybersecurity asset management and cyber-physical security form a
              critical high-growth subsector. Independent forecasts from industry trackers indicate that global IoT
              connections expanded from 10.3 billion in 2018 to nearly 25 billion by 2025, with smart manufacturing
              emerging as the fastest-accelerating operational segment. As enterprise networks absorb billions of
              connected endpoints, cyber exposure management shifts from an optional discretionary tool to mandatory
              foundational infrastructure.


              Market expansion is accelerated by three primary tailwinds: the total dissolution of historical IT/OT air
              gaps, escalating nation-state ransomware targeting physical infrastructure, and compliance requirements
              under frameworks like CIS Control 1 (inventory and control of enterprise assets) and CIS Control 2
              (software asset management). Concurrently, commercial traction has generated significant corporate
              valuation inflection points. Armis achieved an annualized recurring revenue (ARR) run rate exceeding $200
              million by late 2024, doubled ARR over an 18-month trajectory, and surpassed $340 million in ARR prior to
              its definitive acquisition agreement with ServiceNow for $7.75 billion in cash. ServiceNow indicated that
              incorporating Armis is projected to more than triple ServiceNow's total addressable market opportunity for
              security and risk solutions. Nevertheless, substantive sizing discrepancies persist across independent
              research providers: market trackers disagree significantly on standalone CPS market boundaries, frequently
              conflating software asset visibility licensing with broader network firewall appliances, IT service
              management suites, and outsourced managed security operations.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM009
              - CM011
              - CM012
