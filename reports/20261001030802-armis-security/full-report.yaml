  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Armis Security rests on its proven category leadership in cyber exposure
              management and agentless device intelligence. Across enterprise IT, operational technology (OT), medical
              equipment (IoMT), and industrial control systems, unmanaged endpoints represent an expanding attack
              surface that legacy endpoint detection and response (EDR) agents cannot directly protect. By deploying
              passive network monitoring and an asset knowledgebase tracking over 3 billion device profiles, Armis
              achieved critical scale with over 35% of the Fortune 100 as enterprise customers, growing annual recurring
              revenue to over $340 million at a 50%+ year-over-year rate. Conversely, the anti-thesis centers on extreme
              valuation multiples, unverified gross margin economics, and significant integration friction. With
              ServiceNow agreeing to acquire Armis for $7.75 billion in cash, the standalone venture upside is capped
              and converted into enterprise execution risk within ServiceNow's broader IT service and security workflow
              portfolio. We assign an overall recommendation of track with medium confidence, a medium risk rating, and
              a fair valuation stance, reflecting that the transaction price accurately captures strategic workflow
              synergies while leaving unresolved private financial questions regarding net retention and gross margin
              resilience.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
