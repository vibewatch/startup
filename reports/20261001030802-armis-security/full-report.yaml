      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              ServiceNow's proposed ownership changes the basis of competition. The announced strategy connects Armis
              discovery and risk prioritization to ServiceNow remediation workflows, potentially giving Armis stronger
              enterprise distribution and a shorter path from finding an exposure to assigning corrective action. At the
              same time, ServiceNow itself disclosed risks from delayed technology integration, employee retention,
              legacy liabilities, management distraction, and unanticipated obligations. Armis-originated hiring
              evidence also points toward expansion into vulnerability assessment and VMDR, increasing overlap with
              established security suites rather than narrowing the field. The moat thesis therefore depends on whether
              cross-environment asset intelligence remains differentiated after integration and whether non-ServiceNow
              customers continue to view the platform as neutral. No independent benchmark in the assigned pool
              validates comparative detection accuracy, false-positive rates, or switching outcomes.
