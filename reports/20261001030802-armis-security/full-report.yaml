  - id: FE001
    title: Armis Centrix Four-Tier Operating Architecture
    type: stack
    summary: >-
      Multi-tier functional stack illustrating data flow from physical and virtual network capture to cloud intelligence
      and third-party enforcement.
    data:
      layers:
        - label: 'Layer 1: Edge Data Ingestion & Passive Capture'
          detail: >-
            Physical hardware appliances and virtual collector instances deployed on core network switches, capturing
            traffic passively via SPAN or mirror ports without endpoint software.
        - label: 'Layer 2: Local Traffic Parsing & Protocol Inspection'
          detail: >-
            Deep packet analysis of raw telemetry, MAC addresses, communication flows, and unencrypted industrial
            protocol commands dispatched to PLCs and connected devices.
        - label: 'Layer 3: Collective Asset Intelligence Cloud Engine'
          detail: >-
            Centralized AWS-hosted knowledge base matching observed device configurations against behavioral profiles
            derived from over 3 billion tracked enterprise devices.
        - label: 'Layer 4: Threat Detection & Risk Scoring Engine'
          detail: >-
            Continuous correlation of device telemetry with CVE databases, FDA medical recalls, threat intelligence
            feeds, and anomalous communication deviations.
        - label: 'Layer 5: Unified Exposure Management & Query Console'
          detail: >-
            Administrative interface powered by Armis Standard Query (ASQ), offering point-and-click visualization,
            custom policy creation, and asset inventory reporting.
        - label: 'Layer 6: Ecosystem Integration & Enforcement APIs'
          detail: >-
            Bi-directional REST connectors to Fortinet firewalls, Google Chronicle SIEM, and ServiceNow CMDB for
            automated threat containment and incident response.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: Customer Journey and Platform Expansion Map
    type: journey-map
    summary: >-
      Multi-stage customer adoption journey from initial passive network asset discovery to enterprise-wide autonomous
      risk governance within the ServiceNow ecosystem.
    data:
      nodes:
        - label: 1. Passive Discovery & Audit
          stage: Evaluation & Initial Landing
          role: SecOps / Network Admin
          touchpoints:
            - Passive network span port TAP deployment
            - Instant device identification via Collective Asset Intelligence Engine
            - Initial NIST CSF asset inventory baseline audit
          note: Customers typically discover 30% to 300% more connected assets than previously known.
        - label: 2. Exposure Prioritization & Remediation
          stage: Core Operational Adoption
          role: CISO / Vulnerability Management
          touchpoints:
            - Armis Centrix VIPR Pro vulnerability prioritization
            - Fortinet FortiGate and Cisco DNA firewall policy synchronization
            - Automated vulnerability workload reduction up to 98%
          note: Shifts SecOps from reactive patching to exposure-based remediation, cutting MTTR by 90%.
        - label: 3. OT & IoMT Vertical Expansion
          stage: Cross-Functional Platform Expansion
          role: VP of OT Security / Clinical Engineering
          touchpoints:
            - OTORIO Titan integration for industrial ICS/SCADA control networks
            - IoMT medical device protocol parsing and FDA recall tracking
            - Zero-trust segmentation enforcement on critical infrastructure
          note: Enables non-disruptive monitoring of fragile cyber-physical assets across factories and hospitals.
        - label: 4. Autonomous Governance Integration
          stage: Enterprise Control Tower
          role: CIO / Board Audit Committee
          touchpoints:
            - Direct bi-directional sync into ServiceNow CMDB and Security Incident Response
            - ServiceNow Autonomous Security & Risk agentic AI asset governance
            - Continuous compliance audit automation and insurance premium reduction
          note: Transforms raw asset telemetry into automated corporate governance and machine-speed mitigation.
        - label: 5. Multi-Site Enterprise Standardization
          stage: Enterprise Fleet Rollout
          role: Global Head of Infrastructure
          touchpoints:
            - Rollout across distributed corporate campuses and manufacturing plants
            - Continuous real-time asset discovery across regional subsidiaries
            - Cross-site unified attack surface dashboard consolidation
          note: Standardizes visibility and device telemetry across global enterprise operating entities.
        - label: 6. Executive Risk & Renewal Advocacy
          stage: Contract Renewal & Advocacy
          role: Chief Information Security Officer
          touchpoints:
            - Board-level Cyber Risk Exposure score reporting
            - Demonstration of 351% annual ROI and cyber insurance premium savings
            - Multi-year enterprise contract extension and joint reference participation
          note: Converts operational SecOps adoption into sustained multi-year renewal advocacy.
