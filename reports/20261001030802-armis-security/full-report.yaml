              - CE001
              - CE004
              - CE005
              - CE008
              - CE009
      - number: '5.4'
        title: Vertical Capabilities, OT Protocol Depth, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Armis tailors its passive analysis capabilities to distinct industry verticals where endpoint software
              cannot be deployed, specifically healthcare clinical environments and operational technology networks. In
              hospital settings, Armis ingests Manufacturer Disclosure Statement for Medical Device Security (MDS2)
              files from medical equipment manufacturers and correlates active firmware configurations against published
              FDA device recall databases, enabling clinical engineering teams to identify vulnerable infusion pumps and
              diagnostic scanners without interrupting patient care. In manufacturing and industrial automation
              networks, the platform capitalizes on the prevalence of unencrypted legacy industrial protocols to inspect
              packet payloads directly, monitoring write commands dispatched to Programmable Logic Controllers (PLCs) to
              detect unauthorized configuration changes or lateral threat movement. However, deep on-premises OT
              inspection across proprietary industrial protocols and isolated air-gapped segments presents ongoing
              diligence questions. While passive SPAN monitoring surfaces anomalous communications, decoding
              vendor-proprietary PLC control code historically required specialized on-site industrial appliances, which
              precipitated the acquisition of OTORIO to bridge operational technology coverage gaps.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Agentless Architecture Unlocks Comprehensive Unmanaged Device Visibility
            body: >-
              By capturing and analyzing mirrored network traffic at switch SPAN ports rather than deploying endpoint
              agents, Armis bypasses the technical impossibility of installing software on medical pumps, legacy PLCs,
              and smart building sensors. This passive ingestion eliminates operational disruptions while surfacing
              unmanaged devices that evade traditional endpoint security agents.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
              - CE004
          - type: callout
            title: Deep Proprietary Industrial Protocol Coverage Requires Architectural Bridging
            body: >-
              While passive packet inspection effectively decodes standard unencrypted industrial communications,
              complex proprietary OT protocols and segmented air-gapped networks limit pure cloud-based passive sensors.
              The March 2025 acquisition of OTORIO indicates that Armis required external specialized engineering to
              deepen on-premises industrial control systems protection.
            calloutType: risk
            claimRefs:
              - CE005
              - CE006
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              Armis Security focuses on Global 2000 enterprises, national healthcare systems, critical infrastructure
              operators, and federal defense agencies that require unified, agentless asset intelligence across
              heterogeneous environments. Analysis of technographic data reveals a highly concentrated presence in
              large-scale organizations: over 27% of verified deployments operate within enterprises exceeding 10,000
              employees, spanning manufacturing, healthcare, technology, and financial services. Key economic buyers
              include Chief Information Security Officers (CISOs), Chief Information Officers (CIOs), and VP-level
              Operational Technology (OT) security directors who must comply with stringent regulatory frameworks such
              as NIST CSF, NIS2, and HIPAA. While Armis holds a leading position in agentless device exposure
              management, its customer footprint remains anchored in North America (representing 68.2% of verified
              accounts), creating substantial geographical expansion potential alongside vulnerability to regional
              procurement cycles.
