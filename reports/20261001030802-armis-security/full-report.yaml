  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Structural Convergence
        blocks:
          - type: paragraph
            body: >
              The market for enterprise cyber asset security has undergone structural redefinition, expanding from
              isolated network visibility tools into comprehensive Cyber Exposure Management (CEM) and Cyber-Physical
              Systems (CPS) protection platforms. Historically, enterprise vulnerability scanners and Endpoint Detection
              and Response (EDR) agents secured managed corporate IT environments comprising workstations and servers.
              However, industrial control systems, medical technology, and connected building infrastructure cannot
              accommodate intrusive software agents without risking catastrophic physical disruption or operational
              downtime. Armis estimates that approximately 90% of devices in industrial and critical infrastructure
              networks remain unmanaged, operating without standard host monitoring agents. The addressable domain
              encompasses connected devices across enterprise IT, operational technology (OT) including programmable
              logic controllers (PLCs) and human-machine interfaces (HMIs), medical Internet of Things (IoMT) diagnostic
              systems, and commercial Internet of Things (IoT).


              Spend within this category is captured by specialized asset intelligence platforms capable of passive,
              out-of-band network traffic inspection, wireless airspace analysis, and multi-source API telemetry
              ingestion. The scope explicitly excludes traditional endpoint agent licensing, standard vulnerability
              management scanning suites that rely on intrusive probing, and dedicated physical perimeter access control
              hardware. Status-quo substitutes have historically relied on manual spreadsheets, basic Network Access
              Control (NAC) authentication databases, passive network tap sniffers, and legacy configuration management
              databases (CMDBs). These legacy approaches fail because NAC solutions verify initial network admission
              without continuous behavioral inspection, while manual CMDBs rapidly decay into stale repositories. By
              establishing passive discovery and behavioral context across IT, OT, and IoT, the sector transforms asset
              visibility from an audit inventory checklist into an active threat-prevention and exposure-prioritization
              layer.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM008
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
