              - CV011
              - CV012
      - number: '8.2'
        title: Capital Formation, Historical Rounds, and Acquisition Discipline
        blocks:
          - type: paragraph
            body: >-
              Armis demonstrated an unusual financing trajectory marked by two separate controlling or strategic
              acquisition milestones alongside growth equity syndicates. Following its founding in late 2015 by Yevgeny
              Dibrov and Nadir Izrael, the company raised $116 million across early rounds before Insight Partners
              acquired the business in January 2020 at a $1.1 billion valuation, with CapitalG contributing $100
              million. Rather than folding into a private equity holding vehicle, Armis retained independent management
              and continued raising institutional growth equity, completing a $300 million round led by One Equity
              Partners at $3.4 billion in 2021 and a $200 million Series D led by Alkeon Capital and General Catalyst at
              $4.2 billion in October 2024. In November 2025, Armis secured a $435 million pre-IPO financing led by
              Goldman Sachs Alternatives valuing the company at over $6.1 billion, before ServiceNow entered into a
              definitive $7.75 billion cash acquisition agreement in December 2025. Lifetime equity and private
              financing reached $1.17 billion across nine rounds, demonstrating strong institutional sponsorship while
              capping venture liquidation preference overhang through an all-cash exit.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario Underwriting, Valuation Comps, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Armis under comparable cybersecurity multiples highlights the substantial strategic premium
              embedded in ServiceNow's acquisition price. High-growth public peers in identity and exposure management
              such as CrowdStrike and Palo Alto Networks have historically traded at forward revenue multiples between
              14x and 22x, while specialized OT/IoT competitors like Claroty and Nozomi Networks have raised capital at
              private valuations of $1 billion to $2.5 billion. ServiceNow's $7.75 billion purchase price values Armis
              at approximately 22.8x trailing ARR, a multiple that exceeds standard industrial security benchmarks and
              reflects anticipated workflow cross-selling across ServiceNow's global enterprise customer base.
              Underwriting scenarios range from a bull case where Centrix accelerates ServiceNow's Security Operations
              (SecOps) revenue past $1 billion ARR, to a bear case where key engineering talent departs from Tel Aviv
              and OTORIO on-premises customers resist cloud migration. For continuing institutional diligence, primary
              verification priorities include tracking post-close key executive retention agreements, auditing joint
              adapter telemetry performance with Fortinet and Google Chronicle, and monitoring regulatory closing
              filings.
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Rich Acquisition Multiple Eliminates Independent Down-Round Risk but Shifts Focus to Integration
            body: >-
              ServiceNow's agreement to acquire Armis for $7.75 billion represents an acquisition multiple of
              approximately 22.8x ARR, substantially higher than typical M&A transactions in the cybersecurity sector.
              While this premium reflects deep strategic value—marrying Armis's agentless asset telemetry with
              ServiceNow's configuration management database (CMDB) and workflow automation engines—it also removes
              private market liquidity overhang. Diligence shifts from standalone capital adequacy to post-close
              executive retention, technical integration of OTORIO on-prem capabilities, and joint channel alignment.
            calloutType: insight
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV013
