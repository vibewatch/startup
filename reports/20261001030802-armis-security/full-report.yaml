              - CE003
              - CE004
              - CE006
              - CE012
      - number: '5.3'
        title: Ecosystem Integrations and Automated Enforcement
        blocks:
          - type: paragraph
            body: >-
              Because Armis operates without native endpoint agents, automated threat containment and policy enforcement
              rely heavily on bi-directional integrations across the broader cybersecurity and enterprise IT ecosystem.
              The platform provides pre-built adapters and API connectors to leading infrastructure providers, including
              next-generation firewalls, SIEM platforms, and enterprise service management systems. Through its
              integration with Fortinet FortiGate appliances and FortiManager, Armis dynamically pushes risk context and
              updated security policies to network firewalls, allowing security teams to enforce quarantine controls,
              restrict access to sensitive subnets, or apply elevated intrusion detection policies to compromised
              endpoints in real time. For telemetry correlation and threat hunting, Armis integrates with Google
              Chronicle to parse and transform asset alerts, activity records, and vulnerability findings into
              standardized Unified Data Model (UDM) events. Furthermore, in May 2026, ServiceNow announced Autonomous
              Security and Risk, embedding Armis real-time device intelligence directly into the ServiceNow CMDB and
              incident response workflows to govern connected assets and AI agents at machine speed. For service
              provider partners, Armis expanded the APEX Manage Program with a dedicated multi-tenant workbench to
              streamline client lifecycle administration.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
