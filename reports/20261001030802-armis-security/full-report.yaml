chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Architecture, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Armis Security operates as an enterprise cybersecurity provider specializing in cyber exposure management,
              asset intelligence, and cyber-physical systems (CPS) protection [CO001]. Founded in December 2015 by
              Yevgeny Dibrov (Chief Executive Officer) and Nadir Izrael (Chief Technology Officer) following their
              military service in the Israel Defense Forces' intelligence division Unit 81, the company maintains
              corporate operations in San Francisco, California, alongside research and development operations centered
              in Tel Aviv-Yafo, Israel [CO002]. Armis was incorporated to address a structural vulnerability in
              corporate networks: the proliferation of unmanaged, agentless connected devices spanning operational
              technology (OT), industrial control systems (ICS), Internet of Things (IoT), and Internet of Medical
              Things (IoMT) that cannot support traditional endpoint security agents [CO003]. The company monetizes
              through enterprise software subscriptions for its core platform, Armis Centrix, supplemented by
              specialized modules including asset vulnerability management, OT/ICS security, and prioritization
              intelligence [CO004]. Its architectural foundation combines out-of-band network traffic inspection with
              integrations across cloud providers, identity stores, and security operations platforms, anchoring device
              context against an engine tracking over 1 billion historical asset profiles [CO005]. As the company
              scaled, its strategic scope transitioned from passive network visibility to active cyber exposure
              management and automated remediation orchestration [CO004].
            claimRefs:
