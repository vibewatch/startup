      - number: '3.3'
        title: Pricing, Packaging, and Switching Economics
        blocks:
          - type: paragraph
            body: >-
              None of the assigned sources discloses an Armis list price, realized contract value, discount schedule,
              consumption unit, or directly comparable competitor quote. The defensible conclusion is therefore that
              pricing remains a diligence gap, not that Armis commands a particular premium. Packaging may also change
              as ServiceNow integrates the product: the acquisition announcement describes a future unified
              exposure-and-operations stack, but does not specify whether Armis remains separately sold, becomes a
              ServiceNow module, or is bundled with broader workflows. Internal build remains a substitute where buyers
              already own network telemetry, a CMDB, ticketing, and enforcement tools, although the evidence does not
              quantify the engineering burden. Buyers should test whether Armis reduces tool count or instead adds an
              intelligence layer whose value depends on maintaining several incumbent integrations.
