      - number: '1.3'
        title: Financing History, Valuation Trajectory, and Market Milestones
        blocks:
          - type: paragraph
            body: >-
              Armis followed an aggressive institutional capitalization trajectory prior to its acquisition by
              ServiceNow, raising a cumulative total of $1.17 billion across institutional equity rounds [CO002]. After
              reaching an interim private valuation of $3.4 billion in November 2021 and $4.3 billion in October 2024
              via a $200 million private financing round, the company secured a $435 million pre-IPO financing round in
              November 2025 led by Goldman Sachs Alternatives with participation from CapitalG and Evolution Equity
              Partners, which priced the business at over $6.1 billion [CO006, CO010]. Top-line financial scale advanced
              rapidly, surpassing $200 million in annual recurring revenue by late 2024 with public targets targeting
              $500 million in ARR by 2026 [CO006]. The commercial footprint expanded across Fortune 500 enterprises,
              securing major logos including Colgate-Palmolive, United Airlines, and Mondelēz International, alongside
              formal recognition by Gartner as a Leader in CPS Protection Platforms for two consecutive years through
              2026 [CO006, CO011]. In late 2025, enterprise workflow software vendor ServiceNow announced a definitive
              agreement to acquire Armis, establishing an exit valuation benchmark for the exposure management category
              [CO002, CO012].
