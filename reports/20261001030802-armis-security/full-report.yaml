      - number: '2.3'
        title: Buyer Personas, Procurement Workflows, and Adoption Friction
        blocks:
          - type: paragraph
            body: >
              Procurement dynamics for cyber exposure management involve complex cross-functional buying centers
              spanning Chief Information Security Officers (CISOs), Vice Presidents of Infrastructure, Plant Operations
              Directors, and Clinical Engineering Leads. In enterprise IT environments, budget ownership resides firmly
              with the CISO or Security Operations Center (SOC) director, where procurement is initiated to eliminate
              asset inventory blind spots and satisfy regulatory audit mandates. In contrast, operational technology
              (OT) and industrial manufacturing environments introduce operational friction: Plant Managers and Chief
              Operating Officers maintain primary authority over factory floor uptime and traditionally resist software
              deployments that touch operational networks due to fears of production line stoppages. Similarly,
              healthcare organizations divide authority between IT security teams and Biomedical Engineering departments
              responsible for patient-connected IoMT devices.


              Adoption trajectories typically proceed through three sequential phases: initial frictionless
              proof-of-concept deployments via passive network monitoring and API connectors, organization-wide asset
              inventory reconciliation against CMDB records, and final integration with automated security
              orchestration, automation, and response (SOAR) or ticketing workflows. Despite rapid sales acceleration,
              significant constraints impede deployment velocities. Enterprise security buyers face organizational
              friction between IT and OT teams regarding budget attribution, high switching costs associated with
              replacing entrenched network management appliances, and technical friction around ingesting multi-vendor
              telemetry across complex hybrid architectures. Furthermore, buyers must evaluate platform resilience
              against software supply chain attacks and firmware vulnerabilities, requiring vendors to maintain rigorous
              third-party trust certifications and transparent vulnerability disclosures across all appliance hardware.
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM008
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM008
              - CM010
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Shift from Passive Visibility to Workflow Orchestration
            body: >-
              Standalone device visibility is no longer treated as a self-contained product category. ServiceNow's $7.75
              billion acquisition demonstrates that enterprise buyers demand automated remediation workflows that link
              real-time asset discovery with configuration databases and automated incident ticketing.
            calloutType: insight
            claimRefs:
              - CM002
              - CM006
              - CM011
          - type: callout
            title: Organizational Friction Between IT and OT Procurement
            body: >-
              While CISOs increasingly control top-level cybersecurity budgets, plant operations and biomedical
              engineering executives retain de facto veto power over technology deployments that touch production
              equipment or clinical networks, extending sales cycles and slowing deployment velocity.
            calloutType: risk
            claimRefs:
