      - number: '1.2'
        title: Leadership Structure, Strategic Expansion, and Operational Governance
        blocks:
          - type: paragraph
            body: >-
              Armis is led by co-founders Yevgeny Dibrov and Nadir Izrael, whose long-standing technical and commercial
              partnership forms the core governance axis of the enterprise [CO002]. Operating with an engineering and
              corporate workforce exceeding 750 to 900 employees globally, the organization has supplemented organic
              growth with targeted technology acquisitions, notably absorbing vulnerability prioritization vendor Silk
              and critical infrastructure specialist OTORIO [CO002, CO006]. The technical architecture relies on
              large-scale distributed data processing pipelines using cloud data services such as Amazon Web Services
              (AWS ECS, S3, SQS) and distributed frameworks to analyze high-volume telemetry collected from distributed
              enterprise networks [CO007]. Operational governance centers on maintaining rigorous compliance and
              incident preparedness across customer environments, aligning platform telemetry with industry frameworks
              such as CIS Control 17 and enterprise incident response controls [CO008]. However, the organization faces
              key-person dependence on its founding executive pair, and technical integration requirements across
              acquired product suites introduce operational friction as Armis aligns with ServiceNow's enterprise
              platform governance following the announced acquisition transaction [CO002, CO009].
