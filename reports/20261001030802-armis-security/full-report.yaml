      - number: '7.4'
        title: Financial opacity shifts the decision toward monitored diligence
        blocks:
          - type: paragraph
            body: >-
              Independent secondary sources document a November 2025 $435 million financing at a valuation above $6.1
              billion and an earlier 2024 valuation of $4.3 billion, but funding raised is not cash available and
              valuation is not operating performance. The pool does not provide gross margin, accounting profit or loss,
              cash flow, burn, runway, retention, customer concentration, or post-close segment economics. The
              investment implication is not a precise downside estimate; it is a set of proof thresholds. Thesis-break
              signals include material deterioration in detection quality or service availability, forced customer
              migrations without equivalent controls, loss of critical adapters, undisclosed regulatory action, or
              failure to produce auditable retention and unit-economics data during diligence.
            claimRefs:
