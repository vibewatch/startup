  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Architecture and Data Ingestion Pipeline
        blocks:
          - type: paragraph
            body: >-
              Armis operates an agentless cyber exposure management architecture engineered to provide continuous,
              real-time asset visibility and behavioral monitoring across enterprise infrastructure, operational
              technology (OT), industrial control systems (ICS), the Internet of Medical Things (IoMT), and unmanaged
              IoT devices. Unlike traditional endpoint detection and response platforms that require invasive software
              agents or active network scanners that risk disrupting sensitive clinical instrumentation and legacy
              manufacturing equipment, Armis deploys a combination of physical hardware appliances and virtual collector
              instances connected directly to core network switches. These collectors passively ingest mirrored traffic
              via Switch Port Analyzer (SPAN) ports, analyzing raw packet streams without transmitting active probes
              into production environments. Collected metadata and extracted network events are transmitted to the
              cloud-hosted Armis Collective Asset Intelligence Engine, which correlates real-time device behaviors
              against an accumulated knowledge base tracking billions of connected assets. Operational telemetry is
              retained in the cloud platform for a rolling 90-day window to facilitate longitudinal behavior analysis
              and incident forensics, while discovered asset inventory records persist indefinitely to ensure
              uninterrupted posture governance. The backend SaaS architecture is built natively on Amazon Web Services
              (AWS) utilizing Kubernetes orchestration, Linux runtime environments, and Terraform infrastructure-as-code
              automation to support multi-site enterprise scale.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE011
              - CE013
          - type: table
