      - number: '6.3'
        title: Named Customer Proof & Production Deployments
        blocks:
          - type: paragraph
            body: >-
              Armis demonstrates validated enterprise adoption across Fortune 500 conglomerates, multinational
              industrial manufacturers, healthcare providers, and high-volume logistics networks. Public customer
              deployments include United Airlines, Colgate-Palmolive, Mondelēz International, DocuSign, Allegro
              MicroSystems, and Takeda Pharmaceuticals. In industrial and manufacturing settings, customers leverage
              Armis Centrix alongside deep operational technology integrations—such as Fortinet FortiGate firewalls and
              Cisco infrastructure—to detect behavioral anomalies without interrupting live production lines. In
              healthcare and public sector environments, organizations such as the Los Angeles County Department of
              Health Services deploy Armis to inventory IoMT medical devices and enforce real-time zero-trust
              segmentation. Production case studies highlight rapid time-to-value, with organizations uncovering
              multi-year audit backlogs and achieving comprehensive network visibility within weeks of sensor
              deployment.
            claimRefs:
