      - number: '5.2'
        title: Armis Centrix Platform Modules and Asset Intelligence
        blocks:
          - type: paragraph
            body: >-
              The flagship Armis Centrix Cyber Exposure Management Platform aggregates distributed device telemetry into
              modular security and operational capabilities tailored for enterprise risk teams. At the foundation of the
              platform lies the Armis AI-driven Asset Intelligence Engine, which ingests anomalous traffic signatures
              and configuration attributes from network collectors and matches them against known device fingerprints,
              vendor hardware profiles, and historical behavioral baselines. Users navigate the resulting enterprise
              asset inventory through the Armis Standard Query (ASQ) interface, a visual administrative console that
              allows security analysts to construct granular filters, isolate unmanaged device cohorts, and inspect
              communication pathways without requiring complex query syntax. To address the specialized operational and
              cybersecurity needs of heavy industrial infrastructure, Armis expanded its core exposure management suite
              through the strategic acquisition of OTORIO in March 2025. This addition bolstered Centrix with dedicated
              industrial control system risk modeling, operational process visibility, and automated vulnerability
              management designed specifically for manufacturing facilities, energy grids, and critical utility networks
              that operate under strict zero-downtime constraints.
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
