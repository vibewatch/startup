companyProfile:
  summary: >-
    Armis Security is a cyber exposure management platform founded in 2015 by Yevgeny Dibrov, Nadir Izrael, and Tomer
    Schwartz. Its agentless platform discovers and classifies managed and unmanaged assets across IT, OT, IoT, and IoMT
    environments, then prioritizes exposures and routes them into remediation workflows. The company scaled to roughly
    950 employees and more than $340 million in ARR before ServiceNow acquired it for $7.75 billion in cash in April
    2026.
  foundedDate: '2015-10-01'
  founders:
    - name: Yevgeny Dibrov
      role: Co-Founder & CEO
      background: Israeli entrepreneur; previously served in the IDF's 8200 intelligence unit; co-founded Armis in 2015.
    - name: Nadir Izrael
      role: Co-Founder & CTO
      background: Co-founded Armis with Dibrov and leads the product and technical architecture.
    - name: Tomer Schwartz
      role: Co-Founder
      background: Third co-founder with cybersecurity engineering and intelligence background.
  foundingLocation: Tel Aviv, Israel
  headquarters: San Francisco, CA (global HQ); Tel Aviv, Israel (R&D center)
  productSummary: >-
    Armis Centrix is a cloud-native cyber exposure management platform with asset intelligence, vulnerability
    management, threat detection, and integrations for IT, OT, IoT, and IoMT environments.
  customerFocus: >-
    Large enterprises and critical infrastructure operators across healthcare, manufacturing, financial services,
    government, and energy/utilities.
  businessModel: >-
    B2B SaaS sold through annual and multi-year subscription contracts, with pricing typically tied to asset scale and
    deployment scope.
  stage: Acquired (by ServiceNow, April 2026)
  fundingStatus: >-
