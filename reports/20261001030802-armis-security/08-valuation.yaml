company:
  name: "Armis Security"
chapter:
  number: 8
  title: "Valuation"
  summary: "Armis reached a definitive $7.75 billion all-cash acquisition agreement with ServiceNow in December 2025, culminating a financing trajectory that scaled from an early $1.1 billion venture buyout by Insight Partners in 2020 through a $4.2B Series D in 2024 and a $435M pre-IPO growth round at $6.1B+ led by Goldman Sachs Alternatives in late 2025. At an implied multiple of roughly 22.8x ARR against $340M+ in recurring revenue, the transaction reflects a fair to full strategic premium underpinned by ServiceNow's enterprise platform workflows, leading to a track recommendation as standalone public equity underwriting is superseded by merger execution and technical integration."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment Thesis, Stance, and Recommendation Framework"
    body: "The core investment thesis for Armis Security rests on its proven category leadership in cyber exposure management and agentless device intelligence. Across enterprise IT, operational technology (OT), medical equipment (IoMT), and industrial control systems, unmanaged endpoints represent an expanding attack surface that legacy endpoint detection and response (EDR) agents cannot directly protect. By deploying passive network monitoring and an asset knowledgebase tracking over 3 billion device profiles, Armis achieved critical scale with over 35% of the Fortune 100 as enterprise customers, growing annual recurring revenue to over $340 million at a 50%+ year-over-year rate. Conversely, the anti-thesis centers on extreme valuation multiples, unverified gross margin economics, and significant integration friction. With ServiceNow agreeing to acquire Armis for $7.75 billion in cash, the standalone venture upside is capped and converted into enterprise execution risk within ServiceNow's broader IT service and security workflow portfolio. We assign an overall recommendation of track with medium confidence, a medium risk rating, and a fair valuation stance, reflecting that the transaction price accurately captures strategic workflow synergies while leaving unresolved private financial questions regarding net retention and gross margin resilience."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV011"
      - "CV012"
    tableRefs:
      - "TV001"
      - "TV002"
  - id: "financing-history-and-valuation-discipline"
    title: "Capital Formation, Historical Rounds, and Acquisition Discipline"
    body: "Armis demonstrated an unusual financing trajectory marked by two separate controlling or strategic acquisition milestones alongside growth equity syndicates. Following its founding in late 2015 by Yevgeny Dibrov and Nadir Izrael, the company raised $116 million across early rounds before Insight Partners acquired the business in January 2020 at a $1.1 billion valuation, with CapitalG contributing $100 million. Rather than folding into a private equity holding vehicle, Armis retained independent management and continued raising institutional growth equity, completing a $300 million round led by One Equity Partners at $3.4 billion in 2021 and a $200 million Series D led by Alkeon Capital and General Catalyst at $4.2 billion in October 2024. In November 2025, Armis secured a $435 million pre-IPO financing led by Goldman Sachs Alternatives valuing the company at over $6.1 billion, before ServiceNow entered into a definitive $7.75 billion cash acquisition agreement in December 2025. Lifetime equity and private financing reached $1.17 billion across nine rounds, demonstrating strong institutional sponsorship while capping venture liquidation preference overhang through an all-cash exit."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
    tableRefs:
      - "TV003"
    figureRefs:
      - "FV001"
  - id: "scenarios-comps-and-diligence-asks"
    title: "Scenario Underwriting, Valuation Comps, and Thesis-Break Triggers"
    body: "Evaluating Armis under comparable cybersecurity multiples highlights the substantial strategic premium embedded in ServiceNow's acquisition price. High-growth public peers in identity and exposure management such as CrowdStrike and Palo Alto Networks have historically traded at forward revenue multiples between 14x and 22x, while specialized OT/IoT competitors like Claroty and Nozomi Networks have raised capital at private valuations of $1 billion to $2.5 billion. ServiceNow's $7.75 billion purchase price values Armis at approximately 22.8x trailing ARR, a multiple that exceeds standard industrial security benchmarks and reflects anticipated workflow cross-selling across ServiceNow's global enterprise customer base. Underwriting scenarios range from a bull case where Centrix accelerates ServiceNow's Security Operations (SecOps) revenue past $1 billion ARR, to a bear case where key engineering talent departs from Tel Aviv and OTORIO on-premises customers resist cloud migration. For continuing institutional diligence, primary verification priorities include tracking post-close key executive retention agreements, auditing joint adapter telemetry performance with Fortinet and Google Chronicle, and monitoring regulatory closing filings."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
