chapter:
  number: 3
  title: "Competitors"
  summary: "Armis competes less as a standalone point product than as an agentless asset-intelligence layer spanning IT, OT, IoT, and medical devices. Its announced combination with ServiceNow and documented integrations with network and security incumbents strengthen distribution and remediation reach, but public evidence does not establish comparative pricing, win rates, or independently benchmarked superiority."
sections:
  - id: "landscape-and-scale"
    title: "Competitive Landscape and Scale"
    body: >-
      The available evidence places Armis across several overlapping competitive arenas rather than in one clean peer set. Its platform description spans IT, operational technology, IoT, and medical devices, so buyers can compare it with specialized cyber-physical security products, vulnerability-management suites, network-security platforms, enterprise workflow incumbents, internal integration projects, or the status quo of fragmented inventories. The assigned evidence names Cisco, Palo Alto Networks, Microsoft, Tanium, Fortinet, Google, and ServiceNow as integration counterparts, but it does not provide a reliable, current list of direct specialized peers or comparable win-rate data. Scale is clearer than peer ranking: ServiceNow reported more than $340 million of Armis ARR and approximately 950 employees in its acquisition announcement, while Startup Nation Central lists $1.17 billion raised across nine rounds. Those figures indicate commercial weight, not proof that Armis outperforms alternatives.
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP007"
      - "CP008"
      - "CP009"
    tableRefs:
      - "TP001"
  - id: "capability-and-distribution"
    title: "Capability, Distribution, and Partner Power"
    body: >-
      Armis's most evidenced differentiation is architectural breadth combined with partner-enabled action. ServiceNow describes real-time, agentless discovery and classification of managed and unmanaged assets, while Armis says its passive approach requires no hardware installation, network changes, or intrusive probes. The Fortinet solution brief corroborates a complementary operating model: Armis contributes asset context and risk detection, and Fortinet infrastructure supplies segmentation and enforcement. This can lower deployment friction in fragile environments, but it also means that important remediation outcomes depend on incumbent control points. The integration catalog shows multi-homing across major ecosystems rather than exclusive distribution. That breadth can increase switching costs through accumulated inventory context and workflow configuration, yet the assigned sources do not quantify retention, implementation time, migration cost, or the share of customers using each integration.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP012"
      - "CP015"
    tableRefs:
      - "TP002"
  - id: "pricing-and-switching"
    title: "Pricing, Packaging, and Switching Economics"
    body: >-
      None of the assigned sources discloses an Armis list price, realized contract value, discount schedule, consumption unit, or directly comparable competitor quote. The defensible conclusion is therefore that pricing remains a diligence gap, not that Armis commands a particular premium. Packaging may also change as ServiceNow integrates the product: the acquisition announcement describes a future unified exposure-and-operations stack, but does not specify whether Armis remains separately sold, becomes a ServiceNow module, or is bundled with broader workflows. Internal build remains a substitute where buyers already own network telemetry, a CMDB, ticketing, and enforcement tools, although the evidence does not quantify the engineering burden. Buyers should test whether Armis reduces tool count or instead adds an intelligence layer whose value depends on maintaining several incumbent integrations.
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP015"
    tableRefs:
      - "TP003"
  - id: "moat-and-displacement"
    title: "Moat Durability and Displacement Risk"
    body: >-
      ServiceNow's proposed ownership changes the basis of competition. The announced strategy connects Armis discovery and risk prioritization to ServiceNow remediation workflows, potentially giving Armis stronger enterprise distribution and a shorter path from finding an exposure to assigning corrective action. At the same time, ServiceNow itself disclosed risks from delayed technology integration, employee retention, legacy liabilities, management distraction, and unanticipated obligations. Armis-originated hiring evidence also points toward expansion into vulnerability assessment and VMDR, increasing overlap with established security suites rather than narrowing the field. The moat thesis therefore depends on whether cross-environment asset intelligence remains differentiated after integration and whether non-ServiceNow customers continue to view the platform as neutral. No independent benchmark in the assigned pool validates comparative detection accuracy, false-positive rates, or switching outcomes.
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP014"
      - "CP016"
    figureRefs:
      - "FP001"
