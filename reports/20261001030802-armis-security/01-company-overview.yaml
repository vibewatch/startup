chapter:
  number: 1
  title: "Company Overview"
  summary: "Armis Security is a cyber exposure management and asset intelligence provider founded in December 2015 by Yevgeny Dibrov and Nadir Izrael, scaling from agentless IoT visibility to comprehensive cyber-physical systems (CPS) protection. Following rapid revenue expansion past $200M ARR and a $435M pre-IPO funding round at a $6.1B valuation in late 2025, Armis agreed to an acquisition by ServiceNow to unify cyber exposure intelligence across enterprise IT, OT, and connected asset workflows."
sections:
  - id: "identity-and-business-model"
    title: "Corporate Identity, Platform Architecture, and Business Model"
    body: "Armis Security operates as an enterprise cybersecurity provider specializing in cyber exposure management, asset intelligence, and cyber-physical systems (CPS) protection [CO001]. Founded in December 2015 by Yevgeny Dibrov (Chief Executive Officer) and Nadir Izrael (Chief Technology Officer) following their military service in the Israel Defense Forces' intelligence division Unit 81, the company maintains corporate operations in San Francisco, California, alongside research and development operations centered in Tel Aviv-Yafo, Israel [CO002]. Armis was incorporated to address a structural vulnerability in corporate networks: the proliferation of unmanaged, agentless connected devices spanning operational technology (OT), industrial control systems (ICS), Internet of Things (IoT), and Internet of Medical Things (IoMT) that cannot support traditional endpoint security agents [CO003]. The company monetizes through enterprise software subscriptions for its core platform, Armis Centrix, supplemented by specialized modules including asset vulnerability management, OT/ICS security, and prioritization intelligence [CO004]. Its architectural foundation combines out-of-band network traffic inspection with integrations across cloud providers, identity stores, and security operations platforms, anchoring device context against an engine tracking over 1 billion historical asset profiles [CO005]. As the company scaled, its strategic scope transitioned from passive network visibility to active cyber exposure management and automated remediation orchestration [CO004]."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership Structure, Strategic Expansion, and Operational Governance"
    body: "Armis is led by co-founders Yevgeny Dibrov and Nadir Izrael, whose long-standing technical and commercial partnership forms the core governance axis of the enterprise [CO002]. Operating with an engineering and corporate workforce exceeding 750 to 900 employees globally, the organization has supplemented organic growth with targeted technology acquisitions, notably absorbing vulnerability prioritization vendor Silk and critical infrastructure specialist OTORIO [CO002, CO006]. The technical architecture relies on large-scale distributed data processing pipelines using cloud data services such as Amazon Web Services (AWS ECS, S3, SQS) and distributed frameworks to analyze high-volume telemetry collected from distributed enterprise networks [CO007]. Operational governance centers on maintaining rigorous compliance and incident preparedness across customer environments, aligning platform telemetry with industry frameworks such as CIS Control 17 and enterprise incident response controls [CO008]. However, the organization faces key-person dependence on its founding executive pair, and technical integration requirements across acquired product suites introduce operational friction as Armis aligns with ServiceNow's enterprise platform governance following the announced acquisition transaction [CO002, CO009]."
    claimRefs:
      - "CO002"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-scale"
    title: "Financing History, Valuation Trajectory, and Market Milestones"
    body: "Armis followed an aggressive institutional capitalization trajectory prior to its acquisition by ServiceNow, raising a cumulative total of $1.17 billion across institutional equity rounds [CO002]. After reaching an interim private valuation of $3.4 billion in November 2021 and $4.3 billion in October 2024 via a $200 million private financing round, the company secured a $435 million pre-IPO financing round in November 2025 led by Goldman Sachs Alternatives with participation from CapitalG and Evolution Equity Partners, which priced the business at over $6.1 billion [CO006, CO010]. Top-line financial scale advanced rapidly, surpassing $200 million in annual recurring revenue by late 2024 with public targets targeting $500 million in ARR by 2026 [CO006]. The commercial footprint expanded across Fortune 500 enterprises, securing major logos including Colgate-Palmolive, United Airlines, and Mondelēz International, alongside formal recognition by Gartner as a Leader in CPS Protection Platforms for two consecutive years through 2026 [CO006, CO011]. In late 2025, enterprise workflow software vendor ServiceNow announced a definitive agreement to acquire Armis, establishing an exit valuation benchmark for the exposure management category [CO002, CO012]."
    claimRefs:
      - "CO002"
      - "CO006"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
