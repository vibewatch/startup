    rows:
      - - Cyber-Physical Systems (CPS) Security
        - Passive OT/ICS protocol inspection, asset discovery, firmware vulnerability tracking, industrial threat detection.
        - Physical perimeter security, hardware firewalls, SCADA control system hardware, plant automation equipment.
        - VP of OT Security / VP Manufacturing
        - Core addressable market protecting unmanaged factory floor PLCs, HMIs, and critical physical infrastructure.
      - - Medical Device Security (IoMT)
        - Connected medical asset discovery, clinical risk scoring, FDA recall tracking, VLAN healthcare segmentation.
        - Electronic health record (EHR) software, physical medical diagnostic hardware, biomedical maintenance.
        - Chief Information Security Officer / Clinical Engineering Lead
        - High-growth vertical driven by patient safety compliance, hospital ransomware defense, and clinical asset tracking.
      - - Cyber Asset Attack Surface Management (CAASM)
        - Multi-source API telemetry aggregation, cloud asset inventory, shadow IT identification, unmanaged device discovery.
        - Endpoint detection and response (EDR) agent licensing, traditional vulnerability scanning tools, mobile device management (MDM).
        - CISO / Head of Security Operations
        - Foundational IT security category eliminating blind spots across managed laptops, rogue devices, and cloud workloads.
      - - Vulnerability Prioritization and Remediation (VIPR)
        - Threat intelligence enrichment, risk-based vulnerability prioritization, exposure lifecycle tracking, patch orchestration.
        - Core patch management deployment tools, manual penetration testing consulting, software development code scanning.
        - Vulnerability Management Lead / SOC Director
        - Strategic software layer directing operational remediation resources toward highest-probability exploit vectors.
    notes: Segment boundaries delineate specialized software asset exposure licensing from traditional hardware infrastructure and agent-based endpoint tools.
