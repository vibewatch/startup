chapter:
  number: 2
  title: Market Analysis
  summary: Armis operates at the convergence of Cyber Exposure Management (CEM) and Cyber-Physical Systems (CPS) protection, addressing unmanaged IT, OT, IoT, and IoMT attack surfaces across critical infrastructure. As worldwide information security spending expands toward $240 billion, enterprise demand has transitioned from passive device visibility to unified exposure prioritization, culminating in ServiceNow's $7.75 billion acquisition agreement to bind asset telemetry into automated ITSM remediation workflows.
sections:
  - id: market-boundary-and-scope
    title: Market Boundary, Scope, and Structural Convergence
    body: >
      The market for enterprise cyber asset security has undergone structural redefinition, expanding from isolated network visibility tools into comprehensive Cyber Exposure Management (CEM) and Cyber-Physical Systems (CPS) protection platforms. Historically, enterprise vulnerability scanners and Endpoint Detection and Response (EDR) agents secured managed corporate IT environments comprising workstations and servers. However, industrial control systems, medical technology, and connected building infrastructure cannot accommodate intrusive software agents without risking catastrophic physical disruption or operational downtime. Armis estimates that approximately 90% of devices in industrial and critical infrastructure networks remain unmanaged, operating without standard host monitoring agents. The addressable domain encompasses connected devices across enterprise IT, operational technology (OT) including programmable logic controllers (PLCs) and human-machine interfaces (HMIs), medical Internet of Things (IoMT) diagnostic systems, and commercial Internet of Things (IoT).


      Spend within this category is captured by specialized asset intelligence platforms capable of passive, out-of-band network traffic inspection, wireless airspace analysis, and multi-source API telemetry ingestion. The scope explicitly excludes traditional endpoint agent licensing, standard vulnerability management scanning suites that rely on intrusive probing, and dedicated physical perimeter access control hardware. Status-quo substitutes have historically relied on manual spreadsheets, basic Network Access Control (NAC) authentication databases, passive network tap sniffers, and legacy configuration management databases (CMDBs). These legacy approaches fail because NAC solutions verify initial network admission without continuous behavioral inspection, while manual CMDBs rapidly decay into stale repositories. By establishing passive discovery and behavioral context across IT, OT, and IoT, the sector transforms asset visibility from an audit inventory checklist into an active threat-prevention and exposure-prioritization layer.
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM006
      - CM008
      - CM010
    tableRefs:
      - TM001
    figureRefs:
      - FM001
  - id: market-sizing-and-growth-drivers
    title: Sizing Slices, Growth Vectors, and Sizing Discrepancies
    body: >
      Evaluating the total market opportunity requires analyzing concentric addressable boundaries rather than relying on a single top-down macroeconomic figure. At the broadest macroeconomic layer, worldwide end-user spending on information security is projected by Gartner to expand by 12.5% in 2026 to reach $240 billion, propelled by escalating threat volumes and enterprise-wide artificial intelligence adoption. Within this comprehensive budget, enterprise cybersecurity asset management and cyber-physical security form a critical high-growth subsector. Independent forecasts from industry trackers indicate that global IoT connections expanded from 10.3 billion in 2018 to nearly 25 billion by 2025, with smart manufacturing emerging as the fastest-accelerating operational segment. As enterprise networks absorb billions of connected endpoints, cyber exposure management shifts from an optional discretionary tool to mandatory foundational infrastructure.


      Market expansion is accelerated by three primary tailwinds: the total dissolution of historical IT/OT air gaps, escalating nation-state ransomware targeting physical infrastructure, and compliance requirements under frameworks like CIS Control 1 (inventory and control of enterprise assets) and CIS Control 2 (software asset management). Concurrently, commercial traction has generated significant corporate valuation inflection points. Armis achieved an annualized recurring revenue (ARR) run rate exceeding $200 million by late 2024, doubled ARR over an 18-month trajectory, and surpassed $340 million in ARR prior to its definitive acquisition agreement with ServiceNow for $7.75 billion in cash. ServiceNow indicated that incorporating Armis is projected to more than triple ServiceNow's total addressable market opportunity for security and risk solutions. Nevertheless, substantive sizing discrepancies persist across independent research providers: market trackers disagree significantly on standalone CPS market boundaries, frequently conflating software asset visibility licensing with broader network firewall appliances, IT service management suites, and outsourced managed security operations.
    claimRefs:
      - CM002
      - CM003
      - CM005
      - CM007
      - CM009
      - CM011
      - CM012
