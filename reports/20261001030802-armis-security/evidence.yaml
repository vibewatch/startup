evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: executive-retention-and-integration-governance
    missingEvidence: >-
      Formal executive retention agreements, lock-up duration, and board integration charter between Armis founders and
      ServiceNow.
    whyItMatters: >-
      Long-term platform continuity, OTORIO integration completion, and Centrix product roadmap execution rely heavily
      on founder commitment post-closing.
    diligencePath: >-
      Inspect ServiceNow definitive merger filings (Form 8-K / proxy disclosures) or obtain direct executive retention
      agreements.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: audited-financial-metrics
    missingEvidence: >-
      Audited SaaS Net Revenue Retention (NRR), Gross Retention Rate (GRR), gross margin percentage, and GAAP operating
      cash flow.
    whyItMatters: >-
      Essential for confirming organic growth sustainability, enterprise expansion efficiency, and margin structure
      underlying the $6.1B+ valuation.
    diligencePath: >-
      Review pre-IPO confidential disclosure memorandum or post-close financial consolidation reporting in ServiceNow
      SEC disclosures.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: standalone-cps-market-sizing
    missingEvidence: >-
      Independent, audited standalone market share breakdown and dollar sizing isolating pure-play Cyber-Physical
      Systems (CPS) protection spend from aggregate $240B IT security spending.
    whyItMatters: >-
      Sizing models currently rely on top-down macroeconomic figures or vendor ARR metrics, obscuring true standalone
      TAM saturation.
    diligencePath: >-
      Cross-reference upcoming analyst market guides (Gartner, IDC) and SEC post-close disclosures from ServiceNow
      breaking out acquired Armis segment revenue.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - id: gap-ot-pilot-conversion
    type: private-evidence-only
    severity: minor
    topic: ot-pilot-conversion-rates
    missingEvidence: >-
      Empirical pilot-to-contract conversion timelines and win-rates across operational technology plant environments vs
      enterprise IT environments.
    whyItMatters: >-
      Operational friction between IT and plant operations leads to extended enterprise sales cycles that impact revenue
      predictability.
    diligencePath: Review historical customer cohort acquisition data and sales pipeline stage metrics during investor diligence.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-comparison
    missingEvidence: >-
      Comparable Armis and competitor quotes showing units, contract length, discounting, services, and realized annual
      contract value.
    whyItMatters: >-
      Without normalized commercial terms, relative price, bundling advantage, and total switching economics cannot be
      underwritten.
    diligencePath: >-
      Request anonymized recent proposals for matched asset counts and environments, then normalize license,
      implementation, and support costs.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: direct-peer-benchmark
    missingEvidence: >-
      A current named peer set with independently tested detection coverage, accuracy, deployment effort, and customer
      win-loss outcomes.
    whyItMatters: >-
      The assigned evidence supports competitive classes and integrations but not a defensible ranking of direct
      specialized competitors.
    diligencePath: >-
      Commission matched proof-of-concept testing and review recent buyer shortlists, losses, replacements, and renewal
      decisions.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: retention-and-unit-economics
    missingEvidence: >-
      Audited cohort Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and customer churn percentages across
      enterprise segments.
    whyItMatters: >-
      NRR is essential to underwrite organic expansion durability, multi-year customer lifetime value, and true ARR
      compounding efficiency.
    diligencePath: >-
      Request confidential historical SaaS cohort retention waterfall schedules and gross renewal data from transaction
      data rooms.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cost-structure-and-margins
    missingEvidence: >-
      Audited GAAP gross margin percentages, AWS cloud telemetry hosting expenditures, and customer support service
      costs.
    whyItMatters: >-
      High cloud data processing costs from continuous multi-billion asset intelligence analysis could depress gross
      margins below standard software thresholds.
    diligencePath: >-
      Inspect audited income statements and cloud hosting bills to determine true software gross margins versus managed
      appliance costs.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: ot-architecture-and-multi-tenancy
    missingEvidence: >-
      Technical documentation and independent architectural benchmarks verifying multi-tenant tenant isolation for MSSP
      workbench deployments and deep proprietary OT protocol decoding coverage prior to the OTORIO integration.
    whyItMatters: >-
      Without architectural verification of multi-tenant data isolation and native protocol decoding limits for legacy
      PLCs, enterprise buyers in critical infrastructure face uncertain deployment complexity and potential data
      co-mingling risks.
    diligencePath: >-
      Request SOC 2 Type II reports detailing multi-tenant data segmentation, review OT protocol support matrices for
      proprietary vendor PLCs, and audit OTORIO on-premises integration milestones.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: customer-retention-rates
