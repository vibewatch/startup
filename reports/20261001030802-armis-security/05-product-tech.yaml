chapter:
  number: 5
  title: "Product & Technology"
  summary: "Armis delivers an agentless cyber exposure management platform that monitors IT, OT, IoT, and medical devices via passive network collectors and a cloud-based intelligence engine analyzing over 3 billion assets. The platform combines deep passive protocol inspection with broad third-party enforcement integrations, though multi-tenant MSSP maturity and legacy proprietary OT protocol decoding remain ongoing diligence areas following its 2025 acquisition of OTORIO."
sections:
  - id: "sec-core-architecture"
    title: "Core Architecture and Data Ingestion Pipeline"
    body: "Armis operates an agentless cyber exposure management architecture engineered to provide continuous, real-time asset visibility and behavioral monitoring across enterprise infrastructure, operational technology (OT), industrial control systems (ICS), the Internet of Medical Things (IoMT), and unmanaged IoT devices. Unlike traditional endpoint detection and response platforms that require invasive software agents or active network scanners that risk disrupting sensitive clinical instrumentation and legacy manufacturing equipment, Armis deploys a combination of physical hardware appliances and virtual collector instances connected directly to core network switches. These collectors passively ingest mirrored traffic via Switch Port Analyzer (SPAN) ports, analyzing raw packet streams without transmitting active probes into production environments. Collected metadata and extracted network events are transmitted to the cloud-hosted Armis Collective Asset Intelligence Engine, which correlates real-time device behaviors against an accumulated knowledge base tracking billions of connected assets. Operational telemetry is retained in the cloud platform for a rolling 90-day window to facilitate longitudinal behavior analysis and incident forensics, while discovered asset inventory records persist indefinitely to ensure uninterrupted posture governance. The backend SaaS architecture is built natively on Amazon Web Services (AWS) utilizing Kubernetes orchestration, Linux runtime environments, and Terraform infrastructure-as-code automation to support multi-site enterprise scale."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE011"
      - "CE013"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "sec-centrix-modules"
    title: "Armis Centrix Platform Modules and Asset Intelligence"
    body: "The flagship Armis Centrix Cyber Exposure Management Platform aggregates distributed device telemetry into modular security and operational capabilities tailored for enterprise risk teams. At the foundation of the platform lies the Armis AI-driven Asset Intelligence Engine, which ingests anomalous traffic signatures and configuration attributes from network collectors and matches them against known device fingerprints, vendor hardware profiles, and historical behavioral baselines. Users navigate the resulting enterprise asset inventory through the Armis Standard Query (ASQ) interface, a visual administrative console that allows security analysts to construct granular filters, isolate unmanaged device cohorts, and inspect communication pathways without requiring complex query syntax. To address the specialized operational and cybersecurity needs of heavy industrial infrastructure, Armis expanded its core exposure management suite through the strategic acquisition of OTORIO in March 2025. This addition bolstered Centrix with dedicated industrial control system risk modeling, operational process visibility, and automated vulnerability management designed specifically for manufacturing facilities, energy grids, and critical utility networks that operate under strict zero-downtime constraints."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE006"
      - "CE012"
    tableRefs:
      - "TE001"
  - id: "sec-integrations-enforcement"
    title: "Ecosystem Integrations and Automated Enforcement"
    body: "Because Armis operates without native endpoint agents, automated threat containment and policy enforcement rely heavily on bi-directional integrations across the broader cybersecurity and enterprise IT ecosystem. The platform provides pre-built adapters and API connectors to leading infrastructure providers, including next-generation firewalls, SIEM platforms, and enterprise service management systems. Through its integration with Fortinet FortiGate appliances and FortiManager, Armis dynamically pushes risk context and updated security policies to network firewalls, allowing security teams to enforce quarantine controls, restrict access to sensitive subnets, or apply elevated intrusion detection policies to compromised endpoints in real time. For telemetry correlation and threat hunting, Armis integrates with Google Chronicle to parse and transform asset alerts, activity records, and vulnerability findings into standardized Unified Data Model (UDM) events. Furthermore, in May 2026, ServiceNow announced Autonomous Security and Risk, embedding Armis real-time device intelligence directly into the ServiceNow CMDB and incident response workflows to govern connected assets and AI agents at machine speed. For service provider partners, Armis expanded the APEX Manage Program with a dedicated multi-tenant workbench to streamline client lifecycle administration."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "sec-vertical-use-cases-risks"
    title: "Vertical Capabilities, OT Protocol Depth, and Technical Risks"
    body: "Armis tailors its passive analysis capabilities to distinct industry verticals where endpoint software cannot be deployed, specifically healthcare clinical environments and operational technology networks. In hospital settings, Armis ingests Manufacturer Disclosure Statement for Medical Device Security (MDS2) files from medical equipment manufacturers and correlates active firmware configurations against published FDA device recall databases, enabling clinical engineering teams to identify vulnerable infusion pumps and diagnostic scanners without interrupting patient care. In manufacturing and industrial automation networks, the platform capitalizes on the prevalence of unencrypted legacy industrial protocols to inspect packet payloads directly, monitoring write commands dispatched to Programmable Logic Controllers (PLCs) to detect unauthorized configuration changes or lateral threat movement. However, deep on-premises OT inspection across proprietary industrial protocols and isolated air-gapped segments presents ongoing diligence questions. While passive SPAN monitoring surfaces anomalous communications, decoding vendor-proprietary PLC control code historically required specialized on-site industrial appliances, which precipitated the acquisition of OTORIO to bridge operational technology coverage gaps."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE014"
