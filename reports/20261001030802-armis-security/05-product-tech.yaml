figures:
  - id: "FE001"
    title: "Armis Centrix Four-Tier Operating Architecture"
    type: "stack"
    summary: "Multi-tier functional stack illustrating data flow from physical and virtual network capture to cloud intelligence and third-party enforcement."
    data:
      layers:
        - label: "Layer 1: Edge Data Ingestion & Passive Capture"
          detail: "Physical hardware appliances and virtual collector instances deployed on core network switches, capturing traffic passively via SPAN or mirror ports without endpoint software."
        - label: "Layer 2: Local Traffic Parsing & Protocol Inspection"
          detail: "Deep packet analysis of raw telemetry, MAC addresses, communication flows, and unencrypted industrial protocol commands dispatched to PLCs and connected devices."
        - label: "Layer 3: Collective Asset Intelligence Cloud Engine"
          detail: "Centralized AWS-hosted knowledge base matching observed device configurations against behavioral profiles derived from over 3 billion tracked enterprise devices."
        - label: "Layer 4: Threat Detection & Risk Scoring Engine"
          detail: "Continuous correlation of device telemetry with CVE databases, FDA medical recalls, threat intelligence feeds, and anomalous communication deviations."
        - label: "Layer 5: Unified Exposure Management & Query Console"
          detail: "Administrative interface powered by Armis Standard Query (ASQ), offering point-and-click visualization, custom policy creation, and asset inventory reporting."
        - label: "Layer 6: Ecosystem Integration & Enforcement APIs"
          detail: "Bi-directional REST connectors to Fortinet firewalls, Google Chronicle SIEM, and ServiceNow CMDB for automated threat containment and incident response."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE007"
      - "CE008"
      - "CE009"
callouts:
  - calloutType: "insight"
    title: "Agentless Architecture Unlocks Comprehensive Unmanaged Device Visibility"
    body: "By capturing and analyzing mirrored network traffic at switch SPAN ports rather than deploying endpoint agents, Armis bypasses the technical impossibility of installing software on medical pumps, legacy PLCs, and smart building sensors. This passive ingestion eliminates operational disruptions while surfacing unmanaged devices that evade traditional endpoint security agents."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
  - calloutType: "risk"
    title: "Deep Proprietary Industrial Protocol Coverage Requires Architectural Bridging"
    body: "While passive packet inspection effectively decodes standard unencrypted industrial communications, complex proprietary OT protocols and segmented air-gapped networks limit pure cloud-based passive sensors. The March 2025 acquisition of OTORIO indicates that Armis required external specialized engineering to deepen on-premises industrial control systems protection."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE014"
