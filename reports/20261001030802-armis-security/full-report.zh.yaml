  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范畴界定与结构性收敛
        blocks:
          - type: paragraph
            body: >
              企业网络资产安全赛道经历结构性重塑，已从孤立的网络可见性工具演进为一体化网络风险暴露管理（CEM）与信息物理系统（CPS）保护平台。传统上，企业漏洞扫描器与终端检测响应（EDR）Agent用于防护工作站及服务器等受控IT环境。然而，工业控制系统、医疗设备以及联网楼宇基础设施无法部署侵入式软件Agent，否则极易引发灾难性物理故障或产线停摆。据Armis测算，工业与关键基础设施网络中约90%的设备处于非受控状态，脱离了标准主机监控Agent的防护。目标市场涵盖企业IT、包含可编程逻辑控制器（PLC）与人机界面（HMI）的运营技术（OT）、医疗物联网（IoMT）诊断设备及商业物联网（IoT）的所有联网终端。


              该领域的 IT 预算正被专精型资产情报平台吸收。此类平台具备带外被动流量检测、无线空域分析及多源 API
              遥测摄取能力；其范围不包括传统终端代理授权、依赖侵入探测的常规漏洞扫描套件以及专用物理周边门禁硬件。传统替代方案向来依赖手工表格、基础网络准入控制（NAC）认证数据库、被动分流抓包嗅探器以及陈旧的配置管理数据库（CMDB）。这些方式各有硬伤：NAC
              只在设备接入瞬间完成鉴权，无法持续监测行为；手工 CMDB 则很快退化为过时信息库。IT、OT 与 IoT
              全域有了被动发现和行为上下文后，资产可见性才不再只是静态审计清单，而成为主动威胁防御和暴露风险排序的底座。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
              - CM008
              - CM010
