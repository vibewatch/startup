  - number: 8
    title: 估值分析
    sections:
      - number: '8.1'
        title: 投资逻辑、研判立场与建议框架
        blocks:
          - type: paragraph
            body: >-
              Armis
              Security的核心投资逻辑立足于其在网络暴露面管理与无代理设备资产情报领域的标杆地位。纵观企业IT、操作技术（OT）、医疗设备（IoMT）及工业控制系统，未托管终端构成持续扩大的攻击面，传统终端检测与响应（EDR）代理无法直接防护。Armis依托无源网络监控及覆盖超30亿设备画像的知识库构筑规模壁垒，赢得超35%
              Fortune
              100企业客户，年经常性收入（ARR）以50%+的同比增速突破$340M。反方逻辑则直指偏高估值倍数、未经验证的毛利率模型以及潜在整合摩擦。ServiceNow宣布以$7.75B现金收购Armis后，独立VC成长溢价封顶，转向考验ServiceNow
              IT服务与安全工作流体系的整合执行力。本报告给予中等置信度“跟踪观察”建议、中等风险评级与估值合理判断：收购价充分计入工作流战略协同溢价，但净留存率及毛利率韧性等未披露财务细节仍待交叉印证。
