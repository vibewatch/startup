  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心架构与数据摄取流水线
        blocks:
          - type: paragraph
            body: >-
              Armis打造了无Agent网络风险暴露管理架构，面向企业基础设施、运营技术（OT）、工业控制系统（ICS）、医疗物联网（IoMT）及非受控IoT设备，提供持续、实时的资产可见性与行为监控。与要求安装侵入式Agent的传统EDR平台，或可能干扰敏感临床仪器与老旧制造设备的主动网络扫描器不同，Armis采用物理硬件设备结合虚拟采集实例的混合部署模式，直连核心网络交换机。采集器通过交换机端口镜像（SPAN）被动旁路镜像流量，直接分析原始数据包流，无需向生产网络注入主动探针。采集的元数据与提取的网络事件汇聚至云端Armis集体资产智能引擎（Collective
              Asset Intelligence
              Engine），将实时设备行为与追踪数十亿联网资产的庞大知识库交叉比对。云平台将运营遥测数据保存90天滑动窗口以支撑纵向行为分析与安全取证，发现的资产台账记录则持久化存储，保障安全态势治理不间断。后端SaaS架构原生构建于AWS之上，采用Kubernetes容器编排、Linux运行环境及Terraform基础设施即代码自动化，支撑多园区企业级弹性扩容。
