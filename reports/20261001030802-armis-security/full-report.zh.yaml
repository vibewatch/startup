      - number: '5.4'
        title: 垂直行业方案、OT协议深度与技术隐患
        blocks:
          - type: paragraph
            body: >-
              Armis针对无法安装终端软件的特定垂直行业定制被动解析能力，重点深耕医疗临床与工业运营网络。在医院场景下，Armis摄取医疗设备制造商的安全披露声明（MDS2）文件，将实时固件配置与FDA召回数据库动态比对，协助临床工程团队在零干扰患者诊疗的前提下排查易受攻击的输液泵与影像诊断设备。在制造与工业自动化场景中，平台利用老旧工业协议明文传输的特征深度解析数据包载荷，实时监控下发给可编程逻辑控制器（PLC）的写指令，精准识别未授权配置篡改或潜在横向移动威胁。然而，针对专有工业协议及物理隔离网段的深度本地OT检测仍是关键尽调考量点。尽管被动SPAN镜像能捕捉异常通信，解析厂商私有PLC控制代码历来依赖专用本地工业设备，这也是促成公司收购OTORIO以补齐OT覆盖盲区的核心技术动因。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE014
