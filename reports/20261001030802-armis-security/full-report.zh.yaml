      - number: '1.3'
        title: 融资历史、估值轨迹与市场里程碑
        blocks:
          - type: paragraph
            body: >-
              被ServiceNow收购前，Armis展现了激进的机构资本扩张节奏，多轮机构股权融资累计吸纳$1.17 billion[CO002]。在2021年11月取得$3.4
              billion估值、2024年10月完成$200 million融资达$4.3 billion估值后，公司于2025年11月完成由Goldman Sachs
              Alternatives领投、CapitalG与Evolution Equity Partners参投的$435 million Pre-IPO轮融资，投后估值突破$6.1 billion[CO006,
              CO010]。顶线收入规模快速攀升，2024年底ARR突破$200 million，并公开立下2026年达成$500 million
              ARR的目标[CO006]。商业版图纵深挺进财富500强，斩获高露洁-棕榄（Colgate-Palmolive）、联合航空（United Airlines）与亿滋国际（Mondelēz
              International）等核心标杆，且截至2026年连续两年获Gartner评为CPS保护平台领导者[CO006,
              CO011]。2025年底，企业工作流软件巨头ServiceNow宣布达成最终收购协议，为风险暴露管理赛道树立了退出估值标杆[CO002, CO012]。
