      - number: '7.4'
        title: 财务数据透明度不足促使决策转向动态跟踪尽调
        blocks:
          - type: paragraph
            body: >-
              独立第三方来源证实了2025年11月估值超$6.1 billion的$435 million融资，以及2024年$4.3
              billion的前期估值。然而，融资总额不等于账面可用现金，估值溢价亦无法代表实际经营造血能力。证据池未披露毛利率、会计净利润/亏损、经营性现金流、资金消耗率（burn
              rate）、跑道期限、留存指标、客户集中度及交割后分部财务表现。这对投资研判的指引并非给出精确下行估值，而是明确划定一系列尽调触发红线。投资逻辑破裂信号包括：检测精度或服务可用性出现实质性恶化、强推客户迁移却未提供等量安全防护、关键第三方适配器停止维护、突发未披露的监管处罚，或在尽调中无法拿出经审计的留存率与单客经济学数据。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR015
              - CR016
      - number: '7.5'
        title: 核心图表与深度分析
        blocks:
          - type: callout
            title: 公开披露合规清单不等于内部控制有效性背书
            body: 官方罗列的政策与合规项目仅能作为尽调索引使用。投资立项仍需穿透到底层法律条款、具体审计范畴、除外责任清单、历史事故处置记录及特定客户合同义务等实质凭证。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: 建立可量化的整合落地与系统可靠性监控触发机制
            body: >-
              一旦出现以下情形，应上调风险等级或终止投资研判：ServiceNow主导的迁移导致安全控制能力缩水、关键第三方适配器失去技术支持、服务可用性发生实质性衰减，或管理层无法提供经审计的留存率、客户集中度、毛利率及重大事故处置记录。
            calloutType: recommendation
