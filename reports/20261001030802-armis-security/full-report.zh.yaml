      - number: '2.4'
        title: 核心图表与深度分析
        blocks:
          - type: callout
            title: 从被动可见性到工作流编排的结构性跃迁
            body: 单点设备可见性不再构成独立产品品类。ServiceNow耗资$7.75 billion的收购表明，企业买方迫切需要将实时资产发现、配置数据库与自动化事件工单打通的端到端闭环修复工作流。
            calloutType: insight
            claimRefs:
              - CM002
              - CM006
              - CM011
          - type: callout
            title: IT与OT采购部门间的组织协同摩擦
            body: 尽管CISO掌控顶层安全预算，工厂运营与生物医疗工程主管对触碰生产设备或临床网络的技术方案仍持实质否决权，导致销售周期拉长、部署交付放缓。
            calloutType: risk
            claimRefs:
              - CM001
              - CM004
              - CM008
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与体量对比
        blocks:
          - type: paragraph
            body: >-
              现有证据显示Armis横跨多个交叠竞争赛道，并未局限在单一封闭的对标群体中。其平台定位涵盖IT、运营技术、IoT及医疗设备，企业买方可将其与专业CPS安全产品、漏洞管理套件、网络安全平台、企业工作流巨头、内部自研集成项目或分散台账现状展开比对。核实材料将Cisco、Palo
              Alto
              Networks、Microsoft、Tanium、Fortinet、Google与ServiceNow列为生态集成伙伴，但未提供关于直接专业对标竞品的权威实时名单或可比赢单率数据。相对排名尚不透明，但体量优势已获确凿印证：ServiceNow收购公告披露Armis
              ARR超$340 million、员工约950人；Startup Nation Central记录其在9轮融资中累计吸收$1.17
              billion资本。上述数据凸显了其商业分量，但不能直接等同于技术碾压竞品的证明。
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP009
