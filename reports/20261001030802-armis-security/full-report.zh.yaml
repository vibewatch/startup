      - number: '2.2'
        title: 市场规模切片、增长动能与测算分歧
        blocks:
          - type: paragraph
            body: >
              评估整体市场空间必须拆解同心圆式的目标边界，而非简单套用单一宏观数字。从最宽的宏观口径看，Gartner预测2026年全球终端用户网络安全支出在威胁激增与企业全面拥抱AI驱动下将增长12.5%，达$240
              billion。在这项庞大预算中，企业网络安全资产管理与信息物理安全构成极具爆发力的高增长细分赛道。独立行业调研显示，全球IoT连接数从2018年的103亿个猛增至2025年的近250亿个，其中智能制造成为增速最快的场景。随着数十亿联网终端涌入企业网络，网络风险暴露管理已从可选工具转变为必不可少的基础设施。


              三大核心驱动力加速了市场扩容：传统IT/OT物理隔离（air gap）彻底瓦解、针对物理基础设施的国家级勒索攻击升级，以及CIS Control 1（企业资产盘点与控制）和CIS Control
              2（软件资产管理）等框架的强制合规要求。与此同时，商业爆发力带来了显著的企业估值跃迁。Armis在2024年底ARR突破$200 million，用时18个月实现ARR翻倍，在与ServiceNow达成$7.75
              billion现金收购协议前ARR已超$340
              million。ServiceNow表示，整合Armis预计将使其安全与风险解决方案的目标市场空间扩大两倍以上。尽管如此，独立机构测算仍存显著分歧：各家对独立CPS市场边界的界定大相径庭，常将软件资产可见性许可与更广泛的网络防火墙硬件、IT服务管理套件以及外包托管安全运营混为一谈。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM007
              - CM009
              - CM011
              - CM012
