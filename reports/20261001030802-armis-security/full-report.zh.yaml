      - number: '2.3'
        title: 买方画像、采购工作流与落地阻力
        blocks:
          - type: paragraph
            body: >
              网络风险暴露管理的采购决策涉及跨部门复合决策链，横跨首席信息安全官（CISO）、基础设施副总裁、厂区生产运营总监及临床工程主管。在企业IT场景中，预算权牢牢掌握在CISO或安全运营中心（SOC）总监手中，采购初衷多为消除资产盲区并满足监管审计合规。相反，运营技术（OT）与工业制造场景则存在运营摩擦：厂长与首席运营官对产线正常运行时间负有首要责任，因担忧生产中断，历来抵触任何触碰生产网络的软件部署。同理，医疗机构的决策权分散在IT安全团队与负责患者联网IoMT设备的生物医学工程部门之间。


              客户落地通常分三个阶段：先用被动网络监听和 API 连接器做轻量 PoC 验证；再把全组织资产台账与 CMDB
              记录逐一核对；最后接入安全编排自动化响应（SOAR）或工单流，把响应和工单处理串成闭环。尽管商业化势头迅猛，部署仍受多重瓶颈拖累。企业安全采购方要处理 IT 与 OT
              团队的预算拉扯、替换成熟网络设备的高昂迁移成本，以及复杂混合架构摄取多厂商遥测时的技术摩擦。买方还要评估平台抵御软件供应链攻击和固件漏洞的能力，并要求厂商为所有硬件提供严格的第三方信任认证和透明的固件漏洞披露。
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM008
              - CM010
              - CM013
              - CM014
