            body: >-
              Armis在财富500强集团、跨国制造工业巨头、医疗机构及高吞吐物流网络中拥有扎实的生产级落地验证。公开标杆案例包括联合航空、高露洁-棕榄、亿滋国际、DocuSign、Allegro
              MicroSystems及武田制药（Takeda Pharmaceuticals）。在工业与制造场景中，客户将Armis Centrix与Fortinet
              FortiGate防火墙、Cisco基础设施等OT深度集成方案结合，在完全不干扰产线运转的前提下精准捕捉异常行为。在医疗与公共事业场景中，洛杉矶县卫生服务局等机构部署Armis盘点IoMT医疗设备并落地实时零信任网络微隔离。标杆落地案例表明其投产见效迅速，多家客户在传感器部署数周内便理清了积压多年的审计历史盲区，实现全网资产穿透透视。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
