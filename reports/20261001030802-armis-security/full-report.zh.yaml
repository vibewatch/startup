            body: >-
              被动数据包检测虽能有效解码标准明文工业通信，但面对复杂的私有OT协议与物理隔离网段，纯云端被动传感器存在天然局限。2025年3月收购OTORIO表明，Armis必须借助外部垂直专业技术纵深切入本地工业控制系统防护。
            calloutType: risk
