      - 未决敞口或触发条件
    rows:
      - - 异构数据源输入导致资产台账不全或冲突
        - 中
        - 高
        - 方案包含多源关联分析与无感被动发现机制
        - 部分缓解
        - 若数据源覆盖、访问权限或资产实体对齐出现漂移，风险敞口偏高
        - 须核实实测覆盖率、对账误差率及陈旧资产占比
      - - 告警或模型质量无法准确区分正常业务行为与真实入侵
        - 中
        - 高
        - 方案包含云端检测与上下文增强机制
        - 尚未验证
        - 缺乏误报率、漏报率与检测延迟证据前风险敞口偏高
        - 核心否决项（Kill criterion）：检测表现较约定基准出现实质性恶化
      - - 云端中断或工作流中断延误资产可见性与威胁处置
        - 中
        - 高
        - 列有技术支持 SLA 并已集成安全事件工作流
        - 部分缓解
