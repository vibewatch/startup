      - number: '1.4'
        title: 核心图表与深度分析
        blocks:
          - type: callout
            title: 从被动资产可视化转向主动暴露修复的战略升级
            body: >-
              Armis跳出被动网络资产发现的局限，延伸至基于风险的暴露优先级排序与自动化修复编排，构筑商业模式差异化壁垒。通过收购Silk
              Security与OTORIO，Armis弥合了被动网络感知与运营漏洞管理间的断层，打造出一体化平台防御体系，促使ServiceNow将其视作不可或缺的收购标的。
            calloutType: insight
            claimRefs:
              - CO001
              - CO004
              - CO006
          - type: callout
            title: 并购后整合复杂度与高管留任现实
            body: >-
              ServiceNow收购印证了Armis的市场领导地位与技术价值，但公司仍面临实质执行阻力。将Silk与OTORIO
              Titan等并购代码库融入ServiceNow工作流架构，同时维持独立客情关系并留住关键研发高管，构成严峻的运营整合考验。
            calloutType: risk
            claimRefs:
