figures:
  - id: FO001
    title: Armis Security 公司与平台里程碑演进（2015—2026）
    type: timeline
    summary: Armis Security 发展大事记：从初创期网络资产可见性技术起步，成长至数十亿美元 Pre-IPO 估值并最终获战略平台收购。
    approximationNotes: 日期取自公司官方新闻稿及工商融资登记披露的正式公告月份。
    data:
      items:
        - label: 创立于特拉维夫
          date: 2015-12
          detail: Yevgeny Dibrov 与 Nadir Izrael 联合创立 Armis，旨在消除未托管 IoT 设备带来的网络安全盲区。
          tone: positive
        - label: Insight Partners 控股收购
          date: 2020-01
          detail: Insight Partners 以 11 亿美元估值收购 Armis 控股权，加速拓展大企业 GTM 市场。
          tone: positive
        - label: 34 亿美元估值轮融资
          date: 2021-11
          detail: 完成由 One Equity Partners 领投的 3 亿美元成长轮融资，估值达 34 亿美元。
          tone: positive
        - label: Centrix 平台上线
          date: 2023-09
          detail: 品牌升级并将底层架构扩展为 Armis Centrix 网络暴露管理平台。
          tone: neutral
        - label: 收购 Silk 与 CTCI
          date: 2024-04
          detail: 收购 Silk Security 强化漏洞优先级排序能力，收购 CTCI 引入 AI 驱动的威胁情报。
          tone: positive
        - label: $200M ARR 与 $4.3B 估值
          date: 2024-10
          detail: 年度经常性收入（ARR）突破 2 亿美元后，以 43 亿美元估值完成 2 亿美元融资。
          tone: positive
        - label: 收购 OTORIO
          date: 2025-03
          detail: 收购工业安全厂商 OTORIO，深化运营技术（OT）与关键基础设施防护。
          tone: positive
        - label: 4.35 亿美元 Pre-IPO 融资
          date: 2025-11
          detail: 完成由 Goldman Sachs Alternatives 领投的 4.35 亿美元 Pre-IPO 融资，公司估值突破 61 亿美元。
          tone: positive
        - label: 达成 ServiceNow 并购协议
          date: 2025-12
          detail: ServiceNow 达成收购 Armis 协议，将网络暴露管理原生融入企业工作流。
          tone: positive
        - label: 蝉联 Gartner 魔力象限领导者
          date: 2026-03
          detail: 连续第二年入选 2026 年 Gartner 网络物理系统（CPS）保护平台魔力象限领导者。
          tone: positive
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO010
      - CO011
      - CO012
