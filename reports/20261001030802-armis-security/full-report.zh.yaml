  - id: FE001
    title: Armis Centrix 四层运行架构
    type: stack
    summary: 多层功能架构：呈现从物理与虚拟网络流量捕获、云端威胁智能到第三方联动处置的数据流转全貌。
    data:
      layers:
        - label: 'Layer 1: 边缘数据摄取与被动流量采集'
          detail: 物理硬件设备与虚拟采集器部署在核心网络交换机旁，无需安装终端软件；它们通过 SPAN 或镜像端口被动抓取全量流量。
        - label: 'Layer 2: 本地流量深度解析与协议报文检测'
          detail: 针对底层遥测、MAC 地址、通信会话及下发至 PLC 和在网设备的未加密工业协议指令进行深度报文分析（DPI）。
        - label: 'Layer 3: 资产聚合智能云端分析引擎'
          detail: 依托 AWS 托管的集中式知识库，将实测设备配置与超过 3 billion 台企业设备沉淀的行为画像库进行指纹比对。
        - label: 'Layer 4: 威胁检测与风险量化评分引擎'
          detail: 持续将设备遥测数据与 CVE 漏洞库、FDA 医疗设备召回清单、威胁情报流及异常通信偏离行为进行交叉比对。
        - label: 'Layer 5: 统一暴露管理与检索控制台'
          detail: 基于 Armis Standard Query（ASQ）的管理交互界面，提供可视化交互看板、自定义策略编排及资产台账报表导出。
        - label: 'Layer 6: 生态集成与联动响应 API'
          detail: 提供连接 Fortinet 防火墙、Google Chronicle SIEM 与 ServiceNow CMDB 的双向 REST 接口，自动阻断威胁并协同处置事件。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE007
      - CE008
      - CE009
  - id: FU001
    title: 客户全生命周期旅程与平台扩张路径
    type: journey-map
    summary: 客户采用的阶段跃迁：从初始无感网络资产摸排，逐步演进至融入 ServiceNow 生态的全企业自主化风险治理。
    data:
      nodes:
        - label: 1. 无感摸排与资产盘点
          stage: Evaluation & Initial Landing
          role: SecOps / Network Admin
          touchpoints:
            - Passive network span port TAP deployment
            - Instant device identification via Collective Asset Intelligence Engine
            - Initial NIST CSF asset inventory baseline audit
          note: 客户通常可多发现 30% 至 300% 此前未知的在网资产。
        - label: 2. 暴露面优先级排序与处置
          stage: Core Operational Adoption
          role: CISO / Vulnerability Management
          touchpoints:
            - Armis Centrix VIPR Pro vulnerability prioritization
            - Fortinet FortiGate and Cisco DNA firewall policy synchronization
            - Automated vulnerability workload reduction up to 98%
          note: 驱动 SecOps 从被动打补丁转向基于暴露风险的靶向修复，缩减 90% 平均修复时间（MTTR）。
        - label: 3. OT 与 IoMT 垂直场景渗透
          stage: Cross-Functional Platform Expansion
          role: VP of OT Security / Clinical Engineering
          touchpoints:
            - OTORIO Titan integration for industrial ICS/SCADA control networks
            - IoMT medical device protocol parsing and FDA recall tracking
            - Zero-trust segmentation enforcement on critical infrastructure
          note: 在工厂与医院内无损、不中断地监控脆弱的网络物理资产。
        - label: 4. 自主治理深度集成
          stage: Enterprise Control Tower
          role: CIO / Board Audit Committee
          touchpoints:
            - Direct bi-directional sync into ServiceNow CMDB and Security Incident Response
            - ServiceNow Autonomous Security & Risk agentic AI asset governance
            - Continuous compliance audit automation and insurance premium reduction
          note: 将底层资产遥测转化为自动化企业级治理策略与机器响应速度的风险抑制。
        - label: 5. 跨厂区集团化标准落地
          stage: Enterprise Fleet Rollout
          role: Global Head of Infrastructure
          touchpoints:
            - Rollout across distributed corporate campuses and manufacturing plants
            - Continuous real-time asset discovery across regional subsidiaries
            - Cross-site unified attack surface dashboard consolidation
          note: 在全球各业务实体间统一资产可见性体系与设备遥测标准。
        - label: 6. 管理层风险把控与续约背书
          stage: Contract Renewal & Advocacy
          role: Chief Information Security Officer
          touchpoints:
            - Board-level Cyber Risk Exposure score reporting
            - Demonstration of 351% annual ROI and cyber insurance premium savings
            - Multi-year enterprise contract extension and joint reference participation
          note: 将 SecOps 运营层面的工具黏性转化为管理层对多年期大单续约的坚定背书。
    approximationNotes: 阶段划分与关键触点依据 Armis 技术白皮书及 ServiceNow 自主安全与风险架构简报所载的大企业标准部署流程梳理。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU013
      - CU014
