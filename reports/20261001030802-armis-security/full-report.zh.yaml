chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、平台架构与商业模式
        blocks:
          - type: paragraph
            body: >-
              Armis Security 是一家企业级网络安全厂商，专注于网络风险暴露管理、资产情报及信息物理系统（CPS）保护[CO001]。公司由首席执行官 Yevgeny Dibrov 与首席技术官 Nadir
              Izrael在结束以色列国防军Unit Izrael 在以色列国防军 Unit 81 情报部队服役后于 2015 年 12
              月创立，管理总部设在加利福尼亚州旧金山，研发中心位于以色列特拉维夫-雅法[CO002]。Armis
              的成立是为了解决企业网络中的结构性隐患：运营技术（OT）、工业控制系统（ICS）、物联网（IoT）及医疗物联网（IoMT）等大量未受管联网设备无法运行传统终端安全代理，形成防护盲区[CO003]。公司以核心平台
              Armis
              Centrix的企业级软件订阅，辅以资产漏洞管理、OT/ICS安全及优先级情报等专业模块[CO004]。底层架构将带外网络流量检测与云服务商、身份库及安全运营平台的集成相结合，依托追踪超10亿条历史资产档案的情报引擎沉淀设备上下文[CO005]。随业务扩张，其战略重心已从被动网络可视化演进为主动网络风险暴露管理与自动化修复编排[CO004]。
