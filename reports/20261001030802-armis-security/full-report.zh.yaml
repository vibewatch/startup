        - 早期
        - 缺乏里程碑与客户迁移实证，风险敞口实质存在
        - 核心否决项（Kill criterion）：缺乏合同保护的前提下被强制迁移或遭遇管控能力倒退
    notes: 评级综合了已公开的系统架构与客户环境证据；原始材料未公布系统失效频次、服务等级（SLA）、模型质量指标或收购后整合里程碑。
