            body: >-
              Armis 不向终端下发代理，而是在交换机 SPAN 端口镜像处分析网络流量，从而绕开医疗输液泵、老旧 PLC
              及智能楼宇传感器无法安装软件的工程死结。这种被动摄取机制避免业务中断，照亮传统终端安全代理无法触及的未受管设备盲区。
