      - number: '6.4'
        title: 平台整合、客单扩张与集中度动态
        blocks:
          - type: paragraph
            body: >-
              2026年4月完成交割的$7.75 billion ServiceNow收购案，使Armis的发展路径发生结构性裂变。Armis
              Centrix不再仅作为独立单点工具运转，而被确立为驱动ServiceNow新发布自主安全与风险（Autonomous Security &
              Risk）套件的核心资产情报底座。该方案将Armis在IT、OT、IoT及AI Agent身份全维度的实时遥测直接贯通至ServiceNow
              CMDB与安全事件响应工作流中。并购前ServiceNow安全与风险业务年度合同价值（ACV）已达$1
              billion，为双方在全球数千家共同客户中提供了巨大的交叉销售通道。然而，净金额留存率（NRR）和毛金额留存率（GRR）等衡量订阅黏性的核心指标从未公开披露。这种透明度缺失掩盖了潜在的客户流失动态；一旦老客户抵触被强行捆绑销售进更庞杂的ServiceNow生态，平台整合摩擦风险将随之显现。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: 核心图表与深度分析
        blocks:
          - type: callout
            title: 可量化ROI驱动企业采购决策
            body: >-
              Armis
              Centrix经核实的经济效益表现——351%年化ROI、MTTR缩短90%、人工排查工时精简61%——是驱动大型企业立项采购的根本支撑。通过将抽象的网络安全减灾转化为IT软件许可缩减（10%–15%）与网络安全保费下降（25%）等真金白银的成本节约，Armis成功将安全工具从被动的成本负担重塑为自造血式平台投资。
            calloutType: insight
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
          - type: callout
            title: 留存数据缺失与生态整合摩擦隐患
            body: >-
              尽管手握超35家财富100强标杆客户且估值高达$7.75B，Armis与ServiceNow均未公开披露净金额留存率（NRR）或毛金额留存率（GRR）。这一指标真空构成了评估并购后平台生命力的实质性尽调断层。此外，随着ServiceNow将Armis吸收进其$1B
              ACV的安全套件，仍在使用Jira Service Management或BMC等竞对ITSM工具的老客户可能遭遇集成支持降级，加剧长期客户流失风险。
            calloutType: risk
            claimRefs:
              - CU013
              - CU015
              - CU016
  - number: 7
    title: 风险分析
    sections:
      - number: '7.1'
        title: 监管与法律合规暴露面广泛但证据链仍存缺口
        blocks:
          - type: paragraph
            body: >-
              Armis宣称其业务广泛覆盖运营技术、医疗设备、政府、金融服务及关键基础设施。在上述领域，一次资产漏报或告警延迟所带来的运营、隐私及安全后果远超普通企业软件范畴。公司法务门户列示了平台服务条款、支持SLA、数据处理附约、次级处理者名单、信息安全白皮书、漏洞披露政策、漏洞赏金计划及安全通报。上述清单证实了其具备规范的合规展示面，但不能直接等同于其底层控制设计完备、认证范围无虞、合同救济明确或未受监管处罚。核查材料中未见监管机构通报、司法诉讼判决文书或具体底层合规政策文本，因此法律风险敞口只能视为部分梳理，难言彻底出清。
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR007
              - CR015
