      - number: '8.2'
        title: 资本结构演变、历史融资与并购纪律
        blocks:
          - type: paragraph
            body: >-
              Armis展现出极为罕见的融资演进路径：两度达成控股或战略并购里程碑，并与成长期股权财团紧密交织。2015年底由Yevgeny Dibrov与Nadir
              Izrael联合创立后，公司在早期轮次累计募资$116M；2020年1月，Insight
              Partners以$1.1B估值收购控股权，CapitalG跟投$100M。Armis并未并入PE控股平台，而是保留独立管理层并持续引入机构成长期股权：2021年完成由One Equity
              Partners领投、估值$3.4B的$300M融资；2024年10月完成由Alkeon Capital与General Catalyst领投、估值$4.2B的$200M
              D轮融资。2025年11月，Armis斩获由Goldman Sachs Alternatives领投的$435M
              Pre-IPO轮融资，估值超$6.1B；随后ServiceNow于2025年12月签订$7.75B全现金收购要约。公司历经9轮股权与私募融资累计吸纳$1.17B资金，既体现顶级机构背书，也经由全现金退出消解了VC清算优先权清偿悬顶。
