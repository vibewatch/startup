      - number: '8.3'
        title: 情景测算、估值对标与逻辑反转诱因
        blocks:
          - type: paragraph
            body: >-
              对标网络安全可比估值倍数，ServiceNow收购要约包含显著战略溢价。身份与暴露面管理高成长上市同行如CrowdStrike、Palo Alto
              Networks，历史远期市销率（P/S）区间处于14x至22x；Claroty、Nozomi Networks 等 OT/IoT 细分对标公司的一级市场估值则介于 $1B 至 $2.5B。ServiceNow
              给出的 $7.75B 收购对价对应约 22.8x 静态 ARR 倍数，显著超出工控安全常规基准；这一价格已计入面向 ServiceNow 全球大客户交叉销售工作流软件的预期。情景判断涵盖乐观情景（Centrix
              拉动 ServiceNow SecOps安全运营收入跨过$1B
              ARR）与悲观情景（特拉维夫核心工程团队流失、OTORIO本地部署客户抵触云端迁移）。机构持续尽调的核心验证节点包括：跟踪交易完成后核心高管留任协议落地、审查与Fortinet及Google
              Chronicle联合适配器遥测表现、紧跟反垄断监管审批进程。
            claimRefs:
              - CV003
              - CV004
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 图表与附录
        blocks:
          - type: callout
            title: 高额收购倍数消解独立下调轮风险，尽调重心转向业务整合
            body: >-
              ServiceNow斥资$7.75B收购Armis对应约22.8x
              ARR估值倍数，大幅高出网安领域常规并购水准。这一溢价既体现极高战略协同价值——将Armis无代理资产遥测能力注入ServiceNow配置管理数据库（CMDB）与工作流自动化引擎——也彻底终结了一级市场流动性折价悬念。尽调重心因而从独立主体的资本充裕度，转向交割后高管留任、OTORIO本地部署能力的技术整合，以及联合渠道体系磨合。
            calloutType: insight
            claimRefs:
