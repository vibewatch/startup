      - number: '1.2'
        title: 领导团队、战略扩张与运营治理
        blocks:
          - type: paragraph
            body: >-
              Armis由联合创始人Yevgeny Dibrov与Nadir
              Izrael统领，两人长期的技术与商业搭档构成了企业核心治理支柱[CO002]。公司全球工程与管理团队规模达750至900余人，在内生增长外辅以针对性技术并购，相继吸纳漏洞优先级排序厂商Silk与关键基础设施安全厂商OTORIO[CO002,
              CO006]。技术架构依托大规模分布式数据处理流水线，借助AWS
              ECS、S3、SQS等云服务及分布式框架，分析来自各分支企业网络的海量遥测数据[CO007]。运营治理核心在于确保客户环境严格合规与突发事件应急准备，将平台遥测数据与CIS Control
              17及企业事件响应控制等行业标准对齐[CO008]。不过，公司对两位创始人高管存在关键人依赖；在收购交易宣布后，跨被购产品线的技术整合需求也引发运营摩擦，Armis须加速融入ServiceNow的企业级平台治理体系[CO002,
              CO009]。
            claimRefs:
