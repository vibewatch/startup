chapter:
  number: 4
  title: "Financials"
  summary: "Armis reached $340M+ in ARR growing at over 50% year-over-year prior to signing a definitive $7.75 billion all-cash acquisition agreement with ServiceNow. While enterprise scale and customer momentum across Global 2000 accounts are proven, underlying gross margin, net revenue retention, and standalone cash burn metrics remain undisclosed private gaps that shift to ServiceNow's post-merger integration underwriting."
sections:
  - id: "revenue-streams-and-pricing"
    title: "Revenue Streams and Monetization Mechanics"
    body: "Armis monetizes its cyber exposure management platform through multi-year annual recurring software subscriptions for its flagship Armis Centrix platform. Revenue is driven by subscription licensing scaled across connected device volumes, enterprise environments, and specialized functional modules including Asset Vulnerability Management (AVM), OT/IoT security, and Prioritization and Remediation (VIPR Pro). Armis bundles continuous threat intelligence feeds and device knowledgebase access—tracking billions of asset profiles—into platform licensing. While list pricing is not publicly published, secondary market and enterprise procurement benchmarks indicate multi-tier enterprise contracts spanning six- to seven-figure annual contract values (ACV) for Fortune 500 and Global 2000 deployments. Official technical integration surfaces confirm deep operational ties to enterprise workflow systems like ServiceNow, Google Chronicle, and Fortinet Security Fabric, which drive account expansion and multi-year renewals."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI007"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "traction-and-sales-efficiency"
    title: "Public Traction Versus Private Unit Economics"
    body: "Armis demonstrated rapid commercial scale, surpassing $200 million in ARR in 2024 and exceeding $340 million in ARR prior to its late-2025 acquisition announcement, reflecting sustained year-over-year ARR growth of more than 50%. The company's go-to-market motion targets enterprise cybersecurity and critical infrastructure buyers, successfully securing over 35% of the Fortune 100 and 7 of the Fortune 10 along with enterprise logos such as Colgate-Palmolive, United Airlines, and Mondelēz International. However, crucial SaaS efficiency indicators—specifically Net Revenue Retention (NRR), Gross Revenue Retention (GRR), Customer Acquisition Cost (CAC) payback periods, and exact customer counts—remain undisclosed private metrics. Secondary pre-IPO platforms and private indices tracked employee counts growing from 750 to approximately 950 personnel, implying strong ARR per employee exceeding $350k, but statutory gross margin percentages and GAAP net operating losses were never independently audited or published."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI011"
      - "CI012"
      - "CI013"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-acquisition"
    title: "Capital Adequacy, Valuation Trajectory, and Diligence Blockers"
    body: "Prior to its acquisition agreement, Armis raised approximately $1.17 billion across nine private financing rounds, including a $200 million round in late 2024 at a $4.3 billion valuation and a $435 million pre-IPO growth round in late 2025 led by Goldman Sachs Alternatives valuing the company at over $6.1 billion. In December 2025, ServiceNow entered into a definitive agreement to acquire Armis for approximately $7.75 billion in cash, representing an acquisition multiple of roughly 22.8x trailing ARR. Because the acquisition agreement provides complete liquidity for private equity and venture shareholders, traditional standalone venture cash runway and follow-on private fundraising risks are superseded by transaction close conditions and regulatory approvals. The primary diligence blockers are operational and integration-related: gross margin resilience, Cloud/AI telemetry infrastructure cost scalability, and key technical executive retention across the Palo Alto and Tel Aviv engineering hubs."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI014"
      - "CI015"
