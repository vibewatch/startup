callouts:
  - calloutType: "insight"
    title: "High Acquisition Premium Reflects Strategic Workflow Fit Over Disclosed Margins"
    body: "ServiceNow's agreement to acquire Armis for $7.75 billion in cash represents a rich 22.8x multiple against $340M ARR. This premium reflects strategic synergy—integrating Armis's real-time asset intelligence into ServiceNow's IT Service Management and Security Operations workflows—rather than a proven standalone GAAP profit margin. For private equity underwriting, the transaction eliminates independent financing risk while shifting focus to post-merger retention and technology consolidation."
    claimRefs:
      - "CI004"
      - "CI014"
      - "CI015"
