- id: financing-context-and-hard-anchors
  title: Financing context provides a hard floor and a wide confidence band, not a clean current mark
  body: The most important discipline point is that the last fully disclosed company-specific valuation anchor in the fetched record is the February 2022 round at $3.35B, when Starburst said it had raised $250M and $414M total. The 2025 Citi strategic investment confirms continued investor and customer interest, but public sources do not disclose check size, valuation, or structure. By February 2026 the company had crossed $100M ARR and nearly 40% growth, so it is plausible that present enterprise value support is stronger than the 2022 anchor. But that is still an inference rather than a disclosed market fact. On a strict public-data basis, $3.35B divided by the disclosed ARR floor implies an EV/ARR multiple of at most 33.5x, and the true multiple could have been lower if ARR was already above $100M or materially higher if one used an earlier revenue base. That is precisely why valuation stance has to remain banded and price-sensitive. Public evidence supports a valuable asset, but not
    a single precise mark for 2026.
  claimRefs:
