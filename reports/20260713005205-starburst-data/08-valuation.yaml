company:
  name: Starburst Data
chapter:
  number: 8
  title: Valuation
  summary: Starburst looks like a strategically strong but still price-sensitive infrastructure asset. The public case for value rests on a real $100M-plus ARR business, strong NDR, credible enterprise banking traction, and a differentiated federation-plus-Trino moat; the public case against overpaying rests on missing GRR, concentration, margin, cash, and detailed 2025 round terms. The last hard company-specific valuation anchor remains the $3.35B figure disclosed in the 2022 financing announcement, so any higher present-day view must be scenario-driven rather than treated as a verified market fact.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation is constructive on quality but disciplined on price
  body: 'The public evidence supports a positive company-quality view and a qualified valuation view. Starburst is not a speculative concept company. It has crossed $100M ARR, disclosed 130% net dollar retention, shown large-bank traction, and built a real product stack on top of Trino. Those are the ingredients of an asset that can justify a premium strategic narrative. The problem is that price discipline still matters more than company quality. The public record does not disclose GRR, churn, customer concentration, gross margin, burn, debt, or the exact terms of the 2025 Citi strategic investment. So the right recommendation is not “buy at any price.” It is a conditional positive stance: constructive if entry discipline and diligence rights are strong, but unwilling to underwrite a heroic premium that assumes all hidden economics are excellent. Put differently, Starburst appears too credible to dismiss, but still too under-disclosed to treat as de-risked. Investors should lean toward
    fair-to-slightly-rich rather than obviously cheap unless additional private data improves the quality of the underwriting case.'
