- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Current ARR mix
    - Galaxy vs Enterprise vs support / services / AI revenue split
    - Determines real EV/ARR quality
    - Finance team / revenue bridge
  - - Retention and concentration
    - GRR, NRR by segment, churn, top-10 account exposure, renewal calendar
    - Core downside-protection input
    - Finance + RevOps / cohort exports
  - - Margin path
    - Gross margin by product and services share
    - Separates premium software economics from services-heavy delivery
    - Finance / board metrics
  - - Cash and capital structure
    - Cash balance, burn, debt, and 2025 round economics
    - Converts company quality into investability
    - Finance + legal / round docs
  - - Competitive reality
    - Recent win-loss data versus Databricks, Snowflake, Dremio, and cloud-native substitutes
    - Tests moat durability and price power
    - Sales ops / field interviews
  - - Security and reliability execution
    - Incident history, patch latency, support SLAs, audit scope, and BYOC control inheritance
    - Crucial for regulated-customer durability
    - Security / support diligence
  notes: These are the minimum asks needed to turn a credible company into a priced investment view.
