- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - What would change the view
  rows:
  - - Open-source Trino moat plus enterprise packaging creates a differentiated platform position
    - Thesis
    - If win rates, upstream influence, or enterprise support prove overstated
  - - '>$100M ARR and 130% NDR support real commercial traction'
    - Thesis
    - If GRR, concentration, or margin quality are materially worse than implied
  - - Financial-services traction suggests willingness to pay for governance and federation
    - Thesis
    - If a few banks dominate ARR or expansion stalls
  - - Public record lacks GRR, churn, margin, cash, and 2025 round terms
    - Anti-thesis
    - A strong data room with durable cohorts and software-heavy margins would improve confidence
  - - Competing lakehouse vendors also sell AI, semantics, and lower-friction experiences
    - Anti-thesis
    - Evidence of sustained win rates against bundled or centralized alternatives would reduce concern
  notes: The anti-thesis is driven more by evidence gaps and scaling economics than by disbelief in the product.
