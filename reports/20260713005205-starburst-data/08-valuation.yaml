- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Concentration shock
    - One or two large accounts drive a disproportionate share of ARR or a major renewal wobbles
    - Breaks the “durable enterprise base” thesis
    - Re-price materially or pause
  - - Margin-quality disappointment
    - Services, support, or implementation intensity is too high
    - Reduces software-like multiple support
    - Lower base-case valuation band
  - - AI execution overreach
    - Preview AI features fail to become stable revenue drivers
    - Cuts the premium AI narrative
    - Reduce bull-case probability
  - - Security / reliability failure
    - Repeated severe incidents or patch-latency concerns
    - Undermines trust for regulated buyers
    - Pause underwriting until posture is verified
  - - Bundle pressure
    - Win-loss data deteriorates against centralized or bundled peers
    - Compresses expansion and multiple ceiling
    - Lower comp-set multiple assumptions
  - - Round-structure overhang
    - 2025 round terms imply unfavorable preferences or dilution
    - Reduces actual investor outcome at a given headline valuation
    - Demand structural protection or pass
  notes: These triggers convert the risks chapter into valuation discipline.
