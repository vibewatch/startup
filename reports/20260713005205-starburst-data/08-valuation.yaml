    - Bundle pressure, services drag, or concentration shock
    - Possible, but requires private metrics to be very good
  - - Base
    - Growth remains real, but disclosure gaps partially persist and margins / concentration are only average
    - Supports valuation around to moderately above the last disclosed anchor
    - Quality may be good but not premium enough for an unconstrained step-up
    - Most consistent with current public evidence
  - - Bear
    - A few large accounts dominate growth, support intensity is high, or bundled rivals compress expansion
    - Valuation support drifts back toward or below the last hard anchor
    - Renewal sensitivity and margin disappointment
    - Cannot be ruled out without data-room proof
  notes: Scenario logic is intentionally tied to hidden economics and concentration rather than to TAM optimism alone.
