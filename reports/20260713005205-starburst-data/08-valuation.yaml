- id: comparable-context-and-scenario-view
  title: Comparable context says “premium infrastructure,” but public comps do not collapse the uncertainty
  body: Public-company context helps frame the opportunity set, but it does not solve the core uncertainty. As of July 2026, Snowflake and Datadog both sit around $90B in public-market value, MongoDB around $27.5B, and Confluent around $11.1B. Those figures show that the market still grants substantial value to scaled data and developer-infrastructure platforms. But none of those businesses is an apples-to-apples comp for Starburst’s exact model. Snowflake is more centralized-cloud-warehouse oriented, MongoDB is a database platform, Confluent is more streaming-centric, and Datadog is observability software. Meanwhile, competitor product pages from Databricks, Dremio, and Athena show that the market will not reserve premium multiples for federation narratives alone; peers are also packaging AI, semantic, ingestion, and cost-performance stories. The right use of comps is therefore contextual rather than formulaic. They support the idea that a multi-billion-dollar Starburst can be reasonable,
    but they do not prove that every additional step-up from the 2022 anchor is justified without more economics data.
