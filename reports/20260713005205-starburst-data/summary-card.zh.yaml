  topStrengths:
    - 已验证的 >$100M ARR、130% 净美元留存和近 40% ARR 增长，说明 Starburst 已有真实商业规模，不只是故事公司
    - 联邦式架构和 Trino 维护者身份，让它相对集中式数据仓库和 lakehouse 方案占据差异化位置
    - 金融服务验证异常扎实，既有头部银行关系，也能给大型受监管企业提供参考样板
    - 产品已从联邦查询扩到 AI、数据产品和互操作叙事，同时没有放弃“少搬数据”的核心主张
    - 历史融资和投资人质量说明，公司能吸引严肃的长期资本
  topRisks:
    - 公开证据没有披露分队列 GRR、头部客户集中度、毛利率、现金、烧钱速度、债务，或 2025 年 Citi 轮融资经济条款
    - 与 Databricks、Snowflake、Dremio、Athena 等平台重叠竞争，可能挤压定价权或扩张质量
    - 大型企业联邦部署可能很复杂，服务和支持负担有机会稀释软件式经济性
    - 一旦安全或可靠性出问题，支撑溢价叙事的受监管客户信任会被直接打穿
    - 最近一个完整披露的估值锚点已经偏历史，因此当前定价信心仍主要靠尽调，而不是单靠公开证据
  unresolvedGaps:
    - Galaxy、Enterprise、AI、服务和支持之间的当前 ARR 构成没有公开披露
    - GRR、流失、续约时点和头部客户集中度仍未公开
    - 毛利率、现金余额、烧钱速度、债务和盈利能力没有公开披露
    - 2025 年 Citi 战略投资的规模、估值和结构没有公开披露
    - 公开证据不足以支撑一个可用于摘要卡的已验证当前客户数
