        - 如果少数银行主导 ARR，或扩张停滞
      - - 公开记录缺少 GRR、流失率、利润率、现金和 2025 年融资条款
        - 反向论点
        - 若数据室显示客户分组留存扎实、利润率以软件为主，信心会提高
      - - 竞争性 lakehouse 厂商也在销售 AI、语义和更低摩擦的体验
        - 反向论点
        - 若有证据显示其能持续赢过捆绑式或集中化替代方案，担忧会下降
    notes: 反论点更多来自证据缺口和规模化经济性，而不是不相信产品本身。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV024
      - CV029
      - CV032
      - CV037
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - ARR 继续强劲复合增长，GRR 健康，金融服务客户集中度可控，AI 功能扩大钱包份额
        - 支撑企业价值显著高于上一轮公开锚点
        - 捆绑压力、服务拖累或集中度冲击
        - 有可能，但需要非公开指标非常好
      - - 基准
        - 增长仍真实，但披露缺口部分延续，利润率 / 集中度也只是平均水平
        - 支撑估值处于上一轮公开锚点附近至适度高于该锚点
        - 质量可能不错，但不足以支撑不设约束的估值上调
        - 最符合当前公开证据
      - - 熊市
        - 少数大客户主导增长、支持强度高，或捆绑式竞争对手压缩扩张
        - 估值支撑回落至接近或低于上一轮硬锚点
        - 续约敏感度和利润率不达预期
        - 没有数据室证据前无法排除
    notes: 情景逻辑刻意绑定隐含经济性和集中度，而不只靠 TAM 乐观叙事。
    claimRefs:
      - CV011
      - CV014
      - CV019
      - CV029
      - CV032
      - CV033
      - CV034
      - CV037
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Starburst 2022 年融资
        - 私募估值锚点
        - 公开估值 $3.35B；累计融资 $414M
        - 最可靠的公司特定硬锚点
        - 历史数据，早于 2026 年当前状态
      - - Snowflake
        - 公开市场市值
        - 截至 2026 年 7 月为 $90.61B
        - 规模化云数据公司，可参考高端市场风险偏好
        - 仓库导向集中化程度高得多，披露也更充分
      - - MongoDB
        - 公开市场市值
        - 截至 2026 年 7 月为 $27.51B
        - 具备优质软件特征的开发者 / 数据平台可比公司
        - 产品模式和数据库经济性不同
      - - Confluent
        - 公开市场市值
        - 截至 2026 年 7 月为 $11.13B
        - 流式 / 数据基础设施可比公司，提供中等规模公开市场参照
        - 不是以联邦查询为中心的分析平台
      - - Datadog
        - 公开市场市值
        - 截至 2026 年 7 月为 $91.67B
        - 显示公开市场愿意为定义品类的基础设施软件付费
        - 可观测性并非 Starburst 商业模式的直接可比项
    notes: 可比估值只是背景锚点，不是 Starburst 能直接套用的同口径定价公式。
    enumerationScope:
      coverage: sample
      basis: >-
        Sample focuses on the last disclosed company-specific anchor plus a small set of liquid public infrastructure
        references relevant to enterprise software appetite.
    claimRefs:
      - CV011
      - CV012
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 集中度冲击
        - 一两个大客户贡献过高 ARR，或一笔重大续约动摇
        - 打破「企业客户基础持久」论点
        - 大幅重估价格或暂停
      - - 利润率质量不达预期
        - 服务、支持或实施强度过高
        - 削弱类软件倍数支撑
        - 下调基准情形估值区间
      - - AI 执行过度扩张
        - 预览版 AI 功能未能成为稳定收入驱动
        - 削弱 AI 溢价叙事
        - 下调牛市情形概率
      - - 安全 / 可靠性失败
        - 严重事故反复出现，或存在补丁延迟担忧
        - 削弱受监管买家的信任
        - 暂停承销，直至状态核实
      - - 捆绑压力
        - 面对集中化或捆绑式同业，赢单 / 输单数据恶化
        - 压缩扩张空间和倍数上限
        - 下调可比组倍数假设
      - - 融资轮结构悬置风险
        - 2025 年融资条款暗示不利优先权或稀释
        - 在给定名义估值下压低投资人实际回报
        - 要求结构性保护，否则放弃
    notes: 这些触发项把风险章节转化为估值纪律。
    claimRefs:
      - CV028
      - CV029
      - CV031
      - CV033
      - CV034
      - CV037
      - CV038
  - id: TV006
    title: 最终尽调需求表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR 结构
        - Galaxy、Enterprise、支持 / 服务 / AI 收入拆分
        - 决定真实 EV/ARR 质量
        - 财务团队 / 收入桥
      - - 留存与集中度
        - 分客群 GRR、NRR、流失率、前 10 大客户敞口、续约日历
        - 核心下行保护输入
        - 财务 + RevOps / 客户分组数据导出
      - - 利润率路径
        - 按产品划分的毛利率和服务占比
        - 区分优质软件经济性和服务偏重型交付
        - 财务 / 董事会指标
      - - 现金与资本结构
        - 现金余额、烧钱速度、债务和 2025 年融资经济性
        - 把公司质量转化为可投资性
        - 财务 + 法务 / 融资文件
      - - 竞争现实
        - 近期相对 Databricks、Snowflake、Dremio 和云原生替代方案的赢单 / 输单数据
        - 检验护城河持久性和定价权
        - 销售运营 / 一线访谈
      - - 安全与可靠性执行
        - 事故历史、补丁延迟、支持 SLA、审计范围和 BYOC 控制继承
        - 对受监管客户留存至关重要
        - 安全 / 支持尽调
    notes: 要把一家可信公司转化为可定价的投资判断，至少需要这些问题的答案。
    claimRefs:
      - CV006
      - CV016
      - CV017
      - CV026
      - CV036
      - CV037
      - CV038
      - CV040
