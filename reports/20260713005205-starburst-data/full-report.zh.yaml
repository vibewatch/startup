  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、替代方案和潜在进入者
        blocks:
          - type: paragraph
            body: >-
              竞争地图比标准品类矩阵更宽，因为买方可以用结构完全不同的方式解决同一个问题。Databricks 和 Snowflake 是大型平台替代方案，更倾向于先把数据集中到统一湖仓或数据仓库再分析。Dremio
              更直接地竞争，定位为开放湖仓和联邦导向产品，带有智能体分析、语义上下文和开放 catalog 叙事。Amazon Athena 范围更窄，但在 AWS 中心型足迹里危险，因为它让客户以低摩擦方式在原地数据上跑
              serverless SQL。开源 Trino 是长期存在的内部自建替代，尤其适合能承受运维负担的工程强团队。评测和替代方案来源还把 Azure Databricks、Azure Synapse、Spark 以及
              Denodo 类虚拟化厂商列为对比项，但它们通常比前五类离 Starburst 的核心购买决策更远一步。关键洞察是，Starburst
              很少只在查询速度上竞争。它竞争的是企业到底应当集中、联邦、自建，还是购买一个治理厚重的开放数据层。
