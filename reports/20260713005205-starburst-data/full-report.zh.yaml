      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图跟着架构走，而不是跟着看板走。主要经济买方通常是数据平台、数据工程、云基础设施或分析现代化负责人；涉及敏感或跨境数据集时，安全和治理负责人拥有否决权。终端用户从分析工程师和重度使用 SQL
              的数据团队，延伸到业务分析师，并越来越包括需要治理型实时数据的 AI 开发者或 agent 构建者。付款方常是中央平台或转型预算，但触发点通常是局部痛点：数据仓库支出上升、重复管道、监管要求数据留在原地，或新的
              AI 项目等不起跨季度迁移。Starburst
              自身材料通过强调混合访问、开放格式、策略执行和更低数据搬运成本，强化了这种模式；竞争对手页面则显示，替代方法更偏向先把数据集中到湖仓或数据仓库。采用往往分阶段推进：连接分布式系统，在一个用例上证明查询更快或成本下降，建立治理和语义上下文，再扩展到可复用数据产品或
              AI 驱动界面。这条路径偏向那些能早期同时拿下平台团队和一两个急迫工作负载负责人的公司。
