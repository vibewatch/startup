      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的长期驱动与 Starburst 的销售主张高度吻合：以 AI 为中心的基础设施支出、受监管行业实时分析、向数据网格和逻辑数据织物模型迁移，以及让整体换平台更慢、更贵的多云架构。Mordor 明确把 AI
              基础设施、受监管行业实时分析、mesh、市场化交易和边缘延迟列为增长驱动；QY Research
              还加入业务敏捷性、成本效率和跨异构系统统一访问。但同一批来源也暴露了重要刹车。治理项目会失败，虚拟化人才稀缺，数据出口费用难预测，主权规则会切碎部署设计。第三方评测来源还补充了实际摩擦：Starburst
              可能资源消耗高，搭建可能复杂，超大或复杂查询如果管理不善，仍会带来性能问题。竞争挤压同样重要。Databricks、Dremio，甚至 Athena 都在走向更简单的界面、AI 驱动的查询体验和更广集成；这意味着
              Starburst 的市场顺风真实存在，但并非独享。尽调重点不是验证市场是否增长——它显然在增长——而是验证 Starburst 能否比大型平台厂商把该能力打包带走更快，拿下受监管、混合、治理负担重的那一片。
