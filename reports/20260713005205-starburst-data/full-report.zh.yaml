      - number: '2.2'
        title: 规模测算视角与细分经济性
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据方向上很强，但还不足以支撑一个精确 TAM。QY Research 估算全球数据虚拟化市场 2024 年为 $3.631B，并预计到 2031 年达到 $13.02B，CAGR 为
              20.3%。Mordor Intelligence 给出更大的视角：2025 年 $6.25B、2026 年 $7.46B、2031 年 $18.09B，CAGR 为
              19.38%。ResearchAndMarkets 提供相邻的湖仓视角，称数据湖仓市场从 2025 年 $10.33B 增至 2026 年 $12.58B，CAGR 为
              21.8%。这些数字不能互换，但合在一起支撑一个结论：相关品类已经是数十亿美元级，并仍以每年约 20% 的速度复合增长。Mordor 的分项数据也有助于收窄真实切入口。大型企业占 2025 年数据虚拟化收入的
              58.25%，BFSI 占 31.12%；North America 拿下 38.25% 收入，Asia-Pacific 是增长最快地区。对 Starburst 而言，这指向的不是泛 SMB
              分析故事，而是大型企业、受监管、混合数据机会，并带有明显全球扩张选择权。
