          - type: paragraph
            body: >-
              最重要的纪律约束是：已抓取记录中，最后一个完整披露的公司特定估值锚点，仍是 2022 年 2 月那轮 $3.35B 融资；当时 Starburst 称已完成 $250M 融资、累计融资 $414M。2025 年
              Citi 战略投资证实投资者和客户兴趣仍在，但公开资料没有披露支票规模、估值或结构。到 2026 年 2 月，公司 ARR 已突破 $100M、增长接近 40%，因此当前企业价值支撑强于 2022
              年锚点是合理推断。但这仍只是推断，不是已披露的市场事实。严格按公开数据，$3.35B 除以已披露 ARR 下限，意味着 EV/ARR 倍数最高 33.5x；如果当时 ARR 已高于
              $100M，真实倍数可能更低；若采用更早收入基数，则可能显著更高。因此，估值立场必须保持区间化，并对价格敏感。公开证据支持它是一项有价值资产，但不足以给出 2026 年的单一精确估值标记。
            claimRefs:
              - CV011
