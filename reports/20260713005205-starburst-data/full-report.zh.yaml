      - number: '1.4'
        title: 里程碑、证据点与反向背景
        blocks:
          - type: paragraph
            body: >-
              里程碑时间线显示，公司一边持续扩展产品范围，一边守住反数据搬运的核心信息。2022 年 Series D 让 Starburst 的开放湖仓和 Galaxy 叙事正式成形；2025 年带来 Citi
              战略投资和创纪录的 FY25 收官；2026 年又加入 AIDA、Enterprise Intelligence Platform、NVIDIA Vera 优化，以及公开的 $100M ARR
              门槛。客户证据足以支撑概览层面的判断：Lockheed Martin 报告 60% 制造站点已集成，并管理 100+ TB 遥测数据；Talkdesk 报告 P99 查询时间加快 85%、错误率降低 150
              倍；Checkatrade 报告处理速度加快 60%，35% 员工采用自助服务；Thinksurance 报告查询加快 80%、运营成本降低 20%。反向面不构成生死问题，但确实存在。Starburst
              的安全公告页记录了 2025-2026 年持续的漏洞和升级通知；PeerSpot 的对比评测数据表明 Starburst 的市场关注份额明显低于
              Databricks，并承认部署复杂度更高；外部安全监测供应商仍在维护该公司的实时风险报告。正确结论是：Starburst 有清晰证据和动能，但执行与安全负担也不小，后续风险和估值工作不能轻描淡写。
