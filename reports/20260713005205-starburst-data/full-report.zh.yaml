      - number: '4.3'
        title: 资本充足性、投资需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Starburst 已披露的资本历史表明，公司拿到过足够外部资金来搭建严肃的企业平台，但公开证据太薄，无法计算现金跑道。2022 年 Series D 让总融资达到 $414M，估值
              $3.35B；第三方数据和公司自己的公告确认，2025 年 5 月又获得 Citi 战略投资，只是规模和估值未披露。一份 New York 商业实体备案还确认 Starburst Data, Inc. 在
              2024 年 2 月以外州商业公司身份在该州注册，但备案没有提供资产负债表或盈利能力细节。运营端，公司显然仍在投入产品、生态和 GTM 扩张：新增工程和区域负责人，推出新的 AI
              能力，加深伙伴集成，并持续拓宽湖仓基础设施。这正是成长阶段基础设施公司应当花的钱，但也意味着不能因为 ARR 已超过 $100M
              就假设烧钱速度很低。缺少现金余额、债务或盈利披露时，正确财务立场是：Starburst 很可能具备有意义的历史资本化，也许还有战略灵活性；但如果增长、利润率或 AI
              相关投资需求发生实质变化，融资依赖不能排除。因此，后续估值工作应把资本充足性视为可信但未证实。
