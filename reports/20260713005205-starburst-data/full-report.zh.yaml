      - number: '5.2'
        title: Trino 联邦、Iceberg 运维和托管部署层拼出架构
        blocks:
          - type: paragraph
            body: >-
              公开信息足够具体，可以在不猜内部实现的前提下勾勒技术架构。Trino 提供分布式 SQL 和查询联邦核心；Starburst 在其上加入围绕连接器、治理、部署工作流、支持，以及自托管或 SaaS
              运营模式的企业包装。文档展示三类主要用户画像——数据消费者、数据工程师和平台管理员——这是有用信号，说明产品为运营角色而建，而不是只服务单一分析师画像。Icehouse 和 Galaxy 相关发布围绕
              Apache Iceberg 加入另一层架构：自动维护、流式摄取、文件加载、查询路由，以及成本 / 性能控制。这让 Starburst 不像一层薄 SQL
              外壳，更像一个有明确架构取向的联邦湖仓分析运行环境。代价是依赖更深。Starburst 依赖 Trino 发布节奏、连接器行为、Apache Iceberg
