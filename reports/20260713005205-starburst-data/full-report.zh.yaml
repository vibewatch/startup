      - number: '3.4'
        title: 护城河耐久度、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              Starburst 的护城河可信，但不永久。最强的耐久资产是与 Trino 及更广开放查询生态的同向性；公司声称自己拥有最大的 Trino 专家队伍，并贡献主导份额的
              commits。客户如果因主权、成本或运营原因不能把所有东西迁到单一厂商，免强制搬动数据的混合访问也是一个真实楔子。客户故事进一步证明，这个楔子能带来大幅性能或成本收益。不过，护城河正被多面挑战：Databricks
              和 Dremio 在走向 AI 辅助 SQL 和更丰富语义层；超大规模云厂商可以把“足够好”的联邦或跨引擎访问打包进更大的合约；评测来源仍在一些场景中把 Starburst
              描述为资源消耗高或运维复杂。由此带来的竞争风险不是马上商品化，而是在 Starburst 不能持续把 Trino 深度、治理成熟度和伙伴开放性转化成更易部署、更清晰 ROI 时，感知差异化会逐步收窄。尽调问题不是
              Starburst 有没有护城河，而是这条护城河的复利速度，能否快过平台捆绑和产品趋同的侵蚀。
