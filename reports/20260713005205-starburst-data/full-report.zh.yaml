  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              Starburst 并不落在一个干净的单一市场桶里。产品叙事横跨开放湖仓基础设施、数据虚拟化或联邦、分析查询加速，以及面向 AI 的治理型数据访问。因此，合理的市场边界应包括查询引擎、联邦访问层、语义 /
              治理叠加层，以及让企业不用先集中每一个字节就能分析分布式数据的相邻工作负载管理软件支出。边界外则是传统 BI 前端、原始云对象存储、通用 ETL
              工具，以及只与联邦能力有附带关系的全栈数据仓库支出。这个边界重要，因为现有替代方案仍然是集中化：买方可以把更多工作负载推入 Snowflake、Databricks 或某个云数据仓库，用 Athena
              以更低成本在 S3 原地跑 serverless SQL，或继续采用 DIY Trino 加内部工具。Starburst 的论点是，混合型企业越来越需要在数据仓库、数据湖、运营数据库和 AI agents
              之间保留选择权，联邦访问会从单一数据仓库里的功能，变成独立预算项。公司对比页面以及强调逻辑数据织物、数据网格和开放湖仓采用的第三方市场研究，都支持这一框架。
