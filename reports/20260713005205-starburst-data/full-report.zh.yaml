      - number: '8.4'
        title: 乐观情景站得住，但未披露数据仍可能大幅改变结论
        blocks:
          - type: paragraph
            body: >-
              乐观情景很清晰：Starburst 成为大型受监管企业里持久的商业化 Trino 与联邦 AI 层，继续拿下大客户，扩大 AI
              相关用量，并在复杂度上升时守住利润率质量。悲观情景也很清晰：最大客户贡献过于集中，服务或支持负担稀释软件式利润率，或者更大平台的捆绑替代方案挤压扩张和估值。公开记录无法裁定这场争论，因此最终建议必须跟着证据走。剩余尽调问题不是装饰项。投资者仍需要当前
              ARR 结构、GRR、分群留存、客户集中度、利润率画像、现金续航，以及 2025
              年融资的经济条款。缺少这些信息，资产仍可能不错，价格也仍可能错。基于公开资料，正确立场应是：「价格合理；只有尽调确认质量，才有上行空间」。
