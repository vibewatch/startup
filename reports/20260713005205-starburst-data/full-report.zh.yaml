chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Starburst 的核心身份在官网、关于页面、产品页和 2025-2026 年发布中保持一致：公司销售一个联邦式企业数据平台，让客户在数据原地查询和治理，而不是先把所有数据集中起来。公司把这种架构包装成建立在
              Trino 和 Apache Iceberg 之上的企业智能或湖仓侧 AI 底座，部署形态覆盖云 SaaS、自托管环境和混合架构。平台故事不是概念化叙事，而是已经产品化。Starburst 的定价页确认
              Galaxy 采用基于用量的模式并提供年度承诺折扣；连接器页面称平台支持 50+ 个企业数据源；数据产品材料强调不用搬动数据也能做策略、血缘、脱敏和共享。2025-2026 年的规模信号明显强于 2022
              年融资公告时。2026 年 2 月 ARR 公告称 Starburst 已超过 $100M ARR，AI 年运行率达到 $20M，美国以外业务翻倍，并在金融服务领域快速扩张；Tracxn 报告截至 2026 年
              5 月有 544 名员工。即便如此，我们审阅的公开记录仍没有直接披露客户数，因此后续章节在管理层提供可作分母的队列数据前，应把足迹主张当作方向性信号。
