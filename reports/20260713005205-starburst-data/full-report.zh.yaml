  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Starburst 的公开材料支持一个多收入流的企业软件模型，而不是单一狭窄产品销售。最清晰的变现引擎是 Starburst Galaxy，它采用消费型 credits 和年度承诺。这意味着基于用量的 SaaS
              收入，并在规模化时带有某些合同最低额或折扣。与此同时，Starburst Enterprise 是面向更受控的私有云、混合和本地部署环境销售的自托管产品，指向捆绑企业支持的订阅或期限许可收入。公司
              2025-2026 年产品节奏——AIDA、Enterprise Intelligence Platform、数据产品和 streaming-Iceberg 能力——显示，增购机会更可能来自 AI
              驱动工作负载和治理负担重的用例，而不是仅靠核心查询商品化。客户故事提供第二个有用视角：很多案例提到大额成本节省、基础设施简化或性能大幅提升，这支持客户愿意为高价值生产用例付费。仍不清楚的是，纯软件订阅 /
              消费、专业服务、伙伴影响收入，以及支持密集型定制交付之间的比例。这个组合很重要，因为 Starburst 的架构能解锁高价值结果，但复杂企业部署也可能比轻量云工具拉入更多服务和启用支持。
