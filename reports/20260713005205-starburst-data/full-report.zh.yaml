  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管和隐私面可见，但不足以完全去风险
        blocks:
          - type: paragraph
            body: >-
              好消息是，相比很多私有基础设施供应商，Starburst
              公开暴露了更多政策和控制面。它有公开隐私政策、公开条款页、公开信任中心和公开安全公告页。这很重要，因为它显示管理层预期企业买方会严肃追问数据处理、法律条款和事件响应。坏消息是，可见不等于闭环。隐私政策明确称
              Starburst 会收集运营和产品使用数据，可能包括查询细节、性能数据和标识符，并且在法律程序下可以与服务提供商、合作伙伴或主管机关共享数据。这对企业 SaaS
              或平台软件并不罕见，但确实制造了真实的隐私、治理和合同尽调工作，尤其在受监管客户细分中。已抓取来源没有显示活跃公开执法或诉讼，但也没有提供投资人完全判断数据保护、数据处理或责任分配风险所需的合同层或审计层细节。
