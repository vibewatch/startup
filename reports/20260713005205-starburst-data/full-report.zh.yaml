  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合很宽，但金融服务在战略上最突出
        blocks:
          - type: paragraph
            body: >-
              Starburst 的公开客户基础横跨多类企业细分，但公司自己的披露尤其强烈地指向金融服务及其他受监管、数据密集型账户。2026 年 ARR 公告称，Starburst 与 Americas
              前五大银行中的四家、EMEA 前十大银行中的七家有合作关系；2025 年 FY25 公告称客户包括全球前 15 大银行中的 10
              家。案例研究把这幅图从银行扩展到医疗、通信、媒体、工业、公共部门和数字原生软件环境。证据也相对清楚地揭示了买方-用户-付款方模式。买方通常是在复杂环境中运营的高级数据平台或分析负责人；用户是需要治理型分布式数据访问的分析师、工程师、数据科学家和业务团队；付款方看起来是与分析、AI、风险或运营效率绑定的企业
              IT 或业务线预算。这一点重要，因为 Starburst 不是卖给好奇心驱动的团队。它落地在数据访问、治理和性能会直接影响生产工作流的环境里。
