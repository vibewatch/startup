      - number: '3.2'
        title: 能力对比与产品范围差异
        blocks:
          - type: paragraph
            body: >-
              品类内的能力宽度正在收敛，但各家重心仍不同。Databricks 推销完整湖仓，带 AI 驱动 SQL 编写、原生摄取、数据共享、质量监控和强吞吐经济性。Starburst 把 Snowflake
              的数据仓库主导模式描述为小规模时简单，但数据量和并发增长后成本更高、管理更重。Dremio 强调智能体分析、AI 语义层、联邦查询，以及围绕 Apache Polaris 打造的开放 catalog。Athena
              聚焦 serverless SQL 和按用量付费的简单性，而不是更深的语义或治理能力。Starburst
              自己的对比页面强调混合部署、开放格式、治理控制和避免重复管道。因此，客户需要跨分布式系统做广域访问、执行策略并保留运营选择权时，Starburst 最强；客户已经接受全面集中到超大规模湖仓，或只想要最轻量的
              serverless 答案时，Starburst 较弱。2026 年真正的功能竞赛不只是 SQL 语法或基准速度，而是产品能否同时支撑 AI 时代的语义、治理、成本控制和运营简单性。
