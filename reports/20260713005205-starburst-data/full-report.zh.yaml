            body: >-
              Starburst 的架构和 GTM 模型依赖一张外部参与者网络。技术核心是 Trino；它的开源健康度是资产，也是依赖，因为 Starburst
              的企业价值主张部分建立在成为该生态的商业化层之上。核心之外是主要云、dbt Cloud 等伙伴集成，以及 DataGalaxy 等语义或治理伙伴。OSI
              倡议又带来另一项依赖：开放语义标准如果成功，Starburst 会受益于更宽的中立生态；但如果标准分裂，语义控制权和互操作性仍会悬而未决。客户依赖是故事的另一半。公开材料反复强调大型银行和其他受监管企业。这对
              ACV 质量是正面信号，但也提高了一个风险：相对少数的大型机构可能影响续约压力、采购时间线或产品路线图需求。公开来源没有反驳这个风险；它们更多是在揭示风险为何可信。
