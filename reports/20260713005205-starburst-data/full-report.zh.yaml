      - number: '4.4'
        title: 公开财务缺口与临时财务结论
        blocks:
          - type: paragraph
            body: >-
              公开结论是，Starburst 看起来商业规模扎实，但财务披露仍不足。正面证据包括 >$100M ARR、130% 净美元留存率、高客均 ARR、多份八位数企业合同、强金融服务牵引力，以及暗示可衡量 ROI
              的案例研究结果。这些指标符合一个真实企业软件业务，而不是投机型基础设施押注。不过，开放问题仍然很大：软件与服务收入比例、毛利率、按队列划分的净收入留存、除一个已披露 NDR
              数字之外的续约率、头部客户集中度、现金烧钱、现金跑道、债务，以及 2025 年 Citi 轮的经济条款。也没有公开迹象说明 AI
              运行率贡献到底是高毛利增量用量，还是昂贵的启用支持型收入。因此，合适的财务结论是谨慎正面。Starburst
              似乎已有真实规模和有吸引力的商业信号，但任何超出“可信的成长阶段基础设施公司”的投资判断，仍需要管理层会议中的 KPI 披露，而不是基于公开资料外推。
