  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 质量判断建设性，但价格必须克制
        blocks:
          - type: paragraph
            body: >-
              公开证据支持正面的公司质量判断，也支持带条件的估值判断。Starburst 不是投机概念公司。它已经跨过 $100M ARR，披露 130% 净美元留存率，展现大型银行牵引力，并在 Trino
              之上搭出真实产品栈。这些要素足以支撑一套战略溢价叙事。问题在于，价格纪律仍比公司质量更重要。公开记录没有披露 GRR、流失、客户集中度、毛利率、烧钱速度、债务，或 2025 年 Citi
              战略投资的确切条款。因此，正确建议不是“不计价格买入”。它是一种有条件的正面立场：如果进入价格克制、尽调权利强，则建设性看待；但不愿用激进溢价来假设所有隐藏经济性都优秀。换句话说，Starburst
              可信到不能轻易放弃，但披露又不足以把它视为已去风险。除非额外私域数据提高投资判断质量，投资人应更接近“合理到略贵”，而不是“明显便宜”。
