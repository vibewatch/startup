      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Starburst 仍然清晰地由创始人主导。官方关于页面列出 Justin Borgman 为创始人兼 CEO，把他的背景连接到 Hadapt 和 Teradata，并把他放在开放分析、治理型 AI
              和数据联邦市场叙事的主要发声位置。同一页面还公开列出 Matt Fuller、Kamil Bajda-Pawlikowski、Martin Traverso、Piotr Findeisen
              以及几位其他早期技术负责人在创始人名单中；这一点重要，因为 Starburst 的差异化紧贴 Trino 生态，而不只是商业化包装。公开材料还显示董事会有外部投资人代表，包括关于页面展示的 Index
              Ventures 的 Shardul Shah 和 Coatue 的 Caryn Marooney，但公司没有发布完整、最新的董事名单、委员会结构、投票控制图或持股比例。多轮大额风险融资和 2025 年 Citi
              战略投资之后，治理权利仍是真实尽调缺口。因此，关键人依赖最好定为中到高：公司技术梯队很深，但 Justin Borgman 仍是外部战略与品类定义的主导面孔，而公开控制权披露远落后于公司规模。
