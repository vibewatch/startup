companyProfile:
  summary: >-
    Starburst Data 是一家总部在 Boston 的数据平台公司，围绕联邦式 SQL、对分布式数据的治理型访问，以及 Trino
    的商业化承接搭建业务。公开材料把平台定位成企业层：数据在哪里，就在哪里查询，而不是先复制到单一数据仓库。产品组合覆盖 Starburst Galaxy、Starburst Enterprise、数据产品、AIDA、Icehouse
    和 Enterprise Intelligence Platform。经验证的融资证据显示，公司在 2022 年以 $3.35B 估值完成 $250M Series D，当时披露累计融资 $414M；2025 年 5 月又宣布获得
    Citi 战略投资。
