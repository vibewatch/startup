      - number: '4.2'
        title: 牵引力质量与单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据不是完整报表，而是收入质量代理指标。2026 年 2 月，Starburst 称已超过 $100M ARR，AI 年运行率达到 $20M，并交付近 40% 年同比增长。同一公告还披露 130%
              净美元留存率，这是整份报告中最好的公开质量信号之一，因为它意味着现有账户在显著扩张。2025 年 2 月 FY25 公告补充了更多纹理：净新增客户增长 20%、Galaxy 客户增长 76%、Galaxy
              采用增长 94%、客均 ARR 超过 $325k，以及公司史上最大交易——与一家全球金融机构签下多年期、年合同额八位数的合同。这些不是完整单位经济性，但确实指向企业级
              ACV、先落地后扩张的动作，以及在受监管账户中的不小定价权。独立评测聚合方提供了有用制衡，因为它们指出超大 Starburst
              工作负载可能资源消耗高、运维复杂，意味着用量扩张可能伴随真实基础设施和启用成本。公开披露仍没有揭示毛利率、按产品划分的贡献毛利、获客成本（CAC）、销售效率、回本周期或服务强度。因此，取决于仍在私域里的指标，公司既可能看起来像一个非常高效的软件资产，也可能更像一个运营强度更高的企业平台。
