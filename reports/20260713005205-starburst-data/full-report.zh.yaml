      - number: '1.3'
        title: 融资历史、资本形成与已披露牵引力
        blocks:
          - type: paragraph
            body: >-
              资本历史有两个已清楚验证的阶段，以及一个只披露了部分信息的延伸。2022 年 2 月，Starburst 宣布由 Alkeon Capital 领投、以 $3.35B 估值完成 $250M Series
              D，累计融资达到 $414M，并把公司与一组重量级投资人绑定在一起，其中还包括 Altimeter、B Capital、Andreessen Horowitz、Coatue、Index Ventures 和
              Salesforce Ventures。第三方 Tracxn 页面佐证了这些总额，并列出一笔 2025 年 5 月 19 日、与 Citi Impact Fund 有关的 Series D
              事件；Starburst 自己的 2025 年 5 月新闻稿则只把该轮描述为 Citi 通过 Markets Innovation & Investments 部门作出的战略投资，没有披露规模或估值。这让
              2025 年在战略上重要，但财务信息不完整。运营牵引力在 2025 年 FY25 和 2026 年 ARR 公告中可见度高得多：Starburst 披露净新增客户增长 20%、Galaxy 客户增长
              76%、Galaxy 采用增长 94%、客均 ARR 超过 $325,000、一份多年期、年付八位数级银行合同、130% 净美元留存率，并在超过 $100M ARR 的同时实现近 40% 年同比 ARR
              增长。投资判断很直接：公司商业上真实且仍在快速增长，但没有管理层访问，公开投资人无法独立评估收入结构、毛利率、烧钱速度或轮次经济性。
