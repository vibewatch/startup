  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态对应清晰的用户任务
        blocks:
          - type: paragraph
            body: >-
              Starburst 的产品定义更像联邦式数据访问与治理栈，而不是单一分析 SKU。公开材料显示，Galaxy 是云原生操作界面，Starburst Enterprise Platform
              是自托管部署选项，连接器是通向 50 多个数据源的访问边界，数据产品则是可复用数据集的治理型包装层。产品故事进一步扩展到 AI，加入 Starburst AI Agent、AI Workflows
              和更宽的企业智能定位；但这些功能仍依赖同一项核心任务：让用户不用把数据搬到单一中央数据仓库，也能治理式访问分布式企业数据。这一点重要，因为买方购买的不是孤立的查询速度。他们购买的是一种方式，让分析师、工程师、管理员和
              AI 导向团队在混合环境中发现、治理、查询并运营数据，同时保留架构选择权。放到工作流里，Starburst 位于原始异构系统与面向业务的消费层之间，后者包括 BI 工具、数据产品和 AI 应用。
