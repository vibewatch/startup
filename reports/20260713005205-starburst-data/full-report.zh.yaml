      - number: '5.4'
        title: 信任面清晰可见，但补丁和治理义务也是产品负担
        blocks:
          - type: paragraph
            body: >-
              对一家私有基础设施供应商而言，Starburst 的可见度反常地高，因为它公开暴露了多个信任和运营控制面。SEP 安全公告页列出具体
              CVE、受影响产品、缓解步骤和已修复版本；隐私政策解释公司收集哪些网站和产品使用数据；Galaxy 子处理方页面列出多家托管、可观测性、CRM、分析、支付和 AI
              相关第三方。这些都是有意义的运营成熟度信号，因为它们让买方可以审计。它们也暴露了不小风险。自托管 SEP 客户仍承担主机补丁、版本升级和连接器安全责任；Galaxy 背后则依赖庞大供应商生态。新的 AI
              功能放大了这一点：企业买方担心合规、成本超支和不受控访问，Starburst
              正是因此加入治理、监控和模型控制层。尽调缺口不是公司是否考虑信任——它显然考虑了。缺口在于，公开材料还没有提供与营销路线图同等粒度的独立基准 uptime、事件历史深度或外部审计认证细节。
