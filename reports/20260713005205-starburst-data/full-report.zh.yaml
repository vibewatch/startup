            body: >-
              Starburst 客户故事最强的部分，是具名生产案例密集，而且带有可量化结果。Lockheed Martin 描述了超过 100 TB、1,000 多台连接设备的制造遥测集成。Checkatrade
              引用处理速度加快 60%，并让 35% 员工获得自助洞察。Thinksurance 报告查询速度加快 80%、成本降低 20%；Banco Inter 报告在 12,000 多用户环境中每月节省超过
              $100,000。Optum 提到查询加快 10 倍和预计节省；Kovi 报告临时查询和 ETL 作业加快，同时 S3 GET 成本下降；OCBC 称其淘汰 700 多条管道，并让查询性能提升 3
              倍。AppsFlyer、doxo、Halliburton、Bank Hapoalim 和 Domino Data Lab 提供了第二层重要证据：Starburst
              不只是用来加速一个看板，而是在简化多系统数据访问、减少重复管道；这正是企业会反复付费的结果。这些引用不能完美证明留存，但明显好过没有用例细节的客户 logo 页。
