      - number: '3.3'
        title: 定价、包装与 GTM 能力
        blocks:
          - type: paragraph
            body: >-
              定价和包装差异会实质影响赢单率。Starburst 定价页确认 Galaxy 采用基于用量的 credit 模式和年度承诺折扣，这让它对齐现代消费型经济学，但实际企业价格仍不透明。Athena
              明确主打按查询运行量或计算使用量付费的简单性，降低 AWS 重度账户的评估摩擦。Databricks 主打与查询或计算用量挂钩的可预测定价；Starburst 的对比材料则称 Snowflake
              在规模化后往往变贵，并且 Starburst 可在合适工作负载下节省 50% 到 75% 云账单。这些都不能证明普遍的 TCO
              优势，但足以说明定价已经成了产品故事的一部分，而不只是采购细节。分销能力也差异明显。Databricks 和 Snowflake 受益于平台引力和庞大装机基础。Athena 受益于 AWS
              邻近性。Starburst 用 partner-connect 集成、dbt Cloud 互操作、面向 BigQuery 的 Google Cloud Ready 资质，以及围绕 Dell、NetApp
              和开放互操作性的更广生态故事来反击。这些动作提高了 GTM 相关性，但无法抹掉一个事实：在多数企业采购周期里，Starburst 仍是更小的分销机器。
