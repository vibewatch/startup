      - number: '8.3'
        title: 可比公司给出「高溢价基础设施」语境，但公开样本无法收窄不确定性
        blocks:
          - type: paragraph
            body: >-
              上市公司语境有助于框定机会范围，但不能解开核心不确定性。截至 2026 年 7 月，Snowflake 和 Datadog 的公开市场价值都在 $90B 左右，MongoDB 约 $27.5B，Confluent
              约 $11.1B。这些数字说明，市场仍愿意给已成规模的数据与开发者基础设施平台相当高的价值。但这些公司没有一家与 Starburst 的具体模式完全可比。Snowflake 更偏集中式云数仓，MongoDB
              是数据库平台，Confluent 更偏流式，Datadog 是可观测性软件。同时，Databricks、Dremio 和 Athena
              的竞品产品页显示，市场不会只因为「联邦查询」叙事就保留高溢价倍数；同行也在包装 AI、语义、摄取和成本性能故事。因此，可比公司的正确用法是提供背景，而不是套公式。它们支持「Starburst
              估值达到数十亿美元可以合理」这一判断，但如果没有更多经济性数据，并不能证明相对 2022 年锚点的每一次上修都合理。
