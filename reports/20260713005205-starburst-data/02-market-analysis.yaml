- id: sizing-lenses-and-segment-economics
  title: Sizing lenses and segment economics
  body: The public market-size evidence is directionally strong even if it is not precise enough to underwrite one exact TAM. QY Research values the global data virtualization market at $3.631B in 2024 and projects $13.02B by 2031 at a 20.3% CAGR. Mordor Intelligence offers a larger lens, estimating $6.25B in 2025, $7.46B in 2026, and $18.09B by 2031 at a 19.38% CAGR. ResearchAndMarkets provides an adjacent lakehouse lens, saying the data lakehouse market grows from $10.33B in 2025 to $12.58B in 2026 at a 21.8% CAGR. Those figures are not interchangeable, but together they support a conclusion that the relevant category is already multibillion-dollar and still compounding around 20% annually. Mordor’s segmentation also helps narrow the real wedge. Large enterprises represented 58.25% of 2025 data-virtualization revenue and BFSI represented 31.12%, while North America held 38.25% of revenue and Asia-Pacific was the fastest-growing region. For Starburst, that points less to a generic SMB analytics
    story and more to a large-enterprise, regulated, hybrid-data opportunity with meaningful global expansion optionality.
