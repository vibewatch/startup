  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: starburst-market-share
    missingEvidence: Current Starburst market share, pipeline share, or share by segment is not publicly disclosed.
    whyItMatters: A fast-growing market can still produce weak returns if the company’s share capture stalls or declines.
    diligencePath: Request internal segmentation of pipeline, ARR, and win-loss by competitor and vertical.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: tam-taxonomy
    missingEvidence: A management-approved TAM/SAM/SOM methodology that reconciles virtualization, lakehouse, and federation categories.
    whyItMatters: Different external taxonomies can make valuation narratives look larger or smaller depending on which bucket is chosen.
    diligencePath: Ask management to map revenue by product/use case against one consistent market taxonomy.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Implementation cost, services intensity, and time-to-value by segment.
    whyItMatters: These variables determine whether growth drivers translate into scalable and profitable adoption.
    diligencePath: Request deployment timelines, services attach rates, and first-value milestones by customer cohort.
