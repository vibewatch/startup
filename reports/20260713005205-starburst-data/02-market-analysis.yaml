tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Starburst
  rows:
  - - Open lakehouse infrastructure
    - Query engine, table-format operations, catalog/metadata, workload management
    - Raw cloud storage, pure BI tooling
    - Data platform / cloud budget
    - Directly relevant because Starburst sells open lakehouse access on Trino and Iceberg
  - - Data virtualization / federation
    - Logical access layer, connectors, caching, governance, query pushdown
    - ETL-only tooling and replication-first integration
    - Data architecture / integration budgets
    - Directly relevant because Starburst’s no-data-movement pitch maps here
  - - Analytics query acceleration
    - Distributed SQL performance, concurrency, cost optimization
    - Standalone dashboarding and visualization
    - Analytics engineering / platform ops
    - Relevant where Starburst wins on speed and infrastructure efficiency
  - - Governed enterprise AI data access
    - Semantic context, policy enforcement, trusted data products, agent connectivity
    - Model training infrastructure alone
    - AI platform / data governance budgets
    - Increasingly relevant based on 2025-2026 Starburst messaging
  - - Centralized warehouse / lakehouse substitute
    - Warehouse compute, ingestion, centralized storage contracts
    - Unrelated application software
    - Central analytics budget
    - Important substitute but not fully addressable Starburst revenue
  - - DIY open-source federation
    - Internal engineering time, self-managed Trino, community connectors
    - Commercial support or managed service
    - Engineering headcount budget
    - Status-quo substitute that caps willingness to pay for enterprise packaging
  notes: The boundary intentionally includes adjacent federation and lakehouse spend but excludes broad BI and storage categories that would overstate Starburst’s true addressable market.
