company:
  name: Starburst Data
chapter:
  number: 2
  title: Market Analysis
  summary: 'Starburst participates in the overlap between data lakehouse, data virtualization, analytics-query acceleration, and governed AI data-access markets. Public sizing lenses imply a large and fast-growing addressable category—roughly $7.46B for data virtualization in 2026, $12.58B for data lakehouse in 2026, and double-digit CAGR across adjacent segments—but the real buying wedge is narrower: large, regulated, hybrid enterprises that need governed analytics and AI without wholesale data migration. Demand is rising, yet governance failures, multi-cloud egress costs, and platform complexity keep adoption from being frictionless.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, adjacencies, and substitutes
  body: 'Starburst does not live in a single clean market bucket. Its product messaging spans open lakehouse infrastructure, data virtualization or federation, analytics-query acceleration, and governed data access for AI. The right market boundary therefore includes spend on query engines, federated access layers, semantic/governance overlays, and adjacent workload-management software that lets enterprises analyze distributed data without centralizing every byte first. It excludes classic BI front ends, raw cloud object storage, generic ETL tooling, and full-stack warehouse spend that is only incidentally related to federation. This boundary matters because the incumbent substitute is still centralization: buyers can push more workloads into Snowflake, Databricks, or a cloud warehouse, use Athena for cheaper serverless SQL over S3, or stay with DIY Trino plus in-house tooling. Starburst’s argument is that hybrid enterprises increasingly need optionality across warehouses, lakes, operational
    databases, and AI agents, making federated access a budget line of its own rather than a feature inside a single warehouse. That framing is supported by both the company’s comparison pages and third-party market research emphasizing logical data fabrics, data mesh, and open lakehouse adoption.'
