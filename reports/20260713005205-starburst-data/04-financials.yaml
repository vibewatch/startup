    - Ask for last four quarters of product mix and attach-rate trend
  - - Cash burn and runway
    - Determines financing dependency and downside protection
    - Request monthly cash flow and downside scenario plan
  - - Top-customer concentration
    - Determines fragility of reported large contract wins
