company:
  name: Starburst Data
chapter:
  number: 4
  title: Financials
  summary: Starburst’s public financial profile is stronger on revenue-quality proxies than on full financial statements. Verified disclosures show Starburst crossed $100M ARR in February 2026, reached 130% net dollar retention, nearly 40% year-over-year ARR growth, ARR per customer above $325k, and at least one multi-year eight-figure annual contract, while its 2022 Series D and 2025 Citi strategic investment indicate substantial historical capitalization. The central diligence problem is not whether revenue exists—it clearly does—but how much of that revenue is high-margin recurring software versus services, support, or unusually complex enterprise deployment work.
sections:
- id: revenue-streams-and-monetization
  title: Revenue streams and monetization logic
  body: 'Starburst’s public materials support a multi-stream enterprise software model rather than a single narrow product sale. The clearest monetization engine is Starburst Galaxy, which uses consumption-style credits and annual commitments. That implies usage-based SaaS revenue with some contract minimums or discounts at scale. Starburst Enterprise, meanwhile, is a self-managed product sold into more controlled private-cloud, hybrid, and on-prem environments, which points to subscription or term-license style revenue bundled with enterprise support. The company’s 2025-2026 product cadence—AIDA, Enterprise Intelligence Platform, data products, and streaming-Iceberg capabilities—suggests upsell potential into AI-driven workloads and governance-heavy use cases rather than mere core-query commoditization. Customer stories add a second useful lens: many cite large cost savings, infrastructure simplification, or dramatic performance gains, which supports willingness to pay for high-value production
    use cases. What remains unclear is the mix between pure software subscription/consumption, professional services, partner-influenced revenue, and support-heavy custom delivery. That mix matters because Starburst’s architecture can unlock high-value outcomes, but complex enterprise deployments can also pull more services and enablement into the revenue picture than a lightweight cloud tool would.'
