  rows:
  - - Starburst Galaxy
    - Usage-based SaaS consumption with annual commitments
    - Credits / compute consumption
    - Clearly disclosed and active
    - High if usage expands with NDR and AI workloads
    - Break out % of ARR from Galaxy and usage volatility by cohort
  - - Starburst Enterprise
    - Self-managed enterprise platform revenue
    - Subscription / support term
    - Clearly active but no public revenue mix
    - Potentially sticky with large controlled environments
    - Disclose on-prem versus cloud ARR mix and renewal profile
  - - Enterprise support / premium operations
    - Bundled or attached support revenue
    - Support contract / package
    - Implied by enterprise-grade positioning
    - Can improve retention but may mask services dependence
    - Quantify support attach and margin profile
  - - Professional services / implementation
    - Deployment, integration, architecture, enablement
    - Services fees
    - Not publicly disclosed as separate stream
    - Could accelerate adoption but dilute software margin
    - Show services % of revenue and pass-through partner share
  - - AI / semantic upsell
    - AIDA, enterprise intelligence, data-products-led expansion
    - Incremental consumption or add-on contract
    - Public AI ARR run rate of $20M disclosed
    - High growth potential but unclear margin quality
    - Break out AI ARR definition, attach rate, and incremental gross margin
  - - Partner-influenced ecosystem revenue
    - Marketplace, partner, or co-sell sourced demand
    - Co-sell / sourced ARR
    - Ecosystem clearly expanding, economics undisclosed
    - Could lower CAC if real sourced pipeline exists
    - Report sourced pipeline and closed-won contribution by partner
  notes: Only Galaxy consumption and aggregate AI ARR are explicitly public. The rest are inferred from product packaging, enterprise positioning, and deployment model and therefore require management-room validation.
