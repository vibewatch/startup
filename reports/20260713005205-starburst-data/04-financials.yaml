  - - Free trial / low-friction entry
    - 30-day trial with $500 credits and free clusters after downgrade path
    - Marketing entry price only
    - Conversion economics undisclosed
    - Improves top-of-funnel but not revenue predictability
  - - Enterprise term motion
    - Quote-led
    - Realized ACV visible only through proxy metrics like ARR/customer
    - Support / volume discount terms undisclosed
    - Implies negotiated pricing in larger accounts
  - - Eight-figure bank contract
    - Multi-year annual contract
    - No per-unit rate disclosed
    - Potential special commercial structure
    - Shows willingness to pay at top end
  - - Athena substitute
    - Pay by queries or compute used
    - Public and simple
    - Different scope and governance depth
    - Acts as low-friction price anchor in AWS accounts
  - - Databricks substitute
    - Predictable pricing based on queries or compute used
    - Public framing only
    - Actual enterprise discounting undisclosed
    - Competes for “one platform” budgets rather than pure federation budgets
  notes: This table compares monetization framing rather than apples-to-apples price points because realized enterprise rates are private across most of the category.
