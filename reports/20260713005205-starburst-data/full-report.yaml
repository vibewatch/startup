      - number: '1.2'
        title: Founders, leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Starburst remains visibly founder-led. The official about page names Justin Borgman as founder and CEO,
              ties his background to Hadapt and Teradata, and positions him as the principal spokesperson for the
              company’s market narrative around open analytics, governed AI, and data federation. The same page publicly
              surfaces Matt Fuller, Kamil Bajda-Pawlikowski, Martin Traverso, Piotr Findeisen, and several other early
              technical leaders in the company’s founder roster, which matters because Starburst’s differentiation is
              tightly linked to the Trino ecosystem rather than just commercial packaging. The public materials also
              show a board that includes outside investor representation, with Index Ventures’ Shardul Shah and Coatue’s
              Caryn Marooney displayed on the about page, but the company does not publish a fully detailed current
              board roster, committee structure, voting control map, or ownership percentages. That leaves a real
              diligence gap around governance rights after multiple large venture rounds and the 2025 Citi strategic
              investment. Key-person dependence is therefore best framed as moderate-to-high: the company has deep
              technical bench strength, but Justin Borgman remains the dominant external face of strategy and category
              definition while public control disclosures lag far behind the company’s scale.
            claimRefs:
