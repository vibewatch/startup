  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation is constructive on quality but disciplined on price
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a positive company-quality view and a qualified valuation view. Starburst is
              not a speculative concept company. It has crossed $100M ARR, disclosed 130% net dollar retention, shown
              large-bank traction, and built a real product stack on top of Trino. Those are the ingredients of an asset
              that can justify a premium strategic narrative. The problem is that price discipline still matters more
              than company quality. The public record does not disclose GRR, churn, customer concentration, gross
              margin, burn, debt, or the exact terms of the 2025 Citi strategic investment. So the right recommendation
              is not “buy at any price.” It is a conditional positive stance: constructive if entry discipline and
              diligence rights are strong, but unwilling to underwrite a heroic premium that assumes all hidden
              economics are excellent. Put differently, Starburst appears too credible to dismiss, but still too
              under-disclosed to treat as de-risked. Investors should lean toward fair-to-slightly-rich rather than
              obviously cheap unless additional private data improves the quality of the underwriting case.
            claimRefs:
              - CV001
