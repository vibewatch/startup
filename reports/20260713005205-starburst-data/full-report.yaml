      - number: '3.3'
        title: Pricing, packaging, and route-to-market power
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging differ in ways that materially shape win rates. Starburst’s pricing page confirms a
              usage-based credit model for Galaxy and annual-commit discounts, which aligns it with modern consumption
              economics but still leaves realized enterprise pricing opaque. Athena explicitly markets
              pay-based-on-queries-run or compute-used simplicity, lowering evaluation friction in AWS-heavy accounts.
              Databricks markets predictable pricing tied to queries or compute used, while Starburst’s comparison
              materials argue that Snowflake often becomes costly at scale and that Starburst can save 50% to 75% on
              cloud bills in the right workloads. None of that proves universal TCO superiority, but it does show how
              pricing becomes part of the product story rather than just a procurement detail. Distribution power also
              differs sharply. Databricks and Snowflake benefit from platform gravity and enormous installed bases.
              Athena benefits from AWS adjacency. Starburst counters with partner-connect integrations, dbt Cloud
              interoperability, Google Cloud Ready status for BigQuery, and a broader ecosystem story around Dell,
              NetApp, and open interoperability. Those moves improve route-to-market relevance, but they do not erase
              the fact that Starburst is still the smaller distribution machine in most enterprise buying cycles.
            claimRefs:
              - CP020
              - CP021
