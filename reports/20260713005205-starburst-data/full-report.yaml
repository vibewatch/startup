      - number: '4.4'
        title: Public financial gaps and provisional financial verdict
        blocks:
          - type: paragraph
            body: >-
              The public verdict is that Starburst looks commercially substantial, but still financially
              under-disclosed. Positive evidence includes >$100M ARR, 130% net dollar retention, high customer ARRs,
              multiple eight-figure enterprise contracts, strong financial-services traction, and case-study outcomes
              that imply measurable ROI. Those indicators are consistent with a real enterprise software business rather
              than a speculative infrastructure bet. Yet the open questions remain large: software versus services mix,
              gross margin, net revenue retention by cohort, renewal rates beyond the one disclosed NDR figure,
              top-customer concentration, cash burn, runway, debt, and the economic terms of the 2025 Citi round. There
              is also no public indication of whether the AI run-rate contribution is high-margin incremental usage or
              expensive enablement-led revenue. The proper financial conclusion is therefore cautiously positive.
              Starburst appears to have real scale and attractive commercial signals, but any underwriting decision
              beyond “credible growth-stage infrastructure company” still requires management-room KPI disclosure rather
