  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and privacy surfaces are visible but not fully de-risking
        blocks:
          - type: paragraph
            body: >-
              The good news is that Starburst exposes more policy and control surface area publicly than many private
              infrastructure vendors. There is a public privacy policy, a public terms page, a public trust center, and
              a public security-advisories page. That matters because it shows management expects enterprise buyers to
              ask hard questions about data handling, legal terms, and incident response. The bad news is that
              visibility is not the same as closure. The privacy policy explicitly says Starburst collects operations
              and product-usage data, potentially including query details, performance data, and identifiers, and that
              it can share data with service providers, partners, or authorities under legal process. That is not
              unusual for enterprise SaaS or platform software, but it does create real privacy, governance, and
              contractual diligence work—especially in regulated customer segments. The fetched sources do not reveal
              active public enforcement or litigation, but they also do not provide the kind of contract-level or
              audit-level detail an investor would need to fully underwrite data-protection, data-processing, or
              liability allocation risk.
