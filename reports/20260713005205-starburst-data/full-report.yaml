  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Starburst’s public materials support a multi-stream enterprise software model rather than a single narrow
              product sale. The clearest monetization engine is Starburst Galaxy, which uses consumption-style credits
              and annual commitments. That implies usage-based SaaS revenue with some contract minimums or discounts at
              scale. Starburst Enterprise, meanwhile, is a self-managed product sold into more controlled private-cloud,
              hybrid, and on-prem environments, which points to subscription or term-license style revenue bundled with
              enterprise support. The company’s 2025-2026 product cadence—AIDA, Enterprise Intelligence Platform, data
              products, and streaming-Iceberg capabilities—suggests upsell potential into AI-driven workloads and
              governance-heavy use cases rather than mere core-query commoditization. Customer stories add a second
              useful lens: many cite large cost savings, infrastructure simplification, or dramatic performance gains,
              which supports willingness to pay for high-value production use cases. What remains unclear is the mix
              between pure software subscription/consumption, professional services, partner-influenced revenue, and
              support-heavy custom delivery. That mix matters because Starburst’s architecture can unlock high-value
              outcomes, but complex enterprise deployments can also pull more services and enablement into the revenue
              picture than a lightweight cloud tool would.
