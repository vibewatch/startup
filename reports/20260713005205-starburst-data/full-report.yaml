      - number: '8.4'
        title: The bull case is credible, but the hidden data can still move the answer materially
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Starburst becomes the durable commercial Trino and federated-AI layer
              for large regulated enterprises, continues landing large accounts, expands AI-related consumption, and
              preserves margin quality despite complexity. The bear case is also straightforward: the company’s largest
              customers drive too much concentration, services or support burden dilute software-like margins, or
              bundled alternatives from larger platforms compress expansion and valuation. Because the public record
              cannot settle that debate, the final recommendation must stay evidence-sensitive. The remaining diligence
              asks are not cosmetic. Investors still need current ARR mix, GRR, cohort retention, customer
              concentration, margin profile, cash runway, and the economic terms of the 2025 round. Without those, the
              asset can still be good while the price can still be wrong. The correct public-source stance is therefore
              “fair, with upside only if diligence confirms quality.”
