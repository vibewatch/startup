      - number: '5.2'
        title: Architecture combines Trino federation, Iceberg operations, and managed deployment layers
        blocks:
          - type: paragraph
            body: >-
              The technical architecture is concrete enough in public to outline without guessing at internals. Trino
              provides the distributed SQL and query-federation core, while Starburst adds enterprise packaging around
              connectors, governance, deployment workflows, support, and self-managed or SaaS operating models. The docs
              show three primary user personas—data consumers, data engineers, and platform administrators—which is a
              useful sign that the product is built for operational roles rather than a single analyst persona. Icehouse
              and related Galaxy releases add another architectural layer around Apache Iceberg: automated maintenance,
              streaming ingest, file loading, query routing, and cost/performance controls. That makes Starburst less
              like a thin SQL veneer and more like an opinionated operating environment for federated lakehouse
              analytics. The tradeoff is dependency depth. Starburst depends on Trino release cadence, connector
              behavior, Apache Iceberg semantics, and major cloud infrastructure plus third-party subprocessors. Those
              dependencies are not disqualifying, but they create real implementation and operational surfaces that
              customers must manage or outsource to Galaxy.
