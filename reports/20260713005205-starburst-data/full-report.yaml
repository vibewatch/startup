  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, substitutes, and likely entrants'
        blocks:
          - type: paragraph
            body: >-
              The competitive map is broader than a standard category grid because buyers can solve the same problem in
              structurally different ways. Databricks and Snowflake are large platform substitutes that prefer
              centralizing data into a unified lakehouse or warehouse before analysis. Dremio competes more directly as
              an open-lakehouse and federation-oriented product with agentic analytics, semantic context, and an open
              catalog story. Amazon Athena is narrower but dangerous in AWS-centric footprints because it offers
              low-friction serverless SQL on data in place. Open-source Trino is the perpetual internal-build
              substitute, especially for engineering-heavy teams that can tolerate operational burden. Review and
              alternatives sources also surface Azure Databricks, Azure Synapse, Spark, and Denodo-like virtualization
              vendors as comparison points, but those are usually one step farther from Starburst’s core purchase
              decision than the top five. The key insight is that Starburst is rarely competing only on query speed. It
              is competing on whether an enterprise should centralize, federate, self-build, or buy a governance-heavy
              open data layer.
            claimRefs:
