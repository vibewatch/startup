      - number: '3.2'
        title: Capability comparison and product-scope differences
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is converging across the category, but the center of gravity still differs by rival.
              Databricks markets a full lakehouse with AI-powered SQL authoring, native ingestion, data sharing, quality
              monitoring, and strong throughput economics. Snowflake’s warehouse-led model is framed by Starburst as
              easy at small scale but increasingly expensive and administratively heavy as data and concurrency grow.
              Dremio emphasizes agentic analytics, an AI semantic layer, federated queries, and an open catalog built
              around Apache Polaris. Athena focuses on serverless SQL and pay-per-use simplicity rather than broader
              semantic or governance depth. Starburst’s own compare pages emphasize hybrid deployment, open formats,
              governance controls, and avoiding duplicate pipelines. That leaves Starburst strongest where customers
              need broad access across distributed systems with policy enforcement and operational choice, but weaker
              when customers already accept full centralization into a hyperscale lakehouse or want the lightest-weight
              serverless answer. The real feature contest in 2026 is therefore not just SQL syntax or benchmark speed,
              but whether the product can support AI-era semantics, governance, cost control, and operational simplicity
              at the same time.
