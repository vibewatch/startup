              debt, or the detailed economics of the 2025 Citi strategic round. The AI strategy also introduces classic
              execution risk: new capabilities, semantic-layer interoperability, and agentic workflows can expand the
              moat, but they can also increase delivery complexity, support burden, and cost to serve if not tightly
              controlled. Review sources make a similar point from the user side, describing powerful features alongside
              complexity, technical deployment burden, and meaningful resource consumption. The implication for
              investors is clear. The right mitigation is not to dismiss the company, but to insist on monitorable
              thresholds and direct diligence that can confirm whether security, concentration, and execution risks are
              staying inside an acceptable band.
