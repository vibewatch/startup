    Starburst Data is a Boston-based data-platform company built around federated SQL, governed access to distributed
    data, and commercial stewardship of Trino. Public materials position the platform as an enterprise layer for
    querying data where it already lives, rather than copying it into a single warehouse. The portfolio spans Starburst
    Galaxy, Starburst Enterprise, data products, AIDA, Icehouse, and the Enterprise Intelligence Platform. Verified
    financing evidence shows a $250M Series D at a $3.35B valuation in 2022, $414M total funding disclosed at that time,
    and a further Citi strategic investment announced in May 2025.
