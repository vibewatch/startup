chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Starburst’s core identity is consistent across its homepage, about materials, product pages, and 2025-2026
              releases: it sells a federated enterprise data platform that lets customers query and govern data where it
              already lives rather than centralizing everything first. The company frames this architecture as an
              enterprise intelligence or lakeside-AI foundation built on Trino and Apache Iceberg, with deployment
              options spanning cloud SaaS, self-managed environments, and hybrid architectures. The platform story is
              productized rather than conceptual. Starburst’s pricing page confirms a usage-based Galaxy model with
              annual-commit discounting, the connectors page says the platform supports 50+ enterprise data sources, and
              data-products materials emphasize policy, lineage, masking, and sharing without data movement. Scale
              signals are materially stronger in 2025-2026 than they were in the 2022 financing announcement. The
              February 2026 ARR release says Starburst passed $100M ARR, reached a $20M AI annual run rate, doubled
              business outside the U.S., and expanded quickly in financial services, while Tracxn reports 544 employees
              as of May 2026. Even so, customer count is still not directly disclosed in the public record we reviewed,
              so later chapters should treat footprint claims as directional until management supplies
              denominator-quality cohort data.
