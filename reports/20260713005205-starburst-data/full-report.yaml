      - number: '3.4'
        title: Moat durability, switching cost, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Starburst’s moat is credible but not permanent. The strongest durable asset is alignment with Trino and
              the broader open-query ecosystem, supported by company claims that it employs the largest Trino expert
              base and contributes a dominant share of commits. Hybrid access without forced data movement is also a
              real wedge when customers have hard sovereignty, cost, or operational reasons not to replatform everything
              into one vendor. Customer stories reinforce that this wedge can produce large performance or cost wins.
              However, the moat is challenged on multiple fronts: Databricks and Dremio are moving toward AI-assisted
              SQL and richer semantic layers; hyperscalers can bundle enough “good enough” federation or cross-engine
              access into larger contracts; and review sources still describe Starburst as resource-intensive or
              operationally complex in some cases. The resulting competitive risk is not immediate commoditization, but
              a gradual narrowing of perceived differentiation unless Starburst keeps converting Trino depth, governance
              maturity, and partner openness into easier deployment and clearer ROI. In diligence terms, the question is
              not whether Starburst has a moat. It is whether that moat compounds faster than platform bundling and
              product convergence erode it.
