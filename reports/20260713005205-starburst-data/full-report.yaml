      - number: '2.4'
        title: Growth drivers, adoption constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The strongest secular drivers line up well with Starburst’s pitch: AI-centric infrastructure spending,
              real-time analytics in regulated industries, shift toward data mesh and logical data-fabric models, and
              multi-cloud architectures that make wholesale replatforming slower and more expensive. Mordor explicitly
              calls out AI infrastructure, real-time analytics in regulated industries, mesh, marketplaces, and edge
              latency as growth drivers; QY Research adds business agility, cost efficiency, and unified access across
              disparate systems. Yet the same sources surface important brakes. Governance programs fail, virtualization
              talent is scarce, egress fees are unpredictable, and sovereignty rules fragment deployment design.
              Third-party review sources add practical friction: Starburst can be resource-intensive, setup can be
              complex, and very large or complex queries can still create performance issues if poorly managed.
              Competitive encroachment also matters. Databricks, Dremio, and even Athena are all moving toward simpler
              interfaces, AI-driven query experiences, and broader integration, which means Starburst’s market tailwind
              is real but not exclusive. The diligence implication is to test not whether the market is growing—it
              clearly is—but whether Starburst can capture the regulated, hybrid, governance-heavy slice faster than
              larger platform vendors can bundle it away.
