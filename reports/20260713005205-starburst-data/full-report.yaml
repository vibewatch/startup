      - number: '4.2'
        title: Traction quality and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence is around revenue quality proxies rather than complete statements.
              In February 2026 Starburst said it surpassed $100M ARR, reached a $20M AI annual run rate, and delivered
              nearly 40% year-over-year growth. The same release also disclosed 130% net dollar retention, which is one
              of the best public quality signals available in the whole report because it implies existing accounts are
              expanding meaningfully. The February 2025 FY25 release adds more texture: 20% net-new-customer growth, 76%
              Galaxy customer growth, 94% Galaxy adoption growth, ARR per customer above $325k, and the largest deal in
              company history—a multi-year eight-figure annual contract with a global financial institution. Those are
              not full unit economics, but they do suggest enterprise-grade ACVs, a land-and-expand motion, and
              non-trivial pricing power in regulated accounts. Independent review aggregators are a useful counterweight
              because they note that very large Starburst workloads can be resource-intensive and operationally complex,
              implying that usage expansion may come with real infrastructure and enablement costs. Public disclosures
              still do not reveal gross margin, contribution margin by product, CAC, sales efficiency, payback, or
              services intensity. That means the company may look like a very efficient software asset—or a more
              operationally intensive enterprise platform—depending on metrics that are still private.
