- id: financial-and-execution-risk
  title: Financial and execution risk remains elevated because disclosure is thinner than strategic narrative
  body: 'Starburst’s risk profile is not dominated by a single catastrophic legal issue in the fetched record. Instead, it is dominated by execution and disclosure asymmetry. The company looks strategically relevant, but the public record still does not reveal GRR, churn, customer concentration, cash balance, runway, debt, or the detailed economics of the 2025 Citi strategic round. The AI strategy also introduces classic execution risk: new capabilities, semantic-layer interoperability, and agentic workflows can expand the moat, but they can also increase delivery complexity, support burden, and cost to serve if not tightly controlled. Review sources make a similar point from the user side, describing powerful features alongside complexity, technical deployment burden, and meaningful resource consumption. The implication for investors is clear. The right mitigation is not to dismiss the company, but to insist on monitorable thresholds and direct diligence that can confirm whether security,
    concentration, and execution risks are staying inside an acceptable band.'
  claimRefs:
  - CR026
  - CR034
