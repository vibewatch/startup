  figureRefs:
  - FR001
- id: operational-security-and-reliability-risk
  title: Security and reliability risk is real because the product touches governed production data
  body: 'The strongest public adverse evidence comes from Starburst’s own security-advisories surface, which is valuable precisely because it shows real operational burden. The advisories make clear that Starburst tracks vulnerabilities affecting Galaxy, SEP, and included components, and that self-managed SEP customers still carry host-patching, upgrade, and hardening responsibilities. The official Galaxy status page and uptime page improve confidence by showing a live operational surface across AWS, Azure, and GCP regions, but they also highlight just how wide the cloud-operating footprint is. The subprocessors page adds a second layer of risk: Galaxy delivery depends on a substantial vendor ecosystem spanning hosting, observability, CRM, analytics, payments, and even AI-specific subprocessors. None of this means Starburst is unusually weak. In fact, visible disclosure is a positive sign. But it does mean the product belongs to the class of platforms where customers and investors should
    expect non-trivial operational, supply-chain, and security management obligations.'
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
