- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security / patching burden
    - Critical exploited product or dependency issue
    - Repeated severe advisories without rapid customer-safe remediation
    - Pause or materially re-price until incident posture is understood
  - - Cloud / service reliability
    - Service-quality deterioration
    - Major outage pattern or worsening uptime trend in core regions
    - Reduce confidence in managed-service economics and customer durability
  - - Financial-services concentration
    - Account concentration shock
    - Evidence that a few banks drive outsized ARR or one major renewal is at risk
    - Recast growth durability and valuation support
  - - AI execution overreach
    - Roadmap slippage or support overload
    - Preview features fail to convert into stable GA adoption
    - Cut upside from AI narrative and widen margin-risk discount
  - - Partner / ecosystem dependence
    - Material partner breakdown
    - Loss of major workflow partner, semantic alliance, or cloud go-to-market support
    - Lower distribution confidence and reassess moat
  - - Disclosure opacity
    - Key metrics stay unavailable
    - No direct data on GRR, concentration, cash runway, or incident history after diligence access
    - Prefer track / research-more over aggressive underwriting
  notes: Kill criteria convert today’s public-source ambiguity into monitorable diligence thresholds.
