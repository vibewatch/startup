company:
  name: Starburst Data
chapter:
  number: 7
  title: Risks
  summary: Starburst’s risk profile is shaped less by existential product doubt than by the realities of running a complex, security-sensitive, partner-reliant enterprise data platform at scale. The most important risks are security and patching burden, dependence on Trino and cloud-partner ecosystems, concentration in large regulated financial-services accounts, and under-disclosure on durability, concentration, and capital adequacy. Public trust, privacy, and uptime surfaces are better than those of many private infrastructure companies, but they are still insufficient to eliminate diligence risk without direct customer, contract, and control-review work.
sections:
- id: legal-regulatory-and-privacy-risk
  title: Legal, regulatory, and privacy surfaces are visible but not fully de-risking
  body: The good news is that Starburst exposes more policy and control surface area publicly than many private infrastructure vendors. There is a public privacy policy, a public terms page, a public trust center, and a public security-advisories page. That matters because it shows management expects enterprise buyers to ask hard questions about data handling, legal terms, and incident response. The bad news is that visibility is not the same as closure. The privacy policy explicitly says Starburst collects operations and product-usage data, potentially including query details, performance data, and identifiers, and that it can share data with service providers, partners, or authorities under legal process. That is not unusual for enterprise SaaS or platform software, but it does create real privacy, governance, and contractual diligence work—especially in regulated customer segments. The fetched sources do not reveal active public enforcement or litigation, but they also do not provide
    the kind of contract-level or audit-level detail an investor would need to fully underwrite data-protection, data-processing, or liability allocation risk.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR013
  - CR033
  - CR039
  tableRefs:
