- id: partner-open-source-and-customer-concentration-risk
  title: Partner, open-source, and customer dependencies create transmission risk into revenue and valuation
  body: 'Starburst’s architecture and go-to-market model depend on a web of external actors. At the technical core is Trino, whose open-source health is an asset but also a dependency because Starburst’s enterprise value proposition is partly built on being the commercial layer around that ecosystem. Around the core sit major clouds, partner integrations such as dbt Cloud, and semantic or governance partners such as DataGalaxy. The OSI initiative adds another dependency: if open semantic standards succeed, Starburst benefits from a broader neutral ecosystem, but if standards fragment, semantic control and interoperability remain unsettled. Customer dependence is the second half of the story. Public materials repeatedly emphasize large banks and other regulated enterprises. That is a positive signal for ACV quality, but it also raises the risk that a relatively small set of large institutions could shape renewal pressure, procurement timelines, or product roadmap demands. The public sources
    do not disprove that risk; they mostly reveal how plausible it is.'
  claimRefs:
  - CR014
  - CR015
  - CR016
