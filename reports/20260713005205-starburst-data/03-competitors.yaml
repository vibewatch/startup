    severity: material
    topic: realized-tco
    missingEvidence: Verified realized TCO outcomes across production accounts versus Snowflake, Databricks, Athena, and DIY Trino.
    whyItMatters: Pricing narratives can be persuasive but still fail after networking, services, and concurrency costs are counted.
    diligencePath: Obtain customer ROI studies or anonymized benchmark cohorts with methodology.
