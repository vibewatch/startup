  rows:
  - - Databricks
    - Centralized lakehouse / data + AI platform
    - High mindshare; large installed base; broad data + AI stack
    - Large enterprises standardizing on one lakehouse
    - AI-powered lakehouse with ingestion, SQL, sharing, and ML in one platform
    - Bias toward centralization can be expensive or slow for hybrid/no-movement use cases
  - - Snowflake
    - Cloud data warehouse / centralized data cloud
    - Massive enterprise footprint and strong warehouse brand
    - Analytics teams comfortable centralizing data into a warehouse
    - Simple initial experience and strong warehouse ecosystem
    - Cost and admin overhead can rise at scale; less natural fit for no-movement federation
  - - Dremio
    - Open lakehouse / federated analytics rival
    - Fast-moving private rival with semantic, open-catalog, and agentic story
    - Teams wanting open lakehouse access with semantic context
    - Strong open-lakehouse positioning and federated query support
    - Smaller ecosystem and distribution than hyperscaler-adjacent platforms
  - - Amazon Athena
    - Serverless query substitute
    - AWS-native service with low procurement friction
    - AWS-centric teams with narrower SQL-on-data-lake needs
    - Simple pay-per-use serverless SQL over data in place
    - Narrower governance, semantics, and cross-platform operating model
  - - DIY Trino
    - Open-source internal build
    - No license fee but high operational burden
    - Engineering-heavy enterprises with strong platform teams
    - Maximum flexibility and open-source control
    - Requires internal expertise for support, governance, and managed experience
  - - Azure Synapse / adjacent analytics platforms
    - Adjacent substitute
    - Microsoft ecosystem gravity
    - Azure-centric enterprise buyers
    - Bundled ecosystem and end-to-end cloud narrative
    - Not purpose-built around cross-platform federation
  notes: This table prioritizes the rivals most likely to appear in a real Starburst enterprise evaluation rather than an exhaustive list of every data product touching analytics.
