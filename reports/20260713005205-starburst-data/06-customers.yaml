- id: concentration-procurement-and-adverse-limits
  title: The public record supports expansion logic but not concentration safety
  body: 'The same evidence that makes Starburst’s customer story attractive also creates risk. The company’s strongest vertical is financial services, and the public record repeatedly emphasizes large banks, regulated institutions, and complex enterprise workloads. That is commercially attractive because such customers tend to value governance, performance, and architecture flexibility. It can also mean longer procurement cycles, deeper security review, and the possibility that a relatively small number of very large accounts account for a disproportionate share of ARR. External review and vendor-risk pages reinforce that point indirectly: they show that Starburst is the kind of enterprise platform subject to security questionnaires, operational diligence, and technical deployment scrutiny. Public references may also overweight best-fit customers—the ones with dramatic ROI and willing references—while telling us little about failed pilots, lost renewals, or customers that never expanded
    beyond one use case. The right conclusion is therefore balanced. Starburst appears genuinely referenceable and operationally useful in production, but any investment case still needs a direct read on concentration, renewal behavior, and procurement friction before treating the customer base as fully de-risked.'
