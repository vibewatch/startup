- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Financial services and banking
    - 'Buyer: data-platform leaders; users: analysts, fraud/risk teams, business users; payer: enterprise IT / analytics budget'
    - Federated analytics, anti-money laundering, risk, AI context layer
    - 4 of top 5 banks in the Americas; 7 of top 10 banks in EMEA; 10 of top 15 global banks; Banco Inter, OCBC, Bank Hapoalim
    - Highest strategic segment in public record; likely large ACVs and stickier governance needs
    - Need segment ARR and concentration by top financial accounts
  - - Healthcare and life sciences
    - 'Buyer: data platform and analytics leadership; users: analysts and data consumers'
    - Unified patient / claims / health-data access and faster analytics
    - Optum case study with 10x faster queries and projected savings
    - Important proof of regulated-data relevance beyond banking
    - Need count of active healthcare customers and renewal rates
  - - Telecom / media / communications
    - 'Buyer: enterprise data teams; users: analysts and operations teams'
    - High-volume event analytics and multi-source performance workloads
    - Talkdesk, Azercell, Sky customer references
    - Shows Starburst can support scale-sensitive digital workloads
    - Need production-account count and workload breadth
  - - Digital-native software and internet
    - 'Buyer: data engineering and BI teams; users: analysts and GTM teams'
    - Federated BI, dashboard acceleration, lower ETL complexity
    - AppsFlyer, Checkatrade, Thinksurance, doxo, Kovi, Domino Data Lab
    - Proves utility outside classic regulated incumbents
    - Need SMB / mid-market mix and ACV range
  - - Industrial / public-sector / infrastructure
    - 'Buyer: operations, manufacturing, or platform leadership; users: engineers and business users'
    - Manufacturing telemetry, operational analytics, plain-language access to data
    - Lockheed Martin, Halliburton, public-industry references
    - Shows Starburst can support operational as well as BI workloads
    - Need renewal history and implementation cycle detail
  notes: The segment mix is inferred from named references and company disclosures, with financial services the clearest strategic concentration.
