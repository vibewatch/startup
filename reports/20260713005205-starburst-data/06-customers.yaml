- id: retention-expansion-and-satisfaction-proxies
  title: Expansion signals are strong, but retention disclosure remains shallow
  body: 'Starburst does disclose several unusually helpful customer-quality proxies for a private company. The FY25 release says net new customers grew 20% year over year, Galaxy customer growth reached 76%, Galaxy adoption grew 94%, and ARR per customer exceeded $325,000. The 2026 ARR announcement adds 130% net dollar retention. Taken together, those signals imply a land-and-expand motion with meaningful expansion inside installed accounts and a customer base willing to trust Starburst with increasingly important workloads. Independent review sources add some support, but they are less authoritative than the company disclosures. PeerSpot shows a small but positive recommendation signal, while SelectHub aggregates review-site data into a high-level satisfaction statistic. The limitation is that almost every durability metric investors would want most remains absent: gross revenue retention, logo churn, renewal timing, contract length distribution, expansion by cohort, and top-customer concentration.
    So customer proof is strong on production references and reasonable on expansion, but weak on the exact metrics needed to underwrite durability with high confidence.'
