company:
  name: Starburst Data
chapter:
  number: 6
  title: Customers
  summary: Starburst has strong public customer proof across financial services, healthcare, media/telecom, industrial, and digital-native software, with named case studies that describe production workloads rather than logo-only marketing. The public record also shows meaningful installed-base expansion signals—20% net new customer growth, 76% Galaxy customer growth, 94% Galaxy adoption growth, and 130% net dollar retention—but it still withholds the metrics investors would want most, including GRR, churn, customer concentration, and segment-level renewal data. The result is a customer story that looks commercially credible and referenceable, but still under-disclosed on durability and concentration risk.
sections:
- id: segments-buyers-and-production-footprint
  title: Customer mix is broad, but financial services stands out as strategically central
  body: Starburst’s public customer base spans a wide mix of enterprise segments, but the company’s own disclosures point especially strongly toward financial services and other regulated, data-intensive accounts. The 2026 ARR announcement says Starburst has relationships with four of the top five banks in the Americas and seven of the top ten banks in EMEA, while the 2025 FY25 release says customers include 10 of the top 15 global banks. Case studies extend that picture beyond banking into healthcare, telecom, media, industrial, public-sector, and digital-native software environments. The buyer-user-payer pattern is also relatively clear from the evidence. Buyers are typically senior data-platform or analytics leaders operating in complex environments; users are analysts, engineers, data scientists, and business teams that need governed access to distributed data; and payers appear to be enterprise IT or line-of-business budgets tied to analytics, AI, risk, or operational efficiency. That
    is important because it means Starburst is not selling to curiosity-driven teams. It is landing in environments where data access, governance, and performance directly affect production workflows.
