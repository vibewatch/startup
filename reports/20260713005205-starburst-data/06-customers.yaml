- id: named-customer-proof-and-outcomes
  title: Named customer proof is operational and production-oriented, not just logo-heavy
  body: 'The strongest part of Starburst’s customer story is the density of named production references with measurable outcomes. Lockheed Martin describes integrated manufacturing telemetry across more than 100 terabytes and 1,000-plus connected devices. Checkatrade cites 60% faster processing and self-serve insights for 35% of employees. Thinksurance reports 80% faster query speeds and 20% lower costs, while Banco Inter reports more than $100,000 per month in savings for a 12,000-plus-user environment. Optum cites 10x faster queries and projected savings, Kovi reports faster ad-hoc queries and ETL jobs plus lower S3 GET costs, and OCBC says it eliminated 700-plus pipelines while improving query performance 3x. AppsFlyer, doxo, Halliburton, Bank Hapoalim, and Domino Data Lab add an important second layer of proof: Starburst is being used not merely to accelerate one dashboard, but to simplify multi-system data access and reduce duplicated pipelines, which are exactly the kinds of outcomes
    enterprises pay for repeatedly. These references are not perfect evidence of retention, but they are materially better than customer-logo pages without use-case detail.'
