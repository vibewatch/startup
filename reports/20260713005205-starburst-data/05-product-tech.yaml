- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Trino query engine
    - Distributed SQL and federation core
    - Open-source Trino roadmap and compatibility
    - Performance and feature inheritance depend on upstream evolution
  - - Connector layer
    - Access to warehouses, lakes, databases, and streaming systems
    - Source-system semantics and connector support depth
    - Connector edge cases can become deployment friction
  - - Apache Iceberg / Icehouse layer
    - Open table format, ingestion, maintenance, and optimization
    - Iceberg metadata behavior and object-storage patterns
    - Preview features may lag broad production hardening
  - - Governance and access controls
    - RBAC, ABAC, masking, lineage, and policy enforcement
    - Correct catalog configuration and identity integration
    - Misconfiguration can weaken data-governance outcomes
  - - Deployment models
    - Self-managed SEP or managed Galaxy operations
    - Customer platform teams or Starburst-managed cloud services
    - Operational burden differs sharply by deployment choice
  - - Third-party subprocessors and cloud services
    - Hosting, observability, CRM, payments, and AI support services
    - AWS, GCP, Azure and other vendors listed by Starburst
    - Vendor dependence increases procurement and compliance complexity
  notes: Public architecture evidence is sufficient to map major layers, but not every internal implementation detail.
