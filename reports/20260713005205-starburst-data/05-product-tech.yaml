- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Starburst Galaxy
    - Data platform teams and analysts
    - Mature commercial surface
    - Managed federated analytics with governance and elastic operations
    - Need public SLA, incident, and workload benchmark detail
  - - Starburst Enterprise Platform
    - Platform admins and data engineers
    - Mature commercial surface
    - Self-managed control for hybrid, private-cloud, and regulated environments
    - Need independent evidence on upgrade burden at large scale
  - - Connector layer
    - Data engineers
    - Mature core capability
    - 50+ sources with pushdown, dynamic filtering, and statistics support
    - Need connector-by-connector coverage and limitations map
  - - Data Products
    - Data producers and data consumers
    - Commercially active
    - Governed reusable packaging without data movement
    - Need stronger public proof of adoption depth by module
  - - Icehouse / Iceberg operations
    - Lakehouse platform teams
    - Commercially active and expanding
    - Streaming ingest, automated maintenance, and governance on open Iceberg
    - Need independent throughput and reliability benchmarks
  - - AI Agent / AI Workflows
    - Analysts, application teams, AI builders
    - Early public stage
    - Governed natural-language and model-to-data workflows on distributed enterprise data
    - Need GA timing, pricing, and customer-production references
  notes: The matrix separates long-established federation surfaces from newer AI and Iceberg-operating layers.
