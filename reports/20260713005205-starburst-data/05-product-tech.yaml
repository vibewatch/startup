  evidenceGaps:
  - type: missing-independent-proof
    severity: material
    topic: workload-benchmarks
    missingEvidence: Independent public benchmarks on Starburst implementation effort, uptime, and large-scale workload reliability remain sparse.
    whyItMatters: Product breadth is easier to verify than day-two operating burden, which often breaks large enterprise deployments.
    diligencePath: Request customer references, uptime history, support-SLA artifacts, and implementation retrospectives from large production accounts.
    relatedQuestionRefs:
    - QE023
    - QE024
    - QE025
    relatedTableRefs:
    - TE001
    - TE004
  - type: missing-independent-proof
    severity: material
    topic: ai-maturity
