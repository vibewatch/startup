company:
  name: Starburst Data
chapter:
  number: 5
  title: Product & Technology
  summary: 'Starburst’s public product stack is legible: Galaxy for SaaS deployment, Starburst Enterprise for self-managed environments, a wide connector layer, Icehouse/Iceberg operating features, governed data products, and a growing AI surface built on Trino. The strongest differentiator is not a hidden algorithm but a federated architecture that adds enterprise controls, governance, and integration depth on top of open-source Trino. The key technical risks are implementation complexity, dependence on cloud and ecosystem partners, and the fact that several newer AI features are still early in their public release cycle.'
sections:
- id: product-surface-and-user-jobs
  title: Product surface maps to concrete user jobs
  body: 'Starburst’s product definition is best understood as a federated data-access and governance stack rather than a single analytics SKU. Public materials show Galaxy as the cloud-native operating surface, Starburst Enterprise Platform as the self-managed deployment option, connectors as the access boundary to more than 50 data sources, and data products as the governed packaging layer for reusable datasets. The product story has expanded further into AI through Starburst AI Agent, AI Workflows, and the broader enterprise-intelligence positioning, but even those features still rely on the same core job: give users governed access to distributed enterprise data without moving it into one central warehouse. That matters because buyers are not purchasing query speed in isolation. They are purchasing a way for analysts, engineers, administrators, and AI-oriented teams to discover, govern, query, and operationalize data across hybrid environments while preserving architecture optionality.
    In workflow terms, Starburst sits between raw heterogeneous systems and business-facing consumption surfaces such as BI tools, data products, and AI applications.'
