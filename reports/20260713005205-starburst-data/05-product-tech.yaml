- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Starburst solution
  - Measurable benefit
  - Limitation
  rows:
  - - Access distributed enterprise data
    - Move or copy data into a warehouse
    - Federated query through Trino-based Galaxy or SEP
    - Less data movement and more architecture optionality
    - Performance varies by source, connector, and workload design
  - - Package reusable governed datasets
    - Repeated bespoke pipelines and handoffs
    - Data Products with lineage, masking, RBAC/ABAC, and access requests
    - More reusable governed consumption surfaces
    - Public production-adoption metrics are limited
  - - Query Iceberg lakehouse data at scale
    - Manual table maintenance and fragmented tools
    - Icehouse with automated maintenance and Trino execution
    - Faster analytics and lower operational overhead
    - Independent benchmark evidence is still sparse
  - - Ingest real-time data into lakehouse tables
    - Custom Kafka pipelines and multiple tools
    - Managed Kafka-to-Iceberg streaming ingest
    - Near-real-time ingestion with exactly-once guarantees
    - Operational behavior outside Starburst-managed paths is less visible
  - - Build AI-ready analytics workflows
    - Move data into isolated AI stacks
    - AI Agent, AI Workflows, vector access, and governed model usage
    - Keeps context and governance close to source data
    - Several capabilities remain in private or public preview
  notes: This table is workflow-based because buyers purchase operational outcomes, not feature lists.
