- id: trust-security-roadmap-and-gaps
  title: Trust surfaces are visible, but patching and governance obligations are part of the product burden
  body: 'Starburst is unusually visible for a private infrastructure vendor because it exposes several trust and operational-control surfaces publicly. The SEP security-advisories page names concrete CVEs, impacted products, mitigation steps, and remediated versions; the privacy policy explains what website and product-usage data the company collects; and the Galaxy subprocessors page identifies multiple hosting, observability, CRM, analytics, payments, and AI-related third parties. Those are meaningful signals of operational maturity because they create auditability for buyers. They also reveal non-trivial risk. Self-managed SEP customers still inherit host-patching, version-upgrade, and connector-security responsibilities, while Galaxy depends on a substantial vendor ecosystem behind the scenes. The newer AI features amplify that point: Starburst is adding governance, monitoring, and model-control layers precisely because enterprise buyers worry about compliance, cost overruns, and uncontrolled
    access. The diligence gap is not whether the company thinks about trust; clearly it does. The gap is that public materials do not yet provide independently benchmarked uptime, incident-history depth, or externally audited certification detail at the same granularity as the marketing roadmap.'
