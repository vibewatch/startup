summary:
  headline: >-
    Starburst appears to be a strong private data-infrastructure asset with real ARR,
    retention, and regulated-customer proof, but public disclosure gaps around retention
    cohorts, concentration, margins, cash, and round structure make research-more a more
    defensible call than an unconditional buy.
