  topStrengths:
    - 'Verified >$100M ARR, 130% net dollar retention, and nearly 40% ARR growth indicate real commercial scale rather than a narrative-only company'
    - 'Federated architecture and Trino stewardship provide a differentiated strategic position relative to centralized warehouse and lakehouse alternatives'
    - 'Financial-services proof is unusually strong, including relationships with top banks and large regulated-enterprise reference value'
    - 'Product breadth has expanded from federation into AI, data products, and interoperability narratives without abandoning the core anti-data-movement message'
    - 'Historical capitalization and sponsor quality suggest the company has been able to attract serious long-duration investors'
  topRisks:
    - 'Public evidence does not disclose GRR by cohort, top-account concentration, gross margin, cash, burn, debt, or the economics of the 2025 Citi round'
    - 'Competitive overlap with Databricks, Snowflake, Dremio, Athena, and other platforms could compress pricing power or expansion quality'
    - 'Federated-enterprise deployments can be operationally complex, creating risk that services or support burden dilutes software-like economics'
    - 'A security or reliability failure would directly undermine trust with the regulated customers that support the premium narrative'
    - 'The last fully disclosed valuation anchor is historical, so current pricing confidence still depends heavily on diligence rather than public evidence alone'
  unresolvedGaps:
    - 'Current ARR mix across Galaxy, Enterprise, AI, services, and support is not publicly disclosed'
    - 'GRR, churn, renewal timing, and top-customer concentration remain private'
    - 'Gross margin, cash balance, burn, debt, and profitability are not public'
    - 'The size, valuation, and structure of the 2025 Citi strategic investment are not public'
    - 'Public evidence does not support a verified current customer-count figure suitable for summary-card use'
