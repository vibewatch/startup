- id: milestones-customer-proof-and-adverse-context
  title: Milestones, proof points, and adverse context
  body: 'The milestone chronology shows a business that keeps compounding product scope while preserving its central anti-data-movement message. The 2022 Series D formalized Starburst’s open-lakehouse and Galaxy story; 2025 brought the Citi strategic investment and a record FY25 close; 2026 added AIDA, the Enterprise Intelligence Platform, NVIDIA Vera optimization, and a public $100M ARR threshold. Customer proof is good enough to matter at overview level: Lockheed Martin reports 60% of manufacturing sites integrated with 100+ TB of telemetry data under management, Talkdesk reports 85% faster P99 query times and 150x lower error rates, Checkatrade reports 60% faster processing with 35% employee self-service adoption, and Thinksurance reports 80% faster queries with 20% lower operating costs. The adverse side is not existential, but it is real. Starburst’s security-advisories page documents ongoing 2025-2026 vulnerability and upgrade notices, PeerSpot’s comparative review data shows Starburst
    with materially lower market mindshare than Databricks and acknowledges more deployment complexity, and external security-monitoring vendors maintain live risk reports on the company. The right takeaway is that Starburst has clear proof and momentum, but also a non-trivial execution and security burden that later risk and valuation work should not wave away.'
