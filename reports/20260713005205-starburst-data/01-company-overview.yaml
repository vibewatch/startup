company:
  name: Starburst Data
chapter:
  number: 1
  title: Company Overview
  summary: Starburst Data is a Boston-based, founder-led data platform company built around Trino, federated query, and open-lakehouse infrastructure. Verified sources show a $250M Series D at a $3.35B valuation in 2022, an additional undisclosed Citi strategic investment in May 2025, and a February 2026 disclosure that Starburst crossed $100M ARR with nearly 40% year-over-year growth. The company’s current story centers on governed enterprise AI on distributed data, but public disclosure still leaves exact customer count, board control, and balance-sheet detail opaque.
sections:
- id: identity-platform-and-scale
  title: Identity, platform scope, and operating footprint
  body: 'Starburst’s core identity is consistent across its homepage, about materials, product pages, and 2025-2026 releases: it sells a federated enterprise data platform that lets customers query and govern data where it already lives rather than centralizing everything first. The company frames this architecture as an enterprise intelligence or lakeside-AI foundation built on Trino and Apache Iceberg, with deployment options spanning cloud SaaS, self-managed environments, and hybrid architectures. The platform story is productized rather than conceptual. Starburst’s pricing page confirms a usage-based Galaxy model with annual-commit discounting, the connectors page says the platform supports 50+ enterprise data sources, and data-products materials emphasize policy, lineage, masking, and sharing without data movement. Scale signals are materially stronger in 2025-2026 than they were in the 2022 financing announcement. The February 2026 ARR release says Starburst passed $100M ARR, reached
    a $20M AI annual run rate, doubled business outside the U.S., and expanded quickly in financial services, while Tracxn reports 544 employees as of May 2026. Even so, customer count is still not directly disclosed in the public record we reviewed, so later chapters should treat footprint claims as directional until management supplies denominator-quality cohort data.'
