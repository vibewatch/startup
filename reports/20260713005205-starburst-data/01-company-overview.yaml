- id: funding-history-and-traction
  title: Funding history, capital formation, and disclosed traction
  body: 'The capital history has two clearly verified phases and one partially disclosed extension. In February 2022, Starburst announced a $250M Series D led by Alkeon Capital at a $3.35B valuation, bringing total funding to $414M and associating the company with a heavyweight investor set that also included Altimeter, B Capital, Andreessen Horowitz, Coatue, Index Ventures, and Salesforce Ventures. Third-party Tracxn pages corroborate those totals and list a further May 19, 2025 Series D event tied to Citi Impact Fund, while Starburst’s own May 2025 press release describes the round only as a strategic investment from Citi through its Markets Innovation & Investments division and does not disclose size or valuation. That makes 2025 strategically important but financially incomplete. Operating traction is much more visible in the 2025 FY25 and 2026 ARR announcements: Starburst disclosed 20% net-new-customer growth, 76% Galaxy customer growth, 94% Galaxy adoption growth, ARR per customer
    above $325,000, a multi-year eight-figure-per-year banking contract, 130% net dollar retention, and nearly 40% year-over-year ARR growth while surpassing $100M ARR. The underwriting implication is straightforward: the company appears commercially real and still growing fast, but public investors cannot independently assess revenue mix, gross margin, burn, or round economics without management access.'
