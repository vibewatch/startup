      - number: '3.4'
        title: Durability is plausible but still vulnerable to execution and category pressure
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in the retained pool is less about an incumbent crushing Shrapnel today and more
              about whether the category can sustain the model it promises. Dapp.Expert explicitly calls the
              extraction-FPS field intensely competitive, and Coinranking warns that blockchain titles remain exposed to
              scrutiny over whether gameplay quality can outrun economic speculation. At the same time, Shrapnel's
              public infrastructure story has already shifted from Avalanche-subnet logic toward GalaChain and China's
              TCC bridge, which shows adaptability but also underlines execution risk in platform migration and regional
              rollout. RootData and Coinranking show a venture-backed studio with meaningful funding, yet still not one
              whose disclosed scale obviously matches major AAA live-service incumbents.
