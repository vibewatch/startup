      - number: '6.2'
        title: Adoption proof is real but still mostly aggregate
        blocks:
          - type: paragraph
            body: >-
              The strongest independent proof of real usage is GamesBeat's report that Shrapnel generated more than 3.7
              million sessions in 27 days of paid early access during 2024, which is materially better evidence than a
              logo wall or follower count alone. CoinGecko also records that the game crossed 100,000 account signups by
              December 2023 and built a pre-launch community of more than 100,000 Discord members plus 370,000 X
              followers. Those signals show substantial awareness and enough product access to create genuine play data,
              but the proof quality is still uneven. The same CoinGecko guide says STX events were held monthly and the
              servers went offline between them, which means the public adoption trail is event-based rather than an
              always-on service curve. Across the assigned pool, the company still lacks public named production
              customers, named creator earners, or third-party case studies showing who stayed, expanded spend, or
              converted from social reach into durable play.
