  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product stack keeps latency-sensitive shooter systems off-chain and wraps them with identity,
      ownership, creator, and policy layers whose current backend mix still needs confirmation.
    data:
      layers:
        - label: Access and identity
          detail: How a player gets into the product before any creator-economy step.
          modules:
            - Steam / Epic distribution
            - Shrapnel account creation
            - Optional wallet / card on-ramp
          outputs:
            - Playable session access
        - label: Real-time match loop
          detail: Latency-sensitive shooter systems that public sources describe as conventional game infrastructure.
          modules:
            - UE5 client and rendering
            - Combat, recoil, and movement rules
            - Server-side bullet pooling
            - Extraction and Sigma objectives
          outputs:
            - Competitive session quality
            - Risk / reward gameplay
        - label: Progression and retention
          detail: Systems that turn matches into repeat play.
          modules:
            - Operators and perks
            - Loot / inventory
            - Leaderboard / mission surfaces
            - Future battle-pass and matchmaking additions
          outputs:
            - Progression arc
            - Repeat-session incentive
        - label: Ownership and creator economy
          detail: Blockchain-facing layer wrapped around the shooter rather than replacing the shooter loop.
          modules:
            - SHRAP token utility
            - NFT publishing
            - Marketplace and royalties
            - Avalanche-era and GalaChain-era references
          outputs:
            - Asset ownership
            - Creator monetization
        - label: Trust, moderation, and compliance
          detail: Controls that matter once assets, wallets, and UGC exist.
          modules:
            - Anybrain anti-cheat
            - Byfron anti-tampering
            - Reputation / moderation systems
          outputs:
            - Safer live operations
        - label: Distribution and regulatory access
          detail: Commercial reach that depends on external platform or jurisdictional relationships.
          modules:
            - China licensing dependency
            - Gala ecosystem partnership
            - Storefront distribution partners
          outputs:
            - Compliance surface
            - Market-access leverage
    approximationNotes: >-
      The layer model is synthesized from public descriptions; the unresolved backend migration means the ownership rail
      should be treated as functionally described, not fully vendor-verified.
    claimRefs:
      - CE003
      - CE004
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public journey starts with community acquisition, moves through paid event-based access, and aims to expand
      through creators and the China-localized rollout.
    data:
      items:
        - label: Community discovery and signup
          actor: Prospective players
          channel: Discord, X, community campaigns
          touchpoints:
            - 100,000 account signups by December 2023
            - More than 100,000 Discord members and 370,000 X followers pre-launch
          note: Top-of-funnel reach is much larger than verified retained or paying-user proof.
          tone: neutral
        - label: Pack purchase
          actor: Early-access payer
          channel: Marketplace / Extraction Packs
          touchpoints:
            - Basic pack priced at $9.99
            - Higher tiers priced at $19.99, $49.99, and $99.99
          note: Initial monetization is direct-to-player rather than enterprise-led.
          tone: neutral
        - label: Event-based gameplay
          actor: Active player
          channel: Monthly STX events
          touchpoints:
            - Servers were available during monthly STX windows
            - Over 3.7 million sessions in 27 paid early-access days
          note: Usage proof is real, but the cadence was eventized rather than always-on.
          tone: positive
        - label: Creator onboarding
          actor: Creators and curators
          channel: Player-created content and creator maps
          touchpoints:
            - Maps, skins, callsigns, and vanity items can be published as player-created content
            - Management says success would be half of sessions on creator maps
          note: Expansion depends on UGC supply that is not yet proven at scale.
          tone: opportunity
        - label: Regional expansion
          actor: China-localized players
          channel: Trusted Copyright Chain + GalaChain bridge
          touchpoints:
            - Localized China launch targeted by end-2025 / Q1 2026 public launch
            - Public materials frame China as a distinct compliance-enabled market
          note: Regional growth relies on a separate regulatory and infrastructure stack.
          tone: opportunity
        - label: Durability test
          actor: Investors and operators
          channel: Retention, repeat spend, concentration reporting
          touchpoints:
            - No public GRR, NRR, churn, or top-customer concentration metrics in the assigned pool
            - No named production customer or creator case studies located
          note: This is the missing handoff between top-of-funnel demand and durable customer economics.
          tone: risk
    claimRefs:
      - CU002
      - CU004
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU014
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure is highest where Early Access proof, wallet abstraction, and creator marketplace execution have
      to work simultaneously.
    data:
      columns:
        - label: Likelihood
        - label: Impact
        - label: Mitigation maturity
        - label: Residual exposure
      rows:
        - label: Mainstream adoption and onboarding friction
          values:
            - label: High
              note: AAA players are not expected to tolerate visible wallet friction.
            - label: High
              note: Weak conversion would undercut marketplace and token utility simultaneously.
            - label: Medium
              note: Custodial wallets and Early Access feedback help, but proof is still public-metric light.
            - label: High
              note: Still dependent on frictionless onboarding and improving retention.
        - label: Creator-economy quality and moderation
          values:
            - label: Medium
              note: The roadmap depends on creators supplying approved content.
            - label: High
              note: Thin creator liquidity weakens differentiation and marketplace depth.
            - label: Low-Medium
              note: Tools exist, but public evidence of throughput and moderation capacity is absent.
            - label: High
              note: Creator participation is core to the business model, not optional upside.
        - label: Token unlock / marketplace economics
          values:
            - label: Medium
              note: Unlock pressure is explicitly identified as a risk.
            - label: High
              note: Token and marketplace weakness can spill into governance and creator incentives.
            - label: Medium
              note: Single-token design and gas subsidies simplify use but do not prevent selling pressure.
            - label: Medium-High
              note: Public evidence does not show whether demand depth offsets emissions.
        - label: Live-service security and infrastructure
          values:
            - label: Medium
              note: Extraction shooters attract cheating and exploit pressure.
            - label: High
              note: Security failures would damage trust and competitive integrity.
            - label: Medium
              note: Anybrain, Byfron, and an exclusive Avalanche subnet are meaningful mitigations.
            - label: Medium
              note: Controls lower but do not eliminate arms-race dynamics.
        - label: Platform and compliance exposure
          values:
            - label: Medium
              note: The token, marketplace, and NFT stack enlarge legal and platform-policy surface area.
            - label: High
              note: Commercial restrictions or compliance failures could impair onboarding or monetization.
            - label: Low-Medium
              note: Public evidence describes architecture, not current legal-operating controls.
            - label: High
              note: Key contracts, policy terms, and legal opinions are not public in the assigned pool.
        - label: Brand discoverability ambiguity
          values:
            - label: Medium
              note: The company shares its name with established non-company entities and definitions.
            - label: Medium
              note: Ambiguous discovery can slow audience acquisition and external diligence.
            - label: Low
              note: No visible mitigation appears in the assigned source pool beyond contextual branding.
            - label: Medium
              note: Not fatal on its own, but it adds friction to search-led discovery.
    claimRefs:
      - CR003
      - CR006
      - CR009
      - CR010
      - CR011
      - CR014
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows from differentiated product evidence, live token-market visibility, and still-missing
      operating and equity-pricing disclosure.
    data:
      nodes:
        - label: Differentiated product
          detail: AAA extraction-shooter design plus creator tools and digital-asset ownership.
        - label: Historical capital support
          detail: Roughly $37.5M of disclosed funding, including a $20M Series A.
        - label: Live market reference exists
          detail: SHRAP token has a visible circulating market cap and FDV snapshot.
        - label: Operating proof still missing
          detail: No public revenue, margin, runway, or current free-to-play retention disclosure in the pool.
        - label: Friction remains real
          detail: KYC, Web3 adoption resistance, token unlock pressure, and restructuring noise remain active risks.
        - label: Recommendation
          detail: research-more / expensive until launch KPIs and current price terms are disclosed.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV012
      - CV013
