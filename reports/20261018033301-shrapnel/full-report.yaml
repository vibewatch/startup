              - CU010
              - CU011
      - number: '6.3'
        title: Expansion depends on creator and regional loops that remain unproven
        blocks:
          - type: paragraph
            body: >-
              The expansion story is clear in narrative terms but not yet durable in evidence terms. The New Stack's
              interview shows leadership wants creator-made maps to become so important that half of all sessions
              eventually run on community maps, and PlayToEarn describes continued work on operator onboarding, economy
              design, and a localized China launch path into Q1 2026. That makes the upside thesis less about one-time
              pack sales and more about recurring engagement from creator content, marketplace activity, and
              region-specific asset trading. The risk is that the current public evidence set does not quantify churn,
              GRR, NRR, contract length, repeat purchase, or customer concentration, so investors cannot tell whether
              strong early-access activity translated into habit or merely into curiosity. Naavik also warned that NFT
              gates or pay-to-win dynamics could shrink the reachable audience, and even basic open-web customer
              discovery is noisier than usual because the Shrapnel brand collides with unrelated artillery, film, and
              dictionary results.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The customer model is two-sided, not just player-only
            body: >-
              Public materials repeatedly position Shrapnel as both a paid shooter for players and a
              marketplace-plus-tooling stack for creators who publish maps, skins, and vanity assets.
            calloutType: insight
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Usage proof exists, but durability proof does not
            body: >-
              The public record shows signups, community size, and session volume, but it still does not show renewal,
              repeat-spend, or concentration metrics that would convert attention into durable customer evidence.
            calloutType: risk
            claimRefs:
              - CU004
              - CU011
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual risk stack
        blocks:
          - type: paragraph
            body: >-
              The residual-risk stack is led by adoption and execution rather than by a disclosed court case or
              regulator action in the assigned pool. Shrapnel has now reached Steam Early Access and is explicitly using
              live player feedback to tune balance, match flow, and content, which is constructive because it creates a
              measurable operating loop. The same evidence also confirms that the title remains in early access, so
              commercial durability is still unproven. At the same time, multiple sources show that the product thesis
              is inseparable from wallet abstraction, token-mediated ownership, and a creator marketplace. That means
              the company is not merely shipping a shooter; it must make Web3 friction invisible to mainstream FPS
              players while also convincing creators to supply maps, skins, and other content that remains safe enough
              to approve and liquid enough to trade. The highest-conviction downside therefore is a three-part miss:
              weak retention after launch, user friction around wallets and asset flows, and insufficient
              creator-marketplace depth to justify the token economy.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR009
              - CR010
              - CR011
              - CR014
      - number: '7.2'
        title: Legal, regulatory, and governance exposure is structural rather than incident-proven
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not document an active lawsuit, enforcement order, or formal regulator
              complaint, so this chapter should not imply one. What it does document is a business model in which the
              SHRAP token acts as utility, governance, marketplace exchange, and subnet gas token while approved
              player-created assets are minted and traded as NFTs. That architecture expands the surface area for
              securities-style scrutiny, marketplace and consumer-protection obligations, IP and content-rights
              disputes, and moderation accountability around user-generated assets. Because the public pool does not
              include current legal opinions, policy terms, or regulator correspondence, the correct posture is not
              "clear" but "structurally exposed with incomplete public verification." The investment implication is that
              diligence should focus on how token-governance, approval workflows, sanctions/KYC boundaries, and
              creator-rights processes are actually administered in production rather than assuming that gameplay
              quality alone determines risk.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational and dependency risk still sits above mitigation maturity
        blocks:
          - type: paragraph
            body: >-
              Operationally, Shrapnel is trying to run a live-service extraction shooter, an anti-cheat stack, a creator
              toolchain, a marketplace, and blockchain-linked asset plumbing at the same time. The New Stack's reporting
              is useful here because it shows both mitigation and residual exposure: Shrapnel uses custodial wallet
              technology to reduce user friction, relies on Anybrain for anti-cheating and Byfron for anti-tampering,
              and chose an exclusive Avalanche subnet so it does not share block space with unrelated dApps. Those are
              sensible architecture choices, but none removes the core burden of execution. Even the company's own
              external advocates emphasize that creation is hard, that only some creators will be able to contribute
              meaningful content, and that the product vision assumes creator participation becomes a major share of
              engagement. The combination makes dependency concentration broader than a normal shooter: blockchain
              infrastructure, onboarding partners, creator liquidity, and live-ops/security vendors all matter to the
              same player experience.
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR010
              - CR011
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR011
              - CR013
      - number: '7.4'
        title: Kill criteria and diligence path
        blocks:
          - type: paragraph
            body: >-
              The cleanest thesis-break indicators are monitorable. A lower-risk view requires evidence that
              early-access retention and content cadence are improving, that wallet abstraction is good enough for
              mainstream users, that creator tools are generating moderated content at scale, and that token unlocks are
              not overwhelming marketplace demand. The absence of public DAU, payer conversion, creator throughput,
              moderation staffing, partner SLAs, and contract economics prevents that conclusion today. A practical
              diligence path is to ask management for current live-ops metrics, partner and platform dependency maps,
              token treasury and unlock-management policies, creator-review queues, and any incident logs covering
              fraud, exploits, or moderation disputes. If management cannot show improving retention and creator
              liquidity while also keeping onboarding friction low, the token and marketplace upside case should be
              treated as unproven rather than deferred.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR009
              - CR010
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria
            body: >-
              Treat the thesis as broken if Shrapnel cannot show improving live-engagement metrics after Early Access,
              if wallet abstraction still creates visible player friction, or if creator tools fail to produce moderated
              marketplace supply without relying on heavy subsidy.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR014
          - type: callout
            title: What already mitigates risk
            body: >-
              The mitigation stack is real — live Steam feedback loops, custodial wallets, an exclusive Avalanche
              subnet, and anti-cheat/anti-tamper partners — but each measure lowers one failure mode rather than
              removing the combined execution burden.
            calloutType: insight
            claimRefs:
              - CR001
              - CR004
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation remains gated by price support, not by product ambition
        blocks:
          - type: paragraph
            body: >
              Shrapnel still has enough product ambition to merit diligence, but not enough public operating disclosure
              to justify underwriting a premium entry. Independent sources continue to show a serious product and
              funding effort: Fortune and NFT Plazas both describe the October 2023 Series A, and multiple sources
              describe a game-first creator economy built around player-created assets rather than a pure token-farming
              loop. That matters because the core question is not whether the concept sounds differentiated; it is
              whether public evidence now supports a defensible price. In the assigned pool, it does not. The pool shows
              historical fundraising and a live token market snapshot, but it does not disclose current company revenue,
              margins, burn, runway, liquidation preferences, or a current private valuation. Without those inputs, the
              right call is still research-more, with an expensive stance toward any price anchored to narrative rather
              than disclosed live performance.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV012
              - CV013
      - number: '8.2'
        title: What public evidence does and does not price today
        blocks:
          - type: paragraph
            body: >
              The retained sources provide two very different kinds of price context. First, Gate Learn and RootData
              document roughly $37.5 million of disclosed funding across three rounds, with Fortune and NFT Plazas
              adding detail on the $20 million Series A and its investor set. Second, RootData provides a current
              token-market snapshot showing about $9.5 million of circulating market cap and roughly $31.5 million of
              fully diluted value for SHRAP. Those token figures are useful as evidence that the ecosystem has a live
              market reference, but they are not the same thing as an equity valuation for Neon Machine. The pool does
              not disclose current company revenue, monetization efficiency, preference stack, or a priced round after
              2023, so the public evidence supports discipline rather than extrapolation. Bullish arguments therefore
              have to lean on differentiated product design and creator-economy optionality, while bearish arguments can
              point to the gap between available operating disclosure and the amount of narrative investors may want to
              ascribe to a Web3 AAA title.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: The swing factors are retention, monetization, and friction
        blocks:
          - type: paragraph
            body: >
              The upside case is easy to describe: Shrapnel could become a rare AAA-quality extraction shooter that
              turns creator tools, marketplace activity, and token utility into a durable ecosystem moat. The downside
              case is also clear in the public evidence. Fortune highlights KYC friction for U.S. users who want to
              access the full marketplace, The New Stack notes long-standing gamer skepticism toward crypto and NFT
              mechanics, and Coinranking explicitly flags niche adoption and token unlock pressure. Free.cc adds that
              the company entered 2026 after investor disputes, restructuring, a settled lawsuit, and layoff rumors,
              which is not the backdrop for paying a confidence-heavy valuation. That makes the final diligence asks
              straightforward: prove durable free-to-play retention, disclose monetization and runway, clarify current
              share-price and preference terms, and show that creator-economy usage is adding demand instead of just
              adding token complexity. Until those gates clear, the recommendation should stay conservative.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >
              Recommendation stays at research-more because the available public evidence supports product credibility
              and historical funding, but not a defendable current entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV012
              - CV013
          - type: callout
            title: What could still break the thesis
            body: >
              Even if the game launches cleanly, KYC friction, token unlock pressure, and unproven free-to-play
              retention could prevent creator-economy upside from translating into investable equity value.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV011
