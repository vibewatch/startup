      - number: '2.3'
        title: Adoption drivers, constraints, and diligence gaps
        blocks:
          - type: paragraph
            body: >
              The strongest adoption driver in the assigned pool is community-shaped iteration: Epic describes recurring
              STX and weekly playtests, Steam promises roadmap updates and feedback loops, and the March 2026 CEO note
              says the team reworked the experience into Stockpile to make matches faster and clearer. The
              creator-economy thesis is the second driver; both Coinranking and The New Stack say ownership,
              user-generated content, and marketplace activity are central to the product vision. The biggest
              constraints are external skepticism about crypto gaming and internal discoverability friction. The New
              Stack explicitly cites broad developer disinterest in NFTs, while the assigned pool also returned an
              artillery-shell article, a film listing, and a dictionary entry for "Shrapnel," showing that even
              undifferentiated search intent can route users toward meanings unrelated to the game. That makes traction,
              creator monetization, and brand-conversion data especially important gaps.
