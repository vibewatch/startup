              CAGR, so the best supportable approach is a constrained set of adoption proxies. Epic's March 2024
              interview gives the cleanest public signal: more than 120,000 Discord members but only around 3,000
              current players in the then-current test pool, implying strong top-of- funnel awareness but a much smaller
              active cohort. Steam's Early Access FAQ shows why conversion is still narrow: the live offer was scoped to
              one mode, a small operator roster, and a short planned Early Access window that could still change with
              feedback. The pyramid below therefore shows demand as a set of qualitative filters rather than a false
              precision TAM stack.
