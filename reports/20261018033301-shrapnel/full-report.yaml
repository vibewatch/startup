        title: Maturity, trust, and product risks
        blocks:
          - type: paragraph
            body: >-
              Maturity has improved, but the public record still describes a product under active construction rather
              than a stable, fully evidenced live service. The 2024 STX-era build reportedly had one operator, limited
              weapons, unfinished maps, and narrow play windows, while a 2026 rebuild narrative adds server-side bullet
              pooling, fixes for movement exploits, and a broader Steam early-access surface. That is credible
              iteration, yet the assigned sources still do not provide the operating metrics a buyer or investor would
              want: no public uptime or support SLA, no independent security-assurance or privacy disclosures for wallet
              or marketplace flows, no current creator-tool adoption data, and no clear technical migration memo for the
              chain stack. Even discoverability is a small but real drag because 'Shrapnel' is also a generic ordnance
              term and a 2023 film title, which can crowd generic search surfaces.
