      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The common architecture across sources is relatively coherent at a functional level even when chain
              branding changes. Unreal Engine 5 anchors the game client and visual layer, while the time-sensitive
              shooter experience stays off-chain: real-time combat, recoil, movement, extraction, and at least some
              leaderboard-style features are described as conventional game systems. Blockchain is reserved for
              ownership, marketplace settlement, and publishing player-created content. The main unresolved architecture
              question is migration. Older sources repeatedly describe an Avalanche subnet or dedicated Avalanche chain,
              whereas a 2026 explainer says the asset and royalty stack moved to GalaChain. That divergence does not
              break the product thesis, but it does mean current diligence still needs an official architecture note
              before underwriting wallet, token, and settlement dependencies.
