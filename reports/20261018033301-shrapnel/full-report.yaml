chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and observable scale
        blocks:
          - type: paragraph
            body: >-
              Shrapnel presents itself as a PC-first AAA extraction shooter that combines squad-based firefights with a
              creator economy, marketplace trading, and blockchain-backed digital ownership rather than on-chain core
              gameplay. Across official, partner, and independent technical coverage, the consistent product identity is
              an Unreal Engine 5 title running with Avalanche infrastructure and focused on user-generated content as a
              differentiation layer. The scale signals in the assigned pool are directional rather than financial:
              official surfaces cite 3.7 million sessions, while other public metrics describe items sold, shots fired,
              and Sigma-related activity without disclosing unique players, paying users, or revenue conversion. That
              means later chapters can safely reuse the company identity and technical framing, but not translate
              engagement counters into customers or monetization.
