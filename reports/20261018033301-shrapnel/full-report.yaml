      - number: '3.3'
        title: Packaging remains partially opaque, so switching is more about ecosystem pull than list price
        blocks:
          - type: paragraph
            body: >-
              Public packaging evidence is incomplete. Games.gg says players could enter through one of three paid
              Extraction Pack tiers, while 2026 China coverage describes the current product as free-to-play with
              RMB-settled digital asset trading under the Trusted Copyright Chain framework. That is enough to show that
              Shrapnel is balancing a broader free-to-play funnel with paid or collectible-style monetization, but not
              enough to build an apples to apples price card against direct Web3 peers or incumbent extraction shooters.
              In practice, the visible switching-cost story is therefore moderate at best: creators may accumulate
              identities, assets, and marketplace reputation inside Shrapnel, yet public evidence still does not show a
              disclosed price umbrella or enterprise-style distribution channel that would clearly lock users away from
              competing games.
