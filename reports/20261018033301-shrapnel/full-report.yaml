  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Player and creator segments drive the customer model
        blocks:
          - type: paragraph
            body: >-
              Shrapnel's paying customer today is primarily the individual player, not a studio or enterprise buyer.
              CoinGecko's walkthrough of the early-access flow says access was sold through Extraction Packs priced from
              $9.99 to $99.99, which means adoption starts with direct consumer willingness to pay rather than channel
              sell-through or a business-development contract. At the same time, the product thesis is not just "players
              buy a shooter." Multiple sources frame Shrapnel as a two-sided ecosystem that also expects creators and
              curators to publish maps, skins, callsigns, and vanity items, with the token and marketplace meant to
              support that loop. The China rollout adds a geographically distinct cohort with separate regulatory
              plumbing and localized asset-trading rails, so management is effectively pursuing consumer players,
              creators, and a region-specific China audience in parallel rather than a single homogeneous customer base.
            claimRefs:
