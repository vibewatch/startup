      - number: '3.2'
        title: Differentiation is concentrated in creator tooling and asset ownership
        blocks:
          - type: paragraph
            body: >-
              The retained evidence is directionally consistent that Shrapnel's core pitch is not "play to earn" in the
              older sense, but a creator-heavy extraction shooter where users can make insignias, skins, gear, maps, and
              other approved content for marketplace exchange. The New Stack, BlockchainGamer.biz, and Dapp.Expert all
              emphasize creator tools and player-owned assets as the distinctive layer on top of the combat loop. That
              creates a positioning angle that traditional extraction shooters do not match and that older Web3 titles
              in the retained pool do not yet prove at the same depth. It also means Shrapnel's moat depends on creator
              participation becoming self-reinforcing rather than merely on listing a token or shipping a shooter.
            claimRefs:
