      - number: '1.3'
        title: Funding history, milestones, and unresolved disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The clearest hard numbers in the assigned pool concern token-market and fundraising milestones, not
              company financial performance. RootData records a $10.5M 2021 funding round, a $7M private round in April
              2022, and a $20M Series A in October 2023 for a total of $37.5M raised, while Coinranking separately
              reports current token market capitalization and fully diluted valuation figures that should not be
              mistaken for an equity valuation. Official 2025 company updates add evidence of ongoing commercialization
              efforts, including a stated free-to-play launch plan and a March 2025 Beijing copyright seminar
              appearance, but they still stop short of disclosing revenue, headcount, named investors, or the economics
              behind China-related partnerships. The chapter’s central diligence conclusion is therefore that company
              identity and financing chronology are reusable ground truth, while valuation and commercial scale remain
              open questions.
