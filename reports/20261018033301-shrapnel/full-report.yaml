      - number: '4.3'
        title: Capital adequacy is the main diligence blocker
        blocks:
          - type: paragraph
            body: >-
              RootData's public market-data snapshot shows $37.5 million raised and a token market cap far below
              historic venture expectations discussed in prior refresh context, but the retained current sources do not
              disclose cash on hand, burn, runway, debt facilities, or the exact economics of the planned China push.
              EGamers notes a China-oriented SHRAP buyback strategy tied to local revenues, while Play2Moon argues the
              token was launched before the game was finished and before a mature content base existed. Taken together,
              the evidence supports a financing picture built around venture funding plus token-market/liquidity
              mechanisms rather than one sustained by disclosed operating cash generation. Financially, the model is
