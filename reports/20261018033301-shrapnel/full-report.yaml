      - number: '1.2'
        title: Leadership bench, governance surface, and stakeholder dependencies
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture centers on a small group of entertainment, platform, and game-industry
              veterans rather than a broad, independently described management bench. Independent reporting names Mark
              Long as CEO, Aaron Nonis as COO, Don Norbury as studio head, Colin Foran as chief creative officer, and
              Naomi Lackaff as head of partnerships, while partner and token-reference pages reinforce the Seattle
              location and Mark Long’s role. Governance and control are split between the studio, creator tools, and the
              SHRAP token system: token holders are described as voting on DAO and sub-DAO proposals, while Avalanche
              infrastructure, Epic distribution, and marketplace/payment integrations create concentrated external
              dependencies. Because no named board members, cap-table rights, or investor control terms appear in the
              assigned pool, diligence should treat governance visibility as partial.
