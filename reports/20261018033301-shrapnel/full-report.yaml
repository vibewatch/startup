  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and monetization logic
        blocks:
          - type: paragraph
            body: >
              The assigned sources frame Shrapnel first as a free-to-play competitive FPS and only second as a tokenized
              creator economy. Steam's Early Access FAQ says the game remains free-to-play, centers on Stockpile as a
              4v4 objective mode, and monetizes through optional battle passes, cosmetics, and operator unlocks.
              Third-party coverage adds the web3 layer: Coinranking describes SHRAP as the token for publishing
              player-created content, governance, marketplace exchange, and subnet gas, while The New Stack describes
              the product goal as an FPS that keeps the core loop accessible for Web2 players while enabling ownership
              and creator monetization for Web3 participants. That boundary excludes pure crypto-token speculation and
              also excludes the much broader shooter market that will never accept a wallet, NFT, or creator-economy
              workflow.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM008
              - CM011
