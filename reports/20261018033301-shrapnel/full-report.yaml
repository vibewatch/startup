  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive alternatives extend beyond named Web3 FPS peers
        blocks:
          - type: paragraph
            body: >-
              Public evidence in this pool shows that Shrapnel should not be evaluated only against tokenized shooter
              peers. Games.gg places it in a Web3 FPS set that already includes Undead Blocks, EV.IO, and MetaOps, while
              the same source says Shrapnel also draws inspiration from Tom Clancy's The Division. That combination
              expands the relevant comparison set into three practical buckets: direct blockchain-native shooters,
              conventional extraction shooters with closed economies, and creator-led sandboxes or mod ecosystems that
              compete for the same user attention and creator labor. Independent commentary also consistently describes
              Shrapnel as a real extraction shooter first and a tokenized economy second, so the most relevant
              substitute is still a compelling game loop rather than a pure crypto asset marketplace.
            claimRefs:
              - CP001
              - CP002
              - CP006
