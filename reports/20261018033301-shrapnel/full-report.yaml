  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and player loop
        blocks:
          - type: paragraph
            body: >-
              Public descriptions consistently frame Shrapnel as a PC first-person extraction shooter rather than a
              token-first game. The core user job is to enter the Sacrifice Zone, collect Sigma or other loot under
              combat pressure, and extract before losing the run, with optional progression through Operators, perks,
              cosmetics, and creator-economy participation. That matters because the product is trying to monetize two
              layers at once: a conventional competitive shooter loop for players who never touch wallets, and a
              marketplace-plus-UGC layer for creators and asset traders. The product map is therefore broader than just
              'one game client' and includes distribution, account onboarding, the live match loop, the SHRAP / NFT
              economy, and creator tooling.
            claimRefs:
