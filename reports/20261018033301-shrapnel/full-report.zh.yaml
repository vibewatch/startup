            body: >-
              公开描述一致把 Shrapnel 定义为 PC 第一人称撤离射击游戏，而不是以代币为先的游戏。玩家的核心任务是进入 Sacrifice Zone，在战斗压力下收集 Sigma
              或其他战利品，并在本局损失前撤离；Operators、perks、外观物品和创作者经济参与则提供可选成长。这一设计同时服务两层变现：一层是无需接触钱包的传统竞技射击循环，另一层是面向创作者和资产交易者的市场加
              UGC 层。因此产品不只是一个客户端，还包括分发、账户 onboarding、实时对局、SHRAP/NFT 经济和创作者工具。
