            body: >-
              论点破坏指标是可监测的。较低风险判断需要看到早期体验留存和内容节奏改善、钱包抽象足以服务主流用户、创作者工具能规模化产出经过审核的内容，以及代币解锁不会压过市场需求。当前没有公开
              DAU、付费转化、创作者产出、审核人员配置、合作方 SLA
              或合同经济性，因此还不能下结论。实际尽调应向管理层索取当前实时运营指标、合作方和平台依赖图、代币金库与解锁管理政策、创作者审核队列，以及涵盖欺诈、漏洞利用和审核争议的事件日志。如果管理层无法证明留存和创作者流动性正在改善，同时
              onboarding 摩擦保持较低，代币和市场的上行空间应被视为尚未验证，而不是延期兑现。
