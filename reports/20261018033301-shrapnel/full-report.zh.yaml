  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争替代不止于已知 Web3 FPS 同行
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，Shrapnel 不应只与代币化射击游戏比较。Games.gg 将 Undead Blocks、EV.IO 和 MetaOps 列入 Web3 FPS 集合，同时指出 Shrapnel 也受到
              Tom Clancy's The Division 启发。因此相关比较对象至少分为三类：原生区块链射击游戏、采用封闭经济的传统撤离射击游戏，以及争夺同一批用户注意力和创作者劳动力的创作者沙盒或 mod
              生态。独立评论也始终把 Shrapnel 首先描述为真正的撤离射击游戏、其次才是代币化经济，所以最重要的替代品仍是一套有吸引力的游戏循环，而不是纯加密资产市场。
