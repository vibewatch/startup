  - id: TV002
    title: 正 / 反论点表
    columns:
      - 论点
      - 基于证据的判断
      - 会改变判断的因素
    rows:
      - - 产品差异化
        - 多个来源将其描述为游戏优先的 AAA 撤离式射击游戏，配有创作者工具和 NFT 支持的所有权，而不是纯粹的奖励循环。
        - 广泛开放免费游玩后，若创作者地图、资产和市场活动能持续实时使用，将强化这一论点。
      - - 资本支持
        - 已披露的历史融资总额约为 $37.5 million，其中包括 Polychain Capital 领投的 $20 million A 轮。
        - 新一轮定价融资、清晰的现金跑道披露，或现有现金仍能支撑路线图的证据，将增强其持久性。
      - - 变现证据
        - 证据池没有披露当前收入、利润率、付费方转化率或单位经济。
        - 管理层披露收入结构、留存率、付费方转化率和烧钱情况，将显著提升投资判断的信心。
      - - 价格支撑
        - 证据池中唯一实时市场参考是 SHRAP 代币价格，而不是 Neon Machine 当前的股权估值。
        - 在从“昂贵”走向“可投资”之前，还需要当前股权定价、清算优先权和稀释条款。
    notes: 各行将有证据支撑的优势与缺失的估值输入分开；代币市场数据不被视为股权的直接代理。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV012
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险或下行触发因素
      - 概率信号
    rows:
      - - 乐观
        - 免费游上线后留存持久，创作者工具获得真实使用，市场需求增长且没有引发“付费取胜”反弹。
        - 只有当实时留存、变现和融资披露显示股权价值应显著高于历史投入资本时，较高估值的入场价才可能站得住。
        - 创作者工具未能转化为内容供给，或代币效用压过了游戏体验。
        - 这需要披露当前证据池中没有的 KPI。
      - - 基准
        - 游戏上线，社区兴趣延续，但运营披露仍然稀薄，区块链摩擦继续拖慢主流用户转化。
        - 维持“继续研究”；代币市场数据和历史融资支持持续跟踪，但不足以给出明确的股权目标价。
        - 叙事仍领先于已披露的经济数据。
        - 最符合当前保留的证据。
      - - 悲观
        - 留存令人失望，代币解锁压力拖累情绪，治理或市场摩擦限制生态参与。
        - 下行情景意味着应放弃任何高溢价的私募估值，因为风险指标恶化之际，公开证据仍无法支撑收入。
        - 实时服务的牵引力仍停留在事件驱动，而非持久增长。
        - 保留来源中的明确公开摩擦与风险信号支持这一判断。
    notes: 由于指定证据池未披露当前收入、现金消耗或股权结构表条款，情景框架避免制造虚假的精确度。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
