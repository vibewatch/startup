            - 风险 / 回报玩法
        - label: 成长与留存
          detail: 将对局转化为重复游玩的系统。
          modules:
            - Operators 与特权
            - 战利品 / 库存
            - 排行榜 / 任务界面
            - 未来战斗通行证与匹配功能
          outputs:
            - 成长路径
            - 重复游玩激励
        - label: 所有权与创作者经济
          detail: 区块链层叠加在射击玩法之上，而非取代射击循环。
          modules:
            - SHRAP 代币效用
            - NFT 发布
            - 市场与版税
            - Avalanche 时代与 GalaChain 时代的引用
          outputs:
            - 资产所有权
            - 创作者变现
        - label: 信任、审核与合规
          detail: 资产、钱包和 UGC 存在后必须配套的控制措施。
          modules:
            - Anybrain 反作弊
            - Byfron 防篡改
            - 声誉 / 审核系统
          outputs:
            - 更安全的实时运营
        - label: 分发与监管准入
          detail: 依赖外部平台或司法辖区关系的商业触达。
          modules:
            - 中国许可依赖
            - Gala 生态合作
            - 商店分发合作伙伴
          outputs:
            - 合规范围
            - 市场准入杠杆
    approximationNotes: 分层模型综合自公开描述；由于后端迁移尚未解决，所有权链路应视为功能层面的描述，而非已完成供应商核验。
    claimRefs:
      - CE003
      - CE004
      - CE008
      - CE009
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开旅程从社区获客开始，经由付费、事件驱动的访问，再试图借助创作者和中国本地化发布扩张。
    data:
      items:
        - label: 社区发现与注册
          actor: 潜在玩家
          channel: Discord、X、社区活动
          touchpoints:
            - 截至 2023 年 12 月注册账户达 100,000 个
            - 上线前 Discord 成员超过 100,000 人，X 粉丝达 370,000X
          note: 漏斗顶部触达远大于已验证的留存用户或付费用户证据。
          tone: neutral
        - label: 礼包购买
          actor: 早期访问付费玩家
          channel: 市场 / Extraction Packs
          touchpoints:
            - 基础礼包定价 $9.99
            - 更高档位定价为 $19.99、$49.99 和 $99.99
          note: 初始变现面向玩家直销，而不是由企业客户主导。
          tone: neutral
        - label: 事件驱动的游戏
          actor: 活跃玩家
          channel: 每月 STX 活动
          touchpoints:
            - 每月 STX 窗口期间服务器开放
            - 27 个付费早期访问日累计超过 370 万场对局
          note: 使用证据真实存在，但节奏是事件化的，而不是持续在线。
          tone: positive
        - label: 创作者入驻
          actor: 创作者与策展人
          channel: 玩家创作内容与创作者地图
          touchpoints:
            - 地图、皮肤、呼号和装饰物品可以作为玩家创作内容发布
            - 管理层称，成功标准是创作者地图贡献一半对局
          note: 扩张依赖尚未在规模上得到验证的 UGC 供给。
          tone: opportunity
        - label: 区域扩张
          actor: 中国本地化玩家
          channel: Trusted Copyright Chain + GalaChain 跨链桥
          touchpoints:
            - 目标是在 2025 年底前完成中国本地化发布 / 2026 年第一季度公开上线
            - 公开材料将中国描述为一个独立且具备合规条件的市场
          note: 区域增长依赖单独的监管与基础设施栈。
          tone: opportunity
        - label: 持久性测试
          actor: 投资人和运营方
          channel: 留存、重复消费、集中度披露
          touchpoints:
            - 指定证据池中没有公开 GRR、NRR、流失率或头部客户集中度指标
            - 未找到具名生产客户或创作者案例研究
          note: 这就是漏斗顶部需求与持久客户经济之间缺失的交接环节。
          tone: risk
    claimRefs:
      - CU002
      - CU004
      - CU006
      - CU007
      - CU008
      - CU010
      - CU011
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 当 Early Access 证明、钱包抽象和创作者市场执行必须同时奏效时，剩余风险最高。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
        - label: 剩余风险
      rows:
        - label: 主流采用与入门摩擦
          values:
            - label: 高
              note: 预计 AAA 玩家不会容忍明显的钱包摩擦。
            - label: 高
              note: 转化疲弱会同时削弱市场和代币效用。
            - label: 中
              note: 托管钱包和 Early Access 反馈有所帮助，但公开指标证据仍很少。
            - label: 高
              note: 仍依赖无摩擦入门和留存改善。
        - label: 创作者经济质量与审核
          values:
            - label: 中
              note: 路线图依赖创作者提供获批内容。
            - label: 高
              note: 创作者流动性不足会削弱差异化和市场深度。
            - label: 低-中
              note: 工具已经存在，但没有公开证据证明吞吐量和审核能力。
            - label: 高
              note: 创作者参与是商业模式的核心，而非可选的上行空间。
        - label: 代币解锁 / 市场经济
          values:
            - label: 中
              note: 解锁压力被明确列为风险。
            - label: 高
              note: 代币和市场疲弱可能蔓延至治理和创作者激励。
            - label: 中
              note: 单代币设计和 Gas 补贴简化了使用，但无法阻止抛售压力。
            - label: 中-高
              note: 公开证据无法说明需求深度是否能抵消代币释放。
        - label: 实时服务安全与基础设施
          values:
            - label: 中
              note: 撤离射击游戏容易招致作弊和漏洞利用压力。
            - label: 高
              note: 安全失误会损害信任和竞技完整性。
            - label: 中
              note: Anybrain、Byfron 和专属 Avalanche 子网构成有意义的缓解措施。
            - label: 中
              note: 控制措施能降低但无法消除军备竞赛式对抗。
        - label: 平台与合规风险
          values:
            - label: 中
              note: 代币、市场和 NFT 栈扩大了法律与平台政策的风险面。
            - label: 高
              note: 商业限制或合规失败可能损害入门或变现。
            - label: 低-中
              note: 公开证据描述的是架构，而非当前法律运营控制。
            - label: 高
              note: 指定证据池中没有公开关键合同、政策条款和法律意见。
        - label: 品牌可发现性歧义
          values:
            - label: 中
              note: 公司与已有的非公司实体和定义同名。
            - label: 中
              note: 搜索结果含混会拖慢受众获客和外部尽调。
            - label: 低
              note: 除上下文品牌标识外，指定来源池中未见明显缓解措施。
            - label: 中
              note: 单独看并非致命问题，但会增加搜索导向发现的摩擦。
    claimRefs:
      - CR003
      - CR006
      - CR009
      - CR010
      - CR011
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 该建议基于差异化产品证据、实时代币市场可见性，以及仍缺失的运营和股权定价披露。
    data:
      nodes:
        - label: 差异化产品
          detail: AAA 撤离射击设计，加上创作者工具和数字资产所有权。
        - label: 历史资本支持
          detail: 已披露融资约 $37.5M，其中包括 $20M A 轮。
        - label: 存在实时市场参考
          detail: SHRAP 代币有可见的流通市值和 FDV 快照。
        - label: 运营证明仍缺失
          detail: 证据池中没有公开收入、利润率、现金续航 或当前免费游留存披露。
        - label: 摩擦仍然存在
          detail: KYC、Web3 采用阻力、代币解锁压力和重组噪音仍是现实风险。
        - label: 建议
          detail: 在披露上线 KPI 和当前价格条款前，继续研究 / 估值昂贵。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV012
      - CV013
