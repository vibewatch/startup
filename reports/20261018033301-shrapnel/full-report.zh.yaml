        title: 持久性有可能成立，但仍易受执行与品类压力影响
        blocks:
          - type: paragraph
            body: >-
              保留资料中的反向证据，与其说是现有巨头正在击败 Shrapnel，不如说是在质疑这一品类能否维持其承诺的模式。Dapp.Expert 明确称撤离 FPS 领域竞争激烈，Coinranking
              也警告区块链游戏仍面临“玩法质量能否跑赢经济投机”的质疑。同时，Shrapnel 的公开基础设施已经从 Avalanche 子网逻辑转向 GalaChain 和中国 TCC
              桥接，这显示出适应能力，也暴露出平台迁移和区域上线的执行风险。RootData 和 Coinranking 显示这是一家获得风险投资、融资规模可观的工作室，但公开规模仍明显没有达到大型 AAA
              实时服务游戏的水平。
