        blocks:
          - type: paragraph
            body: >-
              指定资料首先把 Shrapnel 定义为免费游玩的竞技 FPS，其次才是代币化创作者经济。Steam 抢先体验 FAQ 称游戏仍免费游玩，当前围绕 Stockpile 这一 4v4
              目标模式展开，并通过可选战斗通行证、外观物品和角色解锁变现。第三方资料补充了 Web3 层：Coinranking 将 SHRAP 描述为发布玩家创作内容、治理、市场交易和子网 gas 所用的代币；The New
              Stack 则称产品希望让 Web2 玩家能无门槛进入核心循环，同时为 Web3 参与者提供所有权和创作者变现。这个边界排除了纯加密投机，也排除了不会接受钱包、NFT 或创作者经济流程的更广泛射击游戏市场。
