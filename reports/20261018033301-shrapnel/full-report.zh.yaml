        title: 产品包装仍不透明，转换更多取决于生态吸引力而非标价
        blocks:
          - type: paragraph
            body: >-
              公开的产品包装信息并不完整。Games.gg 称玩家曾可通过三个付费 Extraction Pack 档位进入；2026 年中国报道则把当前产品描述为免费游玩，并在 Trusted Copyright Chain
              框架下进行以人民币结算的数字资产交易。这足以说明 Shrapnel 正在平衡更广泛的免费游玩漏斗与付费或收藏型变现，但不足以与 Web3
              同行或传统撤离射击游戏建立可比价格表。实际来看，转换成本最多中等：创作者可能在 Shrapnel 内积累身份、资产和市场声誉，但公开证据仍未显示明确的统一价格体系或能把用户锁定在竞争游戏之外的企业级分发渠道。
