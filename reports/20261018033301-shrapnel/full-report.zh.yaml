              撤离射击游戏：核心是小队交火，同时叠加创作者经济、市场交易和区块链支持的数字所有权；区块链并不承载链上核心玩法。官方、合作方和独立技术资料对产品定位的描述基本一致：这是基于 Unreal Engine 5、运行在
