      - ['Creator tools and creator monetization', 'Yes; insignias, skins, gear, maps, and marketplace exchange', 'Unknown in retained pool', 'Mostly closed or unproven in retained pool', 'Yes as a precedent for creator behavior, but not in Shrapnel''s exact format']
