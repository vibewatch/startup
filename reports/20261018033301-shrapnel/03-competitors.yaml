      - ['Shrapnel China early access', 'Free-to-play framing; RMB digital-asset trading path', 'Gameplay access paired with regulated digital-asset activity through TCC', 'Revenue-share mechanics and realized user economics remain undisclosed', 'Distribution reach may matter more than current sticker price if China onboarding scales']
      - ['Direct Web3 shooter peers', 'Unknown in retained pool', 'Unknown in retained pool', 'No retained price cards or contract terms', 'Price is not yet a clean public differentiator versus direct peers']
      - ['Traditional extraction shooter substitutes', 'Unknown in retained pool', 'Unknown in retained pool', 'No retained pricing pages in this worker pool', 'Comparison shifts toward gameplay quality and progression rather than visible price superiority']
      - ['Creator-platform / mod substitutes', 'Unknown in retained pool', 'Unknown in retained pool', 'No retained creator-take-rate or tooling-cost disclosures', 'Shrapnel must win on creator earnings and tools, not just on token rhetoric']
    notes: >-
      This table preserves the public evidence boundary: it logs the visible
      access model while explicitly flagging where the assigned pool does not
      support a current apples-to-apples pricing comparison.
    claimRefs: [CP004, CP005, CP006, CP007, CP011]
figures:
  - id: FP001
    title: Competitive positioning by shooter fidelity and creator-owned economy depth
    type: quadrant
    summary: >-
      Ordinal scoring places Shrapnel furthest toward the combination of
      extraction-shooter intensity and creator-owned economy depth evidenced in
      the retained pool.
    data:
      xAxis:
        label: Core shooter fidelity and extraction urgency
        min: 1
        max: 5
        lowLabel: Low
        highLabel: High
        description: Ordinal score based on whether the retained pool evidences a primary shooter loop rather than a creator-first platform.
      yAxis:
        label: Creator-owned economy and monetization depth
        min: 1
        max: 5
        lowLabel: Low
        highLabel: High
        description: Ordinal score based on retained evidence for creator tools, monetization, marketplace exchange, and asset ownership.
      points:
        - label: Shrapnel
          x: 5
          y: 5
          detail: AAA extraction-FPS core combined with creator maps, skins, and tradable digital assets.
          claimRefs: [CP002, CP003, CP010]
        - label: Web3 FPS peers
          x: 3
          y: 2
          detail: Games.gg confirms the peer set exists, but the retained pool does not evidence creator depth or packaging parity.
          claimRefs: [CP001, CP006]
        - label: Traditional extraction FPS
          x: 5
          y: 1
          detail: Dapp.Expert contrasts traditional extraction FPS with closed economies and no blockchain layer.
          claimRefs: [CP001, CP002]
        - label: Fortnite-style AAA live service
          x: 4
          y: 2
          detail: The New Stack places Shrapnel in the same AAA engine conversation as Fortnite, but not at the same ownership depth.
          claimRefs: [CP008, CP011]
        - label: Roblox / Minecraft creator platforms
          x: 2
          y: 4
          detail: Creator participation is strong precedent, but the retained pool does not frame these platforms as extraction shooters.
          claimRefs: [CP003, CP010]
        - label: Legacy mod ecosystems
          x: 2
          y: 3
          detail: Doom and Quake style community modding proves creator appetite without native tokenized ownership.
          claimRefs: [CP003, CP011]
    approximationNotes: >-
      The coordinates are ordinal synthesis from retained source evidence, not
      sourced market-share or benchmark scores.
    claimRefs: [CP001, CP002, CP003, CP010, CP011]
