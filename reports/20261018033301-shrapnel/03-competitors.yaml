      whyItMatters: Without current peer price cards, the analysis can compare packaging direction but cannot conclude that Shrapnel wins on visible cost of entry.
      diligencePath: Request current storefront screenshots or internal pricing docs for Shrapnel and the named peer set, then rebuild the pricing table with dated public or primary evidence.
      relatedQuestionRefs: [QP003]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: competitor-scale
      missingEvidence: Comparable public MAU, paying-user, creator, or revenue metrics for Undead Blocks, EV.IO, MetaOps, and other direct Web3 shooter peers.
      whyItMatters: Scale visibility is necessary to test whether Shrapnel is competing inside a niche peer group or against alternatives that already have stronger network effects.
      diligencePath: Add dated operator disclosures, investor materials, or independent traffic and engagement estimates for the named peer set before making stronger market-share claims.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP001]
