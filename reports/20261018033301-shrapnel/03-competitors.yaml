      - ['Traditional extraction FPS', Incumbent substitute, 'Not quantified in retained pool', 'Players who mainly value gunplay, extraction tension, and progression', 'Known gameplay pattern without blockchain complexity', 'Closed economies and no public evidence here of user-owned creator monetization']
      - ['Fortnite-style AAA live service', Adjacent incumbent, 'Not quantified in retained pool', 'Players expecting polished AAA live-service cadence', 'Comparable expectation of content polish and scale', 'Retained pool does not evidence the same extraction focus or asset-ownership thesis']
