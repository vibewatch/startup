schemaVersion: report-v2
artifact: competitors
slug: shrapnel
runDate: 2026-10-18
company:
  name: Shrapnel
chapter:
  number: 3
  title: Competitors
  summary: >-
    Shrapnel competes on two fronts at once: direct Web3 shooter peers and the
    much larger set of traditional extraction shooters and creator-led platforms.
    Its public differentiation is strongest where AAA extraction gameplay,
    creator tooling, and regulated digital-asset rails meet, but public
    competitor pricing and scale disclosure remain thin enough that moat claims
    still rest more on execution than on proven lock-in.
sections:
  - id: competitive-landscape
    title: Competitive alternatives extend beyond named Web3 FPS peers
    body: >-
      Public evidence in this pool shows that Shrapnel should not be evaluated
      only against tokenized shooter peers. Games.gg places it in a Web3 FPS set
      that already includes Undead Blocks, EV.IO, and MetaOps, while the same
      source says Shrapnel also draws inspiration from Tom Clancy's The Division.
      That combination expands the relevant comparison set into three practical
      buckets: direct blockchain-native shooters, conventional extraction
      shooters with closed economies, and creator-led sandboxes or mod
      ecosystems that compete for the same user attention and creator labor.
      Independent commentary also consistently describes Shrapnel as a real
      extraction shooter first and a tokenized economy second, so the most
      relevant substitute is still a compelling game loop rather than a pure
      crypto asset marketplace.
    claimRefs: [CP001, CP002, CP006]
    tableRefs: [TP001]
  - id: differentiation-and-positioning
    title: Differentiation is concentrated in creator tooling and asset ownership
    body: >-
      The retained evidence is directionally consistent that Shrapnel's core
      pitch is not "play to earn" in the older sense, but a creator-heavy
      extraction shooter where users can make insignias, skins, gear, maps, and
      other approved content for marketplace exchange. The New Stack,
      BlockchainGamer.biz, and Dapp.Expert all emphasize creator tools and
      player-owned assets as the distinctive layer on top of the combat loop.
      That creates a positioning angle that traditional extraction shooters do
      not match and that older Web3 titles in the retained pool do not yet prove
      at the same depth. It also means Shrapnel's moat depends on creator
      participation becoming self-reinforcing rather than merely on listing a
      token or shipping a shooter.
    claimRefs: [CP002, CP003, CP010]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: packaging-switching-and-distribution
    title: Packaging remains partially opaque, so switching is more about ecosystem pull than list price
    body: >-
      Public packaging evidence is incomplete. Games.gg says players could enter
      through one of three paid Extraction Pack tiers, while 2026 China coverage
      describes the current product as free-to-play with RMB-settled digital
      asset trading under the Trusted Copyright Chain framework. That is enough
      to show that Shrapnel is balancing a broader free-to-play funnel with paid
      or collectible-style monetization, but not enough to build an apples to
      apples price card against direct Web3 peers or incumbent extraction
      shooters. In practice, the visible switching-cost story is therefore
      moderate at best: creators may accumulate identities, assets, and
      marketplace reputation inside Shrapnel, yet public evidence still does not
      show a disclosed price umbrella or enterprise-style distribution channel
      that would clearly lock users away from competing games.
    claimRefs: [CP004, CP005, CP006, CP007, CP011]
    tableRefs: [TP003]
  - id: durability-and-adverse-evidence
    title: Durability is plausible but still vulnerable to execution and category pressure
    body: >-
      The adverse evidence in the retained pool is less about an incumbent
      crushing Shrapnel today and more about whether the category can sustain the
      model it promises. Dapp.Expert explicitly calls the extraction-FPS field
      intensely competitive, and Coinranking warns that blockchain titles remain
      exposed to scrutiny over whether gameplay quality can outrun economic
      speculation. At the same time, Shrapnel's public infrastructure story has
      already shifted from Avalanche-subnet logic toward GalaChain and China's
      TCC bridge, which shows adaptability but also underlines execution risk in
      platform migration and regional rollout. RootData and Coinranking show a
      venture-backed studio with meaningful funding, yet still not one whose
      disclosed scale obviously matches major AAA live-service incumbents.
    claimRefs: [CP008, CP009, CP012, CP013, CP014]
