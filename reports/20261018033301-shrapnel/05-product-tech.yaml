company:
  name: "Shrapnel"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Shrapnel’s product thesis is a game-first extraction shooter wrapped with optional Web3 ownership and creator-economy layers, not an on-chain game loop. The evidence shows real product iteration from rough 2024 STX builds to a 2026 Steam early-access rebuild, but it also leaves a material diligence gap around whether the token, marketplace, and creator stack now run on GalaChain, Avalanche-era rails, or a mixed transition state."
sections:
  - id: "product-surface-and-player-loop"
    title: "Product surface and player loop"
    body: "Public descriptions consistently frame Shrapnel as a PC first-person extraction shooter rather than a token-first game. The core user job is to enter the Sacrifice Zone, collect Sigma or other loot under combat pressure, and extract before losing the run, with optional progression through Operators, perks, cosmetics, and creator-economy participation. That matters because the product is trying to monetize two layers at once: a conventional competitive shooter loop for players who never touch wallets, and a marketplace-plus-UGC layer for creators and asset traders. The product map is therefore broader than just 'one game client' and includes distribution, account onboarding, the live match loop, the SHRAP / NFT economy, and creator tooling."
    claimRefs: ["CE001", "CE002", "CE004", "CE005", "CE013"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-operating-model"
    title: "Architecture and operating model"
    body: "The common architecture across sources is relatively coherent at a functional level even when chain branding changes. Unreal Engine 5 anchors the game client and visual layer, while the time-sensitive shooter experience stays off-chain: real-time combat, recoil, movement, extraction, and at least some leaderboard-style features are described as conventional game systems. Blockchain is reserved for ownership, marketplace settlement, and publishing player-created content. The main unresolved architecture question is migration. Older sources repeatedly describe an Avalanche subnet or dedicated Avalanche chain, whereas a 2026 explainer says the asset and royalty stack moved to GalaChain. That divergence does not break the product thesis, but it does mean current diligence still needs an official architecture note before underwriting wallet, token, and settlement dependencies."
    claimRefs: ["CE003", "CE004", "CE008", "CE009", "CE010", "CE011", "CE012"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-trust-and-product-risks"
    title: "Maturity, trust, and product risks"
    body: "Maturity has improved, but the public record still describes a product under active construction rather than a stable, fully evidenced live service. The 2024 STX-era build reportedly had one operator, limited weapons, unfinished maps, and narrow play windows, while a 2026 rebuild narrative adds server-side bullet pooling, fixes for movement exploits, and a broader Steam early-access surface. That is credible iteration, yet the assigned sources still do not provide the operating metrics a buyer or investor would want: no public uptime or support SLA, no independent security-assurance or privacy disclosures for wallet or marketplace flows, no current creator-tool adoption data, and no clear technical migration memo for the chain stack. Even discoverability is a small but real drag because 'Shrapnel' is also a generic ordnance term and a 2023 film title, which can crowd generic search surfaces."
    claimRefs: ["CE006", "CE007", "CE010", "CE011", "CE014"]
