callouts:
  - calloutType: "strength"
    title: "Game loop is insulated from most blockchain latency"
    body: "The strongest product-design choice is the separation between the real-time shooter loop and the ownership layer: public sources repeatedly describe blockchain as a rail for assets, publishing, and marketplace functions rather than a dependency for every combat action."
    claimRefs: ["CE003", "CE004", "CE013"]
  - calloutType: "risk"
    title: "Architecture transition is still not externally reconciled"
    body: "Investors should treat the chain and settlement layer as an open diligence item because assigned sources split between Avalanche-subnet descriptions and a newer GalaChain migration narrative without an official transition document in the pool."
    claimRefs: ["CE008", "CE009", "CE010"]
  - calloutType: "insight"
    title: "Creator economy is the moat, but also the hardest operating problem"
    body: "UGC, royalties, and map / skin tooling are what make Shrapnel strategically different from a normal extraction shooter, but those same features create the largest moderation, IP, and adoption burden."
    claimRefs: ["CE005", "CE011", "CE013"]
