      - ["Marketplace and SHRAP economy", "Collectors, traders, creators", "Functionally present in public materials but current chain rail is not cleanly reconciled", "Optional ownership layer for cosmetics, assets, royalties, and token-mediated publishing", "Need an official current-state view of token flow, take rate, and settlement stack"]
      - ["Creator tools / UGC", "Map and cosmetic creators", "Insignia / vanity tooling described as nearer-term; maps remain part of the future creator thesis", "Community-authored content is positioned as a core differentiator rather than a side feature", "Approval workflow, moderation throughput, and creator earnings are not publicly evidenced"]
