      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - ["Core live-service shooter", "Free-to-play team FPS engagement and optional in-game monetization", "Premium boxed-shooter sales and non-shooter genres", "Player / player", "Steam positions Shrapnel as a free-to-play 4v4 objective FPS."]
      - ["Early-access participation", "Time and attention from players willing to test unfinished builds", "Players who require a polished 1.0 launch before trying the game", "Player / player", "Epic and Steam both describe feedback-driven iteration as part of the product loop."]
      - ["Creator economy", "Spend or effort on publishing skins, maps, vanity items, and other player-created content", "Traditional modding with no ownership or marketplace layer", "Creator / creator", "The New Stack and Coinranking both describe player-created content and NFT publishing as core differentiators."]
      - ["Token / governance layer", "Marketplace exchange, governance participation, and subnet gas activity tied to SHRAP", "Pure speculative crypto trading outside the game ecosystem", "Token holder / token holder", "Coinranking presents SHRAP as a utility, governance, marketplace, and gas token rather than a standalone consumer product."]
    notes: "Boundary table distinguishes gameplay demand from creator and token-economy participation so the chapter does not overstate a single undifferentiated TAM."
    claimRefs: [CM001, CM002, CM004, CM008, CM011]
  - id: TM002
    title: Public sizing lens table
    columns:
      - Lens
      - Publisher / year
      - Geography
      - Value
      - CAGR / trend
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Community reach", "Epic Games / 2024", "Global online community", ">120,000 Discord members", "n/a", "Interview quote about official Discord scale", "medium", "Community size is not the same as active or paying players."]
      - ["Current active tester base", "Epic Games / 2024", "Global online playtest cohort", "~3,000 current players", "n/a", "Interview quote about players active in the then-current test pool", "medium", "Point-in-time pre-launch participation is not DAU, MAU, or payer count."]
      - ["Commercial scope at launch", "Steam FAQ / 2026 access", "Global digital storefront", "1 mode; 2 operators scaling to 5; 5 weapon types", "n/a", "Official Early Access feature snapshot", "medium", "Feature breadth is a demand constraint, not a direct market-size estimate."]
      - ["Time-to-proof window", "Steam FAQ / 2026 access", "Global digital storefront", "~2 months planned Early Access", "n/a", "Official Early Access duration statement", "medium", "A planned duration is not evidence of retention or long-term adoption."]
    notes: "Because the assigned pool lacks an independent TAM/SAM/SOM study, this table uses public adoption proxies and product-scope lenses instead of pretending unsupported market-size precision."
    claimRefs: [CM002, CM003, CM005, CM006]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow / job
      - Budget owner / adoption trigger
      - Implication
    rows:
      - ["Core competitive shooter player", "Individual player", "Individual or squad player", "Individual player", "Queue into Stockpile and compete in a free-to-play FPS loop", "Personal entertainment budget; adoption starts with shooter quality", "Gameplay quality has to carry demand before web3 features matter."]
      - ["Early-access co-development community", "Individual player", "Playtester and feedback provider", "Mostly time-rich player rather than spender", "Join playtests, track roadmap, and give structured feedback", "Tolerance for unfinished content and belief that feedback matters", "The GTM motion depends on community patience and iteration, not polished launch reliability."]
      - ["Creator / modder", "Creator", "Creator and downstream player", "Creator using time, effort, and potentially SHRAP", "Publish maps, skins, or other PCC and monetize them", "Ownership and monetization trigger", "Creator participation is a differentiator, but it narrows the audience to users who want more than match play."]
      - ["Token / governance participant", "Token holder", "Token holder or curator", "Token holder", "Use SHRAP for governance, marketplace exchange, and subnet utility", "Crypto-native willingness to hold and use a game token", "This can expand monetization depth without expanding mainstream reach at the same rate."]
    notes: "Buyer map separates user, payer, and creator roles because Shrapnel's shooter loop and token economy do not rely on the same adoption trigger."
    claimRefs: [CM001, CM004, CM007, CM008, CM009, CM011]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: "The assigned evidence supports a sequence of adoption filters rather than a source-backed TAM/SAM/SOM stack."
    data:
      nodes:
        - label: "AAA / competitive FPS interest"
          detail: "Steam and Epic both position Shrapnel as a free-to-play, squad-based competitive shooter."
          claimRefs: [CM001, CM002]
        - label: "Extraction / objective-mode fit"
          detail: "Current gameplay centers on Stockpile, a 4v4 objective mode with a 300 grav-kilo Sigma win condition."
          claimRefs: [CM002]
        - label: "Early-access patience"
          detail: "Public buyers must tolerate a short, changeable Early Access period and unfinished live-service scope."
          claimRefs: [CM003, CM005]
        - label: "Community-shaped participation"
          detail: "The company relies on scheduled playtests, roadmap updates, and player feedback to tune the product."
          claimRefs: [CM007, CM012]
        - label: "Web3 / NFT willingness"
          detail: "Independent coverage highlights persistent market skepticism toward crypto and NFT gaming."
          claimRefs: [CM008, CM010]
        - label: "Creator and token engagement"
          detail: "The long-form thesis depends on player-created content plus SHRAP-based governance, marketplace, and gas utility."
          claimRefs: [CM009, CM011]
    approximationNotes: "Qualitative filter stack only: the assigned pool does not provide independent TAM, SAM, SOM, or CAGR figures for a precise numeric market pyramid."
    claimRefs: [CM001, CM002, CM003, CM005, CM007, CM008, CM009, CM010, CM011, CM012]
