  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: An independent market study or public-company disclosure that quantifies the addressable blockchain-FPS or creator-economy market with methodology, geography, and timeframe.
      whyItMatters: Without a third-party sizing anchor, the chapter can only defend proxy lenses and adoption filters, not a valuation-grade TAM/SAM/SOM estimate.
      diligencePath: Retain an assigned independent market-data or public-company source that discloses category size, growth, and segment boundary.
      relatedQuestionRefs: [QM002]
    - type: private-evidence-only
      severity: material
      topic: conversion-and-retention
      missingEvidence: DAU, MAU, payer conversion, retention cohorts, or sustained concurrency after public access periods.
      whyItMatters: Community reach without conversion and retention data does not show whether Shrapnel is broadening from curiosity into durable shooter demand.
      diligencePath: Request internal dashboard extracts or a third-party platform analytics disclosure covering active users, retention, and payer behavior.
      relatedQuestionRefs: [QM007]
    - type: missing-source
      severity: material
      topic: creator-unit-economics
      missingEvidence: Public data on creator take rates, marketplace GMV, publisher moderation costs, and the percentage of sessions or revenue driven by creator-made content.
      whyItMatters: The creator economy is central to the thesis, but without unit economics it is impossible to judge whether it expands margin and demand or just adds complexity.
      diligencePath: Request marketplace KPI disclosures or retain an assigned third-party source that quantifies creator monetization outcomes.
      relatedQuestionRefs: [QM006]
