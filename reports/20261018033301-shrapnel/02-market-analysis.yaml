schemaVersion: "report-v2"
artifact: market-analysis
slug: shrapnel
runDate: 2026-10-18
company:
  name: Shrapnel
chapter:
  number: 2
  title: Market Analysis
  summary: >
    Shrapnel is not selling into a generic "gaming" market so much as the overlap
    between free-to-play competitive shooters, early-access live-service testers,
    and a narrower web3 creator economy. The assigned evidence supports adoption
    proxies and demand filters, but it does not support a clean third-party
    TAM/SAM/SOM estimate, so valuation-sensitive sizing remains a material gap.
sections:
  - id: market-boundary
    title: Market boundary and monetization logic
    body: >
      The assigned sources frame Shrapnel first as a free-to-play competitive FPS
      and only second as a tokenized creator economy. Steam's Early Access FAQ says
      the game remains free-to-play, centers on Stockpile as a 4v4 objective mode,
      and monetizes through optional battle passes, cosmetics, and operator unlocks.
      Third-party coverage adds the web3 layer: Coinranking describes SHRAP as the
      token for publishing player-created content, governance, marketplace exchange,
      and subnet gas, while The New Stack describes the product goal as an FPS that
      keeps the core loop accessible for Web2 players while enabling ownership and
      creator monetization for Web3 participants. That boundary excludes pure
      crypto-token speculation and also excludes the much broader shooter market
      that will never accept a wallet, NFT, or creator-economy workflow.
    claimRefs: [CM001, CM002, CM004, CM008, CM011]
    tableRefs: [TM001]
  - id: adoption-proxies
    title: Public sizing lenses and adoption filters
    body: >
      The chapter pool does not contain an independent market report with a
      credible blockchain-FPS TAM, SAM, or CAGR, so the best supportable approach
      is a constrained set of adoption proxies. Epic's March 2024 interview gives
      the cleanest public signal: more than 120,000 Discord members but only around
      3,000 current players in the then-current test pool, implying strong top-of-
      funnel awareness but a much smaller active cohort. Steam's Early Access FAQ
      shows why conversion is still narrow: the live offer was scoped to one mode,
      a small operator roster, and a short planned Early Access window that could
      still change with feedback. The pyramid below therefore shows demand as a set
      of qualitative filters rather than a false precision TAM stack.
    claimRefs: [CM002, CM003, CM005, CM006, CM007, CM012]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and diligence gaps
    body: >
      The strongest adoption driver in the assigned pool is community-shaped
      iteration: Epic describes recurring STX and weekly playtests, Steam promises
      roadmap updates and feedback loops, and the March 2026 CEO note says the team
      reworked the experience into Stockpile to make matches faster and clearer.
      The creator-economy thesis is the second driver; both Coinranking and The New
      Stack say ownership, user-generated content, and marketplace activity are
      central to the product vision. The biggest constraints are external skepticism
      about crypto gaming and internal discoverability friction. The New Stack
      explicitly cites broad developer disinterest in NFTs, while the assigned pool
      also returned an artillery-shell article, a film listing, and a dictionary
      entry for "Shrapnel," showing that even undifferentiated search intent can
      route users toward meanings unrelated to the game. That makes traction,
      creator monetization, and brand-conversion data especially important gaps.
    claimRefs: [CM006, CM007, CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
tables:
