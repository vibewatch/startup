schemaVersion: "report-v2"
artifact: financials
slug: shrapnel
runDate: 2026-10-18
company:
  name: Shrapnel
chapter:
  number: 4
  title: Financials
  summary: >-
    Shrapnel has a legible monetization stack—free-to-play access, NFT/operator sales, marketplace activity,
    creator tooling, and the SHRAP token—but the retained public evidence still does not disclose recognized
    revenue, gross margin, burn, or runway. Public traction and infrastructure signals are directionally useful,
    yet the underwriting case remains constrained by missing operating cash-flow and unit-economics disclosure.
sections:
  - id: monetization-surface
    title: Monetization surfaces are visible, realized revenue is not
    body: >-
      The retained sources consistently describe Shrapnel as a free-to-play AAA extraction shooter whose economic
      layer sits on top of gameplay rather than behind an up-front software license. Official materials emphasize
      tradable Operators, cosmetics, marketplace activity, and item-creation sinks such as the Printer and Recycle
      Depot, while third-party coverage adds SHRAP token utility and creator-economy participation. What is public,
      however, looks more like monetization plumbing than recognized revenue disclosure: RootData shows a live token
      market snapshot, Play2Moon describes NFT presales in the hundreds to thousands of dollars, and Dapp.expert
      frames SHRAP as the marketplace's core transaction asset, but none of those sources disclose net marketplace
      take rate, realized pricing after discounts, or how much of token/NFT activity accrues as revenue to Neon
      Machine.
    claimRefs: [CI001, CI002, CI004, CI011, CI013, CI015]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-cost-stack
    title: Public traction proxies exist, but unit economics remain mostly private
    body: >-
      Public traction evidence is real but still proxy-heavy. The official site reports 3.7 million game sessions,
      384,000 items sold, 943,000 sigma collected, and 37 million shots fired, while EGamers describes a player
      community above 100,000 Discord members and recurring 2026 playtests. Those signals suggest active top-of-
      funnel interest and in-economy transactions, but they are not the same as net revenue, payer conversion, or
      retention. On the cost side, New Stack and Gaming on Avalanche point to a materially layered operating stack:
      Unreal Engine 5.x development, an Avalanche subnet, custodial-wallet/payment infrastructure, publishing
      services, and other third-party systems. That combination can support scale and smoother onboarding, but it
      also implies service-delivery and platform costs that are not quantified in the retained public record.
    claimRefs: [CI003, CI006, CI007, CI008, CI009, CI014]
    tableRefs: [TI003]
  - id: capital-adequacy-verdict
    title: Capital adequacy is the main diligence blocker
    body: >-
      RootData's public market-data snapshot shows $37.5 million raised and a token market cap far below historic
      venture expectations discussed in prior refresh context, but the retained current sources do not disclose cash
      on hand, burn, runway, debt facilities, or the exact economics of the planned China push. EGamers notes a
      China-oriented SHRAP buyback strategy tied to local revenues, while Play2Moon argues the token was launched
      before the game was finished and before a mature content base existed. Taken together, the evidence supports a
      financing picture built around venture funding plus token-market/liquidity mechanisms rather than one sustained
      by disclosed operating cash generation. Financially, the model is intelligible, but the revenue quality,
      margin path, and next-financing trigger remain unproven.
    claimRefs: [CI004, CI005, CI010, CI012, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - ["Core gameplay access", "Free-to-play PC extraction shooter access", "player session", "Public sources describe F2P access and public playtests; no software license revenue disclosed", "Medium visibility on access model, low visibility on monetization", "Disclose MAU/DAU, payer conversion, and net revenue per active player"]
      - ["Operator and cosmetic sales", "Primary sale of digital items / Operator NFTs", "item sale", "Play2Moon says Operator NFTs sold for hundreds to thousands of dollars during presales", "Low-to-medium because realized sell-through and refunds are undisclosed", "Provide unit volumes, realized ASP, and resale/royalty split by drop"]
      - ["Marketplace trading", "Secondary trading of Operators/items on the Shrapnel Marketplace", "transaction / take rate", "Official site confirms marketplace functionality, but platform take rate is not disclosed", "Medium on existence, low on revenue capture", "Disclose marketplace fee schedule, creator split, and gross vs net marketplace GMV"]
      - ["Creator-economy tools", "Players mint/publish content that can earn SHRAP", "creator payout / platform take", "Dapp.expert and Play2Moon describe creator-economy participation, but platform monetization terms are undisclosed", "Low on revenue realization", "Disclose UGC payout formula, moderation costs, and platform share"]
      - ["China-linked token demand", "Planned SHRAP buyback aligned with local revenues", "buyback / revenue share", "EGamers reports the strategy; exact China revenue-share terms and transaction volume are undisclosed", "Low", "Provide China publishing counterparties, revenue-share formula, and buyback funding source"]
    notes: >-
      Public evidence cleanly shows the revenue mechanisms, but not recognized revenue; null-like descriptions mean
      the retained sources expose the product/transaction pathway without disclosing realized dollars.
    claimRefs: [CI001, CI002, CI010, CI011, CI013, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / monetization surface
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - ["Base game / public playtests", "Free-to-play positioning and time-bounded public playtests", "No public disclosure of monetization by cohort, battle pass, or paid access gating", "Official site; EGamers"]
      - ["Operator NFT presales", "Play2Moon says Operators sold for hundreds to thousands of dollars during presales", "No retained source discloses quantity sold, realized blended ASP, or refund/secondary dynamics", "Play2Moon"]
      - ["SHRAP token", "RootData shows spot price $0.010494, market cap about $9.49m, and FDV about $31.48m on the snapshot date", "Token price is tradable market data, not company revenue or realized in-game pricing", "RootData"]
      - ["Marketplace / creator economy", "Marketplace exists and SHRAP is positioned as the transaction asset", "No fee schedule, creator royalty split, or fiat/off-ramp economics disclosed", "Official site; Dapp.expert"]
    notes: >-
      Prices here are list-like or market snapshots rather than recognized revenue; they should not be treated as
      realized company pricing, gross margin, or ARR.
    claimRefs: [CI002, CI004, CI011, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Recognized revenue", null, "Low", "Without net revenue, investor underwriting cannot anchor valuation or runway", "Monthly recognized revenue by channel, geography, and gross vs net presentation"]
      - ["Gross margin", null, "Low", "Infrastructure, payment, creator payouts, and blockchain costs could materially change contribution economics", "Gross profit bridge for first-party sales, marketplace fees, and token-related programs"]
      - ["Engagement proxy", "3.7M game sessions, 384K items sold, 943K sigma collected, 37M shots fired", "Medium", "Shows product activity but not payer mix or retention", "Session-to-payer conversion, cohort retention, and repeat marketplace activity"]
      - ["Community / launch proxy", ">100K Discord members and a February 2026 six-hour playtest", "Medium", "Signals top-of-funnel interest and live-ops cadence", "Steam wishlists, active players, concurrent users, and post-playtest conversion"]
      - ["Capital raised / token snapshot", "$37.5M total raised; token market cap about $9.49M; FDV about $31.48M", "Medium", "Frames external financing support and current token-market scale, but not cash available to operate", "Cash balance, treasury composition, token lockups, and debt/project-finance obligations"]
    notes: >-
      Null means the retained public sources do not disclose the metric. Public proxies show engagement and market
      activity, but not customer acquisition cost, payback, retention monetization, or operating cash flow.
    claimRefs: [CI003, CI004, CI009, CI014, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports the monetization steps, but not the company's retained economics at each step.
    data:
      nodes:
        - id: reach
          label: Free-to-play reach and playtests
          detail: Official site gameplay stats and EGamers' 2026 playtest/community signals show activity at the top of the funnel.
          claimRefs: [CI001, CI003, CI009]
        - id: asset-demand
          label: Players acquire operators, cosmetics, and lootable assets
          detail: Official and review sources describe tradable Operators, cosmetics, and NFT-linked item ownership.
          claimRefs: [CI002, CI011]
        - id: creator-layer
          label: Creators mint maps and assets into the ecosystem
          detail: Creator tooling is meant to expand supply and keep more content/community activity inside the marketplace.
          claimRefs: [CI011, CI013]
        - id: marketplace
          label: Marketplace and token transactions occur
          detail: SHRAP is positioned as the marketplace and creator-economy transaction asset.
          claimRefs: [CI004, CI013]
        - id: service-stack
          label: Wallet, chain, publishing, and platform vendors add cost layers
          detail: Avalanche subnet, custodial wallet focus, Fireblocks, Moonpay, Accelbyte, and similar services imply non-trivial delivery cost.
          claimRefs: [CI006, CI007, CI008]
        - id: retained-economics
          label: Retained gross profit is undisclosed
          detail: No retained source provides the marketplace take rate, creator split, gross margin, burn, or runway.
          claimRefs: [CI014, CI015, CI016]
      edges:
        - from: reach
          to: asset-demand
          label: engagement converts into asset demand
        - from: asset-demand
          to: creator-layer
          label: owned items and tools support UGC
        - from: creator-layer
          to: marketplace
          label: content and items circulate through transactions
        - from: marketplace
          to: service-stack
          label: payments, custody, and chain infrastructure process activity
        - from: service-stack
          to: retained-economics
          label: company capture depends on undisclosed fees and costs
    claimRefs: [CI002, CI004, CI006, CI007, CI008, CI011, CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Underwriting blocker
    body: >-
      The strongest public metrics are gameplay activity and token/marketplace proxies, not recognized revenue,
      gross margin, cash balance, or runway. That makes the financial debate about Shrapnel's business model more
      about architecture and monetization intent than about proved operating performance.
    claimRefs: [CI003, CI004, CI014, CI016]
  - calloutType: insight
    title: Monetization breadth exceeds monetization proof
    body: >-
      Shrapnel appears to have multiple ways to generate economic activity—NFT sales, marketplace fees, creator
      tooling, and token transactions—but public disclosure still does not show which stream is largest, recurring,
      or profitable.
    claimRefs: [CI002, CI011, CI013, CI015]
