company:
  name: Shrapnel
chapter:
  number: 7
  title: Risks
  summary: >-
    Shrapnel's highest residual risk is not a single legal event but the combined burden of
    proving mainstream player retention, hiding Web3 onboarding friction, and scaling a
    moderated creator economy before the SHRAP token and marketplace can support durable
    value. Current mitigations exist — Steam Early Access feedback loops, custodial wallets,
    an exclusive Avalanche subnet, and anti-cheat tooling — but the assigned evidence still
    points to execution, adoption, and dependency risk remaining materially high.
sections:
  - id: ranked-risk-stack
    title: Ranked residual risk stack
    body: >-
      The residual-risk stack is led by adoption and execution rather than by a disclosed court
      case or regulator action in the assigned pool. Shrapnel has now reached Steam Early
      Access and is explicitly using live player feedback to tune balance, match flow, and
      content, which is constructive because it creates a measurable operating loop. The same
      evidence also confirms that the title remains in early access, so commercial durability
      is still unproven. At the same time, multiple sources show that the product thesis is
      inseparable from wallet abstraction, token-mediated ownership, and a creator marketplace.
      That means the company is not merely shipping a shooter; it must make Web3 friction
      invisible to mainstream FPS players while also convincing creators to supply maps, skins,
      and other content that remains safe enough to approve and liquid enough to trade. The
      highest-conviction downside therefore is a three-part miss: weak retention after launch,
      user friction around wallets and asset flows, and insufficient creator-marketplace depth
      to justify the token economy.
    claimRefs: [CR001, CR002, CR003, CR009, CR012, CR014]
    figureRefs: [FR001]
  - id: legal-regulatory-and-governance
    title: Legal, regulatory, and governance exposure is structural rather than incident-proven
    body: >-
      The assigned evidence does not document an active lawsuit, enforcement order, or formal
      regulator complaint, so this chapter should not imply one. What it does document is a
      business model in which the SHRAP token acts as utility, governance, marketplace
      exchange, and subnet gas token while approved player-created assets are minted and traded
      as NFTs. That architecture expands the surface area for securities-style scrutiny,
      marketplace and consumer-protection obligations, IP and content-rights disputes, and
      moderation accountability around user-generated assets. Because the public pool does not
      include current legal opinions, policy terms, or regulator correspondence, the correct
      posture is not "clear" but "structurally exposed with incomplete public verification."
      The investment implication is that diligence should focus on how token-governance,
      approval workflows, sanctions/KYC boundaries, and creator-rights processes are actually
      administered in production rather than assuming that gameplay quality alone determines
      risk.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR001]
  - id: operational-and-dependency
    title: Operational and dependency risk still sits above mitigation maturity
    body: >-
      Operationally, Shrapnel is trying to run a live-service extraction shooter, an anti-cheat
      stack, a creator toolchain, a marketplace, and blockchain-linked asset plumbing at the
      same time. The New Stack's reporting is useful here because it shows both mitigation and
      residual exposure: Shrapnel uses custodial wallet technology to reduce user friction,
      relies on Anybrain for anti-cheating and Byfron for anti-tampering, and chose an
      exclusive Avalanche subnet so it does not share block space with unrelated dApps. Those
      are sensible architecture choices, but none removes the core burden of execution. Even
      the company's own external advocates emphasize that creation is hard, that only some
      creators will be able to contribute meaningful content, and that the product vision
      assumes creator participation becomes a major share of engagement. The combination makes
      dependency concentration broader than a normal shooter: blockchain infrastructure,
      onboarding partners, creator liquidity, and live-ops/security vendors all matter to the
      same player experience.
    claimRefs: [CR003, CR004, CR008, CR010, CR011, CR013]
    tableRefs: [TR002, TR003]
  - id: kill-criteria-and-diligence
    title: Kill criteria and diligence path
    body: >-
      The cleanest thesis-break indicators are monitorable. A lower-risk view requires evidence
      that early-access retention and content cadence are improving, that wallet abstraction is
      good enough for mainstream users, that creator tools are generating moderated content at
      scale, and that token unlocks are not overwhelming marketplace demand. The absence of
      public DAU, payer conversion, creator throughput, moderation staffing, partner SLAs, and
      contract economics prevents that conclusion today. A practical diligence path is to ask
      management for current live-ops metrics, partner and platform dependency maps, token
      treasury and unlock-management policies, creator-review queues, and any incident logs
      covering fraud, exploits, or moderation disputes. If management cannot show improving
      retention and creator liquidity while also keeping onboarding friction low, the token and
      marketplace upside case should be treated as unproven rather than deferred.
    claimRefs: [CR001, CR002, CR004, CR006, CR009, CR010, CR014]
callouts:
  - calloutType: risk
    title: Kill criteria
    body: >-
      Treat the thesis as broken if Shrapnel cannot show improving live-engagement metrics after
      Early Access, if wallet abstraction still creates visible player friction, or if creator
      tools fail to produce moderated marketplace supply without relying on heavy subsidy.
    claimRefs: [CR001, CR002, CR003, CR009, CR014]
  - calloutType: insight
    title: What already mitigates risk
    body: >-
      The mitigation stack is real — live Steam feedback loops, custodial wallets, an exclusive
      Avalanche subnet, and anti-cheat/anti-tamper partners — but each measure lowers one
      failure mode rather than removing the combined execution burden.
    claimRefs: [CR001, CR004, CR010, CR011]
