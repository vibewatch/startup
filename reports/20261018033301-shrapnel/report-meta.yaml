  topStrengths:
    - Differentiated UE5 extraction-shooter loop with creator tooling layered on top rather than replacing gameplay.
    - Disclosed fundraising history and visible community traction provide real, but still incomplete, proof of demand.
    - China-access and compliance positioning give the product a distinctive distribution narrative.
  topRisks:
    - Revenue, burn, runway, and current private valuation remain undisclosed.
    - Mainstream retention and payer conversion are still not evidenced at durable scale.
