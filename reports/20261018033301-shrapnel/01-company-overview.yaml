  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Shrapnel remains a Seattle-based, venture-backed AAA extraction-shooter project built by Neon Machine around Unreal Engine 5, Avalanche infrastructure, and a creator marketplace. The assigned source pool supports the product identity, leadership bench, and a $37.5M disclosed funding history, but it does not support a current equity valuation, revenue base, headcount, named investors, or China commercial economics."
  },
  "sections": [
    {
      "id": "identity-and-scale",
      "title": "Identity, product scope, and observable scale",
      "body": "Shrapnel presents itself as a PC-first AAA extraction shooter that combines squad-based firefights with a creator economy, marketplace trading, and blockchain-backed digital ownership rather than on-chain core gameplay. Across official, partner, and independent technical coverage, the consistent product identity is an Unreal Engine 5 title running with Avalanche infrastructure and focused on user-generated content as a differentiation layer. The scale signals in the assigned pool are directional rather than financial: official surfaces cite 3.7 million sessions, while other public metrics describe items sold, shots fired, and Sigma-related activity without disclosing unique players, paying users, or revenue conversion. That means later chapters can safely reuse the company identity and technical framing, but not translate engagement counters into customers or monetization.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO003",
        "CO007",
        "CO008",
        "CO012"
      ],
      "tableRefs": [
        "TO001"
      ]
    },
    {
      "id": "leadership-and-control",
      "title": "Leadership bench, governance surface, and stakeholder dependencies",
      "body": "The public leadership picture centers on a small group of entertainment, platform, and game-industry veterans rather than a broad, independently described management bench. Independent reporting names Mark Long as CEO, Aaron Nonis as COO, Don Norbury as studio head, Colin Foran as chief creative officer, and Naomi Lackaff as head of partnerships, while partner and token-reference pages reinforce the Seattle location and Mark Long’s role. Governance and control are split between the studio, creator tools, and the SHRAP token system: token holders are described as voting on DAO and sub-DAO proposals, while Avalanche infrastructure, Epic distribution, and marketplace/payment integrations create concentrated external dependencies. Because no named board members, cap-table rights, or investor control terms appear in the assigned pool, diligence should treat governance visibility as partial.",
      "claimRefs": [
        "CO003",
        "CO009",
        "CO010",
        "CO011",
        "CO013"
      ],
      "tableRefs": [
        "TO002",
        "TO003"
      ]
    },
    {
      "id": "funding-milestones-and-open-gaps",
      "title": "Funding history, milestones, and unresolved disclosure gaps",
      "body": "The clearest hard numbers in the assigned pool concern token-market and fundraising milestones, not company financial performance. RootData records a $10.5M 2021 funding round, a $7M private round in April 2022, and a $20M Series A in October 2023 for a total of $37.5M raised, while Coinranking separately reports current token market capitalization and fully diluted valuation figures that should not be mistaken for an equity valuation. Official 2025 company updates add evidence of ongoing commercialization efforts, including a stated free-to-play launch plan and a March 2025 Beijing copyright seminar appearance, but they still stop short of disclosing revenue, headcount, named investors, or the economics behind China-related partnerships. The chapter’s central diligence conclusion is therefore that company identity and financing chronology are reusable ground truth, while valuation and commercial scale remain open questions.",
      "claimRefs": [
        "CO004",
        "CO005",
        "CO006",
        "CO007",
        "CO008",
        "CO012",
        "CO014"
      ],
      "figureRefs": [
        "FO001"
      ]
    }
  ],
