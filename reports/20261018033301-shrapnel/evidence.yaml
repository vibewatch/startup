evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      Current private-company valuation, pricing basis, and any comparable-set logic separating company equity value
      from token-market value.
    whyItMatters: >-
      A valuation stance cannot be defended from token FDV or market-cap figures without a verified company-equity
      bridge.
    diligencePath: >-
      Request the latest financing documents, board materials, or lead-investor memo that states the company valuation
      and its assumptions.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-scale
    missingEvidence: Revenue, burn, runway, headcount, and conversion from session activity into active or paying users.
    whyItMatters: The chapter can describe engagement proxies, but not the commercial scale or sustainability of the business.
    diligencePath: Request management reporting that ties player activity to revenue, MAU/DAU, payer counts, and staffing trajectory.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Named investors, board composition, lead-investor rights, and full governance documentation for the DAO or token
      treasury.
    whyItMatters: Control rights and downside protections may sit with actors not visible in the public product narrative.
    diligencePath: >-
      Obtain the cap table, financing summaries, board list, and governance charter governing token-holder voting and
      company override rights.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: china-expansion
    missingEvidence: Exact counterparties, legal structure, economics, and player-performance metrics for China-related expansion.
    whyItMatters: >-
      The Beijing seminar demonstrates intent and relationship-building, but not whether China contributes defensible
      revenue or strategic moat.
    diligencePath: >-
      Request signed partnership documents, launch metrics, and any rights-management or revenue-sharing agreements tied
      to China operations.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market study or public-company disclosure that quantifies the addressable blockchain-FPS or
      creator-economy market with methodology, geography, and timeframe.
    whyItMatters: >-
      Without a third-party sizing anchor, the chapter can only defend proxy lenses and adoption filters, not a
      valuation-grade TAM/SAM/SOM estimate.
    diligencePath: >-
      Retain an assigned independent market-data or public-company source that discloses category size, growth, and
      segment boundary.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: conversion-and-retention
    missingEvidence: DAU, MAU, payer conversion, retention cohorts, or sustained concurrency after public access periods.
    whyItMatters: >-
      Community reach without conversion and retention data does not show whether Shrapnel is broadening from curiosity
      into durable shooter demand.
    diligencePath: >-
      Request internal dashboard extracts or a third-party platform analytics disclosure covering active users,
      retention, and payer behavior.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: creator-unit-economics
    missingEvidence: >-
      Public data on creator take rates, marketplace GMV, publisher moderation costs, and the percentage of sessions or
      revenue driven by creator-made content.
    whyItMatters: >-
      The creator economy is central to the thesis, but without unit economics it is impossible to judge whether it
      expands margin and demand or just adds complexity.
    diligencePath: >-
      Request marketplace KPI disclosures or retain an assigned third-party source that quantifies creator monetization
      outcomes.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Current list prices, bundles, discounting, and realized take rates for Shrapnel and the named Web3 FPS peers.
    whyItMatters: >-
      Without current peer price cards, the analysis can compare packaging direction but cannot conclude that Shrapnel
      wins on visible cost of entry.
    diligencePath: >-
      Request current storefront screenshots or internal pricing docs for Shrapnel and the named peer set, then rebuild
      the pricing table with dated public or primary evidence.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable public MAU, paying-user, creator, or revenue metrics for Undead Blocks, EV.IO, MetaOps, and other
      direct Web3 shooter peers.
    whyItMatters: >-
      Scale visibility is necessary to test whether Shrapnel is competing inside a niche peer group or against
      alternatives that already have stronger network effects.
    diligencePath: >-
      Add dated operator disclosures, investor materials, or independent traffic and engagement estimates for the named
      peer set before making stronger market-share claims.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Recognized revenue by channel, gross-vs-net accounting policy, and geographic mix.
    whyItMatters: Underwriting revenue quality and valuation is not possible from engagement proxies alone.
    diligencePath: Request monthly revenue reporting, deferred-revenue treatment, and net revenue reconciliation by stream.
    relatedQuestionRefs:
      - QI001
      - QI008
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Cash on hand, monthly burn, runway, debt facilities, and treasury composition including token holdings.
    whyItMatters: Capital adequacy and next-round timing cannot be assessed from total-raised history alone.
    diligencePath: Request latest cash balance, 12-month operating plan, debt schedule, and treasury/token custody summary.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, payer conversion, retention, ARPPU, and marketplace take rate.
    whyItMatters: The public sources show monetization surfaces but not which customer behaviors produce durable gross profit.
    diligencePath: >-
      Request cohort dashboards linking acquisition source, session activity, payer conversion, repeat trading, and
      contribution margin.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: china-economics
    missingEvidence: >-
      The identity of China counterparties, exact revenue-share terms, and the funding mechanics behind the stated
      buyback strategy.
    whyItMatters: >-
      China is one of the few public expansion levers discussed in retained sources, so the economics could materially
      affect revenue quality and token support.
    diligencePath: Request publishing agreements, buyback policy documents, and China-specific user and transaction metrics.
    relatedQuestionRefs:
      - QI006
  - type: conflicting-data
    severity: material
    topic: architecture-transition-risk
    missingEvidence: >-
      An official 2026 product architecture note that states whether wallets, token rails, marketplace settlement, and
      creator publishing now run on GalaChain, remain on Avalanche-era infrastructure, or span both.
    whyItMatters: >-
      Counterparty, security, compliance, and integration risk change materially if the live ownership stack is
      mid-migration or split across providers.
    diligencePath: >-
      Request the current architecture diagram, wallet and settlement flow, and the migration changelog that reconciles
      Avalanche-era and GalaChain-era public descriptions.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      Independent evidence for live uptime, incident history, wallet-security posture, privacy handling, customer
      support SLA, and any third-party assurance or audit artifacts.
    whyItMatters: >-
      A product that adds wallets, tradable assets, and UGC needs more than feature descriptions to underwrite
      operational resilience and user trust.
    diligencePath: >-
      Request the status page, trust or security center, privacy / data-flow documentation, recent incident log, and any
      audit or penetration-test summaries.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer or practitioner telemetry showing creator-tool adoption, API or SDK usage, forum traffic, or
      another credible proxy for technical community engagement.
    whyItMatters: >-
      The creator-economy thesis is a core differentiator, but the assigned evidence pool does not show whether external
      builders are actually using the tools.
    diligencePath: >-
      Request creator metrics, public documentation links, partner case studies, and any practitioner-community proxy
      the company uses to track tool adoption.
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named production players, creator earners, or customer case studies with deployment scope, spend, and retention
      outcomes.
    whyItMatters: >-
      Aggregate signups and session counts show interest, but they do not prove who the durable customers are or whether
      they expand over time.
    diligencePath: >-
      Request player cohort reporting, creator payout data, named customer references, and at least three independent
      case studies segmented by region and monetization tier.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: durability-gap
    missingEvidence: Retention, churn, GRR, NRR, repeat-purchase, and cohort conversion data for early-access users.
    whyItMatters: >-
      Without durability metrics, investors cannot distinguish short-lived event demand from a compounding customer
      base.
    diligencePath: >-
      Obtain monthly active users, monthly paying users, payer conversion, repeat-purchase cohorts, and retention curves
      by STX cohort and by region.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue mix by pack tier, geography, whale concentration, and creator-economy take rates.
    whyItMatters: >-
      The expansion thesis could still depend on a narrow set of high spenders or one region, which would make the
      customer base less durable than headline community metrics imply.
    diligencePath: >-
      Request cohort economics split by pack tier, China versus ex-China monetization, top-spender share, and creator
      marketplace GMV plus take-rate data.
    relatedQuestionRefs:
      - QU005
  - type: private-evidence-only
    severity: material
    topic: partner-terms
    missingEvidence: >-
      Current commercial terms, SLAs, exit clauses, and contingency plans for Avalanche, custodial wallet, payment, and
      distribution dependencies.
    whyItMatters: >-
      Those contracts determine how quickly Shrapnel can respond to outages, policy conflicts, or partner failure
      without breaking player onboarding.
    diligencePath: >-
      Request the vendor/platform dependency matrix, key contract summaries, and management's fallback plan for each
      external dependency.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: live-metrics
    missingEvidence: >-
      Current DAU, retention, payer conversion, creator activation, moderation throughput, and marketplace liquidity
      metrics after Steam Early Access.
    whyItMatters: >-
      Without live operating metrics, the evidence cannot show whether the mitigations are actually reducing residual
      adoption and execution risk.
    diligencePath: >-
      Request the post-launch KPI dashboard, incident log, creator queue metrics, and cohort trends used internally by
      management.
    relatedQuestionRefs:
      - QR008
  - type: missing-source
    severity: material
    topic: current-equity-valuation
    missingEvidence: >-
      A current priced equity round, share price, liquidation preference stack, or other direct private valuation
      disclosure for Neon Machine.
    whyItMatters: Without a current equity reference, public sources do not support a defendable entry price for the company itself.
    diligencePath: Request the latest financing materials, cap table summary, and board-approved valuation marks from management.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Revenue, payer conversion, gross margin, burn, runway, and customer-acquisition economics.
    whyItMatters: >-
      These are the inputs needed to test whether product traction can justify any premium above disclosed historical
      capital.
    diligencePath: >-
      Obtain monthly KPI reporting, audited or board-level financials, and a management walk-through of monetization
      assumptions.
    relatedQuestionRefs:
      - QV006
      - QV007
  - type: missing-source
    severity: material
    topic: post-launch-retention
    missingEvidence: Post-free-to-play DAU, retention cohorts, payer conversion, and creator-economy usage after broad launch.
    whyItMatters: Event-based or community metrics do not prove the live-service durability needed for an investable bull case.
    diligencePath: >-
      Ask for post-launch KPI dashboards, cohort retention by acquisition channel, and marketplace / creator-tool usage
      statistics.
    relatedQuestionRefs:
      - QV005
      - QV007
      - QV008
  - type: private-evidence-only
    severity: minor
    topic: exit-readiness
    missingEvidence: Management's target exit paths, secondary liquidity planning, and financing runway under base and downside cases.
    whyItMatters: Valuation discipline should incorporate how management expects to fund the roadmap and create investor liquidity.
    diligencePath: >-
      Request the operating plan, fundraising timetable, and board view on strategic, secondary, and standalone
      financing options.
    relatedQuestionRefs:
      - QV007
