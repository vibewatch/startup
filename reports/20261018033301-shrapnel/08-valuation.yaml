company:
  name: "Shrapnel"
chapter:
  number: 8
  title: "Valuation"
  summary: >
    Public evidence still supports a price-sensitive, research-more stance on Shrapnel: the company has
    disclosed meaningful historical funding and a differentiated creator-economy design, but the assigned
    pool does not surface current revenue, burn, cap-table terms, or a current private equity price.
    The only live price signal in the pool is SHRAP token market data, which is not a direct proxy for
    Neon Machine equity value.
sections:
  - id: "recommendation"
    title: "Recommendation remains gated by price support, not by product ambition"
    body: >
      Shrapnel still has enough product ambition to merit diligence, but not enough public operating
      disclosure to justify underwriting a premium entry. Independent sources continue to show a serious
      product and funding effort: Fortune and NFT Plazas both describe the October 2023 Series A, and
      multiple sources describe a game-first creator economy built around player-created assets rather
      than a pure token-farming loop. That matters because the core question is not whether the concept
      sounds differentiated; it is whether public evidence now supports a defensible price. In the
      assigned pool, it does not. The pool shows historical fundraising and a live token market snapshot,
      but it does not disclose current company revenue, margins, burn, runway, liquidation preferences,
      or a current private valuation. Without those inputs, the right call is still research-more, with
      an expensive stance toward any price anchored to narrative rather than disclosed live performance.
    claimRefs: [CV001, CV002, CV003, CV005, CV012, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "valuation-context"
    title: "What public evidence does and does not price today"
    body: >
      The retained sources provide two very different kinds of price context. First, Gate Learn and
      RootData document roughly $37.5 million of disclosed funding across three rounds, with Fortune and
      NFT Plazas adding detail on the $20 million Series A and its investor set. Second, RootData provides
      a current token-market snapshot showing about $9.5 million of circulating market cap and roughly
      $31.5 million of fully diluted value for SHRAP. Those token figures are useful as evidence that
      the ecosystem has a live market reference, but they are not the same thing as an equity valuation
      for Neon Machine. The pool does not disclose current company revenue, monetization efficiency,
      preference stack, or a priced round after 2023, so the public evidence supports discipline rather
      than extrapolation. Bullish arguments therefore have to lean on differentiated product design and
      creator-economy optionality, while bearish arguments can point to the gap between available operating
      disclosure and the amount of narrative investors may want to ascribe to a Web3 AAA title.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV010, CV012]
    tableRefs: [TV002, TV003]
  - id: "diligence-gates"
    title: "The swing factors are retention, monetization, and friction"
    body: >
      The upside case is easy to describe: Shrapnel could become a rare AAA-quality extraction shooter
      that turns creator tools, marketplace activity, and token utility into a durable ecosystem moat.
      The downside case is also clear in the public evidence. Fortune highlights KYC friction for U.S.
      users who want to access the full marketplace, The New Stack notes long-standing gamer skepticism
      toward crypto and NFT mechanics, and Coinranking explicitly flags niche adoption and token unlock
      pressure. Free.cc adds that the company entered 2026 after investor disputes, restructuring, a
      settled lawsuit, and layoff rumors, which is not the backdrop for paying a confidence-heavy
      valuation. That makes the final diligence asks straightforward: prove durable free-to-play
      retention, disclose monetization and runway, clarify current share-price and preference terms, and
      show that creator-economy usage is adding demand instead of just adding token complexity. Until
      those gates clear, the recommendation should stay conservative.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV013]
callouts:
  - calloutType: "recommendation"
    title: "Current call"
    body: >
      Recommendation stays at research-more because the available public evidence supports product
      credibility and historical funding, but not a defendable current entry price.
    claimRefs: [CV001, CV003, CV012, CV013]
  - calloutType: "risk"
    title: "What could still break the thesis"
    body: >
      Even if the game launches cleanly, KYC friction, token unlock pressure, and unproven free-to-play
      retention could prevent creator-economy upside from translating into investable equity value.
    claimRefs: [CV006, CV007, CV011]
tables:
  - id: "TV001"
    title: "Recommendation summary table"
    columns: ["Metric", "Assessment", "Evidence-backed implication"]
    rows:
      - ["Recommendation", "research-more", "Do not underwrite a fresh entry until live operating disclosure closes the valuation gap."]
      - ["Confidence", "medium-low", "Historical funding and product differentiation are real, but current monetization and private price discovery are still undisclosed."]
      - ["Risk rating", "high", "Adoption friction, token unlock pressure, and unresolved operating disclosure make downside easier to model than upside."]
      - ["Valuation stance", "expensive", "Narrative support appears ahead of publicly disclosed revenue, retention, runway, or current equity terms."]
      - ["Decision implication", "Track launch KPIs before price work", "Demand post-launch retention, conversion, and financing evidence before moving beyond research-more."]
    notes: "Assessment reflects retained public evidence only; no current revenue, burn, runway, cap-table, or private share-price disclosure appears in the assigned pool."
    claimRefs: [CV001, CV003, CV006, CV007, CV012, CV013]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns: ["Argument", "Evidence-backed read", "What would change the view"]
    rows:
      - ["Product differentiation", "Multiple sources describe a game-first AAA extraction shooter with creator tools and NFT-backed ownership rather than a pure reward loop.", "Sustained live usage of creator maps, assets, and marketplace activity after broad free-to-play access would strengthen the thesis."]
      - ["Capital support", "Disclosed historical funding totals roughly $37.5 million, including a $20 million Series A led by Polychain Capital.", "A new priced round, clear runway disclosure, or proof that existing cash still funds the roadmap would strengthen durability."]
      - ["Monetization proof", "The pool does not disclose current revenue, margins, payer conversion, or unit economics.", "Management-level disclosure of revenue mix, retention, payer conversion, and burn would materially improve underwriting confidence."]
      - ["Price support", "The only live market reference in the pool is SHRAP token pricing, not a current Neon Machine equity valuation.", "Current equity pricing, liquidation preferences, and dilution terms are required before moving from expensive to investable."]
    notes: "Rows separate evidence-backed strengths from missing valuation inputs; token market data is not treated as a direct equity proxy."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV012]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns: ["Scenario", "Assumptions", "Valuation / return logic", "Key risks or downside trigger", "Probability signal"]
    rows:
      - ["Bull", "Free-to-play launch produces durable retention, creator tools gain real usage, and marketplace demand grows without pay-to-win backlash.", "A premium entry could become supportable only after live retention, monetization, and financing disclosure show that equity value should sit materially above historical capital invested.", "Creator tools fail to convert into content volume, or token utility overwhelms gameplay.", "Would require disclosed KPIs that are absent from the current pool."]
      - ["Base", "The game launches, community interest persists, but operating disclosure remains thin and blockchain friction continues to slow mainstream conversion.", "Maintain research-more; token-market data and historical funding support continued tracking, not a firm equity price target.", "Narrative stays ahead of disclosed economics.", "Best matches the currently retained evidence."]
      - ["Bear", "Retention disappoints, token unlock pressure weighs on sentiment, and governance or marketplace friction limits ecosystem participation.", "Downside would argue for passing on any premium private mark because public evidence would still lack revenue support while risk indicators worsen.", "Live-service traction stays event-based rather than durable.", "Supported by explicit public friction and risk signals in retained sources."]
    notes: "Scenario framing avoids false precision because the assigned pool does not disclose current revenue, burn, or cap-table terms."
    claimRefs: [CV003, CV005, CV006, CV007, CV010, CV011, CV012, CV013]
figures:
  - id: "FV001"
    title: "Recommendation logic"
    type: "flow"
    summary: "The recommendation follows from differentiated product evidence, live token-market visibility, and still-missing operating and equity-pricing disclosure."
    data:
      nodes:
        - label: "Differentiated product"
          detail: "AAA extraction-shooter design plus creator tools and digital-asset ownership."
        - label: "Historical capital support"
          detail: "Roughly $37.5M of disclosed funding, including a $20M Series A."
        - label: "Live market reference exists"
          detail: "SHRAP token has a visible circulating market cap and FDV snapshot."
        - label: "Operating proof still missing"
          detail: "No public revenue, margin, runway, or current free-to-play retention disclosure in the pool."
        - label: "Friction remains real"
          detail: "KYC, Web3 adoption resistance, token unlock pressure, and restructuring noise remain active risks."
        - label: "Recommendation"
          detail: "research-more / expensive until launch KPIs and current price terms are disclosed."
    claimRefs: [CV001, CV003, CV005, CV006, CV007, CV012, CV013]
