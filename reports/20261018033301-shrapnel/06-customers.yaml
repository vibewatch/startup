company:
  name: "Shrapnel"
chapter:
  number: 6
  title: "Customers"
  summary: "Public customer proof is strongest at the top of the funnel: CoinGecko reported 100,000 account signups by December 2023, and GamesBeat reported more than 3.7 million paid early-access sessions in 2024. The monetization model is consumer and creator-led rather than enterprise-led, but the current public record still lacks named production customers, retention metrics, and concentration disclosures."
sections:
  - id: "player-and-creator-segments"
    title: "Player and creator segments drive the customer model"
    body: |-
      Shrapnel's paying customer today is primarily the individual player, not a studio or enterprise buyer. CoinGecko's walkthrough of the early-access flow says access was sold through Extraction Packs priced from $9.99 to $99.99, which means adoption starts with direct consumer willingness to pay rather than channel sell-through or a business-development contract. At the same time, the product thesis is not just "players buy a shooter." Multiple sources frame Shrapnel as a two-sided ecosystem that also expects creators and curators to publish maps, skins, callsigns, and vanity items, with the token and marketplace meant to support that loop. The China rollout adds a geographically distinct cohort with separate regulatory plumbing and localized asset-trading rails, so management is effectively pursuing consumer players, creators, and a region-specific China audience in parallel rather than a single homogeneous customer base.
    claimRefs: ["CU006", "CU007", "CU008", "CU010"]
    tableRefs: ["TU001"]
    figureRefs: ["FU001"]
  - id: "adoption-proof-and-reference-quality"
    title: "Adoption proof is real but still mostly aggregate"
    body: |-
      The strongest independent proof of real usage is GamesBeat's report that Shrapnel generated more than 3.7 million sessions in 27 days of paid early access during 2024, which is materially better evidence than a logo wall or follower count alone. CoinGecko also records that the game crossed 100,000 account signups by December 2023 and built a pre-launch community of more than 100,000 Discord members plus 370,000 X followers. Those signals show substantial awareness and enough product access to create genuine play data, but the proof quality is still uneven. The same CoinGecko guide says STX events were held monthly and the servers went offline between them, which means the public adoption trail is event-based rather than an always-on service curve. Across the assigned pool, the company still lacks public named production customers, named creator earners, or third-party case studies showing who stayed, expanded spend, or converted from social reach into durable play.
    claimRefs: ["CU002", "CU003", "CU004", "CU005", "CU011", "CU013"]
    tableRefs: ["TU002", "TU003"]
  - id: "durability-expansion-and-proof-gaps"
    title: "Expansion depends on creator and regional loops that remain unproven"
    body: |-
      The expansion story is clear in narrative terms but not yet durable in evidence terms. The New Stack's interview shows leadership wants creator-made maps to become so important that half of all sessions eventually run on community maps, and PlayToEarn describes continued work on operator onboarding, economy design, and a localized China launch path into Q1 2026. That makes the upside thesis less about one-time pack sales and more about recurring engagement from creator content, marketplace activity, and region-specific asset trading. The risk is that the current public evidence set does not quantify churn, GRR, NRR, contract length, repeat purchase, or customer concentration, so investors cannot tell whether strong early-access activity translated into habit or merely into curiosity. Naavik also warned that NFT gates or pay-to-win dynamics could shrink the reachable audience, and even basic open-web customer discovery is noisier than usual because the Shrapnel brand collides with unrelated artillery, film, and dictionary results.
    claimRefs: ["CU008", "CU009", "CU010", "CU012", "CU013", "CU014"]
callouts:
  - calloutType: "insight"
    title: "The customer model is two-sided, not just player-only"
    body: "Public materials repeatedly position Shrapnel as both a paid shooter for players and a marketplace-plus-tooling stack for creators who publish maps, skins, and vanity assets."
    claimRefs: ["CU006", "CU007", "CU008"]
  - calloutType: "risk"
    title: "Usage proof exists, but durability proof does not"
    body: "The public record shows signups, community size, and session volume, but it still does not show renewal, repeat-spend, or concentration metrics that would convert attention into durable customer evidence."
    claimRefs: ["CU004", "CU011", "CU014"]
