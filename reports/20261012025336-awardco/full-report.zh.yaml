              CU008]。土地扩张机制通过模块加购和更大范围的计划上线实现：客户常从基础点对点即时认可或服务奖励开始，随后扩展到定制公司周边商品商店、A-Pay 虚拟/实体 Visa 预付卡，以及 Awardco
              Engage 调查和倾听模块 [CU003, CU005, CU011]。与 Amazon Business 的主要集成于 2024 年 9 月通过 Integrated Ordering API
              增强，提供实时跟踪和同步订单解决，因此形成了明显的工作流依赖，降低供应商切换意愿 [CU012]。尽管有这些定性留存信号，Awardco 仍严格保密其 NRR、GRR 和 logo 流失率等私有公司指标
              [CU010, CU013]。
            claimRefs:
              - CU003
              - CU005
              - CU008
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: 采购摩擦、积分到期与集中度阻力
        blocks:
          - type: paragraph
            body: >-
              企业采用面临多项独立的采购和运营摩擦，构成商业风险。第一，客户实施需要大量行政工作和专业服务，部署周期从数周到数月不等；根据定制 HRIS 集成和工作流复杂度，设置费为 $5,000 至 $75,000+
              [CU005, CU014]。第二，Awardco 的资金模式要求客户通过 Funding Request Invoices（ACH、电汇或卡）预先向专用 Redemption Account
              充值以支付奖励，较自助式按需付费 SaaS 增加现金管理摩擦 [CU014]。第三，客户负面情绪集中在平台积分到期政策和积分购买力上：雇主可配置季度、年度或 12
              个月后的到期清扫，被没收的积分会从员工余额中永久消失，因而引发员工不满和负面评价 [CU014]。最后，客户集中度仍是尽调盲点：虽然供应商服务超过 3,000 个客户账户，但前 10 或前 25 家企业账户贡献的
              ARR 比例未披露；如果关键锚定客户重组或削减成本，业务将面临合同续约风险 [CU001, CU013]。
            claimRefs:
              - CU001
              - CU005
              - CU013
              - CU014
      - number: '6.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 通过 Amazon 目录集成和高续约意愿实现企业留存
            body: >-
              Awardco 的毛留存持久性突出：SoftwareReviews 计划续约率为 99%，G2 在 6,325 条客户评价中获得 4.9/5.0 分。直接 Amazon Business API
              集成让数百万种商品实现零加价履约，为能够消除员工奖励传统 20% 至 50% 供应商加价的企业客户提供有吸引力的经济价值 [CU007, CU008, CU010]。
            calloutType: strength
            claimRefs:
              - CU007
              - CU008
              - CU010
          - type: callout
            title: 私有财务中的不透明净留存与头部客户集中度
            body: >-
              尽管服务超过 3,000 家企业客户且客户满意度很高，Awardco 仍未公开披露 NRR、GRR，或前 10 家企业账户的 ARR 集中度。投资者必须把私有留存指标视为关键尽调缺口 [CU001,
              CU013]。
            calloutType: risk
            claimRefs:
              - CU001
              - CU013
          - type: callout
            title: 行政实施摩擦与客户对积分到期的不满
            body: >-
              Awardco 部署需要较多行政工作（实施费 $5,000 至
              $75,000+，以及预充值的兑换银行账户），与轻量聊天优先工具形成鲜明对比。此外，负面用户评价经常提到雇主配置的积分到期政策：未使用的员工积分会到期并被永久没收 [CU005, CU014]。
            calloutType: risk
            claimRefs:
              - CU005
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 结构性合作伙伴暴露
        blocks:
          - type: paragraph
            body: >-
              在当前证据中，Amazon Business 既是产品优势，也是最显著的依赖。Amazon 确认 Awardco 利用这段关系提供员工认可和奖励兑换，独立供应商目录则将 Awardco 描述为接入 Amazon
              且零加价。Awardco 还称，其增强版集成通过 Amazon Integrated Ordering API 实时更新订单和跟踪信息。这些事实意味着 Amazon
              关系的连续性、经济条件和服务质量对投资论点很重要，但并未证明存在排他性，也没有披露续约、终止、定价、服务等级或控制权变更条款。因此，在审阅底层协议和故障切换方案前，剩余风险仍然很高。可能击穿投资论点的信号包括失去有利的目录访问、出现重大新增渠道费，或无法证明能为重要国家提供可行的非
              Amazon 履约。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR008
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
              - CR011
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
