  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 这条有序决策路径把已验证的运营信号、据报道的融资估值、负面测试结果与投资判断所需的信息缺口分开。
    data:
      nodes:
        - id: historical-mark
          label: 2021 年公司发布的估值口径
          detail: $65M A 轮；据报道估值超过 $900M
        - id: later-mark
          label: 2025 年第三方报道的估值口径
          detail: $165M B 轮；据报道估值超过 $1B
        - id: scale-signal
          label: 规模与产品信号
          detail: 公司自称规模达 3,000+、合作伙伴确认、外部评审得分
        - id: adverse-test
          label: 运营层面的负面测试
          detail: 区域履约、实施和采购阻力
        - id: financial-gap
          label: 财务证据缺口
          detail: 尚无经验证的当前 ARR、收入、利润率、留存、现金或现金消耗数据
        - id: terms-gap
          label: 交易证据缺口
          detail: 缺少入场价格、股权结构表、债务、优先权或稀释条款
        - id: decision
          label: 继续研究 / 跟踪
          detail: 只有拿到运营证据、完成合同审查并发现价格后，才能进行投资判断
    approximationNotes: 这是有序的定性决策序列；各节点不代表已测量的转化率、概率或估值权重。
    claimRefs:
      - CV006
      - CV010
      - CV012
      - CV013
