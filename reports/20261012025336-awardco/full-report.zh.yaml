  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界界定与范围
        blocks:
          - type: paragraph
            body: >-
              员工认可与奖励行业长期处于人力资本管理软件和促销礼品履约之间的模糊边界。传统供应商主要通过专有礼品目录中的不透明商品加价变现，价格通常比零售高 30% 至 50%，把软件当作补贴性的前端。Awardco
              通过将软件订阅层与商品履约拆开，建立了不同的市场边界。平台直接接入 Amazon Business API，以实际市场价格提供数百万件商品，供应商不加价，并在 180 个以上全球地点提供免费配送。这个架构把
              Awardco 的软件支出与底层奖励代付预算分开，面向希望消除隐藏供应商利润、同时把服务奖励、点对点认可和健康激励集中到一个管理后台的组织。
            claimRefs:
              - CM001
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM009
      - number: '2.2'
        title: 可服务市场规模与支出基准
        blocks:
          - type: paragraph
            body: >-
              衡量企业认可和激励市场时，需要从多个角度审视，而不能依赖单一的总量估计。广义的全球人力资本管理软件和员工体验品类规模超过 $250 billion；全球员工认可和企业礼品支出则估计每年为 $50 billion
              至 $75 billion。在这部分总支出中，行业从业者基准和平台遥测数据表明，有效的企业认可预算为每名员工每年 $200 至 $350，涵盖平台软件费、奖励积分发放和计划管理。对 Awardco
              的主要可服务市场——拥有 500 名以上员工的中型市场和企业组织——软件许可和托管式认可平台的可服务可寻址市场为 $2.5 billion 至 $4.0 billion。Awardco 报告的客户数超过
              3,000 家，运行率规模超过 $100 million，显示出有意义的渗透率；但由于私有市场报告常把底层商品总值与经常性软件收入混为一谈，市场规模仍受限。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM010
              - CM013
      - number: '2.3'
        title: 买方分层、用户画像与预算归属
        blocks:
          - type: paragraph
            body: >-
              企业采用认可技术时，采购通常由多类利益相关方共同参与，买方、用户和预算负责人各不相同。首轮平台采购通常由
              CHRO、首席人员官或全面奖励总监推动，他们希望压低员工主动离职率、改善参与度得分，并更新过时的服务里程碑计划。但软件平台许可通常由 HR
              部门出资，按活跃用户或席位收取经常性费用；奖励积分预算则主要归前线业务部门所有，包括销售负责人、运营高管和区域设施总监。对拥有大量无固定办公桌或分散员工的中型市场和企业客户而言，关键采购动因是简化分散运营地点的奖励物流，同时不让当地行政人员承担实物库存管理或国际清关。
            claimRefs:
              - CM004
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM008
              - CM011
              - CM012
      - number: '2.4'
        title: 增长催化剂与结构性市场约束
        blocks:
          - type: paragraph
            body: >-
              现代认可平台的市场需求来自分散员工队伍管理难题、员工对消费级奖励选择不断提高的期待，以及管理层希望用可衡量的留存提升量化人力资本投资。点对点社交认可动态流和自动周年纪念流程，能实时强化积极的企业行为。不过，显著的市场阻力仍在。依赖
              Amazon Business 造成明显的单一供应商依赖：本地目录缺货、服装尺码选择有限以及账户数量限制，都可能削弱履约可靠性。此外，Awardco
              采用基于报价的企业销售模式，公开价格未披露，拉长采购周期，也难以对抗可立即自助上线的轻量级聊天原生工具。最后，买方仍难以衡量明确的投资回报，使认可预算在宏观经济下行时容易受到管理层审查。
            claimRefs:
              - CM007
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 颠覆传统目录加价
            body: >-
              传统员工认可供应商过去通过把商品目录加价至高于当期零售价 30% 至 50% 来获得可观利润。Awardco 与 Amazon Business
              的合作改变了这一模式，在数百万种商品上实行零加价，使供应商严格依靠透明的软件订阅费经营。
            calloutType: insight
            claimRefs:
              - CM001
              - CM005
          - type: callout
            title: 对 Amazon 基础设施的集中与依赖
            body: Amazon Business 提供覆盖 180 多个地点的广泛目录和国际配送，但也造成对单一电商基础设施的结构性依赖。商品供给波动、账户数量上限和合作伙伴条款，都是 Awardco 客户面临的系统性运营风险。
            calloutType: risk
            claimRefs:
              - CM007
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案分类
        blocks:
          - type: paragraph
            body: >-
              员工认可与奖励市场有三种明显的运营模式：传统履约型老牌供应商、现代目录集成商以及聊天原生的习惯养成工具。Perkbox 和 Sodexo
              等历史市场领导者围绕自有商品仓库和礼品卡分销网络建立了庞大的国际覆盖。但这些传统模式目录加价高、管理复杂，为软件驱动的颠覆者打开了切入口。Awardco 通过独家接入 Amazon
              Business，直接挑战高利润供应商模式。与此同时，Bonusly 和 Nectar 等现代中型市场平台提供开箱即用的积分系统和公开订阅价格，吸引优先考虑快速自助上线、而非深度采购定制的公司。HeyTaco 和
              Matter 等轻量聊天应用则提供低成本替代方案，完全绕开复杂的积分经济，强调在 Slack、Microsoft Teams 等沟通渠道中进行日常同伴认可。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
      - number: '3.2'
        title: 能力矩阵与履约架构
        blocks:
          - type: paragraph
            body: >-
              对供应商能力的评估显示，奖励驱动的履约引擎与认可优先的文化工具在架构上差异明显。Awardco
              更像企业奖励物流基础设施，整合五个核心模块，覆盖同伴认可、里程碑庆祝、员工激励、生活方式福利和实物奖励。其基础差异化在于通过 Integrated Ordering API 直接接入 Amazon
              Business，让组织连接已有企业 Amazon 账户，解锁数百万件实物商品且无供应商加价。这条技术链提供自动订单跟踪和覆盖 180
              个地区的全球本地化配送，并消除企业手动管理库存的需要。相比之下，Bonusly 等竞争平台依赖精选数字礼品卡目录和第三方履约聚合商。Awardco 在 G2、Capterra 和 SoftwareReviews
              等评价网站上取得很高的客户满意度，但依赖独立网页入口，相比完全在消息渠道内运行的聊天原生工具会增加用户摩擦。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 定价经济、实施负担与切换动态
        blocks:
          - type: paragraph
            body: >-
              不同竞争者的定价和商业包装差异很大，形成不同的买方准入门槛。Awardco 采用传统企业销售姿态：定价不透明、按报价、要求多年合同，并根据 HRIS 定制程度收取 $5,000 至超过 $75,000
              的前期实施费。行业拆解显示，入门套餐年费约 $3,000，实际上把小团队排除在外。相比之下，Bonusly 和 HeyTaco 等中型市场同业公开价目表，起价为每位用户每月 $3；HeyTaco
              还允许组织提供自定义福利，完全取消奖励最低消费。Awardco 的模式保护软件毛利，并把价值捕获转向平台使用，但实施周期也造成实质切换成本。企业配置好 HRIS 同步、审批层级和 Amazon Business
              采购量激励后，替换 Awardco 需要克服大量行政惯性，因此公司在大型分散员工队伍中拥有较强的毛留存。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河持久性与聊天原生替代风险
        blocks:
          - type: paragraph
            body: >-
              Awardco 的主要经济护城河取决于其 Amazon Business 合作的排他性和技术深度。公司在 Amazon 全球目录中提供透明的积分兑美元兑换，且不收传统百分之二十至 30%
              的商品加价，对希望延长奖励预算使用周期的企业采购团队很有吸引力。但这种定位也带来结构性脆弱点。竞争者拆解和公开评价显示，员工往往在上线数月后参与度下降，因为他们把独立入口视为交易型奖励商店，而非自然的文化触点。客户评价还反复提到价格差异：受配送缓冲和本地税费影响，某些商品的积分兑换价值看起来高于直接零售价。如果聊天优先平台能建立持久的日常认可习惯，企业买方可能越来越质疑，为一个本质上外包的奖励履约入口支付高额年度软件席位费是否必要。
            claimRefs:
