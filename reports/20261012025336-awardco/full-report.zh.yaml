  - id: FI001
    title: Awardco 收入与现金转化流程
    type: flow
    summary: 展示企业合同和员工参与如何逐步转化为软件许可收入及履约代收代付。
    data:
      nodes:
        - id: n1
          label: 企业客户获取
          detail: 以销售为主导的企业合同谈判，包含多年期承诺
        - id: n2
          label: 平台订阅许可
          detail: 按活跃席位计费的年度软件订阅费，最低 $2,500-$3,000
        - id: n3
          label: HRIS 与工作流实施
          detail: 专业服务部署费用为 $5,000 至 $75,000
        - id: n4
          label: 雇主奖励钱包充值
          detail: 雇主为即时奖励和服务里程碑向员工奖励积分预算注资
        - id: n5
          label: 商品与积分兑换
          detail: 员工按 1:1 比例用积分兑换 Amazon 目录商品、旅行或 A-Pay 卡
        - id: n6
          label: 零加价目录结算
          detail: 通过 Amazon Business API 直接配送到户，商品不加价
      edges:
        - from: n1
          to: n2
          label: 合同签署
        - from: n2
          to: n3
          label: 系统部署
        - from: n3
          to: n4
          label: 项目启用
        - from: n4
          to: n5
          label: 认可事件
        - from: n5
          to: n6
          label: 订单履约
    approximationNotes: 流程展示定性的商业关系；美元转化率取决于客户积分使用率。
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI010
  - id: FE001
    title: 六层企业架构与履约管线
    type: stack
    summary: 展示工作场所聊天中的用户参与如何经由 Awardco 工作流引擎连接至 Amazon Business 的全球履约基础设施。
    data:
      layers:
        - label: 用户参与与协作层
          detail: 覆盖 Slack 机器人、Microsoft Teams 应用、网页门户和移动界面等全渠道互动入口。
          modules:
            - Microsoft Teams 应用
            - Slack 集成机器人
            - 网页与移动门户
        - label: 身份与组织同步层
          detail: 自动配置用户并同步 HRIS，连接员工花名册、汇报层级和里程碑日期。
          modules:
            - HRIS 连接器中枢
            - SSO / SAML 网关
            - 花名册同步引擎
        - label: 认可与工作流自动化引擎
          detail: 核心逻辑编排同伴点赞、经理提名、自动周年触发器和 MemoryBooks™。
          modules:
            - 即时认可信息流
            - 里程碑触发调度器
            - MemoryBooks™ 编译器
        - label: 积分账本与预算治理
          detail: 积分核算账本管理部门分配、1:1 货币估值、可配置到期规则和支出追踪。
          modules:
            - 积分账本与估值引擎
            - 部门预算分配器
            - 到期与失效规则管理器
        - label: 履约网关与外部 API
          detail: 集成订购 API，将 Awardco 奖励请求连接至 Amazon Business、Priceline 旅行服务和数字礼品卡供应商。
          modules:
            - Amazon 集成订购 API
            - Priceline 旅行连接器
            - 礼品卡网关
        - label: 全球物流与配送网络
          detail: 通过 Amazon 在 180+ 个地区的履约中心实现免手工实物配送，并提供实时追踪更新。
          modules:
            - Amazon 全球履约（180+ 地区）
            - 追踪与配送 Webhook 同步
            - 数量限制处理器
    approximationNotes: 架构层级依据官方合作伙伴文档和集成公告概念化得出；底层云微服务拓扑仍属私有信息。
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: Awardco 企业客户旅程与生命周期扩张流程
    type: journey-map
    summary: 从最初采购和 HRIS 集成，到员工入职、认可仪式、奖励履约和模块扩张，展示客户触点。
    data:
      items:
        - label: 1. 采购与签约
          touchpoints:
            - 基于报价的范围界定（$3k SMB 起步价至 $75k+ 企业实施）
            - 多年期合同签署（2-3 年承诺，按量折扣）
            - 通过 Funding Request Invoices 设置预充值兑换账户
        - label: 2. 技术集成
          touchpoints:
            - 将 HRIS 与 Workday、ADP、BambooHR 或 Oracle 集成，实现花名册自动同步
            - 配置单点登录（SSO），部署 Microsoft Teams / Slack 应用
            - 连接 Amazon Business 集成订购 API，实现 1:1 目录访问
        - label: 3. 上线与启用
          touchpoints:
            - Awardco 协助上线，由专业服务团队和卓越中心引导
            - 在部门和区域枢纽之间分配 Smart Award Network 预算
            - 在移动应用和桌面门户中激活员工账户
        - label: 4. 核心认可仪式
          touchpoints:
            - 同伴即时点赞以及经理向员工发放奖励积分
            - 自动触发周年、服务里程碑和生日认可事件
            - 基于价值观的提名项目和全公司社交信息流互动
        - label: 5. 奖励兑换
          touchpoints:
            - 零加价 Amazon Business 目录履约，提供本地 Prime 配送
            - 通过 Priceline 购买活动门票、预订酒店，并提供慈善捐赠选项
            - 发行虚拟和实体 A-Pay Visa 卡，用于开放式支付
        - label: 6. 扩张与续约
          touchpoints:
            - 采用 Awardco Engage 员工调查和 eNPS 脉冲倾听模块
            - 集成 Company Store 品牌周边，并扩展至全球本地市场
            - 高管理切换壁垒支持多年期续约周期
    approximationNotes: 生命周期推进模型依据供应商上线文档、G2 用户评价时间线和实施案例研究基准。
    claimRefs:
      - CU003
      - CU005
      - CU007
      - CU008
      - CU009
      - CU011
      - CU012
      - CU014
