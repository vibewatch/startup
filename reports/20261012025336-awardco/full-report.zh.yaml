      - number: '4.4'
        title: 财务结论与投资评估障碍
        blocks:
          - type: paragraph
            body: >-
              从投资评估角度看，Awardco 的收入顶线特征颇具吸引力，资本效率也由 Amazon Business 分销护城河支撑。零加价奖励定位对依赖商品高价差的传统激励供应商形成清晰的竞争切口。但私有公司身份掩盖了
              SaaS 精确估值所需的关键运营指标。具体而言，公开来源没有披露 GAAP 毛利率、净收入留存率或 Amazon Business 合作关系的确切商业分成条款。由于客户总支出同时包含软件订阅和高额代付奖励
              GMV，如果把商品流量误认为高毛利经常性软件 ARR，未经核实的顶线收入倍数可能高估公司价值。评估后期投资或收购，需要经审计的毛利分层、客户群流失动态和合同续约持续期。
            claimRefs:
              - CI001
