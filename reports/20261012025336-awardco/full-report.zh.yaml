  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价架构
        blocks:
          - type: paragraph
            body: >-
              Awardco 主要通过年度经常性 SaaS 订阅变现，同时获得专业实施服务、消费者积分购买和支付卡计划收入。不同于把目录商品加价百分之二十至百分之五十的传统员工认可供应商，Awardco 借助与 Amazon
              Business 的订购集成，明确采用零加价模式。在这种商业架构下，企业雇主支付透明的软件许可费，认可奖励则按 Amazon 标准零售价购买，不收供应商中介费。平台许可按报价计费，小企业入门套餐的最低年度承诺为
              $2,500 至 $3,000。中型市场和企业合同按每名活跃用户每年计费，在 500、1,000 和 2,500 名活跃用户的门槛提供批量折扣，合同期限通常为两至三年。除软件许可外，Awardco
              还通过可选积分充值获取额外交易量：员工可用信用卡补足奖励差额；品牌 A-Pay Visa 卡则把积分兑换成一般购买力。
