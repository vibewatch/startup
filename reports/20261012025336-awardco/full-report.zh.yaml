  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 待验证的经营假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行或逻辑破裂触发因素
    rows:
      - - 乐观
        - 增长持久、队列留存强、毛利率有吸引力、现金纪律良好，且 Amazon 经济条件稳定。
        - 使用经核实的前瞻经营指标和交易条款；公开信息无法支持区间判断。
        - 只有独立的财务和队列证据到位后才为正面。
        - 留存、利润率或合作伙伴持久性出现任何重大偏差，都会使该情景失效。
      - - 基准
        - 续约稳定、适度扩张、现金使用受控，私人公司稀释处于通常水平。
        - 要求协商入场价格，并为倍数压缩和后续稀释留出空间。
        - 在审计数据和条款清单到位前保持中性。
        - 需要完美执行才能成立的价格或优先权条款会使该情景失效。
      - - 悲观
        - 续约疲弱、实施摩擦、区域奖励限制，或 Amazon 合同经济条件恶化。
        - 根据实际股权结构表建模资本损失和优先权悬置；不要推断公开价值。
        - 如果客户访谈或合同审查确认不利信号，概率信号升高。
        - 收缩、现金状况恶化、流失集中或合作伙伴流失。
    notes: 由于保留的公开来源未披露数字区间或概率所需的财务、资本化和交易输入，情景仅作定性分析。
    claimRefs:
      - CV003
      - CV010
