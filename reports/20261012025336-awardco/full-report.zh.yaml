figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 Awardco 从成立、与 Amazon 建立合作到 Series B 增长的历程。
    data:
      items:
        - date: '2011'
          label: 公司成立
          detail: Steve Sonnenberg 开始开发 Awardco 平台，推动员工认可现代化并消除供应商加价。
          tone: neutral
          claimRefs:
            - CO001
        - date: '2017'
          label: Amazon Business 合作
          detail: Awardco 与 Amazon Business 建立正式商业联盟，提供零加价目录履约。
          tone: positive
          claimRefs:
            - CO003
        - date: '2021'
          label: Series A 融资
          detail: Awardco 筹集 $65M Series A 轮融资，由 General Catalyst 和 Qualtrics 联合创始人 Ryan Smith 领投。
          tone: positive
          claimRefs:
            - CO007
        - date: August 2024
          label: 外部认可功能上线
          detail: Awardco 推出 External Recognition，让客户和第三方能够认可一线员工。
          tone: positive
          claimRefs:
            - CO008
        - date: May 2025
          label: Series B 增长融资
          detail: Awardco 获得由 Sixth Street Growth 和 Spectrum Equity 领投的 $165M Series B 融资，累计融资达到 $235M。
          tone: positive
          claimRefs:
            - CO009
        - date: August 2026
          label: G2 品类领先认可
          detail: Awardco 在 G2 的 6,325 条评价中获得 4.9 分，奖励目录物流也位居该品类前列。
          tone: positive
          claimRefs:
            - CO010
        - date: September 2026
          label: 竞争与市场摩擦
          detail: 竞争对手分析和买家评价指出，企业定制定价存在障碍，目录价格也有差异。
          tone: negative
          claimRefs:
            - CO011
        - date: October 2026
          label: 认可现状研究
          detail: Awardco 发布了关于员工归属感和留存的 2026 年研究，但私人财务审计仍未经验证。
          tone: neutral
          claimRefs:
            - CO012
    approximationNotes: null
    claimRefs:
      - CO001
      - CO003
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
  - id: FM001
    title: 六层市场规模与可触达边界金字塔
    type: pyramid
    summary: 将可触达的企业认可支出从广义 HR 技术拆解到 Awardco 可服务机会的结构化边界。
    approximationNotes: 市场层级依据行业支出基准（$200-$350/员工/年）和全球企业就业人数，展示概念性边界。
    claimRefs:
      - CM002
      - CM003
      - CM006
      - CM010
      - CM013
    data:
      items:
        - label: 全球企业 HR 技术与员工体验
          detail: 覆盖核心 HCM、薪资、福利和职场健康软件平台的最大伞形类别。
          value: 250
          unit: USD B
        - label: 企业认可与奖励总支出
          detail: 企业在员工礼品、里程碑项目、商品目录和礼品卡上的总支出。
          value: 65
          unit: USD B
        - label: 现代 SaaS 认可软件 TAM
          detail: 专用认可平台订阅、管理工具和同伴认可软件费用。
          value: 8
          unit: USD B
        - label: 可服务市场（SAM）
          detail: 拥有 500+ 名员工、寻求零加价奖励和 HRIS 自动化的中型市场及企业组织。
          value: 3.5
          unit: USD B
        - label: 可获取市场（SOM）
          detail: 需要在 180+ 个全球 Amazon 配送地区进行本地化履约的分布式和无固定办公地点劳动力。
          value: 0.8
          unit: USD B
        - label: Awardco 活跃客户收入运行率覆盖
          detail: 当前商业覆盖服务 3,000+ 家组织，年化收入运行率超过 $100M。
          value: 0.106
          unit: USD B
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 围绕奖励目录物流深度与聊天原生员工参与摩擦，展示战略定位。
    approximationNotes: 相对坐标依据 2026 年供应商架构分析和软件评价进行序数式定性评分。
