      - number: '5.2'
        title: Amazon Business 集成、目录 API 与履约机制
        blocks:
          - type: paragraph
            body: >-
              Awardco 的核心技术和经济护城河，是其自 2017 年建立的 Amazon Business 企业集成合作。传统员工认可计划把消费品加价到零售价以上 20% 至 50% 以赚取供应商利润。Awardco
              通过 Integrated Ordering API 直接接入 Amazon Business，绕过这层中介，让企业客户连接既有 Amazon Business
              账户，并以一比一的美元价值兑换积分，零加价购买。这套基础设施让订单可以实时同步下达，且直接从 Amazon 履约中心更新跟踪信息。合作还把商品履约扩展到 180
              多个全球配送地点，免除跨境关税、进口税和持有本地实物奖励库存的行政负担。API 集成的技术增强也解决了受账户数量门槛限制的高关注订单沟通障碍。
            claimRefs:
