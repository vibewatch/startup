      - number: '4.3'
        title: 资本充足度、员工人数增长与资产负债表续航
        blocks:
          - type: paragraph
            body: >-
              在接受机构风险资本前，Awardco 采取了不同寻常的自筹路线，称自 2012 年成立以来规模和收入每年翻倍，同时保持现金流为正。公司于 2021 年 10 月启动机构股权融资，由 General
              Catalyst 领投 $65.2M A 轮，估值为 $900M，Qualtrics 联合创始人 Ryan Smith 参与。2025 年 3 月，Awardco 完成由 Sixth Street Growth
              和 Spectrum Equity 领投的 $165M B 轮，General Catalyst 和 Ryan Smith 继续参与，累计融资达到 $235M，三轮融资后的估值预计为 $1B。截至 2026 年
              8 月，追踪到的员工人数达到 678 人，销售、客户成功和平台工程均显著扩张。考虑到 B 轮资金规模以及管理层在自筹阶段展现的运营纪律，Awardco 拥有可观的流动性缓冲，可降低近期再融资风险或资产负债表困境。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
