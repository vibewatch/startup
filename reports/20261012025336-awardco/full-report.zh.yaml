              CHRO、CPO、全面奖励副总裁或薪酬福利总监 [CU002]。平台运营预算来自企业 HR 认可、薪酬和员工参与预算科目
              [CU002]。最终用户包括所有参与日常点对点认可、即时认可、价值观计划和服务里程碑纪念的企业员工及前线人员 [CU003]。平台覆盖 140 多个国家，提供本地货币换算，并与 Deloitte
              等专业服务公司合作提供税务与合规指导及区域配送履约 [CU004]。商业分层包括四档：员工少于 100 人、年度入门报价从 $3,000 起的小企业部署；覆盖 500 至 2,500
              名活跃员工的中型市场部署；服务无固定办公桌的酒店、零售和物流运营商的分散企业部署；以及管理复杂跨境合规的大型跨国企业 [CU001, CU005]。
