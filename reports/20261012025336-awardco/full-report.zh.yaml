              - CR010
              - CR012
              - CR014
      - number: '7.2'
        title: 法律与监管边界
        blocks:
          - type: paragraph
            body: >-
              当前证据池支持的是有边界的跨境风险，而不是不合规结论。Awardco 表示，Amazon Business
              的可用性和商品选择因国家而异，税费、配送、海关或其他国家特定费用可能影响实物兑换。公司自己的比较指南要求买方核验国家、货币、目录、税务和履约要求。这些披露足以支持逐国尽调，审查奖励税务、消费者条款和进口费用责任。但证据池没有找到能证明
              Awardco
              当前状况的一级监管机构、法院、隐私、认证或事件来源。负面搜索没有返回结果，并不证明不存在相关事项。投资批准应要求最新的法律陈述、数据处理条款、安全证明、事件历史和司法辖区合规矩阵，不能把公开沉默视为已获放行。
            claimRefs:
              - CR003
              - CR005
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR011
      - number: '7.3'
        title: 运营、财务模型风险与控制
        blocks:
          - type: paragraph
            body: >-
              运营证据不一，但可以转化为行动。Awardco 称数量限制可能导致高关注订单无法履约；其支持页面则提供全天候聊天、邮件和电话帮助，以处理延迟或差异。独立 SoftwareReviews
              数据在计划续约和实施评分上表现积极，但一名已核实评价者认为预算功能笨重；抓取页面没有提供汇总评分的受访者分母。竞争者 Matter 将 Awardco 描述为按报价、实施密集型产品，Growth Engineer
              则报告其非公开定价和宽泛的预估实施成本区间。这些竞争者的说法属于需要检验的反向证据，不是独立基准。历史 A 轮声明称 Awardco
              曾保持现金流为正，也无法证明当前烧钱速度、利润率、营运资金暴露或流动性。缓释措施应结合客户回访、实施试点、逐国订单测试、支持和履约指标、当前经审计财务报表，以及逐项列出的总成本表。
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 首要否决标准
            body: 在审阅 Amazon Business 协议、续约和终止权、定价与 API 经济、服务等级、控制权变更条款，以及针对重要国家的替代方案测试结果之前，不要评估 Awardco 核心奖励主张的持续性。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR007
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与融资背景
        blocks:
          - type: paragraph
            body: >-
              现有证据支持“继续研究”，而不是直接买入。Awardco 公司发布的 2021 年融资材料称，公司完成 $65 million 的 A 轮融资，估值超过 $900 million；Matter 和 Growth
              Engineer 后来称，公司于 2025 年 5 月完成估值超过 $1 billion 的 $165 million B 轮融资，Growth Engineer 还称累计融资额为 $235
              million。这些后续数字可作为融资背景，但两个来源都没有披露轮次条款、股价、清算优先权、债务或当前二级市场估值。现有公开来源也没有提供经核实的当前收入、ARR、毛利率、留存、现金余额或烧钱速度。因此，最近一次披露的私募估值只是融资历史的观察值，不能证明新的入场价能带来可接受回报。
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV006
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在产品覆盖面和分销能力上，而不是一套公开财务证据。Awardco 称，一个平台整合了认可、奖励、激励和员工参与，服务超过 3,000 家企业，并通过 Amazon Business
              提供一对一的奖励价值。Amazon 自己的合作伙伴页面印证了商业关系，Awardco 则称双方关系始于 2017 年。SoftwareReviews
              提供了外部产品质量信号，专门的客户帮助登录页也符合售后支持运营的特征，但两者都不能证明留存。反论点同样具体：Achievers 认为，对区域性 Amazon
              的依赖可能造成供货、配送、关税和交付周期不稳定；Matter 则描述了按报价定价以及较重的实施工作。两家公司都是竞争对手，因此它们的说法属于需要验证的不利证据，而非独立基准。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景纪律与入场条件
        blocks:
          - type: paragraph
            body: >-
              可以构建乐观、基准和悲观情景，但如果不凭空捏造输入，公开证据无法支撑数值估值区间或回报概率。乐观情景需要独立验证的持续增长、强劲留存、有吸引力的毛利率以及 Amazon
              经济性的延续。基准情景需要稳定留存和现金创造能力，并且协商后的价格要为私营公司通常会发生的稀释和倍数压缩留出空间。悲观情景包括续约走弱、实施摩擦、区域履约受限或合作伙伴经济性恶化。因此，每个情景都应使用可观察的尽调信号，而不是臆造的
              ARR、倍数或概率。价格发现必须跟在经审计的经营证据和资本结构审查之后，不能先于它们。
            claimRefs:
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效点
        blocks:
          - type: paragraph
            body: >-
              已披露的独角兽身份和客户规模或许支持未来的战略退出或上市退出选择，但不能证明公司已经准备就绪。在评估退出回报之前，投资人应取得经审计财务报表、ARR 与收入桥接表、按 cohort
              划分的毛留存和净留存、客户集中度、现金与债务明细、完全稀释后的资本表以及每项优先股权利。Amazon Business 协议需要直接审查期限、续约、排他性、定价、API
              访问、服务水平、控制权变更和终止条款。论点失效触发器是可量化的：持续收缩或续约疲弱、毛利率或现金创造能力恶化、客户集中度过高、Amazon
              关系丧失或不利重定价，或入场价格的优先权和稀释结构使目标回报无法实现，即使经营表现已经得到验证。
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 价格纪律才是决策核心
            body: Awardco 可能是一家强公司，但其证券仍可能缺乏吸引力。公开记录支持继续尽调，却不支持精确估值、回报目标，或按最近一次披露的私募估值批准投资。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV016
          - type: callout
            title: 不要把竞争对手比较当成基准
            body: Achievers 和 Matter 提出了可验证的下行问题，但它们与 Awardco 存在商业竞争关系，因此这些页面只能提供不利线索，不能算独立验证。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
