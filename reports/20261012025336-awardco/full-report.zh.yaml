chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立背景与零加价运营模式
        blocks:
          - type: paragraph
            body: >-
              Awardco 是一家总部位于犹他州林登的企业员工奖励与认可软件平台。创始人兼 CEO Steve Sonnenberg 于 2011
              年构想了这家公司；他借助家族在认可和奖项行业的背景，打造了面向传统目录供应商的现代软件化替代方案。过去，员工认可供应商通常在礼品和企业商品上加收 30% 至 50% 的高额批发价差，以奖励兑换变现。2017
              年，Awardco 与 Amazon Business 建立联盟，打破了这种传统变现结构。借助与 Amazon Integrated Ordering API 的深度集成，Awardco
              让客户组织可以直接向员工开放数百万种消费品、礼品卡和活动门票，并按零售价格购买，不收供应商加价。这套架构使 Awardco
              同时具备员工参与平台和奖励物流引擎的性质，把点对点感谢、经理即时奖励和里程碑庆祝等多种认可流程集中起来。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: 高管领导、治理结构与创始人覆盖
        blocks:
          - type: paragraph
            body: >-
              Awardco 的高管结构显示创始人深度参与，公司同时按软件工程和运营扩张分工。CEO Steve Sonnenberg 是公司的主要战略设计者和对外代表；由于他主导谈成核心 Amazon Business
              关系，公司对关键个人的依赖度较高。技术由 CTO Mike Sonnenberg 负责，他是 Steve 的表亲，设计了公司的专有软件基础设施，并监督与 Amazon 目录 API 同步的订单跟踪流水线。总裁
              Tanner Runia 负责运营执行和组织扩张，统筹跨职能执行与企业客户交付。机构股权融资后，治理监督有所扩大，但详细董事会构成和保护性投票条款仍按私营公司治理标准保密。
            claimRefs:
              - CO001
              - CO002
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO005
      - number: '1.3'
        title: 资本化轨迹、机构投资者与战略合作伙伴
        blocks:
          - type: paragraph
            body: >-
              Awardco 在早期增长阶段采取资本高效的自筹路线，随后接受机构风险资本以加速市场扩张。2021 年，公司完成由 General Catalyst 领投的 $65 million A 轮融资；Qualtrics
              联合创始人、犹他爵士队多数股东 Ryan Smith 也以战略天使投资人身份参与。持续的商业增长最终促成 2025 年 5 月完成的 $165 million B 轮融资，该轮由 Sixth Street
              Growth 和 Spectrum Equity 联合领投，既有机构支持者跟投。各轮融资合计为 Awardco 带来 $235 million 外部资本，用于 External Recognition
              等产品扩张和全球履约物流。除股权投资者外，Amazon Business 是公司最重要的商业利益相关方，为 Awardco 在国内和国际市场的价值主张提供技术与物流基础。
            claimRefs:
              - CO003
              - CO007
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO007
              - CO009
              - CO014
      - number: '1.4'
        title: 运营规模、竞争取舍与私有财务缺口
        blocks:
          - type: paragraph
            body: >-
              Awardco 已形成可观的市场覆盖，客户组织超过 3,000 家，奖励配送覆盖全球 135 个国家。截至 2026 年 8 月，Awardco 在 G2 的 6,325 条评价中获得 4.9
              分，体现出较强的品牌口碑，并获得奖励物流品类领导者认可。但市场采用也面临具体运营阻力和竞争者审视。第三方评价汇总网站和 HeyTaco 等竞争者指出，Awardco
              基于报价的定价、年度合同要求和引导式实施流程，可能给寻求自助式认可方案的小型组织带来摩擦。部分买家评价还指出，某些兑换商品的价格反复高于直接零售价格。最关键的是，经审计的财务指标——包括 GAAP
              年度经常性收入、净留存率和毛利率——仍属于保密的私有数据，需要在后续尽调阶段明确核实。
            claimRefs:
              - CO006
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO006
              - CO007
              - CO009
              - CO010
              - CO013
      - number: '1.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 零加价护城河与物流依赖
            body: >-
              Awardco 的主要市场差异化来自与 Amazon Business 的直接 API 集成，消除了商品奖励传统的 30% 至 50% 供应商加价。但这也让公司在根本上依赖 Amazon 的履约基础设施和 API
              条款。
            calloutType: insight
            claimRefs:
              - CO003
              - CO004
          - type: callout
            title: 私有规模与留存中的信息不对称
            body: Awardco 称拥有超过 3,000 家组织客户，且 G2 客户口碑处于前列；但 ARR、净收入留存率（NRR）和毛利率等经审计财务数据仍未公开。
            calloutType: risk
            claimRefs:
