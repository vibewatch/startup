        - label: "3. Onboarding & Launch"
          touchpoints:
            - "Awardco-assisted rollout guided by professional services and Center of Excellence"
            - "Smart Award Network budget allocation across departments and regional hubs"
            - "Employee account activation across mobile app and desktop portals"
        - label: "4. Core Recognition Rituals"
          touchpoints:
