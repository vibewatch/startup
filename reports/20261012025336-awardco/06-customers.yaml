    title: "Awardco Enterprise Customer Journey and Lifecycle Expansion Flow"
    type: "journey-map"
    summary: "Visual mapping of customer touchpoints from initial procurement and HRIS integration through employee onboarding, recognition rituals, reward fulfillment, and module expansion."
    data:
      items:
        - label: "1. Procurement & Contracting"
