callouts:
  - calloutType: "strength"
    title: "Enterprise Retention Through Amazon Catalog Integration and High Renewal Intent"
    body: "Awardco demonstrates exceptional gross retention durability, reflected in a 99% plan-to-renew rate on SoftwareReviews and a 4.9/5.0 G2 rating across 6,325 customer reviews. The direct Amazon Business API integration provides zero-markup fulfillment across millions of items, creating a compelling economic value proposition for enterprise clients who eliminate traditional 20% to 50% vendor markups on employee rewards [CU007, CU008, CU010]."
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU010"
  - calloutType: "risk"
    title: "Opaque Net Retention and Top-Customer Concentration In Private Financials"
    body: "Despite serving over 3,000 corporate clients and maintaining high customer satisfaction ratings, Awardco does not publicly disclose its Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or ARR concentration across its top-10 enterprise accounts. Investors must treat private retention metrics as a critical diligence gap [CU001, CU013]."
    claimRefs:
      - "CU001"
      - "CU013"
  - calloutType: "risk"
    title: "Administrative Implementation Friction and Customer Points Expiration Dissatisfaction"
    body: "Awardco deployments require significant admin overhead ($5,000 to $75,000+ implementation fees and pre-funded redemption bank accounts), contrasting sharply with lightweight chat-first tools. Furthermore, negative user reviews frequently cite employer-configured point expiration policies, where unspent employee points expire and are permanently forfeited [CU005, CU014]."
    claimRefs:
      - "CU005"
      - "CU014"
