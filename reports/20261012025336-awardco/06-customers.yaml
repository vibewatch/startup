            - "Automated anniversary, service milestone, and birthday recognition events"
            - "Values-based nomination programs and company-wide social feed engagement"
        - label: "5. Reward Redemption"
          touchpoints:
            - "Zero-markup Amazon Business catalog fulfillment with local Prime shipping"
            - "Event tickets, hotel bookings via Priceline, and charitable giving options"
            - "Virtual and physical A-Pay Visa card issuance for open-loop spend"
        - label: "6. Expansion & Renewal"
          touchpoints:
