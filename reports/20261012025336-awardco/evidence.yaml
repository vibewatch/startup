evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited GAAP financial statements covering FY2025-2026 annual recurring revenue (ARR), gross margin, operating
      expenses, and cash burn.
    whyItMatters: >-
      Without audited financial disclosures, valuation multiples and long-term capital efficiency cannot be
      independently corroborated.
    diligencePath: >-
      Request confidential disclosure of audited financial statements, historical income statements, and SaaS retention
      metrics under NDA.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: commercial-agreements
    missingEvidence: >-
      Full commercial contract terms for the Amazon Business partnership, including exclusivity scope, termination
      rights, and API fee structure.
    whyItMatters: >-
      Awardco core value proposition and product moat depend directly on zero-markup catalog access through Amazon
      Business.
    diligencePath: Review master service agreements and API integration contracts with Amazon Business during legal diligence.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: material
    topic: amazon-exclusivity-terms
    missingEvidence: >-
      Audited commercial documentation detailing the exact terms of Awardco's Amazon Business agreement, including API
      pricing, margin sharing, renewal terms, and termination clauses.
    whyItMatters: >-
      Awardco's core market value proposition and unit economic defensibility depend entirely on uninterrupted
      zero-markup access to Amazon Business.
    diligencePath: >-
      Review vendor partnership agreements, Amazon Business channel contracts, and confidential disclosure schedules
      during formal investment diligence.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: recognition-market-sizing
    missingEvidence: >-
      Audited segmentation separating software subscription ARR from pass-through gross merchandise value across the
      employee recognition industry.
    whyItMatters: >-
      Public market estimates frequently conflate corporate gift budgets with software licensing revenues, obscuring
      true recurring SaaS TAM and pricing power.
    diligencePath: >-
      Examine customer billing cohorts and software-versus-rewards revenue splits across comparable HR tech filings and
      proprietary vendor financials.
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: Catalog Price Transparency
    missingEvidence: >-
      Independent quantitative audit comparing Awardco point redemption costs on Amazon Business items against direct
      consumer Amazon prices across geographies.
    whyItMatters: >-
      Competitor reviews report recurring customer perceptions that items cost more through the platform than direct
      retail, potentially weakening the zero-markup value proposition.
    diligencePath: >-
      Request sample redemption logs with item SKUs, points charged, shipping and tax buffers, and matching real-time
      Amazon retail prices.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: Amazon Exclusivity Duration
    missingEvidence: >-
      Contractual term length, renewal conditions, and termination clauses of Awardco's integrated partnership with
      Amazon Business.
    whyItMatters: >-
      Awardco's primary competitive moat rests on its Amazon Business integration; if Amazon opens equivalent API
      capabilities to competing HR vendors, Awardco's differentiation would be significantly commoditized.
    diligencePath: Review commercial agreement schedules and API integration covenants during legal and technical diligence.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited income statements and cash flow records detailing ARR, gross margin percentage, operating expenses, and
      cash burn.
    whyItMatters: >-
      Without audited financial statements, underwriting Awardco valuation and operating leverage relies entirely on
      unverified secondary estimates.
    diligencePath: >-
      Request audited 2024-2025 financial statements, trailing twelve-month revenue breakdowns, and bank cash balances
      under NDA.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: commercial-contract-terms
    missingEvidence: >-
      Full commercial contract terms between Awardco and Amazon Business, including API transaction fees, volume
      rebates, exclusivity clauses, and termination rights.
    whyItMatters: >-
      Awardco primary value proposition rests on zero-markup Amazon fulfillment; adverse changes to Amazon partnership
      terms would directly compress economics.
    diligencePath: >-
      Review the Amazon Business master services agreement, API integration addendum, and renewal schedule during legal
      diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: compliance-and-security
    missingEvidence: >-
      Independent SOC 2 Type II compliance audit reports, annual penetration testing summaries, and GDPR/CCPA data
      processing agreements for enterprise employee personal data.
    whyItMatters: >-
      Enterprise HR tech implementations ingest sensitive employee PII, organizational charts, and compensation-linked
      recognition budgets, making independent third-party security audits a prerequisite for procurement.
    diligencePath: >-
      Request Awardco's most recent SOC 2 Type II audit report, vendor risk assessment package, and standard DPA under
      confidentiality during formal diligence.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: developer-signal-proxy
    missingEvidence: >-
      Public developer platform telemetry, open-source SDK repositories, or dedicated public API engineering
      documentation.
    whyItMatters: >-
      Awardco operates as a proprietary enterprise B2B SaaS platform rather than a developer-first tool, so public
      GitHub repository metrics or developer forum signals are non-existent, leaving technical architecture assessments
      dependent on partner-level documentation.
    diligencePath: >-
      Request technical API documentation for custom HRIS connectors and review internal engineering architecture
      whitepapers under NDA.
    relatedQuestionRefs:
      - QE009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: Comprehensive audit of all 3,000+ customer contracts and production deployment outcomes.
    whyItMatters: >-
      Public case studies highlight successful enterprise rollouts like Texas Roadhouse and Hertz, but omit accounts
      that downgraded or discontinued platform use.
    diligencePath: Review vendor customer churn logs and full enterprise client reference lists across representative customer tiers.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited cohort-level Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn rates for 2024
      through 2026.
    whyItMatters: >-
      Public review metrics indicate high renewal intent (99%), but lack financial confirmation of contract expansions,
      downgrades, and net revenue durability.
    diligencePath: >-
      Request confidential SaaS cohort retention schedules and annual recurring revenue bridge tables during management
      due diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Percentage share of total ARR generated by Awardco's top-10 and top-25 enterprise customer accounts.
    whyItMatters: >-
      A high revenue concentration among anchor accounts like Texas Roadhouse, Hertz, or Lineage would expose the
      business to severe contract renewal volatility.
    diligencePath: >-
      Obtain a customer concentration schedule ranking accounts by ARR contribution, contract expiration date, and
      multi-year commitment status.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: amazon-contract-terms
    missingEvidence: >-
      Amazon Business agreement terms covering exclusivity, renewal, termination, pricing and API economics, service
      levels, change of control, and transition support.
    whyItMatters: >-
      The retained evidence makes Amazon central to Awardco's reward proposition but does not show contractual
      durability or tested failover.
    diligencePath: >-
      Review the executed agreement and amendments, interview both counterparties, and test a country-level contingency
      plan.
    relatedQuestionRefs:
      - QR001
      - QR004
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: legal-security-and-incidents
    missingEvidence: >-
      Current litigation and enforcement schedule, security certifications, data-processing terms, subprocessors,
      penetration testing, and material incident history.
    whyItMatters: >-
      No primary legal, regulatory, or security source in the assigned pool establishes the current posture, and search
      silence is not evidence of absence.
    diligencePath: >-
      Obtain counsel-confirmed legal disclosures, current audit reports, the DPA and subprocessor list, and three years
      of incident and insurance notices.
    relatedQuestionRefs:
      - QR002
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: >-
      Audited current revenue, gross margin, operating cash flow, burn, liquidity, working-capital treatment of reward
      funds, debt, and implementation-services economics.
    whyItMatters: >-
      A historical company statement about cash-flow positivity and third-party cost estimates cannot establish current
      financial resilience.
    diligencePath: >-
      Reconcile audited statements, bank and debt records, deferred and restricted balances, cohort margins, and an
      itemized customer total-cost schedule.
    relatedQuestionRefs:
      - QR005
  - type: missing-source
    severity: material
    topic: operational-performance
    missingEvidence: >-
      Country-level fulfillment success, delivery times, return rates, quantity-limit exceptions, API uptime, support
      response and resolution times, and implementation overruns.
    whyItMatters: >-
      Public pages describe mitigations and known exception types but provide no denominator or frequency for
      operational failure.
    diligencePath: >-
      Request twelve months of operational dashboards, incident tickets, SLA credits, implementation variance, and
      representative customer references.
    relatedQuestionRefs:
