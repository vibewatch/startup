- id: TV001
  title: Recommendation Summary
  columns:
  - Decision item
  - Current view
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research more / track
    - Reported private financing marks are available, but current operating and transaction
      inputs are not.
    - Do not approve an investment before data-room and price diligence.
  - - Confidence
    - Medium on evidence limitation; low on intrinsic value
    - The missing inputs are specific and material, while the latest valuation is
      third-party reported.
    - Treat any precise public valuation as unsupported.
  - - Risk rating
    - High valuation and information risk
    - Retention, margins, cash use, concentration, debt, and preferred terms are undisclosed
      in retained evidence.
    - Require downside protection and verified operating quality.
  - - Valuation stance
    - Indeterminate and price-sensitive
    - A reported valuation above $1 billion is financing context, not a supported
      fair-value conclusion.
    - Set a price only after audited metrics and capitalization review.
  - - Return / hold / exit
    - No public target is supportable
    - Public sources do not establish entry security, ownership, dilution, or exit
      multiple.
    - Model returns from actual proposed terms, not the prior headline valuation.
  notes: Views are conditional on retained public evidence as of 2026-10-12; no ARR,
    revenue, valuation multiple, return target, or probability is estimated.
