company:
  name: Awardco
chapter:
  number: 8
  title: Valuation
  summary: Awardco shows credible product breadth, a long-running Amazon Business
    relationship, and company-claimed customer scale, while two third-party pages
    report a $165 million Series B at a valuation above $1 billion in May 2025. Public
    evidence does not establish current revenue, ARR, margins, retention, transaction
    price, or preference terms, so the defensible stance is research more rather than
    underwriting a precise valuation or return.
sections:
- id: recommendation-and-financing-context
  title: Recommendation and Financing Context
  body: The evidence supports a research-more decision, not a buy decision. Awardco's
    company-issued 2021 financing materials reported a $65 million Series A and a
    valuation above $900 million; Matter and Growth Engineer later reported a $165
    million Series B at a valuation above $1 billion in May 2025, and Growth Engineer
    reported $235 million of total funding. Those later figures are useful financing
    context, but neither source supplies round terms, share price, liquidation preferences,
    debt, or a current secondary mark. The retained public sources also do not provide
    verified current revenue, ARR, gross margin, retention, cash balance, or burn.
    Consequently, the last reported private valuation is an observation about financing
    history rather than evidence that a new entry price offers an acceptable return.
  claimRefs:
  - CV006
  - CV007
  - CV010
  - CV011
  - CV016
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-and-anti-thesis
  title: Thesis and Anti-Thesis
  body: 'The thesis rests on product breadth and distribution rather than a public
    financial proof set. Awardco says one platform combines recognition, rewards,
    incentives, and engagement, serves more than 3,000 companies, and provides one-to-one
    reward value through Amazon Business. Amazon''s own partner page corroborates
    the commercial relationship, while Awardco says the relationship dates to 2017.
    SoftwareReviews supplies an external product-quality signal, and the dedicated
    customer-help login is consistent with a post-sale support operation, although
    neither proves retention. The anti-thesis is equally concrete: Achievers argues
    regional Amazon dependence can create inconsistent availability, shipping, duties,
    and lead times, while Matter describes quote-based pricing and meaningful implementation
    work. Both are competitors, so their claims are adverse evidence to test, not
    independent benchmarks.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV012
  - CV013
  - CV014
  - CV015
  tableRefs:
  - TV002
- id: scenario-discipline
  title: Scenario Discipline and Entry Conditions
  body: Bull, base, and bear cases can be framed, but public evidence cannot support
    numeric valuation ranges or return probabilities without fabricating inputs. A
    bull case requires independently verified durable growth, strong retention, attractive
    gross margins, and continued Amazon economics. A base case requires stable retention
    and cash generation at a negotiated price that leaves room for ordinary private-company
    dilution and multiple compression. A bear case includes weaker renewals, implementation
    friction, regional fulfillment limitations, or adverse partner economics. Each
    case therefore uses observable diligence signals rather than invented ARR, multiples,
    or probabilities. Price discovery must follow audited operating evidence and capitalization
    review, not precede them.
  claimRefs:
  - CV003
  - CV010
  - CV012
  - CV013
  - CV014
  - CV016
  tableRefs:
  - TV003
- id: exit-readiness-and-thesis-breaks
  title: Exit Readiness, Diligence Asks, and Thesis Breaks
  body: 'Reported unicorn status and customer scale may support future strategic or
    public exit optionality, but they do not demonstrate readiness. Before underwriting
    an exit, investors should obtain audited statements, ARR and revenue bridges,
    cohort-level gross and net retention, customer concentration, cash and debt schedules,
    the fully diluted capitalization table, and every preferred-stock right. The Amazon
    Business agreement needs direct review for term, renewal, exclusivity, pricing,
    API access, service levels, change of control, and termination. Thesis-break triggers
    are measurable: sustained contraction or weak renewals, deteriorating gross margin
    or cash generation, material customer concentration, loss or adverse repricing
    of the Amazon relationship, or an entry price whose preference and dilution structure
    prevents target returns even under verified operating performance.'
  claimRefs:
  - CV001
  - CV005
  - CV010
  - CV013
  - CV014
  - CV016
