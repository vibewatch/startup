  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Architecture and Core Recognition Workflows
        blocks:
          - type: paragraph
            body: >-
              Awardco operates as a cloud-based employee recognition and corporate incentive management software suite
              designed to unify fragmented workforce rewards into a single administrative portal. The platform delivers
              four foundational recognition modules: peer-to-peer spot recognition, automated service milestones,
              manager-directed performance incentives, and a centralized rewards marketplace. Within end-user daily
              workflows, Awardco integrates directly into workplace collaboration ecosystems including Microsoft Teams
              and Slack, enabling employees and managers to distribute praise, shoutouts, and point awards without
              logging into a separate web application. In addition to digital social feeds, the platform supports
              MemoryBooks™, generating customized digital and physical keepsakes that compile coworker notes,
              congratulations, and photos for career milestones. Administrative overhead is substantially reduced by
              automated scheduling engines that sync with corporate HRIS directories to trigger service anniversary and
              birthday acknowledgments on schedule.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
