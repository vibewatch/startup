chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Zero-Markup Operating Model
        blocks:
          - type: paragraph
            body: >-
              Awardco operates as an enterprise employee rewards and recognition software platform headquartered in
              Lindon, Utah. The company was conceived in 2011 by Founder and Chief Executive Officer Steve Sonnenberg,
              who drew on his family background in the recognition and awards industry to design a modern,
              software-driven alternative to legacy catalog vendors. Historically, employee recognition providers
              monetized reward redemptions by imposing steep 30% to 50% wholesale markups on gift items and corporate
              merchandise. Awardco disrupted this conventional monetization structure by establishing an alliance with
              Amazon Business in 2017. Through deep integration with Amazon's Integrated Ordering API, Awardco enables
              client organizations to grant employees direct access to millions of consumer products, gift cards, and
              event tickets at retail prices with zero vendor markups. This architecture positions Awardco as a hybrid
              engagement platform and rewards-logistics engine, centralizing diverse recognition workflows including
              peer-to-peer appreciation, manager spot bonuses, and milestone celebrations.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO003
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Founder Coverage
        blocks:
          - type: paragraph
            body: >-
              Awardco's executive leadership structure reflects close founder involvement coupled with functional
              specialization across software engineering and operational scaling. Chief Executive Officer Steve
              Sonnenberg serves as the principal strategic architect and public face of the enterprise, maintaining high
              key-person dependency due to his foundational role in negotiating the core Amazon Business relationship.
              Technical leadership is anchored by Chief Technology Officer Mike Sonnenberg, Steve's cousin, who designed
              the company's proprietary software infrastructure and oversaw the technical implementation of synchronous
              order-tracking pipelines with Amazon's catalog APIs. Operational execution and organizational scaling are
              directed by President Tanner Runia, who manages cross-functional execution and enterprise customer
              delivery. Governance oversight has expanded following institutional equity rounds, though detailed board
              composition and protective voting provisions remain confidential under private company governance
              standards.
            claimRefs:
              - CO001
              - CO002
              - CO005
