      - CV006
      - CV010
      - CV011
      - CV016
  - id: TV002
    title: Thesis and Anti-Thesis Tests
    columns:
      - Argument
      - Evidence today
      - What would change the view
    rows:
      - - Platform breadth can support enterprise consolidation.
        - Awardco describes a unified recognition, rewards, incentives, and engagement platform.
        - 'Improve: module-level adoption and expansion data. Weaken: low cross-sell or shelfware.'
      - - Amazon Business is a differentiated distribution relationship.
        - Awardco and Amazon both describe the partnership; Awardco says it began in 2017.
        - 'Improve: durable favorable contract terms. Weaken: repricing, termination, or restricted API access.'
      - - Customer scale and external product sentiment indicate market acceptance.
        - Awardco claims 3,000+ companies, and SoftwareReviews lists an 8.2/10 product score.
        - 'Improve: independently verified cohorts and retention. Weaken: concentration or contraction.'
      - - Operational and competitive friction may limit quality of growth.
        - Achievers flags regional fulfillment constraints; Matter flags quote-based buying and implementation work.
        - >-
          Improve: customer-level implementation and international service data. Weaken: rising delays, duties, or
          churn.
    notes: >-
      Company claims, partner confirmation, independent review data, and competitor assertions are kept separate;
      competitor comparisons are not treated as independent benchmarks.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
