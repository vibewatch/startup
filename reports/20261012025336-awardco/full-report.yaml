      - Residual exposure
    rows:
      - - Primary merchandise catalog and ordering integration
        - Amazon Business
        - Catalog access, redemption, ordering, shipping, and tracking
        - Central to public positioning; contract concentration is not disclosed
        - Changed terms, API disruption, or reduced catalog access
        - High
        - Enhanced API, support process, and non-Amazon reward alternatives
        - Commercial protections and tested failover remain unknown
      - - Country-level fulfillment and local reward coverage
        - Amazon Business and local reward providers
        - Availability, product selection, shipping, and alternative redemption
        - Availability explicitly varies by country
        - Important employee locations receive narrower choice or higher charges
        - Medium
        - Curated catalogs, local gift cards, prepaid cards, and other options
        - No verified country-level service and failure-rate schedule
      - - Enterprise workflow integrations
        - HRIS and collaboration-platform providers
        - Roster, workflow, and employee-access integrations
        - Third-party directory reports multiple named integrations; usage mix is undisclosed
        - API or implementation changes delay rollout or create manual administration
        - Medium
        - Awardco-assisted setup and support channels
        - No integration-specific SLA, concentration, or maintenance-cost data
    notes: >-
      Rows are ordered by assessed impact; concentration levels and contract protections are gaps unless directly
      disclosed by retained sources.
