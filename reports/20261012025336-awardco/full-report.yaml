  - id: TV003
    title: Bull, Base, and Bear Scenario Framework
    columns:
      - Scenario
      - Operating assumptions to verify
      - Valuation / return logic
      - Probability signal
      - Downside or thesis-break trigger
    rows:
      - - Bull
        - >-
          Durable growth, strong cohort retention, attractive gross margin, cash discipline, and stable Amazon
          economics.
        - Use verified forward operating metrics and transaction terms; no public range is supportable.
        - Positive only after independent financial and cohort evidence.
        - Any material miss in retention, margin, or partner durability invalidates the case.
      - - Base
        - Stable renewals, moderate expansion, controlled cash use, and ordinary private-company dilution.
        - Require a negotiated entry price with room for multiple compression and follow-on dilution.
        - Neutral until audited data and a term sheet are available.
        - Price or preferences that require flawless execution break the case.
      - - Bear
        - Weak renewals, implementation friction, regional reward limitations, or adverse Amazon contract economics.
        - Model capital impairment and preference overhang from the actual cap table; do not infer a public value.
        - Elevated if customer references or contract review confirm adverse signals.
        - Contraction, cash deterioration, concentrated churn, or partner loss.
    notes: >-
      Scenarios are qualitative because retained public sources do not disclose the financial, capitalization, or
      transaction inputs needed for numeric ranges or probabilities.
    claimRefs:
      - CV003
      - CV010
      - CV013
      - CV014
      - CV016
