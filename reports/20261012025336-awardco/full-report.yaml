  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary Framing and Scope
        blocks:
          - type: paragraph
            body: >-
              The employee recognition and rewards sector has historically occupied an ambiguous boundary between human
              capital management software and promotional gift fulfillment. Traditional legacy vendors monetized
              employee recognition primarily through opaque product markups—often 30% to 50% above retail
              prices—embedded within proprietary gift catalogs, treating software as a subsidized front-end. Awardco
              establishes a differentiated market boundary by decoupling the software subscription layer from
              merchandise fulfillment. Through a direct integration with the Amazon Business API, the platform provides
              access to millions of items at actual market prices with zero vendor markups and free shipping options
              across 180 or more global locations. This architectural distinction isolates Awardco's software spend from
              underlying reward pass-through budgets, targeting organizations seeking to eliminate hidden vendor margins
              while consolidating service awards, peer recognition, and wellness incentives into a single administrative
              console.
            claimRefs:
              - CM001
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM009
      - number: '2.2'
        title: Addressable Market Sizing and Spend Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Sizing the enterprise recognition and incentive market requires examining multiple lenses rather than
              relying on a single top-line estimate. While broad global human capital management software and employee
              experience categories exceed $250 billion, total global employee recognition and corporate gift spending
              is estimated at $50 billion to $75 billion annually. Within that aggregate spend, industry benchmarks
              established by practitioners and platform telemetry indicate that effective enterprise recognition budgets
              range between $200 and $350 per employee per year, covering platform software fees, reward point
              disbursements, and program administration. For Awardco's primary serviceable market—mid-market and
              enterprise organizations with 500 or more employees—the serviceable addressable market for software
              licensing and managed recognition platforms stands at $2.5 billion to $4.0 billion. Awardco's reported
              customer base of more than 3,000 organizations and run-rate scale exceeding $100 million demonstrates
              meaningful penetration, yet market sizing remains constrained by private market reporting where underlying
              gross merchandise value is frequently conflated with recurring software revenue.
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
