companyProfile:
  summary: >-
    Awardco is a Lindon, Utah-based employee recognition and rewards platform founded by Steve Sonnenberg that combines
    recognition workflows, incentives, rewards fulfillment, and engagement tooling around a long-running Amazon Business
    integration. The company reports more than 3,000 customer organizations and global deployment across 135 countries,
    but it remains privately held with no audited ARR, margin, or retention disclosures, which keeps core economics and
    valuation durability difficult to underwrite.
  founders:
    - name: Steve Sonnenberg
      role: Founder and CEO
      claimRefs:
        - CO001
        - CO005
  headquarters: Lindon, UT, USA
  productSummary: >-
    Enterprise employee recognition and rewards platform with spot recognition, service anniversaries, incentive
    programs, benefits-and-perks workflows, A-Pay card options, and Amazon Business reward fulfillment.
  customerFocus: Mid-market and enterprise organizations, especially distributed and deskless workforces
  businessModel: >-
    Quote-based annual platform fees, tiered per-user subscriptions, implementation services, and transaction-linked
    reward fulfillment
  stage: late-stage venture
  fundingStatus: $165M Series B in March 2025; $235M total venture capital raised
