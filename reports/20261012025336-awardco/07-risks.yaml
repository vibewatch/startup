chapter:
  number: 7
  title: Risks
  summary: Awardco's clearest structural risk is dependence on Amazon Business for
    a central part of its reward proposition, with country-level catalog, fulfillment,
    tax, and shipping variability creating residual execution exposure. Public evidence
    supports meaningful operational mitigations, but current legal, security, incident,
    partner-contract, and audited financial evidence remains insufficient for a fully
    underwritten risk view.
sections:
- id: structural-partner-exposure
  title: Structural partner exposure
  body: Amazon Business is both a product advantage and the largest visible dependency
    in the assigned evidence. Amazon confirms that Awardco uses the relationship for
    employee recognition and reward redemption, while an independent vendor directory
    characterizes Awardco as Amazon-integrated and zero-markup. Awardco also says
    its enhanced integration uses Amazon's Integrated Ordering API for real-time order
    and tracking updates. Those facts make continuity, economics, and service quality
    under the Amazon relationship material to the investment case, but they do not
    establish exclusivity or disclose renewal, termination, pricing, service-level,
    or change-of-control terms. Residual risk therefore remains high until the underlying
    agreement and failover options are reviewed. A thesis-break signal would be loss
    of favorable catalog access, material new channel fees, or an inability to demonstrate
    workable non-Amazon fulfillment for important countries.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR007
  - CR008
  tableRefs:
  - TR003
  figureRefs:
  - FR001
- id: legal-regulatory-boundaries
  title: Legal and regulatory boundaries
  body: The public record in the assigned pool supports a bounded cross-border risk,
    not a finding of noncompliance. Awardco states that Amazon Business availability
    and product selection vary by country, and that taxes, shipping, customs, or other
    country-specific charges may affect physical-item redemptions. Its own comparison
    guidance tells buyers to validate country, currency, catalog, tax, and fulfillment
    requirements. These disclosures justify country-by-country diligence on reward
    taxation, consumer terms, and responsibility for import charges. By contrast,
    the pool contains no primary regulator, court, privacy, certification, or incident
    source that establishes Awardco's current posture. The adverse search returning
    no results is not evidence that no matter exists. Investment approval should require
    current legal representations, data-processing terms, security attestations, incident
    history, and a jurisdictional compliance matrix rather than treating public silence
    as clearance.
  claimRefs:
  - CR003
  - CR005
  - CR011
  tableRefs:
  - TR001
- id: operations-financial-model-and-controls
  title: Operations, financial-model risk, and controls
  body: Operational evidence is mixed but actionable. Awardco says quantity limits
    can leave high-profile orders unfulfilled, while its support page offers round-the-clock
    chat, email, and phone assistance for delays or discrepancies. Independent SoftwareReviews
    data is positive on plan-to-renew and implementation scores, yet one validated
    reviewer calls the budgeting function clunky; the fetched page does not provide
    the respondent denominator for the aggregate scores. Matter, an identified competitor,
    describes Awardco as quote-based and implementation-intensive, and Growth Engineer
    reports nonpublic pricing and a wide estimated implementation-cost range. Those
    sources are useful signals, not independent audits. The historical Series A statement
    that Awardco had been cash-flow positive also cannot establish current burn, margins,
    working-capital exposure, or liquidity. Mitigation should combine reference calls,
    an implementation pilot, country-level order tests, support and fulfillment metrics,
    audited current financials, and a fully itemized total-cost schedule.
  claimRefs:
  - CR006
  - CR009
  - CR010
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
  - TR002
