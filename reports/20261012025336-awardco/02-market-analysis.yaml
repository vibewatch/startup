callouts:
- calloutType: insight
  title: Disruption of Traditional Catalog Markups
  body: Legacy employee recognition providers historically generated substantial profit
    margins by marking up merchandise catalogs by 30% to 50% above prevailing retail
    prices. Awardco's partnership with Amazon Business disrupts this dynamic by offering
    zero markups on millions of products, shifting the vendor business model strictly
    to transparent software subscription fees.
  claimRefs:
  - CM001
  - CM005
- calloutType: risk
  title: Concentration and Dependency on Amazon Infrastructure
  body: While Amazon Business provides unmatched catalog breadth and international
    delivery across 180+ locations, it creates a structural dependency on a single
    e-commerce infrastructure. Product availability fluctuations, account quantity
    limits, and partner terms represent systemic operational risks for Awardco clients.
  claimRefs:
  - CM007
  - CM014
