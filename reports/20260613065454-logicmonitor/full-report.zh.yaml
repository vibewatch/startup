        - ARR 停在当前下限附近，信任折价持续，投资者只给 3.5x-4.5x 区间。
        - 约 1.4B-1.9B；相对上次公开标记约 0.6x-0.8x。
        - 如果安全 / 可靠性问题重复出现，或 AI/Catchpoint 经济性仍未被证明，这一情景会变得有意义。
        - 又一次信任事件、续约数据偏弱，或迹象显示 2024 年资本结构比标题看起来更稀释。
      - - 基准
        - ARR 温和高于 400M，平台相关性守住，估值落在调整后的 Dynatrace/Elastic 类区间附近。
        - 约 2.2B-2.9B；相对上次公开标记大致持平至约 1.2x。
        - 按当前公开证据，这是概率最高的情景。
        - 需要增长稳定且没有新的信任冲击，但仍缺少足够证据支撑重大倍数扩张。
      - - 牛市
        - ARR 向 450M-500M 增长，Edwin AI 和 Catchpoint 抬升扩张质量，市场给出 7.0x-8.5x 区间。
        - 约 3.3B-4.3B；相对上次公开标记约 1.4x-1.8x。
