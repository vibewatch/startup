      - 可衡量或声称的收益
      - 已知限制
    rows:
      - - NOC 分析师分诊基础设施告警
        - 告警风暴掩盖根因和依赖关系上下文
        - Collector 输入遥测数据，拓扑图展示依赖关系，Edwin 汇总事件
        - 公司称可减少告警噪音、加快事件解决
