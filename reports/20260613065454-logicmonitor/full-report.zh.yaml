      - number: '8.2'
        title: 当前融资背景与可比公司真正说明的问题
        blocks:
          - type: paragraph
            body: >-
              最重要的估值锚点仍是 2024 年融资。LogicMonitor、Vista 和 PSG 都将该交易描述为 800 million USD 新股权和战略融资，估值约 2.4 billion
              USD（含债务），Vista 保留控制权。这个表述方向上有帮助，但分析上不完整：它确认了规模和 sponsor 支持，也告诉投资人 headline
              估值不是干净的普通股标记，因为战略融资和债务都是方案的一部分。因此，公开记录支持一场大型 sponsor 支持资本事件的存在，但不能让外部投资人承销新资金在资本栈中到底排在哪里。


              对比上市可比公司，LogicMonitor 看起来处在中间位置，而不是便宜货。Datadog 仍享有高溢价上市倍数，因为增长和品类领导力仍强得多。Dynatrace 更接近 LogicMonitor
              的隐含区间；Elastic 和 PagerDuty 的交易倍数则明显更低，因为增长、盈利组合或产品定位不足以支撑更高标记。New Relic 6.5 billion USD 私有化和 Splunk 28
              billion USD 出售说明，可观测性资产可以远高于 LogicMonitor 上一轮标记出清，但这两个参照都规模更大，且处在更干净的公开市场语境。ServiceNow
              只适合作为软件平台上限参照，而不是直接的可观测性同业。
