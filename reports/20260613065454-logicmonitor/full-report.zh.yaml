  - id: TV005
    title: 论点破裂与止损触发因素表
    columns:
      - 触发因素
      - 公开阈值 / 信号
      - 为什么重要
      - 预期估值影响
      - 行动含义
      - 监测来源
    rows:
      - - 安全失败重演
        - 又一次影响客户的安全事件，或有可信证据表明 collectors 仍是现实攻击路径。
        - 这会在续约驱动的企业模式里加深信任债。
        - 倍数压缩到当前基准情景以下。
        - 暂停投资或立即下调估值，直到根因和留存冲击清楚。
        - TechCrunch / SC Media / 客户披露
      - - 宕机节奏恶化
        - 工作时段出现重大访问中断，或事件频率升到当前噪音水平之上。
        - 监测厂商自己的控制平面不稳，可信度会很快丢失。
        - 公开风险折价扩大，拖慢任何 IPO 或战略交易流程。
        - 把它当作承销质量和客户背书耐久性的红旗。
        - LogicMonitor 状态页 / IsDown
      - - AI 变现不及预期
        - Edwin AI 仍停留在订单额故事，没有附加购买、留存或利润率证明。
        - 溢价估值的理由取决于 AI 改变经济性，而不只是改变定位。
        - 牛市情景回落到基准或熊市倍数区间。
        - 没有队列证据，就不要在上次公开标记之上付价。
        - LogicMonitor 报告 / 尽调资料室
      - - Catchpoint 整合低于预期
        - 没有证据显示收购带来交叉销售或更高质量的企业扩张。
        - 平台宽度会被解读为复杂性，而不是护城河。
        - 削弱溢价倍数扩张的支撑。
        - 在任何上行情景里都要折价处理协同说法。
        - LogicMonitor / Catchpoint / 客户访谈
      - - 资本结构证实偏重
        - 债务、优先保护或清算瀑布吸收了大部分标题企业价值。
        - 入场价在 EV 层面可能看起来不错，但在普通股权层面很差。
        - 即便企业价值守住，股权上行也会被压缩。
        - 任何承诺前都要重切回报模型。
        - 股权结构表 / 贷款人文件
      - - 留存质量偏弱
        - 大客户续约或扩张明显弱于公开代理指标暗示。
        - 续约驱动的故事，一旦留存质量偏软就会断裂。
        - 估值移向 Elastic/PagerDuty 类区间，甚至更低。
        - 除非价格重置，否则快速下调评级。
        - 队列留存和流失明细
    notes: 每个触发因素都写成可观察的承销事件，便于本章用具体证据刷新，而不是被叙事漂移带着走。
