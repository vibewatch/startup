      - number: '1.4'
        title: 里程碑、规模指标与反向信号
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，公司多次扩展商业边界。LogicMonitor 成立于 2007 年，2018 年向 Vista 出售多数股权，2019-2021 年将合作伙伴计划专业化，2024
              年公开强调业务动能加速，2025 年跨过 $300M ARR，2026 年 4-5 月围绕 Autonomous IT 重新讲述自身故事：每天处理超过 2 万亿项指标，并在市场上预览 AI
              驱动的工作流。这个里程碑模式不是一家停滞的监控厂商；它是一家借助赞助方资本和已安装遥测基础，向 AI 辅助运维上探栈层的厂商。 [CO001] [CO018] [CO023] [CO024] [CO027]
              [CO028] [CO029] [CO031] [CO032] [CO038] [CO039]


              规模声明方向上强，但公司披露之间并不完全一致。当前 About 页面称 2,300+ 家客户、700+ 家 MSP 和 100,000+ 名用户；2024 年 2 月业务结果则提到约 2,400
              家客户。每日处理指标也从 2023 年的 8000 亿，升至 2025 年末的 1.8 万亿，再到 2026 年 4 月的 2+
              万亿。这些变化可信且总体正面，但也说明后续章节应引用带日期的时间点指标，而不是压平成一个永恒数字。 [CO005] [CO024] [CO028] [CO029] [CO030]


              本轮抓取中的主要反向证据，来自网络安全和运营信任，而不是公开记录中的大规模裁员或诉讼。TechCrunch 和 SC World 报道称，2023
              年一起安全事件影响了少数客户，弱默认密码被指为暴露路径，至少一个来源声称产生了勒索软件影响。另行看，公开状态页显示 LogicMonitor 仍会进行可见维护，也曾出现短暂门户访问中断，尽管没有出现 2026 年
              6 月重大事故。所查裁员追踪器没有发现 LogicMonitor 特定的大规模 WARN 信号，但员工关系图景并不完整，因为本轮更丰富的评论来源被阻挡。 [CO033] [CO034] [CO035]
              [CO036] [CO037]
