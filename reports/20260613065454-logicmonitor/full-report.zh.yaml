        - 支持 RCA，并可选择抑制依赖告警
        - 需要导入 TopologySources、PropertySources，并配置正确凭证
      - - 事件响应人员关联第三方事件
        - 监控数据散落在不同工具和工单系统里
        - Edwin AI 摄取开箱即用和自定义集成，并把事件规范化为 Edwin CEF
        - 可为外部事件增加上下文、增强信息和引导式修复
        - 集成仍需要配置工作和凭证管理
