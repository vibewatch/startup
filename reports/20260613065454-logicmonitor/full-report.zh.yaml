      - - 来自 Catchpoint 和相邻产品的交叉销售
        - 互联网性能和数字体验产品把钱包份额扩展到核心基础设施监控之外
        - 模块加购 / 扩张 ARR
        - Catchpoint 收购扩大覆盖范围；2024 年披露已显示多产品采用显著
        - 若加购加深平台广度则中高，但缺少单独收入披露
        - 展示按产品族划分的扩张 ARR，以及大型企业账户挂载率
