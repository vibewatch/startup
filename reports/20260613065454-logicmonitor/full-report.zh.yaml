  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 数值 / 状态
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - ARR 规模
        - '>400M，截至 2026 年 5 月；独立报道为 >300M'
        - 中
        - 证明 LogicMonitor 已是有规模的可观测性厂商，而非早期工具
        - 提供 2024 年至报告日的月度 ARR 桥接，拆分净新增、扩张、收缩和流失
      - - 大客户集中度
        - 80% ARR 来自 ARR 超过 100k 的客户
        - 中
        - 显示企业客户偏重和续约依赖；如果留存保持高位，通常会支撑更好的收入质量
        - 披露 >100k 和 >1M ARR 账户数量、队列增长，以及前 20 大账户集中度
      - - 留存
        - 公开引用约 ~95% 留存
        - 中
        - 留存是经常性质量和回本耐久度的核心证据点
        - 按细分市场和渠道提供总留存、NRR 和 logo 流失
      - - 披露客户隐含 ARR
        - 公开窗口内，披露客户的平均 ARR 约 103k 至 167k
        - 估计
        - 可用来校验企业账户规模和打包深度是否合理
        - 提供按套餐、直销与合作伙伴来源拆分的实际 ARPA / ACV
      - - 毛利率
        - null
        - 低
        - 毛利率决定模型更像高效软件，还是服务占比重的可观测性运营
        - 披露订阅毛利率、综合毛利率、托管成本，以及支持成本占收入比例
      - - CAC / 回本
        - null
        - 低
        - 没有 CAC 和回本周期，投资者无法判断合作伙伴与 AI 扩张是在提升效率，还是只是在增加销售成本
        - 提供销售效率、CAC 回本周期、S&M 占 ARR 比例，以及合作伙伴激励负担
      - - 自由现金流 / 经营杠杆
        - LogicMonitor 未公开；同业显示规模化后 FCF 强劲
        - 低
        - 同业证据表明可观测性业务能产生现金，但 LogicMonitor 尚未披露是否已跨过这一门槛
        - 提供经营现金流、自由现金流、资本开支和资本化软件政策
    notes: 空值是有意保留，表示公开证据缺失。非空行混合官方披露和估算代理，应作为方向性判断，而非管理层质量的经营模型。
