        - 平台工程 / 合作伙伴
        - 成熟自动化界面，但支持边界不一
        - REST API v3、Python/Go SDK、PowerShell、MCP server、AWS Marketplace 采购
        - 为管理员提供多条自动化路径和可见的开发者生态
