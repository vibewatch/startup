        - label: SRE / 应用运维
          values:
            - SRE 和事件指挥官
            - 工程 / 运营共享预算
            - 服务级诊断和更快根因定位
            - 需要跨应用和基础设施边界压低 MTTR
        - label: MSP 运营
          values:
            - 多租户 NOC 和支持团队
            - 通过客户合同出资的 MSP P&L
            - 入驻、报告、主动支持、SLA 证明
