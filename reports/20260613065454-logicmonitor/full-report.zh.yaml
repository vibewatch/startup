  - id: TE003
    title: 技术 / 运行架构表
    columns:
      - 层 / 组件
      - 系统角色
      - 关键依赖
      - 主要风险
    rows:
      - - Collector 主机
        - 轮询设备，并接收 trap/syslog/flow 数据
        - 客户管理、靠近被监控资源的 Windows/Linux 服务器
        - 规格配置不当、部署位置不佳或权限过高的安装，可能削弱可靠性和安全性
      - - LogicModules（DataSources / TopologySources / PropertySources）
        - 决定发现、采集、映射和告警的对象
        - 当前模块仓库内容和正确的设备识别
        - 覆盖缺口或过期模块会制造盲点或噪音告警
      - - LogicMonitor 云控制平面
        - 存储、处理并展示遥测数据
        - 到 LogicMonitor 数据中心的出站 HTTPS 连接，以及门户可用性
        - 即便摄取继续，门户中断也会影响用户访问
      - - 拓扑引擎
        - 把 ERI 和协议推导出的关系连成 RCA 图
        - 导入的拓扑模块、网络凭证和 ERI 正确性
        - 错误或重复的 ERI 可能误合并资源，或漏掉关系
      - - Service Insights 引擎
        - 跨逻辑服务汇总指标
        - 正确的服务定义和聚合 DataSources
        - 服务建模错误会保留错误抽象，而不是正确抽象
      - - Edwin AI 关联层
        - 丰富、分组、排序事件，并对事件采取动作
        - 传入遥测、集成和凭证范围的质量
        - 上下文薄弱或自动化设计不佳，会产出低信任度建议
      - - API / SDK 层
        - 对设备、服务、告警、仪表盘、日志等进行程序化控制
        - REST API v3 认证、版本和速率限制
        - 旧 API 迁移债或 token 卫生薄弱，会拖慢自动化
      - - 身份与合规边界
        - 控制用户认证和环境隔离
        - 客户 IdP、SAML 配置、FedRAMP 环境选择
        - 角色映射错误，或商业 / FedRAMP 边界混淆，会制造访问风险
    notes: 架构行聚焦已有明确文档的运行层，而不是推测的内部微服务。
    enumerationScope:
