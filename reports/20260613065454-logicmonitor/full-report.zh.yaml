          detail: 对平台作为控制平面的信心
        - id: N5
          label: 运维负担
          detail: 告警噪声、实施摩擦、支持负荷
        - id: N6
          label: 留存 / 扩张
          detail: 续约质量和多产品采用
        - id: N7
          label: 利润率 / 效率
          detail: 支持强度和迁移成本
        - id: N8
          label: 估值信心
          detail: 倍数容忍度和投资逻辑耐久性
      edges:
        - from: N1
          to: N4
          label: 任何重复故障后都会侵蚀信心
        - from: N2
          to: N4
          label: 损害可靠性感知
        - from: N3
          to: N5
          label: 增加上线和调优复杂度
        - from: N4
          to: N6
          label: 影响续约和交叉销售意愿
        - from: N5
          to: N6
          label: 拖慢采用和价值兑现
        - from: N5
          to: N7
          label: 推高支持 / 服务成本
        - from: N6
          to: N8
          label: 改变增长耐久性假设
        - from: N7
          to: N8
          label: 压缩经营杠杆叙事
    claimRefs:
      - CR021
      - CR024
      - CR032
      - CR049
      - CR051
      - CR052
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 即便功能需求仍然强劲，关键外部依赖和客户自管依赖也可能改变 LogicMonitor 的风险。
    data:
      nodes:
        - id: D1
          label: AWS 覆盖
          detail: 商业区域 + GovCloud + 迁移叙事
        - id: D2
          label: Catchpoint 产品
          detail: 互联网遥测、合成监控、数字体验
        - id: D3
          label: 客户 IdP / RBAC
          detail: SSO、MFA、群组映射、最小权限
        - id: D4
          label: 客户环境中的采集器
          detail: 主机放置、协议可达性、权限设计
        - id: D5
          label: MSP / GSI / VAR
          detail: 分发和实施质量
        - id: D6
          label: LM Envision 核心
          detail: 主要可观测性控制平面
        - id: D7
          label: 客户结果
          detail: 可靠性、噪声降低、扩张、信任
      edges:
        - from: D1
          to: D6
          label: 托管服务 + 推动迁移动作
        - from: D2
          to: D6
          label: 输入互联网遥测和 AI 上下文
        - from: D3
          to: D6
          label: 控制安全用户访问
        - from: D4
          to: D6
          label: 提供遥测和本地执行路径
        - from: D5
          to: D6
          label: 决定部署质量和销售触达
        - from: D6
          to: D7
          label: 决定真实运营价值
        - from: D2
          to: D7
          label: 区分互联网问题与基础设施问题
    claimRefs:
      - CR021
      - CR022
      - CR024
      - CR026
      - CR028
      - CR032
      - CR041
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 从已披露规模和战略广度出发，穿过公开折价因素，推导到当前观察 / 继续研究立场的决策链。
    data:
      nodes:
        - id: n1
          label: 规模证明
          description: ARR > $400M，加上赞助方支持的平台规模，证明 LogicMonitor 是真正的企业软件资产。
        - id: n2
          label: AI / 产品证明
          description: Edwin AI 贡献三分之一订单额，Catchpoint 扩大互联网和数字体验覆盖。
        - id: n3
          label: 渠道 / 生态证明
          description: AWS 和 Deutsche Telekom 关系证明其企业分发相关性。
        - id: n4
          label: 估值锚
          description: 上一次公开融资给出的估值约为 $2.4B，包含债务。
        - id: n5
          label: 折价因素
          description: 债务 / 优先权不透明、没有公开 NRR 或利润率数据，以及安全 / 可靠性信任债，都会压住上行空间。
        - id: n6
          label: 立场
          description: 观察 / 继续研究，估值立场为合理，风险评级为高。
      edges:
        - from: n1
          to: n4
          label: 支撑规模锚
        - from: n2
          to: n4
          label: 支撑溢价叙事
        - from: n3
          to: n4
          label: 支撑企业相关性
        - from: n4
          to: n6
          label: 设定入场纪律
        - from: n5
          to: n6
          label: 限制确信度
        - from: n2
          to: n6
          label: 若验证则创造上行
    approximationNotes: 本图是承销逻辑图，不是管理层指引；它展示的是导向投资建议的证据链，而不是机械评分公式。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV012
      - CV013
      - CV015
      - CV036
      - CV045
      - CV046
      - CV054
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 隐含企业价值对已披露 ARR 下限和公开可比公司可见倍数区间的敏感性。
    data:
      items:
        - label: 400M ARR，4.0x
          value: 1.6
          note: 接近悲观情景的公开可比公司低端区间。
        - label: 400M ARR，6.0x
          value: 2.4
          note: 大致等于上一次公开披露估值。
        - label: 400M ARR，8.0x
          value: 3.2
          note: 规模没有大幅增加时，需要溢价倍数支撑。
        - label: 450M ARR，6.0x
          value: 2.7
          note: 若增长守住且倍数不压缩，对应基准情景上行。
        - label: 450M ARR，8.0x
          value: 3.6
          note: 需要清晰的 AI / Catchpoint 扩张证明。
        - label: 500M ARR，8.5x
          value: 4.25
          note: 乐观情景，需要更强增长和溢价重估。
    approximationNotes: 数值是简单的 ARR 乘以倍数敏感性点，采用公司公开 ARR 下限和公开可比公司区间；债务和优先权悬置可能让普通股结果低于这些企业价值点。
    claimRefs:
      - CV001
      - CV023
      - CV024
      - CV026
      - CV027
      - CV029
      - CV030
      - CV031
      - CV032
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 悲观、基准、乐观估值区间，以及相对上一次披露估值的中点结果。
    data:
      items:
        - label: 悲观情景
          low: 1.4
          mid: 1.65
          high: 1.9
          note: 信任折价延续；增长持平；软件倍数落在低端区间。
        - label: 基准情景
          low: 2.2
          mid: 2.55
          high: 2.9
          note: ARR 保持在 $400M 以上，倍数落在调整后公开可比公司的中端区间附近。
        - label: 乐观情景
          low: 3.3
          mid: 3.75
          high: 4.3
          note: AI 加 Catchpoint 明显改善扩张质量，市场接受溢价区间。
    approximationNotes: 区间是分析师基于公开证据和情景假设给出的估计，不是管理层预测，也不是完整的私募市场交易模型。
    claimRefs:
      - CV047
      - CV048
      - CV049
      - CV050
      - CV052
      - CV054
      - CV055
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的评分卡，覆盖从市场相关性到证据质量的八个维度。
    data:
      items:
        - label: 市场相关性
          value: 8/10
          note: 可观测性、AI 运维和数据中心现代化仍是有吸引力的赛道。
        - label: 规模证明
          value: 8/10
          note: ARR > $400M 和赞助方支持是强规模标记。
        - label: AI 变现证明
          value: 7/10
          note: 订单额和经常性增长信号强，但缺少私有经济性数据。
        - label: 渠道 / 生态深度
          value: 7/10
          note: AWS 和 Deutsche Telekom 强化企业相关性。
        - label: 资本结构清晰度
          value: 3/10
          note: 债务和优先权悬置仍不透明。
        - label: 单位经济性可见度
          value: 3/10
          note: 没有公开 NRR、毛利率或自由现金流证明。
        - label: 风险画像
          value: 4/10
          note: 安全和可靠性信任债仍然重要。
        - label: 估值支撑
          value: 6/10
          note: 以上一次公开估值看，当前证据下估值合理，但吸引力并不明确。
    approximationNotes: 分数是分析师对所引公开记录的综合判断，用于支持比较决策，而不是量化模型输出。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV012
      - CV013
      - CV043
      - CV044
      - CV046
      - CV054
