      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              最相关的买方集合是多角色的。Datadog 和 ServiceNow 的公开文件显示，可观测性决策如今会触及开发、运营、安全、业务和工作流负责人，而不只是传统 NOC 经理。LogicMonitor
              自己的材料进一步把清单收窄到 ITOps、CloudOps 和 MSP 运营团队；其 MSP
              页面也说得很清楚：托管服务提供商可以是直接买方和运营方，即使经济价值在下游客户环境中实现。第三方市场数据中，大型企业仍是最大支出锚点，说明企业基础设施负责人仍掌握最大预算；但随着 AI 支出上升，FinOps 和
              Cloud Center of Excellence
