      - number: '5.2'
        title: 采集、上下文与控制平面架构
        blocks:
          - type: paragraph
            body: >-
              产品的技术重心仍是 Collector 和 LogicModule 系统。LogicMonitor 文档反复强调，客户按每个 location 安装一个 Collector，而不是给每个资源装一个
              agent；Collector 使用标准协议和内置 DataSources 判断监控对象，加密数据，并通过出站 HTTPS 发回。这种设计减少了端点蔓延，但也带来实际部署约束：Collectors
              应靠近被监控资源放置，不应跨公共互联网或重 NAT 边界轮询，并且需要对 SNMP、WMI、JDBC、SSH 等数据源具备协议可达性。容器化部署存在，但容器路径灵活性较低，仍需要 root。 [CE016]
              [CE017] [CE018] [CE019] [CE020] [CE021] [CE022] [CE023]


              采集层之上，LogicMonitor 搭建了多个上下文层，使它不同于更简单的基础设施监控器。拓扑映射使用 LLDP、CDP、BGP、OSPF 和 EIGRP 构建二层和三层关系图；Service Insights
              将实例数据聚合成逻辑服务，并在组件实例 churn 时保留历史服务指标。Edwin AI 通过把第三方事件归一化为 Edwin CEF、将其与内部遥测关联，并支持引导式或自动化修复，再加上一层控制平面。API 和
              SDK 表面把同一模型延展到外部自动化：公开文档把 REST API v3、Python/Go SDK 和社区工具定位为以编程方式管理设备、服务、告警、collectors、仪表盘和日志采集的一等路径。
