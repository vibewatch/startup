      - number: '8.5'
        title: 最终尽调问题与什么会改变观点
        blocks:
          - type: paragraph
            body: >-
              缺失的尽调项已经足够具体，可以直接变成决策规则。投资人需要实际债务和优先权栈，而不只是 headline 估值；需要 NRR、GRR、毛利率和自由现金流证据，而不只是 ARR 与 bookings
              话术；还需要证明安全信任债没有迁移为大客户续约摩擦。投资人还需要 Edwin AI attach、Catchpoint cross-sell、伙伴来源增长的直接经济性，以及 AWS
              对齐迁移工作到底产生了耐久软件价值，还是服务含量高的复杂度。


              如果管理层能够证明资本结构可控、留存强劲、利润率结构可信，并且 AI 加 Catchpoint 带来真实扩张经济性，下一次刷新时建议可能上调为
              BUY——尤其是在入场价格仍接近上一轮公开标记的情况下。如果这些答案偏弱，或负面运营信号在私有指标改善前恶化，正确姿态会从 TRACK 转向
              AVOID。目前，公开记录支持保持兴趣并继续尽调，但不支持在已知估值锚点之上投入 conviction capital。
