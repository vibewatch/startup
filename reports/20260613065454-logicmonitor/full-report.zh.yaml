      - number: '8.3'
        title: 牛市、基准与熊市区间及回报逻辑
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个相对收窄的基准情景，但下行和上行都比 headline 增长故事暗示的更宽。熊市情景假设公开风险因素比管理层叙事更重要：没有令人信服的证据证明 Edwin AI 或 Catchpoint
              显著抬升净留存，看不到债务 / 优先权包袱，安全和可靠性历史继续带来信任折价。在这种情况下，投资人可能把 LogicMonitor 估到更慢或信心更低的软件可比区间，对应约 1.4 billion USD 至
              1.9 billion USD。


              基准情景假设 ARR 仍温和高于 400 million USD，伙伴分发保持健康，公司维持战略相关性，但没有证明达到上市公司质量的利润率画像。这支持约 2.2 billion USD 至 2.9 billion
              USD 的区间，相比上一轮公开标记只有有限上行。牛市情景需要的不只是增长延续：投资人需要看到 Catchpoint 扩大钱包份额、Edwin AI 抬高 booked value
              和留存质量，且没有新的信任冲击。只有这样，3.3 billion USD 至 4.3 billion USD 区间才有支撑。关键点是，公开证据目前不支持从已知入场点承销 venture-style
              上行；它支持的是有纪律的情景定价。
