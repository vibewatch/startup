        - 需要清晰的交叉销售、更好的留存、不再发生宕机 / 安全事件，并且资本结构透明可信。
    notes: 区间是基于已披露 ARR 下限、上市可比公司区间和定性风险折价得出的公开证据估计；不是管理层指引，也不是完整 DCF。
