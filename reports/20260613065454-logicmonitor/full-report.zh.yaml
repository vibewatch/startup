        - 增长期，持续发布
        - 摘要、根因指引、事件关联、引导式补救、自动补救钩子
        - 从告警审阅推进到执行，并可通过 Edwin CEF 摄取第三方事件
        - 需要生产环境证据，验证误报率和自动补救护栏率
      - - LM 服务洞察 / Dynamic Service Insights / LM 正常运行时间
        - SRE / 服务负责人
        - 从增长走向成熟
        - 将实例级遥测汇总为逻辑服务和服务级健康
        - 在短暂实例之间保留服务历史，并把基础设施与业务服务健康连接起来
        - 需要采用率 / 挂载数据，以及服务视图在多大程度上替代原始主机级排障的证据
      - - Topology Mapping
        - NetOps / NOC / RCA 团队
        - 成熟的专门能力
        - 基于协议发现的关系构建动态 L2/L3 地图和 RCA 上下文
        - 原生依赖上下文，并可选择抑制从属告警
        - 需要证据说明在超大规模多租户或 MSP 部署中的地图准确性
      - - Catchpoint 集成 / 数字体验
