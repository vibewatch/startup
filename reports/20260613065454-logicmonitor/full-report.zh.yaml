        - 需要独立证明实际效果，而不只依赖公司案例研究
      - - Collectors + LogicModules
        - 基础设施 / 平台工程师
        - 成熟，但对部署敏感
        - 按地点采集数据、自动发现、协议轮询、trap/syslog/netflow 摄取
        - 一个 collector 可监控数百台设备，避免每个端点都装 agent 的蔓延
        - 需要客户级证据，说明不同环境组合下的扩展上限
      - - Edwin AI + AI Agent
