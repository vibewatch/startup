companyProfile:
  summary: >-
    LogicMonitor 是一家后期私有可观测性软件公司，Steve Francis 和 Jie Song 于 2007 年创立。公司总部在 Santa Barbara，由 Vista Equity Partners
    支持，销售混合可观测性平台；业务已从基础设施监控扩展到 AI 辅助运维，服务超过 2,300 家客户、700+ 家 MSP 和 100,000+ 名用户。公开证据显示，这是一家 ARR 超过 $400M、并在 2024
    年完成大额融资的平台型公司，但在利润率、留存质量、债务和治理披露上，透明度仍远低于公开市场同业。
