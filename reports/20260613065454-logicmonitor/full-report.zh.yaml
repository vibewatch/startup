  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 上调 / 下调影响
      - 尽调路径
    rows:
      - - 债务和优先权结构
        - 债务规模、贷款人条款、优先权顺位、清算瀑布。
        - 决定标题 2.4B 标记是可投资的普通股权，还是主要是优先资本。
        - 如果资本结构比担心的更干净，这是单一最大的上调杠杆；如果偏重，则大幅下调。
        - 要求股权结构表、债务明细、融资文件和瀑布模型。
      - - 留存质量
        - 按客户规模和渠道拆分的 NRR、GRR、流失和续约队列。
        - 如果没有大客户干净续约的证明，公开 ARR 规模还不够。
        - 留存强则上调；如果信任债反映在扩张或流失中，则下调。
        - 要求客户队列文件和续约桥。
      - - 利润率结构
        - 毛利率、支持负担、云成本强度和自由现金流。
        - 需要判断 LogicMonitor 应得 Dynatrace 类区间还是 Elastic 类区间。
        - 如果利润率显示真实软件杠杆则上调；如果服务 / 云负担沉重则下调。
        - 要求经审计损益表明细和收入成本桥。
      - - Edwin AI 经济性
        - 附加购买率、AI ARR、队列留存、相对非 AI 队列的扩张。
        - 把真实变现和营销叙事分开。
        - 如果 AI 改善净留存和 ACV 扩张，则上调；否则不给溢价。
        - 要求 AI 产品队列分析和定价落地情况。
      - - Catchpoint 协同
        - 收购后的交叉销售转化、胜率影响和平台采用证据。
        - 上行情景假设 Catchpoint 扩大钱包份额和护城河。
        - 如果交叉销售真实则上调；如果整合增加成本却没有提高留存，则下调。
        - 要求产品线扩张看板和销售赢 / 输分析。
      - - 安全 / 可靠性补救
        - 2023 年后的控制变更、事件直方图、客户沟通和续约冲击。
        - 信任债是倍数可能压缩的最清晰非财务理由。
        - 如果补救扎实且客户留下，则上调；如果事件仍影响续约，则下调。
        - 要求安全补救时间线、事件摘要和受影响账户留存复盘。
    notes: 这些要求聚焦于恰好需要的私有资料，用来判断一个看似合理的公开标记，到底是可以买入的入口，还是应避开的股权结构陷阱。
    claimRefs:
      - CV043
      - CV044
      - CV046
      - CV053
      - CV054
      - CV055
