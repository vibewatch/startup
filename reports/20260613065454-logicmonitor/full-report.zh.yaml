      - number: '5.4'
        title: 信任、合规与产品风险
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor 的企业信任表面强于它的历史安全声誉，但并不完全干净。当前文档称门户流量以 TLS 1.2+ 加密，机密客户数据存储前加密，API tokens 应绑定到仅 API 用户，基于 SAML
              的 SSO 可与任何 SAML 2.0 IdP 配合。公司还记录了定期渗透测试、ISO 27000 系列认证、SOC 2 Type 2 合规、可搜索审计日志，以及面向获批政府用户的 FedRAMP
              Moderate 环境。状态页进一步显示，公司按地区和组件进行成熟运营分段，并明确披露 2026 年 4 月一次 rolling update 可能短暂影响门户访问，但不影响采集或告警评估。 [CE049]
              [CE050] [CE051] [CE052] [CE053] [CE054] [CE055] [CE056] [CE057]


              主要产品风险是实施摩擦、合规边界和信任债。FedRAMP 支持真实存在，但其文档范围排除了 Edwin AI、tracing、synthetics、非美国网站地区和其他若干功能，因此旗舰 AI
              故事无法干净地带入受监管环境。独立评论还提到陡峭学习曲线、误报，以及常常需要大量厂商支持的上手导入，这意味着产品表面宽度可能转化为真实部署复杂度。最后，2023 年客户安全事件仍然相关，因为 TechCrunch
              和 SC World 将部分被攻破路径与弱默认密码和本地部署 Collector 暴露联系起来。这不能证明当前平台存在缺陷，但提高了围绕身份控制、Collector 加固和客户变更管理纪律的尽调门槛。
