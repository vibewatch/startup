      - number: '3.2'
        title: 能力深度与定价姿态
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor 的商业故事比许多同业更清楚，因为它公开了套餐层级、混合单元概念和门户里的用量拆分。这与 Datadog 按 host、container、APM、log 和 RUM 计量的模式，以及
              ServiceNow 以报价驱动的企业销售动作，都有实质差异。Dynatrace、Grafana 和 SolarWinds 也公开标价锚点，但价值叙事不同：Dynatrace 主打深度 full-stack
              和自主运维，Grafana 主打开放性和低入门价，SolarWinds 主打更低成本的混合基础设施覆盖。 [CP002] [CP003] [CP007] [CP009] [CP011] [CP012]
              [CP021] [CP029] [CP042]


              产品宽度上，本轮抓取材料中 Datadog 和 Dynatrace 在应用和开发者侧深度最强；Splunk 和 Elastic 强调关联遥测加 AI 驱动调查；ServiceNow 强调把信号转成 ITSM
              原生工作流。LogicMonitor 的差异化不在于拥有最深的代码级遥测工作流，而在于用更简单的运营模型，打包混合基础设施、多租户 MSP 运营和工作流集成。当买方想要一个覆盖混合资产的平台，又不想继承
              Datadog 式计费复杂度或纯自建负担时，这个定位最强。 [CP001] [CP005] [CP006] [CP014] [CP018] [CP019] [CP024] [CP026] [CP028]
