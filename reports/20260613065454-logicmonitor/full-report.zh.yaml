  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - AI 工作负载和可靠性要求
        - 需求驱动（+）
        - 2026-2030
        - AI 基础设施增长之后，企业更需要全天候监控、根因上下文和可控自动化
        - 询问管理层：多少销售管线明确来自 AI 或 GPU 密集型工作负载
      - - 混合云和多云复杂度
        - 需求驱动（+）
        - 持续
        - 本地部署加云资产让混合可观测性仍有价值；买方尚未全面云化
        - 拆分混合部署重度账户与云原生账户的赢单率
      - - 工具整合和集中式可观测性
        - 需求驱动（+）
        - 2026-2028
        - 买方想减少工具数量、看清 ROI，宽平台相较窄点产品更受益
        - 量化 LogicMonitor 赢下的替换交易更多，还是新建交易更多
      - - OpenTelemetry 和开放标准
        - 需求驱动（+）
        - 2026-2029
        - 开放标准降低埋点锁定效应，竞争焦点转向分析、工作流和治理
        - 要求提供证据，证明开放标准数据流能提升转化或扩张
      - - 遥测和云成本不透明
        - 采用约束（-）
        - 当前
        - 意外的可观测性成本和上升的 AI 支出，迫使厂商更严密地证明 ROI 和留存经济性
        - 要求按工作负载提供定价架构、摄取经济性和毛利率敏感性
      - - 部署摩擦和工具蔓延
        - 采用约束（-）
        - 当前
        - 多工具资产带来痛点，利好品类，但也拖慢迁移，并拉长价值证明周期
        - 按队列衡量平均价值实现时间和实施服务负担
      - - 对自主动作的信任
        - 采用约束（-）
        - 2026-2028 年更突出
        - 买方想要 AI 辅助，但高风险动作仍需人工批准，近期自动化附加率因此受限
        - 询问有多少客户启用需审批的修复，而不是只读指导
      - - 治理和安全监督
        - 采用约束（-）
        - 当前
        - CCOE、FinOps 和 AI 治理团队会更严格审查工具扩张，并可能把预算转向平台理顺
        - 确认近期七位数交易中由哪位高管负责人签预算
    notes: 同一事实既可能提高品类重要性，也可能拉长销售周期。本表把需求创造和转化摩擦拆开看。
