      - number: '1.3'
        title: 资本结构、所有权与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor 最近披露的融资事件，是 2024 年 11 月 20 日宣布获得 $800M 投资，包括来自 PSG、Golub Capital 和其他投资者的新股与战略融资，同时 Vista
              仍为控股股东。围绕该交易的多个来源把名义估值放在约 $2.4B，且包含债务。TechCrunch 称，该轮使累计融资达到约
              $942M。名义估值包含债务，且融资契约未披露，这两点都很重要：公司显然有规模，也能获得赞助方支持，但名义 价值不应被解读为干净的普通股估值标记。 [CO016] [CO017] [CO018] [CO019]
              [CO020]


              2024 年交易也说明了谁在经济上重要。Vista 是控股方，PSG 是自 2016 年起长期持有的少数股东，Golub Capital 更像重要贷款方 /
              战略融资参与者，而不是传统软件成长股权赞助方。运营上，其他关键利益相关方是企业客户基础、MSP 与渠道生态，以及正在把 AI 定位转化为订单收入的管理团队。这个组合让 LogicMonitor
              比许多基础设施软件同业更少依赖单一产品或地区，但权力也集中在财务赞助方和管理层手中，而不是任何可见的公开市场约束。 [CO005] [CO016] [CO017] [CO018] [CO019] [CO038]
              [CO039]


              公司似乎在把 AI 层变现，而不只是讲 AI 故事。ARR 从 2025 年 11 月的超过 $300M，升至 2026 年 5 月的超过 $400M；Edwin AI 贡献了总订单额的大约三分之一，并同比增长约
              200%。这有力说明 LogicMonitor 的 AI 叙事不只是愿景，尽管公司仍未公开披露经审计收入、利润率或债务服务条款。 [CO025] [CO026] [CO027]
