  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 经常性收入架构、定价与分销
        blocks:
          - type: paragraph
            body: >-
              从公开信息看，LogicMonitor 的商业模型像一家企业订阅公司：有明确标价，也有谈判后的实际价格，并且存在多条分销路径。公司现在公开三个核心套餐，分别为每混合单元 $16、$27 和
              $53；这套混合单元替代了较早的按产品授权方式，可在本地部署、云和边缘工作负载之间转移。这有助于买方做预算，但不能完全解决收入可见性：LogicMonitor 明确说折扣可能可得，Essentials 上限为
              999 units，大型买方仍必须通过客户团队，而不是自助结账。因此，公开定价建立的是标价 锚点，不是已实现净收入的干净代理。


              周边 GTM 证据强化了企业销售动作。LogicMonitor 称 2024 年初服务约 2,400 家客户；一份 2026 年 profile 则提到近 2,900 家客户和约 95%
              retention。套餐也适用于 MSP，AWS Marketplace 提供官方采购路径；合作伙伴计划称渠道触达超过 80% 全球业务，并配有分层激励、deal registration
              和共同销售支持。放在一起看，这些信号指向一台建立在直销加合作伙伴辅助分销上的收入机器，而不是低摩擦自助转化。
