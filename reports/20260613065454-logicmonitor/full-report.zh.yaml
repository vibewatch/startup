      - number: '7.2'
        title: 安全、监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              公开记录中最重要的不利事实仍是 2023 年安全事件。TechCrunch 报道称，少数客户受到影响，薄弱默认密码是失败路径的一部分，至少一家受影响公司认为入侵可能导致被监控系统遭遇勒索软件；SC World
              另行转述说法称，客户账户被攻破后，勒索软件通过本地 collector 传感器分发。即使最严重的利用细节来自匿名来源，而不是监管机构或法院文件，该事件仍重要，因为它改变了证明责任：LogicMonitor
              现在必须证明，其当前控制和客户指引足够强，能够防止监控平面变成特权攻击面。[CR001] [CR002] [CR003] [CR004] [CR009]


              当前控制比历史事件路径记录得更充分。LogicMonitor 的安全和支持文档称，collector 使用出站 TLS、双向认证，将敏感数据保存在内存中，并应以最小权限运行；公司建议使用 SSO、全员
              2FA、面向 token 的仅 API 用户、谨慎分配 manage 权限，以及 IP allow list。这些缓释措施合理，但同一份最佳实践指南明确承认，拥有 LogicModules 和
              Collectors 管理权限的用户可以在 collector 上运行任意脚本，也就是说，平台安全结果仍高度依赖客户在身份、角色和主机加固上的纪律。[CR005] [CR006] [CR007] [CR008]
              [CR033]


              监管姿态有利有弊。FedRAMP Moderate 授权和可复用安全包是真正的正面因素，但 FedRAMP 环境只开放给获批客户，不能与商业租户共享账户或数据，并排除 Edwin
              AI、tracing、synthetics、本地用户管理和其他商业功能。这形成了双轨运营模型：监管可信度很强，但旗舰产品叙事无法干净迁移到合规最敏感的部署边界。公开法律风险更不清晰。已审阅公开来源界定了隐私、处理方、出口管制和合同责任分配义务，但没有提供足够案件层面的案卷证据或
              trust center 文档细节，无法在缺少定向法律扫描和资料室访问的情况下承销诉讼、IP 或供应商风险敞口。[CR010] [CR011] [CR012] [CR013] [CR015] [CR043]
