        - 需要自动化和全栈深度的大型企业
        - 因果 / 智能体 AI 叙事强，并支持全栈和 OTLP
        - 高端企业销售动作和更丰富功能栈，可能意味着更重采购复杂度
      - - New Relic
        - 直接同业
        - $6.5B 收购后私有化；宽平台并支持 OTel
        - 希望使用透明用量定价的工程主导团队
        - 统一平台，100GB 免费入口，遥测摄取范围广
        - 私有化后公开运营披露减少，限制外部基准比较
      - - Splunk Observability / Cisco
        - 直接同业 + 既有厂商捆绑
        - 2024 年 3 月起由 Cisco 拥有
        - 拥有网络、安全和可观测性预算的大型企业
        - 业务上下文框架、AI SRE 智能体，以及更广的 Cisco 账户撬动
        - 部分交易中，捆绑优势可能压过单品比较
      - - Elastic
        - 直接同业 / 邻近
        - 按用量计费的 Elastic Cloud 和 450+ 集成
        - 优先看重日志、搜索经济性和 OTel 原生开放性的团队
        - OpenTelemetry 优先、Prometheus 原生，以及成本效率信息
        - 厂商自述的成本主张需要在一线客户处验证
      - - ServiceNow ITOM
        - 邻近既有厂商
        - 企业工作流既有厂商，控制 ITSM / 服务图谱
        - CIO、ITSM 和服务运营买方
        - 工作流原生修复、服务映射和统一运营平台
        - 报价驱动定价，且最深独立遥测广度的直接证据更少
      - - SolarWinds Observability Self-Hosted
        - 窄口径直接替代
        - 标价锚点从每节点每月 $8 起
        - 混合基础设施和网络重度运营团队
        - 成本更低的一体化混合可观测性定位
        - SEC 网络安全行动带来的监管阴影削弱信任姿态
      - - Auvik
        - 细分替代
        - 80,000+ IT 专业人士和 MSP；支持 700+ 设备厂商
        - MSP 和网络运营团队
        - 快速部署、拓扑映射、不限站点和网络
        - 以网络为中心，范围窄于全栈可观测性平台
      - - Grafana + Prometheus + OpenTelemetry 自建
        - 现状 / 自建替代
        - 开源栈，免费或低成本入口
        - 愿意自己运营技术栈的工程主导团队
        - 开放性强，硬锁定更低
        - 运营负担和组装复杂度仍由买方承担
    notes: 本表区分直接可观测性竞争对手、邻近既有厂商和替代方案。「公开规模 / 所有权信号」刻意只使用本轮抓取的证据，不引入未说明的市场份额假设。
