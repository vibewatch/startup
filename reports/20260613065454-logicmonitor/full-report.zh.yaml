  - id: TM005
    title: 规模测算矛盾与尽调缺口表
    columns:
      - 问题
      - 当前证据
      - 未解决原因
      - 含义
      - 下一步尽调
    rows:
      - - 可观测性与 AIOps 边界不一致
        - 核心可观测性估计为 $3.35-4.35B，而 AIOps 为 $11.08-19.33B
        - 分析师打包的能力、服务和自动化层不同
        - 单一 TAM 叙事可能把可触达收入高估或低估数倍
        - 获取完整方法论，并从第一性原理重建品类桥接
      - - 大型企业份额和混合部署份额分别披露
        - Mordor 提供买方规模和部署份额，但没有 LogicMonitor 需要的交叉表
        - 公开摘要没有展示企业规模、部署结构和垂直行业之间的重叠
        - 公开 SAM 只能估算，无法直接观察
        - 向管理层索取按 ACV、部署模式和垂直行业拆分的分市场结构
      - - LogicMonitor 收入和队列结构未披露
        - 公开页面展示能力和调研数据，但没有按企业、MSP 或产品模块拆分收入
        - 私营公司披露没有给到分市场经济性
        - 仅凭公开证据无法推导精确份额、渗透率和 SOM
        - 尽调中要求提供按买方队列、模块附加和地域拆分的 ARR
      - - 迁移经济性仍不透明
        - 调研显示工具蔓延和切换意愿，但没有按厂商给出实际替换周期回本
        - 公开调研停留在意向和痛点层面
        - 投资人还无法判断，整合需求帮助 LogicMonitor 的速度是否快过帮助更宽平台的既有厂商
        - 用客户访谈和实施案例研究映射回本周期
      - - 付费墙后的分析师表格限制可比性检查
        - 公开页面披露标题性结论，但不披露样本设计、分市场细节或纳入厂商名单
        - 最有决策价值的数据仍在付费墙或私有分析师访问权限之后
        - 估值级市场规模测算的信心仍为中到低
        - 最终承销 TAM 前，购买点名报告或直接访谈分析师
    notes: 本展项保留了公开证据在何处不再足够公司特定，无法支撑可投资的市场份额数学。
