  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户组合与可见购买细分
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor 的公开客户证据显示，客户基础主要落在中端市场和企业 IT 团队，以及托管服务提供商，而不是自助式 SMB 买家。其合作伙伴计划明确区分 VAR、MSP
              和战略技术伙伴；客户与案例页面则展示了教育、媒体、医疗基础设施、金融服务、制造、数字原生 CPG 和 MSP
              运营中的混合可观测性场景。这个信号重要，因为它说明产品通常卖给运营复杂度已经很高、监控割裂代价很大的组织。实际采购方通常是基础设施、NOC、平台或托管服务负责人；最终用户是运维工程师或分析师；内部经济买方往往是
              IT 或运营预算负责人，而不是单个开发者。[CU001] [CU002] [CU003] [CU004]


              公开广度看得见，但需要谨慎解读。客户页面称 LogicMonitor 在全球服务超过 2,000 家客户；案例库在本次运行日期展示了 94 个故事；Landbase 的第三方安装数据样本列出 408
              家已验证公司，其中包括 Samsung、Engie、NTT Data Group、Walgreens Boots Alliance、Roche、Capgemini
              等大型全球企业。这些信号合起来说明市场存在感很广，但三者不能互相替代。公司披露的客户数是营销快照，案例数是筛选后的证明库，第三方 408
