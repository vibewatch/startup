  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与入场纪律
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor 已经越过门槛，估值应按规模化软件平台来判断，而不是按早期产品押注来判断。公司称 ARR 已超过 400 million USD，Edwin AI 目前贡献三分之一
              bookings；Catchpoint 收购，以及 AWS 和 Deutsche Telekom 伙伴关系，让故事不再只是简单的基础设施监控。这些是真正的正面因素。但投资人能实际锚定的公开标记，仍是 2024 年
              11 月约 2.4 billion USD、含债务的融资；同一份公开记录仍留下债务规模、清算优先栈、NRR、毛利率和自由现金流等实质盲点。


              这一组合导向谨慎投资姿态。按 headline 口径，上一轮标记相对于当前 >400 million USD 披露 ARR，隐含约 6.0x ARR。即便仍远低于 Datadog 的高溢价倍数，与
              Dynatrace、Elastic、PagerDuty 等风险更低的上市可比公司相比，这也不明显便宜。因此，公开证据支持的是估值公允、但不明显有吸引力的立场。正确姿态是 TRACK / RESEARCH
              MORE，中等信心、高风险评级：只有在私下尽调证明资本结构干净、留存耐久、Edwin/Catchpoint 扩张真实，而不只是叙事变宽时，才值得付更高价格。
