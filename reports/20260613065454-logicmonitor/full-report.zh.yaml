      - number: '8.4'
        title: 退出准备度、下行触发器与倍数何时应压缩
        blocks:
          - type: paragraph
            body: >-
              公开记录不支持近期 IPO 承销案例。LogicMonitor 规模已经足够重要，但它仍是私有、受 sponsor 控制的公司，并且在公开投资人会首先要求的指标上不透明：债务、cap table
              优先级、留存质量、毛利率和现金转化。这使得二级交易、延续基金、sponsor-to-sponsor 出售或战略交易，比近期完整营销的公开退出更可信。New Relic 和 Splunk
              证明战略和财务买家会为可观测性资产支付有意义价格，但这些参照应被视为天花板信号，而不是直接模板。


              更重要的问题是，什么会在任何退出前迫使估值下调。公开证据已经显示三类 thesis-break。第一，另一起安全事件，或证明 collector
              仍是特权攻击路径，会放大信任折价。第二，中断节奏恶化，或工作时间门户出现实质中断，会削弱一家监控供应商的可靠性叙事。第三，如果 Catchpoint 和 Edwin AI
              扩大了产品故事，却没有抬升扩张经济性，投资人会越来越把收购和 AI 栈视为复杂度，而不是溢价驱动因素。即便 ARR 仍在增长，任何这些信号都足以支撑更低倍数。
