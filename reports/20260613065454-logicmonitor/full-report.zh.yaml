  - id: TR005
    title: 缓释与放弃条件表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 安全信任复发
        - 影响客户的安全事件、凭证控制失败，或 collector 滥用途径
        - 任何再次发生、由 LogicMonitor 源头引发并造成客户受损的安全 / 控制失败
        - 暂停信心；在承销上行前，要求根因证明、默认设置审计和客户补救证据
      - - 可用性 / 变更管理恶化
        - Account Access 或门户事故变得更频繁或更持久
        - 一个季度内出现两次或更多重大可见事故，或变更窗口反复影响工作时段访问
        - 下调扩张假设，把可靠性视为流失驱动，而不是单纯支持问题
      - - FedRAMP / 合规拆分扩大
        - 高价值联邦或受监管用例依赖仍在范围外的功能
        - 旗舰工作流仍留在政府边界之外，且路线图没有闭环
        - 降低对受监管市场上行的信心，并在测算垂直扩张前要求产品边界路线图
      - - Catchpoint 整合低于预期
        - 联合平台没有展示可衡量的告警噪音下降、更快 RCA 或附加率证据
        - 交易完成后 12 个月内没有清晰采用 / 结果证明
        - 把收购视为复杂度成本，而不是护城河扩张；降低可接受估值倍数
      - - 实施和定价摩擦叠加
        - 评价和客户指标显示告警噪音、仪表盘摩擦或定价反弹持续存在
        - 大型环境中出现部署放慢、续约走弱或定价驱动异议的证据
        - 在承认经营杠杆前，收紧留存假设，并要求队列 / 续约证明
    notes: 这些放弃条件是面向投资者的阈值，不是产品 SLO。它们用于在风险证据恶化快于管理层叙事改善时，强制做决定。
