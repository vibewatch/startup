      - number: '3.3'
        title: 切换成本、分销能力与多栖使用
        blocks:
          - type: paragraph
            body: >-
              抓取证据不支持“可观测性厂商仍靠专有仪表化控制客户”的说法。OpenTelemetry 明确承诺“instrument once”的可移植性，厂商 registry 显示本章几乎所有主要平台都消费
              OTLP，Prometheus 仍是可信的开源指标基线。实践中，这意味着品类内遥测可移植性正在改善，硬锁定弱于早期监控世代。买家可以多栖使用，也可以随时间迁移，而不必从零重新仪表化每个应用。 [CP033]
              [CP034] [CP035] [CP039]


              因此，竞争耐久性转向工作流嵌入和市场路径。LogicMonitor 的 MSP 页面、多租户声明，以及与 PSA 和企业系统的打包集成很重要，因为它们把产品嵌入持续服务交付。ServiceNow 的 ITSM
              链接从相反方向提供同样逻辑：一旦可观测性连进记录系统里的服务地图、工作流和自主修复，替换就不只是技术问题，也会变成政治和流程重负。Cisco-Splunk
              通过更广的企业账户控制带来类似捆绑风险。LogicMonitor 仍能赢，但可持续优势来自运营适配和合作伙伴杠杆，而不是独一无二的遥测协议。 [CP005] [CP006] [CP020] [CP027]
