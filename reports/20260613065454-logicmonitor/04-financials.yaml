callouts:
- calloutType: recommendation
  title: Underwrite as a scaled recurring platform, not a fully transparent SaaS comp
  body: Public evidence is strong enough to support real ARR scale and enterprise traction, but not strong enough to treat LogicMonitor like a fully disclosed public SaaS name on margin, cash, or payback.
  claimRefs:
  - CI019
  - CI021
  - CI044
  - CI045
  - CI054
- calloutType: risk
  title: Headline financing size overstates what public sources prove about liquidity
  body: The 2024 headline round is large, but the mix of equity, strategic financing, and debt leaves cash-on-balance-sheet and true runway unresolved in public sources.
  claimRefs:
  - CI012
  - CI013
  - CI047
  - CI054
- calloutType: risk
  title: Security history matters more in a renewal-heavy enterprise model
  body: If large accounts drive most ARR, even a limited security incident can matter financially because renewal friction and reputation damage concentrate in a smaller number of high-value customers.
