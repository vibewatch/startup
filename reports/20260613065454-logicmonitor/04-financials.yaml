- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR scale
    - '>400M by May 2026; >300M independently reported'
    - medium
    - Establishes that LogicMonitor is already a scaled observability vendor rather than an early-stage tool
    - Provide monthly ARR bridge from 2024 through run date with net new, expansion, contraction, and churn
  - - Large-account concentration
    - 80% of ARR from customers above 100k ARR
    - medium
    - Shows enterprise skew and renewal dependence, which usually supports better revenue quality if retention stays high
    - Disclose number of >100k and >1M ARR accounts, cohort growth, and concentration of top 20 accounts
  - - Retention
    - ~95% retention publicly cited
    - medium
    - Retention is a core proof point for recurring quality and payback durability
    - Provide gross retention, NRR, and logo churn by segment and channel
  - - Implied ARR per disclosed customer
    - Roughly 103k to 167k average ARR per disclosed customer across the public window
    - estimated
    - A useful sanity check for enterprise account size and packaging depth
    - Provide actual ARPA / ACV by package and by direct vs partner-sourced customer
  - - Gross margin
    - null
    - low
    - Margin decides whether the model behaves like efficient software or service-heavy observability operations
    - Disclose subscription gross margin, blended gross margin, hosting cost, and support cost as percent of revenue
  - - CAC / payback
    - null
    - low
    - Without CAC and payback, investors cannot judge whether partner and AI expansion improve efficiency or just add selling cost
    - Provide sales efficiency, CAC payback, S&M as percent of ARR, and partner-incentive burden
  - - Free cash flow / operating leverage
    - Not public for LogicMonitor; peers show strong FCF once scaled
    - low
    - Peer evidence suggests observability can throw off cash, but LogicMonitor has not published whether it has crossed that threshold
    - Provide operating cash flow, free cash flow, capex, and capitalized software policy
  notes: Nulls are deliberate where public evidence is missing. Non-null rows mix official disclosures and estimated proxies, so they should be treated as directional rather than a management-quality operating model.
