chapter:
  number: 4
  title: Financials
  summary: LogicMonitor’s public financial evidence points to a scaled, enterprise-skewed recurring-revenue business with transparent list pricing, deep partner leverage, and accelerating AI upsell, but without the cash, burn, or margin disclosure needed for full underwriting. Official and independent sources support ARR above $400 million by May 2026, 80% ARR concentration in $100k+ accounts, and a 2024 $800 million financing at a $2.4 billion valuation including debt, while realized pricing, gross margin, NRR, and runway remain undisclosed.
sections:
- id: recurring-revenue-pricing-and-distribution
  title: Recurring revenue architecture, pricing, and distribution
  body: |-
    LogicMonitor’s public commercial model looks like an enterprise subscription business with explicit list pricing, negotiated realization, and multiple distribution routes. The company now publishes three core packages at $16, $27, and $53 per hybrid unit, replacing older product-by-product licensing with a hybrid unit that can be shifted across on-prem, cloud, and edge workloads. That helps buyers budget, but it does not fully solve revenue visibility: LogicMonitor openly says discounts may be available, Essentials is capped at 999 units, and larger buyers must still work through account teams rather than self-serve checkout. Public pricing therefore establishes a list-price anchor, not a clean proxy for realized net revenue.

    The surrounding GTM evidence reinforces an enterprise motion. LogicMonitor said it served about 2,400 customers in early 2024, while a 2026 profile cited nearly 2,900 customers and roughly 95% retention. Packages also apply to MSPs, AWS Marketplace provides an official procurement route, and the partner program says the channel touches over 80% of global business with tiered incentives, deal registration, and co-selling support. Together, those signals point to a revenue engine built on direct sales plus partner-assisted distribution, not on low-friction self-serve conversion.
