- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - 2024 financing size
    - 800M of new equity and strategic financing
    - high
    - This is the main recent capital event and the best public signal that investors still support expansion
    - Break the transaction into primary equity, debt, and any secondary or structured components
  - - 2024 valuation anchor
    - ~2.4B including debt
    - high
    - Provides a live sponsor-backed valuation reference for underwriting multiple discipline
    - Provide exact post-money structure, seniority, and dilution terms
  - - Control
    - Vista remained controlling shareholder after the raise
    - high
    - Control concentration shapes governance, follow-on financing behavior, and exit options
    - Provide board rights, consent thresholds, and sponsor ownership after the round
  - - Use of funds
    - AI product investment, M&A, and expansion into new markets and industries
    - medium
    - Explains why the raise may be growth capital rather than purely balance-sheet repair
    - Quantify proceeds allocated to product, M&A, sales, regional buildout, and debt service
  - - Cash on hand / burn / runway
    - null
    - low
    - These are the core variables for capital adequacy and next-round timing
    - Provide cash balance, monthly burn, downside runway, and covenant headroom
  - - Debt / strategic financing obligations
    - Strategic financing and debt referenced, but size and terms undisclosed
    - medium
    - Debt can distort the meaning of the headline round and tighten flexibility
    - Provide lender list, debt quantum, maturity schedule, covenants, and security package
  - - Next-round trigger
    - Not publicly disclosed
    - low
    - Without a financing trigger, investors cannot tell whether 2024 solved liquidity or merely extended it
    - Provide internal plan tied to ARR, FCF, or leverage thresholds for the next financing decision
  notes: This table intentionally focuses on forward adequacy rather than repeating older funding chronology. The unresolved issue is not whether LogicMonitor can raise money, but how much clean liquidity and debt capacity remained after the 2024 transaction.
