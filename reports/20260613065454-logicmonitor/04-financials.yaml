- id: revenue-quality-and-unit-economics-proxies
  title: Revenue quality, unit-economics proxies, and what public comps imply
  body: |-
    The strongest public revenue-quality signals are recurring scale, large-account concentration, and cross-sell momentum, not disclosed margins. By May 2026, LogicMonitor said ARR had surpassed $400 million, Edwin AI contributed one-third of bookings, and Edwin AI recurring revenue was growing about 200% year over year. Independent coverage also reported ARR above $300 million, with customers above $100,000 of ARR representing 80% of the base and growing more than 25% year over year. Combined with roughly 95% retention and a customer base near 2,900, the available record supports the view that LogicMonitor is already a sizable enterprise recurring-revenue platform rather than a niche infrastructure tool.

    What is missing is the standard SaaS underwriting set: gross margin, NRR, CAC, payback, and free cash flow. To frame that absence, public comps are still useful. Datadog and Dynatrace show that scaled observability vendors can produce strong free cash flow and large-account density, but they still spend heavily on sales and marketing and remain exposed to cloud-infrastructure costs. ServiceNow’s filing likewise shows that large enterprise software motions blend direct sales with MSP, resale, and services layers. The implication is not that LogicMonitor matches those economics, only that enterprise observability is attractive when renewal, upsell, and delivery efficiency offset an expensive sales-and-support model. Public evidence does not yet prove that offset for LogicMonitor.
