- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Current public status
  - Exact diligence path
  rows:
  - - Gross margin and hosting-cost stack
    - Without it, investors cannot tell whether AI and observability scale efficiently after cloud and support costs
    - Not publicly disclosed
    - Request subscription gross margin, blended gross margin, third-party cloud cost, and support cost by quarter
  - - Net revenue retention and gross retention by cohort
    - Blocks confidence on renewal quality inside the large-account base
    - Only approximate retention is public; no NRR disclosed
    - Request NRR, gross retention, expansion ARR, and churn by direct vs partner channels
  - - Cash, burn, and runway
    - Makes capital-adequacy and next-round timing unknowable
    - No public cash or burn data in the fetched set
    - Request monthly cash bridge, current cash, burn history, runway, and covenant model
  - - Debt quantum and financing terms
    - Prevents clean reading of 2024 financing quality and dilution risk
    - Strategic financing and debt mentioned, but not broken out
    - Request debt schedule, lender terms, maturity, and any preferred or structured components
  - - Realized net pricing after discounts and marketplace fees
    - List pricing exists, but realized unit economics cannot be modeled
    - Only list price and account-team negotiation are public
    - Request realized ASP by package, discount waterfall, partner rebate load, and marketplace fee burden
  - - CAC, payback, and channel-margin economics
    - Without it, channel-heavy growth could look better than it really is
    - No public CAC or partner-margin disclosure
    - Request S&M efficiency by route, partner-sourced CAC, payback, and services attach margins
  notes: Each row names a concrete diligence artifact because the chapter’s open issues are not abstract. They are exactly the missing management metrics that separate headline momentum from underwritten financial quality.
