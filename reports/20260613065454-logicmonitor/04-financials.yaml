tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Core hybrid observability subscription
    - Recurring platform subscription sold in packaged tiers across monitored resources
    - Hybrid unit / annual contract
    - Live list pricing published; enterprise-scale installed base disclosed
    - High if renewals stay strong; still subject to negotiated discounts and enterprise concentration
    - Provide ARR split by package, average contract term, and gross retention by cohort
  - - Edwin AI upsell
    - AI operating layer and automation attached to platform bookings and renewal base
    - Booking mix / recurring AI revenue
    - One-third of bookings and about 200% YoY recurring growth disclosed by May 2026
    - Potentially high because it deepens workflow lock-in, but attach-rate economics are not public
    - Break out Edwin AI attach rate, AI ARR, and net retention versus non-AI cohorts
  - - MSP and reseller channel
    - Partners resell or operate the platform for downstream customers
    - Channel subscription / managed account
    - Packages explicitly available to MSPs; partner ecosystem touches over 80% of global business
    - Medium to high if channel CAC is efficient; channel margin economics are undisclosed
    - Disclose partner share of new ARR, average discount, and churn by channel
  - - Cloud marketplace procurement
    - Customer buys through hyperscaler marketplace rather than direct paper
    - Marketplace contract / committed cloud spend
    - AWS route is official and Google Cloud availability has been publicly reported
    - Medium; can reduce procurement friction, but marketplace fee burden is not public
    - Provide marketplace ARR, net take rate after fees, and win-rate effect versus direct deals
  - - Cross-sell from Catchpoint and adjacent products
    - Internet performance and digital experience products expand wallet share beyond core infra monitoring
    - Module add-on / expansion ARR
    - Catchpoint acquisition broadened coverage; multi-product adoption already significant in 2024 disclosure
    - Medium to high if add-ons deepen platform breadth, but separate revenue disclosure is absent
    - Show expansion ARR by product family and attach rate on large enterprise accounts
  - - Partner- and GSI-enabled enterprise programs
    - GSIs and channel partners embed LogicMonitor into broader service delivery
    - Project-backed subscription / managed transformation program
    - Global partners, GSIs, and regional leadership hires all point to scaled indirect coverage
    - Medium; can widen reach, but services dependency could dilute software-like economics
    - Quantify partner-sourced pipeline, partner-sourced closed ARR, and services attach ratio
  notes: Rows distinguish direct subscription, AI upsell, channel, marketplace, and product-expansion revenue paths. Public data supports the existence of each stream but not the exact revenue mix or realized net pricing.
