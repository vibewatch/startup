  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, liquidity bridge, and downside runway model.
    whyItMatters: Capital adequacy cannot be underwritten without knowing whether the 2024 financing solved liquidity or only extended the timeline to another raise.
    diligencePath: Request monthly cash bridge from the CFO, board-approved operating plan, covenant package, and base/downside runway scenario.
    relatedQuestionRefs:
    - QI020
    - QI023
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: Debt quantum, lender list, maturity profile, covenants, and any preferred or structured financing terms from the 2024 transaction.
    whyItMatters: Strategic financing and debt change the meaning of the headline round, affect dilution risk, and can constrain future flexibility.
    diligencePath: Obtain debt agreements, cap-table summary, closing sources-and-uses memo, and any intercreditor or investor-rights terms.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-nrr
    missingEvidence: Subscription gross margin, blended gross margin, NRR, CAC, payback, and partner incentive burden.
    whyItMatters: The core investment question is whether LogicMonitor’s recurring growth converts into attractive unit economics after cloud, support, and channel costs.
    diligencePath: Request SaaS KPI pack with gross margin, NRR, CAC payback, S&M efficiency, and direct versus partner-sourced economics.
    relatedQuestionRefs:
    - QI017
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Discount waterfall, renewal uplift, average selling price by package, and marketplace fee impact.
    whyItMatters: List pricing exists, but investors still cannot convert published package prices into realized revenue quality or margin.
    diligencePath: Request billing extracts, pricing policy, discount authority matrix, and partner rebate schedules by route to market.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI002
    - TI005
  - type: missing-source
    severity: minor
    topic: 2024-proceeds-allocation
    missingEvidence: Detailed sources-and-uses breakdown for the 2024 financing, including primary cash retained versus any secondary, fees, debt paydown, or acquisition reserve.
    whyItMatters: It would sharpen the difference between growth capital, balance-sheet support, and sponsor-structure effects in the headline round.
    diligencePath: Request transaction memo, capitalization table before and after close, and management budget for product, M&A, and regional expansion use of proceeds.
    relatedQuestionRefs:
    - QI015
    relatedTableRefs:
    - TI004
