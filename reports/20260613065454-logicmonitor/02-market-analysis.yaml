- id: TM005
  title: Sizing contradiction and diligence gap table
  columns:
  - Issue
  - Current evidence
  - Why unresolved
  - Implication
  - Next diligence step
  rows:
  - - Observability vs. AIOps boundary mismatch
    - Core observability estimates are $3.35-4.35B, while AIOps is $11.08-19.33B
    - Analysts bundle different capabilities, services, and automation layers
    - Single-number TAM narratives can overstate or understate reachable revenue by multiples
    - Obtain full methodologies and rebuild category bridges from first principles
  - - Large-enterprise and hybrid shares are published separately
    - Mordor provides buyer-size and deployment shares, but not the cross-tab LogicMonitor needs
    - Public summary does not show the overlap between enterprise size, deployment mix, and vertical
    - Public SAM must be estimated rather than observed
    - Ask management for segment mix by ACV, deployment pattern, and vertical
  - - LogicMonitor revenue and cohort mix are undisclosed
    - Public pages show capability and survey data but not revenue by enterprise, MSP, or product module
    - Private-company disclosure stops short of segment economics
    - Precise share, penetration, and SOM cannot be derived from public evidence alone
    - Request ARR by buyer cohort, module attach, and geography in diligence
  - - Migration economics remain opaque
    - Surveys show tool sprawl and switching interest, but not actual replacement-cycle payback by vendor
    - Public surveys stop at intent and pain points
    - Investors cannot yet tell whether consolidation demand helps LogicMonitor faster than it helps broader incumbents
    - Use customer interviews and implementation case studies to map payback periods
  - - Paywalled analyst tables limit comparability checks
    - Public pages expose headlines but not sample design, segmentation detail, or vendor inclusion lists
    - The most decision-useful data are still behind paywalls or private analyst access
    - Confidence in valuation-grade market sizing stays medium-to-low
    - Purchase the named reports or interview analysts directly before final TAM underwriting
  notes: This exhibit preserves where public evidence stops being company-specific enough for investable market-share math.
