  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-methodology
    missingEvidence: Underlying methodologies and scope definitions for the public observability and AIOps estimates used here.
    whyItMatters: Without methodology bridges, a valuation model can incorrectly mix core observability and broader AIOps TAMs and overstate LogicMonitor's reachable market.
    diligencePath: Purchase the named analyst reports or interview the analysts directly, then rebuild comparable TAM/SAM bridges with explicit inclusion rules.
    relatedQuestionRefs:
    - QM008
    - QM023
    relatedTableRefs:
    - TM002
    - TM005
  - type: private-evidence-only
    severity: material
    topic: logicmonitor-reachable-market
    missingEvidence: Current ARR by cohort, pricing architecture, ACV distribution, module attach, and MSP-versus-enterprise revenue mix for LogicMonitor.
    whyItMatters: Category growth is not the same as company share. Investors need private cohort economics to convert public market size into realistic SOM and penetration assumptions.
    diligencePath: Request a management data-room cut by segment, product module, and geography plus customer concentration and replacement-win data.
    relatedQuestionRefs:
    - QM008
    - QM026
    relatedTableRefs:
    - TM005
  - type: missing-source
    severity: minor
    topic: migration-payback
    missingEvidence: Public customer-level ROI and replacement-cycle evidence by buyer persona showing how quickly consolidation decisions pay back.
    whyItMatters: Survey intent proves pain but not conversion. Replacement economics determine whether LogicMonitor can capture consolidation demand faster than incumbents can defend it.
    diligencePath: Collect customer interviews, implementation case studies, and procurement records focused on migration triggers, time-to-value, and post-migration telemetry economics.
    relatedQuestionRefs:
    - QM013
    - QM025
    relatedTableRefs:
    - TM004
    - TM005
