- id: growth-drivers-constraints-and-gaps
  title: Growth drivers, adoption constraints, and remaining diligence gaps
  body: The demand case is strong but not frictionless. Gartner's 2026 IT spending forecast, Dynatrace's commentary on AI-era mission criticality, and multiple vendor and survey sources all point to hybrid complexity, AI workload reliability, and consolidation pressure as real demand drivers. OpenTelemetry's graduation and the spread of open standards should also help buyers move away from one-off instrumentation choices toward broader platform decisions. The constraint side is equally important for valuation work. Elastic says 67% of respondents still face unexpected observability costs, Grafana says complexity and overhead remain the top concern, Middleware and CNCF show that multi-tool sprawl remains the default, and Flexera shows cloud-governance teams are tightening budget discipline as AI spend rises. Most importantly for LogicMonitor specifically, public sources in this run do not disclose the company's current revenue split, pricing architecture by cohort, or replacement-cycle win
    rates, so investors can defend a market-opportunity narrative but not a precise public-share model without management data. In other words, category growth is observable, but company capture rates still require private diligence and management access.
