  rows:
  - - Hybrid infrastructure observability
    - Infrastructure, network, cloud, application, and service monitoring plus incident context
    - Pure SIEM, endpoint security, or code-only developer tooling
    - Enterprise ITOps, CloudOps, infrastructure leaders
    - Core market where LogicMonitor positions LM Envision
  - - MSP observability and service operations
    - Multi-tenant monitoring, reporting, automation, SLA proof, and client onboarding workflows
    - Standalone PSA or ticketing systems without telemetry depth
    - MSP owners, NOC managers, service-delivery leaders
    - Core indirect and direct buyer cohort with distinct payer structure
  - - AIOps / operations automation adjacency
    - Event correlation, root-cause guidance, anomaly detection, and selected remediation workflows
    - General-purpose AI copilots not tied to telemetry or operational control
    - SRE, platform, infrastructure, and operations executives
    - Expansion adjacency that increases wallet share beyond classic monitoring
  - - Digital experience and Internet performance monitoring
    - End-user experience, Internet path, and external service performance when tied to incident prevention
    - Pure marketing analytics or product analytics not used by operations teams
    - NetOps, SRE, digital-operations teams
    - Cross-sell layer that broadens the hybrid observability control plane
  - - ITOM / workflow automation adjacency
    - Incident workflows, service maps, remediation orchestration, and governance handoffs
    - Broad enterprise workflow suites without operational telemetry relevance
    - CIO staff, ITSM owners, operations-transformation sponsors
    - Important comparison set because buyers may bundle observability with automation suites
  notes: Rows separate LogicMonitor's core telemetry-centric market from adjacent automation and workflow spend so TAM claims do not silently mix unlike-for-like categories.
