callouts:
- calloutType: strength
  title: LogicMonitor is aligned with the parts of the category that are still growing fastest
  body: Hybrid estates remain common, large enterprises still anchor spending, and the fastest narrative shift inside the category is toward AI-assisted operations rather than simpler monitoring. LogicMonitor's public positioning maps directly onto those demand vectors better than a pure point-monitoring vendor would.
  claimRefs:
  - CM011
  - CM018
  - CM019
  - CM030
  - CM034
  - CM035
- calloutType: risk
  title: Public TAM narratives can easily inflate the market by mixing observability and AIOps
  body: A 2026 investor can defend either a $3-4 billion core observability market or a much larger $11-19 billion AIOps adjacency depending on definition. Those numbers are not interchangeable. Without explicit category bridges, valuation arguments can overstate LogicMonitor's reachable spend by several turns of revenue.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM013
  - CM014
  - CM015
  - CM041
  - CM042
- calloutType: risk
  title: Tool sprawl proves demand, but it also lengthens migration and trust-building cycles
  body: The same surveys that show strong appetite for consolidation also show that most organizations still run multiple tools, struggle with setup friction, and hesitate to allow fully autonomous action. That means category pain is real, but vendor conversion still depends on integration quality, governance, and demonstrable ROI.
  claimRefs:
  - CM026
  - CM027
