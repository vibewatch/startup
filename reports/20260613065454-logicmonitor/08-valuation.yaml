  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-stack
      missingEvidence: Debt schedule, lender documents, preference seniority, and liquidation waterfall from the 2024 financing.
      whyItMatters: The headline 2.4B valuation including debt does not reveal common-equity value or downside protection for new money.
      diligencePath: Request cap table, debt agreements, and a fully diluted waterfall model from management and counsel.
      relatedQuestionRefs: [QV002, QV012, QV027]
    - type: private-evidence-only
      severity: material
      topic: retention-quality
      missingEvidence: NRR, GRR, churn, and cohort-level renewal data by customer size, product, and route to market.
      whyItMatters: ARR scale and bookings momentum do not prove that the growth base is durable enough to support a premium multiple.
      diligencePath: Request cohort retention files, renewal bridge, and customer concentration schedules.
      relatedQuestionRefs: [QV011]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, cost-of-revenue detail, support burden, and free-cash-flow conversion.
      whyItMatters: Public comp selection depends heavily on whether LogicMonitor behaves more like a profitable platform or a lower-quality infrastructure vendor.
      diligencePath: Request audited operating model detail, margin bridge, and cash-flow statements with product and services splits.
    - type: enumeration-incomplete
      severity: minor
      topic: comp-set
      missingEvidence: Private secondary marks, sponsor marks, and other non-public observability comparables that sit between public peers and strategic M&A comps.
      whyItMatters: The comparable table brackets the market but cannot fully normalize for private-company illiquidity, sponsor control, or preference overhang.
      diligencePath: Supplement the public set with banker comps, recent secondary data, and sponsor mark materials under NDA.
      relatedQuestionRefs: [QV013, QV019]
      relatedTableRefs: [TV004]
    - type: missing-source
      severity: material
      topic: post-incident-renewal-impact
      missingEvidence: Direct evidence on whether the 2023 security incident or 2026 reliability issues affected renewals, expansion, or win rates.
      whyItMatters: Trust debt may be the fastest path to multiple compression, but public sources do not quantify its revenue impact.
      diligencePath: Interview affected customers, review renewal exceptions, and request management analysis of incident-related churn or slowed expansion.
