        - Public-company quality and scale still exceed LogicMonitor disclosure quality.
      - - Elastic
        - Approximately 6.32B market cap (Jun 2026)
        - FY2026 revenue 1.739B
        - Approximately 3.6x trailing revenue
        - Useful lower-multiple infrastructure software reference
