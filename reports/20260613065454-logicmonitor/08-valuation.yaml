  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What supports it now
      - Anti-thesis
      - What would change the view
    rows:
      - - Scaled platform
        - ARR above 400M and sponsor-backed scale indicate real software relevance.
        - Scale alone does not prove retention quality, margin quality, or clean equity value.
        - Disclose NRR, GRR, gross margin, and debt/preference stack.
      - - AI monetization
        - Edwin AI contributes one-third of bookings and is growing about 200 percent in recurring revenue.
        - AI contribution may be more narrative than durable economics without attach, margin, and renewal proof.
        - Show attach rate, AI ARR, cohort retention, and margin impact.
      - - Platform breadth
        - Catchpoint, AWS, and Deutsche Telekom expand product and channel scope.
        - Breadth can also increase integration risk and services complexity.
        - Prove cross-sell conversion, lower churn, and faster expansion versus legacy cohorts.
      - - Valuation support
        - Roughly 6x ARR sits below Datadog and near mid-tier public comp bands.
        - Roughly 6x ARR is not obviously cheap for a private, opaque, sponsor-controlled asset with trust debt.
        - Hold price near current mark while proving cleaner economics than Elastic/PagerDuty-like bands imply.
      - - Exit optionality
        - Observability assets have cleared large M&A outcomes in New Relic and Splunk.
        - Those comps were larger, more transparent, and farther along in public-market readiness.
        - Demonstrate IPO-grade reporting or strategic scarcity strong enough to overcome private opacity.
    notes: The anti-thesis is not that LogicMonitor lacks value; it is that public evidence is still too incomplete to justify paying a premium multiple to the last known mark.
