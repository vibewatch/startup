      - - Datadog
        - Approximately 81.83B market cap (Jun 2026)
        - FY2025 revenue 3.427B
        - Approximately 23.9x trailing revenue
        - Best premium-growth public observability comp
        - Much faster growth and stronger public-market liquidity than LogicMonitor.
      - - Dynatrace
        - Approximately 11.87B market cap (Jun 2026)
        - FY2026 ARR 2.054B
        - Approximately 5.8x market-cap-to-ARR
