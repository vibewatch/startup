  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Valuation / return logic
      - Probability signal
      - Key risk / trigger
    rows:
      - - Bear
        - ARR stalls near the current floor, trust discount persists, and investors assign a 3.5x-4.5x band.
        - Approximately 1.4B-1.9B; roughly 0.6x-0.8x versus the last public mark.
        - Meaningful if security/reliability issues repeat or AI/Catchpoint economics stay unproven.
        - Another trust event, weak renewal data, or signs the 2024 stack was more dilutive than the headline suggests.
      - - Base
        - ARR remains moderately above 400M, platform relevance holds, and valuation lands near adjusted Dynatrace/Elastic-style bands.
        - Approximately 2.2B-2.9B; roughly flat to about 1.2x from the last public mark.
        - Highest probability on current public evidence.
        - Needs stable growth and no fresh trust shock, but still lacks enough proof for major multiple expansion.
      - - Bull
        - ARR grows toward 450M-500M, Edwin AI and Catchpoint lift expansion quality, and the market awards a 7.0x-8.5x band.
        - Approximately 3.3B-4.3B; roughly 1.4x-1.8x from the last public mark.
        - Possible, but it requires execution proof beyond current press-release evidence.
        - Needs clear cross-sell, better retention, no repeat outages/security events, and credible stack transparency.
    notes: Ranges are public-evidence estimates using disclosed ARR floor, public comp bands, and qualitative risk discounts; they are not management guidance or a full DCF.
