  - - Splunk Observability
    - Host-based and model-driven messaging
    - Observability and platform pricing models
    - Streaming architecture, AI SRE agents, telemetry pipeline management
    - Current bundled enterprise pricing with Cisco not public
    - Bundle leverage may outrun stand-alone price comparison
  - - Grafana Cloud
    - $0 free tier; from $19/month + usage
    - Usage-based SaaS with annual commit options
    - Open observability, OTel-native ingestion, broad services
    - Enterprise retention and support economics vary by commit
    - Strong low-friction entry point and anti-lock-in message
