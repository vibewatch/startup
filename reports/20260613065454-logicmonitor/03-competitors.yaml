callouts:
- calloutType: strength
  title: LogicMonitor wins on operating-model clarity more than raw telemetry novelty
  body: The fetched evidence most strongly supports LogicMonitor in buyer situations where hybrid infrastructure, MSP operations, and budgeting simplicity matter together. Public package pricing, hybrid-unit visibility, multi-tenant delivery, and workflow integrations are easier to explain to an IT operations buyer than Datadog-style metering or a self-built open stack.
  claimRefs:
  - CP002
  - CP003
  - CP005
  - CP006
  - CP038
  - CP042
- calloutType: risk
  title: Open standards weaken any claim of hard instrumentation lock-in
  body: OpenTelemetry and Prometheus materially reduce switching friction across this market. Because LogicMonitor and most major rivals already consume OTLP or comparable open telemetry standards, moat durability depends less on proprietary ingestion and more on workflow embedding, partner reach, and trusted operations.
  claimRefs:
  - CP033
  - CP034
  - CP035
  - CP039
  - CP043
  - CP044
- calloutType: risk
  title: Adjacent bundles may be a bigger threat than point-feature gaps
  body: Cisco-Splunk and ServiceNow can shift the buying frame from “best observability tool” to “best enterprise control plane,” which changes how budgets, switching costs, and procurement politics work. That makes quote-level bundle evidence a priority diligence item before assuming LogicMonitor can preserve price discipline in large accounts.
