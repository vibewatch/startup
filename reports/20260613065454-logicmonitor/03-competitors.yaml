- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / option
  - Public pricing anchor
  - Unit / contract model
  - Included capability signal
  - Key unknown or discount caveat
  - Competitive implication
  rows:
  - - LogicMonitor
    - $16 / $27 / $53 packages
    - Per hybrid unit; transparent package tiers
    - Hybrid observability, logs options, Edwin AI add-ons
    - Real enterprise discount bands not public
    - Easier to explain and budget than heavily metered peers
  - - Datadog
    - Mechanics public; clean list extraction harder
    - High-water-mark host and module billing; hourly metering
    - Infra, APM, logs, RUM, DB, more
