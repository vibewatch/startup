  rows:
  - - LogicMonitor
    - Direct peer
    - Private, PE-backed; public package pricing; 3,000+ integrations
    - Hybrid enterprise IT and MSPs
    - Hybrid observability plus MSP-ready multi-tenancy and simpler list pricing
    - Less public proof of deepest code-level developer workflow than Datadog or Dynatrace
  - - Datadog
    - Direct peer
    - Large public SaaS competitor; broad modular platform
    - Cloud-native and enterprise platform teams
    - Very broad platform across infra, apps, logs, DX, service management, and AI
    - Metered host/module pricing is operationally complex and can expand with usage
  - - Dynatrace
    - Direct peer
    - Public list pricing for infra, full-stack, and Kubernetes
    - Large enterprises needing automation and full-stack depth
    - Strong causal/agentic AI narrative plus full-stack and OTLP support
    - Premium enterprise motion and richer feature stack can imply heavier buying complexity
  - - New Relic
    - Direct peer
    - Private after $6.5B buyout; broad platform and OTel support
    - Engineering-led teams wanting transparent usage pricing
    - Unified platform with 100GB free entry point and broad telemetry ingest
    - Less public operating disclosure after going private limits external benchmarking
  - - Splunk Observability / Cisco
    - Direct peer + incumbent bundle
    - Owned by Cisco since March 2024
    - Large enterprises with network, security, and observability budgets
    - Business-context framing, AI SRE agents, and broader Cisco account leverage
    - Bundle strength can outweigh stand-alone product comparison in some deals
  - - Elastic
    - Direct peer / adjacency
    - Usage-based Elastic Cloud and 450+ integrations
    - Teams prioritizing logs, search economics, and OTel-native openness
    - OpenTelemetry-first, Prometheus-native, and cost-efficiency message
    - Vendor-authored cost claims need customer validation in the field
  - - ServiceNow ITOM
    - Adjacent incumbent
    - Enterprise workflow incumbent with ITSM/service graph control
    - CIO, ITSM, and service operations buyers
    - Workflow-native remediation, service mapping, and unified ops platform
    - Quote-led pricing and less direct evidence of deepest stand-alone telemetry breadth
  - - SolarWinds Observability Self-Hosted
    - Narrow direct substitute
    - List anchor starts at $8 per node/month
    - Hybrid infrastructure and network-heavy operations teams
    - Lower-cost all-in-one hybrid observability positioning
    - Regulatory overhang from SEC cyber action weakens trust posture
  - - Auvik
    - Niche substitute
    - 80,000+ IT pros and MSPs; 700+ device vendors supported
    - MSPs and network operations teams
    - Fast deployment, topology mapping, unlimited sites and networks
    - Network-centric scope is narrower than full-stack observability platforms
  - - Grafana + Prometheus + OpenTelemetry self-build
    - Status quo / self-build substitute
    - Open-source stack with free or low-cost entry points
    - Engineering-led teams willing to operate their own stack
    - Strong openness and lower hard lock-in
    - Operational burden and assembly complexity remain with the buyer
  notes: Rows distinguish direct observability rivals from adjacent incumbents and substitutes. “Public scale / ownership signal” intentionally uses only fetched evidence from this run rather than unstated market-share assumptions.
