- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or risk
  - Threat vector
  - Why credible now
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Hybrid + MSP operating model
    - Datadog, Dynatrace, and ServiceNow improve hybrid workflow packaging
    - All leading vendors are broadening AI and workflow claims while LM still relies on execution in MSP-heavy motions
    - Medium-High
    - Validate cohort retention, attach, and renewal by MSP versus enterprise accounts
  - - Transparent list pricing
    - Enterprise discounting makes published list prices less decisive in large deals
    - Datadog and ServiceNow can still win if discounts or bundles erase sticker-price simplicity
    - Medium
    - Collect quote-level benchmarks before underwriting price advantage
  - - Workflow embedding via integrations and tenants
    - ServiceNow and Cisco-Splunk can use adjacent control planes to increase switching pain
    - Workflow system ownership can outweigh pure telemetry comparisons
    - High
    - Map which integrations are mission-critical and where LogicMonitor already owns the operating workflow
  - - Protocol / data lock-in
    - OpenTelemetry and Prometheus reduce proprietary ingestion lock-in
    - Vendor-neutral instrumentation and native OTLP support are now category-wide patterns
    - High
    - Test migration frictions around dashboards, runbooks, and service models rather than instrumentation alone
  - - Trust posture as tiebreaker
    - SolarWinds enforcement history and any future vendor incident can reset buyer preference
    - Control-plane software carries stewardship risk and procurement scrutiny
    - Medium
    - Review security architecture, audit trails, and incident disclosure quality for all finalists
  - - Adjacent bundle pressure
    - Cisco-Splunk and ServiceNow can bundle observability into larger budgets
    - Broader account control may compress stand-alone observability margins
    - High
    - Ask management for bundle-displacement examples and counter-positioning success rates
  notes: Severity ratings are qualitative and reflect the likely effect on LogicMonitor’s competitive durability, not absolute vendor quality. The risk register is designed to guide diligence follow-up rather than serve as a static market-share forecast.
