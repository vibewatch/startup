  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role in system
      - Key dependency
      - Primary risk
    rows:
      - - Collector host
        - Polls devices and receives trap/syslog/flow data
        - Customer-managed Windows/Linux server close to monitored resources
        - Mis-sizing, poor placement, or over-privileged installs can degrade reliability and security
      - - LogicModules (DataSources / TopologySources / PropertySources)
        - Determine what to discover, collect, map, and alert on
        - Current module repository content and correct device identification
        - Coverage gaps or stale modules create blind spots or noisy alerts
      - - LogicMonitor cloud control plane
        - Stores, processes, and presents telemetry
        - Outbound HTTPS to LogicMonitor data centers and portal availability
        - Portal disruptions can affect user access even if ingestion continues
      - - Topology engine
        - Connects ERIs and protocol-derived relationships into RCA graphs
        - Imported topology modules, network credentials, and ERI correctness
        - Wrong or duplicate ERIs can merge resources incorrectly or miss relationships
      - - Service Insights engine
        - Aggregates metrics across logical services
        - Correct service definitions and aggregate DataSources
        - Bad service modeling can preserve the wrong abstraction, not the right one
      - - Edwin AI correlation layer
        - Enriches, groups, prioritizes, and acts on events
        - Quality of incoming telemetry, integrations, and credential scopes
        - Weak context or bad automation design can produce low-trust recommendations
      - - API / SDK layer
        - Programmatic control of devices, services, alerts, dashboards, logs, and more
        - REST API v3 auth, versioning, and rate limits
        - Migration debt from older APIs or weak token hygiene can slow automation
      - - Identity and compliance boundary
        - Controls user auth and environment separation
        - Customer IdP, SAML configuration, FedRAMP environment choices
        - Role-mapping mistakes or commercial/FedRAMP boundary confusion can create access risk
    notes: Architecture rows focus on operating layers that are explicitly documented, not speculative internal microservices.
    enumerationScope:
      coverage: exhaustive
      basis: The principal documented layers required to collect telemetry, add context, automate actions, and govern access across the public LogicMonitor product surface as of run date.
