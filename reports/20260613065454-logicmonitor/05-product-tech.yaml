  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: ai-adoption
      missingEvidence: Customer-level metrics on Edwin AI attach rate, autonomous-remediation usage, false-positive rates, and rollback or approval controls.
      whyItMatters: The public story is strongest on feature breadth, but investability depends on whether AI automation is trusted and widely used in production.
      diligencePath: Request product analytics by module, remediation success and failure logs, and customer references using Edwin AI in production change windows.
    - type: access-blocked
      severity: material
      topic: security-controls
      missingEvidence: Underlying Trust Center audit artifacts such as SOC reports, penetration-test summaries, and detailed control mappings.
      whyItMatters: Public summary pages are directionally positive, but enterprise diligence usually requires the actual audit packet and not only marketing-level control descriptions.
      diligencePath: Obtain the gated trust package under NDA and reconcile certificate scope dates, exceptions, and control owners against the current product boundary.
    - type: private-evidence-only
      severity: material
      topic: implementation-friction
      missingEvidence: Measured deployment times, time-to-value by environment type, and support-ticket intensity during onboarding.
      whyItMatters: Reviews consistently mention complexity, which could dilute product value if deployments require heavy vendor services or prolonged tuning.
      diligencePath: Ask for implementation benchmarks by customer segment, average collector counts, and support case volumes during the first 90 days post-deployment.
    - type: missing-source
      severity: minor
      topic: developer-ecosystem
      missingEvidence: Officially supported matrix distinguishing community-maintained developer tools from vendor-supported ones.
      whyItMatters: The public developer surface is positive, but buyers need to know which tools fall under formal SLAs and roadmap ownership.
      diligencePath: Request product-management confirmation on support policy for PowerShell, MCP, Terraform, and SDK assets and whether any will be folded into official packaging.
