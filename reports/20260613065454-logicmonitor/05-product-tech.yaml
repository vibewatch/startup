tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Current status / maturity
      - What it does
      - Differentiation signal
      - Diligence gap
    rows:
      - - LM Envision core platform
        - ITOps / NOC / platform teams
        - Mature core platform
        - Unified observability across clouds, data centers, apps, and services
        - Combines observability with agentic AIOps instead of selling a separate AI console
        - Need independent proof of realized outcomes beyond company case studies
      - - Collectors + LogicModules
        - Infra / platform engineers
        - Mature but deployment-sensitive
        - Per-location data collection, autodiscovery, protocol polling, trap/syslog/netflow ingest
        - One collector can monitor hundreds of devices; avoids agent-per-endpoint sprawl
        - Need customer-level evidence on scaling limits by environment mix
      - - Edwin AI + AI Agent
        - Ops teams / incident responders
        - Growth stage with active shipping
        - Summaries, root-cause guidance, event correlation, guided remediation, automated remediation hooks
        - Moves from alert review toward execution and can ingest third-party events through Edwin CEF
        - Need production proof on false-positive and auto-remediation guardrail rates
      - - LM Service Insights / Dynamic Service Insights / LM Uptime
        - SRE / service owners
        - Growth to mature transition
        - Aggregates instance-level telemetry into logical services and service-level health
        - Preserves service history across ephemeral instances and links infrastructure to business service health
        - Need adoption/attach data and evidence on how often service views replace raw host-level triage
      - - Topology Mapping
        - NetOps / NOC / RCA teams
        - Mature specialist capability
        - Builds dynamic L2/L3 maps and RCA context from protocol-discovered relationships
        - Native dependency context and optional alert suppression for dependent alerts
        - Need evidence on map accuracy at very large multi-tenant or MSP deployments
      - - Catchpoint integration / digital experience
        - SRE / digital ops
        - Growth stage after acquisition
        - Adds synthetic, RUM, network, and Internet telemetry to Edwin and LM Envision
        - Extends visibility beyond owned infrastructure into Internet paths and user experience
        - Need timeline for full data-model convergence and contract migration completion
      - - API / SDK / marketplace surface
        - Platform engineering / partners
        - Mature automation surface with mixed support boundaries
        - REST API v3, Python/Go SDKs, PowerShell, MCP server, AWS Marketplace procurement
        - Gives admins multiple automation paths and a visible developer ecosystem
        - Need clarity on which community tools are officially supported long term
    notes: Module status ratings are based on documentation depth, release cadence, and how long each capability has appeared in public materials; they are not usage-share disclosures.
