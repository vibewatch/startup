  - id: collection-context-and-control-plane
    title: Collection, context, and control-plane architecture
    body: |-
      The product’s technical center of gravity is still the Collector and LogicModule system. LogicMonitor’s docs repeatedly emphasize that customers install one Collector per location rather than one agent per resource, and that the Collector uses standard protocols plus built-in DataSources to determine what to monitor, encrypts data, and sends it back over outbound HTTPS. That design reduces endpoint sprawl, but it also creates practical deployment constraints: Collectors should be placed close to monitored resources, should not poll across the public internet or heavy NAT boundaries, and need protocol reachability for SNMP, WMI, JDBC, SSH, and similar data sources. Containerized deployment exists, but the container path is less flexible and still requires root. [CE016] [CE017] [CE018] [CE019] [CE020] [CE021] [CE022] [CE023]

      Above collection, LogicMonitor has built several context layers that differentiate it from simpler infrastructure monitors. Topology mapping uses LLDP, CDP, BGP, OSPF, and EIGRP to build layer-2 and layer-3 relationship maps, while Service Insights aggregates instance data into logical services and preserves historical service metrics even when component instances churn. Edwin AI adds another control-plane layer by normalizing third-party events into Edwin CEF, correlating them with internal telemetry, and supporting guided or automated remediation. The API and SDK surface extends that same model to external automation: public docs position REST API v3, Python/Go SDKs, and community tooling as first-class ways to programmatically manage devices, services, alerts, collectors, dashboards, and log ingestion. [CE024] [CE025] [CE026] [CE027] [CE028] [CE029] [CE030] [CE031] [CE032] [CE033]
