  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow problem
      - LogicMonitor workflow
      - Measurable or claimed benefit
      - Known limitation
    rows:
      - - NOC analyst triaging infrastructure alarms
        - Alert storms hide root cause and dependency context
        - Collectors feed telemetry, topology maps show dependencies, Edwin summarizes incidents
        - Company claims less alert noise and faster incident resolution
        - Quality still depends on correct module coverage and alert tuning
      - - SRE or platform owner tracking service health
        - Host-level noise obscures actual service health in ephemeral estates
        - Service Insights aggregates service indicators across instances and preserves history
        - Lets teams monitor logical services rather than only hosts or containers
        - Public sources do not show attach rate or benchmarked accuracy
      - - NetOps team debugging network paths
        - Device status alone does not show routing or neighbor relationships
        - Topology mapping builds L2/L3 maps from LLDP/CDP/BGP/OSPF/EIGRP
        - Supports RCA and optional suppression of dependent alerts
        - Requires imported TopologySources, PropertySources, and correct credentials
      - - Incident responder correlating third-party events
        - Monitoring data lives in separate tools and ticketing systems
        - Edwin AI ingests OOTB and custom integrations and normalizes events into Edwin CEF
        - Can add context, enrichment, and guided remediation to external events
        - Integrations still require configuration work and credential management
      - - Cloud / platform team onboarding new environments
        - Monitoring rollout is slowed by collector placement and access design
        - One collector per location plus API onboarding and LogicModules accelerates broad coverage
        - Marketplace and out-of-box modules reduce procurement and setup friction
        - Cross-internet polling, NAT boundaries, and unsupported combinations still add friction
      - - Compliance-oriented federal operator
        - Commercial tooling may not meet boundary requirements
        - LMforGov provides a FedRAMP Moderate environment with separate domain and API host
        - Provides a path for public-sector usage
        - Key features including Edwin AI and synthetics are explicitly out of scope
    notes: Benefits combine company-claimed outcomes with workflow implications inferred from the documented feature set; limitations are included where the public record does not prove autonomous operation end to end.
