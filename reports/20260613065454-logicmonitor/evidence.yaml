evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: A current 2026 employee count or range from management, careers materials, or a credible third-party database.
    whyItMatters: Headcount is a core scale and efficiency indicator for later operating-leverage and margin analysis.
    diligencePath: Request current headcount, regional employee mix, and hiring plan directly from management or data room.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: board-and-governance
    missingEvidence: A current board roster plus committee composition, observer rights, and sponsor consent controls.
    whyItMatters: >-
      Sponsor governance depth, independence, and succession oversight are impossible to assess cleanly without the
      current board view.
    diligencePath: Request board deck cover pages, governance chart, and shareholder agreement summary from the company or sellers.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Debt-vs-equity split, lender identity by instrument, pricing, covenants, and maturity profile for the 2024
      strategic financing.
    whyItMatters: >-
      A debt-inclusive valuation headline can materially overstate equity value if leverage or restrictive covenants are
      significant.
    diligencePath: Obtain financing term sheet, cap table, and post-transaction ownership summary from management or sponsors.
    relatedQuestionRefs:
      - QO011
      - QO014
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: layoffs-and-employee-sentiment
    missingEvidence: A directly accessible employee-review or workforce-reduction source specific to LogicMonitor in 2025-2026.
    whyItMatters: Absence of WARN signals does not rule out smaller restructurings or morale issues that matter for execution risk.
    diligencePath: >-
      Re-run adverse workforce checks with accessible employee-review sources or ask management for 2024-2026
      involuntary attrition data.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: market-size-methodology
    missingEvidence: Underlying methodologies and scope definitions for the public observability and AIOps estimates used here.
    whyItMatters: >-
      Without methodology bridges, a valuation model can incorrectly mix core observability and broader AIOps TAMs and
      overstate LogicMonitor's reachable market.
    diligencePath: >-
      Purchase the named analyst reports or interview the analysts directly, then rebuild comparable TAM/SAM bridges
      with explicit inclusion rules.
    relatedQuestionRefs:
      - QM008
      - QM023
    relatedTableRefs:
      - TM002
      - TM005
  - type: private-evidence-only
    severity: material
    topic: logicmonitor-reachable-market
    missingEvidence: >-
      Current ARR by cohort, pricing architecture, ACV distribution, module attach, and MSP-versus-enterprise revenue
      mix for LogicMonitor.
    whyItMatters: >-
      Category growth is not the same as company share. Investors need private cohort economics to convert public market
      size into realistic SOM and penetration assumptions.
    diligencePath: >-
      Request a management data-room cut by segment, product module, and geography plus customer concentration and
      replacement-win data.
    relatedQuestionRefs:
      - QM008
      - QM026
    relatedTableRefs:
      - TM005
  - type: missing-source
    severity: minor
    topic: migration-payback
    missingEvidence: >-
      Public customer-level ROI and replacement-cycle evidence by buyer persona showing how quickly consolidation
      decisions pay back.
    whyItMatters: >-
      Survey intent proves pain but not conversion. Replacement economics determine whether LogicMonitor can capture
      consolidation demand faster than incumbents can defend it.
    diligencePath: >-
      Collect customer interviews, implementation case studies, and procurement records focused on migration triggers,
      time-to-value, and post-migration telemetry economics.
    relatedQuestionRefs:
      - QM013
      - QM025
    relatedTableRefs:
      - TM004
      - TM005
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rates
    missingEvidence: >-
      Current win-loss data by segment showing where LogicMonitor displaces Datadog, Dynatrace, ServiceNow, Splunk, and
      Grafana/self-build options.
    whyItMatters: >-
      Without observed displacement rates, the chapter can argue where LogicMonitor appears differentiated but cannot
      underwrite durable share gains or pricing power with high confidence.
    diligencePath: >-
      Request the last 12 months of competitive deal reviews, segmented by enterprise, MSP, and network-heavy motions,
      with explicit reasons-won and reasons-lost.
    relatedQuestionRefs:
      - QP024
      - QP026
  - type: missing-source
    severity: material
    topic: opaque-enterprise-pricing
    missingEvidence: >-
      Current quote-level pricing, discount bands, and committed minimums for ServiceNow ITOM, Datadog enterprise deals,
      and Splunk observability bundles.
    whyItMatters: >-
      Public list anchors are enough to compare packaging style, but not enough to model true TCO or whether
      LogicMonitor wins on price once procurement discounts are applied.
    diligencePath: >-
      Obtain recent customer quotes or procurement screenshots for each named vendor, plus any reseller or MSP schedule
      LogicMonitor uses in channel-led deals.
    relatedQuestionRefs:
      - QP007
      - QP013
      - QP017
      - QP026
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: minor
    topic: logicmonitor-cohort-economics
    missingEvidence: >-
      MSP-versus-enterprise renewal, expansion, and attach-rate data for LogicMonitor, including Edwin AI adoption and
      bundled workflow integrations.
    whyItMatters: >-
      The public evidence supports MSP relevance, but not whether channel-centric stickiness converts into materially
      better retention economics than enterprise-only peers.
    diligencePath: >-
      Ask management for cohort-level retention, gross churn, and attach-rate data by buyer type, including co-managed
      and white-labeled deployments.
    relatedQuestionRefs:
      - QP006
      - QP024
      - QP026
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, liquidity bridge, and downside runway model.
    whyItMatters: >-
      Capital adequacy cannot be underwritten without knowing whether the 2024 financing solved liquidity or only
      extended the timeline to another raise.
    diligencePath: >-
      Request monthly cash bridge from the CFO, board-approved operating plan, covenant package, and base/downside
      runway scenario.
    relatedQuestionRefs:
      - QI020
      - QI023
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: debt-obligations
    missingEvidence: >-
      Debt quantum, lender list, maturity profile, covenants, and any preferred or structured financing terms from the
      2024 transaction.
    whyItMatters: >-
      Strategic financing and debt change the meaning of the headline round, affect dilution risk, and can constrain
      future flexibility.
    diligencePath: >-
      Obtain debt agreements, cap-table summary, closing sources-and-uses memo, and any intercreditor or investor-rights
      terms.
    relatedQuestionRefs:
      - QI021
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-nrr
    missingEvidence: Subscription gross margin, blended gross margin, NRR, CAC, payback, and partner incentive burden.
    whyItMatters: >-
      The core investment question is whether LogicMonitor’s recurring growth converts into attractive unit economics
      after cloud, support, and channel costs.
    diligencePath: >-
      Request SaaS KPI pack with gross margin, NRR, CAC payback, S&M efficiency, and direct versus partner-sourced
      economics.
    relatedQuestionRefs:
      - QI017
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Discount waterfall, renewal uplift, average selling price by package, and marketplace fee impact.
    whyItMatters: >-
      List pricing exists, but investors still cannot convert published package prices into realized revenue quality or
      margin.
    diligencePath: >-
      Request billing extracts, pricing policy, discount authority matrix, and partner rebate schedules by route to
      market.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI002
      - TI005
  - type: missing-source
    severity: minor
    topic: 2024-proceeds-allocation
    missingEvidence: >-
      Detailed sources-and-uses breakdown for the 2024 financing, including primary cash retained versus any secondary,
      fees, debt paydown, or acquisition reserve.
    whyItMatters: >-
      It would sharpen the difference between growth capital, balance-sheet support, and sponsor-structure effects in
      the headline round.
    diligencePath: >-
      Request transaction memo, capitalization table before and after close, and management budget for product, M&A, and
      regional expansion use of proceeds.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: ai-adoption
    missingEvidence: >-
      Customer-level metrics on Edwin AI attach rate, autonomous-remediation usage, false-positive rates, and rollback
      or approval controls.
    whyItMatters: >-
      The public story is strongest on feature breadth, but investability depends on whether AI automation is trusted
      and widely used in production.
    diligencePath: >-
      Request product analytics by module, remediation success and failure logs, and customer references using Edwin AI
      in production change windows.
  - type: access-blocked
    severity: material
    topic: security-controls
    missingEvidence: >-
      Underlying Trust Center audit artifacts such as SOC reports, penetration-test summaries, and detailed control
      mappings.
    whyItMatters: >-
      Public summary pages are directionally positive, but enterprise diligence usually requires the actual audit packet
      and not only marketing-level control descriptions.
    diligencePath: >-
      Obtain the gated trust package under NDA and reconcile certificate scope dates, exceptions, and control owners
      against the current product boundary.
  - type: private-evidence-only
    severity: material
    topic: implementation-friction
    missingEvidence: Measured deployment times, time-to-value by environment type, and support-ticket intensity during onboarding.
    whyItMatters: >-
      Reviews consistently mention complexity, which could dilute product value if deployments require heavy vendor
      services or prolonged tuning.
    diligencePath: >-
      Ask for implementation benchmarks by customer segment, average collector counts, and support case volumes during
      the first 90 days post-deployment.
  - type: missing-source
    severity: minor
    topic: developer-ecosystem
    missingEvidence: Officially supported matrix distinguishing community-maintained developer tools from vendor-supported ones.
    whyItMatters: >-
      The public developer surface is positive, but buyers need to know which tools fall under formal SLAs and roadmap
      ownership.
    diligencePath: >-
      Request product-management confirmation on support policy for PowerShell, MCP, Terraform, and SDK assets and
      whether any will be folded into official packaging.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, logo churn, contract length, renewal cadence, and cohort behavior by major customer segment.
    whyItMatters: Desk research can prove adoption and value but cannot prove customer durability without actual renewal data.
    diligencePath: Request cohort retention tables, churn bridge, and top-20 renewal schedule from management.
    relatedQuestionRefs:
      - QU012
      - QU017
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: >-
      Top-customer ARR share, top-partner ARR share, direct-vs-channel revenue mix, and top-10 customer concentration
      trend.
    whyItMatters: A broad visible logo set can still hide concentrated economics or partner dependence.
    diligencePath: Request concentration analysis by customer, partner, and vertical plus any renewal or churn by top accounts.
    relatedQuestionRefs:
      - QU013
      - QU025
    relatedTableRefs:
      - TU006
  - type: missing-source
    severity: minor
    topic: independent-customer-proof
    missingEvidence: >-
      Independent customer-authored case studies, procurement records, or customer reference calls that confirm
      production depth beyond company-curated pages.
    whyItMatters: Company-authored case studies are useful but can overstate smoothness or hide partial deployments.
    diligencePath: >-
      Interview named customers and collect independent implementation or procurement documents for the largest
      references.
    relatedQuestionRefs:
      - QU007
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: minor
    topic: channel-economics
    missingEvidence: >-
      Partner-sourced pipeline, MSP package attach rate, professional-services attach rate, and median time-to-value by
      segment.
    whyItMatters: Expansion quality depends on whether channel and services-driven growth scales efficiently and renews cleanly.
    diligencePath: Request GTM dashboard covering channel mix, services usage, and post-deployment expansion by cohort.
    relatedQuestionRefs:
      - QU011
      - QU017
    relatedTableRefs:
      - TU005
  - type: missing-source
    severity: material
    topic: outage-history-granularity
    missingEvidence: An official long-window incident export with severity, duration, and MTTR by component or region.
    whyItMatters: >-
      Third-party outage aggregators are directionally useful but can overstate or misclassify operational pain relative
      to actual customer impact.
    diligencePath: Request 12- to 24-month incident logs from LogicMonitor ops leadership plus postmortem counts for P1/P2 events.
