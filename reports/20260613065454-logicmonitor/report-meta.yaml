companyProfile:
  summary: >-
    LogicMonitor is a late-stage private observability software company founded in 2007 by Steve
    Francis and Jie Song. Based in Santa Barbara and backed by Vista Equity Partners, it sells a
    hybrid-observability platform that has expanded from infrastructure monitoring into AI-assisted
    operations, serving more than 2,300 customers, 700+ MSPs, and 100,000+ users. Public evidence
    shows a scaled platform business with ARR above $400M and a major 2024 financing, but it still
    discloses far less than public-market peers on margins, retention quality, debt, and governance.
