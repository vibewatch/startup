  evidenceGaps:
  - type: missing-source
    severity: material
    topic: outage-history-granularity
    missingEvidence: An official long-window incident export with severity, duration, and MTTR by component or region.
    whyItMatters: Third-party outage aggregators are directionally useful but can overstate or misclassify operational pain relative to actual customer impact.
    diligencePath: Request 12- to 24-month incident logs from LogicMonitor ops leadership plus postmortem counts for P1/P2 events.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: partner-and-cloud-concentration
    missingEvidence: Partner-sourced ARR mix, AWS infrastructure spend concentration, and Catchpoint revenue or attach-rate contribution.
    whyItMatters: Dependency risk cannot be sized if investors cannot tell whether growth, delivery, or gross margin is overly exposed to one partner or acquired product.
    diligencePath: Ask management for channel mix, top-partner exposure, hyperscaler concentration, and Catchpoint integration KPIs by quarter.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: public-litigation-and-ip-sweep
    missingEvidence: Case-level federal/state dockets plus trademark and patent dispute checks covering active and recently resolved matters.
    whyItMatters: The legal-risk register should not rely on absence of casual web evidence when litigation, IP, or contract disputes can be material even for private companies.
    diligencePath: Run paid PACER / state docket / TTAB / PTAB searches and obtain management representation on active disputes and threatened claims.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: access-blocked
    severity: material
    topic: trust-center-document-depth
    missingEvidence: Readable copies of the DPA, subprocessor list, SOC reports, ISO certificates, and audit-rights language referenced through the trust center.
    whyItMatters: Public landing pages signal governance maturity, but underwriters still need the underlying legal and audit documents to evaluate breach notice, subprocessors, and contractual control depth.
    diligencePath: Request trust-center document exports or vendor-security package access under NDA and compare them against public summaries.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
