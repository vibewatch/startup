- id: milestones-scale-and-adverse-signals
  title: Milestones, scale indicators, and adverse signals
  body: 'Public milestones show a company that has repeatedly expanded its commercial scope. LogicMonitor was founded in 2007, sold a majority stake to Vista in 2018, professionalized its partner program in 2019-2021, publicized accelerating business momentum in 2024, crossed the $300 million ARR mark in 2025, and by April-May 2026 had reframed itself around Autonomous IT with more than two trillion metrics processed daily and AI-led workflow previews in market. The milestone pattern is not one of a stagnant monitoring vendor; it is a vendor using sponsor capital and installed telemetry to climb the stack toward AI-assisted operations. [CO001] [CO018] [CO023] [CO024] [CO027] [CO028] [CO029] [CO031] [CO032] [CO038] [CO039]


    Scale claims are directionally strong but not perfectly consistent across company disclosures. The current About page says 2,300+ customers, 700+ MSPs, and 100,000+ users, while February 2024 business results cited roughly 2,400 customers. Metrics-per-day disclosures also stepped from 800 billion in 2023 to 1.8 trillion in late 2025 and 2+ trillion in April 2026. These shifts are plausible and generally positive, but they underline why later chapters should cite dated point-in-time metrics rather than flattening them into one timeless number. [CO005] [CO024] [CO028] [CO029] [CO030]


    The main adverse evidence in the fetched set is cybersecurity and operational trust, not publicly documented mass layoffs or litigation. TechCrunch and SC World reported that a 2023 security incident affected a small number of customers and that weak default passwords were cited as the exposure path, with at least one source alleging ransomware impact. Separately, the public status page shows LogicMonitor still performs visible maintenance and has had brief portal-access disruptions, even if no major June 2026 incident appears. There was no LogicMonitor-specific mass WARN signal in the layoff trackers reviewed, but the employee-relations picture is incomplete because richer review sources were blocked in this run. [CO033] [CO034] [CO035] [CO036] [CO037]'
