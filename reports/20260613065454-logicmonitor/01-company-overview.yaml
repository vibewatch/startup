  - CO025
  - CO026
  - CO031
- calloutType: risk
  title: Trust and transparency are the main overview-level risks
  body: 'The biggest chapter-1 risks are not demand-side weakness but trust gaps: a 2023 password-related customer security incident, incomplete public detail on current board composition and financing covenants, and no current public headcount disclosure. Those do not invalidate the growth story, but they materially limit confidence in governance and operating-quality assessment.'
