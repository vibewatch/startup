      - number: '5.4'
        title: Trust, compliance, and product risks
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor’s enterprise trust surface is stronger than its historical security reputation but not
              perfectly clean. Current documentation says portal traffic is encrypted with TLS 1.2+, confidential
              customer data is encrypted before storage, API tokens should be tied to API-only users, and SAML-based SSO
              works with any SAML 2.0 IdP. The company also documents regular penetration testing, ISO 27000-series
              certification, SOC 2 Type 2 compliance, searchable audit logs, and a FedRAMP Moderate environment for
              approved government users. The status page further shows mature operational segmentation by region and
              component, and it explicitly disclosed an April 2026 rolling update that could briefly affect portal
              access without impacting ingestion or alert evaluation. [CE049] [CE050] [CE051] [CE052] [CE053] [CE054]
              [CE055] [CE056] [CE057]


              The main product risks are implementation friction, compliance boundaries, and trust debt. FedRAMP support
