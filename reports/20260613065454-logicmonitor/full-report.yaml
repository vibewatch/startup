  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Security trust relapse
        - Customer-impacting security incident, credential-control failure, or collector-abuse pathway
        - Any repeat of a LogicMonitor-originated security/control failure with customer compromise
        - >-
          Pause conviction; require root-cause proof, default-setting audit, and customer-remediation evidence before
          underwriting upside
      - - Availability / change-management deterioration
        - Account Access or portal incidents become more frequent or longer
        - >-
          Two or more materially visible incidents in a quarter or change windows that affect business-hours access
          repeatedly
        - Discount expansion assumptions and treat reliability as a churn driver rather than a mere support issue
      - - FedRAMP / compliance split gets wider
        - High-value federal or regulated use cases depend on still out-of-scope features
        - Flagship workflows remain outside government boundary without roadmap closure
        - >-
          Reduce confidence in regulated-market upside and ask for product-boundary roadmap before sizing vertical
          expansion
      - - Catchpoint integration under-delivers
        - Joint platform does not show measurable alert-noise reduction, faster RCA, or attach-rate evidence
        - No clear adoption / outcome proof within 12 months of close
        - Treat acquisition as complexity cost, not moat expansion; lower multiple tolerance
      - - Implementation and pricing friction compounds
        - Review and customer metrics show persistent alert-noise, dashboard friction, or pricing pushback
        - Evidence of slower deployments, weaker renewals, or pricing-driven objections in large estates
        - Tighten retention assumptions and require cohort / renewal proof before crediting operating leverage
    notes: >-
      These kill criteria are investor-facing thresholds, not product SLOs. They are designed to force a decision when
      risk evidence worsens faster than management narratives improve.
