  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor does not sell into a narrow server-monitoring niche anymore. Its current product and solution
              pages define the market as hybrid observability across clouds, data centers, applications, services, and
              digital experience, with agentic AIOps layered on top. That means the relevant spend pool includes
              infrastructure monitoring, topology and telemetry correlation, incident triage, and selected remediation
              workflows used by enterprise ITOps, CloudOps, and MSP operating teams. It excludes pure SIEM, endpoint
              security, source-code-only developer tooling, and broad ITSM suites when those products are not tied to
              real-time operational telemetry. The status quo substitute is also more complex than 'do nothing': many
              buyers already own multiple point tools, dashboards, and workflow systems, so the real competitive set is
              fragmented monitoring plus adjacent ITOM and service-management tooling rather than a blank sheet of
              paper.
