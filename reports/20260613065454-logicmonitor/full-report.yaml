chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and current operating stage
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor presents itself in 2026 as an AI-first platform for Autonomous IT, but the company's core
              commercial identity is still the same one it built over the prior decade: a SaaS observability platform
              that helps enterprises and managed service providers monitor hybrid infrastructure across on-premises,
              cloud, SaaS, and Internet-dependent environments. The current About page says more than 2,300 customers,
              700+ MSPs, and 100,000+ users rely on the platform, while recent product launches describe a shift from
              pure monitoring toward context-aware AI and governed remediation. That repositioning matters for later
              chapters because it means LogicMonitor is not just selling dashboard visibility; it is explicitly trying
              to monetize AI-led workflow automation on top of an installed observability base. [CO001] [CO003] [CO004]
              [CO005] [CO006] [CO031] [CO032]


              The company is headquartered in Santa Barbara, California based on repeated 2024-2026 press datelines, and
              public materials show a distributed operating footprint with offices and teams across North America,
              Europe, Asia, and Australia. Public sources in this run do not provide a current 2026 employee count, so
              the most recent hard scale disclosure remains the company's August 2023 statement that it had more than
              1,000 employees. That makes workforce size a diligence gap rather than a number to carry forward as
              current fact. [CO003] [CO007] [CO030] [CO042]


              Stage-wise, LogicMonitor should be treated as a late-stage private software company under sponsor control
              rather than a venture-backed startup. Vista remains the controlling shareholder, PSG has stayed involved
              since 2016, and the November 2024 round mixed new equity with strategic financing rather than a plain
              venture growth round. That capital structure supports aggressive product expansion and M&A, but it also
              means later valuation work must separate equity value from debt-inclusive headline valuation. [CO016]
              [CO017] [CO018] [CO019] [CO021]
