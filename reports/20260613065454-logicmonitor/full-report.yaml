    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-ready scorecard across eight dimensions from market relevance to evidence quality.
    data:
      items:
        - label: Market relevance
          value: 8/10
          note: Observability, AI operations, and data-center modernization remain attractive categories.
        - label: Scale proof
          value: 8/10
          note: ARR > $400M and sponsor support are strong scale markers.
        - label: AI monetization proof
          value: 7/10
          note: Bookings and recurring-growth signals are strong, but private economics are missing.
        - label: Channel / ecosystem depth
          value: 7/10
          note: AWS and Deutsche Telekom reinforce enterprise relevance.
        - label: Capital-stack clarity
          value: 3/10
          note: Debt and preference overhang remain opaque.
        - label: Unit-economics visibility
          value: 3/10
          note: No public NRR, gross margin, or free-cash-flow proof.
        - label: Risk profile
          value: 4/10
          note: Security and reliability trust debt still matter.
        - label: Valuation support
          value: 6/10
          note: The last public mark looks fair on current evidence, but not clearly attractive.
    approximationNotes: >-
      Scores are analyst synthesis of the cited public record and are meant for comparative decision support rather than
      as a quantitative model output.
