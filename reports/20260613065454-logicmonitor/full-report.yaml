  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Decision chain from disclosed scale and strategic breadth through public discount factors to the current Track /
      Research More stance.
    data:
      nodes:
        - id: n1
          label: Scale proof
          description: >-
            ARR > $400M and sponsor-backed platform scale establish that LogicMonitor is a real enterprise software
            asset.
        - id: n2
          label: AI / product proof
          description: Edwin AI contributes one-third of bookings and Catchpoint broadens internet and digital-experience coverage.
        - id: n3
          label: Channel / ecosystem proof
          description: AWS and Deutsche Telekom relationships show enterprise distribution relevance.
        - id: n4
          label: Valuation anchor
          description: Last public financing set a roughly $2.4B valuation including debt.
        - id: n5
          label: Discount factors
          description: Debt/preference opacity, no public NRR or margin data, and security/reliability trust debt constrain upside.
        - id: n6
          label: Stance
          description: TRACK / RESEARCH MORE with fair valuation stance and high risk rating.
      edges:
        - from: n1
          to: n4
