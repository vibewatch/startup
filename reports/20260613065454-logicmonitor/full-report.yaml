      - number: '2.2'
        title: Market sizing lenses and contradictory public estimates
        blocks:
          - type: paragraph
            body: >-
              Public market sizing should be treated as a range, not a single canon number. Mordor Intelligence
              estimates the global observability market at $3.35 billion in 2026, while Business Research Insights puts
              the 2026 observability tool market at $4.35 billion; both numbers are plausible, but they likely use
              different inclusion rules. The divergence widens sharply when analysts broaden the frame to AIOps. The
              Business Research Company places AIOps at $11.08 billion in 2025 and $41.6 billion by 2030, while
              ResearchAndMarkets places 2026 AIOps at $19.33 billion. Those larger figures matter because LogicMonitor's
              product story increasingly points toward alert reduction, event correlation, and guided remediation, but
              they are not directly comparable to narrower observability-tool estimates. The cleanest
              evidence-constrained takeaway is that LogicMonitor plays in a core observability market measured in low
              single-digit billions today, with a larger adjacent automation budget if buyers accept AI-assisted
              operations as part of the same control plane.
