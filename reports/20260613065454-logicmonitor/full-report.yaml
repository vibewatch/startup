      - number: '8.5'
        title: Final diligence asks and what would change the view
        blocks:
          - type: paragraph
            body: >-
              The missing diligence items are precise enough to drive decision rules. Investors need the actual debt and
              preference stack, not just the headline valuation; they need NRR, GRR, gross margin, and free-cash-flow
              evidence, not only ARR and bookings rhetoric; and they need proof that security trust debt has not
              migrated into renewal friction among large accounts. They also need direct economics on Edwin AI attach,
              Catchpoint cross-sell, partner-sourced growth, and whether AWS-aligned migration work actually produces
              durable software value instead of services-heavy complexity.


              If management can show a manageable capital stack, strong retention, credible margin structure, and real
              expansion economics from AI plus Catchpoint, the recommendation could improve to BUY on the next
              refresh—especially if entry remains close to the last public mark. If those answers are weak, or if
              adverse operational signals worsen before private metrics improve, the correct posture moves from TRACK to
              AVOID. For now, the public record supports interest and continued diligence, but not conviction capital
              above the known valuation anchor.
            claimRefs:
              - CV012
