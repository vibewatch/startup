  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Public threshold / signal
      - Why it matters
      - Expected valuation effect
      - Action implication
      - Monitoring source
    rows:
      - - Repeat security failure
        - Another customer-impacting security incident or credible proof that collectors remain a practical attack path.
        - Would deepen trust debt in a renewal-heavy enterprise model.
        - Multiple compression below the current base case.
        - Pause investment or mark down immediately until root-cause and retention fallout are clear.
        - TechCrunch / SC Media / customer disclosures
      - - Worsening outage cadence
        - Material business-hour access disruption or rising incident cadence beyond current noise levels.
        - A monitoring vendor loses credibility quickly when its own control plane is unstable.
        - Public-risk discount widens and slows any IPO or strategic process.
        - Treat as a red flag on underwriting quality and customer reference durability.
        - LogicMonitor status page / IsDown
      - - AI monetization disappoints
        - Edwin AI remains a bookings story without attach, retention, or margin proof.
        - The valuation premium case depends on AI changing economics, not only positioning.
        - Bull case falls back toward base or bear multiple bands.
        - Do not pay above the last public mark without cohort evidence.
        - LogicMonitor reporting / diligence room
      - - Catchpoint integration underwhelms
        - No evidence of cross-sell or higher-quality enterprise expansion from the acquisition.
        - Platform breadth would read as complexity rather than moat.
        - Reduces support for premium multiple expansion.
        - Discount synergy claims in any upside case.
        - LogicMonitor / Catchpoint / customer interviews
      - - Capital stack proves heavy
        - Debt, preferred protections, or liquidation waterfalls absorb much of headline enterprise value.
        - The entry price could look fine at EV level but poor at common-equity level.
        - Equity upside compresses even if enterprise value holds.
        - Re-cut return model before any commitment.
        - Cap table / lender docs
      - - Weak retention quality
        - Large-account renewals or expansion are materially weaker than public proxies imply.
        - A renewal-heavy story breaks if retention quality is soft.
        - Moves valuation toward Elastic/PagerDuty-style bands or below.
        - Downgrade quickly unless price resets.
        - Cohort retention and churn schedules
    notes: >-
      Every trigger is phrased as an observable underwriting event so the chapter can be refreshed against concrete
      evidence rather than narrative drift.
    claimRefs:
      - CV018
      - CV019
      - CV021
      - CV022
      - CV043
      - CV044
      - CV046
      - CV052
      - CV053
      - CV055
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Upgrade / downgrade impact
      - Diligence path
    rows:
      - - Debt and preference stack
        - Debt quantum, lender terms, preference seniority, liquidation waterfall.
        - Determines whether the headline 2.4B mark is investable common equity or mostly senior capital.
        - Best single upgrade lever if the stack is cleaner than feared; major downgrade if heavy.
        - Request cap table, debt schedule, financing docs, and waterfall model.
      - - Retention quality
        - NRR, GRR, churn, and renewal cohorts by customer size and channel.
        - Public ARR scale is not enough without proof that large accounts renew cleanly.
        - Upgrade if retention is strong; downgrade if trust debt shows up in expansion or churn.
        - Request customer cohort files and renewal bridge.
      - - Margin structure
        - Gross margin, support burden, cloud-cost intensity, and free cash flow.
        - Needed to know whether LogicMonitor deserves a Dynatrace-style or Elastic-style band.
        - Upgrade if margins show real software leverage; downgrade if services/cloud burden is heavy.
        - Request audited income statement detail and cost-of-revenue bridge.
      - - Edwin AI economics
        - Attach rate, AI ARR, cohort retention, expansion versus non-AI cohorts.
        - Separates monetization reality from marketing narrative.
        - Upgrade if AI improves net retention and ACV expansion; no premium if it does not.
        - Request AI product cohort analytics and pricing realization.
      - - Catchpoint synergies
        - Cross-sell conversion, win-rate impact, and platform-adoption evidence after acquisition.
        - The upside case assumes Catchpoint broadens the wallet and moat.
        - Upgrade if cross-sell is real; downgrade if integration adds cost without higher retention.
        - Request product-line expansion dashboards and sales win/loss analysis.
      - - Security / reliability remediation
        - Post-2023 control changes, incident histogram, customer communications, and renewal fallout.
        - Trust debt is the cleanest non-financial reason the multiple could compress.
        - Upgrade if remediation is robust and customers stayed; downgrade if incidents still affect renewals.
        - Request security remediation timeline, incident summaries, and affected-account retention review.
    notes: >-
      These asks focus on the exact private artifacts required to turn a fair public mark into either a buyable entry or
      an avoidable cap-table trap.
    claimRefs:
      - CV043
      - CV044
      - CV046
      - CV053
      - CV054
      - CV055
