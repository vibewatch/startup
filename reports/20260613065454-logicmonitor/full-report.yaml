      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The most relevant buyer set is multi-persona. Public filings from Datadog and ServiceNow show that
              observability decisions now touch development, operations, security, business, and workflow leaders, not
              just a legacy NOC manager. LogicMonitor's own collateral narrows that list further around ITOps, CloudOps,
              and MSP operations teams, while its MSP page makes clear that a managed-service provider can be the direct
              buyer and operator even though the economic value is realized across downstream client environments. Large
              enterprises remain the biggest spend anchor in third-party market data, which suggests enterprise
              infrastructure leaders still control the largest budgets, but FinOps and Cloud Center of Excellence
              structures increasingly influence whether telemetry growth is approved. In practice, the adoption path
              starts with visibility gaps in hybrid estates, then expands toward standardization, cross-team workflows,
              and AI-assisted incident handling once a buyer believes the platform can reduce complexity rather than add
              another screen.
