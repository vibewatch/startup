      - number: '8.3'
        title: Bull, base, and bear ranges with return logic
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a relatively tight base case and a much wider downside and upside than the
              headline growth story suggests. The bear case assumes public risk factors matter more than management
              narrative: no convincing proof that Edwin AI or Catchpoint meaningfully lift net retention, no visibility
              into debt/preference overhang, and a continued trust discount from security and reliability history. In
              that case, investors could value LogicMonitor closer to slower or lower-confidence software comp bands,
              producing a range of roughly 1.4 billion USD to 1.9 billion USD.


              The base case assumes ARR remains moderately above 400 million USD, partner distribution stays healthy,
              and the company maintains strategic relevance without proving a public-company-quality margin profile.
              That supports a range of about 2.2 billion USD to 2.9 billion USD, or only modest upside from the last
              public mark. The bull case requires more than simple growth continuity: investors need evidence that
              Catchpoint broadens wallet share, Edwin AI raises booked value and retention quality, and there are no
              fresh trust shocks. Only then does a 3.3 billion USD to 4.3 billion USD range become supportable. The key
              point is that public evidence does not currently justify underwriting venture-style upside from the known
              entry point; it justifies disciplined scenario sizing.
            claimRefs:
