      - number: '1.3'
        title: Capital stack, ownership, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor's latest disclosed financing event was the November 20, 2024 announcement of an $800 million
              investment consisting of new equity and strategic financing from PSG, Golub Capital, and other investors,
              while Vista remained controlling shareholder. Multiple sources around that transaction place headline
              valuation at roughly $2.4 billion including debt. TechCrunch said the round brought total capital raised
              to about $942 million. The inclusion of debt in the valuation headline and the absence of disclosed
              financing covenants are both important: the company clearly has scale and sponsor access, but headline
              value should not be read as a clean common-equity mark. [CO016] [CO017] [CO018] [CO019] [CO020]


              The 2024 transaction also clarifies who matters economically. Vista is the control owner, PSG is a
              long-duration minority backer dating to 2016, and Golub Capital appears as an important lender/strategic
              financing participant rather than a conventional software-growth equity sponsor. Operationally, the other
              critical stakeholder groups are the enterprise customer base, the MSP and channel ecosystem, and the
              executive team that is turning AI positioning into booked revenue. This mix makes LogicMonitor less
              dependent on a single product or geography than many infrastructure-software peers, but it also
              concentrates power with financial sponsors and management rather than with any visible public-market
              discipline. [CO005] [CO016] [CO017] [CO018] [CO019] [CO038] [CO039]


              The business appears to be monetizing its AI layer rather than simply talking about it. ARR moved from
              more than $300 million in November 2025 to more than $400 million by May 2026, and Edwin AI was
              contributing roughly one-third of total bookings while growing approximately 200% year over year. That is
              meaningful evidence that LogicMonitor's AI narrative is not only aspirational, though the company still
              does not disclose audited revenue, margins, or debt service terms publicly. [CO025] [CO026] [CO027]
