    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: Sensitivity of implied enterprise value to disclosed ARR floors and multiple bands visible in public comps.
    data:
      items:
        - label: 400M ARR at 4.0x
          value: 1.6
          note: Bear-like lower public comp band.
        - label: 400M ARR at 6.0x
          value: 2.4
          note: Roughly equal to the last public headline mark.
        - label: 400M ARR at 8.0x
          value: 3.2
          note: Requires premium multiple support without much more scale.
        - label: 450M ARR at 6.0x
          value: 2.7
          note: Base-case upside if growth holds and the multiple does not compress.
        - label: 450M ARR at 8.0x
          value: 3.6
          note: Needs clear AI/Catchpoint expansion proof.
        - label: 500M ARR at 8.5x
          value: 4.25
          note: Bull case requiring stronger growth and a premium re-rating.
    approximationNotes: >-
      Values are simple ARR-times-multiple sensitivity points using the company’s public ARR floor and public comp
      bands; debt and preference overhang can reduce common-equity outcomes below these enterprise-value points.
