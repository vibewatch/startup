      - number: '3.3'
        title: Switching costs, distribution power, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              The fetched evidence argues against any claim that observability vendors still control customers through
              proprietary instrumentation alone. OpenTelemetry explicitly promises “instrument once” portability, the
              vendor registry shows that almost every major platform in this chapter consumes OTLP, and Prometheus
              remains a credible open-source metrics baseline. In practice, that means telemetry portability is
              improving across the category, so hard lock-in is weaker than it was in earlier monitoring generations.
              Buyers can multi-home or migrate over time without re-instrumenting every application from scratch.
              [CP033] [CP034] [CP035] [CP039]


              That pushes competitive durability toward workflow embedding and route-to-market. LogicMonitor’s MSP page,
              multi-tenant claims, and packaged integrations with PSA and enterprise systems matter because they embed
              the product into recurring service delivery. ServiceNow’s ITSM linkage matters for the same reason from
              the opposite direction: once observability is connected to service maps, workflows, and autonomous
              remediation inside the workflow system of record, displacement becomes political and process-heavy as much
              as technical. Cisco-Splunk adds a similar bundle risk through broader enterprise account control.
              LogicMonitor can still win, but the durable advantage is operational fit and partner leverage, not a
              unique telemetry protocol. [CP005] [CP006] [CP020] [CP027] [CP028] [CP040] [CP043] [CP044] [CP047]
            claimRefs:
