  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform scope and operator workflow
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor’s product is now best understood as an operator workflow platform rather than a single
              monitoring SKU. LM Envision is the top-level control plane: it promises one unified view across clouds,
              data centers, apps, and services, bundles 3,000+ integrations, and explicitly pairs classic observability
              with agentic AIOps under the Autonomous IT narrative. Public material also shows that the company is
              trying to move up the value stack from alert visibility to incident execution: Edwin AI is marketed as the
              layer that summarizes, reasons about, and helps resolve incidents instead of just surfacing dashboards.
              Catchpoint is strategically important because it extends the monitored universe beyond owned
              infrastructure into Internet paths, synthetic monitoring, and real-user experience, which makes the
              autonomous-operations pitch more credible for customer-facing systems. [CE001] [CE002] [CE003] [CE005]
              [CE006] [CE007] [CE008]


              In customer-workflow terms, LogicMonitor serves multiple operator personas at once. NOC and infrastructure
              teams start with collector-based telemetry and out-of-the-box LogicModules; platform and SRE teams add
              topology and service context; service owners and ITSM teams consume service-level health and ticketing
              hooks; and AI-assisted workflows sit on top to correlate third-party events and recommend or trigger next
              actions. That layering matters because it means LogicMonitor is not merely a device-monitoring tool with
              an AI wrapper. The documented workflow is collect, normalize, contextualize, correlate, then act. Service
              Insights, topology mapping, Edwin integrations, and marketplace/onboarding materials all reinforce that
              design. [CE009] [CE010] [CE011] [CE012] [CE013] [CE014] [CE015]
