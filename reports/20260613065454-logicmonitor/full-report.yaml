    title: Valuation / return range
    type: range
    layout: standard
    summary: Bear, base, and bull valuation ranges with midpoint outcomes relative to the last disclosed mark.
    data:
      items:
        - label: Bear case
          low: 1.4
          mid: 1.65
          high: 1.9
          note: Trust discount persists; flat growth; low-band software multiple.
        - label: Base case
          low: 2.2
          mid: 2.55
          high: 2.9
          note: ARR stays above $400M and the multiple lands near adjusted mid-tier public comp bands.
        - label: Bull case
          low: 3.3
          mid: 3.75
          high: 4.3
          note: AI plus Catchpoint visibly improve expansion quality and the market tolerates a premium band.
    approximationNotes: >-
