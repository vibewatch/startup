  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer mix and visible buying segments
        blocks:
          - type: paragraph
            body: >-
              LogicMonitor's public customer evidence points to a customer base centered on mid-market and enterprise IT
              teams plus managed service providers rather than on self-serve SMB buyers. The partner program explicitly
              separates VARs, MSPs, and strategic technology partners, while the customer and case-study pages showcase
              hybrid-observability use cases in education, media, healthcare infrastructure, financial services,
              manufacturing, digital-native CPG, and MSP operations. That matters because it shows the product is
              usually bought where operational complexity is already high and the pain of fragmented monitoring is
              expensive. The practical buyer is typically an infrastructure, NOC, platform, or managed-services leader;
              the end user is an operations engineer or analyst; and the internal economic buyer is often an IT or
              operations budget owner rather than an individual developer. [CU001] [CU002] [CU003] [CU004]


              Public breadth is visible but should be interpreted carefully. The customer page says LogicMonitor serves
              more than 2,000 customers globally, the case-study library displayed 94 stories on the run date, and
              Landbase's third-party install-data sample lists 408 verified companies including very large global
              enterprises such as Samsung, Engie, NTT Data Group, Walgreens Boots Alliance, Roche, and Capgemini. Those
              signals together show broad market presence, but they are not interchangeable. The company-reported count
              is a marketing snapshot, the case-study count is a curated proof library, and the third-party 408-company
              figure is only a sampled install base. Together they prove breadth of adoption; they do not prove active
              production depth or revenue balance by segment. [CU005] [CU006] [CU007]
