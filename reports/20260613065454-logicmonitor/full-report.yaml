      - number: '1.2'
        title: Leadership, governance, and key-person dependencies
        blocks:
          - type: paragraph
            body: >-
              The current executive bench is unusually broad for a company still privately held: Christina Kosmowski
              leads as CEO, John Grosshans runs field operations, Carol Lee oversees finance, Garth Fort owns product,
              Julie Solliday owns customer operations, Brooke Cunningham leads marketing, Yvonne Schroeder leads legal,
              Karthik SJ leads AI, and Ashley Kanok runs IT. That breadth lowers single-function risk versus founder-led
              SaaS peers, but LogicMonitor still appears meaningfully dependent on Kosmowski's market-facing role
              because almost every major 2024-2026 company announcement ties strategic direction, fundraising, and AI
              positioning directly to her. [CO008] [CO009] [CO010] [CO011] [CO012] [CO013] [CO014] [CO015]


              The most visible recent leadership change was the November 2025 hire of John Grosshans as President of
              Field Operations, consolidating sales, marketing, customer success, and channels under one executive. That
              addition is strategically important because it coincided with the company's ARR crossing $300 million and
              with a go-to-market narrative framed around AI-led observability leadership. In other words, the company
              did not simply add another sales executive; it inserted a scale operator while moving from observability
              tooling toward a broader Autonomous IT platform story. [CO009] [CO027] [CO028] [CO031]


              Governance transparency is weaker than executive transparency. The public leadership page is detailed, but
              the fetched source set does not provide a current full board roster or sponsor-governance terms. Investors
              can still infer sponsor-led governance from Vista's control position and PSG's continuing influence, yet
              the absence of a public board list means board committee composition, independent director depth, and
              sponsor consent rights all remain diligence asks rather than established facts. [CO016] [CO017]
