evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, voting control, founder ownership, succession planning, and complete executive
      responsibilities.
    whyItMatters: >-
      Without governance documents, public founder visibility cannot establish formal control, oversight quality, or
      key-person mitigation.
    diligencePath: >-
      Request the charter, bylaws, board minutes, voting agreements, cap table, succession plan, and current
      organization chart.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: >-
      Preferred terms, liquidation stack, ownership percentages, secondaries, debt facilities, covenants, cash balance,
      and runway.
    whyItMatters: Headline funding and valuation do not reveal dilution, downside preference, liquidity, or financing risk.
    diligencePath: >-
      Request financing documents, the fully diluted cap table, debt schedules, covenant certificates, and a current
      treasury report.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Current recognized revenue, audited ARR, revenue mix, active-customer denominator, headcount, gross margin, burn,
      retention, and churn.
    whyItMatters: >-
      Mixed-vintage public scale markers cannot establish current growth quality, capital efficiency, or customer
      durability.
    diligencePath: >-
      Reconcile audited financials, ARR bridge, customer cohorts, payroll roster, and board KPI packs through September
      2026.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: litigation
    missingEvidence: >-
      Current docket, pleadings, rulings, settlement terms, dismissal status, damages exposure, and any injunction
      involving Popmenu.
    whyItMatters: >-
      The 2025 complaint and denial establish a dispute but do not establish liability, resolution, or continuing
      product restrictions.
    diligencePath: Obtain the case number and current California Superior Court docket, then review filings with litigation counsel.
    relatedQuestionRefs:
      - QO006
  - type: conflicting-data
    severity: material
    topic: tam-segmentation
    missingEvidence: >-
      Audited breakdown of addressable software spend specifically attributable to independent restaurants versus
      enterprise franchise brands.
    whyItMatters: >-
      Third-party estimates conflate multi-unit enterprise IT budgets with single-store independent software capacity,
      distorting true SAM.
    diligencePath: Acquire operator benchmarking studies cross-referencing annual software spend per independent restaurant unit.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: guest-fee-churn
    missingEvidence: >-
      Longitudinal data on consumer drop-off or order abandonment caused by the 5% guest support fee on direct ordering
      checkout.
    whyItMatters: >-
      Excessive guest-side fee visibility may counteract first-party pricing advantages and degrade repeat direct order
      conversion.
    diligencePath: Review merchant checkout funnel analytics comparing guest drop-off between Flex and Flat-Rate merchants.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: churn-and-displacement
    missingEvidence: >-
      Private cohort data detailing customer churn and displacement rates between Owner.com and POS-native online
      ordering modules like Toast Online Ordering.
    whyItMatters: >-
      Determines whether Owner.com sustains durable retention as POS incumbents bundle ordering and marketing tools into
      core subscriptions.
    diligencePath: Request customer cohort retention and POS overlay displacement statistics during management diligence.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: minor
    topic: litigation-outcome
    missingEvidence: >-
      Current docket filings and judicial rulings regarding the Popmenu v. Owner.com California Superior Court
      litigation.
    whyItMatters: >-
      Clarifies whether injunctions or damages could restrict Owner.com's automated marketing and website grading
      acquisition funnels.
    diligencePath: Review California Superior Court docket updates for case status, discovery orders, or settlement terms.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: >-
      Detailed audited breakdown of GAAP gross margin, hosting and third-party delivery dispatch costs, and customer
      support service delivery expense.
    whyItMatters: >-
      Gross margin determines whether Owner.com's $499/mo subscription and $4 flat delivery fee can generate
      software-grade 70%+ gross profits or face hardware/service drag.
    diligencePath: >-
      Request confidential contribution margin schedule and unit economics bridge during access-controlled underwriting
      diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-retention-and-cash-burn
    missingEvidence: >-
      Historical cohort retention, net revenue retention (NRR), annual logo churn, current cash balance, and monthly net
      cash burn rate.
    whyItMatters: >-
      Independent restaurant annual closure rates often exceed 15-20%, creating an inherent churn headwind that requires
      high expansion revenue or constant BDR replacement.
    diligencePath: Audit monthly cohort retention waterfall and covenant terms from the May 2025 Series C financing ledger.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-api-and-custom-integrations
    missingEvidence: >-
      Public developer documentation, OpenAPI/REST API specifications, webhook reference, and developer portal access
      for third-party software integrations.
    whyItMatters: >-
      Independent restaurants using bespoke inventory tools, third-party delivery dispatchers, or enterprise POS systems
      cannot verify integration extensibility without published API documentation.
    diligencePath: >-
      Request Owner.com developer documentation, API partner agreements, and technical webhook specifications during
      diligence interviews.
    relatedQuestionRefs:
      - QE009
  - type: access-blocked
    severity: minor
    topic: pos-transmission-telemetry
    missingEvidence: >-
      Unfiltered production telemetry measuring error rates and dropouts on order transmission between Owner.com and
      legacy POS hardware (Toast, Clover).
    whyItMatters: >-
      Review complaints highlight occasional failed order handoffs to POS kitchen printers, but vendor-level sync uptime
      and transmission failure rates are not publicly reported.
    diligencePath: Review vendor status page incident history, POS integration error log metrics, and customer support ticket logs.
  - type: private-evidence-only
    severity: material
    topic: retention-mechanism
    missingEvidence: Current GRR, NRR, logo churn, renewal, contract-tenure, closure-adjusted retention, and cohort expansion data.
    whyItMatters: Selected wins and a claimed repeat-order lift cannot establish portfolio durability or recurring-revenue quality.
    diligencePath: >-
      Request monthly customer and revenue cohorts for at least 24 months, with restaurant closures, downgrades, product
      attach, and reactivations separated.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Revenue and gross-profit concentration by top customers, segment, location count, geography, acquisition channel,
      and partner.
    whyItMatters: A large restaurant count can coexist with material concentration or channel dependence.
    diligencePath: Obtain anonymized customer-level ARR and gross-profit data, top-10 concentration, and channel-attributed cohorts.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-outcomes
    missingEvidence: >-
      An exhaustive customer-reference list and independent reconciliation of the sales, order, savings, and growth
      outcomes shown in Owner's selected stories.
    whyItMatters: >-
      Selected company-issued outcomes do not reveal the distribution of results, failed deployments, or typical time to
      value.
    diligencePath: >-
      Select a stratified customer sample from the full roster and verify baseline, period, attribution, fees, churn
      status, and current production use directly with customers.
    relatedQuestionRefs:
      - QU003
      - QU006
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: switching
    missingEvidence: >-
      Current win-loss data, switching rates, migration duration, data portability, implementation burden, and
      customer-initiated reasons for evaluating alternatives.
    whyItMatters: Competitor marketing and company time-to-value claims do not establish actual procurement or switching friction.
    diligencePath: >-
      Review CRM win-loss records and interview churned, recently onboarded, and renewal-stage restaurants selected
      independently of management.
    relatedQuestionRefs:
      - QU010
  - type: private-evidence-only
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: >-
      Audited financial statements, monthly gross and net burn rates, cash balance, and debt covenant terms following
      the May 2025 Series C financing.
    whyItMatters: >-
      Without visibility into net burn and cash reserves, investors cannot confirm whether the $120 million round
      provides sufficient runway to reach cash-flow breakeven at current growth rates.
    diligencePath: >-
      Request audited GAAP balance sheets, trailing twelve-month cash flow statements, and debt facility agreements in
      the management data room.
    relatedQuestionRefs:
      - QR008
  - type: enumeration-incomplete
    severity: material
    topic: litigation-and-regulatory-records
    missingEvidence: >-
      Complete California Superior Court docket entries, initial discovery filings, and cross-state trademark/licensing
      search records for Owner.com.
    whyItMatters: >-
      Ongoing litigation with Popmenu creates potential liability for damages or injunctive relief restricting
      Owner.com's core lead-generation marketing funnel.
    diligencePath: >-
      Obtain certified docket transcripts from California Superior Court and conduct formal litigation diligence with
      external IP and advertising counsel.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: retention-and-liquidation-stack
    missingEvidence: >-
      Audited cohort net retention rates, gross margins, and liquidation preference overhang details from the Series C
      round
    whyItMatters: >-
      Without retention and preference structure disclosures, underwriting a $1.0B valuation multiple creates downside
      risk for common equity holders
    diligencePath: >-
      Request confidential cap table summaries, investor preference rights, and audited cohort retention schedules in
      diligence
    relatedQuestionRefs:
      - QV009
  - type: conflicting-data
    severity: minor
    topic: revenue-run-rate-reconciliation
    missingEvidence: Reconciliation between reported $40M ARR and claimed $81M revenue run-rate across subscription versus payments mix
    whyItMatters: >-
      Payment volume take rates yield significantly lower gross margins than pure software subscription revenues,
      altering multiple justification
    diligencePath: >-
      Review merchant transaction processing volume statements and revenue recognition schedules during confirmatory
      diligence
