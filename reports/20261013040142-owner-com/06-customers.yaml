    title: Company-described customer adoption and expansion loop
    type: journey-map
    summary: >-
      Owner's product surfaces form a six-step acquisition-to-repeat-order loop, but public
      evidence does not quantify conversion or retention between stages.
    data:
      nodes:
        - id: discovery
          label: Local discovery
          detail: "SEO and review volume are intended to increase restaurant visibility."
          touchpoints: ["Restaurant website", "Google rankings", "Google reviews"]
        - id: direct-order
          label: Direct order
          detail: "Guests place orders through the restaurant's owned website or app."
          touchpoints: ["Online ordering", "Restaurant website"]
        - id: data-capture
          label: Customer capture
          detail: "Direct orders add guests to the restaurant's customer list."
          touchpoints: ["Order data", "Customer list"]
        - id: app-adoption
          label: App adoption
          detail: "Mobile visitors are prompted toward the restaurant's branded app."
          touchpoints: ["Mobile website", "Branded app"]
        - id: lifecycle-marketing
          label: Lifecycle marketing
          detail: "Marketing and loyalty tools seek to reactivate captured guests."
          touchpoints: ["Email", "SMS", "Loyalty"]
        - id: repeat-and-review
          label: Repeat order and review
          detail: "Repeat ordering and post-order review requests are intended to reinforce demand."
          touchpoints: ["Repeat order", "Automated review request"]
    approximationNotes: "Conceptual mechanism assembled from company descriptions; no stage conversion rates or comparable cohort denominators were disclosed."
    claimRefs: [CU009, CU013, CU014, CU016]
callouts:
