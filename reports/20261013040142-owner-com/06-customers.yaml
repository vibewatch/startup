      - ["Karv Greek Kouzina", "Independent restaurant", "Online ordering and repeat-order workflow", "Owner presents an operating customer story", "$40,000 monthly online sales and +300% growth", "Company-issued; period, baseline, and counterfactual are not disclosed"]
      - ["Mattenga's Pizzeria", "Independent pizzeria", "Online ordering and growth platform", "Owner presents an operating customer story", "$192,000 sales growth in 30 days and 15,000 more online orders", "Company-issued; incremental definition and reconciliation are not disclosed"]
      - ["Talkin Tacos", "Independent restaurant brand", "Direct online sales and marketing", "Owner presents an operating customer story", "$7 million direct online sales and +970% growth", "Company-issued cumulative result; timing, baseline, and location coverage are not disclosed"]
    notes: "Representative sample of named cases on Owner's case-study page, not an exhaustive customer list; outcomes are company-issued and were not independently corroborated."
