    title: Retention is not demonstrated by selected customer outcomes
    body: >-
      Public scale and named wins show adoption, but they do not disclose GRR, NRR, logo churn,
      renewals, closure-adjusted retention, concentration, or the distribution of customer ROI.
    claimRefs: [CU003, CU005, CU006, CU007, CU008, CU010]
