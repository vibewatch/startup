company:
  name: Owner.com
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Owner.com is a restaurant-focused vertical SaaS company whose public product surface now
    spans websites, direct ordering, marketing, loyalty, SEO, reviews, mobile apps, and POS.
    Independent reporting supports a $120 million Series C at a $1 billion valuation, but
    recognized revenue, governance, financing terms, and the outcome of a competitor lawsuit
    remain material diligence gaps.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Owner.com sells a restaurant-focused software platform rather than a single ordering
      widget. Its own current pages describe an integrated package of websites, ordering,
      branded mobile apps, loyalty, marketing, catering, SEO, review generation, support, and
      POS. The commercial model is publicly legible: a $249-per-month flexible plan adds a 5%
      restaurant fee per order, while a $499-per-month flat plan removes that restaurant fee;
      both are offered month to month. These are company-published terms, not independently
      audited economics. Independent reporting calls the business restaurant SaaS, while the
      exact headquarters and legal-entity footprint were not established by the allocated
      sources. The snapshot therefore separates dated reported scale from unavailable metrics
      instead of treating funding, ARR, revenue, and cash as interchangeable.
    claimRefs: [CO001, CO002, CO003, CO012, CO013, CO016]
    tableRefs: [TO001]
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      Inc. reports that Adam Guild launched Owner.com as a full-fledged business in 2017 and
      later brought in Dean Bloembergen as co-founder and CTO after Owner combined with
      Bloembergen's restaurant-kiosk company, Marble. A separate operating profile describes
      Guild and Bloembergen as the founders but dates the company to 2018, so the public record
      supports the people more strongly than a single unambiguous founding date. Guild remains
      the visible chief executive and central origin-story figure, creating plausible
      key-person concentration. That observation is not a conclusion about formal control:
      the assigned evidence does not identify a complete board, voting rights, succession plan,
      or current executive roster. Those documents are required before underwriting governance
      quality or founder dependence.
    claimRefs: [CO004, CO005, CO006]
    tableRefs: [TO002]
  - id: financing-scale-and-stakeholders
    title: Financing, scale, and stakeholders
    body: >-
      The financing record shows a capitalized late-stage private company. Inc. reports a
      $3.5 million 2020 pre-seed led by Redpoint, with Kimbal Musk and Naval Ravikant among early
      investors. Verdict reports a $33 million Series B in January 2024 and a $120 million
      Series C in May 2025 at a $1 billion valuation, led by Meritech and Headline. Inc. later
      reported $189 million raised and 275 employees as of September 2025. Those figures are
      funding and staffing snapshots, not cash available or current headcount. Likewise, an
      independent sales-operations newsletter's roughly $40 million ARR figure is directional
      and cannot be substituted for recognized revenue. Public sources do not disclose
      preference terms, dilution, secondaries, debt, cash balance, or board rights.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
  - id: milestones-and-adverse-record
    title: Milestones and adverse record
    body: >-
      The milestone sequence is consistent with a pandemic-era shift into direct restaurant
      commerce followed by larger institutional rounds and expansion into a broader restaurant
      operating stack. It also contains two cautions. First, otherwise credible profiles differ
      on whether the founding marker is 2017 or 2018, so both dates are preserved. Second,
      Popmenu sued Owner in 2025 over allegations that Owner's website grader and comparisons
      were inaccurate and harmful; Owner denied the allegations as those of an unhappy
      competitor. This is evidence of a contested claim, not an adjudicated finding. The
      allocated material does not establish the current docket status, damages, settlement,
      dismissal, or injunction, so no inference is made that the dispute has ended.
    claimRefs: [CO004, CO005, CO007, CO008, CO009, CO014, CO015, CO016]
    figureRefs: [FO001]
