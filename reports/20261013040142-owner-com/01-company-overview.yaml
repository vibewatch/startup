callouts:
  - calloutType: risk
    title: Public scale does not resolve private-company underwriting
    body: >-
      The $1 billion round valuation, $189 million raised, roughly $40 million reported ARR,
      275 employees, and more than 10,000 restaurants come from different sources and periods.
      None establishes current recognized revenue, cash, burn, retention, or liquidation terms.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
  - calloutType: risk
    title: Competitor allegations remain unresolved in the assigned record
    body: >-
      Popmenu's complaint and Owner's denial establish a live adverse issue as of the 2025
      report, but they do not establish liability or the case's current disposition.
    claimRefs: [CO014, CO015]
