    title: "Incumbent POS Bundling and Multi-Homing Friction"
    body: "Independent restaurants face structural switching costs when selecting Owner.com alongside existing POS systems. While Owner integrates with Toast and Clover, restaurants without deep native integration must manage orders via separate tablet hardware, exposing Owner to displacement if incumbents upgrade their bundled online ordering and marketing modules."
