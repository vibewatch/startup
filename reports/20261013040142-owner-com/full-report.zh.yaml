  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现机制
        blocks:
          - type: paragraph
            body: >-
              Owner.com 采用双重变现架构：向独立餐厅经营者收取软件订阅费，同时推动直接交易量。基础收入来源是公开标价每月 $499 的固定 SaaS 订阅，即约 $6,000 的基准年度合同价值。订阅将 AI
              优化餐厅网站、在线点单界面、CRM、自动营销活动和品牌顾客忠诚度项目整合在一个系统中。不同于通过复杂模块加购收费的传统餐厅软件厂商，也不同于对食品销售收取 15% 至 30%
              商户佣金的传统配送聚合平台，Owner.com 将其产品定位为商户免佣金在线点单。交易变现来自每笔配送履约订单向用餐顾客直接收取的 $4 配送费。这一定价应对独立餐厅的成本压力，也符合行业调查：49%
              的餐厅食客认为第三方聚合平台配送附加费过高，45% 会因结账时出现意外费用而放弃订单。
