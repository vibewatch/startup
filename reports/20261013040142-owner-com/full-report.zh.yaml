      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              推动 Owner.com 收入快速增长的，是一套高度纪律化的 外呼 销售体系，目标是绕开 SMB 餐厅 SaaS 传统单位经济陷阱。行业过去普遍认为，合同规模低于 $30,000 时，销售开发代表不具经济性；但
              Owner.com 成功把 外呼 销售做到早期新增 ARR 的 79%，同时维持 $6,000 至 $9,000 的 ACV。在当前 GTM 管理下，销售组织采用严格的两名 BDR 对一名 AE
              比例，并用机器学习账户评分从据估计约 500,000 家美国独立餐厅中筛出 30,000 个优质目标。精准定位带来 0.13 的 CAC 比率；BDR 每月平均创造 $72,000 的 赢单 ARR，AE 则以
              1 至 7 天的加速销售周期完成交易。不过，这种激进获客姿态也带来摩擦：Popmenu 于 2025 年 5 月在加州高等法院提起商业诽谤和不正当竞争诉讼，指控 Owner.com 的自动 Restaurant
              Website Grader 产生误导性偏低的表现分数，以贬低竞品工具并迫使潜在客户转化。
