      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              从资本充足性和资产负债表角度看，Owner.com 已建立相当可观的融资储备，以支撑扩张目标。公司在 2024 年 1 月完成 $33 million Series B 后，于 2025 年 5 月完成由
              Meritech Capital 和 Headline 领投的 $120 million Series C，使累计股权融资达到 $179 million，headline 估值达到 $1
              billion。公司服务超过 10,000 家餐厅门店，报道的 2025 年中 ARR 为 $40 million，对应 25x ARR 的高估值倍数，要求执行几乎不出错并快速滚动资本。凭借 $120
              million 新股权资金和 0.13 的高效 CAC 比率，近期融资依赖和跑道耗尽风险看起来较低。但最终尽调结论仍必须受基础披露缺口约束：净收入留存、logo churn、相对于独立餐厅倒闭率的
              客户群耐久性以及净现金烧钱仍未披露。要评估 $1 billion 估值，需要进一步核验 客户群留存瀑布和毛利率走势。
