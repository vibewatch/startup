      - number: '3.2'
        title: 能力差异化、POS 共存与转换成本
        blocks:
          - type: paragraph
            body: >-
              Owner.com 的核心产品主张是获取直接数字订单并自动化顾客营销，而不是替代店内 POS 终端。传统 POS 主要负责订单路由、后厨显示流程和支付处理；Owner.com
              则把白标品牌移动应用、自动评价管理引擎和本地 SEO 组合起来，持续创造需求。替换既有 POS 会给繁忙餐厅经营者带来高昂转换摩擦，因此 Owner.com 通过维护与 Clover、Toast、Square
              的第三方集成，优先保证技术共存。当直接 POS 集成受限或不兼容时，经营者会使用专用平板接收订单。这种覆盖式架构能在几天而非几周内完成上线，但如果 POS 厂商成功扩展原生在线点单套件，Owner.com
              也会暴露于流程摩擦和被重新中介化的风险中。
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: 定价模式、打包经济与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              打包经济显示，Owner.com 与传统 POS 厂商存在明显商业分歧。Owner.com 按月提供 $499 的固定软件订阅，不设长期合同锁定或取消罚金，并直接转嫁标准支付处理费用。相比之下，传统 POS
              平台以补贴或低前期软件价格吸引客户，同时绑定多年合同和内嵌支付处理抽成。Toast 的基础软件每月收费 $0 至 $69 及以上，但强制两年合同、提前终止罚金和专有硬件依赖。Clover 同样把经营者绑定在 36
              个月合同中，处理费为 2.3% 至 3.5%，另加 10 cents。Trustpilot 等评价平台上的公开客户情绪显示，经营者越来越不满传统厂商的费用不透明、合同僵化和上线后的支持。Owner.com
              的透明固定费用对追求可预测性的高交易量独立餐厅有吸引力，但每月 $499 的门槛会让订单速度较低的小微经营者更难采用。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
