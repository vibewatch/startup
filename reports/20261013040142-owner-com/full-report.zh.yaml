  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与行业边界
        blocks:
          - type: paragraph
            body: >-
              餐饮科技的可服务市场分为后厨运营软件和前台直接顾客互动两部分。独立餐厅经营者面临极大商业压力：在持续的人工成本和通胀环境下，美国行业食品销售额预计 2026 年达到 $1.55 trillion，对应 15.8
              million 名从业人员。DoorDash、Uber Eats
              等大型配送平台虽然承接大量外卖交易，却向经营者收取两位数佣金，进一步侵蚀本已微薄的餐厅利润。因此，独立经营者积极寻找面向消费者的直接数字渠道，以重新掌握顾客关系和交易利润。过去，经营者需要把网站托管、在线菜单组件、客户关系管理和
              SMS 营销等零散工具拼在一起。现代垂直 SaaS 将这些流程并入单一直接点单引擎，用于获取自然搜索流量，把本地食客转化为高毛利的一方买家。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模、可服务支出与 TAM 视角
        blocks:
          - type: paragraph
            body: >-
              估算独立餐厅软件市场，需要把整个餐饮零售销售额与软件可服务的收入池拆开。在 $1.55 trillion 的整体餐饮行业中，离店数字食品销售构成约 $200 billion
              的宏观交易基础，其中独立及区域餐厅数字销售约为 $80 billion。若从纯软件授权角度假设，美国约有 300,000 家独立及小型多门店餐厅，每年在面向顾客的软件上支出 $3,000 至
              $10,000，则核心美国软件可服务市场约为 $1.5 billion 至 $2.5 billion。Owner.com 通过两档订阅变现：Flex 方案每月 $249，另加每单 5% 的抽成；Flat-Rate
              方案每月 $499。直接点单月交易额达到 $5,000 时达到盈亏平衡，超过这一门槛的经营者会转向固定定价。Owner.com 已通过 外呼 销售把 ARR 做到约 $40 million，ACV 为
              $8,000 至 $9,000；这只占独立餐厅软件市场个位数比例中的较小部分，仍有较大增长空间，但若商户流失持续与餐厅倒闭率绑定，市场天花板也会显现。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
