      - number: '5.4'
        title: 技术完整性、竞争诉讼与系统性脆弱点
        blocks:
          - type: paragraph
            body: >-
              尽管一体化平台已有商业进展，Owner.com 仍存在明显技术脆弱点、集成摩擦和法律风险。用户评价提到的主要运营风险是 POS 传输掉线。经营者称，线上订单偶尔无法可靠传到 Toast 或 Clover
              终端，导致高峰用餐时段订单限流和厨房履约延误。平台上线时能提供响应迅速的客户支持，但上线后的技术协助在排查第三方 POS API 变化时可能出现延迟。

              更突出的结构性和法律争议围绕 Owner.com 的自动获客工具展开。竞争对手 Popmenu 在加州高等法院起诉 Owner.com，指控其围绕 Restaurant Website Grader
              存在虚假广告、不正当竞争和商业诽谤。Popmenu 称，自动评分工具经常触发网站安全保护，导致扫描不完整，并给竞争餐厅网站打出人为压低的技术表现分数。Popmenu
              认为，这一机制会误导潜在买家，让他们相信竞品平台存在技术缺陷。这起诉讼凸显了在未经验证的第三方网站基础设施上运行自动算法评估工具所带来的法律和声誉风险。
            claimRefs:
              - CE005
