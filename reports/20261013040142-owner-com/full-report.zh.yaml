      - number: '4.3'
        title: 成本结构与定价变现
        blocks:
          - type: paragraph
            body: >-
              对 Owner.com 底层成本结构和变现可持续性的评估显示，其运营优势与严重的私有数据盲区并存。核心软件交付成本主要包括云基础设施、SMS 营销发送网关、AI 推理 API 和支付网关路由。Owner.com
              向餐厅收取可预测的固定费用，不承担商户支付处理风险，也不运营资本密集型配送车队，因此理论上软件贡献利润率应接近 70% 以上的标准垂直 SaaS 基准。此外，客户案例显示其商户
              商业进展不弱：多门店经营者称，从第三方聚合平台迁移后，直接在线销售额每月增加超过 $10,000。不过，实际定价因客户 客户群而异。单店餐厅支付标准 $499 月费，多门店和企业客户的 混合 ACV 为
              $8,000 至 $9,000。关键问题是，确切软件毛利率、支付处理 抽成分成和客户成功服务交付费用仍是保密私有数据，外部无法精确验证毛利质量。
            claimRefs:
