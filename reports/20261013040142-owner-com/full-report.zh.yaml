    title: 餐饮技术竞争定位：直接营销与店内 POS 深度
    type: quadrant
    summary: 比较直接订餐平台、传统 POS 厂商和配送聚合平台在直接数字营销成熟度与店内 POS 硬件深度上的相对定位。
