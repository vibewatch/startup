    summary: 公开里程碑展示了产品演进和融资规模，同时保留存在争议的成立日期及尚未解决的竞争对手诉讼。
    data:
      items:
        - date: '2017'
          label: Inc. 发布标记
          detail: Inc. 报道 Guild 将 Owner.com 作为完整业务推出。
          tone: neutral
          claimRefs:
            - CO004
        - date: '2018'
          label: 相互冲突的成立标记
          detail: Outbound Kitchen 将 2018 年列为成立年份。
          tone: risk
          claimRefs:
            - CO005
        - date: '2020'
          label: $3.5M 种子前轮
          detail: Redpoint 领投种子前轮；Kimbal Musk 和 Naval Ravikant 是早期投资者。
          tone: positive
          claimRefs:
            - CO007
        - date: '2020'
          label: Marble 合并
          detail: Marble 与 Owner 合并后，Dean Bloembergen 以联合创始人兼 CTO 身份加入。
          tone: neutral
          claimRefs:
            - CO006
        - date: 2024-01
          label: $33M Series B 轮
          detail: Verdict 报道了 Series B 融资。
          tone: positive
          claimRefs:
            - CO008
        - date: 2025-04
          label: Popmenu 诉讼提起
          detail: Popmenu 据称存在虚假广告、不正当竞争和商业诽谤；Owner 否认这些指控。
          tone: risk
          claimRefs:
            - CO014
            - CO015
        - date: 2025-05
          label: $120M Series C 轮，估值 $1B
          detail: Meritech 和 Headline 共同领投该轮融资。
          tone: positive
          claimRefs:
            - CO009
        - date: 2026-04
          label: 集成 POS 营销
          detail: Owner 的产品比较将 POS 展示为其集成餐厅系统的一部分。
          tone: neutral
          claimRefs:
            - CO016
    approximationNotes: 年份和月份反映来源发布时间或明确报道的事件时间；2020 年合并事项仅精确到年份，诉讼提起月份则根据 2025 年 5 月 8 日报道其于上月提起这一说法推断。
