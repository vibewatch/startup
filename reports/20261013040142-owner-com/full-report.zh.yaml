            title: SMB 流失与诉讼拖累
            body: 独立餐厅科技业务存在因门店关停而产生的结构性流失风险，Popmenu 尚未结案的诉讼又在挑战 Owner 的网站 评分获客漏斗，进一步加剧了这一拖累。
            calloutType: risk
            claimRefs:
