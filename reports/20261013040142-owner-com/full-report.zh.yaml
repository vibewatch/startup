  - id: TV002
    title: 正 / 反论点表
    columns:
      - 观点
      - 核心论点
      - 支持证据
      - 证伪触发条件 / 改变判断的因素
    rows:
      - - 正论：数字独立
        - 独立餐厅需要一套集成、免佣金的数字运营系统，以绕开第三方市场 30% 的费用
        - 已接入超过 10,000 家餐厅；固定配送费约 $7 直接转嫁给顾客
        - 独立餐厅集中使用现有 POS 厂商，或直接在线订餐量停滞在每月 $5,000 以下
      - - 正论：外呼 GTM 速度
        - 可规模化的高速外呼销售引擎，以较低 CAC 快速获取 SMB 客户
        - GTM 团队借助 1-7 天的快速销售周期，将 ARR 从 $2M 做到约 $30M-$40M
        - 客户获取成本飙升，或销售代表生产率显著跌至每月 $72K ARR 以下
      - - 反论：SMB 高流失与经流失调整的 LTV
        - 独立餐厅面临较高的结构性倒闭率，客户生命周期价值因此下降，也带来沉重的替换负担
        - Sauce 和运营者评价指出，每月订阅费（$249-$499/mo）会挤压小型餐厅现金流
        - 披露成熟餐厅队列的经验证净收入留存率超过 115%
      - - 反论：估值倍数压顶与法律阻力
        - 在消费者餐饮增长放缓的环境下，为 SMB 餐厅垂直软件支付 12.3x-25.0x ARR，面临严重的估值倍数压缩风险
        - 2025 年 5 月 Series C 将公司定价为 $1.0B；Popmenu 诉讼挑战其核心获客评分工具
        - 收入运行率持续扩张至 $100M ARR 以上，毛利率超过 70%，且诉讼得到干净解决
    notes: 正反论点综合了竞争格局、外呼销售规模化数据及独立运营者评论。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
