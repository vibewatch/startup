            body: >-
              客户质量仍是核心尽调缺口。一份关于 Owner 销售建设的外部报道称，公司早期签下匹配度不高的餐厅后出现流失，随后收紧理想客户评分，据报道拒绝了过去会接受的 40%
              潜在客户。一家竞争对手营销页面称，部分成长型餐厅希望拥有更高的网站所有权、SEO 控制力和灵活性；由于发布者销售替代方案，这项说法虽属不利信息，却不具独立性。另据 Restaurant Business
              报道，Popmenu 指控 Owner 网站评分器产生误导性结果，可能造成信任和采购摩擦；Owner
              否认这些指控。上述来源都没有量化当前流失、集中度、合作伙伴依赖或转换率，因此投资评估应要求客户层面的证据，而不是从精选 客户案例 外推。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU015
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 精选客户结果无法证明留存
            body: 公开规模和具名客户胜利显示了采用情况，但没有披露 GRR、NRR、logo churn、续约、按关店调整后的留存、集中度或客户 ROI 分布。
            calloutType: risk
            claimRefs:
