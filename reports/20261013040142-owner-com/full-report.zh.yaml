  - id: FM001
    title: 可寻址市场规模金字塔与渗透层级
    type: pyramid
    summary: 将美国餐饮支出从宏观行业销售额逐层拆解至 Owner.com ARR 规模。
    data:
      items:
        - label: 美国餐饮行业销售总额
          value: 1550000
          unit: USD M
          detail: 据估计，2026 年全国餐厅消费者支出总额对应 15.8M 名从业者。
        - label: 直接在线与数字订餐支出
          value: 200000
          unit: USD M
          detail: 涵盖直接数字渠道、在线外带和配送的数字订餐子集。
        - label: 独立餐厅数字细分市场
          value: 80000
          unit: USD M
          detail: 独立餐厅及小型多门店餐厅的数字订餐量。
        - label: 餐厅前台与在线软件 TAM
          value: 7500
          unit: USD M
          detail: 网站、直接订餐、CRM 和营销自动化的据估计软件 TAM。
        - label: 独立运营者软件 SAM
          value: 2500
          unit: USD M
          detail: 约 300,000 家美国独立餐厅门店的可寻址软件支出。
        - label: Owner.com 当前 ARR 运行规模 SOM
          value: 40
          unit: USD M
          detail: 据报道通过 SMB 外呼获客达到的 ARR 规模，ACV 为 $8k-9k。
    approximationNotes: 宏观行业销售额来自 National Restaurant Association 2026 年预测；软件 TAM/SAM 源自行业估算，ARR 规模来自 Outbound Kitchen。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM013
