  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 餐厅工作流中的产品范围与模块架构
        blocks:
          - type: paragraph
            body: >-
              Owner.com 提供一套为独立餐厅经营者打造的垂直 SaaS
              平台，帮助他们从高佣金第三方配送平台手中夺回直接、一方顾客需求。放在日常餐饮工作流里，它就是一个集中的数字前门和点单中枢。经营者不必把网站托管、在线点单、移动应用和客户关系管理等零散工具拼起来，Owner.com
              将这些能力打包进一个集成系统。核心产品包括自动 SEO 餐厅网站、白标直接点单门户、定制品牌的 iOS 和 Android 顾客应用（内置忠诚度奖励）、自动 SMS 和邮件营销活动，以及自动 Google
              评价生成引擎。

              为支持餐厅运营，Owner.com 还加入厨房管理工具，包括实体厨房平板、店内 POS 功能和实时经理移动应用。商业打包分为两档主要订阅：Flexible 方案每月 $249，另收 5% 餐厅订单费；Flat
              Rate 方案每月 $499，面向每月数字点单量超过 $5,000 的门店。但两档方案都要求约 $1,000 的前期实施投入，并在结账时把额外 5% 订单支持费直接转给顾客。这种收费结构消除了直接订单传统 25%
              至 35% 的平台佣金，但也引入面向顾客的结账附加费，经营者需要在其中权衡顾客价格敏感度。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE014
