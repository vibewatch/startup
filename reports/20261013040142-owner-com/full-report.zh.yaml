      - number: '5.2'
        title: 技术架构、移动基础设施与配送调度
        blocks:
          - type: paragraph
            body: >-
              Owner.com
              的运营模式连接顾客数字触点、移动管理应用和后端履约物流。在发现层，平台部署自动网站框架，持续索引餐厅菜单项、社区落地页和商业目录资料，以获取本地搜索流量。点单层把网页和移动流量转成结构化厨房订单
              数据包。配送履约上，Owner.com 不自建专有配送车队，而是采用混合调度路由：订单动态发送给第三方配送网络，主要是 Uber Direct 和 DoorDash Drive，按每单约 $7
              的协商固定履约转收费率执行，不加佣金；同时允许拥有自有司机的经营者在内部路由本地配送。

              后厨运营上，Owner.com 为 iOS 和 Android 生态提供原生移动应用。iOS 经理应用要求 iOS 15.1 或更高版本，充当实时指挥台，销售指标每 15
              秒刷新一次。餐厅经理可以随时完成关键运营操作，包括两次点击将菜单项标记为“86”、调整营业时间、即时取消订单、处理退款和用相机增强菜单照片。后台则由内部数据工程基础设施提供支持，其中包括机器学习账户评分和预测路由，用于提升销售及客户上线速度。
