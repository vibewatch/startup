        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Owner.com 卖的不是单一的点单组件，而是一套面向餐厅的软件平台。公司当前页面将网站、点单、品牌移动应用、会员忠诚度、营销、餐饮承办、SEO、评价生成、支持和 POS
              整合成一个产品包。商业模式也相对清晰：$249-per-month 灵活方案每单另收 5% 餐厅费用；$499-per-month
              固定方案取消这项餐厅费用；两者均按月提供。这些是公司公布的条款，不是独立审计后的经济数据。独立报道将其称为餐厅
              SaaS，但分配到的来源未能确认确切总部和法律实体范围。因此，本报告把有日期的报道规模与不可得指标分开，不把融资、ARR、收入和现金混为一谈。
