      - number: '2.3'
        title: 买方画像、采购动态与单位经济
        blocks:
          - type: paragraph
            body: >-
              独立餐厅软件的采购流程压缩程度高，且由经营者主导。不同于需要正式 RFP、安审和多方采购委员会的企业餐饮连锁，SMB 餐厅买家主要是老板兼经营者或总经理，通常在 1 至 7
              天内做出采购决定。他们更看重立即增收和部署便利，而非技术模块化，因为餐厅通常没有专职 IT 人员。不过，系统集成仍是关键运营门槛：直接点单方案必须与 Toast、Square、Clover 等既有 POS
              无缝同步，避免繁忙班次出现后厨打印瓶颈。在 Toast POS 环境中，Owner.com 依赖 Otter
              等中间层软件；如果高峰服务时段同步工单失败，就会引入外部集成依赖和摩擦。买方单位经济的核心，是把配送聚合平台的常客转化为直接买家，同时不打乱员工工作流程。
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用驱动因素、结构性瓶颈与竞争摩擦
        blocks:
          - type: paragraph
            body: >-
              消费者习惯和自然发现机制正在加速独立餐厅平台的采用。消费者数据表明，58% 的配送聚合平台用户在打开应用前就知道自己想去哪家具体餐厅，这为餐厅通过 Google Search
              和自动评价引擎截流顾客提供了直接机会。垂直平台自动化本地 SEO 和 Google
              五星评价收集，无需付费广告就能生成高意向直接订单。但结构性采用障碍仍在。主要运营约束是顾客对买方侧点单服务费的价格敏感：Owner.com 在 Flex 和 Flat-Rate 两种方案下都向用餐顾客收取 5%
              结账费，大额订单可能因此被放弃。此外，本地餐厅营销竞争加剧也引发法律摩擦：直接竞争对手 Popmenu 在加州高等法院就 Owner.com 的自动网站评分销售工具提起诉讼，声称其构成虚假广告和不正当竞争。
            claimRefs:
              - CM003
              - CM007
              - CM012
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 顾客支持费透明度与品牌风险
            body: >-
              Owner.com 向独立餐厅经营者营销免佣金直接点单，但其直接订单强制收取 5%
              的消费者顾客支持费，实际上把变现转嫁给终端食客。如果价格敏感的消费者在餐厅一方网站结账时看到额外费用，经营者可能面临摩擦和顾客信任流失，从而部分抵消绕过第三方配送应用带来的利润优势。
            calloutType: risk
            claimRefs:
              - CM002
              - CM007
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局结构与直接同业动态
        blocks:
          - type: paragraph
            body: >-
              Owner.com 面临的竞争格局分为三类：提供餐厅数字门店的直接垂直同业、控制前台结账的传统 POS 厂商，以及抽取高额佣金的第三方配送平台。Popmenu 是 Owner.com
              最接近的直接竞争对手，面向独立餐厅提供网站设计、动态在线菜单和自动营销工具。两家直接平台之间的竞争升级为诉讼：Popmenu 在加州高等法院起诉 Owner.com，声称其围绕 Restaurant
              Website Grader 工具存在虚假广告、不正当竞争和商业诽谤。Owner.com 公开否认这些指控，称诉讼源于不满竞争对手的摩擦；但争议凸显了独立餐厅 SaaS 获客竞争的激烈程度。Owner.com
              通过激进的 外呼 销售节奏形成差异化，将自己定位为餐厅版 Shopify，以取代过时的网站方案，把订单量从第三方聚合平台手中夺回。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP014
