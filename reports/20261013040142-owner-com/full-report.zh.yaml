              - CP013
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 传统 POS 打包与多系统并用摩擦
            body: >-
              独立餐厅在既有 POS 旁选择 Owner.com 时会面临结构性转换成本。Owner.com 虽然与 Toast 和 Clover
