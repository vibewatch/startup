  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 运营与商业转化桥接图，展示外呼拓客如何转化为高毛利 SaaS 订阅和交易型订单变现。
    data:
      nodes:
        - id: lead-gen
          label: 外呼获客与 ICP 筛选
          description: ML 评分从 500k 餐厅 TAM 中筛选 30k 个 ICP 目标
        - id: bdr-sourcing
          label: BDR 拓客（$72k ARR/mo）
          description: 20+ 名 BDR 以 1:20 的运营比实现 0.13 CAC 比率
        - id: ae-conversion
          label: AE 转化（1-7 天周期）
          description: 按 2 名 BDR 对 1 名 AE 的比例签下 $6k-$9k ACV 合同
        - id: saas-subscription
          label: SaaS 订阅收入（$499/mo）
          description: 在线订餐与营销套件的可预测核心订阅收入
        - id: delivery-take-rate
          label: 配送变现（每位顾客 $4 费用）
          description: 直接免佣订餐，绕开聚合平台 30% 的抽成
        - id: product-expansion
          label: AI Executives 与加售产品
          description: 拓展至 AI 聊天机器人、评价引擎和 POS 集成
        - id: gross-margin
          label: 毛利与资本效率
          description: 较高的 SaaS 贡献毛利抵消非公开的托管 / 支持成本
      edges:
        - from: lead-gen
          to: bdr-sourcing
          label: 合格目标
        - from: bdr-sourcing
          to: ae-conversion
          label: 销售管道交接
        - from: ae-conversion
          to: saas-subscription
          label: 已签合同
        - from: saas-subscription
          to: delivery-take-rate
          label: 订单量
        - from: saas-subscription
          to: product-expansion
          label: 交叉销售
        - from: delivery-take-rate
          to: gross-margin
          label: 抽成利润率
        - from: product-expansion
          to: gross-margin
          label: 软件利润率
    approximationNotes: 转化速度和 BDR 单位产出基于 2025 年中管理层运营披露；毛利率分配为估算值。
    claimRefs:
      - CI003
      - CI005
      - CI006
      - CI008
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Owner.com 连接餐厅顾客渠道、运营工具和后端集成层的多层架构。
    data:
      layers:
        - label: 顾客发现与获取
          detail: AI 生成的 SEO 网站与本地搜索优化
        - label: 直接订餐与转化
          detail: 免佣金网页订餐与品牌原生移动应用
        - label: 营销与留存引擎
          detail: 自动 SMS / 邮件营销、忠诚度奖励和评价生成
        - label: 运营与菜单管理
          detail: iOS / Android 管理应用、86 库存开关和厨房平板
        - label: POS 与硬件集成
          detail: 原生云 POS 软件，以及与 Toast、Clover 等平台的同步桥接
        - label: 配送调度与履约
          detail: 调度至第三方司机网络（DoorDash、Uber）及自有车队
    approximationNotes: 架构层综合了厂商文档、应用商店清单和第三方集成评价。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE008
      - CE011
  - id: FU001
    title: 公司描述的客户采用与扩张循环
    type: journey-map
    summary: Owner 的产品触点构成从获客到复购的六步循环，但公开证据没有量化各阶段之间的转化或留存。
    data:
      nodes:
        - id: discovery
          label: 本地发现
          detail: SEO 和评价数量旨在提升餐厅曝光度。
          touchpoints:
            - Restaurant website
            - Google rankings
            - Google reviews
        - id: direct-order
          label: 直接订餐
          detail: 顾客通过餐厅自有网站或应用下单。
          touchpoints:
            - Online ordering
            - Restaurant website
        - id: data-capture
          label: 客户捕获
          detail: 直接订单将顾客加入餐厅客户名单。
          touchpoints:
            - Order data
            - Customer list
        - id: app-adoption
          label: 应用采用
          detail: 移动端访客会被引导使用餐厅品牌应用。
          touchpoints:
            - Mobile website
            - Branded app
        - id: lifecycle-marketing
          label: 生命周期营销
          detail: 营销和忠诚度工具试图重新激活已捕获的顾客。
          touchpoints:
            - Email
            - SMS
            - Loyalty
        - id: repeat-and-review
          label: 复购与评价
          detail: 复购和下单后的评价请求旨在强化需求。
          touchpoints:
            - Repeat order
            - Automated review request
    approximationNotes: 概念机制根据公司描述整理；公司未披露各阶段转化率或可比队列分母。
    claimRefs:
      - CU009
      - CU013
      - CU014
      - CU016
