callouts:
  - calloutType: "risk"
    title: "Guest Support Fee Transparency and Brand Risk"
    body: "While Owner.com markets commission-free direct ordering to independent restaurateurs, its mandatory 5% consumer guest support fee on direct orders transfers monetization directly to retail diners. If price-conscious consumers observe fee additions at checkout on a restaurant's first-party website, operators face potential friction and customer trust attrition that partially offsets the margin advantage of bypassing third-party delivery apps."
    claimRefs:
      - "CM002"
      - "CM007"
