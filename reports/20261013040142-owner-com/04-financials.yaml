      - "CI006"
  - calloutType: "risk"
    title: "Lead Generation Friction and Private Metric Opacity"
    body: "While Owner.com's Series C valuation reached $1 billion on reported $40 million ARR, ongoing litigation from competitor Popmenu over the automated Restaurant Website Grader highlights aggressive top-of-funnel tactics. More critically, the total absence of public data on gross margins, cohort retention, and monthly cash burn limits comprehensive underwriting."
