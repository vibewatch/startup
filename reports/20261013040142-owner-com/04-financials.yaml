    title: "Outbound Engine Powers Top-Decile Sales Efficiency"
    body: "Owner.com's hyper-specialized outbound motion achieves a remarkable 0.13 CAC ratio and $72,000 monthly ARR per BDR. By decoupling BDR prospecting from AE closing and narrowing targeting to a high-converting 30,000 restaurant ICP, the company sustains sub-seven-day sales cycles in an SMB segment historically plagued by poor sales efficiency."
    claimRefs:
