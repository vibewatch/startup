              - CU007
              - CU008
      - number: '6.3'
        title: Durability and expansion mechanisms
        blocks:
          - type: paragraph
            body: >-
              The product design contains plausible expansion and retention loops: direct ordering captures customer
              data, mobile-app promotion creates another ordering surface, automated marketing and loyalty seek repeat
              orders, review requests support discovery, and SEO seeks new demand. Owner claims its app promotion drives
              85% more repeat orders and says most review-engine customers begin seeing increased reviews within a few
              weeks. It also markets Google-ranking improvement within 30–60 days. These are useful descriptions of the
              intended mechanism, not proof of gross retention, net revenue retention, cohort expansion, or causal lift.
              No reviewed source supplies NRR, GRR, logo churn, renewal rates, contract tenure, product attach, or
              matched-control outcomes.
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU013
              - CU014
              - CU016
      - number: '6.4'
        title: Concentration, switching, and evidence risk
        blocks:
          - type: paragraph
            body: >-
              Customer quality remains the central diligence gap. An outside account of Owner's sales build says the
              company initially experienced churn after signing poorly matched restaurants and then tightened
              ideal-customer scoring, reportedly rejecting 40% of prospects it previously would have accepted. A
              competitor marketing page argues that some growing restaurants seek greater website ownership, SEO
              control, and flexibility; because that issuer sells an alternative, the claim is adverse but not
              independent. Separately, Restaurant Business reported Popmenu's allegations that Owner's website grader
              produced misleading results, which could create trust and procurement friction; Owner denied those
              allegations. None of these sources quantifies current churn, concentration, partner dependence, or
              switching rates, so underwriting should require customer-level evidence rather than extrapolation from
              selected testimonials.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU015
