            title: Retention is not demonstrated by selected customer outcomes
            body: >-
              Public scale and named wins show adoption, but they do not disclose GRR, NRR, logo churn, renewals,
              closure-adjusted retention, concentration, or the distribution of customer ROI.
            calloutType: risk
