  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Value
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - research-more
        - Requires verification of unit economics, churn rates, and capital efficiency
        - Pause new commitment pending disclosure of gross margins and cohort retention
      - - Confidence
        - medium
        - Public reporting covers top-line funding and customer counts but omits audited financials
        - Conduct primary accounting diligence on subscription versus payments revenue split
      - - Risk Rating
        - high
        - High SMB restaurant mortality, competitive pressure from Toast/DoorDash, and active litigation
        - Underwrite downside protection, strict liquidation preferences, and covenant terms
      - - Valuation Stance
        - expensive
        - Valued at $1.0B in May 2025 on ~$40M-$81M estimated run-rate (12.3x-25.0x multiple)
        - Refuse premium entry without verified top-decile net revenue retention and positive cash flow
    notes: >-
      Recommendation criteria derived from synthesis of $1B Series C valuation against available revenue benchmarks and
      competitive litigation risks.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV011
      - CV014
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - Falsification Trigger / What Would Change View
    rows:
      - - 'Thesis: Digital Independence'
        - >-
          Independent restaurants require an integrated, commission-free digital operating system to bypass 30%
          third-party marketplace fees
        - Over 10,000 restaurants onboarded; flat delivery passes ~$7 cost directly to guests
        - >-
          Independent restaurants consolidate on incumbent POS providers or direct online ordering volumes plateau below
          $5,000/month
      - - 'Thesis: Outbound GTM Velocity'
        - Scalable, high-velocity outbound sales engine enables rapid SMB customer acquisition at low CAC
        - GTM team scaled ARR from $2M to ~$30M-$40M with rapid 1-7 day sales cycles
        - Customer acquisition costs surge or sales rep productivity drops significantly below $72K ARR/month
      - - 'Anti-Thesis: High SMB Churn & Churn-Adjusted LTV'
        - >-
          Independent restaurants face high structural business failure rates, reducing customer lifetime value and
          creating heavy replacement burden
        - Sauce and operator reviews note monthly subscriptions ($249-$499/mo) strain smaller restaurant cash flows
        - Disclosure of verified net revenue retention exceeding 115% across mature restaurant cohorts
      - - 'Anti-Thesis: Multiple Overhang & Legal Headwinds'
        - >-
          Paying 12.3x-25.0x ARR for SMB restaurant vertical software carries severe multiple compression risk in an
          environment of slower consumer dining growth
        - May 2025 Series C priced company at $1.0B; Popmenu lawsuit challenges core lead-generation grader tool
        - >-
          Sustained revenue run-rate expansion past $100M ARR with gross margins exceeding 70% and clean resolution of
          litigation
    notes: >-
      Thesis and anti-thesis points synthesize competitive landscape, outbound sales scaling data, and independent
      operator commentary.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Signal
      - Operating Assumptions
      - Implied Valuation & Multiple
      - Key Risks & Downside Triggers
    rows:
      - - Bull Case
        - 20% (Low)
        - Scales to $120M+ ARR by 2027; AI Executives drive expansion into 25,000+ restaurants; NRR exceeds 115%
        - $1.8B-$2.4B (15x-20x ARR exit via IPO or strategic acquisition by Toast/DoorDash)
        - Multiple compression across vertical SaaS; growth slows as low-hanging SMB pizza/taqueria TAM saturates
      - - Base Case
        - 50% (Moderate)
        - Expands to $70M-$85M ARR; growth moderates to 30%-40%; churn stabilizes around industry SMB average (15%-25%)
        - $700M-$900M (10x-12x ARR on secondary/re-rate)
        - Inability to defend $1.0B post-money valuation mark; customer sensitivity to $249-$499 monthly fees
      - - Bear Case
        - 30% (Elevated)
        - >-
          Growth decelerates below 20%; high restaurant closure rates drive net negative retention; Popmenu litigation
          impairs top-of-funnel conversion
        - $300M-$450M (5x-6x ARR down-round or distressed consolidation)
        - >-
          Down-round dilution; senior liquidation preferences wipe out common/junior equity; core website grader legally
          constrained
    notes: >-
      Scenario valuations model enterprise value based on vertical SaaS software multiples applied to estimated ARR
      trajectories.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
