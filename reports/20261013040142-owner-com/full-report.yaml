  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Module Architecture in Restaurant Workflows
        blocks:
          - type: paragraph
            body: >-
              Owner.com delivers a vertical software-as-a-service platform purpose-built for independent restaurant
              operators seeking to recapture direct, first-party customer demand from high-commission third-party
              delivery marketplaces. In day-to-day hospitality workflow terms, the product functions as a centralized
              digital front door and ordering hub. Rather than requiring operators to stitch together disjointed point
              solutions for web hosting, online ordering, mobile applications, and customer relationship management,
              Owner.com packages these capabilities into a single integrated system. The core product line centers on an
              automated search-engine-optimized restaurant website, a white-label direct ordering portal, custom-branded
              iOS and Android consumer mobile apps with embedded loyalty rewards, automated SMS and email marketing
              campaigns, and an automated Google review generation engine.

              To support restaurant operational workflows, Owner.com also incorporates kitchen management tools,
              including physical kitchen tablets, on-premise point-of-sale functionality, and real-time manager mobile
              applications. The commercial packaging structures these capabilities into two primary subscription tiers:
              a Flexible plan at $249 per month accompanied by a 5% restaurant order fee, and a Flat Rate plan at $499
              per month designed for venues handling more than $5,000 in monthly digital ordering volume. However, both
              tiers require an initial upfront implementation investment of roughly $1,000 and pass through an
              additional 5% order support fee directly to guests at checkout. This fee structure eliminates traditional
              marketplace commission rates of 25% to 35% on direct orders, but introduces customer-facing checkout
              surcharges that operators must balance against guest price sensitivity.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE014
          - type: table
            tableRef: TE001
