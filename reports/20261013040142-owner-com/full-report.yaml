      - number: '5.2'
        title: Technical Architecture, Mobile Infrastructure, and Delivery Dispatch
        blocks:
          - type: paragraph
            body: >-
              Owner.com's operating model bridges guest-facing digital touchpoints, mobile management applications, and
              backend fulfillment logistics. At the discovery layer, the platform deploys an automated website framework
              that continuously indexes restaurant menu items, neighborhood landing pages, and business directory
              profiles to capture local search traffic. The ordering tier converts incoming web and mobile traffic into
              structured kitchen order payloads. For delivery fulfillment, Owner.com bypasses proprietary delivery
              fleets by implementing a hybrid dispatch routing model. Orders are passed dynamically to third-party
              delivery networks—principally Uber Direct and DoorDash Drive—at a negotiated flat fulfillment pass-through
              rate of approximately $7 per order without commission markups, while also allowing operators with in-house
              drivers to route local deliveries internally.

              For back-of-house operations, Owner.com provides native mobile applications across iOS and Android
              ecosystems. The iOS manager app, requiring iOS 15.1 or later, functions as a real-time command console
              where sales metrics refresh every 15 seconds. Restaurant managers can execute critical operational
              interventions on the fly, including two-tap '86' menu item stock toggling, dynamic store hours
              modifications, instant order cancellations, refund processing, and camera-based menu photography
              enhancement. Behind the scenes, Owner.com leverages internal data engineering infrastructure featuring
              machine learning account scoring and predictive routing to support its sales and customer onboarding
              velocity.
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
