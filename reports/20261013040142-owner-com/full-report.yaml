    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Owner.com sells a restaurant-focused software platform rather than a single ordering widget. Its own
              current pages describe an integrated package of websites, ordering, branded mobile apps, loyalty,
              marketing, catering, SEO, review generation, support, and POS. The commercial model is publicly legible: a
              $249-per-month flexible plan adds a 5% restaurant fee per order, while a $499-per-month flat plan removes
              that restaurant fee; both are offered month to month. These are company-published terms, not independently
              audited economics. Independent reporting calls the business restaurant SaaS, while the exact headquarters
              and legal-entity footprint were not established by the allocated sources. The snapshot therefore separates
              dated reported scale from unavailable metrics instead of treating funding, ARR, revenue, and cash as
              interchangeable.
