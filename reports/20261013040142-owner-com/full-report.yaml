            title: SMB Churn and Litigation Drag
            body: >-
              Independent restaurant technology carries structural churn risks from restaurant closures, compounded by
              Popmenu's pending litigation challenging Owner's website grading acquisition funnel.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV014
