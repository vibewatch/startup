  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Industry Boundaries
        blocks:
          - type: paragraph
            body: >-
              The addressable market for restaurant technology is bifurcated between back-of-house operating software
              and front-of-house direct guest engagement. Independent restaurant operators face extreme commercial
              pressure, with US industry food sales projected to reach $1.55 trillion across 15.8 million workers in
              2026 amidst persistent labor costs and inflation. While major delivery marketplaces like DoorDash and Uber
              Eats capture significant takeout volume, they charge operators double-digit commissions that erode already
              slim restaurant profit margins. Consequently, independent operators actively seek direct-to-consumer
              digital channels to reclaim guest ownership and transaction margins. Historically, operators assembled
              disjointed point solutions across website hosting, online menu widgets, customer relationship management,
              and SMS marketing. Modern vertical SaaS offerings consolidate these workflows into a single direct-order
              engine designed to capture organic search traffic and convert local diners into high-margin first-party
              buyers.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Addressable Spend, and TAM Lenses
        blocks:
          - type: paragraph
            body: >-
              Sizing the market for independent restaurant software requires decoupling total foodservice retail sales
              from software-addressable revenue pools. Within the $1.55 trillion overall dining industry, off-premises
              digital food sales represent an estimated $200 billion macro transaction base, of which independent and
              regional restaurant digital sales account for roughly $80 billion. From a pure software licensing
              perspective, assuming approximately 300,000 independent and small multi-unit US restaurant locations
              spending between $3,000 and $10,000 annually on guest-facing software, the core domestic software
              addressable market stands between $1.5 billion and $2.5 billion. Owner.com monetizes this base through
              dual subscription tiers: a Flex tier priced at $249 monthly plus a 5% per-order take rate, and a Flat-Rate
              tier at $499 monthly. With the direct-order breakeven volume sitting at $5,000 monthly, operators
              exceeding that threshold transition to flat pricing. Having scaled outbound sales to roughly $40 million
              in ARR at an $8,000 to $9,000 ACV, Owner.com captures only a modest single-digit fraction of the
              independent software market, leaving substantial runway but facing ceiling constraints if merchant churn
              remains tied to restaurant mortality.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM013
      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The procurement process in independent restaurant software is uniquely compressed and operator-driven.
              Unlike enterprise restaurant chains that mandate formal RFP cycles, security audits, and multi-stakeholder
              procurement committees, SMB restaurant buyers are predominantly owner-operators or general managers making
              purchasing decisions within 1 to 7 days. These buyers prioritize immediate revenue generation and ease of
              deployment over technical modularity, as restaurant operators lack dedicated IT staff. However, system
              integration remains a critical operational gating factor: direct ordering solutions must seamlessly
              synchronize with established point-of-sale systems such as Toast, Square, and Clover to avoid kitchen
              printing bottlenecks on busy shifts. For Toast POS environments, Owner.com relies on middle-layer software
              such as Otter, introducing external integration dependencies that can create friction if sync tickets fail
              during peak service windows. Unit economics for buyers hinge on converting delivery aggregator regulars
              into direct buyers without introducing disruptive staff workflows.
            claimRefs:
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Drivers, Structural Bottlenecks, and Competitive Friction
        blocks:
          - type: paragraph
            body: >-
              Market adoption of independent restaurant platforms is accelerated by consumer habituation and organic
              discovery mechanics. Empirical consumer data reveals that 58% of delivery aggregator users already know
              which specific restaurant they wish to patronize prior to opening an app, presenting an immediate
              opportunity for restaurants to intercept diners via Google Search and automated review engines. By
              automating local search engine optimization and five-star Google review collection, vertical platforms
              generate high-intent direct orders without requiring paid ad spend. Nevertheless, structural adoption
              barriers persist. A primary operational constraint is consumer price sensitivity to guest-side order
              support fees: Owner.com levies a 5% checkout fee on dining guests across both its Flex and Flat-Rate
              plans, which can cause cart abandonment on larger orders. Additionally, heightened competition in local
              restaurant marketing has triggered legal friction, evidenced by direct competitor Popmenu filing false
              advertising and unfair competition claims in California Superior Court over Owner.com's automated website
              grading sales tool.
            claimRefs:
              - CM003
              - CM007
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Guest Support Fee Transparency and Brand Risk
            body: >-
              While Owner.com markets commission-free direct ordering to independent restaurateurs, its mandatory 5%
              consumer guest support fee on direct orders transfers monetization directly to retail diners. If
              price-conscious consumers observe fee additions at checkout on a restaurant's first-party website,
              operators face potential friction and customer trust attrition that partially offsets the margin advantage
              of bypassing third-party delivery apps.
            calloutType: risk
            claimRefs:
              - CM002
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Structure and Direct Peer Dynamics
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape confronting Owner.com is divided into three distinct segments: direct vertical
              peers offering restaurant digital storefronts, legacy point-of-sale incumbents controlling front-of-house
              checkout, and third-party delivery marketplaces that extract high commission takes. Popmenu operates as
              Owner.com's closest direct competitor, targeting independent restaurants with website design, dynamic
              online menus, and automated marketing tools. Competitive tension between the two direct platforms
              escalated into active litigation when Popmenu sued Owner.com in California Superior Court, asserting
              claims of false advertising, unfair competition, and trade libel centered on Owner.com's online Restaurant
              Website Grader tool. While Owner.com publicly denied the claims and characterized the lawsuit as friction
              from an unhappy competitor, the dispute underscores the intensity of customer acquisition in independent
              restaurant SaaS. Owner.com differentiates its go-to-market posture through an aggressive outbound sales
              cadence, positioning itself as Shopify for restaurants to dislodge outdated web solutions and shift order
              volume away from third-party aggregators.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP010
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
