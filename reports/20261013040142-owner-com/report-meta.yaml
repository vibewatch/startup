companyProfile:
  summary: >-
    Owner.com sells a vertical software platform for independent restaurants. Its public product surface spans websites,
    direct online ordering, CRM, marketing automation, loyalty, branded mobile apps, SEO, review generation, and POS
    integration. Public reporting shows meaningful scale—more than 10,000 restaurant locations, a reported $40 million
    ARR run rate, and a $1 billion valuation after the May 2025 Series C—but the company still keeps core financial,
    governance, and cohort-quality metrics private.
  productSummary: >-
    Vertical restaurant software covering websites, direct ordering, CRM, marketing, loyalty, SEO, review tools, branded
    apps, and POS integration.
