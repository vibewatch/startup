companyProfile:
  summary: >
    Epirus is a private Series D defense-technology company founded in 2018 and
    headquartered in Torrance, California, built around the Leonidas high-power
    microwave family for counter-electronics and counter-UAS missions. Public
    evidence shows more than $550 million in disclosed funding, including a $250
    million Series D in March 2025, but revenue, backlog, margin, and exact
    current valuation remain undisclosed.
  foundedDate: "2018-01-01"
  founders:
    - name: "Joe Lonsdale"
      role: "Co-founder"
      background: >
        Epirus identifies Lonsdale as a co-founder and managing partner of 8VC.
      claimRefs: [CO008]
    - name: "Grant Verstandig"
      role: "Co-founder; former executive chairman"
      background: >
        Epirus financing materials identified Verstandig as co-founder and
        executive chairman during the 2020-2022 financing period.
      claimRefs: [CO009]
  foundingLocation: "California, USA"
  headquarters: "Torrance, California, USA"
  productSummary: >
    Leonidas is a software-defined, solid-state, long-pulse high-power microwave
    product family for counter-electronics and counter-UAS missions.
  customerFocus: >
    Core demand is from the U.S. Department of Defense and allied militaries,
    with future commercial targeting toward critical-infrastructure operators.
  businessModel: >
    Epirus sells through government defense pathways including OTAs, IDIQ-style
    vehicles, rapid prototypes, and related follow-on programs; public segment
    pages also describe an as-a-service option.
  stage: "Series D"
  fundingStatus: >
    More than $550 million disclosed; the March 2025 Series D added $250 million
    and public reporting indicates the round preserved unicorn status while
