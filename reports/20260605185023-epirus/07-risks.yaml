company:
  name: Epirus
chapter:
  number: 7
  title: Risks
  summary: Epirus has credible defense-program proof and fresh capital, but its residual risk stays high because export-control readiness, production scaling, customer concentration, and commercial-metric opacity all remain unresolved at the same time. The public record shows real mitigations — CMMC Level 2, Army deliveries, partner integrations, patents, and mission-aligned investors — yet it still does not show the export, reliability, customer-diversification, and valuation detail needed to call the company operationally mature.
sections:
- id: risk-stack-overview
  title: Risk stack and investment implication
  body: 'Epirus enters the risk chapter with real program proof but not the kind of operating transparency that would make a defense-hardware scaling story low risk. The company has delivered Army IFPC-HPM systems, won a Generation II follow-on contract, and raised a large 2025 Series D, so the question is not whether Leonidas exists. The question is whether Epirus can convert those wins into repeatable, lawful, exportable, margin-resilient scale before procurement cycles, export approvals, or capital-market sentiment tighten. The same documents that support the upside also reveal the strain points: the company said new capital was needed for supply-chain resiliency, manufacturing footprint, and internal systems; independent coverage said the latest round did not disclose exact valuation; and public customer proof is still dominated by defense buyers. That combination makes the residual risk high rather than existential. The core thesis remains investable only if management shows that program
    milestones can translate into broader, durable production throughput and not just episodic demonstration wins.'
  claimRefs:
