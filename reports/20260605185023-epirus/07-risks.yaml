  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: export-classification
    missingEvidence: Commodity-jurisdiction results, ECCN or USML mappings, license history, and country-specific export approvals for the Leonidas family and related systems.
    whyItMatters: International growth is part of the stated use of proceeds, but export readiness determines whether testing interest can actually convert into revenue.
    diligencePath: Request export-classification memos, counsel opinions, past license applications, and any compliance matrix tied to specific target countries.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: reliability-sustainment
    missingEvidence: Fleet uptime, failure-rate, maintenance burden, replacement-cycle, and lifecycle-cost metrics for Leonidas deployments.
    whyItMatters: Hardware scaling and customer retention depend on supportability, not just successful demonstrations and contract announcements.
    diligencePath: Request operational test reports, sustainment plans, spare-parts assumptions, and any field reliability dashboards used by management or customers.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: series-d-valuation
    missingEvidence: Exact Series D post-money valuation, any structured terms, investor protections, and board-level mark history versus the 2022 Series C.
    whyItMatters: A mixed financing signal changes downside protection, future dilution risk, and how much operational progress is already priced in.
    diligencePath: Request the Series D term sheet, cap table, board deck, and any fairness or pricing materials shared with investors.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: commercial-diversification
    missingEvidence: Customer list, revenue mix, renewal evidence, and segment-level bookings showing whether commercial or non-U.S.-government demand is real and durable.
    whyItMatters: Public proof is defense concentrated, so the underwriting case can overstate diversification if private commercial traction is still minimal.
    diligencePath: Request booked-revenue segmentation, customer cohorts, pipeline conversion by segment, and at least several named commercial reference accounts.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: leadership-bench-depth
    missingEvidence: Succession planning, retention packages, program-owner accountability, and turnover history for the leaders beneath the CEO and CFO.
    whyItMatters: The public narrative is concentrated around a small set of leaders, which increases key-person risk if execution is not broadly institutionalized.
    diligencePath: Request an org chart, compensation and retention summary, recent attrition metrics, and succession plans for technical and program-critical roles.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: ip-freedom-to-operate
    missingEvidence: Freedom-to-operate analysis, patent-opposition history, indemnity terms, or any disclosed actual disputes touching high-power microwave or counter-electronics IP.
    whyItMatters: A visible patent list does not prove that Epirus is insulated from third-party claims or design-around pressure as deployment volumes grow.
    diligencePath: Ask counsel for FTO memoranda, open dispute lists, indemnity carve-outs, and any insurance or reserve tied to IP claims.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
