tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Jurisdiction / regime
  - What public evidence shows
  - Residual exposure
  - Mitigation maturity
  - Diligence path
  rows:
  - - Export classification and license burden for international sales
    - U.S. export controls / international
    - Series D expansion plans plus BIS licensing, Wassenaar, and ITAR references show export-workflow exposure
    - High
    - Partial — regimes are visible, company-specific classifications are not
    - Obtain ECCN / USML mapping, commodity-jurisdiction memos, and actual license history
  - - CUI handling and defense-compliance execution
    - DoD / defense industrial base
    - Epirus announced CMMC Level 2 certification in March 2026
    - Medium
    - Moderate — certification exists, surveillance and operating discipline still matter
    - Request SSP, POA&M status, and cadence for maintaining certification
  - - Counter-UAS legal-authority and procurement-window shifts
    - U.S. homeland / federal authorities
    - DOJ, DHS, and DoD policy materials show an evolving authority environment for counter-UAS action
    - Medium
    - Partial — demand tailwind exists, exact procurement capture path is not public
    - Track which programs and authorities Epirus can actually sell into and when
  - - IP defensibility versus freedom-to-operate risk
    - U.S. and international patent regimes
    - Patent-marking notice and statute support formal protection, but no litigation or FTO detail is public
    - Medium
    - Partial — patents visible, litigation posture opaque
    - Request counsel memo on patents, licenses, disputes, and any third-party claims
  notes: Coverage is partial and focused on public export-control, compliance, counter-UAS authority, and IP signals; undisclosed licenses, opinions, or disputes could materially change the register.
  enumerationScope:
    coverage: partial
    basis: 'Rows cover the main public legal and regulatory vectors visible in reviewed sources: export controls, CUI compliance, counter-UAS authority, and patent posture. Private legal diligence materials and non-public export records were unavailable.'
