- id: TR005
  title: Mitigation and thesis-break triggers table
  columns:
  - Risk area
  - Visible mitigation
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Export-control readiness
    - BIS workflow awareness plus early international testing interest
    - International opportunity without disclosed export path
    - No company-specific classification or license readiness by next refresh
    - Treat international upside as speculative rather than underwritten
  - - Army demand durability
    - Delivered Gen I systems and Gen II follow-on contract
    - Procurement momentum stalls
    - No visible follow-on progress beyond current contracts and options
    - Increase concentration discount and lower confidence in manufacturing scale
  - - Manufacturing / supply-chain ramp
    - Series D capital earmarked for resiliency, systems, and footprint expansion
    - Expansion evidence does not materialize
    - No public signs of manufacturing or process build-out after the raise
    - Assume delivery and margin risk remain high
  - - Commercial diversification
    - Company says it is expanding commercial markets
    - Public proof remains defense-only
    - Another refresh still lacks named commercial buyers or commercial revenue evidence
    - Maintain high customer-concentration penalty
  - - Leadership / bench depth
    - CEO, CFO, and advisory-board coverage is visible
    - Execution team instability or continued opacity
    - Key departures or continued absence of bench-depth disclosure
    - Escalate people risk and request management diligence before underwriting
