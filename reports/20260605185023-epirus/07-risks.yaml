- id: operational-quality-supply-chain
  title: Operational quality, production, and supply-chain risk
  body: 'Operational risk is best understood as the gap between demonstrated capability and scaled repeatability. Epirus has now moved beyond pure prototype status: the Army awarded a first major Leonidas contract, the company completed delivery of four IFPC-HPM systems and associated testing, and Generation II is meant to extend performance materially. Those are strong signals. But they are not the same thing as mature manufacturing or proven fleet sustainment. The company explicitly said fresh capital would be used for supply-chain resiliency, systems upgrades, and U.S. manufacturing expansion, which implies that scaling bottlenecks still mattered in 2025. The technology stack also appears non-trivial. Epirus emphasizes advanced power management, AI/ML, and software-defined performance, all of which can be strengths but also increase talent dependence and quality-control complexity. The strongest disconfirming signal is that public sources still do not disclose uptime, defect, maintainability,
    or lifecycle-cost metrics. Independent industry coverage also notes that directed energy has long been anticipated but remains sparsely fielded at scale. That does not invalidate Leonidas; it means the company is still crossing the difficult bridge from compelling demonstrations to reliable, supportable production operations.'
  claimRefs:
