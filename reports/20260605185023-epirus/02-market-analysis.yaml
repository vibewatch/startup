    - Airport, port, utility, and other protected-site sponsors, usually via public-safety partners
    - Security teams and contracted operators
    - Security capex, grants, or government-backed programs
    - Threat assessment -> legal authority check -> integrator selection -> site deployment
    - Chief security officer or government sponsor
    - Drone incursions near strategic assets
