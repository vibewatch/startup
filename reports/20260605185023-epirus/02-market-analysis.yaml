    - Army procurement and RDT&E appropriations
    - Requirement -> prototype -> test -> battalion fielding decision
    - Army air and missile defense leadership
    - Persistent swarm threat to fixed sites
  - - USMC expeditionary defense (ExDECS)
    - ONR / JCO / USMC experimentation sponsors
    - Expeditionary air-defense and EABO forces
    - USMC / Navy RDT&E and prototype funds
