  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-estimates
    missingEvidence: A consistent apples-to-apples market model for total c-UAS, directed energy, and HPM-only demand using one year, one scope definition, and one inclusion rule set.
    whyItMatters: Published estimates differ so widely that TAM-led valuation narratives can be overstated by multiple turns of revenue.
    diligencePath: Request sell-side or internal forecast models that explicitly show included layers, regional scope, end-use split, and whether lasers, HPM, services, and C2 are bundled together.
    relatedQuestionRefs:
    - QM005
    - QM023
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: export-controls
    missingEvidence: Leonidas-specific export classification, jurisdiction, and expected license path for allied or dual-use sales.
    whyItMatters: Without the actual ECCN or USML mapping, export-driven SAM and sales-cycle assumptions remain speculative.
    diligencePath: Obtain counsel-backed export classification memos, any commodity-jurisdiction or BIS/DDTC correspondence, and a country-by-country licenseability matrix.
    relatedQuestionRefs:
    - QM020
    - QM027
  - type: private-evidence-only
    severity: material
    topic: critical-infrastructure-adoption
    missingEvidence: Verified examples of private infrastructure operators independently deploying active counter-UAS effectors under current U.S. authority structures.
    whyItMatters: The security adjacency may be strategically important, but the legal route from interest to live deployment is still opaque in public sources.
    diligencePath: Ask management for named deployments, legal approvals, operator SOPs, and the share of security revenue that comes from sensors versus active effectors.
    relatedQuestionRefs:
    - QM011
    - QM028
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: program-conversion
    missingEvidence: A documented path from IFPC-HPM prototypes to scaled production lots, recurring budget lines, and unit fielding beyond the currently disclosed prototype batch.
    whyItMatters: Prototype momentum supports product relevance but does not by itself justify production-scale revenue assumptions.
    diligencePath: Review Army acquisition milestones, production decision criteria, budget exhibits, and any signed options or follow-on procurement plans.
    relatedQuestionRefs:
    - QM017
    - QM018
    - QM021
    - QM026
