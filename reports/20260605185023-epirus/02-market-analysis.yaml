    - Vehicle prime or defense integrator
    - Program office and field unit receiving integrated platform
    - Prime contract or teaming arrangement
    - Platform integration -> testing -> bundled sale
    - Prime contractor business unit
    - Buyer preference for layered, mobile, or autonomous systems
