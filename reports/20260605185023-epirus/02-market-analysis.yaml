- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Epirus
  rows:
  - - Broad counter-UAS stack
    - Detection, tracking, identification, C2, defeat, integration, and sustainment for unauthorized-drone defense
    - General aerospace, non-UAS EW, and unrelated air-defense missions
    - Defense ministries, homeland-security agencies, infrastructure operators, venue-security sponsors
    - Reference TAM only; far broader than Leonidas
  - - Directed-energy counter-drone
    - Laser, HPM, dazzler, and associated directed-energy defeat layers
    - Detection-only stacks, RF-jamming-only packages, interceptor missiles
    - Defense PMs, DHS-style event-security buyers, select allied ministries
    - Closer adjacency but still broader than HPM
  - - HPM counter-swarm systems
    - Fixed, semi-fixed, vehicle-mounted, expeditionary, and autonomous HPM effectors for drone defeat
    - Laser-only systems and non-kinetic jammers without microwave effectors
    - Army air defense, USMC expeditionary air defense, homeland critical-site buyers
    - Core Leonidas hardware market
  - - Perception / air-domain awareness
    - Radar, RF, EO/IR, data fusion, track and classify software
    - Hard-kill and HPM effectors
    - Security operators, base-defense units, integrators
    - Adjacent software opportunity, not Leonidas core TAM
  - - Kinetic interceptors
    - Missiles, guns, interceptor drones, and related launchers
    - Non-kinetic defeat and sensing-only products
    - Army, NATO, airport and critical-infrastructure defenders
    - Status-quo budget substitute competing for the same problem
  - - Managed event / site security
    - Temporary venue protection, contracts, grants, and integrated service packages
    - Long-cycle defense programs and unrelated managed security services
    - DHS, state/local authorities, prime contractors, venue sponsors
    - Emerging adjacency but authority-constrained
  - - Critical-infrastructure protection
    - Airspace protection for airports, ports, power, water, stadiums, and government sites
    - Generic cyber or perimeter-security tools unrelated to UAS defeat
    - Infrastructure owner, public-safety agency, or federal program sponsor
    - Important long-term adjacency with uncertain legal deployment path
  notes: Headline counter-UAS TAM includes many layers that Leonidas does not monetize directly; the Epirus-relevant core is the HPM defeat layer plus limited adjacent software and integration spend.
