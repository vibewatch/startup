- id: contradictions-and-gaps
  title: Contradictory estimates, procurement friction, and evidence gaps
  body: 'For diligence, the biggest analytical trap is to treat the total counter-UAS market as if it were automatically Epirus'' SAM. The sources do not support that. Broad market estimates differ materially, directed-energy estimates differ even more, and official government sources are far better at validating authority structures and prototype status than at revealing final HPM budget lines. What the evidence does support is more modest and more decision-useful: there is real demand for HPM in Army, USMC, and selected homeland-security programs; military end use still dominates the market mix; and private critical-infrastructure opportunity exists but is constrained by authority, integration, and deployment rules. The unresolved questions are equally important. Public sources do not reveal Leonidas-specific export classification, making international SAM sensitive to licensing assumptions. Public sources also do not show how much of the private critical-infrastructure market can legally
    deploy active effectors versus merely detect and track drones. And while Epirus has strong prototype momentum, there is still a visible gap between current award flow and a stable program-of-record cadence. The right diligence response is therefore to preserve the contradictions, discount export and commercial upside until the legal path is clearer, and anchor any market narrative on observable procurement rather than on the largest available forecast.'
