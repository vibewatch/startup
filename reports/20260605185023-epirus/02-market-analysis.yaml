- id: TM004
  title: Growth drivers and adoption constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Escalating drone incidents across battlefields and civil airspace
    - Driver
    - Now
    - Raises urgency across defense, border, and event-security buyers
    - Which programs moved from watch-list to funded requirement in the last 12 months?
  - - Cost imbalance between cheap drones and expensive interceptors
    - Driver
    - Now
    - Improves non-kinetic ROI case for HPM and related effectors
    - What is the customer-accepted cost-per-engagement benchmark?
  - - Swarm and fiber-optic threat evolution
    - Driver
    - Now
    - Favors wide-area defeat mechanisms over single-target or comms-only solutions
    - How often do buyers explicitly require fiber-optic resilience?
  - - Layered-assurance doctrine and C2 integration requirements
    - Driver
    - Near term
    - Rewards vendors that integrate cleanly into broader defense stacks
    - Where is Leonidas the prime effector versus a subsystem?
  - - Homeland and mega-event security funding
    - Driver
    - 2026-2028
    - Expands non-military demand through DHS vehicles, grants, and public-safety programs
    - What share of DHS-funded deployments can use active HPM effectors versus sensors only?
  - - Prototype-to-program-of-record conversion risk
    - Constraint
    - Now
    - Successful tests do not guarantee scaled procurement or recurring budgets
    - What milestones must IFPC-HPM hit before formal production decisions?
  - - Domestic legal authorities and privacy / civil-liberties guardrails
    - Constraint
    - Now
    - Limits who can deploy active counter-UAS systems and under what rules
    - Which operator categories can independently field effectors today?
  - - Export licensing and dual-use controls
    - Constraint
    - Now
    - Can slow allied delivery timelines and narrow practical SAM relative to headline demand
    - What is the ECCN / USML classification and expected license lead time?
  - - Technical maturity, power, and integration burden
    - Constraint
    - Near term
    - Buyers must trust safety, thermal, platform, and interoperability performance
    - What are the repeatable performance envelopes by platform and climate?
  - - Headline market-estimate ambiguity
    - Constraint
    - Ongoing
    - Overstates TAM and makes valuation narratives easy to inflate
    - Which budgets and unit counts are independently observable today?
  notes: This table mixes demand drivers with adoption frictions because the market is being pulled forward by threat urgency but held back by authority, integration, and program-conversion bottlenecks.
