          - type: paragraph
            body: >
              The main customer risk is concentration inside U.S. defense, especially the Army. Public named proof is
              dominated by Army programs, with Navy and Marine Corps as smaller adjacent references, DSTA as an
              exploratory international proof point, and Air Force or DARPA mostly in sponsor form. That concentration
              would be acceptable if public evidence also showed a clean transition into stable procurement, but it does
              not. CRS says no further procurement was planned beyond the next IFPC-HPM prototypes, while National
              Defense says directed-energy systems still have not been fielded in significant numbers. Domestic
              commercial expansion also faces authority and policy friction: DOJ, DHS, and DoD all describe counter-UAS
              activity through designated authorities, contract vehicles, or command guidance, not as a simple private
              procurement market. International growth must also navigate export licensing and Wassenaar-style controls.
              Partners clearly help Epirus widen access, but they also create channel dependence and can obscure direct
              ownership of the end-customer relationship. The public underwriting view is therefore constructive on
              relevance, cautious on durability, and explicitly incomplete on concentration, retention, and conversion
              from prototype to scaled procurement.
            claimRefs:
