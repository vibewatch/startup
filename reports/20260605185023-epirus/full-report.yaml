      - number: '8.2'
        title: Market tailwinds and revenue drivers are real, but still mostly pre-scale
        blocks:
          - type: paragraph
            body: >
              The demand backdrop is supportive. MarketsandMarkets projects the global counter-UAS market to grow from
              $6.64 billion in 2025 to $20.31 billion by 2030, with North America benefiting from defense,
              homeland-security, airport, border, and critical-infrastructure demand. The same research and adjacent
              market commentary point to a broader mix of buyers than just the Pentagon: airports, utilities, oil and
              gas sites, and event venues are increasingly part of the commercial protection story, while NATO and
              allied governments are building interoperable counter-drone architectures that could eventually favor
              systems like Leonidas. Epirus also has tangible public revenue drivers inside that macro theme: visible
              U.S. Army OTA-style and follow-on contracts, Navy and Marine expeditionary work, and early international
              demonstrations such as the DSTA relationship. But the distinction between demand and monetization is still
              crucial. Public sources show contract momentum, not disclosed recurring revenue. They also show that
              directed-energy systems have still not been fielded in significant numbers, so valuation should reward
              option value and category pull without assuming that every market tailwind will convert into near-term
              bookings.
            claimRefs:
              - CV004
              - CV005
              - CV013
              - CV014
              - CV057
              - CV058
              - CV059
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV004
              - CV008
              - CV010
              - CV057
              - CV060
              - CV065
      - number: '8.3'
        title: Epirus sits in the middle of the 2025 defense-tech valuation stack, not at the top
        blocks:
          - type: paragraph
            body: >
              The best comparable frame is not traditional public-defense hardware alone; it is the broader 2025 venture
              market for dual-use and defense technology. Anduril's June 2025 round at a $30.5 billion valuation, Shield
              AI's $5.3 billion round, and Saronic's $4 billion round show that investors will still pay aggressive
              prices for companies that combine software leverage, autonomy, manufacturing ambition, and category
              leadership. Joby adds a useful public-market reference: it carried about $5.63 billion of market value in
              mid-2025 and reported $2.5 billion of cash in Q1 2026, illustrating how frontier hardware stories can
              sustain multi-billion values before mature profitability if capital access and strategic narrative remain
              intact. Epirus, however, is smaller and more constrained than those leaders. It has one flagship HPM
              family, meaningful but still concentrated customer proof, and much thinner public economics. That does not
              make it unattractive; it means the valuation discount versus Anduril, Shield, Saronic, and Joby is
              rational until Leonidas proves it can move from highly visible programs into standard budget lines,
              sustainment, and broader software-enabled system ownership.
            claimRefs:
              - CV051
              - CV052
              - CV053
              - CV054
              - CV055
              - CV056
              - CV060
              - CV061
              - CV066
