  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Latest round anchor and what the down round really signals
        blocks:
          - type: paragraph
            body: >
              The core public valuation fact pattern is narrow but actionable. Epirus raised an oversubscribed $250
              million Series D in March 2025, co-led by 8VC and Washington Harbour Partners with General Dynamics Land
              Systems participating. TechCrunch reported that Epirus confirmed the round was still above $1 billion, but
              January 2025 reporting citing Bloomberg said the financing could price around $1 billion and below the
              company's explicit $1.35 billion Series C mark from 2022. That combination matters. It says investors
              still view Epirus as strategically relevant and worth financing at scale, yet they were not willing to
              simply roll forward a peak-cycle defense-tech multiple without clearer proof on revenue conversion,
              backlog quality, or unit economics. In practice, the round looks less like a crisis and more like a
              valuation reset: enough confidence to fund manufacturing, not enough transparency to support a premium
              mark. For investors, that means the question is no longer whether Epirus can raise capital, but whether
              the next step in procurement and disclosure can justify paying materially above the current implied band.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV012
