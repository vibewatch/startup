        title: Milestones, customer proof, and scale trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest part of the Epirus overview is not abstract positioning but the density of dated milestones
              that connect financing to delivered hardware. After opening a larger Torrance headquarters in 2021, the
              company kept iterating the Leonidas family, including portable and maritime variants, while moving beyond
              demos into Army programs. The January 2023 IFPC-HPM award, first Army delivery in November 2023, and
              four-system delivery plus training and testing completion in May 2024 show that Leonidas has moved past
              laboratory status. The company then widened its footprint with a Lawton/Fort Sill office, a
              5,300-square-foot immersive innovation center, Navy and Marine Corps expeditionary work, a
              second-generation Army contract in 2025, and a January 2026 DSTA partnership in Singapore. Those are
              meaningful scale signals. The main caution is analytical, not existential: even supportive independent
              coverage stresses that microwave effectors belong inside layered defense architectures, and the corpus
              still does not provide enough public evidence to quantify commercial traction, recurring customer count,
              or the exact economics of production scale.
