      - number: '7.2'
        title: Export-control, regulatory, and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is unusually central for Epirus because the company is selling a defense-oriented,
              high-power microwave platform while simultaneously talking about international expansion. BIS states that
              exporters must determine whether an item is subject to the EAR, apply for licenses where necessary, and
              evaluate license exceptions; the Wassenaar Arrangement frames dual-use and arms transfers as
              security-sensitive; and Cornell's legal-text reproduction identifies 22 CFR Subchapter M as the
              International Traffic in Arms Regulations. International growth is therefore not just a sales problem, it
              is an export-jurisdiction and compliance problem. The legal stack is broader than export control. Epirus'
              2026 CMMC Level 2 certification mitigates CUI-handling risk for defense work, while DOJ, DoD, and DHS
              materials show that counter-UAS use cases sit inside an evolving authority and procurement environment. On
              the IP side, Epirus has publicly marked a patent portfolio and explicitly invokes the patent-marking
              statute, but public sources do not show freedom-to-operate work, license disputes, or litigation history.
              The main adverse signal is not a visible legal failure today; it is that the company has not publicly
              disclosed export classifications, actual license history, or the diligence artifacts needed to underwrite
              international execution with confidence.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
