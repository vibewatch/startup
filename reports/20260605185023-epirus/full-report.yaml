        title: Customer base segmentation and buyer map
        blocks:
          - type: paragraph
            body: >
              Epirus’s public customer picture is broad at the top of the funnel but narrow in named proof. The company
              explicitly groups counterparties into government, industry, research and academia, and commercial
              organizations, and its government page centers the current mission on the DoD and allied militaries across
              ground, air, and sea defense. That framing is consistent with the strongest named customer evidence: U.S.
              Army IFPC-HPM, Navy and Marine Corps expeditionary work, and Singapore DSTA. The security, communications,
              and energy pages widen the map to critical-infrastructure operators, radio and phased-array buyers, and
              digital-energy operators, but those pages remain segment marketing rather than named customer disclosures.
              Publicly, buyer, user, and payer are also not the same role. Army RCCTO, ONR, DARPA, and the Air Force
              appear as paying organizations; soldiers, sailors, Marines, and port-security operators are the implied
              users; and commercial infrastructure operators are mostly future-facing beneficiaries rather than named
              current accounts. That means the chapter should be read as a buyer-map and proof-quality exercise, not a
