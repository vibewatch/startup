      - number: '7.5'
        title: People, execution, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Execution risk now rests heavily on management discipline. Andy Lowery is the most visible operating
              spokesperson across financing, compliance, and growth messaging, which makes him important not just as a
              CEO but as the bridge between engineering, procurement, and investor confidence. Reed Werner's CFO
              appointment improves finance coverage, and the advisory-board additions add defense credibility, but
              public materials still do not show deep bench transparency, succession planning, or the operating metrics
              a buyer would want before underwriting a scaled hardware platform. The visible mitigation stack is real:
              CMMC Level 2 certification, a public patent portfolio, Army delivery milestones, partner integrations, and
              new capital specifically earmarked for process and manufacturing improvements. Still, the chapter's
              thesis-break triggers are not abstract. If export readiness for international opportunities remains
              opaque, if Army follow-on momentum stalls, if manufacturing and systems expansion fail to show up in
              future disclosures, or if later financing confirms a materially weaker valuation reset, the thesis should
              compress quickly. Epirus is therefore best framed as a company with credible proof and credible
              mitigations, but one that still needs several execution checkpoints to clear before risk can be called
              moderate.
