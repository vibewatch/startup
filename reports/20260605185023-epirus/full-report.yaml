      - number: '5.2'
        title: HPM architecture and technical operating model
        blocks:
          - type: paragraph
            body: >-
              The most important technical claim is not simply that Leonidas emits microwaves, but that Epirus has
              turned high-power microwave into a software-shaped, modular, and comparatively deployable architecture.
              The electronic-warfare page says Leonidas uses GaN semiconductors, line replaceable amplifier modules, and
              software-defined waveform control to improve range and firing efficiency without new hardware. That
              matters because the company is selling upgradeability and form-factor reuse as much as raw effect.
              Open-architecture claims and FAAD C2 interoperability matter for the same reason: Leonidas must slot into
              existing air-defense workflows, not replace them. The adjacent R&D surface supports that story. Advanced
              Electronics, DARPA MAX, DARPA WARDEN/RANGER, and the ONR-funded Oklahoma work all point to a technical
              stack built around intelligent power management, waveform modeling, phased-array output improvement, and
              digital-twin optimization. Public evidence does not show the full bill of materials or integration
              documents, but it does show a coherent architecture thesis: sensing and C2 on top, software weaponeering
              in the middle, and power-dense modular HPM hardware underneath.
