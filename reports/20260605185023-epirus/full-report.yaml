            replacement.
        - label: Power and amplifier layer
          detail: >-
            GaN devices, intelligent power management, LRAM modularity, and later high-density batteries support HPM
            output.
        - label: Effector and wrapper layer
          detail: >-
            The common Leonidas core is wrapped into fixed, mobile, pod, expeditionary, maritime, and autonomous
            variants.
