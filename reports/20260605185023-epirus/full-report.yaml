        - No meaningful follow-on beyond today's visible Army / expeditionary path
        - The strongest public demand spine weakens and the base case compresses
        - Re-underwrite toward the bear case
      - - Next financing resets hard
        - New money lands below the unicorn threshold or with heavy structure
        - Confirms that public strategic relevance is not converting into pricing power
        - Move from track to avoid until terms improve
      - - Prime substitution wins
        - Raytheon or other large incumbents start winning the key HPM / layered-defense slots
        - Standalone category leadership weakens and optionality narrows
        - Cut valuation assumptions sharply
      - - Unit economics disappoint
        - BOM, sustainment, or service burden look closer to low-margin contractor economics
        - The case for a multi-billion rerating collapses
        - Demand a much lower entry price or step away
      - - International option value stays hypothetical
