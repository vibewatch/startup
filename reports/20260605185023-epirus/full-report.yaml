            body: >
              Epirus’s repeat-usage story is inferential rather than metric-rich. The Army’s follow-on behavior is the
              only public pattern that looks like land-and-expand: initial award, system delivery, training and testing,
              modification funding, and Gen II continuation. That is valuable, but it is not the same thing as NRR, GRR,
              renewal rate, or multi-year cohort retention. No reviewed public source discloses churn, renewal
              percentage, average contract term, satisfaction, or customer-by-customer expansion. The commercial side is
              even thinner. Epirus markets broad security, communications, and energy opportunities and says commercial
              companies already choose it for critical missions, yet it does not publicly name those commercial
              customers or disclose production outcomes. The Series D, Palantir Warp Speed announcement, and
              security-market messaging all point toward future defense-plus-commercial expansion, but the present-state
              evidence is still almost entirely government and government-adjacent. For diligence, the key takeaway is
              that repeat demand exists in one visible government program, while broader durability and diversification
              remain largely unverified.
