              - CV044
              - CV065
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Real national-security tailwinds exist
            body: >
              Counter-swarm defense is no longer a theoretical need; the size and urgency of the C-UAS market make
              Epirus worth continued investor attention.
            calloutType: strength
            claimRefs:
              - CV057
              - CV058
              - CV059
          - type: callout
            title: The down-round signal and prime competition matter
            body: >
              Epirus preserved unicorn status, but that does not mean investors should ignore a likely valuation reset
              or the presence of credible substitute systems from much larger defense players.
            calloutType: risk
            claimRefs:
              - CV003
              - CV060
              - CV064
          - type: callout
            title: Track, do not chase
            body: >
              Epirus merits active follow-up and deeper diligence, but the current public record is still too thin to
              justify a conviction buy at a premium valuation.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV021
              - CV065
