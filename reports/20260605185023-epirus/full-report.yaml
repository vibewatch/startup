      - CE010
      - CE011
      - CE012
      - CE020
      - CE024
      - CE030
      - CE032
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Publicly visible journey from threat recognition to contracting vehicle, prototype delivery, operator training,
      and either follow-on procurement or stalled transition.
    data:
      nodes:
        - id: j1
          label: 'Threat recognition: drone-swarm or critical-infrastructure exposure becomes urgent'
        - id: j2
          label: 'Discovery: agency, sponsor, or operator encounters Leonidas through demos, primes, or market pages'
        - id: j3
          label: 'Contracting path: OTA, SBIR, IDIQ, MOU, or exercise slot creates entry point'
        - id: j4
          label: 'Prototype or field experiment: Army delivery, ANTX-CT24, ExDECS, or Air Force R&D award'
        - id: j5
          label: 'Operator validation: NET, EDT, suitability fixes, and kill-chain integration'
        - id: j6
          label: 'Repeat funding or partner expansion: Gen II, sensor-suite mod, GDLS / Peraton / DFT channels'
        - id: j7
          label: >-
            Decision point: convert to scaled procurement, remain in prototype, or stall behind authority / export /
            budget friction
    approximationNotes: >-
      Stages synthesize public contract, delivery, and regulatory evidence. Exact sales-cycle length and conversion
      percentages are not publicly disclosed.
    claimRefs:
      - CU006
      - CU010
      - CU017
      - CU030
      - CU032
      - CU049
      - CU050
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Ordinal public-evidence funnel showing how many customer stages are visible in the open record, not
      company-reported conversion rates.
    data:
      items:
        - label: Publicly marketed buyer segments
          value: 7
          displayValue: 7 visible segments
        - label: Named government / sponsor organizations
          value: 8
          displayValue: 8 named orgs
        - label: Programs with contract or grant proof
          value: 7
          displayValue: 7 programs
        - label: Programs with delivery or field-test proof
          value: 4
          displayValue: 4 programs
        - label: Programs with visible follow-on or repeat funding
          value: 2
          displayValue: 2 clear repeats
        - label: Named commercial production customers
          value: 0
          displayValue: 0 disclosed
    approximationNotes: >-
      Counts are based on public proofs visible in reviewed sources as of 2026-06-05. They are evidence counts, not
      internal pipeline counts.
    claimRefs:
      - CU012
      - CU022
      - CU024
      - CU041
      - CU044
      - CU045
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: Assesses public proof quality by customer segment rather than by raw logo count.
    data:
      columns:
        - Named contract / award
        - Delivery or field test
        - Production maturity
        - Quantified outcome
        - Retention visibility
      rows:
        - label: U.S. Army IFPC-HPM
          values:
            - Yes — multiple awards
            - Yes — first system plus four-system delivery
            - Medium — strongest proof but still transitional
            - Low — no public ROI or uptime metric
            - Low — no renewal / NRR disclosure
          tone: positive
        - label: U.S. Navy / USMC
          values:
            - Yes — ONR / ExDECS award
            - Yes — prototype delivery and ANTX test
            - Low-medium — prototype and exercise stage
            - Low — no public mission metrics
            - Low — no repeat order disclosed
          tone: neutral
        - label: Singapore DSTA
          values:
            - MOU only
            - No delivery disclosed
            - Low — exploratory
            - None disclosed
            - None disclosed
          tone: neutral
        - label: Air Force / DARPA / ONR sponsors
          values:
            - Yes — multiple awards / grants
            - Mostly research proof
            - Low — sponsor not fleet adoption
            - Low — technical, not customer ROI
            - None disclosed
          tone: neutral
        - label: Partner-channel programs
          values:
            - Yes — multiple teaming agreements
            - Some field demo evidence
            - Medium — route to market, not direct proof
            - Low — partner benefit claims mostly qualitative
            - Low — partner renewals undisclosed
          tone: neutral
        - label: Commercial / critical infrastructure
          values:
            - No named production contract
            - No named live deployment
            - Low — marketed future segment
            - None disclosed
            - None disclosed
          tone: negative
    approximationNotes: >-
      Matrix scores the quality of public evidence only. Internal company data could be materially stronger than what is
      visible outside the data room.
    claimRefs:
      - CU017
      - CU023
      - CU024
      - CU026
      - CU039
      - CU043
      - CU044
      - CU046
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Highest residual exposure sits where export and production scaling intersect with customer concentration and
      opaque commercialization data.
    claimRefs:
      - CR001
      - CR012
      - CR021
      - CR031
      - CR037
      - CR046
      - CR048
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical impact
          values:
            - label: IP dispute surprise
              tone: neutral
              detail: Patent posture is visible, but no public disputes are known.
            - label: Army follow-on stall
              tone: warning
              detail: Public proof is concentrated in Army-related pathways.
            - label: Export readiness failure during international push
              tone: negative
              detail: International growth is stated, but company-specific export path is not public.
        - label: High impact
          values:
            - label: Adoption timing slips
              tone: warning
              detail: Directed energy still has limited broad fielding despite strong use-case logic.
            - label: Manufacturing ramp misses
              tone: negative
              detail: Series D itself cites supply-chain resiliency and manufacturing expansion needs.
            - label: Commercial diversification remains absent
              tone: negative
              detail: Public customer proof remains defense concentrated.
        - label: Medium impact
          values:
            - label: Partner roadmap friction
              tone: neutral
              detail: Integrated deployments depend on ecosystem partners.
            - label: Compliance operating load
              tone: warning
              detail: CMMC and counter-UAS authority changes add process overhead.
            - label: Bench-depth opacity
              tone: warning
              detail: Public succession and retention detail is still thin.
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      Execution misses transmit first into delayed deliveries and export conversion, then into concentration, financing
      pressure, and lower underwriting confidence.
    claimRefs:
      - CR021
      - CR030
      - CR037
      - CR040
      - CR041
      - CR047
      - CR048
    data:
      nodes:
        - id: n1
          label: Manufacturing / supply-chain miss
          detail: Scale-up capital does not translate into predictable throughput.
          tone: negative
        - id: n2
          label: Delayed program deliveries
          detail: Army and partner-linked deployments slip or remain limited.
          tone: warning
        - id: n3
          label: International conversion delay
          detail: Export and testing pathways do not become bookable sales.
          tone: warning
        - id: n4
          label: Concentration persists
          detail: Defense demand remains the only visible revenue path.
          tone: warning
        - id: n5
          label: Next financing signal weakens
          detail: Future round or mark implies slower value creation.
          tone: negative
        - id: n6
          label: Underwriting confidence compresses
          detail: Residual risk stays high despite technical proof.
          tone: negative
      edges:
        - from: n1
          to: n2
        - from: n1
          to: n5
        - from: n2
          to: n4
        - from: n3
          to: n4
        - from: n4
          to: n6
        - from: n5
          to: n6
        - from: n2
          to: n6
  - id: FR003
    title: Dependency map
    type: dag
    layout: standard
    summary: >-
      Epirus depends on a layered network of government buyers, export/compliance gatekeepers, and integration partners
      rather than on a broad independent commercial base.
    claimRefs:
      - CR012
      - CR017
      - CR031
      - CR033
      - CR034
      - CR035
      - CR036
      - CR039
    data:
      nodes:
        - id: d1
          label: U.S. Army / IFPC
          detail: Largest visible delivery and follow-on path.
          tone: warning
        - id: d2
          label: ONR / USMC / JCO
          detail: Variant testing and expeditionary experimentation.
          tone: neutral
        - id: d3
          label: DSTA / future exports
          detail: International proof depends on testing and export readiness.
          tone: warning
        - id: d4
          label: BIS / ITAR workflow
          detail: Export classification and licensing gate international commercialization.
          tone: warning
        - id: d5
          label: Anduril / GDLS ecosystem
          detail: Integrated platform paths accelerate reach but add dependency.
          tone: neutral
        - id: d6
          label: Mission-aligned investors
          detail: Capital funds scale but also raises platform expectations.
          tone: neutral
        - id: d7
          label: Commercial customers
          detail: Publicly under-evidenced demand segment.
          tone: negative
      edges:
        - from: d1
          to: d6
        - from: d2
          to: d5
        - from: d3
          to: d4
        - from: d4
          to: d6
        - from: d5
          to: d1
        - from: d5
          to: d2
        - from: d6
          to: d7
        - from: d1
          to: d7
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >
      Real demand and real product proof exist, but financial opacity, down-round context, and competition keep the
      recommendation at track rather than buy.
    data:
      nodes:
        - id: n1
          label: Threat tailwind
          detail: Counter-swarm demand is rising across DoD, DHS, and allied buyers.
          type: input
        - id: n2
          label: Product proof
          detail: Leonidas has meaningful Army follow-on and visible swarm-effect evidence.
          type: input
        - id: n3
          label: Capital access
          detail: $250M Series D proved fundability in 2025.
          type: input
        - id: n4
          label: Valuation reset
          detail: The latest round likely cleared below the 2022 Series C mark.
          type: intermediate
        - id: n5
          label: Economic opacity
          detail: Revenue, gross margin, backlog, burn, and exact terms remain private.
          type: intermediate
        - id: n6
          label: Competitive risk
          detail: Raytheon and other primes can contest the HPM slot.
          type: intermediate
        - id: n7
          label: Valuation stance
          detail: Fair only inside a wide range and highly sensitive to conversion proof.
          type: intermediate
        - id: n8
          label: TRACK
          detail: Continue diligence; do not treat current evidence as sufficient for a premium entry.
          type: output
      edges:
        - from: n1
          to: n7
        - from: n2
          to: n7
        - from: n3
          to: n7
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n7
        - from: n7
          to: n8
    claimRefs:
      - CV003
      - CV004
      - CV057
      - CV060
      - CV065
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >
      Epirus's reasonable valuation range is bracketed more cleanly by current comps and scenario anchors than by any
      single financial multiple.
    data:
      items:
        - label: Epirus bear mid
          value: 400
          detail: Slow adoption and prime compression.
        - label: Epirus current floor
          value: 1000
          detail: Management confirmed the Series D stayed above $1B.
        - label: Epirus Series C
          value: 1350
          detail: Last explicit clean valuation mark.
        - label: Epirus base mid
          value: 1750
          detail: Niche but durable DoD supplier outcome.
        - label: Epirus bull mid
          value: 4000
          detail: NATO and sustainment/platform expansion outcome.
        - label: Saronic
          value: 4000
          detail: 2025 Series C reference.
        - label: Shield AI
          value: 5300
          detail: 2025 F-1 strategic round reference.
        - label: Joby reference
          value: 5630
          detail: Public market value anchor in 2025.
        - label: Anduril
          value: 30500
          detail: 2025 scale leader.
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV056
      - CV062
      - CV063
      - CV064
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >
      The public case is best expressed as wide scenario bands: the downside is severe, but procurement conversion
      creates a real rerating path.
    data:
      items:
        - label: Bear case
          low: 250
          mid: 400
          high: 500
          unit: USD millions
          description: Prime substitution, slow adoption, or budget / timeline pressure.
        - label: Base case
          low: 1500
          mid: 1750
          high: 2000
          unit: USD millions
          description: Niche but durable supplier with moderate international follow-on.
        - label: Bull case
          low: 3000
          mid: 4000
          high: 5000
          unit: USD millions
          description: Leonidas becomes standard layered asset with software / sustainment attach.
        - label: Current public anchor
          low: 1000
          mid: 1175
          high: 1350
          unit: USD millions
          description: Reconciles the >$1B Series D disclosure with the 2022 $1.35B Series C mark.
    claimRefs:
      - CV003
      - CV062
      - CV063
      - CV064
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >
      Epirus scores well on market need and product proof, poorly on economics visibility, and lands in the middle on
      valuation discipline.
    data:
      items:
        - label: Market opportunity
          value: 8
          detail: Strong counter-UAS tailwind across defense and infrastructure.
        - label: Product / proof
          value: 7
          detail: Visible Army and swarm-effect evidence support technical relevance.
        - label: Customer breadth
          value: 5
          detail: Some Navy and allied signals, but public proof remains concentrated.
        - label: Economics visibility
          value: 3
          detail: Revenue, backlog, gross margin, and burn remain private.
        - label: Competitive position
          value: 5
          detail: Differentiated, but not insulated from prime-backed alternatives.
        - label: Valuation discipline
          value: 5
          detail: Fair only if procurement conversion accelerates.
        - label: Evidence quality
          value: 5
          detail: Good on contracts and funding headlines, thin on underwriteable financials.
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV057
      - CV060
      - CV065
