    summary: >-
      Leonidas is best understood as a stack linking sensing and C2 inputs to software-controlled power-dense HPM
      hardware and then to deployment-specific wrappers.
    data:
      layers:
        - label: Sensing and decision layer
          detail: >-
            Air Domain Awareness or external sensors classify threats and provide the air picture for response
            selection.
        - label: C2 and interoperability layer
