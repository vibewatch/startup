      - number: '4.5'
        title: Underwriting blockers and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The central underwriting blocker is not lack of strategic relevance; it is lack of audited operating
              disclosure. Public sources support the view that Epirus has credible product demand, meaningful Army
              traction, and enough outside capital to keep scaling. They do not support a confident view of revenue
              quality, customer concentration, gross margin durability, or cash efficiency. National Defense notes that
              directed-energy systems still have not been fielded in significant numbers, which matters because Epirus's
              biggest public wins remain prototype and developmental programs, not proof of scaled recurring
              procurement. Export-governance regimes such as the Wassenaar Arrangement add another execution variable
              for the international expansion story. The balanced verdict is therefore positive on strategic positioning
              but cautious on underwriting. Epirus likely has a financeable business if program-of-record conversion and
              manufacturing execution continue, but the next step for diligence is decidedly private-company diligence:
              backlog and option conversion, revenue by program, bill-of-materials and service margins, receivables
              aging, export-approval status, and a true cash-runway bridge. Without those items, any valuation view
              remains narrative-heavy.
