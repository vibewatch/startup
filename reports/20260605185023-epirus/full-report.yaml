        title: Dependencies, roadmap, and product risks
        blocks:
          - type: paragraph
            body: >-
              The dependency map is as important as the architecture map. Leonidas depends on continued government
              sponsorship, partner vehicles, transfer-control permissions, and continued progress in power-dense
              hardware. Army IFPC-HPM remains the most visible anchor customer, while ONR, JCO, Navy, Marine Corps,
              General Dynamics Land Systems, and Kodiak extend the product into expeditionary and autonomous use cases.
              Gen II’s public roadmap also shows how performance improvement depends on batteries, pulse control,
              waveform and polarization techniques, and continued soldier feedback. The biggest product risks follow
              directly from those dependencies. Independent coverage still highlights the gap between prototype success
              and formal program conversion. Public sources do not disclose Leonidas unit economics, sustained
              production cadence, quality certifications, or long-run field-service metrics. Export and allied expansion
              are also constrained by transfer-control regimes even though management positions international growth as
              part of the roadmap. The practical diligence view is therefore balanced: Epirus has a real product family,
              a credible HPM architecture, and unusually visible fielding milestones, but scaled manufacturing,
              sustainment, exportability, and program permanence remain the unresolved gates.
