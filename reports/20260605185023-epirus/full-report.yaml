  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and constrained sizing
        blocks:
          - type: paragraph
            body: >-
              Epirus sits in a narrower market than most counter-drone headlines imply. The broad counter-UAS category
              includes the full stack needed to detect, identify, track, and defeat unauthorized drones: radar, RF
              sensing, EO/IR, command-and-control, jamming, kinetic interceptors, and directed-energy effectors. That is
              why the published market numbers are both large and inconsistent. The Business Research Company places
              2025 counter-UAS at $3.21 billion, NaviStrat is materially lower on a 2024 base, Market Research Future
              grows from about $2.0 billion in 2025 to more than $18 billion by 2035, and The World Data presents an
              even wider 2026 range of roughly $3.88 billion to $4.93 billion. Those numbers are not interchangeable
              because they mix years, verticals, and technology layers. For Epirus, the relevant core is the HPM defeat
              layer inside directed energy, plus a smaller adjacency in air-domain awareness and integration. Even
              there, estimates diverge sharply: Intel Market Research values directed-energy counter-UAS at $1.42
              billion in 2025, while MarketsandMarkets Blog publishes a much larger $6.8 billion to $8.1 billion range.
              The more credible way to frame the opportunity is therefore a constrained sizing lens: broad c-UAS TAM in
              the low-single-digit billions, directed energy in a smaller but still highly variable slice, and
              observable near-term HPM procurement measured first by disclosed awards and fielding evidence rather than
              by headline CAGR tables.
