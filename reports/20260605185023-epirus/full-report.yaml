      - number: '3.3'
        title: Pricing, packaging, partner access, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Pricing transparency is weak across the whole peer set. Reviewed official pages market outcomes,
              capabilities, and demos, but not reliable list prices. That means public comparison is mostly about
              packaging logic rather than true economic benchmarking. Epirus stresses pennies-per-kill and unlimited
              magazine logic, but not the contract price of a deployed system. BlueHalo, Leonardo DRS, Fortem,
              DroneShield, and Dedrone all appear to sell through quote-led or program-led motions rather than an openly
              posted catalog. Distribution therefore matters as much as product. Epirus has credible partner access
              through GDLS and Anduril integrations, and its open API lowers integration friction. But those same facts
              imply lower proprietary lock-in than a closed end-to-end stack. Once a system is embedded into a vehicle,
              a command layer, and a specific doctrine, switching cost rises; before that point, multi-homing remains
              plausible because layered architectures let buyers mix sensors, C2, and effectors. For Epirus, the
              commercial question is not only whether Leonidas performs, but whether the company can secure enough
              distribution leverage before prime bundles and control-layer owners define the reference architecture.
