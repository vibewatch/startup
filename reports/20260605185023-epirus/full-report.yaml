  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk stack and investment implication
        blocks:
          - type: paragraph
            body: >-
              Epirus enters the risk chapter with real program proof but not the kind of operating transparency that
              would make a defense-hardware scaling story low risk. The company has delivered Army IFPC-HPM systems, won
              a Generation II follow-on contract, and raised a large 2025 Series D, so the question is not whether
              Leonidas exists. The question is whether Epirus can convert those wins into repeatable, lawful,
              exportable, margin-resilient scale before procurement cycles, export approvals, or capital-market
              sentiment tighten. The same documents that support the upside also reveal the strain points: the company
              said new capital was needed for supply-chain resiliency, manufacturing footprint, and internal systems;
              independent coverage said the latest round did not disclose exact valuation; and public customer proof is
              still dominated by defense buyers. That combination makes the residual risk high rather than existential.
              The core thesis remains investable only if management shows that program milestones can translate into
              broader, durable production throughput and not just episodic demonstration wins.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR037
              - CR038
