      - number: '2.3'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case is straightforward. Drone incidents are rising in war zones, on borders, and around
              critical infrastructure; layered-assurance architectures are replacing single-sensor point solutions; and
              the cost imbalance between cheap drones and expensive interceptors is politically and operationally
              unsustainable. HPM specifically benefits from two threat shifts. First, swarm attacks reward wide-area
              defeat rather than one-target-at-a-time engagement. Second, fiber-optic-controlled drones weaken the value
              of communications-jamming-only concepts, creating more room for physical electronic defeat. These factors
              explain why counter-drone has become a plausible “killer app” for directed energy after decades of slow
              fielding. But the constraints are just as important as the drivers. Prototype success does not guarantee a
              production record, as shown by CRS noting that no further IFPC-HPM procurement was planned beyond the
              then-current prototype set. Domestic deployment is authority-gated and policy-heavy, not a free commercial
              market. Export sales are also likely to move slowly because Wassenaar, EAR licensing, and potential ITAR
              treatment all create compliance work before hardware moves abroad. Finally, the market itself is
              analytically noisy: forecasts are easy to inflate because many analysts bundle sensors, services, lasers,
              AI, and HPM under one directed-energy or counter-drone umbrella. That makes proof of budget capture and
              fielding progress more valuable than generic forecast curves.
            claimRefs:
