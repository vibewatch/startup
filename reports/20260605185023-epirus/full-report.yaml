      - number: '2.2'
        title: Buyer, user, payer, and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The clearest current buyers are still military and homeland-security organizations rather than open
              commercial accounts. On the defense side, Army fixed-site defense and Marine expeditionary defense are the
              strongest visible archetypes. CRS describes IFPC-HPM as protection for fixed and semi-fixed sites, while
              the ExDECS program shows a parallel expeditionary path for the Marine Corps. In both cases the user is an
              operational air-defense or base-defense unit, but the buyer and payer sit with program offices,
              experimentation sponsors, and service budget owners. Homeland demand follows a different motion. DHS
              created a dedicated Program Executive Office for UAS and C-UAS in 2026, tied it to a $115 million
              near-term investment, a $1.5 billion contract vehicle, and $250 million in grants for FIFA-related
              capabilities. That implies a procurement environment mediated by approved authorities, federal funding
              vehicles, and integrators rather than simple point sales. Critical-infrastructure demand is real—Epirus
              itself cites airports, utilities, ports, stadiums, and government sites—but those buyers often need a
              public-safety partner, a legal authority path, or a prime contractor. Integration partners also matter
              because buyers may acquire Leonidas as part of a Stryker, trailer, or autonomous platform rather than as a
              standalone HPM emitter. In short, the buyer map is not just defense versus commercial; it is defense
              program offices, homeland-security contracting channels, and platform integrators who determine whether
              the end user ever sees the system.
