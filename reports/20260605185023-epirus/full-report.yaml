      - number: '1.2'
        title: Leadership, founders, and governance
        blocks:
          - type: paragraph
            body: >-
              The founder and governance picture is unusually important because Epirus sits at the intersection of
              venture capital, defense procurement, and technical execution. Joe Lonsdale is a co-founder and remains
              closely tied to the company through 8VC, while Grant Verstandig was identified by the company as a
              co-founder and executive chairman during earlier financing rounds. Governance is also visibly 8VC-linked
              through chairman Alex Moore. Operational leadership, however, has shifted over time: Leigh Madden led the
              company during the Series B and Series C era, Ken Bedingfield served as CEO immediately before the current
              phase, and Andy Lowery took over in December 2023 after the first Army IFPC-HPM delivery. Lowery's
              background spans defense and enterprise hardware, and Reed Werner's 2025 CFO appointment adds more formal
              capital-markets and defense-finance expertise. The result is a leadership stack with strong
              founder-investor continuity but also clear key-person dependence on Lowery for product scaling, Army
              program execution, and public strategic narration.
