    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and product scope
        blocks:
          - type: paragraph
            body: >-
              Epirus presents itself as a private defense-technology company founded in 2018 to address asymmetric
              security threats, especially the problem of countering low-cost drone and drone-swarm attacks with
              non-kinetic effects. The public identity is consistent across the homepage, about page, and later
              financing materials: the flagship product is Leonidas, a software-defined high-power microwave platform,
              while adjacent offerings include air-domain-awareness software and advanced-electronics capabilities that
              support broader counter-electronics missions. Headquarters are in Torrance, California, following the
              company's 2021 move into a larger corporate facility. The company is best described as a venture-backed
              defense hardware and systems company rather than a software-only vendor; its public materials emphasize
              prototype delivery, integration with government programs, and support for layered defense. That said, the
              reviewed corpus does not disclose current revenue, ARR, or customer-count metrics, so those operating
              indicators should be treated as explicit diligence gaps rather than inferred from the company's rapid
              fundraising cadence.
