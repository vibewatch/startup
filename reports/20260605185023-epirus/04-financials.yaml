  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: working-capital
    missingEvidence: Quarterly receivables, inventory, payables, and milestone-billing schedules by program.
    whyItMatters: Hardware-delivery businesses can look well funded while still consuming large amounts of working capital between procurement, integration, and customer acceptance.
    diligencePath: Request the last eight quarters of balance-sheet detail, milestone invoices, and collections by major program.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration by customer, program, and prime-contractor channel plus any termination or recompete exposure.
    whyItMatters: Public evidence points to Army dependence, but the underwriting risk changes materially if one customer or one program represents a large share of revenue.
    diligencePath: Request trailing-twelve-month revenue by customer and program, option status, and recompete calendar.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Cash balance, monthly gross and net burn, capital-expenditure plan, and covenant schedule if any debt exists.
    whyItMatters: Capital adequacy cannot be underwritten from fundraising totals alone because production ramp, hiring, and inventory can consume cash faster than contract awards convert to collections.
    diligencePath: Request monthly cash bridge, board reporting package, and 24-month base and downside runway model.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: Recognized revenue, backlog, bookings, option value, and gross margin split between hardware, services, and any software or support elements.
    whyItMatters: Without these disclosures, investors cannot judge revenue quality, margin path, or whether valuation depends on assumptions closer to hardware primes or software businesses.
    diligencePath: Request audited or board-approved revenue waterfalls, backlog roll-forward, and gross margin by program and product family.
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
