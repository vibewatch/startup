- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: 'Public capital formation is Epirus''s clearest financial strength. The company officially says it has raised more than $550 million, while independent coverage places disclosed funding around $595 million. The last clean priced round in primary company materials is the 2022 Series C at a $1.35 billion valuation. The March 2025 Series D brought in $250 million of fresh capital and was explicitly tied to production scale-up, talent acquisition, supply-chain resiliency, manufacturing expansion, and pushes into international and commercial markets. That is a meaningful buffer for a private defense hardware company. The caveat is equally important: TechCrunch said the company confirmed a valuation above $1 billion, but Bloomberg had reported the round was below the Series C mark. So capital remained available, but possibly at less attractive pricing than the prior cycle. More importantly, no reviewed public source discloses cash on hand, monthly burn, runway, or any debt terms. The result
    is a split verdict: capital access has clearly been strong, yet runway still cannot be underwritten because production ramp and inventory needs may consume cash faster than funding headlines suggest.'
