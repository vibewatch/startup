- id: unit-economics-and-public-gaps
  title: Unit economics, cost structure, and what public comps can and cannot tell us
  body: 'Epirus''s strongest public unit-economics point is the mission-level cost thesis: HPM can engage swarms without expending interceptors, and the company says Leonidas has unlimited magazine depth and software-defined upgradeability. But that same public record makes clear that Epirus remains a capital- and operations-intensive business. The company built a 100,000-plus-square-foot production footprint, expanded headcount rapidly, and is now talking about hyperscaling production under a newly installed CFO. Gen II systems add high-density batteries, more power, longer pulse widths, and more sophisticated support equipment, all of which likely improve mission utility while increasing manufacturing complexity. Because Epirus discloses no recognized revenue, gross margin, unit BOM, warranty reserve, or field-service cost, the best public bounding exercise comes from filings of public comps. AeroVironment''s 2025 filing implies roughly 38.8% gross margin, Kratos roughly 22.9%, and Palantir
    roughly 82.4%, which brackets the span from defense hardware to software. That range is analytically useful, but it does not solve the core problem: Epirus has not published enough data to locate itself inside that spectrum.'
