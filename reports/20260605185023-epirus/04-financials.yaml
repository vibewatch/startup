company:
  name: Epirus
chapter:
  number: 4
  title: Financials
  summary: Epirus's public record supports a government-centric defense-hardware revenue model funded by large private rounds and milestone-driven contracts, but not a clean read on recognized revenue, gross margin, or runway. Pricing is legible mainly through disclosed Army and Navy awards plus a cost-per-kill value narrative, while capital adequacy looks directionally strong after the $250 million Series D. Underwriting remains blocked on private data for backlog, unit economics, customer concentration, and cash burn.
sections:
- id: revenue-model-and-pricing
  title: Revenue model and pricing architecture
  body: 'Epirus looks financially like a venture-backed defense hardware and systems company, not like a self-serve SaaS vendor. The public surface markets Leonidas and related HPM variants as mission systems for government, allied, and partner users, with no posted price card and no sign of online checkout. Instead, public monetization evidence comes from program awards, deliveries, and value-based claims about cost correction: Epirus argues that kinetic counter-UAS tools can cost hundreds of thousands or even millions of dollars per engagement while Leonidas can defeat drones for pennies or less than a cent per kill. That is useful as a buyer ROI proxy, but it is not realized pricing. The only hard public pricing anchors are disclosed awards such as the $66.1 million Army prototype contract, the $43.551 million Gen II follow-on award, and the $5.5 million ONR expeditionary contract. Those support a picture of revenue driven by negotiated hardware, testing, support, and upgrade packages
    rather than by published subscription plans. Public materials also suggest an eventual software and support attach through open architecture, FAAD C2 integration, and waveform updates, but realized mix remains undisclosed.'
