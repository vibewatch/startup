- id: sales-motion-and-contracting-vehicles
  title: Sales motion and contracting vehicles
  body: 'The go-to-market motion is best understood as a long-cycle defense acquisition process with partner channels layered on top. Public evidence shows direct selling into DoD program offices through OTA-style prototyping and development awards, then progressive delivery, testing, training, and soldier-feedback loops that can mature into follow-on procurement. The 2023 Army contract, the first prototype delivery in late 2023, the completion of four-system delivery and testing in 2024, and the Gen II contract in 2025 all fit that pattern. Series B adds an earlier signal that Epirus also worked through primes and strategic partners: it disclosed a supplier agreement with Northrop Grumman and an investment from L3Harris. More recently, the company and outside coverage have described expansion into international and commercial markets, but those appear to be future growth vectors rather than a currently disclosed diversified revenue base. The public contract surface is also broader than a single Army line item: Epirus has disclosed ONR expeditionary work and DARPA MAX program work, but both still read like prototype or R&D channels rather than proof of scaled recurring procurement. The practical implication is that Epirus''s sales
    efficiency should be judged through program maturation, option exercise, and partner access, not through SaaS-style CAC or payback formulas that public data cannot support.'
