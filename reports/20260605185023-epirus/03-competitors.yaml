  rows:
  - - Software-defined modular HPM is differentiated
    - Prime-backed HPM peers and laser alternatives compress the uniqueness window
    - high
    - RTX Phaser, Lockheed MORFIUS, and BlueHalo all keep comparable non-kinetic buyer options visible
    - Test whether Epirus still wins when a buyer insists on prime distribution or laser precision
  - - Open integration accelerates adoption
    - Open architecture also lowers lock-in and makes multi-vendor substitution easier
    - high
    - Epirus emphasizes open API and partner integrations instead of a closed stack
    - Request evidence of renewal power and dislodgement difficulty after integration
  - - Partner channels extend reach
    - Dependence on GDLS and Anduril means distribution can be mediated by partners
    - high
    - Public mobile and layered announcements rely on partner vehicles or control stacks
    - Clarify channel economics, exclusivity, and who owns the prime customer relationship
  - - Directed energy should win on cost-per-shot
    - Public fielding is still limited and many buyers may still choose kinetic or interceptor solutions
    - high
    - National Defense says directed energy is not yet fielded in significant numbers; Fortem and status-quo options
      remain active
    - Review actual deployment tempo, readiness data, and recent program-of-record wins
  - - Microwave anti-swarm proof is a moat
    - Sensor, C2, and integrated-suite vendors can still own the operator console and budget even if Epirus wins
      the effector seat
    - medium
    - Robotics Press and RNG both point to layered architectures and control-layer ownership as decisive
    - Probe whether Leonidas is sold as the program anchor or as a swappable component
  - - Growing market should help all leaders
    - Fast market growth also invites more entrants and price pressure rather than guaranteeing durable margin
    - medium
    - Third-party market reports show a large and growing category with many named participants
    - Stress-test gross margin and price discipline under multi-vendor competition
