- id: moat-durability-and-adverse-evidence
  title: Moat durability is real but not immune to layered-architecture pressure
  body: 'The best public moat case for Epirus is technical rather than channel-based: software-defined waveforms,
    modular amplifier architecture, human-safe operation, anti-swarm demonstrations, and a growing product family.
    Those are meaningful strengths. But the adverse evidence matters. Independent coverage still describes directed
    energy as a category that has not yet been fielded in significant numbers, meaning no one can claim a fully
    settled market lead from public evidence. Independent landscape work also argues that winners are likely to
    be vendors that own command-and-control or integrate cleanly into one, not companies that market only a single
    effect modality. That is a double-edged fact for Epirus: open integration makes Leonidas easier to adopt, but
    also easier to slot into a mixed stack where another vendor owns the operator console and customer relationship.
    Prime bundling is the second major pressure point. Lockheed, RTX, and broader incumbent air-defense suppliers
    can attach counter-UAS capability to larger procurement envelopes and sustainment structures. The implication
    is that Epirus has a plausible but not impregnable moat; durability depends on proving operational readiness
    faster than primes and control-layer vendors can commoditize the effector seat.'
