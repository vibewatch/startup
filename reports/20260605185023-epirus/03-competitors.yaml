company:
  name: Epirus
chapter:
  number: 3
  title: Competitors
  summary: 'Epirus has a real direct peer set in microwave and directed-energy counter-UAS, but the harder competitive
    truth is broader: buyers can also choose laser, interceptor, radar, software-C2, and prime-bundled layered-defense
    alternatives. Public evidence supports Leonidas as a differentiated anti-swarm HPM product with credible partner
    access, yet pricing remains opaque, control-layer owners can multi-home effectors, and independent sources still
    treat directed energy as promising but not fully fielded at scale.'
sections:
- id: landscape-and-classes
  title: 'Landscape: direct peers, primes, adjacents, and status quo'
  body: 'Epirus does not face one tidy peer set. The narrowest direct comparison set is other publicly visible high-power-microwave
    programs, chiefly RTX''s Phaser and Lockheed Martin''s MORFIUS. But that direct-HPM frame is too narrow for
    a real buying process. Buyers usually procure an outcome: detect, classify, track, command, and defeat drones
    with acceptable cost, collateral profile, and deployment fit. On that broader job-to-be-done, BlueHalo''s laser
    LOCUST X3, Leonardo DRS'' integrated radar-to-defeat stack, Fortem''s radar-plus-interceptor SkyDome, and software-control
    vendors such as DroneShield and Dedrone all become relevant alternatives. Primes and incumbent air-defense suppliers
    matter even when they do not offer the same waveform because they can bundle counter-UAS into wider mobility,
    radar, and sustainment programs. Status-quo options remain kinetic interceptors, guns, legacy electronic warfare,
    and internal layered integration around existing C2. The result is that Epirus is best understood as a differentiated
    effector specialist inside a much wider layered-defense market, not as a company competing only with other microwave
    vendors.'
