  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-pricing-opacity
    missingEvidence: Current per-unit, per-site, sustainment, and software-license pricing for Epirus and the main
      competitor set.
    whyItMatters: Without real pricing the chapter can compare packaging logic but cannot test cost-per-effect or
      gross-margin durability.
    diligencePath: Request live quotes, sample contract line items, and sustainment schedules from management or
      procurement records.
    relatedQuestionRefs:
    - QP008
    - QP019
  - type: private-evidence-only
    severity: material
    topic: installed-base-opacity
    missingEvidence: Comparable installed-base counts, live deployments, renewal rates, and recent win-loss data
      by vendor.
    whyItMatters: Distribution strength and switching-cost durability cannot be fully underwritten from marketing
      pages and analyst summaries alone.
    diligencePath: Ask for deployment counts, active-program list, reference customers, and last-twelve-month competitive
      win-loss statistics.
    relatedQuestionRefs:
    - QP015
    - QP025
  - type: missing-source
    severity: minor
    topic: export-and-authority-boundaries
    missingEvidence: Country-specific export, spectrum, and rules-of-engagement constraints for microwave, laser,
      jammer, and interceptor systems.
    whyItMatters: Those boundaries influence how portable Epirus' moat is across allies and critical-infrastructure
      buyers outside U.S. defense programs.
    diligencePath: Collect export-control memos, country approvals, and program-specific operating-authority documents
      by target geography.
    relatedQuestionRefs:
    - QP025
