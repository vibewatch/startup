- id: capability-and-solution-shape
  title: Capability comparison centers on layered outcomes, not one modality
  body: 'Epirus'' public pitch is clear: Leonidas is software-defined HPM, anti-swarm by design, modular in form
    factor, and increasingly packaged for mobile and expeditionary use. That gives it a real wedge against cheap-drone
    saturation attacks, especially where collateral damage or magazine depth makes kinetic fire unattractive. Yet
    adjacent competitors attack the same mission from different technical centers of gravity. BlueHalo sells precise
    laser defeat for Group 1-3 UAS. Fortem combines radar, AI, and interceptor drones into an integrated defeat
    loop. Leonardo DRS emphasizes broad sensing, vehicle and stand-alone deployment, and full detect-track-defeat
    integration. DroneShield and Dedrone compete on sensing, signal processing, autonomous control, and operator
    workflow rather than on microwave energy. Public evidence therefore supports a market in which effectors are
    only one layer. Epirus looks strongest when mass defeat, open integration, and microwave-specific effects matter;
    it looks weaker when the buyer values broad sensor ownership, installed control software, or a pre-existing
    prime platform relationship more than the effector modality itself.'
