      - number: '2.4'
        title: 相互矛盾的估算、采购摩擦与证据缺口
        blocks:
          - type: paragraph
            body: >-
              尽调中最大的分析陷阱，是把整个反 UAS 市场自动当作 Epirus 的 SAM。来源并不支持这个判断。广义市场估算差异明显，定向能估算差异更大；官方政府来源更擅长验证授权结构和原型状态，而不是揭示最终 HPM
              预算线。证据真正支持的是更克制、也更适合决策的结论：陆军、USMC 和部分国土安全项目中，HPM
              需求真实存在；军事最终用途仍主导市场结构；私人关键基础设施机会存在，但受到权限、集成和部署规则约束。未解决问题同样重要。公共来源没有揭示 Leonidas 的具体出口分类，因此国际 SAM
              对许可假设高度敏感。公共来源也没有说明私人关键基础设施市场中有多大比例可以合法部署主动效应器，而不只是探测和跟踪无人机。尽管 Epirus
              原型势头很强，当前授标流和稳定正式列装项目节奏之间仍有清晰缺口。因此，正确的尽调反应是保留这些矛盾，在法律路径更清楚前折扣出口和商业上行，并把任何市场叙事锚定在可观察采购上，而不是最大那组预测。
