  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与产品范围
        blocks:
          - type: paragraph
            body: >-
              Epirus 将自己定位为一家私营防务科技公司，2018
              年创立，目标是应对非对称安全威胁，尤其是用非动能效果反制低成本无人机和无人机蜂群攻击。其公开身份在官网首页、公司介绍页面和后续融资材料中保持一致：旗舰产品是
              Leonidas，一个软件定义的高功率微波平台；相邻产品包括空域态势感知软件和高级电子能力，支撑更广泛的反电子任务。公司总部位于 California Torrance，此前在 2021
              年迁入更大的企业设施。Epirus 更像是一家风投支持的防务硬件和系统公司，而不是纯软件供应商；公开材料强调原型交付、接入政府项目，以及支撑分层防御。不过，已审阅材料没有披露当前收入、ARR
              或客户数量指标，所以这些运营指标应作为明确尽调缺口处理，而不是从公司快速融资节奏中推断。
