  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Leonidas 产品族与操作员工作流
        blocks:
          - type: paragraph
            body: >-
              Epirus 交付的是分层反电子产品族，而不是单一点式方案。从客户工作流看，买方购买的是近距防御能力：感知或接收空情输入，把目标交给指挥控制，定位效应器，发出高功率微波脉冲，然后重新评估残存威胁。核心
              Leonidas 产品族被呈现为软件定义、固态、长脉冲 HPM，面向反 UAS、无人机蜂群和更广泛反电子任务。围绕这一核心，Epirus 增加了不同作战封装：用于车辆或拖挂集成的 Mobile，用于便携部署的
              Pod，用于海军陆战队或海军远征用途的 Expeditionary 和 ExDECS，用于海上拦截的 H₂O，以及用于机动力量和关键场址机动或自主保护的 AGV 或 Stryker 集成。Air Domain
              Awareness 位于上游，是感知和决策支持层，利用大数据和机器学习在交战前识别威胁。结果是一套工作流叙事：Epirus
              试图掌握效应器层，也掌握足够的感知、集成和机动挂钩，从而接入分层防御架构，而不是只卖一台独立微波发射器。
