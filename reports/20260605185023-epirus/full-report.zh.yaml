              Epirus 概况中最有力的不是抽象定位，而是有日期的里程碑密度，它们把融资和已交付硬件连起来。2021 年启用更大的 Torrance 总部后，公司继续迭代 Leonidas
              产品族，包括便携式和海事变体，同时从演示走进陆军项目。2023 年 1 月 IFPC-HPM 授标、2023 年 11 月首次向陆军交付，以及 2024 年 5 月完成四套系统交付、训练和测试，说明
