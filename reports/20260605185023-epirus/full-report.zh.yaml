      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求逻辑很直接。战区、边境和关键基础设施周边的无人机事件正在增加；分层保障架构正在取代单传感器点式方案；廉价无人机和昂贵拦截器之间的成本失衡，在政治和作战上都不可持续。HPM
              特别受益于两类威胁变化。第一，蜂群攻击奖励广域压制，而不是一次打一个目标。第二，光纤控制无人机削弱了单靠通信干扰的概念价值，为物理电子压制腾出空间。这些因素解释了为什么经过数十年缓慢列装后，反无人机开始成为定向能一个可信的“杀手级应用”。但约束和驱动一样重要。原型成功不保证生产记录，CRS
              提到当时原型批次之外没有规划更多 IFPC-HPM 采购，就是例子。美国国内部署受权限和政策约束，不是自由商业市场。出口销售也可能推进缓慢，因为 Wassenaar、EAR 许可和潜在 ITAR
              处理都会在硬件出海前增加合规工作。最后，市场本身分析噪声很大：许多分析师把传感器、服务、激光、AI 和 HPM
              打包进一个定向能或反无人机伞下，预测很容易被抬高。因此，预算获取和列装进展的证据，比通用预测曲线更有价值。
