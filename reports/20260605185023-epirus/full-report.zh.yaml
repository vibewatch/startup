      - number: '3.4'
        title: 护城河真实存在，但挡不住分层架构压力
        blocks:
          - type: paragraph
            body: >-
              Epirus
              最强的公开护城河逻辑是技术，而不是渠道：软件定义波形、模块化放大器架构、人类安全运行、反蜂群演示和不断扩展的产品族。这些优势有意义。但反向证据同样重要。独立报道仍把定向能描述为尚未大规模列装的类别，这意味着没有人能凭公共证据宣称市场领先已经完全坐实。独立格局研究还认为，赢家更可能是拥有指挥控制或能干净接入指挥控制的供应商，而不是只营销单一效应形态的公司。对
              Epirus 来说，这是双刃剑：开放集成让 Leonidas 更容易被采用，也更容易被塞进混合堆栈，由另一个供应商掌控操作员控制台和客户关系。主承包商打包是第二个主要压力点。Lockheed、RTX
              和更广泛的既有防空供应商可以把反 UAS 能力附着到更大的采购预算包和保障结构上。含义是，Epirus
              有一个可信但并非不可攻破的护城河；耐久性取决于它能否比主承包商和控制层供应商商品化效应器席位更快地证明作战就绪。
