      - number: '7.4'
        title: 合作伙伴、客户集中度与资本风险
        blocks:
          - type: paragraph
            body: >-
              公开可见的需求证据仍然集中。可见买方和验证者主要是 U.S. Army、Navy 和 Marine Corps 生态，以及新加坡
              DSTA。客户可信度很强，这是加分项；但公开叙事仍锚在防务采购周期，而非已经验证的商业多元化。DSTA 公告是一份围绕测试与评估的谅解备忘录，不是已入账的生产收入；政府市场页面也说明，Epirus
              的需求逻辑与分层防御预算和蜂群威胁优先级绑在一起。合作伙伴集中度进一步放大这个问题。集成部署路径要经过 Anduril、General Dynamics Land Systems
              和其他生态伙伴；它们能加速采用，也会制造路线图依赖。资本风险比简单的现金跑道更微妙。Series D 轮规模大且超额认购，但独立报道称确切估值未披露，且可能低于更早 Series C
              轮的估值标记。信号因此混杂：Epirus
              看起来有足够资金支撑下一阶段运营，但外部投资人仍缺少清晰证据，无法判断规模化投入是在高效复利价值，还是只是在为一条更长、更吃资本的生产成熟路径买单。竞争捕获环境也不是空白市场：Leidos 2026 年 6
              月的市值背景显示，Epirus 正在一个已由体量大得多的上市防务老牌企业塑形的生态里扩张。
