  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最新一轮估值锚点，以及降估值融资真正说明什么
        blocks:
          - type: paragraph
            body: >
              公开可用的核心估值事实很窄，但足够可操作。Epirus 2025 年 3 月完成超额认购的 $250 million Series D 轮，由 8VC 和 Washington Harbour Partners
              共同领投，General Dynamics Land Systems 参投。TechCrunch 报道称，Epirus 确认该轮估值仍高于 $1 billion；但 2025 年 1 月引用 Bloomberg
              的报道称，该融资可能定价在约 $1 billion，低于公司 2022 年明确披露的 $1.35 billion Series C 轮估值。这个组合很重要。它说明投资人仍认为 Epirus
              具备战略相关性，值得按规模融资；但在收入转化、积压订单质量或单位经济没有更清晰证明前，他们不愿简单沿用峰值周期的防务科技倍数。实际看，这轮更像估值重置，而不是危机：信心足以支撑制造扩张，透明度不足以支撑溢价估值。对投资人而言，问题不再是
              Epirus 能否融资，而是下一步采购和披露能否证明，支付显著高于当前隐含区间的价格是合理的。
