            body: >-
              公开资本形成是 Epirus 最清晰的财务强项。公司官方称已融资超过 $550 million，独立报道则把已披露融资放在约 $595 million。主要公司材料中上一轮干净定价融资，是 2022 年
              Series C，估值 $1.35 billion。2025 年 3 月 Series D 带来 $250 million
              新资本，并明确用于产能扩张、人才获取、供应链韧性、制造扩张，以及推进国际和商业市场。这对一家私营防务硬件公司是有意义的缓冲。警示同样重要：TechCrunch 称公司确认估值高于 $1 billion，但
              Bloomberg 曾报道本轮低于 Series C
              估值。因此，资本仍然可得，但定价可能不如上一周期有吸引力。更重要的是，已审阅公共来源没有披露账上现金、月度烧钱、现金跑道或任何债务条款。结论是一分为二：资本获取显然一直很强，但由于产能爬坡和库存需求消耗现金的速度可能快于融资标题暗示，现金跑道仍无法承保。
