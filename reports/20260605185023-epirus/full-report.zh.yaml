        - 帮助检验 Leonidas 是否真正位置最佳，还是只是入场早
        - 客户访谈和红队产品尽调
      - - 国际和基础设施管线
        - 已签 LOI、FMS 或出口路径，以及商业关键基础设施触达状态
        - 牛市上行取决于一条美国需求主线之外的广度
        - 出口律师加管线审查
    notes: |
