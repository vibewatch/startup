    layout: standard
    summary: Epirus 依赖由政府买方、出口 / 合规把关方和集成合作伙伴叠成的网络，而不是广泛独立的商业客户基础。
    claimRefs:
      - CR012
      - CR017
      - CR031
      - CR033
      - CR034
      - CR035
      - CR036
      - CR039
    data:
      nodes:
        - id: d1
          label: 美国陆军 / IFPC
          detail: 最大的可见交付和后续路径。
          tone: warning
        - id: d2
          label: ONR / USMC / JCO
          detail: 变体测试和远征实验。
          tone: neutral
        - id: d3
          label: DSTA / 未来出口
          detail: 国际证明取决于测试和出口准备度。
          tone: warning
        - id: d4
          label: BIS / ITAR 流程
          detail: 出口分类和许可卡住国际商业化。
          tone: warning
        - id: d5
          label: Anduril / GDLS 生态
          detail: 集成平台路径扩大触达，但也增加依赖。
          tone: neutral
        - id: d6
          label: 使命一致的投资者
          detail: 资本支持规模化，也抬高平台预期。
          tone: neutral
        - id: d7
          label: 商业客户
          detail: 公开证据不足的需求细分。
          tone: negative
      edges:
        - from: d1
          to: d6
        - from: d2
          to: d5
        - from: d3
          to: d4
        - from: d4
          to: d6
        - from: d5
          to: d1
        - from: d5
          to: d2
        - from: d6
          to: d7
        - from: d1
          to: d7
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: |
      真实需求和真实产品证明都存在，但财务不透明、降价融资背景和竞争压力，使建议停在观察，而不是买入。
    data:
      nodes:
        - id: n1
          label: 威胁顺风
          detail: DoD、DHS 和盟友买方的反蜂群需求正在上升。
          type: input
        - id: n2
          label: 产品证明
          detail: Leonidas 有实质性的陆军后续机会，也有可见的蜂群效应证据。
          type: input
        - id: n3
          label: 资本可得性
          detail: $250M Series D 证明公司在 2025 年仍能融资。
          type: input
        - id: n4
          label: 估值重置
          detail: 最新一轮很可能低于 2022 年 Series C 估值标记。
          type: intermediate
        - id: n5
          label: 经济性不透明
          detail: 收入、毛利率、积压订单、烧钱速度和确切条款仍未公开。
          type: intermediate
        - id: n6
          label: 竞争风险
          detail: Raytheon 和其他主承包商可以争夺 HPM 位置。
          type: intermediate
        - id: n7
          label: 估值立场
          detail: 只有在宽区间内才算合理，而且高度依赖转化证明。
          type: intermediate
        - id: n8
          label: 观察
          detail: 继续尽调；不要把现有证据视为足以支持高溢价入场。
          type: output
      edges:
        - from: n1
          to: n7
        - from: n2
          to: n7
        - from: n3
          to: n7
        - from: n4
          to: n7
        - from: n5
          to: n7
        - from: n6
          to: n7
        - from: n7
          to: n8
    claimRefs:
      - CV003
      - CV004
      - CV057
      - CV060
      - CV065
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: |
      Epirus 的合理估值区间，用当前可比公司和情景锚点比用单一财务倍数更能框清楚。
    data:
      items:
        - label: Epirus 悲观中点
          value: 400
          detail: 采用缓慢，主承包商压缩空间。
        - label: Epirus 当前下限
          value: 1000
          detail: 管理层确认 Series D 仍高于 $1B。
        - label: Epirus Series C
          value: 1350
          detail: 上一个明确干净的估值标记。
        - label: Epirus 基准中点
          value: 1750
          detail: 成为细分但稳固的 DoD 供应商。
        - label: Epirus 乐观中点
          value: 4000
          detail: NATO 加保障维护 / 平台扩展情景。
        - label: Saronic
          value: 4000
          detail: 2025 年 Series C 参考。
        - label: Shield AI
          value: 5300
          detail: 2025 年 F-1 战略轮参考。
        - label: Joby 参考
          value: 5630
          detail: 2025 年公开市场价值锚点。
        - label: Anduril
          value: 30500
          detail: 2025 年规模领先者。
    claimRefs:
      - CV051
      - CV052
      - CV053
      - CV056
      - CV062
      - CV063
      - CV064
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: |
      公开证据下的判断，最好用宽情景区间表达：下行很重，但采购转化确实能打开估值重估路径。
    data:
      items:
        - label: 悲观情景
          low: 250
          mid: 400
          high: 500
          unit: USD millions
          description: 主承包商替代、采用缓慢，或预算 / 时间线承压。
        - label: 基准情景
          low: 1500
          mid: 1750
          high: 2000
          unit: USD millions
          description: 细分但稳固的供应商，获得适度国际后续订单。
        - label: 乐观情景
          low: 3000
          mid: 4000
          high: 5000
          unit: USD millions
          description: Leonidas 成为标准分层资产，并附带软件 / 保障维护收入。
        - label: 当前公开锚点
          low: 1000
          mid: 1175
          high: 1350
          unit: USD millions
          description: 调和 >$1B Series D 披露和 2022 年 $1.35B Series C 标记。
    claimRefs:
      - CV003
      - CV062
      - CV063
      - CV064
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: |
      Epirus 在市场需求和产品证明上得分高，在经济性可见度上得分低，估值纪律居中。
    data:
      items:
        - label: 市场机会
          value: 8
          detail: 国防和基础设施都有强反无人机顺风。
        - label: 产品 / 证明
          value: 7
          detail: 可见的陆军和蜂群效应证据支撑技术相关性。
        - label: 客户广度
          value: 5
          detail: 有一些海军和盟友信号，但公开证明仍然集中。
        - label: 经济性可见度
          value: 3
          detail: 收入、积压订单、毛利率和烧钱速度仍未公开。
        - label: 竞争位置
          value: 5
          detail: 有差异化，但挡不住主承包商支持的替代方案。
        - label: 估值纪律
          value: 5
          detail: 只有采购转化加速，估值才算合理。
        - label: 证据质量
          value: 5
          detail: 合同和融资标题证据不错，但可支撑投资判断的财务数据很薄。
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV057
      - CV060
      - CV065
