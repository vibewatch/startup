      - number: '6.4'
        title: 留存、重复使用与商业扩张缺口
        blocks:
          - type: paragraph
            body: >
              Epirus 的重复使用故事更多是推断，而不是指标丰富。陆军后续行为是唯一公开模式，像是先落地后扩张：初始授标、系统交付、训练和测试、修改资金以及 Gen II 延续。这很有价值，但不等同于
              NRR、GRR、续约率或多年队列留存。已审阅公共来源没有披露流失、续约百分比、平均合同期、满意度或逐客户扩张。商业侧更薄。Epirus
              营销广泛安全、通信和能源机会，并称商业公司已经选择它执行关键任务，但没有公开点名这些商业客户或披露生产结果。Series D、Palantir Warp Speed
              公告和安全市场信息都指向未来防务加商业扩张，但当前状态证据几乎完全来自政府和政府邻近领域。尽调的关键结论是：一个可见政府项目中存在重复需求，而更广泛耐久性和多元化仍基本未验证。
