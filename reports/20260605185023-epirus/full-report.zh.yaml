      - number: '8.4'
        title: 乐观、基准和悲观情景应拉开，因为上行空间有战略性，但数据很薄
        blocks:
          - type: paragraph
            body: >
              乐观情景很好描述，即使尚未被证明。如果 Leonidas 成为美国基地和部分 NATO 盟国的标准反蜂群层，如果国际演示转化为采购，如果 Epirus
              不只拿硬件收入，还能拿到电磁效应管理周边的软件、数据、训练和保障层，那么 $3-5 billion 的结果是可能的。基准情景更窄，也更可能：Epirus 成为一个小众但持久的美国国防部
              供应商，赢下一些国际后续业务，并给出足够制造证明，在不成为下一个 Anduril 的情况下守住 $1.5-2.0 billion 估值。悲观情景比许多防务科技多头愿意承认的更严厉。如果 Raytheon
              和其他大型主承包商挤压独立机会，如果定向能采用速度低于预期，或预算周期和采购时间线拉长收入曲线，股权价值可能跌破 $0.5
              billion。因此，当前投资问题与其说是选择一个英雄叙事，不如说是决定愿意为多少不确定性付费。
