      - number: '4.5'
        title: 承保阻断点与财务结论
        blocks:
          - type: paragraph
            body: >-
              核心承保阻断点不是缺少战略相关性，而是缺少经审计经营披露。公共来源支持这样的判断：Epirus
              拥有可信产品需求、有意义的陆军牵引，以及足够外部资本继续扩张。它们不支持对收入质量、客户集中度、毛利率耐久性或现金效率形成高置信判断。National Defense 指出定向能系统尚未大规模列装，这很关键，因为
              Epirus 最大的公开胜利仍是原型和开发项目，而不是规模化经常性采购证明。Wassenaar Arrangement
              等出口治理机制给国际扩张叙事又增加一个执行变量。因此，平衡结论是战略定位正面，但承保谨慎。如果正式列装项目转化和制造执行继续推进，Epirus
              很可能是一门可融资业务；但尽调下一步明确是私营公司尽调：积压订单和期权转化、按项目拆分收入、物料清单和服务毛利、应收账款账龄、出口审批状态，以及真实现金跑道桥。没有这些条目，任何估值观点都仍然偏叙事。
