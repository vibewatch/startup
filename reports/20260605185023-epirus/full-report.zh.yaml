      - number: '2.2'
        title: 买方、用户、付款方与预算归属
        blocks:
          - type: paragraph
            body: >-
              当前最清晰买方仍是军事和国土安全机构，而不是开放商业账户。防务侧，陆军固定场地防御和海军陆战队远征防御是可见度最高的两个典型场景。CRS 将 IFPC-HPM 描述为固定和半固定场地保护，ExDECS
              项目则显示海军陆战队的平行远征路径。两种情况下，用户都是作战防空或基地防御单位，但买方和付款方在项目办公室、实验赞助方和军种预算所有者手里。国土需求走另一套路径。DHS 在 2026 年设立 UAS 和
              C-UAS 专门 Program Executive Office，并把它与 $115 million 近期投资、$1.5 billion 合同工具，以及 FIFA 相关能力的 $250 million
              赠款相连。这意味着采购环境要经过获批权限、联邦资金工具和集成商，而不是简单点式销售。关键基础设施需求真实存在——Epirus
              自己提到机场、公用事业、港口、体育场和政府场所——但这些买方往往需要公共安全伙伴、法律授权路径或主承包商。集成伙伴同样重要，因为买方可能把 Leonidas 作为
              Stryker、拖车或自主平台的一部分采购，而不是单独采购 HPM 发射器。简言之，买方地图不只是防务对商业；它由防务项目办公室、国土安全合同渠道和平台集成商组成，并由这些角色决定终端用户能否看到系统。
