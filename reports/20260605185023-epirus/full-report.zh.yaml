  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Epirus 在财务上更像风投支持的防务硬件和系统公司，而不是自助式 SaaS 供应商。公开界面把 Leonidas 和相关 HPM
              变体作为面向政府、盟友和伙伴用户的任务系统来营销，没有公开价目表，也看不到在线结账迹象。相反，公开货币化证据来自项目授标、交付和围绕成本修正的价值主张：Epirus 认为动能反 UAS
              工具每次交战可能花费数十万甚至数百万美元，而 Leonidas 击败无人机只需几美分，甚至低于一美分。这个说法可作为买方 ROI 代理，但不是已实现定价。唯一硬性的公开定价锚，是已披露授标，例如 $66.1
              million 陆军原型合同、$43.551 million Gen II 后续授标和 $5.5 million ONR
              远征合同。这些锚点支持这样一幅图景：收入由谈判式硬件、测试、支持和升级包驱动，而不是由公开订阅计划驱动。公开材料也暗示，开放架构、FAAD C2
              集成和波形更新最终可能带来软件与支持附加收入，但已实现组合仍未披露。
