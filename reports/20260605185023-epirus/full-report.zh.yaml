      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Epirus 处在风险资本、防务采购和技术执行的交叉点，创始人与治理图谱格外重要。Joe Lonsdale 是联合创始人，并借 8VC 与公司保持紧密关系；Grant Verstandig
              在早期融资轮中由公司标识为联合创始人兼执行董事长。治理层也明显带有 8VC 色彩，Alex Moore 担任董事长。但运营领导层已经多次更替：Leigh Madden 主导 Series B 和 Series C
              阶段，Ken Bedingfield 在当前阶段前担任 CEO，Andy Lowery 则在首套陆军 IFPC-HPM 交付后于 2023 年 12 月接任。Lowery 背景横跨防务和企业硬件，Reed
              Werner 2025 年出任 CFO，则补上更正式的资本市场和防务财务经验。结果是一套既延续创始人—投资人主线，又明显依赖 Lowery 的领导层：产品扩规模、陆军项目执行和公开战略叙事都压在他身上。
