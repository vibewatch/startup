      - number: '5.4'
        title: 差异化、信任与合规
        blocks:
          - type: paragraph
            body: >-
              差异化和信任建立在来源中反复出现的四个想法上。第一，Leonidas 被定位为成本失衡问题的非动能答案：不消耗稀缺拦截器，用广域电磁效果解决问题。第二，Epirus 强调同一核心 HPM
              堆栈可以重新封装为便携、海事、远征和自主变体；如果底层架构脆弱或高度依赖人力，这会很难做到。第三，公司把产品主张与安全和网络信任信号配对：公开信息强调低电压运行、零电离辐射、软件控制安全区、政府安全测试，以及
              2026 年获得 CMMC Level 2 认证，可处理受控非密信息。第四，独立评论仍给护城河叙事降温。National Defense Magazine 和 Robotics Press
              都把定向能描述为列装早期；Robotics Press 认为 Epirus 的多系统交付证明很少见，但还不等于一个耐久的正式列装项目特许权。换句话说，Leonidas
              看起来差异化且可信度上升，但公共证据证明的是高势头产品，不是完全去风险的类别赢家。
