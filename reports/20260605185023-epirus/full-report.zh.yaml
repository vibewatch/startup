      - number: '3.3'
        title: 定价、封装、伙伴触达与切换成本
        blocks:
          - type: paragraph
            body: >-
              整个同业组的定价透明度都很弱。已审阅官方页面营销结果、能力和演示，但不给可靠标价。因此，公开对比主要看封装逻辑，而不是真正经济性基准。Epirus
              强调每次击杀只需几美分和无限弹舱逻辑，但不披露已部署系统合同价格。BlueHalo、Leonardo DRS、Fortem、DroneShield 和 Dedrone
              看起来也都靠报价或项目牵引销售，而不是公开目录。因此，分销与产品同等重要。Epirus 借 GDLS 和 Anduril 集成获得可信伙伴触达，开放 API
              也降低集成摩擦。但同样事实也意味着，它的专有锁定弱于封闭端到端堆栈。一旦系统嵌入车辆、指挥层和具体条令，切换成本会上升；在那之前，多归属仍然可行，因为分层架构允许买方混合传感器、C2 和效应器。对 Epirus
              来说，商业问题不只是 Leonidas 表现如何，还在于公司能否在主承包商打包和控制层所有者定义参考架构之前，拿到足够分销杠杆。
