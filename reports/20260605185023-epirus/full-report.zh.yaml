              Epirus 的公开融资记录很强，但当前经营经济性仍不透明。公司 2020 年 Series B 融资 $70 million，2022 年 Series C 融资 $200 million，2025 年 3
              月完成超额认购的 $250 million Series D；公开来源显示已披露风险融资总额超过 $550 million。主要材料里最清晰的定价估值是 Series C 的 $1.35
              billion。Series D 方面，公司强调资本规模和投资人质量，但没有公布准确投后估值。这个缺口很关键：TechCrunch 报道称公司确认估值高于 $1 billion，同时又引用 Bloomberg
              报道称本轮融资价格低于 Series C。换句话说，Epirus
              仍然资本充足，但公开材料没有解决最新融资究竟是持平、小幅下调，还是带结构性安排。已审阅来源没有披露债务、风险债务或二级流动性条款，所以资本结构尽调不能停在融资总额标题上。
