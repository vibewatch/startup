  - id: FE001
    title: Leonidas 产品架构图
    type: stack
    layout: standard
    summary: 最好把 Leonidas 理解成一套技术栈：它把感知和 C2 输入接到软件控制的高功率密度 HPM 硬件，再接到按部署场景定制的外层封装。
    data:
      layers:
        - label: 感知与决策层
          detail: Air Domain Awareness 或外部传感器对威胁分类，并提供空域态势，支撑响应选择。
        - label: C2 与互操作层
          detail: 开放架构集成通过 FAAD C2 等系统传递目标和开火逻辑。
        - label: 软件化毁伤规划层
          detail: 波形、脉冲和极化控制通过软件调整，无需更换硬件即可调校效果。
        - label: 电源与放大器层
          detail: GaN 器件、智能电源管理、LRAM 模块化，以及后续高密度电池支撑 HPM 输出。
        - label: 效应器与封装层
          detail: 通用 Leonidas 核心被封装成固定、机动、吊舱、远征、海上和自主版本。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE013
      - CE022
