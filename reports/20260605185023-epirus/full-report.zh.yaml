  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与买方地图
        blocks:
          - type: paragraph
            body: >
              Epirus 的公开客户图景在漏斗顶部很宽，但具名证明很窄。公司明确把交易对手分成政府、产业、研究与学术、商业组织；政府页面把当前任务聚焦于 DoD
              和盟军在陆、空、海防御中的需求。这个框架与最强的具名客户证据一致：美国陆军 IFPC-HPM、海军和海军陆战队远征工作，以及 Singapore
              DSTA。安全、通信和能源页面把地图扩展到关键基础设施运营方、无线电和相控阵买方，以及数字能源运营方，但这些页面仍是分部营销，不是具名客户披露。公开来看，买方、用户和付款方也不是同一角色。陆军
              RCCTO、ONR、DARPA
              和空军像是付款组织；士兵、水手、海军陆战队员和港口安全操作员是隐含用户；商业基础设施运营方更多是面向未来的受益者，而非具名当前账户。因此，本章应被读作买方地图和证明质量练习，而不是简单的客户标识数量统计。
