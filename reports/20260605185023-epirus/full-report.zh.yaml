  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、主承包商、邻近玩家与现状替代
        blocks:
          - type: paragraph
            body: >-
              Epirus 面对的不是一个整齐的同业集合。最窄的直接对比对象，是其他公开可见的高功率微波项目，主要是 RTX 的 Phaser 和 Lockheed Martin 的 MORFIUS。但这个直接 HPM
              框架太窄，无法还原真实采购流程。买方通常采购的是结果：以可接受的成本、附带损伤轮廓和部署适配度来发现、分类、跟踪、指挥并击败无人机。在这个更宽的待完成任务上，BlueHalo 的激光 LOCUST
              X3、Leonardo DRS 的雷达到打击一体化堆栈、Fortem 的雷达加拦截器 SkyDome，以及 DroneShield、Dedrone
              等软件控制供应商都会成为相关替代。主承包商和既有防空供应商即便不提供同一种波形，也很重要，因为它们可以把反 UAS 能力打包进更大的机动、雷达和保障项目。现状选项仍包括动能拦截器、火炮、传统电子战，以及围绕既有
              C2 的内部多层集成。结果是，Epirus 最适合被理解为更大分层防御市场中的差异化效应器专家，而不是一家只和其他微波供应商竞争的公司。
