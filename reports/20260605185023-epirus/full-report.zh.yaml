  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险栈与投资含义
        blocks:
          - type: paragraph
            body: >-
              Epirus 进入风险章节时，确实拥有项目证明，但缺少足以让防务硬件扩张故事变成低风险的运营透明度。公司已经交付陆军 IFPC-HPM 系统，赢得 Generation II 后续合同，并在 2025 年完成大额
              Series D，所以问题不是 Leonidas 是否存在。问题是，在采购周期、出口审批或资本市场情绪收紧之前，Epirus
              能否把这些胜利转化为可重复、合法、可出口且毛利有韧性的规模。同一批支持上行的文件也揭示压力点：公司称新资本用于供应链韧性、制造足迹和内部系统；独立报道称最新融资没有披露确切估值；公共客户证明仍由防务买方主导。这种组合让剩余风险偏高，而非存在性风险。核心逻辑只有在管理层证明项目里程碑可以转化为更广泛、耐久的生产吞吐，而不只是阶段性演示胜利时，才仍具备可投资性。
