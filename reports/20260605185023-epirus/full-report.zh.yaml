        title: 采用轨迹与具名部署证明
        blocks:
          - type: paragraph
            body: >
              最清晰采用叙事是陆军多步骤 IFPC-HPM 路径。公共来源显示：最初 $66.1 million 陆军授标，2023 年末首次交付，2024 年 3
              月前交付四套系统，完成训练和工程发展测试，为更好的传感器套件和士兵可用性追加近 $17 million 修改资金，随后在 2025 年 7 月获得 $43.551 million Generation II
              后续合同。这一序列明显强于静态客户标识，因为它展示了重复资金和买方与产品团队之间的实施闭环。海军和海军陆战队证明更窄，但仍有意义：ONR 资助 Leonidas Expeditionary，ExDECS 交付给
              Naval Surface Warfare Center Dahlgren 供海军陆战队使用，海军 ANTX-CT24 演习测试了 Epirus
              应对海上攻击艇，并让港口安全利益相关方参与。国际证明存在，但成熟度较低：DSTA 关系是一份探索能力的 MOU，不是已披露生产订单。空军、DARPA 和 ONR 关系最好理解为 R&D
