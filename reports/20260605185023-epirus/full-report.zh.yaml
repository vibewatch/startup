      - number: '8.5'
        title: 建议、投资逻辑失效点与下一步尽调
        blocks:
          - type: paragraph
            body: >
              基于公开证据，正确建议是观察；对于有特定国家安全授权的投资人，最多是继续研究。正面因素真实存在：威胁品类快速增长、HPM 产品差异化、资本支持严肃、Army
              后续证明，以及盟国和基础设施防护市场的可信期权。负面因素同样真实：没有披露收入或毛利率框架，最新一轮定价质量未解，公开客户证明集中，主承包商和其他资金充足的防务初创公司带来清晰替代风险。这个平衡既不支持轻率放弃，也不支持高确信买入。投资人应把
              Epirus 视为一家值得持续覆盖、也需要纪律化尽调的公司。上调路径很具体：披露积压订单质量，给出重复采购的更好证据，证明 Leonidas
              能进入标准分层架构，并更清楚呈现单位经济和股权结构条款。在此之前，估值立场只有在宽区间内才算合理；证明责任仍在转化，而不在 TAM 幻灯片。
