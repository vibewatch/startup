      - number: '5.3'
        title: 部署、制造与支持模式
        blocks:
          - type: paragraph
            body: >-
              Epirus 的公开部署证明比许多定向能同业更多，但运营模式仍明显在从原型走向规模的过程中。陆军 2023 年 IFPC-HPM 授标要求交付数套 Leonidas 原型，2023 年 11 月交付验证了安全性和
              FAAD C2 互操作性；到 2024 年 5 月，Epirus 已交付四套系统，并与士兵完成 NET 和 EDT。路线图的远征分支随后从 Leonidas Expeditionary 推进到 ExDECS
              交付，并增加了面向海军和海军陆战队的 PEGASUS 评估。与此同时，公司借公开融资和足迹扩张证明自己能够支撑规模化交付。独立融资报道称，Series D
              将用于扩大生产、人才、内部系统和供应链韧性；Oklahoma 办公室和沉浸式创新中心则显示，公司已经在演示、操作员赋能，以及靠近 FISTA 和 Joint C-sUAS University
              方面投入。招聘页面和开放职位作为技术文档很薄，但对一家硬件主导、没有可见公共代码生态的防务公司来说，它们已经是最接近公共开发者信号的代理。
