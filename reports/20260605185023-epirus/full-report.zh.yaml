      - number: '7.2'
        title: 出口管制、监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              对 Epirus 而言，监管风险不是边缘项，而是核心变量：公司一边销售面向防务的高功率微波平台，一边谈国际扩张。BIS 要求出口商判断物项是否受 EAR
              管辖、必要时申请许可证，并评估许可证例外；Wassenaar Arrangement 将两用和军品转让放在安全敏感框架下；Cornell 的法律文本转载则把 22 CFR Subchapter M 识别为
              International Traffic in Arms Regulations。国际增长因此不只是销售问题，而是出口管辖和合规问题。法律栈也不止出口管制。Epirus 2026 年取得的 CMMC Level
              2 认证缓释了防务业务中的 CUI 处理风险；DOJ、DoD 和 DHS 材料显示，counter-UAS 场景处在一个权限和采购规则持续演化的环境里。知识产权侧，Epirus
              公开标注了专利组合，并明确援引专利标记法规；但公开来源看不到自由实施分析、许可纠纷或诉讼记录。今天最大的反向信号不是已经可见的法律失败，而是公司尚未公开出口分类、实际许可证历史，或足以让投资人有信心承销国际执行的尽调材料。
