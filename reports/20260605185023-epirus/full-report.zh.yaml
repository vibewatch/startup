      - number: '7.3'
        title: 运营质量、生产与供应链风险
        blocks:
          - type: paragraph
            body: >-
              运营风险最好理解为已验证能力与规模化可重复性之间的缺口。Epirus 已经不再只是原型阶段：Army 授予第一份重要 Leonidas 合同，公司交付了四套 IFPC-HPM
              系统并完成相关测试，Generation II 旨在显著拉高性能。这些都是强信号。但它们不等于成熟制造，也不等于已经验证的批量保障能力。公司明确表示，新资本将用于供应链韧性、系统升级和美国制造扩张，说明到
              2025 年，规模化瓶颈仍然重要。技术栈看起来也并不简单。Epirus 强调先进电源管理、AI/ML
              和软件定义性能，这些可以构成优势，也会加重人才依赖和质控复杂度。最强的反证是，公开来源仍未披露正常运行时间、缺陷率、可维护性或生命周期成本指标。独立行业报道还指出，定向能长期被寄予期待，但大规模部署仍很稀少。这并不否定
              Leonidas；只是说明公司仍在跨越一座难桥：从有说服力的演示，走向可靠、可支持的生产运营。
