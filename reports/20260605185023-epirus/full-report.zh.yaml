      - number: '4.2'
        title: 销售路径与合同工具
        blocks:
          - type: paragraph
            body: >-
              商业化路径最适合理解为长周期防务采购流程，上面叠加伙伴渠道。公共证据显示，公司借 OTA 式原型和开发授标直接卖进 DoD 项目办公室，然后逐步交付、测试、训练并形成士兵反馈闭环，最终可能成熟为后续采购。2023
              年陆军合同、2023 年末首个原型交付、2024 年四套系统交付和测试完成、2025 年 Gen II 合同，都符合这一模式。Series B 还给出更早信号：Epirus
              也借助主承包商和战略伙伴推进，当时披露与 Northrop Grumman 的供应商协议以及 L3Harris
              的投资。近期，公司和外部报道描述了国际与商业市场扩张，但这些更像未来增长向量，而不是目前已披露的多元收入基础。公开合同表面也不止一条陆军线：Epirus 披露过 ONR 远征工作和 DARPA MAX
              项目工作，但两者看起来仍像原型或 R&D 渠道，而不是规模化经常性采购证明。实际含义是，Epirus 的销售效率应看项目成熟度、期权行使和伙伴触达，而不是用公共数据无法支撑的 SaaS 式 CAC
              或回本公式判断。
