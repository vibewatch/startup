      - number: '6.5'
        title: 扩张、集中度与采购摩擦
        blocks:
          - type: paragraph
            body: >
              主要客户风险是集中在美国防务体系内，尤其是陆军。公开具名证明由陆军项目主导，海军和海军陆战队是较小的邻近参考，DSTA 是探索性国际证明点，空军或 DARPA
              多数以赞助方形式出现。如果公共证据也显示公司顺利转入稳定采购，这种集中度可以接受，但事实并非如此。CRS 称下一批 IFPC-HPM 原型之外没有规划进一步采购，National Defense
              则称定向能系统尚未大规模列装。美国国内商业扩张也面临授权和政策摩擦：DOJ、DHS 和 DoD 都把反 UAS 活动放在指定授权、合同工具或指挥指导之下，而不是简单私人采购市场。国际增长还必须穿过出口许可和
              Wassenaar 式管制。伙伴明显帮助 Epirus
              扩大触达，但也制造渠道依赖，并可能模糊对终端客户关系的直接所有权。因此，公开承保观点是：相关性积极，耐久性谨慎，并且在集中度、留存和从原型转入规模采购方面明确不完整。
