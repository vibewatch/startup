      - number: '8.2'
        title: 市场顺风和收入驱动真实存在，但大多还未规模化
        blocks:
          - type: paragraph
            body: >
              需求背景有利。MarketsandMarkets 预计，全球 counter-UAS 市场将从 2025 年的 $6.64 billion 增长到 2030 年的 $20.31
              billion；北美将受益于防务、国土安全、机场、边境和关键基础设施需求。同一研究和相邻市场评论也指向比 Pentagon 更广的买方组合：机场、公用事业、油气场站和活动场馆正越来越多进入商业防护叙事；NATO
              和盟国政府也在搭建可互操作的反无人机架构，最终可能利好 Leonidas 这类系统。Epirus 在这个宏观主题下也有看得见的公共收入驱动：U.S. Army 的 OTA 式合同和后续合同、Navy 和
              Marine 远征工作，以及 DSTA
              关系这类早期国际演示。但需求和变现仍必须分开看。公开来源显示的是合同动能，不是已披露的经常性收入。它们还显示，定向能系统仍未大规模列装；因此估值可以奖励期权价值和品类拉力，但不能假设每个市场顺风都会转成近期订单。
            claimRefs:
              - CV004
              - CV005
              - CV013
              - CV014
              - CV057
              - CV058
