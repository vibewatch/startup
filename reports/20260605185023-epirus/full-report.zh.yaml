      - number: '4.3'
        title: 单位经济性、成本结构，以及公共可比公司能说明什么
        blocks:
          - type: paragraph
            body: >-
              Epirus 最强的公开单位经济性论点，是任务层面的成本逻辑：HPM 可以在不消耗拦截器的情况下对付蜂群，公司称 Leonidas 拥有无限弹舱深度和软件定义升级能力。但同一份公开记录也清楚说明，Epirus
              仍是一门资本和运营密集型生意。公司建设了超过 100,000-plus-square-foot 的生产足迹，快速扩大员工规模，如今在新任 CFO 到位后谈论超大规模提升产能。Gen II
              系统加入高密度电池、更大功率、更长脉宽和更复杂的支持设备，这些可能提升任务效用，同时增加制造复杂度。由于 Epirus 不披露确认收入、毛利率、单机
              BOM、保修准备或现场服务成本，最好的公开边界练习来自上市可比公司的文件。AeroVironment 2025 年文件暗示毛利率约 38.8%，Kratos 约 22.9%，Palantir 约
              82.4%，大致夹出从防务硬件到软件的跨度。这个区间在分析上有用，但没有解决核心问题：Epirus 尚未发布足够数据，无法把自己放进这个光谱。
