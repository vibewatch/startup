      - number: '8.3'
        title: Epirus 位于 2025 年防务科技估值栈中段，而不是顶部
        blocks:
          - type: paragraph
            body: >
              最好的可比框架不只是传统上市防务硬件，而是更广的 2025 年两用和防务科技风险投资市场。Anduril 2025 年 6 月一轮估值 $30.5 billion，Shield AI 一轮 $5.3
              billion，Saronic 一轮 $4 billion，说明只要公司能同时讲清软件杠杆、自治能力、制造野心和品类领导力，投资人仍愿意给出激进价格。Joby 提供了有用的公开市场参照：它在 2025 年中市值约
              $5.63 billion，2026 年 Q1 披露现金 $2.5 billion，说明前沿硬件故事即使还没有成熟盈利，只要资本通道和战略叙事仍在，也能维持数十亿美元估值。不过，Epirus
              比这些头部公司更小、约束更多。它只有一个旗舰 HPM 家族，客户证明有意义但仍集中，公开经济性也薄得多。这并不意味着它没有吸引力；只是说，在 Leonidas
              证明自己能从高可见度项目进入标准预算线、保障体系和更广的软件化系统所有权之前，相比 Anduril、Shield、Saronic 和 Joby 的估值折价是合理的。
