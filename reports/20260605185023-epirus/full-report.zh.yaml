  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与约束式测算
        blocks:
          - type: paragraph
            body: >-
              Epirus 所在市场比多数反无人机标题暗示的更窄。广义反 UAS 类别包括发现、识别、跟踪并击败未经授权无人机所需的全栈：雷达、RF
              感知、EO/IR、指挥控制、干扰、动能拦截器和定向能效应器。因此，已发布市场数字又大又不一致。The Business Research Company 将 2025 年反 UAS 规模定为 $3.21
              billion，NaviStrat 基于 2024 年口径给出的数字明显更低；Market Research Future 预计从 2025 年约 $2.0 billion 增至 2035 年超过 $18
              billion；The World Data 则给出更宽的 2026 年区间，约 $3.88 billion 到 $4.93 billion。这些数字不能互换，因为它们混合了年份、垂直领域和技术层。对
              Epirus 而言，相关核心是定向能中的 HPM 打击层，外加空域态势感知和集成上的较小邻近机会。即便在那里，估算也分歧很大：Intel Market Research 估计 2025 年定向能反 UAS 为
              $1.42 billion，而 MarketsandMarkets Blog 发布的区间大得多，为 $6.8 billion 到 $8.1 billion。因此，更可信的机会框架应是约束式测算：广义 c-UAS
              TAM 在低个位数十亿美元；定向能是更小但仍高度波动的一片；可观察的近期 HPM 采购，应首先用已披露授标和列装证据衡量，而不是用标题式 CAGR 表格。
