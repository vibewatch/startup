        title: 什么才算真实客户证明，而不只是原型或渠道动作
        blocks:
          - type: paragraph
            body: >
              Epirus 有足够公共证据宣称真实采用，但还不足以宣称已经在多元客户基础上完成成熟舰队级部署。陆军证明质量最高，因为它结合了授标规模、多次交付、操作员训练、发展测试和后续 Gen II 合同。即便如此，CRS
              和行业报道仍把项目描述为原型阶段，并且长期采购未定。海军和海军陆战队证明真实存在，但仍以原型和演习为主。DSTA 新近且有战略价值，但仍在探索。空军和 DARPA 证明显示政府兴趣反复出现，但主要以
              SBIR、研究或赞助形式存在。与 Northrop、GDLS、Anduril、Peraton 和 Digital Force
              的渠道合作扩大了进入最终项目的通道，但也意味着部分公开“客户”动作其实是集成商动作。这个区分很重要，因为客户标识和伙伴公告不等于耐久生产部署。因此，质量问题不是 Epirus
              是否有客户，而是可见客户集合中有多少已经进入可重复作战使用，有多少仍靠原型、演示和集成商牵引机会来验证。
