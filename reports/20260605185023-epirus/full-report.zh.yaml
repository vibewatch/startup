      - number: '5.2'
        title: HPM 架构与技术运行模式
        blocks:
          - type: paragraph
            body: >-
              最重要的技术主张不只是 Leonidas 会发射微波，而是 Epirus 已把高功率微波做成软件塑形、模块化且相对可部署的架构。电子战页面称，Leonidas 使用 GaN
              半导体、可现场更换的放大器模块和软件定义波形控制，在不更换硬件的情况下提升射程和发射效率。这很关键，因为公司销售的不只是原始效果，也是在销售可升级性和形态复用。开放架构主张和 FAAD C2
              互操作性基于同一原因重要：Leonidas 必须嵌入既有防空工作流，而不是替代它们。相邻 R&D 表面也支撑这个叙事。Advanced Electronics、DARPA MAX、DARPA
              WARDEN/RANGER 和 ONR 资助的 Oklahoma
              工作，都指向一套围绕智能电源管理、波形建模、相控阵输出改进和数字孪生优化搭建的技术堆栈。公共证据没有展示完整物料清单或集成文件，但展示了一个连贯架构逻辑：上层是感知和
              C2，中间是软件武器化，底层是高功率密度模块化 HPM 硬件。
