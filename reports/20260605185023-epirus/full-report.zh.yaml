      - number: '3.2'
        title: 能力对比看分层结果，不看单一形态
        blocks:
          - type: paragraph
            body: >-
              Epirus 的公开卖点很清楚：Leonidas 是软件定义
              HPM，天生反蜂群，形态模块化，并且越来越多为机动和远征用途封装。面对廉价无人机饱和攻击，这给了它真实切入口，尤其是在附带损伤或弹药深度让动能火力不具吸引力的场景。但邻近竞争者从不同技术重心攻击同一任务。BlueHalo
              销售面向 Group 1-3 UAS 的精确激光打击。Fortem 把雷达、AI 和拦截无人机组合成一体化打击闭环。Leonardo DRS
              强调广域感知、车载和独立部署，以及完整探测—跟踪—打击集成。DroneShield 和 Dedrone
              竞争的是感知、信号处理、自主控制和操作员工作流，而不是微波能量。因此，公共证据支持这样一个市场：效应器只是其中一层。Epirus
              在大规模压制、开放集成和微波特定效果重要时最强；当买方更看重广域传感器所有权、已安装控制软件，或既有主承包平台关系，而不是效应器形态本身时，Epirus 会显弱。
