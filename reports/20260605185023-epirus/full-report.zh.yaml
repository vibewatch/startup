      - number: '5.5'
        title: 依赖、路线图与产品风险
        blocks:
          - type: paragraph
            body: >-
              依赖图和架构图一样重要。Leonidas 依赖持续政府赞助、伙伴载具、转让控制许可，以及高功率密度硬件的持续进展。陆军 IFPC-HPM 仍是最可见的锚定客户，ONR、JCO、海军、海军陆战队、General
              Dynamics Land Systems 和 Kodiak 则把产品延伸到远征和自主用例。Gen II
              的公开路线图也显示，性能提升依赖电池、脉冲控制、波形和极化技术，以及持续士兵反馈。最大的产品风险直接来自这些依赖。独立报道仍强调原型成功和正式项目转化之间的缺口。公共来源没有披露 Leonidas
              单位经济性、持续生产节奏、质量认证或长期现场服务指标。出口和盟友扩张也受转让控制机制约束，尽管管理层把国际增长放进路线图。实际尽调观点因此是平衡的：Epirus 拥有真实产品族、可信 HPM
              架构和异常可见的列装里程碑，但规模化制造、保障、可出口性和项目持久性仍是未解决关口。
