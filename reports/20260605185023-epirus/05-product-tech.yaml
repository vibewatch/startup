  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quality-certifications
    missingEvidence: No public AS9100, ISO 9001, or equivalent manufacturing-quality certification disclosure for
      Leonidas production or sustainment operations.
    whyItMatters: Certification evidence is the cleanest outside signal that Epirus has repeatable manufacturing,
      supplier, and corrective-action discipline as production scales.
    diligencePath: Request current quality-manual excerpts, certification certificates, supplier-quality procedures,
      and any customer quality clauses tied to Leonidas deliveries.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: production-cadence
    missingEvidence: Public sources do not disclose Leonidas unit cost, production throughput, yield, spare-module
      assumptions, or installed-base sustainment burden.
    whyItMatters: Without these metrics it is impossible to test whether the manufacturing scale-up narrative is
      operationally credible or economically attractive.
    diligencePath: Ask management for factory capacity, monthly output, bill-of-material cost drivers, spare ratios,
      and warranty-return data by variant.
    relatedQuestionRefs:
    - QE010
    - QE023
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: export-classification
    missingEvidence: No reviewed public source discloses Leonidas-specific USML or ECCN classification, commodity-jurisdiction
      analysis, or allied license path.
    whyItMatters: International and commercial roadmap claims remain hard to underwrite until the actual transfer-control
      pathway is known.
    diligencePath: Obtain counsel-backed export classification memoranda, any BIS or DDTC correspondence, and a
      country-by-country licenseability matrix.
    relatedQuestionRefs:
    - QE020
    - QE026
  - type: private-evidence-only
    severity: material
    topic: support-sla
    missingEvidence: Public material does not quantify uptime, mean time between failure, field-service staffing,
      training burden, or operator-to-system ratios for Leonidas deployments.
    whyItMatters: Support economics and staffing complexity will determine whether Epirus can scale beyond prototype
      or small-batch fielding.
    diligencePath: Request sustainment concepts of support, field-service plans, training syllabi, spare kits, and
      maintenance logs for Army and Navy programs.
    relatedQuestionRefs:
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: operational-outcomes
    missingEvidence: Independent after-action data on kill rates, false positives, collateral electromagnetic effects,
      and long-run availability outside demonstrations is not public.
    whyItMatters: Demo success is important, but scaled deployment decisions depend on repeatability under varied
      climates, targets, and operator skill levels.
    diligencePath: Review official test reports, soldier feedback summaries, environmental stress results, and mission
      logs from Army or Navy evaluation events.
    relatedQuestionRefs:
    - QE011
    - QE024
    - QE025
    relatedTableRefs:
    - TE002
    - TE005
  - type: missing-source
    severity: minor
    topic: integration-docs
    missingEvidence: Epirus publicly claims open architecture and FAAD C2 interoperability, but no API schemas,
      message-interface docs, or integration manuals are public.
    whyItMatters: Integrator effort and interoperability risk remain hard to estimate without interface documentation.
    diligencePath: Ask for ICDs, API references, data models, and the scope of any adapter code required for FAAD
      C2 or partner platforms.
    relatedQuestionRefs:
    - QE007
    - QE009
    - QE027
    relatedTableRefs:
    - TE003
