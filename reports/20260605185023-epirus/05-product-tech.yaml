- id: deployment-manufacturing-support
  title: Deployment, manufacturing, and support model
  body: Epirus has more public deployment proof than many directed-energy peers, but the operating model is still
    visibly prototyping its way toward scale. The Army’s 2023 IFPC-HPM award called for several Leonidas prototypes,
    the November 2023 delivery validated safety and FAAD C2 interoperability, and by May 2024 Epirus had delivered
    four systems while completing NET and EDT with soldiers. The expeditionary branch of the roadmap then moved
    through Leonidas Expeditionary into ExDECS delivery and additional PEGASUS evaluation for the Navy and Marine
    Corps. In parallel, the company used public financing and footprint expansion to argue that it can support scaled
    delivery. Independent funding coverage says Series D is meant to expand production, talent, internal systems,
    and supply-chain resilience; the Oklahoma office and immersive innovation center show actual investment in demos,
    operator enablement, and proximity to FISTA and Joint C-sUAS University. Careers and open roles are thin as
    technical documentation, but they do provide the closest public developer-signal proxy available for a hardware-led
    defense company that does not maintain a visible public code ecosystem.
