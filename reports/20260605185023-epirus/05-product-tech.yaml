company:
  name: Epirus
chapter:
  number: 5
  title: Product & Technology
  summary: 'Epirus’ product surface is now broad enough to look like a family rather than a single prototype: the
    core Leonidas software-defined high-power microwave platform has been extended into mobile, portable, expeditionary,
    maritime, and autonomous variants, with Army and Navy-linked deliveries providing the strongest maturity proof.
    The technical differentiation case rests on solid-state GaN hardware, software weaponeering, modular amplifier
    packaging, and open-architecture integration claims, while trust signals include government safety testing and
    2026 CMMC Level 2 certification. The chapter’s main caution is that public evidence still does not disclose
    unit economics, quality certifications, export classification, or long-run sustainment performance, so the leap
    from successful prototypes to durable scaled fielding remains the central product risk.'
sections:
- id: product-family-workflow
  title: Leonidas family and operator workflow
  body: 'Epirus delivers a layered counter-electronics product family rather than a single point solution. In customer
    workflow terms, the buyer is purchasing a close-in defense capability that senses or accepts an air-picture
    input, hands a target to command-and-control, positions the effector, emits a high-power microwave pulse, and
    then reassesses for surviving threats. The core Leonidas family is presented as software-defined, solid-state,
    long-pulse HPM for counter-UAS, drone-swarm, and broader counter-electronics missions. Around that core, Epirus
    has added distinct operational wrappers: Mobile for vehicle or hitch integration, Pod for portable deployment,
    Expeditionary and ExDECS for Marine or Navy expeditionary use, H₂O for maritime interdiction, and AGV or Stryker
    integrations for mobile or autonomous protection of maneuver forces and critical sites. Air Domain Awareness
    sits upstream as a sensing and decision-support layer that uses big data and machine learning to identify threats
    before engagement. The result is a workflow story in which Epirus is trying to own both the effector layer and
    enough sensing, integration, and mobility hooks to fit into layered defense architectures rather than sell a
    standalone microwave emitter.'
