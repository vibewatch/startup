figures:
- id: FE001
  title: Leonidas product architecture map
  type: stack
  layout: standard
  summary: Leonidas is best understood as a stack linking sensing and C2 inputs to software-controlled power-dense
    HPM hardware and then to deployment-specific wrappers.
  data:
    layers:
    - label: Sensing and decision layer
      detail: Air Domain Awareness or external sensors classify threats and provide the air picture for response
        selection.
    - label: C2 and interoperability layer
      detail: Open-architecture integration hands targets and firing logic through systems such as FAAD C2.
    - label: Software weaponeering layer
      detail: Waveform, pulse, and polarization controls are adjusted in software to tune effect without hardware
        replacement.
    - label: Power and amplifier layer
      detail: GaN devices, intelligent power management, LRAM modularity, and later high-density batteries support
        HPM output.
    - label: Effector and wrapper layer
      detail: The common Leonidas core is wrapped into fixed, mobile, pod, expeditionary, maritime, and autonomous
        variants.
  claimRefs:
  - CE001
  - CE003
  - CE004
  - CE005
  - CE013
  - CE022
  - CE023
