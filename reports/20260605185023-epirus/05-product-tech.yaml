- id: differentiation-trust-compliance
  title: Differentiation, trust, and compliance
  body: 'Differentiation and trust rest on four ideas that recur across the source set. First, Leonidas is framed
    as a non-kinetic answer to the cost imbalance problem: wide-area electromagnetic effects without expending scarce
    interceptors. Second, Epirus emphasizes that the same core HPM stack can be repackaged into portable, maritime,
    expeditionary, and autonomous variants, which is harder to do if the underlying architecture is brittle or manpower-heavy.
    Third, the company pairs product claims with safety and cyber trust signals: public messaging emphasizes low-voltage
    operation, zero ionizing radiation, software-controlled safe zones, government safety testing, and 2026 CMMC
    Level 2 certification for handling controlled unclassified information. Fourth, independent commentary still
    tempers the moat narrative. National Defense Magazine and Robotics Press both describe directed energy as early
    in fielding, while Robotics Press argues that Epirus’ multi-unit delivery proof is unusual but not yet the same
    thing as a durable program-of-record franchise. In other words, Leonidas looks differentiated and increasingly
    credible, but public evidence still proves a high-momentum product, not a fully de-risked category winner.'
  claimRefs:
