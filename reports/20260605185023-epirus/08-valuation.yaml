  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: return-underwrite
    missingEvidence: Audited revenue, margin, burn, and cash data needed to convert the scenario ranges
      into a true return model.
    whyItMatters: Without those figures, public evidence can only support valuation bands, not an IC-grade
      hold or IRR commitment.
    diligencePath: Request the last eight quarters of revenue, gross profit, cash, burn, and board-approved
      operating plan.
    relatedQuestionRefs:
    - QV008
    - QV031
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Liquidation preferences, ratchets, participation rights, and any other structured
      investor protections from prior rounds.
    whyItMatters: Headline valuation can materially overstate or understate true economic entry when prior
      securities have strong downside protection.
    diligencePath: Request the cap table, financing documents, and most recent investor rights summary.
    relatedQuestionRefs:
    - QV012
  - type: private-evidence-only
    severity: material
    topic: ipo-readiness
    missingEvidence: Audited reporting cadence, governance controls, and public-market-grade KPI disclosure
      package.
    whyItMatters: The current public disclosure set is not enough to support an IPO-quality exit case
      with confidence.
    diligencePath: Review board materials, auditor workpapers summary, and readiness plan for public-market
      reporting.
    relatedQuestionRefs:
    - QV022
  - type: private-evidence-only
    severity: material
    topic: procurement-conversion
    missingEvidence: Program-of-record timing, option ladder, and customer-level follow-on procurement
      pipeline.
    whyItMatters: The scenario split between base and bull cases depends heavily on whether current Army
      traction turns into repeat procurement.
    diligencePath: Request the program calendar, awarded options, and management view on procurement conversion
      milestones.
    relatedQuestionRefs:
    - QV029
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table
    missingEvidence: Private-peer revenue, margin, and valuation details for other counter-UAS or directed-energy
      companies.
    whyItMatters: The comparable table can only include publicly visible and model-appropriate references,
      so private-peer benchmarking remains incomplete.
    diligencePath: Add banker comps, private-market marks, and management-provided peer intelligence during
      live diligence.
    relatedQuestionRefs:
    - QV019
    - QV032
    relatedTableRefs:
    - TV004
