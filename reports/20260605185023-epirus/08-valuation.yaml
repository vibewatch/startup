  - - Current public anchor
    - Series D preserved unicorn status but likely reset the 2022 peak price
    - ~$1.0B-$1.35B reference zone
    - Best reconciles company statements with independent down-round reporting
    - Exact post-money and round structure remain undisclosed
  notes: >
    These are scenario bands, not point forecasts; they are designed to help investors reason about procurement conversion and competitive outcomes under incomplete public disclosure.
