- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operating assumptions
  - Valuation range
  - Why it can happen
  - What breaks it
  rows:
  - - Bull
    - Leonidas becomes standard on selected U.S. and NATO layers; allied buys and software/data/sustainment attach emerge
    - $3.0B-$5.0B
    - Category tailwind plus platform ownership closes some of the gap to Shield / Saronic
    - Slower procurement, poor unit economics, or prime bundling stops the rerating
  - - Base
    - Epirus becomes a niche but durable DoD supplier with modest allied follow-on and better manufacturing proof
    - $1.5B-$2.0B
