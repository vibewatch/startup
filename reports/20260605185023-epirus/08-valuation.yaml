- id: TV004
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Category demand
    - Counter-UAS and directed-energy spending are rising quickly across military and infrastructure use cases
    - Market-growth reports are directionally useful but too divergent for precision pricing
    - Verified bookings, not TAM rhetoric, should tighten the multiple
  - - Product fit
    - Leonidas addresses the one-to-many swarm problem better than single-shot kinetic tools
    - HPM still must prove broader operational fielding and sustainment at scale
    - Repeat deployment data and customer references would strengthen the case
  - - Procurement path
    - Army and expeditionary wins show real buyer pull
    - Public evidence still looks closer to prototype-to-follow-on motion than stable budget-line demand
    - Program-of-record status or multi-year procurement would materially upgrade the thesis
  - - International upside
    - Allied testing and NATO-style demand create credible expansion optionality
    - Most public evidence is still demo, MOU, or roadmap level rather than booked sales
    - Signed allied contracts would justify more upside in the base case
  - - Competitive posture
    - Epirus appears differentiated inside HPM counter-swarm systems
    - Raytheon and other primes can bundle broader solutions and compress standalone value
    - Published win-rate or head-to-head evidence would change the view
  - - Financial support
    - The Series D proves capital access remained available in 2025
    - The likely down-round says investors demanded more discipline than in 2022
    - Exact cap-table terms and margin data are needed before assuming rerating
  notes: >
    The thesis is investable; the anti-thesis is what stops that investability from converting into a clean buy today.
  claimRefs:
  - CV003
  - CV004
  - CV057
  - CV058
  - CV059
  - CV060
  - CV065
- id: TV005
  title: Thesis-break and trigger table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Procurement stalls
    - No meaningful follow-on beyond today's visible Army / expeditionary path
    - The strongest public demand spine weakens and the base case compresses
    - Re-underwrite toward the bear case
  - - Next financing resets hard
    - New money lands below the unicorn threshold or with heavy structure
    - Confirms that public strategic relevance is not converting into pricing power
    - Move from track to avoid until terms improve
  - - Prime substitution wins
    - Raytheon or other large incumbents start winning the key HPM / layered-defense slots
    - Standalone category leadership weakens and optionality narrows
    - Cut valuation assumptions sharply
  - - Unit economics disappoint
    - BOM, sustainment, or service burden look closer to low-margin contractor economics
    - The case for a multi-billion rerating collapses
    - Demand a much lower entry price or step away
  - - International option value stays hypothetical
    - Allied demonstrations do not convert into procurement while export friction persists
    - The bull case loses one of its key expansion legs
    - Treat the company as a single-spine DoD story only
  notes: >
    These triggers are observable events, not moods: financing quality, procurement evidence, competition, and economics are the real fault lines.
  claimRefs:
  - CV060
  - CV062
  - CV063
  - CV064
  - CV065
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Exact Series D valuation and preferences
    - Post-money, security terms, and downside protection stack
    - Headline valuation can misstate actual economics for new investors
    - Request term sheet, cap table, and investor rights summary
  - - Backlog and procurement ladder
    - Revenue by program, options, and expected timing of repeat procurement
    - Determines whether Army traction is compounding or simply visible
    - Review program forecasts with finance and customer teams
  - - Unit economics
    - BOM, gross margin by product, field-service burden, and sustainment attach rates
    - Converts strategic relevance into an underwritten value range
    - Finance plus operations diligence workstream
  - - Cash and burn
    - Current cash, burn, working-capital needs, and manufacturing ramp bridge
    - Shows whether another financing is optional or required
    - Board materials and CFO package
  - - Competitive win-loss evidence
    - Head-to-head evaluations, substitute systems considered, and reasons for buyer selection
    - Helps test whether Leonidas is genuinely best positioned or simply early
    - Customer interviews and red-team product diligence
  - - International and infrastructure pipeline
    - Signed LOIs, FMS or export path, and status of commercial critical-infrastructure outreach
    - Bull-case upside depends on breadth beyond one U.S. demand spine
    - Export counsel plus pipeline review
  notes: >
    These asks are the minimum package needed to move from a narrative valuation chapter to an IC-grade underwriting case.
  claimRefs:
  - CV041
  - CV042
  - CV043
  - CV044
  - CV065
