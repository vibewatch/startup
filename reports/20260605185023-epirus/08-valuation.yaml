  figureRefs:
  - FV002
- id: bull-base-and-bear-framework
  title: Bull, base, and bear cases should be wide because the upside is strategic but the data are thin
  body: >
    The bull case is straightforward to describe even if it is not yet proven. If Leonidas becomes a standard counter-swarm layer for U.S. bases and selected NATO allies, if international demonstrations translate into procurement, and if Epirus captures not just hardware revenue but some of the software, data, training, and sustainment layer around electromagnetic effects management, a $3-5 billion outcome is plausible. The base case is narrower and more likely: Epirus becomes a niche but durable Department of Defense supplier, wins some international follow-on business, and produces enough manufacturing proof to hold a $1.5-2.0 billion valuation without ever becoming the next Anduril. The bear case is harsher than many defense-tech bulls like to admit. If Raytheon and other larger primes compress the standalone opportunity, if directed-energy adoption stays slower than hoped, or if budget cycles and procurement timelines stretch the revenue curve, equity value can fall below $0.5 billion. That is why the current investment problem is less about picking a hero narrative and more about deciding how much uncertainty to pay for.
  claimRefs:
  - CV060
  - CV062
  - CV063
  - CV064
  - CV066
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: recommendation-and-diligence-priorities
  title: Recommendation, thesis breaks, and the next diligence work
  body: >
    The right recommendation from public evidence is track, or at most research-more for investors with a specific national-security mandate. The positives are real: a fast-growing threat category, a differentiated HPM product, serious capital backing, Army follow-on proof, and credible optionality in allied and infrastructure protection markets. The negatives are equally real: no disclosed revenue or gross-margin frame, unresolved pricing quality on the latest round, concentrated public customer proof, and clear substitute risk from primes and other heavily funded defense startups. That balance argues against either a dismissive pass or a conviction buy. Instead, investors should treat Epirus as a company that merits continued coverage and disciplined diligence. The upgrade path is concrete: disclosed backlog quality, better evidence of repeat procurement, proof that Leonidas can become part of standard layered architecture, and a cleaner read on unit economics and cap-table terms. Until then, the valuation stance is fair only inside a wide band, and the burden of proof remains on conversion, not on TAM slides.
