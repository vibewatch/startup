- id: funding-capital
  title: Funding history and capital structure signals
  body: Epirus has a strong public financing record even though its current operating economics remain opaque. The company raised $70 million in Series B in 2020, $200 million in Series C in 2022, and an oversubscribed $250 million Series D in March 2025, with public sources putting disclosed total venture funding above $550 million. The cleanest priced valuation in primary materials is the $1.35 billion Series C. For the Series D, the company emphasized capital scale and investor quality but did not publish an exact post-money value. That omission matters because TechCrunch reported the company confirmed a valuation above $1 billion while also citing Bloomberg reporting that the round was being raised below the Series C price. In other words, Epirus still looks well-capitalized, but public materials leave unresolved whether the latest financing represented a flat, modestly down, or otherwise structured round. No reviewed source disclosed debt, venture credit, or secondary-liquidity terms,
    so capital-structure diligence cannot stop at headline funding totals.
