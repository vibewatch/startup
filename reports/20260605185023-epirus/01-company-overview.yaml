  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact Series D post-money valuation, mark history, and any secondary liquidity or structure details.
    whyItMatters: The last priced valuation is the 2022 Series C at $1.35B, while TechCrunch cited Bloomberg reporting a lower 2025 round; without direct documentation the entry price and mark-to-market cannot be underwritten confidently.
    diligencePath: Request the Series D term sheet, post-money cap table, and any board materials describing pricing, dilution, and secondary components.
    relatedQuestionRefs:
    - QO011
    - QO024
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: debt
    missingEvidence: Any debt facility, venture debt, government credit support, or disclosed secondary-liquidity terms.
    whyItMatters: Capital-structure complexity affects dilution, downside protection, and covenant risk, but no public source in the reviewed set disclosed these items.
    diligencePath: Ask management and counsel for debt schedules, security agreements, side letters, and any shareholder liquidity history.
    relatedQuestionRefs:
    - QO013
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, gross margin, and revenue mix by government versus commercial customers.
    whyItMatters: The chapter can confirm fundraising and program wins, but it cannot translate those wins into an operating-quality view without current financial metrics.
    diligencePath: Request a KPI pack, recent monthly financials, and customer cohort summaries that tie revenue to contract programs and commercial accounts.
    relatedQuestionRefs:
    - QO014
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Current customer count, deployment count, and evidence of recurring commercial customers.
    whyItMatters: Epirus says it is expanding commercially and internationally, but public proof remains dominated by government and allied-government programs.
    diligencePath: Request a customer list segmented by defense, allied government, and commercial, plus deployment counts and renewal data.
    relatedQuestionRefs:
    - QO015
    - QO021
    - QO025
    relatedTableRefs:
    - TO001
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: Management-confirmed current headcount and site-by-site employee distribution.
    whyItMatters: Public signals range from "nearly 200" in late 2021 to a 251-500 Crunchbase band in 2025, which is directionally useful but not precise enough for productivity or burn analysis.
    diligencePath: Request a current employee census by function and geography, plus open requisition counts and hiring plan.
    relatedQuestionRefs:
    - QO016
    - QO025
    relatedTableRefs:
    - TO001
