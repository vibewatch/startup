company:
  name: Epirus
chapter:
  number: 1
  title: Company Overview
  summary: Epirus is a private defense-technology company founded in 2018 and headquartered in Torrance, California, built around the Leonidas high-power microwave family and related counter-electronics capabilities. By 2026 the company had raised more than $550 million, delivered multiple Army IFPC-HPM systems, expanded into Oklahoma and Singapore-linked programs, and broadened its product variants, but exact current valuation, revenue, and customer-count metrics remain undisclosed in public materials.
sections:
- id: identity-founding
  title: Identity, founding, and product scope
  body: 'Epirus presents itself as a private defense-technology company founded in 2018 to address asymmetric security threats, especially the problem of countering low-cost drone and drone-swarm attacks with non-kinetic effects. The public identity is consistent across the homepage, about page, and later financing materials: the flagship product is Leonidas, a software-defined high-power microwave platform, while adjacent offerings include air-domain-awareness software and advanced-electronics capabilities that support broader counter-electronics missions. Headquarters are in Torrance, California, following the company''s 2021 move into a larger corporate facility. The company is best described as a venture-backed defense hardware and systems company rather than a software-only vendor; its public materials emphasize prototype delivery, integration with government programs, and support for layered defense. That said, the reviewed corpus does not disclose current revenue, ARR, or customer-count
    metrics, so those operating indicators should be treated as explicit diligence gaps rather than inferred from the company''s rapid fundraising cadence.'
  claimRefs:
