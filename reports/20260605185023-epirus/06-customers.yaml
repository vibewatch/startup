- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver or risk
  - Current public signal
  - Impact
  - Diligence path
  rows:
  - - Army concentration
    - Army is the only customer with multi-step award-to-delivery-to-follow-on proof
    - Revenue and roadmap may hinge on one buyer archetype
    - Request revenue, backlog, and option value by program and service branch
  - - DoD / sponsor concentration
    - Most named customers are U.S. defense or defense-R&D entities
    - Budget timing and program transitions can dominate growth
    - Request pipeline split across operational, R&D, and allied customers
  - - Commercial concentration gap
    - Commercial markets are marketed broadly but no named public production customers are disclosed
    - Diversification story may be earlier than headlines suggest
    - Request named commercial accounts, pilot-to-production conversion, and ARR share
  - - International concentration gap
    - DSTA is the clearest named allied proof and it is still MOU-stage
    - International upside may be lumpy and approval-gated
    - Request export-license pipeline, distributor model, and allied demand funnel
  - - Partner-channel dependence
    - Northrop, GDLS, Anduril, Peraton, and DFT widen reach but can own the end-customer interface
    - Margins and customer control may depend on primes and integrators
    - Request direct-vs-channel revenue, rev-share terms, and who owns sustainment
  - - Prototype-to-program conversion risk
    - CRS and Robotics Press both highlight transition risk after prototypes
    - Backlog durability could be overstated if pilots stall
    - Request acquisition milestones, program office handoff, and funded production quantities
  notes: This table separates expansion drivers from concentration risks; many upside paths are real, but only a small subset has public proof of durable procurement.
