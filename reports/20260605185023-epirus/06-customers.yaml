- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named deployment proof
  body: |
    The clearest adoption story is the Army’s multi-step IFPC-HPM path. Public sources show an initial $66.1 million Army award, first delivery in late 2023, delivery of four systems by March 2024, training and engineering developmental testing, a nearly $17 million modification for a better sensor suite and soldier usability, and then a $43.551 million Generation II follow-on in July 2025. That sequence is materially stronger than a static customer logo because it shows repeat funding and an implementation loop between the buyer and the product team. Navy and Marine Corps proof is narrower but still meaningful: ONR funded Leonidas Expeditionary, ExDECS was delivered to Naval Surface Warfare Center Dahlgren for the Marine Corps, and the Navy’s ANTX-CT24 exercise tested Epirus against seaborne attack vessels while engaging port-security stakeholders. International proof exists, but at lower maturity: the DSTA relationship is an MOU to explore capability, not a disclosed production order. Air Force, DARPA, and ONR relationships are best read as R&D or sponsor proof rather than scaled operational deployment.
