tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public evidence quality
  - Strategic value
  - Key gap
  rows:
  - - U.S. Army fixed-site air defense
    - 'Payer: RCCTO; user: Army air-defense units; buyer: Army acquisition chain'
    - IFPC-HPM for fixed and semi-fixed sites against drone swarms
    - High — award, delivery, training, and follow-on award
    - Anchor customer proof and repeat-funding signal
    - Program-of-record conversion remains unproven
  - - U.S. Navy / Marine Corps expeditionary
    - 'Payer: ONR / Navy; user: USMC; operator support: NSWC Dahlgren'
    - Expeditionary counter-drone swarm defense and maritime testing
    - Medium-high — award plus prototype delivery and exercise evidence
    - Shows cross-domain expansion beyond Army
    - Still prototype / test heavy with limited production evidence
  - - Allied defense science agencies
    - 'Payer / evaluator: DSTA; user: Singapore defense stakeholders'
    - Explore high-power microwave C-UAS capability
    - Medium — fresh named MOU
    - International reference and allied credibility
    - No disclosed production order or value
  - - Air Force and defense R&D sponsors
    - 'Payer: U.S. Air Force / DARPA / ONR; user: warfighter programs or labs'
    - SBIR, sensing, phased-array, and RF research programs
    - Medium — multiple contract announcements
    - Validates sponsor interest and technical relevance
    - R&D sponsorship is not the same as fleet adoption
  - - Prime / integrator channels
    - 'Buyer: Northrop, GDLS, Anduril, Peraton, DFT; end users often undisclosed'
    - Layered C-UAS, mobile SHORAD, integrated kill-chain access
    - Medium — multiple partner agreements, only some end-user detail
    - Broadens routes into programs and platforms
    - Can increase channel dependence and blur end-customer ownership
  - - Critical infrastructure security
    - 'Buyer: government agencies or infrastructure operators; user: security teams'
    - Airport, port, stadium, utility, hospital, and base protection
    - Low-medium — broad segment marketing plus DHS demand signal
    - Large potential adjacency beyond defense
    - No named commercial deployment proof
  - - Communications and energy adjacencies
    - 'Buyer: RF, phased-array, grid, and data-center operators'
    - Intelligent power management, phased arrays, and digital-energy applications
    - Low — market pages and research grants only
    - Optional expansion market if Leonidas tech crosses over
    - No public customer roster or revenue split
  notes: Rows separate clearly evidenced named government programs from future-facing commercial segments; commercial rows reflect marketed demand, not named deployments.
