- id: what-counts-as-real-customer-proof
  title: What counts as real customer proof versus prototype or channel motion
  body: |
    Epirus has enough public evidence to claim real adoption, but not enough to claim mature fleet-scale deployment across a diversified customer base. Army proof is the highest-quality reference because it combines award size, multiple deliveries, operator training, developmental testing, and a later Gen II contract. Even so, CRS and trade coverage still describe the program as prototype-stage and unresolved on long-run procurement. Navy and Marine Corps proof is real but still prototype- and exercise-heavy. DSTA is fresh and strategically useful, yet still exploratory. Air Force and DARPA proof shows recurring government interest, but mostly in SBIR, research, or sponsor form. Channel partnerships with Northrop, GDLS, Anduril, Peraton, and Digital Force broaden access to end programs, but they also mean that some public “customer” motion is actually integrator motion. This distinction matters because logos and partner announcements do not equal durable production deployment. The quality question is therefore not whether Epirus has customers at all; it is how much of the visible customer set is already in repeatable operational use versus still being validated through prototypes, demonstrations, and integrator-led opportunities.
