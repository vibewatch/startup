  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, churn, renewal percentages, average contract term, and customer satisfaction data by program or segment.
    whyItMatters: Repeat Army awards are positive, but without renewal and churn data the durability of the broader customer base cannot be underwritten.
    diligencePath: Request cohort retention, option-exercise history, contract durations, and customer reference calls by service branch and channel type.
    relatedQuestionRefs:
    - QU011
    - QU013
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: Complete roster of named customers, deployment status, contract values, and whether each reference is direct or channel-led.
    whyItMatters: The public named set is clearly partial and skews toward public-sector references, which makes concentration look worse or better than reality depending on what is omitted.
    diligencePath: Request full customer list by direct vs channel sale, stage (pilot / prototype / production), geography, and top-10 contract value.
    relatedQuestionRefs:
    - QU002
    - QU021
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, backlog by program, option values, and direct-versus-channel contribution margin.
    whyItMatters: Public proof suggests Army and DoD concentration, but the economic severity cannot be measured without private customer-level revenue data.
    diligencePath: Request backlog waterfall, option and mod pipeline, top-five customer revenue concentration, and direct-vs-partner sales mix.
    relatedQuestionRefs:
    - QU015
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: prototype-to-program-transition
