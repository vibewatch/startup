- id: TU006
  title: Procurement / contracting friction table
  columns:
  - Friction point
  - Evidence
  - Affected segment
  - Why it slows adoption
  - Mitigation path
  rows:
  - - Prototype-to-program transition
    - CRS says no further procurement was planned after the next prototypes
    - Army and future services
    - A technically successful prototype may still fail to convert into durable line-item demand
    - Request program-of-record milestones, POM timing, and production decision memos
  - - Fielding maturity
    - National Defense says directed-energy systems have not been fielded in significant numbers
    - All operational customers
    - Buyer proof remains pre-mass-adoption and may require more qualification work
    - Request current deployed-base count and operational test results
  - - Suitability and user-experience work
    - Army modification funds better sensor integration and soldier usability
    - Army
    - Customer still needed product and kill-chain refinement after initial deliveries
    - Request open deficiency list and field-change status
  - - Domestic authority constraints
    - DOJ, DHS, and DoD all describe counter-UAS through designated authorities and contract vehicles
    - Homeland security and critical infrastructure
    - Private buyers cannot simply self-procure active effectors without policy and authority alignment
    - Request legal-deployment model by venue and state / federal authority map
  - - Export controls
    - BIS licensing and Wassenaar controls apply to dual-use and defense-adjacent transfers
    - Allied and international
    - Sales cycles can elongate even when demand exists
    - Request export classification, recent licenses, and average approval times
  - - Channel dependence
    - Prime / integrator partnerships are central to several public pathways
    - Army mobile SHORAD, integrated kill-chain, and future programs
    - Program access may depend on partner prioritization and economics
    - Request direct-vs-channel close rates and named teaming agreements by pipeline stage
  notes: Procurement friction here means any non-technical barrier between initial interest and durable scaled adoption, including acquisition process, authority, compliance, and channel control.
