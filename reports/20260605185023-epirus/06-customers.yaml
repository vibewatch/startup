chapter:
  number: 6
  title: Customers
  summary: Epirus has credible public customer proof, but it is concentrated in U.S. defense prototypes and follow-on contracts rather than in a broad base of named production deployments. The Army IFPC-HPM path is the strongest reference because it shows award, delivery, training, modification funding, and a Gen II follow-on; Navy, Marine Corps, Air Force, DARPA, ONR, and Singapore DSTA add breadth but generally at prototype, sponsor, or exploratory stages. Public evidence does not disclose NRR, GRR, churn, or named commercial production customers, so diversification and durability remain key diligence gaps.
sections:
- id: customer-base-segmentation
  title: Customer base segmentation and buyer map
  body: |
    Epirus’s public customer picture is broad at the top of the funnel but narrow in named proof. The company explicitly groups counterparties into government, industry, research and academia, and commercial organizations, and its government page centers the current mission on the DoD and allied militaries across ground, air, and sea defense. That framing is consistent with the strongest named customer evidence: U.S. Army IFPC-HPM, Navy and Marine Corps expeditionary work, and Singapore DSTA. The security, communications, and energy pages widen the map to critical-infrastructure operators, radio and phased-array buyers, and digital-energy operators, but those pages remain segment marketing rather than named customer disclosures. Publicly, buyer, user, and payer are also not the same role. Army RCCTO, ONR, DARPA, and the Air Force appear as paying organizations; soldiers, sailors, Marines, and port-security operators are the implied users; and commercial infrastructure operators are mostly future-facing beneficiaries rather than named current accounts. That means the chapter should be read as a buyer-map and proof-quality exercise, not a simple logo count.
