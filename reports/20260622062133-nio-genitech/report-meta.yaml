  foundingLocation: Hefei, Anhui, China
  headquarters: China
  productSummary: High-performance intelligent-driving SoCs for advanced driver assistance and future autonomous-driving workloads, led by the Shenji NX9031 and follow-on M97 roadmap.
  customerFocus: Chinese automakers, EV manufacturers, smart-driving platform teams, and ADAS system integrators, with NIO and ONVO as the current anchor ecosystem.
  businessModel: Captive chip supply to NIO brands plus prospective external chip sales, technical licensing, and related integration support for automotive OEMs.
  stage: Series A
  fundingStatus: $330M Series A / first external equity round announced in February 2026, with NIO retaining 62.7% ownership.
