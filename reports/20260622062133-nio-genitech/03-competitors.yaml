  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - GeniTech moat claim
      - Specific threat
      - Severity
      - Why it matters
      - Mitigation / diligence ask
    rows:
      - - 5nm process-node leadership among domestic SoC peers
        - Horizon J6 process node is not publicly confirmed; gap may be narrower than the 5nm claim implies
        - Medium
        - If Horizon J6 is at 7nm or better, the process advantage is not decisive for most L2–L3 OEM programs
        - Request public disclosure of J6 process node; compare TSMC roadmap access for each party
      - - Captive NIO/ONVO deployment as production-scale proof
        - Captive proof is difficult to transfer as independent validation to non-NIO OEM buyers
        - Medium
        - External OEMs prefer third-party-validated reliability data over parent-brand deployment references
        - Ask GeniTech for independent safety-audit data and OEM qualification reference access beyond NIO programs
      - - First-mover window opened by US export controls on Nvidia and peers
        - Export restrictions can be relaxed, expanded, or generate supply-chain stigma for OEMs with global JV exposure
        - High
        - Structural tailwind is policy-dependent and reversible; geopolitical framing also adds trust barriers
        - Monitor BIS rulemaking trajectory; press GeniTech for supply-diversity plan if TSMC access constraints worsen
      - - External licensing push to Leapmotor and Geely (reported March 2026)
        - No signed deals confirmed as of mid-2026; Horizon occupies the same target OEM pool
        - High
        - If 2026–2028 design-in slots fill without GeniTech wins, the licensing window closes for this vehicle cycle
        - Require signed LOIs or definitive supply agreements before attributing external licensing value to the thesis
      - - Post-money implied valuation of ~USD 1.1–1.5B
        - Valuation premium over disclosed standalone revenue; public SoC peers trade at lower multiples at comparable traction
        - Medium
        - Black Sesame post-IPO trajectory illustrates investor discounting of domestic SoC companies before revenue proof
        - Benchmark against Horizon and Black Sesame public-market multiples at similar traction; stress-test no-external-win scenario
      - - TSMC 5nm single-foundry supply dependency
        - TSMC allocation constraints, US secondary-sanction risk, or geopolitical disruption could restrict supply
        - High
        - Single-source 5nm dependency concentrates operational and geopolitical risk in one supplier relationship
        - Ask for supply-agreement terms, wafer-reservation commitments, allocation rights, and alternative foundry roadmap
    notes: "Severity ratings are analytical judgments from reviewed sources, filings, and market reports; not published third-party risk ratings."
