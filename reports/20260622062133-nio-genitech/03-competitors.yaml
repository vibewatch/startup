  - id: switching-costs-lock-in-distribution-power
    title: Switching Costs, Lock-In, and Distribution Power
    body: >-
      Intelligent-driving SoC switching costs are structurally high once a design-in reaches production. Vehicle-level
      software validation, ISO 26262 ASIL-D certification re-runs, middleware rebinding, and OTA update-stack
      integration all bind a vehicle program to its initial chip selection for typically three to five model-year
      cycles. GeniTech holds this lock-in advantage within NIO and ONVO programs, but must still earn it for any
      external OEM relationship. The first confirmed externally locked customer is therefore the critical milestone
      for assessing GeniTech's external moat durability.

      Distribution power is substantially asymmetric. Horizon Robotics benefits from a strategic software JV agreement
      with Volkswagen Group China that extends its commercial reach into joint-venture OEM programs, relationships with
      Tier-1 integrators that multiply its touch points, and a public-market capital structure that signals
      procurement credibility to conservative OEM engineering committees. Mobileye distributes through partnerships
      with Tier-1 integrators including Continental, ZF, and Valeo at the global level—a multi-channel advantage that
      no domestic Chinese supplier has replicated. GeniTech's distribution power as of mid-2026 is derived almost
      entirely from the NIO brand family; the March 2026 reports of outreach to Leapmotor and Geely represent the
      first disclosed external distribution attempt, with no signed agreements.

      Multi-homing risk is limited by the economics of SoC integration but exists at the sub-brand or program level.
      A Chinese OEM that runs a Horizon-anchored program and a GeniTech-trialed program simultaneously could use
      GeniTech as a price-pressure lever rather than a strategic partner, weakening per-program economics and
      relationship depth. S&P Global's 2025 analysis confirms that Chinese OEMs are accelerating domestic chip
      qualification because of US export-control expansion, but notes that qualification still takes 12–24 months,
      meaning GeniTech's external licensing push in 2026 competes on the same qualification timeline as Horizon's
      ongoing program wins.
