callouts:
  - calloutType: risk
    title: No confirmed external OEM design wins as of mid-2026
    body: >-
      Despite reported outreach to Leapmotor and Geely in March 2026, GeniTech has not publicly disclosed signed
      supply or licensing agreements with any OEM outside the NIO/ONVO family. The 2026–2028 vehicle design-in cycle
      is time-bounded, and Horizon Robotics holds a material head start in external ecosystem depth and OEM
      relationship scale. Absent confirmed design wins, GeniTech's external licensing narrative carries execution risk
      that is not offset by the captive deployment proof alone.
    claimRefs:
      - CP023
      - CP024
      - CP033
      - CP034
  - calloutType: insight
    title: Export-control tailwind creates both opportunity and a validation paradox
    body: >-
      US BIS restrictions on Nvidia and other US-origin AI chip exports structurally accelerate Chinese OEM
      qualification of domestic alternatives including GeniTech. However, the same geopolitical environment intensifies
      security and trust scrutiny from OEMs with global footprints, Western JV shareholders, or connected-vehicle
      data-sovereignty exposure—a paradox that limits GeniTech's international ambitions even as it expands domestic
      access.
    claimRefs:
      - CP035
      - CP036
      - CP037
      - CP038
  - calloutType: strength
    title: 5nm captive proof is a credible commercial anchor at the premium tier
    body: >-
      The NX9031's TSMC 5nm process and its confirmed deployment in both the NIO ET9 flagship and the 2026 ONVO L90
      update provide production-scale evidence that no other domestic Chinese SoC can replicate at this process tier
      as of mid-2026. This is a genuine differentiator for OEM programs that require leading-edge process performance
      and are willing to accept GeniTech's shorter external track record.
