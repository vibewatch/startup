callouts:
  - calloutType: strength
    title: Production Deployment as Proof Point
    body: >-
      GeniTech's most durable commercial advantage is that the NX9031 enters the licensing
      market with proven mass production in two vehicle brands (NIO ET9 and ONVO L90). For
      OEMs evaluating an automotive-grade chip, production deployment substitutes for years
      of independent lab qualification and provides system-level evidence that the chip
      survives NIO's multi-year vehicle development cycle, IATF 16949 manufacturing norms,
      and field reliability requirements.
    claimRefs:
      - CE007
      - CE008
      - CE009
      - CE019

  - calloutType: risk
    title: Foundry Concentration and Export-Control Exposure
    body: >-
      The attributed reliance on TSMC for 5nm wafer supply creates a single-point
      dependency where further US BIS tightening or Taiwan-related disruption could halt
      NX9031 production with no public backup plan disclosed. The June 2026 BIS guidance
      extending chip-shipment restrictions to overseas subsidiaries of Chinese companies
      underscores that this risk is not merely theoretical. Any international licensing push
      would amplify export-control scrutiny, as the AEI has explicitly flagged Chinese
      intelligent connected vehicle chips as national security concerns for US partners.
    claimRefs:
      - CE029
      - CE032
      - CE033

  - calloutType: recommendation
    title: Certification and Developer Ecosystem Are Critical Unlocks
    body: >-
      For GeniTech's external licensing program to gain traction beyond initial exploratory
      discussions, two gaps must be closed: publication of an automotive-grade certification
      package (ISO 26262 ASIL rating, AEC-Q100 qualification results) and availability of
      a developer-facing integration toolkit (SDK, HAL documentation, reference design).
      Without these, each prospective OEM must fund an independent qualification campaign
      and custom software integration, materially increasing adoption cost and cycle time.
    claimRefs:
      - CE027
      - CE028
      - CE030
      - CE037

