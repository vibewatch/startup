chapter:
  number: 5
  title: Product & Technology
  summary: >-
    GeniTech's core product is the Shenji NX9031, an automotive-grade intelligent-driving
    SoC fabricated at the 5nm node and mass-produced in NIO ET9 and ONVO L90 vehicles.
    External technical licensing launched in November 2025, transforming the chip from a
    captive NIO asset into an industry-available platform; supply discussions with Leapmotor
    and Geely were reported in March 2026. Key differentiators are real production deployment,
    NIO Full Stack integration, and domestic 5nm first-mover status; key risks are undisclosed
    foundry dependency, absent public safety-certification documentation, thin external
    developer ecosystem, and US export-control exposure for any international licensing ambition.

sections:
  - id: product-definition
    title: Product Definition and Customer Workflow
    body: >-
      The Shenji NX9031 is an automotive-grade intelligent-driving system-on-chip fabricated
      on the 5nm process node — the first such chip to reach mass production within the Chinese
      automotive semiconductor industry. GeniTech's core product proposition to OEM customers
      is a fully production-validated compute platform that ingests multi-sensor data from
      cameras, LiDAR, and radar; runs AI inference for perception and planning; and delivers
      driving decisions within NIO's Full Stack software environment. The customer workflow
      begins at the vehicle integration stage: an OEM licenses the NX9031, integrates it with
      the NIO SkyOS operating system and Aquila perception software, and deploys the package
      in a vehicle connected to NIO's over-the-air update infrastructure. The chip's initial
      captive use in the NIO ET9 flagship sedan — in a dual-chip configuration providing
      approximately 512 TOPS combined — furnishes third-party OEMs with a real-vehicle
      reference deployment they would otherwise have to build independently over years.
      External technical licensing launched in November 2025, converting the chip from an
      internal NIO R&D asset into a commercially available automotive compute platform. As of
      April 2026, ONVO confirmed the 2026 L90 will carry the NX9031, extending deployment to
      a second brand and increasing volume context for external buyers. CnEVPost reported in
      March 2026 that GeniTech approached Leapmotor and Geely for potential supply deals,
      though no signed agreements have been publicly disclosed. IC-PCB reported that NIO CEO
      William Li publicly opened the NX9031 to global industry collaboration in July 2024,
      signaling licensing intent ahead of the formal spinout of Anhui Shenji Technology.
