  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: foundry-dependency
      missingEvidence: >-
        Official confirmation from GeniTech or TSMC of the foundry relationship for
        NX9031 5nm wafer production, including supply contract terms, capacity
        allocation, and contingency arrangements.
      whyItMatters: >-
        Single-foundry concentration on TSMC is the most acute supply-chain risk for
        GeniTech; without confirmed details, investors and OEM customers cannot assess
        the probability or impact of a supply disruption triggered by export-control
        escalation or Taiwan-strait tension.
      diligencePath: >-
        Request foundry disclosure from GeniTech management in private diligence sessions;
        cross-check with TSMC customer lists if accessible; review any SEC-equivalent
        filings by NIO Inc. that may name foundry partners.
      relatedQuestionRefs:
        - QE006

    - type: missing-source
      severity: material
      topic: benchmark-gap
      missingEvidence: >-
        Independent third-party benchmark or silicon validation report measuring NX9031
        TOPS, latency, power draw, and sensor-interface bandwidth under automotive
        operating conditions.
      whyItMatters: >-
        All NX9031 performance claims originate from NIO communications or secondary
        reporting; without independent validation, OEMs cannot confirm that stated
        256 TOPS per chip is achieved in real automotive workloads rather than peak
        theoretical conditions.
      diligencePath: >-
        Commission independent silicon characterization during a technical diligence
        session; request GeniTech to share internal characterization data under NDA;
        monitor for peer-reviewed publications from NIO research teams on chip
        architecture.
      relatedQuestionRefs:
        - QE023

    - type: private-evidence-only
      severity: material
      topic: certification-compliance
      missingEvidence: >-
        Published or NDA-accessible ISO 26262 ASIL certification pack and AEC-Q100
        automotive-grade qualification test results for the NX9031 chip.
      whyItMatters: >-
        Without a certification pack, every external OEM that evaluates the NX9031
        must fund an independent safety qualification campaign, substantially increasing
        adoption cost and lengthening procurement cycles beyond what competing chips
        with public certification packages require.
      diligencePath: >-
        Request certification documentation from GeniTech under NDA; ask for the ASIL
        decomposition and FMEA for the NX9031 within the ET9 system context; verify
        whether NIO's vehicle-level ISO 26262 certification covers the chip tier.
      relatedQuestionRefs:
        - QE003

    - type: missing-source
      severity: minor
      topic: developer-ecosystem
      missingEvidence: >-
        Any public or private developer SDK, HAL documentation, integration reference
        design, or third-party support toolchain for NX9031 targeting external OEM
        software teams.
      whyItMatters: >-
        Absence of developer tooling materially limits the addressable external licensing
        market to OEMs willing to build custom SkyOS adapters or equivalent integration
        layers, which is feasible only for large-scale programs with significant engineering
        resources.
      diligencePath: >-
        Ask GeniTech directly about planned SDK release timelines and integration support
        offerings; review any automotive developer community (OTA, AUTOSAR, ROS2) for
        community integrations or third-party ports of the NX9031 stack.
      relatedQuestionRefs:
        - QE011
        - QE025

