        - Fewer ECUs, domestic supply independence, 5nm efficiency
        - Input-type specification breadth not publicly validated beyond third-party claims
      - - Run perception and planning at L2+/L4 compute
        - License ADAS chip from Mobileye, Horizon Robotics, or Qualcomm
        - NX9031 at ~256 TOPS (512 TOPS dual-chip in ET9) with NIO World Model
        - Domestic 5nm flagship compute; in-vehicle production track record
        - No public third-party benchmark vs Snapdragon Ride or EyeQ6
      - - Deliver OTA software updates to AD compute stack
        - Third-party middleware or fragmented ECU-level OTA
        - NIO SkyOS + NX9031 OTA framework with NIO Full Stack connectivity
        - Unified OTA across chip and OS layer; field-proven in NIO fleet
        - Third-party OEMs must integrate SkyOS or build adapter; no public integration guide
      - - Qualify chip in automotive safety program
        - Conduct independent ISO 26262 / AEC-Q100 test campaign from scratch
        - Use NIO's production-validated reference deployment as qualification basis
        - Shorter path to system-level confidence than clean-sheet qualification
        - GeniTech has not published certification documentation; OEM must verify independently
      - - Build external OEM intelligent driving stack on licensed chip
        - License reference design from Horizon Robotics or Mobileye with public SDK
        - NX9031 external license with NIO stack reference (licensing program nascent)
        - Access to real-vehicle-validated platform with NIO data moat
        - No public SDK, developer portal, or third-party integration guide available
