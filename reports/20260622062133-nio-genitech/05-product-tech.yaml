  - id: architecture-specs
    title: Architecture, Technical Specifications, and Integration
    body: >-
      The NX9031 SoC is fabricated at the 5nm node and carries more than 50 billion
      transistors according to third-party technical commentary published by Aivon — a figure
      consistent with claims NIO made at the NIO IN 2024 Tech Day, where the chip's successful
      tape-out was confirmed in July 2024. Per Aivon's engineering analysis, the chip
      incorporates a 32-core CPU cluster alongside a neural processing unit rated at
      approximately 256 TOPS per chip; the NIO ET9 uses two NX9031 chips in a parallel
      configuration, nominally yielding 512 TOPS for the full perception-to-planning pipeline.
      No official GeniTech datasheet or silicon validation report has been released publicly,
      so these specifications remain company-claimed or third-party-attributed rather than
      independently benchmarked. The chip plugs into NIO's Full Stack software architecture —
      a 12-layer technology platform that NIO showcased at Auto Shanghai 2025 covering chips,
      SkyOS operating system, Aquila perception suite, NIO World Model for trajectory planning,
      NOMI AI assistant, and power management. At the sensor ingestion stage, the NX9031
      accepts multi-type sensor streams; Aquila fuses these streams into a coherent scene
      representation; SkyOS orchestrates real-time task scheduling and OTA update delivery;
      and the NIO World Model drives final planning output to the vehicle's actuator layer.
      The foundry partner for the 5nm process has not been officially disclosed by GeniTech;
      third-party observers attribute manufacture to TSMC, which would represent a
      single-source dependency on a foundry subject to US-Taiwan export-control dynamics.
      Competitor reference points illustrate the broader landscape: Black Sesame's Huashan
      A1000 targets L2+ and above on a different process node, Qualcomm's Snapdragon Ride
      Flex SoC unifies cockpit and ADAS compute in a scalable SDV platform, Renesas R-Car V4H
      targets L2+/L3 with emphasis on deep-learning efficiency per watt, and NXP's S32N55
      consolidates multiple ECU functions into a single centralized SDV processor.
