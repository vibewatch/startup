  - id: TR005
    title: "Mitigation and kill criteria table"
    titleSlug: mitigation-and-kill-criteria-table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Foundry access / export control
        - BIS rule update or TSMC press statement about China customers
        - Any new rule that restricts 5nm supply to Chinese-entity chip makers
        - Re-evaluate financial model and operational continuity; thesis-break if no alternative
      - - Customer concentration
        - GeniTech revenue from non-NIO OEMs in 2026-27 annual financials
        - Non-NIO revenue below 10% of chip revenue by end-2027
        - Significant concentration discount persists; reassess growth multiple
      - - M97 qualification timeline
        - Reported M97 mass-production start date vs. Q3 2026 target
        - Delay beyond Q4 2026 without remediation
        - Reduces near-term revenue step-up and M97 design-win pitch
      - - NIO parent financial health
        - NIO Inc. quarterly net income or gross margin
        - NIO returns to sequential operating losses
        - Downstream volume and financial backstop risk rise materially
      - - Standalone governance
        - Appointment of independent GeniTech CEO and board
        - No independent leadership by end-2026
        - Corporate governance risk persists; due-diligence red flag for subsequent investors
      - - Capital adequacy
        - GeniTech Series B or secondary capital raise
        - No follow-on round by mid-2027
        - Burns into the first-round capital; thesis-break risk if runway falls below 12 months
    notes: "Triggers are proxies for risk crystallisation, not precise legal thresholds. Each threshold reflects the point at which investor judgment about the thesis would materially shift."
    claimRefs: [CR001, CR027, CR017, CR029, CR034, CR036, CR038, CR042, CR043, CR045]

