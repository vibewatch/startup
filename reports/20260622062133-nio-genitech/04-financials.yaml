callouts:
  - calloutType: risk
    title: Entire financial picture depends on undisclosed transfer pricing
    body: >-
      The largest single risk in the GeniTech financial analysis is that the subsidiary's only
      confirmed revenue stream — chip supply to NIO and ONVO — is priced through an undisclosed
      related-party transfer arrangement. NIO's consolidated financials do not segment this line,
      and no regulatory filing quantifies what GeniTech receives per chip. Until transfer pricing
      is disclosed, neither the subsidiary's revenue, gross margin, nor standalone viability can
      be assessed from public data.
    claimRefs:
      - CI006
      - CI008
      - CI036

  - calloutType: risk
    title: Export-control risk to TSMC 5nm supply chain is unmitigated
    body: >-
      US BIS export controls on advanced computing semiconductors, extended and clarified in 2026,
      could restrict GeniTech's continued access to TSMC 5nm fabrication or successor nodes
      required for next-generation chip development. GeniTech has not disclosed an alternative
      foundry arrangement or a supply-chain mitigation plan. Any disruption to TSMC access would
      delay next-generation chip timelines and materially impair the external licensing strategy.
    claimRefs:
      - CI031
      - CI032
      - CI033

  - calloutType: recommendation
    title: Five concrete diligence asks before any investment decision
    body: >-
      Any underwriting decision requires: (1) audited GeniTech standalone financials for at least
      FY2025; (2) transfer pricing documentation for captive NIO/ONVO supply; (3) confirmed
      external customer pipeline with deal-stage detail; (4) investor identity disclosure and
      governance documents from the February 2026 round; and (5) a next-generation chip roadmap
      with capital requirements. Without all five, the chapter concludes that GeniTech is a
      structurally credible but financially unverifiable investment.
    claimRefs:
      - CI037
      - CI040
      - CI041
      - CI042

