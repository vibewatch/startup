  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial disclosure gap
      missingEvidence: >-
        Audited standalone GeniTech financial statements (income statement, balance sheet,
        and cash flow statement) for at least FY2025 and H1 2026 management accounts.
      whyItMatters: >-
        Without audited subsidiary financials, no revenue, margin, or cash position can be
        verified; the entire financial chapter rests on inference from deal press releases
        and parent consolidated filings.
      diligencePath: >-
        Request FY2025 audited financials and H1 2026 management accounts directly from
        GeniTech management in a data-room process; reference the NIO parent 20-F as a
        starting point for consolidated context.
      relatedQuestionRefs:
        - QI001

    - type: private-evidence-only
      severity: blocking
      topic: investor identity opacity
      missingEvidence: >-
        Identities of the "several Chinese investors" who participated in the February 2026
        external financing round and their investment mandate or strategic alignment.
      whyItMatters: >-
        Investor identity determines governance quality, future-round commitment probability,
        strategic alignment (domestic policy vs. financial return), and whether co-investors
        have conflicting interests with the company or NIO parent.
      diligencePath: >-
        Request the shareholder register, investor rights agreement, and board composition
        documentation from GeniTech management; cross-reference with NIO investor relations
        for any undisclosed related-party relationships.
      relatedQuestionRefs:
        - QI006

    - type: private-evidence-only
      severity: material
      topic: transfer pricing gap
      missingEvidence: >-
        Transfer pricing policy and arm's-length benchmark for captive chip supply from
        GeniTech to NIO parent and ONVO, including price per chip unit and any volume discount
        or cost-plus arrangement.
      whyItMatters: >-
        Transfer pricing governs GeniTech's realized revenue on its primary stream; without
        it, gross margin and standalone viability cannot be assessed.
      diligencePath: >-
        Request transfer pricing documentation, NIO board-approved pricing policy, and any
        third-party arm's-length analysis supporting the arrangement.

    - type: missing-source
      severity: material
      topic: export control risk
      missingEvidence: >-
        Formal BIS guidance or foundry-specific due diligence requirements applying to TSMC
        supply of 5nm or sub-3nm wafers to Chinese-controlled chip design companies.
      whyItMatters: >-
        If BIS or TSMC imposes additional restrictions on wafer supply, GeniTech's ability to
        tape out next-generation chips is directly impaired, threatening the entire external
        monetization roadmap.
      diligencePath: >-
        Monitor BIS rule updates and TSMC foundry service agreements; request GeniTech's
        legal assessment of current and prospective export-control compliance obligations.

    - type: private-evidence-only
      severity: material
      topic: external licensing pipeline
      missingEvidence: >-
        Public confirmation or announcement of any external non-NIO OEM customer that has
        signed a licensing agreement or confirmed adoption of the NX9031 chip.
      whyItMatters: >-
        External licensing is the key monetization diversification path; without at least one
        confirmed external customer, the licensing revenue stream remains entirely unproven
        and cannot be modelled for any forward capital plan.
      diligencePath: >-
        Request the external customer pipeline by deal stage, expected close dates, and any
        signed or letter-of-intent level agreements; cross-reference with Car News China and
        Tech in Asia reporting on external market entry.
      relatedQuestionRefs:
        - QI009
        - QI021

