  - id: peer-benchmarks-and-public-disclosure-gaps
    title: Peer benchmarks and public disclosure gaps
    body: >-
      Public peer disclosures illustrate how far GeniTech sits from the economics of a
      commercially scaled automotive chip company. Qualcomm's Q1 FY2026 earnings press release
      documents automotive segment revenues well in excess of $500 million for a single quarter —
      the product of decades of OEM design-win accumulation. Renesas Electronics reported FY2025
      results showing total assets of approximately ¥4,177 billion and cash of ¥295.9 billion,
      with an automotive semiconductor revenue base built over many platform generations. NXP
      Semiconductors' 2024 IFRS annual report covers an analogous multi-billion dollar automotive
      revenue pool. These peers are not a valuation template for GeniTech's current stage, but
      they establish the economic ceiling of a mature automotive chip franchise and the distance
      GeniTech must travel to reach comparable unit economics and gross margins.

      Mobileye provides a more proximate model for the licensing and SDK strategy GeniTech
      aspires to. Mobileye's EyeQ Kit SDK allows OEM and Tier-1 partners to build custom
      applications on the EyeQ SoC, generating toolchain revenue alongside silicon supply.
      Mobileye's modular ECU series has further extended the revenue model from chip supply
      toward system-level delivery. GeniTech's NX9031 could pursue a structurally similar path,
      but no SDK, reference platform, or ECU product line has been publicly launched.

      Black Sesame Technologies (HKEx: 2533) is the most direct listed Chinese peer. As a
      publicly traded company at an early revenue stage, it offers a reference point for how
      investors price Chinese automotive SoC companies before profitability. However, neither
      Black Sesame's annual revenue nor its gross margin trajectory is cited in the sources
      reviewed for this chapter, and GeniTech does not have a listed share price or public
      investor day disclosures for direct comparison.

      The disclosure gap is material: compared to every listed peer, GeniTech has no audited
      subsidiary financial statements, no segment revenue line in parent filings, no disclosed
      gross margin, and no public cash or burn metric. Investor identity opacity compounds the
      challenge, as there is no analyst coverage community providing consensus estimates or
      management guidance on the subsidiary's standalone performance.
