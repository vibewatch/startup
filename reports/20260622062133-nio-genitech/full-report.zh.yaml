      - number: '7.4'
        title: 财务、人员与执行风险
        blocks:
          - type: paragraph
            body: >
              财务与执行风险较高，因为 GeniTech 正试图在多年内部战略项目之后独立站起来。2026 年 2 月融资有意义——RMB 2.257 billion 是真实资本，外部投资人也提供了一定验证——但它本身不能证明
              GeniTech 有足够资金覆盖多代芯片、资格验证周期和外部商业化扩张。Li Bin 将 NX9031 研发成本类比为 1,000
              座换电站，凸显领先车规硅片有多烧钱。没有独立收入、毛利率、烧钱或现金数据，投资人无法检验首轮资金究竟充裕，还是只够撑到下一次融资。


              治理放大了这种不确定性。GeniTech 直到 2025 年 6 月才注册成立；截至 2026 年中，公开语料中没有独立披露的 CEO、董事会构成，也没有与 NIO
              领导层分开的管理结构。这让公司在资本结构上看起来部分独立，但独立治理仍很薄。如果外部投资人最终要求更严格监督、独立董事或更清晰的预算纪律，这一转型本身可能变成执行障碍。


              人员风险同样很现实。一个从大型企业环境中走出的 600 多人工程师组织，必须留住流程、安全和设计人才，同时搭建适合公平交易供应商的商业、资格验证和业务开发能力。报道中的 ESOP 池有帮助，接触非 NIO OEM
              也是积极信号，但公司尚未展示外部半导体供应商的组织成熟度。因此，关键执行问题不是 GeniTech 能不能设计芯片——它已经做到了——而是能不能以可持续规模为芯片融资、治理、配人并商业化。
