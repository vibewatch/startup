  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              智能驾驶 SoC 市场给 GeniTech 呈现的是分层竞争场，而不是单一同业集合。在直接国内同行层面，Horizon Robotics 和 Black Sesame Technologies
              是最接近的类别匹配者：两者都总部在中国、均在 HKEX 上市，并向多个 OEM 客户供应智能驾驶 SoC。Horizon 的 Journey 6 家族——J6E、J6M 和 J6P——覆盖从低阶 L2 ADAS
              到高性能、可支持 L3 平台的算力区间；J6E 声称最高 560 TOPS，并支持多种传感器融合配置。Black Sesame 的 Huashan A1000 系列面向 L2 / L2+ ADAS 层级，采用
              16nm 工艺制造，已由多家国内 OEM 集成商部署。Horizon 的 HKEX 招股书披露，其与全球 40 多家 OEM 客户和 70 多家汽车供应链伙伴建立合作；截至 2026 年中，其外部生态明显比
              GeniTech 更深。

              全球在位者层面，Mobileye（Intel 子公司，NASDAQ:MBLY）是占主导地位的全栈 ADAS 供应商，把 EyeQ 芯片、感知软件、地图和 SuperVision L2+ 系统组合在一起。EyeQ6
              采用 7nm 工艺，支撑超过 100 家全球 OEM 关系。Qualcomm 的 Snapdragon Ride 平台定位于可扩展座舱 + ADAS 集成，已宣布多个 2026 年量产项目的全球 OEM
              定点。美国 BIS 出口管制扩围后，两家全球在位者在中国都面临结构性约束：新的中国 OEM 项目已无法放心把这些芯片导入高算力自动驾驶层级认证，从而给国内供应商打开结构性窗口。NXP 和 Renesas
              位于相邻但不同的细分市场——它们的 S32N 车辆集成处理器和 R-Car V4H ADAS SoC 在混合关键性域控制器和 L2 ADAS 用例上竞争，而不是高算力神经网络推理；对于不需要 GeniTech
              级吞吐的买方，它们是低算力替代。内部自研（OEM 自行开发定制硅）是剩余选项；鉴于资本和人才要求，这一路径并不常见，但分析师报道把 Huawei HiSilicon Ascend 和 Xpeng
              自研芯片项目列为更长期的潜在进入者。
