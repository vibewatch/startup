      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 GeniTech 的相关性
    rows:
      - - 高算力 ADAS / AD SoC（旗舰层）
        - L2+/城市 NOA 能力芯片（≥256 TOPS）；传感器融合计算；5nm 工艺节点；NX9031 层级
        - 传统 MCU/ECU 动力总成；制动控制器；车身域芯片
        - OEM 技术 / 动力总成平台采购；CTO 办公室
        - 核心产品（当前 NX9031；计划 M97）
      - - 高算力 ADAS SoC（中端层）
        - 中端 ADAS 计算芯片（128–560 TOPS）；Horizon J6M 等同产品；计划 9031e
        - 座舱娱乐 SoC；未取得车规认证的通用 AI 处理器
        - OEM 成本细分平台团队；Tier-1 域控制器集成商
        - 计划中（9031e 项目）；GeniTech 正从旗舰向下扩展
      - - 汽车 SoC 软件 / 工具链生态
        - ADAS 编译器栈；中间件；参考驱动；与芯片共同销售的开发者 SDK
