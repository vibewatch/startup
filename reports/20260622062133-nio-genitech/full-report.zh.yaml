  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与生态概览
        blocks:
          - type: paragraph
            body: |
              NIO GeniTech 主要充当 NIO Inc. 三品牌电动车生态的锁定半导体供应商：高端 NIO
              品牌（ET9、ET7、EL9、EC6、EC7）、大众市场 ONVO 品牌（L90 SUV），以及在 NIO Day 2024
              发布的入门级国际品牌 firefly。核心客户关系因此落在 NIO Inc. 工程、EE 架构和采购团队层面——这是内部公司利益相关方，而不是公平交易的商业客户。GeniTech
              芯片的买方、用户和付款方最终都是 NIO Inc. 业务单元，所谓「客户」关系被压缩成集团内转移，没有竞争性评估流程。

              锁定集团之外，GeniTech 已把中国国内 OEM 确定为主要外部授权目标。2026 年 3 月有报道称，公司已接触 Leapmotor 和 Geely
              洽谈潜在供货交易；这是首批被公开点名的外部潜在客户。客户地理范围仍完全在中国境内：美国出口管制和独立政策研究者记录的西方安全担忧，从结构上阻断了向欧洲或北美 OEM
              授权。

              NIO 集团 2026 年一季度跨品牌交付 83,465 辆车，定义了当前锁定芯片消耗基线。ONVO 在 2026
              款改款中加入 NX9031 部署计划，意味着锁定客户基础首次扩展到销量更高的大众市场车型；尽管具体归属于 GeniTech 的收入仍未披露，这对未来车队渗透仍是重要战略信号。
