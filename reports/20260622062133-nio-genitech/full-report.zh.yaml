          - type: callout
            title: 整车项目生命周期是主要留存代理
            body: >
              在没有披露 NRR、GRR 或流失数据时，整车平台项目生命周期（每次汽车芯片定点通常 5–7 年）是最相关的耐久性信号。ET9 和 ONVO L90
              的采用承诺创造了多年锁定芯片需求，且结构上有黏性，因为周期中途更换芯片需要完整平台重新认证。这种黏性真实存在，但未经验证，也不能替代能降低集中度暴露的外部客户多元化。
