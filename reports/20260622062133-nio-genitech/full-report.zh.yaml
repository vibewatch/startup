      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议：继续研究 / 跟踪
            body: >
              Nio GeniTech 的战略位置真实且有充分记录：首款量产的国内车规级 5nm 芯片、出口管制顺风，以及 NIO/ONVO 内部部署。证据缺口也同样真实：没有独立收入、没有外部定点、没有审计财务；估值（RMB
              8.27B ~USD 1.13B）相对现有公开证据已经充分定价。实际姿态应是主动跟踪，只有在以下至少两项满足后，才升级为定价承诺：（1）独立审计收入超过 RMB 300 million；（2）至少 1
              个确认的外部非 NIO OEM 定点；（3）披露股权结构和优先清算瀑布。
            calloutType: recommendation
            claimRefs:
              - CV041
              - CV042
              - CV045
          - type: callout
            title: 估值差异提示
            body: >
              官方交易口径显示投后估值约 RMB 8.27 billion（~USD 1.13–1.15 billion）。Yicai Global 2026 年 6 月标题引用「接近 USD 1.5
              billion」。公开记录尚未解释约 30% 的差异。若未独立核验汇率、分期结构或任何后续估值上调，投资人不应使用 USD 1.5 billion 计算入场价或回报。
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV043
          - type: callout
            title: 收入推断限制
            body: |
              本章所有基于收入的估值倍数，均来自 NIO 合并申报文件和可比公司基准推算。Nio GeniTech 没有公开独立审计收入。读者应把所有收入假设视为情景输入，而不是已披露事实。
            calloutType: assumption
