      - number: '8.4'
        title: 牛市 / 基准 / 熊市情景与敏感性分析
        blocks:
          - type: paragraph
            body: >
              到 2027–2028 年，Nio GeniTech 的结果大致落在三种情景里；每种情景都明确收入、倍数和估值假设。所有情景都以 2026 年 2 月入场价 USD 1.13 billion
              为基准（按官方交易口径计算）。


              牛市情景下，GeniTech 到 2026 年底宣布拿下 3 家或更多外部 OEM 的确认定点，2028 年收入达到或超过 RMB 1.5 billion。按 8–12x 收入倍数估值（对应已证明 OEM
              客户多元化的高增长国内 ADAS 芯片公司），隐含估值达到 USD 1.8–3.0 billion。以 USD 1.13 billion 入场，对应 1.6x–2.7x 回报。关键前提包括：TSMC
              供给连续、NIO 母公司财务稳定，以及技术开放能快速转成商业合同。概率信号：低至中等（15–25%），因为外部采用尚未确认，Horizon Robotics 仍占据主导市场位置。


              基准情景下，GeniTech 到 2027 年仍主要服务 NIO/ONVO 体系，最多拿下 1 个外部 OEM 定点。收入推断为 RMB 300–600 million，反映内部供货定价，外部溢价有限。按
              4–8x 收入倍数，隐含估值为 USD 0.9–1.3 billion，基本贴近 2026 年 2 月入场价——也就是没有实质上行，但在 NIO
              母公司财务稳定的前提下，也不会出现灾难性损失。概率信号：中至高（50–60%）。


              熊市情景下，外部定点没有落地；NIO 母公司财务压力压低内部装车量，或迫使转移定价不利于 GeniTech；TSMC 供给又受到出口管制执行约束。收入跌破 RMB 200 million。按 3–5x
              倍数估值（体现单一客户内部供应商折价），隐含估值降至 USD 0.3–0.6 billion，较入场价下跌 60–75%。概率信号：较低但不可忽视（20–30%）。


              关键情景变量不是总可服务市场——Qualcomm 和 NXP 的收入轨迹已经证明市场足够大——而是 NX9031 的 5nm 技术优势能否转成非 NIO OEM
              的商业承诺。只要出现一个确认定点公告，牛市概率就会显著上修，并支撑重新定价。
