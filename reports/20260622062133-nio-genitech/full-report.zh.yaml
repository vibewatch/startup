      - number: '5.3'
        title: 差异化、部署负担与技术风险
        blocks:
          - type: paragraph
            body: >-
              GeniTech 的主要差异化是结构性的：NX9031 进入授权市场时，已经在量产车辆中完成验证，提供了从零起步竞品无法在没有同等道路暴露下复制的参考部署记录。母公司 NIO 的 Full Stack
              定位意味着，这颗芯片与操作系统、感知软件和 AI 模型一起销售；这些软件与模型通过 NIO 车队积累了真实道路数据，护城河延伸到硅片之外。5nm 节点说法若经第三方验证，将使 GeniTech
              成为中国国内汽车领域唯一处于该制程层级的供应商；其供应链不依赖 NVIDIA 和 Mobileye，对面临美国出口管制不确定性的中国 OEM 有吸引力。中国 MIIT 四部门 ICV
              试点框架，以及更广泛的智能网联汽车监管环境，也为国产芯片方案形成合规拉力。

              但多项风险限制第三方采用。GeniTech 尚未发布 ISO 26262 功能安全认证文件或 AEC-Q100 车规资格结果，外部 OEM 要么自行开展验证，要么依赖 NIO
              未记录的内部资格历史；这对安全关键型汽车项目是实质采购门槛。NX9031 没有公开 SDK、开发者门户或集成参考指南，习惯 Mobileye EyeQ Kit 工具链或 Qualcomm Snapdragon
              Ride 生态的 OEM 软件团队，移植负担会更高。US BIS 出口管制制度在 2024 年收紧，覆盖在中国境外运营的中国公司子公司；AEI
              研究强调中国来源网联汽车芯片的安全担忧，给任何国际授权野心制造逆风。归因于 TSMC 的晶圆厂集中度，再叠加趋紧的美台半导体政策，是最尖锐的供应风险向量。NIO 2025 ESG
              报告确认质量与安全是公司支柱，但没有给出 GeniTech 芯片级认证指标，验证了产品披露层面的缺口。
