      - number: '5.2'
        title: 架构、技术规格与集成
        blocks:
          - type: paragraph
            body: >-
              Aivon 发布的第三方技术评论称，NX9031 SoC 采用 5nm 节点制造，晶体管超过 500 亿个；这一数字与 NIO 在 NIO IN 2024 Tech Day 的说法一致，当时公司确认芯片已于
              2024 年 7 月成功流片。按 Aivon 的工程分析，该芯片包含 32 核 CPU 集群，并配备单芯片约 256 TOPS 的神经处理单元；NIO ET9 使用两颗 NX9031
              并联，名义上为完整感知到规划链路提供 512 TOPS。GeniTech 尚未公开发布官方数据手册或硅验证报告，因此这些规格仍属于公司声称或第三方归因，而非独立基准测试结果。芯片接入 NIO Full Stack
              软件架构——NIO 在 Auto Shanghai 2025 展示的 12 层技术平台，覆盖芯片、SkyOS 操作系统、Aquila 感知套件、用于轨迹规划的 NIO World Model、NOMI AI
              助手和电源管理。传感器接入阶段，NX9031 接收多类型传感器流；Aquila 将这些流融合成一致的场景表示；SkyOS 编排实时任务调度和 OTA 更新交付；NIO World Model
              将最终规划输出推送到车辆执行器层。GeniTech 尚未正式披露 5nm 制程的晶圆代工伙伴；第三方观察者将制造归因于
              TSMC，这意味着对一家受美国—台湾出口管制动态影响的晶圆厂形成单一来源依赖。竞品参照展示了更广阔的格局：Black Sesame 的 Huashan A1000 面向不同制程节点上的 L2+
              及以上场景；Qualcomm 的 Snapdragon Ride Flex SoC 在可扩展 SDV 平台中统一座舱和 ADAS 计算；Renesas R-Car V4H 面向
              L2+/L3，强调每瓦深度学习效率；NXP S32N55 将多个 ECU 功能整合到单一集中式 SDV 处理器中。
