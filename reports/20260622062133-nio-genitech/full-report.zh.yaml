              GeniTech 财务分析中最大的单一风险，是子公司唯一已确认的收入流——向 NIO 和 ONVO 供应芯片——通过未披露的关联方转移安排定价。NIO 合并财务报表没有单列这条线，也没有监管文件量化
              GeniTech 每颗芯片获得多少收入。在转移定价披露前，公开数据无法评估子公司的收入、毛利率或独立存续能力。
