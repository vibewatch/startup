      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              GeniTech 市场有两条结构上不同的买方路径。第一条是 NIO / ONVO 车辆生态内部的绑定部署；GeniTech 实际上把芯片卖给 NIO Inc. 自己的车辆项目经理和技术团队，由他们代表 ET9 和
              ONVO 产品线作出平台决策。这一路径的预算归属在 NIO 动力总成和技术采购领导层；采用触发点是 NIO 的战略决定，即把绑定芯片项目从成本中心转为商业实体。这条路径提供即时收入和部署证明，但扩展性受 NIO
              自身车辆销量约束。

              第二条路径是外部 OEM 供应，GeniTech 及其合作伙伴 Axera Technology 向寻求 Nvidia 和 Horizon 国产替代的第三方 OEM 推介 M97 芯片。CnEVPost 在
              2026 年 3 月确认，公司正与 Leapmotor 和 Geely 进行积极沟通——两者都是具备显著销量的 OEM。这一路径中的买方画像通常是 OEM 平台或动力总成技术团队；预算归属可能在技术 /
              采购组合职能，也可能因 ADAS 平台决策的战略重要性而直接落到 CEO 或 CTO。外部 OEM 的采用触发点通常由几类因素组合而成：（a）出口管制或供应安全压力，推动它们摆脱 Nvidia
              或海外芯片；（b）国产替代带来的成本和定制优势；（c）与中国 ICV（intelligent connected vehicle）政策框架保持一致。

              第三条路径——Tier-1 汽车供应商集成——在公开记录中可推断，但未被确认。Bosch、Continental、Mobileye 等传统 Tier-1 会把计算能力与自有 ADAS
              域控制器打包。GeniTech 可以直接向 Tier-1 供应芯片，再由 Tier-1 集成为完整 ADAS 平台卖给 OEM。这条路径公开记录最少、周期最长，但单笔交易潜在量最大。付款方是 Tier-1
              供应商，终端 OEM 则通过 ADAS 平台采购实际控制决策。

              三条路径中，用户画像都在工程层：ADAS 系统架构师、平台集成工程师、验证 / 软件团队，他们评估芯片性能、工具链质量和 ISO 26262 / ASIL 合规。采用路径从芯片送样 → 仿真和 HILS 测试 →
              整车集成 → 法规型式批准 → 量产承诺，周期通常 18–36 个月。这一长周期意味着，今天宣布的客户沟通最早也要到 2027–2028 年才转化为量产。
