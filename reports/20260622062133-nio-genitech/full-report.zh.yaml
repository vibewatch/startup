              美国 BIS 对 Nvidia 及其他美国来源 AI 芯片出口的限制，从结构上加速中国 OEM 对包括 GeniTech 在内的国内替代进行认证。但同一地缘政治环境，也会加剧拥有全球业务、西方 JV
              股东或车联网数据主权暴露的 OEM 对安全和信任的审查——这一悖论限制了 GeniTech 的国际野心，同时扩大其国内准入。
