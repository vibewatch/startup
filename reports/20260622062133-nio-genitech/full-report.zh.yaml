      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最主要的增长驱动是结构性的：美国对先进半导体的出口管制，已逐步限制 Nvidia 向中国客户供应最强芯片的能力；美国商务部 2026 年 6
              月通知确认，这些限制延伸至在中国境外运营的中国公司子公司。该行动加速了中国 OEM 的国产替代刚需，尤其是那些希望避免供应链中断的车企。S&P Global
              和多位行业观察者指出，正因为这种政策压力，中国汽车半导体生态正在积极投资国产替代。CAAM 数据确认 NEV 强劲增长，CAAM NOA 报告确认城市 NOA
              功能扩张，又带来需求侧驱动：更多车辆需要更多算力，OEM 也想要不暴露于地缘供应风险的供应商。

              反向情景由 AEI 智库 2026 年发布的报告锚定：该报告认为，包括 ADAS 芯片在内的中国汽车零部件，因内置连接和数据采集能力，在西方市场存在国家安全风险。这一担忧限制了 GeniTech
              的出口机会，并形成一个分裂的全球市场：中国 SoC 在国内占优，但在欧洲和北美面临监管排除。AEI 报告与 Al Jazeera 对 2026 年 6
              月商务部通知的报道一起，构成语料中最明确的反向证据：在当前政策下，GeniTech 的海外市场 TAM 实际上为零，中国国内市场就是其现实近期期待的全部机会。

              最重要的运营约束，是车规级验证周期长度、软件工具链成熟度和安全责任框架。ISO 26262 功能安全认证、ASIL 合规和 OEM 级 HILS 验证周期会造成 18–36
              个月的量产滞后，单靠芯片性能无法缩短。软件生态——编译器、中间件、参考驱动和开发者文档——是 GeniTech 必须与芯片开发并行投入的配套投资；对 NX9031
              架构的技术分析指出，只有软件栈成熟，芯片价值才能完整释放。中国的 ICV（intelligent connected vehicle）高阶自动驾驶监管框架仍在形成中，城市 NOA
              及更高阶功能的责任归属和型式批准路径因此存在不确定性。

              主要尽调缺口包括：（1）尽管据报与 Leapmotor 和 Geely 有沟通，但没有已确认的外部供应协议；（2）没有公开独立 GeniTech 收入或利润率数据；（3）没有独立 SAM 估计将智能驾驶 SoC
              层级单独切出；（4）RMB 22.57 亿元融资中的投资人身份未知，这关系到战略投资人是否带来 OEM 商业承诺。这些缺口限制了投资人精确测算机会规模、或建立采用时间线信心的能力。
