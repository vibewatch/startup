  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              监管与法律风险是 GeniTech 论点中最不对称的一环，因为它同时包含高影响的外交政策向量，以及智能驾驶芯片跨 OEM 项目规模化前必须满足的中国国内合规栈。境外侧，BIS
              已经收紧先进半导体晶圆厂尽调要求，并在 2026 年 6 月确认芯片限制可适用于中国公司海外子公司。即便没有针对公司的执法行动，这两点对 GeniTech 也很实质，因为 5nm
              车规芯片需要接入领先的非中国晶圆厂。如果美国规则继续约束与中国相关实体的先进节点制造，生产风险会立刻出现，而不是停留在理论层面。


              国内侧，中国 ICV 制度是运营必需，不是装饰性合规。四部门试点框架要求车辆制造商和使用方共同申请准入和道路使用许可；MIIT Q&A 也说明，道路部署前需要省级备案和多部门审查。这意味着 GeniTech
              不能只是把芯片卖给新 OEM，然后假设可以快速部署；潜在客户必须已经拥有合规平台状态，或正朝这一状态推进。OTA 和网络安全义务进一步加重负担，因为软件版本、资格验证和审批会变成反复发生的任务，而不是一次性动作。


              西方政治审查构成第三层。独立政策研究如今把中国来源网联和自动驾驶汽车组件定义为国家安全问题；这未必在每个市场产生直接法律禁令，但仍会压低采购意愿。合在一起，监管风险既广又活跃：GeniTech 受益于 NIO
              当前合规架构，但其独立外部市场姿态仍只有部分证据支撑。
