      区间由 TV003 的收入情景叠加可比倍数推导。入场参考价格为 USD 1.13B（官方交易口径）。相对入场价的回报：熊市意味着亏损 60–75%；基准意味着 ±15%；牛市意味着
      1.6–2.7x。所有数字均为分析师估计；GeniTech 未披露收入或前瞻指引。
