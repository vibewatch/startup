  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现界面
        blocks:
          - type: paragraph
            body: >-
              GeniTech 的主要收入流是绑定芯片供应：NX9031 已为 NIO ET9 豪华轿车量产，ONVO L90 SUV 更新版也已确认采用同一芯片。这些绑定部署证明了量产就绪度，但 GeniTech 与 NIO
              母公司之间的转让定价未在任何公开申报中披露，因此无法判断子公司从母公司关系中实现的收入或毛利率。

              第二个变现界面——外部技术授权——在 2025 年 11 月浮现，当时 Car News China 报道 GeniTech 进入外部授权市场；2025 年 7 月，NIO 创始人 William Li 也宣布
              NX9031 向更广泛行业开放合作。截至 2026 年 6 月运行日，没有外部 OEM 公开确认采用芯片或签署授权协议，因此这条收入流仍明确处于早期管线阶段。

              可推断但未确认的变现界面包括：类似 Mobileye EyeQ Kit SDK 模式的软件工具链接入、参考设计支持包，以及与感兴趣 OEM 的联合开发安排。考虑到 NX9031
              声称的性能特征，这些路径在结构上可行，但没有任何一项被新闻稿或监管申报确认。GeniTech 也没有公布任何接入层级的公开定价，标价、合同底价和折扣结构完全留在公开记录之外。

              因此，收入模式最适合描述为：单一绑定供应业务正在向多收入流混合模式过渡，外部授权和工具链接入仍是愿景式、收入前的层级。NIO 合并申报中没有任何分部收入披露——包括 Q1 2026 业绩中报告总收入 RMB
              25,532.7 million——这意味着即便绑定收入流也无法从外部测算。
