  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 独立财务
        - GeniTech FY2024 和 FY2025 经审计利润表和资产负债表
        - 没有独立报表，无法判断体系内收入、毛利率或现金跑道
        - 向 NIO 投资者关系索取；任何定价决策前要求放入数据室
      - - 股权结构表和优先清算瀑布
        - 完整资本化表，列明所有股东、股份类别、优先权条款和清算瀑布
        - 无法评估下行回收、稀释风险或投资者权利不对称
        - 直接向 GeniTech / NIO CFO 索取；与 2026 年 2 月备案披露交叉核对
      - - 外部 OEM 定点管线
        - 已具名的非 NIO OEM 潜在客户、商业谈判阶段，以及预计导入 / 量产发布时间表
        - 这是唯一能支撑牛市情形的证据；缺失则确认基准 / 熊市情形占主导
        - 客户访谈；工程合作伙伴触达；新闻稿监测
      - - TSMC 供应协议
        - GeniTech 与 TSMC 5nm 供应协议中的条款、量级承诺、定价和连续供货安排
        - 对生产风险评估和销货成本测算至关重要；也关系出口管制风险
        - 向管理层索取；法律团队审查出口管制陈述与保证
      - - 转让定价政策
        - GeniTech 与 NIO 母公司之间，用于 ET9 / ONVO 内部供货的芯片内部定价机制
        - 没有公平交易定价数据，就无法评估 GeniTech 的独立经济性
        - 向 NIO CFO / 税务团队索取；审查 20-F 中关联方交易附注
      - - 公司治理与架构
        - 离岸控股公司层级、VIE 协议（如有）、董事会构成、少数投资者权利
        - 决定投资权利的法律可执行性，以及不利情形下能否触达资产
        - 独立法律尽调；审查 Cayman / BVI 实体架构；核查 SEC 文件中的相关披露
    notes: |
      尽调路径沿用半导体拆分融资的标准做法。若没有正式数据室流程，上述证据项尚未确认可取得。 六项证据全部是给出任何带价格投资建议之前的阻断项。
    claimRefs:
      - CV006
      - CV007
      - CV034
      - CV042
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: GeniTech 的公开里程碑集中在三个节点：NX9031 流片与 ET9 部署（2024 年）、正式拆分（2025 年中）， 以及外部融资和 OEM 触达（2026 年初）。
    data:
      items:
        - date: '2023-12-21'
          label: NIO ET9 + NX9031 发布
          detail: NIO Day 2024——神玑 NX9031 与 ET9 首次公开亮相。
        - date: '2024-07-27'
          label: NX9031 流片确认
          detail: NIO IN Tech Day——TSMC 5nm 流片获验证；确立“全球首颗 5nm AD 芯片”口径。
        - date: '2025-06-17'
          label: GeniTech 实体注册
          detail: 安徽神玑技术有限公司在合肥正式注册；白剑为法定代表人。
        - date: '2025-11-19'
          label: 外部授权启动
          detail: CarNewsChina 报道 NX9031 进入外部技术授权市场。
        - date: '2026-02-26'
          label: RMB 2.257B 首轮外部融资
          detail: 最终协议签署；NIO 持股 62.7%，新投资者 27.3%，ESOP 10%。隐含投后估值约 RMB 8.27B。
        - date: '2026-03-18'
          label: 触达 Leapmotor 与 Geely
          detail: GeniTech + Axera 向 Leapmotor 和 Geely 推介 M97 芯片（>700 TOPS）。
