          - type: callout
            title: 认证与开发者生态是关键解锁项
            body: >-
              GeniTech 的外部授权项目若要走出初步探索性讨论，必须补上两个缺口：发布车规级认证包（ISO 26262 ASIL 评级、AEC-Q100 资格结果），并提供面向开发者的集成工具包（SDK、HAL
              文档、参考设计）。没有这些，每个潜在 OEM 都必须自掏腰包做独立资格验证和定制软件集成，显著拉高采用成本和周期。
