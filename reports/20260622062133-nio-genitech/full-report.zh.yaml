  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与估值差异
        blocks:
          - type: paragraph
            body: |
              Nio GeniTech（正式名称 Anhui Shenji Technology, GeniTech Co., Ltd.）于 2026 年 2 月 26
              日完成首轮外部股权融资，从数名未披露的中国投资者处募集 RMB 2.257 billion（$330 million）。交易后，一家 NIO Inc. 子公司保留 62.7%
              控制性股权。CNEVPost 和 NIO Inc. 投资者关系文件都把隐含投后估值置于约 RMB 8.27 billion，按 2026 年当时汇率（约 CNY 7.15–7.28
              每 USD）折合约 USD 1.13–1.15 billion。投后计算与所述股比一致：注入 RMB 2.257 billion 获得实体约 27.3%
              股权，意味着总投后估值 RMB 8.27 billion。

              Yicai Global 在与本报告同日（June 22, 2026）发布的文章中，把这轮融资描述为让 GeniTech 估值「接近 USD 1.5 billion」。没有来源独立调和 USD 1.5
              billion 与官方 RMB 8.27 billion 数字。三种解释都合理：更有利的汇率假设（CNY ~5.5/USD，意味着 2023
              年前汇率）、对后续上调估值的标题式四舍五入，或未披露的第二批承诺。在通过数据室审阅或后续 NIO 文件解决差异前，两个数字都应作为区间估计保留：交易数学底线为 ~USD 1.1–1.15
              billion，Yicai 给出的上限为 ~USD 1.5 billion。

              Morgan Stanley 将外部融资标记为 NIO 潜在重估催化剂，并指出芯片子公司的价值此前没有体现在母公司合并资产负债表上。NIO 2026 年一季度合并收入为 RMB 25,532.7
              million（$3,701.5 million），交付 83,465 辆车，但任何公开文件都没有 GeniTech 分部级披露，包括 2025 年 4
              月向 SEC 提交的 FY2024 20-F 年报。没有任何经审计独立财务报表，意味着 GeniTech 的所有估值分析都必须基于推断。
            claimRefs:
