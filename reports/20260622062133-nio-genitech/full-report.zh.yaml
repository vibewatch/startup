      - number: '8.5'
        title: 建议、尽调问题与论点失效触发器
        blocks:
          - type: paragraph
            body: >
              对 Nio GeniTech 的实际建议是继续研究 / 跟踪。战略投资逻辑站得住：国内 5nm 旗舰芯片，已在 NIO/ONVO
              规模化内部部署，受益于出口管制，并且披露了对外部合作伙伴开放的姿态。证据缺口同样重要：没有独立审计收入，没有确认外部定点，治理披露薄弱；相对公开证据，估值已充分定价，甚至略显偏贵。风险评级为高，源于内部客户集中、晶圆代工暴露、对
              NIO 母公司财务依赖，以及治理不透明。


              对该建议的信心为低至中等：来自 NIO 合并申报文件、媒体报道和可比公司数据的情报基础很广，但关键变量（GeniTech 收入、股权结构、外部管线）仍是私有信息。只要数据室提供独立审计财务，并确认外部 OEM
              定点，这一判断就会明显转向买入或回避。


              在任何定价投资决策前，有 6 个尽调问题必须先解决。最关键的是：（1）GeniTech FY2024 和 FY2025 独立审计财务报表；（2）完整股权结构和优先清算瀑布，包括 2026 年 2
              月投资人的具体身份和经济条款；（3）外部 OEM 定点管线，列明潜在客户及商业谈判阶段；（4）TSMC 供给协议条款、产能承诺和任何替代晶圆代工安排；（5）GeniTech 与 NIO
              母公司之间内部芯片供应的关联方转移定价政策；（6）治理和公司结构，包括任何 VIE 安排或离岸控股公司层级。


              论点失效触发器按季度监测：GeniTech 出现 down-round 融资，就是估值过高的明确信号；若到 2026 年底仍未宣布任何外部 OEM 定点，牛市逻辑消失；若 TSMC 正式发布点名 GeniTech
              的供给限制，技术护城河将明显受损；若 NIO 母公司在任何 20-F 或季度文件中出现持续经营风险表述，内部收入将面临风险；任何负面治理披露（摊薄性优先权堆叠、关联方自我交易）都会彻底破坏投资论点。
