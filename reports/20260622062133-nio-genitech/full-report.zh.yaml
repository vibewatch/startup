      - number: '2.2'
        title: 市场规模测算——多重视角与证据约束
        blocks:
          - type: paragraph
            body: >-
              在已审阅语料中，没有公开分析师报告以最适合评估 GeniTech 机会的口径，给出中国智能驾驶 SoC 子细分市场的干净、独立 TAM。因此，本章从五个相互收敛的视角搭建规模判断：宏观 NEV
              车辆销量基底、L2+ / 城市 NOA 功能渗透率、Horizon Robotics 公开规模作为在位者代理、S&P Global 对汽车半导体自主可控的分析，以及 NIO / ONVO
              的内部部署轨迹。每个视角都只提供局部估计；合在一起，它们可以框出一个合理的可服务范围，而不是假装存在单一标题数字。

              车辆销量视角是最强锚点。CAAM 报告称，中国 2025 年汽车产量为 3,130 万辆，其中 NEV 1,290 万辆，新车销售渗透率超过 40%。CAAM 2026 年 1 月会议预测，2026 年 NEV
              销量约为 1,500 万辆。由于 RMB 150,000 以上中国 NEV 基本标配 L2+ ADAS 计算，高算力 SoC 的可寻址车队已达到每年数百万辆，并仍在增长。城市 NOA
              功能——城市高速辅助，需要的算力显著高于基础 L2 摄像头 / 雷达融合——是 NX9031 这类高端 SoC 最直接竞争的层级；CAAM 2026 年 1 月发布的专项 NOA
              报告确认，该功能层级正在跨车辆价格带扩张。

              在位者代理视角使用 Horizon Robotics 作为公开参考。Horizon 已披露向 30 多个 OEM 品牌、超过 230 款车型出货芯片；其 Journey 6 系列已与 10 多家 OEM
              建立量产合作。按汽车 SoC 定价，这一规模隐含数十亿 RMB 年度芯片收入 run rate，尽管 Horizon 并未公开拆分单芯片 ASP。S&P Global 2025 年 9
              月对中国汽车产业半导体自主可控的分析，明确把该子细分市场框定为战略优先事项，并指出国内投资正在扩张。

              NIO 内部部署是规模最小、但置信度最高的视角。NIO 2026 年 Q1 交付 83,465 辆车，其中已确认交付搭载 NX9031 的 ET9。ONVO 更新版 L90 在 2026 年 4 月加入
              NX9031，把芯片带入更高销量、更低价格点的车型线。这些内部部署构成 GeniTech 的绑定初始市场——在任何外部供应协议签署前，就已定义了收入底线。

              关键证据约束在于，没有被审阅来源提供自下而上的 SoC 单价或市场规模数字，能够把智能驾驶计算层级从汽车半导体总支出中单独切出来。投资人应把这里的规模测算视为受约束估计：上限由车辆销量天花板框定，下限由
              Horizon 代理托底，而不是第三方验证过的 TAM。
