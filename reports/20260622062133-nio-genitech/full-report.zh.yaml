      - number: '3.4'
        title: 护城河耐久性、出口管制顺风与反向信号
        blocks:
          - type: paragraph
            body: >-
              GeniTech 的竞争护城河建立在三项可识别基础上：国内汽车 SoC 生产商中的 5nm 制程节点领先、绑定部署提供真实量产数据集，以及美国供应商出口管制打开的先发窗口。每项基础都带有可识别且重大的风险。

              制程节点优势真实存在，但可能有时间限制。Horizon J6 制程节点尚未公开确认；如果它是 7nm 或可比的先进节点，那么对多数项目需求而言，GeniTech 5nm
              旗舰的差距会显著缩小。绑定部署优势可信，但很难转化为独立验证：没有 NIO 关系的 OEM 必须自行开展认证，NIO 内部可靠性记录也不能替代第三方安全审计数据。美国 BIS
              出口管制顺风明确利好国内替代——限制已扩展到广泛覆盖 Nvidia 和美国来源 AI 芯片，Al Jazeera 2026 年 6 月报道禁令进一步覆盖在中国境外运营的中资企业——但同一监管环境也会触发全球化
              OEM 或西方 JV 股东的安全与信任担忧。AEI 关于中国来源汽车零部件安全风险的报告，是最突出的反向框架：它认为中国来源汽车计算芯片对国家安全和数据主权构成风险；这一框架一方面加速国内采用，另一方面也让
              GeniTech 的国际授权野心更复杂。

              最重要的近期反向信号，是缺少已确认的外部设计定点。2026–2028 年整车 design-in 窗口竞争激烈且有时间边界：ResearchandMarkets 2026 年关于中国自主 OEM ADAS
              供应链的报告显示，市场正向两到三家主导国内供应商集中。如果 Horizon 在这一周期继续积累 design-in 协议，GeniTech 建立可比外部牵引的机会会缩小。Black Sesame IPO
              后轨迹提供了一个有启发性的反向案例：尽管 2024 年在 HKEX 上市，投资人仍担心收入增长放缓和高端算力层级 OEM 采用温和，这说明任何亏损的国内 SoC 公司都会面对公开市场审视。GeniTech
              在有限独立收入披露下获得 USD 1.1–1.5B 隐含估值，也存在类似的估值溢价与牵引不足缺口；如果外部授权没有实质进展，估值会面临压缩压力。TSMC 5nm
              依赖是最后一个结构性风险：未披露替代晶圆代工路线图，使运营和地缘政治风险集中在单一供应商关系上，而该关系本身也受美国次级制裁动态影响。
