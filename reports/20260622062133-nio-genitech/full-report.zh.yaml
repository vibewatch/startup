      - number: '1.2'
        title: 领导层可见度、关键人物画像与治理缺口
        blocks:
          - type: paragraph
            body: >-
              GeniTech 作为独立实体的公开领导层识别很薄。中文媒体（Jiemian、163.com）援引工商登记记录确认，Bai Jian 是公司法定代表人，并称其 2020 年加入
              NIO、承担芯片领导职责。除此任命外，外部没有 CEO 公告、管理团队页面或子公司治理披露。该实体没有发布独立投资者关系页面；NIO 集团 IR 网站只在 2026 年 2 月融资公告语境下提到这家子公司。


              母公司层面，William Li 掌握战略叙事。他在 2025 年中国电动汽车百人会论坛上公开表示，NX9031 的开发成本相当于建设十多座半导体晶圆厂。这句话一方面验证了芯片项目的技术野心，另一方面也凸显
              NIO 路线极高的资本强度。该表述出现在 36kr 调查文章（索引为 SO011）中，文章也报道了拆分背后的结构性理由——成本纪律、资产负债表改善和外部资本撬动。


              公开记录中完全没有 GeniTech 层面的董事会和治理细节。NIO 宣布 RMB 22.57 亿元投资的官方新闻稿没有披露投资人代表、董事会观察员权利或独立董事。10% ESOP
              池以比例形式披露，但归属安排、具名授予对象和授予时间均未公开。这造成实质性的关键人物集中风险：半导体项目的机构知识主要沉淀在 Bai Jian 及其团队，而该团队仍在 NIO
              更大的研发链条内汇报；公开来源无法验证外部治理锚点。


              尽调时，母子公司治理关系是重要框架。NIO 2024 财年的 Form 20-F（2025-04-08 向 SEC 提交）是覆盖 NIO
              公司结构、风险因素和主要子公司的最完整公开文件，但它早于安徽神玑实体正式成立和 2026 年 2 月投资交割。任何治理问题都应把 20-F 的公司结构章节与 NIO IR
              融资公告合并阅读，而不能把任一文件单独视为完整答案。
