      - number: '6.2'
        title: 具名客户证明与部署证据
        blocks:
          - type: paragraph
            body: >
              GeniTech 证据最扎实的客户部署是 NIO ET9 旗舰轿车。该车型自 2025 年 3

              月启动交付量产起，成为首款搭载 Shenji NX9031 5nm 自动驾驶芯片的车辆。NIO
              官方产品页和多家独立新闻媒体确认了量产规模集成。这构成目前最强的客户证明：公司官方沟通与独立行业报道共同支撑的已确认在产部署。2026

              年 4 月，CnEVPost 报道称，2026 ONVO L90 SUV 改款已确认搭载 NX9031 芯片和 NIO World Model——这是 NIO

              集团第二个平台，也是首款搭载该芯片的大众市场车型，加速了这颗半导体在集团内部向更高销量细分市场渗透。


              锁定部署之外，外部客户证据很薄。CarNewsChina 报道称，GeniTech 自 2025 年 11

              月起启动 NX9031 芯片外部技术授权；CnEVPost 2026 年 3 月报道提到 Leapmotor 和 Geely

              是接触对象，但两家公司均未公开确认任何协议。行业层面关于 NIO 向全球伙伴开放车规芯片的说法，也缺少任何具名伙伴确认。截至 2026 年 6 月仍没有外部 OEM

              签约公告，这对评估外部收入耐久性的投资人构成实质证据缺口。


              基准背景凸显差距：Mobileye 宣布其 Surround ADAS 平台获得第二家全球前十车企定点，并服务全球 50 多个 OEM 品牌；Horizon Robotics

              披露拥有覆盖 42 个品牌的 27 家全球 OEM 客户，定点车型超过 400 款。这些同业展示了规模化后可信外部客户证明应有的样子；相比之下，GeniTech

              已确认外部量产客户为零，是清晰的尽调缺口。
