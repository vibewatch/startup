      - number: '4.4'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，对 GeniTech
              最站得住脚的财务结论是：公司已经拿出足够的投资人认可和母公司支持下的技术执行，足以吸引首轮外部融资；但公开记录完全不足以承销收入质量、资本充足性或公平的独立估值。投资论点建立在推断之上：NX9031
              已量产，NIO 生态提供锁定需求底盘，芯片团队规模大且看起来有经验，外部授权市场提供了合理但未经验证的上行空间。这些推断没有一个锚定在已发布的财务指标上。

              出口管制又增加了一层独立不确定性。US Bureau of Industry and Security 限制先进计算芯片出口至中国实体的规则在 2026 年被延展并澄清；Al Jazeera 2026 年 6
              月报道记录，这些禁令适用于在中国境外运营的中国公司子公司。NX9031 由 TSMC 以 5nm 制程代工，使 GeniTech 处在可能面临额外晶圆厂尽调或准入限制的供应链关系中；如果下一代芯片设计需要
              sub-3nm 节点，风险尤其突出。GeniTech 尚未披露任何缓释方案或替代晶圆厂安排。

              核心尽调阻断项包括：(1) 任何期间都没有经审计的独立财务报表；(2) GeniTech 与 NIO 母公司之间的转移定价未披露，而这正是最大单一收入驱动，导致子公司毛利率不可知；(3)
              没有已确认的外部客户或授权收入；(4) 2026 年 2 月融资的投资人身份未披露，限制了对治理或战略一致性的评估；(5) 下一代芯片资本需求未量化，且会重复 NX9031 多年、数亿美元级投资周期。

              CAAM 2025 城市 NOA 报告和 Research and Markets 2026 ADAS 研究确认，中国智能驾驶芯片市场在增长，高算力 ADAS
              芯片需求在加速，这支持长期需求叙事。但增长的市场需求和未披露的财务数据，不能替代经审计的经济性。只有数据室补齐这些缺口后，GeniTech 才应被视为可投资标的。
