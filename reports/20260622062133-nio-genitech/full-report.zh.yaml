  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Shenji NX9031 是采用 5nm 制程制造的车规级智能驾驶 SoC，也是中国汽车半导体行业首款进入量产的同类芯片。GeniTech 给 OEM
              客户的核心产品主张，是一个已完成量产验证的计算平台：接入摄像头、LiDAR 和雷达等多传感器数据，运行感知和规划所需的 AI 推理，并在 NIO Full Stack
              软件环境内输出驾驶决策。客户工作流从整车集成阶段开始：OEM 授权 NX9031，将其与 NIO SkyOS 操作系统和 Aquila 感知软件集成，再部署到接入 NIO OTA
              更新基础设施的车辆上。该芯片最初在 NIO ET9 旗舰轿车中锁定使用，双芯片配置合计约 512 TOPS；这为第三方 OEM 提供了真实车辆参考部署，否则它们需要多年独立搭建。2025 年 11
              月，外部技术授权启动，NX9031 从 NIO 内部研发资产转为可商用的车规计算平台。截至 2026 年 4 月，ONVO 确认 2026 L90 将搭载
              NX9031，把部署扩展到第二个品牌，也为外部买家增加了销量场景。CnEVPost 2026 年 3 月报道称，GeniTech 接触了 Leapmotor 和
              Geely，洽谈潜在供货交易，但尚无签署协议公开披露。IC-PCB 报道称，NIO CEO William Li 在 2024 年 7 月公开向全球行业合作开放 NX9031，在 Anhui Shenji
              Technology 正式分拆前就释放了授权意图。
