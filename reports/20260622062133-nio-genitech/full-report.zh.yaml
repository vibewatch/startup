            title: 截至 2026 年中，尚无已确认外部 OEM 设计定点
            body: >-
              尽管 2026 年 3 月据报接触 Leapmotor 和 Geely，GeniTech 尚未公开披露与 NIO / ONVO 家族之外任何 OEM 签署供应或授权协议。2026–2028 年整车
              design-in 周期有明确时间边界，Horizon Robotics 在外部生态深度和 OEM 关系规模上拥有实质性先发优势。若没有已确认设计定点，GeniTech
              的外部授权叙事存在执行风险，单靠绑定部署证明无法抵消。
