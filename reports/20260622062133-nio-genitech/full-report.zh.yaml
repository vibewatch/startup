      - number: '4.3'
        title: 同业基准与公开披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开同业披露显示，GeniTech 距离商业规模化车规芯片公司的经济模型还有多远。Qualcomm FY2026 一季度业绩新闻稿显示，汽车业务单季收入远超 $500 million，这是数十年 OEM
              定点积累的结果。Renesas Electronics FY2025 业绩显示总资产约 ¥4,177 billion、现金 ¥295.9 billion，汽车半导体收入底座历经多代平台才搭起来。NXP
              Semiconductors 2024 IFRS 年报覆盖的是类似的数十亿美元级汽车收入池。这些同业不是 GeniTech 当前阶段的估值模板，但它们给出了成熟车规芯片业务的经济上限，也标出了 GeniTech
              要达到可比单元经济和毛利率还要走多远。

              Mobileye 更接近 GeniTech 想走的授权和 SDK 路线。Mobileye 的 EyeQ Kit SDK 允许 OEM 和 Tier-1 伙伴在 EyeQ SoC
              上构建定制应用，在供货芯片之外产生工具链收入。Mobileye 模块化 ECU 系列又把收入模式从芯片供应延伸到系统级交付。GeniTech 的 NX9031 可以走结构类似的路径，但公司尚未公开发布
              SDK、参考平台或 ECU 产品线。

              Black Sesame Technologies（HKEx: 2533）是最直接的中国上市同业。作为一家仍处早期收入阶段的上市公司，它提供了投资人如何给未盈利中国车规 SoC
              公司定价的参照。不过，本章审阅的来源没有引用 Black Sesame 的年收入或毛利率轨迹；GeniTech 也没有上市股价或公开投资者日披露，无法直接比较。

              披露缺口很实质：与每一家上市同业相比，GeniTech
              没有经审计的子公司财务报表，母公司文件中没有分部收入线，没有披露毛利率，也没有公开现金或烧钱指标。投资人身份不透明进一步加重难度，因为没有分析师覆盖群体为子公司独立表现提供一致预期或管理层指引。
