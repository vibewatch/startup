      - number: '7.3'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              与其把 GeniTech 理解为自给自足的半导体公司，不如把它理解为一套密集依赖栈。栈底是先进节点晶圆厂准入。NX9031 的 5nm 制程节点强烈暗示依赖 TSMC 或 Samsung，因为截至 2026
              年中，公开视野里没有可信的中国国内车规级 5nm 替代方案。集中风险之所以严重，不只是因为制造资源稀缺，也因为晶圆厂准入由 GeniTech
              无法控制的地缘政治政策调节。规则一旦收紧，不管客户需求如何，生产都可能停止。


              下一层依赖是 NIO 母集团。NIO 不只是投资人；它仍是控股股东、唯一公开确认的规模客户底座，也是在下行期最可能的财务后盾。这意味着 GeniTech 同时通过多个渠道暴露于 NIO
              的交付趋势、战略变化和财务健康。如果外部多元化已经签约，客户集中度不会这么刺眼；但当前证据只显示公司接触了 Leapmotor 和 Geely，没有已签署的供货定点。


              Axera 是依赖图中的第三个主要节点。M97 共同开发安排降低了单独工程负担，却也带来了 Axera 执行时间、IP 结构和连续性暴露。除这些直接伙伴外，GeniTech 还依赖中国监管审批方，因为 OEM
              需要 ICV 准入和符合 OTA 的部署路径；同时在转化非 NIO
              客户时，公司还要与根基更深的全球和国内芯片供应商竞争。公司的缓释叙事方向可信，但每个核心依赖仍有较高残余暴露，因为替代路径要么不存在，要么早期，要么未披露。
