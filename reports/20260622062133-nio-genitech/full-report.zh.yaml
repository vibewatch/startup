      - number: '3.2'
        title: 能力对比与买方取舍
        blocks:
          - type: paragraph
            body: >-
              2026 年中国 OEM 选择智能驾驶 SoC 时，五个最具运营意义的维度是：算力性能层级、制程节点优势、外部 OEM 记录与安全认证历史、开发者生态成熟度、定价透明度。GeniTech
              在制程节点上领先（TSMC 5nm，对比 Black Sesame 已确认的 16nm 和 Horizon J6 未确认节点），并按第三方技术分析在 NX9031 上提供 256
              TOPS。该芯片支持全传感器融合负载，已量产部署在两款 NIO 家族车型上。现阶段，没有任何中国国内同行能声称拥有量产 5nm 车规 SoC。

              Horizon 在外部 OEM 广度上领先，公开披露的合作伙伴包括 40+ OEM 客户，并在 HKEX IPO 后拥有独立审计财务记录。其 Journey SDK 提供了有文档支持的开放生态集成路径，而
              GeniTech 尚未公开复制这一点。Mobileye 提供 EyeQ Kit SDK，Qualcomm 提供 Snapdragon Ride 软件栈——两者公开工具链都比 GeniTech
              当前披露更广。Black Sesame 提供部分开发工具，但在生态成熟度上落后于 Horizon。Mobileye 的 EyeQ6 采用 7nm
              工艺，节点层级具备竞争力；但鉴于美国出口管制限制，它实际上已无法进入新的中国 OEM 高算力项目。

              2026 年中，OEM 若在 GeniTech 与 Horizon 之间具体比较，核心取舍是：GeniTech 带来更先进制程节点和 NIO
              内部部署证明，但买方必须接受其未经验证的外部供应记录、缺少公开证据的开发者 SDK，以及完全未公开的定价条款。Horizon 则提供成熟的外部 OEM 供应模式、更丰富的 SDK，以及在多数 L2–L3
              项目中性能足够的更高财务透明度。高端 L3+ 层级最看重制程节点，GeniTech 的 NX9031 是唯一在 5nm 硅上经过量产验证的国产来源选项。所有高性能智能驾驶 SoC
              供应商的定价均未披露；比较表将所有价格字段明确标为未披露，而不是估算数字。
