  - id: TV005
    title: 投资逻辑破裂与否决触发项
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - GeniTech 出现降价轮
        - 任何后续融资低于 RMB 8.27B 投后估值
        - 确认 2026 年 2 月入场标记高估；基准情景失效
        - 退出持仓或标记为零；暂停进一步尽调
      - - 到 2026 年底仍无外部 OEM 定点
        - 截至 2026 年 12 月，确认的非 NIO / ONVO OEM 定点公告为零
        - 牛市情景消失；基准情景弱化为熊市；倍数可能压缩
        - 将估值模型下调至体系内供应商倍数（3–5x）；降低持仓
      - - TSMC 限制向 GeniTech 供货
        - 出口管制执法行动，或 TSMC 公开声明限制 GeniTech 5nm 供应
        - 生产管线承压；技术护城河被侵蚀；5nm 优势无法使用
        - 立即暂停尽调；评估替代代工可行性
      - - NIO 母公司持续经营或财务约束条款违约
        - NIO 20-F 出现持续经营措辞，或公告银行财务约束条款豁免
        - 体系内芯片需求承压；GeniTech 收入基础可能坍塌
        - 以接近零体系内收入重跑熊市情景；大概率退出
