  - id: TM002
    title: 市场规模视角表——受证据约束的估算
    columns:
      - 视角
      - 代理指标
      - 公开证据
      - 隐含规模 / 区间
      - 增长信号
      - 方法
      - 信心
      - 关键限制
    rows:
      - - 中国 NEV 整车销量天花板
        - 年度 NEV 产量 × ADAS SoC 搭载率
        - CAAM 2026 年 1 月——2025 年生产 12.9M 辆 NEV；2026 年预测约 15M
        - 每增加 1M 辆搭载高算力 ADAS 的 NEV，按 ~$100–200 ASP 计算，新增 $100–200M TAM 切片
        - NEV CAGR 约 16%（2025→2026 CAAM 预测）；智能驾驶功能组合提升
        - 自上而下：整车产量 × 估计搭载率和 ASP
        - 中——没有公开 SoC ASP 拆分；CAAM 产量可信度高
        - 公开领域没有独立智能驾驶 SoC 搭载率或 ASP 数据
      - - 现有厂商代理（Horizon Robotics 披露规模）
        - Horizon 芯片出货给 30+ OEM、230+ 车型
        - Horizon IR——已出货 5M+ 芯片；Journey 6 已量产并覆盖 10+ OEM 品牌
        - Horizon 多年芯片收入运行率暗示国内 SoC 年市场规模达数十亿 RMB
        - Journey 6 向 10+ OEM 品牌爬坡，显示品类快速扩张
        - 根据披露的客户数和车型数推断收入代理
        - 低-中——Horizon 不单独披露 ASP 或芯片业务收入
        - Horizon 收入为私有信息；估算仅具方向性
      - - NIO/ONVO 内部部署（底线）
        - NIO 2026 年一季度交付；ONVO L90 确认采用 NX9031
        - NIO 2026 年一季度——83,465 辆交付；ONVO L90 2026 年 4 月确认 NX9031
        - 按 NIO+ONVO 运行率计算，内部基数约 300K+ 辆/年；定义收入底线
        - ONVO L90 更新把 NX9031 从旗舰 ET9 延伸到走量车型
        - 自下而上：基于披露交付量；假设 NIO 车队内 GeniTech 100% 捕获
        - 高——NIO 交付数据来自 SEC 申报；ONVO 确认来自 OEM 新闻稿
        - 只覆盖 NIO 生态内部车辆；不包含第三方收入
      - - 国内自主可控政策需求（政策拉动视角）
        - 中国汽车产业半导体自主可控投资
        - S&P Global 2025 年 9 月——中国 EV 产业正在积极建设国内芯片供应链
        - 政策推动创造结构性需求拉力，并叠加在技术驱动需求之上
        - 正在加速；2026 年 6 月美国商务部芯片限制通知增加紧迫性
        - 定性政策分析；没有量化美元值
        - 中——方向正确，但不给出绝对规模
        - 若没有确认 OEM 定点，政策拉动无法直接转化为装车量
      - - 证据约束（规模缺口）
        - 独立分析师对智能驾驶 SoC 子细分的估计
        - 已审阅语料中没有公开来源以有用口径提供独立 TAM
        - 没有专有市场数据就无法可靠量化；应视为缺口
        - 未知——估计缺席本身就是尽调发现
        - N/A——公开来源没有可用方法
        - 对缺口本身的信心高；无可得规模
        - 该缺口推动获取专有市场数据的建议
    notes: 已审阅公开来源没有为中国智能驾驶 SoC 子细分提供干净、独立的 TAM。上述估算是相互收敛的代理，不是权威市场规模数字。投资人应补充专有分析师数据（例如 IHS Markit、IDC 汽车半导体报告）。
