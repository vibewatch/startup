      - number: '4.2'
        title: 成本结构、资本强度与 NIO 母公司托底
        blocks:
          - type: paragraph
            body: >-
              GeniTech 是一家资本开支很重的半导体设计公司。36Kr 2026 年 3 月的分析把芯片业务列为 NIO 最烧钱的项目之一。NIO 创始人 William Li 在公开演讲中把 NX9031
              的开发成本量化为建设 1,000 座 NIO 换电站的投入；按公开披露的换电站经济性折算，这意味着总研发投入大致在数亿美元低位。子公司正式拆分前，芯片团队约有 600 名工程师，覆盖前端设计、后端设计和测试。

              2026 年 2 月的分拆和外部融资，明确是为了把这部分资本负担从 NIO 合并资产负债表上部分移出。NIO 2026 年一季度财务数据披露季度收入 RMB 25,532.7 million ($3,701.5
              million)、交付 83,465 辆车，但没有单列芯片研发或 GeniTech 运营数据。NIO 于 2025 年 4 月 8 日向 SEC 提交的 2024 年 20-F 年报（期间：December
              31, 2024）是母公司最新经审计文件，同样没有 GeniTech 分部。

              2026 年 2 月融资后，一家 NIO 子公司仍持有 GeniTech 62.7% 的控制性股权。官方公告只把投资方描述为「若干中国投资者」，未披露身份。Morgan Stanley 将这笔外部融资标记为
              NIO 股票潜在重估催化剂，说明市场已经意识到，此前芯片估值没有体现在母公司资产负债表上。

              往后看，资本需求包括：(1) 600 多人工程组织的持续运营成本；(2) 下一代芯片设计以及在 TSMC 5nm 或后续制程节点流片的成本；(3) 导入外部 OEM
              客户所需的营运资本。上述前瞻资本需求均未公开量化；$330 million 融资是唯一已确认的资本注入。
