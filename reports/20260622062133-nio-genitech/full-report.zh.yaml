      - number: '6.4'
        title: 集中度风险、安全担忧与外部商业化缺口
        blocks:
          - type: paragraph
            body: |
              GeniTech 的客户集中度接近完全：所有已确认芯片部署都在 NIO 集团内部，因此 NIO Inc. 的交付表现、产品路线图和财务健康，成为 GeniTech
              收入轨迹的主要决定因素。如果 NIO 集团销量下滑，或某次车型改款不再选用 NX9031，GeniTech 锁定销量会等比例收缩，且没有外部收入缓冲。

              外部商业化是 GeniTech 分拆后独立轨迹的关键价值创造论点。两个结构性障碍限制了可触达外部市场。第一，美国出口管制在 2026
              年 6 月被确认适用于中国所有公司及其海外子公司，事实上禁止 GeniTech 向西方 OEM 供货。第二，American Enterprise Institute
              研究报告记录了围绕中国来源汽车芯片的安全与监控担忧，即便非西方 OEM 评估中国组件，也会遇到声誉和采购门槛。

              结构上被锁定的中国国内 OEM 市场，是更现实的近期扩张目标。中国 CAAM 数据确认年产汽车约 31 million 辆；SP Global 分析记录了活跃的 OEM
              芯片自给项目。但即便在国内市场，GeniTech 也面对已有资质的竞争者——Horizon Robotics 有 27 家 OEM 关系，Black Sesame
              披露多个 OEM 客户——它们已经建立外部关系，而 GeniTech 尚未复制。集中度风险不只是投资论点问题：截至 2026 年 6 月运行日，它就是正在发生的商业现实。
