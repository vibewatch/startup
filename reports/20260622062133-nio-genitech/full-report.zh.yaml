  - id: FM001
    title: 市场规模金字塔——TAM、SAM 与受限 SOM
    type: pyramid
    layout: standard
    summary: 三层规模金字塔展示从中国 NEV 总市场上限（TAM），下探到智能驾驶 SoC 细分市场（SAM），再到 GeniTech 受限初始获取空间（SOM）； 每一层都标明证据限制。
    data:
      nodes:
        - id: tam
          label: TAM——中国汽车 ADAS 半导体市场
          detail: >-
            中国乘用车中所有 ADAS 相关芯片支出。上限：CAAM 2025 年 NEV 产量 12.9M；2026 年预测约 15M。 智能驾驶 SoC 层级没有独立美元口径；用 Horizon
            规模和车型销量模型做代理。排除 MCU、信息娱乐和非汽车 AI。
        - id: sam
          label: SAM——智能驾驶高算力 SoC 细分市场
          detail: >-
            面向中国乘用车的 L2+ / 城市 NOA 计算 SoC——NX9031 和 M97 的直接竞争层级。 排除 MCU、信息娱乐和通用 AI。范围限定在中国国内；没有可靠公开 SAM 数字； 用 Horizon
            Robotics 的 OEM 渗透做代理（30+ 品牌、230+ 车型、5M+ 芯片出货）。
        - id: som
          label: SOM——GeniTech 内部自用 + 近期外部机会
          detail: >-
            已确认下限：NIO/ONVO 内部车队（按 2026 Q1 年化口径，约 300K+ 辆 / 年；ET9 + ONVO L90 已确认）。 截至 2026-06-22，外部 OEM
            管线（Leapmotor、Geely 洽谈）尚未确认；考虑 18–36 个月认证周期， M97 量产承诺最早预计在 2027–2028 年。
    approximationNotes: 所有市场规模数字都是基于销量代理变量的近似值。已审阅公开语料中，没有权威的独立智能驾驶 SoC 市场规模数字。 TAM 和 SAM 仅作方向性判断；SOM 只基于已确认的 NIO/ONVO 部署量自下而上测算。
    claimRefs:
      - CM009
      - CM010
      - CM012
      - CM014
      - CM015
      - CM019
  - id: FM002
    title: 市场估算区间——智能驾驶 SoC 年度市场规模代理
    type: range
    layout: standard
    summary: 用不同测算方法给出中国年度智能驾驶 SoC 市场的低、中、高代理估算，呈现证据约束下的区间，而非单一权威数字。
    data:
      items:
        - label: 车型销量低估值（保守 NEV 结构）
          low: 500
          mid: 800
          high: 1200
          unit: USD million / year
          basis: 12.9M NEVs × 20% L2+/city-NOA attach rate × $150–200 per chip ASP (estimated). Conservative attach and ASP.
          source: SM022
        - label: 车型销量基准估值（功能渗透率上升）
          low: 1000
          mid: 1800
          high: 2800
          unit: USD million / year
          basis: 15M forecast 2026 NEVs × 35% L2+ attach × $180 ASP. Consistent with CAAM NOA expansion trajectory.
          source: SM023
        - label: Horizon Robotics 代理值（现有玩家收入下限）
          low: 300
          mid: 600
          high: 900
          unit: USD million / year
          basis: >-
            Horizon 5M+ chips shipped (multi-year); Journey 6 ramp to 10+ OEM brands in 2025–26. Revenue inferred; not
            publicly disclosed. Lower bound assumes ~$100 ASP; upper bound ~$180 ASP.
          source: SM016
        - label: NIO/ONVO 内部自用 SoC 价值（USD M/yr，下限估算）
          low: 30
          mid: 60
          high: 100
          unit: USD million / year
          basis: >-
            ~300K NIO/ONVO annual units at $100–330 per chip (estimated range). This is the confirmed captive floor
            only, not a market-wide estimate. Serves as the SOM lower bound; actual transfer price not publicly
            disclosed.
          source: SM001
    approximationNotes: >-
      所有 USD 估算都是作者用公开车型销量和部署数据构建的代理值。ASP 假设（$100–200）来自行业背景下的示意基准， 不是已披露交易价格。已审阅来源均未提供方法足以达到投资级用途的自下而上智能驾驶 SoC TAM。
      区间只能视为数量级范围。
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
      - CM017
      - CM018
      - CM019
