      - number: '7.2'
        title: 技术、运营与质量风险
        blocks:
          - type: paragraph
            body: >
              GeniTech 的运营风险，来自领先车规芯片路线图的公开雄心，与资格验证、安全、召回准备和安全运营披露证据有限之间的错配。最强技术证明点是 NX9031 已在 ET9
              上量产部署，部分验证了可行性。但这并不消除下一代的执行负担。车规级硅片资格验证很严苛：AEC-Q100 可靠性、面向 ASIL 的安全工作、集成测试、固件加固和 OEM 专属验证，周期都比消费芯片更长。因此，即便
              M97 的流片和目标上市时间已有报道，它仍有进度风险。


              GeniTech 正从 NIO 内部芯片团队转为独立供应商，这让运营负担更重。内部团队可以依赖母公司平台的质量流程、服务结构和危机响应。服务多个 OEM
              的供应商则必须证明自己有独立质量管理、售后支持、问题升级、质保处理和召回协调能力。公开披露尚未显示这套基础设施。下行情形中，即便只有一起与芯片硬件、固件或 OTA 逻辑相关的质量或安全事故，成本和责任都可能相对
              GeniTech 规模被放大。


              安全和供应链风险也描述不足。5nm 车规芯片依赖合格的封装、测试和基板伙伴，公开渠道没有看到备份节点或应急路径。同样，作为独立实体的 GeniTech
              没有公开渗透测试、固件漏洞管理或事件响应文档。结果是：技术潜力存在，但韧性证据仍很早期。
