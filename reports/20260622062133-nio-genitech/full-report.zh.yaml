              - CV043
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: |
              Nio GeniTech 的投资论点建立在四个结构性支柱上。第一，NX9031 是全球首款量产车规级 5nm
              智能驾驶芯片，已部署在 NIO ET9 旗舰轿车，并确认用于 ONVO L90 SUV。NIO CEO William Li 在 2025 年 7
              月直播中确认了这一制程节点优势，行业媒体也独立引用。中国国内竞品尚未宣布出货 5nm 车规计算芯片，因此 GeniTech
              在这一特定应用上处于技术前沿。第二，出口管制环境结构性抬高了中国来源汽车 AI 芯片需求：US Bureau of Industry and Security 2026
              年规则加强了对先进半导体的限制，意味着中国 OEM 越来越难以为 ADAS 采购领先制程节点上的美国来源计算芯片。第三，锁定的 NIO/ONVO
              部署提供了经量产验证的规模化参考，这是同阶段竞品芯片公司缺少的。第四，William Li 2025 年 7 月宣布向外部 OEM 合作开放 NX9031，释放出有意转向第三方变现的信号。

              反论点同样清晰。没有外部 OEM 公开确认采用 NX9031。Horizon Robotics 是中国国内 ADAS 芯片龙头，其 Journey 6
              平台已经确认与十多家 OEM 建立量产合作；GeniTech 面对的是一家装机底座更大、收入已披露的深根竞品。Black Sesame International（HKEX: 2533）也在国内 ADAS
              芯片市场竞争，并有公开市场记录。治理披露偏弱：2026 年 2 月融资的投资人身份仍未披露，没有发布股权结构表，NIO
              合并文件没有 GeniTech 分部收入，无法评估转移定价或公平交易商业可行性。最后，对 TSMC 5nm 制程的晶圆厂依赖带来地缘政治暴露；Horizon Robotics
              同样依赖 TSMC，但鉴于 GeniTech 的 5nm 要求和 NIO 中国总部公司结构，该风险对 GeniTech 尤其尖锐。
