companyProfile:
  summary: >-
    Nio GeniTech，正式注册名为安徽神玑技术有限公司，是 NIO 拆分出的车规芯片子公司，负责将 Shenji NX9031 及后续智能驾驶 SoC 商业化。公开证据确认，公司在 2026 年 2 月完成 RMB 22.57
    亿元首轮外部融资，NIO 保持多数股权，NX9031 已搭载于 NIO ET9 和 ONVO L90。战略吸引力很清楚：国产 5nm 旗舰芯片、与 NIO
    全栈自动驾驶架构深度耦合，以及中国推动半导体自主可控带来的潜在顺风。同样清楚的是尽调约束：GeniTech 没有独立经审计财务报表，没有已确认的外部 OEM 设计定点，治理披露有限；公众对 2026 年 2
    月估值也尚未达成一致——按交易数学约为 USD 1.13B，按标题口径则接近 USD 1.5B。
