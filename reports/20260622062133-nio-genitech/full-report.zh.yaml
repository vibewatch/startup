            title: TSMC 5nm 供应链出口管制风险未被缓释
            body: >-
              US BIS 对先进计算半导体的出口管制在 2026 年被延展并澄清，可能限制 GeniTech 持续使用 TSMC 5nm 制造或下一代芯片开发所需的后续节点。GeniTech
              尚未披露替代晶圆厂安排或供应链缓释计划。任何 TSMC 准入中断都会推迟下一代芯片时间表，并实质性损害外部授权战略。
