      - number: '5.4'
        title: 图表
        blocks:
          - type: callout
            title: 量产部署就是证明点
            body: >-
              GeniTech 最持久的商业优势在于，NX9031 进入授权市场时，已经在两个汽车品牌（NIO ET9 和 ONVO L90）证明可量产。OEM
              评估车规芯片时，量产部署可以替代多年独立实验室资格验证，并提供系统级证据：这颗芯片扛过了 NIO 多年整车开发周期、IATF 16949 制造规范和现场可靠性要求。
            calloutType: strength
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE019
          - type: callout
            title: 晶圆厂集中与出口管制暴露
            body: >-
              归因于 TSMC 的 5nm 晶圆供应依赖，形成了单点依赖：如果 US BIS 进一步收紧，或台湾相关扰动发生，NX9031 生产可能停摆，而公司没有披露公开备份计划。2026 年 6 月 BIS
              指引将芯片发运限制延伸到中国公司海外子公司，说明这一风险不只是理论问题。任何国际授权推进都会放大出口管制审查，因为 AEI 已明确把中国智能网联汽车芯片列为美国伙伴的国家安全关切。
