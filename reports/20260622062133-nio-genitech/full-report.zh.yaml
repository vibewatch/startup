  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Nio GeniTech 的相关市场，是中国智能驾驶和汽车计算 SoC 细分市场：汽车半导体中很窄的一层，芯片为乘用车 L2+ 高级驾驶辅助、城市
              NOA（navigate-on-autopilot）以及未来更高阶自动驾驶功能提供核心计算。它明确不是整个半导体市场，不是电池管理 IC，不是座舱信息娱乐处理器，也不是通用 AI
              加速器。边界按功能划定：当一颗芯片的主要设计目标，是以车规级可靠性处理摄像头、激光雷达、毫米波雷达和地图输入，并实时作出车辆控制或驾驶引导决策，它才落入该边界。GeniTech 的 NX9031——5nm
              芯片，提供 256 TOPS ADAS 算力，目前部署在 NIO ET9 和 ONVO L90——正位于这一边界内。规划中的 M97（> 700 TOPS，与 Axera Technology 联合开发）以及面向
              128 TOPS 的低端 9031e，显示其产品组合想覆盖同一空间里的高端和大众市场层级。

              最重要的排除项，是 NXP、Renesas 和 Infineon 服务的传统 ADAS 微控制器和域控制器 MCU 细分市场。这些芯片在较低算力预算下处理动力总成控制、制动等安全关键功能；它们与 NX9031
              这类高算力 SoC 互补，而不是直接竞争。座舱信息娱乐 SoC 细分市场（Qualcomm Snapdragon SA 系列、MediaTek、Ambarella 成像芯片等供应）以及没有车规认证要求的通用 AI
              加速器也被排除在外。纳入边界内的相关替代品包括：Nvidia Drive Orin/Thor 平台（中国旗舰 ADAS 最广泛部署的海外替代）、Qualcomm Snapdragon
              Ride（中端）、Mobileye EyeQ 系列（以摄像头为中心的 ADAS）、Horizon Robotics Journey 6 系列（按出货量看领先的国内在位者），以及 Black Sesame
              Technologies（次旗舰国内替代）。NIO 生态车辆的现状路径，正是这种对海外芯片的依赖；GeniTech 成立就是为了替代它。对外部 OEM 客户而言，主要替代方案仍是 Horizon
              Robotics，或继续使用 Nvidia / Qualcomm 平台。

              邻近类别——边缘 AI 推理、机器人计算和数据中心 AI——共享部分半导体供应链参与者，但认证标准、热设计包络、功能安全认证和验证流程不同。GeniTech
              聚焦车规级，意味着云端或机器人芯片不能直接替代它，反之亦然。这里确立的市场边界，是后续所有规模测算、买方和驱动因素分析的锚点。
