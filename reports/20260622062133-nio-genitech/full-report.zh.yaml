  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时点
      - 对 GeniTech 的影响
      - 尽调问题
    rows:
      - - 美国对先进半导体的出口管制
        - 驱动因素（利好国产替代）
        - 已经生效；2026 年 6 月 Commerce 通知强化了长期性
        - 把需求结构性拉向国产 SoC；对部分 OEM 来说，Nvidia 不再是可靠选项
        - 确认哪些目标 OEM 已记录 Nvidia 供应担忧，或已经从 Nvidia 切换出去
      - - 中国 NEV 增长与 L2+/城市 NOA 功能渗透
        - 驱动因素（正向）
        - 已经生效；CAAM 预测 2026 年 NEV 约 15M 辆，并将继续增长
        - 每年扩大需要高算力 ADAS SoC 的车辆总量
        - 从 CAAM 或 IHS 获取按价格带划分的城市 NOA 功能渗透率，精确量化 SAM
      - - 中国政府 ICV / 国产芯片自主可控政策
        - 驱动因素（正向）
        - 已经生效；Made in China 2025 及相关 ICV 政策框架仍在执行
        - OEM 收到偏向国产芯片供应商的政策信号；采购阻力下降
        - 核实是否有 OEM 采购政策正式要求优先选择国产 SoC
      - - 围绕中国汽车零部件的地缘政治安全担忧（西方市场）
        - 约束因素（限制出口 TAM）
        - 已经生效；AEI 2026 年报告；EU 和 US 同步推进监管审查
        - 实际上切断 GeniTech 的出口机会；短期 TAM 仅限中国国内
        - 跟踪 EU/US ICV 进口监管时间表；评估是否仍有非中国 OEM 愿意接触
      - - 车规级验证和认证周期长度（ISO 26262 / ASIL）
        - 约束因素（推迟收入兑现）
        - 结构性因素；从芯片送样到量产承诺需 18–36 个月
        - 即便签署 LOI，1.5–3 年内也不会转化为收入；执行风险高
        - 要求 GeniTech 提供 M97 面向具名 OEM 的验证时间表路线图和里程碑计划
      - - 软件工具链和中间件成熟度负担
        - 约束因素（提高 OEM 切换成本）
        - 结构性因素；OEM 越要全栈方案而不是裸芯片，压力越大
        - GeniTech 必须在芯片之外同步投入编译器、SDK、参考驱动——资本开支重
        - 评估工具链投入预算、软件团队人数和外部开发者采用情况
      - - Horizon Robotics 既有 OEM 关系和渠道护城河
        - 约束因素（竞争壁垒）
        - 已深度绑定；30+ 个 OEM 品牌、230+ 款车型已经采用 Horizon 芯片
        - OEM 面临切换成本摩擦（重新适配、重新验证）；Horizon 拥有先发优势
        - 梳理哪些 OEM 仍在评估替代方案，哪些已在下一代平台周期锁定 Horizon
      - - 中国安全责任和 ICV 监管框架不确定性
        - 约束因素（推迟最高阶自动驾驶部署）
        - 中期因素；截至 2026 年中框架仍在演进
        - 城市 NOA+ 功能的型式认证不确定，推迟 NX9031 最高价值用例落地
        - 跟踪 MIIT/CAAM ICV 型式认证规则制定时间表；建模其对城市 NOA 采用曲线的影响
    notes: 驱动因素和约束均围绕 GeniTech 聚焦中国国内市场来评估。鉴于当前监管态势，出口市场约束按短期阻断因素处理，而不是中期考量。
