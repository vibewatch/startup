      - number: '8.3'
        title: 可比基准与市场背景
        blocks:
          - type: paragraph
            body: >
              由于 GeniTech 没有披露独立收入，Nio GeniTech 与任何上市可比公司的直接 EV/Sales 或 EV/EBITDA

              倍数比较都站不住。以下只是方向性基准：把 GeniTech 放进上市同业和全球汽车半导体龙头的格局中，并借助它们披露的财务数据提供量级背景。


              在中国国内 ADAS 芯片市场，Horizon Robotics（HKEX: 9660）是最直接可比公司：一家中国汽车 AI 芯片设计商，已确认与十多家 OEM

              建立量产合作，在 HKEX 上市并公开披露收入。其上市状态提供了公开市场参照，显示投资人如何给已证明 OEM 多元化的中国本土 ADAS

              芯片公司定价。Black Sesame International（HKEX: 2533）在 2025 年年报中报告 FY2024 收入约 RMB 453 million（~USD 62
              million），当前上市估值低于 IPO

              峰值，说明中国公开市场对未盈利 ADAS 芯片公司的胃口会摇摆。这两个可比最有信息量，因为它们反映相同客户底座、制程节点范围和出口管制环境。


              全球范围内，Qualcomm 的 Snapdragon Digital Chassis 分部仅 FY2026 一季度汽车收入就约 USD 1.5

              billion，并拥有覆盖全球主要 OEM 的已确认定点管线，为商业规模 ADAS 芯片收入提供背景参照。NXP Semiconductors FY2024 汽车收入约 USD 2.6

              billion，展示了多元化汽车半导体龙头可达到的收入底座。Renesas Electronics FY2025 收入约 JPY 1.3 trillion（~USD 8.5

              billion，汽车敞口），与 NXP 一样说明，车规芯片要规模化盈利需要很长时间。Mobileye 的 EyeQ 平台拥有全球 30 多家 OEM

              客户，是西方 ADAS 芯片市场渗透已经兑现后的基准。


              合适的估值框架是：在外部收入披露为零的情况下，GeniTech 官方计算的投后估值 ~USD 1.13–1.15 billion，高于 Black Sesame（IPO

              后公开市场），低于 Horizon Robotics（HKEX 市场提供参照）。如果 GeniTech 到 2027 年拿到外部定点并实现 RMB 400-600 million

              收入，4–8x 可比倍数可支撑 USD 0.9–1.3 billion 估值，与当前标记一致。按风险调整后的预期是：考虑证据缺口，当前估值已经充分定价，甚至略偏贵。
