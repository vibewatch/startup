      - number: '6.5'
        title: 图表
        blocks:
          - type: callout
            title: 客户几乎完全集中在 NIO 集团
            body: >
              GeniTech 所有已确认芯片部署都面向锁定的 NIO 集团车型（ET9 已量产，ONVO L90 已确认部署路径）。截至 2026 年 6 月，没有外部 OEM
              供货或授权合同被公开确认。这造成收入几乎完全集中于单一客户集团；该集团自身财务表现（NIO Inc. 持续净亏损）直接决定 GeniTech 的芯片销量。
