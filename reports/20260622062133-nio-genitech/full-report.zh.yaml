      - number: '1.4'
        title: 产品节点、外部化战略与竞争定位
        blocks:
          - type: paragraph
            body: >-
              Shenji NX9031 是公司迄今的核心产品。NIO 在 2023-12-21 的 NIO Day 上随 ET9 发布一同公开推出该芯片，在 NIO IN 2024（2024 年 7 月）宣布流片成功，随后在
              ET9 上市交付时确认量产和交付。第三方技术分析称，NX9031 具备 256 TOPS 算力、LPDDR5 内存，并支持自动驾驶负载所需的全传感器融合，采用 TSMC 5nm 工艺。NIO
              将其定位为全球首颗量产 5nm 车规级 AD 芯片。芯片初始部署范围此后扩大：2026 年 4 月，ONVO（NIO 面向大众市场的子品牌）确认 2026 款 L90 SUV 更新将搭载
              NX9031，把部署从旗舰 ET9 延伸到更高销量的车型线。


              战略拐点出现在 2025 年 11 月，当时多家媒体报道 NIO 已开始对外技术授权 NX9031。CarNewsChina
              将此描述为从绑定自研模式转向商业半导体业务——从第三方产生收入，而不是只把芯片当作成本中心。到 2026 年 3 月，CnEVPost 报道称，GeniTech 及其合作伙伴 Axera Technology
              正向 Leapmotor 和 Geely 推介下一代 M97 芯片（> 700 TOPS），作为潜在外部 OEM 客户。IT之家和 36kr 在 2026 年 3 月报道，M97 已成功流片，预计 2026 年
              Q3 公开发布。


              M97 开发揭示了 GeniTech 的商业目标逻辑：它的算力设计要超过 Horizon Robotics Journey J6P（560 TOPS），后者是高端 ADAS
              的国内主流基准。另有一款低端芯片（项目代号 9031e）据称正在规划中，目标是在大众市场档位对标 Horizon J6M，说明 GeniTech 想做分层产品组合，而不是只押一颗旗舰芯片。截至
              2026-06-22，Leapmotor、Geely 或其他外部 OEM 的供应协议均未在公开披露中得到确认。这个缺口很关键：商业故事很大程度上仍建立在已宣布意向，而非合同收入之上。


              ofweek.com 将 GeniTech 描述为中国首家以独立形态存在的 5nm 车规半导体公司；NIO 和 GeniTech 在官方材料中没有明确采用这一定位，但第三方报道放大了它。NIO 自有
              Innovation 页面上的全栈叙事，把 NX9031 放在更宽的能力栈（OS、AI、电池、芯片）中，强化了一个判断：芯片是 NIO
              产品生态里的战略锚点，而不只是降本工具。后续技术与竞争格局章节应将这些定位说法放回实际 OEM 牵引中检验。
