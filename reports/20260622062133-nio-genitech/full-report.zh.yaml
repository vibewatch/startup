        - 披露稀释性优先权堆栈、超比例投资者权利，或自我交易式关联方交易
        - 投资逻辑受损；少数股东地位在结构上被次级化
        - 法务复核；若结构无法重新谈判，则退出
    notes: |
      触发阈值由分析师基于可比拆分和半导体投资实践推导。建议按季度监测 NIO SEC 文件、新闻稿、行业新闻，以及 HKEX Horizon / Black Sesame 可比公司。
