      - number: '3.3'
        title: 切换成本、锁定效应与分销能力
        blocks:
          - type: paragraph
            body: >-
              一旦 design-in 进入量产，智能驾驶 SoC 的切换成本在结构上就很高。整车级软件验证、ISO 26262 ASIL-D 认证重跑、中间件重新绑定、OTA
              更新栈集成，通常都会把一个车型项目绑定在初始芯片选择上，持续三到五个车型年周期。GeniTech 在 NIO 和 ONVO 项目中已经拥有这种锁定优势，但任何外部 OEM
              关系都还需要重新赢得。首个确认的外部锁定客户，因此是评估 GeniTech 外部护城河耐久性的关键节点。

              分销能力明显不对称。Horizon Robotics 受益于与 Volkswagen Group China 的战略软件 JV 协议，商业触达延伸至合资 OEM 项目；它还通过 Tier-1
              集成商关系放大触点，并借助公开市场资本结构向保守的 OEM 工程委员会传递采购可信度。Mobileye 在全球层面通过 Continental、ZF、Valeo 等 Tier-1
              集成商合作分销，形成多渠道优势；没有中国本土供应商复制了这一点。截至 2026 年中，GeniTech 的分销能力几乎完全来自 NIO 品牌家族；2026 年 3 月关于接触 Leapmotor 和 Geely
              的报道，是首次披露的外部分销尝试，但尚无签署协议。

              SoC 集成经济性限制了多供应商并行风险，但这一风险仍存在于子品牌或项目层面。中国 OEM 可以同时运行一个以 Horizon 为锚的项目和一个试用 GeniTech 的项目，把 GeniTech
              当作价格压力杠杆，而不是战略伙伴，从而削弱单项目经济性和关系深度。S&P Global 2025 年分析确认，因美国出口管制扩围，中国 OEM 正加速国内芯片认证；但分析也指出，认证仍需 12–24 个月，意味着
              GeniTech 2026 年外部授权推进，与 Horizon 正在持续赢得的项目处在同一认证时间线上竞争。
