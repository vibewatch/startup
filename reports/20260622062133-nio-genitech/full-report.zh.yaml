          - type: callout
            title: 任何投资决策前的五项具体尽调要求
            body: >-
              任何承销决策都需要：(1) 至少 FY2025 的经审计 GeniTech 独立财务数据；(2) 面向锁定 NIO/ONVO 供货的转移定价文件；(3) 已确认的外部客户管线及交易阶段细节；(4) 2026 年
              2 月融资的投资人身份披露和治理文件；(5) 附资本需求的下一代芯片路线图。五项缺一，本章结论都是：GeniTech 结构上可信，但财务上无法验证。
