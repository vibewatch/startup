        - OEM ADAS 软件架构师；Tier-1 集成工程师
        - 关键邻接；GeniTech 必须投资工具链，才能赢得外部 OEM
      - - 国外先进 ADAS 平台（Nvidia / Qualcomm / Mobileye）
        - Nvidia Drive Orin/Thor；Qualcomm Snapdragon Ride；Mobileye EyeQ——目前服务中国 OEM
        - 未部署于中国乘用车 ADAS 的芯片（例如数据中心 GPU、消费芯片）
        - 与上述相同的 OEM 采购团队；当前向外国供应商付款
        - 主要替代目标；出口管制压力正把这部分支出迁移到国内
