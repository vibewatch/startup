      - number: '6.3'
        title: 留存、耐久性与结构性锁定
        blocks:
          - type: paragraph
            body: |
              截至 2026 年 6 月运行日，GeniTech 未披露净收入留存（NRR）、总收入留存（GRR）、流失率、续约率或 cohort
              数据。公开渠道也没有来自外部用户的客户满意度评分、第三方评价或案例研究。缺少这些指标有部分结构性原因：主要客户关系在集团内部，项目延续由 NIO
              产品路线图决定，而不是公平交易合同续约。

              衡量 GeniTech 与锁定 NIO 集团关系耐久性的相关代理，是整车平台项目黏性。汽车芯片采购高度集成：一旦被某个整车平台选用，硬件集成、固件栈、ADAS
              算法训练和供应商资格成本都会形成切换成本，通常覆盖整个 5–7 年整车开发周期。NIO ET9 项目自 2025 年 3
              月量产启动起承诺使用 NX9031，创造了多年锁定收入流；ONVO L90 集成又把这条收入流扩展到第二个高销量平台。

              竞品证据展示了真正留存数据应有的样子：Mobileye 的模块化架构和定点公告，凭披露的定点数量和车辆交付指标证明多年 OEM 平台黏性；Black Sesame
              和 Renesas 报告多年 OEM 合作关系。GeniTech 的结构性黏性真实存在，但没有任何正式留存指标验证。下方分群图用汽车行业常态估算平台延续概率；它明确只是示意，并非源自 GeniTech
              特定留存数据。
