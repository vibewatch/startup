    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律足迹与公司结构
        blocks:
          - type: paragraph
            body: >-
              Nio GeniTech 是英文传播中使用的产品名，对应正式注册的 Anhui Shenji Technology Co., Ltd.（安徽神玑技术有限公司）；“神玑”（Shenji /
              GeniTech）这一简称同时指代公司实体和旗舰芯片家族。公司于 2025-06-17 完成工商登记，注册地址位于合肥经济技术开发区恒创智能科技园——这也是 NIO
              中国总部所在园区。地址重合传递的信号是：这次拆分更像是与母公司保持组织连续性的安排，而不是完全独立的平行拆分。


              终极母公司 NIO Inc.（NYSE: NIO；HKEX: 9866；SGX: NIO）提出了覆盖芯片、操作系统、AI 模型和电池的“Full Stack”自研战略。芯片职能此前嵌在 NIO
              合并口径的研发组织中；2025 年中安徽法律实体成立后，半导体项目被正式变成可单独治理、可接受外部资本、也可争取外部客户的单元。截至 2026-06-22，首轮外部融资完成后，NIO 仍以 62.7%
              持股保持多数股东地位。


              Bai Jian（白剑）是该实体登记的法定代表人，2020 年加入 NIO 负责芯片开发。NIO 创始人、董事长兼 CEO William Li（李斌）公开将芯片拆分描述为一项结构性改革：在 NIO
              连续多个季度亏损之后改善成本结构，同时保留战略控制权。2025 年年度 ESG 报告和 NIO.com Full Stack 页面都把芯片自研放在 NIO 长期技术护城河的底层位置，但两份文件均未披露
              GeniTech 的独立员工数、收入或运营结构。


              双名称惯例——中文监管文件中的安徽神玑技术，以及产品和投资者传播中的 GeniTech /
              Shenji——给后续尽调带来轻微的辨识问题。后续章节应将“GeniTech”作为工作简称；涉及监管或股权链问题时，再注明安徽神玑这一法律实体。截至运行日，公司阶段最适合定义为早期商业化、已有投资人背书的子公司：有量产产品、有外部授权业务、首轮机构融资已关闭，但没有公开的独立财务披露。
