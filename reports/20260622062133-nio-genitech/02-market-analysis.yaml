  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Factor
      - Direction
      - Timing
      - Implication for GeniTech
      - Diligence Ask
    rows:
      - - U.S. export controls on advanced semiconductors
        - Driver (positive for domestic alternatives)
        - Active now; June 2026 Commerce notice reinforces permanence
        - Creates structural demand pull toward domestic SoCs; removes Nvidia as reliable option for some OEMs
        - Confirm which target OEMs have documented Nvidia supply concerns or have already moved off Nvidia
      - - China NEV growth and L2+/city-NOA feature penetration
        - Driver (positive)
        - Active now; CAAM forecasts ~15M NEV in 2026 and continued growth
        - Expands the total number of vehicles needing high-compute ADAS SoCs every year
        - Obtain city-NOA feature penetration rate by price tier from CAAM or IHS to quantify SAM precisely
      - - Chinese government ICV / domestic chip self-reliance policy
        - Driver (positive)
        - Active now; Made in China 2025 and related ICV policy frameworks in force
        - OEMs receive policy signals to favor domestic chip suppliers; reduces procurement friction
        - Verify whether any OEM procurement policy formally mandates domestic SoC preference
      - - Geopolitical security concerns re Chinese automotive components (Western markets)
        - Constraint (limits export TAM)
        - Active now; AEI report 2026; parallel regulatory reviews in EU and US
        - Effectively eliminates GeniTech's export opportunity; TAM is China-domestic only in near term
        - Monitor EU/US ICV import regulation timelines; assess whether any non-China OEM would still engage
      - - Automotive-grade validation and qualification cycle length (ISO 26262 / ASIL)
        - Constraint (delays time-to-revenue)
        - Structural; 18–36 months from chip sampling to production commitment
        - Even a signed LOI translates to no revenue for 1.5–3 years; execution risk is high
        - Request GeniTech's validation timeline roadmap and milestone plan for M97 with named OEMs
      - - Software toolchain and middleware maturity burden
        - Constraint (raises switching cost for OEMs)
        - Structural; grows more acute as OEMs demand full-stack solutions rather than bare chips
        - GeniTech must invest in compilers, SDK, reference drivers in parallel with chip — capital-intensive
        - Assess toolchain investment budget, team headcount in software, and external developer adoption
      - - Horizon Robotics' incumbent OEM relationships and distribution moat
        - Constraint (competitive barrier)
        - Entrenched; 30+ OEM brands and 230+ vehicle models already on Horizon chips
        - OEMs face switching-cost friction (retooling, revalidation); Horizon has first-mover advantage
        - Map which OEMs are still evaluating alternatives vs. committed to Horizon for next platform cycle
      - - Safety liability and ICV regulatory framework uncertainty in China
        - Constraint (delays highest-autonomy deployments)
        - Medium-term; framework still evolving as of mid-2026
        - Type-approval uncertainty for city-NOA+ features delays the highest-value use cases for NX9031
        - Track MIIT/CAAM ICV type-approval rulemaking timeline; model its effect on city-NOA adoption curve
    notes: >-
      Drivers and constraints are assessed against GeniTech's domestic China market focus. Export-market constraints are treated
      as near-term blockers rather than medium-term considerations given current regulatory posture.
