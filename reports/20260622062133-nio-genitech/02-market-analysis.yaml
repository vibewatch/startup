  - id: TM002
    title: Market Sizing Lens Table — Evidence-Constrained Estimates
    columns:
      - Lens
      - Proxy Measure
      - Public Evidence
      - Implied Scale / Range
      - Growth Signal
      - Methodology
      - Confidence
      - Key Limitation
    rows:
      - - China NEV vehicle-volume ceiling
        - Annual NEV production × ADAS SoC attach rate
        - CAAM Jan 2026 — 12.9M NEV produced in 2025; ~15M forecast 2026
        - Every 1M incremental NEV with high-compute ADAS at ~$100–200 ASP adds $100–200M TAM slice
        - NEV CAGR ~16% (2025→2026 CAAM forecast); intelligent-driving feature mix rising
        - Top-down vehicle volume × estimated attach and ASP
        - Medium — no public SoC ASP breakout; CAAM volume is high-confidence
        - No standalone intelligent-driving SoC attach rate or ASP data in public domain
      - - Incumbent proxy (Horizon Robotics disclosed scale)
        - Horizon chip shipments to 30+ OEMs, 230+ vehicle models
        - Horizon IR — 5M+ chips shipped; Journey 6 in mass production with 10+ OEM brands
        - Horizon's multi-year chip revenue run rate implies a multi-billion RMB annual domestic SoC market
        - Journey 6 ramp into 10+ OEM brands signals rapid category expansion
        - Revenue proxy inferred from disclosed customer count and model count
        - Low-Medium — Horizon does not disclose ASP or revenue from chip business separately
        - Horizon revenue is private; estimate is directional only
      - - NIO/ONVO captive deployment (floor)
        - NIO Q1 2026 deliveries; ONVO L90 confirmed NX9031 adoption
        - NIO Q1 2026 — 83,465 deliveries; ONVO L90 April 2026 NX9031 confirmation
        - Captive internal base of ~300K+ units/yr at NIO+ONVO run rate; defined revenue floor
        - ONVO L90 update extends NX9031 beyond flagship ET9 to volume model
        - Bottom-up from disclosed delivery volumes; 100% GeniTech capture assumed within NIO fleet
        - High — NIO delivery data is SEC-filed; ONVO confirmation is OEM press release
        - Covers only captive NIO-ecosystem vehicles; no third-party revenue included
      - - Domestic self-reliance policy demand (policy-pull lens)
        - Chinese automotive industry semiconductor self-reliance investment
        - S&P Global Sept 2025 — China EV sector actively building domestic chip supply chains
        - Policy push creates structural demand pull that is additive to technology-driven demand
        - Accelerating; June 2026 US Commerce notice on chip restrictions adds urgency
        - Qualitative policy analysis; no quantified dollar value
        - Medium — directionally correct but provides no absolute sizing
        - Policy-pull does not translate directly into volume without confirmed OEM design-wins
      - - Evidence constraint (sizing gap)
        - Independent analyst estimate isolating intelligent-driving SoC sub-segment
        - No public source in reviewed corpus provides standalone TAM in useful terms
        - Cannot be reliably quantified without proprietary market data; treat as a gap
        - Unknown — absence of estimate is itself a diligence finding
        - N/A — no methodology applicable from public sources
        - High confidence in the gap itself; no sizing available
        - This gap drives the recommendation for proprietary market-data acquisition
    notes: >-
      No reviewed public source provides a clean, standalone TAM for China's intelligent-driving SoC sub-segment. Estimates
      above are convergent proxies, not an authoritative market-size figure. Investors should supplement with proprietary
      analyst data (e.g. IHS Markit, IDC automotive semiconductor reports).
