        - Products outside China automotive deployment
        - Same OEM and Tier-1 buyers as above
        - Primary domestic competitive threat; GeniTech must win accounts away from Horizon
    notes: >-
      Boundary centers on chips whose primary design function is L2+ to higher-autonomy ADAS compute in Chinese passenger
      vehicles. Excluded segments (MCU, infotainment) are complementary, not substitutable.
