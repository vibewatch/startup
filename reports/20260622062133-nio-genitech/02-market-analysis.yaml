        - Infotainment SoCs; general AI processors without automotive qualification
        - OEM cost-segment platform teams; Tier-1 domain controller integrators
        - Planned (project 9031e); GeniTech expanding from flagship downward
      - - Automotive SoC software/toolchain ecosystem
        - ADAS compiler stacks; middleware; reference drivers; developer SDKs co-sold with chips
