  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An independent analyst estimate (IHS Markit, IDC, Strategy Analytics) isolating the intelligent-driving SoC
        sub-segment by annual unit volume and revenue in China.
      whyItMatters: >-
        Without a third-party TAM figure, sizing arguments rely on proxies. Investors cannot perform a standard
        market-size validation check and must accept a directional range instead of a quantified opportunity.
      diligencePath: >-
        Commission or purchase IHS Markit Automotive Semiconductor database or equivalent; filter by application tier
        (ADAS compute) and geography (China).
      relatedQuestionRefs:
        - QM001
        - QM023
      relatedTableRefs:
        - TM002

    - type: missing-source
      severity: material
      topic: external-oem-contracts
      missingEvidence: >-
        Confirmed signed supply agreements between GeniTech (or Axera Technology) and any external OEM (Leapmotor,
        Geely, or other) for volume production of M97 or NX9031.
      whyItMatters: >-
        The commercial narrative depends on GeniTech transitioning from captive NIO supplier to external merchant
        semiconductor company. Without a signed deal, the external revenue thesis is entirely unproven.
      diligencePath: >-
        Request term sheets, LOIs, or supply agreements from GeniTech management; verify independently through
        OEM technology procurement contacts.
      relatedQuestionRefs:
        - QM010

    - type: private-evidence-only
      severity: material
      topic: genitech-financials
      missingEvidence: >-
        GeniTech standalone revenue, gross margin, chip ASP, and operating cost structure from any period.
      whyItMatters: >-
        Without financial disclosure, investors cannot model the SoC business unit economics, assess pricing
        competitiveness against Horizon, or estimate time-to-profitability.
      diligencePath: >-
        Request audited or management-account-level GeniTech financials for 2024 and 2025 as part of due diligence;
        estimate ASP from NIO transfer-pricing disclosures if available.
      relatedQuestionRefs:
        - QM027

    - type: missing-source
      severity: material
      topic: city-noa-penetration-rate
      missingEvidence: >-
        Granular city-NOA feature penetration rate by vehicle price tier and OEM from CAAM's NOA report; the
