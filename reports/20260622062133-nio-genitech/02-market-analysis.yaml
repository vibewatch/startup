figures:
  - id: FM001
    title: Market Sizing Pyramid — TAM, SAM, and Constrained SOM
    type: pyramid
    layout: standard
    summary: >-
      Three-layer sizing pyramid illustrating the step-down from China's total NEV market ceiling (TAM) to the intelligent-driving
      SoC sub-segment (SAM) to GeniTech's constrained initial capture (SOM), with explicit evidence caveats at each layer.
    data:
      nodes:
        - id: tam
          label: TAM — China Automotive ADAS Semiconductor Market
          detail: >-
            All ADAS-related chip spend in Chinese passenger vehicles. Ceiling: CAAM 2025 production of 12.9M NEVs;
            2026 forecast ~15M. No standalone dollar figure for the intelligent-driving SoC tier; proxied by Horizon
            scale and vehicle-volume model. Excludes MCU, infotainment, and non-automotive AI.
        - id: sam
          label: SAM — Intelligent-Driving High-Compute SoC Sub-Segment
          detail: >-
            L2+/city-NOA compute SoCs for Chinese passenger vehicles — direct competitive tier for NX9031 and M97.
            Excludes MCU, infotainment, and general AI. Constrained to domestic China; no reliable public SAM figure;
            proxied by Horizon Robotics OEM penetration (30+ brands, 230+ models, 5M+ chips shipped).
        - id: som
          label: SOM — GeniTech Captive + Near-Term External Opportunity
          detail: >-
            Confirmed floor: NIO/ONVO internal fleet (~300K+ units/yr at Q1 2026 run rate, ET9 + ONVO L90 confirmed).
            External OEM pipeline (Leapmotor, Geely conversations) is unconfirmed as of 2026-06-22; M97 production
            commitment expected earliest 2027–2028 given 18–36 month qualification cycle.
    approximationNotes: >-
      All sizing figures are approximations based on volume proxies. No authoritative standalone intelligent-driving SoC
      market-size figure exists in the public corpus reviewed. TAM and SAM layers are directional; SOM is bottom-up from
      confirmed NIO/ONVO deployment volumes only.
