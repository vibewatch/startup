  - id: FM002
    title: Market Estimate Range — Intelligent-Driving SoC Annual Market Size Proxies
    type: range
    layout: standard
    summary: >-
      Low, base, and high proxy estimates for the annual intelligent-driving SoC market in China using different sizing
      methodologies, showing the evidence-constrained spread rather than a single authoritative figure.
    data:
      items:
        - label: Vehicle-volume low estimate (conservative NEV mix)
          low: 500
          mid: 800
          high: 1200
          unit: USD million / year
          basis: >-
            12.9M NEVs × 20% L2+/city-NOA attach rate × $150–200 per chip ASP (estimated). Conservative attach and ASP.
          source: SM022
        - label: Vehicle-volume base estimate (rising feature penetration)
          low: 1000
          mid: 1800
          high: 2800
          unit: USD million / year
          basis: >-
            15M forecast 2026 NEVs × 35% L2+ attach × $180 ASP. Consistent with CAAM NOA expansion trajectory.
          source: SM023
        - label: Horizon Robotics proxy (incumbent revenue floor)
          low: 300
          mid: 600
          high: 900
          unit: USD million / year
          basis: >-
            Horizon 5M+ chips shipped (multi-year); Journey 6 ramp to 10+ OEM brands in 2025–26. Revenue inferred; not
            publicly disclosed. Lower bound assumes ~$100 ASP; upper bound ~$180 ASP.
          source: SM016
        - label: NIO/ONVO captive SoC value (USD M/yr, floor estimate)
          low: 30
          mid: 60
