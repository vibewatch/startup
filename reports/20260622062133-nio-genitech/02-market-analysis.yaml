callouts:
  - calloutType: risk
    title: Export Controls Bind GeniTech to the Domestic China Market
    body: >-
      The AEI think-tank report and the June 2026 U.S. Commerce Department notice make clear that Chinese ADAS chip makers
      face near-complete regulatory exclusion from Western markets. GeniTech's near-term TAM is therefore bounded by China's
      domestic NEV market. This is a large market, but the geopolitical ceiling is an important constraint on long-term
      valuation multiples relative to a globally addressable semiconductor company.
    claimRefs:
      - CM038
      - CM039
      - CM040

  - calloutType: insight
    title: No External Supply Agreement Confirmed — Customer Traction Remains Pipeline
    body: >-
      As of 2026-06-22, all reported external OEM customer engagement (Leapmotor, Geely) is unconfirmed in public filings.
      The gap between active commercial conversations and a signed supply agreement is meaningful: the 18–30 month
      qualification cycle means even a signed LOI today would not translate to production revenue until 2027–2028.
      Diligence should prioritize confirming named LOIs and advancing those to term-sheet status.
    claimRefs:
      - CM021
      - CM024
      - CM035

  - calloutType: strength
    title: Export Controls Create Structural Domestic Demand Pull
    body: >-
      The same policy environment that limits GeniTech's export opportunity creates a structural tailwind domestically.
      Chinese OEMs that currently rely on Nvidia Drive platforms face genuine supply risk under the current export-control
      regime. GeniTech — with a mass-produced 5nm chip already deployed in NIO/ONVO vehicles — is one of a very small
      number of credible domestic alternatives at the performance tier that matters for city-NOA applications.
    claimRefs:
      - CM029
      - CM030
      - CM031
      - CM033

