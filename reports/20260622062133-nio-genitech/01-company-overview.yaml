- id: product-milestones-and-external-strategy
  title: Product milestones, external strategy, and competitive positioning
  body: >-
    The Shenji NX9031 is the company's primary product to date. NIO introduced it publicly at NIO Day on 2023-12-21 alongside the ET9 reveal, announced a successful tape-out at NIO IN 2024 (July 2024), and subsequently confirmed mass production and delivery alongside the ET9 launch. Third-party technical analysis characterizes the NX9031 as featuring 256 TOPS of computing power, LPDDR5 memory, and full sensor-fusion support for autonomous-driving workloads, using TSMC's 5nm process. NIO positions it as the world's first mass-produced 5nm automotive-grade AD chip. The chip's initial deployment scope has since expanded: in April 2026, ONVO (NIO's mass-market sub-brand) confirmed that the 2026 L90 SUV update would be equipped with the NX9031, extending deployment beyond the flagship ET9 to a higher-volume vehicle line.


    The strategic inflection point came in November 2025, when multiple media outlets reported that NIO had begun external technical licensing of the NX9031. CarNewsChina described this as marking a transition from a captive-development model to a commercial semiconductor business — generating revenue from third parties rather than treating the chip purely as a cost center. By March 2026, CnEVPost reported that GeniTech and its partner Axera Technology were pitching the next-generation M97 chip (> 700 TOPS) to Leapmotor and Geely as potential external OEM customers. IT之家 and 36kr reported in March 2026 that the M97 had already successfully taped out and was anticipated for public release in Q3 2026.


    The M97 development reveals GeniTech's commercial targeting logic: its computing power is designed to exceed Horizon Robotics' Journey J6P (560 TOPS), the dominant domestic benchmark for high-end ADAS. A second, lower-end chip (project code 9031e) is reportedly in planning to compete with Horizon's J6M at the mass-market tier, suggesting GeniTech intends a tiered portfolio rather than a single flagship chip. As of 2026-06-22, no supply agreements with any external OEM — Leapmotor, Geely, or otherwise — have been confirmed in public disclosures. That gap is meaningful: the commercial story rests heavily on announced intent rather than contracted revenue.


    ofweek.com characterizes GeniTech as China's first 5nm automotive semiconductor company in standalone form, a positioning that NIO and GeniTech have not explicitly adopted in their own official materials but that third-party coverage has amplified. The full-stack narrative on NIO's own Innovation page frames the NX9031 within a broader capability stack (OS, AI, battery, chip), reinforcing that the chip is intended as a strategic anchor within NIO's product ecosystem, not merely a cost-reduction play. Later chapters covering technology and competitive landscape should revisit these positioning claims against actual OEM traction.
