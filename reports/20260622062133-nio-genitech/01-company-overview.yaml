callouts:
- calloutType: insight
  title: Chip spinout is a structural value-unlock play, not just a cost move
  body: >-
    By separating the chip function into a legal entity capable of outside equity, NIO achieves dual objectives: it accesses capital to defray the extraordinary NX9031 development cost that William Li publicly acknowledged, and it creates a tradeable valuation stake that Morgan Stanley flagged as a potential NIO re-rating catalyst. The 62.7% majority retention means NIO keeps strategic and product control while externalizing some financial risk.
  claimRefs:
  - CO006
  - CO007
  - CO024
  - CO027
  - CO028
  - CO038
- calloutType: risk
  title: Investor anonymity and governance opacity create material diligence blind spots
  body: >-
    The 27.3% investor bloc is unnamed in all public disclosures, making it impossible to assess strategic conflicts, OEM pre-commitment, or state-policy alignment from open sources. Combined with the absence of board composition, CFO identity, and ESOP vesting terms at the GeniTech level, diligence on governance quality must rely on the parent NIO's Form 20-F and group IR materials rather than standalone subsidiary disclosure.
  claimRefs:
  - CO026
  - CO033
  - CO035
  - CO041
- calloutType: risk
  title: Valuation discrepancy between Yicai and transaction math should not be silently normalized
  body: >-
    Yicai Global's USD 1.5B figure and the ~RMB 8.27B implied by transaction math differ by roughly 30%. Both figures are media-reported rather than audited. Any downstream valuation analysis in later chapters must preserve this uncertainty band and avoid using one figure as settled fact.
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO041

