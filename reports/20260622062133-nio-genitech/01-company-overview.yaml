  rows:
  - - 'NIO Inc. (NYSE: NIO; HKEX: 9866; SGX: NIO)'
    - Ultimate parent; majority shareholder at 62.7% post-round
    - Operational control, technology IP, and primary deployment customer for NX9031; strategic direction determined at parent level.
    - Official NIO press release; NIO Q1 2026 financial results; NIO Full Stack page.
    - Confirm NIO's chip IP licensing terms, inter-company pricing, and parent-subsidiary contract arrangements.
  - - Anonymous Chinese investor consortium (27.3%)
    - External equity investors; first-round consortium collectively hold 27.3%
    - Potential strategic alignment unknown without identity; combined check size implies RMB ~615M at implied valuation.
    - Official NIO press release describes 'several Chinese investors' without naming any.
    - Request investor identity, fund type (strategic vs. financial), board rights, and any commercial agreements bundled with the equity stake.
  - - ESOP pool (10%)
    - Employee equity incentive reserve
    - Retains and aligns management and engineering talent in a competitive semiconductor job market.
    - Disclosed in official NIO press release as a 10% pool.
    - Obtain vesting schedule, grant recipients (management vs. broad employee), and exercise terms.
  - - NIO ONVO (sub-brand)
    - Internal deployment customer for NX9031
    - ONVO 2026 L90 confirms first cross-brand NIO chip adoption; signals internal revenue generation path within NIO group.
    - CnEVPost coverage of ONVO L90 chip confirmation (April 2026).
    - Clarify transfer pricing for intra-group chip supply; whether ONVO counts as external revenue for GeniTech reporting.
  - - Axera Technology (爱芯元智)
    - Joint development partner for the M97 chip
    - Co-development reduces GeniTech's standalone R&D risk for the mid-range product tier; Axera contributes IP and design capacity.
    - 36kr and CnEVPost report the M97 partnership.
    - Clarify the IP split, exclusivity period, and commercialization rights for the M97 chip.
  - - Leapmotor (零跑汽车)
    - Prospective external OEM customer
    - China's fourth-largest NEV brand by volume; adoption would establish first external revenue reference.
    - CnEVPost (March 2026) reports GeniTech and Axera approached Leapmotor.
    - Confirm whether negotiations are active; identify chip model being pitched and timeline.
  - - Geely Auto Group (吉利汽车)
    - Prospective external OEM customer
    - Major global OEM with high-volume platforms; a Geely design-win would be a step-function market validation.
    - CnEVPost (March 2026) reports GeniTech and Axera approached Geely.
    - Confirm whether a term sheet or letter of intent exists; identify which Geely sub-brand or platform is targeted.
  notes: Ownership percentages are based on the official NIO press release. Investor identities are unknown; all investor rows reflect disclosure gaps.
