  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investor-identities
    missingEvidence: Names, fund types, check sizes, and any board-observer or governance rights of the 27.3% investor bloc in the February 2026 round.
    whyItMatters: Without investor identities, diligence cannot assess strategic conflicts with OEM customers, state-policy alignment, or control dynamics post-investment.
    diligencePath: Request full cap table and shareholder agreement from management; cross-reference with SAMR public filings once available.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: GeniTech standalone revenue, gross margin, operating cost, and headcount for any period since incorporation.
    whyItMatters: Without standalone financials, the chip business cannot be valued independently or compared against domestic peers. It is currently invisible in NIO's consolidated reports.
    diligencePath: Request audited subsidiary financial statements from management; monitor NIO Group filings for any segment-level disclosure of the chip business.
    relatedQuestionRefs:
    - QO021
    - QO025
    relatedTableRefs:
    - TO001
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Reconciliation of Yicai's USD 1.5B valuation with the ~RMB 8.27B (~USD 1.13B) transaction-math figure; confirmation of which reflects pre-money vs. post-money and whether convertible instruments affect the denominator.
    whyItMatters: A ~30% valuation discrepancy in the first public round creates ambiguity for any subsequent financing, secondary market pricing, or comparable analysis.
    diligencePath: Obtain the term sheet; clarify pre-money vs. post-money convention; request confirmation from both NIO IR and any named transaction advisor.
    relatedQuestionRefs:
    - QO006
    - QO007
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, independent directors, audit committee, compensation committee, and any governance rights attached to investor equity at GeniTech.
    whyItMatters: External investors now own 27.3% of a capital-intensive, technically complex semiconductor company with no public governance disclosure; oversight structure is unknowable from open sources.
    diligencePath: Review GeniTech's articles of association and investor rights agreements; confirm whether NIO's group audit committee covers subsidiaries.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: OEM-contracts
    missingEvidence: Signed supply or licensing agreements with Leapmotor, Geely, or any other external automaker.
    whyItMatters: External revenue is the key test of whether the spinout can generate returns independent of NIO's internal consumption; without signed deals, the external business remains aspirational.
    diligencePath: Monitor company and OEM press releases; request commercial pipeline disclosure in management presentations; track filings for any first-party revenue disclosure.
    relatedQuestionRefs:
    - QO014
    - QO015
    relatedTableRefs:
    - TO003
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-position
    missingEvidence: Comparative analysis of GeniTech / NX9031 against Black Sesame A1000, Horizon J6P/J6M, Mobileye EyeQ6, and Qualcomm Ride Flex across TOPS, power, OEM wins, and pricing.
    whyItMatters: GeniTech's 256 TOPS NX9031 is technically below the Horizon J6P (560 TOPS); the competitive differentiation case requires more than process-node claims.
    diligencePath: Compile competitive product specs from public datasheets and analyst reports in a dedicated competitive-landscape chapter.
    relatedQuestionRefs:
    - QO016
    - QO024
  - type: private-evidence-only
    severity: minor
    topic: ESOP-terms
    missingEvidence: ESOP vesting schedule, grant date, exercise price, and recipient categories (executives vs. broad employee base) for the 10% option pool.
    whyItMatters: ESOP terms determine management retention power and dilution exposure for outside investors; without them, the 27.3% economic stake is imprecisely defined.
    diligencePath: Request management equity plan documentation; review for any filings that disclose option grants once GeniTech has independent reporting obligations.
