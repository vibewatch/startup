  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: external-commercialization
      missingEvidence: >
        A publicly confirmed signed external OEM supply or licensing agreement for the
        Shenji NX9031 chip from any non-NIO-group customer, including contract value,
        delivery timeline, and named OEM.
      whyItMatters: >
        Without at least one confirmed external customer, GeniTech's investment thesis as
        an independent commercial semiconductor supplier is unvalidated. The entire
        external revenue growth narrative depends on this conversion.
      diligencePath: >
        Monitor GeniTech and NIO press releases, Chinese EV trade press (CnEVPost,
        CarNewsChina), and targeted outreach to Leapmotor and Geely IR teams for any
        supply agreement disclosure. Request under NDA from management if possible.
