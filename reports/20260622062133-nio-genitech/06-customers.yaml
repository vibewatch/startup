  - id: named-customer-proof
    title: Named Customer Proof and Deployment Evidence
    body: |
      The most firmly evidenced customer deployment for GeniTech is the NIO ET9 flagship
      sedan, which became the first vehicle to carry the Shenji NX9031 5nm autonomous driving
      chip in mass production from its March 2025 delivery launch. NIO's official product page
      and multiple independent news outlets confirmed the integration at production scale.
      This constitutes the strongest available customer proof: a confirmed in-production
      deployment backed by official company communications and independent trade reporting.
      In April 2026, CnEVPost reported that the 2026 ONVO L90 SUV update was confirmed to
      equip the NX9031 chip and the NIO World Model—marking the second NIO-group platform and
      the first mass-market vehicle to receive the chip, accelerating intra-group penetration
      of the semiconductor into higher-volume segments.

      Beyond these captive deployments, the evidence base for external customers is thin.
      GeniTech began external technical licensing of the NX9031 chip as of November 2025
      (reported by CarNewsChina), and a March 2026 CnEVPost report cited Leapmotor and
      Geely as targets of outreach—but neither company has publicly confirmed any agreement.
      Industry-level claims that NIO has opened its automotive-grade chip to global partners
      lack named confirmation from any such partner. The absence of a signed external OEM
      announcement as of June 2026 constitutes a material evidence gap for investors
      evaluating external revenue durability.

      Benchmark context illustrates the gap: Mobileye announced design wins from a second
      top-10 global automaker for its Surround ADAS platform and serves more than 50 OEM
      brands globally; Horizon Robotics discloses 27 global OEM customers across 42 brands
      with over 400 design-win vehicle models. These peers establish what credible external
      customer proof looks like at scale, against which GeniTech's zero confirmed external
      production customers is a clear diligence gap.
