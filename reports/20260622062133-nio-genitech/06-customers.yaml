callouts:
  - calloutType: risk
    title: Near-Total Customer Concentration to NIO Group
    body: >
      All confirmed GeniTech chip deployments are to captive NIO group vehicles (ET9 in
      production, ONVO L90 in confirmed deployment path). No external OEM supply or
      licensing contract has been publicly confirmed as of June 2026. This creates near-total
      revenue concentration to a single customer group whose own financial performance
      (NIO Inc. carries persistent net losses) directly determines GeniTech's chip volume.
    claimRefs:
      - CU002
      - CU015
      - CU039
      - CU040

  - calloutType: insight
    title: Vehicle Program Lifecycle Is the Primary Retention Proxy
    body: >
      In the absence of disclosed NRR, GRR, or churn data, the vehicle platform program
      lifecycle (typically 5–7 years per automotive chip design win) is the most relevant
      durability signal. The ET9 and ONVO L90 commits create multi-year captive chip demand
      that is structurally sticky, as mid-cycle chip substitution would require full
      platform recertification. This stickiness is real but unvalidated and does not
      substitute for the external customer diversification that would de-risk the
      concentration exposure.
    claimRefs:
      - CU038
      - CU039
      - CU040
      - CU041

