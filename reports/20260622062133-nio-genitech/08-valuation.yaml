callouts:
  - calloutType: recommendation
    title: "Recommendation: Research-More / Track"
    body: >
      Nio GeniTech's strategic position — first domestic automotive-grade 5nm chip in mass
      production, export-control tailwind, and captive NIO/ONVO deployment — is real and
      well-documented. The evidence gaps are equally real: no standalone revenue, no external
      design wins, no audited financials, and a valuation (RMB 8.27B ~USD 1.13B) that is fully
      priced relative to the available public proof. The practical posture is to monitor actively
      and escalate to a priced commitment only when at least two of the following are satisfied:
      (1) standalone audited revenue above RMB 300 million; (2) at least one confirmed external
      non-NIO OEM design win; (3) cap table and preference waterfall disclosed.
    claimRefs:
      - CV041
      - CV042
      - CV045

  - calloutType: risk
    title: Valuation Discrepancy Caveat
    body: >
      The official transaction math implies approximately RMB 8.27 billion (~USD 1.13–1.15 billion)
      post-money. Yicai Global's June 2026 headline cited "near USD 1.5 billion." This discrepancy
      of roughly 30% is unresolved in the public record. Investors should not use the USD 1.5 billion
      figure for entry-price or return calculations without independent verification of the
      exchange rate, tranche structure, or any subsequent mark-up.
    claimRefs:
      - CV003
      - CV004
      - CV043

  - calloutType: assumption
    title: Revenue Inference Limitation
    body: >
      All revenue-based valuation multiples in this chapter are estimates derived from NIO consolidated
      filings and comparable company benchmarks. No standalone audited revenue for Nio GeniTech is
      publicly available. Readers should treat all revenue assumptions as illustrative scenario
      inputs rather than disclosed facts.
    claimRefs:
      - CV006
      - CV024
      - CV035

