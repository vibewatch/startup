  - id: comparable-benchmarks
    title: Comparable Benchmarks and Market Context
    body: |
      A direct EV/Sales or EV/EBITDA multiple comparison between Nio GeniTech and any public
      comparable is not supportable given the absence of standalone GeniTech revenue disclosure.
      What follows is a directional benchmarking exercise that situates GeniTech in the landscape
      of its listed peers and global automotive semiconductor leaders, and draws on their disclosed
      financials for order-of-magnitude context.

      In the Chinese domestic ADAS chip market, Horizon Robotics (HKEX: 9660) is the most directly
      comparable company: a China-based automotive AI chip designer with confirmed mass-production
      partnerships across more than ten OEMs, listed on HKEX with publicly disclosed revenues. Its
      listing provides a public market reference for how investors price a domestic Chinese ADAS
      chip company with demonstrated OEM diversification. Black Sesame International (HKEX: 2533)
      reported FY2024 revenues of approximately RMB 453 million (~USD 62 million) in its 2025
      annual report and is listed at a discount to its peak IPO valuation, illustrating that public
      market appetite for pre-profit ADAS chip companies in China can be fickle. These two comps are
      the most informative because they reflect the same customer base, process node range, and
      export-control environment.

      Globally, Qualcomm's Snapdragon Digital Chassis segment reported automotive revenue of
      approximately USD 1.5 billion in Q1 FY2026 alone, with a confirmed design win pipeline across
      major OEMs worldwide — providing a context reference for ADAS chip revenue at commercial
      scale. NXP Semiconductors reported automotive revenues of approximately USD 2.6 billion in
      FY2024, demonstrating the revenue base achievable by a diversified automotive semiconductor
      leader. Renesas Electronics generated FY2025 revenues of approximately JPY 1.3 trillion
      (~USD 8.5 billion, automotive-exposed) and, like NXP, illustrates the long time horizon to
      reach automotive chip profitability at scale. Mobileye's EyeQ platform, with over 30 OEM
      customers globally, represents the benchmark for achieved ADAS chip market penetration in
      the West.

      The appropriate valuation framing is: GeniTech at ~USD 1.13–1.15 billion post-money (official
      math) is priced well above Black Sesame (public market post-IPO) and below Horizon Robotics
      (where the HKEX market provides a reference), on zero disclosed external revenue. If GeniTech
      achieves external design wins and reaches RMB 400-600 million in revenue by 2027, comparable
      multiples of 4–8x would support a valuation of USD 0.9–1.3 billion — consistent with the
      current mark. The risk-adjusted expectation is that the current valuation is fully priced to
      moderately rich given the evidence gaps.
