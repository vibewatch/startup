chapter:
  number: 8
  title: Valuation
  summary: >
    Nio GeniTech's February 2026 external financing implies a post-money valuation of approximately
    RMB 8.27 billion (~USD 1.13–1.15 billion), while Yicai Global's June 2026 headline framed the
    round "near USD 1.5 billion" — a gap that likely reflects exchange-rate framing, undisclosed
    second-tranche mechanics, or media rounding rather than a fundamental disagreement on terms. Either
    way the valuation is high relative to public evidence: GeniTech has no disclosed standalone revenue,
    no audited subsidiary financials, no confirmed external design wins, and captive dependency on NIO
    and ONVO that likely exceeds 90% of its revenue base. The strategic thesis — first domestic
    automotive-grade 5nm chip, export-control tailwind, NIO captive scale — is real and well-documented.
    The evidence gaps are equally real. The practical recommendation is research-more / track, with
    escalation to a buy call only upon external OEM design-win confirmation and standalone financial
    disclosure.

sections:
  - id: financing-context-and-valuation-discrepancy
    title: Financing Context and Valuation Discrepancy
    body: |
      Nio GeniTech (formally Anhui Shenji Technology, GeniTech Co., Ltd.) closed its first external
      equity financing round on February 26, 2026, raising RMB 2.257 billion ($330 million) from
      several undisclosed Chinese investors. Following the transaction, a NIO Inc. subsidiary retains
      62.7% controlling ownership. CNEVPost and the NIO Inc. investor-relations filing both place the
      implied post-money valuation at approximately RMB 8.27 billion, equivalent to roughly
      USD 1.13–1.15 billion at prevailing 2026 exchange rates (approximately CNY 7.15–7.28 per
      USD). The post-money math is consistent with the stated share: RMB 2.257 billion injected
      for approximately 27.3% of the entity implies RMB 8.27 billion total post-money.

      Yicai Global, in an article published on the same date as this report (June 22, 2026), framed the
      round as bringing GeniTech "near USD 1.5 billion" valuation. No source independently
      reconciles the USD 1.5 billion figure with the official RMB 8.27 billion number. Three
      explanations are plausible: a more favorable exchange rate assumption (CNY ~5.5/USD,
      implying pre-2023 rates), a headline rounding of a subsequent mark-up, or an undisclosed
      second-tranche commitment. Until the discrepancy is resolved through a data-room review or
      a subsequent NIO filing, both figures should be held as bracketing estimates: the
      transaction-math floor is ~USD 1.1–1.15 billion and the Yicai-framed ceiling is ~USD 1.5 billion.

      Morgan Stanley flagged the external financing as a potential NIO re-rating catalyst, noting that
      the chip subsidiary's value had previously been invisible on the parent's consolidated balance
      sheet. NIO's Q1 2026 consolidated revenues were RMB 25,532.7 million ($3,701.5 million) on
      83,465 vehicle deliveries, but no segment-level disclosure for GeniTech exists in any public
      filing, including the FY2024 20-F annual report filed with the SEC in April 2025. The absence
      of any audited standalone financial statement makes all valuation analysis for GeniTech
      necessarily inference-based.
