  - id: recommendation-diligence-and-kill-triggers
    title: Recommendation, Diligence Asks, and Thesis-Break Triggers
    body: |
      The practical recommendation for Nio GeniTech is research-more / track. The strategic
      investment case — domestic 5nm flagship chip, captive deployment at NIO/ONVO scale,
      export-control tailwind, and a disclosed external-partner openness — is well-grounded.
      The evidence gaps are equally material: no standalone audited revenue, no confirmed external
      design wins, weak governance disclosure, and a valuation that is fully priced to moderately
      rich relative to the public proof available. The risk rating is high, reflecting captive
      customer concentration, foundry exposure, NIO parent financial dependency, and governance
      opacity.

      The confidence in this recommendation is low-to-medium: the intelligence base from NIO
      consolidated filings, media coverage, and comparable company data is extensive, but the
      critical variables (GeniTech revenue, cap table, external pipeline) are private. A single
      data-room session with audited standalone financials and external OEM design-win confirmation
      would move the call materially toward buy or avoid.

      Six diligence asks are blocking before any priced investment decision. The most critical
      are: (1) standalone audited GeniTech financial statements for FY2024 and FY2025; (2) full
      cap table and preference waterfall, including the specific identity and economics of the
      February 2026 investors; (3) external OEM design-win pipeline, naming prospects and
      stage of commercial negotiation; (4) TSMC supply agreement terms, volume commitments, and
      any alternative foundry arrangements; (5) inter-company transfer pricing policy between
      GeniTech and NIO parent for captive chip supply; and (6) governance and corporate structure,
      including any VIE arrangements or offshore holding-company layers.

      Thesis-break triggers are monitored on a quarterly cadence: a down-round financing event
      at GeniTech is the definitive overvaluation signal; failure to announce any external OEM
      design win by end-2026 eliminates the bull case; a formal TSMC supply restriction citing
      GeniTech would materially impair the technology moat; NIO parent going-concern language in
      any 20-F or quarterly filing would jeopardize captive revenue; and any adverse governance
      disclosure (dilutive preference stack, related-party self-dealing) would compromise the
      investment thesis entirely.
