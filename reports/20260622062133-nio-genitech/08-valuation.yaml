  - id: bull-base-bear-scenarios
    title: Bull / Base / Bear Scenarios and Sensitivity Analysis
    body: |
      Three scenarios frame the range of outcomes for Nio GeniTech through 2027–2028, each with
      explicit revenue, multiple, and valuation assumptions. All scenarios use USD 1.13 billion
      as the February 2026 entry price baseline (official transaction math).

      Under the bull scenario, GeniTech announces confirmed design wins with three or more external
      OEMs by end-2026, translating to revenues of RMB 1.5 billion or more by 2028. Applying a
      revenue multiple of 8–12x (consistent with high-growth domestic ADAS chip companies with
      demonstrated OEM diversification), the implied valuation reaches USD 1.8–3.0 billion. Entry
      at USD 1.13 billion would represent 1.6x–2.7x return. Key enabling conditions: TSMC supply
      continuity, NIO parent financial stability, and rapid conversion of technical openness to
      commercial contracts. Probability signal: low-to-medium (15–25%), given that no external
      adoption is confirmed and Horizon Robotics holds the dominant market position.

      Under the base scenario, GeniTech remains primarily a captive NIO/ONVO supplier through
      2027 with at most one external OEM design win. Revenues are inferred at RMB 300–600 million,
      reflecting captive supply pricing with limited external premium. At 4–8x revenue multiples,
      implied valuation of USD 0.9–1.3 billion is roughly consistent with the February 2026
      entry price — meaning no material upside, but also no catastrophic loss assuming NIO parent
      financial stability. Probability signal: medium-to-high (50–60%).

      Under the bear scenario, no external wins materialize, NIO parent financial pressure reduces
      captive volumes or forces unfavorable transfer pricing, and TSMC supply is constrained by
      export control enforcement. Revenue falls below RMB 200 million. At 3–5x multiples
      (reflecting a single-customer captive supplier discount), implied valuation falls to
      USD 0.3–0.6 billion — representing 60–75% downside from entry price. Probability signal:
      lower but non-trivial (20–30%).

      The key scenario variable is not the total addressable market (which is demonstrably large
      as evidenced by Qualcomm and NXP revenue trajectories) but the conversion of the NX9031's
      5nm technical advantage into commercial commitments from non-NIO OEMs. A single confirmed
      design win announcement would materially shift the bull probability and justify re-pricing.
