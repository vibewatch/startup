      - number: '2.2'
        title: Market Sizing — Multiple Lenses and Evidence Constraints
        blocks:
          - type: paragraph
            body: >-
              No public analyst report in the reviewed corpus provides a clean, standalone TAM for the Chinese
              intelligent-driving SoC sub-segment in the terms most useful for sizing GeniTech's opportunity.
              Accordingly, this chapter builds the sizing case from five converging lenses: the macro NEV vehicle volume
              base, L2+/city-NOA feature penetration rates, Horizon Robotics' disclosed scale as an incumbent proxy, S&P
              Global's automotive semiconductor self-reliance analysis, and NIO/ONVO's internal deployment trajectory.
              Each lens provides a partial estimate; together they bracket a plausible addressable range without
              pretending to a single headline number.

              The vehicle-volume lens is the strongest anchor. CAAM reported that China produced 31.3 million vehicles
              in 2025, of which 12.9 million were NEVs — a penetration rate exceeding 40% of new car sales. CAAM's
              January 2026 conference forecast approximately 15 million NEV sales for 2026. Because L2+ ADAS compute is
              essentially standard on Chinese NEVs above approximately RMB 150,000, the addressable fleet for
              high-compute SoCs is already in the millions of units per year and growing. The city-NOA feature — urban
              highway-assist requiring substantially more compute than basic L2 camera/radar fusion — is the tier where
              premium SoCs like NX9031 compete most directly, and CAAM's dedicated NOA report released in January 2026
              confirms this feature tier is expanding across vehicle price bands.

              The incumbent proxy lens uses Horizon Robotics as a disclosed reference. Horizon has reported shipping
              chips to over 30 OEM brands covering more than 230 vehicle models; its Journey 6 series is in
              mass-production partnerships with over 10 OEMs. That scale implies a multi-billion RMB annual chip revenue
              run rate at automotive SoC pricing, though Horizon does not publicly break out per-chip ASPs. S&P Global's
              September 2025 analysis of China's automotive industry semiconductor self-reliance explicitly frames the
              sub-segment as a strategic priority with expanding domestic investment.

              NIO's internal deployment is the smallest but highest-confidence lens. NIO delivered 83,465 vehicles in Q1
              2026, with the ET9 (NX9031 equipped) confirmed in deliveries. ONVO's updated L90 adding the NX9031 in
              April 2026 extends the chip into a higher-volume, lower-price-point line. These internal deployments form
              GeniTech's captive initial market — a defined revenue floor before any external supply agreement is
              signed.

              The key evidence constraint is that no source reviewed provides a bottom-up SoC unit price or market-size
              figure that isolates the intelligent-driving compute tier from total automotive semiconductor spend.
              Investors should treat the sizing as a constrained estimate bracketed by the vehicle-volume ceiling and
              the Horizon proxy floor, not as a third-party validated TAM.
            claimRefs:
