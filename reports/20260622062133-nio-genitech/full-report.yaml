      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: Research-More / Track'
            body: >
              Nio GeniTech's strategic position — first domestic automotive-grade 5nm chip in mass production,
              export-control tailwind, and captive NIO/ONVO deployment — is real and well-documented. The evidence gaps
              are equally real: no standalone revenue, no external design wins, no audited financials, and a valuation
              (RMB 8.27B ~USD 1.13B) that is fully priced relative to the available public proof. The practical posture
              is to monitor actively and escalate to a priced commitment only when at least two of the following are
              satisfied: (1) standalone audited revenue above RMB 300 million; (2) at least one confirmed external
              non-NIO OEM design win; (3) cap table and preference waterfall disclosed.
            calloutType: recommendation
            claimRefs:
              - CV041
