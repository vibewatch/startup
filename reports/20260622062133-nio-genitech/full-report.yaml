  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Nio GeniTech's relevant market is the Chinese intelligent-driving and automotive-compute SoC segment: the
              narrow slice of automotive semiconductors where chips provide the primary compute for L2+ advanced
              driver-assistance, city NOA (navigate-on-autopilot), and future higher-autonomy functions in passenger
              vehicles. This is emphatically not the whole semiconductor market, not battery management ICs, not
              in-cabin infotainment processors, and not general-purpose AI accelerators. The boundary is defined by
              function: a chip qualifies when its primary design target is processing camera, lidar, radar, and map
              inputs to make real-time vehicle-control or driver-guidance decisions at automotive-grade reliability.
              GeniTech's NX9031 — a 5nm chip delivering 256 TOPS of ADAS compute, currently deployed in the NIO ET9 and
              ONVO L90 — sits squarely inside this boundary. The planned M97 (> 700 TOPS, co-developed with Axera
              Technology) and a lower-end 9031e targeting 128 TOPS suggest a tiered portfolio aimed at covering both the
              premium and mass-market tiers of this same space.

              The most important excluded category is the legacy ADAS microcontroller and domain-controller MCU segment
              served by NXP, Renesas, and Infineon. Those chips handle safety-critical functions such as powertrain
              control and braking at lower compute budgets; they are complementary to, not directly competitive with,
              high-compute SoCs like the NX9031. Also excluded is the infotainment SoC segment (served by Qualcomm
              Snapdragon SA series, MediaTek, Ambarella for imaging) and generic AI accelerators without
              automotive-qualification requirements. The relevant substitutes within the included boundary are: Nvidia
              Drive Orin/Thor platforms (the most widely deployed foreign alternative for flagship ADAS in China),
              Qualcomm Snapdragon Ride (mid-tier), Mobileye EyeQ series (camera-centric ADAS), Horizon Robotics Journey
              6 series (the leading domestic incumbent from a volume-shipment standpoint), and Black Sesame Technologies
              (sub-flagship domestic alternative). The status-quo path for NIO-ecosystem vehicles was precisely this
              kind of foreign-chip dependence, which GeniTech was created to replace. For external OEM customers, the
              primary alternative remains Horizon Robotics or continued use of Nvidia/Qualcomm platforms.

              The adjacent categories — edge AI inference, robotics compute, and data-center AI — share semiconductor
              supply-chain actors but differ in qualification standard, thermal envelope, functional-safety
              certification, and validation process. GeniTech's automotive-grade focus keeps it from being directly
              substitutable by cloud or robotics chips, and vice versa. The market boundary established here is the
              anchor for all sizing, buyer, and driver analysis that follows.
