      - number: '1.2'
        title: Leadership visibility, key-person profile, and governance gaps
        blocks:
          - type: paragraph
            body: >-
              Public leadership identification for GeniTech as a standalone entity is thin. Bai Jian is confirmed as the
              company's legal representative based on industrial registration records cited in Chinese-language media
              (Jiemian, 163.com); he is described as having joined NIO in 2020 in a chip leadership capacity. Beyond
              that appointment, no external CEO announcement, management team page, or governance disclosure exists for
              the GeniTech subsidiary. The entity has not issued a standalone investor-relations page, and the NIO group
              IR site addresses the subsidiary only in the context of the February 2026 financing announcement.


              At the parent level, William Li commands the strategic narrative. He publicly stated at the China EV Top
              100 Forum in 2025 that NX9031's development cost was comparable to building more than ten semiconductor
              fabrication facilities, a statement that simultaneously validates the chip program's technical ambition
              and underscores the extraordinary capital intensity of the NIO approach. That statement appeared in the
              36kr investigative piece (indexed as SO011), which also reported the structural rationale behind the
              spinout — cost discipline, balance-sheet improvement, and external capital leverage.


              Board and governance detail at the GeniTech level is entirely absent from the public record. The official
              NIO press release announcing the RMB 2.257B investment does not name investor representatives,
              board-observer rights, or independent directors. The ESOP pool of 10% is disclosed in percentage terms,
              but the vesting schedule, named recipients, and grant timing are not public. This creates material
              key-person concentration risk: the semiconductor program's institutional knowledge sits primarily with Bai
              Jian and a team that reports inside NIO's broader R&D chain, with no external governance anchors
              verifiable from open sources.


              For diligence purposes, the parent-subsidiary governance relationship is an important frame. NIO's Form
              20-F for fiscal year 2024 (filed 2025-04-08 with the SEC) is the most comprehensive public document
              covering NIO's corporate structure, risk factors, and major subsidiaries, but it predates the formal
              creation of the Anhui Shenji entity and the February 2026 investment closing. Any governance inquiry
              should therefore combine the 20-F corporate-structure sections with the NIO IR financing announcement,
              rather than treating either document as complete on its own.
            claimRefs:
