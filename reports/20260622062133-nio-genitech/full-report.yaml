  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Solution Classes
        blocks:
          - type: paragraph
            body: >-
              The intelligent-driving SoC market presents GeniTech with a layered competitive field rather than a single
              peer set. At the direct domestic-peer level, Horizon Robotics and Black Sesame Technologies are the
              closest category matches: both are China-based, publicly listed on HKEX, and supply intelligent-driving
              SoCs to multiple OEM customers. Horizon's Journey 6 family—J6E, J6M, and J6P—spans a compute range from
              lower-tier L2 ADAS to high-performance L3-capable platforms; the J6E claims up to 560 TOPS and supports
              diverse sensor-fusion configurations. Black Sesame's Huashan A1000 series targets the L2/L2+ ADAS tier,
              manufactured on a 16nm process and deployed by several domestic OEM integrators. Horizon's HKEX prospectus
              disclosed partnerships with more than 40 OEM customers and over 70 automotive supply-chain partners
              globally, making its external ecosystem substantially deeper than GeniTech's as of mid-2026.

              At the global incumbent layer, Mobileye (Intel subsidiary, NASDAQ:MBLY) is the dominant full-stack ADAS
              supplier, combining EyeQ chips, perception software, mapping, and its SuperVision L2+ system. Its EyeQ6 is
              built on a 7nm process and underpins more than 100 global OEM relationships. Qualcomm's Snapdragon Ride
              platform is positioned for scalable cockpit-plus-ADAS integration with multiple global OEM wins announced
              for 2026 production programs. Both global incumbents face structural constraint in China following US BIS
              export-control expansions: new Chinese OEM programs can no longer confidently qualify these chips for
              high-compute autonomous-driving tiers, creating a structural opening for domestic suppliers. NXP and
              Renesas occupy an adjacent but distinct segment—their S32N vehicle integration processors and R-Car V4H
              ADAS SoCs compete on mixed-criticality domain-controller and L2 ADAS use cases rather than high-compute
              neural inference, and function as lower-compute substitutes for buyers whose programs do not require
              GeniTech-class throughput. Internal build (OEM-authored custom silicon) is the remaining option; it is
              rare given the capital and talent requirements, but Huawei HiSilicon Ascend and the Xpeng in-house chip
              program are cited in analyst coverage as potential longer-horizon entrants.
