      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Export control and foundry access is the thesis-break risk
            body: >
              GeniTech's NX9031 production at the 5nm node creates unavoidable TSMC or Samsung foundry dependence. BIS
              export-control rules that already apply to Chinese chip companies, affirmed in June 2026 to cover overseas
              subsidiaries, could be extended to restrict advanced-node foundry services for any entity linked to China.
              No mitigation of this risk is publicly visible. If foundry access is disrupted, GeniTech cannot produce
              chips and has no credible domestic alternative. This is not a tail risk — it is an active policy risk with
              a documented escalation trajectory.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR024
              - CR025
          - type: callout
            title: Customer concentration on NIO group creates dual dependency
            body: >
              NIO Inc. is simultaneously GeniTech's controlling shareholder, primary OEM customer, and financial
              backstop. The chip business earns revenue when NIO sells vehicles; a NIO volume decline or financial
              deterioration simultaneously shrinks GeniTech's top line, weakens its governance independence, and reduces
              its access to parental support. As of mid-2026, the only confirmed non-NIO chip deployment is internal to
              the NIO group (ONVO L90), and external OEM discussions with Leapmotor and Geely are ongoing but not yet
              contracted.
            calloutType: risk
