          - type: callout
            title: Entire financial picture depends on undisclosed transfer pricing
            body: >-
              The largest single risk in the GeniTech financial analysis is that the subsidiary's only confirmed revenue
              stream — chip supply to NIO and ONVO — is priced through an undisclosed related-party transfer
              arrangement. NIO's consolidated financials do not segment this line, and no regulatory filing quantifies
              what GeniTech receives per chip. Until transfer pricing is disclosed, neither the subsidiary's revenue,
              gross margin, nor standalone viability can be assessed from public data.
            calloutType: risk
            claimRefs:
              - CI006
              - CI008
              - CI036
          - type: callout
            title: Export-control risk to TSMC 5nm supply chain is unmitigated
            body: >-
              US BIS export controls on advanced computing semiconductors, extended and clarified in 2026, could
              restrict GeniTech's continued access to TSMC 5nm fabrication or successor nodes required for
              next-generation chip development. GeniTech has not disclosed an alternative foundry arrangement or a
              supply-chain mitigation plan. Any disruption to TSMC access would delay next-generation chip timelines and
              materially impair the external licensing strategy.
            calloutType: risk
            claimRefs:
              - CI031
              - CI032
              - CI033
          - type: callout
            title: Five concrete diligence asks before any investment decision
            body: >-
              Any underwriting decision requires: (1) audited GeniTech standalone financials for at least FY2025; (2)
              transfer pricing documentation for captive NIO/ONVO supply; (3) confirmed external customer pipeline with
              deal-stage detail; (4) investor identity disclosure and governance documents from the February 2026 round;
              and (5) a next-generation chip roadmap with capital requirements. Without all five, the chapter concludes
              that GeniTech is a structurally credible but financially unverifiable investment.
            calloutType: recommendation
            claimRefs:
              - CI037
              - CI040
              - CI041
              - CI042
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              The Shenji NX9031 is an automotive-grade intelligent-driving system-on-chip fabricated on the 5nm process
              node — the first such chip to reach mass production within the Chinese automotive semiconductor industry.
              GeniTech's core product proposition to OEM customers is a fully production-validated compute platform that
              ingests multi-sensor data from cameras, LiDAR, and radar; runs AI inference for perception and planning;
              and delivers driving decisions within NIO's Full Stack software environment. The customer workflow begins
              at the vehicle integration stage: an OEM licenses the NX9031, integrates it with the NIO SkyOS operating
              system and Aquila perception software, and deploys the package in a vehicle connected to NIO's
              over-the-air update infrastructure. The chip's initial captive use in the NIO ET9 flagship sedan — in a
              dual-chip configuration providing approximately 512 TOPS combined — furnishes third-party OEMs with a
              real-vehicle reference deployment they would otherwise have to build independently over years. External
              technical licensing launched in November 2025, converting the chip from an internal NIO R&D asset into a
              commercially available automotive compute platform. As of April 2026, ONVO confirmed the 2026 L90 will
              carry the NX9031, extending deployment to a second brand and increasing volume context for external
              buyers. CnEVPost reported in March 2026 that GeniTech approached Leapmotor and Geely for potential supply
              deals, though no signed agreements have been publicly disclosed. IC-PCB reported that NIO CEO William Li
              publicly opened the NX9031 to global industry collaboration in July 2024, signaling licensing intent ahead
              of the formal spinout of Anhui Shenji Technology.
