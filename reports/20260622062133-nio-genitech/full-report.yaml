      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The GeniTech market has two structurally distinct buyer tracks. The first is captive internal deployment
              within the NIO/ONVO vehicle ecosystem, where GeniTech effectively sells to NIO Inc.'s own vehicle program
              managers and technology teams who make platform decisions on behalf of the ET9 and ONVO product lines.
              Budget ownership in this track sits with NIO's powertrain and technology procurement leadership; the
              adoption trigger was NIO's strategic decision to convert its captive chip program from cost center to
              commercial entity. This track provides immediate revenue and deployment proof, but its scalability is
              constrained by NIO's own vehicle volumes.

              The second track is external OEM supply, where GeniTech and its partner Axera Technology pitch the M97
              chip to third-party OEMs seeking domestic alternatives to Nvidia and Horizon. CnEVPost confirmed in March
              2026 that active conversations are under way with Leapmotor and Geely — two significant-volume OEMs. The
              buyer persona in this track is typically an OEM's platform or powertrain technology team, while budget
              ownership may sit with a combined technology/procurement function or, in the case of intelligent-driving
              strategy, directly with the CEO or CTO given the strategic significance of ADAS platform decisions. The
              adoption trigger for external OEMs is some combination of: (a) export-control or supply security pressure
              pushing them away from Nvidia or foreign chips, (b) cost and customization advantages from a domestic
              alternative, and (c) regulatory alignment with China's ICV (intelligent connected vehicle) policy
              framework.

              A third path — Tier-1 automotive supplier integration — is implied but not confirmed in the public record.
              Traditional Tier-1s such as Bosch, Continental, and Mobileye bundle compute with their own ADAS domain
              controllers. GeniTech could supply chips directly to Tier-1s who then integrate them into complete ADAS
              platforms sold to OEMs. This path is the least documented and longest cycle but potentially the
              highest-volume per deal. The payer in this track is the Tier-1 supplier, while the end OEM effectively
              controls the decision through its ADAS platform sourcing.

              Across all three tracks, the user persona is engineering-level: ADAS system architects, platform
              integration engineers, and validation/software teams who evaluate chip performance, toolchain quality, and
              ISO 26262 / ASIL compliance. The adoption path runs from chip sampling → simulation and HILS testing →
              vehicle integration → regulatory type-approval → production commitment, a cycle typically spanning 18–36
              months. This long cycle means that announced customer conversations today translate to volume production
              at earliest in 2027–2028.
