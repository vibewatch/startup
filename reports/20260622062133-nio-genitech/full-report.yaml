  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Context and Valuation Discrepancy
        blocks:
          - type: paragraph
            body: |
              Nio GeniTech (formally Anhui Shenji Technology, GeniTech Co., Ltd.) closed its first external
              equity financing round on February 26, 2026, raising RMB 2.257 billion ($330 million) from
              several undisclosed Chinese investors. Following the transaction, a NIO Inc. subsidiary retains
              62.7% controlling ownership. CNEVPost and the NIO Inc. investor-relations filing both place the
              implied post-money valuation at approximately RMB 8.27 billion, equivalent to roughly
              USD 1.13–1.15 billion at prevailing 2026 exchange rates (approximately CNY 7.15–7.28 per
              USD). The post-money math is consistent with the stated share: RMB 2.257 billion injected
              for approximately 27.3% of the entity implies RMB 8.27 billion total post-money.

              Yicai Global, in an article published on the same date as this report (June 22, 2026), framed the
              round as bringing GeniTech "near USD 1.5 billion" valuation. No source independently
              reconciles the USD 1.5 billion figure with the official RMB 8.27 billion number. Three
              explanations are plausible: a more favorable exchange rate assumption (CNY ~5.5/USD,
              implying pre-2023 rates), a headline rounding of a subsequent mark-up, or an undisclosed
              second-tranche commitment. Until the discrepancy is resolved through a data-room review or
              a subsequent NIO filing, both figures should be held as bracketing estimates: the
              transaction-math floor is ~USD 1.1–1.15 billion and the Yicai-framed ceiling is ~USD 1.5 billion.

              Morgan Stanley flagged the external financing as a potential NIO re-rating catalyst, noting that
              the chip subsidiary's value had previously been invisible on the parent's consolidated balance
              sheet. NIO's Q1 2026 consolidated revenues were RMB 25,532.7 million ($3,701.5 million) on
              83,465 vehicle deliveries, but no segment-level disclosure for GeniTech exists in any public
              filing, including the FY2024 20-F annual report filed with the SEC in April 2025. The absence
              of any audited standalone financial statement makes all valuation analysis for GeniTech
              necessarily inference-based.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV043
      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: |
              The investment thesis for Nio GeniTech rests on four structural pillars. First, the NX9031 is
              the world's first automotive-grade 5nm intelligent driving chip in mass production, deployed
              in NIO's ET9 flagship sedan and confirmed for ONVO's L90 SUV. This process-node advantage
              was confirmed by NIO CEO William Li in a July 2025 livestream and is independently cited
              by industry media. No domestic Chinese competitor has announced a shipping 5nm automotive
              compute chip, placing GeniTech at the technology frontier for this specific application.
              Second, the export-control environment has structurally increased demand for Chinese-origin
              automotive AI chips: US Bureau of Industry and Security 2026 rules strengthening restrictions
              on advanced semiconductors mean that OEMs in China increasingly cannot source US-origin
              compute chips for ADAS at leading process nodes. Third, the captive NIO/ONVO deployment
              provides a production-proven reference at scale that competing chip companies lack at this
              stage. Fourth, William Li's July 2025 announcement opening the NX9031 to external OEM
              collaboration signals a deliberate pivot toward third-party monetization.

              The anti-thesis is equally structured. No external OEM has publicly confirmed adoption of
              the NX9031. Horizon Robotics, the dominant domestic Chinese ADAS chip company, already has
              confirmed mass-production partnerships with over ten OEMs for its Journey 6 platform; GeniTech
              faces an entrenched competitor with a larger installed base and disclosed revenue. Black
              Sesame International (HKEX: 2533) is also competing in the domestic ADAS chip market with a
              public market track record. The governance disclosure is weak: investor identities from the
              February 2026 round remain undisclosed, no cap table has been published, and NIO's consolidated
              filings provide no GeniTech segment revenue, making it impossible to assess transfer pricing
              or arm's-length commercial viability. Finally, foundry dependency on TSMC 5nm processes creates
              geopolitical exposure that Horizon Robotics, which is also TSMC-dependent, shares but that is
              particularly acute for GeniTech given its 5nm requirement and NIO's China-headquartered
              corporate structure.
