companyProfile:
  summary: >-
    Nio GeniTech, formally Anhui Shenji Technology Co., Ltd., is the automotive-chip subsidiary spun out of NIO to
    commercialize the Shenji NX9031 and follow-on intelligent-driving SoCs. Public evidence confirms a February 2026 RMB
    2.257 billion first external financing round, majority ownership retained by NIO, and deployment of the NX9031 in
    the NIO ET9 and ONVO L90. The strategic appeal is clear: a domestic 5nm flagship chip, tight integration into NIO's
    full-stack autonomous-driving architecture, and potential tailwinds from China's push for semiconductor
    self-reliance. The diligence constraint is equally clear: GeniTech has no standalone audited financials, no
    confirmed external OEM design wins, limited governance disclosure, and unresolved public disagreement over whether
    the February 2026 valuation should be read as roughly USD 1.13B by transaction math or near USD 1.5B by headline
    framing.
  foundedDate: '2025-06-17'
  founders:
    - name: William Li
      role: Strategic sponsor via parent NIO; founder, chairman, and CEO of NIO Inc.
