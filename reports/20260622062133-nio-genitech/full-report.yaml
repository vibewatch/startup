          - type: callout
            title: Valuation Discrepancy Caveat
            body: >
              The official transaction math implies approximately RMB 8.27 billion (~USD 1.13–1.15 billion) post-money.
              Yicai Global's June 2026 headline cited "near USD 1.5 billion." This discrepancy of roughly 30% is
              unresolved in the public record. Investors should not use the USD 1.5 billion figure for entry-price or
              return calculations without independent verification of the exchange rate, tranche structure, or any
              subsequent mark-up.
            calloutType: risk
