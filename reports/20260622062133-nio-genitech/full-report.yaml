        - Zero confirmed non-NIO/ONVO OEM design-win announcements through Dec 2026
        - Bull case eliminated; base case weakened to bear; multiple compression likely
        - Downgrade valuation model to captive-supplier multiple (3–5x); reduce position
      - - TSMC supply restriction on GeniTech
        - Export-control enforcement action or public TSMC statement restricting GeniTech 5nm supply
        - Production pipeline at risk; technology moat eroded; 5nm advantage unavailable
        - Immediate suspension of diligence; assess alternative foundry feasibility
      - - NIO parent going-concern or covenant breach
        - Going-concern language in NIO 20-F or bank-covenant waiver announcement
        - Captive chip demand at risk; GeniTech revenue base may collapse
        - Re-run bear scenario with near-zero captive revenue; likely exit
      - - Adverse governance disclosure
        - >-
          Dilutive preference stack, super-proportionate investor rights, or self-dealing related-party transaction
          revealed
        - Investment thesis compromised; minority shareholder position structurally subordinated
        - Legal review; exit if structure cannot be renegotiated
    notes: >
      Trigger thresholds are analyst-derived from comparable spinoff and semiconductor-investment practice. Monitoring
      cadence recommended quarterly via NIO SEC filings, press releases, industry news, and HKEX Horizon/Black Sesame
      comparables.
    claimRefs:
      - CV040
      - CV041
      - CV044
      - CV032
      - CV033
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Standalone financials
        - Audited GeniTech income statement and balance sheet for FY2024 and FY2025
        - Cannot size captive revenue, gross margin, or cash runway without standalone statements
        - Request from NIO investor relations; require in data room before any pricing decision
      - - Cap table and preference waterfall
        - Full capitalization table showing all shareholders, share classes, preference terms, and liquidation waterfall
        - Cannot assess downside recovery, dilution risk, or investor-rights asymmetry
        - Request directly from GeniTech / NIO CFO; cross-check with Feb 2026 filing disclosures
      - - External OEM design-win pipeline
        - Named non-NIO OEM prospects, stage of commercial negotiation, and expected tape-in / launch timeline
        - Only evidence that can support the bull case; absence confirms base/bear scenario dominance
        - Customer reference calls; engineering partner outreach; press-release monitoring
      - - TSMC supply agreement
        - Terms, volume commitments, pricing, and continuity provisions in GeniTech's TSMC 5nm supply agreement
        - Critical for production risk assessment and cost-of-goods estimation; export-control exposure
        - Request from management; legal review of export-control representations and warranties
      - - Transfer pricing policy
        - Inter-company chip pricing mechanism between GeniTech and NIO parent for captive ET9 / ONVO supply
        - Without arm's-length pricing data, GeniTech's standalone economics cannot be assessed
        - Request from NIO CFO / tax team; review related-party transaction notes in 20-F
      - - Corporate governance and structure
        - Offshore holding-company layers, VIE agreements (if any), board composition, minority-investor rights
        - Determines legal enforceability of investment rights and access to assets in adverse scenarios
        - Independent legal due diligence; review Cayman/BVI entity structure; check SEC filings for related disclosures
    notes: >
      Diligence paths reflect standard semiconductor spinoff diligence practice. None of these evidence items has been
      confirmed as accessible without a formal data-room process. All six are blocking before any priced investment
      recommendation.
    claimRefs:
      - CV006
      - CV007
      - CV034
      - CV042
