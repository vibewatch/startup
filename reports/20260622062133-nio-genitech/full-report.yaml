      - number: '3.2'
        title: Capability Comparison and Buyer Tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The five most operationally significant axes for a Chinese OEM selecting an intelligent-driving SoC in
              2026 are: compute-performance tier, process-node advantage, external OEM track record and
              safety-certification history, developer ecosystem maturity, and pricing transparency. GeniTech leads on
              process node (5nm TSMC, versus Black Sesame's confirmed 16nm and Horizon J6's unconfirmed node) and
              delivers 256 TOPS on the NX9031 per third-party technical analysis. The chip supports full sensor-fusion
              workloads and has been mass-produced for deployment across two NIO-family vehicles. No Chinese domestic
              peer can claim a mass-produced 5nm automotive SoC at this stage.

              Horizon leads on external OEM breadth, with a publicly disclosed partner count of 40+ OEM customers and an
              independently audited financial track record following its HKEX IPO. Its Journey SDK provides a documented
              open-ecosystem integration path that GeniTech has not replicated publicly. Mobileye provides the EyeQ Kit
              SDK and Qualcomm provides a Snapdragon Ride software stack—both with broader documented toolchains than
              GeniTech's current public posture. Black Sesame provides partial development tools but trails Horizon on
              ecosystem maturity. Mobileye's EyeQ6 uses a 7nm process and is competitive on node tier, but is
              effectively inaccessible for new Chinese OEM high-compute programs given US export-control restrictions.

              For an OEM evaluating GeniTech against Horizon specifically, the core tradeoff in mid-2026 is: GeniTech
              brings a superior process node and a NIO-internal deployment proof, but requires accepting an unproven
              external supply track record, an absent publicly evidenced developer SDK, and pricing terms that are
              entirely non-public. Horizon offers a mature external-OEM supply model, a richer SDK, and more financial
              transparency at adequate performance for most L2–L3 programs. For the premium L3+ tier where process node
              matters most, GeniTech's NX9031 is the only domestically sourced option with production validation on 5nm
              silicon. Pricing is undisclosed for all high-performance intelligent-driving SoC suppliers; the comparison
              table marks all price fields explicitly as undisclosed rather than estimating figures.
