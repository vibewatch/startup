chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal footprint, and corporate structure
        blocks:
          - type: paragraph
            body: >-
              Nio GeniTech is the product name applied in English-language communications to what is formally registered
              as Anhui Shenji Technology Co., Ltd. (安徽神玑技术有限公司), using the shorthand "神玑" (Shenji / GeniTech) for both
              the corporate entity and its flagship chip family. The company completed its industrial and commercial
              registration on 2025-06-17, with its registered address at Hengchuang Intelligent Technology Park in
              Hefei's Economic and Technological Development Zone — the same campus NIO uses for its China headquarters.
              That address alignment signals deliberate organizational continuity with the parent rather than an
              arm's-length spinout.


              NIO Inc. (NYSE: NIO; HKEX: 9866; SGX: NIO), the ultimate parent, has articulated a "Full Stack"
              self-developed strategy covering chips, operating systems, AI models, and batteries. The chip function was
              previously embedded within NIO's consolidated R&D organization; the creation of the Anhui legal entity in
              mid-2025 formalized the semiconductor program as a separately governable unit capable of accepting outside
              capital and pursuing external customers. As of 2026-06-22, NIO remains the majority shareholder at 62.7%
              following the first external financing round.


              Bai Jian (白剑) is the registered legal representative of the entity, having joined NIO in 2020 to lead chip
              development. William Li (李斌), NIO's founder, chairman, and CEO, publicly framed the chip spinout as a
              structural reform measure intended to improve NIO's cost profile after multiple loss-making quarters,
              while preserving strategic control. The 2025 annual ESG report and the NIO.com Full Stack page situate
              chip self-development as foundational to NIO's long-term technology moat, but neither document discloses
              GeniTech's standalone headcount, revenue, or operating structure.


              The dual-name convention — Anhui Shenji Technology in Chinese regulatory filings and GeniTech / Shenji in
              product and investor communications — creates a minor disambiguation challenge for downstream diligence.
              Later chapters should use "GeniTech" as the working shorthand while noting the Anhui Shenji legal entity
              for any regulatory or ownership-chain questions. The company's stage as of the run date is best
              characterized as early-commercial and investor-backed subsidiary: it has a mass-produced product, an
              external licensing business, and a first institutional round closed, but no public standalone financial
              disclosure.
