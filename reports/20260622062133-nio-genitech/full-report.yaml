  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Regulatory and legal risk is the most asymmetric part of the GeniTech thesis because it combines a
              high-impact foreign policy vector with a domestic Chinese compliance stack that must be satisfied before
              intelligent-driving chips can scale across OEM programs. On the foreign side, BIS has already tightened
              foundry due-diligence requirements for advanced semiconductors and in June 2026 confirmed that chip
              restrictions can apply to overseas subsidiaries of Chinese companies. Even without a company-specific
              enforcement action, those two facts materially matter to GeniTech because a 5nm automotive chip requires
              access to a leading-edge non-Chinese foundry. If U.S. rules expand to further constrain advanced-node
              manufacturing for Chinese-linked entities, the production risk would be immediate rather than theoretical.


              On the domestic side, the Chinese ICV regime is operationally important rather than cosmetic. The
              four-ministry pilot framework requires vehicle manufacturers and users to apply jointly for admission and
              road-use permission, and the MIIT Q&A clarifies that provincial filing and multi-ministry review are
              required before road deployment. That means GeniTech cannot simply sell a chip to a new OEM and assume
              quick deployment; prospective customers must already hold, or be progressing toward, compliant platform
              status. OTA and cybersecurity obligations deepen the burden because software versioning, qualification,
              and approval become recurring rather than one-time tasks.


              Western political scrutiny creates a third layer. Independent policy research now frames Chinese-origin
              connected and autonomous vehicle components as a national-security issue, which may not produce an
              outright legal ban in every market but can still reduce procurement willingness. Together these factors
              make regulatory risk both broad and active: GeniTech benefits from NIO's current compliance architecture,
              yet its standalone external-market posture remains only partially evidenced.
            claimRefs:
