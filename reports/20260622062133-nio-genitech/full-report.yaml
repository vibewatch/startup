      - number: '7.3'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              GeniTech is best understood as a dense dependency stack rather than a self-sufficient semiconductor
              company. At the bottom of that stack sits advanced-node foundry access. The NX9031's 5nm process node
              strongly implies dependence on TSMC or Samsung because no credible domestic Chinese automotive-grade 5nm
              alternative is publicly visible as of mid-2026. That concentration risk is severe not just because of
              manufacturing scarcity, but because foundry access is mediated by geopolitical policy outside GeniTech's
              control. If the rules tighten, production can stop irrespective of customer demand.


              The next dependency is on the NIO parent group. NIO is not merely an investor; it remains the controlling
              shareholder, the only publicly confirmed volume customer base, and the most plausible financial backstop
              in a downturn. That means GeniTech is exposed to NIO delivery trends, strategy shifts, and financial
              health on multiple channels at once. Customer concentration would be less alarming if external
              diversification were already contracted, but the current evidence only shows outreach to Leapmotor and
              Geely, not signed supply wins.


              Axera introduces a third major node in the dependency graph. The co-development arrangement on M97 reduces
              solo engineering burden, yet it also creates exposure to Axera's execution timing, IP structure, and
              continuity. Beyond these direct partners, GeniTech also depends on Chinese regulatory approvers because
              OEMs need ICV admission and OTA-compliant deployment pathways, and it competes against much
              better-established global and domestic chip vendors when trying to convert non-NIO customers. The
              company's mitigation story is credible in direction, but each core dependency still carries high residual
              exposure because alternative paths are either absent, early, or undisclosed.
