  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Ecosystem Overview
        blocks:
          - type: paragraph
            body: |
              NIO GeniTech operates primarily as a captive semiconductor supplier to NIO Inc.'s
              three-brand electric vehicle ecosystem: the premium NIO brand (ET9, ET7, EL9, EC6,
              EC7), the mass-market ONVO brand (L90 SUV), and the entry-level international firefly
              brand unveiled at NIO Day 2024. This positions the core customer relationship at the
              NIO Inc. engineering, EE architecture, and procurement team level—an internal corporate
              stakeholder—rather than at an arms-length commercial customer. The buyer, user, and
              payer for GeniTech's chips are all ultimately NIO Inc. business units, reducing the
              "customer" relationship to an intra-group transfer with no competitive evaluation process.

              Beyond the captive group, GeniTech has identified domestic Chinese OEMs as the primary
              external licensing targets. Leapmotor and Geely were reported in March 2026 as having
              been approached for potential supply deals, representing the first publicly named external
              prospects. The geographic customer scope remains entirely within China: US export controls
              and Western security concerns documented by independent policy researchers structurally
              block licensing into European or North American OEMs.

              The NIO group's Q1 2026 delivery of 83,465 vehicles across all brands defines the current
              captive chip consumption baseline. ONVO's addition to the NX9031 deployment program in
              the 2026 model-year refresh marks the first expansion of the captive customer base to
              higher-volume mass-market vehicles, a strategically important signal for future fleet
              penetration even though revenue attribution to GeniTech specifically remains undisclosed.
