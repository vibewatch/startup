      - number: '6.4'
        title: Concentration Risk, Security Concerns, and External Commercialization Gap
        blocks:
          - type: paragraph
            body: |
              GeniTech's customer concentration is near-total: all confirmed chip deployments are
              within the NIO group, making NIO Inc.'s delivery performance, product roadmap, and
              financial health the primary determinants of GeniTech's revenue trajectory. If NIO
              group sales decline or a model refresh de-selects the NX9031, GeniTech's captive
              volume shrinks proportionally with no external revenue cushion.

              External commercialization is the key value-creation thesis for GeniTech's post-spin-off
              independent trajectory. Two structural barriers constrain the addressable external
              market. First, US export controls—confirmed in June 2026 as applying to Chinese-owned
              companies and their overseas subsidiaries—effectively prohibit GeniTech from supplying
              Western OEMs. Second, the American Enterprise Institute research report documents
              security and surveillance concerns with Chinese-origin automotive chips, creating
              a reputational and procurement barrier even for non-Western OEMs evaluating Chinese
              components.

              The structurally captive Chinese domestic OEM market offers a more realistic near-term
              expansion target. China's CAAM data confirms approximately 31 million vehicles produced
              annually, and SP Global analysis documents active OEM chip self-sufficiency programs.
              Yet even within this domestic market, GeniTech faces credentialed competitors—Horizon
              Robotics with 27 OEM relationships, Black Sesame with multiple disclosed OEM customers—
              who already have established external relationships that GeniTech has not yet replicated.
              The concentration risk is not merely an investment thesis concern: it is the operative
              commercial reality as of the June 2026 run date.
