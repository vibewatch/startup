      - number: '7.4'
        title: Financial, People, and Execution Risk
        blocks:
          - type: paragraph
            body: >
              Financial and execution risk is elevated because GeniTech is trying to stand up as an independent company
              after years as an internal strategic program. The February 2026 round is meaningful — RMB 2.257 billion is
              real capital and external investors provide some validation — but it does not by itself prove that
              GeniTech has enough funding for multiple chip generations, qualification cycles, and external commercial
              scaling. Li Bin's comparison of NX9031 R&D cost to 1,000 battery-swap stations underscores how
              capital-intensive leading-edge automotive silicon can be. Without standalone revenue, gross margin, burn,
              or cash data, investors cannot test whether the first round is ample or merely sufficient to reach the
              next financing event.


              Governance magnifies that uncertainty. GeniTech only incorporated in June 2025 and, as of mid-2026, no
              independently disclosed CEO, board composition, or management structure separate from NIO leadership
              appears in the public corpus. That leaves the company looking partly independent in capital structure but
              still thin in standalone governance. If external investors eventually demand tighter oversight,
              independent directors, or sharper budget discipline, that transition itself could become an execution
              hurdle.


              People risk is similarly practical. A 600-plus engineer organization emerging from a large corporate
              environment must retain process, safety, and design talent while also building commercial, qualification,
              and business-development capabilities suited to an arms-length supplier. The reported ESOP pool helps, and
              outreach to non-NIO OEMs is a positive signal, but the company has not yet shown the organizational
              maturity of an external semiconductor vendor. The key execution question is therefore not whether GeniTech
              can design chips — it already has — but whether it can fund, govern, staff, and commercialize them at
              sustainable scale.
