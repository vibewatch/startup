  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              GeniTech's primary revenue stream is captive chip supply: the NX9031 is in mass production for NIO's ET9
              luxury sedan, and the ONVO L90 SUV is confirmed to adopt the same chip in its updated variant. These
              captive deployments establish proof of production readiness, but the transfer pricing between GeniTech and
              NIO parent is not disclosed in any public filing, making it impossible to determine the subsidiary's
              realized revenue or gross margin from the parent relationship.

              A second monetization surface — external technical licensing — was signalled in November 2025 when Car
              News China reported GeniTech entering the external licensing market, and in July 2025 NIO's founder
              William Li announced that the NX9031 is open to the broader industry for collaboration. As of the June
              2026 run date, no external OEM has publicly confirmed chip adoption or a licensing agreement, placing this
              revenue stream firmly in the early-pipeline category.

              Inferred but unconfirmed monetization surfaces include software toolchain access analogous to Mobileye's
              EyeQ Kit SDK model, reference-design support packages, and co-development arrangements with interested
              OEMs. These pathways are structurally plausible given the NX9031's claimed performance characteristics,
              but none has been confirmed in press releases or regulatory filings. GeniTech has also not announced any
              public pricing for any tier of access, leaving list pricing, contract floors, and discount structures
              entirely outside the public record.

              The revenue model is therefore best characterised as a single-stream captive supply business transitioning
              toward a multi-stream mixed model, with external licensing and toolchain access as aspirational but
              pre-revenue layers. The absence of any segment revenue disclosure in NIO's consolidated filings —
              including the Q1 2026 results reporting RMB 25,532.7 million in total revenues — means even the captive
              stream cannot be sized externally.
