      - number: '6.3'
        title: Retention, Durability, and Structural Lock-in
        blocks:
          - type: paragraph
            body: |
              GeniTech discloses no net revenue retention (NRR), gross revenue retention (GRR),
              churn rate, renewal rate, or cohort data as of the June 2026 run date. No customer
              satisfaction scores, third-party reviews, or case studies from external users exist
              publicly. The absence of these metrics is partly structural: the primary customer
              relationship is intra-group, where program continuation is determined by NIO product
              roadmap decisions rather than arms-length contract renewals.

              The relevant durability proxy for GeniTech's captive NIO group relationship is vehicle
              platform program stickiness. Automotive chip procurement is deeply integrated: once
              selected for a vehicle platform, the hardware integration, firmware stack, ADAS algorithm
              training, and supplier qualification costs create switching costs that typically span the
              entire 5–7 year vehicle development cycle. The NIO ET9 program's commitment to the NX9031
              from production launch in March 2025 creates a multi-year captive revenue stream, and the
              ONVO L90 integration extends this across a second high-volume platform.

              Competitor evidence illustrates what genuine retention data looks like: Mobileye's
              modularity architecture and design win announcements demonstrate multi-year OEM platform
              stickiness backed by disclosed design win counts and vehicle delivery metrics; Black
              Sesame and Renesas report multi-year OEM partnerships. GeniTech's structural stickiness
              is real but unvalidated by any formal retention metric. The cohort figure below models
              estimated platform-continuation probability using automotive industry norms; it is
              explicitly illustrative and not derived from GeniTech-specific retention data.
