  topStrengths:
    - >-
      First domestic automotive-grade 5nm intelligent-driving chip in mass production with captive deployment in NIO's
      own vehicles.
    - >-
      Majority support from NIO gives GeniTech a live vehicle integration environment, product feedback loop, and a path
      to captive volume before external wins.
    - >-
      Export-control pressure and Chinese semiconductor self-reliance policy create a structural opening for domestic
      ADAS compute suppliers.
  topRisks:
