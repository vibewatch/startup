      No standalone audited revenue, margin, cap-table, or customer data is public, making valuation discipline
      impossible from open sources alone.
    - >-
      Customer concentration is effectively captive to the NIO / ONVO ecosystem until external OEM design wins are
      confirmed.
    - >-
      Foundry dependence and geopolitics create a non-trivial risk that 5nm supply access becomes a bottleneck or
      valuation overhang.
