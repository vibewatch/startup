  topStrengths:
    - 首款量产的国产车规级 5nm 智驾芯片，并已在 NIO 自有车型中内部部署。
    - NIO 的多数股权支持给了 GeniTech 真实车辆集成环境、产品反馈闭环，以及在外部订单前先获得内部规模的路径。
    - 出口管制压力和中国半导体自主可控政策，为国产 ADAS 算力供应商打开结构性窗口。
