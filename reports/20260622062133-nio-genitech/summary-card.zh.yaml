    - 在确认外部 OEM 设计胜出前，客户集中度实际上锁在 NIO / ONVO 生态内。
    - 晶圆厂依赖和地缘政治带来不小风险：5nm 产能获取可能变成瓶颈，也可能压住估值。
  unresolvedGaps:
