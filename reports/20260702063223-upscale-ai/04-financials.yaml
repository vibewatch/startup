- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit / basis
  - Current status
  - Quality
  - Diligence ask
  rows:
  - - Scale-up systems
    - SkyHammer-based rack-scale fabric sold into synchronized training or memory-heavy scale-up environments
    - Per rack-scale deployment or program
    - Product surface is public; realized revenue is undisclosed
    - Medium
    - Provide shipped systems, ASP by deployment size, and acceptance / recognition policy.
  - - Scale-out Ethernet systems
    - Open Ethernet systems built on NVIDIA Spectrum-X silicon and SONiC-based software
    - Per cluster, pod, or fabric build
    - Architecture is public and evaluations / deployments are said to be underway; pricing is undisclosed
    - Medium
    - Provide booked deployments, hardware mix, and realized system pricing by cluster size.
  - - Software / control-plane layer
    - Unified SONiC substrate, telemetry, congestion control, and operating software across scale-up and scale-out
    - Per license, subscription, or bundled entitlement
    - Capability is public, but standalone monetization is not disclosed
    - Low
    - Clarify whether software is bundled, separately licensed, or monetized through support and renewals.
  - - Lifecycle and support services
    - Lifecycle services, enterprise-grade support, reliability work, and operational assistance for customers lacking deep in-house SONiC expertise
    - Per support contract, renewal term, or bundled services package
    - Commercial importance is implied, but terms and attach rates are undisclosed
    - Low
    - Provide support attach, renewal rates, SLA tiers, and warranty vs paid-support split.
  - - Integration / deployment services
    - Turnkey deployment, validation, and design support around heterogeneous AI networking environments
    - Per deployment or integration program
    - Inferred from turnkey and gap-bridging language; fee model is not public
    - Low
    - Provide implementation fees, NRE terms, and deployment labor assumptions.
  - - Partner / ecosystem monetization
    - Potential strategic or partner-linked programs around NVIDIA ecosystem and open-networking adoption
    - Per partner program or strategic account
    - Strategic relevance is visible; economics are not public
    - Low
    - Disclose whether partner-led deals affect pricing, rev share, or support obligations.
