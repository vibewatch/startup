- id: TI003
  title: Unit economics / proxy table
  columns:
  - Metric or proxy
  - Value / public status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Current revenue / ARR
    - Undisclosed
    - Medium
    - Without revenue scale, no valuation-support or operating-efficiency view is investable
    - Provide trailing-12-month revenue, current ARR, and monthly revenue bridge by stream.
  - - Named paying production customers
    - Undisclosed; evaluations and deployments are underway
    - Medium
    - Commercial interest is not the same as converted recurring revenue
    - Provide paid-customer roster, production go-live count, and expansion status by account.
  - - Customer count / concentration
    - Undisclosed
    - Medium
    - Large-account concentration can dominate both upside and pricing risk
    - Provide active-customer count, top-10 revenue mix, and pipeline by stage.
  - - Direct-sales intensity proxy
    - Engineering, sales, and operations expansion tied to commercial deployment
    - Medium
    - Supports the view that GTM is field-heavy and likely expensive before scale
    - Provide headcount by function, quota-carrying reps, and pre-sales engineering load.
  - - Support / deferral proxy
    - Arista support revenue is deferred over one to three years under renewable fee-based contracts
    - Medium
    - Shows how hardware revenue and support cash timing can diverge in comparable models
    - Provide Upscale support terms, deferred-revenue balance, and contract-liability schedule.
  - - Mature gross-margin context
    - Arista 2024 gross margin was 64.1%
    - Medium
    - Useful ceiling context for a scaled networking vendor, not an Upscale estimate
    - Map Upscale product-family gross margin against a mature hardware-plus-support mix.
  - - Discount-pressure proxy
    - Arista warns large customers can receive lower pricing terms due to volume discounts
    - Medium
    - Large hyperscaler or neocloud deals can compress realized margins despite strong demand
    - Provide deal-level discount policy and top-customer pricing waterfalls.
  - - Working-capital proxy
    - Arista had $3.4B of remaining performance obligations and $422.1M of evaluation inventory at customers or partners
    - Medium
    - Acceptance cycles and evaluation units can trap cash before full revenue conversion
    - Provide inventory policy, evaluation units, receivables aging, and support obligations.
  - - Economic-outcome proof
    - Upscale markets purpose-built economics and tokens-per-dollar logic, but no realized ROI data is public
    - Low
    - Economic messaging matters only if measurable customer outcomes exist
    - Provide customer ROI studies, gross savings proof, and utilization improvements tied to renewals.
  notes: Null-quality fields are represented as undisclosed rather than zero. Comparator rows are explicitly labeled as peer context, not hidden Upscale telemetry.
