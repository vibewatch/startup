    - Software and operations layer is explicitly part of the full-stack pitch
    - License basis, attach rate, and renewal mechanics are not public
    - Solution page and SONiC commitment blog
  - - Lifecycle services and support
    - No public rate card
    - Likely bundled or negotiated
    - Lifecycle services are explicitly part of the enterprise value proposition
    - Support tiers, response commitments, renewal pricing, and margin profile are private
    - NVIDIA-partnership blog and solution pages
  - - Turnkey enterprise / neocloud deployments
    - No public quote framework
    - Entirely negotiated
    - Company says it bridges the in-house engineering gap for enterprises and neoclouds
