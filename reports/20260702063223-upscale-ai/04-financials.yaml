  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-revenue
    missingEvidence: Current revenue, ARR, and revenue mix across scale-up, scale-out, software, and services.
    whyItMatters: Revenue quality and valuation support cannot be assessed from funding headlines or architecture descriptions alone.
    diligencePath: Request a monthly revenue bridge, ARR walk, and segment mix by product family.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: pricing-and-discounting
    missingEvidence: Realized pricing, discount bands, contract duration, support attach, and renewal terms.
    whyItMatters: Without realized pricing and attach rates, ASP, gross profit, and CAC payback remain unknowable.
    diligencePath: Review live price books, top-20 deal summaries, support renewal data, and sample customer contracts.
    relatedQuestionRefs:
    - QI003
    - QI004
    - QI014
    - QI024
    relatedTableRefs:
    - TI002
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: margin-and-working-capital
    missingEvidence: Gross margin by product family, BOM categories, deferred revenue, inventory rollforward, receivables aging, and warranty reserves.
    whyItMatters: These metrics determine whether growth is efficient, support-heavy, or working-capital financed.
    diligencePath: Request margin bridge by family, inventory policy, deferred-revenue schedule, contract liabilities, and warranty history.
    relatedQuestionRefs:
    - QI009
    - QI010
    - QI013
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-runway
    missingEvidence: Current cash on hand, monthly burn, runway under board scenarios, and treasury planning.
    whyItMatters: Capital adequacy cannot be underwritten from disclosed rounds alone.
    diligencePath: Obtain latest balance sheet, six-month burn history, 13-week cash forecast, and downside runway analysis.
    relatedQuestionRefs:
    - QI017
    - QI020
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-conversion
    missingEvidence: Named paying customers, production deployment counts, revenue concentration, and cohort retention or expansion data.
    whyItMatters: Enterprise interest is useful, but underwriting requires proof of conversion, durability, and concentration risk.
    diligencePath: Request customer roster, production go-live log, top-customer revenue mix, and renewal / expansion history.
    relatedQuestionRefs:
    - QI007
    - QI008
    - QI016
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: debt-and-commitments
    missingEvidence: Signed debt documents, vendor-finance programs, and non-cancellable procurement commitments.
    whyItMatters: Hidden obligations can materially change solvency and dilution risk even when equity capital appears large.
    diligencePath: Request all debt schedules, lien packages, supplier-finance arrangements, and committed-purchase schedules.
    relatedQuestionRefs:
    - QI019
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
