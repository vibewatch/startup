- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Public status on 2026-07-02
  - Impact on underwriting
  - Exact diligence path
  - Severity
  rows:
  - - Current revenue and ARR by stream
    - Not publicly disclosed
    - Prevents any investable view on scale, growth quality, or valuation support
    - Request monthly revenue bridge, ARR walk, and segment mix by scale-up, scale-out, software, and services.
    - blocking
  - - Realized pricing, discounting, and contract terms
    - No public list or realized pricing disclosed
    - Prevents ASP, gross-profit-per-deployment, and price-discipline analysis
    - Review current price books, top-20 quotes, discount approvals, and sample order forms.
    - blocking
  - - Customer count, named paying accounts, and concentration
    - Not publicly disclosed
    - Prevents concentration, conversion, and expansion analysis
    - Request active-customer roster, top-customer mix, production status, and renewal pipeline.
    - blocking
  - - Gross margin, BOM, support attach, and warranty burden
    - Not publicly disclosed
    - Prevents margin-path and service-economics underwriting
    - Request gross margin by product family, BOM categories, support attach, and warranty reserve history.
    - blocking
  - - Receivables, deferred revenue, inventory, and evaluation units
    - Not publicly disclosed
    - Prevents working-capital and revenue-conversion analysis
    - Request AR aging, deferred-revenue schedule, contract liabilities, inventory rollforward, and evaluation-unit policy.
    - material
  - - Cash on hand, burn, and runway
    - Not publicly disclosed
    - Prevents solvency, dilution-timing, and downside-case analysis
    - Obtain treasury dashboard, six-month cash bridge, 13-week cash forecast, and board runway scenarios.
    - blocking
  - - Debt, vendor finance, and non-cancellable commitments
    - No public disclosure identified
    - Prevents full capital-structure risk assessment
    - Request all debt documents, supplier-finance programs, purchase commitments, and covenant package.
    - material
  - - Sales efficiency and retention metrics
    - No public CAC, payback, NRR, or sales-cycle data disclosed
    - Prevents underwriting of customer-acquisition reality and repeatability
    - Request funnel metrics, CAC by motion, sales-cycle duration, gross-logo retention, and net retention cohorts.
    - blocking
  notes: 'The table is intentionally a blocker register: each gap is both a missing metric and a concrete diligence request needed before underwriting can move beyond narrative.'
