- id: TI004
  title: Capital adequacy table
  columns:
  - Field
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Disclosed total funding
    - 500 USDm across seed, Series A, and Series A-1
    - High
    - This is the only hard public capital base available for liquidity framing
    - Confirm whether any secondary sales, warrants, or additional unannounced equity exist.
  - - Latest disclosed valuation
    - 2.0 USDbn at the June 2026 Series A-1 extension
    - High
    - Sets the current valuation anchor and dilution context
    - Provide post-money cap table and any investor side-letter economics.
  - - Public use of funds
    - Scale the business, accelerate delivery, and expand engineering, sales, and operations
    - Medium
    - Signals spending direction, but not cash needs by bucket
    - Provide a 24-month sources-and-uses plan across R&D, hardware delivery, GTM, and support.
  - - Cash on hand
    - Undisclosed
    - Medium
    - Capital adequacy cannot be assessed without current unrestricted liquidity
    - Provide latest cash, restricted cash, and short-term investments.
  - - Monthly burn
    - Undisclosed
    - Medium
    - Funding headlines do not show whether operating burn is modest or industrial in nature
    - Provide monthly net cash burn history for the last six months and forward budget.
  - - Runway months
    - Undisclosed and not publicly underwritable
    - Medium
    - Runway governs timing risk, leverage to milestones, and next-round dependence
    - Provide board runway view under base, upside, and downside cases.
  - - Debt / vendor finance / project finance
    - No public disclosure identified as of 2026-07-02
    - Medium
    - Hidden obligations can materially change solvency and dilution risk
    - Provide debt schedules, payable financing, procurement commitments, and lien package if any.
  - - Next-round trigger
    - Undisclosed
    - Medium
    - Underwriting needs to know whether the next round depends on deployment scale, revenue, margin, or supply-chain needs
    - Specify the operating or liquidity milestone that would force or avoid another financing.
  notes: This table keeps disclosed facts separate from what is simply unavailable. No runway estimate is inferred from public funding totals alone.
  enumerationScope:
    coverage: partial
    basis: Rows enumerate the capital-adequacy fields needed for underwriting; only funding totals, valuation, and broad use-of-funds language are hard public facts today.
