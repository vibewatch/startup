        - Status-quo substitute
        - InfiniBand remains entrenched in high-performance AI training clusters
        - Buyers optimizing collective communication and lowest-latency training fabrics
        - Mature training performance profile and well-understood operational playbooks
        - Can reinforce proprietary lock-in and increase switching friction away from incumbent stacks
