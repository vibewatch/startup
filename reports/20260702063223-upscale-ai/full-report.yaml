  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape is broader than a simple startup-versus-startup framing. Upscale AI is trying to
              sell a full-stack AI networking layer across both scale-up and scale-out environments, so the buyer can
              solve the same job in at least four different ways: buy a vertically integrated NVIDIA stack, adopt open
              Ethernet from incumbents such as Cisco or Arista and integrate it internally, use another focused AI
              networking startup such as Nexthop AI, or keep building internally with merchant silicon, open-source NOS
              software, and in-house operations. The substitute set is even wider at the scale-up boundary because
              NVLink and InfiniBand remain entrenched wherever the buyer already accepts NVIDIA reference architectures
              and values the lowest-latency collective performance over openness. That matters because Upscale’s thesis
              is not that AI networking exists—it clearly does—but that a meaningful slice of the market wants open
              standards and multi-vendor flexibility without taking on hyperscaler-grade integration work.
              Open-standards bodies such as UALink and Ultra Ethernet make that thesis more credible over time, yet they
              do not erase the practical advantage of incumbents that already own silicon, optics, distribution, or
              deployed GPU ecosystems.
            claimRefs:
