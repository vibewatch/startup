      - number: '7.2'
        title: Legal, regulatory, and dependency risks
        blocks:
          - type: paragraph
            body: >-
              The legal and regulatory register is presently adverse-screen clean but not fully closed. No active
              litigation was identified in retained public material, yet that is not equivalent to docket-level
              clearance, especially in a market where incumbent networking vendors and silicon providers hold large
              patent portfolios and can litigate around architecture, software interoperability, or standards-essential
              interfaces. Export-control exposure is another non-trivial variable: AI networking hardware and advanced
              interconnect pathways can be pulled into evolving policy controls, indirectly affecting silicon
              availability, region coverage, and customer eligibility. Standards participation with SONiC and OCP helps
              reduce proprietary lock-in, but one cited SONiC-partnership news URL is broken, which weakens public
              verifiability and indicates documentation hygiene risk. On dependency, NVIDIA concentration is the most
              immediate risk because Upscale's disclosed scale-out path ties product delivery to third-party roadmap,
              supply, and pricing decisions while NVIDIA is simultaneously a partner, competitor, and investor in the
              broader AI networking arena.
