      - number: '7.4'
        title: Mitigation maturity, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Mitigation should be judged by controllability. Upscale can directly improve execution hygiene, disclosure
              quality, partner diversification, benchmark transparency, and contingency planning; it cannot directly
              control grid queues, incumbent legal posture, or hyperscaler capex cycles. As a result, this chapter
              separates mitigation maturity from residual exposure and codifies kill criteria that can be monitored
              before capital is committed. High-maturity mitigations include deeper standards participation,
              multi-partner go-to-market optionality, and leadership bench expansion beyond founders. Medium-maturity
              mitigations include procurement and roadmap buffering for component and foundry risk. Low-maturity domains
              are export-control trajectory, litigation timing, and broad AI-demand drawdowns. For investment process
              discipline, the key is not to wait for terminal outcomes: thesis-break triggers should fire on leading
              indicators such as capex guide cuts, prolonged power timelines in core regions, missing production proof
              by defined checkpoints, or adverse legal/regulatory events. Where evidence remains private-only, diligence
              asks are intentionally explicit so unresolved uncertainty is visible rather than normalized.
