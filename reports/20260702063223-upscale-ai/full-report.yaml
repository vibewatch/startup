        title: Severity-ranked risk landscape
        blocks:
          - type: paragraph
            body: >-
              The severity ranking in this chapter is driven by transmission speed into revenue timing, financing
              flexibility, and valuation resilience rather than by abstract probability alone. The highest-priority
              cluster is macro-demand and infrastructure coupling: multiple independent sources warn that AI
              infrastructure spending can outrun monetization, while power availability and interconnection timelines
              are already becoming the practical gating factor for data-center expansion. For Upscale AI, that means a
              demand pause or delayed energization can hit order velocity even if product performance is strong. The
              second cluster is strategic dependency: scale-out execution currently rides NVIDIA Spectrum-X silicon
              while the same ecosystem also contains direct competitors and overlapping investors, creating both supply
              concentration and conflict risk. The third cluster is execution and disclosure risk: pre-revenue status,
              limited named production proof, and incomplete governance transparency increase the probability that
              adverse external shocks translate into down-round pressure. Mitigation maturity is strongest where
              diversification and standards work are already underway, and weakest where outcomes depend on regulators,
              courts, utilities, or hyperscaler budget cycles.
            claimRefs:
