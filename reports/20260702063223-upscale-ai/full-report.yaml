      - number: '3.2'
        title: Competitor profiles and strategic direction
        blocks:
          - type: paragraph
            body: >-
              NVIDIA is the central reference point because it spans the entire decision tree: proprietary NVLink and
              InfiniBand for locked-in high-end deployments, Spectrum-X Ethernet for customers moving toward Ethernet,
              and now photonics for future power and scale constraints. Cisco attacks the market from a different angle
              by embedding AI networking inside a larger AI-factory platform that includes silicon, switching, security,
              observability, and services, which gives it an enterprise and channel advantage even when it is not the
              technical performance leader in every segment. Arista’s public AI posture is more modular and
              open-Ethernet oriented, pairing Broadcom-based hardware with EOS and CloudVision rather than tying
              networking to a compute platform. Nexthop AI is the closest startup analogue to Upscale because it also
              sells high-performance open networking for hyperscalers and neoclouds and has already reached a $4.2
              billion valuation. The photonics peers—Celestial AI, Lightmatter, and Ayar Labs—are less direct in today’s
              buying cycle, but they matter strategically because they attack the same interconnect bottlenecks from the
              optical and packaging layer and are raising enough capital to influence the future architecture of
              scale-up budgets.
