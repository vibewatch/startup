      - number: '2.4'
        title: Growth drivers, timing, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Growth drivers are clear but unevenly timed. IDC and Bain both indicate strong demand momentum from
              hyperscaler expansion, enterprise production AI adoption, and geographic diffusion beyond North America.
              Dell’Oro’s 2026 outlook that Ethernet overtook InfiniBand in AI back-end adoption adds a transport-level
              driver that favors open-networking narratives. At the same time, constraints are not secondary—they define
              conversion speed. Bain identifies power availability as the current gatekeeper and points to
              gigawatt-scale campus requirements for frontier training. TCW and S&P add financing and credit risk
              perspectives, warning that front-loaded capex can outpace realized monetization if utilization or demand
              assumptions soften. At the solution level, NextPlatform’s vendor-share breakout shows how fast NVIDIA has
              become a major Ethernet contender, reinforcing lock-in and switching-cost pressure for challengers.
              Upscale can benefit from open standards momentum, but timing risk remains dominated by power, capital, and
              incumbent ecosystem gravity.
