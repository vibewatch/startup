  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, excluded spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The market boundary for this chapter is AI data center networking infrastructure, not the entire AI
              infrastructure stack. Included spend therefore covers high-speed switching, routing, optical
              interconnects, NIC or SmartNIC layers, network operating software, and integration services that directly
              determine AI-cluster communication performance. ResearchAndMarkets supports this narrower definition by
              explicitly segmenting AI data center networking by component, network type, application, and end user
              across 2020–2035. Excluded spend includes accelerators, general-purpose servers, storage arrays, cooling
              systems, and power systems unless those purchases are inseparable from networking architecture decisions.
              Status-quo substitutes remain strong and include proprietary scale-up paths, InfiniBand-centric fabrics,
              and retrofitted legacy Ethernet operations. Upscale’s open scale-up plus scale-out framing matters because
              it targets this substitution boundary rather than claiming all AI infrastructure dollars as practically
              addressable revenue.
