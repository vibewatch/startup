        - Hyperscalers and large AI cluster operators seeking open Ethernet operations
        - Strong open-Ethernet operations posture and broad cloud networking credibility
        - Less vertical compute-stack control than NVIDIA and limited public transaction pricing transparency
      - - Broadcom ecosystem / merchant Ethernet
        - Adjacent platform competitor
        - Merchant silicon underpins many open Ethernet deployments via OEM and ODM channels
        - Hyperscalers, cloud builders, and integrators assembling custom stacks
