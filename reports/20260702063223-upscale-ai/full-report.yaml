      - number: '3.4'
        title: Switching cost, lock-in, moat durability, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The moat question is less about whether Upscale’s narrative is coherent and more about where durable
              switching costs will actually sit once buyers deploy production clusters. The strongest lock-in still
              belongs to NVIDIA because GPU, NIC, transport, management, and reference-architecture choices reinforce
              one another; buyers that standardize there can defer many integration decisions and accept fewer vendors.
              Internal build is the second major threat because hyperscalers and the largest cloud builders can assemble
              merchant silicon, open NOS software, and custom operations stacks without paying a startup integration
              margin. Open Ethernet and standards bodies do help Upscale by weakening protocol lock-in, but they also
              create commoditization risk: if Cisco, Arista, Broadcom-aligned ecosystems, and Nexthop all offer credible
              open fabrics, Upscale’s moat has to come from execution speed, lifecycle support, and distinctive scale-up
              IP rather than from openness alone. Publicly, that moat is not yet proven. The company has strong
              financing and ecosystem signaling, but the pack still lacks named production customers, deployment counts,
              support metrics, or published pricing. The upside case is that SkyHammer and its open-standards scale-up
              approach ship on time and create a differentiated bridge between proprietary performance and open
              ecosystems. The adverse case is that Upscale becomes a thin systems-and-software layer squeezed between
              stronger silicon suppliers, incumbent switch vendors, adjacent optical innovators, and self-integrating
              buyers.
