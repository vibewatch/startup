  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative impact on underwriting attractiveness measured as points on a 100-point IC score if each variable
      improves or worsens materially.
    data:
      items:
        - label: Named production customers appear
          value: 25
          note: Largest single positive because it closes the public proof gap fastest.
        - label: Revenue and gross margin disclosed
          value: 20
          note: Economics visibility sharply improves price defensibility.
        - label: Better price or stronger downside terms
          value: 18
          note: Entry discipline can solve part of the problem even before full proof.
        - label: Power and deployment timelines slip
          value: -18
          note: Delays push revenue timing right and weaken near-term marks.
        - label: NVIDIA dependency deepens
          value: -12
          note: Supplier overlap reduces strategic leverage and bargaining power.
        - label: Macro monetization skepticism rises
          value: -15
          note: Risk appetite compresses first where proof is weakest.
    approximationNotes: Sensitivity values are normalized IC-score adjustments, not public valuation deltas or traded multiples.
