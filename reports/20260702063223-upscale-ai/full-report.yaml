    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Why it matters
      - Action implication
    rows:
      - - No named production proof
        - Another 6-12 months with no public production references or equivalent private diligence proof.
        - The valuation would keep outrunning visible commercialization.
        - Downgrade from track to avoid and stop underwriting near current price.
      - - Power slippage in target deployments
        - Material multi-quarter energization delays across key customer programs.
        - Revenue timing for AI infrastructure vendors moves right quickly when power slips.
        - Assume lower near-term conversion and wider downside range.
      - - Supplier concentration worsens
        - Upscale remains tightly tied to a supplier that also sells a competing integrated stack.
        - Strategic leverage weakens if differentiation sits above another vendor's roadmap.
        - Increase discount rate and limit position sizing.
      - - Macro capex reset
        - Hyperscaler or neocloud AI capex slows materially versus 2026 plans.
        - Category premium could compress before Upscale closes its proof gap.
        - Freeze new investment until deployment data catches up.
      - - Adverse financing structure
        - Term-sheet review reveals strong senior protections or punitive anti-dilution.
        - Common-equivalent value could be much lower than the headline round price.
        - Pass unless economics or price reset compensates.
      - - Margin profile disappoints
        - Private diligence shows weak gross margin or heavy services drag.
        - A low-quality revenue mix cannot support premium hardware-plus-software narratives.
        - Treat current price as too rich even if customer logos improve.
    notes: >-
      Triggers are designed as early warning indicators for investment process discipline, not as post-mortem
      explanations after value has already been lost.
