      - number: '8.4'
        title: Exit-readiness, diligence asks, and kill triggers
        blocks:
          - type: paragraph
            body: >-
              Upscale is not publicly exit-ready in the sense that a later-stage investor or public-market style
              diligence process would usually expect. There is no public evidence yet for durable revenue quality,
              customer diversification, or gross-margin durability, and the financing stack is not disclosed deeply
              enough to evaluate common-equivalent downside. That does not mean the company is weak; it means the next
              investment decision should be gated by evidence, not by category momentum alone. The right diligence
              agenda is therefore narrow and high leverage: production-customer proof, current unit economics, financing
              terms, concentration, and deployment conversion. Kill triggers should also be explicit before committing.
              A sustained capex slowdown, prolonged power delays in target deployments, materially adverse financing
              structure, or another six to twelve months without named production proof should all tighten or end the
              case. If management can answer those asks and the price remains around current levels, the recommendation
              can be revisited quickly. If not, tracking should remain observational rather than participatory.
