        - No single funding signal because this is a capability model, not one vendor
        - Largest hyperscalers and cloud builders with deep network engineering teams
        - Maximum control over architecture, procurement, and optimization
        - Requires hyperscaler-grade engineering and shifts integration risk back to the buyer
      - - Likely entrants via standards ecosystems
        - Likely entrant class
        - UEC/UALink/OCP ecosystems include many large board and member companies
        - Future AI infrastructure buyers seeking multi-vendor compliance
