      - number: '2.3'
        title: Buyer, user, payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The observable buyer map has three practical segments: hyperscalers, neocloud providers, and large AI
              infrastructure operators that include sovereign and enterprise-scale deployments. In each segment, daily
              users are infrastructure, platform, and ML systems teams that operate GPU clusters, while economic buyers
              are usually infrastructure or platform engineering leaders who sponsor architecture direction. Final payer
              approval typically runs through centralized capex committees or equivalent investment governance bodies
              because decisions involve multi-year hardware, facilities, and power commitments. Cisco’s neocloud
              analysis and Bain’s strategic shift framing both support the point that procurement is no longer ad hoc;
              it is tied to deployment model choices such as dedicated versus shared capacity, self-build versus
              colocation, and open versus vertically coupled fabrics. Adoption therefore follows a staged path from
              pilot fabric validation to production rollout, with expansion gated by utilization, reliability, and
              financing confidence rather than feature checklists alone.
