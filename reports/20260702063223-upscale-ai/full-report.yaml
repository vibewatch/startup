          - type: paragraph
            body: >-
              Upscale's differentiation is technically coherent: open-standards scale-up plus open-Ethernet scale-out,
              integrated into one operating story intended to reduce lock-in and support heterogeneous accelerator
              futures. This contrasts with single-vendor proprietary stacks and aligns with industry movement toward
              programmable Ethernet fabrics in AI back-end networks. Independent technical material supports the
              strategic logic that AI traffic patterns need purpose-built lossless transport design and topology-aware
              operations. The risk side is equally material. Scale-out dependency on NVIDIA Spectrum-X introduces
              supplier and roadmap concentration. Standards-led interoperability remains a moving target while
              UALink/UEC ecosystems mature. Public trust and compliance evidence is still light: no visible SOC2/ISO
              certification details, limited software security process disclosure, and no public vulnerability-response
              metrics. Broken or migrated URLs around SkyHammer pages also create minor documentation friction. The
              adverse case is that architecture quality may still outrun execution proof until benchmark,
              customer-production, and assurance evidence catches up. This risk is amplified when buyers need
              contract-level accountability and audited operations data before approving multi-year fabric
