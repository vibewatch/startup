      - number: '2.5'
        title: Contradictory estimates and reconciliation logic
        blocks:
          - type: paragraph
            body: >-
              The evidence set contains genuinely contradictory-looking numbers that should be preserved, not averaged
              away. One end of the range is narrow and operational: annualizing the Q1 2025 datacenter Ethernet figure
              yields roughly USD 27.68B, a plausible near-term networking run-rate lens. Another is a company-level
              directional target: Upscale’s public product framing cites a projected USD 100B AI networking market by
              2030. Broader infrastructure lenses are much larger, including IDC’s >USD 1T by 2029 and
              MarketsandMarkets’ USD 2,023.52B by 2032 for the full AI data center market. These can all be
              simultaneously true because they measure different boundaries, periods, and components. The chapter
              therefore treats the trillion-dollar and multi-trillion-dollar figures as outer demand envelopes while
              grounding near-term serviceability in networking-specific and buyer-specific slices. This reconciliation
              approach is more conservative for valuation than simply selecting the largest headline estimate.
            claimRefs:
              - CM018
              - CM032
              - CM033
              - CM034
      - number: '2.6'
        title: Sizing and adoption diligence gaps still open
        blocks:
          - type: paragraph
            body: >-
              Several material diligence gaps remain before market size can be translated into confidence on monetizable
              share. First, two assigned sources in the exclusive block (McKinsey optics analysis and IEA electricity
              update) were inaccessible in the retained pack, limiting direct quantification on supply and power
              constraints. Second, the public synopsis for ResearchAndMarkets and the empty-capture Yole page do not
              expose full paid datasets, so key subsegment splits and scenario assumptions cannot be independently
              re-run. Third, buyer-level budget mechanics are still inferred from analyst and ecosystem commentary
              rather than from disclosed procurement records tied to Upscale wins. Fourth, Upscale has not publicly
              disclosed production customer count, ARR, or conversion rates from evaluations to paid deployments, making
              SOM inference speculative. These gaps do not negate demand, but they increase sensitivity to execution and
              reduce confidence in any aggressive market-share underwriting case.
            claimRefs:
