      - number: '8.2'
        title: Recommendation, confidence, risk, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The most supportable call from public evidence is track, not buy. That is a price-sensitive conclusion
              rather than a dismissal of the company. Upscale has enough capital, category relevance, and product
              ambition to justify continued attention, but the public file does not justify stepping into a $2 billion
              round as though the commercial model were already proven. Confidence is medium because the evidence is
              directionally coherent yet still incomplete at the metrics layer. Risk should remain high because the
              downside channels are stacked on top of one another: supplier dependence on NVIDIA-linked scale-out
              inputs, power and component bottlenecks, macro overbuild risk, and the possibility that current private
              valuation enthusiasm is front-running monetization. Valuation stance is stretched rather than absurd. The
              current price is not obviously impossible when compared with other heavily funded AI-networking and
              interconnect startups, but the proof gap is too large to call it attractive. Put differently: quality may
              be emerging, but price already assumes more operating evidence than the public record provides.
