  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer-workflow terms
        blocks:
          - type: paragraph
            body: >-
              Upscale AI's product is best understood as an AI-cluster workflow optimizer, not as a standalone switch
              SKU. The public solution narrative starts from two recurring customer jobs: synchronized model training
              and production inference at scale. In both workflows, networking is presented as the throughput governor
              between accelerators, memory, and storage. Upscale's framing is that traditional general-purpose fabrics
              were built for bursty north-south traffic, while AI workloads generate deterministic east-west collective
              exchanges where a single stalled flow can idle expensive GPU capacity. This framing drives a two-domain
              product definition: SkyHammer for rack-scale scale-up, plus open Ethernet scale-out systems for multi-rack
              cluster expansion. The operating promise is consistent across pages and talks: keep large accelerator sets
              synchronized, preserve predictable latency under load, and provide an open standards path so operators can
              evolve hardware generations without full-fabric replacement. What is still missing is hard public proof
              that these outcomes are already delivered in named production deployments.
