chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product model, and web presence
        blocks:
          - type: paragraph
            body: >-
              Upscale AI’s current official identity is clearer on product scope than on historical dating. The retained
              official pages now resolve under upscale.com and describe the company as a pure-play AI networking
              infrastructure vendor selling a full-stack platform across silicon, systems, and software. The public
              product split is already concrete enough for later chapters to reuse: SkyHammer is the scale-up
              architecture for tightly synchronized rack-scale AI fabrics, while the scale-out side combines NVIDIA
              Spectrum-X switch silicon with a SONiC-based operating stack for heterogeneous Ethernet clusters. What is
              less clean is the historical record around start date and digital identity. Official and independent
              launch materials anchor public emergence to September 2025 with more than $100 million of seed funding and
              Auradine incubation, and Tech Field Day later summarized the company as founded in 2025. But the current
              about-us page contains a September 2024 seed marker, so the safest reusable wording is that Upscale AI
              became public in 2025 while exact incorporation or pre-launch financing timing remains unresolved. A
              second naming wrinkle is that older official releases still direct readers to upscaleai.com, while the
              unrelated upscale.ai domain currently belongs to an AI advertising platform, creating a real if still
              manageable brand-confusion risk.
