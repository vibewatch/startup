  - id: leadership-governance-and-key-person-risk
    title: Leadership, governance, and key-person risk
    body: >-
      The leadership story is unmistakably founder-led. Barun Kar remains the CEO and public operating face of the company, while Rajiv Khemani serves as Executive Chairman and appears alongside Kar in most financing, product, and ecosystem messaging. That concentration is not inherently negative because the same public record also establishes substantial founder-market fit: launch and financing materials repeatedly tie the pair to prior networking and infrastructure wins across Palo Alto Networks, Innovium, Cavium, and Auradine. Even so, investors should treat key-person dependence as material because the most visible external validation still routes through Kar and Khemani rather than through a publicly documented board or committee structure. The positive counterweight is bench expansion. As of April 2026, Upscale added Puneet Agarwal as CTO, Jason Ledgerwood as SVP of Systems Engineering & Operations, Sharada Yeluri as VP of ASIC, and Mohsen Moazami as Senior Advisor, while the current leadership page also names executives across sales, software, finance, legal, architecture, support, and people functions. SONiC governance roles for Aravind Srikumar, Deepti Chandra, and Santhosh K Thodupunoori further suggest a deeper technical bench than the founder narrative alone implies. The remaining gap is governance visibility: public sources still do not disclose the full board, ownership stakes, committee structure, or control rights.
