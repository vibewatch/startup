  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: founding-timing
      missingEvidence: Definitive incorporation or formation-date evidence and an explanation for why the about-us timeline shows a Sept. 2024 seed marker while launch coverage points to Sept. 2025.
      whyItMatters: Later chapters need one canonical start-date framing for company age, execution pace, and fundraising velocity.
      diligencePath: Request certificate of incorporation, first financing close memo, and management explanation of whether Sept. 2024 reflects an internal seed close, incubation milestone, or website timeline error.
      relatedQuestionRefs:
        - QO003
      relatedTableRefs:
        - TO001
        - TO004
    - type: conflicting-data
      severity: material
      topic: headquarters
      missingEvidence: Documentary proof of when the public headquarters label changed from Palo Alto to Santa Clara and whether it reflects an actual move or only a later dateline preference.
      whyItMatters: Headquarters affects later talent, ecosystem, and regulatory context and should not be normalized away without evidence.
      diligencePath: Request current office address, prior office address, lease chronology, and any internal announcement or legal filing documenting the change.
      relatedQuestionRefs:
        - QO004
      relatedTableRefs:
        - TO001
        - TO004
    - type: private-evidence-only
      severity: material
      topic: revenue-disclosure
      missingEvidence: Current revenue, ARR, gross margin, and pipeline conversion metrics.
      whyItMatters: Capital raised and valuation are public, but commercial efficiency and monetization quality are still opaque.
      diligencePath: Request current board deck, monthly KPI pack, and finance model with booked revenue, ARR, and margin bridges.
      relatedQuestionRefs:
        - QO021
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: customer-disclosure
      missingEvidence: Named paying customers, active deployment count, and split between evaluations, pilots, and production accounts.
      whyItMatters: Later product, GTM, and valuation chapters need to separate market interest from revenue-bearing production adoption.
      diligencePath: Request customer roster with stage labels, ARR by account, and referenceability status for hyperscaler and neocloud programs.
      relatedQuestionRefs:
        - QO022
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: headcount-disclosure
      missingEvidence: Current headcount, location distribution, and hiring plan by function.
      whyItMatters: The public record only preserves an early 100-plus team signal, which is insufficient for assessing burn efficiency or operating readiness.
      diligencePath: Request current org chart, employee census by site and function, and twelve-month hiring plan.
      relatedQuestionRefs:
        - QO023
      relatedTableRefs:
        - TO001
    - type: private-evidence-only
      severity: material
      topic: governance-rights
      missingEvidence: Full board composition, ownership percentages, debt facilities, secondaries, liquidation preferences, and control-right terms.
      whyItMatters: Public financing headlines show who invested, but not who controls the company or what economic seniority sits ahead of common holders.
      diligencePath: Request the current cap table, charter and financing documents, debt schedule, board list, and any shareholder side letters.
      relatedQuestionRefs:
        - QO009
      relatedTableRefs:
        - TO002
        - TO003
