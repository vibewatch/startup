tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / class
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Upscale AI
    - Direct startup
    - Upscale has raised $500M total at a $2B valuation
    - Neoclouds, enterprises, and heterogeneous AI infrastructure operators
    - Open standards plus full-stack story across SkyHammer scale-up and Spectrum-X-based scale-out
    - No public list pricing, no named production customers, and current scale-out depends on NVIDIA silicon
  - - NVIDIA Spectrum-X / Quantum-X
    - Direct incumbent plus status-quo substitute
    - NVIDIA networking and AI platform scale materially exceeds startup peers
    - Hyperscalers, AI factories, and buyers willing to accept tighter stack coupling
    - Vertical integration across Ethernet, InfiniBand, SuperNICs, and photonics with claimed 1.6x Ethernet uplift
    - Highest lock-in risk and premium positioning for buyers prioritizing multi-vendor control
  - - Cisco
    - Direct incumbent
    - Cisco reports multi-billion-dollar AI infrastructure order momentum and global enterprise reach
    - Hyperscalers, neoclouds, enterprises, and service providers
    - Silicon One plus AI networking, security, observability, and services in one enterprise GTM motion
    - Fabric performance differentiation can be harder to isolate from broader Cisco platform bundling
  - - Arista AI-EtherLink
    - Direct incumbent
    - Arista is a major datacenter Ethernet incumbent with explicit AI-EtherLink positioning
    - Hyperscalers and large AI cluster operators seeking open Ethernet operations
    - Strong open-Ethernet operations posture and broad cloud networking credibility
    - Less vertical compute-stack control than NVIDIA and limited public transaction pricing transparency
  - - Broadcom ecosystem / merchant Ethernet
    - Adjacent platform competitor
    - Merchant silicon underpins many open Ethernet deployments via OEM and ODM channels
    - Hyperscalers, cloud builders, and integrators assembling custom stacks
    - Strong silicon economics and broad ecosystem availability
    - Value capture can shift to integrators, reducing turnkey ownership and accountability
  - - InfiniBand / RoCE v2 status quo
    - Status-quo substitute
    - InfiniBand remains entrenched in high-performance AI training clusters
    - Buyers optimizing collective communication and lowest-latency training fabrics
    - Mature training performance profile and well-understood operational playbooks
    - Can reinforce proprietary lock-in and increase switching friction away from incumbent stacks
  - - Internal build
    - Status-quo substitute
    - No single funding signal because this is a capability model, not one vendor
    - Largest hyperscalers and cloud builders with deep network engineering teams
    - Maximum control over architecture, procurement, and optimization
    - Requires hyperscaler-grade engineering and shifts integration risk back to the buyer
  - - Likely entrants via standards ecosystems
    - Likely entrant class
    - UEC/UALink/OCP ecosystems include many large board and member companies
    - Future AI infrastructure buyers seeking multi-vendor compliance
    - Open-spec alignment can accelerate ecosystem competition beyond today's named vendors
    - Spec publication does not guarantee immediate interoperable production deployments
  notes: Selected set reflects the most decision-relevant direct, substitute, and adjacent options in the retained pack; it is not an exhaustive list of every Ethernet, InfiniBand, or optics vendor.
  enumerationScope:
    coverage: partial
    basis: Covers the principal direct incumbents, direct startup peer, status-quo substitute, and photonic adjacencies visible in the retained pack; many ODM, OEM, and regional variants are not individually profiled.
