- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor / class
  - Public packaging clue
  - Pricing signal
  - What is included publicly
  - Unknowns / discounting gap
  - Implication
  rows:
  - - Upscale AI
    - Fully supported end-to-end solutions combining hardware, software, and lifecycle services
    - Unknown
    - Spectrum-X-based systems, AI-optimized SONiC, telemetry, and support
    - No public list price, support tier, contract length, or hardware/software split is disclosed
    - Commercial wedge depends on proving faster deployment and lower operating burden, not visible price leadership
  - - NVIDIA Spectrum-X Ethernet
    - Switch plus SuperNIC / DPU platform with integrated management
    - Premium
    - Tightly integrated Ethernet fabric with software and ecosystem alignment
    - Public list pricing and discount structures are not disclosed in retained sources
    - Buyers may pay for performance and integration while accepting stronger lock-in
  - - NVIDIA Quantum-X InfiniBand
    - Reference-fabric bundle in DGX or SuperPOD-style deployments
    - Premium
    - InfiniBand switches, NICs, and collective-optimization capabilities
    - No transparent public transaction pricing in retained sources
    - Remains the status-quo benchmark where training performance is prioritized over openness
  - - Cisco AI networking
    - Hardware plus NX-OS, Nexus Dashboard, and services
    - Market-competitive hardware plus software OpEx
    - Silicon One switching integrated into broader AI operations and security stacks
    - Public terms do not expose discount ladders or all-in lifecycle pricing
    - Cisco can win where buyers prioritize procurement simplicity and lifecycle breadth
  - - Arista AI-EtherLink
    - Leaf-spine or distributed AI Ethernet with EOS / CloudVision operations
    - Market-competitive hardware
    - AI Ethernet switching and operational tooling for large clusters
    - Public sources do not expose detailed support tiers, rebates, or contract durations
    - Arista can compete on openness and operations, but real TCO still requires deal-level quotes
  - - Broadcom ecosystem / merchant model
    - Component and platform economics distributed across OEM/ODM channels
    - Varies by integrator
    - Merchant silicon platforms plus partner NOS and integration layers
    - Pricing signal is fragmented across silicon, OEM, optics, and services
    - Buyers may obtain flexibility but must assemble a clear accountability model
  - - InfiniBand or RoCEv2 status quo
    - Protocol and architecture decision more than single-SKU purchase
    - Varies by deployment scale and lock-in tolerance
    - Lossless transport, congestion-control stacks, and established AI training topology patterns
    - Public comparables rarely normalize labor, migration risk, and software overhead in one model
    - Switching decision should be framed as performance-versus-openness trade-off, not only switch CapEx
  notes: Pricing and packaging transparency is poor across the whole category. This table preserves what is public and marks the rest as unknown instead of inferring false precision from marketing materials.
