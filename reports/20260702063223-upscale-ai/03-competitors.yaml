- id: capability-pricing-and-distribution-comparison
  title: Capability, pricing, and distribution comparison
  body: 'Public capability evidence is strongest for architecture and weakest for commercial terms. Upscale’s own materials do show a concrete scale-out stack—NVIDIA Spectrum-X switch silicon, a focused SONiC implementation, deterministic lossless Ethernet behavior, telemetry, and lifecycle support—and they position SkyHammer as an open, memory-semantics-oriented scale-up architecture. The challenge is that incumbents have equally clear capability stories plus stronger operational proof. NVIDIA couples switches, SuperNICs, management, and a compute franchise that already anchors buyer roadmaps. Cisco wraps AI networking into a broader infrastructure, security, and operations platform. Arista and merchant-silicon open Ethernet vendors can lean on multivendor optics, mature operating tooling, and large installed bases. Nexthop’s pitch is similarly open but more customization-heavy. Pricing is the weakest area across the entire chapter: the retained public pack provides almost no apples-to-apples
    list pricing, discounting, support-tier, or contract-length evidence for these AI fabrics. That forces a more honest conclusion that packaging and distribution power are currently more legible than transactional economics: incumbents own field reach, NVIDIA can ride GPU demand, and Upscale must prove that operational simplicity and faster deployment can outweigh its smaller installed base.'
