- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - Upscale AI
  - NVIDIA networking
  - Cisco / Arista open Ethernet
  - Nexthop AI
  - Evidence / unsupported gap
  rows:
  - - Open scale-up standard posture
    - Strong narrative via SkyHammer plus UALink / UEC language
    - Weak because NVLink is proprietary and InfiniBand is closed despite Spectrum-X Ethernet
    - Moderate because Ethernet and UEC direction are open, but scale-up differentiation is less central
    - Weak to moderate because open networking focus is clearer than open scale-up IP
    - Public proof for shipping open scale-up products remains strongest for standards bodies, not for deployed vendor systems
  - - Turnkey scale-out stack
    - 'Strong public claim: systems, software, telemetry, lifecycle support'
    - Strong with switches, SuperNICs, management, and reference architectures
    - Strong with mature hardware and operations stacks, though integrator burden varies by buyer
    - Moderate to strong depending on custom-design engagement
    - Upscale and Nexthop publish architecture and GTM cues, but neither exposes public production footprint comparable to incumbents
  - - SONiC / open NOS posture
    - 'Strong: focused SONiC story plus governance roles'
    - 'Moderate: SONiC support exists alongside Cumulus and proprietary coupling'
    - 'Moderate to strong: Cisco blogs and Arista positioning support open Ethernet and UEC direction'
    - 'Strong: SONiC and FBOSS called out directly'
    - Vendor commitment to open NOS is clearer than the exact upstream/downstream feature delta in public sources
  - - Photonics / optics roadmap
    - Weak today in public Upscale materials
    - 'Strong: Spectrum-X and Quantum-X photonics roadmap is explicit'
    - 'Moderate: optics support exists, but photonics is less central in retained sources'
    - Weak in retained public pack
    - Ayar and Celestial show where future interconnect differentiation could migrate even if they are not current turnkey fabric substitutes
  - - Operational tooling and observability
    - 'Moderate: telemetry and focused SONiC are explicit, broad installed tooling is not'
    - 'Strong: UFM plus end-to-end platform coupling'
    - 'Strong: NX-OS / Nexus Dashboard and EOS / CloudVision are mature public stories'
    - 'Moderate: public story stresses efficiency and co-development, not a broad operations suite'
    - Operations evidence is one of the main installed-base advantages held by incumbents
  - - Distribution and field reach
    - 'Weak to moderate: strong investors and partner signals, but limited public customer proof'
    - 'Strong: rides GPU demand and NVIDIA ecosystem pull'
    - 'Strong: entrenched enterprise, service-provider, and hyperscaler field motion'
    - 'Moderate: startup speed plus hyperscaler credibility, but less channel breadth'
    - Public pack shows the clearest distribution advantage for incumbents rather than for startups
  - - Multi-vendor flexibility
    - Strong positioning around heterogeneous compute and open standards
    - 'Moderate: Spectrum-X is standards-based Ethernet but still tightly coupled to NVIDIA stack choices'
    - Strong for open Ethernet architectures, especially in multivendor ops models
    - Strong where buyers want open source and custom switching
    - Flexibility claims are more public than realized switching-cost data, so account-level diligence is still required
  notes: Matrix uses supported, unsupported, and unknown public evidence rather than private bakeoff data. Cells describe buyer-visible posture, not audited benchmark winners.
