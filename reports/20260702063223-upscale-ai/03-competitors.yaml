  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public list prices, support tiers, contract lengths, or discount ranges for Upscale, NVIDIA Spectrum-X or Quantum-X, Cisco Nexus / Silicon One, Arista Etherlink, and Nexthop AI.
    whyItMatters: Without transaction-level pricing evidence, it is impossible to know whether Upscale wins on total cost of ownership, support economics, or only on architectural messaging.
    diligencePath: Request customer quotes, list-vs-realized pricing by deal size, support-tier definitions, and renewal terms from management and channel checks.
    relatedQuestionRefs:
    - QP015
    - QP016
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-proof
    missingEvidence: Named production customers, deployment counts, win-loss data, and post-deployment support metrics for Upscale versus NVIDIA, Cisco, Arista, and Nexthop.
    whyItMatters: Competitive durability is still mostly inferred from architecture and financing because public operating proof of customer adoption remains sparse.
    diligencePath: Request reference customers, deployment stage by account, expansion or renewal data, and support SLA metrics from management.
    relatedQuestionRefs:
