      2024 seed marker while launch coverage points to Sept. 2025.
    whyItMatters: Later chapters need one canonical start-date framing for company age, execution pace, and fundraising velocity.
    diligencePath: >-
      Request certificate of incorporation, first financing close memo, and management explanation of whether Sept. 2024
      reflects an internal seed close, incubation milestone, or website timeline error.
