    - Hybrid self-build plus colocation or cloud interconnect patterns
    - Enterprise infra steering committee
    - Need for predictable latency, sovereignty, and procurement control
  - - Sovereign / public AI programs
    - National digital infrastructure authorities
    - Public-sector operations and partner integrators
    - Government budget appropriations
    - Regional capacity build with policy and sovereignty constraints
    - Public procurement authorities
    - Strategic autonomy and domestic compute capacity targets
  - - Colocation-aligned AI infra operators
    - Facility strategy teams and platform partners
    - Managed service and interconnect operations
    - Joint venture or project-finance structures
    - Provide powered shells and interconnect-rich campuses for AI tenants
    - Infrastructure investment committee
    - Anchor tenant commitments and power-availability certainty
