- id: buyer-user-payer-and-budget-owners
  title: Buyer, user, payer segmentation and adoption path
  body: 'The observable buyer map has three practical segments: hyperscalers, neocloud
    providers, and large AI infrastructure operators that include sovereign and enterprise-scale
    deployments. In each segment, daily users are infrastructure, platform, and ML
    systems teams that operate GPU clusters, while economic buyers are usually infrastructure
    or platform engineering leaders who sponsor architecture direction. Final payer
    approval typically runs through centralized capex committees or equivalent investment
    governance bodies because decisions involve multi-year hardware, facilities, and
    power commitments. Cisco’s neocloud analysis and Bain’s strategic shift framing
    both support the point that procurement is no longer ad hoc; it is tied to deployment
    model choices such as dedicated versus shared capacity, self-build versus colocation,
    and open versus vertically coupled fabrics. Adoption therefore follows a staged
    path from pilot fabric validation to production rollout, with expansion gated
    by utilization, reliability, and financing confidence rather than feature checklists
    alone.'
  claimRefs:
  - CM005
  - CM013
  - CM017
  - CM035
  - CM036
  - CM037
  tableRefs:
  - TM003
  figureRefs:
  - FM003
- id: growth-drivers-and-adoption-constraints
  title: Growth drivers, timing, and adoption constraints
  body: Growth drivers are clear but unevenly timed. IDC and Bain both indicate strong
    demand momentum from hyperscaler expansion, enterprise production AI adoption,
    and geographic diffusion beyond North America. Dell’Oro’s 2026 outlook that Ethernet
    overtook InfiniBand in AI back-end adoption adds a transport-level driver that
    favors open-networking narratives. At the same time, constraints are not secondary—they
    define conversion speed. Bain identifies power availability as the current gatekeeper
    and points to gigawatt-scale campus requirements for frontier training. TCW and
    S&P add financing and credit risk perspectives, warning that front-loaded capex
    can outpace realized monetization if utilization or demand assumptions soften.
    At the solution level, NextPlatform’s vendor-share breakout shows how fast NVIDIA
    has become a major Ethernet contender, reinforcing lock-in and switching-cost
    pressure for challengers. Upscale can benefit from open standards momentum, but
    timing risk remains dominated by power, capital, and incumbent ecosystem gravity.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM019
  - CM020
  - CM021
