- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hyperscaler and enterprise AI buildout momentum
    - Driver
    - Current through 2030
    - Sustains baseline demand for high-performance networking fabrics
    - Validate how much incremental spend lands in networking versus compute/power
      buckets
  - - Ethernet momentum in AI back-end networks
    - Driver
    - Current and near-term
    - Improves feasibility of open, multi-vendor scale-out approaches
    - Request customer proof of migrations from InfiniBand or legacy Ethernet designs
  - - Neocloud growth and diversified consumption models
    - Driver
    - Near-term growth phase
    - Expands buyer universe beyond legacy hyperscalers
    - Obtain named neocloud pipeline, conversion rates, and contract durations
  - - Power availability and gigawatt bottlenecks
    - Constraint
    - Immediate
    - Can delay deployment regardless of networking readiness
    - Collect site-level power procurement evidence and utility interconnection timelines
  - - Capital intensity and monetization uncertainty
    - Constraint
    - Immediate to medium term
    - Raises financing and return hurdles for buyers and suppliers
    - Stress-test utilization, pricing durability, and payback assumptions
  - - Switching cost and incumbent lock-in pressure
    - Constraint
    - Persistent
    - Can slow displacement even when technical performance is competitive
    - Map migration tooling, interoperability evidence, and outage-risk mitigation
      plans
  notes: Each row ties market direction to a concrete underwriting implication and
    a diligence action, rather than treating drivers as generic industry positives.
