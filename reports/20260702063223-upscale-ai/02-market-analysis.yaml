- id: contradictions-and-estimate-reconciliation
  title: Contradictory estimates and reconciliation logic
  body: 'The evidence set contains genuinely contradictory-looking numbers that should
    be preserved, not averaged away. One end of the range is narrow and operational:
    annualizing the Q1 2025 datacenter Ethernet figure yields roughly USD 27.68B,
    a plausible near-term networking run-rate lens. Another is a company-level directional
    target: Upscale’s public product framing cites a projected USD 100B AI networking
    market by 2030. Broader infrastructure lenses are much larger, including IDC’s
    >USD 1T by 2029 and MarketsandMarkets’ USD 2,023.52B by 2032 for the full AI data
    center market. These can all be simultaneously true because they measure different
    boundaries, periods, and components. The chapter therefore treats the trillion-dollar
    and multi-trillion-dollar figures as outer demand envelopes while grounding near-term
    serviceability in networking-specific and buyer-specific slices. This reconciliation
    approach is more conservative for valuation than simply selecting the largest
    headline estimate.'
  claimRefs:
  - CM018
  - CM032
  - CM033
  - CM034
- id: diligence-gaps-and-underwriting-implications
  title: Sizing and adoption diligence gaps still open
  body: Several material diligence gaps remain before market size can be translated
    into confidence on monetizable share. First, two assigned sources in the exclusive
    block (McKinsey optics analysis and IEA electricity update) were inaccessible
    in the retained pack, limiting direct quantification on supply and power constraints.
    Second, the public synopsis for ResearchAndMarkets and the empty-capture Yole
    page do not expose full paid datasets, so key subsegment splits and scenario assumptions
    cannot be independently re-run. Third, buyer-level budget mechanics are still
    inferred from analyst and ecosystem commentary rather than from disclosed procurement
    records tied to Upscale wins. Fourth, Upscale has not publicly disclosed production
    customer count, ARR, or conversion rates from evaluations to paid deployments,
    making SOM inference speculative. These gaps do not negate demand, but they increase
    sensitivity to execution and reduce confidence in any aggressive market-share
    underwriting case.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM038
tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Upscale
  rows:
  - - AI data center networking core
    - High-speed switches, routers, NIC/SmartNIC-DPU, optical interconnects, network
      OS and controls
    - Servers, GPUs/XPUs, storage media, facility construction
    - Hyperscaler infra/platform teams; capex committees
    - Primary directly addressable layer for scale-out and control-plane value
  - - Rack-scale scale-up fabrics
    - In-rack coherence/low-latency interconnect design and software orchestration
    - General-purpose compute without synchronization requirements
    - AI platform architects and systems engineering leads
    - Relevant where SkyHammer-style synchronized rack behavior is demanded
  - - Open Ethernet AI back-end fabrics
    - 800G/1.6T switching, congestion control, telemetry, SONiC operations
    - Campus/branch Ethernet and non-AI enterprise switching refresh
    - Hyperscalers, neocloud operators, large AI infra operators
    - Core battleground versus InfiniBand and vertically integrated alternatives
  - - AI infrastructure super-set (outer envelope)
    - Networking plus compute, storage, cooling, power, data-center operations
    - Consumer AI software spend, application SaaS revenue
    - CIO/CFO level investment programs
    - Useful as TAM ceiling but too broad for direct revenue translation
  - - Status-quo substitutes
    - InfiniBand-centric and proprietary scale-up stacks, retrofitted legacy Ethernet
    - N/A
    - Incumbent architecture owners
    - Defines switching cost, migration friction, and displacement difficulty
  notes: Boundary logic intentionally separates networking-attributable spend from
    broad AI infrastructure totals to avoid overstating serviceable opportunity.
