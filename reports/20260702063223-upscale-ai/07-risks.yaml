  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - AI demand-fade and utilization risk
        - Hyperscaler AI capex guidance revisions
        - Two consecutive quarters with >15% YoY capex guide cuts from top buyers
        - Freeze aggressive growth assumptions; re-underwrite downside case and financing runway.
      - - Power-constrained deployment timing
        - Grid interconnection and energization timeline drift in target regions
        - Core customer sites slip >12 months versus deployment plan
        - Shift to staged rollout assumptions; cut near-term revenue realization probability.
      - - Commercial proof shortfall
        - Named paid production deployments and repeat usage evidence
        - No named paid production deployment by 2027 H1
        - Treat GTM thesis as impaired and avoid valuation-premium underwriting.
      - - Export-control escalation
        - New controls on AI interconnect/switch classes tied to target geographies
        - Regulation blocks shipment to planned customer cohorts or supply chain nodes
        - Re-scope TAM and apply immediate haircut to growth and valuation scenario.
      - - Adverse IP event
        - Credible lawsuit, injunction request, or formal dispute by incumbent
        - Filing from NVIDIA/Cisco/Arista/Broadcom class counterparties without rapid containment
        - Add litigation reserve case and widen discount rate until path to resolution is explicit.
      - - Financing / valuation reset
        - New round pricing versus last disclosed valuation
        - Down-round or highly structured financing below prior economic baseline
        - Move recommendation to research-more/avoid pending reset-driven repricing analysis.
    notes: Triggers are intentionally monitorable before terminal outcomes so IC decisions can be revised early rather than after realized damage.
