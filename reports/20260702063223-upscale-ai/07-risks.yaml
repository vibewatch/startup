  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-enumeration
      missingEvidence: A complete legal and regulatory inventory is not available because court-docket checks and formal compliance filings were not included in the retained public pack.
      whyItMatters: The legal risk register may understate probability or severity if undisclosed matters exist outside public marketing and news artifacts.
      diligencePath: Run counsel-led litigation, sanctions, export-control, and enforcement docket scans across core jurisdictions before investment committee.
      relatedQuestionRefs:
        - QR002
        - QR005
        - QR023
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: export-control-positioning
      missingEvidence: No company-specific export-control classification matrix or external legal opinion was found for current and planned networking products.
      whyItMatters: Export-control scope can directly alter addressable market, shipment eligibility, and supply-chain continuity.
      diligencePath: Request ECCN-style mapping, legal memo, and policy-update playbook from management and outside counsel.
      relatedQuestionRefs:
        - QR003
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: litigation-docket-validation
      missingEvidence: Public-pack scanning did not include primary court-docket records or regulator enforcement databases.
      whyItMatters: A false clean-screen conclusion can materially distort legal downside estimation and reserve planning.
