  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - - SkyHammer scale-up interconnect layer
        - Provides rack-domain synchronization and peer memory access behavior
        - ASIC design execution and ecosystem alignment with open standards
        - Tape-out, validation, and deliverability risk before broad GA evidence
      - - Scale-out Ethernet switching substrate
        - Connects racks and domains for distributed training and inference
        - NVIDIA Spectrum-X silicon availability and roadmap cadence
        - Supplier concentration and limited substitution paths near term
      - - SONiC plus SAI software control plane
        - Delivers control, visibility, policy, and operational consistency
        - SONiC ecosystem maturity and upstream integration velocity
        - Feature drift, integration complexity, and support burden risk
      - - Congestion and lossless transport controls
        - Preserves deterministic behavior under collective communication load
        - Correct tuning of PFC, ECN, DCQCN, and topology-aware scheduling
        - Misconfiguration can materially degrade throughput and utilization
      - - Standards and interoperability envelope
        - Enables multi-vendor compatibility over product lifecycle
        - Maturity and adoption pace of UALink/UEC and adjacent standards
        - Spec evolution can outpace implementation, causing timing uncertainty
    notes: Architecture rows represent functional control points, not a complete internal BOM.
    enumerationScope:
