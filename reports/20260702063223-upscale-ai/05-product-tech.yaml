  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: benchmark-validation
      missingEvidence: Reproducible third-party benchmark pack for SkyHammer and Spectrum-X based scale-out systems covering latency distribution, packet loss behavior, and training throughput deltas.
      whyItMatters: Architecture-level claims are strong, but underwriting performance and reliability requires test protocols and reproducible results.
      diligencePath: Request benchmark methodology, topology specs, workload definitions, raw run outputs, and independent lab validation data.
      relatedQuestionRefs:
        - QE012
        - QE014
        - QE022
      relatedTableRefs:
        - TE001
        - TE005
    - type: concentration-risk
      severity: material
      topic: nvidia-supply-dependency
      missingEvidence: Contractual and operational detail on NVIDIA Spectrum-X supply commitments, lead times, substitution options, and allocation protection.
      whyItMatters: Scale-out roadmap and revenue timing are exposed to third-party silicon availability and partner-prioritization dynamics.
      diligencePath: Request supply agreements, forecast assumptions, dual-source plans, and stress scenarios for delayed or constrained silicon allocation.
      relatedQuestionRefs:
        - QE015
        - QE016
        - QE018
      relatedTableRefs:
        - TE003
    - type: standards-maturity
      severity: medium
      topic: interoperability-proof
      missingEvidence: Public conformance matrices for UALink/UEC/ESUN implementations and cross-vendor interoperability test outcomes.
      whyItMatters: Open-standards differentiation depends on realized interoperability rather than roadmap intent.
      diligencePath: Request standards test reports, partner interoperability results, certification status, and release gates tied to standards revisions.
      relatedQuestionRefs:
        - QE008
        - QE017
      relatedTableRefs:
        - TE003
        - TE004
    - type: assurance-gap
      severity: material
      topic: trust-security-compliance
      missingEvidence: Formal security and compliance evidence such as SOC2 or ISO audits, secure development lifecycle controls, and vulnerability response policy metrics.
      whyItMatters: Enterprise and regulated buyers often require assurance artifacts before production adoption at scale.
      diligencePath: Request compliance audit reports, SDL policy documents, incident response metrics, and customer-facing security commitments.
      relatedQuestionRefs:
        - QE019
        - QE025
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: customer-production-proof
      missingEvidence: Named production customers, deployment-stage distribution, and post-deployment reliability and utilization outcomes.
      whyItMatters: Current evidence supports architecture plausibility but not repeatable commercial execution quality.
      diligencePath: Request customer reference list, pilot-to-production conversion data, uptime and MTTR dashboards, and renewal/expansion performance.
      relatedQuestionRefs:
        - QE023
        - QE026
      relatedTableRefs:
        - TE002
        - TE005
