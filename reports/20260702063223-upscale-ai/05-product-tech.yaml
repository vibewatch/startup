figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Upscale's disclosed stack links scale-up and scale-out networking through a shared software and standards posture, with silicon and systems as the delivery foundation.
    data:
      layers:
        - label: SkyHammer scale-up fabric
          detail: Memory-semantic, low-latency rack-scale interconnect intended to keep XPUs synchronized as one coherent machine.
        - label: Scale-out Ethernet (Spectrum-X silicon)
          detail: Open Ethernet cluster fabric built on NVIDIA Spectrum-X switching for multi-rack AI deployments.
        - label: SONiC NOS plus SAI operating layer
          detail: AI-optimized software, control, telemetry, and policy substrate spanning scale-up and scale-out environments.
        - label: Open standards envelope (UALink, UEC, ESUN)
          detail: Interoperability posture intended to preserve heterogeneous accelerator and ecosystem flexibility.
        - label: Silicon and systems execution base
          detail: Productization depends on ASIC, hardware systems, and lifecycle integration capabilities.
    approximationNotes: Stack reflects publicly stated architecture intent and does not imply exact internal component ownership boundaries.
    claimRefs:
      - CE004
      - CE007
      - CE009
      - CE011
      - CE024
