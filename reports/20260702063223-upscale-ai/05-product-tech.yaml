  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow pain
      - Company solution
      - Measurable benefit signal
      - Limitation
    rows:
      - - Synchronized large-model training
        - East-west collective traffic stalls GPUs when latency jitter or packet loss appears
        - SkyHammer scale-up with memory-semantics and deterministic communication
        - Claimed sub-microsecond class behavior and lower idle GPU cycles
        - No public benchmark trace tying claim to specific training jobs
      - - Production inference token serving
        - Throughput and tail-latency degrade at production concurrency
        - Scale-out Ethernet plus AI-optimized SONiC operating controls
        - Claimed low-latency high-throughput inference at scale
        - No named customer KPI baseline or before/after case study
      - - Heterogeneous cluster expansion
        - Proprietary fabrics can constrain mix-and-match accelerator strategy
        - Open standards posture across ESUN, UALink, UEC, SONiC, and SAI
        - Vendor optionality and lifecycle flexibility narrative
        - Interop depth not quantified by public certification matrix
      - - Multi-tenant vPod orchestration
        - Mesh links complicate secure partitioning and dynamic resizing
        - Switched topology approach with any-to-any one-hop pattern
        - Claimed better isolation and flexible autoscaling
        - Claims are technical-theory heavy with limited production references
      - - Day-2 operations and troubleshooting
        - AI fabrics need continuous congestion and reliability visibility
        - Integrated telemetry and operations layer across stack
        - Claimed operational consistency from rack to cluster
        - No public incident-rate, MTTR, or uptime metrics
    notes: Benefits are stated as directional external signals, not audited customer outcomes.
    enumerationScope:
      coverage: partial
      basis: Rows cover major workflows described in retained sources, while additional niche deployment patterns may exist in private design-partner programs.
