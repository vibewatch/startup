    rows:
      - - SkyHammer scale-up fabric
        - Hyperscaler and neocloud AI infrastructure architects
        - Architecture unveiled; release targeted in 2026; production proof undisclosed
        - Memory-semantics, deterministic scale-up, coherent-machine design goal
        - No published third-party benchmark suite or named production customer
      - - Open Ethernet scale-out systems
        - Cluster network operators running multi-rack AI fabrics
        - Announced March 2026 with NVIDIA partnership; early deployment claims
        - Spectrum-X silicon plus AI-optimized SONiC and interoperable Ethernet posture
        - Dependency on NVIDIA silicon supply and roadmap
      - - Unified SONiC / SAI operating substrate
        - NetOps and platform reliability teams
        - Publicly described and promoted across resources/videos
        - Common control and telemetry plane across scale-up and scale-out
        - No public feature matrix, upgrade policy metrics, or SLA telemetry baselines
      - - Open standards interoperability layer
        - Platform engineering teams with heterogeneous ASIC roadmaps
        - Public standards-support claim set; implementation depth undisclosed
        - ESUN, UALink, UEC, SONiC, SAI support narrative for multi-vendor optionality
        - Conformance, certification, and compatibility test artifacts not published
      - - Lifecycle services and integration support
        - Enterprises and neoclouds lacking deep in-house SONiC integration capacity
        - Positioned as part of solution story; commercial terms undisclosed
        - Bridges hardware and software operations for adoption beyond hyperscalers
        - No public support-tier definitions, response SLAs, or renewal statistics
