companyProfile:
  summary: Upscale AI is a founder-led AI networking infrastructure company whose public story centers on SkyHammer for memory-semantic scale-up and on NVIDIA Spectrum-X plus SONiC-based scale-out systems for heterogeneous AI clusters. It has raised $500 million at a $2 billion valuation and appears engaged with hyperscaler and neocloud prospects, but public evidence still does not disclose revenue, customer count, headcount, or broad production proof.
  foundedDate: '2025-09-17'
  founders:
    - name: Barun Kar
      role: Co-founder and CEO
      background: Primary operating and fundraising face; public coverage ties him to Palo Alto Networks and Auradine.
      claimRefs: [CO026, CO028]
    - name: Rajiv Khemani
      role: Co-founder and Executive Chairman
      background: Repeat networking founder tied to Innovium, Cavium, and Auradine.
      claimRefs: [CO027, CO029]
  foundingLocation: Palo Alto, California, USA
  headquarters: Santa Clara, California
  productSummary: Upscale AI sells AI networking systems spanning SkyHammer, a memory-semantic scale-up architecture for synchronized rack-scale fabrics, and open Ethernet scale-out systems built on NVIDIA Spectrum-X switch silicon with a SONiC-based operating stack.
  customerFocus: Hyperscalers, neocloud/AI-first cloud providers, and large AI infrastructure operators.
  businessModel: Sales of AI networking silicon, systems, software, and lifecycle support/services; public monetization metrics remain undisclosed.
  stage: Series A-1 private
  fundingStatus: Seed launch with >$100M in September 2025, a $200M Series A in January 2026, and a $190M Series A-1 in June 2026; total funding stands at $500M at a $2B valuation.
  disclosureProfile: private-undisclosed
