  topStrengths:
    - AI-networking demand tailwinds are real, with AI infrastructure spend rising and Ethernet gaining share in AI back-end networks.
    - Upscale has raised $500M at a $2B valuation, giving it unusual execution runway for an early-stage networking company.
    - The company combines credible networking founders, a deepening technical bench, and an open-standards product thesis across scale-up and scale-out fabrics.
  topRisks:
    - Public evidence still does not disclose revenue, ARR, gross margin, or other core commercial metrics needed to underwrite a $2B entry.
    - Named production customers, customer count, headcount, and independent benchmark proof remain undisclosed or sparse.
    - Scale-out execution depends on NVIDIA-linked inputs while power bottlenecks and broader AI-capex cycles can delay deployments and compress valuation.
  unresolvedGaps:
    - Revenue, ARR, gross margin, burn, runway, and current headcount remain undisclosed.
    - Named production customers, customer count, and pilot-versus-production conversion are not public.
    - Board composition, ownership concentration, liquidation preferences, and Series A-1 control terms are undisclosed.
    - Independent production-scale benchmark and reliability data for SkyHammer and the scale-out stack are still lacking.
