- id: scenario-and-comparable-analysis
  title: Scenario and comparable analysis
  body: Scenario work is more honest here than false precision. There is not enough public revenue or margin evidence to backsolve
    a defensible ARR multiple, and there is not enough contract disclosure to map downside protection cleanly. The better
    approach is to anchor on milestone logic and relative peer signaling. In the bull case, Upscale converts present evaluations
    into named production deployments, discloses enough revenue quality to reduce the proof discount, and benefits from continued
    capital formation across AI networking and interconnect peers. In that state, the company could plausibly earn a valuation
    more consistent with the direct or adjacent multibillion-dollar private peer set. In the base case, Upscale keeps strategic
    relevance but only gradually closes the proof gap, which leaves the current price merely arguable rather than compelling.
    In the bear case, the missing metrics stay missing while macro, power, or supplier frictions intensify, and the headline
    valuation loses support faster than the category narrative can replace it. The comparable set is therefore useful as a
    ceiling and context setter, not as a shortcut to a buy decision.
