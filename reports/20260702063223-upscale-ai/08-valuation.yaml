  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-gap
    missingEvidence: Current ARR, gross margin by product line, support attach, deployment services mix, burn, and runway
      by quarter.
    whyItMatters: Without unit economics, the committee cannot convert the $2B price into a risk-adjusted underwriting case.
    diligencePath: Request current board package, cohort revenue bridge, gross-margin waterfall, and a 12-month cash runway
      model.
    relatedQuestionRefs:
    - QV007
    - QV008
    - QV028
  - type: private-evidence-only
    severity: blocking
    topic: customer-proof-gap
    missingEvidence: Named production customers, paid deployment count, expansion history, and top-customer concentration
      by revenue.
    whyItMatters: The central valuation dispute is whether Upscale has crossed from architecture promise into repeatable commercial
      proof.
    diligencePath: Request customer reference calls, active pipeline by stage, signed deployment schedules, and concentration
      metrics for the top five accounts.
    relatedQuestionRefs:
    - QV005
    - QV006
    - QV026
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: financing-terms-gap
    missingEvidence: Liquidation preferences, anti-dilution protections, board-control rights, participation rights, and any
      structured downside terms in the 2026 financing stack.
    whyItMatters: Headline valuation can overstate common-equivalent value if senior investors receive strong downside protection.
    diligencePath: Review the latest term sheet, cap table, investor-rights agreement, and any side letters tied to the extension
      round.
    relatedQuestionRefs:
    - QV012
    - QV015
    - QV029
    relatedTableRefs:
    - TV001
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-coverage-gap
    missingEvidence: Public revenue, margin, and volume-deployment data for the private comparable set, especially direct
      networking peers.
    whyItMatters: Private-round headlines are informative but insufficient for apples-to-apples valuation work without economics
      and milestone context.
    diligencePath: Collect private comp operating metrics from management, investor references, or confidential market checks
      before relying on a comps-based mark.
    relatedQuestionRefs:
    - QV016
    - QV017
    - QV021
    - QV025
    relatedTableRefs:
    - TV004
