- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue quality
    - Current ARR or revenue run-rate, by product and customer cohort.
    - Needed to test whether $2B is growth-backed or narrative-backed.
    - 'Finance room: board package, cohort bridge, and current-quarter close.'
  - - Margins and services mix
    - Gross margin by hardware, software, and services plus support attach rates.
    - Valuation quality depends on whether revenue is scalable or labor-heavy.
    - 'Finance + product ops: margin waterfall and support economics.'
  - - Customer proof
    - Named production customers, deployment count, and expansion history.
    - The biggest gap between thesis and anti-thesis is commercial proof.
    - 'Sales room: references, contracts, and live deployment timelines.'
  - - Financing terms
    - Preferences, participation rights, anti-dilution, and board-control terms.
    - Headline valuation is incomplete without common-equivalent economics.
    - 'Legal room: cap table, term sheet, and investor-rights docs.'
  - - Concentration
    - Top-customer revenue share, pipeline conversion by buyer type, and cancellation exposure.
    - Hyperscaler and neocloud focus can be attractive but fragile.
    - 'Revenue ops: concentration report and pipeline aging.'
  - - Execution readiness
    - Manufacturing, supply, and power dependencies by program.
    - Scenario timing changes quickly if deployments slip for non-product reasons.
    - 'Operations diligence: supplier map, deployment Gantt, and contingency plans.'
  notes: The asks are intentionally sparse and high leverage. If management cannot satisfy them, the public file alone is
    not enough to justify the present valuation.
