tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - What supports it
  - Why it is not stronger
  - IC implication
  rows:
  - - Recommendation
    - Track
    - Category tailwinds and capital strength are real.
    - Commercial proof is still too thin for a buy call.
    - Monitor, do not lead or aggressively follow at current terms.
  - - Confidence
    - Medium
    - Multiple independent sources agree on funding, market tailwinds, and proof gaps.
    - Core underwriting metrics are still private.
    - Advance only through diligence-based upgrade, not narrative conviction.
  - - Risk rating
    - High
    - Macro, power, supplier, and proof risks can all hit value.
    - Few public metrics offset those risks.
    - Require tight downside discipline and clear milestone gates.
  - - Valuation stance
    - Stretched
    - Peer rounds show category investors will pay multi-billion prices.
    - Upscale has less public revenue and customer proof than the current price implies.
    - Do not treat the $2B mark as obviously cheap.
  - - Upgrade trigger
    - Named production customers plus disclosed economics
    - Those items would close the main proof gap.
    - They are not yet public.
    - Re-open the case quickly if delivered.
  - - Immediate action
    - Diligence before capital
    - Information asymmetry is the bottleneck, not lack of interest.
    - Headline momentum can mask structured downside or slow conversion.
    - Stay engaged, but price discipline comes first.
  notes: Summary judgments are public-evidence based as of 2026-07-02; they are not a substitute for management-room diligence
    or term-sheet review.
