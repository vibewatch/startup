- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Factor
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market demand
    - AI infrastructure spending and networking demand are scaling quickly.
    - Category growth can still outrun monetization and create overbuild risk.
    - Sustained buyer conversion and utilization proof beyond capex headlines.
  - - Product relevance
    - Upscale addresses both scale-up and scale-out pain points with open-standards positioning.
    - The stack still depends partly on NVIDIA-linked inputs and faces strong substitutes.
    - Independent benchmark and deployment evidence proving differentiated outcomes.
  - - Capital base
    - Half a billion dollars of disclosed funding gives real development runway relative to ordinary startups.
    - Capital strength does not prove product-market fit or margin quality.
    - Quarterly revenue, gross margin, and burn disclosure showing efficient conversion.
  - - Commercial proof
    - Evaluations and deployments are underway in attractive buyer cohorts.
    - No named production customers, customer count, or public NRR are visible.
    - Named references, paid production count, and expansion history.
  - - Valuation
    - Current price sits below some better-known AI-networking and interconnect peer valuations.
    - The proof gap is larger than the headline discount suggests.
    - Either a better price or materially stronger economics disclosure.
  notes: 'The anti-thesis column is intentionally decision-oriented: it highlights the evidence missing from a true underwriting
    case, not generic startup risk.'
