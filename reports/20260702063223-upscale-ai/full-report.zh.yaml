              法律和监管清单目前负面筛查看起来干净，但尚未完全关闭。留存公开材料没有识别出活跃诉讼，但这不等于案卷层面的清白，尤其是在既有网络厂商和芯片供应商持有大量专利组合、可围绕架构、软件互操作性或标准必要接口发起诉讼的市场里。出口管制暴露是另一个不可忽视变量：AI
              网络硬件和高级互连路径可能被纳入不断演进的政策控制，间接影响芯片可得性、区域覆盖和客户资格。参与 SONiC 和 OCP 标准有助于降低专有锁定，但一条被引用的 SONiC 伙伴新闻 URL
              已失效，削弱公开可验证性，也提示文档卫生风险。在依赖层面，NVIDIA 集中是最直接风险，因为 Upscale 已披露的横向扩展路径把产品交付绑定到第三方路线图、供应和定价决策；同时 NVIDIA 在更广泛的
