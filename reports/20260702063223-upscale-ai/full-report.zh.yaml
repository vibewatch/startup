  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              本章的严重程度排序，不按抽象概率本身，而按风险传导到收入时点、融资灵活性和估值韧性的速度。最高优先级风险簇是宏观需求与基础设施耦合：多个独立来源警告，AI
              基础设施支出可能跑过变现；电力可得性和互连时间线也已成为数据中心扩张的实际闸门。对 Upscale AI
              来说，这意味着即便产品性能很强，需求暂停或通电延迟也会打击订单速度。第二个风险簇是战略依赖：横向扩展执行当前搭在 NVIDIA Spectrum-X
              芯片上，而同一生态也包含直接竞争者和重叠投资人，带来供应集中和冲突风险。第三个风险簇是执行与披露：收入前状态、已点名生产证明有限、治理透明度不完整，会提高外部负面冲击转化为降估值融资压力的概率。缓释成熟度在多元化和标准工作已展开的地方最强；在结果取决于监管机构、法院、公用事业公司或超大规模云预算周期的地方最弱。
