      - number: '8.3'
        title: 情景与可比公司分析
        blocks:
          - type: paragraph
            body: >-
              在这里，做情景分析比追求虚假的精确更诚实。公开收入或利润率证据不足，无法反推出站得住的 ARR 倍数；合同披露也不够，无法清楚画出下行保护。更好的做法，是锚定里程碑逻辑和同业相对信号。乐观情景下，Upscale
              把当前评估转成具名生产部署，披露足够的收入质量来降低证据折价，并受益于 AI 网络和互连同业持续形成资本。在这种状态下，公司有可能拿到更接近直接或相邻多十亿美元私有同业组的估值。基准情景下，Upscale
              保持战略相关性，但只是逐步缩小证据缺口，使当前价格只能说有讨论空间，而不是令人信服。悲观情景下，缺失的指标继续缺失，宏观、供电或供应商摩擦加剧，名义估值失去支撑的速度会快过赛道叙事补位。可比公司组因此适合作为上限和背景坐标，而不是通往买入决策的捷径。
