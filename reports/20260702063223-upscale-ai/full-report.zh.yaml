      - number: '4.3'
        title: 成本结构、资本强度和交付经济性
        blocks:
          - type: paragraph
            body: >-
              即便收入规模未知，Upscale 的交付模型看起来也具有结构性资本强度。公司营销的不是软件本身，而是 AI 网络系统，覆盖定制纵向扩展架构、与 NVIDIA
              相关的横向扩展硬件、软件控制平面和生命周期服务。它自己的技术文字强调性能、运营灵活性、token 经济性、TCO 和供应商可选性，这意味着产品承诺隐含大量工程、验证和支持负担。公开可比公司说明了原因。Arista
              的申报文件显示，成熟网络厂商可以把收费支持收入递延一到三年，通过合同制造商和商用芯片供应商承担成本，并在大客户处承受折扣压力。这不是 Upscale
              自身会计的证明，但可以保守代理网络创业公司可能面对的毛利率和营运资本复杂度。行业背景让图景更难。IDC 和 Futurum 显示需求底色巨大，但 Data Center
              Frontier、CapitalSight、S&P、TCW、Cresset 和 IEEE 都警告，电力、组件瓶颈、过度建设、杠杆和变现滞后可能扭曲回报。正确推断是：Upscale
              可能处在有吸引力的类别中，却仍会因供应商权力、支持义务和部署时点面临真实毛利率与交付经济性风险。
