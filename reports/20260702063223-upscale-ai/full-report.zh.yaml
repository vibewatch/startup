      - number: '7.4'
        title: 缓释成熟度、监测指标和叫停标准
        blocks:
          - type: paragraph
            body: >-
              缓释措施要按可控性来判断。Upscale
              能直接改善执行规范、披露质量、合作伙伴多元化、基准测试透明度和应急规划；但电网排队、既有厂商的法律姿态、超大规模云厂商资本开支周期，并不由它直接控制。因此，本章把缓释成熟度和剩余风险拆开，并把资本投入前就能监测的叫停标准写清楚。成熟度高的缓释包括更深入参与标准、多伙伴商业化路径选择，以及在创始人之外扩充管理梯队。成熟度中等的缓释包括为零部件和晶圆代工风险预留采购与路线图缓冲。成熟度低的领域是出口管制走向、诉讼时间表和
              AI 需求整体回撤。投资流程纪律的关键不是等到终局：一旦出现资本开支指引下调、核心区域供电周期拉长、在既定检查点前拿不出生产环境证据，或发生不利法律 /
              监管事件，投资逻辑破裂触发项就应启动。证据仍只停留在私下材料时，尽调问题必须写得足够明确，让未解决的不确定性保持可见，而不是被默认为正常。
