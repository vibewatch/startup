      - number: '2.5'
        title: 相互矛盾的估算和调和逻辑
        blocks:
          - type: paragraph
            body: >-
              证据集中确实存在看似矛盾的数字，应该保留，而不是平均抹平。区间一端很窄、偏运营：把 2025 年 Q1 数据中心以太网数字年化，可得约 USD
              27.68B，是一个合理的近端网络运行率口径。另一端是公司层面的方向性目标：Upscale 的公开产品框架引用了到 2030 年 USD 100B 的 AI 网络市场预测。更宽的基础设施口径大得多，包括 IDC
              到 2029 年超过 USD 1T 的 AI 基础设施预测，以及 MarketsandMarkets 到 2032 年 USD 2,023.52B 的完整 AI
              数据中心市场预测。它们可以同时为真，因为衡量边界、时期和组件不同。因此，本章把万亿美元和数万亿美元级数字视为外层需求包络，同时把近端可服务性落在网络特定和买方特定切片上。相比简单选择最大标题数字，这种调和方法对估值更保守。
            claimRefs:
              - CM018
              - CM032
              - CM033
              - CM034
      - number: '2.6'
        title: 规模测算与采用尽调仍未关闭的缺口
        blocks:
          - type: paragraph
            body: >-
              市场规模转化为可变现份额信心之前，仍有几个实质尽调缺口。第一，独家区块中的两份指定来源（McKinsey 光学分析和 IEA
              电力更新）在留存材料中无法访问，限制了对供给和电力约束的直接量化。第二，ResearchAndMarkets 的公开摘要和抓取为空的 Yole
              页面没有暴露完整付费数据集，关键子分段拆分和情景假设无法独立重跑。第三，买方层面的预算机制仍来自分析师和生态评论推断，而不是与 Upscale 赢单绑定的已披露采购记录。第四，Upscale
              尚未公开披露生产客户数、ARR 或从评估转为付费部署的转化率，使 SOM 推断带有投机性。这些缺口不否定需求，但会放大对执行的敏感性，并降低任何激进市场份额承保案例的可信度。
