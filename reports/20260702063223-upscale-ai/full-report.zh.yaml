  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重程度
      - 公开证据
      - 缓释 / 尽调要求
    rows:
      - - 开放标准 AI 网络定位
        - 开放标准也会降低切换成本，帮助大型在位厂商销售类似的开放网络结构
        - 高
        - 当开放性成为买方预期，UEC、UALink、Cisco、Arista、Broadcom 生态和商用芯片渠道都会受益。
        - 要求管理层说明，标准之上的专有价值落在哪里：软件、验证、scale-up IP、支持 SLA，还是供应准入
      - - 简化 SONiC 和多供应商网络结构的交钥匙方案
        - 超大规模云厂商可以自行集成，在位厂商也已运营成熟控制栈
        - 高
        - Next Platform 强调内部设计能力，Cisco 和 Arista 则营销成熟运营套件
        - 要求提供赢单 / 输单案例，证明 Upscale 曾靠运营简单性替代内部自建或在位厂商开放以太网
      - - SkyHammer scale-up 差异化
        - NVLink 和 InfiniBand 在最高性能参考架构中仍根深蒂固
        - 高
        - NVIDIA 仍锚定专有 scale-up 和 InfiniBand 现状；UALink 是生态努力，不是 Upscale 自有标准
        - 要求提供第三方基准、出货时间表和客户验证，比较 SkyHammer 与专有替代方案
      - - NVIDIA scale-out 合作
        - 供应商重叠意味着 Upscale 依赖的公司也在销售竞争性端到端栈
        - 高
        - Upscale 当前 scale-out 叙事使用 NVIDIA Spectrum-X 交换芯片，而 NVIDIA 直接销售 Spectrum-X
        - 询问第二来源策略、长期供货协议，以及 Upscale 如何避免沦为转售加软件层
      - - 强融资和生态信号
        - 资本和标准参与并不会自动证明安装基础耐久或留存
        - 中高
        - Upscale 融资动能强，但在位厂商仍控制主要分销和部署足迹
        - 要求提供部署数量、支持指标、续约和扩张数据，不要把融资当作护城河证据
      - - SONiC 治理和开源参与
        - 社区影响力不会自动转化为企业信任或可变现锁定
        - 中
        - Premier 会员和董事会 / 委员会角色体现影响力，但不证明公开收入捕获或粘性
        - 询问社区贡献如何映射到专有支持、测试、遥测和付费生命周期服务
      - - 面向未来的互联叙事
        - 芯片和光学路线图可能把差异化推向组件供应商，而不是网络结构编排者
        - 中高
        - NVIDIA 和商用芯片生态已在规模推进光子和共封装光学路线
        - 随着光学和芯片转型加速，跟踪 Upscale 是否拿到合作伙伴准入和路线图影响力
      - - 多供应商灵活性
        - 如果每个可信供应商都能承诺灵活性，市场可能奖励分销和支持深度，而不是初创创新
        - 高
        - 开放以太网、UEC、商用芯片和初创同业都在营销灵活性
        - 压测 Upscale 能否证明部署时间更短、可靠性更好，或拥有能扛过商品化的差异化 scale-up 路线图
    notes: 严重程度按对赢率、定价权和长期相关性的承保影响来判断，而不是按绝对技术优劣。核心问题是：Upscale 能在哪里制造锁定，同时又不重建买方声称想避开的封闭栈。
