      - number: '3.4'
        title: 转换成本、锁定、护城河耐久性和负面信号
        blocks:
          - type: paragraph
            body: >-
              护城河问题的重点，不是 Upscale 的叙事是否自洽，而是买方部署生产集群后，耐久转换成本究竟落在哪里。最强锁定仍属于 NVIDIA，因为
              GPU、NIC、传输、管理和参考架构选择彼此强化；在那套体系内标准化的买方，可以推迟许多集成决策，也接受更少供应商。内部自建是第二大威胁，因为超大规模云厂商和最大型云建设者可以组合商用芯片、开放 NOS
              软件和定制运维栈，而不必支付创业公司的集成利润。开放以太网和标准组织通过削弱协议锁定帮助 Upscale，但也制造商品化风险：如果 Cisco、Arista、Broadcom 阵营生态和 Nexthop
              都能提供可信开放 fabric，Upscale 的护城河就必须来自执行速度、生命周期支持和独特纵向扩展
              IP，而不能只靠开放性。公开层面，护城河尚未被证明。公司融资和生态信号很强，但材料包仍缺少已点名生产客户、部署数量、支持指标或公开定价。上行情形是 SkyHammer
              及其开放标准纵向扩展路径按时出货，在专有性能和开放生态之间架起差异化桥梁。负面情形是 Upscale 变成一层薄的系统与软件，被更强芯片供应商、既有交换机厂商、相邻光学创新者和自行集成的买方挤压。
