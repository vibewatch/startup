      - number: '1.3'
        title: 融资、阶段和规模信号
        blocks:
          - type: paragraph
            body: >-
              资本形成是 Upscale AI 公开记录中最强的外部证明。公司 2025 年 9 月以超过 $100M 种子轮亮相，2026 年 1 月完成超额认购的 $200M Series A，随后在 2026 年 6
              月追加 $190M Series A-1 延伸轮，使披露的累计融资达到 $500M，估值 $2B。这个速度重要，因为它把 Upscale 从轻资本设计阶段创业公司，重新定位成一家重资本私营扩张公司，且所处赛道是
              AI 里基础设施投入最重的部分之一。投资人图谱也随时间显著扩宽：Mayfield 和 Maverick Silicon 锚定种子轮；Tiger Global、Premji Invest 和 Xora
              Innovation 领投 Series A；Premji 回归领投 A-1，同时 Nvidia、Salesforce Ventures、Seligman Ventures 和 Temasek
              加入。官方产品与融资页面称，客户评估和部署正在超大规模云厂商与 neocloud 云服务商中推进；方向上有价值，但公司仍未公布已点名生产客户、收入、ARR
              或当前员工数。因此，截至报告日最有支撑的阶段描述是：一家达到独角兽规模、资产负债表支持异常深的私营 Series A-1 公司，但运营指标披露仍很轻。一个小但值得注意的网页新鲜度问题强化了这份谨慎：6
              月延伸轮后，公司更广泛叙事已转向 $500M 以上融资，但部分官方产品页面仍显示累计融资 $300M。
