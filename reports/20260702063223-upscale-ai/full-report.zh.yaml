  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Upscale 如何把买方需求转为产品、软件和服务收入；公开证据仍无法解释实际定价和毛利。
    data:
      nodes:
        - id: buyer
          label: 目标买方
          detail: 寻求开放异构 AI 网络的超大规模云厂商、新云厂商、企业或 AI 基础设施运营方。
        - id: design
          label: 架构 / 设计选择
          detail: 客户选择纵向扩展、横向扩展或两者兼用，通常处于高接触部署场景。
        - id: scaleup
          label: 纵向扩展系统
          detail: SkyHammer 和机架级 fabric 面向同步训练、内存中心型工作负载，构成收入路径。
        - id: scaleout
          label: 横向扩展系统
          detail: 基于 Spectrum-X 的 Ethernet 系统，以及集成式开放 fabric 部署。
        - id: software
          label: 软件 / 控制平面
          detail: 基于 SONiC 的基底、遥测、拥塞控制，以及跨 fabric 的运行一致性。
        - id: services
          label: 生命周期服务
          detail: 为缺少深厚内部网络工程能力的客户提供支持、集成、可靠性和运营协助。
        - id: revenue
          label: 确认收入
          detail: 公开来源展示了收入触点，但没有披露合同节奏、支持递延或实际 ASP。
        - id: profit
          label: 毛利
          detail: 毛利取决于 BOM、支持负担、供应商条款和折扣，这些仍未公开。
