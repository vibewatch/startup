  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Upscale AI 的产品最好理解为 AI 集群工作流优化器，而不是独立交换机
              SKU。公开解决方案叙事从两个反复出现的客户任务出发：同步模型训练和规模化生产推理。在这两个工作流里，网络被呈现为加速器、内存和存储之间的吞吐闸门。Upscale 的框架是，传统通用 fabric
              为突发南北向流量而建；AI 工作负载则产生确定性的东西向集合交换，单个停滞流就可能让昂贵 GPU 容量闲置。这个框架导向双域产品定义：SkyHammer
              负责机架级纵向扩展，开放以太网横向扩展系统负责多机架集群扩张。跨页面和演讲的运营承诺一致：让大型加速器集合保持同步，在负载下保留可预测延迟，并提供开放标准路径，让运营方在硬件迭代时无需替换整张
              fabric。仍缺少的，是这些结果已在已点名生产部署中落地的硬公开证明。
