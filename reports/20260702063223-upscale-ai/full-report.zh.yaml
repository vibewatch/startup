        - 显示相邻互连赢家能拿到很高的后期估值标记。
        - 共封装光学与 AI 网络 fabric 不是同一个商业产品品类。
    notes: 这张表是语境工具，不是捷径式可比公司表。私募轮标题缺少标准化收入、利润率和优先权披露，因此更多给出叙事边界，而不是公允价值。
