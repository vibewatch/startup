      - number: '7.3'
        title: 运营、财务和执行风险
        blocks:
          - type: paragraph
            body: >-
              在这条投资逻辑里，运营风险和财务风险紧紧绑在一起，因为 Upscale AI 正在一个本身受基础设施约束的赛道里，推进一条重资本路线图。数据中心供电瓶颈、零部件供给从芯片转向封装基板 / 光模块 /
              电源模块的变化，以及漫长的集成周期，都可能把客户部署时间往后推；公司还未产生收入，进度一滑，马上会变成烧钱周期风险。产品层面同样如此：自研芯片和系统执行要面对流片、良率、验证和可靠性不确定性，公开基准测试深度和具名生产证据仍有限。管理层补强之后，人员风险有所改善，但创始人在战略叙事和利益相关方信心中的集中度仍然不低。财务上，在大范围公开商业证据出现之前就拿到
              $2 billion 估值，会放大公司对宏观情绪的敏感度：如果超大规模云厂商的利用率或变现叙事走弱，降轮和利润率挤压压力可能同时出现。Upscale 对外网页还带来一个小但真实的采购观感警示：已核查的
              about、team 和 contact 页面返回 404；公司托管的一篇 Fortune 标题页，在留存摘录里没有正文。核心含义是，执行纪律必须足够强，不能让外部周期波动来决定融资结果。
