  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心下行情境从宏观需求和基础设施约束传导到部署节奏、利润率、融资和估值结果。
    data:
      nodes:
        - id: demand
          label: AI 需求与变现不确定性
          detail: 资本开支可能跑在实际企业 ROI 和利用率前面。
        - id: power
          label: 电力与并网约束
          detail: 电网周期越来越决定 AI 数据中心能否按时就绪。
        - id: supply
          label: 组件与代工约束
          detail: 瓶颈从 GPU 扩散到基板、光模块和电力系统。
        - id: deployment
          label: 部署时点风险
          detail: 站点就绪度和硬件可用性会推迟客户上线日期。
        - id: revenue
          label: 收入确认风险
          detail: 部署延误会把订单和现金兑现往后推。
        - id: margin
          label: 利润率压缩风险
          detail: 竞争和加急采购会抬高服务成本。
        - id: financing
          label: 融资与资金续航风险
          detail: 烧钱仍在继续，而验证里程碑却延后。
        - id: valuation
          label: 估值重置风险
          detail: 证据薄弱叠加宏观谨慎，可能迫使融资估值下调。
        - id: recommendation
          label: 投资含义
          detail: 一旦触发条件被突破，投委会立场必须收紧。
      edges:
        - from: demand
          to: revenue
          label: 订单流转趋弱
        - from: power
          to: deployment
          label: 通电延迟
        - from: supply
          to: deployment
          label: 建设 / 验证延误
        - from: deployment
          to: revenue
          label: 确认时点右移
        - from: supply
          to: margin
          label: 投入和应急成本上升
        - from: demand
          to: margin
          label: 价格压力
        - from: revenue
          to: financing
          label: 资金续航缩短
        - from: margin
          to: financing
          label: 现金消耗加速
        - from: financing
          to: valuation
          label: 重新定价压力
        - from: valuation
          to: recommendation
          label: 更严格入场纪律
        - from: revenue
          to: recommendation
          label: 证据门槛检查
    approximationNotes: 因果链接代表尽调监控中的风险传导假设，不是确定性预测。
    claimRefs:
      - CR006
      - CR024
      - CR026
      - CR027
      - CR030
      - CR038
      - CR039
      - CR040
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: standard
    summary: Upscale 的交付路径依赖一组集中的生态节点；其中任何一个失灵，都可能迅速传导为执行和估值风险。
    data:
      nodes:
        - id: upscale
          label: Upscale AI 执行核心
          detail: 公司在纵向扩展、横向扩展和商业化上的路线图。
        - id: nvidia
          label: NVIDIA 网络栈
          detail: 横向扩展路径上的供应商和生态依赖。
        - id: foundry
          label: 代工与先进封装链
          detail: 芯片雄心背后的制造依赖。
        - id: standards
          label: SONiC 与 OCP 生态
          detail: 开放标准可信度和互操作性层。
        - id: buyers
          label: 超大规模云厂商与新云服务商买方
          detail: 集中的需求基础和采购关口。
        - id: grid
          label: 公用事业与电网运营方
          detail: 客户部署中的通电时点约束。
        - id: capital
          label: 私募资本提供方
          detail: 资金连续性和估值支撑。
        - id: legal
          label: 法院与监管体系
          detail: 出口管制和 IP 争议路径。
        - id: outcome
          label: 收入与估值结果
          detail: 对增长耐久性和投委会决策的合并影响。
      edges:
        - from: nvidia
          to: upscale
          label: 供应商集中
        - from: foundry
          to: upscale
          label: 芯片进度风险
        - from: standards
          to: upscale
          label: 互操作性可信度
        - from: buyers
          to: outcome
          label: 需求集中
        - from: grid
          to: buyers
          label: 部署就绪度
        - from: upscale
          to: outcome
          label: 执行质量
        - from: capital
          to: upscale
          label: 资金续航支持
        - from: legal
          to: upscale
          label: 合规与争议负担
        - from: nvidia
          to: outcome
          label: 供应与战略冲突
        - from: grid
          to: outcome
          label: 通电延迟影响
    approximationNotes: 依赖边概括公开证据中观察到的关键外部关系，并凸显公司控制力有限的环节。
    claimRefs:
      - CR002
      - CR021
      - CR022
      - CR023
      - CR025
      - CR026
      - CR041
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 投资判断一边由市场顺风和产品切题度支撑，另一边受证据缺口和估值压力牵制。
    data:
      nodes:
        - id: market
          label: 市场顺风
          detail: AI 基础设施和网络需求正在快速扩张。
        - id: product
          label: 产品切题度
          detail: Upscale 同时覆盖纵向扩展和横向扩展工作流。
        - id: proof
          label: 商业验证缺口
          detail: 收入、利润率和具名生产客户均未公开披露。
        - id: risk
          label: 风险堆叠
          detail: 宏观、电力、供应商和融资结构风险都会压低估值。
        - id: price
          label: 当前 $2B 价格
          detail: 当前估值已经假设了比公开资料所能支持的更多证据。
        - id: decision
          label: 投资建议
          detail: 现在跟踪；只有证据缺口弥合或条款显著改善，才上调。
      edges:
        - from: market
          to: product
          label: 品类需求支撑用例
        - from: product
          to: price
          label: 架构叙事赢得关注
        - from: proof
          to: price
          label: 指标缺失迫使打折
        - from: risk
          to: price
          label: 逆风情境放大下行
        - from: price
          to: decision
          label: 入场纪律决定当前判断
        - from: proof
          to: decision
          label: 证据补齐打开上调路径
    approximationNotes: 流程本身是投委会框架工具，不是管理层发布的决策树。
    claimRefs:
