        title: 扩张、集中度和采购风险
        blocks:
          - type: paragraph
            body: >-
              最重要的客户风险，是鼓舞人心的分段语言背后隐藏的集中度。公开证据指向一个由超大规模云厂商、neocloud 和少数大型企业基础设施团队主导的买方集合。商业上这可能有吸引力，因为这些买方的预算和技术需求与
              Upscale 架构匹配。它也很脆弱。超大规模云厂商掌握 AI 基础设施支出的最大份额，也已经拥有足够工程深度，可以内部自建、多源采购，或让供应商满足苛刻资格标准。neocloud 可能更愿意采用解耦、基于
              SONiC 的产品，但与超大规模云既有厂商相比，它们是更小、也可能没那么耐久的账户类别。宏观背景加重了这种不对称：S&P 警告，AI 数据中心过度建设可能让少数超大型公司背负集中融资风险；TCW 和
              Cresset 都强调，基础设施支出跑在完全可观察的企业 ROI 前面；Bain、Deloitte 和 DataCenterFrontier 都强调电力与执行瓶颈。Upscale
              自身对外网页还增加了一个小但真实的采购完善度警示：被审阅的 about、team 和 contact 页面返回 404，careers
              页面在留存摘录中仍显示占位文案。这些问题都不足以杀死论点，但合在一起说明，应把商业耐久性和客户集中度视为开放尽调项，而不是已证明优势。
