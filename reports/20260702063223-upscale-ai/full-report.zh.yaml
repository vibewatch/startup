  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 基于里程碑的私募估值标记区间显示：只有证据迅速补齐，当前定价才有吸引力。
    data:
      items:
        - label: 悲观情境估值区间
          low: 0.7
          mid: 1
          high: 1.4
          note: 证据缺口持续存在，同时宏观、电力或供应商摩擦加剧。
        - label: 基准情境估值区间
          low: 1.6
          mid: 2
          high: 2.5
          note: 战略价值仍在，但商业证据弥合缓慢。
        - label: 乐观情境估值区间
          low: 3
          mid: 4
          high: 5
          note: 具名生产证据和经济性披露，让 Upscale 更接近更强的私募市场同业。
    approximationNotes: 所有数值均为以十亿美元计的示意值，依据里程碑逻辑和同业融资轮背景推导，并非虚构的收入倍数结果。
    claimRefs:
