      - number: '4.2'
        title: GTM、销售效率代理指标和获客现实
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据指向高触达基础设施销售动作，而不是自助式或高度标准化的收入引擎。Upscale 自身页面和融资材料反复瞄准超大规模云厂商、neocloud 运营方、企业和 AI
              基础设施团队，这些买方需要开放、异构的 fabric，又不想把所有 SONiC 集成工作都扛在内部。公司称 2026 年 1
              月融资将扩展工程、销售和运营，并进入商业部署；这正符合咨询式销售和重现场交付所需的人员模式。2026 年 6
              月融资报道补充称，评估和部署正在纵向扩展与横向扩展环境中推进；方向上偏正面，因为它暗示真实买方参与。但公开记录从未闭合从参与到可重复商业效率的回路。没有已点名的付费生产客户，没有公开客户数，没有披露
              ACV、CAC、回本期、NRR，也没有披露销售周期长度。最坦率的读法是，从公开财务视角看，获客现实仍处在证明之前：公司似乎拥有真实企业兴趣和可信设计导入对话，但公开证据尚未显示这些对话能否足够快、足够便宜、足够持久地转化，从而支撑强销售效率。
