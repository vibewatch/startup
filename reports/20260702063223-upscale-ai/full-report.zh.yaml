  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局和替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争格局比简单的创业公司对创业公司框架更宽。Upscale AI 试图在纵向扩展和横向扩展环境中销售全栈 AI 网络层，因此买方至少有四种方式解决同一任务：购买垂直整合的 NVIDIA 栈；采用 Cisco 或
              Arista 等既有厂商的开放以太网并内部集成；使用 Nexthop AI 等另一家专注 AI 网络的创业公司；或继续用商用芯片、开源 NOS
              软件和自有运维内部搭建。纵向扩展边界上的替代集合更宽，因为只要买方已经接受 NVIDIA 参考架构，并更看重最低延迟集合通信性能而非开放性，NVLink 和 InfiniBand
              仍很稳固。关键在于，Upscale 的论点不是 AI 网络存在——它显然存在——而是市场中有相当一部分买方想要开放标准和多厂商灵活性，却不想承担超大规模云级别的集成工作。UALink 和 Ultra
              Ethernet 等开放标准组织会随时间让这个论点更可信，但不会抹去既有厂商已经拥有芯片、光学、分销或已部署 GPU 生态的实际优势。
