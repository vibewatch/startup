  - id: TV005
    title: 论点破裂与终止触发项表
    columns:
      - 触发项
      - 阈值
      - 重要性
      - 行动含义
    rows:
      - - 无具名生产证明
        - 再过 6-12 个月，仍无公开生产参考客户或同等私下尽调证明。
        - 估值会继续跑在可见商业化前面。
        - 从跟踪下调至回避，并停止按接近当前价格承销。
      - - 目标部署出现电力滑坡
        - 关键客户项目出现实质性、跨季度送电延误。
        - 电力一滑坡，AI 基础设施供应商的收入时点会快速右移。
        - 假设近期转化更低、下行区间更宽。
      - - 供应商集中度恶化
        - Upscale 仍与某供应商深度绑定，而该供应商也销售竞争性一体化技术栈。
        - 如果差异化建立在另一家供应商路线图之上，战略杠杆会变弱。
        - 上调折现率并限制仓位规模。
      - - 宏观资本开支重置
        - Hyperscaler 或 neocloud AI 资本开支较 2026 年计划显著放缓。
        - 在 Upscale 补上证明缺口前，赛道溢价可能先压缩。
        - 冻结新增投资，直到部署数据跟上。
      - - 不利融资结构
        - term sheet 审阅显示强高级别优先保护或惩罚性反稀释条款。
        - 普通股等价价值可能远低于标题轮次价格。
        - 除非经济性或价格重置提供补偿，否则放弃。
      - - 利润率画像不及预期
        - 私下尽调显示毛利率偏弱，或服务拖累较重。
        - 低质量收入组合撑不起高溢价硬件加软件叙事。
        - 即便客户名单改善，也把当前价格视为过贵。
    notes: 这些触发项是投资流程纪律的早期预警指标，不是价值已经损失后的复盘解释。
    claimRefs:
      - CV015
      - CV017
      - CV018
      - CV019
      - CV037
      - CV041
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入质量
        - 按产品和客户群拆分的当前 ARR 或收入 run-rate。
        - 用于检验 $2B 是由增长支撑，还是由叙事支撑。
        - 财务资料室：董事会材料、客户群桥接表和本季度结账。
      - - 利润率与服务组合
        - 硬件、软件和服务分项毛利率，以及支持服务附加率。
        - 估值质量取决于收入可扩展，还是偏劳动密集。
        - 财务 + 产品运营：毛利率瀑布表和支持经济性。
      - - 客户证明
        - 具名生产客户、部署数量和扩张历史。
        - 论点与反论点之间最大的缺口是商业证明。
        - 销售资料室：背书客户、合同和实时部署时间表。
      - - 融资条款
        - 优先权、参与权、反稀释和董事会控制条款。
        - 缺少普通股等价经济性，标题估值是不完整的。
        - 法务资料室：cap table、term sheet 和 investor-rights 文档。
      - - 集中度
        - 头部客户收入占比、按买方类型拆分的管线转化率和取消风险敞口。
        - 聚焦 hyperscaler 和 neocloud 可能有吸引力，但也脆弱。
        - 收入运营：集中度报告和管线账龄。
      - - 执行准备度
        - 按项目拆分的制造、供应和电力依赖。
        - 若部署因非产品原因滑坡，情境时间表会迅速变化。
        - 运营尽调：供应商地图、部署甘特图和应急计划。
    notes: 这些问题刻意保持稀疏，但杠杆高。若管理层无法满足，仅靠公开档案不足以支撑当前估值。
    claimRefs:
      - CV006
      - CV008
      - CV009
      - CV015
      - CV016
      - CV043
      - CV045
      - CV046
