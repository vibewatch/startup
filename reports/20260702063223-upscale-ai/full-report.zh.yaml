        - 直接竞争初创公司
        - Upscale 累计融资 $500M，估值 $2B
        - neocloud 厂商、企业和异构 AI 基础设施运营商
        - 开放标准，加上横跨 SkyHammer scale-up 和基于 Spectrum-X 的 scale-out 全栈叙事
        - 无公开标价、无具名生产客户，当前 scale-out 依赖 NVIDIA 芯片
      - - NVIDIA Spectrum-X / Quantum-X
        - 直接在位厂商兼现状替代方案
        - NVIDIA 网络和 AI 平台规模显著高于初创同业
        - 超大规模云厂商、AI 工厂，以及愿意接受更紧栈耦合的买方
        - 跨以太网、InfiniBand、SuperNIC 和光子路线做垂直整合，并宣称以太网提升 1.6x
        - 重视多供应商控制的买方会面对最高锁定风险和溢价定位
      - - Cisco
        - 直接在位厂商
        - Cisco 披露数十亿美元级 AI 基础设施订单动能，并覆盖全球企业客户
        - 超大规模云厂商、neocloud 厂商、企业和服务提供商
        - Silicon One 叠加 AI 网络、安全、可观测性和服务，用一套企业 GTM 推进
        - 组网性能差异更难从 Cisco 更宽的平台捆绑中单独拆出来
      - - Arista AI-EtherLink
        - 直接在位厂商
        - Arista 是主要数据中心以太网在位厂商，明确以 AI-EtherLink 定位
        - 寻求开放以太网运维的超大规模云厂商和大型 AI 集群运营商
        - 开放以太网运维姿态强，云网络信誉广
        - 相比 NVIDIA，纵向计算栈控制更弱，公开交易定价透明度有限
      - - Broadcom 生态 / 商用 Ethernet
        - 相邻平台竞争者
        - 商用芯片通过 OEM/ODM 渠道支撑许多开放以太网部署
        - 组装自定义栈的超大规模云厂商、云构建者和集成商
        - 芯片经济性强，生态可得性广
        - 价值捕获可能转向集成商，削弱交钥匙所有权和责任边界
      - - InfiniBand / RoCE v2 现状方案
        - 现状替代方案
        - InfiniBand 在高性能 AI 训练集群中仍根深蒂固
        - 优化集合通信和最低延迟训练网络结构的买方
        - 训练性能画像成熟，运营手册清晰
        - 可能强化专有锁定，并增加离开在位栈的切换摩擦
      - - 内部自建
        - 现状替代方案
        - 没有单一融资信号，因为这是能力模型，不是一家供应商
        - 拥有深厚网络工程团队的最大型超大规模云厂商和云构建者
        - 架构、采购和优化控制力最大
        - 需要超大规模云厂商级工程能力，并把集成风险转回买方
      - - 可能通过标准生态进入的玩家
        - 可能进入者类别
