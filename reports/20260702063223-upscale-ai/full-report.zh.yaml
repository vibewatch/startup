    title: 功能 / 能力矩阵
    columns:
      - 采购标准
      - Upscale AI
      - NVIDIA 网络
      - Cisco / Arista 开放以太网
      - Nexthop AI
      - 证据 / 未证实缺口
    rows:
      - - 开放 scale-up 标准姿态
        - 借 SkyHammer 以及 UALink / UEC 表述，叙事较强
        - 尽管有 Spectrum-X Ethernet，NVLink 仍属专有、InfiniBand 仍封闭，因此较弱
        - 中等：以太网和 UEC 方向开放，但 scale-up 差异化不是核心
        - 弱至中等：开放网络重点比开放 scale-up IP 更清晰
        - 公开证据中，开放 scale-up 产品出货的证明仍主要来自标准组织，而不是已部署的供应商系统
      - - 交钥匙 scale-out 栈
        - 公开主张强：系统、软件、遥测、生命周期支持
        - 交换机、SuperNIC、管理和参考架构齐全，能力强
        - 硬件和运营栈成熟，能力强，但买方承担的集成负担不一
        - 中等至强，取决于定制设计合作深度
        - Upscale 和 Nexthop 发布了架构与 GTM 线索，但都没有公开可与在位厂商相比的生产足迹
      - - SONiC / 开放 NOS 姿态
        - 强：SONiC 叙事聚焦，并有治理角色
        - 中等：支持 SONiC，同时存在 Cumulus 和专有耦合
        - 中等至强：Cisco 博客和 Arista 定位支撑开放以太网及 UEC 方向
        - 强：直接点名 SONiC 和 FBOSS
        - 公开资料更能看清厂商对开放 NOS 的承诺，看不清上下游功能差异的精确范围
      - - 光子 / 光学路线图
        - Upscale 公开材料中目前较弱
        - 强：Spectrum-X 和 Quantum-X 光子路线图明确
        - 中等：有光学支持，但保留来源里光子路线不是核心
        - 保留公开资料中较弱
        - Ayar 和 Celestial 显示，未来互联差异化可能迁移到何处；即便它们目前还不是交钥匙网络结构替代方案
      - - 运营工具与可观测性
        - 中等：遥测和聚焦 SONiC 明确，但广泛部署的工具链不明确
        - 强：UFM 加端到端平台耦合
        - 强：NX-OS / Nexus Dashboard 和 EOS / CloudVision 公开叙事成熟
        - 中等：公开叙事强调效率和共同开发，不强调广泛运营套件
        - 运营证据是在位厂商主要安装基础优势之一
      - - 分销与现场覆盖
        - 弱至中等：投资方和合作伙伴信号强，但公开客户证据有限
        - 强：搭上 GPU 需求和 NVIDIA 生态拉力
        - 强：企业、服务提供商和超大规模云厂商现场动作根深蒂固
        - 中等：初创速度加超大规模云厂商可信度，但渠道宽度较弱
        - 公开资料显示，最清晰的分销优势属于在位厂商，而不是初创公司
      - - 多供应商灵活性
        - 围绕异构计算和开放标准的定位强
        - 中等：Spectrum-X 是基于标准的以太网，但仍与 NVIDIA 栈选择紧密耦合
        - 开放以太网架构优势强，尤其适合多供应商运营模型
        - 买方想要开源和定制交换时优势强
        - 灵活性主张公开得多，已实现切换成本数据少，因此仍需到账户层面尽调
    notes: 矩阵使用已证实、未证实和未知的公开证据，而不是私人比测数据。单元格描述买方可见姿态，不是经审计的基准赢家。
