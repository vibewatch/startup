  - id: TV003
    title: 牛市 / 基准 / 熊市情境表
    columns:
      - 情境
      - 核心假设
      - 承销估值区间（USD bn）
      - 相对 $2B 入场价的隐含回报
      - 概率信号
      - 主要失败模式
    rows:
      - - 牛市
        - 具名生产部署出现，收入质量变得可见，开放网络仍是封闭技术栈之外的优先替代方案。
        - 3.0-5.0
        - 1.5x-2.5x
        - 需要证明快速转化，且资本开支胃口保持韧性。
        - 执行滑坡或供应商依赖阻止重估。
      - - 基准
        - Upscale 仍具战略相关性，但证明逐步到来，公司只部分补上经济性缺口。
        - 1.6-2.5
        - 0.8x-1.25x
        - 最符合当前证据组合。
        - 证明落地前，当前价格已经计入部分上行。
      - - 熊市
        - 电力、供应或宏观摩擦拖延部署，公开证明缺口大体仍未补上。
        - 0.7-1.4
        - 0.35x-0.7x
        - 反向来源对过度建设和变现滞后发出警告，支撑这一情境。
        - 降价轮或结构化融资压缩普通股等价价值。
    notes: 这些区间是基于里程碑的私人标记情境，不是收入倍数输出；公开收入、利润率和优先权数据均未披露。
