      - number: '2.4'
        title: 增长驱动、时点和采用约束
        blocks:
          - type: paragraph
            body: >-
              增长驱动清楚，但时点并不均匀。IDC 和 Bain 都显示，超大规模云扩张、企业生产级 AI 采用，以及北美之外的地理扩散带来强需求动能。Dell’Oro 的 2026 年展望称，以太网在 AI 后端采用中超过
              InfiniBand，这又增加了一个有利于开放网络叙事的传输层驱动。与此同时，约束不是次要变量，而是决定转化速度。Bain 把电力可得性识别为当前闸门，并指出前沿训练需要吉瓦级园区。TCW 与 S&P
              增加融资和信用风险视角，警告一旦利用率或需求假设变软，前置资本开支可能跑过已实现变现。解决方案层面，NextPlatform 的厂商份额拆分显示 NVIDIA
              成为以太网主要竞争者的速度很快，进一步强化挑战者面临的锁定和转换成本压力。Upscale 可以受益于开放标准动能，但时点风险仍主要受电力、资本和既有生态引力支配。
