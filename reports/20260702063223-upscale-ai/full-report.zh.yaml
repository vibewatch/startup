      - number: '3.2'
        title: 竞争对手画像和战略方向
        blocks:
          - type: paragraph
            body: >-
              NVIDIA 是核心参照点，因为它横跨完整决策树：面向锁定高端部署的专有 NVLink 和 InfiniBand，面向转向以太网客户的 Spectrum-X
              Ethernet，以及用于未来电力和规模约束的光子技术。Cisco 从另一个角度进攻市场，把 AI 网络嵌入更大的 AI
              工厂平台，平台包含芯片、交换、安全、可观测性和服务；即便它不是每个分段的技术性能领导者，也因此拥有企业和渠道优势。Arista 的公开 AI 姿态更模块化，也更偏开放以太网，用基于 Broadcom 的硬件搭配
              EOS 和 CloudVision，而不是把网络绑定到计算平台。Nexthop AI 是最接近 Upscale 的创业公司类比对象，因为它同样向超大规模云厂商和 neocloud 销售高性能开放网络，估值已达到
              $4.2B。光子同业 Celestial AI、Lightmatter 和 Ayar Labs
              在当前采购周期中不那么直接，但它们有战略意义，因为它们从光学和封装层攻击同一互连瓶颈，并且融资规模足以影响未来纵向扩展预算的架构。
