chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品模型和官网域名
        blocks:
          - type: paragraph
            body: >-
              Upscale AI 当前官方身份在产品范围上比历史时间线更清楚。保留下来的官方页面现在都落在 upscale.com，把公司定位为一家纯 AI
              网络基础设施厂商，销售横跨芯片、系统和软件的全栈平台。公开产品分工已经足够具体，后续章节可以复用：SkyHammer 是面向紧密同步机架级 AI 网络结构的纵向扩展架构，横向扩展侧则把 NVIDIA
              Spectrum-X 交换芯片与基于 SONiC 的操作栈结合起来，服务异构以太网集群。历史记录没有这么干净，尤其是启动日期和数字身份。官方与独立发布材料都把 2025 年 9 月、超过 $100M 种子轮和
              Auradine 孵化作为公开亮相的锚点，Tech Field Day 后来也概括称公司成立于 2025 年。但当前关于页面含有 2024 年 9 月种子轮标记，所以最安全、可复用的表述是：Upscale AI
              于 2025 年公开亮相，准确注册时间或发布前融资时间仍未厘清。第二个命名褶皱在于，较早官方稿仍把读者导向 upscaleai.com，而无关的 upscale.ai 域名目前属于一家 AI
              广告平台，带来真实但仍可管理的品牌混淆风险。
