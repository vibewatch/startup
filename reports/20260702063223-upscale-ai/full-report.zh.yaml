  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Upscale 仍有真实的投资逻辑。公司瞄准的基础设施层，是几乎所有独立市场来源都认为会随着 AI
              集群扩张而变得更重要的少数环节之一：高带宽、低延迟网络，能在纵向扩展和横向扩展环境中把加速器利用率撑住。融资动能也不是想象出来的。到 2026 年中，公司已披露累计融资 $500 million、估值 $2
              billion，并继续把自己定义为全栈 AI
              网络公司，而不是单点零部件供应商。反向逻辑同样重要，而且应主导当前估值讨论。公开证据在最关键的承销项上仍然薄弱：具名生产客户、客户数、收入、ARR、毛利率、烧钱速度、现金跑道、定价和融资条款结构。也就是说，Upscale
              可以是一家处在强赛道里的可信公司，但在当前要价下仍不是一个有力的承销标的。这个不对称性是本章中心，不是脚注。
