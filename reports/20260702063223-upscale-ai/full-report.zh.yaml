companyProfile:
  summary: >-
    Upscale AI 是一家创始人主导的 AI 网络基础设施公司。公开叙事围绕两条线展开：用于内存语义纵向扩展的 SkyHammer，以及面向异构 AI 集群、基于 NVIDIA Spectrum-X 与 SONiC
    的横向扩展系统。 公司已在 $2B 估值下融资 $500M，似乎正在接触超大规模云厂商和 neocloud 潜在客户，但公开证据仍未披露收入、客户数、员工数或广泛生产部署证明。
