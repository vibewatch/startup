      - 已公开信息
      - 估值 / 融资信号
      - 相关性
      - 为什么不可完全类比
    rows:
      - - Upscale AI
        - 2026 年 6 月披露当前轮次。
        - $2.0B 估值；总融资 $500M。
        - 研究对象本身，也是当前定价锚。
        - 公开收入、利润率和条款仍未披露。
      - - Nexthop AI
        - 公司官网披露 2026 年 3 月 Series B。
        - $4.2B 估值；本轮 $500M。
        - 公开来源中最接近的未上市网络公司直接可比对象。
        - 仍未上市且信息来自公司自述；定制化模式可能不同。
      - - Lightmatter
        - 2024 年 10 月 Series D 标题披露估值。
        - $4.4B 估值；本轮 $400M。
        - 显示投资人会多激进地给战略性 AI 互连叙事定价。
        - 光子和封装叙事相邻，但不是即插即用的集群网络 fabric 对标。
      - - Celestial AI
        - 2025 年 3 月 Business Wire 新闻稿披露总融资额，但未披露估值。
        - $250M Series C1；累计融资 >$515M。
        - 对 hyperscaler 相关互连需求胃口，是有用的相邻信号。
