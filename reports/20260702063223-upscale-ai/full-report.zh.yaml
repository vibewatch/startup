  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 因素
      - 论点
      - 反论点
      - 何种证据会改变判断
    rows:
      - - 市场需求
        - AI 基础设施支出和网络需求快速放大。
        - 赛道增长仍可能跑在变现前面，带来过度建设风险。
        - 需要资本开支新闻之外，买方持续转化和利用率证明。
      - - 产品命中度
        - Upscale 借开放标准定位，同时切入 scale-up 和 scale-out 痛点。
        - 这套技术栈仍部分依赖 NVIDIA 相关输入，也面对强替代品。
        - 能证明差异化结果的独立基准和部署证据。
      - - 资本基础
        - 相较普通创业公司，披露的 $500M 融资给了真实研发现金跑道。
        - 资本实力不能证明产品市场契合度或利润率质量。
        - 披露季度收入、毛利率和烧钱速度，证明转化效率。
      - - 商业证明
        - 有吸引力的买方群体里，评估和部署已在推进。
        - 具名生产客户、客户数量和公开 NRR 都看不到。
        - 具名背书客户、付费生产数量和扩张历史。
      - - 估值
        - 当前价格低于部分更知名 AI 网络和互连同业估值。
        - 证明缺口大于标题折扣所暗示的水平。
        - 需要更好价格，或实质更强的经济性披露。
    notes: 反论点列刻意面向决策：它突出真正承销案例缺失的证据，而不是泛泛的创业风险。
