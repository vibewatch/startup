  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出、排除支出和替代方案
        blocks:
          - type: paragraph
            body: >-
              本章的市场边界是 AI 数据中心网络基础设施，不是完整 AI 基础设施栈。因此纳入支出覆盖高速交换、路由、光互连、NIC 或 SmartNIC 层、网络操作软件，以及直接决定 AI
              集群通信性能的集成服务。ResearchAndMarkets 按组件、网络类型、应用和终端用户切分 2020–2035 年 AI
              数据中心网络，支撑了这一定义。排除支出包括加速器、通用服务器、存储阵列、冷却系统和电力系统，除非这些采购与网络架构决策不可分割。现状替代方案仍很强，包括专有纵向扩展路径、以 InfiniBand
              为中心的网络结构，以及改造后的传统以太网运维。Upscale 把开放纵向扩展加横向扩展作为框架，这一点重要，因为它瞄准的是这条替代边界，而不是声称所有 AI 基础设施美元都可实际转化为收入。
