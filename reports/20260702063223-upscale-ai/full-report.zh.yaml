      - number: '2.2'
        title: 透过多重证据口径测算 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              单个公开数字不足以承保 Upscale 的市场机会，所以本章把多个口径并列保留。MarketsandMarkets 给出宽口径外框：AI 数据中心市场从 2025 年 USD 344.24B 增至 2032 年
              USD 2,023.52B，CAGR 为 27.5%。IDC 增加了近期开支速度口径：2025 年 Q4 AI 基础设施支出 USD 89.9B，并预计到 2029 年超过 USD 1T。NextPlatform
              引用 IDC，给出更直接挂钩网络的口径：2025 年 Q1 以太网交换总额 USD 11.7B，其中数据中心以太网 USD 6.92B，同比增 54.6%，占总额
              59.1%。金字塔图和区间图保留这些不同范围，而不是压缩成一个合成 TAM。图表值经过转换时，例如把季度运行率年化，近似说明会明确列出算法。
