  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型和变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Upscale AI
              的公开记录足以判断公司应该如何赚钱，但不足以衡量它实际上赚了多少钱。官方页面和材料持续描述一套全栈平台，横跨芯片、系统和软件，覆盖机架级纵向扩展与集群级横向扩展环境。因此最有支撑的变现判断是硬件 + 软件 +
              服务模型，而不是纯软件订阅或简单交换机转售。纵向扩展似乎通过基于 SkyHammer 的机架级网络结构变现。横向扩展似乎通过基于 NVIDIA Spectrum-X 芯片、采用 SONiC
              操作栈的开放以太网系统变现。两者外围是一层软件和生命周期能力：控制、遥测、可靠性工作、集成和持续支持。关键承保限制在于，公开材料停留在架构和定位层面；它们没有披露标价、实际
              ASP、支持附着率、合同期限或收入确认机制。即便如此，交钥匙语言、生命周期服务和多层产品描述结合起来，已经足以说明 Upscale
              试图捕获的不只是硬件盒子毛利。仍未知的是，这套更宽的栈是否已经在实质规模的付费生产中变现。
