      - number: '8.4'
        title: 退出准备度、尽调问题和叫停触发项
        blocks:
          - type: paragraph
            body: >-
              按后期投资人或公募市场式尽调通常期待的标准，Upscale
              还没有公开展现退出准备度。公开证据尚不能证明收入质量耐久、客户足够分散或毛利率能守住；融资堆叠披露也不够深，无法评估普通股等价口径下的下行风险。这不代表公司弱，而是下一次投资决定必须由证据把关，不能只靠赛道动能。正确的尽调议程应当窄而高杠杆：生产客户证据、当前单位经济、融资条款、集中度和部署转化。承诺投资前，叫停触发项也要写清楚。资本开支持续放缓、目标部署供电长期延迟、融资结构明显不利，或未来六到十二个月仍没有具名生产证据，都应收紧甚至终止投资案。如果管理层能回答这些问题，且价格仍在当前水平附近，建议可以快速重审。否则，跟踪应保持观察性质，而不是参与性质。
