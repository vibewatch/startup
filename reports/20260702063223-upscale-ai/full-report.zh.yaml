      - number: '2.3'
        title: 买方、用户、付款方分层和采用路径
        blocks:
          - type: paragraph
            body: >-
              可观察的买方地图有三个实用分段：超大规模云厂商、neocloud 云服务商，以及包含主权和企业级部署的大型 AI 基础设施运营方。每个分段里，日常用户是运营 GPU 集群的基础设施、平台和 ML
              系统团队；经济买方通常是赞助架构方向的基础设施或平台工程负责人。最终付款审批通常经过集中式资本开支委员会或等效投资治理机构，因为决策牵涉多年硬件、机房和电力承诺。Cisco 的 neocloud 分析和 Bain
              的战略转向框架共同支持一点：采购不再是临时动作，而是绑定到部署模型选择，例如专用与共享容量、自建与托管、开放 fabric 与垂直耦合 fabric。因此，采用路径从试点 fabric
              验证走向生产推出；扩张闸门不是功能清单本身，而是利用率、可靠性和融资信心。
