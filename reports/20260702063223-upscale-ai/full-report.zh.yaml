      - number: '8.2'
        title: 建议、置信度、风险与估值判断
        blocks:
          - type: paragraph
            body: >-
              公开证据最能支撑的判断是观察，不是买入。这是一个对价格敏感的结论，不是否定公司。Upscale 有足够资本、赛道相关性和产品野心，值得继续跟踪；但公开材料不足以支持投资人进入 $2 billion
              轮次，并默认商业模式已经被证明。置信度为中，因为证据方向一致，但指标层仍不完整。风险应维持高位，因为下行通道彼此叠加：对 NVIDIA
              相关横向扩展组件的供应商依赖、供电和零部件瓶颈、宏观过度建设风险，以及当前私募估值热情可能抢跑变现事实。估值判断是偏高，而不是荒谬。与其他重融资的 AI
              网络和互连初创公司相比，当前价格并非显然不可能，但证据缺口太大，不能称为有吸引力。换句话说，质量可能正在浮现，但价格已经假设了比公开记录更多的经营证据。
