      - number: '5.4'
        title: 差异化、标准位置、信任控制和技术风险
        blocks:
          - type: paragraph
            body: >-
              Upscale 的差异化在技术上自洽：开放标准纵向扩展 + 开放以太网横向扩展，并整合成一个运营叙事，意在降低锁定并支持异构加速器未来。这与单一厂商专有栈形成对比，也贴合 AI 后端网络向可编程以太网
              fabric 迁移的行业趋势。独立技术材料支撑了这一战略逻辑：AI 流量模式需要专门设计的无损传输和感知拓扑的运营。风险同样实质。横向扩展依赖 NVIDIA
              Spectrum-X，引入供应商和路线图集中。UALink/UEC 生态仍在成熟，标准主导的互操作性也还在移动。公开信任与合规证据仍轻：看不到 SOC2/ISO
              认证细节，软件安全流程披露有限，也没有公开漏洞响应指标。SkyHammer 页面周边的失效或迁移 URL
              还造成轻微文档摩擦。负面情形是，在基准测试、客户生产和保障证据跟上之前，架构质量可能先跑过执行证明。当买方批准多年 fabric 标准化决策前需要合同级问责和经审计运营数据时，这一风险会被放大。
