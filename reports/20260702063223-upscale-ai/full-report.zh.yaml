      - number: '3.3'
        title: 能力、定价和分销对比
        blocks:
          - type: paragraph
            body: >-
              公开能力证据在架构上最强，在商业条款上最弱。Upscale 自身材料确实展示了一套具体横向扩展栈：NVIDIA Spectrum-X 交换芯片、聚焦 AI 的 SONiC
              实现、确定性无损以太网行为、遥测和生命周期支持；同时把 SkyHammer 定位为开放、面向内存语义的纵向扩展架构。挑战在于，既有厂商也有同样清晰的能力叙事，并且运营证明更强。NVIDIA
              把交换机、SuperNIC、管理能力和已锚定买方路线图的计算主业绑在一起。Cisco 把 AI 网络包进更宽的基础设施、安全和运营平台。Arista
              和商用芯片开放以太网厂商可以依靠多厂商光学、成熟运营工具和大型装机基础。Nexthop 的卖点同样开放，但定制化更重。定价是本章最弱的区域：留存公开材料几乎没有提供这些 AI fabric
              可逐项对比的标价、折扣、支持层级或合同期限证据。因此，更诚实的结论是，当前包装和分销权力比交易经济性更可见：既有厂商拥有现场覆盖，NVIDIA 可以借 GPU 需求顺势推进，Upscale
              必须证明运营简单性和更快部署足以抵消较小装机基础。
