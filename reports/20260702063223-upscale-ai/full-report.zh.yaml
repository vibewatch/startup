              月横向扩展公告承诺端到端支持和生命周期服务；公司也在一边扩建销售与运营，一边持续融资。这些都符合一种账户模型：先落在硬基础设施需求上，再围绕需求扩张。但它们都不是续约证据。没有已点名参考客户，公开档案无法判断这些是具备运营转换成本的粘性部署、可能转化也可能不转化的有前景评估，还是尚未泛化的一小批灯塔账户。尽调立场既不应否定商业故事，也不应过度计分。客户章节可以支撑产品-市场相关性，但不能支撑组合级留存耐久性。
