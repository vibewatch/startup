      - number: '5.2'
        title: 模块地图和架构 / 运营模型
        blocks:
          - type: paragraph
            body: >-
              公开模块地图是一套全栈叠层，而不是单设备推销。公司把 SkyHammer 描述为从零设计的纵向扩展架构，围绕内存语义 load/store 行为、确定性通信和机架级同步构建，使 XPU
              像一台一致性机器一样运行。横向扩展侧则是基于 NVIDIA Spectrum-X 交换芯片的开放以太网系统，并配有 AI 优化的 SONiC 与 SAI 软件层。两个域中，Upscale
              都强调芯片、系统和软件一体化，把遥测、拥塞处理和运营控制作为核心设计要求。技术博客还解释了为什么高带宽加速器 pod 中交换拓扑优于 mesh：更高的有效对等带宽、连接性线性增长、更容易的 vPod
              分区，以及更好的故障隔离。独立 Field Day 报道进一步说明，公司正在尝试把一个运营底座标准化到异构 ASIC 环境。关键架构警示是，大多数验证仍停留在叙事和设计层面，而不是基准测试层面。
