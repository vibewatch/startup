      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会可用记分卡凸显：Upscale 的品类信号最强，但证据强度和经济性可见度没有同样跟上。
    data:
      items:
        - label: 市场顺风
          value: 8
          unit: /10
          note: 独立市场数据强力支撑需求增长。
        - label: 产品切题度
          value: 7
          unit: /10
          note: 纵向扩展加横向扩展的定位在战略上自洽。
        - label: 商业验证
          value: 3
          unit: /10
          note: 评估已可见，但具名生产证据仍未公开出现。
        - label: 经济性可见度
          value: 2
          unit: /10
          note: 收入、利润率、烧钱速度和定价仍未披露。
        - label: 竞争位置
          value: 5
          unit: /10
          note: 确有真实差异化，但替代方案和在位厂商力量很强。
        - label: 风险遏制
          value: 4
          unit: /10
          note: 宏观、供应商和基础设施风险只能部分控制。
        - label: 估值入场点
          value: 3
          unit: /10
          note: 当前价格已经假设了尚未公开的证据。
    approximationNotes: 评分是方向性的委员会启发式判断，不是管理层 KPI 或统计因子权重。
