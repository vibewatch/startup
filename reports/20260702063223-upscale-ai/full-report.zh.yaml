      - number: '1.4'
        title: 里程碑、生态验证和负面筛查
        blocks:
          - type: paragraph
            body: >-
              里程碑节奏很快，整体偏正面。Upscale AI 从 2025 年 9 月公开发布和种子轮起步，10 月进入 OCP 演讲活动，2026 年 1 月完成 $200M Series A，2 月深化 SONiC
              治理参与，3 月发布与 NVIDIA 相关的横向扩展公告，4 月出现在 Networking Field Day 等行业活动，6 月又完成 $190M
              融资延伸。这个序列有用，因为它显示公司不只靠融资标题建立信誉，也在借标准组织、伙伴生态和技术教育建立可信度。与此同时，负面筛查并非空白。留存材料中的公司特定警示多属执行层面而非法务层面：当前官方页面位于
              upscale.com，而无关的 upscale.ai 运营 AI 广告业务，因此存在品牌模糊；官方融资文案在不同网页表面也未完全同步。更重要的是行业背景。独立分析师警告，AI
              基础设施开支可能跑在变现、电力可得性和最终利用率前面；Upscale 的买方群似乎集中在超大规模云厂商和 neocloud 运营方，这一点直接相关。后续章节应同时带着两个事实：作为一家年轻网络公司，Upscale
              拥有异常强的融资与生态动能；但公开记录仍未闭合准确总部迁移时间、当前商业规模和治理经济条款的尽调回路。
