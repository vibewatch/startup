      - CV006
      - CV010
      - CV011
      - CV012
      - CV017
      - CV018
      - CV019
      - CV038
      - CV039
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 如果各变量大幅改善或恶化，对投资吸引力的示意影响以 100 分制投委会评分点数衡量。
    data:
      items:
        - label: 出现具名生产客户
          value: 25
          note: 单项正向影响最大，因为它最快弥合公开证据缺口。
        - label: 披露收入和毛利率
          value: 20
          note: 经济性可见度大幅提高价格可辩护性。
        - label: 价格更好或下行保护条款更强
          value: 18
          note: 即使完整证据尚未出现，入场纪律也能解决部分问题。
        - label: 电力和部署时间线延误
          value: -18
          note: 延误把收入时点往后推，并削弱近期估值标记。
        - label: NVIDIA 依赖加深
          value: -12
          note: 供应商重叠会削弱战略杠杆和议价能力。
        - label: 宏观变现怀疑上升
          value: -15
          note: 风险偏好会先压缩在证据最薄弱的地方。
    approximationNotes: 敏感性数值是归一化的投委会评分调整，不是公开估值变动或交易倍数。
    claimRefs:
