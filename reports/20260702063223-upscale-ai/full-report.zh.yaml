      - number: '1.2'
        title: 领导层、治理和关键人风险
        blocks:
          - type: paragraph
            body: >-
              领导层叙事明显由创始人牵引。Barun Kar 仍担任 CEO，也是公司的公开运营代表；Rajiv Khemani 担任执行董事长，并在多数融资、产品和生态信息中与 Kar
              同场出现。这种集中不天然是坏事，因为同一公开记录也证明了较强的创始人-市场匹配：发布和融资材料反复把两人与 Palo Alto Networks、Innovium、Cavium 和 Auradine
              等网络与基础设施成功案例联系起来。即便如此，投资人仍应把关键人依赖视为实质问题，因为最显眼的外部验证仍经由 Kar 和 Khemani，而不是公开记录中的董事会或委员会结构。正向抵消因素是团队纵深在扩展。截至
              2026 年 4 月，Upscale 新增 Puneet Agarwal 任 CTO、Jason Ledgerwood 任系统工程与运营高级副总裁、Sharada Yeluri 任 ASIC 副总裁、Mohsen
              Moazami 任高级顾问；当前领导层页面还列出销售、软件、财务、法务、架构、支持和人力职能高管。Aravind Srikumar、Deepti Chandra 和 Santhosh K Thodupunoori
              的 SONiC 治理角色也暗示，技术骨干比创始人叙事本身更深。剩余缺口是治理能见度：公开来源仍未披露完整董事会、持股、委员会结构或控制权。
