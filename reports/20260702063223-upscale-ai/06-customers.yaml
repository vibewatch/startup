- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Signal
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - NRR / GRR / churn
    - Undisclosed
    - High
    - Core revenue durability cannot be underwritten from public materials
    - Request cohort retention by segment and vintage
  - - Renewal rate / contract length
    - Undisclosed
    - High
    - Distinguishes sticky infrastructure adoption from short pilot cycles
    - Request standard contract term, renewal cadence, and pilot conversion data
  - - Customer satisfaction / NPS / review footprint
    - No public metric found in reviewed pack
    - Medium
    - Would help separate operational fit from marketing momentum
    - Request NPS, reference calls, and customer-authored survey data
  - - Repeat expansion inside accounts
    - Plausible from integrated hardware-software-services model, but unquantified
    - Low-Medium
    - Expansion is central to infrastructure economics and NRR
    - Request seatless expansion metrics such as racks, pods, or sites added per account
  - - Lifecycle support depth
    - Company claims end-to-end support and lifecycle services
    - Medium
    - Service quality can improve deployment stickiness and referenceability
    - Provide named reference customers willing to discuss day-2 operations and support quality
  notes: Public evidence is strongest on deployment intent and weakest on retention; this table keeps unknowns explicit instead of inferring SaaS-style durability metrics.
