- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk area
  - Public status
  - Impact
  - Best evidence
  - Diligence path
  rows:
  - - Hyperscaler concentration / buyer power
    - Likely but unquantified
    - A few accounts could dominate revenue and impose harsh qualification standards
    - Public targeting centers on hyperscalers and other very large operators
    - Request top-1 / top-5 / top-10 customer revenue share and pipeline by stage
  - - Hyperscaler internal-build risk
    - Material
    - Large buyers may multi-source or build around incumbent and in-house stacks
    - Official and Cisco materials both highlight the engineering complexity of open networking at hyperscale
    - Request win/loss analysis versus internal-build and incumbent alternatives
  - - Neocloud durability risk
    - Material
    - Neoclouds may adopt open fabrics earlier but are smaller and potentially less durable than hyperscalers
    - Cisco frames neoclouds as fast-growing but still a minority share today
    - Break out bookings, ACV, and churn separately for neocloud accounts
  - - Power / ROI / procurement delay
    - Material
    - Even willing buyers may defer or resize programs if power and ROI are uncertain
    - S&P, TCW, Cresset, Bain, Deloitte, and DataCenterFrontier all describe demand timing friction
    - Request slipped deals, cancelled pilots, and power-related deployment delays
  - - Referenceability / external procurement polish
    - Known but secondary
    - Thin public references and broken web surfaces can slow trust-building with large buyers
    - Reviewed about, team, and contact pages returned 404; named customer references remain absent
    - Provide a live reference list, customer story deck, and cleaned-up buyer-facing web journey
  notes: The risk is not that no customer demand exists; it is that demand may be concentrated, slow-moving, and harder to validate publicly than financing momentum suggests.
