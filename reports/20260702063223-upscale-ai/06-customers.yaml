    - Frontier training, scale-out fabrics, heterogeneous cluster interconnects
    - Official traction and deployment-underway language; SONiC framed as hyperscale-native
    - No named account, production scope, or revenue weight
  - - Neocloud providers
    - 'Buyer: cloud founders and infra leaders; Payer: AI cloud platform budgets; User: network and GPU-cluster operators'
    - Dedicated, public, and hybrid AI IaaS with open, disaggregated fabrics
    - Explicitly named in June 2026 financing materials and Cisco neocloud analyses
    - No named provider, contract structure, or deployment count
  - - Large enterprises / Fortune 500 AI builders
    - 'Buyer: CIO / CTO / AI infrastructure leaders; Payer: enterprise IT and transformation budgets; User: platform, infra, and AI engineering teams'
    - Production inference, hybrid AI environments, multi-vendor infrastructure procurement
    - Momentum and VivaTech show buyer-audience access and production-economics messaging
    - Audience access is not proof of paid adoption
  - - AI model builders / AI infrastructure operators
    - 'Buyer: technical leadership; Payer: project or platform capex; User: training and inference operators'
    - Scalable open alternatives to proprietary AI fabrics
    - Series A language cites traction with AI infrastructure operators
    - No public split between model builders and other operators
  - - CSP / colo / sovereign-cloud-style operators
    - 'Buyer: cloud or infrastructure leadership; Payer: infrastructure programs; User: operators balancing latency, sovereignty, and scale'
    - Hybrid and edge AI IaaS, secure hosting, and regional infrastructure buildout
    - Cisco frames these as adjacent demand cohorts around enterprise AI
    - Upscale does not publicly show named wins in this cohort
