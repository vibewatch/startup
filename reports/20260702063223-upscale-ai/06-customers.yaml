- id: retention-durability-and-evidence-gaps
  title: Retention, durability, and evidence gaps
  body: Retention quality is where the public record falls away fastest. No reviewed source discloses NRR, GRR, churn, renewal rates, contract length, deployment breadth inside accounts, customer satisfaction scores, or even a basic public customer-count denominator. That does not mean customer quality is poor; it means it is unverified. The strongest durability proxies are indirect. Product pages say the systems are built for production-scale inference and production rack-scale deployments, the March scale-out announcement promises end-to-end support and lifecycle services, and the company has kept raising capital while building out sales and operations. Those are all consistent with an account model that would like to land on a hard infrastructure need and expand around it. But none of them are renewal evidence. Without named reference customers, the public file cannot tell whether these are sticky deployments with operational switching costs, promising evaluations that may or may not
    convert, or a narrow cluster of lighthouse accounts that have not yet generalized. For diligence purposes, the right stance is neither to dismiss the commercial story nor to over-credit it. The customer chapter can support product-market relevance, but not portfolio-level retention durability.
