  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-surface
    missingEvidence: Named customer roster with each account labeled as evaluation, pilot, production, or renewal stage.
    whyItMatters: Without account names and stage labels, the chapter cannot distinguish market interest from revenue-bearing production adoption.
    diligencePath: Request a customer list with stage, use case, ARR, deployment scope, and referenceability permission for each hyperscaler or neocloud program.
    relatedQuestionRefs:
    - QU010
    - QU011
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: segment-mix-disclosure
    missingEvidence: Customer mix by geography, vertical, channel, and revenue band.
    whyItMatters: Public materials identify likely buyer classes but do not show whether revenue is diversified beyond a narrow infrastructure cohort.
    diligencePath: Request bookings and ARR by customer segment, geography, and channel plus any strategic-accounts list.
    relatedQuestionRefs:
    - QU006
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, contract term, and deployment expansion by account cohort.
    whyItMatters: Durability is the central underwriting question for infrastructure vendors with sparse named customer proof.
    diligencePath: Request customer-cohort tables by vintage and segment, including renewals, churned logos, expansion ARR, and standard contract duration.
    relatedQuestionRefs:
    - QU017
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, top-10 concentration, and pipeline exposure by hyperscaler versus neocloud versus enterprise cohort.
    whyItMatters: A small number of very large buyers could dominate revenue and materially affect bargaining power, roadmap pressure, and renewal risk.
    diligencePath: Request top-1, top-5, and top-10 customer concentration plus outstanding pilot and design-win pipeline by buyer class.
    relatedQuestionRefs:
    - QU020
    - QU021
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: customer-satisfaction-and-referenceability
    missingEvidence: Independent customer-authored reviews, procurement records, or reference calls discussing day-2 operations and support quality.
    whyItMatters: The current proof set is dominated by vendor-authored and partner-authored materials, which weakens confidence in deployment durability and support quality.
    diligencePath: Collect at least three customer references from different buyer cohorts and request any third-party survey, review, or procurement evidence management can share.
    relatedQuestionRefs:
    - QU016
    - QU018
    - QU025
    relatedTableRefs:
    - TU003
    - TU004
  - type: missing-source
    severity: minor
    topic: procurement-polish
    missingEvidence: A cleaned-up buyer-facing web journey and documented sales or solutions-engineering process for enterprise accounts.
    whyItMatters: Broken outward-facing pages do not prove weak execution, but they are avoidable friction in a category where trust and referenceability matter.
    diligencePath: Validate live website paths, request buyer enablement collateral, and inspect the current sales-engineering and customer-success workflow.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU005
