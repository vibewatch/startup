- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Scale or proof
  - Revenue / strategic value
  - Gap
  rows:
  - - Tier-one global banks
    - Fraud and digital-risk executives / fraud ops / bank payer
    - ATO, account opening, scams, mule detection
    - More than 30 of top 100 banks and three of top four U.S. banks claimed
    - High strategic value and likely large ACVs
    - Need named module-by-module deployment and ARR per logo.
  - - Regional banks and credit unions
    - Fraud leaders / investigation teams / bank or credit-union payer
    - ATO and account-opening protection
    - More than 70 mid-market partner banks and credit unions added in 2025
    - Scales through partners; likely lower ACV but broader logo growth
    - Need cohort retention and partner-sourced ARR.
  - - Australian bank network
    - Scam, payments, and fraud teams / participating banks
    - Receiving-account intelligence and scam prevention
    - ANZ plus major Australian banks in BioCatch Trust network
    - Network effect and strategic data moat
    - Need bank-level usage and intervention outcomes.
  - - Platform partners
    - Digital banking or AML platform teams / partner or end bank payer
    - Embedded fraud and financial-crime intelligence
    - Alkami, Alloy, Verafin, and partner ecosystem evidence
    - Channel leverage into bank base
    - Need reseller economics and customer ownership.
  - - Named customer references
    - Fraud teams / bank or credit-union payer
    - Account opening, ATO, Link, scam prevention
    - Wells Fargo, St. Mary’s Bank, Gate City Bank, NatWest, ANZ
    - High proof value for diligence calls
    - Need production status and quantified outcomes per customer.
  - - Logo-list or curated-reference prospects
    - Unknown buyer and user / unknown payer
    - Unspecified fraud controls
    - CB Insights and FeaturedCustomers list references
    - Discovery lead only
    - Do not treat logos alone as retention proof.
  notes: Segmentation is synthesized from public customer-count, named-customer, review, and partner evidence as
    of 2026-06-03; revenue value is directional, not disclosed.
