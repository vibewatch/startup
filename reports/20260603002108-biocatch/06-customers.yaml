  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract lengths, cohort ARR expansion, and failed-pilot
      detail by customer cohort.
    whyItMatters: Retention determines whether broad customer-count and ARR growth translate into durable enterprise
      value rather than one-time deployments.
    diligencePath: Request a customer-cohort export by start year with ARR, modules, renewal status, churn reasons,
      and reference-call availability.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-ten customer revenue share, largest-customer ARR, renewal calendar, termination rights,
      and partner-sourced ARR concentration.
    whyItMatters: A few global banks or platform partners could drive outsized ARR despite a large public logo count.
    diligencePath: Ask management for anonymized customer concentration, channel concentration, and renewal schedule;
      reconcile against billings.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Direct current confirmation for Santander, detailed HSBC deployment outcomes, and current NatWest
      renewal or module-expansion status.
    whyItMatters: Logos without deployment outcomes can overstate production adoption and reference quality.
    diligencePath: Request the latest customer reference deck, permissioned reference calls, and module-by-customer
      deployment matrix.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: procurement-friction
    missingEvidence: Implementation-cycle medians, support-ticket volumes, latency SLAs, SDK incident history, and
      procurement win/loss reasons.
    whyItMatters: Review-site caveats around latency and integration could affect sales cycles, renewals, and customer
      satisfaction.
    diligencePath: Interview implementation leads at three customers and inspect support SLA dashboards and post-implementation
      reviews.
    relatedQuestionRefs:
    - QU024
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
