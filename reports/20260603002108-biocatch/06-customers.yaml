- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or channel risk
  - Impact
  - Diligence path
  rows:
  - - Module expansion from ATO into account opening, scams, mule, Trust, and financial crime
    - Customer may buy one module without expanding broadly
    - Upsell supports NRR only if modules attach and renew
    - Request module attach rates and expansion ARR by cohort.
  - - Alkami mid-market channel
    - Partner may control customer access and economics
    - Efficient logo growth but lower direct relationship visibility
    - Request partner-sourced ARR, gross margin, and churn by partner.
  - - BioCatch Trust network effects
    - Value depends on participating-bank coverage and data permissions
    - Can create defensibility in Australia-like networks
    - Request participation contracts and opt-out/churn history.
  - - Verafin / Nasdaq channel
    - Partnership conversion to end customers not yet named publicly
    - Potential AML adjacency and enterprise distribution
    - Request pipeline conversion and joint-customer references.
  - - Top global banks
    - Largest banks may represent outsized ARR and procurement leverage
    - High concentration could offset 340-logo breadth
    - Request top-10 revenue share, renewal dates, and termination rights.
  - - Enterprise integration complexity
    - Latency, SDK, and bank workflow integration can slow procurement
    - Could elongate sales cycles or create support burden
    - Request implementation-cycle medians and support-ticket aging.
  notes: Risk ratings are diligence hypotheses based on public partner, review, and customer evidence; concentration
    data itself is not publicly disclosed.
