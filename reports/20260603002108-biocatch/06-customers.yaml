company:
  name: BioCatch
chapter:
  number: 6
  title: Customers
  summary: 'BioCatch shows strong customer adoption signals, including more than 340 financial-institution customers,
    90 new customers in 2025, and multiple named bank or credit-union proofs. The investment question is durability:
    public sources validate deployment breadth and channel expansion, but retention, churn, top-customer concentration,
    and contract economics remain private diligence asks.'
sections:
- id: segment-buyer-user-payer-map
  title: Customer segments and buyer/user/payer structure
  body: 'BioCatch’s public customer evidence points to a narrow but valuable customer profile: regulated financial
    institutions, especially banks and credit unions, buying fraud, AML, digital-risk, and financial-crime intelligence.
    The economic buyer is usually a fraud, AML, digital-banking, or risk executive who owns loss reduction and customer-friction
    targets; day-to-day users are fraud operations, investigation, digital-channel, and financial-crime analysts;
    the payer is the bank or platform partner embedding BioCatch into onboarding, account takeover, scam, mule,
    or AML workflows. This segmentation matters because broad customer-count claims do not prove deployment depth.
    The company-reported base of more than 340 financial institutions and half-billion protected end customers is
    strong adoption evidence, but it should be triangulated against named production examples and partner-channel
    sell-through before underwriting retention, expansion quality, renewal durability, or concentration safety.'
  claimRefs:
  - CU001
  - CU002
  - CU005
  - CU006
  - CU007
  - CU039
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-expansion-loops
  title: Adoption trajectory and expansion loops
  body: The 2025 adoption story is unusually explicit for a private fraud vendor. BioCatch reported about 90 new
    customers in 2025, more than $185 million ARR exiting the year, and a North America motion that added more than
    70 mid-market banks and credit unions through partners. Those figures indicate demand expansion, but they remain
    company-claimed and do not disclose active usage, seat penetration, ARR per logo, or renewal cohort. The clearest
    expansion loops are module expansion from account takeover into account opening, mule, scams, Trust, and financial-crime
    workflows; channel expansion through Alkami and Verafin; and network expansion through BioCatch Trust, where
    additional participating banks increase receiving-account intelligence. Private diligence should verify whether
    these loops produce upsell, renewal, and durable fraud-loss ROI rather than merely more logos.
  claimRefs:
  - CU003
  - CU004
  - CU014
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU040
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof-and-quality
  title: Named customer proof and reference quality
  body: Named proof is supportive but uneven. The strongest public examples are Wells Fargo for account-opening
    fraud, St. Mary’s Bank for account-takeover and Link workflows, Gate City Bank through Alkami for fraud prevention,
    ANZ through BioCatch Trust, and historical NatWest deployment evidence. HSBC is supportable as an investor/client-board
    participant and appears in customer-list evidence, but the reviewed sources do not provide a current detailed
    HSBC outcome. Santander should not be treated as publicly proven from the cited evidence. Logos and customer
    lists are useful discovery leads, but they are weaker than customer-authored deployment narratives or bank-specific
    loss-reduction metrics. The diligence standard should therefore separate production references, partner-hosted
    stories, syndicated press, analyst recognition, and bare logo evidence.
  claimRefs:
  - CU008
  - CU009
  - CU011
  - CU012
  - CU013
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU037
  - CU038
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-durability-and-satisfaction
  title: Retention, durability, and satisfaction evidence
  body: 'Public durability evidence remains the biggest gap. Positive signals include high customer-review evidence
    on Gartner, BioCatch’s reported NPS of 72 in mid-2025, curated customer references, repeat partner-channel proof,
    and a product surface that can expand across fraud and financial-crime workflows. None of those substitutes
    for NRR, GRR, logo churn, renewal length, cohort retention, contract duration, top-customer expansion, or customer
    support SLA evidence. The absence of public churn headlines is helpful but not conclusive because enterprise
    bank fraud deployments rarely disclose failed pilots or quiet non-renewals. The right diligence ask is a cohort
    pack: logos by start year, modules live, annual recurring revenue by cohort, renewals, expansion ARR, churn
    reasons, and top ten customer revenue share.'
  claimRefs:
  - CU003
  - CU004
  - CU030
  - CU033
  - CU034
  - CU035
  - CU042
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: adverse-signals-concentration-and-procurement-risk
  title: Adverse signals, concentration, and procurement risk
  body: Adverse customer signals were limited but not absent. Public review sites did not surface a major bank churn
    event or failed deployment, yet G2’s small review base and PeerSpot comments about latency, SDK initialization,
    and integration complexity create procurement-friction diligence items. Customer concentration is also unresolved.
    Serving many financial institutions and several top banks does not reveal how much ARR is concentrated in the
    largest banks, whether large-bank renewals drive most growth, or whether channel partners control important
    mid-market access. The main risk is not lack of customer proof; it is over-reading broad counts and logos as
    retention, account expansion, and concentration safety. BioCatch should provide renewal cohorts, implementation
    cycle data, reference-call access, and partner-sourced ARR by channel.
  claimRefs:
  - CU031
  - CU032
  - CU034
  - CU036
  - CU041
  - CU042
  tableRefs:
  - TU005
  figureRefs: []
