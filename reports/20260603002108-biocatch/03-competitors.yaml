    - Onboarding and identity workflow control point
    - Not enough public evidence for scam-session analytics parity
  - - Internal build / status quo
    - Substitute
    - Derived from how vendor signals feed decision engines and workflows
    - Large banks with data science and fraud operations
    - Control, customization, and governance ownership
    - Hard to replicate external network data and specialized behavioral playbooks
