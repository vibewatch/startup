chapter:
  number: 3
  title: Competitors
  summary: 'BioCatch is competitively differentiated by behavioral depth and bank-scam focus, but the buyer landscape is crowded across behavioral peers, financial-crime incumbents, identity networks, commerce-fraud platforms, and internal bank stacks. Public evidence supports a medium moat: switching costs and behavioral history matter, while suite consolidation, identity-data breadth, multi-homing, and opaque enterprise pricing limit durable pricing power.'
sections:
- id: landscape-and-buyer-alternatives
  title: Landscape and buyer alternatives
  body: BioCatch competes in a landscape that is broader than direct behavioral biometrics. The buyer job is to prevent account takeover, scams, mule activity, fraudulent onboarding, bot abuse, and transaction fraud without adding too much friction for legitimate customers. That job can be solved by direct behavioral-intelligence peers such as ThreatMark and Featurespace, network and device-intelligence platforms such as ThreatMetrix, incumbent financial-crime suites such as NICE Actimize and Feedzai, identity bureaus and orchestration vendors such as Experian, Equifax, Socure, Alloy, Persona, Jumio, and Mitek, and commerce-fraud platforms such as Forter, Riskified, Sift, and SEON. Large banks can also keep parts of the problem in house through rules engines, model stacks, case queues, and vendor-signal orchestration. The diligence implication is that BioCatch should be underwritten as a differentiated signal-and-intelligence layer inside a crowded control stack, not as the only way a bank
    can address fraud.
