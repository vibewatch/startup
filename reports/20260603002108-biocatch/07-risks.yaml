  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: TR001 company-specific litigation and liability allocation
    missingEvidence: A counsel-led docket sweep, claims history, insurance schedule, reserve summary, and top-customer indemnity language for privacy, fraud, and model-performance disputes.
    whyItMatters: The public record did not surface a BioCatch-specific case, but that is not sufficient to clear liability risk for a telemetry-heavy vendor selling into banks.
    diligencePath: Ask outside counsel and management for litigation logs, threatened-claims summaries, insurance coverage, and representative customer contract language.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: model-transparency-gap
    missingEvidence: Module-level false-positive, precision, recall, drift, and explainability evidence for core fraud models, DeviceIQ, and Trust workflows.
    whyItMatters: Without a validation pack, the committee cannot distinguish a compelling product story from a commercially expensive alert engine.
    diligencePath: Request validation reports, customer outcome dashboards, model-release controls, and rollback criteria for the last several major model changes.
    relatedQuestionRefs:
    - QR012
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: concentration-disclosure-gap
    missingEvidence: Top-10 customer revenue share, partner-sourced ARR by channel, renewal schedule, and contribution margin by major relationship.
    whyItMatters: Broad customer counts and network member lists do not show whether a small number of banks or partners dominate BioCatch economics.
    diligencePath: Request customer and partner concentration schedules, cohort retention, and channel economics by the last four quarters.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: security-transparency-gap
    missingEvidence: Current SOC 2 or equivalent report, ISO scope statement, penetration-test summary, incident history, and customer security questionnaire outcomes.
    whyItMatters: The absence of a public trust center does not prove a weak control environment, but it leaves investors and buyers dependent on a private diligence room to clear security and resilience risk.
    diligencePath: Request a trust-center package and recent customer security-review artifacts before treating security posture as de-risked.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR004
