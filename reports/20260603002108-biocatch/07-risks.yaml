  title: Top residual risk
  body: The hardest risk to dismiss publicly is not current demand; it is whether tightening biometrics and AI rules meet opaque concentration, trust-center, and model-governance evidence at exactly the moment BioCatch is being underwritten on sponsor-era growth expectations.
  claimRefs:
