evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership-structure
    missingEvidence: >-
      Exact post-close ownership percentages, board voting arrangements, protective provisions, and any ratchets or
      secondary-only economics from the Permira-led recapitalization.
    whyItMatters: >-
      Control mechanics determine exit optionality, board leverage, and whether sponsor incentives align with minority
      investors and management.
    diligencePath: >-
      Request the cap table, shareholder agreement summary, board observer/consent-right schedule, and transaction-side
      letter from management or counsel.
    relatedQuestionRefs:
      - QO019
      - QO023
      - QO025
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A single canonical employee count and org distribution by geography after the 2025 hiring wave and integrations.
    whyItMatters: >-
      Headcount is a core maturity signal for operating leverage and burn; public sources currently range from 391 to
      461 while official releases only say more than 400.
    diligencePath: >-
      Request the latest payroll or HRIS export, broken out by country and function, and reconcile it against the
      January 2026 press release.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: audited-financial-quality
    missingEvidence: >-
      Audited or management-certified GAAP revenue, gross margin, burn, EBITDA bridge, and cash runway data for
      2024-2026.
    whyItMatters: ARR growth alone cannot answer unit-economics quality, services mix, or near-term financing risk.
    diligencePath: >-
      Request audited financial statements, board deck KPI packs, and monthly management accounts for the trailing
      twelve months.
    relatedQuestionRefs:
      - QO025
  - type: access-blocked
    severity: minor
    topic: capital-history
    missingEvidence: >-
      Open-access confirmation of the full funding-round history and exact total raised from a source not subject to
      profile walls or anti-bot friction.
    whyItMatters: >-
      Third-party databases provide directional capital history, but blockers and partial access make the canonical
      total-raised figure less robust than the valuation anchor.
    diligencePath: >-
      Cross-check Crunchbase or direct management financing history and obtain the last financing memo or board
      financing schedule.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: bioCatch-sam-som
    missingEvidence: >-
      A management-grade segmentation of BioCatch’s current target banks, attachable products, geography split, and
      average contract value by segment.
    whyItMatters: >-
      Without segment-level pricing and conversion assumptions, any public SAM or SOM estimate would be too synthetic
      for investment use.
    diligencePath: >-
      Request pipeline segmentation by institution type and geography, average ARR per customer cohort, and attach-rate
      assumptions for scam, mule, and device modules.
    relatedQuestionRefs:
      - QM023
      - QM025
  - type: missing-source
    severity: material
    topic: category-pricing
    missingEvidence: >-
      Comparable pricing and packaging data for behavioral-biometrics and fraud-orchestration deployments across large
      banks, regional banks, and credit unions.
    whyItMatters: >-
      Pricing architecture determines how much of the broad threat-cost pool can actually convert into vendor revenue
      and how defensible margins are.
    diligencePath: >-
      Collect customer contracts, RFP responses, or benchmark quotes from at least three relevant competitors and
      BioCatch sales materials.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: minor
    topic: tam-estimates
    missingEvidence: >-
      A reconciled explanation of why major analyst firms produce different 2026 market sizes and regional shares for
      the same broad FDP category.
    whyItMatters: >-
      Model drift does not invalidate the market, but it does limit precision when turning top-down TAM into valuation
      assumptions.
    diligencePath: Normalize published definitions and base years across the analyst reports before using them in a valuation model.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing evidence
    missingEvidence: Realized pricing by module, volume band, and contract term for BioCatch and key named competitors.
    whyItMatters: Pricing opacity prevents reliable gross margin and competitive discount analysis.
    diligencePath: Request anonymized contract extracts or RFP comparison sheets from management and reference customers.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win loss
    missingEvidence: Head-to-head win/loss rates against ThreatMetrix, NICE Actimize, Feedzai, Featurespace, and ThreatMark.
    whyItMatters: Public alternatives lists do not reveal whether competitors actually displace BioCatch in bank deals.
    diligencePath: Review CRM opportunity history and interview lost prospects.
    relatedQuestionRefs:
      - QP018
      - QP022
  - type: missing-source
    severity: material
    topic: performance benchmarks
    missingEvidence: Comparable false-positive, detection-lift, and scam-loss reduction benchmarks under similar bank conditions.
    whyItMatters: The moat depends on measurable lift over adjacent signals and suites.
    diligencePath: Ask for controlled POC reports and customer-side validation.
    relatedQuestionRefs:
      - QP016
      - QP021
  - type: private-evidence-only
    severity: minor
    topic: implementation cost
    missingEvidence: Deployment effort, SDK maintenance burden, model tuning hours, and governance approval cycle by customer segment.
