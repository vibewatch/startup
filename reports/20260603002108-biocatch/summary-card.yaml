  topStrengths:
    - >-
      BioCatch has unusual private-company traction proof, including disclosed ARR above $185 million, 340
      financial-institution customers, and penetration into top-tier banks.
    - >-
      The product surface has widened from behavioral biometrics into scams, mule-account detection, device
      intelligence, and intelligence-sharing workflows that can expand wallet share.
    - >-
      Permira backing plus the company-reported 2023 EBITDA-profitability milestone reduce near-term financing anxiety
      and support continued product and geographic investment.
  topRisks:
    - >-
      The central underwriting gap is opacity around audited revenue, gross margin, cash, debt, customer concentration,
      retention cohorts, and the detailed cap-table and preference stack.
    - >-
      Behavioral-biometrics and AI-driven fraud tooling operate in a sensitive privacy and profiling category, so
      regulatory or contractual scrutiny can affect procurement, implementation, and downside scenarios.
    - >-
      Competition is broad across financial-crime suites, identity networks, and other fraud vendors, creating real risk
      that BioCatch is treated as one signal layer rather than a control point with durable pricing power.
  unresolvedGaps:
    - Audited revenue, gross margin, burn, cash, debt, and cash-conversion evidence are still private.
    - >-
      NRR, GRR, churn, contract duration, module-level expansion, and top-customer concentration are not publicly
      disclosed strongly enough to underwrite durability.
    - >-
      Post-Permira ownership percentages, liquidation preferences, board rights, and current exit-waterfall terms remain
      undisclosed in retained public evidence.
    - >-
      Public sources do not provide enough detail on DPIAs, security attestations, model-governance artifacts, or
      bank-specific privacy controls to close diligence on regulatory exposure.
