    {
      "id": "technical-verdict-strengths-and-gaps",
      "title": "Technical verdict, strengths, and remaining gaps",
      "body": "From a diligence standpoint, the strongest part of the product story is architectural coherence. BioCatch now has a credible platform narrative: one telemetry layer, one sequencing engine, graph and network extensions through Link and Trust, and modular use cases that match real bank workflows from onboarding to faster-payments scam prevention. The breadth is not purely marketing. Official product pages, 2025 and 2026 launches, partner integration announcements, customer proof, public GitHub activity, and current integration hiring all point to a product organization still shipping and expanding into device intelligence and consortium-style network workflows. The main caveat is that breadth and novelty do not equal a fully underwritten technical moat. Many of the most important performance numbers remain company-claimed: millisecond response times, nearly 60 percent recognition of genuine device upgrades in two weeks, major uplifts in scam or account-detection rates, and the ability to identify most APP fraud in real time. Public materials also emphasize what the system can see, but say much less about how models are monitored for drift, how false positives are explained to bank operations teams, or what formal attestation package large regulated buyers receive. The chapter verdict is therefore positive on workflow coverage and product architecture, but cautious on verification: BioCatch appears to be a mature behavioral-intelligence platform for banks, yet underwriting should still request model-governance files, security attestations, and live implementation metrics before treating the product as fully de-risked.",
