    {
      "id": "core-models-signals-and-device-intelligence",
      "title": "Core models, signals, and device intelligence",
      "body": "BioCatch’s core technical claim is that fraud is detectable in the sequence and context of how a person uses a banking channel, not merely in static identity or transaction fields. Continuous Behavioral Sequencing is the centerpiece. BioCatch describes multiple machine-learning engines running in parallel over thousands of signals, continuously parsing timing, navigation, copy-paste activity, remote-access indicators, session dead time, active phone calls, application context, device posture, network cues, and transactional activity. The company says these inputs are scored at the user, fraud, and population levels and compared against billions of historical sessions and hundreds of fraud tactics, which is why it frames behavioral intelligence as its primary model input rather than a secondary enrichment layer. DeviceIQ extends this model outward from behavior to device trust. The current product page, launch release, and Biometric Update article all describe persistent device identity across web and mobile, recognition of legitimate upgrades, pre-login detection of jailbroken devices, missing sensors, unauthorized code, and a network effect that reuses prior mule, scam, and account-takeover history. BioCatch further claims DeviceIQai can distinguish human-led, hybrid human-agent, genuine agentic-AI, and fraudulent agentic sessions while flagging virtual cameras and prerecorded media. These are strong company claims and directionally plausible given the telemetry footprint, but the public record remains thin on independent benchmark methodology, module-level false-positive rates, and explainability details for the newer deep-learning models.",
