    "number": 5,
    "title": "Product & Technology",
    "summary": "BioCatch has evolved from a behavioral-biometrics point solution into a bank-native fraud platform built around one telemetry layer, Continuous Behavioral Sequencing models, Link and Trust network intelligence, and new device-intelligence modules. Public evidence strongly supports workflow breadth across onboarding, account takeover, scams, mule detection, and receiving-account risk, but key underwriting gaps remain around independent benchmark quality, model governance and explainability, and public security attestations."
  },
  "sections": [
    {
      "id": "workflow-coverage-and-product-boundary",
      "title": "Workflow coverage and product boundary",
      "body": "BioCatch sells a bank-side fraud stack that is easiest to understand by customer workflow rather than by a single algorithm. Official pages, launch releases, the Azure marketplace listing, and partner materials show the product now starts at account opening, continues through login and session monitoring, extends into payment-time scam detection, and then branches into mule-account detection, device trust, and receiving-account intelligence across institutions. In other words, BioCatch is not only claiming continuous authentication or bot detection; it is packaging a coordinated set of decision engines that sit across the full digital-banking journey. The product boundary is clearest in Connect and Connect 2.0. BioCatch says Align unifies application, behavioral, device, network, and transactional capture, while Link maps relationships among users, devices, and payments. The module pages then anchor how those primitives are deployed: Account Opening Protection screens stolen or synthetic identities and bots before an account exists; continuous protection evaluates whether a logged-in user still behaves like the legitimate customer; Scams360 looks for manipulation states that make an otherwise authorized payment suspicious; Mule Account Detection and Trust shift the lens to criminal accounts and receiving-side networks. Customer and partner evidence from St. Mary’s Bank, Macquarie, and Nasdaq Verafin corroborates that the intended outcome is analyst action before money leaves an account, not just after-the-fact case review.",
