    {
      "id": "privacy-compliance-and-governance-constraints",
      "title": "Privacy, compliance, and governance constraints",
      "body": "Privacy and compliance are tightly bound to the product because BioCatch continuously collects session, device, and interaction data. BioCatch’s privacy notice says the service collects usage and device data, logged activities, clicks, and session interactions, supports GDPR and CCPA-style access and deletion rights, uses retention criteria tied to purpose and legal obligation, and may create aggregated or pseudonymized datasets for research and service improvement. DeviceIQ separately claims that it collects no names, addresses, or social security numbers and that user and account data are pseudonymized. Trust uses the same pseudonymization framing for interbank receiving-account intelligence. Taken together, the public message is that BioCatch wants to widen telemetry coverage while minimizing directly identifying data in the product plane. That design choice helps, but it does not eliminate compliance risk. The FTC has warned that behavioral or other biometric systems can create privacy, security, bias, and deceptive-claims exposure and expects ongoing monitoring of technologies and third-party practices. The BCLP tracker shows how quickly state biometric legislation is moving toward written policies, retention schedules, and explicit consent requirements. Those frameworks matter because BioCatch’s promise of low-friction continuous monitoring can collide with local disclosure, retention, and vendor-management rules. Notably, the retained public sources surfaced a privacy notice but not a named trust-center package, SOC 2 report, ISO 27001 certificate, or public fairness and explainability documentation for current models.",
