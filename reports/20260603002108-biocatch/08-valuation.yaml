- id: V004
  title: Diligence gaps, thesis-break triggers, and final stance
  body: |-
    The unresolved diligence work is unusually important because the gap between a fair valuation and a stretched one is driven less by topline demand than by what sits underneath the topline. Public sources do not answer the questions that actually determine whether BioCatch deserves a premium over public comps: how ARR converts into recognized revenue, what gross margins and free cash flow look like, how concentrated the customer base is, what net retention actually is, how much margin is shared with partners, and what rights a new minority investor would receive beneath sponsor control. Those are not cosmetic gaps; they are the main valuation variables.

    That is why the thesis-break triggers are concrete. If audited economics show low-quality or concentrated ARR, if partner or network economics are weaker than the marketing suggests, or if any new financing or secondary transaction clears below the Permira-era mark, the current valuation narrative should be re-underwritten immediately. Until those issues are closed, the best synthesis is straightforward: BioCatch looks fair near the known 2024 transaction, stretched above roughly $1.6 billion to $1.8 billion, and attractive only on a cheaper entry or materially stronger diligence evidence. The company remains worth following closely, but it does not currently justify paying for uncertainty as if uncertainty were proof.
