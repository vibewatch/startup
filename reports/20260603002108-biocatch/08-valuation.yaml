- id: V003
  title: Scenario range, return discipline, and exit readiness
  body: |-
    The base case is not a blowout-return setup at the known 2024 mark. A blended underwriting view that uses the control transaction, current ARR disclosures, public comp discounts, and disclosure penalties lands around roughly $1.1 billion to $1.6 billion. That range implies limited upside for a new investor entering near $1.3 billion unless BioCatch can prove the company has premium-quality software economics behind the ARR story. The bull case still exists: if growth remains above 20%, partner and network channels deepen distribution without crushing economics, and management can show strong retention and margins, then a $1.7 billion to $2.2 billion outcome becomes defensible. The bear case is equally real: weaker economics, slower growth, or tighter regulatory and partner costs can drive the company back toward roughly $0.8 billion to $1.0 billion.

    Return discipline therefore matters more than company admiration. At or above the Permira-era price, probability-weighted outcomes resemble modest growth-equity returns rather than classic venture-style multiples. That pushes the underwriting posture toward track rather than buy. Exit readiness is also constrained. BioCatch looks more like a sponsor-owned private company than an IPO-ready issuer on current disclosure alone, so the most realistic exit paths today are sponsor-managed secondary liquidity or strategic interest from broader fraud, identity, or payments software platforms rather than a near-term public listing.
