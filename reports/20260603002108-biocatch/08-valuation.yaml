- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key downside trigger
  - Probability signal
  rows:
  - - Bull
    - ARR stays above 20% growth, partner and network channels add high-quality expansion, and diligence proves premium margins and retention.
    - $1.7B-$2.2B EV; roughly 1.3x-1.7x versus the known $1.3B anchor.
    - Premium economics fail to appear in audited data.
    - ~25%
  - - Base
    - ARR remains around the current public scale, growth moderates, and BioCatch keeps only a measured premium to adjacent public comps.
    - $1.1B-$1.6B EV; roughly 0.9x-1.2x versus the known anchor.
    - Opacity on revenue quality, margins, and concentration persists.
    - ~50%
  - - Bear
    - Growth compresses toward public-comp levels, regulatory or partner costs rise, and financing appetite weakens.
    - $0.8B-$1.0B EV; roughly 0.6x-0.8x versus the known anchor.
    - A new down-marked transaction or disappointing diligence pack.
    - ~25%
  notes: These are blended scenario brackets using transaction, ARR, and public-comp lenses; no DCF is attempted because audited margin and cash-flow data are not public.
