  - - NICE
    - Public fraud / compliance software P/S and revenue
    - ~$5.67B market cap, ~$2.94B TTM revenue, ~1.46x P/S
    - Relevant bank-fraud and compliance adjacency
    - Large diversified software company, not a focused growth-stage vendor
  - - Adyen
    - Public payments software P/S and revenue
    - ~$32.65B market cap, ~$3.10B 2025 revenue, ~5.26x P/S
    - Premium software-quality payments lens
    - Payments processor economics are not the same as fraud-software economics
  - - Fiserv
    - Public payments infrastructure P/S and revenue
    - ~$30.10B market cap, ~$21.19B TTM revenue, ~1.17x P/S
    - Bank and payments workflow reference point
    - Mature diversified processor, so growth and margin structure differ heavily
