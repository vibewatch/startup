company:
  name: BioCatch
chapter:
  number: 8
  title: Valuation
  summary: 'BioCatch’s 2024 $1.3 billion Permira control transaction still looks broadly defensible against the company’s later public ARR and scale disclosures, but it is not obviously cheap relative to public fraud and payments software lenses that mostly trade at lower sales multiples. The prudent stance is price-sensitive: fair near the known Permira mark, stretched above roughly $1.6 billion to $1.8 billion, and attractive only if audited revenue quality, margins, cash generation, and control terms prove materially better than the public record currently shows.'
sections:
- id: V001
  title: Investment thesis, anti-thesis, and recommendation
  body: |-
    BioCatch is not being valued like an early product-market-fit experiment anymore. The 2024 Permira control deal at a $1.3 billion enterprise valuation came after BioCatch publicly said it had passed $100 million ARR, reached EBITDA profitability in 2023, and built a meaningful bank footprint. Since then, the company has added stronger public scale markers: more than $160 million ARR by mid-2025, more than $185 million ARR by year-end 2025, more than 340 financial institutions served, and visible partner or network assets such as Nasdaq Verafin and BioCatch Trust. Those facts support an investment thesis that BioCatch is a scaled fraud platform with enough breadth and category credibility to deserve more than mature payments-infrastructure multiples.

    The anti-thesis is that the public evidence remains sponsor-era and selective. The key operating facts are largely company-issued ARR updates rather than audited consolidated disclosures; current gross margin, cash generation, concentration, and board-control terms are not public; and current private-market marks come from screen providers with delayed or derived methodology. That means the right call is neither “cheap quality compounder” nor “hard avoid.” It is a diligence-gated track stance. Around the 2024 Permira mark, the price can still be defended. Above that level, conviction should rise only if diligence closes the biggest quality-of-earnings and governance gaps.
