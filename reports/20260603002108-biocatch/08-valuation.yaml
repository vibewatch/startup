- id: V002
  title: Valuation context and comparable lenses
  body: |-
    The cleanest lens is the known transaction lens: Permira agreed to buy control at $1.3 billion in 2024 through a largely secondary deal. That is a real reference point, but it is not a clean 2026 minority price because sponsor control, secondary liquidity, and private negotiations can produce economics that a new outside investor does not share. The second lens is the ARR bridge. If BioCatch stayed near the same valuation while public ARR moved from just over $100 million in 2023 to more than $185 million by the end of 2025, the implied multiple compressed from premium-growth territory toward a roughly 7x ARR zone. That is materially more digestible than the initial headline suggested.

    The third lens is the public comp set. Directional public sales multiples for Riskified, NICE, Adyen, and Fiserv sit around roughly 1x to 5x sales, even though those businesses are not perfect matches. BioCatch can argue for a premium because it is more focused on bank fraud and behavioral intelligence and may benefit from network assets such as Trust and Verafin. But the public evidence does not prove premium margins or retention, so investors should resist jumping from “good company” to “open-ended premium multiple.” Forge, PM Insights, and Tracxn all help frame where the market still thinks BioCatch sits, yet each comes with meaningful transparency limits. Together, those lenses argue for a valuation bracket rather than a single heroic point estimate.
