- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Scale
    - '> $185M ARR and >340 financial institutions indicate real enterprise scale.'
    - ARR disclosures are company-issued and not yet reconciled to audited revenue quality.
    - Provide audited ARR-to-revenue bridge and quality-of-revenue commentary.
  - - Category position
    - BioCatch has visible third-party recognition and large-bank relevance.
    - Recognition and reviews are weaker evidence than audited retention or margin superiority.
    - Show renewal, expansion, and cohort profitability data.
  - - Network effects
    - Trust and Verafin can justify a premium if they deepen data and distribution.
    - Public sources do not show how much economic value BioCatch actually captures from those channels.
    - Disclose partner-sourced ARR, gross margin, and renewal ownership.
  - - Transaction anchor
    - $1.3B was a real control transaction, not a paper headline.
    - It was sponsor-led and largely secondary, so it is not a clean 2026 minority entry price.
    - Show a fresh primary financing or tender with transparent terms.
  - - Public comp lens
    - A software-style lens is appropriate because BioCatch sells a B2B SaaS fraud product.
    - Public fraud and payments comps still trade mostly below BioCatch’s implied multiple.
    - Prove premium economics rather than asking investors to assume them.
  - - Exit path
    - Strategic or sponsor-led monetization remains plausible.
    - Current disclosure looks well short of IPO-ready.
    - Deliver public-company-grade disclosure and governance package.
  notes: This table separates business quality from price discipline; a good company can still be an over-asked deal.
