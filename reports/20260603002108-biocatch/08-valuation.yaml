  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table coverage
    missingEvidence: A direct public bank-behavioral-biometrics comparable or a recent clean minority primary BioCatch round with disclosed economics.
    whyItMatters: The comparable set is necessarily adjacent, so the valuation range remains a bracket rather than a precise underwriting anchor.
    diligencePath: Request management’s own board valuation framework, banker comp set, and any recent secondary or tender documentation.
    relatedQuestionRefs:
    - QV016
    - QV018
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: gross margin and cash-flow quality
    missingEvidence: Audited FY2025 revenue-recognition bridge, gross margin, EBITDA adjustments, and free-cash-flow reconciliation.
    whyItMatters: A premium to public fraud and payments comps is only defensible if ARR converts into high-quality revenue and cash generation.
    diligencePath: Obtain audited FY2025 statements, management bridge from ARR to recognized revenue, and board materials on margin profile.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: blocking
    topic: cash runway and liquidity
    missingEvidence: Current cash balance, debt, covenant status, and monthly cash burn after the Permira transaction.
    whyItMatters: Entry pricing and downside protection depend on whether BioCatch is self-funding growth or still consuming meaningful cash.
    diligencePath: Request latest board package, cash bridge since closing, and any debt or vendor-financing schedules.
    relatedQuestionRefs:
    - QV029
  - type: missing-source
    severity: blocking
    topic: cap table and control terms
    missingEvidence: Current cap table, liquidation preferences, minority protections, board composition, reserved matters, and any drag or tag provisions after Permira control.
    whyItMatters: Control economics can make an apparently fair valuation unattractive to a new minority investor even if the operating business is sound.
    diligencePath: Review post-closing shareholders agreement, option plan, latest cap table, and any tender or rollover documentation.
    relatedQuestionRefs:
    - QV030
  - type: missing-source
    severity: material
    topic: customer concentration and net retention
    missingEvidence: Named top-customer revenue share, cohort churn, renewal rates, expansion rates, and net revenue retention by product and channel.
    whyItMatters: Without concentration and NRR evidence, the valuation cannot distinguish durable bank-platform economics from a thinner set of large-account wins.
    diligencePath: Request customer cohort tables, top-10 revenue concentration, renewal history, and partner-sourced ARR mix.
    relatedQuestionRefs:
    - QV031
