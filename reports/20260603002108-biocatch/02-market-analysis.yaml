tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to BioCatch
  rows:
  - - Enterprise fraud detection and prevention
    - Transaction monitoring, authentication, case management, analytics, AML-adjacent fraud tools across industries
    - Physical-branch controls, endpoint antivirus, generic cyber tools
    - Large enterprises, banks, merchants, governments
    - Sets the broad umbrella TAM but overstates BioCatch’s immediate addressability.
  - - Behavioral biometrics
    - Continuous behavioral and device analytics for authentication, risk scoring, and session monitoring
    - One-time document verification and static MFA sold without behavioral scoring
    - Banks, fintechs, identity teams
    - Closest category fit for BioCatch’s core product positioning.
  - - Bank scam / APP / mule orchestration
    - Real-time payment monitoring, scam detection, mule-account and receiving-account analytics
    - Pure card-authorization tools without account- or session-layer analytics
    - Fraud, payments, AML, and operations teams at banks
    - High-value adjacent workflow where BioCatch is expanding.
  - - Status-quo substitute stack
    - Rules engines, device fingerprinting, manual review, step-up authentication, network scores
    - N/A
    - Existing fraud budgets inside banks
    - Represents the real budget competition for new deployments.
  - - Cross-bank intelligence and consortium workflows
    - Signal sharing, receiving-bank/originating-bank coordination, network overlays
    - Standalone on-prem tools with no external signal exchange
    - Payments operators, partner platforms, consortium operators
    - Important because BioCatch increasingly partners into shared-data environments.
  notes: 'Boundary table is analytical rather than formulaic: it distinguishes the broad spend pool from the narrower category and workflow slices most relevant to BioCatch.'
