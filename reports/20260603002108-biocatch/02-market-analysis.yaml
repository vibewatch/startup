chapter:
  number: 2
  title: Market Analysis
  summary: 'BioCatch sells into a large and fast-growing fraud detection and prevention stack, but its economically relevant niche is narrower: behavioral biometrics, device intelligence, and cross-bank scam/ATO orchestration inside BFSI. External market models place the 2026 global FDP market in the high-$60 billions and the 2026 behavioral biometrics segment around $3.5 billion, with BFSI as the dominant buyer vertical. The chapter’s main conclusion is that demand is structurally expanding because instant payments, AI-enabled scams, and reimbursement pressure are raising urgency, while the main constraints remain privacy, false positives, fragmented bank data, and the absence of a clean public SOM for BioCatch.'
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and status-quo substitutes
  body: 'For diligence purposes, BioCatch should not be valued against the full fraud-prevention universe as if every dollar of that spend were reachable. The company sits inside a broader fraud detection and prevention stack that includes transaction monitoring, authentication, AML/fraud case management, payment-network scoring, and identity verification, but its most relevant niche is the behavioral-biometrics and device-intelligence layer used to identify anomalous digital behavior in real time. That narrower definition matters because the budget conversation inside banks is not “whether to fight fraud,” but which controls receive incremental spend. Status-quo substitutes still absorb meaningful budget: rules engines, manual review teams, device fingerprinting, step-up MFA, and consortium scoring. The practical implication is that BioCatch benefits from a large market umbrella, but wins and pricing depend on proving that behavioral analytics can reduce false positives, improve scam detection,
    and coordinate with adjacent controls rather than replace the entire stack.'
  claimRefs:
