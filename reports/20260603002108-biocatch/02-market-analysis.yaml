- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer
  - Primary user
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Tier-1 global banks
    - Fraud executive / chief risk office
    - Fraud ops, AML investigators, payments analysts
    - Central fraud / risk program budget
    - Cross-channel fraud, scam, and mule detection
    - High loss exposure, reimbursement pressure, and regulatory scrutiny.
  - - National / regional banks
    - Fraud leader plus digital product sponsor
    - Fraud ops, digital banking, case management
    - Shared fraud + digital budget
    - Login, onboarding, RTP, ACH, and scam monitoring
    - Need to protect digital growth without raising friction.
  - - Credit unions / community banks
    - Operations and fraud leader, often via platform partner
    - Fraud analysts and branch support teams
    - Operations / partner-platform budget
    - Card, ACH, and member scam protection
    - Resource constraints favor embedded or partner-led deployments.
  - - Payment processors / issuers / acquirers
    - Payments risk leader
    - Payments fraud and authorization teams
    - Payments P&L / risk budget
    - Real-time authorization and fraud scoring
    - High transaction velocity and chargeback pressure.
  - - Fintechs / digital wallets
    - Risk + product leadership
    - Risk ops, trust & safety, growth teams
    - Product / trust & safety budget
    - Onboarding, account takeover, and payment fraud
    - Need low-friction controls that preserve conversion and trust.
  notes: Buyer map simplifies actual bank procurement committees; in practice fraud, AML, product, payments, compliance, and IT all influence the decision.
