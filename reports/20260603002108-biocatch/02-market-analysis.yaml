- id: market-size-and-sizing-lenses
  title: Market size, sizing lenses, and what is actually relevant to BioCatch
  body: 'Public market-sizing reports agree on direction but not on a single canonical number. Mordor Intelligence places the 2026 global fraud detection and prevention market at $70.19 billion, while Fortune Business Insights places it at $67.12 billion; both also show BFSI as one of the largest or the largest spending verticals. For the narrower behavioral-biometrics category, Mordor estimates a 2026 market size of $3.45 billion, with BFSI holding 44.1% of 2025 revenue. That creates a useful lens for BioCatch: the company does not need to capture meaningful share of the entire FDP stack to build a large business if a relatively small but high-growth slice of banking spend moves toward behavior-led orchestration. A second sizing lens is the problem pool rather than vendor revenue: APP scam losses alone are projected to hit $5.25 billion across the U.S., U.K., and India by 2026. The right analytical stance is therefore to triangulate across spend models, threat-cost models, and BioCatch’s
    disclosed installed base rather than force a fake precision around a single TAM.'
