- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Digital payments, open banking, and instant rails
    - Driver
    - Current
    - Expands attack surface and increases spend on real-time analytics.
    - What share of BioCatch ARR is tied directly to instant-payment and scam workflows?
  - - Generative AI, deepfakes, synthetic identities
    - Driver
    - Current
    - Raises urgency for behavior-aware and context-aware detection.
    - How often are BioCatch models retrained against AI-enabled attack patterns?
  - - Nacha 2026 ACH monitoring rules
    - Driver
    - Current
    - Pushes more institutions toward explicit fraud-monitoring procedures for false pretenses and receiving accounts.
    - How much U.S. demand pipeline is linked to ACH-rule readiness?
  - - Reimbursement / liability debates
    - Driver
    - Near term
    - Shifts scam losses closer to bank P&Ls and supports preventive spending.
    - Which customer geographies show strongest payback from reimbursement pressure?
  - - Privacy / biometric-data scrutiny
    - Constraint
    - Current
    - Can slow deployments, enlarge legal review, and limit data sharing.
    - What consent and privacy-by-design controls shorten sales cycles?
  - - Legacy integration complexity
    - Constraint
    - Current
    - Long deployments and fragmented data can delay realized ROI.
    - What is the median time-to-value and integration burden by segment?
  - - False positives and user friction
    - Constraint
    - Current
    - Weak implementations can harm customer experience and suppress adoption.
    - What measurable false-positive reductions do customers achieve post deployment?
  - - Weak cross-ecosystem execution
    - Constraint
    - Current
    - Banks cannot solve scams alone if telcos/platforms do not cooperate.
    - How much value depends on partner and consortium participation versus standalone deployment?
  notes: Direction indicates whether the factor expands or constrains category demand; timing is judgmental and based on current public evidence rather than a formal forecast model.
