  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: bioCatch-sam-som
    missingEvidence: A management-grade segmentation of BioCatch’s current target banks, attachable products, geography split, and average contract value by segment.
    whyItMatters: Without segment-level pricing and conversion assumptions, any public SAM or SOM estimate would be too synthetic for investment use.
    diligencePath: Request pipeline segmentation by institution type and geography, average ARR per customer cohort, and attach-rate assumptions for scam, mule, and device modules.
    relatedQuestionRefs:
    - QM023
    - QM025
  - type: missing-source
    severity: material
    topic: category-pricing
    missingEvidence: Comparable pricing and packaging data for behavioral-biometrics and fraud-orchestration deployments across large banks, regional banks, and credit unions.
    whyItMatters: Pricing architecture determines how much of the broad threat-cost pool can actually convert into vendor revenue and how defensible margins are.
    diligencePath: Collect customer contracts, RFP responses, or benchmark quotes from at least three relevant competitors and BioCatch sales materials.
    relatedQuestionRefs:
    - QM024
  - type: conflicting-data
    severity: minor
    topic: tam-estimates
    missingEvidence: A reconciled explanation of why major analyst firms produce different 2026 market sizes and regional shares for the same broad FDP category.
    whyItMatters: Model drift does not invalidate the market, but it does limit precision when turning top-down TAM into valuation assumptions.
    diligencePath: Normalize published definitions and base years across the analyst reports before using them in a valuation model.
    relatedQuestionRefs:
    - QM003
    - QM004
    - QM005
