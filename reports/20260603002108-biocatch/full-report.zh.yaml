              关于盈利能力改善的说法，这降低了近期融资风险担忧。不过，Companies House 证据仅限于 BioCatch (EMEA) Limited
              的小公司申报历史，不是合并集团财务。重要缺口仍包括经审计收入、收入确认、毛利率、托管和支持成本、烧钱速度、现金余额、债务、所有权经济性，以及按客户队列拆分的实际定价。因此结论是建设性但受尽调门控：作为私营欺诈
              SaaS 公司，收入质量看起来较高，但没有管理层提供的财务报表、队列文件和合同，就无法给利润率路径和资本强度打分。管理层访谈应专门对齐 ARR 质量与现金转换、续约集中度、合作伙伴经济性和隐私合规支出。
