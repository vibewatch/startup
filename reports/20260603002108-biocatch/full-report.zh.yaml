      - number: '3.2'
        title: 能力广度、包装与无支撑单元格
        blocks:
          - type: paragraph
            body: >-
              功能对比在行为深度和以诈骗为中心的定位上对 BioCatch 有利，但在整体套件广度上不那么有利。NICE Actimize 和 Feedzai
              面向那些希望把欺诈、AML、案件管理和金融犯罪运营放进广泛企业计划的买方。ThreatMetrix、Experian、Equifax、Socure 和 Alloy 从身份、设备、数据网络角度给 BioCatch
              施压。SEON、Sift、Forter 和 Riskified 展示了相邻欺诈厂商如何用快速集成、API
              驱动包装，以及围绕拒付或通过率的结果语言，切入电商或金融科技用例。定价证据有意保守。公开页面通常只能支持包装方向，不能支持具体企业价格；SEON 页面给出了最清晰的按 API
              调用计费信号。因此，表格把缺乏支撑的价格、误报和部署经济性单元格标为“未知”，而不是从评论轶事里推算数值。这种保守处理很重要，因为采购团队常会比较营销页上从不出现的私有维度：最低年度承诺、数据留存条款、服务抵免、模型治理材料、专业服务负担，以及某个模块是否打包进更大的企业协议。公开证据仍足以做方向性地图，但不足以给出精准总拥有成本（TCO）评分。
