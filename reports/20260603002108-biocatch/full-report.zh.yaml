  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              BioCatch 的估值已不再像早期产品市场匹配实验。2024 年 Permira 控股交易给出 $1.3 billion 企业估值；在此之前，BioCatch 公开称已超过 $100 million
              ARR、2023 年实现 EBITDA 盈利，并建立了有意义的银行客户版图。 此后，公司又增加了更强的公开规模标记：到 2025 年中 ARR 超过 $160 million，到 2025 年底 ARR 超过
              $185 million，服务超过 340 家金融机构，并拥有 Nasdaq Verafin、BioCatch Trust 等可见伙伴或网络资产。 这些事实支撑一个投资逻辑：BioCatch
              已是有规模的欺诈平台，宽度和品类可信度足以支撑其估值高于成熟支付基础设施倍数。


              反向逻辑在于，公开证据仍停留在 PE 资方时期且具有选择性。关键运营事实大多来自公司发布的 ARR
              更新，而不是经审计的合并披露；当前毛利率、现金生成、集中度和董事会控制条款都未公开；当前私有市场标记来自行情屏数据商，方法存在滞后或派生。
              这意味着正确判断既不是“便宜的优质复利公司”，也不是“坚决回避”。更合适的是带尽调门槛的观察立场。 在 2024 年 Permira
              标记附近，价格仍可辩护。高于这个水平时，只有尽调补齐最大的盈利质量和治理缺口，确信度才应上升。
