    title: 估值敏感性
    type: bar
    layout: wide
    summary: BioCatch 估值对当前 ARR 基数适用的倍数最敏感，也取决于尽调会缩小还是扩大不透明折扣。
    data:
      items:
        - label: $185M ARR 的 4.0x
          value: 740
        - label: $185M ARR 的 5.5x
