      - - 公开可比公司视角
        - BioCatch 销售 B2B SaaS 反欺诈产品，因此适合用软件公司视角。
        - 公开反欺诈和支付可比公司交易倍数仍大多低于 BioCatch 隐含倍数。
        - 证明溢价经济性，而不是要求投资人默认存在。
