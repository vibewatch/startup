      - number: '7.3'
        title: 合作伙伴、客户集中度与平台整合风险
        blocks:
          - type: paragraph
            body: >-
              BioCatch 的商业上行和依赖风险越来越绑在一起。Nasdaq Verafin 合作在战略上重要，因为 BioCatch 被放进了更大的金融犯罪分发面；ABA 称 Verafin 已服务超过 2,500
              家机构，合计资产超过 $9 trillion。 这种触达能加快采用，也意味着 BioCatch 与平台所有者合作时，对方掌握更多直接客户触点、更宽的工作流控制权，定价杠杆也可能更强。
              澳大利亚也有同样模式。BioCatch Trust 的护城河叙事有吸引力，因为该网络声称覆盖澳大利亚超过 85% 银行客户，Macquarie 和 ANZ 等客户资料也描述了实际效用。
              但这道护城河取决于银行继续参与、共享数据，并把网络洞察转成动作。公开材料在直接集中度披露上明显更弱：它们列出成员、合作伙伴和大致客户数量，却没有按银行、伙伴、地区或渠道拆收入结构。 竞争风险又叠加这一问题，因为
              2026 年替代方案清单和市场数据源把 BioCatch 放在一个买方集合里，里面有更宽的欺诈、Bot 防御和身份平台。 因此，承销问题不只是 BioCatch
              是否差异化，而是它能否在更大的套件和伙伴主导渠道里继续守住关键决策位置。
