      - number: '1.2'
        title: 领导层、董事会与控制权转换
        blocks:
          - type: paragraph
            body: >-
              BioCatch 的公开领导层材料显示，公司起点是创始人主导的技术路线，随后在 Gadi Mazor 领导下进入运营型扩张阶段。官方历程显示 Mazor 于 2018 年以 COO
              身份加入，董事会材料和外部演讲者简介则把他的 CEO 交接放在 2021 年。重要的是，2023 年以来披露的运营里程碑——ARR
              增长提速、合作伙伴驱动分销、更广地域扩张和一次重大控制权交易——都发生在同一管理团队任内。Permira 2023 年的少数股权投资在 2024
              年变成多数股权收购后，治理结构也发生实质变化。官方董事会材料和交易完成公告列出 Permira 系董事 Dominik Pozny、Stefan Dziarski 和 Ran Maidan，同时保留 Liat
              Nadai Arad、Sallie Krawcheck 等独立背景董事。最后呈现的是一家保持运营连续性、但所有权和董事会影响力转向成长型私募股权赞助方的公司。
