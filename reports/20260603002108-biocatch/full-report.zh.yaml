  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争图谱与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              BioCatch 竞争的图谱比直接行为生物识别更宽。买方要完成的任务，是在不为真实客户增加过多摩擦的情况下，防住账户接管、诈骗、骡子活动、欺诈性开户、机器人滥用和交易欺诈。这个任务可以由直接的行为智能同业解决，如
              ThreatMark 和 Featurespace；也可以由 ThreatMetrix 等网络和设备智能平台、NICE Actimize 和 Feedzai
              等既有金融犯罪套件、Experian、Equifax、Socure、Alloy、Persona、Jumio 和 Mitek 等身份机构与编排厂商，以及 Forter、Riskified、Sift 和 SEON
              等电商欺诈平台来解决。大型银行还可以通过规则引擎、模型栈、案件队列和供应商信号编排，把部分问题留在内部。尽调含义是，BioCatch
              应按拥挤控制栈里差异化信号与情报层来承销，而不是按银行应对欺诈的唯一方案来承销。
