        - 需要按模块披露公开可用性、延迟和误报基线
      - - Account Opening Protection
        - 开户和身份风险团队
        - 成熟用例
        - 开户前用多信号识别被盗身份、合成身份、机器人和钱骡招募风险
        - 公开通过率和误报数据未披露
      - - 账户接管 / 持续防护
        - 登录和会话欺诈团队
        - 成熟用例
        - 持续会话验证超出单点认证
        - ATO 模型没有公开的独立 SLA 或可解释性包
      - - Scams360 / 社会工程检测
        - 支付和诈骗运营团队
        - 快速成熟；当前版本于 2025 年发布
        - 读取仅靠交易工具会漏掉的操控信号，覆盖冒充诈骗、投资诈骗、情感诈骗、BEC 和购物诈骗
        - 告警率方法论和跨银行可复现性未公开
      - - Link + Mule Account Detection
        - 欺诈和 AML 调查员
        - 趋于成熟
        - 映射用户、设备和支付，暴露协同钱骡和洗钱网络
        - 图谱阈值、可审计性和调查员工作量指标未公开
      - - Trust 跨行网络
        - 收款账户和支付风险团队
        - 早期阶段，但已在澳大利亚扩张
        - 资金离开发送方账户前，基于行为和设备提供收款账户情报
        - 经济性、治理条款和澳大利亚以外的可移植性未公开
      - - DeviceIQ + DeviceIQai
        - 认证、设备风险和数字身份团队
        - 2026 年初发布
        - 持久设备身份，加上登录前健康检查和 AI 会话区分
        - 独立验证、证明包和长期精确率数据未公开
    notes: 成熟度标签是分析师基于公开发布时间、客户证据和当前文档广度作出的判断，而非经审计的出货数据。
