      - number: '2.4'
        title: 增长驱动、约束与监管压力
        blocks:
          - type: paragraph
            body: >-
              这个市场最强的增长驱动是结构性的：支付数字化、开放银行和即时支付轨道、欺诈从卡中心转向 APP 和诈骗类型，以及 AI 赋能社工的工业化。Mordor、ACI、Mastercard 和 INTERPOL
              系报告都指向同一宽泛模式：攻击更快、更个性化、跨渠道更多，因此具备行为感知和网络感知的防御更有价值。但市场并非没有摩擦。隐私规则、数据共享约束、生物识别数据的同意要求、遗留核心系统和误报负担，仍会拖慢部署并扩大实施成本。赔付和监控规则也在同步抬高赌注。Nacha
              的 2026 年阶段安排扩大了 ACH 欺诈监控责任，英国和澳大利亚的诈骗责任争论则解释了银行为何从反应式控制转向预测式预防。结果是，市场顶线顺风很强，但执行质量、可解释性和集成纪律决定谁真正拿到钱包份额。
