chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、布局和产品边界
        blocks:
          - type: paragraph
            body: >-
              BioCatch 成立于 2011
              年，初衷是通过分析真实用户和欺诈者如何与设备、银行界面互动，解决数字身份和线上欺诈问题。官方公司材料把业务定义为面向欺诈预防、开户注册、账户接管、骡子识别、诈骗和强客户认证的行为生物识别与设备智能平台。公开公司历程把起点连到创始人
              Avi Turgeman 的军事情报背景，以及“人机交互可被测量且具有差异性”的洞察。公开页面一致将总部锚定在 Tel Aviv，公司和目录来源则显示其国际足迹包括 New York、London
              以及其他区域地点。综合官方和合作伙伴披露，公司运营模式是向金融机构销售软件和情报，而不是触达消费者端点；因此，BioCatch 的规模叙事离不开银行部署广度和每月分析会话量。
