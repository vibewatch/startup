        title: 资本拐点、牵引力与披露规模
        blocks:
          - type: paragraph
            body: >-
              公开披露支持 2023 年至 2026 年初的快速扩张曲线。BioCatch 和 Permira 均称公司在 2023 年越过 $100 million ARR，并实现 EBITDA 盈利；2024
              年中披露随后显示 ARR 增长 43%、净美元留存率 130%、超过 200 家金融机构、每月会话超过 11 billion。到 2025 年中，公司称 ARR 已超过 $160 million，部署机构超过
              280 家金融机构；2025 年 9 月与 Nasdaq Verafin 的联盟则显示，BioCatch 的分销模式越来越把直销与网络和平台伙伴结合起来。2026 年 1 月发布是当前最清晰的锚点：ARR 超过
              $185 million、340 家金融机构、每月 17 billion 会话、660 million 名受保护银行客户、员工数超过
