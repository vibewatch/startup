  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流覆盖与产品边界
        blocks:
          - type: paragraph
            body: >-
              BioCatch 销售的是银行侧反欺诈栈，按客户工作流理解比按单一算法理解更简单。官方页面、发布稿、Azure Marketplace
              列表和合作伙伴材料显示，产品现在从开户注册开始，延伸到登录和会话监控，再进入支付时点的诈骗检测，并进一步分支到骡子账户检测、设备信任和跨机构收款账户情报。换言之，BioCatch
              不只是声称连续身份验证或机器人检测；它是在打包一组协同决策引擎，覆盖完整数字银行旅程。产品边界在 Connect 和 Connect 2.0 中最清楚。BioCatch 称 Align
              统一应用、行为、设备、网络和交易采集，Link 则映射用户、设备和支付之间的关系。模块页面随后锚定这些原语如何部署：Account Opening Protection
              在账户存在之前筛查被盗或合成身份和机器人；持续保护评估已登录用户是否仍像真实客户那样操作；Scams360 寻找让原本授权付款变得可疑的操控状态；Mule Account Detection 和 Trust
              把镜头转向犯罪账户和收款侧网络。St. Mary’s Bank、Macquarie 和 Nasdaq Verafin 的客户与合作伙伴证据相互印证：目标结果是在资金离开账户前让分析师行动，而不只是事后案件复盘。
