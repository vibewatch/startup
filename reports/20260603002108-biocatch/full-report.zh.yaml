  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 作用
      - 关键依赖
      - 风险
    rows:
      - - Align / 遥测 SDK
        - 跨 Web 和移动端采集行为、设备、网络、应用和交易遥测
        - 银行需在浏览器、App、WebView 和发布周期中完成渠道埋点
        - 集成摩擦、版本漂移、CSP / CORS 故障和客户特定边界案例可能拖慢价值兑现
      - - Continuous Behavioral Sequencing
        - 借助 ML 和认知行为模型解析、匹配、聚合并评分数千个信号
        - 大规模历史会话语料和持续模型训练
        - 公开材料没有详细解释漂移监控、可解释性或偏差控制
      - - Predictive Intelligence / 分析师层
        - 将模型输出转成风险分、仪表盘和行动指引
        - 各银行内部的欺诈运营人力、规则和编排钩子
        - 评分再强，缺少行动设计仍可能让损失留在原处，或制造复核负担
      - - 设备智能层（DeviceIQ）
        - 建立持久设备身份，并在登录前检查设备健康
        - 设备传感器可用性，以及可靠 Web / 移动端指纹
        - 伪造攻防、隐私约束和传感器可见性不完整，可能侵蚀精确率
      - - Link 图谱层
        - 映射用户、设备和支付，找出可疑集群和钱骡模式
        - 实体解析、欺诈标注和分析师采用
        - 案件治理差或标识符弱，会降低图谱价值或制造错误关联
      - - Trust 网络层
        - 在符合条件的付款放行前，在参与银行之间共享收款账户风险
        - 参与银行密度，以及假名化和数据共享治理
        - 只有足够多银行加入且本地规则允许该模式时，网络效应才最强
      - - 合作伙伴和编排集成
        - 将 BioCatch 洞察注入 Verafin、云或数字银行技术栈等更广泛的银行系统
        - 第三方产品路线图和 API 可靠性
        - 联合方案执行会增加 BioCatch 直接控制之外的依赖风险
    notes: 该架构根据官方产品页、发布、招聘信号和合作伙伴集成重建；内部实现细节仍属私有。
