        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司靠产品发布、地域扩张和赞助方支持的资本重组持续复合，而不是依赖某个单一跃迁事件。官方历程记录了早期在欧洲和拉丁美洲部署产品、2020 年 Bain 领投成长轮、Mazor 接任
              CEO、2023 年 centaur 里程碑、2024 年 Permira 收购，以及 2025–2026 年 Scams360、DeviceIQ 等发布。与此同时，概览层面的风险已经可见。BioCatch
              所在品类受益于欺诈压力上升，但监管者和隐私专家仍在警告：生物识别和行为数据系统可能带来同意、安全、偏见和功能蔓延问题。尽调上的实际含义是，公司收入规模主张有充分支撑，但委员会应把盈利质量、隐私治理控制和赞助方时代的股权结构
              / 控制权安排视为后续问题，而不是已经解决的问题。也就是说，投资逻辑今天可以依靠强劲商业动能，但在把公司概览视为完全闭环之前，承销仍需要管理层提供隐私控制、资本结构和财务质量的实证材料。
