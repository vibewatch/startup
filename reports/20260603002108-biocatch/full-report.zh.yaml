      - number: '2.2'
        title: 市场规模、测算视角，以及真正落到 BioCatch 身上的部分
        blocks:
          - type: paragraph
            body: >-
              公开市场测算报告在方向上大体一致，但没有给出单一权威数字。Mordor Intelligence 将 2026 年全球欺诈检测与预防市场放在 $70.19 billion，Fortune Business
              Insights 则放在 $67.12 billion；两者也都显示 BFSI 是最大支出垂直之一，甚至是最大垂直。更窄的行为生物识别品类中，Mordor 估计 2026 年市场规模为 $3.45
              billion，BFSI 占 2025 年收入的 44.1%。这为 BioCatch 提供了一个有用视角：如果银行支出中有一小块但高增长的部分转向行为驱动编排，公司并不需要拿下整个 FDP
              栈的显著份额，也能做成大生意。第二个测算视角是问题池而不是厂商收入：仅 APP 诈骗损失预计到 2026 年就在美国、英国和印度达到 $5.25
              billion。因此，正确分析姿态是交叉校验支出模型、威胁成本模型和 BioCatch 披露的装机基础，而不是围绕单一 TAM 强行制造伪精确。
