      - number: '5.3'
        title: 实施路径与运营依赖
        blocks:
          - type: paragraph
            body: >-
              实施更像嵌入式平台上线，而不是简单购买一条数据馈送。BioCatch 称其遥测层依赖轻量级 Web 和移动 SDK；公开的 Web Solutions Engineer
              岗位说明了部署为何可能在运营上很麻烦：集成必须扛住浏览器差异、WebViews、CORS 和 CSP 规则、cookies、重定向、CDN 故障、缓存、会话连续性和 npm
              驱动版本升级。这个招聘信号重要，因为它独立确认 SDK 埋点和特定渠道调试是核心运营依赖，而不是边缘情况。BioCatch 自己称 Align 是一站式方案，也意味着银行过去曾拼接多个欺诈
              SDK，现在必须拆解这种碎片化。一旦嵌入，平台看起来被设计为进入更广的银行工具体系，而不是替代每个相邻系统。Verafin 称 BioCatch 警报会注入 Verafin
              平台，使银行可以在一个工作流中结合行为和交易情报。St. Mary’s Bank 称 Account Takeover Protection 和 Link
              把流程从“给每个首次外部转账用户打电话”改为用行为证据和关联账户分析来决定行动优先级。BioCatch 自己的客户控制文章和 Trust
              材料指向一个重要现实：单有评分不够。银行仍需要编排规则、提示、转账冻结、收款人校验或升级检查，才能把风险洞察转化为更低损失。
