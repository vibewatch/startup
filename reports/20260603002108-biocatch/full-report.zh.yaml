companyProfile:
  summary: >-
    BioCatch 是一家 2011 年成立、总部位于以色列 Tel Aviv
    的行为生物识别与设备智能公司，向银行及其他金融机构销售欺诈和金融犯罪软件。官方材料和公开发布显示，公司正从账户接管与身份验证拓展到开户注册、诈骗、骡子账户识别、设备智能，以及 BioCatch Connect
    平台下的联盟式情报共享。作为私营公司，公开牵引力已经可观：BioCatch 称 2025 年结束后 ARR 超过 $185 million，客户群达到 340 家金融机构，Permira 于 2024 年以 $1.3 billion
    估值完成多数股权收购。因此，投资判断的核心问题已经不是产品市场匹配，而是仍需多少私下尽调来厘清利润率、留存、客户集中度、隐私控制和交易条款。
