      - number: '2.3'
        title: 银行内部的买方、用户、付款方与采用流程
        blocks:
          - type: paragraph
            body: >-
              BioCatch 这类软件的买方通常是委员会，而不是某个单一预算负责人。欺诈负责人最先感到痛点，因为诈骗、账户接管和骡子活动会直接打到损失线；但产品、支付、AML / 合规、数字渠道和 IT
              团队都会影响采购决定。实时支付让决策更委员会化，因为收款行、发起行和网络各自承担一部分检测责任。实践中，大型银行采用更早、更全面，因为它们支付量更大、监管审查更重、数据科学预算更高。区域银行和信用合作社往往通过合作伙伴、嵌入式平台和联盟数据源进入这一品类，而不是自己搭完整能力。BioCatch
              自己的合作伙伴公告和美国欺诈报告强化了这一判断：采用正在向下游市场扩展，但产品最适合插入机构更广的数据、支付和案件管理环境，而不是作为孤立点工具运行。
