      - number: '7.4'
        title: 执行、安全透明度与运营负担风险
        blocks:
          - type: paragraph
            body: >-
              BioCatch 的执行风险来自产品雄心、受监管买方预期和有限的公开运营透明度叠加。 公司一边服务头部金融机构，一边仍把自己描述为全球创业公司；这合理提示组织仍在搭建，而不是单纯收割成熟存量。
              招聘和产品材料暗示，专业欺诈、工程和客户成功人才需求仍在延续；产品战略本身又把负担推得更高：持续防护、交互式客户控制、平台集成和收款账户智能，都需要按银行设计工作流。
              如果公开信任面更深，这种负担还可管理。现实相反，审阅过的官方页面有隐私通知和产品主张，却没有公开状态页、具名事故历史记录，或公开 SOC 2 / ISO 资料包。
              这不能证明控制环境薄弱；但意味着买方和投资人必须靠私有尽调资料室获取核心安全证据。 实践中，风险会体现为企业销售周期拉长、实施支持更重；如果产品变化或新的 AI
              驱动攻击方法跑在人员配置、治理或客户赋能前面，容错空间会更窄。
