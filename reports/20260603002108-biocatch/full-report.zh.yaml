  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议逻辑从真实控制权交易和强 ARR 规模出发，但由于披露和控制缺口仍未关闭，结论是估值合理但不便宜。
    data:
      nodes:
        - id: n1
          label: 2024 年控制权交易
          detail: $1.3B 的 Permira 交易提供真实锚点
        - id: n2
          label: 2025 年 ARR 与规模
          detail: '> $185M ARR，且覆盖 >340 家金融机构'
        - id: n3
          label: Trust / Verafin 资产
          detail: 网络和分销能支撑一定溢价
        - id: n4
          label: 披露缺口
          detail: 利润率、现金、集中度和控制条款仍未公开
        - id: n5
          label: 公开可比公司视角
          detail: 相邻的反欺诈和支付上市公司，交易倍数大多低于 BioCatch 的隐含倍数
        - id: n6
          label: 基准投资测算区间
          detail: $1.1B-$1.6B，而不是自动上修估值
        - id: n7
          label: 决策
          detail: 观察 / 需尽调放行
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
        - from: n6
          to: n7
    approximationNotes: 该流程展示投资测算逻辑，不是机械评分卡，也不是投委会政策。
