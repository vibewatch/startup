    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 概率加权区间不够宽，无法支撑在上一笔已知控制权估值之上盲目溢价进入。
    data:
      items:
        - label: 企业价值（USD M）
          low: 800
          mid: 1300
          high: 2200
        - label: 相对 $1.3B 锚点的结果（x）
          low: 0.6
          mid: 1
          high: 1.7
        - label: $185M ARR 隐含倍数（x）
          low: 4.3
          mid: 7
          high: 11.9
        - label: 概率权重（%）
          low: 25
          mid: 50
          high: 25
    approximationNotes: 回报区间以 2024 年控制权估值作为可观察锚点；它不是完整资本结构瀑布模型。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: BioCatch 在市场需求和规模证明上得分高，但经济性可见度和治理透明度偏弱。
    data:
      items:
        - label: 市场需求
          value: 8
          detail: 银行业对欺诈和诈骗防控的需求仍有结构性强度。
        - label: 证明 / 规模
          value: 8
          detail: 公开 ARR 和客户数量披露显示，公司已有可观企业级规模。
        - label: 护城河 / 网络
          value: 7
          detail: Trust 和 Verafin 支撑了一定差异化分销和数据优势。
        - label: 经济性可见度
          value: 4
          detail: 经审计利润率和现金流质量未公开。
        - label: 治理透明度
          value: 3
          detail: 资方控制和少数股东权利细节未公开。
        - label: 估值纪律
          value: 5
          detail: 已知估值锚点上算合理，但很难再往上拉。
        - label: 证据质量
          value: 5
          detail: 收入规模证据不错，投资测算证据不完整。
    approximationNotes: KPI 评分是作者为投委会使用做的综合判断，并非来自公司或银行家评分卡。
    claimRefs:
      - CV037
      - CV042
      - CV046
      - CV047
