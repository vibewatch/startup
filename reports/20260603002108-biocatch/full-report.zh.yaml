            body: >-
              公开单位经济性案例最强的部分是交付给客户的价值，最弱的部分是 BioCatch 自身成本基底。客户证明点显示欺诈损失避免和分析师时间节省：报告案例包括 2025 年阻止超过 $4 billion 欺诈、2024
              年拦截 $3.7 billion 欺诈交易、部署 BioCatch 的 Alkami 客户避免 $54 million 损失、某信用合作社案例中账户接管损失减少 $211,000，以及 St. Mary’s
              Bank 减少外呼验证电话。这些结果支撑支付意愿和续约逻辑，但不能机械转化为 BioCatch 毛利率。成本结构很可能以软件为主——R&D、ML
              基础设施、实施、支持、欺诈专业知识和销售——但围绕生物识别法律和模型治理的合规工作会增加服务负担。关于员工超过 400 人、盈利能力改善和 2023 年 EBITDA
