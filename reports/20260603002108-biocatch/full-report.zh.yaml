      - number: '7.5'
        title: 资本、披露与投资逻辑破裂触发条件
        blocks:
          - type: paragraph
            body: >-
              BioCatch 看起来不像缺资本的公司，但有影响价格纪律的披露风险。BioCatch 和 Permira 称，2024 年控股收购给公司的估值为 $1.3 billion；公司自己的公告称，出售前 2023 年
              ARR 增长，达到 $100 million ARR 里程碑，并实现 EBITDA 盈利。 这些都是有用证据，但收购后的当前公开估值面主要来自 Forge、PM Insights、Tracxn
              等二级市场和私营公司数据库，而不是经审计的公开文件。 由此产生两个投资问题。第一，PE 资方控制提高了一种可能性：增长预期、二级价格和任何退出时间会受私有所有者议程塑形，而不是由清晰公开披露驱动。
              第二，缺少最新审计披露，投资人更难判断集中度、合规支出、伙伴经济性或实施负担是否在头部增长叙事之下侵蚀质量。 正确回应不是直接否定公司，而是定义清晰的投资逻辑破裂触发条件。
              如果集中度被证明很高，信任中心证据薄弱，隐私责任被转回供应商，或伙伴渠道掌握过多商业杠杆，那么即使欺诈防护需求仍强，估值叙事也会明显站不住。
