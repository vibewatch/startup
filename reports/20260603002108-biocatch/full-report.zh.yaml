      - number: '8.2'
        title: 估值背景与可比视角
        blocks:
          - type: paragraph
            body: >-
              最干净的视角是已知交易视角：Permira 在 2024 年同意通过一笔以老股为主的交易买入控制权，估值 $1.3 billion。 这是真实参考点，但不是干净的 2026 年少数股价格，因为 PE
              资方控制、二级流动性和私下谈判会产生新外部投资人拿不到的经济条款。 第二个视角是 ARR 桥。如果 BioCatch 的估值大致不变，而公开 ARR 从 2023 年略高于 $100 million 推进到
              2025 年底超过 $185 million，隐含倍数就从高增长溢价区间压缩到约 7x ARR 区间。 这比最初标题数字更容易消化。


              第三个视角是公开可比公司。Riskified、NICE、Adyen 和 Fiserv 的方向性公开销售倍数大约落在 1x 到 5x 销售额，尽管这些公司并非完美可比。 BioCatch
              可以主张溢价，因为它更聚焦银行欺诈和行为智能，也可能受益于 Trust、Verafin 等网络资产。 但公开证据没有证明溢价级别的利润率或留存，因此投资人不应从“好公司”直接跳到“开放式溢价倍数”。
              Forge、PM Insights 和 Tracxn 都能帮助框定市场仍如何看待 BioCatch，但每个来源都有显著透明度限制。 综合看，这些视角支持一个估值区间，而不是单一激进点估计。
