      - number: '3.4'
        title: 护城河耐久性、商品化风险与尽调要求
        blocks:
          - type: paragraph
            body: >-
              BioCatch 的护城河足够耐久，重要但并非无懈可击。历史行为基线、银行特定调优、诈骗类型知识和欺诈调查操作手册，会在部署后形成切换成本。不过，公开记录也显示可信替代方案很多，多家独立目录还明确把
              BioCatch 描述为众多厂商之一。功能趋同已经可见，因为多个竞争对手现在都在营销行为、自适应、设备或 AI
              驱动风险信号。最重要的反向尽调问题，不是行为生物识别是否有用，而是当套件、身份网络和银行内部平台都能吸收类似信号时，BioCatch 能否守住溢价经济性。下一轮尽调应索取赢 /
              输档案、按模块和量级拆分的实际定价、续约队列、实施成本基准、替换银行原有方案的案例，以及网络效应能把模型表现提升到买方无法靠多供应商编排复制的证明。另一个反向可能是组织层面：如果银行把欺诈决策集中到既有案件管理或数据科学平台之下，BioCatch
              可能仍有技术价值，却失去对预算归属、路线图优先级和续约叙事的影响。因此，护城河评估把工作流和分销控制权与信号质量放在同等权重。
