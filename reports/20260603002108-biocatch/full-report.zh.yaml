      - CV036
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观
        - ARR 增速保持在 20% 以上，合作伙伴和网络渠道带来高质量扩张，尽调证明毛利率和留存具备溢价质量。
        - $1.7B-$2.2B EV；相对已知 $1.3B 锚点约 1.3x-1.7x。
        - 经审计数据没有体现溢价经济性。
        - ~25%
      - - 基准
        - ARR 维持在当前公开规模附近，增长放缓，BioCatch 只保留相对相近公开可比公司的有限溢价。
        - $1.1B-$1.6B EV；相对已知锚点约 0.9x-1.2x。
        - 收入质量、毛利率和集中度仍不透明。
        - ~50%
      - - 悲观
        - 增长压缩到接近公开可比公司水平，监管或合作伙伴成本上升，融资意愿走弱。
        - $0.8B-$1.0B EV；相对已知锚点约 0.6x-0.8x。
        - 新交易估值下调，或尽调材料包令人失望。
        - ~25%
    notes: 这些是综合交易、ARR 和公开可比公司视角得出的情景区间；由于审计后的毛利和现金流数据未公开，不尝试 DCF。
    claimRefs:
      - CV030
      - CV031
      - CV032
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 适用性
      - 局限
    rows:
      - - BioCatch 2024 年 Permira 控制权交易
        - 企业估值 / 控制权交易
        - 控制权和老股流动性交易对应 $1.3B EV
        - 可观察到的 BioCatch 实际价格锚中最佳
        - 不是干净的 2026 年少数股新股入场点
      - - Forge / PM Insights / Tracxn 筛查
        - 私募市场参考点
        - 仍大致聚集在 $1.3B 区间附近
        - 可用来观察是否有公开可见的估值上调
        - 数据延迟、付费墙限制或推导而来，不是干净市场价格
      - - Riskified
        - 公开反欺诈平台 P/S 和收入
        - ~$0.71B 市值，~$0.33B TTM 收入，~2.26x P/S
        - 最接近的公开纯反欺诈情报视角
        - 商户电商欺诈重点不同于银行行为情报
      - - NICE
        - 公开反欺诈 / 合规软件 P/S 和收入
        - ~$5.67B 市值，~$2.94B TTM 收入，~1.46x P/S
        - 银行反欺诈和合规邻近参照
        - 大型多元化软件公司，不是聚焦的成长阶段供应商
      - - Adyen
        - 公开支付软件 P/S 和收入
        - ~$32.65B 市值，~$3.10B 2025 收入，~5.26x P/S
        - 高质量支付软件参照
        - 支付处理商经济性不同于反欺诈软件经济性
      - - Fiserv
        - 公开支付基础设施 P/S 和收入
        - ~$30.10B 市值，~$21.19B TTM 收入，~1.17x P/S
        - 银行和支付工作流参考点
        - 成熟多元化处理商，增长和毛利结构差异很大
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the transaction, current private-market screens, and the public fraud and payments software lenses
        actually used in this chapter, but no perfect public behavioral-biometrics bank-fraud comp exists.
    notes: 可比值是 2026 年 6 月公开市场或筛查参考，方向性使用。它们给 BioCatch 框定区间，而不是给出单一答案。
    claimRefs:
      - CV017
      - CV018
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV033
      - CV045
  - id: TV005
    title: 击穿投资逻辑与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 收入质量失效
        - 经审计桥接显示 ARR 存在重大非经常性、集中或低毛利问题
        - 溢价倍数逻辑坍塌
        - 立即按悲观情景可比公司折价重新承销判断。
      - - 合作伙伴经济性薄弱
        - 合作伙伴来源 ARR 增长，但毛利捕获或续约控制薄弱
        - 网络效应逻辑变成渠道依赖
        - 降低溢价，并收紧下行假设。
      - - 新标记低于 Permira
        - 任何融资或老股交易以低于 2024 年控制权标记成交
        - 当前估值支撑已被事实击穿
        - 在证伪前，把更低价格视为新上限。
      - - 披露失败
        - 管理层无法提供经审计的 FY2025 盈利质量材料包
        - 证据质量仍不足以支持溢价入场
        - 不要拉到已知交易标记以上。
      - - 集中度意外
        - 大客户敞口或薄弱 NRR 显示收入不如表面暗示的耐久
        - 规模逻辑显著削弱
        - 除非价格重置，否则从观察转为回避。
    notes: 触发因素刻意设置为可观察，并与估值传导绑定，而不是泛泛的定性担忧。
    claimRefs:
      - CV039
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调事项表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入桥接
        - ARR 定义、确认收入、递延收入和非经常性调整
        - 判断 BioCatch 是否配得上软件质量倍数
        - CFO / 审计师——提供 FY2025 经审计桥接和说明。
      - - 毛利率和现金流
        - 毛利率、EBITDA 调整、资本化支出和自由现金流
        - 区分高质量增长和昂贵增长
        - 财务团队——提供经审计报表和董事会利润率材料。
      - - 流动性和烧钱速度
        - Permira 交割后的现金、债务、契约和月度烧钱速度
        - 用于判断下行融资风险和选择权
        - 财务团队——提供最新资产负债表和现金桥接。
      - - 股权结构表和控制权
        - 清算优先权、董事席位、少数股东保护和保留事项
        - 少数股东权利偏弱时，表面公允的估值仍可能不划算
        - 法务——提供股东协议、股权结构表和期权计划。
      - - 客户韧性
        - Top-10 集中度、NRR、logo 流失、队列扩张和续约历史
        - 估值看客户韧性，不只看客户总数
        - 收入运营——提供队列表和续约历史。
      - - 合作伙伴经济性
        - 合作伙伴来源 ARR 占比、毛利率、收入分成和续约归属
        - 检验 Verafin 或 Trust 是创造溢价经济性，还是只加重渠道依赖
        - 商业负责人——提供合作伙伴 P&L 和渠道队列。
    notes: 第 1 至第 4 项是支付溢价前的阻断性尽调要求；第 5 和第 6 项决定 BioCatch 是否配得上相对上市可比公司的任何溢价。
    claimRefs:
      - CV035
      - CV046
