  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              尽调时，不能把 BioCatch 按整个欺诈预防宇宙估值，仿佛其中每一美元支出都能触达。公司处在更广的欺诈检测与预防栈内，该栈包括交易监控、身份验证、AML / 欺诈案件管理、支付网络评分和身份核验；但
              BioCatch
              最相关的细分位置，是用于实时识别异常数字行为的行为生物识别与设备智能层。这个更窄定义很重要，因为银行内部预算讨论不是“要不要打击欺诈”，而是哪类控制拿到增量支出。现状替代方案仍吸收可观预算：规则引擎、人工审核团队、设备指纹、升级
              MFA 和联盟评分。实际含义是，BioCatch 受益于巨大市场伞面，但取胜和定价取决于证明行为分析能减少误报、改善诈骗检测，并与邻近控制协同，而不是替代整套栈。
