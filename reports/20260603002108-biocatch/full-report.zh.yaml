      - number: '5.2'
        title: 核心模型、信号与设备智能
        blocks:
          - type: paragraph
            body: >-
              BioCatch 的核心技术主张是，欺诈可从一个人如何使用银行渠道的顺序和上下文中被识别，而不只在静态身份或交易字段里。Continuous Behavioral Sequencing 是核心。BioCatch
              描述称，多台机器学习引擎并行运行，覆盖数千个信号，持续解析时序、导航、复制粘贴活动、远程访问指示、会话空闲时间、通话状态、应用上下文、设备姿态、网络线索和交易活动。公司称，这些输入会在用户、欺诈和总体人群层面评分，并与数十亿历史会话和数百种欺诈手法比较；这也是它把行为智能定位为主要模型输入，而不是二级丰富层的原因。DeviceIQ
              将模型从行为向外扩展到设备信任。当前产品页、发布稿和 Biometric Update 文章都描述了跨 Web
              和移动端的持久设备身份、合法升级识别、登录前检测越狱设备、缺失传感器、未授权代码，以及复用既往骡子、诈骗和账户接管历史的网络效应。BioCatch 还声称 DeviceIQai
              可以区分人类主导、混合人类-智能体、真正的智能体 AI
