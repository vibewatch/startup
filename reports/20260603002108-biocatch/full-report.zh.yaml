        title: 定价、GTM 与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              定价是企业定制，而不是公开价目表。可支撑的机制是与受保护用户、会话、交易、设备和模块挂钩的年度经常性订阅经济性，但公开来源没有披露最低承诺、层级断点、折扣、实施费或实际模块附加率。GTM
              看起来是混合型：面向大型银行的直接企业销售，加上通过 Alkami 等平台和其他集成触达中端市场的合作伙伴渠道。销售效率代理指标方向上有利，因为合作伙伴 ARR 在 Q2 2025 超过 $10
              million，同比增长 71%，据报道中端市场合作伙伴业务在 2025 年 ARR 增长 60%，并引入超过 70 家 Alkami
              机构。这些只是代理指标；CAC、回本周期、销售配额产能、销售周期长度、续约队列和渠道利润分成仍未公开，承销经营杠杆前应索取。
