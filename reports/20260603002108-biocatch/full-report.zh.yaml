      - number: '5.4'
        title: 隐私、合规与治理约束
        blocks:
          - type: paragraph
            body: >-
              隐私和合规与产品紧密绑定，因为 BioCatch 持续收集会话、设备和交互数据。BioCatch 隐私通知称，服务会收集使用和设备数据、登录活动、点击和会话交互，支持 GDPR 和 CCPA
              式访问与删除权，按照目的和法律义务设定留存标准，并可能为研究和服务改进创建聚合或假名化数据集。DeviceIQ 另称不收集姓名、地址或社会安全号码，且用户和账户数据已经假名化。Trust
              对跨银行收款账户情报使用同样的假名化框架。合在一起，公开信息是：BioCatch 想扩大遥测覆盖，同时尽量减少产品平面上的直接身份识别数据。这个设计选择有帮助，但不能消除合规风险。FTC
              警告，行为或其他生物识别系统可能带来隐私、安全、偏见和欺骗性主张风险，并期望持续监控技术和第三方实践。BCLP tracker
              显示，州层面生物识别立法正在快速走向书面政策、留存计划和明确同意要求。这些框架重要，因为 BioCatch
              的低摩擦连续监控承诺可能与本地披露、留存和供应商管理规则冲突。值得注意的是，留存公开来源里能看到隐私通知，但没有看到具名信任中心资料包、SOC 2 报告、ISO 27001
              证书，或当前模型的公开公平性与可解释性文档。
