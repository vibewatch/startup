  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              BioCatch 最适合被理解为一家聚焦银行的私营 B2B SaaS 公司，收入质量由经常性合同、大型金融机构客户和不断增加的附加模块锚定。公开记录对 ARR 异常丰富，但会计报表很薄：BioCatch 披露
              Q2 2025 ARR 超过 $160 million，并在创纪录的 Q4 2025 之后超过 $185 million；Sacra 则独立把其模式概括为按会话、用户或交易量变现。故事中质量更高的部分不只是头部
              ARR，而是 2025 年 90 个新客户、美国四大银行中三家、2025 年中超过 280 家金融机构，以及诈骗和骡子检测中的产品组合扩张。不过，ARR
              不是经审计收入，不披露合同期限，也无法单独证明总留存率、实际定价或利润率。因此，本章把每个披露数字都视为公开下限信号，而不是完整财务报表。关键尽调标准是把公开
              ARR、客户价值和产品采用，与决定估值的私有运营指标分开看，包括毛利率、CAC 回本周期、支持成本、法律准备金和现金转换。
