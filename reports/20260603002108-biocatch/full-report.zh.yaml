  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流 / 痛点
      - BioCatch 方案
      - 可量化收益
      - 局限
    rows:
      - - 线上开立新账户
        - KYC 表单流加静态设备或身份检查，可能漏掉机器人、合成身份和钱骡招募
        - Account Opening Protection
        - 公司称可在犯罪分子建立下游欺诈据点前实时拦截
        - 公开基准精确率和分析师复核负担未披露
      - - 验证老客户身份
        - 只靠登录 MFA 或交易规则会增加摩擦，也会漏掉登录后的行为
        - 持续防护 / Account Takeover Protection
        - 在整个会话中持续验证，而不是只在登录时验证
        - 证据最强来自公司和客户案例，而不是独立测试
      - - 审核可疑付款
        - 只看交易的系统往往看到的是有效凭证和熟悉设备
        - Scams360 / 社会工程检测
        - 公司声称可实时检测多数 APP 诈骗，非冒充类诈骗检测效果提升 50%
        - 结果由公司主张，仍取决于银行的编排选择
      - - 调查关联欺诈案件
        - 分析师手动跨案件连接账户、设备和交易
        - Link + Mule Account Detection
        - St. Mary’s 称 Link 可自动浮现关联移动 ID，减少手动验证工作
        - 误关联率和案件可解释性细节未公开
      - - 资金离开前评估收款账户
        - 在快速支付流程中，付款银行缺少收款方情报
        - Trust Australia
        - 官方和合作伙伴来源称，该网络 10 个月内评估 $500B，如今覆盖超过 85% 的网银用户群
        - 价值取决于成员参与度、数据共享规则和地域
      - - 登录前判断是否信任设备
        - 用户升级设备或欺诈者伪造设备时，传统设备 ID 很脆弱
        - DeviceIQ / DeviceIQai
        - 持久识别、登录前传感器和代码检查；某个早期部署中，真实升级识别率接近 60%
        - 新产品，独立验证有限，边界案例公开文档也有限
    notes: 收益混合了公司主张的指标以及客户或合作伙伴佐证；局限标出仍需管理层资料室证据的事项。
