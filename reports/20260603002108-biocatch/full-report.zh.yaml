      - number: '5.5'
        title: 技术结论、优势与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              从尽调角度看，产品故事最强的部分是架构连贯性。BioCatch 现在有一套可信的平台叙事：一个遥测层、一个序列引擎、通过 Link 和 Trust
              做图谱与网络扩展，以及从开户到快速支付诈骗预防、匹配真实银行工作流的模块化用例。广度并非纯营销。官方产品页、2025 和 2026 年发布、合作伙伴集成公告、客户证明、公开 GitHub
              活动和当前集成岗位，都指向一个仍在出货、并向设备智能和联盟式网络工作流扩张的产品组织。主要保留项是，广度和新颖性不等于已经完成承销的技术护城河。许多最重要的性能数字仍由公司主张：毫秒级响应时间、两周内识别近
              60% 真实设备升级、诈骗或账户检测率大幅提升，以及实时识别大多数 APP
              欺诈的能力。公开材料也强调系统能看到什么，但对模型如何监控漂移、银行运营团队如何理解误报，或大型受监管买方会收到什么正式证明包，说得少得多。因此，本章结论是：工作流覆盖和产品架构为正，但验证仍需谨慎。BioCatch
              看起来是成熟的银行行为智能平台，但承销仍应索取模型治理文件、安全认证和实时实施指标，才能把产品视为充分去风险。
