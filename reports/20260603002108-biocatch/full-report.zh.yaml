  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、监管与责任暴露
        blocks:
          - type: paragraph
            body: >-
              BioCatch 最强的品类风险不是今天披露的诉讼，而是把遥测密集型行为和设备智能卖给受监管银行所产生的合规负担。公司隐私通知称，BioCatch
              收集设备、连接、系统日志和记录活动数据，并可为服务改进和合作伙伴使用衍生聚合或假名化数据集。方向上，这与产品价值主张一致，但也意味着采购和法务审查会聚焦合法依据、留存、数据最小化、跨境传输，以及与银行客户如何分担责任。外部规则手册正在收紧，而不是稳定下来。California
              更激进地对待敏感数据，FTC 已警告生物识别技术带来隐私、偏见和安全担忧，ICO 的生物识别识别指南在 2025 年法律变化后已进入复审，EU AI Act 则围绕生物识别 AI
              系统增加了另一层文件和用例审查。BioCatch 拥有假名化主张和明确隐私权利语言等可信缓释，但公开证据没有解决承销真正关心的实践性尽调问题：DPA
              条款、赔偿、按司法辖区划分的合法依据、买方审计权、索赔历史，以及合同语言能否吸收新的生物识别和 AI 要求，而不拖慢销售周期或扩大损失分担暴露。
