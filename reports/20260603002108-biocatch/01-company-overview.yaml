  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership-structure
    missingEvidence: Exact post-close ownership percentages, board voting arrangements, protective provisions, and any ratchets or secondary-only economics from the Permira-led recapitalization.
    whyItMatters: Control mechanics determine exit optionality, board leverage, and whether sponsor incentives align with minority investors and management.
    diligencePath: Request the cap table, shareholder agreement summary, board observer/consent-right schedule, and transaction-side letter from management or counsel.
    relatedQuestionRefs:
    - QO019
    - QO023
    - QO025
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A single canonical employee count and org distribution by geography after the 2025 hiring wave and integrations.
    whyItMatters: Headcount is a core maturity signal for operating leverage and burn; public sources currently range from 391 to 461 while official releases only say more than 400.
    diligencePath: Request the latest payroll or HRIS export, broken out by country and function, and reconcile it against the January 2026 press release.
    relatedQuestionRefs:
    - QO024
  - type: missing-source
    severity: material
    topic: audited-financial-quality
    missingEvidence: Audited or management-certified GAAP revenue, gross margin, burn, EBITDA bridge, and cash runway data for 2024-2026.
    whyItMatters: ARR growth alone cannot answer unit-economics quality, services mix, or near-term financing risk.
    diligencePath: Request audited financial statements, board deck KPI packs, and monthly management accounts for the trailing twelve months.
    relatedQuestionRefs:
    - QO025
  - type: access-blocked
    severity: minor
    topic: capital-history
    missingEvidence: Open-access confirmation of the full funding-round history and exact total raised from a source not subject to profile walls or anti-bot friction.
    whyItMatters: Third-party databases provide directional capital history, but blockers and partial access make the canonical total-raised figure less robust than the valuation anchor.
    diligencePath: Cross-check Crunchbase or direct management financing history and obtain the last financing memo or board financing schedule.
    relatedQuestionRefs:
    - QO023
