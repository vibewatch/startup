company:
  name: BioCatch
chapter:
  number: 1
  title: Company Overview
  summary: 'BioCatch is a Tel Aviv-founded behavioral biometrics company that crossed a governance and scale inflection after Permira took majority control at a $1.3 billion valuation in 2024. Public disclosures show ARR moved from above $100 million in 2023 to above $185 million entering 2026, while deployments expanded from roughly 190 financial institutions in mid-2024 to 340 by early 2026. The chapter also highlights the company’s main overview-level caveat: public sources are rich on ARR, customer counts, and milestones, but thin on audited revenue, exact post-close ownership percentages, and a single canonical 2026 headcount.'
sections:
- id: identity-footprint-product
  title: Identity, footprint, and product boundary
  body: BioCatch was founded in 2011 to address digital identity and online fraud by analyzing how legitimate users and fraudsters interact with devices and banking interfaces. Official company materials describe the business as a behavioral biometrics and device-intelligence platform for fraud prevention, account opening, account takeover, mule detection, scams, and strong customer authentication. The public company journey ties the origin story to founder Avi Turgeman’s military-intelligence background and the insight that human-machine interactions are measurable and distinctive. Public pages consistently anchor headquarters in Tel Aviv, while company and directory sources show an international footprint that includes New York and London alongside additional regional locations. Across official and partner disclosures, the company’s operating model is to sell software and intelligence into financial institutions rather than consumer endpoints, making BioCatch’s scale story inseparable
    from the breadth of its bank deployments and the volume of monthly sessions it analyzes.
  claimRefs:
