- id: milestones-risks-open-items
  title: Milestone record, strategic expansion, and overview-level caveats
  body: The milestone record shows a company that compounded through product launches, geographic expansion, and sponsor-backed recapitalization rather than one single step-change event. The official journey records early product deployment in Europe and Latin America, the 2020 Bain-led growth round, Mazor’s CEO transition, the 2023 centaur milestone, the 2024 Permira buyout, and 2025–2026 launches such as Scams360 and DeviceIQ. At the same time, overview-level risks are already visible. BioCatch’s category benefits from rising fraud pressure, but regulators and privacy specialists continue warning that biometric and behavioral-data systems can create consent, security, bias, and function-creep concerns. For diligence purposes, the practical implication is that the company’s top-line scale claims are well supported, but the committee should treat exact profitability quality, privacy-governance controls, and the sponsor-era cap-table/control package as follow-up items rather than solved questions.
    That means the investment case can lean on strong commercial momentum today, but underwriting still needs management-room evidence on privacy controls, capital structure, and financial quality before treating the overview as fully closed.
