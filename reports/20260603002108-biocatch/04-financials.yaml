- id: capital-adequacy-and-financial-gaps
  title: Capital adequacy, disclosure gaps, and verdict
  body: 'Capital adequacy is directionally acceptable but not underwritable from public evidence alone. Permira completed a majority investment at a $1.3 billion valuation in 2024 and described the transaction as supporting global expansion and roadmap execution. Combined with ARR growth and BioCatch’s claim of an improving profitability profile, this reduces near-term financing-risk concern. However, the Companies House evidence is limited to BioCatch (EMEA) Limited small-company filing history, not consolidated group financials. The material gaps remain audited revenue, revenue recognition, gross margin, hosting and support cost, burn, cash balance, debt, ownership economics, and realized pricing by customer cohort. The verdict is therefore constructive but diligence-gated: revenue quality appears high for a private fraud SaaS company, yet margin path and capital intensity cannot be scored without management-provided financial statements, cohort files, and contracts. Management interviews
    should specifically reconcile ARR quality with cash conversion, renewal concentration, partner economics, and privacy-compliance spending.'
  claimRefs:
