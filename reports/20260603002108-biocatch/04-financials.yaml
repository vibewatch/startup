- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR run-rate
    - '>$185M at year-end 2025'
    - Medium-high
    - Scale supports enterprise SaaS relevance
    - Reconcile ARR to GAAP/IFRS revenue
  - - YoY ARR growth
    - 43% in H1 2024; >$160M to >$185M during 2025
    - Medium
    - Growth rate underpins valuation and sales efficiency
    - Request quarterly ARR bridge
  - - Net dollar retention
    - 130% LTM disclosed for H1 2024
    - Medium
    - Expansion/retention proxy
    - Request 2025 and 2026 NRR cohorts
  - - Gross margin
    - 'null'
    - Low
    - Needed for SaaS contribution margin
    - Request audited gross margin by product
  - - CAC payback
    - 'null'
    - Low
    - Needed for sales-efficiency underwriting
    - Request CAC, sales-cycle, quota productivity
  - - Customer ROI
    - 'Fraud prevented examples: >$4B 2025, $54M Alkami customer group, $211K CU case'
    - Medium
    - Supports willingness to pay
    - Request customer-level realized ROI files
  - - Support / implementation intensity
    - 'null'
    - Low
    - Can erode gross margin and NRR
    - Request implementation hours and support tickets by cohort
  - - Compliance cost risk
    - Biometric privacy laws and FTC scrutiny create governance burden
    - Medium
    - May raise legal, security, and indemnity costs
    - Request DPA/indemnity terms and privacy audits
  notes: Null values are unavailable private metrics, not zero; fraud-prevention values are customer value proxies rather than BioCatch revenue.
