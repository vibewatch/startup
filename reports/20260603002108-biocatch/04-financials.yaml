- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Public evidence status
  - Impact
  - Exact diligence path
  rows:
  - - Audited consolidated revenue
    - Not public; only ARR press disclosures and UK entity filing history found
    - Blocks revenue recognition and ARR-to-revenue bridge
    - Obtain audited consolidated financial statements
  - - Gross margin and hosting cost
    - Not public
    - Blocks contribution-margin model
    - Obtain product-level COGS and hosting/support allocation
  - - Burn, cash, and runway
    - Not public
    - Blocks capital adequacy model
    - Obtain latest balance sheet and monthly cash forecast
  - - Realized pricing / discounting
    - Not public
    - Blocks pricing power assessment
    - Review anonymized contracts and renewal price changes
  - - NRR / churn after H1 2024
    - 2024 NDR disclosed; newer cohorts not public
    - Blocks retention durability assessment
    - Request 2023-2026 cohort retention by segment
  - - Customer concentration
    - Large-bank penetration disclosed; concentration not public
    - Blocks revenue-risk analysis
    - Request top-20 customer revenue concentration
  - - Partner economics
    - Partner ARR public; take-rates and obligations private
    - Blocks channel margin assessment
    - Review partner agreements and support SLAs
  - - Legal/compliance cost exposure
    - Sector risks public; BioCatch-specific cost not public
    - Blocks margin-risk assessment
    - Review privacy audits, reserves, indemnities, and claims history
  notes: This table intentionally preserves unavailable private financial inputs rather than estimating them from press releases.
