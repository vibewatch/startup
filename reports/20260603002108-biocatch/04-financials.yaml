chapter:
  number: 4
  title: Financials
  summary: BioCatch discloses unusually strong private-company ARR signals, including more than $185 million of ARR at year-end 2025, rapid partner-channel growth, and expanding scam/mule modules. The financial verdict is constructive but diligence-gated because audited consolidated revenue, realized pricing, margins, cash, burn, debt, ownership economics, and runway are not public.
sections:
- id: revenue-model-and-public-traction
  title: Revenue model and public traction
  body: 'BioCatch is best understood as a private, bank-focused B2B SaaS company whose revenue quality is anchored in recurring contracts, large financial-institution customers, and growing add-on modules. The public record is unusually rich for ARR but thin for accounting statements: BioCatch disclosed more than $160 million of ARR at Q2 2025 and more than $185 million after a record Q4 2025, while Sacra independently frames the model as session, user, or transaction-volume monetization. The higher-quality part of the story is not only the headline ARR. It is the combination of 90 new customers in 2025, three of the four largest U.S. banks, more than 280 financial institutions by mid-2025, and product-mix expansion in scams and mule detection. That said, ARR is not audited revenue, does not reveal contract duration, and cannot by itself prove gross retention, realized pricing, or margin. This chapter therefore treats every disclosed number as a lower-bound public signal rather than a complete
    financial statement. The key diligence standard is to keep public ARR, customer value, and product adoption separate from the private operating metrics that decide valuation, including gross margin, CAC payback, support cost, legal reserves, and cash conversion.'
  claimRefs:
  - CI001
  - CI002
  - CI004
  - CI005
  - CI006
  - CI010
  - CI011
  - CI012
  - CI015
  - CI016
  - CI041
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-gtm-and-sales-efficiency-proxies
  title: Pricing, GTM, and sales-efficiency proxies
  body: 'Pricing is enterprise-custom rather than public list pricing. The supportable mechanism is annual recurring subscription economics tied to protected users, sessions, transactions, devices, and modules, but public sources do not disclose minimum commitments, tier breakpoints, discounts, implementation fees, or realized module attach rates. GTM looks mixed: direct enterprise selling into large banks, plus partner-led mid-market reach through platforms such as Alkami and other integrations. Sales-efficiency proxies are directionally favorable because partner ARR exceeded $10 million in Q2 2025, grew 71% year over year, and the mid-market partner business reportedly grew ARR 60% in 2025 while onboarding more than 70 Alkami institutions. These are proxies only; CAC, payback, quota productivity, sales-cycle length, renewal cohorts, and channel margin splits remain private and should be requested before underwriting operating leverage.'
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  tableRefs:
  - TI002
  figureRefs: []
- id: unit-economics-cost-structure-and-roi
  title: Unit economics, cost structure, and ROI evidence
  body: 'The public unit-economics case is strongest on customer value delivered and weakest on BioCatch’s own cost base. Customer proof points show fraud-loss avoidance and analyst-time savings: reported examples include more than $4 billion of prevented fraud in 2025, $3.7 billion of stopped fraudulent transactions in 2024, $54 million prevented by Alkami customers deploying BioCatch, a $211,000 account-takeover-loss reduction in one credit-union case study, and fewer outbound verification calls at St. Mary’s Bank. These outcomes support willingness to pay and renewal logic, but they do not translate mechanically into BioCatch gross margin. Cost structure is likely software-heavy—R&D, ML infrastructure, implementation, support, fraud expertise, and sales—yet compliance work around biometric laws and model governance can add service burden. Public disclosures about more than 400 employees, expanding profitability profile, and 2023 EBITDA profitability are encouraging but insufficient to
    model contribution margin.'
  claimRefs:
