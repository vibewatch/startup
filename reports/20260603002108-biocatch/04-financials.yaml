- id: TI002
  title: Pricing / monetization table
  columns:
  - Price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source-backed implication
  - Diligence ask
  rows:
  - - Annual recurring subscription
    - No public list price
    - Realized pricing private
    - ARR disclosures indicate recurring enterprise contracts
    - Request ARR bridge by customer and module
  - - Protected users / transactions / sessions
    - Unit construct reported by Sacra
    - Tier breakpoints unknown
    - Usage-linked pricing likely aligns with bank scale
    - Request price curves and minimum commitments
  - - Module add-ons for scams, mules, device intelligence
    - Module list price unavailable
    - Attach rates private
    - Scam/mule ARR rising from 5% to 15% supports expansion motion
    - Request module attach and expansion ARR
  - - Partner-channel deals
    - Partner ARR disclosed, but take-rate unknown
    - Channel margin split unknown
    - Partner channel can scale mid-market customer additions
    - Request Alkami/Tyfone/Verafin revenue-share terms
  - - Professional services / implementation
    - No public fee schedule
    - Service burden unknown
    - Deployment and tuning likely required for bank controls
    - Request implementation hours and services margin
  notes: All pricing cells are public-source directional proxies; exact list and realized pricing are unavailable.
