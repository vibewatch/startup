- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Core behavioral fraud detection
    - Recurring software sold to banks
    - Protected users / sessions / transactions
    - ARR base exceeded $185M at year-end 2025
    - High recurring-quality signal
    - Contract terms, gross retention, NRR by cohort
  - - Account takeover / onboarding protection
    - Behavioral and device risk scoring in digital channels
    - User sessions and risk decisions
    - Used by large banks and financial institutions
    - High if embedded in workflows
    - Module ARR, attach rate, renewal cohorts
  - - Scams360 scam prevention
    - Add-on scam detection for APP and social-engineering typologies
    - Transactions / protected accounts / module
    - Launched as single scam-fighting platform; majority scam detection claimed
    - Promising add-on stream
    - Pipeline, attach rate, realized price uplift
  - - Mule account detection
    - Behavioral/network indicators of mule activity
    - Accounts monitored / module
    - Voice scams and mule solutions were 15% of ARR in Q2 2025
    - Good mix expansion
    - Standalone module pricing and false-positive cost
  - - BioCatch Trust network intelligence
    - Inter-bank risk sharing and receiving-side transaction risk
    - Payments evaluated / member banks
    - Australia evaluated $320B of payments in first 10 months
    - Potential network-effect stream
    - Commercial model, bank data rights, liability allocation
  - - Partner/platform distribution
    - Embedded or referred through digital-banking and risk partners
    - Partner ARR / institutions onboarded
    - Partner ARR >$10M in Q2 2025; Alkami added 70+ institutions in 2025
    - Efficient mid-market reach
    - Revenue share, support obligations, channel gross margin
  notes: Public evidence supports revenue mechanisms and ARR proxies, not audited revenue recognition or realized contract economics.
