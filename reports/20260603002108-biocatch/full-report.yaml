  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue-quality failure
        - Audited bridge shows ARR is materially non-recurring, concentrated, or low-margin
        - Premium multiple logic collapses
        - Re-underwrite toward bear-case comp discounts immediately.
      - - Partner-economics weakness
        - Partner-sourced ARR grows but margin capture or renewal control is weak
        - Network-effect thesis turns into channel dependence
        - Reduce premium and tighten downside assumptions.
      - - New mark below Permira
        - Any financing or secondary clears below the 2024 control mark
        - Current valuation support is empirically broken
        - Treat the lower price as the new ceiling until proven otherwise.
      - - Disclosure failure
        - Management cannot provide audited FY2025 quality-of-earnings pack
        - Evidence quality remains too weak for premium entry
        - Do not stretch above the known transaction mark.
      - - Concentration surprise
        - Top-customer exposure or weak NRR shows the topline is less durable than implied
        - Scale thesis weakens materially
        - Move from track to avoid unless price resets.
    notes: Triggers are intentionally observable and tied to valuation transmission, not generic qualitative worries.
    claimRefs:
      - CV039
      - CV040
      - CV041
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited revenue bridge
        - ARR definition, recognized revenue, deferred revenue, and non-recurring adjustments
        - Determines whether BioCatch deserves software-quality multiples
        - CFO / auditors — provide FY2025 audited bridge and commentary.
      - - Gross margin and cash flow
        - Gross margin, EBITDA adjustments, capitalized spend, and free cash flow
        - Separates quality growth from expensive growth
        - Finance team — provide audited statements and board margin deck.
      - - Liquidity and burn
        - Cash, debt, covenants, and monthly burn after the Permira closing
        - Needed to judge downside financing risk and optionality
        - Finance team — provide current balance sheet and cash bridge.
      - - Cap table and control rights
        - Liquidation preferences, board seats, minority protections, and reserved matters
        - A fair headline valuation can still be unattractive under weak minority rights
        - Legal — provide shareholders agreement, cap table, and option plan.
      - - Customer durability
        - Top-10 concentration, NRR, logo churn, cohort expansion, and renewal history
        - Valuation depends on durability, not just gross logo count
        - Revenue operations — provide cohort tables and renewal history.
      - - Partner economics
        - Partner-sourced ARR mix, gross margin, revenue share, and renewal ownership
        - Tests whether Verafin or Trust create premium economics or simply more channel dependence
        - Commercial leadership — provide partner P&L and channel cohorts.
    notes: >-
      Items 1 through 4 are blocking diligence asks before paying up; items 5 and 6 determine whether any premium to
      public comps is deserved.
    claimRefs:
      - CV035
      - CV046
