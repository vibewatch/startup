  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / component
      - Role
      - Key dependency
      - Risk
    rows:
      - - Align / telemetry SDK
        - Collects behavior, device, network, application, and transaction telemetry across web and mobile
        - Bank channel instrumentation across browsers, apps, WebViews, and release cycles
        - Integration friction, version drift, CSP/CORS failures, and customer-specific edge cases can delay value
      - - Continuous Behavioral Sequencing
        - Parses, matches, coalesces, and scores thousands of signals using ML and cognitive-behavioral models
        - Large historical session corpus and ongoing model training
        - Public materials do not explain drift monitoring, explainability, or bias controls in detail
      - - Predictive Intelligence / analyst layer
        - Turns model outputs into risk scores, dashboards, and action guidance
        - Fraud-ops staffing, rules, and orchestration hooks inside each bank
        - Strong scoring without action design can still leave losses in place or create review burden
      - - Device intelligence layer (DeviceIQ)
        - Builds persistent device identity and checks device health before login
        - Availability of device sensors and reliable web/mobile fingerprints
        - Spoofing arms race, privacy constraints, and incomplete sensor visibility can erode precision
      - - Link graph layer
        - Maps users, devices, and payments to uncover suspicious clusters and mule patterns
        - Entity resolution, fraud tagging, and analyst adoption
        - Poor case hygiene or weak identifiers can reduce graph value or create false associations
      - - Trust network layer
        - Shares receiving-account risk across participating banks before eligible payments are released
        - Participating-bank density plus pseudonymization and data-sharing governance
        - Network effects are strongest only where enough banks join and local rules permit the model
      - - Partner and orchestration integrations
        - Injects BioCatch insights into wider bank systems such as Verafin and cloud or digital-banking stacks
        - Third-party product roadmaps and API reliability
        - Joint-solution execution can add dependency risk outside BioCatch’s direct control
    notes: >-
      The architecture is reconstructed from official product pages, launches, hiring signals, and partner integrations;
      internal implementation specifics remain private.
