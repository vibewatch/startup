        title: Capital inflection, traction, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Public disclosures support a sharp scaling arc from 2023 through early 2026. BioCatch and Permira both say
              the company crossed $100 million ARR and EBITDA profitability in 2023; mid-2024 disclosures then showed
              43% ARR growth, 130% net dollar retention, more than 200 financial institutions, and more than 11 billion
              monthly sessions. By mid-2025 the company said ARR had exceeded $160 million and deployments had expanded
              past 280 financial institutions, while the September 2025 Nasdaq Verafin alliance signaled that BioCatch’s
              distribution model increasingly blended direct sales with network and platform partnerships. The January
              2026 release is the clearest current anchor: above $185 million ARR, 340 financial institutions, 17
              billion monthly sessions, 660 million protected banking customers, and headcount above 400. Those
              disclosures create a strong growth narrative, but they do not fully close key diligence questions on
              audited revenue quality, post-close ownership percentages, or a single canonical headcount because
              third-party directories still drift around those numbers.
