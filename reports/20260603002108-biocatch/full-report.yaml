      - number: '7.5'
        title: Capital, disclosure, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              BioCatch does not screen like a capital-starved company, but it does carry disclosure risk that matters
              for price discipline. BioCatch and Permira say the 2024 majority acquisition valued the company at $1.3
              billion, and the company’s own announcement cited 2023 ARR growth, a $100 million ARR milestone, and
              EBITDA profitability before the sale. Those are useful proof points, yet the current public valuation
              surface after the buyout comes mostly from secondary-market and private-company databases such as Forge,
              PM Insights, and Tracxn rather than audited public filings. That creates two investment problems. First,
              sponsor control raises the possibility that growth expectations, secondary pricing, and timing of any exit
              will be shaped by a private-owner agenda rather than clean public disclosure. Second, the lack of current
              audited disclosure makes it harder to know whether concentration, compliance spend, partner economics, or
              implementation burden are eroding quality underneath the headline growth story. The right response is not
              to reject the company outright; it is to define explicit thesis-break triggers. If concentration proves
              high, trust-center evidence is weak, privacy liabilities are being shifted back to the vendor, or partner
              channels own too much commercial leverage, the valuation narrative becomes materially less defensible even
              if fraud demand remains strong.
