      - number: '2.4'
        title: Growth drivers, constraints, and regulatory pressure
        blocks:
          - type: paragraph
            body: >-
              The strongest growth drivers in this market are structural: digitization of payments, open-banking and
              instant-payment rails, the shift from card-centric fraud to APP and scam typologies, and the
              industrialization of AI-enabled social engineering. Mordor, ACI, Mastercard, and INTERPOL-linked reporting
              all point to the same broad pattern: attacks are faster, more personalized, and more cross-channel, which
              makes behavior-aware and network-aware defenses more valuable. But the market is not frictionless. Privacy
              rules, data-sharing constraints, consent requirements around biometric data, legacy core systems, and
              false-positive burdens still slow deployment and expand implementation cost. Reimbursement and monitoring
              rules are simultaneously raising the stakes. Nacha’s 2026 phases broaden ACH fraud-monitoring
              responsibilities, while U.K. and Australian scam-liability debates show why banks are shifting from
              reactive controls to predictive prevention. The consequence is a market with strong top-line tailwinds,
              but one where execution quality, explainability, and integration discipline determine who actually
              captures wallet share.
