      - number: '3.3'
        title: GTM, distribution power, and trust posture
        blocks:
          - type: paragraph
            body: >-
              Distribution power cuts both ways. BioCatch benefits from bank specialization and a product story that now
              combines behavior, device, network, and transaction telemetry, but incumbents already sit in broader
              financial-crime programs where procurement may prefer consolidation. Identity networks and bureaus can
              enter through onboarding, device, and identity-risk workflows before a fraud team sponsors a
              behavioral-biometrics deployment. Commerce-fraud vendors can approach digital businesses with API-first
              packaging and outcome language around chargebacks or approvals. Trust posture matters because bank buyers
              need auditable risk decisions, investigation support, and governance fit, not only a model score. For
              BioCatch, the positive moat is operational depth in behavioral intelligence; the negative case is that
              banks may multi-home and route the final decision through a separate risk engine, reducing BioCatch to one
              weighted signal.
            claimRefs:
              - CP002
