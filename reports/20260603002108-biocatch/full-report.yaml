      - number: '7.3'
        title: Partner, customer-concentration, and platform-consolidation risk
        blocks:
          - type: paragraph
            body: >-
              BioCatch’s commercial upside and dependency risk are increasingly intertwined. The Nasdaq Verafin
              partnership is strategically important because it places BioCatch inside a much larger financial-crime
              distribution surface; the ABA says Verafin already serves more than 2,500 institutions representing more
              than $9 trillion in collective assets. That reach can accelerate adoption, but it also means BioCatch is
              partnering from a position where the platform owner has more direct customer touchpoints, broader workflow
              ownership, and potentially stronger pricing leverage. The same pattern exists in Australia. BioCatch Trust
              is a compelling moat story because the network claims coverage of more than 85% of banking customers in
              Australia and customer sources such as Macquarie and ANZ describe real utility. Yet that moat depends on
              banks continuing to participate, share data, and convert network insight into action. Public materials are
              notably weaker on direct concentration disclosure: they identify members, partners, and broad customer
              counts but not revenue mix by bank, partner, geography, or channel. Competitive risk compounds the issue
              because 2026 alternative lists and market-data sources place BioCatch in a buyer set that includes broader
              fraud, bot-defense, and identity platforms. The underwriting question is therefore not only whether
              BioCatch is differentiated, but whether it can stay decision-critical inside larger suites and partner-led
              channels.
