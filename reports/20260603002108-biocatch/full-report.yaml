  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              For diligence purposes, BioCatch should not be valued against the full fraud-prevention universe as if
              every dollar of that spend were reachable. The company sits inside a broader fraud detection and
              prevention stack that includes transaction monitoring, authentication, AML/fraud case management,
              payment-network scoring, and identity verification, but its most relevant niche is the
              behavioral-biometrics and device-intelligence layer used to identify anomalous digital behavior in real
              time. That narrower definition matters because the budget conversation inside banks is not “whether to
              fight fraud,” but which controls receive incremental spend. Status-quo substitutes still absorb meaningful
              budget: rules engines, manual review teams, device fingerprinting, step-up MFA, and consortium scoring.
              The practical implication is that BioCatch benefits from a large market umbrella, but wins and pricing
              depend on proving that behavioral analytics can reduce false positives, improve scam detection, and
              coordinate with adjacent controls rather than replace the entire stack.
            claimRefs:
              - CM001
              - CM008
