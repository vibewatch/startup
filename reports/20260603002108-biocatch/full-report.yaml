  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Privacy, regulatory, and liability exposure
        blocks:
          - type: paragraph
            body: >-
              BioCatch’s strongest category risk is not a disclosed lawsuit today; it is the compliance burden created
              by telemetry-heavy behavioral and device intelligence sold into regulated banks. The company’s privacy
              notice says BioCatch collects device, connectivity, system-log, and recorded-activity data and can derive
              aggregated or pseudonymized datasets for service improvement and partner use. That is directionally
              consistent with the product’s value proposition, but it also means procurement and legal review will focus
              on lawful basis, retention, data minimization, cross-border transfer, and how liability is shared with
              bank customers. The external rulebook is tightening rather than stabilizing. California treats sensitive
              data more aggressively, the FTC has warned that biometric technologies raise privacy, bias, and security
              concerns, the ICO’s biometric-recognition guidance is already under review after a 2025 law change, and
              the EU AI Act adds another layer of documentation and use-case scrutiny around biometric AI systems.
              BioCatch has credible mitigations such as pseudonymization claims and explicit privacy-rights language,
              but public evidence does not resolve the practical diligence questions that matter for underwriting: DPA
              terms, indemnities, jurisdiction-by-jurisdiction legal bases, buyer audit rights, claims history, and
              whether contract language can absorb new biometric and AI requirements without delaying sales cycles or
              expanding loss-sharing exposure.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
