            claimRefs:
              - CV025
              - CV030
              - CV031
              - CV032
              - CV043
      - number: '8.3'
        title: Scenario range, return discipline, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The base case is not a blowout-return setup at the known 2024 mark. A blended underwriting view that uses
              the control transaction, current ARR disclosures, public comp discounts, and disclosure penalties lands
              around roughly $1.1 billion to $1.6 billion. That range implies limited upside for a new investor entering
              near $1.3 billion unless BioCatch can prove the company has premium-quality software economics behind the
              ARR story. The bull case still exists: if growth remains above 20%, partner and network channels deepen
              distribution without crushing economics, and management can show strong retention and margins, then a $1.7
              billion to $2.2 billion outcome becomes defensible. The bear case is equally real: weaker economics,
              slower growth, or tighter regulatory and partner costs can drive the company back toward roughly $0.8
              billion to $1.0 billion.


              Return discipline therefore matters more than company admiration. At or above the Permira-era price,
              probability-weighted outcomes resemble modest growth-equity returns rather than classic venture-style
              multiples. That pushes the underwriting posture toward track rather than buy. Exit readiness is also
              constrained. BioCatch looks more like a sponsor-owned private company than an IPO-ready issuer on current
              disclosure alone, so the most realistic exit paths today are sponsor-managed secondary liquidity or
              strategic interest from broader fraud, identity, or payments software platforms rather than a near-term
              public listing.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV043
              - CV044
              - CV047
          - type: table
            tableRef: TV003
            claimRefs:
              - CV030
              - CV031
              - CV032
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV044
      - number: '8.4'
        title: Diligence gaps, thesis-break triggers, and final stance
        blocks:
          - type: paragraph
            body: >-
              The unresolved diligence work is unusually important because the gap between a fair valuation and a
              stretched one is driven less by topline demand than by what sits underneath the topline. Public sources do
              not answer the questions that actually determine whether BioCatch deserves a premium over public comps:
              how ARR converts into recognized revenue, what gross margins and free cash flow look like, how
              concentrated the customer base is, what net retention actually is, how much margin is shared with
              partners, and what rights a new minority investor would receive beneath sponsor control. Those are not
              cosmetic gaps; they are the main valuation variables.


              That is why the thesis-break triggers are concrete. If audited economics show low-quality or concentrated
              ARR, if partner or network economics are weaker than the marketing suggests, or if any new financing or
              secondary transaction clears below the Permira-era mark, the current valuation narrative should be
              re-underwritten immediately. Until those issues are closed, the best synthesis is straightforward:
              BioCatch looks fair near the known 2024 transaction, stretched above roughly $1.6 billion to $1.8 billion,
              and attractive only on a cheaper entry or materially stronger diligence evidence. The company remains
              worth following closely, but it does not currently justify paying for uncertainty as if uncertainty were
              proof.
            claimRefs:
              - CV035
              - CV036
              - CV039
              - CV040
              - CV041
              - CV046
