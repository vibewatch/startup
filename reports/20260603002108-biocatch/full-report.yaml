  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buyer/user/payer structure
        blocks:
          - type: paragraph
            body: >-
              BioCatch’s public customer evidence points to a narrow but valuable customer profile: regulated financial
              institutions, especially banks and credit unions, buying fraud, AML, digital-risk, and financial-crime
              intelligence. The economic buyer is usually a fraud, AML, digital-banking, or risk executive who owns loss
              reduction and customer-friction targets; day-to-day users are fraud operations, investigation,
              digital-channel, and financial-crime analysts; the payer is the bank or platform partner embedding
              BioCatch into onboarding, account takeover, scam, mule, or AML workflows. This segmentation matters
              because broad customer-count claims do not prove deployment depth. The company-reported base of more than
              340 financial institutions and half-billion protected end customers is strong adoption evidence, but it
              should be triangulated against named production examples and partner-channel sell-through before
              underwriting retention, expansion quality, renewal durability, or concentration safety.
