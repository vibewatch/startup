            body: >-
              BioCatch’s public leadership materials show a founder-led technical origin that later shifted into an
              operator-led scale phase under Gadi Mazor. The official journey shows Mazor joining as COO in 2018 and the
              board materials plus external speaker biography place his CEO transition in 2021. That matters because the
              operating milestones disclosed since 2023 — faster ARR growth, new partner-led distribution, wider
              geographic expansion, and a major control transaction — all occurred under the same management team.
              Governance also changed materially after Permira’s minority investment in 2023 became a majority buyout in
              2024. Official board materials and the transaction close announcement name Permira-linked directors
              Dominik Pozny, Stefan Dziarski, and Ran Maidan, while also keeping independent-profile directors such as
              Liat Nadai Arad and Sallie Krawcheck. The resulting picture is a company that retained operating
              continuity while resetting ownership and board influence toward a growth-equity sponsor.
