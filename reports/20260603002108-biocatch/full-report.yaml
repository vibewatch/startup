  summary: >-
    BioCatch is a 2011-founded behavioral biometrics and device-intelligence company headquartered in Tel Aviv, Israel,
    selling fraud and financial-crime software to banks and other financial institutions. Official materials and public
    releases show the company broadening from account takeover and authentication into account opening, scams,
    mule-account detection, device intelligence, and consortium-style intelligence sharing under the BioCatch Connect
