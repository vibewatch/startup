  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and recommendation
        blocks:
          - type: paragraph
            body: >-
              BioCatch is not being valued like an early product-market-fit experiment anymore. The 2024 Permira control
              deal at a $1.3 billion enterprise valuation came after BioCatch publicly said it had passed $100 million
              ARR, reached EBITDA profitability in 2023, and built a meaningful bank footprint. Since then, the company
              has added stronger public scale markers: more than $160 million ARR by mid-2025, more than $185 million
              ARR by year-end 2025, more than 340 financial institutions served, and visible partner or network assets
              such as Nasdaq Verafin and BioCatch Trust. Those facts support an investment thesis that BioCatch is a
              scaled fraud platform with enough breadth and category credibility to deserve more than mature
              payments-infrastructure multiples.


              The anti-thesis is that the public evidence remains sponsor-era and selective. The key operating facts are
              largely company-issued ARR updates rather than audited consolidated disclosures; current gross margin,
              cash generation, concentration, and board-control terms are not public; and current private-market marks
              come from screen providers with delayed or derived methodology. That means the right call is neither
              “cheap quality compounder” nor “hard avoid.” It is a diligence-gated track stance. Around the 2024 Permira
              mark, the price can still be defended. Above that level, conviction should rise only if diligence closes
              the biggest quality-of-earnings and governance gaps.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
