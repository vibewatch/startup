      - number: '3.4'
        title: Moat durability, commoditization risk, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              BioCatch’s moat is durable enough to matter but not invulnerable. Historical behavior baselines,
              bank-specific tuning, scam typology knowledge, and fraud-investigation playbooks create switching cost
              after deployment. However, the public record also shows many credible alternatives, and several
              independent directories explicitly frame BioCatch as one vendor among many. Feature convergence is visible
              because multiple competitors now market behavioral, adaptive, device, or AI-driven risk signals. The most
              important adverse diligence is not whether behavioral biometrics is useful; it is whether BioCatch can
              retain premium economics when suites, identity networks, and internal bank platforms can absorb similar
              signals. The next diligence cycle should request win/loss files, realized pricing by module and volume,
              renewal cohorts, implementation-cost benchmarks, bank displacement examples, and proof that network
              effects improve model performance beyond what buyers can replicate through multi-vendor orchestration. A
              further adverse possibility is organizational: if a bank centralizes fraud decisioning under an incumbent
              case-management or data-science platform, BioCatch may remain technically valuable but lose influence over
              budget ownership, roadmap priority, and renewal framing. That is why the moat assessment weights control
              of workflow and distribution as heavily as signal quality.
            claimRefs:
