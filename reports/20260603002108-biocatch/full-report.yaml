  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              BioCatch is best understood as a private, bank-focused B2B SaaS company whose revenue quality is anchored
              in recurring contracts, large financial-institution customers, and growing add-on modules. The public
              record is unusually rich for ARR but thin for accounting statements: BioCatch disclosed more than $160
              million of ARR at Q2 2025 and more than $185 million after a record Q4 2025, while Sacra independently
              frames the model as session, user, or transaction-volume monetization. The higher-quality part of the
              story is not only the headline ARR. It is the combination of 90 new customers in 2025, three of the four
              largest U.S. banks, more than 280 financial institutions by mid-2025, and product-mix expansion in scams
              and mule detection. That said, ARR is not audited revenue, does not reveal contract duration, and cannot
              by itself prove gross retention, realized pricing, or margin. This chapter therefore treats every
              disclosed number as a lower-bound public signal rather than a complete financial statement. The key
              diligence standard is to keep public ARR, customer value, and product adoption separate from the private
              operating metrics that decide valuation, including gross margin, CAC payback, support cost, legal
              reserves, and cash conversion.
