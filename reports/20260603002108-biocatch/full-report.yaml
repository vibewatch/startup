chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and product boundary
        blocks:
          - type: paragraph
            body: >-
              BioCatch was founded in 2011 to address digital identity and online fraud by analyzing how legitimate
              users and fraudsters interact with devices and banking interfaces. Official company materials describe the
              business as a behavioral biometrics and device-intelligence platform for fraud prevention, account
              opening, account takeover, mule detection, scams, and strong customer authentication. The public company
              journey ties the origin story to founder Avi Turgeman’s military-intelligence background and the insight
              that human-machine interactions are measurable and distinctive. Public pages consistently anchor
              headquarters in Tel Aviv, while company and directory sources show an international footprint that
              includes New York and London alongside additional regional locations. Across official and partner
              disclosures, the company’s operating model is to sell software and intelligence into financial
              institutions rather than consumer endpoints, making BioCatch’s scale story inseparable from the breadth of
              its bank deployments and the volume of monthly sessions it analyzes.
