      - number: '3.2'
        title: Capability breadth, packaging, and unsupported cells
        blocks:
          - type: paragraph
            body: >-
              The feature comparison is favorable to BioCatch on behavioral depth and scam-centric positioning, but less
              favorable on total suite breadth. NICE Actimize and Feedzai speak to buyers that want fraud, AML, case
              management, and financial-crime operations under a broad enterprise program. ThreatMetrix, Experian,
              Equifax, Socure, and Alloy pressure BioCatch from identity, device, and data-network angles. SEON, Sift,
              Forter, and Riskified show how adjacent fraud vendors can sell fast integration, API-led packaging, and
              risk decisioning for commerce or fintech use cases. Pricing evidence is intentionally conservative. Public
              pages usually support only packaging direction, not exact enterprise price, and SEON’s page is the
              clearest source for a pay-per-API-call signal. Therefore the table marks unsupported price,
              false-positive, and deployment-economics cells as unknown rather than imputing values from review
              anecdotes. This conservative treatment is important because procurement teams often compare vendors on
              private dimensions that never appear in marketing pages: minimum annual commitment, data-retention terms,
              service credits, model-governance artifacts, professional-services burden, and whether a module is bundled
              into a larger enterprise agreement. The public evidence is still sufficient for directional mapping, but
              not for a precise total-cost-of-ownership score.
