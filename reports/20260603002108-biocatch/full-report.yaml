    the customer base reached 340 financial institutions, and Permira completed a majority acquisition at a $1.3 billion
    valuation in 2024. The underwriting question is therefore less about product-market fit than about how much private
    diligence is still needed on margins, retention, customer concentration, privacy controls, and transaction terms.
