      - number: '7.4'
        title: Execution, security transparency, and operating-burden risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk for BioCatch is the combination of product ambition, regulated-buyer expectations, and
              limited public operating transparency. The company still describes itself as a global startup even while
              serving leading financial institutions, which is a fair signal that the organization is still building
              rather than simply harvesting a mature installed base. Careers and product materials imply continuing
              demand for specialized fraud, engineering, and customer-success talent, and the product strategy itself
              pushes that burden higher: continuous protection, interactive customer controls, platform integrations,
              and receiving-account intelligence all require bank-specific workflow design. That would be manageable if
              the public trust surface were deeper. Instead, the reviewed official pages show privacy notices and
              product claims, but not a public status page, a named incident-history feed, or a public SOC 2 or ISO
              package. That does not prove a weak control environment; it does mean buyers and investors must rely on a
              private diligence room for core security evidence. In practice, this risk shows up as elongated enterprise
              cycles, heavier implementation support, and a narrower margin for error if product changes or new
              AI-driven attack methods outpace staffing, governance, or customer enablement.
            claimRefs:
