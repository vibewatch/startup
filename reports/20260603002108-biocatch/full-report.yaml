      - number: '7.2'
        title: Model quality, false-positive, and product-liability risk
        blocks:
          - type: paragraph
            body: >-
              The operating risk inside BioCatch’s product set is less about whether the system can generate signals and
              more about whether banks can trust those signals at scale without excessive friction or analyst overload.
              Public sources support the qualitative product logic: BioCatch says DeviceIQ can recognize legitimate
              device upgrades, detect compromised devices before login, and distinguish new AI-assisted access patterns,
              while customer-control and continuous-protection materials show the company understands that fraud
              decisions require orchestration beyond a simple authentication checkpoint. The problem for diligence is
              measurement. The retained public materials do not disclose audited false-positive, recall, precision,
              explainability, or drift metrics for core fraud models or the newer device-intelligence stack. Even the
              strongest public proof point — a company-claimed example of nearly 60% genuine device-upgrade detection in
              two weeks — is a single deployment anecdote rather than a benchmark pack. Help Net Security’s interview
              framing of skyrocketing case volumes is a reminder that bad alerts create real operating cost. If BioCatch
              underperforms, the pain will show up as investigation workload, customer friction, and weaker renewal
              leverage long before it appears as a public incident. That makes model governance, release controls, and
              customer-operations integration central diligence asks rather than technical nice-to-haves.
            claimRefs:
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
