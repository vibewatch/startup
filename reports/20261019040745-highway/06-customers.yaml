schemaVersion: "report-v2"
artifact: customers
slug: highway
runDate: 2026-10-19
company:
  name: Highway
chapter:
  number: 6
  title: Customers
  summary: >-
    Highway has credible broker-side adoption proof, with management and news coverage pointing
    to more than 1,050 brokers and named workflow evidence from RJ Logistics plus additional
    case-study references. The public pack is still weak on the durability questions that matter
    most for underwriting customer quality: NRR/GRR, churn, contract length, module penetration,
    and concentration remain undisclosed.
sections:
  - id: customer-base
    title: Customer base, buyer, and workflow fit
    body: >-
      Highway's clearest paying-user persona is the freight broker / 3PL operations and
      compliance team, not the carrier itself. The homepage says the product helps brokers verify
      identity, authorize participation, and enforce standards before, during, and after every
      load, while the TruckX integration shows the same checks embedded inside partner workflows
      for brokers, shippers, and logistics providers. Customer-scale evidence is strongest in
      broker penetration rather than disclosed revenue: Highway's August 2025 financing
      announcement said the company served more than 1,050 brokers, including 70 of the top 100
      in the U.S. That is meaningful category foothold, but the public pack still does not break
      adoption by ACV, module, geography, or customer size.
    claimRefs: [CU001, CU002, CU009, CU013]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Named deployment evidence and measured outcomes
    body: >-
      Named customer proof is better than logo-only marketing, but it is still uneven. RJ
      Logistics provides the strongest third-party operating proof in the assigned pool: it says
      the partnership began in early 2023, onboarded more than 10,000 verified carriers, now
      sources more than 800 contracted carriers and owner-operators through Highway, and helped
      recover a high-value copper shipment after a theft attempt. Highway's own case-study content
      adds two more production-style examples: SEL Supply-Chain Solutions using real-time
      verification and dispatch-level validation to strengthen onboarding security, and GIX
      Logistics setting up more than 5,000 carriers with no double-brokering incidents within a
      few months. Outcome marketing is directionally strong - 92% fraud reduction and 90% manual
      process elimination on the homepage, a KCH Transportation testimonial about fewer stolen
      loads and fraud, and FreightWaves citing 97% lower double brokering plus zero reported
      stolen loads for Load Lock users - but those headline metrics still lack public cohort sizes
      or measurement periods.
    claimRefs: [CU003, CU004, CU005, CU007, CU008, CU010, CU011, CU014]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration gaps
    body: >-
      Expansion evidence suggests Highway can widen account footprint inside broker workflows
      rather than remain a one-off onboarding tool. The platform is positioned across sourcing,
      onboarding, continuous compliance, load protection, and partner integrations, and RJ
      Logistics plans to extend usage into Mexico-based carrier onboarding. That supports a
      land-and-expand thesis operationally. What is still missing is true durability proof: the
      public source pack does not disclose NRR, GRR, logo churn, renewal rates, contract length,
      module penetration, or top-customer concentration. Even the strongest public retention
      language - an investor quote calling the customer base highly retentive and blue-chip - comes
      from the company's own financing announcement rather than independently auditable cohort
      data. SupplyWolf also cautions that its catalog-listed capabilities and integrations require
      direct confirmation of current availability and implementation requirements. Until those
      metrics and implementation details surface, customer stickiness, deployment friction, and
      concentration risk remain unverified.
    claimRefs: [CU006, CU012, CU013, CU015, CU016]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Diligence gap
    rows:
      - - Enterprise freight brokers / 3PLs
        - Brokerage, compliance, and carrier-ops teams are the primary users and budget owners.
        - Continuous carrier identity verification before, during, and after each load.
        - ">1,050 brokers and 70 of the top 100 U.S. brokers disclosed publicly."
        - Core paying customer wedge with visible top-tier broker penetration.
        - No public ACV, module mix, or segment-level revenue split.
      - - Mid-market and specialized brokers
        - Capacity and procurement teams use Highway inside day-to-day carrier sourcing workflows.
        - Faster onboarding, hard-lane sourcing, and fraud-screened booking decisions.
        - RJ Logistics cited a 15-load Calexico project filled within minutes from one search.
        - Shows the product can support operational throughput, not just compliance theater.
        - No disclosed split between enterprise and mid-market accounts.
      - - Carrier network participants
        - Carriers and owner-operators participate in verification flows even when brokers are the payer.
        - Verified onboarding, compliance checks, and ongoing participation monitoring.
        - RJ Logistics says the partnership onboarded more than 10,000 verified carriers.
        - Network density likely improves broker-side value and switching costs.
        - Carrier-side monetization and retention are undisclosed.
      - - Integration and ecosystem partners
        - Embedded users include brokers, shippers, and logistics providers operating inside partner tools.
        - Search validated carriers, review compliance alerts, and automate onboarding within partner software.
        - TruckX markets a direct Highway integration; Highway markets broad TMS / ELD integrations.
        - Supports expansion into existing workflows instead of a separate destination app.
        - Channel revenue share and partner concentration are not disclosed.
    notes: >-
      Rows synthesize company, customer, partner, and news evidence; public materials do not
      disclose pricing, ACV, or revenue mix by segment.
    claimRefs: [CU001, CU002, CU003, CU009, CU013]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / period
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Broker customer base
        - ">1,050 brokers; 70 of top 100 U.S. brokers"
        - Aug 2025 disclosure
        - Highway financing announcement, echoed by FreightWaves and Dallas Innovates
        - high
        - Strong broker penetration in the core target segment.
        - Paying-account mix by size, module, and geography is not disclosed.
      - - RJ Logistics carrier onboarding
        - ">10,000 verified carriers onboarded"
        - Partnership began in early 2023; disclosed Jul 2025
        - RJ Logistics / GlobeNewswire
        - medium
        - Indicates production usage beyond a pilot deployment.
        - No platform-wide carrier-onboarding denominator or conversion rate.
      - - RJ Logistics sourced carrier base
        - ">800 contracted carriers and owner-operators sourced through Highway"
        - Jul 2025
        - RJ Logistics / GlobeNewswire
        - medium
        - Suggests durable sourcing workflow value after initial onboarding.
        - No disclosed freight-spend or gross-profit contribution from those carriers.
      - - Homepage outcome metrics
        - "92% freight fraud reduction; 90% manual processes eliminated; up to $100K protection on qualifying shipments"
        - Website accessed 2026-10-19
        - Highway homepage
        - medium
        - Clear ROI messaging can help upsell multiple modules into the same account.
        - No cohort size, methodology, or coverage-rate disclosure.
      - - FreightWaves-cited production outcomes
        - "97% reduction in double brokering; zero reported stolen loads for Load Lock users"
        - 2025 article
        - FreightWaves quoting Highway
        - medium
        - Reinforces production-outcome narrative beyond Highway's own website.
        - Article does not disclose sample size or measurement period.
    notes: >-
      Trajectory evidence mixes official, customer, and news sources; several outcome metrics are
      commercially attractive but still lack public denominators or cohort definitions.
    claimRefs: [CU002, CU003, CU004, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - RJ Logistics
        - North American 3PL / broker
        - Carrier sourcing, compliance, VIN / trailer tracking, and cross-border onboarding expansion
        - Production partnership since early 2023
        - ">10,000 verified carriers onboarded, >800 contracted carriers sourced, and shipment-recovery support in a cargo-theft case"
        - Outcome and timeline come from a customer-quoted press release; no commercial value or renewal data.
      - - SEL Supply-Chain Solutions
        - Logistics company / broker network
        - Real-time verification and dispatch-level validation for secure onboarding
        - Production use implied after implementation
        - Faster onboarding and higher network security per Highway case-study text
        - Official Highway case-study material; no quantified ROI or contract detail.
      - - GIX Logistics
        - Logistics / broker
        - Carrier onboarding and fraud prevention
        - Production use implied within months of implementation
        - ">5,000 carriers set up with no double brokering reported in the first few months"
        - Official Highway case-study material; no independent corroboration in the assigned pool.
      - - KCH Transportation
        - Broker / 3PL
        - Shipment authentication and fraud reduction
        - Production testimonial on homepage
        - Executive quote cites a substantial decrease in stolen loads and fraud
        - No numeric baseline, period, or contract detail is disclosed.
    notes: >-
      This is a sample of named deployments visible in the assigned public source pack, not an
      exhaustive customer roster.
    enumerationScope:
      coverage: sample
      basis: >-
        Sample limited to named customer examples explicitly present in the assigned source pool
        across customer, official, and news materials for this refresh run.
    claimRefs: [CU003, CU004, CU005, CU010, CU011, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence shows Highway expanding from broker onboarding into sourcing, monitoring,
      exception handling, and partner-embedded workflows.
    data:
      items:
        - label: Evaluate carrier risk
          actor: Broker compliance and carrier-ops teams
          touchpoints:
            - Verify identity, authority, insurance, and participation before a load is accepted.
            - Highway positions Carrier Identity as a before-during-after control, not one-time onboarding.
        - label: Onboard verified carriers
          actor: Capacity and onboarding teams
          touchpoints:
            - RJ Logistics says the partnership onboarded more than 10,000 verified carriers.
            - Highway markets automation to replace email, phone, and fax-based manual checks.
        - label: Source capacity on hard lanes
          actor: Procurement and brokerage desks
          touchpoints:
            - RJ Logistics said one Highway search helped secure a 15-load Calexico project within minutes.
            - TruckX says users can search validated carriers and review compliance alerts inside partner workflows.
        - label: Monitor loads in flight
          actor: Fraud and exception-management teams
          touchpoints:
            - RJ Logistics used VIN and trailer tracking to help identify the carrier in a theft incident.
            - Highway markets continuous verification throughout the lifecycle of every load.
        - label: Expand into adjacent workflows
          actor: Operations leadership
          touchpoints:
            - Homepage ROI claims include 92% freight-fraud reduction and 90% manual-process elimination.
            - Qualifying multi-module usage is marketed with up to $100K shipment protection.
        - label: Extend geography and ecosystem reach
          actor: Broker network, partner, and cross-border teams
          touchpoints:
            - RJ Logistics plans to expand Mexico-based carrier onboarding.
            - Highway's public materials emphasize TMS, ELD, and partner integrations for broader workflow adoption.
    claimRefs: [CU001, CU003, CU005, CU006, CU009, CU013]
callouts:
  - calloutType: strength
    title: Real deployment proof exists in the broker workflow
    body: >-
      Highway's customer evidence is strongest where the product touches broker operations
      directly: named production use at RJ Logistics, integration-led workflow embedding, and a
      disclosed footprint of more than 1,050 brokers.
    claimRefs: [CU002, CU003, CU004, CU009]
  - calloutType: risk
    title: Durability remains the largest underwriting blind spot
    body: >-
      Public proof points support adoption and workflow relevance, but the pack still lacks
      independent churn, cohort, renewal, contract-length, and concentration data, so stickiness
      and exposure to a few large accounts remain open diligence items. An independent catalog
      additionally tells buyers to verify current capability and integration availability.
    claimRefs: [CU012, CU015, CU016]
