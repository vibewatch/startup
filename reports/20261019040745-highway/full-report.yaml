        title: Differentiation is clear; control maturity and technical depth are still under-disclosed
        blocks:
          - type: paragraph
            body: >
              Product differentiation in the retained evidence comes from Highway's insistence on identity-first
              verification plus continuous monitoring and ecosystem embeds, not from a published low-level stack. The
              company has enough surface area to show expansion beyond onboarding into monitoring, marketplace
              participation, and partner distribution, and the 2025 funding release explicitly ties fresh capital to
              product-suite evolution. However, public diligence still lacks architecture topology, uptime or SLA
              evidence, named security attestations, precision or false-positive metrics, and module-level adoption
              splits. For an investor, that means the product thesis is stronger than the publicly documented control
              maturity: the workflow story is credible, but the technical risk review still depends on management
              materials and customer references outside the public record.
