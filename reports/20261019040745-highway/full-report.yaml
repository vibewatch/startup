  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation moves from category proof to an underwriting stop because public price and unit-economics
      evidence are still missing.
    data:
      nodes:
        - id: scale-proof
          label: Scale proof
          detail: 1,050+ brokers and 70 of the top 100 U.S. brokers indicate real category adoption.
          tone: positive
        - id: workflow-proof
          label: Workflow proof
          detail: Transfix launched a live TMS embedding in June 2026, showing current distribution beyond Highway's own site.
          tone: positive
        - id: capital-signal
          label: Capital signal
          detail: FTV and Lead Edge funded a minority growth round and took board seats.
          tone: positive
        - id: missing-price
          label: Missing price
          detail: Public evidence still omits round size, valuation, and preference stack.
          tone: risk
        - id: missing-economics
          label: Missing economics
          detail: ARR, growth, gross margin, retention, and take-rate disclosure are still absent.
          tone: risk
        - id: recommendation
          label: Track, not buy
          detail: Continue diligence and wait for priced evidence strong enough to test upside versus downside.
          tone: neutral
      edges:
        - from: scale-proof
          to: workflow-proof
          label: Adoption plus embed support real product-market fit.
        - from: workflow-proof
          to: capital-signal
          label: Strategic investors backed that fit.
        - from: capital-signal
          to: missing-price
          label: But the round still lacks public price transparency.
        - from: missing-price
          to: missing-economics
          label: Price opacity is compounded by weak economic disclosure.
        - from: missing-economics
          to: recommendation
          label: That gap caps the stance at track.
    approximationNotes: Node ordering is an analytical synthesis of disclosed milestones and disclosure gaps, not a timing sequence.
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
