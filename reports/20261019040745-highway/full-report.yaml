      - number: '3.3'
        title: Pricing, distribution, and switching costs favor workflow incumbents and embedded partners
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is weak in the assigned pool, which itself says something about buyer
              friction. Highway's 2026 pricing evidence says the product is quote-based and scales with broker size,
              load volume, and feature depth, while Carrier411 exposes a visible starting price around $99 per month.
              RMIS, SaferWatch, and MyCarrierPortal are present in the landscape but not with public contract terms in
              this pool, so buyer-side price comparison still requires live quoting. Distribution is stronger than price
              transparency: Highway highlights TMS, ELD, and freight-tech integrations, and TruckX explicitly markets
              validated-carrier search and onboarding through Highway. That embedment raises switching costs and makes
              adjacent workflow owners—not greenfield startups—the more credible entrant class in the assigned evidence.
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP014
