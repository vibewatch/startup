      - number: '5.2'
        title: The strongest proof is embedded use inside partner and customer operations
        blocks:
          - type: paragraph
            body: >
              Highway's clearest technical proof is not a public architecture diagram but repeated evidence that
              identity checks are embedded inside existing brokerage workflows. The Transfix release says brokerage and
              compliance teams can verify carrier legitimacy without leaving the TMS, TruckX describes identity
              verification plus search and compliance-alert capabilities inside its own product, and Logistics Plus
              adopted Highway as its onboarding and compliance platform. Together those sources imply a product that
              wins by sitting in the operating path where carriers are sourced, activated, and monitored, rather than by
              asking brokers to use a detached risk portal. The scale claims around broker adoption add commercial
              weight, but they remain company-originated counts even when repeated by third parties.
