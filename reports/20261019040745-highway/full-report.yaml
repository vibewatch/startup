      - number: '4.2'
        title: Public traction and commercialization signals
        blocks:
          - type: paragraph
            body: >-
              The strongest public commercial signal is customer scale rather than revenue. Highway says it serves more
              than 1,050 brokers, including 70 of the top 100 U.S. brokers, and several sources frame the network as
              large enough to matter operationally. Even so, the carrier-side denominator is not normalized across
              sources: one third-party profile cites more than 225,000 carriers watched, while another cites active
              certificates of insurance for more than 175,000 carriers. Those are directionally supportive for
              distribution and data-network value, but they are not interchangeable operating metrics. Product outcome
              claims such as fraud reduction and shipment protection reinforce willingness to pay, yet they are not
              substitutes for disclosed retention, attach, or margin performance.
            claimRefs:
              - CI004
              - CI005
              - CI010
      - number: '4.3'
        title: Unit economics, cost structure, and service-delivery implications
        blocks:
          - type: paragraph
            body: >-
              Highway appears more operationally embedded than a lightweight self-serve SaaS tool. The product promise
              depends on continuous carrier verification, integration into TMS and ELD systems, real-time alerting,
              document and identity checks, and customer-side process adoption. That suggests a cost structure with
              material implementation, data, monitoring, support, and exception-management components even if software
              gross margins are ultimately attractive. What is missing is the bridge from those operating demands to
              financial outputs: no reviewed source discloses CAC, payback, gross margin, NRR, GRR, sales cycle, or
              customer concentration. As a result, public evidence can describe the value proposition and likely cost
              drivers, but not sales efficiency or contribution economics.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
      - number: '4.4'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The August 2025 growth-equity announcement improves confidence that Highway has fresh capital to keep
              expanding product and go-to-market coverage, and independent follow-up reporting repeats that momentum
              narrative. The core financial blocker is opacity rather than obvious distress: neither the company
              announcement nor the independent coverage reviewed here discloses the financing amount, valuation, current
              cash balance, burn, debt, or covenant load. That means investors can reference the Company Overview
              funding chronology for background, but Financials still cannot size runway, next-round timing, or downside
              financing dependency from public evidence. The chapter verdict is therefore "credible platform with
              incomplete underwriting inputs," not a price-sensitive investment conclusion.
            claimRefs:
              - CI006
              - CI007
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong workflow evidence, weak price evidence
            body: >-
              Public sources make the product stack and customer problem very clear, but they do not disclose list
              pricing, contract structure, or realized yield. The investment question is therefore not whether Highway
              sells something valuable; it is how much revenue and margin that value converts into per broker account.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: callout
            title: Fresh capital does not equal visible runway
            body: >-
              The 2025 FTV/Lead Edge round reduces immediate financing concern, yet the absence of round size, cash,
              burn, and debt disclosure means capital adequacy is still opaque. That keeps next-round timing and
              downside financing dependence out of reach for public investors.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI012
          - type: callout
            title: Management diligence should focus on conversion and margin bridges
            body: >-
              The first diligence packet should request ACV by module, retention cohorts, sales-cycle and CAC data,
              gross margin by product line, and current cash runway. Without those bridges, this chapter can validate
              market pull and product breadth, but not efficiency or valuation support.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Carrier Identity is the product, and it is framed as a workflow not a point tool
        blocks:
          - type: paragraph
            body: >
              The retained sources consistently describe Highway as replacing one-time carrier onboarding with
              continuous identity verification around each load. The homepage anchors the operating model in checks that
              happen before, during, and after shipment execution, while the independent profile shows the same logic
              expressed as a broker workflow spanning sourcing, onboarding, compliance, and a verified marketplace. That
              matters because Highway is not selling only a compliance file cabinet; it is trying to become the decision
              layer that determines who is allowed to participate in the load lifecycle and under what conditions.
              Publicly described modules are specific enough to map the commercial surface, but maturity still has to be
              inferred from announcements rather than from a formal product roadmap, documented APIs, or disclosed usage
              by module.
            claimRefs:
