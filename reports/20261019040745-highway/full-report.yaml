              - CP015
      - number: '3.4'
        title: Durability is real, but the moat still has backlash and commoditization vectors
        blocks:
          - type: paragraph
            body: >-
              Highway has stronger public penetration signals than most private logistics-software startups, and the
              breadth of broker adoption suggests its identity layer solves a painful problem. Still, the moat is not
              consequence-free. The same independent comparison that praises fraud prevention also says carriers resent
              intrusive verification and sometimes avoid brokers that enforce it, while Carrier411 shows incumbents can
              weaponize trust data in ways that trigger their own backlash. In practice, Highway's durability appears to
              come less from proprietary access to federal data—which the comparison says is public for everyone—and
              more from continuous monitoring, workflow embedment, and network intelligence. That is defensible, but it
              is also vulnerable if incumbents or adjacent workflow platforms replicate enough of the identity layer
              without creating equal carrier friction.
            claimRefs:
              - CP002
              - CP011
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing transparency
        blocks:
          - type: paragraph
            body: >-
              Public disclosures are strong on workflow and product scope but thin on how dollars convert into
              recognized revenue. Independent coverage says Highway sells B2B software subscriptions to brokers and
              3PLs, while company materials show a broader platform stack that spans onboarding, monitoring, tracking,
              secure tendering, and a trusted marketplace. That is enough to infer multiple monetizable modules and
              expansion paths, but not enough to separate core subscription revenue from newer transaction-adjacent
              surfaces. The same gap shows up on price: none of the reviewed official or partner surfaces publish list
              pricing, contract terms, or discounting, so the public record cannot translate product breadth into ACV,
              realized yield, or revenue-recognition quality.
