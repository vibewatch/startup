      - CI004
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Highway layers carrier-identity data, broker workflow modules, partner embeds, and transaction-stage protection
      around each load.
    data:
      layers:
        - label: Identity data layer
          detail: >-
            Continuous verification checks carrier identity, authority, capability, insurance, and driver participation
            throughout the load lifecycle.
          modules:
            - label: Identity verification
            - label: Authority + insurance checks
            - label: Driver / dispatch validation
          outputs:
            - label: Qualified or flagged carrier state
        - label: Broker workflow apps
          detail: Publicly described modules cover sourcing, onboarding, monitoring, and verified marketplace participation.
          modules:
            - label: Identify
              displayValue: Lane Certainty + carrier discovery
            - label: Connect
              displayValue: Ownership validation + business rules
            - label: Monitor
              displayValue: Real-time change alerts
            - label: Trusted Freight Exchange
              displayValue: Verified marketplace participation
          outputs:
            - label: Load-level participation decision
        - label: Embedded partner surfaces
          detail: Operational proof is strongest where Highway appears inside the tools brokers already use.
          modules:
            - label: Transfix TMS
            - label: TruckX integration
            - label: Logistics Plus onboarding workflow
          outputs:
            - label: In-workflow vetting and onboarding
        - label: Customer proof layer
          detail: >-
            Customer evidence highlights deployment inside broker and 3PL workflows rather than only top-of-funnel
            demos.
          modules:
            - label: Logistics Plus
              displayValue: Compliance monitoring + onboarding
            - label: SEL
              displayValue: Dispatch-level validation
            - label: GIX Logistics
              displayValue: 5,000+ carriers onboarded
          outputs:
            - label: Production-use references
        - label: Conditioned protection layer
          detail: >-
            Homepage claims qualifying shipments can receive up to $100K of protection when multiple Highway controls
            are used together.
          modules:
            - label: Connect
            - label: Load Lock
            - label: Secure Rate Con Delivery
          outputs:
            - label: Feature-gated shipment protection
        - label: Network scale layer
          detail: >-
            Scale claims are used as product proof because network breadth should improve identity verification and
            partner relevance.
          modules:
            - label: 1,050+ brokers
            - label: 70 of top 100 U.S. brokers
            - label: 225,000+ verified carriers
          outputs:
            - label: Dense broker-carrier identity graph
    approximationNotes: >-
      This is an operating-model stack synthesized from retained product, partner, and customer evidence, not a
      published source architecture.
