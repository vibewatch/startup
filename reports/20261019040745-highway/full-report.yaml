chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Highway is a Dallas-based logistics software company founded in 2022 that centers its value proposition on
              “Carrier Identity” for freight brokers. Across its homepage, broker-specific product page, and Trusted
              Freight Exchange page, the company positions itself as a workflow layer that replaces one-time onboarding
              with continuous verification, then extends that trust model into a vetted marketplace for brokers and
              carriers. The retained public record supports a broker-focused business model rather than a broad
              shipper-facing network strategy, and it shows Highway using operational proxies—broker count, carrier
              records, and brokered-load coverage—in place of public financial disclosure. That embeds fraud prevention
              directly in routine booking and carrier-management workflows.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
