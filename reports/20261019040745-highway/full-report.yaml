  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scoring from the assigned evidence places Highway furthest toward deep identity enforcement, while
      incumbents cluster in monitoring, insurance, or packet workflow roles.
    data:
      xAxis:
        label: Identity depth / continuous trust controls (ordinal)
        min: 1
        max: 5
        low: Static records / documents
        high: Persistent identity plus telematics-linked verification
        description: Evidence-backed ordinal synthesis from the assigned pool
        scale: ordinal
      yAxis:
        label: Workflow breadth / embedded broker operations (ordinal)
        min: 1
        max: 5
        low: Narrow single-job tool
        high: Embedded across onboarding, monitoring, and daily workflow
        description: Evidence-backed ordinal synthesis from the assigned pool
        scale: ordinal
      points:
        - label: Highway
          x: 5
          'y': 4
          detail: >-
            Deepest identity position in the assigned pool: rightful-owner validation, dispatch-service detection,
            continuous monitoring, and a reported ELD requirement.
        - label: Carrier411
          x: 2
          'y': 4
          detail: >-
            Strong monitoring footprint and visible starting price, but the retained evidence does not show the same
            identity depth as Highway.
        - label: SaferWatch
          x: 2
          'y': 4
          detail: Adjacent monitoring incumbent described as a Truckstop product with customizable selection rules.
        - label: RMIS
          x: 2
          'y': 3
          detail: >-
            Embedded insurance-monitoring backbone with onboarding scoring, but not positioned as the carrier-identity
            leader in retained evidence.
        - label: MyCarrierPortal / MyCarrierPackets
          x: 1
          'y': 3
          detail: Packet-workflow specialist focused on documents, signatures, and sync rather than deep identity enforcement.
        - label: Public-data / internal build
          x: 1
          'y': 1
          detail: >-
            Free federal record layer plus manual process remains the base substitute, but it lacks continuous alerts
            and network intelligence.
    approximationNotes: >-
      Both axes are ordinal 1-5 scores synthesized from assigned evidence; they are not market-share measures or
      independently benchmarked product scores.
    claimRefs:
      - CP004
      - CP005
      - CP007
      - CP008
      - CP012
      - CP014
      - CP015
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a subscription-led workflow that may expand into transaction revenue, but the bridge
      still ends in undisclosed price, margin, and cash metrics.
    data:
      nodes:
        - id: brokers
          label: Broker / 3PL account base
          value: 1,050+ brokers
          note: Publicly disclosed customer base anchors the commercial starting point.
        - id: connect
          label: Connect / onboarding compliance
          value: Subscription-led core
          note: Carrier identity, vetting, and standards enforcement are the core workflow.
        - id: monitoring
          label: Load Lock and Load Lock+
          value: Expansion module
          note: Monitoring, alerts, and tracking extend monetizable workflow depth.
        - id: control
          label: Know Your Driver / secure tender controls
          value: Identity-control layer
          note: Additional control steps may support upsell without public standalone pricing.
        - id: exchange
          label: Trusted Freight Exchange and payments
          value: Transaction-adjacent surface
          note: Marketplace and payments are strategically emphasized, but take rate is undisclosed.
        - id: revenue
          label: Recognized revenue
          value: Undisclosed
          note: No public source breaks out ACV, revenue mix, or recognition policy.
        - id: profit
          label: Gross profit and runway visibility
          value: Undisclosed
          note: Gross margin, burn, and cash balance remain private.
      edges:
        - from: brokers
          to: connect
          label: initial contract
        - from: connect
          to: monitoring
          label: module attach
        - from: monitoring
          to: control
          label: deeper workflow enforcement
        - from: control
          to: exchange
          label: transaction expansion
        - from: exchange
          to: revenue
          label: monetization
        - from: revenue
          to: profit
          label: missing public bridge
    approximationNotes: >-
      Node values are qualitative unless a disclosed public metric is explicitly shown; the figure explains
      workflow-to-revenue mechanics, not measured conversion rates.
