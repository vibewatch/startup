      - number: '3.2'
        title: 'Differentiation: Highway pushes deeper into identity and continuous trust enforcement'
        blocks:
          - type: paragraph
            body: >-
              Highway's evidence-backed differentiation is not generic compliance data. The assigned sources describe
              rightful-owner validation, dispatch-service detection, continuous monitoring, and—per the July 2026
              independent comparison—an ELD connection requirement used to verify equipment, identity, and location.
              That puts Highway farther right on identity depth than alternatives that mainly monitor insurance,
              authority, safety, or packet completion. The tradeoff is that this identity-first posture is harder to
              replicate with static public records, but it also introduces adoption friction because telemetry-heavy
              verification asks carriers to give a software platform more operational visibility than they grant basic
              monitoring vendors.
