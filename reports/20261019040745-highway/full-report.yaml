      - number: '2.3'
        title: Adoption drivers are clear, but exclusion risk and pricing opacity limit certainty
        blocks:
          - type: paragraph
            body: >-
              Adoption logic is straightforward: traditional one-time onboarding misses fast-changing carrier status,
              fraud schemes, and compliance changes, so brokers gain from continuous verification and automation.
              Partner evidence reinforces that Highway sits in day-to-day carrier search, onboarding, and compliance
              alerts, while Highway's own proof points frame fraud reduction, manual-process elimination, and shipment
              protection as reasons to buy. The main constraints are not demand visibility but market-friction
              visibility. Overdrive reported that some owner-operators felt Highway-led requirements were exclusionary
              or intrusive, which matters because stricter carrier gating can improve broker trust while reducing
              available carrier supply at the edge cases. Public sources also do not provide list pricing, attach rates,
              or segment-specific budget ownership, so diligence still needs direct customer evidence on willingness to
              pay and deployment friction by broker size.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM011
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The problem is economically meaningful even without a clean TAM number
            body: >-
              Buyer-share, installed-base, and fraud-volume signals all point to a real and urgent workflow for brokers,
              which is enough to justify diligence on adoption and pricing even though public TAM evidence is
              incomplete.
            calloutType: strength
            claimRefs:
