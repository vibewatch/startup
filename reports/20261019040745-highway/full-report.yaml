            body: >-
              Founder and CEO Jordan Graft is the dominant public face of the business, and the retained evidence ties
              Highway’s strategy directly to his prior TriumphPay experience and freight payments background. Governance
              became more formalized with the August 2025 strategic growth investment led by FTV Capital and joined by
              Lead Edge Capital, which also added Jerome Hershey and Nimay Mehta to the board. That governance expansion
              is positive for oversight, but the public record still exposes limited detail on the broader executive
              bench, which leaves meaningful key-person concentration around Graft in outward-facing materials and keeps
