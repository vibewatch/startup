      - number: '6.3'
        title: Durability, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Expansion evidence suggests Highway can widen account footprint inside broker workflows rather than remain
              a one-off onboarding tool. The platform is positioned across sourcing, onboarding, continuous compliance,
              load protection, and partner integrations, and RJ Logistics plans to extend usage into Mexico-based
              carrier onboarding. That supports a land-and-expand thesis operationally. What is still missing is true
              durability proof: the public source pack does not disclose NRR, GRR, logo churn, renewal rates, contract
              length, module penetration, or top-customer concentration. Even the strongest public retention language -
              an investor quote calling the customer base highly retentive and blue-chip - comes from the company's own
              financing announcement rather than independently auditable cohort data. SupplyWolf also cautions that its
              catalog-listed capabilities and integrations require direct confirmation of current availability and
              implementation requirements. Until those metrics and implementation details surface, customer stickiness,
              deployment friction, and concentration risk remain unverified.
            claimRefs:
              - CU006
              - CU012
              - CU013
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU010
              - CU011
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real deployment proof exists in the broker workflow
            body: >-
              Highway's customer evidence is strongest where the product touches broker operations directly: named
              production use at RJ Logistics, integration-led workflow embedding, and a disclosed footprint of more than
              1,050 brokers.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU009
          - type: callout
            title: Durability remains the largest underwriting blind spot
            body: >-
              Public proof points support adoption and workflow relevance, but the pack still lacks independent churn,
              cohort, renewal, contract-length, and concentration data, so stickiness and exposure to a few large
              accounts remain open diligence items. An independent catalog additionally tells buyers to verify current
              capability and integration availability.
            calloutType: risk
            claimRefs:
              - CU012
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The most material public risk is not category demand: every retained source agrees freight fraud and
              double brokering are painful, rising problems, and Highway has won visible broker adoption by treating
              carrier identity as a continuous control layer rather than a one-time onboarding step. The harder question
              is whether investors can independently verify how strong those controls really are. Highway markets
              outcome-heavy protection claims, including qualifying-load coverage and large fraud reduction percentages,
              yet the retained public record does not disclose audit scope, incident history, uptime commitments, or
              measured false positive/false negative rates. That makes the downside case harder to price than the demand
              case.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Control, liability, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Highway's official material consistently frames fraud prevention and compliance automation as core product
              value, which is directionally positive, but it does not by itself close legal, security, or governance
              diligence. The company itself says double-brokered loads can create liability and payment losses that
              insurance does not cover, so a control miss would have customer consequences beyond ordinary SaaS
              downtime. The August 2025 minority financing also improved strategic backing and added board members, but
              public sources still do not disclose the round size, valuation, or control terms. That combination creates
              a familiar growth software risk pattern: visible momentum with incomplete downside disclosure.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR008
              - CR015
      - number: '7.3'
        title: Operational and ecosystem dependencies
        blocks:
          - type: paragraph
            body: >-
              Highway's product proposition depends on real-time data quality, continuous monitoring, and a web of
              partner integrations. The company and third parties describe a workflow that spans carrier vetting,
              compliance alerts, telematics, TMS integrations, and payments or exchange products. That breadth can
              deepen workflow lock-in, but it also means the platform has more ways to fail: stale authority or
              insurance data, broken integrations, partner policy changes, or product packaging that loses against a
              simpler rival bundle. Even brand monitoring is less clean than ideal because the generic word "Highway"
              returns unrelated open-web results, which raises noise when investors or customers try to track incidents
              and references.
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR016
      - number: '7.4'
        title: Monitoring indicators, kill criteria, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The next diligence step should focus on proving control quality, not just product breadth. Three kill
              criteria matter most. First, if management cannot provide a current security packet, named audit scope,
              incident history, and claims-performance evidence behind its marketed protection, the control moat is
              still too marketing-led for a price-sensitive investment. Second, if usage or revenue is concentrated in a
              small subset of top brokers, then a few logo losses could weaken both go-to-market proof and data-network
              density at once. Third, if major integration or payment partners account for a large share of routed
              workflow, then API or commercial changes could interrupt the very controls customers are buying. Those are
              measurable diligence paths, and they should be resolved before treating Highway's category leadership
              claims as fully underwritten.
            claimRefs:
              - CR002
              - CR005
              - CR008
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary blocker is control transparency
            body: >-
              Public sources support that Highway sells a meaningful fraud-control product, but they do not yet let an
              investor verify audit scope, incident history, or claims-performance quality with the precision needed for
              underwriting.
            calloutType: risk
            claimRefs:
              - CR002
              - CR015
          - type: callout
            title: Best diligence use of time
            body: >-
              Prioritize a security packet, fraud-loss and claims data, integration concentration by workflow volume,
              and account concentration across the top broker cohort before debating valuation.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR008
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a real company with meaningful category adoption, not a paper thesis: Highway
              publicly tied its August 2025 financing to a customer base of more than 1,050 brokers, including 70 of the
              top 100 in the U.S., and a June 2026 Transfix launch shows current workflow embed beyond Highway's own
              channels. That combination is enough to support tracking the company as a serious freight-software asset.
              It is not enough to support a priced underwriting view because the reviewed sources still do not disclose
              round size, valuation, preference terms, ARR, growth, gross margin, or retention. The right entry
              discipline is therefore evidence- sensitive: maintain a track stance until management or investors
              disclose terms and commercial quality strong enough to test whether category leadership is being converted
              into durable economics rather than just adoption claims.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Thesis, anti-thesis, and valuation context
        blocks:
          - type: paragraph
            body: >-
              The long case is grounded in category proof and workflow embed. Highway's public materials position it as
              continuous identity enforcement across the load lifecycle rather than one-time onboarding, and partner
              materials show that embed now ships inside a live TMS workflow. Strategic growth capital from FTV and Lead
              Edge, plus new board seats, adds governance signal that experienced investors see a large enough problem
              to fund product and go- to-market expansion. The anti-thesis is that this still looks like an
              evidence-light price story. Even supportive sources stop short of disclosing the amount or valuation of
              the 2025 round, and the reviewed evidence set does not provide ARR, growth, gross margin, net retention,
              or transaction take-rate data. The supportable comparable lens is therefore milestone-based rather than
              multiple-based: broker concentration, workflow integrations, investor quality, and monetization
              optionality can justify continued diligence, but not a hard valuation range from public evidence alone.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on Highway converting category leadership into a broader workflow platform with
              deeper monetization, while the base case is that the company remains strategically interesting but still
              impossible to price responsibly from public evidence. The bear case is not that demand disappears; it is
              that undisclosed round terms and missing unit economics hide overvaluation, preference overhang, or
              weaker-than-marketed commercial quality. Diligence should focus first on price and structure of the 2025
              financing, then on realized ROI, retention, and module-level monetization. Thesis-break triggers are
              straightforward and measurable: weak retention or expansion despite stated broker penetration, inability
              to prove repeatable fraud-prevention ROI, or financing terms that imply a valuation unsupported by
              disclosed growth and margin quality.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
