  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence shows Highway expanding from broker onboarding into sourcing, monitoring, exception handling, and
      partner-embedded workflows.
    data:
      items:
        - label: Evaluate carrier risk
          actor: Broker compliance and carrier-ops teams
          touchpoints:
            - Verify identity, authority, insurance, and participation before a load is accepted.
            - Highway positions Carrier Identity as a before-during-after control, not one-time onboarding.
        - label: Onboard verified carriers
          actor: Capacity and onboarding teams
          touchpoints:
            - RJ Logistics says the partnership onboarded more than 10,000 verified carriers.
            - Highway markets automation to replace email, phone, and fax-based manual checks.
        - label: Source capacity on hard lanes
          actor: Procurement and brokerage desks
          touchpoints:
            - RJ Logistics said one Highway search helped secure a 15-load Calexico project within minutes.
            - TruckX says users can search validated carriers and review compliance alerts inside partner workflows.
        - label: Monitor loads in flight
          actor: Fraud and exception-management teams
          touchpoints:
            - RJ Logistics used VIN and trailer tracking to help identify the carrier in a theft incident.
            - Highway markets continuous verification throughout the lifecycle of every load.
        - label: Expand into adjacent workflows
          actor: Operations leadership
          touchpoints:
            - Homepage ROI claims include 92% freight-fraud reduction and 90% manual-process elimination.
            - Qualifying multi-module usage is marketed with up to $100K shipment protection.
        - label: Extend geography and ecosystem reach
          actor: Broker network, partner, and cross-border teams
          touchpoints:
            - RJ Logistics plans to expand Mexico-based carrier onboarding.
            - Highway's public materials emphasize TMS, ELD, and partner integrations for broader workflow adoption.
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU009
      - CU013
