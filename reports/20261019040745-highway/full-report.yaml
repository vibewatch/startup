  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and who pays for the problem
        blocks:
          - type: paragraph
            body: >-
              The assigned sources define Highway's market more narrowly than generic transportation software or shipper
              spend. Highway's own product copy describes continuous verification of identity, authority, insurance,
              capability, and driver participation before, during, and after each load, while TruckX's partner
              description places the workflow inside broker, shipper, and logistics-provider carrier selection,
              onboarding, and compliance decisions. That means the relevant spend bucket is carrier identity, carrier
              onboarding, compliance enforcement, and fraud-loss prevention for freight brokers and 3PLs, not TMS
              replacement, insurance premiums, or the entire freight-tech stack. Highway's shipment-protection offer
              also suggests that the budget case is tied to risk mitigation and network trust, not just workflow
              convenience.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
      - number: '2.2'
        title: Public sizing evidence is strong on urgency and penetration, weak on TAM
        blocks:
          - type: paragraph
            body: >-
              The best public sizing evidence in this pool is a set of operating and adoption proxies rather than a
              clean TAM-SAM-SOM stack. Highway's August 2025 announcement, repeated by FreightWaves in 2026, says
              freight brokers manage about 30 percent of truckload spend and that Highway serves more than 1,050
              brokers, including 70 of the top 100 in the United States. Highway's Q1 2026 Freight Fraud Index adds
              direct threat-volume evidence from inside its own network, with hundreds of thousands of blocked email
              attempts and tens of thousands of spoofed phone numbers in a single quarter. Briefglance adds an
              industry-loss proxy of roughly $18 million per day and cites a 117 percent year-over-year rise in
              fraudulent email attempts. Together these signals support a real and economically relevant problem, but
              none of them disclose an independently benchmarked dollar TAM for the carrier-identity niche or a public
              CAGR for Highway's category.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM010
              - CM013
