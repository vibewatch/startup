  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct identity peer set is narrower than the broader carrier-vetting stack'
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not show a single rival matching Highway across every trust layer. Instead, it
              consistently breaks the landscape into adjacent jobs: Highway is the identity-verification specialist;
              Carrier411 and SaferWatch sit in compliance monitoring; RMIS is the insurance and certificate-management
              backbone; and MyCarrierPortal/MyCarrierPackets own digital onboarding paperwork. That matters because the
              buyer can solve the workflow with a bundle of incumbents or manual process rather than one like-for-like
              substitute. It also means Highway's true competition includes the status quo—free FMCSA-derived records
              plus internal vetting labor—not just branded software peers.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP015
