companyProfile:
  summary: >-
    Highway is a Dallas-based logistics software company founded in 2022 that sells a carrier-identity platform for
    freight brokers and 3PLs. The product centers on continuous verification, fraud prevention, onboarding, and related
    workflow controls, and the public record shows the company has reached meaningful broker adoption while remaining
    opaque on pricing, revenue, margins, and valuation.
