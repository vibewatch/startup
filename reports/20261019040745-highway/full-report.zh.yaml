  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与谁为问题买单
        blocks:
          - type: paragraph
            body: >-
              指定来源对 Highway 市场的界定，比泛化的交通软件或托运人支出更窄。Highway 自有产品文案描述了在每次货运前、运输中和完成后，持续核验身份、资质、保险、能力与司机参与情况；TruckX
              的合作伙伴介绍则将这套工作流放在经纪商、托运人和物流服务商进行承运商选择、入驻与合规决策的环节中。因此，相关支出池是货运经纪商和 3PL 的承运商身份、承运商入驻、合规执行及欺诈损失防控，而不是 TMS
              替代、保险保费或整个货运科技栈。Highway 的货运保障产品还表明，预算理由与风险缓释和网络信任有关，而不只是工作流便利性。
            claimRefs:
