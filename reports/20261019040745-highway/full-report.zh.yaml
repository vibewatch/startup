  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接身份类竞品比更广泛的承运商审核栈更窄
        blocks:
          - type: paragraph
            body: >-
              指定来源池没有显示某一家竞争对手能在所有信任维度与 Highway 完全匹配。相反，来源始终将格局拆成相邻任务：Highway 专注身份验证；Carrier411 和 SaferWatch 负责合规监测；RMIS
              是保险和证书管理骨干；MyCarrierPortal/MyCarrierPackets 掌握数字化入驻文书。买方可以用一组既有系统或人工流程解决问题，而不必购买一个一比一替代品。Highway
              的真正竞争不只是品牌软件同行，还包括现状——免费的 FMCSA 派生记录加内部审核人力。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP015
