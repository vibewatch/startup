              看多逻辑建立在品类证明和工作流嵌入上。Highway 的公开材料将其定位为覆盖货运生命周期的持续身份执行，而非一次性入驻；合作伙伴材料显示，这种嵌入已经进入实际运行的 TMS 工作流。FTV 和 Lead
              Edge 的战略成长资本，加上新增董事席位，也释放出治理信号：有经验的投资人认为问题足够大，值得为产品和 go-to-market 扩张提供资金。反方论点是，这仍像一场证据稀薄的价格故事。即使支持性来源也没有披露
              2025 年轮次的金额或估值，审阅的证据集也没有
              ARR、增长、毛利率、净留存或交易抽成率数据。因此，可支持的可比视角应以里程碑而非倍数为基础：经纪商集中度、工作流集成、投资人质量和变现选择权可以支持继续尽调，但仅凭公开证据不足以给出硬性的估值区间。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV007
