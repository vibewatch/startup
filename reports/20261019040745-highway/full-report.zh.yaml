      - number: '3.3'
        title: 定价、分发和切换成本有利于工作流既有者与嵌入式合作伙伴
        blocks:
          - type: paragraph
            body: >-
              指定来源池中的公开定价透明度很弱，这本身就说明了买方摩擦。Highway 2026 年定价证据显示，产品按报价销售，并随经纪商规模、货量和功能深度扩展；Carrier411 则公开了约每月 99
              美元的起始价格。RMIS、SaferWatch 和 MyCarrierPortal 虽出现在竞争格局中，但本池没有公开合同条款，因此买方仍需实时询价比较。分发能力强于价格透明度：Highway 强调
              TMS、ELD 和货运科技集成，TruckX 也明确通过 Highway 推销已验证承运商搜索和入驻。这种嵌入提高了切换成本，也让相邻工作流拥有者——而非从零开始的初创公司——成为指定证据中更可信的进入者类别。
            claimRefs:
              - CP009
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
              - CP015
      - number: '3.4'
        title: 持久性真实存在，但护城河仍有反弹和商品化路径
        blocks:
          - type: paragraph
            body: >-
              Highway
              的公开渗透信号强于多数私有物流软件初创公司，经纪商采用的广度也说明其身份层解决了痛点。但这条护城河并非没有代价。同一份称赞其防欺诈能力的独立比较也指出，承运商反感侵入式验证，有时会避开强制执行这类验证的经纪商；Carrier411
              则说明，既有者可能以信任数据为武器，进而引发自身反弹。实际上，Highway
              的持久性似乎较少来自对联邦数据的专有访问——比较报告称该数据对所有人公开——更多来自持续监测、工作流嵌入和网络智能。这种优势具有防御性，但如果既有者或相邻工作流平台在不制造同等承运商摩擦的情况下复制足够多的身份层能力，它也会变得脆弱。
            claimRefs:
              - CP002
              - CP011
              - CP015
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价透明度
        blocks:
          - type: paragraph
            body: >-
              公开披露对工作流和产品范围讲得很清楚，但对产品如何转化为确认收入则十分有限。独立报道称 Highway 向经纪商和 3PL 销售 B2B
              软件订阅；公司材料则显示更广的平台栈，覆盖入驻、监测、跟踪、安全发货和可信市场。这足以推断存在多个可变现模块和扩张路径，却不足以区分核心订阅收入与较新的交易相关场景。价格方面同样存在缺口：所审阅的官方及合作伙伴页面都没有公布目录定价、合同条款或折扣，因此公开记录无法把产品广度转化为
              ACV、实际收益率或收入确认质量。
            claimRefs:
