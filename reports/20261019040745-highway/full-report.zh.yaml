            body: >-
              创始人兼 CEO Jordan Graft 是公司的主要公开代表，现有证据将 Highway 的战略直接与他此前在 TriumphPay 的经历和货运支付背景联系起来。2025 年 8 月由 FTV
              Capital 领投、Lead Edge Capital 参与的战略成长投资，使治理进一步正式化；Jerome Hershey 和 Nimay Mehta
