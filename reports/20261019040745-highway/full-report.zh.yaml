              - CV012
      - number: '8.3'
        title: 情景、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 Highway
              将品类领导力转化为更广的工作流平台和更深的变现；基准情景是，公司在战略上仍有吸引力，但仅凭公开证据仍无法负责任地定价；悲观情景不是需求消失，而是未披露的轮次条款和缺失的单位经济掩盖了估值过高、优先权悬置或弱于营销的商业质量。尽调应首先聚焦
              2025 年融资的价格和结构，再看实际 ROI、留存和按模块划分的变现。论点失效触发器清晰且可衡量：在已宣称经纪商渗透率下留存或扩张疲弱、无法证明可重复的防欺诈
              ROI，或融资条款暗示的估值没有公开增长和利润率质量支撑。
            claimRefs:
