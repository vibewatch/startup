            body: >-
              公开规模证据方向上可信，但仍高度依赖代理指标。Highway 自有页面和 2025 年融资材料持续提到超过 1,050
              家经纪商客户、在美国头部经纪商中的广泛渗透，以及庞大的已验证承运商数据资产；投资人评论还补充了员工人数和拦截欺诈活动等方向性信息。这些信号说明公司确有真实运营足迹，但不能替代收入、ARR、定价或估值披露。里程碑记录也主要集中在集成以及
