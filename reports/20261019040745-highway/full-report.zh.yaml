      - number: '2.2'
        title: 公开规模证据能证明紧迫性和渗透率，但不足以支持 TAM
        blocks:
          - type: paragraph
            body: >-
              这组来源中最好的公开规模证据，是运营和采用代理指标，而不是清晰的 TAM-SAM-SOM 体系。Highway 2025 年 8 月的公告（FreightWaves 于 2026 年再次转述）称，货运经纪商管理约
              30% 的整车运输支出，Highway 服务超过 1,050 家经纪商，其中包括美国头部 100 家中的 70 家。Highway 的《2026
              年第一季度货运欺诈指数》还提供了来自自身网络的直接威胁量证据：单个季度内拦截数十万封欺诈邮件，并发现数万组伪造电话号码。Briefglance 补充了约每天 1,800
              万美元的行业损失代理指标，并引用欺诈邮件尝试同比增长 117%。这些信号共同支持一个真实且具有经济意义的问题，但都没有披露经过独立基准验证的承运商身份细分市场美元 TAM，也没有披露 Highway
              所属品类的公开 CAGR。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM010
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM008
              - CM010
      - number: '2.3'
        title: 采用驱动因素清晰，但排除风险和定价不透明限制了确定性
        blocks:
          - type: paragraph
            body: >-
              采用逻辑很直接：传统的一次性入驻无法跟上承运商状态、欺诈手法和合规要求的快速变化，因此经纪商会从持续验证和自动化中获益。合作伙伴证据进一步表明，Highway 已进入日常承运商搜索、入驻和合规提醒；Highway
              自有证明点则把减少欺诈、消除人工流程和货运保障作为购买理由。主要约束不在需求是否可见，而在市场摩擦是否可见。Overdrive 报道称，一些个体承运商认为 Highway
              主导的要求具有排他性或侵入性；这很重要，因为更严格的承运商准入既能提升经纪商信任，也可能在边缘场景压缩可用承运商供给。公开来源还没有给出目录定价、附加率或按细分市场划分的预算归属，因此仍需通过直接客户证据确认支付意愿，以及不同规模经纪商的部署摩擦。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM011
              - CM014
