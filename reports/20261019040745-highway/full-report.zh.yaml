      - number: '4.2'
        title: 公开商业 traction 与商业化信号
        blocks:
          - type: paragraph
            body: >-
              最强的公开商业信号是客户规模，而不是收入。Highway 称服务超过 1,050 家经纪商，其中包括美国头部 100 家中的 70
              家；多个来源也将该网络描述为已大到具有运营意义。即便如此，各来源对承运商侧分母的口径并未统一：一份第三方资料称监测的承运商超过 225,000 家，另一份则称在档有效保险证书对应超过 175,000
              家承运商。这些指标对分发和数据网络价值具有方向性支持，但不能互换。减少欺诈和货运保障等产品结果主张有助于说明支付意愿，却不能替代留存、附加率或利润率表现的披露。
            claimRefs:
              - CI004
              - CI005
              - CI010
      - number: '4.3'
        title: 单位经济、成本结构与服务交付含义
        blocks:
          - type: paragraph
            body: >-
              Highway 的运营嵌入程度似乎高于轻量级自助 SaaS 工具。产品承诺依赖持续承运商验证、接入 TMS 和 ELD 系统、实时提醒、文档与身份核验，             
              以及客户侧流程采用。这可能让成本结构包含较重的实施、数据、监测、支持和异常管理成本，即使软件毛利率最终很有吸引力也不例外。缺少的是从这些运营要求到财务结果的桥梁：所审阅来源没有披露
              CAC、回本期、毛利率、NRR、GRR、销售周期或客户集中度。因此，公开证据可以描述价值主张和可能的成本驱动因素，却不能说明销售效率或贡献利润经济性。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI007
              - CI008
