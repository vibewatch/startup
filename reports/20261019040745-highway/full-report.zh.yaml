      - number: '4.4'
        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              2025 年 8 月的成长股权公告提升了市场对 Highway 拥有新资本、可以继续扩大产品和 go-to-market
              覆盖的信心，独立后续报道也重复了这一增长叙事。核心财务障碍是不透明，而非明显困境：公司公告和这里审阅的独立报道都没有披露融资金额、估值、当前现金余额、             
              烧钱、债务或契约负担。投资人可以引用公司概览中的融资时间线作为背景，但仅凭公开证据，财务章节仍无法估算资金续航、下一轮融资时点或下行情景下的融资依赖。因此，本章结论是“平台可信，但投资判断所需输入不完整”，而不是对价格敏感的投资结论。
            claimRefs:
              - CI006
              - CI007
              - CI012
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 工作流证据强，价格证据弱
            body: 公开来源把产品栈和客户问题讲得很清楚，却没有披露目录定价、合同结构或实际收益率。因此，投资问题不是 Highway 是否在卖有价值的东西，而是这种价值每个经纪商账户能转化出多少收入和利润。
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
          - type: callout
            title: 新资本不等于可见的资金续航
            body: 2025 年 FTV/Lead Edge 轮次降低了近期融资担忧，但轮次规模、现金、烧钱和债务均未披露，资本充足性仍不透明。下一轮时点和下行情景下的融资依赖，仍无法被公开投资人判断。
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI012
          - type: callout
            title: 管理层尽调应聚焦转化和利润率桥接
            body: 第一轮尽调资料应索取按模块划分的 ACV、留存队列、销售周期和 CAC 数据、按产品线划分的毛利率，以及当前现金续航。没有这些桥接数据，本章可以验证市场拉力和产品广度，却不能支持效率或估值判断。
            calloutType: recommendation
