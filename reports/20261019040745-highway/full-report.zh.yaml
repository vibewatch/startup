          x: 5
          'y': 4
          detail: 在指定证据池中身份定位最深：验证实际所有者、识别调度服务、持续监控，并据报道要求提供 ELD。
        - label: Carrier411
          x: 2
          'y': 4
          detail: 监控覆盖较强且起始价格公开，但保留的证据没有显示其身份深度达到 Highway 的水平。
        - label: SaferWatch
          x: 2
          'y': 4
          detail: 相邻监控领域的现有产品，被描述为 Truckstop 旗下、支持自定义筛选规则的产品。
        - label: RMIS
          x: 2
          'y': 3
          detail: 嵌入式保险监控底座，带有入驻评分，但在保留证据中并未被定位为承运商身份领域的领先者。
        - label: MyCarrierPortal / MyCarrierPackets
          x: 1
          'y': 3
          detail: 资料包工作流专家，重点在文件、签名和同步，而非深度身份管控。
        - label: 公开数据 / 内部自建
          x: 1
          'y': 1
          detail: 免费的联邦记录层加人工流程仍是基础替代方案，但缺少持续提醒和网络情报。
    approximationNotes: 两个轴均为基于指定证据综合得出的 1–5 序数评分，不代表市场份额，也不是经过独立基准验证的产品评分。
    claimRefs:
      - CP004
      - CP005
      - CP007
      - CP008
      - CP012
      - CP014
      - CP015
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据支持以订阅为主的工作流未来可能扩展至交易收入，但桥接仍止于未披露的价格、利润率和现金指标。
    data:
      nodes:
        - id: brokers
          label: 经纪商 / 3PL 客户基础
          value: 1,050+ brokers
          note: 公开披露的客户基础构成商业化起点。
        - id: connect
          label: Connect / 入驻合规
          value: Subscription-led core
          note: 承运商身份、审查和标准执行是核心工作流。
        - id: monitoring
          label: Load Lock 和 Load Lock+
          value: Expansion module
          note: 监控、提醒和追踪拓展了可变现的工作流深度。
        - id: control
          label: Know Your Driver / 安全派单控制
          value: Identity-control layer
          note: 额外控制环节可能支持增购，但没有公开的单项定价。
        - id: exchange
          label: Trusted Freight Exchange 与支付
          value: Transaction-adjacent surface
          note: 市场和支付业务受到战略性强调，但抽成率未披露。
        - id: revenue
          label: 已确认收入
          value: Undisclosed
          note: 没有公开来源拆分披露 ACV、收入结构或确认政策。
        - id: profit
          label: 毛利与现金跑道可见性
          value: Undisclosed
          note: 毛利率、现金消耗和现金余额仍属非公开信息。
      edges:
        - from: brokers
          to: connect
          label: 初始合同
        - from: connect
          to: monitoring
          label: 模块附加
        - from: monitoring
          to: control
          label: 更深层工作流管控
        - from: control
          to: exchange
          label: 交易扩张
        - from: exchange
          to: revenue
          label: 变现
        - from: revenue
          to: profit
          label: 缺失的公开桥接
    approximationNotes: 除非明确展示已披露的公开指标，否则节点值均为定性描述；该图解释从工作流到收入的机制，不代表实测转化率。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Highway 围绕每票货运叠加承运商身份数据、经纪商工作流模块、合作伙伴嵌入和交易阶段保障。
    data:
      layers:
        - label: 身份数据层
          detail: 持续验证在整票货运生命周期内检查承运商身份、经营资质、能力、保险和司机参与情况。
          modules:
            - label: 身份验证
            - label: 资质 + 保险检查
            - label: 司机 / 调度验证
          outputs:
            - label: Qualified or flagged carrier state
        - label: 经纪商工作流应用
          detail: 公开描述的模块覆盖货源寻找、入驻、监控和经验证的市场参与。
          modules:
            - label: 识别
              displayValue: Lane Certainty + carrier discovery
            - label: Connect
              displayValue: Ownership validation + business rules
            - label: 监控
              displayValue: Real-time change alerts
            - label: Trusted Freight Exchange
              displayValue: Verified marketplace participation
          outputs:
            - label: Load-level participation decision
        - label: 嵌入式合作伙伴界面
          detail: 当 Highway 出现在经纪商已在使用的工具中时，运营证据最强。
          modules:
            - label: Transfix TMS
            - label: TruckX 集成
            - label: Logistics Plus 入驻工作流
          outputs:
            - label: In-workflow vetting and onboarding
        - label: 客户验证层
          detail: 客户证据强调其已部署在经纪商和 3PL 工作流中，而不只是停留在漏斗顶部演示。
          modules:
            - label: Logistics Plus
              displayValue: Compliance monitoring + onboarding
            - label: SEL
              displayValue: Dispatch-level validation
            - label: GIX Logistics
              displayValue: 5,000+ carriers onboarded
          outputs:
            - label: Production-use references
        - label: 有条件保障层
          detail: 官网称，合资格货运同时使用多个 Highway 控制措施时，最高可获得 $100K 保障。
          modules:
            - label: Connect
            - label: Load Lock
            - label: Secure Rate Con Delivery
          outputs:
            - label: Feature-gated shipment protection
        - label: 网络规模层
          detail: 规模主张被用作产品证明，因为更广的网络应能提升身份验证能力和合作伙伴相关性。
          modules:
            - label: 1,050+ 家经纪商
            - label: 美国前 100 大经纪商中的 70 家
            - label: 225,000+ 家已验证承运商
          outputs:
            - label: Dense broker-carrier identity graph
    approximationNotes: 这是基于保留的产品、合作伙伴和客户证据综合出的运营模型堆栈，而非公开发布的源架构。
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE008
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，Highway 正从经纪商入驻扩展到货源寻找、监控、异常处理和嵌入合作伙伴的工作流。
    data:
      items:
        - label: 评估承运商风险
          actor: 经纪商合规与承运商运营团队
          touchpoints:
            - 接受货运前，验证身份、经营资质、保险和参与情况。
            - Highway 将 Carrier Identity 定位为贯穿事前、事中和事后的控制，而非一次性入驻。
        - label: 引入已验证承运商
          actor: 运力与入驻团队
          touchpoints:
            - RJ Logistics 称，该合作已引入超过 10,000 家已验证承运商。
            - Highway 宣传以自动化取代基于邮件、电话和传真的人工检查。
        - label: 为困难线路寻找运力
          actor: 采购与经纪业务团队
          touchpoints:
            - RJ Logistics 称，一次 Highway 搜索帮助其在几分钟内拿下 Calexico 的 15 票货运项目。
            - TruckX 称，用户可在合作伙伴工作流中搜索已验证承运商并查看合规提醒。
        - label: 监控运输中的货运
          actor: 欺诈与异常管理团队
          touchpoints:
            - RJ Logistics 使用 VIN 和拖车追踪，帮助在一起盗窃事件中识别承运商。
            - Highway 宣传在每票货运的整个生命周期内持续验证。
        - label: 扩展至相邻工作流
          actor: 运营管理层
          touchpoints:
            - 官网 ROI 宣称包括货运欺诈减少 92% 和人工流程减少 90%。
            - 官网宣传称，符合条件的多模块使用可获得最高 $100K 的货运保障。
        - label: 扩展地域与生态触达
          actor: 经纪商网络、合作伙伴与跨境团队
          touchpoints:
            - RJ Logistics 计划扩大墨西哥承运商的入驻规模。
            - Highway 的公开材料强调 TMS、ELD 和合作伙伴集成，以推动更广泛的工作流采用。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU009
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，最高的剩余风险集中在控制透明度、欺诈损失暴露和集成依赖上。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 关键影响
          values:
            - null
            - label: 控制披露缺口
              note: 没有具名的公开审计范围、事故历史或正常运行时间证据
              tone: warning
            - label: 欺诈漏检 / 责任
              note: 双重经纪货运可能造成客户损失，而保险未必承保
              tone: critical
        - label: 高影响
          values:
            - null
            - null
            - label: 集成依赖
              note: TMS、ELD 和支付合作伙伴都是控制工作流的一部分
              tone: critical
        - label: 中高影响
          values:
            - null
            - label: 董事会 / 融资不透明
              note: 轮次规模和经济性仍未公开披露
              tone: warning
            - label: 大客户集中度
              note: 企业客户验证较强，但按客户划分的暴露度未公开披露
              tone: warning
        - label: 中等影响
          values:
            - label: 品牌名称歧义
              note: 通用名称增加搜索和提醒噪声
              tone: neutral
            - label: 定价压力
              note: 竞争对手宣传攻击按报价定价和基于合作伙伴的捆绑模式
              tone: warning
            - null
        - label: 中低影响
          values:
            - null
            - label: 结果指标不透明
              note: 公开材料宣传强劲结果，但未披露分母细节
              tone: warning
            - null
        - label: 低影响
          values:
            - null
            - label: 搜索噪声摩擦
              note: 由于 Highway 是通用词，监控需要更好的筛选
              tone: neutral
            - null
    approximationNotes: 矩阵位置是对保留证据的定性综合，而非建模得出的概率分布。
    claimRefs:
      - CR003
      - CR005
      - CR008
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 由于公开价格和单位经济性证据仍然缺失，建议从品类验证转为暂停投资判断。
    data:
      nodes:
        - id: scale-proof
          label: 规模验证
          detail: 1,050+ 家经纪商以及美国前 100 大经纪商中的 70 家，表明该品类已有真实采用。
          tone: positive
        - id: workflow-proof
          label: 工作流验证
          detail: Transfix 于 2026 年 6 月上线了实际运行的 TMS 嵌入，显示其当前分发渠道已超出 Highway 自有网站。
          tone: positive
        - id: capital-signal
          label: 资本信号
          detail: FTV 和 Lead Edge 投资了少数股权增长轮，并取得董事会席位。
          tone: positive
        - id: missing-price
          label: 价格缺失
          detail: 公开证据仍未披露轮次规模、估值和优先股堆叠。
          tone: risk
        - id: missing-economics
          label: 经济性缺失
          detail: ARR、增长、毛利率、留存和抽成率仍未披露。
          tone: risk
        - id: recommendation
          label: 跟踪，不买
          detail: 继续尽调，等待足以比较上行与下行的定价证据。
          tone: neutral
      edges:
        - from: scale-proof
          to: workflow-proof
          label: 采用规模加上嵌入式部署，支持真实的产品市场匹配。
        - from: workflow-proof
          to: capital-signal
          label: 战略投资者支持这一匹配。
        - from: capital-signal
          to: missing-price
          label: 但该轮融资仍缺乏公开价格透明度。
        - from: missing-price
          to: missing-economics
          label: 价格不透明又叠加了经济性披露薄弱。
        - from: missing-economics
          to: recommendation
          label: 这一缺口将立场限制在跟踪。
    approximationNotes: 节点顺序是对已披露里程碑和披露缺口的分析性综合，不代表时间顺序。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
