        title: 展示项
        blocks:
          - type: callout
            title: 即使没有清晰 TAM 数字，这个问题仍具有经济意义
            body: 买方份额、装机基数和欺诈量信号都指向一个真实且紧迫的经纪商工作流。即使公开 TAM 证据不完整，也足以支持继续就采用和定价开展尽调。
