    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Highway 是一家总部位于达拉斯、成立于 2022 年的物流软件公司，围绕货运经纪商的“Carrier Identity”构建价值主张。公司在官网、经纪商产品页和 Trusted Freight
              Exchange
              页面中，将自己定位为工作流层：用持续验证替代一次性入驻，再把这套信任模型延伸到面向经纪商与承运商的审核制市场。现有公开记录支持其聚焦经纪商的商业模式，而非面向托运人的广泛网络战略；记录也显示，Highway
              以经纪商数量、承运商记录和经纪货量覆盖等运营代理指标，替代公开财务披露。这使防欺诈直接嵌入日常订舱和承运商管理流程。
