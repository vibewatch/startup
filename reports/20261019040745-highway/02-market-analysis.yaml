          claimRefs: [CM005]
        - label: Spoofed phone numbers blocked in Q1 2026
          displayValue: "71,801"
          unit: numbers
          note: Highway network activity proxy
          claimRefs: [CM005]
        - label: Qualified-load protection ceiling
          displayValue: Up to $100K
          unit: per shipment
          note: Risk-budget framing for adoption rather than a market-size metric
          claimRefs: [CM008]
    approximationNotes: >-
      Mixed units intentionally show the best public exposure and adoption
      proxies available in the assigned pool; they are not a derived TAM-SAM-SOM
      stack.
    claimRefs: [CM003, CM004, CM005, CM008, CM010]
callouts:
  - calloutType: strength
    title: The problem is economically meaningful even without a clean TAM number
    body: >-
      Buyer-share, installed-base, and fraud-volume signals all point to a real
      and urgent workflow for brokers, which is enough to justify diligence on
      adoption and pricing even though public TAM evidence is incomplete.
    claimRefs: [CM003, CM004, CM005, CM006]
  - calloutType: risk
    title: Public market disclosure is still too thin for valuation-by-narrative
    body: >-
      The assigned sources do not disclose an independent category TAM, list
      pricing, or budget-owner detail, so valuation work still depends on direct
      customer and management diligence rather than a public market-growth story.
    claimRefs: [CM013, CM014]
