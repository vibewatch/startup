schemaVersion: report-v2
artifact: market-analysis
slug: highway
runDate: 2026-10-19
company:
  name: Highway
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Highway is operating in a narrowly defined freight-broker workflow category:
    continuous carrier identity, compliance, and fraud prevention rather than
    broad logistics software. Public evidence supports the buyer pain and
    Highway's broker penetration, but it does not disclose an independent TAM,
    pricing stack, or segment-level budget data, so market sizing remains
    evidence-constrained.
sections:
  - id: market-boundary
    title: Market boundary and who pays for the problem
    body: >-
      The assigned sources define Highway's market more narrowly than generic
      transportation software or shipper spend. Highway's own product copy
      describes continuous verification of identity, authority, insurance,
      capability, and driver participation before, during, and after each load,
      while TruckX's partner description places the workflow inside broker,
      shipper, and logistics-provider carrier selection, onboarding, and
      compliance decisions. That means the relevant spend bucket is carrier
      identity, carrier onboarding, compliance enforcement, and fraud-loss
      prevention for freight brokers and 3PLs, not TMS replacement, insurance
      premiums, or the entire freight-tech stack. Highway's shipment-protection
      offer also suggests that the budget case is tied to risk mitigation and
      network trust, not just workflow convenience.
    claimRefs: [CM001, CM002, CM008, CM009, CM012]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Public sizing evidence is strong on urgency and penetration, weak on TAM
    body: >-
      The best public sizing evidence in this pool is a set of operating and
      adoption proxies rather than a clean TAM-SAM-SOM stack. Highway's August
      2025 announcement, repeated by FreightWaves in 2026, says freight brokers
      manage about 30 percent of truckload spend and that Highway serves more
      than 1,050 brokers, including 70 of the top 100 in the United States.
      Highway's Q1 2026 Freight Fraud Index adds direct threat-volume evidence
      from inside its own network, with hundreds of thousands of blocked email
      attempts and tens of thousands of spoofed phone numbers in a single
      quarter. Briefglance adds an industry-loss proxy of roughly $18 million
      per day and cites a 117 percent year-over-year rise in fraudulent email
      attempts. Together these signals support a real and economically relevant
      problem, but none of them disclose an independently benchmarked dollar TAM
      for the carrier-identity niche or a public CAGR for Highway's category.
    claimRefs: [CM003, CM004, CM005, CM006, CM010, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: drivers-constraints
    title: Adoption drivers are clear, but exclusion risk and pricing opacity limit certainty
    body: >-
      Adoption logic is straightforward: traditional one-time onboarding misses
      fast-changing carrier status, fraud schemes, and compliance changes, so
      brokers gain from continuous verification and automation. Partner evidence
      reinforces that Highway sits in day-to-day carrier search, onboarding, and
      compliance alerts, while Highway's own proof points frame fraud reduction,
      manual-process elimination, and shipment protection as reasons to buy.
      The main constraints are not demand visibility but market-friction
      visibility. Overdrive reported that some owner-operators felt Highway-led
      requirements were exclusionary or intrusive, which matters because
      stricter carrier gating can improve broker trust while reducing available
      carrier supply at the edge cases. Public sources also do not provide list
      pricing, attach rates, or segment-specific budget ownership, so diligence
      still needs direct customer evidence on willingness to pay and deployment
      friction by broker size.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM014]
    tableRefs: [TM003]
