    claimRefs: [CM003, CM004, CM005, CM006, CM013]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Large freight brokers and 3PLs, Brokerage leadership and compliance leaders, Carrier onboarding risk and operations teams, Brokerage operating budget, Continuous carrier qualification before during and after each load, COO or operations / compliance leadership, High fraud exposure plus need to enforce a carrier standard at scale]
      - [Mid-market brokers, General manager or operations lead, Smaller onboarding and dispatch teams, Operations budget with clear ROI hurdle, Faster secure carrier onboarding and fewer manual checks, Branch or network operations leadership, Need to reduce manual steps and avoid fraud losses without adding headcount]
      - [Carrier-network participants, None as primary economic buyer, Carriers submitting identity and compliance data to win freight, Broker ecosystem rather than the carrier itself, Identity submission monitoring and exception handling, Not publicly disclosed, Broker requirements to access trusted freight opportunities]
      - [Integration partners such as TMS and ELD platforms, Product or partnership leaders at the partner plus broker sponsors, Shared users across partner and broker operations, Partner and broker commercial programs, API integration validated carrier search and compliance alert workflows, Product or partnerships budget, Need to embed carrier identity into existing logistics systems]
    notes: >-
      Buyer, user, and budget-owner roles are inferred from the assigned product,
      partner, and adverse sources because public pricing and org-chart detail
      are not disclosed.
    claimRefs: [CM002, CM003, CM009, CM011, CM014]
