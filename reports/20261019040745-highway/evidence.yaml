evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Disclosed round size, post-money valuation, ownership dilution, and board/control terms for the 2025 financing.
    whyItMatters: >-
      Without round economics and valuation, the financing is strategically important but not directly usable for
      price-sensitive underwriting.
    diligencePath: >-
      Request the financing memo, cap table, and board consents; reconcile them against investor rights and any
      secondary liquidity.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, ARR, growth, gross margin, and pricing disclosure by product or customer cohort.
    whyItMatters: >-
      Customer-count and load-coverage proxies support adoption, but they do not show monetization quality or margin
      durability.
    diligencePath: Request monthly recurring revenue bridges, pricing schedules, cohort retention, and gross-margin detail by module.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-checks
    missingEvidence: >-
      Independent adverse reporting tied specifically to litigation, regulatory scrutiny, outage history, or customer
      harm involving Highway.
    whyItMatters: >-
      The assigned pool did not retain an eligible adverse source, so silence in this chapter should not be treated as
      proof that no downside evidence exists.
    diligencePath: >-
      Run a separate legal/regulatory and incident sweep, plus broker/customer reference calls, before relying on the
      current public-risk picture.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent public TAM, SAM, SOM, or CAGR data for carrier identity and freight-fraud prevention software sold to
      freight brokers.
    whyItMatters: >-
      Without an externally benchmarked market stack, valuation upside has to rely on company execution and customer
      economics rather than category expansion assumptions.
    diligencePath: >-
      Obtain analyst market maps, broker-tech budget studies, or management/customer disclosures that quantify category
      spend and growth with clear methodology.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Public or customer-verified pricing, discounts, minimum contracts, and overage mechanics for SaferWatch, RMIS, and
      MyCarrierPortal / MyCarrierPackets.
    whyItMatters: >-
      Without comparable contract terms, the chapter can frame price transparency but cannot underwrite head-to-head
      economic switching decisions.
    diligencePath: >-
      Collect current vendor quotes, broker invoices, or procurement screenshots for each alternative and reconcile them
      to user volume assumptions.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-performance-benchmark
    missingEvidence: >-
      Independent broker-side benchmark data on fraud-loss reduction, false positives, or carrier conversion impact
      across Highway and incumbent alternatives.
    whyItMatters: >-
      The assigned evidence establishes positioning and workflow scope, but it does not prove whether Highway’s deeper
      identity controls outperform rivals economically at equal scale.
    diligencePath: >-
      Request broker procurement evaluations, third-party benchmark studies, or customer case studies that quantify
      fraud outcomes across multiple vendors.
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Contracted ACV, implementation fees, module-level price book, and realized discounting by customer segment.
    whyItMatters: >-
      Revenue quality cannot be judged from workflow breadth alone without knowing how value converts into contracted
      dollars.
    diligencePath: Request current price book, three anonymized broker contracts, and realized invoice samples by module.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-opacity
    missingEvidence: ARR, gross margin, CAC, payback, retention, expansion, and sales-cycle disclosure.
    whyItMatters: >-
      These are the core inputs needed to determine whether growth equity is scaling a durable software model or a
      service-heavy operation.
    diligencePath: >-
      Request cohort dashboard exports, gross-margin bridge by product line, and latest board KPIs for acquisition
      efficiency.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Financing amount, current cash balance, monthly burn, debt obligations, and covenant or project-finance exposure.
    whyItMatters: >-
      Without these inputs, the chapter cannot size runway or next-round dependency despite the announced 2025 equity
      round.
    diligencePath: >-
      Request cap table summary, cash waterfall, debt schedule, and monthly cash-burn report tied to the 2025 financing
      close.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: carrier-scale
    missingEvidence: >-
      A reconciled, dated definition for carrier-network scale that distinguishes monitored carriers from carriers with
      active certificates of insurance.
    whyItMatters: >-
      Network-density claims support defensibility, but inconsistent denominators reduce comparability across sources
      and periods.
    diligencePath: >-
      Ask management to define each network metric, provide the latest numerator, and map it to a dated reporting
      cadence.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: Named security attestations, SOC 2 scope, uptime/SLA history, incident disclosures, and control-testing detail.
    whyItMatters: >-
      Highway is sold as a trust and compliance layer inside brokerage workflows, so under-documented control maturity
      can hide reliability, audit, or false-trust risk.
    diligencePath: >-
      Request the latest security package, SOC reports, uptime history, incident postmortems, and product-control
      ownership map.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: module-adoption
    missingEvidence: >-
      Module-level adoption, attach rates for Identify/Connect/Monitor/Trusted Freight Exchange, and usage of
      conditioned protection features.
    whyItMatters: >-
      Public sources show breadth of surface area, but they do not show whether newer modules are broadly adopted or
      mainly roadmap-adjacent proof points.
    diligencePath: >-
      Request active customers, retained revenue, and transaction volumes by module, plus the share of broker accounts
      using protection-qualifying workflows.
    relatedQuestionRefs:
      - QE004
      - QE007
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public developer or practitioner-community signal such as repos, package metrics, API portal activity, or partner
      engineering telemetry.
    whyItMatters: >-
      The chapter brief calls for developer-signal or a proxy, but the assigned evidence pool only exposes partner pages
      and marketing-oriented product descriptions.
    diligencePath: >-
      Request API and webhook docs, changelog cadence, partner implementation metrics, and any public engineering or
      carrier-tech community engagement data.
    relatedQuestionRefs:
      - QE006
      - QE008
