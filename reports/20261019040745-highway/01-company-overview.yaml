company:
  name: "Highway"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Highway has moved quickly from a 2022 founding to a 2025 strategic growth round around a
    carrier-identity platform for freight brokers. Public evidence is strongest on product
    positioning, broker adoption proxies, and investor-backed expansion, while valuation, round
    size, and financial metrics remain undisclosed.
sections:
  - id: "identity-and-platform"
    title: "Identity, product scope, and operating footprint"
    body: >-
      Highway is a Dallas-based logistics software company founded in 2022 that centers its value
      proposition on “Carrier Identity” for freight brokers. Across its homepage, broker-specific
      product page, and Trusted Freight Exchange page, the company positions itself as a workflow
      layer that replaces one-time onboarding with continuous verification, then extends that trust
      model into a vetted marketplace for brokers and carriers. The retained public record supports
      a broker-focused business model rather than a broad shipper-facing network strategy, and it
      shows Highway using operational proxies—broker count, carrier records, and brokered-load
      coverage—in place of public financial disclosure. That embeds fraud prevention directly in
      routine booking and carrier-management workflows.
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006"]
    tableRefs: ["TO001"]
  - id: "leadership-governance-and-capital"
    title: "Leadership, governance, and capital formation"
    body: >-
      Founder and CEO Jordan Graft is the dominant public face of the business, and the retained
      evidence ties Highway’s strategy directly to his prior TriumphPay experience and freight
      payments background. Governance became more formalized with the August 2025 strategic growth
      investment led by FTV Capital and joined by Lead Edge Capital, which also added Jerome
      Hershey and Nimay Mehta to the board. That governance expansion is positive for oversight,
      but the public record still exposes limited detail on the broader executive bench, which
      leaves meaningful key-person concentration around Graft in outward-facing materials and keeps
      succession depth, functional ownership, and operating-bench redundancy largely outside public
      view.
    claimRefs: ["CO007", "CO008", "CO009", "CO012", "CO013"]
    tableRefs: ["TO002", "TO003"]
  - id: "scale-signals-milestones-and-gaps"
    title: "Scale signals, milestone cadence, and unresolved gaps"
    body: >-
      Public scale evidence is directionally credible but still proxy-heavy. Highway’s own pages
      and 2025 financing materials consistently point to more than 1,050 broker customers, broad
      penetration among top U.S. brokers, and a large verified-carrier data asset, while investor
      commentary adds directional headcount and fraud-blocking activity. Those signals indicate a
      real operating footprint, but they do not substitute for disclosed revenue, ARR, pricing, or
      valuation. The milestone record is also front-loaded around integrations and the 2025
      financing/TFX launch window, so later diligence should treat commercial scale as promising
      but still short of price-setting transparency and underwriting-grade operating disclosure.
    claimRefs: ["CO005", "CO006", "CO007", "CO010", "CO011", "CO014", "CO015", "CO016"]
    figureRefs: ["FO001"]
