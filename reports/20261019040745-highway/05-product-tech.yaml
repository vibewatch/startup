            - label: "Load Lock"
            - label: "Secure Rate Con Delivery"
          outputs:
            - label: "Feature-gated shipment protection"
        - label: "Network scale layer"
          detail: "Scale claims are used as product proof because network breadth should improve identity verification and partner relevance."
          modules:
            - label: "1,050+ brokers"
            - label: "70 of top 100 U.S. brokers"
            - label: "225,000+ verified carriers"
          outputs:
            - label: "Dense broker-carrier identity graph"
    approximationNotes: "This is an operating-model stack synthesized from retained product, partner, and customer evidence, not a published source architecture."
    claimRefs: ["CE001", "CE003", "CE006", "CE007", "CE008", "CE009", "CE011"]
callouts:
  - calloutType: "strength"
    title: "Embedded workflow distribution is the strongest product proof"
    body: "Highway looks strongest where identity checks sit directly inside brokerage operations: the retained evidence shows customer deployment at Logistics Plus and partner embeds in Transfix and TruckX rather than only a marketing homepage."
    claimRefs: ["CE007", "CE008", "CE009", "CE010"]
  - calloutType: "risk"
    title: "Control maturity is still more implied than documented"
    body: "The retained public record explains what Highway does and where it plugs in, but it still does not disclose architecture topology, security attestations, uptime evidence, or precision metrics that would let an investor underwrite technical risk rigorously."
    claimRefs: ["CE011", "CE016"]
