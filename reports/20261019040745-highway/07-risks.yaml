    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Continuous identity-data drift
        - Homepage says carrier data changes daily, and YesPress says Highway monitors more than 225000 carriers, making real-time data quality central to product value
        - High
        - High
        - Partial
        - High
        - Need measured false-positive, false-negative, and exception-rate data by module
      - - Integration breakage across TMS, ELD, and payment stack
        - TruckX and SupplyWolf describe integrations across carrier search, compliance alerts, telematics, TMS, payments, and APIs
        - Medium
        - High
        - Partial
        - Medium
        - Need partner SLAs, deprecation process, and workflow volume split by integration
      - - Competitive pricing and bundling pressure
        - FleetGen markets transparent pricing and a built-in TMS against Highway's quote-led, partner-integrated workflow
        - Medium
        - Medium
        - Early
        - Medium
        - Need win-loss reasons, packaging roadmap, and segment-level retention by product bundle
      - - Brand and monitoring noise from a generic name
        - Exact-string open-web results also surfaced an unrelated Highway Engineer government listing
        - Medium
        - Low
        - Early
        - Low
        - Need SEO, alerting, and brand-monitoring process evidence
    notes: Public evidence does not quantify outage history, exception rates, or integration criticality, so residual exposure remains directional.
    claimRefs: [CR001, CR009, CR010, CR011, CR013, CR014, CR016]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / cohort
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Large-broker installed base
        - Top-100 US brokers and broader enterprise broker cohort
        - Reference customers, network density, and category validation
        - Public claim that 70 of the top 100 US brokers use Highway; revenue concentration is not disclosed
        - A few large-account losses could weaken growth proof and the data-network narrative simultaneously
        - High
        - Broaden segment mix and expand multi-product use beyond anchor logos
        - Medium-High
      - - Workflow integrations and data partners
        - TruckX, McLeod, Tai TMS, Samsara, Motive, TriumphPay, and REST API ecosystem
        - Carrier onboarding, monitoring, load qualification, and payment-adjacent workflows
        - Multiple named partners, but no public workflow-share disclosure
        - API, policy, or commercial changes degrade verification coverage or slow rollout
        - High
        - Diversified partner set and direct integration footprint
        - Medium
      - - Capital and board sponsors
        - FTV Capital and Lead Edge Capital
        - Growth funding, strategic oversight, and board input
        - Minority round with two new board seats, but size and economics undisclosed
        - Growth targets or governance preferences diverge from control-build priorities
        - Medium
        - Sector-experienced sponsors and minority structure
        - Medium
    notes: Concentration and dependency are directional because public sources identify counterparties and logos but not exposure by revenue or workflow volume.
    claimRefs: [CR005, CR006, CR007, CR009, CR010, CR016]
figures:
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: Public evidence clusters the highest residual risk around control transparency, fraud-loss exposure, and integration dependence.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical impact
          values:
            - null
            - label: Control disclosure gap
              note: No named public audit scope, incident history, or uptime evidence
              tone: warning
            - label: Fraud miss / liability
              note: Double-brokered loads can create customer losses that insurance may not cover
              tone: critical
        - label: High impact
          values:
            - null
            - null
            - label: Integration dependency
              note: TMS, ELD, and payment partners are part of the control workflow
              tone: critical
        - label: Moderately high impact
          values:
            - null
            - label: Board / financing opacity
              note: Round size and economics remain undisclosed publicly
              tone: warning
            - label: Large-account concentration
              note: Enterprise proof is strong, but exposure by account is not publicly disclosed
              tone: warning
        - label: Medium impact
          values:
            - label: Brand ambiguity
              note: Generic name adds search and alerting noise
              tone: neutral
            - label: Pricing pressure
              note: Competitor messaging attacks quote-led pricing and partner-based bundling
              tone: warning
            - null
        - label: Moderately low impact
          values:
            - null
            - label: Outcome metric opacity
              note: Public materials market strong outcomes but not denominator detail
              tone: warning
            - null
        - label: Low impact
          values:
            - null
            - label: Search-noise friction
              note: Monitoring needs better filtering because Highway is a generic term
              tone: neutral
            - null
    approximationNotes: Matrix placement is a qualitative synthesis of retained evidence rather than a modeled probability distribution.
    claimRefs: [CR003, CR005, CR008, CR013, CR014, CR015, CR016]
