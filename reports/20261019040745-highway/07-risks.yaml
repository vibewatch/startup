    title: Regulatory / legal risk register
    columns:
      - Risk
      - Jurisdiction / vector
      - Current public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Public control-disclosure gap
        - US enterprise security, privacy, and compliance diligence
        - Official materials emphasize fraud prevention and compliance automation but the retained public set does not show named audit scope, incident history, DPA posture, or uptime commitments
        - Medium
        - High
        - Partial
        - High
        - Request the security packet, audit reports, DPA, incident log, and status-page history
      - - Fraud-detection miss / cargo-liability exposure
        - Brokered freight fraud and double brokering
        - Highway says insurance does not cover double-brokered loads, so a control miss can still leave customers with cargo, payment, and reputation losses
        - Medium
        - High
        - Partial
        - High
        - Review loss-rate data, denied claims, exception-handling playbooks, and any indemnity carve-outs
      - - Governance and financing opacity after the 2025 round
        - Board rights, capitalization, and downside visibility
        - Public sources confirm the minority round and new board seats, but not the amount, valuation, or economics
        - Medium
        - Medium
        - Partial
        - Medium
        - Request financing documents, board rights, liquidation terms, and current valuation bridge
    notes: Qualitative scores rank public downside evidence, not a legal opinion or exhaustive risk inventory.
    enumerationScope:
      coverage: sample
      basis: Curated public risk rows across control disclosure, liability, and governance topics relevant to the current underwriting debate.
    claimRefs: [CR002, CR003, CR006, CR007, CR008, CR015]
