  - FM003
- id: sizing-lenses
  title: Sizing the Category Without Pretending Precision
  body: 'The clearest explicit market-size lens in retained evidence comes from MarketsandMarkets, which projects the agentic AI security market at roughly $1.65 billion in 2026 growing to $13.52 billion by 2032 at about 42% CAGR. That is useful directional evidence, but it should not be mistaken for a fully investable SAM for Neo. A second lens is adoption timing: Neo and Bessemer cite Gartner''s estimate that agentic capabilities in enterprise applications will expand from 5% in 2025 to 40% by end-2026. A third lens is problem urgency: CyberArk reports that 68% of organizations still lack identity controls for AI systems. Together these lenses support the idea that budget formation is beginning rapidly. They do not, however, resolve how much spend will stay standalone versus migrate into bundled IAM, cloud, or AI-platform suites. Neo''s realistic SOM is therefore best framed as large enterprises already operating significant agent fleets, not the entire theoretical AI security TAM.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM024
  - CM034
  - CM035
