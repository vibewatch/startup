callouts:
- calloutType: insight
  title: This is a budget-formation market, not a settled spend pool
  body: The strongest evidence in 2026 supports problem urgency and adoption timing, not a mature purchasing template. Investors should therefore treat large TAM numbers as directional context rather than proof that every enterprise will buy a separate control plane.
  claimRefs:
  - CM004
  - CM006
  - CM007
  - CM035
- calloutType: risk
  title: Bundling risk is intrinsic to the category
  body: Incumbents already market identity, runtime, and governance features for agents. That means every startup in the space is competing not only on product quality but on whether buyers believe the problem deserves a new line item.
