company:
  name: Neo Security
chapter:
  number: 2
  title: Market Analysis
  summary: The market Neo is entering is real, fast-growing, and strategically important, but its exact boundaries remain fluid because buyers are evaluating runtime security, identity, governance, and AI control layers at once. Public evidence supports a strong growth narrative in 2026, yet still favors evidence-constrained market framing over a single broad TAM claim.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: Neo does not operate in the broadest possible “AI security” market; it sits in the narrower but faster-forming layer that governs autonomous software actions. Retained sources consistently point to a category that includes discovery of agents and AI-enabled applications, identity or ownership mapping, least-privilege access, runtime authorization, policy enforcement, audit trails, and behavior-aware protection. The boundary should therefore include agentic software control, non-human identity governance, prompt or tool misuse defense, and evidence-oriented runtime controls. It should exclude generic productivity copilots, ordinary EDR, traditional DLP, and model-hosting infrastructure unless those products explicitly govern agent behavior. The practical reason this boundary is still blurry is that many vendors market adjacent capabilities under one label. Prompt Security stretches from employee AI use to homegrown apps and MCP; Oasis frames agentic access management; Zenity frames
    decision-path governance; Palo Alto frames an end-to-end platform. Buyers are therefore choosing among overlapping control philosophies, not a single standardized product category.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM015
  - CM019
  - CM021
  - CM023
  - CM029
  tableRefs:
  - TM001
