  evidenceGaps:
  - type: missing-source
    severity: material
    topic: som
    missingEvidence: A customer-count denominator or deployment-volume dataset that would allow a real Neo-specific SAM and SOM model.
    whyItMatters: Without disclosed customer or deployment counts, sizing beyond directional lenses remains speculative.
    diligencePath: Request active customer count, evaluated enterprise pipeline, and deployment-volume distribution by segment.
    relatedQuestionRefs:
    - QM015
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: budgeting
    missingEvidence: Actual enterprise budgets, average contract values, and internal cost-avoidance or productivity justification for runtime controls.
    whyItMatters: The market can be urgent and still monetize slowly if standalone line items are not forming.
    diligencePath: Collect buyer interviews, pipeline stage data, and ACV benchmarks from management and reference customers.
    relatedQuestionRefs:
    - QM010
    - QM022
  - type: stale
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: A second independent 2026-dollar market model to triangulate MarketsandMarkets.
    whyItMatters: Single-publisher forecasts can overstate or blur category boundaries.
    diligencePath: Add another 2026 market model or budget survey before using TAM in valuation arguments.
    relatedQuestionRefs:
