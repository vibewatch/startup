  - TV005
  figureRefs:
  - FV003
  - FV005
- id: decision-logic-and-price-discipline
  title: Decision Logic, Sensitivity, and Price Discipline
  body: 'The most defensible public conclusion is not a hard target valuation but a disciplined posture. If a prospective investor can privately confirm strong pilot conversion, real production controls, and a cap table that does not already bake in near-perfect execution, Neo remains worth tracking closely and could merit participation. If the ask assumes category leadership before customer validation is visible, the right stance is caution. In simple terms, the investment can work from several paths: exceptional product proof, fast adoption in regulated enterprises, or strategic scarcity in agentic security. It can fail from several as well: slow conversion, weak referenceability, aggressive bundling, or an entry price that leaves little room for execution risk. Given that the exact valuation is not well evidenced publicly, the rational recommendation is watch rather than pass or invest outright. Investors should lean in only if private diligence improves confidence on proof and price
    simultaneously.'
  claimRefs:
  - CV025
  - CV026
