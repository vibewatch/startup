chapter:
  number: 8
  title: Valuation
  summary: 'Neo has premium inputs: elite investors, a large funding round, and exposure to one of the hottest security subcategories of 2026. But the exact valuation is not cleanly verified in retained public evidence, so the investability question hinges more on proof, execution, and price discipline than on narrative momentum alone.'
sections:
- id: recommendation-frame
  title: 'Recommendation Frame: Strong Category, Incomplete Price Discovery'
  body: 'Neo checks many boxes that typically support premium private-market pricing: strong founders, top-tier investors, large announced funding, and a category that maps directly to urgent enterprise anxiety around AI agents. If all of those inputs were paired with visible customer proof and a clearly verified mark, the company could plausibly sit near the top end of early-stage cyber valuations. The problem is price discovery. Retained public sources support the $100 million aggregate funding headline far more clearly than they support any exact current valuation. Some third-party trackers and reports imply a large Series A structure, but they do not converge on fully verifiable terms or a confirmed post-money mark. That creates a practical investment issue: Neo may still be an attractive company, yet the precision of any valuation conclusion must be lower than the precision of the category and team story. Recommendation therefore depends on whether investors can validate commercial
    proof and entry price privately, not on public narrative alone.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV031
  - CV032
