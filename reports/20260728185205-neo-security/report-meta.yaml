companyProfile:
  summary: >
    Neo Security emerged from stealth in July 2026 as a Boston-based cybersecurity company focused on
    enterprise control for AI agents and AI-enabled software. Founded by Nick Warner, Shlomi Salem,
    and Eran Shirazi, Neo positions itself as an "agentic software control" platform that inventories
    agentic software, analyzes capabilities and risk, attributes actions across human and non-human
    actors, and enforces policy before risky behavior spreads across enterprise workflows. The company
    launched with a headline $100 million funding announcement and a product narrative tightly aligned
    to growing enterprise concern about autonomous software embedded in sanctioned tools. Public evidence
    supports the category urgency and founder quality more strongly than it supports customer depth,
    commercial metrics, or a precise current valuation.
  foundedDate: "2024-01-01"
  founders:
    - name: Nick Warner
      role: Co-founder & CEO
      background: Former SentinelOne President and COO; previously held senior go-to-market roles across enterprise security.
      claimRefs: [CO006]
    - name: Shlomi Salem
      role: Co-founder & CPO
      background: Former SentinelOne detection-engineering and threat-research leader focused on endpoint and behavioral security.
      claimRefs: [CO007]
    - name: Eran Shirazi
      role: Co-founder & CTO
      background: Former EasySend co-founder with prior vulnerability-research experience in Unit 8200.
      claimRefs: [CO008]
  foundingLocation: Boston, Massachusetts, United States / Tel Aviv, Israel
  headquarters: Boston, Massachusetts, United States
  productSummary: >
    Neo sells an enterprise platform for discovering agentic software, understanding what those systems
    can access and do, attributing actions across humans and agents, and applying policy controls that
    can allow, hold, or block risky actions in real time.
  customerFocus: >
    Large enterprises, especially security-mature and regulated organizations where CISOs, SecOps,
    governance, identity, and security-architecture teams need visibility and control over AI agents.
  businessModel: >
    Likely enterprise subscription software sold through a consultative security motion with pilots,
    demos, and staged production rollout rather than a self-serve product-led model.
  stage: Series A company with large 2026 financing and active commercialization buildout.
  fundingStatus: >
    Public evidence strongly supports a $100 million total funding headline and suggests a large 2026
    Series A structure, but the exact post-money valuation and full round terms remain unresolved.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO005, CI001, CI003, CU001, CV004]
