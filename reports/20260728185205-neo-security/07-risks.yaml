  - TR004
  figureRefs:
  - FR004
- id: strategic-kill-criteria
  title: Strategic Risk Ranking, Mitigations, and Kill Criteria
  body: 'For diligence purposes, Neo’s risk profile is manageable only if the company converts conceptual leadership into operational evidence quickly. The best mitigants are straightforward in principle: publish stronger reference architectures, add named or anonymized customer proof, show measurable deployment outcomes, and clarify where the platform stops relative to customer compliance obligations. Investors should also define kill criteria in advance. The thesis should weaken materially if the company cannot produce credible customer references, if incumbent suites replicate enough functionality to flatten Neo’s differentiation, or if regulatory and liability burdens make enterprise deployments too cumbersome. Conversely, the thesis strengthens if Neo demonstrates low-friction deployment, meaningful control efficacy, and durable adoption in regulated or security-mature organizations. The company’s capital base provides room to execute, but that room should be treated as an opportunity
    to validate the thesis rather than as proof that the thesis is already validated.'
  claimRefs:
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
