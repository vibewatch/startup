- id: public-adoption-proof
  title: What the Public Record Does and Does Not Prove About Adoption
  body: Neo’s demand narrative is credible, but the proof surface is thin. The company, investors, and launch coverage repeatedly describe agentic software as a rapidly escalating enterprise problem, and investor write-ups suggest repeated conversations with CISOs influenced the company thesis. That is useful directional evidence that the category resonates with buyers. What it does not provide is named-customer validation. Retained public sources do not list reference accounts, published case studies, deployment counts, contract values, or renewal metrics. Even the Black Hat motion reads more like executive briefing and pipeline-building than public proof of production scale. The practical conclusion is not that Neo lacks customers; it is that the current evidence base supports early enterprise   interest and likely pilots better than it supports claims of broad, durable adoption. That distinction is central to customer diligence because category heat can mask how early the underlying commercial evidence still is.
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU029
  - CU030
  tableRefs:
