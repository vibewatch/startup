  - TU005
  figureRefs:
  - FU002
- id: durability-and-concentration-risks
  title: Durability, Concentration, and Why Customer Quality Matters More Than Logo Count
  body: For Neo, customer quality is more important than raw logo count in the near term. A handful of deeply engaged design partners in regulated enterprises could matter more than many shallow pilots, because the product category is still being defined. The downside is concentration risk. If early adoption is limited to a small set of sophisticated customers, roadmap influence, pricing leverage, and referenceability may all become concentrated. Durability is also unproven. Public sources do not reveal contract structure, time to deploy, usage frequency, policy hit rates, or net retention. In addition, incumbent vendors may bundle adjacent AI-governance features into larger platforms, raising the bar Neo must clear to keep expansion inside each account. Until Neo publishes stronger customer evidence, investors should assume adoption exists but remains early, selective, and   vulnerable to proof gaps. Until those proof points appear, any bullish customer narrative should be treated as directional rather than conclusive.
  claimRefs:
