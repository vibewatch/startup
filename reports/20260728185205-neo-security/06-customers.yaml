  - TU004
  figureRefs:
  - FU003
- id: deployment-and-expansion-motion
  title: How Adoption Likely Moves from Discovery to Controlled Expansion
  body: The likely customer motion begins with discovery and risk framing rather than with a self-serve trial. Enterprises first need to understand where agentic software already exists, which identities and permissions those systems inherit, and which actions require approval or blocking. That makes Neo’s initial use case diagnostic and governance-heavy. If the platform can quickly surface shadow agentic software or risky actions, the next stage is limited policy deployment on a constrained set of users, business groups, or workflows. Expansion would then depend on whether the product can reduce noise while preserving business velocity. This is a classic land-and-expand cyber motion, but it depends on strong deployment discipline. Because the product touches policy and workflow enforcement, expansion will probably   require security, IT, and business stakeholders to trust the same control model rather than only a single champion. It also means time-to-value in the pilot phase will disproportionately shape whether early accounts ever become durable references.
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU031
