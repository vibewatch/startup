chapter:
  number: 6
  title: Customers
  summary: Neo clearly targets large enterprises adopting AI agents, but the public record is still much stronger on buyer pain than on named customer proof. The chapter therefore treats customer demand as plausible and timely, while keeping adoption depth, renewal quality, and concentration exposure explicitly unresolved.
sections:
- id: customer-segments-and-buyer-map
  title: Who Neo Appears to Sell To, and Who Actually Feels the Pain
  body: 'Neo’s public materials consistently point to a narrow initial customer profile: large enterprises already deploying or evaluating AI agents across browsers, SaaS platforms, developer tools, and internal workflows. The likely economic buyer is the CISO or a senior security leader, because the product is framed as a control layer for risk, attribution, and policy. Day-to-day operators are probably SecOps, security architecture, identity, and governance teams. End users are the business and engineering groups already experimenting with agentic software. This buyer-user-payer split matters because Neo is not selling generic productivity software; it is trying to convert an emerging governance problem into a line item within enterprise security budgets.   That should improve deal size if the pain is real, but it also implies long evaluation cycles and a need for strong executive sponsorship before deployment broadens inside an account. In other words, customer quality and political backing inside the enterprise may matter more than top-of-funnel breadth during the first years of commercialization.'
  claimRefs:
