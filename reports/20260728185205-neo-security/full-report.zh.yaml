      - number: '2.5'
        title: 这种结构对 Neo 意味着什么
        blocks:
          - type: paragraph
            body: >-
              Neo 的市场吸引力在于，需求出现得足够快，绿地设计胜利仍有机会。公司不需要赢下全部 AI
              安全预算；它需要赢下那一部分已经看见智能体发现与动作级执行之间控制平面缺口的企业。话虽如此，市场拥挤且变化很快。评测清单已经列出数十家厂商，官方竞争页面也显示，运行时护栏、身份治理、发现和可审计性正变成标准话术。因此，Neo
              的机会不是“没人看见这个问题”，而是许多买家仍缺少一款产品，能把盘点、归因和执行足够干净地绑在一起并落进运营。风险在于，同样的重叠让市场变大，也让防守更难。后续章节因此应强调 Neo
              哪里真正差异化，哪里只是参与一个快速商品化的控制栈。
            claimRefs:
              - CM022
              - CM032
              - CM033
              - CM034
              - CM035
