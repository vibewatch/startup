companyProfile:
  summary: >
    Neo Security 于 2026 年 7 月从隐身状态公开亮相，是一家总部位于波士顿的网络安全公司，聚焦企业对 AI 智能体和 AI 增强软件的控制。公司由 Nick Warner、Shlomi Salem 和 Eran
    Shirazi 创立，将自身定位为“智能体软件控制”平台：盘点智能体软件，分析能力与风险，归因人类与非人类行为主体的动作，并在高风险行为扩散到企业工作流之前执行策略。公司亮相时宣布融资 $100
    million，产品叙事也紧扣企业对自主软件嵌入已获批准工具的担忧。公开证据更能支撑品类紧迫性和创始人质量，对客户深度、商业指标或当前精确估值的支撑则弱得多。
