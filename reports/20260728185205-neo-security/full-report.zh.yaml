      - number: '8.3'
        title: 哪些因素压低估值信心并抬高买贵风险
        blocks:
          - type: paragraph
            body: >-
              最清楚的限制在于，Neo 的公开证据仍更多证明赛道热度，而不是公司自身结果。保留公开资料没有披露 ARR、客户数量、净留存、毛利率或使用深度。因此，任何收入倍数逻辑都只能是假设。第二个限制是可比性。许多 2026
              年市场地图和估值评论把不同类型的 AI
              安全公司、成熟阶段和商业化状态混在一起。给一家已经跑出规模的后期公司支付的溢价，不会自动转移到刚公开亮相的创业公司身上，即便两者落在同一个大主题下。第三个限制是竞争压缩。如果大型平台在 Neo
              建立可引用证明前吸收了足够多的差异化，今天的溢价叙事可能很快过时。合在一起，这些因素都反对把未经核验的估值传闻或愿景式估值当作可投资事实。至少，投资人应要求私下尽调把客户证明、商业动能和轮次条款对齐之后，再接受前十分位价格。
            claimRefs:
