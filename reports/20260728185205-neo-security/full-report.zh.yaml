        title: 采用如何可能从发现走向受控扩张
        blocks:
          - type: paragraph
            body: >-
              客户动作很可能从发现和风险框定开始，而不是自助试用。企业首先需要理解智能体软件已经在哪里存在，这些系统继承了哪些身份和权限，哪些动作需要审批或阻断。这让 Neo
              的初始用例偏诊断和治理。如果平台能快速浮现影子智能体软件或高风险动作，下一阶段就是在一组受限用户、业务组或工作流上部署有限策略。扩张随后取决于产品能否在保住业务速度的同时降低噪音。这是典型的网络安全先落地、再扩张动作，但依赖强部署纪律。因为产品触碰策略和工作流执行，扩张很可能要求安全、IT
              和业务利益相关方信任同一控制模型，而不只是一个单一拥护者。也就是说，试点阶段的价值实现速度，会不成比例地影响早期账户能否变成耐久背书。
