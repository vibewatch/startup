            body: >-
              Neo 的发布基础设施强于典型隐身公司亮相，但证据仍远少于成熟品类领导者。官网已经有完整首页、平台叙事、关于页面、招聘板和发布新闻资料，显示公司有意包上一层企业 GTM
              外壳，而不是只放一个“即将推出”的占位页。产品信息也比许多种子期 AI 安全公司更具体：盘点、风险情报、归因、策略控制和原生执行在留存材料中反复出现。独立来源还补充了几项方向性规模信号：Neo 称首次扫描部署不到
              15 分钟，传感器很轻量，并强调知识库已编目超过 120 万个智能体工件。可是，公司仍缺少具名客户背书、收入或 ARR 披露、客户数量和独立效果基准。eWeek 提到 Neo
