  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与问责风险
        blocks:
          - type: paragraph
            body: >-
              Neo 所在品类正好处在政策环境收紧之中。使用自主软件的企业越来越需要盘点、监督、日志、问责和最小权限控制，这让 Neo 与 EU AI Act、NIST 风格治理以及政府关于智能体 AI
              采用的联合指南方向上高度一致。不过，一致不等于免疫。如果公司夸大其控制能证明什么，或客户把平台当作更广泛合规项目的替代品，一旦发生事故，责任争议可能很快浮出水面。Neo
              也发布了标准隐私和条款页面，但这些只是基础法律卫生，并不能证明公司已经解决关于代理、责任或受监管行业部署的复杂问题。由于智能体 AI 的法律框架仍在流动，Neo
              面临双重风险：买家正因为规则演化而需要帮助，但演化中的规则也会扩大尽调负担、拉长采购，并提高产品主张和文档标准。
