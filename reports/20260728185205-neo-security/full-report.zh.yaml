      - number: '2.4'
        title: 增长驱动、采用约束，以及市场仍可能令人失望的原因
        blocks:
          - type: paragraph
            body: >-
              多头逻辑很直接。AI 能力正嵌入已获批准的企业软件，制造出影子或半批准的智能体行为，传统控制读不懂。智能体可以调用工具、移动数据并自主行动，这让实时授权和事后可审计性远比静态策略文档更有价值。NIST、OWASP
              和 EU AI Act 都在不同程度上强化治理、可追溯性和风险受控部署。不过，市场约束也很清楚。买家仍需要 ROI 证明，许多人会问 Microsoft、Palo Alto、CyberArk
              或其他既有厂商能否在现有合同内解决“足够多”的问题。品类边界也很混乱：身份、DSPM、DLP、运行时测试、AI 网关和终端控制都触碰同一工作流的不同部分。因此，Security Boulevard
              的空头观点很重要：真实问题仍可能变成一组非常昂贵的功能，而不是一个耐久的独立平台市场。
            claimRefs:
