            body: >-
              公开网页研究对这个品类的商业机制意外薄弱。留存来源中很少有价格，几乎没有披露合同模型、部署费用、ACV 或竞争替换数据。这迫使比较转向架构、买家匹配和可能的部署深度，而不是标价。Neo
              最好的护城河主张是，终端原生拦截可以提供仅身份或仅 API 产品无法匹配的控制。但这条护城河有条件。如果既有厂商足够快地合并终端遥测、身份图谱和智能体编排，同样的功能可能进入更大套件。Security
              Boulevard 的批评抓住了核心空头逻辑：真实产品仍可能变成一个功能。因此，评估 Neo
              的竞争耐久性，应看生产深度证明、客户紧迫性、背书密度，以及竞争对手多快收敛到类似运行时控制叙事。实践中，最有价值的下一步尽调不是再做一次网页搜索，而是拿到近期企业评估中的真实赢单 / 输单证据，尤其是
