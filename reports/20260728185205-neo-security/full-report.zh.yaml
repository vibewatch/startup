      - number: '2.2'
        title: 估算品类规模，但不假装精确
        blocks:
          - type: paragraph
            body: >-
              留存证据中最清晰的显性市场规模视角来自 MarketsandMarkets：其预计智能体 AI 安全市场将在 2026 年约为 $1.65 billion，到 2032 年增至 $13.52
              billion，CAGR 约 42%。这是有用的方向性证据，但不应误认为 Neo 已可投资的完整 SAM。第二个视角是采用时点：Neo 和 Bessemer 引用 Gartner 估计，企业应用中的智能体能力将从
              2025 年的 5% 扩大到 2026 年底的 40%。第三个视角是问题紧迫性：CyberArk 报告称，68% 的组织仍缺少 AI
              系统身份控制。三者合在一起，支持预算正在快速形成这个判断。不过，它们没有解决多少支出会留在独立产品，又有多少会迁移进打包 IAM、云或 AI 平台套件。因此，Neo 更现实的 SOM
              应框定为已经大规模运营智能体的大型企业，而不是整个理论 AI 安全 TAM。
