            body: >-
              Neo 的公开信任故事体面但不完整。公司有法律和隐私页面，产品文案扎根治理语言，叙事也能很好映射到 NIST 和 OWASP 风格框架。这说明公司理解企业买家如何思考 AI
              风险。但这不等于公开记录证明了质量。留存来源没有披露公开认证、基准测试结果、误报率、策略调优平均耗时或真实生产性能数据，也没有展示公开集成目录、公开 API
              参考或参考架构包。这种不对称很重要。早期网络安全公司常先带着出色的概念框架发布，然后才积累足够现场证据来支撑每一项运营主张。因此，Neo
              看起来已成熟到可以销售和演示，但从证据角度仍处早期。缺失的证明并不致命，却应压低相对于既有厂商的就绪度说法，并让尽调继续聚焦实施深度。
