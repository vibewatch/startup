  - number: 4
    title: 财务状况
    sections:
      - number: '4.1'
        title: 收入模型：真正能推断什么
        blocks:
          - type: paragraph
            body: >-
              公开证据没有披露收入、ARR、预订额或客户数量。即便如此，Neo 的商业表面并不随机。公司面向 SecOps 团队营销，提供演示，运行 ROI
              计算器，并使用企业治理话术，而不是消费级产品采用语言。这一组合强烈指向企业订阅模型：通过高接触评估销售，而不是自助
              SaaS。模型里也可能包含实施、集成或策略调优服务，尤其是运行时控制常常需要贴合客户特定工作流和审批。不过，公开记录没有披露服务收入是否有意义，还是只是支持性部分。因此，核心结论是方向性的：Neo
              看起来像一家有企业合同野心的安全软件公司，而不是纯按用量计费的 API 产品。订阅、服务和任何消耗型元素之间的精确平衡，仍是影响收入质量、利润率结构和续约行为的尽调缺口。
