      - number: '1.3'
        title: 融资结构、投资方，以及经济利益归属
        blocks:
          - type: paragraph
            body: >-
              资本结构里最重要的尽调发现是：标题清楚，结构不清楚。Neo 官方发布稿以及多家转载称，公司在隐身期后携 $100M 融资亮相，投资方包括 Andreessen Horowitz 和 Bessemer
              Venture Partners，Craft Ventures 与 Merlin Ventures 参投。Calcalist、Fundraise Insider 和 Seedtable 的独立报道则把总额拆成
              2025 年 $25 million 种子轮和 2026 年 7 月 $75 million Series
              A。总披露资本方向上可以对上，但形式并不一致；差异很重要，因为阶段标签会影响稀释预期、治理权，以及投资人如何激进地给 GTM 成熟度定价。股东图谱其余部分很强：a16z 和 BVP 提供品牌，Craft
              补上企业软件模式识别，Merlin 带来网络安全渠道杠杆，Calcalist 还列出多位以色列网络安全生态的知名天使投资人。不过，留存公开来源没有披露精确投后估值、清算优先权、董事会权利或二级流动性。
