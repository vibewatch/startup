      - number: '8.4'
        title: 决策逻辑、敏感性与价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开层面最稳妥的结论不是给出硬估值目标，而是保持有纪律的姿态。如果潜在投资人能私下确认强试点转化、真实生产控制，以及尚未把近乎完美执行计入价格的股权结构，Neo
              仍值得密切跟踪，也可能值得参与。如果要价在客户验证可见之前就假设赛道领导地位，正确姿态就是谨慎。简单说，这笔投资有几条成立路径：出色的产品证明、受监管企业的快速采用，或 agentic security
              的战略稀缺性。失败路径也有几条：转化慢、客户背书弱、既有厂商激进打包，或进入价格几乎不给执行风险留空间。鉴于精确估值缺少充分公开证据，理性建议是观察，而不是直接放弃或投资。只有私下尽调同时提升对证据和价格的信心，投资人才应加码推进。
            claimRefs:
