        - from: m4
          to: m5
  - id: FV001
    type: flow
    layout: wide
    slug: recommendation-logic
    title: 建议逻辑
    summary: 建议更取决于价格核验和客户证据，而不是单靠品类热度。
    approximationNotes: 流程总结的是投资逻辑，而不是公司发布的流程。
    claimRefs:
      - CV001
      - CV006
      - CV025
      - CV026
      - CV027
    data:
      nodes:
        - id: v1
          label: 品类和团队都强
          type: start
        - id: v2
          label: 验证客户证据
          type: decision
        - id: v3
          label: 验证本轮价格和条款
          type: decision
        - id: v4
          label: 评估差异化耐久性
          type: step
        - id: v5
          label: 投资或继续观察
          type: end
      edges:
        - from: v1
          to: v2
        - from: v2
          to: v3
        - from: v3
          to: v4
        - from: v4
          to: v5
  - id: FV002
    type: bar
    layout: standard
    slug: valuation-sensitivity
    title: 估值敏感性
    summary: 承保判断对证据、价格和差异化耐久性最敏感。
    approximationNotes: 数值是方向性敏感度分数，不是建模回报。
    claimRefs:
      - CV023
      - CV024
      - CV028
      - CV038
    data:
      items:
        - label: 客户证据
          value: 5
        - label: 价格 / 条款清晰度
          value: 5
        - label: 差异化耐久性
          value: 4
        - label: 市场热度
          value: 3
        - label: 资本基础
          value: 2
  - id: FV003
    type: range
    layout: standard
    slug: valuation-range
    title: 估值 / 回报区间
    summary: 公开证据只能支撑宽泛的情景区间，不能支撑精确的当前估值标记。
    approximationNotes: 区间是以 $M 股权价值表示的分析情景带，不是观察到的市场估值标记。
    claimRefs:
      - CV004
      - CV017
      - CV018
      - CV029
    data:
      items:
        - label: 保守情景
          low: 250
          high: 450
          point: 350
          unit: $M
        - label: 基准情景
          low: 450
          high: 800
          point: 625
          unit: $M
        - label: 高溢价执行情景
          low: 800
          high: 1200
          point: 1000
          unit: $M
  - id: FV004
    type: kpi
    layout: wide
    slug: market-context-kpis
    title: 市场背景指标
    summary: 市场环境仍有利于 AI-native 安全融资，但资金挑选度很高。
    approximationNotes: 指标总结的是已留存市场评论，应按方向性理解。
    claimRefs:
      - CV010
      - CV011
      - CV013
      - CV014
    data:
      items:
        - label: Neo 头部融资
          value: 100
          unit: $M
          trend: up
          claimRefs:
            - CV002
        - label: 2026 年投资人挑选度
          value: high
          trend: flat
          claimRefs:
            - CV011
        - label: 客户证据可见度
          value: low
          trend: flat
          claimRefs:
            - CV017
        - label: 战略品类热度
          value: high
          trend: up
          claimRefs:
            - CV010
  - id: FV005
    type: matrix
    layout: wide
    slug: risk-reward-matrix
    title: 风险 / 回报决策矩阵
    summary: 只有证据和价格纪律一起改善，上行空间才高。
    approximationNotes: 矩阵是由公开证据推导出的决策辅助工具。
    claimRefs:
      - CV021
      - CV025
      - CV027
      - CV030
    data:
      columns:
        - 上行潜力
        - 当前信心
        - 需要私下尽调
      rows:
        - label: 团队与品类质量
          values:
            - 高
            - 中
            - 中
        - label: 商业证据
          values:
            - 高
            - 低
            - 高
        - label: 价格纪律
          values:
            - 高
            - 低
            - 高
        - label: 战略稀缺性
          values:
            - 中
            - 中
            - 中
