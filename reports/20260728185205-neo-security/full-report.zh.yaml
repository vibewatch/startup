  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: Neo 看起来卖给谁，以及谁真正感到痛
        blocks:
          - type: paragraph
            body: >-
              Neo 的公开材料一致指向一个狭窄的初始客户画像：已经在浏览器、SaaS 平台、开发者工具和内部工作流中部署或评估 AI 智能体的大型企业。经济买家很可能是 CISO
              或高级安全负责人，因为产品被定位为风险、归因和策略的控制层。日常运营者大概率是 SecOps、安全架构、身份和治理团队。终端用户则是已经在试验智能体软件的业务和工程团队。这个买家-用户-付款方分裂很重要，因为
              Neo
              卖的不是通用效率软件；它试图把一个新兴治理问题转化成企业安全预算中的一条项目。如果痛点真实，这应会提升交易规模，但也意味着评估周期长，并且部署在账户内扩大前需要强有力的高层支持。换句话说，在商业化最初几年，企业内部的客户质量和政治背书可能比漏斗顶部宽度更重要。
