      - number: '2.3'
        title: 买家细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              最可能的早期买家，是大型企业里的 CISO、身份负责人、安全架构师和平台安全团队。Composio 的治理材料以及多家竞争厂商都强调认证、权限、可观测性、审批流和集中日志，这些不是业务线职责。日常用户大概率横跨
              SecOps 分析师、IAM 工程师、AppSec 团队和治理职能；他们需要弄清谁发起了动作、调用了什么工具，以及该动作本应被允许还是拦下。采用路径看起来也会分阶段。发现和影子 AI
              控制是最容易切入的楔子，因为它们能快速给出可见资产盘点。运行时授权、爆炸半径分析和工具调用治理，则是更难但更有战略价值的第二阶段，因为它们需要更深入的策略定义和更高的运营信任。预算常会分散在安全、身份、数据和
              AI 治理项目之间，所以即使技术问题显而易见，销售周期也可能充满教育和政治协调。
