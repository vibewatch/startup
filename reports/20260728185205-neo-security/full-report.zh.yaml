  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 谁真正与 Neo 竞争
        blocks:
          - type: paragraph
            body: >-
              Neo 的竞争集合比一张 AI 安全初创公司名单更宽。独立格局来源、厂商清单和官方竞品页面都显示，今天至少有三类玩家相互重叠。第一类是 Prompt Security、Noma、Zenity、Oasis 和
              Astrix 等初创专精玩家，它们直接面向 AI 智能体安全或相邻的非人类身份控制营销。第二类是 Microsoft、Palo Alto Networks，以及很可能包括 CyberArk 和
              CrowdStrike 的大型平台，它们能把既有遥测和分发延伸到同一预算讨论。第三类是出现在评测清单里的更广义 AI 安全或测试厂商，但它们未必会在每一笔控制平面交易中正面竞争。这意味着，比较 Neo
              时应按功能，而不只是按标签。它最直接属于运行时治理和控制平面子群，而不是整个 AI 安全宇宙。这个细微差别很重要，因为宽泛厂商数量会让市场看起来比 Fortune 500 CISO 实际使用的短名单更拥挤。
