              人。这个组合意味着烧钱在上行，而不是下降。公司似乎在利用资本加速市场捕获，趁品类仍在成型时抢占位置。如果产品市场匹配真实、部署深度也被证明可防守，这样做可以理性；但如果客户转化落后于招聘节奏，或打包既有厂商比预期更快压平定价权，风险就会上升。
