      - number: '7.2'
        title: 运营、产品与安全失效风险
        blocks:
          - type: paragraph
            body: >-
              最重要的产品风险不是 Neo
              有没有连贯故事；它有。风险在于，面向智能体软件的控制平面能否在真实企业环境中足够准确地工作，以至于可以被信任来做审批和阻断决策。误报可能拖慢业务工作流，漏报则可能制造危险的控制幻觉。终端驻留或重遥测架构也可能带来部署摩擦、性能担忧或集成复杂度，这些问题只有试点之后才会显现。公开证据尚未披露基准、调优工作量、检测覆盖或大规模参考架构，因此投资人无法独立验证产品在压力下如何表现。提示词注入、策略绕过和过度授权智能体模式也意味着，威胁面会和客户采用一样快地移动。实践中，Neo
              必须证明，即便底层软件生态快速变化，它也能保持覆盖最新、决策可理解、运营者负担可控。
