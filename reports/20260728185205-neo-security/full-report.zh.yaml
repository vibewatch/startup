      - number: '1.5'
        title: 不利信号，以及仍然重要的事实缺口
        blocks:
          - type: paragraph
            body: >-
              空头逻辑从品类耐久性开始。Security Boulevard 的怀疑并不是说 Neo 没有真实问题，而是网络安全里的真实问题，一旦平台厂商反应过来，常会被压缩成一组功能。这个风险在这里尤其相关，因为
              CyberArk、Microsoft、Palo Alto Networks 等既有厂商已经把身份、云和 AI
              控制延伸到智能体行为。第二个风险是，公开证据里的硬运营事实仍然稀薄：客户名称、收入质量、董事会结构和精确估值，在留存一手来源中都缺席。就连人员规模和轮次结构，也会因追踪平台和新闻报道而不同。第三个风险是集中度。公开品牌高度绑定三位创始人，运营模式看起来又分布在波士顿领导层和以色列研发之间；这种组合可以很好运转，但也集中了承压执行和人才风险。因此，Neo
              在战略上很容易理解，运营层面却仍披露不足。
