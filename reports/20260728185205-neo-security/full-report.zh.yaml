      - number: '1.2'
        title: 创始人、领导层与运营足迹
        blocks:
          - type: paragraph
            body: >-
              一家刚公开发布的公司，能讲出这样完整的公开领导层故事并不常见。Nick Warner 带来 SentinelOne 的 GTM 与规模化叙事，Shlomi Salem 带来深厚的检测工程和威胁研究可信度，Eran
              Shirazi 则补上企业软件和漏洞研究经验。这个组合让 Neo
              的创始人-市场匹配看起来站得住，因为它切入的品类位于终端、身份和应用控制之间，而不是某个旧有孤岛内部。公开证据还显示，公司早期采用双足迹模式：波士顿似乎承担运营和公司职能，Neo 招聘页与 Calcalist
              报道则都指向以特拉维夫为中心的以色列工程团队。截至报告运行日，同一招聘板显示 37
              个开放岗位，覆盖研发、销售、运营、财务和市场，说明公司正从精英创始人主导的设计阶段，进入更宽的组织搭建阶段。仍然缺失的是公开董事会图谱、创始三人以下的接班深度，以及任何正式治理结构披露。
