            body: >-
              Neo 的需求叙事可信，但证据表面很薄。公司、投资人和发布报道反复把智能体软件描述为快速升级的企业问题，投资人文章也暗示与 CISO
              的多轮交流影响了公司论点。这是有用的方向性证据，说明品类能引起买家共鸣。但它没有给出具名客户验证。留存公开来源没有列出参考客户、已发布案例、部署数量、合同金额或续约指标。即便 Black Hat
              动作，也更像高管简报和管线搭建，而不是公开生产规模证明。实际结论不是 Neo
              没有客户；而是当前证据更能支持早期企业兴趣和可能试点，不足以支撑广泛、耐久采用的说法。这个区分是客户尽调的核心，因为品类热度会掩盖底层商业证据仍有多早。
