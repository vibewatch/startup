        title: 产品模块，以及 Neo 试图解决的用户任务
        blocks:
          - type: paragraph
            body: >-
              Neo 的产品页面对平台要完成的任务讲得异常明确。核心闭环从盘点开始：智能体、模型、技能、MCP 服务器、扩展以及其他软件工件都在范围内。随后进入态势和能力分析，回答这些工件能访问什么、配置是否安全。接着 Neo
              强调归因，这很重要，因为自主软件可能通过有效用户会话行动，看起来像正常行为。最后，系统在数据移动之前执行策略：放行、阻断或暂缓动作以待审批。落到实践中，这个平台是为 SecOps
              和治理团队打造的，他们既想让采用继续推进，又不想交出控制。因此，这个产品不像提示词防火墙，更像企业智能体工作流的运营控制层。同一套语言在多个公开页面中保持一致，本身就是有用的成熟度信号。
