  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Neo 并不处在最宽泛的“AI 安全”市场，而是落在一个更窄、但正在更快成型的层级：治理自主软件动作。留存来源一致指向一个品类，覆盖智能体和 AI
              增强应用发现、身份或归属映射、最小权限访问、运行时授权、策略执行、审计轨迹，以及感知行为的防护。因此，边界应纳入智能体软件控制、非人类身份治理、提示词或工具滥用防御，以及以证据为核心的运行时控制；应排除通用效率助手、普通
              EDR、传统 DLP 和模型托管基础设施，除非这些产品明确治理智能体行为。这个边界之所以仍然模糊，实际原因在于许多厂商把相邻能力放在同一标签下营销。Prompt Security 从员工 AI
              使用延伸到自研应用和 MCP；Oasis 讲智能体访问管理；Zenity 讲决策路径治理；Palo Alto 讲端到端平台。买家因此是在重叠的控制哲学之间选择，而不是在一个标准化单一产品品类里采购。
