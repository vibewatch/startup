    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围，以及公司实际在卖什么
        blocks:
          - type: paragraph
            body: >-
              Neo 于 2026 年 7 月公开发布，是一家围绕其所谓“智能体软件控制”打造的网络安全厂商。无论是发布新闻稿、官网首页还是平台页面，公司都反复把核心问题界定为：不是传统恶意软件拦截，也不是 API
              态势管理，而是对已获批准企业工具内部运行的自主软件做实时治理。这个区分很关键。Neo 试图站在操作系统边界之上，进入软件层：智能体、浏览器扩展、MCP 服务器、嵌入式模型和 AI
              增强应用都可以带着有效用户权限行动。因此，商业承诺不只是看见哪个二进制文件在运行，而是看见这类软件能做什么、能触碰哪些数据、此刻正试图执行什么动作。Neo
              自身文案也强调原生执行、归因和态势分析，说明它要做的是面向 SecOps 买家的控制平面，而不是狭窄的开发者插件或可观测性小组件。
