              的客户质量比原始客户标识数量更重要。少数几个受监管企业中的深度参与设计伙伴，可能比大量浅试点更有价值，因为产品品类仍在被定义。下行风险是集中度。如果早期采用局限于一小群成熟客户，路线图影响力、定价杠杆和可背书性都可能集中。耐久性也未被证明。公开来源没有披露合同结构、部署时间、使用频率、策略命中率或净留存。此外，既有厂商可能把相邻
