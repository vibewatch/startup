  foundingLocation: Boston, Massachusetts, United States / Tel Aviv, Israel
  headquarters: Boston, Massachusetts, United States
  productSummary: >
    Neo sells an enterprise platform for discovering agentic software, understanding what those systems can access and
    do, attributing actions across humans and agents, and applying policy controls that can allow, hold, or block risky
    actions in real time.
  customerFocus: >
    Large enterprises, especially security-mature and regulated organizations where CISOs, SecOps, governance, identity,
    and security-architecture teams need visibility and control over AI agents.
  businessModel: >
    Likely enterprise subscription software sold through a consultative security motion with pilots, demos, and staged
    production rollout rather than a self-serve product-led model.
  stage: Series A company with large 2026 financing and active commercialization buildout.
