      - number: '1.4'
        title: Scale Signals, Milestones, and What Is Proven So Far
        blocks:
          - type: paragraph
            body: >-
              Neo has more launch infrastructure than a typical stealth exit, but still much less proof than a mature
              category leader. Its site already includes a developed homepage, platform narrative, about page, careers
              board, and launch newsroom assets, which signals a deliberate enterprise go-to-market wrapper rather than
              a “coming soon” placeholder. The product message is also more specific than many seed-stage AI-security
              companies: inventory, risk intelligence, attribution, policy control, and native enforcement appear
              repeatedly across the retained materials. Independent sources add several directional scale signals: Neo
              claims first-scan deployment in under fifteen minutes, says the sensor is lightweight, and highlights a
              knowledge base with over 1.2 million cataloged agentic artifacts. Yet the company still lacks named
              customer references, revenue or ARR disclosure, customer count, and independent efficacy benchmarks.
              eWeek’s note that Neo has tested with sensitive-sector organizations without naming them is useful, but it
              is still pre-proof relative to what later chapters will need for customer and financial conviction.
            claimRefs:
