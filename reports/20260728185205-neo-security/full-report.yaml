  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Who Actually Competes With Neo
        blocks:
          - type: paragraph
            body: >-
              The competitive set is broader than a simple list of AI-security startups. Independent landscape sources,
              vendor lists, and official competitor pages all show at least three overlapping cohorts today. First are
              startup specialists such as Prompt Security, Noma, Zenity, Oasis, and Astrix that market directly into
              AI-agent security or adjacent non-human identity control. Second are large platforms such as Microsoft,
              Palo Alto Networks, and likely CyberArk and CrowdStrike that can extend existing telemetry and
              distribution into the same budget conversation. Third are broader AI-security or testing vendors that
              appear in review lists but may not actually compete head-to-head for every control-plane deal. This means
              Neo should be compared by function, not just by label. It is most directly in the runtime-governance and
              control-plane subgroup, not the entire AI-safety universe. That nuance matters because broad vendor counts
              make the market look more crowded than the actual shortlist a Fortune 500 CISO may use.
            claimRefs:
              - CP001
              - CP011
