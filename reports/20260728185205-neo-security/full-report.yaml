      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Neo is competing in a market where everyone sounds like a platform
            body: >-
              The biggest danger in this chapter is taking vendor messaging at face value. Nearly every competitor
              claims some combination of discovery, governance, runtime security, and compliance. The real question is
              which vendor can operationalize those claims fastest inside existing enterprise workflows.
            calloutType: risk
            claimRefs:
              - CP022
              - CP023
              - CP025
          - type: callout
            title: Distribution may matter more than feature checklists
            body: >-
