      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The most plausible early buyers are CISOs, identity leaders, security architects, and platform-security
              teams at large enterprises. Composio's governance materials and several competitive vendors all emphasize
              authentication, permissions, observability, approval flows, and centralized logging, which are not
              line-of-business responsibilities. Day-to-day users will likely span SecOps analysts, IAM engineers,
              appsec teams, and governance functions that need to understand who initiated an action, what tool was
              called, and whether the action should have been allowed. The adoption path also appears staged. Discovery
              and shadow-AI control are the easiest opening wedge because they provide visible inventory fast. Runtime
              authorization, blast-radius analysis, and tool-call governance are the harder but more strategic second
              phase because they require deeper policy definition and more operational trust. Budget will often be
              fragmented across security, identity, data, and AI-governance programs, which means sales cycles can be
              educational and political even when the technical problem is obvious.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
              - CM025
              - CM030
