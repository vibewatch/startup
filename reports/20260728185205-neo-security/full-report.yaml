  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Accountability Risks
        blocks:
          - type: paragraph
            body: >-
              Neo’s category sits directly inside a tightening policy environment. Enterprises using autonomous software
              increasingly need inventories, oversight, logging, accountability, and least-privilege controls, which
              makes Neo directionally well aligned with the EU AI Act, NIST-style governance, and joint government
              guidance on agentic AI adoption. Alignment, however, is not immunity. If the company overstates what its
              controls can prove, or if customers rely on the platform as a substitute for broader compliance programs,
              responsibility disputes could emerge quickly after an incident. Neo also publishes standard privacy and
              terms surfaces, but those are baseline legal hygiene rather than evidence that the company has solved
              complex questions about agency, liability, or regulated-sector deployment. Because agentic AI remains
              legally fluid, Neo faces a double risk: buyers want help precisely because the rules are evolving, yet
              evolving rules can also widen diligence burdens, lengthen procurement, and raise the standard for product
              claims and documentation.
