      - number: '3.2'
        title: 'Startup Specialists: Breadth, Depth, and Where Neo Sits Among Them'
        blocks:
          - type: paragraph
            body: >-
              Among startup specialists, Neo’s strongest relative claim is depth around endpoint-anchored interception
              and action control. Prompt Security presents a broader AI-security umbrella spanning employee use,
              homegrown AI apps, code assistants, MCP, and agentic AI, which may open more doors but can also disperse
              focus. Noma appears closer to Neo on runtime and guardrail language, especially around blast-radius
              analysis and production enforcement. Zenity likewise focuses on the decision path of agents, arguing that
              the security problem cannot be reduced to one legacy category. Oasis and Astrix occupy more
              identity-centric ground, mapping non-human identities, permissions, and least-privilege access. That makes
              them meaningful alternatives inside identity-led buying motions but somewhat different from Neo’s stated
              software-control loop. Overall, Neo is neither alone nor generic: it sits in the subset of startups trying
              to make runtime governance and attribution operational enough for enterprise deployment.
