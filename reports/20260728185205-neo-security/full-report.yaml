      - number: '2.5'
        title: What This Structure Means for Neo Specifically
        blocks:
          - type: paragraph
            body: >-
              For Neo, the market is attractive because the need is emerging quickly enough that greenfield design wins
              are still possible. The company does not need to win the whole AI security budget; it needs to win the
              subset of enterprises that already see a control-plane gap between agent discovery and action-level
              enforcement. That said, the market is crowded and moving fast. Review lists already contain dozens of
              vendors, while official competitor pages show that runtime guardrails, identity governance, discovery, and
              auditability are becoming standard language. Neo's opportunity is therefore not that no one else sees the
              problem, but that many buyers still lack a product that ties inventory, attribution, and enforcement
              together cleanly enough to operationalize. The risk is that the same overlap that makes the market large
              also makes it difficult to defend. Later chapters should therefore emphasize where Neo is genuinely
              differentiated versus where it is simply participating in a rapidly commoditizing control stack.
            claimRefs:
              - CM022
              - CM032
              - CM033
              - CM034
              - CM035
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a budget-formation market, not a settled spend pool
            body: >-
              The strongest evidence in 2026 supports problem urgency and adoption timing, not a mature purchasing
              template. Investors should therefore treat large TAM numbers as directional context rather than proof that
              every enterprise will buy a separate control plane.
            calloutType: insight
            claimRefs:
