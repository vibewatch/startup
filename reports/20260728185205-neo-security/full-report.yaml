companyProfile:
  summary: >
    Neo Security emerged from stealth in July 2026 as a Boston-based cybersecurity company focused on enterprise control
    for AI agents and AI-enabled software. Founded by Nick Warner, Shlomi Salem, and Eran Shirazi, Neo positions itself
    as an "agentic software control" platform that inventories agentic software, analyzes capabilities and risk,
    attributes actions across human and non-human actors, and enforces policy before risky behavior spreads across
    enterprise workflows. The company launched with a headline $100 million funding announcement and a product narrative
    tightly aligned to growing enterprise concern about autonomous software embedded in sanctioned tools. Public
    evidence supports the category urgency and founder quality more strongly than it supports customer depth, commercial
    metrics, or a precise current valuation.
  foundedDate: '2024-01-01'
  founders:
    - name: Nick Warner
