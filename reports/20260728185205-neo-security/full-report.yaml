              agents actually do inside trusted software. Neo’s own material supports that view with language about
              native enforcement, real-time action control, and software behavior inside already approved applications.
              The likely control chain is: endpoint telemetry captures what software and agentic components are present;
              Neoverse enriches those observations with contextual knowledge; capability and risk analysis surfaces what
              the software can do; policy logic maps allowed, blocked, or held actions; and attribution plus routing
              preserve the evidence for downstream SOC workflows. That model is well aligned with agentic risks centered
              on tool use, privilege inheritance, and hidden actions inside approved applications. Whether it is
