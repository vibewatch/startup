chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and What the Company Is Actually Selling
        blocks:
          - type: paragraph
            body: >-
              Neo launched publicly in July 2026 as a cybersecurity vendor built around what it calls “Agentic Software
              Control.” Across its launch release, homepage, and platform pages, the company repeatedly frames the core
              problem not as classic malware prevention or API posture management, but as real-time governance of
              autonomous software operating inside already approved enterprise tools. That distinction matters. Neo is
              trying to sit above the operating-system boundary and inside the software layer where agents, browser
              extensions, MCP servers, embedded models, and AI-enabled applications can act with valid user permissions.
              The commercial promise is therefore not simply visibility into what binary is running, but visibility into
              what that software can do, what data it can touch, and what action it is attempting right now. The
              company’s own copy also emphasizes native enforcement, attribution, and posture analysis, implying a
              control plane product meant for SecOps buyers rather than a narrow developer plug-in or observability
              widget.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO012
              - CO014
              - CO028
