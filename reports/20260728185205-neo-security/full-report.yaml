          - type: callout
            title: Public proof is still the single biggest cross-cutting weakness
            body: >-
              Regulatory alignment, market timing, and funding are all directionally favorable, but they cannot
              substitute for evidence that the product works reliably in live enterprise environments and can scale
              commercially.
            calloutType: risk
            claimRefs:
              - CR018
              - CR020
              - CR027
              - CR036
          - type: callout
            title: The risk thesis is mitigable if Neo validates quickly
            body: >-
              Most major risks can be reduced through stronger references, better deployment evidence, and clearer
              product-boundary documentation. The capital base gives the company time to attempt that validation.
            calloutType: strength
            claimRefs:
              - CR026
              - CR028
              - CR029
              - CR040
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation Frame: Strong Category, Incomplete Price Discovery'
        blocks:
          - type: paragraph
            body: >-
              Neo checks many boxes that typically support premium private-market pricing: strong founders, top-tier
              investors, large announced funding, and a category that maps directly to urgent enterprise anxiety around
              AI agents. If all of those inputs were paired with visible customer proof and a clearly verified mark, the
              company could plausibly sit near the top end of early-stage cyber valuations. The problem is price
              discovery. Retained public sources support the $100 million aggregate funding headline far more clearly
              than they support any exact current valuation. Some third-party trackers and reports imply a large Series
              A structure, but they do not converge on fully verifiable terms or a confirmed post-money mark. That
              creates a practical investment issue: Neo may still be an attractive company, yet the precision of any
              valuation conclusion must be lower than the precision of the category and team story. Recommendation
              therefore depends on whether investors can validate commercial proof and entry price privately, not on
              public narrative alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV031
              - CV032
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV025
              - CV026
              - CV027
              - CV040
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV017
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV025
              - CV026
              - CV027
      - number: '8.2'
        title: What Could Support a Premium Valuation Anyway
        blocks:
          - type: paragraph
            body: >-
              There are real reasons the market could award Neo a premium multiple or strategic premium despite limited
              public operating data. In 2026, cyber capital remains concentrated in perceived outliers, and agentic AI
              security is attracting disproportionate attention from investors and acquirers. Neo also benefits from
              timing: it launched as enterprises are only beginning to understand the risks of autonomous software
              embedded in sanctioned tools. If the company owns a differentiated control point and can become the
              standard for attribution and policy enforcement, it could support a premium well above a conventional seed
              or early Series A benchmark. Comparable market commentary further suggests that investors are willing to
              pay up for companies positioned at the intersection of AI and cybersecurity, especially when the
              addressable pain spans identity, application control, and governance. Those are serious valuation
              supports. They simply do not erase the need to verify product efficacy, customer depth, and the actual
              terms of the current round.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV033
              - CV034
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV013
              - CV021
              - CV028
              - CV033
              - CV037
          - type: table
            tableRef: TV004
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV014
              - CV019
              - CV020
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: What Limits Valuation Confidence and Raises Overpayment Risk
        blocks:
          - type: paragraph
            body: >-
              The clearest limitation is that Neo’s public evidence is still stronger on category heat than on
              company-specific outcomes. There are no retained public disclosures of ARR, customer count, net retention,
              gross margin, or usage depth. That means any revenue-multiple logic has to be hypothetical. The second
              limitation is comparability. Many 2026 market maps and valuation commentaries blend different types of AI
              security companies, maturity stages, and commercialization profiles. A premium paid for a later-stage
              company with proven scale does not automatically transfer to a newly publicized startup, even in the same
              broad theme. The third limitation is competitive compression. If large platforms absorb enough of Neo’s
              differentiation before the company establishes referenceable proof, today’s premium narrative could age
              badly. Together these factors argue against treating an unverified valuation rumor or aspirational mark as
              investable truth. At minimum, investors should require private diligence that reconciles customer proof,
              commercial momentum, and round terms before accepting a top-decile price.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV035
              - CV036
