        title: Product Modules and the User Jobs Neo Is Trying to Solve
        blocks:
          - type: paragraph
            body: >-
              Neo’s product pages are unusually explicit about the jobs the platform is meant to do. The core loop
              starts with inventory: agents, models, skills, MCP servers, extensions, and other software artifacts are
              all in scope. It then moves into posture and capability analysis, trying to answer what those artifacts
              can access and whether they are configured safely. From there Neo emphasizes attribution, which matters
              because autonomous software may act through valid user sessions and otherwise look legitimate. Finally the
              system enforces policy by allowing, blocking, or holding actions for approval before data moves. In
              practical terms, the platform is being built for SecOps and governance teams that want to keep adoption
              moving without surrendering control. That makes the product less like a prompt firewall and more like an
              operating control layer for enterprise agent workflows. The consistency of that language across multiple
              public pages is itself a useful maturity signal.
