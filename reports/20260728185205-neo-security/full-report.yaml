      - number: '1.2'
        title: Founders, Leadership, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              The public leadership story is unusually coherent for a freshly launched company. Nick Warner brings a
              go-to-market and scaling narrative from SentinelOne, Shlomi Salem brings deep detection-engineering and
              threat-research credibility, and Eran Shirazi adds enterprise software and vulnerability-research depth.
              That combination gives Neo a plausible founder-market-fit case because the category it is attacking sits
              between endpoint, identity, and application control rather than inside one legacy silo. Public evidence
              also shows an early dual-footprint model: Boston appears to anchor operations and corporate functions,
              while both Neo’s careers page and Calcalist reporting point to a substantial Israeli engineering presence
              centered in Tel Aviv. The same careers board showed thirty-seven open roles across R&D, sales, operations,
              finance, and marketing on the run date, which suggests the company is moving from elite founder-led design
              into broader organizational buildout. What remains missing is a public board map, succession depth below
              the founding trio, and any formal disclosure of governance structures.
            claimRefs:
