      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Why the Market Can Still Disappoint
        blocks:
          - type: paragraph
            body: >-
              The bullish case is straightforward. AI capabilities are being embedded into already approved enterprise
              software, creating shadow or semi-approved agentic behavior that legacy controls cannot interpret. Agents
              can invoke tools, move data, and act autonomously, which makes real-time authorization and post-action
              auditability far more valuable than static policy documents. NIST, OWASP, and the EU AI Act each reinforce
              some version of governance, traceability, and risk-managed deployment. But the market has clear
              constraints. Buyers still need ROI proof, and many will ask whether Microsoft, Palo Alto, CyberArk, or
              another incumbent can solve “enough” of the problem within an existing contract. The category boundary is
              also messy: identity, DSPM, DLP, runtime testing, AI gateways, and endpoint controls all touch pieces of
              the same workflow. Security Boulevard's bear case is therefore important: a real problem can still become
              a very expensive feature rather than a durable standalone platform market.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM017
              - CM018
              - CM026
              - CM027
              - CM028
              - CM029
