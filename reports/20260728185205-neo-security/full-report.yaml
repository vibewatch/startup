      - number: '3.4'
        title: Pricing Opacity, Moat Logic, and Where the Bear Case Lands
        blocks:
          - type: paragraph
            body: '    Public-web research is surprisingly weak on the commercial mechanics of the category. Very few retained sources publish prices, and almost none reveal contract models, deployment fees, ACVs, or competitive replacement data. That forces a comparison based on architecture, buyer fit, and likely deployment depth rather than sticker price. Neo’s best moat claim is that endpoint-native interception can provide control that identity-only or API-only products cannot match. But that moat is conditional. If incumbents combine endpoint telemetry, identity graphs, and agent orchestration fast enough, the same features could become part of a broader suite. Security Boulevard’s critique captures the core bear case: a real product can still become a feature. As a result, Neo’s competitive durability should be evaluated through proof of production depth, customer urgency, reference density, and how quickly rivals converge on similar runtime-control narratives. In practice, the most valuable next diligence step is not another web search but actual win-loss evidence from recent enterprise evaluations, especially in Fortune 500 bake-offs where bundled-suite alternatives look superficially good enough.'
