      - number: '1.5'
        title: Adverse Signals and the Ground-Truth Gaps That Still Matter
        blocks:
          - type: paragraph
            body: >-
              The bear case begins with category durability. Security Boulevard’s skeptical read is not that Neo lacks a
              real problem, but that real problems in cybersecurity often compress into features once platform vendors
              react. That risk is especially relevant here because CyberArk, Microsoft, Palo Alto Networks, and other
              incumbents are already extending identity, cloud, and AI controls toward agentic behavior. A second risk
              is that public evidence remains thin on hard operating facts: customer names, revenue quality, board
              structure, and exact valuation are all absent from retained primary sources. Even headcount and round
              structure vary across trackers and news reports. A third risk is concentration. The public brand is
              tightly tied to the three founders, and the operating model appears split between Boston leadership and
              Israeli R&D, which can work very well but also concentrates execution and talent risk. The company is
              therefore easy to understand strategically, but still under-disclosed operationally.
            claimRefs:
              - CO020
              - CO021
              - CO022
              - CO030
              - CO033
              - CO034
              - CO035
              - CO036
              - CO038
