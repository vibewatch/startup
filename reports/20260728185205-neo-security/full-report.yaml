              - CV030
              - CV038
              - CV039
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV004
              - CV017
              - CV018
              - CV029
          - type: figure
            figureRef: FV005
            claimRefs:
              - CV021
              - CV025
              - CV027
              - CV030
      - number: '8.4'
        title: Decision Logic, Sensitivity, and Price Discipline
        blocks:
          - type: paragraph
            body: >-
              The most defensible public conclusion is not a hard target valuation but a disciplined posture. If a
              prospective investor can privately confirm strong pilot conversion, real production controls, and a cap
              table that does not already bake in near-perfect execution, Neo remains worth tracking closely and could
              merit participation. If the ask assumes category leadership before customer validation is visible, the
              right stance is caution. In simple terms, the investment can work from several paths: exceptional product
              proof, fast adoption in regulated enterprises, or strategic scarcity in agentic security. It can fail from
              several as well: slow conversion, weak referenceability, aggressive bundling, or an entry price that
              leaves little room for execution risk. Given that the exact valuation is not well evidenced publicly, the
              rational recommendation is watch rather than pass or invest outright. Investors should lean in only if
              private diligence improves confidence on proof and price simultaneously.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV037
              - CV038
              - CV039
              - CV040
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV023
              - CV024
              - CV028
              - CV038
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Neo has the ingredients for premium interest
            body: >-
              Strong founders, elite investors, large funding, and exposure to agentic AI security make Neo easy to
              understand as a high-attention company in 2026.
            calloutType: strength
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV012
          - type: callout
            title: The exact price is less clear than the narrative
            body: >-
              Public evidence supports funding strength better than exact valuation. That makes entry price discipline
              and private diligence the decisive variables for investors.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV005
