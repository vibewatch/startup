      - number: '1.3'
        title: Funding Structure, Investors, and Who Matters Economically
        blocks:
          - type: paragraph
            body: >-
              The most important diligence finding in the capital stack is that the headline is clear but the structure
              is not. Neo’s official launch release, echoed by several reprints, says the company “emerged from stealth
              with $100M in funding” from Andreessen Horowitz and Bessemer Venture Partners with participation from
              Craft Ventures and Merlin Ventures. Independent reporting from Calcalist, Fundraise Insider, and Seedtable
              breaks that total into a $25 million seed in 2025 and a $75 million Series A in July 2026. Those
              statements are directionally compatible on total disclosed capital but not on form, and that difference
              matters because stage labeling affects dilution expectations, governance rights, and how aggressively
              investors priced go-to-market maturity. The stakeholder picture is otherwise strong: a16z and BVP supply
              brand, Craft adds enterprise software pattern recognition, Merlin adds cyber-specific channel leverage,
              and Calcalist also lists several well-known angel backers from the Israeli cyber ecosystem. No retained
              public source, however, discloses exact post-money valuation, liquidation preferences, board rights, or
              secondary liquidity.
            claimRefs:
              - CO017
              - CO018
              - CO019
              - CO020
              - CO021
              - CO025
              - CO026
