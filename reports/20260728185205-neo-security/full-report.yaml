            title: Founders and investors are unusually strong for a first public launch
            body: >-
              Neo’s founder-market fit is materially above the typical stealth-to-launch startup because the team
              combines SentinelOne operating depth, threat-research credibility, and enterprise software delivery
              experience, while the cap table already includes a16z, Bessemer, Craft, and Merlin. That does not prove
              product-market fit, but it does lower the probability that the company is merely a lightweight wrapper
              around the current AI hype cycle.
