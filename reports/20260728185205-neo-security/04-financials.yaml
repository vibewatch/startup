chapter:
  number: 4
  title: Financials
  summary: Neo has a very well-funded public launch but extremely thin public operating disclosure. The available evidence supports aggressive post-launch investment and enterprise-software monetization intent, but not any precise view on revenue quality, margins, or runway.
sections:
- id: revenue-model
  title: 'Revenue Model: What Can Actually Be Inferred'
  body: 'Public evidence does not disclose revenue, ARR, bookings, or customer count. Even so, Neo’s commercial surface is not random. The company markets to SecOps teams, offers demos, runs an ROI calculator, and speaks in the language of enterprise governance rather than consumer product adoption. That combination strongly suggests an enterprise subscription model sold through high-touch evaluations rather than a self-serve SaaS motion. It is also plausible that the model includes implementation, integration, or policy-tuning services, especially because runtime controls often require customer-specific workflows and approvals. But the public record does not disclose whether services revenue is meaningful or purely supportive. The key takeaway is therefore directional: Neo looks like a security software company with enterprise contract ambition, not a pure usage-based API product. The exact balance between subscription, services, and any consumption element remains a diligence gap that
    matters for both revenue quality, margin profile, and renewal behavior.'
  claimRefs:
  - CI004
  - CI005
  - CI006
  - CI014
  - CI015
  - CI016
  - CI026
  - CI028
  - CI029
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: unit-economics-and-gaps
  title: 'Unit Economics: Mostly Unknown, and That Matters'
  body: Almost every underwriting metric investors would want remains undisclosed. There is no public gross margin, no disclosed net revenue retention, no seat count, no contract value range, and no indication of how much ongoing services work is needed per deployment. There is likewise no revenue denominator that would allow a responsible revenue-per-employee or sales-efficiency estimate. That means the financial story is currently dominated by gaps rather than contradictions. The company may already have attractive subscription economics, or it may still be funding heavy deployment effort to prove out a new category; public sources do not distinguish between those cases. The safest interpretation is therefore that Neo is too early and too private for public-web unit-economics analysis, not that the metrics are weak by default. This chapter should be read as an evidence-constrained framework for follow-up diligence rather than a complete model. Signed customer contracts would change the confidence level immediately.
  claimRefs:
  - CI017
  - CI018
  - CI024
  - CI032
  - CI035
  tableRefs:
  - TI003
  - TI005
  figureRefs:
  - FI002
  - FI003
- id: capital-adequacy-and-burn
  title: Capital Adequacy, Hiring Intensity, and Burn Direction
  body: The clearest positive financial fact is the size of announced capital. Whether the launch financing is treated as a single $100 million event or as $25 million seed plus $75 million Series A, Neo is entering the public market with materially more capital than a typical seed-stage cyber startup. That said, announced capital is not the same thing as remaining cash. The same public record shows a company in active buildout mode, with thirty-seven open roles spanning product, GTM, legal, finance, and HR, plus outside evidence of roughly fifty current employees. That combination implies burn is moving up, not down. The company appears to be using capital to accelerate market capture while the category is still forming. That can be rational if product-market fit is real and deployment depth proves defensible. It becomes risky if customer conversion lags hiring pace or if bundled incumbents flatten pricing power faster than expected over time.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI007
  - CI008
  - CI009
