callouts:
- calloutType: risk
  title: Public capital strength does not equal public operating quality
  body: Neo’s funding headline is strong enough to remove immediate survival anxiety, but it does not answer the harder questions about revenue quality, customer expansion, gross margin, or cash efficiency. Investors should resist treating a large launch round as a substitute for operating data.
  claimRefs:
  - CI001
  - CI004
  - CI019
  - CI031
- calloutType: insight
  title: The real financial story is one of expected scale-up, not measured efficiency
  body: The role count, GTM assets, and investor messaging all point toward an aggressive market-capture strategy. That can be exactly right for a new category, but it means later valuation work must stay scenario-based until actual customer and retention data surface.
  claimRefs:
  - CI007
  - CI012
  - CI023
  - CI030
