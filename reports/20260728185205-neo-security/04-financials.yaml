- id: bull-bear-reading
  title: Bull, Bear, and the Financial Questions That Still Matter Most
  body: 'The bull case is that Neo used exceptional founder pedigree and category timing to raise ahead of demand, giving it enough runway to hire aggressively, land reference accounts, and shape a new market before incumbents fully adapt. On that reading, the lack of public metrics is ordinary private-company opacity rather than a warning sign. The bear case is that the same facts simply show a company with expensive expectations and little public evidence of monetization quality. Security Boulevard’s “product becomes feature” warning matters financially because compressed category durability can hit both pricing power and exit multiple, even if the underlying product is real. For diligence, the most important next documents are not more marketing materials but signed customer contracts, cohort behavior, renewal data, and the actual cap table. Until those exist in evidence, the financial posture remains: strong capital headline, serious buildout, and low confidence on operating efficiency today overall.'
  claimRefs:
  - CI021
  - CI022
