  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Current ARR, recognized revenue, bookings, and customer-count disclosure.
    whyItMatters: Without revenue and customer denominators, no serious view on efficiency, pricing power, or valuation multiples is possible.
    diligencePath: Request MRR / ARR bridge, bookings report, and current customer count.
    relatedQuestionRefs:
    - QI002
    - QI015
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and planned hiring cadence by quarter.
    whyItMatters: Announced capital is directionally helpful but cannot replace true runway analysis.
    diligencePath: Request board package or CFO summary with cash balance and burn scenarios.
    relatedQuestionRefs:
    - QI005
    - QI009
    - QI020
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Price book, recent contract values, services attach rate, and discounting norms.
    whyItMatters: Pricing power is one of the most important determinants of long-term software quality in a crowded category.
    diligencePath: Request standard order form, price list, and three anonymized closed-won deal summaries.
    relatedQuestionRefs:
    - QI007
    - QI013
    - QI016
    relatedTableRefs:
    - TI002
