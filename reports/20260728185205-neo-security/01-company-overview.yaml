company:
  name: Neo Security
chapter:
  number: 1
  title: Company Overview
  summary: Neo Security is a Boston-based cybersecurity startup that emerged from stealth on 2026-07-20 with a launch financing headline of $100 million led by Andreessen Horowitz and Bessemer Venture Partners. Public evidence strongly supports the company's positioning around real-time control of agentic software, but public evidence is materially less clear on exact round structure, employee count precision, customer proof, and any exact post-money valuation.
sections:
- id: identity-business-model
  title: Identity, Product Scope, and What the Company Is Actually Selling
  body: Neo launched publicly in July 2026 as a cybersecurity vendor built around what it calls “Agentic Software Control.” Across its launch release, homepage, and platform pages, the company repeatedly frames the core problem not as classic malware prevention or API posture management, but as real-time governance of autonomous software operating inside already approved enterprise tools. That distinction matters. Neo is trying to sit above the operating-system boundary and inside the software layer where agents, browser extensions, MCP servers, embedded models, and AI-enabled applications can act with valid user permissions. The commercial promise is therefore not simply visibility into what binary is running, but visibility into what that software can do, what data it can touch, and what action it is attempting right now. The company’s own copy also emphasizes native enforcement, attribution, and posture analysis, implying a control plane product meant for SecOps buyers rather than a narrow
    developer plug-in or observability widget.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO012
  - CO014
  - CO028
  tableRefs:
  - TO001
  figureRefs:
