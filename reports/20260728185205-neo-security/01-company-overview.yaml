  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact post-money valuation, cap-table percentages, liquidation preferences, and board-right terms for the launch financing.
    whyItMatters: Without formal financing documents, the company can be described as well funded but not underwritten precisely on ownership dilution or valuation.
    diligencePath: Request the stock purchase agreements, board-rights letter, and current cap table from management.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named production customers, deployment scale, contract values, and measurable outcomes.
    whyItMatters: Company overview can establish the product story, but later customer and valuation judgments remain speculative without reference accounts.
    diligencePath: Request three customer references, logo list, deployment stage, and security-outcome case studies.
    relatedQuestionRefs:
    - QO015
    - QO025
  - type: conflicting-data
    severity: material
    topic: funding-round
    missingEvidence: A single authoritative explanation of whether the July 2026 financing should be treated as one $100M launch round or as $25M seed plus $75M Series A.
    whyItMatters: Stage labeling affects dilution expectations, comparable-set selection, and how aggressively investors have already priced execution risk.
    diligencePath: Ask management and lead counsel for the executed financing summary and closing dates by tranche.
    relatedQuestionRefs:
    - QO008
    - QO013
    relatedTableRefs:
    - TO001
    - TO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: An audited or management-confirmed employee count with split by geography and function.
    whyItMatters: Headcount is a basic scale signal and burn proxy; range-only tracker data is not precise enough for later financial modeling.
    diligencePath: Request HRIS snapshot by function, geography, and start date.
    relatedQuestionRefs:
    - QO009
    - QO016
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Board composition, committee structure, and succession depth below the founding trio.
    whyItMatters: Key-person and control-risk analysis remains incomplete while the public record is centered almost entirely on the founders.
    diligencePath: Request board list, observer rights, org chart, and executive succession plan.
    relatedQuestionRefs:
    - QO017
    - QO025
    relatedTableRefs:
    - TO002
