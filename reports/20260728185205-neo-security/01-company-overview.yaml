- id: capital-stakeholders
  title: Funding Structure, Investors, and Who Matters Economically
  body: 'The most important diligence finding in the capital stack is that the headline is clear but the structure is not. Neo’s official launch release, echoed by several reprints, says the company “emerged from stealth with $100M in funding” from Andreessen Horowitz and Bessemer Venture Partners with participation from Craft Ventures and Merlin Ventures. Independent reporting from Calcalist, Fundraise Insider, and Seedtable breaks that total into a $25 million seed in 2025 and a $75 million Series A in July 2026. Those statements are directionally compatible on total disclosed capital but not on form, and that difference matters because stage labeling affects dilution expectations, governance rights, and how aggressively investors priced go-to-market maturity. The stakeholder picture is otherwise strong: a16z and BVP supply brand, Craft adds enterprise software pattern recognition, Merlin adds cyber-specific channel leverage, and Calcalist also lists several well-known angel backers from
    the Israeli cyber ecosystem. No retained public source, however, discloses exact post-money valuation, liquidation preferences, board rights, or secondary liquidity.'
  claimRefs:
  - CO017
  - CO018
  - CO019
  - CO020
  - CO021
  - CO025
  - CO026
  - CO027
  tableRefs:
  - TO003
- id: scale-signals-milestones
  title: Scale Signals, Milestones, and What Is Proven So Far
  body: 'Neo has more launch infrastructure than a typical stealth exit, but still much less proof than a mature category leader. Its site already includes a developed homepage, platform narrative, about page, careers board, and launch newsroom assets, which signals a deliberate enterprise go-to-market wrapper rather than a “coming soon” placeholder. The product message is also more specific than many seed-stage AI-security companies: inventory, risk intelligence, attribution, policy control, and native enforcement appear repeatedly across the retained materials. Independent sources add several directional scale signals: Neo claims first-scan deployment in under fifteen minutes, says the sensor is lightweight, and highlights a knowledge base with over 1.2 million cataloged agentic artifacts. Yet the company still lacks named customer references, revenue or ARR disclosure, customer count, and independent efficacy benchmarks. eWeek’s note that Neo has tested with sensitive-sector organizations
    without naming them is useful, but it is still pre-proof relative to what later chapters will need for customer and financial conviction.'
  claimRefs:
  - CO010
  - CO012
  - CO013
  - CO030
  - CO031
  - CO037
  - CO038
  tableRefs:
  - TO004
  figureRefs:
  - FO001
- id: adverse-signals-diligence-flags
  title: Adverse Signals and the Ground-Truth Gaps That Still Matter
  body: 'The bear case begins with category durability. Security Boulevard’s skeptical read is not that Neo lacks a real problem, but that real problems in cybersecurity often compress into features once platform vendors react. That risk is especially relevant here because CyberArk, Microsoft, Palo Alto Networks, and other incumbents are already extending identity, cloud, and AI controls toward agentic behavior. A second risk is that public evidence remains thin on hard operating facts: customer names, revenue quality, board structure, and exact valuation are all absent from retained primary sources. Even headcount and round structure vary across trackers and news reports. A third risk is concentration. The public brand is tightly tied to the three founders, and the operating model appears split between Boston leadership and Israeli R&D, which can work very well but also concentrates execution and talent risk. The company is therefore easy to understand strategically, but still under-disclosed
    operationally.'
