callouts:
- calloutType: strength
  title: Founders and investors are unusually strong for a first public launch
  body: Neo’s founder-market fit is materially above the typical stealth-to-launch startup because the team combines SentinelOne operating depth, threat-research credibility, and enterprise software delivery experience, while the cap table already includes a16z, Bessemer, Craft, and Merlin. That does not prove product-market fit, but it does lower the probability that the company is merely a lightweight wrapper around the current AI hype cycle.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO017
- calloutType: risk
  title: The main problem is believable, but the standalone-platform outcome is not yet proven
  body: The most material strategic risk is that agentic-software governance becomes a feature set absorbed by broader endpoint, identity, and AI-security suites. Neo has a sharper narrative than many peers, but without named customers, disclosed retention, or independent benchmarks, the company has not yet proved that it can stay independent of that consolidation pressure.
  claimRefs:
  - CO030
  - CO031
  - CO033
  - CO036
- calloutType: insight
  title: Public evidence is strongest on architecture and weakest on economics
  body: 'The diligence pattern is clear: the retained public sources are good enough to establish what Neo is, who built it, roughly where it operates, and how it claims to govern AI agents. They are not yet good enough to underwrite exact valuation, customer concentration, or financial quality. That asymmetry should shape every later chapter.'
  claimRefs:
  - CO018
  - CO021
  - CO022
  - CO038
