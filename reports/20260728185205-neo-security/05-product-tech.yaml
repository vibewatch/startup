  evidenceGaps:
  - type: missing-source
    severity: material
    topic: product-benchmarks
    missingEvidence: Independent efficacy data, false-positive rates, and examples of production actions blocked or held.
    whyItMatters: Architecture quality and product-market fit cannot be separated cleanly without measured operational evidence.
    diligencePath: Request benchmark deck, reference architecture, and anonymized production case studies.
    relatedQuestionRefs:
    - QE017
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: integrations
    missingEvidence: A documented integration map for SIEM, IdP, ticketing, and workflow tools.
    whyItMatters: Enterprise deployability depends on where evidence and control decisions go after interception.
    diligencePath: Request product docs or solution-architecture diagrams for downstream integrations.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: certifications
    missingEvidence: SOC 2, ISO 27001, or equivalent formal assurance documentation if it exists.
    whyItMatters: Security buyers often expect formal proof beyond legal pages and product claims.
    diligencePath: Request trust center access or certification reports.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
