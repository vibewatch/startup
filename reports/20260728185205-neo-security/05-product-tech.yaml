callouts:
- calloutType: strength
  title: The architecture story is coherent
  body: 'Neo’s strongest public product asset is coherence: the product pages, launch release, and investor narrative all describe the same control loop rather than unrelated feature fragments. That consistency lowers the risk that the company is still searching for a product identity.'
  claimRefs:
  - CE001
  - CE003
  - CE007
  - CE029
- calloutType: risk
  title: Public evidence is still much stronger on thesis than on measured outcomes
  body: The product can be understood from public materials, but it cannot yet be audited from them. Missing benchmarks, integration catalogs, certifications, and reference architectures mean investors should treat the current tech case as promising but only partially validated.
