- id: trust-quality-and-maturity
  title: Trust, Quality, and Maturity Signals
  body: The public trust story is respectable but incomplete. Neo has legal and privacy surfaces, product copy grounded in governance language, and a narrative that maps well to NIST and OWASP-style frameworks. That means the company understands how enterprise buyers think about AI risk. It does not mean the public record proves quality. Retained sources do not disclose public certifications, benchmark results, false-positive rates, mean time to tune policies, or real production performance data. Nor do they show a public integration catalog, a public API reference, or a reference architecture pack. This asymmetry matters. Early-stage cyber companies often launch with excellent conceptual framing before they have enough field proof to substantiate every operating claim. Neo therefore appears mature enough to sell and demo, but still early from an evidence perspective. The missing proof is not fatal, yet it should temper claims about readiness relative to incumbents and should keep diligence focused on implementation depth.
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE022
  - CE023
  - CE024
  - CE030
  - CE033
  - CE034
