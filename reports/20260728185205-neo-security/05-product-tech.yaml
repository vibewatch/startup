- id: architecture-and-controls
  title: Architecture, Workflow, and Why the Endpoint Bet Matters
  body: 'The most distinctive technical claim is architectural, not merely categorical. Bessemer describes Neo as making the harder bet on an endpoint-resident sensor because API-only visibility cannot intercept what agents actually do inside trusted software. Neo’s own material supports that view with language about native enforcement, real-time action control, and software behavior inside already approved applications. The likely control chain is: endpoint telemetry captures what software and agentic components are present; Neoverse enriches those observations with contextual knowledge; capability and risk analysis surfaces what the software can do; policy logic maps allowed, blocked, or held actions; and attribution plus routing preserve the evidence for downstream SOC workflows. That model is well aligned with agentic risks centered on tool use, privilege inheritance, and hidden actions inside approved applications. Whether it is operationally superior in production remains unproven
    publicly, but the design thesis is clear.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE010
  - CE011
