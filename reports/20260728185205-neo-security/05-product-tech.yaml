  summary: Neo’s design can be read as a layered control stack from telemetry through enforcement.
  data:
    layers:
    - label: Workflow routing / SOC evidence
      detail: Alerts, approvals, and evidence are routed into existing operator workflows after a policy decision.
    - label: Policy and attribution engine
      detail: Group-aware policy logic and actor attribution determine whether an action is allowed, held, or blocked.
    - label: Capability / risk analysis + Neoverse enrichment
      detail: Artifact discovery is enriched with contextual knowledge about models, tools, permissions, and risks.
    - label: Endpoint sensor and artifact discovery
      detail: Local telemetry identifies agentic artifacts and captures activity inside trusted applications.
