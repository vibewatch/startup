  - FE004
- id: roadmap-and-bear-case
  title: Roadmap Focus, Adjacent Competition, and the Bear Case
  body: 'Neo launched with a focused story rather than a sprawling platform map, and that is probably the right choice. The Black Hat page, event motion, and launch narrative all imply the current roadmap is centered on proving the enterprise control loop: inventory, attribution, policy, and action-level enforcement. External sources also show, however, that many peers and incumbents now speak similar language. Prompt, Noma, Zenity, Palo Alto, Akto, and others all describe combinations of discovery, guardrails, governance, and runtime protection. The bear case is therefore not that Neo lacks a product, but that the product language becomes crowded faster than Neo can prove production depth. If broader platforms absorb enough of the same capability set, Neo’s differentiation will need to rest on operational outcomes—especially whether customers trust it to actually hold or block risky actions in live environments. That remains the central unresolved product question for investors today, especially before broad public deployment evidence emerges commercially.'
