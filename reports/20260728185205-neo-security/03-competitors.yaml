chapter:
  number: 3
  title: Competitors
  summary: Neo sits in a crowded, still-unsettled field where startup specialists and platform incumbents are converging on similar language around runtime controls, identity, visibility, and auditability. The most important competitive question is not whether Neo has peers, but whether its endpoint-native control thesis stays differentiated as suites expand.
sections:
- id: landscape
  title: Who Actually Competes With Neo
  body:   The competitive set is broader than a simple list of AI-security startups. Independent landscape sources, vendor lists, and official competitor pages all show at least three overlapping cohorts today. First are startup specialists such as Prompt Security, Noma, Zenity, Oasis, and Astrix that market directly into AI-agent security or adjacent non-human identity control. Second are large platforms such as Microsoft, Palo Alto Networks, and likely CyberArk and CrowdStrike that can extend existing telemetry and distribution into the same budget conversation. Third are broader AI-security or testing vendors that appear in review lists but may not actually compete head-to-head for every control-plane deal. This means Neo should be compared by function, not just by label. It is most directly in the runtime-governance and control-plane subgroup, not the entire AI-safety universe. That nuance matters because broad vendor counts make the market look more crowded than the actual shortlist a Fortune
    500 CISO may use.
  claimRefs:
  - CP001
  - CP011
  - CP012
  - CP013
  - CP030
  - CP031
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: startup-specialists
  title: 'Startup Specialists: Breadth, Depth, and Where Neo Sits Among Them'
  body: 'Among startup specialists, Neo’s strongest relative claim is depth around endpoint-anchored interception and action control. Prompt Security presents a broader AI-security umbrella spanning employee use, homegrown AI apps, code assistants, MCP, and agentic AI, which may open more doors but can also disperse focus. Noma appears closer to Neo on runtime and guardrail language, especially around blast-radius analysis and production enforcement. Zenity likewise focuses on the decision path of agents, arguing that the security problem cannot be reduced to one legacy category. Oasis and Astrix occupy more identity-centric ground, mapping non-human identities, permissions, and least-privilege access. That makes them meaningful alternatives inside identity-led buying motions but somewhat different from Neo’s stated software-control loop. Overall, Neo is neither alone nor generic: it sits in the subset of startups trying to make runtime governance and attribution operational enough for enterprise
    deployment.'
