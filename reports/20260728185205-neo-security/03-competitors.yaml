callouts:
- calloutType: risk
  title: Neo is competing in a market where everyone sounds like a platform
  body: The biggest danger in this chapter is taking vendor messaging at face value. Nearly every competitor claims some combination of discovery, governance, runtime security, and compliance. The real question is which vendor can operationalize those claims fastest inside existing enterprise workflows.
  claimRefs:
  - CP022
  - CP023
  - CP025
- calloutType: insight
  title: Distribution may matter more than feature checklists
  body: Microsoft, Palo Alto, Cisco, and CyberArk can all approach the same buyer through existing trust, telemetry, and procurement channels. Neo therefore needs differentiation that survives contact with bundled offerings, not only a well-designed demo.
  claimRefs:
  - CP018
  - CP019
  - CP021
  - CP033
