  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Actual pricing, discounting, ACV, and packaging data for Neo and close peers.
    whyItMatters: Public positioning can show who is in the market, but commercial proof is needed to judge competitive replaceability and budget depth.
    diligencePath: Request competitor battlecards, field pricing notes, and recent deal summaries.
    relatedQuestionRefs:
    - QP013
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Head-to-head win-loss data against incumbents and startup specialists.
    whyItMatters: Differentiation claims remain largely narrative without displacement data from actual enterprise evaluations.
    diligencePath: Request recent bake-off results and three anonymized win/loss summaries by segment.
    relatedQuestionRefs:
    - QP020
    - QP025
  - type: missing-source
    severity: minor
    topic: customer-scale
    missingEvidence: Comparable customer counts and production references across the closest startup peers.
    whyItMatters: Scale and reference density can materially change how credible a feature-parity claim really is.
    diligencePath: Collect reference customers and public logo evidence per competitor.
    relatedQuestionRefs:
    - QP014
    - QP022
