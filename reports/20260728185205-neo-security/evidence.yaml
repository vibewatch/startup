evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Exact post-money valuation, cap-table percentages, liquidation preferences, and board-right terms for the launch
      financing.
    whyItMatters: >-
      Without formal financing documents, the company can be described as well funded but not underwritten precisely on
      ownership dilution or valuation.
    diligencePath: Request the stock purchase agreements, board-rights letter, and current cap table from management.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named production customers, deployment scale, contract values, and measurable outcomes.
    whyItMatters: >-
      Company overview can establish the product story, but later customer and valuation judgments remain speculative
      without reference accounts.
    diligencePath: Request three customer references, logo list, deployment stage, and security-outcome case studies.
    relatedQuestionRefs:
      - QO015
      - QO025
  - type: conflicting-data
    severity: material
    topic: funding-round
    missingEvidence: >-
      A single authoritative explanation of whether the July 2026 financing should be treated as one $100M launch round
      or as $25M seed plus $75M Series A.
    whyItMatters: >-
      Stage labeling affects dilution expectations, comparable-set selection, and how aggressively investors have
      already priced execution risk.
    diligencePath: Ask management and lead counsel for the executed financing summary and closing dates by tranche.
    relatedQuestionRefs:
      - QO008
      - QO013
    relatedTableRefs:
      - TO001
      - TO004
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: An audited or management-confirmed employee count with split by geography and function.
    whyItMatters: >-
      Headcount is a basic scale signal and burn proxy; range-only tracker data is not precise enough for later
      financial modeling.
    diligencePath: Request HRIS snapshot by function, geography, and start date.
    relatedQuestionRefs:
      - QO009
      - QO016
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Board composition, committee structure, and succession depth below the founding trio.
    whyItMatters: >-
      Key-person and control-risk analysis remains incomplete while the public record is centered almost entirely on the
      founders.
    diligencePath: Request board list, observer rights, org chart, and executive succession plan.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: som
    missingEvidence: A customer-count denominator or deployment-volume dataset that would allow a real Neo-specific SAM and SOM model.
    whyItMatters: Without disclosed customer or deployment counts, sizing beyond directional lenses remains speculative.
    diligencePath: Request active customer count, evaluated enterprise pipeline, and deployment-volume distribution by segment.
    relatedQuestionRefs:
      - QM015
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budgeting
    missingEvidence: >-
      Actual enterprise budgets, average contract values, and internal cost-avoidance or productivity justification for
      runtime controls.
    whyItMatters: The market can be urgent and still monetize slowly if standalone line items are not forming.
    diligencePath: Collect buyer interviews, pipeline stage data, and ACV benchmarks from management and reference customers.
    relatedQuestionRefs:
      - QM010
      - QM022
  - type: stale
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: A second independent 2026-dollar market model to triangulate MarketsandMarkets.
    whyItMatters: Single-publisher forecasts can overstate or blur category boundaries.
    diligencePath: Add another 2026 market model or budget survey before using TAM in valuation arguments.
    relatedQuestionRefs:
      - QM003
      - QM020
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Actual pricing, discounting, ACV, and packaging data for Neo and close peers.
    whyItMatters: >-
      Public positioning can show who is in the market, but commercial proof is needed to judge competitive
      replaceability and budget depth.
    diligencePath: Request competitor battlecards, field pricing notes, and recent deal summaries.
    relatedQuestionRefs:
      - QP013
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: win-loss
    missingEvidence: Head-to-head win-loss data against incumbents and startup specialists.
    whyItMatters: Differentiation claims remain largely narrative without displacement data from actual enterprise evaluations.
    diligencePath: Request recent bake-off results and three anonymized win/loss summaries by segment.
    relatedQuestionRefs:
      - QP020
      - QP025
  - type: missing-source
    severity: minor
    topic: customer-scale
    missingEvidence: Comparable customer counts and production references across the closest startup peers.
    whyItMatters: Scale and reference density can materially change how credible a feature-parity claim really is.
    diligencePath: Collect reference customers and public logo evidence per competitor.
    relatedQuestionRefs:
      - QP014
      - QP022
  - type: private-evidence-only
    severity: blocking
    topic: revenue
    missingEvidence: Current ARR, recognized revenue, bookings, and customer-count disclosure.
    whyItMatters: >-
      Without revenue and customer denominators, no serious view on efficiency, pricing power, or valuation multiples is
      possible.
    diligencePath: Request MRR / ARR bridge, bookings report, and current customer count.
    relatedQuestionRefs:
      - QI002
      - QI015
      - QI025
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and planned hiring cadence by quarter.
    whyItMatters: Announced capital is directionally helpful but cannot replace true runway analysis.
    diligencePath: Request board package or CFO summary with cash balance and burn scenarios.
    relatedQuestionRefs:
      - QI005
      - QI009
      - QI020
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Price book, recent contract values, services attach rate, and discounting norms.
    whyItMatters: Pricing power is one of the most important determinants of long-term software quality in a crowded category.
    diligencePath: Request standard order form, price list, and three anonymized closed-won deal summaries.
    relatedQuestionRefs:
      - QI007
      - QI013
      - QI016
    relatedTableRefs:
      - TI002
  - type: missing-source
