      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本获取是当前优势，但资本充足性仍未被证明。多家媒体报道 Shihang 完成了超过 RMB 1b 的 A
              轮融资；披露的资金用途也符合一家硬件加现场运营公司的预期：核心研发、全球市场拓展和生态建设。老股东据报道与新的战略投资人一起大额跟投，这提高了公司为近期产品和市场开发融资的可信度。但现有证据没有披露现金余额、月度烧钱、债务义务或管理层定义的下一轮触发条件。新加坡共同资助项目有助于验证项目资格，但它是六家入选伙伴共享的项目资金池，不能被当作
              Shihang 自身流动性的资产负债表替代品。
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI014
              - CI013
      - number: '4.4'
        title: 财务判断与阻碍因素
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，公司在需求形成和融资能力上强于收入质量。订单、现场部署和第三方试验入选的组合是方向性利好，因为它比纯概念演示更难伪造，而且可服务的航运资产基数仍然很大。不过，收入转化细节缺失仍然阻碍投资判断：投资人尚不知道实际定价、合同期限、验收里程碑、取消情况、客户集中度、服务生产率、毛利率、营运资本拖累或
              runway。近期真正的问题不是客户是否有兴趣，而是 Shihang 能否把技术上令人印象深刻的机器人部署，变成可重复、合规且能产生现金的海事服务经济性。
            claimRefs:
              - CI003
              - CI005
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 比纯演示叙事更有力的证据
            body: 已披露的 >RMB 1bn 订单，加上入选新加坡 MPA 支持的船体清洁项目，给出两种不同的公开信号：据报道已有客户需求，并获选参加第三方运营试验。
            calloutType: strength
            claimRefs:
              - CI003
              - CI005
              - CI006
          - type: callout
            title: 收入质量仍是关键尽调问题
            body: 公开证据在融资和订单上最强，但在决定现金生成能力的变量上最弱：实际定价、合同结构、交付生产率、收集与过滤成本、毛利率和 runway。
            calloutType: risk
            claimRefs:
              - CI007
