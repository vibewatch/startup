        title: 受证据约束的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              当前材料没有用同一口径提供一套公开 TAM / SAM / SOM 桥接，因此最稳妥的做法是保留多个测算视角，而不是夸大某一个宽泛的市场数字。UNCTAD
              展示最终需要巡检、清洁和维护的全球存量资产；RobotBelt 提供中国海洋经济视角；Shihang 自己的披露则提供早期订单。这些数字只能形成方向性支持，不能直接相加：船舶数量、载重吨、与 GDP
