      - number: '5.2'
        title: 架构、自治能力与技术差异化
        blocks:
          - type: paragraph
            body: >-
              保留来源反复出现的技术主线是纵向整合。多篇 2026 年 6 月报道称，Shihang 自研六个核心系统——动力、控制、感知、导航、密封以及部署或回收——并将这些子系统与 2026-04-25 发布的
              CEORION 海洋具身模型结合。公司称，CEORION
              采用统一端到端架构，以商业运营数据和仿真数据训练，因此一个模型可以支持多类水下任务，无需频繁切换模型。如果这一说法准确，关键差异化就在于：通用自治技术栈叠加在机器人硬件之上，而不是为每项任务各自搭建自动化孤岛。公开证据仍没有达到可发布系统图、集成接口或独立基准方法的程度，因此架构方向清晰，但还不能深度审计。
