            body: >-
              Shihang 的公开成熟度依据分为两层。第一，公司相关融资报道称，其机器人已经在 0-10000 米深度范围内运行，并进入船舶清洁、海上能源、水产养殖、安防和海底巡检场景。第二个独立验证点是，MPA 选中
              SEAHI Robotics，与另外五家伙伴一起参加新加坡港水下船体巡检和清洁试验，技术验证将在 2026 年下半年开始的真实运营条件下进行。这一点很重要，因为 MPA
              也明确列出了真正的工程瓶颈：复杂船体几何、强流、船边狭窄作业空间、碎屑收集，以及在不影响港口交通的情况下安全运行。换句话说，Shihang
              已从泛泛的机器人叙事进入真实港口验证项目，但最难的可靠性和环境适应性问题仍在测试中，并未被解决。
