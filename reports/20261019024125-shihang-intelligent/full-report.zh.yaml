        title: 身份、阶段与业务范围
        blocks:
          - type: paragraph
            body: >-
              保留的 2026 年 6 月报道一致将 Shihang Intelligent
              定义为一家私营海洋具身智能公司，打造通用型水面和水下机器人，而不是单点工具供应商。公开叙事在业务范围和技术野心上最扎实：多家来源描述其产品覆盖清洁、巡检、抓取及相关水下流程；6 月和 4 月报道还将这一范围与
              CEORION 具身模型、全海深部署说法联系起来。可以确认的是公司的当前阶段：它已获得风险资本支持，在 2026 年早先的 A+ / A++ 轮之后又完成了规模很大的 6 月 Series
              A，并用这笔资金推进核心研发和全球化。尚未被独立确认的是完整总部和法律实体版图；融资报道只明确提到一家以苏州命名的运营实体。
