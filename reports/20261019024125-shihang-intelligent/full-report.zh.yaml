        - 优先关注水下清洁和碎屑捕获的运营方
        - 直接比拼捕获效率、过滤能力和每小时清洁面积
        - 留存证据没有显示其在船体清洁之外的公开业务广度
      - - 潜水员主导 / 人工清洁团队
        - 现有主流方案
        - 留存证据将其描述为服务模式，而非创业公司规模
        - 需要在两次进坞维修之间立即获得清洁能力的船东
        - 作业上熟悉的现有基准
        - MPA 称该工作流劳动密集、受安全约束且受人手限制
      - - 清洁优化分析与排程工具
        - 替代方案 / 补充工具
        - arXiv 案例在 10 艘船上完成验证，而非基于已披露的机器人船队
        - 船东优化清洁时机，而不是选择由谁提供机器人
        - 把清洁时间排得更高效，从而改善 ROI
        - 不会替代实体巡检 / 清洁服务商
    notes: 仅使用指定资料池；点名的非 Shihang 同业行依赖 MPA / MarineLink 的群组披露，因此未披露的融资、定价和客户细节显示为未知，而不是凭空推测。
