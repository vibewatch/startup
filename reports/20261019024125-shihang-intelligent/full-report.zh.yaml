            body: >-
              现有证据只支持有限的公开控制能力叙事。积极的一面是，新加坡真实港口项目明确评估安全性、成本效益、环境可持续性，以及对全球要求和标准的遵循；Shihang 至少进入了一个会检验这些控制项的工作流程。在中国，2024
              年国家 AI 标准化通知也显示，具身 AI
              说法处在日益正式的政策环境中。但投资人不应把这一背景误认为公司已经完成了证明。保留材料没有提供公开的集成文档、产品安全或隐私项目、详细认证清单、正常运行时间、碎屑收集结果、故障率数据或有意义的开发者信号证据。因此，产品准备度虽然高于纯概念公司，但技术尽调所需的文件仍不够。
