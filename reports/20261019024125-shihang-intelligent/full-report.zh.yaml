      - CV009
      - CV010
      - CV011
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 订单转化为经审计的收入增长，在新加坡级别的部署中通过过滤和网络安全门槛，后续融资条款也继续对投资者友好。
        - 只有出现经审计的证据后，品类领先和更快商业化才可能支撑估值溢价。
        - 执行延误、隐藏的优先股堆叠或偏弱的毛利率，都可能抹去这部分溢价。
        - 关注公司披露的部署 KPI 和经审计的收入质量。
      - - 基准
        - 这轮融资主要证明投资者有兴趣，商业化证据仍在逐步累积。
        - 公允价值依然难以锚定，保持纪律性跟踪比激进入场更合适。
        - 收入转化可能落后于公开订单规模，技术说法也可能仍部分来自公司自述。
        - 公开证据有所增加，但仍缺少硬性的价格锚点。
      - - 悲观
        - 公开条款仍然不透明，海外试点表现不佳，或运营数据经检验后，后续融资重新设定价格。
        - 融资标题变成薄弱的参考，风险下行来自在证据出现前先为叙事买单。
        - 下轮融资风险、商业化拖延和合规延误成为主导因素。
        - 披露缺口持续存在，里程碑证据也继续滞后。
    notes: 这是按里程碑搭建的情景框架，不是精确的倍数模型；公开资料没有披露足以支持可信收入或 EBITDA 可比估值的估值分母。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
