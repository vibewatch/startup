    title: 竞争定位图
    type: quadrant
    summary: 定位采用序数评分，依据是指定证据披露的公开业务范围，以及外部可见的买方验证信号强弱。
    data:
      xAxis:
        label: 公开解决方案广度（1=窄 / 单一工作流，5=多任务平台）
        min: 1
        max: 5
        lowLabel: narrow
        highLabel: broad
      yAxis:
        label: 买方验证信号（1=传统 / 证据有限，5=规模化订单或获资助的真实港口验证）
        min: 1
        max: 5
        lowLabel: limited proof
        highLabel: strong proof
      points:
        - label: SEAHI / Shihang
          x: 5
          'y': 5
          note: 留存证据中的公开任务范围最广，且融资 >RMB1bn、上半年订单 >RMB1bn，并入选新加坡试验。
        - label: 其他入选新加坡项目的机器人同行
          x: 3
          'y': 4
          note: 这一直接可比群体通过 MPA 入选获得了外部买方验证，但指定证据对其公开业务范围和规模细节披露较少。
        - label: 以巡检为先的机器人系统
          x: 2
          'y': 3
          note: MPA 将巡检视为独立的系统类别，重点在报告、分类和靠泊作业。
        - label: 以清洁为先的机器人系统
          x: 2
          'y': 3
          note: 直接船体清洁竞争者要在港口规则下接受捕集效率、过滤和吞吐量评估。
        - label: 潜水员主导 / 人工清洁
          x: 1
          'y': 2
          note: 这一存量工作流仍在使用，但 MPA 称其劳动密集、风险高且受人力约束。
        - label: 清洁优化分析
          x: 1
          'y': 3
          note: 软件替代方案可以提高清洁 ROI，但仍依赖独立的实体清洁服务商。
    approximationNotes: 坐标轴是基于证据的序数评分，来自留存来源披露的业务范围和验证信号；它们不是经过测量的市场份额、赢单率或基准性能数值。
    claimRefs:
      - CP003
      - CP005
      - CP007
      - CP009
      - CP010
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据支持一条从生物污损带来的客户需求到订单的服务驱动链路，但尚不足以证明最终能转化为确认收入和毛利。
    data:
      nodes:
        - id: demand
          label: 生物污损痛点
          value: Higher drag, fuel use, and emissions create recurring cleaning demand.
        - id: service
          label: 机器人船体作业
          value: Shihang targets inspection and cleaning plus adjacent subsea missions.
        - id: qualification
          label: 资质门槛
          value: Ports and regulators require safe, debris-controlled, measurable execution.
        - id: orders
          label: 订单
          value: Publicly disclosed 2026 H1 orders exceeded RMB 1bn.
        - id: revenue
          label: 确认收入
          value: Public sources do not disclose acceptance timing, realized pricing, or collections.
        - id: gross-profit
          label: 毛利润
          value: Margin depends on throughput, labor, capture, filtration, and rework.
      edges:
        - from: demand
          to: service
          label: 催生需求
        - from: service
          to: qualification
          label: 必须满足
        - from: qualification
          to: orders
          label: 可以赢得项目和试验
        - from: orders
          to: revenue
          label: 必须经交付和开票转化
        - from: revenue
          to: gross-profit
          label: 扣除变动运营成本后
    approximationNotes: 这是根据公开运营披露搭建的概念性桥接，不推断未披露的转化率或利润率。
    claimRefs:
      - CI003
      - CI005
      - CI007
      - CI010
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Shihang 的公开技术栈从训练数据出发，经由自主系统和机器人硬件，延伸到应用工作流及外部监督的试验。
    data:
      layers:
        - label: 训练数据与仿真
          detail: 商业作业数据和仿真数据是 CEORION 训练所称的输入。
          items:
            - 商业作业数据
            - 仿真数据
          outputs:
            - 可供模型训练的数据集
        - label: CEORION 具身模型
          detail: 公司披露的端到端层，负责环境感知、任务理解和动作生成。
          modules:
            - 感知
            - 任务理解
            - 动作生成
          outputs:
            - 统一自主策略
        - label: 六大机器人核心子系统
          detail: 硬件与控制技术栈被反复描述为自主研发。
          modules:
            - 动力
            - 控制
            - 感知
            - 导航
            - 密封
            - 部署与回收
          outputs:
            - 全深度海洋机器人能力
        - label: 机器人平台
          detail: 水面和水下机器人及其配件，把自主技术栈带入现场作业。
          items:
            - 海洋机器人
            - 水面机器人
            - 核心配件
          outputs:
            - 可运营的机器人机队
        - label: 应用工作流
          detail: 公开提及的作业覆盖清洁、巡检、安防、能源和水产养殖场景。
          items:
            - 船体清洁
            - 水下巡检
            - 海洋安防
            - 海上风电与光伏
            - 海洋牧场
          outputs:
            - 场景化服务交付
        - label: 外部验证与合规
          detail: 新加坡真实港口试验是指定资料池中最强的独立成熟度检查点。
          modules:
            - MPA 试验
            - MINT 联合资助
            - 真实港口合规检查
          outputs:
            - 真实港口条件下的现场验证
    approximationNotes: 这些分层是对指定来源的分析综合，不是厂商发布的系统架构图。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE007
      - CE008
      - CE009
      - CE010
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开可见的客户拓展路径从危险的船舶维护痛点出发，经由运营验证扩展到相邻基础设施和海外目标，但越往后公开证据越少。
    data:
      items:
        - label: 识别危险维护痛点
          actor: 船舶运营商 / 技术主管
          stage: 问题识别
          touchpoints:
            - 潜水员安全、船体污损和周转压力，让水下维护成本高昂。
            - Wedoany 将清洁与航行阻力、燃料使用、碳排放和港口周转时间联系起来。
          tone: neutral
        - label: 现场部署验证滩头市场
          actor: 港口现场和船舶运营团队
          stage: 首次部署
          touchpoints:
            - 百度百科将青岛港和烟台港列为部署场景。
            - 早期证据是运营层面的，不是财务层面的。
          tone: positive
        - label: 航运客户成为具名参考案例
          actor: 船队运营商
          stage: 生产使用
          touchpoints:
            - Wedoany 点名 China Merchants Energy Shipping 和 COSCO Bulk 为用户。
            - 同一篇文章称累计维护作业已覆盖超过 1,000 艘大型船舶。
          tone: positive
        - label: 订单扩张快于客户经济性披露
          actor: 管理层和投资者
          stage: 规模化
          touchpoints:
            - Wedoany 和 10jqka 称 2026 年上半年订单超过 RMB1 billion。
            - 公开资料仍未披露客户数量、NRR 或合同期限。
          tone: warning
        - label: 相邻海洋基础设施是扩张切入口
          actor: 海上和海底运营商
          stage: 相邻领域扩张
          touchpoints:
            - Gasgoo 和 10jqka 提到海上风电、海洋牧场、海床巡检和水下安防场景。
            - 这些相邻领域的付费客户名称尚未公开披露。
          tone: warning
        - label: 海外落地仍是判断，并非已验证的牵引力
          actor: 全球港口和渠道
          stage: 地理扩张
          touchpoints:
            - 融资报道称，资金将支持全球市场扩张。
            - Wedoany 提到 Shihang 在新加坡、欧洲、中东和东南亚的接受度上升，但留存来源没有点名海外付费客户。
          tone: risk
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU007
      - CU008
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在必须向第三方运营商证明正式合规和恶劣环境可靠性的地方，剩余风险敞口最高。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解成熟度
        - label: 剩余敞口
      rows:
        - label: 海外合规与认证
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 参与中国标准制定有帮助，但留存资料没有列出具体的海外批准。
            - label: 高
              tone: high
        - label: 恶劣环境可靠性
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 六大核心系统和模型发布是缓解风险的信号，但不是独立的闭环证明。
            - label: 高
              tone: high
        - label: 网络安全 / 控制保障
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
              note: 留存资料池中没有出现具名的安全鉴证或审计证据。
            - label: 高
              tone: high
        - label: 资本密集度
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: '>RMB1 billion 的融资确实能缓解风险，但资金已指定用于持续建设。'
            - label: 中
              tone: medium
        - label: 合作伙伴 / 终端用户验证
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
              note: 订单和融资有所帮助，但多元化的国际参考案例尚未公开。
            - label: 高
              tone: high
        - label: 全球服务规模化执行
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
              note: 可服务船队遍布全球，相比一家刚完成融资的初创公司，存量玩家的预算规模更大。
            - label: 高
              tone: high
    claimRefs:
      - CR004
      - CR006
      - CR008
      - CR010
      - CR011
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这项建议沿着一条顺序链展开：先看真实市场需求和融资实力，再看估值透明度和执行门槛。
    data:
      nodes:
        - id: market-need
          label: 巨大的海事需求
          note: 全球船队规模达 25 亿 dwt，燃料和排放激励也让船体性能维护具备经济意义。
          claimRefs:
            - CV008
        - id: regulatory-tailwind
          label: 监管正在收紧
          note: 生物污损指南正转向更明确的清洁、废弃物捕集和认证要求。
          claimRefs:
            - CV006
            - CV007
        - id: financing-signal
          label: 资本信号强
          note: 公司宣布完成超过 RMB 1b 的 A 轮融资，并获得老股东跟投支持。
          claimRefs:
            - CV001
            - CV002
            - CV003
        - id: commercial-proof
          label: 商业证据有希望但不完整
          note: 订单和部署令人鼓舞，但不等于经审计的收入质量或客户留存。
          claimRefs:
            - CV004
            - CV005
        - id: price-opacity
          label: 价格仍不透明
          note: 公开资料没有披露投后估值、优先权、稀释情况或经审计的单位经济性。
          claimRefs:
            - CV010
            - CV013
        - id: recommendation
          label: 继续研究
          note: 保持尽调，但在判断入场前先等待价格和运营证据。
          claimRefs:
            - CV011
            - CV012
            - CV014
      edges:
        - from: market-need
          to: regulatory-tailwind
          label: 转化为
        - from: regulatory-tailwind
          to: financing-signal
          label: 支持关注
        - from: financing-signal
          to: commercial-proof
          label: 为……提供资金
        - from: commercial-proof
          to: price-opacity
          label: 受……约束
        - from: price-opacity
          to: recommendation
          label: 驱动
    approximationNotes: 仅表示逻辑顺序；该流程不代表加权概率或数值估值模型。
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV010
      - CV012
