      - number: '3.2'
        title: 采购标准与定价不透明
        blocks:
          - type: paragraph
            body: >-
              公开定价是比较中最薄弱的部分。保留来源没有一家披露 Shihang 或新加坡入选同业的目录价格、标准合同期限或按船归一化的经济性，因此商业竞争仍通过能力和试验要求描述，而不是清晰的价目表。MPA
              的挑战文件展示了买方真正评估的内容：复杂船体几何下的表现、强流和狭窄泊位中的可靠运行、废弃物收集与过滤、自动报告、生产效率以及可证明的成本效益。这套框架压缩了“机器人供应商”和“港口级服务运营商”的差别：技术亮眼的平台仍须先证明能在真实港口安全、合规且可重复地部署，定价权才可信。
            claimRefs:
              - CP005
              - CP006
              - CP008
