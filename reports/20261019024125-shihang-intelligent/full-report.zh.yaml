  - id: TV002
    title: 正 / 反论点表
    columns:
      - 立场
      - 论点
      - 哪些信息会改变判断
    rows:
      - - 正论点
        - 2026 年 6 月超过 RMB 1 billion 的 A 轮融资且有老股东复投，说明这家 2023 年成立的海洋机器人公司获得资本的能力异常强。
        - 如果完整披露条款，并经审计证明资金已转化为收入和利润率改善，论据会更有力。
      - - 正论点
        - IMO 和港口层面的船体清洗要求创造了对检测与清洗自动化的真实需求，而非纯粹的投机性市场。
        - 受监管港口公布部署 KPI 后，需求逻辑才会变成可投资证据。
      - - 正论点
        - 据称，公司已将产品部署到清洁、安防、风电、海洋牧场和海底巡检等场景；只要数据经得起验证，这说明平台覆盖面很广。
        - 独立客户背书或经审计的分部收入，才能确认这种广度。
      - - 反方观点
        - 公开资料没有披露投后估值、清算优先权或稀释情况，因此仅凭融资规模无法推导出合理的入场价格。
        - 签署版条款清单摘要或股东披露可以补上这一缺口。
      - - 反方观点
        - 已披露的订单势头不等于确认收入、利润率、现金转化或续约。
        - 经审计的财务报表和按客户群组展示的留存数据，才能实质性降低这一判断的风险。
      - - 反方观点
        - 独立行业证据仍显示，高端市场由成熟的海外玩家主导；只靠叙事，能够支撑的估值溢价有限。
        - 第三方证明公司能持续跑赢头部存量玩家，才能缓解这一反方意见。
    notes: 这些行把有证据支撑的正面因素，与价格驱动型建议改善前仍需补齐的具体尽调事项分开。
