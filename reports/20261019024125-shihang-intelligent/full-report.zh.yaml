              参加真实港口中的船体巡检与清洁试验。因此，收入可能来自船舶服务作业、任务型项目交付，以及在受监管港口商业化机器人作业能力。已披露的最强业务进展指标是 2026 年上半年超过 RMB 1b
              的订单额，但同一组公开材料没有说明其中多少转化为确认收入、交付周期多长，或付款里程碑和毛利如何。
