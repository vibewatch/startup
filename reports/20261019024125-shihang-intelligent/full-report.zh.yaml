        - 在港口环保规则下，人工工作流可能带来更高的运营复杂度
        - 合规硬件和流程设计是直接的竞争变量
      - - 在不影响货运的情况下适应狭窄港口环境
        - 等待新加坡试验提供公开证明
        - 同业群组有明确的运营港口验证路径
        - 现有人工工作流仍在使用，但劳动密集
        - 最接近同口径的比较将来自靠泊现场表现
      - - 自动化报告与附着物分类
        - Shihang 更广泛的自主作业叙事暗示其软件能力较强，但留存证据没有直接公开这一模块
        - 巡检系统同业需要实现报告和附着物分类自动化
        - 人工巡检仍然更慢，也更依赖操作员
        - 在买方评估中，软件工作流质量可能与机器人硬件同等重要
      - - 船体清洁之外的任务广度
        - 在留存证据中，其公开范围最广，覆盖安防、风电、海洋牧场和海床巡检
        - 指定证据显示同业与船体清洁相关，但没有显示各自更广泛的任务范围
        - 分析类替代方案可以优化清洁时机，但不执行水下作业
        - Shihang 公开披露的最佳优势是平台广度，而非透明的价格领先
    notes: 不受支持的单元格标记为等待公开证据；留存来源对买方标准和同业参与的界定，比对各供应商基准分数的披露更清晰。
