            body: >-
              最具体的公开估值信号是：Shihang 于 2026 年 6 月完成超过 RMB 1b 的 A
              轮，且该轮似乎吸引了新的战略投资人和早期支持者的大额跟投。这很重要，因为它降低了近期融资风险，也给管理层继续资助研发和海外扩张的资本。但它没有回答今天入场的投资人最关心的问题：公开来源仍未披露投后估值、每股价格、稀释、清算优先权或经审计的收入质量。没有这些条款，这轮融资只能证明市场愿意为故事买单，不能证明价格公平。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV013
