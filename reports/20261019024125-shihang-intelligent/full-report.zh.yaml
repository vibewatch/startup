      - number: '2.3'
        title: 买方、使用者与付款方结构
        blocks:
          - type: paragraph
            body: >-
              现有材料中最清晰的买方证据来自船体巡检和清洁：船东和运营商是明确的主要终端用户，港口环境限制作业方式，监管机构或港口管理方则决定可接受的安全、废弃物收集和运营标准。在这一流程里，机器人由巡检或清洁团队使用，但经济买方对应船舶运营预算，因为燃油效率、停机时间和周转时间决定
              ROI。公司报道暗示业务还会延伸到海上能源、海洋牧场和海底安防，但这些细分市场的预算负责人证据远薄于港口服务场景。
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: 采用驱动因素、约束与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素是具体且运营导向的，而非投机性的：生物污损会增加阻力、燃油消耗和排放；水下清洁可减少对干船坞的依赖，让船舶继续工作；低能见度、腐蚀性强、流速高的环境又让海事劳动力既稀缺又危险。约束同样明确。公开买方标准仍要求机器人在恶劣环境下稳定运行、靠近泊位作业时不打扰货运、覆盖更复杂的船体几何形状、可靠收集和过滤废弃物、具备强网络安全能力，并证明服务产能可以扩张。Shihang
              披露的订单势头令人鼓舞，但本章仍缺少合同结构、续约行为、定价和按流程拆分的收入转化数据，因此市场测算仍明显不完整。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
