  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与具名同业群组
        blocks:
          - type: paragraph
            body: >-
              现有证据支持按解决方案类别构建竞争地图，而不是制作一份完整披露的逐家同业评分卡。在这组材料中，Shihang
              是唯一一家公开声称覆盖船体清洁、水下安防、海上风电、海洋牧场和海床巡检等广泛场景的公司；多家独立媒体也重复报道了 >RMB1 billion 的 Series A 和 >RMB1 billion 的 2026
              年上半年订单。就直接船体清洁竞争而言，最具体的外部验证来自新加坡 MPA 项目：SEAHI Robotics 与 Alicia Bots、C-Leanship、Neptune Robotics、Oceanis
              Robotics 和 RINA 同属入选队列。因此，最接近买方验证的比较集合不是泛泛的“海洋机器人”宇宙，而是一个正在港口运营中接受同一组约束检验的候选名单。
