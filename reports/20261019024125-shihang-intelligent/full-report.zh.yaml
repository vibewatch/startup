  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入的工作流程
        blocks:
          - type: paragraph
            body: >-
              现有证据支持把 Shihang 的可服务市场严格界定为海事资产维护和海底作业自动化，而不是更宽泛的“具身
              AI”或通用机器人行业。新闻来源反复出现的商业切入口，是人类潜水员和传统进口设备难以、安全性低或重复性高的工作：船体清洁、海底巡检与安防、海上风电和光伏维护、海洋牧场以及深海勘探。这样的边界更有用，因为它对应公开买方已经表达的运营痛点；相比之下，广义海洋经济和全球船队规模只是背景上限，并不等于
              Shihang 当前产品可以直接服务的支出。
