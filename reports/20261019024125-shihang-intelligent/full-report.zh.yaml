      - number: '4.2'
        title: 成本结构与单位经济性
        blocks:
          - type: paragraph
            body: >-
              成本结构看起来主要由难以自动化的现场执行驱动，而非纯软件交付。MPA
              自己的问题说明指出，当前水下船体方案仍难以应对复杂船体几何、强流、靠泊侧狭窄作业空间、碎屑收集和具备成本效益的规模化；试验项目还明确要求团队证明生产效率、人力效率、节油效果和过滤性能。挪威拟议的生物污损监管又增加了一重压力：存在大型污损的船舶在挪威水域作业前或作业期间必须清洁，但监管方也指出，             
              目前没有被国际普遍接受的清除污损处理标准。因此，只有在提高作业吞吐量和可靠性的同时，消化收集、过滤、合规和返工成本，利润率扩张才有可能；而这些成本目前尚未被公开来源量化。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
