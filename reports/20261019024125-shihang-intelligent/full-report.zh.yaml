      - number: '7.4'
        title: 尽调触发条件与退出标准
        blocks:
          - type: paragraph
            body: >-
              尽调路径应紧扣可量化的闭环测试，而不是叙事势头。积极更新应包括具名海外港口或船级批准、经独立验证的废弃物收集和网络安全控制、可重复的正常运行时间及清洁结果现场 KPI，以及证明 2026
              年订单基础正在转化为经审计收入而非一次性试点。消极更新则相反：资本继续增加，却没有相应的认证部署、订单或服务密度证明；业务集中在少数交易对手；或者全球抱负与公开交付准备度证据之间的差距扩大。在这些检查完成前，公司值得继续研究，但尚未降到足以把规模化视为例行执行的风险水平。
