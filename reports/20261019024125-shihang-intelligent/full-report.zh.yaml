      - number: '3.3'
        title: 护城河持续性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Shihang 的公开护城河叙事建立在覆盖面和运营难度上。新闻报道反复引用公司说法：公司掌握六个核心子系统，支持 0 到 10,000
              米全深度作业，且已经部署到多个水下场景，因此看起来比单一用途的船体清洁机器人更宽。但同一组证据也说明护城河仍应视为暂时性的。MPA 明确表示现有机器人方案仍有未解决的缺口，RobotAIGeek
              则把核心战略风险概括为“复制前先做大”：如果资金更充足的竞争者在 Shihang
              把试验和订单转化为可重复的服务基础设施之前，就复制足够多的核心技术栈，那么公司今天的领先优势会收窄。近期最强的差异化因素因此更可能是标准化姿态、运营证明和客户验证，而非单纯募资规模。
            claimRefs:
              - CP004
              - CP006
              - CP011
              - CP012
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 护城河取决于港口级执行，而不只是资本
            body: 保留证据显示，真实港口中的执行标准才是关键分水岭。Shihang 的资本和订单信号很强，但 MPA 的要求表明，买方最在意的仍是实际运营中的几何形状处理、碎屑收集、过滤、生产效率以及符合标准的报告。
            calloutType: risk
            claimRefs:
