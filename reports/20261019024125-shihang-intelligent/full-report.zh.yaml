  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 已交付平台与产品范围
        blocks:
          - type: paragraph
            body: >-
              公开报道一致将 Shihang
              描述为通用型海洋机器人公司，而非单点产品供应商。融资报道称，公司开发、生产、销售并服务海洋机器人、水面机器人和核心配件，同时把已部署产品定位于船体清洁、海底安防、海上风电和光伏维护、海洋牧场以及海底巡检等高风险海事流程。最有证据支持的解读是：Shihang
              试图销售一个可复用的软硬件平台，让应用可以在多种水下任务之间重新配置，而不是只卖一次性清洁机器人。仍然缺少的是公开 SKU 图谱、具名商业套餐或产品文档，投资人无法据此区分成熟交付物和更宽泛的平台愿景。
            claimRefs:
              - CE001
