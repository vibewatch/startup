        title: 展示项
        blocks:
          - type: callout
            title: 存量需求真实存在；可服务支出仍未被证明
            body: 公开证据充分说明全球海事资产存量以及港口和运营商为何需要水下机器人，但尚未说明在 Shihang 当前定价和部署能力下，其中有多少存量是公司能拿到预算的部分。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM008
              - CM013
          - type: callout
            title: 订单验证的是紧迫性，而不是经常性经济性
            body: Shihang 披露的 2026 年上半年订单量是有用的市场信号，但公开来源没有说明其中多少属于经常性服务收入、合同如何按工作流程拆分，也没有说明续约和取消行为。
            calloutType: risk
            claimRefs:
