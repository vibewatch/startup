              年海洋机器人经历，以及参与中国首台商用水下清洁机器人的过往。这为一家技术难度高的海洋系统公司提供了可信的创始人与市场匹配故事。反面是治理透明度不足：在这组材料中，公开来源没有列出更广泛的董事会、CFO、COO
