      - number: '8.2'
        title: 论点建立在真实需求和技术广度上，反论点则是商业化证据
        blocks:
          - type: paragraph
            body: >-
              上行情景很容易描述。海事运营商拥有规模庞大的全球存量资产，生物污损带来可量化的燃油和排放痛点，监管机构也在推动更规范的船体管理。与多数早期海洋机器人同业相比，Shihang
              的公开融资信号更强，并且声称已广泛部署到清洁、巡检、海上能源和安防场景。反论点是，很多公开证明仍来自公司主导的披露。超过 RMB 1 billion
              的订单令人鼓舞，但公开来源尚未显示经审计的收入转化、持续毛利率或留存经济性；独立市场数据仍称高端市场由成熟的海外玩家主导。
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景框架应使用里程碑，而不是虚假的精确度
        blocks:
          - type: paragraph
            body: >-
              对 Shihang
              更合适的估值框架是基于里程碑，而不是基于倍数。公开证据支持一个规模很大的海事需求、近期一轮强融资和声称的商业化进展，但收入分母仍不透明，无法支持可辩护的收入倍数。因此，合适的可比背景应结合行业需求、前沿技术的执行难度和公司自身融资里程碑。乐观情景下，经审计的收入转化和成功的港口部署可以支撑溢价叙事；基准情景下，这轮融资仍只是兴趣证明；悲观情景下，未披露的条款加上执行延误，可能使下一轮融资或二级入场远不如
              headline 轮次规模看起来有吸引力。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 最终观点：在价格和经营证明收紧前继续研究
        blocks:
          - type: paragraph
            body: >-
              建议维持对价格的敏感度。Shihang
              已有足够证据值得继续尽调，因为市场需求、监管势头和融资支持都是真实的。但下一步必须把叙事证明变成投资证明：明确轮次条款、经审计的收入确认、订单簿质量、集中度、利润结构和可量化的海外试验结果。最清晰的论点破坏触发条件，是披露的股权结构表明显薄弱、无法证明订单公告真正转化为收入和现金回收，或无法在新加坡级别部署中达到港口清洁、过滤、网络安全和认证标准。在这些数据公开之前，审慎立场应是继续研究，而不是凭信念买入。
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 把公司留在尽调名单里，不要盲目追价
            body: Shihang 的融资信号强到不能忽略，但公开记录在价格和经济性上仍然过于单薄，不足以支持高确信度入场。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV012
          - type: callout
            title: 真正的下行风险，是在证明之前为叙事买单
            body: 大额融资和大额订单 headline 可以与后续失望并存，尤其当经审计收入转化、合规清关或海外部署指标没有跟上时。
            calloutType: risk
            claimRefs:
              - CV004
              - CV010
              - CV014
