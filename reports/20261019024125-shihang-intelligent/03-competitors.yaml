schemaVersion: "report-v2"
artifact: competitors
slug: shihang-intelligent
runDate: 2026-10-19
company:
  name: Shihang Intelligent
chapter:
  number: 3
  title: Competitors
  summary: >-
    Shihang's strongest public competitive signal is not a transparent price sheet but the combination of
    outsized financing, publicly reported orders, and inclusion in Singapore's live-port hull-cleaning
    trials. The harder question is durability: the assigned evidence suggests that compliance, waste-capture,
    and service execution in difficult port conditions will decide the direct hull-cleaning fight more than
    marketing claims alone.
sections:
  - id: competitive-landscape
    title: Competitive landscape and named peer cohort
    body: >-
      The assigned evidence supports a competition map built around solution classes rather than a fully
      disclosed peer-by-peer scorecard. Shihang is the only company in this pool with broad public claims
      across hull cleaning, underwater security, offshore wind, marine ranching, and seabed inspection, and
      multiple independent outlets repeat both a >RMB1 billion Series A and >RMB1 billion H1 2026 order
      figure. For direct hull-cleaning competition, the most concrete external proof is Singapore's MPA
      program: SEAHI Robotics appears in the same selected cohort as Alicia Bots, C-Leanship, Neptune
      Robotics, Oceanis Robotics, and RINA. That means the nearest buyer-validated comparison set is not a
      generic "marine robotics" universe, but a live port-operations shortlist where multiple robotic
      approaches are being tested against the same operating constraints.
    claimRefs: [CP001, CP003, CP007, CP010]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buying-criteria-and-pricing
    title: Buying criteria and pricing opacity
    body: >-
      Public pricing remains the weakest part of the comparison. None of the retained sources publishes
      catalog pricing, standard contract length, or normalized per-vessel economics for Shihang or the
      Singapore-selected peer set, so the commercial contest is still being described through capabilities
      and trial requirements instead of clean price cards. MPA's challenge statement shows what buyers are
      actually underwriting: performance on complex hull geometry, reliable operation in strong currents and
      tight berths, waste capture and filtration, automated reporting, productivity, and demonstrable
      cost-effectiveness. That framework compresses the difference between "robot vendor" and "port-grade
      service operator": a technically impressive platform still has to prove safe, compliant, repeatable
      deployment in live port conditions before pricing power is believable.
    claimRefs: [CP005, CP006, CP008]
    tableRefs: [TP002, TP003]
  - id: moat-durability
    title: Moat durability and displacement risk
    body: >-
      Shihang's public moat case rests on breadth and operating difficulty. News coverage repeats the
      company's claim that it controls six core subsystems, supports full-depth operations from 0 to 10,000
      meters, and is already deployed across several underwater scenarios, which makes it look broader than
      a single-purpose hull-cleaning robot. But the same evidence also shows why the moat should be treated
      as provisional. MPA explicitly says current robotic solutions still have unresolved gaps, and
      RobotAIGeek frames the central strategic risk as scale-before-replication: if better-capitalized rivals
      can copy enough of the core stack before Shihang converts trials and orders into repeatable service
      infrastructure, today's lead can narrow. The strongest near-term differentiators therefore appear to be
      standards posture, operational proof, and customer validation rather than capital raised alone.
    claimRefs: [CP004, CP006, CP011, CP012]
tables:
