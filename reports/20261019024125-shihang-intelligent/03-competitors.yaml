    title: Competitor profile table
    columns:
      - Competitor / alternative
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - [Shihang / SEAHI Robotics, direct platform vendor, ">RMB1bn Series A and >RMB1bn H1 2026 orders reported publicly", "Ship hull cleaning plus broader underwater inspection and maintenance", "Only retained player with broad disclosed mission set and large public financing/order signals", "Public pricing and independent benchmark data remain undisclosed"]
      - ["Other Singapore-selected robotic peers (Alicia Bots, C-Leanship, Neptune Robotics, Oceanis Robotics, RINA)", direct hull-cleaning peer cohort, "~SGD3.7m total MPA co-funding shared across six selected partners; per-company scale undisclosed", "Live-port hull inspection and cleaning in Singapore", "Externally validated buyer shortlist for the same procurement problem", "Assigned evidence does not disclose per-peer scale, packaging, or comparative performance"]
      - ["Inspection-first robotic systems", adjacent specialist, "MPA CFP recognizes the class but gives no vendor-level scale in assigned evidence", "Operators prioritizing fouling assessment, reporting, and classification", "Can automate inspection, reporting, and fouling classification without a full cleaning workflow", "Still must prove berth-side productivity and limited-space operation"]
      - ["Cleaning-first robotic systems", direct specialist, "MPA CFP recognizes the class but gives no vendor-level scale in assigned evidence", "Operators prioritizing in-water cleaning and debris capture", "Competes directly on capture efficiency, filtration, and area cleaned per hour", "Public breadth outside hull cleaning is not shown in the retained evidence"]
      - ["Diver-led / manual cleaning crews", incumbent status quo, "Service model rather than venture scale in retained evidence", "Shipowners needing immediate cleaning capacity between dry dockings", "Operationally familiar incumbent benchmark", "MPA says the workflow is labor-intensive, safety-constrained, and manpower-limited"]
      - ["Cleaning-optimization analytics and scheduling tools", substitute / complement, "arXiv example validated on ten vessels rather than a disclosed robotics fleet", "Owners optimizing when to clean rather than who provides the robot", "Can improve ROI by timing cleaning events more efficiently", "Does not replace the physical inspection/cleaning provider"]
    notes: >-
      Uses only the assigned evidence pool; named non-Shihang peer rows rely on MPA/MarineLink cohort
      disclosure, so undisclosed funding, pricing, and customer detail are shown as unknown rather than guessed.
    claimRefs: [CP001, CP005, CP007, CP009, CP010]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Shihang / SEAHI public signal
      - MPA-selected peer cohort
      - Status quo / substitute
      - Evidence-backed implication
    rows:
      - ["Complex hull geometry (propellers, rudders, sea chest)", "No direct benchmark disclosed; company-backed sources position Shihang as multi-scenario and full-depth", "Selected peers are entering trials against this criterion", "Diver/manual crews can address hard geometry but at higher safety/manpower cost", "Winning bids will depend on proof in difficult geometry, not generic autonomy claims alone"]
      - ["Debris capture and effluent filtration", "No published metric in retained evidence", "Peer cohort is being tested against MPA debris-capture and filtration rules", "Manual workflows risk more operational complexity under port environmental rules", "Compliance hardware and process design are direct competitive variables"]
      - ["Operate in tight port conditions without disrupting cargo", "Public proof pending from Singapore trials", "Peer cohort has explicit live-port validation path", "Incumbent manual workflow remains used today but is labor-intensive", "The closest apples-to-apples comparison will come from berth-side field performance"]
      - ["Automated reporting and fouling classification", "Shihang's broader autonomy narrative suggests software strength, but retained evidence does not publish this module directly", "Inspection-system peers are being asked to automate reporting and fouling classification", "Manual inspection remains slower and more operator-dependent", "Software workflow quality can be as important as robot hardware in buyer evaluation"]
      - ["Mission breadth beyond hull cleaning", "Broadest public scope in retained evidence across security, wind, ranching, and seabed inspection", "Assigned evidence shows hull-cleaning relevance but not broader mission scope per peer", "Analytics substitutes help optimize cleaning timing but do not perform underwater work", "Shihang's best disclosed edge is platform breadth rather than transparent price leadership"]
    notes: >-
      Unsupported cells are marked as pending public evidence; the retained sources define buyer criteria and
      peer participation more clearly than they disclose per-vendor benchmark scores.
    claimRefs: [CP003, CP005, CP006, CP007, CP008]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Solution class
      - Public price / unit / contract model
      - Included capabilities
      - Unknowns / discounting
      - Implication
    rows:
      - ["Shihang / SEAHI deployments", "Not publicly disclosed in retained evidence", "Hull cleaning plus broader underwater inspection / maintenance scenarios", "Contract length, pricing unit, pilot-to-production step-up, and discounting are all undisclosed", "Commercial comparisons still have to rely on operational proof and customer references"]
      - ["Singapore-selected robotic peer cohort", "No public list pricing in retained evidence; MPA co-funding covers development/trial support rather than a buyer price card", "In-water inspection and/or cleaning solutions to be trialed in live port conditions", "Per-vendor package scope and shipowner commercial terms are undisclosed", "Peer competition is currently legible through trial design, not published pricing"]
      - ["Diver-led / manual cleaning services", "Service-fee model is implied but not quantified in retained evidence", "Incumbent inspection/cleaning execution between dry dockings", "Actual day rates, crew assumptions, and downtime costs are not disclosed here", "Status quo remains a procurement benchmark even without transparent public pricing"]
      - ["Cleaning-optimization analytics", "Paper demonstrates ROI potential but does not disclose software pricing", "Decision support for when to perform cleaning events", "License, subscription, and bundled-service economics are undisclosed", "Substitutes can shape buying behavior even when they do not execute the cleaning job"]
    notes: >-
      This table highlights disclosure quality rather than exact vendor economics; public price opacity is
      itself material because it shifts diligence toward pilot outcomes and operator references.
    claimRefs: [CP007, CP008, CP009]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on public scope disclosed in the assigned evidence and on the strength of
      externally visible buyer-validation signals.
    data:
      xAxis:
        label: "Public solution breadth (1=narrow/single workflow, 5=multi-mission platform)"
        min: 1
        max: 5
        lowLabel: "narrow"
        highLabel: "broad"
      yAxis:
        label: "Buyer-validation signal (1=legacy/limited proof, 5=scaled orders or funded live-port validation)"
        min: 1
        max: 5
        lowLabel: "limited proof"
        highLabel: "strong proof"
      points:
        - label: "SEAHI / Shihang"
          x: 5
          y: 5
          note: "Broadest public mission scope in retained evidence, plus >RMB1bn financing, >RMB1bn H1 orders, and Singapore trial selection."
        - label: "Other Singapore-selected robotic peers"
          x: 3
          y: 4
          note: "Named direct cohort has external buyer validation through MPA selection, but less public scope and scale detail in the assigned evidence."
        - label: "Inspection-first robotic systems"
          x: 2
          y: 3
          note: "MPA treats inspection as a distinct system class focused on reporting, classification, and berth-side operation."
        - label: "Cleaning-first robotic systems"
          x: 2
          y: 3
          note: "Direct hull-cleaning competitors are evaluated on capture efficiency, filtration, and throughput under port rules."
        - label: "Diver-led / manual cleaning"
          x: 1
          y: 2
          note: "Incumbent workflow is still used, but MPA says it is labor-intensive, risky, and manpower-constrained."
        - label: "Cleaning-optimization analytics"
          x: 1
          y: 3
          note: "Software substitutes can improve cleaning ROI, but they still rely on a separate physical cleaning provider."
    approximationNotes: >-
      The axes are evidence-backed ordinal scores derived from disclosed scope and validation signals in the
      retained sources; they are not measured market-share, win-rate, or benchmark-performance values.
    claimRefs: [CP003, CP005, CP007, CP009, CP010]
callouts:
  - calloutType: risk
    title: Moat depends on port-grade execution, not just capital
    body: >-
      The retained evidence suggests that live-port execution standards are the real separator. Shihang's
      capital and order signals are strong, but MPA's requirements show buyers still care most about geometry
      handling, debris capture, filtration, productivity, and standards-aligned reporting in real operations.
    claimRefs: [CP006, CP007, CP008, CP010]
