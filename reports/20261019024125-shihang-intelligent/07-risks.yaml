company:
  name: "Shihang Intelligent"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Shihang Intelligent's risk profile is led by international compliance and proof-of-performance risk rather than demand scarcity: the company disclosed a
    >RMB1 billion A round and >RMB1 billion of 2026 H1 orders, but public evidence still centers on company-claimed capability breadth, planned standards,
    and pilot requirements instead of audited financial conversion or named overseas approvals. The strongest mitigants are fresh capital, participation in
    a Chinese operating standard, and claimed technical depth, yet residual exposure remains high because harsh-environment reliability, certification,
    partner validation, and global service scaling are not independently closed in the retained source set.
sections:
  - id: "severity-ranked-risk-profile"
    title: "Severity-ranked risk profile"
    body: >-
      The highest residual risks are the ones that sit between promising demonstrations and repeatable international deployment. Publicly retained sources do
      show unusually strong momentum for a 2023-founded marine-robotics company, including a >RMB1 billion A round, claimed >RMB1 billion of first-half
      2026 orders, and a product footprint spanning near-shore, deep-sea, and water-surface operations. The same source set also makes clear why the risk
      budget remains elevated: underwater work combines low visibility, turbidity, currents, pressure, corrosion, and complex geometries, while Singapore's
      port innovation brief says existing robotic inspection and cleaning solutions still have capability and capacity gaps under these conditions. That mix
      makes Shihang's near-term thesis depend less on finding demand than on proving reliable, certifiable, and serviceable performance across hard sites.
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR005", "CR013"]
    tableRefs: ["TR002"]
    figureRefs: ["FR001"]
  - id: "regulatory-and-standards-gating"
    title: "Regulatory and standards gating"
    body: >-
      The cleanest legal or regulatory signal in the pool is not a permit already won by Shihang, but the bar that serious port operators now set for
      in-water hull inspection and cleaning. MPA's 2025-26 call for proposals requires conforming to relevant IMO and ISO standards, validated waste capture
      and filtration, cybersecurity controls, measurable field-trial improvements, and shipowner or operator commitments. Shihang does have a useful
      mitigation: Chinese reporting says it participated in the January 2026 operating standard for underwater cleaning robots, and the company launched its
      CEORION model in April 2026. Even so, the retained evidence does not yet identify named overseas certifications, port approvals, or verified
      environmental-compliance outcomes, so internationalization remains gated by diligence rather than assumed from domestic momentum.
    claimRefs: ["CR004", "CR006", "CR007"]
    tableRefs: ["TR001"]
  - id: "dependency-and-capital-scaling"
    title: "Dependency and capital-scaling risk"
    body: >-
      Shihang's commercial scale-up depends on counterparties on three fronts at once: customers that will sponsor pilots and recurring operations, ecosystem
      partners that can help deliver port or offshore workflows, and capital providers willing to finance a broad product-and-geography buildout before
      public unit economics are visible. The funding round itself is a double-edged signal. It materially reduces near-term financing risk, but the stated
      use of proceeds for core R&D, global expansion, and ecosystem construction also underlines how much investment is still required. That matters because
      the target market is globally distributed and procurement standards are set by large fleet owners, ports, and well-capitalized incumbents rather than
      by a single domestic buying center.
    claimRefs: ["CR001", "CR008", "CR009", "CR010", "CR011", "CR012"]
    tableRefs: ["TR003"]
  - id: "diligence-triggers-and-kill-criteria"
    title: "Diligence triggers and kill criteria"
    body: >-
      The diligence path should stay tightly tied to measurable closure tests instead of narrative momentum. A positive update would be named overseas port
      or class approvals, independently verified waste-capture and cybersecurity controls, repeatable field KPIs for uptime and cleaning outcomes, and
      evidence that the 2026 order base is converting into audited revenue rather than one-off pilots. A negative update would be the opposite: more capital
      raised without equivalent proof of certified deployment, orders, or service density; concentration around a small set of counterparties; or a widening
      gap between global ambitions and the public evidence of delivery readiness. Until those checks are closed, the company remains investable to study, but
      not yet de-risked enough to treat scale-up as executionally routine.
    claimRefs: ["CR001", "CR006", "CR008", "CR010", "CR012"]
