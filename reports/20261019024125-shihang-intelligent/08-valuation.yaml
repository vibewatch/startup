      - [Anti-thesis, "Independent industry evidence still describes the high-end segment as led by established foreign players, which limits how much premium can be justified on narrative alone.", "Third-party proof of sustained performance against leading incumbents would soften this objection."]
    notes: >-
      Rows separate evidence-supported positives from the specific diligence items
      still needed before a price-led recommendation can improve.
    claimRefs: [CV001, CV004, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Orders convert into audited revenue growth, Singapore-class deployments clear filtration and cybersecurity hurdles, and follow-on financing terms remain investor-friendly.", "Premium valuation could be justified by category leadership and faster commercialization, but only after audited proof appears.", "Execution delays, hidden preference stack, or weak gross margin could erase the premium.", "Look for disclosed deployment KPIs and audited revenue quality."]
      - [Base, "The round mainly proves investor appetite while commercialization proof keeps building gradually.", "Fair value remains difficult to pin down, so disciplined tracking is better than aggressive entry.", "Revenue conversion may lag headline orders and technical claims may remain partly company-sourced.", "Public evidence improves but still lacks hard price anchors."]
      - [Bear, "Public terms remain opaque, overseas pilots underwhelm, or a later round resets the price once operating data are tested.", "Headline financing becomes a weak reference and downside comes from paying for narrative before proof.", "Down-round risk, commercialization slippage, and compliance delays dominate.", "Missing disclosures persist and milestone evidence slips."]
    notes: >-
      This is a milestone-based scenario frame, not a precise multiple model,
      because public sources do not disclose the valuation denominator required
      for a credible revenue or EBITDA comp.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV014]
