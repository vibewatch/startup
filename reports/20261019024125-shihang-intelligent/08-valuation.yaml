      nodes:
        - id: market-need
          label: Large maritime need
          note: 2.5 billion dwt global fleet and fuel/emissions incentives make hull-performance maintenance economically relevant.
          claimRefs: [CV008]
        - id: regulatory-tailwind
          label: Regulation is tightening
          note: Biofouling guidance is moving toward more explicit cleaning, waste-capture, and certification requirements.
          claimRefs: [CV006, CV007]
        - id: financing-signal
          label: Strong capital signal
          note: The company announced an A round above RMB 1 billion with repeat investor support.
          claimRefs: [CV001, CV002, CV003]
        - id: commercial-proof
          label: Commercial proof is promising but incomplete
          note: Orders and deployments are encouraging, yet they are not the same as audited revenue quality or retention.
          claimRefs: [CV004, CV005]
        - id: price-opacity
          label: Price is still opaque
          note: Public sources do not disclose post-money valuation, preferences, dilution, or audited unit economics.
          claimRefs: [CV010, CV013]
        - id: recommendation
          label: Research more
          note: Keep diligence active, but wait for pricing and operating proof before underwriting an entry.
          claimRefs: [CV011, CV012, CV014]
      edges:
        - from: market-need
          to: regulatory-tailwind
          label: converts into
        - from: regulatory-tailwind
          to: financing-signal
          label: supports interest in
        - from: financing-signal
          to: commercial-proof
          label: funds
        - from: commercial-proof
          to: price-opacity
          label: is constrained by
        - from: price-opacity
          to: recommendation
          label: drives
    approximationNotes: >-
      Logical sequence only; the flow does not imply weighted probabilities or a
      numeric valuation model.
    claimRefs: [CV001, CV006, CV007, CV008, CV010, CV012]
callouts:
  - calloutType: recommendation
    title: Keep the company in diligence, not in a blind price chase
    body: >-
      Shihang's financing signal is too strong to ignore, but the public record is
      still too thin on price and economics to justify a conviction entry.
    claimRefs: [CV001, CV010, CV012]
  - calloutType: risk
    title: The real downside is paying for narrative before proof
    body: >-
      A large round and large order headline can coexist with later disappointment
      if audited revenue conversion, compliance clearance, or overseas deployment
      metrics fail to catch up.
    claimRefs: [CV004, CV010, CV014]
