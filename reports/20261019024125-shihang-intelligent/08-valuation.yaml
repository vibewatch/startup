company:
  name: Shihang Intelligent
chapter:
  number: 8
  title: Valuation
  summary: >-
    Shihang Intelligent has unusually strong financing momentum and a visibly real
    market need in hull inspection and cleaning, but public evidence still does
    not disclose the underwriting terms or the audited operating economics needed
    to support a hard entry price. The evidence therefore supports a
    research-more posture with strict price discipline rather than a generic
    positive call.
sections:
  - id: financing-and-price-discipline
    title: Financing strength is real, but price support is still missing
    body: >-
      The most concrete public valuation signal is that Shihang closed an A round
      of more than RMB 1 billion in June 2026 and the round appears to have drawn
      both new strategic investors and large follow-on support from earlier
      backers. That matters because it reduces near-term financing risk and gives
      management capital to keep funding R&D and overseas expansion. It does not,
      however, answer the question that matters most for an investor entering
      today: public sources still do not disclose post-money valuation, price per
      share, dilution, liquidation preferences, or audited revenue quality.
      Without those terms, the round proves demand for the story but not fairness
      of the price.
    claimRefs: [CV001, CV002, CV003, CV010, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-versus-anti-thesis
    title: The thesis is built on real demand and technical breadth, but the anti-thesis is commercialization proof
    body: >-
      The upside case is easy to describe. Maritime operators have a large global
      installed base to service, biofouling creates measurable fuel and emissions
      pain, and regulators are pushing for more disciplined hull-management
      practices. Shihang also has a stronger public financing signal than most
      early marine-robotics peers, plus credible claims of broad deployment
      across cleaning, inspection, offshore energy, and security use cases. The
      anti-thesis is that much of the public proof still comes from company-led
      disclosures. Orders above RMB 1 billion are encouraging, but public sources
      do not yet show audited revenue conversion, sustained margins, or retention
      economics, while independent market data still describes the high-end
      segment as led by established foreign players.
    claimRefs: [CV004, CV005, CV008, CV009, CV011]
    tableRefs: [TV002]
  - id: scenario-framing-and-comparable-context
    title: Scenario framing should use milestones, not false precision
    body: >-
      A model-appropriate valuation frame for Shihang is milestone based rather
      than multiple based. Public evidence supports a large addressable maritime
      need, a strong recent financing round, and claimed commercial traction, but
      it does not support a defendable revenue multiple because the denominator is
      still opaque. The right comparable context is therefore a mix of sector
      demand, frontier-tech execution difficulty, and the company's own financing
      milestone. In a bull case, audited revenue conversion and successful port
      deployments could justify a premium narrative; in the base case, the round
      remains a proof-of-interest signal; in the bear case, undisclosed terms plus
      execution slippage could make a later financing or secondary entry look far
      less attractive than the headline round size suggests.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV014]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-breakers
    title: "Final view: research more until pricing and operating proof tighten"
    body: >-
      The recommendation should stay price-sensitive. Shihang has enough evidence
      to merit continued diligence because market need, regulatory momentum, and
      financing support are all tangible. But the next diligence step must be to
      convert narrative proof into investment proof: exact round terms, audited
      revenue recognition, backlog quality, concentration, margin structure, and
      measurable overseas trial results. The cleanest thesis-break triggers are a
      materially weak disclosed cap table, failure to show real conversion from
      order announcements to revenue and cash collection, or an inability to meet
      port cleaning, filtration, cybersecurity, and certification benchmarks in
      Singapore-class deployments. Until those data points are public, the prudent
      stance is research-more rather than conviction buying.
    claimRefs: [CV006, CV007, CV010, CV011, CV012, CV014]
