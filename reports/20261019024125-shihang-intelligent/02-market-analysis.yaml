slug: shihang-intelligent
runDate: 2026-10-19
company:
  name: Shihang Intelligent
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The strongest public market evidence is an installed-base and pain-point stack rather
    than a clean robotics TAM: UNCTAD shows a 2.5 billion dwt global fleet and roughly
    116,000 commercial ships, while Singapore's MPA is explicitly funding in-water hull
    inspection and cleaning robotics to cut drag, fuel, emissions, downtime, and diver
    risk. Shihang's reported >RMB 1 billion of H1 2026 orders and penetration into 15 of
    the world's 20 core ports indicate a real commercial wedge, but the assigned pool does
    not isolate same-unit SAM or SOM by workflow, geography, or recurring-service mix.
sections:
  - id: market-boundary
    title: Market boundary and included workflows
    body: >-
      The evidence supports defining Shihang's addressable market narrowly as maritime
      asset-maintenance and subsea-operations automation, not the broader "embodied AI" or
      generic robotics sector. Across the news sources, the recurring commercial wedge is
      work that is dangerous, repetitive, or hard to execute with human divers and legacy
      imported equipment: ship-hull cleaning, subsea inspection and security, offshore
      wind and photovoltaic maintenance, marine ranching, and deep-sea exploration. That
      is a useful market boundary because it maps to operational pain points that public
      buyers already articulate, whereas the broad marine-economy and global-fleet numbers
      are contextual ceilings rather than direct serviceable spend for Shihang's current
      products.
    claimRefs: [CM001, CM002, CM003, CM012, CM013]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing lenses
    body: >-
      The assigned pool does not provide a single public TAM/SAM/SOM bridge in one unit, so
      the safest approach is to preserve multiple sizing lenses rather than overstate one
      broad market number. UNCTAD shows the global installed base that ultimately requires
      inspection, cleaning, and maintenance, while RobotBelt adds a China-specific marine
      economy lens and Shihang's own reported early orders. Those figures are directionally
      supportive but not directly additive: ship counts, deadweight-ton capacity, GDP-linked
      marine output, port footprint, and company orders describe different denominators and
      time bases. That means valuation should key off demonstrated wedge adoption and buyer
      urgency, not a single inflated headline TAM.
    claimRefs: [CM003, CM004, CM005, CM006, CM011, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyer, user, and payer structure
    body: >-
      The clearest buyer evidence in the pool comes from hull inspection and cleaning, where
      shipowners and operators are the named primary end users, port environments constrain
      how work can be performed, and regulators or port authorities shape acceptable safety,
      waste-capture, and operational standards. In that workflow, the robot user is an
      inspection or cleaning team, but the economic buyer is tied to the vessel's operating
      budget because fuel efficiency, downtime, and turnaround time drive ROI. The company
      coverage suggests adjacent expansion into offshore energy, marine ranching, and subsea
      security, but public budget-owner evidence for those segments is much thinner than for
      port-servicing use cases.
    claimRefs: [CM002, CM007, CM008, CM011, CM014]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and remaining gaps
    body: >-
      Adoption drivers are tangible and operational rather than speculative: biofouling
      raises drag, fuel use, and emissions; in-water cleaning reduces dry-dock dependence and
      keeps vessels working; and marine labor remains risky and scarce in low-visibility,
      corrosive, current-heavy environments. The main constraints are equally concrete.
      Public buyer criteria still demand performance in harsh conditions, safe operation near
      berths without disrupting cargo handling, better coverage of complex hull geometries,
      reliable waste capture and filtration, strong cybersecurity, and evidence that service
      capacity can scale. Shihang's reported order momentum is encouraging, but the chapter
      still lacks public data on contract mix, renewal behavior, pricing, and workflow-level
      revenue conversion, so market sizing remains materially incomplete.
    claimRefs: [CM008, CM009, CM010, CM011, CM012, CM013]
