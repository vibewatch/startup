figures:
  - id: FM001
    title: Demand-context stack from global fleet base to Shihang's current wedge
    type: pyramid
    summary: >-
      The pool supports a layered demand-context view rather than a single additive TAM:
      global fleet base, regional concentration, and Shihang's early commercial wedge all
      point in the same direction, but they use different units.
    data:
      items:
        - label: Global merchant fleet
          value: 116000
          unit: ships >=100 GT
          note: UNCTAD start-2026 installed base.
        - label: Larger commercial ships
          value: 62000
          unit: ships >1,000 GT
          note: UNCTAD subset where beneficial ownership is tracked more reliably.
        - label: Global carrying capacity
          value: 2500
          unit: million dwt
          note: UNCTAD start-2026 carrying-capacity lens.
        - label: Asia-owned carrying capacity
          value: 56
          unit: percent of global dwt
          note: UNCTAD regional concentration signal.
        - label: China-owned carrying capacity
          value: 377
          unit: million dwt
          note: UNCTAD country concentration signal.
        - label: Shihang current wedge
          value: 15
          unit: of world's 20 core ports
          note: RobotBelt-reported footprint alongside >RMB 1bn H1 2026 orders.
    approximationNotes: >-
      This is a demand-context illustration rather than an additive TAM/SAM/SOM stack.
      Layers mix ship counts, carrying-capacity measures, ownership share, and Shihang's
      reported footprint because the assigned pool does not disclose same-unit serviceable
      spend by workflow or geography.
    claimRefs: [CM004, CM005, CM006, CM011, CM013]
callouts:
  - calloutType: insight
    title: Installed-base demand is real; serviceable spend is still unproven
    body: >-
      Public evidence is strong on the global maritime asset base and on why ports and
      operators want in-water robotics, but weak on what portion of that installed base is
      budget-accessible to Shihang at current pricing and deployment capacity.
    claimRefs: [CM004, CM005, CM007, CM008, CM013]
  - calloutType: risk
    title: Orders validate urgency more than recurring economics
    body: >-
      Shihang's reported H1 2026 order volume is a useful market signal, but public sources
      do not show how much of that wedge is recurring service revenue, how contracts are
      split by workflow, or what renewal and cancellation behavior looks like.
    claimRefs: [CM011, CM013, CM014]
