company:
  name: Shihang Intelligent
chapter:
  number: 6
  title: Customers
  summary: >-
    Shihang has better public customer proof than many young robotics companies,
    but the proof is concentrated in shipping-linked hull-cleaning accounts
    rather than a broad disclosed customer base. Named references to China
    Merchants Energy Shipping, COSCO Bulk, Qingdao Port, and Yantai Port,
    together with reported H1 2026 orders above RMB1 billion, show real demand;
    however, retention, customer count, top-customer concentration, and overseas
    conversion remain undisclosed, and even supportive coverage says repeatable
    multi-site performance still needs validation.
sections:
  - id: customer-segments-and-beachhead
    title: Customer segments are visible, but the beachhead is still shipping-led
    body: >-
      The strongest public customer evidence is concentrated in ship-maintenance
      and port-adjacent workflows rather than a broad cross-industry roster.
      Baidu Baike and multiple June 2026 media reports consistently place
      Shihang's deployed use cases in ship cleaning, underwater security,
      offshore wind, marine ranching, and seabed inspection, but named
      accounts skew toward shipping operators and ports. The clearest specific
      sites are Qingdao Port and Yantai Port, while the clearest named operator
      users are China Merchants Energy Shipping and COSCO Bulk. That pattern
      suggests an initial beachhead where the buyer, user, and payer can all
      tie value directly to avoided diver risk, fuel drag, and turnaround time,
      with adjacent infrastructure verticals still described more as scenarios
      than as disclosed customer rosters.
    claimRefs: [CU001, CU003, CU004, CU010, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof-and-scale-signals
    title: Adoption proof is real, but strongest metrics still emphasize activity over durability
    body: >-
      The chapter's strongest adoption signals are usage references and order
      volume, not retention or account economics. Wedoany says Shihang's
      "Killer Whale Robot" is already in use at China Merchants Energy Shipping
      and COSCO Bulk and has completed maintenance work on more than a thousand
      large vessels, while 10jqka and Wedoany both say first-half 2026 orders
      exceeded RMB1 billion. Those are meaningful indicators that demand has
      moved beyond lab demos. At the same time, public evidence still does not
      disclose how many paying accounts generated those orders, whether the work
      recurs under multiyear contracts, or how much of the order book sits in
      one maritime customer cluster. The result is credible commercialization
      proof with weak public durability metrics.
    claimRefs: [CU002, CU005, CU006, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration-gaps
    title: The biggest diligence gaps are retention, concentration, and export conversion
    body: >-
      Public sources remain thin on the metrics that matter most for customer
      durability. None of the retained Shihang-specific reports disclose
      customer count, NRR, GRR, churn, renewal rate, or average contract
      length, and they do not quantify top-customer share by revenue or orders.
      That omission matters because the visible evidence clusters around Chinese
      shipping and port operators, while offshore wind, photovoltaic, and other
      marine infrastructure use cases are discussed mostly at the scenario level.
      Wedoany is also explicit that customer sites remain heterogeneous and that
      task success rates, anomaly handling, and safety boundaries still need
      validation. Expansion to overseas ports is therefore a thesis path rather
      than proven traction: capital is earmarked for global rollout, but named
      foreign paying accounts and partner-led channel evidence are not yet
      public in the retained source set.
    claimRefs: [CU007, CU008, CU009, CU011, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Proof of use
      - Revenue / strategic value
      - Gap
    rows:
      - - State-linked shipping operators
        - Fleet operator / maintenance team / shipping budget owner
        - In-water hull cleaning and vessel maintenance
        - China Merchants Energy Shipping and COSCO Bulk are named as users; Wedoany says cumulative work covered more than 1,000 large vessels.
        - Strongest public production proof and likely core order pool
        - No account count, ACV, renewal rate, or share-of-orders disclosure
      - - Ports and port-adjacent assets
        - Port operator / site maintenance team / local operating budget
        - Port-side deployment of commercial underwater cleaning robots
        - Baidu Baike names Qingdao Port and Yantai Port as deployment scenarios.
        - Validates use in live harbor environments
        - No utilization, repeat-frequency, or contract-structure disclosure
      - - Marine infrastructure operators
        - Offshore wind, photovoltaic, marine ranching, and subsea inspection teams / project budgets
        - Inspection and maintenance in adjacent marine infrastructure
        - Gasgoo and 10jqka say deployments span offshore wind, marine ranching, seabed inspection, and underwater security.
        - Shows adjacency beyond ship cleaning
        - Few named customers or quantified outcomes by segment
      - - Research and standards ecosystem
        - Institute-led programs, port-technology units, and maritime operators / project sponsors
        - Standards work, validation, and commercialization support
        - Baidu Baike lists Water Transport Research Institute, Shandong Port Technology, Fujian Shipping, Guoneng (Tianjin) Port Services, and Huayang Maritime in a joint award submission.
        - Can help open regulated buyers and operating relationships
        - Collaboration does not itself prove paid production contracts
    notes: >-
      Public evidence supports segment mapping, but buyer counts, contract
      values, and revenue mix by segment are not disclosed.
    claimRefs: [CU001, CU002, CU003, CU004, CU010, CU013]
