figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The visible go-to-customer motion starts with hazardous ship-maintenance
      pain points, expands through operational proof, and reaches adjacent
      infrastructure and overseas ambitions before public evidence thins out.
    data:
      items:
        - label: Hazardous maintenance pain is identified
          actor: Shipping operator / technical superintendent
          stage: Problem recognition
          touchpoints:
            - Diver safety, hull fouling, and turnaround pressure make underwater maintenance expensive.
            - Wedoany links cleaning to sailing resistance, fuel use, carbon emissions, and port turnaround time.
          tone: neutral
        - label: Site deployment proves the beachhead
          actor: Port site and vessel operations team
          stage: First deployment
          touchpoints:
            - Baidu Baike names Qingdao Port and Yantai Port as deployment scenarios.
            - Early proof is operational rather than financial.
          tone: positive
        - label: Shipping accounts become named references
          actor: Fleet operator
          stage: Production use
          touchpoints:
            - Wedoany names China Merchants Energy Shipping and COSCO Bulk as users.
            - The same article claims cumulative maintenance work on over 1,000 large vessels.
          tone: positive
        - label: Orders scale faster than disclosed customer economics
          actor: Management and investors
          stage: Scale-up
          touchpoints:
            - Wedoany and 10jqka say H1 2026 orders exceeded RMB1 billion.
            - Public sources still do not disclose customer count, NRR, or contract length.
          tone: warning
        - label: Adjacent marine infrastructure is the expansion wedge
          actor: Offshore and subsea operators
          stage: Adjacency expansion
          touchpoints:
            - Gasgoo and 10jqka cite offshore wind, marine ranching, seabed inspection, and underwater security scenarios.
            - Named paying accounts in those adjacencies are not publicly disclosed.
          tone: warning
        - label: Overseas rollout is a thesis, not yet proven traction
          actor: Global ports and channels
          stage: Geographic expansion
          touchpoints:
            - Funding coverage says proceeds will support global market expansion.
            - Wedoany notes rising acceptance in Singapore, Europe, the Middle East, and Southeast Asia, but retained sources do not name foreign paying accounts.
          tone: risk
    claimRefs: [CU001, CU002, CU005, CU007, CU008, CU011, CU013]
callouts:
  - calloutType: strength
    title: Named proof is stronger than a typical logo sheet
    body: >-
      The retained evidence names four concrete references — China Merchants
      Energy Shipping, COSCO Bulk, Qingdao Port, and Yantai Port — and pairs
      those with a cumulative vessel-operation metric and large reported order
      volume.
    claimRefs: [CU001, CU002, CU005]
  - calloutType: risk
    title: Durability and concentration still lack the metrics investors usually want
    body: >-
      No retained public source discloses customer count, renewals, NRR/GRR,
      churn, average contract length, or top-customer concentration, so the
      current proof set is strong on usage anecdotes and weak on revenue
      quality.
    claimRefs: [CU008, CU009, CU011]
