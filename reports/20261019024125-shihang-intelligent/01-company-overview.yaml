  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: Post-money valuation, share price, ownership dilution, liquidation preferences, debt facilities, secondaries, and a reconciled cumulative amount raised across all rounds.
    whyItMatters: Later valuation and return-underwriting work cannot convert the financing headlines into ownership or entry-price analysis without these terms.
    diligencePath: Request the signed term sheet, cap table before/after the June round, and any debt or secondary-side letters.
    relatedQuestionRefs:
    - QO005
    - QO006
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion-and-scale
    missingEvidence: Audited revenue, gross margin, backlog-to-revenue conversion, customer count, concentration, retention, and current headcount.
    whyItMatters: Orders and awards are not the same as realized revenue quality, repeat demand, or operating leverage.
    diligencePath: Obtain audited financials, booked-vs-recognized revenue bridge, customer cohort data, and a headcount-by-function snapshot.
    relatedQuestionRefs:
    - QO006
  - type: missing-source
    severity: material
    topic: governance-bench-depth
    missingEvidence: Board composition, committee structure, and named non-founder executives across finance, operations, engineering, and sales.
    whyItMatters: A founder-centric narrative can hide concentration risk, succession risk, or weak institutionalization behind a large financing event.
    diligencePath: Request the board roster, org chart, executive bios, and investor governance rights tied to the 2026 rounds.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: singapore-trial-outcomes
    missingEvidence: Field-trial KPIs, end-user commitments, and interim/final MPA reporting outcomes for the underwater hull inspection and cleaning program.
    whyItMatters: Selection into a program is weaker than proving commercial reliability and regulatory-operational fit in overseas deployments.
    diligencePath: Request MPA trial status updates, named pilot counterparties, KPI scorecards, and any Singapore operating-entity disclosures.
    relatedQuestionRefs:
    - QO007
