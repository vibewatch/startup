company:
  name: Shihang Intelligent
chapter:
  number: 1
  title: Company Overview
  summary: 'Public 2026 evidence shows Shihang Intelligent compressing major product, standards, and financing milestones into a short window: March promotional coverage cited earlier A+/A++ rounds, April brought the CEORION model launch, and June brought a reported Series A above RMB 1 billion. The company now looks like a founder-led marine-robotics platform with unusually strong order-book and investor signals for its age, but public visibility into valuation, board structure, revenue conversion, and international operating proof remains thin.'
sections:
- id: identity-stage-and-operating-scope
  title: Identity, stage, and operating scope
  body: 'Retained June 2026 coverage consistently frames Shihang Intelligent as a private marine embodied-intelligence company building general-purpose surface and underwater robots rather than a single-point tool vendor. The public story is strongest on operating scope and technical ambition: multiple sources describe a product line spanning cleaning, inspection, grasping, and related underwater workflows, while June and April coverage tie that scope to the CEORION embodied model and to full-ocean-depth deployment claims. What is well supported is the company''s current stage: it is actively venture-backed, raised a very large June Series A after earlier 2026 A+/A++ rounds, and is using that capital to push core R&D and globalization. What is not yet independently pinned down is the full headquarters and legal-entity footprint beyond a Suzhou-named operating entity in financing coverage.'
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  - CO006
  - CO016
  tableRefs:
  - TO001
- id: founder-centrality-and-governance-visibility
  title: Founder centrality and governance visibility
  body: 'The retained source set makes Chen Xiaobo the center of gravity for Shihang''s public narrative. Across translated, financial-press, and company-aligned coverage, he is repeatedly identified as founder and CEO, with a Harbin Engineering University background, roughly 19 years in marine robotics, and prior work on China''s first commercial underwater cleaning robot. That creates a credible founder-market-fit story for a hard-technical marine systems company. The flip side is governance opacity: within this pool, public sources do not name a broader board, CFO, COO, or other senior operating bench. For later diligence, that means the company looks institutionally thinner than its fundraising headlines suggest until cap-table rights, board composition, and functional leadership depth are verified directly.'
  claimRefs:
  - CO009
  - CO010
  tableRefs:
  - TO002
- id: capital-formation-and-stakeholder-map
  title: Capital formation and stakeholder map
  body: 'Shihang''s financing profile accelerated sharply in 2026. Company-aligned March coverage said it had already completed several-hundred-million-renminbi A+/A++ rounds, while multiple June sources then reported a Series A above RMB 1 billion and described it as a record single round for marine robotics. The disclosed investor list blends financial sponsors, strategic industrial capital, and repeat insider support, which matters because it suggests both external validation and a willingness among earlier backers to increase exposure. Even so, the public record still stops short of the terms that matter most for ownership and valuation work: no retained source in this pool discloses post-money valuation, cumulative total raised across all rounds, share-price mechanics, liquidation terms, or debt facilities.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO015
  tableRefs:
  - TO003
- id: milestones-traction-and-external-proof-points
  title: Milestones, traction, and external proof points
  body: The company's strongest current signal is the clustering of product, standards, market, and funding milestones into 2026. Independent and company-aligned coverage links the business to January standards work, a March navigation-society award, an April CEORION launch, June financing, and first-half order value above RMB 1 billion across ship cleaning, offshore energy, aquaculture, and seabed-work scenarios. That is stronger than a pure lab-company pattern. Still, some proof points remain one layer short of bankable commercial evidence. Public sources say Shihang entered Singapore's MPA underwater hull inspection and cleaning program as the only Chinese company, but the MPA call itself makes clear that execution still depends on field trials, end-user commitments, and reporting. International traction therefore remains promising but not yet publicly closed-loop.
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO011
  - CO012
  - CO013
  - CO014
  figureRefs:
  - FO001
