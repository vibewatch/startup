callouts:
- calloutType: risk
  title: Financing momentum outpaces public operating transparency
  body: The retained pool supports unusually strong fundraising, order-book, and technical milestones for a young marine-robotics company, but it still lacks public valuation terms, customer counts, revenue disclosure, and visible governance depth. That means later financial and valuation work will inherit real evidence gaps rather than simply repackage the June financing headlines.
  claimRefs:
  - CO001
  - CO008
  - CO010
  - CO015
