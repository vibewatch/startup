schemaVersion: "report-v2"
artifact: financials
slug: shihang-intelligent
runDate: 2026-10-19
company:
  name: Shihang Intelligent
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence shows unusually strong financing and order-intake signals for a
    young marine-robotics company: Shihang announced an A round above RMB 1 billion,
    disclosed more than RMB 1 billion of orders in 2026 H1, and won a place in
    Singapore's MPA-backed hull-cleaning trial program. Those signals still stop short
    of underwriting-grade financial visibility because no assigned public source
    discloses recognized revenue, realized pricing, gross margin, burn, runway, or
    backlog conversion.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      The assigned evidence implies a mixed project-and-service revenue model anchored
      in robotic hull cleaning and adjacent subsea work rather than a clean SaaS-like
      subscription profile. Public reporting says Shihang's robots are already used in
      ship cleaning, underwater security, offshore wind, marine ranching, and subsea
      inspection, while Singapore's MPA selected SEAHI Robotics for live-port hull
      inspection and cleaning trials. That combination suggests revenue can come from
      vessel-service jobs, mission-specific project delivery, and commercialization of
      robotic operating capacity in regulated ports. The strongest disclosed traction
      metric is order intake above RMB 1 billion in 2026 H1, but the same public set
      does not disclose how much of that converts into recognized revenue, over what
      delivery schedule, or with what payment milestones and gross profit profile.
    claimRefs: [CI003, CI004, CI005, CI006, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      The cost stack appears dominated by hard-to-automate field execution rather than
      pure software delivery. MPA's own problem statement says current in-water hull
      solutions still struggle with complex hull geometry, stronger currents, tight
      berth-side operating spaces, debris capture, and cost-effective scale, while the
      trial program explicitly asks teams to prove productivity, manpower efficiency,
      fuel-savings outcomes, and filtration performance. Norway's proposed biofouling
      regime adds another pressure point: vessels with macrofouling would have to clean
      before or while operating in Norwegian waters, yet regulators also note there is
      no accepted international standardized method for handling cleaned-off fouling.
      That means margin expansion is plausible only if Shihang can improve job
      throughput and reliability while absorbing capture, filtration, compliance, and
      rework costs that public sources do not yet quantify.
    claimRefs: [CI007, CI008, CI009, CI010, CI013]
    tableRefs: [TI003]
  - id: capital-needs-and-financing-dependency
    title: Capital needs and financing dependency
    body: >-
      Capital access is a current strength, but capital adequacy is still unproven.
      Multiple outlets report that Shihang closed an A round above RMB 1 billion, and
      the disclosed use of proceeds is what investors would expect from a hardware-plus-
      field-operations business: core R&D, global market expansion, and ecosystem
      buildout. Prior investors reportedly followed on heavily alongside new strategic
      backers, which improves confidence that the company can finance near-term product
      and market development. Even so, the available evidence does not disclose cash on
      hand, monthly burn, debt obligations, or a management-defined next-round trigger.
      Singapore's co-funding helps validate project eligibility, but it is a shared
      program pool across six selected partners rather than a disclosed balance-sheet
      substitute for Shihang's own liquidity.
    claimRefs: [CI001, CI002, CI006, CI014, CI013]
  - id: financial-verdict-and-blockers
    title: Financial verdict and blockers
    body: >-
      Financially, the company looks stronger on demand formation and financing access
      than on revenue quality. The disclosed combination of orders, field deployments,
      and third-party trial selection is directionally positive because it is harder to
      fake than a pure concept pilot, and the addressable shipping base remains large.
      However, underwriting is still blocked by missing conversion detail: investors do
      not yet know realized pricing, contract duration, acceptance milestones,
      cancellations, customer concentration, service productivity, gross margin,
      working-capital drag, or runway. The near-term question is therefore not whether
      there is customer interest, but whether Shihang can turn technically impressive
      robotics deployments into repeatable, compliant, cash-generating maritime service
      economics.
    claimRefs: [CI003, CI005, CI010, CI011, CI012, CI013]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Ship-hull cleaning services
        - Job-based robotic inspection and cleaning for operating vessels
        - Per vessel / cleaning campaign
        - Publicly validated by Singapore trial selection; recognized revenue undisclosed
        - Commercial need is clear but realized revenue quality is unproven
        - Provide signed customer contracts, revenue recognition policy, and repeat-job rate
      - - Port / offshore subsea inspection
        - Project or mission delivery using underwater robots
        - Per inspection mission
        - 10jqka says deployments already exist in subsea inspection and underwater security
        - Deployment evidence exists, but pricing and margin are undisclosed
        - Break out inspection revenue, utilization, and contribution margin
      - - Offshore-energy and marine-ranching work
        - Site-specific robotic operations for offshore wind and marine-ranching assets
        - Per site / project
        - Publicly disclosed application scenario rather than a disclosed revenue line
        - Demand adjacency is plausible; monetization detail is weak
        - Show customer logos, contract scope, and renewal or expansion pattern
      - - Trial / R&D co-funding
        - Non-core project support tied to Singapore live-port development and trials
        - Program grant pool
        - Close to SGD 3.7m shared across six selected partners
        - Helpful financing offset, but not evidence of durable product revenue
        - Clarify Shihang's direct share, eligible costs, and drawdown milestones
    notes: >-
      Public sources identify application categories and a shared Singapore co-funding
      pool, but they do not disclose stream-level revenue mix, contract duration,
      acceptance milestones, or cancellations; "recognized revenue undisclosed" means
      the assigned sources did not provide those fields.
    claimRefs: [CI004, CI005, CI006, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Price / unit / contract
      - List vs. realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Hull inspection and cleaning service
        - Not publicly disclosed
        - Realized pricing unknown; no public list-price page in the assigned pool
        - Unknown discounts, mobilization fees, and debris-handling surcharge
        - MPA official CFP and MPA-backed trial coverage
      - - Broader robotic field-operations work
        - Not publicly disclosed
        - No public evidence distinguishes equipment sale, service fee, or bundled project pricing
        - Unknown payment milestones and customer concentration
        - 10jqka deployment and order reporting
      - - Singapore co-funding support
        - Shared pool close to SGD 3.7m for six selected partners
        - Subsidy support, not customer pricing
        - Company-level allocation not disclosed
        - MPA official CFP and trial announcement
    notes: >-
      This table is intentionally sparse because the assigned public sources disclose no
      list pricing and no realized pricing. Unknowns are preserved rather than inferred.
    claimRefs: [CI005, CI006, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2026 H1 order intake
        - "> RMB 1bn"
        - Medium
        - Strongest public commercial traction signal, but still a bookings metric
        - Reconcile orders to recognized revenue, backlog aging, and cancellation rate
      - - Trial co-funding pool
        - "Close to SGD 3.7m shared across six selected partners"
        - High
        - Offsets part of development cost but does not prove stand-alone profitability
        - Disclose Shihang's direct grant allocation and reimbursable cost categories
      - - Cleaning productivity
        - null
        - Low
        - Throughput per hour and crew intensity drive gross margin in field services
        - Provide area cleaned or inspected per hour, crew count, and rework rate
      - - Waste-capture / filtration cost burden
        - null
        - Low
        - Debris capture and sub-10-micron filtration can add consumable and operating cost
        - Provide consumables, disposal cost, and maintenance cost per mission
      - - Gross margin / contribution margin
        - null
        - Low
        - Underwriting requires proof that orders convert into profitable service delivery
        - Provide gross margin by service line and first-pass completion rate
      - - Cash burn / runway / debt
        - null
        - Low
        - Financing adequacy cannot be judged from fundraising alone
        - Provide cash balance, monthly net burn, debt covenants, and next-round trigger
    notes: >-
      Nulls are deliberate: the assigned public evidence set does not disclose these
      metrics. Each null maps to a specific diligence request rather than a guessed
      estimate.
    claimRefs: [CI003, CI006, CI007, CI008, CI010, CI013]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a service-led bridge from biofouling-driven customer need
      to orders, but not the final conversion into recognized revenue and gross profit.
    data:
      nodes:
        - id: demand
          label: Biofouling pain
          value: Higher drag, fuel use, and emissions create recurring cleaning demand.
        - id: service
          label: Robotic hull work
          value: Shihang targets inspection and cleaning plus adjacent subsea missions.
        - id: qualification
          label: Qualification gate
          value: Ports and regulators require safe, debris-controlled, measurable execution.
        - id: orders
          label: Orders
          value: Publicly disclosed 2026 H1 orders exceeded RMB 1bn.
        - id: revenue
          label: Recognized revenue
          value: Public sources do not disclose acceptance timing, realized pricing, or collections.
        - id: gross-profit
          label: Gross profit
          value: Margin depends on throughput, labor, capture, filtration, and rework.
      edges:
        - from: demand
          to: service
          label: creates need for
        - from: service
          to: qualification
          label: must satisfy
        - from: qualification
          to: orders
          label: can win projects and trials
        - from: orders
          to: revenue
          label: must convert through delivery and billing
        - from: revenue
          to: gross-profit
          label: after variable operating costs
    approximationNotes: >-
      This is a conceptual bridge built from public operating disclosures; it does not
      infer undisclosed conversion rates or margins.
    claimRefs: [CI003, CI005, CI007, CI010, CI013]
callouts:
  - calloutType: strength
    title: Better evidence than a pure demo narrative
    body: >-
      The combination of >RMB 1bn disclosed order intake and inclusion in Singapore's
      MPA-backed hull-cleaning program provides two distinct public signals: reported
      customer demand and selection for a third-party operational trial.
    claimRefs: [CI003, CI005, CI006]
  - calloutType: risk
    title: Revenue quality remains the gating diligence issue
    body: >-
      Public evidence is strongest on financing and bookings, but still weakest on the
      variables that determine cash generation: realized pricing, contract structure,
      delivery productivity, capture-and-filtration cost, gross margin, and runway.
    claimRefs: [CI007, CI010, CI013]
