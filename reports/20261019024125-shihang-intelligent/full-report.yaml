        - Look for disclosed deployment KPIs and audited revenue quality.
      - - Base
        - The round mainly proves investor appetite while commercialization proof keeps building gradually.
        - Fair value remains difficult to pin down, so disciplined tracking is better than aggressive entry.
        - Revenue conversion may lag headline orders and technical claims may remain partly company-sourced.
        - Public evidence improves but still lacks hard price anchors.
      - - Bear
        - >-
          Public terms remain opaque, overseas pilots underwhelm, or a later round resets the price once operating data
          are tested.
        - Headline financing becomes a weak reference and downside comes from paying for narrative before proof.
        - Down-round risk, commercialization slippage, and compliance delays dominate.
        - Missing disclosures persist and milestone evidence slips.
