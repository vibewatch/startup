      - number: '5.4'
        title: Trust, compliance, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence set supports only a limited public controls story. On the positive side, Singapore's
              live-port program explicitly evaluates safety, cost-effectiveness, environmental sustainability, and
              compliance with global requirements and standards, so Shihang is at least entering a workflow where those
              controls are tested. In China, the 2024 national AI standardization notice also shows that embodied-AI
              claims sit inside an increasingly formal policy environment. But investors should not confuse that
              backdrop with completed company proof. The retained pool does not provide public integration docs, a
              product security or privacy program, detailed certification inventory, uptime data, debris-capture
              results, failure-rate data, or meaningful developer-signal evidence. That leaves product readiness more
              mature than a pure concept company, yet still under-documented for technical diligence.
            claimRefs:
