            body: >-
              Shihang's financing profile accelerated sharply in 2026. Company-aligned March coverage said it had
              already completed several-hundred-million-renminbi A+/A++ rounds, while multiple June sources then
              reported a Series A above RMB 1 billion and described it as a record single round for marine robotics. The
