      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Capital access is a current strength, but capital adequacy is still unproven. Multiple outlets report that
              Shihang closed an A round above RMB 1 billion, and the disclosed use of proceeds is what investors would
              expect from a hardware-plus- field-operations business: core R&D, global market expansion, and ecosystem
              buildout. Prior investors reportedly followed on heavily alongside new strategic backers, which improves
              confidence that the company can finance near-term product and market development. Even so, the available
              evidence does not disclose cash on hand, monthly burn, debt obligations, or a management-defined
              next-round trigger. Singapore's co-funding helps validate project eligibility, but it is a shared program
              pool across six selected partners rather than a disclosed balance-sheet substitute for Shihang's own
              liquidity.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI014
              - CI013
      - number: '4.4'
        title: Financial verdict and blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, the company looks stronger on demand formation and financing access than on revenue quality.
              The disclosed combination of orders, field deployments, and third-party trial selection is directionally
              positive because it is harder to fake than a pure concept pilot, and the addressable shipping base remains
              large. However, underwriting is still blocked by missing conversion detail: investors do not yet know
              realized pricing, contract duration, acceptance milestones, cancellations, customer concentration, service
              productivity, gross margin, working-capital drag, or runway. The near-term question is therefore not
              whether there is customer interest, but whether Shihang can turn technically impressive robotics
              deployments into repeatable, compliant, cash-generating maritime service economics.
            claimRefs:
