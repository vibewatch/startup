      - number: '5.3'
        title: Deployment maturity and operating constraints
        blocks:
          - type: paragraph
            body: >-
              Shihang's public maturity case rests on two layers of evidence. First, company-linked financing coverage
              says its robots already operate across 0-10000 meter depths and have scaled into ship cleaning, offshore
              energy, aquaculture, security, and subsea inspection scenarios. Second, the independent proof point is
              MPA's decision to select SEAHI Robotics among six partners for in-water hull inspection and cleaning
              trials in the Port of Singapore, with technology validation under live operating conditions beginning in
              the second half of 2026. That matters because MPA also spells out the real engineering bottlenecks:
              complex hull geometry, stronger currents, tight working spaces alongside vessels, debris capture, and the
              need to operate safely without disrupting port traffic. In other words, Shihang has graduated from generic
              robot storytelling into a real port validation program, but the hardest reliability and
              environmental-proof questions are explicitly still being tested rather than already settled.
            claimRefs:
