          - type: callout
            title: Revenue quality remains the gating diligence issue
            body: >-
              Public evidence is strongest on financing and bookings, but still weakest on the variables that determine
              cash generation: realized pricing, contract structure, delivery productivity, capture-and-filtration cost,
              gross margin, and runway.
            calloutType: risk
            claimRefs:
