  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included workflows
        blocks:
          - type: paragraph
            body: >-
              The evidence supports defining Shihang's addressable market narrowly as maritime asset-maintenance and
              subsea-operations automation, not the broader "embodied AI" or generic robotics sector. Across the news
              sources, the recurring commercial wedge is work that is dangerous, repetitive, or hard to execute with
              human divers and legacy imported equipment: ship-hull cleaning, subsea inspection and security, offshore
              wind and photovoltaic maintenance, marine ranching, and deep-sea exploration. That is a useful market
              boundary because it maps to operational pain points that public buyers already articulate, whereas the
              broad marine-economy and global-fleet numbers are contextual ceilings rather than direct serviceable spend
              for Shihang's current products.
