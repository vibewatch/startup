      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The cost stack appears dominated by hard-to-automate field execution rather than pure software delivery.
              MPA's own problem statement says current in-water hull solutions still struggle with complex hull
              geometry, stronger currents, tight berth-side operating spaces, debris capture, and cost-effective scale,
              while the trial program explicitly asks teams to prove productivity, manpower efficiency, fuel-savings
              outcomes, and filtration performance. Norway's proposed biofouling regime adds another pressure point:
              vessels with macrofouling would have to clean before or while operating in Norwegian waters, yet
              regulators also note there is no accepted international standardized method for handling cleaned-off
              fouling. That means margin expansion is plausible only if Shihang can improve job throughput and
              reliability while absorbing capture, filtration, compliance, and rework costs that public sources do not
              yet quantify.
            claimRefs:
