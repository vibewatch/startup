            body: >-
              The assigned pool does not provide a single public TAM/SAM/SOM bridge in one unit, so the safest approach
              is to preserve multiple sizing lenses rather than overstate one broad market number. UNCTAD shows the
              global installed base that ultimately requires inspection, cleaning, and maintenance, while RobotBelt adds
              a China-specific marine economy lens and Shihang's own reported early orders. Those figures are
              directionally supportive but not directly additive: ship counts, deadweight-ton capacity, GDP-linked
              marine output, port footprint, and company orders describe different denominators and time bases. That
              means valuation should key off demonstrated wedge adoption and buyer urgency, not a single inflated
