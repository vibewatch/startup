  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating scope
        blocks:
          - type: paragraph
            body: >-
              Retained June 2026 coverage consistently frames Shihang Intelligent as a private marine
              embodied-intelligence company building general-purpose surface and underwater robots rather than a
              single-point tool vendor. The public story is strongest on operating scope and technical ambition:
              multiple sources describe a product line spanning cleaning, inspection, grasping, and related underwater
              workflows, while June and April coverage tie that scope to the CEORION embodied model and to
              full-ocean-depth deployment claims. What is well supported is the company's current stage: it is actively
              venture-backed, raised a very large June Series A after earlier 2026 A+/A++ rounds, and is using that
              capital to push core R&D and globalization. What is not yet independently pinned down is the full
              headquarters and legal-entity footprint beyond a Suzhou-named operating entity in financing coverage.
