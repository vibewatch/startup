      - number: '3.2'
        title: Buying criteria and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains the weakest part of the comparison. None of the retained sources publishes catalog
              pricing, standard contract length, or normalized per-vessel economics for Shihang or the
              Singapore-selected peer set, so the commercial contest is still being described through capabilities and
              trial requirements instead of clean price cards. MPA's challenge statement shows what buyers are actually
              underwriting: performance on complex hull geometry, reliable operation in strong currents and tight
              berths, waste capture and filtration, automated reporting, productivity, and demonstrable
              cost-effectiveness. That framework compresses the difference between "robot vendor" and "port-grade
              service operator": a technically impressive platform still has to prove safe, compliant, repeatable
              deployment in live port conditions before pricing power is believable.
