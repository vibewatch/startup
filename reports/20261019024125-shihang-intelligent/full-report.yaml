  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered platform and product scope
        blocks:
          - type: paragraph
            body: >-
              Public coverage consistently describes Shihang as a marine general-purpose robotics company rather than a
              single-point-product vendor. Financing reports say the company develops, produces, sells, and services
              marine robots, surface robots, and core accessories, while also positioning the installed base around
              high-risk marine workflows such as hull cleaning, subsea security, offshore wind and photovoltaic
              maintenance, sea ranching, and subsea inspection. The strongest supported interpretation is that Shihang
              is trying to sell a reusable hardware-and-software platform whose applications can be reconfigured across
              multiple underwater jobs, not just a one-off cleaning robot. What remains missing is a public SKU map,
              named commercial packages, or product documentation that would let an investor separate mature
              deliverables from broader platform ambition.
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: table
