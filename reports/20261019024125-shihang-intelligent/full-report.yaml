  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on public scope disclosed in the assigned evidence and on the strength of externally
      visible buyer-validation signals.
    data:
      xAxis:
        label: Public solution breadth (1=narrow/single workflow, 5=multi-mission platform)
        min: 1
        max: 5
        lowLabel: narrow
        highLabel: broad
      yAxis:
        label: Buyer-validation signal (1=legacy/limited proof, 5=scaled orders or funded live-port validation)
        min: 1
        max: 5
        lowLabel: limited proof
        highLabel: strong proof
      points:
        - label: SEAHI / Shihang
          x: 5
          'y': 5
          note: >-
            Broadest public mission scope in retained evidence, plus >RMB1bn financing, >RMB1bn H1 orders, and Singapore
            trial selection.
        - label: Other Singapore-selected robotic peers
          x: 3
          'y': 4
          note: >-
            Named direct cohort has external buyer validation through MPA selection, but less public scope and scale
            detail in the assigned evidence.
        - label: Inspection-first robotic systems
          x: 2
          'y': 3
          note: >-
            MPA treats inspection as a distinct system class focused on reporting, classification, and berth-side
            operation.
        - label: Cleaning-first robotic systems
          x: 2
          'y': 3
          note: >-
            Direct hull-cleaning competitors are evaluated on capture efficiency, filtration, and throughput under port
            rules.
        - label: Diver-led / manual cleaning
          x: 1
          'y': 2
          note: Incumbent workflow is still used, but MPA says it is labor-intensive, risky, and manpower-constrained.
        - label: Cleaning-optimization analytics
          x: 1
          'y': 3
          note: Software substitutes can improve cleaning ROI, but they still rely on a separate physical cleaning provider.
