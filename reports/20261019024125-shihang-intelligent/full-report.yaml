      - number: '6.2'
        title: Adoption proof is real, but strongest metrics still emphasize activity over durability
        blocks:
          - type: paragraph
            body: >-
              The chapter's strongest adoption signals are usage references and order volume, not retention or account
              economics. Wedoany says Shihang's "Killer Whale Robot" is already in use at China Merchants Energy
              Shipping and COSCO Bulk and has completed maintenance work on more than a thousand large vessels, while
              10jqka and Wedoany both say first-half 2026 orders exceeded RMB1 billion. Those are meaningful indicators
              that demand has moved beyond lab demos. At the same time, public evidence still does not disclose how many
              paying accounts generated those orders, whether the work recurs under multiyear contracts, or how much of
              the order book sits in one maritime customer cluster. The result is credible commercialization proof with
              weak public durability metrics.
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU010
      - number: '6.3'
        title: The biggest diligence gaps are retention, concentration, and export conversion
        blocks:
          - type: paragraph
            body: >-
              Public sources remain thin on the metrics that matter most for customer durability. None of the retained
              Shihang-specific reports disclose customer count, NRR, GRR, churn, renewal rate, or average contract
              length, and they do not quantify top-customer share by revenue or orders. That omission matters because
              the visible evidence clusters around Chinese shipping and port operators, while offshore wind,
              photovoltaic, and other marine infrastructure use cases are discussed mostly at the scenario level.
              Wedoany is also explicit that customer sites remain heterogeneous and that task success rates, anomaly
              handling, and safety boundaries still need validation. Expansion to overseas ports is therefore a thesis
              path rather than proven traction: capital is earmarked for global rollout, but named foreign paying
              accounts and partner-led channel evidence are not yet public in the retained source set.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Named proof is stronger than a typical logo sheet
            body: >-
              The retained evidence names four concrete references — China Merchants Energy Shipping, COSCO Bulk,
              Qingdao Port, and Yantai Port — and pairs those with a cumulative vessel-operation metric and large
              reported order volume.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU005
          - type: callout
            title: Durability and concentration still lack the metrics investors usually want
            body: >-
              No retained public source discloses customer count, renewals, NRR/GRR, churn, average contract length, or
              top-customer concentration, so the current proof set is strong on usage anecdotes and weak on revenue
              quality.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk profile
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks are the ones that sit between promising demonstrations and repeatable
              international deployment. Publicly retained sources do show unusually strong momentum for a 2023-founded
              marine-robotics company, including a >RMB1 billion A round, claimed >RMB1 billion of first-half 2026
              orders, and a product footprint spanning near-shore, deep-sea, and water-surface operations. The same
              source set also makes clear why the risk budget remains elevated: underwater work combines low visibility,
              turbidity, currents, pressure, corrosion, and complex geometries, while Singapore's port innovation brief
              says existing robotic inspection and cleaning solutions still have capability and capacity gaps under
              these conditions. That mix makes Shihang's near-term thesis depend less on finding demand than on proving
              reliable, certifiable, and serviceable performance across hard sites.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.2'
        title: Regulatory and standards gating
        blocks:
          - type: paragraph
            body: >-
              The cleanest legal or regulatory signal in the pool is not a permit already won by Shihang, but the bar
              that serious port operators now set for in-water hull inspection and cleaning. MPA's 2025-26 call for
              proposals requires conforming to relevant IMO and ISO standards, validated waste capture and filtration,
              cybersecurity controls, measurable field-trial improvements, and shipowner or operator commitments.
              Shihang does have a useful mitigation: Chinese reporting says it participated in the January 2026
              operating standard for underwater cleaning robots, and the company launched its CEORION model in April
              2026. Even so, the retained evidence does not yet identify named overseas certifications, port approvals,
              or verified environmental-compliance outcomes, so internationalization remains gated by diligence rather
              than assumed from domestic momentum.
            claimRefs:
              - CR004
              - CR006
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR007
      - number: '7.3'
        title: Dependency and capital-scaling risk
        blocks:
          - type: paragraph
            body: >-
              Shihang's commercial scale-up depends on counterparties on three fronts at once: customers that will
              sponsor pilots and recurring operations, ecosystem partners that can help deliver port or offshore
              workflows, and capital providers willing to finance a broad product-and-geography buildout before public
              unit economics are visible. The funding round itself is a double-edged signal. It materially reduces
              near-term financing risk, but the stated use of proceeds for core R&D, global expansion, and ecosystem
              construction also underlines how much investment is still required. That matters because the target market
              is globally distributed and procurement standards are set by large fleet owners, ports, and
              well-capitalized incumbents rather than by a single domestic buying center.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR006
              - CR008
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Diligence triggers and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The diligence path should stay tightly tied to measurable closure tests instead of narrative momentum. A
              positive update would be named overseas port or class approvals, independently verified waste-capture and
              cybersecurity controls, repeatable field KPIs for uptime and cleaning outcomes, and evidence that the 2026
              order base is converting into audited revenue rather than one-off pilots. A negative update would be the
              opposite: more capital raised without equivalent proof of certified deployment, orders, or service
              density; concentration around a small set of counterparties; or a widening gap between global ambitions
              and the public evidence of delivery readiness. Until those checks are closed, the company remains
              investable to study, but not yet de-risked enough to treat scale-up as executionally routine.
            claimRefs:
              - CR001
              - CR006
              - CR008
              - CR010
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top thesis-break risk
            body: >-
              The most important unresolved risk is not whether ports and shipowners care about robotic hull work, but
              whether Shihang can clear formal compliance, waste-handling, cybersecurity, and repeatable
              field-performance requirements quickly enough to turn momentum into named overseas production references.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: callout
            title: What would reduce risk fastest
            body: >-
              The clearest de-risking package would be named third-party approvals, independently measured cleaning or
              inspection KPIs, and audited evidence that the 2026 order base is converting into recurring revenue rather
              than pilot-heavy demand.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing strength is real, but price support is still missing
        blocks:
          - type: paragraph
            body: >-
              The most concrete public valuation signal is that Shihang closed an A round of more than RMB 1 billion in
              June 2026 and the round appears to have drawn both new strategic investors and large follow-on support
              from earlier backers. That matters because it reduces near-term financing risk and gives management
              capital to keep funding R&D and overseas expansion. It does not, however, answer the question that matters
              most for an investor entering today: public sources still do not disclose post-money valuation, price per
              share, dilution, liquidation preferences, or audited revenue quality. Without those terms, the round
              proves demand for the story but not fairness of the price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
      - number: '8.2'
        title: The thesis is built on real demand and technical breadth, but the anti-thesis is commercialization proof
        blocks:
          - type: paragraph
            body: >-
              The upside case is easy to describe. Maritime operators have a large global installed base to service,
              biofouling creates measurable fuel and emissions pain, and regulators are pushing for more disciplined
              hull-management practices. Shihang also has a stronger public financing signal than most early
              marine-robotics peers, plus credible claims of broad deployment across cleaning, inspection, offshore
              energy, and security use cases. The anti-thesis is that much of the public proof still comes from
              company-led disclosures. Orders above RMB 1 billion are encouraging, but public sources do not yet show
              audited revenue conversion, sustained margins, or retention economics, while independent market data still
              describes the high-end segment as led by established foreign players.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario framing should use milestones, not false precision
        blocks:
          - type: paragraph
            body: >-
              A model-appropriate valuation frame for Shihang is milestone based rather than multiple based. Public
              evidence supports a large addressable maritime need, a strong recent financing round, and claimed
              commercial traction, but it does not support a defendable revenue multiple because the denominator is
              still opaque. The right comparable context is therefore a mix of sector demand, frontier-tech execution
              difficulty, and the company's own financing milestone. In a bull case, audited revenue conversion and
              successful port deployments could justify a premium narrative; in the base case, the round remains a
              proof-of-interest signal; in the bear case, undisclosed terms plus execution slippage could make a later
              financing or secondary entry look far less attractive than the headline round size suggests.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.4'
        title: 'Final view: research more until pricing and operating proof tighten'
        blocks:
          - type: paragraph
            body: >-
              The recommendation should stay price-sensitive. Shihang has enough evidence to merit continued diligence
              because market need, regulatory momentum, and financing support are all tangible. But the next diligence
              step must be to convert narrative proof into investment proof: exact round terms, audited revenue
              recognition, backlog quality, concentration, margin structure, and measurable overseas trial results. The
              cleanest thesis-break triggers are a materially weak disclosed cap table, failure to show real conversion
              from order announcements to revenue and cash collection, or an inability to meet port cleaning,
              filtration, cybersecurity, and certification benchmarks in Singapore-class deployments. Until those data
              points are public, the prudent stance is research-more rather than conviction buying.
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Keep the company in diligence, not in a blind price chase
            body: >-
              Shihang's financing signal is too strong to ignore, but the public record is still too thin on price and
              economics to justify a conviction entry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV010
              - CV012
          - type: callout
            title: The real downside is paying for narrative before proof
            body: >-
              A large round and large order headline can coexist with later disappointment if audited revenue
              conversion, compliance clearance, or overseas deployment metrics fail to catch up.
            calloutType: risk
            claimRefs:
              - CV004
              - CV010
              - CV014
