              - CM009
              - CM014
      - number: '2.4'
        title: Adoption drivers, constraints, and remaining gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are tangible and operational rather than speculative: biofouling raises drag, fuel use,
              and emissions; in-water cleaning reduces dry-dock dependence and keeps vessels working; and marine labor
              remains risky and scarce in low-visibility, corrosive, current-heavy environments. The main constraints
              are equally concrete. Public buyer criteria still demand performance in harsh conditions, safe operation
              near berths without disrupting cargo handling, better coverage of complex hull geometries, reliable waste
              capture and filtration, strong cybersecurity, and evidence that service capacity can scale. Shihang's
              reported order momentum is encouraging, but the chapter still lacks public data on contract mix, renewal
              behavior, pricing, and workflow-level revenue conversion, so market sizing remains materially incomplete.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
