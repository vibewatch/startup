      - number: '2.3'
        title: Buyer, user, and payer structure
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer evidence in the pool comes from hull inspection and cleaning, where shipowners and
              operators are the named primary end users, port environments constrain how work can be performed, and
              regulators or port authorities shape acceptable safety, waste-capture, and operational standards. In that
              workflow, the robot user is an inspection or cleaning team, but the economic buyer is tied to the vessel's
              operating budget because fuel efficiency, downtime, and turnaround time drive ROI. The company coverage
              suggests adjacent expansion into offshore energy, marine ranching, and subsea security, but public
              budget-owner evidence for those segments is much thinner than for port-servicing use cases.
            claimRefs:
              - CM002
              - CM007
              - CM008
              - CM011
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
