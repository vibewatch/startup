            title: Moat depends on port-grade execution, not just capital
            body: >-
              The retained evidence suggests that live-port execution standards are the real separator. Shihang's
              capital and order signals are strong, but MPA's requirements show buyers still care most about geometry
              handling, debris capture, filtration, productivity, and standards-aligned reporting in real operations.
            calloutType: risk
            claimRefs:
