      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Shihang's public moat case rests on breadth and operating difficulty. News coverage repeats the company's
              claim that it controls six core subsystems, supports full-depth operations from 0 to 10,000 meters, and is
              already deployed across several underwater scenarios, which makes it look broader than a single-purpose
              hull-cleaning robot. But the same evidence also shows why the moat should be treated as provisional. MPA
              explicitly says current robotic solutions still have unresolved gaps, and RobotAIGeek frames the central
              strategic risk as scale-before-replication: if better-capitalized rivals can copy enough of the core stack
              before Shihang converts trials and orders into repeatable service infrastructure, today's lead can narrow.
              The strongest near-term differentiators therefore appear to be standards posture, operational proof, and
              customer validation rather than capital raised alone.
