      - number: '5.2'
        title: Architecture, autonomy, and technical differentiation
        blocks:
          - type: paragraph
            body: >-
              The repeatable technical motif across the retained sources is vertical integration. Multiple June 2026
              reports state that Shihang self-develops six core systems - power, control, sensing, navigation, sealing,
              and deployment or recovery - and combines those subsystems with the CEORION marine embodied model released
              on 2026-04-25. The company says CEORION uses a unified end-to-end architecture, trained on
              commercial-operation data plus simulation data, so one model can support multiple underwater job classes
              without constant model switching. If accurate, that is the key differentiator: a common autonomy stack
              layered on top of the robot hardware rather than separate, task-specific automation silos. The public
              evidence still stops short of publishable system diagrams, integration interfaces, or independent
              benchmark methodology, so the architecture is directionally clear but not deeply auditable.
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE007
