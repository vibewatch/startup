  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence implies a mixed project-and-service revenue model anchored in robotic hull cleaning
              and adjacent subsea work rather than a clean SaaS-like subscription profile. Public reporting says
              Shihang's robots are already used in ship cleaning, underwater security, offshore wind, marine ranching,
