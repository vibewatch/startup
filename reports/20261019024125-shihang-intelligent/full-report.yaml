      - number: '1.2'
        title: Founder centrality and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The retained source set makes Chen Xiaobo the center of gravity for Shihang's public narrative. Across
              translated, financial-press, and company-aligned coverage, he is repeatedly identified as founder and CEO,
              with a Harbin Engineering University background, roughly 19 years in marine robotics, and prior work on
              China's first commercial underwater cleaning robot. That creates a credible founder-market-fit story for a
              hard-technical marine systems company. The flip side is governance opacity: within this pool, public
              sources do not name a broader board, CFO, COO, or other senior operating bench. For later diligence, that
              means the company looks institutionally thinner than its fundraising headlines suggest until cap-table
              rights, board composition, and functional leadership depth are verified directly.
