  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments are visible, but the beachhead is still shipping-led
        blocks:
          - type: paragraph
            body: >-
              The strongest public customer evidence is concentrated in ship-maintenance and port-adjacent workflows
              rather than a broad cross-industry roster. Baidu Baike and multiple June 2026 media reports consistently
              place Shihang's deployed use cases in ship cleaning, underwater security, offshore wind, marine ranching,
              and seabed inspection, but named accounts skew toward shipping operators and ports. The clearest specific
              sites are Qingdao Port and Yantai Port, while the clearest named operator users are China Merchants Energy
              Shipping and COSCO Bulk. That pattern suggests an initial beachhead where the buyer, user, and payer can
              all tie value directly to avoided diver risk, fuel drag, and turnaround time, with adjacent infrastructure
              verticals still described more as scenarios than as disclosed customer rosters.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU010
              - CU013
