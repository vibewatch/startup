  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a service-led bridge from biofouling-driven customer need to orders, but not the final
      conversion into recognized revenue and gross profit.
    data:
      nodes:
        - id: demand
          label: Biofouling pain
          value: Higher drag, fuel use, and emissions create recurring cleaning demand.
        - id: service
          label: Robotic hull work
          value: Shihang targets inspection and cleaning plus adjacent subsea missions.
        - id: qualification
          label: Qualification gate
          value: Ports and regulators require safe, debris-controlled, measurable execution.
        - id: orders
          label: Orders
          value: Publicly disclosed 2026 H1 orders exceeded RMB 1bn.
        - id: revenue
          label: Recognized revenue
          value: Public sources do not disclose acceptance timing, realized pricing, or collections.
        - id: gross-profit
          label: Gross profit
          value: Margin depends on throughput, labor, capture, filtration, and rework.
      edges:
