evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      Post-money valuation, share price, ownership dilution, liquidation preferences, debt facilities, secondaries, and
      a reconciled cumulative amount raised across all rounds.
    whyItMatters: >-
      Later valuation and return-underwriting work cannot convert the financing headlines into ownership or entry-price
      analysis without these terms.
    diligencePath: Request the signed term sheet, cap table before/after the June round, and any debt or secondary-side letters.
    relatedQuestionRefs:
      - QO005
      - QO006
  - type: private-evidence-only
    severity: material
    topic: commercial-conversion-and-scale
    missingEvidence: >-
      Audited revenue, gross margin, backlog-to-revenue conversion, customer count, concentration, retention, and
      current headcount.
    whyItMatters: Orders and awards are not the same as realized revenue quality, repeat demand, or operating leverage.
    diligencePath: >-
      Obtain audited financials, booked-vs-recognized revenue bridge, customer cohort data, and a headcount-by-function
      snapshot.
