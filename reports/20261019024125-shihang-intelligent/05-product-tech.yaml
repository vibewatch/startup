company:
  name: Shihang Intelligent
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Shihang's public product story is a full-stack marine-robotics platform:
    general-purpose surface and underwater robots, six self-developed core
    subsystems, and the CEORION embodied model that the company says unifies
    perception, task understanding, and action generation. The strongest
    external maturity signal is Maritime and Port Authority of Singapore
    selection for live-port hull-inspection and cleaning trials, but most
    architecture, performance, and reliability detail still comes from
    financing-era coverage rather than public technical documentation.
sections:
  - id: delivered-platform
    title: Delivered platform and product scope
    body: >-
      Public coverage consistently describes Shihang as a marine general-purpose
      robotics company rather than a single-point-product vendor. Financing
      reports say the company develops, produces, sells, and services marine
      robots, surface robots, and core accessories, while also positioning the
      installed base around high-risk marine workflows such as hull cleaning,
      subsea security, offshore wind and photovoltaic maintenance, sea ranching,
      and subsea inspection. The strongest supported interpretation is that
      Shihang is trying to sell a reusable hardware-and-software platform whose
      applications can be reconfigured across multiple underwater jobs, not just
      a one-off cleaning robot. What remains missing is a public SKU map, named
      commercial packages, or product documentation that would let an investor
      separate mature deliverables from broader platform ambition.
    claimRefs: [CE001, CE003, CE004]
    tableRefs: [TE001]
  - id: architecture-and-autonomy
    title: Architecture, autonomy, and technical differentiation
    body: >-
      The repeatable technical motif across the retained sources is vertical
      integration. Multiple June 2026 reports state that Shihang self-develops
      six core systems - power, control, sensing, navigation, sealing, and
      deployment or recovery - and combines those subsystems with the CEORION
      marine embodied model released on 2026-04-25. The company says CEORION
      uses a unified end-to-end architecture, trained on commercial-operation
      data plus simulation data, so one model can support multiple underwater
      job classes without constant model switching. If accurate, that is the
      key differentiator: a common autonomy stack layered on top of the robot
      hardware rather than separate, task-specific automation silos. The public
      evidence still stops short of publishable system diagrams, integration
      interfaces, or independent benchmark methodology, so the architecture is
      directionally clear but not deeply auditable.
    claimRefs: [CE002, CE005, CE006, CE007, CE013, CE014]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-maturity
    title: Deployment maturity and operating constraints
    body: >-
      Shihang's public maturity case rests on two layers of evidence. First,
      company-linked financing coverage says its robots already operate across
      0-10000 meter depths and have scaled into ship cleaning, offshore energy,
      aquaculture, security, and subsea inspection scenarios. Second, the
      independent proof point is MPA's decision to select SEAHI Robotics among
      six partners for in-water hull inspection and cleaning trials in the Port
      of Singapore, with technology validation under live operating conditions
      beginning in the second half of 2026. That matters because MPA also spells
      out the real engineering bottlenecks: complex hull geometry, stronger
      currents, tight working spaces alongside vessels, debris capture, and the
      need to operate safely without disrupting port traffic. In other words,
      Shihang has graduated from generic robot storytelling into a real port
      validation program, but the hardest reliability and environmental-proof
      questions are explicitly still being tested rather than already settled.
    claimRefs: [CE003, CE004, CE008, CE009, CE010, CE016]
    tableRefs: [TE002]
  - id: controls-and-gaps
    title: Trust, compliance, and diligence gaps
    body: >-
      The assigned evidence set supports only a limited public controls story.
      On the positive side, Singapore's live-port program explicitly evaluates
      safety, cost-effectiveness, environmental sustainability, and compliance
      with global requirements and standards, so Shihang is at least entering a
      workflow where those controls are tested. In China, the 2024 national AI
      standardization notice also shows that embodied-AI claims sit inside an
      increasingly formal policy environment. But investors should not confuse
      that backdrop with completed company proof. The retained pool does not
      provide public integration docs, a product security or privacy program,
      detailed certification inventory, uptime data, debris-capture results,
      failure-rate data, or meaningful developer-signal evidence. That leaves
      product readiness more mature than a pure concept company, yet still
      under-documented for technical diligence.
    claimRefs: [CE008, CE010, CE011, CE012]
