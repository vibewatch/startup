  evidenceGaps:
    - type: missing-source
      severity: material
      topic: product-documentation
      missingEvidence: Public product documentation, SKU sheets, integration guides, and interface details for Shihang's robot platforms and accessories.
      whyItMatters: Without vendor-grade documentation, investors cannot separate shipping features from roadmap claims or evaluate deployment complexity.
      diligencePath: Request current product catalogs, deployment architecture diagrams, and customer-facing implementation documentation from management.
      relatedQuestionRefs: [QE001, QE002, QE003]
      relatedTableRefs: [TE001, TE003]
    - type: private-evidence-only
      severity: material
      topic: reliability-and-operations
      missingEvidence: Uptime, mission-success rates, maintenance intervals, debris-capture performance, and failure logs from real deployments.
      whyItMatters: The main product risk is whether the robots can perform safely and repeatedly in difficult marine environments rather than only in demos.
      diligencePath: Obtain trial reports, operating dashboards, and post-mission QA summaries for commercial and MPA-style deployments.
      relatedQuestionRefs: [QE004, QE006, QE007]
      relatedTableRefs: [TE002, TE003]
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public code repositories, package telemetry, developer docs, practitioner forum activity, or a documented proxy showing external technical adoption.
      whyItMatters: The chapter brief explicitly asks for developer-signal or a close practitioner proxy, and the assigned pool does not provide one.
      diligencePath: Request public or private developer documentation, partner-integration metrics, or practitioner-community references that can serve as a proxy.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: minor
      topic: security-and-compliance
      missingEvidence: A public security, privacy, certification, and quality-control inventory tied to the robot fleet and CEORION stack.
      whyItMatters: Live-port trials and AI-standardization context are useful, but they do not prove the specific controls that an operator or regulator would audit.
      diligencePath: Request certifications, cybersecurity policies, safety cases, and privacy-governance materials used in customer deployments.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
