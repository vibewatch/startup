companyProfile:
  summary: >-
    Norm Ai is a privately held New York legal-AI company that encodes legal and regulatory requirements into executable
    AI workflows and operates alongside the affiliated Norm Law AI-native law firm. The public record supports a
    differentiated full-stack model and substantial institutional financing, while leaving core operating and governance
    details undisclosed.
