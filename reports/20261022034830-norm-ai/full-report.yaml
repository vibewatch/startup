          - type: paragraph
            body: >-
              Law.com and Artificial Lawyer both report a $120 million Series C announced in July 2026 at a $1.2 billion
              valuation, led by Khosla Ventures with participation from a broad institutional and strategic investor
              set. Artificial Lawyer reports more than $260 million raised since founding, while Multiples presents a
