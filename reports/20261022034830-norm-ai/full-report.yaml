              - CM010
              - CM014
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary economic buyer is likely the general counsel, chief compliance officer, or legal-operations
              leader; daily users include lawyers, compliance teams, business reviewers, and the engineers who integrate
              the platform. The enterprise is the payer for software, while a legal-services client pays Norm Law for
              defined outcomes rather than human hours. Adoption begins with recurring, rules-heavy work where both
              parties can specify scope in advance. It then advances from identifying noncompliance, to recommending
              remediation, to executing actions. Institutional trust still depends on barred-attorney review,
              client-specific calibration, and senior legal talent. The model is therefore both product- and
              service-intensive, which can accelerate trust but may slow deployment and constrain gross-margin
              scalability.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM008
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are persistent regulatory complexity, the cost and latency of manual review, demand for
              faster first-pass work, and the need to govern autonomous AI in high-stakes settings. Norm Ai's reported
              institutional footprint and 2026 financing support demand credibility, while planned hiring and broader
              practice coverage indicate an expansion strategy. The constraints are equally material: every outward
              legal deliverable still receives attorney supervision; integrations must satisfy enterprise reliability,
              security, identity, recordkeeping, and document-processing requirements; and client-specific knowledge
              must be configured over time. Outcome pricing also favors repeatable matters and excludes work whose scope
              cannot be understood beforehand. For valuation, the central diligence question is whether repeat workflow
              volume and software reuse can outgrow the costly legal, engineering, and implementation capacity required
              to earn institutional trust.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
