        title: Institutional distribution is credible but economically unquantified
        blocks:
          - type: paragraph
            body: >-
              Norm Ai's go-to-market evidence points toward large regulated institutions and channel-assisted enterprise
              distribution. The company says clients representing more than $30 trillion in combined assets under
              management use its systems, and its Microsoft announcement places the product in Microsoft Marketplace and
              Microsoft 365 workflows. Bain Capital Ventures describes a strategy of adding Fortune 100 customers and
              reports that compliance reviews that formerly took days can take minutes. These are credible demand and
