  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Norm Ai's public product description is a compliance-workflow system rather than a generic chatbot. Bain
              Capital Ventures describes a proprietary language that represents regulations and corporate policies as
              decision trees, with LLM-driven agents traversing those trees to conduct compliance analyses. Users upload
              artifacts, the system executes regulation-specific modules, and the resulting findings include
              explanations and evidence tracking. The same source describes collaboration features for tagging,
              comments, and historical decisions, positioning the product as a system of record that moves work out of
              email. A later company-issued recruiting surface frames the product as two related experiences: enterprise
              application surfaces for associates, partners, and operations, plus shared backend services for document
              processing, AI orchestration, and integration pipelines. These descriptions make the workflow legible from
              input artifact through rule execution, human review, and recorded decision, while leaving the exact
              customer configuration and service-level guarantees unverified.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
