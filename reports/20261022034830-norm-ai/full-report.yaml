      - number: '4.3'
        title: The delivery model combines software and expert labor
        blocks:
          - type: paragraph
            body: >-
              The visible cost architecture combines cloud and model infrastructure with attorney-intensive delivery.
              Norm Ai says Microsoft Foundry supplies security, governance, and operational controls through Azure,
              while its technology page says attorneys build, test, and refine agents before deployment. The current
              careers page also lists roles spanning legal practice, analytics, accounting, marketing, recruiting,
              administration, and engineering. Together, those signals imply material cloud, model, high-skill labor,
              implementation, and supervision costs, but they do not quantify any category. Outcome pricing could pass
              automation benefits to clients while improving throughput, yet it can also leave Norm bearing delivery
              risk when matters require more senior judgment than expected. Gross margin, cloud and LLM spend, attorney
              utilization, implementation effort, capex, working capital, and entity-level cost allocation remain
              private.
            claimRefs:
              - CI009
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financing strength does not resolve liquidity or unit economics
        blocks:
          - type: paragraph
            body: >-
              Norm Ai raised a $120 million Series C at a $1.2 billion valuation in July 2026 and says cumulative
              funding exceeds $260 million. The announced uses are hiring, additional practice coverage, and supervisory
              agents, but no retained source supplies the current cash balance, monthly burn, debt, restricted cash,
              covenant burden, runway, budget allocation, or next-round trigger. Funding raised is not cash available,
              and transaction valuation is not revenue. Artificial Lawyer's commentary makes the resulting execution
              risk explicit: capital at this scale creates pressure to grow and take share from Big Law. The financial
              verdict is therefore conditional. Norm Ai has strong access to capital and plausible enterprise
              monetization routes, but revenue quality, margin durability, sales efficiency, liquidity, and the economic
              boundary between Norm Ai and Norm Law remain underwriting blockers pending private diligence.
            claimRefs:
