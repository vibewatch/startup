      - number: '3.3'
        title: Pricing, displacement risk, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a strategic contrast between Norm Law's outcome-based pricing claim and
              traditional hourly billing, but it does not disclose list prices, realized rates, minimum commitments,
              discounts, gross margins, or comparable customer contracts. Competitors can attack from several
              directions: general AI vendors can lower the cost of document and reasoning primitives; incumbent law
              firms can bundle trusted advice and client relationships; and enterprise teams can build narrow rules or
              retain existing workflows. Norm's capital and senior-lawyer recruiting may accelerate practice-area
              coverage, yet independent commentary also frames the financing as creating pressure to pursue Big Law
              market share. The resulting moat thesis is conditional on converting legal-engineering know-how and
              reference accounts into embedded workflows that are costly to replace, a proposition that requires private
              diligence.
