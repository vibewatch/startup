      - number: '1.4'
        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The available record shows a rapid sequence from research and founding to financing, a 2025 launch of the
              affiliated AI-native law firm, senior legal hiring, a Legal AGI Lab, and the 2026 Series C. The company’s
              own chronology is useful for identifying stated milestones but is not independent verification of every
              event. A material gap is the legal and economic boundary between Norm Ai and Norm Law: public sources call
