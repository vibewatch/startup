  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market is a stack of alternatives to the same regulated-work outcome: internal compliance and
              legal teams can retain manual review, buy workflow software, use general-purpose AI with human controls,
              engage traditional law firms, or adopt an AI-native provider. Norm's own materials describe a platform
              that converts regulatory requirements into AI code and a separate affiliated law firm, while independent
              coverage describes Norm Law as an outcome-priced alternative to hourly legal services. This makes
              traditional firms and internal teams substitutes even when they do not offer the same software. The
              strongest public differentiation is therefore operating-model integration, not a proven feature monopoly.
              The available public record does not identify a complete competitor list, customer win/loss sample, or
              head-to-head benchmark against Harvey, Legora, or incumbent compliance suites; those cells remain evidence
              gaps rather than inferred rankings.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
