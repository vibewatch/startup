  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable boundary is the spend attached to executing legal and regulatory workflows for regulated
              enterprises, not all legal services, all governance-risk-compliance software, or all generative AI. Norm
              Ai combines a compliance platform that encodes rules into agents with an affiliated law firm focused on
              repeatable transactional, funds, and regulatory work. The adjacent opportunity is supervisory AI that
              checks other agents in regulated environments. Status-quo substitutes include internal legal and
              compliance teams, external law firms and other service providers, workflow-tracking software, and copilots
              that assist a human without independently completing a first pass. This boundary matters because workflow
              execution can capture software economics only where tasks are sufficiently structured; bespoke or
              indeterminate matters remain outside the near-term serviceable market.
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM007
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM006
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not support a dollar TAM, SAM, SOM, category CAGR, or market-share calculation.
              The repeatedly reported figure that client institutions manage more than $30 trillion in assets is a
              customer-footprint denominator, not legal or compliance spend and not Norm Ai revenue. Likewise, the July
              2026 financing at a reported $1.2 billion post-money valuation is a company valuation rather than evidence
              of market size. These signals show that large institutions will engage with the model and that investors
              are funding expansion, but neither provides the budget denominator needed for underwriting. A defensible
              sizing model therefore requires private pricing and customer-volume data plus an external benchmark for
              addressable workflow spend.
            claimRefs:
              - CM004
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM011
              - CM012
