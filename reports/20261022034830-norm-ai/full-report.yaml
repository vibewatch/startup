              - CP003
              - CP009
              - CP010
              - CP011
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Norm's product and hiring descriptions point to enterprise requirements that matter in regulated
              workflows: document processing, AI orchestration, integration pipelines, scalable services, observability,
              security controls, and support for enterprise identity and retention requirements. The company also pairs
              technical delivery with legal engineers and senior lawyers, which can reduce the buyer's coordination
              burden when the job requires both software and legal judgment. That combination is a plausible trust and
              distribution advantage, especially where institutional references and regulated workflows matter. It is
              not yet a demonstrated moat: the sources do not disclose implementation time, renewal rates, switching
              costs, model error rates, or the share of work that remains human-supervised. Hiring pages are
              company-originated reposts and should be treated as directional evidence of intended architecture and
              staffing, not independent proof of performance.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
