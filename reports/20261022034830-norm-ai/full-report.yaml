chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product architecture
        blocks:
          - type: paragraph
            body: >-
              Norm Ai describes itself as an agentic-law company serving legal and compliance workflows. Its public site
              says its system represents regulatory requirements in AI code and applies compliance checks at the source
              of business activity, while its affiliated Norm Law entity uses the same legal-intelligence platform for
              legal work. An independent investor description says the company was founded by John Nay in 2023 and
              translates regulations into decision trees that AI agents traverse for compliance analysis. This supports
              a differentiated product thesis, but the evidence is primarily company or investor supplied rather than an
              audited product disclosure. The company’s current public materials also describe a broader full-stack
              model spanning Norm Law, Norm Technology, and legal-AI consulting, so the operating perimeter should not
              be assumed to equal a single SaaS product.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Leadership, talent, and operating model
        blocks:
          - type: paragraph
            body: >-
              John Nay is identified as founder and CEO in the Bain Capital Ventures profile, which also describes his
              legal-AI research background and prior work on LegalBench. That source identifies Patrick Vergara as COO
              and describes an engineering and legal-engineering team recruited from technology companies, universities,
              government, and major law firms. Current hiring materials show product engineers working with client
              engagement and end users, while backend engineers build document processing, AI orchestration, and
              integration systems. Norm’s public materials name Mike Schmidtberger as Norm Law chairman and partner from
              January 2026, indicating a deliberate effort to add senior legal leadership. The public record still
              identifies one principal corporate founder and does not provide a complete board, executive roster, or
              governance-rights disclosure, leaving key-person and control diligence open.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
