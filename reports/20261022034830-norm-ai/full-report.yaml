  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture remains only partly visible
        blocks:
          - type: paragraph
            body: >-
              The public record supports two monetization descriptions rather than one homogeneous SaaS model. Multiples
              characterizes Norm Ai's B2B platform revenue model as subscription, while Norm Ai says affiliated Norm Law
              prices legal work according to outcomes rather than hours. Norm Ai also states that it is the technology
              and service provider to an independent law firm, so software and legal-service economics should be
              underwritten separately even when they share technology. None of the retained sources discloses recognized
              revenue, ARR, revenue mix, contract duration, implementation fees, realized matter pricing, or gross
              profit. The disclosed mechanisms are therefore useful for mapping possible revenue streams, but they do
              not establish their scale, recurrence, accounting treatment, or margin.
            claimRefs:
