            title: Do not capitalize the $30T denominator as TAM
            body: >-
              The figure describes assets managed by client institutions. Without compliance-spend intensity,
              eligible-workflow volume, pricing, or penetration, it cannot be converted into market size or revenue
              potential.
            calloutType: insight
            claimRefs:
              - CM004
              - CM011
          - type: callout
            title: Trust creates demand and delivery cost
            body: >-
              Human signoff, senior legal expertise, client-specific calibration, and enterprise-grade integration help
              unlock regulated buyers, but they also make the near-term model implementation-heavy.
            calloutType: risk
            claimRefs:
