        - label: Deployment-ready subset
          value: Workflows meeting reliability, security, integration, and supervision requirements
          detail: Human legal review remains part of the delivered service.
        - label: Observable proof point
          value: Client institutions reported above $30T AUM
          detail: AUM indicates customer scale, not addressable spend or revenue.
    approximationNotes: >-
      No layer width or order represents a monetary estimate; the hierarchy is qualitative because TAM, SAM, SOM,
      pricing, and penetration are undisclosed.
    claimRefs:
      - CM008
      - CM010
      - CM014
