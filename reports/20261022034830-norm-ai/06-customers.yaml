callouts:
  - calloutType: strength
    title: Institutional buyer relevance
    body: "Named Blackstone deployment evidence and the reported $30T aggregate AUM reach indicate access to high-value regulated workflows, even though the underlying account schedule is not public."
    claimRefs: [CU005, CU009]
  - calloutType: risk
    title: Durability is not yet underwritable
    body: "No assigned source discloses renewal, churn, NRR, GRR, contract term, or customer-level outcomes; the reported customer reach should not be converted into retention or revenue conclusions."
    claimRefs: [CU007, CU014]
