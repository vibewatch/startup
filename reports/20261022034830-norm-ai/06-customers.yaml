    notes: "This is a partial enumeration of named or described proof, bounded to the assigned public sources and current refresh evidence. Unnamed institutions are not treated as named customers."
    enumerationScope:
      coverage: partial
      basis: "Public customer and market coverage available in the assigned pool through 2026-10-22, with named deployments separated from aggregate AUM claims."
    claimRefs: [CU009, CU010, CU011, CU012]
