  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: disclosure
      missingEvidence: Audited or management-provided revenue, ARR, gross margin, cash, burn, runway, and combined Norm Ai/Norm Law headcount.
      whyItMatters: The financing valuation cannot be underwritten from funding headlines or client-AUM claims without operating performance and liquidity metrics.
      diligencePath: Request the latest board-approved KPI pack, monthly financials, cash forecast, capitalization table, and entity-level headcount split.
      relatedQuestionRefs: [QO005, QO007]
    - type: conflicting-data
      severity: material
      topic: financing
      missingEvidence: A reconciled financing ledger showing round dates, gross proceeds, fees, valuation basis, and whether the reported $256M and more-than-$260M totals use the same perimeter.
      whyItMatters: Inconsistent lifetime-funding totals can distort dilution, capital sufficiency, and valuation analysis.
      diligencePath: Reconcile signed financing documents and investor schedules with the company’s official financing history.
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: operating-model
      missingEvidence: Corporate chart and agreements defining ownership, fee flows, supervision, and governance between Norm Ai and Norm Law.
      whyItMatters: The affiliated law-firm structure may change regulatory, professional-responsibility, revenue-recognition, and control assessments.
      diligencePath: Obtain entity ownership records, intercompany agreements, board minutes, and professional-responsibility memoranda.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002, TO003]
    - type: enumeration-incomplete
      severity: material
      topic: milestones
      missingEvidence: Independent adverse-event search covering litigation, regulatory actions, outages, layoffs, and customer losses.
      whyItMatters: The current pool supports a milestone chronology but cannot establish that no material adverse event occurred.
