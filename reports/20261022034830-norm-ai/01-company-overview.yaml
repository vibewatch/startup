company:
  name: Norm Ai
chapter:
  number: 1
  title: Company Overview
  summary: Norm Ai is a privately held New York legal-AI company combining regulatory-compliance software with the affiliated Norm Law AI-native law firm. Public evidence supports a July 2023 founding, a $120 million Series C at a $1.2 billion valuation in 2026, and institutional client exposure, but revenue, headcount, governance rights, and the precise company/law-firm structure remain incompletely disclosed.
sections:
  - id: identity-and-product
    title: Identity and product architecture
    body: Norm Ai describes itself as an agentic-law company serving legal and compliance workflows. Its public site says its system represents regulatory requirements in AI code and applies compliance checks at the source of business activity, while its affiliated Norm Law entity uses the same legal-intelligence platform for legal work. An independent investor description says the company was founded by John Nay in 2023 and translates regulations into decision trees that AI agents traverse for compliance analysis. This supports a differentiated product thesis, but the evidence is primarily company or investor supplied rather than an audited product disclosure. The company’s current public materials also describe a broader full-stack model spanning Norm Law, Norm Technology, and legal-AI consulting, so the operating perimeter should not be assumed to equal a single SaaS product.
    claimRefs: [CO001, CO002, CO003, CO004]
  - id: leadership-and-operating-model
    title: Leadership, talent, and operating model
    body: John Nay is identified as founder and CEO in the Bain Capital Ventures profile, which also describes his legal-AI research background and prior work on LegalBench. That source identifies Patrick Vergara as COO and describes an engineering and legal-engineering team recruited from technology companies, universities, government, and major law firms. Current hiring materials show product engineers working with client engagement and end users, while backend engineers build document processing, AI orchestration, and integration systems. Norm’s public materials name Mike Schmidtberger as Norm Law chairman and partner from January 2026, indicating a deliberate effort to add senior legal leadership. The public record still identifies one principal corporate founder and does not provide a complete board, executive roster, or governance-rights disclosure, leaving key-person and control diligence open.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing and observable scale
    body: Law.com and Artificial Lawyer both report a $120 million Series C announced in July 2026 at a $1.2 billion valuation, led by Khosla Ventures with participation from a broad institutional and strategic investor set. Artificial Lawyer reports more than $260 million raised since founding, while Multiples presents a $256 million five-round total; the difference is material and should be preserved rather than normalized. Earlier Bain Capital Ventures materials document a $27 million Series A in June 2024 and identify investors including Coatue, Blackstone, Citi, New York Life, TIAA, and Tony James. Norm’s public website reports clients with more than $35 trillion in combined assets in a 2026 forum page, while current hiring materials state $30 trillion; these are exposure or client-AUM claims, not Norm revenue or customer count. Revenue, ARR, margin, employee count, and net cash remain unsupported.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO001, TO003]
    figureRefs: [FO001]
  - id: milestones-and-gaps
    title: Milestones and unresolved diligence
    body: >-
      The available record shows a rapid sequence from research and founding to financing, a 2025 launch of the affiliated AI-native law firm, senior legal hiring, a Legal AGI Lab, and the 2026 Series C. The company’s own chronology is useful for identifying stated milestones but is not independent verification of every event. A material gap is the legal and economic boundary between Norm Ai and Norm Law: public sources call them separate but affiliated, while the financing is described as going to the technology company. Further diligence should obtain entity ownership, intercompany arrangements, board composition, investor rights, client concentration, recurring revenue, and the evidentiary basis for client-AUM figures. No source in the assigned pool establishes a specific lawsuit, regulatory enforcement action, outage, or other adverse event; that absence is a search limitation, not evidence that none exists.
    claimRefs: [CO014, CO015, CO016]
    tableRefs: []
    figureRefs: []
