callouts:
  - calloutType: strength
    title: Structural differentiation
    body: The combination of legal-engineering software, supervised AI agents, and an affiliated law firm creates a distinct operating model, although its economics and governance are not yet transparent.
    claimRefs: [CO002, CO003, CO015]
  - calloutType: risk
    title: Disclosure and entity-boundary risk
    body: The assigned sources do not establish revenue, ARR, headcount, board rights, client concentration, or the precise economic relationship between Norm Ai and Norm Law.
    claimRefs: [CO012, CO013]
