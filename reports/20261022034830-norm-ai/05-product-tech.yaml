  evidenceGaps:
    - type: missing-source
      severity: material
      topic: technical-validation
      missingEvidence: Independent production evidence for accuracy, latency, uptime, security controls, tenant isolation, and incident response.
      whyItMatters: Regulated enterprise workflows can create material legal and operational exposure when model or integration failures are not bounded and auditable.
      diligencePath: Request architecture and data-flow diagrams, evaluation reports, penetration-test or certification materials, audit logs, incident history, and customer references.
      relatedQuestionRefs: [QE005, QE007]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public or customer-verifiable developer-signal evidence such as releases, benchmarks, package activity, or practitioner deployments.
      whyItMatters: Job descriptions describe intended engineering practices but do not demonstrate that the platform has reached repeatable production maturity.
      diligencePath: Request a versioned release history, test-coverage summary, deployment metrics, and anonymized production workload evidence.
      relatedQuestionRefs: [QE005, QE008]
    - type: missing-source
      severity: material
      topic: autonomy
      missingEvidence: Measured split between automated decisions, human review, escalations, and corrective actions by workflow.
      whyItMatters: Autonomy level affects safety, staffing, customer value, and the risk of treating a marketing roadmap as current product capability.
      diligencePath: Request workflow-level activity logs and a sample of reviewed cases with outcomes and escalation reasons.
      relatedQuestionRefs: [QE007, QE008]
    - type: access-blocked
      severity: minor
      topic: external-technical-proof
      missingEvidence: Accessible independent technical documentation or customer implementation material beyond the assigned pool.
      whyItMatters: The available external sources are mainly investor commentary and company job postings, limiting independent corroboration.
      diligencePath: Obtain permissioned technical briefings, customer references, or public documentation links during diligence.
      relatedQuestionRefs: [QE005, QE007]
