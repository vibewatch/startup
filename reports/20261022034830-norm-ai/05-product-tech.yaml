      - ["Coordinate compliance decisions", "conversations can sit in email", "tag users, comment, and retain historical decisions", "centralized decision history is described", "no public proof of adoption or retention"]
      - ["Review technology transactions", "drafting and diligence require repeated document work", "AI agents generate, compare, revise, and review transaction documents", "workflow acceleration is asserted", "job-posting claim lacks customer outcome data"]
    notes: Benefits are source-reported or company-described and should not be read as measured customer outcomes.
    claimRefs: [CE002, CE003, CE011, CE014]
  - id: TE003
    title: Technology and operating architecture
    columns: [layer or process, role, dependency, risk or verification need]
    rows:
      - ["Legal representation layer", "encode regulations and policies as decision trees / machine-readable rules", "legal-engineering expertise and regulatory updates", "verify rule completeness, versioning, and review controls"]
      - ["AI execution layer", "traverse decision graphs and perform compliance analysis", "LLM providers and model behavior", "quantify hallucination, drift, abstention, and model-switching effects"]
      - ["Document and workflow services", "process files, distributed jobs, and integration pipelines", "storage, queues, external systems", "verify tenant isolation, retries, and data-loss handling"]
      - ["Platform reliability layer", "observability, security controls, testing, and CI/CD", "cloud infrastructure and provider APIs", "obtain deployed topology, control evidence, RTO/RPO, and incident history"]
    notes: Architecture rows synthesize role descriptions and partner commentary; they are not a verified production topology.
    claimRefs: [CE005, CE006, CE007, CE008]
figures:
  - id: FE001
    title: Norm Ai product architecture map
    type: stack
    summary: Public evidence describes a layered path from legal representation through agent execution, workflow services, and supervised enterprise use.
    data:
      layers:
        - label: Legal representation
          detail: Public descriptions place regulatory and policy logic in a maintained legal representation layer.
          items:
            - label: Regulations and corporate policies
              detail: Converted into a proprietary language, decision trees, or machine-readable rules.
            - label: Legal engineering
              detail: Lawyers and legal engineers create, supervise, calibrate, and improve domain-specific agents.
        - label: Agent execution
          detail: Public descriptions place LLM-driven analysis and evidence production in this execution layer.
          items:
            - label: Decision-graph traversal
              detail: LLM-driven agents conduct compliance analyses against represented requirements.
            - label: Evidence and explanation
              detail: Findings include evidence tracking and explanations for determinations.
        - label: Workflow platform
          detail: Product and backend role descriptions identify document, collaboration, and integration services.
          items:
            - label: Artifact and document processing
              detail: Users upload artifacts; product and backend roles cover document processing.
            - label: Collaboration and integrations
              detail: Tags, comments, historical decisions, and integration pipelines support the workflow.
        - label: Enterprise operating layer
          detail: Human users supervise outputs while platform roles are intended to provide reliability and control functions.
          items:
            - label: Human supervision
              detail: Attorneys, compliance teams, and business users review outputs and determine actions.
            - label: Reliability and controls
              detail: Hiring material identifies observability, security controls, testing, CI/CD, and outage-resilient provider integrations as platform responsibilities.
        - label: Governance and assurance
          detail: Evidence tracking, historical decisions, observability, and security controls are described but not independently verified.
          items:
            - label: Auditability
              detail: Retain decision history and evidence supporting findings.
            - label: Control verification
              detail: Validate access, testing, incident response, and model-provider controls.
        - label: Customer deployment
          detail: The platform is intended for regulated enterprise workflows, but deployment breadth and service levels remain unverified.
          items:
            - label: Regulated workflows
              detail: Financial-services and other high-stakes compliance use cases are described.
            - label: Production proof
              detail: Request customer references, activity metrics, and deployment-specific evidence.
    claimRefs: [CE001, CE002, CE005, CE006, CE009, CE012]
callouts:
  - calloutType: strength
    title: Coherent mechanism, not only a chat interface
    body: The evidence describes a specific representation-and-execution loop in which legal requirements become decision structures, agents execute modules against artifacts, and humans can inspect evidence and historical decisions.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Production controls remain unverified
    body: Public sources identify intended reliability and security responsibilities but do not provide independent uptime, incident, evaluation, certification, or customer-isolation evidence.
    claimRefs: [CE006, CE007, CE013, CE015]
  - calloutType: insight
    title: Differentiation depends on supervision quality
    body: The defensible wedge is likely the maintained legal representation and supervision workflow, not generic model access; diligence should test whether that layer reduces error and review burden in production.
    claimRefs: [CE009, CE010, CE012]
