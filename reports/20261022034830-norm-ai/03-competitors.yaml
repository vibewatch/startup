      - [Internal legal and compliance teams, status quo / internal build, null, "Enterprises with existing legal, compliance, and engineering staff", "Control over policy context, workflow ownership, and data", "Labor and coordination cost are not quantified in the assigned evidence"]
      - [General-purpose AI providers, adjacent substitute, null, "Teams seeking drafting, review, or reasoning primitives", "Broad models and potentially lower-cost primitives", "Assigned sources do not establish regulatory controls, legal accountability, or enterprise deployment economics"]
      - [Enterprise compliance workflow software, direct or adjacent software, null, "Compliance officers and business units", "Workflow tracking, reporting, and system-of-record functions", "No named product, price, or benchmark is documented in the pool"]
      - [Harvey AI and Legora, likely direct / adjacent legal-AI peers, null, "Legal departments and law firms", "Named in independent market commentary as alternative NewMods or legal-AI competitors", "No comparable feature, customer, pricing, or outcome data is supplied"]
    notes: "Coverage is a partial, evidence-constrained landscape from the assigned pool; null scale fields mean no comparable public figure was retained, not zero scale."
    enumerationScope:
      coverage: partial
      basis: "Publicly described alternatives to institutional legal and regulatory workflow automation in the assigned 2024-2026 source pool."
    claimRefs: [CP001, CP002, CP003, CP009, CP010, CP011]
  - id: TP002
    title: Feature and capability matrix
    columns: [buying_criterion, Norm_Ai, traditional_law_firm, internal_build, general_AI_provider, evidence_note]
    rows:
      - ["Regulatory requirements represented as machine-readable rules", "Explicitly described DSL / regulation-as-code", unknown, "Possible but unverified", "Unknown", "Norm evidence is company or investor-partner authored"]
      - ["AI-agent workflow execution", "Explicitly described", unknown, "Possible but unverified", "Model capability alone does not establish workflow control", "Bain Capital Ventures source describes execution rather than only tracking"]
      - ["Human legal supervision", "Norm Law lawyers supervise, calibrate, and improve agents", "Core service model", "Internal staff available", "Unknown", "Independent coverage and company announcement describe supervision"]
      - ["Outcome-based pricing", "Claimed for Norm Law", "Typically hourly in the cited comparison", "Internal cost not disclosed", "Token or usage economics described only comparatively", "No list or realized rates were retained"]
      - ["Enterprise integrations and reliability", "Hiring evidence names integrations, fault tolerance, observability, SSO, and retention requirements", "Unknown", "Built or procured internally", "Unknown", "Directional architecture evidence only"]
      - ["Regulated institutional references", "Clients reported to represent more than $30T AUM", "Existing client relationships likely but unquantified", "Own institutional context", "Unknown", "The $30T figure is company-reported in assigned sources"]
    notes: "Unknown and possible-but-unverified cells are preserved because the assigned pool lacks comparable competitor documentation; this is not a performance ranking."
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [provider_or_model, price_or_unit, included_capabilities, discount_or_unknowns, implication]
    rows:
      - [Norm Law, "Outcome-based pricing claimed; amount not disclosed", "AI-native legal services delivered through Norm Ai with senior attorney supervision", "No public list price, contract term, discount, or realized rate", "Potential alignment with client outcomes, but unit economics cannot be underwritten"]
      - [Traditional law firms, "Hourly billing described as the contrast", "Human legal advice and established practice-area coverage", "Actual rates, discounts, and matter economics not in pool", "Incumbent trust and breadth may offset higher labor intensity"]
      - [Model providers, "Token-usage economics described comparatively", "General model primitives rather than a complete regulated legal service", "No comparable customer price or control package", "Can pressure underlying automation costs without replacing legal accountability"]
      - [Internal build, "Internal labor and infrastructure cost unknown", "Workflow-specific rules, controls, and institutional context", "No staffing, implementation, or maintenance estimate", "Status quo may remain attractive where workflows are narrow or sensitive"]
    notes: "The table separates claimed pricing models from realized revenue; missing values are diligence gaps, not estimates."
    claimRefs: [CP009, CP010, CP011, CP012]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Norm's public positioning combines higher workflow/legal integration with institutional trust signals, while the relative positions of alternatives remain intentionally unresolved.
    data:
      xAxis: "Workflow integration and execution"
      yAxis: "Legal supervision and institutional trust"
      points:
        - {label: "Norm Ai / Norm Law", x: 0.82, y: 0.86, note: "Directional ordinal placement based on described integrated platform, law firm, and institutional references"}
        - {label: "Traditional law firms", x: 0.42, y: 0.88, note: "Trust and supervision are structural attributes; software workflow integration is not documented"}
        - {label: "Internal build", x: 0.58, y: 0.62, note: "Institution-specific control is plausible, but public evidence does not quantify implementation"}
        - {label: "General AI providers", x: 0.66, y: 0.32, note: "Broad automation primitives are distinct from regulated legal accountability"}
        - {label: "Compliance workflow software", x: 0.62, y: 0.54, note: "Workflow relevance is directional; named product evidence is absent"}
        - {label: "Harvey / Legora", x: 0.70, y: 0.60, note: "Peer placement is unresolved and shown only as an evidence-constrained ordinal placeholder"}
    approximationNotes: "Coordinates are ordinal analyst placements anchored to cited capability and trust descriptions, not measured market-share or benchmark scores; all alternatives require diligence."
    claimRefs: [CP005, CP006, CP007, CP008]
callouts:
  - calloutType: strength
    title: Integrated operating model
    body: Norm combines a legal-engineering platform with an affiliated AI-native law firm, which may reduce the buyer's need to coordinate separate software and legal-service vendors.
    claimRefs: [CP002, CP003, CP009]
  - calloutType: risk
    title: Moat remains unproven
    body: Public sources do not establish switching costs, retention, realized pricing, comparative accuracy, or a repeatable win rate against named legal-AI and incumbent alternatives.
    claimRefs: [CP004, CP008, CP010, CP012]
