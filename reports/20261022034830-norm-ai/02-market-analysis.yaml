    title: Evidence-constrained serviceable-market hierarchy
    type: pyramid
    summary: "The hierarchy narrows from broad adjacent spend to workflows Norm Ai can presently address; it is not a value-proportional TAM chart."
    data:
      items:
        - label: "Broad adjacency"
          value: "Enterprise legal, compliance, and AI-governance spend"
          detail: "No aggregate value is supported by the retained pool."
        - label: "Regulated-enterprise boundary"
          value: "Legal and compliance workflow execution"
          detail: "Focuses on rules-heavy work rather than generic enterprise AI."
        - label: "Initial vertical"
          value: "Financial services and other highly regulated institutions"
          detail: "Customer geography and institution count are not disclosed."
        - label: "Repeatable workflow subset"
          value: "Compliance reviews, funds, deals, and regulatory matters"
          detail: "Scope must be specifiable enough for agent execution and outcome pricing."
        - label: "Deployment-ready subset"
          value: "Workflows meeting reliability, security, integration, and supervision requirements"
          detail: "Human legal review remains part of the delivered service."
        - label: "Observable proof point"
          value: "Client institutions reported above $30T AUM"
          detail: "AUM indicates customer scale, not addressable spend or revenue."
    approximationNotes: "No layer width or order represents a monetary estimate; the hierarchy is qualitative because TAM, SAM, SOM, pricing, and penetration are undisclosed."
    claimRefs: [CM008, CM010, CM014]
callouts:
  - calloutType: insight
    title: Do not capitalize the $30T denominator as TAM
    body: >-
      The figure describes assets managed by client institutions. Without compliance-spend intensity, eligible-workflow volume, pricing, or penetration, it cannot be converted into market size or revenue potential.
    claimRefs: [CM004, CM011]
  - calloutType: risk
    title: Trust creates demand and delivery cost
    body: >-
      Human signoff, senior legal expertise, client-specific calibration, and enterprise-grade integration help unlock regulated buyers, but they also make the near-term model implementation-heavy.
    claimRefs: [CM008, CM009, CM010]
