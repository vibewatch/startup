evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: disclosure
    missingEvidence: >-
      Audited or management-provided revenue, ARR, gross margin, cash, burn, runway, and combined Norm Ai/Norm Law
      headcount.
    whyItMatters: >-
      The financing valuation cannot be underwritten from funding headlines or client-AUM claims without operating
      performance and liquidity metrics.
    diligencePath: >-
      Request the latest board-approved KPI pack, monthly financials, cash forecast, capitalization table, and
      entity-level headcount split.
    relatedQuestionRefs:
      - QO005
      - QO007
  - type: conflicting-data
    severity: material
    topic: financing
    missingEvidence: >-
      A reconciled financing ledger showing round dates, gross proceeds, fees, valuation basis, and whether the reported
      $256M and more-than-$260M totals use the same perimeter.
    whyItMatters: Inconsistent lifetime-funding totals can distort dilution, capital sufficiency, and valuation analysis.
    diligencePath: Reconcile signed financing documents and investor schedules with the company’s official financing history.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-model
    missingEvidence: >-
      Corporate chart and agreements defining ownership, fee flows, supervision, and governance between Norm Ai and Norm
      Law.
    whyItMatters: >-
      The affiliated law-firm structure may change regulatory, professional-responsibility, revenue-recognition, and
      control assessments.
    diligencePath: >-
      Obtain entity ownership records, intercompany agreements, board minutes, and professional-responsibility
      memoranda.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: milestones
    missingEvidence: Independent adverse-event search covering litigation, regulatory actions, outages, layoffs, and customer losses.
    whyItMatters: The current pool supports a milestone chronology but cannot establish that no material adverse event occurred.
    diligencePath: >-
      Run targeted court, regulator, employment, and customer-reference checks and reconcile any findings to the
      milestone timeline.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-limitation
    missingEvidence: >-
      Category spend, pricing, eligible workflow volume, customer count, penetration, revenue, and a supportable
      TAM/SAM/SOM denominator.
    whyItMatters: >-
      Without these inputs, customer AUM and financing valuation cannot be translated into addressable revenue or market
      share.
    diligencePath: >-
      Obtain the customer and pricing cohort, workflow volumes, software-versus-services mix, and external
      legal/compliance spend benchmarks; build bottom-up scenarios by buyer and workflow.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Independent procurement records or customer budgets that identify the actual contracting entity, budget owner,
      sales cycle, and deployment cost.
    whyItMatters: >-
      The public buyer map is inferred from workflow descriptions and cannot establish repeatable budget access or
      implementation economics.
    diligencePath: >-
      Review contracts, order forms, pipeline data, implementation statements of work, and references from legal,
      compliance, technology, and procurement stakeholders.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Cohort retention, workflow expansion, time-to-production, attorney-review intensity, implementation labor, and
      software gross margin.
    whyItMatters: >-
      These measures determine whether trust-building services create a scalable software wedge or a persistently
      labor-intensive delivery model.
    diligencePath: >-
      Request customer-level deployment cohorts and unit economics split between platform subscription, implementation,
      and Norm Law outcomes.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM006
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Comparable list and realized pricing, contract length, minimum commitments, discounts, and gross-margin
      implications for Norm and named alternatives.
    whyItMatters: >-
      Pricing determines whether outcome-based delivery is a buyer advantage and whether software economics can support
      the current strategic posture.
    diligencePath: >-
      Obtain anonymized contracts, pricing schedules, discount policy, implementation fees, and contribution-margin
      bridge from management.
    relatedQuestionRefs:
      - QP005
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-wins
    missingEvidence: >-
      A customer-level win/loss and renewal dataset benchmarked against traditional firms, internal build, Harvey,
      Legora, and compliance software.
    whyItMatters: Without comparative outcomes, the positioning map is directional and the moat thesis cannot be underwritten.
    diligencePath: >-
      Request cohort retention, competitive displacement, sales-cycle, implementation, and reference-customer evidence
      under NDA.
    relatedQuestionRefs:
      - QP006
      - QP008
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
