    title: Risk heatmap
    summary: Publicly evidenced risk areas cluster around high-impact trust, legal-structure, reliability, and adoption dependencies, while mitigation maturity remains partly unverified.
    type: matrix
    data:
      columns: [Likelihood, Impact, Mitigation maturity, Residual severity]
      rows:
        - label: AI compliance error
          values: [Medium, Critical, Partial, High]
        - label: Legal structure and supervision
          values: [Medium, High, Unverified, High]
        - label: Security and confidentiality
          values: [Medium, Critical, Unverified, High]
        - label: Platform outage or execution failure
          values: [Medium, High, Partial, Medium-high]
        - label: Billable-hour adoption resistance
          values: [Medium, High, Partial, High]
        - label: Runway and unit economics
          values: [Unknown, Critical, Unverified, High]
    approximationNotes: Qualitative ratings synthesize the cited public evidence; unknown controls and metrics remain explicit rather than being scored as observed failures.
    claimRefs: [CR002, CR005, CR007, CR010, CR011, CR014]
