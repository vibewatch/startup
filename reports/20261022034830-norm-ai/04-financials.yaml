        - from: subscription-contract
          to: platform-revenue
          label: Terms undisclosed
        - from: platform-work
          to: legal-matter
          label: Legal-services path
        - from: legal-matter
          to: outcome-fee
          label: Matter outcome
        - from: platform-revenue
          to: gross-profit
          label: Margin undisclosed
        - from: outcome-fee
          to: gross-profit
          label: Delivery cost undisclosed
    approximationNotes: "This is a mechanism map, not a forecast; it does not assume revenue values, conversion rates, a common accounting entity, or positive gross profit."
    claimRefs: [CI001, CI002, CI003, CI016]
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: The $120 million Series C and more than $260 million of cumulative funding do not disclose cash remaining, burn, debt, or runway.
    claimRefs: [CI010, CI011, CI012]
  - calloutType: recommendation
    title: Separate the two economic engines
    body: Underwrite the subscription platform and Norm Law matters separately, then reconcile transfer pricing, shared costs, revenue recognition, and cash across the entities.
    claimRefs: [CI001, CI002, CI003, CI004]
