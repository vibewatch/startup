      - [Supervisory agents, "Governance of other AI agents in regulated environments", "Enterprise deployment; unit undisclosed", "Series C expansion priority; monetization unavailable", "Company-issued product description", "Obtain attach rate, deployment cost, contract value, and gross margin"]
      - [Microsoft channel, "Marketplace availability and Microsoft 365 integration", "Marketplace or enterprise agreement; terms undisclosed", "Channel economics unavailable", "Company-issued partnership announcement", "Obtain marketplace fees, sourced pipeline, billing terms, and channel contribution"]
    notes: "Mechanisms come from retained public sources; no row establishes recognized revenue, revenue mix, realized pricing, or gross margin, and unavailable values are not zero."
    claimRefs: [CI001, CI002, CI003, CI004, CI007]
  - id: TI002
    title: Pricing and go-to-market evidence
    columns: [Evidence, Disclosed metric or mechanism, What it supports, What it does not support]
    rows:
      - [Platform monetization, "Subscription", "A potentially recurring software contract model", "List price, realized price, term, discount, seats, usage, ARR, or retention"]
      - [Norm Law monetization, "Outcome-driven rather than hourly pricing", "A client-aligned legal-service mechanism", "Matter fee, outcome definition, cost overrun protection, utilization, or margin"]
      - [Institutional reach, "> $30T of client assets under management", "Access to institutions managing substantial assets", "Norm Ai revenue, customer count, wallet share, contract value, or concentration"]
      - [Microsoft distribution, "Microsoft Marketplace and Microsoft 365 integration", "A procurement and embedded-workflow route", "Channel-sourced bookings, marketplace fees, conversion, sales cycle, or payback"]
    notes: "The AUM denominator belongs to Norm Ai's clients, not to Norm Ai; qualitative pricing and channel statements are not substitutes for realized commercial metrics."
    claimRefs: [CI001, CI002, CI005, CI006, CI007, CI008, CI016]
  - id: TI003
    title: Unit economics and capital diligence
    columns: [Metric, Public value, Confidence, Why it matters, Required diligence]
    rows:
      - [Series C financing, "$120M at a $1.2B valuation in July 2026", High, "Confirms external financing and transaction pricing but not operating scale", "Provide cap table, preference terms, primary versus secondary proceeds, and fees"]
      - [Cumulative funding, "> $260M by July 2026", Medium, "Shows capital access but not remaining liquidity", "Reconcile gross proceeds to current cash, cumulative burn, and restricted cash"]
      - [Revenue and ARR, null, Unavailable, "Required to test monetization scale and the valuation denominator", "Provide audited revenue, ARR bridge, backlog, revenue mix, and recognition policy"]
      - [Gross margin and contribution margin, null, Unavailable, "Separates software economics from attorney-led service delivery", "Provide margins by platform, implementation, and Norm Law matter"]
      - ["CAC, payback, retention, and concentration", null, Unavailable, "Tests repeatability and capital efficiency of institutional sales", "Provide cohort CAC, payback, logo retention, NRR, sales cycle, and top-customer exposure"]
      - ["Cash, burn, debt, and runway", null, Unavailable, "Determines financing dependency and the next-round trigger", "Provide current balance sheet, monthly cash forecast, debt schedule, covenants, and board plan"]
    notes: "Dollar amounts are USD; null means the retained public evidence does not disclose the metric, and financing raised must not be read as cash available."
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016]
figures:
