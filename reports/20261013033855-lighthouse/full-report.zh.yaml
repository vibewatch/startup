  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 这条顺序分析路径将商业数据集规模、C 轮融资、估值倍数脱节和尽调要求串联起来，最终导向“继续研究”的建议。
    data:
      nodes:
        - label: 市场规模证明
          detail: 185 个国家的 70,000+ 个酒店及餐饮物业验证了核心产品效用和商业数据优势。
        - label: 增长资本注入
          detail: KKR 领投的 $370M C 轮融资使总融资额达到约 $470M，为资产负债表提供了充足的资金续航。
        - label: AI 产品演进
          detail: Revenue Agent 于 2026 年推出，使平台从描述性分析延伸到自主商业优化。
        - label: 估值基准脱节
          detail: 据报道，$2.4B 估值相当于 ARR 的约 24x，而公开市场上的酒店业可比公司交易倍数为 0.9x–8.3x EV/Revenue。
        - label: 治理与指标缺口
          detail: 经审计 ARR、NRR 队列、客户流失率和 KKR 清算优先权条款仍未公开披露。
        - label: 最终投资判断
          detail: 建议继续研究；在获得数据室访问权限、厘清单位经济模型和入场定价前，不作出买入承诺。
    approximationNotes: 这条顺序逻辑流将可观察的运营优势与估值、治理方面的关键证据缺口进行对照。
    claimRefs:
