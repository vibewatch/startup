  - id: FI001
    title: 商业收入转化与利润流
    type: flow
    summary: 展示物业上线和数据摄取如何转化为经常性 SaaS 订阅收入及自由现金流的结构性流程。
    approximationNotes: 运营流程模型综合 Lighthouse 产品文档和 SaaS 行业成本基准；单位利润率为标准化估算值。
    data:
      nodes:
        - id: N1
          label: 酒店物业获客
          detail: 独立酒店、管理集团和全球酒店连锁通过直接企业销售及 400+ 个合作 PMS 集成完成上线。
          tone: neutral
        - id: N2
          label: 专有数据处理
          detail: 云基础设施每天摄取数十亿条市场信号，覆盖 700,000 家酒店和 19M 套度假租赁房源，日处理量超过 400 TB。
          tone: neutral
        - id: N3
          label: 模块化 SaaS 订阅
          detail: Rate Insight、Parity Insight、Business Intelligence 和 Pricing Assistant 模块按年收取经常性订阅费。
          tone: positive
        - id: N4
          label: 自主商业执行
          detail: 部署 Revenue Agent 及 AI 能力，简化价格调整、提升客户 ADR，并守住合同续约率。
          tone: positive
        - id: N5
          label: 运营成本吸收
          detail: 经常性收入覆盖云托管基础设施、数据采购许可和全球 700 多名员工的成本。
          tone: risk
        - id: N6
          label: 实现运营利润
          detail: 物业获客成本和基础固定成本收回后，高毛利软件经济性将产生经营现金流。
          tone: positive
