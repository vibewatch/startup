    rows:
      - - 看多论点
        - 定义品类的商业情报平台，每日处理覆盖 70,000 多处物业的 400TB+ 数据，并扩展自主 AI Revenue Agent。
        - 官方平台披露、70+ NPS，以及 2021 至 2025 年连续获得的行业奖项。
        - 独立酒店采用速度放缓，或 AI 代理无法作为独立模块实现变现。
      - - 看空论点
        - 已报告的 $2.4B 估值要求有机增长稳定达到 30%+，且 SaaS 利润率保持溢价；未经核验的公开来源无法证明这些条件。
        - 独立私募可比数据显示，公开酒店科技公司交易倍数为 0.9x–8.3x EV/Revenue。
        - 经核验的披露显示，经审计净收入留存率 >115%、毛利率 >75%。
      - - 反论点：执行
        - 快速收购 Transparent、Kriya RevGen、Stardekk、HQ Revenue 带来技术整合摩擦和产品碎片化。
        - Wikipedia 及行业收购历史详细记录了跨不同地域的多次收购。
        - 独立核实统一单平台数据摄取及跨产品客户加购。
      - - 反论点：下行
        - $370M 增长股权轮带来的二级市场不透明和优先权压力，使普通股在倍数压缩中暴露于下行。
        - Caplight 备案预览显示机构文件受限，资本结构表权利未披露。
        - 清晰的高级清算优先权结构，条款为 1x、非参与型。
    notes: 论点将已报告的运营规模与独立估值倍数及结构性披露缺口进行比较。
