      - number: '1.3'
        title: 资本结构、估值与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的资本化路径由机构私募股权和风险投资联合体支撑。公司在 2021 年 11 月完成 $80M B 轮后，于 2024 年 11 月宣布获得 KKR 通过 Next Generation
              Technology III Fund 领投的约 $370M 成长股权投资，现有投资方 Spectrum Equity、F-Prime Capital、Eight Roads Ventures 和
              Highgate Technology Ventures 继续参与。独立市场资料估计，公司累计融资总额为 $370M 至 $450M，隐含估值约 $1.0B，2025 年 ARR 约为 $101M。2024 至
              2026 年间，Lighthouse 推出带生成式 AI 智能摘要的 Total Revenue BI（2024 年 6 月），发布新一代 Data Solutions 数据即服务（DaaS）平台（2025 年
              4 月），收购 The Hotels Network（2025 年）以加强直订个性化，并于 2026 年 2 月推出 Revenue
              Agent，作为自主商业操作系统的首个组件。经审计的收入增长、留存指标和优先清算权仍存在重大尽调缺口。
