  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与酒店商业工作流
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 将软件套件定位为专为旅行和酒店业打造的 AI 商业操作系统，从传统的间歇式价格采集，升级到持续的商业决策智能。平台核心是一组整合产品，覆盖收益管理、商业策略和分销监督的主要运营职责。Rate
              Insight 追踪传统酒店和度假租赁的价格变化、排名及已售客房率，为经营者提供竞争对手实时价格情报。Market Insight
              聚合航班搜索、全球分销系统查询和替代住宿询价等漏斗上层预订需求信号，扩大前瞻性视野，使酒店经营者可以提前最多 365 天预判需求变化。Business Intelligence
              则整合单物业或多物业组合的物业管理系统数据，简化销售节奏、新增预订和业绩报告。


              过去，酒店收益团队一直在碎片化且高度手工的环境中工作：分析师每天超过六成时间用于拉取报告、把价格数字复制进电子表格，并在开始战略分析前核对分散的数据集。Lighthouse 通过 Smart
              Summaries、动态 Smart Compsets 等原生功能自动完成这些重复行政工作，把每日会议准备时间从 90 分钟降到 20 分钟。Parity Insight
              则持续审计在线旅行社渠道，识别未经授权的低价和分销泄漏。Lighthouse 把价格采集、前瞻性需求预测和渠道一致性放进一个界面，让商业团队把人力从手动收集数据转向定价策略、渠道组合优化和全物业组合创收。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
