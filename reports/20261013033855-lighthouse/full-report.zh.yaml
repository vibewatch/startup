chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、沿革与运营范围
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 是一家专注于旅行和酒店业商业智能的 SaaS 服务商，2012 年以 OTA Insight 的运营名称成立，后完成公司品牌更名。公司总部位于英国伦敦，主要欧洲工程和运营中心设在比利时根特的
              Zuiderpoort Office Tower，全球运营团队超过 700
              人。公司运营一套云端商业操作系统，服务独立酒店、企业连锁酒店、管理公司、目的地营销组织（DMO）和旅行科技厂商。平台把物业管理系统（PMS）预订记录、实时价格采集、竞争对手基准和前瞻性需求信号整合起来，覆盖短租和酒店库存。公开运营披露显示，平台追踪超过
              16.4M 至 16.8M 个酒店和短租房源，每天在 185 个国家处理超过 400 TB 市场数据。所有面向客户的系统都有活跃遥测报告，表明核心服务仍在运行。
            claimRefs:
