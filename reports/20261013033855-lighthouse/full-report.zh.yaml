  - id: FE001
    title: 产品架构图
    type: stack
    summary: Lighthouse 商业操作系统架构，覆盖数据摄取、分析、PMS 连接、应用及自主 AI 代理。
    approximationNotes: 架构分层根据产品白皮书、合作伙伴规格和技术公告作概括。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE010
      - CE011
      - CE014
    data:
      layers:
        - label: 自主代理与工作空间层
          detail: 自主决策执行代理和对话式工作空间监控商业 KPI，并自动执行运营动作。
          modules:
            - Revenue Agent（自主异常检测与商业行动建议）
            - Ernest AI（对话式酒店业工作空间与告警）
            - Superpilot & KITT AI Receptionist（面向宾客的消息沟通与直订转化）
        - label: 商业应用与情报套件
          detail: 定价、收益管理、市场情报和分销平价的核心终端用户应用。
          modules:
            - Rate Insight（酒店及短租竞争对手的实时价格采集）
            - 市场洞察（最多提前 365 天预测漏斗顶部的预订需求）
            - 商业智能（汇总多物业表现并分析预订增量）
            - 价差洞察（跟踪跨渠道 OTA 价差并控制分销）
        - label: 分析与自动化引擎
          detail: 用于动态基准分析、自动位移分析和报告生成的专有处理流水线。
          modules:
            - Smart Compset（根据实时搜索趋势动态调整竞争集合）
            - Smart Summaries（每天生成自然语言晨报）
            - 位移分析引擎（快速评估团体预订收益）
            - Connect AI（向消费者 AI 助手分发结构化内容）
        - label: 集成与合作伙伴连接层
          detail: 由 API 驱动的数据交换，连接物业管理系统、渠道管理器和中央预订系统。
          modules:
            - Cloudbeds PMS 双向连接器（自动同步预订增量、销售节奏和价格）
            - 50+ 个物业管理系统集成适配器
            - 100+ 个预订引擎与中央预订系统（CRS）连接器
        - label: 大数据处理与标准化层
          detail: 处理海量非结构化旅行和价格信号的高吞吐数据流水线。
          modules:
            - 1.7 Billion 条酒店价格每日采集流水线
            - 1.2 Billion 条旅行与航班搜索数据每日摄取引擎
            - 16.4 Million 个物业档案登记库（酒店与短租）
            - 400+ Terabyte 旅行市场数据每日处理基础设施
        - label: 云基础设施、高可用性与治理
          detail: 企业级云托管、安全合规、状态监控和数据隔离。
          modules:
            - 可扩展的多租户云基础设施
            - Lighthouse HQ 系统状态与事故监控（status.lighthousehq.com）
            - 基于角色的访问控制、租户数据隔离与 GDPR 合规
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从首次价格一致性审计到自主收入代理执行的完整客户生命周期。
    approximationNotes: 生命周期阶段综合自客户部署研究和官方产品启用流程。
