      - number: '2.3'
        title: 买方细分、工作流需求与预算归属
        blocks:
          - type: paragraph
            body: >-
              酒店业商业买方呈现明显的结构分化，包括跨国酒店品牌总部、第三方酒店管理公司（HMC）和独立精品酒店运营商。企业品牌采购由企业商业副总裁和品牌技术委员会主导，关注集中式价格一致性合规、全品牌基准可见性和标准化需求分析。酒店管理公司则以多物业集群运营，区域收益总监跨不同品牌和所有权集团管理物业组合；其软件采用由业主提升
              RevPAR
              指数表现的要求驱动，费用由中央管理费承担，或直接计入物业运营费用（OpEx）。对独立酒店和业主运营者而言，总经理既是买方也是主要用户，主要依据软件能否在不配置专职收益分析师的情况下自动调整每日价格并捕捉本地活动带来的需求增量来评估。
            claimRefs:
              - CM006
              - CM007
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM012
      - number: '2.4'
        title: 增长驱动、技术催化剂与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场增长来自结构性转变：从基于历史电子表格的收益管理，转向自动化算法定价和自主 AI 代理。Lighthouse 推出的 Revenue Agent 说明商业工具正从被动的描述性分析仪表盘，转向每天扫描超过 3B
              个市场信号的持续行动引擎。但市场渗透仍受明显摩擦限制。住宿行业受物业管理系统（PMS）高度碎片化困扰，数百个传统本地平台需要复杂的定制接口或第三方中间件，才能同步预订和账单数据。此外，收益管理、销售和营销部门之间的组织错位经常分散预算决策权并拖延采购。最后，公开市场中能独立验证收益管理软件支出、并将其与一般酒店
              IT 区分开的研究仍然稀缺，持续形成估值尽调缺口。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从被动 BI 转向自主商业执行
            body: >-
              酒店商业软件市场正经历代际拐点。过去，收益经理只把商业智能工具用于回溯报告，检查历史新增预订、销售节奏和价格一致性。随着 Lighthouse 推出 Revenue
              Agent，软件边界从被动展示数据扩展到自主商业工作流，持续扫描数十亿个市场信号，主动建议并执行定价动作。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
          - type: callout
            title: PMS 碎片化与预算脱节成为结构性采用障碍
            body: >-
              尽管软件 ROI 很高，物业管理系统（PMS）生态的深度碎片化仍拖慢采用速度。市场上有数百个本地和传统云端 PMS 平台，API
              集成延迟和双向同步失败持续造成运营障碍。营销、销售与收益团队之间的制度性割裂，也常因预算归属分散而拖延软件采购。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局架构与类别边界
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 所处的竞争格局横跨旅行和酒店业生态的四类软件：专用收益策略平台、传统物业与收益管理套件、运营与劳动力商业智能工具，以及现代云端物业管理系统。直接收益智能竞争者包括 Duetto 和 SAS
              旗下的 IDeaS Revenue Solutions，二者聚焦深度算法定价、动态客房价格优化和团体预测。Actabl 等运营型老牌厂商结合劳动力优化与维护追踪；Agilysys、Mews
              等平台则以物业运营和交易管理为核心，争夺酒店业核心软件支出。除商业软件同业外，商业智能买方还经常需要区分共享 Lighthouse 品牌的企业名称，例如覆盖先进制造场地的世界经济论坛 Global
              Lighthouse Network，以及法律科技服务商 Lighthouse Global。Lighthouse 已在 70,000 个物业和 400+
              项技术集成上形成难以匹敌的规模，但在独立物业和物业组合买方中面对不同的竞争动态。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: 功能差异、集成壁垒与代理自动化
        blocks:
          - type: paragraph
            body: >-
              Lighthouse
              通过统一数据湖建立技术差异化，将实时酒店价格采集情报与全球目的地的前瞻性短租市场信号独特地整合起来。相比之下，传统收益管理系统通常只依赖物业管理系统数据流或传统酒店竞品集。为抵御灵活的点解决方案，Lighthouse
              于 2026 年 2 月推出 Revenue Agent，这是一名自主人工智能队友，每天扫描超过 3B
              个市场信号，自主建议或执行定价、销售和分销动作。不同于需要不断手动调参的传统规则型收益管理工具，Revenue Agent 从酒店经营者的商业策略中学习，自动执行耗时的日常工作。该代理扩张，加上
              Lighthouse Performance 在 HotelTechReport 独立用户评分中排名 74 个商业智能方案之首的领导地位，进一步加深客户留存，并强化其对抗点解决方案动态定价初创公司的转换壁垒。
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: 定价模式、产品打包策略与独立运营者障碍
        blocks:
          - type: paragraph
            body: >-
              酒店商业软件通常采用企业报价模式，按客房数、物业层级和集成复杂度定价。Lighthouse 将平台打包为 Rate Insight、Market Insight 和 Performance
              等核心模块，并采取战略捆绑：从 2026 年第一季度起，现有客户无需增加订阅费用即可使用 Revenue Agent。这种防御性打包抬高了专业 AI
              定价点工具的竞争门槛，因为后者需要单独收取订阅费。不过，Lighthouse
              的企业定价结构和多模块定位，主要面向拥有专职商业人员的酒店收益管理团队及多物业酒店业主。对独自管理定价的单一独立酒店业主而言，相比轻量动态定价工具，这个平台的成本和运营负担都很重。Duetto 通过
              GameChanger 和 ScoreBoard 等独立产品推动模块化采用；Mews 等现代云端 PMS 则按客房订阅，并从应用市场交易费中变现。
            claimRefs:
              - CP005
              - CP007
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP011
              - CP015
      - number: '3.4'
        title: 市场定位、替代动态与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 在酒店软件中处于有利位置，兼具广泛的商业智能覆盖和深度市场数据采集能力。其竞争护城河由两项结构性因素支撑：超过 400
              个经认证的双向物业管理系统、中央预订系统和收益管理集成带来的高转换成本，以及覆盖酒店和短租房源的庞大专有数据集。替代风险因细分市场而异。在中高端和奢侈酒店连锁领域，IDeaS Revenue Solutions
              等深度学习老牌厂商凭借企业级 SAS 分析保持深度嵌入，Duetto 则守住团体销售收益工作流。长期主要替代风险来自 Mews 等现代云端 PMS 和 Agilysys
              等传统厂商，它们掌握底层客人交易与预订账本。尽管这些核心交易引擎目前仍依赖 Lighthouse 进行市场价格采集，但如果 PMS 厂商限制双向数据交换，其扩展原生收益智能的战略可能压缩 Lighthouse
              的下游定价权。
