  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与分类
        blocks:
          - type: paragraph
            body: >-
              Lighthouse
              将自身运营边界定义为面向酒店业生态的云端商业智能和收益管理软件。该类别覆盖定价优化、前瞻性市场需求预测、价格一致性追踪，以及基于物业管理系统（PMS）数据的商业智能（BI）等关键决策流程。可服务支出边界有意纳入收益总监、总经理和商业高管购买的专业商业工具，用于提升每间可售客房收入（RevPAR）。相反，它排除了硬件物业管理系统、面向客人的销售点（POS）硬件、支付网关交换机和客房门禁系统等酒店核心运营基础设施。平台整合替代住宿基准数据，在追踪超过
              19M 套度假租赁物业和 725,000 家传统酒店的同时，连接了传统住宿与短租运营商之间原本割裂的数据。
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: 市场规模：TAM、SAM 与覆盖范围视角
        blocks:
          - type: paragraph
            body: >-
              评估 Lighthouse 的可服务市场，必须区分行业赞助方自上而下的估算和自下而上的 SaaS 订阅经济学。主要投资人 KKR 的公开披露将旅行与酒店科技市场总规模定为约 $15B。但这个宽泛的 TAM
              还包括企业预订系统、航空票务基础设施和酒店本地硬件。筛选出价格采集、收益智能和分销追踪等商业软件后，全球 SAM 估计为 $2.2B 至 $3.0B，覆盖约 725,000 家商业酒店。Lighthouse
              目前报告的活跃签约客户覆盖 185 个国家、超过 70,000
              个物业。由于单物业独立精品酒店只支付较低月费，而企业酒店品牌会部署覆盖整个物业组合的多产品套件，单物业软件支出差异很大，因此收入捕获高度取决于模块附加率，而不仅是物业数量。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM013
              - CM014
