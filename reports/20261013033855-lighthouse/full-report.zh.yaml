    title: 建议总结表
    columns:
      - 参数
      - 评估
      - 证据依据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 领先的酒店业商业情报数据集，但公开披露缺少经审计的 ARR、NRR 和利润率指标。
        - 在披露经审计财务报表和留存 cohort 前，暂缓新增增长资本。
      - - 信心
        - 中
        - C 轮融资及客户覆盖已由多个独立和官方来源核验，但私募估值倍数仍有争议。
        - 在投资判断前，需要直接访问数据室以确认单位经济效益。
      - - 风险评级
        - 高
        - 多次收购带来资本密集度；在酒店软件竞争激烈之际，有机增长与收购增长的构成尚未核验。
        - 开展客户留存队列及收购后平台整合审计。
      - - 估值立场
        - 偏高
        - 2024 年 11 月 C 轮估值为 $2.4B；按 $100M ARR 计算约为 24x，而公开可比公司交易倍数为 0.9x–8.3x EV/Revenue。
        - 要求设置结构化下行保护，或按公开可比公司的现实水平折价进入。
    notes: 评估参数综合经核验的 C 轮融资条款、已报告的 ARR 里程碑，以及同业交易的可比倍数。
