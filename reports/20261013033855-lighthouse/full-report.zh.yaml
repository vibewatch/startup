      - number: '6.3'
        title: 留存动态、扩张摩擦与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的行业品牌亲和度较高，行业报告的净推荐值超过 70，商业智能类别排名也靠前，但合同留存和扩张动态仍部分不透明。公司或其私募股权投资方 KKR
              都没有公开披露经审计的净收入留存、毛收入留存和年度客户群流失率。此外，Toolradar
              的独立用户评价显示，具体订阅价格被隐去，潜在买方只能接受销售协助报价。平台效果还与物业管理系统（PMS）互操作性和渠道集成紧密耦合，因此接入老旧酒店 IT
              栈时会产生技术摩擦。缺少公开收入集中度指标，仍无法判断增长是否过度依赖大型企业酒店连锁，还是由广泛的长尾物业订阅支撑。
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 集成与定价透明度摩擦
            body: Toolradar 的独立评价显示，Lighthouse 不公开披露定价层级，并高度依赖 PMS 集成稳定性，这给规模较小的独立物业造成采购摩擦。
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 高管风险层级与打破论点的触发因素
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 已覆盖 185 个国家的 70,000 个住宿物业，为定价、分销和市场智能提供企业级商业操作系统。但公司对自主人工智能和自动化分销的依赖不断加深，也带来结构性运营风险。随着 Revenue
              Agent
              等系统推动平台转向代理式执行，主要下行风险从被动的数据不准确，转向不受约束的算法价格分发。对成长型投资人而言，关键论点破坏触发点在于：自主推价是否会在市场突然变化时造成严重收入错配，或触犯算法价格协调规则。在预订窗口缩短、宏观经济波动的环境下，未经监控的定价自动化可能毁掉酒店利润，而不是提升收益。
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR008
              - CR010
      - number: '7.2'
        title: 监管、法律与合规脆弱性
        blocks:
          - type: paragraph
            body: >-
              Lighthouse
              在多个国际司法辖区运营，而各地对商业旅行智能平台的监管义务并不一致。在欧盟和英国，处理物业层面的业绩指标、客人预订节奏和酒店预订信号，需要严格遵守《通用数据保护条例》协议，并建立稳健的子处理者治理框架。同时，北美和欧洲的反垄断监管机构正加大对算法收益管理系统的审查，调查共享市场智能平台是否会促成竞争酒店之间的默示价格串通。全球各地市政府还在提高旅游税、引入复杂的地方住宿征费，增加合规开销，并要求在碎片化区域市场中实时调整费率计算模型。
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR014
      - number: '7.3'
        title: 运营可靠性、接入规模与 AI 代理执行
        blocks:
          - type: paragraph
            body: >-
              在每天接入超过 140 TB 数据、建立 16.8M
              个物业档案的运营规模下，系统可靠性完全取决于数据管道韧性和稳健的算法边界。历史中断表明，外部波动可能导致自动事件数据流失效，因此需要第三方事件智能合作伙伴过滤噪声信号，防止需求预测失真。Revenue Agent
              推出后，Lighthouse 每天处理超过 3B 个市场数据点，自主发现机会并执行商业动作。虽然 Autopilot
              功能会执行预设边界，例如最低房价、入住率阈值和更新频率，但宏观经济剧烈波动期间的模型漂移风险仍是重大运营暴露，需要持续工程监督。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
      - number: '7.4'
        title: 合作伙伴生态依赖与渠道集中
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的商业分销平台深度依赖外部技术把关者和分销交易对手。Channel Manager 在超过 200 家在线旅行社之间同步实时客房可用性和价格建议，并高度依赖
              Booking.com、Expedia 和 Agoda 等主导平台的优先连接合作。若这些把关者单方面修改 API 协议、价格一致性规则或分销费率结构，就会形成集中式渠道风险。此外，平台还接入 400
              多家市场合作伙伴和 50 多个物业管理系统；传统 PMS 协议脆弱、异步集成超时，持续造成运营摩擦，可能危及独立酒店客户的实时预订同步。
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 自主代理执行与网关脆弱性
            body: >-
              把自主收益代理直接部署到定价工作流，会形成不对称下行风险：定价优化可以提升收益，但如果算法漂移，或在 200+ 个已连接 OTA 渠道上不受约束地推价，就可能迅速摧毁物业
              RevPAR，或在缺少稳健人工介入边界的情况下违反分销一致性规则。
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR010
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的投资逻辑在于：它是全球酒店业领先的商业智能与收入管理平台。公司服务覆盖 185 个国家、超过 70,000 家酒店及住宿供应商，每天摄取并处理超过 400 TB
              的市场、定价和分销数据。2024 年 11 月，KKR 的 Next Generation Technology III Fund 领投 Lighthouse 的 $370 million C
              轮成长投资，验证了产品与市场的契合度，也提供了充足的扩张资本。但反向逻辑同样有力：经审计的损益表、净收入留存队列和自然增长轨迹仍未公开披露。二级市场估值报告将公司估值定在 $2.4 billion，而 ARR
              约为 $100 million，意味着当前估值对应约 24
              倍收入倍数，远高于公开市场酒店科技基准，倍数脱节难以持续。因此，在获得私人数据室访问权限、厘清底层单位经济模型前，我们给出“继续研究”建议，置信度中等、风险高，估值偏高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: 当前融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的资本结构体现出快速增长与激进整合：三轮机构融资累计约 $470 million。2024 年 11 月的 C 轮注入 $370 million 成长股权，KKR 加入 Spectrum
              Equity、F-Prime Capital、Eight Roads Ventures 和 Highgate Technology Ventures
              等既有投资方。二级市场追踪平台对这笔交易的估值记录并不一致：部分市场报告称其已达到超过 $1.0 billion 的独角兽估值，交易数据库则记录 $2.4 billion
              的投后估值。与此同时，公司自报的招聘披露显示，Lighthouse 的年经常性收入超过 $100 million，全球员工超过 850
              人。如果后期优先股带有参与分配条款或最低回报保证，大量后期成长资本会给普通股股东带来清算优先权压力。此外，Caplight
              等私人二级平台显示，监管文件、股东协议和股权结构表均没有公开可见信息，进一步说明入场必须严格把关。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV010
      - number: '8.3'
        title: 情景分析与可比基准
        blocks:
          - type: paragraph
            body: >-
              将 Lighthouse 与公开市场及私有市场同业对比，可以看到明显的倍数差距。公开交易的酒店软件供应商收入倍数较低：Agilysys 的 EV/Revenue 为 8.3x，HBX Group 为
              3.4x，Shiji Group 为 6.2x，TravelSky 为 0.9x。私营酒店管理同业 Mews 以 $100 million 收入取得 $2.5 billion 估值（25.0x），但更广泛的
              SaaS 估值已大幅压缩。在基准情景下，Lighthouse 用三年将 ARR 从 $100 million 提升至 $150 million；若倍数压缩至 ARR 的 6x–8x，估值约为 $900
              million–$1.2 billion，相对于 C 轮估值回报持平甚至为负。悲观情景下，增长降至 10% 以下，独立酒店客户流失增加；若按公开同业平均水平（3x–4x
              EV/Revenue）重估，估值将大幅收缩至 $330 million–$440 million，后期普通股下行空间超过 60%。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 的退出路线包括登陆公开市场，或被 Amadeus、Oracle Hospitality 等全球私募股权机构和企业软件集团收购。产品持续扩张也显示出运营势头，例如 2026 年 2
              月推出用于自主执行定价的 Revenue Agent，以及面向独立运营商的 Commercial Strategy Services。但由于 Stardekk、Transparent 和 Kriya RevGen
              收购后的财务合并情况不透明，机构退出准备度仍然受阻。在承诺成长股权前，尽调必须优先索取四项材料：经审计的历史损益表和现金流、按客户层级拆分的毛收入留存与净收入留存表、C
              轮的精确清算优先权分配顺序，以及大型酒店连锁与独立运营商之间的客户集中度。投资逻辑被打破的触发条件包括自然 ARR 增长降至 15% 以下，或出现客户流失加速的证据。
            claimRefs:
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 倍数脱节，必须严格把控入场
            body: >-
              Lighthouse 已有明确的商业进展，酒店客户超过 70,000 家，且获得 KKR 的强力支持；但若按报告中的 $2.4 billion 估值入场，相当于支付 ARR 的
              24x，倍数极高。潜在投资者必须以经过验证的 ARR 增长率和高级清算优先权透明度为资本承诺的前提。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
