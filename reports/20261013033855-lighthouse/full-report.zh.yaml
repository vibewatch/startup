      - number: '1.2'
        title: 高管领导、治理与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              公司由经验丰富的管理团队运营，首席执行官 Sean Fitzpatrick 负责领导，联合创始人 Matthias Geeroms 负责公司发展和长期并购战略。职能团队覆盖商业领域的专业分工，包括 Dave
              Collier（首席营收官）、Ivo Minjauw（首席产品官）、Mathias Verhoeven（首席技术官）、Georg Beyschlag（首席财务官）和 Eva
              Metsu（总法律顾问）。随着企业对自主工作流自动化的需求升温，Lighthouse 在首席 AI 官 Juanjo Rodríguez 领导下建立了专门的人工智能治理体系。公司对 Sean
              Fitzpatrick 和 Matthias Geeroms
              存在中等程度的关键人物依赖；两人与酒店连锁及旅行生态的深厚关系，推动了有机平台扩张和程序化并购。不过，关于独立董事构成、委员会设置、投资人表决门槛和少数股东保护契约的正式治理信息，在保留的公开申报和投资人公告中完全没有披露。
