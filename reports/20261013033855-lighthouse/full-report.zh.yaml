  - id: FM001
    title: 酒店业商业技术规模分层
    type: pyramid
    summary: 从旅行与酒店业技术总支出，逐层下钻至 Lighthouse 当前物业覆盖范围的分层市场规模。
    data:
      items:
        - label: 旅行与酒店业技术 TAM 总额
          value: $15.0B
          description: 全球旅行与酒店服务商每年的技术和软件总支出
          detail: 覆盖 PMS、POS、分销、宾客技术和商业软件的全球范围
        - label: 全球住宿软件 TAM
          value: $6.5B
          description: 酒店、度假村和专业短租的专用软件支出
          detail: 不包括航空、邮轮和旅行社运营商的软件支出
        - label: 商业情报与收益管理 SAM
          value: $2.6B
          description: 酒店定价、价格采集、商业智能和平价工具的可服务市场
          detail: 覆盖约 725,000 家全球商业酒店的核心可服务软件市场
        - label: 活跃可服务酒店供给总盘
          value: 725,000+ hotels
          description: Lighthouse 市场数据生态监测的全球商业酒店总量
          detail: 代表全球商业酒店物业的完整总盘
        - label: 受监测的替代住宿总盘
          value: 19M+ listings
          description: 为跟踪市场需求和竞争定价而监测的短租及度假物业
          detail: 通过收购和供给聚合形成的扩展可服务市场视角
        - label: Lighthouse 签约物业覆盖
          value: 70,000+ properties
          description: 覆盖独立酒店、管理集团和全球连锁的活跃订阅客户基础
          detail: Lighthouse 在 185 个国家的既有市场渗透
    approximationNotes: 顶层 $15.0B TAM 源自赞助方和行业披露。第 2、3 层规模是依据估算的单物业软件支出作出的分析性预测。 受监测供给（725k 家酒店、19M 个 STR）及签约物业（70,000+）反映公司报告的运营数据。
