      - number: '5.3'
        title: 自主 AI 路线图：从决策支持到决策执行
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 正在经历重要架构转型，从决策支持仪表盘演进为代理驱动的商业执行系统。2026 年 2 月，公司推出 Revenue Agent，这名自主 AI
              队友持续监控定价、销售、营销和分销领域的市场动态。与基础规则型通知引擎不同，Revenue Agent 每天扫描超过 3B
              个市场信号，发现新兴收入机会、需求激增和价格风险，并直接向收益经理提供主动建议。据公司管理层介绍，该系统旨在运营者定义的边界内执行日常定价动作，让人工分析师专注于整体物业组合策略。


              这条自主化路线还配套了对话式和面向客人的人工智能项目。2026 年 6 月，Lighthouse 发布 Ernest，这是一个生成式 AI
              工作空间，酒店经营者可以用自然语言查询，用于分析业绩指标、配置定制提醒和安排自动化运营任务。此外，Lighthouse 通过 2025 年收购 The Hotels Network 扩展面向客人的转化能力，纳入
              KITT AI Receptionist 等 AI 工具——这是一名能用超过 50 种语言处理客人咨询的多语种虚拟助手——以及用于直订个性化的
              Superpilot。这些工具把前台客人转化和后台定价智能连接起来，形成统一的商业优化飞轮。
            claimRefs:
              - CE004
              - CE010
              - CE011
      - number: '5.4'
        title: 技术限制、系统可靠性与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管数据资产丰富、产品迭代迅速，Lighthouse
              仍存在若干技术依赖、集成瓶颈和运营风险，尽调时需要重点审查。独立用户评价和市场反馈显示，非技术型酒店经营者学习平台的门槛较高；规模较小的独立物业还会遇到定价障碍，使完整套件在经济上难以采用。用户还报告，在刷新大型多物业数据集时偶有延迟和处理滞后，追踪小众或本地化区域分销渠道时也会出现轻微价格差异异常。


              系统可用性和可靠性是另一项核心投资判断因素。Lighthouse 发布公开状态门户，显示截至 2026 年 10 月核心服务仍在线，但多年 SLA
              日志、灾难恢复基准和第三方渗透测试报告仍属私有信息。此外，关于动态竞品集聚类和自动定价模型算法机制的独立技术文档也未公开。如果自动代理依据不完整的竞品集模型或外部数据流中断来执行定价决策，酒店可能出现非预期收益损失。因此，尽调团队必须审查
              SOC 2 Type II 审计报告、评估故障转移架构，并在判断企业规模部署前核实执行边界控制。
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 酒店与短租之间的专有数据护城河
            body: >-
              Lighthouse 的首要结构性差异化，在于其专有酒店业数据集的广度：每天接入 1.7B 条价格更新，以及度假租赁基准和前瞻性旅行意向信号。通过把短租与传统酒店统一在一个商业平台中，Lighthouse
              为酒店经营者提供独立收益管理系统无法复制的整体市场竞品集。
            calloutType: strength
            claimRefs:
              - CE001
              - CE006
          - type: callout
            title: 自主商业代理的执行与边界风险
            body: >-
              从观察型商业智能转向自主代理执行，会带来运营和声誉责任。如果 Revenue Agent
              或自动化定价建议未能准确反映超本地需求异常或合同约束，酒店运营者就可能面临收入被替代或利润率下滑，因此用户定义的边界和透明数据审计不可或缺。
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
              - CE014
