      - number: '4.3'
        title: 成本结构与服务交付经济学
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 商业智能平台的服务交付经济学，反映出持续的数据处理和人员投入。平台运营需要持续接入和标准化覆盖 700,000 家酒店和 19M 套短期度假租赁的市场信号，横跨 185 个国家，每天处理超过
              400 TB 外部旅行数据。维持低延迟数据管道、实时价格一致性抓取和高可用云架构，需要大量基础设施托管成本，公司同时维护公开状态追踪页面以验证持续运行时间。Lighthouse 还维持一支超过 700
              人的全球团队，分布在工程、数据科学、客户支持和区域商业运营岗位。人力资本投入构成固定运营现金消耗的主要部分。新物业订阅在数据接入管道建成后理论上具有较高增量软件利润率，但数据获取和全球人员配置的固定开销，要求公司达到相当大的订阅规模才能实现可持续运营盈利。
            claimRefs:
              - CI012
              - CI013
      - number: '4.4'
        title: 单位经济与私有指标披露缺口
        blocks:
          - type: paragraph
            body: >-
              评估 Lighthouse 的核心难点，在于其声称的运营规模与可验证公开财务数据之间存在明显落差。第三方市场情报目录估计，Lighthouse 截至 2025 年的 ARR 约为 01M，覆盖全球 70,000
              至 80,000 个物业地点。但由于公司仍是私人持有的成长阶段企业，机构投资判断所需的关键单位经济数据完全没有披露。监管申报无法审计 GAAP
              毛利率、净收入留存率、客户获取成本和客户生命周期价值等核心数据。此外，目录追踪者记录了酒店收益科技领域 246 个活跃竞争者，包括 STR、Duetto、Amadeus Hospitality 和
              RateGain 等资金充足的供应商；但公开来源没有披露 Lighthouse 的流失率或模块附加率。这些重大信息缺口构成实质性尽调障碍，需要查阅私有管理账目和客户群续约时间表。
            claimRefs:
              - CI004
              - CI009
              - CI014
