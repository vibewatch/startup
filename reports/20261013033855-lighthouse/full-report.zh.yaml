  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业收入流
        blocks:
          - type: paragraph
            body: >-
              Lighthouse 将核心商业平台打造为多产品 B2B 软件套件，为全球住宿供应商提供市场情报、价格一致性追踪和自动化定价方案。商业基础是来自四个主要模块的年度经常性订阅收入：Rate
              Insight、Parity Insight、Business Intelligence 和 Pricing
              Manager。这些工具每天接收数十亿个前瞻性市场信号和价格观测，使酒店经营者能够比较竞争定价并最大化每间可售客房收入。2026 年 2 月，Lighthouse 推出 Revenue
              Agent，这是一套自主决策引擎，用于在定价、分销和营销工作流中执行实时商业动作。Lighthouse
              没有把它作为单独的收费层级，而是向现有客户免费提供，以增强软件黏性、提高平台留存，并增加已部署物业的转换摩擦。将数据接入直接连接到自动执行后，Lighthouse
              在维持稳定、高质量订阅现金流的同时提升了客户生命周期价值。
