          tone: neutral
        - label: 2. PMS 集成
          detail: 酒店连接物业管理系统和渠道管理器，以同步库存
          tone: neutral
        - label: 3. 市场基线
          detail: 商业团队建立 Smart Compset 基准和前瞻性需求信号
          tone: positive
        - label: 4. 日常工作流
          detail: 收益管理人员将每日比价自动化，并查看在手业务仪表板
          tone: positive
        - label: 5. 扩大直订
          detail: 物业通过 The Hotels Network 工具部署 AI 个性化和直订组件
          tone: positive
        - label: 6. 采用自主代理
          detail: 商业团队试用 Revenue Agent，自主执行实时价格调整
          tone: positive
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 针对关键运营、监管和依赖因素，从发生可能性、影响程度和缓解措施成熟度评估剩余风险敞口。
    approximationNotes: 发生可能性、影响程度和剩余风险区间是结合平台规模与依赖关系作出的定性判断。
