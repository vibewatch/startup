            body: >-
              Lighthouse 的商业采用轨迹显示出持续多年的扩张：从 2025 年报告的 65,000 个物业，增长至 2024 年末及 2026 年期间覆盖 185 个国家的 70,000+
              个物业。公开客户案例为不同住宿类别的生产部署提供了具体证据：Indian Hotels Company Limited 等企业客户使用统一商业仪表盘管理超过 170 个物业的组合收入；Hilton RMCC
              Shanghai 则利用实时市场价格信号，实现了比竞争集平均每日房价高 200 RMB 的溢价。Ultima Hotel Gstaad、Eichardt's Private Hotel
              等精品奢华运营商也报告了显著自动化收益，其中 Eichardt's 记录到直接 RevPAR 提升 27%。Hotel Tech Report 显示，1,821 名酒店经营者中有 95%
              推荐该平台，反映出小型、中型和企业级酒店广泛的生产使用满意度。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
