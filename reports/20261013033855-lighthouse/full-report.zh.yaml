            body: >-
              从资本充足性和流动性看，Lighthouse 在 2024 年 11 月获得 KKR 领投的约 70M C 轮成长股权融资后，资产负债表极为强劲。该交易由 KKR Next Generation
              Technology III Fund 领投，Spectrum Equity、F-Prime Capital、Eight Roads Ventures 和 Highgate Technology Ventures
              等现有投资人共同支持，使 Lighthouse 四轮机构融资累计股权资金达到约 70M 至 73M。这笔大额现金注入带来充足运营跑道，隔离近期资本市场波动，并支持自主 AI
              代理和战略并购等平台投资。不过，投资条款可能包含惯常的成长股权保护、清算优先权或治理契约，进而影响后续股权回报。Lighthouse
              展现出独角兽级商业牵引力和充足资本储备，但缺少经审计的收入确认与利润率披露，因此应保持审慎研究立场，而不是不加保留地推荐投资。
