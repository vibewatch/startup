    columns:
      - 情景
      - 运营假设
      - 估值 / 回报逻辑
      - 主要下行风险
      - 概率信号
    rows:
      - - 乐观情景
        - 借助 AI Revenue Agent 加售和国际酒店扩张，ARR 在 3 年内从 $100M 增至 $220M；毛利率为 80%。
        - 以 $2.2B–$2.6B 退出（10x–12x ARR）；维持 C 轮估值，为后期增长投资者带来 1.0x–1.2x 回报。
        - PMS 既有厂商将代理产品商品化；企业酒店采购延迟。
        - 低（20%）
      - - 基准情景
        - ARR 在 3 年内温和增长至 $150M；有机增长放缓由并购抵消，毛利率稳定在 70%。
        - 倍数压缩至 6x–8x ARR，估值为 $900M–$1.2B；相对 C 轮估值持平或下跌。
        - 有机增长停滞在 15% 以下；整合成本拖累现金流。
        - 中（55%）
      - - 悲观情景
        - 酒店科技预算收紧，增长降至 10% 以下；独立酒店客户流失上升；ARR 持平于 $110M。
        - 倍数重估至公开酒店科技平均水平 3x–4x EV/Revenue，估值为 $330M–$440M；减记 60%+。
        - 清算优先权抹去普通股价值；相对传统同业出现严重倍数压缩。
        - 中高（25%）
    notes: 情景模型假设 $100M 为 2025—2026 年来源报告的 ARR 基准，并以公开可比公司为退出倍数基准。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 2012 至 2026 年的公司成立、融资、产品发布、收购及代理产品里程碑。
    data:
      items:
        - date: '2012'
          label: 以 OTA Insight 成立公司
          detail: 在伦敦成立，提供酒店价格情报和分销透明度。
        - date: 2021-11
          label: B 轮增长融资
          detail: 获得由 Spectrum Equity 领投的 $80M B 轮融资，F-Prime、Eight Roads 和 Highgate 参投。
        - date: '2023'
          label: 公司更名为 Lighthouse
          detail: 从 OTA Insight 更名为 Lighthouse，将商业情报统一到单一平台。
        - date: 2024-06
          label: 发布 Total Revenue 与 AI Smart Summaries
          detail: 推出覆盖客房及非客房收入的整体收益情报，并提供生成式 AI 摘要。
        - date: 2024-11
          label: KKR 领投的 $370M C 轮投资
          detail: 宣布获得 KKR Next Generation Technology III Fund 的 $370M 增长股权投资。
        - date: '2025'
          label: 战略收购 The Hotels Network
          detail: 收购 The Hotels Network，扩大直订个性化和客人获客能力。
        - date: 2025-04
          label: 发布新一代数据解决方案 DaaS
          detail: 发布重建后的 Data-as-a-Service 平台，统一酒店、短租和航班数据。
        - date: 2026-02
          label: 发布 Autonomous Revenue Agent
          detail: 推出 Revenue Agent，这名自主 AI 队友每天扫描 30 亿个数据点。
    approximationNotes: 时间线综合经核验的公司公告、投资者新闻稿和情报画像。
