            body: >-
              Lighthouse's enterprise pricing model and configuration complexity create an addressable ceiling that
              excludes independent hotel owner-operators, while open-cloud property management systems like Mews and
              Agilysys retain long-term structural leverage through direct ownership of core folio transactions.
            calloutType: risk
            claimRefs:
