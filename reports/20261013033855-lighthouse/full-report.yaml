      - number: '1.2'
        title: Executive Leadership, Governance, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              The company operates under a tenured executive team led by Chief Executive Officer Sean Fitzpatrick,
              alongside co-founder Matthias Geeroms who directs corporate development and long-term M&A strategy.
              Functional leadership exhibits specialized domain coverage across commercial disciplines, including Dave
              Collier (Chief Revenue Officer), Ivo Minjauw (Chief Product Officer), Mathias Verhoeven (Chief Technical
              Officer), Georg Beyschlag (Chief Financial Officer), and Eva Metsu (General Counsel). In response to
              intensifying enterprise demand for autonomous workflow automation, Lighthouse established dedicated
              artificial intelligence governance under Chief AI Officer Juanjo Rodríguez. The organization exhibits
              moderate key-person dependence centered on CEO Sean Fitzpatrick and co-founder Matthias Geeroms, whose
              deep relationships with hotel chains and travel ecosystems have guided both organic platform expansion and
              programmatic M&A execution. However, formal governance disclosures—specifically independent board
              composition, committee structures, investor voting thresholds, and minority-protection covenants—remain
              completely undisclosed across retained public filings and investor releases.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO015
