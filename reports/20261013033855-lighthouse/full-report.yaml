      - number: '4.3'
        title: Cost Structure and Service Delivery Economics
        blocks:
          - type: paragraph
            body: >-
              The service delivery economics of Lighthouse commercial intelligence platform reflect substantial ongoing
              data processing and personnel commitments. Platform operations require continuous ingestion and
              normalization of market signals spanning 700,000 hotel properties and 19 million short-term vacation
              rentals across 185 countries, processing over 400 terabytes of external travel data daily. Maintaining
              low-latency data pipelines, real-time parity scraping, and high-availability cloud architecture
              necessitates substantial infrastructure hosting costs, managed alongside a public status tracking page
              verifying continuous operational uptime. Concurrently, Lighthouse sustains a global organizational
              footprint exceeding 700 employees distributed across engineering, data science, customer support, and
              regional commercial operations. This extensive human capital investment constitutes the primary component
              of fixed operational cash burn. While incremental software margins on new property subscriptions are
              theoretically high once data ingestion pipelines are established, the fixed overhead of data acquisition
              and global staffing requires substantial aggregate subscription scale to achieve sustainable operating
              profitability.
            claimRefs:
              - CI012
              - CI013
      - number: '4.4'
        title: Unit Economics and Private-Metric Disclosure Gaps
        blocks:
          - type: paragraph
            body: >-
              A central challenge in evaluating Lighthouse lies in the sharp disparity between claimed operational scale
              and verified public financial data. Third-party market intelligence directories estimate that Lighthouse
              generated approximately 01 million in Annual Recurring Revenue as of 2025, operating across 70,000 to
              80,000 property locations worldwide. However, because Lighthouse remains a privately held growth-stage
              enterprise, critical unit economics necessary for institutional underwriting remain entirely undisclosed.
              Primary data regarding GAAP gross margin, net revenue retention, customer acquisition cost, and customer
              lifetime value cannot be audited through regulatory filings. Furthermore, while directory trackers record
              246 active competitors in hotel revenue technology—including well-capitalized providers such as STR,
              Duetto, Amadeus Hospitality, and RateGain—public sources do not reveal Lighthouse churn rates or module
              attach rates. These significant information gaps represent material diligence blockers that require access
              to private management accounts and customer cohort renewal schedules.
            claimRefs:
              - CI004
              - CI009
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
