chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Heritage, and Operating Scope
        blocks:
          - type: paragraph
            body: >-
              Lighthouse is a specialized commercial intelligence SaaS provider for the travel and hospitality industry,
              originally established in 2012 under the operating name OTA Insight before undergoing a corporate
              rebranding to Lighthouse. Headquartered in London, United Kingdom, with a primary European engineering and
              operations center located at the Zuiderpoort Office Tower in Ghent, Belgium, the organization maintains an
              operational footprint spanning over 700 employees globally. The company operates a cloud-based commercial
              operating system tailored for independent hotels, enterprise hotel chains, management companies,
              destination marketing organizations (DMOs), and travel technology vendors. The platform unifies property
              management system (PMS) reservation records, real-time rate shopping, competitor benchmarking, and
              forward-looking demand signals across short-term rental and hotel inventory. Public operational
              disclosures demonstrate substantial data throughput, tracking more than 16.4 million to 16.8 million hotel
              and short-term rental listings and processing over 400 terabytes of market data daily across 185
              countries. Ongoing core services remain operational, evidenced by active telemetry reporting across all
              customer-facing systems.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
