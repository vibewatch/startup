              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration Ecosystem and Dataset Unification as Primary Competitive Moat
            body: >-
              Lighthouse's primary defense against standalone AI pricing point tools is not merely its algorithmic
              layer, but its extensive connectivity across 400+ hospitality technology systems paired with proprietary
              unified hotel and short-term rental demand datasets that point competitors cannot easily replicate.
            calloutType: insight
            claimRefs:
