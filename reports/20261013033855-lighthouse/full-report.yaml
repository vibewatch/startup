      - number: '4.2'
        title: Monetization Framework and GTM Motion
        blocks:
          - type: paragraph
            body: >-
              Lighthouse executes a hybrid go-to-market model tailored to the bifurcated structure of the global lodging
              sector. For independent hotels and boutique properties, the company deploys an inside-sales and
              partner-led motion supported by integrations with more than 400 property management systems, central
              reservation systems, and channel managers. For large regional management groups and multinational hotel
              flags, Lighthouse utilizes an enterprise direct sales force that negotiates multi-property master service
              agreements with customized annual billing terms. Strategic acquisitions have served as an essential
              customer acquisition vehicle, absorbing specialized customer bases from acquired entities such as
              Transparent in vacation rentals, Kriya RevGen in revenue management services, Stardekk in reservation
              software, and The Hotels Network in direct booking personalization. This acquisitive expansion broadens
              Lighthouse addressable market across independent and enterprise accommodation, although realized contract
              values and cross-product discounting remain private commercial terms shielded from public disclosure.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
