      - number: '4.5'
        title: Capital Adequacy, Burn, and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              From a capital adequacy and liquidity perspective, Lighthouse maintains an exceptionally strong balance
              sheet following its approximately 70 million Series C growth equity financing led by KKR in November 2024.
              Backed by KKR Next Generation Technology III Fund alongside existing investors including Spectrum Equity,
              F-Prime Capital, Eight Roads Ventures, and Highgate Technology Ventures, this transaction brought
              Lighthouse cumulative equity funding to approximately 70 million to 73 million across four institutional
              rounds. This massive cash infusion provides extensive operational runway, insulating the company from
              near-term capital markets volatility and financing ongoing platform investments in autonomous AI agents
              and strategic M&A. Nonetheless, the investment terms likely include customary growth-equity protections,
              liquidation preferences, or governance covenants that could influence downstream equity returns. While
              Lighthouse demonstrates unicorn-tier commercial traction and adequate capital reserves, the lack of
              audited revenue recognition and margin disclosures mandates a disciplined research stance rather than an
              unreserved investment recommendation.
            claimRefs:
