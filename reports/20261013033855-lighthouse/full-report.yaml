      - number: '7.4'
        title: Partner Ecosystem Dependencies and Channel Concentration
        blocks:
          - type: paragraph
            body: >-
              Lighthouse's commercial distribution platform depends on deep integration with external technology
              gatekeepers and distribution counterparties. Channel Manager synchronizes real-time room availability and
              rate recommendations across more than 200 online travel agencies, with heavy reliance on preferred
              connectivity partnerships with dominant platforms including Booking.com, Expedia, and Agoda. Any
              unilateral modification to API protocols, rate parity rules, or distribution fee structures by these
              gatekeepers represents a concentrated channel risk. Additionally, the platform integrates with more than
              400 marketplace partners and over 50 property management systems; legacy PMS protocol fragility and
              asynchronous integration timeouts present an ongoing operational friction that could jeopardize real-time
              reservation synchronization for independent hotel clients.
            claimRefs:
              - CR002
              - CR007
              - CR011
              - CR012
              - CR013
