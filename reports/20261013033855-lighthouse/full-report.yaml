  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Commercial Streams
        blocks:
          - type: paragraph
            body: >-
              Lighthouse structures its core commercial platform as a multi-product B2B software suite delivering market
              intelligence, rate parity tracking, and automated pricing solutions to accommodation providers globally.
              Its commercial foundation rests on recurring annual subscription revenue derived from four principal
              modular applications: Rate Insight, Parity Insight, Business Intelligence, and Pricing Manager. These
              tools ingest billions of forward-looking market signals and rate observations daily, allowing hoteliers to
              benchmark competitive pricing and maximize revenue per available room. In February 2026, Lighthouse
              introduced Revenue Agent, an autonomous decision-making engine designed to execute real-time commercial
              actions across pricing, distribution, and marketing workflows. Rather than treating this as a distinct
              monetized tier, Lighthouse deployed Revenue Agent at no additional cost to existing customers, reinforcing
              software stickiness, raising platform retention, and elevating switching friction across its installed
              property base. By coupling data ingestion directly with automated execution, Lighthouse strengthens
              customer lifetime value while maintaining dependable, high-quality subscription cash flow.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI010
          - type: table
