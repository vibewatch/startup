      - number: '6.2'
        title: Adoption Trajectory and Named Deployment Outcomes
        blocks:
          - type: paragraph
            body: >-
              Lighthouse's commercial adoption trajectory reflects steady multi-year expansion, growing from 65,000
              properties reported in 2025 to over 70,000 properties across 185 countries by late 2024 and through 2026.
              Public customer case studies provide concrete evidence of production deployment across diverse lodging
              categories: enterprise customers such as Indian Hotels Company Limited manage portfolio revenue across
              more than 170 properties using unified commercial dashboards, while Hilton RMCC Shanghai utilized
              real-time market rate signals to achieve an average daily rate premium of 200 RMB above competitive sets.
              Similarly, boutique luxury operators like Ultima Hotel Gstaad and Eichardt's Private Hotel report
              significant automation gains, with Eichardt's documenting a 27% increase in direct RevPAR. On Hotel Tech
              Report, 95% of 1,821 hoteliers recommend the platform, reflecting widespread production satisfaction
              across small, mid-sized, and enterprise hotel tiers.
            claimRefs:
