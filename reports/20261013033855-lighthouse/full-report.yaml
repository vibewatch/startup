              - CR010
      - number: '7.2'
        title: Regulatory, Legal, and Compliance Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Lighthouse operates across international jurisdictions that impose divergent regulatory obligations upon
              commercial travel intelligence platforms. In the European Union and the United Kingdom, handling
              property-level performance metrics, guest booking pace, and hotel reservation signals demands strict
              compliance with General Data Protection Regulation protocols and robust subprocessor governance
              frameworks. Concurrently, antitrust regulators in North America and Europe are intensifying scrutiny into
              algorithmic revenue management systems, examining whether shared market intelligence platforms foster
              tacit price collusion among competing hotels. Furthermore, municipal governments worldwide are actively
              hiking tourist taxes and introducing complex local lodging levies, which adds compliance overhead and
              requires real-time algorithmic adjustments to rate calculation models across fragmented regional markets.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
