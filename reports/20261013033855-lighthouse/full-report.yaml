              - CP009
              - CP010
              - CP011
      - number: '3.3'
        title: Pricing Models, Packaging Strategies, and Independent Operator Barriers
        blocks:
          - type: paragraph
            body: >-
              Hospitality commercial software packaging follows enterprise quote-based models typically structured by
              room count, property tier, and integration complexity. Lighthouse packages its platform across core
              modules including Rate Insight, Market Insight, and Performance, deploying a strategic bundling approach
              by making Revenue Agent available to existing customers in Q1 2026 at no incremental subscription cost.
              This defensive packaging strategy raises the competitive bar for specialized AI pricing point tools
              seeking to charge standalone subscription fees. However, Lighthouse's enterprise pricing structure and
              multi-module orientation target hotel revenue management teams and multi-property hospitality owners with
              dedicated commercial staff. For single independent hotel owners managing pricing solo, the platform
              represents substantial cost and operational overhead compared to lightweight dynamic pricing tools.
              Competitors like Duetto leverage modular adoption through distinct products like GameChanger and
              ScoreBoard, while modern cloud PMS entrants like Mews monetize through per-room subscriptions and app
              marketplace transaction fees.
            claimRefs:
              - CP005
              - CP007
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP005
              - CP007
              - CP011
              - CP015
      - number: '3.4'
        title: Market Positioning, Displacement Dynamics, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Lighthouse occupies an enviable position in hospitality software, combining broad commercial intelligence
              breadth with deep market data collection. Its competitive moat is fundamentally defended by two structural
              factors: high switching costs generated by over 400 certified two-way property management system, central
              reservation system, and revenue management integrations, and a massive proprietary dataset encompassing
              hotel and short-term rental listings. Displacement risk is asymmetrical across segments. In the upper
              mid-scale and luxury chain segments, deep-learning incumbents like IDeaS Revenue Solutions maintain
              entrenchment through enterprise SAS analytics, while Duetto defends group-sales revenue workflows. The
              primary long-term displacement risk stems from modern cloud PMS platforms such as Mews and legacy
              incumbents like Agilysys, which control the underlying guest transaction and reservation ledger. While
              these core transaction engines currently rely on Lighthouse for market rate shopping, their strategic
              expansion into native revenue intelligence could compress Lighthouse's downstream pricing power if PMS
              vendors restrict bidirectional data interchange.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP010
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
