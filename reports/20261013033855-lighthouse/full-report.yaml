      - number: '1.3'
        title: Capital Structure, Valuation, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Lighthouse's capitalization trajectory is anchored by institutional private equity and venture capital
              syndicates. Following an $80 million Series B round closed in November 2021, the company announced an
              approximately $370 million growth equity investment led by KKR via its Next Generation Technology III Fund
              in November 2024, supported by existing sponsors Spectrum Equity, F-Prime Capital, Eight Roads Ventures,
              and Highgate Technology Ventures. Independent market profiles estimate total cumulative funding at $370
              million to $450 million, an implied valuation of approximately $1.0 billion, and annual recurring revenue
              of approximately $101 million as of 2025. Between 2024 and 2026, Lighthouse executed key platform
              milestones, including the rollout of Total Revenue BI with generative AI smart summaries in June 2024, the
              launch of a next-generation Data Solutions Data-as-a-Service (DaaS) platform in April 2025, the strategic
              acquisition of The Hotels Network in 2025 to bolster direct booking personalization, and the introduction
              of Revenue Agent in February 2026 as the inaugural component of an autonomous commercial operating system.
              Significant diligence gaps persist regarding audited revenue growth, retention metrics, and preferred
              liquidation preferences.
