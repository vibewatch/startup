  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Lighthouse defines its operational boundary as cloud-based commercial intelligence and revenue management
              software for the hospitality ecosystem. This software category addresses critical decision workflows
              across pricing optimization, forward market demand forecasting, rate parity tracking, and business
              intelligence (BI) derived from property management system (PMS) data. The addressable spend boundary
              deliberately encompasses specialized commercial tools purchased by revenue directors, general managers,
              and commercial executives to drive revenue per available room (RevPAR). Conversely, it excludes core
              operational hotel infrastructure such as hardware property management systems, guest-facing point-of-sale
              (POS) hardware, payment gateway switches, and guest room access systems. By integrating alternative
              accommodation benchmarking—tracking over 19 million vacation rental properties alongside 725,000
              traditional hotels—the platform bridges historical silos between traditional lodging and short-term rental
              operators.
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Footprint Lenses'
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for Lighthouse requires separating top-down industry sponsor estimates
              from bottom-up SaaS subscription economics. Public disclosures by lead investor KKR size the total travel
              and hospitality technology market at approximately $15 billion. However, this broad total addressable
              market (TAM) encompasses enterprise reservation systems, airline ticketing infrastructure, and on-premise
              hotel hardware. When filtered to commercial software—including rate shopping, revenue intelligence, and
              distribution tracking—the serviceable addressable market (SAM) is estimated at $2.2 billion to $3.0
              billion globally across approximately 725,000 commercial hotels. Lighthouse currently reports an active
              contracted client footprint of over 70,000 properties across 185 countries. Because commercial software
              spend per property varies widely between single-property independent boutiques paying modest monthly
              subscriptions and enterprise hotel brands deploying portfolio-wide multi-product suites, revenue capture
              remains heavily dependent on module attach rates rather than property count alone.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM013
              - CM014
