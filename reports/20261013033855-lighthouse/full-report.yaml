              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Autonomous Agent Execution and Gateway Fragility
            body: >-
              Deploying autonomous revenue agents directly into pricing workflows creates asymmetric downside: while
              rate optimization can drive yield improvements, algorithmic drift or unconstrained rate pushes across 200+
              connected OTA channels could rapidly destroy property RevPAR or violate distribution parity rules without
              robust human-in-the-loop guardrails.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Lighthouse centers on its position as the preeminent commercial intelligence and
              revenue management platform for the global hospitality sector. Serving over 70,000 hotel and accommodation
              providers across 185 countries, Lighthouse ingests and processes more than 400 terabytes of market,
              pricing, and distribution data every day. The company's $370 million Series C growth investment in
              November 2024, led by KKR's Next Generation Technology III Fund, validates its product-market fit and
              provides substantial expansion capital. However, the anti-thesis is equally compelling: audited income
              statements, net revenue retention cohorts, and organic growth trajectories remain undisclosed publicly.
              Given secondary valuation reports pegging the business at $2.4 billion against approximately $100 million
              in ARR, the current valuation reflects an aggressive ~24x revenue multiple. This represents an
              unsustainable multiple disconnect relative to public hotel technology benchmarks. Consequently, we assign
              a research-more recommendation with a medium confidence level, high risk rating, and stretched valuation
              stance until private data-room access clarifies underlying unit economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Current Financing and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Lighthouse's capital structure reflects rapid growth and aggressive consolidation, with cumulative funding
              reaching approximately $470 million across three institutional rounds. The November 2024 Series C round
              injected $370 million of growth equity, with KKR joining existing backers Spectrum Equity, F-Prime
              Capital, Eight Roads Ventures, and Highgate Technology Ventures. Valuation marks from this transaction
              diverge across secondary trackers: certain market reports cite unicorn status above $1.0 billion, whereas
              transaction databases record a $2.4 billion post-money mark. In parallel, self-reported hiring disclosures
              indicate Lighthouse surpassed $100 million in annual recurring revenue across more than 850 global
              employees. The presence of substantial late-stage growth capital introduces liquidation preference
              overhang for common shareholders if senior preferred equity carries participating terms or guaranteed
              minimum returns. Furthermore, private secondary platforms such as Caplight show zero public visibility
              into regulatory filings, shareholder agreements, or cap table structures, reinforcing the necessity for
              strict entry discipline.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV010
      - number: '8.3'
        title: Scenario Analysis and Comparable Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Benchmarking Lighthouse against public and private peers highlights substantial multiple disparity.
              Publicly traded hospitality software vendors trade at modest revenue multiples: Agilysys trades at 8.3x
              EV/Revenue, HBX Group at 3.4x, Shiji Group at 6.2x, and TravelSky at 0.9x. While private hospitality
              management peer Mews achieved a $2.5 billion valuation on $100 million revenue (25.0x multiple), broader
              SaaS valuations have compressed significantly. In our base scenario, Lighthouse scales ARR from $100
              million to $150 million over three years, but multiple compression to 6x–8x ARR yields a valuation between
              $900 million and $1.2 billion, resulting in flat to negative returns from the Series C mark. In a bear
              case where growth decelerates below 10% and customer churn among independent hotels increases, re-rating
              to public peer averages (3x–4x EV/Revenue) implies a severe valuation contraction to $330 million–$440
              million, exposing late-round common equity to over 60% downside.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Lighthouse's exit roadmap includes potential public market listing or buyout by global private equity and
              enterprise software conglomerates such as Amadeus or Oracle Hospitality. Continued product
              expansion—exemplified by the February 2026 launch of Revenue Agent for autonomous pricing execution and
              dedicated Commercial Strategy Services for independent operators—demonstrates operational momentum.
              However, institutional exit readiness remains hindered by the opacity of its post-acquisition financial
              consolidation across Stardekk, Transparent, and Kriya RevGen. Prior to committing growth equity, diligence
              must prioritize four critical asks: audited historical income statements and cash flow, gross and net
              dollar retention schedules segmented by customer tier, the exact liquidation preference waterfall from the
              Series C round, and customer concentration across major hotel chains versus independent operators.
              Thesis-break triggers include organic ARR growth falling below 15% or evidence of customer churn
              acceleration.
            claimRefs:
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Entry Discipline Mandatory Given Multiples Disconnect
            body: >-
              While Lighthouse demonstrates clear commercial traction with over 70,000 hotel clients and strong backing
              from KKR, underwriting an entry at the reported $2.4 billion valuation implies an extreme 24x ARR
              multiple. Prospective investors must condition any capital commitment on verified ARR growth rates and
              senior liquidation preference transparency.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
