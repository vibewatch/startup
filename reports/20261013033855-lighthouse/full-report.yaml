  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - Bull thesis
        - >-
          Category-defining commercial intelligence platform processing 400TB+ daily data across 70,000+ properties with
          autonomous AI Revenue Agent expansion.
        - Official platform disclosures, 70+ NPS, and consecutive industry awards from 2021 through 2025.
        - Deceleration in independent hotel adoption or failure of AI agents to monetize as standalone modules.
      - - Bear thesis
        - >-
          Reported $2.4B valuation requires flawless 30%+ organic growth and premium SaaS margins that unverified public
          sources cannot substantiate.
        - Independent private comps showing public hospitality tech comps trading at 0.9x–8.3x EV/Revenue multiples.
        - Verified disclosure of audited >115% net revenue retention and >75% gross margins.
      - - 'Anti-thesis: Execution'
        - >-
          Rapid acquisition pace (Transparent, Kriya RevGen, Stardekk, HQ Revenue) creates technical integration
          friction and product fragmentation.
        - Wikipedia and industry acquisition history detailing multiple acquisitions across distinct geographies.
        - Independent confirmation of unified single-platform data ingestion and cross-product customer attach.
      - - 'Anti-thesis: Downside'
        - >-
          Secondary market opacity and preference overhang from $370M growth equity round leaves common equity exposed
          in multiple compression.
        - Caplight filings preview showing restricted institutional documentation and undisclosed cap table rights.
        - Clean senior liquidation preference structure with 1x non-participating terms.
    notes: >-
      Thesis arguments compare reported operational scale against independent valuation multiples and structural
      disclosure gaps.
