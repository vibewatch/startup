      - number: '7.3'
        title: Operational Reliability, Ingestion Scale, and AI Agent Execution
        blocks:
          - type: paragraph
            body: >-
              At an operational scale ingesting over 140 terabytes of data daily and profiling 16.8 million properties,
              system reliability depends entirely on data pipeline resilience and robust algorithmic guardrails.
              Historical disruptions demonstrated that external volatility can cause automated event data feeds to fail,
              necessitating third-party event intelligence partnerships to filter noisy signals and prevent distorted
              demand forecasts. With the introduction of Revenue Agent, Lighthouse processes more than 3 billion market
              data points daily to autonomously surface opportunities and execute commercial actions. While Autopilot
              features enforce predefined bounds—such as minimum room rates, occupancy thresholds, and update
              frequencies—the risk of model drift during volatile macroeconomic periods remains a material operational
              exposure that requires continuous engineering oversight.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR015
