          hospitality software competition.
        - Conduct customer cohort retention and post-acquisition platform consolidation audit.
      - - Valuation stance
        - stretched
        - >-
          Nov 2024 Series C mark at $2.4B represents ~24x ARR on $100M ARR, compared to public comps trading at
          0.9x–8.3x EV/Revenue.
        - Insist on structured downside protections or entry multiple discounts reflecting public comp realities.
