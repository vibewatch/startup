      - CV008
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR grows from $100M to $220M in 3 years via AI Revenue Agent upsell and international hotel expansion; 80%
          gross margin.
        - >-
          Exit at $2.2B–$2.6B (10x–12x ARR); preserves Series C valuation, delivering 1.0x–1.2x return for late growth
          investors.
        - Agent commoditization by PMS incumbents; enterprise hotel procurement delays.
        - Low (20%)
      - - Base Case
        - >-
          ARR grows moderately to $150M in 3 years with organic deceleration offset by M&A; gross margin stabilizes at
          70%.
        - Multiple compresses to 6x–8x ARR, yielding $900M–$1.2B valuation; flat to down valuation vs Series C mark.
        - Organic growth stalls below 15%; integration overhead weighs on cash flow.
        - Medium (55%)
      - - Bear Case
        - >-
          Growth decelerates below 10% as hotel tech budgets tighten; customer churn in independent hotels rises; ARR
          flat at $110M.
        - Multiple re-rates to public hotel tech average of 3x–4x EV/Revenue, yielding $330M–$440M; 60%+ write-down.
        - Liquidation preference wipeout of common shares; severe multiple compression to legacy peers.
        - Medium-High (25%)
    notes: >-
      Scenario models assume $100M baseline ARR reported in 2025-2026 sources and benchmark exit multiples against
      public comparables.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
