      - number: '6.3'
        title: Retention Dynamics, Expansion Friction, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              While Lighthouse demonstrates high brand affinity with an industry-reported Net Promoter Score exceeding
              70 and top category rankings in business intelligence, contractual retention and expansion dynamics remain
              partly opaque. Audited net revenue retention, gross revenue retention, and annual cohort churn rates are
              not publicly disclosed by the company or its private equity sponsor KKR. Furthermore, independent user
              reviews on Toolradar indicate that specific subscription pricing details are withheld from public view,
              forcing prospective buyers into sales-assisted quoting. In addition, platform efficacy is tightly coupled
              to property management system (PMS) interoperability and channel integrations, creating technical friction
              during onboarding for older legacy hospitality IT stacks. The lack of public revenue concentration metrics
              leaves unresolved whether growth is disproportionately anchored by major enterprise hotel chains or
              broad-based long-tail property subscriptions.
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration and Pricing Transparency Friction
            body: >-
              Independent reviews on Toolradar indicate that Lighthouse does not disclose pricing tiers publicly and
              depends heavily on PMS integration stability, creating procurement friction for smaller independent
              properties.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Executive Risk Hierarchy and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Lighthouse has established widespread penetration across 70,000 lodging properties in 185 countries,
              providing an enterprise commercial operating system for pricing, distribution, and market intelligence.
              However, its expanding reliance on autonomous artificial intelligence and automated distribution
              introduces structural operating risks. As the platform transitions toward agentic execution through
              systems such as Revenue Agent, the primary downside risk shifts from passive data inaccuracy to
              unconstrained algorithmic rate distribution. A critical thesis-break trigger for growth investors is
              whether autonomous rate pushes could trigger severe revenue misallocations during abrupt market shifts or
              run afoul of algorithmic price coordination rules. In an environment characterized by compressed booking
              windows and macroeconomic volatility, unmonitored pricing automation risks destroying hotel margin rather
              than enhancing yield.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
