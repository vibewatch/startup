      - number: '5.2'
        title: Data Pipeline Scale & Property Management System Integrations
        blocks:
          - type: paragraph
            body: >-
              The operational defensibility of the Lighthouse platform relies directly on the scale and reliability of
              its underlying data ingestion pipeline. The infrastructure processes over 400 terabytes of travel and
              market data daily, capturing approximately 1.7 billion hotel rates and 1.2 billion flight and hotel search
              signals across 16.4 million profiled hotels and short-term rentals worldwide. This ingestion tier
              normalizes massive volumes of unstructured pricing and availability information collected across hundreds
              of online travel agency websites, global distribution systems, and metasearch engines. Converting raw
              external rate signals into actionable commercial recommendations requires robust caching, automated
              deduplication, and anomaly detection layers that prevent corrupted or promotional rate outliers from
              skewing pricing algorithms.


              Equally critical to customer retention and workflow adoption is Lighthouse's connectivity with hotel
              property management systems (PMS). The platform supports integrations with more than 50 PMS providers,
              allowing automated extraction of reservation pace, occupancy, and average daily rate figures. In August
              2026, Lighthouse deepened its strategic partnership with Cloudbeds, establishing an enhanced
              bi-directional data bridge that feeds live Cloudbeds PMS data directly into Lighthouse Performance and
              Lighthouse Distribution. This automated pipeline ensures that pickup and revenue analytics remain updated
              without requiring hoteliers to export and upload manual spreadsheets, while enabling portfolio managers to
              compare property-level RevPAR and ADR benchmarks across multi-location hotel groups.
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
