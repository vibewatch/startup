evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited GAAP/IFRS annual financial statements detailing exact ARR, annual revenue growth, gross margins, and net
      revenue retention (NRR).
    whyItMatters: >-
      Without audited financial disclosures, valuation multiples and organic recurring revenue health cannot be
      definitively benchmarked against public vertical SaaS peers.
    diligencePath: >-
      Request confidential historical income statements and cohort-level retention reports from company management under
      NDA.
    relatedQuestionRefs:
      - QO003
      - QO006
  - type: private-evidence-only
    severity: material
    topic: corporate-governance
    missingEvidence: >-
      Formal board of directors roster, voting agreements, investor seat allocations, and liquidation preference
      seniorities.
    whyItMatters: >-
      The governance dynamics between KKR, prior institutional venture funds, and founders govern capital allocation and
      downside protection.
    diligencePath: >-
      Review company articles of association, shareholder agreements, and KKR Next Gen Tech III transaction agreements
      during confirmatory legal diligence.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: revenue-management-sam-isolation
    missingEvidence: >-
      Independent third-party analyst research quantifying the discrete global addressable spend for hospitality
      commercial intelligence and pricing software separate from general hotel IT infrastructure.
    whyItMatters: >-
      The headline $15 billion TAM encompasses all hospitality technology including PMS, POS, and networking hardware,
      making Lighthouse's true revenue-management addressable ceiling difficult to isolate without proxy models.
    diligencePath: >-
      Review specialized industry benchmarking reports from Gartner, IDC, or Phocuswright on hospitality software
      category spending allocations.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: minor
    topic: segment-level-market-penetration
    missingEvidence: >-
      Audited breakdown of Lighthouse customer property count across independent boutique hotels versus regional hotel
      chains versus global brand enterprise accounts.
    whyItMatters: >-
      Aggregate property counts (70,000+) combine single-property subscriptions with multi-property enterprise master
      agreements, obscuring revenue concentration and relative segment penetration.
    diligencePath: Request customer cohort segmentation data and ARR distribution across property tiers during management diligence.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-contract-terms
    missingEvidence: >-
      Detailed competitor enterprise contract terms, realized discounting off list price, and minimum annual commitments
      across Duetto, IDeaS, and Lighthouse.
    whyItMatters: >-
      Without disclosed contract realizations, price-competitiveness and sales discounting dynamics cannot be
      independently benchmarked.
    diligencePath: >-
      Request customer win/loss reports, anonymized procurement bids, and rate-card discount schedules during commercial
      due diligence.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: autonomous-agent-efficacy
    missingEvidence: >-
      Independent quantitative audit of Revenue Agent's rate-optimization impact and customer attach rate following its
      Q1 2026 launch.
    whyItMatters: >-
      Vendor-announced agent capabilities lack third-party efficacy benchmarks regarding ADR lift and autonomous action
      accuracy.
    diligencePath: >-
      Interview beta customers and audit pilot logs comparing Revenue Agent suggested actions with realized revenue
      outcomes.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited breakdown of Annual Recurring Revenue (ARR), GAAP gross margin, and net revenue retention (NRR) by
      customer segment.
    whyItMatters: >-
      Without verified gross margin and net retention cohorts, long-term unit economics and valuation multiples cannot
      be underwritten with high precision.
    diligencePath: >-
      Request historical management accounts, audited revenue recognition schedules, and customer cohort renewal
      matrices under non-disclosure agreement.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cost-structure
    missingEvidence: >-
      Detailed operating cost structure differentiating cloud data infrastructure expenses, data ingestion licensing
      fees, and sales and marketing personnel expenses.
    whyItMatters: >-
      High volume data ingestion (processing over 400 TB daily) and extensive global headcount (700+ employees) create
      substantial fixed and variable operating cost bases that govern cash burn.
    diligencePath: >-
      Review management P&L cost allocations, AWS/cloud hosting invoices, third-party data vendor contracts, and
      departmental headcount budgets.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, net monthly cash burn rate, capitalization table, and liquidation preference terms for KKR
      Series C growth equity syndicate.
    whyItMatters: >-
      While the 70M funding round provides substantial nominal runway, senior liquidation preferences or debt-like
      equity tranches could alter common equity returns in downstream exit scenarios.
    diligencePath: >-
      Examine company charter, shareholder agreements, investor rights agreements, and latest board deck cash flow
      forecasts.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: algorithmic-transparency
    missingEvidence: >-
      Proprietary white papers or independent benchmark audit of Lighthouse's dynamic compset clustering and machine
      learning pricing models under thin-market and low-occupancy conditions.
    whyItMatters: >-
      Without technical audit documentation, prospective investors and enterprise hoteliers cannot verify whether
      automated pricing recommendations maintain accuracy or suffer model drift during market shocks.
    diligencePath: >-
      Request engineering architecture documentation, model evaluation white papers, and backtesting performance
      datasets under historical volatility during technical diligence.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: minor
    topic: service-reliability-sla
    missingEvidence: Historical multi-year SLA uptime logs, incident post-mortems, and SOC 2 Type II certification audit reports.
    whyItMatters: >-
      While public status pages show current uptime, historical incident recovery times and enterprise data privacy
      compliance proofs are necessary to underwrite mission-critical commercial software.
    diligencePath: >-
      Review SOC 2 Type II compliance reports, ISO 27001 certifications, and historical incident management logs in the
      virtual data room.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: customer-retention-metrics
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and annual cohort churn rates are not publicly
      disclosed by Lighthouse or KKR.
    whyItMatters: >-
      Without audited retention benchmarks, commercial durability and lifetime value cannot be independently verified
      from public domain sources.
    diligencePath: >-
      Request confidential SaaS metric cohort schedules, gross churn breakdown by property size, and enterprise renewal
      history in management diligence.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Full contract values, annual recurring revenue contribution, and multi-year renewal records for named customer
      case studies.
    whyItMatters: >-
      Case study disclosures highlight operational benefits but omit financial terms, masking customer concentration and
      revenue quality.
    diligencePath: >-
      Review top-20 customer revenue concentration schedule and standard master services agreement renewal terms during
      confirmatory diligence.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: Corporate Governance and Board Liquidation Preferences
    missingEvidence: >-
      Audited board voting thresholds, debt covenant terms, liquidation preferences, and cap-table investor protections
      remain undisclosed.
    whyItMatters: >-
      Downside protection and equity dilution risk cannot be modeled without access to confidential shareholder
      agreements and debt facility terms.
    diligencePath: Request confidential cap table, credit facility agreements, and board governance charters under diligence NDA.
    relatedQuestionRefs:
      - QR009
  - type: enumeration-incomplete
    severity: minor
    topic: Comprehensive Global Hospitality Regulatory Register
    missingEvidence: >-
