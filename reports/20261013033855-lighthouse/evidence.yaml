    diligencePath: Request audited financial statements and cohort retention schedules under NDA during confirmatory diligence.
    relatedQuestionRefs:
      - QV009
  - type: missing-source
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Complete capitalization table showing Series C liquidation preference multiplier, participation rights, and
