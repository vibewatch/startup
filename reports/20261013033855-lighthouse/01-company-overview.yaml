company:
  name: Lighthouse
chapter:
  number: 1
  title: Company Overview
  summary: Founded in 2012 as OTA Insight and headquartered in London, Lighthouse has evolved into an AI-driven commercial intelligence and revenue-management platform serving over 70,000 hotel properties globally. Backed by a $370 million Series C growth investment from KKR in November 2024 at an estimated $1.0 billion valuation and approximately $101 million ARR, the company is actively expanding from decision-support dashboards toward autonomous commercial agents.
sections:
- id: corporate-identity-and-operating-scope
  title: Corporate Identity, Heritage, and Operating Scope
  body: Lighthouse is a specialized commercial intelligence SaaS provider for the travel and hospitality industry, originally established in 2012 under the operating name OTA Insight before undergoing a corporate rebranding to Lighthouse. Headquartered in London, United Kingdom, with a primary European engineering and operations center located at the Zuiderpoort Office Tower in Ghent, Belgium, the organization maintains an operational footprint spanning over 700 employees globally. The company operates a cloud-based commercial operating system tailored for independent hotels, enterprise hotel chains, management companies, destination marketing organizations (DMOs), and travel technology vendors. The platform unifies property management system (PMS) reservation records, real-time rate shopping, competitor benchmarking, and forward-looking demand signals across short-term rental and hotel inventory. Public operational disclosures demonstrate substantial data throughput, tracking more than
    16.4 million to 16.8 million hotel and short-term rental listings and processing over 400 terabytes of market data daily across 185 countries. Ongoing core services remain operational, evidenced by active telemetry reporting across all customer-facing systems.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  tableRefs:
  - TO001
  figureRefs: []
- id: executive-leadership-and-governance
  title: Executive Leadership, Governance, and Key-Person Structure
  body: "The company operates under a tenured executive team led by Chief Executive Officer Sean Fitzpatrick, alongside co-founder Matthias Geeroms who directs corporate development and long-term M&A strategy. Functional leadership exhibits specialized domain coverage across commercial disciplines, including Dave Collier (Chief Revenue Officer), Ivo Minjauw (Chief Product Officer), Mathias Verhoeven (Chief Technical Officer), Georg Beyschlag (Chief Financial Officer), and Eva Metsu (General Counsel). In response to intensifying enterprise demand for autonomous workflow automation, Lighthouse established dedicated artificial intelligence governance under Chief AI Officer Juanjo Rodr\xEDguez. The organization exhibits moderate key-person dependence centered on CEO Sean Fitzpatrick and co-founder Matthias Geeroms, whose deep relationships with hotel chains and travel ecosystems have guided both organic platform expansion and programmatic M&A execution. However, formal governance disclosures\u2014\
    specifically independent board composition, committee structures, investor voting thresholds, and minority-protection covenants\u2014remain completely undisclosed across retained public filings and investor releases."
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO015
  tableRefs:
  - TO002
  figureRefs: []
- id: capital-structure-and-strategic-milestones
  title: Capital Structure, Valuation, and Strategic Milestones
  body: Lighthouse's capitalization trajectory is anchored by institutional private equity and venture capital syndicates. Following an $80 million Series B round closed in November 2021, the company announced an approximately $370 million growth equity investment led by KKR via its Next Generation Technology III Fund in November 2024, supported by existing sponsors Spectrum Equity, F-Prime Capital, Eight Roads Ventures, and Highgate Technology Ventures. Independent market profiles estimate total cumulative funding at $370 million to $450 million, an implied valuation of approximately $1.0 billion, and annual recurring revenue of approximately $101 million as of 2025. Between 2024 and 2026, Lighthouse executed key platform milestones, including the rollout of Total Revenue BI with generative AI smart summaries in June 2024, the launch of a next-generation Data Solutions Data-as-a-Service (DaaS) platform in April 2025, the strategic acquisition of The Hotels Network in 2025 to bolster direct
    booking personalization, and the introduction of Revenue Agent in February 2026 as the inaugural component of an autonomous commercial operating system. Significant diligence gaps persist regarding audited revenue growth, retention metrics, and preferred liquidation preferences.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
