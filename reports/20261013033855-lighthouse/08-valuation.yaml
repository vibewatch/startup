- calloutType: recommendation
  title: Entry Discipline Mandatory Given Multiples Disconnect
  body: While Lighthouse demonstrates clear commercial traction with over 70,000 hotel
    clients and strong backing from KKR, underwriting an entry at the reported $2.4
    billion valuation implies an extreme 24x ARR multiple. Prospective investors must
    condition any capital commitment on verified ARR growth rates and senior liquidation
    preference transparency.
  claimRefs:
