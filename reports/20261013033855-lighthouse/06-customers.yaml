company:
  name: Lighthouse
chapter:
  number: 6
  title: Customers
  summary: Lighthouse serves over 70,000 hotel and accommodation properties across
    185 countries, spanning boutique independents to multi-brand global chains. Independent
    reviews on Hotel Tech Report highlight 95% recommendation rates across 1,821 hotels,
    though opaque enterprise pricing and deep PMS dependency present ongoing adoption
    barriers.
sections:
- id: customer-segmentation-and-market-breadth
  title: Customer Segmentation and Market Breadth
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
  body: 'Lighthouse targets a multi-tier customer base across the global travel and
    hospitality industry, scaling from single-property boutique hotels to multinational
    enterprise chains and destination marketing organizations. The core commercial
    platform addresses distinct operational personas within each property tier: independent
    property operators rely on automated pricing recommendations to replace manual
    spreadsheet workflows without dedicated revenue staff, while regional hotel groups
    and enterprise chains deploy portfolio-level business intelligence to coordinate
    commercial decisions across dozens of regional clusters. Furthermore, the platform
    addresses short-term rental managers and destination marketing organizations by
    providing granular market demand trends and forward-looking booking pace analytics.
    However, customer distribution remains heavily weighted toward European and North
    American hotels, with emerging market penetration across Asia-Pacific and Latin
    America still scaling through localized commercial clusters.'
- id: adoption-trajectory-and-deployment-proof
  title: Adoption Trajectory and Named Deployment Outcomes
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU013
  - CU014
  tableRefs:
  - TU002
  - TU003
  figureRefs:
  - FU001
  body: 'Lighthouse''s commercial adoption trajectory reflects steady multi-year expansion,
    growing from 65,000 properties reported in 2025 to over 70,000 properties across
    185 countries by late 2024 and through 2026. Public customer case studies provide
    concrete evidence of production deployment across diverse lodging categories:
    enterprise customers such as Indian Hotels Company Limited manage portfolio revenue
    across more than 170 properties using unified commercial dashboards, while Hilton
    RMCC Shanghai utilized real-time market rate signals to achieve an average daily
    rate premium of 200 RMB above competitive sets. Similarly, boutique luxury operators
    like Ultima Hotel Gstaad and Eichardt''s Private Hotel report significant automation
    gains, with Eichardt''s documenting a 27% increase in direct RevPAR. On Hotel
    Tech Report, 95% of 1,821 hoteliers recommend the platform, reflecting widespread
    production satisfaction across small, mid-sized, and enterprise hotel tiers.'
- id: retention-expansion-and-concentration-risk
  title: Retention Dynamics, Expansion Friction, and Concentration Risks
  claimRefs:
  - CU010
  - CU011
  - CU012
  body: While Lighthouse demonstrates high brand affinity with an industry-reported
    Net Promoter Score exceeding 70 and top category rankings in business intelligence,
    contractual retention and expansion dynamics remain partly opaque. Audited net
    revenue retention, gross revenue retention, and annual cohort churn rates are
    not publicly disclosed by the company or its private equity sponsor KKR. Furthermore,
    independent user reviews on Toolradar indicate that specific subscription pricing
    details are withheld from public view, forcing prospective buyers into sales-assisted
    quoting. In addition, platform efficacy is tightly coupled to property management
    system (PMS) interoperability and channel integrations, creating technical friction
    during onboarding for older legacy hospitality IT stacks. The lack of public revenue
    concentration metrics leaves unresolved whether growth is disproportionately anchored
    by major enterprise hotel chains or broad-based long-tail property subscriptions.
