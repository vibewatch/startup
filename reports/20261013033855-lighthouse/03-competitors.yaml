        - Accessible for mid-scale portfolios; cost-prohibitive for single boutique owners
      - - Duetto
        - Enterprise modular subscription; quote-based
        - Modular components (GameChanger, ScoreBoard, BlockBuster, Advance)
        - Module-by-module pricing; annual enterprise commitments required
