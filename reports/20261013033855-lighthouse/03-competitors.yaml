callouts:
  - calloutType: insight
    title: Integration Ecosystem and Dataset Unification as Primary Competitive Moat
    body: >-
      Lighthouse's primary defense against standalone AI pricing point tools is not merely its algorithmic layer, but
      its extensive connectivity across 400+ hospitality technology systems paired with proprietary unified hotel and
      short-term rental demand datasets that point competitors cannot easily replicate.
    claimRefs:
      - CP001
      - CP002
      - CP014
  - calloutType: risk
    title: Downmarket Inaccessibility and Core PMS Vendor Platform Risk
    body: >-
      Lighthouse's enterprise pricing model and configuration complexity create an addressable ceiling that excludes
      independent hotel owner-operators, while open-cloud property management systems like Mews and Agilysys retain
      long-term structural leverage through direct ownership of core folio transactions.
    claimRefs:
      - CP005
      - CP015
