callouts:
- calloutType: risk
  title: Severe Information Asymmetry Around Underlying Unit Economics
  body: Prospective investors face significant disclosure deficits regarding Lighthouse actual gross margins, customer acquisition
    costs, and net revenue retention cohorts. Although directory trackers cite roughly 01 million in ARR and over 70 million
    in lifetime funding, absence of audited financial statements prevents rigorous underwriting of organic expansion efficiency
    versus M&A-driven growth.
  claimRefs:
  - CI004
  - CI014
- calloutType: strength
  title: Fortified Balance Sheet Following 70M Series C Capital Influx
  body: The 70 million Series C growth investment secured from KKR in late 2024 eliminates near-term refinancing hazards and
    provides substantial runway to withstand hospitality software market volatility. This capital cushion enables continued
    investment in proprietary AI capabilities, platform acquisitions, and market expansion without immediate dependency on
    public equity markets.
  claimRefs:
  - CI005
  - CI006
  - CI007
