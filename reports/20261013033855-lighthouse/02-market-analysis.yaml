callouts:
- calloutType: insight
  title: The Shift from Passive BI to Autonomous Commercial Execution
  body: The commercial software market in hospitality is undergoing a generational
    inflection. Historically, revenue managers used Business Intelligence tools purely
    for retrospective reporting—examining past pickup, pace, and rate parity. With
    Lighthouse's introduction of Revenue Agent, the software boundary is expanding
    from passive data display into autonomous commercial workflows, continuously scanning
    billions of market signals to proactively recommend and execute pricing actions.
  claimRefs:
  - CM008
  - CM009
- calloutType: risk
  title: PMS Fragmentation and Budget Disconnects as Structural Adoption Hurdles
  body: Despite high software ROI, adoption velocity faces friction from deep fragmentation
    in the property management system (PMS) ecosystem. With hundreds of on-premise
    and legacy cloud PMS platforms in circulation, API integration delays and two-way
    sync failures represent persistent operational hurdles. Furthermore, institutional
    divides between marketing, sales, and revenue teams often delay software procurement
    due to fragmented budget ownership.
  claimRefs:
  - CM010
  - CM011
