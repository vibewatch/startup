  evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-management-sam-isolation
    missingEvidence: Independent third-party analyst research quantifying the discrete
      global addressable spend for hospitality commercial intelligence and pricing
      software separate from general hotel IT infrastructure.
    whyItMatters: The headline $15 billion TAM encompasses all hospitality technology
      including PMS, POS, and networking hardware, making Lighthouse's true revenue-management
      addressable ceiling difficult to isolate without proxy models.
    diligencePath: Review specialized industry benchmarking reports from Gartner,
      IDC, or Phocuswright on hospitality software category spending allocations.
    relatedQuestionRefs:
