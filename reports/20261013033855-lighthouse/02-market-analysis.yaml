  - type: private-evidence-only
    severity: minor
    topic: segment-level-market-penetration
    missingEvidence: Audited breakdown of Lighthouse customer property count across
      independent boutique hotels versus regional hotel chains versus global brand
      enterprise accounts.
    whyItMatters: Aggregate property counts (70,000+) combine single-property subscriptions
      with multi-property enterprise master agreements, obscuring revenue concentration
      and relative segment penetration.
    diligencePath: Request customer cohort segmentation data and ARR distribution
      across property tiers during management diligence.
