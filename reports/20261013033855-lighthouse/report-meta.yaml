companyProfile:
  summary: >-
    Lighthouse is a London-based hospitality B2B SaaS company founded in 2012 as OTA Insight. It provides an AI-driven
    commercial operating system that combines market intelligence, revenue-management, pricing, and
    business-intelligence tools for hotels and accommodation providers, and is extending that platform with Revenue
    Agent automation.
