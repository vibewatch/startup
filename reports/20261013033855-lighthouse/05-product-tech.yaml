  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Manual Workflow
      - Lighthouse Solution
      - Measurable Benefit
      - Technical Limitation
    rows:
      - - Competitor Rate Benchmarking
        - Manual daily checking of rival hotel rates across multiple OTA websites and spreadsheets
        - Automated real-time rate intelligence across hotels and vacation rentals via Rate Insight
        - Eliminates manual rate shopping; tasks completed up to 60% faster
        - Minor rate discrepancies across obscure OTA channels
      - - Morning Pickup & Pace Reporting
        - Extracting PMS data, manually compiling spreadsheets, running macros for 60-90 minutes
        - Automated Smart Summaries and direct Cloudbeds/PMS performance integration
        - Reduces daily report preparation time from 90 minutes to 20 minutes
        - Requires active API connection with compatible PMS partner
      - - Forward Demand Forecasting
        - Relying on historical on-the-books occupancy and static compset assumptions
        - Forward-looking search intent tracking with dynamically rebalancing Smart Compsets
        - Detects market demand spikes up to 365 days in advance
        - Predictive accuracy depends on market liquidity and external travel search volume
      - - Distribution Parity Monitoring
        - Ad-hoc manual searches to identify unauthorized OTA rate undercutting
        - Automated portfolio-wide rate parity tracking via Parity Insight
        - Enables rapid remediation of wholesaler leaks and rate disparity
        - High complexity and learning curve for smaller independent operators
    notes: Workflows and operational time savings sourced from Lighthouse product documentation and partner deployment reports. Actual time savings vary by portfolio size.
