    data:
      layers:
        - label: Autonomous Agent & Workspace Tier
          detail: Autonomous decision-execution agents and conversational workspace that monitor commercial KPIs and automate operational actions.
          modules:
            - Revenue Agent (autonomous anomaly detection and commercial action suggestions)
            - Ernest AI (conversational hospitality workspace and alerting)
            - Superpilot & KITT AI Receptionist (guest-facing messaging and direct booking conversion)
        - label: Commercial Application & Intelligence Suite
          detail: Core end-user applications for pricing, revenue management, market intelligence, and distribution parity.
          modules:
            - Rate Insight (real-time hotel and short-term rental competitor shopping)
            - Market Insight (top-of-funnel booking demand forecasting up to 365 days out)
            - Business Intelligence (multi-property performance rollups and pickup analysis)
            - Parity Insight (cross-channel OTA disparity tracking and distribution control)
        - label: Analytics & Automation Engine
          detail: Proprietary processing pipelines for dynamic benchmarking, automated displacement analysis, and reporting.
          modules:
            - Smart Compset (dynamic competitive set rebalancing based on live search trends)
            - Smart Summaries (daily natural-language morning briefing generation)
            - Displacement Analysis Engine (rapid group booking yield evaluation)
            - Connect AI (structured content distribution to consumer AI assistants)
        - label: Integration & Partner Connectivity Tier
          detail: API-driven data exchange connecting property management systems, channel managers, and central reservation systems.
          modules:
            - Cloudbeds PMS Bi-Directional Connector (automated pickup, pace, and rate synchronization)
            - 50+ Property Management System Integration Adapters
            - 100+ Booking Engine & Central Reservation System (CRS) Connectors
        - label: Big Data Processing & Normalization Layer
          detail: High-throughput data pipelines processing massive unstructured travel and pricing signals.
          modules:
            - 1.7 Billion Daily Hotel Rate Collection Pipeline
            - 1.2 Billion Daily Travel & Flight Search Ingestion Engine
            - 16.4 Million Property Profile Registry (Hotels & Short-Term Rentals)
            - 400+ Terabyte Daily Travel Market Data Processing Infrastructure
        - label: Cloud Infrastructure, High Availability & Governance
          detail: Enterprise-grade cloud hosting, security compliance, status monitoring, and data isolation.
          modules:
            - Multi-Tenant Scalable Cloud Infrastructure
            - Lighthouse HQ System Status & Incident Monitoring (status.lighthousehq.com)
            - Role-Based Access Control, Tenant Data Isolation & GDPR Compliance
callouts:
  - calloutType: strength
    title: Proprietary Data Moat Across Hotels and Short-Term Rentals
    body: Lighthouse's primary structural differentiator is the breadth of its proprietary hospitality dataset, which ingests 1.7 billion daily rate updates alongside vacation rental benchmarks and forward-looking travel intent signals. By unifying short-term rentals and traditional hotels into a single commercial platform, Lighthouse provides hoteliers with a holistic market compset that standalone revenue management systems cannot replicate.
    claimRefs:
      - CE001
      - CE006
  - calloutType: risk
    title: Execution and Guardrail Risks in Autonomous Commercial Agents
    body: The transition from observational business intelligence to autonomous agent execution introduces operational and reputational liabilities. If Revenue Agent or automated pricing recommendations fail to accurately reflect hyper-local demand anomalies or contract constraints, hotel operators risk revenue displacement or margin erosion, making user-defined guardrails and transparent data auditing essential.
    claimRefs:
      - CE010
      - CE012
      - CE014
