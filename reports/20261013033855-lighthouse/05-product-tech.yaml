figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Lighthouse commercial operating system architecture spanning data ingestion, analytics, PMS connectivity, applications, and autonomous AI agents.
    approximationNotes: Architectural layers generalized from product whitepapers, partnership specifications, and technical announcements.
    claimRefs:
