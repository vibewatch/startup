    title: Technology / operating architecture table
    columns:
      - Architecture Layer / Component
      - Operational Role
      - System Dependency
      - Technical / Execution Risk
    rows:
      - - Data Ingestion & Aggregation Engine
        - Ingests 1.7B daily rates, 1.2B travel searches, and 400TB+ market data
        - OTA feeds, GDS feeds, flight search data, vacation rental listings
        - Rate limiting, anti-scraping protections, and external API schema shifts
      - - PMS Integration Hub
        - Bidirectional data synchronization with 50+ PMS vendors including Cloudbeds
        - Cloudbeds API, property management system connectivity, webhook infrastructure
        - Legacy PMS connectivity failures and synchronization lag on on-premise deployments
      - - AI & Analytics Intelligence Layer
        - Powers Smart Compsets, Smart Summaries, Revenue Agent, and Ernest AI workspace
        - Machine learning inference pipeline, proprietary hospitality models, LLM APIs
        - Model hallucination, latency during high-volume query periods, and cost scaling
      - - Core Platform & Infrastructure
        - Multi-tenant cloud architecture providing web application, alerting, and reporting
        - Cloud hosting infrastructure, database clustering, public status reporting
        - Service disruption across dependent regional data centers
    notes: Architecture components synthesized from technical releases, KKR investment disclosures, and integration technical specifications.
