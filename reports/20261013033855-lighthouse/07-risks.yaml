callouts:
- calloutType: risk
  title: Autonomous Agent Execution and Gateway Fragility
  body: 'Deploying autonomous revenue agents directly into pricing workflows creates
    asymmetric downside: while rate optimization can drive yield improvements, algorithmic
    drift or unconstrained rate pushes across 200+ connected OTA channels could rapidly
    destroy property RevPAR or violate distribution parity rules without robust human-in-the-loop
    guardrails.'
  claimRefs:
  - CR002
  - CR005
  - CR010
