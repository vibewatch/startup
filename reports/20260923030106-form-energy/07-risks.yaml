    "number": 7,
    "title": "Risks",
    "summary": "Form Energy’s top risks are execution, customer concentration, and capital dependency, with regulatory and efficiency concerns secondary to whether the first commercial systems ship on schedule."
  },
  "sections": [
    {
      "id": "risk-register",
      "title": "Risk register and severity ordering",
      "body": "The highest-severity risks are not regulatory surprises; they are execution, concentration, and capital dependence. Form has to prove that the first systems work, that the factory can deliver on time, and that a few giant contracts can be diversified before they dominate the business. If those three things go wrong together, the equity story weakens quickly. The risk stack is therefore operational before it is legal. That makes execution the most important near-term variable. The company can still win if it keeps shipping and supporting projects without surprise setbacks. Discipline is the whole game. That is the only credible path.",
      "claimRefs": [
        "CR001",
        "CR003",
        "CR004",
        "CR005"
      ],
      "tableRefs": [
        "TR001"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "regulatory-and-ops",
      "title": "Regulatory, operational, and technology risks",
      "body": "Form does not currently face a headline legal crisis, but it does face ordinary project-development risk: permits, interconnect, site work, and a product that has not yet run a full commercial year. Efficiency tradeoffs are still a serious talking point in public coverage, so the company must keep proving that its duration niche outweighs the costs of a lower-efficiency chemistry. In short, the company is managing a normal but demanding industrial ramp. The challenge is to make that ramp look routine rather than fragile. Industrial buyers will forgive speed bumps, but not repeated misses. Consistency matters most. The next deliveries will be watched closely.",
      "claimRefs": [
        "CR002",
        "CR006",
        "CR008",
        "CR009"
      ],
      "tableRefs": [
        "TR002"
      ]
    },
    {
      "id": "mitigation",
      "title": "Mitigations and thesis-break triggers",
      "body": "The best mitigation is to ship on time, diversify the backlog, and keep industrial partners aligned. A thesis-break would be a slip that turns a giant backlog into delayed revenue while the company burns additional capital to keep the factory running. The company can reduce risk, but it cannot eliminate the need for flawless execution over the next few years. A single major delivery miss would quickly change the narrative. That is why the next milestones matter more than the slide deck. If the factory and projects stay on schedule, the risk profile improves quickly. Otherwise, capital pressure rises fast. The downside stays real.",
      "claimRefs": [
        "CR007",
        "CR010",
        "CR011",
        "CR012"
      ],
      "tableRefs": [
        "TR003"
      ]
    }
  ],
