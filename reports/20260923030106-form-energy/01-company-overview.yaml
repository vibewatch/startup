    "summary": "Form Energy is a late-stage private iron-air battery company with a large manufacturing ramp, a $750M 2026 Series G, and a backlog that now stretches into a multi-year commercial delivery window."
  },
  "sections": [
    {
      "id": "overview",
      "title": "Identity and commercial posture",
      "body": "Form Energy is a late-stage private grid-storage company built around 100-hour iron-air batteries. The company has moved from laboratory concept to factory production at Form Factory 1 in Weirton, West Virginia, while keeping its headquarters in Somerville, Massachusetts. The current story is not just technical novelty: the public record now centers on a financed manufacturing ramp, a backlog measured in tens of gigawatt-hours, and a first commercial system that is still converting from pilot to operating asset. That combination makes the company look like a scale-up, not a mature utility supplier.",
      "claimRefs": [
        "CO001",
        "CO002",
        "CO003",
        "CO009"
      ],
      "tableRefs": [
        "TO001"
      ],
      "figureRefs": [
        "FO001"
      ]
    },
    {
      "id": "people-and-ownership",
      "title": "Founders, leadership, and investor base",
      "body": "The founder set is unusually technical and still visible in the company narrative: Mateo Jaramillo, Yet-Ming Chiang, Ted Wiley, Billy Woodford, and Marco Ferrara appear in company and partner materials. In 2026 the leadership bench expanded with CFO Navneet Govil and COO Wes Sloan to support manufacturing scale-up and a possible IPO path. Ownership is anchored by a blue-chip climate and industrial investor group that includes T. Rowe Price, GE Vernova, Breakthrough Energy, Engine Ventures, ArcelorMittal, and other repeat backers. That mix matters because it gives the company more than money: it gives industrial validation.",
      "claimRefs": [
        "CO001",
        "CO005",
        "CO006",
        "CO008"
      ],
      "tableRefs": [
        "TO002"
      ]
    },
    {
      "id": "capital-and-gaps",
      "title": "Capitalization and diligence gaps",
      "body": "The refreshed fact pattern still looks like a capital-intensive scale-up rather than a mature operating business. Public sources converge on more than $2 billion of equity raised and a valuation reset in the latest round, but they do not disclose current revenue, gross margin, cash burn, or customer concentration in enough detail to underwrite the business as if it were already steady-state. Those missing inputs matter because the company is now trying to translate a large order book into shipped hardware and booked revenue over several years. In other words, the upside is credible, but the underwriting still hinges on execution. The stakeholder map below is therefore directional rather than definitive. Timing still matters.",
      "claimRefs": [
        "CO007",
        "CO010",
        "CO012"
      ],
      "tableRefs": [
        "TO003"
      ]
    }
  ],
