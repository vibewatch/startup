    "number": 4,
    "title": "Financials",
    "summary": "Form Energy has raised more than $2 billion, but the economics remain highly capital intensive and the public record still lacks the revenue, margin, and runway data needed for full underwriting."
  },
  "sections": [
    {
      "id": "funding-and-runway",
      "title": "Funding chronology and capital posture",
      "body": "The public record shows a classic capex-heavy financing profile: a large 2024 Series F, a larger 2026 Series G, and more than $2 billion of cumulative equity raised. That capital has been used to build Form Factory 1, ramp early production, and fund the commercial transition. The important point for diligence is that the business is still capital-consuming even after the latest raise; the funding story is therefore about runway and execution, not just headline round size. The balance sheet matters because hardware ramps often consume cash faster than narrative momentum suggests.",
      "claimRefs": [
        "CI001",
        "CI002",
        "CI003",
        "CI006"
      ],
      "tableRefs": [
        "TI001"
      ],
      "figureRefs": [
        "FI001"
      ]
    },
    {
      "id": "revenue-and-margins",
      "title": "Revenue timing and monetization",
      "body": "The best public evidence suggests that Form is still at the front edge of revenue recognition. Management and third-party writeups point to first meaningful revenue in 2026, but the revenue model itself is still project-based and opaque. That means conversion from backlog to booked revenue will likely be lumpy and stretched over several years. For underwriting, the key unknowns are gross margin, install timing, and how much customer payment arrives before and after system delivery. In practical terms, the company still needs to turn announcements into invoices. That means conversion speed matters as much as backlog size.",
      "claimRefs": [
        "CI005",
        "CI007",
        "CI008",
        "CI010",
        "CI012"
      ],
      "tableRefs": [
        "TI002"
      ]
    },
    {
      "id": "capital-needs",
      "title": "Capital needs and financing dependency",
      "body": "Because Form is manufacturing hardware rather than shipping software, the next few years depend on continued access to capital and on the company’s ability to keep large customers patient through the build-and-ship cycle. The 2026 backlog improves confidence, but it does not remove the need for working capital, inventory, and factory throughput. Capital access is therefore a live operating dependency, not a one-time event. The company cannot assume the current round solves every future funding need. That is the core financial constraint. It still needs careful monitoring. It is not solved yet. If the IPO path slips, the company will likely need either another private round or some form of strategic financing support.",
      "claimRefs": [
        "CI009",
        "CI011",
        "CI012"
      ],
      "tableRefs": [
        "TI003"
      ]
    }
  ],
