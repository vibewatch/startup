figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: compact
    summary: >-
      Form Energy moved from founding to commercial manufacturing through successive financings, a factory build, and a
      2026 backlog step-up.
    data:
      items:
        - date: '2017'
          label: Founding
          detail: Company formed around multi-day storage and iron-air chemistry.
          tone: neutral
        - date: 2021-07
          label: Series D / ArcelorMittal partnership
          detail: Strategic industrial backing and materials partnership announced.
          tone: positive
        - date: 2022-09
          label: Series E / Weirton decision
          detail: Large financing supports first factory and commercialization.
          tone: positive
        - date: 2024-10
          label: Series F and trial production
          detail: Factory construction and trial production move the company into manufacturing.
          tone: neutral
        - date: 2026-08
          label: Series G and backlog jump
          detail: New financing, new executives, and >80 GWh backlog reported.
          tone: positive
        - date: 2026-09
          label: Hiring sprint
          detail: Weirton hiring expands as the plant scales toward commercial output.
          tone: neutral
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO008
      - CO009
  - id: FM001
    title: Market demand stack
    type: kpi
    layout: compact
    summary: >-
