chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and commercial posture
        blocks:
          - type: paragraph
            body: >-
              Form Energy is a late-stage private grid-storage company built around 100-hour iron-air batteries. The
              company has moved from laboratory concept to factory production at Form Factory 1 in Weirton, West
              Virginia, while keeping its headquarters in Somerville, Massachusetts. The current story is not just
              technical novelty: the public record now centers on a financed manufacturing ramp, a backlog measured in
              tens of gigawatt-hours, and a first commercial system that is still converting from pilot to operating
              asset. That combination makes the company look like a scale-up, not a mature utility supplier.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO009
              - CO012
          - type: figure
