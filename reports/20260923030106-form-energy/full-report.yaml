              - CO005
              - CO006
              - CO008
              - CO009
      - number: '1.2'
        title: Founders, leadership, and investor base
        blocks:
          - type: paragraph
            body: >-
              The founder set is unusually technical and still visible in the company narrative: Mateo Jaramillo,
              Yet-Ming Chiang, Ted Wiley, Billy Woodford, and Marco Ferrara appear in company and partner materials. In
              2026 the leadership bench expanded with CFO Navneet Govil and COO Wes Sloan to support manufacturing
              scale-up and a possible IPO path. Ownership is anchored by a blue-chip climate and industrial investor
              group that includes T. Rowe Price, GE Vernova, Breakthrough Energy, Engine Ventures, ArcelorMittal, and
              other repeat backers. That mix matters because it gives the company more than money: it gives industrial
              validation.
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO008
      - number: '1.3'
        title: Capitalization and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The refreshed fact pattern still looks like a capital-intensive scale-up rather than a mature operating
              business. Public sources converge on more than $2 billion of equity raised and a valuation reset in the
              latest round, but they do not disclose current revenue, gross margin, cash burn, or customer concentration
              in enough detail to underwrite the business as if it were already steady-state. Those missing inputs
              matter because the company is now trying to translate a large order book into shipped hardware and booked
              revenue over several years. In other words, the upside is credible, but the underwriting still hinges on
              execution. The stakeholder map below is therefore directional rather than definitive. Timing still
              matters.
            claimRefs:
              - CO007
              - CO010
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO009
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market framing and customer job-to-be-done
        blocks:
          - type: paragraph
            body: >-
              Form Energy is not trying to win the entire storage stack; it is aiming at the multi-day reliability
              problem that appears when renewable generation, AI load growth, and constrained grids collide. The public
              record points to a buyer set that spans utilities, grid operators, and large corporate offtakers, with
              data centers now standing beside utilities as a demand anchor. That means the category is best understood
              as long-duration energy storage for firming, resilience, and capacity deferral rather than generic battery
              capacity. The niche matters because the company only has to win the part of the market that truly needs
              100-hour duration. That focus narrows the market and makes project economics easier to reason about.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
      - number: '2.2'
        title: Sizing lenses and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The current evidence does not support one clean TAM number. Instead, the more defensible approach is to
              use constrained lenses: grid-reliability spend, utility replacement of retiring thermal assets, and
              AI/data-center resiliency demand. Adoption is slowed by capital intensity, interconnection, and
              procurement timelines, but the 2026 project slate suggests that the market is already moving from pilot
              curiosity toward bankable commercial procurement. That makes the right question less about whether the
              category exists and more about which customer segment becomes the dominant first mover. The backlog itself
              is now a proxy for real demand, even if it is not a market-size forecast. In practice, the market is being
              assembled project by project.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: What the market implies for diligence
        blocks:
          - type: paragraph
            body: >-
              For diligence purposes, the market should be treated as real but still forming. The key open issue is not
              whether multi-day storage is useful; it is how fast utilities, hyperscalers, and regulators can turn that
              usefulness into signed, financeable projects. The answer drives both near-term revenue timing and the size
              of the install base Form Energy can reach before the next financing cycle. If the largest projects keep
              converting, the company’s niche becomes easier to defend. The next refresh should watch whether project
              announcements become shipped megawatts.
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM006
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Form Energy sits in a market that is not a pure one-versus-one competition. Short-duration lithium-ion,
              other long-duration chemistries, and utility-side alternatives all sit in the decision set. The practical
              question for buyers is not whether batteries exist, but which technology can solve a multi-day reliability
              problem at an acceptable cost, with acceptable safety and bankability. That keeps the competitive set
              broad even when Form’s 100-hour duration is highly distinctive. The key point is that the category is
              being shaped by customer need, not by a single dominant incumbent. The market is still forming. That makes
              substitution analysis as important as direct competitor analysis. The key point is that the category is
              being shaped by customer need, not by a single dominant incumbent. The market is still forming.
            claimRefs:
              - CP001
              - CP002
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP012
      - number: '3.2'
        title: Why Form still looks different
        blocks:
          - type: paragraph
            body: >-
              The strongest differentiators remain duration, chemistry, and industrial execution. Form’s own materials
              emphasize low-cost iron, water, and air; the market commentary underscores that the company is selling
              bankability in a new duration bucket rather than trying to out-muscle lithium-ion on short-duration
              economics. The ArcelorMittal relationship adds a materials-supply angle that most pure software or
              short-duration battery companies do not have. That combination gives Form a clearer story than most peers,
              even if the story still depends on execution. It also means the moat is partly industrial, not just
              chemical. That matters for buyers.
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP012
      - number: '3.3'
        title: Moat durability and erosion paths
        blocks:
          - type: paragraph
            body: >-
              The moat is real but not permanent. It depends on the company continuing to convert chemistry into
              manufacturing scale, and on customers deciding that duration and site flexibility matter more than
              lithium-ion’s improving economics. If cheaper short-duration storage, utility upgrades, or another entrant
              solve the same grid problem, the moat compresses. That is why the current competitive edge should be
              treated as execution-dependent rather than chemistry-only. In other words, the moat is a moving target,
              not a fixed wall. The next refresh should care as much about delivery evidence as chemistry claims. Timing
              still matters.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding chronology and capital posture
        blocks:
          - type: paragraph
            body: >-
              The public record shows a classic capex-heavy financing profile: a large 2024 Series F, a larger 2026
              Series G, and more than $2 billion of cumulative equity raised. That capital has been used to build Form
              Factory 1, ramp early production, and fund the commercial transition. The important point for diligence is
              that the business is still capital-consuming even after the latest raise; the funding story is therefore
              about runway and execution, not just headline round size. The balance sheet matters because hardware ramps
              often consume cash faster than narrative momentum suggests.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI012
      - number: '4.2'
        title: Revenue timing and monetization
        blocks:
          - type: paragraph
            body: >-
              The best public evidence suggests that Form is still at the front edge of revenue recognition. Management
              and third-party writeups point to first meaningful revenue in 2026, but the revenue model itself is still
              project-based and opaque. That means conversion from backlog to booked revenue will likely be lumpy and
              stretched over several years. For underwriting, the key unknowns are gross margin, install timing, and how
              much customer payment arrives before and after system delivery. In practical terms, the company still
              needs to turn announcements into invoices. That means conversion speed matters as much as backlog size.
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI010
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI010
              - CI012
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Because Form is manufacturing hardware rather than shipping software, the next few years depend on
              continued access to capital and on the company’s ability to keep large customers patient through the
              build-and-ship cycle. The 2026 backlog improves confidence, but it does not remove the need for working
              capital, inventory, and factory throughput. Capital access is therefore a live operating dependency, not a
              one-time event. The company cannot assume the current round solves every future funding need. That is the
              core financial constraint. It still needs careful monitoring. It is not solved yet. If the IPO path slips,
              the company will likely need either another private round or some form of strategic financing support.
            claimRefs:
              - CI009
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and system architecture
        blocks:
          - type: paragraph
            body: >-
              Form Energy is selling a grid product, not a lab chemistry. The architecture described in public material
              moves from iron-air cells into modules, then into protected enclosures and grid-scale blocks. That layered
              design matters because it determines how easily the product can be shipped, sited, and scaled. The
              technology pitch is that a utility or data-center buyer can buy long-duration reliability without building
              bespoke infrastructure. In effect, the company is productizing a utility asset rather than a niche battery
              component. That framing matters because it puts Form in the infrastructure category, not the commodity
              cell category.
            claimRefs:
              - CE001
              - CE002
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE010
      - number: '5.2'
        title: Maturity, safety, and controls
        blocks:
          - type: paragraph
            body: >-
              The company appears to have crossed the prototype-to-production boundary, but it still needs real-world
              operating evidence. Construction completion, trial production, and hiring for product-security roles all
              suggest that the product is now being treated like deployed industrial infrastructure. The main diligence
              question is whether the safety and control story holds up once the company ships at volume and operates in
              varied utility environments. That question matters more now because the first failures at scale would be
              expensive and public. If controls are weak, the product becomes much harder to scale.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE006
              - CE009
      - number: '5.3'
        title: Differentiation and dependencies
        blocks:
          - type: paragraph
            body: >-
              Form’s moat rests on more than chemistry. It needs manufacturing know-how, controls, reliability, and
              customer trust to avoid becoming just another interesting battery thesis. Efficiency tradeoffs remain the
              most obvious product weakness, so the company’s best defense is to own a distinct duration niche and prove
              that the system is safe and repeatable at scale. Comparators like Eos show how quickly the market can
              re-rate hardware claims when execution slips. The real test is whether the company can keep improving
              yield, uptime, and field confidence at the same time. That is what turns a chemistry story into a durable
              industrial system. Buyers will notice that distinction. It is the proof point. That matters for buyers.
            claimRefs:
              - CE006
              - CE008
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who buys and why
        blocks:
          - type: paragraph
            body: >-
              Form Energy’s customer base is no longer theoretical. The disclosed projects now span utility pilots,
              large utility-backed off-take, AI/data-center contracts, and an international deployment. That is a
              meaningful shift because it shows the company is not limited to a single buyer persona. The common thread
              is a customer that needs long-duration reliability more than short-duration peak shaving. The buyers care
              about resilience, not about buying another generic battery SKU. That makes contract structure and delivery
              timing more important than a simple product comparison.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and proof quality
        blocks:
          - type: paragraph
            body: >-
              The adoption story is still early but increasingly concrete. Great River Energy began as a pilot, while
              Google/Xcel and Crusoe moved the company toward bankable, multi-GWh commitments. The important diligence
              distinction is that these are still staged projects, not a mature fleet with many years of operating
              history. That means the evidence supports demand, but not yet a fully proven operating base. The signal is
              good, but it still needs operating proof. A few successful projects do not yet equal a repeatable
              installed base. The company still has to prove that the same story works outside the first set of marquee
              names. The customer mix is still evolving. Repeatability is the test. Customer breadth must improve.
            claimRefs:
              - CU005
              - CU007
              - CU009
              - CU010
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU007
      - number: '6.3'
        title: Expansion and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The headline deals are large enough to matter individually, which is both a strength and a risk. If one
              major customer slips, the revenue and manufacturing schedule can move materially. The current public
              record shows enough breadth to believe the market is bigger than a single pilot, but not enough breadth to
              say the backlog is diversified in a way that removes concentration risk. That is the tradeoff between
              growth visibility and customer concentration. It is also why customer diversification remains a key
              diligence metric. The next quarter or two will tell us whether the backlog is broadening. That is the real
              signal.
            claimRefs:
              - CU008
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk register and severity ordering
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risks are not regulatory surprises; they are execution, concentration, and capital
              dependence. Form has to prove that the first systems work, that the factory can deliver on time, and that
              a few giant contracts can be diversified before they dominate the business. If those three things go wrong
              together, the equity story weakens quickly. The risk stack is therefore operational before it is legal.
              That makes execution the most important near-term variable. The company can still win if it keeps shipping
              and supporting projects without surprise setbacks. Discipline is the whole game. That is the only credible
              path.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: Regulatory, operational, and technology risks
        blocks:
          - type: paragraph
            body: >-
              Form does not currently face a headline legal crisis, but it does face ordinary project-development risk:
              permits, interconnect, site work, and a product that has not yet run a full commercial year. Efficiency
              tradeoffs are still a serious talking point in public coverage, so the company must keep proving that its
              duration niche outweighs the costs of a lower-efficiency chemistry. In short, the company is managing a
              normal but demanding industrial ramp. The challenge is to make that ramp look routine rather than fragile.
              Industrial buyers will forgive speed bumps, but not repeated misses. Consistency matters most. The next
              deliveries will be watched closely.
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR011
      - number: '7.3'
        title: Mitigations and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The best mitigation is to ship on time, diversify the backlog, and keep industrial partners aligned. A
              thesis-break would be a slip that turns a giant backlog into delayed revenue while the company burns
              additional capital to keep the factory running. The company can reduce risk, but it cannot eliminate the
              need for flawless execution over the next few years. A single major delivery miss would quickly change the
              narrative. That is why the next milestones matter more than the slide deck. If the factory and projects
              stay on schedule, the risk profile improves quickly. Otherwise, capital pressure rises fast. The downside
              stays real.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR007
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward: Form Energy appears to have product-market pull in the right niche, a large
              backlog, and enough capital to keep scaling. The thesis rests on proof of industrial execution, not just
              on story. If execution continues to improve, the market can forgive a lot of early opacity. The valuation
              rerating would be driven by evidence, not optimism. Capital markets reward proof, not slogans. The
              anti-thesis is equally clear: the company is still early, the financials are opaque, and the latest round
              priced below the prior cycle. On balance this is not a clean buy; it is a track-and-watch name that could
              become far more interesting if execution keeps pace with demand.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
      - number: '8.2'
        title: Valuation framework and comparables
        blocks:
          - type: paragraph
            body: >-
              Public comparables are weak because the business is private, capital intensive, and still pre-scale. The
              best current anchor is the private round itself, supplemented by backlog scale, project conversion, and
              execution milestones. That makes the valuation question less about a precise multiple and more about
              whether the company is shipping hardware fast enough to justify the capital consumed. Until more financial
              disclosure arrives, private-market pricing remains the least-bad anchor. That is why secondary-market
              signals matter even if they are noisy. They provide a reference point when formal financials are absent.
              The signal is directional rather than precise.
            claimRefs:
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV010
      - number: '8.3'
        title: Scenarios and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The bull case depends on turning backlog into revenue with acceptable yields and continued investor
              support. The bear case is a timing slip that forces more dilution before the factory self-funds. Exit
              readiness is still limited because the company has not yet built the long commercial operating history
              that public markets usually reward. The next refresh should focus on shipped megawatts, margins, and any
              new customer concentration changes. Scenario analysis remains more useful than a single-point valuation.
              The range of outcomes is wide enough that a single mark would be misleading. The right question is which
              path the company is most likely to earn. That is the basis for the current track call.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV012
