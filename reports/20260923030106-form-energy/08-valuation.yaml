    "number": 8,
    "title": "Valuation",
    "summary": "Form Energy looks strategically interesting but still execution-heavy, so the current valuation view is track rather than buy until the company proves it can convert backlog into margin and cash."
  },
  "sections": [
    {
      "id": "thesis",
      "title": "Thesis and anti-thesis",
      "body": "The thesis is straightforward: Form Energy appears to have product-market pull in the right niche, a large backlog, and enough capital to keep scaling. The thesis rests on proof of industrial execution, not just on story. If execution continues to improve, the market can forgive a lot of early opacity. The valuation rerating would be driven by evidence, not optimism. Capital markets reward proof, not slogans. The anti-thesis is equally clear: the company is still early, the financials are opaque, and the latest round priced below the prior cycle. On balance this is not a clean buy; it is a track-and-watch name that could become far more interesting if execution keeps pace with demand.",
      "claimRefs": [
        "CV001",
        "CV002",
        "CV003",
        "CV004",
        "CV005"
      ],
      "tableRefs": [
        "TV001"
      ],
      "figureRefs": [
        "FV001"
      ]
    },
    {
      "id": "valuation-framework",
      "title": "Valuation framework and comparables",
      "body": "Public comparables are weak because the business is private, capital intensive, and still pre-scale. The best current anchor is the private round itself, supplemented by backlog scale, project conversion, and execution milestones. That makes the valuation question less about a precise multiple and more about whether the company is shipping hardware fast enough to justify the capital consumed. Until more financial disclosure arrives, private-market pricing remains the least-bad anchor. That is why secondary-market signals matter even if they are noisy. They provide a reference point when formal financials are absent. The signal is directional rather than precise.",
      "claimRefs": [
        "CV006",
        "CV010",
        "CV011"
      ],
      "tableRefs": [
        "TV002"
      ]
    },
    {
      "id": "scenarios",
      "title": "Scenarios and exit readiness",
      "body": "The bull case depends on turning backlog into revenue with acceptable yields and continued investor support. The bear case is a timing slip that forces more dilution before the factory self-funds. Exit readiness is still limited because the company has not yet built the long commercial operating history that public markets usually reward. The next refresh should focus on shipped megawatts, margins, and any new customer concentration changes. Scenario analysis remains more useful than a single-point valuation. The range of outcomes is wide enough that a single mark would be misleading. The right question is which path the company is most likely to earn. That is the basis for the current track call.",
      "claimRefs": [
        "CV007",
        "CV008",
        "CV009",
        "CV012"
      ],
      "tableRefs": [
        "TV003"
      ]
    }
  ],
