    "number": 6,
    "title": "Customers",
    "summary": "Form Energy’s customer base is shifting from a pilot utility into a mix of utilities, hyperscalers, and AI infrastructure buyers, but the backlog is still concentrated in a few very large projects."
  },
  "sections": [
    {
      "id": "customer-base",
      "title": "Who buys and why",
      "body": "Form Energy’s customer base is no longer theoretical. The disclosed projects now span utility pilots, large utility-backed off-take, AI/data-center contracts, and an international deployment. That is a meaningful shift because it shows the company is not limited to a single buyer persona. The common thread is a customer that needs long-duration reliability more than short-duration peak shaving. The buyers care about resilience, not about buying another generic battery SKU. That makes contract structure and delivery timing more important than a simple product comparison.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU004",
        "CU006"
      ],
      "tableRefs": [
        "TU001"
      ],
      "figureRefs": [
        "FU001"
      ]
    },
    {
      "id": "adoption",
      "title": "Adoption trajectory and proof quality",
      "body": "The adoption story is still early but increasingly concrete. Great River Energy began as a pilot, while Google/Xcel and Crusoe moved the company toward bankable, multi-GWh commitments. The important diligence distinction is that these are still staged projects, not a mature fleet with many years of operating history. That means the evidence supports demand, but not yet a fully proven operating base. The signal is good, but it still needs operating proof. A few successful projects do not yet equal a repeatable installed base. The company still has to prove that the same story works outside the first set of marquee names. The customer mix is still evolving. Repeatability is the test. Customer breadth must improve.",
      "claimRefs": [
        "CU005",
        "CU007",
        "CU009",
        "CU010",
        "CU012"
      ],
      "tableRefs": [
        "TU002"
      ]
    },
    {
      "id": "concentration",
      "title": "Expansion and concentration risk",
      "body": "The headline deals are large enough to matter individually, which is both a strength and a risk. If one major customer slips, the revenue and manufacturing schedule can move materially. The current public record shows enough breadth to believe the market is bigger than a single pilot, but not enough breadth to say the backlog is diversified in a way that removes concentration risk. That is the tradeoff between growth visibility and customer concentration. It is also why customer diversification remains a key diligence metric. The next quarter or two will tell us whether the backlog is broadening. That is the real signal.",
      "claimRefs": [
        "CU008",
        "CU011",
        "CU012"
      ],
      "tableRefs": [
        "TU003"
      ]
    }
  ],
