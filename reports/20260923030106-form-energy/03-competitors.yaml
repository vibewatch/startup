    "number": 3,
    "title": "Competitors",
    "summary": "Form Energy competes against incumbents, substitutes, and new long-duration entrants, but its most durable advantage is still the 100-hour duration niche rather than a static moat."
  },
  "sections": [
    {
      "id": "landscape",
      "title": "Competitive landscape",
      "body": "Form Energy sits in a market that is not a pure one-versus-one competition. Short-duration lithium-ion, other long-duration chemistries, and utility-side alternatives all sit in the decision set. The practical question for buyers is not whether batteries exist, but which technology can solve a multi-day reliability problem at an acceptable cost, with acceptable safety and bankability. That keeps the competitive set broad even when Form’s 100-hour duration is highly distinctive. The key point is that the category is being shaped by customer need, not by a single dominant incumbent. The market is still forming. That makes substitution analysis as important as direct competitor analysis. The key point is that the category is being shaped by customer need, not by a single dominant incumbent. The market is still forming.",
      "claimRefs": [
        "CP001",
        "CP002",
        "CP008"
      ],
      "tableRefs": [
        "TP001"
      ],
      "figureRefs": [
        "FP001"
      ]
    },
    {
      "id": "differentiation",
      "title": "Why Form still looks different",
      "body": "The strongest differentiators remain duration, chemistry, and industrial execution. Form’s own materials emphasize low-cost iron, water, and air; the market commentary underscores that the company is selling bankability in a new duration bucket rather than trying to out-muscle lithium-ion on short-duration economics. The ArcelorMittal relationship adds a materials-supply angle that most pure software or short-duration battery companies do not have. That combination gives Form a clearer story than most peers, even if the story still depends on execution. It also means the moat is partly industrial, not just chemical. That matters for buyers.",
      "claimRefs": [
        "CP003",
        "CP004",
        "CP011",
        "CP012"
      ],
      "tableRefs": [
        "TP002"
      ]
    },
    {
      "id": "moat-risk",
      "title": "Moat durability and erosion paths",
      "body": "The moat is real but not permanent. It depends on the company continuing to convert chemistry into manufacturing scale, and on customers deciding that duration and site flexibility matter more than lithium-ion’s improving economics. If cheaper short-duration storage, utility upgrades, or another entrant solve the same grid problem, the moat compresses. That is why the current competitive edge should be treated as execution-dependent rather than chemistry-only. In other words, the moat is a moving target, not a fixed wall. The next refresh should care as much about delivery evidence as chemistry claims. Timing still matters.",
      "claimRefs": [
        "CP005",
        "CP006",
        "CP007",
        "CP008",
        "CP009",
        "CP010"
      ],
      "tableRefs": [
        "TP003"
      ]
    }
  ],
