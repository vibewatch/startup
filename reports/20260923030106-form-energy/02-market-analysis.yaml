    "title": "Market Analysis",
    "summary": "Form Energy sits in a real but still-forming long-duration storage market where utility reliability, AI load growth, and international grid constraints are creating the first bankable demand clusters."
  },
  "sections": [
    {
      "id": "market-framing",
      "title": "Market framing and customer job-to-be-done",
      "body": "Form Energy is not trying to win the entire storage stack; it is aiming at the multi-day reliability problem that appears when renewable generation, AI load growth, and constrained grids collide. The public record points to a buyer set that spans utilities, grid operators, and large corporate offtakers, with data centers now standing beside utilities as a demand anchor. That means the category is best understood as long-duration energy storage for firming, resilience, and capacity deferral rather than generic battery capacity. The niche matters because the company only has to win the part of the market that truly needs 100-hour duration. That focus narrows the market and makes project economics easier to reason about.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM003",
        "CM010"
      ],
      "tableRefs": [
        "TM001"
      ],
      "figureRefs": [
        "FM001"
      ]
    },
    {
      "id": "sizing-and-adoption",
      "title": "Sizing lenses and adoption constraints",
      "body": "The current evidence does not support one clean TAM number. Instead, the more defensible approach is to use constrained lenses: grid-reliability spend, utility replacement of retiring thermal assets, and AI/data-center resiliency demand. Adoption is slowed by capital intensity, interconnection, and procurement timelines, but the 2026 project slate suggests that the market is already moving from pilot curiosity toward bankable commercial procurement. That makes the right question less about whether the category exists and more about which customer segment becomes the dominant first mover. The backlog itself is now a proxy for real demand, even if it is not a market-size forecast. In practice, the market is being assembled project by project.",
      "claimRefs": [
        "CM004",
        "CM005",
        "CM006",
        "CM007",
        "CM008",
        "CM009",
        "CM011"
      ],
      "tableRefs": [
        "TM002"
      ]
    },
    {
      "id": "implications",
      "title": "What the market implies for diligence",
      "body": "For diligence purposes, the market should be treated as real but still forming. The key open issue is not whether multi-day storage is useful; it is how fast utilities, hyperscalers, and regulators can turn that usefulness into signed, financeable projects. The answer drives both near-term revenue timing and the size of the install base Form Energy can reach before the next financing cycle. If the largest projects keep converting, the company’s niche becomes easier to defend. The next refresh should watch whether project announcements become shipped megawatts.",
      "claimRefs": [
        "CM008",
        "CM009",
        "CM011",
        "CM012"
      ],
      "tableRefs": [
        "TM003"
      ]
    }
  ],
