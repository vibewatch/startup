evidenceGaps:
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Current audited revenue, burn, and gross margin data
    whyItMatters: Those figures determine how quickly the company can turn backlog into durable economics.
    diligencePath: Request management financials or a lender-ready model covering 2026-2028.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam
    missingEvidence: A credible third-party market-sizing study for multi-day storage in 2026
    whyItMatters: Without it, the chapter can only defend constrained sizing lenses rather than a single market number.
    diligencePath: Pull a utility or analyst market-sizing study and triangulate it against disclosed project commitments.
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Audited revenue, burn, gross margin, and runway data
    whyItMatters: Those inputs determine dilution risk and how quickly the factory can self-fund.
    diligencePath: Request management accounts, customer payment schedules, and capex forecasts.
  - type: missing-source
    severity: minor
    topic: security
    missingEvidence: A public security or controls audit for the deployed factory/software stack
    whyItMatters: The system is moving from engineering to operations, so controls quality matters more over time.
    diligencePath: Request a summary of factory cyber, quality, and safety certifications.
  - type: missing-source
    severity: material
    topic: retention
    relatedTableRefs:
      - TU003
    missingEvidence: Customer retention, renewals, or NRR-style data
    whyItMatters: >-
      A handful of giant projects can look strong even if repeatability is weak. The customer lens therefore needs to
      stay skeptical about concentration until repeat orders and service history become visible. That is the gap between
      headline demand and durable demand.
    diligencePath: Request customer references, delivery milestones, and renewal/conversion expectations.
  - type: missing-source
    severity: minor
    topic: security
    relatedTableRefs:
      - TR001
    missingEvidence: A public factory cyber / quality audit
    whyItMatters: The manufacturing system is becoming operationally important enough to justify a controls review.
    diligencePath: Request a summary of factory safety, quality, and security audits.
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: A current 409A, secondary price, or new financing after Series G
    whyItMatters: Without a fresh mark, the valuation view rests on the latest private round and commentary.
    diligencePath: Request the latest cap table mark and any secondary trading evidence.
