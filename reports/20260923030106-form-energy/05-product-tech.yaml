    "number": 5,
    "title": "Product & Technology",
    "summary": "Form Energy’s product is a modular 100-hour iron-air system that now looks manufacturable, but it still has to prove safety, efficiency, and repeatable field reliability at scale."
  },
  "sections": [
    {
      "id": "architecture",
      "title": "Product and system architecture",
      "body": "Form Energy is selling a grid product, not a lab chemistry. The architecture described in public material moves from iron-air cells into modules, then into protected enclosures and grid-scale blocks. That layered design matters because it determines how easily the product can be shipped, sited, and scaled. The technology pitch is that a utility or data-center buyer can buy long-duration reliability without building bespoke infrastructure. In effect, the company is productizing a utility asset rather than a niche battery component. That framing matters because it puts Form in the infrastructure category, not the commodity cell category.",
      "claimRefs": [
        "CE001",
        "CE002",
        "CE007"
      ],
      "tableRefs": [
        "TE001"
      ],
      "figureRefs": [
        "FE001"
      ]
    },
    {
      "id": "maturity-and-controls",
      "title": "Maturity, safety, and controls",
      "body": "The company appears to have crossed the prototype-to-production boundary, but it still needs real-world operating evidence. Construction completion, trial production, and hiring for product-security roles all suggest that the product is now being treated like deployed industrial infrastructure. The main diligence question is whether the safety and control story holds up once the company ships at volume and operates in varied utility environments. That question matters more now because the first failures at scale would be expensive and public. If controls are weak, the product becomes much harder to scale.",
      "claimRefs": [
        "CE003",
        "CE004",
        "CE005",
        "CE009",
        "CE010",
        "CE011"
      ],
      "tableRefs": [
        "TE002"
      ]
    },
    {
      "id": "moat-and-dependencies",
      "title": "Differentiation and dependencies",
      "body": "Form’s moat rests on more than chemistry. It needs manufacturing know-how, controls, reliability, and customer trust to avoid becoming just another interesting battery thesis. Efficiency tradeoffs remain the most obvious product weakness, so the company’s best defense is to own a distinct duration niche and prove that the system is safe and repeatable at scale. Comparators like Eos show how quickly the market can re-rate hardware claims when execution slips. The real test is whether the company can keep improving yield, uptime, and field confidence at the same time. That is what turns a chemistry story into a durable industrial system. Buyers will notice that distinction. It is the proof point. That matters for buyers.",
      "claimRefs": [
        "CE006",
        "CE008",
        "CE012"
      ],
      "tableRefs": [
        "TE003"
      ]
    }
  ],
