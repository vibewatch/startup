      - number: '5.2'
        title: 成熟度、安全与控制
        blocks:
          - type: paragraph
            body: >-
              公司似乎已经跨过原型到生产的边界，但仍需要真实世界运行证据。建设完工、试生产，以及招聘产品安全岗位都表明，产品如今被当作已部署的工业基础设施来管理。主要尽调问题是，当公司大规模发货并在不同公用事业环境中运行时，安全和控制叙事能否站住。这个问题现在更重要，因为规模化后的首次故障会昂贵且公开。如果控制薄弱，产品规模化会难得多。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE006
              - CE009
      - number: '5.3'
        title: 差异化与依赖
        blocks:
          - type: paragraph
            body: >-
              Form
              的护城河不止化学路线。它需要制造诀窍、控制、可靠性和客户信任，才能避免变成另一个有趣的电池论点。效率取舍仍是最明显的产品弱点，因此公司最好的防线是守住一个清晰的时长细分，并证明系统在规模化下安全且可重复。Eos
              这类可比公司显示，一旦执行失手，市场会多快重估硬件主张。真正的考验是，公司能否同时提升良率、正常运行时间和现场信心。这才会把化学故事变成耐久的工业系统。买家会看见这个区别。这就是证明点。它对买家很重要。
            claimRefs:
              - CE006
              - CE008
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE011
