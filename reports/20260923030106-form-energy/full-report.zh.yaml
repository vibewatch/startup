    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与商业姿态
        blocks:
          - type: paragraph
            body: >-
              Form Energy 是一家后期私营电网储能公司，核心是 100 小时铁空气电池。公司已从实验室概念走到位于 Weirton, West Virginia 的 Form Factory 1 工厂生产，总部仍在
              Somerville, Massachusetts。眼下的故事不只是技术新意：公开记录的重心已经变成有资金支持的制造爬坡、以数十 GWh
              计的在手订单，以及仍在从试点转为运营资产的首个商业系统。这个组合让公司更像一家扩张期公司，而不是成熟的公用事业供应商。
