              - CM008
      - number: '2.2'
        title: 规模测算视角与采用约束
        blocks:
          - type: paragraph
            body: >-
              现有证据不支持一个干净的 TAM 数字。更稳妥的方法是使用受约束的视角：电网可靠性支出、公用事业替代退役火电资产，以及 AI / 数据中心韧性需求。资本强度、并网和采购周期都会拖慢采用，但 2026
              年的项目清单显示，市场已经从试点好奇走向可融资的商业采购。因此，正确的问题不再是这个品类是否存在，而是哪类客户会成为占主导的第一批行动者。在手订单本身如今就是实际需求的代理指标，即便它不是市场规模预测。实际情况是，市场正在一个项目一个项目地拼出来。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: 市场对尽调的含义
        blocks:
          - type: paragraph
            body: >-
              尽调时，应把这个市场视为真实存在但仍在成形。关键未决问题不是多日储能是否有用，而是公用事业公司、超大规模云厂商和监管机构能多快把这种有用性变成已签约、可融资的项目。答案决定近期收入节奏，也决定 Form
              Energy 在下一轮融资周期前能触达多大的安装基数。如果最大项目持续转化，公司的细分位势会更容易守住。下一次刷新应关注项目公告是否变成已发货 MW。
