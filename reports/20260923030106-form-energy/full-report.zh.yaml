figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Form Energy 从成立走向商业化制造，靠的是连续融资、建厂，以及 2026 年积压订单跃升。
    data:
      items:
        - date: '2017'
          label: 成立
          detail: 公司围绕多日储能和铁空气化学体系成立。
          tone: neutral
        - date: 2021-07
          label: Series D / ArcelorMittal 合作
          detail: 公司宣布战略工业背书和材料合作。
          tone: positive
        - date: 2022-09
          label: Series E / Weirton 决策
          detail: 大额融资支持首座工厂和商业化。
          tone: positive
        - date: 2024-10
          label: Series F 与试生产
          detail: 工厂建设和试生产把公司推入制造阶段。
          tone: neutral
        - date: 2026-08
          label: Series G 与积压订单跃升
          detail: 据报道，公司获得新融资、引入新高管，并有 >80 GWh 积压订单。
          tone: positive
        - date: 2026-09
          label: 招聘冲刺
          detail: 工厂向商业化产出爬坡，Weirton 招聘同步扩大。
          tone: neutral
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO008
      - CO009
  - id: FM001
    title: 市场需求栈
    type: kpi
    summary: 这个市场最好拆成三层看：公用事业可靠性、AI / 数据中心需求，以及国际电网约束用例。
    data:
      items:
        - label: 公用事业可靠性
          value: Core
          detail: 退役火电容量和电网保供是基础层。
          tone: positive
        - label: AI / 数据中心
          value: Rising
