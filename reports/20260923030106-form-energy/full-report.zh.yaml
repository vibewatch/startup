      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Form 制造的是硬件，不是发货软件，因此未来几年取决于持续获得资本，也取决于公司能否让大客户在建造与交付周期中保持耐心。2026
              年在手订单提升了信心，但没有消除营运资本、库存和工厂吞吐的需求。因此，资本获取是仍在发挥作用的运营依赖，不是一次性事件。公司不能假设当前轮次解决所有未来融资需求。这是核心财务约束，仍需仔细跟踪，尚未解决。如果
              IPO 路径延后，公司很可能需要另一轮私募，或某种战略融资支持。
