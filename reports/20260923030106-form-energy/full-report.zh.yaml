      - number: '3.2'
        title: 为什么 Form 仍然显得不同
        blocks:
          - type: paragraph
            body: >-
              最强差异化仍是时长、化学路线和工业执行。Form 自身材料强调低成本的铁、水和空气；市场评论则突出，公司卖的是一个新时长区间里的可融资性，而不是试图在短时时长经济性上硬拼锂离子。ArcelorMittal
              关系又带来材料供应角度，这是多数纯软件公司或短时电池公司不具备的。这个组合让 Form 的故事比大多数同行更清楚，即便这个故事仍取决于执行。它也意味着护城河一部分来自工业能力，而不只是化学路线。这对买家很重要。
            claimRefs:
              - CP003
              - CP004
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP012
      - number: '3.3'
        title: 护城河耐久度与侵蚀路径
        blocks:
          - type: paragraph
            body: >-
              护城河真实存在，但并非永久。它取决于公司能否持续把化学路线转化为制造规模，也取决于客户是否认定时长和选址灵活性比锂离子不断改善的经济性更重要。如果更便宜的短时储能、公用事业升级，或其他进入者解决了同一个电网问题，护城河就会被压缩。因此，当前竞争优势应被视为依赖执行，而不是只靠化学路线。换句话说，护城河是移动靶，不是固定高墙。下一次刷新要像关注化学主张一样关注交付证据。时间点仍然重要。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP011
  - number: 4
