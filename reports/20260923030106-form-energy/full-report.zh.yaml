      - number: '6.2'
        title: 采用轨迹与证据质量
        blocks:
          - type: paragraph
            body: >-
              采用故事仍处早期，但越来越具体。Great River Energy 起步于试点，而 Google / Xcel 和 Crusoe 把公司推向可融资的多 GWh
              承诺。重要的尽调区别在于，这些仍是分阶段项目，不是已经拥有多年运行历史的成熟机组群。这意味着证据支持需求，但还不足以证明运营基数已经完全跑通。信号不错，但仍需要运行证明。少数成功项目尚不等于可复制的装机基数。公司还要证明，同样的故事能在首批明星客户之外跑通。客户组合仍在演化。可重复性才是考验。客户宽度必须改善。
