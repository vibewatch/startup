            body: >-
              创始团队技术底色少见地强，而且仍在公司叙事中清晰可见：Mateo Jaramillo、Yet-Ming Chiang、Ted Wiley、Billy Woodford 和 Marco Ferrara
              出现在公司与合作伙伴材料中。2026 年，公司补强管理层，引入 CFO Navneet Govil 和 COO Wes Sloan，支撑制造规模化以及可能的 IPO 路径。所有权由顶级气候与工业投资者锚定，包括
              T. Rowe Price、GE Vernova、Breakthrough Energy、Engine Ventures、ArcelorMittal
              以及其他多次跟投方。这个组合重要，因为它给公司的不只是资金，还有工业验证。
