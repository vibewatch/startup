      - number: '4.2'
        title: 收入节奏与变现
        blocks:
          - type: paragraph
            body: >-
              最好的公开证据显示，Form 仍处在收入确认的前沿阶段。管理层和第三方文章都指向 2026
              年出现首批有意义收入，但收入模型本身仍是项目制且不透明。这意味着从在手订单到确认收入的转化可能会很不均匀，并拉长到多年。承销时，关键未知数是毛利率、安装时点，以及系统交付前后分别有多少客户付款。落到实处，公司仍需要把公告变成发票。也就是说，转化速度和在手订单规模同样重要。
