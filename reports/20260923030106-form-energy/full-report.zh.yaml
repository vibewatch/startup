              刷新后的事实图景仍像一家资本密集型扩张期公司，而不是成熟运营企业。公开来源一致指向超过 $2B
              的股权融资，以及最新一轮中的估值重定价，但没有披露足够详细的当前收入、毛利率、现金消耗或客户集中度，无法按稳态业务来承销。缺失的信息很关键，因为公司现在要在未来几年把大额订单转化为已发货硬件和确认收入。换句话说，上行空间可信，但承销仍卡在执行。所以下方利益相关方地图只能作为方向性判断，而不是定论。时间点仍然重要。
