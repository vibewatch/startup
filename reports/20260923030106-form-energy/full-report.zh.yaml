      - number: '6.3'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              头部交易大到单笔就足以影响公司，这既是优势也是风险。如果一个大客户延误，收入和制造排期都可能出现实质变化。当前公开记录显示的宽度足以让人相信市场大于单一试点，但还不足以说明在手订单已经分散到可以消除集中度风险。这就是增长可见性与客户集中度之间的取舍。也正因如此，客户多元化仍是关键尽调指标。未来一两个季度会告诉我们在手订单是否在变宽。这才是真正信号。
            claimRefs:
              - CU008
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险清单与严重性排序
        blocks:
          - type: paragraph
            body: >-
              严重性最高的风险不是监管意外，而是执行、集中度和资本依赖。Form
              必须证明首批系统能够运行、工厂能够按时交付，并在少数巨型合同主导业务之前实现多元化。如果这三件事同时出错，股权故事会快速走弱。因此，风险栈首先是运营问题，其次才是法律问题。这让执行成为近期最重要变量。只要公司持续发货并支持项目、没有意外挫折，它仍然可以赢。纪律就是整场游戏。这是唯一可信路径。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 监管、运营与技术风险
        blocks:
          - type: paragraph
            body: >-
              Form
              目前没有面临醒目的法律危机，但确实面临普通项目开发风险：许可、并网、现场施工，以及一款尚未跑满一个商业年度的产品。效率取舍仍是公开报道中的严肃议题，所以公司必须持续证明，它的时长细分足以抵消较低效率化学路线的成本。简言之，公司正在管理一次正常但要求很高的工业爬坡。挑战在于让这次爬坡看起来常规，而不是脆弱。工业买家会原谅小颠簸，但不会原谅反复失手。一致性最重要。下一批交付会被密切观察。
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR011
      - number: '7.3'
        title: 缓释措施与推翻论点的触发点
        blocks:
          - type: paragraph
            body: >-
              最好的缓释措施是按时发货、分散在手订单，并让工业伙伴保持一致。推翻论点的情形，是一次延误把巨大的在手订单变成递延收入，同时公司还要烧更多资本维持工厂运转。公司可以降低风险，但无法消除未来几年必须无瑕执行的要求。一次重大交付失误就会快速改变叙事。因此，下一批里程碑比幻灯片更重要。如果工厂和项目按期推进，风险画像会很快改善。否则，资本压力会迅速上升。下行风险仍然真实存在。
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              正向论点很直接：Form Energy
              似乎在正确细分中拥有产品市场拉力、庞大在手订单，以及足够继续扩张的资本。这个论点立在工业执行证明上，而不只是故事上。如果执行持续改善，市场可以原谅很多早期不透明。估值重评会由证据驱动，不是由乐观情绪驱动。资本市场奖励证明，不奖励口号。反向论点同样清楚：公司仍处早期，财务不透明，最新一轮定价低于上一周期。综合来看，这不是一个干净的买入标的；它是一个值得跟踪观察的名字，如果执行继续跟上需求，吸引力可能会高得多。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV012
      - number: '8.2'
        title: 估值框架与可比公司
        blocks:
          - type: paragraph
            body: >-
              公开可比公司很弱，因为这家公司是私营、资本密集，且仍未规模化。当前最好的锚点是私募轮次本身，再辅以在手订单规模、项目转化和执行里程碑。因此，估值问题与其说是精确倍数，不如说是公司发货硬件的速度是否足以证明所消耗资本的合理性。在更多财务披露出现之前，私募市场定价仍是最不坏的锚点。也正因如此，二级市场信号即便噪声很大也值得看。在正式财务数据缺失时，它们提供参考点。这个信号是方向性的，不是精确值。
            claimRefs:
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV010
      - number: '8.3'
        title: 情景与退出准备度
        blocks:
          - type: paragraph
            body: >-
              牛市情景取决于把在手订单转化为收入，同时保持可接受良率和持续投资者支持。熊市情景是时间延误，在工厂自我供血之前迫使公司进一步稀释。退出准备度仍有限，因为公司尚未建立公开市场通常奖励的长期商业运行历史。下一次刷新应关注已发货
              MW、利润率，以及任何新的客户集中度变化。情景分析仍比单点估值更有用。结果区间足够宽，单一估值标记会误导。正确问题是公司最可能走出哪条路径。这就是当前跟踪判断的基础。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV008
              - CV012
