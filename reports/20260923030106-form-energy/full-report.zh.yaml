  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品与系统架构
        blocks:
          - type: paragraph
            body: >-
              Form Energy
              卖的是电网产品，不是实验室化学路线。公开材料描述的架构从铁空气电芯推进到模组，再到受保护外壳和电网级区块。这种分层设计很重要，因为它决定产品有多容易运输、选址和扩展。技术主张是，公用事业或数据中心买家无需建设定制基础设施，就能购买长时可靠性。实际上，公司是在把一种公用事业资产产品化，而不是销售小众电池部件。这个框架重要，因为它把
              Form 放进基础设施类别，而不是商品化电芯类别。
            claimRefs:
              - CE001
              - CE002
              - CE007
