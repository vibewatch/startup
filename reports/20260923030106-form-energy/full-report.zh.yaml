    sections:
      - number: '4.1'
        title: 融资时间线与资本姿态
        blocks:
          - type: paragraph
            body: >-
              公开记录显示出典型的重资本开支融资画像：2024 年大型 Series F、2026 年更大的 Series G，以及累计超过 $2B 的股权融资。这些资本用于建设 Form Factory
              1、拉动早期生产，并支撑商业化过渡。尽调中更重要的一点是，最新融资之后业务仍在消耗资本；融资故事因此关乎跑道和执行，而不只是轮次金额的标题。资产负债表重要，因为硬件爬坡消耗现金的速度常常快过叙事动能暗示的速度。
