  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场框架与客户要完成的任务
        blocks:
          - type: paragraph
            body: >-
              Form Energy 并不想拿下整个储能栈；它瞄准的是可再生发电、AI
              负荷增长和受限电网相撞后出现的多日可靠性问题。公开记录显示，买家横跨公用事业公司、电网运营商和大型企业承购方，数据中心如今也站到公用事业旁边，成为需求锚点。因此，这个品类更应理解为用于稳供、韧性和容量投资递延的长时储能，而不是泛化的电池容量。这个细分很重要，因为公司只需要赢下真正需要
              100 小时时长的那部分市场。聚焦让市场范围变窄，也让项目经济性更容易判断。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
