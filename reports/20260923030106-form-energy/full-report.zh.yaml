    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争环境
        blocks:
          - type: paragraph
            body: >-
              Form Energy
              所处的市场不是纯粹的一对一竞争。短时锂离子、其他长时化学路线以及公用事业侧替代方案都在决策集合里。买家的实际问题不是电池是否存在，而是哪种技术能以可接受成本、可接受安全性和可融资性解决多日可靠性问题。因此，即便
              Form 的 100
              小时时长高度独特，竞争集合仍然很宽。关键在于，品类由客户需求塑造，而不是由单一主导在位者定义。市场仍在成形。这让替代分析和直接竞争分析一样重要。关键在于，品类由客户需求塑造，而不是由单一主导在位者定义。市场仍在成形。
