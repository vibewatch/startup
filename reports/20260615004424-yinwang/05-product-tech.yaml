- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Yinwang solution
  - Measurable benefit
  - Limitation
  rows:
  - - Urban assisted driving
    - Driver supervises route following, lane changes, and hazard response
    - ADS 5 with WEWA 2.0 and world-action decisioning
    - Huawei says collision risk can drop 50% via safety-risk-field logic
    - Still marketed as assisted driving and requires human supervision
  - - Parking and door-to-door navigation
    - Driver searches for spaces, pays, charges, and re-enters route manually
    - Parking-space-to-parking-space 3.0 plus parking payment and charger discovery
    - Official roadmap targets 300k parking lots and 1.8m chargers in the service loop
    - Availability depends on geography, ecosystem partners, and vehicle support
  - - Cabin interaction and infotainment
    - Touchscreen, voice, and app switching handled separately
    - HarmonySpace 6 with Xiaoyi agent and multimodal sensing
    - Cross-domain conversational interaction and larger media surfaces
    - No public evidence yet on standardized OEM adoption depth by brand
  - - Ride, handling, and stability control
    - Traditional chassis domains tuned more independently
    - XMC / XMotion Control on iDVP
    - Huawei claims 30% better control precision and 50% less vibration in complex scenes
    - Performance claims are vendor-reported, not publicly benchmarked by third parties
  - - Fleet and owner lifecycle service
    - Post-sale diagnostics and updates are fragmented across OEM tools
    - Vehicle cloud for OTA, digital key, remote diagnosis, and part monitoring
    - Creates a full-lifecycle service hook after SOP
    - No public reliability or ticket-resolution metrics
  - - OEM program launch
    - Automaker integrates multiple suppliers over long validation cycles
    - Stacked integration across ADS, cockpit, control, optics, and cloud
    - Huawei says a new model match can happen in roughly 6-9 months
    - Public evidence does not reveal how much integration work is borne by the OEM
  notes: Benefit cells use public vendor or media-reported claims and should be treated as directional unless a third-party benchmark is cited.
