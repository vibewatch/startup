  evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-economics
    missingEvidence: Public pricing, take-rate, licensing, or revenue-share mechanics for ADS, cockpit, control, cloud, or bundled stack sales.
    whyItMatters: Without per-module economics, it is impossible to translate deployment breadth into gross-margin or monetization quality judgments.
    diligencePath: Request OEM-facing commercial schedules, attach-rate assumptions, and sample deal structures by module and by bundled program.
    relatedQuestionRefs:
    - QE023
  - type: missing-source
    severity: material
    topic: field-reliability
    missingEvidence: Model-level uptime, disengagement, intervention, incident, or recall-style reliability disclosure for Yinwang-enabled systems.
    whyItMatters: Public mileage and app-scale numbers do not show whether reliability is uniform across OEM programs, trims, or software versions.
    diligencePath: Request internal reliability dashboards, incident taxonomies, OTA rollback rates, and per-program safety-review packs.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: cybersecurity-assurance
    missingEvidence: The underlying cybersecurity white paper, third-party test results, control mappings, and any certification or penetration-test details.
    whyItMatters: A white-paper announcement is a governance signal, but underwriting trust requires auditable control evidence and scope boundaries.
    diligencePath: Request the full white paper, third-party assessment reports, incident-response architecture, and certification inventory by module.
    relatedQuestionRefs:
    - QE025
  - type: missing-source
    severity: minor
    topic: sku-hardware-bom
    missingEvidence: Per-model sensor, compute, and redundancy BOMs for the different ADS and cockpit configurations sold across OEMs.
    whyItMatters: Hardware variation can materially change both capability and liability, especially when official pages already warn that feature availability differs by model.
    diligencePath: Request homologation packs and configuration matrices mapping hardware to enabled features and fallback behavior.
  - type: stale
    severity: material
    topic: l3-l4-approval-scope
    missingEvidence: A current matrix of cities, models, operating domains, and legal conditions for 2026 L3 and L4 pilots.
    whyItMatters: Roadmap value depends on where and under what rules higher automation can actually ship, not just on vendor aspirations.
    diligencePath: Re-pull municipal pilot rules, OEM model filings, and insurance/liability frameworks each refresh cycle; cross-check against program launch timing.
