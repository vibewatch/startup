company:
  name: Yinwang
chapter:
  number: 5
  title: Product & Technology
  summary: 'Yinwang is commercializing Huawei''s automotive stack as a multi-module platform rather than a

    single ADAS SKU: public evidence shows Qiankun ADS 5, HarmonySpace 6, iDVP-based vehicle

    control, optics, and vehicle-cloud services packaged for many OEM programs. The strongest

    positives are unusually deep technical integration claims, broadening OEM deployment, and a

    visible 2026-2028 roadmap toward higher automation; the main diligence blockers are missing

    public pricing, sparse third-party reliability disclosure by model, and unresolved compliance

    detail around L3/L4 approvals, cybersecurity assurance, and field accountability.'
sections:
- id: solution-scope-and-customer-jobs
  title: Solution scope and customer jobs
  body: 'Yinwang''s public surface is notable because it sells an automotive solution family, not one

    isolated assisted-driving feature. The company homepage and Huawei automotive portal both

    describe a stack spanning Qiankun ADS intelligent driving, HarmonySpace cockpit,

    vehicle-control modules, vehicle optics, and vehicle-cloud lifecycle services. In customer

    workflow terms, that means the platform tries to cover sensing and decisioning during motion,

    cabin interaction while people ride, chassis control while the car executes, and OTA,

    diagnostics, and remote services after delivery. HarmonySpace 6 widens the proposition beyond

    infotainment by adding occupant sensing, agentic interaction, and in-cabin media surfaces,

    while the cloud layer adds digital-key, remote-control, OTA, and remote-diagnostic hooks that

    matter to automakers after SOP rather than only at vehicle launch. The implication for

    diligence is positive on attach-rate potential but negative on complexity: buyers are not

    evaluating one module but a suite whose commercial success depends on whether OEMs can adopt a

    coherent stack without over-customizing every layer.'
