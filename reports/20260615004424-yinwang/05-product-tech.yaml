- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / requirement
  - Status
  - Scope
  - Gap
  rows:
  - - Assisted-driving disclaimer
    - Explicit on Huawei and Yinwang official pages
    - States current passenger-car ADS cannot replace the driver and may not handle all conditions
    - No public evidence on how consistently dealers and sales channels transmit the same warning
  - - Model / OTA capability caveat
    - Explicit on official pages
    - States some features differ by model or require later OTA enablement
    - No public matrix of feature availability by OEM and trim
  - - MIIT marketing guidance (Apr 2025)
    - Active external constraint
    - Pushes automakers toward assisted-driving terminology and disclosure of risks and limitations
    - Final enforcement mechanics and penalties are not fully public in the reviewed corpus
  - - ADAS safety-rule drafting (Jun 2025)
    - In process during 2025
    - Huawei and Dongfeng participated in drafting safety requirements
    - Draft-to-final standard deltas and timelines remain uncertain
  - - Mandatory L2 safety-standard consultation (Sep 2025)
    - Public consultation opened
    - Moves toward national safety requirements for combined driving-assistance systems
    - Public sources do not spell out module-by-module consequences for existing Yinwang programs
  - - Industry safety initiative and training
    - Huawei-led pact with 11 carmakers
    - Calls for transparent marketing, user education, and standards development
    - It is a governance signal, not proof of lower incident rates
  - - Cybersecurity white paper
    - Officially released in Oct 2025 with customers and testing partners
    - Suggests ecosystem attention to connected-vehicle security
    - The reviewed corpus does not include the white paper body or an auditable control matrix
  - - In-cabin occupant sensing
    - Launched with HarmonySpace 6
    - AMS can sense passenger posture and even breathing-related chest movement for rescue context
    - No public third-party safety validation or privacy-impact disclosure
  notes: The strongest public trust evidence is on disclaimers, rulemaking awareness, and governance initiatives; the weakest is on auditable third-party assurance by model, module, or release train.
