- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Sensor and perception inputs
    - Capture road, obstacle, occupant, and vehicle-state data
    - OEM sensor package, calibration, and packaging choices
    - Capability differs by vehicle hardware; official pages warn sensor mix can vary by model
  - - On-vehicle compute platform
    - Runs fused perception, planning, cockpit AI, and control tasks
    - Thermal, cost, and EE-architecture budgets set by OEM
    - Public pages do not disclose compute BOM or fail-operational design by SKU
  - - Cloud world engine
    - Generates difficult scenes and supports online reinforcement learning
    - Data loops, simulation quality, and training infrastructure
    - Hard to verify external performance from public materials alone
  - - World-action / behavior model
    - Converts scene understanding into driving actions
    - Quality of training data and validation edge cases
    - Architecture choice is strategically differentiated but still vendor-asserted
  - - Qiankun OS
    - Coordinates low-latency, safety-critical automated-driving execution
    - Scheduling, bus, redundancy, and secure systems integration
    - No public audit package or certification readout on the OS itself
  - - iDVP SOA platform
    - Decouples vehicle software and exposes standardized APIs
    - OEM willingness to align multiple brands and platforms around reuse
    - No public API schema or migration metrics
  - - XMC / XMotion control plane
    - Fuses chassis state with ADS perception for steering, suspension, stability, and terrain control
    - Actuator quality, domain-controller integration, and calibration
    - Public proof is richer on claimed functions than on repeatable third-party test data
  - - Vehicle cloud and OTA loop
    - Maintains services after sale and refreshes capabilities
    - Connectivity, cloud operations, and OEM governance of releases
    - OTA can widen functionality but also broadens safety and compliance accountability
  notes: This table maps the visible public stack; several rows expose real architecture intent but still lack public engineering artifacts such as API schemas, safety cases, or certification packets.
