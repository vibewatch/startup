- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary buyer or user
  - Public status / maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - Qiankun ADS 5
    - OEM ADAS and vehicle-program teams
    - Launched publicly in Apr 2026; shipping as assisted driving
    - WEWA 2.0, world engine, world-action model, CAS 5.0, door-to-door 3.0
    - No public disengagement, intervention, or failure-rate disclosure by model
  - - HarmonySpace 6
    - OEM cockpit teams and end drivers/passengers
    - Launched publicly in Apr 2026
    - AI multimodal cabin sensing, agentic assistant, dual 17.2-inch screens, media stack
    - No public pricing or attach-rate disclosure by OEM trim
  - - AMS in-cabin sensing
    - Safety, HMI, and occupant-monitoring teams
    - New module launched with HarmonySpace 6
    - Camera + infrared + StarFlash sensing for posture and vital-sign detection
    - No public third-party false-positive / false-negative performance data
  - - iDVP digital vehicle platform
    - OEM software platform and EE architecture teams
    - Production platform described on official site
    - Layered decoupling + SOA with north/south APIs for software reuse
    - No public SDK, API contract, or migration case study disclosure
  - - XMotion Control / HUAWEI XMC
    - Chassis-control and ride/handling teams
    - Production capability marketed on Qiankun vehicle-control pages
    - Chassis/perception fusion plus steering, stability, suspension, and terrain modules
    - No public third-party test protocol behind precision and comfort claims
  - - 'Vehicle optics: XHUD / XPIXEL / XSCENE'
    - Cockpit-display, lighting, and branding teams
    - Commercial module family on official site; more launches in 2026
    - AR-HUD, full-color smart headlamp, in-car projection stack
    - Scope by model and SOP timing remain OEM-specific
  - - Vehicle cloud
    - Aftersales, app, OTA, and operations teams
    - Commercial service layer on Yinwang site
    - Digital key, remote control, DVR, OTA, component watch, remote diagnosis
    - No public SLA or cloud-operations uptime disclosure
  - - Qiankun consumer app / software ops
    - End owners and OEM digital-ops teams
    - Scaled consumer surface with 1.2m users after 5 months
    - AR find-my-car and service ecosystem loops extend value after sale
    - No public monetization split between OEM and Yinwang
  notes: Rows mix officially launched modules and platform layers; maturity reflects public launch visibility, not a guarantee that every capability is enabled on every OEM model.
