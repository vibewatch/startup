- id: trust-safety-and-compliance-risks
  title: Trust, safety, and compliance risks
  body: 'The most important underwriting caveat is that Yinwang''s own pages pair aggressive technical

    claims with unusually explicit disclaimers. Huawei and Yinwang repeatedly state that current

    passenger-car ADS implementations are assisted-driving systems, not replacements for the human

    driver, and that functionality can vary by model or require later OTA activation. External

    regulation is also tightening. April 2025 guidance in China pushed automakers away from the

    language of autonomous driving toward assisted driving, and subsequent rulemaking in June and

    September 2025 shows that safety requirements, national L2 standards, and marketing controls

    are still evolving. Huawei''s response has been to launch an industry safety initiative with 11

    carmakers and publish a cybersecurity white paper with customers and testing partners, but the

    public evidence still stops short of giving investors model-level uptime, disengagement,

    incident, or certification detail. The core trust conclusion is therefore mixed: Yinwang is

    ahead of many peers on public disclaimers, risk framing, and ecosystem governance, yet still

    below a diligence-ready standard on third-party assurance depth and product-line reliability

    disclosure.'
  claimRefs:
  - CE035
  - CE036
  - CE037
  - CE038
  - CE039
  - CE040
