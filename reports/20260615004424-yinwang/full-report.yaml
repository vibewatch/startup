  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: The public evidence is clearer on where cash is likely consumed than on how much cash Yinwang currently holds.
    approximationNotes: >-
      Cells are qualitative because the accessed sources disclose funding events and cost drivers more clearly than
      current balance-sheet detail.
    claimRefs:
      - CI014
      - CI020
      - CI021
      - CI029
      - CI031
      - CI040
    data:
      columns:
        - R&D / IP build
        - Component and module supply
        - OEM launch support
        - Strategic cap-table engineering
        - Undisclosed liquidity / debt
      rows:
        - id: cashuse
          label: Main cash use
          values:
            - R&D, chips, software, and IP transfer work
            - Hardware, validation, and component deployment
            - Retail, marketing, and quality-management support
            - Minority stake sales and partner alignment
            - Working cash, runway, covenants, and any project/debt facilities
        - id: publicproof
          label: Public evidence
          values:
            - Huawei spent CNY179.7bn on R&D group-wide in 2024; IAS remained a major innovation focus
            - Huawei disclosed >23m component shipments in 2024
            - Richard Yu said Zhixuan includes retail, marketing, and quality management
            - Avatr and Seres each paid RMB 11.5bn for 10% stakes
            - No public standalone cash, burn, or debt schedule has been disclosed
        - id: financialimplication
          label: Financial implication
          values:
            - Sustained innovation spend can keep returns back-loaded
            - Scale may require working capital before revenue is collected
            - Support-heavy launches can depress margin if not fully reimbursed
            - The valuation is transaction-backed but strategic, not fully market-clearing
            - Liquidity risk remains the central underwriting blind spot
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Layered view of Yinwang's public stack from sensing and intelligence to vehicle services and end-user operations.
    data:
      layers:
        - id: layer-sense
          label: Sensing and data capture
          detail: Road sensors, occupant sensors, and chassis-state inputs feed both driving and cockpit intelligence.
        - id: layer-intelligence
          label: Driving and cockpit intelligence
          detail: ADS 5 WEWA 2.0, HarmonySpace 6, and cabin AI agents interpret scenes, occupants, and intents.
        - id: layer-platform
          label: Platform and control middleware
          detail: Qiankun OS plus iDVP SOA APIs connect vehicle domains and coordinate latency-sensitive execution.
        - id: layer-actuation
          label: Vehicle actuation and experience modules
          detail: XMotion / XMC, optics, audio, AR-HUD, and in-cabin projection convert software into driving and UX outcomes.
        - id: layer-service
          label: Cloud and lifecycle services
          detail: >-
            OTA, remote diagnosis, digital key, consumer app operations, and ecosystem service loops extend value after
            sale.
    claimRefs:
