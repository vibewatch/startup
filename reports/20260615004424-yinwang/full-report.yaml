      - number: '4.4'
        title: Disclosure gaps, adverse signals, and the financial verdict
        blocks:
          - type: paragraph
            body: >-
              The chapter’s bottom line is that Yinwang has far better proof of strategic relevance than of standalone
              financial quality. The strong side of the ledger is clear: Huawei’s annual report confirms scale and
              profit inflection, HIMA deliveries show continuing pull-through into 2026, and the Avatr and Seres stake
              sales establish a cash valuation mark. The weak side is equally clear: no public source discloses
              Yinwang’s revenue mix by module, gross margin by stream, customer concentration, current cash, monthly
              burn, or runway. End-market vehicle prices and order counts are helpful demand anchors, but they do not
              reveal realized module take rates. The adverse evidence also matters. BAIC BluePark shares fell 9.69%
              after investors viewed the Stelato S9 order read as underwhelming, showing that Huawei-linked partner
              launches can still disappoint even inside a favored ecosystem. Financially, that means Yinwang should be
              treated as an industrial platform with real traction, but with economics that still look
              partner-dependent, service-heavy, and disclosure-constrained relative to public peers. The right diligence
              focus is therefore not whether demand exists, but whether profit and cash conversion remain durable once
              launch-support intensity, customer concentration, and related-party economics are laid bare.
