      - number: '7.5'
        title: Capital intensity, people risk, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Financial and execution risk remain material because standalone disclosure lags the platform's implied
              valuation. Public reporting shows Huawei's auto unit historically absorbed large losses before recent
              profitability improvements, while management still frames the current valuation as too low and denies any
              imminent IPO timetable that would let outside investors benchmark the business. Strategic partners are not
              clean balance-sheet backers either: KrASIA described Avatr as loss-making when it funded its Yinwang
              stake, and filing-derived coverage shows Seres making its own large capital-allocation choices while
              supporting the partnership. On people and governance, the reviewed record says more about shareholder
              structure than about independent board oversight or management depth. The practical result is that
              investors should monitor a short list of hard indicators: regulator tolerance for OTA and L3/L4 rollout,
              conversion of partner integrations into delivered volume, publication of stronger safety evidence, and
              whether capital needs continue rising faster than transparent economics. If a major safety event forces
              recall-style remediation, if L3/L4 timing slips materially, or if flagship OEM programs fail to scale, the
              thesis should be repriced aggressively.
