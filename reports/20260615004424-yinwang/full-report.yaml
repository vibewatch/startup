  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Yinwang's customer path starts with OEM program design, moves through deep stack integration and user-service
      activation, and only later becomes durable recurring economics.
    data:
      items:
        - id: source-oem
          label: Source OEM / program
          actor: OEM strategy, R&D, and procurement teams
          description: >-
            Yinwang first needs an OEM or joint brand willing to buy into the smart-driving, cockpit, control, and
            app-service stack at program level.
          channels:
            - HIMA joint brand
            - Qiankun partner
            - strategic cooperation agreement
        - id: integrate-stack
          label: Integrate vehicle stack
          actor: OEM engineering plus Yinwang integration teams
          description: >-
            The work then shifts into model matching, validation, feature scoping, and the six-to-nine month integration
            cycle Huawei publicly described.
          channels:
            - Model matching
            - validation
            - OTA planning
            - regulatory review
        - id: launch-model
          label: Launch model or brand
          actor: OEM sales and channel teams
          description: >-
            Public proof strengthens once a vehicle is launched, reaches stores, and begins converting preorders into
            deliveries.
          channels:
            - Launch events
            - order books
            - HIMA / OEM stores
        - id: activate-services
          label: Activate app / service layer
          actor: End customer and post-sale operations teams
          description: >-
            Durable customer value appears only when apps, charging, after-sales, remote services, and user operations
            are active after delivery.
          channels:
            - AITO app
            - HIMA app
            - charging network
            - customer service
        - id: expand-program
          label: Expand to follow-on models
          actor: OEM product and commercial teams
          description: >-
            The best proof of expansion is follow-on models, wider brand coverage, and deeper group-level adoption
            across the same automaker.
          channels:
            - Next model
            - broader OEM family rollout
            - user-ops co-creation
        - id: prove-durability
          label: Prove durable economics
          actor: CFO, sales ops, and investors
          description: >-
            The final step is still mostly missing publicly: recurring revenue, churn, renewal, and concentration data
            by OEM.
          channels:
            - NRR/GRR
            - contract renewals
            - revenue split
    approximationNotes: >-
      The journey reflects the commercialization sequence implied by the reviewed public evidence; it is not a disclosed
      internal funnel from Yinwang.
    claimRefs:
      - CU023
      - CU029
      - CU040
      - CU043
      - CU048
      - CU049
