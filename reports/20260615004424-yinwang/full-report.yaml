companyProfile:
  summary: >-
    Yinwang is a Shenzhen-based automotive technology company spun out of Huawei's Intelligent Automotive Solution
    business in January 2024 to commercialize a shared stack of smart-driving, cockpit, control, and vehicle-cloud
    technologies across multiple automakers. Rather than build cars itself, the company acts as a platform supplier
    whose systems appear across Huawei-linked HIMA brands and a widening OEM partner set including Voyah, Wuling, and
    Dongfeng programs. Its strongest public strengths are transaction-backed strategic value, broad technical scope, and
    industrial-scale ecosystem demand; its biggest weaknesses are sparse standalone financial disclosure and governance
    terms that still leave minority holders dependent on Huawei.
  foundedDate: '2024-01-16'
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: >-
    Yinwang sells an integrated automotive stack spanning Qiankun ADS intelligent driving, HarmonySpace cockpit, iDVP
    digital vehicle platform, xMotion vehicle control, and connected cloud or sensing modules for partner OEM vehicle
    programs.
  customerFocus: >-
    Chinese automakers and joint vehicle programs seeking premium or mass-market smart-driving and smart-cockpit
    capability without building the entire software-hardware stack in-house.
  businessModel: >-
    B2B platform supplier model that licenses or supplies intelligent driving, cockpit, control, and cloud systems to
    OEMs and alliance brands while Huawei preserves strategic ecosystem control.
  stage: strategic automotive platform
  fundingStatus: >-
    August 2024 strategic stake sales to Avatr and Seres priced Yinwang at RMB 115 billion while leaving Huawei with
    majority control.
