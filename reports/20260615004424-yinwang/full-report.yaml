    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, legal formation, and spinout logic
        blocks:
          - type: paragraph
            body: >-
              Yinwang was formally incorporated on 2024-01-16 as Shenzhen Yinwang Intelligent Technology Co., Ltd. with
              RMB 1 billion of registered capital, Huawei as the original sole shareholder, and a broad
              automotive-intelligence business scope covering smart in-vehicle equipment, parts R&D, AI software, and
              data services. The formation mechanics matter because Huawei's November 2023 memorandum with Changan
              framed the new company as a sector-wide component and software supplier rather than a branded vehicle OEM.
              Subsequent coverage around the temporary "Newcool" name, Huawei's public commitment not to manufacture
              cars through the new entity, and Huawei's Intelligent Automotive Solution 2030 materials all point to the
              same model: Yinwang is meant to industrialize Huawei's automotive stack across multiple automakers, using
              an Android-like platform strategy instead of a vertically integrated car brand.
