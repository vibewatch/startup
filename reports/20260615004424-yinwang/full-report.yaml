  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / condition
      - Transmission to thesis
      - Action implication
      - Why it matters
    rows:
      - - No standalone disclosure
        - >-
          Another funding or liquidity event arrives without audited standalone revenue, margin, cash, and customer
          disclosures
        - The valuation remains a strategic story instead of an underwritten investment case
        - Do not upgrade beyond research-more
        - Without core economics, price discipline has no hard floor
      - - Demand wobble in key ecosystem models
        - Flagship launches miss expectations or sentiment repeats a Stelato-like shock
        - Undermines the idea that HIMA scale automatically converts into durable Yinwang monetization
        - Shift weight from bull/base toward bear
        - Yinwang still depends on partner-program execution
      - - Public comp compression persists
        - Mobileye-like or China smart-auto multiples stay weak or fall further
        - Narrows the set of defensible multiples above the current mark
        - Treat RMB 115bn as stretched until proven otherwise
        - Outside-in valuation support gets worse, not better
      - - Disclosed margin quality disappoints
        - Standalone gross margin looks closer to hardware or service blend than platform software
        - Breaks the core argument for premium multiple durability
        - Cut valuation band toward bear case
        - Platform breadth without premium economics should not command premium price
      - - Minority rights remain thin
        - Reserved matters, transfer rights, or preference protections stay opaque
        - Raises governance risk for any outside investor at a high entry mark
        - Demand stronger documents before capital deployment
        - At this price, governance opacity is itself a return risk
    notes: Trigger thresholds are diligence heuristics anchored to the retained evidence, not management covenants.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV039
