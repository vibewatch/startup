            body: |-
              Yinwang's product story is materially stronger because there is visible deployment evidence
              across multiple OEMs rather than just lab claims. Huawei said in April 2026 that it was
              working with more than 25 brands and over 50 models, with more than 1.7 million Qiankun
              intelligent-driving vehicle installations already on the road. Independent reporting shows
              HIMA reached one million cumulative deliveries by October 2025 and delivered 46,122 vehicles
              in May 2026 alone, while Wuling, Voyah, and Chery programs extend the stack beyond the first
              Huawei-backed brands. The same public corpus also shows how deployment remains a systems-sale:
              Wuling's Huajing S is marketed with both ADS and HarmonySpace, Voyah is co-running software
              operations with Yinwang, and Chery is using scale distribution to speed L3/L4 rollout.
              Management guidance still matters, though. Huawei executives say matching a new vehicle takes
              about six to nine months and place highway L3 capability and urban L4 pilots in 2026, with
              broader commercialization only later. That keeps the roadmap investable, but it also means a
              meaningful slice of the bull case still depends on future regulatory readiness and OEM program
              execution rather than fully de-risked present-day behavior.
