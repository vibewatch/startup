      - number: '8.3'
        title: >-
          Bull, base, and bear cases hinge less on technology quality than on what future disclosure reveals about
          monetization and concentration
        blocks:
          - type: paragraph
            body: >-
              The scenario split is straightforward. The bull case says Yinwang is not just a parts supplier but the
              rare Chinese vehicle-intelligence platform that can carry ADS, cockpit, control, and cloud content across
              many automakers. If that thesis is right, the current valuation can be defended or exceeded once
              standalone accounts show revenue scaling into the low-to-mid RMB 30 billions, healthy gross margins, and
              profitable multi-OEM expansion. The base case is more conservative. It treats Huawei's 2024 IAS revenue as
              a useful proxy but still discounts the mark because the public record does not show Yinwang-only revenue
              mix, take rates, or cash conversion. The bear case assumes the opposite of the platform dream: that
              economics are more hardware-heavy, partner-concentrated, and launch-sensitive than investors hope. The
              BAIC/Stelato sentiment shock and the share data from Gasgoo both matter here, because they remind
              investors that Huawei's strategic importance is real but not equivalent to category-wide pricing power.
            claimRefs:
