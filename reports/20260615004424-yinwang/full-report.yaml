      - number: '1.2'
        title: Ownership, governance, and strategic-investor structure
        blocks:
          - type: paragraph
            body: >-
              The ownership story is unusually strategic for a company with unicorn-scale implied value. Avatr agreed in
              August 2024 to buy 10% of Yinwang for RMB 11.5 billion, and Seres matched that price days later for
              another 10%, fixing the post-money value at RMB 115 billion. Even after those sales, Huawei retained 80%
              of the equity and kept disproportionate governance control. Changan's filing for the Avatr transaction
              said the board would have seven seats, with Huawei entitled to nominate six and Avatr one, which preserved
              Huawei's operational dominance despite external capital. Later coverage showed Avatr and Seres executives
              joining the board, but the strategic-investor rule stayed narrow: Xu Zhijun said Yinwang would admit
              automakers rather than financial investors, prioritizing partners that already use its products. That
              tight shareholder filter aligns customers and owners, but it also narrows liquidity options and keeps
              minority holders dependent on Huawei's governance posture.
