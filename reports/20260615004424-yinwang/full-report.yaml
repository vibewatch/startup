      - number: '1.4'
        title: Revenue proxies, profitability inflection, and adverse demand signals
        blocks:
          - type: paragraph
            body: >-
              The public record remains much better on strategic milestones than on standalone financials, but the
              available evidence still shows a meaningful scale-up. Richard Yu said the former car BU had historically
              lost as much as RMB 10 billion annually and still lost RMB 6 billion in 2023, establishing that Yinwang
              emerged from a capital-intensive incubation period rather than a mature profit pool. By May 2024 he said
              the business had turned profitable in the first quarter, and in September 2024 Xu Zhijun said both the car
              BU and Yinwang had already been profitable in the first half. Huawei's 2024 annual-report coverage, echoed
              by iChongqing, put car-BU revenue at RMB 26.353 billion with 23 million-plus components shipped. Even so,
              the market signal is not uniformly clean: Xu said the RMB 115 billion valuation was negotiated a year
              earlier and now looked low, while BAIC BluePark's sharp share drop after a weak Stelato S9 order print
              shows how much partner demand can still whipsaw sentiment. That volatility matters because the market
              currently prices Yinwang more like a scarce strategic platform than like a transparently disclosed
              standalone operating company.
