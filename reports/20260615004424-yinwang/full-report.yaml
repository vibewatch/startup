  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The real competitor set is layered, not one-to-one
        blocks:
          - type: paragraph
            body: >-
              Yinwang is not entering a clean single-category market. The official Huawei materials show a bundle that
              spans Qiankun ADS, Harmony cockpit, vehicle control, vehicle cloud, and adjacent in-vehicle technologies
              across many partner vehicle brands. That means the right comparison set must include direct ADAS
              specialists, cockpit/domain-control incumbents, platform-chip gatekeepers, and automakers that internalize
              the same layers. Mobileye is the global proof-point rival on scaled ADAS commercialization; Horizon is the
              strongest China-local smart-driving compute and software alternative; Momenta competes as a software-first
              autonomy brain; ECARX and Desay SV compete for cockpit and domain-controller design wins; Qualcomm
              captures value underneath many branded solutions through silicon dominance; and XPeng, Li Auto, NIO, BYD,
              and Xiaomi EV show that the substitute route can be captive internal build rather than an external
              supplier. The buyer problem is therefore not just feature parity but which route minimizes integration
              friction while preserving control.
