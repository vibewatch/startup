      - number: '1.3'
        title: Product scope, partner model, and ecosystem breadth
        blocks:
          - type: paragraph
            body: >-
              Public product materials show Yinwang inheriting a broad automotive stack rather than one narrow ADAS
              module. The official site and Huawei automotive portal describe Qiankun ADS intelligent driving, Harmony
              cockpit systems, a digital vehicle platform, cloud-linked services, and vehicle-control modules such as
              xMotion. That breadth supports Huawei's claim that Yinwang is a component-and-platform supplier to many
              OEMs. The customer proof is also wider than the first two investors. By late 2025 and 2026, CnEVPost and
              partner coverage showed Huawei-backed HIMA brands scaling across AITO, Luxeed, Stelato, and Maextro, while
              SAIC-GM-Wuling and a Dongfeng co-developed brand were using Huawei automotive systems as the partner
              network expanded beyond the original Seres/Avatr cluster. The strongest strategic takeaway is that
              Yinwang's addressable value is tied less to any single model and more to the installed base of OEM
              programs carrying its attachable smart-driving and cockpit content.
