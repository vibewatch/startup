  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          The RMB 115 billion mark is real cash, but it is still a negotiated strategic mark rather than a fully
          disclosed market-clearing price
        blocks:
          - type: paragraph
            body: >-
              The strongest fact in Yinwang's valuation story is that outside money did arrive: Avatr and Seres each
              agreed to pay RMB 11.5 billion for 10% stakes, which fixes an implied RMB 115 billion valuation and proves
              the mark was not invented by rumor or secondary commentary. That matters, because many private-company
              marks are narrative artifacts rather than transaction prices. But the same evidence also limits how far
              investors should trust the mark. Huawei kept 80% ownership, publicly said Yinwang preferred automaker
              shareholders over financial investors, and still has not exposed standalone revenue, margin, cash, or
              customer concentration. Xu Zhijun's argument that the negotiated price already looked low by late 2024 is
              directionally supportive, yet it is still management framing rather than an outside underwriting package.
              News18a's 2026 IPO-rumor denial reinforces the point: Yinwang is not yet on a path where public-market
              discovery or prospectus-level disclosure can validate the valuation. Today's mark is therefore real, but
              strategically negotiated and disclosure-constrained.
            claimRefs:
