      - number: '2.4'
        title: >-
          Drivers, constraints, and valuation relevance: strong demand, rising localization, but still no precise public
          SAM
        blocks:
          - type: paragraph
            body: >-
              The tailwinds are real. Smart cockpit adoption benefits from EV and software-defined-vehicle upgrades,
              AI-driven SoC refresh cycles, and an OEM need to differentiate user experience. Localization is rising in
              China, which expands the addressable share available to domestic suppliers, but the market has not become
              domestic-only: Qualcomm remains the reference chip incumbent, while Mobileye and other global players
              continue to win premium ADAS and in-cabin programs. The implication for Yinwang is favorable but nuanced.
              Huawei does not need to dominate every layer to grow if it can attach multiple content modules into each
              OEM program.


              The constraints are just as important. Public data do not disclose Yinwang attach rates, ASPs,
              external-OEM revenue mix, or exact conversion from HIMA ecosystem scale into Yinwang-recognized revenue.
              Safety responsibility, homologation, chip selection, and vehicle-program timing all slow adoption even in
              a strong demand environment. Supplier rankings also show Huawei is relevant but not category-dominant in
              open cockpit module data, and model-level order volatility can still pressure sentiment quickly. The most
              defensible underwriting conclusion is therefore that Yinwang sits in a large, fast-developing market with
              strong buyer logic, but that valuation should still discount the absence of a directly observable public
              SAM or repeatable non-HIMA monetization cadence.
