      - number: '2.2'
        title: 'Sizing lenses: the category is large, but every published number measures a different slice'
        blocks:
          - type: paragraph
            body: >-
              The public evidence is strongest when read as a range of market lenses rather than as one definitive TAM.
              At the China level, the KPMG-cited smart-cockpit estimate points to CNY 212.7 billion by 2026 with strong
              penetration and growth. At the global level, Verified, Fortune, and GMI all publish sizable cockpit-market
              views, but they are not interchangeable because intelligent cockpit, digital cockpit, and intelligent
              cockpit platform capture different mixes of hardware, software, integration, and services. At the broadest
              edge, the VMS/McKinsey lens for China intelligent driving exceeds USD 500 billion by 2030, but that upper
              bound includes value pools far beyond what a cockpit-and-driving stack supplier can directly book today.


              The practical read-through is that Yinwang clearly operates in a market large enough to matter, but the
              exact serviceable market remains evidence-constrained. The chapter can defend a broad opportunity thesis,
              especially in China, without pretending that a public SOM can already be calculated. Reported market
              estimates are best treated as comparables and boundary markers, while supplier-ranking data and OEM-launch
              evidence do more work in showing where monetizable adoption is already occurring.
