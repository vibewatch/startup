      - number: '6.4'
        title: Durability, expansion, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              The hardest part of the customer story is not signing more OEMs; it is converting visible launches into
              durable economics. The reviewed public corpus does not disclose NRR, GRR, logo churn, renewal rates,
              contract duration, or revenue share by OEM. That means the public market can see demand and technical
              adoption, but not whether Yinwang is retaining software attach, expanding wallet share, or keeping
              bargaining power as more automakers join. The best durability proxies are indirect: customer-facing apps
              and stores, joint user-operations teams, repeated model launches under the same brand families, and very
              high reported assisted-driving usage. Even those positives come with friction. Huawei said matching a new
              vehicle can take six to nine months, which implies a long pre-SOP integration cycle, and 2025 Chinese
              regulatory changes tightened the language, beta-testing, and OTA processes around assisted-driving
              features. For Yinwang, that means expansion is real but operationally heavy: each new OEM can broaden the
              footprint, yet it also adds integration work, approval complexity, and negotiation around who controls the
              end-user relationship.
