  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risks are not abstract technology fears; they are visible in the current public
              record. First, regulation has moved sharply against loose autonomy claims, ad hoc OTA fixes, and lightly
              documented L2 or L3 behavior. Second, Yinwang's commercial model is concentrated inside a relatively small
              set of Chinese OEM ecosystems that also provide strategic capital, making partner underperformance
              economically important. Third, the product surface is broad: Qiankun spans assisted driving, cockpit,
              optics, vehicle control, and cloud services, so failures can propagate across more than one subsystem.
              Scale does not eliminate this risk. Huawei says the platform already supports more than 25 brands, more
              than 50 models, and more than 1.7 million equipped vehicles, while management still expects heavy 2026 R&D
              spend. The investment question is therefore not whether Yinwang has momentum, but whether its governance,
              regulatory posture, and partner demand are mature enough to absorb that momentum safely.
            claimRefs:
              - CR001
