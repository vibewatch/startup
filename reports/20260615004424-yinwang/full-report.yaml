      - number: '7.4'
        title: Partner, customer, and supply-chain dependence
        blocks:
          - type: paragraph
            body: >-
              Yinwang's most distinctive commercial risk is that the same parties can be suppliers of demand, governance
              influence, and capital. Avatr and Seres each paid RMB 11.5 billion for 10% stakes, board representation
              expanded, and Huawei leadership said preferred investors are carmakers using Yinwang products rather than
              financial sponsors. That creates alignment, but it also means customer, shareholder, and channel
              concentration overlap. Public evidence shows broader reach than the original Huawei-backed brands: Voyah
              formed joint software-operations teams, Chery is using Yinwang to accelerate L3 and L4 deployment, Wuling
              has a Huawei-enabled model in the pipeline, and HIMA volumes now span multiple marques. Still, the
              portfolio remains overwhelmingly China-centric and partnership-led, with no public customer-concentration
              table showing which programs carry the economics. Some partner launches also remain vulnerable to
              market-acceptance swings, as seen in the weak early Stelato S9 order reaction. The dependency thesis is
              therefore mixed: reach is expanding, but revenue resilience still depends on a narrow ecosystem whose
              interests can shift together.
