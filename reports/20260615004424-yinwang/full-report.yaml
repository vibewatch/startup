    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      How an OEM program and end owner touch the Yinwang stack from vehicle integration through daily use and post-sale
      service.
    data:
      nodes:
        - id: n1
          label: OEM selects stack depth
          detail: Program team chooses ADS-only or broader driving + cockpit + control + cloud integration.
        - id: n2
          label: Vehicle integration
          detail: Sensors, iDVP APIs, cockpit surfaces, and chassis controls are adapted to the target model.
        - id: n3
