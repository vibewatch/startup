      - number: '7.3'
        title: Operational, safety, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is amplified by how much Yinwang is trying to ship at once. Official pages describe a
              stack that joins lidar-, camera-, and radar-based perception with high-performance compute, online
              reinforcement learning, world-model reasoning, cockpit software, optics, vehicle control, and cloud
              services. That breadth increases validation burden and raises the probability that a defect in one layer
              affects another. Huawei has published mitigations: a cybersecurity white paper with ecosystem partners,
              staged scenario opening only after further testing, and formal safety language around driver supervision.
              Even so, the public record still lacks the model-level incident, recall, disengagement, and independent
              reliability evidence that institutional diligence would want before underwriting a large L3/L4 ramp.
              Several partner programs are still future launches rather than fully seasoned volume platforms, and even
              existing launches can disappoint once exposed to real market demand. The operational picture is therefore
              credible but not yet fully de-risked: scale has arrived faster than transparent field-performance
              disclosure.
