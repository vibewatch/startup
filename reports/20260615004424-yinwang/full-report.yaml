  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Boundary first: Yinwang addresses intelligent-cabin and assisted-driving content, not the full vehicle market'
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to size Yinwang's opportunity is to start from what it actually sells into OEM programs.
              The relevant spend pool is not total EV revenue, all vehicle electronics, or the gross merchandise value
              of mobility services. Public market definitions consistently center on cockpit displays, connectivity,
              HMI, ADAS visualization, intelligent-driving support, centralized compute, and the software layers that
              make those systems usable at scale. Huawei's own Qiankun materials also frame the opportunity as a
              platform of assisted-driving, vehicle-control, cloud, and cockpit-adjacent modules sold into multiple car
              programs rather than as a finished car business.


              That boundary matters because the headline market numbers in circulation mix several adjacent categories.
              Smart cockpit is narrower than all intelligent driving, while intelligent driving is narrower than all
              vehicle or mobility spending. The evidence also suggests a commercialization hierarchy: smart cockpit
              lands earlier because OEMs can monetize comfort, safety, display, and convenience upgrades before the
              harder technical and regulatory challenge of full autonomy is solved. For valuation, the right question is
              therefore not whether the intelligent-vehicle market is huge in the abstract, but how much OEM budget can
              be captured by a supplier that bundles cockpit, driving, control, and software content into a
              program-ready stack.
            claimRefs:
              - CM001
