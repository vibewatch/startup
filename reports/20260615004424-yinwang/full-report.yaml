      - number: '8.4'
        title: >-
          Recommendation: research-more, medium confidence, high risk, and stretched valuation until Yinwang discloses
          real standalone economics
        blocks:
          - type: paragraph
            body: >-
              The recommendation should be price-sensitive rather than admiring. Yinwang clearly owns valuable strategic
              assets: a cash-backed valuation mark, a broad product scope, a visible profitability inflection at the
              Huawei auto-business level, and continuing HIMA demand into 2026. Those facts are strong enough to avoid
              an outright avoid rating. They are not strong enough to justify a buy at today's price. The underwriting
              blocker is not whether the company matters, but whether the current mark already capitalizes benefits that
              still lack public proof: external-OEM breadth beyond the core ecosystem, sustainable standalone margins,
              customer concentration, and minority-governance protections. That pushes the chapter to research-more with
              medium confidence, high risk, and a stretched valuation stance. The call would upgrade only if management
              releases standalone revenue, margin, cash, and governance detail or if a later entry point falls into the
              base-case band. It would downgrade if ecosystem momentum weakens, multiple compression persists, or
              disclosures reveal hardware-like economics under the platform narrative.
