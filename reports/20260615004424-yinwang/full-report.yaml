      - number: '2.3'
        title: 'Buyer map: OEM program teams buy the stack, consumers validate it, and scale comes program by program'
        blocks:
          - type: paragraph
            body: >-
              The buyer structure in this market is more B2B programmatic than consumer-transactional. End drivers and
              passengers experience the cockpit and assisted-driving features, but the budget owner is the automaker:
              product, platform, procurement, and vehicle-program leaders decide which chip, domain controller, software
              stack, and integration partner wins each vehicle line. That is why nearly every competitor source
              positions itself not as a retail brand but as a development partner that helps OEMs shorten time to
              market, meet regional requirements, or deploy differentiated in-cabin and driving experiences.


              Open market-share data also show how adoption happens in practice. At the module layer, Desay, Bosch,
              Huawei, and ECARX all hold visible share in cockpit domain controllers. At the chip layer, Qualcomm
              remains far more concentrated, while domestic players such as Huawei are gaining but have not displaced
              incumbents. For Huawei/Yinwang specifically, the stronger adoption proof comes from OEM program breadth
              and installed-base growth. HIMA delivery milestones, plus Dongfeng and Wuling launches, indicate the route
              to scale is a rolling sequence of OEM wins, launch execution, and follow-on content attachment rather than
              a single nationwide market land-grab.
