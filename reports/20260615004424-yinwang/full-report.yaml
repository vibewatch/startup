  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what is actually disclosed
        blocks:
          - type: paragraph
            body: >-
              The public record supports a broad monetization story but not a clean standalone revenue bridge. Yinwang
              inherits Huawei’s smart-driving, cockpit, vehicle-control, optics, and vehicle-cloud businesses, and
              management repeatedly described three ways Huawei works with automakers: plain parts supply, HI full-stack
              solutions, and the deeper Zhixuan model that also layers on retail, marketing, and quality management.
              Seres transaction coverage said the platform would carry smart driving, cockpit, control, and cloud
              solutions, reinforcing that Yinwang is built to monetize OEM technology content rather than direct retail
              vehicle sales. On scale, Huawei’s 2024 annual report is the strongest official anchor: Intelligent
              Automotive Solution revenue reached CNY 26.353 billion, up 474.4% year over year, with more than 23
              million intelligent automotive components shipped and more than 600 partners served. HIMA delivery data
              then adds a live downstream demand proxy: 46,122 vehicles in May 2026 and about 192,000 deliveries in the
              first five months of 2026. That is enough to prove industrial traction, but not enough to split hardware,
              software, cloud, and launch-support revenue streams cleanly.
