      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is the cleanest near-term thesis risk because the rule direction is already visible.
              China has pushed the industry away from “autonomous driving” marketing and toward explicit
              assisted-driving language, with higher disclosure expectations after high-profile crashes. The February
              2025 MIIT and SAMR notice tightened product admission, recall handling, and OTA governance, and legal
              commentary says updates that affect major technical parameters or L3-plus functions need approval rather
              than casual remote rollout. In parallel, SAC released combined-driver-assistance and cybersecurity
              standards, while later 2025 consultations proposed hand-off detection, gaze monitoring, and temporary
              lockouts for L2 misuse. Sidley's review of China's type-approval regime is important for investors: even
              if standards exist, regulators still have discretion where requirements remain qualitative. Yinwang is not
              shown in the reviewed corpus to face an active lawsuit today, but the combination of marketing scrutiny,
              OTA controls, cybersecurity obligations, and approval discretion means legal risk is primarily prospective
              and operational rather than legacy litigation.
            claimRefs:
