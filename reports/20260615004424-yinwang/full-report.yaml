      - number: '5.2'
        title: Architecture and integration model
        blocks:
          - type: paragraph
            body: |-
              Public architecture detail is unusually specific for a private auto-tech supplier. ADS 5 is
              positioned around the WEWA 2.0 architecture, with a cloud world engine, online reinforcement
              learning, and a vehicle-side world-action model that Huawei says uses a safety-risk-field
              framework for defensive decisioning. Huawei also frames Qiankun OS as an operating system for
              automated driving, emphasizing deterministic scheduling, lower in-vehicle latency, and
              full-link safety plus redundancy. On the vehicle-control side, Yinwang says iDVP uses a
              layered, decoupled, SOA-style architecture with standardized northbound and southbound APIs,
              explicitly to let OEMs reuse software across more than one vehicle line and iterate faster.
              XMotion Control and HUAWEI XMC sit on top of that platform to coordinate chassis state and
              perception for steering, stability, suspension, and terrain control. This is a technically
              ambitious control-plane story, but it also creates the key implementation risk: if the OEM
              must align sensors, middleware, chassis actuators, cockpit UX, and cloud services at once,
              time-to-launch and validation effort become as important as headline autonomy features.
