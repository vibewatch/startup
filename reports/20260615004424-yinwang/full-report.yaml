      - number: '6.3'
        title: Adoption trajectory, premium positioning, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public demand proxies show that Yinwang has crossed from pilot-scale relevance into industrial-scale
              adoption, but they also expose concentration risk. HIMA reached one million cumulative deliveries within
              43 months and delivered 46,122 vehicles in May 2026, while Qiankun's assisted-driving mileage exceeded 10
              billion kilometers by April and 11.47 billion by May according to later reporting. Those are meaningful
              scale markers for an automotive technology supplier. The problem is mix balance. The same source set shows
              that AITO accounted for 82.4 percent of HIMA's May 2025 deliveries, with Luxeed and Stelato far smaller,
              and Aito-specific models carrying many of the most visible order and cumulative-delivery milestones. The
              customer base is therefore diversified by logo count and OEM type, but not yet clearly diversified by
              end-market volume. Premium average selling price also cuts both ways: HIMA's RMB 390,000 average
              transaction price shows access to higher-value vehicle programs, yet it also means the installed base is
              concentrated in a narrower, more cyclical premium segment where underperforming model launches can quickly
              change market sentiment.
