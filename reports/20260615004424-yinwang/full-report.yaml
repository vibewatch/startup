        title: Customer base, segments, and who actually pays
        blocks:
          - type: paragraph
            body: >-
              Yinwang's customer base is best understood as a layered OEM ecosystem rather than a simple list of
              consumer car buyers. At the deepest level sit the HIMA joint brands, where Huawei's automotive stack is
              embedded into co-created marques including AITO, Luxeed, Stelato, Maextro, and Shangjie. Public HIMA and
              Huawei surfaces show that these brands share not only assisted-driving and cockpit components but also
              stores, apps, service support, and a common commercialization narrative. A second layer includes non-HIMA
              or less tightly branded OEM customers such as Voyah, Avatr, Wuling, and Dongfeng programs that use Huawei
              or Yinwang technologies without always moving into the same alliance architecture. The payer is therefore
              usually the OEM or joint vehicle program, while the end user is the car buyer whose experience is shaped
              by Qiankun driving, HarmonySpace cockpit, app-based services, and charging or after-sales infrastructure.
              This distinction matters because public proof is stronger on downstream user reach than on upstream
              revenue recognition: Yinwang can point to stores, app users, chargers, and deliveries, but it does not
              publicly break out how much contract value or recurring software revenue each OEM contributes.
