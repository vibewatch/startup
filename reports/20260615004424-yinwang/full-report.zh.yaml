      - - Momenta
        - 软件优先的自动驾驶竞争者
        - 本组公开证明更多是战略定位，而非披露装机基础
        - 希望保留其他层级、同时采购自动驾驶软件的 OEM
        - 感知、高精地图、数据驱动路径规划
        - 适合已经控制座舱和 E/E 架构的 OEM 替代选择
        - 相比 Huawei、Horizon 或 Mobileye，可获取的公开规模证据偏弱
      - - ECARX
        - 座舱 / SDV 平台竞争者
        - 已赋能 11M+ 辆车；2026 年推出 Zenith 平台
        - 希望走座舱优先 SDV 计算路线的 OEM
        - 全栈 SDV 和 AI 定义汽车解决方案；座舱计算
        - 把座舱平台雄心和有意义的已交付车辆基础结合起来
        - 2026 年旗舰 Zenith 平台底层仍依赖 Snapdragon Elite
      - - Desay SV
        - 既有座舱集成商
        - 2026 Q1 控制器份额 15.3%；14 个研发基地；9 座工厂；11,000+ 名员工
        - 采购域控制器和座舱集成的全球 OEM
        - 智能座舱、智能驾驶、智能服务
        - 制造和集成既有玩家，在中国份额强
        - 公开 ADAS 软件身份不如 Huawei、Mobileye 或 Horizon 鲜明
      - - Qualcomm 座舱 / ADAS 技术栈
        - 底层芯片和平台守门人
        - 2026 Q1 中国座舱芯片份额 72.1%
        - 基于汽车芯片搭建方案的 Tier-1 和 OEM
        - 汽车平台，以及支撑座舱 / ADAS 的芯片
        - 在许多品牌化座舱方案底层攫取议价权
        - 单独看通常不是面向 OEM 的中立一站式全栈
      - - 车企内部自研
        - 现状替代方案
        - XPeng 全栈 ADAS + OS；Li Auto 智能汽车解决方案；BYD / Xiaomi 部件排名
        - 优先掌握控制权的高销量 OEM
        - 按 OEM 而异：ADAS、OS、E/E 架构、座舱、精选部件
        - 保留软件、数据和路线图控制的最佳路径
        - 最慢、最吃人才的路线；小型 OEM 难以复制
    notes: 各行覆盖已审查证据包支持的关键直接、既有、相邻、平台和内部自研路线，而不是穷尽市场上每一个具名中国供应商。
