    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 区间（RMB bn）
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 乐观
        - 独立收入扩张到 RMB 300 亿出头至中段区间，多 OEM 宽度超出核心 HIMA，披露利润率支持平台经济性
        - 在更强披露经济性基础上给约 4.5x-5.5x 销售额，高于当前代理倍数，但仍锚定类似 Mobileye 质量的论点
        - 150-190
        - 需要证据，不是信仰：盈利必须持续，外部 OEM 宽度必须变得可见
        - 只有在经审计独立指标和客户广度出现后才上调
      - - 基准
        - Huawei 2024 年 IAS 收入代理指标在方向上有用，但披露、集中度和流动性风险仍应折价
        - 约为公开收入代理指标的 2.8x-3.6x，反映战略稀缺性，也给了实质性的不透明折价
        - 85-110
        - 最贴合当前证据：业务看起来真实，但披露不足
        - 如果没有重大负面意外、但披露仍薄弱，这就是大概率路径
      - - 悲观
        - 独立经济性被证明更偏硬件、客户更集中，或上市支持强度高于市场当前假设
        - 在 RMB 18-22bn 的较低收入结果上给约 1.5x-2.0x，同时倍数压缩、需求信心走弱
        - 35-55
        - 如果上市可比公司持续便宜，或旗舰生态发布摇摆，该情景会更可信
        - 由利润率失望、客户集中或动能滑坡触发
    notes: 区间是估算情景带，不是管理层指引或投资要约价格。
