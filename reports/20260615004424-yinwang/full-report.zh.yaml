      - number: '7.5'
        title: 资本强度、人才风险与投资逻辑失效触发器
        blocks:
          - type: paragraph
            body: >-
              财务和执行风险仍然重要，因为独立披露追不上平台隐含估值。公开报道显示，Huawei 车 BU 在近期盈利改善前长期吸收大额亏损；管理层仍把当前估值描述为偏低，同时否认近期 IPO
              时间表，外部投资人也就难以用公开市场给业务定标。战略伙伴也不是干净的资产负债表支持者：KrASIA 称 Avatr 出资入股 Yinwang 时仍在亏损，基于申报文件的报道也显示 Seres
              一边支持合作，一边做出自身的大额资本配置选择。人员和治理层面，已审阅记录更多讲股东结构，而不是独立董事会监督或管理层厚度。实际结果是，投资人应盯住一小组硬指标：监管对 OTA 和 L3/L4
              推进的容忍度，伙伴集成能否转化为交付量，更强安全证据能否发布，以及资本需求是否继续比透明经济性涨得更快。若重大安全事件迫使召回式补救，若 L3/L4 节奏明显滑坡，或若旗舰 OEM
              项目无法起量，投资逻辑就应大幅重估。
