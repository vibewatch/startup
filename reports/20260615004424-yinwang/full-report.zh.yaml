      - number: '8.2'
        title: 公开可比公司支持战略稀缺性，但还不足以证明当前标记对外部投资人是清晰便宜的买点
        blocks:
          - type: paragraph
            body: >-
              压力测试 Yinwang 最干净的办法，是把估值换成美元，再同真正披露财务数据的上市同行比较。按报告运行日 USD/CNY 汇率，RMB 115 billion 约为 USD 17.0
              billion；Huawei 2024 年 Intelligent Automotive Solution 收入代理约合 USD 3.89 billion，对应约 4.4x 销售额。这接近 Mobileye 在
              2026 年中的收入倍数，但明显高于 ECARX，也明显高于 NIO 和 XPeng 隐含的约 1.0x 至 1.2x 区间。绝对市值比较更苛刻：Yinwang 的隐含价值高于保留样本中的
              Mobileye、Horizon Robotics、Desay SV、ECARX、NIO、XPeng 和 Li Auto。多头可以说这些可比公司并不完美，因为 Yinwang
              打包了更多技术栈层级；但这个论点只有在打包最终转化为已披露盈利能力、可重复的外部 OEM 胜利以及比当前公开证据更强的软件式经济性时才站得住。在那之前，公开可比组给出的结论是：这个标记雄心不小，而不是显然便宜。
