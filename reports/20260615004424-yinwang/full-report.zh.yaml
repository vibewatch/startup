          label: 证明持久经济性
          actor: CFO、销售运营和投资者
          description: 最后一步在公开层面仍基本缺失：按 OEM 拆分的经常性收入、流失、续约和集中度数据。
          channels:
            - NRR/GRR
            - 合同续约
            - 收入分成
    approximationNotes: 这一路径反映所审阅公开证据暗示的商业化顺序；它不是 Yinwang 披露的内部漏斗。
    claimRefs:
      - CU023
      - CU029
      - CU040
      - CU043
      - CU048
      - CU049
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开证据从多个具名 OEM 验证面，逐步收窄到几乎没有披露的持久性或集中度经济性。
    data:
      items:
        - label: 已审阅的具名 OEM 或品牌验证面
          value: 10
        - label: 有发布或量产证据的项目
          value: 8
        - label: 披露订单或交付指标的项目
          value: 6
        - label: 有可见 app、服务或用户运营证据的项目
          value: 3
        - label: 公开披露续约或收入分成的项目
          value: 0
    approximationNotes: 计数汇总本章审阅的公开证据集，并非 Yinwang 内部客户总数。
    claimRefs:
      - CU011
      - CU012
      - CU018
      - CU024
      - CU029
      - CU036
      - CU038
      - CU046
      - CU047
      - CU048
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: AITO 当前验证栈最强，Voyah 和 Chery 是可信的第二波客户；Maextro、Wuling 和 Dongfeng 在公开证据中仍处更早阶段。
    data:
      columns:
        - AITO / Seres
        - Luxeed / Chery
        - Stelato / BAIC
        - Maextro / JAC
        - Voyah
        - Avatr / Wuling / Dongfeng
      rows:
        - label: 量产成熟度
          values:
            - 高
            - 高
            - 中
            - 低
            - 高
            - 低-中
        - label: 结果具体度
          values:
            - 高
            - 中
            - 中
            - 低
            - 中
            - 低
        - label: 售后或用户运营可见度
          values:
            - 高
            - 中
            - 低
            - 低
            - 高
            - 低
        - label: 留存可见度
