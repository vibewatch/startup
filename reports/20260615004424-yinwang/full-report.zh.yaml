  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管、安全、集中度和披露风险如何传导到销量、估值和可投资性。
    data:
      nodes:
        - id: rules
          label: MIIT / SAMR 规则趋严
        - id: ota
          label: OTA 审批摩擦
        - id: safety
          label: 重大 ADAS 事故
        - id: delays
