        title: 真正的竞争集合是分层的，不是一对一
        blocks:
          - type: paragraph
            body: >-
              Yinwang 进入的不是一个干净的单品类市场。Huawei 官方材料显示，这是一套横跨 Qiankun ADS、Harmony
              座舱、车辆控制、车云和相邻车载技术的组合，覆盖多家伙伴汽车品牌。因此，正确的可比集合必须包括直接 ADAS 专家、座舱/域控制在位者、平台芯片守门人，以及把同样层级内化的车企。Mobileye 是全球 ADAS
              规模化商业化的标杆对手；Horizon 是中国本土最强的智能驾驶计算和软件替代方案；Momenta 以软件优先的自动驾驶大脑竞争；ECARX 和 Desay SV 争夺座舱和域控制器定点；Qualcomm
              通过硅片主导权在许多带品牌的方案之下攫取价值；XPeng、Li Auto、NIO、BYD 和 Xiaomi EV
              则说明，替代路径可以是封闭的内部自研，而不是外部供应商。买方的问题因此不只是功能是否持平，而是哪条路径在保住控制权的同时，把集成摩擦降到最低。
