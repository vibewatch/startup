      - number: '5.2'
        title: 架构与集成模式
        blocks:
          - type: paragraph
            body: >-
              对一家私人汽车科技供应商来说，公开架构细节异常具体。ADS 5 围绕 WEWA 2.0 架构定位，包含云端世界引擎、在线强化学习和车端世界动作模型；Huawei
              称后者使用安全风险场框架来做防御性决策。Huawei 还把 Qiankun OS 定位为自动驾驶操作系统，强调确定性调度、更低车内延迟，以及全链路安全和冗余。车辆控制侧，Yinwang 称 iDVP
              采用分层、解耦、SOA 风格架构，并提供标准化南北向 API，明确目标是让 OEM 在多条车型线上复用软件并更快迭代。XMotion Control 和 HUAWEI XMC
              位于该平台之上，用来协同底盘状态和感知，覆盖转向、稳定性、悬架和地形控制。这是一个技术上很有野心的控制平面故事，但也制造了关键落地风险：如果 OEM 必须一次性对齐传感器、中间件、底盘执行器、座舱 UX
              和云服务，上市时间和验证投入就会和头部自动驾驶功能一样重要。
