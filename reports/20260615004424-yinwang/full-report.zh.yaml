      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管暴露是最清晰的近期论点风险，因为规则方向已经可见。高知名度事故之后，中国推动行业远离“自动驾驶”营销，转向明确的辅助驾驶表述，同时提高披露预期。2025 年 2 月 MIIT 和 SAMR
              通知收紧产品准入、召回处理和 OTA 治理；法律评论称，影响重大技术参数或 L3 以上功能的更新需要审批，不能随意远程推出。与此同时，SAC 发布组合驾驶辅助和网络安全标准，2025 年后续征求意见又提出 L2
              误用场景下的接管检测、视线监控和临时锁定。Sidley 对中国 type-approval 制度的评论对投资者很重要：即使标准存在，在要求仍属定性时，监管者仍保留裁量权。已审阅语料没有显示 Yinwang
              今天面临正在进行的诉讼，但营销审查、OTA 控制、网络安全义务和审批裁量叠加，意味着法律风险主要是前瞻和运营性的，而不是历史诉讼。
