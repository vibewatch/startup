            body: >-
              Yinwang 的客户基础最好理解为一个分层 OEM 生态，而不是一串消费者购车者名单。最深层是 HIMA 联合品牌，Huawei 的汽车技术栈嵌入 AITO、Luxeed、Stelato、Maextro 和
              Shangjie 等共创品牌。公开 HIMA 和 Huawei 界面显示，这些品牌共享的不只是辅助驾驶和座舱组件，还包括门店、app、服务支持和共同商业化叙事。第二层包括非 HIMA 或品牌绑定较弱的 OEM
              客户，例如 Voyah、Avatr、Wuling 和 Dongfeng 项目；它们使用 Huawei 或 Yinwang 技术，但不总是进入同一联盟架构。因此，付款方通常是 OEM
              或联合车型项目，终端用户则是购车者，其体验由 Qiankun 驾驶、HarmonySpace 座舱、app
              服务以及充电或售后基础设施塑造。这个区分重要，因为公开证明在下游用户触达上强于上游收入确认：Yinwang 可以指向门店、app 用户、充电桩和交付量，但不公开拆分每家 OEM
              贡献了多少合同价值或经常性软件收入。
