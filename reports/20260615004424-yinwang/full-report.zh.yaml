  - id: FV002
    title: 基于公开收入代理的销售倍数估值敏感性
    type: bar
    layout: standard
    summary: Huawei 2024 年收入代理保持不变时，仅倍数假设就能把隐含价值从熊市区间推到当前估值标记，甚至更高。
    approximationNotes: 柱形用 RMB 26.353bn 公开收入代理乘以简单示意性销售倍数；它们是敏感性输出，不是新的市场观察。
    data:
      items:
        - label: 1.5x 销售额
          value: 39.5
        - label: 2.0x 销售额
          value: 52.7
        - label: 3.0x 销售额
          value: 79.1
        - label: 4.4x 当前隐含
          value: 115
        - label: 5.5x 牛市上限
          value: 144.9
    claimRefs:
      - CV019
      - CV020
      - CV023
      - CV026
      - CV029
      - CV032
      - CV044
      - CV045
      - CV046
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 证据支持较宽的情景离散度；当前估值标记高于基准情景中点，低于牛市情景顶部。
    approximationNotes: 区间由情景表估算，反映披露质量、需求持久性和可比公司倍数假设。
    data:
      items:
        - label: 熊市情景
          low: 35
          mid: 45
          high: 55
        - label: 基准情景
          low: 85
          mid: 97.5
          high: 110
        - label: 牛市情景
          low: 150
          mid: 170
          high: 190
    claimRefs:
      - CV044
      - CV045
      - CV046
      - CV052
      - CV053
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分显示，这家公司战略上很强，但按当前估值标记积极承做，透明度仍不够。
    approximationNotes: 分数是基于留存证据得出的 10 分制分析判断，不来自正式委员会评分表。
    data:
      items:
        - label: 市场机会
          value: 8/10
          note: 庞大的智能座舱和智能汽车支出池支撑战略相关性。
        - label: 产品 / 平台验证
          value: 8/10
          note: ADS、座舱、控制和云的覆盖广度强于多数同行。
        - label: 需求验证
          value: 7/10
          note: 2026 年 HIMA 交付形成支撑，但合作伙伴发布波动仍重要。
        - label: 竞争地位
          value: 6/10
          note: Huawei 可信，但并未主导所有可见模块或芯片层。
        - label: 财务透明度
          value: 3/10
          note: 独立收入、利润率、现金和集中度仍未披露。
        - label: 估值支撑
          value: 4/10
          note: 当前估值高过多数可比上市公司；除非后续披露证明其经济性足以享受溢价，否则难以支撑。
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV016
      - CV039
      - CV040
      - CV041
      - CV049
      - CV050
      - CV052
