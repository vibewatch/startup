      - number: '8.4'
        title: 建议：继续研究，中等信心，高风险；在 Yinwang 披露真实独立经济性前，估值偏紧
        blocks:
          - type: paragraph
            body: >-
              建议应对价格敏感，而不是停留在欣赏。Yinwang 显然拥有有价值的战略资产：有现金支撑的估值标记，宽产品范围，Huawei 车业务层面的清晰盈利拐点，以及延续到 2026 年的 HIMA
              需求。这些事实足以避免直接给出回避评级，但还不足以支撑按今天价格买入。承销阻碍不在于公司是否重要，而在于当前标记是否已经资本化了仍缺少公开证明的收益：核心生态之外的外部 OEM
              广度、可持续独立利润率、客户集中度，以及少数股东治理保护。因此，本章结论是继续研究，信心中等、风险高、估值偏紧。只有当管理层发布独立收入、利润率、现金和治理细节，或之后入场价格落入基准情景区间，判断才会上调。若生态动能减弱、倍数压缩持续，或披露显示平台叙事下是硬件式经济性，判断就应下调。
