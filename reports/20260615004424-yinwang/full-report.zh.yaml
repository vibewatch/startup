  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: RMB 115 billion 的标记有真实现金支撑，但它仍是谈判得出的战略价格，不是披露充分的市场出清价
        blocks:
          - type: paragraph
            body: >-
              Yinwang 估值故事里最硬的事实是，外部资金确实进来了：Avatr 和 Seres 各同意出资 RMB 11.5 billion 取得 10% 股权，锁定 RMB 115 billion
              的隐含估值，也证明这个标记不是传闻或二级评论编出来的。很多私营公司估值只是叙事产物，而不是交易价格，所以这一点重要。但同一证据也限制了投资人对该标记的信任边界。Huawei 保留 80% 股权，公开称
              Yinwang 更偏好车企股东而非财务投资人，且仍未披露独立收入、利润率、现金或客户集中度。Xu Zhijun 说谈判价到 2024
              年底已经显得偏低，这在方向上有支撑，但本质上仍是管理层表述，不是外部承销材料。News18a 对 2026 年 IPO 传闻的否认进一步说明：Yinwang
              尚未走到能靠公开市场发现价格或招股书级披露验证估值的路径上。因此，今天的标记是真实的，但由战略谈判形成，也受披露约束。
