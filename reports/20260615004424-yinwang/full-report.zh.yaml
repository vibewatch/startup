      - number: '7.3'
        title: 运营、安全与质量风险
        blocks:
          - type: paragraph
            body: >-
              Yinwang 试图一次性交付太多东西，放大了运营风险。官方页面描述的技术栈把基于
              lidar、摄像头和雷达的感知，高性能计算、在线强化学习、世界模型推理、座舱软件、光学、车辆控制和云服务连接在一起。这种宽度增加验证负担，也提高了单层缺陷影响另一层的概率。Huawei
              已发布缓释措施：与生态伙伴发布网络安全白皮书，进一步测试后才分阶段开放场景，并围绕驾驶员监督使用正式安全表述。即便如此，公开记录仍缺少车型级事故、召回、脱离和独立可靠性证据；机构尽调在承销大规模 L3/L4
              放量前会需要这些证据。若干伙伴项目仍是未来发布，而不是完全成熟的批量平台；即便现有发布，一旦暴露于真实市场需求，也可能令人失望。因此，运营图景可信但尚未完全去风险：规模来得比透明现场性能披露更快。
