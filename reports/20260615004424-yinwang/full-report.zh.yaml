  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 方案范围与客户任务
        blocks:
          - type: paragraph
            body: >-
              Yinwang 的公开界面值得注意，因为它卖的是一组汽车解决方案，而不是一个孤立的辅助驾驶功能。公司主页和 Huawei 汽车门户都描述了一套技术栈，覆盖 Qiankun ADS
              智能驾驶、HarmonySpace 座舱、车辆控制模块、车辆光学和车云生命周期服务。放到客户工作流里，这意味着平台试图覆盖几个环节：车辆运动中的感知和决策，乘员乘坐时的座舱交互，车辆执行时的底盘控制，以及交付后的
              OTA、诊断和远程服务。HarmonySpace 6 通过增加乘员感知、智能体交互和座舱媒体界面，把主张从信息娱乐拓宽出去；云层则增加数字钥匙、远程控制、OTA 和远程诊断钩子，这些对车企在 SOP
              后同样重要，而不只是在车型发布时有用。对尽调的含义是，挂载率潜力为正，但复杂度为负：买方评估的不是一个模块，而是一套组合，其商业成功取决于 OEM 能否采用一套连贯技术栈，而不是在每一层过度定制。
