        title: 披露缺口、负面信号与财务结论
        blocks:
          - type: paragraph
            body: >-
              本章底线是，Yinwang 对战略相关性的证明远强于对独立财务质量的证明。账本强的一边很清楚：Huawei 年报确认了规模和盈利拐点，HIMA 交付显示需求继续拉动到 2026 年，Avatr 和 Seres
              股权出售确立了现金估值标记。弱的一边同样清楚：没有公开来源披露 Yinwang 按模块划分的收入结构、按收入流划分的毛利率、客户集中度、当前现金、月度消耗或
              资金跑道。终端市场车价和订单量是有用的需求锚，但不能揭示实际模块搭载率。负面证据也重要。投资者认为 Stelato S9 订单解读不及预期后，BAIC BluePark 股价下跌
              9.69%，显示即便在受偏爱的生态内，Huawei 关联伙伴发布仍可能令人失望。财务上，这意味着 Yinwang
              应被视为一个有真实牵引力的产业平台；但相较公开可比公司，其经济性仍显得更依赖伙伴、服务更重、披露受限。正确的尽调焦点因此不是需求是否存在，而是在上市支持强度、客户集中度和关联方经济性摊开之后，利润和现金转换是否仍耐久。
