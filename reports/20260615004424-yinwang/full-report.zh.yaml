companyProfile:
  summary: >-
    Yinwang 是一家位于深圳的汽车技术公司，2024 年 1 月从 Huawei Intelligent Automotive Solution
    业务拆出，目标是把智能驾驶、座舱、控制和车云技术组成的共享技术栈商业化，并推向多家车企。公司不自己造车，而是做平台供应商；其系统出现在 Huawei 关联的 HIMA 品牌中，也进入包括 Voyah、Wuling 和
    Dongfeng 项目在内的更大 OEM 伙伴圈。公开信息里最强的优势是有交易背书的战略价值、覆盖面很宽的技术范围和工业级生态需求；最大短板则是独立财务披露稀少，治理条款仍让少数股东依赖 Huawei。
  foundedDate: '2024-01-16'
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: Yinwang 销售一套集成汽车技术栈，覆盖 Qiankun ADS 智能驾驶、HarmonySpace 座舱、iDVP 数字车辆平台、xMotion 车辆控制，以及面向合作 OEM 车型项目的联网云或感知模块。
  customerFocus: 中国车企及联合车型项目，希望获得高端或大众市场的智能驾驶、智能座舱能力，但不想在内部搭完整套软硬件栈。
  businessModel: B2B 平台供应商模式，向 OEM 和联盟品牌授权或供应智能驾驶、座舱、控制和云系统，同时 Huawei 保留战略生态控制权。
  stage: strategic automotive platform
