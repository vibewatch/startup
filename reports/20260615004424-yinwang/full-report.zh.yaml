          label: 获取 OEM / 项目
          actor: OEM 战略、研发和采购团队
          description: Yinwang 首先需要一个 OEM 或联合品牌，在项目层面买入智能驾驶、座舱、控制和 app 服务技术栈。
          channels:
            - HIMA 联合品牌
            - Qiankun 合作伙伴
            - 战略合作协议
        - id: integrate-stack
          label: 集成整车技术栈
          actor: OEM 工程团队加 Yinwang 集成团队
          description: 工作随后转入车型匹配、验证、功能范围划定，以及 Huawei 公开提到的 6-9 个月集成周期。
          channels:
            - 车型匹配
            - 验证
            - OTA 规划
            - 监管审查
        - id: launch-model
          label: 发布车型或品牌
          actor: OEM 销售与渠道团队
          description: 车辆发布、进店，并开始把预订单转成交付后，公开验证会更强。
          channels:
            - 发布活动
            - 订单簿
            - HIMA / OEM 门店
        - id: activate-services
          label: 激活 app / 服务层
          actor: 终端客户和售后运营团队
          description: 只有交付后 app、充电、售后、远程服务和用户运营真正跑起来，持久客户价值才会出现。
          channels:
            - AITO app
            - HIMA app
            - 充电网络
            - 客服
        - id: expand-program
          label: 扩展到后续车型
          actor: OEM 产品和商业团队
          description: 扩张最好的证据，是同一家车企后续车型、更宽的品牌覆盖，以及更深的集团级采用。
          channels:
            - 下一款车型
            - 更广的 OEM 家族铺开
            - 用户运营共创
