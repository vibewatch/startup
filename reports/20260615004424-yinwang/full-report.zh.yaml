            body: >-
              Yinwang 的估值有现金背书，但流动性没有。Avatr 于 2024 年 8 月同意以 RMB 11.5 billion 购买 Yinwang 10% 股权，数日后 Seres 以同样价格购买另一个
              10%，意味着 RMB 115 billion 股权估值，交易后 Huawei 仍持有 80%。Changan 的 Avatr 披露称董事会将有七席，Huawei 有权提名六席、Avatr 一席，因此
              Huawei 在变现战略绑定的同时保留治理控制。Xu Zhijun 后来称该估值大约一年前谈成，到 2024 年末看偏低，同时也表示投资者应是车企而非财务投资者，Yinwang 仍对更多 OEM
              股东开放。这些事实重要，因为它们让估值更像战略价格，而非市场出清价格：价格真实，但买方集合被有意收窄。公开来源还显示相邻生态现金流，例如 Seres 另以 RMB 2.5 billion 向 Huawei 购买
              Aito 商标和专利。公开来源没有显示的是 Yinwang 当前现金、消耗、资金跑道、债务或契约余量，因此不能仅靠这些交易承销资本充足性。
