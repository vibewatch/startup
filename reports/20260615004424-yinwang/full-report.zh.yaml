      - number: '2.3'
        title: 买方地图：OEM 项目团队购买技术栈，消费者验证体验，规模按项目滚动放大
        blocks:
          - type: paragraph
            body: >-
              这个市场的买方结构更偏 B2B
              项目制，而非消费者交易。终端驾驶员和乘客体验座舱与辅助驾驶功能，但预算所有者是车企：产品、平台、采购和车型项目负责人决定哪颗芯片、哪个域控制器、哪套软件栈、哪个集成伙伴赢下每条车型线。因此，几乎所有竞争对手资料都把自己定位为开发伙伴，而不是零售品牌；它们帮助
              OEM 缩短上市时间、满足区域要求，或部署差异化座舱和驾驶体验。


              公开市占数据也展示了采用在实践中如何发生。在模块层，Desay、Bosch、Huawei 和 ECARX 在座舱域控制器中都有可见份额。在芯片层，Qualcomm 仍高度集中；Huawei
              等国内玩家在上升，但还没有取代既有厂商。对 Huawei/Yinwang 来说，更强的采用证据来自 OEM 项目宽度和装机基础增长。HIMA 交付里程碑，加上 Dongfeng 和 Wuling
              发布，说明规模化路径是一串滚动的 OEM 赢单、上市执行和后续内容挂载，而不是一次全国市场抢占。
