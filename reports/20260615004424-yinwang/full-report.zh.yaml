  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Yinwang 最高优先级风险类别的发生可能性、影响和剩余敞口。
    data:
      columns:
        - 发生可能性
        - 影响
        - 剩余敞口
      rows:
        - label: 监管 / OTA 收紧
          values:
            - 高
            - 高
            - 高
        - label: 合作伙伴和股东集中
          values:
            - 高
            - 高
            - 高
        - label: 安全事件 / 召回波及面
          values:
