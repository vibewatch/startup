      - number: '1.3'
        title: 产品范围、伙伴模式与生态宽度
        blocks:
          - type: paragraph
            body: >-
              公开产品材料显示，Yinwang 继承的是一套宽汽车技术栈，而不是一个狭窄的 ADAS 模块。官网和 Huawei 汽车门户描述了 Qiankun ADS 智能驾驶、Harmony
              座舱系统、数字车辆平台、云连接服务，以及 xMotion 等车辆控制模块。这种宽度支撑了 Huawei 的说法：Yinwang 是服务多家 OEM 的零部件和平台供应商。客户证据也不止前两家投资者。到 2025
              年末和 2026 年，CnEVPost 以及伙伴报道显示，Huawei 支持的 HIMA 品牌正在 AITO、Luxeed、Stelato 和 Maextro 上放量；同时，SAIC-GM-Wuling 和一个与
              Dongfeng 共创的品牌也在使用 Huawei 汽车系统，伙伴网络已经超出最初的 Seres/Avatr 集群。最强的战略结论是：Yinwang
              的可寻址价值不那么依赖单一车型，而更依赖搭载其可附加智能驾驶和座舱内容的 OEM 项目装机基础。
