        - from: volume
          to: capital
        - from: disclosure
          to: capital
        - from: capital
          to: thesis
        - from: safety
          to: thesis
    approximationNotes: 边捕捉从已审阅法律、监管和市场材料中抽取的因果传导；它们是分析性连接，不是公司披露的流程图。
