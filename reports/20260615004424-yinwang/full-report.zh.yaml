      - number: '8.3'
        title: 牛市、基准和熊市情景更取决于未来披露如何呈现变现和集中度，而不是技术质量本身
        blocks:
          - type: paragraph
            body: >-
              情景分化很直接。牛市情景认为，Yinwang 不只是零部件供应商，而是少见的中国车辆智能平台，可以把 ADS、座舱、控制和云内容带到多家车企。如果这个逻辑正确，一旦独立报表显示收入扩张到 RMB 30
              billions 低至中段、毛利率健康、且多 OEM 扩张可盈利，当前估值就能被捍卫，甚至被超过。基准情景更保守。它把 Huawei 2024 年 IAS 收入视为有用代理，但仍对估值打折，因为公开记录没有展示
              Yinwang 单体收入结构、take rate 或现金转化。熊市情景则假设平台梦想的反面：经济性比投资人希望的更偏硬件、更集中于伙伴、更受发布节奏影响。BAIC/Stelato 的情绪冲击和 Gasgoo
              的份额数据在这里都重要，因为它们提醒投资人，Huawei 的战略重要性真实存在，但不等于全品类定价权。
