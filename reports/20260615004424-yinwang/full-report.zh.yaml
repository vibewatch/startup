      - number: '1.2'
        title: 所有权、治理与战略投资者结构
        blocks:
          - type: paragraph
            body: >-
              对一家隐含价值达到独角兽规模的公司而言，Yinwang 的股权故事异常偏战略。Avatr 于 2024 年 8 月同意以 RMB 11.5 billion 购买 Yinwang 10% 股权，数日后 Seres
              以同样价格购买另一个 10%，把投后估值锚定在 RMB 115 billion。即便完成这些出售，Huawei 仍持有 80% 股权，并保留不成比例的治理控制。Changan 就 Avatr
              交易提交的文件称，董事会将有七个席位，Huawei 有权提名六席、Avatr 一席；外部资本进入后，Huawei 仍守住经营主导权。后续报道显示 Avatr 和 Seres
              高管进入董事会，但战略投资者规则仍很窄：Xu Zhijun 称 Yinwang
              会引入车企，而不是财务投资者，并优先考虑已经使用其产品的伙伴。这种严格的股东筛选让客户与所有者利益对齐，但也收窄了流动性选择，并让少数股东继续依赖 Huawei 的治理姿态。
