      - number: '2.4'
        title: 驱动、约束与估值相关性：需求强、国产化上升，但仍没有精确公开 SAM
        blocks:
          - type: paragraph
            body: >-
              顺风是真实的。智能座舱采用受益于 EV 和软件定义汽车升级、AI 驱动的 SoC 换代周期，以及 OEM
              区分用户体验的需求。中国国产化在提升，扩大了国内供应商可拿到的可寻址份额，但市场并未变成纯国内市场：Qualcomm 仍是参考芯片在位者，Mobileye 和其他全球玩家继续赢得高端 ADAS 与座舱内项目。对
              Yinwang 的含义有利但不单线条。只要能在每个 OEM 项目里挂载多个内容模块，Huawei 不需要主导每一层也能增长。


              约束同样重要。公开数据没有披露 Yinwang 挂载率、ASP、外部 OEM 收入结构，也没有披露 HIMA 生态规模到底如何转化为 Yinwang
              确认收入。即便需求环境强，安全责任、准入认证、芯片选择和车型项目节奏都会拖慢采用。供应商排名还显示，在开放座舱模块数据中，Huawei
              相关但并非品类主导者；单车型订单波动仍能快速压制情绪。因此，最站得住脚的承销结论是：Yinwang 处在一个巨大且快速发展的市场，买方逻辑强，但估值仍应折价反映两个缺口：直接可观察的公开 SAM 缺席，以及非
              HIMA 可重复变现节奏尚未跑清。
