  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: wide
    summary: 公开证据只能给出代理层面的持久性验证：复购需求和服务使用存在，但所有 OEM 队列的续约经济性仍未披露。
    data:
      columns:
        - 复购需求验证
        - 服务 / 运营验证
        - 续约经济性披露
      rows:
