  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              最高严重度风险不是抽象技术恐惧，而是已经出现在当前公开记录中。第一，监管已明显转向，压制宽松自动驾驶宣传、临时 OTA 修补，以及记录轻薄的 L2 或 L3 行为。第二，Yinwang
              的商业模式集中在数量相对有限的中国 OEM 生态内，这些生态也提供战略资本，因此伙伴表现不佳会带来重要经济影响。第三，产品界面很宽：Qiankun
              横跨辅助驾驶、座舱、光学、车辆控制和云服务，故障可能跨多个子系统传导。规模不能消除这种风险。Huawei 称该平台已支持超过 25 个品牌、50 多款车型和超过 1.7 million
              辆搭载车辆，同时管理层仍预计 2026 年有高额 R&D 支出。因此，投资问题不是 Yinwang 是否有动能，而是其治理、监管姿态和伙伴需求是否足够成熟，能够安全吸收这种动能。
