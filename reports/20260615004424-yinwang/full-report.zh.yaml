  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界先行：Yinwang 切入的是智能座舱和辅助驾驶内容，不是整车市场
        blocks:
          - type: paragraph
            body: >-
              给 Yinwang 的机会定边界，最干净的办法是从它实际卖给 OEM 项目的内容出发。相关支出池不是全部 EV 收入、所有汽车电子，也不是移动出行服务的
              GMV。公开市场定义通常围绕座舱显示、连接、HMI、ADAS 可视化、智能驾驶支持、集中计算，以及让这些系统可规模化使用的软件层。Huawei 自己的 Qiankun
              材料也把机会框定为辅助驾驶、车辆控制、云和座舱相邻模块组成的平台，卖入多车型项目，而不是一门成品车生意。


              这条边界重要，因为市面上的头部市场数字混杂了几个相邻品类。智能座舱窄于全部智能驾驶，智能驾驶又窄于全部车辆或移动出行支出。证据也显示商业化存在层级：智能座舱更早落地，因为 OEM
              可以先把舒适、安全、显示和便利性升级变现，再去解决全自动驾驶更难的技术和监管挑战。因此，估值时真正该问的，不是抽象意义上的智能汽车市场是否巨大，而是一个把座舱、驾驶、控制和软件内容打包成项目就绪技术栈的供应商，能吃到多少
              OEM 预算。
