  - id: TV005
    title: 论点破坏与叫停触发因素表
    columns:
      - 触发因素
      - 阈值 / 条件
      - 对论点的传导
      - 行动含义
      - 重要性
    rows:
      - - 没有独立披露
        - 下一次融资或流动性事件仍未披露经审计的独立收入、利润率、现金和客户数据
        - 估值仍是战略故事，不是可承销的投资案例
        - 不要上调到继续研究以上
        - 没有核心经济性，价格纪律就没有硬地板
      - - 关键生态车型需求动摇
        - 旗舰发布不及预期，或情绪重演 Stelato 式冲击
        - 削弱「HIMA 规模会自动转化为引望持久变现」的判断
        - 权重从牛市 / 基准情景转向熊市
        - 引望仍依赖合作伙伴计划的执行
      - - 公开可比公司估值压缩持续
        - Mobileye 式或中国智能汽车倍数继续低迷，甚至进一步下行
        - 可支撑高于当前定价的倍数范围变窄
        - 在被证明合理前，把 RMB 115bn 视为偏高
        - 外部估值支撑在变差，不是在变好
      - - 披露的利润率质量不及预期
        - 独立毛利率更像硬件或服务混合，而非平台软件
        - 打破高倍数可持续性的核心论据
        - 把估值区间下修到熊市情景
        - 没有溢价经济性的广平台，不应拿溢价价格
      - - 少数股东权利仍薄
        - 保留事项、转让权或优先保护继续不透明
        - 高入场估值下，外部投资者的治理风险上升
        - 出资前要求更强的文件保护
        - 在这个价格上，治理不透明本身就是回报风险
    notes: 触发阈值是基于已保留证据的尽调启发式规则，不是管理层契约。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV039
      - CV041
      - CV044
      - CV046
      - CV051
      - CV052
      - CV053
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 对结论的影响
    rows:
      - - 独立财务报表
        - 2025 年和 2026 年引望收入、毛利率、EBIT 与现金流
        - 决定 115bn 是平台定价，还是为不透明性付出过高价格
        - 向 Huawei / 引望财务索取经审计的剥离报表
        - 最主要的上调阻碍
      - - 现金、债务与跑道
        - 当前资产负债表、债务、契约，以及 Avatr / Seres 资金用途
        - 若发布延期，需要检验稀释和抗压能力
        - 索取股权结构表、资金库与债务明细
        - 对风险评级影响高
      - - 股东权利
        - 保留事项、否决权、转让条款和任何优先权层级
        - Huawei 保持控制权时，少数股东经济性更关键
        - 获取股东协议和董事会文件
        - 对治理舒适度影响高
      - - OEM 集中度与管线
        - 按 OEM 拆分的收入占比，以及核心 HIMA 之外的外部订单积压
        - 判断引望是在变成中立平台，还是仍是集中生态资产
        - 索取客户分群和积压订单桥接表
        - 对倍数支撑影响高
      - - 定价与抽成率
        - ADS、座舱、控制和服务层的单车内容价值
        - 需要把市场规模叙事转成真实变现
        - 索取定价瀑布图和按产品族拆分的毛利率
        - 对牛市情景可信度影响高
    notes: 要把战略欣赏型案例推进到真正的投资承销案例，至少需要这组数据。
    claimRefs:
      - CV013
      - CV042
      - CV051
      - CV053
