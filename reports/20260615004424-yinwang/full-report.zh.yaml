      - number: '2.2'
        title: 规模测算镜头：品类很大，但每个公开数字量的都是不同切片
        blocks:
          - type: paragraph
            body: >-
              公开证据最适合作为一组市场镜头来看，而不是一个确定 TAM。在中国层面，KPMG 引用的智能座舱估算指向 2026 年 CNY 212.7
              billion，并伴随强渗透和增长。在全球层面，Verified、Fortune 和 GMI 都发布了规模可观的座舱市场观点，但不能互换，因为 intelligent cockpit、digital
              cockpit 和 intelligent cockpit platform 覆盖的硬件、软件、集成和服务组合不同。最宽口径下，VMS/McKinsey 对中国智能驾驶的视角到 2030 年超过 USD 500
              billion，但这个上限包含了远超当前座舱和驾驶技术栈供应商可直接入账的价值池。


              实务上的读法是，Yinwang 显然处在一个足够大的市场里，但可服务市场的精确范围仍受证据约束。本章可以支撑 一个宽机会论点，尤其是在中国，但不能假装公开 SOM
              已经可以计算。公开市场估算最好作为可比参照和边界标尺；真正更能说明可变现采用正在发生的，是供应商排名数据和 OEM 上市证据。
