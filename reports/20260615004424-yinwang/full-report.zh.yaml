      - number: '5.4'
        title: 信任、安全与合规风险
        blocks:
          - type: paragraph
            body: >-
              最重要的承销提醒是，Yinwang 自己的页面把激进技术主张和异常明确的免责声明放在一起。Huawei 和 Yinwang 反复声明，当前乘用车 ADS
              落地是辅助驾驶系统，不能替代人类驾驶员，且功能可能因车型不同而变化，或需要后续 OTA 激活。外部监管也在收紧。中国 2025 年 4 月的指引推动车企从自动驾驶表述转向辅助驾驶；随后 2025 年 6 月和 9
              月的规则制定显示，安全要求、国家 L2 标准和营销控制仍在演进。Huawei 的回应是与 11 家车企发起行业安全倡议，并与客户和测试伙伴发布网络安全白皮书；但公开证据仍没有给投资者提供车型级
              uptime、脱离、事故或认证细节。核心信任结论因此是混合的：Yinwang 在公开免责声明、风险框定和生态治理上领先许多同行，但在第三方保证深度和产品线可靠性披露上，仍低于尽调可用标准。
