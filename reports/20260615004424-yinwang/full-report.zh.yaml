      - number: '1.4'
        title: 收入代理、盈利拐点与负面需求信号
        blocks:
          - type: paragraph
            body: >-
              公开记录对战略里程碑的披露远好于独立财务，但现有证据仍显示业务显著放大。Richard Yu 称，原车 BU 历史上一年最多亏损 RMB 10 billion，2023 年仍亏损 RMB 6
              billion，这说明 Yinwang 脱胎于一个资本密集的孵化期，而不是成熟利润池。到 2024 年 5 月，他称该业务一季度已扭亏；2024 年 9 月，Xu Zhijun 称车 BU 和 Yinwang
              在上半年都已盈利。Huawei 2024 年年报相关报道经 iChongqing 转述，给出的车 BU 收入为 RMB 26.353 billion，发运组件超过 23 million
              件。即便如此，市场信号并不完全干净：Xu 称 RMB 115 billion 估值是一年前谈成的，如今看偏低；但 BAIC BluePark 在 Stelato S9
              订单表现疲弱后股价急跌，显示伙伴需求仍能大幅左右情绪。这种波动重要，因为市场当前给 Yinwang 定价，更像是在给稀缺战略平台定价，而不是给一家披露透明的独立运营公司定价。
