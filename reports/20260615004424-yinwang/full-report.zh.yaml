    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律设立与拆分逻辑
        blocks:
          - type: paragraph
            body: >-
              Yinwang 于 2024-01-16 正式注册为深圳引望智能技术有限公司，注册资本 RMB 1 billion，Huawei 为原始唯一股东，汽车智能业务范围很宽，覆盖智能车载设备、零部件研发、AI
              软件和数据服务。设立机制重要，是因为 Huawei 2023 年 11 月与 Changan 的备忘录把新公司定位成面向全行业的零部件和软件供应商，而不是带品牌的整车 OEM。随后围绕临时名称 “Newcool”
              的报道、Huawei 公开承诺不通过新实体造车，以及 Huawei Intelligent Automotive Solution 2030 材料，都指向同一模式：Yinwang 要用类似 Android
              的平台战略，把 Huawei 的汽车技术栈工业化，铺到多家车企，而不是做垂直整合的汽车品牌。
