        title: 收入模式与实际披露内容
        blocks:
          - type: paragraph
            body: >-
              公开记录支撑一个宽变现故事，但还拼不出干净的独立收入桥。Yinwang 继承 Huawei 的智能驾驶、座舱、车辆控制、光学和车云业务；管理层反复描述 Huawei 与车企合作的三种方式：普通零部件供应、HI
              全栈方案，以及更深的 Zhixuan 模式，后者还叠加零售、营销和质量管理。Seres 交易报道称，该平台将承载智能驾驶、座舱、控制和云方案，进一步说明 Yinwang 是为了变现 OEM
              技术内容，而不是直接零售卖车。在规模上，Huawei 2024 年年报是最强官方锚点：Intelligent Automotive Solution 收入达到 CNY 26.353 billion，同比增长
              474.4%，发运智能汽车组件超过 23 million 件，服务伙伴超过 600 家。HIMA 交付数据又提供了实时下游需求代理：2026 年 5 月交付 46,122 辆，2026 年前五个月约交付
              192,000 辆。这足以证明工业牵引力，但还不足以把硬件、软件、云和上市支持收入流清晰拆开。
