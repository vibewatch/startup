        - ADAS 中最强的公开规模和安全商业化证明
        - 未引用座舱广度证据；买方仍需其他座舱 / 集成伙伴
      - - Horizon Robotics
        - 中国本土直接 ADAS 计算和软件竞争者
        - Journey 出货超过 10M；400+ 设计定点；40+ OEM / 品牌伙伴
        - 寻求本土智能驾驶技术栈的中国乘用车 OEM
        - Journey 计算加 HSD 端到端城市辅助驾驶
        - 本组中披露最强的中国本土智能驾驶落地足迹
