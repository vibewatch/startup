      - number: '7.4'
        title: 伙伴、客户与供应链依赖
        blocks:
          - type: paragraph
            body: >-
              Yinwang 最特殊的商业风险在于，同一批主体可能同时贡献需求、影响治理、提供资本。Avatr 和 Seres 各出资 RMB 11.5 billion 取得 10% 股权，董事会席位随之扩容；Huawei
              管理层也说，优先投资人是使用 Yinwang 产品的车企，而不是财务投资人。这样确实能对齐利益，但也让客户、股东和渠道集中度叠在一起。公开证据显示，Yinwang 的触达已经超出最初的 Huawei
              背书品牌：Voyah 组建了联合软件运营团队，Chery 借 Yinwang 加快 L3、L4 落地，Wuling 有一款 Huawei 赋能车型在管线中，HIMA
              销量也已覆盖多个品牌。不过，组合仍高度以中国为中心、靠伙伴推进，也没有公开的客户集中度表说明哪些项目真正承载经济收益。部分伙伴车型还容易受市场接受度波动冲击，Stelato S9
              早期订单反应偏弱就是例子。因此，依赖性判断并不单向：触达在扩大，但收入韧性仍押在一个较窄生态上，而生态内各方利益可能同步转向。
