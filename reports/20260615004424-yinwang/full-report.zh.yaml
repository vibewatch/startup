      - number: '5.3'
        title: OEM 部署、生产证据与路线图
        blocks:
          - type: paragraph
            body: >-
              Yinwang 的产品故事显著更强，是因为它在多家 OEM 上有可见部署证据，而不只是实验室主张。Huawei 2026 年 4 月称，其正与超过 25 个品牌、50 多款车型合作，路上已搭载超过 1.7
              million 辆 Qiankun 智能驾驶车辆。独立报道显示，HIMA 到 2025 年 10 月累计交付达到 1 million 辆，仅 2026 年 5 月就交付 46,122 辆；Wuling、Voyah
              和 Chery 项目把技术栈延伸到最早的 Huawei 支持品牌之外。同一公开语料也显示部署如何仍是一种系统销售：Wuling 的 Huajing S 同时以 ADS 和 HarmonySpace
              营销，Voyah 与 Yinwang 共同运营软件，Chery 借助规模分销加速 L3/L4 推出。不过，管理层指引仍然重要。Huawei 高管称，匹配一款新车大约需要六到九个月，并把高速 L3 能力和城市 L4
              试点放在 2026 年，更广泛商业化还要更晚。这让路线图仍可投资，但也意味着多头案例中相当一部分仍依赖未来监管准备度和 OEM 项目执行，而不是已经充分去风险的当下行为。
