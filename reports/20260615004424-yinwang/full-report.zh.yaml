  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 投资判断始于真实估值标记和强战略相关性，但披露质量仍是能否转成买入的闸门。
    approximationNotes: null
    data:
      nodes:
        - id: mark
          label: RMB 115bn 真实现金估值标记
        - id: scope
          label: ADS + 座舱 + 控制覆盖面宽
        - id: demand
          label: 2026 需求仍活跃
        - id: gap
          label: 独立披露缺口
        - id: comps
          label: 公开可比公司大多更便宜
        - id: call
          label: 继续研究 / 偏贵 / 高风险
      edges:
        - from: mark
          to: call
          label: 支撑相关性
        - from: scope
          to: call
          label: 支撑上行空间
        - from: demand
          to: call
          label: 支撑持久性
        - from: gap
          to: call
          label: 阻挡上调
        - from: comps
          to: call
          label: 强制价格纪律
        - from: mark
          to: gap
