            body: >-
              成本故事比利润率故事更清楚。Richard Yu 称，Huawei 汽车业务曾一年最多亏损 RMB 10 billion，2023 年仍亏损约 RMB 6 billion；这把 Yinwang
              定义为多年孵化努力的产物，而不是刚刚盈利的新剥离资产。到 2024 年 5 月，他称汽车业务一季度已盈利；Huawei 2024 年年报随后称智能汽车解决方案在 2024 年首次实现盈利。Xu Zhijun
              又称车 BU 和 Yinwang 在 2024 年上半年均已盈利。缺失的是这些说法与真实单位经济性之间的桥：Zhixuan 包含零售、营销和质量管理义务，Luxeed S7
              放量曾受芯片短缺和工厂搬迁拖延，且没有公开来源拆分硬件与软件利润率。因此，可比公司组最适合作为披露基准。Mobileye 披露了 2025 年收入、毛利率和经营现金流；ECARX
              披露收入、毛利率、积压订单和净亏损；NIO 披露全年收入、车辆毛利率和年末现金；XPeng 披露收入、毛利率、车辆毛利率和净亏损；Horizon 披露量产规模。Yinwang 尚未达到这种财务细节披露水平。
