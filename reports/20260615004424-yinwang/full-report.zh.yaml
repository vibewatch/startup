  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 角色
      - 依赖
      - 风险
    rows:
      - - 传感器和感知输入
        - 采集道路、障碍物、乘员和车辆状态数据
        - OEM 传感器包、标定和布置选择
        - 能力随车辆硬件而变；官方页面提示传感器组合可能因车型不同
      - - 车端计算平台
        - 运行融合感知、规划、座舱 AI 和控制任务
        - 热管理、成本和 EE 架构预算由 OEM 设定
        - 公开页面未按 SKU 披露计算 BOM 或失效可运行设计
      - - 云端 world engine
        - 生成困难场景并支持在线强化学习
        - 数据闭环、仿真质量和训练基础设施
        - 只靠公开材料很难验证外部性能
      - - World-action / 行为模型
        - 把场景理解转换为驾驶动作
        - 训练数据质量和验证边缘案例
        - 架构选择具备战略差异化，但仍是供应商自述
      - - Qiankun OS
        - 协调低时延、安全关键的自动驾驶执行
        - 调度、总线、冗余和安全系统集成
        - OS 本身没有公开审计包或认证解读
      - - iDVP SOA 平台
        - 解耦车辆软件并暴露标准化 API
        - OEM 是否愿意围绕复用整合多个品牌和平台
        - 未公开 API schema 或迁移指标
      - - XMC / XMotion 控制平面
        - 融合底盘状态和 ADS 感知，用于转向、悬架、稳定和地形控制
        - 执行器质量、域控制器集成和标定
        - 公开证据在功能声明上更丰富，在可复现第三方测试数据上更弱
      - - 车载云和 OTA 闭环
        - 售后维护服务并刷新能力
        - 连接性、云运营和 OEM 对发布的治理
        - OTA 可以扩展功能，但也扩大安全和合规责任
    notes: 这张表映射可见的公开技术栈；几行体现真实架构意图，但仍缺少 API schema、安全案例或认证包等公开工程材料。
