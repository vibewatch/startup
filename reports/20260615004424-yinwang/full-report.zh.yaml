      - number: '6.4'
        title: 耐久度、扩张与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              客户故事最难的部分不是签下更多 OEM，而是把可见发布转化为耐久经济性。已审阅公开语料没有披露 NRR、GRR、客户流失、续约率、合同期限或按 OEM
              划分的收入份额。这意味着公开市场能看到需求和技术采用，但看不到 Yinwang 是否留住软件挂载、扩大钱包份额，或在更多车企加入后守住议价权。最好的耐久度代理是间接的：面向客户的 app
              和门店、联合用户运营团队、同一品牌家族下反复发布车型，以及报告中的极高辅助驾驶使用量。即便这些正面因素也伴随摩擦。Huawei 称匹配一款新车需要六到九个月，意味着 SOP 前集成周期很长；2025
              年中国监管变化又收紧了辅助驾驶功能的表述、beta 测试和 OTA 流程。对 Yinwang 来说，扩张是真实的，但运营很重：每一个新 OEM
