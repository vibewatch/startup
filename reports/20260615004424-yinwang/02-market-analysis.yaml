  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: yinwang-sam
      missingEvidence: Per-program attach rates, module ASPs, and external-OEM revenue mix for Yinwang.
      whyItMatters: >-
        Without private pricing and mix data, any public SAM or SOM would be a speculative
        extrapolation rather than a diligence-grade estimate.
      diligencePath: Request OEM-by-OEM bookings, take-rate, and content-per-vehicle data from management.
      relatedQuestionRefs: [QM023, QM024]
    - type: missing-source
      severity: material
      topic: market-boundary
      missingEvidence: A public China-only market model that isolates integrated cockpit-plus-assisted-driving supplier revenue rather than broader cockpit or mobility definitions.
      whyItMatters: >-
        The current source pack supports boundary logic and broad range-setting, but not one directly
        usable China SAM for Yinwang's exact stack.
      diligencePath: Ask management or industry consultants for bottom-up bill-of-materials and platform-volume models by OEM segment.
      relatedQuestionRefs: [QM024]
      relatedTableRefs: [TM002]
    - type: stale
      severity: minor
      topic: policy-detail
      missingEvidence: A directly usable and specific Chinese policy or standards document quantifying cockpit or assisted-driving deployment requirements for 2026 programs.
      whyItMatters: >-
        Policy context matters for adoption timing, but the currently accessible public pages are
        better at institutional context than at giving one clean numeric deployment rule.
      diligencePath: Refresh MIIT, ministry, and standards-body sources with a targeted policy-document pull if regulation becomes a core underwriting variable.
      relatedQuestionRefs: [QM025]
    - type: private-evidence-only
      severity: material
      topic: monetization-cadence
      missingEvidence: Cohort-style evidence showing how HIMA deliveries convert into Yinwang-recognized revenue over time.
      whyItMatters: >-
        Installed-base growth alone does not tell investors how quickly software, cockpit, and
        control content monetize into reported results.
      diligencePath: Request historical cohort data linking program launch, delivery volume, and content revenue realization.
      relatedQuestionRefs: [QM023, QM026]
    - type: conflicting-data
      severity: minor
      topic: market-size
      missingEvidence: A harmonized definition that reconciles smart cockpit, digital cockpit, intelligent cockpit, and broader intelligent-driving market labels across publishers.
      whyItMatters: >-
        Different labels can create false precision or double counting when investors compare
        estimates without checking boundary logic.
      diligencePath: Preserve range analysis and ask future diligence to map each publisher definition to Yinwang's actual SKU set.
      relatedQuestionRefs: [QM018, QM019]
      relatedTableRefs: [TM002, FM001]
