  - id: FM003
    title: Adoption funnel or value-chain map
    type: funnel
    layout: standard
    summary: >-
      Illustrative funnel showing where intelligent-cabin and assisted-driving opportunity narrows
      before it becomes realized supplier revenue.
    data:
      items:
        - label: Category demand and technology interest
          value: 100
          unit: index
          note: Smart cockpit, EV, and AI-compute narratives create a broad top-of-funnel opportunity.
        - label: OEM platform selection
          value: 62
          unit: index
          note: Programs narrow the field based on compute, safety, cost, and architecture fit.
        - label: Integration and homologation
          value: 34
          unit: index
          note: Sensor, software, domain-controller, and regulatory requirements remove many conceptual wins.
        - label: Vehicle launch and early sell-through
          value: 18
          unit: index
          note: Launch execution and initial order reception determine whether the design win really converts.
        - label: Scaled installed-base monetization
          value: 9
          unit: index
          note: Only repeated launches and OTA or cross-module attachment turn the market narrative into durable supplier economics.
    approximationNotes: >-
      Index values are illustrative stage weights synthesized from supplier positioning, open
      rankings, and launch evidence. They summarize where the market narrows rather than
      representing company-reported conversion rates.
