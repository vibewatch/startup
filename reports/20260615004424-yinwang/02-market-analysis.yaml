figures:
  - id: FM001
    title: Market estimate range
    type: range
    layout: standard
    summary: >-
      Published 2026 cockpit-market estimates cluster in the tens of billions of dollars globally,
      but boundary definitions differ enough that they should be read as a range, not a single
      precise TAM.
    data:
      items:
        - label: Conservative published view
          low: 27.0
          mid: 29.77
          high: 31.0
          displayValue: "$29.77B 2026 intelligent cockpit"
          detail: "Anchored on Verified's 2026 intelligent-cockpit estimate, with a modest band around that publisher definition."
          tone: neutral
        - label: Triangulated midpoint
          low: 29.77
          mid: 33.84
          high: 37.92
          displayValue: "$33.84B midpoint"
          detail: "Simple midpoint between Verified's intelligent-cockpit estimate and Fortune's digital-cockpit estimate; not an authoritative forecast."
          tone: neutral
        - label: Aggressive published view
          low: 35.0
          mid: 37.92
          high: 41.0
          displayValue: "$37.92B 2026 digital cockpit"
          detail: "Anchored on Fortune's 2026 digital-cockpit estimate, which uses a somewhat broader market boundary."
          tone: warning
    approximationNotes: >-
      The midpoint is only a triangulation between two non-identical publisher definitions. These
      values are useful for range-setting, not for claiming a single authoritative SAM.
    claimRefs: [CM009, CM011, CM014, CM040, CM048]
