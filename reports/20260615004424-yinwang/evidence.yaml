evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone financial disclosure
    missingEvidence: Audited standalone Yinwang revenue, gross margin, cash flow, and balance-sheet disclosure.
    whyItMatters: >-
      The company-overview chapter can anchor ownership and valuation, but it cannot tie the RMB 115 billion mark to
      standalone economics.
    diligencePath: Request management financial pack or Huawei segment disclosures that isolate Yinwang from the broader car BU.
    relatedQuestionRefs:
      - QO019
      - QO025
  - type: missing-source
    severity: material
    topic: governance rights
    missingEvidence: Full shareholder agreement, board reserved matters, and IP-transfer terms between Huawei, Avatr, and Seres.
    whyItMatters: Minority economics and real governance influence cannot be inferred cleanly from transaction summaries alone.
    diligencePath: >-
      Obtain the signed equity-transfer and shareholder agreements or exchange-level attachment schedules from the
      investors.
    relatedQuestionRefs:
      - QO010
      - QO011
      - QO013
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: valuation freshness
    missingEvidence: A newer third-party financing or tender document that resets valuation after the Aug 2024 strategic deals.
    whyItMatters: Xu Zhijun's comment that the negotiated price is stale suggests the public mark may lag current strategic value.
    diligencePath: Look for later OEM investment documents, IPO preparation materials, or banker valuation memos.
    relatedQuestionRefs:
      - QO023
      - QO025
  - type: private-evidence-only
    severity: material
    topic: yinwang-sam
    missingEvidence: Per-program attach rates, module ASPs, and external-OEM revenue mix for Yinwang.
    whyItMatters: >-
      Without private pricing and mix data, any public SAM or SOM would be a speculative extrapolation rather than a
      diligence-grade estimate.
    diligencePath: Request OEM-by-OEM bookings, take-rate, and content-per-vehicle data from management.
    relatedQuestionRefs:
      - QM023
      - QM024
  - type: missing-source
    severity: material
    topic: market-boundary
    missingEvidence: >-
      A public China-only market model that isolates integrated cockpit-plus-assisted-driving supplier revenue rather
      than broader cockpit or mobility definitions.
    whyItMatters: >-
      The current source pack supports boundary logic and broad range-setting, but not one directly usable China SAM for
      Yinwang's exact stack.
    diligencePath: Ask management or industry consultants for bottom-up bill-of-materials and platform-volume models by OEM segment.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: policy-detail
    missingEvidence: >-
      A directly usable and specific Chinese policy or standards document quantifying cockpit or assisted-driving
      deployment requirements for 2026 programs.
    whyItMatters: >-
      Policy context matters for adoption timing, but the currently accessible public pages are better at institutional
      context than at giving one clean numeric deployment rule.
    diligencePath: >-
      Refresh MIIT, ministry, and standards-body sources with a targeted policy-document pull if regulation becomes a
      core underwriting variable.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: monetization-cadence
    missingEvidence: Cohort-style evidence showing how HIMA deliveries convert into Yinwang-recognized revenue over time.
    whyItMatters: >-
      Installed-base growth alone does not tell investors how quickly software, cockpit, and control content monetize
      into reported results.
    diligencePath: Request historical cohort data linking program launch, delivery volume, and content revenue realization.
    relatedQuestionRefs:
      - QM023
      - QM026
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: >-
      A harmonized definition that reconciles smart cockpit, digital cockpit, intelligent cockpit, and broader
      intelligent-driving market labels across publishers.
    whyItMatters: >-
      Different labels can create false precision or double counting when investors compare estimates without checking
      boundary logic.
    diligencePath: Preserve range analysis and ask future diligence to map each publisher definition to Yinwang's actual SKU set.
    relatedQuestionRefs:
      - QM018
      - QM019
    relatedTableRefs:
      - TM002
      - FM001
  - type: missing-source
    severity: material
