- id: packaging-switching-and-internal-build
  title: Packaging model and control drive switching costs
  body: 'The strongest switching costs in this market do not come from public list prices, because reviewed enterprise surfaces generally do not disclose them. They come from how many interdependent layers a buyer hands to one supplier. Huawei’s advantage is that it can offer more of the stack together, which can shorten integration cycles for OEMs that do not want to assemble ADAS, cockpit, vehicle control, cloud, and chip relationships separately. That is valuable, but it cuts both ways. Qualcomm’s 72.1% Q1 2026 cockpit-chip share shows how much bargaining power still sits below the branded solution layer. Desay’s cockpit-controller lead and Huawei’s lower share show that cockpit integration remains contestable. ECARX’s Zenith announcement shows one common compromise route: a branded cockpit/compute platform that still depends on Snapdragon underneath. At the high-control end, XPeng, Li Auto, and NIO all present internal technology stacks, while BYD and Xiaomi EV already appear in component-level
    rankings, proving that internal build is not theoretical for scale OEMs.'
