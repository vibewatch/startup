- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Full-stack bundle lowers OEM integration friction
    - Layer leaders can still beat Huawei on one module and let OEMs multi-source the rest
    - High
    - Huawei breadth exists, but public share leadership does not
    - Request attach-rate and win-rate data by module, not just partner count
  - - China-local smart-driving credibility
    - Horizon has stronger disclosed local smart-driving scale and OEM breadth
    - High
    - 10M+ Journey shipments and 400+ design wins are a serious benchmark
    - Test side-by-side OEM reasons for choosing Huawei ADS versus Horizon HSD
  - - Cockpit integration reach
    - Desay remains Q1 2026 controller-share leader and a global manufacturing incumbent
    - High
    - 15.3% share plus large engineering/manufacturing footprint
    - Request controller-program list and service metrics for Huawei versus Desay
  - - Underlying chip leverage
    - Qualcomm dominates cockpit chips and can tax many front-end solutions
    - Critical
    - 72.1% cockpit-chip share in Q1 2026
    - Separate software differentiation from silicon dependency in diligence
  - - Global ADAS proof and safety credibility
    - Mobileye has the broadest public ADAS commercialization signal
    - High
    - 230M+ EyeQ vehicles and fresh 2026 wins
    - Ask Huawei for independent deployment and safety-compliance disclosures
  - - Partner neutrality
    - Strategic automaker-investor model may deter OEMs that want maximum independence
    - Medium
    - Huawei prioritizes automakers already using its solutions
    - Review reserved matters, exclusivity, and pricing protections for non-investor OEMs
  - - Internal-build substitute risk
    - Large software-first OEMs can internalize the same stack layers Huawei wants to sell
    - High
    - XPeng, Li Auto, NIO, BYD and Xiaomi EV all show some internalization path
    - Map which OEM segments still need external full-stack help versus those that do not
  - - Economics transparency
    - Opaque pricing and take-rate make moat monetization hard to underwrite
    - Medium
    - Public sources describe packaging but not realized economics
    - Request per-vehicle content value, software revenue share, and renewal/OTA attach rates
  notes: The register focuses on whether Yinwang can defend bundle value against layer specialists and insourcing, not on whether the smart-cockpit market itself is large.
