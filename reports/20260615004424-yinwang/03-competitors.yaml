- id: capability-and-stack-overlap
  title: Huawei wins on breadth; rivals win on specific layers
  body: 'Public evidence gives Huawei a defensible breadth story. Its automotive pages show a full-stack OEM-facing proposition: ADS, cockpit, vehicle control, cloud, and a wide cooperation-model roster. But the same evidence pack shows rivals with sharper layer-level advantages. Mobileye’s stack runs from base ADAS through SuperVision, Chauffeur, and Drive and is supported by more than 230 million EyeQ-equipped vehicles through 2025, which is unmatched public scale proof for driving technology. Horizon has the strongest China-local direct-driving footprint in this pack, claiming 10 million-plus Journey shipments, 400-plus design wins, and 40-plus OEM or brand partners. Desay SV is the integration incumbent with global engineering and manufacturing scale, while ECARX offers a cockpit-first SDV platform route that can still ride Qualcomm silicon. Momenta is thinner on public commercial proof here, but its software-brain positioning still matters for OEMs that already control cockpit and E/E
    architecture themselves.'
