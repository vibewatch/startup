- id: durability-and-adverse-evidence
  title: Durability depends on bundling faster than rivals can specialize or insource
  body: 'The adverse evidence matters. In Q1 2026 public China rankings, Huawei was not the share leader in cockpit domain controllers, cockpit domain-controller chips, or AR-HUD. Desay leads one layer, Qualcomm dominates another, and Horizon has stronger disclosed China-local smart-driving scale than any other direct ADS rival in this pack. Mobileye remains the hardest global ADAS benchmark to dismiss because its public scale proof is larger and newer than Yinwang’s disclosed independent operating metrics. In parallel, Huawei’s investor and partner model may improve alignment with participating automakers, but it can also weaken perceived neutrality for OEMs that want maximum control or do not want to enrich a rival-backed supplier. The underwriting conclusion is therefore that Yinwang’s moat is real only if OEMs keep valuing bundle depth and integration speed more than best-of-breed modules or internal control. The weakest remaining public area is still economics: pricing, take-rate, and
    program-level attach data remain opaque.'
