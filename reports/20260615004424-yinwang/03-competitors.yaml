chapter:
  number: 3
  title: Competitors
  summary: 'Yinwang competes against three different routes at once: direct smart-driving specialists such as Mobileye, Horizon, and Momenta; cockpit and domain-control incumbents such as Desay SV and ECARX; and automakers that increasingly build ADAS, OS, and cockpit layers in house. The strongest public evidence shows Huawei has rare breadth across ADS, cockpit, vehicle control, cloud, and partner-model coverage, but not clear layer leadership in Q1 2026 cockpit-controller, cockpit-chip, or AR-HUD share, where Desay, Qualcomm, and other local incumbents remain ahead.'
sections:
- id: landscape-and-routes
  title: The real competitor set is layered, not one-to-one
  body: Yinwang is not entering a clean single-category market. The official Huawei materials show a bundle that spans Qiankun ADS, Harmony cockpit, vehicle control, vehicle cloud, and adjacent in-vehicle technologies across many partner vehicle brands. That means the right comparison set must include direct ADAS specialists, cockpit/domain-control incumbents, platform-chip gatekeepers, and automakers that internalize the same layers. Mobileye is the global proof-point rival on scaled ADAS commercialization; Horizon is the strongest China-local smart-driving compute and software alternative; Momenta competes as a software-first autonomy brain; ECARX and Desay SV compete for cockpit and domain-controller design wins; Qualcomm captures value underneath many branded solutions through silicon dominance; and XPeng, Li Auto, NIO, BYD, and Xiaomi EV show that the substitute route can be captive internal build rather than an external supplier. The buyer problem is therefore not just feature parity
    but which route minimizes integration friction while preserving control.
