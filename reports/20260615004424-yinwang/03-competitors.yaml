callouts:
- calloutType: strength
  title: The real Huawei wedge is bundling, not layer leadership
  body: No other source set in this chapter shows the same public breadth across ADS, cockpit, vehicle control, cloud, and partner vehicle coverage. That bundle can matter more than any one layer if an OEM mainly wants faster integration and one accountable supplier.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP032
  - CP037
- calloutType: risk
  title: Yinwang still fights uphill against specialists
  body: Qualcomm dominates the underlying cockpit-chip layer, Desay leads cockpit controllers, Horizon has the strongest disclosed local smart-driving footprint, and Mobileye remains the most convincing global ADAS benchmark. Huawei must therefore win by reducing complexity faster than specialists or OEM insourcing can.
  claimRefs:
  - CP008
  - CP011
  - CP017
  - CP018
  - CP033
  - CP034
  - CP039
  - CP040
- calloutType: insight
  title: Internal build is the substitute that can erase supplier margin entirely
  body: When XPeng, Li Auto, NIO, BYD, or Xiaomi EV choose to internalize more of the stack, Huawei is not merely competing with another vendor. It is competing with an OEM decision that supplier economics are less attractive than control, data ownership, and roadmap independence.
