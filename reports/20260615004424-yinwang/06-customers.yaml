artifact: customers
slug: yinwang
runDate: "2026-06-15"
company:
  name: Yinwang
chapter:
  number: 6
  title: Customers
  summary: >-
    Yinwang has real customer proof across more than one automaker and more than one commercialization
    model: public evidence supports production-scale demand at AITO/HIMA, expanding deployments with
    Chery and Voyah, and newer pipeline programs with Wuling and Dongfeng. The strongest positives are
    that end-customer scale is visible through deliveries, stores, apps, and after-sales surfaces rather
    than logos alone; the main negatives are heavy demand concentration in AITO, sparse public retention
    disclosure, and procurement friction from vehicle-program integration plus tighter OTA and marketing
    controls.
sections:
  - id: customer-base-and-segmentation
    title: Customer base, segments, and who actually pays
    body: >-
      Yinwang's customer base is best understood as a layered OEM ecosystem rather than a simple list of
      consumer car buyers. At the deepest level sit the HIMA joint brands, where Huawei's automotive stack
      is embedded into co-created marques including AITO, Luxeed, Stelato, Maextro, and Shangjie. Public
      HIMA and Huawei surfaces show that these brands share not only assisted-driving and cockpit
      components but also stores, apps, service support, and a common commercialization narrative. A
      second layer includes non-HIMA or less tightly branded OEM customers such as Voyah, Avatr, Wuling,
      and Dongfeng programs that use Huawei or Yinwang technologies without always moving into the same
      alliance architecture. The payer is therefore usually the OEM or joint vehicle program, while the
      end user is the car buyer whose experience is shaped by Qiankun driving, HarmonySpace cockpit,
      app-based services, and charging or after-sales infrastructure. This distinction matters because
      public proof is stronger on downstream user reach than on upstream revenue recognition: Yinwang can
      point to stores, app users, chargers, and deliveries, but it does not publicly break out how much
      contract value or recurring software revenue each OEM contributes.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008, CU023, CU048, CU049, CU050, CU051]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-customer-proof-and-production-maturity
    title: "Named customer proof: production versus pilot"
    body: >-
      The proof set is materially better than a logo wall, but it is not uniformly mature across every
      OEM. AITO is the clearest production customer: independent coverage ties it to hundreds of thousands
      of deliveries, a global expansion push, and a large service and charging footprint. Luxeed has moved
      beyond a conceptual partnership as well, with order data for new models and a broader Chery-Yinwang
      expansion that now reaches Jetour and the FREELANDER program. Voyah is the best evidence that
      Yinwang can win outside the original HIMA brand structure, because the relationship now covers smart
      driving, cockpit, and user-operations teams across Voyah's full lineup. By contrast, Maextro,
      Wuling's Huajing S, and Dongfeng's Yijing remain earlier on the maturity curve in the public record:
      they are credible programs with visible launch or cooperation evidence, but their cited proof is
      still more launch-stage and roadmap-oriented than durable delivered-fleet evidence. Stelato sits in
      the middle, with real production and model launches but weaker demand absorption than AITO. The net
      result is a broad customer map with sharply uneven proof density.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU024, CU025, CU026, CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036, CU037, CU038, CU039, CU042]
    tableRefs: [TU003]
    figureRefs: [FU003]
  - id: adoption-trajectory-and-concentration
    title: Adoption trajectory, premium positioning, and concentration risk
    body: >-
      Public demand proxies show that Yinwang has crossed from pilot-scale relevance into industrial-scale
      adoption, but they also expose concentration risk. HIMA reached one million cumulative deliveries
      within 43 months and delivered 46,122 vehicles in May 2026, while Qiankun's assisted-driving
      mileage exceeded 10 billion kilometers by April and 11.47 billion by May according to later
      reporting. Those are meaningful scale markers for an automotive technology supplier. The problem is
      mix balance. The same source set shows that AITO accounted for 82.4 percent of HIMA's May 2025
      deliveries, with Luxeed and Stelato far smaller, and Aito-specific models carrying many of the most
      visible order and cumulative-delivery milestones. The customer base is therefore diversified by logo
      count and OEM type, but not yet clearly diversified by end-market volume. Premium average selling
      price also cuts both ways: HIMA's RMB 390,000 average transaction price shows access to higher-value
      vehicle programs, yet it also means the installed base is concentrated in a narrower, more cyclical
      premium segment where underperforming model launches can quickly change market sentiment.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU042, CU044, CU045, CU047]
    tableRefs: [TU002, TU005]
    figureRefs: [FU002]
  - id: durability-expansion-and-procurement-friction
    title: Durability, expansion, and procurement friction
    body: >-
      The hardest part of the customer story is not signing more OEMs; it is converting visible launches
      into durable economics. The reviewed public corpus does not disclose NRR, GRR, logo churn, renewal
      rates, contract duration, or revenue share by OEM. That means the public market can see demand and
      technical adoption, but not whether Yinwang is retaining software attach, expanding wallet share, or
      keeping bargaining power as more automakers join. The best durability proxies are indirect:
      customer-facing apps and stores, joint user-operations teams, repeated model launches under the same
      brand families, and very high reported assisted-driving usage. Even those positives come with
      friction. Huawei said matching a new vehicle can take six to nine months, which implies a long
      pre-SOP integration cycle, and 2025 Chinese regulatory changes tightened the language, beta-testing,
      and OTA processes around assisted-driving features. For Yinwang, that means expansion is real but
      operationally heavy: each new OEM can broaden the footprint, yet it also adds integration work,
      approval complexity, and negotiation around who controls the end-user relationship.
    claimRefs: [CU003, CU004, CU005, CU006, CU024, CU029, CU040, CU041, CU043, CU044, CU045, CU046, CU047, CU048, CU049, CU050, CU051]
    tableRefs: [TU004]
    figureRefs: [FU004]
callouts:
  - calloutType: strength
    title: Multi-OEM proof is real, not just a partner-logo slide
    body: >-
      Yinwang already has credible production evidence across AITO/HIMA, Chery-linked programs, and
      Voyah's full-lineup rollout, which is much stronger than a pre-revenue partnership narrative.
    claimRefs: [CU011, CU015, CU018, CU024, CU029, CU030, CU031, CU032, CU033]
  - calloutType: risk
    title: AITO still appears to carry the bulk of demand proof
    body: >-
      Public customer breadth is wide, but the strongest volume signals remain concentrated in AITO,
      while public revenue concentration, renewal, and contract-duration disclosure are still absent.
    claimRefs: [CU018, CU019, CU020, CU021, CU046, CU047]
  - calloutType: risk
    title: Expansion requires long integration cycles inside a tighter regulatory box
    body: >-
      New customer wins do not convert instantly because model matching can take six to nine months and
      assisted-driving marketing and OTA changes now face stricter controls in China.
    claimRefs: [CU040, CU041, CU043]
