figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Yinwang's customer path starts with OEM program design, moves through deep stack integration and
      user-service activation, and only later becomes durable recurring economics.
    data:
      items:
        - id: source-oem
          label: Source OEM / program
          actor: OEM strategy, R&D, and procurement teams
          description: >-
            Yinwang first needs an OEM or joint brand willing to buy into the smart-driving, cockpit,
            control, and app-service stack at program level.
          channels: [HIMA joint brand, Qiankun partner, strategic cooperation agreement]
        - id: integrate-stack
          label: Integrate vehicle stack
          actor: OEM engineering plus Yinwang integration teams
          description: >-
            The work then shifts into model matching, validation, feature scoping, and the six-to-nine
            month integration cycle Huawei publicly described.
          channels: [Model matching, validation, OTA planning, regulatory review]
        - id: launch-model
          label: Launch model or brand
          actor: OEM sales and channel teams
          description: >-
            Public proof strengthens once a vehicle is launched, reaches stores, and begins converting
            preorders into deliveries.
          channels: [Launch events, order books, HIMA / OEM stores]
        - id: activate-services
          label: Activate app / service layer
          actor: End customer and post-sale operations teams
          description: >-
            Durable customer value appears only when apps, charging, after-sales, remote services, and
            user operations are active after delivery.
          channels: [AITO app, HIMA app, charging network, customer service]
        - id: expand-program
          label: Expand to follow-on models
          actor: OEM product and commercial teams
          description: >-
            The best proof of expansion is follow-on models, wider brand coverage, and deeper group-level
            adoption across the same automaker.
          channels: [Next model, broader OEM family rollout, user-ops co-creation]
        - id: prove-durability
          label: Prove durable economics
          actor: CFO, sales ops, and investors
          description: >-
            The final step is still mostly missing publicly: recurring revenue, churn, renewal, and
            concentration data by OEM.
          channels: [NRR/GRR, contract renewals, revenue split]
    approximationNotes: >-
      The journey reflects the commercialization sequence implied by the reviewed public evidence; it is
      not a disclosed internal funnel from Yinwang.
    claimRefs: [CU023, CU029, CU040, CU043, CU048, CU049]
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Public evidence narrows from many named OEM proof surfaces to almost no disclosed durability or
      concentration economics.
    data:
      items:
        - label: Named OEM or brand proof surfaces reviewed
          value: 10
        - label: Programs with launch or production evidence
          value: 8
        - label: Programs with disclosed order or delivery metrics
          value: 6
        - label: Programs with visible app, service, or user-ops proof
          value: 3
        - label: Programs with public renewal or revenue-share disclosure
          value: 0
    approximationNotes: >-
      Counts summarize the reviewed public evidence set in this chapter and are not Yinwang's internal
      customer totals.
    claimRefs: [CU011, CU012, CU018, CU024, CU029, CU036, CU038, CU046, CU047, CU048]
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      AITO has the strongest current proof stack, Voyah and Chery are credible second-wave customers,
      while Maextro, Wuling, and Dongfeng remain earlier-stage in public evidence.
    data:
      columns: [AITO / Seres, Luxeed / Chery, Stelato / BAIC, Maextro / JAC, Voyah, "Avatr / Wuling / Dongfeng"]
      rows:
        - label: Production maturity
          values: [High, High, Medium, Low, High, Low-Medium]
        - label: Outcome specificity
          values: [High, Medium, Medium, Low, Medium, Low]
        - label: After-sales or user-ops visibility
          values: [High, Medium, Low, Low, High, Low]
        - label: Retention visibility
          values: [Low, Low, Low, Low, Low, Low]
        - label: Concentration relief
          values: [Low, Medium, Low, Low, Medium, Low]
    approximationNotes: >-
      The grades reflect proof quality in public sources, not customer quality. Low retention visibility
      means the disclosure is absent, not that the customer relationship is weak.
    claimRefs: [CU019, CU021, CU031, CU037, CU039, CU046, CU047, CU050]
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: wide
    summary: >-
      Public evidence gives only proxy-level durability proof: repeat demand and service usage exist, but
      renewal economics remain undisclosed across every OEM cohort.
    data:
      columns: [Repeat demand proof, Service / ops proof, Renewal economics disclosure]
      rows:
        - label: AITO / Seres anchor programs
          values: [90, 85, 0]
        - label: Luxeed / Chery expansion programs
          values: [70, 35, 0]
        - label: Voyah software-partner lane
          values: [60, 80, 0]
        - label: Emerging pipeline programs
          values: [20, 10, 0]
    approximationNotes: >-
      This is not a true revenue-retention cohort. The percentages score the depth of public repeat,
      service, and renewal evidence across customer groups, with 0 meaning no public disclosure.
    claimRefs: [CU017, CU029, CU031, CU044, CU045, CU046, CU047, CU048]
