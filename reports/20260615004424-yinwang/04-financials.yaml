      - Sustained innovation spend can keep returns back-loaded
      - Scale may require working capital before revenue is collected
      - Support-heavy launches can depress margin if not fully reimbursed
      - The valuation is transaction-backed but strategic, not fully market-clearing
      - Liquidity risk remains the central underwriting blind spot
