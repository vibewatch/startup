  title: The hardest finance question is still cash, not demand
  body: Public sources prove scale, shipments, and partner interest, but they still do not show standalone cash, burn, runway, or stream-level margin. That keeps classic underwriting risk concentrated in liquidity and cash conversion rather than in the existence of market demand.
