- id: capital-adequacy-transaction-mark-and-control
  title: Capital adequacy, transaction-backed valuation, and control
  body: 'Yinwang’s valuation is backed by cash, but its liquidity is not. Avatr agreed to buy 10% of Yinwang for RMB 11.5 billion in August 2024, and Seres matched that price days later for another 10%, implying a RMB 115 billion equity valuation with Huawei still owning 80% afterward. Changan’s Avatr disclosure said the board would have seven seats, with Huawei entitled to nominate six and Avatr one, so Huawei kept governance control while monetizing strategic alignment. Xu Zhijun later argued the valuation was negotiated about a year earlier and looked low by late 2024, while also saying investors should be automakers rather than financial investors and that Yinwang remained open to additional OEM shareholders. Those facts matter because they make the mark more strategic than market-clearing: the price is real, but the buyer set is intentionally narrow. Public sources also show adjacent ecosystem cash flows such as Seres’ separate RMB 2.5 billion Aito trademark-and-patent purchase from
    Huawei. What public sources do not show is current Yinwang cash, burn, runway, debt, or covenant headroom, so capital adequacy still cannot be underwritten from the transactions alone.'
