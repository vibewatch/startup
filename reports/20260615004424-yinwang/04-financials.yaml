- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on the analysis
  - current public proxy
  - exact diligence path
  rows:
  - - Standalone revenue mix by product family
    - Cannot tell how much revenue is hardware, software, cloud, or launch services
    - Huawei IAS segment revenue and solution-scope descriptions
    - Request a product-family revenue bridge for 2024, YTD 2025, and backlog by module
  - - Gross margin by module and service line
    - Prevents underwriting whether 2024 profit was high quality or mix-driven
    - Parent-level profitability statement only
    - Request gross margin waterfall for ADS, cockpit, control, cloud, and launch-support services
  - - Current unrestricted cash and credit headroom
    - Blocks capital adequacy and financing-dependency analysis
    - Stake-sale proceeds and old loss disclosures only
    - Request treasury report, bank balances, facility availability, and covenant headroom
  - - Monthly burn and runway
    - Prevents testing whether profitability is durable or still subsidy-sensitive
    - Historic loss levels and profitability claims only
    - Request monthly management accounts and 12-month liquidity bridge
  - - Customer concentration and OEM revenue split
    - Cannot tell whether one or two partner groups dominate revenue quality
    - HIMA deliveries and partner names only
    - Request revenue by OEM, brand, and launch cohort
  - - Realized module pricing and contract structure
    - Stops CAC/payback, unit margin, and retention analysis
    - Vehicle list prices and stake-transfer pricing only
    - Request master commercial terms, ASP by module, and discount ladders
  - - IP-transfer and related-party economics with Huawei parent
    - Necessary to know what profit pool sits inside Yinwang versus Huawei
    - Public stake sales plus separate Aito IP transaction
    - Request IP schedule, transfer-pricing policy, and related-party revenue/cost disclosures
  notes: These gaps are the finance blockers that remain after using all accessible public sources; blank data is treated as a diligence blocker rather than filled by narrative.
