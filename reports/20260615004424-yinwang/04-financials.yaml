  - - Stelato S9 launch price
    - RMB 399,800 Max / RMB 449,800 Ultra
    - Vehicle sticker price, not Yinwang realized content value
    - Shows price band for a BAIC/Huawei flagship sedan launch
    - Actual sell-through, rebate levels, and Yinwang revenue per delivered car
  - - Avatr equity transfer
    - RMB 11.5 billion for 10% of Yinwang
    - Strategic equity price, not commercial module pricing
    - Provides a hard valuation anchor
