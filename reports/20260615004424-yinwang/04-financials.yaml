- id: cost-structure-profitability-and-comparable-benchmarks
  title: Cost structure, profitability inflection, and comparable public benchmarks
  body: 'The cost story is more visible than the margin story. Richard Yu said Huawei’s automotive business once lost as much as RMB 10 billion annually and still lost about RMB 6 billion in 2023, which frames Yinwang as the product of a multi-year incubation effort rather than a freshly profitable carve-out. By May 2024 he said the car business had turned profitable in the first quarter, and Huawei’s 2024 annual report later stated that intelligent automotive solutions turned a profit for the first time in 2024. Xu Zhijun then said both the car BU and Yinwang were profitable in the first half of 2024. What remains missing is the bridge between those statements and real unit economics: Zhixuan includes retail, marketing, and quality-management obligations, Luxeed’s S7 ramp was delayed by chip shortages and plant relocation, and no public source breaks out hardware versus software margin. The comparable set is therefore most useful as a disclosure benchmark. Mobileye disclosed 2025 revenue,
    gross margin, and operating cash flow; ECARX disclosed revenue, gross margin, backlog, and net loss; NIO disclosed full-year revenue, vehicle margin, and year-end cash; XPeng disclosed revenue, gross margin, vehicle margin, and net loss; and Horizon disclosed mass-production scale. Yinwang has not matched that level of financial specificity.'
