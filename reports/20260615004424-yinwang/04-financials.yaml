  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current liquidity
    missingEvidence: Standalone Yinwang cash, restricted cash, and available credit headroom.
    whyItMatters: Without current liquidity detail, capital adequacy and financing dependency cannot be underwritten responsibly.
    diligencePath: Request treasury balances, bank statements, facility availability, and any board-approved minimum-cash thresholds.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: burn and runway
    missingEvidence: Monthly operating burn, capex, and runway bridge for the legal entity or carved-out business.
    whyItMatters: The 2024 profitability narrative could still mask working-capital draw or launch-support cash burn.
    diligencePath: Request monthly management accounts and a 12-month liquidity bridge with downside and base-case assumptions.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: material
    topic: realized pricing
    missingEvidence: Per-module pricing, discount ladders, software renewal terms, and commercial take rates by OEM program.
    whyItMatters: Without realized pricing, revenue quality and margin durability cannot be separated from end-vehicle launch headlines.
    diligencePath: Request master commercial terms plus average selling price and discount data by major module family.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: margin and concentration
    missingEvidence: Gross margin by stream plus revenue split by OEM, brand, and launch cohort.
    whyItMatters: Public traction is not enough if most profit depends on one partner group or if launch-support costs absorb the margin pool.
    diligencePath: Request customer revenue concentration, cohort-level contribution margin, and gross-margin waterfalls for hardware, software, and services.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
