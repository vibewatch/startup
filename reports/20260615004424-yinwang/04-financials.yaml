- id: TI006
  title: Public comparable benchmark table
  columns:
  - entity
  - disclosed scale metric
  - disclosed margin or profit cue
  - why it matters for Yinwang
  - source vintage
  rows:
  - - Huawei IAS
    - CNY 26.353bn 2024 revenue; >23m components shipped; >600 partners
    - Officially turned profitable in 2024
    - Best official proxy for the carved-out business, but still parent-level not standalone Yinwang
    - Huawei 2024 annual report
  - - Mobileye
    - 2025 revenue $1.894bn; 8-year future expected automotive revenue pipeline $24.5bn
    - Q4 2025 gross margin 45%; 2025 operating cash flow $602m
    - Shows what a mature ADAS supplier discloses on margin and cash generation
    - Business Wire results and Mobileye IR
  - - ECARX
    - 2025 revenue $847.9m; order backlog >$2.5bn; over 11m vehicles serviced
    - 19% gross margin; net loss $68.9m after 50% improvement
    - Useful Chinese auto-tech benchmark showing that backlog and shipments can coexist with ongoing net losses
    - PR Newswire results and SEC filing index
  - - NIO
    - 2025 revenue RMB 87.4875bn; 326,028 full-year deliveries
    - Q4 2025 vehicle margin 18.1%; year-end cash and investments RMB 45.9bn
    - Shows that listed Chinese smart-EV peers disclose both operating scale and liquidity in far more detail than Yinwang does
    - Nasdaq 2025 results release
  - - XPeng
    - 2025 revenue RMB 76.72bn
    - 18.9% gross margin; 12.8% vehicle margin; RMB 1.14bn net loss
    - Shows public Chinese smart-EV disclosures provide more financial transparency than Yinwang does today
    - HKEX annual-results filing and XPeng IR
  - - Horizon Robotics
    - 10m+ Journey shipments; 400+ design wins; 40+ OEMs and brands
    - Scale proxies disclosed, but no margin in the accessed page
    - Shows smart-driving infrastructure peers publicly report industrial adoption metrics even when monetization detail is selective
    - Horizon official site
  notes: The comparable set is not a valuation comp sheet; it is a disclosure benchmark showing what adjacent public companies make visible that Yinwang still withholds.
