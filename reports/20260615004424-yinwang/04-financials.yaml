  - diligence ask
  rows:
  - - Smart driving systems
    - ADAS / intelligent-driving hardware-software stack sold to OEM programs
    - Huawei automotive materials and Seres deal coverage list smart driving as a core solution area
    - Core monetization rail, but standalone revenue mix is undisclosed
    - Medium
    - Request revenue split, attach rate, and gross margin by ADAS tier
  - - Smart cockpit systems
    - HarmonySpace cockpit and in-car software stack supplied to partner brands
    - Huawei automotive materials and Seres coverage list smart cockpit solutions
    - Core monetization rail, but no public take-rate disclosure
    - Medium
    - Provide per-vehicle cockpit content value and software-renewal economics
  - - Vehicle control / xMotion / optics
    - Control-domain and optics modules bundled into the platform offer
    - Huawei official materials cite vehicle control and optics as part of the portfolio
    - Likely material in premium programs, but no standalone pricing is public
    - Low-Medium
    - Disclose bill-of-materials ownership, pricing, and warranty cost share
  - - Vehicle cloud and digital services
    - Cloud-linked services and software layers sold alongside vehicle hardware
    - Seres transaction coverage lists cloud-computing products and solutions
    - Visible in scope, but not separated financially
    - Low-Medium
    - Provide software vs hardware revenue mix and recurring-service rates
  - - Zhixuan / HIMA integration services
    - Retail, marketing, and quality-management support layered on partner launches
    - Richard Yu described the deep-integration model in March and May 2024 comments
    - Important support rail that likely boosts revenue and cost together
    - Medium
    - Provide service-fee structure, cost recovery, and support headcount
  - - Strategic ecosystem monetization
    - Minority stake sales monetize platform scarcity rather than current operating margin
    - Avatr and Seres each paid RMB 11.5bn for 10% stakes
    - Real cash valuation proof, but not operating revenue
    - High for valuation, low for recurring economics
    - Separate equity proceeds from operating revenue and disclose use of funds
  notes: This table distinguishes operating solution rails from strategic equity monetization and explicitly flags where public sources stop short of realized revenue mix or margin.
