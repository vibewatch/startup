    - Whether any commercial discounts or exclusivity were paired with ownership
  - - Module / software contract pricing
    - Not publicly disclosed
    - Realized pricing unknown
    - Public sources prove product scope but not take rates
    - Per-SKU pricing, discount ladders, renewal terms, and channel economics
