  body: Two separate RMB 11.5 billion stake sales make the RMB 115 billion mark hard to dismiss, yet Huawei kept control and limited the buyer set to strategic automakers, which means the price says more about ecosystem scarcity than about open-market float or fully disclosed cash generation.
