- id: public-comps-and-relative-support
  title: Public comps support strategic scarcity, but they do not yet support a clean outside-in bargain at the current mark
  body: |-
    The cleanest way to pressure-test Yinwang is to translate the mark into dollars and compare it against public peers that actually disclose financials. Using the run-date USD/CNY rate, RMB 115 billion is about USD 17.0 billion, while Huawei's 2024 Intelligent Automotive Solution revenue proxy converts to roughly USD 3.89 billion, implying about 4.4x sales. That is close to Mobileye's mid-2026 revenue multiple, but well above ECARX and well above the approximately 1.0x to 1.2x bands implied by NIO and XPeng. Absolute market-cap comparisons are even harsher: Yinwang's implied value sits above Mobileye, Horizon Robotics, Desay SV, ECARX, NIO, XPeng, and Li Auto in the retained set. Bulls can argue those are imperfect comps because Yinwang bundles more stack layers, but that argument only holds if bundling ultimately converts into disclosed profitability, repeatable external-OEM wins, and stronger software-like economics than today's public evidence shows. Until then, the public comp set says the mark is ambitious rather than obviously cheap.
