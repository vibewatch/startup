- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  - Impact on call
  rows:
  - - Standalone financial statements
    - 2025 and 2026 Yinwang revenue, gross margin, EBIT, and cash flow
    - Would decide whether 115bn is platform-priced or overpaying for opacity
    - Request audited carve-out statements from Huawei/Yinwang finance
    - Primary upgrade blocker
  - - Cash, debt, and runway
    - Current balance sheet, debt, covenants, and use of Avatr/Seres proceeds
    - Needed to test dilution and resilience if launches slip
    - Request cap table plus treasury and debt schedules
    - High impact on risk rating
  - - Shareholder rights
    - Reserved matters, vetoes, transfer terms, and any preference stack
    - Minority economics matter more when Huawei retains control
    - Obtain shareholder agreements and board documents
    - High impact on governance comfort
  - - OEM concentration and pipeline
    - Revenue share by OEM plus external order backlog outside core HIMA
    - Determines whether Yinwang is becoming a neutral platform or a concentrated ecosystem asset
    - Request customer cohort and backlog bridge
    - High impact on multiple support
  - - Pricing and take rates
    - Per-vehicle content value by ADS, cockpit, control, and service layer
    - Needed to convert market-size narratives into real monetization
    - Request pricing waterfalls and gross-margin by product family
    - High impact on bull-case credibility
  notes: These asks are the minimum dataset needed to move from a strategic admiration case to a true investment-underwriting case.
