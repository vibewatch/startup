- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bull thesis
  - Anti-thesis
  - Evidence today
  - What changes the view
  rows:
  - - Platform breadth
    - Yinwang can sell ADS, cockpit, control, and cloud content together across many OEMs
    - Breadth does not automatically translate into software-like margins or neutral market access
    - Huawei official materials support broad scope, but not monetization detail
    - Show standalone attach rates and mix by module
  - - Cash mark
    - Two strategic buyers validated a real RMB 115bn price
    - Strategic buyers are not the same as broad financial-market price discovery
    - Avatr and Seres both paid RMB 11.5bn for 10%
    - Add third-party or public-market validation
  - - Profitability inflection
    - Huawei says the inherited business turned profitable in 2024
    - Segment profitability can hide support costs, concentration, or accounting boundaries
    - Q1/H1 2024 profitability comments and Huawei 2024 reporting are positive
    - Publish Yinwang-only gross margin and EBIT bridge
  - - Demand momentum
    - HIMA deliveries and ecosystem scale show continuing downstream pull-through
    - Model-level misses can still hit sentiment fast, as Stelato did
    - May 2026 deliveries remain healthy but not sufficient to prove take-rate durability
    - Show external-OEM backlog and non-HIMA revenue share
  - - Exit path
    - Future OEM investors or an eventual IPO could widen validation and liquidity
    - No current IPO timetable means liquidity is still mostly theoretical for outsiders
    - News18a says no IPO timetable exists in 2026
    - Announce listing process or broader funding round with fuller disclosure
  notes: Each row pairs a real positive with the specific evidence gap that still prevents a clean upgrade to buy.
