- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation logic
  - Range (RMB bn)
  - Probability signal
  - Downside / upside trigger
  rows:
  - - Bull
    - Standalone revenue scales into low-to-mid RMB 30bn range, multi-OEM breadth broadens beyond core HIMA, and disclosed margins support platform economics
    - Roughly 4.5x-5.5x sales on stronger disclosed economics, which is above the current proxy multiple but still anchored to a Mobileye-like quality argument
    - 150-190
    - 'Needs proof, not faith: profitability must persist and external OEM breadth must become visible'
    - Upgrade only after audited standalone metrics and customer breadth emerge
  - - Base
    - Huawei's 2024 IAS revenue proxy is directionally useful, but disclosure, concentration, and liquidity risk still deserve a discount
    - Roughly 2.8x-3.6x the public revenue proxy, reflecting strategic scarcity but also a meaningful opacity haircut
    - 85-110
    - Best fit with current evidence because the business looks real yet under-disclosed
    - Likely path if no major negative surprise appears but disclosure remains thin
  - - Bear
    - Standalone economics prove hardware-heavy, concentrated, or more launch-support intensive than the market currently assumes
    - Roughly 1.5x-2.0x a lower RMB 18-22bn revenue outcome with multiple compression and weaker demand confidence
    - 35-55
    - Becomes more credible if public comps stay cheap or flagship ecosystem launches wobble
    - Triggered by margin disappointment, customer concentration, or momentum slippage
  notes: Ranges are estimated scenario bands, not management guidance or investment-offer prices.
