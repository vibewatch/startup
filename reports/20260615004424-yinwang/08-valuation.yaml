  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-financials
    missingEvidence: Audited Yinwang-only revenue, gross margin, EBIT, cash flow, and balance-sheet statements for 2024-2026.
    whyItMatters: Without standalone economics, the current mark can be compared only to proxies and not to the company's actual unit economics.
    diligencePath: Request audited carve-out statements and a management bridge from Huawei IAS reporting to Yinwang standalone accounts.
  - type: private-evidence-only
    severity: material
    topic: minority-rights
    missingEvidence: Shareholder agreement terms covering reserved matters, transfer rights, vetoes, anti-dilution, and dividend preferences for Avatr and Seres.
    whyItMatters: At a high entry valuation, governance and downside-protection terms materially affect real investor returns.
    diligencePath: Obtain the shareholder agreement, board charter, and any ancillary IP or supply-side side letters.
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue split by OEM, non-HIMA backlog, and module attach rates by partner program.
    whyItMatters: The bull case depends on Yinwang becoming a broad platform rather than a concentrated ecosystem asset.
    diligencePath: Request cohort revenue, backlog, and attach-rate tables by OEM and by product family.
  - type: stale
    severity: minor
    topic: valuation-mark-vintage
    missingEvidence: A new external financing mark or later secondary price set after the 2024 negotiations.
    whyItMatters: Huawei itself says the current valuation was negotiated earlier, so investors lack a fresher external mark.
    diligencePath: Track any new OEM investment, secondary transfer, or IPO filing that refreshes the valuation reference point.
