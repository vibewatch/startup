- id: TV001
  title: Recommendation summary table
  columns:
  - Decision field
  - Current reading
  - Why it reads that way
  - Upgrade condition
  - Downgrade condition
  rows:
  - - Recommendation
    - research-more
    - Real transaction mark but inadequate standalone disclosure for conviction entry
    - Standalone audited revenue, margin, cash, and governance disclosures emerge
    - No new disclosure and ecosystem momentum cools
  - - Confidence
    - medium
    - Cash valuation mark and public-peer data are concrete, but Yinwang-only economics are still hidden
    - A fuller disclosure set reduces inference load
    - Key assumptions keep resting on proxies
  - - Risk rating
    - high
    - Partner concentration, governance opacity, and price risk can impair returns even if technology remains relevant
    - Customer breadth and minority protections become visible
    - Flagship launch volatility repeats or concentration proves acute
  - - Valuation stance
    - stretched
    - RMB 115bn sits above most retained public comps on absolute cap and above most on sales multiple
    - Price resets toward base-case band or disclosures prove Mobileye-like quality
    - Public comps compress or disclosed margins underwhelm
  - - Entry discipline
    - Wait for better proof or better price
    - Today's mark capitalizes upside before Yinwang publishes standalone accounts
    - Price falls nearer RMB 85-110bn or disclosure quality improves sharply
    - Strategic scarcity alone keeps being used to avoid hard economics
  notes: This table translates the evidence pack into an investability decision rather than into a generic company-quality score.
