- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory hardening
    - OTA or L3/L4 approval friction
    - Material feature launch delayed or approval denied for a flagship program
    - Pause underwriting until approval path is clear
  - - Safety-event risk
    - Recall-style remediation or major casualty-linked investigation
    - Public incident triggers regulator filing, recall, or software freeze
    - Reprice sharply and demand full incident ledger
  - - Partner concentration
    - Delivered volume misses at flagship OEMs
    - Two consecutive major launch misses or weak order conversion
    - Cut volume assumptions and demand concentration discount
  - - Capital intensity
    - R&D spend rises without standalone disclosure or margin evidence
    - Capital needs increase while standalone economics remain opaque
    - Require financing plan before new capital deployment
  - - Governance overlap
    - Customer-shareholder conflicts or weak independent oversight
    - No credible independent governance added as partner base widens
    - Treat governance discount as persistent
  - - Evidence quality gap
    - No model-level safety or reliability disclosure despite larger fleet
    - Public corpus still lacks third-party safety evidence after further scale-up
    - Move thesis to research-more or avoid
  notes: Triggers are intentionally monitorable and tied to public or management-deliverable evidence rather than generic
    macro concerns; they define when the investment case should be paused or repriced.
