  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-financial-disclosure
    missingEvidence: Standalone Yinwang revenue, gross margin, burn, capex, and cash runway disclosures.
    whyItMatters: Without standalone financial statements, investors cannot test whether the implied valuation is supported
      by durable unit economics or only by ecosystem expectations.
    diligencePath: Request audited standalone financials, management accounts, and customer-level revenue concentration schedules
      from management.
    relatedQuestionRefs:
    - QR022
  - type: private-evidence-only
    severity: material
    topic: ip-defensibility
    missingEvidence: Patent portfolio, indemnity terms, and internal trade-secret controls specific to Yinwang's transferred
      Huawei automotive assets.
    whyItMatters: The public record shows ambitious technical claims but not the legal moat that protects them if staff leave
      or OEMs push for deeper source-code access.
    diligencePath: Request patent schedules, major software-license terms, and employment or non-disclosure controls covering
      key autonomy and control modules.
    relatedQuestionRefs:
    - QR007
  - type: private-evidence-only
    severity: material
    topic: model-level-safety-evidence
    missingEvidence: Model-level disengagement, incident, recall, and third-party validation statistics for Qiankun deployments
      by OEM and software version.
    whyItMatters: The reviewed sources establish scale and regulation, but not whether field safety performance is strong
      enough to support faster L3/L4 commercialization.
    diligencePath: Request regulator correspondence, internal incident dashboards, insurer loss data, and independent validation
      reports by model and release channel.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue split by OEM, model family, and strategic shareholder, plus contract duration and termination
      terms.
    whyItMatters: The visible pipeline is broad, but concentration risk cannot be quantified without knowing which programs
      actually contribute the bulk of revenue and cash collection.
    diligencePath: Request top-customer concentration tables, backlog by OEM, and master-supply or software-operation agreement
      summaries.
    relatedQuestionRefs:
    - QR015
    - QR017
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: post-sale-liability
    missingEvidence: Template indemnities, product-liability allocation, and OTA approval workflows between Yinwang and OEM
      partners.
    whyItMatters: Public sources show stricter recall and OTA rules, but not which party bears economic liability when a software
      defect or marketing misstatement triggers remediation.
    diligencePath: Review sample OEM commercial agreements and recall-response playbooks with counsel.
    relatedQuestionRefs:
    - QR004
    - QR011
    relatedTableRefs:
    - TR001
