      Month-only dates preserve source precision. The assigned evidence supports seven distinct dated
      milestone items rather than the planned eight; the shortfall is recorded as an evidence gap.
    claimRefs: [CO004, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013]
