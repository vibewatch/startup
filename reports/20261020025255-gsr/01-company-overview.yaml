    columns: [Stakeholder, Relationship, Strategic importance, Control or economics, Diligence ask]
    rows:
      - [SC Ventures, "Strategic shareholder", "Bank-affiliated institutional infrastructure and tokenization relationship", "Undisclosed", "Obtain subscription documents, ownership, board rights, preferences, and follow-on obligations"]
      - [Standard Chartered, "Parent of SC Ventures", "Banking infrastructure and institutional ecosystem context", "No direct GSR ownership disclosed", "Clarify commercial agreements, branding rights, and regulated-service dependencies"]
      - [Autonomous, "Acquired operating company", "Launch operations, operational support, and financial infrastructure", "$57 million combined acquisition price with Architech", "Review retention, integration milestones, customer transfer, and purchase-price allocation"]
      - [Architech, "Acquired advisory business", "Foundation of GSR Digital Asset Advisory", "$57 million combined acquisition price with Autonomous", "Review revenue quality, key-person retention, conflicts, and delivery liability"]
      - [Libeara, "Tokenization platform backed by SC Ventures; GSR investee", "Connects tokenization capabilities to the strategic partnership", "GSR investment amount undisclosed", "Obtain investment terms, commercial commitments, related-party controls, and pipeline evidence"]
    notes: >-
      Partial map of named strategic stakeholders in the assigned evidence; economics are shown only where
      explicitly disclosed, and the $57 million is combined acquisition consideration rather than a
      company valuation.
    enumerationScope:
      coverage: partial
      basis: >-
        Named investors, parent institutions, acquired companies, and strategic platforms appearing in
        retained sources dated or accessed through 2026-10-20.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO012]
