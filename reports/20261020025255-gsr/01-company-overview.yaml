schemaVersion: "report-v2"
artifact: company-overview
slug: gsr
runDate: 2026-10-20
company:
  name: GSR
chapter:
  number: 1
  title: Company Overview
  summary: >-
    GSR presents as a regulated, privately held crypto capital-markets provider whose 2026 expansion
    combined a $57 million acquisition with SC Ventures becoming its first external strategic
    shareholder. The assigned evidence establishes the operating model and corporate-development
    milestones, but not current valuation, revenue, headcount, customer count, ownership terms, or
    complete governance.
sections:
  - id: identity-and-operating-footprint
    title: Identity and operating footprint
    body: >-
      GSR describes itself as a crypto capital-markets partner spanning market making, institutional
      trading, liquidity, risk management, venture backing, and advisory. Its official site frames the
      addressable relationships broadly: token issuers, exchanges, financial institutions, fintech and
      payment companies, and asset managers. That breadth is strategically useful but does not establish
      revenue mix or segment economics. The clearest operating-footprint evidence is regulatory rather
      than financial: GSR identifies a US money-services entity, a UK entity registered for certain
      cryptoasset activities, and a Singapore entity authorized as a Major Payment Institution. GSR One
      adds a unified client storefront for market making, systematic OTC, treasury services, and
      operational workflows. Headquarters and legal-parent structure remain unverified in the assigned
      evidence.
    claimRefs: [CO001, CO002, CO003, CO014, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Independent and syndicated May 2026 coverage consistently identifies Xin Song as chief executive,
      providing a current leadership anchor for the strategic investment announcement. The same source
      set does not identify GSR's founders, board composition, voting control, succession arrangements,
      or broader executive team. That is an evidence limitation rather than proof that such governance
      structures are absent. The available record therefore supports only a partial leadership inventory
      and leaves key-person dependence unresolved. Management diligence should prioritize founder and
      board identities, reserved matters, executive tenure, regulated-entity accountability, and a
      succession plan, because the public narrative currently concentrates corporate strategy in the
      chief executive's statements.
    claimRefs: [CO005, CO015]
    tableRefs: [TO002]
  - id: financing-and-corporate-development
    title: Financing and corporate development
    body: >-
      GSR was founded in 2013, according to multiple 2026 reports. The most consequential current
      financing event is SC Ventures' May 2026 strategic stake, described as GSR's first external
      strategic shareholder. That validates bank-backed strategic interest but does not reveal the check
      size, ownership percentage, valuation, security, board rights, or investor protections. Corporate
      development is more quantifiable: GSR announced a $57 million acquisition of Autonomous and
      Architech on March 17, 2026. The company said Autonomous would continue under its existing brand,
      while Architech would underpin GSR Digital Asset Advisory. The sequence also includes GSR's April
      investment in SC Ventures-backed Libeara and a May launch of the Crypto Core3 ETF, indicating
      expansion beyond market making into tokenization, advisory, treasury, and asset-management
      adjacencies.
    claimRefs: [CO004, CO006, CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: decision-implications-and-open-metrics
    title: Decision implications and open metrics
    body: >-
      The evidence supports a strategic-growth profile, not a verified financial-scale profile. GSR has
      broadened its product perimeter and added a bank-affiliated strategic shareholder, but none of the
      eight retained sources discloses current revenue, run rate, cash, debt, headcount, active customer
      count, or standalone valuation. Funding raised cannot be inferred from acquisition consideration,
      and an undisclosed strategic stake cannot be converted into cash available or ownership economics.
      KuCoin's analysis also presents a conditional bear case in which cross-border tokenization rules
      slow institutional adoption; that is a scenario, not a recorded enforcement event. Investment
      underwriting therefore requires private financials, cap-table documents, customer and counterparty
      concentration, regulatory permissions by service and geography, and post-acquisition integration
      evidence.
    claimRefs: [CO007, CO015, CO016]
callouts:
  - calloutType: strength
    title: Strategic validation without disclosed economics
    body: >-
      SC Ventures becoming the first external strategic shareholder is meaningful institutional
      validation, but the investment amount and governance terms remain undisclosed.
    claimRefs: [CO006, CO007]
  - calloutType: risk
    title: Scale is not financially verified
    body: >-
      Product breadth and a $57 million acquisition do not substitute for current revenue, liquidity,
      customer concentration, headcount, or valuation evidence.
    claimRefs: [CO008, CO015]
