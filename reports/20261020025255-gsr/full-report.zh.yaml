      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 首要投资逻辑破坏触发条件
            body: 如果逐产品的法律审查显示，GSR 无法通过适当授权的实体继续开展重要的美国 OTC 或做市活动，且没有可行的安全港、重组或持牌替代方案，应视为投资逻辑已经失效。
            calloutType: risk
