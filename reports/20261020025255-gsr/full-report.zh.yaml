      - number: '1.2'
        title: 领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              独立报道及转载的 2026 年 5 月报道均将 Xin Song 指认为首席执行官，为战略投资公告提供了当前领导层锚点。同一组来源没有披露 GSR
              的创始人、董事会构成、投票控制、继任安排或更广泛的管理团队。这是证据局限，不代表这些治理结构不存在。因此，现有记录只能支持部分领导层清单，关键人物依赖仍未解决。管理层尽调应优先确认创始人和董事会成员、保留事项、管理层任期、受监管实体的责任归属及继任计划，因为目前公开叙事将公司战略集中在首席执行官的表述上。
            claimRefs:
              - CO005
