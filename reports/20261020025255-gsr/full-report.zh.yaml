      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开产品材料指向多个买方群体，而不是单一同质客户：代币基金会和发行方、机构交易公司、加密资金管理团队、交易所或市场，以及准备融资或上市的项目。日常用户可能包括交易、财务、资金管理、运营、代币设计和发行团队；付款方可能是机构、基金会或项目资金库。这个付款方判断具有方向性，但不足以建立收入模型，因为保留来源没有披露预算归属、定价方式、合同期限或
              GSR 赢得的客户支出份额。表面上的采用路径可能从发行、流动性、执行或资金控制等具体需求开始，再通过 GSR One 或一体化咨询平台扩展到更广泛的工作流。转化和续约证据并未公开。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              核心增长逻辑是，碎片化的采购需求会推动客户寻找覆盖设计、发行、流动性、执行和资金管理的协调型供应商。机构对代币化资产的兴趣可能扩大这一需求，而收购也增加了可能延长客户关系的能力。但约束同样重要。代币化不会自动创造流动性：法律权利、发行、登记、分销、买卖需求和执行能力必须同时匹配。整合也不能证明采用或经济性；客户使用、服务交付、续约、定价、分部收入和风险调整后盈利能力仍未验证。就估值而言，市场逻辑可以支持对更广泛资本市场平台的期权，但不能支持一个数值化的市场倍数。任何溢价都应以证据为前提，证明一体化产品把碎片化需求转化为经常性、可盈利且可防守的收入，而不是带来更多复杂性。
            claimRefs:
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 机会比做市更广，但比加密活动更窄
            body: GSR 已证明其服务边界更广，但只有外部服务支出属于可服务市场。不能把交易名义额、代币 FDV 和客户资金资产资本化，仿佛它们就是 GSR 的收入。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: 市场规模尚不足以支持决策
            body: 在取得买方数量、预算、定价、地域准入、转化和分部经济性之前，任何数值化市场倍数都建立在未经支持的分母上。
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
              - CM016
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合比专业做市商更广。GSR 不仅与 Wintermute、B2C2、Keyrock 和 DWF Labs 等直接流动性提供商竞争，也与 DigiFT
              等受监管交易所和代币化平台竞争；进入数字资产领域的银行、券商、资产管理机构和咨询公司，以及协调多个供应商的买方内部资金或交易团队，同样构成替代。公开报道显示，每家被点名的做市同行都在从流动性延伸到相邻产品、地域或受监管活动，因此
              GSR 的扩张更像行业融合，而不是创造一个无人竞争的品类。不过，GSR 已有一定运营规模证据：Forbes 报道称，截至 2025 年 10 月，其交易额超过 $1 trillion，并为超过 250
              种代币提供流动性。这些活动指标说明触达范围，不代表市场份额、收入、盈利能力或最佳执行。
            claimRefs:
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP014
      - number: '3.2'
        title: 广度、能力与差异化
        blocks:
          - type: paragraph
            body: >-
              GSR 最清晰的差异化方向，是把买方通常分开采购的服务组合起来。GSR One 通过一个入口提供做市、系统化 OTC、资金管理服务和运营流程。2026 年 3 月对 Autonomous 和 Architech
              的收购，以披露的合计 $57 million 对价增加了发行运营、融资、治理、代币设计、交易所策略和资金管理支持。GSR 与 DigiFT 的关系又把能力延伸到代币化现实世界资产的系统化二级 OTC
              流动性，包括链上结算。这可以降低供应商协调成本并创造交叉销售机会，但现有证据只证明提供范围，不证明采用、服务质量或已实现的整合协同。因此，它支持的是能力广度逻辑，而不是已经验证的经济护城河。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
              - CP009
              - CP010
              - CP011
              - CP014
      - number: '3.3'
        title: 监管覆盖与分销能力
        blocks:
          - type: paragraph
            body: >-
              监管基础设施正成为竞争产品的一部分。Forbes 报道称，GSR
              计划收购的美国券商牌照将使其能够开展过去通过第三方完成的证券和融资工作；同一篇报道还称，当时没有其他大型加密做市商持有美国券商牌照，但预计竞争者会跟进。到 2026 年 9
              月，公司发布的公告还描述了开曼群岛分别针对证券交易和资产管理的登记，并明确提醒许可不会跨司法管辖区转移。因此，定位图将牌照和受监管交易对手视为分销证据，而不是执行质量证明。DigiFT
              同时是伙伴和相邻竞争者，因为即使 GSR 提供流动性，其持牌、端到端代币化平台仍可能掌握客户关系。
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP009
              - CP011
      - number: '3.4'
        title: 定价、转换成本与护城河检验
        blocks:
          - type: paragraph
            body: >-
              没有任何保留来源披露 GSR
              及其同行的可比目录价格、价差、返佣、最低承诺、实际执行质量、续约率或客户集中度。因此，商业比较只能围绕合同模式和证据缺口，而不是臆造价格。若咨询、资金管理、执行和报告共用流程，整合可能提高转换成本；但买方仍可在多个场所和供应商之间同时采购，GSR
              与 DigiFT 的安排也表明伙伴可能控制受监管分销。竞争压力同样具有结构性：一篇经过审阅的文章称，越来越多做市商争夺越来越少、但能产生有意义流动性的项目，挤压利润率。因此，GSR
              的持久性取决于可量化的执行、客户留存、监管准入和成功整合；单纯服务广度可被复制，不能证明持久护城河。
            claimRefs:
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP010
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 广度可以降低协调成本
            body: GSR 可以可信地提供贯穿发行、交易、资金管理和受监管资本市场流程的一站式关系，但采用和经济性仍未得到验证。
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
          - type: callout
            title: 行业融合可能使广度商品化
            body: 竞争者也在增加牌照和相邻产品，而公开证据没有证明 GSR 在定价或执行上更优，差异化因此容易被削弱。
            calloutType: risk
