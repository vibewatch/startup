      - number: '1.4'
        title: 决策含义与待解指标
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是战略增长画像，而不是经过验证的财务规模画像。GSR 扩大了产品边界，并增加了一名银行关联的战略股东，但保留的 8 个来源均未披露当前收入、run
              rate、现金、债务、员工数、活跃客户数或独立估值。不能从收购对价反推出已筹资金，也不能把未披露条款的战略股份换算成可用现金或所有权经济性。KuCoin
              的分析还提出一个有条件的悲观情景：跨境代币化规则放缓机构采用；这只是情景，不是已记录的执法事件。因此，投资判断需要私募财务报表、股权结构文件、客户和交易对手集中度、按服务和地域划分的监管许可，以及收购后的整合证据。
            claimRefs:
              - CO007
              - CO015
              - CO016
