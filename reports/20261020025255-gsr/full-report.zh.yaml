  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与融资背景
        blocks:
          - type: paragraph
            body: >-
              决策应为继续研究，而不是买入。SC Ventures 成为 GSR 的首个外部战略股东，但现有独立报告没有披露投资规模，资料包也没有提供持股、优先权、治理或反稀释条款。GSR 另行宣布以 $57 million
              收购 Autonomous 和 Architech，这说明公司愿意向相邻能力投入资本，但不能证明 GSR
              的企业价值、收入或可用现金。因此，基于公开证据无法定价。交易和运营扩张可被观察到，所以信心为中等；但入场价格、正常化盈利、资本需求和投资者权利均不可得，风险为高。在这些输入披露前，无法负责任地指定目标回报、持有期或退出估值。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
