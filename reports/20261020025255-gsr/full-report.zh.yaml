      - number: '8.3'
        title: 估值方法与情景
        blocks:
          - type: paragraph
            body: >-
              适合 GSR
              的模型应对正常化交易盈利、所需风险资本、资产负债表敞口，以及咨询、资产管理和代币化活动的价值进行桥接，而不是套用软件收入倍数。公开披露没有提供所需的分部收入、利润率、交易损益、现金转换、债务或监管资本数据，因此给出数值区间会制造虚假精确。现有展望将
              Circle、Bullish、Figure 和 Gemini 列为公开市场参考对象，并指出投资者更加重视收入持久性、治理、监管姿态和资本效率。这些公司只是筛选集合；在将其业务结构和财务指标与 GSR
              标准化前，不能作为可用估值基准。因此，乐观、基准和悲观结果应被表述为取决于尽调的价格区间，而不是臆造的倍数。
            claimRefs:
              - CV010
