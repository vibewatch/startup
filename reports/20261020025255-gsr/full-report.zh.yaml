  - id: FM001
    title: 受证据约束的市场规模阶梯
    type: pyramid
    summary: 证据支持按顺序排列的机会层级，但没有层级之间的数值规模或转化率。
    data:
      items:
        - label: 数字资产经济活动
          value: Unquantified context
          note: 交易总额与代币 FDV 不作为收入代理指标。
          tone: neutral
          claimRefs:
            - CM002
            - CM003
        - label: 外包加密资本市场支出
          value: Unquantified addressable pool
          note: 包括付费流动性、执行、顾问、发行与资金管理服务。
          tone: neutral
          claimRefs:
            - CM001
            - CM002
        - label: 适用的机构与代币组织需求
          value: Buyer count and budgets unknown
          note: 是否适用取决于地域、监管、流程需求与外包意愿。
          tone: warning
          claimRefs:
            - CM008
            - CM009
        - label: GSR 可服务的工作流
          value: Service scope evidenced; spend unknown
          note: 公开资料描述了做市、OTC、顾问、发行运营与资金管理。
          tone: positive
          claimRefs:
            - CM001
            - CM006
            - CM007
        - label: GSR 可触达需求
          value: Reachable share unknown
          note: 分销、定价、转化与续约证据未公开。
          tone: warning
          claimRefs:
            - CM009
            - CM010
            - CM012
        - label: GSR 已实现收入与利润
          value: Not disclosed
          note: 需要分部收入、利润率、风险调整后利润与现金转化数据。
          tone: negative
          claimRefs:
            - CM003
            - CM013
            - CM016
    approximationNotes: 不估算市场价值、宽度、份额或转化率；层级顺序只表示分析范围逐步收窄，渲染出的梯形收缩不代表规模。
    claimRefs:
      - CM002
      - CM008
      - CM009
      - CM010
      - CM012
      - CM013
      - CM016
  - id: FP001
    title: 受证据约束的竞争定位
    type: quadrant
    summary: 分析师赋予的序位比较公开描述的服务广度与监管或机构整合证据，不代表市场份额或质量。
    data:
      xAxis:
        label: 公开描述的服务广度（1=窄，5=全生命周期）
        min: 1
        max: 5
      yAxis:
        label: 监管或机构整合证据（1=有限，5=强）
        min: 1
        max: 5
      points:
        - label: GSR
          x: 5
          'y': 5
          detail: 交易、资金管理、顾问、资产管理、券商与开曼注册的整合证据。
        - label: DigiFT
          x: 4
          'y': 5
          detail: 合作材料描述了具备 MAS 与 SFC 牌照的端到端代币化与分销平台。
        - label: Keyrock
          x: 4
          'y': 4
          detail: Blab 报道了其纽约扩张、推进 MiCA 许可及收购基金管理业务。
        - label: B2C2
          x: 3
          'y': 4
          detail: Blab 报道其获得 MiCA 授权，并扩展机构 OTC 与稳定币业务。
        - label: Wintermute
          x: 4
          'y': 2
          detail: 报道显示产品组合更广并设有纽约办公室，但分配到的证据未核实任何牌照。
        - label: DWF Labs
          x: 2
          'y': 1
          detail: 报道显示其扩展 RWA 与黄金交易；分配到的证据未证明监管整合。
    approximationNotes: 分数是分析师基于截至 2026-10-20 保留披露作出的序位摘要，不是实测表现、市场份额、价格或质量基准；同业证据稀疏，应以一手来源更新。
    claimRefs:
      - CP002
      - CP004
      - CP007
      - CP009
      - CP011
  - id: FI001
    title: 从收入到现金的投资判断桥接
    type: flow
    summary: 公开证据识别了运营步骤，但将客户活动勾稽至毛贡献、利润与现金所需的数值并未披露。
    data:
      nodes:
        - id: client-mandate
          label: 客户委托
          detail: 做市、OTC、顾问、资金管理或资产管理合作
        - id: activity
          label: 交易或服务活动
          detail: 交易量、执行、项目工作、管理资产或资金管理支持
        - id: gross-monetization
          label: 毛变现
          detail: 价差、交易结果、执行费、顾问费或管理费
        - id: direct-costs
          label: 直接成本
          detail: 对冲、融资、库存、交易对手与服务交付成本
        - id: gross-contribution
          label: 毛贡献
          detail: 未按分部公开披露
        - id: operating-costs
          label: 运营与整合成本
          detail: 技术、合规、人员、收购与整合
        - id: cash-result
          label: 利润与现金转化
          detail: 未公开披露；抵押品与营运资本可能造成差异
    approximationNotes: 仅为概念性桥接；不包含估算金额、比率或转化百分比。
    claimRefs:
      - CI001
      - CI006
      - CI011
      - CI013
      - CI014
  - id: FE001
    title: 从接入到受监管交付的产品架构
    type: stack
    summary: 这是已披露能力的功能栈；监管与控制被视为边界，而非默示的集团范围许可。
    data:
      layers:
        - label: 客户接入
          items:
            - GSR One 门户
          detail: 已披露交易、资金管理与运营工作流的统一入口。
        - label: 顾问
          items:
            - 代币经济学
            - 治理
            - 上市与 GTM
          detail: GSR Digital Asset Advisory 提供设计与发行规划服务。
        - label: 发行运营
          items:
            - 设立
            - 财务运营
            - 资金管理运营
          detail: Autonomous 支持组织从发行前走向稳定运营。
        - label: 执行
          items:
            - 做市
            - 系统化 OTC
            - 衍生品
          detail: GSR 现有业务提供流动性、执行与风险管理能力。
        - label: 持续资本管理
          items:
            - 现金规划
            - 风险管理
            - 资产管理
          detail: 资金管理与配置服务将关系延伸至发行之后。
        - label: 监管边界
          items:
            - 开曼证券
            - 开曼资产管理
            - 美国券商
          detail: 许可分别归属于不同实体与司法辖区。
    approximationNotes: 仅为概念性功能排序；保留来源未披露系统拓扑、数据流或实施顺序。
    claimRefs:
      - CE010
      - CE016
  - id: FU001
    title: 客户接入与扩展路径
    type: journey-map
    summary: 公开路径支持以产品带动扩张的假设，但没有队列证据量化各阶段之间的转化或持续性。
    data:
      items:
        - label: 细分匹配
          detail: 代币发行方、交易所、金融机构、金融科技与支付公司及资产管理机构是明确的目标群体。
          touchpoints:
            - 机构直覆盖
            - 发行人与资金管理顾问
        - label: 资格筛选
          detail: 司法辖区资格与 $250,000 的 OTC 最低交易额缩小了可触达人群。
          touchpoints:
            - 法律实体准入
            - 单笔规模门槛
        - label: 接入
          detail: 客户可通过用户界面或 API 获取系统化 OTC 流动性。
          touchpoints:
            - GSR One
            - 系统化 OTC UI
            - API
        - label: 执行
          detail: GSR 声称可覆盖 200 多种数字资产、25 种法币，交易规模最高达 $100 million。
          touchpoints:
            - 加密货币兑加密货币
            - 加密货币兑法币
            - 法币兑法币
        - label: 持续运营
          detail: 该门户延伸至做市、资金管理服务与运营工作流。
          touchpoints:
            - 做市
            - 资金管理
            - 风险管理
        - label: 生命周期扩展
          detail: 收购的顾问能力延伸至设立、治理、发行、流动性规划与长期资本规划。
          touchpoints:
            - Autonomous
            - Architech
            - GSR 顾问服务
    approximationNotes: 有序阶段是分析工作流，不是实测转化漏斗；没有可用的转化率或队列规模。
    claimRefs:
      - CU003
      - CU005
      - CU007
      - CU008
  - id: FR001
    title: 定性剩余风险热力图
    type: matrix
    summary: 监管分类与自营交易暴露排名最高；由于公开证据未提供损失概率或控制测试，所有分数仍属暂定。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重程度
      rows:
        - label: 美国资产分类与券商业务范围
          values:
            - 高
            - 严重
            - 发展中
            - 高
        - label: 自营库存、对冲与流动性压力
          values:
            - 高
            - 严重
            - 部分描述
            - 高
        - label: 交易对手、托管与结算
          values:
            - 中高
            - 高
            - 无证据支持
            - 高
        - label: 收购与控制整合
          values:
            - 中高
            - 高
            - 早期
            - 中高
        - label: 财务透明度与资本充足性
          values:
            - 中高
            - 高
            - 无证据支持
            - 高
        - label: 合作伙伴与治理集中度
          values:
            - 中
            - 高
            - 无证据支持
            - 中高
    approximationNotes: 定性类别是分析师根据已披露暴露与缺失证据作出的判断，不是数值概率、预期损失或监管机构评级。
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR010
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 在决策时点，可观察到的战略进展被缺失的财务、估值与投资者权利证据所压过。
    data:
      nodes:
        - id: operating-breadth
          label: 更广的运营范围
          detail: 做市、OTC、资金管理、顾问与资产管理能力。
        - id: transaction-proof
          label: 交易与合作伙伴证明
          detail: $57 million 收购、战略银行投资与已上线的合作伙伴整合。
        - id: regulatory-footprint
          label: 扩大的受监管版图
          detail: 开曼注册实体，以及收购而来的 SEC 注册经纪交易商。
        - id: earnings-gap
          label: 标准化收益缺口
          detail: 缺少经审计的分部经济数据、现金转换情况或风险资本披露。
        - id: terms-gap
          label: 价格与权利缺口
          detail: 未披露战略投资规模、持股比例、优先权或稀释条款。
        - id: decision
          label: 继续研究
          detail: 风险高、信心中等，且没有站得住脚的公开估值区间。
    approximationNotes: 该有序流程仅作定性呈现，不为节点赋予概率、数值、转化率或相对大小。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV015
      - CV016
