              - CV016
      - number: '8.2'
        title: 投资逻辑与反投资逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑是，GSR 可以把长期流动性业务扩展为更广泛的机构资本市场平台。Autonomous 和 Architech 的收购增加了发行、融资、资金管理和咨询功能；GSR One 将做市、系统化
              OTC、资金管理服务和运营流程结合起来；Finery Markets
              的集成已经上线并完成了首笔交易。反投资逻辑是，业务广度可能比持久盈利增长得更快。独立分析称，公开信息不足以计算当前净利润，收购和代币化协同仍未验证。Finery 的 150 个市场参与者反映的是伙伴网络，而不是
              GSR 的客户、收入、留存或份额。只有管理层提供分部经济性，并证明交叉销售能够抵消整合成本，投资逻辑才会改善。
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
