        title: 融资与公司发展
        blocks:
          - type: paragraph
            body: >-
              多篇 2026 年报道显示，GSR 成立于 2013 年。目前最重要的融资事件是 SC Ventures 于 2026 年 5 月取得的战略股份，并被描述为 GSR
              的首个外部战略股东。这验证了银行支持的战略兴趣，但没有披露投资金额、持股比例、估值、证券类型、董事会权利或投资者保护。公司发展方面的信息更可量化：GSR 于 2026 年 3 月 17 日宣布以 $57
              million 收购 Autonomous 和 Architech。公司表示 Autonomous 将继续沿用现有品牌，而 Architech 将成为 GSR Digital Asset Advisory
              的基础。随后还包括 GSR 于 4 月对 SC Ventures 支持的 Libeara 进行投资，以及 5 月推出 Crypto Core3
              ETF，显示公司正从做市扩展到代币化、咨询、资金管理和资产管理等相邻领域。
