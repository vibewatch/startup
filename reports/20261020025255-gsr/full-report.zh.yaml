            calloutType: risk
            claimRefs:
              - CO008
              - CO015
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场应以 GSR 实际提供的服务对应的外部支出为边界：做市、机构 OTC
              执行、代币设计与发行咨询、资金管理运营及相关资本市场支持。不能把它等同于加密交易总量、客户资金余额、代币总价值，或只是经过某个流程的资产。这些指标可以反映活动量，但不是供应商收入或可服务支出。GSR
              自己的收购理由将现状描述为结构顾问、代币经济学家、做市商和上市顾问拼凑而成的组合。客户内部的交易、财务和资金管理团队也是替代方案。因此，市场边界比数字资产经济更窄，但比单独的做市更宽；只有在 GSR
              已证明提供相关服务时才纳入相邻机会，不能假定交叉销售。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有任何保留来源提供该综合品类可直接使用的市场规模估计、CAGR、买方预算序列或按地域划分的支出基数。收购 Autonomous 和 Architech 的 $57 million 是交易对价，不是
              TAM、收入、估值或可用于增长的现金。同样，GSR Advisory 的 10B-plus 峰值 FDV、30-plus 家交易所和 136B-plus
              累计交易量，是公司展示的运营范围指标，不是可服务市场价值。Tracxn
              的竞争者总数还采用了包含交易工具和消费应用的分类，因此不能作为直接市场分母。可辩护的规模结论，是一组逐步收窄的机会层级，层级之间没有数值换算。要建立可用的 TAM/SAM/SOM
              模型，还需要第三方服务支出数据、适用买方数量、平均年度合同金额、地域准入条件，以及有证据支持的可触达份额。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM013
              - CM014
              - CM015
              - CM016
          - type: figure
