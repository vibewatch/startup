    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - 经审计的标准化收益可持续；收购带来可量化的交叉销售；受监管实体增加有利可图的机构资金流。
        - 相对纯交易同业的溢价可能有依据，但没有财务数据与交易条款就无法合理给出数值区间。
        - 公开证据带来的确信度低
        - 协同 KPI 或风险调整后利润率低于管理层的投资判断情景。
      - - 基准
        - 核心流动性业务仍有价值，但相邻业务逐步贡献，并需要大量整合投入。
        - 只能按标准化收益加上有独立证据支持的相邻业务价值定价；当前公开区间不可得。
        - 与已披露证据最一致
        - 在经审计经济数据与权利披露前，卖方要求叙事性溢价。
      - - 悲观
        - 交易经济具有周期性、风险资本占用高、整合成本上升，或融资优先权使新投资者处于次位。
        - 价值低于任何缺乏依据的战略溢价；没有资产负债表与股权结构数据，确切下行区间仍不可得。
        - 重大未解决风险
        - 现金转化疲弱、交易对手集中、监管不利变化或下轮融资估值下降。
    notes: 这些情景是条件框架，不是按概率加权的预测；公开证据不支持数值化估值或回报区间。
