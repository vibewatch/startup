              Architech
              的收购又把业务延伸到基金会运营、代币设计、融资、交易所策略和资本规划。这种广度带来多种合理的变现机制——交易价差和自营结果、执行或服务费、咨询顾问费以及资产管理费——但没有保留来源披露实际定价、收入结构或确认政策。一体化产品可能加深客户关系并推动交叉销售，但不能把公开服务广度误当成经常性收入、已签合同积压或有利润的分部规模。
