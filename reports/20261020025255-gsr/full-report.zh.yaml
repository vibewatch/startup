      - number: '7.4'
        title: 伙伴、治理与集中度风险
        blocks:
          - type: paragraph
            body: >-
              GSR
              依赖发行方、交易所、银行、托管方、监管机构、收购来的运营团队和战略资本伙伴，共同交付更广泛的资本市场方案。公开证据没有按客户、场所、银行通道、托管方、资产或司法管辖区量化敞口，因此无法负责任地评估集中度。Traders
              Union 报道称，SC Ventures 成为 GSR
              的首个外部战略股东，但投资金额未披露；持股、董事会权利、优先权、信息权和商业承诺因此仍是重要治理缺口。合理的缓释措施不是从长长的伙伴名单推定分散化，而是要求交易对手限额、经过测试的运营替代方案、关联方和利益冲突控制，以及对战略投资者和收购协议的文件审阅。如果无法替换关键供应商，或权利安排损害少数投资者利益，投资逻辑将被打破。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR013
