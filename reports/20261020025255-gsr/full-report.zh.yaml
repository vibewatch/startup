chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营版图
        blocks:
          - type: paragraph
            body: >-
              GSR
              将自己定位为覆盖做市、机构交易、流动性、风险管理、风险投资支持和咨询的加密资本市场伙伴。其官网将潜在合作关系定义得很宽：代币发行方、交易所、金融机构、金融科技和支付公司，以及资产管理机构。这种广度具有战略价值，但不能证明收入结构或分部经济性。现有运营版图最清晰的证据来自监管而非财务：GSR
              指出其拥有美国货币服务实体、一个登记从事特定加密资产活动的英国实体，以及一个获批为 Major Payment Institution 的新加坡实体。GSR One 进一步提供统一客户入口，覆盖做市、系统化
              OTC、资金管理服务和运营流程。总部及法律母公司结构在本次证据中仍未验证。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
              - CO015
