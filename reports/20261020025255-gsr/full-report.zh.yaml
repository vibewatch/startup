      - number: '8.4'
        title: 退出准备度与决策关口
        blocks:
          - type: paragraph
            body: >-
              退出选择在方向上有所改善：GSR 报告了开曼登记和完成 SEC 注册券商收购，其自身展望也指向重新开放的加密 IPO 和并购路径。这些事实强化了机构定位，但不能证明 GSR
              已准备好上市、出售或向股东分配现金。如果经审计结果显示正常化盈利疲弱、收购业务无法产生可量化交叉销售、风险资本或交易对手敞口吞噬运营收益，或融资条款把不成比例的下行风险转嫁给新投资者，投资逻辑就会失效。可支持决策的数据室应包括经审计报表、分部收入和贡献利润率、库存和交易对手风险、头部客户集中度与留存、股权结构和优先权条款、监管实体许可，以及收购整合
              KPI。
