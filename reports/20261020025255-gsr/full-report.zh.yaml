            body: >-
              最大的剩余风险是监管分类风险，因为 GSR 2026 年 7 月的 SEC 意见称，attachment/separation 框架可能使非发行方流动性提供商无法实时判断某笔交易是否属于证券交易。同一份文件确认
              GSR 以 principal 身份行事，承担数百种加密资产的库存风险，并依靠对冲和 delta-neutral
              方法；这些控制可以降低方向性敞口，但不能消除交易对手、基差、流动性或运营风险。下一层风险是薄弱的公开财务透明度与执行复杂性叠加：独立研究称无法从公开信息计算当前净利润，而 GSR
              又增加了收购、资产管理、ETF、咨询服务和新的受监管实体。热力图中的评级是定性的，应被视为尽调优先级，而非经过测量的损失概率。
