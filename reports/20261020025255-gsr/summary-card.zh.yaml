  topStrengths:
    - 机构业务覆盖流动性、OTC、资金管理、咨询、资产管理及受监管证券活动，范围广泛。
    - SC Ventures 的战略投资和已上线的合作伙伴集成，为机构认可度和分销潜力提供了可信信号。
    - GSR 以 $57 million 收购 Autonomous 和 Architech，进一步搭建覆盖设立到规模化的整合式资本市场工作流。
    - 开曼和美国受监管实体版图扩大，可能提升 GSR 获取机构资本市场委托的能力。
  topRisks:
    - 美国资产分类和经纪交易商资质仍不确定，可能限制大规模自营 OTC 或做市活动。
    - 经审计收入、正常化盈利、现金转化、风险资本、债务及交易对手敞口均未公开披露。
    - 在整合结果得到验证前，收购、ETF 运营、咨询、资产管理和统一平台已扩大控制边界。
    - SC Ventures 的持股、优先权、治理权利和商业承诺仍未披露。
    - 活跃客户数、留存、集中度、具名生产环境证据和交叉销售经济性仍未验证。
  unresolvedGaps:
    - 获取经审计的月度和年度财务报表、分部收入及贡献利润率、交易损益、现金转化、债务、监管资本和下行情景流动性。
    - 审阅 SC Ventures 的认购文件、持股、证券条款、估值、董事会和否决权、清算优先权、反稀释保护及后续战略融资。
    - 将每项重要产品、记账实体、客户司法管辖区、托管路径及自营与代理角色，逐一对照当前监管许可和法律意见。
    - 核实头部客户、交易场所、托管方、银行、交易对手和资产集中度，以及 NRR、GRR、流失、续约和具名生产环境参考。
    - 验证收购后的整合、模块采用、交叉销售、服务水平、安全测试、事件历史、恢复测试、监控和利益冲突管理控制。
