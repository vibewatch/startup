evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership
    missingEvidence: >-
      Founder identities, board roster, executive bench, voting control, reserved matters, regulated- entity
      accountability, and succession plans.
    whyItMatters: >-
      Governance opacity prevents assessment of key-person dependence, investor protections, and decision rights across
      the regulated group.
    diligencePath: >-
      Request the current organization chart, biographies, cap table, board minutes, shareholder agreements,
      regulated-entity responsibility maps, and succession plan.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      SC Ventures' check size, ownership percentage, security type, implied valuation, preferences, anti-dilution
      rights, board rights, and follow-on commitments.
    whyItMatters: >-
      A strategic shareholder validates partnership interest but does not establish valuation, cash proceeds, control,
      or investor-alignment economics.
    diligencePath: >-
      Obtain the signed subscription and shareholders' agreements, updated cap table, sources-and-uses schedule, board
      approvals, and any side letters.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Current revenue and segment mix, cash and debt, trading-capital requirements, headcount, active customer count,
      concentration, headquarters, legal-parent structure, and standalone valuation.
    whyItMatters: >-
      These metrics are required to distinguish product breadth from durable financial scale and to assess liquidity,
      operating leverage, and concentration risk.
    diligencePath: >-
      Request audited statements, YTD management accounts, regulatory capital returns, bank and debt schedules, payroll
      roster, customer cohort data, legal entity chart, and the latest 409A or financing valuation materials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-timeline
    missingEvidence: >-
      One or more additional independently dated milestones covering earlier financing, product, regulatory,
      partnership, or adverse events.
    whyItMatters: The assigned evidence supports seven distinct dated items, below the planned eight-item timeline quality target.
    diligencePath: >-
      Review dated regulator records, archived company releases, financing filings, and independent news records in a
      later evidence-expansion pass.
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Segment-level buyer, user, payer, budget owner, pricing, procurement, contract-length, conversion, retention, and
      wallet-share data.
    whyItMatters: These inputs determine whether the evidenced service scope converts into durable addressable revenue.
    diligencePath: >-
      Obtain anonymized CRM cohorts, contract samples, price books, renewal data, sales-cycle analysis, and
      customer-reference interviews by segment.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent service-spend denominators, applicable buyer counts, average annual contract values, geographic
      eligibility, and reachable-share evidence.
    whyItMatters: Without these inputs, numerical TAM, SAM, SOM, growth, and market-share assumptions would be invented.
    diligencePath: >-
      Commission or obtain third-party institutional digital-asset service-spend data and reconcile it to GSR's actual
      product and jurisdiction scope.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: integration-risk
    missingEvidence: >-
      Post-acquisition customer adoption, cross-sell conversion, service delivery, renewals, integration cost, and
      segment profitability.
    whyItMatters: The integrated-platform thesis supports valuation only if added scope produces recurring risk-adjusted economics.
    diligencePath: >-
      Review monthly cohort, pipeline, attach-rate, gross-profit, risk-capital, and integration-cost reporting since the
      March 2026 acquisition.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: conflicting-data
    severity: minor
    topic: market-taxonomy
    missingEvidence: >-
      A normalized peer and category taxonomy separating market makers from analytics tools, consumer apps, exchanges,
      advisers, and asset managers.
    whyItMatters: >-
      Broad directory competitor counts overstate the directly comparable supply base and cannot anchor market-share
      calculations.
    diligencePath: Build a bottom-up provider census by service line, legal entity, jurisdiction, and institutional customer segment.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable spreads, rebates, minimum commitments, service fees, discounts, and realized all-in customer pricing
      for GSR and named peers.
    whyItMatters: Without normalized commercial terms, breadth cannot be translated into win rate, pricing power, or unit economics.
    diligencePath: >-
      Obtain redacted contracts, bid responses, invoices, and independent transaction-cost analyses for matched assets,
      sizes, venues, and volatility periods.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: execution-quality
    missingEvidence: >-
      Independent matched-period benchmarks for uptime, quoted depth, slippage, fill rate, settlement failures, and
      stress-market performance.
    whyItMatters: A broad service catalog does not establish superior market-making or OTC delivery.
    diligencePath: >-
      Commission venue- and client-verified benchmarking against Wintermute, B2C2, Keyrock, and other shortlisted
      providers.
    relatedQuestionRefs:
      - QP003
      - QP007
      - QP009
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Cohort retention, cross-sell, multi-homing, implementation effort, wallet or data portability, and reasons for
      customer churn.
    whyItMatters: These data distinguish durable workflow lock-in from a replicable bundle of services.
    diligencePath: >-
      Review cohort-level CRM and revenue data, interview reference and churned customers, and test export and
      transition processes.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: >-
      Primary-source profiles and current regulatory records for each named competitor and likely bank, exchange, and
      broker-dealer entrant.
    whyItMatters: The assigned pool supports a representative landscape but not an exhaustive, independently benchmarked ranking.
    diligencePath: >-
      Verify each competitor through its official filings, regulator registers, product documentation, and independent
      customer references.
    relatedQuestionRefs:
      - QP001
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue, trading gains and losses, revenue recognition, segment mix, realized pricing, and gross
      contribution by service line.
    whyItMatters: Product breadth cannot establish recurring revenue, margin durability, or quality of earnings.
    diligencePath: Obtain monthly audited management accounts and a contract-to-ledger sample for each material service line.
    relatedQuestionRefs:
      - QI001
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Unrestricted cash, regulatory and trading capital, collateral, debt, monthly cash use, acquisition payment mix,
      and downside runway.
    whyItMatters: >-
      Funding, valuation, and acquisition headlines do not show liquidity available to absorb trading or integration
      stress.
    diligencePath: >-
      Reconcile legal-entity balance sheets, cash-flow statements, capital requirements, debt schedules, and a 24-month
      downside liquidity model.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: >-
      Customer acquisition cost, sales cycle, gross-margin payback, retention, concentration, attach rate, and channel
      economics by segment.
    whyItMatters: >-
      The integrated platform thesis depends on efficient acquisition and measurable cross-sell rather than service
      breadth alone.
    diligencePath: >-
      Review customer cohorts, CRM-to-ledger reconciliation, top-counterparty exposure, renewals, and contribution after
      service-delivery costs.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: financing-terms
    missingEvidence: >-
      SC Ventures check size, ownership, security type, board rights, liquidation preference, anti-dilution, and any
      subsequent strategic close.
    whyItMatters: >-
      These terms determine dilution, governance, preference overhang, and whether reported financing improved usable
      runway.
    diligencePath: >-
      Inspect the executed subscription and shareholder agreements, cap table, bank receipts, and post-money fully
      diluted capitalization.
    relatedQuestionRefs:
      - QI006
      - QI009
  - type: missing-source
    severity: material
    topic: security and reliability
    missingEvidence: >-
      Independent security assessment, control certification, incident history, availability data, recovery testing, and
      surveillance or conflict-management documentation.
    whyItMatters: >-
      Institutional suitability depends on controls and resilience that product and registration announcements do not
      establish.
    diligencePath: >-
      Request current control reports, penetration-test summaries, incident and outage logs, business-continuity
      results, and entity-level surveillance policies.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: integration risk
    missingEvidence: >-
      Post-acquisition integration milestones, module adoption, cross-product usage, client renewals, and realized
      operating benefits.
    whyItMatters: >-
      The investment case relies on coordination across acquired and existing capabilities rather than the service menu
      alone.
    diligencePath: >-
      Obtain integration scorecards, product telemetry, named reference calls, renewal cohorts, and management's synergy
      bridge.
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: minor
    topic: developer signal
    missingEvidence: >-
      A public developer surface or practitioner-community proxy showing API activity, releases, integrations,
      contributors, or technical support quality.
    whyItMatters: The assigned evidence does not permit independent assessment of implementation velocity or developer usability.
    diligencePath: >-
      Request API documentation, changelogs, integration guides, support metrics, and reference calls with client
      engineering teams.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
