schemaVersion: "report-v2"
artifact: financials
slug: gsr
runDate: 2026-10-20
company:
  name: GSR
chapter:
  number: 4
  title: Financials
  summary: >-
    GSR presents a widening set of market-making, OTC, advisory, treasury, asset-management,
    and capital-markets services, but the assigned public evidence does not disclose revenue,
    margins, cash generation, or segment economics. The $57 million acquisition program and
    reported search for up to $150 million of additional strategic capital make liquidity,
    integration costs, and financing terms central underwriting gaps rather than footnotes.
sections:
  - id: revenue-model
    title: Revenue model is broad, but mix and realized pricing are undisclosed
    body: >-
      GSR's public service perimeter spans market making, institutional OTC trading, digital
      asset advisory, asset management, liquidity services, and venture backing. GSR One adds
      a single client storefront for market making, systematic OTC, treasury services, and
      operational workflows, while the Autonomous and Architech acquisition extends the offer
      into foundation operations, token design, fundraising, exchange strategy, and capital
      planning. This breadth creates several plausible monetization mechanisms—trading spread
      and principal results, execution or service fees, advisory retainers, and
      asset-management fees—but no retained source reports actual pricing, revenue mix, or
      recognition policy. The integrated offer may deepen relationships and cross-sell, yet
      public service breadth should not be mistaken for recurring revenue, contracted backlog,
      or profitable segment scale.
    claimRefs: [CI001, CI003, CI004, CI012, CI014]
    tableRefs: [TI001, TI002]
  - id: unit-economics
    title: Trading activity does not establish earnings quality
    body: >-
      Market-making volume, accounting revenue, and net profit are different measures. The
      independent BigTime analysis hosted by KuCoin states that public information is
      insufficient to calculate GSR's current net profit and warns that earning a spread is
      only the starting point, not guaranteed profit. Continuous quoting requires inventory,
      hedging, financing, and counterparty-risk management, so gross economics depend on
      volatility, balance-sheet usage, execution quality, and funding cost. The same source
      says financial segmentation is absent and acquisition synergies remain unvalidated.
      Without matched-period revenue, trading gains and losses, gross margin, cash conversion,
      customer concentration, and risk-capital usage, neither sales efficiency nor unit
      economics can be underwritten from the public record.
    claimRefs: [CI005, CI006, CI011, CI012, CI013]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Expansion raises the capital requirement while financing terms remain opaque
    body: >-
      GSR announced a combined $57 million acquisition of Autonomous and Architech in March
      2026, an identifiable capital-allocation commitment but not evidence of revenue or cash
      remaining after the transaction. In May, SC Ventures became the first external strategic
      shareholder since GSR's founding; independent coverage says the check size was not
      disclosed, while another report placed the resulting valuation at roughly $1 billion and
      said GSR was seeking up to $150 million from additional strategic backers. Those reports
      do not establish ownership, security type, liquidation rights, board rights, or funding
      actually available. Cayman registrations and the completed broker-dealer acquisition
      also widen the operating perimeter, but the evidence provides no cost base, regulatory
      capital requirement, debt position, or integration budget.
    claimRefs: [CI002, CI007, CI008, CI009, CI010, CI015]
  - id: financial-verdict
    title: Financial verdict is research-more until primary statements are available
    body: >-
      The model has credible revenue surfaces and potential cross-sell, but revenue quality and
      margin durability cannot be scored from product descriptions or transaction headlines.
      The decisive diligence package is a legal-entity and segment bridge covering monthly
      revenue, trading gains and losses, gross contribution, operating expense, regulatory and
      trading capital, cash, debt, and customer concentration. It should reconcile acquisition
      consideration and integration spend with current liquidity, then show downside liquidity
      under stressed volumes, spreads, token prices, and counterparty defaults. Until that
      package exists, the reported valuation and financing ambition cannot be converted into
      runway: funding raised is not cash available, volume is not revenue, and accounting loss
      would not by itself measure cash burn.
    claimRefs: [CI005, CI006, CI007, CI009, CI011, CI013]
tables:
  - id: TI001
    title: Revenue streams and underwriting status
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public value or status
      - Revenue quality
      - Diligence ask
    rows:
      - [Market making, "Quoting, liquidity provision, and trading results", "Spread, fee, or trading P&L", "Service confirmed; revenue not disclosed", "Potentially market- and balance-sheet-sensitive", "Segment revenue, trading P&L, risk limits, and capital employed"]
      - [Institutional OTC, "Principal or agency execution", "Trade, notional, or fee", "Service confirmed; realized pricing not disclosed", "Repeat potential is unknown", "Agency-versus-principal mix, take rate, repeat volume, and counterparty losses"]
      - [Digital asset advisory, "Token design, fundraising, exchange, and capital-planning support", "Project, retainer, or success fee", "Expanded through the 2026 acquisitions; pricing not disclosed", "Could be recurring or milestone-driven", "Contracts, backlog, revenue recognition, renewal, and success-fee exposure"]
      - [Treasury and risk management, "Planning, diversification, execution, and operational support", "Mandate, service fee, or assets", "Offered through GSR and GSR One; fee basis not disclosed", "May deepen relationships but could be service-intensive", "Fee schedule, assets advised, attach rate, delivery headcount, and gross margin"]
      - [Asset management, "Investment management through regulated entities", "Management or performance fee", "Cayman investment-manager registration announced; AUM not disclosed", "Potentially recurring but scale is unknown", "AUM, net flows, fee rates, performance fees, seed capital, and redemption terms"]
    notes: "Service mechanisms are sourced from company materials and independent summaries; all revenue values, mix, and realized pricing remain unavailable rather than estimated."
    claimRefs: [CI001, CI003, CI004, CI010, CI012, CI014]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Offer
      - Public price or contract
      - List versus realized
      - Discount or unknown
      - Source status
    rows:
      - [Market making, "Not disclosed", "Neither list nor realized pricing available", "Spread, inventory, incentives, and minimum commitment unknown", "Service confirmed"]
      - [Systematic and institutional OTC, "Not disclosed", "Neither agency fee nor principal economics available", "Size tiers, slippage, credit, and financing terms unknown", "Service confirmed"]
      - [GSR One, "Not disclosed", "Bundled storefront described without price", "Packaging, eligibility, and cross-subsidy unknown", "Company product page"]
      - [Advisory and treasury, "Not disclosed", "Acquired capabilities described without commercial terms", "Retainer, project, AUM, and success-fee mix unknown", "Company acquisition announcement"]
    notes: "Null pricing is an evidence gap: official and independent retained sources describe offers but do not publish list prices, realized rates, discounts, or contract duration."
    claimRefs: [CI001, CI003, CI004]
  - id: TI003
    title: Unit economics and capital-adequacy diligence matrix
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue and segment mix, null, Low, "Separates service breadth from commercial scale", "Audited monthly revenue by market making, OTC, advisory, asset management, and other activity"]
      - [Gross margin or contribution, null, Low, "Tests whether spread and fees absorb hedging, financing, and delivery costs", "Contribution bridge by segment and market regime"]
      - [Current net profit, null, Low, "Independent analysis says public information is insufficient to calculate it", "Audited income statement separating operations, trading gains and losses, and one-time items"]
      - [Cash conversion, null, Low, "Profit and cash may diverge through inventory, collateral, and working capital", "Cash-flow statement plus collateral, inventory, receivable, and payable movements"]
      - ["CAC, payback, and sales cycle", null, Low, "Determines whether integrated cross-sell is efficient", "Cohort CAC, sales cycle, gross-margin payback, attach rate, and retention"]
      - ["Cash, burn, and runway", null, Low, "Cannot infer liquidity from funding or valuation headlines", "Unrestricted cash, regulatory capital, debt, monthly net cash use, and downside runway"]
      - [2026 acquisition consideration, "$57 million combined", Medium, "Material disclosed capital allocation with unknown payment mix", "Cash, equity, earn-out, assumed liabilities, integration budget, and post-close liquidity"]
    notes: "The $57 million value is the combined acquisition consideration reported by GSR; every null denotes unavailable public evidence and must not be read as zero."
    claimRefs: [CI002, CI005, CI006, CI011, CI012, CI013]
figures:
  - id: FI001
    title: Revenue-to-cash underwriting bridge
    type: flow
    summary: >-
      Public evidence identifies the operating steps, but the values needed to reconcile client
      activity to gross contribution, profit, and cash are not disclosed.
    data:
      nodes:
        - id: client-mandate
          label: Client mandate
          detail: "Market making, OTC, advisory, treasury, or asset-management engagement"
        - id: activity
          label: Trading or service activity
          detail: "Volume, execution, project work, assets managed, or treasury support"
        - id: gross-monetization
          label: Gross monetization
          detail: "Spread, trading result, execution fee, advisory fee, or management fee"
        - id: direct-costs
          label: Direct costs
          detail: "Hedging, financing, inventory, counterparty, and service-delivery costs"
        - id: gross-contribution
          label: Gross contribution
          detail: "Not publicly disclosed by segment"
        - id: operating-costs
          label: Operating and integration costs
          detail: "Technology, compliance, staff, acquisitions, and integration"
        - id: cash-result
          label: Profit and cash conversion
          detail: "Not publicly disclosed; collateral and working capital may create differences"
    approximationNotes: "Conceptual bridge only; it contains no estimated amounts, rates, or conversion percentages."
    claimRefs: [CI001, CI006, CI011, CI013, CI014]
callouts:
  - calloutType: risk
    title: Headline valuation does not establish liquidity
    body: >-
      The reported roughly $1 billion valuation and search for up to $150 million of additional
      capital do not disclose proceeds received, security terms, or cash remaining after
      acquisitions.
    claimRefs: [CI002, CI007, CI008, CI009]
  - calloutType: recommendation
    title: Require a legal-entity capital bridge
    body: >-
      Reconcile unrestricted cash, regulatory capital, collateral, inventory, debt, and
      acquisition obligations across the entities that provide trading, advisory, broker-dealer,
      and asset-management services.
    claimRefs: [CI010, CI011]
