  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded by external spending on services that GSR actually offers: market
              making, institutional OTC execution, token-design and launch advisory, treasury operations, and related
              capital-markets support. It should not be equated with gross crypto trading volume, client treasury
              balances, aggregate token value, or assets that merely pass through a workflow. Those measures can
              indicate activity, but they are not vendor revenue or addressable spend. GSR's own acquisition rationale
              identifies the status quo as a patchwork of structuring advisers, token economists, market makers, and
              listing consultants. Internal trading, finance, and treasury teams are another substitute. The resulting
              market boundary is therefore narrower than the digital-asset economy but broader than standalone market
              making, with adjacencies included only where GSR has evidenced services rather than assumed cross-sell.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No retained source provides a directly usable market-size estimate, CAGR, buyer-budget series, or
              geography-specific spending base for this combined category. The $57 million acquisition of Autonomous and
              Architech is transaction consideration, not TAM, revenue, valuation, or cash available for growth.
              Likewise, GSR Advisory's 10B-plus peak FDV, 30-plus exchanges, and 136B-plus aggregate volume are
              company-presented operating-scope indicators, not addressable-market values. Tracxn's broad competitor
              count also uses a taxonomy that includes trading tools and consumer applications, so it cannot serve as a
              direct market denominator. The defensible sizing output is a ladder of progressively narrower opportunity
              layers with no numerical conversion between them. A usable TAM/SAM/SOM model requires third-party
              service-spend data, applicable buyer counts, average annual contract values, geographic eligibility, and
              an evidenced reachable share.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM013
              - CM014
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public product material points to several buyer groups rather than one homogeneous customer: token
              foundations and issuers, institutional trading firms, crypto treasuries, exchanges or marketplaces, and
              projects preparing for fundraising or listing. Day-to-day users can include trading, finance, treasury,
              operations, token-design, and launch teams, while the payer is likely the institution, foundation, or
              project treasury. That payer inference is directionally useful but not enough for a revenue model because
              the retained sources do not disclose who owns the budget, how pricing is structured, how long contracts
              run, or what share of client spend GSR wins. The apparent adoption path begins with a discrete need such
              as launch, liquidity, execution, or treasury control and could expand into a broader workflow through GSR
              One or the integrated advisory platform. Conversion and renewal evidence is not public.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The central growth thesis is that fragmented mandates create demand for a coordinated provider spanning
              design, launch, liquidity, execution, and treasury. Institutional interest in tokenized assets may broaden
              that need, and the acquisition adds capabilities that could lengthen client relationships. The constraints
              are equally important. Tokenization does not automatically create liquidity: legal rights, issuance,
              registration, distribution, buy-and-sell demand, and execution capacity must all align. Integration also
              does not prove adoption or economics; customer usage, service delivery, renewals, pricing, segment
              revenue, and risk-adjusted profitability remain unverified. For valuation, the market thesis can support
              an option on a broader capital-markets platform, but not a numerical market multiple. Any premium should
              remain contingent on evidence that the integrated offer converts fragmented demand into recurring,
              profitable, defensible revenue rather than additional complexity.
            claimRefs:
              - CM005
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The opportunity is broader than market making but narrower than crypto activity
            body: >-
              GSR has evidenced a broader service perimeter, yet only external service spend is addressable. Trading
              notional, token FDV, and client treasury assets should not be capitalized as though they were GSR revenue.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Sizing is not decision-grade
            body: >-
              A numerical market multiple would rest on unsupported denominators until buyer counts, budgets, pricing,
              geographic eligibility, conversion, and segment economics are obtained.
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
