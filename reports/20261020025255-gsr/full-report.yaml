              - CO006
              - CO007
              - CO008
              - CO015
      - number: '1.2'
        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Independent and syndicated May 2026 coverage consistently identifies Xin Song as chief executive,
              providing a current leadership anchor for the strategic investment announcement. The same source set does
              not identify GSR's founders, board composition, voting control, succession arrangements, or broader
              executive team. That is an evidence limitation rather than proof that such governance structures are
              absent. The available record therefore supports only a partial leadership inventory and leaves key-person
              dependence unresolved. Management diligence should prioritize founder and board identities, reserved
              matters, executive tenure, regulated-entity accountability, and a succession plan, because the public
              narrative currently concentrates corporate strategy in the chief executive's statements.
            claimRefs:
              - CO005
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO015
      - number: '1.3'
        title: Financing and corporate development
        blocks:
          - type: paragraph
            body: >-
              GSR was founded in 2013, according to multiple 2026 reports. The most consequential current financing
              event is SC Ventures' May 2026 strategic stake, described as GSR's first external strategic shareholder.
              That validates bank-backed strategic interest but does not reveal the check size, ownership percentage,
              valuation, security, board rights, or investor protections. Corporate development is more quantifiable:
              GSR announced a $57 million acquisition of Autonomous and Architech on March 17, 2026. The company said
              Autonomous would continue under its existing brand, while Architech would underpin GSR Digital Asset
              Advisory. The sequence also includes GSR's April investment in SC Ventures-backed Libeara and a May launch
              of the Crypto Core3 ETF, indicating expansion beyond market making into tokenization, advisory, treasury,
              and asset-management adjacencies.
