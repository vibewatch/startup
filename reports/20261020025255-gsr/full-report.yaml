      - number: '1.4'
        title: Decision implications and open metrics
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a strategic-growth profile, not a verified financial-scale profile. GSR has
              broadened its product perimeter and added a bank-affiliated strategic shareholder, but none of the eight
              retained sources discloses current revenue, run rate, cash, debt, headcount, active customer count, or
              standalone valuation. Funding raised cannot be inferred from acquisition consideration, and an undisclosed
              strategic stake cannot be converted into cash available or ownership economics. KuCoin's analysis also
              presents a conditional bear case in which cross-border tokenization rules slow institutional adoption;
              that is a scenario, not a recorded enforcement event. Investment underwriting therefore requires private
              financials, cap-table documents, customer and counterparty concentration, regulatory permissions by
              service and geography, and post-acquisition integration evidence.
            claimRefs:
