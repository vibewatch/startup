chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating footprint
        blocks:
          - type: paragraph
            body: >-
              GSR describes itself as a crypto capital-markets partner spanning market making, institutional trading,
              liquidity, risk management, venture backing, and advisory. Its official site frames the addressable
              relationships broadly: token issuers, exchanges, financial institutions, fintech and payment companies,
              and asset managers. That breadth is strategically useful but does not establish revenue mix or segment
              economics. The clearest operating-footprint evidence is regulatory rather than financial: GSR identifies a
              US money-services entity, a UK entity registered for certain cryptoasset activities, and a Singapore
              entity authorized as a Major Payment Institution. GSR One adds a unified client storefront for market
              making, systematic OTC, treasury services, and operational workflows. Headquarters and legal-parent
              structure remain unverified in the assigned evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
              - CO015
