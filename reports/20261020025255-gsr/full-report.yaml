      - - Thesis
        - Regulatory and distribution infrastructure can improve institutional relevance.
        - Cayman registrations, broker-dealer acquisition, and a live Finery integration expand reach.
        - Permissions, volumes, counterparties, and risk-adjusted profitability are independently verified.
      - - Anti-thesis
        - Business breadth may obscure weak earnings quality.
        - Independent analysis says current net profit cannot be calculated from public information.
        - Audited statements reconcile revenue, trading gains and losses, cash flow, and capital usage.
      - - Anti-thesis
        - M&A and tokenization synergies may fail to offset complexity.
        - Independent analysis says synergies remain unvalidated and integration may add cost.
        - Post-acquisition KPIs show retention, cross-sell, cost discipline, and accountable management.
    notes: >-
      Partner-network size is not treated as GSR customer count, and acquisition cost is not treated as revenue,
      valuation, funding raised, or cash available.
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - >-
          Audited normalized earnings are durable; acquisitions produce measurable cross-sell; regulated entities add
          profitable institutional flow.
        - >-
          A premium to trading-only peers may be supportable, but no numeric range is defensible without financials and
          transaction terms.
        - Low conviction from public evidence
        - Synergy KPIs or risk-adjusted margins miss management's underwriting case.
      - - Base
        - >-
          Core liquidity remains relevant, but adjacent activities contribute gradually and require material integration
          investment.
        - >-
          Price only from normalized earnings plus separately evidenced adjacent-business value; current public range is
          unavailable.
        - Most consistent with disclosed evidence
        - Seller requires a narrative premium before audited economics and rights are disclosed.
      - - Bear
        - >-
          Trading economics are cyclical, risk capital is heavy, integration costs rise, or financing preferences
          subordinate new investors.
        - >-
          Value falls below any unsupported strategic premium; exact downside range remains unavailable without
          balance-sheet and cap-table data.
        - Material unresolved risk
        - Weak cash conversion, concentrated counterparties, adverse regulatory change, or a down round.
    notes: >-
      Scenarios are conditional frameworks, not probability-weighted forecasts; public evidence does not support numeric
      valuation or return ranges.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
