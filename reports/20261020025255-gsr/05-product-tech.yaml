      - ["Trade and manage treasury", "Disconnected execution, treasury, and operational tools", "GSR One combines systematic OTC, market making, treasury, and workflows", "Public product storefront confirms the combined service surface", "No service levels, client count, throughput, or control report"]
      - ["Operate after launch", "Foundation manages finance, payments, governance, and treasury across vendors", "Autonomous operations plus GSR trading, derivatives, and asset-management access", "Acquisition announcement defines the integrated operating scope", "No evidence of integration completion, cross-sell, renewal, or realized benefit"]
    notes: "Benefits are limited to disclosed service design and company-presented metrics; no independently measured customer outcome was available in the assigned pool."
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE014]
  - id: "TE003"
    title: "Technology and operating architecture"
    columns: ["Layer or process", "Role", "Key dependency", "Principal risk"]
    rows:
      - ["Client access", "GSR One storefront coordinates market making, OTC, treasury, and workflows", "Identity, permissions, data integration, and operational support", "No disclosed uptime, API, security, or recovery evidence"]
      - ["Design and launch", "Advisory, Architech, and Autonomous support token design, formation, governance, and launch", "Specialist personnel and integration of acquired teams", "Execution quality and post-acquisition integration are unverified"]
      - ["Execution and risk", "Trading, derivatives, liquidity, and market intelligence support capital-markets activity", "Venue connectivity, risk systems, counterparties, and regulated entities", "No public latency, best-execution, surveillance, or stress-test evidence"]
      - ["Treasury and capital", "Cash planning, forecasting, diversification, asset management, and capital allocation", "Client mandate, custody and banking relationships, jurisdiction permissions", "Asset handling, conflicts, and suitability controls are not described"]
      - ["Regulatory perimeter", "Cayman securities and asset-management registrations plus US broker-dealer activity", "Correct legal-entity and jurisdiction routing", "Permissions are separate and cannot be treated as group-wide authorization"]
    notes: "This is a functional operating architecture inferred from disclosed services; it is not a representation of GSR's undisclosed software or infrastructure topology."
    claimRefs: [CE006, CE007, CE008, CE009, CE013, CE016]
