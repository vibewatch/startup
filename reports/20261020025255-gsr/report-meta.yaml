companyProfile:
  summary: >-
    GSR is a privately held crypto capital-markets provider whose public offer spans market making, institutional OTC
    execution, treasury workflows, digital-asset advisory, asset management, and regulated securities activities. In
    2026 it announced a $57 million acquisition of Autonomous and Architech and added SC Ventures as its first external
    strategic shareholder, broadening its institutional positioning without disclosing current financial scale or
    transaction economics.
  foundingLocation: null
