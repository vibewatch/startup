callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: >-
      Treat the thesis as broken if product-level legal review shows that GSR cannot continue
      material U.S. OTC or market-making activity through an appropriately authorized entity and
      no workable safe harbor, restructuring, or licensed alternative is available.
    claimRefs:
      - CR002
      - CR009
      - CR011
  - calloutType: recommendation
    title: Investment-close conditions
    body: >-
      Require audited financials, trading-capital and counterparty schedules, entity-permission
      mapping, incident and control-testing evidence, acquisition integration KPIs, concentration
      data, and the SC Ventures rights package before underwriting residual exposure.
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR012
      - CR013
