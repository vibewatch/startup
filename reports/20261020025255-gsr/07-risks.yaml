  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: regulatory-control-mapping
      missingEvidence: >-
        A complete legal-entity, product, jurisdiction, client-location, license, and booking map,
        together with examination and enforcement history.
      whyItMatters: >-
        Group-level registrations do not establish that each material activity is authorized or
        that U.S. classification risk is contained.
      diligencePath: >-
        Have regulatory counsel reconcile licenses, contracts, booking records, product flows,
        regulator correspondence, and contingency plans before investment close.
      relatedTableRefs:
        - TR001
    - type: missing-source
      severity: material
      topic: operational-resilience
      missingEvidence: >-
        Independent security assurance, incident and outage history, recovery-test results,
        settlement-fail data, custody architecture, and material vendor SLAs.
      whyItMatters: >-
        Absence of public incident evidence cannot establish secure or continuously available
        trading, settlement, ETF, and treasury operations.
      diligencePath: >-
        Review SOC reports, penetration tests, incident tickets, postmortems, recovery exercises,
        SLA performance, and privileged-access controls in a technical diligence room.
    - type: private-evidence-only
      severity: blocking
      topic: financial-transparency
      missingEvidence: >-
        Audited 2025 and year-to-date 2026 financial statements, liquidity, trading capital,
        counterparty exposure, stress losses, debt, working capital, and segment economics.
      whyItMatters: >-
        Revenue, trading volume, funding raised, and accounting profit cannot substitute for cash
        availability, loss absorption, or durable earnings.
      diligencePath: >-
        Reconcile audited statements to risk systems, bank and custodian balances, counterparty
        schedules, board limits, stress tests, and management accounts.
      relatedQuestionRefs:
        - QR003
    - type: private-evidence-only
      severity: material
      topic: governance-and-financing
      missingEvidence: >-
        SC Ventures investment amount, ownership percentage, board and veto rights, liquidation
        preferences, anti-dilution terms, information rights, and commercial commitments.
      whyItMatters: >-
        These rights determine dilution, governance influence, minority protection, and whether a
        strategic relationship creates dependency.
      diligencePath: >-
        Review the cap table, subscription agreement, shareholder agreement, side letters, board
        materials, and related commercial contracts.
      relatedQuestionRefs:
        - QR006
    - type: missing-source
      severity: material
      topic: concentration-and-integration
      missingEvidence: >-
        Customer, counterparty, venue, bank, custodian, issuer, asset, and geography concentration,
        plus acquisition retention, renewal, synergy, and control-integration KPIs.
      whyItMatters: >-
        A broad service menu and partner list do not establish diversified revenue, substitutable
        infrastructure, or successful post-acquisition execution.
      diligencePath: >-
        Obtain concentration schedules, dependency maps, tested exit plans, cohort and renewal
        data, integration dashboards, control findings, and key-person retention records.
