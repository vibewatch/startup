company:
  name: "GSR"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    GSR publicly addresses institutional and crypto-native buyers through OTC execution,
    liquidity, treasury, and token-lifecycle services, but the reviewed evidence provides
    only one named user testimonial and no retention or concentration metrics. The customer
    thesis is therefore supported at the product-access level, not at the durable-revenue level.
sections:
  - id: "segments-and-access"
    title: "Segments and access model"
    body: >-
      The public customer map spans token issuers, exchanges, financial institutions,
      fintech and payments companies, and asset managers, but that segmentation comes from
      a third-party directory rather than a disclosed customer ledger. GSR's own surfaces
      describe a single access path across systematic OTC, market making, treasury services,
      and operational workflows. For institutional buyers, the value proposition is breadth
      and fewer handoffs: UI and API access, more than 200 digital assets, 25 fiat currencies,
      and adjacent treasury capabilities. Geography remains permission-dependent, however;
      the syndicated GSR release explicitly says separate authorizations do not confer rights
      in another jurisdiction. The available sources establish intended buyer fit, not segment
      revenue, active-account counts, or payer-level economics.
    claimRefs: ["CU001", "CU005", "CU008", "CU009", "CU015"]
    tableRefs: ["TU001"]
  - id: "adoption-signals"
    title: "Adoption signals are scale claims, not cohort evidence"
    body: >-
      GSR discloses substantial service-capacity indicators: a minimum OTC ticket of $250,000,
      support for trades up to $100 million, more than 200 digital assets, 25 fiat currencies,
      more than 300 liquidity partners, and more than $1 trillion traded. These figures indicate
      an institutional operating envelope and a potentially broad counterparty network, but
      none supplies the missing denominators needed to assess adoption quality. Public evidence
      does not identify active clients, transaction frequency, revenue-producing accounts,
      utilization by segment, repeat-purchase behavior, or the period distribution behind
      cumulative trading volume. The metrics should therefore be read as company-reported
      capacity and historical reach rather than proof of current customer growth or recurring
      demand.
    claimRefs: ["CU001", "CU002", "CU003", "CU010", "CU011"]
    tableRefs: ["TU002"]
  - id: "named-proof-and-durability"
    title: "Named proof is sparse and durability is undisclosed"
    body: >-
      The strongest named user evidence is a testimonial from Astar financial officer Xin Xing,
      who described the platform as reliable, easy to navigate, and useful for trading insight.
      That statement is directionally positive but does not disclose whether the relationship is
      a production deployment, pilot, paid contract, or occasional trading account, and it gives
      no quantified outcome. An allocated Amberdata case-study URL cannot close that gap because
      its current fetched content redirects to a Kaiko acquisition article with no GSR customer
      evidence. Independent analysis also identifies customer adoption, delivery, renewals, and
      operating results as still needing validation. No reviewed source supplies NRR, GRR, churn,
      renewal rates, contract terms, satisfaction scores, or customer concentration.
    claimRefs: ["CU004", "CU012", "CU013", "CU014", "CU016"]
    tableRefs: ["TU003"]
  - id: "expansion-path-and-friction"
    title: "Expansion path is plausible but commercially unproven"
    body: >-
      GSR's proposed expansion loop begins with institutional or issuer qualification, moves
      through UI or API execution, and then broadens into market making, treasury, advisory, and
      token-lifecycle support. GSR One provides the cross-service storefront, while the
      $57 million acquisitions of Autonomous and Architech add formation, governance, launch,
      liquidity, and long-term capital-planning capabilities. This creates a coherent
      land-and-expand hypothesis: an execution relationship could extend across more of a
      customer's lifecycle. The evidence does not yet show attachment rates, cross-sell revenue,
      renewal uplift, or integration outcomes. A $250,000 minimum OTC trade also narrows the
      addressable user set and may create procurement friction for smaller counterparties.
      Investment diligence should require cohort and concentration data before treating the
      broader service menu as durable expansion.
    claimRefs: ["CU003", "CU005", "CU006", "CU007", "CU013", "CU014"]
    figureRefs: ["FU001"]
