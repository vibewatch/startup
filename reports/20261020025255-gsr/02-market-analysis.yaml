figures:
  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      The evidence supports ordered opportunity layers, but no numerical size or conversion rate between them.
    data:
      items:
        - label: Digital-asset economic activity
          value: Unquantified context
          note: Gross trading volume and token FDV are excluded as revenue proxies.
          tone: neutral
          claimRefs: [CM002, CM003]
        - label: Outsourced crypto capital-markets spend
          value: Unquantified addressable pool
          note: Includes paid liquidity, execution, advisory, launch, and treasury services.
          tone: neutral
          claimRefs: [CM001, CM002]
        - label: Applicable institutional and token-organization demand
          value: Buyer count and budgets unknown
          note: Eligibility depends on geography, regulation, workflow need, and willingness to outsource.
          tone: warning
          claimRefs: [CM008, CM009]
        - label: GSR serviceable workflows
          value: Service scope evidenced; spend unknown
          note: Market making, OTC, advisory, launch operations, and treasury are publicly described.
          tone: positive
          claimRefs: [CM001, CM006, CM007]
        - label: GSR reachable demand
          value: Reachable share unknown
          note: Distribution, pricing, conversion, and renewal evidence is not public.
          tone: warning
          claimRefs: [CM009, CM010, CM012]
        - label: Realized GSR revenue and profit
          value: Not disclosed
          note: Segment revenue, margins, risk-adjusted profit, and cash conversion are required.
          tone: negative
          claimRefs: [CM003, CM013, CM016]
    approximationNotes: >-
      No market values, widths, shares, or conversion rates are estimated; layer order
      represents analytical narrowing only, and the rendered taper must not be read as magnitude.
    claimRefs: [CM002, CM008, CM009, CM010, CM012, CM013, CM016]
callouts:
  - calloutType: insight
    title: The opportunity is broader than market making but narrower than crypto activity
    body: >-
      GSR has evidenced a broader service perimeter, yet only external service spend
      is addressable. Trading notional, token FDV, and client treasury assets should
      not be capitalized as though they were GSR revenue.
    claimRefs: [CM001, CM002, CM003]
  - calloutType: risk
    title: Sizing is not decision-grade
    body: >-
      A numerical market multiple would rest on unsupported denominators until buyer
      counts, budgets, pricing, geographic eligibility, conversion, and segment economics are obtained.
    claimRefs: [CM009, CM013, CM016]
