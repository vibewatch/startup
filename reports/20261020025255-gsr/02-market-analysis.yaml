        - Unpriced internal effort and unsupported savings assumptions
        - The same organizations acting as their own payer
        - Main alternative to the integrated proposition
    notes: >-
      Boundary analysis based on GSR service pages and the acquisition announcement;
      pricing and segment revenue are undisclosed, so no row is a quantitative market estimate.
    claimRefs: [CM001, CM002, CM003, CM004, CM006, CM007]
