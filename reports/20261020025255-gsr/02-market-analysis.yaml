      whyItMatters: Without these inputs, numerical TAM, SAM, SOM, growth, and market-share assumptions would be invented.
      diligencePath: Commission or obtain third-party institutional digital-asset service-spend data and reconcile it to GSR's actual product and jurisdiction scope.
