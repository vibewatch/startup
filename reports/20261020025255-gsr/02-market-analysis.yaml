        - Token issuers, foundations, exchanges, and marketplaces
        - Core evidenced service
      - - Institutional OTC execution
        - External execution and trading-service spend; pricing is undisclosed
        - Principal trade notional, assets traded, and client assets
        - Institutions, funds, and treasury desks
        - Core evidenced service
      - - Token design and launch advisory
        - External advisory, token-economics, listing-strategy, and launch-support spend
        - Token FDV, fundraising proceeds, and exchange trading volume
        - Token projects, issuers, and foundations
        - Evidenced expansion service
      - - Treasury and capital-markets support
        - External treasury, risk, capital-planning, and operational-support spend
        - Treasury asset value, working capital, and investment principal
        - Foundations and tokenized organizations
        - Evidenced expansion service
      - - Asset management and venture activity
        - Only separately contracted fees or economics attributable to those activities
        - Portfolio company value, fund assets, and invested capital without revenue attribution
        - Institutions, founders, and investment counterparties
        - Adjacency; exclude from core sizing without segment disclosure
      - - Status-quo substitutes
