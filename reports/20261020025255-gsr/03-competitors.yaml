    title: Competitor and substitute profiles
    columns:
      - Alternative
      - Category
      - Public scale or direction
      - Target need
      - Differentiation
      - Evidence limitation
    rows:
      - [GSR, Direct integrated provider, "> $1T traded and >250 tokens reported by Forbes as of October 2025", "Institutions, issuers, protocols, and tokenized organizations", "Market making plus OTC, treasury, advisory, asset management, and regulated securities expansion", "No comparable revenue, market share, or execution benchmark"]
      - [Wintermute, Direct peer, "New York office and product expansion reported in 2026 competitor coverage", "Institutional and crypto-native trading", "Prediction markets, DeFi vault curation, and tokenized-gold trading", "Scale, pricing, and regulatory permissions not quantified in retained evidence"]
      - [B2C2, Direct peer, "MiCA authorization and institutional OTC expansion reported in 2026 competitor coverage", "Institutional OTC and stablecoin flows", "Regulatory authorization paired with OTC focus", "No like-for-like activity or profitability metrics"]
      - [Keyrock, Direct peer, "New York expansion, MiCA pursuit, and fund-management acquisition reported", "Institutional liquidity and asset management", "Geographic and asset-management expansion", "Source does not establish realized scale or service quality"]
      - [DWF Labs, Direct and adjacent peer, "Expansion from liquidity provision into real-world-asset trading reported", "Token issuers and RWA trading", "RWA and gold-trading adjacency", "Sparse independent performance evidence in the assigned pool"]
      - ["Internal build / multi-vendor stack", Substitute and status quo, "Not publicly quantifiable", "Large buyers coordinating trading, treasury, custody, and advice", "Control and provider diversification", "Cost, staffing, and performance are buyer-specific and undisclosed"]
    notes: "Coverage is a representative competitive set from the assigned evidence, not an exhaustive market ranking; peer directions rely primarily on one low-reputation independent article and unsupported metrics are marked as unknown."
    claimRefs: [CP005, CP006, CP007, CP014]
  - id: TP002
    title: Capability and buying-criteria matrix
    columns:
      - Buying criterion
      - GSR evidence
      - Peer or substitute evidence
      - Competitive implication
    rows:
      - ["Unified workflow", "GSR One combines market making, systematic OTC, treasury, and operational workflows", "Peers are also broadening products, but no equivalent workflow was verified in the pool", "Potential coordination advantage; adoption and retention unverified"]
      - ["Token lifecycle advisory", "Autonomous and Architech add formation, governance, token design, launch, and treasury capabilities", "Internal teams and specialist advisers can be assembled separately", "Broader scope, but integration outcomes remain unverified"]
      - ["U.S. securities capability", "Forbes reported acquisition of a FINRA-registered broker-dealer to support capital raising", "Forbes said no other major crypto market maker held that license at the time and expected rivals to follow", "Possible first-mover distribution advantage that may narrow"]
      - ["Tokenized-asset liquidity", "Systematic OTC liquidity and on-chain settlement through DigiFT for three initial tokenized funds", "DigiFT owns the regulated exchange and distribution layer", "Partner access expands scope while creating channel dependence"]
      - ["Regulated global footprint", "Separate Cayman securities-dealing and asset-management registrations were announced", "Keyrock and B2C2 regulatory expansion was reported by competitor coverage", "Licensing is increasingly table stakes and remains entity- and jurisdiction-specific"]
    notes: "Cells summarize only the assigned sources; absence of a verified peer capability means unknown, not absent."
    claimRefs: [CP001, CP003, CP004, CP005, CP007, CP009, CP010, CP011, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Offering
      - Public contract model
      - Public price or unit
      - Included capability evidence
      - Underwriting implication
    rows:
      - ["Market making", "Bespoke institutional engagement; terms not disclosed", Unknown, "Continuous liquidity and market-making services are publicly described", "Request spreads, rebates, inventory terms, venue coverage, and stress-period KPIs"]
      - ["Systematic OTC", "Quoted institutional transactions; terms not disclosed", Unknown, "GSR One and DigiFT materials describe systematic OTC access and execution", "Benchmark all-in execution, settlement, minimum size, and counterparty exposure"]
      - ["Treasury and advisory", "Advisory or managed-service packaging not disclosed", Unknown, "Acquired capabilities include finance, operations, token design, and treasury support", "Separate recurring fees, project fees, trading economics, and conflicts"]
      - ["Tokenized RWA liquidity", "OTC quotes through DigiFT; commercial split not disclosed", Unknown, "Seven-day Asian-hours liquidity for three initial tokenized funds was announced", "Obtain spread, volume, uptime, partner economics, and renewal data"]
    notes: "No retained source discloses comparable prices or realized customer terms; Unknown is an evidence gap, not a zero price."
    claimRefs: [CP001, CP003, CP009, CP010, CP014]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      Analyst-assigned ordinal positions compare publicly described service breadth
      with regulatory or institutional integration evidence, not market share or quality.
    data:
      xAxis:
        label: "Publicly described service breadth (1=narrow, 5=full lifecycle)"
        min: 1
        max: 5
      yAxis:
        label: "Regulatory or institutional integration evidence (1=limited, 5=strong)"
        min: 1
        max: 5
      points:
        - label: GSR
          x: 5
          y: 5
          detail: "Integrated trading, treasury, advisory, asset-management, broker-dealer, and Cayman registration evidence."
        - label: DigiFT
          x: 4
          y: 5
          detail: "End-to-end tokenization and distribution platform with MAS and SFC licensing described in partnership material."
        - label: Keyrock
          x: 4
          y: 4
          detail: "New York expansion, MiCA pursuit, and a fund-management acquisition reported by Blab."
        - label: B2C2
          x: 3
          y: 4
          detail: "MiCA authorization plus institutional OTC and stablecoin expansion reported by Blab."
        - label: Wintermute
          x: 4
          y: 2
          detail: "Broader product set and a New York office were reported, but no license was verified in the assigned evidence."
        - label: DWF Labs
          x: 2
          y: 1
          detail: "RWA and gold-trading expansion was reported; regulatory integration was not established in the assigned evidence."
    approximationNotes: >-
      Scores are analyst-assigned ordinal summaries of the retained disclosures as of
      2026-10-20. They are not measured performance, market share, price, or quality
      benchmarks; peer evidence is sparse and should be refreshed with primary sources.
    claimRefs: [CP002, CP004, CP007, CP009, CP011]
callouts:
  - calloutType: strength
    title: Breadth can lower coordination cost
    body: >-
      GSR can credibly present one relationship across issuance, trading, treasury,
      and regulated capital-markets workflows, although adoption and economics remain unproven.
    claimRefs: [CP001, CP002, CP003, CP009]
  - calloutType: risk
    title: Convergence can commoditize breadth
    body: >-
      Competitors are also adding licenses and adjacent products while public evidence
      does not establish superior pricing or execution, leaving differentiation vulnerable.
    claimRefs: [CP007, CP008, CP014]
