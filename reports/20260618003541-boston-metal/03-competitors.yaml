  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: green steel competitor pricing
      missingEvidence: >-
        Specific per-tonne pricing for any competitor's green steel or clean iron product, including
        Stegra offtake prices, SSAB Zero premium, ArcelorMittal XCarb certificate price, Nucor Econiq
        premium, and Boston Metal's target MOE Steel licensing economics.
      whyItMatters: >-
        Without comparative pricing data, the green premium sustainability cannot be quantified and
        Boston Metal's licensing economics cannot be compared to competitors' direct sales models. This
        is the most significant evidence gap across the entire competitive chapter.
      diligencePath: >-
        Request indicative MOE Steel licensing fee and anode cost structure from Boston Metal management;
        compare to any SSAB Zero or Stegra premiums disclosed in investor relations or partner briefings.
      relatedQuestionRefs:
        - QP027

    - type: access-blocked
      severity: material
      topic: thyssenkrupp tkH2Steel restructuring impact
      missingEvidence: >-
        Specific updates on how thyssenkrupp's financial restructuring affects the tkH2Steel DRI program
        capital allocation, timeline, and whether the €2B EU Innovation Fund grant remains accessible
        given parent company financial difficulties.
      whyItMatters: >-
        thyssenkrupp is one of the largest European steelmakers and its hydrogen DRI program directly
        competes for the same European industrial steel buyer segment as Boston Metal's MOE Steel.
        If tkH2Steel is delayed, this reduces one competitor threat but also signals the difficulty
        of capital-intensive green steel programs at incumbents.
      diligencePath: >-
        Monitor thyssenkrupp Q3/Q4 2026 investor updates and EU Innovation Fund grant disbursal announcements;
        track restructuring proceedings for capital allocation impact on tkH2Steel.
      relatedQuestionRefs:
        - QP017

    - type: missing-source
      severity: moderate
      topic: Boston Metal MOE inert anode IP specifics
      missingEvidence: >-
        Boston Metal's specific patent portfolio covering inert anode technology for MOE, including
        claim breadth, international filing coverage, expiry dates, and whether competing anode
        systems have been developed by any H-DRI or EAF incumbents.
      whyItMatters: >-
        The inert anode is the most critical proprietary component of MOE Steel and its durability
        is the most cited remaining engineering risk. The breadth and defensibility of the IP moat
        directly affects how durable Boston Metal's licensing model will be at commercial scale.
      diligencePath: >-
        Search USPTO and EPO patent databases for Boston Metal or Boston Electrometallurgical Corporation
        anode patent filings; obtain a patent landscape analysis covering molten oxide electrolysis
        inert anode claims.
      relatedQuestionRefs:
        - QP028

    - type: missing-source
      severity: moderate
      topic: POSCO HyREX detailed commercial roadmap
      missingEvidence: >-
        POSCO's specific HyREX commercial deployment timeline, scale targets, and whether POSCO has
        made licensing or deployment decisions that would position it as a competitor or partner for
        MOE in the Asian steelmaking market.
      whyItMatters: >-
        POSCO is one of the world's top-5 steelmakers and a major presence in Korean and global
        markets where Boston Metal may seek licensees. If HyREX reaches commercial scale before MOE,
        POSCO becomes an H-DRI competitive precedent that reduces MOE's case in Asian markets.
      diligencePath: >-
        Monitor POSCO annual reports and press releases for HyREX construction or demonstration milestones;
        review whether the April 2026 JDA with Electra indicates preference for electrochemical routes.
      relatedQuestionRefs:
        - QP029

    - type: missing-source
      severity: moderate
      topic: green hydrogen cost trajectory 2025-2030
      missingEvidence: >-
        Current IEA, BloombergNEF, or IRENA projections for green hydrogen production cost trajectories
        through 2030, specifically whether the $2/kg threshold is projected before or after 2030 at
        commercial scale, and how delays in H2 cost reduction affect H-DRI competitive timing.
      whyItMatters: >-
        Green hydrogen cost reduction is the most important external variable in the H-DRI versus MOE
        competitive race. If H2 costs fall faster than currently projected, MOE's infrastructure
        simplicity advantage narrows significantly on cost competitiveness.
      diligencePath: >-
        Review IEA Global Hydrogen Review 2025 and BloombergNEF hydrogen cost trajectory reports;
        compare to Stegra's and HYBRIT's disclosed assumptions for green hydrogen pricing.
      relatedQuestionRefs:
        - QP030

    - type: private-evidence-only
      severity: moderate
      topic: Outokumpu MOU commercial development scope
      missingEvidence: >-
        Progress updates on the Boston Metal-Outokumpu MOU signed September 2025, including whether
        the joint development project has resulted in preliminary commercial terms, feedstock volumes,
        or an extension to a formal supply or licensing agreement.
      whyItMatters: >-
        The Outokumpu MOU is Boston Metal's most concrete publicly disclosed downstream partnership
        for its critical metals business. If it develops into a commercial agreement, it validates
        the stainless steel side-stream recovery thesis and strengthens the critical metals competitive
        position; if it remains an MOU, it adds limited competitive value.
      diligencePath: >-
        Request joint development project status from Boston Metal and Outokumpu management;
        review Outokumpu EVOLVE strategy updates for Boston Metal collaboration progress.
      relatedQuestionRefs:
        - QP026

