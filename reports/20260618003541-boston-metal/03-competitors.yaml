  - id: moat-durability-and-competitive-risk
    title: Moat durability, switching costs, lock-in, and adverse competitor evidence
    body: >-
      Boston Metal's most durable structural moat is the combination of no-hydrogen and no-CCS requirements
      for near-zero-CO2 ironmaking. Every H-DRI competitor (Stegra, HYBRIT, ArcelorMittal Hamburg, SALCOS,
      tkH2Steel) depends either on green hydrogen supply infrastructure that is not yet commercially available
      at required scale and cost, or on a temporary natural gas bridge that preserves a non-zero carbon footprint.
      MOE requires only renewable electricity and iron ore, two inputs that are globally available and
      not hydrogen-specific. This feedstock simplicity is a compounding advantage as green H2 cost reduction
      timelines extend beyond original projections and as U.S. federal clean industry support weakens under
      the current administration.

      The modular licensing model creates a different kind of structural advantage relative to giga-plant
      competitors. Stegra's single €7.9 billion Boden commitment is an all-in bet on one site, one hydrogen
      supply chain, and one regulatory/political environment. Boston Metal's licensing and anode-supply model
      distributes capex across licensee partners, allows concurrent deployment in multiple geographies, and
      generates revenue from anode manufacturing without requiring Boston Metal to own or operate steel mills.
      This model lowers the steelmaker's technology adoption decision from a multi-billion capital commitment
      to a licensing fee plus anode purchase agreement — a substantially lower switching barrier than
      building a giga-plant or a hydrogen DRI complex.

      The principal adverse competitor evidence in Boston Metal's record is commercialization timing. Stegra's
      DRI tower and electrolyzer are physically under construction and scheduled for first steel production in
      2026–2027, while Boston Metal's MOE Steel demonstration plant (targeted for late 2026 start construction,
      2027 operation per the MIT Technology Review March 2025 report) remains in planning. Boston Metal's
      2026 execution setback at its Brazil plant — a refractory leak that caused a financing milestone miss,
      71 layoffs, and a September 2026 restart target — shifts the company's near-term revenue from critical
      metals, not steel, and reduces management bandwidth for parallel steel scale-up. The investor who
      acquired Stegra customer relationships with BMW, Mercedes-Benz, Scania, Porsche, and Volvo Group before
      Boston Metal's MOE Steel product is commercially available has locked in the most strategic automotive
      Scope 3 supply agreements in the market. A buyer committed to 100,000+ tonnes annually of Stegra green
      steel is unlikely to re-tender for a competing MOE steel product before the original supply term expires.

      The switching cost analysis for MOE Steel licensing is mixed. On one hand, the steelmaker-licensee
      relationship is sticky once established — MOE cells are integrated into the ironmaking workflow,
      and transitioning back to BF-BOF or to H-DRI after commissioning would require capital reinvestment.
      On the other hand, the anode-supply dependency creates a vendor lock-in that steelmakers may resist
      at contract stage, preferring either a commodity anode market or a captive inert-anode manufacturing
      capability. Multi-homing risk — where a licensee also develops H-DRI capability — is real for
      large integrated producers like ArcelorMittal, which has strategic optionality across both pathways.
