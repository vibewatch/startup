  claims:
    - id: CP001
      statement: >-
        Boston Metal's competitive landscape in steel has three distinct segments: novel electrolytic ironmaking
        peers (Electra, using MOE-analogous electrochemistry), green-H2 DRI pioneers (Stegra, SSAB/HYBRIT)
        that are ahead on commercialization, and incumbent integrated steel producers (ArcelorMittal, thyssenkrupp,
        Salzgitter) running active but longer-dated decarbonization transitions.
