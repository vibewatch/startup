  - id: critical-metals-competitive-landscape
    title: Critical metals competitive landscape — CBMM, conventional smelters, and the MOE differentiation
    body: >-
      Boston Metal's critical metals business faces a fundamentally different competitive landscape than
      its steel licensing business. The dominant incumbent in niobium — the most strategically significant
      product in Boston Metal do Brasil's near-term plan — is CBMM (Companhia Brasileira de Metalurgia e
      Mineração), a privately held Brazilian company that controls approximately 80–85% of global niobium
      production, primarily from its Araxá mine in Minas Gerais. CBMM supplies ferroniobium to global
      steelmakers who use small additions (typically 0.04–0.05% by weight) to produce high-strength low-alloy
      steel. CBMM's positional monopoly in niobium supply is a significant barrier: it has the lowest-cost
      production, the deepest customer relationships in steelmaking, and the brand recognition associated
      with decades of reliable supply. CEO Tadeu Carneiro's former leadership of CBMM is a double-edged
      competitive signal — it confirms deep industry knowledge but also signals that Boston Metal's critical
      metals play is entering territory where the company's CEO personally knows the incumbent's operations.

      For tantalum, the global supply is concentrated in Australia (Pilbara Minerals, Global Advanced
      Metals), the Democratic Republic of Congo (artisanal and semi-industrial miners), and China
      (refining-stage dominance). Conventional pyrometallurgical recovery of tantalum from columbite-tantalite
      (coltan) and tin slag is mature and well-optimized at existing smelters. Boston Metal's differentiation
      in tantalum is the ability to process lower-grade feedstocks and industrial waste streams — specifically
      tin slag and metallurgical side streams from Brazilian mining operations — which are uneconomic for
      conventional processing at small scale. Similarly, tin recovery from complex feedstocks by MOE would
      represent an alternative to conventional reverberatory furnace smelting.

      The strategic logic of the critical metals business is not to displace CBMM's core niobium market but
      to address feedstock classes that are currently discarded or processed at sub-optimal yields: low-grade
      mineral projects with mixed oxide compositions, mining and metallurgical waste streams that contain
      niobium, tantalum, tin, or vanadium in concentrations too low for conventional recovery economics.
      MOE's all-oxide electrolysis step can process these complex mixtures without the selectivity constraints
      of hydrometallurgical leaching. The Outokumpu MOU (September 2025) demonstrates the concept applied
      specifically to chromium-bearing side streams from stainless steel production, testing whether MOE
      can both recover chromium and provide anode-supply feedstock for the green steel program simultaneously.
      This dual-use logic — waste stream recovery that funds the anode supply chain — is a genuine competitive
      differentiation that no incumbent smelter currently offers.
