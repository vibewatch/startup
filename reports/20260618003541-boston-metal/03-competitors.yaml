  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - Moat Dimension
      - Boston Metal Position
      - Competitor Threat
      - Severity
      - Diligence Ask
    rows:
      - - No-hydrogen, no-CCS process pathway
        - MOE requires only renewable electricity and iron ore; eliminates H2 infrastructure risk
        - H-DRI routes (Stegra, HYBRIT, AM, TK) require green H2 at $2/kg threshold; not yet achieved
        - Medium (if H2 costs fall faster than projected, advantage narrows)
        - What is Boston Metal's modeled cost of MOE iron at $60/MWh electricity vs. H-DRI at $2/kg H2?
      - - All-ore-grade feedstock flexibility
        - MOE processes low, medium, and high iron-grade ores; H-DRI requires ≥67% Fe pellets
        - High-grade ore scarcity is a long-term H-DRI constraint; Electra shares this advantage
        - Low (structural advantage; H-DRI chemistry cannot be adapted without fundamental change)
        - Has MOE been validated across multiple ore grades commercially, or only on selected pilot feedstocks?
      - - Modular licensing model (lower steelmaker capex barrier)
        - License + anode supply model; steelmaker does not need to raise multi-billion project finance
        - Stegra/HYBRIT require steelmakers to build DRI facilities or buy steel from dedicated plant
        - Low-medium (licensing model is genuinely differentiated from giga-plant model)
        - Have any steelmakers signed licensing term sheets or letters of intent for MOE Steel?
      - - Strategic investor alignment (ArcelorMittal, BMW, Tata Steel)
        - Strategic investors provide commercial channel validation and potential first-mover license
        - "Conflict of interest: ArcelorMittal owns in-house DRI program and may not need MOE license"
        - Medium (investor stakes are options, not commitments; dual-path investors may choose DRI first)
        - Is ArcelorMittal's investment terms linked to any commercial deployment commitment or right of first refusal?
      - - Dual-business bridge (critical metals revenue funding steel scale-up)
        - Critical metals near-term revenue reduces dependency on steel licensing timeline
        - CBMM dominates niobium; 2026 Brazil plant setback delays critical metals revenue
        - High (Brazil plant restart in Sept 2026 is the most material near-term execution risk)
        - What is the post-restart production ramp timeline and what revenue milestones depend on 2026 output?
      - - Inert anode IP and supply chain
        - MOE inert anodes are a proprietary technology component; Outokumpu MOU adds chromium supply
        - Anode durability and scale-up is the primary unresolved engineering challenge for MOE Steel
        - High (anode degradation at multi-anode, large-cell scale is still in testing per MIT TR 2025)
        - What is the demonstrated service life of inert anodes at the current multi-anode industrial cell?
      - - OEM customer relationships (pre-commercial)
        - BMW strategic investor; Outokumpu MOU; Stegra has locked in BMW, Mercedes, Porsche, Volvo
        - Stegra's 1.5M+ t pre-sold backlog to premium OEMs reduces the buyer pool before MOE commercializes
        - High (buyer Scope 3 commitment timing is the primary lock-in mechanism; adverse to Boston Metal)
        - What is Boston Metal's count of active LOIs or offtake discussions for MOE Steel from named buyers?
    notes: >-
      Severity ratings (High/Medium/Low) reflect qualitative assessment based on publicly available evidence
      as of June 2026. No Boston Metal internal documents or management interviews are reflected. The
      primary risk register is focused on the steel licensing business; the critical metals business faces
      separate incumbent competition from CBMM and conventional smelters.
    claimRefs:
      - CP032
      - CP033
      - CP034
      - CP035
      - CP036
      - CP037
      - CP038
      - CP039
      - CP040

figures:
  - id: FP001
    title: Competitive positioning map — commercialization maturity vs. decarbonization depth
    type: quadrant
    layout: standard
    summary: >-
      Positions nine key competitors across two axes: x-axis is commercialization maturity (1=lab/concept,
      5=advanced demo, 9=fully commercial at scale) and y-axis is decarbonization depth of the core
      ironmaking process (1=conventional BF-BOF, 5=transitional DRI, 9=near-zero primary iron).
      Boston Metal is positioned at high decarbonization depth but early commercialization maturity,
      alongside Electra. Stegra is advanced on both axes. Nucor Econiq and SSAB Zero are fully commercial
      but at lower primary-iron decarbonization depth. Conventional BF-BOF is fully commercial at lowest
      decarbonization depth.
    data:
      xAxis: Commercialization Maturity (1=concept → 9=at scale)
      yAxis: Decarbonization Depth of Ironmaking (1=BF-BOF → 9=near-zero)
      points:
        - id: boston_metal_moe
          label: Boston Metal (MOE Steel)
          x: 2
          y: 9
          detail: >-
            Pilot-scale 1 t/run (Feb 2025); demo plant targeting 2027; no commercial license signed.
            Near-zero CO2 with renewable electricity; no H2 or CCS required.
        - id: stegra
          label: Stegra (H2 DRI-EAF)
          x: 7
          y: 8
          detail: >-
            €7.9 B financed; DRI tower +100m (Mar 2026); first steel 2026–27; 1.5 Mt+ pre-sold.
            Near-zero with green H2; natural gas bridge in early period.
        - id: hybrit_ssab
          label: SSAB / HYBRIT
          x: 6
          y: 7
          detail: >-
            SSAB Zero commercial (scrap+renewables route); HYBRIT H2 storage proven Feb 2025;
            full H2-DRI primary iron pilot extended to 2031.
        - id: arcelormittal
          label: ArcelorMittal (XCarb)
          x: 6
          y: 4
          detail: >-
            XCarb certificates commercial; Midrex DRI Ghent transitioning; BF-BOF still dominant globally.
            Multi-route, incremental decarbonization path.
        - id: electra
          label: Electra (electrowinning)
          x: 3
          y: 9
          detail: >-
            ~$264 M raised; demo plant 500 t/yr planned 2026; aqueous electrowinning at 60°C;
            99% pure iron; ore flexibility ≥35% Fe.
        - id: nucor_econiq
          label: Nucor (Econiq EAF)
          x: 9
          y: 3
          detail: >-
            Fully commercial net-zero certified steel; offset-based (not physical green primary iron);
            25%+ US market share. Decarbonization via RECs + offsets, not novel ironmaking.
        - id: salzgitter_salcos
          label: Salzgitter SALCOS
          x: 4
          y: 7
          detail: >-
            Targeting first green hot metal 2026; Germany's most advanced national DRI-H2 program;
            smaller scale than ArcelorMittal or thyssenkrupp.
        - id: thyssenkrupp_h2
          label: thyssenkrupp tkH2Steel
          x: 4
          y: 7
          detail: >-
            €2 B EU Innovation Fund grant; 2.5 Mt/year DRI target in Duisburg; financial restructuring
            creates delivery risk.
        - id: bfbof_status_quo
          label: Conventional BF-BOF
          x: 9
          y: 1
          detail: >-
            Fully commercial; ~70% of global steel; 2.0–2.3 t CO2/t. Carbon cost exposure increasing
            under CBAM (Jan 2026 definitive phase) and EU ETS.
    approximationNotes: >-
      Both axes are ordinal qualitative scales; exact placement reflects analyst judgment from public evidence.
      Stegra y-axis score reflects a planned hydrogen route with natural gas bridge in early period.
      Nucor Econiq decarbonization depth reflects offset-based certification, not physical ironmaking
      decarbonization. ArcelorMittal maturity reflects its incumbent scale in commercial steel, not
      the maturity of its green transition program specifically.
    claimRefs:
      - CP001
      - CP004
      - CP009
      - CP011
      - CP013
      - CP015
      - CP018
      - CP021

