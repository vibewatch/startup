      - number: '1.4'
        title: Milestones, commercialization arc, and partner proof points
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company using critical metals as the execution bridge to a much larger steel
              opportunity. On the steel side, Boston Metal says it commissioned a multi-inert-anode industrial cell in
              Woburn in 2025, and MIT Technology Review reported that the company’s largest pilot run produced roughly a
              ton of steel. On the commercialization side, the company’s 2024 fact sheet still framed 2026 as the
              expected commercial deployment point for MOE Steel, while 2026 company messaging sharpened the near-term
              focus toward critical metals. That pivot is understandable: the critical-metals line can monetize
              higher-value outputs sooner, using the same core electrolysis platform. Partner signals reinforce that the
              technology is being tested across multiple value chains. BMW frames Boston Metal as a route to decarbonize
              automotive steel; Outokumpu is using the platform to test chromium-bearing side streams; Microsoft and IFC
              validate the company from financing and climate-tech deployment angles; and the U.S. government-backed
              Weirton chromium project extends MOE beyond steel into strategic materials manufacturing. Awards like
              TIME100 and Fast Company add visibility, but the more important signal is that partners are engaging
              around real feedstocks, capital, and manufacturing plans.
