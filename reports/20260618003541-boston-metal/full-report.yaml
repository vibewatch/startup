      - number: '5.2'
        title: Inert Anode Engineering and Scale-Up Architecture
        blocks:
          - type: paragraph
            body: >-
              The inert anode is the single most critical and technically difficult component of the MOE Steel process.
              In conventional aluminum smelting (the Hall-Héroult process), a consumable carbon anode reacts
              continuously with oxygen, releasing CO₂. Boston Metal's breakthrough was discovering an iron-chromium
              alloy that remains inert—it does not dissolve, corrode, or react with oxygen—at 1,600°C and under the
              oxidizing potential applied during electrolysis. The anode is described publicly as primarily made of
              chromium and iron, with small quantities of additional elements. The precise alloy composition is
              proprietary and constitutes Boston Metal's core IP.

              The engineering challenge is formidable: the anode must simultaneously withstand extreme temperature,
              continuous oxygen bombardment, and electrochemical oxidation without degradation. As Boston Metal SVP Adam
              Rauwerdink explained to CNBC: "There's very few elements that will do that. That alloy is one that will."
              Early-phase anode degradation in improperly calibrated conditions—imbalanced current distribution or
              electrolyte chemistry drift—was the primary technical obstacle the company spent its first decade solving.
              CEO Tadeu Carneiro noted in 2023 that the question had shifted from binary success/failure to anode
              service life: "It's a question of how long will be the life of the anode? Is it going to last three years
              or two years?" Independent verification of actual anode lifetime under production conditions has not been
              published.

              Boston Metal's scale-up architecture mirrors aluminum smelting. A single cell runs at higher current to
              produce more metal, up to a target of approximately 600,000 amps per cell producing roughly 10 tonnes per
              day. Beyond a practical single-cell limit, multiple anodes are added to the same cell body (the
              multi-anode design proven in March 2025), and then multiple cells are arrayed in parallel to reach
              plant-scale output. A full-scale commercial plant may have several hundred electrolysis cells. The pilot
              reactor installed in Woburn in 2022 ran at up to 25,000 amps—roughly a thousand times larger than early
              laboratory cells—and served as the engineering testbed for the multi-anode transition. The Outokumpu MOU
              signed in September 2025 provides a structured supply of chromium feedstock from Outokumpu's Kemi mine in
              Finland to secure the inert anode supply chain.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
