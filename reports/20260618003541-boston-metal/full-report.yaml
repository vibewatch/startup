  - id: FE003
    title: Boston Metal Critical Dependency Map
    type: dag
    layout: wide
    summary: >-
      Key technical, supply-chain, and external dependencies that must be managed for MOE to reach commercial
      steelmaking scale.
    data:
      nodes:
        - id: iron_ore
          label: Iron Ore Supply
          detail: Low/medium-grade ore; flexibility vs H2-DRI is key advantage; no pelletizing needed
        - id: renewable_electricity
          label: Renewable Electricity
          detail: 600 kA per cell; ~5,000 TWh globally if all BF-BOF converted; electricity price is key cost lever
        - id: chromium_supply
          label: Chromium Feedstock (Inert Anode)
          detail: Fe-Cr alloy anode; Outokumpu MOU secures supply from Kemi mine, Finland
        - id: refractory
          label: Refractory Engineering
          detail: High-temperature cell lining; Jan 2026 Brazil failure shows criticality; must withstand 1,600°C melt
        - id: mit_ip
          label: MIT Patents (Licensed)
          detail: Core inert anode and MOE cell IP; licensed exclusively from MIT TLO; additional Boston Metal patents filed
        - id: moe_cell_design
          label: MOE Cell Design (Boston Metal IP)
          detail: Multi-anode architecture; process controls; cell geometry; scaling from 25 kA to 600 kA
        - id: doe_grant
          label: DOE Grant (Weirton WV)
          detail: $50M grant for chromium manufacturing plant; milestone-based; conditions not disclosed
        - id: outokumpu
          label: Outokumpu Partnership
          detail: MOU for stainless steel side-stream processing and Cr feedstock; Sep 2025
        - id: commercial_demo
          label: Demo Plant (2026–2027)
          detail: Multi-cell plant; target ~1–2 t/day; required for steelmaker licensing
        - id: licensing_pipeline
          label: Steelmaker Licensing Pipeline
          detail: No executed license agreements public; steelmakers ArcelorMittal, BMW investors but not yet licensees
      edges:
        - from: iron_ore
          to: moe_cell_design
          label: feedstock
        - from: renewable_electricity
          to: moe_cell_design
          label: process energy
        - from: chromium_supply
          to: moe_cell_design
          label: anode material
        - from: refractory
