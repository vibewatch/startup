      - number: '3.2'
        title: Direct competitors — green H2 DRI pioneers and electrolytic iron peers
        blocks:
          - type: paragraph
            body: >-
              Stegra is the most formidable commercialization-stage competitor in the green steel segment. Founded as H2
              Green Steel in 2021 and renamed Stegra in September 2024, the company is building a fully integrated green
              steel plant in Boden, northern Sweden, using green hydrogen direct reduction of LKAB iron ore pellets
              followed by electric arc furnace steelmaking. The timeline of construction milestones through mid-2026
              shows rapid execution: the final electrolyzer module was installed in April 2026, the DRI tower passed the
              100-meter mark in March 2026, and the company agreed in principle on €1.4 billion in additional financing
              in April 2026, taking total secured financing above €7.9 billion. Pre-sold volume exceeds 1.5 million
              tonnes, committed by Porsche, IKEA, Mercedes-Benz, Scania, Volvo Group, ZF Group, Microsoft, and
              thyssenkrupp Materials Services. This pre-sold book directly reduces the addressable buyer universe
              available to Boston Metal's MOE Steel licensing model before that model is commercial, because steel
              buyers with binding decarbonization timelines are committing supply agreements rather than waiting for
              multiple technology options. Stegra's structural weakness is hydrogen economics: the plant's cost
              competitiveness depends on large-scale green hydrogen production from hydropower-backed Swedish grid
              electricity, and if green H2 costs do not fall toward the $2/kg threshold by the late 2020s, the plant's
              economics will remain premium-dependent.

              SSAB's HYBRIT joint venture (with LKAB and Vattenfall) represents the most validated hydrogen DRI proof of
              concept. HYBRIT proved large-scale fossil-free hydrogen storage in lined rock caverns in February 2025,
              removing a critical technical risk for the H-DRI route and winning the Ny Teknik Grand Prize for
              Engineering 2025 in Sustainability. HYBRIT's pilot project for hydrogen storage was completed and reported
              to the Swedish Energy Agency, confirming viability for industrial-scale fossil-free iron and steel
              production. SSAB's commercially available SSAB Zero product — which is currently based on the existing
              recycled scrap plus fossil-free energy pathway rather than full HYBRIT H-DRI primary iron — is already
              generating revenue and signed a letter of intent with Rheinmetall in January 2026 for fossil-free steel
              supply to defense manufacturing. The strategic implication for Boston Metal is that SSAB has both a
              commercial product today and a technical roadmap to full primary iron decarbonization via HYBRIT — giving
              it a multi-year commercial head start on customer relationship building.

              Electra is the closest technological peer to Boston Metal in terms of process philosophy — using
              electricity rather than hydrogen to reduce iron from ore — but employs a fundamentally different
              mechanism. Electra's aqueous electrowinning process dissolves iron ore in dilute acid at approximately
              60°C and electrodeposits iron at 99% purity from the dissolved solution, operating at room temperature
              rather than Boston Metal's 1,600°C molten electrolyte. Electra's structural advantages relative to MOE are
              its ore grade flexibility (≥35% Fe versus BF-BOF's typical requirement of ≥62–65% and H-DRI's ≥67%), its
              lower process temperature (lower energy per tonne at the cell level), and a demonstrated clean iron purity
              of 99% that surpasses pig iron and DRI specifications. Electra's limitations include its pre-commercial
              status, smaller funding base (~$264M vs. Boston Metal's >$500M), and a business model that requires EAF
              steelmakers to adopt a new feedstock specification rather than licensing the technology to existing
              integrated producers. Both Electra and Boston Metal are substantially behind Stegra on commercialization
              readiness as of mid-2026.
