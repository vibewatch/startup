      - number: '6.3'
        title: Critical-metals counterparties and public-sector demand shaping
        blocks:
          - type: paragraph
            body: >-
              On the critical-metals side, the customer set is more operationally specific. Boston Metal's Brazil
              subsidiary is positioned as the first deployment of the MOE platform for commercial metal recovery, with
              mining companies and industrial waste owners as the core customer archetypes. The company explicitly
              markets the process as a way to convert liabilities into monetizable metal outputs. That makes the
              near-term buyer conversation less about green premiums and more about recovery economics, by-product
              monetization, and supply-chain resilience for strategic metals.


              Outokumpu and CBMM are the most telling named proof points. The 2025 Outokumpu MOU is important because it
              combines potential customer behavior with supply-chain support: Outokumpu agreed to evaluate Boston
              Metal's technology in the context of chromium-bearing materials and circularity inside its own operations.
              Earlier, CBMM's niobium partnership showed that Boston Metal was already engaging mining-side
              counterparties on specialty metals use cases. These are not yet large-volume revenue disclosures, but they
              are better aligned to the actual first-market application than steel-industry narratives alone.


              Government-backed chromium manufacturing in Weirton adds another layer. DOE and Senate materials show
              Boston Metal positioned around ultrapure chromium and high-temperature alloys for advanced energy and
              industrial uses. That does not prove customer pull in the same way a long-term offtake would, but it
              expands the commercialization map beyond one Brazil plant and one steel thesis.
