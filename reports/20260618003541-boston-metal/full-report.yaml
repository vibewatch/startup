      - number: '1.5'
        title: Adverse evidence, contradictions, and open diligence items
        blocks:
          - type: paragraph
            body: >-
              The main adverse evidence in the current record is execution, not demand. MIT Technology Review reported
              that a refractory-system leak at the Brazil plant in early 2026 delayed startup, caused the company to
              miss a financing milestone, and contributed to cash-flow stress that preceded layoffs of 71 employees in
              April 2026. Management told the outlet that the plant should restart in September 2026, but that still
              leaves Boston Metal with a visible schedule reset at the exact moment it is leaning more heavily on
              critical-metals revenue as the bridge to full steel commercialization. There are also softer but still
              material information gaps. Public sources do not reconcile headcount cleanly: the 2024 fact sheet says
              300-plus employees while the 2026 FAQ says over 250 employees, which is directionally consistent with
              layoffs but not precise enough for operating-model work. Public materials also omit valuation, the full
              board roster, and a detailed ownership table. Taken together, the chapter supports a view of Boston Metal
              as a technically credible, well-financed growth-stage company whose biggest near-term questions are
              execution timing and transparency rather than scientific legitimacy.
