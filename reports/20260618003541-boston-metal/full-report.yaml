          label: Brazil MOE Critical Metals plant
          detail: First deployment and near-term revenue bridge; converts waste into saleable metals.
        - id: specialty-buyer
          label: Critical-metals buyer
          detail: Buys niobium, tantalum, tin, chromium, or related outputs for industrial and strategic uses.
