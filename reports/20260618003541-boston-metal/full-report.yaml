  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer map and commercial stage
        blocks:
          - type: paragraph
            body: >-
              Boston Metal does not yet read like a conventional revenue-stage industrial supplier with a disclosed list
              of paying accounts. The public record instead shows two customer motions at different maturity levels. The
              steel motion is aimed at incumbent mills and large industrial buyers that need a route to primary steel
              decarbonization without relying on hydrogen infrastructure or carbon capture. Boston Metal's own MOE Steel
              materials describe the product as a deployable technology platform for steelmakers, which implies a
              licensing and equipment relationship rather than direct steel sales from Boston Metal's balance sheet.


              The nearer-term motion is in critical metals. Boston Metal's FAQ, MOE Critical Metals page, and Brazil
              materials all emphasize mining and metallurgical customers that want to monetize waste streams or
              low-grade feedstocks. That framing matters because it means the first commercial proof point is not
              automotive or construction steel demand; it is recovery of high-value metals from slag and industrial
              residues. In effect, the company is using a higher-value, lower-volume customer wedge to fund a much
              larger but longer-dated steel opportunity.


              That split explains why the public pipeline looks strategically rich but commercially early. Boston Metal
              has multiple industrial counterparties, but most are still investors, joint-development partners,
              government funders, or future adopters rather than disclosed recurring customers. The chapter therefore
              treats customer traction as relationship proof and commercialization sequencing, not as revenue proof.
            claimRefs:
