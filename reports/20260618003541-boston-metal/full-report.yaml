      decarbonization depth but early commercialization maturity, alongside Electra. Stegra is advanced on both axes.
      Nucor Econiq and SSAB Zero are fully commercial but at lower primary-iron decarbonization depth. Conventional
      BF-BOF is fully commercial at lowest decarbonization depth.
