            markets and corporate Scope-3 buyers
        - label: SOM — MOE licensing fee + critical metals revenue
          value: 'Brazil critical metals: Nb ~$440M US imports; Ta ~$230M; Sn ~$840M US; MOE licensing fee TBD'
          description: >-
