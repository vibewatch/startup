  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape — direct peers, incumbents, substitutes, and status quo
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's competitive landscape is best understood in three concentric rings, applied separately to
              its steel and critical metals businesses. The innermost steel ring contains direct technology peers
              pursuing novel low-carbon or zero-carbon ironmaking: Stegra (H2 DRI-EAF, Boden, Sweden) and SSAB/HYBRIT
              (H2 DRI-EAF joint venture) are the two most developed examples, both pursuing a hydrogen direct reduction
              route that produces sponge iron or hot briquetted iron for electric arc furnace steelmaking. Electra uses
              aqueous electrowinning at 60°C to reduce ore-derived iron ions — the closest electrochemical analogue to
              Boston Metal's Molten Oxide Electrolysis — but differs fundamentally in temperature regime and feedstock
              dissolution chemistry. Both Electra and Boston Metal produce near-zero-CO2 iron using electricity rather
              than hydrogen, but operate at opposite ends of the temperature spectrum.

              The second ring contains incumbent integrated steelmakers running active decarbonization transitions that
              could serve the same steel buyers through incremental programs: ArcelorMittal (XCarb program, DRI plants
              in Ghent and Texas, and a strategic equity stake in Boston Metal itself), thyssenkrupp (tkH2Steel, 2.5
              Mt/year DRI in Duisburg), and Salzgitter (SALCOS, targeting first green hot metal 2026). These players
              have operating cash flows, customer relationships, and distribution networks that no startup can match.
              However, their decarbonization transitions are multi-decade programs constrained by legacy blast-furnace
              assets, project finance timelines, and hydrogen supply infrastructure.

              The outer ring is occupied by status-quo substitutes: conventional BF-BOF routes (approximately 70% of
              global production, 2.0–2.3 t CO2/t) that remain the price anchor; gas-DRI EAF routes (1.1–1.4 t CO2/t)
              that are already displacing BF-BOF at the margin; and EAF scrap steelmaking with renewable electricity,
              which Nucor has packaged into its commercially available Econiq net-zero product. Nucor's Econiq is
              particularly relevant as a near-term substitute: it allows buyers to claim Scope 3 net-zero steel
              compliance today using RECs and offsets, without requiring physical green iron from any novel technology.

              For critical metals, the competitive landscape differs entirely. CBMM (Companhia Brasileira de Metalurgia
              e Mineração) controls more than 80% of global niobium production and operates conventional
              pyrometallurgical recovery. Conventional tantalum and tin refining from primary ore or recycled
              electronics is carried out by established smelters in China, Germany, and elsewhere. Boston Metal's MOE
              critical metals play is therefore a cost and yield challenge against incumbents rather than a head-to-head
              technology race with another startup.
