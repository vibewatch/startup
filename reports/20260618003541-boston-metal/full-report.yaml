      - number: '7.3'
        title: Regulatory, legal, and compliance risk
        blocks:
          - type: paragraph
            body: >-
              Boston Metal is not facing obvious public enforcement action, but it is operating inside several
              regulatory and legal envelopes that matter for diligence. The Weirton project sits inside federal
              industrial-policy programs, environmental review, and potential future milestone compliance. The Brazil
              project sits inside IFC-backed environmental and social governance frameworks with formal grievance
              pathways. Meanwhile, the Massachusetts WARN filing shows that labor-law exposure is not theoretical; it
              has already become part of the company's public operating record.


              This does not mean Boston Metal is unusually non-compliant. In fact, the available documents show the
              company using mainstream institutional channels: DOE selection processes, IFC documentation, SEC
              exempt-offering filings, and patents. The risk lies in execution complexity. A company that must satisfy
              industrial policy expectations, maintain cross-border E&S practices, preserve patent leverage, and manage
              high-visibility layoffs is carrying more compliance overhead than a typical software startup.


              Investors should therefore treat legal and regulatory diligence as an operating-systems question, not a
              box-checking exercise. The right question is whether management has enough process depth to keep
              compliance from becoming another source of schedule slippage.
            claimRefs:
              - CR015
              - CR016
              - CR017
