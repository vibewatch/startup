  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Funding context and price discovery
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's valuation discussion has to start with the facts the company actually discloses. The
              cleanest current anchor is the May 2026 statement that a recent $75 million investment brought total
              capital raised to over $500 million. That is a meaningful capital base for a private industrial startup,
              but it is not a valuation. Public sources do not disclose the round's post-money mark, ownership dilution,
              liquidation preferences, or whether the terms behaved like growth equity or a rescue financing following
              the Brazil incident.


              That missing structure matters because the same round can imply very different economics depending on
              context. A straightforward primary round sold at modest dilution could support a valuation closer to
              top-quartile climate-industrial marks. A more structured round with downside protection, investor rights,
              or heavier dilution could imply much less equity value for common holders even if the headline raise looks
              large. The 2026 Form D reinforces that Boston Metal remained in active private-capital mode around the
              same period.


              The practical conclusion is simple: valuation opacity is still a core diligence issue. Investors can bound
              scenarios, but they cannot mark Boston Metal precisely from public evidence alone.
            claimRefs:
              - CV001
              - CV002
              - CV003
