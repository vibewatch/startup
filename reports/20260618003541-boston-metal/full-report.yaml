      - number: '2.3'
        title: Critical Metals Market — Niobium, Tantalum, Tin, and Vanadium
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's Brazil subsidiary at Minas Gerais is the first commercial deployment of the MOE platform
              and is focused on niobium, tantalum, and tin ferroalloys with vanadium as a potential additional output.
              These critical metals markets are structurally attractive because of high supply concentration risk, 100%
              US import reliance, and growing strategic designations by the US government and the EU Critical Raw
              Materials Act.

              Niobium is used primarily as ferroniobium in high-strength, low-alloy (HSLA) steels for automotive,
              structural, and pipeline applications, and as superalloy additions for aerospace. World mine production
              was approximately 83,000 tonnes (niobium content) in 2024, down slightly from 2023. Brazil dominates
              global supply with approximately 90% of world production, followed by Canada at approximately 8%. The
              United States has no domestic niobium mine production and is 100% import-reliant, with 66% of US imports
              coming from Brazil. The USGS estimates the value of US niobium imports at $440 million (2024). Reserves
              exceed 17 million tonnes globally, concentrated in Brazilian carbonatite deposits. The ferroniobium price
              averaged approximately $26/kg in 2024, stable compared to $25/kg in 2023.

              Tantalum is critical for electronic capacitors, aerospace superalloys, and high- corrosion-resistance
              applications. Global mine production was approximately 2,100 tonnes (tantalum content) in 2024, with Congo
              (Kinshasa) supplying approximately 880 t, Nigeria 390 t, Rwanda 350 t, and Brazil 210 t among the largest
              contributors. The US is 100% import-reliant with no domestic mine production since 1959. US apparent
              consumption was estimated at 770 tonnes in 2024, a 75% increase from the depressed 2023 levels as consumer
              electronics and data center demand recovered. The USGS values US tantalum imports at over $230 million
              (2024). Average tantalite price was approximately $170/kg of Ta2O5 in 2024.

              Tin is present in the Boston Metal Brazil feedstock, and its extraction is part of the production process.
              Global tin demand exceeds 400,000 tonnes annually per Boston Metal company materials. USGS Mineral
              Commodity Summaries 2025 data show global tin mine production at approximately 300,000+ tonnes, with US
              apparent consumption of approximately 37,000 tonnes refined tin in 2024 and 73% import reliance. The
              average New York dealer price for refined tin in 2024 was approximately 1,400 cents per pound ($30.9/kg),
              and about half of all tin produced worldwide is used in soldering electronics and semiconductors. Tin is
              on the EU Critical Raw Materials list.

              Vanadium is used primarily as a steel alloying agent (>90% of domestic consumption) and increasingly in
              vanadium redox flow batteries (VRFBs) for grid-scale energy storage. World mine production was
              approximately 100,000 tonnes (vanadium content) in 2024, with China supplying approximately 70% and Russia
              and South Africa adding most of the remainder. Brazil produced approximately 5,000 tonnes in 2024. The
              USGS projects the VRFB market to account for approximately 17% of vanadium consumption in 2033 compared to
              only 3% in 2021. The average Chinese vanadium pentoxide price was $5.45/lb in 2024, down from $7.50 in
              2023 due to oversupply from Chinese producers.

              Boston Metal's MOE platform targets recovery of niobium, tantalum, vanadium, and nickel from mining and
              industrial waste streams, which are often uneconomic to process via conventional methods. Nickel US mine
              production was 8,000 tonnes from Eagle Mine, Michigan in 2024, with the LME cash price averaging
              approximately $17,000/tonne. Nickel use in stainless and alloy steels accounts for more than 85% of
              domestic consumption. The MOE approach to critical metals—extracting value from waste streams rather than
              greenfield mining—carries a structural cost and environmental advantage over incumbent methods for
              low-grade or complex feedstocks.
