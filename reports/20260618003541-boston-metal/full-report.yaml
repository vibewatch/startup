  - id: FE001
    title: Boston Metal MOE Steel Process Architecture
    type: stack
    layout: standard
    summary: >-
      Layered view of the MOE Steel cell from electrical power input through molten oxide chemistry to liquid steel and
      oxygen outputs.
    data:
      layers:
        - label: Power Input Layer
          detail: >-
            AC grid electricity converted to DC; ~600,000 amps target per full commercial cell; current size ~25,000 A
            (pilot)
        - label: Inert Anode Layer
          detail: >-
            Iron-chromium alloy anode immersed in melt; conducts current; resists oxidation at 1,600°C; MIT-patented
            composition; multi-anode design for industrial scale
        - label: Molten Oxide Electrolyte Layer (1,600°C)
          detail: >-
            Iron ore dissolved in molten oxide melt; impurities remain in electrolyte; ion transport medium; must be
            tightly controlled for product purity and anode stability
        - label: Electrochemical Reaction Layer
          detail: >-
            Fe²⁺/Fe³⁺ ions reduced at cathode to liquid iron; O²⁻ ions oxidized at anode to O₂ gas; no carbon species
            involved; sole gas byproduct is pure oxygen
        - label: Output Layer
          detail: >-
            Liquid iron pools at cell bottom, tapped directly to ladle metallurgy; pure O₂ gas released at top; steel
            product after alloying; no CO₂, no process water, no hazardous chemicals
    approximationNotes: >-
      Exact engineering parameters (anode alloy composition, electrolyte formula, cell geometry, current density) are
      proprietary. Architecture reconstructed from public MIT, company, and media sources.
    claimRefs:
      - CE001
      - CE002
      - CE009
      - CE011
