  - id: FP003
    title: Moat and readiness KPIs — Boston Metal vs. leading competitors
    type: kpi
    layout: standard
    summary: >-
      Key performance indicators comparing Boston Metal's competitive position to its strongest rivals on the dimensions
      most relevant to moat durability, commercial traction, and near-term execution risk as of June 2026. Stegra's
      pre-sold backlog and construction progress are the most adverse competitive indicators; Boston Metal's no-hydrogen
      pathway and feedstock flexibility are the most structurally durable advantages.
    data:
      items:
        - label: Stegra committed offtake vs. Boston Metal customer LOIs
          value: 1.5M+ t pre-sold vs. no disclosed MOE Steel LOIs
          note: >-
            Stegra has 1.5 million tonnes per year pre-sold to named OEMs and brands before first production. Boston
            Metal has not disclosed any MOE Steel LOI or offtake agreement. This gap represents the most material
            competitive timing disadvantage.
        - label: Boston Metal total funding vs. Electra
          value: '>$500 M vs. ~$264 M'
          note: >-
            Boston Metal's $500 M+ is approximately 2× Electra's total raised. However, Boston Metal's capital now flows
            primarily to critical metals scale-up rather than MOE Steel demo.
        - label: Stegra funding depth vs. Boston Metal
          value: €7.9 B (Stegra) vs. >$500 M (Boston Metal)
          note: >-
            Stegra's total secured financing is approximately 15–16× Boston Metal's total raised, reflecting the
            difference between a fully-funded giga-scale green steel plant and an innovation-stage technology licensing
            company. Stegra cannot be matched on project capital by any startup.
        - label: HYBRIT H2 storage technical validation
          value: Proven at pilot scale (Feb 2025)
          note: >-
            HYBRIT proved large-scale fossil-free hydrogen storage in lined rock caverns, removing the most cited
            technical risk for the H-DRI route and strengthening the competitive case for H-DRI relative to Boston
            Metal's MOE pathway.
        - label: Boston Metal Brazil plant restart timeline
          value: Sept 2026 (post-refractory leak)
          note: >-
            The refractory leak in January 2026 delayed the Brazil plant, caused a financing milestone miss, and led to
            71 layoffs. A September 2026 restart is management-guided. This execution setback is the most material
            near-term adverse data point in the competitive record.
        - label: Nucor Econiq net-zero steel — availability
          value: Commercially available now (Scope 1+2 certified)
          note: >-
            Nucor's Econiq is available through all existing Nucor sales channels today. Buyers seeking Scope 3
            compliance can source Econiq immediately without waiting for MOE or H-DRI commercialization, reducing
            time-pressure on Boston Metal's timeline.
        - label: ArcelorMittal investor role — options vs. commitments
          value: Strategic equity investor; no disclosed MOE Steel license term
          note: >-
            ArcelorMittal's strategic equity stake validates the technology but does not publicly commit to licensing
            MOE. ArcelorMittal also runs its own H-DRI program. Dual-path optionality may delay licensing decision.
        - label: MOE Steel demo plant status vs. Stegra DRI tower
          value: 'Boston Metal: planning phase; Stegra: 100m DRI tower built (Mar 2026)'
          note: >-
            Boston Metal's next steel milestone is a demonstration plant targeting 2027 operation (per MIT TR March
            2025). Stegra's DRI tower has passed the 100-meter mark as of March 2026 and the full electrolyzer was
            installed by April 2026. Physical construction gap is the clearest competitive timing indicator.
    approximationNotes: >-
      Stegra pre-sold figure from Stegra company website (May 2022 milestone + subsequent additions). Boston Metal >$500
      M from MIT Technology Review May 2026 article. Electra ~$264 M from Electra website. Stegra €7.9 B aggregated from
      public announcements (€6.5 B secured Jan 2024 + €1.4 B agreed Apr 2026). All timeline data from publicly available
      sources through June 2026.
