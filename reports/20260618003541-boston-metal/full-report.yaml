  - id: FE004
    title: 'MOE vs Competing Routes: Capability Maturity Matrix'
    type: matrix
    layout: wide
    summary: >-
      Comparative assessment of MOE Steel, H2-DRI, and conventional BF-BOF on key technical and commercial dimensions as
      of mid-2026.
    data:
      columns:
        - MOE Steel (Boston Metal)
        - H2-DRI (e.g., SSAB HYBRIT)
        - Conventional BF-BOF
      rows:
        - label: Ore grade requirement
          values:
            - Medium/low-grade (any Fe%); impurities stay in melt
            - High-grade (≥65% Fe pellets required)
            - Medium-grade (62%+ Fe with sinter)
        - label: Operating temperature
          values:
            - Very high (~1,600°C); similar to BF; single-step ironmaking
            - High (~900°C shaft; EAF ~1,600°C)
            - Very high (~1,600°C BF + ~1,700°C BOF)
        - label: H2 / carbon infrastructure needed
          values:
            - None; electricity only; no H2 production, storage, or transport
            - Large-scale green H2 production and storage required
            - Coke ovens, coking coal supply, coal logistics
        - label: Emissions profile (with green electricity)
          values:
            - Near-zero Scope 1+2 CO₂; pure O₂ byproduct
            - Near-zero Scope 1+2 CO₂ (with green H2); H₂O byproduct
            - ~2 tCO₂/tSteel Scope 1; highest-emitting route
        - label: Commercial maturity (mid-2026)
          values:
            - Multi-anode industrial cell proven; demo plant not yet built
            - Commercial-scale plants in operation (HYBRIT, Stegra planning)
            - Fully commercial; ~71% of global crude steel
        - label: Process steps replaced
          values:
            - Coke prod., sinter, pelletize, BF, BOF all eliminated
            - BF+BOF replaced; pelletizing still required; EAF still needed
            - N/A (reference case)
        - label: Modular scalability
          values:
            - High; add cells in parallel; no minimum plant size
            - Low; plant economics favor 1M+ tpa scale
            - Low; fixed blast furnace scale
    approximationNotes: >-
      H2-DRI comparisons use HYBRIT/SSAB as reference. MOE Steel maturity assessment reflects March 2025 commissioning
      and is company-stated; no independent TRL assessment published.
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE008
      - CE030
  - id: FU001
    title: Customer journey map — how Boston Metal converts strategic interest into commercial pathways
    type: journey-map
    layout: wide
