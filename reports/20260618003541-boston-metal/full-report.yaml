              Boston Metal has not yet demonstrated: (1) a multi-cell demonstration plant, (2) long-term inert anode
              service life under continuous production conditions, or (3) a signed steelmaker licensing agreement. Until
              all three are achieved, MOE Steel commercial revenue relies on evidence from a single-cell environment and
              company-stated projections. The demonstration plant is the critical near-term milestone.
