      - number: '2.4'
        title: Buyer Segmentation, TAM/SAM/SOM, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's market architecture differs fundamentally from that of a direct steel producer. For the
              steel business, the buyers of Boston Metal's offering are steelmakers (who would license the MOE
              technology and purchase inert anodes), not the ultimate purchasers of green steel. For the critical metals
              business, the buyers are metals refiners, mining companies, and downstream industrial consumers of
              niobium, tantalum, tin, and vanadium ferroalloys.

              For the steel licensing market, the TAM is the total installed steelmaking capacity representing primary
              iron production globally—approximately 1.4 billion tonnes of annual BF-BOF primary production at risk of
              regulatory displacement. The serviceable addressable market (SAM) narrows to steelmakers in CBAM-exposed
              jurisdictions and regions with binding decarbonization mandates, particularly the EU, UK, and the US IRA
              zone. Within this, the serviceable obtainable market (SOM) for Boston Metal's near-term licensing pipeline
              is constrained by technology readiness: the Woburn pilot successfully commissioned a multi-inert-anode
              industrial cell in 2025 producing tonnage steel, but a demonstration-scale plant is still needed before
              commercial licensing can begin at scale. The primary revenue streams in the steel business are technology
              licensing fees and ongoing inert anode manufacturing and supply (per Boston Metal's stated model), not
              steel margin per tonne.

              Buyer segments across both businesses: (1) Integrated steelmakers as licensees: Outokumpu (stainless) and
              other steel producers evaluating chromium-bearing side streams are early-stage validation partners. BMW
              Group's involvement as an investor signals automotive OEM pull for green steel supply-chain credentials.
              These buyers are motivated by regulatory compliance (CBAM, ETS), Scope-3 targets (SBTi), and competitive
              differentiation. (2) Mining and metals companies as critical metals buyers: CBMM (Brazil, niobium) and
              similar producers could potentially partner with Boston Metal to recover additional value from processing
              waste. The US government's interest in domestic critical mineral supply chains (100% import reliance on
              niobium and tantalum) creates a government procurement and incentives channel. (3) Electronics and defense
              buyers: Downstream consumers of niobium superalloys and tantalum capacitors in aerospace, defense, and
              consumer electronics who need supply chain diversification and US domestic processing capacity.

              Key adoption constraints include: (1) Technology risk—commercial MOE Steel still requires a demonstration
              plant before broad licensing, creating a multi-year credibility gap; (2) Capital intensity—each MOE cell
              deployment is modular but the aggregate capital for a commercial-scale plant is material, and licensees
              face balance-sheet risk; (3) Electricity cost and availability—the IEA notes 250 TWh of additional
              low-carbon electricity is needed by 2030 for near-zero steel at NZE scale, and MOE is a direct electricity
              consumer, making electricity price a key variable cost driver; (4) Green premium durability—the
              €50-200/tonne green steel premium depends on sustained carbon pricing and buyer willingness, both of which
              face political and economic uncertainty; (5) Licensing model execution—steelmakers must be willing to
              license rather than build proprietary alternatives, and the license negotiation timeline adds
              commercialization risk; (6) Critical metals market cyclicality—vanadium prices declined 27% in 2024 from
              2023, and tantalum market volumes declined sharply before recovering in 2024.

              An adverse market risk worth underscoring: the IEA and RMI analyses project that near- zero emission steel
              must account for more than 8% of primary production by 2030 to meet NZE pathways, but the actual pace of
              licensing and deployment depends on whether steelmakers will adopt before cost parity with conventional
              production is fully demonstrated. The RMI estimates demand for low-emissions steel of only 6.7 Mt/year by
              2030 under current committed programs—far below the structural need—suggesting that near-term addressable
              demand for MOE licensing could be modest relative to the long-term structural opportunity.
