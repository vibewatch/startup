      - number: '8.5'
        title: Thesis-breakers and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The next 12 to 18 months should determine whether Boston Metal deserves to tighten or widen its valuation
              discount. The most important live variable is still Brazil. A stable restart, visible output, and credible
              customer conversion would remove the most obvious near-term overhang. The second variable is funding
              discipline: investors need to know whether new capital is being raised from strength or simply to keep a
              delayed bridge alive. The third is whether the steel path becomes concrete through a larger demo plan and
              a harder customer signal.


              Because the current public file is incomplete, the diligence agenda is unusually practical. Underwriters
              should ask for cap table and preference detail, line-by-line capex and opex by business, current pipeline
              status by counterparty, Weirton anchor-buyer evidence, and post-incident remediation materials. Without
              those items, a scenario model can only be approximate.


              That leaves Boston Metal in a familiar but important category: a company with genuine category-defining
              upside whose valuation is still being carried more by future possibility than by present commercial proof.
              That is a reason to keep watching closely, not a reason to suspend discipline.
