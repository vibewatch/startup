          detail: Licensed technology; steel producer deploys cells; 600 kA per cell at commercial scale; 100+ cells per plant
        - id: liquid_iron
          label: Liquid Iron
          detail: High-purity molten metal tapped from cell bottom; goes directly to ladle metallurgy; no EAF needed
        - id: ladle_metallurgy
          label: Ladle Metallurgy / Alloying
