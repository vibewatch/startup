  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology and operational risk
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's technology risk is no longer about whether MOE can produce metal at all; it is about
              whether the system can operate continuously, economically, and safely at commercial scale. The 2025 steel
              milestone established that the company can tap tonnage from a multi-anode cell, but the business still
              lacks a larger demonstration plant and a public record of multi-cell reliability. That leaves the usual
              hard-tech scale-up issues unresolved: campaign duration, refractory wear, thermal stability, current
              distribution, maintenance cadence, and plant integration under real operating loads.


              The Brazil incident makes that abstract list concrete. The company's most advanced commercial bridge was
              halted by a critical equipment failure linked to the refractory system, and the consequences propagated
              quickly into financing and staffing. The lesson for diligence is that first-of-a-kind
              electro-metallurgical systems can fail in highly non-linear ways: a containment or materials issue can
              disable output, miss milestones, and destroy confidence in a matter of weeks.


              Patent coverage helps explain where Boston Metal has focused its engineering effort, but it does not
              eliminate execution risk. The public patent record and company materials show a sophisticated stack around
              vessels, refractory interfaces, and MOE methods. They also indirectly reinforce how many failure surfaces
              remain before the system is routine industrial equipment. For a climate-industrial startup, that is the
              central risk: scientific validity exists, but industrial repeatability is not yet proven.
            claimRefs:
              - CR001
              - CR002
              - CR005
