      - number: '8.4'
        title: Comparables, recommendation, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              Boston Metal does not fit neatly into any one peer bucket. Electra is a closer process-technology analogue
              because it also argues for electrochemical ironmaking. Stegra and HYBRIT are more useful as commercial
              comparables because they show what green-primary-steel scale-up looks like when project finance,
              customers, and physical construction start to harden. Mature steel companies are poor direct comps because
              Boston Metal has neither their revenue base nor their asset profile.


              That mixed comparable set is one reason a venture-style option framework is more useful than a clean
              revenue multiple. Boston Metal is simultaneously a platform bet, a first-commercial-asset bet, and a
              policy/strategic-materials bet. Strategic investor support and the quality of the cap table justify
              ongoing attention, but they do not overcome the fact that customer proof and unit economics remain thin in
              public sources.


              The resulting stance is cautious. The company still has upside large enough to merit serious tracking, but
              the evidence does not yet justify a buy-style posture based only on public materials. A fair description
              of today's mark is 'stretched but still option-rich': not obviously irrational, yet too opaque and too
              execution-dependent for high-conviction entry.
            claimRefs:
