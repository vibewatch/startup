      - number: '8.2'
        title: Market upside and duration risk
        blocks:
          - type: paragraph
            body: >-
              The long-term opportunity is undeniably large. CNBC described steel as a roughly $1.6 trillion industry,
              and worldsteel data underscores just how central the material is to the global economy. Boston Metal's
              core proposition is not a niche materials upgrade; it is a possible replacement route for one of the most
              carbon-intensive industrial processes on earth. If the company can commercialize a licensing-led,
              electricity-based pathway that avoids both coking coal and hydrogen infrastructure, the upside is
              enormous.


              The problem is duration. Columbia's work on low-carbon iron and steel highlights the capital intensity and
              electricity sensitivity embedded in every decarbonization pathway. Boston Metal may have a more elegant
              end-state architecture than some alternatives, but elegant end states do not eliminate the need for years
              of engineering proof and customer adoption. That is why the market story supports premium optionality but
              not automatic premium pricing.


              In valuation terms, Boston Metal combines a giant TAM with long-dated realization risk. The bigger the
              dream, the more severely timing errors and capital missteps should be discounted.
            claimRefs:
              - CV012
              - CV013
              - CV017
