          label: Steelmaker / stainless producer
          detail: Prospective MOE Steel licensee or joint-development counterparty such as ArcelorMittal or Outokumpu.
        - id: oem
          label: Downstream OEM / brand
          detail: Demand signal for lower-carbon steel, exemplified by BMW.
        - id: weirton
          label: Weirton chromium project
          detail: DOE-backed path into strategic materials and domestic alloy supply chains.
