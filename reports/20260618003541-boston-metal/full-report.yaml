            body: >-
              The January 2026 Brazil accident exposed a structural capital vulnerability: Boston Metal had
              milestone-linked funding committed (likely from a strategic partner or project financier) that it lost
              when the plant missed its startup target. The company's CEO disclosed that the accident "caused a big
              stress in our cash flow" and that "investors came very strong to support us," indicating the $75M May 2026
              raise was reactive rather than planned. This sequence—accident in January, 71 layoffs in April, emergency
              raise in May—suggests the company had less than four months of operating runway headroom when the
              milestone was missed. Monthly burn rate is not publicly disclosed. With 250-plus employees (post-layoff)
              split between Woburn R&D, Brazil operations, and project development at Weirton, a rough estimate using
              $120,000–$150,000 average fully-loaded employee cost yields $30–$38M in annual salary expense alone;
              adding facility leases, electrode and materials spend, and project-development costs at Weirton plausibly
              pushes total annual cash consumption to $50–$80M. At that range, the $75M infusion buys roughly one to
              one-and-a-half years of operational runway from May 2026. The Weirton DOE grant is project-ring-fenced and
              does not directly reduce Woburn or Brazil burn. The $51M convertible note from 2025, whose conversion
              terms and maturity date are undisclosed, represents a contingent equity dilution that complicates any
              future valuation round unless already converted or extinguished. No post-money valuation for the 2026
              round is publicly disclosed; Boston Metal is not listed on any exchange. The company's capital-formation
              record is strong, but the accident and resulting rapid cash burn test whether the current investor
              syndicate will continue to support the company through the Brazil restart and the longer greenfield
              steel-demonstration timeline.
