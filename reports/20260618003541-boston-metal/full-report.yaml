  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and business mix
        blocks:
          - type: paragraph
            body: >-
              Boston Metal operates two structurally distinct revenue models under a single Molten Oxide Electrolysis
              (MOE) platform. The near-term model is direct product sales from the Brazil subsidiary (Boston Metal do
              Brasil): the Coronel Xavier Chaves plant processes low-grade mining slag and extracts niobium, tantalum,
              and tin as ferroalloys sold to metals buyers. The plant was constructed over 18 months and targeted a
              2024–2025 commercial start, but suffered a January 2026 refractory-system leak that caused an electrolyte
              spill, no injuries, but a major schedule reset and a missed milestone-linked financing commitment. CEO
              Tadeu Carneiro publicly stated the facility would restart in September 2026. This segment is the only
              near-term revenue pathway and is critical for proving the MOE technology at commercial scale. The
              long-term revenue model for steel is explicitly a technology-licensing and inert-anode manufacturing
              business: the Boston Metal MOE Steel page states unambiguously that "Boston Metal will not produce steel."
              Instead, steelmakers would pay licensing fees and purchase Boston Metal's proprietary metallic inert
              anodes, the critical consumable in MOE Steel cells. A third nascent revenue opportunity is the Weirton,
              West Virginia chromium plant, where Boston Metal received a $50M DOE grant to deploy MOE for domestic
              chromium metal production; total project investment is approximately $161M. Revenue quality differs by
              segment: critical-metals sales are commodity ferroalloys with market-price exposure, while steel licensing
              is a capital-light, high-margin model contingent on steelmaker adoption. No list pricing, contract values,
              take-or-pay commitments, or realized revenue figures are publicly disclosed for any segment.
