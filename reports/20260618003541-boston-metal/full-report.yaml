      - number: '6.5'
        title: Pipeline readout and remaining diligence asks
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's customer pipeline is credible enough to matter but not mature enough to underwrite
              aggressively. The steel side has blue-chip names in orbit, including ArcelorMittal and BMW, yet the public
              record stops short of disclosing who would be first to license or deploy MOE at plant scale. The
              critical-metals side is closer to revenue and better anchored in explicit use cases, but it is also more
              operationally concentrated because the first true commercial asset is still working through restart and
              scale-up risk.


              For diligence, the most important missing items are straightforward: a list of named active counterparties
              by business line, a status table of each relationship (screening, pilot, MOU, commercial trial, contract),
              evidence of post-trial repeat engagement, and customer-specific unit-economic logic for the Brazil
              outputs. Investors should also ask whether DOE-backed Weirton output has identified anchor buyers and
              whether the same chromium path feeds Boston Metal's own MOE supply chain or a separate merchant market.


              Until those answers are available, the customer chapter supports a middle position: Boston Metal has
              unusually high-quality strategic validation for a pre-revenue climate-industrial company, but it has not
              yet converted that validation into the kind of diversified, measurable commercial traction that would
              remove concentration risk.
            claimRefs:
              - CU032
