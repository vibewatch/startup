companyProfile:
  summary: >-
    Boston Metal is a Woburn, Massachusetts industrial decarbonization company commercializing Molten Oxide Electrolysis
    (MOE), an electrified metallurgy platform that can produce steel without coal and recover critical metals from
    low-grade or waste feedstocks. The company’s steel thesis is long-dated and license-led, while its Brazil subsidiary
    provides a nearer-term commercialization wedge through high-value metals such as niobium, tantalum, and tin. Boston
    Metal has assembled one of the deepest strategic investor syndicates in the category across mining, steel,
    climate-tech, and institutional capital, but it remains private, valuation-opaque, and still pre-commercial at
    meaningful steel scale after a 2026 Brazil operating setback.
  foundedDate: '2013-01-01'
  founders:
    - name: Donald Sadoway
      role: Founding technical figure
