    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Boston Metal is best understood as an industrial decarbonization platform company rather than a
              single-product startup. Its official materials consistently describe an electrified Molten Oxide
              Electrolysis platform that can be applied across steel and critical metals, with Woburn, Massachusetts as
              the corporate and pilot-scale steel hub and Minas Gerais, Brazil as the first commercial deployment site
              for the critical-metals line. This two-asset footprint matters because it explains why the company has
              both a long-dated green-steel thesis and a nearer-term revenue bridge in higher-value metals. The identity
              narrative is also unusually explicit about system-level ambition: Boston Metal is not pitching a green
              premium niche product so much as a modular replacement for multiple carbon-intensive steps in conventional
              metallurgy. That ambition is why the company emphasizes feedstock flexibility, domestic supply-chain
              resilience, and the ability to process materials that incumbents treat as waste. The clearest unresolved
              point inside the identity story is chronology. IFC says the company was created in 2012 with MIT-licensed
              IP, while Boston Metal’s own FAQ says it was founded in 2013; the most reasonable reading is that 2012
              reflects technology/company formation and 2013 reflects formal operating launch.
