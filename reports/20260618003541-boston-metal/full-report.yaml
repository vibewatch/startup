      - number: '6.2'
        title: Strategic investors as customer proof
        blocks:
          - type: paragraph
            body: >-
              Boston Metal's strongest customer evidence today comes from the overlap between its cap table and its
              likely future buyers. ArcelorMittal is the clearest example: it led the first close of the 2023 Series C,
              invested $36 million through the XCarb Innovation Fund, and publicly framed Boston Metal as a meaningful
              steel decarbonization technology. BMW plays a different role. It is not a producer, but TechCrunch's
              reporting and Boston Metal's own announcement show BMW joined the Series B because steel is a major
              emissions source in its supply chain. BMW therefore serves as demand-side validation that low-carbon
              primary iron has downstream buyer relevance if Boston Metal can scale it.


              BHP, Vale, Microsoft, Breakthrough Energy Ventures, and IFC add other strategic layers. Vale and BHP tie
              Boston Metal into upstream mining and ore or slag optionality. Microsoft and Breakthrough supply
              climate-tech signaling and funding credibility. IFC contributes development-finance validation with
              explicit Brazil commercialization objectives. Together these counterparties reduce the perception that
              Boston Metal is an isolated science project.


              The limitation is equally important: none of these relationships publicly discloses a commercial license
              schedule, annual purchase commitment, or contracted unit economics for MOE Steel. Strategic capital is a
              strong lead indicator, but it is not the same as a binding customer rollout.
