      - number: '3.3'
        title: Incumbent retrofitters, EAF alternatives, and offset-based substitutes
        blocks:
          - type: paragraph
            body: >-
              ArcelorMittal occupies an unusually complex position in Boston Metal's competitive landscape: it is
              simultaneously a strategic investor (participating in the 2023 Series C funding round) and one of the
              world's largest incumbent steel producers with an in-house low-carbon ironmaking program. ArcelorMittal's
              XCarb decarbonization initiative spans multiple technology pathways — a Midrex H-DRI plant in Ghent
              (Belgium) transitioning toward hydrogen feed, DRI capacity in Texas, and an XCarb green steel certificate
              product sold commercially. ArcelorMittal's demonstration run at its Hamburg DRI plant achieved 100%
              hydrogen feed at pilot scale, establishing a proof point for the H-DRI route at an existing integrated
              steelmaker. For Boston Metal, ArcelorMittal's strategic stake creates both an option and a risk: option
              because ArcelorMittal could become a first-mover MOE licensing customer; risk because if ArcelorMittal's
              own DRI-H2 program reaches commercial scale and cost competitiveness first, it reduces its dependence on
              Boston Metal's technology license.

              thyssenkrupp's tkH2Steel program targets 2.5 million tonnes per year of DRI capacity in Duisburg, Germany,
              backed by a €2 billion EU Innovation Fund grant. However, thyssenkrupp faces concurrent financial
              restructuring that creates capital-allocation uncertainty — a scenario where the parent company's balance
              sheet pressures could delay the program even with public subsidy secured. Salzgitter SALCOS, targeting
              first green hot metal in 2026 in Germany, represents the most advanced DRI-H2 program inside a mid-tier
              incumbent and shows that European steelmakers are not waiting for novel electrolytic routes to initiate
              their decarbonization transitions.

              Nucor represents the most commercially powerful substitute threat at the buyer level. As the largest U.S.
              steel producer by volume (25%+ of domestic market) and an entirely EAF-based manufacturer, Nucor already
              operates with approximately one-third the GHG intensity of the global BF-BOF average. Its Econiq product —
              the world's first commercially available net-zero steel at scale, certified for Scopes 1 and 2 with an
              optional Scope 3 offering — allows any U.S. steel buyer to claim net-zero embodied carbon without
              requiring physical green iron from any novel process. Econiq achieves this certification through 100%
              renewable or carbon-free electricity (Scope 2) and high-quality carbon offsets (Scope 1 and 3).
              Critically, Econiq is available immediately through all existing Nucor sales channels, at no new
              distribution infrastructure cost. For buyers motivated primarily by Scope 3 reporting compliance rather
              than physical decarbonization of primary ironmaking, Econiq is a substitute that Boston Metal's MOE Steel
              must actively differentiate against. The distinction Boston Metal must make is that Econiq's offset-based
              net-zero claim depends on market-purchased offsets and RECs, while MOE physically eliminates CO2 from the
              ironmaking step — an increasingly important distinction as corporate procurement standards tighten around
              offset integrity and additionality.
