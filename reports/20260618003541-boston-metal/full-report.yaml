        - MOE processes low, medium, and high iron-grade ores; H-DRI requires ≥67% Fe pellets
        - High-grade ore scarcity is a long-term H-DRI constraint; Electra shares this advantage
        - Low (structural advantage; H-DRI chemistry cannot be adapted without fundamental change)
        - Has MOE been validated across multiple ore grades commercially, or only on selected pilot feedstocks?
      - - Modular licensing model (lower steelmaker capex barrier)
        - License + anode supply model; steelmaker does not need to raise multi-billion project finance
        - Stegra/HYBRIT require steelmakers to build DRI facilities or buy steel from dedicated plant
