    title: Investment KPIs — scorecard for Boston Metal as of June 2026
    type: kpi
    layout: standard
    summary: >-
      Summarizes the dimensions an investment committee would likely score before underwriting a late-stage private
      climate-industrial round.
    data:
      items:
        - label: Market size
          value: 9/10
          note: Steel and strategic materials markets are large enough to support venture-scale upside.
        - label: Technology proof
          value: 7/10
          note: Pilot steel milestone and real patents exist, but commercial durability is still unproven.
        - label: Commercial proof
          value: 4/10
          note: Strategic relationships are strong; revenue and contract evidence are weak.
        - label: Financing resilience
          value: 5/10
          note: Cap table is strong, but 2026 incident exposed fragility in milestone-linked capital.
        - label: Valuation transparency
          value: 3/10
          note: Current post-money and structure are not publicly disclosed.
