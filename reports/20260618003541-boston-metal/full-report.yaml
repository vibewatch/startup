  - id: FR002
    title: Risk transmission map — how operational shocks propagate into financing and valuation
    type: dag
    layout: wide
    summary: >-
      Shows the chain from technical failure to lost milestone, layoffs, delayed customer proof, and weaker financing
      terms.
    data:
      nodes:
        - id: tech
          label: Technical failure
          detail: Refractory, anode, power, or quality issue in a first-of-a-kind MOE system.
        - id: ops
          label: Plant shutdown / output shortfall
          detail: Industrial operations halt or fail to hit milestone throughput.
        - id: finance
          label: Milestone-linked financing disruption
          detail: Committed capital is delayed or withheld when milestones slip.
        - id: people
          label: Layoffs / team contraction
          detail: Cash-preservation actions reduce execution capacity.
        - id: customers
          label: Customer-proof delay
          detail: Less operating evidence for steelmakers, miners, and offtake counterparties.
        - id: valuation
          label: Lower valuation support
          detail: More dilution, weaker negotiating leverage, and a harsher downside case.
      edges:
