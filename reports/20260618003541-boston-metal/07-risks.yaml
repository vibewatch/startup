- id: financing-and-model-risk
  title: Financing and business-model risk
  body: 'Boston Metal remains heavily exposed to financing risk because its steel business is pre-revenue and its critical-metals bridge only works if Brazil restarts and ramps on time. The public record shows a company that has raised very large sums for a private hard-tech venture, yet still suffered an abrupt funding shock when a single operational milestone slipped. That combination is precisely what makes first-of-a-kind industrial companies dangerous to underwrite: high historical fundraising can create confidence, but it does not prevent sudden liquidity stress when capital is tranched around engineering milestones.


    The 2026 Form D, the $75 million raise, and the earlier convertible note all point the same way. Boston Metal is still in a phase where capital strategy and operating strategy are inseparable. Management has to keep extending runway while solving deep technical and plant-execution problems. Each delay reduces negotiating leverage and raises the probability that the next round behaves more like rescue capital than growth capital.


    The model risk runs deeper than cash alone. Boston Metal''s steel vision still depends on a future licensing curve, but that curve has not been publicly validated by named contracts or repeat deployments. If the critical-metals bridge underperforms, the company could be forced to fund a longer steel path with more expensive capital.'
  claimRefs:
