- id: mitigations-and-thesis-breakers
  title: Mitigations, monitoring signals, and thesis-break triggers
  body: 'Boston Metal does have meaningful mitigants. The company has raised substantial capital, built a high-quality strategic syndicate, demonstrated real steel output at pilot scale, and secured public-sector support for a U.S. chromium plant. Those are not cosmetic positives. They show the company can attract serious counterparties and solve difficult technical problems. They just do not close the remaining gaps on durability, concentration, and timing.


    For monitoring, the first question is Brazil. A credible restart with stable output and visible customer deliveries would relieve the most immediate operational and financing risk. The second question is whether MOE Steel advances from milestone storytelling to project reality: named demo-plant specifics, counterparties, and commercial milestones. The third is governance resilience after the layoffs and whether the company can keep technical momentum with a reduced team.


    The practical thesis-break conditions are therefore sharp. If Brazil slips again, if new capital comes only on punitive terms, or if the steel demo path remains vague while competitors keep moving, the downside case strengthens quickly. Boston Metal remains investable only if execution starts catching up to scientific ambition.'
