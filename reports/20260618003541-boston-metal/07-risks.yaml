- id: partner-and-people-risk
  title: Partner concentration, people, and governance risk
  body: 'Boston Metal''s partner map is impressive on paper but risky in structure. Several of the same names function simultaneously as investors, validators, potential customers, and supply-chain counterparties. ArcelorMittal may eventually be a steel-license customer; Outokumpu may become both a chromium-material partner and an operating test bed; Vale and BHP link the company into mining pathways. Those relationships are valuable, but they also make it harder to separate genuine pull-through demand from strategic optionality. A large industrial can support Boston Metal financially while still delaying a binding commercial decision if an alternative pathway looks better internally.


    People risk follows the same pattern. Tadeu Carneiro is clearly a strong asset: his metallurgy and mining background fits the company''s industrial mission, and he is central to capital raising, policy engagement, and external credibility. But centrality itself is risk. The reviewed public record does not disclose a deep succession plan, a full board architecture, or broad delegated operating authority. That matters more after layoffs, because workforce reductions compress bench depth at exactly the moment the company needs resilient execution.


    The result is a business whose strongest relationships are also potential single points of failure. Counterparty optionality, not hostility, is the core concern.'
