- id: retention-and-concentration
  title: Retention visibility and concentration risk
  body: 'The biggest weakness in the customer story is not absence of relationships; it is absence of operating customer metrics. None of the sources reviewed for this chapter discloses account count, active deployments, utilization, retention, renewal timing, or revenue concentration by customer. That means an investor cannot yet distinguish between a broad funnel of interested counterparties and a narrow set of fragile, milestone-dependent relationships.


    Concentration risk is elevated because Boston Metal''s near-term monetization depends heavily on the success of the Brazil plant and a small cluster of strategic partners tied to mining, specialty metals, and steel decarbonization. If Brazil is delayed, the company does not have a publicly visible second operating commercial site to absorb the shock. If one or two strategic investors decide to prioritize alternative technologies internally, the pipeline signal weakens quickly because so much current proof comes from those same names.


    The chapter therefore views customer durability as unproven. Public evidence supports strong strategic interest and useful pilot-style partner validation, but it does not yet support a retention or expansion thesis that would normally justify a premium commercial readiness multiple.'
