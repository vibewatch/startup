- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Strategic value
  - Key gap
  rows:
  - - Integrated steelmakers
    - Steelmaker is buyer and deployer; Boston Metal likely licensor/supplier
    - Primary iron decarbonization without coal or hydrogen
    - Largest eventual TAM and strongest decarbonization narrative
    - No public binding MOE Steel customer contract disclosed
  - - Mining companies / slag owners
    - Mining operator or metals processor
    - Recover niobium, tantalum, tin, vanadium, nickel from waste or low-grade streams
    - Nearest-term revenue wedge and clearer ROI logic
    - Output quality, volumes, and economics not publicly disclosed
  - - Specialty chromium / alloy buyers
    - Aerospace, defense, advanced manufacturing counterparties
    - Ultrapure chromium and alloy supply from Weirton
    - Expands beyond steel into strategic materials
    - Anchor customers not publicly named
  - - Downstream OEMs / brands
    - Automotive or climate-focused industrial buyers
    - Supply-chain decarbonization signal for low-carbon steel
    - Supports eventual green-premium demand
    - Not direct near-term revenue for Boston Metal
  - - Development finance / government
    - IFC and DOE-style institutions
    - Commercialization support and industrial policy
    - Low-cost validation and catalytic capital
    - Validation does not equal repeat commercial demand
  notes: Segments combine direct commercial buyers with catalytic counterparties because Boston Metal is still pre-revenue and public traction is relationship-led rather than invoice-led.
