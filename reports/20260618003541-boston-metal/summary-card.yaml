summary:
  headline: >-
    Boston Metal pairs differentiated electro-metallurgy IP and a blue-chip investor base with real partner validation,
    but unproven steel-scale economics, Brazil restart risk, and valuation opacity justify a track stance rather than an
    immediate underwriting call.
