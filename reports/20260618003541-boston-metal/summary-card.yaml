  topStrengths:
    - >-
      Differentiated MOE pathway: Boston Metal can target near-zero-emission steel without hydrogen infrastructure while
      also monetizing the same electrolysis platform in higher-value critical metals.
    - >-
      Strategic investor depth: the cap table spans mining, steel, automotive, climate-tech, and development-finance
      capital, providing both financing resilience and channel credibility.
    - >-
      Dual-track commercialization: the Brazil critical-metals business offers a nearer-term revenue bridge and
      operating learning loop that pure green-steel peers often lack.
    - >-
      Policy and buyer tailwinds: CBAM, Scope-3 procurement pressure, and U.S. strategic-materials funding create
      multiple demand vectors if MOE reaches dependable commercial performance.
  topRisks:
    - >-
      Execution risk is immediate: the Brazil refractory failure, missed milestone funding, and April 2026 layoffs show
      that commercialization is not yet operationally robust.
    - >-
      Valuation and financial opacity remain high because public materials do not disclose current post-money valuation,
      margins, burn rate, or verified revenue.
    - >-
      Steel-scale proof is still pending: Boston Metal has demonstrated pilot progress, but commercial steel economics
      and uptime at industrial scale remain unproven.
    - >-
      Power, partner, and policy dependencies matter: MOE requires low-cost clean electricity, partner qualification,
      and regulatory/certification alignment to capture the expected green premium.
  unresolvedGaps:
    - >-
      Verified 2025/2026 revenue, gross margin, burn rate, and cash runway remain undisclosed in accessible public
      sources.
    - The current post-money valuation, cap table, and dilution terms of the 2026 financing are not public.
    - >-
      Brazil restart performance after the 2026 refractory incident and the pace of customer qualification are still
      unverified.
    - >-
      The exact path from pilot steel output to commercial MOE steel deployments, including first licensee timing, is
      not yet public.
    - Board composition, investor governance rights, and succession planning are not fully disclosed.
