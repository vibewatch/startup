callouts:
  - calloutType: strength
    title: Dual-Market Architecture Reduces Near-Term Revenue Risk
    body: >-
      Boston Metal's critical metals operation in Brazil provides near-term revenue (targeted
      from 2026) while the MOE Steel licensing thesis matures. The Brazil plant addresses
      niobium, tantalum, and tin markets where US is 100% import-reliant and the EU has
      designated all three as Critical Raw Materials, providing a strategic demand floor
      independent of green steel adoption timelines.
    claimRefs:
      - CM026
      - CM029
      - CM034
      - CM046

  - calloutType: risk
    title: MOE Steel Licensing Thesis Depends on Demonstration-Scale Proof
    body: >-
      The green steel licensing TAM is structurally large but commercially nascent. Without a
      demonstration-scale MOE Steel plant operating continuously, steelmakers face too much
      technology risk to commit to large-scale licensing. Boston Metal's own materials
      confirm a demonstration plant is still several years away. This gap places MOE Steel
      in a pre-commercial credibility zone and limits the near-term serviceable opportunity
      to partnerships and technology evaluations rather than license revenues.
    claimRefs:
      - CM040
      - CM042
      - CM050

  - calloutType: insight
    title: CBAM Creates Structural Cost Pull for EU-Based MOE Steel Licensees
    body: >-
      EU CBAM's definitive phase from January 2026 imposes €120-170/tonne compliance cost on
      conventional imported steel at current ETS prices. EU steelmakers operating MOE cells
      with renewable electricity face zero CBAM cost and progressively improved cost
      competitiveness versus imported conventional steel as free ETS allowances diminish
      through 2034. Boston Metal's licensing model means this benefit accrues to EU licensee
      steelmakers, creating a financial incentive for them to adopt MOE and validating
      Boston Metal's EU market development priority.
    claimRefs:
      - CM014
      - CM015
      - CM016
      - CM017

  - calloutType: assumption
    title: Critical Metals Revenue Projections Assume Stable Processing Economics
    body: >-
      The Brazil operation's near-term revenue depends on stable or recovering tantalum
      and niobium prices and consistent feedstock availability from mining waste streams.
      Tantalum prices dropped 8-12% in 2023 and the market showed 65% apparent consumption
      decline before recovering in 2024. Vanadium pentoxide prices fell 27% in 2024. These
      cyclical dynamics could compress critical metals margins during a period when Boston
      Metal most needs demonstrated commercial traction.
    claimRefs:
      - CM033
      - CM034
      - CM036
      - CM048

