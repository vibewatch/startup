        - ~100,000 t (V content); China ~70%, Russia ~21%, South Africa ~8%
        - 40-60% (secondary production offsets mine imports)
        - Steel alloying >90%, vanadium redox flow batteries growing (17% projected by 2033)
        - V2O5 ~$5.45/lb ($12/kg) average 2024
        - Not confirmed as primary Brazil target but MOE platform applicable
      - - Nickel
        - ~3.2M t world mine production; Philippines, Indonesia, Russia dominant
        - 48% (primary nickel)
        - Stainless/alloy steel 85%+, EV batteries, plating
        - LME cash ~$17,000/t in 2024
        - MOE platform stated to enable nickel recovery; US Eagle Mine produced 8,000 t in 2024
    enumerationScope:
      coverage: partial
      basis: >-
        Covers five critical metals Boston Metal has publicly identified as targets
        for its MOE platform (niobium, tantalum, tin, vanadium, nickel); chromium is
        also relevant for Outokumpu stainless partnership but excluded as not confirmed
        as a Brazil revenue target. Production data from USGS Mineral Commodity
        Summaries 2025 (January 2025 edition).
    notes: >-
      Production and price data from USGS Mineral Commodity Summaries 2025 (January 2025
      estimates for 2024 data). Boston Metal has not disclosed revenue splits by metal for
