  - id: green-steel-demand-drivers-and-regulatory-environment
    title: Green Steel Demand Drivers and Regulatory Environment
    body: >-
      Three converging forces are activating demand for near-zero-CO2 primary steel:
      regulatory compliance costs imposed on conventional steel producers and importers,
      corporate Scope-3 emissions obligations among steel-consuming OEMs and retailers, and
      the maturation of eligible production technologies including Boston Metal's MOE.

      The EU Carbon Border Adjustment Mechanism (CBAM) entered its transitional phase in
      October 2023 and shifts to the definitive phase on 1 January 2026. Under the definitive
      regime, EU importers of steel must hold CBAM certificates priced at the EU ETS auction
      price for each tonne of embedded CO2. At EU ETS prices of approximately €60-85/tonne,
      conventional steel with approximately 2 tCO2/tonne incurs a CBAM compliance cost of
      roughly €120-170 per tonne of imported steel—a material cost uplift that changes the
      competitive calculus for low-emission domestic production. The European Commission
      confirmed that steel and iron remain covered under the CBAM definitive phase and that
      the 50-tonne threshold triggers the declarant authorization requirement.

      The EU Emissions Trading System is simultaneously phasing down free allowances for
      steel producers: the IEA reports that free ETS allowances for steel end by 2034-2035
      under the revised ETS directive, with a trajectory making green production progressively
      more cost-competitive. In 2024, carbon prices ranged €60-85/tonne. The single-market
      EU Critical Raw Materials page confirms that niobium and tantalum are on the 2023 list
      of 34 Critical Raw Materials for the EU, adding a strategic supply-chain rationale
      alongside climate drivers.

      Corporate sustainability commitments reinforce regulatory pull. BMW Group's published
      sustainability program describes commitments to reduce Scope-3 supply chain emissions,
      which cover steel procurement as one of the most carbon-intensive inputs. The Science
      Based Targets Initiative steel sector guidance notes that if the global steel industry
      does not decarbonize, 14% of the potential value of steel companies could be at risk by
      2040 according to CDP analysis, underscoring financial incentive for steel buyers to
      source certified green product. The RMI estimates demand for low-emissions steel to
      reach approximately 6.7 Mt/year by 2030 under current committed buyer programs.

      The IEA's Net Zero by 2050 scenario requires the iron and steel sector to cut CO2
      emission intensity by approximately one-quarter by 2030, with near-zero emission
      production via electrolysis and hydrogen-DRI routes accounting for more than 8% of
      primary production by 2030. The IEA identifies approximately 30 additional commercial
      projects similar in scale to currently announced ones needed by 2030 to fill the NZE
      gap—creating a licensing pipeline opportunity for Boston Metal if it reaches commercial
      readiness in time.

      The US Inflation Reduction Act (IRA), with its USD 5.8 billion industrial
      decarbonization budget, creates parallel incentives in North America. The IEA notes
      the IRA is expected to boost hydrogen and CCUS project development, and Boston Metal's
      electricity-based MOE approach may access IRA clean manufacturing provisions without
      hydrogen infrastructure requirements.

      ResponsibleSteel's International Production Standard V2.1.1 (launched October 2024)
      includes revised GHG emissions requirements for steelmakers, and certification is
      increasingly required by automotive OEM procurement programs. Boston Metal's licensing
      model means that steel produced at licensee facilities using MOE cells would need to be
      certified under standards such as ResponsibleSteel for buyers to claim Scope-3
      reduction credit—a compliance friction in the value chain that Boston Metal and its
      licensees must address.
