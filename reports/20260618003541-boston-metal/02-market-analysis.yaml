  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: MOE steel licensing economics
      missingEvidence: >-
        Boston Metal has not publicly disclosed the licensing fee per tonne, royalty structure,
        or anode supply contract pricing for MOE Steel licensees. Without this, the SAM and
        SOM for the steel licensing business cannot be sized from public data.
      whyItMatters: >-
        The licensing economics determine whether the green steel TAM translates into meaningful
        Boston Metal revenue; a small per-tonne fee on a large steel volume is structurally
        different from a large fee on a small early-adopter volume.
      diligencePath: >-
        Request Boston Metal licensing term sheet; compare to analogous technology licensing
        models in metallurgy (e.g., Midrex DRI technology royalties, blast furnace technology
        licensing).
      relatedQuestionRefs:
        - QM021
        - QM027

    - type: private-evidence-only
      severity: material
      topic: Brazil operation throughput and revenue
      missingEvidence: >-
        Boston Metal has not disclosed production volume, revenue, operating margin, or
        feedstock supply contract terms for the Brazil critical metals operation, making it
        impossible to independently verify the 2026 revenue target or scale.
      whyItMatters: >-
        The Brazil operation is the primary near-term revenue bridge; without disclosed
        financials or throughput data, investors cannot assess whether the operation is
        commercially viable at scale or is a proof-of-concept at pilot volumes.
      diligencePath: >-
        Request operational data from Boston Metal Brazil; review IFC investment documentation
        for disclosed capacity and production targets; check regulatory filings in Brazil
        for environmental licenses and capacity disclosures.
      relatedTableRefs:
        - TM004

    - type: missing-source
      severity: material
      topic: IRA applicability to MOE steel
      missingEvidence: >-
        No public analysis exists that specifically maps IRA clean manufacturing provisions
        (Section 48C, 45X, or 45V) to Boston Metal's MOE technology to quantify potential
        per-tonne incentive value for US-based MOE deployments.
      whyItMatters: >-
        IRA incentives could materially improve the economics of US MOE Steel licensees and
        accelerate adoption in North America, potentially ahead of EU CBAM-driven EU adoption.
      diligencePath: >-
        Commission legal/tax analysis of IRA provision applicability; review DOE AMO guidance
        on electrolytic metal production qualifying for clean manufacturing credits.
      relatedQuestionRefs:
        - QM027

    - type: missing-source
      severity: material
      topic: comparable green steel analyst estimates
      missingEvidence: >-
        BloombergNEF, Wood Mackenzie, and S&P Global Commodity Insights green steel market
        sizing reports were not accessible during this research cycle; these could provide
        independent corroboration or challenge the IEA/RMI demand figures.
      whyItMatters: >-
        The green steel demand estimates used in this chapter rely primarily on IEA (normative
        scenario) and RMI (committed buyer program survey), which are relatively optimistic
        sources; independent analyst estimates may show narrower or wider ranges.
      diligencePath: >-
        Obtain BloombergNEF Green Steel Market Outlook report; review S&P Global Platts
        ferroniobium and green steel premium market reports.
      relatedQuestionRefs:
        - QM029

