figures:
  - id: FM001
    title: Boston Metal Market Sizing Pyramid — TAM/SAM/SOM
    type: pyramid
    layout: standard
    summary: >-
      Three-layer market sizing from global steel TAM through green-primary-steel SAM to
      Boston Metal's near-term critical metals SOM, using source-backed estimates for each
      layer.
    data:
      items:
        - label: TAM — Global steel market
          value: "$1.3-1.5T annual revenue (1,885 Mt × $700-800/t avg)"
          description: All steel production globally across all grades, routes, and geographies
        - label: SAM — Green/near-zero primary steel (EU + US)
          value: "~50-100 Mt/yr demand by 2030 under NZE scenario; EU CBAM-exposed tonnage ~130 Mt import/year"
          description: >-
            Steel produced via near-zero emission routes (MOE, H2-DRI, EAF from scrap)
            targeting CBAM/ETS-exposed markets and corporate Scope-3 buyers
        - label: SOM — MOE licensing fee + critical metals revenue
          value: "Brazil critical metals: Nb ~$440M US imports; Ta ~$230M; Sn ~$840M US; MOE licensing fee TBD"
          description: >-
            Near-term: Brazil critical metals operation (niobium, tantalum, tin); longer-term:
            licensing fees and inert anode supply from steelmaker deployments globally
    approximationNotes: >-
      SAM for green steel is estimated from IEA NZE scenario (>8% of primary production by
      2030 = >80 Mt) and CBAM-exposed import volumes. SOM for MOE steel licensing is not
      quantifiable from public data as licensing fee per tonne is not disclosed. Critical
      metals SOM uses USGS US import value as a proxy for addressable market size.
