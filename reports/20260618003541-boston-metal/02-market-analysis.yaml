company:
  name: Boston Metal
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Boston Metal addresses two distinct but related markets: the global green steel market,
    where its Molten Oxide Electrolysis (MOE) platform enables near-zero-CO2 iron production
    via a licensing and anode-supply model rather than direct steel manufacturing; and the
    critical metals market for niobium, tantalum, tin, vanadium, and nickel, where its Brazil
    subsidiary provides the nearer-term revenue bridge. Global crude steel production reached
    1,885 Mt in 2024 with a CO2 intensity of 1.92 t/t, establishing a structurally large
    decarbonization addressable market. The EU CBAM definitive phase from January 2026 and
    phased elimination of ETS free allowances for steel by 2034 are creating regulatory pull
    for MOE-based green steel licensees. Critical metals markets are underpinned by US 100%
    import reliance on niobium and tantalum, both on the EU Critical Raw Materials list, and
    by growing vanadium demand from energy storage. Boston Metal's dual-market architecture
    lowers near-term execution risk but creates sizing complexity because its steel TAM is a
    licensing-fee share of a commodity-sized market rather than direct revenue from steel
    production.

sections:
  - id: global-steel-market-overview
    title: Global Steel Market Scale and Decarbonization Imperative
    body: >-
      Steel is the backbone of industrial civilization, appearing in construction, automotive
      manufacturing, energy infrastructure, mechanical equipment, and consumer goods. Global
      crude steel production reached 1,885 million tonnes in 2024, broadly stable since 2020
      according to World Steel Association data. China remains the dominant producer at
      approximately 1,018 Mt (54% of world output), followed by India at 125.3 Mt, Japan at
      89.2 Mt, and the United States at 80.5 Mt. Total apparent steel use in 2024 was
      approximately 1,742 Mt globally, implying average per-capita steel use of 214.7 kg in
      new products.

      The sector breakdown of steel use in 2024 shows that building and infrastructure
      accounts for 52% of global demand, mechanical equipment 16%, automotive 12%, metal
      products 10%, electrical equipment 5%, domestic appliances 3%, and other transport 2%.
      This distribution matters for Boston Metal's market thesis: automotive OEMs and
      infrastructure clients are among the most likely early adopters of certified green or
      low-emission steel given their binding Scope-3 targets and regulatory exposure.

      The carbon intensity of steelmaking makes the sector a primary target for industrial
      decarbonization policy. The World Steel Association reported average CO2 intensity of
      1.92 tonnes CO2 per tonne of crude steel cast in 2023. The Science Based Targets
      Initiative estimates the steel sector accounts for 7-9% of total global greenhouse gas
      emissions. Conventional blast-furnace basic oxygen furnace (BF-BOF) routes, which
      account for roughly 70% of global primary production, are carbon-intensive at
      approximately 2.0-2.3 t CO2/tonne. Electric arc furnace (EAF) scrap-based routes
      achieve approximately 0.70 t CO2/tonne on average (World Steel 2025), but require scrap
      availability. The World Steel Association's direct reporting shows DRI-EAF CO2 intensity
      at 1.43 t/t on average, reflecting natural gas DRI as the dominant current DRI route.

      Boston Metal's MOE technology produces iron from iron ore using only renewable
      electricity, without any carbon in the process, targeting near-zero CO2 intensity per
      tonne. This is distinct from hydrogen-DRI routes in that it requires no hydrogen
      infrastructure, carbon capture, or process water. The IEA Iron and Steel tracker
      explicitly identified Molten Oxide Electrolysis alongside Low Temperature Electrolysis
      as technologies progressing toward commercialization and capable of decarbonizing steel
      production from the end of this decade onwards, noting that high-value metals were
      produced commercially using MOE for the first time in 2023.

      The global steel market's revenue scale is substantial. At average realized prices of
      approximately $700-800/tonne (commodity grades) to $900-1,200/tonne (premium flat
      products), the total market represents approximately $1.3-1.5 trillion in annual revenue.
      Premium green-certified steel commands an additional green premium layer that current
      market intelligence suggests is in the €50-200/tonne range for confirmed offtake
      agreements, though the durability of that premium is debated and depends on carbon
      pricing policy and competing supply timelines.
