- id: what-business-line-carries-value
  title: What business line carries value today
  body: 'The public evidence now points clearly to critical metals as the near-term value carrier. Boston Metal itself says critical metals are the strongest near-term commercial opportunity for the MOE platform, and MIT Technology Review''s 2026 reporting makes the same point more bluntly: the company is leaning on critical metals to survive and to keep the broader story alive. That means valuation should not treat steel licensing as the main 24-month driver even if steel remains the dominant terminal upside.


    This shift is why the Brazil plant matters so much. If Brazil restarts and ramps, Boston Metal can show the market that MOE is not just a lab-to-pilot success but a monetizable industrial system. If Brazil slips again, the valuation loses its bridge between science and scaled earnings power. Weirton and Outokumpu add attractive option value around chromium, alloys, and industrial circularity, but those paths are still earlier-stage than the Brazil critical-metals bridge.


    For investors, the message is to separate present-value drivers from terminal-value drivers. Present value is mostly Brazil plus financing resilience; terminal value is MOE Steel.'
