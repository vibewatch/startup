- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / status
  - Multiple / valuation signal
  - Relevance
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Covers a representative set of public decarbonized-metals analogues and reference companies rather than an exhaustive private-market transaction list.
  rows:
  - - Boston Metal
    - Private, pre-revenue steel thesis with critical-metals bridge
    - Post-money not publicly disclosed; simple implied range roughly $750M-$1.5B from 5%-10% dilution framing on $75M round
    - Direct subject company and only one combining MOE Steel plus critical metals
    - Range is assumption-driven and may ignore structured terms
  - - Electra
    - Electrochemical iron startup
    - Valuation not publicly disclosed in cited source
    - Closest process analogue for electricity-only iron pathway
    - Business model and temperature regime differ from Boston Metal
  - - Stegra
    - Hydrogen-DRI green steel developer building large direct-sales business
    - Valuation not cited here; commercial proof stronger than Boston Metal
    - Useful for timing and customer-proof comparison
    - Asset-heavy direct producer, not licensing model
  - - HYBRIT / SSAB pathway
    - Hydrogen-storage and primary-steel decarb reference route
    - Valuation not cited here; technical validation more mature in some areas
    - Useful as strategic and technical benchmark
    - Joint-venture / incumbent ecosystem, not venture startup pure-play
  - - ArcelorMittal XCarb perspective
    - Strategic investor lens rather than startup comp
    - $36M disclosed strategic check into Boston Metal
    - Helps gauge industrial willingness to finance decarb options
    - Not a tradable pure-play valuation comparable
  - - Third-party valuation trackers
    - PremierAlts / GetLatka / Caplight publish divergent private-company estimates
    - Signals range from ~$357.6M to ~$931M in accessible trackers
    - Useful as a sentiment / opacity check
    - Methodologies are opaque and should not be treated as audited marks
  notes: Comparable-set evidence is intentionally qualitative because public valuation data for private hard-tech rounds remains sparse and inconsistent.
