      - number: '7.3'
        title: 监管、法律和合规风险
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 没有面临明显公开执法行动，但它运营在几个对尽调重要的监管和法律边界内。Weirton 项目位于联邦产业政策项目、环境审查和潜在未来里程碑合规之中。巴西项目处于 IFC
              支持的环境与社会治理框架内，并带有正式申诉路径。同时，Massachusetts WARN 备案说明劳动法暴露并非理论风险；它已成为公司公开运营记录的一部分。


              这并不意味着 Boston Metal 异常不合规。事实上，现有文件显示公司使用的是主流机构渠道：DOE 甄选流程、IFC 文件、SEC
              豁免发行备案和专利。风险在于执行复杂度。一家公司既要满足产业政策预期，又要维持跨境 E&S 实践、保住专利杠杆、管理高可见度裁员，其合规负担高于典型软件初创公司。


              因此，投资者应把法律和监管尽调视为运营系统问题，而不是勾选清单。正确的问题是：管理层是否有足够流程深度，避免合规成为另一种排期滑坡来源。
