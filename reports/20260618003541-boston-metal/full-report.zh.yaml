              每个 H-DRI 竞争者都依赖大规模绿氢供应，且经济性门槛约为 ~$2/kg，目前尚未达到。Boston Metal 的 MOE 只需要可再生电力和铁矿石。如果绿氢 H2 降本时间表继续拉长——这在许多 IEA
              和行业情景中正越来越像基准假设——MOE 的基础设施简单性会随时间变得更有价值，而不是更弱。
