    rows:
      - - Stegra（原 H2 Green Steel）
        - 绿色 H2 DRI 先行者
        - 已锁定 €7.9 B 融资；预售 1.5 Mt+
        - 汽车 OEM（Porsche、Mercedes、Scania、Volvo）、零售商（IKEA）、科技（Microsoft）
        - 已融资绿色钢项目中规模最大；实体建设推进中；客户订单已锁定
        - 氢成本风险；单一 Boden 场址；过渡期需要天然气桥接
      - - SSAB / HYBRIT
        - 绿色 H2 DRI 合资项目 + 商业化废钢 EAF
        - SSAB 年收入约 $7 B；HYBRIT 是与 LKAB 和 Vattenfall 的合资项目
        - 北欧和欧洲工业客户（国防：Rheinmetall LOI，2026 年 1 月；汽车；建筑）
        - SSAB Zero 已商业供应；HYBRIT H2 储存已于 2025 年 2 月验证
        - 完整 HYBRIT 原生铁路线尚未商业规模化；地理集中度高
      - - ArcelorMittal（XCarb）
        - 在位改造方 + Boston Metal 战略投资者
        - 收入约 $65 B；多路线 DRI 项目；持有 Boston Metal 战略股权
        - 全球蓝筹工业客户（汽车、能源、建筑）；既有客户
        - 规模、分销深度、多路线选择权；Ghent 和 Texas 的 DRI
        - 存量 BF-BOF 资产基础；转型复杂；不能放弃既有客户合同
      - - thyssenkrupp（tkH2Steel）
        - 在位 H2 DRI 改造方
        - 已获得 €2 B EU Innovation Fund 拨款；Duisburg 目标 2.5 Mt/年
        - 德国和欧洲钢材买方；thyssenkrupp 既有客户
        - 已获得 EU 公共补贴；大型工业场址上的规模化 DRI 项目
        - 财务重组带来资本配置不确定性；需要 H2 供应
      - - Salzgitter（SALCOS）
        - 在位 H2 DRI 改造方
        - 未完全披露；德国最先进的国家级绿色钢项目
        - 德国和欧洲工业买方；Salzgitter 既有客户基础
        - 目标 2026 年生产首批绿色铁水；德国最领先的 DRI 时间线
        - 规模小于 thyssenkrupp/ArcelorMittal；依赖 H2 供应链
      - - Electra
