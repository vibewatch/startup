        title: 关键金属对手方和公共部门需求塑形
        blocks:
          - type: paragraph
            body: >-
              关键金属侧的客户集合更具运营指向。Boston Metal 巴西子公司被定位为 MOE
              平台用于商业金属回收的首个部署，核心客户原型是矿企和工业废弃物拥有者。公司明确把该工艺营销为把负债转化为可变现金属产出的方式。这使近期买方对话不那么围绕绿色溢价，而更围绕回收经济性、副产品货币化，以及战略金属供应链韧性。


              Outokumpu 和 CBMM 是最有说明力的具名证明点。2025 年 Outokumpu MOU 很重要，因为它把潜在客户行为与供应链支持结合在一起：Outokumpu
              同意在含铬材料和自身运营循环利用的语境下评估 Boston Metal 技术。更早前，CBMM 的铌合作表明 Boston Metal
              已经在特种金属用例上接触采矿侧对手方。这些还不是大体量收入披露，但它们比单纯钢铁行业叙事更贴合真实首发市场应用。


              Weirton 的政府支持铬制造又增加一层。DOE 和 Senate 材料显示，Boston Metal
              围绕超纯铬以及先进能源和工业用途的高温合金进行定位。这不能像长期承购那样证明客户拉力，但它把商业化版图从一个巴西工厂和一个钢铁命题扩展出去。
