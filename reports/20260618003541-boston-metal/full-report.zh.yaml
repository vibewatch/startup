      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 双市场架构降低近期收入风险
            body: >-
              Boston Metal 在 Brazil 的关键金属业务提供近期收入（目标自 2026 年起），同时 MOE Steel 授权命题继续成熟。Brazil 工厂面向铌、钽和锡市场；United States
              对这些金属 100% 依赖进口，EU 也已将三者全部列为 Critical Raw Materials，因此形成不依赖绿色钢采用时间表的战略需求底座。
            calloutType: strength
            claimRefs:
