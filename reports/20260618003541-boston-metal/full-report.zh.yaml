      - number: '7.5'
        title: 缓释、监测信号和投资论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              Boston Metal
              确实有有意义的缓释因素。公司已筹集大量资本，建立高质量战略财团，在试点规模证明真实钢铁产出，并获得美国铬工厂的公共部门支持。这些不是表面利好。它们说明公司能吸引严肃对手方，也能解决困难技术问题。只是这些还没有填平耐久性、集中度和时间上的缺口。


              监测上，第一个问题是巴西。若能可信重启、稳定产出，并出现可见客户交付，就会缓解最直接的运营和融资风险。第二个问题是 MOE Steel
              能否从里程碑叙事走向项目现实：具名示范厂细节、对手方和商业里程碑。第三个问题是裁员后的治理韧性，以及公司能否用更小团队保持技术动能。


              实用的投资论点破裂条件因此很清晰。如果巴西再次滑坡，如果新资本只能以惩罚性条款进入，或如果钢铁示范路径仍然模糊而竞争者继续前进，下行情景会迅速加强。只有执行开始追上科学雄心时，Boston Metal
              才仍具备可投资性。
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
