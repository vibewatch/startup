              - CM046
          - type: callout
            title: MOE Steel 授权命题取决于示范规模验证
            body: >-
              绿色钢授权 TAM 结构性巨大，但商业化仍处早期。如果没有一座示范规模 MOE Steel 工厂持续运行，钢铁制造商承担的技术风险过高，难以承诺大规模授权。Boston Metal
              自身材料确认，示范工厂仍需数年时间。这个缺口让 MOE Steel 处在商业化前可信度区间，并把近期可服务机会限制在合作和技术评估，而不是授权收入。
            calloutType: risk
            claimRefs:
              - CM040
              - CM042
              - CM050
          - type: callout
            title: CBAM 为 EU 本地 MOE Steel 被授权方创造结构性成本拉力
            body: >-
              EU CBAM 自 2026 年 1 月进入正式阶段，在当前 ETS 价格下，会对传统进口钢施加 €120-170/tonne 的合规成本。EU 钢铁制造商若用可再生电力运行 MOE 电解槽，CBAM
              成本为零；随着免费 ETS 配额到 2034 年逐步减少，相比进口传统钢，其成本竞争力会持续改善。Boston Metal 的授权模式意味着，这一收益归属于 EU 被授权钢铁制造商，从而为其采用 MOE
              创造财务激励，也验证 Boston Metal 将 EU 作为市场开发重点。
            calloutType: insight
            claimRefs:
              - CM014
