      - number: '5.2'
        title: 惰性阳极工程和放大架构
        blocks:
          - type: paragraph
            body: >-
              惰性阳极是 MOE Steel 工艺中最关键、技术难度最高的单一部件。在传统铝冶炼（Hall-Héroult 工艺）中，消耗性碳阳极会持续与氧反应并释放 CO₂。Boston Metal
              的突破，是发现一种铁铬合金在 1,600°C 且承受电解施加的氧化电势时仍保持惰性——不会溶解、腐蚀或与氧反应。公开描述称，该阳极主要由铬和铁构成，并含有少量其他元素。精确合金成分是专有信息，也是 Boston
              Metal 的核心 IP。

              工程挑战很严峻：阳极必须同时承受极端高温、持续氧轰击和电化学氧化，且不退化。Boston Metal SVP Adam Rauwerdink 对 CNBC
              解释说：“能做到这一点的元素非常少。这种合金就是其中之一。” 在电流分布失衡或电解质化学漂移等校准不当条件下，早期阳极退化是公司前十年集中解决的主要技术障碍。CEO Tadeu Carneiro 2023
              年指出，问题已经从能否成功的二元判断，转向阳极寿命：“问题是阳极寿命会有多长？它会持续三年还是两年？” 生产条件下真实阳极寿命尚未有独立验证发表。

              Boston Metal 的放大架构类似铝冶炼。单个电解槽用更高电流产出更多金属，目标最高约为每槽 600,000 安培、日产约 10 吨。超过实际单槽上限后，就在同一槽体内加入多个阳极（2025 年 3
              月已验证的多阳极设计），再把多个电解槽并联排布，达到工厂级产出。全尺寸商业工厂可能拥有数百个电解槽。2022 年安装在 Woburn 的试点反应器最高运行在 25,000
              安培——约为早期实验室电解槽的一千倍——并作为多阳极过渡的工程测试平台。2025 年 9 月签署的 Outokumpu MOU，从 Outokumpu 位于芬兰的 Kemi
              矿山提供结构化铬原料供应，以保障惰性阳极供应链。
