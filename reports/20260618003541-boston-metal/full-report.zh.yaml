      - number: '7.2'
        title: 融资和商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Boston Metal
              仍高度暴露于融资风险，因为钢铁业务处于收入前，关键金属桥梁只有在巴西按时重启并爬坡时才有效。公开记录显示，公司作为私营硬科技企业已筹集巨额资金，却仍在单个运营里程碑滑坡时遭遇突然融资冲击。这个组合正是首创型工业公司难以承销的原因：历史融资强劲能带来信心，但当资本围绕工程里程碑分批释放时，并不能阻止突然的流动性压力。


              2026 年 Form D、$75M 融资和更早的可转债都指向同一件事。Boston Metal
              仍处于资本战略和运营战略不可分割的阶段。管理层必须一边解决深层技术和工厂执行问题，一边不断延长资金续航。每一次延迟都会削弱谈判筹码，并提高下一轮融资更像救援资本而非增长资本的概率。


              模型风险比现金本身更深。Boston Metal 的钢铁愿景仍依赖未来授权曲线，但这条曲线尚未被具名合同或重复部署公开验证。如果关键金属桥梁表现不及预期，公司可能被迫用更昂贵的资本资助更长的钢铁路径。
