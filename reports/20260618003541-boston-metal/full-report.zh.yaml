  - id: FE001
    title: Boston Metal MOE 钢铁工艺架构
    type: stack
    layout: standard
    summary: 分层展示 MOE Steel 电解槽：从电力输入，到熔融氧化物化学过程，再到液态钢和氧气输出。
    data:
      layers:
        - label: 电力输入层
          detail: 交流电网电力转换为直流电；完整商业单槽目标约 600,000 A；当前规模约 25,000 A（中试）
        - label: 惰性阳极层
          detail: 铁铬合金阳极浸入熔体，传导电流；在 1,600°C 下抗氧化；成分获 MIT 专利；工业规模采用多阳极设计
        - label: 熔融氧化物电解质层（1,600°C）
          detail: 铁矿石溶解在熔融氧化物熔体中；杂质留在电解质里；电解质承担离子传输；为保证产品纯度和阳极稳定性，必须严控
        - label: 电化学反应层
          detail: Fe²⁺/Fe³⁺ 离子在阴极还原成液态铁；O²⁻ 离子在阳极氧化成 O₂ 气体；过程不涉及碳物种；唯一气体副产物是纯氧
        - label: 输出层
          detail: 液态铁汇集在电解槽底部，直接出铁进入钢包冶金；顶部释放纯 O₂ 气体；合金化后形成钢产品；无 CO₂、无工艺用水、无危险化学品
    approximationNotes: 具体工程参数（阳极合金成分、电解质配方、电解槽几何结构、电流密度）属于专有信息。该架构由公开的 MIT、公司和媒体资料重构。
    claimRefs:
      - CE001
      - CE002
      - CE009
      - CE011
  - id: FE002
    title: Boston Metal 客户流程：从矿石到绿色钢铁
    type: flow
    layout: standard
    summary: 展示铁矿石如何通过 Boston Metal 的 MOE 授权模式进入钢厂和终端客户，并纳入经巴西路径生产关键金属的流程。
    data:
      nodes:
        - id: ore_supplier
          label: 铁矿石供应商
          detail: 中低品位矿石（35–65% Fe）；无需选矿、造球或烧结；BHP、Vale 既是投资方也是供应商
        - id: moe_cell
          label: MOE 电解槽（钢厂现场）
          detail: 授权技术；钢企部署电解槽；商业规模单槽 600 kA；单厂 100+ 个电解槽
        - id: liquid_iron
          label: 液态铁
          detail: 从电解槽底部放出的高纯熔融金属；直接进入钢包冶金；无需 EAF
        - id: ladle_metallurgy
          label: 钢包冶金 / 合金化
          detail: 沿用钢企现有设备；加入合金；调整钢液化学成分；连续铸造
        - id: green_steel
          label: 绿色钢铁产品
          detail: 近零 Scope 1+2 CO₂ 钢铁；销往汽车、建筑、EV 和工业客户
        - id: boston_metal_licensing
          label: Boston Metal（授权方）
          detail: 提供技术许可、阳极供应和工艺 know-how；赚取授权费和阳极收入
        - id: critical_metals_brazil
          label: Boston Metal do Brasil 巴西公司
