  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图——直接同行、现有企业、替代方案与现状路线
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的竞争格局最好拆成三个同心圈，并分别套用到钢铁和关键金属业务。钢铁内圈是直接技术同行，它们都在追求新型低碳或零碳炼铁：Stegra（H2 DRI-EAF，Boden，Sweden）和
              SSAB/HYBRIT（H2 DRI-EAF 合资）是最成熟的两个例子，均采用氢直接还原路线，生产海绵铁或热压块铁，再进入电弧炉炼钢。Electra 用 60°C 水溶液电积还原来自矿石的铁离子，是最接近
              Boston Metal Molten Oxide Electrolysis 的电化学类比，但在温度制度和原料溶解化学上根本不同。Electra 和 Boston Metal 都用电力而非氢来生产近零 CO2
              铁，但运行在温度谱的两端。

              第二圈是正在主动脱碳转型的一体化钢铁巨头，它们通过渐进项目服务同一批钢铁买方：ArcelorMittal（XCarb 项目、Ghent 和 Texas 的 DRI 工厂，以及对 Boston Metal
              本身的战略股权）、thyssenkrupp（tkH2Steel，Duisburg 2.5 Mt/year DRI）和 Salzgitter（SALCOS，目标 2026
              年产出首批绿色铁水）。这些企业拥有运营现金流、客户关系和分销网络，任何创业公司都无法匹配。不过，它们的脱碳转型是几十年计划，受传统高炉资产、项目融资时间表和氢供应基础设施约束。

              外圈由现状替代方案占据：传统 BF-BOF 路线（约占全球产量 70%，2.0–2.3 t CO2/t）仍是价格锚；天然气 DRI EAF 路线（1.1–1.4 t CO2/t）已在边际上替代
              BF-BOF；以及使用可再生电力的 EAF 废钢炼钢，Nucor 已把这一路线包装成可商业购买的 Econiq 净零产品。Nucor 的 Econiq 是一个特别相关的近期替代品：买方今天就能借助 RECs
              和抵消，声称 Scope 3 净零钢合规，而不需要任何新技术生产的物理绿色铁。

              关键金属的竞争格局完全不同。CBMM（Companhia Brasileira de Metalurgia e Mineração）控制全球 80%
              以上铌产量，并运营传统火法冶金回收。来自原生矿或回收电子产品的传统钽、锡精炼，由中国、德国及其他地区的成熟冶炼厂完成。因此，Boston Metal 的 MOE
              关键金属业务面对的是与现有企业的成本和收率挑战，而不是与另一家创业公司的正面技术竞赛。
