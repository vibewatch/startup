      - number: '8.4'
        title: 可比公司、建议与估值立场
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 很难被干净地放进某一个同行篮子。Electra 更接近流程技术类比，因为它同样主张电化学炼铁。Stegra 和 HYBRIT
              更适合作商业可比，因为它们展示了绿色原生钢扩产在项目融资、客户和实体建设开始硬化时是什么样。成熟钢铁公司不适合作直接可比，因为 Boston Metal 既没有它们的收入基础，也没有它们的资产结构。


              可比集合混杂，也说明风险投资式期权框架比干净的收入倍数更有用。Boston Metal 同时是平台押注、首个商业资产押注，也是政策 /
              战略材料押注。战略投资者支持和股东名单质量值得持续关注，但它们无法掩盖一个事实：公开来源里的客户证明和单位经济仍然很薄。


              因此立场偏谨慎。公司仍有足够大的上行空间，值得认真跟踪，但仅靠公开材料还不足以支持买入式姿态。今天的估值更适合描述为「偏紧但仍富含期权」：并非明显不理性，却太不透明，也太依赖执行，难以支持高确信度进入。
