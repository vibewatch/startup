        title: 留存可见度和集中度风险
        blocks:
          - type: paragraph
            body: >-
              客户叙事最大的弱点不是缺少关系，而是缺少运营客户指标。本章审阅的来源没有披露账户数量、活跃部署、利用率、留存、续约时间或按客户划分的收入集中度。这意味着投资者目前无法区分：这究竟是广泛的感兴趣对手方漏斗，还是一组狭窄、脆弱、依赖里程碑的关系。


              集中度风险偏高，因为 Boston Metal
              近期变现高度依赖巴西工厂成功，以及一小撮与采矿、特种金属和钢铁脱碳绑定的战略伙伴。如果巴西延迟，公司没有公开可见的第二个运营商业站点来吸收冲击。如果一两个战略投资者决定内部优先推进替代技术，管线信号会迅速变弱，因为当前很多证明都来自同一批名字。


