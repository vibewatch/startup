      - number: '8.5'
        title: 推翻投资论点的因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              未来 12 到 18 个月应能决定 Boston Metal 的估值折价是收窄还是扩大。最重要的实时变量仍是
              Brazil。稳定重启、可见产出和可信的客户转化，会移除最明显的短期压力。第二个变量是融资纪律：投资人需要知道新资本是公司强势时募来的，还是只是为了维持一座延期的桥。第三个变量是钢铁路径能否通过更大的示范计划和更硬的客户信号变得具体。


              当前公开档案不完整，因此尽调清单异常务实。承销方应索取股权结构和优先权细节、按业务逐项拆分的 capex 和 opex、按交易对手列出的当前管线状态、Weirton
              锚定买家的证据，以及事故后的整改材料。没有这些材料，情景模型只能近似。


              Boston Metal 于是落在一个熟悉但重要的类别里：公司确实拥有定义品类的上行空间，但估值仍更多由未来可能性支撑，而不是当下商业证明。这是继续密切观察的理由，不是放松纪律的理由。
