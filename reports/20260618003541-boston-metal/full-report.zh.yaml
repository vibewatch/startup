  - id: TM003
    title: 增长驱动因素与约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Boston Metal 的影响
      - 尽调问题
    rows:
      - - EU CBAM 确定性阶段（2026 年 1 月）
        - 驱动因素
        - 现在（2026 年起生效）
        - 传统进口钢将产生 €120-170/吨合规成本；EU 钢企更有动力授权近零排放技术
        - 确认哪些 EU 钢企正在评估授权
      - - EU ETS 免费配额到 2034 年逐步下调
        - 驱动因素
        - 2026-2034 年爬坡
        - EU BF-BOF 生产成本逐步上升；MOE 成本优势扩大
        - 确认实际 ETS 配额时间表，以及模型测算中对 BF-BOF 运营商的成本影响
      - - 企业 Scope-3 SBTi 目标（汽车 OEM）
        - 驱动因素
        - 2025-2030 年强制披露
        - BMW、汽车 OEM 必须推动钢材采购脱碳；带动被授权方绿色认证钢需求
        - 确认主要 OEM 钢材买家的承诺是有约束力还是愿景式
      - - IRA 工业脱碳资金（USD 5.8B）
        - 驱动因素
        - 2023-2030 年拨付
        - 美国本土 MOE 授权可能拿到 IRA 抵免；在部分条款下，电力路线比氢路线更有利
        - 确认哪些 IRA 条款适用于 MOE，以及每吨预期收益
      - - 美国对 Nb 和 Ta 100% 依赖进口
        - 驱动因素
        - 持续（结构性）
        - 政府采购和战略储备对本土加工有兴趣；Boston Metal Brazil 提供巴西以外的加工路线
        - 确认能否进入美国政府采购渠道
      - - EU Critical Raw Materials Act（Nb、Ta、Ni 已列入）
        - 驱动因素
        - 2023 年立法，已生效
        - Boston Metal 的关键金属产品获得 EU 战略认定；政策支持供应多元化
        - 确认 Boston Metal 是否符合 CRMA 投资或融资支持条件
      - - 电价与低碳电力可得性
        - 约束
        - 持续
        - MOE 直接消耗电力；高电价或高碳电网会削弱近零排放主张和经济性
        - 测算授权经济性对电价的敏感度；确认被授权方的购电协议策略
      - - 技术成熟度（尚无商业 MOE Steel 工厂）
        - 约束
        - 3-5 年周期
        - 钢企在示范规模验证前，不太可能签下大规模授权
        - 跟踪 Woburn 示范工厂里程碑；确认时间线和 capex 承诺
      - - 绿色钢溢价韧性
        - 约束
        - 取决于政策
        - 如果 CBAM 被削弱，或 OEM 在 EV 转型中利润率受压，绿色溢价会被侵蚀
        - 跟踪 CBAM 执行路径；在没有绿色溢价的情形下压力测试授权经济性
      - - 关键金属价格周期性
        - 约束
        - 持续
        - 钒 2024 年下跌 27%；钽 2023 年下跌 8% 后回升；巴西收入敞口受影响
        - 跟踪巴西业务的大宗商品价格对冲和合同结构
    notes: >-
      时间分类为作者基于 IEA、EC 和 USGS 数据作出的判断；实际政策落地和技术里程碑仍有很大不确定性。Boston Metal 尚未公开授权经济性，因此 CBAM 成本抬升给被授权方带来的优势，是基于公开 EU ETS 和
      CBAM 价格数据估算。
