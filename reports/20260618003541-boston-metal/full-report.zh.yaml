            body: >-
              Boston Metal 的客户管线可信到值得重视，但还不成熟到可以激进承销。钢铁侧有 ArcelorMittal 和 BMW 等蓝筹名字在轨道内，但公开记录没有披露谁会率先在工厂规模授权或部署
              MOE。关键金属侧更接近收入，也更扎根于明确用例，但运营集中度也更高，因为第一个真正商业资产仍在经历重启和放大风险。


              尽调最重要的缺失项很直接：按业务线列出的具名活跃对手方清单、每段关系的状态表（筛选、试点、MOU、商业试验、合同）、试验后重复互动证据，以及巴西产出的客户特定单位经济性逻辑。投资者还应询问 DOE 支持的
              Weirton 产出是否已识别锚定买方，以及同一条铬路径是供给 Boston Metal 自身 MOE 供应链，还是服务独立商户市场。


