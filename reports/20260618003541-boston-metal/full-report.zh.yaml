      - number: '2.4'
        title: 买方分层、TAM/SAM/SOM 与采用约束
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的市场架构与直接钢铁生产商根本不同。钢铁业务中，购买 Boston Metal 产品的是钢铁制造商——他们授权使用 MOE
              技术并采购惰性阳极——而不是绿色钢铁的最终买方。关键金属业务中，买方是金属精炼商、矿业公司，以及铌、钽、锡和钒铁合金的下游工业消费者。

              对钢铁授权市场而言，TAM 是全球原生铁生产对应的总装机炼钢能力——约 14 亿吨 / 年 BF-BOF 原生生产面临监管替代风险。SAM 收窄到暴露于 CBAM 的司法辖区，以及具有约束性脱碳要求的区域，尤其是
              EU、UK 和 US IRA 区域。在其中，Boston Metal 近期授权管线的 SOM 受技术就绪度限制：Woburn 中试在 2025
              年成功投运了多惰性阳极工业电解槽并产出吨级钢，但大规模商业授权开始之前，仍需要一座示范规模工厂。钢铁业务的主要收入流是技术授权费，以及持续的惰性阳极制造和供应（按 Boston Metal
              披露模式），不是每吨钢毛利。

              两条业务线的买方分层包括：（1）作为被授权方的一体化钢铁制造商：Outokumpu（不锈钢）和其他评估含铬副产物流的钢铁生产商，是早期验证伙伴。BMW Group 作为投资人参与，释放了汽车 OEM
              对绿色钢供应链资质的拉力。这些买方受监管合规（CBAM、ETS）、Scope 3 目标（SBTi）和竞争差异化驱动。（2）作为关键金属买方的矿业和金属公司：CBMM（Brazil，铌）和类似生产商，可能与
              Boston Metal 合作，从加工废弃物中回收额外价值。US 政府对国内关键矿产供应链的兴趣（铌和钽 100%
              依赖进口）创造了政府采购和激励渠道。（3）电子和国防买方：航空航天、国防和消费电子领域中铌高温合金与钽电容器的下游消费者，需要供应链多元化和 US 国内加工能力。

              关键采用约束包括：（1）技术风险——商业 MOE Steel 在广泛授权前仍需要示范工厂，留下多年可信度缺口；（2）资本强度——每个 MOE
              电解槽部署是模块化的，但商业规模工厂的总资本开支可观，被授权方面临资产负债表风险；（3）电力成本和可得性——IEA 指出，要在 NZE 规模下实现近零钢铁，到 2030 年还需要 250 TWh 额外低碳电力，而
              MOE 直接消耗电力，电价成为关键可变成本驱动；（4）绿色溢价耐久性——€50-200/tonne
              绿色钢溢价取决于持续碳定价和买方支付意愿，两者都面临政治和经济不确定性；（5）授权模式执行——钢铁制造商必须愿意授权而不是自建专有替代方案，授权谈判周期也会增加商业化风险；（6）关键金属市场周期性——钒价
              2024 年较 2023 年下跌 27%，钽市场销量在 2024 年恢复前曾大幅下降。

              一个值得强调的负面市场风险是：IEA 和 RMI 分析预计，要满足 NZE 路径，近零排放钢到 2030 年必须占原生生产 8%
              以上；但实际授权和部署速度，取决于钢铁制造商是否会在传统生产成本平价被充分证明之前就采用。RMI 估计，在当前已承诺计划下，2030 年低排放钢需求仅为 6.7
              Mt/year，远低于结构性需求；这意味着，相对长期结构性机会，MOE 授权近期可服务需求可能有限。
