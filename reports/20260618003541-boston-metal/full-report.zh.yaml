      - number: '1.2'
        title: 创始人、领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的创始故事扎根 MIT 冶金研究，这给一家硬科技创业公司带来少见的科学血统。MIT News 和 Engine Ventures 均指向 Donald Sadoway、Antoine
              Allanore 和 James Yurko 这支创始技术团队；MOE 的商业可行性则来自惰性阳极化学相关工作及后续 MIT 授权。不过，当前运营叙事的重心已明显从原始创始人转向 CEO Tadeu
              Carneiro。Boston Metal 公开材料显示，Carneiro 在金属和矿业领域长期任职后于 2017 年加入，曾在 CBMM 担任领导职务；考虑到 Boston Metal
              正在扩展到铌和铬相邻的关键金属市场，这段背景高度相关。当前披露的领导班子还包括负责业务发展的 Adam Rauwerdink、负责科学领导的 Guillaume Lambotte、负责 Brazil 的
              Itamar Resende，以及负责公司职能的 Fernanda
              Fenga。薄弱处在治理细节：可获得材料没有提供完整董事会名单、委员会结构或所有权集中度。这不削弱团队的工业可信度，但意味着外部投资人看得到技术深度，却较难看清继任和控制权安排。
