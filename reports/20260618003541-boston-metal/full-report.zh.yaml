  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 全球钢铁市场规模与脱碳必然性
        blocks:
          - type: paragraph
            body: >-
              钢铁是工业文明的骨架，进入建筑、汽车制造、能源基础设施、机械设备和消费品。World Steel Association 数据显示，2024 年全球粗钢产量达到 18.85 亿吨，自 2020
              年以来大体稳定。China 仍是主导生产国，产量约 10.18 亿吨（占全球 54%），其后是 India 1.253 亿吨、Japan 8,920 万吨、United States 8,050 万吨。2024
              年全球钢铁表观消费量约 17.42 亿吨，对应新产品中人均钢铁使用量 214.7 kg。

              2024 年钢铁用途拆分显示，建筑和基础设施占全球需求 52%，机械设备 16%，汽车 12%，金属制品 10%，电气设备 5%，家用电器 3%，其他交通 2%。这个分布关系到 Boston Metal
              的市场命题：在具有约束力的 Scope 3 目标和监管暴露下，汽车 OEM 与基础设施客户最可能率先采用经认证的绿色或低排放钢。

              炼钢的碳强度让该行业成为工业脱碳政策的核心目标。World Steel Association 报告称，2023 年每吨粗钢浇铸平均排放 1.92 吨 CO2。Science Based Targets
              Initiative 估计，钢铁行业占全球温室气体总排放的 7-9%。传统高炉—转炉（BF-BOF）路线约占全球原生钢生产 70%，碳强度高，约为 2.0-2.3 t
              CO2/tonne。以废钢为基础的电弧炉（EAF）路线平均约为 0.70 t CO2/tonne（World Steel 2025），但受废钢可得性约束。World Steel Association
              的直接披露显示，DRI-EAF 平均 CO2 强度为 1.43 t/t，反映当前 DRI 路线仍以天然气 DRI 为主。

              Boston Metal 的 MOE 技术只用可再生电力从铁矿石生产铁，过程不引入任何碳，目标是把每吨 CO2 强度压到近零。这不同于氢 DRI 路线，因为它不需要氢基础设施、碳捕集或工艺用水。IEA Iron
              and Steel tracker 明确将 Molten Oxide Electrolysis 与 Low Temperature Electrolysis
              列为正在走向商业化、并可在本十年末起推动钢铁生产脱碳的技术，同时指出高价值金属已在 2023 年首次使用 MOE 实现商业化生产。

              全球钢铁市场的收入规模可观。按大约 $700-800/tonne（商品级）到 $900-1,200/tonne（高端板材）的平均实现价格测算，总市场年收入约为 $1.3-1.5
              trillion。经认证的高端绿色钢还叠加绿色溢价层；当前市场情报显示，已确认承购协议的溢价区间约为 €50-200/tonne，但这一溢价能维持多久仍有争议，并取决于碳价政策和竞争供给时间表。
