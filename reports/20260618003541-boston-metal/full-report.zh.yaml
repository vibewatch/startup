  - id: FP001
    title: 竞争定位图 — 商业化成熟度 vs. 脱碳深度
    type: quadrant
    layout: standard
    summary: >-
      将九个关键竞争者放在两条轴上：x 轴为商业化成熟度（1=实验室 / 概念，5=高级示范，9=已规模化完全商业），y 轴为核心炼铁流程脱碳深度（1=传统 BF-BOF，5=过渡 DRI，9=近零原生铁）。Boston Metal
      脱碳深度高，但商业化成熟度早，位置接近 Electra。Stegra 两条轴都更先进。Nucor Econiq 和 SSAB Zero 已完全商业化，但原生铁脱碳深度较低。传统 BF-BOF 已完全商业化，脱碳深度最低。
    data:
      xAxis: 商业化成熟度（1=概念 → 9=规模化）
      yAxis: 炼铁脱碳深度（1=BF-BOF → 9=近零）
      points:
        - id: boston_metal_moe
          label: Boston Metal（MOE Steel）
          x: 2
          'y': 9
          detail: 试点规模 1 t/次（2025 年 2 月）；示范工厂目标 2027 年；尚未签署商业授权。使用可再生电力可实现近零 CO2；不需要 H2 或 CCS。
        - id: stegra
          label: Stegra（H2 DRI-EAF）
          x: 7
          'y': 8
          detail: €7.9 B 融资到位；DRI 塔超过 100m（2026 年 3 月）；首批钢铁 2026–27 年；预售 1.5 Mt+。使用绿 H2 可近零；早期有天然气过渡。
        - id: hybrit_ssab
          label: SSAB / HYBRIT
          x: 6
          'y': 7
          detail: SSAB Zero 已商业化（废钢 + 可再生能源路线）；HYBRIT H2 储存 2025 年 2 月已验证；完整 H2-DRI 原生铁试点延至 2031 年。
        - id: arcelormittal
          label: ArcelorMittal（XCarb）
          x: 6
          'y': 4
          detail: XCarb 证书已商业化；Ghent 的 Midrex DRI 正在转型；BF-BOF 仍在全球占主导。多路线、渐进式脱碳路径。
        - id: electra
          label: Electra（电积）
          x: 3
          'y': 9
          detail: 已融资约 $264 M；计划 2026 年建成 500 t/yr 示范工厂；60°C 水相电积；99% 纯铁；矿石适应性 ≥35% Fe。
        - id: nucor_econiq
          label: Nucor（Econiq EAF）
          x: 9
          'y': 3
          detail: 完全商业化的净零认证钢；基于抵消（不是实体绿色原生铁）；美国市场份额 25%+。脱碳靠 RECs + 抵消，而非新型炼铁。
        - id: salzgitter_salcos
          label: Salzgitter SALCOS
          x: 4
          'y': 7
          detail: 目标 2026 年首批绿色铁水；德国最先进的国家级 DRI-H2 项目；规模小于 ArcelorMittal 或 thyssenkrupp。
        - id: thyssenkrupp_h2
          label: thyssenkrupp tkH2Steel 项目
          x: 4
          'y': 7
          detail: €2 B EU Innovation Fund 资助；Duisburg 2.5 Mt/year DRI 目标；财务重组带来交付风险。
        - id: bfbof_status_quo
          label: 传统 BF-BOF
          x: 9
          'y': 1
          detail: 已完全商业化；约占全球钢铁 70%；2.0–2.3 t CO2/t。在 CBAM（2026 年 1 月确定性阶段）和 EU ETS 下，碳成本暴露上升。
    approximationNotes: >-
      两条轴都是序数定性尺度；具体位置反映分析师基于公开证据的判断。Stegra 的 y 轴得分反映计划中的氢路线，早期有天然气过渡。Nucor Econiq
      的脱碳深度反映基于抵消的认证，而不是实体炼铁脱碳。ArcelorMittal 的成熟度反映其传统企业在商业钢铁中的规模，而不是其绿色转型项目本身的成熟度。
