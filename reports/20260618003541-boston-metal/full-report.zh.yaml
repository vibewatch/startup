  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: MOE 核心技术和电解槽化学
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的 Molten Oxide
              Electrolysis（MOE）是一条电化学炼铁路径，用单个电解槽替代传统炼钢中所有源自煤的步骤。铁矿石装入电解槽，与助熔氧化物混合形成熔融电解质，惰性阳极浸入熔体。当施加直流电且电解槽达到约 1,600°C
              时，电势会拆开溶解铁氧化物中的铁氧键：铁离子迁移到阴极，获得电子并积累为高纯液态金属，汇聚在底部后直接出铁进入钢包冶金。同时，氧离子在惰性阳极被氧化，并以纯 O₂
              气体释放。过程不产生二氧化碳、一氧化碳、工艺用水或危险化学品。

              相比传统高炉—碱性氧气炉（BF-BOF）路径，MOE 取消焦炭生产、铁矿烧结和球团、高炉冶炼、BOF 精炼，把一条五步高碳链条压缩成一个电解步骤。相比氢直接还原铁（H2-DRI），MOE
              不需要制氢、储氢或运氢基础设施。MOE 路径直接产出液态铁，而 H2-DRI 产出的是固态海绵铁中间体，仍需电弧炉处理。H2-DRI 还要求高品位球团矿（通常 >65% Fe），MOE
              则可处理中低品位铁矿，因为溶解杂质大多留在熔融电解质中，而不是污染产品。

              由于该过程完全靠电力运行，其碳强度完全取决于电力来源。使用可再生电力时，MOE 可实现近零 Scope 1 和 Scope 2 排放。MIT 教授 Donald Sadoway 从自己的 MIT
              电化学实验室共同创立 Boston Metal；他估计，商业规模下，该工艺每吨钢耗能会比传统高炉低约 20%。
