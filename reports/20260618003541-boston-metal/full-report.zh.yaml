        - 高
      - - 估值立场
        - 偏高
        - 已融资 >$500M，且有战略支持，但估值不透明，仍处收入前阶段
        - 不要因为使命叙事就假设价格便宜
        - 中
      - - 近期价值驱动
        - 关键金属重启
        - 最具体的收入和信誉路径
        - 未来 24 个月，对巴西的建模要比钢铁更严格
        - 高
      - - 终局上行
        - MOE Steel 许可
        - TAM 巨大；若跑通，最终商业模式有吸引力
        - 期权价值仍可观
        - 中
    notes: 本摘要只基于公开证据，不纳入私人股权结构表或优先权细节。
    claimRefs:
      - CV001
      - CV006
      - CV014
      - CV037
      - CV038
