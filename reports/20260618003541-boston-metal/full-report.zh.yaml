    title: 绿色钢铁市场需求估计 — 低 / 基准 / 高情景（2030 年 Mt/yr）
    type: range
    layout: standard
    summary: 到 2030 年全球绿色 / 近零排放钢铁需求的低、基准和高估计，均有来源支持，展示从已承诺买家项目到 NZE 情景要求的范围。
    data:
