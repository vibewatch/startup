  - id: TP004
    title: 护城河耐久性与竞争风险清单
    columns:
      - 护城河维度
      - Boston Metal 位置
      - 竞争对手威胁
      - 严重性
      - 尽调问题
    rows:
      - - 无氢、无 CCS 工艺路线
        - MOE 只需要可再生电力和铁矿石；消除 H2 基础设施风险
        - H-DRI 路线（Stegra、HYBRIT、AM、TK）需要绿色 H2 达到 $2/kg 门槛；目前尚未实现
        - 中（若 H2 成本下探快于预期，优势会收窄）
        - 在 $60/MWh 电价下，Boston Metal 测算的 MOE 铁成本相对 $2/kg H2 的 H-DRI 是多少？
      - - 全品位矿石原料灵活性
        - MOE 可处理低、中、高品位铁矿；H-DRI 需要 ≥67% Fe 球团
        - 高品位矿短缺长期制约 H-DRI；Electra 也有这一优势
        - 低（结构性优势；H-DRI 化学路径不做根本改变就无法适配）
        - MOE 是否已在多种矿石品位上通过商业化验证，还是只验证过选定试点原料？
      - - 模块化许可模式（降低钢企 capex 门槛）
        - 许可 + 阳极供应模式；钢企无需募集数十亿美元项目融资
        - Stegra / HYBRIT 要求钢企建设 DRI 设施，或从专用工厂采购钢材
        - 低-中（许可模式与 giga-plant 模式确有差异）
        - 是否已有钢企为 MOE Steel 签署许可条款清单或意向书？
      - - 战略投资者协同（ArcelorMittal、BMW、Tata Steel）
        - 战略投资者验证商业渠道，也可能成为首批许可方
        - 利益冲突：ArcelorMittal 拥有内部 DRI 项目，未必需要 MOE 许可
        - 中（投资者持股是期权，不是承诺；双路线投资者可能先选择 DRI）
        - ArcelorMittal 的投资条款是否绑定任何商业部署承诺或优先拒绝权？
      - - 双业务桥梁（关键金属收入为钢铁规模化供血）
        - 关键金属短期收入降低公司对钢铁许可时间表的依赖
        - CBMM 主导铌市场；2026 年巴西工厂挫折推迟关键金属收入
        - 高（巴西工厂 2026 年 9 月重启，是近期最重大的执行风险）
        - 重启后的产量爬坡时间表是什么？哪些收入里程碑依赖 2026 年产出？
      - - 惰性阳极 IP 与供应链
        - MOE 惰性阳极是专有技术部件；Outokumpu MOU 增加铬供应
        - 阳极耐久性和规模化，是 MOE Steel 尚未解决的首要工程挑战
        - 高（据 MIT TR 2025，多阳极、大电解槽尺度的阳极退化仍在测试）
        - 当前多阳极工业电解槽中，惰性阳极已证明的服役寿命是多少？
      - - OEM 客户关系（商业化前）
        - BMW 是战略投资者；Outokumpu MOU；Stegra 已锁定 BMW、Mercedes、Porsche、Volvo
        - Stegra 面向高端 OEM 的 1.5M+ t 预售订单，在 MOE 商业化前就压缩买方池
        - 高（买方 Scope 3 承诺时间点是主要锁定机制；对 Boston Metal 不利）
        - Boston Metal 与具名买家围绕 MOE Steel 的有效 LOI 或包销讨论有多少？
    notes: >-
      严重性评级（高 / 中 / 低）基于截至 2026 年 6 月的公开证据作定性判断，不包含 Boston Metal 内部文件或管理层访谈。 这份核心风险清单聚焦钢铁许可业务；关键金属业务还要单独面对 CBMM
      和传统冶炼厂等在位竞争。
