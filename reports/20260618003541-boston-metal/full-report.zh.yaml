            - 很高（BF 约 1,600°C + BOF 约 1,700°C）
        - label: 所需 H2 / 碳基础设施
          values:
            - 无；只需电力；无需 H2 生产、储存或运输
            - 需要大规模绿色 H2 生产和储存
            - 焦炉、炼焦煤供应、煤炭物流
        - label: 排放特征（使用绿色电力）
          values:
            - 近零 Scope 1+2 CO₂；副产纯 O₂
            - 近零 Scope 1+2 CO₂（使用绿色 H2）；副产 H₂O
            - 约 2 tCO₂/tSteel Scope 1；排放最高的路线
        - label: 商业成熟度（2026 年中）
          values:
            - 多阳极工业电解槽已验证；示范工厂尚未建成
            - 商业规模工厂运行中（HYBRIT，Stegra 规划中）
            - 完全商业化；约占全球粗钢 71%
        - label: 被替代的工艺步骤
          values:
            - 焦炭生产、烧结、造球、BF、BOF 全部取消
            - 替代 BF+BOF；仍需造球；仍需 EAF
            - N/A（参照情形）
        - label: 模块化扩展性
