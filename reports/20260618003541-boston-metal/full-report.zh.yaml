      - number: '8.3'
        title: 今天哪条业务线承载价值
        blocks:
          - type: paragraph
            body: >-
              公开证据现在清楚指向关键金属：这是短期价值载体。Boston Metal 自己说，关键金属是 MOE 平台近期最强的商业机会；MIT Technology Review 2026
              年的报道说得更直接：公司正靠关键金属活下去，并维持更大的叙事。这意味着估值不应把钢铁许可当作未来 24 个月的主驱动，即使钢铁仍是终局上行空间的主体。


              Brazil 工厂因此格外重要。如果 Brazil 重启并爬坡，Boston Metal 就能向市场证明，MOE 不只是从实验室走到中试的成功，而是一套可以变现的工业系统。如果 Brazil
              再次延误，估值就会失去连接科学成果与规模化盈利能力的桥。Weirton 和 Outokumpu 围绕铬、合金和工业循环性提供了有吸引力的期权价值，但这些路径仍早于 Brazil 关键金属这座桥。


              对投资人而言，关键信息是分清现值驱动和终值驱动。现值主要来自 Brazil 加融资韧性；终值来自 MOE Steel。
