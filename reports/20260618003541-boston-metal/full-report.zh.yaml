      - number: '5.5'
        title: 差异化、IP 和技术风险
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的差异化建立在四根支柱上：（1）专有惰性阳极合金，使 MOE 工艺可在无碳排下放大；（2）矿石品位灵活性，使 MOE 能接受不适合 H2-DRI
              球团化的中低品位矿石；（3）平台架构可应用于广泛金属氧化物，在钢铁授权成熟前，用关键金属带来多元化近期收入；（4）模块化并联电解槽设计，让钢企可增量增加产能，而不是一次性承诺十亿美元级高炉。

              IP 地位来自 MIT 授权专利，以及 Boston Metal 自己围绕惰性阳极成分和 MOE 电解槽设计提交的专利。公司公开表示，其核心 IP 在 MIT 获得专利并由公司独家授权。Cleantech
              Global Top-100 认定（截至 2026 年连续七年）和 TIME Best Inventions 2024 荣誉提供外部验证。Outokumpu MOU 专门锁定铬原料供应——这一战略依赖既把
              Outokumpu 绑定为伙伴，也降低阳极供应风险。

              关键技术风险包括：（a）满电流密度连续生产条件下的阳极服役寿命尚未发表，仍是商业尽调首要事项；（b）耐火材料工程，2026 年 1 月巴西事件已证明它是真实失效模式；（c）电力成本敏感性——Columbia
              University 研究人员估算，若全球 BF-BOF 转为 MOE，每年需要超过 5,000 TWh 电力，且电价必须实质下降，工艺才具成本竞争力；（d）从当前多阳极电解槽（~25 kA
              试点）到全商业电解槽（~600 kA 目标）的放大风险，电流提升 24 倍；（e）示范厂的多槽集成，这一里程碑尚未达成。开发者社区（Hacker
              News）指出，当前电解槽每月一到两吨产出，距离商品钢经济可行所需规模差几个数量级，示范厂是关键证明点。
