          - type: callout
            title: 关键金属收入预测假设加工经济性稳定
            body: >-
              Brazil 业务的近期收入取决于钽和铌价格稳定或回升，也取决于矿业废物流原料持续可得。钽价在 2023 年下跌 8-12%，市场在 2024 年恢复前表观消费量曾下降 65%。五氧化二钒价格 2024 年下跌
              27%。Boston Metal 最需要证明商业牵引力的阶段，这些周期性动态可能压缩关键金属利润率。
