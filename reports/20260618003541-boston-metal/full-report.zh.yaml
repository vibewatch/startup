      - number: '4.4'
        title: 单位经济性和成本结构
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 两个板块的单位经济性都未公开披露。MOE Critical Metals
              采用低品位矿渣（零成本或负成本投入，因为矿企需要付费储存）为原料，借助电力和碳阳极将其转化为铌、钽和锡铁合金。关键成本驱动包括电力（巴西电网，Minas Gerais 可再生电力占比约
              80–90%）、碳阳极消耗（Boston Metal 称其已在关键金属商业规模验证）、惰性耐火材料系统维护（正是 2026 年 1 月泄漏的部件）和劳动力。单位收入取决于产出组合：铌铁平均约
              $26/kg（USGS 2025），钽矿约 $170/kg Ta₂O₅ 当量（USGS 2025），锡约为 $25–$35/kg
              市场价。如果巴西工厂每年生产数十吨混合铁合金，按这些单价计算，年总收入会在低两位数百万美元区间——作为收入桥梁有用，但以当前规模自身并不具变革性。MOE Steel
              采用授权模式，一旦技术得到证明并完成授权，Boston Metal 交付收入的边际成本较低（主要是 IP
              维护、技术支持和阳极制造），授权模式毛利率会较高。不过，通向授权收入的路径要求在全尺寸示范厂证明技术，Woburn 2025 年试点运行（数周内产出一吨钢）尚未做到这一点。MIT Technology
              Review 引用的一篇 2022 年学术综述指出，电价需要显著下降，MOE 才能匹配传统炼钢经济性；Boston Metal 公开材料中尚未验证这一基准。任何板块都没有可获得来源发表独立技术经济分析。
