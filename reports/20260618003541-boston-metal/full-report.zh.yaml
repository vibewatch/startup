companyProfile:
  summary: >-
    Boston Metal 是一家位于 Massachusetts 州 Woburn 的工业脱碳公司，正在商业化 Molten Oxide Electrolysis（MOE，
    熔融氧化物电解）这一电气化冶金平台。该平台可在不使用煤的情况下生产钢铁，也能从低品位或废弃原料中回收关键金属。公司的钢铁叙事周期较长，主要靠授权驱动；Brazil
    子公司则以铌、钽、锡等高价值金属切入，提供更近的商业化楔子。Boston Metal 已经拼出该赛道最深的一批战略投资人，覆盖矿业、钢铁、气候科技和机构资本；但公司仍是私营状态，估值不透明，并且在 2026 年 Brazil
    运营受挫后，仍未在有意义的钢铁规模上进入商业化。
  foundedDate: '2013-01-01'
