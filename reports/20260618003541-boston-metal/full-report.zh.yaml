      - number: '7.4'
        title: 伙伴集中、人员和治理风险
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的伙伴版图纸面上很亮眼，但结构上有风险。几个相同名字同时充当投资者、验证者、潜在客户和供应链对手方。ArcelorMittal 最终可能成为钢铁授权客户；Outokumpu
              可能同时成为铬材料伙伴和运营测试场；Vale 和 BHP 把公司接入采矿路径。这些关系有价值，但也让真正的拉动需求与战略选择权更难区分。大型工业公司可以在财务上支持 Boston
              Metal，同时如果内部替代路径看起来更好，也能推迟作出有约束力的商业决定。


              人员风险也遵循同一模式。Tadeu Carneiro
              显然是强资产：他的冶金和采矿背景契合公司的工业使命，他也是融资、政策互动和外部可信度的核心。但核心性本身就是风险。已审阅公开记录没有披露深入的继任计划、完整董事会架构或广泛授权的运营权责。裁员后这一点更重要，因为裁员会压缩人才厚度，而公司正是在这时需要有韧性的执行。


              结果是，这家企业最强的关系也可能成为单点故障。核心担忧不是对手方敌意，而是对手方保留选择权。
