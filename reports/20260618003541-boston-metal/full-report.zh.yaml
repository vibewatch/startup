      - number: '3.2'
        title: 直接竞争者——绿色 H2 DRI 先行者与电解铁同行
        blocks:
          - type: paragraph
            body: >-
              Stegra 是绿色钢铁板块最强的商业化阶段竞争者。公司 2021 年以 H2 Green Steel 名义成立，2024 年 9 月更名为 Stegra，目前正在 Sweden 北部 Boden
              建设一座完全一体化绿色钢厂，使用绿色氢直接还原 LKAB 铁矿球团，随后进入电弧炉炼钢。到 2026 年中期的建设里程碑显示其执行很快：最后一个电解槽模块于 2026 年 4 月安装，DRI 塔在 2026 年
              3 月突破 100 米，公司也在 2026 年 4 月原则上达成 €1.4 billion 额外融资，使已锁定总融资超过 €7.9 billion。预售量超过 150 万吨，承诺方包括
              Porsche、IKEA、Mercedes-Benz、Scania、Volvo Group、ZF Group、Microsoft 和 thyssenkrupp Materials
              Services。这本预售订单直接压缩了 Boston Metal 的 MOE Steel 授权模式商业化前可触达的买方池，因为有约束性脱碳时间表的钢铁买方正在签供货协议，而不是等待多种技术选项。Stegra
              的结构性弱点是氢经济性：工厂成本竞争力依赖由瑞典水电支撑电网供电的大规模绿色氢生产；如果绿色 H2 成本到 2020 年代末不能降向 $2/kg 门槛，其经济性仍会依赖溢价。

              SSAB 的 HYBRIT 合资项目（与 LKAB 和 Vattenfall）是验证最充分的氢 DRI 概念证明。HYBRIT 于 2025 年 2 月证明了衬砌岩洞内大规模无化石氢储存，移除了 H-DRI
              路线的关键技术风险，并获得 Ny Teknik Grand Prize for Engineering 2025 in Sustainability。HYBRIT 的氢储存试点项目已完成并向 Swedish
              Energy Agency 报告，确认其可用于工业规模无化石铁钢生产。SSAB 已商业销售的 SSAB Zero 产品——当前基于既有废钢加无化石能源路径，而不是完整 HYBRIT H-DRI
              原生铁——已经产生收入，并在 2026 年 1 月与 Rheinmetall 签署意向书，为国防制造供应无化石钢。对 Boston Metal 的战略含义是，SSAB 今天既有商业产品，也有通过 HYBRIT
              实现原生铁完全脱碳的技术路线图；它在客户关系建设上拥有多年商业领先。

              从工艺理念看，Electra 是最接近 Boston Metal 的技术同行——都用电力而不是氢从矿石还原铁——但机理完全不同。Electra 的水溶液电积工艺在约 60°C 稀酸中溶解铁矿石，并从溶液中电沉积
              99% 纯度铁；它在室温附近运行，而不是 Boston Metal 的 1,600°C 熔融电解质。相对 MOE，Electra 的结构性优势包括矿石品位适应性（≥35% Fe，而 BF-BOF 通常要求
              ≥62–65%，H-DRI 要求 ≥67%）、更低工艺温度（电解槽层面单吨能耗更低），以及已证明的 99% 清洁铁纯度，高于生铁和 DRI 规格。Electra 的限制包括仍处商业化前、融资基础较小（约
              $264M，对比 Boston Metal >$500M），以及商业模式要求 EAF 钢厂采用新的原料规格，而不是向既有一体化生产商授权技术。截至 2026 年中，Electra 和 Boston Metal
              在商业化就绪度上都明显落后于 Stegra。
