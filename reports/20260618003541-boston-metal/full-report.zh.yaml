  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户版图和商业阶段
        blocks:
          - type: paragraph
            body: >-
              Boston Metal
              还不像一家传统收入阶段工业供应商：它没有披露付费账户清单。公开记录呈现的是两条成熟度不同的客户动作。钢铁动作瞄准现有钢厂和大型工业买方，这些客户需要一条不依赖氢基础设施或碳捕集的原生钢脱碳路径。Boston
              Metal 自身 MOE Steel 材料把产品描述为可供钢企部署的技术平台，这意味着授权和设备关系，而不是 Boston Metal 用自己的资产负债表直接卖钢。


              更近期的动作在关键金属。Boston Metal 的 FAQ、MOE Critical Metals
              页面和巴西材料都强调矿业和冶金客户，希望把废物流或低品位原料货币化。这个定位很重要，因为第一个商业证明点不是汽车或建筑钢需求，而是从矿渣和工业残渣中回收高价值金属。换句话说，公司正在用一个价值更高、体量更小的客户楔子，去资助一个更大但更远期的钢铁机会。


              这种分拆解释了为什么公开管线看起来战略资源丰富，但商业上仍早期。Boston Metal
              有多个工业对手方，但大多数仍是投资者、联合开发伙伴、政府资助方或未来采用者，而不是已披露的经常性客户。因此，本章把客户牵引视为关系证明和商业化排序，而不是收入证明。
