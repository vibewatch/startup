  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和业务组合
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 在同一个 Molten Oxide Electrolysis（MOE）平台下，运营两种结构不同的收入模式。近期模式是巴西子公司（Boston Metal do
              Brasil）的直接产品销售：Coronel Xavier Chaves 工厂处理低品位矿渣，提取铌、钽和锡，并以铁合金形式卖给金属买方。该厂用 18 个月建成，原本瞄准 2024–2025 年商业化启动，但
              2026 年 1 月发生耐火材料系统泄漏，引发电解质外泄；没有人员受伤，却造成重大排期重置，并错失一个与里程碑挂钩的融资承诺。CEO Tadeu Carneiro 公开表示，该设施将在 2026 年 9
              月重启。该板块是唯一的近期收入路径，也对证明 MOE 技术可在商业规模运行至关重要。钢铁的长期收入模式则明确是技术授权和惰性阳极制造业务：Boston Metal 的 MOE Steel
              页面清楚写明，“Boston Metal 不会生产钢铁”。相反，钢企将支付授权费，并购买 Boston Metal 的专有金属惰性阳极；后者是 MOE Steel
              电解槽的关键耗材。第三个萌芽收入机会是西弗吉尼亚州 Weirton 铬工厂，Boston Metal 获得 $50M DOE 拨款，用 MOE 部署美国本土铬金属生产；项目总投资约
              $161M。不同板块的收入质量不同：关键金属销售是暴露于市场价格的商品型铁合金，钢铁授权则是轻资产、高利润率模式，但取决于钢企采用。任何板块都没有公开披露标价、合同金额、照付不议承诺或已实现收入数字。
