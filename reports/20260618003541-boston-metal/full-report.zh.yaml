        title: 资本基础、投资人阵容与战略验证
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的融资历史是本案最强的客观信号之一。公司材料称，截至 2024 年 1 月已融资超过 3.70 亿美元，截至 2026 年 4-5 月超过 5 亿美元；仅 2023 年 Series C
              完成融资就达到 2.62 亿美元。投资人基础的亮点不只在规模，也在构成。BMW 2021 年参投，把 Boston Metal 直接连接到一个有明确钢铁供应链脱碳目标的汽车买方。IFC
              的股权投资则引入一家发展金融机构，其项目理由同时覆盖美国和 Brazil 的规模化。Microsoft 的 Climate Innovation Fund 将 Boston Metal
              列入承诺投资组合，Boston Metal 自己披露的投资人名单也包括钢铁厂、矿商、气候
              VC、财务投资人和工业企业。这种广度降低了单一投资人集中风险，也让公司在上游矿业、中游金属和下游买方之间获得渠道验证。主要缺失事实是估值：可获得公开材料均未披露当前投后估值或各投资人的持股拆分，因此很难精确比较
              Boston Metal 的私人市场定价与同行水平。
