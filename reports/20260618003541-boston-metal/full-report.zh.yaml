    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营版图
        blocks:
          - type: paragraph
            body: >-
              更准确地说，Boston Metal 不是单一产品创业公司，而是一家工业脱碳平台公司。公司官方材料持续强调一个电气化的 Molten Oxide Electrolysis
              平台，可横跨钢铁和关键金属两条线：Massachusetts 州 Woburn 是公司总部和钢铁中试枢纽，Minas Gerais，Brazil
              则是关键金属线的首个商业部署地点。这个双资产版图很关键，因为它解释了公司为何同时拥有一个长期绿色钢铁命题，以及一条由高价值金属支撑的更近收入桥。公司的身份叙事也少见地把系统级野心说得很明白：Boston
              Metal
              推的不是一个赚绿色溢价的小众产品，而是一个模块化替代方案，试图替换传统冶金中多个高碳环节。公司因此反复强调原料适应性、国内供应链韧性，以及处理现有企业视为废弃物材料的能力。身份故事里最清楚的未解点是时间线。IFC
              称公司在 2012 年基于 MIT 授权 IP 成立，而 Boston Metal 自身 FAQ 称创立于 2013 年；最合理的读法是，2012 年对应技术 / 公司形成，2013 年对应正式运营启动。
