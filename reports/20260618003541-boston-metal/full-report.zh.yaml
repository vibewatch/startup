        title: 财务缺口和尽调结论
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的财务图景存在大量重大缺口，单靠公开来源无法承销。现金余额和月度烧钱从未公开披露；巴西事故是烧钱率脆弱性的最清晰信号。收入——包括任何关于 2025 年或 2026 年 $119M
              的分析师估计——在可获得公开来源中完全缺乏支撑；没有已确认销售、价格、销量或客户合同披露到足以计算收入的具体程度。$51M
              可转债条款（投资者、利息、期限、转换机制）不见于任何可供公开研究的新闻稿或监管文件。关键金属或钢铁授权板块的毛利率未披露。全尺寸 MOE Steel 示范厂的资本强度未公开预测。2026
              年融资的投后估值未披露。Weirton 铬项目预算（总计 $161M，DOE
              $50M）没有公布时间线、阶段门支出计划或铬产品收入模型。正面财务信号包括投资财团的多元性和战略深度（矿企、钢企、气候导向机构基金、开发金融机构）、非稀释 DOE
              拨款，以及巴西事故后的快速资本动员——这些都显示投资者信念仍在。负面财务信号则是事故触发的现金紧张、错失里程碑、2026 年 4
              月裁员、收入启动延迟、不透明的可转债，以及钢铁授权收入的长时间线。尽调至少需要拿到：当前现金头寸和各板块月度烧钱、完整可转债条款清单、巴西工厂收入模型（销量、产品组合、承购定价），以及 MOE Steel
              示范厂资本开支计划。
