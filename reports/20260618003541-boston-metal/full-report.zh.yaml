  - id: FR002
    title: 风险传导图——运营冲击如何传导到融资和估值
    type: dag
    layout: wide
    summary: 展示从技术故障，到里程碑丢失、裁员、客户验证延迟以及融资条款变弱的链条。
    data:
      nodes:
        - id: tech
          label: 技术故障
          detail: 首套同类 MOE 系统中的耐火材料、阳极、电力或质量问题。
        - id: ops
          label: 工厂停产 / 产出不达标
          detail: 工业运营暂停，或未达到里程碑产量。
        - id: finance
          label: 里程碑绑定融资受扰
          detail: 里程碑滑期时，已承诺资本延迟到账或被扣留。
        - id: people
          label: 裁员 / 团队收缩
          detail: 保现金动作削弱执行能力。
        - id: customers
          label: 客户验证延迟
          detail: 面向钢企、矿商和承购交易对手的运营证据减少。
        - id: valuation
          label: 估值支撑下降
          detail: 稀释更高、谈判筹码更弱，下行情形更严苛。
      edges:
        - from: tech
          to: ops
          label: 导致
        - from: ops
          to: finance
          label: 错失里程碑
        - from: finance
          to: people
          label: 迫使削减现金支出
        - from: people
          to: customers
          label: 拖慢执行
        - from: customers
          to: valuation
          label: 削弱信心
        - from: finance
          to: valuation
          label: 抬高稀释风险
    approximationNotes: null
    claimRefs:
      - CR002
      - CR003
      - CR025
      - CR033
      - CR042
  - id: FR003
    title: 依赖图谱——承担最多残余风险的交易对手与司法辖区
    type: dag
    layout: wide
    summary: 映射公司对巴西运营、美国项目支持和战略工业交易对手的依赖。
    data:
      nodes:
        - id: brazil
          label: 巴西工厂
          detail: 首个商业桥梁，也是近期最高的运营依赖。
        - id: woburn
          label: Woburn 团队
          detail: 核心钢铁研发和示范路径的支撑基地。
        - id: doe
          label: DOE / Weirton
          detail: 政策支持的铬路径，也是未来美国制造相邻业务。
        - id: ifc
          label: IFC 框架
          detail: 带有 ESG 预期的巴西商业化支持。
        - id: arcelor
          label: ArcelorMittal
          detail: 投资方、战略验证方，也是潜在钢铁客户。
        - id: outokumpu
          label: Outokumpu
          detail: 铬材料和工业循环合作伙伴。
        - id: capital
          label: 私募资本市场
          detail: 商业化尚未完成时的现金跑道来源。
      edges:
        - from: brazil
          to: capital
          label: 重启可信度
        - from: woburn
          to: brazil
          label: 技术支持
        - from: doe
          to: capital
          label: 政策信号
        - from: ifc
          to: brazil
          label: 项目监督
        - from: arcelor
          to: capital
          label: 战略验证
        - from: outokumpu
          to: brazil
          label: 材料 / 测试连接
        - from: capital
          to: woburn
          label: 资助人员配置
    approximationNotes: null
    claimRefs:
      - CR023
      - CR024
      - CR031
      - CR034
      - CR035
      - CR037
  - id: FV001
    title: 推荐逻辑——为什么当前立场是跟踪，而不是买入
    type: flow
    layout: wide
    summary: 把市场规模、技术潜力和投资方质量，与相反方向的执行和估值风险连接起来，解释为什么立场仍需谨慎。
    data:
      nodes:
        - id: tam
          label: 钢铁和关键金属上行空间巨大
          detail: 可服务市场庞大，脱碳需求可信。
        - id: proof
          label: 技术验证真实存在
          detail: 钢铁中试里程碑、战略投资方和巴西商业桥梁均已存在。
        - id: risk
          label: 执行和融资阴影
          detail: 巴西事故、条款不透明、没有钢铁客户合同。
        - id: track
          label: 跟踪立场
          detail: 上行空间值得关注，但证据尚不足以支持激进入场。
    approximationNotes: null
    claimRefs:
      - CV001
      - CV014
      - CV020
      - CV037
      - CV042
  - id: FV002
    title: 估值敏感性——当下最重要的驱动因素
    type: bar
    layout: standard
    summary: 对最可能影响 Boston Metal 当前私募市场价值的变量排序。
    data:
      items:
        - label: 巴西重启与产出稳定性
          value: 10
          detail: 近期主导变量，因为它检验收入桥梁。
        - label: 融资条款 / 稀释
          value: 9
          detail: 不透明的轮次结构可能显著撬动经济价值。
        - label: 钢铁示范与客户信号
          value: 8
          detail: 对长期溢价最重要的杠杆。
        - label: 电力成本竞争力
          value: 7
          detail: 对未来单位经济性有实质影响。
        - label: Weirton 战略价值
          value: 5
          detail: 带来有用的期权价值，但眼下居次。
    approximationNotes: 数值是 1 到 10 的序数敏感性分数，不是百分比。
    claimRefs:
      - CV007
      - CV014
      - CV016
      - CV019
      - CV023
      - CV031
  - id: FV003
    title: 估值 / 回报区间——牛市、基准和熊市结果框架
    type: range
    layout: standard
    summary: 用粗略隐含估值区间展示 Boston Metal 的账面估值会如何随执行和融资质量变化。
    data:
      items:
        - label: 熊市
          low: 250
          mid: 500
          high: 750
          detail: 反映进一步延误、惩罚性融资，以及市场对桥梁策略信心下降。
        - label: 基准
          low: 600
          mid: 900
          high: 1200
          detail: 假设巴西重启，钢铁仍是长期但完整的期权。
        - label: 牛市
          low: 1100
          mid: 1400
          high: 1800
          detail: 假设重启顺利、客户验证改善，且钢铁示范路径可信。
    approximationNotes: 区间是基于融资规模锚点和战略溢价判断的美元百万级情景估算，不是经审计的市场标记。
    claimRefs:
      - CV008
      - CV009
      - CV034
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI——截至 2026 年 6 月的 Boston Metal 评分卡
    type: kpi
    layout: standard
    summary: 概括投资委员会在承销后期私募气候工业轮次前，可能打分的维度。
    data:
      items:
        - label: 市场规模
          value: 9/10
          note: 钢铁和战略材料市场足够大，能支撑风险投资级上行空间。
        - label: 技术验证
          value: 7/10
          note: 钢铁中试里程碑和真实专利已经存在，但商业耐久性仍未验证。
        - label: 商业验证
          value: 4/10
          note: 战略关系很强；营收和合同证据偏弱。
        - label: 融资韧性
          value: 5/10
          note: 股东结构很强，但 2026 年事件暴露了里程碑挂钩资本的脆弱性。
        - label: 估值透明度
          value: 3/10
          note: 当前投后估值和交易结构未公开披露。
        - label: 仅凭公开材料的整体可投资性
          value: 6/10
          note: 值得密切跟踪，但仅凭公开证据，还不是高确信买入标的。
    approximationNotes: 评分是分析师基于公开证据综合形成的判断；如果能拿到私有数据，应改用 IC 专属评分框架。
    claimRefs:
      - CV021
      - CV030
      - CV032
      - CV037
      - CV038
      - CV042
      - CV044
      - CV045
