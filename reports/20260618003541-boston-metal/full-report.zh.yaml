              里程碑记录显示，公司正用关键金属作为通向更大钢铁机会的执行桥。钢铁侧，Boston Metal 称其在 2025 年于 Woburn 投运了一个多惰性阳极工业电解槽；MIT Technology Review
              报道，公司最大规模中试曾生产约一吨钢。商业化侧，公司 2024 年事实表仍将 2026 年设定为 MOE Steel 的预期商业部署节点，而 2026
