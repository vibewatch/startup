        title: 负面证据、矛盾与待查事项
        blocks:
          - type: paragraph
            body: >-
              当前记录中的主要负面证据不是需求，而是执行。MIT Technology Review 报道，Brazil 工厂的耐火系统在 2026
              年初发生泄漏，推迟启动，导致公司错过融资里程碑，并加剧了现金流压力；随后公司在 2026 年 4 月裁员 71 人。管理层告诉该媒体，工厂应在 2026 年 9 月重启，但这仍意味着 Boston Metal
              在更依赖关键金属收入作为全面钢铁商业化桥梁的时点，出现了一个可见的排期重置。还有一些较软但仍重要的信息缺口。公开资料无法干净对齐员工数：2024 年事实表称员工 300 多人，而 2026 年 FAQ 称超过
              250 人；这与裁员方向一致，但不足以支撑运营模型。公开材料也缺少估值、完整董事会名单和详细股权表。合在一起，本章支持这样一个判断：Boston Metal
              是一家技术可信、融资充足的成长期公司；近期最大问题在执行节奏和透明度，而不是科学正当性。
