      - number: '4.2'
        title: 融资形成与资金时间线
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 的资本历史横跨八年，持续获得机构支持。公司 2018 年完成 $25M Series A，获得 Breakthrough Energy Ventures 的早期背书。2021 年 1
              月完成 $50M Series B，战略采矿投资者包括 Vale；2021 年 7 月 BMW i Ventures 加入超额认购收尾后，该轮扩大到 $60M，显示汽车买方的直接兴趣。标志性的 Series C
              分多批筹集 $262M：2023 年 1 月由 ArcelorMittal XCarb 和 Microsoft Climate Innovation Fund 领投，首关约 ~$120M；2023 年 5–6 月
              IFC 签署最高 $20M 的股权投资；2023 年 9 月由 Aramco Ventures 领投、M&G Investments、Goehring & Rozencwajg 和 Baillie Gifford
              参与，再增加 $122M。2024 年 1 月 Marunouchi Innovation Partners 跟进 $20M Series C2，使公开累计股权融资达到约 $357M，截至 2024 年 1
              月披露总资本为 $370M。2025 年，公司在 Woburn 投运首个多惰性阳极工业 MOE 电解槽，并筹集 $51M 可转债；投资者和票据条款未公开。2026 年 5 月 $75M 股权融资包括 Tata
              Steel Limited 和现有投资者，CEO 将其描述为巴西事故后的危机支持资金；这使总融资额超过 $500M。除股权和可转债外，Boston Metal 还获得 Weirton 铬项目的 $50M DOE
              拨款，使已披露完整资本栈（股权轮 + 票据 + 拨款）约为 $608M——DOE 拨款不稀释股权，但限定用于项目。
