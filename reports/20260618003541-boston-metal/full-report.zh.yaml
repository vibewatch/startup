  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 流程 / 组件
      - 作用
      - 依赖
      - 风险
    rows:
      - - AC 到 DC 电力转换
        - 将电网 AC 转成电解所需 DC；完整电解槽目标约 600 kA
        - 电网可靠性；整流器资本开支和维护
        - 电能质量和正常运行时间直接影响阳极稳定性和产品收率
      - - 惰性阳极（Fe-Cr 合金）
        - 将电流导入熔体；必须在 1,600°C 下连续抗氧化
        - 铬原料供应（Outokumpu Kemi 矿山 MOU）；合金制造
        - 生产条件下的阳极寿命是尚未解决的关键技术风险
      - - 熔融氧化物电解质
        - 溶解铁矿石和其他氧化物；传导离子；维持电解槽温度
        - 铁矿石原料（多种品位）；电解质化学控制
        - 电解质组成漂移会影响纯度和效率；必须严控
      - - 耐火系统（电解槽内衬）
        - 隔热，并保护容器壁免受 1,600°C 熔体和电化学侵蚀
        - 高等级耐火材料；有经验的施工和维护
        - 巴西耐火材料失效（2026 年 1 月）说明这是现实失效模式；存在工程风险
      - - 阴极 / 容器（钢）
        - 在电解槽底部收集液态铁；承担结构性包容
        - 钢制容器制造；出铁所需液态金属处理设备
        - 工业规模下的热管理和出铁物流尚未充分验证
      - - 过程控制和自动化
        - 调节槽电位、电流分布、电解质化学和温度
        - 传感器、控制系统、工程能力
        - 对延长阳极寿命至关重要；Lambotte 指出，建模 / 仿真是放大的必要条件
      - - 多电解槽工厂集成
        - 多个电解槽并联排列，达到工厂级吞吐量
        - 土建、电气母线系统、电解槽间一致性
        - 尚未验证；示范厂是首个计划中的多电解槽系统
      - - 氧气处理和利用
        - 捕集并利用 / 排放纯 O₂ 副产物；可能带来副产品收入
        - O₂ 压缩、储存或分配基础设施
        - O₂ 变现路径尚未公开说明；可能涉及安全 / 成本项
    notes: 架构根据公开来源重建；电流密度、电解质配方、电解槽几何形状等工程参数属于专有信息。
