            title: Stegra 已预售 1.5M+ 吨，是最不利的竞争信号
            body: >-
              在 Boston Metal 的 MOE Steel 产品商业化前，Stegra 已获得 BMW 同业买方的承诺采购——Porsche、Mercedes-Benz、Scania、Volvo Group、IKEA
              和 Microsoft。这些买方都有公开 Scope 3 减碳期限，一旦锁定供应量，不太可能重新招标同一批供应。Boston Metal 要么瞄准非 Stegra
