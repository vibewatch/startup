      - number: '8.2'
        title: 市场上行空间与久期风险
        blocks:
          - type: paragraph
            body: >-
              长期机会无疑很大。CNBC 将钢铁描述为约 $1.6T 的行业，worldsteel 数据也说明这种材料对全球经济有多核心。Boston Metal
              的核心主张不是小众材料升级，而是可能替代地球上碳强度最高的工业流程之一。如果公司能把一条以许可为主、依赖电力、同时避开炼焦煤和氢基础设施的路线商业化，上行空间巨大。


              问题在于久期。Columbia 关于低碳铁钢的研究强调，每条脱碳路线都嵌着资本强度和电力敏感性。Boston Metal
              的终局架构也许比部分替代方案更优雅，但优雅的终局并不会省掉多年工程验证和客户采用。也因此，市场故事支撑的是高期权价值，而不是自动获得溢价定价。


              从估值看，Boston Metal 同时拥有巨大的 TAM 和很长的兑现风险。梦想越大，时间判断错误和资本失误就越应该被重折现。
            claimRefs:
              - CV012
              - CV013
