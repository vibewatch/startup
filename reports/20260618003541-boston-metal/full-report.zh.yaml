      - number: '2.3'
        title: 关键金属市场——铌、钽、锡和钒
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 位于 Minas Gerais 的 Brazil 子公司是 MOE
              平台的首个商业部署，聚焦铌、钽、锡铁合金，并可能增加钒产出。这些关键金属市场具备结构性吸引力：供应集中风险高，United States 100% 依赖进口，且 US 政府和 EU Critical Raw
              Materials Act 正在强化战略指定。

              铌主要以铌铁形式用于汽车、结构件和管线领域的高强度低合金（HSLA）钢，也用于航空航天高温合金添加。2024 年全球矿山产量约为 83,000 吨（铌含量），较 2023 年略降。Brazil
              主导全球供应，约占世界产量 90%，Canada 约占 8%。United States 没有国内铌矿产量，100% 依赖进口，其中 66% 的 US 进口来自 Brazil。USGS 估计 2024 年 US
              铌进口价值为 4.40 亿美元。全球储量超过 1,700 万吨，集中在 Brazil 碳酸岩矿床。2024 年铌铁平均价格约为 $26/kg，与 2023 年 $25/kg 相比稳定。

              钽对电子电容器、航空航天高温合金和高耐腐蚀应用至关重要。2024 年全球矿山产量约为 2,100 吨（钽含量），主要贡献者包括 Congo（Kinshasa）约 880 t、Nigeria 390
              t、Rwanda 350 t、Brazil 210 t。United States 100% 依赖进口，自 1959 年以来没有国内矿山产量。2024 年 US 表观消费量估计为 770 吨，较低迷的 2023
              年水平增长 75%，原因是消费电子和数据中心需求恢复。USGS 估算 2024 年 US 钽进口价值超过 2.30 亿美元。2024 年钽铁矿平均价格约为 $170/kg Ta2O5。

              锡存在于 Boston Metal Brazil 的原料中，提取锡也是生产流程的一部分。Boston Metal 公司材料显示，全球锡需求每年超过 400,000 吨。USGS Mineral Commodity
              Summaries 2025 数据显示，全球锡矿产量约为 300,000+ 吨；2024 年 US 精炼锡表观消费量约 37,000 吨，进口依赖度为 73%。2024 年 New York
              经销商精炼锡均价约为每磅 1,400 美分（$30.9/kg），全球约一半锡产量用于电子和半导体焊接。锡已列入 EU Critical Raw Materials 名单。

              钒主要用作钢铁合金剂（占国内消费 >90%），并越来越多用于电网级储能的钒氧化还原液流电池（VRFB）。2024 年全球矿山产量约为 100,000 吨（钒含量），China 供应约 70%，Russia 和
              South Africa 贡献大部分余量。Brazil 2024 年产量约为 5,000 吨。USGS 预计，到 2033 年 VRFB 市场将占钒消费约 17%，而 2021 年仅为 3%。2024
              年中国五氧化二钒均价为 $5.45/lb，低于 2023 年的 $7.50，原因是中国生产商供给过剩。

              Boston Metal 的 MOE 平台瞄准从矿业和工业废物流中回收铌、钽、钒和镍；这些原料用传统方法处理往往不经济。2024 年 US 镍矿产量为 8,000 吨，来自 Michigan 的 Eagle
              Mine；LME 现货均价约为 $17,000/tonne。镍在不锈钢和合金钢中的用途占国内消费 85% 以上。MOE
              的关键金属路径不是开新矿，而是从废物流中提取价值；面对低品位或复杂原料，这相对现有方法具备结构性成本和环境优势。
