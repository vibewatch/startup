      - number: '2.2'
        title: 绿色钢铁需求驱动与监管环境
        blocks:
          - type: paragraph
            body: >-
              三股力量正在共同激活近零 CO2 原生钢需求：传统钢铁生产商和进口商承担的监管合规成本，钢铁消费型 OEM 与零售商的企业 Scope 3 排放义务，以及包括 Boston Metal MOE
              在内的合格生产技术逐步成熟。

              EU Carbon Border Adjustment Mechanism（CBAM）于 2023 年 10 月进入过渡期，并将在 2026 年 1 月 1 日转入正式阶段。在正式制度下，EU 钢铁进口商必须按
              EU ETS 拍卖价，为每吨内含 CO2 持有 CBAM 证书。若 EU ETS 价格约为 €60-85/tonne，内含约 2 tCO2/tonne 的传统钢铁将产生约 €120-170/tonne 进口钢的
              CBAM 合规成本；这是一项足以改变低排放本土生产竞争测算的成本抬升。European Commission 确认，钢铁和铁仍被纳入 CBAM 正式阶段，50 吨门槛会触发申报人授权要求。

              EU Emissions Trading System 同时在逐步削减钢铁生产商的免费配额：IEA 报告称，修订后的 ETS 指令将使钢铁免费 ETS 配额在 2034-2035
              年结束，轨迹会让绿色生产逐步更具成本竞争力。2024 年碳价在 €60-85/tonne 区间。EU 单一市场 Critical Raw Materials 页面确认，铌和钽被列入 2023 年 EU 34 种
              Critical Raw Materials 名单，在气候驱动之外又增加了战略供应链理由。

              企业可持续承诺强化了监管拉力。BMW Group 发布的可持续计划承诺降低 Scope 3 供应链排放，钢铁采购正是其中碳强度最高的投入之一。Science Based Targets Initiative
              钢铁行业指南指出，根据 CDP 分析，如果全球钢铁行业不脱碳，到 2040 年钢铁公司的潜在价值可能有 14% 面临风险，凸显钢铁买方采购认证绿色产品的财务激励。RMI 估计，在当前已承诺买方计划下，到 2030
              年低排放钢需求将达到约 6.7 Mt/year。

              IEA 的 Net Zero by 2050 情景要求钢铁行业到 2030 年将 CO2 排放强度削减约四分之一，并让电解和氢 DRI 路线生产的近零排放钢占原生钢产量 8% 以上。IEA 认为，到 2030
              年还需要约 30 个规模类似当前已宣布项目的额外商业项目，才能填补 NZE 缺口；如果 Boston Metal 能及时达到商业就绪，这会形成一条授权管线机会。

              US Inflation Reduction Act（IRA）以 58 亿美元工业脱碳预算在 North America 创建了平行激励。IEA 指出，IRA 预计将推动氢和 CCUS 项目开发；Boston
              Metal 的电力驱动 MOE 路线不需要氢基础设施，可能也能触达 IRA 清洁制造条款。

              ResponsibleSteel 的 International Production Standard V2.1.1（2024 年 10 月发布）纳入了修订后的钢铁制造商 GHG 排放要求，汽车 OEM
              采购计划也越来越多要求认证。Boston Metal 的授权模式意味着，在被授权方工厂用 MOE 电解槽生产的钢，需要通过 ResponsibleSteel 等标准认证，买方才能申报 Scope 3
              减排信用；这是 Boston Metal 及其被授权方必须处理的价值链合规摩擦。
