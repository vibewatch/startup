      - number: '5.4'
        title: 技术里程碑和发展路线图
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 用十三年完成了一条系统性的从实验室到工业规模放大的路径。MOE 化学在 2010 年代于 MIT 的咖啡杯大小电解槽中得到证明，关键阳极材料约在 2012 年被识别。联合创始人
              Allanore 和 Sadoway 在 2013 年 Nature 论文中正式描述 MOE 平台。公司于 2012–2013 年成立，并在 2014 年运行首个半工业 MOE
              电解槽。研究随后推进到越来越大的容器；到 2021 年，公司在 Woburn 设施运行三条试点线。

              2025 年最重要的里程碑，是 Woburn 多惰性阳极工业 MOE 电解槽投运。2025 年 2 月 17 日，团队虹吸出超过一吨液态钢——多阳极设计首次产出有意义的吨位。CEO Tadeu Carneiro
              宣称：“我现在可以说，吨位级钢铁正在从我们的多惰性阳极 MOE 电解槽流出。” Boston Metal 将其定义为技术风险下降，并验证通往多槽工厂的路径。

              下一项计划里程碑是一座明显大于 Woburn 设施的示范厂——首个大到无法放进现有建筑的系统。SVP Rauwerdink 2025 年 3 月表示，该示范厂将日产约一到两吨（当前电解槽为每月一到两吨），目标为
              2026 年底投运、2027 年开始运行。再往后，商业路径要求与成熟钢企签署授权协议，由各钢企在现有设施部署电解槽阵列。截至 2026 年 6 月，尚无与钢企签署的授权合同公开宣布。
