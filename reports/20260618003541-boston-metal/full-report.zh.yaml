      - number: '3.3'
        title: 现有企业改造者、EAF 替代方案与基于抵消的替代品
        blocks:
          - type: paragraph
            body: >-
              ArcelorMittal 在 Boston Metal 的竞争格局中位置异常复杂：它既是战略投资人（参与 2023 年 Series C
              融资），也是全球最大现有钢铁生产商之一，并拥有内部低碳炼铁项目。ArcelorMittal 的 XCarb 脱碳计划横跨多条技术路径——Belgium Ghent 的 Midrex H-DRI
              工厂正转向氢进料，Texas 有 DRI 产能，并商业销售 XCarb 绿色钢证书产品。ArcelorMittal 在 Hamburg DRI 工厂的示范运行实现了试点规模 100% 氢进料，为既有一体化钢铁厂的
              H-DRI 路线建立了证据点。对 Boston Metal 而言，ArcelorMittal 的战略持股同时创造选择权和风险：选择权在于 ArcelorMittal 可能成为首个 MOE 授权客户；风险在于，如果
              ArcelorMittal 自身 DRI-H2 项目率先达到商业规模和成本竞争力，其对 Boston Metal 技术授权的依赖会降低。

              thyssenkrupp 的 tkH2Steel 计划目标是在 Germany Duisburg 建设 2.5 million tonnes per year 的 DRI 产能，并获得 €2 billion EU
              Innovation Fund 拨款支持。不过，thyssenkrupp 同时面临财务重组，资本配置存在不确定性——即便公共补贴已锁定，母公司资产负债表压力也可能拖慢项目。Salzgitter SALCOS 目标
              2026 年在 Germany 产出首批绿色铁水，是中型现有钢铁企业中最先进的 DRI-H2 项目，也说明欧洲钢厂并未等待新型电解路线才启动脱碳转型。

              Nucor 是买方层面最有商业力量的替代威胁。作为 United States 最大钢铁生产商（按产量计，占国内市场 25%+ ）且完全基于 EAF，Nucor 的 GHG 强度已约为全球 BF-BOF
              平均值的三分之一。其 Econiq 产品是全球首个大规模商业销售的净零钢，已按 Scope 1 和 2 认证，并可选择 Scope 3 方案；任何 US
              钢铁买方都能在不使用任何新工艺生产的物理绿色铁的情况下，申报净零内含碳。Econiq 通过 100% 可再生或无碳电力（Scope 2）以及高质量碳抵消（Scope 1 和 3）取得认证。关键在于，Econiq
              可立即通过 Nucor 既有全部销售渠道交付，不需要新的分销基础设施成本。对主要受 Scope 3 报告合规驱动、而非原生炼铁物理脱碳驱动的买方而言，Econiq 是 Boston Metal MOE Steel
              必须主动区分的替代方案。Boston Metal 必须讲清楚的差异是，Econiq 的抵消型净零声明依赖市场购买的抵消和 RECs，而 MOE 在炼铁环节物理消除
              CO2；随着企业采购标准围绕抵消完整性和额外性收紧，这一区分会越来越重要。
