  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与价格发现
        blocks:
          - type: paragraph
            body: >-
              讨论 Boston Metal 的估值，必须从公司实际披露的事实开始。当前最干净的锚点是 2026 年 5 月的说法：最近一笔 $75M 投资把累计融资推到 $500M
              以上。对一家未上市工业初创公司来说，这是一笔有分量的资本基础，但它不是估值。公开来源没有披露该轮的投后估值、股权稀释、清算优先权，也没有说明这些条款更像成长股权融资，还是 Brazil 事件之后的救援融资。


              这些缺失的结构很关键，因为同一轮融资在不同背景下会指向完全不同的经济含义。一轮普通的主融资，如果稀释适中，可能支撑更接近顶级气候工业公司的估值；一轮带有下行保护、投资者权利或更重稀释的结构化融资，即使募资标题很大，也可能意味着普通股持有人的权益价值低得多。2026
              年的 Form D 也强化了同一判断：Boston Metal 在这一时期仍处于活跃的私募融资状态。


              实务结论很简单：估值不透明仍是核心尽调问题。投资人可以给情景划边界，但仅靠公开证据无法精确给 Boston Metal 标价。
