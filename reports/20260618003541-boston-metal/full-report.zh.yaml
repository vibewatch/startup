      - number: '4.3'
        title: 资本充足性、烧钱与资金续航
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月巴西事故暴露出结构性资本脆弱性：Boston Metal 原本有一笔与里程碑挂钩的资金承诺（很可能来自战略伙伴或项目融资方），但工厂错过启动目标后失去该资金。公司 CEO
              披露事故“给我们的现金流造成很大压力”，且“投资者非常强力地支持了我们”，说明 2026 年 5 月 $75M 融资更像被动应急，而不是既定计划。事故发生在 1 月、4 月裁员 71 人、5
              月紧急融资，这一顺序显示里程碑落空时，公司舒适运营资金续航余量不足四个月。月度烧钱率未公开披露。裁员后仍有 250 多名员工，分布在 Woburn 研发、巴西运营和 Weirton 项目开发；用
              $120,000–$150,000 的全包平均员工成本粗算，仅年薪资费用就达 $30–$38M。再加上设施租赁、电极和材料开支、Weirton 项目开发成本，全年现金消耗很可能推至
              $50–$80M。在这个区间内，$75M 注资大约只能从 2026 年 5 月起购买一到一年半运营资金续航。Weirton DOE 拨款按项目封闭，不能直接降低 Woburn 或巴西烧钱。2025 年 $51M
              可转债的转换条款和到期日未披露；除非已经转换或消灭，否则它代表或有股权稀释，会让未来估值轮更复杂。2026 年融资的投后估值未公开；Boston Metal
              也未在任何交易所上市。公司的融资记录很强，但事故和随后的快速烧钱，正在测试现有投资财团是否会继续支持公司穿越巴西重启和更长的绿地钢铁示范时间线。
