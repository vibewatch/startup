  - id: FP003
    title: 护城河与就绪度 KPI — Boston Metal vs. 领先竞争者
    type: kpi
    layout: standard
    summary: >-
      关键绩效指标将 Boston Metal 的竞争位置与最强对手比较，维度包括护城河耐久性、商业牵引和近期执行风险，时间点为 2026 年 6 月。Stegra 的预售积压和建设进度是最不利的竞争指标；Boston Metal
      的无氢路径和原料灵活性是最具结构耐久性的优势。
    data:
      items:
        - label: Stegra 已承诺承购 vs. Boston Metal 客户 LOI
          value: 1.5M+ t pre-sold vs. no disclosed MOE Steel LOIs
          note: Stegra 在首次生产前，已向具名 OEM 和品牌预售每年 150 万吨。Boston Metal 未披露任何 MOE Steel LOI 或承购协议。这个差距是最实质的竞争时间劣势。
        - label: Boston Metal 累计融资 vs. Electra
          value: '>$500 M vs. ~$264 M'
          note: Boston Metal 的 $500 M+ 约为 Electra 累计融资的 2 倍。不过，Boston Metal 的资本现在主要流向关键金属放大，而不是 MOE Steel 示范。
        - label: Stegra 融资深度 vs. Boston Metal
          value: €7.9 B (Stegra) vs. >$500 M (Boston Metal)
          note: Stegra 已锁定融资总额约为 Boston Metal 累计融资的 15–16 倍，反映出一座融资完全到位的十亿级绿色钢铁工厂，与创新阶段技术授权公司之间的差异。任何创业公司都无法在项目资本上匹配 Stegra。
        - label: HYBRIT H2 储存技术验证
          value: Proven at pilot scale (Feb 2025)
          note: HYBRIT 在带衬砌岩洞中验证了大规模无化石氢储存，消除了 H-DRI 路线最常被提到的技术风险，并相对 Boston Metal 的 MOE 路径强化了 H-DRI 的竞争理由。
        - label: Boston Metal 巴西工厂重启时间线
          value: Sept 2026 (post-refractory leak)
          note: 2026 年 1 月的耐火材料泄漏推迟了巴西工厂，导致错过融资里程碑，并裁员 71 人。2026 年 9 月重启来自管理层指引。这个执行挫折是竞争记录中最实质的近期负面数据点。
        - label: Nucor Econiq 净零钢 — 可获得性
          value: Commercially available now (Scope 1+2 certified)
          note: >-
            Nucor 的 Econiq 今天已通过 Nucor 现有全部销售渠道供应。寻求 Scope 3 合规的买家无需等待 MOE 或 H-DRI 商业化，就能立即采购 Econiq，从而降低 Boston Metal
            时间线上的时间压力。
        - label: ArcelorMittal 投资者角色 — 选项 vs. 承诺
          value: Strategic equity investor; no disclosed MOE Steel license term
          note: ArcelorMittal 的战略股权投资验证了技术，但没有公开承诺授权 MOE。ArcelorMittal 也在推进自己的 H-DRI 项目。双路径可选性可能推迟授权决策。
        - label: MOE Steel 示范工厂状态 vs. Stegra DRI 塔
          value: 'Boston Metal: planning phase; Stegra: 100m DRI tower built (Mar 2026)'
          note: >-
            Boston Metal 的下一个钢铁里程碑是目标 2027 年运行的示范工厂（据 MIT TR 2025 年 3 月）。截至 2026 年 3 月，Stegra 的 DRI 塔已超过 100 米，完整电解槽已在
            2026 年 4 月安装。实体建设差距是最清晰的竞争时间指标。
    approximationNotes: >-
      Stegra 预售数字来自 Stegra 公司网站（2022 年 5 月里程碑 + 后续新增）。Boston Metal >$500 M 来自 MIT Technology Review 2026 年 5 月文章。Electra
      ~$264 M 来自 Electra 网站。Stegra €7.9 B 汇总自公开公告（2024 年 1 月锁定 €6.5 B + 2026 年 4 月达成 €1.4 B）。所有时间线数据来自截至 2026 年 6
      月的公开来源。
