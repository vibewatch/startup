  - id: FM001
    title: Boston Metal 市场规模金字塔 — TAM/SAM/SOM
    type: pyramid
    layout: standard
    summary: 三层市场规模测算：从全球钢铁 TAM，到绿色原生钢 SAM，再到 Boston Metal 近期关键金属 SOM；每层均使用来源支持的估计。
    data:
      items:
        - label: TAM — 全球钢铁市场
          value: $1.3-1.5T annual revenue (1,885 Mt × $700-800/t avg)
          description: 全球所有品级、路线和地区的全部钢铁生产
        - label: SAM — 绿色 / 近零原生钢（欧盟 + 美国）
          value: ~50-100 Mt/yr demand by 2030 under NZE scenario; EU CBAM-exposed tonnage ~130 Mt import/year
          description: 通过近零排放路线（MOE、H2-DRI、废钢 EAF）生产，面向受 CBAM/ETS 影响的市场和企业 Scope-3 买家
        - label: SOM — MOE 授权费 + 关键金属收入
          value: 'Brazil critical metals: Nb ~$440M US imports; Ta ~$230M; Sn ~$840M US; MOE licensing fee TBD'
          description: 近期：巴西关键金属业务（铌、钽、锡）；更长期：全球钢企部署带来的授权费和惰性阳极供应
    approximationNotes: >-
      绿色钢铁 SAM 根据 IEA NZE 情景（到 2030 年占原生生产 >8% = >80 Mt）和受 CBAM 影响的进口量估算。由于每吨授权费未披露，MOE 钢铁授权 SOM 无法从公开数据量化。关键金属 SOM 使用
      USGS 美国进口价值作为可服务市场规模代理。
    claimRefs:
      - CM001
      - CM002
      - CM021
      - CM026
      - CM027
      - CM040
