      - number: '6.2'
        title: 战略投资者作为客户证明
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 当前最强的客户证据，来自股东名单与未来潜在买方的重叠。ArcelorMittal 是最清晰的例子：它领投 2023 年 Series C 首关，通过 XCarb Innovation
              Fund 投资 $36M，并公开把 Boston Metal 定位为有意义的钢铁脱碳技术。BMW 扮演不同角色。它不是生产商，但 TechCrunch 报道和 Boston Metal 自身公告显示，BMW 加入
              Series B，是因为钢铁是其供应链中的主要排放来源。因此，如果 Boston Metal 能放大，BMW 就是需求侧验证：低碳原生铁对下游买方有相关性。


              BHP、Vale、Microsoft、Breakthrough Energy Ventures 和 IFC 增加了其他战略层。Vale 和 BHP 把 Boston Metal
              接入上游采矿以及矿石或矿渣选择权。Microsoft 和 Breakthrough 提供气候科技信号和融资可信度。IFC 则以明确的巴西商业化目标，提供开发金融验证。这些对手方合在一起，降低了 Boston
              Metal 被视为孤立科学项目的可能性。


              限制同样重要：这些关系没有任何一个公开披露 MOE Steel 的商业授权时间表、年度采购承诺或合同化单位经济性。战略资本是强领先指标，但并不等于有约束力的客户落地。
