  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 支撑
      - 什么会改变观点
    rows:
      - - MOE Steel 可能成为定义品类的许可模式
        - 避开氢基础设施，钢铁 TAM 庞大，战略投资方强
        - 需要示范工厂细节和钢铁企业采用里程碑
      - - 关键金属能比钢铁更快搭出收入桥梁
        - 公司现在优先推进这条线，巴西是首个部署
        - 需要稳定重启、客户出货和单位经济性
      - - 战略投资方基础验证了公司
        - ArcelorMittal、IFC、Microsoft、BHP 等已支持该平台
        - 验证必须转化为合同或稳固融资条款
      - - 估值可能已经计入过多未来成功
        - 轮次结构不透明，商业验证薄弱
        - 披露投后估值、客户验证和更强经济性，才可能支撑当前定价
    notes: 公开证据最薄的地方——合同、优先权和单位经济性——也是反论点最强的地方。
    claimRefs:
      - CV012
      - CV014
      - CV021
      - CV022
      - CV030
      - CV031
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - 巴西 2026 年重启，关键金属产出验证经济性，钢铁示范路径到 2027 年更清晰，融资仍具战略性
        - 期权价值扩大，投资者可在推断估值区间上端附近支撑溢价
        - 仍需要钢铁客户转化
        - 多个里程碑必须快速兑现
      - - 基准
        - 巴西重启并逐步爬坡，Weirton 仍是战略期权，钢铁仍有前景但兑现周期长
        - 相比普通收入前工业初创，公司应享有持续溢价；但相对理想情景，仍需大幅折价
        - 执行滑坡和市场溢价不确定
        - 与当前公开证据最一致
      - - 熊市
        - 巴西再度滑坡，资本转为惩罚性，钢铁仍停留在里程碑层面，客户验证没有坐实
        - 股权价值急剧压缩，融资结构比名义轮次规模更重要
        - 救助动态和稀释负担
        - 另一轮重大运营延误会触发
    notes: 公开来源未披露当前估值或完整轮次结构，因此情景区间只具方向性。
    claimRefs:
      - CV008
      - CV009
      - CV014
      - CV015
      - CV016
      - CV034
      - CV035
      - CV036
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 状态
      - 倍数 / 估值信号
      - 相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers a representative set of public decarbonized-metals analogues and reference companies rather than an
        exhaustive private-market transaction list.
    rows:
      - - Boston Metal
        - 私有、收入前钢铁论点，带关键金属桥梁
        - 投后估值未公开；按 $75M 轮次稀释 5%-10% 的框架，简单推算区间约 $750M-$1.5B
        - 直接标的公司，也是唯一同时结合 MOE Steel 和关键金属的公司
        - 区间依赖假设，可能忽略结构性条款
      - - Electra
        - 电化学铁初创公司
        - 引用来源未公开估值
        - 最接近的全电力炼铁路径工艺类比
        - 商业模式和温度区间不同于 Boston Metal
      - - Stegra
        - Hydrogen-DRI 绿色钢铁开发商，正在建设大型直销业务
        - 此处未引用估值；商业验证强于 Boston Metal
        - 可用于比较时间节奏和客户验证
        - 重资产直接生产商，不是许可模式
      - - HYBRIT / SSAB 路径
        - 氢储能与初级钢铁脱碳参考路线
        - 此处未引用估值；部分领域的技术验证更成熟
        - 可作为战略和技术标杆
        - 合资 / 传统企业生态，不是纯风险投资创业公司
      - - ArcelorMittal XCarb 视角
        - 战略投资者视角，而非创业公司可比项
        - 向 Boston Metal 披露投入 $36M 战略支票
        - 有助于衡量产业资本为脱碳选项买单的意愿
        - 不是可交易的纯业务估值可比项
      - - 第三方估值跟踪器
        - PremierAlts / GetLatka / Caplight 给出的私营公司估值差异较大
        - 可获得的跟踪器信号从约 $357.6M 到约 $931M 不等
        - 可作为情绪 / 不透明度校验
        - 方法论不透明，不应视为经审计标记
    notes: 可比组证据刻意保持定性，因为私营硬科技轮次的公开估值数据仍然稀少且不一致。
    claimRefs:
      - CV004
      - CV008
      - CV025
      - CV026
      - CV027
      - CV043
      - CV044
      - CV045
  - id: TV005
    title: 论点失效与叫停触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 巴西重启失败
        - 再次重大延期，或重启后运行不稳
        - 打断近期收入桥，也削弱对工厂可靠性的信心
        - 转向下行情景，并要求更强条款
      - - 惩罚性融资
        - 下一轮融资呈现救助特征或重结构化
        - 将期权价值从普通股持有人手中转走
        - 假设稀释，并降低入场意愿
      - - 钢铁路径仍然模糊
        - 没有具体示范或客户里程碑
        - MOE Steel 从核心价值驱动变成遥远期权
        - 权重转向仅有关键金属结果
      - - 政策 / 价值支撑减弱
        - Weirton 路径失去动能或支持
        - 压缩战略材料可选性
        - 从牛市情景中移除 Weirton 上行空间
      - - 商业证明仍停留在战略层面
        - 没有合同或复购客户证据出现
        - 估值仍依赖使命叙事，而不是转化
        - 维持或扩大折价
    notes: 这些触发因素用于从现在到下一次重大融资事件之间的监控。
    claimRefs:
      - CV016
      - CV036
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前股权结构与优先权
        - 最新投后估值、清算优先权、可转债条款和投资者权利
        - 需要这些信息，才能把名义融资额转成真实股权价值
        - 管理层 + 法律顾问数据室
      - - 巴西经济性
        - 重启计划、收率、客户管线、定价和营运资本需求
        - 最重要的近期估值驱动
        - 运营 / CFO
      - - 钢铁示范路径
        - 场址、资本开支、EPC、伙伴名单和客户里程碑
        - 决定钢铁是期权价值，还是正接近核心价值
        - CEO + 产品 / 战略
      - - Weirton 商业化
        - 锚定买家、内部使用拆分和里程碑地图
        - 厘清政策支持能否转化为企业价值
        - 项目负责人 + DOE 资助团队
      - - 事故整改
        - 独立根因报告和工程修复
        - 降低重复故障折价的不确定性
        - 运营 + 第三方工程师
      - - 独立标记三角验证
        - 可靠的私募市场可比组和二级市场指示
        - 可收窄估值区间，并挑战 / 确认使命溢价
        - 订阅数据库 / 经纪商核查
    notes: 每一项都对应一个具体原因：公开证据不足以支持高置信度估值标记。
    claimRefs:
      - CV006
      - CV038
      - CV041
      - CV043
