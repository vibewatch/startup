      - number: '3.5'
        title: 护城河耐久性、转换成本、锁定与负面竞争证据
        blocks:
          - type: paragraph
            body: >-
              Boston Metal 最耐久的结构性护城河，在于近零 CO2 炼铁既不需要氢，也不需要 CCS。所有 H-DRI 竞争者（Stegra、HYBRIT、ArcelorMittal
              Hamburg、SALCOS、tkH2Steel）要么依赖尚未以所需规模和成本商业化的绿氢供应基础设施，要么依赖临时天然气过渡方案，因而仍留下非零碳足迹。MOE
              只需要可再生电力和铁矿石，这两种投入在全球都可获得，也不绑定氢能体系。绿氢 H2 降本时间表不断晚于原先预期，美国联邦清洁工业支持又在现任政府下走弱，原料简单性会持续放大 MOE 的优势。

              模块化授权模式，相比巨型工厂型竞争者，带来另一类结构性优势。Stegra 在 Boden 投入 €7.9B，是押注一个场址、一条氢供应链和一个监管 / 政治环境。Boston Metal
              的授权和阳极供应模式把资本开支分摊给被授权伙伴，可在多个地区并行部署，并在不要求 Boston Metal
              拥有或运营钢厂的情况下，从阳极制造获得收入。对钢企而言，技术采用决策从数十亿美元资本承诺降为授权费加阳极采购协议；相比建设巨型工厂或氢 DRI 综合体，切换门槛低得多。

              Boston Metal 记录中最主要的竞争反向证据，是商业化节奏。Stegra 的 DRI 塔和电解槽已在实体建设中，并计划 2026–2027 年首批产钢；Boston Metal 的 MOE Steel
              示范厂仍在规划中（MIT Technology Review 2025 年 3 月报道称，目标为 2026 年底开建、2027 年运行）。Boston Metal 2026
              年巴西工厂执行受挫——耐火材料泄漏导致融资里程碑落空、裁员 71 人，并把重启目标推至 2026 年 9 月——使公司近期收入重心转向关键金属而非钢铁，也压缩了管理层并行推进钢铁放大的带宽。Stegra 在
              Boston Metal 的 MOE Steel 产品商业化前，就已拿下 BMW、Mercedes-Benz、Scania、Porsche、Volvo Group 等客户关系，锁定了市场上最具战略意义的汽车
              Scope 3 供应协议。一个已承诺每年采购 100,000+ 吨 Stegra 绿钢的买方，在原供应期届满前，不太可能为竞争性 MOE 钢产品重新招标。

              MOE Steel 授权的切换成本判断并不单边。一方面，钢企与被授权方关系一旦建立就有粘性——MOE 电解槽会嵌入炼铁流程，投产后再转回 BF-BOF 或 H-DRI
              需要重新投入资本。另一方面，阳极供应依赖会形成供应商锁定，钢企可能在合同阶段抵触，更偏好商品化阳极市场，或自有惰性阳极制造能力。多栖风险也真实存在：大型一体化生产商如 ArcelorMittal，可能在开发
              H-DRI 能力的同时保留 MOE 路径的战略选择权。
