      - number: '5.3'
        title: 关键金属平台和巴西运营
        blocks:
          - type: paragraph
            body: >-
              MOE 是一种平台技术，适用于任何能在合适温度下溶解于熔融电解质的金属氧化物。对于关键金属——铌、钽、锡、钒、镍、铬——Boston Metal
              使用碳阳极，而不是铁电解所需的惰性合金阳极。公司称，关键金属生产使用的碳阳极已在商业规模得到验证，因此关键金属路径比钢铁路径更接近近期收入。

              Boston Metal do Brasil 是 2022 年成立、2024 年 3 月投运的全资子公司，也是 Boston Metal 第一个完全商业规模的 MOE
              部署。巴西设施设计用于从现有巴西矿业运营的矿渣和采矿废物流中回收铌、钽、锡和其他高价值金属——这些材料若不处理，就需要高成本处置或储存。矿石灵活性优势在这里尤其相关：这些是传统回收不适用的低浓度原料，而 MOE
              的溶解熔体化学可通过调节槽电势，选择性提取目标金属。

              巴西工厂 2024 年开工建设，历时约 18 个月。2026 年 1 月，耐火材料系统——防止熔融电解质腐蚀容器壁的绝热内衬——失效，造成电解质泄漏。运营停止，熔体被移除，未报告人员受伤或环境释放。泄漏导致
              Boston Metal 错失融资里程碑，引发现金流危机，并在 2026 年 4 月通过 WARN 通知裁员 71 人。截至 2026 年 6 月，维修正在进行，目标 2026 年 9 月重启。2026 年 5
              月宣布的 $75M 可转投资提供资本桥梁。
