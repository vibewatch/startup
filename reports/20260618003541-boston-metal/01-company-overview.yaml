- id: capital-base-and-strategic-backers
  title: Capital base, investor syndicate, and strategic validation
  body: 'Boston Metal’s capital history is one of the strongest objective signals in the file. The company’s own materials say it had raised more than $370 million by January 2024 and more than $500 million by April-May 2026, while the 2023 Series C close alone totaled $262 million. The investor base is notable not just for size but for composition. BMW’s 2021 participation linked Boston Metal directly to an automotive buyer with explicit steel-supply-chain decarbonization goals. IFC’s equity participation added a development-finance institution with a disclosed project rationale spanning both U.S. and Brazilian scale-up. Microsoft’s Climate Innovation Fund lists Boston Metal among its commitments, and Boston Metal’s own syndicate list includes steelmakers, miners, climate VCs, financial investors, and industrial corporates. This breadth lowers single-investor concentration risk and gives the company channel validation across upstream mining, midstream metals, and downstream buyers. The
    main missing fact is valuation: none of the accessible public materials discloses the current post-money valuation or ownership split by investor, which limits precision in comparing Boston Metal’s private-market pricing to peers.'
