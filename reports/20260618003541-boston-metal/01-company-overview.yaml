- id: founders-leadership-and-governance
  title: Founders, leadership, and governance visibility
  body: 'The founding story is anchored in MIT metallurgy research and gives Boston Metal unusual scientific provenance for a hard-tech startup. MIT News and Engine Ventures point to Donald Sadoway, Antoine Allanore, and James Yurko as the founding technical team, with MOE commercial viability emerging after work on inert-anode chemistry and subsequent MIT licensing. The current operating story, however, is centered far more on CEO Tadeu Carneiro than on the original founders. Boston Metal’s public materials say Carneiro joined in 2017 after a long career in metals and mining, including leadership at CBMM, a highly relevant background given Boston Metal’s expansion into niobium- and chromium-adjacent critical-metals markets. The current disclosed leadership bench also includes Adam Rauwerdink on business development, Guillaume Lambotte on scientific leadership, Itamar Resende in Brazil, and Fernanda Fenga on corporate functions. What remains thin is governance detail: accessible materials
    do not provide a full board roster, committee structure, or ownership concentrations. That does not invalidate the team’s industrial credibility, but it does mean outside investors have less visibility into succession and control than they do into the company’s technical depth.'
