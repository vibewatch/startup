evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: current-headcount
    missingEvidence: A current management-confirmed headcount and layoff-adjusted org chart as of June 2026.
    whyItMatters: Investors need to know whether the Brazil delay caused a modest reset or a deeper operating-capacity reduction.
    diligencePath: >-
      Request the latest board or investor update with employee count by geography and function after the April 2026
      layoffs.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      Post-money valuation, investor ownership percentages, liquidation preferences, and any structured terms for the
      2026 financing.
    whyItMatters: >-
      Without current valuation and cap-table data, the attractiveness of the current private entry point cannot be
      underwritten confidently.
    diligencePath: >-
      Request the latest financing deck, cap table, and signed term summary for the 2026 round and prior Series C/C2
      extensions.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: governance-disclosure
    missingEvidence: >-
      Full board roster, committee assignments, and any founder or investor governance rights not reflected in public
      materials.
    whyItMatters: >-
      Succession planning and control analysis are incomplete when governance disclosure is concentrated on the CEO and
      a small set of named executives.
    diligencePath: >-
      Request a board list, committee charter summary, and investor-rights overview from management or existing
      shareholders.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: to004-milestone-partial-coverage
    missingEvidence: >-
      A fully dated primary-source chronology covering every interim financing close, operating reset, and board change
      from 2012 through 2026.
    whyItMatters: >-
      The milestone table is sufficient for diligence orientation, but not every historical event is publicly
      timestamped in accessible primary sources.
    diligencePath: >-
      Request the internal company timeline or board materials to reconcile exact dates for early financings and 2026
      restart milestones.
    relatedQuestionRefs:
      - QO015
      - QO016
      - QO023
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: MOE steel licensing economics
    missingEvidence: >-
      Boston Metal has not publicly disclosed the licensing fee per tonne, royalty structure, or anode supply contract
      pricing for MOE Steel licensees. Without this, the SAM and SOM for the steel licensing business cannot be sized
      from public data.
    whyItMatters: >-
      The licensing economics determine whether the green steel TAM translates into meaningful Boston Metal revenue; a
      small per-tonne fee on a large steel volume is structurally different from a large fee on a small early-adopter
      volume.
    diligencePath: >-
      Request Boston Metal licensing term sheet; compare to analogous technology licensing models in metallurgy (e.g.,
      Midrex DRI technology royalties, blast furnace technology licensing).
    relatedQuestionRefs:
      - QM021
      - QM027
  - type: private-evidence-only
    severity: material
    topic: Brazil operation throughput and revenue
    missingEvidence: >-
      Boston Metal has not disclosed production volume, revenue, operating margin, or feedstock supply contract terms
      for the Brazil critical metals operation, making it impossible to independently verify the 2026 revenue target or
      scale.
    whyItMatters: >-
      The Brazil operation is the primary near-term revenue bridge; without disclosed financials or throughput data,
      investors cannot assess whether the operation is commercially viable at scale or is a proof-of-concept at pilot
      volumes.
    diligencePath: >-
      Request operational data from Boston Metal Brazil; review IFC investment documentation for disclosed capacity and
      production targets; check regulatory filings in Brazil for environmental licenses and capacity disclosures.
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: IRA applicability to MOE steel
    missingEvidence: >-
      No public analysis exists that specifically maps IRA clean manufacturing provisions (Section 48C, 45X, or 45V) to
      Boston Metal's MOE technology to quantify potential per-tonne incentive value for US-based MOE deployments.
    whyItMatters: >-
      IRA incentives could materially improve the economics of US MOE Steel licensees and accelerate adoption in North
      America, potentially ahead of EU CBAM-driven EU adoption.
    diligencePath: >-
      Commission legal/tax analysis of IRA provision applicability; review DOE AMO guidance on electrolytic metal
      production qualifying for clean manufacturing credits.
    relatedQuestionRefs:
      - QM027
  - type: missing-source
    severity: material
    topic: comparable green steel analyst estimates
    missingEvidence: >-
      BloombergNEF, Wood Mackenzie, and S&P Global Commodity Insights green steel market sizing reports were not
      accessible during this research cycle; these could provide independent corroboration or challenge the IEA/RMI
      demand figures.
    whyItMatters: >-
      The green steel demand estimates used in this chapter rely primarily on IEA (normative scenario) and RMI
      (committed buyer program survey), which are relatively optimistic sources; independent analyst estimates may show
      narrower or wider ranges.
    diligencePath: >-
      Obtain BloombergNEF Green Steel Market Outlook report; review S&P Global Platts ferroniobium and green steel
      premium market reports.
    relatedQuestionRefs:
      - QM029
  - type: conflicting-data
    severity: minor
    topic: global tin market size
    missingEvidence: >-
      Boston Metal states global tin market exceeds 400,000 tonnes per year; USGS MCS 2025 shows US apparent consumption
      of ~37,000 tonnes refined tin with 73% import reliance, which would imply US is ~9% of world demand—consistent
      with >400,000 tonnes if US is not anomalously low. The exact global figure should be verified against USGS world
      production data.
    whyItMatters: >-
      Minor: the tin market size claim is used as context only; Boston Metal's tin extraction is a co-product of
      niobium/tantalum processing rather than a primary target.
    diligencePath: Cross-check global tin mine production from USGS Minerals Yearbook for most recent year.
    relatedQuestionRefs:
      - QM011
  - type: private-evidence-only
    severity: material
    topic: green steel competitor pricing
    missingEvidence: >-
      Specific per-tonne pricing for any competitor's green steel or clean iron product, including Stegra offtake
      prices, SSAB Zero premium, ArcelorMittal XCarb certificate price, Nucor Econiq premium, and Boston Metal's target
      MOE Steel licensing economics.
    whyItMatters: >-
      Without comparative pricing data, the green premium sustainability cannot be quantified and Boston Metal's
      licensing economics cannot be compared to competitors' direct sales models. This is the most significant evidence
      gap across the entire competitive chapter.
    diligencePath: >-
      Request indicative MOE Steel licensing fee and anode cost structure from Boston Metal management; compare to any
      SSAB Zero or Stegra premiums disclosed in investor relations or partner briefings.
    relatedQuestionRefs:
      - QP027
  - type: access-blocked
    severity: material
    topic: thyssenkrupp tkH2Steel restructuring impact
    missingEvidence: >-
      Specific updates on how thyssenkrupp's financial restructuring affects the tkH2Steel DRI program capital
      allocation, timeline, and whether the €2B EU Innovation Fund grant remains accessible given parent company
      financial difficulties.
    whyItMatters: >-
      thyssenkrupp is one of the largest European steelmakers and its hydrogen DRI program directly competes for the
      same European industrial steel buyer segment as Boston Metal's MOE Steel. If tkH2Steel is delayed, this reduces
      one competitor threat but also signals the difficulty of capital-intensive green steel programs at incumbents.
    diligencePath: >-
      Monitor thyssenkrupp Q3/Q4 2026 investor updates and EU Innovation Fund grant disbursal announcements; track
      restructuring proceedings for capital allocation impact on tkH2Steel.
    relatedQuestionRefs:
      - QP017
  - type: missing-source
    severity: moderate
    topic: Boston Metal MOE inert anode IP specifics
    missingEvidence: >-
      Boston Metal's specific patent portfolio covering inert anode technology for MOE, including claim breadth,
      international filing coverage, expiry dates, and whether competing anode systems have been developed by any H-DRI
      or EAF incumbents.
    whyItMatters: >-
      The inert anode is the most critical proprietary component of MOE Steel and its durability is the most cited
      remaining engineering risk. The breadth and defensibility of the IP moat directly affects how durable Boston
      Metal's licensing model will be at commercial scale.
    diligencePath: >-
      Search USPTO and EPO patent databases for Boston Metal or Boston Electrometallurgical Corporation anode patent
      filings; obtain a patent landscape analysis covering molten oxide electrolysis inert anode claims.
    relatedQuestionRefs:
      - QP028
  - type: missing-source
    severity: moderate
    topic: POSCO HyREX detailed commercial roadmap
    missingEvidence: >-
      POSCO's specific HyREX commercial deployment timeline, scale targets, and whether POSCO has made licensing or
      deployment decisions that would position it as a competitor or partner for MOE in the Asian steelmaking market.
    whyItMatters: >-
      POSCO is one of the world's top-5 steelmakers and a major presence in Korean and global markets where Boston Metal
      may seek licensees. If HyREX reaches commercial scale before MOE, POSCO becomes an H-DRI competitive precedent
      that reduces MOE's case in Asian markets.
    diligencePath: >-
      Monitor POSCO annual reports and press releases for HyREX construction or demonstration milestones; review whether
      the April 2026 JDA with Electra indicates preference for electrochemical routes.
    relatedQuestionRefs:
      - QP029
  - type: missing-source
    severity: moderate
    topic: green hydrogen cost trajectory 2025-2030
    missingEvidence: >-
      Current IEA, BloombergNEF, or IRENA projections for green hydrogen production cost trajectories through 2030,
      specifically whether the $2/kg threshold is projected before or after 2030 at commercial scale, and how delays in
      H2 cost reduction affect H-DRI competitive timing.
    whyItMatters: >-
      Green hydrogen cost reduction is the most important external variable in the H-DRI versus MOE competitive race. If
      H2 costs fall faster than currently projected, MOE's infrastructure simplicity advantage narrows significantly on
      cost competitiveness.
    diligencePath: >-
      Review IEA Global Hydrogen Review 2025 and BloombergNEF hydrogen cost trajectory reports; compare to Stegra's and
      HYBRIT's disclosed assumptions for green hydrogen pricing.
    relatedQuestionRefs:
      - QP030
  - type: private-evidence-only
    severity: moderate
    topic: Outokumpu MOU commercial development scope
    missingEvidence: >-
      Progress updates on the Boston Metal-Outokumpu MOU signed September 2025, including whether the joint development
      project has resulted in preliminary commercial terms, feedstock volumes, or an extension to a formal supply or
      licensing agreement.
    whyItMatters: >-
      The Outokumpu MOU is Boston Metal's most concrete publicly disclosed downstream partnership for its critical
      metals business. If it develops into a commercial agreement, it validates the stainless steel side-stream recovery
      thesis and strengthens the critical metals competitive position; if it remains an MOU, it adds limited competitive
      value.
    diligencePath: >-
      Request joint development project status from Boston Metal and Outokumpu management; review Outokumpu EVOLVE
      strategy updates for Boston Metal collaboration progress.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: blocking
    topic: revenue actuals and projections
    missingEvidence: >-
      Any revenue figure, revenue recognition schedule, or confirmed sale from either the Brazil critical-metals segment
      or the MOE Steel segment, including validation of any $119M annual revenue estimate.
    whyItMatters: >-
