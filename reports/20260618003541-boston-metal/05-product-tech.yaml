    - label: H2 / carbon infrastructure needed
      values:
      - None; electricity only; no H2 production, storage, or transport
      - Large-scale green H2 production and storage required
      - Coke ovens, coking coal supply, coal logistics
    - label: Emissions profile (with green electricity)
      values:
      - Near-zero Scope 1+2 CO₂; pure O₂ byproduct
      - Near-zero Scope 1+2 CO₂ (with green H2); H₂O byproduct
      - ~2 tCO₂/tSteel Scope 1; highest-emitting route
    - label: Commercial maturity (mid-2026)
      values:
      - Multi-anode industrial cell proven; demo plant not yet built
      - Commercial-scale plants in operation (HYBRIT, Stegra planning)
      - Fully commercial; ~71% of global crude steel
    - label: Process steps replaced
      values:
      - Coke prod., sinter, pelletize, BF, BOF all eliminated
      - BF+BOF replaced; pelletizing still required; EAF still needed
      - N/A (reference case)
    - label: Modular scalability
      values:
      - High; add cells in parallel; no minimum plant size
      - Low; plant economics favor 1M+ tpa scale
      - Low; fixed blast furnace scale
  approximationNotes: H2-DRI comparisons use HYBRIT/SSAB as reference. MOE Steel maturity assessment reflects March 2025 commissioning and is company-stated; no independent TRL assessment published.
