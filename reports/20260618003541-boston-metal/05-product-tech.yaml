- id: differentiation-risks
  title: Differentiation, IP, and Technical Risk
  body: 'Boston Metal''s differentiation rests on four pillars: (1) the proprietary inert anode alloy that makes the MOE process scalable without carbon emissions; (2) ore-grade flexibility that enables MOE to accept medium- and low-grade ores unsuitable for H2-DRI pelletizing; (3) a platform architecture applicable to a wide range of metal oxides, enabling diversified near- term revenue from critical metals while steel licensing matures; and (4) a modular, parallel- cell design that lets steelmakers add capacity incrementally rather than committing to a billion-dollar blast furnace.

    The IP position derives from MIT-licensed patents and Boston Metal''s own filed patents on the inert anode composition and MOE cell design. The company has stated publicly that its core IP was patented at MIT and exclusively licensed. A Cleantech Global Top-100 designation (seven consecutive years through 2026) and TIME''s Best Inventions 2024 recognition provide external validation. The Outokumpu MOU specifically secures chromium feedstock supply—a strategic dependency that both chains Outokumpu as a partner and reduces anode supply risk.

    Key technical risks include: (a) anode service lifetime under continuous production conditions at full current density, which has not been published and remains the primary commercial diligence item; (b) refractory engineering, demonstrated to be a real failure mode by the January 2026 Brazil incident; (c) electricity cost sensitivity—Columbia University researchers estimated that globally converting BF-BOF to MOE would require over 5,000 TWh of electricity annually, and that electricity prices would need to fall materially for the process to be cost- competitive; (d) scale-up risk from the current multi-anode cell (~25 kA pilot) to the full commercial cell (~600 kA target), a 24x increase in current; and (e) multi-cell integration at a demonstration plant, a milestone not yet achieved. The developer community (Hacker News) has noted that the current cell''s one-to-two tonnes per month output is several orders of magnitude below the scale needed for economic viability in commodity steel,
    with the demonstration plant as the critical proof point.'
