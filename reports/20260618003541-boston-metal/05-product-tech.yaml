- id: milestones-roadmap
  title: Technical Milestones and Development Roadmap
  body: 'Boston Metal has executed a systematic laboratory-to-industrial scale-up over thirteen years. The MOE chemistry was proven at MIT in a coffee-cup-sized cell in the 2010s, with the critical anode material identified around 2012. A 2013 Nature paper by co-founders Allanore and Sadoway formally described the MOE platform. The company was incorporated in 2012–2013 and ran its first semi-industrial MOE cell in 2014. Research progressed through progressively larger vessels; the company ran three pilot lines at its Woburn facility by 2021.

    The most significant 2025 milestone was the commissioning of a multi-inert-anode industrial MOE cell in Woburn. On February 17, 2025, the team siphoned over one tonne of liquid steel— the first time the multi-anode design produced meaningful tonnage. CEO Tadeu Carneiro declared "I can now say that tonnage steel is flowing from our multi-inert anode MOE cell." Boston Metal frames this as de-risking the technology and validating the path to multi-cell plants.

    The next planned milestone is a demonstration plant substantially larger than the Woburn facility—the first system too large to fit in the existing building. According to SVP Rauwerdink in March 2025, the demonstration plant would produce approximately one to two tonnes per day (versus one to two tonnes per month from the current cell), targeting a late-2026 commissioning and 2027 operation start. Beyond that, the commercial path requires licensing agreements with established steelmakers, each of whom would deploy arrays of cells at their existing facilities. No licensing contracts with steelmakers have been publicly announced as of June 2026.'
