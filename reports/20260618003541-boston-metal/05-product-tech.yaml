callouts:
- calloutType: strength
  title: Inert Anode Proven at Multi-Anode Industrial Scale
  body: The March 2025 multi-inert-anode MOE cell commissioning and the February 17, 2025 tapping of over one tonne of steel represents the most significant technical de-risking event in Boston Metal's history. The achievement validated both the inert anode's survival in a production environment and the multi-anode cell architecture needed to scale beyond a single anode.
  claimRefs:
  - CE026
  - CE027
- calloutType: risk
  title: Brazil Refractory Failure Exposes Engineering and Financial Fragility
  body: The January 2026 refractory leak at Boston Metal do Brasil caused the company to miss a funding milestone, trigger a WARN-notice layoff of 71 employees, and pivot to emergency capital. This event demonstrates that even validated MOE chemistry can encounter engineering failures in adjacent systems (refractory lining) that derail commercial timelines and capital plans. Refractory performance at scale is an ongoing risk for the steel demonstration plant.
  claimRefs:
  - CE028
  - CE029
  - CE039
- calloutType: risk
  title: Demonstration Plant and Anode Lifetime Are Unproven Gates
  body: 'Boston Metal has not yet demonstrated: (1) a multi-cell demonstration plant, (2) long-term inert anode service life under continuous production conditions, or (3) a signed steelmaker licensing agreement. Until all three are achieved, MOE Steel commercial revenue relies on evidence from a single-cell environment and company-stated projections. The demonstration plant is the critical near-term milestone.'
  claimRefs:
  - CE034
  - CE035
  - CE036
  - CE038
