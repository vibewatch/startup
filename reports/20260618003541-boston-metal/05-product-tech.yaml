company:
  name: Boston Metal
chapter:
  number: 5
  title: Product & Technology
  summary: Boston Metal's core product is Molten Oxide Electrolysis (MOE), an electrochemical platform that converts metal oxides into liquid metal at approximately 1,600°C using direct current in place of coal-based reduction, releasing pure oxygen as its sole gas byproduct. The technology's inert iron-chromium anode—the key MIT-derived innovation—was validated at multi-anode industrial cell scale in early 2025, with the Woburn facility tapping over a ton of steel in February 2025. The same MOE platform is being commercialized for critical metals (niobium, tantalum, tin, vanadium, nickel, chromium) through Boston Metal do Brasil, though a January 2026 refractory failure delayed the Brazil facility's commercial startup to at least September 2026. Key unresolved gaps include long-term anode lifetime, multi-cell demonstration plant economics, full commercial licensing pipeline, and independent third-party process verification.
sections:
- id: moe-core-technology
  title: MOE Core Technology and Cell Chemistry
  body: 'Boston Metal''s Molten Oxide Electrolysis (MOE) is an electrochemical ironmaking route that replaces all coal-derived steps of conventional steelmaking with a single electrolytic cell. Iron ore is loaded into the cell, mixed with fluxing oxides to form a molten electrolyte, and an inert anode is immersed in the melt. When direct current is applied and the cell reaches approximately 1,600°C, the electric potential splits the iron-oxygen bonds in the dissolved iron oxide: iron ions migrate to the cathode, where they accept electrons and accumulate as high-purity liquid metal that pools at the bottom and is tapped directly into ladle metallurgy. Simultaneously, oxygen ions are oxidized at the inert anode and released as pure O₂ gas. No carbon dioxide, no carbon monoxide, no process water, and no hazardous chemicals are generated.

    Compared with the conventional blast furnace and basic oxygen furnace (BF-BOF) route, MOE eliminates coke production, iron-ore sintering and pelletizing, blast-furnace smelting, and BOF refining—collapsing a five-step carbon-intensive chain into one electrolytic step. Compared with hydrogen direct reduced iron (H2-DRI), MOE does not require hydrogen production, storage, or transportation infrastructure. The MOE route produces liquid iron directly, whereas H2-DRI yields a solid sponge iron intermediate that still requires an electric arc furnace. H2-DRI also requires high-grade pelletized ore (typically >65% Fe), while MOE can process medium- and low-grade iron ores because dissolved impurities largely remain in the molten electrolyte rather than contaminating the product.

    Because the process is run entirely on electricity, its carbon intensity depends entirely on the electricity source. With renewable power, MOE achieves near-zero Scope 1 and Scope 2 emissions. MIT Professor Donald Sadoway, who co-founded Boston Metal from his MIT electrochemistry lab, has estimated that at commercial scale the process will consume roughly 20% less energy per tonne of steel than a conventional blast furnace.'
