- id: critical-metals-platform
  title: Critical Metals Platform and Brazil Operations
  body: 'MOE is a platform technology applicable to any metal whose oxide can be dissolved in a molten electrolyte at suitable temperature. For critical metals—niobium, tantalum, tin, vanadium, nickel, chromium—Boston Metal uses a carbon anode rather than the inert alloy anode required for iron electrolysis. The company states that the carbon anode for critical metals production has been validated at commercial scale, making the critical metals pathway closer to near-term revenue than the steel pathway.

    Boston Metal do Brasil, a wholly owned subsidiary incorporated in 2022 and inaugurated in March 2024, is Boston Metal''s first fully commercial-scale MOE deployment. The Brazil facility is designed to recover niobium, tantalum, tin, and other high-value metals from the slag and mining waste streams of existing Brazilian mining operations—materials that would otherwise require costly treatment or storage. The ore-flexibility advantage is particularly relevant: these are low-concentration feedstocks unsuitable for conventional recovery, and MOE''s dissolved-melt chemistry can selectively extract target metals by adjusting cell potential.

    Construction of the Brazil plant kicked off in 2024 and took approximately 18 months. In January 2026, the refractory system—the insulating lining that prevents the molten electrolyte from corroding the vessel walls—failed, causing an electrolyte leak. Operations were halted, the melt was removed, and no injuries or environmental releases were reported. The leak caused Boston Metal to miss a funding milestone, precipitating a cash-flow crisis and a WARN-notice layoff of 71 employees in April 2026. Repairs are underway as of June 2026, with a restart targeted for September 2026. A $75 million convertible investment announced in May 2026 provides the capital bridge.'
