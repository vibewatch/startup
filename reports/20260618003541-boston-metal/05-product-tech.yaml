- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Process / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - AC-to-DC power conversion
    - Convert grid AC to DC required for electrolysis; ~600 kA target per full cell
    - Grid reliability; rectifier capital and maintenance
    - Power quality and uptime directly affect anode stability and product yield
  - - Inert anode (Fe-Cr alloy)
    - Conducts current into melt; must resist oxidation at 1,600°C continuously
    - Chromium feedstock supply (Outokumpu Kemi mine MOU); alloy manufacturing
    - Anode lifetime under production conditions is the key unresolved technical risk
  - - Molten oxide electrolyte
    - Dissolves iron ore and other oxides; mediates ion transport; maintains cell temperature
    - Iron ore feedstock (various grades); electrolyte chemistry control
    - Electrolyte composition drift affects purity and efficiency; must be tightly controlled
  - - Refractory system (cell lining)
    - Insulates and protects the vessel walls from 1,600°C melt and electrochemical attack
    - High-grade refractory materials; experienced construction and maintenance
    - Brazil refractory failure (Jan 2026) shows this is a live failure mode; engineering risk
  - - Cathode / vessel (steel)
    - Collects liquid iron at cell bottom; structural containment
    - Steel vessel manufacturing; liquid metal handling equipment for tapping
    - Thermal management and tapping logistics at industrial scale not fully demonstrated
  - - Process controls and automation
    - Regulate cell potential, current distribution, electrolyte chemistry, and temperature
    - Sensors, control systems, engineering expertise
    - Critical for anode longevity; Lambotte notes modeling/simulation is essential to scale
  - - Multi-cell plant integration
    - Array multiple cells in parallel to reach plant-scale throughput
    - Civil works, electrical bus systems, cell-to-cell uniformity
    - Not yet demonstrated; demonstration plant is first planned multi-cell system
  - - Oxygen handling and utilization
    - Capture and use/vent pure O₂ byproduct; potential co-product revenue
    - O₂ compression, storage, or distribution infrastructure
    - O₂ monetization pathway not yet publicly described; potential safety/cost item
  notes: Architecture is reconstructed from public sources; engineering parameters such as current density, electrolyte formulation, and cell geometry are proprietary.
