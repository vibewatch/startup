  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: inert anode lifetime
    missingEvidence: Independent or audited data on inert anode service life under continuous production conditions at current industrial-cell scale
    whyItMatters: Anode lifetime is the key determinant of MOE Steel unit economics; without it, the cost-competitiveness analysis cannot be completed and the licensing model lacks a durability foundation
    diligencePath: Request anode replacement log, campaign duration records, and degradation data from the Woburn industrial cell; ask for third-party metallurgical analysis of post-campaign anodes
    relatedQuestionRefs:
    - QE015
  - type: missing-source
    severity: blocking
    topic: demonstration plant status
    missingEvidence: Any public evidence of demonstration plant site selection, capital commitment, engineering contractor, permitting status, or construction timeline for the planned late-2026 commissioning
    whyItMatters: The demonstration plant is the sole near-term gate for steelmaker licensing pipeline and commercial steel revenue; without it, the steel business timeline cannot be verified
    diligencePath: Ask management for site selection status, capital plan, EPC contractor, permitting timeline, and whether the $75M May 2026 funding covers demonstration plant construction
    relatedQuestionRefs:
    - QE014
  - type: private-evidence-only
    severity: material
    topic: MOE process energy consumption
    missingEvidence: Published or independently verified energy consumption data for MOE in kWh or MWh per tonne of steel at the industrial-cell scale
    whyItMatters: Electricity is the dominant operating cost input; without verified energy intensity, the cost-competitiveness of MOE versus BF-BOF and H2-DRI cannot be quantitatively assessed
    diligencePath: Request energy meter data from the Woburn industrial cell campaigns; compare with published blast furnace benchmarks from Columbia CGEP and World Steel Association
    relatedQuestionRefs:
    - QE004
  - type: private-evidence-only
    severity: material
    topic: molten oxide electrolyte formulation
    missingEvidence: Published electrolyte composition, operating parameters (voltage, current density, bath chemistry), and ore composition sensitivity data for the MOE process
    whyItMatters: Electrolyte chemistry governs product purity, cell stability, and energy efficiency; without this data, independent scale-up modeling and cost estimates cannot be validated
    diligencePath: Review patent filings for electrolyte composition claims; request data room access to process specification sheets and cell operating logs
