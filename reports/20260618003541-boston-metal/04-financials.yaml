- id: SEC405
  title: Financial gaps and diligence verdict
  body: 'Boston Metal''s financial picture has a large number of material gaps that prevent underwriting from public sources
    alone. Cash on hand and monthly burn have never been publicly disclosed; the Brazil accident is the clearest signal of
    burn-rate vulnerability. Revenue—including any analyst estimate of $119M in 2025 or 2026— is entirely unsupported in accessible
    public sources; no confirmed sale, price, volume, or customer contract has been disclosed with enough specificity to compute
    a revenue figure. The $51M convertible note terms (investors, interest, maturity, conversion mechanics) are absent from
    any press release or regulatory filing accessible to public research. Gross margin for either the critical-metals or steel-licensing
    segment is not disclosed. Capital intensity for a full-scale MOE Steel demonstration plant has not been publicly projected.
    Post-money valuation for the 2026 round is not disclosed. The Weirton chromium project budget ($161M total, $50M DOE)
    has no published timeline, phase-gate spending plan, or revenue model for the chromium product. The positive financial
    signals are the diversity and strategic depth of the investor syndicate (mining companies, steelmakers, climate-focused
    institutional funds, development-finance institutions), the non-dilutive DOE grant, and the rapid capital mobilization
    following the Brazil accident—all of which indicate continued investor conviction. The negative financial signals are
    the accident-triggered cash crunch, the missed milestone, the April 2026 layoffs, the delayed revenue start, the un-transparent
    convertible note, and the long timeline to steel-licensing revenue. For a diligence process, the minimum required data
    are: current cash position and monthly burn by segment, the full convertible note term sheet, Brazil plant revenue model
    (volume, product mix, offtake pricing), and the MOE Steel demonstration plant capex plan.'
