callouts:
- calloutType: risk
  title: Brazil accident exposed a thin cash cushion
  body: 'The January 2026 refractory leak did not cause injuries or environmental damage, but it exposed that Boston Metal
    had milestone-linked funding that it lost when the plant missed its startup target. The CEO''s admission of "big stress
    in our cash flow" followed by 71 layoffs in April 2026 and an emergency $75M raise in May 2026 suggests the company had
    fewer than four months of comfortable operating headroom at the time of the accident. This is a material risk for any
    investor: a single operational setback at the only revenue-generating asset could again trigger a liquidity event, and
    the September 2026 restart target carries no publicly disclosed contingency capital.'
  claimRefs:
  - CI023
  - CI024
  - CI026
  - CI027
- calloutType: insight
  title: Steel business model is licensing, not production — structurally different from peers
  body: Boston Metal's MOE Steel page explicitly states that "Boston Metal will not produce steel." The revenue model for
    steel is technology licensing plus inert anode sales—a fundamentally capital-light model once the technology is proven.
    This is a markedly different proposition from green-steel peers like H2 Green Steel (Stegra) or HYBRIT, which are building
    and operating steel plants. If licensing works, Boston Metal's steel revenue could carry high gross margins at scale.
    But licensing revenue is contingent on steelmakers committing to MOE deployment, which requires a proven full-scale demonstration
    plant that does not yet exist.
  claimRefs:
  - CI004
  - CI005
  - CI029
