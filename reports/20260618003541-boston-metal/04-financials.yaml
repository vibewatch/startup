- id: SEC402
  title: Capital formation and funding chronology
  body: 'Boston Metal''s capital history spans eight years of sustained institutional support. The company closed a $25M Series
    A in 2018, establishing early validation from Breakthrough Energy Ventures. A $50M Series B closed in January 2021 with
    strategic mining investors including Vale, and the round grew to $60M after BMW i Ventures joined an oversubscribed close
    in July 2021, signalling direct automotive-buyer interest. The landmark Series C raised $262M across multiple tranches:
    a ~$120M first close in January 2023 led by ArcelorMittal XCarb and Microsoft''s Climate Innovation Fund; an IFC up-to-$20M
    equity investment signed in May–June 2023; and a $122M increase in September 2023 led by Aramco Ventures and joined by
    M&G Investments, Goehring & Rozencwajg, and Baillie Gifford. A $20M Series C2 tranche from Marunouchi Innovation Partners
    followed in January 2024, bringing publicly accumulated equity to roughly $357M and total stated capital to $370M as of
    January 2024. In 2025 the company commissioned its first multi-inert-anode industrial MOE cell at Woburn and raised a
    $51M convertible note; the investors and note terms are not publicly disclosed. The May 2026 $75M equity round, which
    includes Tata Steel Limited and existing investors, was characterized by the CEO as crisis-support capital following the
    Brazil accident; it brought total raised above $500M. In addition to equity and the convertible note, Boston Metal received
    a $50M DOE grant for the Weirton chromium project, making the full disclosed capital stack (equity rounds + note + grant)
    approximately $608M—the DOE grant is non-dilutive but project-restricted.'
