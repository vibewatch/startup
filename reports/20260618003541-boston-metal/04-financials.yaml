- id: SEC404
  title: Unit economics and cost structure
  body: 'Boston Metal''s unit economics are not publicly disclosed for either segment. For MOE Critical Metals, the production
    process takes low-grade mining slag (a zero or negative-cost input, since miners pay to store it) and converts it via
    electricity and carbon anodes into niobium, tantalum, and tin ferroalloys. The key cost drivers are electricity (Brazilian
    grid, with a roughly 80–90% renewable share in Minas Gerais), carbon anode consumption (which Boston Metal says is validated
    at commercial scale for critical metals), maintenance of the inert refractory system (the very component that leaked in
    January 2026), and labour. Revenue per unit depends on the output mix: ferroniobium averages approximately $26 per kilogram
    (USGS 2025), tantalum ore around $170 per kilogram Ta₂O₅ equivalent (USGS 2025), and tin at roughly $25–$35 per kilogram
    market price. If the Brazil plant operates at a scale producing tens of tonnes per year of mixed ferroalloys at these
    unit prices, gross revenue would be in the low tens of millions of USD annually—a useful revenue bridge but not transformative
    on its own at current scale. For MOE Steel, the licensing model means Boston Metal''s marginal cost of delivering revenue
    is low (primarily IP maintenance, technical support, and anode manufacturing) once the technology is proven and licensed;
    the gross margin on a licensing model would be high. However, the path to licensing revenue requires proving the technology
    in a full-scale demonstration plant, which the 2025 pilot run at Woburn (one ton of steel over several weeks) has not
    yet achieved. A 2022 academic review cited by MIT Technology Review noted that electricity prices would need to drop significantly
    for MOE to match conventional steelmaking economics, a benchmark that remains unverified in Boston Metal''s public materials.
    No independent techno-economic analysis for either segment has been published in accessible sources.'
