  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue actuals and projections
    missingEvidence: Any revenue figure, revenue recognition schedule, or confirmed sale from either the Brazil critical-metals
      segment or the MOE Steel segment, including validation of any $119M annual revenue estimate.
    whyItMatters: Without confirmed revenue data, the company cannot be underwritten as a revenue-stage business; all financial
      modeling is speculative.
    diligencePath: Request audited or management-reviewed financial statements for fiscal years 2023–2025 and Q1 2026; request
      offtake agreement summaries.
    relatedQuestionRefs:
    - QI012
    - QI013
  - type: private-evidence-only
    severity: blocking
    topic: burn rate and cash position
    missingEvidence: Current monthly cash burn by segment, current cash on hand, and projected runway given the May 2026 $75M
      raise and Brazil restart costs.
    whyItMatters: The Brazil accident showed the company can go from operational setback to layoffs in under four months;
      the residual risk of a repeat event at September 2026 restart is not quantifiable without burn data.
    diligencePath: Request monthly treasury report, latest board deck, and management accounts through April 2026.
    relatedQuestionRefs:
    - QI006
  - type: private-evidence-only
    severity: material
    topic: convertible note terms
    missingEvidence: Full convertible note term sheet including principal amount ($51M), interest rate, maturity date, conversion
      price or mechanism, and identity of noteholders.
    whyItMatters: A convertible note with an aggressive conversion discount or low valuation cap could impose significant
      dilution on future equity investors and affect the relative economics of the May 2026 $75M round.
    diligencePath: Request convertible note term sheet and any amendments; check status (outstanding, converted, or extinguished)
      as of June 2026.
    relatedQuestionRefs:
    - QI004
    - QI025
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross margin — Brazil critical metals
    missingEvidence: Cost of goods sold, gross margin, and unit economics at the Brazil plant at any production scale, including
      electricity cost per tonne of ferroalloy output.
    whyItMatters: The zero-cost slag feedstock thesis is compelling but unverified at scale; if electricity or anode costs
      dominate, the gross margin may not cover operating expenses even at full plant capacity.
    diligencePath: Request production data from any trial runs conducted before or after the January 2026 accident; request
      electricity tariff contract and anode consumption model.
    relatedQuestionRefs:
    - QI008
    - QI011
  - type: missing-source
    severity: material
    topic: $119M revenue estimate provenance
    missingEvidence: A public source, analyst report, company disclosure, or press article that cites or supports a $119M
      revenue figure for Boston Metal in 2025 or 2026; no such source was found in accessible public records.
    whyItMatters: If this figure is circulating in investor materials or secondary research, it may reflect a private company
      projection; if unverified, it is misleading as a benchmark.
    diligencePath: Ask the company directly for the source of any revenue projection; request the financial model or management
      guidance from which this figure was derived.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: material
    topic: MOE Steel demonstration plant capex and timeline
    missingEvidence: A confirmed site, capex budget, and completion date for the first full-scale MOE Steel demonstration
      plant beyond the Woburn pilot.
    whyItMatters: The steel licensing revenue model requires a commercial demonstration before steelmakers will commit to
      licensing; without timeline clarity, the steel segment has no visible path to revenue.
    diligencePath: Request the preliminary engineering estimate and site selection shortlist; check for DOE or state government
      grant applications related to a demonstration plant.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: minor
    topic: post-money valuation and cap table
    missingEvidence: Post-money valuation for any round, convertible note conversion cap, and current cap table showing investor
