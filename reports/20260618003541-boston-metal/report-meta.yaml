  productSummary: MOE steel cells that use electricity instead of coal to convert iron ore into liquid metal, plus MOE critical-metals systems that recover strategic metals from low-grade resources and industrial waste streams.
  customerFocus: Steelmakers, automotive-linked low-carbon steel supply chains, stainless and mining partners, and industrial metals operators seeking critical-metals recovery from waste or lower-grade feedstocks.
  businessModel: License-led steel platform with potential anode and engineering revenue over time, combined with nearer-term direct sales from the Brazil critical-metals operation and government-supported U.S. chromium manufacturing expansion.
  stage: Growth-stage private company; pre-commercial at steel scale, early-commercial in critical metals
  fundingStatus: Over US$500M raised through 2026 including a US$262M Series C close, a US$20M C2 extension, a US$51M 2025 convertible note, and a US$75M 2026 round; DOE grant support adds non-dilutive capital to U.S. manufacturing.
