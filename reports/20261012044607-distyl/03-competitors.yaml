callouts:
  - calloutType: risk
    title: Forward-Deployed Engineering Scaling Bottleneck
    body: Distyl's high-touch deployment model delivers immediate production outcomes within 3 months, but relies heavily on elite forward-deployed engineers. This creates a human-capital scaling constraint and exposes gross margins to professional-services drag compared to pure-play software copilots like Glean.
    claimRefs:
      - CP008
      - CP014
  - calloutType: insight
    title: 'Asymmetric Moat: Context Mesh vs. Workflow Commoditization'
    body: While horizontal AI copilot features face rapid commoditization from foundational model providers and incumbent software platforms, Distyl's durable differentiation hinges on its Context Mesh graph and embedded organizational integrations that create steep enterprise switching costs.
    claimRefs:
      - CP004
      - CP011
