evidenceGaps:
  - type: missing-source
    severity: material
    topic: financials-and-revenue-quality
    missingEvidence: >-
      Audited financial statements, GAAP revenue bridge, ARR breakdown, gross margins, and software versus
      forward-deployed professional services fee mix.
    whyItMatters: >-
      Without verified ARR and margin composition, underwriters cannot evaluate whether Distyl's $1.8B valuation
      reflects high-margin software multiples or consulting service economics.
    diligencePath: >-
      Request audited financial statements, historical revenue cohorts, and billing schedules separating software
      licensing from engineering services under NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: customer-references-and-retention
    missingEvidence: >-
      Identified customer reference accounts, contract terms, annual contract values (ACVs), and net revenue retention
      (NRR) rates.
    whyItMatters: >-
      Distyl reports 50+ Fortune 500 deployments but names zero reference accounts publicly, making customer
      concentration and renewal durability unprovable from public data.
    diligencePath: >-
      Conduct off-list reference calls with procurement and engineering sponsors at enterprise clients across telecom
      and healthcare sectors.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Full capitalization table, liquidation preference seniority, protective covenants, voting agreements, and employee
      option pool reserves.
    whyItMatters: >-
      Preferred share covenants and liquidation preferences govern downside protection for incoming secondary or growth
      equity investors.
    diligencePath: >-
      Inspect the company's certificate of incorporation, Series B investor rights agreement, and cap table ledger
      during confirmatory diligence.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: software-services-revenue-split
    missingEvidence: >-
      Audited breakdown of Distillery recurring software subscription licensing fees versus forward-deployed engineering
      professional services fees across multi-year contracts.
    whyItMatters: >-
      Determines whether Distyl should be valued as a high-margin enterprise SaaS platform (75%+ gross margin) or an
      engineering consulting services firm (35-50% gross margin).
    diligencePath: >-
      Review confidential financial disclosure schedules, customer contract task orders, and GAAP revenue recognition
      audit notes in Series B financial filings.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-pricing-and-margins
    missingEvidence: >-
      Disclosed enterprise contract pricing tiers and gross margin breakdowns across software licensing versus
      forward-deployed engineering services.
    whyItMatters: >-
      Determines whether Distyl's business model commands scalable software margins (>75%) or faces
      professional-services margin compression (40-50%).
    diligencePath: >-
      Request customer contract schedules, master services agreements (MSAs), and gross margin accounting by revenue
      stream.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: displacement-and-churn
    missingEvidence: >-
      Verified enterprise renewal rates, customer displacement case studies, and accounts lost to internal enterprise
      build initiatives or incumbent platforms.
    whyItMatters: >-
      Validates long-term switching costs and moat durability against well-resourced enterprise IT departments and
      incumbent AI tools.
    diligencePath: >-
      Conduct reference calls with CIOs and transformation leads at Fortune 500 customers to evaluate multi-year
      retention and replacement risk.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: revenue quality
    missingEvidence: >-
      Audited revenue, ARR, bookings, billings, backlog, revenue recognition, and software-versus-services revenue and
      gross-profit segmentation.
    whyItMatters: >-
      These records determine whether Distyl has recurring software economics or primarily project-based services
      economics.
    diligencePath: >-
      Review audited financial statements, the revenue waterfall, deferred revenue, backlog, and contract-level
      allocation schedules under NDA.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit economics
    missingEvidence: >-
      CAC, payback, implementation labor, compute allocation, account gross margin, retention cohorts, and customer
      concentration.
    whyItMatters: The embedded delivery model cannot be evaluated for scalability or durability without account-level economics.
    diligencePath: >-
      Request cohort schedules, top-customer concentration, staffing and utilization data, model and cloud costs, and
      gross margin by account.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital adequacy
    missingEvidence: >-
      Current cash, restricted cash, monthly burn, runway, debt, leases, guarantees, project-finance obligations, and a
      quantified operating plan.
    whyItMatters: >-
      The amount raised in a historical financing does not establish current liquidity or the timing of another capital
      need.
    diligencePath: >-
      Obtain the latest balance sheet, monthly cash-flow history, debt and obligation schedule, board-approved budget,
      and downside runway cases.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-concentration
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross renewal rates, multi-year customer expansion trajectories,
      and top-5/top-10 account revenue concentration figures.
    whyItMatters: >-
      Without verified retention and concentration data, underwriters cannot determine whether Distyl's high-ticket
      engagements expand durably into recurring platform ARR or represent non-recurring professional services revenue
      concentrated in a handful of Fortune 500 pilots.
    diligencePath: >-
      Request customer cohort renewal tables, net revenue retention breakdown by vintage, and top-10 customer revenue
      contribution percentages under non-disclosure agreement.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-compliance
