chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与 AI 原生运营模式
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 是一家总部位于旧金山的私营应用型人工智能公司，与财富 500 强企业合作，设计、搭建并部署可用于生产环境的智能体 AI 系统。Distyl 不走纯自助 SaaS 路线，而是把专有企业平台
              Distillery 与嵌入客户团队、前置部署的工程师和策略师配套使用。公司聚焦医疗、电信、保险、金融服务和先进制造等受监管行业中的关键运营环境。依托 Context Mesh
              技术和以结果为导向的项目，Distyl 声称能在约 3 个月内把企业工作流从初步范围界定推到线上生产，并带来可量化的利润表改善。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO008
              - CO011
              - CO012
      - number: '1.2'
        title: 创始人、领导结构与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Distyl 由 CEO Arjun Prakash 和 COO Derek Ho 共同创立，两人都曾在 Palantir Technologies 任职，负责复杂的前置部署企业工程项目。两位联合创始人复刻了
              Palantir 的高接触式前置部署理念，组建了一支来自 OpenAI、Apple 和 Palantir 的工程队伍，解决大规模企业自动化问题。但 Distyl 的高管治理存在明显的关键人物依赖：公司没有公开披露
              CTO、CFO 或全球销售负责人等传统职位的正式高管。此外，Distyl 只发布匿名案例研究，不披露具名客户参考，因而依赖创始团队掌握的客户关系。
            claimRefs:
              - CO002
              - CO005
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO010
      - number: '1.3'
        title: 资本化历史、估值与利益相关方治理
        blocks:
          - type: paragraph
            body: >-
              Distyl 通过 3 轮机构融资累计募得约 $202 million。公司于 2023 年 4 月完成首轮 $7 million 种子轮融资，投资人包括知名运营者 Nat Friedman 和 Brad
              Gerstner；随后于 2024 年 11 月完成 $20 million 的 Series A。2025 年 9 月，Distyl 完成一笔标志性的 $175 million Series B，投后估值为
              $1.8 billion。Series B 由 Khosla Ventures 和 Lightspeed Venture Partners 联合领投，Coatue、Dell Technologies
              Capital 和 DST Global 参与。Nasdaq Private Market 等私募二级市场持续追踪 Distyl 股权的机构兴趣，但底层资本结构、清算优先权和员工期权池仍属机密。
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO007
              - CO009
      - number: '1.4'
        title: 运营里程碑、合作伙伴与执行窗口
        blocks:
          - type: paragraph
            body: >-
              自商业化以来，Distyl 快速扩大运营覆盖，据称其生产系统截至 2025 年底已通过大型企业部署触达超过 120 million 名终端用户，到 2026 年中进一步超过 150
              million。为在封闭的专有模型 API 之外增强技术壁垒，Distyl 于 2026 年 3 月把 NVIDIA AI Enterprise 软件整合进 Distillery，加入 NeMo Agent
              Toolkit、NIM 微服务和 Nemotron 模型，支持长时间运行的自主智能体执行。2026 年 4 月，公司又与 Google Cloud 达成 Gemini Enterprise
              优先合作伙伴关系，在既有 Microsoft Azure 部署之外扩大基础设施。尽管有这些技术里程碑，独立分析师仍提醒，较长的销售周期和高实施成本会持续带来执行风险。
            claimRefs:
