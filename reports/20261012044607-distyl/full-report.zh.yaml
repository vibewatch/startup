  - id: FE001
    title: Distillery 企业 AI 平台架构栈
    type: stack
    summary: Distyl Distillery 企业代理平台的六层架构，从企业数据集成延伸到已部署的运营工作流。
    data:
      layers:
        - label: 生产应用与工作流层
          detail: 面向特定领域的生产界面、客户侧代理触点和垂直行业运营工作流端点，部署在《财富》500 强企业环境中。
          items:
            - 医疗事前授权自动化
            - 电信联络中心与网络智能
            - 制造业供应链与根因分析
            - 保险理赔分流与承保工作流
        - label: 可观测性与反馈层
          detail: 运行时系统监控、边缘案例路由、自动化性能跟踪，以及持续迭代工作流的闭环。
          items:
            - Canary 运行时监控子系统
            - 漂移检测与边缘案例失败路由
            - 生产反馈集成闭环
            - 自动化结果与延迟指标跟踪
        - label: 控制与治理层
          detail: 感知政策的执行控制、确定性评估工具、完整的可审计日志和企业身份管理。
          items:
            - 可追溯的 LLM 与工具执行审计轨迹
            - HIPAA 与 SOC 2 政策执行工具
            - 企业访问控制与 Okta 身份验证
            - 确定性输出评估与验证工具
        - label: 代理编排与沙箱层
          detail: 声明式多代理协同、自主 ReAct 工具调用框架和安全的容器化沙箱环境。
          items:
            - NVIDIA NeMo Agent Toolkit 声明式编排
            - NVIDIA NemoClaw 与 OpenShell 安全执行沙箱
            - 确定性 AI-Q 深度研究管线
            - 动态子代理生成与任务路由
        - label: 模型推理与运行时层
          detail: 多云基础模型访问、专业化开放权重模型服务和高吞吐推理微服务。
          items:
            - 通过战略合作伙伴关系接入 OpenAI 前沿模型
            - Anthropic Claude 模型基础设施访问
            - Google Cloud Gemini Enterprise 优先合作伙伴关系
            - NVIDIA NIM 微服务与 Nemotron 3 Super (120B)
        - label: Context Mesh 与企业数据层
          detail: 可持续遍历的图基础设施连接企业数据库、情景记忆和业务规则，无需迁移数据。
          items:
            - 可遍历的 Context Mesh 活图基础设施
            - 将企业 SOP 转换为可审计例程
            - 情景运营记忆与持久状态存储
            - 直连 EHR、CRM、ERP 和旧数据库
    approximationNotes: 架构结构综合了 Distyl 技术公告、Substack 工程披露和独立技术拆解。
    claimRefs:
      - CE004
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 将《财富》500 强企业从高管赞助到组织转型的参与过程分为六个阶段。
    data:
      items:
        - label: 高管问题对齐
          detail: 《财富》500 强企业的 C-suite 赞助人（COO、CIO、CTO）识别高价值且高度依赖人工的企业运营瓶颈。
          touchpoints:
            - C-suite 战略简报
            - 瓶颈范围界定工作坊
        - label: 知识与上下文建模
          detail: 嵌入式前置部署工程师将孤立的企业数据、SME 的隐性判断和政策规则导入 Context Mesh。
          touchpoints:
            - SME 知识提取会议
            - Context Mesh 本体构建
        - label: 协作式自然语言编写
          detail: 领域专家和 Distyl 工程师用自然语言指令配置并测试代理工作流。
          touchpoints:
            - Autonomous Solution Delivery 画布
            - 人在环政策审查
        - label: 生产治理与试点交付
          detail: Distillery 的 Control Layer 在 3 个月内建立可验证的审计轨迹、版本控制和合规日志。
          touchpoints:
            - 审计轨迹与治理签核
            - 3 个月生产部署
        - label: 持续监控与改进
          detail: Canary 监控系统跟踪运行时决策质量，并将失败边缘案例反馈到 Context Mesh。
          touchpoints:
            - Canary 运行时评估
            - 自动化错误反馈闭环
        - label: 多年期扩张与横向规模化
          detail: 部门层面的成功结果推动多年期企业转型协议，扩展到相邻业务部门。
          touchpoints:
            - 与结果挂钩的里程碑审计
            - 相邻业务部门扩张
    approximationNotes: 生命周期阶段综合了 Distyl 架构披露、部署时间线和客户引入模式。
    claimRefs:
      - CU002
      - CU013
      - CU014
