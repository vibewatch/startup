      - number: '5.2'
        title: Distillery 架构、Context Mesh 与多运行时执行
        blocks:
          - type: paragraph
            body: >-
              Distillery 平台的技术架构分为 4 个主要功能层：由 Context Mesh 驱动的上下文层、用于编写工作流的解决方案交付层、负责治理和可追溯性的企业控制层，以及应用部署层
              [CE007]。Context Mesh 的核心不再是平面的检索增强生成和静态向量索引，而是把组织的明示规则、隐性知识、情景记忆、工作流和领域逻辑建模成可遍历的实时图谱
              [CE008]。自主智能体会有目的地遍历这张图谱，检查运营状态、调用具体业务例程，并在长期运行的企业任务中写回持久状态 [CE008]。


              为满足不同企业的合规、延迟和主权要求，Distyl 的运行时执行层支持多种基础设施和模型配置 [CE009]。平台主要运行在 Microsoft Azure 上，使用 OpenAI 和 Anthropic
              的前沿模型；2026 年 3 月，Distyl 又把 NVIDIA AI Enterprise 软件栈整合进 Distillery [CE007, CE009]。该集成包括用于声明式编排的 NVIDIA NeMo
              Agent Toolkit、用于安全容器化智能体执行的 NVIDIA NemoClaw 和 OpenShell 运行时，以及部署开放的 120-billion-parameter Nemotron 3 Super
              基础模型的 NVIDIA NIM 微服务 [CE009, CE010]。2026 年 4 月，Distyl 又成为 Google Cloud 上的 Gemini Enterprise
              优先合作伙伴，进一步扩大多云覆盖 [CE007]。
            claimRefs:
              - CE007
