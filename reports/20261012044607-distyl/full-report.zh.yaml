  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达范围与服务—软件连续体
        blocks:
          - type: paragraph
            body: >-
              Distyl 在企业人工智能版图中处于独特位置，位于企业软件平台与专业工程咨询的交界处。它不提供独立的横向软件许可证或自助开发者 API，而是把专有 Distillery 平台与直接嵌入财富 500
              强客户组织的前置部署工程团队打包交付。这种模式明确排斥止步于战略路线图和建议的泛管理咨询，也排斥把集成负担推给企业 IT 部门的轻量横向自动化工具。Distyl
              以多年期转型合作的方式签约，合同总额可达数千万美元，并经常把商业条款与实际运营效率挂钩。其可触达边界不包括快速迭代的消费级 AI
              应用、部门级点解决方案和中小企业工作流，而是集中服务重监管行业中复杂且后果重大的企业运营流程。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模视角、机会漏斗与估值基准
        blocks:
          - type: paragraph
            body: >-
              衡量企业智能体自动化市场，必须把宏观 IT 预测与高接触式前置部署服务的现实产能约束区分开。行业分析师预计，到 2028 年全球企业在生成式 AI 软件、基础设施和实施服务上的支出将达到 $150
              billion；但嵌入式工程部署的近期可服务市场，受限于企业是否愿意开放深层系统权限，以及是否愿意承诺多年期数千万美元预算。              Distyl 在 2025 年 9 月完成 $175
              million Series B 后，投后估值跃升至 $1.8 billion；要评估隐含估值倍数，必须先看当前运营规模。独立研究估计，Distyl 2025 年 ARR 约为 $31 million，覆盖超过
              50 个企业部署，对应超过 50 倍 ARR 的高溢价估值。尽管公司声称生产智能体每年为 120 million 名终端用户处理超过十亿个决策，真正可服务且可获得的市场仍由交付能力决定；当前约 159
              名员工限制了同时运行的嵌入式项目组数量。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM008
      - number: '2.3'
        title: 买方分层、采购动态与预算归属
        blocks:
          - type: paragraph
            body: >-
              Distyl 解决方案的采购动态，反映了核心运营自动化的高组织风险和跨职能复杂度。项目很少由部门业务负责人发起；真正的经济买方通常是 COO、CIO
              和首席转型官，他们肩负重构机构工作流的高管任务。在医疗、电信、保险和金融服务等受监管行业，采购过程要经过合规官、安全架构师和企业法律顾问的严格审查。企业客户要求完整的合规包，包括 SOC 2 Type II
              认证、基于角色的访问控制，以及能把每次模型推理和决策输出追溯到源文档的详细审计日志。由于 Distyl
              把前置部署工程师嵌入客户专有数据环境，销售周期需要深层高管信任和多方治理对齐；工作流进入生产后，早期的高准入门槛会转化为显著的切换成本。
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动、企业采纳约束与规模化困境
        blocks:
          - type: paragraph
            body: >-
              推动 Distyl 获得企业客户的首要增长动力，是财富 500 强管理层对内部 AI 实验停滞、独立软件试点迟迟无法进入生产的普遍不满。              Distyl 承诺在 3
              个月内交付可运行的生产系统，为急于证明业务影响的企业发起人提供了具体的风险缓释框架。平台的 Context Mesh 架构还能把碎片化的企业标准作业流程映射成结构化、可遍历的知识图谱，加快价值落地。2026
              年，Distyl 通过战略企业联盟扩大分发覆盖，把 NVIDIA AI Enterprise 整合进 Distillery，并加入 Google Cloud Gemini Enterprise
              转型计划。但严重的结构性约束会压低增长斜率：源自 Palantir 的前置部署工程模式高度依赖顶尖 AI 工程师；深度客户定制则可能积累难以标准化、难以形成软件杠杆的定制代码库。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 前置部署工程模式打开八位数合同，却受产能限制
            body: >-
              Distyl 以结果负责的部署结构，把高级工程项目组派到客户现场，直到工作流进入生产，成功跨过企业采纳鸿沟。这个模式能拿下数百万美元承诺，也避开常见的 SaaS
              试点流失，但从结构上看，短期收入扩张取决于技术人员数量增长，而不是软件分发接近零的边际成本。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              企业生成式 AI 已从实验性的模型测试转向运营执行，企业工作流自动化因此出现不同的竞争路径。Distyl AI 让顶尖工程人才与专有 Distillery 平台并行部署，处在纯 SaaS
              平台和传统系统集成商之间的差异化混合位置。直接替代者大致分为 5 类：Palantir Technologies 等高接触式企业老牌厂商；Glean 等企业知识图谱和搜索平台；StackAI
              等敏捷低代码/无代码工作流构建器；Moveworks 和 Aisera 等嵌入式工作区助手；以及企业 IT 部门自行搭建的现状方案。横向 copilot 厂商能在常见办公工具上快速完成 SaaS
              上线，但难以处理关键运营所需的复杂、非标准业务逻辑和严格治理。Distyl 面向需要端到端结果交付、而非原始开发者工具包的企业买方，同时对抗内部惰性和传统软件厂商。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP008
              - CP012
      - number: '3.2'
        title: 竞争者画像与战略定位
        blocks:
          - type: paragraph
            body: >-
              直接比较竞争者可以看出，企业 AI 厂商在市场进入策略和资本效率上差异明显。Palantir 仍是 Distyl 的首要运营标杆，依托 Foundry 和 AIP
              提供成熟的企业本体，并有数十年政府关系和数十亿美元资产负债表支撑。但 Palantir 部署周期长、价格高，为 Distyl 在三个月内交付针对性生产结果留下了空间。在知识和搜索领域，Glean 已迅速扩张至
              ARR 超过 $200 million、估值 $7.2 billion，在标准 SaaS 应用中的横向办公信息检索占据主导，却没有覆盖复杂的运营决策工作流。同样，StackAI 和 UnifyApps 用快速
              API 连接器和无代码构建器赋能业务开发者及 IT 团队，却缺少重建核心决策基础设施所需的前置部署工程能力。Distyl 通过直接接入专业系统和前沿基础模型，利用这一运营缺口，包括 NVIDIA AI
              Enterprise 和 NeMo Agent 软件，为关键企业智能体提供动力。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP007
              - CP009
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP009
              - CP011
      - number: '3.3'
        title: 功能能力与定价架构
        blocks:
          - type: paragraph
            body: >-
              对平台架构和商业打包方式的考察，凸显自助 SaaS 产品与定制化企业合作之间的结构差异。Distillery 平台以 Context Mesh
              为核心：它不止于平面的检索增强生成，而是持续维护一个包含组织知识、制度政策和有状态智能体记忆的实时图谱。平台还包括 SME
              Cockpit，让企业领域专家在严格审计日志和版本控制下共同调整智能体行为。商业化方面，Distyl 按高价值企业结果定价，而非采用普通的按席位 SaaS 指标，预计每年合同金额在 $500,000 至 $2
              million 以上。相比之下，StackAI 的低门槛订阅套餐每月 $199 起，Glean 的标准按用户席位定价约为每位用户每月 $50 起。结果导向定价在自动化复杂运营工作流时可能带来可观
              ROI，但相较自下而上的 SaaS 采纳，它也提高采购门槛并需要 C 级高管支持。
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP010
              - CP013
