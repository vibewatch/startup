            body: >-
              公开运营模式明显依赖人力。Distyl 表示工程师会定制
              Distillery；第三方画像则称，嵌入式策略和工程团队会在多年期合作期间留在客户身边。这说明服务交付成分很重，但无法看出利用率、人员配比、薪酬、各账户实施时长，或模型和云成本由哪一方承担。Distyl
              2026 年关于 NVIDIA 的公告还表明，运行时选择会根据成本、延迟和治理要求调整，因此基础设施经济性取决于合同和工作负载，并不存在单一可观察的单位成本。StackAI
              撰写的竞争者比较指出投资高、依赖供应商；这可作为买方经济性的反向证据，但不是独立的利润率基准。公开资料没有 CAC、回本期、毛利率、留存或客户集中度数据来回答这些问题。
