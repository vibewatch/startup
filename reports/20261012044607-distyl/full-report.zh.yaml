      - number: '3.4'
        title: 切换成本、壁垒持久性与不利风险
        blocks:
          - type: paragraph
            body: >-
              Distyl 的防御力取决于前置部署客户项目中实现的组织集成深度。一旦嵌入电信开通、医疗事前授权或工业制造根因分析等核心企业系统，Distyl 就能建立很高的切换成本和客户锁定。客户企业若要复制 Distyl
              嵌入的定制业务逻辑、数据管道和 Context Mesh 关系，必须承担昂贵的再工程项目。不过，Distyl
              也面临明显的战略和运营风险。首要风险是前置部署工程固有的毛利率压缩：如果客户增长要求稀缺顶尖工程人才按线性速度扩张，毛利率可能更像技术赋能服务，而不是软件倍数。与此同时，基础模型供应商和 ServiceNow
              等大型软件巨头快速打包功能——后者刚以 $2.85 billion 收购 Moveworks——可能把相邻工作流能力商品化，迫使 Distyl 持续守住专有工作流优势。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP014
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 前置部署工程的规模化瓶颈
            body: >-
              Distyl 的高接触式部署模式能在 3 months 内交付生产结果，但高度依赖顶尖前置部署工程师。这会形成以人力资本为约束的规模化瓶颈，并让毛利承受专业服务拖累，相比 Glean 等纯软件 copilot
              更为不利。
            calloutType: risk
            claimRefs:
              - CP008
              - CP014
          - type: callout
            title: 非对称壁垒：Context Mesh 对比工作流商品化
            body: 横向 AI copilot 功能正受到基础模型供应商和传统软件平台的快速商品化冲击；Distyl 的持久差异化则依靠 Context Mesh 图谱和嵌入式组织集成，由此建立很高的企业切换成本。
            calloutType: insight
            claimRefs:
              - CP004
              - CP011
