              Distyl 将其产品描述为由可复用 Distillery 软件加速器构建的定制企业解决方案，并明确把交付模式与传统 SaaS
              区分开。独立目录证据给出更具体但仍未经验证的变现描述：仅通过联系获取报价、与结果挂钩的项目费用、经常性 Distillery 平台许可证，以及多年期合作。竞争者比较也把 Distyl
              描述为服务驱动的合作伙伴，而非独立软件产品。综合来看，这些来源支持“服务加平台”的混合模式假设，却不能量化收入构成。公开资料没有价目表、合同明细、收入确认政策，也没有证据把实施费与经常性许可证收入分开。因此，核心尽调任务是把已签合同和账单拆解为经常性软件、项目服务、或有对价及任何转嫁的基础设施成本。
