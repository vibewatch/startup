  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与合规敞口
        blocks:
          - type: paragraph
            body: >-
              Distyl AI 在医疗、保险、电信和金融服务等高风险、强监管企业行业运营；在这些领域，运营错误会带来严厉监管处罚和法律责任。把自主 AI 智能体部署到核心工作流，会使公司暴露于不断演变的全球 AI
              治理制度之下，尤其是欧盟 AI 法案。受欧洲司法管辖的企业客户要求高风险 AI 部署具备严格的可解释性、透明度和合规评估，这会给自主推理系统的落地增加摩擦。为应对这些要求，Distyl 为 Distillery
              配备可审计例程和完整日志机制，追踪大语言模型调用、工具激活和决策路径。但企业 AI
              转型需要深度接入旧有企业数据架构，并进行广泛组织变革管理，导致销售周期拉长、执行风险升高。若无法阻止智能体在保险理赔裁定或医疗数据路由等敏感客户场景中产生幻觉或泄露数据，可能引发监管执法、合同赔偿责任，并损害
              Distyl 在财富 500 强客户中的声誉。
            claimRefs:
              - CR004
              - CR007
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR007
              - CR012
              - CR013
      - number: '7.2'
        title: 运营规模化、交付模式与质量保证风险
        blocks:
          - type: paragraph
            body: >-
              Distyl 商业模式的核心运营弱点，是高度依赖前置部署工程（FDE）团队，而不是自助软件平台。截至 2026 年中，公司估计约有 159
              名员工；它把专门的策略师和工程师直接嵌入客户运营，多年期合作往往需要数月才进入生产。白手套模式能赢得企业信任并深度定制标准作业流程，却从根本上限制了公司能同时执行的部署数量。此外，Distyl
              没有提供客户工程师可独立操作的免辅助自助智能体构建器，使企业买方被锁定在持续咨询合作中。这种服务密集型架构压低软件规模化经营杠杆，并让公司暴露于竞争激烈的 AI
              工程市场中的人才招聘和留任瓶颈。更令商业尽调困难的是，Distyl 在 G2、Capterra 或 Hacker News
              等独立软件评估平台上没有公开存在感或客户评价，第三方无法验证用户满意度、部署持久性和软件可靠性。
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
      - number: '7.3'
        title: 合作伙伴依赖、云平台与模型供应商风险
        blocks:
          - type: paragraph
            body: >-
              Distyl 的技术架构高度依赖基础模型、云基础设施和硬件加速层的外部技术合作方。公司已整合 NVIDIA AI Enterprise 软件栈，包括 NVIDIA NeMo Agent
              Toolkit、Nemotron 开放模型和 NIM 微服务，用于编排复杂企业例程。该合作能提升推理性能并提供企业运行时框架，但 Distyl 仍依赖 OpenAI、Anthropic
              等外部基础模型供应商提供前沿推理能力。上游 API 定价变化、商业许可条款变更、速率限制或意外模型弃用，都可能扰乱在线企业工作流并压缩毛利率。竞争上，Distyl 还面临 Palantir
              Technologies 的强劲压力；其 Artificial Intelligence Platform（AIP）瞄准的正是同一财富 500 强运营工作流自动化市场。Palantir
              拥有成熟的数十亿美元企业和政府关系、超过 $4 billion 收入运行率对应的资产负债表储备，以及经受市场检验的前置部署交付体系，直接挑战 Distyl 的企业扩张。
            claimRefs:
              - CR002
              - CR009
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR006
              - CR009
              - CR015
      - number: '7.4'
        title: 财务可持续性、估值悬置与止损标准
        blocks:
          - type: paragraph
            body: >-
              Distyl 的资本化画像体现出极快的估值上升速度，使后期投资者面临显著下行风险。2025 年 9 月完成 $175 million Series B 后，Distyl 投后估值达到 $1.8
              billion；相较 2024 年底据报的 $200 million 估值，九个月内飙升至九倍。累计融资约 $202 million，来自种子轮、Series A 和 Series B。但 Distyl
              从未公开披露经审计 ARR、GAAP 毛利率、客户续约队列或净留存率。多年期企业合同据报道可达数千万美元，但定价围绕结果里程碑，可能延迟收入确认并带来回款不确定性。通过 Nasdaq Private Market
              等平台撮合的私募二级交易仍受公司转让审批和流动性不足的交易环境约束。本投资论点的明确止损标准包括：因专业服务拖累导致毛利率低于 50%；头部三个账户贡献超过 60% 收入的客户集中；企业上线期间实施失败率超过
              20%；或 Palantir AIP 在核心行业的竞争性正面对决中赢得多数测试。
            claimRefs:
              - CR001
              - CR006
              - CR011
              - CR012
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR011
              - CR013
              - CR015
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 前置部署工程瓶颈
            body: Distyl 依赖定制化前置部署工程团队，且约有 159 名员工，这为同时执行的财富 500 强部署设下固有上限，也让公司承受类似咨询业务的利润率压力。
            calloutType: risk
            claimRefs:
              - CR003
              - CR010
          - type: callout
            title: 估值倍数上升速度对比披露不透明
            body: 九个月内估值倍数上升 9x、估值达到 $1.8 billion，代表极高的市场预期，但目前没有公开 ARR、毛利率或客户队列留存数据予以佐证。
            calloutType: insight
            claimRefs:
              - CR001
              - CR011
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究，而不是买入。Distyl 公司发布的融资公告确认了 $175 million 轮次和 $1.8 billion 估值；独立数据库和分析则报告三轮累计融资 $202
              million。这些事实确认的是融资背景，而不是回报逻辑。Revenue Memo 表示公开渠道没有销售额，因此无法把已报告收入倍数与估值对照；Series B
              公告对盈利能力的描述同样没有量化。在缺少经审计收入、经常性收入构成、毛利率、留存、现金消耗和证券条款的情况下，既算不出目标回报，也无法计算有防守力的入场区间。因此，价格纪律意味着：在数据室审阅补齐缺失分母和优先股堆叠之前，不给出肯定的估值建议。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV012
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是，Distyl 能把困难的企业工作流转化为持久的平台关系。Sacra 描述了把 Distillery 访问权与嵌入式咨询结合起来的多年期合同；Distyl 报告生产部署和广泛的终端用户覆盖；公司还在通过
              NVIDIA AI Enterprise 持续增加基础设施能力。反论点是，交付仍高度服务化：StackAI 将 Distyl
              定性为服务驱动的解决方案伙伴，而非独立产品，并强调其成本高、依赖供应商、早期价值落地较慢。公开证明也难以核验，因为 Beri
              报告客户未具名、案例研究已匿名。决定性问题在于：初次搭建完成后，平台经常性收入能否在客户留存的同时，以快于前置部署人力的速度扩张。
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 融资、可比公司与资本结构
        blocks:
          - type: paragraph
            body: >-
              公开融资证据在最新一轮融资和累计资本额上相互一致，但没有披露持股、清算优先权、跟投、受偿顺位、期权池或投资者权利的 细节。Revenue Memo 报告称公司没有债务，且截至 2026 年没有更晚的融资或 IPO
              申报；这提供了有用背景，但不能证明没有发生 私下交易。现有可比公司集合也很薄弱：Tracxn 识别出竞争拥挤的市场，并公布了 Tredence、G42 和 Nara Logics 的融资总额，
              但募资额不是企业价值，而且这些业务横跨咨询、基础设施和 NLP 服务。不能把这些数字直接换算成估值倍数。合格的可比分析需要 对齐收入质量、增长、毛利率、服务业务占比，以及当前股权或交易价值。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV012
              - CV015
      - number: '8.4'
        title: 情景、退出准备度与尽调
        blocks:
          - type: paragraph
            body: >-
              这些情景刻意保持定性，因为指定的公开证据不足以支撑数值估值区间或概率判断。乐观情景要求 Distillery 授权收入和可复用的工作流组件
              增长快于嵌入式交付投入，并由独立客户背书验证续约与扩容。基准情景是一个有价值但高度依赖人力的混合模式，其经济性尚不能套用
              软件估值倍数。若高成本、供应商依赖或部署后的留存疲弱让模式更像咨询业务，悲观情景就是估值倍数下压。退出准备度未经证明： Revenue Memo 报告称截至 2026 年 10 月没有 IPO
              申报。最终尽调应测试客户群留存、客户集中度、分部利润率、现金跑道、资本表， 以及在前置部署人员不同比例增加的情况下合同能否持续。
            claimRefs:
              - CV004
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 公开记录支持设置尽调门槛，而非给出目标价格
            body: $1.8 billion 的融资估值可被观察到，但指定证据不足以支持当前企业价值、收入倍数、回报目标或按概率加权的区间。应等到取得经审计的经营数据和完整的优先股堆叠后，再作出明确的投资决策。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV015
