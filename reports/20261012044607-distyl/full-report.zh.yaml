  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 从已验证的融资与运营证明出发，依次审视尚未厘清的经济性、风险、估值立场，最终作出决策。
    data:
      nodes:
        - id: financing
          label: 已验证的融资估值
          detail: $175M 轮融资，公司宣布估值为 $1.8B
        - id: operating-proof
          label: 运营证明
          detail: 公司披露的生产覆盖范围，以及持续推进的平台集成
        - id: economics-gap
          label: 经济性缺口
          detail: 没有公开收入倍数、分部利润率或留存队列数据
        - id: model-risk
          label: 商业模式风险
          detail: 嵌入式交付可能限制软件式规模化
        - id: valuation
          label: 估值立场
          detail: 价格缺少公开运营分母，因此估值偏高
        - id: decision
          label: 建议
          detail: 等待经审计指标和安全条款，继续研究
    approximationNotes: 这只是定性顺序；除已报告的融资估值外，节点顺序不代表权重、概率、转化率或估值金额。
    claimRefs:
      - CV001
      - CV008
      - CV009
      - CV012
      - CV015
      - CV016
