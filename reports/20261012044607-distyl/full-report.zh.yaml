    type: pyramid
    summary: 从全球企业 AI 服务支出总额，到 Distyl 高接触式 FDE 可服务市场的分层机会规模。
    approximationNotes: 数值综合行业研究和估算的企业 IT 预算；较低层级反映高接触式合作的约束。
    data:
      items:
        - label: 全球企业 AI 软件与服务 TAM
          value: 150
          unit: USD Billion
          detail: 企业在生成式 AI 基础设施、软件和专业部署服务上的预计总支出。
        - label: 《财富》500 强 / 全球 2000 强转型支出
          value: 45
          unit: USD Billion
          detail: 核心运营流程重构对应的可争取咨询和实施预算。
        - label: 受监管垂直行业运营自动化 SAM
          value: 18
          unit: USD Billion
          detail: 医疗、电信、金融服务和制造业运营的目标支出，这些运营要求完整可审计性。
        - label: 定制化前置部署 AI 解决方案市场
          value: 6
          unit: USD Billion
          detail: 与 Palantir 和一线系统集成商竞争的高接触式嵌入工程合作。
        - label: Distyl 可服务可获得市场（SOM）
          value: 1.2
          unit: USD Billion
          detail: 受员工数量（约 159 人）和嵌入式 3 个月部署小组带宽限制的管线容量。
        - label: Distyl 当前签约与运行率收入基础
          value: 0.031
          unit: USD Billion
          detail: 据研究估算，在 50+ 个企业生产部署中，未经审计的 ARR 为 ~$31M。
    claimRefs:
      - CM005
      - CM008
