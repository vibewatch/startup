  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与嵌入式交付模式
        blocks:
          - type: paragraph
            body: >-
              Distyl 将其产品定义为纵向一体化的企业 AI 平台，把专有软件与嵌入式前置部署工程团队结合起来 [CE001]。Distyl
              不授权独立的自助软件工具，也不提供无边界咨询，而是把自己的人工智能工程师和策略师直接嵌入客户运营环境，设计、部署并落地定制工作流 [CE001, CE003]。每次部署的基础都是
              Distillery——Distyl 的专有企业 AI 平台，它把组织知识、标准作业流程和业务政策转化为可审计的执行工作流 [CE002, CE004]。


              这种混合运营模式直面企业 AI 试点瓶颈：企业可以通过通用 API 接入试验前沿基础模型，却缺少关键生产环境所需的全栈数据集成、治理和应用框架 [CE005]。Distyl
              的嵌入式团队直接接入现有企业数据基础设施，包括电子健康记录、客户关系管理系统、企业资源规划数据库和旧式交易记录，无需先迁移数据或替换核心平台 [CE006]。多年期财富 500 强合同的运营目标，是在约 3
              个月内把复杂的多系统工作流从初步范围界定推到生产级部署，并共同对业务结果负责 [CE001, CE003]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
