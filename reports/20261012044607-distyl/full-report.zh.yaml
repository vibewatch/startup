        title: 展示材料
        blocks:
          - type: callout
            title: 尽调总结：以 Palantir 式前置部署能力支撑高溢价平台估值
            body: >-
              Distyl 把专有的 Distillery 编排平台与嵌入式前置部署工程团队结合起来，拿下高价值财富 500 强合同，并支撑 $1.8 billion
              估值。但由于所有客户项目都保持匿名、财务表现未经审计，要评估公司估值，仍需直接核实软件与服务收入的构成、合同续约队列，以及创始管理层的关键人物留任情况。
