        - Underwriting officers, fraud investigation specialists, compliance auditors
        - Head of Credit & Lending Operations (Credit risk budget)
        - Instant loan origination fraud screening and multi-source credit portfolio underwriting
        - Escalating automated fraud attacks and high friction in manual loan file validation
