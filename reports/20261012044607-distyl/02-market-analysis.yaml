callouts:
  - calloutType: insight
    title: The Forward-Deployed Engineering Model Unlocks 8-Figure Contracts but Imposes Capacity Limits
    body: Distyl outcome-accountable deployment structure successfully bridges the enterprise adoption chasm by committing senior engineering pods to client sites until workflows reach production. While this motion secures multi-million-dollar commitments and bypasses typical SaaS pilot abandonment, it structurally links near-term revenue scalability to technical headcount expansion rather than the near-zero marginal cost of software distribution.
    claimRefs:
      - CM001
      - CM002
      - CM014
