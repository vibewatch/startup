company:
  name: "Distyl"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a hybrid, high-touch model that combines bespoke implementation with Distillery software, but pricing and realized revenue composition are not disclosed. A $175 million company-announced financing and claimed profitability improve the capital narrative, yet neither establishes cash available or runway, leaving revenue quality, margins, concentration, and burn as material underwriting gaps."
sections:
  - id: "revenue-model"
    title: "A hybrid model, not a disclosed SaaS schedule"
    body: >-
      Distyl describes its offer as tailored enterprise solutions built with reusable Distillery
      software accelerants, explicitly distinguishing the delivery model from traditional SaaS.
      Independent directory evidence adds a more specific, but still unverified, monetization
      description: contact-only pricing, outcome-contingent project fees, a recurring Distillery
      platform license, and multi-year engagements. A competitor comparison similarly characterizes
      Distyl as a service-led partner rather than a standalone software product. Together, these
      sources support a hybrid services-plus-platform hypothesis, not a quantified revenue mix.
      There is no public rate card, contract schedule, recognized-revenue policy, or evidence that
      separates implementation fees from recurring license revenue. The central diligence task is
      therefore to reconcile signed contracts and billings into recurring software, project
      services, contingent consideration, and any pass-through infrastructure costs.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "delivery-economics"
    title: "Delivery intensity is visible; unit economics are not"
    body: >-
      The public operating model is labor-bearing. Distyl says its engineers customize Distillery,
      while third-party profiles describe embedded strategy and engineering teams that remain with
      customers through multi-year engagements. That structure indicates a meaningful
      service-delivery component, but it does not reveal utilization, staffing ratios, compensation,
      implementation duration by account, or which party pays model and cloud costs. Distyl's 2026
      NVIDIA announcement also shows that runtime choices can be selected for cost, latency, and
      governance, making infrastructure economics contract- and workload-specific rather than a
      single observable unit cost. StackAI's competitor-authored comparison flags high investment
      and vendor dependency; it is useful adverse evidence about buyer economics, not an independent
      margin benchmark. No public CAC, payback, gross margin, retention, or customer-concentration
      data closes these questions.
    claimRefs:
      - "CI006"
      - "CI011"
      - "CI012"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "capital-and-verdict"
    title: "Funding strengthens optionality but does not prove runway"
    body: >-
      A company-issued September 2025 release announced $175 million of financing at a $1.8 billion
      valuation and described Distyl as backed by profitability. The same release claimed more than
      120 million end users, hundreds of millions in customer operating impact, and $23 million of
      annual savings for one healthcare client. These are customer-outcome and financing claims:
      they are not Distyl revenue, ARR, accounting profit, cash on hand, or cash generation.
      Capital adequacy therefore remains unquantifiable because the retained public record does not
      disclose balance-sheet cash, burn, runway, debt, project-finance obligations, or a quantified
      use-of-funds plan. Directory data also conflicts: StartupHub reports $475 million raised,
      while Exa still reports a stale $27 million total that omits the later company-announced
      round. The financial verdict is research-more: the delivery model may support large contracts,
      but revenue quality, margin path, capital intensity, and financing dependency require primary
      financial and contractual evidence.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI013"
      - "CI015"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Funding raised is not cash available"
    body: "The $175 million financing establishes a historical inflow, not the current cash balance, burn rate, debt load, or runway. Those quantities remain unavailable in the assigned public evidence."
    claimRefs:
      - "CI007"
      - "CI013"
  - calloutType: "recommendation"
    title: "Underwrite from contracts and financial statements"
    body: "Require a revenue waterfall, software-versus-services gross margin, customer cohorts, top-account concentration, cash and debt schedules, and a monthly operating plan before assigning a recurring-software multiple."
    claimRefs:
      - "CI012"
      - "CI013"
