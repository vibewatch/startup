              - CI013
          - type: callout
            title: Underwrite from contracts and financial statements
            body: >-
              Require a revenue waterfall, software-versus-services gross margin, customer cohorts, top-account
              concentration, cash and debt schedules, and a monthly operating plan before assigning a recurring-software
              multiple.
            calloutType: recommendation
            claimRefs:
