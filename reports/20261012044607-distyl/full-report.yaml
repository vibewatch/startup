  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and the Embedded Delivery Model
        blocks:
          - type: paragraph
            body: >-
              Distyl defines its product offering as a vertically integrated enterprise AI platform that pairs
              proprietary software with embedded forward-deployed engineering teams [CE001]. Rather than licensing a
              standalone self-serve software tool or delivering open-ended consulting, Distyl embeds its own artificial
              intelligence engineers and strategists directly into customer operational environments to design, deploy,
              and operationalize custom workflows [CE001, CE003]. At the foundation of every deployment is Distillery,
              Distyl's proprietary enterprise AI platform that transforms organizational knowledge, standard operating
              procedures, and business policies into auditable execution workflows [CE002, CE004].


              This hybrid operating model directly addresses the enterprise AI pilot bottleneck, where organizations
              experiment with frontier foundation models through generic API access but lack the full-stack data
              integration, governance, and application harnesses required for mission-critical production [CE005].
              Distyl's embedded teams connect directly to existing enterprise data infrastructure—including electronic
              health records, customer relationship management systems, enterprise resource planning databases, and
              legacy transactional records—without demanding prior data migration or core platform replacement [CE006].
              The operational goal across multi-year Fortune 500 contracts is taking complex, multi-system operational
              workflows from initial scoping to production-grade deployment within approximately three months,
              establishing shared commercial accountability for business outcomes [CE001, CE003].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
            claimRefs:
              - CE004
              - CE007
              - CE008
              - CE009
              - CE010
      - number: '5.2'
        title: Distillery Architecture, Context Mesh, and Multi-Runtime Execution
        blocks:
          - type: paragraph
            body: >-
              The technical architecture of the Distillery platform is structured across four primary functional tiers:
              a context layer powered by Context Mesh, a solution-delivery layer for authoring workflows, an enterprise
              control layer for governance and traceability, and an application deployment layer [CE007]. At its core,
              the Context Mesh moves past flat retrieval-augmented generation and static vector indices by modeling an
              organization's explicit rules, tacit knowledge, episodic memory, workflows, and domain logic as a
              traversable, living graph [CE008]. Autonomous agents navigate this graph deliberately to survey
              operational state, invoke specific business routines, and write back persistent state across long-running
              enterprise tasks [CE008].


              To accommodate diverse enterprise compliance, latency, and sovereignty requirements, Distyl's runtime
              execution layer supports multiple infrastructure and model configurations [CE009]. While running primarily
              on Microsoft Azure with frontier models from OpenAI and Anthropic, Distyl integrated the NVIDIA AI
              Enterprise software stack into Distillery in March 2026 [CE007, CE009]. This integration incorporates the
              NVIDIA NeMo Agent Toolkit for declarative orchestration, NVIDIA NemoClaw and the OpenShell runtime for
              secure containerized agent execution, and NVIDIA NIM microservices deploying the open
              120-billion-parameter Nemotron 3 Super foundation model [CE009, CE010]. In April 2026, Distyl further
              expanded its multi-cloud reach by becoming a Gemini Enterprise priority partner on Google Cloud [CE007].
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
