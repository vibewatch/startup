              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.3'
        title: Funding strengthens optionality but does not prove runway
        blocks:
          - type: paragraph
            body: >-
              A company-issued September 2025 release announced $175 million of financing at a $1.8 billion valuation
              and described Distyl as backed by profitability. The same release claimed more than 120 million end users,
              hundreds of millions in customer operating impact, and $23 million of annual savings for one healthcare
              client. These are customer-outcome and financing claims: they are not Distyl revenue, ARR, accounting
              profit, cash on hand, or cash generation. Capital adequacy therefore remains unquantifiable because the
              retained public record does not disclose balance-sheet cash, burn, runway, debt, project-finance
              obligations, or a quantified use-of-funds plan. Directory data also conflicts: StartupHub reports $475
              million raised, while Exa still reports a stale $27 million total that omits the later company-announced
              round. The financial verdict is research-more: the delivery model may support large contracts, but revenue
              quality, margin path, capital intensity, and financing dependency require primary financial and
              contractual evidence.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding raised is not cash available
            body: >-
              The $175 million financing establishes a historical inflow, not the current cash balance, burn rate, debt
              load, or runway. Those quantities remain unavailable in the assigned public evidence.
            calloutType: risk
            claimRefs:
