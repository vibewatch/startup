      - number: '4.2'
        title: Delivery intensity is visible; unit economics are not
        blocks:
          - type: paragraph
            body: >-
              The public operating model is labor-bearing. Distyl says its engineers customize Distillery, while
              third-party profiles describe embedded strategy and engineering teams that remain with customers through
              multi-year engagements. That structure indicates a meaningful service-delivery component, but it does not
              reveal utilization, staffing ratios, compensation, implementation duration by account, or which party pays
              model and cloud costs. Distyl's 2026 NVIDIA announcement also shows that runtime choices can be selected
              for cost, latency, and governance, making infrastructure economics contract- and workload-specific rather
              than a single observable unit cost. StackAI's competitor-authored comparison flags high investment and
              vendor dependency; it is useful adverse evidence about buyer economics, not an independent margin
              benchmark. No public CAC, payback, gross margin, retention, or customer-concentration data closes these
              questions.
            claimRefs:
              - CI006
              - CI011
              - CI012
              - CI014
