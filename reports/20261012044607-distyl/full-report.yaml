        - Embedded delivery can establish mission-critical workflows that expand into platform licenses
        - Sacra describes multi-year contracts combining Distillery and consulting
        - Audited renewal cohorts and rising software contribution without proportional staffing
      - - Thesis
        - Governed infrastructure can matter in regulated enterprise deployments
        - Distyl announced NVIDIA AI Enterprise integration into Distillery
        - Independent security, uptime, and customer reference evidence
      - - Anti-thesis
        - The model may retain consulting economics despite a proprietary platform
        - StackAI describes Distyl as a service-led solutions partner
        - Segmented gross margin showing software economics at scale
      - - Anti-thesis
        - Public traction claims may not establish durable customer quality
        - Beri reports no named customers and only anonymized case studies
        - Named reference calls plus retention, expansion, and concentration data
    notes: >-
      Company claims are separated from independent and competitor observations; the table does not treat a competitor
      comparison as an independent benchmark.
    claimRefs:
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull, Base, and Bear Scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / Return Logic
      - Probability Signal
      - Key Trigger
    rows:
      - - Bull
        - Platform licenses and reusable workflows outgrow embedded delivery labor
        - Upside cannot be quantified until audited recurring revenue and margin evidence exists
        - Unquantified; requires independent renewal and expansion proof
        - Software contribution and retention rise without proportional delivery headcount
      - - Base
        - Distyl remains a hybrid platform-and-services provider with durable large contracts
        - Current price cannot be benchmarked to a verified revenue or cash-flow multiple
        - Unquantified; public evidence supports neither a probability nor a range
        - Stable cohorts but persistent services intensity
      - - Bear
        - High cost, vendor dependency, or weak renewals limit repeatability
        - Multiple compression is plausible, but no defensible downside value is public
        - Unquantified; anonymized customer proof increases uncertainty
        - Customer churn, margin compression, or delivery capacity scaling slower than demand
    notes: >-
      Scenarios are directional because ARR, revenue, margin, retention, burn, cap-table, and preference data are not
      publicly supported in the assigned evidence.
