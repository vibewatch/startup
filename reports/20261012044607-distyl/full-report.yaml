chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and AI-Native Operating Model
        blocks:
          - type: paragraph
            body: >-
              Distyl AI is a private applied artificial intelligence company based in San Francisco that partners with
              Fortune 500 enterprises to architect, build, and deploy production-grade agentic AI systems. Rather than
              operating as a pure-play self-serve SaaS vendor, Distyl pairs its proprietary enterprise platform,
              Distillery, with embedded forward-deployed engineers and strategists who work directly alongside client
              teams. The company focuses on mission-critical operating environments across regulated sectors including
              healthcare, telecommunications, insurance, financial services, and advanced manufacturing. Through its
              Context Mesh technology and outcome-driven engagements, Distyl takes enterprise workflows from initial
              scoping to live production in roughly three months, promising measurable bottom-line operating impact.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO008
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO008
              - CO011
              - CO012
      - number: '1.2'
        title: Founders, Leadership Structure, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Distyl was co-founded by Chief Executive Officer Arjun Prakash and Chief Operating Officer Derek Ho, both
              alumni of Palantir Technologies where they led complex forward-deployed enterprise engineering
              engagements. The co-founders have replicated Palantir's high-touch forward-deployment philosophy,
              assembling an engineering corps with backgrounds from OpenAI, Apple, and Palantir to solve large-scale
              enterprise automation problems. However, Distyl's executive governance exhibits notable key-person
              dependencies: the company does not publicly disclose formal executives in conventional roles such as Chief
              Technology Officer, Chief Financial Officer, or Head of Global Sales. Furthermore, Distyl publishes only
              anonymized case studies without disclosing named customer references, creating reliance on the founding
              team's proprietary client relationships.
            claimRefs:
              - CO002
              - CO005
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO005
              - CO010
      - number: '1.3'
        title: Capitalization History, Valuation, and Stakeholder Governance
        blocks:
          - type: paragraph
            body: >-
              Distyl has raised approximately $202 million in aggregate venture capital across three institutional
              financing rounds. The company raised an initial $7 million seed round in April 2023 backed by prominent
              operators Nat Friedman and Brad Gerstner, followed by a $20 million Series A round in November 2024. In
              September 2025, Distyl completed a landmark $175 million Series B financing round at a post-money
              valuation of $1.8 billion. The Series B syndicate was co-led by Khosla Ventures and Lightspeed Venture
              Partners, with participation from Coatue, Dell Technologies Capital, and DST Global. Institutional
              interest in Distyl equity is actively tracked on private secondary marketplaces such as Nasdaq Private
              Market, though underlying capitalization structures, liquidation preferences, and employee option pools
              remain confidential.
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO009
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO007
              - CO009
      - number: '1.4'
        title: Operational Milestones, Partnerships, and Execution Horizon
        blocks:
          - type: paragraph
            body: >-
              Since its commercial inception, Distyl has rapidly expanded its operational footprint, reporting that its
              production systems reached over 120 million end users by late 2025 and more than 150 million end users by
              mid-2026 across major corporate deployments. To enhance its technological moat beyond closed proprietary
              model APIs, Distyl integrated NVIDIA AI Enterprise software into Distillery in March 2026, incorporating
              the NeMo Agent Toolkit, NIM microservices, and Nemotron models to support long-running autonomous agent
              execution. The company further broadened its infrastructure in April 2026 by becoming a Gemini Enterprise
              priority partner with Google Cloud alongside its established Microsoft Azure deployments. Despite these
              technical milestones, independent analysts caution that long sales cycles and high implementation costs
              present ongoing execution risks.
            claimRefs:
              - CO003
              - CO006
              - CO008
              - CO009
              - CO011
              - CO013
