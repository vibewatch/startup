company:
  name: "Distyl"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Distyl's September 2025 financing established a $1.8 billion valuation, but
    public evidence still lacks the revenue, margin, retention, and security-term
    denominators needed to underwrite that price. The resulting stance is
    research-more, with medium confidence, high risk, and a stretched valuation.
sections:
  - id: "decision-and-price-discipline"
    title: "Decision and Price Discipline"
    body: >-
      The recommendation is research-more rather than buy. Distyl's company-issued
      financing release establishes the $175 million round and $1.8 billion
      valuation, while independent databases and analysis report $202 million of
      cumulative funding across three rounds. Those facts confirm the financing
      context, not the return case. Revenue Memo states that no sales figure is
      public, so no reported revenue multiple can be set against the valuation;
      the Series B release's profitability characterization is likewise
      unquantified. Without audited revenue, recurring-revenue mix, gross margin,
      retention, cash consumption, and security terms, neither a target return nor
      a defensible entry range can be calculated. Price discipline therefore means
      withholding an affirmative valuation recommendation until a data-room review
      supplies the missing denominators and preference stack.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV007"
      - "CV015"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: >-
      The thesis is that Distyl can turn difficult enterprise workflows into a
      durable platform relationship. Sacra describes multi-year contracts that
      combine Distillery access with embedded consulting, Distyl reports production
      deployments and broad end-user reach, and the company continues to add
      infrastructure capability through NVIDIA AI Enterprise. The anti-thesis is
      that delivery remains services-intensive: StackAI characterizes Distyl as a
      service-led solutions partner rather than a standalone product and highlights
      high cost, vendor dependency, and slower early time-to-value. Public proof is
      also hard to verify because Beri reports that customers are unnamed and case
      studies anonymized. The decisive issue is whether recurring platform revenue
      can expand faster than forward-deployed labor while retaining customers after
      the initial build.
    claimRefs:
      - "CV006"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV016"
    tableRefs:
      - "TV002"
  - id: "financing-comparables-and-structure"
    title: "Financing, Comparables, and Capital Structure"
    body: >-
      Public financing evidence is internally consistent on the latest round and
      cumulative capital, but it does not reveal ownership, liquidation preference,
      participation, seniority, option-pool, or investor-rights detail. Revenue Memo
      reports no debt and no later 2026 financing or IPO filing, which is useful
      context but not proof that no private transaction occurred. The available
      comparable set is also weak: Tracxn identifies a crowded field and publishes
      funding totals for Tredence, G42, and Nara Logics, but funding raised is not
      enterprise value and the businesses span consulting, infrastructure, and NLP
      services. Those figures should not be converted into valuation multiples.
      A proper comp analysis requires matched revenue quality, growth, gross margin,
      services mix, and current equity or transaction values.
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV001"
  - id: "scenarios-exit-and-diligence"
    title: "Scenarios, Exit Readiness, and Diligence"
    body: >-
      The scenarios are intentionally qualitative because the assigned public
      evidence cannot support numerical valuation ranges or probabilities. A bull
      outcome requires Distillery licensing and repeatable workflow components to
      grow faster than embedded delivery effort, with independent customer
      references validating renewal and expansion. The base case is a valuable but
      labor-intensive hybrid whose economics cannot yet be mapped to a software
      multiple. The bear case is multiple compression if high cost, vendor
      dependency, or weak post-deployment retention makes the model resemble
      consulting. Exit readiness is unproven: Revenue Memo reports no IPO filing as
      of October 2026. Final diligence should test cohort retention, customer
      concentration, segmented margins, cash runway, the capitalization table, and
      whether contracts persist without proportional forward-deployed headcount.
    claimRefs:
      - "CV004"
      - "CV010"
      - "CV012"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
