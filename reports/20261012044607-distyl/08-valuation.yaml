callouts:
  - calloutType: "recommendation"
    title: "The Public Record Supports a Diligence Gate, Not a Price Target"
    body: >-
      The $1.8 billion financing mark is observable, but the assigned evidence does
      not support a current enterprise value, revenue multiple, return target, or
      probability-weighted range. An affirmative investment decision should wait
      for audited operating data and the full preference stack.
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV015"
