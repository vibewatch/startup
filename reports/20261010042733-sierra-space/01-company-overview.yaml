callouts:
  - calloutType: "insight"
    title: "Strategic Defense Pivot Stabilizes Revenue Floor Ahead of Spaceflight Demonstration"
    body: "Sierra Space has progressively reshaped its capital and business profile from a pure-play commercial space exploration company into a defense-tech prime contractor. Securing over $1.5 billion in Space Development Agency and classified satellite awards provides an operational revenue backstop that partially insulates the business from commercial LEO destination timing risks."
    claimRefs:
      - "CO007"
      - "CO012"
      - "CO013"
  - calloutType: "risk"
    title: "Contractual De-scoping and Schedule Slips on Flagship Transportation"
    body: "While Dream Chaser represents unique lifting-body runway-landing technology, multi-year delays led NASA in September 2025 to remove the obligation for guaranteed ISS resupply flights. The upcoming late-2026 flight is now an uncrewed free-flight demonstration, shifting future NASA task orders into discretionary post-demo evaluations."
    claimRefs:
      - "CO010"
      - "CO011"
