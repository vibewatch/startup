company:
  name: "Sierra Space"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Sierra Space Corporation is an independent defense-tech and commercial space platform established in 2021 as a spinout from Sierra Nevada Corporation. Headquartered in Louisville, Colorado, the company has raised over $2.0 billion in equity, achieving an $8.0 billion post-money valuation in its March 2026 Series C round. While its flagship Dream Chaser spaceplane faces schedule revisions and contract de-scoping with NASA, Sierra Space has diversified into a major national security satellite prime contractor with more than $1.5 billion in Space Development Agency tracking and defense satellite awards."
sections:
  - id: "corporate-identity-and-lineage"
    title: "Corporate Identity, Lineage, and Business Architecture"
    body: "Sierra Space Corporation was formed in 2021 through the commercial spinout of Sierra Nevada Corporation's (SNC) Space Systems division, establishing a standalone aerospace and defense-technology enterprise. Headquartered in Louisville, Colorado, the company builds upon over three decades of flight heritage and hardware delivery across more than five hundred missions. The business model positions Sierra Space as a vertically integrated platform offering space-as-a-service across three primary divisions: Space Transportation, Space Destinations, and Space Applications. Space Transportation centers on the reusable Dream Chaser lifting-body spaceplane, Space Destinations encompasses expandable low-Earth orbit infrastructure including the Large Integrated Flexible Environment (LIFE) habitat, and Space Applications provides satellite platforms, on-orbit servicing vehicles, and high-rate propulsion and power subsystems for civil, defense, and commercial customers."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "governance-and-leadership-evolution"
    title: "Governance, Board Control, and Executive Leadership Transitions"
    body: "Sierra Space maintains a governance structure closely aligned with its parent heritage and institutional financial sponsors. Controlling equity owners Fatih Ozmen and Eren Ozmen serve prominently on the board of directors, with Fatih Ozmen acting as Board Chair. The board also incorporates institutional representation from major growth equity investors including General Atlantic and Coatue Management. During 2026, Sierra Space executed two high-level executive transitions to sharpen its enterprise execution and defense positioning. Effective March 2, 2026, Dan Jablonsky, former Chief Executive Officer of Maxar Technologies and President of DigitalGlobe, succeeded Tom Vice as Chief Executive Officer. Subsequently, in June 2026, the company appointed Jeff Schrader, former Lockheed Martin Space executive and former president of SEAKR Engineering, as Chief Financial Officer. These appointments reflect an intentional shift toward defense-industrial scaling and public-contract execution."
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO002"
  - id: "capital-structure-and-financing-history"
    title: "Capital Structure, Private Valuation, and Balance Sheet Transparency"
    body: "Sierra Space has secured more than $2.0 billion in total equity capital since its 2021 spinout, establishing one of the highest private valuations in the aerospace sector. Following a $1.4 billion Series A financing in November 2021 at a $4.5 billion valuation and a $290 million Series B round in September 2023 at $5.3 billion, the company closed a $550 million Series C equity round on March 5, 2026. Led by LuminArx Capital Management with participation from General Atlantic, Coatue, Moore Strategic Ventures, and Andalusian Private Capital, the round established an $8.0 billion post-money valuation. However, because Sierra Space is a privately held corporation that filed an exempt offering under SEC Rule 506(b) via Form D, it explicitly declined to disclose its revenue range. Operating margins, recurring revenue, EBITDA, cash burn rate, and consolidated cash balances remain undisclosed, creating analytical reliance on contract ceilings rather than audited income statement performance."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "operational-programs-and-defense-expansion"
    title: "Operational Milestones, Transportation Delays, and Defense Expansion"
    body: "The operational roadmap of Sierra Space reflects a dual-track strategy combining commercial space exploration with aggressive expansion into national security satellite production. The flagship Dream Chaser spaceplane has encountered significant schedule delays relative to its initial 2021 targets, shifting its inaugural orbital launch to late 2026. In September 2025, NASA and Sierra Space mutually modified their Commercial Resupply Services 2 (CRS-2) contract, removing the requirement for guaranteed ISS docking on the maiden flight and converting Demo-1 into an uncrewed free-flight orbital test. In parallel, Sierra Space has pivoted substantial resources into defense-tech programs. The company won an 18-satellite Tranche 2 Tracking Layer award from the Space Development Agency with a maximum potential value of $740 million, followed in July 2026 by an up to $798 million Other Transaction Authority award for 18 Accelerated Missile Defense Tranche 3 satellites. Commercial destination development continues via the Orbital Reef partnership with Blue Origin, centering on the LIFE inflatable habitat."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
  - id: "strategic-watch-items-and-diligence-path"
    title: "Strategic Risk Factors, Capital Governance, and Core Diligence Gaps"
    body: "Independent diligence on Sierra Space requires evaluating three principal risk dimensions: private disclosure opacity, program execution bottlenecks, and capital structure governance. Because the company does not release audited income statements, the quality and timing of its defense backlog conversion cannot be evaluated independently from public filings. Contract awards from the Space Development Agency represent maximum potential contract values rather than recognized revenue. On civil space transportation, Dream Chaser faces launch vehicle integration dependencies with United Launch Alliance's Vulcan Centaur rocket, where any launch cadence bottlenecks could defer commercial validation further. Furthermore, because specific terms of the Series C preferred equity—including liquidation preferences, anti-dilution protections, and redemption covenants—remain confidential, secondary share valuations and common equity upside require direct verification through closed-door review of governing investor rights agreements."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
