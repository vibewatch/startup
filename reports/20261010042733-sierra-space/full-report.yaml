      - number: '6.2'
        title: Adoption Trajectory and Mission Scale
        blocks:
          - type: paragraph
            body: >-
              The company's customer adoption trajectory reflects a foundation built on heritage space hardware
              transitioned into integrated orbital platforms. Sierra Space's Orbital Missions and Services division
              traces an operational history covering 23 delivered space vehicles and component support for more than 400
              space and interplanetary missions. Modern operational adoption centers on Dream Chaser's firm commitment
              of at least six uncrewed cargo resupply missions to the International Space Station, establishing
              guaranteed flight cadence and flight-proven qualification. To align this multi-segment customer pipeline
              with factory output, Sierra Space established a formal Sales, Inventory, and Operations Planning
              discipline connecting CRM deal flows, ERP manufacturing resource planning, and master assembly schedules
              across satellite, spacecraft, and subsystems production lines. Capitalization following the $550 million
              Series C equity round at an $8 billion valuation in early 2026 has enabled substantial manufacturing
              expansion in Colorado to support both contracted civil commitments and accelerating defense task orders.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
              - CU009
