      - number: '7.2'
        title: 'Operational and Technical Risk: Flight Readiness and Habitat Commercialization'
        blocks:
          - type: paragraph
            body: >-
              Operational risk centers on the execution of flagship hardware programs including the Dream Chaser
              spaceplane Tenacity and the Large Integrated Flexible Environment (LIFE) inflatable habitat. While Sierra
              Space completed pre-flight electromagnetic interference (EMI) testing and thermal vacuum chamber (TVAC)
              radiator trials at NASA Johnson Space Center, the core flight manifest has experienced prolonged schedule
              slips exceeding five years relative to initial baseline projections. Dream Chaser's debut flight has
              shifted into late 2026 as a free-flying demonstration rather than a mission delivering cargo directly to
              the International Space Station. Meanwhile, commercialization of the LIFE habitat depends heavily on
              unfunded Space Act Agreements, such as the Collaborations for Commercial Space Capabilities 2 (CCSC2)
              agreement with NASA, which outlines a rigorous 33-milestone technical roadmap stretching through 2028
              across Pathfinder expandable modules and DC-200 crew transportation concepts without committing direct
              federal funding.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
