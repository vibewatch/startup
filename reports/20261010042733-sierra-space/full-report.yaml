      - number: '3.4'
        title: The Moat Depends on Delivery, Not Category Labels
        blocks:
          - type: paragraph
            body: >-
              The most defensible elements visible in the assigned pool are accumulated flight heritage, current
              production capacity, large program awards, and the ability to sell across satellites, subsystems, return
              vehicles, and autonomy software. An independent industry article reports that Sierra Space completed the
              first nine structures for the SDA program three months ahead of schedule, although that report relies on
              company disclosures and is not a government acceptance record. The downside is execution and comparability
              risk: the product portfolio includes programs whose current milestone status is not disclosed, and
              third-party peer directories do not agree on the direct competitive set. Talent is another contested
              input; Built In describes market-based pay, incentives, and equity tools, but those practices do not prove
              retention or productivity. Durable advantage therefore requires verified on-time delivery, repeat awards,
              and economic disclosure rather than breadth alone.
            claimRefs:
              - CP002
              - CP005
              - CP011
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Awarded Programs and Production Capacity Are the Clearest Differentiators
            body: >-
              The $450 million classified award, the SDA contract with a maximum potential value of $740 million, and
              reported early delivery of nine structures provide a more concrete competitive signal than broad product
              positioning alone. These facts still do not disclose program margin or customer acceptance.
            calloutType: strength
            claimRefs:
              - CP008
              - CP009
              - CP011
          - type: callout
            title: Roadmap and Peer Comparability Remain Weakly Evidenced
            body: >-
              The official Spectre page still carried a late-2025 launch schedule in October 2026, and independent
              directories disagree on the relevant peer group. Current milestone records, bid-level economics, and
              customer switching evidence are required before treating portfolio breadth as a durable moat.
            calloutType: risk
            claimRefs:
