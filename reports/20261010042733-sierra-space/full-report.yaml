      - number: '3.2'
        title: Breadth Is Differentiating, but Most Claims Remain Company-Issued
        blocks:
          - type: paragraph
            body: >-
              Sierra Space's disclosed scope extends beyond a single spacecraft. The company reports heritage across 23
              space vehicles and more than 400 successful space and interplanetary missions for its subsystems and
              components, and it describes a next-generation small satellite line for on-orbit servicing. Its
              national-security page also presents Ghost for payload return, Spectre for rendezvous and proximity
              operations, and an AI-enabled, platform-agnostic Sierra operating system built around zero-trust
              architecture. This breadth can support cross-selling and reuse of production infrastructure. It is not,
              however, equivalent to independently demonstrated parity with every specialist. The same official page
              still described Spectre as scheduled for a late-2025 launch when accessed in October 2026, without stating
              the outcome, so roadmap claims should be underwritten separately from delivered capability.
