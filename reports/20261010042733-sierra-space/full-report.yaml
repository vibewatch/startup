      - number: '2.2'
        title: TAM, SAM, and SOM Analysis Across Orbital Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Evaluating Sierra Space's addressable opportunity requires separating aspirational commercial orbital
              forecasts from tangible defense awards. In its internal market analysis, Sierra Space identifies four
              terrestrial target verticals—semiconductors and advanced glass, monoclonal antibodies and drug
              formulations, cell-based assays, and regenerative medicine—totaling $900 billion in 2022 and expanding at
              an 8.3% CAGR to $3.6 trillion by 2038. From this terrestrial baseline, the company estimates a cumulative
              LEO total addressable market of approximately $154 billion through 2038, representing less than a 1%
              capture rate of terrestrial industrial spending. Furthermore, Sierra Space models that a first-mover
              commercial space station could capture $64 billion in cumulative revenue at a 30% EBIT margin. However,
              these figures remain speculative; the serviceable obtainable market is presently defined by $1.5 billion
              in awarded defense contracts.
