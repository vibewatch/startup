      - number: '3.3'
        title: Capital and Government Awards Strengthen Access; Pricing Power Is Unclear
        blocks:
          - type: paragraph
            body: >-
              Sierra Space has a visible capital and government-procurement position. Its company-issued March 2026
              release disclosed a $550 million equity investment at an $8 billion post-money valuation and said the
              proceeds would expand production capacity and national-security solutions. The same release identified a
              $450 million award to build more than four satellites and an SDA Tranche 2 Tracking Layer contract with a
              maximum potential value of $740 million for 18 satellites. Those awards indicate access to funded programs
              and production demand, but maximum contract value is not recognized revenue and does not reveal unit
              economics. The assigned evidence also does not disclose list pricing, realized pricing, discounting,
              renewal mechanics, customer concentration, termination rights, or whether customers can multi-home across
              suppliers.
