      - number: '2.3'
        title: Buyer Segmentation and Government Procurement Dynamics
        blocks:
          - type: paragraph
            body: >-
              Sierra Space's primary customer landscape is dominated by government institutional buyers with dedicated
              statutory budget lines. In the national security segment, the Space Development Agency and defense
              intelligence agencies act as the primary buyers and budget owners, purchasing proliferated missile
              tracking buses and specialized intelligence satellites under multi-year appropriation cycles. In civil
              space, NASA serves as the anchor buyer and payer through the Commercial Resupply Services 2 (CRS-2)
              contract, procuring pressurized cargo transportation to the International Space Station. While commercial
              customers represent the intended long-term user base for microgravity biomanufacturing and habitat
              platforms, private enterprise adoption pathways remain early-stage and lack binding commercial procurement
              commitments outside government-supported research initiatives.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
              - CM012
