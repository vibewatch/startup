  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Backlog Composition, and Monetization Models
        blocks:
          - type: paragraph
            body: >-
              Sierra Space generates revenue across civil space transportation, national security payloads, and defense
              subsystems, but the composition and forward durability of its revenue base face structural transitions.
              Historically anchored by NASA's Commercial Resupply Services-2 (CRS-2) contract awarded in 2016 for a
              minimum of seven cargo missions, the program's commercial foundation shifted in September 2025 when NASA
              and Sierra Space mutually modified the contract. Under this amendment, NASA converted the maiden flight of
              Tenacity into an uncrewed free-flight demonstration targeted for late 2026 and eliminated its commitment
              to purchase a fixed number of operational resupply flights. To offset this reduction in guaranteed civil
              cargo revenue, Sierra Space announced in September 2026 that it booked undisclosed national security and
              commercial payloads for Dream Chaser's debut flight, creating a hybrid multi-manifest operational model.
              Across its broader defense portfolio, the Orbital Missions and Services division contributes component and
              satellite bus revenue backed by more than 400 historical missions, yet granular milestone recognition
              schedules and margin contributions remain undisclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI009
              - CI014
