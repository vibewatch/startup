              - CO009
              - CO012
              - CO013
      - number: '1.2'
        title: Governance, Board Control, and Executive Leadership Transitions
        blocks:
          - type: paragraph
            body: >-
              Sierra Space maintains a governance structure closely aligned with its parent heritage and institutional
              financial sponsors. Controlling equity owners Fatih Ozmen and Eren Ozmen serve prominently on the board of
              directors, with Fatih Ozmen acting as Board Chair. The board also incorporates institutional
              representation from major growth equity investors including General Atlantic and Coatue Management. During
              2026, Sierra Space executed two high-level executive transitions to sharpen its enterprise execution and
              defense positioning. Effective March 2, 2026, Dan Jablonsky, former Chief Executive Officer of Maxar
              Technologies and President of DigitalGlobe, succeeded Tom Vice as Chief Executive Officer. Subsequently,
              in June 2026, the company appointed Jeff Schrader, former Lockheed Martin Space executive and former
              president of SEAKR Engineering, as Chief Financial Officer. These appointments reflect an intentional
              shift toward defense-industrial scaling and public-contract execution.
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: Capital Structure, Private Valuation, and Balance Sheet Transparency
        blocks:
          - type: paragraph
            body: >-
              Sierra Space has secured more than $2.0 billion in total equity capital since its 2021 spinout,
              establishing one of the highest private valuations in the aerospace sector. Following a $1.4 billion
              Series A financing in November 2021 at a $4.5 billion valuation and a $290 million Series B round in
              September 2023 at $5.3 billion, the company closed a $550 million Series C equity round on March 5, 2026.
              Led by LuminArx Capital Management with participation from General Atlantic, Coatue, Moore Strategic
              Ventures, and Andalusian Private Capital, the round established an $8.0 billion post-money valuation.
              However, because Sierra Space is a privately held corporation that filed an exempt offering under SEC Rule
              506(b) via Form D, it explicitly declined to disclose its revenue range. Operating margins, recurring
              revenue, EBITDA, cash burn rate, and consolidated cash balances remain undisclosed, creating analytical
              reliance on contract ceilings rather than audited income statement performance.
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO012
              - CO013
      - number: '1.4'
        title: Operational Milestones, Transportation Delays, and Defense Expansion
        blocks:
          - type: paragraph
            body: >-
              The operational roadmap of Sierra Space reflects a dual-track strategy combining commercial space
              exploration with aggressive expansion into national security satellite production. The flagship Dream
              Chaser spaceplane has encountered significant schedule delays relative to its initial 2021 targets,
              shifting its inaugural orbital launch to late 2026. In September 2025, NASA and Sierra Space mutually
              modified their Commercial Resupply Services 2 (CRS-2) contract, removing the requirement for guaranteed
              ISS docking on the maiden flight and converting Demo-1 into an uncrewed free-flight orbital test. In
              parallel, Sierra Space has pivoted substantial resources into defense-tech programs. The company won an
              18-satellite Tranche 2 Tracking Layer award from the Space Development Agency with a maximum potential
              value of $740 million, followed in July 2026 by an up to $798 million Other Transaction Authority award
              for 18 Accelerated Missile Defense Tranche 3 satellites. Commercial destination development continues via
              the Orbital Reef partnership with Blue Origin, centering on the LIFE inflatable habitat.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
