chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Lineage, and Business Architecture
        blocks:
          - type: paragraph
            body: >-
              Sierra Space Corporation was formed in 2021 through the commercial spinout of Sierra Nevada Corporation's
              (SNC) Space Systems division, establishing a standalone aerospace and defense-technology enterprise.
              Headquartered in Louisville, Colorado, the company builds upon over three decades of flight heritage and
              hardware delivery across more than five hundred missions. The business model positions Sierra Space as a
              vertically integrated platform offering space-as-a-service across three primary divisions: Space
              Transportation, Space Destinations, and Space Applications. Space Transportation centers on the reusable
              Dream Chaser lifting-body spaceplane, Space Destinations encompasses expandable low-Earth orbit
              infrastructure including the Large Integrated Flexible Environment (LIFE) habitat, and Space Applications
              provides satellite platforms, on-orbit servicing vehicles, and high-rate propulsion and power subsystems
              for civil, defense, and commercial customers.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
