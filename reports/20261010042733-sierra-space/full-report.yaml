      - number: '7.3'
        title: 'Partner and Customer Dependency Risk: NASA Manifest Compression and Launch Bottlenecks'
        blocks:
          - type: paragraph
            body: >-
              Sierra Space's revenue and commercial roadmap exhibit high concentration and counterparty risk. Under the
              NASA Commercial Resupply Services 2 (CRS-2) contract, a September 2025 contract amendment decoupled Dream
              Chaser's inaugural flight (SSC Demo-1) from an ISS docking requirement, eliminating the guarantee of seven
              operational station resupply dockings as NASA prepares for ISS retirement by 2030. Furthermore, Dream
              Chaser depends on United Launch Alliance's (ULA) Vulcan Centaur launch vehicle, exposing mission timelines
              to booster cadence bottlenecks. While Sierra Space has actively mitigated this civil space exposure
              through a major pivot into national security defense-tech—securing over $1.5 billion in defense satellite
              backlogs, including an additional $798 million SDA contract in July 2026—the business remains dependent on
              federal budget authorizations and partnership alignment with Blue Origin on the Orbital Reef space
              station.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Litigation Exposure and Subcontractor Friction on SDA Programs
            body: >-
              The $17.1 million breach of contract lawsuit filed by Geost highlights supply chain tension on Sierra
              Space's flagship $740 million SDA Tranche 2 Tracking Layer program, demonstrating that aggressive prime
              contractor substitutions create litigation liabilities, potential punitive damages, and reputational
              friction with defense procurement authorities.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Amended NASA CRS-2 Terms Compress Civil Commercialization Runway
            body: >-
              NASA's September 2025 amendment of the CRS-2 contract to remove guaranteed ISS docking from Demo-1
              reflects schedule compression ahead of the ISS's planned 2030 retirement. This shift forces Sierra Space
              to accelerate multi-customer payload integration and defense satellite volume to justify its $8 billion
              valuation.
            calloutType: insight
            claimRefs:
              - CR012
              - CR013
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Sierra Space has established a strategic position across national security defense and orbital
              infrastructure [CV004]. The primary thesis centers on its dual-engine growth strategy: scaling
              high-priority national security defense platforms while commercializing space transportation and habitat
              infrastructure [CV005]. In March 2026, the company secured $550 million in Series C financing led by
              LuminArx Capital Management, expanding total lifetime investment past $2 billion and revaluing the
              business at $8.0 billion post-money [CV001, CV002]. A key operational strength is repeat defense business,
              including a $740 million missile-tracking award followed by a $798 million follow-on award for 18
              additional satellites in 2026 [CV003]. Conversely, the anti-thesis is driven by severe financial opacity
              and technical execution bottlenecks [CV007]. Sierra Space operates as a private company without publicly
              reporting detailed financial statements, revenue run rates, or gross margins [CV007]. Furthermore, its
              flagship commercial spaceplane, Dream Chaser, experienced delays that prevented its inaugural launch and
              voided its planned docking at the International Space Station before completing pre-flight testing at NASA
              Kennedy Space Center in November 2025 [CV008]. These factors create asymmetric downside risks if
              commercial space infrastructure adoption lags behind defense manufacturing capacity.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
      - number: '8.2'
        title: Financing Context, Capital Structure, and Valuation Discipline
        blocks:
          - type: paragraph
            body: >-
              The capital trajectory of Sierra Space demonstrates accelerating valuation growth alongside heavy capital
              intensity [CV001, CV002]. Following its 2021 corporate spinout from Sierra Nevada Corporation with a $1.41
              billion Series A round, the company achieved a $5.3 billion valuation in September 2023 and an $8.0
              billion post-money valuation in March 2026 [CV001, CV010]. In secondary and pre-IPO brokerage markets,
              secondary model estimates reached $9.14 billion, reflecting speculative retail and accredited investor
              demand via platforms like UpMarket, despite strict illiquidity and transfer restrictions [CV009, CV011].
              Commercial merchandise and branding channels operated under company domain properties further illustrate
              brand awareness initiatives outside core aerospace defense operations [CV016]. However, public evidence
              reveals significant structural gaps regarding Series C preference rights, senior liquidation multipliers,
              and potential down-round ratchet protections held by institutional sponsors such as LuminArx, Coatue, and
              General Atlantic [CV006, CV010]. Without verified audited revenue or defense backlog conversion schedules,
              paying a premium above the $8.0 billion private headline multiple exposes investors to substantial
              multiple compression and dilution risks [CV007, CV012].
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario Analysis, Comparable Context, and Diligence Framework
        blocks:
          - type: paragraph
            body: >-
              Valuation underwriting requires evaluating asymmetric operational paths across defense contracting and
              commercial space infrastructure [CV003, CV005]. In a bull scenario, Sierra Space rapidly scales its
              Victory Works facility, converts its $798 million satellite backlog into double-digit EBITDA margins, and
              successfully executes commercial flights for Dream Chaser and Ghost delivery systems [CV003, CV005]. In
              the base case, defense production remains steady while Dream Chaser commercial revenue ramps slowly due to
              certification timelines, sustaining an enterprise value near $8.0 billion [CV001, CV008]. In the bear
              case, continued spaceplane program delays or satellite contract margin erosion compound high operating
              burn, triggering a down-round or structured preference overhang [CV007, CV008]. Comparing Sierra Space
              against funded space systems and hardware competitors such as Terran Orbital ($144M funding, acquired),
              Apex ($718M funding), and Vast ($500M Series A round in March 2026) highlights that Sierra Space trades at
              an industry-leading private valuation tier [CV006, CV013]. As a result, the prudent recommendation is
              research-more with high risk and a stretched valuation stance, pending audited revenue disclosures and
              orbital flight validation [CV014, CV015].
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting Stance: Research-More at $8.0B Valuation'
            body: >-
              Investors should maintain a research-more stance on Sierra Space. While defense contract momentum is
              robust with over $1.5 billion in combined SDA awards, the $8.0 billion valuation lacks disclosed revenue
              and margin denominators, and commercial spaceplane execution remains unproven in orbit.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV014
          - type: callout
            title: Commercial Execution Bottleneck and Capital Structure Overhang
            body: >-
              Dream Chaser test delays voided a planned ISS docking mission, underscoring program schedule
              vulnerability. In the absence of cap table disclosure, Series C senior liquidation preferences pose
              downside risk for common and non-lead equity holders.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV012
