      - number: '6.4'
        title: Retention Dynamics and Customer Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              While Sierra Space has assembled a high-profile backlog across civil and military spheres, its customer
              portfolio exhibits meaningful concentration vulnerabilities and long-cycle dependency risks. The
              commercialization timeline for private space stations remains subject to industry-wide uncertainties
              regarding private market demand depth, commercial LEO station operating economics, and post-ISS transition
              timing. Sierra Space's near-term revenue trajectory is heavily dependent on the execution of its initial
              Dream Chaser demonstration flight and timely delivery on fixed-price NASA milestones. Recognizing the
              extended adoption cycles of commercial habitat infrastructure, management has strategically prioritized
              responsive national security solutions to generate near-term contracting volume. However, because specific
              contract values, program profitability margins, and customer retention metrics remain closely held private
              disclosures, independent verification of backlog durability and customer unit economics requires access to
              confidential company records.
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU007
              - CU008
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Pivot Toward National Security Customers
            body: >-
              Sierra Space has progressively reallocated engineering and production bandwidth toward national security
              customers. While civil NASA contracts and commercial Orbital Reef habitats provide long-term technological
              prestige, defense programs such as Ghost and Spectre provide mission demand that can be capitalized ahead
              of private space station commercialization.
            calloutType: insight
            claimRefs:
              - CU004
              - CU007
              - CU012
          - type: callout
            title: Customer Concentration and Timeline Vulnerability
            body: >-
              The commercial viability of Sierra Space's flagship Dream Chaser and LIFE habitat systems remains
              concentrated on two major programs: NASA ISS resupply and the Blue Origin-partnered Orbital Reef. Any
              schedule slippage in orbital flight demonstrations or delays in private space station commercialization
              poses demand absorption risk.
            calloutType: risk
            claimRefs:
              - CU002
              - CU005
              - CU008
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Legal Risk: Subcontractor Litigation and Multi-Agency Oversight'
        blocks:
          - type: paragraph
            body: >-
              Sierra Space operates in an intricate legal and regulatory environment where defense contracting disputes
              and evolving space-traffic regulations impose direct operational and financial friction. The most acute
              legal exposure stems from federal litigation in the U.S. District Court in Denver, where optical and
              infrared sensor supplier Geost filed a $17.1 million breach of contract lawsuit against Sierra Space in
              January 2025. Geost alleges that Sierra Space used Geost's sensor payloads and early long-lead material
              investments to secure a $740 million contract from the Space Force's Space Development Agency (SDA) for 18
              Tranche 2 Tracking Layer satellites, before issuing a stop-work order in June 2024 and attempting to
              replace Geost with Leidos. Beyond supplier disputes, Sierra Space faces regulatory friction across civil
              and commercial flight operations. In formal regulatory comments submitted under FAA Docket FAA-2023-1858,
              Sierra Space cautioned that proposed FAA Part 453 orbital debris mitigation rules create conflicting
              jurisdictional overlap with FCC and NASA standards, noting that post-launch collision avoidance mandates
              could dramatically inflate Maximum Probable Loss (MPL) insurance requirements.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
