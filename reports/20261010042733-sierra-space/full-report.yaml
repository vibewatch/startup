      - number: '6.3'
        title: Named Customer Deployments and Contract Proof
        blocks:
          - type: paragraph
            body: >-
              Verifiable customer deployment proof is anchored by marquee government awards and strategic commercial
              alliances. NASA represents the primary anchor customer with firm mission orders for Dream Chaser cargo
              delivery and runway landing returns, providing essential validation of the vehicle's maneuverable
              lifting-body architecture. On the national security front, the company has contracted and flight-tested
              specialized platforms, including the Ghost precision delivery system engineered to return orbital cargo to
              precise Earth locations within 90 minutes, alongside the Spectre satellite engineered for precision
              rendezvous and proximity operations. For the commercial market, Sierra Space is co-developing the Orbital
              Reef space station with Blue Origin, contributing its expandable Large Integrated Flexible Environment
              habitat technology. In addition, the company has signed contracts with commercial and national security
              customers to fly auxiliary payloads aboard Dream Chaser's inaugural orbital flight, demonstrating customer
              willingness to commit payloads ahead of full commercial station availability.
            claimRefs:
              - CU002
              - CU003
