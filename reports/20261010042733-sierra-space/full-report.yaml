              - CM013
              - CM014
      - number: '2.4'
        title: Adoption Constraints, Competitive Moats, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Commercial adoption of Sierra Space's spaceplane and orbital habitat platforms faces severe operational
              and competitive constraints. Dream Chaser's commercialization has been repeatedly delayed, shifting its
              inaugural flight to a late-2026 uncrewed free-flyer demonstration rather than an operational ISS resupply
              docking mission. The vehicle also remains heavily reliant on United Launch Alliance's Vulcan rocket, which
              possesses limited cumulative flight heritage. Simultaneously, SpaceX's Dragon vehicle maintains an
              entrenched competitive moat through proven flight reliability, frequent launch cadence, and structural
              cost advantages. Key diligence gaps persist around whether commercial pharmaceutical and industrial
              corporations will pay profitable commercial prices for microgravity manufacturing once International Space
              Station subsidies conclude.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Defense Backlog Provides Near-Term Capital Cushion
            body: >-
              Sierra Space's strategic pivot toward national security space systems anchored by $1.5 billion in recent
              defense awards and the $740 million SDA Tranche 2 constellation contract provides essential revenue
              visibility and cash-flow support while commercial spaceplane logistics and orbital biomanufacturing
              markets mature.
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
          - type: callout
            title: Commercial LEO Station Demand Remains Subsidized and Speculative
            body: >-
              While company projections outline a $154 billion cumulative low-Earth orbit total addressable market by
              2038, commercial biomanufacturing and private research demand remain largely unproven outside NASA-funded
              ISS exploration, exposing long-term station investments to significant customer adoption risks.
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM010
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Set Changes With the Mission
        blocks:
          - type: paragraph
            body: >-
              Sierra Space is not readily benchmarked against one homogeneous peer group. Its own positioning spans
              national security, civil, and commercial missions, while independent directories variously identify launch
              providers, satellite manufacturers, commercial station developers, and traditional defense primes as
              alternatives. Distill names SpaceX, Axiom Space, Blue Origin, Firefly Aerospace, Apex, Lockheed Martin,
              Northrop Grumman, Boeing, Voyager, and Rocket Lab. Craft instead centers a narrower group led by Firefly,
              bluShift, Xplore, and SpinLaunch, while Owler names Relativity Space as the top competitor. The
              disagreement is analytically important: competition must be evaluated by procurement job, not by treating
              every space company as a direct substitute. Internal build and the status quo remain relevant diligence
              categories, but the assigned pool does not identify or quantify them.
            claimRefs:
              - CP001
              - CP012
              - CP013
              - CP014
              - CP015
