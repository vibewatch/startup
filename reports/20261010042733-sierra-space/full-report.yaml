      - number: '1.5'
        title: Strategic Risk Factors, Capital Governance, and Core Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Independent diligence on Sierra Space requires evaluating three principal risk dimensions: private
              disclosure opacity, program execution bottlenecks, and capital structure governance. Because the company
              does not release audited income statements, the quality and timing of its defense backlog conversion
              cannot be evaluated independently from public filings. Contract awards from the Space Development Agency
              represent maximum potential contract values rather than recognized revenue. On civil space transportation,
              Dream Chaser faces launch vehicle integration dependencies with United Launch Alliance's Vulcan Centaur
              rocket, where any launch cadence bottlenecks could defer commercial validation further. Furthermore,
              because specific terms of the Series C preferred equity—including liquidation preferences, anti-dilution
              protections, and redemption covenants—remain confidential, secondary share valuations and common equity
              upside require direct verification through closed-door review of governing investor rights agreements.
            claimRefs:
              - CO009
              - CO010
              - CO011
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Defense Pivot Stabilizes Revenue Floor Ahead of Spaceflight Demonstration
            body: >-
              Sierra Space has progressively reshaped its capital and business profile from a pure-play commercial space
              exploration company into a defense-tech prime contractor. Securing over $1.5 billion in Space Development
              Agency and classified satellite awards provides an operational revenue backstop that partially insulates
              the business from commercial LEO destination timing risks.
            calloutType: insight
            claimRefs:
              - CO007
              - CO012
              - CO013
          - type: callout
            title: Contractual De-scoping and Schedule Slips on Flagship Transportation
            body: >-
              While Dream Chaser represents unique lifting-body runway-landing technology, multi-year delays led NASA in
              September 2025 to remove the obligation for guaranteed ISS resupply flights. The upcoming late-2026 flight
              is now an uncrewed free-flight demonstration, shifting future NASA task orders into discretionary
              post-demo evaluations.
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and the Strategic Pivot to Defense-Tech
        blocks:
          - type: paragraph
            body: >-
              Sierra Space operates across two distinct market boundaries: high-growth national security space systems
              and long-horizon commercial low-Earth orbit (LEO) orbital infrastructure. Within national security,
              included spend focuses on proliferated small-satellite constellations, tactical on-orbit rendezvous
              vehicles, and responsive atmospheric payload return, while excluding heavy-lift launch vehicles and
              traditional monolithic geostationary military communications platforms. Driven by geopolitical urgency and
              Department of Defense priorities to revitalize the domestic space industrial base, Sierra Space has
              pivoted toward becoming a core defense-tech prime contractor. Major defense awards—including a $740
              million contract from the Space Development Agency for 18 tracking layer satellites and a $450 million
              classified satellite award—validate customer demand and shift near-term revenue generation firmly into
              defense procurement.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
