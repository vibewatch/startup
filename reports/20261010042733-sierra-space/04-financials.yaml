callouts:
  - calloutType: "risk"
    title: "Elimination of Guaranteed CRS-2 Resupply Flights"
    body: "NASA's September 2025 contract amendment relieved the agency of its minimum flight obligations, converting Tenacity's maiden flight into an uncrewed free-flight demonstration. While Sierra Space retains eligibility to compete for future station resupply orders post-demonstration, forward cargo revenue predictability is materially diminished."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI014"
  - calloutType: "insight"
    title: "Multi-Manifest Strategy as an Underwriting Offset"
    body: "By securing undisclosed national security and commercial customers for Dream Chaser's inaugural flight, management is attempting to transition from a single-customer civil cargo profile to a multi-tenant orbital logistics model. This multi-manifest strategy diversifies mission revenue but introduces execution complexity on debut."
    claimRefs:
      - "CI005"
      - "CI010"
      - "CI012"
