callouts:
  - calloutType: "insight"
    title: "Strategic Divergence in Orbital Reef Partnership"
    body: "While Sierra Space continues marketing Orbital Reef as a premier destination for its LIFE habitat, Blue Origin's reprioritization toward its $3.4 billion Blue Moon lunar lander award has slowed consortium momentum. NASA's limited disbursement of only $24 million under the Phase 1 CLD agreement underscores that Sierra Space must demonstrate independent viability for LIFE modules outside the joint venture."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
  - calloutType: "strength"
    title: "Defense Backlog Anchors Commercial Spaceplane Development"
    body: "Sierra Space has successfully offset civil space station ambiguity by establishing a robust defense-tech manufacturing footprint. Securing prime chassis production for 18 SDA Tranche 2 and 18 AMDT3 Golden Dome tracking satellites validates the Eclipse Horizon bus line and provides reliable production volume while Dream Chaser works toward its inaugural orbital demonstration."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE015"
