    keyQuote: >-
      The company has booked national security, civil and commercial customers to share the vehicle's first mission
      alongside its original job: hauling cargo to the International Space Station under NASA's Commercial Resupply
      Services program. It's an unusual way to debut a spacecraft. Most vehicles prove themselves on a single,
      low-stakes shakeout flight before anyone trusts them with sensitive payloads. Dream Chaser, according to Sierra
      Space, is skipping that staging step and going straight to a mixed manifest that includes defense-related cargo.
