      - nasa
      - dream-chaser
    keyQuote: >-
      In 2016, NASA awarded a Commercial Resupply Services-2 contract to Sierra Space, formerly part of Sierra Nevada
      Corporation, to resupply the International Space Station with its Dream Chaser spaceplane and companion Shooting
      Star cargo module. As part of its contract, Sierra Space was awarded a minimum seven flights, and the agency
      previously issued firm-fixed price task orders for four Dream Chaser resupply missions based on the needs of the
      space station. ... As part of the modification, NASA is no longer obligated for a specific number of resupply
      missions; however, the agency may order Dream Chaser resupply flights to the space station from Sierra Space
      following a successful free flight as part of its current contract.
  - id: SI002
    publisher: Aerospace America
    title: After NASA contract change, Sierra Space seeks path forward for Dream Chaser
    url: https://aerospaceamerica.aiaa.org/after-nasa-contract-change-sierra-space-seeks-path-forward-for-dream-chaser/
    date: '2026-05-20'
    accessDate: '2026-10-10'
    accessStatus: ok
    stance: adverse
    sourceType: news
    reputationTier: medium
    independence: independent
    topics:
      - dream-chaser
      - commercial-space
      - tenacity
      - contract-risk
    keyQuote: >-
      The agency said it’s “no longer obligated” to use Dream Chaser for a specific number of resupply missions. It
      could still contract Sierra for future deliveries, but that would largely depend on the results of Tenacity’s
      inaugural flight, now slated for late 2026. Instead of visiting ISS, the spaceplane is to conduct a “free-flyer
      demonstration mission” to low-Earth orbit. Separately, Sierra described that shift as part of a larger “strategic
      transition” to market Dream Chaser “for future national security and defense demonstrations.” But the change also
      left some industry observers wondering whether the spacecraft will ever actually go into service.
