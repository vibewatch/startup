evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-transparency
    missingEvidence: >-
      Audited income statements, revenue breakdowns between defense contracts and civil space programs, gross margins,
      and current cash burn rate.
    whyItMatters: >-
      Without verified revenue or cash burn numbers, evaluating the sustainability of Sierra Space's $8.0 billion
      post-money valuation relies entirely on contract ceilings rather than cash conversion.
    diligencePath: >-
      Request management-prepared financial package or confidential information memorandum detailing trailing
      twelve-month revenue, program EBITDA, and cash runway.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: series-c-term-sheet
    missingEvidence: >-
      Confidential Series C preferred stock purchase agreement, including liquidation preference multiples, seniority
      rankings, and redemption rights.
    whyItMatters: >-
      Understanding downside protection and seniority across Series A, B, and C preferred shares is essential to
      assessing common equity or secondary share values.
    diligencePath: Review Series C Certificate of Incorporation and investor rights agreements under NDA with company counsel.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: commercial-demand
    missingEvidence: >-
      Audited third-party commercial contract commitments or pre-orders from pharmaceutical and semiconductor
      corporations for dedicated microgravity orbital manufacturing capacity.
    whyItMatters: >-
      Sierra Space's $154B LEO TAM and $64B station revenue projections depend on private commercial adoption, which
      currently lacks public signed customer validation outside NASA and government defense programs.
    diligencePath: >-
      Review future commercial tenant agreements, biopharma pilot contract values, and payload reservation deposits
      during customer diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: defense-margin-waterfall
    missingEvidence: >-
      Unit economics, contract pricing structure (firm-fixed-price vs. cost-plus), and operating margin waterfalls for
      the $740M SDA Tranche 2 and $450M classified satellite contracts.
    whyItMatters: >-
      While defense contract awards validate top-line addressable demand, fixed-price satellite production risks margin
      erosion from supply chain bottlenecks and high-rate manufacturing scale-up costs.
    diligencePath: >-
      Request management disclosure on defense backlog contract types, milestone billing schedules, and expected gross
      margin percentages per satellite bus.
    relatedQuestionRefs:
      - QM003
  - type: private-evidence-only
    severity: material
    topic: switching-and-distribution
    missingEvidence: >-
      Customer-level evidence on switching costs, contract termination rights, multi-homing, channel control, supplier
      exclusivity, and partner access.
    whyItMatters: >-
      These facts determine whether awarded programs create durable lock-in or remain contestable at the next
      procurement milestone.
    diligencePath: >-
      Review customer contracts, procurement files, supplier agreements, renewal history, and bid debriefs with program
      and commercial leadership.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Comparable peer bid prices, Sierra Space realized contract value, program margins, discounting, and lifecycle
      cost.
    whyItMatters: Award ceilings cannot establish price competitiveness, revenue quality, or economic advantage.
    diligencePath: Obtain contract schedules, milestone invoices, cost-to-complete records, and comparable procurement awards.
    relatedTableRefs:
      - TP003
  - type: stale
    severity: material
    topic: roadmap-status
    missingEvidence: Current launch and customer-acceptance status for Spectre and operational evidence for Ghost and Sierra O/S.
    whyItMatters: Unverified roadmap status can overstate portfolio breadth and reduce confidence in delivery-based differentiation.
    diligencePath: >-
      Request dated test records, launch manifests, customer acceptance certificates, and operational performance
      reports.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-and-margin-transparency
    missingEvidence: Audited segment revenue, realized gross margins by program, and trailing twelve-month cash burn rates.
    whyItMatters: >-
      Without segmented financial statements, investors cannot evaluate whether Sierra Space's $8 billion post-money
      valuation is supported by repeatable, high-margin revenue or weighed down by cost overruns on fixed-price
      development.
    diligencePath: >-
      Obtain confidential offering memorandum, audited GAAP financial statements, and program-by-program contribution
      margin schedules under NDA.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: backlog-conversion-and-contract-mix
    missingEvidence: >-
      Granular breakdown of the reported $3.4 billion contract backlog between funded firm-fixed-price task orders,
      unexercised options, and uncommitted IDIQ contract ceilings.
    whyItMatters: >-
      IDIQ ceilings do not represent guaranteed cash flows; following NASA's removal of mandatory CRS-2 resupply
      flights, the conversion rate of remaining backlog into cash is highly uncertain.
    diligencePath: >-
      Request customer contract schedules showing funded task orders, milestone delivery dates, cancellation terms, and
      customer concentration.
    relatedQuestionRefs:
      - QI005
  - type: conflicting-data
    severity: material
    topic: launch-vehicle-and-program-schedule-dependencies
    missingEvidence: >-
      Firm launch manifest date and launch vehicle cost terms with United Launch Alliance for Vulcan Centaur, along with
      schedule contingency buffers.
    whyItMatters: >-
      Delays in ULA Vulcan Centaur availability or cost escalation on launch services directly compress flight-level
      margins and threaten Tenacity's year-end demonstration milestone.
    diligencePath: >-
      Review launch services agreement with ULA, flight readiness reviews from Space Force and NASA, and vendor
      contingency terms.
    relatedQuestionRefs:
      - QI008
