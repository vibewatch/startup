callouts:
  - calloutType: "insight"
    title: "Strategic Pivot Toward National Security Customers"
    body: "Sierra Space has progressively reallocated engineering and production bandwidth toward national security customers. While civil NASA contracts and commercial Orbital Reef habitats provide long-term technological prestige, defense programs such as Ghost and Spectre provide mission demand that can be capitalized ahead of private space station commercialization."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU012"
  - calloutType: "risk"
    title: "Customer Concentration and Timeline Vulnerability"
    body: "The commercial viability of Sierra Space's flagship Dream Chaser and LIFE habitat systems remains concentrated on two major programs: NASA ISS resupply and the Blue Origin-partnered Orbital Reef. Any schedule slippage in orbital flight demonstrations or delays in private space station commercialization poses demand absorption risk."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU008"
