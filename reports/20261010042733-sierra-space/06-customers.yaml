  title: "Customers"
  summary: "Sierra Space maintains a dual-track customer architecture balancing long-cycle civil space and defense contracts, including a 6-mission NASA ISS resupply award and classified national security programs, while navigating commercial space station market timing uncertainties."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Demand Drivers"
    body: "Sierra Space structures its commercial and operational model across three distinct customer segments: civil government space agencies, national security and defense entities, and commercial space enterprises. Civil space demand is led by NASA through long-term institutional programs, most notably the Commercial Resupply Services contract anchoring the Dream Chaser spaceplane. In parallel, national security space has emerged as the fastest-growing demand vector, encompassing the U.S. Space Force, intelligence agencies, and defense prime contractors requiring responsive space retrieval, domain awareness, and autonomous proximity operations. Commercial customers represent an emerging third tier focused on payload hosting, microgravity biomanufacturing research, and long-term space station infrastructure partnerships. Each customer cohort exhibits distinct procurement dynamics, funding horizons, security accreditation requirements, and decision-making structures, necessitating dedicated engineering and business development interfaces."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-operational-scale"
    title: "Adoption Trajectory and Mission Scale"
    body: "The company's customer adoption trajectory reflects a foundation built on heritage space hardware transitioned into integrated orbital platforms. Sierra Space's Orbital Missions and Services division traces an operational history covering 23 delivered space vehicles and component support for more than 400 space and interplanetary missions. Modern operational adoption centers on Dream Chaser's firm commitment of at least six uncrewed cargo resupply missions to the International Space Station, establishing guaranteed flight cadence and flight-proven qualification. To align this multi-segment customer pipeline with factory output, Sierra Space established a formal Sales, Inventory, and Operations Planning discipline connecting CRM deal flows, ERP manufacturing resource planning, and master assembly schedules across satellite, spacecraft, and subsystems production lines. Capitalization following the $550 million Series C equity round at an $8 billion valuation in early 2026 has enabled substantial manufacturing expansion in Colorado to support both contracted civil commitments and accelerating defense task orders."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU006"
      - "CU009"
      - "CU014"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-deployments-and-contracts"
    title: "Named Customer Deployments and Contract Proof"
    body: "Verifiable customer deployment proof is anchored by marquee government awards and strategic commercial alliances. NASA represents the primary anchor customer with firm mission orders for Dream Chaser cargo delivery and runway landing returns, providing essential validation of the vehicle's maneuverable lifting-body architecture. On the national security front, the company has contracted and flight-tested specialized platforms, including the Ghost precision delivery system engineered to return orbital cargo to precise Earth locations within 90 minutes, alongside the Spectre satellite engineered for precision rendezvous and proximity operations. For the commercial market, Sierra Space is co-developing the Orbital Reef space station with Blue Origin, contributing its expandable Large Integrated Flexible Environment habitat technology. In addition, the company has signed contracts with commercial and national security customers to fly auxiliary payloads aboard Dream Chaser's inaugural orbital flight, demonstrating customer willingness to commit payloads ahead of full commercial station availability."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU005"
      - "CU007"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU003"
  - id: "retention-expansion-and-concentration-risks"
    title: "Retention Dynamics and Customer Concentration Vulnerabilities"
    body: "While Sierra Space has assembled a high-profile backlog across civil and military spheres, its customer portfolio exhibits meaningful concentration vulnerabilities and long-cycle dependency risks. The commercialization timeline for private space stations remains subject to industry-wide uncertainties regarding private market demand depth, commercial LEO station operating economics, and post-ISS transition timing. Sierra Space's near-term revenue trajectory is heavily dependent on the execution of its initial Dream Chaser demonstration flight and timely delivery on fixed-price NASA milestones. Recognizing the extended adoption cycles of commercial habitat infrastructure, management has strategically prioritized responsive national security solutions to generate near-term contracting volume. However, because specific contract values, program profitability margins, and customer retention metrics remain closely held private disclosures, independent verification of backlog durability and customer unit economics requires access to confidential company records."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU005"
      - "CU007"
      - "CU008"
      - "CU012"
      - "CU013"
