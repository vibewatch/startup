  topStrengths:
    - Large private capital base and tier-1 sponsor support
    - Meaningful defense contract momentum with over $1.5 billion of announced awards
    - Broad technical platform spanning Dream Chaser, LIFE, and defense satellite systems
  topRisks:
    - Private disclosure opacity leaves revenue, margin, and burn quality unverified
    - Dream Chaser and commercial station timelines still depend on successful execution
    - Valuation already prices in substantial commercial and defense scaling
  unresolvedGaps:
