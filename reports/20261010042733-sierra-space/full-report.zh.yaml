      - number: '3.2'
        title: 广度形成差异化，但多数主张仍来自公司自身
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 披露的范围不止一艘航天器。公司称其子系统和组件覆盖 23 艘航天器以及超过 400 次成功的航天和星际任务，并介绍了用于在轨服务的新一代小卫星产品线。其国家安全页面还展示了用于载荷返回的
              Ghost、用于交会和近距离操作的 Spectre，以及基于零信任架构、支持 AI 且与平台无关的 Sierra
              操作系统。这样的广度有利于交叉销售和复用生产基础设施，但不等于已独立证明与每个专业厂商相当。2026 年 10 月访问时，同一官方页面仍称 Spectre 计划于 2025
              年末发射，却未说明结果，因此路线图主张应与已交付能力分开评估。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
