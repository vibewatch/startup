      - number: '5.4'
        title: 快速地面回收与自主软件架构
        blocks:
          - type: paragraph
            body: >-
              作为重型轨道运输的补充，Sierra Space 开发了 Ghost，这是一种一次性低升阻比再入飞行器，利用可展开减速器按需精准返回货物。Ghost 无需固定回收基础设施，可在 90
              分钟内将轨道存储或亚轨道轨迹上的载荷安全直接送回指定地面地点，用于战术军事物流和应急补给任务。2026 年 5 月美国太空司令部 Apollo Nexus 演习期间，Ghost 在 Dugway Proving
              Ground 上空从 35,000 feet 和 68,500 feet 高度投放，成功回收软件定义无线电和液体载荷。Air Force Research Laboratory 的 REGAL 研究正在评估将基础
              150 kg 载荷能力扩展至数 tonnes。Sierra Black OS 和 STAR（Sierra Toolkit for Autonomous
              Rendezvous）软件套件负责控制这些多样化运营领域。Sierra Black OS
              基于零信任架构，提供与平台无关的故障安全自主能力、实时传感器融合和多域指挥控制，支持空间、空中和地面系统的交会及近距离操作，将 Sierra Space 的硬件组合统一为国防与商业运营栈。
