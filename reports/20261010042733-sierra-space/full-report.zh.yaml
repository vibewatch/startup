      - number: '3.4'
        title: 壁垒取决于交付，而非类别标签
        blocks:
          - type: paragraph
            body: >-
              现有证据池中最有防守力的要素是积累的飞行经验、当前产能、大型项目订单，以及跨卫星、子系统、返回飞行器和自主软件销售的能力。一篇独立行业文章称 Sierra Space 提前三个月完成 SDA
              项目前九个结构件，但该报道依赖公司披露，并非政府验收记录。下行风险在于执行和可比性：产品组合中有些项目的当前里程碑状态未披露，第三方同行目录也未就直接竞争集合达成一致。人才同样存在争议；Built In
              描述了市场化薪酬、激励和股权工具，但这些做法不能证明留任或生产率。因此，持久优势需要经验证的按时交付、重复订单和经济性披露，而不只是业务广度。
            claimRefs:
              - CP002
              - CP005
              - CP011
              - CP015
              - CP016
