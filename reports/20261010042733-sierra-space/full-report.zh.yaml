      - number: '1.3'
        title: 资本结构、私有估值与资产负债表透明度
        blocks:
          - type: paragraph
            body: >-
              自 2021 年分拆以来，Sierra Space 已获得超过 $2.0 billion 的股权资本，成为航空航天行业私营估值最高的公司之一。公司于 2021 年 11 月以 $4.5 billion 估值完成
              $1.4 billion 的 Series A 融资，2023 年 9 月以 $5.3 billion 估值完成 $290 million 的 Series B，并于 2026 年 3 月 5 日完成 $550
              million 的 Series C 股权融资。该轮由 LuminArx Capital Management 领投，General Atlantic、Coatue、Moore Strategic
              Ventures 和 Andalusian Private Capital 参与，投后估值达到 $8.0 billion。然而，Sierra Space 是一家私营公司，依据 SEC Rule 506(b) 通过
              Form D 提交豁免发行，因此明确拒绝披露收入区间。经营利润率、经常性收入、EBITDA、现金消耗率和合并现金余额仍未披露，分析只能依赖合同上限，而非经审计的损益表表现。
            claimRefs:
              - CO007
              - CO008
              - CO009
