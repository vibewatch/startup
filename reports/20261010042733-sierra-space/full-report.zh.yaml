  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、积压订单构成与变现模式
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的收入来自民用太空运输、国家安全载荷和国防子系统，但收入基础的构成及未来稳定性正经历结构性转变。其商业基础过去由 NASA 于 2016 年授予、至少包含七次货运任务的
              Commercial Resupply Services-2（CRS-2）合同支撑；2025 年 9 月 NASA 与 Sierra Space 共同修改合同后，情况发生变化。根据修订，NASA 将
              Tenacity 首飞改为计划在 2026 年末进行的无人自由飞行演示，并取消购买固定数量运营补给飞行的承诺。为弥补保证性民用货运收入减少，Sierra Space 于 2026 年 9 月宣布已为 Dream
              Chaser 首飞预订未披露的国家安全和商业载荷，形成混合多载荷运营模式。更广泛的国防组合中，Orbital Missions and Services 部门依托超过 400
              次历史任务贡献组件和卫星平台收入，但细分里程碑确认时间表和利润率贡献仍未披露。
