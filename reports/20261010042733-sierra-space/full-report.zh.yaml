      - number: '2.4'
        title: 采用约束、竞争壁垒与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的航天飞机和轨道栖息舱平台面临严重的运营与竞争约束。Dream Chaser 商业化一再延期，首次飞行从运营型 ISS 补给对接任务改为 2026
              年末无人自由飞行演示。该飞行器仍高度依赖 United Launch Alliance 的 Vulcan 火箭，而后者累计飞行经验有限。与此同时，SpaceX 的 Dragon
              凭借已验证的飞行可靠性、高发射频次和结构性成本优势建立了牢固壁垒。关键尽调缺口在于：International Space Station 补贴结束后，商业制药和工业企业是否愿意为微重力制造支付可盈利的商业价格。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: 证据摘要
        blocks:
          - type: callout
            title: 国防积压订单提供近期资本缓冲
            body: >-
              Sierra Space 转向国家安全航天系统，近期 $1.5 billion 国防订单和 $740 million 的 SDA Tranche 2
              星座合同提供了收入可见性及现金流支持，等待商业航天飞机物流和轨道生物制造市场成熟。
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
          - type: callout
            title: 商业 LEO 空间站需求仍依赖补贴且具投机性
            body: 公司预测截至 2038 年低地球轨道累计 TAM 为 $154 billion，但在 NASA 资助的 ISS 探索之外，商业生物制造和私人研究需求仍基本未经验证，使长期空间站投资暴露于显著的客户采用风险。
            calloutType: risk
            claimRefs:
              - CM004
              - CM005
              - CM010
