      - number: '1.4'
        title: 运营里程碑、运输延误与国防扩张
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的运营路线采取双轨战略：一边探索商业航天，一边激进扩张国家安全卫星生产。旗舰 Dream Chaser 相比 2021 年最初目标大幅延期，首次入轨发射推迟至 2026 年末。2025
              年 9 月，NASA 与 Sierra Space 共同修改 Commercial Resupply Services 2（CRS-2）合同，取消首飞必须保证对接 ISS 的要求，将 Demo-1
              改为无人自由飞行轨道测试。与此同时，Sierra Space 将大量资源转向国防科技项目。公司获得 Space Development Agency 18 颗卫星 Tranche 2 Tracking Layer
              订单，最高潜在价值 $740 million；2026 年 7 月又获得最高 $798 million 的 Other Transaction Authority 订单，为 18 颗 Accelerated
              Missile Defense Tranche 3 卫星供货。商业目的地开发则继续通过与 Blue Origin 合作的 Orbital Reef 推进，核心是 LIFE 充气式栖息舱。
            claimRefs:
