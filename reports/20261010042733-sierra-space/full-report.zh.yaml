      - number: '2.2'
        title: 轨道基础设施 TAM、SAM 与 SOM 分析
        blocks:
          - type: paragraph
            body: >-
              评估 Sierra Space 的可触达机会，必须将理想化的商业轨道预测与实质国防订单分开。公司内部市场分析确定四个地面目标垂直领域——半导体与先进玻璃、单克隆抗体与药物制剂、细胞检测和再生医学——2022
              年合计规模为 $900 billion，按 8.3% CAGR 增长至 2038 年的 $3.6 trillion。以此为地面基准，公司估计截至 2038 年 LEO 累计 TAM 约为 $154
              billion，仅相当于地面工业支出的不到 1% 捕获率。Sierra Space 还测算，先发商业空间站可在 30% EBIT 利润率下获得 $64 billion 累计收入。不过这些数字仍属推测；当前 SAM
              由已授予的 $1.5 billion 国防合同界定。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
              - CM014
