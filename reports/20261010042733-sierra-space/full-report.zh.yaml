      - number: '4.2'
        title: 成本结构、运载火箭依赖与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Dream Chaser 的经济可行性取决于可重复使用航天飞机的单位经济性、飞行器周转成本和第三方运载器采购费用。与 SpaceX Dragon 和 Northrop Grumman Cygnus
              等在再入时溅落或烧毁的太空舱不同，Dream Chaser 的设计是在低于 1.5g 的低加速度下，将最多 1,750 kilograms 的精密货物送回符合 Boeing 737
              评级的标准跑道。该设计无需海上回收物流即可取回客户硬件，也让载荷可以避免完整环境鉴定测试。然而，飞行层面的单位成本很大程度受外部发射采购拖累：Sierra Space 依赖 United Launch
              Alliance 的 Vulcan Centaur 火箭将 Tenacity 送入轨道，任务利润率因此暴露于运载器价格、可用性和排期异常。飞行器周转人力、热防护瓦翻修，以及 Vandenberg Space
              Force Base 的自主跑道着陆运营也尚未在实际飞行中验证，因此在取得首次飞行演示数据前，生命周期毛利率预测仍属推测。
