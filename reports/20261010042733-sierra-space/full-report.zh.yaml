  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 可重复使用航天飞机运输与 Dream Chaser 平台
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的运输业务以 Dream Chaser 为核心。这是一种可重复使用的升力体航天飞机，设计为装在标准五米火箭整流罩内垂直发射，再水平返回常规商业跑道。Dream Chaser 在 2021
              年公司分拆前由 Sierra Nevada Corporation 开发，设计目标是在低于 1.5 g
              的低重力大气再入减速度下运行，为敏感科学实验、生物制造载荷和返回宇航员提供关键保护。基础无人货运配置可搭载最多 5,000 kg 加压载荷和 500 kg 非加压货物，并配备一次性 Shooting Star
              后舱，提供电力、主动热控和额外货物处理。首架飞行器 Tenacity 计划从 Kennedy Space Center 发射并在 Vandenberg Space Force Base
              着陆，执行轨道演示飞行，目标是无人自由飞行而非首次空间站对接。相比传统太空舱溅落，该架构运营灵活性更高，但 Sierra Space 仍需解决 ULA Vulcan Centaur
              火箭集成、热防护瓦耐久性，以及在扩展到载人配置前证明多任务周转效率等执行难题。
            claimRefs:
