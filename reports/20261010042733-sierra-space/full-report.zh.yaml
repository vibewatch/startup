      - number: '7.3'
        title: 合作伙伴与客户依赖风险：NASA 任务压缩与发射瓶颈
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的收入和商业路线图存在高度集中及交易对手风险。根据 NASA Commercial Resupply Services 2（CRS-2）合同，2025 年 9 月修订将 Dream
              Chaser 首飞（SSC Demo-1）与 ISS 对接要求脱钩；在 NASA 准备于 2030 年退役 ISS 之际，取消了七次运营空间站补给对接的保证。此外，Dream Chaser 依赖 United
              Launch Alliance（ULA）的 Vulcan Centaur 运载火箭，任务时间表因此暴露于助推器发射节奏瓶颈。Sierra Space 虽通过大幅转向国家安全国防科技积极降低民用航天风险——获得超过
              $1.5 billion 的国防卫星积压订单，包括 2026 年 7 月新增的 $798 million SDA 合同——但业务仍依赖联邦预算授权，以及与 Blue Origin 在 Orbital Reef
              空间站上的合作一致性。
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
