        - from: node-4
          to: node-5
          label: 大气再入
        - from: node-5
          to: node-6
          label: 飞后处理
  - id: FE001
    title: Sierra Space 综合技术与产品架构
    type: stack
    summary: 多层次的航天与防务运营栈，覆盖指挥软件、任务平台、模块化结构和地面回收。
    approximationNotes: 架构层依据已发布规格，将物理平台和软件系统组织为功能性运营层级。
    data:
      layers:
        - label: 任务自主与指挥层
          detail: Sierra Black OS 和 STAR 自主交会软件提供零信任多域边缘计算能力。
          modules:
            - Sierra Black OS 内核
            - STAR 自主 RPO 工具包
            - 零信任加密引擎
        - label: LEO 基础设施与目的地层
          detail: Orbital Reef 空间站联盟架构，整合商业研究和商业模块。
          modules:
            - Orbital Reef 空间站核心
            - 商业科学实验室
            - Blue Origin 电力桅杆接口
        - label: 可扩展栖息层
          detail: LIFE 软货物压力容器在 LEO 提供大容量生活和生物制造空间。
          modules:
            - 约束层编织物
            - 气囊隔气层
            - MMOD/MLI 防护毯
        - label: 可复用运输层
          detail: Dream Chaser 升力体航天飞机在 LEO 与地面跑道之间提供低重力货运。
          modules:
            - Tenacity 飞行器
            - Shooting Star 货运舱
            - 折叠翼整流罩接口
        - label: 卫星平台与卫星总线层
          detail: Eclipse 模块化卫星总线针对大规模跟踪和在轨加注任务优化。
          modules:
            - Horizon 大规模 LEO 总线
            - Velocity 可加注总线
            - Titan 重型平台
        - label: 快速响应地面回收层
          detail: Ghost 可部署减速器再入飞行器可在 90 分钟以内快速将载荷送回地球。
          modules:
            - 可部署减速器气动外壳
            - 制导与导航单元
            - 战术货运舱
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE013
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户从最初的任务资质评估和子系统原型设计，逐步推进到舰队规模运营部署的全生命周期。
    approximationNotes: 展示多年期飞行硬件项目中典型的防务和商业采购里程碑。
    claimRefs:
      - CU001
      - CU006
      - CU009
      - CU014
    data:
      nodes:
        - label: 1. 任务资质评估与 RFP 接洽
          touchpoints:
            - NASA CRS-2 bid qualification
            - DoD space capability requirements
            - Commercial LEO payload architecture review
        - label: 2. 合同授予与需求基线
          touchpoints:
            - Firm-fixed-price mission task orders
            - National security rapid prototyping directives
            - Consortium partnership agreements
        - label: 3. 部件与子系统原型设计
          touchpoints:
            - Axelerator 90-day rapid design cycles
            - LIFE habitat pressure burst tests
            - SI&OP demand and capacity scheduling
        - label: 4. 系统集成与环境测试
          touchpoints:
            - Thermal vacuum and vibration testing
            - Spectre autonomous RPO simulation
            - Payload multi-manifest integration
        - label: 5. 轨道发射与飞行演示
          touchpoints:
            - Vulcan Centaur launch vehicle integration
            - Maiden Dream Chaser flight demonstration
            - Direct autonomous runway recovery
        - label: 6. 舰队运营与经常性服务扩张
          touchpoints:
            - Recurring 6-mission NASA cargo cadence
            - Multi-domain defense satellite servicing
            - Commercial Orbital Reef laboratory operations
