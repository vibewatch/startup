      - number: '5.3'
        title: 标准化卫星平台、在轨加注与国家安全系统
        blocks:
          - type: paragraph
            body: >-
              为在长周期空间站项目成熟前创造可扩展工业收入，Sierra Space 开发了 Eclipse 卫星平台系列，覆盖 Horizon、Velocity 和 Titan 三类模块化平台。Horizon
              是大规模低地球轨道星座的标准化生产底盘，尤其支持 Space Development Agency 的导弹预警与跟踪架构。Sierra Space 已完成 18 颗 Tranche 2 Tracking
              Layer 卫星的结构组装，并获得 18 艘 AMDT3 Golden Dome
              航天器订单，在科罗拉多州建立高节拍卫星制造线。平台系列集成具备在轨加注能力的专有推进系统，使卫星能够机动、执行交会近距操作，并为国家安全和商业客户延长运行寿命。敏捷工程文化引入早期清单验证，防止子系统在后期偏离，从而加快开发。依托
              Orbital Missions and Services 部门的飞行履历——已交付 23 艘完整航天器、支持超过 400 次任务——Sierra Space 将 Eclipse
              定位为可靠的多任务底盘，同时应对供应商依赖和高密度传感器载荷的高功率散热问题。
            claimRefs:
              - CE010
