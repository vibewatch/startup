      - number: '7.2'
        title: 运营与技术风险：飞行准备度与栖息舱商业化
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在旗舰硬件项目的执行，包括 Dream Chaser 航天飞机 Tenacity 和 Large Integrated Flexible Environment（LIFE）充气式栖息舱。Sierra
              Space 虽已在 NASA Johnson Space Center 完成飞行前电磁干扰（EMI）测试和热真空舱（TVAC）散热器试验，但核心飞行计划相比最初基线已长期延期超过五年。Dream Chaser
              首飞推迟至 2026 年末，改为自由飞行演示，而非直接向 International Space Station 运送货物。与此同时，LIFE 商业化高度依赖未获资助的 Space Act
              Agreements，例如与 NASA 签署的 Collaborations for Commercial Space Capabilities 2（CCSC2）协议；该协议为 Pathfinder 可扩展模块和
              DC-200 载人运输概念制定了延续至 2028 年的 33 项里程碑技术路线，却未承诺直接联邦资金。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
