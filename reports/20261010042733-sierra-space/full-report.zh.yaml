              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 已在国家安全国防和轨道基础设施领域建立战略位置 [CV004]。核心投资逻辑是双引擎增长战略：扩大高优先级国家安全国防平台，同时将太空运输和栖息舱基础设施商业化 [CV005]。2026
              年 3 月，公司完成由 LuminArx Capital Management 领投的 $550 million Series C 融资，累计投资额超过 $2 billion，投后估值重估至 $8.0
              billion [CV001, CV002]。运营层面的关键优势是可重复的国防业务，包括 $740 million 导弹跟踪订单，以及 2026 年追加的 $798 million、面向 18 颗卫星的订单
              [CV003]。反向逻辑则来自严重的财务不透明和技术执行瓶颈 [CV007]。Sierra Space 是私营公司，不公开披露详细财务报表、收入运行率或毛利率 [CV007]。此外，其旗舰商业航天飞机 Dream
              Chaser 遭遇延期，导致首次发射受阻，原定的 International Space Station 对接也被取消；公司直到 2025 年 11 月才在 NASA Kennedy Space Center
              完成飞行前测试 [CV008]。如果商业航天基础设施采用速度落后于国防制造产能，这些因素将造成不对称的下行风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
      - number: '8.2'
        title: 融资背景、资本结构与估值纪律
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的资本轨迹显示，估值快速增长的同时，资本密集度也很高 [CV001, CV002]。公司于 2021 年从 Sierra Nevada Corporation 分拆出来后完成 $1.41
              billion 的 A 轮融资；2023 年 9 月估值达到 $5.3 billion，2026 年 3 月投后估值达到 $8.0 billion [CV001, CV010]。在二级及 IPO
              前经纪市场中，二级模型估值达到 $9.14 billion，反映出散户和合格投资者通过 UpMarket 等平台的投机性需求，但这些交易受到严格的低流动性和转让限制约束 [CV009,
              CV011]。公司域名下运营的商业商品和品牌渠道，也进一步说明 公司正在核心航空航天防务业务之外推进品牌认知 [CV016]。不过，公开证据显示，Series C 优先权、优先清算倍数，以及
              LuminArx、Coatue 和 General Atlantic 等机构投资方可能持有的下轮融资棘轮保护，仍存在重大结构性信息缺口 [CV006, CV010]。
              在缺少经审计收入或国防积压订单转化计划验证的情况下，以高于 $8.0 billion 私募市场 headline 倍数的价格买入，会让投资者暴露于显著的 倍数压缩和稀释风险 [CV007, CV012]。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV014
              - CV015
      - number: '8.3'
        title: 情景分析、可比背景与尽调框架
        blocks:
          - type: paragraph
            body: >-
              估值判断需要评估公司在国防合同和商业太空基础设施上的非对称经营路径 [CV003, CV005]。在乐观情景下，Sierra Space 会快速扩大 Victory Works 工厂规模，将 $798
              million 的卫星积压订单转化为两位数 EBITDA 利润率，并成功执行 Dream Chaser 和 Ghost 运载系统的 商业飞行 [CV003, CV005]。基准情景下，国防生产保持稳定，但
              Dream Chaser 商业收入受认证周期拖累，爬坡缓慢，企业价值维持在 $8.0 billion 附近 [CV001,
              CV008]。悲观情景下，航天飞机项目持续延期或卫星合同利润率下滑，叠加高额经营现金消耗，触发下轮融资或结构化优先权 的悬置风险 [CV007, CV008]。将 Sierra Space 与 Terran
              Orbital（融资 $144M，已被收购）、Apex（融资 $718M）和 Vast（2026 年 3 月完成 $500M A 轮）等已获融资的空间系统和硬件竞争者比较，可以看出 Sierra Space
              的私募估值处于行业领先梯队 [CV006, CV013]。 因此，在经审计收入披露和轨道飞行验证完成前，更稳妥的建议是继续研究；当前风险高，估值已显得偏紧 [CV014, CV015]。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资判断：$8.0B 估值下继续研究
            body: >-
              投资者应继续对 Sierra Space 保持“继续研究”的判断。虽然公司凭借 SDA 合同累计获得超过 $1.5 billion 的订单，国防合同动能强劲，但 $8.0 billion
              估值缺少已披露的收入和利润率分母，商业航天飞机的轨道执行能力也尚未得到证明。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV014
          - type: callout
            title: 商业执行瓶颈与资本结构悬置风险
            body: Dream Chaser 测试延期导致原定的 ISS 对接任务取消，暴露出项目进度的脆弱性。在缺少股权结构表披露的情况下，Series C 的高级清算优先权会让普通股及非领投股权持有人面临下行风险。
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV012
