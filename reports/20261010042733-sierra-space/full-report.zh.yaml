      - number: '7.4'
        title: 证据摘要
        blocks:
          - type: callout
            title: SDA 项目的诉讼风险与分包商摩擦
            body: >-
              Geost 提起的 $17.1 million 违约诉讼凸显 Sierra Space 旗舰 $740 million SDA Tranche 2 Tracking Layer
              项目的供应链紧张，也说明激进更换主承包商可能引发诉讼责任、潜在惩罚性损害赔偿，以及与国防采购机构的声誉摩擦。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: NASA CRS-2 修订条款压缩民用商业化窗口
            body: >-
              NASA 于 2025 年 9 月修订 CRS-2 合同，从 Demo-1 中移除保证 ISS 对接，反映出 ISS 计划于 2030 年退役前的时间表压缩。这一变化迫使 Sierra Space
              加快多客户载荷集成和国防卫星产量，以支撑其 $8 billion 估值。
            calloutType: insight
            claimRefs:
              - CR012
