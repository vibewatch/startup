      - number: '5.2'
        title: 充气式栖息系统与商业空间站目的地
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的轨道基础设施战略以 Large Integrated Flexible Environment（LIFE）栖息舱模块为支点。LIFE
              采用可扩展软性压力壳，由高强度编织约束带、内部气囊保压屏障和外部微流星体及轨道碎片（MMOD）防护毯构成。模块以紧凑形态装入五米载荷整流罩，入轨后展开为约 285 cubic meters
              的三层楼高加压空间；一次专门发射即可提供约三分之一的 International Space Station 总加压容积。Sierra Space 在 NASA Marshall Space Flight
              Center 完成全尺寸极限爆破压力测试，证明设计结构完整性及超过安全要求的压力裕度。LIFE 是 Sierra Space 对 Orbital Reef 的主要栖息贡献；Orbital Reef 是与 Blue
              Origin 共同牵头、Boeing 和 Redwire 等伙伴支持的商业低地球轨道空间站。但该计划面临开发摩擦和企业优先级分歧。联盟获得 $130 million 的 NASA Commercial LEO
              Destinations（CLD）Phase 1 基础订单后，截至 2026 年仅拨付 $24 million；Blue Origin 也越来越优先推进数十亿美元的 Blue Moon 月球着陆器项目。NASA
              虽已完成 System Definition Review，并将最终 CLDC Phase 2 RFP 排在 2026 年 9 月末，Sierra Space 的 2026 年末 LIFE
              探路者飞行仍缺少确认的部署时间，迫使公司建立独立模块飞行履历。
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
