  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 受限市场规模金字塔，展示市场如何从数万亿美元级的理论性地面产业垂直市场，逐步收窄到有实际合同支撑的防务订单。
    data:
      items:
        - label: 地面可触达目标市场
          value: 3600
          unit: USD B
          detail: 覆盖生物制药、半导体和再生医学的 2038 年地面市场规模预测
        - label: 2022 年地面基准
          value: 900
          unit: USD B
          detail: 目标工业部门的 2022 年地面市场基准，按 8.3% CAGR 增长
        - label: LEO 累计可触达市场（TAM）
          value: 154
          unit: USD B
          detail: 预计截至 2038 年的累计低地球轨道总可触达市场（地面市场捕获率低于 1%）
        - label: 首个商业空间站捕获市场（SAM）
          value: 64
          unit: USD B
          detail: 首个投入运营的商业空间站平台的累计收入潜力预测
