        title: 资本充足性、现金消耗风险与机构投资判断
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 通过 LuminArx Capital Management 领投的 2026 年 3 月 $550 million Series C 融资建立了充足流动性，累计私有资本募资额超过
              $2.2 billion，投后估值达到 $8.0 billion。但公司处于资本密集型开发环境，航天飞机制造、飞行鉴定和国防卫星产品线持续消耗大量现金。由于 Sierra Space 不公开披露 GAAP
              收入、毛利率、EBITDA 或经营净现金流，机构投资判断无法核实其披露的 $3.4 billion 积压订单究竟是有资金支持的固定总价任务订单，还是不具约束力的框架协议。NASA 的 CRS-2
              承诺如今取决于成功演示，而 International Space Station 计划于 2030 年退役；在确认经常性国防合同和商业下行货运客户承诺前，未来收入可见性不足以支撑机构投资判断。
