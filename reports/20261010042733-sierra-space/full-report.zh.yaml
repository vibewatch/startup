        - 轨道飞行演示无瑕疵、跑道回收安全，且商业货运班次稳定
      - - 财务反题
        - 收入质量不透明、合同盈利能力未知，股权结构表条款未经核实
        - 公司未公开披露收入、EBITDA 或清算优先权
        - 完整的经审计财务披露证明运营现金流为正
    notes: 对比防务积压订单扩张与商业飞行及财务不透明风险。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 运营与执行假设
      - 隐含估值 / 回报逻辑
      - 关键下行触发因素
    rows:
      - - 乐观情景
        - 25%
        - SDA Tranche 2 跟踪层按预算交付；Dream Chaser 商业货运开始定期飞行
        - $12.0B–$15.0B IPO 或防务战略收购（1.5x–1.9x 上行空间）
        - 固定价格 SDA 卫星生产合同出现成本超支
      - - 基准情景
        - 50%
        - 防务卫星生产可靠扩张；Dream Chaser 完成首飞，商业货运量温和增长
        - $7.5B–$8.5B 企业价值守住（回报持平至温和）
        - 轨道延误进一步扩大，商业飞行频次推迟到 2027 年以后
      - - 悲观情景
        - 25%
        - Dream Chaser 任务异常或取消；防务利润率承压；高额现金消耗迫使公司进行稀释性融资
        - $3.5B–$5.0B 结构化下轮融资（倍数下调 38%–56%）
        - 技术飞行失败，或失去关键国防部太空开发合同
    notes: 情景分析以 $8.0B Series C 锚定估值为基础，考察防务和民用航天业务线对执行结果的敏感度。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV008
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 2021 年剥离至 2026 年防务扩张期间的关键公司、融资和运营里程碑。
    data:
      items:
        - date: '2021-04-14'
          label: 从 Sierra Nevada Corporation 剥离
          detail: Sierra Space 成为独立的商业航天实体，继承超过 30 年的航天飞行积累。
          tone: neutral
          claimRefs:
            - CO001
        - date: '2021-11-19'
          label: Series A 融资完成，金额 $1.4B
          detail: General Atlantic、Coatue 和 Moore Strategic Ventures 领投 $1.4B Series A，公司估值 $4.5B。
          tone: positive
          claimRefs:
            - CO008
        - date: '2023-09-26'
          label: Series B 融资完成，金额 $290M
          detail: 在包括 MUFG 和 Tokio Marine 在内的日本财团领投下，以 $5.3B 估值融资 $290M。
          tone: positive
          claimRefs:
            - CO008
        - date: '2024-01-16'
          label: SDA Tranche 2 跟踪层合同授予
          detail: 获得太空发展局最高 $740M 的合同，用于设计和建造 18 颗导弹跟踪卫星。
          tone: positive
          claimRefs:
            - CO012
        - date: '2025-09-25'
          label: NASA CRS-2 合同修改
          detail: NASA 与 Sierra Space 修订 CRS-2 协议，取消有保障的 ISS 补给飞行，并将 Demo-1 改为自由飞行。
          tone: adverse
          claimRefs:
            - CO010
            - CO011
        - date: '2026-03-02'
          label: CEO 领导层过渡至 Dan Jablonsky
          detail: 任命前 Maxar CEO Dan Jablonsky 为首席执行官；创始人 Fatih Ozmen 继续担任董事会主席。
          tone: neutral
          claimRefs:
            - CO004
        - date: '2026-03-05'
          label: Series C 融资完成，金额 $550M
          detail: 完成由 LuminArx Capital Management 领投的 $550M 股权融资，投后估值达到 $8.0B。
          tone: positive
          claimRefs:
            - CO007
        - date: '2026-07-13'
          label: SDA AMDT3 导弹防御合同授予
          detail: 从 SDA 获得最高 $798M 的 OTA 合同，用于 18 颗加速导弹防御 Tranche 3 跟踪卫星。
          tone: positive
          claimRefs:
            - CO013
    approximationNotes: 日期代表官方新闻公告日期、SEC Form D 提交日期或机构合同执行日期。
    claimRefs:
