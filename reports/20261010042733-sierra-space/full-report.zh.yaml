      - number: '3.3'
        title: 资本与政府订单强化准入，但定价权不明
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 在资本与政府采购上拥有清晰位置。公司 2026 年 3 月发布的公告披露，以 $8 billion 投后估值获得 $550 million
              股权投资，资金将用于扩充产能和国家安全解决方案。同一公告还披露了 $450 million 的四颗以上卫星建造订单，以及价值最高 $740 million、面向 18 颗卫星的 SDA Tranche 2
              Tracking Layer
              合同。这些订单说明公司能够进入有资金支持的项目并获得生产需求，但合同最高价值不是已确认收入，也不能揭示单位经济性。现有证据还未披露目录价、实际价格、折扣、续约机制、客户集中度、终止权，或客户能否在供应商之间多家采购。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
