            title: 已获订单与产能是最清晰的差异化因素
            body: $450 million 的机密订单、最高潜在价值 $740 million 的 SDA 合同，以及据报道提前交付九个结构件，比宽泛的产品定位提供了更具体的竞争信号。但这些事实仍未披露项目利润率或客户验收情况。
