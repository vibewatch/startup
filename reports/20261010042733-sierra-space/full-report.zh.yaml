  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合随任务而变
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 很难与某一个同质化同行群体直接比较。公司定位横跨国家安全、民用和商业任务，而独立目录分别将发射服务商、卫星制造商、商业空间站开发商和传统国防主承包商列为替代者。Distill 列出
              SpaceX、Axiom Space、Blue Origin、Firefly Aerospace、Apex、Lockheed Martin、Northrop Grumman、Boeing、Voyager 和
              Rocket Lab；Craft 则聚焦 Firefly、bluShift、Xplore 和 SpinLaunch；Owler 将 Relativity Space
              列为最大竞争者。分歧具有分析意义：竞争应按采购任务评估，而不是把所有航天公司都视为直接替代者。自研和现状仍是相关尽调类别，但分配的证据池未识别或量化它们。
            claimRefs:
              - CP001
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
