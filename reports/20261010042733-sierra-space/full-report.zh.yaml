  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 从客户合同授予到收入实现及运营现金贡献的端到端商业转化流程。
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI010
      - CI013
    data:
      nodes:
        - id: node-1
          label: 客户合同授予
          detail: 执行 NASA CRS-2 任务订单、国家安全载荷和商业轨道协议。
          tone: neutral
        - id: node-2
          label: 里程碑集成与测试
          detail: 完成环境测试、遥测验证和载荷封装。
          tone: neutral
        - id: node-3
          label: 发射载具集成
          detail: 在肯尼迪航天中心将 Tenacity 与 ULA Vulcan Centaur 对接，并完成发射场准备。
          tone: neutral
        - id: node-4
          label: 轨道运行与部署
          detail: 进行多日自由飞行演示，交付共同搭载的政府和民用载荷。
          tone: positive
        - id: node-5
          label: 跑道回收与货运交付
          detail: 在范登堡太空军基地自主跑道着陆，以低于 1.5g 的低冲击方式返回。
          tone: positive
        - id: node-6
          label: 现金回收与可复用周转
          detail: 确认里程碑收入、交付客户下行货物，并让飞行器周转以执行下一次飞行。
          tone: positive
      edges:
