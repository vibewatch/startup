              NASA 2025 年 9 月的合同修订免除了该机构的最低飞行义务，将 Tenacity 首飞改为无人自由飞行演示。Sierra Space
              仍有资格在演示后竞争未来空间站补给订单，但未来货运收入的可预测性已明显下降。
