  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群细分与需求驱动因素
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 将商业和运营模式分为三类客户：民用政府航天机构、国家安全与国防实体，以及商业航天企业。民用航天需求由 NASA 的长期机构项目带动，其中最重要的是支撑 Dream Chaser 的
              Commercial Resupply Services 合同。与此同时，国家安全航天成为增长最快的需求方向，涵盖需要快速太空回收、空间态势感知和自主近距操作的 U.S. Space
              Force、情报机构及国防主承包商。商业客户构成新兴的第三层，重点是载荷搭载、微重力生物制造研究和长期空间站基础设施合作。每类客户都有不同的采购动态、资金周期、安全认证要求和决策结构，因此需要专门的工程及业务开发接口。
            claimRefs:
