chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、沿革与业务架构
        blocks:
          - type: paragraph
            body: >-
              Sierra Space Corporation 于 2021 年通过 Sierra Nevada Corporation（SNC）Space Systems
              部门的商业分拆成立，成为独立的航空航天与国防科技企业。公司总部位于科罗拉多州路易斯维尔，积累了逾三十年的飞行经验，在五百多次任务中交付过硬件。业务模式将 Sierra Space 定位为垂直整合平台，围绕
              Space Transportation、Space Destinations 和 Space Applications 三大部门提供太空即服务。Space Transportation 以可重复使用的
              Dream Chaser 升力体航天飞机为核心；Space Destinations 涵盖包括 Large Integrated Flexible
              Environment（LIFE）栖息舱在内的可扩展低地球轨道基础设施；Space Applications 则为民用、国防和商业客户提供卫星平台、在轨服务飞行器，以及高功率推进和电源子系统。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO007
