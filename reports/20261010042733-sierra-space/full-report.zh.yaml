      - number: '1.5'
        title: 战略风险、资本治理与核心尽调缺口
        blocks:
          - type: paragraph
            body: >-
              独立评估 Sierra Space 需要审视三类主要风险：私有披露不透明、项目执行瓶颈和资本结构治理。由于公司不发布经审计的损益表，无法仅凭公开文件独立判断国防积压订单的转化质量和节奏。Space
              Development Agency 的合同授予代表最高潜在合同价值，而非已确认收入。民用太空运输上，Dream Chaser 依赖 United Launch Alliance 的 Vulcan Centaur
              火箭完成运载器集成，发射频次瓶颈可能进一步推迟商业验证。此外，Series C 优先股的清算优先权、反稀释保护和赎回约定等具体条款仍属机密，二级股份估值及普通股上行空间必须通过闭门审阅投资者权利协议直接核实。
            claimRefs:
              - CO009
              - CO010
              - CO011
      - number: '1.6'
        title: 证据摘要
        blocks:
          - type: callout
            title: 战略转向国防业务，在飞行演示前稳住收入底盘
            body: >-
              Sierra Space 已逐步将资本和业务画像从纯商业航天探索公司重塑为国防科技主承包商。获得超过 $1.5 billion 的 Space Development Agency
              和机密卫星订单，为公司提供运营收入托底，部分隔离商业 LEO 目的地项目的进度风险。
            calloutType: insight
            claimRefs:
              - CO007
              - CO012
              - CO013
          - type: callout
            title: 旗舰运输项目缩减合同范围并持续延期
            body: >-
              Dream Chaser 采用独特的升力体跑道着陆技术，但多年延期促使 NASA 在 2025 年 9 月取消保证 ISS 补给飞行的义务。计划于 2026 年末进行的飞行如今是无人自由飞行演示，未来 NASA
              任务订单将转为演示后的酌情评估。
            calloutType: risk
            claimRefs:
              - CO010
              - CO011
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与向国防科技的战略转向
        blocks:
          - type: paragraph
            body: >-
              Sierra Space
              横跨两条不同市场边界：高增长的国家安全航天系统，以及长周期商业低地球轨道（LEO）基础设施。国家安全业务包含大规模小卫星星座、战术在轨交会飞行器和快速大气层载荷返回，但不包含重型运载火箭和传统单体式地球静止轨道军用通信平台。在地缘政治紧迫性和国防部重振本土航天工业基础的优先事项推动下，Sierra
              Space 转向成为核心国防科技主承包商。主要国防订单——包括 Space Development Agency 为 18 颗跟踪层卫星授予的 $740 million 合同，以及 $450 million
              的机密卫星订单——验证了客户需求，也让近期收入明确转向国防采购。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM013
