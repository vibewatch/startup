      - number: '2.3'
        title: 买方细分与政府采购动态
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的主要客户由拥有专门法定预算的政府机构买方主导。在国家安全领域，Space Development Agency
              和国防情报机构是主要买方及预算所有者，按多年拨款周期采购大规模导弹跟踪卫星平台和专业情报卫星。在民用航天领域，NASA 通过 Commercial Resupply Services
              2（CRS-2）合同兼任锚定买方和付款方，采购运往 International Space Station
              的加压货运服务。商业客户虽是微重力生物制造和栖息舱平台的长期目标用户，但私营企业的采用仍处早期，除政府支持的研究计划外，尚无具有约束力的商业采购承诺。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM009
              - CM012
