  - id: FV001
    title: 建议逻辑流程
    type: flow
    summary: 展示从运营规模到投资立场演进过程的决策树。
    data:
      nodes:
        - id: scale
          label: 国防积压订单规模（$1.5B+ SDA 卫星合同）
        - id: execution
          label: 商业飞行延误（Dream Chaser 发射前延误导致 ISS 对接作废）
        - id: opacity
          label: 财务不透明（未披露的收入、利润率和优先条款）
        - id: valuation
          label: 估值基准（2026 年 3 月 Series C 轮投后估值 $8.0B）
        - id: verdict
          label: 最终判断：进一步研究，风险评级为高
        - id: triggers
          label: 监测触发因素（NASA 飞行准备情况与经审计财务资料获取）
      edges:
        - from: scale
          to: execution
        - from: execution
          to: opacity
        - from: opacity
          to: valuation
        - from: valuation
          to: verdict
        - from: verdict
          to: triggers
    approximationNotes: 按顺序排列的链条，反映 Sierra Space 的主要投资判断驱动因素。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV014
      - CV015
