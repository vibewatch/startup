              - CO013
      - number: '1.2'
        title: 治理、董事会控制权与高管交接
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 的治理结构与母公司沿革及机构财务出资方紧密相连。控股股东 Fatih Ozmen 和 Eren Ozmen 均在董事会担任重要职务，Fatih Ozmen 出任董事长。董事会还吸纳了
              General Atlantic、Coatue Management 等主要成长型股权投资者的机构代表。2026 年，Sierra Space 完成两次高层换帅，以强化企业执行和国防定位。2026 年 3 月 2
              日，Maxar Technologies 前 CEO、DigitalGlobe 前总裁 Dan Jablonsky 接替 Tom Vice 出任 CEO。随后，公司于 2026 年 6 月任命 Lockheed
              Martin Space 前高管、SEAKR Engineering 前总裁 Jeff Schrader 为 CFO。这些任命显示，公司正有意转向国防工业规模化和公共合同执行。
            claimRefs:
              - CO004
              - CO005
