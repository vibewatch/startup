      - number: '6.5'
        title: 证据摘要
        blocks:
          - type: callout
            title: 战略转向国家安全客户
            body: >-
              Sierra Space 已逐步将工程和产能转向国家安全客户。民用 NASA 合同和商业 Orbital Reef 栖息舱带来长期技术声誉，但 Ghost 和 Spectre
              等国防项目在私人空间站商业化前即可提供可变现的任务需求。
            calloutType: insight
            claimRefs:
              - CU004
              - CU007
              - CU012
          - type: callout
            title: 客户集中度与时间表脆弱性
            body: >-
              Sierra Space 旗舰 Dream Chaser 和 LIFE 栖息舱系统的商业可行性仍集中在两个主要项目：NASA ISS 补给和与 Blue Origin 合作的 Orbital
              Reef。轨道飞行演示一旦延期，或私人空间站商业化延迟，都会带来需求消化风险。
            calloutType: risk
            claimRefs:
              - CU002
              - CU005
              - CU008
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险：分包商诉讼及多机构监督
        blocks:
          - type: paragraph
            body: >-
              Sierra Space 处于复杂的法律和监管环境中，国防合同争议及不断变化的太空交通规则直接增加运营和财务摩擦。最严重的法律风险来自丹佛 U.S. District Court
              的联邦诉讼：光学和红外传感器供应商 Geost 于 2025 年 1 月向 Sierra Space 提起 $17.1 million 违约诉讼。Geost 指称，Sierra Space
              使用其传感器载荷和早期长交期材料投资，获得 Space Force 的 Space Development Agency（SDA）$740 million 合同，为 18 颗 Tranche 2 Tracking
              Layer 卫星供货，随后于 2024 年 6 月发出停工令并试图用 Leidos 替代 Geost。除供应商争议外，Sierra Space 在民用和商业飞行运营中也面临监管摩擦。公司在 FAA Docket
              FAA-2023-1858 下提交的正式监管意见中警告，拟议 FAA Part 453 轨道碎片缓解规则与 FCC、NASA 标准存在管辖重叠，发射后避碰要求可能大幅推高 Maximum Probable
              Loss（MPL）保险需求。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
