chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、历史与领导层
        blocks:
          - type: paragraph
            body: >-
              Baseten 最容易理解为一家创始人主导的推理基础设施公司，而不是通用 MLOps 工具箱。它自己的历史把起点追溯到 2019
              年底，当时四位创始人因为亲身经历过模型部署痛点而创办公司。当前法律页面把公司主体固定为 San Francisco 的 Baseten Labs, Inc.；官网、企业版和定价页面也一致围绕高性能推理、托管
              API、训练或部署工作流来描述产品，而不是宽泛的横向软件。这个身份会影响本报告后续判断：Baseten 正把自己定位为软件层，在自有云或客户环境中运行生产 AI
              工作负载，并用合规和数据控制功能服务更敏感的工作负载。对一家后期私营公司而言，领导层连续性也异常可见。公开页面显示 Tuhin Srivastava 是 CEO 兼联合创始人，Amir Haghighat 是
              CTO 兼联合创始人；作者页仍把 Pankaj Gupta 和 Phil Howes 标为联合创始人。Series E
              博文由四位创始人共同署名，进一步说明公司仍在讲一个以创始人为中心的领导故事。治理透明度是需要保留的风险点：公开语料清楚显示 2025 年新增一名董事，但没有给出完整现任董事名单、委员会结构或创始人持股图。
