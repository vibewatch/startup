      - number: '3.3'
        title: 分发力、切换成本与信任姿态
        blocks:
          - type: paragraph
            body: >-
              Baseten
              最强的非性能论点，是客户既能保留控制权，又能避开自建推理平台的运营负担。多云路由、自托管部署和单租户选项，有助于赢下担心把关键工作负载锁进单一超大规模云厂商、或需要更严格数据驻留边界的买方。结构性取舍也很清楚：Baseten
              也依赖可移植、开放的打包方式，Cog 加原始 GPU 云等相邻工具仍然可用，因此硬切换成本低于封闭模型 API 或数据平台。信任层面，Baseten 的公开姿态领先于自助式同侪：它把 SOC 2 Type II
              和 HIPAA 主张与默认不存储输入或输出的明确声明配在一起。Modal 通过仅面向企业的 SSO、审计日志和 HIPAA 缩小了一部分差距；Replicate 仍最强于采用便利性；Runpod
              仍最强于低成本基础设施自由度。最大的分发劣势仍是超大规模云厂商的渠道权力。AWS、GCP 和 Azure 可以把 AI 采购折进既有计费、IAM 和云承诺关系，这意味着 Baseten
              必须持续证明，开源模型性能、可移植性和支持值得客户单独选择一个供应商。
