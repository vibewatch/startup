  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: standard
    summary: 公开采用路径始于技术评估，随后进入一个生产工作负载；到更后期才扩展到专属计算、治理和更大的企业承诺。
    data:
      nodes:
        - id: evaluate
          label: 评估模型
          detail: 团队测试预优化或自定义模型，比较延迟、成本和部署摩擦。
        - id: pilot-prod
          label: 上线首个生产工作负载
          detail: 搜索、语音、向量嵌入或图像生成等核心用例迁到 Baseten。
        - id: optimize
          label: 优化性能
          detail: Baseten 和客户工程师调优延迟、吞吐、成本和冷启动。
        - id: enterprise-controls
          label: 增加控制
          detail: 专属计算、单租户、安全和合规成为决策点。
        - id: expand
          label: 扩大工作负载覆盖
          detail: 客户增加更多模型、更多流量，或更多受监管部署模式。
        - id: replatform-choice
          label: 换平台或留存
          detail: 支出上升后，客户会权衡 Baseten 与更便宜的竞争者或更高自控度的自建方案。
      edges:
        - from: evaluate
          to: pilot-prod
          label: 基准达到产品门槛
        - from: pilot-prod
          to: optimize
          label: 流量增长，生产痛点浮现
        - from: optimize
          to: enterprise-controls
