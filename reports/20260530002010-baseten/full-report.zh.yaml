      - number: '8.2'
        title: 只有收入质量真实且高端定价顶住竞争，价格才站得住
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑从速度和时点开始。Baseten 的融资路径从 2025 年 2 月 $75 million Series C，走到 2025 年 9 月以 $2.15 billion 估值完成 $150 million
              Series D，再到 2026 年 1 月完成 $5 billion 估值的 Series E。 Sacra 估计的 $600 million 年化收入，以及 Baseten 自己声称的 100x
              推理量增长，方向上都符合一个判断：推理从原型基础设施转向生产基础设施时， 公司正好踩中陡峭采用曲线。公开市场和私募可比公司也给这段增长提供了上下文：Modal 2026 年 5 月轮次约按 15.5x
              年化收入定价，Fireworks 已完成估值约为 12.7x，MongoDB 式公开基础设施待遇仍在约 10x。


              反向逻辑同样重要。Baseten 定价页、HostFleet 矩阵和 Runpod 对比都指向一个高端定价服务层，而不是商品化端点供应商。如果溢价买来正常运行时间、
              支持、合规和混合灵活性，这可以是优势；如果业务比高端上市软件公司更重支持、利润率更低，也会压住倍数。超大规模云厂商让下行情景更尖锐： AWS、Google 和 Azure
              可以把模型访问、算力、治理和云赠金捆进更大的云关系里。换句话说，Baseten 可能相对原始 AI 云值得溢价，但还没有拿出足够披露质量，让投资人有信心支付 Cloudflare 或 Datadog 式溢价。
