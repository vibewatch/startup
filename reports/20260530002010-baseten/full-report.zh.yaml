      - number: '2.5'
        title: 增长驱动、采用约束与市场纪律
        blocks:
          - type: paragraph
            body: >-
              无论看供应商材料还是分析师材料，最强增长驱动都很清楚。开源模型进步足够快，产品团队越来越想要为这些模型优化的基础设施，而不是依赖封闭模型；实时和复合 AI
              工作负载让延迟和吞吐在经济上可见；企业买方正在从试点走向生产，尤其是在受监管数据、正常运行时间或模型性能调优重要的场景。Baseten 自己的案例研究用延迟、每秒
              token、图片吞吐和维护负担下降等具体主张支持这个判断。但这不是一个容易的市场。硬件供应约束、关税和高加速器价格仍是结构性逆风。人才短缺和遗留系统集成复杂度会拖慢企业买方推出。公开竞争定价也显示，原始 GPU
              小时经济性非常残酷：更便宜的专业云和更宽的超大规模云套件都会挤压独立推理供应商。因此，对 Baseten 的正确市场视角不是全部 AI
              基础设施，而是那部分值得为高端支持、合规和性能付费、足以抵消更高标价的推理工作负载。公开数据支持这个楔子，但还不支持精确的经济护城河或清晰可测的可服务市场。
