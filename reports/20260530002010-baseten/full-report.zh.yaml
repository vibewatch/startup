      - number: '1.2'
        title: 融资、阶段与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Baseten 的资本历史现在是最清晰的外部信号，说明公司已经进入后期 AI 基础设施。抓取语料支持一条路径：从资金不多的早期公司走到 Series E。Series A 博文称 Baseten 种子轮和
              Series A 合计融资略高于 $20 million；Series B 公告新增 $40 million；Series C 新增 $75 million；Series D 新增 $150
              million；Series E 又以 $5 billion 估值新增 $300 million。独立市场数据来源佐证了这些轮次的时间，并把 2025 年 9 月 Series D 估值放在约 $2.15
              billion，显示公司在 2026 年 1 月轮前重估速度很快。投资者名单也在加深，而不是频繁换血。Greylock 和 South Park Commons 很早出现，IVP 和 Spark
              在成长期变得可见，后续轮次又加入 BOND、CapitalG、Conviction、01A、BoxGroup 和 NVIDIA。这个模式重要，因为它同时意味着内部投资者反复支持，以及 AI
              专业和平台型投资者范围扩大。但公开披露距离完整 cap table 仍差很远：抓取语料没有披露当前持股比例、投资者控制权、清算优先权，或足够可靠的董事会观察员图谱。
