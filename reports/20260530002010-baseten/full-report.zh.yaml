  - id: FE001
    title: Baseten 产品架构图
    type: stack
    layout: wide
    summary: 从访问入口到封装 / 编排、运行时和跨云基础设施，分层展示 Baseten 的公开架构。
    data:
      layers:
        - id: layer-access
          label: 访问与 API 入口层
          detail: 面向外部调用方的共享 Model APIs、按环境划分的模型端点，以及白标 Frontier Gateway 入口。
          sublayers:
            - id: access-model-apis
              label: Model APIs
              detail: Shared OpenAI- and Anthropic-compatible endpoints for supported models.
            - id: access-env-endpoints
              label: Environment endpoints
              detail: Stable per-model subdomains with development, production, or named environments.
            - id: access-frontier
              label: Frontier Gateway
              detail: Branded customer-facing API with keys, metering, and usage limits.
        - id: layer-workflow
          label: 封装、工作流与控制层
          detail: 开发者和运维界面定义模型如何封装、串联、训练和上线晋级。
          sublayers:
            - id: wf-truss
              label: Truss
              detail: Packaging CLI for config-driven or Python-model deployments with live reload.
            - id: wf-chains
              label: Chains
              detail: Python chainlets for multi-step inference workflows with per-step hardware.
            - id: wf-training
              label: Training Jobs / Loops
              detail: Managed training surfaces that can feed checkpoints back into inference.
            - id: wf-mgmt
              label: Model management
              detail: Observability, release management, autoscaling controls, and promotion settings.
        - id: layer-runtime
          label: 运行时与路由层
          detail: 服务引擎、请求路由和自动扩缩容让推理端点能在生产中使用。
          sublayers:
            - id: rt-engine
              label: Engine-based runtimes
              detail: >-
                TensorRT-LLM and other runtime choices plus quantization, KV cache, structured output, and speculative
                decoding.
            - id: rt-routing
              label: Request routing
              detail: Environment-aware URL routing, sync/async request handling, and queue priority for real-time traffic.
            - id: rt-autoscale
              label: Autoscaling
              detail: Replica-based scale-up/scale-down with scale-to-zero trade-offs.
        - id: layer-infra
          label: 跨云基础设施层
          detail: Baseten 自有基础设施系统，承托推理和训练。
          sublayers:
            - id: infra-mcm
              label: MCM
              detail: Cross-cloud capacity control plane that provisions and reroutes GPU workloads.
            - id: infra-bdn
              label: BDN
              detail: Multi-tier weight mirroring and caching for faster cold starts.
            - id: infra-tenancy
              label: Tenancy & regional controls
              detail: Single-tenant, self-hosted, hybrid, and regional-environment options.
    claimRefs:
