        title: 按客户工作流理解的产品界面
        blocks:
          - type: paragraph
            body: >-
              Baseten 现在覆盖现代 AI 部署工作流的大部分，而不是单一托管 SKU。最轻的一端，Model APIs 让团队替换 OpenAI 或 Anthropic base URL 后立即调用共享前沿 /
              开放模型，适合原型或不需要专用 GPU 的产品。更重的一端，Truss 把自定义或开源模型打包成可复现部署制品；Dedicated Inference
              则加入租户隔离容量、自定义扩缩和对更严格延迟或合规需求的支持。Chains 位于单模型推理之上，用于多步骤 RAG、转写或多模态流程；Frontier Gateway 加入品牌化 URL 以及面向模型实验室
              API 变现的计费 / 速率限制控制；Baseten Training/Loops 则试图打通从 checkpoint 创建到生产服务的闭环。按客户工作流看，公司卖的是从即时 API
              评估到自定义生产推理的分级路径，而不只是原始 GPU 租赁。
