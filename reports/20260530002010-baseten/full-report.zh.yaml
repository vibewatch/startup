  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：按已成交价格跟踪公司，但不要追逐动量定价
        blocks:
          - type: paragraph
            body: >-
              Baseten 看起来是一家高质量公司，所处位置也是 AI 技术栈里最好的部分之一，但投资判断仍受制于公开材料能证明什么、不能证明什么。 最干净的估值锚，是 2026 年 1 月已完成的 Series E：融资
              $300 million，估值 $5 billion。这个价格真实、近期， 且由 Baseten 自己公告、Business Wire、Tech Funding News 和 Tracxn
              互相印证。更难的问题是，公开证据是否足以把这个价格视为有吸引力、 合理，或已经偏高。


              答案是有条件的，不是绝对的。Sacra 对 $600 million 年化收入的估计，使已完成轮次看起来大约是 8.3x 隐含收入，具备一定支撑，尤其是参照 MongoDB 式低双位数公开倍数，以及 Modal
              或 Fireworks 低到中双位数的私募倍数。但同一组公开记录也显示论证很脆弱：Baseten 披露的定价偏高，第三方定价矩阵称它纸面上昂贵， 传闻中的 $11 billion
              后续融资会在没有相应一手财务披露的情况下，直接跳进高端软件定价区间。这不是一个干净买入的设置。


              因此，正确姿态是观察：中等信心、高风险评级、估值偏高。公司值得持续贴近，因为市场真实、产品有差异化；但在承销更高入场价之前， 投资人应坚持用尽调把私人市场热情转化为证据。
