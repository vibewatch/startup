      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              公开买方证据指向三个尤其相关的细分。第一类是 Gamma 这类 AI 原生产品团队，产品或工程负责人关心上线速度、低延迟，以及不组建专门 ML 基础设施团队也能低成本服务开源模型。第二类是 Writer 这类企业
              AI 平台团队和模型构建者，用户是 ML 工程师或数据科学家；一旦工作负载变成专用、多 GPU 或合规敏感，部署决策就会扩大到平台、安全和采购。第三类是 OpenEvidence
              这类医疗受监管垂直部署，可靠性、数据处理，以及无需签下大额 GPU 承诺也能扩容，都会成为明确筛选标准。Baseten 的包装以不同方式服务这些细分：基于用量的计划和模型 API
              降低实验门槛；Enterprise、自托管、SSO 或 SCIM、合规政策和计费 API
              则说明大型买方期待治理、归因和受控推出。因此，预算所有者一部分可观察、一部分需要推断：它可能从产品或工程预算起步，随着部署更具战略性而迁移到中央平台或 IT 预算。
