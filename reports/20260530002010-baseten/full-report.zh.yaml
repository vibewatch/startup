      - - 基准
        - 收入支撑落在约 $500M-$650M，增长仍强，Baseten 相对裸 AI 云资源保持适度溢价。
        - 按 8x-12x 区间为 $4.0B-$7.8B；已完成的 $5B Series E 落在这个区间内。
        - 判断仍取决于验证收入质量和毛利率，而不只是收入增长。
        - 按今天的公开证据，这是最站得住脚的情景。
      - - 乐观
        - 收入支撑达到 $700M-$900M，高端经济性守住，投资人继续为 Modal 级或更高的私营推理倍数买单。
