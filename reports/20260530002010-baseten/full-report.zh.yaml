      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Baseten 的资本位置纸面上强，实践中不透明。公开记录支持 2025 年 2 月 $75 million 的 Series C 融资、2025 年 9 月 $150 million 的 Series D
              融资，以及 2026 年 1 月以 $5 billion 估值完成的 $300 million Series E。Business Wire、Tracxn 和 CB Insights 都指向约 $585
              million 的累计融资，Business Wire 还明确把 2026 年 1 月轮描述为公司此前一年内第三次融资。这个节奏重要：Baseten
              显然不是靠慢速现金生成运营；随着推理需求扩大，它在激进融资以支撑增长。


              资金用途措辞强化了这个解读。Baseten 自己的 Series E 博文把新资金聚焦在速度、正常运行时间、开发者体验，以及扩展基础设施平台。Tech Funding News
              补充了预期招聘、客户支持扩张和更多集成。公开员工数代理也与这个投资故事一致：PitchBook 的 2025 年快照显示 73 名员工，而 Tracxn 到 2026 年 4 月列出 258
              名员工。即便这些数据集不完美，方向仍很清楚——Baseten 似乎在伴随产品和基础设施范围扩张，大幅放大运营支出。


              公开记录没有显示的是，当前资本基础相对于烧钱速度是否足够。没有披露现金余额、月度烧钱、现金跑道、债务安排或约束性条款包。Sacra 报道的 $200 million 至 $600 million
              年化收入估计显示了相当规模；据报道 $11 billion 至 $15 billion 的估值讨论也说明市场可能愿意为下一段融资。但这些都不能替代现金、毛利率和现金跑道披露。唯一硬结论是：Baseten
              获得资本的能力很强；它相对实际烧钱是否资本充足，仍然是私有信息。
