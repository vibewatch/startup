  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开定价
        blocks:
          - type: paragraph
            body: >-
              Baseten 的公开财务故事始于一个直接的收入设计：公司按生产推理和相邻基础设施用量收费，而不是按席位收费。定价页暴露了三个商业面——专用部署、Model APIs 和 Training——并把它们包进
              Basic 自助层，以及按报价销售的 Pro 和 Enterprise 包装。Model APIs 按每百万 token 计价，专用部署按实际使用的计算资源计费且精确到分钟，Training 则既以托管
              Training Jobs 销售，也以较新的 Loops 工作流销售，后者把 checkpoint 直接送入推理。这是一个连贯的生产基础设施变现模型；计费用量 API
              也通过按日拆分和已用额度，把支出拆到专用推理、训练和 Model APIs。


              细节在于，标价只是这个模型的外壳。公开材料显示，真正的商业楔子在高端支持、优先计算、自托管部署、使用既有云承诺、自定义 SLA，以及高级安全或治理。这些功能意味着 Baseten
              试图同时变现用量和更高接触的企业销售动作。Terms 还把客户 Order
              设为有约束力的商业工具，这意味着当支持、折扣和最低承诺进入交易后，实际价格可能与公开定价页显著偏离。这一点对收入确认和收益率分析重要，因为公开标价可观察，但标价到净价的经济性不可见。


              结果是，Baseten 有可信的收入架构，对计费单位有不错的公开可见度，但对已实现收入质量的可见度很弱。公开证据能显示 Baseten
              打算如何收费；它不能显示收入组合、服务附着率，或客户在企业谈判后实际支付多少。
