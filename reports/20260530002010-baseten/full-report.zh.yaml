  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Baseten 通常从技术买家评估模型性能切入；当工作负载变成业务关键，运营、安全和采购相关方再加入。
    data:
      items:
        - stage: 模型评估
          actors:
            - ML 负责人
            - 应用工程师
            - 创始人 / 产品负责人
          touchpoints:
            - Model APIs
            - 基准测试
            - 价格页
          emotion: 团队想快速验证延迟、成本和可部署性。
          label: 评估
        - stage: 首次生产部署
          actors:
            - 平台工程师
            - MLE
