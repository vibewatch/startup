        title: 信任、数据处理与可靠性控制
        blocks:
          - type: paragraph
            body: >-
              Baseten 的信任姿态按创业公司标准很强，也尤其重要，因为公司想承载敏感推理工作负载。公开安全文档称，Baseten 维持 SOC 2 Type II 和 HIPAA
              合规，默认不存储模型输入、输出或权重，从不在用户之间共享 GPU，把客户隔离到专用 Kubernetes namespace，并围绕工作负载隔离使用 Calico、Falco 和 Gatekeeper
              等控制。企业版和定价页面也宣传自托管、单租户、混合和区域限制选项；regional-environments 文档解释说，真正的数据驻留需要独立区域端点，而不是默认环境 CNAME。细节在可靠性：Baseten
              营销经常使用「四个 9」话术，但唯一公开合同承诺是 Dedicated Inference SLA 的 99.9% 月度可用性。公开状态页还记录了 2026 年 5 月多起事故，因此尽调应把信任 /
              合规视为优势，把公开可靠性保证视为更混合。
