      - number: '5.2'
        title: 部署架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Baseten 公开语料中最清晰的技术差异点，是它比许多 AI 基础设施创业公司更具体地解释部署路径。Truss 抽象打包、依赖和 GPU 配置；Baseten 的构建步骤随后验证并上传包，在选择引擎路径时用
              TensorRT-LLM 编译受支持的 LLM，并把生成的容器部署到专用模型子域后面。MCM 控制平面位于训练和推理之下，抽象云供应商差异，并在需要时跨区域或供应商重新路由容量。请求路由会从 URL
              路径解析环境名，环境在部署晋升时保持稳定端点，异步请求进入队列以保护实时流量免受后台工作的影响。BDN
              通过在多个层级镜像并缓存大型模型权重来处理冷启动瓶颈，让新副本更少依赖外部存储。结果是一个推理优先架构，具备明确的构建、路由、自动扩缩和权重交付原语。
