      - number: '2.4'
        title: 部署价值链与采用路径
        blocks:
          - type: paragraph
            body: >-
              Baseten
              的价值链起点，是一个已经存在、需要变成可靠生产服务的开源模型、自定义模型或专有模型。之后，日常用户通常是模型、平台或应用工程师，负责打包工作负载并评估延迟、吞吐和成本。下一道门槛主要是组织性的，而不是技术性的：当工作负载需要专用容量、数据驻留控制或身份集成时，安全、合规和采购检查会加强。Baseten
              随后位于编排层，决定工作负载通过 Model APIs、Dedicated Inference、Chains、Frontier Gateway，还是自托管或混合部署来运行。该层下面是真正的云和 GPU
              底座；它在经济上仍然关键，因为容量、价格和区域可用性会直接决定毛利率和可靠性。Baseten 的客户故事显示，公司试图把价值捕获从原始 GPU
              租赁上移到性能工程、部署工具和运营支持，因为客户解释为何没有继续自建时，引用的正是这些层。
