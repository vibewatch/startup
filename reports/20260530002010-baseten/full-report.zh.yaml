  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层 / 组件
      - 公开机制
      - 关键依赖
      - 风险 / 局限
    rows:
      - - 封装层（Truss）
        - 从 config.yaml 或 Python 模型代码打包模型定义、依赖、密钥、缓存和 GPU 配置
        - Baseten CLI、GitHub / PyPI 分发、用户源代码仓库
        - 抽象层很强，但部署成功仍取决于特定模型调优和用户提供的权重
      - - 构建 / 编译路径
        - Engine-Builder-LLM 下载权重，用 TensorRT-LLM 编译，应用量化 / 张量并行，并产出服务容器
        - Hugging Face 或云存储权重源、兼容 CUDA 的 GPU 目标
        - 编译可能需要数分钟，公开文档没有对每个模型 / 硬件组合做基准
      - - 运行时优化层
        - 推理运行时暴露 TensorRT、SGLang、vLLM、TGI、TEI、投机解码、结构化输出、KV-cache 优化和拓扑感知并行
        - 模型架构支持、Baseten 推理运行时、GPU 内存 / 布局假设
        - 优化选项很多，但并非都按工作负载公开验证
      - - MCM 控制平面
        - 统一跨云 / 区域 GPU，供给资源、监控健康状态，并在容量紧张或故障时重路由
        - 底层云 GPU 供应、网络、Baseten 控制平面
        - 跨云抽象降低锁定效应，但引入对 Baseten 自有编排层的依赖
      - - 权重交付 / 冷启动路径
        - BDN 将权重镜像到 Baseten 存储，并在镜像源、集群和节点层缓存
        - 首次镜像的上游权重仓库、Baseten blob 存储、集群内缓存
        - 首次部署仍依赖上游权重可用性；“快 2-3x”的基准方法未公开
      - - 请求路由 / 环境
        - 每个模型获得一个子域名；URL 路径解析环境；异步请求排队；提升操作保持端点名称稳定
        - Baseten API 网关、环境配置、自动扩缩容组件、队列服务
        - 缩容到零带来冷启动权衡，区域保证需要特殊端点
      - - 工作流编排 / 训练
        - Chains 协调多步骤工作流；Training Jobs 和 Loops 通过 MCM 供给 GPU，并可将检查点部署到推理
        - Python SDK / CLI、MCM、存储 / 检查点同步
        - Loops 仍处早期访问，训练产品成熟度落后于核心推理产品面
      - - Enterprise 控制 / 租户隔离
        - 单租户、自托管、混合和区域环境，加上 SSO/SCIM 与合规政策边界
        - 客户 IdP、Baseten 支持配置；若自托管则用客户云
        - 部分控制需要销售 / 支持介入，不能完全自助开通
    notes: 本表混合了文档直接事实与对运营依赖的综合判断。「风险 / 限制」指公开限制说明或尽调事项， 不代表已观察到故障。
