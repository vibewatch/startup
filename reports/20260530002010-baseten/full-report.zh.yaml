        - id: n4
          label: 构建 + 编译
          detail: Baseten 校验包、上传构建，并可能用 TensorRT-LLM 编译受支持的 LLM。
        - id: n5
          label: 开发端点
          detail: 模型获得开发部署和稳定的模型子域名。
        - id: n6
          label: 上线晋级 + 自动扩缩容
