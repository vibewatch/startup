  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度风险 / 约束
      - 影响
      - 尽调路径
    rows:
      - - Basic → Pro → Enterprise 套餐梯度
        - 公开套餐梯度暗示上销售空间，但转化率未披露
        - 如果客户规模超过自助推理套餐，可支撑先落地再扩张
        - 按客户队列索取套餐结构，以及 Basic 升级到 Pro / Enterprise 的扩张率
      - - Enterprise 控制与自托管部署
        - 可能让销售偏向更少、更大的技术买家，并加重服务交付动作
        - 利好受监管和敏感工作负载，但可能提高头部客户集中度风险
        - 索取 ARR、工作负载量和部署模式维度的前 10 大客户
      - - 面向医疗的合规姿态
        - 如果医疗成为主导扩张向量，垂直集中度可能加深
        - 只要合规和可靠性经得住验证，受监管工作负载可能更有黏性
        - 索取医疗收入占比、客户数量和续约历史
      - - 旗舰案例集中度
        - 量化公开验证集中在六个故事，且大多是 AI 原生软件
        - 投资人不能凭狭窄参考集推断整体组合耐久性
        - 索取更广泛客户群的匿名队列统计
      - - 较高公开定价
        - 较高公开 GPU 价格和最低部署成本会增加切换压力
        - 定价可能拖慢成本敏感型工作负载扩张，或让迁移到其他平台更有吸引力
        - 索取价格敏感账户的赢 / 输和流失原因
      - - 开源模型可迁移性
        - 随着支出上升，客户越来越能切换模型，并把更多基础设施带回内部
        - Baseten 必须继续靠速度、支持和经济性取胜，而不是靠锁定
        - 索取客户存续期、自托管转化，以及优化后保留下来的工作负载数据
    notes: 最强扩张信号来自套餐和客户引述；最强风险信号来自公开验证集中度和竞争性价格压力。
