          touchpoints:
            - Truss / 部署工具
            - 专属部署
            - 可观测性
          emotion: 团队不用从零搭建基础设施就能上线时，信心会上升。
          label: 部署
        - stage: 可靠性与治理
          actors:
            - 安全
            - IT
            - 运维负责人
          touchpoints:
            - 单租户集群
            - HIPAA / SOC 2 信息
            - 手把手工程支持
          emotion: 控制、合规和正常运行时间变重要后，采购范围会变宽。
          label: 安全扩张
