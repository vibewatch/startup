      - number: '3.2'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              当买方想要托管推理平台，而不只是 GPU 租赁或一行演示 API 时，Baseten 的比较最有利。公开材料显示，它的堆栈组合了自定义模型打包、OpenAI 兼容的 Model APIs、训练、Chains
              编排、企业部署模式，以及围绕低延迟优化技术构建的运行时。Modal 是最鲜明的开发者体验对照：清晰的 无服务器定价、慷慨的月度额度和明确的 GPU 并发限制，让它对主要需要弹性 Python
              计算的团队很有吸引力。Replicate 对原型和模型发现更轻量，但其私有模型经济性包含专用硬件的启动设置和闲置时间。Runpod 是价格地板替代品，公布更便宜的原始小时和按秒 GPU
              费率，同时把更多服务生命周期留给客户。超大规模云厂商更难逐项比较，因为 Bedrock、Vertex 和 Azure ML 把模型访问包进更宽的云计费、治理和平台费用。净看，Baseten
