        - 收入质量可能取决于支持和优先容量有多大比例附着到使用量。
      - - Enterprise：基于报价，含自托管、定制 SLA、云承诺、数据驻留、高级 RBAC
        - 标价套餐，实际成交价隐藏
        - 没有公开最低承诺、续约条款或服务定价
        - 企业价值主张是运营控制，而不是透明 SKU 定价。
      - - Model APIs：按每 1M token 定价，输入、缓存输入和输出费率分列
        - 标价
        - 没有企业费率表、批处理曲线或结构数据
        - 可用于基准比较，但 token 标价不是实际收入。
      - - 专用计算：按实际使用计算量计费，精确到分钟
        - 标价计费规则
        - HostFleet 称，专用部署最低成本和计费运行时长仍然适用
        - 缩容到零有帮助，但最低费用会压缩突发型工作负载的节省空间。
      - - 费用和开票：月底计费，除非订单另有约定，30 天内到期
        - 合同规则，而非产品标价
        - 订单决定实际经济条件
        - 收入确认和回款节奏可能随协商后的企业订单而变。
    notes: 本表区分公开标价机制和私下实际经济条件；折扣、最低承诺和企业费率问题仍全部未解。
