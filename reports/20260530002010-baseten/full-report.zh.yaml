      - number: '7.3'
        title: 依赖和商业模式风险来自上游容量、供应商链复杂度和高端定价
        blocks:
          - type: paragraph
            body: >
              Baseten 应对基础设施风险的核心战略答案，是多云容量管理、跨云自动扩缩容、单租户选项，以及在客户云中运行的能力。这些都是有意义的缓释措施， 但没有消除对云合作伙伴、GPU
              可用性和长尾第三方服务的依赖。Nudge Security 公开资料列出 AWS、Vercel、 Statuspage、SendGrid、Stripe、Segment、Sentry、GitBook 等
              Baseten 可见供应链里的供应商。Baseten 自己的产品页面还承诺可访问最新一代 GPU、弹性容量和优先算力。也就是说，无论平台是否把这些包装成单一托管界面，上游容量和定价仍是基础性依赖。


              商业风险在于，相比公开同业，Baseten 看起来偏贵。HostFleet 2026 年 4 月矩阵显示，在多类 GPU 上，Baseten 价格高于 Runpod、Modal 和 Fal.ai；Runpod
              2026 年对比也给 Baseten 标上高端定价，并显示其冷启动区间慢于部分替代方案。Baseten
              仍可能靠企业控制、支持和性能调优证明溢价合理；但如果客户能在明显更便宜的基础设施上复制可接受的延迟和正常运行时间，利润率和赢单率风险会快速上升。 这也是为什么性价比和供应商集中度应与经典供应商风险问题放在一起。
