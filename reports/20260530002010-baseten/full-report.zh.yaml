      - number: '2.2'
        title: 多种测算口径，以及为什么不能合并成一个 TAM
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据方向上很强，但品类边界仍然混乱。Technavio 更窄的 AI 推理即服务品类在 2025 年已经达到 USD 85.25 billion，并预计到 2030 年每年增长
              22.1%。Fortune Business Insights 使用更宽的 AI 推理口径，认为该品类 2026 年达到 USD 117.80 billion；Mordor Intelligence 则把相邻企业
              AI 市场测算为 2026 年 USD 114.87 billion，并显示软件或平台层和云部署主导支出。这些数字不能相加，因为它们部分重叠且定义不同，但它们确实交叉指向同一个结论：Baseten
              追逐的不是小众预算项。估值时有用的纪律，是从宽泛 AI 平台支出不断下沉到 Baseten 实际竞争的、更窄的生产推理楔子。这个更窄的楔子以云优先、平台占比高、北美集中为特征，规模已经足够大，不需要假设
              Baseten 拿到夸张市场份额才能支撑有意义的机会。公开数据没有提供的是干净的 Baseten 专属 SAM 或 SOM。
