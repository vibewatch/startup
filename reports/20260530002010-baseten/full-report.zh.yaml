      - number: '6.3'
        title: 耐久性、满意度与扩张证据
        blocks:
          - type: paragraph
            body: >-
              耐久性证据方向上积极，但还不完整。积极的一面是，第三方客户引用聚合器给出了异常强的公开口碑代理指标：FeaturedCustomers 基于 654 个评分给出 4.8/5 的引用分，PeerSpot
              强调协作和成本效率，单个客户引语也反复把 Baseten 描述为执行、正常运行时间或自助部署上的赢家。产品包装也显示出可行的落地后扩张路径：从 Basic 按用量付费，升级到 Pro 专用算力，再到
              Enterprise 自托管或区域受限部署。医疗和企业页面把这条路径落到具体场景上： HIPAA 敏感工作流、单租户集群、故障切换和工程师深度支持。关键限制是，已审阅公开来源都没有给出 NRR、GRR、
              续约队列或合同期限，因此扩张只能从包装和客户引语推断，而不是从可衡量账户经济性验证。
