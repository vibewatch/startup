      - number: '6.4'
        title: 集中度、切换和竞争压力
        blocks:
          - type: paragraph
            body: >-
              公开记录里的主要客户风险不是明显流失，而是可见度集中。Baseten 的具名账户不止六个旗舰案例，但可量化证明仍落在一小群 AI
              原生软件公司里。这带来两个尽调问题。第一，头部客户收入占比、合同期限和续约率没有公开披露，投资人无法判断账本是否由少数超大工作负载主导。 第二，竞争压力真实存在。HostFleet 2026 年 4
              月矩阵显示，在多类常用 GPU 上 Baseten 是列出的最贵选项；Runpod 2026 年对比把 Baseten 排在第五，并称部分竞争者的标称冷启动明显更快。WorkOS
              也描述了一个临界点：客户每月支出达到 $10k-$50k 后，会开始考虑控制力更强、成本更低的开源方案。Baseten
              用开放运行时和客户模型不锁定来对冲这一风险，但这也意味着可迁移容忍度会保持很高。换句话说，Baseten 可能比自研专有栈更容易采用，但它必须持续靠运营表现和支持重新赢得客户，而不能靠锁定效应。
