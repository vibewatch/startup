      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入桥接
        - 截至当前季度的月度和季度收入、ARR 以及队列扩张。
        - 这是判断 $5B 是否合理、还是已经偏高的最大变量。
        - CFO / 财务资料包和董事会材料。
      - - 毛利率与利用率
        - 按产品线拆分的毛利率、GPU 利用率、预留容量组合和支持负担。
        - 只有利润率质量真实，估值倍数才配得上向高端软件靠拢。
        - 基础设施 + 财务深挖，并拆到产品线。
      - - 股权结构表与条款
        - 完全稀释股数、清算优先权、老股交易，以及任何结构化条款。
        - 表面投后估值可能夸大普通股上行空间。
        - 法务 + 财务审阅最新融资文件。
      - - 客户集中度与留存
        - 头部客户敞口、NRR、客户标识留存，以及 AI 原生和企业账户的垂直行业组合。
        - 如果支出集中或不可重复，溢价倍数很脆弱。
        - 销售运营和客户成功队列复盘。
      - - 上调估值融资证据
        - 任何高于 $5B 的估值，都需要已签署投资意向书或已关闭融资证明。
