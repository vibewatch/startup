      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Baseten 的 GTM 最适合理解为先用用量落地，再靠可靠性、支持和部署控制扩张。Basic 计划和公开 Model APIs 创造低摩擦开发者入口，但变现叙事很快转向 Pro 和 Enterprise
              功能，例如专用计算、更高速率限制、高接触工程、自托管，以及云承诺可移植性。这个包装说明 Baseten
              不是只想赢一场商品化自助竞赛；它想成为那些足够在意延迟、正常运行时间和控制、愿意为运营帮助付费的团队的生产推理层。


              Baseten 是私营公司，CAC、回本周期、企业销售周期长度和净留存率（NRR）都不可得。最好的公开替代指标是客户案例。Writer 认为 Baseten 降低了 70B 级模型的每百万 token
              成本，并提高吞吐。OpenEvidence 强调无需多年期预留也能灵活获取计算资源，同时部署和维护时间大幅改善。Speechify 报告称，它得以退役大规模自管 GPU
              集群，同时降低每百万字符成本。Superhuman 和 Patreon 把价值主张描述为节省稀缺工程时间，同时显著改善延迟或降低 GPU 成本。这些不是经审计财务数据，但方向上符合一种 GTM
              动作：销售的是投产时间和更低总体运营成本，而不只是标价算力。


              因此，证据支持一个合理的扩张引擎，但只能以代理形式支持。买方逻辑可见；销售效率数学不可见。没有内部转化、留存和销售支出数据，就无法有把握地承销 Baseten 的 GTM 效率。
