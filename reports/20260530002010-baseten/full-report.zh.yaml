        - id: incidents
          label: 可见事故
          description: 2026 年 5 月状态页活动显示了面向客户的运营事件。
        - id: gpu-capacity
          label: GPU / 云容量
          description: 最新一代 GPU 容量的可用性和价格决定性能与成本。
        - id: premium-pricing
          label: 溢价定价
          description: 公开同业比较显示，Baseten 在多款 GPU 上处于高价端。
        - id: enterprise-sales
          label: 企业销售周期
          description: 安全审查和法律谈判决定受监管账户的成交速度。
        - id: customer-trust
          label: 客户信任
          description: 停机、合同清晰度和安全姿态都会影响信任。
        - id: gross-margin
          label: 毛利率
          description: 如果定价权变弱，溢价支持和昂贵容量会挤压毛利率。
        - id: valuation
          label: 估值支撑
          description: $5B 估值需要持久增长、可靠性和经济杠杆支撑。
        - id: execution
          label: 执行拉伸
          description: 产品范围广、支持负载重，会放大运营错误。
