  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Baseten 的风险面取决于云和 GPU 伙伴、第三方 SaaS 供应商、企业控制和客户特定合同。
    data:
      nodes:
        - id: core
          label: Baseten 核心平台
          description: 推理、训练、网关和模型管理控制平面。
        - id: multicloud
          label: 多云 GPU 池
          description: 支撑自动扩缩容和最新 GPU 承诺的容量管理层。
        - id: suppliers
          label: 云 / GPU 供应商
          description: 底层供应商仍决定价格和容量现实。
        - id: saas
          label: 可见 SaaS 供应商
          description: AWS、Vercel、Stripe、SendGrid、Segment、Sentry、Statuspage 等。
        - id: idp
          label: 企业身份栈
          description: SSO/SCIM 和角色映射是大客户采购的关键控制。
        - id: healthcare
          label: 医疗 / 受监管买家
          description: 需要 BAA 清晰度、数据驻留控制和合规证据的客户。
        - id: hhs
          label: HIPAA / HHS 规则
          description: PHI 处理需要有记录的保护措施和商业伙伴保证。
        - id: eu
          label: EU AI Act / GDPR
          description: 实施指南和行业规则会增加销售和文档负担。
        - id: hybrid
          label: 自托管 / 混合选项
          description: 缓解锁定效应和数据驻留压力的路径。
        - id: support
          label: 前置部署支持
          description: 用于达成客户延迟、可靠性和合规目标的人力支持层。
      edges:
        - from: core
