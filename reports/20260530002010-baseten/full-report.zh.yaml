      - number: '4.3'
        title: 成本结构与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Baseten 的公开材料指向一种轻资产但不一定低价的成本结构。Sacra 称，公司聚合 15+ 云供应商的容量，而不是直接拥有 GPU 基础设施；相较直接购买并融资 GPU
              集群的供应商，这应当降低固定资产强度。官方材料从另一个角度强化同一模型：Baseten
              持续谈多云容量管理、跨云自动扩缩、缩容到零，以及必要时在客户云中运行。原则上，这应让业务比专用自有集群运营商更灵活地调整供给，并让成本更紧密匹配工作负载形态。


              但轻资产不等于便宜。HostFleet 的 2026 年 4 月无服务器 GPU 矩阵显示，在列出的每一个共享 SKU 上，Baseten 定价都高于 Runpod；在共享 L4 和 H100 行上也高于
              Modal；在重叠的 A100 行中，只有 Replicate 的 A100 自定义部署价格更高。这是公开记录中最清晰的反向信号：Baseten
              在原始计算之上销售高端托管层。公司事实上的反驳，是它自己的性能叙事。Dedicated Inference 声称优化运行时能带来 6x 更好 GPU 利用率和 5-10x 更低成本；Model APIs
              声称相较封闭替代品支出降低 5-10x；客户研究报告每单位成本更低、工程师更少，或两者兼有。这些主张符合一个论点：Baseten 通过利用率和支持附着率扩张毛利率，但公开数据仍未证明毛利率。


              因此，单位经济仍停留在代理区间。我们能看到计费单位。我们能看到一些客户说总成本下降。我们能看到标价相对原始 GPU 云有溢价。我们看不到的是云成本转嫁、支持人力、议价折扣和留存之间的实际平衡。
