      - number: '1.3'
        title: 产品范围、规模证据与里程碑
        blocks:
          - type: paragraph
            body: >-
              Baseten 的产品和规模故事已经足以解释它为何能在约一年内三次融资，但仍要带着保留读。官方材料如今把公司放进更宽的推理平台叙事：云端和自托管部署选项、企业控制、模型
              API，以及按量计费的计算定价。最强外部证据来自客户和合作伙伴。NVIDIA 案例研究称，Baseten 将冷启动从最多 5 分钟降至 5–10 秒，并用 TensorRT-LLM
              让一位客户的推理性能翻倍。客户案例称，OpenEvidence 每周在 Baseten 上处理数十亿次请求，Gamma 每天为 70+ million 用户生成约 3 million 张图片，Speechify
              将每百万字符成本降低 44%，Patreon 将 GPU 成本降低 70%。这些数字支持一个判断：Baseten 正在医疗、生产力、创作者和 GTM
              软件中承载有意义的生产工作负载。不过第一章尽调应保留三面警示旗：不同数据供应商的员工数不一致，融资公告之外的治理细节仍薄，独立可达性监测缺少足够事故细节，无法完整评估可靠性历史。因此，正确结论不是 Baseten
              缺少规模，而是这家公司在运营上已经重要，但相对于自身估值仍异常私密。
