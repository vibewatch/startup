  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管风险集中在合规范围、客户合同和扩张中的 AI 规则
        blocks:
          - type: paragraph
            body: >
              Baseten 公开呈现的信任姿态表面上很强：公司称已通过 SOC 2 Type II 认证、符合 HIPAA、对齐
              GDPR，并能为敏感工作负载运行区域受限或自托管部署。风险在于，一旦完整阅读法律栈，这套营销表述会明显收窄。Baseten
              的安全文档称默认不存储模型输入或输出，并可执行合规策略；医疗和企业页面则向关键任务工作负载营销符合 HIPAA 的基础设施。但 Baseten 公开条款中的 DPA 写明，除非另有书面约定，客户不得提交 PHI
              和其他受限数据，并把法律基础、通知和多项违规通知责任留给客户。这不证明产品有缺陷；它说明，仅靠公开网站不足以承销受监管使用。


              监管压力也正从隐私扩展到 AI 治理和采购。欧盟委员会 AI 政策页面强调 AI Act 落地、行业指引、实践准则，以及帮助企业合规的服务台。Baseten
              这类向医疗和其他受监管企业工作负载销售的推理厂商，即使不是最终应用层决策者，也更可能遇到围绕数据驻留、文档、模型治理和责任共担边界的更长尽调周期。因此，最重要的法律风险不是已知执法行动，而是合规范围不清。
