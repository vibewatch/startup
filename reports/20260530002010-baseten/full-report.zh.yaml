  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              Baseten 最适合被理解为生产推理平台，而不是通用云或模型实验室。纳入支出是团队已经有模型或模型端点之后，为打包、部署、运行、监控、计量和保护 AI 工作负载所需的层：模型 API、专用部署、复合 AI
              编排、可观测性、计费，以及把延迟和正常运行时间守在生产目标内所需的支持。这个市场边界窄于完整企业 AI 堆栈，因为 Baseten
              并不把数据湖、BI、通用应用开发或宽泛的智能体生产力套件作为价值主张的中心。它也窄于前沿模型研发，因为 Baseten 帮助团队把模型运营起来，而不是发明模型。最接近的替代方案是超大规模云厂商 AI 平台、内部
              GPU 基础设施，以及 Modal、Replicate、Runpod 等专业 GPU 云。Baseten 的相邻机会位于核心部署层上下各一步：能直接进入推理的训练，以及模型实验室通过白标 API 变现。
