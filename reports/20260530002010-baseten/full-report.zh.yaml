      - number: '8.3'
        title: 可比公司和情景分析把 $5B 放进基准情景，但容错很小
        blocks:
          - type: paragraph
            body: >-
              可比公司组重要，是因为 Baseten 夹在两套估值制度之间。一边是 CoreWeave 这样的 AI 云和基础设施公司，资本密集度可见， 公开市场倍数更低；另一边是 Datadog、Cloudflare
              这样的高端基础设施软件公司，披露质量、利润率和平台广度允许更高交易倍数。Baseten 最好的公开收入估计，把已完成的 $5 billion 轮次放在两者之间，而不是明确归入某一边。因此，已完成轮次可以讨论；
              但传闻中的 $11 billion 跳升，还没有得到公开证据承销。


              情景分析把同一点讲得更具体。悲观情景假设只有 $300 million 到 $400 million 的可持续收入支撑，并给 7x 到 9x 倍数， 指向实质降轮风险。基准情景用 $500 million 到
              $650 million 收入和 8x 到 12x 倍数，支撑约 $4 billion 到 $7.8 billion，足以覆盖已完成的 Series E。乐观情景既需要更强收入延续，也需要倍数接近 Modal
              式或私募推理基础设施上沿。因此，当前投资争论不是 Baseten 是否有吸引力；而是投资人是否因承担一个可辩护 $5 billion 价格与一个愿景型 $11 billion 叙事之间的不确定性而得到补偿。
