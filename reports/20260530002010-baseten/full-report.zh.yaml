  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与任务场景覆盖
        blocks:
          - type: paragraph
            body: >-
              Baseten 位于一个拥挤的中间层，一边是低摩擦的无服务器推理同行，另一边是大型云既有厂商。最接近的直接替代品是 Modal、Replicate 和
              Runpod：它们都让开发者无需直接拥有基础设施也能把模型放到 GPU 上，但各自压缩堆栈的方式不同。Modal 优化 Python 原生无服务器计算，Replicate 优化社区模型和极低摩擦
              API，Runpod 则通过 Pods 和 Serverless 提供便宜的原始容量。再往上是 AWS Bedrock/SageMaker、Google Vertex AI 和 Azure
              ML，它们较少争夺独立开发者体验，更多靠采购杠杆、治理和既有云承诺竞争。再往下是现状替代方案：基于开放打包标准和租用 GPU 内部自建。Baseten
              进一步拓宽战场，因为它销售的不只是部署，还包括训练、多步骤编排，以及面向模型实验室的白标 API
              变现。这种宽度意味着公司并不处在双寡头赛道；独立数据集和公司材料都指向一个碎片化、多类别格局，买方会根据速度、控制、信任或成本偏好，在托管推理、原始算力、超大规模云工具或自管堆栈之间替换。
