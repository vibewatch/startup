  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要用户
      - 状态 / 成熟度
      - 核心功能
      - 差异化
      - 尽调缺口
    rows:
      - - Model APIs
        - 评估或上线前沿 / 开放模型的应用开发者
        - 正式可用（GA）/ 成熟共享服务
        - 在 Baseten 托管的共享基础设施上，立即获得兼容 OpenAI 和 Anthropic 的推理
        - 摩擦最低的入口；内置缓存、工具调用、结构化输出，并提供迁移到专用部署的路径
        - 设计上就是共享基础设施；公开文档未披露租户级争用控制或单模型基准方法
      - - Dedicated Inference
        - 在生产环境服务自定义、微调或自研模型的团队
        - 正式可用（GA）/ 核心企业产品面
        - 单租户或客户可控推理，支持定制硬件、扩缩容和部署选项
        - 结合托管性能调优、跨云自动扩缩容和企业控制界面
        - 唯一公开合同 SLA 是 99.9%；已发布 GPU-hour 定价高于自助式同业
      - - Truss
        - 打包并迭代自定义部署的 ML 工程师
        - 成熟开源 CLI，2026 年 5 月仍有活跃发布
        - 打包模型代码、权重、依赖和 GPU 配置；通过 uvx truss push/watch 部署
        - 一次编写的封装抽象，支持热重载和多种服务框架
        - 开源活跃度健康，但公开文档没有量化 Truss 在企业中的具体采用情况
      - - Chains
        - 构建 RAG、转录或多模型工作流的团队
        - 正式可用（GA）/ 生产工作流层
        - 编排 Python chainlet，并为每一步配置硬件、依赖和自动扩缩容
        - 让 Baseten 能销售复合 AI 工作流，不必强迫客户采用单体模型部署
        - 公开性能主张只是方向性；具体工作流延迟取决于设计和工作负载
      - - Frontier Gateway
        - 将自有托管模型商业化的 AI 实验室
        - 正式可用（GA）/ 专用变现产品面
        - 白标推理 API，带密钥管理、计费、计量、速率限制和品牌 URL 路由
        - 对想拥有自有 API 品牌和变现层的实验室，Baseten 变成幕后基础设施
        - 公开文档未说明客户数量、支持的计费边界情况或结算工作流
      - - Training Jobs / Loops
        - 部署前训练或后训练模型的研究和基础设施团队
        - Training Jobs = 正式可用（GA）；Loops = 早期访问
        - 托管 GPU 训练，并提供把检查点部署到推理端点的路径
        - 尝试在一个平台内闭合训练到推理的循环，而不是交给另一家厂商
        - Loops 仍处早期访问，因此相较推理栈成熟度不均衡
    notes: 状态标签反映 Baseten 截至 2026-05-30 的公开措辞。“成熟”指多次描述为正式可用（GA）、且有操作文档的产品面；并不意味着功能质量经过外部审计。
