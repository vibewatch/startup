      - number: '8.4'
        title: 投资逻辑应由条款、利润率证据和集中度把关，而不是只靠热情
        blocks:
          - type: paragraph
            body: >-
              最终判断取决于少数几个能迅速移动估值的尽调项。第一，投资人需要管理层级收入证据。如果公司确实接近 $600 million 年化收入运行率， 扩张强、集中度可接受，已完成的 $5 billion
              轮次就开始显得合理，下一次估值也从空想变成可讨论。如果真实数字明显更低， 同一套定价和可比公司分析就会从「可辩护溢价」翻成「过度拉伸的后期估值」。第二，投资人需要直接利润率数据。Fireworks 约 50%
              毛利率是有用同业提醒：推理业务不是纯软件。只有当利用率、支持负担和预留容量经济性带来比这个类比更好的利润率质量时， Baseten 的高端定价才配得上高端倍数。


              第三，投资人需要标题价格下面的条款。优先权悬置、二级交易和客户集中度，可能比投后估值标题更重要。因此，正确否决触发器应务实而非修辞： 如果 Baseten
              不能在可接受利润率下守住高端性价比，如果增长跌破基准情景区间，或如果任何新轮次只能靠激进条款完成，投资逻辑就应迅速下调。
              在这些问题关闭之前，公司值得积极跟踪和结构化尽调，而不是给出高确信、对价格不敏感的买入决定。
            claimRefs:
              - CV023
              - CV025
