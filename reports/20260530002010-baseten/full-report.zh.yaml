      - number: '7.4'
        title: 产品蔓延、快速扩张和估值压力推高执行与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              Baseten 已不再是一家边界很窄的模型托管创业公司。公开材料现在覆盖 Model APIs、Dedicated Inference、Frontier
              Gateway、模型管理、自定义服务器、chains、Training Jobs，以及名为 Loops 的早期访问 RL 产品。与此同时，公司在前一年多轮融资后， 又于 2026 年 1 月以 $5B 估值完成
              $300M Series E。资本降低了近期融资风险，但也抬高了执行门槛： 投资人和客户会期待公司把高端基础设施定位转化为可重复的企业增长，同时不牺牲可靠性或毛利率纪律。


              人员和市场进入姿态放大了执行负担。Tracxn 显示员工快速增长，而 Baseten 自己的网站反复强调工程师深度支持、前置部署专家、 定制 SLA
              和部署定制。这可以成为早期企业扩张的差异化，但也暗示一种服务较重的运营模式；如果产品复杂度、支持需求和客户特定安全要求并行扩张， 干净扩大的难度可能很高。因此，首要人员和执行问题不是 Baseten
              是否有人才，而是组织能否在如此快速拓宽范围时，维持产品质量、客户响应和经济纪律。 外部资本市场也强化了这一风险：Modal 称在年化收入超过约 $300 million 后，以 $4.65 billion
              估值融资 $355 million； 按 Sacra 估计，Fireworks AI 年化收入已约 $315 million；RunPod 说明资本少得多的竞争者仍能打价格战； CoreWeave 近 $100
              billion 积压订单则显示，资金充足的基础设施玩家都在追逐推理机会。
