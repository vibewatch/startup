      - number: '7.2'
        title: 运营和安全风险由合同范围与可见事故定义，不只看正常运行时间营销
        blocks:
          - type: paragraph
            body: >
              Baseten 对可靠性营销很积极。企业、医疗、专用推理、Frontier Gateway 和 Model API 页面都承诺四个 9 或 99.99% 正常运行时间、主动-主动冗余，或高可靠多云运营。已发布
              SLA 更窄：只有 Baseten 作为托管方时的 Dedicated Inference 适用，月可用性目标为 99.9%；服务抵扣上限为月费 40%，且客户必须在 24
              小时内提交申请。条款还进一步说明，服务未授权用于时间关键或任务关键功能，也不保证不中断或无错误。这在产品定位和默认合同保护之间留下了真实尽调缺口。


              Baseten 状态页也说明这不是理论风险。该服务报告了多起 2026 年 5 月事故，包括持续调查、已识别修复、监控更新，以及 90 天视图中的重大故障标记。第三方监控只能提供部分安慰，因为
              Servicealert 称详细事故数据不可用，依赖的是可达性快照，而不是完整根因报告。Baseten
              已经推出滚动部署和部署健康工具等有用缓释措施，但可靠性风险仍应放在本章前列，因为平台卖进的是生产工作流，客户对停机和延迟回退高度敏感。
