companyProfile:
  summary: >
    Baseten 是一家总部位于 San Francisco 的推理基础设施公司，2019 年由 Tuhin Srivastava、Amir Haghighat、Phil Howes 和 Pankaj Gupta
    创立。公司把自己定位为运行生产 AI 工作负载的软件层，可在自有云或客户环境中组合模型 API、专用推理、训练和企业级部署控制。公开客户证据覆盖 AI 原生产品和受监管工作负载，包括
    Cursor、Clay、OpenEvidence、Abridge、Gamma、Patreon、Speechify、Writer、Hebbia、Wispr Flow 等。Baseten 在 2026 年 1 月以 $5B 估值融资
    $300M，披露融资总额增至约 $585M，也强化了它作为后期私营基础设施公司的定位。
