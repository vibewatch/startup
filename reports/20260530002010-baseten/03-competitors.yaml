- id: section-3
  title: Distribution power, switching costs, and trust posture
  body: 'Baseten''s strongest non-performance argument is that customers can keep control while still avoiding the

    operational burden of a self-built inference platform. Multi-cloud routing, self-hosted deployment, and

    single-tenant options help win buyers who fear locking critical workloads into one hyperscaler or who need

    tighter data-residency boundaries. The tradeoff is structural: because Baseten also relies on portable,

    open packaging and because adjacent tools like Cog plus raw GPU clouds remain available, hard switching

    costs stay lower than in closed-model APIs or data platforms. On trust, Baseten''s public posture is ahead

    of the self-serve peer set: it pairs SOC 2 Type II and HIPAA claims with explicit statements about not

    storing inputs or outputs by default. Modal narrows part of that gap through enterprise-only SSO, audit

    logs, and HIPAA; Replicate stays strongest on ease of adoption; Runpod stays strongest on low-cost

    infrastructure freedom. The biggest distribution disadvantage remains hyperscaler channel power. AWS, GCP,

    and Azure can fold AI procurement into pre-existing billing, IAM, and cloud-commitment relationships,

    which means Baseten must keep proving that open-model performance, portability, and support justify a

    separate vendor decision.'
  claimRefs:
  - CP023
  - CP024
  - CP025
  - CP026
