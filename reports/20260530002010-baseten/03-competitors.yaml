chapter:
  number: 3
  title: Competitors
  summary: Baseten competes most directly with Modal, Replicate, and Runpod for open-model inference workloads, while Bedrock/SageMaker, Vertex AI, and Azure ML dominate procurement-led enterprise alternatives and internal build remains viable because packaging standards are portable. Baseten's durable edge is the combination of performance optimization, deployment control, and hands-on production support; its weakest point is cost-floor competition from raw GPU clouds and hyperscaler bundling.
sections:
- id: section-1
  title: Competitive landscape and job-to-be-done coverage
  body: 'Baseten sits in a crowded middle layer between low-friction serverless inference peers and large-cloud

    incumbents. The closest direct substitutes are Modal, Replicate, and Runpod: all give developers a way to

    get models onto GPUs without owning the infrastructure outright, but each compresses the stack in a

    different way. Modal optimizes for Python-native serverless compute, Replicate for community models and

    ultra-low-friction APIs, and Runpod for cheap raw capacity through Pods and Serverless. Above them sit AWS

    Bedrock/SageMaker, Google Vertex AI, and Azure ML, which compete less on indie-developer ergonomics and

    more on procurement leverage, governance, and existing cloud commitments. Below them sits the status-quo

    alternative: internal build on top of open packaging standards and rented GPUs. Baseten broadens the

    battlefield further because it sells not just deployment, but also training, multi-step orchestration, and

    white-labeled API monetization for model labs. That breadth means the company is not in a two-vendor race;

    independent datasets and company materials alike point to a fragmented, multi-class landscape where buyers

    can substitute across hosted inference, raw compute, hyperscaler tools, or self-managed stacks depending

    on whether they optimize for speed, control, trust, or cost.'
