- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Durable revenue support is only $300M-$400M, premium pricing erodes, and independent vendor economics look more like infrastructure than software.
    - $2.1B-$3.6B using a 7x-9x range; the current mark would be vulnerable to a reset.
    - Price pressure, lower margin quality, or slower enterprise expansion expose down-round risk.
    - This case rises if diligence shows support-heavy delivery, concentrated revenue, or weak unit economics.
  - - Base
    - Revenue support lands around $500M-$650M, growth remains strong, and Baseten keeps a moderate premium to raw AI cloud.
    - $4.0B-$7.8B using 8x-12x; the closed $5B Series E sits inside this band.
    - The call still depends on validating revenue quality and gross margin, not just topline growth.
    - This is the most defensible case on today’s public evidence.
  - - Bull
    - Revenue support reaches $700M-$900M, premium economics hold, and investors keep paying Modal-like or better private inference multiples.
    - $8.4B-$14.4B using 12x-16x; an $11B step-up becomes possible.
    - The upside depends on sustained hypergrowth and a premium-quality margin/disclosure profile that is not public yet.
    - This case requires more proof than the current public record supplies.
  notes: Ranges are scenario outputs, not point estimates, and are designed to show how quickly the underwriting shifts when revenue support or multiple choice changes.
