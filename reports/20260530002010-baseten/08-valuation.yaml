- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue bridge
    - Monthly and quarterly revenue, ARR, and cohort expansion through the current quarter.
    - This is the single biggest determinant of whether $5B is fair or already stretched.
    - CFO / finance package and board materials.
  - - Gross margin and utilization
    - Gross margin by product surface, GPU utilization, reserved-capacity mix, and support burden.
    - The multiple only deserves to converge toward premium software if margin quality is real.
    - Infra + finance deep dive with product-line detail.
  - - Cap table and terms
    - Fully diluted share count, liquidation preferences, secondaries, and any structured terms.
    - Headline post-money can overstate common-equity upside.
    - Legal + finance review of latest financing docs.
  - - Customer concentration and retention
    - Top-customer exposure, NRR, logo retention, and vertical mix across AI-native and enterprise accounts.
    - A premium multiple is fragile if spend is concentrated or non-repeatable.
    - Sales ops and customer-success cohort review.
  - - Step-up financing evidence
    - Signed term sheet or closed-round proof for any valuation above $5B.
    - A rumored mark should not replace a closed anchor in underwriting.
    - Board process review and direct financing confirmation.
  notes: The asks are ranked by how quickly they can change valuation support rather than by general company importance.
