  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-proof
    missingEvidence: Monthly or quarterly management reporting that reconciles the December 2025 run-rate, the March 2026 run-rate, and current ARR or revenue cadence.
    whyItMatters: The entire underwriting range changes if the $600 million annualized estimate is materially high or low.
    diligencePath: Request board-ready revenue bridge, cohort expansion data, and finance-signoff on current annualized revenue before underwriting any price above the closed round.
    relatedQuestionRefs:
    - QV023
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Fully diluted share count, liquidation preferences, participation rights, secondaries, and any structured terms attached to Series E or a new round.
    whyItMatters: Headline post-money valuation can overstate common-equity upside if preference overhang or secondary-heavy structures are material.
    diligencePath: Review the latest cap-table summary and financing documents, then recast returns on a fully diluted basis.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-utilization
    missingEvidence: Direct Baseten gross margin, GPU utilization, support-cost, and contribution-margin evidence by product line.
    whyItMatters: Premium multiples are only durable if Baseten behaves more like scaled software than GPU pass-through services.
    diligencePath: Ask finance and infra leaders for margin by deployment type, reserved-capacity mix, and margin-improvement roadmap.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer exposure, NRR, retention cohorts, and revenue mix across AI-native startups versus regulated enterprises.
    whyItMatters: A premium valuation is fragile if a small number of fast-growing AI-native accounts drive most of the spend.
    diligencePath: Review top-20 customer ARR, cohort expansion, logo churn, and vertical concentration before approving any aggressive multiple.
    relatedQuestionRefs:
    - QV029
  - type: stale
    severity: material
    topic: follow-on-round-terms
    missingEvidence: Primary source confirmation of any new 2026 financing above $5 billion, including price, size, and investor mix.
    whyItMatters: A rumored step-up should not be treated as a valuation anchor without signed documents or an official announcement.
    diligencePath: Require signed term sheet or closed-round announcement before using any post-Series-E mark in return math.
    relatedQuestionRefs:
    - QV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-universe
    missingEvidence: A broader set of private inference rounds and disclosed M&A outcomes beyond the selected sample in the comparable valuation table.
    whyItMatters: The current table is directionally useful but still a curated sample rather than the full comparable universe.
    diligencePath: Expand the comp set with additional closed private rounds and any AI-infrastructure exits once they are directly sourceable.
    relatedQuestionRefs:
    - QV008
    - QV010
    - QV015
    relatedTableRefs:
    - TV004
