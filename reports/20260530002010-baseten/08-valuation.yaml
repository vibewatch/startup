- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - Inference is becoming a production budget, not an experiment budget.
    - Technavio and Mordor both show large, fast-growing AI deployment markets, while Baseten’s financing pace shows capital chasing the theme.
    - Evidence of slower adoption, weaker enterprise conversion, or shrinking model-serving budgets would reduce the premium case.
  - - Baseten may deserve a premium because it sells performance, hybrid control, and support rather than bare GPU time.
    - Baseten markets custom SLAs, self-hosting, priority GPUs, cross-cloud scale, and forward-deployed engineers.
    - If customers can replicate acceptable latency and uptime on cheaper alternatives, the premium becomes a liability rather than a moat.
  - - The closed $5B round is plausible if the private revenue estimate is roughly right.
    - Sacra’s $600M run-rate estimate implies about 8.3x revenue, below many premium software comps.
    - Primary finance data that lands far below the estimate would break this support quickly.
  - - The $11B narrative is not yet underwritten by public facts.
    - The only public support is third-party reporting of talks, not a closed financing or disclosed fundamentals.
    - A signed term sheet or closed announcement with clean terms and corroborated financials would materially improve the case.
  notes: The table separates company quality from valuation quality; both have to work for a buy call.
