- id: comparables-and-scenarios
  title: Comparable work and scenarios put $5B inside the base case but leave little room for error
  body: 'The comparable set matters because Baseten sits between two valuation regimes. On one side are AI-cloud and infrastructure names like CoreWeave, where capital intensity is visible and public multiples are lower. On the other are premium infrastructure-software names like Datadog and Cloudflare, where disclosure quality, margins, and platform breadth allow much richer trading. Baseten’s best public revenue estimate places the closed $5 billion round between those regimes rather than squarely in either one. That is why the closed round is arguable while the rumored $11 billion step-up is not yet underwritten by public evidence.


    Scenario work makes the same point more concretely. A bear case that assumes only $300 million to $400 million of durable revenue support and a 7x to 9x multiple points to material down-round risk. A base case that uses $500 million to $650 million and 8x to 12x supports roughly $4 billion to $7.8 billion, which comfortably contains the closed Series E. A bull case requires both stronger revenue continuation and a multiple closer to Modal-like or upper private-market inference treatment. That means the current investment debate is not whether Baseten is interesting; it is whether an investor is being paid for the uncertainty between a defensible $5 billion mark and an aspirational $11 billion narrative.'
