company:
  name: Baseten
chapter:
  number: 8
  title: Valuation
  summary: 'Baseten merits a track recommendation with medium confidence: the closed $5B Series E can be defended only if the best public revenue estimate is directionally right, but the public record is still too thin to underwrite a fast step-up toward $11B. Premium pricing, likely service intensity, and hyperscaler bundling leave the valuation stance stretched rather than clearly attractive.'
sections:
- id: recommendation
  title: 'Recommendation: track the company at the closed price, but do not chase momentum pricing'
  body: 'Baseten looks like a high-quality company operating in one of the best parts of the AI stack, but the investment call is still constrained by what is and is not publicly provable. The cleanest valuation anchor is the closed January 2026 Series E: $300 million raised at a $5 billion valuation. That mark is real, recent, and corroborated across Baseten’s own announcement, Business Wire, Tech Funding News, and Tracxn. The harder question is whether public evidence supports treating that mark as attractive, fair, or already stretched.


    The answer is conditional rather than categorical. Sacra’s $600 million annualized-revenue estimate makes the closed round look plausibly supportable at about 8.3x implied revenue, especially against a comp set that includes MongoDB-like low-double-digit public multiples and Modal or Fireworks private multiples in the low-to-mid teens. But that same public record also shows how fragile the case is: Baseten’s disclosed pricing is premium, third-party pricing matrices say it is expensive on paper, and the mooted $11 billion follow-on would leap straight into premium-software territory without corresponding primary financial disclosure. That is not a setup for a clean buy call.


    The right posture is therefore track with medium confidence, high risk rating, and a stretched valuation stance. The company is worth staying close to because the market is real and the product is differentiated, but investors should insist on diligence that converts private enthusiasm into evidence before underwriting a richer entry price.'
