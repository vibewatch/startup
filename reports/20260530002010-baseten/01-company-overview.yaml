  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, observer list, and founder ownership map.
    whyItMatters: Later-stage financing and governance risk cannot be assessed cleanly from public sources if the control map is incomplete.
    diligencePath: Request a current board deck, cap table summary, and governance appendix directly from management or lead investors.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A company-confirmed current employee count and a definition of whether the number is global people, U.S. legal-entity staff, or platform employees only.
    whyItMatters: Headcount is a key chapter-one maturity metric and the available public vendor numbers conflict materially.
    diligencePath: Request the latest org snapshot or payroll-based headcount from management and reconcile it to any data-vendor profile used in later diligence.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: incident-history
    missingEvidence: A durable, sourceable export of historical incidents or uptime reports with severity, duration, and customer impact.
    whyItMatters: Independent reachability monitoring is not granular enough to judge real reliability history for a company selling mission-critical inference.
    diligencePath: Request Baseten historical status exports, SLA reports, or customer-facing incident summaries covering at least the prior 12 months.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO004
