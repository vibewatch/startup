- id: deployment-value-chain
  title: Deployment Value Chain and Adoption Path
  body: 'Baseten''s value chain begins with either an open-source model, a custom model, or a proprietary model that already exists and needs to be turned into a dependable production service. From there the daily user is usually a model, platform, or application engineer who packages the workload and evaluates latency, throughput, and cost. The next gate is organizational rather than technical: security, compliance, and procurement checks intensify when the workload needs dedicated capacity, data residency controls, or identity integration. Baseten then sits in the orchestration layer that decides whether the workload runs through Model APIs, Dedicated Inference, Chains, Frontier Gateway, or a self-hosted or hybrid deployment. Under that layer sits the actual cloud and GPU substrate, which remains economically critical because capacity, price, and regional availability directly determine margin and reliability. Baseten''s customer stories suggest that the company tries to move value capture
    upstream from raw GPU rental into performance engineering, deployment tooling, and operational support, because those are the layers customers cite when they explain why they did not keep building in-house.'
