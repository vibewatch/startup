  rows:
  - - Open-source frontier models improve price/performance
    - Driver
    - Now
    - Makes specialist inference platforms more attractive than closed-model APIs for cost-sensitive products
    - What percentage of Baseten revenue already comes from open-model workloads?
  - - Real-time and compound-AI latency sensitivity
    - Driver
    - Now
    - Raises willingness to pay for performance engineering, orchestration, and autoscaling
    - How much of usage is latency-critical versus offline batch?
  - - Cloud-first enterprise AI deployment
    - Driver
    - Now
    - Supports adoption of managed inference rather than self-built infra for many teams
    - How much of Baseten demand comes from cloud-first versus self-hosted accounts?
  - - Regulated-sector demand for compliance and data control
    - Driver
    - Now
    - Creates a wedge for HIPAA, region restrictions, and hybrid/self-hosted deployment
    - What share of enterprise pipeline requires regulated deployment boundaries?
  - - GPU supply constraints and tariff pressure
    - Constraint
    - Now
    - Raises cost of goods sold and can limit capacity availability
    - What reserved-capacity strategy or cloud diversification protects supply?
  - - Skills gaps and integration complexity
    - Constraint
    - Medium term
    - Slow enterprise rollouts and increase implementation burden
    - How much deployment work is productized versus services-heavy?
  - - Price competition from specialist GPU clouds
    - Constraint
    - Now
    - Commodity GPU-hour comparisons can make Baseten look expensive on paper
    - Where does Baseten consistently win despite higher list prices?
  - - Hyperscaler platform bundling
    - Constraint
    - Medium term
    - Broader native-cloud suites can absorb spend that might otherwise go to a specialist inference vendor
    - Which workloads truly require a specialist rather than a hyperscaler-native stack?
  - - Opaque unit economics and support attachment
    - Constraint
    - Diligence now
    - Public material does not show whether premium positioning translates into durable margin
    - Request product-level gross margin and enterprise discount data.
