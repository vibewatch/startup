- id: buyer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'The public buyer evidence points to three especially relevant segments. First are AI-native product teams such as Gamma, where product or engineering leaders care about launch speed, low latency, and lower-cost open-model serving without building a dedicated ML-infrastructure team. Second are enterprise AI platform teams and model builders such as Writer, where the user is the ML engineer or data scientist but the deployment decision widens to include platform, security, and procurement once workloads become dedicated, multi-GPU, or compliance-sensitive. Third are regulated vertical deployments such as OpenEvidence in healthcare, where reliability, data handling, and the ability to scale without signing large GPU commitments become explicit selection criteria. Baseten''s packaging supports these segments differently: usage-based plans and model APIs lower the barrier for experimentation, while Enterprise, self-hosting, SSO or SCIM, compliance policies, and billing APIs are signals
    that larger buyers expect governance, attribution, and controlled rollout. The budget owner is therefore partly observed and partly inferred: it likely starts in product or engineering budgets and migrates toward central platform or IT budgets as the deployment becomes more strategic.'
