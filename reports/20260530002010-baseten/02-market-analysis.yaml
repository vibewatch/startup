  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: A third-party market study that isolates performance-sensitive inference-platform spend, or a company disclosure that maps Baseten revenue to a defensible serviceable market.
    whyItMatters: Without a clean denominator, SAM and SOM estimates are judgment calls, which directly affects how much weight a TAM-based valuation argument deserves.
    diligencePath: Request management's internal segmentation of revenue by product and customer type, then map it against a narrower third-party market study or customer cohort list.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: Customer references or internal sales material that explicitly show who signs, funds, and renews Baseten deployments by segment.
    whyItMatters: Budget ownership determines sales-cycle length, expansion dynamics, and whether Baseten is competing for application spend or central platform budget.
    diligencePath: Ask for anonymized deal summaries, procurement checklists, or customer reference calls across startup, enterprise, and regulated-healthcare accounts.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Product-level revenue mix, support attachment, gross margin by deployment mode, and actual realized discounts versus public rate cards.
    whyItMatters: Public price sheets and case studies show value, but not whether Baseten captures enough gross margin to defend a premium specialist position against commodity GPU clouds and hyperscalers.
    diligencePath: Request cohort-level gross margin and support-cost data for Model APIs, Dedicated Inference, and enterprise deployments, plus a sample of negotiated pricing schedules.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM004
