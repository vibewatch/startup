- id: drivers-and-constraints
  title: Growth Drivers, Adoption Constraints, and Market Discipline
  body: 'The strongest growth drivers are clear in both vendor and analyst material. Open-source models are improving fast enough that product teams increasingly want infrastructure optimized for those models rather than closed-model dependence; real-time and compound-AI workloads make latency and throughput economically visible; and enterprise buyers are moving from pilots into production, especially where regulated data, uptime, or model-performance tuning matter. Baseten''s own case studies back that thesis with concrete claims on latency, tokens per second, image throughput, and reduced maintenance burden. But this is not an easy market. Hardware supply constraints, tariffs, and high accelerator prices remain structural headwinds. Talent shortages and legacy-system integration complexity slow rollout for enterprise buyers. Public competitive pricing also shows that raw GPU-hour economics are unforgiving: cheaper specialist clouds and broader hyperscaler suites both put pressure on a
    standalone inference vendor. That is why the right market view for Baseten is not all AI infrastructure; it is the subset of inference workloads where premium support, compliance, and performance matter enough to offset higher headline price points. Public data supports that wedge, but not yet a precise economic moat or a cleanly measurable serviceable market.'
