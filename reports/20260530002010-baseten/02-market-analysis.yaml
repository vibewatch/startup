company:
  name: Baseten
chapter:
  number: 2
  title: Market Analysis
  summary: 'Baseten operates in a large but scope-sensitive slice of AI infrastructure: public estimates put AI inference-as-a-service at USD 85.25 billion in 2025, broader AI inference at USD 117.80 billion in 2026, and adjacent enterprise AI platforms at USD 114.87 billion in 2026. The strongest public buyer evidence points to performance-sensitive AI product teams, regulated healthcare deployments, and model labs monetizing proprietary APIs, while the main constraints are GPU supply and pricing, compliance friction, and direct competition from cheaper specialist GPU clouds and broader hyperscaler platforms.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Baseten is best understood as a production inference platform, not a general-purpose cloud or a model lab. The included spend is the layer required to package, deploy, run, monitor, meter, and secure AI workloads after a team already has a model or a model endpoint in mind: model APIs, dedicated deployments, compound-AI orchestration, observability, billing, and the support needed to keep latency and uptime inside production targets. The market boundary is narrower than the full enterprise-AI stack because Baseten does not market data lakes, BI, generic application development, or broad agent productivity suites as the center of its value proposition. It is also narrower than frontier-model R&D because Baseten helps teams operationalize models rather than invent them. The closest substitutes are hyperscaler AI platforms, internal GPU infrastructure, and specialist GPU clouds such as Modal, Replicate, and Runpod. Baseten''s adjacencies sit one step above and below the core deployment
    layer: training that promotes directly into inference, and model-lab monetization through white-labeled APIs.'
  claimRefs:
