callouts:
- calloutType: insight
  title: Baseten's wedge is narrower than all AI infrastructure but large enough anyway
  body: The public evidence supports a meaningful market without assuming Baseten serves every AI workload. The investable wedge is production inference where latency, compliance, and operational support are worth paying for.
  claimRefs:
  - CM020
  - CM021
  - CM046
  - CM048
- calloutType: risk
  title: Commodity GPU pricing is visible and ruthless
  body: Independent and competitor-authored pricing pages make it easy for buyers to see when Baseten's raw hourly rates exceed specialist rivals. That forces Baseten to prove that performance engineering and governance justify the premium.
  claimRefs:
  - CM040
  - CM043
  - CM044
  - CM047
- calloutType: recommendation
  title: Use a narrow market lens in any valuation work
  body: Given the lack of a clean public SAM or product-level unit economics, a prudent valuation stance should anchor on the narrower performance-sensitive inference wedge rather than the broadest AI-platform TAM.
  claimRefs:
  - CM020
  - CM048
  - CM049
