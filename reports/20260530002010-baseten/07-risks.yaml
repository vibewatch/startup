- id: SR005
  title: Public mitigations are meaningful, but the investment case should remain gated by explicit kill criteria
  body: 'Baseten does have tangible mitigations. Self-hosted and hybrid deployments reduce lock-in and residency

    risk, Truss improves portability, rolling deployments reduce cutover risk, SSO/SCIM strengthens access

    control, and the billing usage API gives customers a better handle on spend. Those are not superficial

    website badges; they are concrete product and operational features that can shrink risk if they are fully

    implemented in production accounts. Even the legal and regulatory risk is manageable if diligence confirms

    a clean BAA path, acceptable subprocessor controls, and contract terms that match the criticality of the

    workload.


    The key is to keep the underwriting discipline explicit. The thesis should break if Baseten cannot close the

    gap between public reliability marketing and executable SLA language, if price-performance remains far above

    peers without a quantified enterprise ROI offset, if supplier concentration turns out to be tighter than the

    multi-cloud story suggests, or if support-heavy sales prove necessary just to preserve baseline account

    health. The right posture is therefore conditional conviction: Baseten has credible mitigations, but the

    remaining evidence gaps are material enough that they should be converted into monitored triggers before a

    high-confidence investment view is allowed to stand.

    '
