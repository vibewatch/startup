company:
  name: Baseten
chapter:
  number: 7
  title: Risks
  summary: Baseten's risk profile is concentrated in compliance scope, contract-versus-marketing reliability, upstream GPU and cloud dependence, and the execution burden of scaling a premium enterprise inference platform at a $5B valuation. Public mitigations are real—multi-cloud deployment options, self-hosting, SSO/SCIM, rolling deployments, and usage telemetry—but the remaining diligence still hinges on BAA and data-scope carve-outs, negotiated SLA terms, supplier concentration, and whether premium pricing stays justified versus cheaper serverless GPU alternatives. Public data from Modal, Fireworks AI, RunPod, and CoreWeave also suggests that capital-rich or low-cost peers are scaling fast, increasing the penalty for any slip in Baseten's premium enterprise execution.
sections:
- id: SR001
  title: Legal and regulatory risk centers on compliance scope, customer contracting, and expanding AI rules
  body: 'Baseten''s public trust posture is strong on its face: the company says it is SOC 2 Type II certified,

    HIPAA compliant, GDPR aligned, and able to run region-restricted or self-hosted deployments for sensitive

    workloads. The risk is that this marketing posture narrows materially once the legal stack is read in

    full. Baseten''s security docs say it does not store model inputs or outputs by default and can enforce

    compliance policies, while the healthcare and enterprise pages market HIPAA-compliant infrastructure for

    mission-critical workloads. But the DPA embedded in Baseten''s public terms says customers must not submit

    PHI and other restricted data unless otherwise agreed in writing, and it leaves customers responsible for

    legal basis, notices, and many breach-notification duties. That does not prove a defect; it does mean the

    public website alone is not enough to underwrite regulated use.


    Regulatory pressure is also moving beyond privacy into AI-governance and procurement. The European

    Commission''s AI policy page highlights AI Act implementation, sector guidance, codes of practice, and a

    service desk meant to help businesses comply. For an inference vendor selling into healthcare and other

    regulated enterprise workloads, that raises the probability of longer diligence cycles around residency,

    documentation, model governance, and shared-responsibility boundaries even if Baseten is not the final

    application-layer decision maker. The top legal risk is therefore compliance-scope ambiguity rather than a

    known enforcement action.

    '
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR042
  tableRefs:
