    - Pause regulated-healthcare underwriting until contract evidence is produced
  - - Reliability gap
    - Sev1 incident cadence and SLA terms
    - Two or more material incidents in 90 days or no negotiated remedy beyond the public SLA
    - Reduce conviction, require pricing holdback, or stop the process
  - - Price competitiveness
    - Peer GPU economics and customer ROI
    - Baseten remains >2x public peer pricing on target GPU classes without quantified enterprise ROI offset
