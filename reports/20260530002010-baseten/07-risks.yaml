- id: SR002
  title: Operational and security risk is defined by contract scope and visible incidents, not only uptime marketing
  body: 'Baseten markets reliability aggressively. The enterprise, healthcare, dedicated inference, frontier

    gateway, and model API pages all promise four nines or 99.99% uptime, active-active redundancy, or

    highly reliable multi-cloud operations. The published SLA is narrower. It applies only to Dedicated

    Inference when Baseten is the hosting party and sets a 99.9% monthly availability target, with credits

    capped at 40% of monthly fees and recoverable only if the customer files within 24 hours. The terms then

    go further by stating the services are not licensed for time-critical or mission-critical functions and are

    not warranted to be uninterrupted or error-free. That creates a real diligence gap between product

    positioning and default contractual protection.


    Baseten''s status page also shows this is not theoretical. The service reported multiple May 2026 incidents,

    including ongoing investigations, identified fixes, monitoring updates, and a major-outage marker in the

    90-day view. Third-party monitoring adds only partial comfort because Servicealert says detailed incident

    data is unavailable and relies on reachability snapshots rather than full root-cause reporting. Baseten has

    shipped useful mitigations such as rolling deployments and deployment-health tooling, but reliability risk

    still belongs near the top of the chapter because the platform is sold into production workflows whose

    customers are highly sensitive to downtime and latency regression.

    '
  claimRefs:
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
