  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: healthcare-compliance-scope
    missingEvidence: Signed BAA or healthcare addendum showing exactly when Baseten permits PHI despite the public Restricted Data carve-out.
    whyItMatters: The public website markets HIPAA compliance, but production healthcare underwriting requires contract evidence that the PHI boundary is executable, not merely implied.
    diligencePath: Request the latest enterprise DPA/BAA package, redlined examples, and a diagram of permitted PHI flows by deployment mode.
    relatedQuestionRefs:
    - QR026
  - type: private-evidence-only
    severity: material
    topic: custom-sla-terms
    missingEvidence: Executed or template custom SLA schedules for Enterprise or Frontier Gateway accounts, including uptime commitments, exclusions, and credit mechanics.
    whyItMatters: The public SLA is narrow and weak relative to marketing claims, so diligence needs to know whether real customers receive materially better protections.
    diligencePath: Request anonymized enterprise MSA/SLA samples and ask references whether negotiated uptime remedies differ from the public terms.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: supplier-concentration
    missingEvidence: Actual cloud, GPU, and reserved-capacity mix by supplier, including any single-provider dependency thresholds.
    whyItMatters: Baseten's multi-cloud narrative may be true at the architectural level while still hiding meaningful commercial or capacity concentration in practice.
    diligencePath: Request supplier allocation data, reserved-capacity contracts, and contingency playbooks for the top GPU classes sold to enterprise customers.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, net revenue retention, support staffing ratios, and expansion dependence on a small number of large accounts.
    whyItMatters: At a premium enterprise valuation, concentration and support intensity determine whether growth is scalable software revenue or a brittle services-heavy base.
    diligencePath: Request cohort metrics, top-10 customer revenue concentration, gross retention, and hours of support consumed by major accounts.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: audit-evidence
    missingEvidence: Current SOC 2 report, bridge letter, penetration-test summary, ISO certificate package, and Trust Center exports.
    whyItMatters: The public site references certifications and compliance posture, but strict enterprise diligence usually requires inspectable artifacts rather than marketing statements.
    diligencePath: Request the latest audit packet from the Trust Center and verify certificate scope, dates, exceptions, and remediation items.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
