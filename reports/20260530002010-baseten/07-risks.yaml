  - - Supplier concentration
    - Capacity-booking evidence
    - Reserved capacity or supplier diversification is materially weaker than the multi-cloud narrative implies
    - Increase dependency discount and require contingency planning
  notes: Kill criteria are deliberately monitorable so they can be tied to diligence outputs rather than generic caution.
