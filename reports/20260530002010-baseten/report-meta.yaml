  productSummary: >
    Baseten sells a production inference platform for custom models, model APIs, dedicated inference,
    training workflows, and compound-AI orchestration. Its Truss framework is the developer entry point,
    while enterprise features emphasize multi-cloud deployment, self-hosting, regional controls,
    compliance scope, and performance tuning for latency-sensitive workloads.
  customerFocus: >
    Enterprise AI teams, AI-native application builders, and regulated workloads that need low-latency,
    high-reliability model serving with security, hybrid deployment, or performance-engineering support.
    Public customer evidence is strongest in healthcare AI, developer tooling, GTM automation, voice, and
    productivity software.
  businessModel: >
    Usage-based monetization: token-priced model APIs, per-minute GPU and CPU compute for deployments, and
    negotiated Pro or Enterprise contracts for dedicated capacity, support, and self-hosted or data-
    residency-sensitive environments. The platform also appears to expand via training, chains, and
    higher-touch enterprise engineering support.
  stage: Late-stage private (Series E)
  fundingStatus: >
    Public funding history includes a little over $20M across seed and Series A, a $40M Series B in 2024,
    a $75M Series C in February 2025, a $150M Series D in September 2025, and a $300M Series E at a $5B
    valuation in January 2026. Business Wire says total disclosed funding is about $585M.
