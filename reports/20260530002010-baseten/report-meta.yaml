companyProfile:
  summary: >
    Baseten is a San Francisco-based inference infrastructure company founded in 2019 by Tuhin
    Srivastava, Amir Haghighat, Phil Howes, and Pankaj Gupta. The company positions itself as the
    software layer for running production AI workloads across its own cloud or a customer's environment,
    combining model APIs, dedicated inference, training, and enterprise deployment controls. Public
    customer proof spans AI-native products and regulated workloads including Cursor, Clay, OpenEvidence,
    Abridge, Gamma, Patreon, Speechify, Writer, Hebbia, Wispr Flow, and others. Baseten raised $300M at
    a $5B valuation in January 2026, bringing disclosed funding to about $585M and reinforcing its status
    as a late-stage private infrastructure company.
