- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Public mechanism
  - Key dependencies
  - Risk / limitation
  rows:
  - - Packaging layer (Truss)
    - Packages model definition, dependencies, secrets, caching, and GPU config from config.yaml or Python model code
    - Baseten CLI, GitHub/PyPI distribution, user source repositories
    - Abstraction is strong, but deployment success still depends on model-specific tuning and user-supplied weights
  - - Build / compile path
    - Engine-Builder-LLM downloads weights, compiles with TensorRT-LLM, applies quantization/tensor parallelism, and emits a serving container
    - Hugging Face or cloud-storage weight source, CUDA-compatible GPU targets
    - Compile times can take minutes and public docs do not benchmark every model/hardware combination
  - - Runtime optimization layer
    - Inference runtime exposes TensorRT, SGLang, vLLM, TGI, TEI, speculative decoding, structured output, KV-cache optimization, and topology-aware parallelism
    - Model architecture support, Baseten inference runtime, GPU memory/layout assumptions
    - Optimization options are numerous but not all are validated publicly per workload
  - - MCM control plane
    - Unifies GPUs across clouds/regions, provisions resources, monitors health, and reroutes around capacity crunches or outages
    - Underlying cloud GPU supply, networking, Baseten control plane
    - Cross-cloud abstraction reduces lock-in but introduces dependency on Baseten’s own orchestration layer
  - - Weight delivery / cold-start path
    - BDN mirrors weights to Baseten storage and caches them at mirrored-origin, cluster, and node layers
    - Upstream weight repository for first mirror, Baseten blob storage, in-cluster cache
    - First deploy still depends on upstream weight availability; benchmark methodology for “2-3x faster” is not public
  - - Request routing / environments
    - Each model gets a subdomain; URL path resolves environment; async requests queue; promotions keep endpoint names stable
    - Baseten API gateway, environment config, autoscaler, queue service
    - Scale-to-zero introduces cold-start trade-offs and regional guarantees require a special endpoint
  - - Workflow orchestration / training
    - Chains coordinates multi-step workflows; Training Jobs and Loops provision GPUs via MCM and can deploy checkpoints into inference
    - Python SDK/CLI, MCM, storage/checkpoint sync
    - Loops is early access and training maturity lags the core inference surface
  - - Enterprise controls / tenancy
    - Single-tenant, self-hosted, hybrid, and regional environments plus SSO/SCIM and compliance-policy boundaries
    - Customer IdP, Baseten support setup, customer cloud if self-hosted
    - Some controls require sales/support intervention rather than pure self-serve enablement
  notes: This table mixes direct documentation facts with synthesis about operating dependencies. “Risk / limitation” names the public caveat or diligence item, not an observed failure.
