- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / signal
  - Public status
  - Scope / evidence
  - Implication
  - Gap
  rows:
  - - SOC 2 Type II + HIPAA
    - Published
    - Security docs, enterprise page, and pricing page all cite SOC 2 Type II and HIPAA
    - Strong baseline trust signal for enterprise inference workloads
    - No public certificate artifacts or audit scope details in the reviewed corpus
  - - Default non-storage of prompts/outputs/weights
    - Published with caveats
    - Security docs say Baseten does not store inputs, outputs, or weights by default, except temporary async storage and optional caching
    - Important privacy and IP positioning for sensitive inference
    - Need contract/DPA review for exact retention edge cases and customer-enabled caching behavior
  - - GPU and namespace isolation
    - Published
    - Security docs say Baseten never shares GPUs across users and assigns each customer a dedicated Kubernetes namespace with Calico/Falco/Gatekeeper controls
    - Supports tenant isolation claims beyond generic cloud marketing
    - No public penetration-test report or architecture diagram was reviewed
  - - Regional environments / data residency
    - Published but support-configured
    - Docs explain region-constrained replicas and special regional endpoint formats
    - Useful for GDPR/data-residency buyers that need routing guarantees
    - Setup requires Baseten involvement and public docs do not state lead times or pricing
  - - Identity and lifecycle controls
    - Expanded in 2026
    - SSO/SCIM changelog adds SAML 2.0, SCIM 2.0, JIT provisioning, deprovisioning, and group-based roles on Enterprise
    - Improves enterprise admin hygiene and procurement readiness
    - No public mapping to specific IdP limitations or SCIM attributes
  - - Hosting flexibility
    - Published
    - Enterprise, dedicated-inference, and security pages describe Baseten Cloud, self-hosted, hybrid, and single-tenant modes
    - Lets buyers choose between speed, control, and cloud-commitment reuse
    - Exact operational split between Baseten-managed and customer-managed responsibilities is not fully public
  - - Contractual availability
    - Mixed
    - SLA contract says Dedicated Inference targets 99.9% monthly availability; marketing pages often use 99.99/four-nines language
    - Public procurement should rely on the legal SLA rather than homepage shorthand
    - No public SLA was found for Model APIs, Chains, or the broader web app
  - - Operational incident visibility
    - Published but mixed
    - Public status page shows multiple May 2026 incidents; third-party reachability tracker says detailed incident data is unavailable
    - Visibility exists, but independent uptime corroboration is thin and headline uptime panels can hide short incidents
    - Need contractual incident response terms, RCA access, and service-credit history in diligence
  notes: Confidence is highest where multiple official pages agree; lower where public documentation requires contact with support or contract review. This table describes what is public, not what Baseten may provide privately in diligence.
