- calloutType: strength
  title: Baseten Covers the Full Path from Model Artifact to Production Endpoint
  body: The strongest product-tech evidence is not a single SKU but the continuity between Truss packaging, MCM-backed deployment, BDN cold-start mitigation, environment promotion, and optional workflow/gateway layers. That continuity reduces the handoff count between experimentation, deployment, and monetization.
  claimRefs:
  - CE001
  - CE005
  - CE009
  - CE010
  - CE013
- calloutType: risk
  title: Premium Pricing Requires Buyers to Value Performance Engineering and Support
  body: Independent pricing comparisons suggest Baseten is materially more expensive per published GPU hour than Runpod or Modal on several common instance types. The investment case in product terms therefore depends on whether customers truly need cross-cloud orchestration, performance tuning, and higher-touch support rather than lowest-cost self-serve capacity.
  claimRefs:
  - CE031
  - CE032
  - CE033
  - CE040
- calloutType: risk
  title: Public Reliability Language Is Stronger Than the Public Contract
  body: Baseten's marketing frequently uses “four nines” language, but the reviewed public contract covers Dedicated Inference at 99.9% monthly availability. The May 2026 incident log means enterprise buyers should diligence service credits, RCA access, and product-specific SLAs rather than relying on homepage reliability shorthand.
  claimRefs:
  - CE023
  - CE024
  - CE025
