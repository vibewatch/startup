- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow
  - Baseten solution
  - Public benefit
  - Limitation
  rows:
  - - Prototype with a frontier/open model quickly
    - Swap providers without building deployment infra
    - Model APIs
    - Point an existing OpenAI or Anthropic SDK at Baseten and start calling supported models immediately
    - You accept the supported-model list and shared-infrastructure model rather than choosing exact hardware
  - - Deploy an open-source or proprietary model to production
    - Package model, pick hardware/engine, expose stable endpoint
    - Truss + Dedicated Inference
    - Config-driven deployment path with TensorRT-LLM or custom-server options, observability, and environment promotion
    - Customer still needs to validate performance/cost trade-offs per model because Baseten does not publish a universal benchmark methodology
  - - Run a compound AI application
    - Split a multi-step workflow across specialized components
    - Chains
    - Each chainlet can use its own hardware and autoscaling, reducing monolithic GPU waste and latency bottlenecks
    - Public performance claims are directional; workflow-specific latency depends on design and workload
  - - Commercialize a lab-owned model
    - Expose model to third-party customers with metering and rate limits
    - Frontier Gateway
    - White-labeled URL, key management, usage limits, and per-customer billing remove the need to build an API gateway from scratch
    - Commercial and contractual details beyond the marketing surface are not public
  - - Train or fine-tune and then deploy checkpoints
    - Run training code, sync checkpoints, and promote into inference
    - Training Jobs / Loops + deploy_checkpoints
    - Same vendor can cover managed training infra and downstream deployment endpoint
    - Loops remains early access, so the most advanced post-training path is not yet fully mature in public materials
