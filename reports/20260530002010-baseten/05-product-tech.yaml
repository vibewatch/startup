- id: roadmap-maturity
  title: Roadmap and Product Maturity
  body: Public 2026 roadmap signals point to Baseten maturing operating controls around a fairly stable product architecture rather than constantly adding new product families. The notable 2026 releases were SSO/SCIM, rolling deployments, BDN, and a billing usage API—features that make the platform easier to govern, safer to update, faster to cold-start, and easier to instrument financially. That release mix suggests Baseten is moving from “can this serve models?” toward “can this run mission-critical inference inside enterprise processes?” At the same time, maturity is uneven across the stack. Training Jobs are publicly GA, while Loops remains early access, so the training-to-inference story is strategically promising but not uniformly production-proven. Public materials also say little about benchmark methodology, exact enterprise onboarding lead times for regional controls, or product priorities beyond the currently disclosed 2026 changelog, leaving some product-tech diligence items unresolved.
