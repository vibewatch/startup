tables:
- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / Asset
  - Primary user
  - Status / maturity
  - Core function
  - Differentiation
  - Diligence gap
  rows:
  - - Model APIs
    - Application developers evaluating or shipping frontier/open models
    - GA / mature shared service
    - Instant OpenAI- and Anthropic-compatible inference on Baseten-managed shared infrastructure
    - Lowest-friction entry point; built-in caching, tool calling, structured outputs, and migration path to dedicated deployments
    - Shared infrastructure by design; public docs do not disclose tenant-level contention controls or per-model benchmark methodology
  - - Dedicated Inference
    - Teams serving custom, fine-tuned, or proprietary models in production
    - GA / core enterprise surface
    - Single-tenant or customer-controlled inference with custom hardware, scaling, and deployment options
    - Combines managed performance tuning, cross-cloud autoscaling, and enterprise control surfaces
    - Only public contractual SLA is 99.9%; published GPU-hour pricing is high versus self-serve peers
  - - Truss
    - ML engineers packaging and iterating on custom deployments
    - Mature open-source CLI with active May 2026 releases
    - Packages model code, weights, dependencies, and GPU config; deploys via uvx truss push/watch
    - Write-once packaging abstraction with live reload and support for many serving frameworks
    - Open-source activity is healthy, but public docs do not quantify enterprise adoption of Truss specifically
  - - Chains
    - Teams building RAG, transcription, or multi-model workflows
    - GA / production workflow layer
    - Orchestrates Python chainlets with per-step hardware, dependencies, and autoscaling
    - Lets Baseten sell compound-AI workflows without forcing monolithic model deployments
    - Public performance claims are directional; workflow-specific latency depends on design and workload
  - - Frontier Gateway
    - AI labs commercializing their own hosted models
    - GA / specialized monetization surface
    - White-labeled inference API with key management, billing, metering, rate limits, and branded URL routing
    - Turns Baseten into invisible infrastructure for labs that want their own API brand and monetization layer
    - Public documentation does not describe customer count, supported billing edge cases, or settlement workflows
  - - Training Jobs / Loops
    - Research and infra teams training or post-training models before deployment
    - Training Jobs = GA; Loops = early access
    - Managed GPU training plus a path to deploy checkpoints into inference endpoints
    - Attempts to close training-to-inference loop inside one platform rather than handing off to another vendor
    - Loops is still early access, so maturity is uneven versus the inference stack
  notes: Status labels reflect Baseten's own public wording as of 2026-05-30. “Mature” means a repeatedly described GA surface with operational documentation; it does not imply externally audited feature quality.
