- id: trust-reliability
  title: Trust, Data Handling, and Reliability Controls
  body: 'Baseten''s trust posture is strong by startup standards and particularly important because the company wants sensitive inference workloads. The public security documentation says Baseten maintains SOC 2 Type II and HIPAA compliance, does not store model inputs, outputs, or weights by default, never shares GPUs across users, isolates customers into dedicated Kubernetes namespaces, and uses controls such as Calico, Falco, and Gatekeeper around workload isolation. Enterprise and pricing pages also advertise self-hosted, single-tenant, hybrid, and region-restricted options, while regional-environments docs explain that true residency requires a distinct regional endpoint rather than the default environment CNAME. The nuance is reliability: Baseten marketing frequently uses four-nines language, but the only public contractual commitment is the Dedicated Inference SLA at 99.9% monthly availability. The public status page also logged multiple May 2026 incidents, so diligence should treat
    trust/compliance as a strength and public reliability guarantees as more mixed.'
