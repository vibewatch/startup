- id: FE001
  title: Baseten Product Architecture Map
  type: stack
  layout: wide
  summary: Layered view of Baseten's public architecture from access surfaces through packaging/orchestration to runtime and cross-cloud infrastructure.
  data:
    layers:
    - id: layer-access
      label: Access & API Surface
      detail: Shared Model APIs, environment-specific model endpoints, and white-labeled Frontier Gateway entry points for external callers.
      sublayers:
      - id: access-model-apis
        label: Model APIs
        detail: Shared OpenAI- and Anthropic-compatible endpoints for supported models.
      - id: access-env-endpoints
        label: Environment endpoints
        detail: Stable per-model subdomains with development, production, or named environments.
      - id: access-frontier
        label: Frontier Gateway
        detail: Branded customer-facing API with keys, metering, and usage limits.
    - id: layer-workflow
      label: Packaging, Workflow, and Control Layer
      detail: Developer and operator surfaces that define how models are packaged, chained, trained, and promoted.
      sublayers:
      - id: wf-truss
        label: Truss
        detail: Packaging CLI for config-driven or Python-model deployments with live reload.
      - id: wf-chains
        label: Chains
        detail: Python chainlets for multi-step inference workflows with per-step hardware.
      - id: wf-training
        label: Training Jobs / Loops
        detail: Managed training surfaces that can feed checkpoints back into inference.
      - id: wf-mgmt
        label: Model management
        detail: Observability, release management, autoscaling controls, and promotion settings.
    - id: layer-runtime
      label: Runtime & Routing Layer
      detail: Serving engines, request routing, and autoscaling behavior that make inference endpoints usable in production.
      sublayers:
      - id: rt-engine
        label: Engine-based runtimes
        detail: TensorRT-LLM and other runtime choices plus quantization, KV cache, structured output, and speculative decoding.
      - id: rt-routing
        label: Request routing
        detail: Environment-aware URL routing, sync/async request handling, and queue priority for real-time traffic.
      - id: rt-autoscale
        label: Autoscaling
        detail: Replica-based scale-up/scale-down with scale-to-zero trade-offs.
    - id: layer-infra
      label: Cross-Cloud Infrastructure Layer
      detail: Baseten-owned infrastructure systems that sit below both inference and training.
      sublayers:
      - id: infra-mcm
        label: MCM
        detail: Cross-cloud capacity control plane that provisions and reroutes GPU workloads.
      - id: infra-bdn
        label: BDN
        detail: Multi-tier weight mirroring and caching for faster cold starts.
      - id: infra-tenancy
        label: Tenancy & regional controls
        detail: Single-tenant, self-hosted, hybrid, and regional-environment options.
