chapter:
  number: 5
  title: Product & Technology
  summary: 'Baseten exposes a coherent full-stack AI infrastructure product set: shared Model APIs for instant OpenAI/Anthropic-compatible access, Truss-led dedicated deployments for custom models, Chains for compound workflows, Frontier Gateway for white-labeled lab APIs, and training products that can feed checkpoints directly into inference. Public docs are unusually specific about the technical path—Truss packaging, TensorRT-LLM compilation, MCM cross-cloud scheduling, BDN weight caching, environment promotion, and regional endpoints—but diligence still needs to reconcile premium published GPU pricing, a 99.9% contractual Dedicated Inference SLA versus four-nines marketing language, and limited public detail on benchmark methodology and longer-term roadmap.'
sections:
- id: product-surface
  title: Product Surface in Customer Workflow Terms
  body: Baseten now spans most of the modern AI deployment workflow rather than a single hosting SKU. At the lightest-weight end, Model APIs let teams swap an OpenAI or Anthropic base URL and call shared frontier/open models immediately, which is useful for prototyping or for products that do not need dedicated GPUs. At the heavier-weight end, Truss packages a custom or open-source model into a reproducible deployment artifact, while Dedicated Inference adds tenant-isolated capacity, custom scaling, and support for stricter latency or compliance needs. Chains sits above single-model inference for multi-step RAG, transcription, or multimodal flows, Frontier Gateway adds branded URLs plus billing/rate-limit controls for model labs monetizing their own APIs, and Baseten Training/Loops try to close the loop from checkpoint creation to production serving. In customer workflow terms, the company is selling a graduated path from instant API evaluation to custom production inference, not just raw
    GPU rental.
