- id: durability-satisfaction-and-expansion
  title: Durability, satisfaction, and expansion evidence
  body: 'Durability evidence is directionally positive but incomplete. On the positive side, third-party reference aggregators show unusually strong public sentiment proxies: FeaturedCustomers reports a 4.8/5 reference score from 654 ratings, PeerSpot highlights collaboration and cost effectiveness, and individual customer quotes repeatedly describe Baseten as a winner on execution, uptime, or self-serve deployment. The product packaging also shows a plausible land-and-expand motion, from Basic pay-as-you-go usage into Pro dedicated compute and Enterprise self-hosted or region-restricted deployments. Healthcare and enterprise pages make that motion concrete by advertising HIPAA-sensitive workflows, single-tenant clusters, failover, and hands-on engineering support. The key limitation is that none of the reviewed public sources provide NRR, GRR, renewal cohorts, or contract duration, so expansion has to be inferred from packaging and customer quotes rather than measured account economics.'
  claimRefs:
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
  - CU046
  - CU054
