- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: The public adoption path starts with technical evaluation, moves into one production workload, and only later expands into dedicated compute, governance, and larger enterprise commitments.
  data:
    nodes:
    - id: evaluate
      label: Evaluate models
      detail: Teams test pre-optimized or custom models and compare latency, cost, and deployment friction.
    - id: pilot-prod
      label: Ship first production workload
      detail: A core use case such as search, voice, embeddings, or image generation moves onto Baseten.
    - id: optimize
      label: Optimize performance
      detail: Baseten and customer engineers tune latency, throughput, cost, and cold starts.
    - id: enterprise-controls
      label: Add controls
      detail: Dedicated compute, single-tenancy, security, and compliance become decision points.
    - id: expand
      label: Expand workload footprint
      detail: Customers add more models, more traffic, or more regulated deployment modes.
    - id: replatform-choice
      label: Replatform or retain
      detail: As spend rises, the customer weighs Baseten against cheaper rivals or more in-house control.
    edges:
    - from: evaluate
      to: pilot-prod
      label: Benchmark meets product bar
    - from: pilot-prod
      to: optimize
      label: Traffic grows and production pain surfaces
    - from: optimize
      to: enterprise-controls
      label: Security, uptime, and governance requirements deepen
    - from: enterprise-controls
      to: expand
      label: More models, users, or regions move onto the platform
    - from: expand
      to: replatform-choice
      label: Spend and strategic importance raise switching questions
