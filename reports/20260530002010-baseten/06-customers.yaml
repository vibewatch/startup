  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Account-level NRR, GRR, logo churn, renewal rate, and contract-duration disclosure by segment.
    whyItMatters: Without renewal and retention cohorts, public testimonials cannot be converted into a durable revenue-quality judgment.
    diligencePath: Request cohort retention tables by vintage, plan tier, and customer segment from management.
    relatedQuestionRefs:
    - QU017
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, workload concentration, contract minimums, and deployment-mode mix for the top ten accounts.
    whyItMatters: The public record names customers but does not show whether a few very large workloads dominate Baseten's economics.
    diligencePath: Request top-10 customer concentration tables and any internal concentration policy thresholds.
    relatedQuestionRefs:
    - QU019
    - QU023
    relatedTableRefs:
    - TU005
    - TU006
  - type: missing-source
    severity: material
    topic: active-account-denominator
    missingEvidence: A harmonized time series for active production customers, not just named references or workload anecdotes, plus a complete denominator behind the partial named-customer enumeration in TU003.
    whyItMatters: Workload scale is evident, but investors still cannot tell how concentrated growth is across customers or verticals, or how representative the public named-customer set really is.
    diligencePath: Request quarterly active-customer and production-account counts split by self-serve, pro, and enterprise cohorts, and ask management to reconcile the public reference list against the broader production base.
    relatedQuestionRefs:
    - QU004
    - QU005
    relatedTableRefs:
    - TU002
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: plan-conversion
    missingEvidence: Data showing how customers progress from Basic or initial deployments into Pro, Enterprise, or self-hosted footprints.
    whyItMatters: The public plan ladder suggests land-and-expand potential, but the actual conversion mechanics remain unverified.
    diligencePath: Request customer-lifecycle analysis showing plan transitions, attach rates, and self-host adoption.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU005
