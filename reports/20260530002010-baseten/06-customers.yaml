- id: concentration-switching-and-competitive-pressure
  title: Concentration, switching, and competitive pressure
  body: The main customer risk in the public record is not obvious churn but concentrated visibility. Baseten has more named accounts than just the six flagship stories, yet the quantified proof still sits inside a narrow band of AI-native software companies. That creates two diligence questions. First, there is no public disclosure of top-customer revenue share, contract lengths, or renewal rates, so investors cannot tell whether a handful of very large workloads dominate the book. Second, competitive pressure is real. HostFleet's April 2026 matrix shows Baseten as the most expensive listed option on multiple common GPUs, while Runpod's 2026 comparison ranks Baseten fifth and attributes materially faster headline cold starts to some rivals. WorkOS also describes a point where customers spending $10k-$50k per month start considering more control and lower-cost open-source options. Baseten counters that risk with open runtimes and no lock-in around customer models, but that also means portability
    tolerance will stay high. In other words, Baseten may be easier to adopt than a proprietary stack, but it must continuously re-win customers on operating performance and support rather than on captivity.
