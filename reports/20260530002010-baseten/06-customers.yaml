- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named production proof
  body: 'Baseten''s best public adoption evidence is not a disclosed customer-count time series so much as a stack of workload-scale and outcome disclosures from reference customers. The company says inference volume grew 100x over the last year, and its customer-story index now spans healthcare, code, audio, presentations, and operations use cases. The flagship six case studies are production-grade rather than pilot-like: OpenEvidence discloses billions of requests per week and a doctor in every U.S. zip code, Speechify discloses 161B+ characters per month for 60M+ users, Gamma discloses 3M+ images per day for 70M+ users, Superhuman says dozens of custom models moved into production, and Patreon reports large cost savings on a scaled Whisper deployment. The quality of proof is strongest where Baseten and the customer share concrete latency, cost, throughput, or workflow metrics, though the public set remains curated.'
