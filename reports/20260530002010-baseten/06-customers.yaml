  title: Customers
  summary: 'Baseten''s public customer proof shows real production adoption across AI-native enterprise software, healthcare, voice, productivity, and creator applications, with unusually strong case-study outcome detail for a private infrastructure company. The weak spot is durability disclosure: public materials do not provide NRR, contract length, or concentration data, so retention and expansion must be inferred from testimonials, packaging, and reference breadth rather than from customer cohorts.'
sections:
- id: customer-segmentation-and-buyer-profile
  title: Customer segmentation and buyer profile
  body: Baseten's public customer evidence points to a buyer set made up primarily of AI-native software builders whose own end products live or die on inference speed, reliability, and cost. The buyer is usually an ML, platform, or product-engineering leader, while the user base broadens into application engineers, security teams, and operations leads once a workload moves from model evaluation into production. Publicly named examples span enterprise agent platforms such as Writer and Notion, regulated healthcare apps such as OpenEvidence and Abridge, voice and speech applications such as Speechify, productivity software such as Superhuman, creative tools such as Gamma, and GTM or coding products such as Clay and Cursor. That breadth matters because it shows Baseten is not only selling experimentation infrastructure. At the same time, the disclosed book is still overwhelmingly AI-native software rather than a diversified set of legacy enterprises, so customer breadth is real but not yet
    institutionally broad in public.
