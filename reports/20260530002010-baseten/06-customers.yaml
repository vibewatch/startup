- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / constraint
  - Impact
  - Diligence path
  rows:
  - - Basic → Pro → Enterprise packaging
    - Public plan ladder suggests upsell, but conversion rates are undisclosed
    - Supports land-and-expand if customers outgrow self-serve inference
    - Request plan-mix by customer cohort and expansion rates from Basic into Pro/Enterprise
  - - Enterprise controls and self-hosted deployment
    - Could bias sales toward fewer, larger technical buyers and service-heavy motions
    - Helpful for regulated and sensitive workloads, but may increase top-account concentration risk
    - Request top-10 customers by ARR, workload volume, and deployment mode
  - - Healthcare-specific compliance posture
    - Vertical concentration could deepen if healthcare becomes the dominant expansion vector
    - Regulated workloads may be sticky if compliance and reliability prove durable
    - Request healthcare revenue share, customer count, and renewal history
  - - Flagship case-study concentration
    - Quantified public proof is concentrated in six stories and mostly AI-native software
    - Investors cannot infer portfolio durability from a narrow reference set
    - Request anonymized cohort statistics for the broader customer base
  - - Premium public pricing
    - Higher published GPU prices and minimum deployment costs can increase switching pressure
    - Pricing could slow expansion for cost-sensitive workloads or make replatforming attractive
    - Request win/loss and churn reasons on price-sensitive accounts
  - - Open-source model portability
    - Customers can increasingly switch models and bring more infra in-house as spend rises
    - Baseten must keep winning on speed, support, and economics rather than lock-in
    - Request data on customer tenure, self-host conversions, and workloads retained after optimization
  notes: The strongest expansion signals are packaging and customer quotes, while the strongest risk signals are public-proof concentration and competitive price pressure.
