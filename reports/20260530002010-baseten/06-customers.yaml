    - OpenEvidence, Abridge, Ambience
    - Regulated medical information and clinical documentation workloads
    - No public contract-value or health-system count disclosure
  - - Voice and speech applications
    - 'Buyer: product / ML platform lead; User: end users and content teams; Payer: voice application vendor'
    - Speechify
    - Consumer-scale TTS and voice infrastructure under real-time latency pressure
    - No public disclosure of revenue concentration inside audio workloads
  - - Productivity and collaboration apps
    - 'Buyer: product / engineering leadership; User: professionals and knowledge workers; Payer: software vendor'
    - Superhuman, Notion
    - Inference directly affects email, workspace, and agent UX
    - Production KPIs are public for Superhuman, not for Notion
  - - Creative and creator-economy platforms
    - 'Buyer: product / infra lead; User: creators and prosumers; Payer: software vendor'
    - Gamma, Patreon
    - Large-scale image generation and creator-media workloads
    - Consumer logos do not by themselves prove long-term renewal economics
  - - GTM and developer tools
    - 'Buyer: engineering / revenue-ops lead; User: developers, GTM operators, recruiters; Payer: software vendor'
    - Clay, Cursor, Mercor
    - Shows Baseten exposure to code, GTM, and AI-economy tooling
    - Only public name mentions exist for most of these accounts
  notes: Segmentation is assembled from Baseten case studies, fundraising references, and official customer pages; Baseten does not publish customer-count or ARR mix by segment.
