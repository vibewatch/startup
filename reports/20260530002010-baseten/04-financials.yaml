- id: TI004
  title: Capital adequacy table
  columns:
  - metric
  - public value / status
  - source-backed implication
  - diligence ask
  rows:
  - - Total capital raised
    - $585M total capital raised publicly reported
    - Capital access has been strong enough to fund rapid scale-up, but cash remaining is unknown.
    - Provide current cash balance and unrestricted cash after the January 2026 round.
  - - Latest financing
    - $300M Series E at $5B valuation in January 2026
    - Fresh equity materially improved flexibility entering 2026.
    - Provide post-close cash bridge and board-approved operating plan.
  - - Funding cadence
    - Series C $75M (Feb 2025), Series D $150M (Sep 2025), Series E $300M (Jan 2026)
    - Three rounds inside roughly a year implies aggressive investment mode and possible dependence on capital markets.
    - Provide target next-round timing and financing contingency plan.
  - - Planned use of funds
    - Speed, uptime, developer experience, team growth, platform expansion, more integrations and support
    - Spend appears aimed at product, infra, and headcount rather than harvest mode.
    - Provide 24-month capex / opex budget by function.
  - - Cash balance / monthly burn / runway
    - Not publicly disclosed
    - Capital adequacy cannot be underwritten from public evidence.
    - Provide monthly net burn, cash balance, runway under base and downside cases.
  - - Debt / project-finance obligations
    - No public debt schedule or project-finance obligations disclosed; SEC operating-company filings unavailable from cited EDGAR page
    - Absence of disclosure does not equal absence of obligations.
    - Provide all debt facilities, cloud-commitment liabilities, reserved-capacity obligations, and major vendor terms.
  notes: Funding facts are public; adequacy is not. This table intentionally separates known financing history from unknown liquidity and obligation metrics.
