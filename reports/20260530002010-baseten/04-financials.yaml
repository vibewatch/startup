  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Monthly revenue mix across Model APIs, Dedicated Inference, Training, and services plus contribution margin by surface.
    whyItMatters: Without mix, investors cannot tell whether growth is predominantly scalable software usage or labor-heavy support revenue.
    diligencePath: Request monthly revenue and gross-margin bridge by product surface for the last 18 months.
    relatedQuestionRefs:
    - QI028
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Enterprise discount schedules, minimum commits, credits, and list-to-net realization by customer cohort.
    whyItMatters: List prices can materially overstate yield and margin in infrastructure businesses with negotiated enterprise contracts.
    diligencePath: Review five recent signed orders, associated discount approvals, and realized billings versus list.
    relatedQuestionRefs:
    - QI029
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-runway
    missingEvidence: Current cash balance, monthly burn, runway, gross margin by product line, and major cloud or GPU capacity obligations.
    whyItMatters: Capital adequacy and underwriting are impossible without actual liquidity and margin data.
    diligencePath: Obtain current board package, trailing six-month burn report, and product-level COGS schedule.
    relatedQuestionRefs:
    - QI030
    relatedTableRefs:
