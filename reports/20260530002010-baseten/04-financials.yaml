- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Revenue mix by Model APIs vs Dedicated Inference vs Training vs services
    - Cannot judge whether growth is durable software-like expansion or support-heavy services revenue.
    - Request monthly revenue by product surface for the last 18 months plus contribution margin by surface.
  - - List-to-net pricing, enterprise minimum commits, and discount schedules
    - Public list pricing may overstate realized yield and margin.
    - Review five recent enterprise orders with associated discount approvals and usage curves.
  - - Gross margin by product line and cloud / GPU procurement terms
    - Impossible to assess whether optimization claims translate into retained gross profit.
    - Provide product-level COGS, major cloud spend by provider, and any reserved-capacity commitments.
  - - Cash balance, monthly burn, and runway
    - Capital adequacy cannot be underwritten despite recent fundraises.
    - Provide current cash waterfall, trailing six-month burn, and scenario runway model.
  - - Customer concentration, NRR, churn, and cohort expansion
    - Cannot test revenue quality or durability beyond anecdotal customer stories.
    - Provide top-20 customer revenue concentration, logo churn, dollar churn, and cohort NRR.
  - - Public filing and audit trail depth
    - Lack of SEC operating financials leaves investors dependent on management-only materials.
    - Provide audited financial statements, board package KPIs, and any lender reporting packs.
  notes: Every row is a material diligence blocker rather than a nice-to-have. Public evidence establishes narrative direction, not underwriteable private metrics.
