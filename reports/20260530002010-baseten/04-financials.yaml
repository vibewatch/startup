company:
  name: Baseten
chapter:
  number: 4
  title: Financials
  summary: 'Baseten''s public financial profile shows a coherent usage-based inference business with premium list pricing, strong customer-reported total-cost savings, and unusually strong capital access for a private infrastructure company. The company monetizes dedicated inference, Model APIs, Training, and higher-touch enterprise controls, but realized revenue mix, discounts, gross margin, and burn remain private. Public funding evidence supports $585M raised to date, including a $300M Series E at a $5B valuation in January 2026 after two prior rounds inside the previous year. The best unit-economics evidence is proxy evidence: Baseten claims 6x better utilization and 5-10x lower serving cost, while customer case studies report lower per-token, per-character, and engineering costs. The adverse check is clear as well: independent pricing data shows Baseten is generally premium-priced versus raw GPU clouds. Capital adequacy therefore looks directionally strong but not underwriteable—there
    is no public cash, burn, runway, or product-level gross margin disclosure. Verdict: promising premium infrastructure business, but private-metric dependence remains a material diligence blocker. Public customer case studies also show that Baseten is monetizing workloads across finance, coding, voice, and 3D world models, which is a constructive revenue-quality signal even though the company still does not disclose revenue concentration or retention.'
sections:
- id: revenue-model-and-public-pricing
  title: Revenue model and public pricing
  body: 'Baseten''s public financial story starts with a straightforward revenue design: the company charges for production inference and adjacent infrastructure usage, not for seats. The pricing page exposes three commercial surfaces—dedicated deployments, Model APIs, and Training—and wraps them in a Basic self-serve tier plus quote-based Pro and Enterprise packaging. Model APIs are priced per million tokens, dedicated deployments are billed for compute used down to the minute, and Training is sold as both managed Training Jobs and the newer Loops workflow that feeds checkpoints straight into inference. That is a coherent production-infrastructure monetization model, and the billing-usage API reinforces it by splitting spend across dedicated inference, training, and Model APIs with daily breakdowns and credits used.


    The nuance is that list pricing is only the outer shell of the model. Public materials show that the real commercial wedge sits in premium support, priority compute, self-host deployment, use of existing cloud commitments, custom SLAs, and advanced security or governance. Those features imply Baseten is trying to monetize both usage and a higher-touch enterprise motion. The Terms also make the customer Order the binding commercial instrument, which means realized pricing can diverge materially from the public price page once support, discounts, and minimum commitments enter the deal. That is important for revenue recognition and yield analysis because public list prices are observable, but list-to-net economics are not.


    The result is a credible revenue architecture with decent public visibility into billing units and weak visibility into realized revenue quality. Public evidence can show how Baseten intends to charge; it cannot show revenue mix, attach rates for services, or what customers actually pay after enterprise negotiation.'
