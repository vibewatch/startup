  rows:
  - - Published billing unit
    - GPU-minute for dedicated inference; per-1M-token for Model APIs
    - High
    - Shows Baseten monetizes usage rather than seats.
    - Provide realized billing mix by workload type.
  - - Company-claimed utilization lever
    - 6x better GPU utilization and 5-10x lower costs on Dedicated Inference
    - Medium
    - If true, utilization is the core gross-margin lever.
    - Provide before/after utilization histograms and gross margin by optimized runtime.
  - - Price-floor pressure
    - HostFleet shows Baseten premium to Runpod on shared SKUs and premium to Modal on shared L4/H100 rows
    - Medium
    - Premium pricing must be justified by lower total cost, not raw GPU-hour parity.
    - Provide win/loss analyses where Baseten beats cheaper raw-GPU alternatives.
  - - Writer proxy
    - 35% lower cost per million tokens; 60% higher tokens/sec; 23% lower TTFT
    - Medium
    - Suggests performance optimization can offset premium list pricing.
    - Provide benchmark methodology and comparable customer gross margin impact.
  - - OpenEvidence / Speechify proxy
    - 78% lower latency, 6x faster deployment, 8x lower maintenance, 44% lower cost per million characters
    - Medium
    - Supports TCO argument through both infra savings and fewer platform engineers.
    - Provide audited customer expansion and retention data after migration.
  - - Patreon / Superhuman proxy
    - $600k resources saved yearly, 70% GPU-cost savings, 80% lower latency, multiple engineers freed
    - Medium
    - Shows economic value can sit in labor efficiency as well as compute savings.
    - Provide cohort-level NRR and services attach for customers citing labor savings.
  - - Gross margin / CAC / NRR
    - Not disclosed publicly
    - Low
    - Without these, no public unit-economics bridge closes.
    - Provide gross margin by product line, CAC, payback, churn, and NRR.
