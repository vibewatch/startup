  topStrengths:
    - >-
      Premium positioning in a fast-growing part of the AI stack: production inference for open, custom, and hybrid
      workloads
    - >-
      Strong recent fundraising and investor roster, with IVP, CapitalG, NVIDIA, Greylock, Spark, and others backing the
      company
    - >-
      Clear developer and enterprise wedge via Truss, dedicated inference, self-hosting, and multi-cloud deployment
      controls
    - >-
      Public customer proof across healthcare, coding, voice, GTM, and productivity workloads shows relevance beyond one
      narrow vertical
    - >-
      Customer case studies repeatedly cite meaningful latency, throughput, and cost improvements versus prior inference
      setups
  topRisks:
    - >-
      Public revenue, margin, burn, concentration, and retention data remain undisclosed, forcing investors to rely on
      estimated rather than filed financials
    - >-
      Premium price positioning can be pressured by cheaper GPU clouds and by hyperscalers bundling inference with
      broader cloud relationships
    - >-
      Reliability and compliance underwriting still depends on negotiated terms, BAAs, and custom SLAs rather than
      website messaging alone
    - >-
      The jump from a $5B closed valuation to mooted $11B follow-on pricing is hard to defend without much better
      disclosure
    - >-
      Baseten appears to run a support-heavy, performance-engineering-intensive model that could be harder to scale
      cleanly than pure software narratives imply
  unresolvedGaps:
    - Audited revenue, gross margin, burn, runway, and customer-concentration data are not public
    - No public evidence resolves retention metrics such as NRR, churn, or contract duration
    - >-
      Public governance visibility is limited; the full current board, committees, and founder ownership are not
      disclosed in the fetched corpus
    - >-
      Healthcare and regulated-use underwriting still needs exact BAA, DPA, and shared-responsibility terms for
      production accounts
    - The economics and terms behind any mooted post-Series-E financing are not publicly available
