    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: benchmark-methodology
    missingEvidence: Public benchmark methodology for BDN, BEI, or broad latency/throughput claims across representative workloads.
