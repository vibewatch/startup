evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee structure, observer list, and founder ownership map.
    whyItMatters: >-
      Later-stage financing and governance risk cannot be assessed cleanly from public sources if the control map is
      incomplete.
    diligencePath: >-
      Request a current board deck, cap table summary, and governance appendix directly from management or lead
      investors.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: >-
      A company-confirmed current employee count and a definition of whether the number is global people, U.S.
      legal-entity staff, or platform employees only.
    whyItMatters: Headcount is a key chapter-one maturity metric and the available public vendor numbers conflict materially.
    diligencePath: >-
      Request the latest org snapshot or payroll-based headcount from management and reconcile it to any data-vendor
      profile used in later diligence.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: incident-history
    missingEvidence: >-
      A durable, sourceable export of historical incidents or uptime reports with severity, duration, and customer
      impact.
    whyItMatters: >-
      Independent reachability monitoring is not granular enough to judge real reliability history for a company selling
      mission-critical inference.
    diligencePath: >-
      Request Baseten historical status exports, SLA reports, or customer-facing incident summaries covering at least
      the prior 12 months.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: >-
      A third-party market study that isolates performance-sensitive inference-platform spend, or a company disclosure
      that maps Baseten revenue to a defensible serviceable market.
    whyItMatters: >-
      Without a clean denominator, SAM and SOM estimates are judgment calls, which directly affects how much weight a
      TAM-based valuation argument deserves.
    diligencePath: >-
      Request management's internal segmentation of revenue by product and customer type, then map it against a narrower
      third-party market study or customer cohort list.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership
    missingEvidence: >-
      Customer references or internal sales material that explicitly show who signs, funds, and renews Baseten
      deployments by segment.
    whyItMatters: >-
      Budget ownership determines sales-cycle length, expansion dynamics, and whether Baseten is competing for
      application spend or central platform budget.
    diligencePath: >-
      Ask for anonymized deal summaries, procurement checklists, or customer reference calls across startup, enterprise,
      and regulated-healthcare accounts.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Product-level revenue mix, support attachment, gross margin by deployment mode, and actual realized discounts
      versus public rate cards.
    whyItMatters: >-
      Public price sheets and case studies show value, but not whether Baseten captures enough gross margin to defend a
      premium specialist position against commodity GPU clouds and hyperscalers.
    diligencePath: >-
      Request cohort-level gross margin and support-cost data for Model APIs, Dedicated Inference, and enterprise
      deployments, plus a sample of negotiated pricing schedules.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Net enterprise discounts, minimum commitments, and list-to-net terms for Baseten, Modal, and hyperscaler deals.
    whyItMatters: >-
      Public pricing overstates willingness to pay and hides whether Baseten can defend premium economics in
      procurement-led deals.
    diligencePath: >-
      Request three recent MSAs or SOWs plus discount schedules for Baseten and the closest two alternatives in
      comparable deal sizes.
    relatedQuestionRefs:
      - QP009
      - QP010
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: benchmark-parity
    missingEvidence: >-
      Controlled latency and throughput benchmarks for the same models and prompt mix across Baseten, Modal, Runpod, and
      Bedrock.
    whyItMatters: Performance is Baseten's core moat claim, but public comparisons are workload-specific and marketing-heavy.
    diligencePath: Run a bake-off on one small and one large open model with identical regions, batching, and warm-start assumptions.
    relatedQuestionRefs:
      - QP013
      - QP023
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: competitive-win-loss
    missingEvidence: Named enterprise win or loss analyses against Bedrock, Vertex, Modal, and Runpod segmented by buyer type.
    whyItMatters: >-
      Distribution power and switching costs determine whether Baseten can hold premium pricing outside developer-led
      accounts.
    diligencePath: >-
      Pull the last 20 large-opportunity CRM notes and customer references, segmented by regulated enterprise versus
      startup buyers.
    relatedQuestionRefs:
      - QP020
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Monthly revenue mix across Model APIs, Dedicated Inference, Training, and services plus contribution margin by
      surface.
    whyItMatters: >-
      Without mix, investors cannot tell whether growth is predominantly scalable software usage or labor-heavy support
      revenue.
    diligencePath: Request monthly revenue and gross-margin bridge by product surface for the last 18 months.
    relatedQuestionRefs:
      - QI028
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Enterprise discount schedules, minimum commits, credits, and list-to-net realization by customer cohort.
    whyItMatters: >-
      List prices can materially overstate yield and margin in infrastructure businesses with negotiated enterprise
      contracts.
    diligencePath: Review five recent signed orders, associated discount approvals, and realized billings versus list.
    relatedQuestionRefs:
      - QI029
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-and-runway
    missingEvidence: >-
      Current cash balance, monthly burn, runway, gross margin by product line, and major cloud or GPU capacity
      obligations.
    whyItMatters: Capital adequacy and underwriting are impossible without actual liquidity and margin data.
    diligencePath: Obtain current board package, trailing six-month burn report, and product-level COGS schedule.
    relatedQuestionRefs:
      - QI030
    relatedTableRefs:
      - TI003
      - TI004
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: Top-customer concentration, cohort NRR, churn, and win/loss data against cheaper raw GPU alternatives.
    whyItMatters: Customer durability determines whether Baseten can sustain premium pricing and support-heavy GTM economics.
    diligencePath: Pull top-20 customer revenue concentration plus cohort expansion and churn by starting quarter.
    relatedQuestionRefs:
      - QI027
      - QI029
    relatedTableRefs:
      - TI003
      - TI005
  - type: stale
    severity: minor
    topic: next-round-valuation
    missingEvidence: Closed documents for any financing beyond the January 2026 Series E.
    whyItMatters: Reported $11B to $15B valuation talk is informative but not a substitute for a signed financing.
