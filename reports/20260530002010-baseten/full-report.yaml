  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Baseten typically starts with a technical buyer evaluating model performance, then expands into operational,
      security, and procurement stakeholders as the workload becomes business-critical.
    data:
      items:
        - stage: Model evaluation
          actors:
            - ML lead
            - Application engineer
            - Founder / product lead
          touchpoints:
            - Model APIs
            - Benchmarking
            - Pricing page
          emotion: Teams want to validate latency, cost, and deployability quickly.
          label: Evaluate
        - stage: Initial production deployment
          actors:
            - Platform engineer
            - MLE
            - Product engineering
          touchpoints:
            - Truss / deployment tools
            - Dedicated deployment
            - Observability
          emotion: Confidence rises when the team can ship without building infra from scratch.
          label: Deploy
        - stage: Reliability and governance
          actors:
            - Security
            - IT
            - Ops leadership
          touchpoints:
            - Single-tenant clusters
            - HIPAA / SOC 2 messaging
            - Hands-on engineering support
          emotion: The purchase broadens when control, compliance, and uptime matter.
          label: Scale safely
        - stage: Expansion / renewal
          actors:
            - Procurement
            - CIO / CTO
            - Business owner
          touchpoints:
            - Pro / Enterprise plan
            - Self-host
            - Multi-cloud or failover options
          emotion: >-
            Expansion depends on whether Baseten keeps winning on economics and support versus insourcing or rival
            infra.
          label: Expand
