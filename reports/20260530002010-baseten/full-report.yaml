        - >-
          Management-grade run-rate lands materially below $500M or growth decelerates sharply from the public
          narrative.
        - The closed $5B round falls out of the base-case band and starts looking like a late-cycle mark.
        - Downgrade the recommendation and reset valuation work to the bear-case range.
      - - Margin quality disappoints
        - Gross margin and utilization look closer to infrastructure resale economics than premium software economics.
        - Premium software multiples no longer fit the business model.
        - Apply a lower comp set and require a meaningfully better entry price.
      - - Price-performance edge erodes
        - Customers can achieve acceptable production results on cheaper alternatives or bundled hyperscaler products.
        - Baseten’s premium pricing turns from moat into adoption friction.
        - Cut conviction and revisit long-term market-share assumptions.
      - - Aggressive financing terms appear
        - A new round clears only with heavy preferences, secondary-heavy structures, or unusual protections.
        - Headline valuation stops mapping cleanly to common-equity upside.
        - Treat the mark as structurally weaker and rework return expectations.
      - - Concentration emerges
        - A handful of AI-native accounts drive an outsized share of revenue without corresponding retention evidence.
        - The company’s revenue quality and durability become much less attractive than the headline growth rate.
        - Pause any high-conviction call until concentration and expansion data are clarified.
    notes: >-
      These triggers are designed to be monitorable and directly tied to valuation support, not generic operating
      caution.
