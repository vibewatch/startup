      - number: '1.2'
        title: Funding, Stage, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Baseten’s capital history is now the clearest external signal that the company has graduated into
              late-stage AI infrastructure. The fetched corpus supports a progression from a modestly funded early
              company to a Series E business: the Series A post says Baseten had raised a little over $20 million across
              seed and Series A; the Series B announcement adds $40 million; the Series C announcement adds $75 million;
              Series D adds $150 million; and Series E adds another $300 million at a $5 billion valuation. Independent
              market-data sources corroborate the timing of those rounds and place the September 2025 Series D valuation
              at about $2.15 billion, showing just how quickly the company repriced upward before the January 2026
              round. The investor roster has also deepened rather than churned. Greylock and South Park Commons appear
              early, IVP and Spark become visible at growth stage, and later rounds add BOND, CapitalG, Conviction, 01A,
              BoxGroup, and NVIDIA. That pattern matters because it suggests both repeated insider support and a
              widening set of AI-specialist and platform investors. At the same time, public disclosure still stops well
              short of a full cap-table view: the fetched corpus does not expose current ownership percentages, investor
              control rights, liquidation preferences, or a fully reliable board-observer map.
