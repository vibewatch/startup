      - CV043
      - CV044
      - CV045
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Baseten scores well on market tailwind and product differentiation, but much lower on disclosure quality and
      margin certainty.
    data:
      items:
        - label: Market tailwind
          value: 8
          unit: /10
          detail: Inference and enterprise AI markets are large and still compounding.
        - label: Product differentiation
          value: 7
          unit: /10
          detail: Hybrid deployment, support, and performance tooling can justify a premium.
        - label: Revenue visibility
          value: 5
          unit: /10
          detail: The best public run-rate is still a third-party estimate rather than primary disclosure.
        - label: Margin quality
          value: 4
          unit: /10
          detail: Public evidence does not yet prove software-like economics.
        - label: Comp support at $5B
          value: 6
          unit: /10
          detail: The closed round fits the base case if the revenue estimate is broadly right.
        - label: Comp support at $11B
          value: 3
          unit: /10
          detail: A step-up needs materially stronger evidence and cleaner terms.
        - label: Evidence quality
          value: 4
          unit: /10
          detail: Enough exists for a range view, but not enough for a buy call.
    approximationNotes: Scores are directional IC-style judgments based only on retained public evidence as of the run date.
    claimRefs:
      - CV025
      - CV030
      - CV031
      - CV040
      - CV041
      - CV042
      - CV046
