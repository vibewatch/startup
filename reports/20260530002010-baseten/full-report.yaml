            body: >-
              Baseten now spans most of the modern AI deployment workflow rather than a single hosting SKU. At the
              lightest-weight end, Model APIs let teams swap an OpenAI or Anthropic base URL and call shared
              frontier/open models immediately, which is useful for prototyping or for products that do not need
              dedicated GPUs. At the heavier-weight end, Truss packages a custom or open-source model into a
              reproducible deployment artifact, while Dedicated Inference adds tenant-isolated capacity, custom scaling,
              and support for stricter latency or compliance needs. Chains sits above single-model inference for
              multi-step RAG, transcription, or multimodal flows, Frontier Gateway adds branded URLs plus
              billing/rate-limit controls for model labs monetizing their own APIs, and Baseten Training/Loops try to
              close the loop from checkpoint creation to production serving. In customer workflow terms, the company is
