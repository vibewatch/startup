      - number: '5.2'
        title: Deployment Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The clearest technical differentiator in Baseten's public corpus is that it explains the deployment path
              with more specificity than many AI-infrastructure startups. Truss abstracts packaging, dependencies, and
              GPU configuration; Baseten's build step then validates and uploads the package, compiles supported LLMs
              with TensorRT-LLM when the engine path is selected, and deploys the resulting container behind a dedicated
              model subdomain. The MCM control plane sits underneath both training and inference, abstracting
              cloud-provider differences and rerouting capacity across regions or providers when needed. Request routing
              resolves environment names from URL paths, environments preserve stable endpoints as deployments are
              promoted, and async requests enter a queue that protects real-time traffic from background work. BDN
              addresses the cold-start bottleneck by mirroring and caching large model weights at multiple layers so new
              replicas are less dependent on external storage. The result is an inference-first architecture with
              explicit build, routing, autoscaling, and weight-delivery primitives.
