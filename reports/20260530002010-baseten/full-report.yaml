      - number: '7.3'
        title: >-
          Dependency and commercial-model risk comes from upstream capacity, vendor chain complexity, and premium
          pricing
        blocks:
          - type: paragraph
            body: >
              Baseten's core strategic answer to infrastructure risk is multi-cloud capacity management, cross-cloud

              autoscaling, single-tenant options, and the ability to run in the customer's cloud. Those are meaningful

              mitigations, but they do not eliminate dependence on cloud partners, GPU availability, and a long tail of

              third-party services. Nudge Security's public profile lists AWS, Vercel, Statuspage, SendGrid, Stripe,

              Segment, Sentry, GitBook, and other vendors in Baseten's visible supply chain. Baseten's own product pages

              further promise access to the latest-generation GPUs, elastic capacity, and priority compute. That means

              upstream capacity and pricing remain foundational dependencies whether the platform presents them as a

              single managed surface or not.


              The commercial risk is that Baseten appears expensive relative to public peers. HostFleet's April 2026

              matrix shows Baseten priced above Runpod, Modal, and Fal.ai on multiple GPU classes, while Runpod's 2026

              comparison gives Baseten premium pricing and slower cold-start ranges than some alternatives. Baseten may

              still justify that premium through enterprise controls, support, and performance tuning, but if customers

              can reproduce acceptable latency and uptime on materially cheaper infrastructure, margin and win-rate risk

              rise quickly. This is why price-performance and supplier concentration belong alongside classic
              vendor-risk

              questions.
