      - number: '2.2'
        title: Multiple Sizing Lenses and Why They Do Not Collapse into One TAM
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is directionally strong but category boundaries remain messy. Technavio's narrower
              AI inference-as-a-service category is already a large market at USD 85.25 billion in 2025 and is forecast
              to grow 22.1% annually through 2030. Fortune Business Insights uses a broader AI inference lens and puts
              the category at USD 117.80 billion in 2026, while Mordor Intelligence sizes the adjacent enterprise AI
              market at USD 114.87 billion in 2026 and shows that software or platform layers and cloud deployment
              dominate spending. Those numbers should not be added together, because they partially overlap and use
              different definitions, but they do triangulate the same conclusion: Baseten is not pursuing a niche budget
              line. The useful valuation discipline is to keep moving down the stack from broad AI platform spend to the
              narrower production-inference wedge where Baseten actually competes. That narrower wedge is cloud-first,
              platform-heavy, North-America-concentrated, and already large enough that Baseten does not need heroic
              market-share assumptions to justify a meaningful opportunity. What public data does not provide is a clean
              Baseten-specific SAM or SOM.
