  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, History, and Leadership
        blocks:
          - type: paragraph
            body: >-
              Baseten is easiest to understand as a founder-led inference infrastructure company rather than a generic
              MLOps toolkit. Its own history traces the origin back to late 2019, when the four founders started the
              company to solve model-deployment pain they had experienced firsthand. Current legal pages anchor the
              business as Baseten Labs, Inc. in San Francisco, while the homepage, enterprise, and pricing surfaces
              consistently frame the product around high-performance inference, managed APIs, and training or deployment
              workflows rather than broad horizontal software. That identity matters for the rest of the report: Baseten
              is positioning itself as the software layer that runs production AI workloads across its own cloud or a
              customer’s environment, with compliance and data-control features aimed at more sensitive workloads.
              Leadership continuity is also unusually visible for a late-stage private company. Tuhin Srivastava is
              publicly surfaced as CEO and co-founder, Amir Haghighat as CTO and co-founder, and author pages still
              identify Pankaj Gupta and Phil Howes as co-founders. The Series E post is signed by all four founders,
              reinforcing that the company still presents a founder-centric leadership story. The caveat is governance
              transparency: the public corpus clearly shows one board addition in 2025, but it does not provide a full
              current board roster, committee structure, or founder ownership map.
