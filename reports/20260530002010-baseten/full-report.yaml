  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The current call stays at track because strong category and product signals are offset by revenue-opacity and
      valuation-step-up risk.
    data:
      nodes:
        - id: market
          label: Inference demand is large and growing quickly
        - id: anchor
          label: Closed $5B Series E is real and recent
        - id: estimate
          label: Public revenue support is helpful but still third-party-estimated
        - id: competition
          label: Premium pricing faces direct and bundled competition
        - id: terms
          label: Terms, margin, and concentration are still private
        - id: call
          label: 'Call: track, with stretched valuation stance'
      edges:
        - from: market
          to: call
          label: supports engagement
        - from: anchor
          to: call
          label: provides a clean entry mark
        - from: estimate
          to: call
          label: caps confidence
        - from: competition
          to: call
          label: limits multiple expansion
        - from: terms
          to: call
          label: requires diligence before buy
    approximationNotes: This is a reasoning map, not a weighted scoring model.
