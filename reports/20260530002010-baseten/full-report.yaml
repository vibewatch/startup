      - number: '8.2'
        title: The price is only defensible if revenue quality is real and premium pricing survives competition
        blocks:
          - type: paragraph
            body: >-
              The bull case starts with speed and timing. Baseten’s financing path moved from a $75 million Series C in
              February 2025 to a $150 million Series D at $2.15 billion in September 2025 and then to a $5 billion
              Series E in January 2026. Sacra’s estimate of $600 million in annualized revenue and Baseten’s own 100x
              inference-volume claim are directionally consistent with a company that hit a steep adoption curve just as
              inference moved from prototype infrastructure into production infrastructure. Public market and private
              comp work then gives that growth some context: Modal’s May 2026 round was struck at about 15.5x annualized
              revenue, Fireworks’ closed valuation works out near 12.7x, and MongoDB-like public infrastructure
              treatment is still around 10x.


              The anti-thesis is just as important. Baseten’s pricing page, HostFleet’s matrix, and Runpod’s comparison
              all point to a premium-priced service layer rather than a commodity endpoint vendor. That can be a
              strength if the premium buys uptime, support, compliance, and hybrid flexibility. It can also cap the
              multiple if the business is more support-heavy and lower-margin than premium public software names.
              Hyperscalers make the downside sharper: AWS, Google, and Azure can bundle model access, compute,
              governance, and credits inside broader cloud relationships. In other words, Baseten may deserve a premium
              to raw AI cloud, but it has not yet earned the disclosure quality that would let investors pay
              Cloudflare-like or Datadog-like premiums with confidence.
