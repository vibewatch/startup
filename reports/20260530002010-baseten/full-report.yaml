      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Baseten's go-to-market is best understood as land-with-usage, then expand through reliability, support,
              and deployment control. The Basic plan and public Model APIs create a low-friction developer entry point,
              but the monetization narrative shifts quickly toward Pro and Enterprise features such as dedicated
              compute, higher rate limits, hands-on engineering, self-hosting, and cloud-commitment portability. That
              packaging suggests Baseten is not trying to win a commodity self-serve race alone; it is trying to become
              the production-inference layer for teams that care about latency, uptime, and control enough to pay for
              operational help.


              Because Baseten is private, CAC, payback, enterprise sales cycle length, and NRR are unavailable. The best
              public substitutes are customer case studies. Writer credits Baseten with lower cost per million tokens
              and higher throughput on 70B-class models. OpenEvidence emphasizes flexible access to compute without
              multi-year reservations plus large deployment and maintenance-time gains. Speechify reports that it could
              retire a large self-managed GPU estate while cutting cost per million characters. Superhuman and Patreon
              frame the value proposition as saving scarce engineering time while materially improving latency or
              lowering GPU cost. Those are not audited financials, but they are directionally consistent with a GTM
              motion that sells time-to-production and lower total operating cost rather than just list-price compute.


              The evidence therefore supports a plausible expansion engine, but only in proxy form. The buyer logic is
              visible; the sales-efficiency math is not. Without internal conversion, retention, and sales-spend data,
              Baseten's GTM efficiency cannot be underwritten with confidence.
