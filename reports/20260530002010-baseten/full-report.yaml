      - number: '1.3'
        title: Product Scope, Scale Proof, and Milestones
        blocks:
          - type: paragraph
            body: >-
              The product and scale story is strong enough to explain why Baseten could raise three times in roughly a
              year, but it still needs to be read with some caution. Official materials now tie the company to a broad
              inference platform narrative: cloud and self-hosted deployment options, enterprise controls, model APIs,
              and pay-as-you-go compute pricing. The strongest external proof comes from customer and partner evidence.
              NVIDIA’s case study says Baseten cut cold starts to 5–10 seconds from up to five minutes and doubled one
              customer’s inference performance with TensorRT-LLM. Customer case studies claim that OpenEvidence runs
              billions of requests per week on Baseten, Gamma serves roughly 3 million images per day for 70+ million
              users, Speechify cut cost per million characters by 44%, and Patreon cut GPU cost by 70%. Those numbers
              support the idea that Baseten is serving meaningful production workloads across healthcare, productivity,
              creator, and GTM software. Still, chapter-one diligence should preserve three caution flags. Public
              headcount is inconsistent across data vendors, governance detail remains thin outside financing
              announcements, and independent reachability monitoring does not provide enough incident detail to fully
              evaluate reliability history. So the right takeaway is not that Baseten lacks scale; it is that the
              business looks operationally significant while remaining unusually private relative to its valuation.
