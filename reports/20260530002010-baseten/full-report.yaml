          high: 7.8
          unit: USD bn
        - label: Bull case
          low: 8.4
          mid: 11.4
          high: 14.4
          unit: USD bn
        - label: Closed Series E
          low: 5
          mid: 5
          high: 5
          unit: USD bn
        - label: Rumored follow-on
          low: 11
          mid: 11
          high: 11
          unit: USD bn
