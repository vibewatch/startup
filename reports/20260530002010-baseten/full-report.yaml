  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Baseten is best understood as a production inference platform, not a general-purpose cloud or a model lab.
              The included spend is the layer required to package, deploy, run, monitor, meter, and secure AI workloads
              after a team already has a model or a model endpoint in mind: model APIs, dedicated deployments,
              compound-AI orchestration, observability, billing, and the support needed to keep latency and uptime
              inside production targets. The market boundary is narrower than the full enterprise-AI stack because
              Baseten does not market data lakes, BI, generic application development, or broad agent productivity
              suites as the center of its value proposition. It is also narrower than frontier-model R&D because Baseten
              helps teams operationalize models rather than invent them. The closest substitutes are hyperscaler AI
              platforms, internal GPU infrastructure, and specialist GPU clouds such as Modal, Replicate, and Runpod.
              Baseten's adjacencies sit one step above and below the core deployment layer: training that promotes
              directly into inference, and model-lab monetization through white-labeled APIs.
            claimRefs:
              - CM001
              - CM002
              - CM003
