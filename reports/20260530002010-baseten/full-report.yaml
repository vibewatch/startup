      - number: '4.3'
        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Baseten's public materials point to an asset-light but not necessarily low-price cost structure. Sacra
              describes the company as aggregating capacity across more than 15 cloud providers rather than owning GPU
              infrastructure outright, which should keep fixed asset intensity below a provider that buys and finances
              GPU fleets directly. Official materials reinforce the same model from another angle: Baseten talks
              constantly about multi-cloud capacity management, cross-cloud autoscaling, scale-to-zero, and running in
              the customer's cloud when needed. In principle, that should let the business flex supply and match cost to
              workload shape more tightly than a dedicated owned-fleet operator.


              But asset-light does not mean cheap. HostFleet's April 2026 serverless GPU matrix shows Baseten priced
              above Runpod on every shared SKU listed and above Modal on the shared L4 and H100 rows, while only
              Replicate's A100 custom deployment price sits higher among the overlapping A100 rows shown. That is the
              clearest adverse signal in the public record: Baseten sells a premium managed layer over raw compute. The
              company's rebuttal, effectively, is its own performance narrative. Dedicated Inference claims 6x better
              GPU utilization and 5-10x lower costs on optimized runtimes; Model APIs claim 5-10x lower spend versus
              closed alternatives; customer studies report lower per-unit cost, fewer engineers, or both. Those claims
              are consistent with a thesis that Baseten expands gross margin through utilization and support attachment,
              but public data still stops short of a gross-margin proof.


              That leaves unit economics in proxy territory. We can see the billing unit. We can see that some customers
              say total cost fell. We can see that list pricing is premium to raw GPU clouds. What we cannot see is the
              realized balance between cloud pass-through, support labor, negotiated discounts, and retention.
