      - number: '8.4'
        title: The thesis should be gated by terms, margin evidence, and concentration—not by enthusiasm alone
        blocks:
          - type: paragraph
            body: >-
              The final call hinges on a small number of diligence items that can move valuation quickly. First,
              investors need management-grade revenue evidence. If the company is truly around a $600 million annualized
              run-rate with strong expansion and acceptable concentration, the closed $5 billion round starts to look
              reasonable and the next mark becomes debatable rather than fanciful. If the real number is materially
              lower, the same pricing and comp work flips from “defensible premium” to “overextended late-stage mark.”
              Second, investors need direct margin data. Fireworks’ roughly 50% gross margin is a useful peer reminder
              that inference businesses are not pure software. Baseten’s premium pricing only deserves a premium
              multiple if utilization, support load, and reserved-capacity economics produce better margin quality than
              that analogy implies.


              Third, investors need the terms underneath the headline price. Preference overhang, secondaries, and
              customer concentration can matter more than the post-money headline. This is why the right kill triggers
              are practical rather than rhetorical: if Baseten cannot preserve premium price-performance with acceptable
              margin, if growth slips below the base-case band, or if any new round clears only with aggressive terms,
              the thesis should be downgraded quickly. Until those questions are closed, the company deserves active
              tracking and structured diligence rather than a high-conviction price-insensitive buy decision.
