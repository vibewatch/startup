  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public pricing
        blocks:
          - type: paragraph
            body: >-
              Baseten's public financial story starts with a straightforward revenue design: the company charges for
              production inference and adjacent infrastructure usage, not for seats. The pricing page exposes three
              commercial surfaces—dedicated deployments, Model APIs, and Training—and wraps them in a Basic self-serve
              tier plus quote-based Pro and Enterprise packaging. Model APIs are priced per million tokens, dedicated
              deployments are billed for compute used down to the minute, and Training is sold as both managed Training
              Jobs and the newer Loops workflow that feeds checkpoints straight into inference. That is a coherent
              production-infrastructure monetization model, and the billing-usage API reinforces it by splitting spend
              across dedicated inference, training, and Model APIs with daily breakdowns and credits used.


              The nuance is that list pricing is only the outer shell of the model. Public materials show that the real
              commercial wedge sits in premium support, priority compute, self-host deployment, use of existing cloud
              commitments, custom SLAs, and advanced security or governance. Those features imply Baseten is trying to
              monetize both usage and a higher-touch enterprise motion. The Terms also make the customer Order the
              binding commercial instrument, which means realized pricing can diverge materially from the public price
              page once support, discounts, and minimum commitments enter the deal. That is important for revenue
              recognition and yield analysis because public list prices are observable, but list-to-net economics are
              not.


              The result is a credible revenue architecture with decent public visibility into billing units and weak
              visibility into realized revenue quality. Public evidence can show how Baseten intends to charge; it
              cannot show revenue mix, attach rates for services, or what customers actually pay after enterprise
              negotiation.
