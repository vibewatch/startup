callouts:
- calloutType: risk
  title: Reuters vs. GetLatka ARR variance is the single most material public-data ambiguity
  body: >-
    Reuters' August 2024 advisor-sourced ~US$150M ARR figure and GetLatka's database-estimated US$243M are not reconcilable
    from public sources. The most plausible explanation is different revenue-definition scopes (subscription ARR vs total
    revenue), but the company has not reconciled the two. This ambiguity caps confidence on the headline scale metric and
    is the highest-priority diligence ask in any management presentation.
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI021
- calloutType: risk
  title: The two-year-plus open sale process is itself the most informative financing-dependency signal
  body: >-
    Reuters disclosed the Evercore-led sale process in August 2024 at a ~$1B target. Eight quarters later (June 2026) there
    is no public deal closure. The continued cadence of product (Atlas AI Operatives, May 2026) and leadership (Foster CEO,
    March 2026) milestones suggests management is repositioning for a higher clearing price or a public-markets path. The
    signal is mixed: either ARR has scaled to support a higher multiple, or seller / buyer expectations have not yet aligned
    at any price.
  claimRefs:
  - CI016
  - CI017
  - CI025
  - CI029
  - CI033
  - CI034
- calloutType: insight
  title: The Reuters-implied 7x ARR multiple is within scaled-MDR comparable range
  body: >-
    Public-data triangulation places 2024-2026 scaled-cybersecurity-SaaS revenue multiples at 5-10x for growth-stage MDR and
    8-15x for platform-bundled cyber leaders. Reuters' implied 7x for eSentire is therefore reasonable for a scaled but services-heavier
    specialist — neither a discount nor a premium. New investors price decisions should anchor on the 7x figure as the realistic-case
    anchor for any 2026-2028 monetization path.
  claimRefs:
  - CI016
  - CI018
  - CI029
  - CI035
  - CI036
