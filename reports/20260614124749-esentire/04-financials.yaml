- id: public-gaps-and-financial-verdict
  title: Public Financial Gaps and Revenue-Quality Verdict
  body: >-
    Material public financial gaps remain. eSentire publishes no audited or summary financial statements, no profitability
    metric, no working-capital or capex disclosure, and no separate channel-revenue or IR-retainer disclosure. The Reuters-GetLatka
    ARR variance (US$150M vs US$243M) most plausibly reflects different revenue-definition scopes — Reuters likely citing
    pure subscription ARR, GetLatka likely citing total revenue including IR / professional services / channel pass-through
    — but the company has not reconciled the two. The implied blended ARPA of ~US$75,000 (US$150M ÷ 2,000+ customers) is well
    below the Vendr-reported median mid-market contract (~US$120,800), suggesting a long tail of smaller accounts. BankInfoSecurity
    (August 2024) frames the sale process as evidence of margin / scale pressure on scaled MDR specialists in the face of
    platform-bundling. The revenue-quality verdict is: subscription-MDR base is high-quality and scaled, with credible Forrester
    Wave / Frost Radar recognition as proxy; but headline margin path, NRR, and S&M efficiency remain undisclosed and the
    open sale process is itself the most informative single financing-dependency signal.
