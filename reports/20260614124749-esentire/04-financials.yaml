- id: capital-structure-and-sale-process
  title: Capital Structure, Funding Chronology, and the Open Sale Process
  body: >-
    Across rounds Series A through Series E, eSentire has raised approximately US$358 million in venture / growth equity.
    The Series E in February 2022 was US$325 million led by Georgian and CDPQ, with Warburg Pincus participating, and is publicly
    reported as approximately US$100 million primary plus approximately US$225 million secondary, conferring a US$1.1 billion
    post-money valuation. Warburg Pincus has been the controlling shareholder since 2017 and led the 2019 Series D (US$100M);
    Georgian, CDPQ, Cisco Investments, and Edison Partners round out the cap table.


    The most material financing-dependency datapoint is the August 2024 Reuters disclosure of an Evercore-led ~US$1 billion
    sale exploration at greater than 7x approximately US$150 million ARR. As of June 2026, the process has been open for approximately
    eight quarters without publicly disclosed closure. The combination of (a) two-year-plus open sale process, (b) recent
    product launches (Atlas AI Operatives, May 2026), and (c) ZeroFox-experienced CEO appointment (Foster, March 2026) suggests
    price-expectations misalignment between owners and prospective buyers, with management positioning the asset for either
    a higher clearing price or a public-markets path within 18-36 months. The capital-adequacy table summarizes the funding
    chronology and the open-process status.
  claimRefs:
