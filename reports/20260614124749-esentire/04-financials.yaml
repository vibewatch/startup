- id: unit-economics-and-gtm
  title: Unit Economics, GTM Motion, and Channel Investment
  body: >-
    Unit-economics for scaled MDR specialists are dominated by SOC-analyst labor cost, platform R&D, and customer-acquisition
    cost. Industry-benchmark gross margins for services-heavy MDR providers run 55-65% blended versus pure-SaaS platform comparables
    at 75-85%, implying eSentire sits at the lower end of the security-platform comparable set. S&M-to-ARR benchmarks for
    scaled MDR run 35-45% with 18-24-month CAC payback; NRR benchmarks run 110-125%. eSentire's specific values are not disclosed
    and remain a key diligence gap. Go-to-market combines direct enterprise sales, MSP / MSSP channel via Atlas Nexus, and
    cloud marketplaces (AWS). The CEO transition to James C. Foster (March 19, 2026, ex-ZeroFox) explicitly emphasizes channel
    expansion as a growth lever for 2026-2028, and the implied financial mandate is to scale either to a $1B+ sale clearing
    price or to a public-markets path within 18-36 months. The unit-economics table captures the benchmark-vs-disclosed gap.
  claimRefs:
