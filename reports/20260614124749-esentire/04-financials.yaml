company:
  name: eSentire
chapter:
  number: 4
  title: Financials
  summary: >-
    eSentire's revenue is dominated by recurring subscription MDR sold per-asset across three tiers (Essentials, Advanced,
    Complete), with ~US$150M ARR per Reuters (Aug 2024) and a conflicting US$243M database estimate. Series E (Feb 2022) raised
    US$325M at a US$1.1B post-money; total raised across rounds is ~US$358M. The Evercore-led ~US$1B sale exploration disclosed
    in August 2024 remains open eight quarters later, with management repositioning for a higher clearing price or public-markets
    path under new CEO James C. Foster (March 2026). Unit-economics and capital-structure detail are not publicly disclosed
    and are the highest-priority diligence asks.
sections:
- id: revenue-streams-and-pricing
  title: Revenue Streams, Pricing, and Realized Contract Economics
  body: >-
    eSentire's revenue is dominated by recurring subscription MDR sold on a per-asset basis (endpoints, servers, cloud workloads,
    and identity assets) under three packaged tiers — Essentials, Advanced, and Complete. The Complete tier adds full identity
    threat detection, cloud workload coverage, and active threat suppression. Incident response retainer hours, threat intelligence,
    and channel partner revenue via the Atlas Nexus Network (launched March 2025) are material but smaller streams. Vendr
    2026 marketplace data places median annual mid-market contract spend at approximately US$120,800, with a per-endpoint
    band of US$8-40 per month depending on tier and asset class. Cipher's Security's 2026 SOC-as-a-service price comparison
    frames eSentire as positioned at the premium end of the per-endpoint spectrum, consistent with the services-heavy mix
    and the active-containment value proposition. The revenue-streams and pricing tables formalize the breakout and the realized-vs-list
    comparison.
  claimRefs:
