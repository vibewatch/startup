- id: buyers-segments-pricing
  title: Buyers, Segments, and Pricing
  body: >-
    MDR's addressable customer is bracketed at the bottom by the mid-market threshold below which a serious 24/7 SOC requirement
    is uneconomic (~250 employees in regulated industries; ~750 in lightly regulated) and at the top by the Fortune 100 enterprises
    whose security budgets can carry an in-house SOC. The vertical mix is heavily skewed toward regulated industries — financial
    services (banks, hedge funds, asset managers), healthcare, legal, insurance, and government — with eSentire's reported
    customer base reflecting this concentration. Purchase authority typically sits with the CISO; budget owners shift from
    CIO in mid-market accounts to Chief Risk Officer or Audit Committee in highly regulated enterprises.


    Per-endpoint MDR pricing in 2026 typically falls in a US$10-25/month range for endpoints with 40-80% premiums on servers,
    cloud workloads, and identity assets. Median annual contract spend in the mid-market is approximately US$120,800, ranging
    from ~US$37,500 for the smallest deployments to over US$230,000 for larger ones. The pricing premium versus basic MSSP
    log-monitoring (US$3-9/endpoint/month) is the price tag on hands-on response and remediation, which is the definitional
    differentiator. The buyer/segment map and the pricing column in the market-definition table are the chapter's quantitative
    footprint of that buyer pool.
  claimRefs:
