chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The global Managed Detection and Response (MDR) services market is approximately US$4.2 billion (services-only, 2025)
    with consensus 17-23% CAGR through 2030 — Mordor Intelligence cites 21.95% — making it one of the fastest-growing cybersecurity-services
    segments. eSentire, with a reported ~US$150M ARR (Reuters Aug 2024), holds ~3.5% of the services-only TAM, leaving meaningful
    runway against demand drivers (EU NIS2 enforcement, AI-enabled attacker tooling, persistent SOC-analyst talent shortage)
    while facing real commoditization pressure from EDR-platform bundling (CrowdStrike Falcon Complete, Microsoft Defender
    XDR) and 2024-2026 consolidation dynamics evidenced by the Evercore-led sale exploration.
sections:
- id: market-definition-and-boundary
  title: Market Definition and Boundary
  body: >-
    The Managed Detection and Response (MDR) services market is the analyst-recognized category for 24/7 outsourced threat
    monitoring, detection, investigation, and response delivered as a subscription service combining technology and human
    expertise. Gartner's 2025 MDR Market Guide is the most widely cited definitional anchor: MDR is distinct from pure-play
    SIEM, SOAR, or EDR product sales and is distinct from traditional MSSP log-monitoring services that lack a response mandate.
    eSentire competes squarely inside this boundary as a vendor-agnostic, AI-driven, human-led MDR provider that integrates
    with third-party EDR, SIEM, and cloud-detection tools rather than locking buyers into a proprietary endpoint product.
    The boundary is fluid in two directions: technology-bundled XDR offerings (CrowdStrike Falcon Complete, SentinelOne Vigilance,
    Microsoft Defender XDR) increasingly compete for the same buyer dollar from the platform side, while specialist SOC-as-a-service
    offerings encroach from below.


    By 2026, ITDR (Identity Threat Detection and Response) is treated as in-scope for MDR rather than a separate category
    — eSentire's May 2026 Atlas AI Operatives release explicitly extends identity-signal coverage. Adjacent categories that
    substitute or complement MDR include SIEM (data plane), SOAR (orchestration), EDR/XDR (endpoint signal), cloud-native
    detection (CSPM/CWPP), and pure-play incident-response retainers. The market-definition table in this chapter lays out
    included spend, excluded spend, and substitute categories explicitly so that downstream sizing (TAM/SAM/SOM) is methodologically
    defensible.
  claimRefs:
  - CM001
  - CM002
  - CM015
  - CM016
  - CM022
