- id: market-sizing-and-forecast
  title: Market Sizing, Forecast, and Conflicting Estimates
  body: >-
    Published MDR market estimates for 2025-2026 fall into a wide US$4.2 billion to US$11.2 billion range. The variance is
    methodological rather than directional: services-only definitions (Mordor Intelligence, parts of Precedence) converge
    near US$4.2B for 2025; broader definitions that include MDR-adjacent technology spend (parts of TBRC, Research and Markets)
    reach US$11.2B for 2026. Mordor Intelligence's 21.95% CAGR through 2030 is the most-cited forward growth anchor; the consensus
    CAGR range across analyst houses spans roughly 17-23%, putting MDR among the fastest-growing cybersecurity-services segments.
    Long-run forecasts reach approximately US$8.6 billion by 2030 (services-only) and US$13.9 billion by 2035 under broader-scope
    definitions.


    For eSentire, the relevant addressable share (SAM) is the global services-only MDR opportunity for enterprise-and-mid-market
    buyers outside heavily restricted geographies — an estimated US$3-4 billion in 2026 — minus the share already captured
    by EDR-bundled incumbents who compete on platform rather than specialist depth. On Reuters' US$150M ARR figure, eSentire's
    2025 share of the services-only MDR market is approximately 3.5%; on the higher US$243M GetLatka figure, share is approximately
    5.7%. Both are large enough to confirm market relevance and small enough to leave meaningful runway. The sizing-lens table
    preserves the methodological detail, and the range chart shows the low/base/high envelope on one consistent unit (US$
    billions, services-only).
