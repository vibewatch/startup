      - number: '5.3'
        title: 威胁研究（TRU）、信任与合规
        blocks:
          - type: paragraph
            body: >-
              Threat Response Unit（TRU）是 eSentire 内部威胁研究和检测内容开发团队，围绕 MITRE ATT&CK 框架生成自定义检测规则和 IoC feeds。公开 TRU 产出包括
              2025 年网络犯罪报告和 2026 年威胁报告，遥测亮点包括账户攻陷尝试同比激增 389%，以及受保护客户中成功 BEC 事件下降 21%。eSentire 持有 SOC 2 Type II、ISO
              27001、ISO 27018、PCI DSS、HIPAA-aligned 和 Cloud Security Alliance STAR 认证；截至 2026 年 6 月，FedRAMP
              授权未获公开确认。信任质量合规表逐项列出认证和信任中心披露。


              中期看，TRU 的检测内容能力是可防守护城河，但 2026-2028 年会面对 LLM 辅助规则编写和共享开源检测库带来的商品化风险。到 2026 年，TRU 的检测内容开发已部分自动化（LLM
              辅助规则合成），使 eSentire 跟上行业商品化趋势，同时依靠专有遥测保留差异化。
