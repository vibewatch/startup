      - number: '1.4'
        title: 快照指标、规模与证据缺口
        blocks:
          - type: paragraph
            body: >-
              eSentire 的封面指标可以清楚分成证据充分和部分披露 / 未披露两类。估值锚来自 Reuters 报道的约 US$1B 出售流程目标，以及最初 Series E 的独角兽标记。累计融资（约
              US$358M）、成立年份（2001）、总部（Waterloo, Ontario）、客户数量（80 多个国家 2,000 多家）、旗舰产品（Atlas AI-driven Security Operations
              Platform，含 2026 年 5 月 Atlas AI Operatives 版本）都可由一手或高声誉来源支持。相反，公司当前年度经常性收入只通过间接渠道披露，不同来源差异很大：Reuters 2024
              年出售流程披露引用约 US$150M，第三方数据库 GetLatka 则报告 2024 年为 US$243M。两组数字均在此记录；本章把 Reuters 作为主要锚，把 GetLatka 作为冲突估计。


              员工数同样不完整。公司在 Series E 后曾公开设定 1,000+ 员工目标，但独立数据库显示其 2025–2026 年员工约 589 人，说明最初招聘计划可能在 2022 年后网络安全预算压缩期被缩减，之后
              ARR 增长更多来自人均产出，而不是席位扩张。截至 2026 年 6 月，监管文件或主流媒体未披露可归因于 eSentire
              的客户影响型宕机、数据泄露相关事件或重大诉讼；但没有证据并不等于没有风险，本章证据缺口登记表把它标为机密客户访谈的尽调路径。


              尚未覆盖的重要里程碑包括分析师认可（Forrester Wave 欧洲 2025 Q3 领导者、Forrester Wave 全球 2025 Q1 强劲表现者、2025 Frost Radar 领导者）以及
              2025 年 3 月推出 Atlas Nexus Network 伙伴计划。合在一起，它们确认公司在开放出售流程期间仍保持 go-to-market 动能；里程碑表是本章的权威时间线。
