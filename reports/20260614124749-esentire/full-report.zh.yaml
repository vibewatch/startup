  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险清单
        blocks:
          - type: paragraph
            body: >-
              eSentire 总部在加拿大，作为 MDR 处理方受 PIPEDA 约束，必须履行强制泄露通知和合理安全义务，并由加拿大隐私专员办公室（OPC）执行；2024-2026 年，OPC 执法强度上升，更严格的
              PIPEDA 改革提案也已释放信号。SEC Item 1.05 网络事件披露规则，间接提高了 SEC 注册客户对 eSentire 这类托管安全供应商的问责压力。CCCS Cloud Service
              Provider IT Security Assessment Program 决定加拿大联邦云供应商资格；截至 2026 年 6 月，eSentire 的 FedRAMP 授权未获公开确认，限制了美国联邦民用
              / DoD 可触达市场。截至 2026 年 6 月，在 CanLII / Federal Court 记录中找不到针对 eSentire
              的重大公开集体诉讼、监管执行令或重大诉讼；法律风险清单主要是潜在暴露，而非进行中的事项。ISED Canada 对本土网络安全冠军的联邦产业政策姿态略偏支持。
