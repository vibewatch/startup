              US$75,000（US$150M ÷ 2,000+ 客户），明显低于 Vendr 报道的中端市场合同中位数（约 US$120,800），说明存在长尾小账户。BankInfoSecurity（2024 年 8
              月）把出售流程解读为：面对平台捆绑，规模化 MDR 专业厂商承受利润率 / 规模压力。收入质量结论是：订阅 MDR 基础质量高且具规模，Forrester Wave / Frost Radar
              认可是可信代理指标；但头部利润率路径、NRR 和 S&M 效率仍未披露，开放出售流程本身就是信息量最大的单一融资依赖信号。
