      - number: '3.2'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              核心能力上，MDR 厂商都趋向 24/7 SOC、威胁狩猎、IR 支持和多信号覆盖（端点 + 网络 + 云 + 身份）；差异集中在响应权限（主动遏制 vs 建议动作）、IR retainer
              小时打包、身份信号深度以及渠道 / 伙伴赋能。eSentire 的「威胁压制保证」和主动遏制权限，使其区别于 Red Canary 等偏检测的同行；Arctic Wolf 和 ReliaQuest 在集成广度和
              concierge 支持上领先，CrowdStrike Falcon Complete 则在 Falcon 栈内部自动化深度上领先。Microsoft Defender XDR 是最重要的平台捆绑威胁，因为它随
              Microsoft 365 E5 免费提供，显著降低 Microsoft 栈买方采用平台捆绑 MDR 的边际成本，并给任何 Microsoft 栈客户暴露较高的专业厂商带来替换风险。


              集群内定价在每端点每月 US$10-25 附近收敛，服务器、云和身份资产有 40-80% 溢价；eSentire 以 Essentials、Advanced 和 Complete
              分层的按资产模型落在这个区间（每端点每月 US$8-40，取决于层级和资产类别，中端市场年度合同支出中位数约 US$120,800）。定价与打包表拆出可比口径；功能 /
              能力矩阵列出七个最常被引用竞争对手的覆盖与强弱，便于直接评估采购标准。买方决策标准持续集中在 MTTC、MTTE 和 IR retainer 深度上，这些也是 eSentire 在 2026 年 Atlas AI
              Operatives 营销中强调的点。
