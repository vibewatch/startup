      - number: '1.2'
        title: 领导层、治理与 2026 年 CEO 交接
        blocks:
          - type: paragraph
            body: >-
              过去十二个月里，eSentire 最重要的治理事件是 CEO 交接。2026 年 3 月 19 日，公司宣布 James C. Foster 出任首席执行官，接替 Kerry Bailey；Bailey 在带领
              eSentire 完成多年增长并获得分析师认可后退休。Foster 的运营履历高度相关：他是 ZeroFox 创始人兼 CEO，并于 2022 年通过 SPAC 带领公司上市；更早曾在
              IronCircle、Ciphent、Accuvant（现 Optiv）担任高管，并曾在美国国防部任职。外界普遍把这次任命解读为：eSentire 要强化 AI
              驱动服务定位，并在公司仍处于主动战略评估流程时推动更激进的全球增长。


              创始人 Eldon Sprickerhoff 仍是与公司技术脉络绑定的创始人符号。CEO 席位之外，董事会由三大控股股东代表主导——Warburg Pincus（2017 年起为多数股东，Series E
              后持股从约 75% 降至略高于 50%）、Georgian 和 CDPQ；Cisco Investments 与 Edison Partners
              持有更早期少数股权。董事会席位和观察员权利的细节不在公开记录中，因此列为证据缺口。2024 年 8 月披露的出售探索流程叠加 2026 年 3 月新 CEO
              上任，使治理成为本章波动最大的维度；新投资者接手的是一家战略路径正在实时重置的公司。
