        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景：AI Operatives + 渠道采用推动 ARR 到 2028 年增长至约 US$220M；平台 AI 溢价把倍数扩至约 10x → 退出约 US$2.2B。概率
              25%。基准情景：中端市场稳步扩张，ARR 到 2027 年增至约 US$170M；倍数维持 6-7x → 退出约 US$1.0-1.2B（当前出售流程目标）。概率 55%。熊市情景：Microsoft /
              CrowdStrike 捆绑拿下中端市场，ARR 卡在约 US$140M；倍数压缩到 4-5x → 退出约 US$560-700M（赞助方减记区间）。概率 20%。概率加权退出约 US$1.18B。敏感性：ARR
              ±25% 会让基准退出变动 ±US$200-300M；倍数 ±1.0x 带来 ±US$150-200M；时点 ±12 个月通过折现率带来 ±US$100-150M。NRR ≥95%
              可通过倍数扩张把基准退出价值抬高约 10-15%。考虑 2 年悬置，出售流程隐含的 6.7x 倍数可能已经相对赞助方初始要价下调 10-30%。战略买方溢价（Cisco / Sophos / Thales
