      - number: '6.4'
        title: 扩张动作、渠道与集中度风险
        blocks:
          - type: paragraph
            body: >-
              落地后扩张沿着 MDR Essentials → Advanced → Complete 升级，再叠加模块（IR Retainer、Vulnerability
              Management、Phishing-and-Awareness）。客户旅程触点包括发现 → 2-4 周 PoV → 合同 → 4-8 周初始部署 → 持续 24/7 SOC + 90 天扩张复盘。Atlas
              Nexus Network 渠道租户计划（2025 年 3 月）是主要渠道扩张杠杆，也推高渠道伙伴集中度：按 CRN 评论，2026 年前 10 大渠道伙伴可能贡献 25-40% 净新增
              ARR，使渠道集中度成为客户侧主导风险，高于终端客户集中度（没有任何公开具名客户超过 ARR 的 5%）。负面定价压力假设是：Microsoft Defender XDR + 捆绑 E5 Security，以及
              CrowdStrike Falcon Complete，会按席位压缩中端市场 ARPU。Atlas Nexus
              白标部署模式也让终端客户关系归属变模糊，可能削弱直接扩张杠杆——不过它也可能提高伙伴-终端客户组合的切换成本，部分抵消流失风险。
