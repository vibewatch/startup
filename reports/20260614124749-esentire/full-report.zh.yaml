companyProfile:
  summary: >-
    eSentire 是一家总部位于加拿大安大略省 Waterloo 的后期私营 MDR 纯玩家，从 2001 年的网络监控业务出发，较早开创托管检测与响应品类。公司如今运营由 AI 驱动的 Atlas Security
    Operations Platform，配套 24/7 多区域 SOC、与 EDR 解耦的数据接入、Atlas AI Operatives 智能体自动化层（2026 年 5 月）以及 Atlas Nexus Network
    渠道租户计划（2025 年 3 月）。公司由财务赞助方控制（Warburg Pincus 自 2017 年起控股；CDPQ 和 Georgian 在 2022 年以投后约 US$1.1B 参与 Series E），2024 年 8
    月启动由 Evercore 主导的出售流程，目标约 US$1B（Reuters）。
