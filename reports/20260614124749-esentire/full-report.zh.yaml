      - number: '2.2'
        title: 市场规模、预测与冲突估计
        blocks:
          - type: paragraph
            body: >-
              公开的 2025-2026 年 MDR 市场估计落在 US$4.2B 到 US$11.2B 的宽区间。差异来自方法，而不是方向：仅服务定义（Mordor Intelligence、Precedence
              的部分口径）在 2025 年收敛到约 US$4.2B；更宽口径把 MDR 相邻技术支出也纳入（TBRC、Research and Markets 的部分口径），到 2026 年达到 US$11.2B。Mordor
              Intelligence 预测到 2030 年 CAGR 为 21.95%，是最常被引用的前瞻增长锚；各分析机构共识 CAGR 大致在 17-23%，使 MDR
              成为增长最快的网络安全服务细分市场之一。长期预测在仅服务口径下到 2030 年约 US$8.6B；更宽口径下到 2035 年约 US$13.9B。


              对 eSentire 来说，真正相关的可服务市场（SAM）是面向企业和中端市场买方、排除高度受限地区后的全球仅服务 MDR 机会——2026 年估计 US$3-4B——再扣除已被 EDR 捆绑型
              incumbents 抢走的份额，后者以平台而非专业深度竞争。按 Reuters 的 US$150M ARR，eSentire 在 2025 年仅服务 MDR 市场份额约 3.5%；按较高的 GetLatka
              US$243M，份额约 5.7%。两者都足以证明市场相关性，也足够小，留出有意义的增长跑道。规模口径表保留方法细节，区间图则在同一单位（US$ billions，仅服务）下展示低 / 基准 / 高包络。
