chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与总部
        blocks:
          - type: paragraph
            body: >-
              eSentire, Inc. 是一家总部位于安大略省 Waterloo 的网络安全公司，向全球客户出售 24/7 托管检测与响应（MDR）服务。公司由 Eldon Sprickerhoff 于 2001
              年创立，最初面向资本市场客户做实时网络监控，随后成长为托管检测与响应品类最早的商业开拓者之一；Gartner 和 Forrester 如今把 MDR 视为一个独立且高速增长的网络安全服务细分市场。到 2026
              年，公司一句话定位是：AI 驱动、人工主导的 MDR 提供商，把 Atlas AI Operatives 平台与 24/7 多区域安全运营中心结合起来，为端点、网络、云、日志和身份威胁提供检测与响应。


              公司为私营企业，运营总部在 Waterloo，并在 Cork（爱尔兰）和英国设有办公室及 SOC 覆盖，支撑全球跟随太阳模式服务。截至 2025/2026 年，eSentire 公开称其保护 80 多个国家的
              2,000 多家组织，身份更接近跨境 MDR 提供商，而不是区域性 MSSP。公司注册地在加拿大；这既影响跨境并购处理，也关系到其与加拿大政府创新、科学与经济发展部独角兽队列的匹配。
