              O'Melveny & Myers。地域上偏重北美（约 65-70%），EMEA 在增长（约 20-25%，由 Forrester EU Wave Leader 地位和 KSB Group 等案例支撑），APAC
              占比有限（≤10%）。典型买方是 CISO，安全工程团队日常使用；财务作为付款方签字；合同周期 1-3 年，金融服务和法律行业常见多年预付。Reuters 披露的 US$150M ARR / 2,000
