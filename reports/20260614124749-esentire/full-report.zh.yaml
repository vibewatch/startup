        title: 资本结构、融资时间线与开放出售流程
        blocks:
          - type: paragraph
            body: >-
              从 Series A 到 Series E，eSentire 已累计获得约 US$358M 风险 / 成长股权融资。2022 年 2 月的 Series E 为 US$325M，由 Georgian 和 CDPQ
              领投，Warburg Pincus 参投；公开报道显示其中约 US$100M 为 primary，约 US$225M 为 secondary，对应 US$1.1B 投后估值。Warburg Pincus 自
              2017 年起为控股股东，并领投 2019 年 Series D（US$100M）；Georgian、CDPQ、Cisco Investments 和 Edison Partners 构成其余股权结构。


              最重要的融资依赖数据点，是 Reuters 2024 年 8 月披露 Evercore 主导、约 US$1B 的出售探索，倍数高于约 US$150M ARR 的 7x。截至 2026 年 6
              月，该流程已开放约八个季度，仍未公开披露成交。两年多的开放出售流程、近期产品发布（Atlas AI Operatives，2026 年 5 月）以及具备 ZeroFox 经验的 CEO
              任命（Foster，2026 年 3 月）合在一起，指向业主与潜在买方之间价格预期错位；管理层正在把资产重新定位为 18-36 个月内更高出清价或公开市场路径。资本充足性表总结融资时间线和开放流程状态。
