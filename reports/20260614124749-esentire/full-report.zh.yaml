      - number: '2.4'
        title: 增长驱动、采用约束与整合压力
        blocks:
          - type: paragraph
            body: >-
              2026 年 MDR 需求由四个驱动因素主导。第一，AI 赋能的攻击工具正在拉大攻击者能力与内部防守能力之间的差距——eSentire 报告 2025 年账户攻陷尝试同比激增 389%。第二，监管正在把 24/7
              检测与响应能力推向过去依靠点状控制也能过关的行业：EU NIS2（2024 年 10 月开始执行，2025-2026 年持续实质影响覆盖实体）、美国 SEC
              网络披露规则、加拿大关键基础设施要求，以及收紧的网络保险承保，都让买方更倾向外包 MDR。第三，SOC 分析师长期短缺，使中端企业自建 24/7 团队成本过高。第四，MSP/MSSP 渠道选择贴牌专业
              MDR（例如通过 eSentire 的 Atlas Nexus Network），而不是自建 SOC，从而扩大间接可触达支出。


              三个采用约束压住牛市情景。商品化风险真实存在：CrowdStrike、Palo Alto Networks 和 Microsoft 正越来越多把 MDR
              捆进平台交易，威胁纯服务玩家定价权。最大型企业（Fortune 100）仍可能自建内部能力，构成可信替代。并购整合正在加速：Reuters 2024 年 8 月披露 eSentire 约
              US$1B、Evercore 主导的出售流程，本身就是市场信号，说明规模化专业 MDR 供应商面临合并或并入更大平台的压力。驱动与约束表把每股力量映射到方向、时点和影响；采用漏斗 /
