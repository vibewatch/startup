            body: >-
              对 AWS 超大规模云的依赖是单云集中风险；重大 AWS 宕机或区域中断可能限制 Atlas 数据平面吞吐，并触发 SLA 罚款。EDR 供应商数据源依赖（CrowdStrike、SentinelOne）由
