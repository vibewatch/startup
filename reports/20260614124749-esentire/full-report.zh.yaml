      - number: '1.3'
        title: 融资历史、所有权与 2024 年出售流程
        blocks:
          - type: paragraph
            body: >-
              eSentire 的资本历史在 2022 年 2 月 22 日宣布的 US$325M Series E 达到高点；该轮把公司估值推至 US$1B 以上，并赋予独角兽身份。该轮中约 US$100M 是投向公司的
              primary capital；其余为 secondary，让 Warburg Pincus 变现部分持股，也为早期投资者和员工提供流动性。融资后，Warburg Pincus 持股从约 75% 降至略高于
              50%，Georgian 和 CDPQ 合计取得约 35%。更早轮次包括 2016 年 Georgian 领投、Edison Partners 参与的成长投资（约 US$27M），以及 Warburg
              Pincus 2017 年的多数股权投资；所有轮次累计披露 primary capital 约 US$358M。


              最近最关键的事件，是 Reuters 于 2024 年 8 月 14 日披露：Warburg Pincus、CDPQ 和 Georgian 已聘请 Evercore 探索出售公司，目标估值约
              US$1B（含债务），对应其约 US$150M 年度经常性收入超过 7 倍。截至 2026 年 6 月——披露后八个季度——市场仍未看到出售、IPO
              或已完成的控制权变更交易；这一流程仍是公司最大的未决问题，也常被用来解释 2026 年 CEO 变更。隐含约 6.7x ARR 倍数构成第 8 章使用的估值锚，也框定新进入投资者的牛 / 基准 / 熊区间。
