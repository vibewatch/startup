  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              托管检测与响应（MDR）服务市场，是分析师认可的 24/7 外包威胁监控、检测、调查与响应品类；它以订阅服务形式交付，结合技术与人工专家能力。Gartner 的 2025 年 MDR Market Guide
              是最常被引用的定义锚：MDR 不同于纯 SIEM、SOAR 或 EDR 产品销售，也不同于没有响应职责的传统 MSSP 日志监控服务。eSentire 正处在这个边界内竞争：它是供应商无关、AI 驱动、人工主导的
              MDR 提供商，接入第三方 EDR、SIEM 和云检测工具，而不是把买方锁进自有端点产品。边界正向两侧流动：技术捆绑型 XDR 产品（CrowdStrike Falcon Complete、SentinelOne
              Vigilance、Microsoft Defender XDR）从平台侧争夺同一笔买方预算，专业 SOC-as-a-service 则从下方侵蚀。


              到 2026 年，ITDR（身份威胁检测与响应）已被视为 MDR 范围内，而不是一个单独品类——eSentire 2026 年 5 月发布的 Atlas AI Operatives
              明确扩展了身份信号覆盖。可替代或补充 MDR 的相邻品类包括 SIEM（数据平面）、SOAR（编排）、EDR/XDR（端点信号）、云原生检测（CSPM/CWPP）以及纯 incident-response
              retainer。本章的市场定义表明确列出纳入支出、排除支出和替代品类，确保下游 TAM/SAM/SOM 测算方法可辩护。
