  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Atlas 平台架构与数据平面
        blocks:
          - type: paragraph
            body: >-
              Atlas 是 eSentire 的多租户、AI 驱动 Security Operations Platform，把数据接入、跨信号关联、AI operative
              自动化、分析师工作台和响应编排组合在一起。它接入端点 EDR 传感器（CrowdStrike、SentinelOne、Microsoft Defender、VMware Carbon
              Black）、网络、云工作负载（AWS、Azure、GCP）、身份（Microsoft Entra、Okta）、邮件和 SaaS 应用等多信号遥测。EDR 解耦姿态是相较平台捆绑 MDR（CrowdStrike
              Falcon Complete、Microsoft Defender XDR）的结构性差异点，也让 Atlas 能在混合和竞争对手 EDR 栈中获胜。从客户工作流看，Atlas 被售卖为买方外包的 24/7
              SOC：买方保留 EDR、IdP 和云作为记录系统，eSentire 在其之上负责检测、分诊、狩猎和主动遏制。本章的产品模块 / 资产矩阵和技术 / 运营架构表，映射数据平面组件、多区域 SOC
              拓扑（北美、EMEA、APAC 跟随太阳模式）以及云基础设施依赖姿态，包括对 AWS 超大规模云的依赖、EDR 厂商 API 依赖和身份提供商集成；这些集成决定跨客户检测学习能否跑通。
