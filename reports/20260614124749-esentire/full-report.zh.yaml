      - number: '2.3'
        title: 买方、细分与定价
        blocks:
          - type: paragraph
            body: >-
              MDR 的可触达客户下沿，是严肃 24/7 SOC 需求开始具备经济性的中端市场门槛（受监管行业约 250 名员工；轻监管行业约 750 名员工）；上沿则是安全预算足以自建 SOC 的 Fortune 100
              企业。垂直结构明显偏向受监管行业——金融服务（银行、对冲基金、资产管理人）、医疗、法律、保险和政府——eSentire 披露的客户基础也反映了这种集中度。采购权通常在 CISO；预算所有者在中端市场账户中多为
              CIO，在高度受监管企业中则转向首席风险官或审计委员会。


              2026 年，端点 MDR 定价通常在每端点每月 US$10-25，服务器、云工作负载和身份资产溢价 40-80%。中端市场年度合同支出中位数约 US$120,800，从最小部署的约 US$37,500
              到大型部署的超过 US$230,000 不等。相较基础 MSSP 日志监控（每端点每月 US$3-9），这部分定价溢价买的是动手响应和修复，也正是 MDR 的定义性差异。买方 /
              细分地图和市场定义表中的定价列，构成本章对买方池的量化画像。
