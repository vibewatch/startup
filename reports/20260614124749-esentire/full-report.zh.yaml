              MDR 等价能力捆进既有企业合同，压低中端市场 MDR ARPU；CrowdStrike Falcon Complete 是第二个捆绑风险，按 Cybersecurity Dive 评论，两者合计到 2028
              年威胁 30-40% 的中端市场。Atlas Nexus Network 带来的渠道集中度是伙伴侧主导风险：前 10 大伙伴可能贡献 25-40% 的净新增 ARR。财务模型风险包括约 US$50-100M 的
              Series E 优先权总额悬置，以及未披露的债务服务；Evercore 牵头的出售流程始于 2024 年 8 月，截至 2026 年 6 月仍未关闭，约 2
