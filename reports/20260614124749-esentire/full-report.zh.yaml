  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：两类结构性集群
        blocks:
          - type: paragraph
            body: >-
              2026 年 MDR 竞争格局分成两类结构性集群。第一类是 EDR 解耦型专家——eSentire、Arctic Wolf、Red Canary、ReliaQuest 和
              Deepwatch——它们拼的是跨异构客户工具栈的集成广度和服务深度。第二类是 EDR / SOC 平台供应商提供的平台捆绑 MDR——CrowdStrike Falcon Complete、Microsoft
              Defender XDR、Palo Alto Networks Cortex XSIAM 和 SentinelOne
              Vigilance——它们拼的是自动化深度，以及已经在该供应商产品层标准化的账户里的平台经济引力。相邻和替代品类包括 SOC-as-a-service（只监控、不捆绑响应）、独立
              incident-response retainer，以及仅面向最大型企业的内部 SOC 建设。


              eSentire 自己的竞争对比落地页选择 CrowdStrike、Arctic Wolf、Expel、ReliaQuest 和 Red Canary
              作为主要正面对手，这与独立分析师和评论者名单高度一致。本章的竞争者画像表按类别、规模、目标客户、差异化和最重要限制列出每个具名竞争对手，后续章节可以引用同一份标准格局图，而不必重复推导。
