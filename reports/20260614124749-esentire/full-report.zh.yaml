      - number: '4.2'
        title: 单位经济、GTM 动作与渠道投资
        blocks:
          - type: paragraph
            body: >-
              规模化 MDR 专业厂商的单位经济，主要由 SOC 分析师人力成本、平台研发和获客成本驱动。行业基准显示，服务占比较高的 MDR 提供商混合毛利率为 55-65%，低于纯 SaaS 平台可比公司的
              75-85%，意味着 eSentire 位于安全平台可比集的低端。规模化 MDR 的 S&M-to-ARR 基准为 35-45%，CAC 回收期 18-24 个月；NRR 基准为
              110-125%。eSentire 的具体数值未披露，仍是关键尽调缺口。Go-to-market 结合直销企业销售、通过 Atlas Nexus 的 MSP / MSSP 渠道，以及云市场（AWS）。James
              C. Foster（2026 年 3 月 19 日上任，前 ZeroFox）接任 CEO 时明确把渠道扩张作为 2026-2028 年增长杠杆；隐含财务任务，是在 18-36 个月内把公司推向 $1B+
              出售出清价，或走向公开市场路径。单位经济表捕捉基准与披露之间的缺口。
