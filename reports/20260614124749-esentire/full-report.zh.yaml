      - number: '3.3'
        title: 护城河、切换成本与分销
        blocks:
          - type: paragraph
            body: >-
              MDR 的切换成本真实存在，但有边界。成本来自传感器部署、日志源集成、runbook 调优和分析师关系连续性；对中端市场账户而言，合计会带来 90-180
              天运营扰动。它们不足以在经济性明显更优的方案面前无限锁住客户，但足以放慢替换，尤其是在受监管行业，现有 runbook 已积累合规证据。eSentire 的 EDR 解耦姿态，使它能在 EDR
              栈混杂或使用竞争对手 EDR 的账户中获胜，而 Falcon Complete 无法服务这类账户；这是异构企业环境中被低估的结构性优势。


              分销是 eSentire 最独特的结构性护城河。2025 年 3 月推出的 Atlas Nexus Network，为 MSP 和渠道伙伴提供专用 Atlas XDR 租户和生成式 AI
              服务创建工具，支持贴牌部署；以直销为主的 Arctic Wolf 等竞争对手无法匹配。这个渠道护城河叠加 eSentire 二十多年积累的受监管行业销售能力。代价是，受监管行业集中度既是护城河（深厚合规
              know-how，控制对齐 GLBA/SOX/HIPAA/PCI-DSS），也是进入超大型企业细分市场的天花板；ReliaQuest 和 Deepwatch
              在该市场权重更高。本章的护城河耐久性表逐项列出每条护城河及其主要威胁。
