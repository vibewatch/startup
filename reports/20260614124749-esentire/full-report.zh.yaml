      - number: '3.4'
        title: 商品化、替换与 2024-2026 年整合信号
        blocks:
          - type: paragraph
            body: >-
              三个结构性风险框定竞争耐久性问题。第一，检测内容商品化：LLM 辅助规则编写和共享开源检测库（Sigma、ATT&CK 映射）将在 2026-2028 年削弱专有检测内容护城河——包括 Red Canary
              在内的每个检测工程主导型 MDR 都面临这一风险。第二，Microsoft Defender XDR 捆进 Microsoft 365 E5，对任何 Microsoft
              栈客户暴露较高的专业厂商都是最重要替换风险；eSentire 以 EDR 解耦姿态对冲，但无法在纯 Microsoft 账户中完全抵消免费竞争者。第三，Reuters 2024 年 8 月披露 eSentire
              约 US$1B、Evercore 主导的出售探索，本身就是市场信号，说明 MDR 专业厂商层正在整合——规模化专业厂商面临合并或并入更大平台的压力；到 2026
              年中流程已开放八个季度，表明买卖双方价格预期尚未对齐。


              护城河耐久性与竞争风险登记表把每项风险映射到严重度、缓释成熟度和尽调问题。Arctic Wolf 报道中的 IPO 准备路径，提供了一个规模化 MDR 专业厂商保持独立的可比基准；eSentire 到 2026
              年中路径更不清晰，也构成新投资者承担的剩余不确定性。
