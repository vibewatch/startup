            body: >-
              Atlas AI Operatives 于 2026 年 5 月 27 日发布，是集成进 Atlas 的智能体 AI
              工作者，可自主分诊并响应安全事件。公司把它定位为「human-in-the-loop」智能体系统：AI 处理确定性的分诊和响应步骤，人工分析师处理更需要判断的升级事项。eSentire 在 2026 年营销中宣称
              Atlas 平台 MTTE 低于 30 秒、MTTC 约 15 分钟。「威胁压制保证」通过主动遏制权限落地——在预先批准的 playbooks 约束下，Atlas
              可隔离主机、禁用账户并阻断网络流量，无需等待买方批准。


              客户工作流覆盖 24/7 SOC 监控、威胁狩猎、incident-response 参与、漏洞建议、管理层报告，以及 red-team / purple-team 演练。工作流 /
              用例表逐项列出覆盖范围；客户工作流 / 运营流程图展示遥测如何从传感器流入 Atlas 关联，再到分析师介入和 AI operative 响应。
