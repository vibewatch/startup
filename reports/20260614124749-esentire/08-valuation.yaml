- id: comparable-valuation-and-comparable-set
  title: Comparable Valuation and Comparable Set
  body: >-
    Public comps: CrowdStrike (≈15-18x EV/ARR), SentinelOne (≈6x EV/ARR), Zscaler (≈12-14x EV/ARR) per investor-relations
    disclosures, with Bessemer State-of-the-Cloud benchmarks supporting the EV/ARR range. eSentire's implied 6.7x sits at
    the low end of the public-comp band consistent with its private-mid-market-MDR profile. Private MDR / cybersecurity M&A
    multiples cluster in the 5-8x ARR range per analyst commentary; comparable transactions include Arctic Wolf 2023 (~11x
    at peak), Deepwatch 2023 (~7-8x), Secureworks 2024 public (~1.5x), ReliaQuest 2024 round (~10x), Sophos/Secureworks 2024
    acquisition. eSentire's 6.7x is squarely within band — neither premium nor distressed. Most likely strategic candidates:
    Cisco / Splunk / IBM and Sophos / Thales / Trellix-style consolidators (Microsoft and CrowdStrike are unlikely given competitive
    overlap); a Vista / Thoma Bravo / Permira-style PE roll-up is the credible alternative path. CDPQ Responsible-Investment
    governance overlay narrows acceptable buyer set toward ESG-tilted strategics over aggressive PE roll-ups.
  claimRefs:
