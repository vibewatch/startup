- id: thesis-break-triggers-and-final-asks
  title: Thesis-Break Triggers and Final Diligence Asks
  body: >-
    Thesis-break and kill triggers include: NRR <85% (primary), top-10 channel partner ARR >50%, Microsoft E5 capturing >40%
    of mid-market MDR by 2028, CEO departure within 12 months of March 2026 transition, marquee-customer breach attributed
    to eSentire detection failure (would compress multiple by 1-2x and ARR by 5-15%), and sale process extending past February
    2027 (>30 months) with no buyer. Final diligence asks: NRR / GRR by vertical / tier, top-10 channel partner ARR %, debt
    schedule and Series E preference terms (≈US$425M+ preference stack), sponsor-board exit-timing alignment, FedRAMP / CCCS
    roadmap, AI Operatives error-rate, marquee-customer reference calls. The recommendation chain — market scale (≈US$13B
    MDR by 2027) → eSentire ≈1% share → Forrester EU Leader proof → moderate competitive moat → risks dominated by sponsor
    exit + Microsoft bundling → 6.7x ARR base case → MONITOR with conditional INVEST — is defensible at IC level with confidence
    6/10.
