- id: bull-base-bear-scenarios
  title: Bull, Base, and Bear Scenarios
  body: >-
    Bull case: ARR grows to ~US$220M by 2028 on AI Operatives + channel uptake; multiple expands to ~10x on platform-AI premium
    → ≈US$2.2B exit. Probability 25%. Base case: ARR grows to ~US$170M by 2027 on steady mid-market expansion; multiple holds
    at 6-7x → ≈US$1.0-1.2B exit (current sale-process target). Probability 55%. Bear case: ARR stalls at ~US$140M as Microsoft
    / CrowdStrike bundles capture mid-market; multiple compresses to 4-5x → ≈US$560-700M exit (sponsor write-down territory).
    Probability 20%. Probability-weighted exit ≈ US$1.18B. Sensitivity: ±25% ARR moves base-case exit by ±US$200-300M; ±1.0x
    multiple moves by ±US$150-200M; ±12 months timing moves by ±US$100-150M via discount-rate. NRR ≥95% would lift the base-case
    exit value by ~10-15% via multiple expansion. The implied 6.7x sale process multiple already reflects an estimated 10-30%
    downward adjustment from initial sponsor ask given the 2-year overhang. A strategic-buyer premium (Cisco / Sophos / Thales-type
    acquirer paying for the channel-tenant Atlas Nexus asset) could lift exit to ≈US$1.4-1.6B, while a PE roll-up by Thoma
    Bravo / Vista / Permira would more likely sit at base-case discipline.
  claimRefs:
