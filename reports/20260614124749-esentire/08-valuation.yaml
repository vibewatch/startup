company:
  name: eSentire
chapter:
  number: 8
  title: Valuation
  summary: >-
    Recommendation: MONITOR with conditional INVEST on closing of the Evercore-led sale process at base-case price (US$1.0-1.2B
    / 6.7x US$150M ARR per Reuters Aug 2024), conditional on NRR ≥95% and top-10 channel partner ARR <40%. Base-case ARR grows
    to ~US$170M by 2027 at 6-7x multiple → ≈US$1.0-1.2B exit; bull case US$220M / 10x → ≈US$2.2B; bear case US$140M / 4-5x
    → ≈US$560-700M. Probability-weighted exit ≈US$1.18B at bull-25% / base-55% / bear-20%. Implied 6.7x is in-band vs public
    comps (SentinelOne 6x; CrowdStrike 15-18x) and private MDR comps (5-8x). Dominant adverse signal: 2-year stalled Evercore
    process. Dominant kill triggers: NRR <85%, top-10 channel partner ARR >50%, Microsoft E5 ≥40% mid-market by 2028, CEO
    departure, marquee-customer breach. Confidence 6/10; closing six final-diligence asks (NRR, channel %, debt, sponsor alignment,
    FedRAMP roadmap, AI Operatives error-rate) would lift to 8/10.
sections:
- id: recommendation-and-thesis
  title: Recommendation, Thesis, and Anti-Thesis
  body: >-
    Recommendation: MONITOR with conditional INVEST on closing of the Evercore-led sale process at base-case price (US$1.0-1.2B
    / 6-7x ARR), conditional on NRR ≥95% and top-10 channel partner ARR <40%. Thesis (5 axes): (1) Forrester Wave EU Q3 2025
    Leader status validates platform and reference quality; (2) Atlas AI Operatives (May 2026) and Atlas Nexus Network (March
    2025) provide fresh R&D and channel proof; (3) 2,000+ mid-market customer base with diversified vertical mix; (4) global
    SOC + multi-region architecture supports continued mid-market expansion; (5) Implied 6.7x ARR multiple sits in the public-comp
    and private-comp band. Anti-thesis (5 axes): (1) 2-year stalled Evercore process signals valuation gap or strategic-buyer
    absence; (2) Microsoft E5 + CrowdStrike Falcon Complete bundling threatens 30-40% of mid-market MDR by 2028; (3) Channel
    concentration via Atlas Nexus is the dominant 2026 partner-side risk; (4) CEO transition March 2026 introduces execution
    risk; (5) No public NRR / GRR disclosure caps confidence.
