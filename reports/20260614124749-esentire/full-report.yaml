        title: Atlas Platform Architecture and Data Plane
        blocks:
          - type: paragraph
            body: >-
              Atlas is eSentire's multi-tenant AI-driven Security Operations Platform combining data ingest,
              cross-signal correlation, AI-operative automation, analyst workbench, and response orchestration. It
              ingests multi-signal telemetry across endpoint EDR sensors (CrowdStrike, SentinelOne, Microsoft Defender,
              VMware Carbon Black), network, cloud workloads (AWS, Azure, GCP), identity (Microsoft Entra, Okta), email,
              and SaaS applications. The EDR-agnostic posture is a structural differentiator versus platform-bundled MDR
              (CrowdStrike Falcon Complete, Microsoft Defender XDR) and lets Atlas win in mixed and competitor EDR
              stacks. From a customer-workflow perspective, Atlas is sold as the buyer's outsourced 24/7 SOC: the buyer
              keeps EDR, IdP and cloud as systems of record while eSentire owns detection, triage, hunt and active
              containment on top. The chapter's product-module / asset matrix and technology / operating architecture
              tables map the data-plane components, the multi-region SOC topology (follow-the-sun across North America,
              EMEA, APAC), and the cloud-infrastructure dependency posture, including AWS hyperscaler reliance,
              EDR-vendor API dependencies, and identity-provider integrations that gate cross-customer
