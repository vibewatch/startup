      - number: '3.2'
        title: Capability and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              On core capability, MDR vendors converge on 24/7 SOC, threat hunting, IR support, and multi-signal
              coverage (endpoint + network + cloud + identity), with differentiation concentrated in response authority
              (active containment vs. recommended actions), IR-retainer-hour bundling, identity-signal depth, and
              channel/partner enablement. eSentire's 'threat suppression guarantee' and active containment authority
              differentiate it from detection-focused peers like Red Canary, while Arctic Wolf and ReliaQuest lead on
              integration breadth and concierge support, and CrowdStrike Falcon Complete leads on automation depth
              inside the Falcon stack. Microsoft Defender XDR is the most material platform-bundled threat because it
              ships free inside Microsoft 365 E5, materially lowering the marginal cost of platform-bundled MDR for
              Microsoft-stack buyers and creating displacement risk for any specialist with significant Microsoft-stack
              customer exposure.


              Pricing across the cluster converges around US$10-25 per endpoint per month for endpoints, with server,
              cloud, and identity assets at 40-80% premiums; eSentire's per-asset model with Essentials, Advanced, and
              Complete tiers fits this band (US$8-40 per endpoint per month depending on tier, with median annual
              mid-market contract spend ~US$120,800). The pricing-and-packaging table breaks out the apples-to-apples
              comparison; the feature/capability matrix lays out coverage and strength across the seven most-cited
              competitors so buying criteria can be evaluated directly. Buyer decision criteria consistently cluster
              around MTTC, MTTE, and IR-retainer depth, all of which eSentire emphasizes in its 2026 Atlas AI Operatives
              marketing.
