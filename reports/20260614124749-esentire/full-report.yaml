      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Consolidation Pressure
        blocks:
          - type: paragraph
            body: >-
              Four drivers govern 2026 MDR demand. First, AI-enabled attacker tooling — eSentire reported a 389% YoY
              surge in account-compromise attempts in 2025 — is widening the gap between attacker capability and
              in-house defender capacity. Second, regulation is forcing 24/7 detection-and-response capability into
              industries that previously got by with point-in-time controls: EU NIS2 (enforced October 2024, materially
              affecting covered entities throughout 2025-2026), U.S. SEC cyber-disclosure rules, Canadian
              critical-infrastructure mandates, and tightening cyber-insurance underwriting all bias buyers toward
              outsourced MDR. Third, the persistent SOC analyst talent shortage makes in-house 24/7 staffing
              prohibitively expensive even for mid-market enterprises. Fourth, the MSP/MSSP channel is white-labeling
              specialist MDR (e.g., via eSentire's Atlas Nexus Network) rather than building proprietary SOCs, expanding
              the indirect addressable spend.


              Three adoption constraints temper the bull case. Commoditization risk is real: CrowdStrike, Palo Alto
              Networks, and Microsoft are increasingly bundling MDR into platform deals, threatening pure-play services
              pricing power. Internal-build remains a credible substitute for the largest enterprises (Fortune 100). And
              M&A consolidation is accelerating: the August 2024 Reuters disclosure of eSentire's ~US$1B Evercore-led
              sale process is itself a market signal that scaled specialist MDR providers face pressure to combine or
              join larger platforms. The drivers-and-constraints table maps each force to direction, timing, and
              implication; the adoption funnel/flow figure shows the typical buyer journey from awareness through
              expansion.
