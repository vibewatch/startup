chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Headquarters
        blocks:
          - type: paragraph
            body: >-
              eSentire, Inc. is a Waterloo, Ontario-headquartered cybersecurity company that sells 24/7 Managed
              Detection and Response (MDR) services to a global customer base. Founded in 2001 by Eldon Sprickerhoff and
              originally focused on real-time network monitoring for capital-markets clients, the company evolved into
              one of the original commercial pioneers of the Managed Detection and Response category, which Gartner and
              Forrester now treat as a distinct, fast-growing cybersecurity services segment. Its one-line identity in
              2026 is: an AI-driven, human-led MDR provider that pairs the Atlas AI Operatives platform with a 24/7
              multi-region Security Operations Center for endpoint, network, cloud, log, and identity threat detection
              and response.


              The company is privately held with operating headquarters in Waterloo and additional offices and SOC
              presence in Cork (Ireland) and the United Kingdom, supporting global follow-the-sun coverage. As of
              2025/2026, eSentire publicly states that it protects more than 2,000 organizations across 80+ countries,
              anchoring its identity as a cross-border MDR provider rather than a regional MSSP. The company's corporate
              domicile is Canadian, which is relevant both for cross-border M&A treatment and for its alignment with the
              Government of Canada's Innovation, Science and Economic Development unicorn cohort.
