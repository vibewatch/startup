              reasonable-security obligations enforced by the Office of the Privacy Commissioner of Canada; OPC
              enforcement intensity has risen in 2024-2026 with stricter PIPEDA reform proposals signaled. SEC Item 1.05
              cyber-incident disclosure rules indirectly raise customer-driven accountability pressure on eSentire as a
              managed-security vendor for SEC registrants. CCCS Cloud Service Provider IT Security Assessment Program
              governs Canadian-federal cloud-vendor eligibility; FedRAMP authorization is not publicly confirmed for
              eSentire as of June 2026, limiting U.S. federal-civilian / DoD addressable market. No major public class
              action, regulator enforcement order, or significant litigation against eSentire is identifiable in CanLII
              / Federal Court records as of June 2026; the legal-risk register is dominated by hypothetical exposure
              rather than active matters. ISED Canada federal industrial-policy posture toward domestic cybersecurity
