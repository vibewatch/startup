            title: MDR is one of the fastest-growing cybersecurity-services markets through 2030
            body: >-
              Analyst consensus places the MDR services market at ~US$4.2B in 2025 with a 17-23% CAGR through 2030,
              reaching ~US$8.6B by 2030 on services-only definitions and into the US$13B+ range under broader-scope
              methodologies. Mordor Intelligence's 21.95% CAGR is the most-cited point estimate. For a specialist with
              eSentire's ~US$150M ARR base (Reuters disclosure), the addressable services-only SAM remains 20-25x
              current revenue, giving the company room to compound without confronting the share ceiling that limits
              niche-platform specialists.
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM025
              - CM028
          - type: callout
            title: EDR platform bundling and 2024-2026 consolidation pressure are the central market constraints
            body: >-
              Two negative forces frame the bull case. First, CrowdStrike Falcon Complete, Microsoft Defender XDR, and
              Palo Alto Networks' XSIAM increasingly bundle MDR into platform deals, compressing pure-play services
              pricing power. Second, the August 2024 Reuters disclosure of eSentire's ~US$1B Evercore-led sale
              exploration is itself a market signal: scaled specialist MDR providers face pressure to combine or join
              larger platforms. The 2026 sale-process status (no closed transaction eight quarters in) suggests the
              market is consolidating but not at the price specialists expect.
            calloutType: risk
            claimRefs:
              - CM017
              - CM018
