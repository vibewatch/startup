      - number: '1.2'
        title: Leadership, Governance, and the 2026 CEO Transition
        blocks:
          - type: paragraph
            body: >-
              eSentire's most material governance event in the past twelve months is its CEO transition. On March 19,
              2026, the company announced that James C. Foster had been appointed Chief Executive Officer, succeeding
              Kerry Bailey, who retired after leading eSentire through a multi-year growth and analyst-recognition
              cycle. Foster brings a directly relevant operating record: he was founder and CEO of ZeroFox, which he
              took public via SPAC in 2022, with prior senior roles at IronCircle, Ciphent, and Accuvant (now Optiv) and
              earlier service in the U.S. Department of Defense. His appointment is widely interpreted as a move to
              sharpen eSentire's AI-driven services positioning and to drive aggressive global growth at a moment when
              the company is also navigating an active strategic-review process.


              Founder Eldon Sprickerhoff remains a recognized founder-figure tied to the company's technical lineage.
              Beyond the CEO seat, the board is dominated by representatives of the three controlling shareholders —
              Warburg Pincus (majority holder since 2017, reduced from ~75% to just over 50% post-Series E), Georgian,
              and CDPQ — with Cisco Investments and Edison Partners holding longer-standing minority positions. Granular
              board-seat and observer-rights data is not in the public record and is recorded as an evidence gap. The
              combination of a sale-exploration process disclosed in August 2024 and a fresh CEO appointment in March
              2026 makes governance the chapter's most volatile dimension; new investors will inherit a company whose
              strategic path is being re-set in real time.
