  - TR004
  figureRefs: []
- id: partner-dependency-and-financial-risk
  title: Partner, Dependency, and Financial-Model Risk
  body: >-
    AWS hyperscaler dependency is a single-cloud concentration risk; a major AWS outage or regional disruption could cap Atlas
    data-plane throughput and trigger SLA penalties. EDR-vendor data-source dependency (CrowdStrike, SentinelOne) is mitigated
    by EDR-agnostic design but exposed to API throttling and pricing-pull. Microsoft Defender XDR + E5 Security bundle is
    the most material 2026-2028 competitive risk — Microsoft can compress mid-market MDR ARPU by bundling MDR-equivalent capability
    into existing enterprise contracts; CrowdStrike Falcon Complete is the second bundling risk and together they threaten
    30-40% of mid-market by 2028 per Cybersecurity Dive commentary. Channel concentration via Atlas Nexus Network is the dominant
    partner-side risk: top-10 partners may account for 25-40% of net-new ARR. Financial-model risk includes ~US$50-100M total
    Series E preference overhang and undisclosed debt service; the Evercore-led sale process initiated August 2024 has not
    closed as of June 2026, a ~2-year overhang suggesting valuation disagreement or market-cycle softness. The sponsor consortium
    (Warburg / CDPQ / Georgian) exit-timing alignment is the principal financial-risk uncertainty.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
