  - FR002
- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill-Criteria Triggers
  body: >-
    Mitigation cornerstones include SOC 2 Type II, ISO 27001, ISO 27018, PCI DSS, and CSA STAR compliance per the trust center;
    FedRAMP and CCCS public-sector gating remain open. Atlas AI Operatives (May 2026) operationalize automated triage and
    partially mitigate SOC-attrition risk. Kill-criteria triggers for thesis review include NRR <85%, top-10 channel ARR >50%
    of net-new, Microsoft E5 capturing >40% of mid-market MDR by 2028, CEO departure within 12 months, or named marquee-customer
    breach attributed to eSentire. Risk-transmission from a marquee-customer breach flows via reputation → renewal churn →
    ARR contraction → exit-valuation compression; the adverse-chain scenario (prolonged sale process → talent attrition →
    execution slip → ARR-growth deceleration → exit-valuation compression → sponsor write-down) is the principal tail risk
    and a focused IC discussion topic. Continuous monitoring of CISA KEV / NIST NVD CVE supply, OPC and SEC enforcement cadence,
    and Microsoft / CrowdStrike MDR bundle pricing will provide the leading indicators. Investors should track these triggers
    monthly and reassess the thesis quarterly.
  claimRefs:
  - CR001
  - CR020
  - CR021
  - CR022
  - CR038
  - CR039
  - CR040
