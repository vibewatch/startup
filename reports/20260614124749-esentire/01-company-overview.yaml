company:
  name: eSentire
chapter:
  number: 1
  title: Company Overview
  summary: >-
    eSentire is a Waterloo, Ontario-headquartered Managed Detection and Response (MDR) pioneer founded in 2001 by Eldon Sprickerhoff,
    controlled by Warburg Pincus (since 2017) with substantial minority positions held by Georgian and CDPQ after a US$325M
    Series E in February 2022 that conferred unicorn status. As of June 2026, the company protects more than 2,000 organizations
    across 80+ countries, reports approximately US$150M ARR (Reuters disclosure) versus US$243M in some third-party databases,
    has appointed James C. Foster as CEO (March 2026, succeeding Kerry Bailey), and remains in an open ~US$1B Evercore-led
    sale exploration first disclosed by Reuters in August 2024.
sections:
- id: identity-and-founding
  title: Identity, Founding, and Headquarters
  body: >-
    eSentire, Inc. is a Waterloo, Ontario-headquartered cybersecurity company that sells 24/7 Managed Detection and Response
    (MDR) services to a global customer base. Founded in 2001 by Eldon Sprickerhoff and originally focused on real-time network
    monitoring for capital-markets clients, the company evolved into one of the original commercial pioneers of the Managed
    Detection and Response category, which Gartner and Forrester now treat as a distinct, fast-growing cybersecurity services
    segment. Its one-line identity in 2026 is: an AI-driven, human-led MDR provider that pairs the Atlas AI Operatives platform
    with a 24/7 multi-region Security Operations Center for endpoint, network, cloud, log, and identity threat detection and
    response.


    The company is privately held with operating headquarters in Waterloo and additional offices and SOC presence in Cork
    (Ireland) and the United Kingdom, supporting global follow-the-sun coverage. As of 2025/2026, eSentire publicly states
    that it protects more than 2,000 organizations across 80+ countries, anchoring its identity as a cross-border MDR provider
    rather than a regional MSSP. The company's corporate domicile is Canadian, which is relevant both for cross-border M&A
    treatment and for its alignment with the Government of Canada's Innovation, Science and Economic Development unicorn cohort.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO029
  tableRefs:
  - TO002
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership, Governance, and the 2026 CEO Transition
  body: >-
    eSentire's most material governance event in the past twelve months is its CEO transition. On March 19, 2026, the company
    announced that James C. Foster had been appointed Chief Executive Officer, succeeding Kerry Bailey, who retired after
    leading eSentire through a multi-year growth and analyst-recognition cycle. Foster brings a directly relevant operating
    record: he was founder and CEO of ZeroFox, which he took public via SPAC in 2022, with prior senior roles at IronCircle,
    Ciphent, and Accuvant (now Optiv) and earlier service in the U.S. Department of Defense. His appointment is widely interpreted
    as a move to sharpen eSentire's AI-driven services positioning and to drive aggressive global growth at a moment when
    the company is also navigating an active strategic-review process.


    Founder Eldon Sprickerhoff remains a recognized founder-figure tied to the company's technical lineage. Beyond the CEO
    seat, the board is dominated by representatives of the three controlling shareholders — Warburg Pincus (majority holder
    since 2017, reduced from ~75% to just over 50% post-Series E), Georgian, and CDPQ — with Cisco Investments and Edison
    Partners holding longer-standing minority positions. Granular board-seat and observer-rights data is not in the public
    record and is recorded as an evidence gap. The combination of a sale-exploration process disclosed in August 2024 and
    a fresh CEO appointment in March 2026 makes governance the chapter's most volatile dimension; new investors will inherit
    a company whose strategic path is being re-set in real time.
  claimRefs:
