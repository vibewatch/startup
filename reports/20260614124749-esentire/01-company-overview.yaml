  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Executive leadership bench beyond CEO transition is not publicly enumerated.
    missingEvidence: 'Full C-suite roster: CFO, CTO, CRO, CISO, and direct reports with backgrounds and tenure.'
    whyItMatters: The leadership page (esentire.com/company/our-leadership) returned a 404 during fetch on 2026-06-14, leaving
      the leadership table partial.
    diligencePath: Request management roster and bios in diligence; cross-check LinkedIn for tenure and prior roles.
    relatedQuestionRefs:
    - QO002
    relatedTableRefs:
    - TO002
  - type: conflicting-data
    severity: material
    topic: ARR figures conflict materially between Reuters (~US$150M) and GetLatka (~US$243M).
    missingEvidence: Reconciliation between contracted/recurring ARR and total revenue including services for 2024 and 2025.
    whyItMatters: The implied valuation multiple varies from ~6.7x to ~4.1x depending on which ARR base is used, which materially
      changes the chapter 8 valuation envelope.
    diligencePath: Request audited or management financials in data room; confirm ARR definition with eSentire CFO.
    relatedQuestionRefs:
    - QO011
    - QO018
    - QO026
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: Post-Series-E cap-table percentages, board seats, and preference terms are not in the public record.
    missingEvidence: Exact ownership percentages by holder, board composition, observer rights, and liquidation preferences.
    whyItMatters: Governance control and preference overhang materially affect new-investor IRR and consent rights in the
      sale process.
    diligencePath: Request cap table and charter documents during diligence.
    relatedQuestionRefs:
    - QO005
    - QO006
    - QO020
    relatedTableRefs:
    - TO003
