  - CO024
  - CO025
  - CO020
  - CO022
- calloutType: risk
  title: Open ~US$1B sale process and CEO transition concentrate execution risk
  body: >-
    Two governance events frame the company's near-term trajectory: the August 2024 Reuters-reported Evercore-led sale exploration
    at ~US$1B (>7x ~US$150M ARR), and the March 2026 appointment of James C. Foster as CEO succeeding Kerry Bailey. Eight
    quarters after the sale process was disclosed, no transaction has been announced; the combination of an unresolved exit
    and a newly seated CEO during an open process is the single largest risk dimension for new investors taking a position
    alongside Warburg Pincus, CDPQ, and Georgian.
  claimRefs:
