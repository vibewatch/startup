- id: snapshot-metrics-and-gaps
  title: Snapshot Metrics, Scale, and Evidence Gaps
  body: >-
    The cover metrics for eSentire split cleanly into well-evidenced and partially or undisclosed. Valuation is anchored by
    the Reuters-reported ~US$1 billion sale-process target and the original Series E unicorn marker. Total raised (~US$358M),
    founding year (2001), headquarters (Waterloo, Ontario), customer count (2,000+ across 80+ countries), and flagship product
    (Atlas AI-driven Security Operations Platform with the May 2026 Atlas AI Operatives release) are supportable from primary
    or high-reputation sources. By contrast, the company's current annual recurring revenue is disclosed only through indirect
    channels and varies materially across sources: Reuters' 2024 sale-process disclosure cites approximately US$150 million,
    while the third-party database GetLatka reports US$243 million for 2024. Both numbers are recorded here; the chapter treats
    Reuters as primary and GetLatka as a conflicting estimate.


    Headcount is also partial. The company publicly targeted 1,000+ employees post-Series E but independent databases place
    its 2025–2026 staff at approximately 589, suggesting that the original hiring plan was scaled back during the post-2022
    cybersecurity-budget compression and that subsequent ARR growth has been driven by per-employee productivity rather than
    seat growth. Customer-impacting outages, breach-related incidents, or material litigation attributable to eSentire have
    not been disclosed in regulatory filings or major media as of June 2026, but the absence of evidence does not equal absence
    of risk; the chapter's evidence-gap register flags this as a diligence path for confidential reference calls.


    Material milestones not yet covered include analyst recognitions (Forrester Wave Leader Europe Q3 2025, Forrester Wave
    Strong Performer Global Q1 2025, 2025 Frost Radar Leader) and the March 2025 launch of the Atlas Nexus Network partner
    program. Together these confirm continued go-to-market momentum during the open sale process; the milestone table is the
    chapter's chronology of record.
