- calloutType: assumption
  title: ARR base reconciliation is the cornerstone of every later chapter
  body: >-
    The Reuters-disclosed ~US$150M ARR (Aug 2024) and the third-party-database ~US$243M ARR (2024) cannot both be correct
    on a like-for-like basis; the gap most likely reflects different definitions (contracted ARR vs total revenue with services),
    but neither party publishes a reconciliation. This chapter treats US$150M as the primary anchor (Reuters tier-1 source
    citing PE owner disclosure) and US$243M as an explicitly flagged conflicting estimate. All later chapters (market sizing,
    financials, valuation) inherit this anchor and the explicit conflict.
  claimRefs:
  - CO015
  - CO016
  - CO026
