callouts:
- calloutType: strength
  title: Category pioneer with durable analyst recognition through the open sale process
  body: >-
    eSentire continues to accumulate top-tier analyst recognition — Forrester Wave Leader (MDR Europe Q3 2025), Forrester
    Wave Strong Performer (Global Q1 2025), and Frost Radar 2025 MDR Leader — while simultaneously navigating the Evercore-led
    sale process and a fresh CEO transition. For an MDR services company, recurring designation in analyst evaluations is
    the single most important commercial proof point, and the cadence here implies that the underlying detection and response
    platform is sustaining differentiation independent of M&A noise.
  claimRefs:
