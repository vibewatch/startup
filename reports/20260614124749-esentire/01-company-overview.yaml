- id: funding-and-valuation
  title: Funding History, Ownership, and the 2024 Sale Process
  body: >-
    eSentire's capital history culminates in a US$325 million Series E announced February 22, 2022, which valued the company
    at over US$1 billion and conferred unicorn status. Of the round, approximately US$100 million was primary capital to the
    company; the balance was secondary, allowing Warburg Pincus to monetize a portion of its holding and providing liquidity
    to earlier investors and employees. Post-round, Warburg Pincus' stake declined from approximately 75% to just over 50%,
    with Georgian and CDPQ acquiring roughly 35% combined. Earlier rounds include a 2016 Georgian-led growth investment alongside
    Edison Partners (~US$27M) and Warburg Pincus' 2017 majority investment, with cumulative disclosed primary capital across
    all rounds reported at approximately US$358 million.


    The most consequential recent event is the August 14, 2024 Reuters disclosure that Warburg Pincus, CDPQ, and Georgian
    had retained Evercore to explore a sale of the company at approximately US$1 billion including debt, targeting a multiple
    of more than 7 times its annual recurring revenue of about US$150 million. As of June 2026 — eight quarters after that
    disclosure — no sale, IPO, or completed change-of-control transaction has been publicly announced; the process remains
    the single largest open question for the company and the rationale frequently cited for the 2026 CEO change. The implied
    ~6.7x ARR multiple sets the valuation anchor used in Chapter 8 and brackets the bull/base/bear range for new entrants.
  claimRefs:
