companyProfile:
  summary: >-
    eSentire is a Waterloo, Ontario-headquartered late-stage private MDR pureplay
    that pioneered the managed-detection-and-response category from network-monitoring
    origins (2001) and today operates the AI-driven Atlas Security Operations Platform
    with 24/7 multi-region SOC, EDR-agnostic data ingest, the Atlas AI Operatives
    agentic-automation layer (May 2026), and the Atlas Nexus Network channel-tenant
    program (March 2025). Sponsor-controlled (Warburg Pincus since 2017; CDPQ and
    Georgian since 2022 Series E at ~US$1.1B post-money), with an open Evercore-led
    sale process initiated August 2024 targeting approximately US$1B (Reuters).
  founders:
    - name: J. Paul Haynes
      role: Founder; transitioned from CEO to advisory role March 2026
      background: Long-tenured eSentire CEO who built the company from network-monitoring origins through the MDR-category creation, the 2017 Warburg majority sale, and the 2022 Series E unicorn round before handing the CEO mantle to James C. Foster on March 19, 2026.
      claimRefs: [CO001, CR016, CR031]
  foundedDate: '2001-01-01'
  foundingLocation: Cambridge, Ontario, Canada (later Waterloo)
  headquarters: Waterloo, Ontario, Canada
  productSummary: >-
    Atlas Security Operations Platform — multi-tenant AI-driven MDR platform combining
    EDR-agnostic multi-signal data ingest (endpoint, network, cloud, identity, email,
    SaaS), cross-signal correlation, Atlas AI Operatives agentic-AI automation, an
    analyst workbench, and active-containment response orchestration via a 24/7
    multi-region SOC (follow-the-sun across North America, EMEA, APAC), plus the
    Atlas Nexus Network channel-tenant program for MSP / cybersecurity-services
    partners.
  customerFocus: >-
    Mid-market and lower-enterprise CISOs across financial services (Trafigura),
    legal AmLaw 50 / AmLaw 100 (Goodwin Procter, O'Melveny & Myers), healthcare /
    biopharma, manufacturing (KSB Group), technology (Velocity Global, Stratacache),
    construction, government / public sector, and professional services; blended
    ARPU ≈US$75K (per Reuters US$150M ARR / 2,000-customer footprint).
  businessModel: >-
    Subscription MDR with tiered pricing (Essentials / Advanced / Complete), add-on
    modules (IR Retainer, Vulnerability Management, Phishing-and-Awareness), 1-3
    year contracts with multi-year prepayments concentrated in financial-services
    and legal verticals, plus a growing Atlas Nexus channel-tenant program serving
    MSP / cybersecurity-services partners.
  stage: Late-stage private; sponsor-controlled (Warburg / CDPQ / Georgian); open
    Evercore-led sale process since August 2024
  fundingStatus: >-
    Warburg Pincus majority investment (2017); Series D US$100M led by Warburg
    (June 2019); Series E US$325M led by Georgian and CDPQ (February 2022) at
    approximately US$1.1B post-money (unicorn); Evercore-led sale exploration
    initiated August 2024 at approximately US$1B / 6.7x ARR — still open as of
    June 2026.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CV001, CV002, CV012, CR016, CR017, CR031, CI001, CI002, CU001,
    CE001, CE004, CU019]
