summary:
  headline: >-
    eSentire 是 Forrester EU Wave 领先者中的 MDR 纯玩家，估值落在公开可比公司区间低端；但 Evercore 出售流程停滞 2 年， 以及 Microsoft / CrowdStrike
    打包压力上升，是最主要反向信号。当前应观察；若出售流程按基准情景完成、NRR ≥95%，且前 10 大渠道合作伙伴 ARR <40%，可有条件投资。
