- id: named-customer-proof-and-outcomes
  title: Named Customer Proof and Outcome Evidence
  body: >-
    eSentire publishes a robust portfolio of at least seven distinct named customer case studies updated in 2024-2026: Trafigura,
    Goodwin Procter, Velocity Global, O'Melveny & Myers, KSB Group (2026), Stratacache (2026), plus the rolling TechValidate
    survey panel. Case-study customers are in production deployment (not pilot), with multi-year tenure and concrete outcomes
    including 24/7 SOC coverage, sub-30-second MTTE on critical alerts, and IR engagements averted via active containment.
    The KSB Group (2026, EU manufacturing) and Stratacache (2026, North America technology) cases are the freshest production
    references. FeaturedCustomers aggregates 50+ self-reported customer logos that corroborate the order of magnitude of the
    2,000-customer claim. Together this constitutes high-quality named-proof evidence: production status, vertical diversity,
    outcome specificity, and 2025-2026 freshness.
  claimRefs:
  - CU009
  - CU010
  - CU030
  - CU031
  - CU032
  - CU034
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-satisfaction-and-cohorts
  title: Retention, Satisfaction, and Cohort Visibility
  body: >-
    Independent NRR / GRR figures are not publicly disclosed; the closest retention proxies are Gartner Peer Insights (4.6/5
    across 100+ reviews as of mid-2026), G2 top-rated MDR ratings, TrustRadius high quality-of-relationship reviews, and eSentire's
    own marketing NPS of 76. The TechValidate customer-survey panel (n=100+ in 2025) reports >90% of customers would recommend
    eSentire to peers, the broadest public retention signal. Reviewer commentary across Gartner Peer Insights and G2 cites
    quality of SOC analyst engagement and IR responsiveness as primary retention drivers, more than feature parity. Cohort
    retention curves are not publicly disclosed and remain a diligence ask — the retention / repeat cohort figure documents
    this gap rather than asserting figures. Typical customer contracts run 1-3 years with multi-year prepayments concentrated
    in financial-services and legal verticals; together with the high named-reference base and TechValidate-survey corroboration
    these signals point to durable retention, but the absence of audited NRR / GRR caps confidence and is the single largest
    diligence gap on the customer side.
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU027
  - CU032
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-channel-and-concentration
  title: Expansion Motion, Channel, and Concentration Risk
  body: >-
    Land-and-expand motion progresses MDR Essentials → Advanced → Complete tier upgrades and add-on modules (IR Retainer,
    Vulnerability Management, Phishing-and-Awareness). The customer-journey touchpoints span discovery → 2-4 week PoV → contract
    → 4-8 week initial deployment → ongoing 24/7 SOC + 90-day expansion review. Atlas Nexus Network channel-tenant program
    (March 2025) is the primary channel-expansion lever and creates a rising channel-partner concentration: the top 10 channel
    partners could plausibly account for 25-40% of net-new ARR in 2026 per CRN commentary, making channel concentration the
    dominant customer-side risk and outranking end-customer concentration (no single named customer publicly exceeds 5% of
    ARR). The adverse pricing-pressure thesis is that Microsoft Defender XDR + bundled E5 Security and CrowdStrike Falcon
    Complete compress mid-market ARPU on a per-seat basis. The Atlas Nexus white-label deployment model also creates end-customer
    relationship-ownership ambiguity that can reduce direct expansion levers — though it likely raises switching costs for
    the partner-end-customer combination, partially offsetting churn risk.
  claimRefs:
