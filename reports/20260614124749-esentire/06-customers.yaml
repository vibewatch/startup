chapter:
  number: 6
  title: Customers
  summary: >-
    eSentire serves 2,000+ organizations across 80+ countries with a mid-market and lower-enterprise footprint (≈US$75K blended
    ARPU per Reuters' US$150M ARR figure), concentrated in financial services, legal (AmLaw 50/100), healthcare, manufacturing,
    and technology verticals. Named customer proof is strong (6+ fresh 2024-2026 case studies spanning Trafigura, Goodwin
    Procter, O'Melveny, Velocity Global, KSB Group, Stratacache) and review-aggregator ratings (Gartner 4.6/5 across 100+
    reviews; high G2 / TrustRadius) corroborate satisfaction. Public NRR/GRR/cohort retention disclosure is absent — the principal
    diligence ask. The dominant customer-side risk is rising channel-partner concentration via the Atlas Nexus Network channel-tenant
    program (March 2025) rather than end-customer concentration.
sections:
- id: customer-segmentation-and-scale
  title: Customer Segmentation, Scale, and Buyer Profile
  body: >-
    eSentire protects more than 2,000 organizations across 80+ countries as of 2026, a mid-market and lower-enterprise customer
    base spanning financial services, legal (AmLaw 50 / AmLaw 100), healthcare, manufacturing, construction, biopharma, technology,
    government / public sector, and professional services. Flagship vertical references include Trafigura (global commodities
    trading) in financial services and Goodwin Procter / O'Melveny & Myers in legal. Geographic distribution skews North America
    (≈65-70%) with growing EMEA (≈20-25%, anchored by the Forrester EU Wave Leader status and case studies such as KSB Group)
    and limited APAC presence (≤10%). The typical buyer is the CISO with security-engineering as the day-to-day user; finance
    signs off as payer; contracts run 1-3 years with multi-year prepayments common in financial-services and legal verticals.
    Blended ARPU implied by Reuters' US$150M ARR / 2,000-customer figures sits near US$75K, anchoring a mid-market footprint
    — a meaningful contrast to enterprise-tier MDR competitors targeting US$250K+ ARPU. Vertical concentration appears moderate
    (financial services + legal estimated near 40-50% of base), while geographic concentration in North America is the dominant
    geographic exposure and a key sensitivity if North American cyber-insurance pricing or breach-cost economics shift adversely
    during the 2026-2028 sale window.
  claimRefs:
