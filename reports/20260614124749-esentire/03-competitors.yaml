- id: moats-switching-and-distribution
  title: Moats, Switching Costs, and Distribution
  body: >-
    Switching costs in MDR are real but bounded. They derive from sensor deployment, log-source integration, runbook tuning,
    and analyst-relationship continuity — collectively running 90-180 days of operational disruption for a mid-market account.
    They are not high enough to lock customers in indefinitely against materially better economics, but they are high enough
    to slow displacement, especially in regulated industries where compliance evidence has been built up around incumbent
    runbooks. eSentire's EDR-agnostic posture allows it to win in accounts with mixed or competitor EDR stacks where Falcon
    Complete cannot, an underrated structural advantage in heterogeneous enterprise estates.


    Distribution is where eSentire's most distinctive structural moat sits. The Atlas Nexus Network launched in March 2025
    gives MSPs and channel partners a dedicated Atlas XDR tenant and generative-AI service-creation tooling, enabling white-label
    deployments that direct-sales-dominated competitors like Arctic Wolf do not match. This channel moat compounds with the
    regulated-industry sales muscle eSentire has built over two decades. The trade-off is that regulated-industry concentration
    is both a moat (deep compliance know-how, GLBA/SOX/HIPAA/PCI-DSS-aligned controls) and a ceiling on the very-largest-enterprise
    segment where ReliaQuest and Deepwatch over-index. The chapter's moat-durability table catalogues each moat against the
    principal threat to it.
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP020
  - CP025
  - CP033
