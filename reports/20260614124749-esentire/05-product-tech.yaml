  title: Product & Technology
  summary: >-
    Atlas is eSentire's multi-tenant AI-driven Security Operations Platform combining EDR-agnostic multi-signal data ingest,
    cross-signal correlation, the May 2026 Atlas AI Operatives agentic-AI automation layer, and active-containment response
    orchestration via a multi-region 24/7 SOC. Forrester Wave Leader (Europe Q3 2025) and Strong Performer (Global Q1 2025)
    recognition corroborate platform maturity. The Atlas Nexus Network (March 2025) and MDR for Microsoft (April 2025) extensions
    are the principal 2025-2026 R&D outputs. Tech-stack opacity (LLM provider, cloud mix) and FedRAMP gap are minor but open
    diligence asks.
sections:
- id: atlas-platform-and-data-plane
  title: Atlas Platform Architecture and Data Plane
  body: >-
    Atlas is eSentire's multi-tenant AI-driven Security Operations Platform combining data ingest, cross-signal correlation,
    AI-operative automation, analyst workbench, and response orchestration. It ingests multi-signal telemetry across endpoint
    EDR sensors (CrowdStrike, SentinelOne, Microsoft Defender, VMware Carbon Black), network, cloud workloads (AWS, Azure,
    GCP), identity (Microsoft Entra, Okta), email, and SaaS applications. The EDR-agnostic posture is a structural differentiator
    versus platform-bundled MDR (CrowdStrike Falcon Complete, Microsoft Defender XDR) and lets Atlas win in mixed and competitor
    EDR stacks. From a customer-workflow perspective, Atlas is sold as the buyer's outsourced 24/7 SOC: the buyer keeps EDR,
    IdP and cloud as systems of record while eSentire owns detection, triage, hunt and active containment on top. The chapter's
    product-module / asset matrix and technology / operating architecture tables map the data-plane components, the multi-region
    SOC topology (follow-the-sun across North America, EMEA, APAC), and the cloud-infrastructure dependency posture, including
    AWS hyperscaler reliance, EDR-vendor API dependencies, and identity-provider integrations that gate cross-customer detection-learning.
  claimRefs:
