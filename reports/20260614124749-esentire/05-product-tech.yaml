callouts:
- calloutType: strength
  title: Atlas AI Operatives (May 2026 GA) compound eSentire's automation moat against detection-content commoditization
  body: >-
    The May 27, 2026 GA of Atlas AI Operatives — agentic-AI workers that autonomously triage and respond to security events
    — is the most material product milestone in eSentire's 2025-2026 roadmap. By moving deterministic triage and response
    into automation while preserving human analysts for higher-judgment escalations, Atlas compresses MTTE (marketed sub-30s)
    and MTTC (marketed ~15 min) and partially insulates the platform from the broader detection-content commoditization risk.
  claimRefs:
  - CE004
  - CE005
  - CE019
  - CE020
  - CE026
  - CE030
- calloutType: strength
  title: EDR-agnostic posture + Atlas Nexus channel multi-tenant are the two structural product differentiators
  body: >-
    Atlas ingests EDR data across CrowdStrike, SentinelOne, Microsoft Defender, and others, allowing eSentire to win in mixed
    and competitor EDR stacks where platform-bundled MDR (Falcon Complete, Defender XDR) cannot serve. The Atlas Nexus Network
    multi-tenant architecture (March 2025) gives MSP / cybersecurity-services partners a dedicated tenant with generative-AI
    service-creation tooling, a structural channel moat that direct-sales-dominated competitors do not match.
  claimRefs:
  - CE003
  - CE007
  - CE013
  - CE029
  - CE034
- calloutType: risk
  title: Tech-stack opacity and FedRAMP gap are open diligence questions
  body: >-
    eSentire does not publicly disclose the cloud-infrastructure provider mix beyond AWS Marketplace, the programming-language
    stack, or the LLM provider behind Atlas AI Operatives. FedRAMP authorization for U.S. federal customers is also not publicly
    confirmed as of June 2026, capping addressable U.S. public-sector opportunity. Both are routine data-room asks but neither
    has been satisfied by public sources.
  claimRefs:
  - CE021
  - CE024
  - CE025
