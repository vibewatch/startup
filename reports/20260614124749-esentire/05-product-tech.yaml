- id: threat-research-trust-and-compliance
  title: Threat Research (TRU), Trust, and Compliance
  body: >-
    The Threat Response Unit (TRU) is eSentire's in-house threat-research and detection-content development team, generating
    custom detection rules and IoC feeds against the MITRE ATT&CK framework. Public TRU output includes the 2025 cybercrime
    report and 2026 threat report, with telemetry highlights such as a 389% year-over-year surge in account-compromise attempts
    and a 21% drop in successful BEC incidents among protected customers. eSentire holds SOC 2 Type II, ISO 27001, ISO 27018,
    PCI DSS, HIPAA-aligned, and Cloud Security Alliance STAR certifications; FedRAMP authorization is not publicly confirmed
    as of June 2026. The trust-quality-compliance table itemizes certifications and trust-center disclosures.


    The TRU detection-content function is a defensible moat in the medium term but faces 2026-2028 commoditization risk from
    LLM-assisted rule-writing and shared open-source detection libraries. Detection-content development at TRU is partly automated
    by 2026 (LLM-assisted rule synthesis), aligning eSentire with industry-wide commoditization trends while preserving differentiation
    via proprietary telemetry.
  claimRefs:
