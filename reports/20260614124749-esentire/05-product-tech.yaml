- id: ai-operatives-and-workflow
  title: AI Operatives, Customer Workflows, and Active Containment
  body: >-
    Atlas AI Operatives, launched May 27, 2026, are agentic-AI workers integrated into Atlas that autonomously triage and
    respond to security events. They are positioned as 'human-in-the-loop' agentic systems where AI handles deterministic
    triage and response steps while human analysts handle higher-judgment escalations. eSentire markets a sub-30-second MTTE
    and approximately 15-minute MTTC for the Atlas platform in 2026. The 'threat suppression guarantee' is operationalized
    through active containment authority — Atlas can isolate hosts, disable accounts, and block network traffic without waiting
    for buyer approval (subject to pre-approved playbooks).


    Customer workflows span 24/7 SOC monitoring, threat hunting, incident-response engagement, vulnerability advisory, executive
    reporting, and red-team / purple-team exercises. The workflow / use-case table itemizes coverage, and the customer workflow
    / operating flow figure shows how telemetry flows from sensor through Atlas correlation to analyst intervention and AI-operative
    response.
  claimRefs:
