- id: roadmap-channel-tenant-and-maturity
  title: Roadmap, Channel Multi-Tenant, and Product Maturity
  body: >-
    Atlas's platform roadmap milestones since 2024 demonstrate a one-major-release-per-six-months cadence: MDR for Microsoft
    (April 2025), Atlas Nexus Network (March 2025), and Atlas AI Operatives (May 2026). Atlas Nexus Network is the channel
    multi-tenant differentiator: each MSP / cybersecurity-services partner receives a dedicated Atlas tenant with generative-AI
    service-creation tooling that allows custom playbooks and detection content tailored to their target vertical. The multi-tenant
    architecture addresses data-residency and security-isolation concerns of MSPs while still providing cross-customer detection-learning
    at scale.


    Forrester's Wave: MDR Services in Europe Q3 2025 named eSentire a Leader (one of two), evaluating platform architecture,
    detection efficacy, and customer references; the Global Q1 2025 Wave named it a Strong Performer. UnderDefense's 2026
    MDR competitor comparison categorizes Atlas as a 'global enterprise-tier' platform with deep IR, broad integration, and
    white-label channel readiness. The roadmap / release / development-stage table and product-maturity figure capture the
    cadence and maturity posture. The public GitHub presence and AWS Marketplace listing are low-signal but consistent indicators
    of an engineering-grade vendor whose primary distribution remains direct and channel-sales rather than open-source community.
  claimRefs:
