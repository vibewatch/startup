  topStrengths:
    - >-
      Forrester Wave EU Q3 2025 Leader (one of two) and Global Q1 2025 Strong Performer designations validate platform
      maturity and customer-reference quality.
    - >-
      Diversified mid-market customer base of 2,000+ organizations across 80+ countries with strong named-customer proof
      (Trafigura, Goodwin Procter, O'Melveny, Velocity Global, KSB Group, Stratacache) and Gartner Peer Insights 4.6/5
      across 100+ reviews.
    - >-
      Atlas AI Operatives (May 2026 launch) and Atlas Nexus Network channel-tenant program (March 2025 launch) provide
      fresh R&D and strategic-buyer-relevant differentiation.
    - >-
      EDR-agnostic multi-signal Atlas platform plus 24/7 multi-region follow-the-sun SOC architecture remain
      structurally differentiated versus EDR-platform-bundled MDR (CrowdStrike Falcon Complete, Microsoft Defender XDR).
    - >-
      Implied 6.7x ARR sale multiple sits squarely within the public-comp (SentinelOne ~6x; CrowdStrike 15-18x) and
      private MDR M&A (5-8x) bands, neither premium nor distressed.
  topRisks:
    - >-
      The Evercore-led sale process initiated August 2024 has not closed as of June 2026 — a 2-year overhang implying
      valuation gap, market-cycle softness, or strategic-buyer absence.
    - >-
      Microsoft E5 Security + CrowdStrike Falcon Complete bundling threatens 30-40% of mid-market MDR by 2028 per
      Cybersecurity Dive commentary; primary 2026-2028 competitive pressure on mid-market ARPU.
    - >-
      Channel concentration via the Atlas Nexus Network is the dominant 2026 partner-side risk; top-10 channel partners
      estimated 25-40% of net-new ARR per CRN commentary.
    - >-
      CEO transition March 2026 (James C. Foster ex-ZeroFox) introduces execution-continuity risk; CFO / CRO / CTO bench
      refresh remains in motion.
    - >-
      No public NRR / GRR / cohort retention disclosure caps confidence on the SaaS-like recurring-revenue thesis;
      vendor-marketed NPS of 76 and Gartner / G2 / TrustRadius scores are the only public retention proxies.
  unresolvedGaps:
    - Audited NRR / GRR by vertical and tier, and cohort retention curves.
    - Top-10 customer and top-10 channel-partner ARR concentration.
    - >-
      Post-Series E debt schedule, Series E preference terms (~US$425M+ stack), and sponsor consortium exit-timing
      alignment.
    - FedRAMP authorization roadmap and CCCS Cloud Service Provider IT Security Assessment status.
    - Atlas AI Operatives in-production error-rate, customer-satisfaction signals, and marquee-customer reference calls.
