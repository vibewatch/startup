    "number": 3,
    "title": "Competitors",
    "summary": "Liblib’s competitive moat rests on China-local community density, model supply, professional creator demand, and regulatory execution, not on unique access to LoRA, ComfyUI, or image/video generation features. Direct peers and platform giants can replicate capabilities, making switching cost, paid creator retention, and B-side workflow depth the core diligence questions."
  },
  "sections": [
    {
      "id": "landscape-map",
      "title": "Landscape: direct model communities, global substitutes, and Chinese platform entrants",
      "body": "Liblib’s competitor set is not a simple list of image generators. The closest direct peers are model-sharing and creation communities that can host or train models, expose LoRA-style customization, and keep creators inside a marketplace or community loop. Tensor.Art, SeaArt AI, Wujie AI, and AituBo are source-backed in this chapter; 6pen and PixAI remain named in the requested scope but not fully profiled because the retained source texts do not contain verifiable current profiles. Global substitutes bracket the same job from two directions: Civitai emphasizes open model discovery and community control, while Midjourney emphasizes proprietary model quality and fast output. The China-platform threat sits above both groups, because Baidu, Alibaba, Tencent, and ByteDance can bundle image and video generation into e-commerce, gaming, social, and creator distribution where Liblib must earn usage rather than inherit it.",
