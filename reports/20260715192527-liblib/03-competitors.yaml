    {
      "id": "capability-and-scale",
      "title": "Capability and scale comparison",
      "body": "Liblib’s scale metrics make it more than a hobbyist image tool: reported mid-2026 figures include more than 30 million cumulative users, more than 500,000 original models, more than 5 million images per day, and ARR above US$300 million. That scale is the basis for its professional studio narrative, but it does not create capability exclusivity. SeaArt has text, image, and video generation, LoRA training, face swap, AI characters, ComfyUI, and upscaling. Tensor.Art has model hosting, online training, ComfyUI workflows, and API services. Wujie adds a domestic copyright-registration path; AituBo attacks the beginner and low-budget segment. The strongest conclusion is that Liblib’s advantage is a China-focused density of community, models, and professional demand, not possession of unique feature checkboxes. The traffic benchmark cited in the brief needs a fresh independent traffic-panel pull before it is used quantitatively. This is also why pricing and plan mechanics matter: even where Liblib has stronger local supply, a low-cost rival can win exploratory usage and then upsell once a creator has built habits around its interface.",
