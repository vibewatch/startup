  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "China AIGC is a multi-billion-dollar market, but Liblib's sharper demand pool is the AI-enabled micro-drama and professional creative workflow budget. The opportunity is large and current, while regulation, tech-giant competition, and AI-content oversupply constrain how much becomes defensible recurring software revenue."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "Market boundary and sizing range",
      "body": "Liblib should not be valued against every yuan of entertainment or design spend. The investable boundary starts with China AIGC software and services that automate content creation, then narrows to image generation platforms, video and animation generators, model communities, and workflow tooling that creators or studios can buy. Public analyst estimates are wide: IMARC puts the 2025 China AIGC market at US$5.16 billion with a 15.96% CAGR to 2034, while the Grand View lower lens used in the source pool supports a roughly US$2.36 billion current-market anchor. That range is more useful than a single TAM because Liblib monetizes workflow adoption, not all generative-AI infrastructure, and because the company also sits next to a much larger content-spend pool in micro-drama production. A practical diligence model should therefore reconcile two routes: top-down analyst market forecasts and bottom-up wallet-share from studios, agencies, and enterprise creative departments. The first route proves that China AIGC is already large; the second determines how much budget is addressable by Liblib rather than by cloud infrastructure, foundation-model subscriptions, or internal creative labor.",
