    {
      "id": "micro-drama-demand",
      "title": "Micro-drama demand as the core B-side pull",
      "body": "The clearest B-side driver is China’s micro-drama economy. Multiple sources put the 2026 micro-drama market above RMB120 billion, or about US$16.5 billion, and describe the format as phone-native, high-volume, algorithmically distributed entertainment. AI matters because it compresses both cost and time: reports cite one-tenth live-action cost, one-fifth traditional shoot cost, and production cycles falling from three months to one. This changes buyer behavior. A studio can run many more pilots, outsource fewer low-value assets, and redirect budget toward prompts, model workflows, reusable characters, localization, and post-production. For Liblib, the implication is not that the whole micro-drama market is revenue; rather, that a large recurring production budget now has a reason to buy image, model, and video workflow capacity. This distinction matters because short-drama economics reward repeatable throughput more than one-off image quality. Buyers with daily episode pipelines value reusable characters, consistent style, fast localization, and low-friction collaboration, which are closer to workflow software than to consumer entertainment spend.",
