  topStrengths:
    - 商业化爆发：到 2026 年 5 月，ARR 达到 ~US$300M，据报道同比增长超过 30x，专业 B 端内容生产者是基本盘，覆盖短剧、影视和广告。
    - 在中国 AI 图像创作社区里占据头部位置，累计用户超过 30M，原创模型超过 500,000 个，每天生成图片超过 5M 张。
    - 投资人阵容一线且战略协同度高（Granite Asia、Tencent、Shunwei、Sequoia China、Ant Group），能带来资金、分发以及云 / 模型资源。
    - 产品从图像快速扩到 AI 视频（LibTV）和设计智能体（Xingliu、Lovart），踩上中国 >RMB120B 微短剧需求池。
  topRisks:
    - 内容安全和监管风险高：央视曝光过审核绕过漏洞，可生成色情内容；同时 CAC / AIGC 标识制度（GB 45438-2025）正在收紧。
    - 版权 / IP 责任难躲：中国法院在 Ultraman v. Acgnai 案中认定，生成式 AI 平台可能因侵权用户训练模型和输出承担帮助侵权责任。
    - 聚合器 / “wrapper” 毛利风险：Evoken 没有训练自有基础模型，依赖第三方模型 API（如 ByteDance Seedance），毛利和防御性都会受压；公司目前仍未盈利。
    - 估值依赖公司披露、未经审计的 ARR 和 >30x 增长；中国 AI 独角兽若经历泡沫退潮 / 重估，倍数可能被压缩。
  unresolvedGaps:
    - 没有经审计财务：毛利率、净收入留存、烧钱速度和现金跑道均未披露。
    - C 端订阅与 B 端 API / 企业业务的 ARR 拆分，以及客户集中度，尚未量化。
    - '>30x ARR 增长能维持多久、LibTV 经济性（依赖第三方视频模型 API）能否跑通，仍未证明。'
    - 2025–2026 年快速扩张后的当前员工数和组织规模未披露。
