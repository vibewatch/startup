            body: >-
              最强的财务事实，是 2024 年收入到 2026 年 ARR 的跃迁。Tencent News 报道 2024 年全年收入为 RMB206 million；多篇 2026 年报道则称，截至 2026 年 5 月
              ARR 为 US$300 million，且同比增长超过 30 倍，或超过 3,000%。因此，公开叙事的重点已经不再是需求是否存在，而是收入组合有多持久。收入似乎来自四条相互连接的流：C
              端创作者订阅和积分、专业创作者算力消耗、B 端 API 或定制化企业服务，以及 LibTV 的生产工作流变现。LibTV
              尤其重要，因为它把公司从图像生成爱好和设计工作流，推入短剧、电影、广告和品牌视频预算。首月单日收入据称超过 US$1 million，5 月收入超过上线首月 13 倍，服务团队接近 1,000
              个，这些都说明付费意愿真实。但按收入流的确认口径、留存、退款、积分沉淀和企业合同条款仍未公开。
