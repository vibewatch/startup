      - number: '7.4'
        title: 治理尽调应聚焦集中度、控制项和可量化触发线
        blocks:
          - type: paragraph
            body: >-
              人和治理风险中等但真实。陈冕此前 CapCut 商业化经验是一项资产，因为公司依赖快速判断 PMF；但同一证据也让投资论点以创始人为中心。来源包报告的 73.95%
              创始人持股和之后的法定代表人变更，不应被当作不当行为；它们应成为董事会构成、保留事项、关联方控制、信息权和继任规划的尽调提示。务实投资流程应把每项主要风险转化为触发线：再次受到 CAC 或应用商店行动、AIGC
              标识缺陷未解决、另一次 CCTV 级审核失败、IP 通知积压未解决、LoRA 工作流被禁令限制、关键模型 API 流失或重新定价，或有证据显示规模化后产品级毛利仍结构性为负。只有当合规、IP
              运营和模型采购纪律像产品发布一样可重复，Liblib 才有吸引力。证据还留下几个定量问题：当前合规人员规模、通知量、红队失败率和 API 提供商集中度都未公开，因此每一项都应成为交割前交付物，而不是投后改进计划。
