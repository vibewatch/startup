      - number: '2.3'
        title: 细分市场、买方与采用路径
        blocks:
          - type: paragraph
            body: >-
              采用路径分布在专业创作者、工作室买方、企业营销团队和平台生态之间。终端用户可能是设计师、提示词艺术家、制片人、剪辑师或运营团队，但付款方通常是工作室、代理商、品牌、游戏公司、电商商家或企业部门；这些买方本就为更快的内容产出编列预算。IMARC
              的市场细分确认图像生成平台和视频生成器是被识别的 AIGC 解决方案类别；6Wresearch 则显示，中国图像生成市场由
              Baidu、Alibaba、Tencent、ByteDance、SenseTime、Meitu 等大型生态塑造。因此，Liblib
              的市场定位需要两层过滤：它能否在巨头模型替代品之外占住创作者工作流和资产复用；它又能否把创作者社区转化为短剧、广告、设计和电商工作流里的付费团队。买方旅程还意味着模型层多栖，但资产层粘性更高：团队可能测试多个图像或视频模型，同时留在那个保存已批准模板、生产历史和社区训练模型的平台上。
