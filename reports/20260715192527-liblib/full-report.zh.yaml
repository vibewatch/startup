        - 按产品、模型家族和使用 cohort 拆分毛利率。
      - - 模型访问和替代
        - 模型原厂可以降价、捆绑应用或限制 API。
        - 工作流锁定必须抵消商品化模型访问。
        - API 条款、排队时间、提供方集中度和价格变化后的流失。
      - - 资本强度
        - US$300M B+ 支撑 R&D、全球扩张和产品组合搭建。
        - 融资降低 runway 风险，但可能掩盖补贴依赖。
