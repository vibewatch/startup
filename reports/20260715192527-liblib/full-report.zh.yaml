      - number: '5.4'
        title: 差异化来自本地化工作流密度；风险是第三方模型依赖
        blocks:
          - type: paragraph
            body: >-
              建设性技术论点是，Liblib 已积累一个本地化中国创作者生态：创作者上传、训练和分享 LoRA 模型与工作流，普通用户则无需拥有 GPU
              或掌握本地工具，就能复用这些资源。这可能比单一提示词界面更可防守，因为社区资产、风格库、工作流模板和生产习惯都会制造切换成本。负面论点同样重要。China Biz Insider 报道称，Evoken
              不开发自有基础模型，LibTV 使用第三方模型 API，包括通过 Volcano Engine 接入 Seedance 2.0。如果模型所有者降低直连价格、限制访问或打包一方工作流应用，Evoken
              的毛利和差异化可能迅速被压缩。合规是另一项产品风险：CAC 备案背景和已报道的 CCTV 内容安全事件说明，审核和标识不是事后事项。承销结论是：Liblib
              具有牵引力很强的工作流应用护城河，但仍需要对模型合同、安全整改、API 控制和按产品线划分的贡献利润率做私有尽调。
