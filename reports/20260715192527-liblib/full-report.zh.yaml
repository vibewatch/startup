  - id: TR003
    title: 与 Liblib 相关的版权和 IP 案例先例
    columns:
      - 先例
      - 裁判要点或启示
      - 对 Liblib 的影响
      - 关键缓释
    rows:
      - - Li v Liu，北京互联网法院
        - 只要人类提示词和参数选择体现智力成果，AI 生成图像可以受版权保护。
        - 用户保留流程证据时，产出可能受保护，进而影响市场所有权和纠纷。
        - 提示词历史、生成记录、产出溯源和用户披露。
      - - 2025 年北京互联网法院猫咪吊坠案
        - 创作者缺少原创流程记录、依赖事后模拟，主张因此失败。
        - Liblib 应支持创作者追溯流程，而不是依赖重建的提示词叙述。
        - 可导出生成日志、版本历史和审计轨迹。
      - - Ultraman v Acgnai，杭州
        - 训练环节可能较宽松，但稳定侵权输出和平台推广会触发帮助侵权责任。
        - LoRA 市场推广、复用或变现知名 IP 模型时风险暴露。
        - IP 检测、模型下架、通知—删除、风险提示和封面 / 示例审核。
      - - 广州互联网法院 Ultraman 案
        - AIGC 服务提供者被责令停止侵权生成，并赔偿 RMB 10,000。
        - 即便是服务层提供者，也可能负有防止高度相似输出的义务。
        - 关键词 / 模型过滤、投诉举报、用户警示和生成内容标识。
      - - EU IP Helpdesk 对 Ultraman 的分析
        - 盈利性、架构和防止侵权能力越强，注意义务越高。
        - Liblib 通过订阅、点数和企业用途变现后，法院可能期待更高控制。
        - 商业风险分层、前置预防和快速整改证据。
    notes: 这些案件不是普通法意义上的正式约束性先例，但对平台注意义务的承销判断释放了很强的司法信号。
