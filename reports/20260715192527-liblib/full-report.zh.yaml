      - number: '8.3'
        title: 情景分析：工作流锁定能抵消聚合器风险时，估值才站得住
        blocks:
          - type: paragraph
            body: >-
              情景法指向一个有条件的「合理」价格。熊市情景假设 ARR 卡在已披露的 US$300M 附近，零售端使用仍对补贴敏感，模型原厂压缩转售价差；按 4 倍 ARR 算，隐含价值约 US$1.2B。基准情景假设前瞻
              ARR 升至约 US$420M，但毛利率、NRR 和 API 成本传导仍未披露，投资人只给 5 倍 ARR，估值落在约 US$2.1B，足以支撑本轮。牛市情景需要证明 LibTV、LiblibAI、Xingliu
              和 Lovart 正在变成一个有工作流锁定的创作者操作系统；若前瞻 ARR 达到 US$500M、市场愿意给 8 倍，公司可支撑约 US$4B。只有私下尽调验证收入质量后，这种不对称才有吸引力。
