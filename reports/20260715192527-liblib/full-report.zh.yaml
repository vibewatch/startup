            body: >-
              最难承销的风险，是用户生成模型、生成产出和内容审核的组合。CCTV 在 2026 年曝光 LiblibAI 可被提示词绕过过滤器生成色情或不当内容，这一点直接相关，因为中国 AIGC
              监管强调执法，而且越来越以标识为中心。公司据称进行了技术整改，但投资者需要证据证明修复能在对抗性提示词下保持稳定，而不只是被动应对。版权风险同样具有工作流特征。Ultraman v Acgnai
              并没有把所有训练行为都定为违法；杭州法院对输入阶段训练相对宽容，把责任重点放在稳定侵权产出、被推广的 LoRA 模型、平台获利、侵权明显性和未采取预防措施上。这正是为什么 Liblib 的模型分享和 LoRA
              市场需要强 IP 审查、投诉渠道、模型屏蔽、标识和下架运营。赔偿金额只有 RMB 30,000，但禁令、下架或企业采购受阻会重要得多。
