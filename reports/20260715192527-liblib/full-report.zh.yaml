              73.95%，处于控股位置；张子杰出现在早期法定代表人和核心产品社区披露中，杨楠则在 2025 年 11 月成为法定代表人。披露的团队底子亮眼，但仍停留在高层概括：成员来自中国及海外顶尖高校，也有
              Tencent、Alibaba 和 ByteDance 背景。董事会构成、保护性条款和 Series B+ 后治理安排并未公开，因此本报告应保留创始人依赖这个判断，而不是推断公司已经形成制度化治理。
