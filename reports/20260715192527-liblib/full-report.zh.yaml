  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资跑道充足，但资本已成为护城河的一部分
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Liblib / Evoken 已不再是缺钱的 AI 艺术社区，而是一家按品类领导者融资的后期应用层公司。本章需要的本地融资事实很清楚：2023 年小额天使轮，2024 年和 2025
              年初的一组融资，2025 年 10 月 US$130 million Series B，以及 2026 年 6 月约 US$300 million、投后估值超过 US$2 billion 的 Series
              B+。重要的承销点不只是时间线，而是它说明了资本充足度。管理层称 B+ 资金将用于研发、全球扩张、AI 创意产品能力和产品组合扩建。这给 Evoken 提供了短期生存缓冲；在这个市场里，算力、模型 API
              转售、创作者补贴和付费流量可能很快吞掉自生现金。股权结构同样重要：Granite Asia、Tencent、Shunwei、HSG、Gaorong、Ant、CMC、Source
              Code、Mingshi、Yingce、INCE 以及 Lenovo 相关资本，带来异常广泛的战略和财务资源；陈冕据称仍持有控股权，也让创始人激励高度集中。
