  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模区间
        blocks:
          - type: paragraph
            body: >-
              不能拿娱乐或设计支出的每一块钱给 Liblib 定价。可投资边界从中国 AIGC
              软件和服务开始：这些产品自动化内容创作；随后再收窄到图像生成平台、视频和动画生成器、模型社区，以及创作者或工作室愿意购买的工作流工具。公开分析师估算跨度很大：IMARC 认为 2025 年中国 AIGC 市场为
              US$5.16 billion，到 2034 年 CAGR 为 15.96%；本来源池采用的 Grand View 较低口径，则支持约 US$2.36 billion 的当前市场锚。这个区间比单一 TAM
              更有用，因为 Liblib 变现的是工作流采用，而不是全部生成式 AI
              基础设施；同时，公司还紧邻短剧制作中更大的内容支出池。务实的尽调模型应调和两条路径：自上而下的分析师市场预测，以及来自工作室、代理商和企业创意部门的钱包份额自下而上测算。第一条路径证明中国 AIGC
              已经足够大；第二条路径决定有多少预算可由 Liblib 触达，而不是被云基础设施、基础模型订阅或内部创意人力拿走。
