  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接模型社区、全球替代品与中国平台入局者
        blocks:
          - type: paragraph
            body: >-
              Liblib 的竞争集合不是一串简单的图像生成器名单。最接近的直接同业是模型分享和创作社区：它们能托管或训练模型，开放 LoRA 式定制，并把创作者留在市场或社区循环里。本章对 Tensor.Art、SeaArt
              AI、Wujie AI 和 AituBo 有来源支撑；6pen 和 PixAI 仍保留在用户要求覆盖的范围内，但因留存来源文本没有可验证的当前画像，无法完整分析。全球替代品从两个方向包围同一任务：Civitai
              强调开放模型发现和社区控制，Midjourney 强调专有模型质量和快速产出。中国平台威胁位于两组之上，因为 Baidu、Alibaba、Tencent 和 ByteDance
