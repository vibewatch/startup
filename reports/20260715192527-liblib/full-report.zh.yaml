      - number: '2.2'
        title: 短剧需求是核心 B 端拉力
        blocks:
          - type: paragraph
            body: >-
              最清晰的 B 端驱动来自中国短剧经济。多方来源把 2026 年短剧市场放在 RMB120 billion 以上，约 US$16.5 billion，并把这种形式描述为手机原生、高产量、算法分发的娱乐内容。AI
              重要，是因为它同时压缩成本和时间：报道提到真人实拍成本的十分之一、传统拍摄成本的五分之一，制作周期从三个月降到一个月。买方行为因此改变。工作室可以跑更多试播，外包更少低价值资产，并把预算转向提示词、模型工作流、可复用角色、本地化和后期制作。对
              Liblib
              来说，这不意味着整个短剧市场都会变成收入；真正含义是，一个庞大且经常重复的制作预算，现在有理由购买图像、模型和视频工作流产能。这个区别很重要，因为短剧经济奖励的是可重复吞吐，而不是一次性图像质量。拥有日更剧集流水线的买方更看重可复用角色、一致风格、快速本地化和低摩擦协作；这些需求更接近工作流软件，而不是消费娱乐支出。
