  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 头部估值：大额融资，但 ARR 倍数不高
        blocks:
          - type: paragraph
            body: >-
              Liblib / Evoken 2026 年 6 月融资表面上很大，但用公开 ARR 证据归一化后，并不明显虚高。多份独立报道共同指向：Series B+ 融资约 US$300 million，投后估值超过
              US$2 billion，2026 年 5 月 ARR 约 US$300 million。这让头部轮次约为 6.7x ARR，且尚未调整资产负债表现金或未公开的优先条款。对于一家成立两年的 AI
              应用集团，若其拥有超过 30 million 用户、500,000 个原创模型，且收入背后有专业内容预算支撑，这个价格意外克制。因此，承销问题不是投资者是否支付了典型 AI 泡沫倍数，而是报告 ARR
              在扣除第三方模型和算力成本后，是否经常性、能留存且毛利为正。这个框架也让估值更容易与传统 SaaS 对比：如果把超过 US$2 billion 的标记视为企业价值下限，那么除非真实投后估值远高于披露值，否则
              US$2 billion 以上每增加一美元，只会温和推高倍数。
            claimRefs:
