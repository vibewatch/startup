companyProfile:
  summary: >-
    Liblib（LiblibAI、哩布哩布AI）是一家总部位于北京的生成式 AI 创意平台，2023 年上线，由母公司 Evoken（前身为 Beijing Qidian Xingyu Technology / Yanyu
    Technology）运营。它是中国最大的 AI 图像创作社区和模型分享市场，建立在 Stable Diffusion / SDXL / Flux / ComfyUI 生态之上，并支持自定义 LoRA 微调。2026 年 6
    月，公司以超过 US$2 billion 的估值完成约 US$300M Series B+ 融资，成为 AI 应用层独角兽。
  foundedDate: '2023-05-16'
  founders:
    - name: Chen Mian (陈冕)
      role: 创始人兼 CEO
      background: 此前负责 ByteDance 的 Jianying / CapCut 全球商业化；更早曾任职于 Mobike、Didi 和 MissFresh。
      claimRefs:
        - CO007
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    免费增值 AI 创意平台：文生图和图生图生成、ControlNet 工作流、自定义 LoRA 模型训练、模型分享市场（500,000+ 个原创模型）、开发者 API，以及较新的 LibTV（AI 视频）、Xingliu（国内设计
    Agent）和 Lovart（国际设计 Agent）。
  customerFocus: 个人 AI 创作者和设计师（C 端），以及短剧 / 电影、广告、游戏、动画和电商领域的企业 / 专业内容生产者（B 端）。
  businessModel: 免费增值 SaaS —— 带积分的免费层、付费订阅和算力积分（C 端），以及 API / 企业授权 / 私有化部署（B 端）。
  stage: Series B+ (private unicorn)
