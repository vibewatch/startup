      - number: '8.4'
        title: 最终判断：估值有支撑，但要扣除中国 AI 泡沫和合规折价
        blocks:
          - type: paragraph
            body: >-
              2026 年中国独角兽环境既提供支撑，也提示谨慎。Nation Press 报道，2026 年上半年中国新增 67 家独角兽；Hurun 全球榜单显示，AI 是私募市场价值创造的主引擎。这意味着 Liblib
              并非孤立的融资异象，而是处在资本向 AI 应用、机器人、基础设施和工作流自动化大规模再配置的大潮里。反向因素同样关键：China Biz Insider 对具身智能的现实核查警告称，许多现金跑道短的 AI
              独角兽可能在 2027–2028 年面临整合、降价融资或失败。Liblib 已披露 ARR，股东名单也强于许多概念阶段同行；但监管 /
              内容安全风险敞口，以及缺乏公开利润率指标，都应明确进入估值折价。基于公开记录，超过 US$2B 的估值有支撑，但它只是一个合理且对证据敏感的入场价，不是明显便宜货。因此，投委会的正确姿态不是把本轮斥为 AI
              亢奋，而是要求证明收入质量强于折价所暗示的水平：经审计的 ARR 桥、客户 cohort、贡献毛利和合规控制，才能把结论从合理推向有吸引力。
