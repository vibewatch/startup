      - number: '8.2'
        title: 基准让 6.7x 显得便宜，但不是每一美元 AI 收入都应享受溢价
        blocks:
          - type: paragraph
            body: >-
              外部基准组合支持中性偏建设性的估值立场。2026 年 SaaS 来源显示，公有云平均值接近中个位数，传统 SaaS 约为 4x 至 7x ARR，而更高增长的 AI 原生或垂直 AI
              软件高得多。在这个背景下，Liblib 的 6.7x ARR 倍数低于 AI 原生头部四分位，更接近重置周期后的公开 SaaS。创意 AI 可比公司进一步强化这个点：Canva 的 US$4 billion
              ARR 支撑 US$42 billion 至 US$65 billion 估值区间，Midjourney 似乎接近 20x 收入倍数，Sacra 的 Gamma 数据点高于 20x
              ARR。折价合乎逻辑，不是惩罚性定价。Liblib 增长异常，但公开证据尚未证明专有模型经济学、企业留存，或可与全球最佳 AI 创意平台相比的持久工作流护城河。
