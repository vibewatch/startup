  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合已从图像社区扩展为创作者操作系统
        blocks:
          - type: paragraph
            body: >-
              应把 Liblib / Evoken 评估为一家多产品创意工作流公司，而不只是一个 AI 图像网站。旗舰产品 LiblibAI 界面仍是核心流量和资产层：公开报道提到累计用户超过 30
              million，原创模型超过 500,000 个，每日生成图像超过 5 million 张。LiblibAI 2.0 随后通过加入集成式图像和视频生成、头部视频模型、特效模板，以及更广泛的开放 +
              闭源模型菜单，把这个社区重塑为专业创作工作室。相邻产品把同一资产底座延伸到新预算：LibTV 面向视频和短剧团队，Xingliu 面向国内设计 Agent 工作流，Lovart 则把设计 Agent
              论点带到国际市场。因此，产品组合逻辑是顺序展开的：创作者社区创造资产，工作室工作流提高频次，Agent /
              视频产品变现专业制作场景。这个逻辑对尽调很重要，因为只有这些工作流界面转化为反复付费任务，而不是被促销算力或暂时便宜的上游模型接入补贴的一次性实验，产品承诺才持久。
