      - number: '3.3'
        title: 护城河耐久性、切换成本与多栖
        blocks:
          - type: paragraph
            body: >-
              当中文社区、模型供给、工作流经验和专业 B 端需求相互强化时，Liblib 的护城河最强。已经依赖 Liblib 托管模型、LoRA 训练、工作流模板和中文审核 /
              合规基础设施的设计师或短剧工作室，切换成本高于随手试提示词的用户。但证据同样支持多栖判断。评论把 Civitai 描述为掌控与模型所有权选项，把 Midjourney 描述为速度和质量选项，把 SeaArt /
              Tensor / Wujie / AituBo 描述为重叠的直接工具。这些替代品会削弱 Liblib 对每个用例变现的能力，尤其当团队可以用一个平台探索，用另一个平台产出精修结果，并把本地 Stable
              Diffusion 流水线留给敏感资产时。务实的尽调问题不是 Liblib 有没有护城河，而是护城河在功能快速趋同时，是否足够深到保护抽成率和利润率。因此，在 Liblib
              证明独家资产、更强的中国创作者流动性，或竞争者难以复制的企业工作流数据之前，多栖应被视为默认用户行为。
