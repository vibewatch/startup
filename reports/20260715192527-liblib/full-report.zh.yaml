      - number: '4.3'
        title: ARR 倍数不高，但利润率问题才是支点
        blocks:
          - type: paragraph
            body: >-
              按头部数字计算，相比全球 AI 创意同业，Evoken 并不显贵：US$2 billion 估值对应 US$300 million ARR，约为 6.7 倍 ARR。这个倍数低于 Canva 约 10.5 倍至
              16 倍 ARR 的参考区间，也低于 Sacra 对 Gamma 约 20.6 倍的样本。Midjourney 据称 US$500 million 收入和 US$10 billion 估值，则隐含更高的创意 AI
              标杆。这个折价是理性的，因为 Liblib 尚未证明自己掌握毛利结构。China Biz Insider 的负面解读处于核心位置：Evoken
              不训练自有基础模型，每一次生成任务都依赖第三方模型提供商，因此公司的经济模型是零售定价与批发模型 API 或算力成本之间的价差。最好的上行情景是，社区资产、工作流和 B
              端生产集成创造足够锁定，让公司谈下批量折扣并守住价差。下行情景则是，一方模型厂商降价、打包工作流，或迫使 Liblib 补贴使用以防守份额。
