    sections:
      - number: '1.1'
        title: 身份、结构与商业模式
        blocks:
          - type: paragraph
            body: >-
              本报告应把 Liblib 视为 Evoken 内部实际运营的 AI 创意平台品牌。Evoken 这家公司集团在 2026 年 6 月更名前，曾使用 Qidian Xingyu / Yanyu Technology
              等名称。硬身份事实包括：总部在北京，运营公司成立于 2023 年 5 月，旗舰产品 LiblibAI 最初是 AI
              图像生成与模型分享社区。它的商业模式不是通用聊天机器人套壳，而是把创作者社区、模型市场、云端生成、LoRA
              训练和付费专业工作流组合在一起。这个结构很关键，因为后续章节可以沿着一条连贯链条评估市场、产品和估值：社区模型和资产输入生成、视频制作和设计 Agent 用例。官方网站只适合作为公司主张使用，因为页面完全依赖
              JavaScript；因此，这里的稳定身份基础依赖第三方新闻、类似登记资料的 Baike 页面，以及 CAC 备案生态。
