    approximationNotes: 该流程是基于所引证据的投资承销逻辑图，并非因果模型。
    claimRefs:
      - CV004
      - CV020
      - CV028
      - CV035
      - CV049
      - CV050
  - id: FV002
    title: 可比公司 ARR / 收入倍数对比
    type: bar
    layout: wide
    summary: Liblib 估算的 6.7x 倍数明显低于所引 AI 创意可比公司，接近估值重置期 SaaS 参照。
    data:
      items:
        - label: Liblib / Evoken
          value: 6.7
        - label: Canva 低端
          value: 10.5
        - label: Canva 高端
          value: 16.3
        - label: Midjourney
          value: 20
        - label: Gamma
          value: 20.6
        - label: ElevenLabs
          value: 33.3
        - label: Runway 低端
          value: 68
    approximationNotes: Runway、ElevenLabs 和 Midjourney 的倍数采用所引私募估算；Canva 高端采用 Sacra 二级市场估值。
    claimRefs:
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
  - id: FV003
    title: 估值情景区间
    type: range
    layout: standard
    summary: 情景估值从 US$1.2B 熊市情形到 US$4.0B 牛市情形，覆盖当前估值。
    data:
      items:
        - label: 熊市：利润率压缩
          low: 1
          base: 1.2
          high: 1.4
        - label: 基准：当前估值合理
          low: 1.8
          base: 2.1
          high: 2.4
        - label: 牛市：工作流 OS
          low: 3.2
          base: 4
          high: 4.8
    approximationNotes: 数值以十亿美元计并已四舍五入；区间反映 ARR 与倍数假设的敏感性。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV048
      - CV049
  - id: FV004
    title: 关键估值指标
    type: kpi
    layout: compact
    summary: KPI 组合显示规模和增长强劲，但盈利能力和留存仍未解答。
    data:
      items:
        - label: 投后估值
          value: 2
          unit: US$B+
        - label: 2026 年 5 月 ARR
          value: 300
          unit: US$M
        - label: 表观 ARR 倍数
          value: 6.7
          unit: x
        - label: ARR 同比增长
          value: 3000
          unit: '%+'
        - label: 两轮融资
          value: 500
          unit: US$M+
        - label: 累计用户
          value: 30
          unit: M+
    approximationNotes: 公开报道称估值高于 US$2B，因此这里的估值是下限；增长按报道中的 >3,000% 口径呈现。
    claimRefs:
      - CV001
