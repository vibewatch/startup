  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 中国 AIGC 监管已是操作系统，不是上线清单
        blocks:
          - type: paragraph
            body: >-
              Liblib 的第一层风险是监管连续性。中国如今不是靠单一法律监管面向公众的生成式 AI，而是靠一组工具叠加：2023 年 1 月《深度合成管理规定》、2023 年 8 月《生成式人工智能服务管理暂行办法》、通过
              CAC 和地方网信部门管理的备案与登记名册，以及 2025 年 9 月 AIGC 标识办法和 GB 45438-2025。对 Liblib 来说，这套监管栈直接映射到图像、视频、LoRA
              训练、下载、用户上传和分发工作流。有利事实是，36Kr 报道 Liblib 在 2024 年 2 月通过深度合成算法备案，并在 2024 年 3 月成为首个完成生成式 AI 服务备案的 AI
              社区平台。负面承销点是，备案必要但不充分：标识文件、元数据、用户声明、事件响应、未成年人保护和周期性名册可见性，都必须跟上 LibTV、Xingliu、Lovart 以及跨境工作流的产品扩张。
