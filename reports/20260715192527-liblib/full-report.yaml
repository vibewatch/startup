      - number: '1.2'
        title: Founder, leadership, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The founder story is unusually central to the investment case. Chen Mian is repeatedly framed as a product
              and commercialization founder, with prior responsibility for ByteDance's Jianying / CapCut global
              commercialization and a public narrative around speed, PMF discipline, and professional creator workflows.
              That background fits LiblibAI's motion: professional image and video creators are asked to pay for
              production infrastructure, not simply try a novelty model. The concentration risk is also real. Public
              materials point to Chen as controlling shareholder at roughly 73.95%, while Zhang Zijie appears in early
              legal-representative and core product-community disclosures and Yang Nan became legal representative in
              November 2025. The disclosed team bench is impressive but still high level: elite Chinese and overseas
              universities plus Tencent, Alibaba, and ByteDance backgrounds. Board composition, protective provisions,
              and post-Series B+ governance are not public, so the report should preserve founder dependence rather than
              infer institutionalized governance.
