      - number: '2.4'
        title: Growth drivers, constraints, and market-shaping regulation
        blocks:
          - type: paragraph
            body: >-
              The growth case is strong but not frictionless. Government AI-plus policy, enterprise digitization,
              automated content needs, and local production subsidies all expand demand. At the same time, regulation is
              not an afterthought; it shapes which models can launch, how generated content is labeled, and which
              micro-dramas can be distributed. CAC filing records and Liblib’s own filing history show that compliance
              is a market-access prerequisite. The adverse case is also market-level, not just company-level: cheap
              generation can flood platforms with undifferentiated content, creating price competition and lower
              willingness to pay for generic outputs. For Liblib, the durable opportunity is to be a workflow and asset
              marketplace that saves money while raising output quality; the risk is being pushed into commodity tooling
              if buyers can multi-home across large-model ecosystems. The diligence priority is to separate demand
              creation from value capture. A rising tide in AI content can lift usage metrics, yet only retention, paid
              conversion, compliance resilience, and differentiated workflows will show whether Liblib captures durable
              margin.
