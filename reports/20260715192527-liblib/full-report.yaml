      - number: '4.3'
        title: The valuation is modest on ARR, but the margin question is the fulcrum
        blocks:
          - type: paragraph
            body: >-
              On headline math, Evoken does not look expensive relative to global AI creative peers: US$2 billion on
              US$300 million ARR is roughly 6.7 times ARR. That is below the Canva reference range of about 10.5 times
              to 16 times ARR and below Sacra's Gamma example at roughly 20.6 times. Midjourney's reported US$500
              million revenue and US$10 billion valuation imply a much richer creative-AI benchmark. The discount is
              rational because Liblib is not yet proven to own the gross-margin stack. China Biz Insider's adverse read
              is central: Evoken does not train its own foundation models, and each generation job depends on
              third-party model providers, so the company's economics are a spread between retail pricing and wholesale
              model-API or compute costs. The best upside case is that community assets, workflows, and B-side
              production integration create enough lock-in to negotiate volume discounts and preserve spread. The
              downside case is that first-party model vendors cut prices, bundle the workflow, or force Liblib to
              subsidize usage to defend share.
