companyProfile:
  summary: >-
    Liblib (LiblibAI, 哩布哩布AI) is a Beijing-based generative-AI creative platform launched in 2023 and operated by parent
    company Evoken (formerly Beijing Qidian Xingyu Technology / Yanyu Technology). It is China's largest AI
    image-creation community and model-sharing marketplace, built on the Stable Diffusion / SDXL / Flux / ComfyUI
    ecosystem with custom LoRA fine-tuning. In June 2026 it raised a ~US$300M Series B+ at a valuation above US$2
    billion, becoming an AI application-layer unicorn.
  foundedDate: '2023-05-16'
  founders:
    - name: Chen Mian (陈冕)
      role: Founder & CEO
      background: >-
        Previously led global commercialization of ByteDance's Jianying / CapCut; prior roles at Mobike, Didi and
        MissFresh.
      claimRefs:
        - CO007
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    Freemium AI creative platform: text-to-image and image-to-image generation, ControlNet workflows, custom LoRA model
    training, a model-sharing marketplace (500,000+ original models), a developer API, plus newer lines LibTV (AI
    video), Xingliu (domestic design agent) and Lovart (international design agent).
  customerFocus: >-
    Individual AI creators and designers (C-side) plus enterprise/professional content producers (B-side) in
    short-drama/film, advertising, gaming, animation and e-commerce.
  businessModel: >-
    Freemium SaaS — free tier with credits, paid subscriptions and compute credits (C-side), and API / enterprise
    licensing / private deployment (B-side).
  stage: Series B+ (private unicorn)
  fundingStatus: >-
    Raised ~US$300M Series B+ in June 2026 at >US$2B valuation, co-led by Granite Asia, Tencent and Shunwei Capital;
    total lifetime capital raised exceeds US$500M.
