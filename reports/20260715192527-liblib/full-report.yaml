      - number: '3.4'
        title: Adverse evidence and open diligence items
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is material. Skywork’s SeaArt review highlights content-safety loopholes around
              explicit material, and Baidu Baike records a separate CCTV-related content-safety issue for Liblib itself.
              Those facts do not prove SeaArt is stronger than Liblib, but they show that platforms competing for open
              community creation inherit moderation, licensing, and brand-safety burdens. Cybernews adds a
              commercial-risk angle by flagging SeaArt’s pricing and licensing clarity; Recatools flags Wujie’s dense
              Chinese-only workflow; and the Civitai/Midjourney comparisons show that professional users may rationally
              maintain multiple tools. The open-source and third-party model ecosystem also means workflows can be
              copied faster than communities can. Before underwriting a US$2 billion-plus valuation premium, diligence
              should refresh traffic metrics, directly test creator migration friction, collect enterprise contract
              retention data, and obtain current evidence for under-sourced rivals such as 6pen and PixAI.
