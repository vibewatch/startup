        title: Scale, product portfolio, and adverse flags
        blocks:
          - type: paragraph
            body: >-
              The headline operating metrics are strong enough to justify unicorn-level attention but must be read with
              caveats. The canonical current metrics are more than 30 million cumulative LiblibAI users, more than
              500,000 original models, more than 5 million images generated per day, and ARR above US$300 million as of
