        blocks:
          - type: paragraph
            body: >-
              Liblib / Evoken's financing history is the core timeline of record for the whole report. The company
              appears to have moved from a US$3.5 million angel round at about a US$15 million valuation in 2023 to
              multiple 2024 rounds that validated the AI-image community, then to several-hundred-million-RMB financing
              in early 2025. The October 2025 US$130 million Series B created a public application-layer financing
              benchmark in China and brought HSG / Sequoia China, CMC Capital, Ant, Lenovo Capital, Shunwei, Source
              Code, Mingshi, Yingce, and INCE into the story. The June 2026 Series B+ is the step-change: roughly US$300
              million at more than US$2 billion post-money, led by Granite Asia, Tencent, and Shunwei, with HT
              Investment, Times Capital, Gaorong, Ant, and HSG / Sequoia China also cited. The investor map therefore
              mixes financial venture capital, strategic technology capital, and repeat insiders, while the stated use
              of proceeds keeps the focus on R&D, global expansion, and product portfolio build-out.
