              experiment. Two diligence negatives belong in chapter 1, not buried later: CCTV named LiblibAI in a
              porn-generation loophole exposé, and 2025 reporting said the company had not yet turned profitable. Both
              risks are compatible with fast growth; neither should be ignored. materially.
