      - number: '7.2'
        title: The biggest legal tail risk is not a fine; it is interruption of creator workflows
        blocks:
          - type: paragraph
            body: >-
              The hardest risk to underwrite is the combination of user-generated models, generated outputs, and content
              moderation. CCTV's 2026 exposure that LiblibAI could be prompted around filters to generate pornographic
              or inappropriate content is directly relevant because the Chinese AIGC regime is enforcement-oriented and
              increasingly labeling-centered. The company reportedly undertook technical rectification, but investors
              need evidence that fixes are durable under adversarial prompts and not merely reactive. Copyright risk is
              similarly workflow-specific. Ultraman v Acgnai did not make every training act illegal; the Hangzhou
              courts were comparatively tolerant of input-stage training and focused liability on stable infringing
              outputs, promoted LoRA models, platform profit, obviousness, and failure to take preventive measures. That
              is precisely why Liblib's model-sharing and LoRA marketplace needs robust IP review, complaint channels,
              model blocking, labeling, and takedown operations. The damages number was only RMB 30,000, but
              injunctions, delisting, or enterprise procurement blocks would be much more material.
            claimRefs:
              - CR012
              - CR013
              - CR014
              - CR015
