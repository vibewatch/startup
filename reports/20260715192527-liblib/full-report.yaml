    rows:
      - - Aggregator gross margin
        - Third-party model APIs and compute resale drive spread economics.
        - ARR quality is weaker without product-level contribution margin.
        - Gross margin by product, model family, and usage cohort.
      - - Model access and substitution
        - First-party providers can cut prices, bundle apps, or restrict APIs.
        - Workflow lock-in must offset commodity model access.
        - API terms, queue times, provider concentration, and churn after price changes.
      - - Capital intensity
        - US$300M B+ supports R&D, global expansion, and product portfolio build-out.
        - Financing reduces runway risk but may mask subsidy dependence.
        - Monthly burn, cloud commitments, prepaid model credits, and payback.
      - - Not yet profitable
        - AIbase reported no profitability as of the Series B period.
        - Growth may be venture-funded rather than self-funding.
        - EBITDA, cash runway, CAC payback, and usage-based unit economics.
      - - Enterprise procurement risk
        - Named customers increase proof but also audit expectations.
        - Compliance failures could slow B-side adoption.
        - Security/legal questionnaires, rejected procurement counts, and renewal data.
      - - Founder concentration
        - Founder-led velocity is central to product expansion.
        - Execution upside is paired with succession and control risk.
        - Board minutes, delegation map, key-person insurance, and succession plan.
