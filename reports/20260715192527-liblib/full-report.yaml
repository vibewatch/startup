      - number: '3.3'
        title: Moat durability, switching costs, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Liblib’s moat is strongest where Chinese-language community, model supply, workflow know-how, and
              professional B-side demand reinforce one another. A designer or short-drama studio that already depends on
              Liblib-hosted models, LoRA training, workflow templates, and Chinese moderation/compliance infrastructure
              faces a higher switching cost than a casual prompt user. Yet the evidence also supports a multi-homing
              thesis. Reviews describe Civitai as the control and model-ownership option, Midjourney as the speed and
              quality option, and SeaArt/Tensor/Wujie/AituBo as overlapping direct tools. Those alternatives reduce
              Liblib’s ability to monetize every use case, especially when teams can mix one platform for exploration,
              another for polished outputs, and local Stable Diffusion pipelines for sensitive assets. The practical
              diligence issue is not whether Liblib has a moat; it is whether the moat is deep enough to protect
              take-rate and margins when feature parity arrives quickly. Multi-homing should therefore be treated as the
              default user behavior until Liblib proves exclusive assets, superior Chinese creator liquidity, or
              enterprise workflow data that competitors cannot easily copy.
