      - number: '7.4'
        title: Governance diligence should focus on concentration, controls, and measurable tripwires
        blocks:
          - type: paragraph
            body: >-
              People and governance risk is moderate but real. Chen Mian's prior CapCut commercialization experience is
              an asset because the company depends on rapid product-market-fit judgment, but the same evidence makes the
              thesis founder-centered. The source pack's reported 73.95% founder stake and later legal-representative
              change should not be treated as misconduct; they should be diligence prompts for board composition,
              reserved matters, related-party controls, information rights, and succession planning. The practical
              investment process should convert every major risk into a trigger: repeat CAC or app-store action,
              unresolved AIGC labeling deficiency, another CCTV-grade moderation failure, unresolved IP notice backlog,
              injunction against LoRA workflows, loss or repricing of critical model APIs, or evidence that
              product-level gross margin remains structurally negative after scale. Liblib is attractive only if
              compliance, IP operations, and model-procurement discipline become as repeatable as product launches. The
              evidence also leaves several quantitative questions open: current compliance staffing, notice volumes,
              red-team failure rates, and API-provider concentration are not public, so each should be a closing
              deliverable rather than a post-investment improvement plan.
            claimRefs:
