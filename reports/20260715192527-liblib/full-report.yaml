        title: Differentiation is localized workflow density; the risk is third-party model dependence
        blocks:
          - type: paragraph
            body: >-
              The constructive technology thesis is that Liblib has accumulated a localized Chinese creator ecosystem:
              creators upload, train, and share LoRA models and workflows, while ordinary users reuse those resources
              without owning GPUs or mastering local tooling. That can be more defensible than a single prompt interface
              because community assets, style libraries, workflow templates, and production habits create switching
              costs. The adverse thesis is equally important. China Biz Insider reports that Evoken does not develop
              proprietary foundation models and that LibTV uses third-party model APIs, including Seedance 2.0 through
              Volcano Engine. If model owners lower direct prices, restrict access, or bundle first-party workflow
              applications, Evoken’s gross margin and differentiation could compress quickly. Compliance is another
              product risk: CAC filing context and the reported CCTV content-safety incident show that moderation and
              labeling are not afterthoughts. The underwriting conclusion is a workflow-application moat with strong
              traction, but one that requires private diligence on model contracts, safety remediation, API controls,
              and contribution margin by product line.
