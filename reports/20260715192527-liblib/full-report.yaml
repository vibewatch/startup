        - 36Kr reports Liblib became China's first AI-community platform to complete Interim Measures filing.
      - - AIGC Labeling Measures and GB 45438-2025
        - Effective Sept 1 2025
        - CAC, MIIT, MPS, NRTA, TC260/SAMR
        - >-
          Requires explicit and implicit labels, metadata or watermark controls, user notices, and app-store material
          checks.
      - - CAC generative-AI filing registry notice
        - Nov 11 2025
        - Cyberspace Administration of China
        - >-
          Shows continuing registry expectations: 611 services filed and 306 applications/functions registered by Nov 1
          2025.
      - - Draft comprehensive AI law
        - Official draft Dec 2025; enactment unclear
        - National legislative process tracked by Deep Lex
        - Creates uncertainty over future horizontal AI duties beyond sectoral AIGC rules.
      - - Beijing Internet Court AI-image copyright line
        - 2023 ruling and 2025 follow-on
        - Beijing Internet Court
        - Copyright can exist when human creative input is evidenced; weak process records can defeat claims.
      - - Ultraman v Acgnai LoRA dispute
        - 2024-2025
        - Hangzhou Internet Court and Hangzhou Intermediate People's Court
        - >-
          AIGC platform held contributorily liable for stable infringing LoRA outputs; RMB 30,000 damages plus
          cessation.
      - - Guangzhou Internet Court Ultraman AIGC case
        - Feb 2024
        - Guangzhou Internet Court
        - >-
          Earlier AIGC service-provider liability signal; emphasizes technical measures, complaint reporting, risk
          notices, and labeling.
