      - number: '1.1'
        title: Identity, structure, and business model
        blocks:
          - type: paragraph
            body: >-
              Liblib should be treated in this report as the operating AI creative platform brand inside Evoken, the
              corporate group that had been known as Qidian Xingyu / Yanyu Technology before adopting the Evoken name in
              June 2026. The hard identity facts are Beijing headquarters, May 2023 operating-company formation, and a
              flagship LiblibAI product that began as an AI image-generation and model-sharing community. The business
              model is not a generic chatbot wrapper: it combines a creator community, model marketplace, cloud
              generation, LoRA training, and paid professional workflows. That structure matters because later chapters
              can assess market, product, and valuation around a coherent chain: community models and assets feed
              generation, video production, and design-agent use cases. The official site remains useful only as a
              company claim because it is JavaScript-only, so the durable identity base here relies on third-party news,
              registry-like Baike pages, and the CAC filing ecosystem.
