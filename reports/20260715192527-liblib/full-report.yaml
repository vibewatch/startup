  - id: TR003
    title: Copyright and IP case precedents relevant to Liblib
    columns:
      - Precedent
      - Holding or lesson
      - Implication for Liblib
      - Key mitigation
    rows:
      - - Li v Liu, Beijing Internet Court
        - >-
          AI-generated image can be copyrightable when human prompting and parameter choices show intellectual
          achievement.
        - >-
          Users may own protectable outputs if they preserve process evidence, affecting marketplace ownership and
          disputes.
        - Prompt history, generation records, output provenance, and user disclosures.
      - - 2025 Beijing Internet Court cat-pendant case
        - Claim failed where the creator lacked original process records and relied on after-the-fact simulation.
        - Liblib should enable creator traceability rather than relying on recreated prompt narratives.
        - Exportable generation logs, version history, and audit trails.
      - - Ultraman v Acgnai, Hangzhou
        - >-
          Training may be treated leniently, but stable infringing outputs and platform promotion can trigger
          contributory liability.
        - LoRA marketplaces are exposed when well-known IP models are promoted, reused, or monetized.
        - IP detection, model de-listing, notice-and-takedown, risk prompts, and moderation of covers/examples.
      - - Guangzhou Internet Court Ultraman case
        - AIGC service provider ordered to stop infringing generation and compensate RMB 10,000.
        - Even service-layer providers can face duties to prevent substantially similar outputs.
        - Keyword/model filters, complaint reporting, user warnings, and generated-content labels.
      - - EU IP Helpdesk analysis of Ultraman
        - Duty of care rises with profitability, architecture, and ability to prevent infringement.
        - As Liblib monetizes subscriptions, credits, and enterprise use, courts may expect higher controls.
        - Commercial-risk tiering, preemptive prevention, and fast remediation evidence.
    notes: >-
      Cases are not formal binding precedent in a common-law sense, but they are highly relevant judicial signals for
      platform duty-of-care underwriting.
    claimRefs:
      - CR015
      - CR016
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR024
