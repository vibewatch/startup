      - number: '2.3'
        title: Segments, buyers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Adoption splits across professional creators, studio buyers, enterprise marketing teams, and platform
              ecosystems. The end user may be a designer, prompt artist, producer, editor, or operations team, but the
              payer is typically a studio, agency, brand, game company, e-commerce merchant, or enterprise department
              that already budgets for faster content output. IMARC’s market segmentation confirms that image generation
              platforms and video generators are recognized AIGC solution classes, and 6Wresearch shows that Chinese
              image generation is shaped by Baidu, Alibaba, Tencent, ByteDance, SenseTime, Meitu, and other large
              ecosystems. Liblib’s market positioning therefore needs two filters: can it own creator workflow and asset
              reuse despite giant-model alternatives, and can it convert the creator community into paid teams in
              short-drama, advertising, design, and e-commerce workflows? The buyer journey also implies multi-homing at
              the model layer but higher stickiness at the asset layer: teams may test several image or video models
              while retaining the platform that stores approved templates, production histories, and community-trained
              models.
