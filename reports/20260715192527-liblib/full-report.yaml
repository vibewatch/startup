            title: 'Valuation stance: fair, with upside if workflow lock-in is real'
            body: >-
              The current price is not the frothy part of the story; the unresolved issue is whether US$300M ARR
              converts into durable, high-margin workflow revenue rather than subsidized model-API resale.
