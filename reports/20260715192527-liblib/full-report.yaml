      - number: '8.4'
        title: 'Final judgment: justified, but with China AI froth and compliance haircuts'
        blocks:
          - type: paragraph
            body: >-
              China’s 2026 unicorn context adds both support and caution. Nation Press reports 67 new Chinese unicorns
              in H1 2026, and Hurun’s global index shows AI as the main engine of private-market value creation. That
              means Liblib is not an isolated financing anomaly; it sits inside a broad capital reallocation toward AI
              applications, robotics, infrastructure, and workflow automation. The adverse counterweight is equally
              important: China Biz Insider’s embodied-AI reality check warns that many AI unicorns with short runways
              may face consolidation, down-rounds, or failure in 2027–2028. Liblib is better positioned than many
              concept-stage peers because it has reported ARR and a blue-chip syndicate, but regulatory/content-safety
              exposure and the lack of public margin metrics deserve explicit valuation haircuts. On the public record,
              the greater-than-US$2 billion valuation is justified, but only as a fair, evidence-sensitive entry price
              rather than a clear bargain. Therefore the correct IC posture is not to reject the round as AI exuberance,
              but to demand proof that revenue quality is stronger than the discount implies: audited ARR bridges,
              customer cohorts, contribution margin, and compliance controls would move the stance from fair to
              attractive.
            claimRefs:
