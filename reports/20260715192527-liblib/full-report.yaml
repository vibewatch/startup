  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Headline valuation: a large round but a modest ARR multiple'
        blocks:
          - type: paragraph
            body: >-
              Liblib / Evoken’s June 2026 financing looks optically large but not obviously inflated when normalized by
              the public ARR evidence. Multiple independent reports converge on a roughly US$300 million Series B+
              round, a post-money valuation above US$2 billion, and May 2026 ARR of about US$300 million. That places
              the headline round at approximately 6.7x ARR, before any adjustment for cash on the balance sheet or
              preferred terms that are not public. For a two-year-old AI application group with more than 30 million
              users, 500,000 original models, and reported professional-content budgets behind the revenue, the price is
              surprisingly disciplined. The underwriting question is therefore not whether investors paid a classic
              AI-bubble multiple; it is whether the reported ARR is recurring, retained, and gross-margin-positive after
              third-party model and compute costs. That framing also makes the valuation easier to compare with
              conventional SaaS: if the greater-than-US$2 billion mark is treated as a lower-bound enterprise value,
              every additional dollar above US$2 billion only moves the multiple modestly unless the true post-money is
              far higher than disclosed.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
