              application-layer company being funded as a category leader. The local funding facts needed for this
              chapter are straightforward: a small 2023 angel round, a cluster of 2024 and early-2025 rounds, a US$130
              million Series B in October 2025, and a June 2026 Series B+ of roughly US$300 million at more than US$2
              billion post-money. The important underwriting point is not simply the chronology, but what it says about
