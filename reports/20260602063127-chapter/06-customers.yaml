- id: expansion-and-concentration-risks
  title: Expansion opportunities and concentration risks
  body: 'Public evidence suggests Chapter has several plausible expansion loops. Partner-led distribution can compound if health systems, advisor networks, and creators continue to refer retirees into the workflow. The OTC app and year-round advocacy support create a path from a one-time enrollment event into ongoing engagement. Fierce Healthcare also says the company uses little DTC advertising, which implies the GTM is intentionally built around trusted intermediaries rather than around expensive national-media acquisition. If those partner channels renew and deepen, the model could be durable and efficient.


    The problem is that public sources still do not reveal how concentrated that partner base is or how durable those relationships are economically. There is no top-partner mix, no contract-length disclosure, no exclusivity detail, and no revenue share by channel. The same partner-led strategy that makes the customer story look credible can therefore become a concentration risk if a few health systems, advisor programs, or publishers dominate growth. Adverse outside commentary adds another layer: Medicare Rights warns that broker incentives can distort advice, and KFF shows a noisy acquisition environment dominated by marketing intermediaries. The customer verdict is favorable on proof of real adoption, but still conservative on concentration and renewal quality.'
