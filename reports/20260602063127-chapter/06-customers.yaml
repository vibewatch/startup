- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Channel
  - Impact
  - Diligence path
  rows:
  - - Partner-led health-system expansion
    - Health systems
    - Can add many Medicare-eligible patients quickly when payer exits or transitions occur
    - Request top-system volumes, renewal terms, and revenue share by health-system account
  - - Advisor-network expansion
    - Financial advisors
    - Can compound via client retention and referral loops
    - Request advisor-firm conversion, retained usage, and referral economics
  - - Publisher / creator distribution
    - Content and referral partners
    - Can generate high-intent leads without large DTC spending
    - Request conversion, CAC, and concentration by creator or publisher
  - - OTC and year-round support cross-sell
    - Existing members
    - Can improve retention and post-enrollment engagement
    - Request OTC attachment, repeat usage, and advocacy contact rates
  - - Low direct-to-consumer marketing
    - GTM design
    - Supports efficient channel focus but increases dependency on large partners
    - Stress test what happens if one or two major partner cohorts slow materially
  - - Opaque contract economics
    - All enterprise channels
    - Makes it hard to tell whether visible logos translate into durable high-margin revenue
    - Review top contracts for exclusivity, termination rights, and pricing power
  notes: Expansion looks credible, but public evidence does not reveal how concentrated the partner base is or whether any single channel dominates economics.
