chapter:
  number: 6
  title: Customers
  summary: 'Chapter''s public customer record is stronger than its private-company disclosure profile: it has visible health-system, advisor, publisher, and creator partnerships, deep public review volume, and several named case studies with quantified outcomes. The missing piece is durability math—public sources still do not disclose exact customer count, renewal, NRR, churn, or concentration by partner, so the customer story looks credible and promising but not yet fully underwritten.'
sections:
- id: segments-and-acquisition-surfaces
  title: Customer segments, buyers, and acquisition surfaces
  body: 'Chapter''s customer map is multi-sided. The end user is the retiree or Medicare beneficiary, but the public buyer map runs through health systems, financial advisors, publishers, creators, and a long tail of institutional channels. The partnerships page explicitly segments providers and health systems, financial advisors, content publishers, and other organizations. ReviewFeeder extends that picture to employers, benefits professionals, non-profits, religious institutions, and community leaders. The customer story is therefore not just direct-to-consumer Medicare help. It is partner-embedded distribution into trusted existing relationships.


    The public content footprint shows that segmentation is also use-case driven. Chapter maintains dedicated guides for people still working after 65, for hearing-aid coverage, for IRMAA and Part B/Part D premium sensitivity, for tax-day financial questions, and for home health care. These are not direct adoption metrics, but they do show which problems Chapter is trying to own across the retiree journey. Combined with the live partner pages, the customer model looks intentionally broad: high-intent retirees, referred households, and existing members who may keep interacting with Chapter after enrollment through advocacy or OTC benefit activation.'
