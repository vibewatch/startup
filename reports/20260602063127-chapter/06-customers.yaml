- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Strategic value
  - Gap
  rows:
  - - Direct beneficiaries
    - User = senior or retiree household; payer = Medicare plan / carrier economics
    - Choose, switch, and use Medicare coverage
    - 6,126 reviews and persistent testimonials
    - Core proof that Chapter is serving real end users, not just channel partners
    - Exact active-member count still undisclosed
  - - Financial advisors
    - Buyer = advisor or wealth firm; user = retiree client
    - Protect retiree outcomes and preserve client relationships
    - Raymond James and Mercer proof; financial-advisor partner flow
    - Can reduce advisor friction around one of the most consequential retirement decisions
    - No disclosed revenue per advisor or firm
  - - Health systems
    - Buyer = health system; user = Medicare-eligible patient
    - Keep patients in-network during carrier exits or retirement transitions
    - Zoa case metrics plus HSHS announcement
    - Creates sticky distribution tied to patient retention economics
    - No disclosed concentration by health-system partner
  - - Publishers / creators
    - Buyer = publisher or creator; user = audience member
    - Monetize trusted senior audiences with advice and enrollment support
    - Dr. Ed and RamseyTrusted evidence
    - High-intent audience acquisition without heavy DTC spend
    - Conversion economics by creator channel undisclosed
  - - Community / employer-adjacent organizations
    - Buyer = institution; user = members, employees, congregants, or community audience
    - Extend benefits guidance into existing trusted relationships
    - ReviewFeeder mentions employers, benefits professionals, non-profits, and religious institutions
    - Broadens distribution beyond classic brokerage
    - Specific logos and renewal terms mostly undisclosed
  - - Existing members using post-enrollment tools
    - Buyer/user = existing beneficiary
    - Redeem OTC benefits and navigate support questions year-round
    - Advocacy article and OTC app signals
    - Supports land-and-expand and retention beyond initial enrollment
    - Repeat usage and attachment-rate data undisclosed
  notes: Segments reflect the public buyer and user map rather than revenue-weighted cohorts. Where scale is missing, the table preserves the gap rather than inventing it.
