- id: named-proof-and-adoption-trajectory
  title: Named customer proof and adoption trajectory
  body: 'Chapter''s strongest public customer evidence comes from named deployments and partner pages rather than from a published customer-count dashboard. The partnerships page contains three unusually specific case studies for a private Medicare-navigation company: Zoa Life, Mercer Financial, and Dr. Ed. Zoa offers the cleanest quantified operational proof because it claims 99% of affected patients stayed in-network and that the health system retained 4.5 times more patients than in prior campaigns. Mercer supplies a real sign-on metric with well over half of clients reportedly using Chapter, and Dr. Ed adds creator-channel proof tied to thousands of followers served. Those are meaningful signals even though all three live on company-controlled surfaces.


    Third-party and partner-controlled pages reinforce that the logos are live rather than decorative. HSHS describes free unbiased consultations and year-round guidance for current and newly eligible patients. Raymond James has both a dated announcement and a still-live partner workflow with dedicated Medicare experts, all coverage options, and year-round support. RamseyTrusted provides another live acquisition surface plus testimonials. The adoption trajectory is still incomplete, but there are enough signals to say the business is not hypothetical: 4x enrollment growth, thousands of visible reviews, case-study metrics, and multiple active partner flows all point to real distribution at scale.'
