evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Exact current valuation, price per share, preference stack, and secondary-sale history for the 2026 Series E and
      prior rounds.
    whyItMatters: >-
      Without financing terms, it is impossible to judge dilution, downside protection, or whether the reported
      valuation step-up came with structure.
    diligencePath: >-
      Request the full cap table, latest financing docs, and any secondary transfer schedule directly from the company
      or lead investor.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: >-
      Audited or at least management-certified count of annual enrollments, active members, and partner-sourced
      customers.
    whyItMatters: >-
      Public growth claims are strong, but the company does not disclose the denominator behind those statements,
      limiting underwriting on scale and retention.
    diligencePath: Request historical enrollment, retained-customer, and partner-contribution cohorts by quarter.
    relatedQuestionRefs:
      - QO025
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-roster-TO002
    missingEvidence: >-
      A complete current executive and board roster beyond the handful of founders and directors surfaced in public
      sources.
    whyItMatters: >-
      Without a current roster, key-person risk and functional coverage cannot be assessed with confidence from public
      evidence alone.
    diligencePath: Request an org chart, board list, and executive bios directly from the company or data room.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: debt-and-secondaries
    missingEvidence: Any disclosed debt, warehouse financing, or secondary transactions involving employees or early investors.
    whyItMatters: >-
      The public story is entirely equity-round based; hidden leverage or large secondaries could materially change the
      risk profile.
    diligencePath: >-
      Ask management and lead investors for debt schedules, board consents, and any secondary-sale history since Series
      A.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: dollar-tam
    missingEvidence: >-
      A direct public estimate of annual revenue pool or gross margin pool for independent Medicare navigation and
      brokerage services.
    whyItMatters: >-
      Beneficiary counts and plan counts show complexity, but they do not directly translate into venture-scale revenue
      opportunity.
    diligencePath: Obtain commission schedules, enterprise contract ranges, or internal contribution-margin data by customer channel.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: >-
      Average revenue per beneficiary, average commission economics, and partner-funded economics across health-system,
      advisor, and publisher channels.
    whyItMatters: Without channel economics, it is impossible to convert market demand into unit-economic conviction.
    diligencePath: Request channel-level CAC, monetization, take-rate, and retention data from the company.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: policy-stability
    missingEvidence: >-
      A settled post-litigation view of broker-compensation rules and marketing enforcement after the 2024-2025 court
      challenges.
    whyItMatters: Rule instability can change broker economics and compliance cost assumptions from one season to the next.
    diligencePath: Track final court outcomes, rule updates, and CMS guidance releases before underwriting long-term economics.
    relatedQuestionRefs:
      - QM019
      - QM020
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: private-entrant-disclosure-gap
    missingEvidence: Exact carrier counts, customer counts, funding history, and partner concentration for CoverRight and Healthpilot.
    whyItMatters: >-
      Without those data, the private-challenger rows in the competitor profile table can only be partial and cannot be
      sized rigorously against Chapter or the public brokers.
    diligencePath: >-
      Request investor decks, partner lists, and current enrollment or customer counts from company spokespeople or from
      due-diligence materials.
    relatedQuestionRefs:
      - QP013
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Realized commission rates, renewal mix, partner revenue share, and contribution margin by channel for Chapter and
      the private entrants.
    whyItMatters: >-
      The category markets itself as free to the consumer, so backend economics determine whether any growth is durable
      or merely volume-driven.
    diligencePath: Obtain carrier contracts, commission schedules, partner agreements, and channel-level contribution analysis.
    relatedQuestionRefs:
      - QP009
      - QP018
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: blocking
    topic: internal-build-gap
    missingEvidence: >-
      Public benchmarking of build-versus-buy cost and implementation time for RIAs, health systems, or publishers that
      might internalize Medicare-navigation workflows.
    whyItMatters: >-
      Internal build is a credible substitute, but without cost or time data it cannot be ranked cleanly against
      specialist vendors.
    diligencePath: >-
      Interview partners that considered multiple vendors, collect implementation timelines, and compare internal
      staffing cost to vendor pricing.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: partner-retention
    missingEvidence: >-
      Enterprise partner retention, exclusivity terms, and implementation burden for Chapter and peer distribution
      channels.
    whyItMatters: >-
      Distribution looks like the most durable moat candidate, but that cannot be underwritten from marketing pages
      alone.
    diligencePath: Review partner contracts and churn data; ask for cohort retention by channel and attach-rate metrics.
    relatedQuestionRefs:
      - QP019
      - QP025
      - QP026
  - type: private-evidence-only
    severity: blocking
    topic: cash-gap
    missingEvidence: Current consolidated cash balance, monthly burn, and formal runway for Chapter.
    whyItMatters: Without cash and burn, capital adequacy cannot be judged even after the 2025 and 2026 raises.
    diligencePath: Request the latest board package or monthly finance pack showing unrestricted cash, burn, and runway scenarios.
    relatedQuestionRefs:
      - QI017
      - QI023
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: debt-gap
    missingEvidence: Debt facilities, receivable financing, covenants, and working-capital obligations.
    whyItMatters: Brokerage models can hide financing pressure in receivables, warehouse lines, or other short-duration facilities.
    diligencePath: Request debt schedules, covenant packages, and any facilities secured by receivables or commissions.
    relatedQuestionRefs:
      - QI018
      - QI021
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: >-
      Initial versus renewal revenue, carrier concentration, realized commission rates, and partner revenue-share
      economics.
    whyItMatters: Revenue durability depends on renewals and partner concentration more than on topline ARR alone.
    diligencePath: Review carrier contracts, revenue-recognition memos, and cohort economics by carrier, product, and channel.
    relatedQuestionRefs:
      - QI003
      - QI021
      - QI024
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cac-gap
    missingEvidence: Channel-level CAC, payback period, content-funnel conversion, and contribution margin.
    whyItMatters: The GTM could be highly efficient or capital intensive; public materials do not let investors tell the difference.
    diligencePath: >-
      Request channel funnel dashboards from first touch to realized cash, including partner, content, and
      direct-response sources.
    relatedQuestionRefs:
      - QI019
      - QI020
      - QI024
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: adjacent-products
    missingEvidence: >-
      Revenue and margin contribution from provider directory, Rx savings, and broader retirement products beyond core
      Medicare navigation.
    whyItMatters: Expansion products could improve LTV, but they could also be pre-revenue investment lines.
    diligencePath: Break out live revenue, attachment, and gross margin for each non-core product line launched since 2025.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: security-gap
    missingEvidence: >-
      Third-party security certifications, audit reports, or implementation detail behind privacy and HIPAA control
      claims.
    whyItMatters: >-
      Website badges and legal text help, but they do not prove production controls, audit frequency, or operational
      readiness.
    diligencePath: >-
      Request the latest security packet, certification letters, penetration-test summary, and HIPAA/compliance control
      owner matrix.
    relatedQuestionRefs:
      - QE022
      - QE025
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: Provider-directory accuracy, prescription-cost-calculator precision, refresh cadence, and system uptime metrics.
    whyItMatters: >-
      These modules directly affect recommendation quality and post-enrollment trust, yet public materials do not
      quantify whether they work reliably.
    diligencePath: >-
      Request QA dashboards, accuracy studies, vendor SLAs, incident logs, and module-level uptime reporting for the
      directory and calculator.
    relatedQuestionRefs:
      - QE023
      - QE025
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: otc-gap
    missingEvidence: OTC app attachment rate, repeat usage, retailer economics, and gross merchandise volume.
    whyItMatters: >-
      The OTC Store is one of the clearest year-round expansion modules, but it could be a powerful retention surface or
      merely a lightly used add-on.
    diligencePath: >-
      Obtain OTC monthly active users, redemption frequency, retailer mix, gross merchandise value, and margin
      contribution by cohort.
    relatedQuestionRefs:
      - QE012
      - QE013
      - QE024
    relatedTableRefs:
      - TE001
      - TE005
  - type: private-evidence-only
    severity: material
    topic: ai-governance-gap
    missingEvidence: >-
      Model-governance documentation, human-review thresholds, override rules, and error-handling for AI-assisted
      recommendations.
    whyItMatters: >-
      AI-native positioning raises the bar for explainability and control in a regulated, high-stakes recommendation
      workflow.
    diligencePath: >-
      Request product-risk reviews, model cards, escalation rules, and any advisor tooling audit that documents where
      humans can inspect or override AI outputs.
    relatedQuestionRefs:
      - QE017
      - QE025
    relatedTableRefs:
      - TE003
      - TE005
  - type: private-evidence-only
    severity: material
    topic: durability-metrics
    missingEvidence: Enterprise and beneficiary NRR, GRR, churn, renewal rates, contract lengths, and cohort retention curves.
    whyItMatters: >-
      Public customer proof is strong, but underwriting durability without real retention metrics would overstate
      confidence in the recurring value of the customer base.
    diligencePath: >-
      Request partner renewal reports, beneficiary retention cohorts, contract terms, and any internal dashboard that
      tracks repeat usage or annual re-enrollment support.
    relatedQuestionRefs:
      - QU018
      - QU022
      - QU025
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: >-
      Top-partner contribution, revenue share, exclusivity, and concentration by health system, advisor network,
      publisher, or creator.
    whyItMatters: A partner-led GTM can be efficient and sticky, but it can also hide outsized dependence on a few relationships.
    diligencePath: >-
      Request channel-mix dashboards, top-10 partner contribution, exclusivity clauses, and termination rights across
      major agreements.
    relatedQuestionRefs:
      - QU020
      - QU023
      - QU025
    relatedTableRefs:
      - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-count-gap
    missingEvidence: Exact active-member count, annual enrollment count, and active members by channel.
    whyItMatters: >-
      Reviews and case studies prove real usage, but they do not cleanly translate into the active customer base
      investors would underwrite.
    diligencePath: Request active-member dashboards, completed enrollments by year, and channel-level active-user counts.
    relatedQuestionRefs:
      - QU008
      - QU024
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
