- id: trust-controls-and-compliance
  title: Trust, compliance, and consumer-protection controls
  body: 'Trust is a core part of the product, not just a legal footnote. Chapter publishes an unusually explicit licensing page, including state-by-state producer licenses, the agency''s NPN, the New York address, and a complaint path. The legal and partner pages repeatedly disclose that Chapter is not affiliated with Medicare or any government entity, that it represents many but not all plans, and that users can still ask Medicare.gov or 1-800-MEDICARE for the full set of options. The partner booking flow is equally explicit about express written consent for calls and texts and labels the interaction as a solicitation of insurance from a licensed agent.


    The most important trust control is incentive design. Chapter says advisor pay does not vary by plan choice, and the Senate testimony says the company intentionally designed recommendations not to be limited to contracted carriers. That matters because marketing risk in this category is real: the HHS OIG is actively reviewing deceptive Medicare Advantage marketing practices, and Chapter itself has publicly argued that confusing marketing and bad incentives are structural problems. The weakness in the public record is that published controls stop at disclosures, badges, and policy statements. There is no external assurance package showing how these controls are audited or enforced in practice.'
  claimRefs:
  - CE008
