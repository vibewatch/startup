    - No public conversion or handle-time metrics
  - - Questionnaire / 3 Ps intake
    - Beneficiary
    - Collects providers, prescriptions, and priorities before recommendations
    - High — present on live scheduling flows and review mirrors
    - Makes recommendation inputs explicit instead of opaque
    - No public completion-rate or abandonment data
  - - Plan recommendation engine
    - Advisor
    - Uses a Medicare plan data model to evaluate plan types and fit variables
    - High — described in Senate testimony and company releases
    - Claims to consider all plans rather than only contracted plans
    - No public model-governance or accuracy benchmark
  - - Provider directory
    - Member / advisor
    - Helps check whether doctors and facilities are in-network
    - Medium-High — disclosed as a 2025 launch
    - Targets one of the biggest Medicare comparison pain points
    - No public accuracy or refresh-rate disclosure
  - - Prescription cost calculator
    - Member / advisor
    - Compares prescription economics as part of plan selection and use
    - Medium-High — disclosed as a 2025 launch
    - Moves beyond enrollment into cost optimization
    - No public pharmacy-coverage or error-rate metrics
  - - OTC Store app
    - Member
    - Turns OTC credits into grocery and wellness delivery
    - Medium-High — live mobile product with ratings
    - Extends support into benefit utilization, not only plan choice
    - Retailer economics and attachment rates undisclosed
  - - Year-round advocacy
    - Existing member
    - Supports specialist search, benefit activation, and follow-on questions
    - High — documented since 2022 and reaffirmed in Senate testimony
    - Positions Chapter as ongoing navigation, not one-time enrollment
    - No public staffing ratios or case-resolution SLAs
  - - Educational guide library
    - Prospect / member
    - Publishes topic-specific Medicare guides that feed into advisor assistance
    - High — multiple guides live across enrollment, scams, and agent help
    - Creates a dual self-serve plus assisted workflow
    - Traffic and conversion by guide not disclosed
  notes: Module maturity is based on what is publicly live or explicitly disclosed, not on private roadmap access. Gaps identify the unreported operating data still needed for hard underwriting.
