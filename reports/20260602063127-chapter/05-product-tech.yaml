- id: modules-architecture-and-dependencies
  title: Modules, architecture, and critical dependencies
  body: 'Chapter''s public module map now extends beyond basic enrollment help. The guide library shows a self-serve knowledge layer across Medicare basics, Medicare Advantage enrollment, standalone Part D enrollment, licensed-agent selection, scam avoidance, and annual enrollment timing. Above that sits the recommendation engine described in the Senate testimony, and below it sits the advisor operating layer that turns the model into a user-facing recommendation. The 2026 Series E and Fierce coverage then push the stack into year-round utility: a provider directory, a prescription cost calculator, and an OTC Store that lets members redeem wellness or grocery benefits instead of letting them expire unused.


    These modules are only as strong as their dependencies. Provider-directory quality depends on external network data that even CMS historically struggled to centralize. Prescription recommendations depend on shifting formularies, pharmacy economics, and Part D rules. OTC redemption depends on retailer and fulfillment relationships. On top of all that, the product remains constrained by a human advisor layer, which is strategically useful for trust but creates throughput and training dependence. The result is a stack that looks more mature than a simple Medicare call center, but still highly sensitive to external data freshness and operational discipline.'
