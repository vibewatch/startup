- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Real traction: Series D and Series E were both completed, 2025 revenue grew 3x, and ARR exceeded $100M.'
    - Would strengthen further if Chapter disclosed retention, cash conversion, and partner renewal economics.
  - - Partner and customer proof suggest a differentiated trust layer versus pure lead-generation models.
    - Would weaken if complaint rates, partner concentration, or poor-fit anecdotes proved more severe than current public evidence shows.
  - - Public eBrokers trade with compressed equity values and debt or receivable pressure, which argues for valuation discipline.
    - Would matter less if Chapter proves substantially better retention, CAC, and concentration metrics than public peers.
  - - Exact 2026 pricing is undisclosed, so investors are underwriting an opaque mark rather than a transparent one.
    - Would improve immediately if management disclosed the 2026 share price, post-money value, and liquidation preferences.
  - - A premium to public peers may be partly deserved, but the current evidence cannot show how much premium is justified.
    - A stronger premium case requires more audited evidence and a clearer path to durable margins.
  notes: The table separates business-quality arguments from price-discipline arguments so the recommendation does not collapse into a generic company-quality score.
