  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: exact-2026-valuation
    missingEvidence: Exact 2026 share price, diluted share count, and post-money valuation for the Series E.
    whyItMatters: The recommendation is fundamentally price-sensitive; without the exact mark, investors can only bound valuation support rather than underwrite it precisely.
    diligencePath: Request the Series E term sheet or investor deck that states the exact pricing mechanics.
    relatedQuestionRefs:
