  - type: private-evidence-only
    severity: blocking
    topic: cap-table-preferences
    missingEvidence: Liquidation preferences, participating terms, seniority, and any structured-financing features.
    whyItMatters: A seemingly attractive headline valuation can still produce poor common-equity outcomes if the preference stack is heavy.
    diligencePath: Request a counsel-prepared cap-table and preference-summary memo.
