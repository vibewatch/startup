chapter:
  number: 8
  title: Valuation
  summary: Chapter looks like a credible, fast-scaling Medicare-navigation company, but public evidence still does not justify price conviction at the current undisclosed private mark. The last exact valuation anchor was the 2025 Series D at about $1.5 billion; by 2026 management only said the new round more than doubled that figure while ARR surpassed $100 million. Public eBroker comps provide valuation discipline, not a neat premium case, so the right stance is track with medium confidence, a high risk rating, and a stretched valuation view until exact pricing, cap-table terms, burn, and retention data are disclosed.
sections:
- id: recommendation-and-price-discipline
  title: Recommendation and price discipline
  body: 'Chapter looks like a real company with real traction, but valuation requires more than admiration. The cleanest public pricing anchor remains the April 2025 Series D, which was widely reported at about $1.5 billion. The April 2026 Series E clearly raised another $100 million and said valuation more than doubled, yet management did not disclose the exact new number. That combination is enough to frame a stance even without a precise target. It says the company probably moved above a $3.0 billion lower bound at the same time it was only disclosing ARR as being above $100 million and withholding key underwriting inputs like burn, debt, retention, and cap-table terms. In other words: Chapter may be a good company, but public evidence still leaves investors underwriting an opaque price. That makes the right recommendation track rather than buy. The call is not a judgment that the business is broken. It is a judgment that price sensitivity and evidence sensitivity both matter, and the
    current evidence set is stronger on company quality than on the exact fairness of the mark.'
