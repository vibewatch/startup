  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Chapter Series D (2025)
    - Private round
    - ~$1.5B valuation on $75M raise
    - Last exact public pricing anchor for the company
    - One year stale and pre-Series E
  - - Chapter Series E (2026)
    - Private round
    - $100M raise; exact valuation undisclosed; company says >2x prior valuation
    - Current financing context and likely present valuation floor
    - No exact price, share count, or preference terms disclosed
  - - eHealth
    - Public market
    - $49.83M market cap; 0.14x EV/revenue; $110.81M cash / $133.2M debt
    - Shows how harshly the public market can price an established eBroker
    - Business mix and maturity differ from Chapter
  - - GoHealth
    - Public market
    - $19.14M market cap; 4.69x EV/revenue; $39.88M cash / $688.12M debt
    - Shows how leverage can distort EV and compress equity value
    - Debt-heavy outlier; EV/revenue is noisy
  - - SelectQuote
    - Public market
    - $0.17B market cap; 0.51x EV/revenue; $29.81M cash / $404.83M debt
    - Useful public comp with disclosed policy LTV, CAC, and receivables
    - Broader product mix and public-company scale differ from Chapter
  - - Alternative navigation brands
    - Private alternative
    - CoverRight is visible as another Medicare-navigation brand, but no valuation is public
    - Shows the category is not winner-take-all by default
    - No disclosed financials or valuation
  notes: The table mixes exact private-round facts, public-market metrics, and one private-category alternative because public evidence on direct private peers is sparse. Values are reported as reviewed rather than normalized into a single perfect methodology.
