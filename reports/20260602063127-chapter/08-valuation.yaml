- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Retention proves strong, partner concentration is manageable, burn is controlled, and the undisclosed 2026 price is not far above today's lower-bound inference.
    - Could support a premium well above the >$3.0B lower bound because growth and trust metrics would justify paying up for a differentiated broker-like asset.
    - Requires the company to disclose evidence that does not yet exist publicly.
    - Low-Medium
  - - Base
    - Company quality is real, but exact 2026 pricing and capital structure remain undisclosed.
    - Supports a track stance and selective interest only if entry discipline is strong and new diligence reduces opacity.
    - Investors may overpay simply because public evidence is incomplete.
    - Medium-High
  - - Bear
    - Current private markup was far ahead of what retention, burn, and concentration data can support, or a future round clears below expectations.
    - Public-evidence support compresses toward the last exact $1.5B anchor or only modestly above it.
    - Down round, multiple compression, regulation, or trust damage could all force repricing.
    - Medium
  notes: Scenarios are evidence-support bands rather than model-perfect valuation outputs because the exact 2026 mark and cap table remain undisclosed.
