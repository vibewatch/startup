      - number: '5.2'
        title: 模块、架构与关键依赖
        blocks:
          - type: paragraph
            body: >-
              Chapter 的公开模块地图已经超出基本参保帮助。指南库提供自助知识层，覆盖 Medicare 基础、Medicare Advantage 参保、独立 Part D
              参保、持牌代理人选择、防诈骗和年度参保时间。其上是参议院证词中描述的推荐引擎，其下是把模型转化为用户推荐的顾问运营层。2026 年 Series E 和 Fierce
              报道又把技术栈推向全年效用：医生目录、处方成本计算器，以及一个 OTC Store，让会员兑换健康或杂货权益，而不是让权益过期未用。


              这些模块的强度取决于依赖项。医生目录质量依赖外部网络数据，而这类数据连 CMS 历史上都难以集中。处方推荐依赖不断变化的药品目录、药房经济模型和 Part D 规则。OTC
              兑换依赖零售商和履约关系。在这些之上，产品仍受到人工顾问层约束；这对建立信任有战略价值，但也带来吞吐量和培训依赖。结果是，这个技术栈比简单 Medicare 呼叫中心成熟，但仍高度敏感于外部数据新鲜度和运营纪律。
