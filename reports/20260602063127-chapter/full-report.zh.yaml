  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 留存被证明强劲，合作伙伴集中度可控，烧钱受控，且未披露的 2026 年价格没有明显高于当前下限推断。
        - 可能支撑远高于 >$3.0B 下限的溢价，因为增长和信任指标足以证明为差异化的类经纪资产加价。
        - 需要公司披露当前公开材料看不到的证据。
        - 低至中
      - - 基准
        - 公司质量真实，但 2026 年精确定价和资本结构仍未披露。
        - 只有入场价格纪律足够强、且新增尽调降低不透明度时，才支持观察立场，并选择性跟进。
        - 投资人可能只是因为公开证据不完整而付高价。
        - 中高
      - - 悲观
        - 当前私人市场加价远超留存、烧钱和集中度数据可支撑的水平，或未来轮次价格低于预期。
        - 公开证据能支撑的区间压向上一次明确的 $1.5B 锚点，或只略高于它。
        - 下轮降价、倍数压缩、监管或信任受损都可能迫使重新定价。
        - 中
    notes: 情景是证据可支撑区间，而不是模型完美的估值输出，因为确切 2026 年标记和股权结构表仍未披露。
