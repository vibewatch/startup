      - number: '4.3'
        title: 公开牵引与基准经济性
        blocks:
          - type: paragraph
            body: >-
              Chapter 披露的牵引强于其披露的经济模型。公司称 2025 年收入增长三倍、ARR 超过 $100M、员工数保持不变，并上线了医生目录、处方成本计算器等新工具。此前 Series D 公告也强调 4x
              参保增长，并称公司以行业领先水平留住企业伙伴和受益人，但没有公布底层数字。这些结果令人鼓舞，尤其因为它们暗示生产率提升，而不是单纯靠扩招推动扩张。但它们仍是私营公司由管理层挑选的数据点，而不是完整经审计 P&L。


              公开可比数据给出了更严苛的基准。eHealth、GoHealth 和 SelectQuote 都报告了可观收入，但股权价值相对不高；资产负债表也解释了投资者为何谨慎：eHealth 约有 $110.81M
              现金，对应 $133.2M 债务；GoHealth 约有 $39.88M 现金，对应 $688.12M 债务；SelectQuote 约有 $29.81M 现金，对应 $404.83M 债务。Medicare
              Market Insights 反复并列跟踪这三家公司在收入、亏损和 LTV 上的表现，凸显市场把它们视为同一个经济品类。对 Chapter 来说，含义很直接：强劲 ARR
              增长有帮助，但行业背景表明，投资者最终会关心续约耐久性、应收款质量、债务承受力和现金转化，至少不亚于关心收入增长。
