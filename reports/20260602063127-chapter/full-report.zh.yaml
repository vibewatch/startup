      - number: '5.4'
        title: 成熟度、差异化与产品技术风险
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这样一个判断：Chapter 的产品比一次性参保漏斗更成熟。工作流至少自 2022 和 2023 年以来就已公开阐述，2025–2026
              年公告也显示新增模块进入生产环境。公司最强的差异化主张并不是“它有软件”。GoHealth、CoverRight 和 eHealth 等竞争者都营销计划匹配技术与持牌代理支持的某种组合。Chapter
              的差异化主张在于，它搜索每一个可用计划，并让顾问薪酬在不同计划选择之间保持中立。如果属实，这在一个仍因激励错配而受到批评的市场里，是有意义的产品和信任优势。


              风险面同样具体。医生目录和处方计算器解决的正是 CMS 自己强调过的数据问题，因此依赖不断变化且不完美的外部输入。OTC
              应用作为全年效用界面看起来有潜力，但公开来源没有披露零售商经济模型或重复使用质量。招聘页面暗示团队刻意保持精简，这能保持聚焦，也会集中运营经验。最重要的是，Chapter 现在把自己描述为 AI
              原生，却没有公开披露模型治理、可靠性或外部保证细节。因此，产品技术结论在工作流成熟度和实际效用上偏正面，但仍缺少能证明准确性、韧性和防御性的量化证据。
