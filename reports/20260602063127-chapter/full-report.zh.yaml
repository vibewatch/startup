            body: >-
              最好的公开持久性证据仍然只是代理证据。评价数量深且更新：官方介绍页和两个 REVIEWS.io 页面都显示 6,126 条评价、4.9 分和 98% 推荐率。评价镜像和 Ramsey
              证言中的定性主题一致：安心、耐心解释、服务方和处方匹配、长期适配，而不是只推荐第一年最便宜的方案。全年倡导文章和 HSHS 公告也强调，关系本应在入保后继续；OTC Store
              则引入另一个入保后的触点，让成员能持续从计划中获得价值。


              这些证据没有在财务上关闭持久性问题。公司材料声称拥有行业领先的受益人和企业伙伴留存，但没有披露数字。公开材料中没有
              NRR、GRR、流失率、合同期限或续约栈。因此，客户记录应被描述为在满意度和支持上强，但在持久性上仍不完整。公开证据足以说明用户确实使用服务，而且往往喜欢它；但还不足以用投资人级留存指标证明这些关系到底有多黏。
