          description: 医疗系统、顾问、创作者和指南共同拉动需求
        - id: f2
          label: 预约咨询
          description: 用户进入合作伙伴流程并预约电话
        - id: f3
          label: 顾问信息采集
          description: 审核医疗服务提供者、处方和优先事项
        - id: f4
          label: 给出推荐
          description: 顾问提供计划选择指引
        - id: f5
          label: 投保或切换计划
          description: 用户选择保障方案并完成投保
        - id: f6
          label: 投保后互动
          description: 权益支持、OTC 和持续服务延续关系
      edges:
        - from: f1
          to: f2
        - from: f2
          to: f3
        - from: f3
          to: f4
        - from: f4
          to: f5
        - from: f5
          to: f6
    approximationNotes: 这是结构性漏斗，而非量化漏斗；公开来源未披露各阶段转化率。
    claimRefs:
      - CU015
      - CU019
      - CU024
      - CU029
      - CU030
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 按具名客户和合作渠道评估公开证明质量。
    data:
      columns:
        - 结果具体度
        - 落地成熟度
        - 持续性可见度
      rows:
        - label: Zoa Life
          values:
            - 高 — 已披露 99% 和 4.5x 指标
            - 高 — 作为活跃案例研究呈现
            - 低 — 未披露续约或合同条款
        - label: Mercer Financial
          values:
            - 中-高 — >50% 签约指标
            - 高 — 描述为当前客户合作仍在推进
            - 低 — 无持续留存或收入数据
        - label: Dr. Ed
          values:
            - 中 — 已帮助数千名粉丝
            - 高 — 活跃创作者合作关系
            - 低 — 未披露转化或留存指标
        - label: Raymond James
          values:
            - 中 — 已上线工作流和专门团队
            - 高 — 上线页面加有日期的公告
            - 低 — 未披露合作伙伴客户群中的采用数量
        - label: HSHS
          values:
            - 中 — 清晰用例和合作伙伴引语
            - 高 — 面向现有及新符合资格患者的合作伙伴公告
            - 低 — 未披露后续绩效指标
        - label: RamseyTrusted
          values:
            - 中 — 有力的信任文案和推荐语
            - 高 — 活跃推荐落地页
            - 低 — 未披露线索或续约经济性
    approximationNotes: 各行评估公开证明的证据质量，而非客户关系的绝对价值。
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU017
      - CU013
      - CU018
      - CU039
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最高严重度事项不是孤立风险，而是行为合规、合作伙伴不透明和资本不透明彼此叠加。
    data:
      columns:
        - 发生可能性
        - 严重度
        - 缓释成熟度
      rows:
        - label: 误导性营销 / 行为合规审查
          values:
            - 高
            - 高
            - 中
        - label: 薪酬规则诉讼与政策反复
          values:
            - 中-高
            - 高
            - 低-中
        - label: 推荐诚信错配
          values:
            - 中
            - 高
            - 中
        - label: 顾问质量差异
          values:
            - 高
            - 高
            - 中
        - label: 安全 / 隐私披露不足
          values:
            - 中
            - 高
            - 低
        - label: 合作伙伴集中度不透明
          values:
            - 高
            - 高
            - 低
        - label: 低 DTC 替代风险
          values:
            - 中-高
            - 高
            - 低-中
        - label: 现金消耗 / 资金续航不透明
          values:
            - 高
            - 高
            - 低
    approximationNotes: 发生可能性和缓释成熟度是基于公开证据集的定性判断；公司未发布概率模型。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR010
      - CR021
      - CR028
      - CR033
      - CR041
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 核心失效路径从受监管营销和推荐风险开始，传到信任、合作伙伴渠道表现，再传到融资灵活性。
    data:
      nodes:
        - id: reg
          label: 营销 / 行为合规审查
        - id: quality
          label: 推荐质量下滑
        - id: trust
          label: 客户信任受损
        - id: partner
          label: 合作伙伴渠道放缓
        - id: growth
          label: 增长 / 转化走低
        - id: finance
          label: 融资压力
        - id: valuation
          label: 估值压缩
      edges:
        - from: reg
          to: quality
          label: 规则收紧会暴露话术或监督薄弱
        - from: quality
          to: trust
          label: 推荐不匹配会引发投诉
        - from: trust
          to: partner
          label: 合作伙伴不会放大受损品牌
        - from: partner
          to: growth
          label: 转介绍量和转化率走弱
        - from: growth
          to: finance
          label: 维持轨迹需要更多资本
        - from: finance
          to: valuation
          label: 不透明叠加对融资的依赖，会削弱价格支撑
        - from: reg
          to: finance
          label: 执法或整改推高成本和摩擦
        - from: trust
          to: valuation
          label: 信任层叙事直接走弱
    approximationNotes: null
    claimRefs:
      - CR001
      - CR003
      - CR010
      - CR021
      - CR026
      - CR033
      - CR043
      - CR045
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Chapter 依赖监管机构制定行为规则，依赖顾问守住推荐质量，也依赖合作伙伴高效分发。
    data:
      nodes:
        - id: cms
          label: CMS / 监管机构
        - id: advisors
          label: 顾问队伍
        - id: health
          label: 医疗系统合作伙伴
        - id: advisornets
          label: 顾问网络合作伙伴
        - id: publishers
          label: 出版方 / 受众合作伙伴
        - id: capital
          label: 私募资本
        - id: chapter
          label: Chapter
      edges:
        - from: cms
          to: chapter
          label: 制定行为和营销规则
        - from: advisors
          to: chapter
          label: 守住推荐质量
        - from: health
          to: chapter
          label: 提供患者转介渠道
        - from: advisornets
          to: chapter
          label: 提供退休客户渠道
        - from: publishers
          to: chapter
          label: 提供受众信任和发现入口
        - from: capital
          to: chapter
          label: 在披露有限时为规模化提供资金
    approximationNotes: null
    claimRefs:
      - CR005
      - CR021
      - CR023
      - CR024
      - CR025
      - CR026
      - CR029
      - CR030
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 投资判断从真实业务质量走到薄弱的价格透明度，因此结论是跟踪而非买入。
    data:
      nodes:
        - id: traction
          label: 真实牵引力：Series D + E、收入增长 3x、ARR > $100M
        - id: trust
          label: 真实证明：合作伙伴工作流和评论量
        - id: opacity
          label: 价格不透明：未披露 2026 年确切估值和股权结构
        - id: public
          label: 公开可比公司：股权价值受压，市场聚焦续约和现金纪律
        - id: decision
          label: 建议：跟踪，中等信心，高风险，估值偏高
      edges:
        - from: traction
          to: decision
          label: 支撑继续关注业务
        - from: trust
          to: decision
          label: 支撑相对较弱同行的一定溢价
        - from: opacity
          to: decision
          label: 阻挡买入信心
        - from: public
          to: decision
          label: 倒逼估值纪律
    approximationNotes: null
    claimRefs:
      - CV005
      - CV008
      - CV031
      - CV032
      - CV033
      - CV041
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以已披露的 ARR 下限 $100M 计算，ARR 倍数每增加 10x，隐含估值支撑大约增加 $1.0B。
    data:
      items:
        - label: $100M ARR × 10x
          value: 1
          unit: USD B
        - label: $100M ARR × 20x
          value: 2
          unit: USD B
        - label: $100M ARR × 30x
          value: 3
          unit: USD B
        - label: $100M ARR × 40x
          value: 4
          unit: USD B
        - label: $100M ARR × 50x
          value: 5
          unit: USD B
    approximationNotes: 这是对已披露 ARR 下限的敏感性视图，不声称 ARR 正好等于 $100M，也不声称某个倍数正确。它用于展示估值支撑会如何随定价假设快速变化。
    claimRefs:
      - CV005
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 证据支撑区间，而非精确目标：已知 $1.5B 锚点、>$3.0B 下限，以及需要新增尽调证据的更高溢价区间。
    data:
      items:
        - label: 悲观 / 锚点区间
          low: 1.5
          mid: 2
          high: 3
          unit: USD B
        - label: 基准 / 克制私募区间
          low: 3
          mid: 3.75
          high: 4.5
          unit: USD B
        - label: 乐观 / 需证明的溢价区间
          low: 4.5
          mid: 5.5
          high: 6.5
          unit: USD B
    approximationNotes: 这些是证据支撑区间，不是模型精确公允价值。基准区间从上一轮 $1.5B「超过翻倍」字面推导出的下限开始。
    claimRefs:
      - CV029
      - CV030
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 公司在证明和市场相关性上得分较好，但在估值清晰度和证据完整性上明显差很多。
    data:
      items:
        - label: 市场相关性
          value: 4
          note: Medicare 导航需求真实，财务影响也大
        - label: 业务质量证明
          value: 4
          note: 融资、增长、合作伙伴证明和评论都显示有实质支撑
        - label: 客户 / 合作伙伴持续性证据
          value: 3
          note: 代理证据不错，但留存经济性仍然隐藏
        - label: 财务清晰度
          value: 2
          note: 现金消耗、债务和股权结构未公开
        - label: 估值清晰度
          value: 1
          note: 当前价格靠推断，并未披露
        - label: 可比公司支撑
          value: 2
          note: 公开可比公司提供纪律约束，但撑不起清晰的溢价案例
        - label: 当前整体可投性
          value: 2
          note: 以现有证据看，值得跟踪，不值得买入
    approximationNotes: 评分是基于证据集的 1-5 定性判断，意在供投委会讨论，而不是机械模型。
    claimRefs:
      - CV005
      - CV008
      - CV015
      - CV032
      - CV034
      - CV041
      - CV044
