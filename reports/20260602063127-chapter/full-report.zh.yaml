      - number: '3.4'
        title: 护城河耐久性、商品化与反向信号
        blocks:
          - type: paragraph
            body: >-
              反向证据并不是数字化 Medicare 导航没有需求，而是这个品类在经济上仍显脆弱，战略上也容易被模仿。Medicare Market Insights 反复把 eHealth、GoHealth 和
              SelectQuote 作为一个独立 eBroker 队列处理；GoHealth
              最新业绩评论也直说，市场正在重置，首次续约概率、利润率完整性、流动性和整合准备度比原始交易量更重要。公开市场数据强调了同一点：eHealth、GoHealth 和 SelectQuote
              都有实质收入基础，但股权价值仍然不高。投资者实际上在说，应收佣金、留存和保险公司行为比首页包装更重要。


              这让耐久性变成一个问题：哪些东西竞争对手无法低成本复制？已审阅来源显示，单靠推荐技术不够，因为几乎每个重要替代方案现在都把
              AI、匹配或自研逻辑与持牌人工指导放在一起营销。更持久的优势看起来来自渠道或信任：Chapter 的伙伴分发，GoHealth 的评论足迹和参保后支持叙事，eHealth 明确的补偿披露和广泛保险公司接入，以及
              SelectQuote 的交叉销售引擎与公开单位经济透明度。即便如此，Medicare Rights 仍警告，佣金激励会扭曲经纪人行为。实际尽调结论是：如果 Chapter
              有护城河，它大概率在分发质量和消费者信任里，而不是在独立算法里——这些优势必须持续复利，速度要快过拥挤市场的模仿。
