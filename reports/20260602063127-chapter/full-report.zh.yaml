      - number: '8.2'
        title: 融资背景与公开市场参照
        blocks:
          - type: paragraph
            body: >-
              检验 Chapter 私募定价的最佳方式，是拿它与公开披露的线上经纪商组合对照，同时诚实处理商业模式差异。eHealth、GoHealth 和 SelectQuote 都提供 Chapter
              没有的投资人级披露：年报页面、SEC 文件入口、定期业绩公告和公开市场统计。这些披露呈现出一个残酷现实。公开线上经纪商相对收入的股权价值很小或被压缩，有些还背着高债务或应收款余额。Yahoo 和
              CompaniesMarketCap 显示，eHealth 市值约 $49.83M，GoHealth 约 $19.14M，SelectQuote 约 $0.17B。它们的 EV /
              收入读数很嘈杂，因为杠杆会扭曲企业价值，但这一组仍告诉投资人一件重要事：这个类别不会被当作干净的 SaaS 对待。GoHealth 强调续约经济性和现金纪律。SelectQuote 披露 LTV、CAC
              效率和佣金应收款。市场要的是续约质量、回本和回款证明，而不只是收入增长。Chapter 尚未披露这种层级的运营细节。
