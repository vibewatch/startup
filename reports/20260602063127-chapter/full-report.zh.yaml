  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Chapter 交付什么，以及推荐工作流如何运转
        blocks:
          - type: paragraph
            body: >-
              Chapter 的产品最好理解为顾问辅助的 Medicare
              导航工作流，而不是简单线索表单或通用经纪业务。官方页面呈现双通道体验：用户既可以先通过指南自学再升级，也可以直接从持牌顾问开始。上线的伙伴流程写清了结构化信息采集：Chapter
              收集医生、处方和优先事项，然后带受益人走过他们需要做出的 Medicare 决策。这与参议院证词相互印证；证词描述了一个专为 Medicare 和退休场景搭建的推荐平台，而不是外挂在更宽保险市场上的功能。


              推荐逻辑也比典型经纪营销页面更具体。Chapter 称自己搜索每一个可用 Medicare 选项；参议院证词称，平台使用医生、处方、权益、生活方式、风险和预算输入，评估 Medicare
              Advantage、Medicare Supplement、独立 Part D 和 Special Needs
              Plans。因此，工作流把数据模型、推荐逻辑和持牌人工界面结合起来。这里公开记录相对强，是因为同一个核心流程出现在官方伙伴页面、参议院证词和评论镜像中：信息采集、比较、推荐和参保。未报告的问题不是工作流是否存在，而是它在多大频率下转化、规模化时有多准确。
