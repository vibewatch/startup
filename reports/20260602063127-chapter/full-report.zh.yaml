  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业、在位者与新数字化进入者
        blocks:
          - type: paragraph
            body: >-
              Chapter 面对的不是单一正面对手，而是一个分层的 Medicare 导航市场。最接近的公开可比公司是 eHealth、GoHealth 和
              SelectQuote：三者都把多保险公司比价、持牌代理人和面向消费者的数字参保结合起来；它们在公开市场上的表现也说明，Medicare 经纪业务可以做到相当规模，却未必带来明显的股票市场热情。eHealth
              仍把自己定位为该品类的独立在位者，已经在市场中超过 25 年，可接入 180+ 家保险公司，提供类似 MatchFinder 的计划匹配，过去 12 个月收入约 $528.91M。GoHealth 通过
              PlanFit 推同样宽泛的品类承诺，声称获得 10 million 消费者信任，并明确提供全年支持。SelectQuote 则是结构更宽的市场平台，因为它把 Medicare 叠加在寿险、房屋险和车险之上；其
              2026 财年第三季度报告仍显示合并季度收入 $430.9M，收入 / CAC 倍数为 6.7x。


              私营挑战者证明，从产品叙事角度进入这个品类仍然不难。CoverRight 和 Healthpilot 都在营销技术加顾问的混合模式，围绕简化混乱决策来讲故事；Healthpilot 明确称有 100,000+
              名成员选择它而不是独自处理，CoverRight 则把自己定位为面向 65+ million Medicare 人群的现代、透明管家式服务。这让同业范围足够宽，Chapter
              不能只依赖“唯一消费者友好、带软件的经纪商”这个定位。相反，它的局部竞争优势必须来自分发、信任，以及在一个多家公司都声称拥有 AI、匹配和持牌指导组合的市场中执行到位。
