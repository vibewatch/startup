      - number: '6.4'
        title: 扩张机会与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Chapter 有几条合理的扩张循环。若医疗系统、顾问网络和创作者继续把退休人群推荐进流程，伙伴驱动的分发可以复利。OTC 应用和全年倡导支持，把一次性入保事件延展为持续互动。Fierce
              Healthcare 还称公司几乎不投 DTC 广告，这意味着 GTM 是围绕可信中介有意搭建的，而不是靠昂贵的全国媒体获客。如果这些伙伴渠道能续约并加深，模型可能既耐久又高效。


              问题在于，公开来源仍没有说明伙伴基础有多集中，也没有说明这些关系在经济上多持久。没有头部伙伴结构、没有合同期限披露、没有排他性细节，也没有按渠道列示的收入分成。同一套让客户故事看起来可信的伙伴驱动策略，一旦少数医疗系统、顾问项目或出版方主导增长，也会变成集中度风险。外部反向评论又加了一层：Medicare
              Rights 警告经纪人激励会扭曲建议，KFF 则显示获客环境嘈杂，并由营销中介主导。客户结论在真实采用证据上偏正面，但对集中度和续约质量仍保持保守。
