      - number: '8.4'
        title: 退出准备度、论点失效触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              剩下的工作很直接，不是概念问题。投资人需要精确定价、精确条款，以及公司高信任故事能转化成持久经济性的证据。公开证据尚未显示 2026
              年股价、投后估值、清算优先权、债务或现金消耗；也没有显示留存指标和集中度数据，买方因此无法判断 Chapter
              是否应相对上市线上经纪商组合享有溢价，还是只是同一模型下营销更好的版本。这意味着退出准备度仍未被证明。纪律严明的委员会应把当前标的视为跟踪候选，并设置明确的论点失效触发器：如果 2026
              年轮次定价过于激进，倍数可能压缩；如果投诉模式恶化，信任会受损；如果下一轮融资仍缺乏更好披露，融资风险会上升；如果伙伴渠道比品牌叙事显示的更集中，策略风险会暴露。尽调清单不长，但足以决定结论。
