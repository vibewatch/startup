      - number: '2.3'
        title: 增长驱动、约束与采用路径
        blocks:
          - type: paragraph
            body: >-
              几个结构性因素支撑这个市场。Medicare Advantage 参保人数已连续二十年稳步上升，额外权益仍是重要卖点；受益人仍要面对计划数量多、网络差异大、权益设计复杂的决策环境。KFF 和 Milliman
              都暗示，即便增速放缓，计划仍在围绕增值权益竞争。当这种复杂性撞上高风险决策——例如医生连续性、药品可负担性，或年度参保期间的困惑——Chapter 的相关性最强。Special Needs Plans
              尤其重要，因为它们贡献了 2026 年参保增量的大部分，说明增长最快的细分市场可能也是受益人最难独自穿越的部分。


              约束同样真实。OIG 正在开展关于误导性 Medicare Advantage 营销的项目；Medicare Rights 认为佣金和行政奖金扭曲经纪人行为；Center for Medicare
              Advocacy 称，原本旨在遏制滥用的补偿规则遭到法院挑战并被暂缓。与此同时，KFF 观察到 2026 年普通参保计划选择数减少，说明即便总参保人数增长，保险公司经济模型也在收紧。因此，Chapter
              的采用路径取决于它能否说服受益人和伙伴机构：第三方向导可以改善结果，同时又能在一个高度受监管、政治争议大、直接经济规模仍难测算的市场里运营。
