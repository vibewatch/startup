      - number: '2.2'
        title: 规模测算视角、细分市场与买方地图
        blocks:
          - type: paragraph
            body: >-
              公开来源对受益人数量的支撑远强于对美元市场规模的支撑。KFF 报告称，截至 2026 年 2 月，Medicare Advantage 参保人数略高于 35 million，同比增加 1.1
              million；2025 年 34 million 受益人占适龄人群的 54%。2026 年，平均每位受益人可在 32 个 MA-PD 计划中选择；仅 California 就有 6.5 million 名
              Medicare 受益人和 330 个 MA 计划。Mark Farrah 的 2024 年视角统计了 5,805 个不同的 Medicare Advantage
              产品，凸显老年人与顾问必须穿越的计划碎片化程度。这些数据说明决策市场很大且仍在增长，尽管它们没有直接给出独立导航公司的收入池。


              买方地图也是多边的。最终用户是受益人，但底层理赔的付款方是 CMS 通过私营计划支付；获客影响力则可能掌握在医疗系统、财务顾问和内容出版方手中。Chapter
              自己的伙伴材料和伙伴证明页面把这一点说得很清楚。医疗系统希望受益人转入 Medicare 时仍留在网内；财富顾问希望保护退休客户的结果和转介绍；出版方希望围绕老年受众建立可信的变现与服务层。这种组合让
              Chapter 的市场更像嵌入式分发加受监管建议，而不是经典消费应用市场。
