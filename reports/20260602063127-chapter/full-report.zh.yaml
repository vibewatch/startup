      - number: '7.3'
        title: 伙伴、渠道与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Chapter 的分发模型之所以可信，恰恰因为它嵌在可信中介里：医疗系统、顾问网络、出版方和面向社区的组织。HSHS、Raymond James 和 Ramsey
              都提供了在线流程证据，说明伙伴模型是真实的。Fierce
              又补了一个重要角度：公司很少使用直接面向消费者的广告，这意味着模型是有意伙伴驱动，而不只是机会主义。跑通时，这能高效获客并增强信任。若大伙伴表现不佳，或伙伴信任被侵蚀，也会带来替代风险。公开材料仍未披露头部伙伴集中度、合同期限、排他性或收入分成条款，因此投资案例无法判断增长是广泛分布，还是依赖少数渠道。ReviewFeeder
              对雇主、福利专业人士、非营利组织、宗教机构和社区领袖的描述进一步扩大了接触面：渠道更多或许能降低单个 logo 依赖，但也会提高监督复杂度。结果就是，一个分发证据很强、集中度透明度很弱的模型。
