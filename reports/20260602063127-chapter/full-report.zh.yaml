      - number: '3.3'
        title: 替代品、现状与内部自建问题
        blocks:
          - type: paragraph
            body: >-
              并不是每个竞争者都是有风险资本支持的线上经纪商。现状替代方案仍是自我学习、本地经纪人，以及保险公司特定资源或政府资源的组合。Medicare Rights
              描述的计划选择环境足够混乱，受益人常常求助于代理人和经纪人；这正是 Chapter 及其同业利用的入口。但同样的复杂性也支撑了本地替代方案。Boomer Benefits 就展示了经典关系驱动模式：2005
              年成立，持牌覆盖 49 个州，代表 30+ 家保险公司，提供免费咨询和终身支持。对许多老年人来说，这已经足够好——尤其当熟悉代理人的信任比软件打磨更重要时。


              内部自建替代方案更难量化，但同样真实。RIA、医疗系统或出版方等机构可以把 Medicare
              指导留在既有关系里，使用本地经纪人，或自己拼出转介绍和比较流程，而不是依赖专业平台。已审阅的公开材料没有量化自建还是购买的决策成本；CoverRight 和 Healthpilot
              等私营进入者也没有披露足够多的伙伴经济细节，证明它们已经锁住分发。这个证据缺口很重要，因为如果伙伴渠道非独家、实施又很轻，护城河就会从产品功能转向销售纪律和信任。换句话说，Chapter
              不只是在和有名字的初创公司竞争；它还在和“少做一点、交给本地做、或自己做”的决策竞争。
