      - number: '4.4'
        title: 资本充足性、融资依赖与阻碍因素
        blocks:
          - type: paragraph
            body: >-
              公开证据支撑清晰融资时间线，但没有解决资本是否充足的问题。Chapter 在 2025 年融资 $75M，用于深化伙伴关系和产品基础设施；随后在 2026 年融资
              $100M，并称估值已翻倍以上。这确实证明公司能拿到资本。但它不能证明现金跑道足够。公开记录仍未披露手头现金、月度烧钱、债务工具、营运资本压力，或合并盈利时间表。与上市同业的比较在这里很重要：上市线上经纪商提交
              10-K 和 10-Q，公开现金、债务、应收款和市场压力。Chapter 没有。


              反向覆盖层在于，MA 经纪经济模型一边面对激励和监管风险，一边依赖留存。Medicare Rights 认为超额支付帮助资助营销，佣金和福利可能扭曲经纪人行为；GoHealth 自己的 2026
              年评论也确认，首次续约概率和流动性纪律是生存核心。在这个背景下，目前应把 Chapter
              视为一家有前景但仍依赖融资的私营经纪公司：收入质量可信，需求可见，资本渠道存在；但要做出硬性资本充足性判断，关键承销输入仍然缺席于公开来源。主要阻碍不是概念问题，而是具体数字缺失：现金、烧钱、债务、CAC、伙伴经济模型和经审计收入结构。
