      - number: '4.2'
        title: 销售动作、渠道经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开页面显示，Chapter 的获客动作建立在伙伴转介绍、教育内容和持牌顾问转化之上，而不是轻量软件结账流程。杂志中心、常青 Medicare 解读，以及反复出现的 Talk to an Advisor
              提示，像一个典型的教育到咨询漏斗。顾问渠道页面则加入了更劳动密集的现实：持牌代理人对话、营销同意、医生和处方审查，以及个性化推荐。这很可能意味着成本结构主要由顾问人工、合规、保险公司集成、伙伴管理和数据产品维护主导。Chapter
              自己的公告也强化了这一判断：2025 年资本投向企业合作和数据基础设施；随后在 2025 年强调企业员工数持平，同时收入增长 3x、ARR 超过 $100M。


              因为 Chapter 是私营公司，最好的公开单位经济代理变量来自上市同业。SelectQuote 披露，每份获批保单的佣金 LTV 为 $904，每份 MA/MS 保单的总收入约 $2,490，收入 / CAC
              倍数为 6.7x。GoHealth 表示，公司有意减少首次续约概率不足以支撑经济性的活动，并投资 AI 来降低 CAC、改善第一年回本，同时把经营现金流作为首要资本配置视角。这些披露强烈暗示，Chapter
              应被分析为高接触、续约敏感的经纪模型，而不是 SaaS 公司。缺失的部分是 Chapter 自己的渠道数学：CAC、回本周期、各伙伴类型贡献，以及内容驱动需求是否真的比直接响应式替代方案更便宜。
