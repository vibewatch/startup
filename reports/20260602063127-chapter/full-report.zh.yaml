  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Chapter 看起来是一家真实、有真实牵引力的公司，但估值需要的不只是欣赏。最干净的公开定价锚点仍是 2025 年 4 月的 Series D，据广泛报道约为 $1.5B。2026 年 4 月的 Series
              E 明确又融资 $100M，并称估值超过翻倍，但管理层没有披露新的精确数字。即便没有精确目标，这个组合也足以形成立场。它说明，公司很可能越过 $3.0B 的下限，同时只披露 ARR 超过
              $100M，并继续隐藏现金消耗、债务、留存和股权结构条款等关键承销输入。换句话说：Chapter
              可能是好公司，但公开证据仍让投资人在为不透明价格承销。因此，正确建议是跟踪，而不是买入。这个判断不是说业务已经坏掉，而是说价格敏感度和证据敏感度都重要；当前证据更能支持公司质量，而不是支持标记价格的精确公平性。
