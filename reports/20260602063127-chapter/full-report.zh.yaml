  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方与获客触点
        blocks:
          - type: paragraph
            body: >-
              Chapter 的客户地图是多边的。最终用户是退休人群或 Medicare
              受益人，但公开买方地图穿过医疗系统、财务顾问、出版方、创作者，以及长尾机构渠道。合作页面明确细分了医疗服务提供者和医疗系统、财务顾问、内容出版方和其他组织。ReviewFeeder
              又把图景扩展到雇主、福利专业人士、非营利组织、宗教机构和社区领袖。因此，客户故事不只是直接面向消费者的 Medicare 帮助，而是嵌入伙伴渠道，进入已经存在的可信关系。


              公开内容足迹显示，细分也由用例驱动。Chapter 为 65 岁后仍在工作的人、助听器覆盖、IRMAA 与 Part B/Part D 保费敏感性、税日财务问题和居家医疗维护专门指南。这些不是直接采用指标，但显示
              Chapter 正试图在退休旅程中拥有哪些问题。结合上线的伙伴页面，客户模型看起来有意做宽：高意向退休人群、被转介绍家庭，以及参保后可能继续通过权益倡导或 OTC 权益激活与 Chapter 互动的既有会员。
