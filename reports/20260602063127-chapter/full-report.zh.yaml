      - number: '1.4'
        title: 里程碑、牵引信号与早期保留意见
        blocks:
          - type: paragraph
            body: >-
              Chapter 自 2022 年以来的里程碑显示，这家公司仍在持续增加资本和产品，而不是已经进入稳定经纪经济模型。Series B 阶段包括全国顾问牌照、第二办公室，以及 Palantir 支持的平台叙事。到
              2024 年，公司开始推介企业级 Medicare 能力和 OTC 兑换产品。2025 年，它引入 Stripes、扩充董事会，提出 4x 参保增长，并拓展与零售商相关的 OTC。到 2026
              年，公司把自己描述为领先的 Medicare 导航平台，称 2025 年收入增长三倍、ARR 超过
              $100M、员工数保持不变，同时上线医生目录、处方成本计算器等新工具。即便这些信号几乎都来自公司自己发布的材料，商业信号仍然很强。


              保留意见同样重要。独立评论页面整体正面，但也显示 Chapter 的外部声誉仍通过市场平台和联盟营销色彩浓厚的比较网站传递，而不是经过审计的服务指标。ConsumersAdvocate 的页面称公司自 2019
              年起运营，带来了时间线漂移；公开融资叙事则更清楚地指向一个 2020 年左右成立、2021 年 Series A、2022 年 Series B
              的初创公司。更重要的是，公司没有披露精确客户数、员工数、单位经济、债务敞口或当前估值。因此，Chapter 看起来像一个可信、快速增长、资金充足的 Medicare
              导航平台，但还不像一家运营全貌已能被外部完整读懂的公司。
