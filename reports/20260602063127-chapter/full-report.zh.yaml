    rows:
      - - 真实牵引：Series D 和 Series E 均已完成，2025 年收入增长 3 倍，ARR 超过 $100M。
        - 如果 Chapter 披露留存、现金转化和合作伙伴续约经济性，逻辑会进一步增强。
      - - 合作伙伴和客户证据显示，相比纯线索生成模式，Chapter 可能有差异化信任层。
        - 如果投诉率、合作伙伴集中度或不匹配案例比当前公开证据显示的更严重，逻辑会削弱。
      - - 公开 eBroker 的股权价值被压缩，并承受债务或应收账款压力，这要求估值纪律。
        - 如果 Chapter 证明留存、CAC 和集中度指标显著优于公开可比公司，公开 eBroker 参照的权重会下降。
      - - 2026 年精确定价未披露，投资人承销的是一个不透明标记，而不是透明价格。
        - 如果管理层披露 2026 年股价、投后估值和清算优先权，判断会立即改善。
      - - 相对公开可比公司的溢价可能部分合理，但当前证据无法说明多少溢价站得住。
        - 更强的溢价论证需要更多经审计证据，以及更清晰的可持续利润率路径。
    notes: 本表将业务质量论点和价格纪律论点分开，避免投资建议坍缩成泛泛的公司质量评分。
