  - id: TV005
    title: 投资逻辑破裂和否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 2026 年私人价格被证明远高于当前支撑区间
        - 尽调显示估值标记明显高于 >$3.0B 的下限推断，且没有单位经济性证据抵消
        - 估值担忧从理论变成具体
        - 从观察转为回避，直到价格或证据重置
      - - 降价轮或高度结构化融资
        - 下一轮价格低于市场预期，或加入惩罚性优先权条款
        - 释放价格支撑疲弱信号，并恶化普通股结果
        - 先从下行情景重新承销
      - - 投诉 / 信任恶化
        - BBB 或其他投诉界面明显恶化
        - 削弱信任层溢价和合作伙伴耐久性逻辑
        - 下调溢价假设，并重看渠道质量叙事
      - - 留存或续约质量不及预期
        - 在高溢价定价下，管理层仍无法证明强队列耐久性
        - 动摇相对公开 eBroker 参照物支付溢价的核心论据
        - 大幅下调支撑区间
      - - 合作伙伴集中度被证明很高
        - 少数渠道主导交易量或收入
        - 提高增长脆弱性和对手方风险
        - 要求更高折价，否则放弃
      - - 烧钱速度和现金跑道被证明偏弱
        - 现金消耗或债务负担差于近期融资所暗示的水平
        - 将不透明转化为眼前融资风险
        - 视为依赖融资，而不是已降风险
    notes: 这些是投资人监控触发因素，来自公开证据集和缺失尽调项；并非公司发布的 KPI。
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV036
      - CV039
      - CV040
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 2026 年精确估值
        - Series E 轮股价、稀释后股数和投后估值
        - 没有这些，投资人无法判断当前标记比上一次明确的 $1.5B 轮贵出多少
        - 直接向管理层索取条款清单或投资人材料
      - - 股权结构表和优先权堆叠
        - 清算优先权、优先顺位和任何补充协议
        - 下行结果取决于优先权，而不只是标题估值
        - 索取由律师编制的股权结构表摘要
      - - 现金消耗和现金跑道
        - 当前现金、债务、月度烧钱速度和融资计划
        - 近期融资证明公司能拿到钱，不证明钱足够
        - 索取最新董事会或财务材料
      - - 合作伙伴集中度
        - 头部渠道和头部对手方组合、续约情况和合同期限
        - 在真实交易量结构曝光前，合作伙伴驱动模式可能看起来很多元
        - 索取合作伙伴队列表
      - - 留存 / 队列持续性
        - NRR、GRR、流失率、按合作伙伴渠道划分的留存，以及投诉率趋势
        - 只有首次注册后信任和经济性仍能延续，溢价才站得住
        - 索取队列分析和客户支持 KPI
      - - 退出准备度
        - 经审计财务包，以及 IPO / M&A 准备状态
        - 如果公司确实在准备流动性路径，价格支撑会更强
        - 索取审计状态、投行材料和准备路线图
    notes: 这些项目按它们将建议从观察改为买入或回避的直接程度排序。精确价格和资本结构证据排在最前，因为当前问题是估值纪律，而不是业务是否存在。
    claimRefs:
      - CV006
      - CV007
      - CV039
      - CV040
