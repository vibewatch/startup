      - number: '3.2'
        title: 定价、包装与分发权力
        blocks:
          - type: paragraph
            body: >-
              这个品类面向买方的包装非常相似。Chapter 称顾问渠道咨询免费，客户保费不变；GoHealth 称通话免费；SelectQuote 宣传免费、无义务比较；eHealth
              则称由保险公司而非消费者付费。这降低了老年人的即时切换摩擦，但也意味着真正的经济战场大多不在页面前端。公开材料很少说明实际佣金率、续佣组合、伙伴收入分成或分渠道回本。SelectQuote
              是少数例外：它在当前公开报告中披露了获批保单量和 6.7x 收入 / CAC 倍数，说明大型上市经纪商围绕队列经济模型管理业务，而不是围绕消费者订阅或软件费。


              因此，分发权力比前端定价更重要。Chapter 正在推进伙伴渠道，并声称 ARR 超过 $100M；但 GoHealth 可以指向 10 million 可信消费者和可见的参保后支持，SelectQuote
              则在保险品类中拥有更广的交叉销售能力和相邻类别中的数百万客户。eHealth
              仍然重要，因为它公开说明保险公司付费的补偿方式和广泛保险公司接入，这让消费者和伙伴更容易读懂它，而私营挑战者往往做不到。评论信号也强化了同一模式：GoHealth 存档的 Trustpilot 页面显示约
              42,972 条评论和 4.8 分快照，SelectQuote 存档的 Trustpilot 标题仍带有 4.4 分。竞争信息很清楚：买方通常零付费，因此品牌、伙伴触达和续约经济才是真正武器。
