      - number: '8.3'
        title: 情景、支撑区间与可比逻辑
        blocks:
          - type: paragraph
            body: >-
              由于 2026
              年精确估值未披露，情景分析应被框定为证据支撑区间，而不是虚假的精确值。熊市情景认为，如果当前私募加价明显超前于留存、集中度和现金转化证据，能被捍卫的只有上一轮精确融资价，或接近它的价格。基准情景认为，Chapter
              的增长、伙伴证据和客户信任看起来强于平均公开可比公司，因此可以相对传统线上经纪商享有溢价，但前提是投资人不能盲目为不透明的估值跃升买单。牛市情景需要的不止是今天这些事实。它需要披露来证明信任层足够持久：续约质量强、伙伴留存好、CAC
              受控、投诉率可控，且股权结构比市场担心的更干净。因此，公开可比公司的价值不在一对一价格目标，而在纪律约束。它们展示了，一旦续约经济性或股权流动性令人失望，估值支撑会多快蒸发。所以这里的估值立场是偏高，而不是未知：即便精确公允价值区间还不清楚，担忧方向已经明确。
