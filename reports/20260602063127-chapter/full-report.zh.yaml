      - number: '5.3'
        title: 信任、合规与消费者保护控制
        blocks:
          - type: paragraph
            body: >-
              信任是产品核心，不只是法律脚注。Chapter 发布了异常明确的牌照页面，包括逐州保险销售人员牌照、代理机构 NPN、New York 地址和投诉路径。法律和伙伴页面反复披露：Chapter 不隶属于
              Medicare 或任何政府实体；它代表许多但不是全部计划；用户仍可向 Medicare.gov 或 1-800-MEDICARE
              查询完整选项。伙伴预约流程也同样明确地要求电话和短信的明确书面同意，并把互动标注为来自持牌代理人的保险招揽。


              最重要的信任控制是激励设计。Chapter 称顾问薪酬不会随计划选择变化，参议院证词也称公司有意让推荐不局限于已签约保险公司。这一点很重要，因为该品类的营销风险真实存在：HHS OIG 正在主动审查欺骗性
              Medicare Advantage 营销做法，Chapter
              自己也公开主张，混乱营销和不良激励是结构性问题。公开记录的弱点在于，已发布控制停留在披露、标识和政策声明层面。没有外部保证材料显示这些控制如何在实践中被审计或执行。
