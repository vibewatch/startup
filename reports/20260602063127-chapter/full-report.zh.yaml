      - number: '7.4'
        title: 财务和执行风险，以及缓释因素与否决条件
        blocks:
          - type: paragraph
            body: >-
              公司的融资故事让人鼓舞，但还不能真正去风险。Chapter 在 2025 年融资 $75M、2026 年融资 $100M，Series E 公告把资本可得性与收入三倍增长、ARR 超过 $100M
              放在一起。这些都是实打实的正面因素。但它们没有回答投资人最终会在类似经纪模式里关心的问题：现金消耗、债务、应收款时点、续约质量和队列持久性。公开线上经纪商可比公司让这个缺口很难忽视。GoHealth
              明确表示，首续概率和经营现金流决定资本投向。SelectQuote 披露保单层面的生命周期价值、CAC 效率和巨额佣金应收款。Medicare Market Insights 把 eHealth、GoHealth
              和 SelectQuote 作为一组连贯分析对象，因为经济性取决于续约、回本和回款，而不是简单的收入增长。Chapter
              尚未披露同等深度的信息。因此，本章缓释因素真实但不完整：有资本可得性，信任信号强，伙伴证据可见，牌照覆盖广；但在公司披露更多集中度、控制系统和现金转化前，残余风险仍高。
