  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              Chapter 的公开页面说清了两件事，也把第三件事留得格外不透明。第一，公司不向消费者或顾问渠道客户收费；伙伴页面称服务没有成本、保费没有差异，法律免责声明则确认其持牌保险代理结构和全国 Medicare
              计划数据库。第二，获客和交付模式是咨询式的，而不是纯自助：潜在客户会被询问医生、处方和优先事项，网站也明确把教育内容导入顾问对话。Chapter 没有公布的，是精确的后端变现栈。最干净的公开推论是，Chapter
              处在同业使用的广义计划付费经济模型里，因为 eHealth 明确称保险公司向其付费，GoHealth 和 SelectQuote 都营销免费消费者指导，Medicare Rights 也指出 MA 和 MA-PD
              经纪人获得计划支付的佣金。


              这个推论仍需谨慎对待。Chapter
              不披露实际佣金率、首佣与续佣组合、伙伴收入分成，也没有披露任何明确收入确认政策。法律免责声明甚至加入了质量限定：节省金额来自自报，且不保证。结果是，收入故事方向上可读，但还不能充分承销。公开证据支撑一个强劲的收入叙事——全计划搜索、50
              家机构、18,160 个产品、伙伴分发，以及免费咨询式流程——但没有说明每一次辅助参保究竟如何转化为确认收入或现金。
