      - number: '1.3'
        title: 融资历史与分发建设
        blocks:
          - type: paragraph
            body: >-
              公开披露的融资给出了清晰时间线，尽管没有给出完整股权结构表。Chapter 在 2022 年 1 月获得 $42M Series B 轮，2024 年 5 月获得 $50M Series C 轮，2025 年 4
              月获得 $75M Series D 轮，并在 2026 年 4 月获得 $100M Series E 轮。独立报道给 2025 年 Series D 轮附上 $1.5B 估值；2026
              年轮次只用相对口径描述：公司称估值较上一轮翻倍以上，但没有公布精确数字。这一点重要，因为 Chapter
              现在处在一个尴尬区间：运营规模确实存在，财务透明度却不完整；市场能看到足够多的动能信号，却看不到足够多的经济模型证据来安心承销。


              分发是规模故事的另一半。官方合作材料把 Chapter 的获客与分发划分为医疗系统、财务顾问和内容出版方；HSHS 和 Ramsey 页面则说明这些渠道已经上线，不只是设想。Series C 和 Series D
              材料反复把新增资本与企业能力、伙伴留存和伙伴驱动获客联系起来，而不是强调大规模直接响应广告。这符合公司更大的叙事：Chapter
              想成为嵌入其他组织与老年人关系中的可信退休基础设施。如果这个逻辑跑通，伙伴分发可以比付费媒体获客更便宜、更黏。如果失败，Chapter 可能仍只是一个故事讲得精致、但单位经济不清晰的昂贵持牌经纪公司。
