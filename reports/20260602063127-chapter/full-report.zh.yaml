      - number: '1.2'
        title: 创始人、董事会信号与政治邻近性
        blocks:
          - type: paragraph
            body: >-
              对一家年轻的私营保险经纪公司来说，Chapter 的创始故事公开程度异常高。Business Wire 将 Cobi Blumenfeld-Gantz、Corey Metzman 和 Vivek
              Ramaswamy 列为创始人；Wharton 以及公司自己的《Why I Started Chapter》文章，则把 Blumenfeld-Gantz 和 Metzman 放在运营搭档的位置，称二人因家人在
              Medicare 上的挫败感而创业。参议院证词进一步强化了这个故事：Blumenfeld-Gantz 说父母是 Chapter
              最早支持的人，并把公司的产品雄心直接指向传统经纪人和不完整公共工具的失败。因此，创始人-市场匹配信号不只是技术深度，而是政策理解力、消费者营销直觉，以及愿意围绕一个长期不透明品类搭工作流软件。


              公司的治理网络比其中立、消费者优先的品牌看起来更接近政治圈。Fierce Healthcare 和 TechCrunch 都报道过 Series A 阶段 Peter Thiel 进入董事会；TechCrunch
              后续又指出 Donna Shalala 接替 Thiel 出任董事。Donna Shalala 任命公告则把她在 Medicare 和 HHS 的信誉包装成战略资产，2025 年 Series D 新闻稿又加入
              Stripes 合伙人 Ron Shah 到董事会。上述事实本身并不构成否定项，但说明 Chapter 的治理与国家政治、医疗政策网络和有影响力的风险资本距离很近。这能帮助融资和建立信誉；但当 Medicare
              营销规则或政治关系进入叙事时，也会放大声誉敏感性。
