      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Chapter
              仍是一套高接触建议业务，外面包着软件和内容，而不是低摩擦自助产品。顾问流程要审阅服务方、处方、优先事项、入保窗口和变化中的福利；客户评价反复称赞知识充分、耐心的代理人，而不是某种神奇的自主流程。这是鼓舞人心的，但也意味着服务质量要靠招聘、培训、监督和文档来放大。Chapter
              自己的内容发布也在强化同一点：公司维护诈骗电话指南、欺骗性做法评论、开放入保指南、Medicare
              基础知识和代理人解释文章，因为受益人全年都需要解读和安心感。运营上，这会产生推荐一致性、话术质量、过期福利解读和合规 QA
              等失效模式。安全和隐私姿态也仍只露出一部分。公开页面展示了徽章和合规语言，但没有经审计的安全认证、正式隐私控制报告或事故历史披露。业务建立在信任和个人健康计划数据之上，这个缺口让残余运营风险维持在高位。
