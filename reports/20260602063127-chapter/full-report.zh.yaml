  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与信任层风险
        blocks:
          - type: paragraph
            body: >-
              Chapter 处在 Medicare 分发中受审视最严的环节之一：营销、推荐和入保指导。监管记录并非假设。OIG 有一个在进行中的项目，正在审查误导性 Medicare Advantage
              营销实践，以及推动经纪人介导计划变更的激励。Medicare Rights 和 Center for Medicare Advocacy
              都认为，佣金、奖金以及围绕薪酬规则的未决诉讼，可能扭曲建议并让基本规则不稳定。CMS 自身也维护一整套营销指引、代理经纪人薪酬资源和模板文件渠道，说明这个类别被监管者视作持续的行为问题，而不是一次性披露事项。对
              Chapter
              来说，这一点重要，因为公司把自己定位为信任层：搜索所有计划、推荐最佳选择，并以持牌保险代理机构运营，而不是中立公共设施。一旦文件记录、监督或推荐完整性失守，核心品牌承诺就会从主要护城河变成主要风险面。
