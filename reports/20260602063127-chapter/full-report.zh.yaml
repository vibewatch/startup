chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、结构与核心定位
        blocks:
          - type: paragraph
            body: >-
              Chapter 的官方页面给出一个简单但结构清晰的身份：面向消费者的品牌是 Memoir, Inc. d/b/a Chapter，受监管的保险代理活动则通过 Chapter Advisory, LLC
              运行。公司反复强调，自己是一家私营、数据和技术驱动的退休顾问公司，不是保险公司；其代理业务在全美持牌。牌照页面公布 New York 总部地址、California d/b/a
              实体，以及完整的州级保险销售人员牌照清单。对一家私营 Medicare 导航初创公司来说，这让合规足迹显得异常透明。法律免责声明和首页也反复强调关键商业定位：Chapter
              称自己会搜索全美每一个计划，即便没有与保险公司直接签约；同时代表 50 家机构，在全美提供 18,160 个产品。


              产品承诺围绕一个问题展开：把 Medicare 推荐中的利益冲突拿掉。首页、About 页面和参议院证词都描述了同一种体验：顾问比较全美 Medicare Advantage、Medicare
              Supplement、Part D 和 Special Needs Plan 选项，然后推荐最适合个人的方案，而不是佣金最高的方案。这一定位很关键，因为 Chapter
              的价值主张更依赖信任，而不是自有设备或受监管治疗资产。公司也明确声明自己不隶属于政府；在监管机构和消费者倡导者多年批评 Medicare 营销误导的品类里，这一点值得注意。合在一起，官方披露把 Chapter
              定义为一个持牌中介：运营模型合规负担重，品牌叙事以消费者优先为核心，并提出广泛的计划搜索主张；后续章节需要用产品、客户和风险证据来检验这些主张。
