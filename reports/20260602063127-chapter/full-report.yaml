      - number: '8.3'
        title: Scenarios, support bands, and comparable logic
        blocks:
          - type: paragraph
            body: >-
              Because the exact 2026 valuation is undisclosed, scenario work should be framed as evidence-support bands
              rather than as false precision. The bear case says only the last exact round—or something close to it—can
              be defended if the current private markup proves far ahead of retention, concentration, and
              cash-conversion evidence. The base case says Chapter can merit a premium over legacy eBrokers because
              growth, partner proof, and customer trust look stronger than the average public comp, but only if
              investors avoid paying blindly for an opaque step-up. The bull case requires more than today's facts. It
              requires disclosure that the trust layer is durable: strong renewal quality, partner retention, controlled
              CAC, manageable complaint rates, and a cleaner cap table than the market fears. Public comps are therefore
              useful less as one-to-one price targets than as discipline. They show how quickly valuation support can
              evaporate when renewal economics or equity liquidity disappoint. That is why the valuation stance here is
              stretched rather than unknown: the direction of concern is clear even if the exact fair value range is
              not.
