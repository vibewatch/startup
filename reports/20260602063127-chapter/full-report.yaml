      - number: '3.3'
        title: Substitutes, status quo, and the internal-build question
        blocks:
          - type: paragraph
            body: >-
              Not every competitor is a venture-backed e-broker. The status quo substitute is still a mix of
              self-education, local brokers, and carrier-specific or government resources. Medicare Rights describes a
              plan-choice landscape cluttered enough that beneficiaries often turn to agents and brokers for help, which
              is exactly the opening Chapter and its peers exploit. But that same complexity also sustains local
              alternatives. Boomer Benefits, for example, presents a classic relationship-driven model: founded in 2005,
              licensed in 49 states, representing 30+ carriers, and offering free consulting plus lifetime support. For
              many seniors, that is good enough—especially when trust in a familiar agent matters more than software
              polish.


              The internal-build substitute is harder to quantify but still real. Institutions such as RIAs, health
              systems, or publishers can keep Medicare guidance inside existing relationships, use local brokers, or
              assemble their own referral and comparison workflows instead of depending on a specialist platform. The
              reviewed public materials do not quantify what that build-versus-buy decision costs, and private entrants
              such as CoverRight and Healthpilot do not disclose enough partner-economics detail to prove they have
              locked up distribution. That evidence gap matters because if partner-led channels are non-exclusive and
              implementation is lightweight, the moat shifts away from product features and toward sales discipline and
              trust. In other words, Chapter is not just competing with named startups; it is competing with the
              decision to do little, do it locally, or do it in-house.
            claimRefs:
              - CP034
              - CP041
              - CP043
              - CP044
