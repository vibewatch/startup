      - number: '8.2'
        title: Financing context and public-market reference points
        blocks:
          - type: paragraph
            body: >-
              The best way to test Chapter's private pricing is to compare it against the publicly disclosed eBroker
              set, while staying honest about business-model differences. eHealth, GoHealth, and SelectQuote all provide
              investor-grade disclosure that Chapter does not: annual-report pages, SEC filing interfaces, recurring
              results releases, and public-market statistics. Those disclosures show a harsh reality. Public eBrokers
              carry tiny or compressed equity values relative to revenue and, in some cases, heavy debt or receivable
              balances. Yahoo and CompaniesMarketCap show eHealth at roughly $49.83 million of market cap, GoHealth at
              about $19.14 million, and SelectQuote around $0.17 billion. Their EV/revenue readings are noisy because
              leverage distorts enterprise value, but the set still tells investors something important: this category
              is not treated like clean SaaS. GoHealth emphasizes renewal economics and cash discipline. SelectQuote
              discloses LTV, CAC efficiency, and commissions receivable. The market wants proof of renewal quality,
              payback, and collection, not just topline growth. Chapter has not yet disclosed that level of operating
              detail.
