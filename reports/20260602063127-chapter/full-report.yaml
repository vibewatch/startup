      - number: '1.2'
        title: Founders, Board Signals, and Political Proximity
        blocks:
          - type: paragraph
            body: >-
              Chapter’s founder story is unusually public for a young private brokerage. Business Wire named Cobi
              Blumenfeld-Gantz, Corey Metzman, and Vivek Ramaswamy as founders, while Wharton and the company’s own “Why
              I Started Chapter” essay center Blumenfeld-Gantz and Metzman as the operating pair motivated by family
              frustration with Medicare. That story is reinforced by the Senate testimony, where Blumenfeld-Gantz
              describes his parents as the first people Chapter supported and ties the company’s product ambition
              directly to the failures of traditional brokers and incomplete public tools. The resulting
              founder-market-fit signal is not technical depth alone; it is a mix of policy fluency, consumer-marketing
              instinct, and willingness to build workflow software around a historically opaque category.


              Governance is more politically connected than the company’s neutral, consumer-first branding might
              initially imply. Fierce Healthcare and TechCrunch both reported Peter Thiel’s board involvement around the
              Series A period, and TechCrunch later highlighted that Donna Shalala replaced Thiel on the board. The
              Donna Shalala announcement, meanwhile, framed her Medicare and HHS credibility as a strategic asset, and
              the 2025 Series D press release added Stripes partner Ron Shah to the board. None of this is
              disqualifying, but it does mean Chapter’s governance sits close to national politics, health-policy
              networks, and influential venture capital. That can help with fundraising and credibility, yet it also
              raises reputational sensitivity whenever Medicare marketing rules or political affiliations become part of
              the story.
