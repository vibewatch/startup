  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Chapter delivers and how the recommendation workflow works
        blocks:
          - type: paragraph
            body: >-
              Chapter's product is best understood as an advisor-assisted Medicare navigation workflow rather than as a
              simple lead form or generic brokerage. Official pages present a two-lane experience: users can either
              self-educate through guides and then escalate, or start directly with a licensed advisor. The live partner
              flow spells out the structured intake: Chapter collects providers, prescriptions, and priorities, then
              walks the beneficiary through the Medicare decisions they need to make. That mirrors the Senate testimony,
              which describes a recommendation platform built specifically for Medicare and retirement rather than
              bolted onto a broader insurance marketplace.


              The recommendation logic is also described more concretely than the typical broker marketing page. Chapter
              says it searches every available Medicare option, and the Senate testimony says the platform evaluates
              Medicare Advantage, Medicare Supplement, standalone Part D, and Special Needs Plans using provider,
              prescription, benefit, lifestyle, risk, and budget inputs. The workflow therefore combines a data model,
              recommendation logic, and a licensed human interface. What makes the public record relatively strong here
              is that the same core flow appears across the official partner page, the Senate testimony, and the review
              mirror: intake, comparison, recommendation, and enrollment. What remains unreported is not whether the
              workflow exists, but exactly how often it converts and how accurate it is at scale.
