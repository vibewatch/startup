chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Structure, and Core Positioning
        blocks:
          - type: paragraph
            body: >-
              Chapter’s official surfaces present a simple but carefully structured identity: the consumer-facing brand
              is Memoir, Inc. d/b/a Chapter, while regulated insurance agency activity runs through Chapter Advisory,
              LLC. The company repeatedly emphasizes that it is a privately owned, data-and-technology-enabled
              retirement advisory, not an insurer, and that its agency arm is licensed nationally. The licensing page
              publishes the New York headquarters address, the California doing-business-as entity, and a full list of
              state producer licenses, which makes the company’s compliance footprint unusually transparent for a
              private Medicare navigation startup. The legal disclaimer and homepage also repeat the key commercial
              positioning point: Chapter says it searches every plan nationwide, even when it does not directly contract
              with the carrier, and that it represents 50 organizations offering 18,160 products nationwide.


              The product promise is framed around removing conflicts from Medicare recommendation. The homepage, About
              page, and Senate testimony all describe an experience where advisors compare nationwide Medicare
              Advantage, Medicare Supplement, Part D, and Special Needs Plan options, then recommend what is best for
              the individual rather than what pays the highest commission. That positioning matters because Chapter’s
              value proposition depends on trust more than on a proprietary device or regulated therapeutic asset. The
              company also explicitly disclaims government affiliation, which is notable in a category where regulators
              and consumer advocates have spent years criticizing deceptive Medicare marketing. Taken together, the
              official disclosures establish Chapter as a licensed intermediary with a compliance-heavy operating model,
              a consumer-first brand narrative, and a broad plan-search claim that later chapters must test against
              product, customer, and risk evidence.
