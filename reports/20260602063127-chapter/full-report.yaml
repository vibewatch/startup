      - number: '2.2'
        title: Sizing Lenses, Segments, and Buyer Map
        blocks:
          - type: paragraph
            body: >-
              Public sources support beneficiary-volume sizing far better than dollar-market sizing. KFF reports just
              over 35 million Medicare Advantage enrollees as of February 2026, up 1.1 million year over year, while 34
              million beneficiaries represented 54% of the eligible population in 2025. The average beneficiary can
              choose among 32 MA-PD plans in 2026, and California alone has 6.5 million Medicare beneficiaries plus 330
              MA plans. Mark Farrah’s 2024 view counted 5,805 distinct Medicare Advantage offerings, underscoring how
              much plan fragmentation seniors and advisors must navigate. These data establish a large and still-growing
              decision market, even if they stop short of giving a direct revenue pool for independent navigators.


              The buyer map is also multi-sided. The end user is the beneficiary, but the payer of underlying claims is
              CMS through private plans, while acquisition influence can sit with health systems, financial advisors,
              and content publishers. Chapter’s own partner materials and partner proof pages make this explicit. Health
              systems want to preserve in-network relationships during transition to Medicare; wealth advisors want to
              protect retiree client outcomes and referrals; publishers want a trustworthy monetization and service
              layer around senior audiences. That combination makes Chapter’s market look more like embedded
              distribution plus regulated advice than a classic consumer app market.
