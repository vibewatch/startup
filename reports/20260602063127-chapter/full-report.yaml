      - number: '3.4'
        title: Moat durability, commoditization, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence is not that digital Medicare navigation lacks demand; it is that the category still
              looks economically fragile and strategically imitable. Medicare Market Insights repeatedly treats eHealth,
              GoHealth, and SelectQuote as a discrete eBroker cohort, while GoHealth's latest results commentary openly
              describes a market reset in which first-renewal probability, margin integrity, liquidity, and
              consolidation readiness matter more than raw volume. Public-market data underline the same point: eHealth,
              GoHealth, and SelectQuote all support meaningful revenue bases, yet their equity values remain modest.
              Investors are effectively saying that commissions receivable, retention, and carrier behavior matter more
              than homepage polish.


              That makes durability a question of what rivals cannot cheaply copy. The reviewed sources suggest that
              recommendation technology alone is not enough, because almost every material alternative now markets AI,
              matching, or proprietary logic next to licensed human guidance. More durable advantages look channel-based
              or trust-based: Chapter's partner distribution, GoHealth's review footprint and post-enrollment support
              story, eHealth's explicit compensation disclosure and broad insurer access, and SelectQuote's cross-sell
              engine plus public unit-economics transparency. Even then, Medicare Rights warns that commission
              incentives can distort broker behavior. The practical diligence conclusion is that Chapter's moat, if it
              exists, likely sits in distribution quality and consumer trust rather than in a standalone algorithm—and
              those advantages must keep compounding faster than a crowded field can imitate them.
            claimRefs:
