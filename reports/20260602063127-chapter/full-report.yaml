      - number: '4.2'
        title: Sales motion, channel economics, and cost structure
        blocks:
          - type: paragraph
            body: >-
              The public pages suggest that Chapter's GTM is built around partner referrals, educational content, and
              licensed-advisor conversion rather than a lightweight software checkout flow. The magazine hub, evergreen
              Medicare explainers, and repeated Talk to an Advisor prompts look like a classic education-to-consultation
              funnel. The advisor-channel page adds a more labor-intensive reality: a licensed agent conversation,
              marketing consent, provider and prescription review, and personalized recommendations. That likely means
              cost structure is dominated by advisor labor, compliance, carrier-integration work, partner management,
              and data-product maintenance. Chapter's own releases reinforce that reading by earmarking 2025 capital for
              enterprise partnerships and data infrastructure, then highlighting flat corporate headcount despite 3x
              revenue growth and ARR above $100 million in 2025.


              Because Chapter is private, the best public unit-economics proxies come from listed peers. SelectQuote
              disclosed a $904 lifetime value of commissions per approved policy, about $2,490 of total revenue per
              MA/MS policy, and a 6.7x revenue-to-CAC multiple. GoHealth said it deliberately reduced activity where
              first-renewal probability did not support economics and is investing in AI to lower CAC and improve
              year-one payback, while keeping operating cash flow as the primary capital-allocation lens. Those
              disclosures strongly imply that Chapter should be analyzed as a high-touch, renewal-sensitive brokerage
              model—not as a SaaS business. The missing piece is Chapter-specific channel math: CAC, payback,
              contribution by partner type, and whether content-led demand is actually cheaper than direct-response
              alternatives.
