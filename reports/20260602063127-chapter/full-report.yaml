  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Chapter looks like a real company with real traction, but valuation requires more than admiration. The
              cleanest public pricing anchor remains the April 2025 Series D, which was widely reported at about $1.5
              billion. The April 2026 Series E clearly raised another $100 million and said valuation more than doubled,
              yet management did not disclose the exact new number. That combination is enough to frame a stance even
              without a precise target. It says the company probably moved above a $3.0 billion lower bound at the same
              time it was only disclosing ARR as being above $100 million and withholding key underwriting inputs like
              burn, debt, retention, and cap-table terms. In other words: Chapter may be a good company, but public
              evidence still leaves investors underwriting an opaque price. That makes the right recommendation track
              rather than buy. The call is not a judgment that the business is broken. It is a judgment that price
              sensitivity and evidence sensitivity both matter, and the current evidence set is stronger on company
              quality than on the exact fairness of the mark.
            claimRefs:
