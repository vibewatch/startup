      - number: '4.3'
        title: Public traction and benchmark economics
        blocks:
          - type: paragraph
            body: >-
              Chapter's disclosed traction is stronger than its disclosed economics. The company says 2025 revenue
              tripled, ARR exceeded $100 million, headcount stayed flat, and new tools such as a provider directory and
              prescription cost calculator shipped. The prior Series D release also highlighted 4x enrollment growth and
              said the company was retaining both enterprise partners and beneficiaries at industry-leading levels,
              though without publishing the underlying numbers. Those are encouraging outputs, especially because they
              suggest productivity gains rather than pure hiring-led expansion. But they are still management-selected
              data points from a private company, not a full audited P&L.


              Public comp data offer a tougher benchmark. eHealth, GoHealth, and SelectQuote all report material revenue
              but carry comparatively modest equity values, and their balance sheets show why investors remain cautious:
              eHealth had about $110.81 million of cash against $133.2 million of debt, GoHealth about $39.88 million of
              cash against $688.12 million of debt, and SelectQuote about $29.81 million of cash against $404.83 million
              of debt. Medicare Market Insights repeatedly tracks the trio side by side on revenue, losses, and LTVs,
              underscoring that the market treats them as a coherent economic category. For Chapter, the implication is
              straightforward: strong ARR growth is helpful, but the sector backdrop says investors will eventually care
              about renewal durability, receivable quality, debt tolerance, and cash conversion at least as much as they
              care about topline growth.
