      - number: '6.3'
        title: Satisfaction, repeat usage, and durability proxies
        blocks:
          - type: paragraph
            body: >-
              The best public durability evidence is still proxy evidence. Reviews are deep and current: the official
              about page and both REVIEWS.io surfaces show 6,126 reviews, a 4.9 score, and a 98% recommendation rate.
              Qualitative themes are consistent across the review mirrors and Ramsey testimonials: peace of mind,
              patient explanation, provider and prescription matching, and long-term fit rather than cheapest-first-year
              recommendations. The year-round advocacy article and HSHS announcement reinforce that the relationship is
              supposed to continue after enrollment, while the OTC Store introduces another post-enrollment surface
              where members can keep extracting value from their plans.


              What this evidence does not do is close the durability question financially. Company materials claim
              industry-leading beneficiary and enterprise-partner retention, but they do not publish the numbers. There
              is no public NRR, GRR, churn, contract-length, or renewal stack. That is why the customer record should be
              described as strong on satisfaction and support, but still partial on durability. Public evidence is
              sufficient to show that people use the service and often like it. It is not yet sufficient to prove how
              sticky those relationships are once measured with investor-grade retention metrics.
