  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - 2026 private price proves far above current support band
        - >-
          Diligence reveals a materially higher mark than the >$3.0B lower-bound inference without offsetting
          unit-economics proof
        - Turns valuation concern from theoretical to concrete
        - Move from track to avoid until pricing or evidence resets
      - - Down round or heavily structured financing
        - Next round prices below market expectations or adds punitive preference terms
        - Signals weak price support and worsens common-equity outcomes
        - Re-underwrite from downside first
      - - Complaint / trust deterioration
        - Meaningful worsening in BBB or other complaint surfaces
        - Weakens the trust-layer premium and partner durability thesis
        - Cut premium assumptions and revisit channel-quality story
      - - Retention or renewal quality disappoints
        - Management cannot show strong cohort durability despite premium pricing
        - Undermines the core argument for paying above public eBroker references
        - Reduce support band materially
      - - Partner concentration proves high
        - A few channels dominate volume or revenue
        - Raises growth fragility and counterparty risk
        - Require tighter discount or pass
      - - Burn and runway prove weak
        - Cash usage or debt burden is worse than implied by recent fundraising
        - Converts opacity into immediate financing risk
        - Treat as financing-dependent, not de-risked
    notes: >-
      These are investor monitoring triggers derived from the public evidence set and the missing diligence items; they
      are not company-issued KPIs.
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV036
      - CV039
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Exact 2026 valuation
        - Share price, diluted share count, and post-money valuation for Series E
        - Without it, investors cannot know how much richer the current mark is than the last exact $1.5B round
        - Request term sheet or investor deck directly from management
      - - Cap table and preference stack
        - Liquidation preferences, seniority, and any side letters
        - Downside outcomes depend on preferences, not just headline valuation
        - Request counsel-prepared cap-table summary
      - - Cash burn and runway
        - Current cash, debt, monthly burn, and financing plan
        - Recent fundraising proves access, not adequacy
        - Request latest board or finance package
      - - Partner concentration
        - Top-channel and top-counterparty mix, renewal, and contract length
        - A partner-led model can look diversified until the real volume mix is known
        - Request partner cohort table
      - - Retention / cohort durability
        - NRR, GRR, churn, retention by partner channel, and complaint-rate trends
        - A premium only holds if trust and economics persist after the first enrollment
        - Request cohort analysis and customer-support KPIs
      - - Exit readiness
        - Audited financial package and IPO/M&A preparation status
        - Price support is stronger if the company is genuinely preparing for a liquidity path
        - Request audit status, banker materials, and readiness roadmap
    notes: >-
      Items are ordered by how directly they would change the recommendation from track to buy or avoid. Exact price and
      capital-structure evidence come first because the current question is valuation discipline, not business
      existence.
    claimRefs:
      - CV006
      - CV007
      - CV039
      - CV040
