      - number: '7.4'
        title: Financial and execution risk with mitigants and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The company's financing story is encouraging but not yet de-risking. Chapter raised $75 million in 2025
              and $100 million in 2026, and the Series E release paired that capital access with revenue tripling and
              ARR above $100 million. Those are real positives. They do not answer the questions investors ultimately
              care about in a brokerage-like model: cash burn, debt, receivable timing, renewal quality, and cohort
              durability. Public e-broker comps make that gap hard to ignore. GoHealth explicitly says first-renewal
              probability and operating cash flow determine where it deploys capital. SelectQuote discloses policy-level
              lifetime value, CAC efficiency, and enormous commissions receivable. Medicare Market Insights treats
              eHealth, GoHealth, and SelectQuote as a coherent analytic set because the economics hinge on renewals,
              payback, and collections rather than on simple top-line growth. Chapter has not published the same depth
              of disclosure. That is why the mitigants in this chapter are real but incomplete: capital access exists,
              trust signals are strong, partner proof is visible, and licensing is broad, yet the residual risk remains
              high until the company discloses more about concentration, control systems, and cash conversion.
