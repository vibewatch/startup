      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Chapter is still a high-touch advice operation wrapped in software and content,
              not a low-friction self-serve product. The advisor workflow depends on reviewing providers, prescriptions,
              priorities, enrollment windows, and changing benefits; customer reviews repeatedly praise knowledgeable,
              patient agents rather than a magical autonomous workflow. That is encouraging, but it also means service
              quality scales through hiring, training, supervision, and documentation. Chapter's own publishing
              reinforces the same point: it maintains scam-call guidance, deceptive-practices commentary,
              open-enrollment guides, Medicare basics, and agent explainers because beneficiaries need interpretation
              and reassurance throughout the year. Operationally, that creates failure modes around recommendation
              consistency, script quality, stale benefit interpretation, and compliance QA. Security and privacy posture
              are also still only partially visible. The public surface shows badges and compliance language, but not
              audited security certifications, formal privacy-control reporting, or incident-history disclosure. In a
              business built on trust and personal health-plan data, that omission keeps residual operational risk
              elevated.
