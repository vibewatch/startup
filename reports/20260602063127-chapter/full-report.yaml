      - number: '7.3'
        title: Partner, channel, and customer concentration risk
        blocks:
          - type: paragraph
            body: >-
              Chapter's distribution model looks credible precisely because it is embedded in trusted intermediaries:
              health systems, advisor networks, publishers, and community-oriented organizations. HSHS, Raymond James,
              and Ramsey all provide live workflow evidence that the partner model is real. Fierce adds another
              important angle by saying the company uses very little direct-to-consumer advertising, which implies the
              model is intentionally partner-led rather than merely opportunistic. That can be efficient and
              trust-enhancing when it works. It also creates substitution risk if large partners underperform or if
              partner trust erodes. Public materials still do not disclose top-partner concentration, contract length,
              exclusivity, or revenue-share terms, so the investment case cannot tell whether growth is broad-based or
              dependent on a handful of channels. ReviewFeeder's description of employers, benefits professionals,
              non-profits, religious institutions, and community leaders broadens the surface area further: more
              channels may reduce single-logo dependence, but they also expand oversight complexity. The result is a
              model that looks strong on distribution proof and weak on concentration transparency.
