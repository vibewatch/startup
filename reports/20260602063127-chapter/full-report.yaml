      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The remaining work is straightforward, not conceptual. Investors need exact pricing, exact terms, and
              evidence that the company's high-trust story converts into durable economics. Public evidence does not yet
              show the 2026 share price, post-money value, liquidation preferences, debt, or burn. It also does not show
              the retention metrics and concentration data that would let a buyer decide whether Chapter deserves a
              premium to the listed eBroker set or whether it is simply a better-marketed version of the same model.
              That means exit readiness is still unproven. A disciplined committee should therefore treat the current
              name as a track candidate with explicit thesis-break triggers: multiple compression if the 2026 round
              price was too aggressive, trust damage if complaint patterns worsen, financing risk if another round comes
              without better disclosure, and strategy risk if partner channels turn out to be more concentrated than the
              brand narrative suggests. The diligence list is not long, but it is decisive.
