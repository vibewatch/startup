      - number: '2.3'
        title: Growth Drivers, Constraints, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers support the market. Medicare Advantage enrollment has risen steadily over two
              decades, extra benefits remain a major selling point, and beneficiaries still face a decision environment
              with high plan count, network variation, and benefit design complexity. KFF and Milliman both imply that
              plans keep competing on value-added benefits even as the rate of growth slows. Chapter’s relevance is
              strongest where that complexity collides with high-stakes decisions, such as provider continuity, drug
              affordability, or confusion during annual enrollment. Special Needs Plans are particularly important
              because they drove most of the 2026 enrollment increase, suggesting that the fastest-growing segment may
              also be the hardest for beneficiaries to navigate without help.


              The constraints are equally real. OIG has an active project on misleading Medicare Advantage marketing,
              Medicare Rights argues that commissions and administrative bonuses distort broker behavior, and the Center
              for Medicare Advocacy says the compensation rule intended to curb abuse was challenged in court and put on
              hold. At the same time, KFF observed fewer general-enrollment plan choices in 2026, which implies tighter
              insurer economics even as total enrollment grows. The adoption path for Chapter therefore depends on
              convincing beneficiaries and partner institutions that a third-party guide can improve outcomes while
              operating inside a market that is highly regulated, politically contested, and still difficult to size in
              direct economic terms.
