  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and the Job to Be Done
        blocks:
          - type: paragraph
            body: >-
              Chapter is not attacking the entire senior-healthcare economy. The public evidence points to a narrower
              but still large job: helping beneficiaries decide when to enter Medicare, compare plan options, enroll,
              and use benefits effectively afterward. The CEO’s Senate testimony is the clearest articulation of this
              boundary. It explicitly describes comparison across Medicare Advantage, Medicare Supplement, Part D, and
              Special Needs Plans, and it frames the core pain as decision complexity rather than lack of insurance
              demand. That distinction matters because it separates Chapter from insurers, care-delivery companies, or
              pure senior-finance publishers. The company is selling navigation, recommendation quality, and trusted
              guidance inside a regulated choice architecture.


              The status quo substitute is Medicare.gov Plan Compare plus self-education. Public evidence suggests that
              status quo is useful but incomplete: the Senate testimony says Plan Finder lacks integrated
              provider-network data and only binary visibility into some ancillary benefits, while the California guide
              shows beneficiaries still face a staged workflow of Part A/B enrollment, supplemental plan comparison, and
              annual review. The market boundary therefore includes high-friction Medicare decision support, year-round
              plan-use help, and partner-embedded retirement guidance. It excludes underwriting risk, provider delivery,
              and most downstream clinical spending.
            claimRefs:
              - CM001
              - CM002
              - CM003
