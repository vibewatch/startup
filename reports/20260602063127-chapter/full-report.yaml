            body: >-
              Chapter's strongest public customer evidence comes from named deployments and partner pages rather than
              from a published customer-count dashboard. The partnerships page contains three unusually specific case
              studies for a private Medicare-navigation company: Zoa Life, Mercer Financial, and Dr. Ed. Zoa offers the
