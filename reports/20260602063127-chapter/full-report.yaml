      - number: '1.3'
        title: Funding History and Distribution Buildout
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed funding gives a clear chronology even if it does not give a complete cap table. Chapter
              raised a $42 million Series B in January 2022, a $50 million Series C in May 2024, a $75 million Series D
              in April 2025, and a $100 million Series E in April 2026. Independent reporting attached a $1.5 billion
              valuation to the 2025 Series D, while the 2026 round was described only in relative terms: the company
              said valuation had more than doubled versus the prior round but did not publish the exact figure. This
              matters because Chapter now sits in the awkward zone between real operating scale and incomplete financial
              transparency; the market can see enough to infer momentum, but not enough to underwrite economics with
              confidence.


              Distribution is the second half of the scale story. Official partnership materials sort Chapter’s
              go-to-market into healthcare systems, financial advisors, and content publishers, while the HSHS and
              Ramsey surfaces show that those channels are live rather than theoretical. The Series C and Series D
              materials repeatedly tied new capital to enterprise capabilities, partner retention, and partner-led
              acquisition rather than to broad direct-response advertising. That fits the company’s broader narrative:
              Chapter is trying to become trusted retirement infrastructure embedded inside other organizations’
              relationships with seniors. If that thesis works, partner-led distribution can be cheaper and stickier
              than paid-media acquisition. If it fails, Chapter could still be an expensive licensed brokerage with a
              polished story but unclear unit economics.
