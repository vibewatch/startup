  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and trust-layer risk
        blocks:
          - type: paragraph
            body: >-
              Chapter sits inside one of the most scrutinized parts of Medicare distribution: marketing, recommendation,
              and enrollment guidance. The regulatory record is not hypothetical. OIG has an active project reviewing
              misleading Medicare Advantage marketing practices and the incentives that drive broker-mediated plan
              changes. Medicare Rights and the Center for Medicare Advocacy both argue that commissions, bonuses, and
              unresolved litigation around compensation rules can distort advice and make the ground rules unstable. CMS
              itself maintains a dedicated marketing-guidelines stack, agent-broker compensation resources, and
              model-document channels, which underscores that this category is regulated as an ongoing conduct problem,
              not a one-time disclosure exercise. For Chapter, that matters because the company markets itself as a
              trust layer that searches every plan, recommends what is best, and operates as a licensed insurance agency
              rather than as a neutral public utility. If documentation, supervision, or recommendation integrity ever
              slips, the core brand promise becomes the primary risk surface rather than the primary moat.
            claimRefs:
