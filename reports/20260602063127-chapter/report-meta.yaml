companyProfile:
  summary: >-
    Chapter is a New York-based Medicare navigation company operating through Memoir, Inc. d/b/a Chapter and Chapter
    Advisory, LLC, its wholly owned licensed insurance-agency subsidiary. Public sources describe a business that
    combines a full-market recommendation workflow, licensed advisors, and partner-led distribution across health
    systems, financial advisors, and publishers. The company raised a $42M Series B in 2022, a $50M Series C in 2024, a
    $75M Series D in 2025, and a $100M Series E in 2026. Publicly disclosed growth signals are strong—3x revenue growth
    in 2025, ARR above $100M, and high visible customer-satisfaction signals—but the company still does not publish
    exact customer count, retention metrics, or detailed financing terms.
