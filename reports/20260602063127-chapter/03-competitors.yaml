- id: pricing-packaging-and-distribution
  title: Pricing, packaging, and distribution power
  body: 'Buyer-facing packaging across the category is strikingly similar. Chapter says advisor-channel consultations are free and that there is no premium difference for clients; GoHealth says its calls come at no cost; SelectQuote advertises free, no-obligation comparisons; and eHealth says it is paid by insurers rather than consumers. That lowers immediate switching friction for seniors, but it also means the real economic battleground is largely off-page. Public materials seldom spell out realized commission rates, renewal mixes, partner revenue shares, or channel-specific payback. SelectQuote is the rare exception: in current public reporting it disclosed approved-policy volume and a 6.7x revenue-to-CAC multiple, which suggests the larger listed brokers manage the business around cohort economics rather than around consumer subscription or software fees.


    Distribution power therefore matters more than front-end pricing. Chapter is pushing partner channels and claims ARR above $100 million, but GoHealth can point to 10 million trusted consumers and visible post-enrollment support, while SelectQuote has broader cross-sell across insurance lines and millions of customers in adjacent categories. eHealth remains important because it openly describes insurer-paid compensation and broad carrier access, which makes it legible to consumers and partners in a way private challengers often are not. Review signals reinforce the same pattern: GoHealth''s archived Trustpilot page shows roughly 42,972 reviews and a 4.8 rating snapshot, while SelectQuote''s archived Trustpilot title still carries a 4.4 score. The competitive message is that price to the buyer is usually zero, so brand, partner reach, and retention economics become the real weapons.'
