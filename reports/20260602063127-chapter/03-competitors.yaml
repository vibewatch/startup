    severity: material
    topic: private-entrant-disclosure-gap
    missingEvidence: Exact carrier counts, customer counts, funding history, and partner concentration for CoverRight and Healthpilot.
    whyItMatters: Without those data, the private-challenger rows in the competitor profile table can only be partial and cannot be sized rigorously against Chapter or the public brokers.
    diligencePath: Request investor decks, partner lists, and current enrollment or customer counts from company spokespeople or from due-diligence materials.
    relatedQuestionRefs:
    - QP013
    - QP023
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized commission rates, renewal mix, partner revenue share, and contribution margin by channel for Chapter and the private entrants.
    whyItMatters: The category markets itself as free to the consumer, so backend economics determine whether any growth is durable or merely volume-driven.
    diligencePath: Obtain carrier contracts, commission schedules, partner agreements, and channel-level contribution analysis.
    relatedQuestionRefs:
    - QP009
    - QP018
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: blocking
    topic: internal-build-gap
    missingEvidence: Public benchmarking of build-versus-buy cost and implementation time for RIAs, health systems, or publishers that might internalize Medicare-navigation workflows.
    whyItMatters: Internal build is a credible substitute, but without cost or time data it cannot be ranked cleanly against specialist vendors.
    diligencePath: Interview partners that considered multiple vendors, collect implementation timelines, and compare internal staffing cost to vendor pricing.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: material
    topic: partner-retention
    missingEvidence: Enterprise partner retention, exclusivity terms, and implementation burden for Chapter and peer distribution channels.
    whyItMatters: Distribution looks like the most durable moat candidate, but that cannot be underwritten from marketing pages alone.
