chapter:
  number: 3
  title: Competitors
  summary: Chapter competes with a crowded Medicare-navigation field led by public e-brokers eHealth, GoHealth, and SelectQuote plus newer advisor-tech entrants such as CoverRight and Healthpilot, while local brokers remain a durable status-quo substitute. Public evidence suggests buyer-facing pricing is usually free and differentiation increasingly rests on distribution, trust, and renewal economics rather than on plan-matching software alone; unsupported cells around private-entrant scale, partner exclusivity, and internal-build economics remain material diligence gaps.
sections:
- id: direct-peer-landscape
  title: Direct peers, incumbents, and newer digital entrants
  body: 'Chapter faces a layered Medicare-navigation field rather than a single head-to-head rival. Its closest public comparables are eHealth, GoHealth, and SelectQuote: all three combine multi-carrier shopping, licensed agents, and consumer-facing digital enrollment, while their public-market footprints show that Medicare brokerage can reach meaningful scale without producing obvious equity-market enthusiasm. eHealth still frames itself as the independent incumbent of the category, with over 25 years in market, access to 180+ insurers, MatchFinder-style plan matching, and roughly $528.91 million of trailing revenue. GoHealth pushes the same broad category promise through PlanFit, 10 million claimed consumer trust, and explicit year-round support. SelectQuote is the structurally broader marketplace because it layers Medicare on top of life, home, and auto, and its third-quarter fiscal 2026 reporting still showed $430.9 million of consolidated quarterly revenue and a 6.7x revenue-to-CAC
    multiple.


    Private challengers prove the category is still easy to enter from a product-story perspective. CoverRight and Healthpilot both market technology-plus-advisor hybrids built around simplifying a confusing decision; Healthpilot explicitly says 100,000+ members chose it over going it alone, while CoverRight positions itself as a modern, transparent concierge for a 65+ million-person Medicare audience. That makes the peer set broad enough that Chapter cannot rely on being the only consumer-friendly broker with software. Instead, its local competitive edge has to come from distribution, trust, and execution against a field where multiple players now claim some mix of AI, matching, and licensed guidance.'
