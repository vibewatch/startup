  topStrengths:
    - >-
      Partner-led distribution across health systems, financial advisors, and publishers gives Chapter a differentiated
      acquisition model relative to many direct-response brokers.
    - >-
      Public growth disclosures are strong for the category: revenue tripled in 2025, ARR surpassed $100M, and the
      company raised another $100M in 2026.
    - >-
      The product surface appears broader than a one-time enrollment flow, with recommendation logic, provider and
      prescription tools, OTC support, and year-round advocacy.
  topRisks:
    - >-
      The company operates in a highly scrutinized Medicare-brokerage category where marketing, commissions, and
      recommendation conduct remain active regulatory and litigation topics.
    - >-
      Exact 2026 valuation, cap-table structure, burn, debt usage, customer count, and retention metrics remain
      undisclosed, limiting underwriting confidence.
    - >-
      Public eBroker comparables provide valuation discipline rather than clear support for a private mark now implied
      to be above the 2025 $1.5B valuation.
  unresolvedGaps:
    - Exact 2026 post-money valuation, share price, liquidation preferences, and any secondary-sale history.
    - Customer-count, retention, NRR/churn, and partner-concentration data by channel.
    - Consolidated cash balance, burn rate, debt usage, and commission/renewal economics.
