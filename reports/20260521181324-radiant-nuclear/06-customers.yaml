    - 'Potential buyers: U.S. and allied installations'
    - Always-on resilient power where outage risk is mission-critical
    - Only Buckley is publicly assigned to Radiant
    - Defense procurement could create large, sticky contracts
    - Conversion depends on federal procurement, NEPA, NRC path, and site-specific sizing
