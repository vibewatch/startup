  evidenceGaps:
  - type: missing-source
    severity: material
    topic: buckley-contract-structure
    missingEvidence: Signed Buckley commercial structure showing ownership, operator of record, contract tenor, payment timing, and decommissioning responsibility.
    whyItMatters: Without the commercial structure, Buckley cannot be translated into expected revenue quality or margin profile.
    diligencePath: Request the relevant OTA or downstream commercial summary plus a responsibility matrix for construction, operations, refueling, and decommissioning.
    relatedQuestionRefs:
    - QU007
  - type: enumeration-incomplete
    severity: material
    topic: broader-customer-roster
    missingEvidence: Any public or private customer roster beyond Equinix and the Buckley pathway, including backlog count and stage-by-stage pipeline.
    whyItMatters: Customer concentration and sales-repeatability cannot be evaluated from one commercial buyer and one defense pathway.
    diligencePath: Request pipeline by segment and stage, named reference customers, and the current backlog count or expected close calendar.
    relatedQuestionRefs:
    - QU011
    - QU026
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-satisfaction
    missingEvidence: Renewal history, churn, NRR/GRR, uptime, customer references, and any satisfaction or NPS data from first deployments.
    whyItMatters: Retention quality determines whether early flagship deals can compound into durable revenue rather than one-time announcements.
    diligencePath: Request cohort metrics, reference calls, SLA reports, and first-site operating data once the initial deployments are energized.
    relatedQuestionRefs:
    - QU021
    - QU022
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: commercial-deployment-sites
    missingEvidence: Specific Equinix site list, unit-per-site architecture, and grid-interconnection responsibilities for the preorder.
    whyItMatters: Site-level architecture determines whether the preorder is edge backup, campus expansion, or something closer to primary power.
    diligencePath: Request first-site shortlist, grid and permitting workstreams, and how many units are expected per facility.
    relatedQuestionRefs:
    - QU003
    relatedTableRefs:
