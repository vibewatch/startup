  - - Department of the Air Force / DIU / Buckley SFB
    - 'Buyer/sponsor: DAF and DIU; end user: Buckley mission operators'
    - Mission-critical base resilience for space surveillance and radar loads
    - Named site pairing; goal of first DAF advanced reactor by 2030 or sooner
    - Strategically important federal validation and potential flagship defense reference
    - No contract value, ownership model, unit count, or final approval disclosed
