- id: retention-concentration-and-disclosure
  title: Retention opacity and concentration dominate the underwriting problem
  body: 'Public customer underwriting is still dominated by what Radiant has not disclosed. No reviewed source provided NRR, GRR, churn, renewal rate, contract length, satisfaction scores, installed uptime at a customer site, or a broader paying-customer count. No source showed a live customer site already generating power. That means the public story is still one deposit-bearing preorder, one named federal pathway, and a wide cone of marketed use cases that may convert later. In practical terms, that makes concentration risk high: if Equinix slows, reprices, or narrows its purchase, or if Buckley slips in NEPA, licensing, or procurement, the public demand narrative becomes much thinner. The absence of a broader roster also makes it hard to tell whether Radiant is building a repeatable sales engine or just landing a small number of flagship relationships. Until deployment sites, pricing, contract tenors, and repeat-order evidence are disclosed, customer quality remains a thesis supported
    by a small number of promising anchors rather than by a broad commercial base.'
