- id: defense-pathway-and-procurement
  title: Buckley validates defense demand, but conversion still runs through procurement and siting gates
  body: 'The Air Force / DIU Buckley path is valuable because it turns abstract military-use marketing into a named federal program, a named installation, and a named mission set. Radiant first disclosed a July 2025 agreement with DIU and the Department of the Air Force, and official April 2026 Air Force materials then paired Radiant with Buckley Space Force Base under ANPI. That is strong customer-like demand proof, but it is not the same thing as booked, recurring operating revenue. Public records still show a pre-deployment program: siting and environmental analyses must proceed under NEPA, licensing remains outstanding, and the exact commercial structure is not disclosed. Partnership for Global Security''s description of military microreactor procurement suggests these projects can involve long-duration third-party ownership and contracting models rather than simple hardware sales. The defense signal is therefore real and strategically important, but investors still need diligence on
    who owns the reactor, who carries decommissioning responsibility, how many units Buckley would need, and when customer cash would actually start.'
