company:
  name: Radiant Nuclear
chapter:
  number: 6
  title: Customers
  summary: 'Radiant''s public customer record is anchored by one strong commercial proof point—Equinix''s preorder with deposits for 20 Kaleidos units—and one strong but still pre-deployment federal pathway—DAF/DIU''s Buckley selection. That is meaningful early demand validation, but not yet a diversified installed base: no live customer site, no broader commercial roster, no public pricing or contract tenor, and no retention or satisfaction metrics are disclosed, leaving concentration and conversion risk high.'
sections:
- id: named-proof-vs-target-segments
  title: Named proof versus target segments
  body: 'Radiant''s public customer evidence is materially narrower than the breadth of end markets on its homepage. Across the Radiant homepage, the Marketplace visit, the Equinix announcements, and the Air Force / DIU materials, only two demand anchors rise above generic marketing: Equinix on the commercial side and the Department of the Air Force / DIU Buckley pathway on the defense side. Everything else—hospitals, remote villages, remote industrial sites, military installations in the abstract, desalination, and microgrids—reads as target segmentation or use-case marketing rather than a disclosed signed counterparty. That distinction matters because a named preorder with deposits is much stronger than a website use case, and a government site selection with NEPA still outstanding is much stronger than a logo but materially weaker than an operating customer. The chapter therefore treats Radiant as having real early demand proof, but not yet a diversified installed customer base.'
