- id: equinix-commercial-demand
  title: Equinix is the strongest commercial signal, but still a long-horizon one
  body: 'Equinix is the clearest commercial proof point because both sides publicly acknowledged a 20-unit preorder and deposits, something stronger than a generic memorandum or a reference logo. Just as important, Equinix explained why it cared: the company is searching for firm round-the-clock power as AI-driven demand strains grids and power procurement. But Equinix''s own disclosures also prevent investors from over-reading the deal. Radiant sits inside a broader Equinix portfolio that also includes Oklo, ULC-Energy / Rolls-Royce SMR, Stellaria, Bloom fuel cells, natural-gas capacity, and grid upgrades. Equinix told Data Center Knowledge that many next-generation nuclear technologies remain several years from deployment, that site selection is still early, and that policy changes, faster permitting, and skilled labor are still needed. Public materials disclose the unit count and existence of deposits, but not deposit size, refundability, site list, contract tenor, per-unit economics,
    or how much of Equinix''s future nuclear load Radiant would actually win.'
