- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Equinix converts preorder into site-by-site rollout
    - Only one named commercial buyer is public
    - A scaled Equinix rollout would validate commercial repeatability; a slowdown would materially weaken public demand proof
    - Obtain site list, deployment cadence, payment milestones, and any exclusivity or caps
  - - Buckley converts from selection into operating reactor
    - Only one named defense pathway is public
    - Successful Buckley energization would validate military adoption; delay would push defense revenue farther out
    - Request NEPA timeline, NRC path, contract owner/operator structure, and acceptance criteria
  - - Follow-on DAF or DoD bases after Buckley
    - No publicly disclosed follow-on Radiant base orders
    - Would reduce single-site risk and prove repeatability inside federal procurement
    - Request pipeline of additional bases, option structure, and budget authority
  - - Broader commercial data-center buyers beyond Equinix
    - No additional named colo or hyperscale buyers
    - Would diversify ACV and reduce dependence on one flagship logo
    - Request qualified pipeline by segment and stage, plus any signed LOIs or deposits
  - - Target-segment conversion outside data centers and defense
    - Hospitals, remote villages, and microgrids remain marketing use cases
    - Could open diversified smaller-volume channels, but currently adds narrative more than proof
    - Request actual pilots, customer names, and proof that procurement cycles exist outside flagship verticals
  - - Sizing and operating model for defense loads
    - ANPI public materials discuss 3–10 MWe installations while Kaleidos is about 1–1.2 MWe
    - If multiple units or custom architecture are required, contract complexity and timing could increase
    - Request Buckley system architecture, unit count, redundancy design, and service obligations
  notes: This table focuses on whether the current named counterparties can become repeatable, diversified revenue rather than whether the product sounds attractive in theory. Impact is qualitative because public contract economics are not disclosed.
  claimRefs:
