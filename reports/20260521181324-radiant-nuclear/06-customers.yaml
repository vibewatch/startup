  - CU043
- id: TU006
  title: Contract-quality and disclosure gap table
  columns:
  - Counterparty / topic
  - What is public
  - What is not public
  - Why it matters
  - Diligence ask
  rows:
  - - Equinix preorder economics
    - 20-unit preorder and deposits
    - Deposit size, refundability, per-unit pricing, milestone schedule, service pricing
    - Determines whether the preorder meaningfully de-risks working capital or is mostly symbolic
    - Provide commercial term sheet or signed order form summary
  - - Equinix deployment architecture
    - Units are intended for data-center use
    - Which sites, how many units per site, grid interconnection scope, backup architecture
    - Needed to judge whether the order is edge, backup, or primary-power scale
    - Provide site shortlist and expected first-facility architecture
  - - Buckley commercial structure
    - Named site pairing under ANPI and federal resilience rationale
    - Contract value, ownership, operator of record, decommissioning liability, payment timing
    - Needed to tell whether Buckley is equipment revenue, long-term service revenue, or a third-party PPA-style structure
    - Provide OTA/award summary and expected commercial model
  - - Broader customer roster / backlog
    - Equinix and Buckley are named
    - Total customer count, stage-by-stage pipeline, repeat orders, additional named logos
    - Core input for concentration and sales-repeatability analysis
    - Provide pipeline by segment, stage, and expected close date
  - - Retention / satisfaction evidence
    - No live public customer site and no public churn or NPS data
    - Renewals, satisfaction, uptime, SLA performance, referenceable deployments
    - Without these metrics the public customer story remains pre-operational
    - Provide customer references and early operating KPIs after first energization
  notes: This table treats missing commercial terms as a central analytical finding rather than as a formatting omission. Each missing field directly affects concentration, working-capital, or conversion-risk analysis.
