      - number: '4.4'
        title: Financing implications, adverse evidence, and underwriting verdict
        blocks:
          - type: paragraph
            body: >
              The central financing implication is straightforward: Radiant looks financeable in venture terms but not
              yet underwritable in project or operating terms. Venture investors have already funded the company at
              scale, and the public record shows state support, DOE engagement, named customers, and an NRC
              materials-license process that is far more concrete than many advanced-nuclear startups ever achieve. But
              those positives sit beside several unresolved dependencies. DOE says HALEU is still not available from
              domestic suppliers, UCS highlights proliferation and security concerns tied to HALEU use, and the DOME
              campaign is self-funded and contingent on milestones. That means delays in fuel contracting, testing, or
              licensing could force Radiant to consume more capital before revenue arrives.


              Adverse sources also matter because they highlight risks that fundraising announcements naturally
              understate. Beyond Nuclear focuses on community opposition, transport, waste, and taxpayer-liability
              concerns around the factory-return refueling model, while the American Bar Association notes how little
              real North American SMR deployment precedent exists despite policy momentum. The public record still lacks
              contract values, backlog conversion terms, deposit mechanics, cash balance, burn, and margin data. So the
              right financial verdict is not that Radiant lacks momentum; it is that the company remains a
              milestone-financed, disclosure-light business where future fundraising, not current reported operations,
              is still the main buffer against schedule slip and commercialization risk.
