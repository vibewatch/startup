      - number: '2.2'
        title: Buyer Segments, Budget Owners, and Procurement Paths
        blocks:
          - type: paragraph
            body: >
              The buyer map is segmented more by operating context than by reactor technology. For defense, the relevant
              customer

              is an installation-energy or resilience sponsor inside the Army, Air Force, or broader federal
              installation system;

              Project Pele, Janus, Eielson, and Buckley all point to this channel. For data centers, the buyer is more
              likely the

              operator's energy or procurement function than the tenant or application owner, because the public
              evidence is framed

              around portfolio power strategy, chief procurement oversight, and long-horizon power contracts. Remote
              industrial,

              community, and emergency-response use cases sit in a third bucket where the pain point is usually fuel
              logistics,

              weak transmission, or high outage costs rather than pure AI growth.


              Radiant's commercial model matters because it supports either direct unit sales or power-purchase style
              structures.

              That flexibility makes the payer different across segments: a service branch, a data-center operator, a
              mine owner,

              or a public sponsor could each fund the asset under different contracting logic. Equinix is the strongest
              public

              commercial proof because it converted interest into a preorder with deposits, but even there the public
              record still

              stops short of fully disclosed site economics, unit pricing, or a public deployment schedule by campus.
            claimRefs:
              - CM005
              - CM006
