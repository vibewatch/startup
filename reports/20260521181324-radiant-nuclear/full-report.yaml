              - CV043
              - CV044
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV016
              - CV031
              - CV032
              - CV036
              - CV041
              - CV042
      - number: '8.4'
        title: Thesis-break triggers and the evidence still missing
        blocks:
          - type: paragraph
            body: >-
              The most useful valuation work now is not trying to guess a 2029 EBITDA margin; it is identifying what
              evidence would actually change the call. Several issues remain plainly open from public evidence. The
              Equinix preorder is real, but deposit size, refundability, exclusivity, and backlog conversion are not.
              Radiant’s financing momentum is real, but burn, runway, current cash, and the preference stack are not
              public. Regulatory progress is real, but a Part 70 filing and accepted review are not the same thing as a
              commercial reactor operating license. Fuel access is improving, but DOE still describes HALEU supply as
              unavailable from domestic suppliers. These gaps matter directly to valuation because they decide whether
              the current mark is merely aggressive or genuinely unsupported. The right diligence posture is therefore
              trigger-based: if DOME slips, if licensing drifts, if the next financing reveals expensive structure, or
              if flagship customer economics remain opaque after the next milestone cycle, the mark deserves to
              compress. If the opposite happens, the valuation case can strengthen quickly.
            claimRefs:
              - CV019
              - CV020
              - CV034
              - CV035
              - CV036
              - CV038
              - CV044
              - CV045
          - type: table
            tableRef: TV005
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV018
              - CV034
              - CV035
              - CV038
              - CV044
          - type: table
            tableRef: TV006
            claimRefs:
              - CV034
              - CV035
              - CV036
              - CV040
              - CV045
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Current stance: Research-more / track, not buy'
            body: >-
              The public record supports Radiant as a serious, well-financed nuclear startup, but not as a company whose
              current marked valuation is obviously cheap. Without private evidence on revenue, burn, backlog
              conversion, and preferences, the right call is to monitor rather than chase the round headline.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV040
              - CV041
              - CV042
          - type: callout
            title: Treat >$1.8 billion as directional, not definitive
            body: >-
              The most cited valuation number is investor- and media-reported. It is decision-useful as a current market
              signal, but not precise enough to anchor a false-precision target price.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV040
          - type: callout
            title: Scenario ranges are estimated and milestone-driven
            body: >-
              The bear, base, and bull ranges below are estimated from milestone-adjusted comparisons to public and
              private nuclear peers. They are not DCF outputs and should move materially when private data on cap table,
              cash, or customer economics becomes available.
            calloutType: assumption
            claimRefs:
              - CV037
              - CV043
