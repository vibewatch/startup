      - number: '3.2'
        title: Direct portable peers
        blocks:
          - type: paragraph
            body: >-
              Radiant’s best public case against direct peers starts with logistics. Its own materials emphasize truck
              or aircraft delivery, no site excavation, next-day startup, no on-site water use, and a factory refueling
              loop after five or more years. On that evidence set, Radiant is the cleanest fit for the “replace diesel
              at a constrained site” job. Westinghouse eVinci is the most credible disclosed commercial rival because it
              also offers a factory-assembled transportable system, but it steps up to 5 MWe and advertises an
              eight-plus-year core. That makes eVinci stronger where a site needs more output from one box, yet less
              tightly matched to the smallest remote-load use cases Radiant is targeting.


              Defense programs complicate the picture. Project Pele demonstrates that the U.S. government is willing to
              fund transportable microreactor development, and EIA’s 2026 overview shows that defense and federal pilot
              programs have room for BWXT, Oklo, Radiant, Westinghouse, X-energy, Kairos, and others. That is good for
              category validation but bad for exclusivity. If military installations become the earliest real buyers,
              channel power may sit with government programs and prime-contractor relationships, not with the
              technically neatest commercial package.


              Oklo and NANO matter for different reasons. Oklo has a 1-5 MWe Aurora pilot at Eielson, but its most
              visible 2026 commercial proof is a 1.2 GW Ohio agreement with Meta, which points toward campus-scale
              clean-firm supply more than shipping-container portability. NANO, by contrast, is publicly listed and
              ambitious across KRONOS, ZEUS, LOKI, and HALEU logistics, but the reviewed public material still reads as
              development-stage portfolio building rather than near-term customer conversion. One additional caution for
              Radiant is that public sources are not fully consistent on Kaleidos’ size: company and NRC materials point
              to roughly 1 MWe, while outside and partner-oriented coverage around Equinix describes 1.2 MWe. That
              discrepancy does not erase the portable-niche thesis, but it does matter because size class is central to
              why Radiant is different from eVinci and from the larger adjacent SMRs.
                    
