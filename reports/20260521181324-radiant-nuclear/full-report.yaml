      - number: '1.4'
        title: Execution Milestones and Regulatory Path
        blocks:
          - type: paragraph
            body: >
              Radiant's 2025-2026 cadence matters because nuclear startups are usually constrained by test
              infrastructure,

              licensing, and fuel procurement rather than only by fundraising. DOE conditionally selected Radiant in
              July 2025

              for the first DOME microreactor test campaign at Idaho National Laboratory, and government DOME materials
              confirm

              that the site is the world's first dedicated microreactor test bed for fueled experiments up to 20 MWt. In

              February 2026, DOE approved Radiant's DARK submission, which the company described as satisfying the
              intent of a

              Preliminary Documented Safety Analysis and as the second of three required safety-document phases before
              startup.

              In April 2026, the Air Force and DIU chose Radiant for Buckley Space Force Base, and in May 2026 the NRC
              formally

              accepted for review Radiant's Part 70 license application for the R-50 production facility in Tennessee.
              Radiant

              also says the Oak Ridge factory is intended to scale to 50 reactors per year. This is substantial
              execution

              evidence, although it remains pre-revenue, pre-startup, and pre-license-completion evidence.
