  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Radiant is selling Kaleidos as a portable nuclear generator rather than as a conventional site-built
              plant. Across the homepage, Buckley announcement, Equinix preorder release, and Marketplace profile, the
              company consistently positions the unit as a diesel-generator replacement for remote facilities,
              hospitals, military installations, and data centers. That framing is partly corroborated by outside
              sources: NRC describes Kaleidos as a transportable approximately 1 MWe / 3 MWth microreactor contained in
              a single shipping container, while Equinix-related reporting confirms at least one serious commercial
              buyer is treating the product as on-site digital-infrastructure power rather than as an abstract future
              reactor concept. The workflow implied by public evidence is unusually factory-centric for nuclear: the
              unit is built, fueled, and tested offsite, trucked or flown to the customer, installed quickly, operated
              for roughly five years before refueling, and then returned for centralized servicing. This workflow is
              attractive because it minimizes site construction and local nuclear handling, but it also means the
              commercial product is not just the reactor core. It is the full logistics chain: factory fueling,
              transport approvals, on-site integration, remote monitoring, and turnaround capacity when units come back
              for refuel or refurbishment.
