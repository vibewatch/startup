      - number: '3.3'
        title: Adjacent distributed nuclear benchmarks
        blocks:
          - type: paragraph
            body: >-
              The larger distributed-nuclear vendors are not direct substitutes for a 1 MWe portable unit, but they are
              very real competitors for budget and buyer attention. Last Energy’s public pitch is the clearest
              commercial overlap at the contract-model level: it also uses a PPA/full-service delivery posture, yet it
              does so around a 20 MWe PWR-20 plant for data centers and industrial sites. NuScale goes further up the
              scale ladder. Its 77 MWe factory-built pressurized-water module and ENTRA1 financing menu show that larger
              SMR vendors can offer electricity-as-a-service without asking a customer to own the reactor, which weakens
              any argument that Radiant uniquely owns the PPA narrative.


              X-energy and Kairos are the most important adjacent technical benchmarks. X-energy’s Xe-100 keeps the
              TRISO-and-helium family resemblance to Radiant, but the product is an 80 MWe / 200 MWt industrial platform
              with industrial steam as part of the value proposition and a four-unit Dow project as the flagship
              deployment. Kairos shifts to molten-salt cooling and a 150 MWe minimum two-reactor plant, pairing that
              size with online refueling, data-center and industrial positioning, three approved NRC construction
              permits, and a Google agreement for up to 500 MW by 2035. These are stronger references for licensing
              maturity, industrial heat, and very large campus loads than anything Radiant has disclosed.


              The practical implication is that Radiant should not be benchmarked only against other microreactor
              startups. For hyperscalers, large industrials, and big campuses, the live choice may be between a small
              portable reactor, a larger advanced-reactor PPA, and a non-nuclear status quo option. That means Radiant
              wins where mobility, small-footprint resilience, and fast deployment dominate; it loses when the buyer
              values scale, public-company disclosure, steam output, or the confidence that comes with a
              multi-hundred-megawatt project backed by utility and industrial partners. Terrestrial Energy is also in
              the broader DOE pilot-program field, but the fetched public material here was too sparse to profile it as
              precisely as NuScale, X-energy, Kairos, or Last Energy.
                    
