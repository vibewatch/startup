      - number: '2.3'
        title: Demand Drivers
        blocks:
          - type: paragraph
            body: >
              The most visible near-term driver is the electricity problem created by AI and hyperscale data-center
              expansion.

              DOE and Belfer both cite a sharp jump in U.S. data-center power demand, with 2028 electricity use
              potentially far

              above 2023 levels and some regions already seeing power scarcity, project delays, or direct contracting
              around the

              grid. That does not automatically make microreactors the winning solution, but it does create a credible
              reason for

              data-center operators to evaluate firm on-site power rather than relying only on normal utility timelines.


              Radiant's market, however, is not only an AI story. Official microreactor program materials repeatedly
              emphasize

              diesel replacement, remote communities, mining or off-grid industry, critical infrastructure resilience,
              and defense

              operations. Those segments are attractive precisely because they do not need hundreds of megawatts; they
              need a small,

              transportable, low-water, long-refueling-interval asset. Decarbonization helps, but the stronger driver is
              often the

              cost and operational burden of fuel deliveries, outage risk, or limited transmission access. That
              combination is why

              a 1 MWe transportable reactor can have a real niche even when the broader nuclear sector grows slowly.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
              - CM017
              - CM037
