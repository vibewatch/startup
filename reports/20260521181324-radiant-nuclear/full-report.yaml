      - number: '2.4'
        title: Constraints, Timeline Risk, and Adoption Friction
        blocks:
          - type: paragraph
            body: >
              The central market constraint is not lack of stated demand; it is the slow conversion of interest into an
              operating

              asset. DOE's own microreactor program highlights economic viability and licensing readiness as gating
              issues, EIA

              notes that lengthy licensing and approval have historically limited nuclear expansion, and Radiant's NRC
              materials

              show multiple parallel workstreams around factory fueling, materials licensing, and regulatory gap
              analysis. DOME is

              strategically important because it lowers technical and safety-demonstration risk, but a test bed is not
              the same as

              a commercially repeated deployment pathway.


              Fuel adds a second gating layer. DOE has bridged near-term needs with HALEU allocations, but Utility Dive
              still

              describes domestic civilian HALEU supply as constrained by infrastructure gaps, and UCS highlights
              security and

              proliferation criticism that could raise scrutiny for civilian deployments. Customer adoption has its own
              frictions:

              data-center buyers must solve ownership, tariff, and campus-integration questions, while military and
              remote-site

              customers face public procurement, trust, security, and host-site acceptance issues. The result is a
              market with real

              pull but long, non-linear adoption cycles.
            claimRefs:
              - CM015
