      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and preferences
        - Post-Series D share count, security terms, liquidation stack, and any investor protections
        - Determines whether today’s headline mark translates into real common-equity value
        - Request cap table, term sheet summary, and preference waterfall from counsel or CFO
      - - Cash, burn, and runway
        - Current unrestricted cash, monthly burn, and downside runway under slip cases
        - Capital raised alone does not prove adequacy through test, licensing, and factory spend
        - Request latest balance sheet, budget, and board financing trigger memo
      - - Deposit economics and backlog conversion
        - Per-unit deposit size, refundability, milestones, cancellation rights, and exclusivity terms
        - Needed to distinguish real commercial de-risking from strategic signaling
        - Request signed Equinix term sheet and management revenue-recognition memo
      - - Unit economics
        - Quoted reactor price, PPA tariff, gross-margin bridge, and service / refueling cost stack
        - Needed before any precise return or exit model is credible
        - Request customer pricing deck, costed BOM, and gross-margin sensitivity analysis
      - - Independent mark support
        - Any third-party 409A, secondary, tender, or external mark supporting current pricing
        - Separates a live market-clearing valuation from investor storytelling
        - Request the latest board-marking package and any secondary transaction evidence
      - - Customer deployment economics
        - Site schedule, grid-comparison economics, and payment timing for flagship accounts
        - Determines whether customer proof can actually become cash at acceptable margins
        - Request site-by-site pipeline review with contractual status and expected cash milestones
    notes: >-
      Every row corresponds to a missing input that could materially move valuation from stretched to defendable or from
      aggressive to unsupported. These are the highest-priority diligence asks before underwriting new money.
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV040
      - CV045
