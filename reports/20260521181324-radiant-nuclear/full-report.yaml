chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Commercial Framing
        blocks:
          - type: paragraph
            body: >
              Radiant Nuclear is a private El Segundo, California startup founded in 2020 to build portable,
              mass-produced

              nuclear microreactors as a replacement for diesel generation in places where fuel logistics or grid
              reliability are

              poor. The flagship product, Kaleidos, is consistently described in company materials as a 1 MWe
              microreactor that

              uses TRISO fuel, helium gas coolant, passive air cooling, and a containerized format that can move by
              truck or

              aircraft. The product pitch is explicitly not bulk-grid generation; it is resilient on-site power for
              military

              installations, data centers, remote industry, hospitals, emergency response, and remote communities.
              Radiant says

              Kaleidos can operate for five or more years before refueling, can be refueled a total of four times for a
              20-year

              lifetime, and can be sold either through direct unit sales or power purchase agreements. The roadmap
              remains

              aggressive: a first fueled DOME test in 2026 and initial customer deployments beginning in 2028. Those
              attributes

              create a differentiated portability-and-water-independence story, but public proof still stops short of an

              operating reactor or commercial revenue.
