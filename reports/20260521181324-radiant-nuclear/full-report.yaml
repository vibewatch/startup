        title: Cost structure, scale-up spend, and unit-economics proxies
        blocks:
          - type: paragraph
            body: >
              Radiant's public disclosures give real spend signals but not finished unit economics. The clearest capex
              proxy is the planned $280 million Oak Ridge factory, while the clearest near-term operating-spend proxy is
              the jobs board: 66 open roles across engineering, operations, finance, supply chain, and regulatory work,
              with top salary bands reaching $314,475 plus equity. Those postings make it hard to argue the company is
              in a low-burn phase. They also show that the pre-revenue organization is simultaneously paying for product
              engineering, licensing, manufacturing readiness, and corporate infrastructure.


              Additional cost signals reinforce the capital intensity. DOE says DOME experiments are self-funded by
              applicants and depend on fuel availability and regulatory readiness. The Part 70 filing shows the factory
              model includes fueling, environmental review, material control, physical security, and expedited
              regulatory workstreams. Independent coverage also reported a separate Urenco HALEU-related agreement,
              suggesting fuel-procurement spend exists in addition to factory capex. Put together, the public record
              supports a view of Radiant as a manufacturing-plus-service business with meaningful regulatory,
              supply-chain, and payroll obligations before commercial revenue is disclosed. What the record does not
              support is any hard public number for customer price, gross margin, CAC, payback, or even total headcount,
              so public unit-economics work must remain proxy-based.
