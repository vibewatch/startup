      - number: '2.5'
        title: Judgment and Open Market Gaps
        blocks:
          - type: paragraph
            body: >
              The most reusable diligence judgment is that Radiant sits inside a real but still pre-commercial market.
              Public

              evidence supports meaningful demand pull from defense and digital infrastructure buyers, yet no reviewed
              source

              isolates a standalone SAM for transportable 1 MWe reactors, and no reviewed public source provides a
              validated

              cost-versus-diesel or cost-versus-grid benchmark for Kaleidos itself. Broad SMR market reports therefore
              help only as

              directional context; they cannot be used alone for customer conversion or valuation logic.


              For later customers and valuation work, the right approach is to size the market from proof points and
              conversion

              hurdles: how many candidate sites exist, which ones can tolerate nuclear lead times, what contract model
              they can

              support, and how quickly fuel, licensing, and siting constraints can clear. That creates a narrower but
              more credible

              market thesis than a generic “large nuclear TAM.” It also preserves the biggest unknowns instead of
              papering over

              them: economics, backlog conversion timing, and the real pace at which buyers move from preorder or pilot
              language to

              installed operating units.
            claimRefs:
              - CM030
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
              - CM036
              - CM040
              - CM041
