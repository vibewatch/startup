      - number: '1.3'
        title: Capital Formation, Stakeholders, and Named Demand Signals
        blocks:
          - type: paragraph
            body: >
              Radiant moved from venture-backed concept to heavily financed commercialization story in 2025. The company
              closed a

              $165 million Series C in May 2025, taking public cumulative funding to $225 million, then announced a new
              round of

              more than $300 million in December 2025 led by Draper Associates and Boost VC. Those disclosures imply
              more than

              $525 million of public venture funding by year-end 2025. DCVC additionally said the December round valued
              Radiant

              above $1.8 billion, but that mark came from an existing investor rather than a filing or neutral market
              reference,

              so it is best treated as a directional signal rather than a fully corroborated fair-value anchor. The
              backer set

              now spans financial VCs and strategic names including DCVC, Draper Associates, Boost VC, Andreessen
              Horowitz,

              Founders Fund, Union Square Ventures, Chevron Technology Ventures, and Lockheed Martin Ventures. The
              strongest

              public demand proof is both commercial and defense linked: Equinix placed deposits for 20 reactors, and
              the

              Department of the Air Force/DIU selected Radiant for Buckley Space Force Base. Missing from public view
              are

              pricing, backlog conversion, reactor margins, and backlog beyond named counterparties.
