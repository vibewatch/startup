      - number: '5.2'
        title: Core architecture, power conversion, and thermal design
        blocks:
          - type: paragraph
            body: >-
              On the architecture itself, the strongest independent corroboration now comes from the NRC pre-application
              page and independent trade coverage rather than from Radiant's own marketing copy alone. NRC says Kaleidos
              is a high-temperature gas-cooled reactor using TRISO fuel, helium gas coolant, and prismatic graphite
              blocks, all contained in a single shipping container. DOE's broader HTGR explainer and INL
              technical-materials pages support the idea that TRISO fuel, helium cooling, and graphite moderation are
              established features of the reactor class, so Radiant is not inventing a new fuel or moderator system from
              scratch. What remains much less proven is the integrated package around those known materials. The
              homepage claims zero on-site water use via fans and passive air-jacket cooling, rapid full-power startup
              after delivery, and a combined electricity-plus-thermal-output package that can support heating or
              desalination. Those claims are directionally repeated by trade articles, but they are not yet backed by
              public operating data from a fueled run. The result is a mixed technology picture: the material stack
              looks class-consistent, but the package-level thesis depends on unproven integration of dry cooling,
              shielding, transportability, and power-conversion hardware in one factory-built box.
