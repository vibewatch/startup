      - number: '1.2'
        title: Leadership, Founder Fit, and Governance Visibility
        blocks:
          - type: paragraph
            body: >
              Radiant's external narrative is unusually founder-centric. Doug Bernauer remains the dominant public face
              of the

              company and is repeatedly framed by investors and partner pages as the engineering and execution anchor
              behind the

              Kaleidos program. That concentration is partly offset by a materially stronger public bench in 2025-2026.
              Rita

              Baranwal joined in June 2025 as Radiant's first Chief Nuclear Officer after serving as Assistant Secretary
              for

              Nuclear Energy at DOE and then in senior Westinghouse roles, adding heavyweight regulatory and
              nuclear-operations

              credibility. By late 2025 and early 2026, Mike Starrett was public as Chief Revenue Officer, Tori
              Shivanandan was

              public as Chief Operating Officer, and Radiant said it had added almost a dozen VP- and director-level
              leaders

              across engineering, manufacturing, and supply chain. Even so, governance transparency is still limited.
              Reviewed

              public sources do not disclose a full board roster, committee structure, investor seat allocation, or
              control

              rights, which keeps key-person and governance diligence elevated despite clear progress in leadership
              build-out.
