  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, commercialization path, and disclosure limits
        blocks:
          - type: paragraph
            body: >
              Radiant's public monetization story is clear at the category level and opaque at the contract level. The
              company website says customers can buy Kaleidos through either direct unit sales or power purchase
              agreements, which is strategically important because it means Radiant is not locked into a pure
              hardware-sale model. The same materials frame Kaleidos as a diesel-replacement power product for remote
              sites, hospitals, military bases, and data centers, and the best public demand proof is the Equinix
              preorder with deposits for 20 reactors plus the Department of the Air Force/DIU agreement aimed at a
              military-base deployment. Those facts matter, but they are not the same thing as disclosed revenue
              quality.


              None of the reviewed public sources disclose the per-unit sale price, any PPA tariff, the size or
              refundability of Equinix's deposits, milestone-payment schedules, or how early customer cash would be
              recognized in revenue. The five-plus-year return-to-factory refueling loop also implies a service and
              logistics obligation that could become either a recurring-margin engine or a recurring-cost burden, yet
              public materials do not separate those economics. The result is a credible commercialization narrative
              with named counterparties and payment signals, but not enough evidence to model ASP, contribution margin,
              or the split between one-time hardware revenue and longer-duration service revenue.
