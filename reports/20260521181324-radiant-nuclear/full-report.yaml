            title: Radiant's market is segment-first, not generic SMR TAM
            body: >-
              The strongest reusable market lens is a segment-by-segment view anchored in data-center demand, defense
              programs, and remote-power use cases. Broad SMR forecasts are useful context, but they materially
              overstate Radiant's direct SAM unless they are narrowed to 1 MWe-class transportable deployments.
