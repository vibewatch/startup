      - number: '4.2'
        title: Capital raised, valuation markers, and apparent adequacy
        blocks:
          - type: paragraph
            body: >
              Public capital formation is the strongest part of Radiant's financial record. The May 2025 Series C closed
              at $165 million and explicitly took total venture funding to $225 million. The December 2025 Series D then
              added more than $300 million, which means at least $525 million of cumulative public venture capital can
              be confirmed from company disclosures alone. Those rounds were explicitly tied to Kaleidos development,
              commercialization, the DOME schedule, and the Tennessee factory program. Tennessee officials separately
              described the Oak Ridge project as a $280 million manufacturing and R&D investment that will create 175
              jobs, which is a useful spending signal even though it is not the same as cash already spent.


              Even so, capital raised is not the same as capital adequacy. No fetched public source discloses cash on
              hand after the Series D, a current monthly burn rate, or a verified runway calculation. The widely
              repeated valuation marker above $1.8 billion comes from DCVC, an existing investor, rather than a filing
              or market-clearing secondary transaction, so it should be treated as directional rather than definitive.
              Public evidence therefore supports the judgment that Radiant has attracted enough capital to keep
              executing through major 2026 milestones, but it does not support a precise answer to whether current
              liquidity is enough to finish the factory, execute the test campaign, absorb delays, and bridge to
              meaningful customer cash generation.
