  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Licensing, environmental review, and authorization risk
        blocks:
          - type: paragraph
            body: >-
              Radiant’s authorization path is materially more concrete than a year ago, but it is still stacked rather
              than finished. The R-50 Part 70 review moved the factory-fueling concept into formal NRC review, yet the
              accepted application covers the fueling building rather than the Kaleidos reactor itself, and the NRC has
              already said a separate reactor application is still expected. On the deployment side, the Air Force’s
              Buckley pairing is real demand validation, but the official next step is siting and environmental analysis
              under NEPA, not construction authority. NRC’s proposed Part 57 framework could eventually make repeat
              microreactor licensing cheaper and faster for eligible designs, but it is still a proposed rule and not a
              bankable entitlement. DOE’s new advanced-reactor categorical exclusion can accelerate DOE-controlled
              actions, but legal analysis is clear that it does not eliminate NRC, state, tribal, or local reviews. For
              investors, the key takeaway is that licensing risk remains multi-gate: factory approval, reactor approval,
              transport treatment, and site acceptance all have to clear.
