  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >
              The relevant market for Radiant is not “all nuclear,” and it is not even the entire small modular reactor
              sector.

              Public sources consistently describe microreactors as very small, transportable reactors intended for
              decentralized,

              non-conventional markets where a 1 MWe-class asset can solve a site-level reliability or logistics
              problem. For

              Radiant, that means resilient power at the edge of the grid: military installations, data centers, remote
              industry,

              backup critical infrastructure, and isolated communities. It does not mean bulk-grid baseload generation,
              utility

              fleet replacement, or the full revenue pool implied by broad 300 MWe-or-less SMR forecasts.


              The best sizing approach is therefore multi-lens rather than single-TAM. DOE/LBNL and Belfer give a
              credible demand

              lens for data centers, while Equinix, Project Pele, Janus, and Eielson give concrete segment proof for
              early

              adopters. By contrast, vendor SMR market reports are useful only as upper-bound context because they
              bundle reactor

              classes and grid-scale applications far beyond Radiant's direct scope. The practical conclusion is that
              Radiant's

              SAM is narrower but more tangible than generic SMR TAM decks suggest: it sits where diesel, weak grids, or

              interconnection bottlenecks make portable clean firm power economically or operationally worth serious
              buyer effort.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
