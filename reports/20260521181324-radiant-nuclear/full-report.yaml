      - number: '1.5'
        title: Adverse Factors and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Strong milestone density should not be mistaken for fully de-risked commercialization. Radiant still does
              not

              publicly disclose current revenue, ARR, headcount, full board composition, investor control rights, exact
              backlog,

              unit pricing, or gross margin. Public evidence names demand signals, but it does not independently verify
              claims on

              partner pages that Radiant is effectively sold out through 2030, and it does not quantify backlog outside
              the

              Equinix preorder and Buckley pathway. The other major dependency is fuel. DOE's HALEU allocations help
              near-term

              testing, but Utility Dive reported that the domestic HALEU market still faces infrastructure gaps, and UCS

              highlighted a Science-related analysis arguing that HALEU above roughly 12% U-235 can present more serious

              proliferation and terrorism risks than publicly acknowledged by government and industry. In practical
              diligence

              terms, Radiant's next hard proof points are a successful fueled test, clearer fuel contracting, and
              disclosure of

              commercial metrics rather than additional milestone press releases.
            claimRefs:
