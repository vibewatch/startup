slug: "radiant-nuclear"
runDate: "2026-05-21"
company:
  name: "Radiant Nuclear"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Radiant Nuclear is an El Segundo, California advanced-nuclear startup founded in 2020 to mass-produce portable
    microreactors, with Kaleidos positioned as a 1 MWe diesel-replacement unit for defense, data-center, and remote
    power use cases. Public evidence shows unusually strong 2025-2026 momentum across financing, DOME testing access,
    defense selection, and the Equinix preorder, but the company still has no public operating-reactor proof, revenue,
    headcount, or full governance disclosure. HALEU fuel availability and security scrutiny remain the most visible
    external dependencies on the path from 2026 test activity to 2028 initial deployments.

sections:
  - id: identity-and-product
    title: "Identity, Product, and Commercial Framing"
    body: |
      Radiant Nuclear is a private El Segundo, California startup founded in 2020 to build portable, mass-produced
      nuclear microreactors as a replacement for diesel generation in places where fuel logistics or grid reliability are
      poor. The flagship product, Kaleidos, is consistently described in company materials as a 1 MWe microreactor that
      uses TRISO fuel, helium gas coolant, passive air cooling, and a containerized format that can move by truck or
      aircraft. The product pitch is explicitly not bulk-grid generation; it is resilient on-site power for military
      installations, data centers, remote industry, hospitals, emergency response, and remote communities. Radiant says
      Kaleidos can operate for five or more years before refueling, can be refueled a total of four times for a 20-year
      lifetime, and can be sold either through direct unit sales or power purchase agreements. The roadmap remains
      aggressive: a first fueled DOME test in 2026 and initial customer deployments beginning in 2028. Those attributes
      create a differentiated portability-and-water-independence story, but public proof still stops short of an
      operating reactor or commercial revenue.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO036, CO037, CO038, CO040]
    tableRefs: [TO001]
    figureRefs: [FO002, FO003]

  - id: leadership-and-governance
    title: "Leadership, Founder Fit, and Governance Visibility"
    body: |
      Radiant's external narrative is unusually founder-centric. Doug Bernauer remains the dominant public face of the
      company and is repeatedly framed by investors and partner pages as the engineering and execution anchor behind the
      Kaleidos program. That concentration is partly offset by a materially stronger public bench in 2025-2026. Rita
      Baranwal joined in June 2025 as Radiant's first Chief Nuclear Officer after serving as Assistant Secretary for
      Nuclear Energy at DOE and then in senior Westinghouse roles, adding heavyweight regulatory and nuclear-operations
      credibility. By late 2025 and early 2026, Mike Starrett was public as Chief Revenue Officer, Tori Shivanandan was
      public as Chief Operating Officer, and Radiant said it had added almost a dozen VP- and director-level leaders
      across engineering, manufacturing, and supply chain. Even so, governance transparency is still limited. Reviewed
      public sources do not disclose a full board roster, committee structure, investor seat allocation, or control
      rights, which keeps key-person and governance diligence elevated despite clear progress in leadership build-out.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO013, CO034]
    tableRefs: [TO002]

  - id: capital-stakeholders-and-demand
    title: "Capital Formation, Stakeholders, and Named Demand Signals"
    body: |
      Radiant moved from venture-backed concept to heavily financed commercialization story in 2025. The company closed a
      $165 million Series C in May 2025, taking public cumulative funding to $225 million, then announced a new round of
      more than $300 million in December 2025 led by Draper Associates and Boost VC. Those disclosures imply more than
      $525 million of public venture funding by year-end 2025. DCVC additionally said the December round valued Radiant
      above $1.8 billion, but that mark came from an existing investor rather than a filing or neutral market reference,
      so it is best treated as a directional signal rather than a fully corroborated fair-value anchor. The backer set
      now spans financial VCs and strategic names including DCVC, Draper Associates, Boost VC, Andreessen Horowitz,
      Founders Fund, Union Square Ventures, Chevron Technology Ventures, and Lockheed Martin Ventures. The strongest
      public demand proof is both commercial and defense linked: Equinix placed deposits for 20 reactors, and the
      Department of the Air Force/DIU selected Radiant for Buckley Space Force Base. Missing from public view are
      pricing, backlog conversion, reactor margins, and backlog beyond named counterparties.
    claimRefs: [CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022, CO035]
    tableRefs: [TO003]

  - id: execution-and-regulatory-path
    title: "Execution Milestones and Regulatory Path"
    body: |
      Radiant's 2025-2026 cadence matters because nuclear startups are usually constrained by test infrastructure,
      licensing, and fuel procurement rather than only by fundraising. DOE conditionally selected Radiant in July 2025
      for the first DOME microreactor test campaign at Idaho National Laboratory, and government DOME materials confirm
      that the site is the world's first dedicated microreactor test bed for fueled experiments up to 20 MWt. In
      February 2026, DOE approved Radiant's DARK submission, which the company described as satisfying the intent of a
      Preliminary Documented Safety Analysis and as the second of three required safety-document phases before startup.
      In April 2026, the Air Force and DIU chose Radiant for Buckley Space Force Base, and in May 2026 the NRC formally
      accepted for review Radiant's Part 70 license application for the R-50 production facility in Tennessee. Radiant
      also says the Oak Ridge factory is intended to scale to 50 reactors per year. This is substantial execution
      evidence, although it remains pre-revenue, pre-startup, and pre-license-completion evidence.
    claimRefs: [CO007, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO040]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: diligence-gaps-and-adverse-factors
    title: "Adverse Factors and Remaining Diligence Gaps"
    body: |
      Strong milestone density should not be mistaken for fully de-risked commercialization. Radiant still does not
      publicly disclose current revenue, ARR, headcount, full board composition, investor control rights, exact backlog,
      unit pricing, or gross margin. Public evidence names demand signals, but it does not independently verify claims on
      partner pages that Radiant is effectively sold out through 2030, and it does not quantify backlog outside the
      Equinix preorder and Buckley pathway. The other major dependency is fuel. DOE's HALEU allocations help near-term
      testing, but Utility Dive reported that the domestic HALEU market still faces infrastructure gaps, and UCS
      highlighted a Science-related analysis arguing that HALEU above roughly 12% U-235 can present more serious
      proliferation and terrorism risks than publicly acknowledged by government and industry. In practical diligence
      terms, Radiant's next hard proof points are a successful fueled test, clearer fuel contracting, and disclosure of
      commercial metrics rather than additional milestone press releases.
    claimRefs: [CO029, CO030, CO031, CO032, CO033, CO034, CO035, CO039, CO040]

callouts:
  - calloutType: strength
    title: "2025-2026 shows uncommon milestone density for an advanced nuclear startup"
    body: "Radiant combined a >$300 million financing, DOE DOME access, DARK approval, Buckley selection, and NRC Part 70 review acceptance within roughly one year. That sequence is stronger public execution evidence than most pre-commercial reactor developers can show."
    claimRefs: [CO015, CO023, CO024, CO025]

  - calloutType: insight
    title: "Equinix and Buckley are the two most important named demand anchors"
    body: "The Equinix preorder supplies the clearest commercial willingness-to-pay signal, while Buckley gives Radiant a visible defense deployment path. Together they validate both civilian and national-security positioning without yet proving fleet-scale economics."
    claimRefs: [CO020, CO021, CO022]

  - calloutType: risk
    title: "HALEU is Radiant's most obvious external dependency"
    body: "Radiant benefited from DOE's HALEU allocation process, but public reporting still describes U.S. HALEU supply as scarce and politically sensitive. UCS also surfaced a proliferation critique that could shape future scrutiny for HALEU-fueled deployments."
    claimRefs: [CO028, CO029, CO030, CO031]

  - calloutType: risk
    title: "Financial and governance opacity remains high"
    body: "Public sources support Radiant's momentum narrative but do not disclose revenue, ARR, headcount, full board composition, ownership, pricing, or margin structure. That leaves valuation, backlog quality, and governance control rights largely dependent on private diligence access."
    claimRefs: [CO016, CO032, CO033, CO034, CO035]

