evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Current revenue, ARR, headcount, backlog conversion, pricing, gross margin, and burn-rate disclosure for
      2025-2026.
    whyItMatters: >-
      Without current operating metrics, it is impossible to underwrite valuation, manufacturing economics, or customer
      quality from public evidence alone.
    diligencePath: >-
      Request management financial statements, pipeline/backlog reporting, cohort-level customer data, pricing
      architecture, and a current headcount/organizational KPI pack.
    relatedQuestionRefs:
      - QO018
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Full board roster, committee structure, observer rights, and any leadership changes not captured in reviewed
      public materials.
    whyItMatters: >-
      Board composition drives governance quality, risk oversight, and investor control analysis, especially in a
      capital-intensive nuclear company.
    diligencePath: >-
      Request the board deck cover list, current governance chart, committee charters, and director biographies from the
      company.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: cap-table
    missingEvidence: >-
      Ownership percentages, preferred share terms, liquidation preferences, pro rata rights, and which investors hold
      board or observer seats.
    whyItMatters: >-
      Cap-table and control-right details are necessary to assess dilution, downside protection, strategic influence,
      and future financing leverage.
    diligencePath: >-
      Request the current cap table, financing documents, investor-rights agreement, and any side letters for strategic
      investors or government-linked counterparties.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: segment-sam
    missingEvidence: >-
      A bottom-up public model of site counts, deployable reactor counts per site, and realistic contract values for 1
      MWe transportable reactors across defense, data-center, industrial, and community segments.
    whyItMatters: >-
      Without a bottom-up site and contract model, broad SMR TAM numbers cannot be converted into a credible Radiant SAM
      for valuation or customer-conversion analysis.
    diligencePath: >-
      Build a site-counting model from named bases, target campuses, remote industrial candidates, and likely early
      community sponsors, then pair it with contract structures and plausible unit economics.
    relatedQuestionRefs:
      - QM014
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: >-
      Site-level Kaleidos economics versus diesel, gas, and grid-extension alternatives, including installed cost,
      operating cost, and any PPA pricing.
    whyItMatters: >-
      The market story is only investable if the product can beat or justify itself against incumbent energy options at
      real sites.
