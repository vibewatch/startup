    - Radiant 仍要跨过多个独立关口：带燃料 DOME 表现、场址 / NEPA 工作，以及 Part 70 之外的独立反应堆路径
    - 客户验证集中在一个具名商业买家和一条国防路径上，公开材料没有披露定价或合同价值
