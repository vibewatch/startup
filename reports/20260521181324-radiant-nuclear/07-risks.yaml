- id: financing-opacity-and-monitoring
  title: Financing opacity, execution staffing, and kill-criteria monitoring
  body: 'Radiant does not look unfunded; it looks under-disclosed. The public record supports a very large 2025 financing, a large Tennessee factory project, and enough political and customer traction to keep the story financeable. What it still does not support is a conventional operating underwrite. Public materials do not disclose current cash, burn, runway, gross margin, per-reactor economics, or customer payment terms. That means investors cannot tell from public evidence whether the current capital base comfortably covers DOME, R-50, licensing delay, and working-capital needs at the same time. The company also has to build several execution muscles simultaneously: nuclear-grade manufacturing QA, material-control operations, field logistics for a return-to-factory service model, and project controls across regulatory and commercial milestones. The right mitigation posture is therefore milestone-based. Until Radiant can show a successful fueled test, durable fuel access beyond the first
    core, continued licensing progress, and cleaner disclosure on cash needs and flagship-customer economics, this remains a promising but still milestone-financed infrastructure thesis.'
