- id: fuel-factory-and-foak-execution
  title: Fuel, factory, and first-of-a-kind execution risk
  body: 'Fuel is still the hardest external dependency in Radiant’s story. DOE continues to say HALEU is unavailable from domestic suppliers, and even the program that allocated material to Radiant explicitly frames itself as a bridge until private supply emerges. The 2026 feedstock delivery for Radiant is decision-useful because it proves the company has a path to a first core, but it is not the same thing as fleet-scale supply. Centrus remains DOE-directed and appropriation-sensitive, BWXT’s delivered TRISO core is tied to Project Pele rather than a broad commercial queue, and BWXT’s own collaboration with Kairos is still about building future commercial capacity. The test program does not remove this risk either: DOME is self-funded, conditioned on fuel availability and regulatory plans, and only demonstrates a bounded campaign rather than multi-year customer uptime. At the same time, Radiant is trying to convert that test path into a $280 million factory and a long-term ambition of 50
    reactors per year. That is a first-of-a-kind manufacturing leap with obvious QA, staffing, and logistics exposure.'
