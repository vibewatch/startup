callouts:
- calloutType: risk
  title: Part 70 is necessary, but it is not the commercialization finish line
  body: Radiant now has a formal factory-fueling review, but the NRC still expects a separate Kaleidos application and Buckley still has to clear site-level environmental work. The thesis only truly de-risks when factory, reactor, and site approvals begin clearing together.
  claimRefs:
  - CR001
  - CR008
  - CR009
- calloutType: risk
  title: Fuel supply is still a bridge, not a mature market
  body: The 2026 feedstock delivery is important because it supports a first startup core, but DOE, Centrus, and BWXT all still describe a supply chain that is being built rather than one that already supports fleet-scale commercial rollouts.
  claimRefs:
  - CR013
  - CR016
  - CR018
  - CR021
- calloutType: recommendation
  title: Diligence should shift from milestone headlines to kill-criteria evidence
  body: Before underwriting 2028 delivery timing, require evidence on fuel beyond the first core, integrated licensing cadence, factory QA ramp, Buckley environmental progress, and basic cash-burn transparency. Those are the points where the thesis can still break.
  claimRefs:
  - CR051
  - CR055
  - CR057
