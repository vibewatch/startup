- id: TR005
  title: Substitute power and competing customer options
  columns:
  - Option
  - Public deployment status
  - Why a buyer might prefer it
  - Why it still leaves room for Radiant
  - Risk to Radiant
  rows:
  - - Bloom fuel cells
    - Live today at Equinix scale (75 MW operating; 30 MW more under construction)
    - Available now, onsite, proven in customer environment
    - Lower endurance than multi-year nuclear fuel cycle; still exposed to fuel and equipment economics
    - High near-term competitive risk
  - - Grid modernization and utility upgrades
    - Under way in customer plans but slower than desired in key hubs
    - Uses familiar permitting and utility counterparties
    - Delivery timelines are often too slow for AI-growth schedules
    - Medium risk because schedule gaps remain
  - - Natural gas and hybrid onsite generation
    - Part of Equinix’s broader power mix discussion
    - Fast deployment and dispatchability
    - Fuel-price and emissions exposure; weaker decarbonization narrative
    - Medium risk
  - - Other advanced-nuclear vendors (Oklo, ULC-Energy, Stellaria, Westinghouse, Antares)
    - Public partnerships or base assignments already visible
    - Customer can diversify reactor technology and geography
    - Radiant keeps a niche in portable diesel-replacement use cases if it executes first
    - High strategic risk
  - - Wait-for-grid / delayed site strategy
    - Always available as a default option
    - Avoids first-of-a-kind reactor execution risk
    - Leaves customer exposed to power scarcity and lost growth
    - Medium risk
  notes: This table is not an LCOE comparison; it is a decision-timing comparison built from the reviewed source set. The main competitive threat to Radiant in 2026 is not another identical portable reactor, but alternatives that can solve power scarcity sooner.
