- id: public-acceptance-transport-and-proliferation
  title: Public acceptance, transport, waste, and proliferation concerns
  body: 'Radiant’s portable-reactor model intensifies the social-license problem instead of avoiding it. Public reporting around Buckley already shows that at least some nearby residents felt surprised by the announcement and immediately focused on waste and long-term environmental implications. The Wyoming episode matters for the same reason: public resistance there was not abstract anti-nuclear ideology alone, but frustration around unanswered questions on accountability, waste, and who bears downside if something goes wrong. Portable deployment also changes the risk shape. The NRC and industry commentary now explicitly distinguish between transport of fresh-fueled units and the harder problem of moving irradiated units back for refueling or end-of-life handling. That is central to Radiant’s business model, not a side issue. Finally, HALEU is not only a supply bottleneck but a political and security risk. UCS and other critics argue that HALEU security should be treated more seriously
    than current public narratives suggest. If that critique translates into stricter safeguards or export controls, Radiant’s cost and logistics advantages narrow.'
