- id: customer-concentration-and-substitutes
  title: Customer concentration, defense dependence, and substitute-power competition
  body: 'Radiant’s public demand proof remains highly concentrated. The commercial side is still dominated by Equinix, and the defense side is still dominated by the Buckley pathway. That matters because both counterparties are strategically important but neither publicly disclosed economics that let an outside investor underwrite recurring cash flow. Just as important, Equinix is not betting on Radiant alone. Its public energy strategy includes Bloom fuel cells, grid upgrades, backup infrastructure, and multiple nuclear developers across different reactor formats and timelines. That diversification is rational for Equinix, but it means Radiant is competing not just against other microreactor vendors but also against onsite fuel cells and other power-availability workarounds that are deployable sooner. Bloom’s own 2026 survey points to a market that increasingly values schedule certainty and onsite power more than a particular generation technology. Defense dependence cuts the same way:
    DIU and the Air Force are meaningful validators, but the program is also an industrial-policy vehicle designed to stimulate a whole supplier base, not a single-vendor guarantee of future orders.'
