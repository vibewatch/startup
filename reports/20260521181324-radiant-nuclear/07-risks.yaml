- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  - Current status
  rows:
  - - Fuel supply beyond first core
    - Public disclosure of second-core or fleet fuel contracts
    - No credible post-startup fuel path disclosed by first DOME startup
    - Treat 2028 deployment timing as unsupported
    - Unresolved
  - - DOME execution
    - Test schedule, startup, and six-month campaign completion
    - Meaningful slippage or materially incomplete campaign data
    - Re-underwrite product maturity and push out customer timing
    - Open and highly monitorable
  - - R-50 and Kaleidos licensing
    - NRC milestones, RAIs, and any separation between factory and reactor approvals
    - Factory review advances but reactor application lags materially
    - Assume factory cannot convert into sales on current timeline
    - Open
  - - Buckley pathway
    - NEPA progress, public meetings, and base-level schedule
    - Environmental process stalls or community resistance escalates without mitigation
    - Reduce defense-conversion probability and strategic premium
    - Open
  - - Equinix commitment quality
    - Site disclosures, deployment milestones, and contract detail
    - No new site-specific progress while substitutes continue scaling
    - Mark commercial demand as optional rather than anchored
    - Open
  - - Factory capex and workforce ramp
    - R-50 construction progress and hiring against 175-job plan
    - Delayed buildout or visible QA/workforce bottlenecks
    - Increase cost-overrun and schedule-slip assumptions
    - Open
  - - Financial opacity
    - Management disclosure of burn, runway, and economics
    - Another financing event occurs without basic operating transparency
    - Treat capital availability as the only real buffer and haircut valuation confidence
    - Unresolved
  - - Policy and security environment
    - Changes in HALEU safeguards, export controls, or federal program support
    - Security tightening or policy reversal raises cost or removes schedule support
    - Reprice addressable market and schedule in one step
    - Open
  notes: Triggers are chosen to be externally monitorable from public evidence rather than dependent on management narrative. A thesis break here means a point at which additional milestone headlines should no longer substitute for a deeper underwriting reset.
