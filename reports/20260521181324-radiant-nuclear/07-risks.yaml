  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fuel-scale
    missingEvidence: Signed multi-core HALEU and TRISO supply agreements, delivery cadence, and alternate conversion-provider plans beyond the first startup core.
    whyItMatters: Radiant’s 2028 deployment timing and any factory-throughput assumptions are weak if the public fuel path only supports one startup core.
    diligencePath: Request executed fuel-contract summaries, delivery schedule by core, and contingency plans for missed feedstock or conversion milestones.
    relatedQuestionRefs:
    - QR013
    - QR029
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Current cash on hand, monthly burn, runway assumptions, gross margin bridge, and planned uses of Series D proceeds.
    whyItMatters: Without burn and runway data, investors cannot test whether current capital covers DOME, R-50, licensing, and customer slippage together.
    diligencePath: Request monthly cash burn, 24-month runway case, downside financing plan, and capex/opex split for R-50 and testing.
    relatedQuestionRefs:
    - QR025
  - type: access-blocked
    severity: material
    topic: transport-and-waste
    missingEvidence: Exact transport-cask assumptions, return-logistics approvals, spent-fuel handling sequence, and decommissioning funding plan for commercial units.
    whyItMatters: Portable-reactor economics and public acceptance both depend on how Radiant handles irradiated-unit return and long-tail waste accountability.
    diligencePath: Request the transport basis, spent-fuel return workflow, expected host facilities, and decommissioning-funding framework used in current licensing work.
    relatedQuestionRefs:
    - QR021
    - QR030
  - type: missing-source
    severity: material
    topic: buckley-community
    missingEvidence: Buckley environmental-review scope, community-engagement plan, and formal meeting schedule with neighboring communities.
    whyItMatters: A project can be mission-critical and still lose time to community-process friction if outreach lags the siting and NEPA calendar.
    diligencePath: Request the Buckley stakeholder map, meeting plan, NEPA milestones, and responsibilities split between government and Radiant.
    relatedQuestionRefs:
    - QR006
    - QR019
    - QR030
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Equinix preorder economics, deposit refundability, site commitments, and any Buckley contract-value or ownership details.
    whyItMatters: Flagship-demand headlines do not translate into dependable cash-flow timing until payment terms and site commitments are visible.
    diligencePath: Request signed commercial term sheets or contract summaries for Equinix and Buckley, including milestone payments and cancellation rights.
    relatedQuestionRefs:
    - QR014
    - QR017
    - QR024
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-register
    missingEvidence: Private NRC correspondence, local permitting details for future commercial sites, and any unreported legal interventions not visible in public materials.
    whyItMatters: The published regulatory register is directionally useful, but an investor could still miss site-specific blockers if private process detail differs from public summaries.
    diligencePath: Update the regulatory register after management shares the live permit matrix and any site-specific legal-risk memos.
    relatedQuestionRefs:
    - QR001
    - QR003
    relatedTableRefs:
    - TR001
