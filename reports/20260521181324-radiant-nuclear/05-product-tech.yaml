- id: TE003
  title: Technology / operating architecture table
  type: enumeration
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Principal risk
  rows:
  - - TRISO fuel in prismatic graphite core
    - Provide fission heat and passive fuel robustness in an HTGR architecture
    - Qualified HALEU TRISO supply and graphite manufacturing
    - Class-level materials are known, but Radiant-specific core performance is unproven
  - - Helium primary coolant loop
    - Transfer heat from core without water chemistry or coolant activation issues of water systems
    - Primary-loop sealing, heat exchangers, and turbomachinery integration
    - Leak management and integrated thermal performance have no public run data
  - - Power-conversion turbomachinery
    - Turn reactor heat into 1-1.2 MWe output with flexible load operation
    - Reliable rotating equipment, controls, and maintenance intervals
    - No public efficiency, duty-cycle, or lifetime data disclosed
  - - Passive air-jacket and fan-based dry cooling
    - Remove residual and operating heat without on-site water
    - Convective heat rejection path and ambient-site conditions
    - Passive safety claim is mostly company-described rather than independently validated
  - - Transport and shielding package
    - Enable truck or aircraft movement and quick installation
    - Shipping approvals, shielding margins, and site interfaces
    - Rapid deployment promise is untested at commercial scale
  - - Centralized monitoring and operating procedures
    - Support autonomous fleet model and standardized operations
    - Operator training, GUI maturity, and written procedures
    - Public evidence shows staffing, not validated operating performance
  enumerationScope:
    coverage: exhaustive
    basis: Publicly disclosed architecture layers extracted from the NRC pre-application record, company product pages, DOE materials, and technical job postings.
  notes: This table captures the integrated product stack rather than only the reactor core; risks are package-level because Kaleidos is sold as a deployable generator, not merely a vessel design.
