    - Independent cooldown and transient data not public
  - - Factory fueling and R-50 production line
    - Radiant manufacturing and fueling operations
    - Pre-commercial; Part 70 review in progress
    - Centralized fueling and refurbishment underpin rapid deployment model
    - Commercial economics depend on license approval and throughput
  - - Remote fleet monitoring / operating procedures
    - Radiant centralized operations team
    - Actively being built as shown in job postings
    - Supports autonomous fleet concept and offsite expertise model
    - No public evidence yet of validated control-room or operator performance
