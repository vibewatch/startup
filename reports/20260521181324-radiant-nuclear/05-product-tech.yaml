- id: testing-manufacturing-and-deployment-path
  title: Testing path, manufacturing model, and deployment sequence
  body: Radiant's technical maturity should be judged primarily through the DOME and R-50 pathways, because those are the two public tracks that convert a portable-reactor concept into a manufacturable product. DOE records show Radiant completed the front-end engineering and experiment design phase in 2024 and is preparing a fueled Kaleidos experiment at INL's DOME facility, with spring or mid-2026 testing repeatedly cited as the target window. In parallel, NRC records and the May 2026 Part 70 review coverage show Radiant has moved from generic pre-application engagement into a specific licensing effort for its Oak Ridge fueling building. That matters because the company is not merely proposing to assemble reactors in Tennessee; it is proposing a factory-fueling and production model whose economics depend on centralized handling of special nuclear material. The technical organization reflected in current job postings supports this reading. Public hiring demand spans fluid systems, mechanisms,
    structures, reactor operations, neutronics, transient analysis, procedures, operator training, and control-room interfaces, which implies an integrated demonstration campaign is under construction rather than a frozen design waiting only for permission. The product therefore sits at the boundary between late prototype and first factory product, not at broad commercial readiness.
