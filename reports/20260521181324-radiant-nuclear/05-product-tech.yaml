  claims:
  - id: CE001
    statement: NRC describes Kaleidos as a transportable microreactor designed to generate about 1 MWe and 3 MWth using TRISO fuel, helium coolant, prismatic graphite blocks, and a single-shipping-container package.
    type: third-party-reported
    topic: public-specification
    sourceRefs:
    - SE006
    - SE029
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE002
    - QE004
    - QE006
  - id: CE002
    statement: Radiant publicly markets Kaleidos as a portable diesel-replacement generator for remote facilities, hospitals, data centers, and military installations rather than as a site-built plant.
    type: company-claimed
    topic: product-definition
    sourceRefs:
    - SE001
    - SE024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE001
    - QE015
  - id: CE003
    statement: Public sources round Kaleidos electric output differently, with some describing a 1 MW unit and others a 1.2 MWe unit, so the product rating should be treated as roughly 1.0-1.2 MWe in public diligence materials.
    type: inferred
    topic: power-rating-range
    sourceRefs:
    - SE001
    - SE007
    - SE018
    - SE029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE002
  - id: CE004
    statement: Company and trade sources also describe Kaleidos as able to provide roughly 1.9 MW of thermal output for facility heating or desalination.
    type: company-claimed
    topic: thermal-output
    sourceRefs:
    - SE001
    - SE018
    - SE019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE002
    - QE015
  - id: CE005
    statement: Radiant says helium transfers heat from the core and does not become radioactive, which is part of its argument for leak tolerance and simplified plant operation relative to water-cooled systems.
    type: company-claimed
    topic: helium-cooling
    sourceRefs:
    - SE001
    - SE009
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QE004
    - QE005
  - id: CE006
    statement: Radiant claims Kaleidos can operate with zero on-site water use because fans and an air jacket remove heat through natural convection.
