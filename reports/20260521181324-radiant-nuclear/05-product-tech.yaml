- id: safety-quality-and-regulatory-path
  title: Safety design, quality signals, and regulatory path
  body: 'Radiant''s public safety case is strongest where DOE or NRC has touched the design and weakest where the company asks investors or customers to accept package-level safety claims on trust. The DOE authorization path has advanced meaningfully: company and trade sources agree that Radiant cleared Safety Design Strategy and PDSA/DARK milestones, and independent reporting frames those approvals as part of a staged safety review before a fueled DOME startup. NRC''s side of the record is also real rather than aspirational. The Kaleidos page lists multiple gap analyses and accepted or under-review documents, while the Part 70 application and associated coverage make clear that the Oak Ridge fueling building is already in formal review. But investors should not confuse those steps with a completed product safety case. Public sources do not show an independent operating record for the passive air-jacket cooldown concept, an externally audited control-room or operator-training package, or
    a transparent end-of-life waste and transport plan for the ship-back service model. The company has more regulatory motion than many microreactor peers, but the safety envelope that matters for recurring commercial deployments still depends on milestones that have not yet happened.'
