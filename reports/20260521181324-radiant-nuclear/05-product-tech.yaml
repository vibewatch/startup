- id: execution-risks-and-unproven-areas
  title: Execution risks and still-unproven areas
  body: 'The key underwriting point is that Kaleidos remains unproven in field conditions even though the public evidence base is now much richer than a year ago. There is still no fueled operating record, no uptime history, no service-turnaround evidence, and no customer site publicly producing power. Schedule risk is therefore multiplicative rather than single-threaded: DOME startup must occur, the experiment must generate credible safety and performance data, NRC licensing for the product and factory must keep moving, and the company must convert a demonstration-centered organization into a repeatable manufacturing-and-service operation. Two unresolved issues deserve special emphasis. First, public material does not reconcile the 1-1.2 MWe Kaleidos unit with the ANPI program''s published 3-10 MWe objective, leaving uncertainty about whether military deployments require multiple units, a higher-rated variant, or a phased site architecture. Second, the factory-return service model is central
    to Radiant''s value proposition but is still thinly documented in public: shipment turnaround, spare-unit coverage, decommissioning workflow, and long-term waste accountability are not specified at investor-grade depth. The product thesis is credible enough to merit serious diligence, but not yet mature enough to treat as de-risked infrastructure.'
