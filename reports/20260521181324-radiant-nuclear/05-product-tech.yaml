  evidenceGaps:
  - type: missing-source
    severity: material
    topic: buckley-deployment-scope-gap
    missingEvidence: Public documentation does not show whether Buckley is expected to use a single Kaleidos unit, a multi-unit cluster, or a higher-rated configuration to meet military resilience objectives.
    whyItMatters: Without a public deployment architecture, it is difficult to judge whether Radiant is selling the same product it is designing for DOME and Equinix or whether military demand already requires a materially different system boundary.
    diligencePath: Request the Buckley concept of operations, target load profile, unit count assumptions, and any power-aggregation or thermal-use assumptions tied to the ANPI award.
    relatedQuestionRefs:
    - QE014
    - QE022
  - type: private-evidence-only
    severity: material
    topic: independent-safety-performance-validation
    missingEvidence: No independent public dataset validates the passive air-jacket cooling claim, integrated startup behavior, or failure-response performance of a fueled Kaleidos unit.
    whyItMatters: Dry-cooling and passive-safety claims are central to Radiant’s differentiation and siting thesis. If those claims weaken under full-power testing, both customer economics and regulatory posture could change materially.
    diligencePath: Obtain DOME test plans, transient-analysis results, and any third-party safety reviews under NDA once available, and compare them against the simplified claims on the public product page.
    relatedQuestionRefs:
    - QE019
  - type: missing-source
    severity: material
    topic: ship-back-service-operations
    missingEvidence: Public sources do not quantify shipping turnaround, spare-unit coverage, refurbishment time, end-of-life handling, or customer continuity planning under the factory-return service model.
    whyItMatters: The commercial promise depends on centralized service being easier than on-site nuclear support. Without logistics detail, investors cannot judge downtime risk, fleet utilization, or the real operational burden pushed back onto Radiant.
    diligencePath: Request the service logistics model, transport assumptions, spent-fuel chain of custody, spare-unit pool design, and factory throughput assumptions for refuel events.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: blocking
    topic: power-conversion-reliability
    missingEvidence: No public evidence discloses Brayton-cycle efficiency, turbomachinery maintenance intervals, duty-cycle limits, or sustained-load reliability for the integrated generator package.
    whyItMatters: A microreactor sold as a replace-anywhere generator lives or dies on package reliability, not only on core physics. Without power-conversion evidence, the practical operating economics remain speculative.
    diligencePath: Request subsystem qualification results, generator and turbomachinery test data, expected maintenance schedules, and any accelerated-life testing that supports uptime assumptions.
    relatedQuestionRefs:
    - QE025
  - type: conflicting-data
    severity: material
    topic: public-product-vs-program-sizing
    missingEvidence: The public record does not reconcile Radiant’s 1-1.2 MWe product description with ANPI’s stated 3-10 MWe objective for on-base microreactors.
    whyItMatters: If Buckley implicitly requires multiple units or a modified product, that affects reactor count, cost, licensing, and service complexity relative to the public base case.
    diligencePath: Request Buckley load assumptions and a signed deployment configuration statement showing whether Radiant intends one unit, several units, or a revised design for the military site.
    relatedQuestionRefs:
    - QE022
