companyProfile:
  summary: >-
    Radiant Nuclear is an El Segundo, California advanced-nuclear startup founded in 2020
    by CEO Doug Bernauer to build Kaleidos, a containerized roughly 1 MWe microreactor
    using TRISO fuel, helium coolant, and dry cooling to replace diesel generation for
    defense bases, data centers, and remote sites. Public evidence shows unusually strong
    2025-2026 commercialization momentum: a $165M Series C followed by a >$300M Series D,
    public cumulative funding above $525M, Equinix deposits for 20 reactors, DOE DOME test
    access and DARK approval, Buckley Space Force Base selection, and NRC acceptance for
    review of the Oak Ridge R-50 factory-fueling application. Even with that progress,
    Radiant remains pre-commercial and private-undisclosed, with no public revenue, margin,
    burn, runway, headcount, or full governance disclosure.
  foundedDate: "2020-01-01"
  founders:
    - name: "Doug Bernauer"
      role: "Founder & CEO"
      background: >-
        Former SpaceX engineer who founded Radiant in 2020 and remains the company's
        central technical and commercial spokesperson.
      claimRefs: [CO008]
  foundingLocation: "El Segundo, California, USA"
  headquarters: "El Segundo, California, USA"
  productSummary: >-
    Kaleidos is a transportable roughly 1.0-1.2 MWe high-temperature gas-cooled
    microreactor that uses TRISO fuel, helium coolant, prismatic graphite blocks, and
    passive air cooling in a containerized package; Radiant aims to factory fuel, service,
    and ship units for resilient onsite power.
  customerFocus: >-
    Primary target customers are defense installations, data-center operators, and remote
    or off-grid industrial and critical-infrastructure sites that need resilient
    diesel-replacement power and can buy through long-cycle government programs or
    enterprise energy decisions.
  businessModel: >-
    Radiant intends to monetize Kaleidos through direct unit sales and power purchase
    agreements, with early traction currently evidenced by deposit-backed preorders rather
    than disclosed operating revenue.
  stage: "Series C/D"
  fundingStatus: >-
    May 2025 Series C: $165M, taking disclosed cumulative funding to $225M; December 2025
    Series D: >$300M led by Draper Associates and Boost VC, implying a public funding floor
    above $525M. DCVC later described the round as valuing Radiant above $1.8B, though that
    mark is investor-reported rather than filing-backed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO008, CO014, CO015, CO016, CO019, CE001, CE006, CU001, CO023, CO024, CO025, CO032, CO033, CO034]

summary:
  headline: >-
    Radiant Nuclear has become one of the most credible private microreactor developers on
    public milestone evidence, but the current >$1.8B valuation signal still looks
    premature relative to zero disclosed revenue, stacked fuel and licensing gates, and
    concentrated customer proof.
  overallScore: 6.3
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1800
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 525
    customerCount: null
    headcount: null
  topStrengths:
    - "Unusually strong 2025-2026 milestone density: >$525M public funding floor, DOME access, DARK approval, Buckley selection, and Part 70 review acceptance"
    - "Kaleidos is differentiated around transportable ~1 MWe dry-cooled deployment for defense, data-center, and remote resilient-power use cases"
    - "Equinix deposits for 20 units provide the clearest commercial willingness-to-pay signal in the public record"
    - "Rita Baranwal's addition and broader 2025 leadership build-out materially improve regulatory and execution credibility"
  topRisks:
    - "HALEU and broader TRISO supply remain bridge markets rather than proven fleet-scale inputs"
    - "Radiant still needs to clear multiple separate gates: fueled DOME performance, site/NEPA work, and a separate reactor path beyond Part 70"
    - "Customer proof is concentrated in one named commercial buyer and one defense pathway, with no public pricing or contract-value disclosure"
    - "The >$1.8B mark is investor/media-reported and unsupported by public revenue, margin, burn, or governance disclosure"
  unresolvedGaps:
    - "Current revenue, ARR, gross margin, monthly burn, runway, and recognized-cash conversion remain undisclosed"
    - "Deposit terms, cancellation rights, pricing, and deployment schedules for Equinix and Buckley are not public"
    - "Public materials do not disclose full board composition, investor control rights, ownership, or liquidation preferences"
    - "Evidence of successful fueled testing, durable HALEU supply, and per-reactor unit economics is still missing"
