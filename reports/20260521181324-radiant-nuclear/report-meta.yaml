coverageNotes: >-
  Radiant is a private pre-revenue company with unusually strong public milestone density
  but limited operating-financial disclosure. Public evidence supports a >$525M cumulative
  funding floor, an investor/media-reported valuation above $1.8B, DOME test access,
  Equinix deposits for 20 units, Buckley selection, and an accepted NRC Part 70 review for
  the Oak Ridge factory-fueling path, but not revenue, gross margin, burn, runway,
  headcount, or full governance visibility. The valuation view should therefore be read as
  milestone-based and directional rather than as a precise underwriting of fair value.

