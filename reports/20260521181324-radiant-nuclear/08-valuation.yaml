- id: comparable-anchors-and-milestone-logic
  title: Comparable anchors and milestone-adjusted valuation logic
  body: 'Public and private nuclear comps show why Radiant can command a billion-dollar narrative without yet proving commercial reactor revenue, but they also show why investors should resist false precision. Public market comps are the cleanest warning label. Oklo trades at a public valuation far above Radiant’s reported mark despite revenue still being listed as n/a, while NuScale carries a lower valuation than Oklo but still trades in the billions despite modest revenue and heavy dilution. NANO Nuclear shows that even a much earlier, pre-revenue microreactor story can still clear a market cap above $1 billion when investors price option value. Private rounds reinforce the same lesson: X-energy’s $700 million round, Helion’s $5.425 billion post-money valuation, and Last Energy’s $100 million Series C all show how much capital is chasing advanced-nuclear milestones. But none of those comps fully solve Radiant’s valuation problem, because each one differs on reactor size, regulatory maturity,
    customer type, or disclosure quality. The right method is therefore milestone-adjusted comparison, not a spreadsheet pretending Radiant already has knowable cash flows.'
