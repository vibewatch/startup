company:
  name: Radiant Nuclear
chapter:
  number: 8
  title: Valuation
  summary: 'Radiant Nuclear has enough financing, customer proof, and regulatory momentum to justify a serious billion-dollar conversation, but not enough disclosed operating data to treat the currently reported >$1.8 billion mark as obviously fair. The most decision-useful stance is research-more / track: use broad milestone-adjusted ranges, separate confirmed funding from investor-marked valuation, and wait for either better price or better proof before underwriting new money.'
sections:
- id: price-signal-vs-proof-gap
  title: Price signal versus proof gap
  body: 'Radiant’s valuation discussion has to start by separating what is confirmed from what is merely marked. What is confirmed is substantial: the company publicly disclosed a $165 million Series C that brought total venture funding to $225 million, then disclosed a December 2025 round of more than $300 million. That gives outsiders a public capital floor above $525 million and a real basis for saying Radiant has attracted serious late-stage venture backing. What is not confirmed the same way is a filing-backed post-money value. The most-cited >$1.8 billion figure comes through DCVC and media coverage, not through a public securities filing or an independently cleared secondary market print. That distinction matters because the same public record still does not disclose revenue, gross margin, burn, runway, customer pricing, or liquidation preferences. In other words, the price signal is strong, but the proof stack under it is still mostly financing momentum, named customers, and milestone
    progress rather than operating economics.'
  claimRefs:
