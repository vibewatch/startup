- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Stage / metric
  - Valuation or status
  - Why relevant to Radiant
  - Key limitation
  rows:
  - - Radiant Nuclear
    - Private microreactor developer; no public revenue disclosure
    - '>$300M Series D; >$1.8B investor/news-reported mark'
    - Direct subject; tests what current market will pay for data-center + defense narrative before commercial revenue
    - Current price signal is not filing-backed and economics remain private
  - - Oklo
    - Public advanced nuclear / microreactor developer; revenue n/a
    - ~$11.33B market cap; ~ $9.00B EV on 2026-05-21
    - Shows how public markets can pay heavily for AI-linked nuclear option value before reactor revenue
    - Public liquidity, Sam Altman halo, and larger scale make it an aggressive premium comp
  - - NuScale
    - Public SMR developer with modest revenue and large dilution
    - ~$4.14B market cap; trailing revenue ~$18.67M on 2026-05-21
    - Provides a more revenue-bearing and more regulated benchmark for nuclear valuation
    - Larger utility-style module, different customer set, and major share dilution reduce comparability
  - - NANO Nuclear
    - Public microreactor developer; pre-revenue
    - ~$1.31B market cap; SEC says no revenues generated as of report date
    - Shows that even early microreactor equity can clear billion-dollar option value
    - Much earlier, smaller, and less commercially validated than Radiant
  - - X-energy
    - Private HTGR / fuel developer
    - ~$700M Series D in Nov. 2025; valuation undisclosed; >11 GW orderbook claimed
    - Useful private comp for capital intensity, fuel, and commercialization narrative
    - Larger reactor, larger industrial customers, and orderbook disclosure are not equivalent to Radiant’s current state
  - - Helion
    - Private fusion developer
    - Series F at $5.425B post-money
    - Upper-bound reminder that frontier-nuclear valuations can extend far beyond current revenue
    - Fusion is not fission and sits on a different technical and policy timeline
  - - Last Energy
    - Private microreactor / small-reactor developer
    - '>$100M Series C; valuation undisclosed'
    - Useful lower-scale private financing reference for a factory-built nuclear story
    - Different PWR architecture, regulatory pathway, and no disclosed valuation
  notes: 'The set is intentionally mixed rather than exhaustive: it combines public pre-revenue comps with private milestone financings because Radiant is pre-revenue and disclosure-light. Valuations are market snapshots or last-disclosed round data, not normalized operating-value multiples.'
