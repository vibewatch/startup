- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - DOME timing slip
    - Test no longer looks like a 2026 event
    - Removes the nearest hard proof point supporting today’s premium
    - Move to clear downside case until a new verified schedule exists
  - - Fuel fragility
    - HALEU access worsens or remains first-core only
    - Turns timing risk into financing risk and pushes out paid deployments
    - Assume more capital is needed; cut valuation range
  - - Licensing drift
    - Part 70 review slips materially beyond requested timing or reactor-license path weakens
    - Reduces confidence that factory spend converts into deployable product on schedule
    - Compress scenario range and downgrade base case
  - - Customer conversion failure
    - Equinix deposit terms weaken, cadence slips, or preorder does not convert into a paid rollout
    - Undercuts the strongest commercial proof behind the current mark
    - Treat the customer thesis as promotional until re-proven
  - - Structured financing shock
    - Next round reveals heavy preferences, major dilution, or down-round pricing
    - Shows current mark did not clear the market on clean terms
    - Reset recommendation to avoid until stack economics are known
  - - Disclosure still absent after major milestone
    - Company still withholds revenue, cash, and unit economics after test or licensing progress
    - Signals management wants valuation credit without underwriting transparency
    - Do not pay premium multiple without data-room evidence
  notes: These are monitorable valuation triggers, not generic company risks. Each one directly changes either the probability of commercialization or the share of enterprise value realistically available to new investors.
