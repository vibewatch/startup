- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Current read
  - Evidence supporting it
  - What would change the view
  rows:
  - - Capital access
    - Thesis
    - '>$525M public funding floor and a fresh >$300M round show strong financing demand'
    - A flat/down round or punitive preference stack would weaken the thesis quickly
  - - Customer proof
    - Thesis with caveat
    - Equinix deposits and Buckley path are meaningful early validation
    - Detailed deposit terms, rollout schedule, or site commitments would make the signal more bankable
  - - Operating proof
    - Anti-thesis
    - No public revenue, margin, or burn disclosures support the current mark
    - A disclosed revenue bridge and unit-economics pack would materially improve conviction
  - - Regulatory progress
    - Thesis with caveat
    - DOME path, accepted Part 70 review, and DOE support show real movement
    - A reactor-license slip or delay beyond the requested timeline would compress the premium
  - - Sector backdrop
    - Mixed
    - Public and private peers show investors pay for nuclear option value before cash flow
    - If bubble concerns fade and peers still hold value after first tests, Radiant’s premium could become easier to defend
  - - Mark reliability
    - Anti-thesis
    - The >$1.8B figure is investor/news reported rather than independently cleared
    - An audited cap table, new financing document, or reputable independent mark would strengthen price confidence
  notes: This table deliberately distinguishes arguments that support company quality from arguments that support today’s price. Those are not the same thing for a pre-revenue reactor developer.
