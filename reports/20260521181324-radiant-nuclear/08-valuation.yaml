- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Estimated valuation range (USDm)
  - Return logic at ~1.8B entry
  - Probability signal
  rows:
  - - Bear
    - DOME or fuel slips, licensing drifts, customer conversion stays opaque, and another financing is needed before revenue proof
    - 900–1300
    - Likely loss of capital at current entry; hard to support even 1.0x
    - Material if two or more milestone chains slip together
  - - Base
    - Radiant keeps financing access, hits some milestones, but still lacks enough economic disclosure to justify a premium re-rate
    - 1400–2000
    - Roughly flat to modest upside from the current marked level
    - Most plausible from public evidence today
  - - Bull
    - Successful 2026 test, continued NRC progress, firmer fuel path, and visible conversion of flagship demand into paid deployments
    - 2100–3000
    - Upside exists, but still not a classic venture-style blowout from the current mark
    - Requires multiple proof gates to clear, not just one headline
  notes: Ranges are explicit estimates, not DCF outputs. They are milestone-adjusted comparisons against public pre-revenue peers and private advanced-nuclear rounds, with wide uncertainty bands because Radiant does not disclose the operating metrics needed for tighter valuation work.
