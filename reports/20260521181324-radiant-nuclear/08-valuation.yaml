- id: scenario-range-and-recommendation
  title: Bull, base, and bear cases at the current mark
  body: 'Radiant’s scenario analysis should be framed as a wide range with explicit milestone assumptions, not as a thin decimal-point target. The bull case requires more than positive headlines: a successful 2026 DOME campaign, continued NRC progress on the factory path, durable HALEU access, and proof that Equinix and defense pathways are turning into paid deployments rather than just strategic validation. The base case is more modest: Radiant keeps momentum, remains financeable, and earns credit for capital access and flagship customers, but still does not disclose enough operating data to make the current mark obviously cheap. The bear case is not merely that nuclear is hard; it is that several dependencies slip at once and the company must finance through delay before commercial revenue appears. Under that framing, the currently reported >$1.8 billion price signal already sits around the middle of a broad estimated base range, which means public evidence alone does not support an attractive
    entry at today’s mark. Investors either need a lower price, better private evidence, or both.'
