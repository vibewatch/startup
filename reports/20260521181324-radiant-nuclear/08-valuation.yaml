  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: backlog-conversion
    missingEvidence: Exact Equinix deposit size, refundability, exclusivity terms, and conversion milestones to paid deployments.
    whyItMatters: Without this, the strongest commercial proof point cannot be translated into backlog quality or cash-timing confidence.
    diligencePath: Request signed customer term sheets, deposit schedules, and revenue-recognition memo.
    relatedQuestionRefs:
    - QV016
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current unrestricted cash, monthly burn, and downside runway after the December 2025 financing.
    whyItMatters: Capital raised is not the same thing as capital adequacy when testing, licensing, and factory buildout can all slip.
    diligencePath: Request latest balance sheet, cash-flow statement, and board budget package.
    relatedQuestionRefs:
    - QV019
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: Post-Series D share count, liquidation preferences, seniority, participation rights, and any ratchets or pay-to-play provisions.
    whyItMatters: Headline valuation can materially overstate common-equity value if the preference stack is expensive.
    diligencePath: Request cap table, charter summary, and downside waterfall model.
    relatedQuestionRefs:
    - QV020
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Quoted reactor price, PPA tariff, gross-margin bridge, and service/refueling cost assumptions.
    whyItMatters: These inputs are mandatory before any precise return or exit model becomes credible.
    diligencePath: Request customer pricing deck, costed BOM, and margin sensitivity pack.
    relatedQuestionRefs:
    - QV018
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: independent-mark-support
    missingEvidence: Independent mark-to-market evidence such as a third-party 409A, tender, or secondary transaction around the current valuation.
    whyItMatters: Investor and news references are useful signals, but they do not fully establish where a clean new-money market would actually clear.
    diligencePath: Request the latest board-marking materials and any secondary-market documentation.
    relatedQuestionRefs:
    - QV021
    relatedTableRefs:
    - TV001
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: A broader set of private advanced-nuclear valuations, especially undisclosed-price rounds and secondaries, beyond the reviewed public sample.
    whyItMatters: The comparable table is decision-useful but not exhaustive because many private reactor marks remain undisclosed.
    diligencePath: Expand the comp set with private-market data-room materials or specialized venture databases.
    relatedQuestionRefs:
    - QV012
    relatedTableRefs:
    - TV004
