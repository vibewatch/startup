- id: thesis-breakers-and-diligence-asks
  title: Thesis-break triggers and the evidence still missing
  body: 'The most useful valuation work now is not trying to guess a 2029 EBITDA margin; it is identifying what evidence would actually change the call. Several issues remain plainly open from public evidence. The Equinix preorder is real, but deposit size, refundability, exclusivity, and backlog conversion are not. Radiant’s financing momentum is real, but burn, runway, current cash, and the preference stack are not public. Regulatory progress is real, but a Part 70 filing and accepted review are not the same thing as a commercial reactor operating license. Fuel access is improving, but DOE still describes HALEU supply as unavailable from domestic suppliers. These gaps matter directly to valuation because they decide whether the current mark is merely aggressive or genuinely unsupported. The right diligence posture is therefore trigger-based: if DOME slips, if licensing drifts, if the next financing reveals expensive structure, or if flagship customer economics remain opaque after the next
    milestone cycle, the mark deserves to compress. If the opposite happens, the valuation case can strengthen quickly.'
