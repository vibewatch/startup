tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - RESEARCH-MORE / TRACK
    - Strong financing and customer signals, but no operating-financial underwrite
    - Do not treat the current mark as actionable without more evidence or a better entry price
  - - Confidence
    - Medium
    - Many core facts are public, but the decisive economics remain private
    - Keep conviction below a buy threshold until private data closes the largest gaps
  - - Risk rating
    - High
    - Fuel, licensing, manufacturing replication, and disclosure gaps can all hit valuation
    - Underwrite downside first; assume more capital may still be needed
  - - Valuation stance
    - Stretched to fair-at-best at the current >$1.8B mark
    - Current signal sits around the middle of a broad estimated base range
    - Prefer patience over momentum-chasing
  - - Preferred entry discipline
    - Wait for either more proof or lower price
    - Proof = successful test, licensing progress, customer conversion, and economics disclosure
    - Only revisit aggressively if the evidence improves faster than the price
  - - Likely exit posture
    - Too early to underwrite clean IPO or strategic-exit returns from public data alone
    - Commercial deliveries are still guided for 2028 and later
    - Treat exit math as highly scenario-dependent rather than bankable
  notes: Assessments are qualitative and explicitly price-sensitive. The table separates confirmed financing signals from unsupported assumptions about revenue conversion, margins, and dilution.
