chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与商业定位
        blocks:
          - type: paragraph
            body: >
              Radiant Nuclear 是一家位于加州 El Segundo 的私营初创公司，成立于 2020 年，目标是批量生产便携式核微反应堆，在燃料物流困难或电网可靠性差的地点替代柴油发电。旗舰产品
              Kaleidos 在公司材料中一贯被描述为 1 MWe 微反应堆，采用 TRISO
              燃料、氦气冷却剂、被动空气冷却和可用卡车或飞机运输的集装箱形态。产品卖点明确不是大电网发电，而是为军事设施、数据中心、偏远工业、医院、应急响应和偏远社区提供有韧性的现场电力。Radiant 称 Kaleidos
              可在补充燃料前运行五年或更久，总计可补充燃料四次，寿命 20 年，并可通过直接销售机组或购电协议销售。路线图仍然激进：2026 年完成首次带燃料 DOME 测试，2028
              年开始首批客户部署。这些属性拼出差异化的便携性和不依赖用水叙事，但公开证据仍未到运行中反应堆或商业收入这一步。
