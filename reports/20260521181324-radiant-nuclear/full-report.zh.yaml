      - number: '5.4'
        title: 安全设计、质量信号与监管路径
        blocks:
          - type: paragraph
            body: >-
              Radiant 的公开安全论证，在 DOE 或 NRC 已触及设计的地方最强；在公司要求投资人或客户基于信任接受产品包层面安全主张的地方最弱。DOE 授权路径已经显著推进：公司和行业来源都认为 Radiant
              通过了 Safety Design Strategy 和 PDSA/DARK 里程碑，独立报道也把这些批准描述为带燃料 DOME 启动前分阶段安全审查的一部分。NRC
              侧记录也是真实的，而非愿景式说法。Kaleidos 页面列出多项差距分析以及已受理或正在审查的文件，Part 70 申请和相关报道也明确表明，Oak Ridge
              装料大楼已进入正式审查。但投资人不应把这些步骤误认为已完成的产品安全论证。公开来源没有显示被动空气夹套冷却概念的独立运行记录、经外部审计的控制室或操作员培训包，也没有显示针对回运服务模式的透明寿命末期废料与运输计划。公司比许多微反应堆同业拥有更多监管动作，但面向重复商业部署的安全边界，仍依赖尚未发生的里程碑。
