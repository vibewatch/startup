  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表与优先权
        - Series D 后股数、证券条款、清算堆叠，以及任何投资人保护
        - 决定今天的头条估值标记是否能转化为真实普通股价值
        - 向法律顾问或 CFO 索取股权结构表、条款清单摘要和优先权瀑布
      - - 现金、烧钱速度与现金跑道
        - 当前非受限现金、月度烧钱速度，以及滑期情景下的下行现金跑道
        - 单靠已融资本身，不能证明足以覆盖测试、许可和工厂支出
        - 索取最新资产负债表、预算和董事会融资触发备忘录
      - - 订金经济性与积压订单转化
        - 单台订金规模、可退款性、里程碑、取消权和排他条款
        - 用来区分真实商业去风险和战略信号
        - 索取已签署的 Equinix 条款清单和管理层收入确认备忘录
      - - 单位经济性
        - 反应堆报价、PPA 电价、毛利率桥，以及服务 / 换料成本堆叠
        - 没有这些，任何精确回报或退出模型都不可信
        - 索取客户定价材料、带成本的 BOM 和毛利率敏感性分析
      - - 独立估值标记支持
        - 任何支持当前定价的第三方 409A、老股交易、要约收购或外部估值标记
        - 区分实时市场清算估值和投资人叙事
        - 索取最新董事会估值标记包和任何老股交易证据
      - - 客户部署经济性
        - 旗舰客户的场址时间表、电网对比经济性和付款时点
        - 决定客户证据能否真正以可接受利润率转化为现金
        - 索取逐场址管线复盘，包含合同状态和预期现金里程碑
    notes: 每一行都对应一个缺失输入，足以让估值从偏高变成可辩护，或从激进变成缺乏支撑。承销新资金前，这些是最高优先级的尽调问题。
