      - number: '1.5'
        title: 反向因素与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >
              里程碑密度高，不等于商业化已经充分去风险。Radiant
              仍未公开披露当前收入、ARR、员工数、完整董事会构成、投资人控制权、准确积压订单、单机定价或毛利率。公开证据点名了需求信号，但没有独立核实合作伙伴页面上“Radiant 到 2030
              年几乎售罄”的说法，也没有量化 Equinix 预购和 Buckley 路径之外的积压订单。另一项主要依赖是燃料。DOE 的 HALEU 分配有助于近期测试，但 Utility Dive 报道称美国国内
              HALEU 市场仍面临基础设施缺口，UCS 也强调一项与 Science 相关的分析，认为 U-235 丰度高于约 12% 的 HALEU
              可能带来比政府和行业公开承认更严重的扩散和恐怖主义风险。落到尽调实践，Radiant 接下来真正硬的证明点不是更多里程碑新闻稿，而是成功的带燃料测试、更清晰的燃料合同和商业指标披露。
