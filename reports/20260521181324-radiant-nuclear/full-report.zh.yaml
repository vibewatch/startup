            body: >-
              Equinix 是最清晰的商业证明点，因为双方公开确认了 20 台机组预订单和押金，这比泛化备忘录或参考 logo 更强。同样重要的是，Equinix 说明了需求动因：AI
              驱动的用电需求压迫电网和电力采购，公司在寻找稳定的全天候电力。但 Equinix 自身披露也提醒投资人不能过度解读。Radiant 只是 Equinix 更大能源组合的一部分，该组合还包括
              Oklo、ULC-Energy / Rolls-Royce SMR、Stellaria、Bloom 燃料电池、天然气容量和电网升级。Equinix 告诉 Data Center
              Knowledge，许多下一代核技术距离部署仍有数年，选址还在早期，仍需要政策变化、更快许可和熟练劳动力。公开材料披露了机组数量和押金存在，但没有披露押金规模、是否可退、站点清单、合同期限、单机经济性，也没有说明
