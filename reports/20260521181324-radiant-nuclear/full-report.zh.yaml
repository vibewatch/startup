      - number: '1.4'
        title: 执行里程碑与监管路径
        blocks:
          - type: paragraph
            body: >
              Radiant 在 2025-2026 年的推进节奏重要，因为核能初创公司通常受制于测试基础设施、许可和燃料采购，而不只是融资。DOE 于 2025 年 7 月有条件选择 Radiant 参加 Idaho
              National Laboratory 首个 DOME 微反应堆测试活动，政府 DOME 材料确认该场地是全球首个专门用于不超过 20 MWt 带燃料实验的微反应堆测试床。2026 年 2 月，DOE 批准
              Radiant 的 DARK 提交材料；公司称 DARK 满足 Preliminary Documented Safety Analysis 的意图，并且是启动前所需三阶段安全文件中的第二阶段。2026 年 4
              月，Air Force 和 DIU 选择 Radiant 进入 Buckley Space Force Base；2026 年 5 月，NRC 正式受理 Radiant 为 Tennessee R-50
              生产设施提交的 Part 70 许可申请。Radiant 还称 Oak Ridge 工厂计划扩大到每年 50 台反应堆。这些都是实质执行证据，但仍属于收入前、启动前、许可完成前的证据。
