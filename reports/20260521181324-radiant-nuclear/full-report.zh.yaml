      - number: '1.2'
        title: 领导层、创始人匹配度与治理可见性
        blocks:
          - type: paragraph
            body: >
              Radiant 的对外叙事异常围绕创始人展开。Doug Bernauer 仍是公司最主要的公众面孔，投资方和合作伙伴页面也反复把他定位为 Kaleidos 项目的工程与执行锚点。2025-2026
              年公开管理团队显著增强，部分抵消了这种集中度。Rita Baranwal 曾任 DOE 核能助理部长，之后在 Westinghouse 担任高管，2025 年 6 月加入 Radiant，成为公司首任 Chief
              Nuclear Officer，为监管和核运营增加了重量级可信度。到 2025 年末和 2026 年初，Mike Starrett 已公开担任 Chief Revenue Officer，Tori
              Shivanandan 已公开担任 Chief Operating Officer，Radiant 还称在工程、制造和供应链新增了近十名 VP
              与总监级领导。即便如此，治理透明度仍然有限。已审阅的公开来源没有披露完整董事会名单、委员会结构、投资人席位分配或控制权安排；尽管领导层建设明显推进，关键人和治理尽调仍需保持较高权重。
