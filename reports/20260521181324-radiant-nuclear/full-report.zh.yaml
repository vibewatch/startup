      - number: '7.2'
        title: 燃料、工厂和首台套执行风险
        blocks:
          - type: paragraph
            body: >-
              燃料仍是 Radiant 故事里最难的外部依赖。DOE 继续表示国内供应商无法供应 HALEU，甚至向 Radiant 分配材料的项目也明确把自己定位为私人供应出现前的过渡桥梁。2026 年给 Radiant
              的原料交付对决策有用，因为它证明公司有拿到首炉堆芯的路径，但还不能证明批量部署级供应。Centrus 仍受 DOE 指令和拨款影响；BWXT 已交付的 TRISO 堆芯绑定 Project
              Pele，而不是广泛商业队列；BWXT 与 Kairos 的合作本身也仍是在建设未来商业产能。测试项目同样没有消除这一风险：DOME
              由自筹资金支持，取决于燃料可得性和监管计划，只证明一次边界清晰的测试活动，而不是多年客户可用性。同时，Radiant 还想把这条测试路径转化为 $280 million 工厂，并长期做到每年 50
              台反应堆。这是一次首台套制造跃迁，QA、招聘和物流风险都很明显。
