      - - 基准
        - Radiant 保持融资通道，达成部分里程碑，但仍缺少足够经济性披露，无法支撑溢价重估
        - 1400–2000
        - 相比当前标记水平，大致持平到温和上行
        - 从今天公开证据看，这是最可能的情景
      - - 乐观
        - 2026 年测试成功，NRC 继续推进，燃料路径更稳，旗舰需求明显转化为付费部署
