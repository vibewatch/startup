  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 许可、环境审查和授权风险
        blocks:
          - type: paragraph
            body: >-
              Radiant 的授权路径比一年前具体得多，但仍是层层堆叠，并未完成。R-50 Part 70 审查把工厂加燃料概念推进到正式 NRC 审查里，但已受理申请覆盖的是加燃料建筑，而不是 Kaleidos
              反应堆本身，NRC 也已表示仍预计需要单独的反应堆申请。部署侧，Air Force 与 Buckley 配对是真实需求验证，但官方下一步是 NEPA 下的选址和环境分析，而不是施工授权。NRC 拟议的 Part
              57 框架最终可能让合格设计的重复微反应堆许可更便宜、更快，但它仍是拟议规则，不是可融资的权利。DOE 新的先进反应堆类别排除可以加快 DOE 控制的行动，但法律分析明确指出，它不会取消
              NRC、州、部落或地方审查。投资人的核心结论是，许可风险仍有多道关：工厂批准、反应堆批准、运输处理和站点接受都必须通过。
