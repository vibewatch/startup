        title: 融资不透明、执行人员配置和失败条件监控
        blocks:
          - type: paragraph
            body: >-
              Radiant 看起来不是缺钱，而是披露不足。公开记录支撑一笔很大的 2025 年融资、一个大型 Tennessee
              工厂项目，以及足以让故事继续融资的政治和客户牵引力。但这些记录仍不足以支撑常规经营层面的投资判断。公开材料没有披露当前现金、烧钱速度、现金跑道、毛利率、单台反应堆经济性或客户付款条款。因此投资人无法仅凭公开证据判断，当前资本基础能否同时稳妥覆盖
              DOME、R-50、许可延迟和营运资本需求。公司还必须同时搭建几块执行肌肉：核级制造 QA、材料管控、返厂服务模式下的现场物流，以及横跨监管和商业里程碑的项目控制。正确的风险缓释姿态因此应以里程碑为基础。在
              Radiant 证明加燃料测试成功、首炉堆芯之外燃料可持续取得、许可继续推进，并更清楚披露现金需求和旗舰客户经济性之前，它仍是一个有前景但仍靠里程碑融资的基础设施投资逻辑。
