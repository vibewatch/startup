      - number: '8.4'
        title: 打破投资逻辑的触发条件和仍缺失的证据
        blocks:
          - type: paragraph
            body: >-
              现在最有用的估值工作，不是猜 2029 年 EBITDA 利润率，而是识别哪些证据会真正改变判断。公开证据中仍有几个问题明显悬而未决。Equinix
              预订单真实存在，但押金规模、是否可退、排他性和积压订单转化并未披露。Radiant 的融资动能真实存在，但烧钱速度、现金跑道、当前现金和优先股堆叠不公开。监管进展真实存在，但 Part 70
              提交并被受理，不等于商业反应堆运营许可。燃料获取正在改善，但 DOE 仍称国内供应商无法供应
              HALEU。上述缺口直接影响估值，因为它们决定当前标记只是激进，还是确实缺乏支撑。正确尽调姿态因此应以触发条件为基础：如果 DOME
              滑期、许可节奏漂移、下一轮融资暴露昂贵结构，或旗舰客户经济性在下一个里程碑周期后仍不透明，估值标记就应压缩。反过来，如果相反情况发生，估值论据可能很快变强。
