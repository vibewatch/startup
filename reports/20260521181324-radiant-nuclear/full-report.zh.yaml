      - number: '5.2'
        title: 核心架构、功率转换与热设计
        blocks:
          - type: paragraph
            body: >-
              在架构本身上，现在最强的独立佐证来自 NRC 预申请页面和独立行业报道，而不只是 Radiant 自己的营销文案。NRC 称 Kaleidos 是高温气冷反应堆，使用 TRISO
              燃料、氦气冷却剂和棱柱石墨块，并全部装在单个海运集装箱内。DOE 更广泛的 HTGR 说明和 INL 技术材料页面支持这样的判断：TRISO 燃料、氦冷却和石墨慢化是该反应堆类别的成熟特征，因此 Radiant
              并不是从零发明一种新燃料或慢化剂系统。更未被证明的是围绕这些已知材料的一体化产品包。主页声称，机组借助风扇和被动空气夹套冷却实现现场零用水，交付后可快速满功率启动，还能提供电力加热输出组合，支持供热或海水淡化。这些说法被行业文章方向性重复，但还没有带燃料运行的公开运营数据支撑。结果是一幅混合技术图景：材料栈看起来符合类别，但产品包层面的逻辑取决于能否在一个工厂制造箱体里，把干式冷却、屏蔽、可运输性和功率转换硬件整合跑通。
