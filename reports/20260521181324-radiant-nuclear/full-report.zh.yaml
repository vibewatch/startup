      - number: '5.5'
        title: 执行风险与仍未验证的环节
        blocks:
          - type: paragraph
            body: >-
              核心投资判断是：尽管公开证据比一年前丰富得多，Kaleidos
              仍没有在现场条件下证明自己。它还没有加燃料后的运行记录、可用性历史、服务周转证据，也没有公开客户现场正在发电。时间表风险因此不是单线风险，而是会相乘：DOME
              必须启动，实验必须产出可信的安全和性能数据，产品和工厂的 NRC 许可必须持续推进，公司还要把一个以演示为中心的组织，改造成可复制的制造和服务体系。两个悬而未决的问题尤其关键。第一，公开材料没有解释 1-1.2
              MWe 的 Kaleidos 机组如何对应 ANPI 项目披露的 3-10 MWe 目标，因此军事部署到底需要多台机组、更高额定功率版本，还是分阶段站点架构，仍不清楚。第二，返厂服务模式是 Radiant
              价值主张的核心，但公开文件仍很薄：运输周转、备用机组覆盖、退役流程和长期废弃物责任，都没有达到投资级披露深度。产品逻辑足够可信，值得严肃尽调，但还没有成熟到可按已去风险基础设施定价。
