        title: 价格信号与证明缺口
        blocks:
          - type: paragraph
            body: >-
              Radiant 的估值讨论必须先区分已确认事项和只是被标记的事项。已确认的内容很可观：公司公开披露 $165 million Series C 轮，使累计风险融资达到 $225 million；随后又披露
              2025 年 12 月超过 $300 million 的融资轮。外部人因此看到高于 $525 million 的公开资本底线，也让“Radiant
              已吸引严肃后期风险资本支持”有了真实依据。未被同样确认的是有监管文件支撑的投后估值。最常被引用的 >$1.8 billion 数字来自 DCVC
              和媒体报道，而不是公开证券文件或独立清算的二级市场成交价。估值来源差异很重要，因为同一公开记录仍没有披露收入、毛利率、烧钱速度、现金跑道、客户定价或清算优先权。换句话说，价格信号很强，但支撑它的证据栈仍主要是融资动能、具名客户和里程碑进展，而不是经营经济性。
