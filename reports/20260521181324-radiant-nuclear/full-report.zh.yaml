  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 阶段 / 指标
      - 估值或状态
      - 为何与 Radiant 相关
      - 主要局限
    rows:
      - - Radiant Nuclear
        - 私有微反应堆开发商；无公开收入披露
        - '>$300M Series D 轮；>$1.8B 投资人 / 新闻报道估值标记'
        - 直接研究对象；检验商业收入出现前，当前市场愿意为数据中心 + 国防叙事支付多少
        - 当前价格信号没有监管文件支撑，经济性仍是私有信息
      - - Oklo
        - 上市先进核能 / 微反应堆开发商；收入 n/a
        - 2026-05-21 市值 ~$11.33B；EV 约 $9.00B
        - 显示反应堆收入出现前，公开市场可能为 AI 相关核能期权价值支付高价
        - 公开流动性、Sam Altman 光环和更大规模，让它成为激进溢价可比对象
      - - NuScale
        - 上市 SMR 开发商，有少量收入且大幅稀释
        - 2026-05-21 市值 ~$4.14B；滚动收入 ~$18.67M
        - 为核能估值提供一个收入更多、监管更重的基准
        - 更大的公用事业式模块、不同客户群和重大股份稀释降低可比性
      - - NANO Nuclear
        - 上市微反应堆开发商；收入前
        - 市值 ~$1.31B；SEC 称截至报告日尚未产生收入
        - 显示即使早期微反应堆股权，也能达到十亿美元级期权价值
        - 阶段更早、规模更小，商业验证也弱于 Radiant
      - - X-energy
        - 私有 HTGR / 燃料开发商
        - 2025 年 11 月 Series D 轮 ~$700M；估值未披露；声称订单簿 >11 GW
        - 可作为资本强度、燃料和商业化叙事的私有参照
        - 反应堆更大、工业客户更大，且披露了订单簿；这些都不等同于 Radiant 当前状态
      - - Helion
        - 私有聚变开发商
        - Series F 轮，投后估值 $5.425B
        - 提醒上限：前沿核能估值可以远超当前收入
        - 聚变不是裂变，技术与政策时间线也不同
      - - Last Energy
        - 私有微反应堆 / 小型反应堆开发商
        - '>$100M Series C 轮；估值未披露'
        - 可作为工厂建造核能故事中较小规模私有融资参考
        - PWR 架构、监管路径不同，且未披露估值
    notes: 这组可比对象刻意混合而非穷尽：Radiant 仍处收入前且披露较少，所以这里把公开收入前可比公司和私有里程碑融资放在一起。估值是市场快照或最近披露的轮次数据，不是标准化运营价值倍数。
