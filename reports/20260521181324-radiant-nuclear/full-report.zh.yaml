      - number: '3.2'
        title: 直接便携式同业
        blocks:
          - type: paragraph
            body: >-
              Radiant 对直接同业最强的公开论点从物流开始。它自己的材料强调卡车或飞机交付、无需场地开挖、次日启动、现场不用水，以及五年或更久之后回厂补充燃料的闭环。按这组证据，Radiant
              最贴合“在受限站点替代柴油”的任务。Westinghouse eVinci 是最可信的已披露商业对手，因为它也提供工厂组装的可运输系统，但功率提高到 5 MWe，并宣传八年以上堆芯寿命。这让 eVinci
              在单箱需要更大输出的站点更强，却不如 Radiant 严丝合缝地匹配最小偏远负载用例。


              国防项目让格局更复杂。Project Pele 表明美国政府愿意资助可运输微反应堆开发，EIA 的 2026 年概览也显示，国防和联邦试点项目可以容纳
              BWXT、Oklo、Radiant、Westinghouse、X-energy、Kairos
              等多家供应商。这有利于品类验证，却不利于排他性。如果军事设施成为最早的真实买方，渠道权力可能掌握在政府项目和主承包商关系手中，而不是技术上最整洁的商业产品包手中。


              Oklo 和 NANO 重要，但原因不同。Oklo 在 Eielson 有 1-5 MWe Aurora 试点，但其 2026 年最醒目的商业证据是与 Meta 签订的俄亥俄 1.2 GW
              协议，更指向园区级清洁稳定供应，而不是海运集装箱式便携性。相比之下，NANO 已上市，并在 KRONOS、ZEUS、LOKI 和 HALEU
              物流上野心很大，但已审阅公开材料读起来仍像开发阶段的组合搭建，而不是近期客户转化。Radiant 还需要注意一项额外风险：公开来源并不完全一致地描述 Kaleidos 的尺寸。公司和 NRC 材料指向约 1
              MWe，而围绕 Equinix 的外部和合作伙伴导向报道描述为 1.2 MWe。这个差异不会推翻便携利基逻辑，但很重要，因为尺寸等级正是 Radiant 区别于 eVinci 和更大型相邻 SMR 的核心。
