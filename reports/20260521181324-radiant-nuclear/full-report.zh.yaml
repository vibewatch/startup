  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 当前判断
      - 支撑证据
      - 什么会改变判断
    rows:
      - - 资本可得性
        - 投资逻辑
        - '>$525M 公开融资下限和新近 >$300M 融资显示融资需求强'
        - 平轮 / 下轮融资，或惩罚性优先股堆叠，会很快削弱投资逻辑
      - - 客户证据
        - 带保留的投资逻辑
        - Equinix 订金和 Buckley 路径构成有意义的早期验证
        - 详细订金条款、铺开时间表或场址承诺，会让该信号更可入账
      - - 运营证据
        - 反向逻辑
        - 没有公开收入、利润率或烧钱速度披露支撑当前估值标记
        - 若披露收入桥和单位经济性材料包，确信度会实质性改善
      - - 监管进展
        - 带保留的投资逻辑
        - DOME 路径、已受理的 Part 70 审查和 DOE 支持显示实际推进
        - 反应堆许可滑期，或延后到请求时间表之后，会压缩溢价
      - - 板块背景
        - 混合
        - 公私市场同业显示，在现金流出现前，投资人也会为核能期权价值付费
        - 如果泡沫担忧消退，且同业在首批测试后仍守住价值，Radiant 的溢价会更容易辩护
      - - 估值标记可靠性
        - 反向逻辑
        - '>$1.8B 数字来自投资人 / 新闻报道，而非独立确认'
        - 经审计的股权结构表、新融资文件，或可信独立估值标记，会增强价格信心
    notes: 这张表刻意区分两类论据：一类支撑公司质量，另一类支撑今天的价格。收入前反应堆开发商不能把两者混为一谈。
