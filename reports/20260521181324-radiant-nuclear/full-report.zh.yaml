      - number: '8.3'
        title: 当前标记下的乐观、基准和悲观情景
        blocks:
          - type: paragraph
            body: >-
              Radiant 的情景分析应被框定为一组宽区间，并明确里程碑假设，而不是一个细到小数点的目标价。乐观情景需要的不只是正面标题：2026 年 DOME 活动成功、NRC 在工厂路径上持续推进、HALEU
              可持续取得，并证明 Equinix 和防务路径正在转成付费部署，而不只是战略验证。基准情景更温和：Radiant
              保持动能、仍可融资，并因资本获取和旗舰客户得到信用，但运营数据披露仍不足以让当前标记显得明显便宜。悲观情景不只是“核能很难”，而是多个依赖同时滑期，公司在商业收入出现前还必须穿越延期继续融资。在这种框架下，目前据报道的
              >$1.8 billion 价格信号已经位于宽泛估计基准区间的中部附近，这意味着仅靠公开证据，并不能支持以今日标记进入是有吸引力的。投资人需要更低价格、更好的私有证据，或两者兼具。
