      - number: '7.4'
        title: 公众接受度、运输、废弃物和扩散担忧
        blocks:
          - type: paragraph
            body: >-
              Radiant 的便携式反应堆模式没有绕开社会许可问题，反而放大了它。围绕 Buckley 的公开报道已经显示，至少一些附近居民对公告感到意外，并立即关注废弃物和长期环境影响。Wyoming
              事件也基于同一个原因重要：当地公共阻力不只是抽象的反核意识形态，还来自问责、废弃物和出事后谁承担下行风险等问题没有答案。便携部署也改变了风险形态。NRC
              和行业评论现在明确区分新燃料机组运输，以及把已辐照机组运回换料或寿期末处理这一更难问题。这是 Radiant 商业模式的核心，不是边缘问题。最后，HALEU 不只是供应瓶颈，也是政治和安全风险。UCS
              和其他批评者认为，HALEU 安全应比当前公开叙事所暗示的更严肃地处理。如果这种批评转化为更严格的保障措施或出口管制，Radiant 的成本和物流优势会收窄。
