      - - 现金、烧钱速度和现金跑道
        - 无法用进度延期情景测试资本充足性
        - 公开轮次显示融资能力，但不显示当前流动性
        - 提供过去十二个月现金流、当前现金和下行情景现金跑道
      - - 客户价格 / PPA 费率
        - 无法将 Kaleidos 经济性与柴油或电网替代方案比较
        - 变现路径已公开；定价未公开
        - 提供报价单机销售价格、PPA 电价和任何最低采购量条款
      - - 定金机制
        - 无法判断已宣布定金是否真是降低风险的客户现金
        - 已披露定金，但未披露金额或可退款性
        - 提供单机定金、托管或退款条款和里程碑时间表
      - - 按站点拆分的积压订单和取消权
        - 无法评估转化概率或集中度风险
        - 公开具名的只有 Equinix 和军方路径
        - 提供站点清单、承诺机组数、终止触发条件和最终期限
      - - 员工数和职能结构
        - 无法规范化薪酬支出或生产率
        - 招聘页面只显示空缺岗位
        - 提供当前员工数，按地点和职能拆分，并附招聘计划
      - - 工厂营运资金 / 库存计划
        - 装料和返厂物流可能需要大量库存和运输资本
        - Part 70 申请确认了装料范围，但没有确认资产负债表处理
        - 提供库存政策、燃料所有权路径，以及返厂换料的营运资金假设
