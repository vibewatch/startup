      - number: '2.5'
        title: 判断与未解市场缺口
        blocks:
          - type: paragraph
            body: >
              最可复用的尽调判断是：Radiant 位于一个真实但仍处商业化前的市场。公开证据支持国防和数字基础设施买方存在有意义的需求拉力，但没有已审阅来源单独测算可运输 1 MWe 反应堆的独立
              SAM，也没有已审阅公开来源为 Kaleidos 本身提供经过验证的相对柴油或相对电网成本基准。因此，宽泛 SMR 市场报告只能提供方向性背景；不能单独用于客户转化或估值逻辑。


              后续客户与估值工作，正确做法是从证明点和转化障碍出发测算市场：候选站点有多少，哪些站点能承受核能交付周期，能够支持什么合同模式，以及燃料、许可和选址约束能多快清除。这样形成的市场逻辑比泛泛的“大核能
              TAM”更窄，但更可信。它也保留了最大的未知数，而不是把问题抹平：经济性、积压订单转化时间，以及买方从预购或试点话术走向已安装运行机组的真实速度。
