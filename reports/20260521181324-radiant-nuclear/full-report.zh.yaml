      - number: '3.3'
        title: 相邻分布式核能基准
        blocks:
          - type: paragraph
            body: >-
              更大型的分布式核能供应商不能直接替代 1 MWe 便携式机组，但它们确实会争夺预算和买方注意力。Last Energy 的公开卖点在合同模式层面最接近：它同样采用 PPA /
              全服务交付姿态，但围绕的是面向数据中心和工业站点的 20 MWe PWR-20 电站。NuScale 进一步上探规模阶梯。其 77 MWe 工厂制造压水模块和 ENTRA1 融资菜单表明，更大型 SMR
              供应商也能在不要求客户拥有反应堆的情况下提供 electricity-as-a-service，从而削弱“Radiant 独占 PPA 叙事”的论点。


              X-energy 和 Kairos 是最重要的相邻技术基准。X-energy 的 Xe-100 与 Radiant 同属 TRISO 和氦冷却家族，但产品是 80 MWe / 200 MWt
              工业平台，价值主张包括工业蒸汽，并以 Dow 四机组项目为旗舰部署。Kairos 转向熔盐冷却和 150 MWe 起步的双反应堆电站，把这个规模与在线换料、数据中心和工业定位、三项获批 NRC 建造许可，以及到
              2035 年最高 500 MW 的 Google 协议放在一起。相较于 Radiant 已披露内容，这些都是许可成熟度、工业热和超大型园区负载更强的参照。


              实际含义是，不应只拿 Radiant 与其他微反应堆初创公司比较。对超大规模云厂商、大型工业客户和大型园区来说，真实选择可能是在小型便携式反应堆、更大型先进反应堆 PPA
              与非核现状方案之间切换。这意味着，当机动性、小占地韧性和快速部署占主导时，Radiant 能赢；当买方看重规模、公开公司披露、蒸汽输出，或由公用事业和工业伙伴支持的数百兆瓦项目所带来的信心时，Radiant
              会输。Terrestrial Energy 也在更广泛的 DOE 试点项目范围内，但本次获取的公开材料过于稀疏，无法像 NuScale、X-energy、Kairos 或 Last Energy 那样精确画像。
