    rows:
      - - Bloom 燃料电池
        - 现在已达到 Equinix 规模（75 MW 运行；另有 30 MW 在建）
        - 现在可用、可在现场部署，并已在客户环境验证
        - 续航弱于多年核燃料循环；仍暴露在燃料和设备经济性风险下
        - 近期竞争风险高
      - - 电网现代化与公用事业升级
        - 已进入客户计划，但关键枢纽进展慢于预期
        - 沿用熟悉的许可路径和公用事业对手方
        - 交付时间往往跟不上 AI 增长节奏
        - 进度缺口仍在，因此风险中等
      - - 天然气与现场混合发电
        - 属于 Equinix 更广泛电力组合讨论的一部分
        - 部署快、可调度
        - 暴露于燃料价格和排放风险；脱碳叙事较弱
        - 中等风险
      - - 其他先进核能厂商（Oklo、ULC-Energy、Stellaria、Westinghouse、Antares）
        - 公开合作或基地分配已经可见
        - 客户可以分散反应堆技术和地理风险
        - 如果 Radiant 率先落地，仍能守住便携式柴油替代场景的小生态位
        - 战略风险高
      - - 等电网 / 推迟场址策略
        - 始终可作为默认选项
        - 避开首台同类反应堆执行风险
