        - 中等风险
    notes: 这张表不是 LCOE 对比，而是基于已审阅来源做出的决策时点对比。到 2026 年，Radiant 的主要竞争威胁不是另一款完全相同的便携反应堆，而是能更早解决电力稀缺的替代方案。
