      - number: '3.4'
        title: 护城河耐久性与未解问题
        blocks:
          - type: paragraph
            body: >-
              Radiant 的护城河真实存在，但很窄。最强的已披露差异化不是泛泛的“核能”，而是约 1 MWe
              规模、可运输性、工厂装料和服务、低站点负担，以及明确的柴油替代定位组合。较大型相邻供应商没有一家能同样干净地匹配这套组合。但这条护城河有几部分比营销叙事暗示的更容易复制。Westinghouse
              也在营销可运输性和工厂组装。Last Energy 和 NuScale 都把项目打包和买方融资纳入卖点。X-energy 和 Kairos 也证明，基于 TRISO 和模块化制造的叙事并非 Radiant 独有。


              更严重的风险来自商业和渠道。Equinix 是客户拉力的最佳公开证据，但同一买方也在同时押注多家核能开发商。DOME 是有意义的里程碑，但首批队列与 Westinghouse 共享，并非 Radiant
              独占。政府项目也在扩大竞争场，而不是收窄：EIA 的 2026 年概览列出了一长串正在通过 DOE 和国防路径推进的供应商。在这种环境里，资本深度、许可节奏和伙伴生态的重要性可能不低于原始便携性。


              最终判断是，Radiant 很可能拥有该领域最清晰的产品定义之一，但还没有最耐久的竞争地位之一。便携式 1 MWe
              利基可信且差异化。仍然缺失的是合同约束力、客户推出时间表、长期燃料可得性，甚至准确商业功率等级的更清晰证据。在这些缺口关闭前，应把 Radiant
              视为一个有前景、但仍受证据约束的利基领导者；更大型、资本更充足的先进反应堆供应商可能从上方挤入这个利基。
