companyProfile:
  summary: >-
    Radiant Nuclear 是一家位于加州 El Segundo 的先进核能初创公司，由 CEO Doug Bernauer 于 2020 年创立，目标是打造 Kaleidos：一款集装箱化、约 1 MWe 的微反应堆，使用
    TRISO 燃料、氦冷却剂和干式冷却，替代国防基地、数据中心和偏远地点的柴油发电。公开证据显示，Radiant 在 2025-2026 年商业化势头异常强：先完成 $165M Series C，再完成 >$300M Series
    D，公开累计融资超过 $525M，Equinix 为 20 台反应堆支付定金，取得 DOE DOME 测试资格和 DARK 批准，入选 Buckley Space Force Base，并且 Oak Ridge R-50
    工厂装料申请已获 NRC 受理审查。即便进展明显，Radiant 仍处于商业化前阶段，且私营披露有限：没有公开收入、毛利率、烧钱速度、现金跑道、员工数或完整治理信息。
