      - number: '4.2'
        title: 已融资本、估值标记与表观充足性
        blocks:
          - type: paragraph
            body: >
              公开资本形成是 Radiant 财务记录里最强的一部分。2025 年 5 月 Series C 以 $165M 完成，并明确把总风险融资推至 $225M。2025 年 12 月 Series D 又增加超过
              $300M，意味着仅凭公司披露即可确认至少 $525M 的累计公开风险资本。这些轮次都明确关联 Kaleidos 开发、商业化、DOME 时间表和 Tennessee 工厂项目。Tennessee 官员另称
              Oak Ridge 项目是一项 $280M 制造和研发投资，将创造 175 个岗位；这是一条有用的支出信号，尽管并不等于已经花出的现金。


              即便如此，已融资本不等于资本充足。获取到的公开来源没有披露 Series D 后的现金余额、当前月度烧钱速度或经过核实的现金跑道计算。广泛流传的超过 $1.8B 估值标记来自 DCVC
              这家既有投资人，而不是监管文件或市场出清的老股交易，因此应视为方向性而非确定性。公开证据因此支持这样的判断：Radiant 已吸引足够资本，能继续推进 2026
              年重大里程碑；但它不能精确回答当前流动性是否足以建完工厂、执行测试活动、吸收延误，并撑到有意义的客户现金产生。
