        - 工业运营商 / 项目业主
        - 直接核心细分
      - - 备用 / 关键基础设施
        - 医院、供水系统、海水淡化、灾害响应和其他韧性驱动的微电网应用
        - 单独传统备用柴油，或不绑定站点级韧性的公用事业调峰电厂
        - 设施业主 / 公共机构 / 韧性发起方
        - 相邻但技术上匹配
      - - 偏远社区 / 孤立电网
