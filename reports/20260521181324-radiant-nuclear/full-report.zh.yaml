      - number: '2.3'
        title: 需求驱动因素
        blocks:
          - type: paragraph
            body: >
              最可见的近期驱动因素，是 AI 和超大规模数据中心扩张带来的用电问题。DOE 和 Belfer 都提到美国数据中心用电需求快速上升，2028 年用电量可能远高于 2023
              年水平，一些地区已经出现电力稀缺、项目延期或围绕电网的直接合同。这不会自动让微反应堆成为胜出方案，但确实给了数据中心运营商一个可信理由：评估稳定的现场电力，而不是只依赖常规公用事业时间表。


              不过，Radiant 的市场不只是 AI
              故事。官方微反应堆项目材料反复强调柴油替代、偏远社区、矿业或离网工业、关键基础设施韧性和国防行动。这些细分市场有吸引力，正因为它们不需要数百兆瓦；它们需要小型、可运输、低用水、长换料间隔的资产。脱碳有帮助，但更强的驱动往往是燃料交付成本与运营负担、停电风险或受限输电接入。因此，即便更广泛的核能行业增长缓慢，1
              MWe 可运输反应堆也可能拥有真实利基。
