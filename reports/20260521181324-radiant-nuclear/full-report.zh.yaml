      - number: '5.3'
        title: 测试路径、制造模式与部署顺序
        blocks:
          - type: paragraph
            body: >-
              判断 Radiant 的技术成熟度，主要应看 DOME 和 R-50 两条路径，因为它们是把便携式反应堆概念转化为可制造产品的两条公开轨道。DOE 记录显示，Radiant 于 2024
              年完成前端工程和实验设计阶段，正在准备在 INL 的 DOME 设施开展带燃料 Kaleidos 实验，春季或 2026 年中测试被反复引用为目标窗口。与此同时，NRC 记录和 2026 年 5 月 Part
              70 审查报道显示，Radiant 已从泛泛的预申请沟通，进入针对 Oak Ridge 装料大楼的具体许可工作。这很重要，因为公司不只是提议在 Tennessee
              组装反应堆；它提出的是工厂装料和生产模式，其经济性取决于对特殊核材料的集中处理。当前招聘岗位反映的技术组织也支持这一判断。公开招聘需求覆盖流体系统、机构、结构、反应堆运行、中子学、瞬态分析、规程、操作员培训和控制室界面，说明一体化示范活动正在建设中，而不是一个冻结设计只等许可。这个产品因此处在后期原型和首个工厂产品之间，而不是广泛商业就绪阶段。
