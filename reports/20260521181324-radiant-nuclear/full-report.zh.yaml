  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - DOME 时间滑期
        - 测试看起来不再是 2026 年事件
        - 移除支撑今天溢价的最近硬证据点
        - 在新的已验证时间表出现前，转入明确下行情景
      - - 燃料脆弱性
        - HALEU 获取恶化，或仍只覆盖首炉芯
        - 把时间风险变成融资风险，并推迟付费部署
        - 假设需要更多资本；下调估值区间
      - - 许可漂移
        - Part 70 审查明显晚于请求时间，或反应堆许可路径变弱
        - 降低工厂投入能按期转化为可部署产品的信心
        - 压缩情景区间，并下调基准情景
      - - 客户转化失败
        - Equinix 订金条款变弱、节奏滑期，或预订未转成付费铺开
        - 削弱当前估值标记背后最强的商业证据
        - 在重新证明前，把客户逻辑视为宣传信号
      - - 结构化融资冲击
        - 下一轮暴露重度优先权、重大稀释或下轮定价
        - 显示当前估值标记没有以干净条款通过市场检验
        - 在堆叠经济性明确前，把建议重置为回避
      - - 重大里程碑后披露仍缺席
        - 测试或许可进展之后，公司仍不披露收入、现金和单位经济性
        - 表明管理层想拿估值信用，却不给承销透明度
        - 没有数据室证据前，不支付溢价倍数
    notes: 这些是可监测的估值触发项，不是泛泛的公司风险。每一项都会直接改变商业化概率，或改变企业价值中现实可分给新投资人的份额。
