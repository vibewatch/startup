      - number: '2.4'
        title: 约束、时间线风险与采用摩擦
        blocks:
          - type: paragraph
            body: >
              核心市场约束不是缺少口头需求，而是兴趣转化为运行中资产太慢。DOE 自身微反应堆项目把经济可行性和许可就绪度列为闸门问题，EIA 指出漫长许可和审批历史上限制了核能扩张，Radiant 的 NRC
              材料则显示工厂装料、材料许可和监管差距分析等多条工作流并行推进。DOME 具有战略重要性，因为它降低了技术和安全示范风险；但测试床不等于可商业重复的部署路径。


              燃料又加上一层闸门。DOE 通过 HALEU 分配衔接近期需求，但 Utility Dive 仍把美国国内民用 HALEU 供应描述为受基础设施缺口制约，UCS
              也强调了安全和扩散批评，可能抬高民用部署审查强度。客户采用也有自己的摩擦：数据中心买方必须解决所有权、电价和园区集成问题；军事和偏远站点客户则面对公共采购、信任、安全和主站点接纳问题。结果就是：市场拉力真实存在，但采用周期漫长且非线性。
