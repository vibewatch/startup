      - number: '7.3'
        title: 客户集中、防务依赖和替代电源竞争
        blocks:
          - type: paragraph
            body: >-
              Radiant 的公开需求证明仍高度集中。商业侧仍由 Equinix 主导，防务侧仍由 Buckley
              路径主导。集中度之所以重要，是因为两个交易对手都具战略意义，但没有任何一方公开披露足以让外部投资人测算经常性现金流的经济条款。同样重要的是，Equinix 并不是只押注 Radiant。它的公开能源战略包括
              Bloom 燃料电池、电网升级、备用基础设施，以及多个反应堆形态和时间线不同的核能开发商。这种多元化符合 Equinix 的理性选择，但也意味着 Radiant
              不仅要和其他微反应堆供应商竞争，还要和可更早部署的现场燃料电池及其他电力可用性替代方案竞争。Bloom 自己的 2026
              年调查指向一个越来越重视交付确定性和现场电力、而不是特定发电技术的市场。防务依赖也有同样的问题：DIU 和 Air Force
              是有意义的验证者，但这个项目也是产业政策工具，目标是刺激整个供应商基础，而不是给单一供应商未来订单担保。
