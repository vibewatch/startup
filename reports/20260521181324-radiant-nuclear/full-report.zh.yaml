  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >
              Radiant 的相关市场不是“整个核能”，甚至也不是整个小型模块化反应堆板块。公开来源一致把微反应堆描述为非常小、可运输、面向去中心化和非常规市场的反应堆；在这些场景里，1 MWe
              级资产可以解决单个站点的可靠性或物流问题。对 Radiant 来说，这意味着电网边缘的韧性供电：军事设施、数据中心、偏远工业、备用关键基础设施和孤立社区。它不意味着大电网基荷发电、公用事业机组替换，也不意味着宽泛
              300 MWe 及以下 SMR 预测所暗示的全部收入池。


              因此，最佳规模测算方法应是多镜头，而不是单一 TAM。DOE/LBNL 和 Belfer 为数据中心提供了可信需求视角，Equinix、Project Pele、Janus 和 Eielson
              则为早期采用者提供了具体细分证据。相比之下，供应商版 SMR 市场报告只能作为上限背景，因为它们把远超 Radiant 直接范围的反应堆类别和电网级应用打包在一起。实际结论是：Radiant
              的可服务市场（SAM）比通用 SMR TAM 材料暗示的更窄，但也更具体；它位于柴油、弱电网或并网瓶颈让便携式清洁稳定电力在经济或运营上值得买方认真投入的地点。
