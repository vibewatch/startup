      - number: '4.4'
        title: 融资含义、反向证据与承销判断
        blocks:
          - type: paragraph
            body: >
              核心融资含义很直接：Radiant 在风险投资口径下看起来可融资，但在项目或经营口径下还不可承销。风险投资人已经大规模投入，公司公开记录也显示州政府支持、DOE 参与、具名客户，以及比许多先进核能初创公司更具体的
              NRC 材料许可流程。但这些正面因素旁边还有几项未解依赖。DOE 称 HALEU 仍无法从国内供应商处获得，UCS 强调了 HALEU 使用相关的扩散和安全担忧，DOME
              活动则需要自筹资金且取决于里程碑。这意味着燃料合同、测试或许可一旦延误，Radiant 可能在收入到来前消耗更多资本。


              反向来源同样重要，因为它们指出了融资公告天然会弱化的风险。Beyond Nuclear 关注围绕回厂补充燃料模式的社区反对、运输、废料和纳税人责任问题；American Bar Association
              则指出，尽管政策势头强，北美真实 SMR 部署先例仍非常少。公开记录仍缺少合同金额、积压订单转化条款、定金机制、现金余额、烧钱速度和利润率数据。因此，正确的财务判断不是 Radiant
              缺乏动能，而是公司仍是一家依赖里程碑融资、披露较轻的企业；面对进度滑坡和商业化风险，主要缓冲仍是未来融资，而不是当前已报告经营。
