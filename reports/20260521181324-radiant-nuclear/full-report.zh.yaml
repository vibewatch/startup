  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究 / 观察
        - 融资和客户信号强，但缺少运营财务承销
        - 没有更多证据或更好入场价前，不应把当前估值标记当作可行动信号
      - - 信心
        - 中
        - 多数核心事实已公开，但决定性经济性仍是私有信息
        - 在私有数据补上最大缺口前，把确信度压在买入阈值以下
      - - 风险评级
        - 高
        - 燃料、许可、制造复制和披露缺口都可能冲击估值
        - 先承销下行；假设仍可能需要更多资本
      - - 估值立场
        - 当前 >$1.8B 标记下偏高，最好也只是合理
        - 当前信号位于宽泛估算基准区间的中部附近
        - 宁可等待，不追逐动量
      - - 偏好的入场纪律
        - 等更多证据，或等更低价格
        - 证据 = 测试成功、许可进展、客户转化和经济性披露
        - 只有证据改善快于价格时，才积极重启评估
      - - 可能退出姿态
        - 仅靠公开数据，现在还太早承销清晰 IPO 或战略退出回报
        - 商业交付指引仍在 2028 年及以后
        - 把退出测算视为高度依赖情景，而非可入账收益
    notes: 这些评估是定性的，并且明确对价格敏感。表格把已确认融资信号，与收入转化、利润率和稀释方面未获支撑的假设分开。
