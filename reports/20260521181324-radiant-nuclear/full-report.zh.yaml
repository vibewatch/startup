      - number: '1.3'
        title: 资本形成、利益相关方与具名需求信号
        blocks:
          - type: paragraph
            body: >
              2025 年，Radiant 从一家有风险投资支持的概念公司，变成重融资的商业化故事。公司在 2025 年 5 月完成 $165M Series C，使公开累计融资达到 $225M；随后在 2025 年 12
              月宣布由 Draper Associates 和 Boost VC 领投的新一轮融资，金额超过 $300M。这些披露意味着，到 2025 年底，公开风险投资资金超过 $525M。DCVC 还称 12 月这一轮对
              Radiant 的估值超过 $1.8B，但该估值来自既有投资人，而不是监管文件或中立市场参照，因此最好把它当作方向性信号，而不是充分交叉验证的公允价值锚点。投资方如今横跨财务 VC 和战略方，包括
              DCVC、Draper Associates、Boost VC、Andreessen Horowitz、Founders Fund、Union Square Ventures、Chevron Technology
              Ventures 和 Lockheed Martin Ventures。最强的公开需求证据同时带有商业和国防属性：Equinix 为 20 台反应堆支付定金，Department of the Air
              Force/DIU 选择 Radiant 用于 Buckley Space Force Base。公开视野里仍缺的是定价、积压订单转化、反应堆利润率，以及具名交易方之外的积压订单。
