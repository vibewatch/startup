  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Radiant 销售 Kaleidos 的定位是便携式核发电机，而不是常规现场建造电站。从主页、Buckley 公告、Equinix 预购新闻稿到 Marketplace
              资料，公司一直把该机组定位为偏远设施、医院、军事设施和数据中心的柴油发电机替代品。外部来源部分印证了这种定位：NRC 把 Kaleidos 描述为装在单个海运集装箱内、可运输、约 1 MWe / 3 MWth
              的微反应堆；Equinix
              相关报道也确认，至少有一个严肃商业买方把该产品视为现场数字基础设施电力，而不是抽象的未来反应堆概念。公开证据暗示的工作流在核能领域异常以工厂为中心：机组在场外建造、装料和测试，用卡车或飞机运到客户处，快速安装，运行约五年后补充燃料，然后返回集中服务。这个工作流有吸引力，因为它尽量减少现场施工和本地核处理；但它也意味着商业产品不只是反应堆堆芯，而是完整物流链：工厂装料、运输批准、现场集成、远程监控，以及机组返回补充燃料或翻新时的周转能力。
