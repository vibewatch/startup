    approximationNotes: 区间是依据上市和私营核能可比公司推导出的估计百万美元，并明确提示 Radiant 运营指标缺失。
    data:
      items:
        - label: 悲观情景
          low: 900
          high: 1300
          unit: $M
        - label: 基准情景
          low: 1400
          high: 2000
          unit: $M
        - label: 乐观情景
          low: 2100
          high: 3000
          unit: $M
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 式评分显示，Radiant 在资本获取和市场需求上最强，客户与监管证据居中，经济性披露和估值支撑最弱。
    approximationNotes: 评分为分析师依据本章审阅的公开证据给出的 1–5 分判断。
    data:
      items:
        - label: 市场需求
          value: 4.5
          unit: /5
          note: AI / 数据中心和偏远供电需求是真实顺风，但许多竞争对手同样受益。
        - label: 客户验证
          value: 3.5
          unit: /5
          note: Equinix 押金和 Buckley 有分量，但客户名单仍集中，经济性也未披露。
        - label: 监管进展
          value: 3
          unit: /5
          note: NRC 已受理审查和 DOME 路径有意义，但最终反应堆审批还在前面。
        - label: 资本支持
          value: 4
          unit: /5
          note: 对收入前反应堆公司来说，超过 $525M 的公开资金底线很强。
        - label: 制造就绪度
          value: 2.5
          unit: /5
          note: 工厂计划野心不小，但复制风险基本仍未验证。
        - label: 经济性披露
          value: 1.5
          unit: /5
          note: 未公开价格、毛利率、烧钱速度、现金跑道或积压订单转化指标。
        - label: 估值支撑
          value: 2
          unit: /5
          note: 从行业背景看，当前标记方向上说得通，但基于已披露基本面并不明显有吸引力。
    claimRefs:
      - CV016
      - CV031
      - CV032
      - CV036
      - CV041
      - CV042
