  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、商业化路径与披露限制
        blocks:
          - type: paragraph
            body: >
              Radiant 的公开变现故事在品类层面清楚，在合同层面不透明。公司网站称客户可以通过直接购买机组或购电协议购买 Kaleidos；这一点具有战略重要性，因为它意味着 Radiant
              并未锁死在纯硬件销售模式里。同一批材料把 Kaleidos 定位为面向偏远站点、医院、军事基地和数据中心的柴油替代电力产品；最好的公开需求证据，是 Equinix 对 20 台反应堆支付定金的预购，以及
              Department of the Air Force/DIU 旨在军事基地部署的协议。这些事实重要，但并不等于已披露的收入质量。


              已审阅公开来源都没有披露单机售价、任何 PPA 电价、Equinix
              定金规模或是否可退、里程碑付款安排，或早期客户现金会如何确认为收入。五年以上回厂补充燃料的闭环也意味着服务和物流义务；它可能成为经常性利润引擎，也可能变成经常性成本负担，但公开材料没有拆分这部分经济性。结果是：商业化叙事可信，有具名交易方和付款信号，但证据不足以建模
              ASP、贡献利润率，或一次性硬件收入与更长期服务收入之间的拆分。
