      - number: '8.2'
        title: 可比锚点和按里程碑调整的估值逻辑
        blocks:
          - type: paragraph
            body: >-
              公私市场核能可比公司解释了 Radiant 为什么能拿到十亿美元叙事、尽管还没有证明商业反应堆收入；它们也说明投资人为什么要抵制伪精确。公开市场可比公司是最清晰的警示标签。Oklo 的公开估值远高于
              Radiant 据报道的标记，尽管收入仍列为 n/a；NuScale 估值低于 Oklo，但收入有限且稀释很重，仍以数十亿美元估值交易。NANO Nuclear
              说明，即便是更早期、收入前的微反应堆故事，只要投资人为期权价值定价，市值也能超过 $1 billion。私募轮也强化同一教训：X-energy 的 $700 million 融资、Helion 的 $5.425
              billion 投后估值，以及 Last Energy 的 $100 million Series C 轮，都显示资本正在追逐先进核能里程碑。但这些可比公司都无法完全解决 Radiant
              的估值问题，因为每家公司在反应堆尺寸、监管成熟度、客户类型或披露质量上都不同。正确方法因此是按里程碑调整的比较，而不是用电子表格假装 Radiant 已经有可知现金流。
