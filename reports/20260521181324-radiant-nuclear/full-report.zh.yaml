        title: 具名证明与目标细分之间的差距
        blocks:
          - type: paragraph
            body: >-
              Radiant 公开客户证据的宽度，远窄于官网列出的终端市场。综合 Radiant 官网、Marketplace 走访、Equinix 公告以及 Air Force / DIU
              材料，真正高于泛化营销的需求锚点只有两个：商业侧的 Equinix，防务侧的 Department of the Air Force / DIU Buckley
              路径。其他内容——医院、偏远村庄、偏远工业场地、抽象的军事基地、海水淡化和微电网——更像目标细分或用例营销，而不是已披露的签约交易对手。需求证明层级很重要：带押金的具名预订单，强于官网用例；NEPA
              仍未完成的政府选址，强于一个 logo，但明显弱于正在运行的客户。因此本章把 Radiant 视为已拿到真实早期需求证明，但尚未拥有多元化装机客户基础。
