      - number: '4.3'
        title: 成本结构、规模化支出与单位经济代理指标
        blocks:
          - type: paragraph
            body: >
              Radiant 的公开披露给出了真实支出信号，但没有给出成型的单位经济。最清晰的资本开支代理指标是计划中的 $280M Oak Ridge 工厂；最清晰的近期运营支出代理指标是招聘页面：66
              个开放岗位覆盖工程、运营、财务、供应链和监管工作，最高薪资区间达到 $314,475 加股权。这些岗位让人很难说公司处在低烧钱阶段。它们也显示，这个收入前组织正在同时为产品工程、许可、制造就绪和公司基础设施付费。


              其他成本信号进一步强化了资本密集度。DOE 称 DOME 实验由申请方自筹资金，并依赖燃料可得性和监管就绪度。Part 70
              申请显示，工厂模式包括装料、环境审查、材料控制、实体安全和加速监管工作流。独立报道还提到一份单独的 Urenco HALEU 相关协议，说明除工厂资本开支外，燃料采购支出也存在。合在一起，公开记录支持把
              Radiant
              看作一家制造加服务企业；在商业收入披露前，它已承担有意义的监管、供应链和薪酬义务。记录不支持的是任何关于客户价格、毛利率、CAC、回本周期，甚至总员工数的硬公开数字，因此公开单位经济分析只能基于代理指标。
