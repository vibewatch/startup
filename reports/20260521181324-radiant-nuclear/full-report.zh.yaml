  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与细分
        blocks:
          - type: paragraph
            body: >-
              Radiant 的正确竞争框架比“所有 SMR”更窄。本文审阅的行业资料把微反应堆视为 SMR 市场中低于 20 MW
              的边缘段，优化方向是工厂制造、选址灵活性、偏远社区、离网工业、数据中心或微电网用例，而不是替代公用事业规模发电。在这个更大族群里，Radiant 已披露的产品包异常小，也异常围绕物流展开：官方和监管材料都把
              Kaleidos 定位在一个约 1 MWe、用于替代柴油、大小接近海运集装箱的任务上。


              这让 Westinghouse eVinci 处在最接近的直接赛道，因为它同样可运输、工厂组装，并瞄准偏远社区、采矿和数据中心。BWXT 的 Project Pele
              背景也重要，因为它验证了军方对可运输反应堆的需求，哪怕它不是广泛商业产品，也可能影响国防采购路径。Oklo 和 NANO 只是部分重叠：Oklo 有 1-5 MWe
              国防试点，也有大得多、面向超大规模云厂商的商业叙事；NANO 具备公开市场可见度，但概念范围更早、更宽。相比之下，Last Energy、NuScale、X-energy 和 Kairos
              是相邻的分布式核能基准：它们带来融资、许可或工业热可信度，但公开标准产品从 20 MWe 起步，或明显高于这一水平。


              替代品集合同样重要。对最小型任务而言，真正的在位方案仍是柴油加微电网或弱电网连接，而不是另一家反应堆供应商。对园区级负载而言，更大型反应堆 PPA、公用事业合同、燃气或电网延伸策略，都可能在不要求买方接受 1
              MWe 便携式机组的情况下解决同一个可靠性问题。因此，当买方任务是机动性、低土建和长时离网韧性时，Radiant 才会赢；一旦买方需要工业蒸汽、很大的园区负载，或需要公开公司 /
              公用事业支持平台的融资深度，Radiant 的相关性就会下降。
