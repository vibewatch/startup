      - number: '2.2'
        title: 买方细分、预算所有者与采购路径
        blocks:
          - type: paragraph
            body: >
              买方地图更多按运营场景切分，而不是按反应堆技术切分。在国防场景，相关客户是 Army、Air Force 或更广泛联邦设施系统内的设施能源或韧性负责人；Project Pele、Janus、Eielson 和
              Buckley
              都指向这条渠道。在数据中心场景，买方更可能是运营商的能源或采购职能，而不是租户或应用所有者，因为公开证据围绕组合电力战略、首席采购监督和长期电力合同展开。偏远工业、社区和应急响应用例则落在第三类；痛点通常是燃料物流、薄弱输电或高停电成本，而不是纯粹的
              AI 增长。


              Radiant 的商业模式重要，因为它既支持直接销售机组，也支持类似购电的结构。这种灵活性让付款方因细分市场而变：军种、数据中心运营商、矿主或公共出资方，都可能在不同合同逻辑下为资产付费。Equinix
              是最强的公开商业证据，因为它把兴趣转化为带定金的预购；但即便如此，公开记录仍没有完整披露站点经济性、单机定价或按园区展开的公开部署时间表。
