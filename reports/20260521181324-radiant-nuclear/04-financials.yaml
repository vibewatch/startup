schemaVersion: "report-v2"
artifact: "financials"
slug: "radiant-nuclear"
runDate: "2026-05-21"
company:
  name: "Radiant Nuclear"
chapter:
  number: 4
  title: "Financials"
  summary: |
    Radiant Nuclear is still a pre-revenue, private company with unusually strong public capital-formation evidence but unusually weak operating-financial disclosure. Company and independent sources support at least $525 million of confirmed public venture funding through the 2025 Series C and Series D announcements, a $280 million Oak Ridge factory project, deposit-bearing demand from Equinix, and a self-funded 2026 DOME test path. But the public record still does not disclose revenue, ARR, gross margin, burn, runway, headcount, backlog conversion, or customer contract values, so the financial verdict is that Radiant appears financed for continued execution yet remains impossible to underwrite on conventional operating metrics.

sections:
  - id: revenue-model-and-demand
    title: "Revenue model, commercialization path, and disclosure limits"
    body: |
      Radiant's public monetization story is clear at the category level and opaque at the contract level. The company website says customers can buy Kaleidos through either direct unit sales or power purchase agreements, which is strategically important because it means Radiant is not locked into a pure hardware-sale model. The same materials frame Kaleidos as a diesel-replacement power product for remote sites, hospitals, military bases, and data centers, and the best public demand proof is the Equinix preorder with deposits for 20 reactors plus the Department of the Air Force/DIU agreement aimed at a military-base deployment. Those facts matter, but they are not the same thing as disclosed revenue quality.

      None of the reviewed public sources disclose the per-unit sale price, any PPA tariff, the size or refundability of Equinix's deposits, milestone-payment schedules, or how early customer cash would be recognized in revenue. The five-plus-year return-to-factory refueling loop also implies a service and logistics obligation that could become either a recurring-margin engine or a recurring-cost burden, yet public materials do not separate those economics. The result is a credible commercialization narrative with named counterparties and payment signals, but not enough evidence to model ASP, contribution margin, or the split between one-time hardware revenue and longer-duration service revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008, CI009, CI035, CI039]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]

  - id: capital-raised-and-capital-adequacy
    title: "Capital raised, valuation markers, and apparent adequacy"
    body: |
      Public capital formation is the strongest part of Radiant's financial record. The May 2025 Series C closed at $165 million and explicitly took total venture funding to $225 million. The December 2025 Series D then added more than $300 million, which means at least $525 million of cumulative public venture capital can be confirmed from company disclosures alone. Those rounds were explicitly tied to Kaleidos development, commercialization, the DOME schedule, and the Tennessee factory program. Tennessee officials separately described the Oak Ridge project as a $280 million manufacturing and R&D investment that will create 175 jobs, which is a useful spending signal even though it is not the same as cash already spent.

      Even so, capital raised is not the same as capital adequacy. No fetched public source discloses cash on hand after the Series D, a current monthly burn rate, or a verified runway calculation. The widely repeated valuation marker above $1.8 billion comes from DCVC, an existing investor, rather than a filing or market-clearing secondary transaction, so it should be treated as directional rather than definitive. Public evidence therefore supports the judgment that Radiant has attracted enough capital to keep executing through major 2026 milestones, but it does not support a precise answer to whether current liquidity is enough to finish the factory, execute the test campaign, absorb delays, and bridge to meaningful customer cash generation.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI017, CI018, CI019, CI020, CI038, CI040]
    tableRefs: [TI004]
    figureRefs: [FI003, FI004]

  - id: cost-structure-and-unit-economics
    title: "Cost structure, scale-up spend, and unit-economics proxies"
    body: |
      Radiant's public disclosures give real spend signals but not finished unit economics. The clearest capex proxy is the planned $280 million Oak Ridge factory, while the clearest near-term operating-spend proxy is the jobs board: 66 open roles across engineering, operations, finance, supply chain, and regulatory work, with top salary bands reaching $314,475 plus equity. Those postings make it hard to argue the company is in a low-burn phase. They also show that the pre-revenue organization is simultaneously paying for product engineering, licensing, manufacturing readiness, and corporate infrastructure.

      Additional cost signals reinforce the capital intensity. DOE says DOME experiments are self-funded by applicants and depend on fuel availability and regulatory readiness. The Part 70 filing shows the factory model includes fueling, environmental review, material control, physical security, and expedited regulatory workstreams. Independent coverage also reported a separate Urenco HALEU-related agreement, suggesting fuel-procurement spend exists in addition to factory capex. Put together, the public record supports a view of Radiant as a manufacturing-plus-service business with meaningful regulatory, supply-chain, and payroll obligations before commercial revenue is disclosed. What the record does not support is any hard public number for customer price, gross margin, CAC, payback, or even total headcount, so public unit-economics work must remain proxy-based.
    claimRefs: [CI018, CI020, CI021, CI022, CI023, CI024, CI025, CI026, CI027, CI028, CI029, CI030, CI036, CI037]
    tableRefs: [TI003]
    figureRefs: [FI002]

  - id: underwriting-risks-and-diligence-blockers
    title: "Financing implications, adverse evidence, and underwriting verdict"
    body: |
      The central financing implication is straightforward: Radiant looks financeable in venture terms but not yet underwritable in project or operating terms. Venture investors have already funded the company at scale, and the public record shows state support, DOE engagement, named customers, and an NRC materials-license process that is far more concrete than many advanced-nuclear startups ever achieve. But those positives sit beside several unresolved dependencies. DOE says HALEU is still not available from domestic suppliers, UCS highlights proliferation and security concerns tied to HALEU use, and the DOME campaign is self-funded and contingent on milestones. That means delays in fuel contracting, testing, or licensing could force Radiant to consume more capital before revenue arrives.

      Adverse sources also matter because they highlight risks that fundraising announcements naturally understate. Beyond Nuclear focuses on community opposition, transport, waste, and taxpayer-liability concerns around the factory-return refueling model, while the American Bar Association notes how little real North American SMR deployment precedent exists despite policy momentum. The public record still lacks contract values, backlog conversion terms, deposit mechanics, cash balance, burn, and margin data. So the right financial verdict is not that Radiant lacks momentum; it is that the company remains a milestone-financed, disclosure-light business where future fundraising, not current reported operations, is still the main buffer against schedule slip and commercialization risk.
    claimRefs: [CI017, CI025, CI027, CI031, CI032, CI033, CI034, CI035, CI036, CI037, CI038, CI039, CI040]
    tableRefs: [TI005]

callouts:
  - calloutType: strength
    title: "Public capital access is strong for a pre-revenue nuclear startup"
    body: "Radiant has supportable public evidence for at least $525 million of venture capital, a $280 million factory project, and deposit-bearing demand from Equinix. That is materially stronger public financing evidence than most advanced-reactor startups can show before first fueled test." 
    claimRefs: [CI014, CI018, CI038]

  - calloutType: risk
    title: "Operating-financial opacity is still the main blocker"
    body: "Public sources do not disclose revenue, ARR, gross margin, burn, runway, total headcount, contract values, or backlog conversion mechanics. That leaves capital adequacy inferential rather than demonstrably underwritten." 
    claimRefs: [CI017, CI036, CI039, CI040]

  - calloutType: risk
    title: "HALEU remains both a fuel dependency and a financing dependency"
    body: "DOE says domestic HALEU is not currently available from suppliers, and UCS highlights security concerns around broader HALEU use. Any delay in fuel contracting or handling requirements can consume additional capital before Radiant reaches revenue-generating deployments." 
    claimRefs: [CI027, CI031, CI032, CI037]

  - calloutType: assumption
    title: "The >$1.8 billion valuation marker should be treated as directional"
    body: "The cited valuation comes from DCVC, an existing investor that participated in the round. It is a useful sentiment marker, but not the same thing as a filing-backed or independently cleared market value." 
    claimRefs: [CI015]

tables:
  - id: TI001
    title: "Revenue streams and monetization status"
    columns: ["Stream", "Mechanism", "Public value / status", "Revenue quality", "Evidence status", "Diligence ask"]
    rows:
      - ["Direct unit sale", "Customer buys Kaleidos unit", null, "Medium until price and warranty terms are disclosed", "Corporate site confirms sales path", "Provide quoted unit price, delivery milestones, and warranty / service bundle"]
      - ["Power purchase agreement", "Radiant sells power output rather than hardware title", null, "Medium if recurring, but tariff and tenor are undisclosed", "Corporate site confirms PPA path", "Provide tariff, contract tenor, escalation, minimum take, and operator responsibilities"]
      - ["Equinix preorder", "Preorder plus deposits for 20 reactors", null, "Low-to-medium until deposit treatment and cancellation rights are known", "Deposits are disclosed; economics are not", "Provide deposit amount per unit, refundability, milestones, and site schedule"]
      - ["Defense base deployment", "ANPI agreement aimed at first military-base delivery", null, "Low until contract value and payment milestones are public", "Program path is public; economics are not", "Provide contract value, milestone payments, acceptance criteria, and long-tail service obligations"]
      - ["Refueling / return service", "Factory return after 5+ years for refueling", null, "Potential recurring revenue, but service pricing is undisclosed", "Lifecycle model is public", "Provide refueling price, transport liability, and gross-margin assumptions"]
      - ["Heat / ancillary service", "1.9 MWth thermal output may support facility heat or desalination", null, "Unclear because monetization path is not public", "Capability is disclosed; price is not", "Explain whether thermal output is bundled, separately sold, or commercially irrelevant"]
    notes: "Radiant discloses monetization paths and customer archetypes, but none of the reviewed sources disclose list pricing, realized pricing, PPA tariffs, or contract-value detail; null means not publicly disclosed in the fetched set."
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI039]

  - id: TI002
    title: "Pricing and commercialization signals"
    columns: ["Offer / term", "Price / rate", "Contract form", "Public customer signal", "Unknowns / caveats", "Source anchor"]
    rows:
      - ["Direct sale", null, "Equipment sale", "Website says direct unit sales are available", "No unit ASP, milestone schedule, or support package disclosed", "Radiant homepage"]
      - ["PPA", null, "Recurring power contract", "Website says PPAs are available", "No price per MWh, tenor, or operating-responsibility split disclosed", "Radiant homepage"]
      - ["Equinix commercial deal", null, "Preorder plus deposits", "20 reactors and deposits disclosed", "Deposit size, refundability, and revenue treatment undisclosed", "Newswire / World Nuclear News"]
      - ["ANPI / Air Force pathway", null, "Agreement designed to deliver reactor to base", "2028 delivery target disclosed", "Contract value, federal obligations, and payment timing undisclosed", "Newswire / World Nuclear News"]
      - ["Factory return refueling", null, "Lifecycle service loop", "Publicly described as part of product model", "No public service fee, logistics cost, or margin disclosure", "Radiant homepage"]
      - ["Customer concentration", null, "Named demand proof", "One data-center counterparty and one defense pathway are public", "No broader backlog roster or site-by-site pipeline disclosed", "Marketplace / company releases"]
    notes: "This table intentionally separates disclosed contract structure from undisclosed economics. Null means the fetched source set confirms the offer exists but not the commercial price or accounting treatment."
    claimRefs: [CI001, CI004, CI005, CI006, CI009, CI035, CI039]

  - id: TI003
    title: "Unit economics and public financial proxies"
    columns: ["Metric", "Public value / status", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Confirmed public venture funding", 525, "High", "Sets the minimum capital base visible to outsiders in USD millions", "Reconcile with actual cash received and any secondary or non-primary proceeds"]
      - ["Planned Tennessee factory investment (USDm)", 280, "High", "Largest disclosed capex-style commitment tied to commercialization", "Provide spend schedule, funding source split, and contingency budget"]
      - ["Open positions", 66, "High", "Hiring scale is a proxy for near-term opex and organizational build", "Provide current headcount, filled-vs-open roles, and function mix"]
      - ["Top disclosed salary band (USD)", 314475, "High", "Signals cost of specialized talent in a licensing-heavy scale-up", "Provide fully loaded payroll, equity burn, and recruiting plan"]
      - ["Customer price per reactor", null, "Medium", "Needed to model revenue scale and payback", "Provide current quotes, expected discounts, and installed-customer burden"]
      - ["PPA tariff", null, "Medium", "Needed to compare against diesel or grid alternatives", "Provide $/MWh, indexation, term, and minimum volume commitments"]
      - ["Deposit amount per reactor", null, "Medium", "Determines how much customer cash really de-risks working capital", "Provide per-unit deposit, refundability, and balance due at milestones"]
      - ["Gross margin", null, "Medium", "Core determinant of manufacturing and service quality", "Provide gross margin bridge separating fuel, assembly, logistics, and field support"]
      - ["Monthly burn", null, "Medium", "Required to translate fundraising into runway", "Provide trailing six-month cash burn and burn split by function"]
      - ["Cash on hand", null, "Medium", "Required for capital-adequacy analysis", "Provide unrestricted cash and any debt or restricted cash balances"]
      - ["Runway months", null, "Medium", "Needed to test financing dependency against schedule slip", "Provide base-case and downside runway assumptions"]
      - ["Total headcount", null, "Medium", "Needed to normalize payroll and productivity", "Provide current headcount and hiring plan by site and function"]
    notes: "Rows mix hard public numbers and null disclosure gaps. Numeric values are kept numeric per contract rules; null means the metric is not publicly disclosed in the fetched source set rather than zero."
    claimRefs: [CI014, CI018, CI028, CI029, CI036, CI037]

  - id: TI004
    title: "Capital adequacy and financing dependency"
    columns: ["Item", "Public amount / status", "Evidence quality", "Financing implication", "Diligence ask"]
    rows:
      - ["Series C", 165, "High", "Funded 2025 development and early factory work in USD millions", "Confirm net proceeds after fees and current unspent balance"]
      - ["Public cumulative funding after Series C", 225, "High", "Baseline visible capital before the December 2025 round in USD millions", "Reconcile against cap table and any bridge or grant inflows"]
      - ["Series D", 300, "High", "Publicly confirmed as more than $300 million; minimum shown here in USD millions", "Provide exact gross and net proceeds plus security type"]
      - ["Confirmed public cumulative funding floor", 525, "High", "Minimum venture capital that can be confirmed from public disclosures in USD millions", "Provide exact lifetime capital raised including grants, customer cash, and strategic instruments"]
      - ["Valuation marker (USDm)", 1800, "Medium", "Useful sentiment signal but investor-sourced rather than filing-backed", "Provide priced-round post-money, share count, and liquidation stack"]
      - ["Oak Ridge project investment (USDm)", 280, "High", "Signals commercialization capex and manufacturing ambition", "Provide spend phasing, land/building ownership, and contingency reserve"]
      - ["Tennessee Nuclear Energy Fund support", "Utilized; company-specific amount not stated in fetched direct sources", "Medium", "State support exists but exact subsidy value remains unclear", "Provide grant amount, draw conditions, and clawback terms"]
      - ["DOME testing", "Self-funded by applicant; up to six-month experiment window", "High", "Test program consumes capital before revenue and remains milestone-gated", "Provide internal DOME budget and downside delay assumptions"]
      - ["Fuel supply", "DOE conditional HALEU commitment; domestic supply not currently available", "High", "Fuel remains an external dependency that can alter timing and working capital", "Provide executed fuel contracts, timing, and contingency sourcing plan"]
      - ["Part 70 review", "Accepted; expedited review requested for Nov. 1, 2026", "High", "Licensing progress can accelerate or delay spend conversion into revenue", "Provide licensing critical path and probability-weighted slip case"]
      - ["Cash on hand", null, "Medium", "Key missing input for runway analysis", "Provide unrestricted cash, restricted cash, and debt balances"]
      - ["Monthly burn / runway", null, "Medium", "Cannot be verified from public sources", "Provide current burn, expected 2026-2028 burn ramp, and funding trigger points"]
    notes: "Confirmed capital raised is separated from unsupported valuation markers. Numeric rows are USD millions unless stated otherwise; the valuation row is a directional investor/news marker, not a filing-backed fair-value conclusion."
    claimRefs: [CI010, CI012, CI014, CI015, CI017, CI018, CI019, CI022, CI024, CI026, CI027, CI037]

  - id: TI005
    title: "Public financial gaps and exact diligence asks"
    columns: ["Missing metric", "Why it matters", "Current public proxy", "Exact diligence path"]
    rows:
      - ["Revenue / ARR", "Cannot determine whether customer activity has converted into recognized sales", "Only deposits and agreements are public", "Provide monthly revenue bridge, backlog, and ARR or contract-value disclosure"]
      - ["Gross margin", "Cannot judge whether factory and fuel model creates healthy unit economics", "Factory, fuel, and logistics obligations are public but unquantified", "Provide gross-margin bridge by hardware, service, and refueling components"]
      - ["Cash, burn, and runway", "Cannot test capital adequacy against schedule slip", "Public rounds show fundraising capacity but not current liquidity", "Provide trailing twelve-month cash flow, current cash, and downside runway"]
      - ["Customer price / PPA rate", "Cannot compare Kaleidos economics against diesel or grid alternatives", "Monetization path is public; pricing is not", "Provide quoted unit sale price, PPA tariff, and any minimum volume terms"]
      - ["Deposit mechanics", "Cannot tell whether announced deposits are truly risk-reducing customer cash", "Deposits are disclosed without amount or refundability", "Provide per-unit deposit, escrow or refund terms, and milestone schedule"]
      - ["Backlog by site and cancellation rights", "Cannot assess conversion probability or concentration risk", "Only Equinix and military path are publicly named", "Provide site roster, committed units, termination triggers, and long-stop dates"]
      - ["Headcount and function mix", "Cannot normalize payroll spend or productivity", "Jobs board shows openings only", "Provide current headcount by site and function plus hiring plan"]
      - ["Factory working capital / inventory plan", "Fueling and return logistics may require significant inventory and transport capital", "Part 70 filing confirms fueling scope but not balance-sheet treatment", "Provide inventory policy, fuel ownership path, and return-refueling working-capital assumptions"]
    notes: "These are the specific missing inputs preventing standard financial underwriting. Each gap is concrete enough to map to a diligence request rather than a generic call for more detail."
    claimRefs: [CI006, CI007, CI008, CI017, CI030, CI035, CI036, CI039, CI040]

figures:
  - id: FI001
    title: "Revenue model bridge from contract to cash"
    type: flow
    layout: standard
    summary: "Public evidence supports the structure of Radiant's revenue model, but not the prices or accounting treatment that would turn that structure into underwritable cash flow."
    data:
      nodes:
        - {id: "contract", label: "Customer chooses direct sale or PPA"}
        - {id: "precommitment", label: "Preorder / deposits or program agreement"}
        - {id: "factory", label: "Factory assembly, fueling, and deployment"}
        - {id: "operation", label: "5+ years of operation plus fleet monitoring"}
        - {id: "return", label: "Factory return and refueling loop"}
        - {id: "cash", label: "Recognized revenue and gross profit remain undisclosed"}
      edges:
        - {from: "contract", to: "precommitment"}
        - {from: "precommitment", to: "factory"}
        - {from: "factory", to: "operation"}
        - {from: "operation", to: "return"}
        - {from: "return", to: "cash"}
    approximationNotes: "The flow is contractual and operational, not accounting-definitive. Public sources confirm the path elements but do not disclose deposit treatment, ASP, PPA tariff, or revenue-recognition policy."
    claimRefs: [CI001, CI003, CI004, CI005, CI006, CI039]

  - id: FI002
    title: "Public unit-economics bridge: known inputs versus missing outputs"
    type: flow
    layout: standard
    summary: "Radiant's public record contains enough spend and commercialization signals to identify the cost stack, but not enough disclosure to calculate margin or payback."
    data:
      nodes:
        - {id: "capital", label: ">$525M public funding floor"}
        - {id: "factory", label: "$280M factory project + 175 jobs"}
        - {id: "test", label: "Self-funded DOME testing + fuel dependency"}
        - {id: "labor", label: "66 openings and high salary bands"}
        - {id: "unknowns", label: "Unknown price, gross margin, burn, CAC, headcount"}
        - {id: "verdict", label: "Proxy-based analysis only; diligence pack required"}
      edges:
        - {from: "capital", to: "factory"}
        - {from: "capital", to: "test"}
        - {from: "factory", to: "labor"}
        - {from: "test", to: "unknowns"}
        - {from: "labor", to: "unknowns"}
        - {from: "unknowns", to: "verdict"}
    approximationNotes: "This bridge intentionally distinguishes disclosed capital and spend signals from missing operating outputs. It is a public-evidence map, not a solved unit-economics model."
    claimRefs: [CI018, CI025, CI027, CI028, CI029, CI036, CI037]

  - id: FI003
    title: "Public financial estimate range"
    type: range
    layout: standard
    summary: "Only a few financial values are numerically supportable in public; everything else that matters for underwriting remains undisclosed."
    data:
      items:
        - {label: "Confirmed public cumulative funding", low: 525, high: 525, unit: "USDm", note: "Floor derived from disclosed Series C total and Series D minimum"}
        - {label: "Latest round size", low: 300, high: 300, unit: "USDm", note: "Company disclosed 'more than $300M'; chart shows the minimum confirmed value"}
        - {label: "Oak Ridge project investment", low: 280, high: 280, unit: "USDm", note: "State and local sources frame the project as a $280M investment"}
        - {label: "Valuation marker", low: 1800, high: 1800, unit: "USDm", note: "Investor-sourced DCVC marker; not filing-backed"}
    approximationNotes: "Equal low/high values indicate single-point public disclosures or minimum confirmed floors rather than modeled distributions. The valuation item is shown only as a directional marker with medium confidence."
    claimRefs: [CI014, CI015, CI018, CI020]

  - id: FI004
    title: "Capital intensity and cash-flow dependency map"
    type: flow
    layout: standard
    summary: "Radiant's current financing story is a sequence of capital inputs feeding manufacturing, testing, and licensing gates before any public revenue disclosure appears."
    data:
      nodes:
        - {id: "equity", label: "Series C + Series D venture capital"}
        - {id: "state", label: "State-backed siting support and Nuclear Energy Fund utilization"}
        - {id: "build", label: "R-50 factory build and staffing ramp"}
        - {id: "fueltest", label: "HALEU contracting and self-funded DOME test"}
        - {id: "license", label: "Part 70 review and planned operating-license filing"}
        - {id: "delivery", label: "2028 deliveries or further financing need if gates slip"}
      edges:
        - {from: "equity", to: "build"}
        - {from: "state", to: "build"}
        - {from: "build", to: "fueltest"}
        - {from: "fueltest", to: "license"}
        - {from: "license", to: "delivery"}
    approximationNotes: "This figure shows sequence rather than magnitude. The public record gives real milestone and spend signals but not the internal cash waterfall or contingency reserves."
    claimRefs: [CI016, CI018, CI019, CI022, CI025, CI027, CI037, CI040]

