  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "pricing-disclosure-gap"
      missingEvidence: "Quoted unit sale price, PPA tariff, contract tenor, and deposit mechanics for the Equinix and ANPI deals."
      whyItMatters: "Without contract economics, deposits and agreements cannot be translated into revenue quality or customer payback."
      diligencePath: "Request signed customer term sheets, pricing schedules, refund provisions, and accounting treatment memo."
      relatedQuestionRefs: [QI002, QI025]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: "cash-runway-gap"
      missingEvidence: "Current unrestricted cash, monthly burn, and base-case versus downside runway."
      whyItMatters: "Capital raised alone does not prove that Radiant can absorb delays in fuel, testing, licensing, or factory buildout."
      diligencePath: "Request latest balance sheet, trailing twelve-month cash flow, board budget, and financing trigger memo."
      relatedQuestionRefs: [QI011, QI012, QI026]
      relatedTableRefs: [TI003, TI004]
    - type: private-evidence-only
      severity: material
      topic: "unit-economics-gap"
      missingEvidence: "Gross-margin bridge, contribution margin, CAC, payback period, and total headcount by function."
      whyItMatters: "These are the core metrics needed to judge whether factory scale and service obligations create durable economics."
      diligencePath: "Request finance pack with unit economics, org chart, payroll roll-up, and sales-efficiency KPIs."
      relatedQuestionRefs: [QI019, QI020, QI021, QI027]
      relatedTableRefs: [TI003, TI005]
    - type: private-evidence-only
      severity: material
      topic: "backlog-quality-gap"
      missingEvidence: "Backlog by site, delivery schedule, cancellation rights, and conversion milestones for disclosed customer commitments."
      whyItMatters: "Deposit-bearing announcements can overstate true de-risking if cancellation or long-stop provisions are generous."
      diligencePath: "Request customer pipeline by site, signed backlog report, and contract redlines for material counterparties."
      relatedQuestionRefs: [QI022]
      relatedTableRefs: [TI002, TI005]
    - type: private-evidence-only
      severity: minor
      topic: "state-support"
      missingEvidence: "Radiant-specific grant amount, draw conditions, and clawback terms under Tennessee's Nuclear Energy Fund."
      whyItMatters: "State support can offset capex and working capital, but only if the subsidy value and restrictions are known."
      diligencePath: "Request award letter, incentive agreement, reimbursement mechanics, and job-creation covenants."
      relatedQuestionRefs: [QI014]
      relatedTableRefs: [TI004]
    - type: conflicting-data
      severity: material
      topic: "haleu-financing-risk"
      missingEvidence: "A reconciled fuel-supply plan covering DOE allocations, commercial enrichment contracts, and security or handling assumptions."
      whyItMatters: "Fuel availability and security treatment can change both schedule and cost, especially for a factory-fueled reactor model."
      diligencePath: "Request executed HALEU and enrichment agreements, contingency supply plan, and security-cost assumptions."
      relatedQuestionRefs: [QI018, QI023]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: "service-cost-stack"
      missingEvidence: "Working-capital policy for factory fueling, inventory, return logistics, used-fuel handling, and long-term monitoring obligations."
      whyItMatters: "The product model may require far more balance-sheet support than a simple one-time equipment sale."
      diligencePath: "Request inventory policy, transport-liability allocation, service P&L assumptions, and return-refueling operating model."
      relatedQuestionRefs: [QI004, QI027]
      relatedTableRefs: [TI003, TI005]
