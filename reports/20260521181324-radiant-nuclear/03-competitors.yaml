  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: rating-consistency
    missingEvidence: A single up-to-date Radiant technical disclosure that reconciles 1.0 MWe versus 1.2 MWe references for Kaleidos.
    whyItMatters: Power rating is central to comparing Radiant against 5 MWe eVinci and 20-150 MWe adjacent reactors.
    diligencePath: Request the latest Kaleidos product datasheet or NRC-facing specification package with a clearly dated commercial unit rating.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: material
    topic: equinix-contract-detail
    missingEvidence: Site-level terms, milestone schedule, deposit size, and termination conditions for the Equinix preorder.
    whyItMatters: Without contract detail, the preorder is better as demand signal than as bankable backlog or deployment timing proof.
    diligencePath: Request the preorder term sheet or customer letter with site count, delivery windows, and milestone-linked obligations.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: capital-comparability
    missingEvidence: A normalized and current capital table across private peers such as Westinghouse eVinci, Last Energy, X-energy, and Kairos.
    whyItMatters: Radiant's relative capital depth affects licensing pace, customer acquisition, and factory financing, but private-company comparability is incomplete from public sources alone.
    diligencePath: Ask management or investors for latest cap table, cash balance, and project-level financing commitments for the main private peers.
    relatedQuestionRefs:
    - QP018
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: fuel-availability-gap
    missingEvidence: Contracted long-term HALEU or TRISO supply plans beyond early pilot allocations, subsidiary ambitions, or federal milestone announcements.
    whyItMatters: Fuel availability is a shared chokepoint across multiple direct and adjacent competitors and can flatten commercialization timing differences.
    diligencePath: Collect executed fuel supply agreements, vendor qualification milestones, and reactor-specific fueling timelines from Radiant and the closest peers.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP004
