- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Portable ~1 MWe niche
    - Westinghouse and defense-linked transportable programs can attack the same remote-power wedge
    - High
    - Benchmark actual site-prep burden, logistics cost, and deployment speed against eVinci and Project Pele-style systems
  - - Factory fueling and return-loop servicing
    - Factory / modular narratives are now common across Radiant, Westinghouse, Last Energy, NuScale, and Kairos
    - Medium
    - Validate which vendor actually controls fueling, transport, maintenance, and return logistics under contract
  - - Equinix preorder as customer validation
    - Equinix is multi-homing across several nuclear vendors and public terms are not site-specific
    - High
    - Request site list, delivery schedule, deposit size, termination rights, and milestone triggers
  - - DOME first-test position
    - Radiant shares first-cohort access with Westinghouse and broader DOE programs support many rivals
    - Medium-High
    - Track whether DOME testing creates licensing acceleration or only technical proof with no downstream exclusivity
  - - TRISO / HTGR lineage
    - Fuel and materials dependence is shared with X-energy, Project Pele, and other TRISO-linked programs
    - High
    - Request long-term commercial fuel strategy beyond near-term program support and subsidiary announcements
  - - Capital-efficient execution
    - Public or federally backed peers can outspend Radiant on licensing, siting, and customer acquisition
    - High
    - Compare cash runway, factory capex needs, and partner depth against public-company and DOE-backed peers
  - - Smallest-job fit
    - The niche could be too small if buyers prefer 5-150 MWe campus-scale projects or status-quo power solutions
    - Medium-High
    - Test how many real target sites genuinely need roughly 1 MWe and cannot solve the job with diesel, gas, or larger PPAs
  notes: Severity reflects competitive, channel, and evidence risk rather than pure reactor safety or engineering risk.
