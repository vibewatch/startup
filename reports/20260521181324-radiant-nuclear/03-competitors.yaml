  - CP028
  - CP029
- calloutType: insight
  title: Most “competitors” are really larger adjacent distributed-nuclear vendors
  body: NuScale, X-energy, Kairos, and Last Energy are highly relevant for investor benchmarking and buyer budget competition, but they mostly solve 20-150 MWe-plus campus or industrial jobs. Radiant only looks directly comparable when the buyer truly wants a portable microreactor rather than a bigger site-built power project.
