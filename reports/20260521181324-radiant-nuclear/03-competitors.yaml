- calloutType: strength
  title: Radiant is the cleanest fit for the 1 MWe portable job
  body: Among reviewed vendors, Radiant is the most explicit about truck-or-air delivery, no site excavation, next-day startup, and a factory refueling loop around an approximately 1 MWe package. That makes it unusually well matched to diesel replacement, remote resilience, and constrained-site backup power.
  claimRefs:
