company:
  name: Radiant Nuclear
chapter:
  number: 3
  title: Competitors
  summary: Radiant competes most directly with Westinghouse eVinci and defense-linked transportable microreactor programs, while Oklo and NANO overlap only partially on package size, coolant, or maturity. Last Energy, NuScale, X-energy, and Kairos bring deeper capital, licensing, or industrial-scale credibility, but they mostly compete for 20-150 MWe-plus campus or industrial loads rather than the portable 1 MWe diesel-replacement niche. Radiant's clearest advantages are transportability and factory servicing; its clearest weaknesses are capital depth, non-exclusive customer proof, and inconsistent public power-rating disclosure.
sections:
- id: competitive-set-and-segmentation
  title: Competitive set and segmentation
  body: "The right competitive frame for Radiant is narrower than “all SMRs.” Industry references reviewed here treat microreactors as the sub-20 MW edge of the SMR market, optimized for factory fabrication, siting flexibility, remote communities, off-grid industry, and data-center or microgrid use cases rather than utility-scale replacement. Within that broader family, Radiant’s disclosed package is unusually small and logistics-centric: official and regulatory materials center Kaleidos around a shipping-container-sized, approximately 1 MWe, diesel-replacement job.\n\nThat puts Westinghouse eVinci in the closest direct lane because it is also transportable, factory-assembled, and aimed at remote communities, mining, and data centers. BWXT’s Project Pele context matters because it validates military demand for transportable reactors and may shape defense procurement pathways even if it is not a broad commercial product. Oklo and NANO only partially overlap: Oklo has a 1-5 MWe defense pilot\
    \ and a much larger hyperscaler-oriented commercial narrative, while NANO has public-market visibility but remains earlier and broader in concept scope. By contrast, Last Energy, NuScale, X-energy, and Kairos are adjacent distributed-nuclear benchmarks: they bring financing, licensing, or industrial heat credibility, but their standard public offerings start at 20 MWe or well above that level.\n\nThe substitute set is also important. For the smallest jobs, the real incumbent is still diesel plus a microgrid or weak-grid connection, not another reactor vendor. For campus-scale loads, larger reactor PPAs, utility contracts, gas, or grid-extension strategies can solve the same reliability problem without requiring a buyer to accept a 1 MWe portable unit. Radiant therefore wins when the buyer job is mobility, low civil works, and long-duration off-grid resilience; it loses relevance as soon as the buyer wants industrial steam, very large campus loads, or the financing depth of a public or\
    \ utility-backed platform.\n      "
