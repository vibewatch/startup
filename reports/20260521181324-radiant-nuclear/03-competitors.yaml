      detail: Radiant shares the first DOME test cohort with Westinghouse rather than controlling the test bed alone.
      tone: negative
    - label: Public rating consistency
      value: Mixed
      detail: Fetched public sources alternate between roughly 1.0 MWe and 1.2 MWe for Kaleidos.
      tone: negative
    - label: Disclosed capital depth
      value: $225m venture funding
      detail: Meaningful for a private startup, but still below the capital and program depth visible around several public or federally backed peers.
      tone: negative
  notes: KPIs mix factual disclosures and evidence-backed competitive judgments; they are intended as diligence anchors, not as a numeric scorecard.
