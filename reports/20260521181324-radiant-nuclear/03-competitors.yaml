- id: moat-durability-and-open-questions
  title: Moat durability and open questions
  body: "Radiant’s moat is real but narrow. The strongest disclosed differentiation is not “nuclear” in general; it is the combination of approximately 1 MWe scale, transportability, factory fueling and servicing, low site burden, and explicit diesel-replacement positioning. None of the larger adjacent vendors matches that package as cleanly. But several parts of that moat are easier to copy than the marketing suggests. Westinghouse also markets transportability and factory assembly. Last Energy and NuScale both make project packaging and buyer financing part of their pitch. X-energy and Kairos show that TRISO-based and modular-fabrication narratives are not unique to Radiant either.\n\nThe more serious risks are commercial and channel-driven. Equinix is the best public proof of customer pull, yet the same buyer is simultaneously hedging across multiple nuclear developers. DOME is a meaningful milestone, but the first cohort is shared with Westinghouse rather than exclusive to Radiant. Government\
    \ programs also broaden the field instead of narrowing it: EIA’s 2026 overview names a long list of vendors advancing through DOE and defense pathways. In that environment, capital depth, permitting cadence, and partner ecosystem may matter as much as raw portability.\n\nThe final judgment is that Radiant probably owns one of the cleanest product definitions in the field, but not yet one of the most durable competitive positions. The portable 1 MWe niche is plausible and differentiated. What is still missing is clearer evidence on contract bindingness, customer rollout schedule, long-term fuel availability, and even the exact commercial power rating. Until those gaps close, Radiant should be treated as a promising but still evidence-constrained leader of a niche that larger and better-capitalized advanced-reactor vendors could crowd from above.\n      "
