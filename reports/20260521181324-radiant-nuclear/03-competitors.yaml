- calloutType: risk
  title: Customer proof is real but not exclusive
  body: Equinix is a meaningful validation signal, but its multi-vendor buying pattern shows that early adopters are hedging across several nuclear approaches. Radiant also shares the first DOME cohort with Westinghouse, so test-bed access and early customer interest do not amount to category control.
  claimRefs:
