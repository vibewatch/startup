summary:
  headline: >-
    Radiant Nuclear has become one of the most credible private microreactor developers on public milestone evidence,
    but the current >$1.8B valuation signal still looks premature relative to zero disclosed revenue, stacked fuel and
    licensing gates, and concentrated customer proof.
