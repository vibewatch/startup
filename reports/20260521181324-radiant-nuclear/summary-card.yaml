  topStrengths:
    - >-
      Unusually strong 2025-2026 milestone density: >$525M public funding floor, DOME access, DARK approval, Buckley
      selection, and Part 70 review acceptance
    - >-
      Kaleidos is differentiated around transportable ~1 MWe dry-cooled deployment for defense, data-center, and remote
      resilient-power use cases
    - Equinix deposits for 20 units provide the clearest commercial willingness-to-pay signal in the public record
    - >-
      Rita Baranwal's addition and broader 2025 leadership build-out materially improve regulatory and execution
      credibility
  topRisks:
    - HALEU and broader TRISO supply remain bridge markets rather than proven fleet-scale inputs
    - >-
      Radiant still needs to clear multiple separate gates: fueled DOME performance, site/NEPA work, and a separate
      reactor path beyond Part 70
    - >-
      Customer proof is concentrated in one named commercial buyer and one defense pathway, with no public pricing or
      contract-value disclosure
    - >-
      The >$1.8B mark is investor/media-reported and unsupported by public revenue, margin, burn, or governance
      disclosure
  unresolvedGaps:
    - Current revenue, ARR, gross margin, monthly burn, runway, and recognized-cash conversion remain undisclosed
    - Deposit terms, cancellation rights, pricing, and deployment schedules for Equinix and Buckley are not public
    - >-
      Public materials do not disclose full board composition, investor control rights, ownership, or liquidation
      preferences
    - Evidence of successful fueled testing, durable HALEU supply, and per-reactor unit economics is still missing
