      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Beam's BEAM-302 Is a Same-Indication, Same-Stage AATD Competitor
            body: >-
              The most acute competitive threat is not theoretical. Beam Therapeutics' BEAM-302 is a liver-targeting LNP
              base editor designed to correct the identical PiZ (E342K) SERPINA1 mutation that Tessera's TSRA-196
              targets, and it is already in a Phase 1/2 dose-exploration trial. Two well-funded companies are now racing
              for the same small orphan AATD population with one-time, non-viral, infusion-delivered therapies. If
              BEAM-302 generates positive proof-of-concept data first, Tessera loses its first-in-AATD narrative and
              TSRA-196 risks becoming a fast-follower in a market that may only support one or two products.
            calloutType: risk
            claimRefs:
              - CP005
              - CP008
              - CP034
          - type: callout
            title: Tome's Collapse Is the Cautionary Mirror for Tessera's Category
            body: >-
              Tome Biosciences launched in December 2023 with $213 million to build an integrase-based gene-writing
              platform conceptually adjacent to Tessera's—large-payload insertion without double-strand breaks—and laid
              off nearly all 131 employees within a year as "investor sentiment shifted dramatically across the gene
              editing space." Tessera survived the same sentiment shift only because it reached IND and Phase 1/2 with
              Regeneron capital before the window closed. The episode underscores that Tessera's true moat is not the
              platform's elegance but its clinical-stage progress and partner funding.
