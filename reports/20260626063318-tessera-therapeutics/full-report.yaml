  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Gene-Editing and Gene-Therapy Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Tessera does not compete in an empty field. Its Gene Writing platform sits inside the broader in vivo
              genetic-medicine landscape, where at least a dozen well-capitalized companies are pursuing the same end
              goal—durable, ideally one-time correction of a disease-causing gene—using overlapping but mechanistically
              distinct tools. The field divides into five competitive layers relevant to Tessera. First, direct in vivo
              gene-editing peers (Beam Therapeutics, Intellia Therapeutics, Prime Medicine, Editas Medicine, Metagenomi,
              Arbor Biotechnologies) develop programs that edit DNA inside the patient, several using the same
              liver-directed lipid-nanoparticle (LNP) delivery Tessera relies on. Second, the commercial incumbent
              CRISPR Therapeutics with Vertex, whose Casgevy is the first and only approved CRISPR-based medicine,
              defines the regulatory and payer template every later entrant must beat. Third, the most direct conceptual
              peers are "gene writing"/genome-integration companies—most notably the now-defunct Tome Biosciences—that,
              like Tessera, sought to insert whole genes without double-strand breaks. Fourth, the status-quo
              substitutes (chronic protein augmentation for AATD, hydroxyurea and transfusion for sickle cell) remain
              the real-world default that any one-time therapy must displace. Fifth, likely future entrants include
              large-pharma internal builds and epigenetic-editing players. The defining feature of this landscape in
              2026 is that multiple competitors are already in the clinic—and in the market—while Tessera's lead program
              has only just entered Phase 1/2, leaving it a clinical-stage laggard in a field where first-to-data and
              first-to-approval confer durable advantage.
