    title: TPRT Operating Workflow (Mechanism Steps)
    columns:
      - Step
      - Mechanism
      - Component Role
      - Output
      - Dependency
    rows:
      - - 1. RNA binding
        - Gene Writer protein binds the template RNA encoding the intended change
        - Template RNA carries the payload sequence
        - Gene Writer-template ribonucleoprotein complex
        - Template RNA design and stability
      - - 2. DNA binding
        - Complex recognizes and binds the specific genomic target site
        - Protein provides site recognition
        - Target-bound complex
        - Target-site specificity / recognition sequence
      - - 3. Single-strand nick
        - One DNA strand is nicked to expose a 3' primer (no double-strand break)
        - Protein nuclease/nickase activity
        - Primed single-strand site
        - Precise nicking; avoids DSB
      - - 4. Reverse transcription
        - Template RNA is reverse-transcribed into DNA at the locus
        - Protein reverse-transcriptase activity
        - New DNA sequence written at target
        - Reverse-transcription fidelity
      - - 5. Integration / resolution
        - Written sequence is incorporated and the site resolved
        - Cellular processing completes integration
        - Permanent on-target genomic change
        - Integration completeness and accuracy
    notes: >-
      Workflow reflects target-primed reverse transcription (TPRT) as described by Tessera and corroborated by
      peer-reviewed R2/LINE-1 retrotransposon literature.
