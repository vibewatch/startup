  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Definition
        blocks:
          - type: paragraph
            body: >-
              Tessera Therapeutics operates in in vivo genetic medicine—a field that uses engineered molecular tools
              delivered directly into a living patient to rewrite, silence, or insert DNA sequences at targeted genomic
              sites. This market is distinct from ex vivo gene therapy (where cells are removed, modified in a
              laboratory, and reinfused) and from conventional small-molecule or biologic drugs that act without
              altering the genome.

              The relevant market for Tessera spans three intersecting segments: (1) in vivo gene editing and gene
              therapy for monogenic liver and hematopoietic diseases, including AATD and SCD; (2) in vivo CAR-T and
              T-cell immunotherapy for oncology and autoimmune disease; and (3) the status-quo therapies these
              approaches displace—most importantly, chronic protein augmentation therapy for AATD (~$1.9 billion annual
              market globally) and existing SCD management including hydroxyurea, chronic transfusion programs, and
              recently approved ex vivo gene therapies (Casgevy, Lyfgenia).

              Excluded from the directly serviceable perimeter are: ex vivo CAR-T (YESCARTA, KYMRIAH, CARVYKTI,
              BREYANZI), gene silencing RNAi approaches for AATD (Arrowhead/Takeda's fazirsiran), viral vector gene
              therapies for other indications, and AAV-based in vivo gene delivery programs (Roche, AstraZeneca,
              REGENXBIO) not using TPRT-based genome writing. These are adjacencies and competitors, not the same market
              segment.

              Adjacencies that could become addressable as the platform scales include: liver-directed delivery for
              prevalent cardiometabolic diseases (shared overlap with Intellia and Beam), HSC-directed therapy for
              hemoglobinopathies beyond SCD, T-cell-directed delivery for solid tumors, and non-viral delivery for
              ophthalmologic or CNS targets. These are future options, not current SAM.

              The status-quo substitute in AATD is weekly intravenous AAT augmentation therapy—four FDA-approved protein
              replacement products (Prolastin-C, Aralast NP, Zemaira, Glassia) at an estimated annual direct cost of
              ~$200,000–$205,000 per patient. Augmentation therapy does not correct the underlying genetic defect,
              cannot reverse existing damage, and requires lifelong weekly infusions. A curative gene therapy priced as
              a one-time intervention would compete on total cost of care, quality of life, and cure vs. management
              framing.

              In SCD, the status-quo is hydroxyurea, chronic transfusion, and supportive care, supplemented since
              December 2023 by two ex vivo CRISPR/gene therapy approvals: Casgevy ($2.2M list price) and Lyfgenia ($3.1M
              list price). Tessera's in vivo SCD program, funded by the Gates Foundation with up to $50M and designed
              for global accessibility, would compete with both the existing chronic-management standard of care and ex
              vivo gene therapies—and is explicitly designed for contexts where ex vivo manufacturing infrastructure is
              unavailable or unaffordable.

              For in vivo CAR-T, no product has received FDA approval as of the run date. The status quo is conventional
              ex vivo CAR-T ($400K–$600K per treatment, weeks-long manufacturing, available only at specialized
              centers). The ARPA-H EMBODY program—which awarded Tessera up to $41.3M in October 2025—explicitly targets
              this gap: the goal is an adaptable, low-cost platform that moves cell engineering from the lab into the
              body to eliminate time, cost, and access barriers.
            claimRefs:
