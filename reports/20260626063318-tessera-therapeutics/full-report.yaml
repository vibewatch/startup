      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              **Growth drivers** across the in vivo genetic medicine space are both scientific and structural. The most
              immediate catalyst is the first in vivo CRISPR medicine approaching FDA approval: Intellia Therapeutics'
              lonvo-z succeeded in a Phase 3 trial for hereditary angioedema in April 2026, reducing swelling attacks by
              87% versus placebo. If approved in H1 2027, lonvo-z would become the first approved in vivo gene editing
              product—validating regulatory acceptance of the mechanism, creating prescriber and payer familiarity, and
              broadening the market infrastructure that benefits all in vivo approaches including Tessera's TPRT
              platform.

              Tessera's own clinical milestone is a second-order driver: TSRA-196 received IND clearance in January
              2026, marking the first ever in vivo TPRT-based genome editing therapy to enter the clinic—a mechanism
              milestone distinct from CRISPR that expands the in vivo editing toolbox and demonstrates that non-viral
              LNP delivery of gene-writing machinery is viable. FDA Fast Track and Orphan Drug designations confer
              expedited development pathways and market exclusivity incentives.

              Non-viral, re-dosable delivery is a structural differentiator and growth enabler. Ex vivo gene therapies
              (Casgevy, Lyfgenia) require irreversible stem cell conditioning and are one-time procedures; the
              chemotherapy conditioning creates infertility risk and limits eligibility. LNP- based in vivo delivery—if
              demonstrated to be re-dosable and accurate—would expand the addressable population, reduce the procedural
              complexity, and enable correction of patients not eligible for conditioning. ARPA-H's EMBODY rationale
              directly mirrors this logic for CAR-T: eliminating ex vivo manufacturing to lower cost, expand access, and
              reduce wait times.

              The global access thesis is a growth driver that goes beyond typical rare disease market sizing.
              Sub-Saharan Africa carries ~80% of the global SCD burden (515,000 new births annually, per WHO 2021 data).
              The Gates Foundation's explicit mandate for Tessera's SCD program is to develop an accessible treatment in
              low-resource settings—a mission that, if achieved, represents a market of tens of millions of patients
              that current $2M–$3M gene therapies cannot address. Whether this translates to commercial return (versus
              philanthropically-subsidized access) remains a diligence question.

              **Adoption constraints** are material and should not be minimized. The FDA regulatory climate for gene
              therapy has been volatile in 2026: REGENXBIO had a therapy rejected in February 2026 following safety
              concerns; Sarepta's Elevidys sales declined further as reimbursement coverage narrowed. The exit of FDA
              leaders Marty Makary and Vinay Prasad in early 2026 created a period of regulatory uncertainty before
              successor leadership was appointed. The cumulative effect is that clinical-stage gene therapy companies
              face heightened safety bar and evidentiary scrutiny, particularly for novel mechanisms like TPRT with no
              prior precedent. TSRA-196 and the in vivo SCD program face a "first of kind" regulatory path—both a
              competitive differentiation and a development risk.

              Payer economics for one-time gene therapies remain challenging. Casgevy's slow 2024 uptake (only $10M in
              revenue its first year) illustrates the gap between regulatory approval and commercial traction. Revenue
              recognition only occurs at infusion—months after patient initiation— and payer authorization processes,
              specialist center availability, and patient decision hesitancy create substantial friction. Approximately
              90% of US patients now have reimbursed access to Casgevy (as of early 2026), but this took 24 months
              post-approval to achieve. Similar dynamics will apply to any AATD gene therapy program.

              Manufacturing scale and LNP optimization are pre-competitive constraints. Tessera's non-viral LNP delivery
              platform requires organ-specific targeting at scale—a manufacturing challenge distinct from viral vector
              programs but with its own complexity. Viral vector capacity constraints have been a recurring bottleneck
              for the broader gene therapy field; LNP scalability is better established (building on mRNA vaccine
              infrastructure) but tissue-specific LNP targeting at clinical doses is not routine.

              Competition from other modalities is a structural constraint. CRISPR Therapeutics is advancing CTX460, its
              own AATD gene editing program using SyNTase editing, with an expected mid-2026 IND filing. Multiple
              RNAi/ASO approaches target AATD liver disease (fazirsiran/Arrowhead). Base editing (Beam Therapeutics) and
              prime editing programs for SCD are in development. In CAR-T, several companies are developing in vivo
              CAR-T (e.g., with LNP or virus-like particles), creating competition before Tessera's CAR-T program has
              entered the clinic. The narrow-moat risk in a multi-platform competitive field is real.

              Finally, intellectual property and delivery platform durability are adoption constraints that are
              difficult to assess from public sources. Tessera's proprietary LNP platform is described as enabling
              organ-specific delivery; whether this creates defensible IP versus the existing LNP patent landscape
              (dominated by Alnylam/Moderna/Arbutus) is a diligence question without publicly available resolution.
