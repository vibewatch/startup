  productSummary: |
    Tessera's core asset is the Gene Writing platform, which uses mobile genetic elements —
    naturally occurring biological systems that move and insert DNA — engineered for therapeutic
    precision. The platform supports RNA writing (type II-B), DNA writing (type II-C), and
    retron writing mechanisms, each able to make site-specific insertions of payloads >10 kb
    without double-strand DNA breaks, a key safety advantage over CRISPR-based approaches. In
    vivo delivery uses Tessera's proprietary LNP formulations. Lead program TSRA-196 corrects
    the SERPINA1 mutation underlying alpha-1 antitrypsin deficiency (AATD); Phase 1/2 clinical
    trial underway as of early 2026. A sickle cell disease (SCD) program is supported by the
    Gates Foundation ($50M, December 2024). An in vivo CAR-T program targeting solid tumors
    is funded under ARPA-H EMBODY ($41.3M).
