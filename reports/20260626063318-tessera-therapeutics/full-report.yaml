      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and Constrained Lenses'
        blocks:
          - type: paragraph
            body: >-
              Multiple analyst lenses converge on a global gene therapy market of approximately $10 billion in 2026,
              growing at a compound annual growth rate of 19–21%. Mordor Intelligence (updated February 2026) estimates
              $9.74B for 2025 and $10.04B for 2026, with a 20.86% CAGR through 2031 reaching $25.89B. Grand View
              Research estimates the market at $6.45B in 2024 with an 18.88% CAGR reaching $18.20B by 2030.
              MarketsAndMarkets places the 2024 base at $8.85B with 19.4% CAGR through 2032 ($36.55B), applying a
              broader basket that includes in vivo gene editing gains entering commercial scale. These estimates diverge
              because they differ on scope: some include CDMO service revenue and apply list prices, while others
              exclude in vivo editing. The Mordor figure ($10.04B, 2026) is used as the base-case TAM throughout this
              analysis, flagging the other ranges as the bounds.

              Tessera's serviceable addressable market is constrained to three disease areas with defined patient
              populations and specific market analogues:

              **AATD (lead program, IND cleared January 2026):** The Alpha-1 Foundation estimates ~100,000 US patients
              and ~100,000 European patients. Within the US population, the most severe homozygous PiZZ subtype eligible
              for TSRA-196 is estimated at roughly 60,000–70,000 individuals, though many remain undiagnosed. The annual
              augmentation therapy market—the existing standard of care—is estimated at approximately $1.9B globally,
              based on ~$200,000–$205,000 per patient per year at mid-2026 pricing for Prolastin-C and comparable
              products. A curative gene therapy for AATD at pricing analogous to SCD therapies ($2M–$3M one-time) would
              yield a potential US-only cumulative addressable revenue of $120–$210B over the eligible patient
              lifetime—but a more realistic SAM model accounts for treatment uptake rates, diagnosis rates (~10% of US
              AATD patients are diagnosed), and payer willingness-to-pay benchmarks suggesting a $1B–$3B potential
              market over the first decade of commercialization if successful.

              **SCD (in vivo program, pre-IND as of run date):** CDC estimates ~100,000 US patients, with the WHO
              documenting 7.74 million living with SCD globally as of 2021. Vertex estimates ~16,000 US patients are
              eligible for approved gene therapies (most severe forms). Casgevy generated $115.8M in 2025 revenues at
              $2.2M/patient list price, with ~64 patients infused. Vertex and CRISPR Therapeutics projected nearly a
              tripling in combined Casgevy/Journavx revenue for 2026 ($500M combined). Tessera's SCD program targets a
              different population vector—global accessibility (80% of SCD burden is in sub-Saharan Africa) and
              re-dosable in vivo delivery—rather than the existing US gene therapy access model. Sizing the global
              accessible market is speculative; the Gates Foundation's $50M investment is explicitly to develop a
              "globally accessible" treatment, not a direct US market play. A US-only SAM consistent with the
              Casgevy/Lyfgenia addressable population would be ~$30–50B over time at $2M–$3M per cure, but this is a
              ceiling figure that ignores payer compression, Medicaid barriers, and global access pricing.

              **In vivo CAR-T (ARPA-H program, pre-clinical as of run date):** The existing ex vivo CAR-T market was
              $5.82B globally in 2025, growing at 18.06% CAGR to an estimated $22.36B by 2033 (Grand View Research). In
              vivo CAR-T is pre-commercial and not sized as an independent market. The ARPA-H EMBODY program's
              rationale—eliminating the $100K+ per-dose manufacturing cost and multi-week wait—implies a cost-innovation
              market where volume/access expansion, not price premium, is the commercial thesis.

              No analyst has published a stand-alone SAM or SOM figure specific to Tessera. The SOM cannot be isolated
              from public data as the company has not disclosed commercial plans, launch timelines, pricing strategy, or
              milestone revenue targets. TSRA-196 is in Phase 1 (IND cleared January 2026); the SCD program is pre-IND;
              the CAR-T program is preclinical. A realistic SOM is contingent on Phase 1/2 clinical success, NDA filing,
              approval, and commercial launch—a timeline that cannot be compressed below 4–6 years from current status
              for AATD and longer for other programs.
