        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >-
              Tessera's executive team underwent its most significant transition in June 2022, when Michael Severino,
              M.D., joined as Chief Executive Officer and a CEO-Partner at Flagship Pioneering. Severino came from
              AbbVie, where he had been Vice Chairman and President, with oversight of R&D, business development, and
              corporate strategy. He succeeded Geoffrey von Maltzahn, Tessera's founding CEO, who transitioned to Board
              Chair. Von Maltzahn remains a General Partner at Flagship Pioneering and continues to hold the Board Chair
              role as of June 2026.

              Jacob Rubens co-founded Tessera as its first Chief Scientific Officer; he has since moved into the role of
              Origination Partner at Flagship Pioneering and co-founded Quotient Therapeutics, where he now serves as
              President. The senior leadership team as of June 2026 includes David Davidson (Chief Medical and
              Development Officer), Michael Holmes (Chief Scientific Officer), Hari Pujar (Chief Operating Officer),
              Becky Lillie (Chief Human Resources Officer), Cynthia Patton (General Counsel and Secretary), and Cecilia
              Cotta-Ramusino (SVP, Head of Platform). In December 2025, Howard Liang stepped down as President and CFO
              after five years, and Kathy Bergsteinsson was appointed CFO. Bergsteinsson brings more than 25 years of
              experience including 18 years at Morgan Stanley as Managing Director and Head of Healthcare Equity Capital
              Markets.

              The Board of Directors comprises Geoffrey von Maltzahn (Chair), Michael Severino (CEO director), Paul
              Biondi, Melissa Moore (also Chair of the Scientific Advisory Board), Derica Rice, Mary Rozenman, and
              Elliott Sigal. Noubar Afeyan is listed as part of the Founding Team but is no longer described in a
              governance role. The Scientific Advisory Board includes George Church, John Moran, Jonathan Weissman,
              Luigi Naldini, David Schaffer, Jef Boeke, Erik Sontheimer, Britt Adamson, and David A. Williams.
