  - id: FE001
    title: Gene Writing Product Architecture (Layered Stack)
    type: stack
    layout: standard
    summary: >-
      Layered architecture of the Gene Writing product, from the underlying retroelement biology up through the
      delivered therapeutic program, showing how each layer builds on the one below.
    data:
      layers:
        - label: Layer 1 — Retroelement Biology (R2 / LINE-1 TPRT)
          detail: 'Natural non-LTR retrotransposon mechanism: target-primed reverse transcription writes RNA into DNA'
        - label: Layer 2 — Engineered Gene Writer Protein + Template RNA
          detail: >-
            Programmable site recognition, single-strand nick, and reverse transcription of a payload (single base to
            whole gene)
        - label: Layer 3 — All-RNA Cargo
          detail: Gene Writer mRNA + template RNA enable non-viral, DSB-free editing
        - label: Layer 4 — LNP Delivery (Hepatic and Extra-Hepatic)
          detail: Lipid nanoparticles deliver cargo to liver, HSCs, and T cells; extra-hepatic targeting is proprietary
        - label: Layer 5 — Disease Program / Therapeutic
          detail: TSRA-196 (AATD, clinical); SCD and in vivo CAR-T (preclinical)
    approximationNotes: >-
      Stack is conceptual, reflecting Tessera's described platform and the retroelement TPRT mechanism. Layer 1 is
      independently validated in literature; Layers 4-5 (extra-hepatic delivery, programs) are largely preclinical
      except for the clinical AATD program.
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE011
  - id: FE002
    title: 'TPRT Operating Flow: Writing a Genetic Change In Vivo'
    type: flow
    layout: wide
    summary: >-
      Step-by-step operating flow of target-primed reverse transcription, from delivery of the all-RNA cargo to a
      permanent on-target genomic change.
    data:
      nodes:
        - id: lnp
          label: LNP-Delivered All-RNA Cargo
          description: Gene Writer mRNA + template RNA enter the target cell via lipid nanoparticle
        - id: complex
          label: Gene Writer + Template RNA Complex
          description: Protein translated from mRNA binds the template RNA encoding the change
        - id: dnabind
          label: Genomic Target Binding
          description: Complex recognizes and binds the specific DNA site
        - id: nick
          label: Single-Strand Nick
          description: One DNA strand is nicked to expose a 3' primer (no double-strand break)
        - id: rt
          label: Reverse Transcription
          description: Template RNA is reverse-transcribed into DNA at the locus
        - id: edit
          label: Permanent On-Target Change
          description: Payload (single base to whole gene) is written and integrated
      edges:
        - from: lnp
          to: complex
          label: Translation + RNA binding
        - from: complex
          to: dnabind
          label: Site recognition
        - from: dnabind
          to: nick
          label: Nickase activity
        - from: nick
          to: rt
          label: Primed synthesis
        - from: rt
          to: edit
          label: Integration / resolution
    approximationNotes: >-
      Flow depicts the TPRT mechanism as described by Tessera and corroborated by R2/LINE-1 retrotransposon literature.
      In-human kinetics and efficiency are not yet established.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE015
