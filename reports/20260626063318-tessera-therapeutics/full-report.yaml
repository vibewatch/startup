      - number: '4.4'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              As a platform gene-writing company moving from discovery into the clinic, Tessera's cost base is dominated
              by research and development: scientific headcount, laboratory operations, preclinical studies in non-human
              primates, lipid-nanoparticle (LNP) process development, GMP manufacturing for clinical supply, and
              IND-enabling toxicology. Gross margin is not a meaningful current metric because there is no product
              revenue; the relevant capital-intensity question is how much cash the platform consumes per program
              advanced toward and through IND. Gene-writing and in vivo editing programs are capital-intensive:
              manufacturing non-viral LNP-formulated editors at clinical scale, running primate studies, and funding
              first-in-human trials each require substantial spend before any revenue. The January 2026 restructuring
              concentrated resources on the Regeneron-funded AATD program, implying de-prioritization or slower
              advancement of the SCD and in vivo CAR-T programs to control burn. Working-capital and capex detail (lab
              buildout, manufacturing commitments, facility leases in the Lexington/Somerville area) is not publicly
              disclosed. The cost structure is therefore best characterized qualitatively—R&D-heavy,
              manufacturing-intensive, and front-loaded— with specific gross-margin, capex, and unit-cost figures
              unavailable from public sources and flagged as diligence items.
