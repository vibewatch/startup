      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Payer Economics Are the Binding Constraint, Not Science
            body: >-
              Casgevy illustrates that FDA approval of a breakthrough gene therapy does not translate immediately to
              commercial traction. The $2.2M-per-patient price, a 2-year payer authorization cycle, and Medicaid
              reimbursement barriers resulted in only $10M of revenue in 2024 despite approval in December 2023. Any
              AATD gene therapy program—including TSRA-196—faces the same payer friction, compounded by the fact that
              AATD affects a predominantly commercially insured patient population (unlike SCD's Medicaid-heavy
              demographic). Outcomes-based contracts and evidence generation post-approval will be necessary before
              volume can scale.
            calloutType: risk
            claimRefs:
              - CM017
              - CM018
              - CM027
              - CM028
          - type: callout
            title: Global Access as a Differentiated Market Vector
            body: >-
              Tessera's in vivo, non-viral LNP approach for SCD is designed for global access—not just the 16,000
              US-eligible patients served by Casgevy. The WHO estimates 7.74 million people worldwide live with SCD,
              with 80% in sub-Saharan Africa. None are candidates for $2.2M–$3.1M ex vivo gene therapies. If Tessera's
              in vivo SCD program achieves clinical proof of concept in low- resource settings—the Gates Foundation's
              mandate—the addressable population expands by orders of magnitude, but the pricing model would need to be
              entirely different from the US premium therapy model. This is both the program's most compelling
              opportunity and its most significant commercial uncertainty.
