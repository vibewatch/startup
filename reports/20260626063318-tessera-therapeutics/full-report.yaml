          description: '>90% of AATD cases undiagnosed; large latent SCD population in LMICs — diagnosis is itself a market lever'
        - id: diagnosis
          label: Diagnosis & Genotyping
          description: Genetic confirmation (Pi*ZZ for AATD; HbSS for SCD) identifies the addressable, treatable subset
        - id: eligibility
          label: Eligibility & Payer Coverage
          description: >-
            Commercial/Medicaid/Medicare or national system determines reimbursement for a multi-million-dollar one-time
            therapy
        - id: partner
          label: Partner-Led Commercialization
          description: Regeneron leads global development/commercialization of TSRA-196; Tessera leads first-in-human
        - id: treatment
          label: In Vivo Administration
          description: LNP-delivered gene writer aims to avoid apheresis and busulfan conditioning required by ex vivo therapies
        - id: outcome
          label: Durable Correction (Outcome)
          description: One-time correction intended to be lifelong; real-world durability determines effective 'retention'
        - id: funders
          label: Institutional Funder Loop
          description: Regeneron, Gates, ARPA-H fund and validate the platform, enabling progression toward the patient market
    approximationNotes: >-
      The journey is forward-looking: no patient has been treated commercially. The funder loop is the only segment with
      realized 'customers' today; all downstream patient/payer stages are prospective.
    claimRefs:
      - CU001
      - CU007
      - CU016
  - id: FU002
    title: 'Validation-to-Clinic Funnel: How Platform Data Converts into Funded Programs'
    type: funnel
    layout: standard
    summary: >-
      A funnel from broad platform optionality down to the single asset in the clinic, expressed as the count of
      programs/relationships at each stage of institutional commitment.
    data:
      items:
        - label: Platform-addressable indications (optionality)
          value: 20
        - label: Active named programs (AATD, SCD, in vivo CAR-T)
          value: 3
        - label: Funded co-development / grant commitments
          value: 3
        - label: Programs with IND clearance + designations
          value: 1
        - label: Programs in first-in-human (TSRA-196, leading)
          value: 1
    approximationNotes: >-
      The 'platform-addressable indications' figure (20) is an illustrative order-of-magnitude for a programmable
      platform, not a disclosed count; lower stages are disclosed, dated facts.
    claimRefs:
      - CU004
      - CU012
      - CU013
  - id: FU003
    title: 'Customer Proof Matrix: Evidence Quality by Partner'
    type: matrix
    layout: wide
    summary: >-
      Qualitative scoring of each named partner relationship across evidence-quality dimensions: commitment size,
      corroboration, program maturity, and commercial (revenue) proof.
    data:
      columns:
        - Commitment Size
        - Independent Corroboration
        - Program Maturity
        - Commercial / Revenue Proof
      rows:
        - label: Regeneron (TSRA-196)
          values:
            - High ($150M + $125M)
            - Strong (multiple outlets)
            - Clinical (first-in-human)
            - None (pre-revenue)
        - label: Gates Foundation (SCD)
          values:
            - Medium (up to $50M)
            - Strong (multiple outlets)
            - Preclinical
            - None (mission funding)
        - label: ARPA-H (in vivo CAR-T)
          values:
            - Medium (up to $41.3M)
            - Limited (mainly company)
            - Early / preclinical
            - None (grant)
        - label: Future patient/payer market
          values:
            - Large (orphan one-time)
            - External epidemiology
            - Unlaunched
            - None yet
    approximationNotes: >-
      Cells are qualitative judgments derived from disclosed deal terms and independent reporting; no partner
      relationship yet provides commercial revenue proof.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU017
  - id: FU004
    title: Market-Access Pathway and Reimbursement Barriers
    type: flow
    layout: wide
    summary: >-
      The reimbursement and access pathway a one-time gene therapy must clear, annotated with the barriers that have
      slowed incumbent therapies such as Casgevy and the in vivo features that could ease them.
    data:
      nodes:
        - id: approval
          label: Regulatory Approval
          description: FDA/EMA approval of a one-time gene therapy following pivotal trials
        - id: pricing
          label: Pricing & Payer Negotiation
          description: Multi-million-dollar one-time price (Casgevy ~$2.2M) strains conventional actuarial models
        - id: cgt
          label: Outcomes-Based Access (CMS CGT Model)
          description: Pooled negotiation + outcomes-linked rebates aim to ease Medicaid access; new and complex
        - id: centers
          label: Authorized Treatment Centers
          description: Limited, geographically concentrated network; travel/time burden for high-need patients
        - id: logistics
          label: Treatment Logistics
          description: Ex vivo therapies require apheresis + busulfan conditioning; in vivo LNP aims to remove this
        - id: uptake
          label: Real-World Uptake / Throughput
          description: Casgevy ~165 US patients ~2 yrs post-approval — slow uptake despite functional cure
      edges:
        - from: approval
          to: pricing
          label: Triggers payer coverage decisions
        - from: pricing
          to: cgt
          label: Drives new payment models
        - from: cgt
          to: centers
          label: Coverage routes patients to centers
        - from: centers
          to: logistics
          label: Center-based administration
        - from: logistics
          to: uptake
          label: Burden throttles throughput
        - from: approval
          to: uptake
          label: In vivo delivery could raise throughput
    approximationNotes: >-
      The pathway and barriers are drawn from the Casgevy/Lyfgenia experience and CMS CGT Access Model design; they are
      the most relevant analog for Tessera's eventual commercialization, not Tessera outcomes.
    claimRefs:
      - CU019
      - CU022
      - CU023
      - CU024
  - id: FR001
    title: 'Risk Heatmap: Likelihood and Impact Across Major Risks'
    type: matrix
    layout: wide
    summary: >-
      Qualitative severity scoring of Tessera's principal risks across likelihood, impact, mitigation maturity, and
      residual exposure.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation Maturity
        - Residual Exposure
      rows:
        - label: TSRA-196 clinical failure
          values:
            - Medium-High
            - High
            - Low (no human data)
            - High
        - label: Platform/off-target safety
          values:
            - Medium
            - High
            - Medium (DSB-free design)
            - High
        - label: Regulatory clinical hold
          values:
            - Medium
            - High
            - Medium (guidance known)
            - Medium-High
        - label: IP / freedom-to-operate
          values:
            - Medium-High
            - Medium-High
            - Low (field unsettled)
            - Medium-High
        - label: Competitive leapfrog (Casgevy/Beam)
          values:
            - High
            - Medium-High
            - Low
            - High
        - label: Financial / runway pressure
          values:
            - High
            - High
            - Medium (partner capital)
            - Medium-High
        - label: Partner (Regeneron) concentration
          values:
            - Medium
            - High
            - Low
            - High
    approximationNotes: >-
      Cells are qualitative author judgments calibrated to cited precedent and disclosed facts, not quantified
      probabilities; residual exposure reflects undisclosed clinical, financial, and contract data.
    claimRefs:
      - CR001
      - CR011
      - CR026
  - id: FR002
    title: 'Risk Transmission Map: How a Lead-Asset Setback Propagates'
    type: dag
    layout: wide
    summary: >-
      How a single root event—an adverse TSRA-196 clinical or safety outcome—propagates through the partnership,
      financing, and platform-credibility of the company.
    data:
      nodes:
        - id: root
          label: TSRA-196 safety signal / efficacy miss
          description: Adverse first-in-human readout or FDA clinical hold on the lead program
        - id: partner
          label: Regeneron commitment at risk
          description: Partner may pause, renegotiate, or exit the collaboration
        - id: funding
          label: Non-dilutive funding contracts
          description: Loss of partner milestones increases reliance on dilutive capital
        - id: runway
          label: Runway compression
          description: Burn pressure intensifies; further restructuring becomes likely
        - id: platform
          label: Platform credibility impaired
          description: A first-in-human failure casts doubt on the entire Gene Writing modality
        - id: pipeline
          label: Pipeline de-risking stalls
          description: SCD and CAR-T programs lose validation read-through and partner appetite
        - id: value
          label: Enterprise value impairment
          description: Concentrated single-asset value declines sharply
      edges:
        - from: root
          to: partner
          label: Triggers partner reassessment
        - from: root
          to: platform
          label: Modality doubt
        - from: partner
          to: funding
          label: Milestone loss
        - from: funding
          to: runway
          label: Cash gap
        - from: platform
          to: pipeline
          label: Read-through to other programs
        - from: runway
          to: value
          label: Distress discount
        - from: pipeline
          to: value
          label: Optionality lost
    approximationNotes: >-
      The map is an illustrative causal chain, not a probabilistic model; the strength of each transmission depends on
      undisclosed contract and cash data.
    claimRefs:
      - CR001
      - CR016
      - CR026
  - id: FR003
    title: 'Dependency Map: External Dependencies and Failure Propagation'
    type: dag
    layout: wide
    summary: >-
      The key external dependencies on which Tessera relies and how a failure in each propagates to the lead program and
      enterprise value.
    data:
      nodes:
        - id: regeneron
          label: Regeneron (lead-asset partner)
          description: Funds TSRA-196 and leads global development/commercialization
        - id: funders
          label: Gates / ARPA-H (program funders)
          description: Milestone-gated non-dilutive capital for SCD and CAR-T
        - id: cdmo
          label: Contract manufacturers (CDMOs)
          description: GMP mRNA/template and LNP production (undisclosed)
        - id: ip
          label: IP / licensed technology
          description: Editing-enzyme, delivery, and chemistry freedom-to-operate
        - id: fda
          label: FDA (regulator)
          description: IND clearance, off-target expectations, clinical-hold authority
        - id: lead
          label: TSRA-196 program
          description: The asset on which most enterprise value depends
        - id: value
          label: Enterprise value
          description: Concentrated in a single partnered lead asset
      edges:
        - from: regeneron
          to: lead
          label: Funding + governance
        - from: funders
          to: value
          label: Program optionality
        - from: cdmo
          to: lead
          label: Clinical supply
        - from: ip
          to: lead
          label: Freedom-to-operate
        - from: fda
          to: lead
          label: Approval / hold authority
        - from: lead
          to: value
          label: Primary value driver
    approximationNotes: >-
      CDMO and license dependencies are inferred from the modality's requirements; specific counterparties and terms are
      not disclosed, so failure probabilities cannot be quantified.
    claimRefs:
      - CR016
      - CR021
      - CR031
  - id: FV001
    title: 'Recommendation Logic: From Evidence to Call'
    type: flow
    layout: wide
    summary: >-
      The reasoning chain from market scale, platform proof, risk, and valuation support to the track / research-more
      recommendation.
    data:
      nodes:
        - id: market
          label: Market & validation
          description: Orphan AATD/SCD markets + Regeneron, Gates, ARPA-H validation
        - id: proof
          label: Clinical proof
          description: No human efficacy/durability data; TSRA-196 only just in first-in-human
        - id: risk
          label: Risk profile
          description: Single-asset/partner concentration, layoffs, novel-modality regulatory bar
        - id: valuation
          label: Valuation support
          description: Stale 2022 $1.7B mark; opaque Regeneron equity; sector de-rated
        - id: synthesis
          label: Synthesis
          description: Strong optionality offset by absent proof and price opacity
        - id: call
          label: 'Recommendation: Track / Research-more'
          description: Re-engage on disclosed deal terms plus a clean TSRA-196 readout
      edges:
        - from: market
          to: synthesis
          label: Supports upside
        - from: proof
          to: synthesis
          label: Caps confidence
        - from: risk
          to: synthesis
          label: Raises required discount
        - from: valuation
          to: synthesis
          label: No price support at 2022 mark
        - from: synthesis
          to: call
          label: 'Net: track, do not buy yet'
    approximationNotes: The chain is a qualitative decision aid; node weights reflect author judgment, not a quantified model.
    claimRefs:
      - CV010
      - CV002
      - CV020
  - id: FV002
    title: 'Valuation Sensitivity: Implied Enterprise Value by Scenario'
    type: bar
    layout: wide
    summary: >-
      Approximate implied enterprise value (USD millions) for Tessera across downside-to-upside scenarios, illustrating
      sensitivity to clinical and financing outcomes.
    data:
      items:
        - label: Bear (setback / distressed)
          value: 600
        - label: Conservative base
          value: 1200
        - label: Base (flat to 2022)
          value: 1700
        - label: Bull (PoC + up round)
          value: 2800
        - label: Stretch (strategic premium)
          value: 4000
    approximationNotes: >-
      Values are illustrative scenario midpoints in USD millions, not a derived DCF; they bracket the comparable band
      and the 2022 mark and are conditioned on undisclosed deal and clinical data.
    claimRefs:
      - CV012
      - CV013
      - CV014
  - id: FV003
    title: Valuation / Return Range (USD billions)
    type: range
    layout: wide
    summary: Low-to-high enterprise-value and exit ranges for Tessera under explicit assumptions, in USD billions.
    data:
      items:
        - label: Implied current EV (Regeneron-anchored)
          low: 0.8
          high: 2.5
          mid: 1.6
        - label: 3-year exit — base case
          low: 1
          high: 3
          mid: 1.8
        - label: 3-year exit — bull case
          low: 3
          high: 6
          mid: 4
    approximationNotes: >-
      Ranges are scenario-conditional and exclude dilution/preference effects on common, which are unknown; they are
      framing bands, not point forecasts.
    claimRefs:
      - CV003
      - CV012
      - CV014
  - id: FV004
    title: 'Investment KPIs: IC-Ready Scorecard'
    type: kpi
    layout: wide
    summary: A qualitative IC scorecard across the dimensions that drive the recommendation, scored 0–10 where applicable.
    data:
      items:
        - label: Market opportunity
          value: 7 / 10
        - label: Clinical proof / validation
          value: 4 / 10
        - label: Moat / differentiation
          value: 6 / 10
        - label: Unit economics
          value: N/A (pre-revenue)
        - label: Risk profile (higher = safer)
          value: 3 / 10
        - label: Valuation support
          value: 4 / 10
        - label: Evidence quality
          value: 5 / 10
    approximationNotes: >-
      Scores are author judgments calibrated to the chapter evidence; they summarize, and do not replace, the underlying
      claims and diligence asks.
    claimRefs:
      - CV020
      - CV021
      - CV022
