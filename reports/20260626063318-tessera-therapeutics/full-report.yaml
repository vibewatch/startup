  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Gene Writing Platform and the TPRT Mechanism
        blocks:
          - type: paragraph
            body: >-
              Tessera's core product is the Gene Writing platform, a category of in vivo genome-modification tools the
              company built by mining nature's "mobile genetic elements"—sequences such as non-LTR retrotransposons that
              have evolved to copy and paste themselves into the genome. Rather than cut DNA and rely on the cell's
              repair machinery, as CRISPR-Cas9 nucleases do, Gene Writing rewrites sequence directly using target-primed
              reverse transcription (TPRT). In TPRT, a "Gene Writer" protein complexes with a template RNA that encodes
              the intended change; the complex binds a specific genomic site, nicks a single DNA strand to expose a 3'
              primer, and reverse-transcribes the RNA template into DNA at the target locus. Because only one strand is
              nicked, the process avoids the double-strand breaks that can cause translocations, large deletions, and
              genomic instability. The payload written can span the full spectrum of genetic change—single-base
              corrections, small insertions and deletions, or whole-gene insertions measured in kilobases— making the
              platform applicable to many monogenic diseases. Critically, the Gene Writer and its template can be
              supplied entirely as RNA, which means the therapeutic can be formulated in lipid nanoparticles and
              delivered non-virally, sidestepping the cargo-size limits and immunogenicity concerns of adeno-associated
              viral vectors. This mechanism is the foundation for every program in Tessera's pipeline and is the
              company's central technical differentiation.
            claimRefs: []
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE015
              - CE011
          - type: figure
            figureRef: FE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE015
      - number: '5.2'
        title: Writing Modalities and Pipeline Assets
        blocks:
          - type: paragraph
            body: >-
              Gene Writing is not a single enzyme but a platform spanning multiple molecular modalities, each tuned to a
              different editing task. Tessera describes RNA-templated writing systems that insert or correct sequence
              via TPRT, complemented by approaches that use the platform's protein-RNA machinery to write at defined
              sites; the unifying property is RNA-encoded, DSB-free, site-directed insertion. These modalities map onto
              three disclosed disease wedges. The lead asset, TSRA-196, targets alpha-1 antitrypsin deficiency (AATD) by
              correcting the SERPINA1 mutation in the liver to restore functional alpha-1 antitrypsin protein, and is
              partnered with Regeneron. A second program addresses sickle cell disease (SCD)—the most common lethal
              monogenic disease worldwide, caused by a beta-globin (HBB) mutation—through in vivo editing of
              hematopoietic stem cells (HSCs). A third applies the platform to in vivo CAR-T, inserting a chimeric
              antigen receptor directly into T cells inside the body to generate functional CAR-T cells without ex vivo
              manufacturing. Each program is a different "use" of the same writing-and-delivery platform: the AATD
              program is a precise correction in hepatocytes, the SCD program is an edit in a hard-to-reach stem-cell
              compartment, and the CAR-T program is a large-payload insertion in immune cells. The breadth of edit types
              and target tissues is the platform's strategic argument, but only TSRA-196 has reached the clinic, and the
              SCD and CAR-T programs remain preclinical.
            claimRefs: []
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE008
              - CE018
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE011
      - number: '5.3'
        title: Non-Viral LNP Delivery, Including Extra-Hepatic Targeting
        blocks:
          - type: paragraph
            body: >-
              Delivery is as important to Tessera's product as the editing chemistry itself, because an in vivo therapy
              is only useful if it reaches the right cells. Because Gene Writers are delivered as RNA, Tessera
              formulates them in lipid nanoparticles (LNPs)—the same broad delivery class used by mRNA vaccines—rather
              than viral vectors. Standard LNPs naturally traffic to the liver, which suits the AATD program where
              hepatocytes are the target. The harder problem, and a key part of Tessera's claimed differentiation, is
              extra-hepatic delivery: reaching cells outside the liver. The company reports a proprietary delivery
              platform that enables LNP delivery to hematopoietic stem cells for the SCD program and to T cells for the
              in vivo CAR-T program. Achieving HSC editing in vivo is especially significant because the conventional ex
              vivo path (as used by approved therapies such as Casgevy) requires mobilizing stem cells, collecting them,
              editing them in a laboratory, and reinfusing them after myeloablative conditioning—an arduous, costly, and
              toxic process. If LNP delivery can edit HSCs and T cells directly in the body, it removes cell collection,
              ex vivo manufacturing, and conditioning from the treatment workflow, which would simplify administration,
              lower cost, and widen access. Delivery efficiency, biodistribution, redosing, and the specific lipid
              formulations are core to the platform's value but are only partially disclosed publicly.
            claimRefs: []
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE006
              - CE007
              - CE012
              - CE021
          - type: figure
            figureRef: FE003
            claimRefs:
              - CE006
              - CE013
              - CE018
              - CE021
              - CE022
      - number: '5.4'
        title: Preclinical Validation and Independent Mechanism Evidence
        blocks:
          - type: paragraph
            body: >-
              Tessera's technology claims rest on two pillars of evidence: its own preclinical (animal) data and the
              independent peer-reviewed literature on the retrotransposon mechanisms it harnesses. On the company side,
              Tessera presented data at the American Society of Gene and Cell Therapy (ASGCT) meetings in 2025 and May
              2026 reporting that a single dose of its Gene Writer achieved editing in long-term hematopoietic stem
              cells in non-human primates at levels above those believed required for curative benefit in
              SCD—accomplished without stem-cell mobilization, myeloablative conditioning, or transplantation. In
              parallel, and for the first time across multiple NHP species, a single dose of Gene Writers in
              T-cell-targeted LNPs inserted a CAR into the genome and produced functional CAR-T cells in vivo with
              measurable B-cell depletion in blood and lymph nodes. For AATD, recently presented findings in mice and
              non-human primates showed high liver-editing specificity and no detected off-target or germline editing.
              The second pillar is external: peer-reviewed work characterizing human LINE-1 and R2 retrotransposon TPRT,
              and structure-guided engineering of an all-RNA R2 insertion system that achieves over 80% integration
              efficiency in several human cell lines, independently validates that retroelement-based, DSB-free,
              RNA-guided insertion is biochemically real and engineerable. This convergence of company and academic
              evidence strengthens the platform's plausibility, though none of it constitutes human clinical proof,
              which TSRA-196 has only just begun to generate.
            claimRefs: []
          - type: table
            tableRef: TE005
            claimRefs:
              - CE001
              - CE008
              - CE009
              - CE024
              - CE018
          - type: figure
            figureRef: FE004
            claimRefs:
              - CE004
              - CE007
              - CE012
              - CE017
              - CE021
      - number: '5.5'
        title: Intellectual Property, Know-How, and Differentiation
        blocks:
          - type: paragraph
            body: >-
              Tessera's differentiation is a bundle of mechanism, delivery, and intellectual property. The platform
              originated inside Flagship Pioneering, where co-founders including Jacob Rubens (Chief Innovation Officer)
              and Geoffrey von Maltzahn conceived Gene Writing by asking whether nature had evolved tools for writing
              rather than breaking DNA. That origin is reflected in granted patents such as US 12,031,129 B2 ("Methods
              and compositions for modulating a genome"), assigned to Tessera and Flagship and naming Rubens and von
              Maltzahn among the inventors, which claims RNA-mediated, DSB-free, site-directed genome modification
              spanning single-base edits to whole-gene insertions. The competitive moat rests on several pillars: a
              mechanism class distinct from CRISPR nucleases, base editors, and prime editors; the ability to write
              large payloads that point-edit technologies cannot; an all-RNA, non-viral delivery system including
              extra-hepatic LNPs; and accumulated manufacturing and formulation know-how. Differentiation is genuine but
              contested—academic groups (notably at the Broad/MIT) are independently engineering R2 and other integrase
              systems for site-specific insertion, so Tessera does not have the retroelement-editing field to itself,
              and the durability of its advantage depends on staying ahead on delivery, efficiency, specificity, and the
              breadth of its issued patent estate.
            claimRefs: []
      - number: '5.6'
        title: Safety, Off-Target Control, and Quality Considerations
        blocks:
          - type: paragraph
            body: >-
              The product's safety thesis is mechanistic: by nicking a single DNA strand instead of cutting both, Gene
              Writing aims to avoid the double-strand-break-associated risks—translocations, large deletions, and
              chromosomal rearrangements—that accompany nuclease editing, and by writing at defined sites it aims to
              control where new sequence lands. Tessera's preclinical disclosures emphasize high on-target specificity,
              no detected off-target editing in the AATD program, and no detected edits in germline tissues, which are
              the key safety signals regulators scrutinize for an in vivo, permanent genetic change. The regulatory
              system has engaged with the lead program: the FDA cleared the TSRA-196 IND and granted Fast Track and
              Orphan Drug designations, indicating the agency accepted the preclinical safety and CMC package sufficient
              to begin human dosing. Important safety and quality questions remain open and are inherent to a
              first-in-class in vivo platform: long-term integration-site safety, the completeness of off-target and
              insertional-mutagenesis assessment, immunogenicity of the RNA and LNP components, redosing, and the GMP
              manufacturing and analytical controls used for clinical supply. Because the therapy makes a permanent
              change, the durability and reversibility profile and the long-term follow-up plan are central to its risk
              assessment. Much of this detail—particularly CMC and the full off-target methodology—is not public and
              must be obtained through diligence.
            claimRefs: []
          - type: table
            tableRef: TE004
            claimRefs:
              - CE002
              - CE016
              - CE017
              - CE018
              - CE023
      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The Differentiator Is Large-Payload, DSB-Free, In Vivo Writing
            body: >-
              The crux of Tessera's technical case is that point-edit technologies (base and prime editing) and nuclease
              editors (CRISPR-Cas9) struggle to insert large sequences efficiently and without double-strand breaks.
              Gene Writing's TPRT mechanism is designed to write anything from a single base to a whole gene at a
              defined site without a DSB, and to do it in vivo with an all-RNA, LNP cargo. If the extra-hepatic delivery
              and efficiency demonstrated in non-human primates translate to humans, the platform could address
              diseases—and a manufacturing model—that ex vivo and viral approaches cannot serve well. The independent
              literature on R2/LINE-1 TPRT and engineered all-RNA insertion (over 80% efficiency in human cell lines)
              shows the underlying biology is real and engineerable, which materially de-risks the mechanism even though
              the company's specific systems remain proprietary.
            calloutType: insight
            claimRefs:
              - CE004
              - CE010
              - CE011
              - CE012
          - type: callout
            title: No Human Data Yet, and CMC / Off-Target Detail Is Undisclosed
            body: >-
              Every efficacy and safety result Tessera has disclosed is preclinical—mouse and non-human primate. The
              platform's central safety thesis (DSB-free, site-directed, no detected germline edits) is compelling
              mechanistically and corroborated in animals, but in vivo, permanent genome modification carries
              integration-site, insertional-mutagenesis, and immunogenicity risks that only human trials and long-term
              follow-up can resolve. Compounding the uncertainty, the full off-target assessment methodology, the
              GMP/CMC controls, the specific LNP formulations, and the lead program's detailed editing parameters are
              not public. The FDA's IND clearance and Fast Track/Orphan designations show the agency accepted the
              package to begin dosing, but clinical translation of a first-in-class writing platform remains the central
              technical risk.
            calloutType: risk
            claimRefs:
              - CE016
              - CE017
              - CE020
              - CE022
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation — Patient Populations and Payers
        blocks:
          - type: paragraph
            body: >-
              Because Tessera is pre-commercial, its ultimate customers are the patients who would receive its therapies
              and the payers who would reimburse them, not buyers transacting today. The lead program TSRA-196 targets
              alpha-1 antitrypsin deficiency (AATD), a monogenic disorder in which the SERPINA1 gene produces misfolded
              alpha-1 antitrypsin, causing progressive lung (emphysema/COPD) and liver disease. Clinically significant
              AATD (the Pi*ZZ genotype) affects roughly 1 in 3,000–5,000 people in the United States—on the order of
              70,000–100,000 individuals—and the company and partner cite an addressable population of approximately
              200,000 across the US and Europe. Critically, more than 90% of AATD cases are undiagnosed, so the served
              market is far smaller than the prevalent population, and diagnosis-rate expansion is itself a commercial
              lever. The second indication, sickle cell disease (SCD), is the target of the Gates-funded in vivo
              program; SCD affects about 100,000 Americans (over 90% Black or African American) and an estimated 7.7
              million people globally, with roughly 90% of cases in sub-Saharan Africa. A third, earlier-stage segment
              is in vivo CAR-T for oncology and immunology, funded by ARPA-H. On the payer side, the buyer is the US and
              EU reimbursement system—commercial insurers, Medicaid (which covers a large share of SCD patients),
              Medicare, and national health systems—plus global-health funders for low- and middle-income markets. Both
              AATD and SCD carry orphan-disease economics: small, identifiable populations, high per-patient value, and
              an expectation of premium one-time pricing.
            claimRefs: []
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU010
              - CU011
              - CU018
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU007
              - CU016
      - number: '6.2'
        title: Adoption Trajectory — Program Advancement as the Only Available Proxy
        blocks:
          - type: paragraph
            body: >-
              Tessera has no commercial adoption metrics—no units sold, accounts, locations, utilization, or active
              users—because it has no marketed product. The only supportable "adoption" signal is the advancement of its
              pipeline and the accumulation of institutional commitments over time, which function as proxies for
              external validation. The trajectory is concrete: the company disclosed an IND clearance and Fast Track and
              Orphan Drug designations for TSRA-196 in AATD, signed a $150 million collaboration with Regeneron in
              December 2025, secured up to $50 million from the Gates Foundation for SCD in December 2024, and won up to
              $41.3 million from ARPA-H for in vivo CAR-T in 2025. Each of these is a discrete, dated, externally
              verifiable event. What is missing is any denominator that would convert these into a conventional adoption
              curve: there are no patients dosed commercially, no treatment centers contracted, and no recurring
              purchases. The first meaningful clinical adoption proxy will be enrollment and dosing in the TSRA-196
              first-in-human study, which Tessera leads under the Regeneron collaboration. Until then, adoption must be
              read as partner and regulatory uptake rather than market uptake, and any customer-count, deployment, or
              utilization figure is unavailable and should be treated as a diligence gap rather than estimated.
            claimRefs: []
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
          - type: figure
            figureRef: FU002
            claimRefs:
              - CU004
              - CU012
              - CU013
      - number: '6.3'
        title: Named Customer Proof — Institutional Partners and Funders
        blocks:
          - type: paragraph
            body: >-
              The only entities that today resemble named, paying customers are the institutions that fund and
              co-develop Tessera's programs, and their commitments are the strongest available customer proof. Regeneron
              is the flagship "customer": in December 2025 it agreed to a $150 million upfront (cash plus equity)
              collaboration on TSRA-196, with up to $125 million in milestones and a 50/50 split of worldwide
              development costs and profits—Tessera leads the first-in-human trial while Regeneron leads later global
              development and commercialization. The Gates Foundation committed up to $50 million in December 2024 to
              advance an in vivo SCD program designed for global access, explicitly to make a one-time curative
              treatment feasible in low- and middle-income countries. ARPA-H awarded up to $41.3 million in 2025 under
              its EMBODY program for in vivo CAR-T. These three relationships are "production" only in the sense of
              being binding, funded co-development agreements with sophisticated counterparties; none represents a
              deployed, revenue-generating product, and each is contingent on technical and clinical milestones. The
              reference quality is high—each is a named, dated, press-released commitment corroborated by independent
              reporting—but the evidence proves validation and funding, not commercial traction. No third-party
              "customer reviews," procurement records, or case studies exist for a pre-clinical platform, so named proof
              begins and ends with these partners.
            claimRefs: []
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU014
          - type: figure
            figureRef: FU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU017
      - number: '6.4'
        title: Market Access, Retention, and Reimbursement Risk
        blocks:
          - type: paragraph
            body: >-
              Customer retention and durability cannot be measured for an unlaunched product, so the relevant question
              is whether the future market will adopt and stay on a one-time gene therapy, and the incumbent precedent
              is cautionary. Vertex and CRISPR Therapeutics' Casgevy, the first approved CRISPR therapy for SCD, is
              priced at roughly $2.2 million per patient and has seen markedly slow uptake: independent reporting
              indicates only around 165 US patients had been treated about two years after approval, far below
              projections. The barriers are structural and directly relevant to Tessera's eventual commercialization:
              payer hesitancy and immature reimbursement models for multi-million-dollar one-time therapies, a limited
              network of authorized treatment centers, and demanding ex vivo logistics (stem-cell collection plus
              busulfan conditioning) that deter eligible patients. CMS has responded with the Cell and Gene Therapy
              (CGT) Access Model, an outcomes-linked, pooled-negotiation framework intended to ease Medicaid access, but
              it is new and operationally complex. Tessera's in vivo, lipid-nanoparticle approach is explicitly
              positioned to remove the conditioning and apheresis burden that throttles Casgevy adoption, which—if
              clinically validated—could materially improve the retention and throughput profile. But the same payer and
              pricing headwinds would still apply, and the durability of a single-administration genetic correction
              (whether the effect persists for life) is itself an open clinical question that determines real-world
              "retention."
            claimRefs: []
          - type: table
            tableRef: TU004
            claimRefs:
              - CU015
              - CU019
              - CU020
              - CU021
          - type: figure
            figureRef: FU004
            claimRefs:
              - CU019
              - CU022
              - CU023
              - CU024
      - number: '6.5'
        title: Expansion Potential and Customer Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Tessera's customer base, measured by funded relationships, is dangerously concentrated. A single
              counterparty—Regeneron—accounts for the largest and most strategically important commitment, and the lead
              clinical asset (TSRA-196) is tied to that partnership; an exit or de-prioritization by Regeneron would
              remove the company's principal source of non-dilutive clinical funding and its most credible commercial
              path. The Gates Foundation and ARPA-H commitments diversify the funder base but target earlier-stage
              programs (SCD and in vivo CAR-T) that the January 2026 restructuring appears to have de-prioritized
              relative to the Regeneron-funded AATD effort, concentrating risk further on a single asset and partner.
              The offsetting expansion thesis is platform breadth: the gene-writing platform is, in principle,
              programmable across many monogenic and engineered-cell indications, so each validated program creates an
              option to land additional pharma partnerships (a land-and-expand motion executed through business
              development rather than a sales force). Realizing that expansion depends on positive TSRA-196 clinical
              data, which would de-risk the platform and attract new partner "customers." Until then, concentration is
              the dominant customer dynamic, and the key diligence asks are the term, exclusivity, and termination
              rights of the Regeneron agreement and the status of the Gates and ARPA-H programs after the restructuring.
            claimRefs:
              - CU030
              - CU031
          - type: table
            tableRef: TU005
            claimRefs:
              - CU018
              - CU030
              - CU031
              - CU032
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer Base Is Concentrated in a Single Partner and a Single Asset
            body: >-
              Tessera's only realized 'customers' are three institutional funders, and the relationship that matters
              most—Regeneron's $150 million collaboration—is tied to the single lead asset, TSRA-196. The Gates
              Foundation (SCD) and ARPA-H (in vivo CAR-T) commitments fund earlier-stage programs that the January 2026
              restructuring appears to have de-prioritized, narrowing the company's focus and concentrating value on one
              partner and one indication. An exit, renegotiation, or de-prioritization by Regeneron would remove the
              company's principal source of non-dilutive clinical funding and its clearest commercial path. Underwriters
              should treat the term, exclusivity, and termination rights of the Regeneron agreement, and the
              post-restructuring status of the Gates and ARPA-H programs, as gating diligence items.
            calloutType: risk
            claimRefs:
              - CU007
              - CU018
              - CU031
          - type: callout
            title: The Casgevy Precedent Is the Real Customer Test
            body: >-
              The most informative customer evidence is not Tessera's—it is the incumbent gene-therapy market. Casgevy,
              the first approved CRISPR therapy for SCD, priced near $2.2 million, reached only about 165 US patients
              roughly two years after approval, throttled by payer hesitancy, a thin network of authorized centers, and
              the burden of apheresis and busulfan conditioning. Tessera's in vivo, LNP-delivered approach is explicitly
              designed to remove the conditioning and cell-collection bottleneck that has slowed Casgevy, which—if
              clinically validated—could improve throughput and effective adoption. But the multi-million-dollar pricing
              and payer-model headwinds embodied in the CMS CGT Access Model would still apply, and the lifelong
              durability of a one-time correction remains unproven. The Casgevy experience is therefore the best
              available proxy for how Tessera's future market will actually behave.
            calloutType: insight
            claimRefs:
              - CU019
              - CU022
              - CU024
              - CU026
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Clinical Development Risk
        blocks:
          - type: paragraph
            body: >-
              Tessera's value rests almost entirely on assets that have not yet generated human efficacy data. The lead
              program, TSRA-196 for alpha-1 antitrypsin deficiency (AATD), only entered first-in-human testing in early
              2026, and the remaining pipeline (in vivo sickle cell disease and in vivo CAR-T) is preclinical. This
              places the company at the highest-attrition stage of drug development: the modality is novel, there is no
              precedent of an approved in vivo Gene Writing therapy, and the probability of technical success from
              first-in-human to approval for genetic medicines is low and heavily back-loaded. Specific clinical risks
              include whether a single in vivo administration can raise functional alpha-1 antitrypsin to clinically
              meaningful, durable levels; whether the effect persists for years (durability is unproven for any one-time
              genome-writing correction in humans); and whether the safety profile—particularly off-target editing,
              insertional events, immune responses to the gene writer or LNP, and liver toxicity given hepatic LNP
              tropism—will clear regulatory and clinical thresholds. Because Tessera leads the TSRA-196 first-in-human
              trial under the Regeneron collaboration, an early safety signal or efficacy miss would not only stall the
              lead asset but could also impair the partnership that funds it. The base rate is unforgiving: most
              first-in-human genetic-medicine programs do not reach approval, and the company has disclosed no interim
              human data that would de-risk the thesis. These risks are material, largely unmitigated by public
              evidence, and resolvable only as clinical readouts emerge.
            claimRefs: []
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR011
              - CR026
      - number: '7.2'
        title: Platform and Technology Risk
        blocks:
          - type: paragraph
            body: >-
              Gene Writing is a differentiated but immature platform, and several of its advantages are also its risks.
              The approach uses mobile genetic elements (engineered retrotransposon/retron-derived writers) delivered
              non-virally via lipid nanoparticles to insert or correct sequence without relying on double-strand breaks.
              If validated, this could avoid the genotoxicity associated with nuclease-based editing; if not, the
              platform carries its own uncharacterized risks—incomplete or imprecise writing, off-target integration,
              mosaicism, and variable editing efficiency across target cells and tissues. Delivery is a particular
              chokepoint: LNPs are efficient to the liver (favorable for AATD, a hepatic target) but extra-hepatic and
              hematopoietic-stem-cell targeting (required for the sickle cell program) is technically harder and
              proprietary, and any shortfall in delivery efficiency or specificity directly limits which indications the
              platform can address. The FDA's 2024–2026 genome-editing guidances explicitly call for sensitive,
              next-generation- sequencing-based detection of off-target events, chromosomal rearrangements, and large
              insertions/deletions; a novel writing mechanism may produce edit signatures that are harder to
              characterize, raising the bar for nonclinical safety packages. Platform risk is compounded by the fact
              that much of the supporting evidence is preclinical and, in places, company-disclosed rather than
              peer-reviewed, so independent validation of in vivo efficiency and precision at therapeutic scale remains
              limited. The platform's breadth is a strength, but until one program clears human proof-of-concept, the
              entire platform shares a single, correlated technical risk.
            claimRefs: []
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR008
              - CR021
              - CR022
          - type: figure
            figureRef: FR002
            claimRefs:
              - CR001
              - CR016
              - CR026
      - number: '7.3'
        title: Regulatory and Legal / IP Risk
        blocks:
          - type: paragraph
            body: >-
              Tessera operates in one of the most actively regulated and litigated areas of biomedicine. On the
              regulatory side, the FDA finalized guidance in January 2024 on human gene-therapy products incorporating
              genome editing and, in 2026, issued draft guidance recommending next-generation- sequencing-based safety
              assessment of off-target editing for both ex vivo and in vivo products. These raise the evidentiary bar
              for IND acceptance and give the agency clear grounds to impose a clinical hold if off-target
              characterization is judged inadequate—a direct, program-level risk for a first-in-human in vivo writer.
              The CAR-T precedent is instructive: in early 2024 the FDA required class-wide boxed warnings for secondary
              T-cell malignancies, showing how a post-hoc safety signal can reshape an entire modality's labeling and
              risk perception (the agency later removed REMS for CAR-T in 2025 as experience accumulated). On the
              legal/IP side, the foundational gene-editing patent estate is unsettled: in May 2025 the U.S. Court of
              Appeals for the Federal Circuit vacated the PTAB's 2022 decision awarding CRISPR-Cas9 priority to the
              Broad Institute and remanded the case, reopening the question of who owns key eukaryotic-editing patents
              and leaving a fragmented global landscape. While Tessera's writing mechanism is distinct from CRISPR
              nucleases, a pre-clinical platform still needs durable freedom-to-operate across delivery (LNP), enzymes,
              and editing chemistry, and broad uncertainty in the field raises licensing cost and litigation risk.
              Tessera's own patent estate and any third-party licenses it depends on are not fully public, making FTO a
              key diligence gap.
            claimRefs: []
          - type: table
            tableRef: TR001
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Tessera is a late entrant into indications where better-capitalized, clinically advanced rivals already
              lead. In sickle cell disease, Vertex and CRISPR Therapeutics' Casgevy is already approved and being
              administered, establishing the efficacy and safety bar Tessera's preclinical SCD program must eventually
              exceed, while also demonstrating—through its slow commercial uptake—how hard the market is to penetrate.
              In AATD, Tessera's lead indication, Beam Therapeutics is advancing BEAM-302, a base-editing approach to
              the same SERPINA1 target, and has reported clinical progress; a direct, head-to-head modality race in the
              company's flagship program raises the stakes on both timing and differentiation. Across the broader
              landscape, Intellia (in vivo CRISPR), Prime Medicine (prime editing), Editas, and Metagenomi are all
              pursuing in vivo or next-generation editing, and several are publicly traded with deeper balance sheets.
              Tessera's differentiation— large-payload, double-strand-break-free, non-viral writing—must translate into
              a clinical or commercial advantage (better precision, larger insertions, redosability, or safety) to
              matter; if competitors reach durable, safe corrections first, Tessera's later-stage assets could be
              commoditized or leapfrogged. Competitive risk is amplified by the company's narrower capital base and the
              fact that its closest conceptual peer, Tome Biosciences, wound down in 2024, underscoring that scientific
              novelty alone does not guarantee survival in this field.
            claimRefs: []
          - type: table
            tableRef: TR003
            claimRefs:
              - CR016
              - CR017
              - CR018
              - CR031
      - number: '7.5'
        title: Financial and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              The clearest company-specific risk signal is financial. Tessera has executed three consecutive years of
              workforce reductions—approximately 13% in 2024, 17% in 2025, and roughly 35% (about 90 employees) in
              January 2026—leaving around 160 employees. In a pre-revenue biotech, a multi-year layoff cadence indicates
              sustained burn pressure and a deliberate narrowing of scope around the partner-funded AATD program, with
              the earlier-stage SCD and CAR-T efforts apparently de-prioritized. Because the company is private, it
              discloses no cash balance, burn rate, or runway, so the severity of the financing constraint cannot be
              quantified externally; the Regeneron upfront ($150 million cash plus equity) materially extended runway,
              but its duration is unknown. Operationally, manufacturing and supply risk is real but undisclosed: in vivo
              genome-writing products require GMP production of mRNA/template payloads and clinical-grade LNPs, with
              tight quality, potency, and biodistribution controls; any manufacturing, comparability, or release failure
              could delay the first-in-human program. Key-person exposure is concentrated in CEO Michael Severino and
              Executive Chairman/co-founder Geoffrey von Maltzahn, and repeated restructurings heighten the risk of
              attrition of scarce gene-writing and delivery expertise. The cautionary peer base rate—Tome Biosciences
              laying off virtually its entire 131-person workforce in 2024 after failing to raise—shows how rapidly
              capital access can disappear for preclinical gene-editing companies when investor sentiment shifts.
            claimRefs: []
          - type: table
            tableRef: TR004
            claimRefs:
              - CR023
              - CR024
              - CR025
      - number: '7.6'
        title: Partner / Dependency Risk, Mitigations, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Tessera's most acute dependency is on Regeneron. The lead clinical asset, TSRA-196, is funded and partly
              governed by the December 2025 collaboration, under which Regeneron leads later global development and
              commercialization; an exit, renegotiation, or de-prioritization by Regeneron would remove the company's
              principal source of non-dilutive clinical funding and its clearest commercial path. Secondary dependencies
              include the Gates Foundation (SCD) and ARPA-H (in vivo CAR-T), whose milestone-gated commitments could
              lapse if those programs slip after the restructuring, and undisclosed reliance on contract manufacturers
              and licensed intellectual property. Against these risks sit genuine mitigations: substantial non-dilutive
              capital from a major pharma partner and two mission/government funders; orphan-disease economics and Fast
              Track plus Orphan Drug designations for TSRA-196 that can speed review; and an in vivo, LNP-based design
              intended to avoid the apheresis and busulfan-conditioning toxicities that throttle ex vivo therapies. The
              key monitoring indicators are TSRA-196 first-in-human safety and efficacy readouts, any FDA clinical- hold
              action, the continuation of the Regeneron and Gates/ARPA-H commitments, and further restructuring.
              Reasonable thesis-break triggers include a serious safety signal or clinical hold on TSRA-196, Regeneron's
              withdrawal, an additional layoff round or financing on distressed terms, or an adverse freedom-to-operate
              development. The principal diligence asks are the Regeneron contract terms (exclusivity, termination),
              cash/burn/runway, the patent/FTO position, and program-level status after the January 2026 cuts.
            claimRefs:
              - CR031
              - CR032
          - type: table
            tableRef: TR005
            claimRefs:
              - CR031
              - CR033
              - CR034
              - CR035
              - CR036
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR016
              - CR021
              - CR031
      - number: '7.7'
        title: Exhibits
        blocks:
          - type: callout
            title: 'The Peer Base Rate: Tome Biosciences Wound Down in 2024'
            body: >-
              The most sobering calibration for Tessera's risk profile is its closest conceptual peer. Tome Biosciences
              launched in late 2023 with $213 million and a 'programmable genomic integration' platform conceptually
              similar to Gene Writing—large, double-strand-break-free insertions—yet in 2024 it filed a WARN notice to
              lay off virtually its entire 131-person workforce after failing to raise new financing or find a buyer as
              investor appetite for preclinical gene editing cooled. The lesson is not that Tessera will share Tome's
              fate—Tessera has a major pharma partner, grant capital, and an asset in the clinic that Tome lacked—but
              that scientific novelty does not insulate a preclinical gene-writing company from a capital-markets shock.
              Tessera's own three-year layoff cadence shows the same pressure is present, making cash, runway, and the
              durability of the Regeneron partnership the decisive diligence questions.
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR030
          - type: callout
            title: Regulatory and IP Headwinds Are Class-Level, Not Just Company-Level
            body: >-
              Two of Tessera's largest risks are shared across the entire gene-editing field. First, the FDA's 2024–2026
              genome-editing guidances demand sensitive, NGS-based off-target characterization and give the agency a
              clear basis for clinical holds, and the CAR-T boxed-warning episode shows how a single post-hoc safety
              signal can re-rate an entire modality. Second, the May 2025 Federal Circuit remand of the CRISPR-Cas9
              priority dispute reopened ownership of foundational editing patents and left a fragmented global
              landscape, raising freedom-to-operate and licensing uncertainty for every developer. Tessera's distinct,
              non-CRISPR writing mechanism provides partial insulation, but it still depends on delivery and enzyme IP
              and must clear the same regulatory bar. Underwriters should treat these as systematic risks that move with
              the field, and weight company-specific mitigations (designations, partner capital, DSB-free design)
              accordingly.
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Last Known Valuation — the 2022 Series C Anchor
        blocks:
          - type: paragraph
            body: >-
              Tessera's only firm valuation datapoint is now more than four years old. In April 2022 the company closed
              a Series C of more than $300 million, led by GV (Google Ventures) with Casdin Capital and Leaps by Bayer,
              struck at an approximately $1.7 billion post-money valuation. That round brought cumulative funding above
              roughly $500 million and made Tessera one of the best-capitalized private genetic-medicine platforms of
              its cohort. Crucially, the mark was set at the peak of the 2021–2022 biotech financing bubble, before the
              multi-year correction that followed, so it should be treated as a high-water reference rather than a
              current fair value. No subsequent priced equity round has been publicly disclosed, which means there has
              been no independent price discovery on Tessera's equity in over four years—an unusually long gap for a
              clinical-stage biotech. As a private company Tessera also discloses no cap-table detail, so the
              liquidation-preference stack, anti-dilution terms, and any accrued dividends sitting ahead of common are
              unknown. For an underwriter, the practical implication is that the $1.7 billion figure is an anchor that
              almost certainly overstates today's value: the burden of proof is on showing the company is still worth
              that mark, not on justifying a discount to it.
            claimRefs: []
      - number: '8.2'
        title: Implied Current Valuation — Reading the Regeneron Deal
        blocks:
          - type: paragraph
            body: >-
              The most informative recent signal is the December 2025 Regeneron collaboration on TSRA-196 for AATD.
              Regeneron committed $150 million upfront—described as a combination of cash and an equity investment—plus
              up to $125 million in near- and mid-term milestones, with the two companies splitting worldwide
              development costs and profits 50/50. A strategic equity investment of this scale by a blue-chip pharma is
              a genuine validation event and a material runway extension. However, the split between cash and equity,
              the price per share, and any implied pre-money valuation were not disclosed, so the deal cannot be
              converted into a clean equity mark. What can be inferred is bounded: a $150 million upfront against a 2022
              post-money of $1.7 billion is consistent with a wide range of outcomes, from a modest minority equity
              stake at a flat-to-down valuation to a richer mark if most of the upfront is non-equity. The
              structure—Tessera leading the first-in-human trial while Regeneron leads later global development—also
              concentrates value in one partnered asset and one counterparty, which a buyer must weight against the
              validation. The honest conclusion is that the Regeneron deal supports a current enterprise value somewhere
              in a roughly $0.8–2.5 billion band, with the midpoint at or below the 2022 mark, and that the equity terms
              are the single most valuable missing input for tightening it.
            claimRefs: []
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV003
              - CV012
              - CV014
      - number: '8.3'
        title: Comparable Companies — A Wide, Sentiment-Driven Band
        blocks:
          - type: paragraph
            body: >-
              Because Tessera is pre-revenue, the most defensible external reference is the public gene-editing peer
              set, read as enterprise-value comparables rather than multiples. As of June 2026, CRISPR Therapeutics
              trades at roughly a $5.2 billion market capitalization—buoyed by Casgevy, the first approved CRISPR
              therapy—while Beam Therapeutics sits near $3.5 billion, Intellia near $2.5 billion, and Prime Medicine
              near $0.6 billion. The spread itself is the lesson: four broadly comparable editing platforms span an
              order of magnitude, driven almost entirely by clinical stage, cash position, and the market's       and
              the market's sentiment toward each modality. Every one of these peers is publicly traded, files audited
              10-Ks, and—except for the early-stage names—carries human clinical data that Tessera does not yet have, so
              a like-for-like read is impossible. Layered on top is a sector-wide de-rating: gene-editing equities have
              fallen well below their 2021 peaks as the funding winter persisted, and preclinical/early-clinical
              platforms have seen the sharpest multiple compression. Triangulating, Tessera's private fair value
              plausibly sits in the lower half of this public band—above Prime's sub-$1 billion mark given the Regeneron
              validation and platform breadth, but below the clinically-validated mid-caps—implying something in the
              rough vicinity of its 2022 level only if one credits the platform optionality the public market is
              currently discounting.
            claimRefs: []
          - type: table
            tableRef: TV004
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV020
              - CV021
              - CV022
      - number: '8.4'
        title: Scenario Analysis — Bull, Base, and Bear
        blocks:
          - type: paragraph
            body: >-
              Valuing a single-asset, platform-optionality story is best done with explicit scenarios rather than a
              point estimate. In the bull case, TSRA-196 delivers clean first-in-human safety and an early
              functional-AAT signal, Regeneron leans in, and a closed-but-thawing IPO/crossover window reopens for
              de-risked platforms; that path supports an up round and an enterprise value plausibly in the $2.5–4
              billion range, validating Gene Writing as a category. In the base case, the AATD program advances on
              partner funding without a decisive readout, the platform's other programs stay de-prioritized, and the
              company trades flat-to-down versus 2022 at roughly $1.2–2 billion, with survival underwritten by Regeneron
              and grant capital rather than by new equity. In the bear case, a clinical or safety setback on TSRA-196, a
              Regeneron pull-back, or simply runway exhaustion into a still-closed financing window forces a down round,
              a distressed recapitalization, or a wind-down echoing the Tome Biosciences precedent, with equity value
              compressing below $0.8 billion and common potentially impaired beneath the preference stack. The
              probability weighting tilts toward the base and bear cases given the layoffs and the funding environment,
              making entry discipline—price, structure, and downside protection—more important than upside sizing.
            claimRefs: []
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Valuation Concerns and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              Several adverse forces argue against paying the 2022 mark. First, the macro: private biotech funding fell
              to multi-year lows through 2025, megarounds dropped sharply, and many platforms now report under twelve
              months of runway, pushing the field toward down rounds, consolidation, and recapitalizations. Second,
              sector multiples have reset—benchmark valuation multiples for preclinical and early-clinical gene editing
              are materially below the boom years, so even a strong platform inherits a lower starting multiple. Third,
              company-specific stress: three years of layoffs culminating in roughly 35% in January 2026 is a textbook
              runway-pressure signal, and a pre-revenue private company offers no public price to mark against. Fourth,
              structural overhang: after a 2022 round and an undisclosed-terms strategic equity investment, the
              liquidation-preference and anti-dilution stack ahead of common is unknown and could meaningfully reduce
              common-equity value in a flat-or-down exit. Fifth, concentration: with value pooled in one partnered
              asset, a single clinical or partner event is a binary valuation trigger. The clearest downside triggers to
              monitor are a TSRA-196 safety signal or clinical hold, a Regeneron exit or renegotiation, an additional
              layoff round, a financing announced on distressed terms, and any further de-rating of the gene-editing
              comparable set. Each would move the valuation materially and asymmetrically to the downside.
            claimRefs: []
          - type: table
            tableRef: TV005
            claimRefs:
              - CV015
              - CV016
              - CV023
              - CV024
      - number: '8.6'
        title: Recommendation, Thesis/Anti-Thesis, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Our recommendation is TRACK / RESEARCH-MORE, not buy at the 2022 mark, with low-to-medium confidence and a
              high risk rating; the valuation stance is "do not anchor to $1.7B—underwrite to a $1.2–2 billion base with
              material downside." The thesis is real: a differentiated, double-strand- break-free, non-viral writing
              platform with large-payload potential, a lead asset in the clinic, a validating pharma partner, and
              orphan/Fast Track economics in AATD, all bought into a depressed sector where a single clinical
              proof-of-concept could re-rate the category. The anti-thesis is equally real: no human efficacy or
              durability data, a novel modality facing a higher regulatory bar, incumbents already approved (Casgevy) or
              directly competing (Beam's BEAM-302 in AATD), three years of layoffs, single-asset and single-partner
              concentration, an unknown preference stack, and a cautionary peer base rate in Tome. The call turns on
              price and information, not on company quality alone. The decisive diligence asks are: the Regeneron
              agreement terms (equity price, exclusivity, termination, change-of-control), the current cash balance,
              burn, and runway, the cap-table and liquidation-preference stack, the patent estate and freedom-to-operate
              position, and the first TSRA-196 human safety and biomarker data. Obtaining these converts an opaque
              private valuation into an underwritable one; absent them, the disciplined action is to track, set
              thesis-break triggers, and re-engage on a priced round or a clean clinical readout.
            claimRefs:
              - CV001
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV020
              - CV021
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV011
              - CV022
          - type: table
            tableRef: TV006
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV025
              - CV026
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV010
              - CV002
              - CV020
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The 2022 Mark Is an Anchor, Not a Fair Value
            body: >-
              The single most important framing for Tessera's valuation is that its $1.7 billion post-money was set in
              April 2022, at the top of the biotech bubble, and has not been re-priced in a public round since.
              Everything that has happened since—a multi-year funding winter, a sharp de-rating of the public
              gene-editing comparables, and three consecutive years of layoffs at Tessera itself—argues that today's
              fair value is at best flat and plausibly below that mark. The Regeneron deal is a genuine offset, but its
              undisclosed equity terms mean it validates the platform without establishing a price. An underwriter
              should therefore invert the usual burden of proof: rather than justifying a discount to $1.7 billion,
              require positive evidence (disclosed deal terms, runway, and first human data) before crediting anything
              near it.
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
              - CV009
          - type: callout
            title: Why the Recommendation Is Track, Not Buy
            body: >-
              Tessera is a high-conviction-platform, low-information-valuation situation, and that combination argues
              for patience. The thesis—differentiated writing chemistry, a partnered lead asset, orphan economics, and a
              depressed entry point—is attractive, but it is unsupported by any human efficacy data and clouded by an
              unknown liquidation-preference stack that could subordinate common equity in a flat or down exit. With
              value concentrated in one asset and one partner, the outcome is closer to binary than to a smooth
              distribution. The disciplined response is not to pass permanently but to track: define explicit
              thesis-break triggers (a TSRA-196 safety signal, a Regeneron exit, a distressed raise), obtain the deal
              and cap-table terms, and re-engage on a priced round or a clean clinical readout—paying for proof rather
              than for optionality at a stale mark.
            calloutType: risk
            claimRefs:
              - CV010
              - CV016
              - CV019
