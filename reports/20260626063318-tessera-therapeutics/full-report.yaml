      - number: '4.3'
        title: Revenue Model and Partnership Economics
        blocks:
          - type: paragraph
            body: >-
              Tessera is pre-commercial and has no product revenue, no approved products, and no recurring sales. Its
              near-term "revenue" is better understood as financing inflows: upfront partnership payments, contingent
              milestone payments, profit-share rights, and grant disbursements. The Regeneron collaboration is the
              centerpiece of the monetization model. Under its terms, Regeneron pays $150 million upfront (cash plus an
              equity stake) and up to $125 million in milestones, and the two companies split worldwide development
              costs and any future profits from TSRA-196 equally on a 50/50 basis. Tessera leads the first-in-human
              trial; Regeneron assumes responsibility for subsequent global development and commercialization. This
              structure converts Tessera's platform R&D into cash today and a contingent future profit stream, while
              transferring late-stage cost and commercial execution to a larger partner. The Gates Foundation commitment
              (up to $50 million) is milestone- and mission-linked rather than a market transaction, and ARPA-H funding
              (up to $41.3 million) is a government development award. Tessera has no disclosed sales cycle, customer
              acquisition cost, or channel economics in the conventional sense; the closest analog to a "sales motion"
              is its business-development capability to convert platform data into partnerships, which the Regeneron
              deal demonstrates. By comparison, Regeneron's other editing bets—Intellia and a 2024 Mammoth Biosciences
              deal ($100 million upfront, up to $370 million in milestones)—show the partner's appetite for in vivo
              editing and provide a benchmark for the Tessera terms.
