      - number: '4.5'
        title: Financial Risks and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is that Tessera has assembled an unusually deep private capital base for a
              pre-clinical-stage company but exhibits clear signs of capital discipline under pressure. The strengths
              are real: a marquee Regeneron partnership that de-risks the lead program's late-stage funding, blue-chip
              venture and strategic investors, and non-dilutive Gates and ARPA-H support. The concerns are equally
              concrete. Three consecutive years of layoffs culminating in a 35% reduction indicate that prior burn
              outpaced the company's comfort with its cash position and that management is consolidating around a single
              partner-funded asset. Revenue quality is entirely prospective—there is no product revenue, and the
              contingent milestone and profit-share economics depend on clinical success that is years away and
              uncertain. Capital intensity is high, and the cautionary precedent of gene-writing peer Tome
              Biosciences—which raised $213 million yet wound down in 2024 after laying off nearly its entire
              staff—underscores that capital alone does not guarantee survival in this field. The binding diligence
              blockers are the undisclosed cash balance, burn rate, runway, the equity terms and implied valuation of
              the Regeneron investment, and the cap table. Without those private disclosures, the company's true
              financing runway and the dilution embedded in recent capital cannot be underwritten with confidence.
            claimRefs: []
