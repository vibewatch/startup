      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Three Straight Years of Layoffs Signal Runway Pressure
            body: >-
              The single most important financial signal is not a balance-sheet line—because none is public—but
              Tessera's restructuring cadence. Independent reporting documents a 13% workforce cut in 2024, a 17% cut in
              2025, and a roughly 35% reduction (about 90 employees) in January 2026. A pre-revenue biotech that reduces
              headcount three years running is managing burn against a finite cash position, regardless of how the cuts
              are framed. That the January 2026 action followed the Regeneron deal by roughly a month suggests the
              partnership was the event that let management refocus spending around a single partner-funded asset
              (TSRA-196) while de-prioritizing the SCD and in vivo CAR-T programs. Underwriters should treat undisclosed
              cash, burn, and runway as the gating diligence items.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI019
          - type: callout
            title: Partnership Capital, Not Product Sales, Is the Business Model Today
            body: >-
              Tessera's near-term monetization runs through business development rather than a commercial sales force.
              The Regeneron collaboration—$150 million upfront plus up to $125 million in milestones and a 50/50 profit
              split—turns platform data into cash today and a contingent profit stream tomorrow, while shifting
              late-stage cost and commercial execution to a larger partner. This is a capital- efficient model for a
              pre-revenue platform, and Regeneron's parallel editing bets on Intellia and Mammoth show genuine strategic
              appetite for in vivo editing. But it concentrates Tessera's value on a single partnered asset and on
              Regeneron's continued commitment; an exit or de-prioritization by the partner would remove the company's
              principal source of non-dilutive runway.
            calloutType: insight
