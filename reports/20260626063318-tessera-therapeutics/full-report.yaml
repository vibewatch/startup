  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding History and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Tessera Therapeutics has financed itself entirely through private capital since its 2018 founding as a
              Flagship Pioneering company, and it remains privately held with no publicly traded equity. Its disclosed
              capital stack spans three categories: venture equity, partnership capital, and non-dilutive grants. On the
              equity side, Tessera raised more than $230 million in a Series B financing announced in January 2021 and
              more than $300 million in a Series C announced in March 2022 at a reported $1.7 billion valuation, with
              investors including GV (Google Ventures), Casdin Capital, and Leaps by Bayer. Layered on top is
              partnership capital: in December 2025 Regeneron Pharmaceuticals agreed to pay Tessera $150 million in
              upfront cash and equity, plus up to $125 million in near- and mid-term development milestones, to
              co-develop the lead AATD program TSRA-196. Non-dilutive funding includes up to $50 million committed by
              the Gates Foundation in 2024 for an in vivo sickle cell disease program and up to $41.3 million from
              ARPA-H for in vivo CAR-T work. Aggregating disclosed figures yields more than $770 million in potential
              capital, though milestone and grant tranches are contingent on technical and clinical progress and are not
              guaranteed cash. Because Tessera is private, it publishes no audited financial statements, and the precise
              cap-table ownership, preferred-stock terms, and the equity portion of the Regeneron investment are not
              public.
