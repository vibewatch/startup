companyProfile:
  summary: |
    Tessera Therapeutics is a Flagship Pioneering spinout founded in 2018 and publicly unveiled
    in 2020, developing Gene Writing — a platform using mobile genetic elements (transposons,
    retrotransposons) to make precise, large-payload (>10 kb) site-specific DNA insertions in
    vivo without double-strand breaks, delivered via lipid nanoparticles. The company raised
    a $230M+ Series B (January 2021) and a $300M Series C at $1.7B valuation (April 2022),
    led by GV (Google Ventures), Casdin Capital, and Leaps by Bayer. CEO Michael Severino
    M.D. (former AbbVie President/COO) joined in 2022; Geoffrey von Maltzahn (co-founder,
    former CEO) serves as Executive Chairman. Key 2025–2026 milestones: $41.3M ARPA-H EMBODY
    award (October 2025), $150M Regeneron investment for TSRA-196 in AATD (December 2025),
    FDA IND clearance for TSRA-196 (January 2026), FDA Fast Track and Orphan Drug designations
    (February 2026), and Phase 1/2 trial initiation (early 2026). In January 2026, Tessera
    reduced its workforce by ~35% (90 employees), retaining approximately 160 staff to focus
    resources on the Regeneron partnership and TSRA-196.
