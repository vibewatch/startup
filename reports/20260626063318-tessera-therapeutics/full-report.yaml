      - number: '4.2'
        title: Burn Rate, Runway, and Restructuring Signals
        blocks:
          - type: paragraph
            body: >-
              Tessera does not disclose cash on hand, monthly burn, or runway, so these must be estimated or obtained
              through diligence. The most informative public signal is the company's restructuring cadence: independent
              reporting documents three consecutive years of workforce reductions—a 13% cut in 2024, a 17% cut in 2025,
              and a reduction of roughly 35% (about 90 employees) announced in January 2026, with most affected staff in
              Massachusetts and separations scheduled to begin in March 2026. After the January 2026 action the company
              expects to retain approximately 160 employees. Management framed the cuts as preserving capacity to
              advance the Regeneron-funded AATD program into the clinic while maintaining core gene-writing efforts, but
              a multi-year sequence of layoffs in a pre-revenue biotech is a recognized signal of runway pressure and
              capital discipline. Clinical-stage gene-editing companies of comparable headcount typically burn on the
              order of $50–150 million per year, implying that Tessera's pre-2026 burn likely consumed a meaningful
              fraction of its raised capital and that the Regeneron upfront materially extended runway. The
              timing—layoffs announced roughly a month after the Regeneron deal—suggests the partnership was both a
              validation event and a trigger to refocus spending around a single partner-funded asset. Absent disclosed
              cash balances, the precise runway remains a diligence gap.
