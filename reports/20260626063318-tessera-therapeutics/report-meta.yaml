companyProfile:
  summary: |
    Tessera Therapeutics is a Flagship Pioneering spinout founded in 2018 and publicly unveiled
    in 2020, developing Gene Writing — a platform using mobile genetic elements (transposons,
    retrotransposons) to make precise, large-payload (>10 kb) site-specific DNA insertions in
    vivo without double-strand breaks, delivered via lipid nanoparticles. The company raised
    a $230M+ Series B (January 2021) and a $300M Series C at $1.7B valuation (April 2022),
    led by GV (Google Ventures), Casdin Capital, and Leaps by Bayer. CEO Michael Severino
    M.D. (former AbbVie President/COO) joined in 2022; Geoffrey von Maltzahn (co-founder,
    former CEO) serves as Executive Chairman. Key 2025–2026 milestones: $41.3M ARPA-H EMBODY
    award (October 2025), $150M Regeneron investment for TSRA-196 in AATD (December 2025),
    FDA IND clearance for TSRA-196 (January 2026), FDA Fast Track and Orphan Drug designations
    (February 2026), and Phase 1/2 trial initiation (early 2026). In January 2026, Tessera
    reduced its workforce by ~35% (90 employees), retaining approximately 160 staff to focus
    resources on the Regeneron partnership and TSRA-196.
  foundedDate: "2018-01-01"
  founders:
    - name: Geoffrey von Maltzahn
      role: "Co-founder, Executive Chairman"
      background: "PhD MIT biomedical engineering; Flagship Pioneering General Partner; serial biotech founder; brings deep Flagship network and gene therapy strategy"
      claimRefs: [CO004, CO011]
    - name: Jacob Rubens
      role: "Co-founder, Origination Partner (Flagship)"
      background: "PhD MIT microbiology; co-inventor of Gene Writing technology; former Chief Scientific Officer at Tessera"
      claimRefs: [CO004, CO012]
  foundingLocation: "Somerville, MA (Flagship Pioneering ecosystem)"
  headquarters: "Somerville, MA"
  productSummary: |
    Tessera's core asset is the Gene Writing platform, which uses mobile genetic elements —
    naturally occurring biological systems that move and insert DNA — engineered for therapeutic
    precision. The platform supports RNA writing (type II-B), DNA writing (type II-C), and
    retron writing mechanisms, each able to make site-specific insertions of payloads >10 kb
    without double-strand DNA breaks, a key safety advantage over CRISPR-based approaches. In
    vivo delivery uses Tessera's proprietary LNP formulations. Lead program TSRA-196 corrects
    the SERPINA1 mutation underlying alpha-1 antitrypsin deficiency (AATD); Phase 1/2 clinical
    trial underway as of early 2026. A sickle cell disease (SCD) program is supported by the
    Gates Foundation ($50M, December 2024). An in vivo CAR-T program targeting solid tumors
    is funded under ARPA-H EMBODY ($41.3M).
  customerFocus: "Patients with rare monogenic diseases (AATD ~100K US patients; SCD ~100K US patients); academic medical centers as trial sites; Regeneron as key commercial partner"
  businessModel: "Pre-commercial biotech: platform licensing (Regeneron deal), government grants (ARPA-H), and philanthropic funding (Gates Foundation); commercial revenue contingent on TSRA-196 regulatory approval (earliest 2028–2030)"
  stage: "Series C (private)"
  fundingStatus: "$300M Series C (Apr 2022, $1.7B valuation) led by GV, Casdin Capital, Leaps by Bayer; $150M Regeneron equity investment (Dec 2025); $50M Gates Foundation (Dec 2024, milestone-based); $41.3M ARPA-H award (Oct 2025); $60M+ cumulative Flagship investment"
