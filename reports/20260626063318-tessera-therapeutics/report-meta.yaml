summary:
  headline: |
    Tessera has achieved the pivotal transition from platform company to clinical-stage asset,
    with TSRA-196 entering a global Phase 1/2 trial in early 2026 under FDA Fast Track and
    Orphan Drug designations. The Regeneron collaboration ($150M + $125M milestones) provides
    non-dilutive validation and a credible path to commercialization. Gene Writing's large-payload,
    no-double-strand-break mechanism is technically differentiated from CRISPR but unproven in
    humans. The January 2026 workforce reduction signals financial discipline but also execution
    risk concentration. The 2022 $1.7B valuation may not fully reflect current biotech market
    conditions; investors should model a 2028–2030 data readout horizon. A Track / research-more
    position is warranted pending Phase 1 safety and efficacy data.
