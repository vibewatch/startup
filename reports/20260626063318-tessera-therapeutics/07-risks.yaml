callouts:
  - calloutType: risk
    title: "The Peer Base Rate: Tome Biosciences Wound Down in 2024"
    body: >-
      The most sobering calibration for Tessera's risk profile is its closest conceptual peer. Tome
      Biosciences launched in late 2023 with $213 million and a 'programmable genomic integration'
      platform conceptually similar to Gene Writing—large, double-strand-break-free insertions—yet in
      2024 it filed a WARN notice to lay off virtually its entire 131-person workforce after failing to
      raise new financing or find a buyer as investor appetite for preclinical gene editing cooled. The
      lesson is not that Tessera will share Tome's fate—Tessera has a major pharma partner, grant
      capital, and an asset in the clinic that Tome lacked—but that scientific novelty does not insulate
      a preclinical gene-writing company from a capital-markets shock. Tessera's own three-year layoff
      cadence shows the same pressure is present, making cash, runway, and the durability of the
      Regeneron partnership the decisive diligence questions.
    claimRefs:
      - CR026
      - CR027
      - CR030
  - calloutType: insight
    title: "Regulatory and IP Headwinds Are Class-Level, Not Just Company-Level"
    body: >-
      Two of Tessera's largest risks are shared across the entire gene-editing field. First, the FDA's
      2024–2026 genome-editing guidances demand sensitive, NGS-based off-target characterization and
      give the agency a clear basis for clinical holds, and the CAR-T boxed-warning episode shows how a
      single post-hoc safety signal can re-rate an entire modality. Second, the May 2025 Federal Circuit
      remand of the CRISPR-Cas9 priority dispute reopened ownership of foundational editing patents and
      left a fragmented global landscape, raising freedom-to-operate and licensing uncertainty for every
      developer. Tessera's distinct, non-CRISPR writing mechanism provides partial insulation, but it
      still depends on delivery and enzyme IP and must clear the same regulatory bar. Underwriters should
      treat these as systematic risks that move with the field, and weight company-specific mitigations
      (designations, partner capital, DSB-free design) accordingly.
    claimRefs:
      - CR011
      - CR012
      - CR014
      - CR015

