  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash burn and runway financial risk
      missingEvidence: >-
        Tessera discloses no cash on hand, burn rate, or runway, so the magnitude of its financing risk
        cannot be quantified despite three years of layoffs signaling pressure.
      whyItMatters: >-
        Runway determines whether the company can fund TSRA-196 through clinical readouts without
        distressed financing, the single largest determinant of downside risk.
      diligencePath: >-
        Request the latest balance sheet, trailing-12-month net cash burn, a 13-week cash forecast, the
        board-approved runway projection, and the financing plan with dilution scenarios.
      relatedQuestionRefs: [QR025]
      relatedTableRefs: [TR005]
    - type: private-evidence-only
      severity: material
      topic: Regeneron contract terms and partner dependency
      missingEvidence: >-
        The exclusivity, termination, and governance provisions of the Regeneron collaboration, and the
        milestone schedules of the Gates and ARPA-H commitments, are not public.
      whyItMatters: >-
        These terms determine how durable Tessera's most important dependency is and how easily its
        principal funder could exit, which drives concentration risk.
      diligencePath: >-
        Request the Regeneron collaboration agreement and the Gates/ARPA-H award terms, including
        exclusivity, termination rights, milestone schedules, and change-of-control provisions.
      relatedQuestionRefs: [QR026, QR029]
      relatedTableRefs: [TR003]
    - type: missing-source
      severity: material
      topic: freedom-to-operate and clinical-supply risk
      missingEvidence: >-
        Tessera's patent estate, any in-licensed delivery/enzyme IP, freedom-to-operate opinions, and the
        identity and qualifications of its contract manufacturers are not public.
      whyItMatters: >-
        FTO uncertainty in a litigated field and undisclosed CMC arrangements are material risks that
        could delay or block the lead program independent of clinical results.
      diligencePath: >-
        Request the patent schedule, FTO/legal opinions, license agreements, and CDMO contracts with
        quality and supply-continuity provisions.
      relatedQuestionRefs: [QR027, QR028]
      relatedTableRefs: [TR001, TR002]
    - type: stale
      severity: material
      topic: interim human off-target and durability data
      missingEvidence: >-
        No interim human off-target or durability data for TSRA-196 have been disclosed, leaving the
        platform's most important safety and efficacy questions unresolved.
      whyItMatters: >-
        Human off-target and durability results are the decisive de-risking evidence for the entire Gene
        Writing thesis; their absence keeps platform risk correlated across all programs.
      diligencePath: >-
        Request the TSRA-196 trial protocol, endpoints, off-target monitoring plan, and any available
        interim safety/biomarker data as readouts emerge.
      relatedQuestionRefs: [QR030]
      relatedTableRefs: [TR002]
