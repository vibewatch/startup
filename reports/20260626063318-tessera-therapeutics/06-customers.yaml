schemaVersion: "report-v2"
artifact: customers
slug: tessera-therapeutics
runDate: '2026-06-26'
company:
  name: Tessera Therapeutics
chapter:
  number: 6
  title: Customers
  summary: >-
    Tessera Therapeutics is a pre-commercial, clinical-stage gene-writing company with no product
    revenue and therefore no conventional paying customers. Its "customers" today fall into two
    distinct groups. The first is the future patient and payer market: alpha-1 antitrypsin deficiency
    (AATD), the indication for the lead program TSRA-196, affects roughly 100,000 people with severe
    (Pi*ZZ) disease in the United States and on the order of 200,000 across the US and Europe, while
    sickle cell disease (SCD), the target of the Gates-funded program, affects about 100,000 Americans
    and an estimated 7.7 million people globally. The second group is the set of institutional partners
    that fund and validate the platform today: Regeneron (a $150 million collaboration on TSRA-196),
    the Gates Foundation (up to $50 million for SCD), and ARPA-H (up to $41.3 million for in vivo
    CAR-T). These partners are the only "named, paying customers" with verifiable proof. Market access
    is the central commercial risk: approved one-time gene therapies such as Vertex/CRISPR Therapeutics'
    Casgevy, priced near $2.2 million, have seen strikingly slow uptake (only ~165 US patients two years
    post-approval) because of payer hesitancy, complex logistics, and access inequities. Tessera has no
    disclosed retention, deployment, or customer-count data because none yet exists, so customer-side
    underwriting rests on partner commitments, addressable-population sizing, and the cautionary
    precedent of incumbent gene therapies.
  contentRequirements:
  - Customer base segmentation by buyer/user/payer, geography, vertical, size, channel, use case, or revenue band.
  - Adoption trajectory (active usage, repeat purchase, deployment, accounts, locations, utilization) where supportable.
  - Named customer proof — production vs pilot, outcomes, reference quality, evidence freshness.
  - Retention/durability — NRR, GRR, churn, renewal, contract length, cohorts, satisfaction, or gaps.
  - Expansion and concentration — land-and-expand, top-customer risk, channel/partner dependence, procurement friction.
  plannedTables:
  - name: Customer segmentation table
    requirement: segment, buyer/user/payer, use case, scale, revenue/strategic value, gap.
  - name: Customer growth / adoption trajectory table
    requirement: metric, value, date, source, confidence, implication, missing denominator.
  - name: Named customer proof table
    requirement: customer, segment, deployment/use case, production vs pilot, outcome, limitation.
  - name: Retention / repeat usage / satisfaction table
    requirement: metric, value/null, segment, confidence, diligence ask.
  - name: Expansion and concentration risk table
    requirement: expansion driver, concentration risk, impact, diligence path.
  plannedFigures:
  - name: Customer journey map
    acceptedTypes: [journey-map]
    requirement: Customer segments, adoption surfaces, and expansion loops.
  - name: Adoption / deployment funnel
    acceptedTypes: [funnel, flow]
    requirement: Discovery-to-purchase-to-deployment-to-expansion path.
  - name: Customer proof matrix
    acceptedTypes: [matrix]
    requirement: Evidence quality, outcome specificity, retention visibility, or production maturity.
  - name: Retention / repeat cohort
    acceptedTypes: [cohort]
    requirement: Time-series retention only — columns are time buckets and cell values are retention percentages 0–100.
  evidenceStrategy:
  - Official customer evidence — customer pages, case studies, testimonials, partner stories, marketplaces; logos only when tied to use.
  - Independent evidence — procurement/tender records, reviews, marketplace ratings, public customer announcements, filings, analyst reports.
  - Adverse evidence — churn/complaints, failed deployments, procurement blockers, lawsuits, concentration warnings.
  - Customer-proof (sourceType customer-proof) is required — named case studies, customer-quoted press releases, conference talks by named users, government procurement records.
  - Separate broad customer-count claims from named deployments and retention proof.
  qualityBar:
  - Distinguish logos, named deployments, active use, outcomes, retention, and expansion.
  - Tie customer evidence to buyer/user/payer segments and revenue or strategic value.
  - Convert unsupported retention, customer count, satisfaction, or concentration claims into null plus exact diligence asks.
  - Include adverse searches for churn, complaints, blocked deployments, concentration, failed pilots.
  - Logos alone do not prove retention or production deployment.

sections:
  - id: patient-populations
    title: Customer Base Segmentation — Patient Populations and Payers
    body: >-
      Because Tessera is pre-commercial, its ultimate customers are the patients who would receive its
      therapies and the payers who would reimburse them, not buyers transacting today. The lead program
      TSRA-196 targets alpha-1 antitrypsin deficiency (AATD), a monogenic disorder in which the SERPINA1
      gene produces misfolded alpha-1 antitrypsin, causing progressive lung (emphysema/COPD) and liver
      disease. Clinically significant AATD (the Pi*ZZ genotype) affects roughly 1 in 3,000–5,000 people
      in the United States—on the order of 70,000–100,000 individuals—and the company and partner cite
      an addressable population of approximately 200,000 across the US and Europe. Critically, more than
      90% of AATD cases are undiagnosed, so the served market is far smaller than the prevalent
      population, and diagnosis-rate expansion is itself a commercial lever. The second indication,
      sickle cell disease (SCD), is the target of the Gates-funded in vivo program; SCD affects about
      100,000 Americans (over 90% Black or African American) and an estimated 7.7 million people
      globally, with roughly 90% of cases in sub-Saharan Africa. A third, earlier-stage segment is in
      vivo CAR-T for oncology and immunology, funded by ARPA-H. On the payer side, the buyer is the US
      and EU reimbursement system—commercial insurers, Medicaid (which covers a large share of SCD
      patients), Medicare, and national health systems—plus global-health funders for low- and
      middle-income markets. Both AATD and SCD carry orphan-disease economics: small, identifiable
      populations, high per-patient value, and an expectation of premium one-time pricing.
    tableRefs:
    - TU001
    figureRefs:
    - FU001
  - id: adoption-trajectory
    title: Adoption Trajectory — Program Advancement as the Only Available Proxy
    body: >-
      Tessera has no commercial adoption metrics—no units sold, accounts, locations, utilization, or
      active users—because it has no marketed product. The only supportable "adoption" signal is the
      advancement of its pipeline and the accumulation of institutional commitments over time, which
      function as proxies for external validation. The trajectory is concrete: the company disclosed an
      IND clearance and Fast Track and Orphan Drug designations for TSRA-196 in AATD, signed a $150
      million collaboration with Regeneron in December 2025, secured up to $50 million from the Gates
      Foundation for SCD in December 2024, and won up to $41.3 million from ARPA-H for in vivo CAR-T in
      2025. Each of these is a discrete, dated, externally verifiable event. What is missing is any
      denominator that would convert these into a conventional adoption curve: there are no patients
      dosed commercially, no treatment centers contracted, and no recurring purchases. The first
      meaningful clinical adoption proxy will be enrollment and dosing in the TSRA-196 first-in-human
      study, which Tessera leads under the Regeneron collaboration. Until then, adoption must be read as
      partner and regulatory uptake rather than market uptake, and any customer-count, deployment, or
      utilization figure is unavailable and should be treated as a diligence gap rather than estimated.
    tableRefs:
    - TU002
    figureRefs:
    - FU002
  - id: partnership-customers
    title: Named Customer Proof — Institutional Partners and Funders
    body: >-
      The only entities that today resemble named, paying customers are the institutions that fund and
      co-develop Tessera's programs, and their commitments are the strongest available customer proof.
      Regeneron is the flagship "customer": in December 2025 it agreed to a $150 million upfront
      (cash plus equity) collaboration on TSRA-196, with up to $125 million in milestones and a 50/50
      split of worldwide development costs and profits—Tessera leads the first-in-human trial while
      Regeneron leads later global development and commercialization. The Gates Foundation committed up
      to $50 million in December 2024 to advance an in vivo SCD program designed for global access,
      explicitly to make a one-time curative treatment feasible in low- and middle-income countries.
      ARPA-H awarded up to $41.3 million in 2025 under its EMBODY program for in vivo CAR-T. These three
      relationships are "production" only in the sense of being binding, funded co-development
      agreements with sophisticated counterparties; none represents a deployed, revenue-generating
      product, and each is contingent on technical and clinical milestones. The reference quality is
      high—each is a named, dated, press-released commitment corroborated by independent reporting—but
      the evidence proves validation and funding, not commercial traction. No third-party "customer
      reviews," procurement records, or case studies exist for a pre-clinical platform, so named proof
      begins and ends with these partners.
    tableRefs:
    - TU003
    figureRefs:
    - FU003
  - id: market-access
    title: Market Access, Retention, and Reimbursement Risk
    body: >-
      Customer retention and durability cannot be measured for an unlaunched product, so the relevant
      question is whether the future market will adopt and stay on a one-time gene therapy, and the
      incumbent precedent is cautionary. Vertex and CRISPR Therapeutics' Casgevy, the first approved
      CRISPR therapy for SCD, is priced at roughly $2.2 million per patient and has seen markedly slow
      uptake: independent reporting indicates only around 165 US patients had been treated about two
      years after approval, far below projections. The barriers are structural and directly relevant to
      Tessera's eventual commercialization: payer hesitancy and immature reimbursement models for
      multi-million-dollar one-time therapies, a limited network of authorized treatment centers, and
      demanding ex vivo logistics (stem-cell collection plus busulfan conditioning) that deter eligible
      patients. CMS has responded with the Cell and Gene Therapy (CGT) Access Model, an outcomes-linked,
      pooled-negotiation framework intended to ease Medicaid access, but it is new and operationally
      complex. Tessera's in vivo, lipid-nanoparticle approach is explicitly positioned to remove the
      conditioning and apheresis burden that throttles Casgevy adoption, which—if clinically
      validated—could materially improve the retention and throughput profile. But the same payer and
      pricing headwinds would still apply, and the durability of a single-administration genetic
      correction (whether the effect persists for life) is itself an open clinical question that
      determines real-world "retention."
    tableRefs:
    - TU004
    figureRefs:
    - FU004
  - id: concentration-expansion
    title: Expansion Potential and Customer Concentration Risk
    body: >-
      Tessera's customer base, measured by funded relationships, is dangerously concentrated. A single
      counterparty—Regeneron—accounts for the largest and most strategically important commitment, and
      the lead clinical asset (TSRA-196) is tied to that partnership; an exit or de-prioritization by
      Regeneron would remove the company's principal source of non-dilutive clinical funding and its
      most credible commercial path. The Gates Foundation and ARPA-H commitments diversify the funder
      base but target earlier-stage programs (SCD and in vivo CAR-T) that the January 2026 restructuring
      appears to have de-prioritized relative to the Regeneron-funded AATD effort, concentrating risk
      further on a single asset and partner. The offsetting expansion thesis is platform breadth: the
      gene-writing platform is, in principle, programmable across many monogenic and engineered-cell
      indications, so each validated program creates an option to land additional pharma partnerships
      (a land-and-expand motion executed through business development rather than a sales force).
      Realizing that expansion depends on positive TSRA-196 clinical data, which would de-risk the
      platform and attract new partner "customers." Until then, concentration is the dominant customer
      dynamic, and the key diligence asks are the term, exclusivity, and termination rights of the
      Regeneron agreement and the status of the Gates and ARPA-H programs after the restructuring.
    tableRefs:
    - TU005
    claimRefs:
    - CU030
    - CU031

