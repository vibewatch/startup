callouts:
  - calloutType: risk
    title: "Customer Base Is Concentrated in a Single Partner and a Single Asset"
    body: >-
      Tessera's only realized 'customers' are three institutional funders, and the relationship that
      matters most—Regeneron's $150 million collaboration—is tied to the single lead asset, TSRA-196.
      The Gates Foundation (SCD) and ARPA-H (in vivo CAR-T) commitments fund earlier-stage programs that
      the January 2026 restructuring appears to have de-prioritized, narrowing the company's focus and
      concentrating value on one partner and one indication. An exit, renegotiation, or de-prioritization
      by Regeneron would remove the company's principal source of non-dilutive clinical funding and its
      clearest commercial path. Underwriters should treat the term, exclusivity, and termination rights
      of the Regeneron agreement, and the post-restructuring status of the Gates and ARPA-H programs, as
      gating diligence items.
    claimRefs:
      - CU007
      - CU018
      - CU031
  - calloutType: insight
    title: "The Casgevy Precedent Is the Real Customer Test"
    body: >-
      The most informative customer evidence is not Tessera's—it is the incumbent gene-therapy market.
      Casgevy, the first approved CRISPR therapy for SCD, priced near $2.2 million, reached only about
      165 US patients roughly two years after approval, throttled by payer hesitancy, a thin network of
      authorized centers, and the burden of apheresis and busulfan conditioning. Tessera's in vivo,
      LNP-delivered approach is explicitly designed to remove the conditioning and cell-collection
      bottleneck that has slowed Casgevy, which—if clinically validated—could improve throughput and
      effective adoption. But the multi-million-dollar pricing and payer-model headwinds embodied in the
      CMS CGT Access Model would still apply, and the lifelong durability of a one-time correction
      remains unproven. The Casgevy experience is therefore the best available proxy for how Tessera's
      future market will actually behave.
