  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: therapy-durability
      missingEvidence: >-
        No human durability data exist for Tessera's one-time in vivo correction, and the persistence of
        the genetic correction over years has not been demonstrated. Durability determines the effective
        'retention' of a single-administration therapy.
      whyItMatters: >-
        If the correction is not durable, repeat dosing or alternative therapy would be needed, undercutting
        the one-time-cure value proposition and the premium pricing that orphan economics assume.
      diligencePath: >-
        Obtain preclinical durability/biodistribution packages and, when available, first-in-human follow-up
        data showing persistence of corrected protein levels over time.
      relatedQuestionRefs: [QU019]
      relatedTableRefs: [TU004]
    - type: enumeration-incomplete
      severity: minor
      topic: named customer / partner proof and addressable market
      missingEvidence: >-
        The named customer proof table lists only publicly announced partnerships; any undisclosed
        collaborations are not captured, and the treatable, willing-to-pay subset of the AATD and SCD
        populations is not disclosed, so the served market cannot be sized precisely.
      whyItMatters: >-
        Both the completeness of the partner roster and the true addressable patient subset materially
        affect revenue potential and the strategic value attributed to existing commitments.
      diligencePath: >-
        Request a full list of co-development and supply agreements and management's bottom-up addressable-
        and treatable-population model with diagnosis-rate assumptions.
      relatedQuestionRefs: [QU020]
      relatedTableRefs: [TU003, TU001]
    - type: private-evidence-only
      severity: material
      topic: partnership terms and program status
      missingEvidence: >-
        The term, exclusivity, and termination rights of the Regeneron collaboration, and the post-
        restructuring status and budgets of the Gates SCD and ARPA-H CAR-T programs after the January 2026
        layoffs, are not publicly disclosed.
      whyItMatters: >-
        These determine how durable Tessera's most important customer relationship is and whether the
        diversifying programs remain funded, which together drive customer-concentration risk.
      diligencePath: >-
        Request the Regeneron collaboration agreement (term, exclusivity, termination), and program-level
        budgets and milestone status for the Gates and ARPA-H programs before and after the restructuring.
      relatedQuestionRefs: [QU021, QU022]
      relatedTableRefs: [TU005]
