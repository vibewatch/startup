      How Tessera converts gene-writing platform R&D into near-term cash (upfront and grants) and a
      contingent future profit stream via partnership economics rather than product sales.
    data:
      nodes:
        - id: "platform"
          label: "Gene Writing Platform R&D"
          description: "TPRT-based in vivo editing programs (TSRA-196 AATD, SCD, in vivo CAR-T); preclinical and clinical-stage assets"
        - id: "bd"
          label: "Business Development / Partnering"
          description: "Converts platform data (e.g., primate efficacy) into partnerships; the de facto monetization engine for a pre-revenue platform"
        - id: "regeneron"
          label: "Regeneron Collaboration (TSRA-196)"
          description: "$150M upfront cash+equity; up to $125M milestones; 50/50 cost and profit split"
        - id: "grants"
