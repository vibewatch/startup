  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: cash-and-burn
      missingEvidence: >-
        Tessera has not disclosed cash on hand, monthly or annual cash burn, or a board-approved runway
        projection. As a private company it publishes no audited balance sheet or cash-flow statement,
        so the runway implied by its multi-year layoffs cannot be quantified externally.
      whyItMatters: >-
        Cash, burn, and runway are the core inputs to assessing financing need, dilution risk, and the
        company's ability to fund TSRA-196 through clinical readouts. Without them, capital adequacy
        cannot be underwritten.
      diligencePath: >-
        Request management accounts: latest unaudited balance sheet, trailing-12-month net cash burn,
        a 13-week cash forecast, and the board-approved runway projection.
      relatedQuestionRefs: [QI008, QI009]
      relatedTableRefs: [TI003, TI004]
    - type: private-evidence-only
      severity: material
      topic: valuation-and-dilution
      missingEvidence: >-
        The split between cash and equity in the Regeneron $150 million upfront, the equity price per
        share, the resulting implied post-money valuation, and the dilution to existing holders are not
        disclosed. The full cap table and preferred-stock terms are also private.
      whyItMatters: >-
        Without the equity terms, neither the current valuation nor the dilution embedded in the
        Regeneron investment can be determined, which is central to assessing the value of any stake.
      diligencePath: >-
        Request the Regeneron stock purchase agreement (equity amount, price, share count), the
        capitalization table, and the company charter with preferred-stock terms.
      relatedQuestionRefs: [QI020]
      relatedTableRefs: [TI005]
    - type: private-evidence-only
      severity: material
      topic: runway-pressure
      missingEvidence: >-
        While three consecutive years of layoffs strongly suggest burn outpaced the company's comfort
        with its cash position, the actual cash trajectory, the trigger thresholds for each
        restructuring, and the post-2026 program budgets are not public.
      whyItMatters: >-
        Distinguishing prudent capital discipline from genuine financial distress requires the cash and
        budget detail that confirms whether runway pressure was acute or precautionary.
      diligencePath: >-
        Request the financial rationale and board materials for each restructuring, program-level
        budgets before and after January 2026, and the financing plan with dilution scenarios.
      relatedQuestionRefs: [QI019]
      relatedTableRefs: [TI004]
