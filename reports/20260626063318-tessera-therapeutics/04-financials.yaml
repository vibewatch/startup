          to: "bd"
          label: "Generates partnerable preclinical/clinical data"
        - from: "bd"
          to: "regeneron"
          label: "Dec 2025 deal"
        - from: "bd"
          to: "grants"
          label: "Mission/government awards"
        - from: "regeneron"
          to: "cash"
          label: "$150M upfront"
        - from: "grants"
          to: "cash"
          label: "Milestone tranches"
        - from: "regeneron"
