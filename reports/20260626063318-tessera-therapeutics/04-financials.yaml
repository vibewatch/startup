artifact: financials
slug: tessera-therapeutics
runDate: '2026-06-26'
company:
  name: Tessera Therapeutics
chapter:
  number: 4
  title: Financials
  summary: >-
    Tessera Therapeutics is a privately held, pre-revenue clinical-stage biotech that funds itself
    through venture equity, milestone-based partnership capital, and non-dilutive grants rather than
    product sales. Disclosed capital exceeds $770 million since 2018: more than $230 million in
    Series B (2021), over $300 million in Series C at a $1.7 billion valuation (2022), a $150 million
    Regeneron upfront cash-and-equity investment with up to $125 million in milestones (December 2025),
    up to $50 million from the Gates Foundation (2024), and up to $41.3 million from ARPA-H. The
    company has no audited public financials, no product revenue, and has not disclosed cash on hand,
    monthly burn, or runway. The most material adverse signal is a three-year sequence of workforce
    reductions—13% in 2024, 17% in 2025, and roughly 35% (90 employees) in January 2026—indicating
    sustained cost pressure and a pivot to conserve runway around the Regeneron-funded AATD program.
    Underwriting is constrained by the absence of private financial disclosures; burn, runway, and the
    equity terms of the Regeneron investment must be obtained through diligence.
  contentRequirements:
  - Revenue streams, pricing model, revenue mix, and recognition issues where supportable.
  - GTM motion and sales efficiency proxies (cycle, CAC/payback or proxy, channel economics).
  - Cost structure, gross margin drivers, working capital, capex, and service-delivery costs.
  - Public traction (revenue, ARR, GMV, units, locations, utilization, active users) versus private-metric gaps.
  - Capital adequacy and financing dependency — cash on hand, burn, runway, planned use of funds, next-round trigger, and debt/project-finance obligations.
  - Financial verdict on revenue quality, margin path, capital intensity, and diligence blockers.
  plannedTables:
  - name: Revenue streams table
    requirement: stream, mechanism, unit, current value/status, quality, diligence ask.
  - name: Pricing / monetization table
    requirement: price/unit/contract, list vs realized pricing, discounts/unknowns, source.
  - name: Unit economics table
    requirement: metric, value/null, confidence, why it matters, diligence ask.
  - name: Capital adequacy table
    requirement: cash on hand, monthly burn, runway months, planned use of funds, next-round trigger, debt.
  - name: Public financial gaps table
    requirement: missing private metrics, impact, exact diligence path.
  plannedFigures:
  - name: Revenue model bridge
    acceptedTypes: [flow, waterfall]
    requirement: How customer activity converts into revenue and gross profit.
  - name: Unit economics bridge
    acceptedTypes: [flow]
    requirement: Cost inputs converting into a program/value unit.
  - name: Financial estimate range
    acceptedTypes: [range]
    requirement: Low/base/high estimates of one financial quantity with source-backed bounds.
  - name: Capital intensity / cash-flow map
    acceptedTypes: [flow, matrix, waterfall]
    requirement: Funding inflows and capital deployment over time.
  evidenceStrategy:
  - Partnership and financing terms from company and partner press releases and investor relations.
  - Public-company partner filings (Regeneron 10-K/10-Q/8-K) and SEC full-text search for indirect disclosure.
  - Layoff/restructuring coverage and WARN-notice reporting as runway-pressure signals.
  - Non-dilutive funding from Gates Foundation and ARPA-H program disclosures.
  - Adverse/disconfirming evidence from restructuring trackers and independent biotech press.
  qualityBar:
  - Separate disclosed facts (deal sizes, valuations) from estimates (burn, runway).
  - Preserve private-metric gaps explicitly; never fabricate cash or burn figures.
  - Treat milestone and grant tranches as contingent, not guaranteed cash.
  - Use partner SEC filings as the most reliable external check on deal economics.

sections:
  - id: funding-history
    title: Funding History and Capital Structure
    body: >-
      Tessera Therapeutics has financed itself entirely through private capital since its 2018 founding
      as a Flagship Pioneering company, and it remains privately held with no publicly traded equity.
      Its disclosed capital stack spans three categories: venture equity, partnership capital, and
      non-dilutive grants. On the equity side, Tessera raised more than $230 million in a Series B
      financing announced in January 2021 and more than $300 million in a Series C announced in March
      2022 at a reported $1.7 billion valuation, with investors including GV (Google Ventures), Casdin
      Capital, and Leaps by Bayer. Layered on top is partnership capital: in December 2025 Regeneron
      Pharmaceuticals agreed to pay Tessera $150 million in upfront cash and equity, plus up to $125
      million in near- and mid-term development milestones, to co-develop the lead AATD program
      TSRA-196. Non-dilutive funding includes up to $50 million committed by the Gates Foundation in
      2024 for an in vivo sickle cell disease program and up to $41.3 million from ARPA-H for in vivo
      CAR-T work. Aggregating disclosed figures yields more than $770 million in potential capital,
      though milestone and grant tranches are contingent on technical and clinical progress and are not
      guaranteed cash. Because Tessera is private, it publishes no audited financial statements, and the
      precise cap-table ownership, preferred-stock terms, and the equity portion of the Regeneron
      investment are not public.
    tableRefs:
    - TI002
    figureRefs:
    - FI004
  - id: burn-runway
    title: Burn Rate, Runway, and Restructuring Signals
    body: >-
      Tessera does not disclose cash on hand, monthly burn, or runway, so these must be estimated or
      obtained through diligence. The most informative public signal is the company's restructuring
      cadence: independent reporting documents three consecutive years of workforce reductions—a 13%
      cut in 2024, a 17% cut in 2025, and a reduction of roughly 35% (about 90 employees) announced in
      January 2026, with most affected staff in Massachusetts and separations scheduled to begin in
      March 2026. After the January 2026 action the company expects to retain approximately 160
      employees. Management framed the cuts as preserving capacity to advance the Regeneron-funded AATD
      program into the clinic while maintaining core gene-writing efforts, but a multi-year sequence of
      layoffs in a pre-revenue biotech is a recognized signal of runway pressure and capital
      discipline. Clinical-stage gene-editing companies of comparable headcount typically burn on the
      order of $50–150 million per year, implying that Tessera's pre-2026 burn likely consumed a
      meaningful fraction of its raised capital and that the Regeneron upfront materially extended
      runway. The timing—layoffs announced roughly a month after the Regeneron deal—suggests the
      partnership was both a validation event and a trigger to refocus spending around a single
      partner-funded asset. Absent disclosed cash balances, the precise runway remains a diligence gap.
    tableRefs:
    - TI004
    figureRefs:
    - FI003
  - id: revenue-partnership
    title: Revenue Model and Partnership Economics
    body: >-
      Tessera is pre-commercial and has no product revenue, no approved products, and no recurring
      sales. Its near-term "revenue" is better understood as financing inflows: upfront partnership
      payments, contingent milestone payments, profit-share rights, and grant disbursements. The
      Regeneron collaboration is the centerpiece of the monetization model. Under its terms, Regeneron
      pays $150 million upfront (cash plus an equity stake) and up to $125 million in milestones, and
      the two companies split worldwide development costs and any future profits from TSRA-196 equally
      on a 50/50 basis. Tessera leads the first-in-human trial; Regeneron assumes responsibility for
      subsequent global development and commercialization. This structure converts Tessera's platform
      R&D into cash today and a contingent future profit stream, while transferring late-stage cost and
      commercial execution to a larger partner. The Gates Foundation commitment (up to $50 million) is
      milestone- and mission-linked rather than a market transaction, and ARPA-H funding (up to $41.3
      million) is a government development award. Tessera has no disclosed sales cycle, customer
      acquisition cost, or channel economics in the conventional sense; the closest analog to a "sales
      motion" is its business-development capability to convert platform data into partnerships, which
      the Regeneron deal demonstrates. By comparison, Regeneron's other editing bets—Intellia and a
      2024 Mammoth Biosciences deal ($100 million upfront, up to $370 million in milestones)—show the
      partner's appetite for in vivo editing and provide a benchmark for the Tessera terms.
    tableRefs:
    - TI001
    figureRefs:
    - FI001
  - id: cost-structure
    title: Cost Structure and Capital Intensity
    body: >-
      As a platform gene-writing company moving from discovery into the clinic, Tessera's cost base is
      dominated by research and development: scientific headcount, laboratory operations, preclinical
      studies in non-human primates, lipid-nanoparticle (LNP) process development, GMP manufacturing
      for clinical supply, and IND-enabling toxicology. Gross margin is not a meaningful current metric
      because there is no product revenue; the relevant capital-intensity question is how much cash the
      platform consumes per program advanced toward and through IND. Gene-writing and in vivo editing
      programs are capital-intensive: manufacturing non-viral LNP-formulated editors at clinical scale,
      running primate studies, and funding first-in-human trials each require substantial spend before
      any revenue. The January 2026 restructuring concentrated resources on the Regeneron-funded AATD
      program, implying de-prioritization or slower advancement of the SCD and in vivo CAR-T programs
      to control burn. Working-capital and capex detail (lab buildout, manufacturing commitments,
      facility leases in the Lexington/Somerville area) is not publicly disclosed. The cost structure is
      therefore best characterized qualitatively—R&D-heavy, manufacturing-intensive, and front-loaded—
      with specific gross-margin, capex, and unit-cost figures unavailable from public sources and
      flagged as diligence items.
    tableRefs:
    - TI003
    figureRefs:
    - FI002
  - id: financial-risks
    title: Financial Risks and Diligence Verdict
    body: >-
      The financial verdict is that Tessera has assembled an unusually deep private capital base for a
      pre-clinical-stage company but exhibits clear signs of capital discipline under pressure. The
      strengths are real: a marquee Regeneron partnership that de-risks the lead program's late-stage
      funding, blue-chip venture and strategic investors, and non-dilutive Gates and ARPA-H support.
      The concerns are equally concrete. Three consecutive years of layoffs culminating in a 35%
      reduction indicate that prior burn outpaced the company's comfort with its cash position and that
      management is consolidating around a single partner-funded asset. Revenue quality is entirely
      prospective—there is no product revenue, and the contingent milestone and profit-share economics
      depend on clinical success that is years away and uncertain. Capital intensity is high, and the
      cautionary precedent of gene-writing peer Tome Biosciences—which raised $213 million yet wound
      down in 2024 after laying off nearly its entire staff—underscores that capital alone does not
      guarantee survival in this field. The binding diligence blockers are the undisclosed cash
      balance, burn rate, runway, the equity terms and implied valuation of the Regeneron investment,
      and the cap table. Without those private disclosures, the company's true financing runway and the
      dilution embedded in recent capital cannot be underwritten with confidence.

    tableRefs:
    - TI005
