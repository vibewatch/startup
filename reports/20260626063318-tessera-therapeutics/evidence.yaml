evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      No retained source discloses a post-money valuation for any Tessera financing round, including Series B, Series C,
      or the Regeneron equity component. The Regeneron deal terms reference an equity investment but do not specify the
      valuation at which shares were priced.
    whyItMatters: >-
      Without a disclosed valuation, investors cannot compute dilution, mark-to-market value, or the implied valuation
      step-up between rounds. It also makes it impossible to assess whether the $150M Regeneron deal was dilutive or
      accretive relative to Series C pricing.
    diligencePath: >-
      Request the Series C post-money valuation, the 409A most recent valuation, and the share price in the Regeneron
      equity investment from management or data room.
    relatedQuestionRefs:
      - QO011
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Tessera Therapeutics is a pre-revenue clinical-stage company. No retained source discloses any revenue, commercial
      milestones paid, or ARR figure. The company does not have a disclosed commercial product.
    whyItMatters: >-
      Absence of revenue is expected for a clinical-stage biotech, but it is a required diligence data point; later
      valuation chapters should flag this explicitly.
    diligencePath: >-
      Confirm pre-revenue status with management; review whether any collaborator milestone payments or grant
      disbursements have been recognized as revenue in the company's financial statements.
    relatedQuestionRefs:
      - QO021
  - type: missing-source
    severity: moderate
    topic: Series A funding
    missingEvidence: >-
      No retained source independently discloses a formal Tessera Series A financing round. The Series B press release
      noted Flagship's cumulative contribution of $60 million, which implies earlier Flagship capital, but no Series A
      announcement was found in the fetched source set.
    whyItMatters: >-
      Total historical capital raised is understated if a Series A existed; the dilution stack and investor economics
      from early rounds would be missing.
    diligencePath: Request the full financing history from management or a Crunchbase/PitchBook diligence pull.
    relatedTableRefs:
