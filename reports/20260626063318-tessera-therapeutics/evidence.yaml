  - type: private-evidence-only
    severity: material
    topic: market-sizing-AATD
    missingEvidence: >-
      Tessera has not disclosed a SAM estimate, target patient subpopulation size, pricing strategy, or commercial
      launch timeline for TSRA-196. The number of PiZZ homozygous AATD adults with pulmonary disease who are both
      diagnosed and eligible for gene therapy cannot be accurately isolated from public sources.
    whyItMatters: >-
      The SAM for TSRA-196 depends on diagnosis rate, PiZZ fraction, payer-defined eligibility criteria, and commercial
      center buildout—none publicly quantified. A precise SOM is not calculable without Tessera commercial disclosures.
    diligencePath: >-
      Request Tessera market characterization documents; consult Alpha-1 Foundation for diagnosed PiZZ patient registry
      data; review Regeneron's commercial planning for AATD indications.
    relatedQuestionRefs:
      - QM004
      - QM012
      - QM028
  - type: private-evidence-only
    severity: material
    topic: payer-economics
    missingEvidence: >-
      Tessera has not disclosed a pricing strategy, payer advisory engagement, or outcomes-based contract framework for
      TSRA-196 or the SCD program. The Regeneron collaboration terms do not publicly specify a price range or
      reimbursement strategy.
    whyItMatters: >-
      Payer willingness-to-pay for a one-time AATD gene therapy at analogue pricing ($2M–$3M) is uncertain. ICER
      benchmarks apply to SCD; a separate ICER review for AATD would set payer anchors. Without clarity on pricing, the
      SAM-to-revenue conversion cannot be modeled.
    diligencePath: >-
      Request commercial strategy materials from Regeneron partnership team; check for any ICER or NICE scoping notice
      on AATD gene therapy; review augmentation therapy payer coverage policies as a proxy for willingness to pay for
      curative alternatives.
    relatedQuestionRefs:
      - QM030
  - type: missing-source
    severity: minor
    topic: market-sizing-SCD
    missingEvidence: >-
      An independent analyst estimate of the SAM specifically for in vivo gene therapy for SCD in global
      low/middle-income markets (the Gates Foundation addressable population) does not exist in accessible public
      sources.
    whyItMatters: >-
      If Tessera's SCD program is fundamentally a global access play rather than a US premium market play, the
      commercial return model is entirely different from Casgevy/Lyfgenia analogues. Without a global market model, the
      total opportunity is underdefined.
    diligencePath: >-
      Search for Gates Foundation / NIH reports on SCD global treatment access economics; consult WHO or PAHO for sickle
