  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      The precise switching-cost and lock-in dynamics for one-time curative gene therapies are not quantified in public
      sources; it is asserted but not measured how many patients a competitor's first-mover treatment permanently
      removes from Tessera's addressable market.
    whyItMatters: >-
      In small orphan populations, a competitor treating patients first structurally shrinks Tessera's serviceable
      market, making first-to-approval more valuable than in chronic-therapy markets.
    diligencePath: >-
      Model the AATD and SCD eligible-patient pools against competitor enrollment and launch timelines; request
