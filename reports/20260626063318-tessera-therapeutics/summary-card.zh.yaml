summary:
  headline: >
    Tessera 已经完成从平台公司到临床阶段资产的关键切换：TSRA-196 在 early 2026 以 FDA Fast Track 和 Orphan Drug 资格进入全球 1/2 期临床。Regeneron 合作（$150M
    + $125M 里程碑）给出非稀释性验证，也提供可信商业化路径。Gene Writing 的大载荷、无双链断裂机制相较 CRISPR 有技术差异，但尚未在人类中验证。January 2026
    裁员显示财务纪律，也把执行风险进一步集中。2022 年 $1.7B 估值未必充分反映当前生物科技市场；投资人应按 2028–2030 数据读出周期建模。在 1 期安全性和疗效数据出来前，观察 / 继续研究更合适。
