company:
  name: Tessera Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Tessera Therapeutics is a private, pre-revenue gene-writing platform whose only hard valuation
    anchor is stale: a $300 million Series C in April 2022 struck at an approximately $1.7 billion
    post-money valuation, at the top of the 2021–2022 biotech bubble. Since then the operating context
    has deteriorated—three consecutive years of layoffs (culminating in roughly 35% in January 2026),
    a brutal funding winter for preclinical gene editing, and a sector-wide reset in which the public
    gene-editing comparables have de-rated sharply from their peaks. Against that backdrop, the December
    2025 Regeneron collaboration ($150 million upfront in cash and equity, up to $125 million in
    milestones, and a 50/50 cost/profit split on TSRA-196) is the most important new valuation signal:
    it validates the platform and the AATD asset and injects non-dilutive capital, but the equity
    component and any implied pre-money were not disclosed, so it cannot be converted into a precise mark.
    Public comparables frame the range—CRISPR Therapeutics (~$5.2B, with Casgevy approved), Beam
    (~$3.5B), Intellia (~$2.5B), and Prime Medicine (~$0.6B) as of June 2026—but each carries clinical
    data Tessera lacks, so the comparable read is a wide $0.6–5B band that says more about modality
    sentiment than about Tessera specifically. Our base case is that Tessera's current fair value is at
    best flat to its 2022 mark and plausibly below it, with a bull case requiring TSRA-196 clinical
    proof-of-concept and a bear case (clinical or partner setback into a closed financing window)
    pointing to a down round or distressed outcome. The recommendation is therefore not a buy at the
    2022 mark: it is track / research-more, conditioned on obtaining the Regeneron equity terms,
    cash/runway, and the first human TSRA-196 data—the inputs that would convert an opaque private
    valuation into an investable one.
  contentRequirements:
  - Investment thesis and anti-thesis tied to market, product, customers, financials, competition, and risks.
  - Recommendation, confidence, risk rating, valuation stance, and target return/hold/exit where supportable.
  - Current financing/valuation context, entry discipline, dilution/preference overhang, and whether public evidence supports the price.
  - Bull/base/bear cases with explicit assumptions, valuation ranges, probability signals, and downside triggers.
  - Comparable set — public companies, private rounds, M&A, milestone or model-appropriate references.
  - Exit readiness and final diligence asks plus thesis-break triggers.
  plannedTables:
  - name: Recommendation summary table
    requirement: recommendation, confidence, risk rating, valuation stance, decision implication.
  - name: Thesis / anti-thesis table
    requirement: argument, what would change the view.
  - name: Bull / base / bear scenario table
    requirement: assumptions, valuation/return logic, key risks, probability signal.
  - name: Comparable valuation table
    requirement: comparable, metric, multiple/valuation/status, relevance, limitation.
  - name: Thesis-break and kill triggers table
    requirement: trigger, threshold, transmission to thesis, action implication.
  - name: Final diligence asks table
    requirement: topic, missing evidence, why it matters, owner or diligence path.
  plannedFigures:
  - name: Recommendation logic
    acceptedTypes: [flow]
    requirement: Chain from scale/proof/risks/valuation to recommendation.
  - name: Valuation sensitivity
    acceptedTypes: [bar]
    requirement: Sensitivity to revenue, margin, multiple, milestone probability, utilization, or other driver.
  - name: Valuation / return range
    acceptedTypes: [range]
    requirement: Low/base/high valuation, exit, dilution, or return outcomes with explicit assumptions.
  - name: Investment KPIs
    acceptedTypes: [kpi]
    requirement: IC-ready scoring across market, proof, moat, economics, risk, valuation, and evidence quality.
  evidenceStrategy:
  - Use prior chapter evidence first, then gather recommendation-critical financing/valuation/comp data directly.
  - Valuation/financing — latest rounds, valuation marks, cap-table/preference clues, public/private comps, M&A, secondary marks.
  - Scenario drivers — milestone probability, clinical readouts, multiples, dilution, exit window.
  - Adverse/downside — overvaluation, down-round risk, multiple compression, regulatory blockers, commercialization failure.
  qualityBar:
  - Recommendation is price-sensitive and evidence-sensitive, not a generic company-quality score.
  - Use a valuation method matching business model and stage; show what diligence or price change would move the call.
  - Do not issue buy unless thesis and anti-thesis are evidence-supported and valuation has sufficient support.
  - If valuation inputs are missing, prefer research-more or track over false precision.
  - Include adverse searches on overvaluation, down-round risk, governance, liquidity, or commercialization failure.

sections:
  - id: last-known-valuation
    title: Last Known Valuation — the 2022 Series C Anchor
    body: >-
      Tessera's only firm valuation datapoint is now more than four years old. In April 2022 the company
      closed a Series C of more than $300 million, led by GV (Google Ventures) with Casdin Capital and
      Leaps by Bayer, struck at an approximately $1.7 billion post-money valuation. That round brought
      cumulative funding above roughly $500 million and made Tessera one of the best-capitalized private
      genetic-medicine platforms of its cohort. Crucially, the mark was set at the peak of the
      2021–2022 biotech financing bubble, before the multi-year correction that followed, so it should be
      treated as a high-water reference rather than a current fair value. No subsequent priced equity
      round has been publicly disclosed, which means there has been no independent price discovery on
      Tessera's equity in over four years—an unusually long gap for a clinical-stage biotech. As a
      private company Tessera also discloses no cap-table detail, so the liquidation-preference stack,
      anti-dilution terms, and any accrued dividends sitting ahead of common are unknown. For an
      underwriter, the practical implication is that the $1.7 billion figure is an anchor that almost
      certainly overstates today's value: the burden of proof is on showing the company is still worth
      that mark, not on justifying a discount to it.
    tableRefs: []
    figureRefs: []
  - id: implied-current-valuation
    title: Implied Current Valuation — Reading the Regeneron Deal
    body: >-
      The most informative recent signal is the December 2025 Regeneron collaboration on TSRA-196 for
      AATD. Regeneron committed $150 million upfront—described as a combination of cash and an equity
      investment—plus up to $125 million in near- and mid-term milestones, with the two companies
      splitting worldwide development costs and profits 50/50. A strategic equity investment of this
      scale by a blue-chip pharma is a genuine validation event and a material runway extension. However,
      the split between cash and equity, the price per share, and any implied pre-money valuation were
      not disclosed, so the deal cannot be converted into a clean equity mark. What can be inferred is
      bounded: a $150 million upfront against a 2022 post-money of $1.7 billion is consistent with a wide
      range of outcomes, from a modest minority equity stake at a flat-to-down valuation to a richer mark
      if most of the upfront is non-equity. The structure—Tessera leading the first-in-human trial while
      Regeneron leads later global development—also concentrates value in one partnered asset and one
      counterparty, which a buyer must weight against the validation. The honest conclusion is that the
      Regeneron deal supports a current enterprise value somewhere in a roughly $0.8–2.5 billion band,
      with the midpoint at or below the 2022 mark, and that the equity terms are the single most valuable
      missing input for tightening it.
    tableRefs: []
    figureRefs:
    - FV003
  - id: comparable-companies
    title: Comparable Companies — A Wide, Sentiment-Driven Band
    body: >-
      Because Tessera is pre-revenue, the most defensible external reference is the public gene-editing
      peer set, read as enterprise-value comparables rather than multiples. As of June 2026, CRISPR
      Therapeutics trades at roughly a $5.2 billion market capitalization—buoyed by Casgevy, the first
      approved CRISPR therapy—while Beam Therapeutics sits near $3.5 billion, Intellia near $2.5 billion,
      and Prime Medicine near $0.6 billion. The spread itself is the lesson: four broadly comparable
      editing platforms span an order of magnitude, driven almost entirely by clinical stage, cash
      position, and the market's       and the market's sentiment toward each modality. Every one of these peers is publicly traded, files
      audited 10-Ks, and—except for the early-stage names—carries human clinical data that Tessera does
      not yet have, so a like-for-like read is impossible. Layered on top is a sector-wide de-rating:
      gene-editing equities have fallen well below their 2021 peaks as the funding winter persisted, and
      preclinical/early-clinical platforms have seen the sharpest multiple compression. Triangulating,
      Tessera's private fair value plausibly sits in the lower half of this public band—above Prime's
      sub-$1 billion mark given the Regeneron validation and platform breadth, but below the
      clinically-validated mid-caps—implying something in the rough vicinity of its 2022 level only if
      one credits the platform optionality the public market is currently discounting.
    tableRefs:
    - TV004
    figureRefs:
    - FV004
  - id: scenario-analysis
    title: Scenario Analysis — Bull, Base, and Bear
    body: >-
      Valuing a single-asset, platform-optionality story is best done with explicit scenarios rather
      than a point estimate. In the bull case, TSRA-196 delivers clean first-in-human safety and an
      early functional-AAT signal, Regeneron leans in, and a closed-but-thawing IPO/crossover window
      reopens for de-risked platforms; that path supports an up round and an enterprise value plausibly
      in the $2.5–4 billion range, validating Gene Writing as a category. In the base case, the AATD
      program advances on partner funding without a decisive readout, the platform's other programs stay
      de-prioritized, and the company trades flat-to-down versus 2022 at roughly $1.2–2 billion, with
      survival underwritten by Regeneron and grant capital rather than by new equity. In the bear case, a
      clinical or safety setback on TSRA-196, a Regeneron pull-back, or simply runway exhaustion into a
      still-closed financing window forces a down round, a distressed recapitalization, or a wind-down
      echoing the Tome Biosciences precedent, with equity value compressing below $0.8 billion and common
      potentially impaired beneath the preference stack. The probability weighting tilts toward the base
      and bear cases given the layoffs and the funding environment, making entry discipline—price,
      structure, and downside protection—more important than upside sizing.
    tableRefs:
    - TV003
    figureRefs:
    - FV002
  - id: valuation-concerns
    title: Valuation Concerns and Downside Triggers
    body: >-
      Several adverse forces argue against paying the 2022 mark. First, the macro: private biotech
      funding fell to multi-year lows through 2025, megarounds dropped sharply, and many platforms now
      report under twelve months of runway, pushing the field toward down rounds, consolidation, and
      recapitalizations. Second, sector multiples have reset—benchmark valuation multiples for
      preclinical and early-clinical gene editing are materially below the boom years, so even a strong
      platform inherits a lower starting multiple. Third, company-specific stress: three years of
      layoffs culminating in roughly 35% in January 2026 is a textbook runway-pressure signal, and a
      pre-revenue private company offers no public price to mark against. Fourth, structural overhang:
      after a 2022 round and an undisclosed-terms strategic equity investment, the liquidation-preference
      and anti-dilution stack ahead of common is unknown and could meaningfully reduce common-equity
      value in a flat-or-down exit. Fifth, concentration: with value pooled in one partnered asset, a
      single clinical or partner event is a binary valuation trigger. The clearest downside triggers to
      monitor are a TSRA-196 safety signal or clinical hold, a Regeneron exit or renegotiation, an
      additional layoff round, a financing announced on distressed terms, and any further de-rating of
      the gene-editing comparable set. Each would move the valuation materially and asymmetrically to the
      downside.
    tableRefs:
    - TV005
    figureRefs: []
  - id: recommendation-and-diligence
    title: Recommendation, Thesis/Anti-Thesis, and Final Diligence Asks
    body: >-
      Our recommendation is TRACK / RESEARCH-MORE, not buy at the 2022 mark, with low-to-medium
      confidence and a high risk rating; the valuation stance is "do not anchor to $1.7B—underwrite to a
      $1.2–2 billion base with material downside." The thesis is real: a differentiated, double-strand-
      break-free, non-viral writing platform with large-payload potential, a lead asset in the clinic, a
      validating pharma partner, and orphan/Fast Track economics in AATD, all bought into a depressed
      sector where a single clinical proof-of-concept could re-rate the category. The anti-thesis is
      equally real: no human efficacy or durability data, a novel modality facing a higher regulatory
      bar, incumbents already approved (Casgevy) or directly competing (Beam's BEAM-302 in AATD),
      three years of layoffs, single-asset and single-partner concentration, an unknown preference stack,
      and a cautionary peer base rate in Tome. The call turns on price and information, not on company
      quality alone. The decisive diligence asks are: the Regeneron agreement terms (equity price,
      exclusivity, termination, change-of-control), the current cash balance, burn, and runway, the
      cap-table and liquidation-preference stack, the patent estate and freedom-to-operate position, and
      the first TSRA-196 human safety and biomarker data. Obtaining these converts an opaque private
      valuation into an underwritable one; absent them, the disciplined action is to track, set
      thesis-break triggers, and re-engage on a priced round or a clean clinical readout.
    tableRefs:
    - TV001
    - TV002
    - TV006
    figureRefs:
    - FV001
    claimRefs:
    - CV001
    - CV010

