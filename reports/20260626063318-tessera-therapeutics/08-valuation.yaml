  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Regeneron equity terms and implied valuation
      missingEvidence: >-
        The cash-versus-equity split, price per share, stake, exclusivity, and termination provisions of
        the December 2025 Regeneron investment are not public, so no precise equity mark can be derived.
      whyItMatters: >-
        These terms are the single most valuable input for converting the deal into a current valuation
        and for assessing how durable Tessera's key partnership is.
      diligencePath: >-
        Request the collaboration agreement and any stock-purchase agreement, including price, stake,
        exclusivity, termination, and change-of-control provisions.
      relatedQuestionRefs: [QV025]
      relatedTableRefs: [TV006]
    - type: private-evidence-only
      severity: blocking
      topic: cash, burn, runway, and preference stack
      missingEvidence: >-
        Tessera's current cash balance, net burn, runway, cap table, and liquidation-preference stack are
        not disclosed, leaving the bear-case probability and common-equity value unquantified.
      whyItMatters: >-
        Runway sets the probability of a distressed raise, and the preference stack determines how much
        value reaches common in a flat or down exit.
      diligencePath: >-
        Request audited financials, a 13-week cash forecast, the cap table, and the charter/financing
        terms detailing preferences and anti-dilution.
      relatedQuestionRefs: [QV019, QV026]
      relatedTableRefs: [TV006]
    - type: enumeration-incomplete
      severity: material
      topic: comparable set — private rounds and M&A precedents
      missingEvidence: >-
        The comparable analysis relies on four public market caps plus Tessera's own 2022 round; private
        financing rounds, secondary marks, and M&A precedents for gene-editing platforms are not assembled.
      whyItMatters: >-
        Private and M&A references would tighten the implied-valuation band and better capture how
        strategic acquirers value preclinical platform optionality.
      diligencePath: >-
        Compile recent private gene-editing rounds, secondary transaction marks, and platform M&A
        precedents with disclosed or estimated valuations.
      relatedQuestionRefs: [QV027]
      relatedTableRefs: [TV004]
    - type: missing-source
      severity: material
      topic: exit readiness, target return, and human data timing
      missingEvidence: >-
        Whether Tessera is IPO/exit-ready, what target return is supportable, and when the first TSRA-196
        human data will read out are not establishable from public evidence.
      whyItMatters: >-
        Exit readiness and the timing of the decisive de-risking readout determine the hold period and the
        achievable return, which the recommendation cannot yet quantify.
      diligencePath: >-
        Request the clinical readout timeline, board financing/exit plan, and management's target
        milestones, then re-underwrite the return on disclosed terms.
      relatedQuestionRefs: [QV028, QV029]
      relatedTableRefs: [TV001]
