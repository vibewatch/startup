callouts:
  - calloutType: insight
    title: "The 2022 Mark Is an Anchor, Not a Fair Value"
    body: >-
      The single most important framing for Tessera's valuation is that its $1.7 billion post-money was
      set in April 2022, at the top of the biotech bubble, and has not been re-priced in a public round
      since. Everything that has happened since—a multi-year funding winter, a sharp de-rating of the
      public gene-editing comparables, and three consecutive years of layoffs at Tessera itself—argues
      that today's fair value is at best flat and plausibly below that mark. The Regeneron deal is a
      genuine offset, but its undisclosed equity terms mean it validates the platform without
      establishing a price. An underwriter should therefore invert the usual burden of proof: rather than
      justifying a discount to $1.7 billion, require positive evidence (disclosed deal terms, runway, and
      first human data) before crediting anything near it.
    claimRefs:
      - CV001
      - CV003
      - CV009
  - calloutType: risk
    title: "Why the Recommendation Is Track, Not Buy"
    body: >-
      Tessera is a high-conviction-platform, low-information-valuation situation, and that combination
      argues for patience. The thesis—differentiated writing chemistry, a partnered lead asset, orphan
      economics, and a depressed entry point—is attractive, but it is unsupported by any human efficacy
      data and clouded by an unknown liquidation-preference stack that could subordinate common equity in
      a flat or down exit. With value concentrated in one asset and one partner, the outcome is closer to
      binary than to a smooth distribution. The disciplined response is not to pass permanently but to
      track: define explicit thesis-break triggers (a TSRA-196 safety signal, a Regeneron exit, a
      distressed raise), obtain the deal and cap-table terms, and re-engage on a priced round or a clean
      clinical readout—paying for proof rather than for optionality at a stale mark.
    claimRefs:
      - CV010
      - CV016
      - CV019

