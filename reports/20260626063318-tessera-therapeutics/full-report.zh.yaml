            body: >-
              今天唯一类似具名付费客户的实体，是资助并共同开发 Tessera 项目的机构；它们的承诺也是目前最强的客户证明。Regeneron 是旗舰「客户」：2025 年 12 月，它同意就 TSRA-196 开展
              $150 million 前期款（现金加股权）合作，另有最高 $125 million 里程碑款，并按 50/50 分担全球开发成本和利润——Tessera 主导首次人体试验，Regeneron
              主导后续全球开发和商业化。Gates Foundation 2024 年 12 月承诺最高 $50 million，用于推进一个面向全球可及性的体内 SCD
              项目，明确目标是在中低收入国家让一次性治愈治疗变得可行。ARPA-H 于 2025 年在 EMBODY 项目下授予最高 $41.3 million，用于体内
              CAR-T。这三段关系之所以算「生产」关系，只是因为它们是与成熟交易对手签署的、有资金支持的约束性共同开发协议；没有一项代表已部署、能产生收入的产品，每一项都取决于技术和临床里程碑。证明质量高——每项承诺都有具名方、日期和新闻稿，并获独立报道印证——但证据证明的是验证和资金，不是商业牵引力。临床前平台不存在第三方「客户评价」、采购记录或案例研究，因此具名证明始于也止于这些伙伴。
