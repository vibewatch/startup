      - number: '3.4'
        title: 疾病直接重叠、定价与商业化在位者
        blocks:
          - type: paragraph
            body: >-
              Tessera 项目若与竞争者在具体疾病上重叠，竞争者通常更领先，而且往往已经在市场中定价。镰状细胞病方面，CRISPR Therapeutics 与 Vertex 的 Casgevy（exagamglogene
              autotemcel）是一款一次性、离体、基因编辑疗法，已获批用于 12 岁及以上镰状细胞病或输血依赖型 beta-thalassemia 患者；它提高 fetal hemoglobin，是 Tessera
              体内镰状细胞项目必须超越的基准——超越点更多在可及性和成本，而不是纯疗效，因为 Casgevy 需要 myeloablative conditioning 和干细胞移植流程，限制了可服务人群。Casgevy 与
              Bluebird 的 Lyfgenia 标价分别约 $2.2 million 和 $3.1 million，设定了该品类支付方价格锚。AATD 方面，现有替代方案仍是每周静脉增补疗法，而 Beam 的
              BEAM-302 与 TSRA-196 直接竞争治愈位置。Tessera 的结构性定价论点是，非病毒、仅输注、不需要细胞采集或调理的疗法，可以比离体基因疗法便宜得多、覆盖范围也广得多——这是其 Gates
              Foundation 支持的全球可及镰状细胞病论点的核心。但定价权取决于 Tessera
              尚未证明的临床差异化；在位者掌握分销、治疗中心网络和支付方关系，而临床前数据挑战者并不具备。一次性治愈的转换成本很反常：患者一旦由竞争者治疗，就实际上终身退出 Tessera 的可服务市场。
