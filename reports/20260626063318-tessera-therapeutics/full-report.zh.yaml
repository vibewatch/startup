      - number: '3.3'
        title: 非病毒 Gene Writing 与品类可行性问题
        blocks:
          - type: paragraph
            body: >-
              Tessera 最接近的概念竞争者，是那些和它一样试图「写入」或整合完整基因、而不是编辑单个碱基的公司；它们的近况是品类风险的警示信号。Tome Biosciences 于 2023 年 12 月公开亮相，带着
              $213 million Series A 和 B 融资推进 programmable genomic integration（PGI）平台；该平台使用自有 integrase
              酶，在不引入双链断裂的情况下插入超过 30 kilobases 的 DNA 片段，功能上类似 Tessera 的大载荷 Gene Writing。不到一年，「gene editing
              领域投资者情绪急剧转变」，Tome 于 2024 年 11 月提交 WARN 通知，计划裁撤 131 名员工（几乎全部员工），同时寻求战略选项。Tome 倒下是最清晰的反证：一个非病毒、无双链断裂的 Gene
              Writing 平台——无论科学上多优雅——也可能无法吸引足够持久的资本走到临床。另一个新系统编辑公司 Metagenomi 在 2024 年 2 月 IPO 后次日股价下跌约 30%，并在 2024 年 5
              月失去备受瞩目的 Moderna 基因编辑合作。在这一背景下，Tessera 自己 2026 年 1 月裁员约 90 人，并转向由 Regeneron 资助的 TSRA-196 项目，看起来也是击垮 Tome
              的同一种市场压力——但 Tessera 的临床阶段状态和 Regeneron 资本部分缓解了压力，这是 Tome 未能拿到的东西。让 Tessera 活下来而 Tome 没活下来的关键差异，是 Tessera
              在情绪窗口完全关闭前，已经和资金雄厚的药企伙伴一起走到 IND 和 Phase 1/2。
