  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 基因编辑与基因治疗竞争格局
        blocks:
          - type: paragraph
            body: >-
              Tessera 并不是在空白市场竞争。它的 Gene Writing
              平台位于更广泛的体内遗传医学版图中，至少十几家资本充足的公司正追求同一个终点——对致病基因实现持久、最好是一次性修正——只是工具重叠、机制不同。与 Tessera
              相关的竞争分五层。第一，直接的体内基因编辑同行（Beam Therapeutics、Intellia Therapeutics、Prime Medicine、Editas
              Medicine、Metagenomi、Arbor Biotechnologies），它们在患者体内编辑 DNA，其中几家使用与 Tessera 相同的肝脏定向脂质纳米颗粒（LNP）递送。第二，商业化在位者
              CRISPR Therapeutics 与 Vertex；Casgevy 是首个也是唯一获批的 CRISPR 药物，定义了后来者必须超越的监管和支付方模板。第三，最直接的概念同行是「gene writing」/
              基因组整合公司——最典型的是已经倒闭的 Tome Biosciences；它们和 Tessera 一样，试图在没有双链断裂的情况下插入完整基因。第四，现有替代方案（AATD 的长期蛋白增补、镰状细胞病的
              hydroxyurea 和输血）仍是现实世界默认选项，任何一次性疗法都必须取代它们。第五，未来可能进入者包括大型药企内部自建项目和表观遗传编辑玩家。2026
              年，这一格局的核心特征是：多家竞争者已经在临床——甚至在市场中——而 Tessera 的领先项目才刚进入 Phase 1/2，使其成为一个临床阶段落后者；在这个领域，谁先拿到数据、谁先获批，谁就获得持久优势。
