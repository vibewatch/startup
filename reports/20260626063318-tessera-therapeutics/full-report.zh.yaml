      - number: '5.5'
        title: 知识产权、Know-how 与差异化
        blocks:
          - type: paragraph
            body: >-
              Tessera 的差异化由机制、递送和知识产权共同构成。平台源自 Flagship Pioneering 内部，Jacob Rubens（Chief Innovation Officer）和 Geoffrey
              von Maltzahn 等联合创始人提出 Gene Writing，问题意识是：自然界是否进化出了写入 DNA、而不是打断 DNA 的工具。该起源体现在已授权专利中，例如 US 12,031,129
              B2（"Methods and compositions for modulating a genome"），该专利转让给 Tessera 和 Flagship，Rubens 与 von Maltzahn
              等列名发明人，主张 RNA 介导、无 DSB、位点定向的基因组改造，覆盖从单碱基编辑到整基因插入。竞争护城河有几根支柱：不同于 CRISPR 核酸酶、碱基编辑器和 Prime editors
              的机制类别；写入点编辑技术无法承载的大载荷；包括肝外 LNP 在内的全 RNA、非病毒递送系统；以及积累的制造和配方 know-how。差异化真实存在，但并非无人竞争——学术团队（尤其是
              Broad/MIT）也在独立工程化 R2 和其他整合酶系统，用于位点特异性插入，因此 Tessera 并不独占逆转座元件编辑领域；其优势能否持久，取决于在递送、效率、特异性和已授权专利组合广度上持续领先。
            claimRefs: []
      - number: '5.6'
        title: 安全性、脱靶控制与质量考量
        blocks:
          - type: paragraph
            body: >-
              产品的安全性论点来自机制本身：Gene Writing 只切开单条 DNA
              链，而不是双链都切，目标是避开核酸酶编辑伴随的双链断裂风险——易位、大缺失和染色体重排；同时通过在指定位置写入，控制新序列落点。Tessera 的临床前披露强调靶向特异性高、AATD
              项目未检测到脱靶编辑、未在生殖系组织中检测到编辑；这些正是监管机构审视体内、永久性遗传改变时关注的关键安全信号。监管体系已经与领先项目接轨：FDA 批准 TSRA-196 IND，并授予 Fast Track 和
              Orphan Drug 资格，说明该机构接受其临床前安全性和 CMC 包足以启动人体给药。重要安全和质量问题仍然开放，且是一流首创体内平台固有问题：长期整合位点安全性、脱靶与插入突变评估是否完整、RNA 和
              LNP 组分免疫原性、重复给药，以及临床供应所用 GMP 生产和分析控制。疗法会造成永久改变，因此持久性、可逆性画像和长期随访计划是风险评估核心。大量细节——尤其是 CMC
              和完整脱靶方法学——未公开，必须通过尽调取得。
            claimRefs: []
          - type: table
            tableRef: TE004
            claimRefs:
              - CE002
              - CE016
              - CE017
              - CE018
              - CE023
      - number: '5.7'
        title: 展示
        blocks:
          - type: callout
            title: 差异化在于大载荷、无 DSB、体内写入
            body: >-
              Tessera 技术论点的核心是，点编辑技术（碱基编辑和 Prime editing）以及核酸酶编辑器（CRISPR-Cas9）很难在没有双链断裂的情况下高效插入大序列。Gene Writing 的 TPRT
              机制被设计成在指定位置写入从单碱基到整基因的任何载荷，不产生 DSB，并用全 RNA、LNP
              载荷在体内完成。如果非人灵长类中展示的肝外递送和效率能转化到人体，平台就可能服务体外和病毒路径难以覆盖的疾病以及制造模式。关于 R2/LINE-1 TPRT 和工程化全 RNA 插入（人类细胞系中效率超过
              80%）的独立文献显示底层生物学真实且可工程化，即便公司的具体系统仍属专有，也实质性降低了机制风险。
            calloutType: insight
            claimRefs:
              - CE004
              - CE010
              - CE011
              - CE012
          - type: callout
            title: 尚无人体数据，CMC / 脱靶细节未披露
            body: >-
              Tessera 已披露的所有疗效和安全性结果都来自临床前——小鼠和非人灵长类。平台核心安全论点（无
              DSB、位点定向、未检测到生殖系编辑）在机制上有吸引力，也得到动物数据支持；但体内、永久性基因组改造带来的整合位点、插入突变和免疫原性风险，只有人体试验和长期随访能回答。不确定性还被进一步放大：完整脱靶评估方法、GMP/CMC
              控制、具体 LNP 配方，以及领先项目的详细编辑参数均未公开。FDA 的 IND 批准和 Fast Track/Orphan
              资格显示监管机构接受了启动给药所需的资料包，但一流首创写入平台能否临床转化，仍是核心技术风险。
            calloutType: risk
            claimRefs:
