    rows:
      - - AATD 体内基因编辑（单基因肝病）
        - 作为一次性治疗定价的治愈性体内基因疗法；作为既有标准治疗的 augmentation therapy
        - 体外 HSC 基因疗法；RNAi / ASO 路线（fazirsiran）；小分子 COPD 管理
        - 商业支付方、Medicare / Medicaid；学术医疗中心（处方方）
        - IV augmentation therapy（Prolastin-C 等）：每名患者约 $200K–$205K/年；无获批治愈方案
        - Lead program TSRA-196 面向 PiZZ 纯合 AATD；首个进入临床的 TPRT 体内疗法
      - - SCD 的体内基因编辑 / 基因疗法（造血系统）
        - 面向重症 SCD 的治愈性体内基因疗法；全球可及配方
        - 体外 CRISPR 基因疗法（Casgevy $2.2M，Lyfgenia $3.1M）；羟基脲；长期输血
        - Medicaid（美国 SCD 患者多数）；Gates Foundation 支持的全球可及
        - 羟基脲、长期输血、支持性护理；以及已获批的体外疗法
        - Tessera SCD 体内项目（pre-IND）；Gates Foundation $50M 投资；全球可及设计
      - - 体内 CAR-T 免疫疗法（肿瘤 / 自身免疫）
        - ARPA-H 资助的体内免疫细胞工程；最终面向商业肿瘤 / 自身免疫市场
        - 所有现有体外 CAR-T（Yescarta、Carvykti、Kymriah、Breyanzi、Tecartus）；T 细胞连接器；双特异性药物
        - ARPA-H（当前资助方）；未来：肿瘤中心、支付方、医疗系统
        - 体外 CAR-T（$400K–$600K/剂，仅限专科中心，制造需数周）
        - Tessera 体内 CAR-T 项目（ARPA-H EMBODY 奖项 $41.3M）；临床前阶段
      - - 广义体内遗传医学（基因疗法 TAM）
        - 所有体内基因疗法和基因编辑产品：病毒载体、LNP 和其他非病毒递送；已获批产品与管线收入
        - 不含基因组编辑的体外细胞疗法、RNAi/ASO、传统生物制剂、小分子
        - 全球医疗系统、支付方、政府项目；CDMO 供应链
        - 目标疾病的传统生物制剂、血浆来源蛋白和慢性药物治疗
        - 平台级 TAM；Tessera 的 TPRT 和 LNP 递送被定位为该市场中的平台差异化
      - - AATD 增补疗法（现状市场，年度）
        - Prolastin-C、Aralast NP、Zemaira、Glassia 收入：全球约 $1.9B/年；约 $200K–$205K/患者/年
        - 基因疗法、RNAi；肺移植；肝移植
        - 商业支付方、Medicare/Medicaid；呼吸科 / 肝病专科中心
        - Prolastin-C（Grifols）及竞品；标准 IV 输注模式；无法治愈
        - Tessera 的 AATD 项目可能颠覆或部分替代的市场；为一次性定价提供支付方成本锚
    notes: >-
      AATD 增补疗法市场规模（$1.9B）来自 Coherent Market Insights/GII Research 截至 2026 年的数据；单患者年度成本来自学术成本分析和市场来源。合格患者人群来自 Alpha-1
      Foundation 和 FDA 来源。
