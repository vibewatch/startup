  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Tessera Therapeutics 所处赛道是体内遗传医学：用工程化分子工具直接递送进活体患者，在目标基因组位点改写、沉默或插入 DNA
              序列。这个市场不同于离体基因治疗（先取出细胞、在实验室改造、再回输），也不同于不改变基因组的传统小分子或生物药。

              对 Tessera 来说，相关市场横跨三个相互交叉的板块：（1）面向 AATD 和 SCD 等单基因肝脏与造血疾病的体内基因编辑和基因治疗；（2）面向肿瘤和自身免疫病的体内 CAR-T 和 T
              细胞免疫疗法；（3）这些新方法要替代的现有治疗——最重要的是 AATD 的长期蛋白增补疗法（全球年市场约 $1.9 billion），以及 SCD 现有管理方案，包括
              hydroxyurea、长期输血项目和近期获批的离体基因疗法（Casgevy、Lyfgenia）。

              不属于可直接服务边界的包括：离体 CAR-T（YESCARTA、KYMRIAH、CARVYKTI、BREYANZI）、面向 AATD 的基因沉默 RNAi 方法（Arrowhead/Takeda 的
              fazirsiran）、其他适应症的病毒载体基因疗法，以及未使用 TPRT 基因组写入的 AAV
              体内基因递送项目（Roche、AstraZeneca、REGENXBIO）。这些是邻近领域和竞争者，不是同一市场分段。

              平台扩展后可能纳入可服务范围的邻近方向包括：面向常见心血管代谢病的肝脏定向递送（与 Intellia 和 Beam 有重叠）、SCD 之外其他血红蛋白病的 HSC 定向疗法、面向实体瘤的 T
              细胞定向递送，以及眼科或 CNS 靶点的非病毒递送。这些是未来选项，不是当前 SAM。

              AATD 的现有替代方案是每周静脉 AAT 增补疗法——四款 FDA 批准的蛋白替代产品（Prolastin-C、Aralast NP、Zemaira、Glassia），估计每名患者每年直接成本约
              $200,000–$205,000。增补疗法不修正底层遗传缺陷，无法逆转已有损伤，并且需要终身每周输注。若一次性治愈型基因疗法定价为单次干预，它将在总护理成本、生活质量，以及「治愈」相对「管理」的叙事上竞争。

              SCD 的现有方案是 hydroxyurea、长期输血和支持性护理；2023 年 12 月之后，又增加了两款获批的离体 CRISPR / 基因疗法：Casgevy（标价 $2.2M）和 Lyfgenia（标价
              $3.1M）。Tessera 的体内 SCD 项目由 Gates Foundation 最高 $50M
              资助，并按全球可及性设计；它既要与现有慢病管理标准竞争，也要与离体基因疗法竞争——而且明确为离体制造基础设施不可获得或不可负担的场景而设计。

              截至本报告运行日，体内 CAR-T 尚无产品获得 FDA 批准。现有方案是传统离体 CAR-T（每次治疗 $400K–$600K，制造周期数周，只在专科中心可获得）。ARPA-H EMBODY 计划——2025
              年 10 月向 Tessera 授予最高 $41.3M——明确瞄准这个缺口：目标是打造一个可适配、低成本的平台，把细胞工程从实验室移入体内，消除时间、成本和准入障碍。
