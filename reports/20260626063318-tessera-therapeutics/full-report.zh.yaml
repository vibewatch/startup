    title: 体内遗传医学市场规模：TAM / SAM / SOM 金字塔
    type: pyramid
    layout: standard
    summary: 三层规模金字塔展示全球基因治疗 TAM、Tessera 围绕 AATD 与 SCD 的疾病特定 SAM，以及受关键依赖约束的 SOM。 数值来自分析师报告或作者估算，并明确列出依据。
    data:
      nodes:
        - label: TAM：全球体内基因治疗市场（2026）
          value: 10.04
          description: Mordor Intelligence 报告 2026 年为 $10.04B；到 2031 年按 20.86% CAGR 增至 $25.89B（体内基因治疗）
        - label: SAM：AATD + SCD 治愈性治疗上限（美国，10 年生命周期）
          value: 5
          description: 作者估算：约 60K PiZZ AATD + 约 16K SCD 合格人群 × $2–3M 定价上限，再按采用率和支付方压价折减； 仅为粗略量级，未经分析师验证
        - label: SOM：Tessera AATD 收入远景（2028–2031，取决于 Phase 1）
          value: 0.5
          description: 商业化前的粗略上限：若 Phase 1 成功且 Regeneron 推出，假设首年约 250 名患者、单价 $2M； 取决于试验结果、获批和支付方准入
    approximationNotes: >-
      SAM 估算由作者基于疾病患病率、合格亚群比例，以及 Casgevy/Lyfgenia 定价参照搭建。$4B–$6B 是生命周期可触达上限， 不是年度市场规模。SOM
      刻意保留为「尚无法拆分」，因为公司尚未商业化，临床结果也未知。不要把 TAM 理解为年度收入； 它是所有体内基因治疗产品的全年全球市场规模。
