      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Tessera 管理层最大的一次交接发生在 2022 年 6 月：Michael Severino, M.D. 加入公司，担任首席执行官，同时成为 Flagship Pioneering 的
              CEO-Partner。Severino 来自 AbbVie，曾任副董事长兼总裁，负责研发、业务发展和公司战略。他接替 Tessera 创始 CEO Geoffrey von
              Maltzahn；后者转任董事会主席。截至 2026 年 6 月，von Maltzahn 仍是 Flagship Pioneering 普通合伙人，并继续担任董事会主席。

              Jacob Rubens 作为首任首席科学官共同创立 Tessera；此后他转任 Flagship Pioneering 的 Origination Partner，并共同创立 Quotient
              Therapeutics，目前任总裁。截至 2026 年 6 月，高级领导团队包括 David Davidson（首席医学与开发官）、Michael Holmes（首席科学官）、Hari
              Pujar（首席运营官）、Becky Lillie（首席人力资源官）、Cynthia Patton（总法律顾问兼秘书）以及 Cecilia Cotta-Ramusino（高级副总裁、平台负责人）。2025 年
              12 月，Howard Liang 在任职五年后卸任总裁兼 CFO，Kathy Bergsteinsson 被任命为 CFO。Bergsteinsson 拥有 25 年以上经验，其中 18 年在 Morgan
              Stanley 任职，曾担任董事总经理兼 Healthcare Equity Capital Markets 负责人。

              董事会成员包括 Geoffrey von Maltzahn（主席）、Michael Severino（CEO 董事）、Paul Biondi、Melissa Moore（同时担任科学顾问委员会主席）、Derica
              Rice、Mary Rozenman 和 Elliott Sigal。Noubar Afeyan 被列为创始团队成员，但不再被描述为承担治理职务。科学顾问委员会成员包括 George Church、John
              Moran、Jonathan Weissman、Luigi Naldini、David Schaffer、Jef Boeke、Erik Sontheimer、Britt Adamson 和 David A.
              Williams。
