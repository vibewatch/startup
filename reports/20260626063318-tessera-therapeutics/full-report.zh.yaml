      - number: '7.4'
        title: 竞争风险
        blocks:
          - type: paragraph
            body: >-
              Tessera 进入的适应症里，资本更充足、临床进度更靠前的竞争者已经领先。在镰状细胞病中，Vertex 与 CRISPR Therapeutics 的 Casgevy 已获批并开始给药，确立了 Tessera
              临床前 SCD 项目最终必须超越的疗效和安全门槛；其缓慢商业采用也证明市场渗透有多难。在 Tessera 领先适应症 AATD 中，Beam Therapeutics 正在推进
              BEAM-302，以碱基编辑方式作用于同一 SERPINA1 靶点，并已报告临床进展；公司旗舰项目出现直接头对头模态竞赛，使时点和差异化的赌注更高。更广泛图景中，Intellia（体内 CRISPR）、Prime
              Medicine（Prime editing）、Editas 和 Metagenomi 都在推进体内或下一代编辑，其中数家公司已上市且资产负债表更厚。Tessera
              的差异化——大载荷、无双链断裂、非病毒写入——必须转化为临床或商业优势（更好精度、更大插入、可重复给药或安全性）才有意义；如果竞争者率先实现持久、安全校正，Tessera
              更后期资产可能被商品化或被跨越。公司的资本底盘更窄，且最接近的概念同业 Tome Biosciences 已在 2024 年关停，这进一步放大竞争风险，也说明科学新颖性本身无法保证在该领域存活。
            claimRefs: []
