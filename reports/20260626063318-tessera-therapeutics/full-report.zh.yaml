companyProfile:
  summary: >
    Tessera Therapeutics 是 Flagship Pioneering 孵化公司，成立于 2018 年、2020 年公开亮相，开发 Gene Writing
    平台——借助可移动遗传元件（转座子、逆转座子），在体内完成精准、大载荷（>10 kb）、位点特异 DNA 插入，不制造双链断裂，并通过脂质纳米颗粒递送。公司完成 $230M+ Series B（2021 年 1 月）和估值
    $1.7B 的 $300M Series C（2022 年 4 月），由 GV（Google Ventures）、Casdin Capital 和 Leaps by Bayer 领投。CEO Michael Severino
    M.D.（前 AbbVie 总裁 / COO）于 2022 年加入；Geoffrey von Maltzahn（联合创始人、前 CEO）担任执行董事长。2025–2026 年关键里程碑包括：$41.3M ARPA-H EMBODY
    奖励（2025 年 10 月）、Regeneron 对 AATD 项目 TSRA-196 的 $150M 投资（2025 年 12 月）、FDA 批准 TSRA-196 IND（2026 年 1 月）、FDA Fast Track
    和 Orphan Drug 认定（2026 年 2 月），以及 Phase 1/2 试验启动（2026 年初）。2026 年 1 月，Tessera 裁员约 35%（90 人），保留约 160 名员工，把资源集中到
    Regeneron 合作和 TSRA-196。
