      - number: '6.4'
        title: 市场准入、留存与报销风险
        blocks:
          - type: paragraph
            body: >-
              产品尚未上市，客户留存和持久性无法测量；真正的问题是，未来市场是否会采用并持续认可一次性基因疗法，而现有先例并不乐观。Vertex 与 CRISPR Therapeutics 的 Casgevy 是首个获批用于
              SCD 的 CRISPR 疗法，定价约为每名患者 $2.2 million，但采用速度明显偏慢：独立报道显示，获批约两年后，美国仅约 165 名患者接受治疗，远低于预测。障碍具有结构性，也直接关系 Tessera
              未来商业化：支付方犹豫，多百万美元一次性疗法的报销模型不成熟，授权治疗中心网络有限，体外流程要求高（干细胞采集加 busulfan 预处理）并劝退合格患者。CMS 推出 Cell and Gene
              Therapy（CGT）Access Model，以结果挂钩和集中谈判框架缓解 Medicaid 准入，但该模式很新且运营复杂。Tessera 的体内脂质纳米颗粒路径明确定位于移除拖慢 Casgevy
              采用的预处理和单采负担；如果临床验证成立，留存和吞吐画像可能显著改善。但同样的支付方和定价逆风仍会存在，而单次给药遗传校正的持久性（效果是否终身维持）本身也是开放临床问题，决定真实世界「留存」。
