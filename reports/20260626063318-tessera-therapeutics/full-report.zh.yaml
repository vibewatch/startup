            body: >-
              Tessera 是一家平台型 Gene Writing 公司，正从发现阶段走向临床，成本底盘由研发主导：科研人员、实验室运营、非人灵长类临床前研究、脂质纳米颗粒（LNP）工艺开发、临床供应的 GMP
              生产，以及支持 IND 的毒理学。没有产品收入，毛利率当前没有实际意义；真正的资本强度问题，是每推进一个项目到 IND 并穿过 IND，平台要消耗多少现金。Gene Writing
              和体内编辑项目资本强度高：临床规模生产非病毒 LNP 配方编辑器、做灵长类研究、资助首次人体试验，在任何收入出现前都要大量投入。2026 年 1 月重组把资源集中到 Regeneron 资助的 AATD
              项目，意味着 SCD 和体内 CAR-T 项目被降优先级或推进放慢，以控制消耗。营运资本和资本开支细节（实验室建设、制造承诺、Lexington/Somerville
              区域设施租约）未公开披露。因此，成本结构最好定性描述为研发重、制造重、前置投入高；具体毛利率、资本开支和单位成本数字无法从公开来源取得，应列为尽调事项。
