  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 临床开发风险
        blocks:
          - type: paragraph
            body: >-
              Tessera 的价值几乎完全压在尚未产生人体疗效数据的资产上。领先项目 TSRA-196 针对 alpha-1 antitrypsin deficiency（AATD），直到 2026
              年初才进入首次人体测试；其余管线（体内镰状细胞病和体内 CAR-T）仍处于临床前。这把公司放在药物开发失败率最高的阶段：模态新颖，尚无获批体内 Gene Writing
              疗法先例，遗传药物从首次人体到获批的技术成功概率低，且风险大量后置。具体临床风险包括：单次体内给药能否把有功能的 alpha-1 antitrypsin
              提升到具有临床意义且持久的水平；效果能否维持多年（任何一次性 genome-writing 校正在人体中的持久性都尚未证明）；安全画像——尤其是脱靶编辑、插入事件、对 gene writer 或 LNP
              的免疫反应，以及考虑到 LNP 肝脏趋向性带来的肝毒性——能否跨过监管和临床门槛。Tessera 在 Regeneron 合作下主导 TSRA-196
              首次人体试验，因此早期安全信号或疗效落空不仅会拖停领先资产，也可能损害为其提供资金的合作。基本概率很冷酷：多数首次人体遗传药物项目无法走到获批，公司也未披露可降低该论点风险的中期人体数据。这些风险重大，公开证据大多无法缓释，只能随临床读出出现而解决。
            claimRefs: []
