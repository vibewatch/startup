      - number: '8.4'
        title: 情景分析——牛市、基准与熊市
        blocks:
          - type: paragraph
            body: >-
              单一资产叠加平台可选性的故事，最好用明确情景估值，而不是给一个点估计。牛市情景下，TSRA-196 拿出干净的首次人体安全性和早期 functional-AAT 信号，Regeneron 加码，关闭但开始解冻的
              IPO / crossover 窗口重新向已降风险平台打开；这条路径支持 up round，企业价值可能落在 $2.5–4 billion 区间，并验证 Gene Writing
              作为一个品类。基准情景下，AATD 项目靠合作伙伴资金推进，但没有决定性读出，平台其他项目继续被降优先级，公司相对 2022 年 flat-to-down，估值约 $1.2–2 billion，生存靠
              Regeneron 和 grant capital 承担，而不是新股权。熊市情景下，TSRA-196 出现临床或安全性挫折、Regeneron 后撤，或 runway 在融资窗口仍关闭时耗尽，迫使公司 down
              round、困境资本重组或像 Tome Biosciences 一样 wind-down，股权价值压到 $0.8 billion
              以下，普通股可能被优先权堆栈侵蚀。考虑裁员和融资环境，概率权重偏向基准与熊市，因此入场纪律——价格、结构和下行保护——比上行空间测算更重要。
            claimRefs: []
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 估值担忧与下行触发点
        blocks:
          - type: paragraph
            body: >-
              多股逆风都反对按 2022 年价格买入。第一是宏观：私有 biotech 融资到 2025 年跌至多年低位，mega round 大幅减少，许多平台 runway 不到十二个月，行业被推向 down
              round、整合和资本重组。第二是行业倍数重置——临床前和早期临床基因编辑的基准估值倍数已明显低于繁荣期，即便强平台也要从更低的起点定价。第三是公司自身压力：连续三年裁员，并在 2026 年 1 月达到约
              35%，是典型的 runway 压力信号；预收入私有公司也没有公开价格可供 mark。第四是结构性包袱：2022 年融资和一笔条款未披露的战略股权投资之后，排在普通股之前的清算优先权和反稀释堆栈未知，在 flat
              或 down exit 中可能显著压低普通股价值。第五是集中度：价值集中在一个 partnered asset 上，单一临床或合作伙伴事件就是二元估值触发器。最清晰的下行触发点包括 TSRA-196 安全性信号或
              clinical hold、Regeneron 退出或重谈、再次裁员、以困境条款融资，以及基因编辑可比公司进一步 de-rating。任何一项都会以不对称方式显著拉低估值。
            claimRefs: []
          - type: table
            tableRef: TV005
            claimRefs:
              - CV015
              - CV016
              - CV023
              - CV024
      - number: '8.6'
        title: 建议、正反 thesis 与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              我们的建议是 TRACK / RESEARCH-MORE，而不是按 2022 年价格买入；置信度低到中，风险评级高。估值立场是「不要锚定 $1.7B——用 $1.2–2 billion
              的基准情景承销，并纳入显著下行」。正向 thesis 成立：一个差异化、无双链断裂、非病毒写入平台，具备大载荷潜力；lead asset 已入临床，有 pharma 合作伙伴验证，AATD 享有孤儿药 /
              Fast Track 经济性；这一切发生在低迷行业里，单个临床 proof-of-concept 就可能重估品类。反向 thesis 同样成立：没有人体疗效或持久性数据，新 modality
              面对更高监管门槛，既有玩家已获批（Casgevy）或直接竞争（Beam 的 AATD 项目 BEAM-302），公司三年裁员，单一资产和单一合作伙伴集中，优先权堆栈未知，Tome
              的同业基准率也值得警惕。判断取决于价格和信息，而不只取决于公司质量。决定性尽调问题包括：Regeneron 协议条款（股权价格、排他性、终止、控制权变更）、当前现金余额、burn 和 runway、cap
              table 与清算优先权堆栈、专利组合与 freedom-to-operate 位置，以及首批 TSRA-196 人体安全性和 biomarker
              数据。拿到这些，才可把不透明的私有估值转成可承销估值；拿不到时，纪律动作就是跟踪、设定 thesis-break 触发器，并在定价融资轮或干净临床读出后重新进入。
            claimRefs:
              - CV001
              - CV010
