      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 约束不是科学，而是支付方经济性
            body: >-
              Casgevy 说明，突破性基因疗法获得 FDA 批准，并不会立刻转化为商业牵引。每名患者 $2.2M 的价格、两年支付方授权周期和 Medicaid 报销障碍，使其虽在 2023 年 12 月获批，2024
              年收入仍只有 $10M。任何 AATD 基因治疗项目——包括 TSRA-196——都会面对同样的支付方摩擦；AATD 患者主要由商业保险覆盖（不同于 Medicaid 占比较高的 SCD
              人群），这一点还会叠加复杂性。按结果付费合同和获批后的证据生成，将是放量前的必要条件。
            calloutType: risk
            claimRefs:
              - CM017
              - CM018
              - CM027
              - CM028
          - type: callout
            title: 全球可及性是一条差异化市场路径
            body: >-
              Tessera 面向 SCD 的体内、非病毒 LNP 路线，是为全球可及性设计的，而不只是服务 Casgevy 覆盖的 16,000 名美国合格患者。WHO 估计全球有 7.74 million 人患有
              SCD，其中 80% 位于撒哈拉以南非洲。没有人适合 $2.2M–$3.1M 的离体基因疗法。若 Tessera 的体内 SCD 项目在资源有限环境中跑出临床概念验证——这正是 Gates Foundation
              的任务——可服务人群将扩大数个数量级，但定价模型必须完全不同于美国高价疗法模型。这既是该项目最有吸引力的机会，也是最大的商业不确定性。
