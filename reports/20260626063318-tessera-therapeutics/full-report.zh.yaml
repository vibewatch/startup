  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 类型
      - 方向
      - 时间
      - 对 Tessera 的含义
      - 尽调问题
    rows:
      - - 首个接近 FDA 批准的体内 CRISPR 疗法（Intellia lonvo-z）
        - 驱动
        - 正向
        - 2027 年上半年可能获批
        - 验证体内基因编辑的监管路径；扩展市场基础设施和支付方熟悉度；利好所有体内平台公司
        - 跟踪 Intellia 的 FDA 申报进展；lonvo-z 的任何安全性发现都可能给 TPRT 平台带来品类逆风
      - - TSRA-196 获 FDA Fast Track 和 Orphan Drug 认定
        - 驱动
        - 正向
        - 生效中（2026 年 2 月授予）
        - 支持滚动递交；降低使用者费用；获批后有资格获得 7 年市场独占；加快审评
        - 确认认定是否延伸至后续申报；监测 FDA 2026 年政策变化是否影响 Fast Track 承诺的解释
      - - Regeneron 合作（$150M + 里程碑，利润 50/50 分成）
        - 驱动
        - 正向
        - 生效中（2025 年 12 月）
        - 借 Regeneron 获得全球商业基础设施；分担开发成本；接入 Regeneron 的全球报销关系；降低 Tessera 商业化资本需求
        - 里程碑结构与触发条件；若错过里程碑的权利回转条款；Regeneron 的 AATD 合作如何影响 SCD 或 CAR-T 项目
      - - 非病毒、可能可重复给药的 LNP 递送
        - 驱动
        - 正向
        - 等待 Phase 1 临床验证
        - 相比体外清髓方案，扩大合格患者人群；支持较低基础设施部署；是 SCD 全球可及的关键优势
        - 需要人体中可重复给药的临床证据；患者体内器官特异性 LNP 靶向相对临床前模型仍需验证
      - - 全球 SCD 可及使命（Gates Foundation）
        - 驱动
        - 正向
        - 中期（2028–2032）
        - 提供使命驱动融资；打开 $2M+ 基因疗法无法触达的市场；契合全球健康公平叙事
        - Gates Foundation 投资条款；慈善定价模型是否影响美国 / 欧盟商业回报；SCD 项目时间线与 AATD 的相对节奏
      - - ARPA-H EMBODY 项目支持体内 CAR-T
        - 驱动
        - 正向
        - 生效中（2025 年 10 月）
        - 政府资助概念验证；降低早期体内 CAR-T 工作的 R&D 消耗；增强未来商业伙伴信任
        - 里程碑要求；ARPA-H 奖项下的 IP 归属；其他 EMBODY 获奖方的竞争格局
      - - 基因疗法 FDA 监管环境波动（2026）
        - 约束
        - 负向
        - 当前
        - REGENXBIO 被拒、Sarepta 受挫和 FDA 领导层更替抬高批准不确定性；新型 TPRT 机制面对无先例的“首创”监管路径
        - 监测 FDA 对新型基因组编辑模式的指导；首个 TPRT IND 的监管策略；若 Intellia lonvo-z 获批，可借鉴其先例
      - - 一次性高价疗法的支付方摩擦
        - 约束
        - 负向
        - 当前（对 Phase 3 及以后影响实质）
        - Casgevy 在 FDA 批准后 2024 年收入仅 $10M，初期采用缓慢，说明市场准入难；需要基于疗效的合同；SCD 患者 Medicaid 可及是结构性挑战
        - Tessera 对 TSRA-196 的定价策略；Medicaid 谈判计划；AATD 基于疗效的合同框架；是否已召集支付方顾问委员会？
      - - CRISPR Therapeutics CTX460 AATD 竞品（预计 2026 年中 IND）
        - 约束
        - 负向
        - 2026 年中以后
        - AATD 存在直接竞争重叠；同一疾病中的 CRISPR/Cas9 vs. TPRT 可能影响入组、首个获批溢价和商业差异化
        - CTX460 临床时间线；入组竞争；AATD 场景下 TPRT 与 SyNTase editing 的机制差异
      - - 生产放大与 LNP 优化
        - 约束
        - 负向
        - 近期（Phase 1–3）
        - 临床规模下做组织特异性递送的非病毒 LNP 很复杂；任何 CMC 挑战都会拉长时间线并推高成本
        - LNP 生产的 CDMO 伙伴；GMP 放大准备度；FDA 对 IND 是否已有监管 CMC 意见
      - - 来自体外 CRISPR（Casgevy/Lyfgenia）以及 SCD 碱基 / prime editing 的竞争
        - 约束
        - 负向
        - 竞争已在进行
        - Casgevy 已获批、正在增长，并且在美国 90% 可报销可及；Tessera 的 SCD 项目若要在美国竞争，必须证明非清髓体内优势，或在价格 / 可及性上更优；全球可及模型是另一条路径
        - 与 Casgevy 对比的差异化数据；Tessera SCD 项目 IND 时间线；定价 / 可及模型
      - - LNP 递送 IP 相对现有专利格局的耐久性
        - 约束
        - 负向
        - 长期
        - Alnylam/Arbutus/Moderna 持有大量 LNP IP；器官特异性 LNP 靶向专利；Tessera 声称拥有专有递送，但公开来源无法完全刻画
        - FTO 分析；Tessera 授权 vs. 自有 LNP IP；待审专利申请
    notes: 驱动 / 约束分类和时间判断反映截至 2026 年 6 月的公开证据。监管时间属前瞻判断。财务和 IP 风险部分或完全依赖非公开证据。
