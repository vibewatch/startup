  - id: FE001
    title: Gene Writing 产品架构（分层栈）
    type: stack
    layout: standard
    summary: Gene Writing 产品的分层架构，从底层逆转录元件生物学到交付的治疗项目，展示每一层如何建立在下一层之上。
    data:
      layers:
        - label: 第 1 层 — 逆转录元件生物学（R2 / LINE-1 TPRT）
          detail: 天然非 LTR 逆转座子机制：靶向引发逆转录把 RNA 写入 DNA
        - label: 第 2 层 — 工程化 Gene Writer 蛋白 + 模板 RNA
          detail: 可编程位点识别、单链切口，以及对载荷的逆转录（从单碱基到整基因）
        - label: 第 3 层 — 全 RNA 载荷
          detail: Gene Writer mRNA + 模板 RNA 支持非病毒、无 DSB 编辑
        - label: 第 4 层 — LNP 递送（肝脏与肝外）
          detail: 脂质纳米颗粒把载荷递送至肝脏、HSC 和 T 细胞；肝外靶向为专有技术
        - label: 第 5 层 — 疾病项目 / 疗法
          detail: TSRA-196（AATD，临床）；SCD 和体内 CAR-T（临床前）
    approximationNotes: 该栈是概念图，反映 Tessera 描述的平台和逆转录元件 TPRT 机制。第 1 层已由文献独立验证；第 4–5 层 （肝外递送、项目）除临床 AATD 项目外，大多仍处临床前。
    claimRefs:
      - CE002
      - CE006
      - CE007
      - CE011
  - id: FE002
    title: TPRT 运行流：在体内写入遗传改变
    type: flow
    layout: wide
    summary: 靶向引发逆转录的逐步运行流，从全 RNA 载荷递送到形成永久的靶向基因组改变。
    data:
      nodes:
        - id: lnp
          label: LNP 递送的全 RNA 载荷
          description: Gene Writer mRNA + 模板 RNA 经脂质纳米颗粒进入靶细胞
        - id: complex
          label: Gene Writer + 模板 RNA 复合体
          description: 由 mRNA 翻译出的蛋白结合编码改变的模板 RNA
        - id: dnabind
          label: 基因组靶点结合
          description: 复合体识别并结合特定 DNA 位点
        - id: nick
          label: 单链切口
          description: 切开一条 DNA 链，暴露 3' 引物（无双链断裂）
        - id: rt
          label: 逆转录
          description: 模板 RNA 在该位点被逆转录为 DNA
        - id: edit
          label: 永久靶向改变
          description: 载荷（从单碱基到整基因）被写入并整合
      edges:
        - from: lnp
          to: complex
          label: 翻译 + RNA 结合
        - from: complex
          to: dnabind
          label: 位点识别
        - from: dnabind
          to: nick
          label: Nickase 活性
        - from: nick
          to: rt
          label: 引发合成
        - from: rt
          to: edit
          label: 整合 / 解决
    approximationNotes: 该流程刻画 Tessera 描述、并由 R2/LINE-1 逆转座子文献佐证的 TPRT 机制。人体内动力学和效率尚未建立。
    claimRefs:
      - CE002
