      - number: '4.5'
        title: 财务风险与尽调结论
        blocks:
          - type: paragraph
            body: >-
              财务结论是，Tessera 作为临床前公司，已经搭起了异常深厚的私人资本底盘，但也清楚呈现出压力下的资本纪律。优势真实存在：Regeneron
              这一标志性合作降低了领先项目后期资金风险；投资方包括一线风险资本和战略投资者；Gates 与 ARPA-H 也提供了非稀释性支持。担忧同样具体。连续三年裁员，最终裁到
              35%，说明此前消耗已经超过公司对现金状况的舒适区，管理层正围绕单一伙伴资助资产收拢。收入质量完全是前瞻性的——没有产品收入，或有里程碑和利润分成经济性取决于多年后且不确定的临床成功。资本强度高，Gene
              Writing 同业 Tome Biosciences 的警示案例也摆在眼前：该公司融资 $213 million，却在 2024
              年裁掉几乎全部员工后关停，说明资本本身无法保证该领域公司存活。真正卡住承销的尽调项，是未披露的现金余额、燃烧率、跑道、Regeneron
              投资的股权条款和隐含估值，以及股权表。没有这些私下披露，公司的真实融资跑道和近期资本内嵌的稀释无法有把握地承销。
