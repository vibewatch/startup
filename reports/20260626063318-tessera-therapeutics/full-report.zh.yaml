        - 拿走主要非稀释性资金和商业化路径
        - 再融资前放弃；下调估值标记
      - - 进一步重组 / 困境融资
        - 追加裁员，或以惩罚性条款下行融资
        - 确认跑道耗尽；稀释 / 损害普通股
        - 避开一级；以折价二级重新评估
      - - 基因编辑可比公司降估值
        - 同行市值持续下跌
        - 压低可比区间和退出倍数
        - 下调目标估值；扩大入场折扣
    notes: 触发因素可从外部监测；每项都对应具体行动，让论点可被证伪，而不是被合理化。
    claimRefs:
      - CV015
      - CV016
      - CV023
      - CV024
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - Regeneron 交易经济性
        - 股权价格 / 持股、排他性、终止、控制权变更
        - 决定隐含估值标记和合作方耐久性
        - 索取合作协议和股票购买协议
      - - 现金、烧钱速度、跑道
        - 当前现金余额、净烧钱、跑道月数
        - 决定熊市概率和稀释需求
        - 索取审计财务报表和 13 周现金预测
      - - 股权结构 / 优先权
        - 清算优先权栈、反稀释、应计股息
        - 决定持平 / 下行退出中的普通股价值
        - 索取股权结构表和章程 / 融资条款
      - - IP / 自由实施
        - 专利组合、引入许可、FTO 意见
        - 影响防御力和诉讼 / 许可成本
        - 索取专利清单和法律 FTO 意见
      - - TSRA-196 人体数据
        - 首次人体安全性和生物标志物读数
        - 整个论点最关键的去风险输入
        - 索取试验方案、终点和中期数据计划
    notes: 这五项要求把不透明的私营估值转成可承销估值；拿到之前，纪律性立场是跟踪 / 继续研究。
    claimRefs:
