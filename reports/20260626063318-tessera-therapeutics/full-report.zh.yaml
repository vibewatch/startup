chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与创立
        blocks:
          - type: paragraph
            body: >-
              Tessera Therapeutics 是一家临床阶段生物技术公司，总部位于马萨诸塞州 Somerville。公司把使命表述为「通过写入生命代码治愈疾病」，并用 Gene Writing
              推进这件事——这是一个受可移动遗传元件（MGEs）启发的基因组工程平台；MGEs 是地球生命中最丰富的一类基因。MGEs 编码的分子机器能把 DNA 写入新的基因组位点，不依赖 CRISPR
              核酸酶编辑所需的双链断裂。Tessera 因此主张，Gene Writing 与现有基因编辑和基因治疗路线有根本差异。

              公司 2018 年诞生于 Flagship Pioneering 内部创新工厂 Flagship Labs，创始人包括 Geoffrey von Maltzahn（MIT 生物医学工程博士）、Jacob
              Rubens（MIT 微生物学博士）以及 Noubar Afeyan 等其他 Flagship 科学家；Afeyan 也是联合创始人和首任董事长。经过多年内部平台开发后，Flagship 于 2020 年 7 月
              7 日正式向公众推出 Tessera。2021 年和 2022 年的新闻稿仍把总部写作马萨诸塞州 Cambridge；公司近期公告和媒体报道则使用马萨诸塞州 Somerville。

              Tessera 公开描述的技术平台由三块咬合在一起：Gene Writers（工程化和合成 MGEs，通过 target-primed reverse transcription，即 TPRT 写入
              DNA）、递送系统（自有脂质纳米颗粒平台，为体内 RNA
              递送到目标细胞类型而设计），以及围绕三个初始组织靶点搭建的管线。公司沿两条大方向推进：一是单基因疾病，以及用肝脏和造血干细胞定向递送治疗常见疾病的遗传路线；二是用 T 细胞定向递送治疗肿瘤和自身免疫病。截至
              2026 年 6 月，公司领先临床项目是 TSRA-196，一款体内基因编辑疗法，靶向 alpha-1 antitrypsin deficiency 背后的 SERPINA1 突变。
