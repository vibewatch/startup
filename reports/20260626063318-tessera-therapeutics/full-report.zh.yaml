      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: 2022 年估值是锚点，不是公允价值
            body: >-
              Tessera 估值最重要的框架，是其 $1.7 billion 投后估值定在 2022 年 4 月、生物科技泡沫顶部，此后没有通过公开定价轮重新定价。之后发生的一切——多年融资寒冬、公开基因编辑可比公司的剧烈
              de-rating，以及 Tessera 自身连续三年裁员——都说明今天的公允价值最多持平，且很可能低于该价格。Regeneron
              交易确实构成对冲，但股权条款未披露，意味着它验证了平台，却没有确立价格。承销方因此应倒置通常的举证责任：不要先证明为什么要对 $1.7 billion
              打折，而应先要求正向证据（披露的交易条款、runway、首次人体数据），再认可接近该估值的价格。
            calloutType: insight
            claimRefs:
              - CV001
              - CV003
              - CV009
          - type: callout
            title: 为什么建议是跟踪，而不是买入
            body: >-
              Tessera 是高信念平台、低信息估值的组合，这种组合要求耐心。正向 thesis——差异化写入化学、已有合作的 lead
              asset、孤儿药经济性和低迷入场点——有吸引力，但没有任何人体疗效数据支撑，又被未知清算优先权堆栈遮蔽；在 flat 或 down exit
              中，普通股可能被压到优先股之后。价值集中在一个资产和一个合作伙伴上，结果更接近二元，而不是平滑分布。有纪律的反应不是永久 pass，而是跟踪：定义明确的 thesis-break 触发器（TSRA-196
              安全性信号、Regeneron 退出、困境融资），拿到交易和 cap table 条款，并在定价轮或干净临床读出时重新进入——为证据付钱，而不是按过期价格为可选性付钱。
            calloutType: risk
            claimRefs:
              - CV010
              - CV016
              - CV019
