      - number: '7.2'
        title: 平台与技术风险
        blocks:
          - type: paragraph
            body: >-
              Gene Writing 是差异化但尚不成熟的平台，若干优势同时也是风险。该路径使用移动遗传元件（工程化反转座子 / retron
              来源写入器），通过脂质纳米颗粒非病毒递送，在不依赖双链断裂的情况下插入或校正序列。如果得到验证，它可能避开核酸酶编辑相关的遗传毒性；如果不能，平台自身也有尚未充分刻画的风险——写入不完整或不精确、脱靶整合、嵌合，以及不同目标细胞和组织中的编辑效率波动。递送尤其是卡点：LNP
              对肝脏效率高（有利于以肝脏为靶点的 AATD），但肝外和造血干细胞靶向（镰状细胞项目所需）技术难度更高且属专有；递送效率或特异性任何短板都会直接限制平台可覆盖的适应症。FDA 2024–2026
              年基因组编辑指南明确要求使用敏感、基于下一代测序的方法检测脱靶事件、染色体重排和大插入 /
              缺失；新型写入机制可能产生更难刻画的编辑特征，从而抬高非临床安全包门槛。平台风险还因证据基础而加重：大量支持证据仍是临床前，有些来自公司披露而非同行评议，因此治疗规模下体内效率和精度的独立验证仍有限。平台广度是优势，但在一个项目通过人体概念验证前，整个平台共享同一项相关性技术风险。
            claimRefs: []
