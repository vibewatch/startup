      - number: '6.5'
        title: 扩张潜力与客户集中风险
        blocks:
          - type: paragraph
            body: >-
              若以已获资金支持的关系衡量，Tessera 的客户基础集中到危险程度。单一交易对手 Regeneron 承担了最大且最具战略意义的承诺，领先临床资产（TSRA-196）也绑定该合作；如果 Regeneron
              退出或降低优先级，公司主要的非稀释性临床资金来源和最可信商业路径都会消失。Gates Foundation 与 ARPA-H 承诺让资助方基础有所分散，但它们瞄准的是更早期项目（SCD 和体内
              CAR-T）；2026 年 1 月重组似乎已相对 Regeneron 资助的 AATD 工作降低这些项目优先级，风险进一步集中到单一资产和伙伴上。抵消这一点的扩张论点是平台广度：Gene Writing
              平台原则上可编程到多种单基因病和工程细胞适应症，因此每个获得验证的项目都会带来签下更多药企合作的选择权（通过 BD 而非销售团队执行的先落地再扩张动作）。要实现扩张，需要 TSRA-196
              临床数据为正，从而降低平台风险并吸引新的伙伴「客户」。在此之前，集中度是主导性的客户动态；关键尽调问题是 Regeneron 协议的期限、排他性和终止权，以及 Gates 和 ARPA-H 项目在重组后的状态。
