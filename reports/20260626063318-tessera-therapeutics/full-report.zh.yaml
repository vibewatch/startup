      - number: '1.4'
        title: 临床里程碑、管线与运营背景
        blocks:
          - type: paragraph
            body: >-
              Tessera 临床项目最关键的一步发生在 2026 年 1 月 12 日，当时 FDA 放行 TSRA-196 的 Investigational New Drug 申请。同一天，公司获得澳大利亚 Human
              Research Ethics Committee 批准，可以启动 Phase 1/2 临床试验。2026 年 2 月 23 日，FDA 授予 TSRA-196 Fast Track 和 Orphan Drug
              双重资格，用于治疗 PiZ 等位基因纯合的成人 AATD 患者。Tessera 首席开发与医学官 David Davidson 表示，这是史上首个基于体内 TPRT 的基因组编辑疗法 IND 获批；Alpha-1
              Foundation 独立确认了这一说法。Phase 1/2 研究是 first-in-human、开放标签、跨国试验，设计目标是在单次静脉给药后评估安全性、耐受性和疗效。

              TSRA-196 之外，Tessera 公开材料中的管线还包括：一个部分由 Gates Foundation 资助的体内镰状细胞病（SCD）基因编辑项目，以及获得 ARPA-H EMBODY
              奖励支持、面向肿瘤和自身免疫病的体内 CAR-T 项目。公司已在科学会议上展示三大方向的临床前数据，但截至本报告运行日，SCD 或 CAR-T 项目均未披露 IND 申报。

              2026 年初，Tessera 宣布员工重组。2026 年 1 月提交的州裁员通知以及 FierceBiotech 和 Boston.com 的报道显示，公司将从 2026 年 3 月 8 日起裁撤 90
              名员工，其中包括 82 名马萨诸塞州居民。公司发言人确认，裁员后将保留约 160 名员工，意味着员工规模缩减约 35%。公司表示，不会关闭设施；重组会把资源集中到 TSRA-196 临床项目和 Regeneron
              合作，同时继续投资 CAR-T Gene Writing 项目，把它作为未来产品浪潮的基础。
