  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层——患者人群与支付方
        blocks:
          - type: paragraph
            body: >-
              Tessera 尚未商业化，因此最终客户不是今天正在交易的买方，而是未来接受疗法的患者和为其报销的支付方。领先项目 TSRA-196 靶向 alpha-1 antitrypsin
              deficiency（AATD），这是一种单基因疾病，SERPINA1 基因产生错误折叠的 alpha-1 antitrypsin，导致进展性肺部（肺气肿 / COPD）和肝脏疾病。具有临床意义的
              AATD（Pi*ZZ 基因型）在美国约每 3,000–5,000 人中有 1 人受影响，大约 70,000–100,000 人；公司与伙伴称，美国和欧洲合计可触达约 200,000 人。关键在于，超过 90% 的
              AATD 病例未被诊断，因此可服务市场远小于患病人群，提升诊断率本身就是商业杠杆。第二个适应症镰状细胞病（SCD）是 Gates 资助体内项目的目标；SCD 影响约 100,000 名美国人（超过 90%
              为黑人或非裔美国人）和全球估计 7.7 million 人，其中约 90% 病例在撒哈拉以南非洲。第三个、更早期的分层是用于肿瘤学和免疫学的体内 CAR-T，由 ARPA-H
              资助。支付方侧，买方是美国和欧盟报销体系——商业保险、Medicaid（覆盖大量 SCD 患者）、Medicare 和国家卫生系统——以及面向中低收入市场的全球卫生资助方。AATD 和 SCD
              都具备孤儿病经济性：人群小且可识别、单患者价值高，并预期采用高价一次性定价。
