      - number: '5.3'
        title: 非病毒 LNP 递送，包括肝外靶向
        blocks:
          - type: paragraph
            body: >-
              对 Tessera 的产品来说，递送与编辑化学本身同样重要；体内疗法只有到达正确细胞才有用。由于 Gene Writers 以 RNA 形式递送，Tessera 将其配制进脂质纳米颗粒（LNPs）——与 mRNA
              疫苗同属一大类递送系统——而不是病毒载体。标准 LNP 会天然流向肝脏，适合以肝细胞为靶点的 AATD 项目。更难的问题，也是 Tessera
              声称差异化的关键，是肝外递送：到达肝脏以外的细胞。公司称其拥有专有递送平台，可把 LNP 递送至 SCD 项目所需的造血干细胞，以及体内 CAR-T 项目所需的 T 细胞。体内实现 HSC
              编辑尤其重要，因为常规体外路径（Casgevy 等获批疗法采用）需要动员干细胞、采集细胞、在实验室编辑，再经过骨髓清除性预处理后回输——流程艰难、昂贵且有毒性。如果 LNP 递送能直接在体内编辑 HSCs 和 T
              细胞，治疗流程就能去掉细胞采集、体外制造和预处理，从而简化给药、降低成本并扩大可及性。递送效率、生物分布、重复给药和具体脂质配方是平台价值的核心，但公开披露仅为部分信息。
            claimRefs: []
