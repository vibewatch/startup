      - CU013
  - id: FU003
    title: 客户验证矩阵：按合作伙伴评估证据质量
    type: matrix
    layout: wide
    summary: 按证据质量维度对每个具名合作关系做定性评分：承诺规模、交叉佐证、项目成熟度和商业（收入）证明。
    data:
      columns:
        - 承诺规模
        - 独立佐证
        - 项目成熟度
        - 商业 / 收入证明
      rows:
        - label: Regeneron（TSRA-196）
          values:
            - 高（$150M + $125M）
            - 强（多家媒体）
            - 临床期（首次人体试验）
            - 无（收入前）
        - label: Gates Foundation（SCD）
          values:
            - 中（最高 $50M）
            - 强（多家媒体）
            - 临床前
            - 无（使命资金）
        - label: ARPA-H（体内 CAR-T）
          values:
            - 中（最高 $41.3M）
            - 有限（主要来自公司）
            - 早期 / 临床前
            - 无（资助款）
        - label: 未来患者 / 支付方市场
          values:
            - 大（孤儿病一次性治疗）
            - 外部流行病学
            - 尚未推出
            - 尚无
    approximationNotes: 单元格是基于已披露交易条款和独立报道得出的定性判断；目前没有任何合作关系提供商业收入证明。
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU017
  - id: FU004
    title: 市场准入路径与报销障碍
    type: flow
    layout: wide
    summary: 一次性基因疗法必须跑通的报销与准入路径，并标注拖慢 Casgevy 等既有疗法的障碍，以及体内疗法特性可能如何缓解这些障碍。
    data:
      nodes:
        - id: approval
          label: 监管批准
          description: 关键性试验后，FDA/EMA 批准一次性基因疗法
        - id: pricing
          label: 定价与支付方谈判
          description: 百万美元级一次性定价（Casgevy 约 $2.2M）挤压传统精算模型
        - id: cgt
          label: 基于疗效的准入（CMS CGT Model）
          description: 集中谈判加疗效挂钩返利，目标是缓解 Medicaid 准入；机制新且复杂
        - id: centers
          label: 授权治疗中心
          description: 网络有限且地域集中；高需求患者承受出行和时间负担
        - id: logistics
          label: 治疗执行
          description: 体外疗法需要单采 + 白消安预处理；体内 LNP 目标是去掉这一环节
        - id: uptake
          label: 真实世界采用 / 通量
          description: Casgevy 获批约 2 年后，美国患者约 165 人——即便具备功能性治愈潜力，采用仍慢
      edges:
        - from: approval
          to: pricing
          label: 触发支付方覆盖决策
        - from: pricing
          to: cgt
          label: 推动新支付模式
        - from: cgt
          to: centers
          label: 覆盖路径把患者导向中心
        - from: centers
          to: logistics
          label: 以中心为基础给药
        - from: logistics
          to: uptake
          label: 负担压低通量
        - from: approval
          to: uptake
          label: 体内递送可能提高通量
    approximationNotes: 该路径和障碍来自 Casgevy/Lyfgenia 经验及 CMS CGT Access Model 设计；它们是 Tessera 未来商业化最相关的类比，不是 Tessera 的结果。
    claimRefs:
      - CU019
      - CU022
      - CU023
      - CU024
  - id: FR001
    title: 风险热力图：主要风险的发生可能性与影响
    type: matrix
    layout: wide
    summary: 对 Tessera 的主要风险按发生可能性、影响、缓释成熟度和剩余敞口做定性严重度评分。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: TSRA-196 临床失败
          values:
            - 中高
            - 高
            - 低（无人体数据）
            - 高
        - label: 平台 / 脱靶安全性
          values:
            - 中
            - 高
            - 中（无 DSB 设计）
            - 高
        - label: 监管临床暂停
          values:
            - 中
            - 高
            - 中（指引已知）
            - 中高
        - label: IP / 自由实施
          values:
            - 中高
            - 中高
            - 低（领域未定）
            - 中高
        - label: 竞争对手跃迁（Casgevy/Beam）
          values:
            - 高
            - 中高
            - 低
            - 高
        - label: 财务 / 现金跑道压力
          values:
            - 高
            - 高
            - 中（合作伙伴资本）
            - 中高
        - label: 合作伙伴（Regeneron）集中
          values:
            - 中
            - 高
            - 低
            - 高
    approximationNotes: 单元格是作者按已引用先例和披露事实校准的定性判断，不是量化概率；剩余敞口反映未披露的临床、财务和合同数据。
    claimRefs:
      - CR001
      - CR011
      - CR026
  - id: FR002
    title: 风险传导图：核心资产受挫如何扩散
    type: dag
    layout: wide
    summary: 单一根事件——TSRA-196 临床或安全性结果不利——如何沿合作关系、融资和平台可信度传导到公司。
    data:
      nodes:
        - id: root
          label: TSRA-196 安全性信号 / 疗效落空
          description: 核心项目首次人体读出不利，或 FDA 下达临床暂停
        - id: partner
          label: Regeneron 承诺面临风险
          description: 合作伙伴可能暂停、重谈或退出合作
        - id: funding
          label: 非稀释性融资合同
          description: 合作伙伴里程碑流失，提高对稀释性资本的依赖
        - id: runway
          label: 现金跑道压缩
          description: 烧钱压力加剧；进一步重组变得可能
        - id: platform
          label: 平台可信度受损
          description: 首次人体试验失败会让整个 Gene Writing 模态受到质疑
        - id: pipeline
          label: 管线去风险停滞
          description: SCD 和 CAR-T 项目失去验证外溢和合作伙伴兴趣
        - id: value
          label: 企业价值受损
          description: 集中在单一资产上的价值急剧下滑
      edges:
        - from: root
          to: partner
          label: 触发合作伙伴重新评估
        - from: root
          to: platform
          label: 模态受质疑
        - from: partner
          to: funding
          label: 里程碑流失
        - from: funding
          to: runway
          label: 现金缺口
        - from: platform
          to: pipeline
          label: 外溢至其他项目
        - from: runway
          to: value
          label: 困境折价
        - from: pipeline
          to: value
          label: 可选性丧失
    approximationNotes: 该图是示意性因果链，不是概率模型；每条传导的强弱取决于未披露的合同和现金数据。
    claimRefs:
      - CR001
      - CR016
      - CR026
  - id: FR003
    title: 依赖关系图：外部依赖与失败传导
    type: dag
    layout: wide
    summary: Tessera 依赖的关键外部条件，以及每个条件失效后如何传导到核心项目和企业价值。
    data:
      nodes:
        - id: regeneron
          label: Regeneron（核心资产合作伙伴）
          description: 为 TSRA-196 提供资金，并主导全球开发和商业化
        - id: funders
          label: Gates / ARPA-H（项目资助方）
          description: SCD 和 CAR-T 的里程碑门控非稀释性资本
        - id: cdmo
          label: 合同制造商（CDMO）
          description: GMP mRNA / 模板和 LNP 生产（未披露）
        - id: ip
          label: IP / 授权技术
          description: 编辑酶、递送和化学层面的自由实施
        - id: fda
          label: FDA（监管方）
          description: IND 放行、脱靶预期、临床暂停权限
        - id: lead
          label: TSRA-196 项目
          description: 大部分企业价值依赖的资产
        - id: value
          label: 企业价值
          description: 集中在单一合作核心资产
      edges:
        - from: regeneron
          to: lead
          label: 资金 + 治理
        - from: funders
          to: value
          label: 项目可选性
        - from: cdmo
          to: lead
          label: 临床供应
        - from: ip
          to: lead
          label: 自由实施
        - from: fda
          to: lead
          label: 批准 / 暂停权限
        - from: lead
          to: value
          label: 主要价值驱动
    approximationNotes: CDMO 和许可依赖是按该模态需求推断得出；具体交易对手和条款未披露，因此无法量化失败概率。
    claimRefs:
      - CR016
      - CR021
      - CR031
  - id: FV001
    title: 推荐逻辑：从证据到判断
    type: flow
    layout: wide
    summary: 从市场规模、平台验证、风险和估值支撑，推导出跟踪 / 继续研究建议的逻辑链。
    data:
      nodes:
        - id: market
          label: 市场与验证
          description: 孤儿 AATD/SCD 市场 + Regeneron、Gates、ARPA-H 验证
        - id: proof
          label: 临床证明
          description: 没有人体疗效 / 持久性数据；TSRA-196 刚进入首次人体试验
        - id: risk
          label: 风险画像
          description: 单一资产 / 合作伙伴集中、裁员、新模态监管门槛
        - id: valuation
          label: 估值支撑
          description: 2022 年 $1.7B 标记已过时；Regeneron 股权不透明；板块估值下调
        - id: synthesis
          label: 综合判断
          description: 强可选性被缺失的证明和不透明价格抵消
        - id: call
          label: 建议：跟踪 / 继续研究
          description: 在披露交易条款和 TSRA-196 读出干净后重新介入
      edges:
        - from: market
          to: synthesis
          label: 支撑上行
        - from: proof
          to: synthesis
          label: 限制信心
        - from: risk
          to: synthesis
          label: 抬高所需折价
        - from: valuation
          to: synthesis
          label: 2022 年标记缺乏价格支撑
        - from: synthesis
          to: call
          label: 净结论：跟踪，暂不买入
    approximationNotes: 这条链是定性决策辅助；节点权重反映作者判断，不是量化模型。
    claimRefs:
      - CV010
      - CV002
      - CV020
  - id: FV002
    title: 估值敏感性：不同情景隐含企业价值
    type: bar
    layout: wide
    summary: Tessera 在从下行到上行情景中的近似隐含企业价值（百万美元），展示临床和融资结果的敏感性。
    data:
      items:
        - label: 熊市情景（受挫 / 困境）
          value: 600
        - label: 保守基准
          value: 1200
        - label: 基准（持平于 2022 年）
          value: 1700
        - label: 牛市情景（PoC + 上轮融资）
          value: 2800
        - label: 拉伸情景（战略溢价）
          value: 4000
    approximationNotes: 数值是以百万美元计的示意性情景中点，不是推导出的 DCF；它们框定可比区间和 2022 年标记，并以未披露交易和临床数据为条件。
    claimRefs:
      - CV012
      - CV013
      - CV014
  - id: FV003
    title: 估值 / 回报区间（十亿美元）
    type: range
    layout: wide
    summary: 在明确假设下，Tessera 的企业价值和退出区间从低到高排列，单位为十亿美元。
    data:
      items:
        - label: 隐含当前 EV（以 Regeneron 为锚）
          low: 0.8
          high: 2.5
          mid: 1.6
        - label: 3 年退出——基准情景
          low: 1
          high: 3
          mid: 1.8
        - label: 3 年退出——牛市情景
          low: 3
          high: 6
          mid: 4
    approximationNotes: 区间受情景约束，且排除未知的普通股稀释 / 优先权影响；它们是框架区间，不是点预测。
    claimRefs:
      - CV003
      - CV012
      - CV014
  - id: FV004
    title: 投资 KPI：IC 可用评分卡
    type: kpi
    layout: wide
    summary: 对驱动推荐的各维度做定性 IC 评分卡，适用时按 0–10 分打分。
    data:
      items:
        - label: 市场机会
          value: 7 / 10
        - label: 临床证明 / 验证
          value: 4 / 10
        - label: 护城河 / 差异化
          value: 6 / 10
        - label: 单位经济
          value: N/A (pre-revenue)
        - label: 风险画像（越高 = 越安全）
          value: 3 / 10
        - label: 估值支撑
          value: 4 / 10
        - label: 证据质量
          value: 5 / 10
    approximationNotes: 分数是作者按章节证据校准的判断；它们概括底层主张和尽调问题，但不能替代后者。
    claimRefs:
      - CV020
      - CV021
      - CV022
