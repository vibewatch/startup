  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Gene Writing 平台与 TPRT 机制
        blocks:
          - type: paragraph
            body: >-
              Tessera 的核心产品是 Gene Writing 平台，这是一类体内基因组改造工具。公司从自然界的「移动遗传元件」中挖掘出这套工具——例如 non-LTR
              反转座子这类序列，它们进化出把自身复制并粘贴进基因组的能力。Gene Writing 不像 CRISPR-Cas9 核酸酶那样切开 DNA、再依赖细胞修复机制，而是借助靶引发逆转录（TPRT）直接改写序列。在
              TPRT 中，「Gene Writer」蛋白与编码目标改动的模板 RNA 形成复合体；复合体结合特定基因组位点，切开单条 DNA 链以暴露 3' 引物，并在目标位点把 RNA 模板逆转录成
              DNA。由于只切开一条链，该过程避开了可能导致易位、大缺失和基因组不稳定的双链断裂。写入载荷覆盖完整遗传变化谱：单碱基校正、小插入和缺失，或以 kilobases
              计的整基因插入，因此平台可用于多种单基因病。关键在于，Gene Writer 及其模板可以完全以 RNA
              形式供给，这意味着疗法可配成脂质纳米颗粒并非病毒递送，绕开腺相关病毒载体的载荷大小限制和免疫原性顾虑。该机制是 Tessera 管线中每个项目的基础，也是公司的核心技术差异化。
            claimRefs: []
