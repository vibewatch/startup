      - number: '7.7'
        title: 展示
        blocks:
          - type: callout
            title: 同业基本概率：Tome Biosciences 于 2024 年关停
            body: >-
              校准 Tessera 风险画像时，最冷静的参照是最接近的概念同业。Tome Biosciences 于 2023 年末带着 $213 million 启动，其「programmable genomic
              integration」平台概念上类似 Gene Writing——大载荷、无双链断裂插入；但在 2024 年，随着投资者对临床前基因编辑兴趣降温，公司融资失败也未找到买家，提交 WARN 通知，计划裁掉几乎全部
              131 名员工。教训不是 Tessera 一定会走 Tome 的路——Tessera 拥有大型药企伙伴、赠款资本和进入临床的资产，这些 Tome 没有——而是科学新颖性无法让临床前 Gene Writing
              公司免受资本市场冲击。Tessera 自身连续三年裁员显示同样压力已经存在，因此现金、跑道和 Regeneron 合作的持久性是决定性尽调问题。
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR030
          - type: callout
            title: 监管与 IP 逆风是类别级，不只是公司级
            body: >-
              Tessera 两项最大风险由整个基因编辑领域共同承担。第一，FDA 2024–2026 年基因组编辑指南要求敏感、基于 NGS 的脱靶刻画，并给监管机构实施临床暂停的清晰依据；CAR-T
              加框警告事件也显示，单一事后安全信号可以重估整个模态。第二，2025 年 5 月 Federal Circuit 将 CRISPR-Cas9
              优先权争议发回重审，重新打开基础编辑专利归属问题，并留下碎片化全球格局，为每个开发者抬高 FTO 和许可不确定性。Tessera 独特的非 CRISPR 写入机制提供部分隔离，但仍依赖递送和酶
              IP，也必须跨过同一监管门槛。承销方应把这些视为随领域一起移动的系统性风险，并相应权衡公司特有缓释因素（资格认定、伙伴资本、无 DSB 设计）。
            calloutType: insight
            claimRefs:
              - CR011
              - CR012
              - CR014
              - CR015
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最后已知估值——2022 年 Series C 锚点
        blocks:
          - type: paragraph
            body: >-
              Tessera 只有一个确凿估值点，而且已经超过四年。2022 年 4 月，公司完成超过 $300 million 的 Series C，由 GV（Google Ventures）领投，Casdin
              Capital 与 Leaps by Bayer 参与，投后估值约 $1.7 billion。该轮把累计融资推到约 $500 million 以上，也让 Tessera
              成为同代私有基因医学平台里资本最充足的公司之一。关键在于，这个价格定在 2021–2022
              年生物科技融资泡沫顶点，之后行业经历多年调整，因此它更像高水位参照，而不是当前公允价值。此后公司没有公开披露新的定价股权轮，意味着 Tessera 股权四年多没有独立价格发现——这对临床阶段 biotech
              来说间隔异常长。作为私有公司，Tessera 也不披露 cap table 细节，排在普通股之前的清算优先权、反稀释条款以及任何累计股息都未知。承销方应把 $1.7 billion
              当作几乎肯定高估当前价值的锚点：需要证明公司今天仍值这个价格，而不是反过来证明折价合理。
            claimRefs: []
      - number: '8.2'
        title: 隐含当前估值——解读 Regeneron 交易
        blocks:
          - type: paragraph
            body: >-
              最近最有信息量的信号，是 2025 年 12 月 Regeneron 围绕 AATD 项目 TSRA-196 达成的合作。Regeneron 承诺 $150 million
              首付款——表述为现金和股权投资的组合——另有最高 $125 million 近期和中期里程碑；两家公司按 50/50 分担全球开发成本和利润。由一线 pharma
              做出这个规模的战略股权投资，是真正的验证事件，也实质延长了 runway。但现金与股权的拆分、每股价格以及隐含的 pre-money 估值均未披露，因此不能把这笔交易换算成干净的股权标记。可推断的范围很宽：相对于
              2022 年 $1.7 billion 的投后估值，$150 million 首付款既可能对应一个 flat-to-down
              估值下的小额少数股权，也可能在大部分首付款并非股权时指向更高估值。交易结构——Tessera 负责首次人体试验，Regeneron 负责后续全球开发——也把价值集中到一个 partnered asset
              和一个交易对手上，买方必须把这一点与验证价值一起权衡。坦率地说，Regeneron 交易支持当前企业价值落在约 $0.8–2.5 billion 区间，中点不高于 2022
              年估值；若要收窄区间，股权条款是最有价值的缺失输入。
            claimRefs: []
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV003
              - CV012
              - CV014
      - number: '8.3'
        title: 可比公司——受情绪驱动的宽区间
        blocks:
          - type: paragraph
            body: >-
              Tessera 尚未产生收入，最能站住脚的外部参照是公开市场基因编辑同业，应按企业价值可比而不是倍数来读。截至 2026 年 6 月，CRISPR Therapeutics 市值约 $5.2
              billion，受首个获批 CRISPR 疗法 Casgevy 支撑；Beam Therapeutics 约 $3.5 billion，Intellia 约 $2.5 billion，Prime Medicine
              约 $0.6 billion。价差本身就是结论：四家大体可比的编辑平台横跨一个数量级，几乎完全由临床阶段、现金状况以及市场对各技术路线的情绪驱动。这些同业都已上市，提交经审计的
              10-K，而且除早期公司外均有人体临床数据，Tessera 尚不具备，因此无法直接类比。其上还叠加了全行业 de-rating：融资寒冬延续后，基因编辑股票已大幅低于 2021
              年峰值，临床前和早期临床平台的倍数压缩最明显。综合来看，Tessera 的私有公允价值更可能位于这条公开区间的下半部——Regeneron 验证和平台广度使其高于 Prime 不到 $1 billion
              的水平，但低于已有临床验证的中型市值公司；只有在认可平台可选性、且公开市场当前低估这一点时，它才大致接近 2022 年估值。
            claimRefs: []
