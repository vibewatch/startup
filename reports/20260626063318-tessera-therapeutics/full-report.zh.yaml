      - number: '3.2'
        title: CRISPR、Base 与 Prime Editing 竞争者
        blocks:
          - type: paragraph
            body: >-
              资源最充足的竞争者使用 CRISPR 衍生编辑，而不是移动元件 Gene Writing，其中几家远远领先 Tessera。Beam Therapeutics 是威胁最大的单一同行：其 BEAM-302
              是肝脏靶向 LNP base editor，设计为对 PiZ（E342K）SERPINA1 突变进行一次性 A-to-G 修正——这正是 Tessera TSRA-196 瞄准的 alpha-1
              antitrypsin deficiency 靶点——并且已经处于 Phase 1/2 剂量探索试验，领先 Tessera 项目。Beam 还运营 risto-cel（BEAM-101），一款处于 Phase
              1/2 的离体 base-edited 镰状细胞病疗法；同时还有一个体内 HSC LNP 编辑研究项目，与 Tessera 的镰状细胞病雄心相互映照。体内 CRISPR 领导者 Intellia
              Therapeutics 有两个 Phase 3 项目：治疗 transthyretin amyloidosis 的 nex-z（nexiguran ziclumeran）和治疗 hereditary
              angioedema 的 lonvo-z（lonvoguran ziclumeran）；与 Tessera 一样，它也和 Regeneron 合作，后者分担 ATTR 项目 25%
              开发成本和利润，并独立推进一个源自 Intellia 的 hemophilia B 项目。Prime Medicine 在血液学、免疫学、肝脏和肺部推进 prime editing。CRISPR
              Therapeutics 与 Vertex 销售 Casgevy。Editas Medicine 终止离体 reni-cel 镰状细胞项目，转向体内编辑（用于降低 LDL-C 的
              EDIT-401）。Metagenomi 和 Arbor Biotechnologies 从宏基因组和新型 CRISPR / integrase 系统中挖掘体内编辑工具。机制上，base editor 和
              prime editor 擅长小而精准的修正，但不能插入完整基因；Tessera 的 TPRT writing 声称能实现大载荷、位点特异插入——只有在临床中证实，这才是优势。
