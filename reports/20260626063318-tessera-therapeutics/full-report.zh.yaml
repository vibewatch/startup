        title: 燃烧率、跑道与重组信号
        blocks:
          - type: paragraph
            body: >-
              Tessera 不披露手头现金、月度消耗或跑道，这些只能估算，或在尽调中取得。最有信息量的公开信号是公司的重组节奏：独立报道记录了连续三年裁员——2024 年裁 13%，2025 年裁 17%，2026 年 1
              月宣布再裁约 35%（约 90 人），受影响员工多数在 Massachusetts，离职计划于 2026 年 3 月开始。2026 年 1 月行动后，公司预计保留约 160 名员工。管理层称裁员是为了保留能力，把
              Regeneron 资助的 AATD 项目推进临床，同时维持核心 Gene Writing
              工作；但一家尚无收入的生物科技公司连续多年裁员，通常就是跑道承压和资本纪律收紧的信号。员工规模相近的临床期基因编辑公司通常每年烧掉约 $50–150 million，这意味着 Tessera 在 2026
              年前的消耗很可能已经吃掉已融资资本中的相当一部分，而 Regeneron 的前期款明显拉长了跑道。时点也说明问题——裁员在 Regeneron
              交易后约一个月宣布，显示该合作既是验证事件，也是把支出重新聚焦到单一伙伴资助资产上的触发器。没有披露现金余额，精确跑道仍是尽调缺口。
