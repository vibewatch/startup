        - ARPA-H 资助（给 Tessera $41.3M）；NIH 资助；未来肿瘤中心预算
        - 临床前开发 → IND → Phase 1 → IND 扩展至肿瘤 / 自身免疫 → 商业开发
        - ARPA-H 项目预算；Tessera 内部 R&D 预算
        - 临床前疗效数据；ARPA-H 里程碑完成；未来 IND 放行
      - - 体内 CAR-T – 未来商业化（2029+）
        - 肿瘤中心和医疗系统（商业化后）
        - 对现有 CAR-T 或生物制剂无反应的难治癌症 / 自身免疫患者
        - 商业支付方；Medicare；肿瘤打包支付项目
        - FDA 批准 → 纳入肿瘤处方集 → 治疗中心认证 → 输注
        - 医院肿瘤服务线预算；支付方处方集委员会
        - FDA 批准；证明每例治愈成本低于体外 CAR-T；疗效可比当前已获批产品
    notes: 买方角色和采用路径基于当前基因疗法商业模式（Casgevy/Lyfgenia）以及 TSRA-196 的监管认定。体内 CAR-T 商业路径仍属前瞻判断，不确定性很高。
