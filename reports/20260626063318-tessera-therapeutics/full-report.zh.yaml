  productSummary: >
    Tessera 的核心资产是 Gene Writing 平台。该平台使用可移动遗传元件——天然存在、能够移动并插入 DNA 的生物系统——并将其工程化以获得治疗级精度。平台支持 RNA writing（type II-B）、DNA
    writing（type II-C）和 retron writing 机制，每种机制都能在不造成 DNA 双链断裂的情况下完成 >10 kb 载荷的位点特异插入，这是相对 CRISPR 路线的关键安全优势。体内递送使用
    Tessera 自有 LNP 配方。领先项目 TSRA-196 修正导致 alpha-1 antitrypsin deficiency（AATD）的 SERPINA1 突变；截至 2026 年初，Phase 1/2
    临床试验已在进行。镰状细胞病（SCD）项目获得 Gates Foundation 支持（$50M，2024 年 12 月）。面向实体瘤的体内 CAR-T 项目获得 ARPA-H EMBODY 资助（$41.3M）。
