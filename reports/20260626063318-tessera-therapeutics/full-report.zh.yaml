            title: 连续三年裁员显示跑道承压
            body: >-
              最重要的财务信号不是资产负债表项目——因为没有公开资产负债表——而是 Tessera 的重组节奏。独立报道记录了 2024 年裁员 13%、2025 年裁员 17%，以及 2026 年 1 月裁员约 35%（约
              90 人）。一家尚无收入的 biotech 连续三年缩减人头，不管公司如何表述，都是在有限现金下管理消耗。2026 年 1 月行动发生在 Regeneron
              交易约一个月后，说明该合作让管理层能够围绕单一伙伴资助资产（TSRA-196）重新聚焦支出，同时降低 SCD 和体内 CAR-T 项目优先级。承销方应把未披露的现金、消耗和跑道视为闸门级尽调项。
