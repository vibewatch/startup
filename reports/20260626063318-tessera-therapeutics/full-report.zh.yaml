      - number: '7.5'
        title: 财务与运营风险
        blocks:
          - type: paragraph
            body: >-
              最清晰的公司特有风险信号是财务。Tessera 已连续三年裁员——2024 年约 13%，2025 年 17%，2026 年 1 月约 35%（约 90 人）——留下约 160
              名员工。在尚无收入的生物科技公司中，多年裁员节奏说明持续燃烧压力，也说明公司有意围绕伙伴资助的 AATD 项目收窄范围，更早期的 SCD 和 CAR-T
              工作显然被降低优先级。公司是私有企业，不披露现金余额、燃烧率或跑道，因此外部无法量化融资约束的严重程度；Regeneron 前期款（$150 million
              现金加股权）实质性拉长了跑道，但持续时间未知。运营上，制造和供应风险真实存在但未披露：体内基因组写入产品需要 GMP 生产 mRNA / 模板载荷和临床级
              LNP，并严控质量、效价和生物分布；任何制造、可比性或放行失败都可能延误首次人体项目。关键人风险集中在 CEO Michael Severino 和 Executive Chairman / co-founder
              Geoffrey von Maltzahn，反复重组会提高稀缺 Gene Writing 和递送人才流失风险。同业基本概率也给出警示：Tome Biosciences 融资失败后在 2024 年裁掉几乎全部
              131 人团队，说明投资者情绪转向时，临床前基因编辑公司的资本通道可以迅速消失。
            claimRefs: []
