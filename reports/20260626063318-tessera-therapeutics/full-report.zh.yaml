      - number: '2.3'
        title: 买方、支付方与工作流分层
        blocks:
          - type: paragraph
            body: >-
              Tessera 运行在生物科技药物模型中，商业路径涉及多个角色且分工不同：监管机构是工作流守门人，专科医生是处方权威，支付方和医疗系统是经济买方，患者是终端用户，Regeneron 等合作伙伴是渠道和融资赋能方。

              **监管机构：** FDA 是主要工作流守门人。TSRA-196 已获得 Fast Track 和 Orphan Drug 认定，因此具备加速审评、滚动提交潜力，以及获批后七年市场独占资格。Orphan Drug
              适用于影响美国患者少于 200,000 人的罕见病（AATD 美国人群：约 100,000；PiZZ 子集：约 60,000–70,000）。这些认定降低开发成本，也可能加快监管时间线，但不保证获批。

              **专科医生：** 呼吸科医生和肝病医生治疗 AATD。血液科医生和肿瘤科医生服务 SCD 患者。一次性基因疗法的处方群体集中在具备专业制造能力和患者监测能力的学术医学中心。Casgevy 在美国有 9
              家治疗中心；Lyfgenia 有 27 个合格站点。基础设施建设是实质性采用摩擦；Tessera 基于 LNP
              的非病毒递送路线，设计上可在更广范围给药，不需要离体路线所需的细胞工程设施。一旦得到证实，这会成为采用差异点。

              **支付方：** 商业保险和 Medicaid 是美国主要支付方。Medicaid 覆盖了不成比例的 SCD 患者（主要是低收入黑人美国人）。Casgevy 和 Lyfgenia
              正在开创按结果付费的合同——付款与疗效持久性绑定；在 Medicaid 环境中，任何 AATD 或 SCD 基因疗法都需要这种安排。ICER 认为 Casgevy 和 Lyfgenia 在
              $1.35M–$2.05M 的价格下可达到成本效果阈值，并建议定价靠近低端。现有 AATD 增补市场（约 $200K / 患者 / 年，终身）为 AATD
              基因疗法的支付方谈判提供每生命年成本锚。欧洲支付方（NICE、HAS 等）将要求单独 HTA 申报。

              **患者：** Vertex 估计约 16,000 名美国 SCD 患者符合基因疗法条件。TSRA-196 的 AATD 患者资格是伴肺部疾病的 PiZZ 纯合体——这是约 100,000
              名美国已诊断患者的一个子集（仍有很多未诊断）。患者是否愿意接受高强度预处理调理，是 SCD 已知摩擦点（离体疗法需要化疗调理）。若 Tessera 的体内 LNP
              路线成功证明可重复给药，就能避免调理，因此可能触达合格人群中大得多的部分。

              **合作伙伴和融资赋能方：** Regeneron 是 Tessera 在 AATD 上的主要商业合作伙伴：共同开发 TSRA-196，主导全球 Phase 2/3 和商业化，并贡献 $150M
              预付款加里程碑付款，换取全球利润 50/50 分成。Gates Foundation（$50M 承诺）是 SCD 的融资和准入赋能方，明确任务是全球可负担，而不是美国高价定价。ARPA-H 的 EMBODY
              奖励（$41.3M）对体内 CAR-T 扮演类似角色——在商业市场出现之前，用政府资助研发解决制造经济性。

              **预算动态：** AATD 方面，商业保险和 Medicaid / Medicare 持有增补疗法预算（持续 $200K / 年）；若临床持久性成立，支付方有理由按净现值接受 $2M–$3M
              的一次性治愈。SCD 方面，Medicaid 准入问题更尖锐：Biden / Harris 政府 2024 年试点按结果付费安排，推动 Medicaid 为一次性疗法报销；这一政策环境可能影响未来 AATD
              项目谈判，但也带来不确定性。体内 CAR-T 方面，经济买方是使用 ARPA-H 和 NIH 支持基础设施的肿瘤中心与医疗系统；商业市场经济性尚未确定。
