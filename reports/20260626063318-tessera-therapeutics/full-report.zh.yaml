      - number: '4.3'
        title: 收入模式与合作经济性
        blocks:
          - type: paragraph
            body: >-
              Tessera 仍处于商业化前阶段，没有产品收入、获批产品或经常性销售。其近期「收入」更应理解为融资流入：合作前期款、或有里程碑款、利润分成权和赠款拨付。Regeneron
              合作是变现模式的核心。按条款，Regeneron 支付 $150 million 前期款（现金加股权）和最高 $125 million 里程碑款；两家公司按 50/50 平分 TSRA-196
              的全球开发成本和未来利润。Tessera 负责首次人体试验；Regeneron 负责后续全球开发和商业化。该结构把 Tessera
              的平台研发当下转成现金和或有未来利润流，同时把后期成本和商业执行交给更大的伙伴。Gates Foundation 承诺的最高 $50 million 与里程碑和使命绑定，不是市场交易；ARPA-H 的最高
              $41.3 million 是政府开发资助。传统意义上的销售周期、获客成本或渠道经济性，Tessera 均未披露；最接近「销售动作」的是把平台数据转化为合作的 BD 能力，Regeneron
              交易证明了这一点。对比来看，Regeneron 其他编辑押注——Intellia 以及 2024 年 Mammoth Biosciences 交易（$100 million 前期款、最高 $370 million
              里程碑款）——显示该伙伴对体内编辑有真实胃口，也为 Tessera 条款提供了参照。
