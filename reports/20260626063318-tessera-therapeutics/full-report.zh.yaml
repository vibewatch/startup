      - number: '7.6'
        title: 伙伴 / 依赖风险、缓释因素与论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              Tessera 最尖锐的依赖是 Regeneron。领先临床资产 TSRA-196 由 2025 年 12 月合作资助并部分约束，Regeneron 负责后续全球开发和商业化；Regeneron
              若退出、重谈或降低优先级，将拿走公司主要的非稀释性临床资金来源和最清晰商业路径。次级依赖包括 Gates Foundation（SCD）和 ARPA-H（体内
              CAR-T），这些按里程碑触发的承诺若在重组后项目滑坡，可能失效；另有未披露的合约制造商和授权知识产权依赖。风险对面也有真实缓释因素：大型药企伙伴和两个使命 / 政府资助方提供大量非稀释性资本；TSRA-196
              具备孤儿病经济性，以及可加速审评的 Fast Track 和 Orphan Drug 资格；体内、LNP 设计意在避开拖慢体外疗法的单采和 busulfan 预处理毒性。关键监测指标包括 TSRA-196
              首次人体安全性和疗效读出、任何 FDA 临床暂停、Regeneron 与 Gates/ARPA-H 承诺是否延续，以及进一步重组。合理的论点破裂触发器包括 TSRA-196
              出现严重安全信号或临床暂停、Regeneron 退出、追加裁员或以困境条款融资，或出现不利 FTO 进展。核心尽调问题是 Regeneron 合同条款（排他性、终止）、现金 / 燃烧率 / 跑道、专利 / FTO
              位置，以及 2026 年 1 月裁员后的项目级状态。
