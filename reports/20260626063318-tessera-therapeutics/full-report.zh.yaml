      - number: '7.3'
        title: 监管与法律 / IP 风险
        blocks:
          - type: paragraph
            body: >-
              Tessera 所处的是生物医学中监管最活跃、诉讼最多的领域之一。监管侧，FDA 于 2024 年 1 月敲定了关于含基因组编辑的人类基因疗法产品指南，并在 2026
              年发布草案指南，建议对体外和体内产品的脱靶编辑进行基于下一代测序的安全评估。这些要求抬高 IND 受理的证据门槛；如果脱靶刻画被认为不足，FDA 有明确依据实施临床暂停，这对首次人体体内 writer
              构成直接项目级风险。CAR-T 先例值得参考：2024 年初，FDA 要求全类别加框警告，提示继发性 T 细胞恶性肿瘤，显示事后安全信号如何重塑整个模态的标签和风险认知（随着经验积累，FDA 后来在 2025
              年移除 CAR-T 的 REMS）。法律 / IP 侧，基础基因编辑专利格局仍未稳定：2025 年 5 月，U.S. Court of Appeals for the Federal Circuit 撤销
              PTAB 2022 年将 CRISPR-Cas9 优先权授予 Broad Institute 的决定并发回重审，重新打开关键真核编辑专利归属问题，也留下碎片化全球格局。Tessera 的写入机制虽不同于
              CRISPR 核酸酶，但临床前平台仍需要在递送（LNP）、酶和编辑化学上拥有持久 FTO；该领域广泛不确定性会推高许可成本和诉讼风险。Tessera 自身专利组合及依赖的任何第三方许可并未完全公开，因此 FTO
              是关键尽调缺口。
