      - number: '2.2'
        title: 市场规模：TAM、SAM 与约束视角
        blocks:
          - type: paragraph
            body: >-
              多个分析视角都指向 2026 年约 $10 billion 的全球基因治疗市场，并以 19–21% 的复合年增长率扩张。Mordor Intelligence（2026 年 2 月更新）估计 2025 年为
              $9.74B、2026 年为 $10.04B，并以 20.86% CAGR 增长至 2031 年的 $25.89B。Grand View Research 估计 2024 年市场为 $6.45B，以 18.88%
              CAGR 增至 2030 年的 $18.20B。MarketsAndMarkets 以 $8.85B 作为 2024 年基数，预计到 2032 年 CAGR 为
              19.4%（$36.55B），其口径更宽，纳入进入商业规模的体内基因编辑增量。这些估算分歧来自范围差异：有些纳入 CDMO 服务收入并使用标价，有些排除体内编辑。本分析全篇采用 Mordor
              数字（$10.04B，2026 年）作为基准 TAM，并把其他区间作为边界。

              Tessera 的可服务可获得市场被限制在三个疾病领域；这些领域有明确患者人群和具体市场类比：

              **AATD（领先项目，IND 于 2026 年 1 月获批）：** Alpha-1 Foundation 估计美国约 100,000 名患者、欧洲约 100,000 名患者。在美国人群中，最严重、适合
              TSRA-196 的 PiZZ 纯合亚型估计约 60,000–70,000 人，不过很多人尚未确诊。现有标准治疗——年度增补疗法市场——估计全球约 $1.9B，基于 Prolastin-C 和同类产品在 2026
              年中价格下每名患者每年约 $200,000–$205,000。若 AATD 治愈型基因疗法按 SCD 疗法类比定价（单次 $2M–$3M），美国合格患者生命周期内潜在累计可获得收入可达
              $120–$210B；但更现实的 SAM 模型需要计入治疗采用率、诊断率（约 10% 美国 AATD 患者被诊断）以及支付方支付意愿基准。若项目成功，商业化头十年潜在市场约 $1B–$3B。

              **SCD（体内项目，截至运行日为 pre-IND）：** CDC 估计美国约 100,000 名患者；WHO 记录 2021 年全球有 7.74 million 名 SCD 患者。Vertex 估计约
              16,000 名美国患者符合已批准基因疗法条件（最重症类型）。Casgevy 在 2025 年创造 $115.8M 收入，标价 $2.2M / 患者，约 64 名患者完成输注。Vertex 和 CRISPR
              Therapeutics 预计 2026 年 Casgevy / Journavx 合计收入接近三倍增长（合计 $500M）。Tessera 的 SCD 项目瞄准的是不同人群路径——全球可及性（SCD 负担
              80% 在撒哈拉以南非洲）和可重复给药的体内递送——而不是现有美国基因治疗准入模型。估算全球可及市场带有投机性；Gates Foundation 的 $50M
              投资明确是为了开发「全球可及」疗法，而非直接押注美国市场。若按 Casgevy / Lyfgenia 可服务人群口径，美国单一 SAM 长期可达约 $30–50B（每次治愈
              $2M–$3M），但这是上限数字，未计入支付方压价、Medicaid 障碍和全球可及定价。

              **体内 CAR-T（ARPA-H 项目，截至运行日为临床前）：** 现有离体 CAR-T 市场 2025 年全球规模为 $5.82B，并以 18.06% CAGR 增长至 2033 年估计
              $22.36B（Grand View Research）。体内 CAR-T 尚未商业化，也没有作为独立市场被定价。ARPA-H EMBODY 计划的逻辑——消除每剂 $100K+
              制造成本和数周等待——意味着这是一个成本创新市场，商业论点不在价格溢价，而在扩大治疗量和可及性。

              没有分析师发布过 Tessera 专属的独立 SAM 或 SOM 数字。公司未披露商业计划、上市时间表、定价策略或里程碑收入目标，因此无法从公开数据中拆出 SOM。TSRA-196 处于 Phase 1（IND
              于 2026 年 1 月获批）；SCD 项目为 pre-IND；CAR-T 项目为临床前。现实 SOM 取决于 Phase 1/2 临床成功、NDA 申报、获批和商业上市——从当前状态看，AATD
              时间线无法压缩到 4–6 年以下，其他项目更久。
