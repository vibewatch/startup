            title: Casgevy 先例才是真正的客户测试
            body: >-
              最有信息量的客户证据不来自 Tessera，而来自既有基因疗法市场。Casgevy 是首个获批用于 SCD 的 CRISPR 疗法，定价接近 $2.2 million，获批约两年后仅覆盖约 165
