      - number: '5.2'
        title: 写入模态与管线资产
        blocks:
          - type: paragraph
            body: >-
              Gene Writing 不是单一酶，而是覆盖多种分子模态的平台，每种模态服务不同编辑任务。Tessera 描述的 RNA 模板写入系统可通过 TPRT 插入或校正序列，并辅以利用平台蛋白-RNA
              机器在指定位置写入的方法；统一特征是 RNA 编码、无 DSB、位点定向插入。这些模态对应三个已披露疾病切入点。领先资产 TSRA-196 靶向 alpha-1 antitrypsin
              deficiency（AATD），通过校正肝脏中的 SERPINA1 突变，恢复有功能的 alpha-1 antitrypsin 蛋白，并与 Regeneron
              合作开发。第二个项目针对镰状细胞病（SCD）——全球最常见的致死性单基因病，由 beta-globin（HBB）突变导致——通过体内编辑造血干细胞（HSCs）来治疗。第三个项目把平台用于体内
              CAR-T，直接在体内 T 细胞中插入嵌合抗原受体，生成有功能的 CAR-T 细胞，无需体外制造。每个项目都是同一写入与递送平台的不同「用法」：AATD 项目是在肝细胞中做精准校正，SCD
              项目是在难以触达的干细胞区室内编辑，CAR-T 项目是在免疫细胞中插入大载荷。编辑类型和目标组织的广度，是平台的战略论点；但只有 TSRA-196 进入临床，SCD 与 CAR-T 项目仍处于临床前。
            claimRefs: []
