      - number: '1.3'
        title: 资本基础、投资人与战略合作
        blocks:
          - type: paragraph
            body: >-
              Tessera 已披露的股权融资历史由两轮大型机构融资构成。2021 年 1 月 12 日，公司宣布完成超过 $230 million 的 Series B 融资，由 Alaska Permanent Fund
              Corporation、Altitude Life Science Ventures 和 SoftBank Vision Fund 2 共同领投，Qatar Investment Authority
              等参投。Flagship Pioneering 当时表示，会把其总出资提高到 $60 million。2022 年 4 月 19 日，Tessera 宣布完成超过 $300 million 的 Series C
              融资，投资方财团包括 Abu Dhabi Investment Authority 的全资子公司、Alaska Permanent Fund、Altitude Life Science
              Ventures、ARTIS Ventures、Cormorant Asset Management、Flagship Pioneering、Hanwha Impact Partners、Longevity
              Vision Fund、March Capital、SALT Fund、SoftBank Vision Fund 2 和 T. Rowe Price Associates 等。Series B 与 C
              合计已披露股权融资超过 $530 million；除 Flagship 的 $60 million 外，留存来源未单独披露 Series A 金额。

              股权之外，公司还拿到了慈善和政府支持。2024 年 12 月 18 日，Tessera 宣布与 Bill and Melinda Gates Foundation 达成协议，后者最多投资 $50
              million，共同资助公司体内镰状细胞病项目。2025 年 10 月 8 日，ARPA-H 在 EMBODY 计划下向 Tessera 授予最高 $41.3 million，用于支持体内 CAR-T
              疗法开发。2025 年 12 月 1 日，Regeneron Pharmaceuticals 与 Tessera 宣布全球合作开发 TSRA-196；Tessera 收到 $150
              million，包含预付款现金和股权投资，并有资格获得最高 $125 million 的近期和中期开发里程碑付款。Tessera 将主导初始 first-in-human 试验，Regeneron
              主导后续全球开发和商业化。两家公司按 50/50 分担全球开发成本和未来利润。公司估值、收入和 ARR 均未公开披露。
