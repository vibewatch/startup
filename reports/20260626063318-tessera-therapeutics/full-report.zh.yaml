      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              **增长驱动因素** 贯穿体内遗传医学赛道，既有科学层面，也有结构层面。最直接催化剂是首款体内 CRISPR 药物正接近 FDA 批准：Intellia Therapeutics 的 lonvo-z 于 2026
              年 4 月在遗传性血管性水肿 Phase 3 试验成功，相比安慰剂减少 87% 肿胀发作。若 2027 年上半年获批，lonvo-z
              将成为首个获批的体内基因编辑产品——验证监管对机制的接受度，建立处方医生和支付方熟悉度，并扩展有利于所有体内路线的市场基础设施，包括 Tessera 的 TPRT 平台。

              Tessera 自身临床里程碑是二阶驱动因素：TSRA-196 于 2026 年 1 月获得 IND 放行，标志着史上首个体内 TPRT 基因组编辑疗法进入临床。这是区别于 CRISPR
              的机制里程碑，扩展了体内编辑工具箱，也证明基因写入机器的非病毒 LNP 递送具备可行性。FDA Fast Track 和 Orphan Drug 认定带来加速开发路径和市场独占激励。

              非病毒、可重复给药的递送是结构性差异点，也是增长赋能因素。离体基因疗法（Casgevy、Lyfgenia）需要不可逆的干细胞调理，且是一次性流程；化疗调理带来不孕风险并限制合格人群。基于 LNP
              的体内递送——若证明可重复给药且准确——将扩大可服务人群，降低流程复杂度，并治疗无法接受调理的患者。ARPA-H 的 EMBODY 逻辑在 CAR-T
              上直接复现这一点：消除离体制造，以降低成本、扩大可及性并缩短等待时间。

              全球可及性论点是超出典型罕见病市场测算的增长驱动因素。撒哈拉以南非洲承载全球约 80% SCD 负担（WHO 2021 年数据：每年 515,000 名新生儿）。Gates Foundation 给
              Tessera SCD 项目的明确任务，是在资源有限环境中开发可及疗法；若实现，这代表的是数千万患者市场，当前 $2M–$3M 的基因疗法无法覆盖。它是否能转化为商业回报（相对于慈善补贴准入），仍是尽调问题。

              **采用约束** 很实在，不能低估。2026 年基因治疗的 FDA 监管气候波动很大：REGENXBIO 一款疗法因安全疑虑在 2026 年 2 月被拒；Sarepta 的 Elevidys
              销售随着报销覆盖收窄进一步下滑。FDA 领导人 Marty Makary 和 Vinay Prasad 于 2026
              年初离任，在继任领导上任前造成一段监管不确定期。累积效果是，临床阶段基因治疗公司面对更高安全门槛和证据审查，尤其是 TPRT 这类没有先例的新机制。TSRA-196 和体内 SCD 项目走的是「first of
              kind」监管路径——既是竞争差异点，也是开发风险。

              一次性基因疗法的支付方经济性仍然棘手。Casgevy 2024 年采用缓慢（首年仅 $10M
              收入）说明，监管批准与商业牵引之间存在落差。收入只有在输注时才确认——通常比患者启动晚数月；支付方授权流程、专科中心可用性和患者决策犹豫都会造成大量摩擦。截至 2026 年初，约 90% 美国患者已可获得
              Casgevy 报销准入，但这是获批后 24 个月才做到的。任何 AATD 基因治疗项目都会遇到类似动态。

              制造规模和 LNP 优化是竞争前约束。Tessera 的非病毒 LNP
              递送平台需要在规模化条件下实现器官特异靶向——这不同于病毒载体项目的制造挑战，但有自身复杂性。病毒载体产能约束一直是更广泛基因治疗领域的反复瓶颈；LNP 可扩展性更成熟（建立在 mRNA
              疫苗基础设施之上），但临床剂量下的组织特异 LNP 靶向并非常规能力。

              其他模态竞争是结构性约束。CRISPR Therapeutics 正推进 CTX460，这是其使用 SyNTase editing 的 AATD 基因编辑项目，预计 2026 年中提交 IND。多种 RNAi /
              ASO 路线靶向 AATD 肝病（fazirsiran / Arrowhead）。Base editing（Beam Therapeutics）和 SCD prime editing 项目也在开发中。CAR-T
              领域，多家公司在开发体内 CAR-T（例如使用 LNP 或类病毒颗粒），在 Tessera 的 CAR-T 项目进入临床前就形成竞争。多平台竞争格局中的窄护城河风险是真实的。

              最后，知识产权和递送平台持久性也是采用约束，而且很难从公开来源评估。Tessera 的自有 LNP 平台被描述为能够实现器官特异递送；它能否相对现有 LNP 专利格局（由 Alnylam / Moderna /
              Arbutus 主导）形成可防御 IP，是一个没有公开答案的尽调问题。
