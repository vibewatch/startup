  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              Tessera Therapeutics 自 2018 年作为 Flagship Pioneering
              旗下公司创立以来，融资完全依赖私人资本；公司仍为私有，股权没有公开交易。已披露的资本结构分三类：风险股权、合作资本和非稀释性赠款。股权侧，Tessera 在 2021 年 1 月宣布完成超过 $230
              million 的 Series B 融资，2022 年 3 月又以据报 $1.7 billion 估值完成超过 $300 million 的 Series C，投资方包括 GV (Google
              Ventures)、Casdin Capital 和 Leaps by Bayer。叠加其上的是合作资本：2025 年 12 月，Regeneron Pharmaceuticals 同意向 Tessera 支付
              $150 million 前期现金和股权，并提供最高 $125 million 的近期和中期开发里程碑款，共同开发领先 AATD 项目 TSRA-196。非稀释性资金包括 Gates Foundation
              2024 年为一项体内镰状细胞病项目承诺的最高 $50 million，以及 ARPA-H 为体内 CAR-T 工作提供的最高 $41.3 million。把已披露数字相加，潜在资本超过 $770
              million；但里程碑款和赠款分期取决于技术与临床进展，并非保证到账现金。Tessera 是私有公司，不发布经审计财务报表，具体股权表、优先股条款，以及 Regeneron 投资中的股权部分均未公开。
