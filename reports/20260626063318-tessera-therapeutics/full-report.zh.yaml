      - number: '6.2'
        title: 采用轨迹——项目推进是唯一可用代理指标
        blocks:
          - type: paragraph
            body: >-
              Tessera 没有商业采用指标——没有售出单位、账户、地点、使用量或活跃用户——因为它没有上市产品。唯一可支撑的「采用」信号，是管线推进和机构承诺随时间累积，它们可作为外部验证的代理指标。轨迹很具体：公司披露
              TSRA-196 在 AATD 中获得 IND 批准以及 Fast Track 和 Orphan Drug 资格；2025 年 12 月与 Regeneron 签署 $150 million 合作；2024 年
              12 月为 SCD 从 Gates Foundation 获得最高 $50 million；2025 年为体内 CAR-T 从 ARPA-H 获得最高 $41.3
              million。每一项都是离散、有日期、可外部验证的事件。缺失的是能把这些事件转化为传统采用曲线的分母：没有商业给药患者、没有签约治疗中心，也没有经常性购买。第一个有意义的临床采用代理指标，将是 Tessera
              在 Regeneron 合作下主导的 TSRA-196 首次人体研究的入组和给药。在此之前，采用只能解读为伙伴和监管采纳，而不是市场采纳；任何客户数、部署或使用量数字都不可得，应作为尽调缺口，而不是估算。
