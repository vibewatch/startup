      - number: '3.5'
        title: 差异化、护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Tessera 声称的竞争护城河有四根支柱：（1）target-primed reverse transcription（TPRT）Gene
              Writing，在定义位点插入大遗传载荷且不产生双链断裂，避开核酸酶切割带来的非预期编辑和染色体重排风险；（2）RNA-only、非病毒递送，潜在可重复给药，并避开病毒载体免疫原性和 capsid
              制造约束；（3）用于组织特异靶向的自有脂质纳米颗粒递送系统；（4）围绕可移动遗传元件的广泛专利组合。每根支柱的持久性都存在争议。Base editor（Beam）和 prime editor（Prime
              Medicine）同样避免双链断裂，而且已经进入临床，削弱了「无 DSB」差异点；体内 CRISPR（Intellia）和 base editing（Beam）已经使用同样的 LNP
              递送，削弱了「非病毒」差异点；大载荷插入——Tessera 最真实的技术优势——恰恰是 Tome 因投资者不愿继续资助其走到临床而失败的能力。最强替代风险是竞争时点：如果 Beam 的 BEAM-302 或另一个
              AATD 项目先拿到正向 Phase 2 数据并率先获批，Tessera 在 AATD 的先发叙事就会蒸发，TSRA-196 会变成小型孤儿药市场中的快速跟随者。Tessera
              可防御的边缘，在于临床阶段进展、Regeneron 合作带来的资本和商业触达，以及没有获批 editor 能匹配的大插入能力；但在人体疗效和安全性数据到来之前，这些都还未证明能持久。
