      - 买方角色
      - 终端用户
      - 主要支付方
      - 工作流 / 采用路径
      - 预算负责人
      - 关键采用触发点
    rows:
      - - AATD – 美国监管市场
        - 学术医疗中心 / 专科医院（开具并实施治疗）
        - 伴肺部疾病的成人 PiZZ 纯合 AATD 患者
        - 商业保险；Medicare；Medicaid；部分自费
        - 诊断 → 基因检测 → 专科转诊 → 治疗中心登记 → Phase 1/2 → 获批 → 支付方授权 → 输注
        - 健康计划医疗总监 / 药房总监
        - FDA 批准 + 积极 Phase 2/3 数据；基于疗效的支付方合同
      - - AATD – Regeneron 合作（商业化）
        - Regeneron 作为全球商业化牵头伙伴；Tessera 牵头 Phase 1（TSRA-196）
        - 同上；Regeneron 扩展至欧盟和全球市场
        - Regeneron 主导 HTA 递交后，由欧盟支付方（NICE、HAS 等）支付
        - Regeneron 牵头后续全球开发、监管与商业化；利润 50/50 分成
        - Regeneron 商业预算；Tessera 获得里程碑款和利润分成
        - 成功的 Phase 2 数据包足以让 Regeneron 接手完整开发领导权
      - - SCD – 美国高收入市场
        - 学术血液科中心（与 Casgevy 模式相同）
        - 重症 SCD 患者（最严重类型，按 Vertex 口径美国约 16,000 人合格）
        - Medicaid（美国 SCD 患者约 50–60%）；商业保险；基于疗效的合同
        - 诊断 → 血液科转诊 → 治疗资格评估 → 支付方授权 → 细胞采集（体外）或 LNP 输注（体内）→ 监测
        - 州 Medicaid 机构；商业保险医疗总监
        - IND 放行、Phase 1/2 数据，以及已证明的非清髓路径（Tessera 的体内优势）
      - - SCD – 全球可及（中低收入）
        - 国家卫生项目；NGO；Gates Foundation 支持的可及项目
        - 全球 8M SCD 患者；多数在撒哈拉以南非洲，通常缺少专科基础设施
        - Gates Foundation（$50M 承诺）；各国政府；WHO 项目
        - 新路径：体内 LNP，无需细胞采集或预处理 → 可在医院而非专科中心实施
        - Gates Foundation + Tessera 联合项目；目标市场政府卫生预算
        - 在低资源环境中拿到临床概念验证；WHO 和国家卫生项目采用
      - - 体内 CAR-T – ARPA-H 阶段（当前）
        - ARPA-H 作为政府资助方和使命驱动买方；癌症研究中心
