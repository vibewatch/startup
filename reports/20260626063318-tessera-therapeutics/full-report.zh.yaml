      - number: '5.4'
        title: 临床前验证与独立机制证据
        blocks:
          - type: paragraph
            body: >-
              Tessera 的技术主张建立在两根证据柱上：自身临床前（动物）数据，以及关于其所借用反转座子机制的独立同行评议文献。公司侧，Tessera 在 2025 年和 2026 年 5 月的 American
              Society of Gene and Cell Therapy（ASGCT）会议上展示数据，称单剂 Gene Writer 在非人灵长类长期造血干细胞中实现编辑，水平高于被认为可为 SCD
              带来治愈获益所需的门槛，且无需干细胞动员、骨髓清除性预处理或移植。与此同时，T 细胞靶向 LNP 中的单剂 Gene Writers 首次在多个 NHP 物种中把 CAR 插入基因组，并在体内产生有功能的
              CAR-T 细胞，血液和淋巴结中可测得 B 细胞耗竭。AATD 方面，近期在小鼠和非人灵长类中展示的结果显示肝脏编辑特异性高，未检测到脱靶或生殖系编辑。第二根证据柱来自外部：关于人 LINE-1 和 R2
              反转座子 TPRT 的同行评议研究，以及结构指导工程化的全 RNA R2 插入系统在多种人类细胞系中达到超过 80% 整合效率，独立验证了基于逆转座元件、无 DSB、RNA
              引导插入在生物化学上真实存在且可工程化。公司证据与学术证据汇合，增强了平台可信度；但这些都不是人体临床证明，TSRA-196 才刚开始生成这类证据。
