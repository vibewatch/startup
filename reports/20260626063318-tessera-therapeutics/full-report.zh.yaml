            body: >-
              Tessera 唯一已经落地的「客户」是三家机构资助方，其中最重要的关系——Regeneron 的 $150 million 合作——绑定单一领先资产 TSRA-196。Gates
              Foundation（SCD）和 ARPA-H（体内 CAR-T）承诺资助更早期项目，而 2026 年 1 月重组似乎已降低这些项目优先级，使公司聚焦收窄，价值集中到一个伙伴和一个适应症上。Regeneron
              若退出、重谈或降低优先级，将拿走公司主要的非稀释性临床资金来源和最清晰商业路径。承销方应把 Regeneron 协议的期限、排他性和终止权，以及 Gates 与 ARPA-H 项目重组后的状态，视为闸门级尽调项。
