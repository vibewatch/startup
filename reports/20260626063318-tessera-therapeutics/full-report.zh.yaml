  - id: FO002
    title: Tessera Therapeutics 公司快照逻辑
    type: flow
    layout: standard
    summary: 流程图展示 Tessera 的 Gene Writing 平台、递送技术、组织靶点和疾病项目，如何连接到资本结构、合作关系和战略目标。
    data:
      nodes:
        - id: platform
          label: Gene Writing 平台
          detail: 基于可移动遗传元件的写入器；TPRT 机制；不产生双链断裂；覆盖小编辑到整基因插入
        - id: delivery
          label: 自有 LNP 递送
          detail: 非病毒脂质纳米颗粒平台，可将 RNA 体内递送到目标细胞类型（肝脏、HSC、T 细胞）
        - id: tissues
          label: 组织靶点
          detail: 肝脏（单基因疾病、常见疾病风险）；HSC（SCD）；T 细胞（肿瘤、自身免疫）
        - id: programs
          label: 临床与研究项目
          detail: TSRA-196（AATD，1/2 期）；SCD 体内项目（Gates 资助）；体内 CAR-T（ARPA-H 资助）
        - id: partners
          label: 战略合作方与资助方
          detail: Regeneron（TSRA-196 共同开发）；Gates Foundation（SCD）；ARPA-H（CAR-T）；Flagship Pioneering（创始方 + 投资者）
        - id: mission
          label: 使命
          detail: 通过写入生命代码治愈疾病；永久纠正根本遗传病因
      edges:
        - from: platform
          to: delivery
          label: Gene Writers 递送方式
        - from: delivery
          to: tissues
          label: RNA 载荷抵达
        - from: tissues
          to: programs
          label: 支持临床项目
        - from: programs
          to: partners
          label: 获得支持并由其商业化
        - from: partners
          to: mission
          label: 资本与专长投向
