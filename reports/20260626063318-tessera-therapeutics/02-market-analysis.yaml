  - id: buyer-segmentation
    title: Buyer, Payer, and Workflow Segmentation
    body: >-
      Tessera operates in the biotech drug model, where the commercial pathway involves multiple
      distinct actors with different roles: regulators as workflow gatekeepers, specialist physicians
      as prescribing authorities, payers and health systems as economic buyers, patients as end users,
      and partners like Regeneron as channel and financing enablers.

      **Regulators:** FDA is the primary workflow gatekeeper. TSRA-196 has received Fast Track and
      Orphan Drug designations, qualifying it for expedited review, potential for rolling submission,
      and seven years of market exclusivity upon approval. Orphan Drug status applies to rare diseases
      affecting fewer than 200,000 US patients (AATD US population: ~100,000; PiZZ subset: ~60,000–
      70,000). These designations reduce development costs and can accelerate the regulatory timeline.
      They do not guarantee approval.

      **Specialty physicians:** Pulmonologists and hepatologists are the treating physicians for AATD.
      Hematologists and oncologists serve SCD patients. The prescribing community for one-time gene
      therapies is concentrated in academic medical centers with specialized manufacturing capacity and
      patient monitoring capabilities. Casgevy has nine US treatment centers; Lyfgenia has 27 qualified
      sites. Infrastructure buildout is a material adoption friction; Tessera's LNP-based, non-viral
      delivery approach is designed to be administered more broadly without the cell engineering
      facilities required by ex vivo approaches, which is an adoption differentiator if confirmed.

      **Payers:** Commercial insurers and Medicaid are the primary US payers. Medicaid covers a
      disproportionate share of SCD patients (predominantly low-income Black Americans). Outcomes-based
      contracts—where payment is tied to treatment durability—are being pioneered for Casgevy and
      Lyfgenia, and will be necessary for any AATD or SCD gene therapy in a Medicaid environment.
      ICER concluded that Casgevy and Lyfgenia would achieve cost-effectiveness thresholds at prices
      of $1.35M–$2.05M, recommending pricing toward the lower end. The existing AATD augmentation
      market (~$200K/patient/year, lifelong) provides a cost-per-life-year anchor for AATD gene
      therapy payer negotiations. European payers (NICE, HAS, others) will require separate HTA
      submissions.

      **Patients:** Approximately 16,000 US SCD patients are estimated by Vertex as gene-therapy
      eligible. AATD patient eligibility for TSRA-196 is PiZZ homozygotes with pulmonary disease—
      a subset of the ~100,000 US diagnosed patients (with many undiagnosed). Patient willingness
      to undergo intensive pretreatment conditioning is a known friction in SCD (chemotherapy
      conditioning required for ex vivo therapies). Tessera's in vivo LNP approach, if successfully
      re-dosable, avoids conditioning and thus could access a substantially larger portion of the
      eligible population.

      **Partners and financing enablers:** Regeneron is Tessera's primary commercial partner for
      AATD: co-developing TSRA-196, leading global Phase 2/3 and commercialization, and contributing
      $150M upfront plus milestones in exchange for 50/50 worldwide profit sharing. The Gates Foundation
      ($50M commitment) functions as a financing and access enabler for SCD, with an explicit mandate
      for global affordability rather than premium US pricing. ARPA-H's EMBODY award ($41.3M) serves
      a similar role for in vivo CAR-T—government-funded R&D to overcome manufacturing economics before
      a commercial market exists.

      **Budget dynamics:** For AATD, commercial insurers and Medicaid/Medicare hold the budget for
      augmentation therapy ($200K/year ongoing); a payer rationale for a one-time cure at $2M–$3M
      exists on a net-present-value basis if clinical durability is established. For SCD, the Medicaid
      access problem is more acute: the Biden/Harris administration piloted outcomes-based arrangements
      in 2024 to enable Medicaid reimbursement for one-time therapies; this policy environment could
      influence future AATD program negotiations but creates uncertainty. For in vivo CAR-T, the
      economic buyer is oncology centers and health systems using ARPA-H and NIH-supported
      infrastructure; commercial market economics are undetermined.
