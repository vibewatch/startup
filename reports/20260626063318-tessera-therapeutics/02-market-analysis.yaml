company:
  name: Tessera Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Tessera Therapeutics competes in the in vivo genetic medicine market—a segment of the broader
    gene therapy industry estimated at approximately $10 billion globally in 2026 and growing at
    ~20% CAGR through 2031. Its three disease wedges define distinct market sub-opportunities:
    alpha-1 antitrypsin deficiency (AATD), where the current augmentation therapy standard of care
    represents a ~$1.9 billion annual market and where TSRA-196 is the first in vivo TPRT-based
    therapy in the clinic; sickle cell disease (SCD), where approved gene therapies are priced
    at $2.2–$3.1 million and Casgevy generated $116 million in 2025 revenues; and in vivo CAR-T,
    currently pre-commercial but supported by ARPA-H and a $150M+ addressable cell therapy market.
    Adoption hinges on clinical and regulatory execution, payer economics for one-time high-cost
    therapies, manufacturing scale-up, and competition from ex vivo CRISPR, RNAi, and base/prime
    editing platforms targeting the same diseases.
  contentRequirements:
  - Market boundary, included/excluded spend, adjacencies, and status-quo substitutes.
  - TAM/SAM/SOM or evidence-constrained sizing using multiple lenses, not one broad estimate.
  - Buyer/user/payer segmentation with budget ownership and adoption path.
  - Growth drivers and adoption constraints (regulation, switching cost, ROI, trust, capital intensity).
  - Sizing/adoption diligence gaps and contradictory estimates preserved.
