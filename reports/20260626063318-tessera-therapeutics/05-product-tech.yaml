  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: human-clinical-proof
      missingEvidence: >-
        Tessera has disclosed only preclinical (mouse and NHP) efficacy and safety data. No human
        clinical results exist yet for any program, and the unproven-in-humans risks—integration-site
        safety, insertional mutagenesis, immunogenicity of RNA/LNP components, and durability—cannot be
        resolved from current evidence.
      whyItMatters: >-
        For a first-in-class in vivo writing platform, human safety and efficacy are the decisive
        evidence; animal results, however strong, do not guarantee clinical translation.
      diligencePath: >-
        Track the TSRA-196 first-in-human readouts; request the full preclinical off-target and
        integration-site datasets and the long-term follow-up plan under appropriate confidentiality.
      relatedQuestionRefs: [QE016, QE025]
      relatedTableRefs: [TE004]
    - type: private-evidence-only
      severity: material
      topic: cmc-and-off-target
      missingEvidence: >-
        The GMP manufacturing and CMC approach, the specific LNP formulations, and the complete
        off-target assessment methodology for the lead and pipeline programs are not publicly disclosed.
      whyItMatters: >-
        CMC and off-target rigor are central to both regulatory progress and the durability of the
        platform's safety claims; without them, technical risk cannot be fully underwritten.
      diligencePath: >-
        Request the CMC/manufacturing dossier summary, LNP formulation and analytics overview, and the
        off-target detection methodology and results.
      relatedQuestionRefs: [QE022]
      relatedTableRefs: [TE003, TE004]
    - type: private-evidence-only
      severity: minor
      topic: lead-program-detail
      missingEvidence: >-
        The detailed editing parameters, exact target site, and full off-target dataset for TSRA-196
        are described only conceptually in public materials.
      whyItMatters: >-
        The completeness of the lead program's mechanistic and safety characterization informs the
        probability of clinical success and the strength of the platform's first proof point.
      diligencePath: >-
        Request the TSRA-196 IND summary, target-site rationale, and preclinical specificity package.
      relatedQuestionRefs: [QE020]
      relatedTableRefs: [TE001]

