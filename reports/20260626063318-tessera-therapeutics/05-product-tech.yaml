sections:
  - id: platform-mechanism
    title: Gene Writing Platform and the TPRT Mechanism
    body: >-
      Tessera's core product is the Gene Writing platform, a category of in vivo genome-modification
      tools the company built by mining nature's "mobile genetic elements"—sequences such as non-LTR
      retrotransposons that have evolved to copy and paste themselves into the genome. Rather than cut
      DNA and rely on the cell's repair machinery, as CRISPR-Cas9 nucleases do, Gene Writing rewrites
      sequence directly using target-primed reverse transcription (TPRT). In TPRT, a "Gene Writer"
      protein complexes with a template RNA that encodes the intended change; the complex binds a
      specific genomic site, nicks a single DNA strand to expose a 3' primer, and reverse-transcribes
      the RNA template into DNA at the target locus. Because only one strand is nicked, the process
      avoids the double-strand breaks that can cause translocations, large deletions, and genomic
      instability. The payload written can span the full spectrum of genetic change—single-base
      corrections, small insertions and deletions, or whole-gene insertions measured in kilobases—
      making the platform applicable to many monogenic diseases. Critically, the Gene Writer and its
      template can be supplied entirely as RNA, which means the therapeutic can be formulated in
      lipid nanoparticles and delivered non-virally, sidestepping the cargo-size limits and
      immunogenicity concerns of adeno-associated viral vectors. This mechanism is the foundation for
      every program in Tessera's pipeline and is the company's central technical differentiation.
    tableRefs:
    - TE002
    figureRefs:
    - FE002
  - id: writing-modalities
    title: Writing Modalities and Pipeline Assets
    body: >-
      Gene Writing is not a single enzyme but a platform spanning multiple molecular modalities, each
      tuned to a different editing task. Tessera describes RNA-templated writing systems that insert or
      correct sequence via TPRT, complemented by approaches that use the platform's protein-RNA
      machinery to write at defined sites; the unifying property is RNA-encoded, DSB-free,
      site-directed insertion. These modalities map onto three disclosed disease wedges. The lead asset,
      TSRA-196, targets alpha-1 antitrypsin deficiency (AATD) by correcting the SERPINA1 mutation in the
      liver to restore functional alpha-1 antitrypsin protein, and is partnered with Regeneron. A second
      program addresses sickle cell disease (SCD)—the most common lethal monogenic disease worldwide,
      caused by a beta-globin (HBB) mutation—through in vivo editing of hematopoietic stem cells
      (HSCs). A third applies the platform to in vivo CAR-T, inserting a chimeric antigen receptor
      directly into T cells inside the body to generate functional CAR-T cells without ex vivo
      manufacturing. Each program is a different "use" of the same writing-and-delivery platform: the
      AATD program is a precise correction in hepatocytes, the SCD program is an edit in a hard-to-reach
      stem-cell compartment, and the CAR-T program is a large-payload insertion in immune cells. The
      breadth of edit types and target tissues is the platform's strategic argument, but only TSRA-196
      has reached the clinic, and the SCD and CAR-T programs remain preclinical.
    tableRefs:
    - TE001
    figureRefs:
    - FE001
  - id: delivery
    title: Non-Viral LNP Delivery, Including Extra-Hepatic Targeting
    body: >-
      Delivery is as important to Tessera's product as the editing chemistry itself, because an in vivo
      therapy is only useful if it reaches the right cells. Because Gene Writers are delivered as RNA,
      Tessera formulates them in lipid nanoparticles (LNPs)—the same broad delivery class used by mRNA
      vaccines—rather than viral vectors. Standard LNPs naturally traffic to the liver, which suits the
      AATD program where hepatocytes are the target. The harder problem, and a key part of Tessera's
      claimed differentiation, is extra-hepatic delivery: reaching cells outside the liver. The company
      reports a proprietary delivery platform that enables LNP delivery to hematopoietic stem cells for
      the SCD program and to T cells for the in vivo CAR-T program. Achieving HSC editing in vivo is
      especially significant because the conventional ex vivo path (as used by approved therapies such
      as Casgevy) requires mobilizing stem cells, collecting them, editing them in a laboratory, and
      reinfusing them after myeloablative conditioning—an arduous, costly, and toxic process. If LNP
      delivery can edit HSCs and T cells directly in the body, it removes cell collection, ex vivo
      manufacturing, and conditioning from the treatment workflow, which would simplify administration,
      lower cost, and widen access. Delivery efficiency, biodistribution, redosing, and the specific
      lipid formulations are core to the platform's value but are only partially disclosed publicly.
    tableRefs:
    - TE003
    figureRefs:
    - FE003
  - id: validation
    title: Preclinical Validation and Independent Mechanism Evidence
    body: >-
      Tessera's technology claims rest on two pillars of evidence: its own preclinical (animal) data and
      the independent peer-reviewed literature on the retrotransposon mechanisms it harnesses. On the
      company side, Tessera presented data at the American Society of Gene and Cell Therapy (ASGCT)
      meetings in 2025 and May 2026 reporting that a single dose of its Gene Writer achieved editing in
      long-term hematopoietic stem cells in non-human primates at levels above those believed required
      for curative benefit in SCD—accomplished without stem-cell mobilization, myeloablative
      conditioning, or transplantation. In parallel, and for the first time across multiple NHP species,
      a single dose of Gene Writers in T-cell-targeted LNPs inserted a CAR into the genome and produced
      functional CAR-T cells in vivo with measurable B-cell depletion in blood and lymph nodes. For
      AATD, recently presented findings in mice and non-human primates showed high liver-editing
      specificity and no detected off-target or germline editing. The second pillar is external:
      peer-reviewed work characterizing human LINE-1 and R2 retrotransposon TPRT, and structure-guided
      engineering of an all-RNA R2 insertion system that achieves over 80% integration efficiency in
      several human cell lines, independently validates that retroelement-based, DSB-free, RNA-guided
      insertion is biochemically real and engineerable. This convergence of company and academic
      evidence strengthens the platform's plausibility, though none of it constitutes human clinical
      proof, which TSRA-196 has only just begun to generate.
    tableRefs:
    - TE005
    figureRefs:
    - FE004
  - id: ip-differentiation
    title: Intellectual Property, Know-How, and Differentiation
    body: >-
      Tessera's differentiation is a bundle of mechanism, delivery, and intellectual property. The
      platform originated inside Flagship Pioneering, where co-founders including Jacob Rubens (Chief
      Innovation Officer) and Geoffrey von Maltzahn conceived Gene Writing by asking whether nature had
      evolved tools for writing rather than breaking DNA. That origin is reflected in granted patents
      such as US 12,031,129 B2 ("Methods and compositions for modulating a genome"), assigned to Tessera
      and Flagship and naming Rubens and von Maltzahn among the inventors, which claims RNA-mediated,
      DSB-free, site-directed genome modification spanning single-base edits to whole-gene insertions.
      The competitive moat rests on several pillars: a mechanism class distinct from CRISPR nucleases,
      base editors, and prime editors; the ability to write large payloads that point-edit technologies
      cannot; an all-RNA, non-viral delivery system including extra-hepatic LNPs; and accumulated
      manufacturing and formulation know-how. Differentiation is genuine but contested—academic groups
      (notably at the Broad/MIT) are independently engineering R2 and other integrase systems for
      site-specific insertion, so Tessera does not have the retroelement-editing field to itself, and
      the durability of its advantage depends on staying ahead on delivery, efficiency, specificity, and
      the breadth of its issued patent estate.
  - id: safety-quality
    title: Safety, Off-Target Control, and Quality Considerations
    body: >-
      The product's safety thesis is mechanistic: by nicking a single DNA strand instead of cutting both,
      Gene Writing aims to avoid the double-strand-break-associated risks—translocations, large
      deletions, and chromosomal rearrangements—that accompany nuclease editing, and by writing at
      defined sites it aims to control where new sequence lands. Tessera's preclinical disclosures
      emphasize high on-target specificity, no detected off-target editing in the AATD program, and no
      detected edits in germline tissues, which are the key safety signals regulators scrutinize for an
      in vivo, permanent genetic change. The regulatory system has engaged with the lead program: the
      FDA cleared the TSRA-196 IND and granted Fast Track and Orphan Drug designations, indicating the
      agency accepted the preclinical safety and CMC package sufficient to begin human dosing. Important
      safety and quality questions remain open and are inherent to a first-in-class in vivo platform:
      long-term integration-site safety, the completeness of off-target and insertional-mutagenesis
      assessment, immunogenicity of the RNA and LNP components, redosing, and the GMP manufacturing and
      analytical controls used for clinical supply. Because the therapy makes a permanent change, the
      durability and reversibility profile and the long-term follow-up plan are central to its risk
      assessment. Much of this detail—particularly CMC and the full off-target methodology—is not
      public and must be obtained through diligence.

    tableRefs:
    - TE004
