company:
  name: Tessera Therapeutics
chapter:
  number: 5
  title: Product and Technology
  summary: >-
    Tessera's product is its Gene Writing platform—a family of in vivo genome-modification tools
    derived from mobile genetic elements (non-LTR retrotransposons such as R2 and LINE-1) that use
    target-primed reverse transcription (TPRT) to write new genetic sequence directly into a target
    locus without creating double-strand breaks. A "Gene Writer" protein and a template RNA bind the
    genome, nick a single DNA strand, and reverse-transcribe a payload—ranging from a single base to
    whole genes—into the site. The system can be delivered entirely as RNA, enabling non-viral
    lipid-nanoparticle (LNP) delivery, including a proprietary extra-hepatic LNP capability that
    Tessera reports reaches hematopoietic stem cells and T cells. Lead asset TSRA-196 (AATD) corrects
    the SERPINA1 mutation and has FDA IND clearance plus Fast Track and Orphan Drug designations.
    Preclinical data presented at ASGCT (2025 and May 2026) show curative-level long-term HSC editing
    in non-human primates without mobilization, myeloablation, or transplant, and the first in vivo
    CAR insertion generating functional CAR-T cells in multiple NHP species. The mechanistic basis—
    R2/LINE-1 TPRT and engineered all-RNA insertion exceeding 80% efficiency in human cell lines—is
    independently corroborated in peer-reviewed literature, but the platform has not yet generated
    human clinical data, and key CMC and off-target details remain undisclosed.
