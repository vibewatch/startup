callouts:
  - calloutType: insight
    title: "The Differentiator Is Large-Payload, DSB-Free, In Vivo Writing"
    body: >-
      The crux of Tessera's technical case is that point-edit technologies (base and prime editing) and
      nuclease editors (CRISPR-Cas9) struggle to insert large sequences efficiently and without
      double-strand breaks. Gene Writing's TPRT mechanism is designed to write anything from a single
      base to a whole gene at a defined site without a DSB, and to do it in vivo with an all-RNA, LNP
      cargo. If the extra-hepatic delivery and efficiency demonstrated in non-human primates translate
      to humans, the platform could address diseases—and a manufacturing model—that ex vivo and viral
      approaches cannot serve well. The independent literature on R2/LINE-1 TPRT and engineered all-RNA
      insertion (over 80% efficiency in human cell lines) shows the underlying biology is real and
      engineerable, which materially de-risks the mechanism even though the company's specific systems
      remain proprietary.
    claimRefs:
      - CE004
      - CE010
      - CE011
      - CE012
  - calloutType: risk
    title: "No Human Data Yet, and CMC / Off-Target Detail Is Undisclosed"
    body: >-
      Every efficacy and safety result Tessera has disclosed is preclinical—mouse and non-human
      primate. The platform's central safety thesis (DSB-free, site-directed, no detected germline
      edits) is compelling mechanistically and corroborated in animals, but in vivo, permanent genome
      modification carries integration-site, insertional-mutagenesis, and immunogenicity risks that
      only human trials and long-term follow-up can resolve. Compounding the uncertainty, the full
      off-target assessment methodology, the GMP/CMC controls, the specific LNP formulations, and the
      lead program's detailed editing parameters are not public. The FDA's IND clearance and Fast
      Track/Orphan designations show the agency accepted the package to begin dosing, but clinical
