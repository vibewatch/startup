- id: clinical-milestones-and-operations
  title: Clinical Milestones, Pipeline, and Operational Context
  body: 'Tessera''s clinical program took its most important step on January 12, 2026,
    when the FDA cleared the Investigational New Drug application for TSRA-196. The
    same day, the company received Australian Human Research Ethics Committee approval
    to begin a Phase 1/2 clinical trial. On February 23, 2026, the FDA granted TSRA-196
    both Fast Track and Orphan Drug designations for the treatment of adults with
    AATD who are homozygous for the PiZ allele. Tessera''s Chief Development and Medical
    Officer, David Davidson, stated that this was the first ever IND clearance for
    an in vivo TPRT-based genome-editing therapy, a claim independently confirmed
    by the Alpha-1 Foundation. The Phase 1/2 study is first-in-human, open-label,
    multinational, and designed to evaluate safety, tolerability, and efficacy following
    a single intravenous administration.

    Beyond TSRA-196, Tessera''s pipeline as described in public materials includes
    an in vivo gene-editing program for sickle cell disease (SCD) funded in part by
    the Gates Foundation, and in vivo CAR-T programs for oncology and autoimmune disease
    supported by the ARPA-H EMBODY award. The company has presented preclinical data
    for all three focus areas at scientific conferences, but none of the SCD or CAR-T
    programs had disclosed IND filings as of the run date.

    In early 2026, Tessera announced workforce restructuring. A state layoff notice
    filed on January 2026 and reported by both FierceBiotech and Boston.com indicated
    90 employees would be laid off starting March 8, 2026, including 82 Massachusetts
    residents. A company spokesperson confirmed that approximately 160 employees would
    remain after the reduction, representing a roughly 35% workforce cut. The company
    stated no facilities would close, and that the restructuring would focus resources
    on the TSRA-196 clinical program and the Regeneron partnership, while continuing
    to invest in the CAR-T Gene Writing program as a foundation for future waves.'
