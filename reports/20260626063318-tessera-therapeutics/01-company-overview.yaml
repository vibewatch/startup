- id: capital-base-and-partnerships
  title: Capital Base, Investors, and Strategic Partnerships
  body: 'Tessera''s disclosed equity history consists of two major institutional rounds.
    On January 12, 2021, the company announced over $230 million in Series B financing
    co-led by Alaska Permanent Fund Corporation, Altitude Life Science Ventures, and
    SoftBank Vision Fund 2, with participation from Qatar Investment Authority and
    others. Flagship Pioneering stated at the time that it was increasing its total
    capital contribution to $60 million. On April 19, 2022, Tessera announced over
    $300 million in Series C financing from a syndicate that included a wholly-owned
    subsidiary of the Abu Dhabi Investment Authority, Alaska Permanent Fund, Altitude
    Life Science Ventures, ARTIS Ventures, Cormorant Asset Management, Flagship Pioneering,
    Hanwha Impact Partners, Longevity Vision Fund, March Capital, SALT Fund, SoftBank
    Vision Fund 2, and T. Rowe Price Associates, among others. The combined disclosed
    equity from Series B and C exceeds $530 million; no Series A figure has been separately
    announced in retained sources beyond Flagship''s $60 million.

    Beyond equity, the company has secured philanthropic and government support. On
    December 18, 2024, Tessera announced an agreement with the Bill and Melinda Gates
    Foundation for an investment of up to $50 million to jointly fund the company''s
    in vivo program for sickle cell disease. On October 8, 2025, ARPA-H awarded Tessera
    up to $41.3 million under its EMBODY program to support in vivo CAR-T therapy
    development. On December 1, 2025, Regeneron Pharmaceuticals and Tessera announced
    a global collaboration to develop TSRA-196, under which Tessera received $150
    million inclusive of a cash upfront payment and equity investment, is eligible
    for up to $125 million in near- and mid-term development milestones, and will
    lead the initial first-in-human trial while Regeneron leads subsequent global
    development and commercialization. The two companies share worldwide development
    costs and future profits 50/50. Company valuation, revenue, and ARR have not been
    publicly disclosed.'
