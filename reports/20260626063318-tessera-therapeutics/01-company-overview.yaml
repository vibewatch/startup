sections:
- id: identity-mission-founding
  title: Identity, Mission, and Founding
  body: 'Tessera Therapeutics is a clinical-stage biotechnology company headquartered
    in Somerville, Massachusetts. The company describes its mission as curing disease
    by writing in the code of life, and it pursues that mission through Gene Writing—a
    genome-engineering platform inspired by mobile genetic elements (MGEs), the most
    abundant class of genes across life on earth. MGEs encode molecular machinery
    that writes DNA into new genomic sites without relying on the double-stranded
    breaks that underpin CRISPR-based nuclease editing, which Tessera argues makes
    Gene Writing fundamentally different from existing gene editing and gene therapy
    approaches.

    The company was established inside Flagship Labs, Flagship Pioneering''s internal
    innovation foundry, in 2018 by Geoffrey von Maltzahn (PhD, MIT biomedical engineering),
    Jacob Rubens (PhD, MIT microbiology), and other Flagship scientists including
    Noubar Afeyan as co-founder and initial chairman. After multiple years of in-house
    platform development, Flagship formally unveiled Tessera to the public on July
    7, 2020. Press releases from 2021 and 2022 still described headquarters as Cambridge,
    Massachusetts; the company''s more recent announcements and media coverage use
    Somerville, Massachusetts.

    Tessera''s technology platform has three interlocking components publicly described:
    Gene Writers (engineered and synthetic MGEs that write DNA via target-primed reverse
    transcription, or TPRT), a delivery system (proprietary lipid nanoparticle platform
    designed for in vivo RNA delivery to targeted cell types), and a pipeline organized
    around three initial tissue targets. The company operates across two broad focus
    tracks: monogenic diseases and genetic approaches for prevalent diseases using
    liver- and hematopoietic-stem-cell-directed delivery, and oncology and autoimmune
    diseases using T-cell-directed delivery. As of June 2026, the company''s lead
    clinical program is TSRA-196, an in vivo gene-editing therapy targeting the SERPINA1
    mutation underlying alpha-1 antitrypsin deficiency.'
