company:
  name: Tessera Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Tessera Therapeutics is a Somerville, Massachusetts biotechnology company
    founded in 2018 by Flagship Pioneering and publicly unveiled on July 7, 2020.
    The company pioneers Gene Writing—a genome-engineering platform based on mobile
    genetic elements that can make targeted DNA alterations without double-stranded
    breaks, using only RNA delivery. Its lead program, TSRA-196, received FDA IND
    clearance on January 12, 2026 and FDA Fast Track and Orphan Drug designations
    on February 23, 2026 for alpha-1 antitrypsin deficiency, becoming the first TPRT-based
    in vivo gene-editing therapy to reach the clinic. A December 2025 collaboration
    with Regeneron brought Tessera a $150 million cash-and-equity payment plus up
    to $125 million in milestones. Despite strong capital accumulation—more than $530
    million across Series B and C rounds plus philanthropic and non-dilutive government
    support—the company announced in early 2026 that it would lay off approximately
    90 employees (about 35% of the workforce), leaving roughly 160 employees as it
    refocuses on the Regeneron partnership. Valuation, revenue, and ARR remain undisclosed.
