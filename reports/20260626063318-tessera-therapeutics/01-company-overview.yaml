- id: FO002
  title: Tessera Therapeutics Company Snapshot Logic
  type: flow
  layout: standard
  summary: Flow diagram showing how Tessera's Gene Writing platform, delivery technology,
    tissue targets, and disease programs connect to its capital structure, partnerships,
    and strategic objectives.
  data:
    nodes:
    - id: platform
      label: Gene Writing Platform
      detail: Mobile genetic element-based writers; TPRT mechanism; no double-stranded
        breaks; small edits to whole-gene insertion
    - id: delivery
      label: Proprietary LNP Delivery
      detail: Non-viral lipid nanoparticle platform enabling in vivo RNA delivery
        to targeted cell types (liver, HSC, T cells)
    - id: tissues
      label: Tissue Targets
      detail: Liver (monogenic diseases, prevalent disease risk); HSC (SCD); T cells
        (oncology, autoimmune)
    - id: programs
      label: Clinical and Research Programs
      detail: TSRA-196 (AATD, Phase 1/2); SCD in vivo program (Gates-funded); in vivo
        CAR-T (ARPA-H funded)
    - id: partners
      label: Strategic Partners and Funders
      detail: Regeneron (TSRA-196 co-dev); Gates Foundation (SCD); ARPA-H (CAR-T);
        Flagship Pioneering (founder + investor)
    - id: mission
      label: Mission
      detail: Cure disease by writing in the code of life; permanently correct root
        genetic cause
    edges:
    - from: platform
      to: delivery
      label: Gene Writers delivered via
    - from: delivery
      to: tissues
      label: RNA payload reaches
    - from: tissues
      to: programs
      label: Enabling clinical programs in
    - from: programs
      to: partners
      label: Supported and commercialized by
    - from: partners
      to: mission
      label: Capital and expertise toward
