callouts:
- calloutType: strength
  title: First TPRT-Based In Vivo Gene Editing Therapy to Reach the Clinic
  body: Tessera achieved a field-first milestone on January 12, 2026 when the FDA
    cleared TSRA-196's IND—the first ever IND clearance for a target-primed reverse
    transcription (TPRT)-based in vivo gene-editing therapy. Combined with subsequent
    Fast Track and Orphan Drug designations and the Phase 1/2 trial now underway,
    Tessera has moved from platform-stage to a clinical company in a technology class
    no other program has yet entered the clinic in.
  claimRefs:
  - CO029
  - CO030
  - CO031
  - CO032
- calloutType: strength
  title: Regeneron Partnership Provides Capital, Validation, and Commercialization
    Reach
  body: The December 2025 Regeneron collaboration delivers $150 million in immediate
    cash and equity, up to $125 million in milestones, a 50/50 co-development structure,
    and Regeneron's proven rare-disease commercialization capabilities. For a private
    single-program clinical company, this partnership materially de-risks TSRA-196's
    path through pivotal trials and market access.
  claimRefs:
  - CO025
  - CO026
  - CO027
  - CO028
- calloutType: risk
  title: 35% Workforce Reduction and Undisclosed Valuation Create Diligence Uncertainty
  body: The early-2026 layoff of roughly 90 employees (approximately 35% of the workforce)
    signals a deliberate strategic refocusing rather than financial distress, but
    it also compresses organizational depth at a moment when TSRA-196 is entering
    human trials. Separately, no post-money valuation has been disclosed for any Tessera
    financing round, making it impossible to benchmark the company's equity value
    against capital raised or the Regeneron deal terms.
  claimRefs:
  - CO035
  - CO036
  - CO037
  - CO038
