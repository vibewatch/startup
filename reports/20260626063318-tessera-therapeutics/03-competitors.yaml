- id: differentiation-and-moat
  title: Differentiation, Moat Durability, and Displacement Risk
  body: >-
    Tessera's claimed competitive moat has four pillars: (1) target-primed reverse
    transcription (TPRT) gene writing that inserts large genetic payloads at defined sites
    without double-strand breaks, avoiding the unintended-edit and chromosomal-rearrangement
    risks of nuclease cutting; (2) RNA-only, non-viral delivery that is potentially re-dosable
    and avoids viral-vector immunogenicity and capsid manufacturing constraints; (3) a
    proprietary lipid-nanoparticle delivery system for tissue-specific targeting; and (4) a
    broad patent estate around mobile genetic elements. The durability of each pillar is
    contested. Base editors (Beam) and prime editors (Prime Medicine) also avoid
    double-strand breaks and are already in the clinic, eroding the "no DSB" differentiator;
    in vivo CRISPR (Intellia) and base editing (Beam) already use the same LNP delivery,
    eroding the "non-viral" differentiator; and large-payload insertion—Tessera's most
    genuine technical advantage—is exactly the capability that sank Tome when investors
    declined to fund it to the clinic. The strongest displacement risk is competitive timing:
    if Beam's BEAM-302 or another AATD program generates positive Phase 2 data and reaches
    approval first, Tessera's first-mover narrative in AATD evaporates and TSRA-196 becomes a
    fast-follower in a small orphan market. Tessera's defensible edge is its combination of
    clinical-stage progress, the Regeneron partnership's capital and commercial reach, and a
    large-insertion capability no approved editor matches—but none of these is proven durable
    until human efficacy and safety data arrive.
