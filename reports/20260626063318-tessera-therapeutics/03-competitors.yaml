- id: crispr-base-prime-editing
  title: CRISPR, Base, and Prime Editing Competitors
  body: >-
    The most resourced competitors use CRISPR-derived editing rather than mobile-element gene
    writing, and several are far ahead of Tessera. Beam Therapeutics is the single most
    threatening peer: its BEAM-302 is a liver-targeting LNP base editor designed to make a
    one-time A-to-G correction of the PiZ (E342K) SERPINA1 mutation—precisely the alpha-1
    antitrypsin deficiency target of Tessera's TSRA-196—and is already in a Phase 1/2
    dose-exploration trial, ahead of Tessera's program. Beam also runs risto-cel (BEAM-101),
    an ex vivo base-edited therapy for sickle cell disease in Phase 1/2, plus an in vivo HSC
    LNP editing research effort that mirrors Tessera's sickle-cell ambition. Intellia
    Therapeutics, the in vivo CRISPR leader, has two Phase 3 programs—nex-z (nexiguran
    ziclumeran) for transthyretin amyloidosis and lonvo-z (lonvoguran ziclumeran) for
    hereditary angioedema—and, like Tessera, partners with Regeneron, which shares 25% of the
    ATTR program's development costs and profits and wholly advances an Intellia-derived
    hemophilia B program. Prime Medicine pursues prime editing across hematology, immunology,
    liver, and lung. CRISPR Therapeutics, with Vertex, sells Casgevy. Editas Medicine
    discontinued its ex vivo reni-cel sickle-cell program and pivoted to in vivo editing
    (EDIT-401 for LDL-C lowering). Metagenomi and Arbor Biotechnologies mine metagenomic and
    novel CRISPR/integrase systems for in vivo editing. Mechanistically, base and prime
    editors excel at small, precise corrections but cannot insert whole genes; Tessera's TPRT
    writing claims large-payload, site-specific insertion—an advantage only if it proves out
    clinically.
