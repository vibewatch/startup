company:
  name: Tessera Therapeutics
chapter:
  number: 3
  title: Competitors
  summary: >-
    Tessera competes inside a crowded genetic-medicine field that splits into three tiers:
    (1) clinical-stage in vivo gene-editing leaders that are years ahead of Tessera—most
    threateningly Beam Therapeutics, whose BEAM-302 is a liver-targeted LNP base editor for
    the exact same alpha-1 antitrypsin deficiency (AATD) PiZ mutation TSRA-196 targets, and
    Intellia, whose nex-z/lonvo-z in vivo CRISPR programs are in Phase 3; (2) the commercial
    incumbent CRISPR Therapeutics/Vertex, whose ex vivo Casgevy is the first approved CRISPR
    medicine and the standard Tessera's sickle-cell program must displace; and (3) the
    direct "gene writing / genome integration" peers, where the cautionary tale is Tome
    Biosciences—a Flagship-adjacent integrase-based gene-writing startup that launched in
    December 2023 with $213M and laid off nearly its entire 131-person staff in late 2024.
    Tessera's differentiation rests on non-viral, RNA-only, site-specific large-payload
    insertion without double-strand breaks, but that moat is unproven in humans while base
    editing, prime editing, and in vivo CRISPR are already generating clinical data.
  contentRequirements:
  - Landscape covering direct peers, incumbents, adjacents, substitutes, status quo, internal
    build, and likely entrants.
  - Competitor profiles with scale, funding, target customer, product scope, pricing, and
    strategic direction.
  - Comparisons on capability, pricing, GTM/distribution, and trust/regulatory posture.
  - Switching cost, lock-in, multi-homing, distribution power, and supply/partner access.
  - Moat durability, commoditization or displacement risk, and adverse competitor evidence.
