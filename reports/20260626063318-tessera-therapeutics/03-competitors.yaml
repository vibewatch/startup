- id: rare-disease-overlap
  title: Direct Disease Overlap, Pricing, and the Commercial Incumbent
  body: >-
    Where Tessera's programs overlap with competitors on a specific disease, the competitor is
    usually ahead and often already priced in the market. In sickle cell disease, CRISPR
    Therapeutics and Vertex's Casgevy (exagamglogene autotemcel) is a one-time, ex vivo,
    gene-edited therapy approved for patients aged 12 and older with sickle cell disease or
    transfusion-dependent beta-thalassemia; it increases fetal hemoglobin and is the
    benchmark Tessera's in vivo sickle-cell program must beat—on access and cost rather than
    pure efficacy, since Casgevy requires myeloablative conditioning and a stem-cell transplant
    procedure that limits its addressable population. Casgevy and Bluebird's Lyfgenia carry
    list prices of roughly $2.2 million and $3.1 million respectively, setting the payer
    anchor for the category. In AATD, the status-quo substitute remains weekly intravenous
    augmentation therapy, while Beam's BEAM-302 competes directly for the curative slot
    alongside TSRA-196. Tessera's structural pricing argument is that a non-viral, infusion-only
    therapy without cell collection or conditioning could be delivered far more cheaply and
    broadly than ex vivo gene therapies—central to its Gates Foundation-backed global-access
    sickle-cell thesis. But pricing power depends on clinical differentiation Tessera has not
    yet demonstrated, and the incumbents hold the distribution, treatment-center networks, and
    payer relationships that a pre-clinical-data challenger lacks. Switching costs for a
    one-time cure are paradoxical: once a patient is treated by a competitor, they are
    effectively removed from Tessera's addressable market for life.
