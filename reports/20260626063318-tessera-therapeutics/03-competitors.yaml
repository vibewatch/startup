- calloutType: insight
  title: Tome's Collapse Is the Cautionary Mirror for Tessera's Category
  body: >-
    Tome Biosciences launched in December 2023 with $213 million to build an integrase-based
    gene-writing platform conceptually adjacent to Tessera's—large-payload insertion without
    double-strand breaks—and laid off nearly all 131 employees within a year as "investor
    sentiment shifted dramatically across the gene editing space." Tessera survived the same
    sentiment shift only because it reached IND and Phase 1/2 with Regeneron capital before
    the window closed. The episode underscores that Tessera's true moat is not the platform's
    elegance but its clinical-stage progress and partner funding.
