  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      The precise switching-cost and lock-in dynamics for one-time curative gene therapies are
      not quantified in public sources; it is asserted but not measured how many patients a
      competitor's first-mover treatment permanently removes from Tessera's addressable market.
    whyItMatters: >-
      In small orphan populations, a competitor treating patients first structurally shrinks
      Tessera's serviceable market, making first-to-approval more valuable than in chronic-therapy markets.
    diligencePath: >-
      Model the AATD and SCD eligible-patient pools against competitor enrollment and launch
      timelines; request Tessera's internal competitive-capture analysis.
    relatedQuestionRefs: [QP013]
  - type: missing-source
    severity: moderate
    topic: delivery
    missingEvidence: >-
      No head-to-head public data compare Tessera's LNP re-dosability and tissue-specific
      targeting against Intellia's and Beam's LNP delivery; comparative delivery performance is unverified.
    whyItMatters: >-
      Delivery is the gating constraint for in vivo editing; if Tessera's LNP is not
      meaningfully better, a key differentiation pillar weakens.
    diligencePath: >-
      Compare published preclinical and clinical PK/PD and re-dosing data across Tessera,
      Intellia, and Beam; request Tessera's proprietary LNP characterization.
    relatedQuestionRefs: [QP019]
  - type: missing-source
    severity: moderate
    topic: displacement-risk
    missingEvidence: >-
      Whether large-pharma internal gene-editing builds will displace independent gene-writing
      platforms is an open question with no decisive public evidence either way.
    whyItMatters: >-
      If incumbents internalize the technology, independent platforms like Tessera face both
      competition and reduced partnership/acquisition optionality.
    diligencePath: >-
      Track large-pharma gene-editing M&A and internal program disclosures; assess whether
      Regeneron's bets on multiple editing partners signal internalization intent.
    relatedQuestionRefs: [QP021]
