- id: nonviral-gene-writing
  title: Non-Viral Gene Writing and the Category-Viability Question
  body: >-
    Tessera's closest conceptual competitors are companies that, like it, sought to "write" or
    integrate whole genes rather than edit single bases—and their recent history is a
    cautionary signal about category risk. Tome Biosciences launched publicly in December 2023
    with $213 million in Series A and B financing to advance a programmable genomic integration
    (PGI) platform that used proprietary integrase enzymes to insert DNA fragments longer than
    30 kilobases without introducing double-strand breaks—an approach functionally analogous to
    Tessera's large-payload Gene Writing. Within a year, "investor sentiment had shifted
    dramatically across the gene editing space," and Tome filed a WARN notice to lay off 131
    employees (nearly its entire headcount) in November 2024 while seeking strategic options.
    Tome's collapse is the clearest disconfirming evidence that a non-viral, double-strand-break-free
    gene-writing platform—however scientifically elegant—can fail to attract the sustained
    capital required to reach the clinic. Metagenomi, another novel-systems editing company,
    saw its February 2024 IPO shares fall about 30% the day after debut and lost a high-profile
    Moderna gene-editing partnership in May 2024. Against this backdrop, Tessera's own January
    2026 layoff of roughly 90 employees and its pivot toward the Regeneron-funded TSRA-196
    program read as the same market pressure that felled Tome—partly mitigated by Tessera's
    clinical-stage status and its Regeneron capital, which Tome never secured. The key
    differentiator that keeps Tessera alive where Tome did not is that Tessera reached IND and
    Phase 1/2 with a deep-pocketed pharma partner before sentiment fully turned.
