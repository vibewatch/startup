    {
      "id": "V-VAL-4",
      "title": "Scenario analysis, recommendation and entry discipline",
      "body": "Because public valuation evidence is noisy, the right scenario range should be intentionally wide. In the bear case, grid and PPA delays persist, refinancing costs rise, manufacturing remains capital hungry, and green molecules remain strategically interesting but commercially early. In that case, a sub-$1.5 billion value is easy to justify. In the base case, the 17.7 GWp portfolio continues converting into operating assets, 2026 financings translate into timely CODs, and the market is willing to tolerate a private value roughly around the user-provided $2 billion anchor or modestly above it, producing a range around $1.8-3.0 billion. In the bull case, Avaada proves it can monetize not just generation but also manufacturing optionality and a deeper integrated platform, which could justify $3.5-5.5 billion. The problem for new investors is not that these ranges are impossible; it is that public evidence does not yet tell us where inside them Avaada actually belongs. That is why the recommendation is research-more rather than pass: the company may be good, but the price is not publicly auditable enough to underwrite with conviction.",
