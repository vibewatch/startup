    {
      "id": "V-VAL-2",
      "title": "Financing context and what the public record really says",
      "body": "The cleanest public financing facts are official and recent. Avaada's 2023 release says the group closed a $1.3 billion funding round, with Brookfield committing up to $1 billion into Avaada Ventures and GPSC adding capital into Avaada Energy. Public 2026 news then shows another layer of validation: roughly $950 million of debt financing for an FDRE project and two solar assets, a $1.3 billion financing closure for a 2.15 GW portfolio, and an active search for about $750 million to refinance a prior Brookfield-linked facility. These flows prove capital markets still view Avaada as financeable. What they do not prove is the group's current equity valuation. Public-facing PitchBook references a valuation-and-funding table but does not expose the figures without platform access. Inc42 shows total funding above $3.7 billion and a FY25 revenue proxy, while a startup-profile article provides a more aggressive and internally noisy valuation story. The correct diligence takeaway is that public financing visibility is strong, but public price-discovery visibility is weak.",
