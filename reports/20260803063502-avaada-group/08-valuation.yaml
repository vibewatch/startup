  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Avaada has enough scale, financing access and optionality that a roughly $2 billion group valuation is not obviously impossible on public scale heuristics; however, it is not cleanly underwritten by public evidence either. Official sources show a 17.7 GWp portfolio, repeated large financings and a substantial multi-vertical roadmap, while public-market comparables range from ReNew's far lower market-cap-per-GW signal to Adani Green's much richer one. The real problem is price discovery: accessible public sources do not cleanly disclose Avaada's current group post-money valuation, capital structure or consolidated EBITDA. The right recommendation is research-more with medium confidence, high risk, and a disciplined stance that treats valuation as plausible but under-verified."
  },
  "sections": [
    {
      "id": "V-VAL-1",
      "title": "Investment thesis and anti-thesis",
      "body": "The bull case for Avaada begins with scale and strategic relevance. Officially, the group says it has surpassed 17.7 GWp of portfolio, with over 7.2 GWp operational and about 10.5 GWp under construction. It has also attracted unusually large capital commitments for an Indian private renewable platform, starting with the 2023 Brookfield and GPSC-backed funding round and extending through major 2026 debt closures for FDRE, solar and hybrid assets. This is not a small project developer looking for a story; it is a scaled platform spanning generation, manufacturing and green molecules. The anti-thesis is that valuation remains far less transparent than operating ambition. Publicly accessible tracker pages give funding and partial revenue clues but do not provide a clean current post-money mark for the group, while secondary articles imply widely differing values or mix subsidiary-level and group-level figures. In that setting, scale can make Avaada look investable, but opacity can still make the price wrong.",
