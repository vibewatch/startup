    {
      "id": "V-VAL-5",
      "title": "Final diligence asks and thesis-break triggers",
      "body": "The most important next step is not another narrative interview; it is a proper capital-structure and operating-metrics workstream. Investors need the exact latest group post-money valuation, ownership by major entity, debt by SPV and holdco, consolidated EBITDA or cash generation, and the relationship between Avaada Energy, Avaada Ventures and Avaada Electro. They also need to know how much of the platform's value is really in operating renewables versus manufacturing expansion versus molecule optionality. Without that decomposition, comps can be cherry-picked to support almost any number. Entry discipline should therefore be explicit: if management cannot provide a clean current cap table, group-wide debt schedule, operating-asset cash yield, and a clear bridge from 7.2 GWp operational scale to equity value, then the thesis remains interesting but not ready for a conviction price. The valuation breaks if execution slips materially, refinancing becomes meaningfully more expensive, or the manufacturing and molecule businesses absorb capital without external proof of margin and demand.",
