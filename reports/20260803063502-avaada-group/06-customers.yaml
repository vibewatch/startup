    {
      "id": "U-CUS-2",
      "title": "Adoption trajectory is measured in contracted capacity, not logo count",
      "body": "For Avaada, adoption is best measured through contracted capacity, signed PPAs and the spread of counterparties across special-purpose vehicles. The clearest company-stated milestone is the May 2024 NTPC tender win, where Avaada said it secured 1,050 MWp at INR 2.69 per kWh and had crossed more than 15 GWp of Letters of Award and PPAs in India. Rating reports add more texture by showing multiple project entities with 25-year off-take arrangements across different buyer classes. DVC anchors a 421 MWdc or 300 MWac Gujarat project, SECI and NDMC back a 200 MWac Gujarat project, Sunrays pools 1,210 MWac across NHPC, SECI, MSEDCL and HPPC, RUVITL backs a 200 MWac Rajasthan project, and BSPHC-linked entities back a 50 MWac Bihar project. The growth pattern is therefore not a classic account-expansion funnel. It is a bid-driven progression from awarded project to signed PPA to commissioned capacity and then to repeat qualification for larger tenders or adjacent industrial offtake.",
      "claimRefs": [
