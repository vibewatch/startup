  "callouts": [
    {
      "calloutType": "strength",
      "title": "Real customer proof exists in bankable project documents",
      "body": "Avaada has stronger public customer evidence than many private climate companies because rating rationales and official project releases name counterparties, contract tenor, capacity and sometimes tariffs. NTPC, DVC, SECI, NHPC, MSEDCL, HPPC, UPPCL and Mysore Ammonia are all explicitly visible in retained sources.",
      "claimRefs": [
        "CU005",
        "CU006",
        "CU007",
        "CU008",
        "CU011",
        "CU017"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Asset-level concentration remains a real customer risk",
      "body": "Group-level breadth should not hide SPV-level concentration. AGPL is a single-counterparty SECI project, the restricted group is 90 percent exposed to UPPCL, and other project entities also rely on sole or dominant off-takers. Customer quality therefore has to be underwritten at project level, not just by total portfolio scale.",
      "claimRefs": [
        "CU020",
        "CU027",
        "CU034",
        "CU036"
      ]
    },
    {
      "calloutType": "risk",
      "title": "Corporate and open-access diversification is still under-proven publicly",
      "body": "Retained sources do suggest that Avaada serves corporates and institutional end users, but the public record does not provide enough named contracts, volumes or revenue share to treat that segment as a de-risked diversification lever. The strongest proof remains public-sector and intermediary PPAs.",
      "claimRefs": [
        "CU003",
        "CU024",
        "CU025",
        "CU035"
      ]
    }
  ],
