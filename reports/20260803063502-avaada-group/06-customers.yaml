    {
      "id": "U-CUS-5",
      "title": "Expansion potential exists, but concentration still has to be underwritten project by project",
      "body": "The encouraging part of Avaada's customer story is that the group is not tied to a single buyer class at the portfolio level. It now shows evidence of central agencies, state utilities, statutory bodies, defence-related buyers and an early industrial green-molecule channel. The less comfortable part is that concentration remains very real at the individual-asset level. AGPL is a single-counterparty SECI project. The restricted group is 90 percent exposed to UPPCL. CARE's Solar Power and Clean Sustainable reports each describe sole or dominant off-taker structures with moderate credit risk that are acceptable largely because payments have remained timely and contractual protections exist. Public evidence also leaves real blind spots: there is no disclosed top-10 customer concentration by revenue, no robust breakdown of corporate or open-access share, and no proof yet of recurring delivered green-ammonia volumes. The right verdict is therefore positive on adoption, cautious on diversification quality, and insistent on project-by-project counterparty diligence.",
      "claimRefs": [
        "CU033",
        "CU034",
        "CU035",
        "CU036"
      ],
