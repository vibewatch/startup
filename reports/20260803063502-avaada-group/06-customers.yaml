  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Avaada's customer base is best understood as long-term offtake counterparties rather than consumer end users. Public proof is strongest for utility and public-sector buyers such as NTPC, SECI, DVC, NHPC, MSEDCL, HPPC, UPPCL, RUVITL and BSPHC-linked entities, plus an early industrial green-ammonia offtake MoU with Mysore Ammonia. The durability signal is 25-year PPA tenor and generally acceptable collection behavior, not SaaS-style retention metrics. The main customer risk is uneven concentration by SPV and limited named proof for corporate or open-access customers despite broad company claims."
  },
  "sections": [
    {
      "id": "U-CUS-1",
      "title": "Customer segmentation and who actually pays",
      "body": "Avaada's public customer evidence looks very different from a software or consumer company. The buyer is usually not an end user choosing a product; it is a power counterparty or industrial offtaker signing a long-term contract against a specific project or future output stream. The strongest public evidence sits with central agencies and public-sector intermediaries such as NTPC, SECI and NHPC, state-linked buyers such as UPPCL, MSEDCL, HPPC, RUVITL and BSPHC-linked discoms, and statutory or public bodies such as DVC, NDMC and the Ordnance Factory network. The newer customer surface is green ammonia, where Mysore Ammonia has signed a long-term offtake MoU for future supply. There are also broad statements that Avaada serves corporates, hotels, hospitals, education institutions and industrial users, but public named proof for those segments is much thinner than the utility offtaker record. That means the right customer map is counterparty-led, project-linked and partly public-sector concentrated.",
