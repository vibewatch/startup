    },
    {
      "id": "U-CUS-3",
      "title": "Named customer proof is strongest where capacity, tariff and tenor are disclosed",
      "body": "The quality of named customer proof is high by infrastructure standards when a source names the counterparty and states contract structure. The best examples are the DVC, NTPC, SECI and UPPCL-linked projects because official releases or rating notes specify plant size, tariff or tenor. ICRA's 2026 note on AGPL goes even further by naming the downstream structure: a 25-year PPA at Rs 2.61 per unit with SECI, which itself signed a PSA with NDMC. CARE's Sunrays report names four off-takers and quantifies their share of the 1,210 MWac pool. CARE's restricted-group reports identify the Ordnance Factory and UPPCL split for a smaller but operational portfolio. The green-ammonia evidence is notable because it provides named industrial counterparties rather than just project ambition; Avaada and Mysore Ammonia describe a long-term MoU for 100,000 tonnes per year. What public evidence does not provide nearly as well is deep named proof for corporate or open-access electricity buyers.",
