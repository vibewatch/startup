  topStrengths:
    - 官方披露 17.7 GWp 组合、超过 7.2 GWp 已投运，Avaada 已跑出真实运营规模。
    - 平台拿到战略股权式资本，也在 2026 年获得大额债务融资；贷款人与投资人仍认可这批资产可融资。
    - Avaada 横跨发电、制造、储能和绿色分子；只要执行和需求兑现，纵向整合可能放大上行空间。
    - 公司与印度政策推动的可再生能源、制造业和绿色氢能建设高度同向。
  topRisks:
    - 公开来源没有清楚披露 Avaada 当前集团投后估值、股权结构表或合并 EBITDA，价格发现偏弱。
    - PPA 和并网延迟会推后投产，也会拖慢组合规模转化为经营现金流。
    - 平台同时扩张多个资本密集业务，再融资和杠杆压力仍然很重。
    - SPV 层面的购电方集中度和公用事业付款行为仍可能挤压项目现金流。
    - 外部需求、利润率和商业化尚未验证之前，制造和绿色分子选择权可能先吃掉资本。
  unresolvedGaps:
    - 主要法律实体的当前集团投后估值和所有权比例，在可取得公开来源中仍未披露。
    - 控股公司和 SPV 层面合并债务、到期结构和再融资条款没有清晰公开表。
    - 公开证据没有给出发电、Electro 和分子业务的收入、EBITDA 与现金生成拆分。
    - Avaada Group、Avaada Energy、Avaada Ventures 和 Avaada Electro 之间的法律实体桥接仍不够清楚，无法精确做分部加总估值。
    - 制造扩张和绿色分子项目的外部需求、利润率和时点证明仍不完整。
