company:
  name: Avaada Group
chapter:
  number: 1
  title: Company Overview
  summary: Avaada Group is a promoter-led Indian clean-energy platform spanning renewable power generation, solar PV manufacturing, energy storage, green hydrogen and green ammonia. Public evidence shows a rapid scale-up from roughly 4 GW in 2023 to a reported 17.7 GWp portfolio by May 2026, backed by Brookfield, GPSC and project-finance partners, but consolidated group financial disclosure remains thin. The strongest current diligence positives are execution momentum, manufacturing build-out and state-backed project pipeline; the principal open issues are leverage, refinancing dependence, opaque group governance and the absence of a current public valuation benchmark.
sections:
- id: identity-and-platform
  title: Identity and business model
  body: 'Avaada Group presents itself as an Indian clean-energy conglomerate built around an integrated value chain rather than a single-asset independent power producer. Official materials describe the operating footprint across renewable power generation, solar PV manufacturing, green hydrogen and derivatives, battery storage, pumped hydro, and increasingly green-data-centre power solutions. The strategic positioning has shifted from plain utility-scale solar toward ''Always Clean, Always On'' supply: the group pairs solar and wind generation with firming technologies such as storage, hybrid projects and FDRE structures so it can serve round-the-clock industrial, utility and infrastructure demand. That matters because Avaada is trying to monetize not just low-cost generation, but reliability, domestic manufacturing and green-molecule optionality inside India’s broader energy-transition push. The business model is therefore capital intensive, partnership heavy and policy-linked, with value
    creation dependent on winning land, transmission access, PPAs, manufacturing scale-up and concessional capital at the same time.'
  claimRefs:
  - CO001
  - CO002
  - CO009
  - CO010
  - CO023
