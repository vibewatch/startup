  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current group board roster, independent-director count, audit and risk committee structure, and any consolidated governance charter.
    whyItMatters: A capital-intensive private group expanding simultaneously across generation, manufacturing and green fuels needs governance visibility to assess oversight, related-party risk and succession resilience.
    diligencePath: Request the latest group board pack, committee charters and shareholder-rights summary in the data room.
    relatedQuestionRefs:
    - QO006
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: Current group valuation, post-money share count, preference stack and any secondary transaction marks after the 2023 Brookfield/GPSC round.
    whyItMatters: Without a current valuation benchmark, investors cannot translate Avaada’s scale narrative into entry pricing or dilution-adjusted economics.
    diligencePath: Obtain the cap table, the latest board-approved valuation materials and any financing or IPO-prep presentations.
    relatedQuestionRefs:
    - QO023
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-financials
    missingEvidence: Audited consolidated group revenue, EBITDA, net debt, project-level debt schedule and parent guarantees across the platform.
    whyItMatters: Subsidiary rating reports show pieces of the financing structure, but not enough to underwrite leverage, cash generation or refinancing risk at the group level.
    diligencePath: Request the latest consolidated audited statements, lender presentations and debt maturity waterfall.
