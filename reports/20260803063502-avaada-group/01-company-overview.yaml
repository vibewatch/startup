- id: milestones-and-watchpoints
  title: Milestones, partnerships and current watchpoints
  body: 'The public milestone record shows a business that has repeatedly used state partnerships and strategic capital to jump to the next scale layer. Early Gujarat projects in 2009-2011 were followed by landmark single-site solar builds, a 2021 GPSC recapitalization, a 2022 1.25 GWp Rajasthan project, the 2023 Brookfield/GPSC funding round, and a run of 2024-2026 manufacturing, grid and hydrogen announcements. Recent milestones are notable because they point to optionality rather than just megawatt growth: the Gujarat and Bihar memoranda extend land and state relationships; the Gopalpur Port and Odisha ammonia steps create a logistics path for green-molecule exports; and the SCGJ centre adds a skilling moat around hydrogen manufacturing. The same record also surfaces the main diligence watchpoints. Subsidiary rating reports repeatedly mention leverage, single-offtaker exposure and sponsor support; media coverage points to refinancing needs; and public disclosures remain far stronger at
    subsidiary level than at the consolidated holding-company level. The platform looks strategically important and fast moving, but it is still not a fully transparent late-stage issuer.'
