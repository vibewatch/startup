  topStrengths:
    - >-
      Avaada has demonstrated real operating scale, with an official 17.7 GWp portfolio and more than 7.2 GWp already
      operational.
    - >-
      The platform has attracted both strategic equity-style capital and substantial 2026 debt financing, supporting the
      view that lenders and investors still find the asset base bankable.
    - >-
      Avaada's integrated position across generation, manufacturing, storage, and green molecules could create upside if
      execution and demand materialize.
    - The company is strongly aligned with India's policy-driven renewable, manufacturing, and green-hydrogen buildout.
  topRisks:
    - >-
      Public sources do not cleanly disclose Avaada's current group post-money valuation, cap table, or consolidated
      EBITDA, making price discovery weak.
    - >-
      Delays in PPAs and grid connectivity can postpone commissioning and delay conversion of portfolio scale into
      operating cash flow.
    - >-
      Refinancing and leverage remain material because the platform is scaling several capital-intensive businesses at
      once.
    - SPV-level off-taker concentration and utility-payment behavior can still pressure project-level cash flows.
    - >-
      Manufacturing and green-molecule optionality may absorb capital before external demand, margins, and
      commercialization are proven.
  unresolvedGaps:
    - >-
      Exact current group post-money valuation and ownership by major legal entity remain undisclosed in accessible
      public sources.
    - >-
      Consolidated debt, maturity, and refinancing terms across holdco and SPV layers are not available in a clean
      public schedule.
    - >-
      Public evidence does not provide business-level revenue, EBITDA, and cash generation splits across generation,
      Electro, and molecule ventures.
    - >-
      The legal-entity bridge among Avaada Group, Avaada Energy, Avaada Ventures, and Avaada Electro is not clear enough
      for precise sum-of-the-parts valuation.
    - >-
      External proof of demand, margins, and timing for manufacturing expansion and green-molecule projects remains
      incomplete.
