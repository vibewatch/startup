tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance to Avaada
  rows:
  - - Utility-scale renewable generation
    - Solar, wind and hybrid project capex plus long-term PPA-backed offtake
    - Coal generation, retail supply margin, unrelated grid assets
    - State utilities, REIAs, public banks
    - Core legacy business and scale engine
  - - Firm and dispatchable clean power
    - FDRE structures, hybrid assets, storage-linked supply, scheduling value
    - Standalone merchant volatility without contract support
    - Utilities and large corporates
    - Important for “Always On” positioning
  - - C&I open-access power
    - Open-access solar or hybrid plants, wheeling, banking and RTC offerings
    - Residential retail, behind-the-meter hardware not sold by Avaada
    - Corporate energy managers, CFOs, plant heads
    - Higher-value adoption path than generic utility PPAs
  - - Battery and pumped storage
    - BESS project capex, storage tenders, ancillary flexibility value
    - Consumer electronics batteries
    - Utilities, grid operators, storage tenders
    - Key firming adjacency for Avaada
  - - Green hydrogen and derivatives
    - Electrolysers, renewable input power, ammonia or methanol production, storage and export logistics
    - Grey hydrogen, unrelated chemicals
    - Industrial decarbonizers, ports, export buyers
    - Strategic future-growth wedge for Avaada
  - - Domestic solar manufacturing
    - Cells, modules, future integration and domestic supply-chain incentives
    - Imported module trading without local capex
    - Developers, EPCs, government-backed demand pools
    - Supports internal supply and margin control
  notes: Boundary distinguishes the market pools Avaada can realistically address from the broader Indian power sector, which includes many revenue pools the company does not visibly serve.
