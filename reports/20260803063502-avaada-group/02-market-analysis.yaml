- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Record solar build-out and 50% non-fossil milestone
    - Positive
    - Current
    - Confirms strong national deployment momentum
    - How much of incremental build remains economically attractive after easy sites are absorbed?
  - - 151 GW under-construction RE pipeline
    - Positive
    - Near term
    - Large pipeline supports multi-year developer demand
    - What portion has transmission and land fully secured?
  - - Storage tenders and falling BESS tariffs
    - Positive
    - Current to near term
    - Makes dispatchability products more financeable
    - Are low tariffs still equity-accretive for developers?
  - - Hydrogen mission incentives and standards
    - Positive
    - Current to medium term
    - Creates policy scaffolding for green-fuels investment
    - Which subsegments reach bankable offtake first?
  - - Transmission and evacuation bottlenecks
    - Negative
    - Current
    - Can delay commissioning and compress realized returns
    - What is the project-level transmission readiness by state and node?
  - - Offtake demand risk
    - Negative
    - Current to medium term
    - Capacity creation may outpace buyer absorption
    - How fast are utility and industrial buyers signing long-term contracts?
  - - Banking and state-rule heterogeneity
    - Mixed
    - Current
    - Can improve economics or create hidden compliance cost
    - Which states allow bankability-compatible structures for large hydrogen and C&I projects?
  - - Foreign capital and macro volatility
    - Negative
    - Current
    - FDI slowdown and refinancing cost can hit aggressive expansion plans
    - How sensitive are developer IRRs to debt cost and FX assumptions?
  notes: Pairs growth catalysts with the operational bottlenecks most likely to determine whether headline capacity targets translate into bankable project returns.
