- id: buyers-and-adoption
  title: Buyer, payer and adoption pathways
  body: 'Buyer structure in Avaada’s market is fragmented, and that fragmentation shapes monetisation. State utilities, SECI-style agencies and public counterparties still anchor large utility-scale procurement via long-term PPAs, giving developers volume but also exposing them to tender design and DISCOM behaviour. Corporates represent a separate adoption path: open-access and round-the-clock clean-power buyers are purchasing reliability, tariff visibility and compliance with RE100 or decarbonisation targets, not just lowest headline solar cost. Storage and FDRE products exist because variable-renewable penetration is forcing buyers to pay more attention to firming and delivery quality. Green hydrogen and derivatives add a third pathway where the effective buyer may be a fertiliser producer, steelmaker, shipping customer, port operator or export intermediary rather than a power utility. Adoption therefore typically runs through policy eligibility, transmission access, financing, tender
    participation, technology availability and then contract bankability. Avaada’s advantage is that its product menu spans more than one buyer type, but each segment has a different payer, approval loop and time-to-revenue profile.'
