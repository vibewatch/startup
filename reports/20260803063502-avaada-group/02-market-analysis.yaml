company:
  name: Avaada Group
chapter:
  number: 2
  title: Market Analysis
  summary: 'Avaada operates in an Indian clean-power market that is both enormous and internally segmented: utility-scale solar and wind, hybrid and storage-backed firm power, domestic solar manufacturing, and an emerging green-hydrogen or ammonia ecosystem. Official data show India already at 288.6 GW total renewable capacity as of June 2026, with record annual additions and 151 GW under construction, but adoption constraints are shifting from pure capacity creation to transmission readiness, storage integration, banking rules and offtake growth. For Avaada, the most relevant market conclusion is that scale still matters, but integrated execution across generation, storage, manufacturing and industrial demand is becoming the real differentiator.'
sections:
- id: market-boundary
  title: Market boundary and included spend
  body: 'The relevant market for Avaada is not simply “Indian renewables” as a monolithic megawatt pool. Avaada sells into several adjacent but distinct spend categories: utility-scale solar and wind capacity procured by state utilities and renewable-energy implementing agencies; hybrid, FDRE and storage-backed power where buyers pay for reliability rather than only cheapest kWh; commercial and industrial open-access procurement for corporations seeking round-the-clock clean power and Scope 2 decarbonisation; and green-hydrogen or ammonia projects where renewable electricity is an input into industrial decarbonisation and exports. Domestic solar manufacturing also matters because India’s policy stack increasingly rewards local modules and cells. Excluded spend includes conventional thermal generation fuel, downstream retail supply economics and unrelated power-equipment categories where Avaada has no visible operating footprint. The market is therefore best understood as an infrastructure
    platform opportunity shaped by megawatt additions, storage procurement, industrial electrification, transmission and hydrogen policy—not just a single national capacity target headline.'
