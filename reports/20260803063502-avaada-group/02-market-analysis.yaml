- id: policy-tailwinds
  title: Policy and technology tailwinds
  body: 'India’s policy stack is broadening from capacity-addition support to system-enablement support. The National Green Hydrogen Mission includes a total outlay of INR 19,744 crore, with INR 17,490 crore for the SIGHT programme, plus pilot, R&D and other allocations. MNRE’s enabling framework explicitly includes interstate-transmission-charge waivers, renewable-energy banking, open access and connectivity support for hydrogen projects. Standards for green ammonia and methanol now provide measurable carbon-intensity thresholds, which matters for export credibility and industrial procurement. At the power-system level, storage is moving from optional add-on to mainstream procurement category: CEEW counted 37 storage tenders in FY26, including 31 BESS tenders, while tariff discovery fell to INR 1.23 per unit in one APTRANSCO benchmark. These policy and market shifts directly support Avaada’s integrated positioning in renewables, storage, manufacturing and hydrogen.'
