- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Utility-scale solar/wind
    - REIAs, state utilities, DISCOM-linked entities
    - Grid and retail load base
    - Public-sector offtaker under PPA
    - Tender -> award -> land/transmission -> financing -> commissioning
    - Utility procurement and state energy departments
    - Tariff competitiveness and target compliance
  - - Hybrid / FDRE / storage-linked power
    - Utilities and large industrial offtakers
    - Load centres needing firmer power
    - Utility or corporate counterparty
    - Tender or bilateral procurement -> dispatch qualification -> financing
    - Procurement plus operations
    - Need for reliability beyond standalone solar
  - - C&I open-access clean power
    - Large corporates and industrial parks
    - Factories, campuses, data-centre operators
    - Corporate treasury / energy budget
    - Site load study -> open-access structuring -> PPA -> commissioning
    - CFO, sustainability and operations teams
    - Tariff visibility, RE100 and uptime requirements
  - - Battery storage
    - Utilities, transmission entities, RE developers
    - Grid balancing and peak shifting operations
    - Tendering authority or developer capex budget
    - Tender -> storage sizing -> financing -> integration
    - Grid planning and developer investment committees
    - Renewable integration and ancillary-service demand
  - - Green hydrogen / ammonia
    - Fertilizer, steel, shipping, export infrastructure, ports
    - Industrial decarbonization processes and export chains
    - Industrial capex / strategic partnership budgets
    - Policy qualification -> renewable sourcing -> technology selection -> offtake
    - Industrial procurement and strategic projects teams
    - Mandates, export opportunity and fuel substitution economics
  - - Solar manufacturing
    - Developers, EPCs, procurement consortia, group internal demand
    - Project-construction value chain
    - Developer or EPC procurement budget
    - ALMM / domestic-content alignment -> order book -> delivery
    - Supply-chain and procurement leaders
    - Domestic manufacturing incentives and supply security
  notes: Maps buyer, user and payer separately because Avaada’s addressable market spans public procurement, corporate energy purchases and industrial decarbonisation rather than one uniform customer type.
