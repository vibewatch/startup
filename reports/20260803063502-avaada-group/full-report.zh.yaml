      - number: '7.5'
        title: 财务模型、人员与投资论点破裂风险
        blocks:
          - type: paragraph
            body: >-
              核心财务风险不是 Avaada 拿不到资本，而是资本一直可得，可能诱使集团跑得比自身运营验证更快。ET 报道，2025-26 年公司计划投入 ₹20,000 crore 资本开支，其中 75%
              靠债务；多份评级报告仍描述某些资产池存在杠杆结构、到期一次性再融资风险，或债务 / EBITDA 超过
              6x。只要资产按时并网、回款健康、制造按计划爬坡，这可以管理。一旦电网延误持续、交易对手质量恶化、再融资变贵，或新工业业务在收入到来前先吃掉现金，风险就会变危险。还有一层执行—治理风险：Avaada
              横跨公用事业级发电、混合与
              FDRE、制造、绿色燃料、抽水蓄能、电池储能和绿色数据中心。创始人主导的一体化战略可以是优势，但协调失败的成本也更高。清晰的投资论点会在几种情况下破裂：延误明显超出当前披露；杠杆不再随经营现金流摊还；分子项目进入投产窗口时仍没有商业约束；或制造扩张消耗资本，却拿不出外部需求多元化。
            claimRefs:
