      - number: '7.6'
        title: 展项
        blocks:
          - type: callout
            title: 执行滑坡由管理层确认，不只是分析师推断
            body: Mittal 明确告诉 ET，PPA 延迟和电网接入是部分项目推进慢于计划的两个原因，一些接入时间从 2027 年推迟到 2028-2029 年。因此，在公开记录里，执行时点是最清楚的近期剩余风险。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 集团层面看似分散，底层仍有单一买方敞口
            body: Avaada 的组合在集团层面看起来很宽，但项目文件仍显示仅 SECI、仅 RUVITL、挂钩 BSPHC 和 90% UPPCL 敞口等单一或高度集中的买方结构。投资人需要按资产级别承销，而不只是听组合故事。
            calloutType: risk
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
          - type: callout
            title: 资本可得能缓释风险，但不能替代已降险的执行
            body: 2026 年反复出现的债务融资落地和贷款人沟通说明，Avaada 仍能吸引严肃融资。它降低了短期流动性恐慌风险，但如果时间线和利润率落空，再融资、投运或商业化风险不会消失。
