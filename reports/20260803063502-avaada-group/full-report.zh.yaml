    rows:
      - - 按业务线拆分的合并 EBITDA 和 EBIT
        - 用来区分规模增长和真实盈利能力
        - 可能揭示收入很大但控股公司经济性很薄，甚至为负
        - 索取经审计分部 P&L 和利润率桥
      - - 按承购方和实体拆分的应收账款账龄
        - 印度电力行业付款质量会拖累现金转化，这项信息很关键
        - 营运资本压力和契约压力可能被隐藏
        - 索取账龄分桶、逾期趋势和拨备政策
      - - 控股公司及子公司的净债务和到期梯队
        - 决定再融资风险和结构性次级风险
        - 可能暴露项目债务与控股公司义务的错配
        - 按借款人、期限、担保和币种索取债务明细
      - - 制造业务毛利率和外部客户结构
        - 只有产能数字，不能证明经济性有吸引力
        - 集团内订单可能抬高利用率，却不带来强现金毛利
        - 索取客户结构、ASP、BOM 成本、库存周转
      - - 氢 / 氨资本开支和已签约承购
        - 防止估值中过度给成长选项计分
        - 可能显示在缺乏确定需求时仍要长期烧钱
        - 索取项目级资本开支、补贴和有约束力的承购协议
      - - 月度烧钱 / 现金生成桥
        - 用来判断增长能否自我供血
        - 可能显示即便在扩张期，公司仍依赖反复外部融资
        - 索取按实体和业务线拆分的月度现金瀑布
    notes: 这些缺口不是边角问题；仅靠公开数据承销 Avaada 时，它们就是核心卡点。
