      - number: '1.4'
        title: 规模、产业足迹与路线图
        blocks:
          - type: paragraph
            body: >-
              运营上，Avaada 已不再只是狭义公用事业太阳能开发商。2026 年 5 月项目组合更新显示，其可再生能源项目达 17.7 GWp，其中超过 7.2 GWp 已运营、约 10.5 GWp 在建，仅
              FY2025-26 就新增超过 2 GWp。集团项目地图覆盖至少九个印度邦；产业战略也纳入 Uttar Pradesh 和 Maharashtra 的组件与电池制造、Odisha 的氢和氨项目，以及从多 GW
              抽水蓄能到公司材料中 16 GWh BESS 管线的储能雄心。Avaada Electro 是观察这轮建设的最清晰公开窗口：ICRA 和公司可持续发展披露显示，其组件产能为 8.5 GW，Butibori 的 6
              GW 电池产线在爬坡，还规划进一步扩建 Noida，订单簿超过 20 GW。这种广度强化了产业逻辑，但也抬高了执行风险，因为制造、储能和绿色燃料项目各自有不同的爬坡曲线和资本需求。
