      - number: '8.3'
        title: 可比公司组和 20 亿美元锚点的含义
        blocks:
          - type: paragraph
            body: >-
              用哪组上市可比公司看，20 亿美元的 Avaada 集团价值含义完全不同。Adani Green 是高估值基准：CompaniesMarketCap 显示，截至 2026 年 8 月，其市值为 241.6
              亿美元；ET 报道，FY26 新增 5.05 GW 后，运营容量达到 19.3 GW。ReNew 的表观市值低得多，Yahoo 显示截至 2026 年 7 月 31 日市值约 22.7 亿美元、企业价值 96.2
              亿美元；公司披露运营容量约 12.6 GW，总容量约 20 GW。Tata Power 市值 127.6 亿美元，但业务是更宽的公用事业公司，因此只能算松散相邻可比。NTPC Green 80.2 亿美元市值和
              60 GW 雄心表明，即便不套用商电或 IPP 同业同样的运营指标，公共投资人也会给战略性清洁电力可选性定价。放在这些可比公司旁边，仅按容量看，Avaada 20 亿美元集团价值并不显得荒唐：按 7.2 GWp
              运营容量计算，每运营 GW 只约 2.8 亿美元。但容量经验法忽略债务、PPA 质量、现金生成和新业务执行成本。因此，可比公司只能说明可能性，不能证明估值。
