      - number: '8.5'
        title: 最终尽调问题和投资论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              最重要的下一步不是再做一次叙事访谈，而是启动真正的资本结构和运营指标工作流。投资人需要拿到集团最新投后估值、主要实体所有权、SPV 和控股公司债务、合并 EBITDA 或现金生成，以及 Avaada
              Energy、Avaada Ventures、Avaada Electro
              之间的关系。还要弄清平台价值到底有多少来自运营中的可再生能源，多少来自制造扩张，多少来自分子可选性。没有这层拆解，可比公司可以被任意挑选来支撑几乎任何数字。因此，进入纪律必须写清楚：如果管理层无法提供干净的当前股权结构表、集团层面债务排期、运营资产现金收益，以及从
              7.2 GWp 运营规模到股权价值的清晰桥接，论点仍有意思，但还不足以给出高确信价格。一旦执行明显滑坡、再融资显著变贵，或制造与分子业务吸收资本却没有外部利润率和需求验证，估值就会破裂。
