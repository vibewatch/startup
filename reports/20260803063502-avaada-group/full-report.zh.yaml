            body: >-
              Avaada 披露经济性时，通常停留在项目或制造子公司层面。CARE 2025 年关于 Avaada Clean Energy 组合太阳能结构的报告显示，FY25 加权平均电价为每单位 ₹3.32，加权平均
              PLF 为 22.6%，前瞻平均 DSCR 高于 1.3x，Total Debt/EBITDA 为
              5.6x。这有用，因为它说明运营资产组合的经济性可融资，但仍有杠杆，并暴露于交易对手质量、天气和浮动利率债务。ICRA 的 Avaada Inclean 报告同样描述了一个 300 MW、DVC
              支持的太阳能项目，具备固定电价收入可见性、19 年债务和累计 DSCR 高于 1.2x。制造端，ICRA 和 pv magazine 报道 Avaada Electro 已达到 8.5 GW
              运营组件产能，FY2025 产能利用率 83%，H1 FY2026 为 59%，订单簿主要由集团需求支撑。这些都是收入可见性的强信号，但没有转让定价、营运资金和应收数据，就无法干净转化为集团层面利润率。
