      - number: '4.3'
        title: 资本充足性、再融资与扩张依赖
        blocks:
          - type: paragraph
            body: >-
              Avaada 仍深度依赖资本。2023 年融资包以 $1.3B 交割，确立 Brookfield 主导资金作为集团扩张发电、制造和绿色燃料的骨干。到 2026 年中，管理层正寻求约 $750-800M
              再融资，来源包括离岸借款和本地债券；ET 将这次操作描述为成本优化，而非短期到期压力。即便如此，事实仍凸显融资结构对模式至关重要：ET 报道称 Brookfield 融资是一笔 $1B 零息可选择转换工具，约
              $400M 于 2023 年 3 月提取，其中近 $230M 注入 Avaada Energy，剩余金额支持 Avaada Electro、Avaada Green Fuels
              和债务提前偿还。制造扩张又增加一项重大资本需求。ICRA 2025 年报告称，一个新的 3 GW 电池和组件设施项目成本约 ₹2,427 crore，由约 ₹607 crore 发起人出资和 ₹1,820
              crore 新债支持；Avaada Electro 也在准备拟议 ₹9,000-10,000 crore IPO。因此财务故事是：执行依赖持续获得债务和股权，而不是自筹有机扩张。
