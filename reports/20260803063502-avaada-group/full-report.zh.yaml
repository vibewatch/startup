  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              看多 Avaada，起点是规模和战略相关性。集团官方称，组合已超过 17.7 GWp，其中 7.2 GWp 以上已运营、约 10.5 GWp 在建。它还为印度私营可再生能源平台拿到罕见的大额资本承诺：从 2023
              年 Brookfield 和 GPSC 支持的融资轮开始，又延伸到 2026 年 FDRE、太阳能和混合资产的大额债务融资落地。Avaada
              不是一个小项目开发商在找故事，而是一个横跨发电、制造和绿色分子的规模化平台。反论点在于，估值透明度远低于运营雄心。公开可访问的追踪页给出融资和部分收入线索，却没有提供集团当前清晰的投后估值；二手文章暗示的价值差异很大，或混用子公司和集团层面数字。在这种情况下，规模能让
              Avaada 看起来值得投资，但不透明仍可能让价格出错。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
