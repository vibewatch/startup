  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Avaada 的相关市场不能简单看成「印度可再生能源」这个单一 MW 池。Avaada 切入的是几个相邻但不同的支出类别：邦级公用事业和可再生能源实施机构采购的大型太阳能与风电容量；买方为可靠性而非最低 kWh
              付费的混合、FDRE 和储能支撑电力；企业为全天候清洁电力和 Scope 2
              减碳采购的商业与工业开放接入；以及绿氢或绿氨项目，其中可再生电力是工业减碳和出口的输入。本土太阳能制造同样重要，因为印度政策组合越来越奖励本地组件和电池。排除的支出包括传统火电燃料、下游零售供电经济性，以及
              Avaada 没有可见经营足迹的无关电力设备类别。因此，这个市场最好理解为由 MW 新增、储能采购、工业电气化、输电和氢政策共同塑造的基础设施平台机会，而不只是单一国家容量目标的头条。
