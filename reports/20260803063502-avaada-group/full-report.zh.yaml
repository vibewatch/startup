    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Avaada Group 对外呈现为一家围绕一体化价值链搭建的印度清洁能源集团，而不是单一资产型独立发电商。官方材料显示，其经营足迹覆盖可再生能源发电、太阳能 PV
              制造、绿氢及衍生品、电池储能、抽水蓄能，以及越来越多的绿色数据中心供电方案。战略定位已从普通大型太阳能转向「Always Clean, Always On」供应：集团把太阳能和风电与储能、混合项目、FDRE
              结构等保供技术组合起来，服务工业、公用事业和基础设施的全天候需求。关键在于，Avaada
              试图变现的不只是低成本发电，还有可靠性、本土制造，以及印度整体能源转型中的绿色分子可选性。因此商业模式资本密集、依赖伙伴，也与政策强绑定；价值创造取决于能否同时拿下土地、输电接入、PPA、制造规模爬坡和优惠资本。
