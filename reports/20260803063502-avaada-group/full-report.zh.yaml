      - number: '2.2'
        title: 规模测算视角与建设速率
        blocks:
          - type: paragraph
            body: >-
              官方和市场研究数据证实，印度可服务市场仍具结构性规模。MNRE 2026 年 6 月实物进展报告显示，不含大型水电的可再生装机为 236.5 GW，含大型水电的总可再生装机为 288.6 GW，其中太阳能
              162.2 GW、风电 57.4 GW。印度提前实现非化石来源占已装机电力容量 50%，并在 FY2025-26 新增创纪录的 55.3 GW 非化石容量。顶线之下，运行速率由太阳能主导：JMK 估计 2026
              年上半年新增 26 GW 太阳能和 3 GW 风电；Mercom 统计仅 2026 年一季度就新增 15.3 GW 太阳能。CEEW 的市场手册又提供另一视角：截至 2026 年 3 月，约 151 GW
              可再生容量在建。这些数字衡量口径并不完全相同，但合在一起说明市场远未饱和。对 Avaada 而言，实际 SAM
              是这一建设浪潮中的一个子集：一体化可再生能源、储能、本土制造和工业清洁能源需求能在其中拼出可融资优势。
