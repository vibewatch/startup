      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              集团明显以创始人为中心。Vineet Mittal 是 Avaada
              的公开面孔、董事长和战略架构师；多份公司、活动和访谈来源都用他的关系网络、政策参与和印度成为可再生能源枢纽的长期愿景来定义平台身份。公开履历强调他的 NIT 工程训练、Harvard Business
              School 经历、过往电信和互联网经验，以及在 World Economic Forum、B20 能源工作组和 CII 氢标准工作中的角色。Sindoor Mittal
              以副董事长身份负责战略、投资者关系和组织转型；Kishor Nair
              负责可再生电力业务，具备长期项目开发经验。领导层执行可信，但治理透明度明显弱于领导层可见度：可获取公开材料没有给出详细集团董事会名单、委员会结构、独立董事占比或合并治理资料包。对于一家如今同时押注制造、发电和绿色燃料的重资产私营平台，这个披露缺口是真正的尽调限制，不是表面瑕疵。
