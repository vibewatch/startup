      - number: '2.5'
        title: 约束、矛盾与估值相关性
        blocks:
          - type: paragraph
            body: >-
              市场约束现在和增长率一样重要。S&P 2026 年 1 月采访 MNRE 秘书时，对方认为建设容量不是主要问题；找到承购方可能成为限制因素。Mercom、IEA 和 CEA
              都指出，随着可再生能源渗透率上升，输电就绪、外送瓶颈、弃电风险、电网灵活性和储能整合都会成为硬约束。风电新增慢于太阳能，进一步加大单一技术集中度。CSEP
              的绿氢研究显示，银行机制和灵活性可以降低平准化氢成本，但宽松银行规则可能把成本或排放转嫁到别处，邦级执行也仍不均衡。CEEW 还指出，即使容量新增激增，FDI 也走弱，提醒宏观资本条件仍然重要。对 Avaada
              来说，这意味着市场规模头条支撑扩张，但估值应奖励可调度性、买方多元化、制造韧性和资产负债表纪律，而不是简单的 GW 野心。
