      - number: '3.3'
        title: 能力、合同模式与分销对比
        blocks:
          - type: paragraph
            body: >-
              在这组同业中，变现模式仍由长期 PPA、中央或邦级公用事业拍卖主导，企业或开放接入细分虽小但在增长。Azure 的文件把结构说得很清楚：项目通常按固定电价 PPA 出售电力，期限常为 25
              年，公司把承购方实力视为根本。JSW 面向市场的 2026 年公开材料同样把 15–25 年 PPA、开放接入、集团自用和保供清洁电力产品描述为买方主要采购路径。Avaada、ReNew 和 Adani
              都在从商品化太阳能走向混合、储能、稳定电力和制造，但公开电价透明度仍不均衡：只有部分拍卖或争议文件披露准确经济性。这意味着竞争对比应强调谁能在太阳能、风电、储能和工业减碳中赢项目并完成融资，而不是假设买方在一组容易比较的挂牌价之间选择。分销力来自拍卖准入、贷方信心、邦级关系和供应链去风险能力，而不是经典软件式转换成本。
