  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与实际披露内容
        blocks:
          - type: paragraph
            body: >-
              Avaada 的公开财务图景分散在母公司、项目 SPV、制造子公司和信用报告中，而不是一份合并投资者资料包。当前最干净的母公司层面数据点，是第三方从 FY2025 MCA 文件提取的 Avaada Energy
              收入 ₹2,365.7 crore，同比增长 13%。这个数字说明运营平台已具备相当体量，但没有披露分部组合、EBITDA 或各业务线现金生成。公开可观察的收入机制包括大型太阳能资产的长期 PPA、Avaada
              Electro 记账的制造收入、风险隔离 SPV 中的项目级固定电价，以及储能、氢和氨计划带来的未来可选性；后几项的变现证明仍远弱于常规售电。关键承销点是，Avaada 已不再是单一收入流
              IPP，但在狭窄项目或子公司披露之外，市场仍看不到从发电量、内部制造订单和开发 capex 到合并毛利和自由现金流的清晰桥梁。
