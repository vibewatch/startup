        title: 路线图、成熟度与产品阶段结论
        blocks:
          - type: paragraph
            body: >-
              路线图足够大，阶段纪律比讲故事更重要。运营中的可再生发电已经成熟。混合加储能部署看起来仍在早期但是真实存在，有拍卖中标和邦级 BESS
              计划支撑。组件制造已经规模化，电池制造仍处在密集建设阶段。绿氨更早：Avaada
              有公开项目公告、专门垂直业务和外部工艺许可方，但保留证据中还没有运营生产或已签约承购量。正因为阶段组合如此复杂，正确的产品技术结论不能只是「Avaada 多元化」。更好的结论是：Avaada
              有成熟的发电层、正在扩张的制造层、赋能型储能层，以及早期工业分子层。Brookfield 支持的融资、REC
              支持和评级机构反复覆盖，说明路线图不是空谈；但严肃不等于执行已去风险。剩余尽调问题是，这些层会多快相互强化，而不是变成资本密集的平行轨道。
