      - number: '3.5'
        title: 反向证据及其对 Avaada 的含义
        blocks:
          - type: paragraph
            body: >-
              这组同业中的反向证据很重要。Azure 文件显示，当 PPA 延迟、重新谈判或终止时，可再生能源平台叙事会多快被侵蚀：公司仍有 967 MW 等待签署 PPA，退出了一个 150 MW
              混合项目，并描述了终止此前中标的 2,333 MW 制造挂钩 PPA 的尝试。公开信息还显示，全行业许多绿氢和绿氨叙事，都走在已披露长期承购合同或项目级经济性之前。具体到 Avaada，公开来源还不能证明它拥有
              ReNew 所披露的同等深度实名企业客户，也不能证明其已投运资产达到 Adani 式规模。这并不推翻 Avaada 的战略；它只是收紧了尽调镜头。投资者应把 Avaada
              承销为一个可信但仍高度依赖执行的一体化平台，其差异化取决于能否比更大或国资背景对手更快把 MoU、制造计划和氢雄心转化为耐久签约现金流。
