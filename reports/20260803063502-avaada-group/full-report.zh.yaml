              2.69/kWh 的电价拿下 1,050 MWp，并在印度已突破 15 GWp 以上中标通知书和 PPA。评级报告提供更多细节，显示多个项目实体与不同买方类别签有 25 年承购安排。DVC 锚定一个 421
              MWdc 或 300 MWac Gujarat 项目；SECI 和 NDMC 支持一个 200 MWac Gujarat 项目；Sunrays 汇集 NHPC、SECI、MSEDCL 和 HPPC 的 1,210
              MWac；RUVITL 支持一个 200 MWac Rajasthan 项目；BSPHC 相关实体支持一个 50 MWac Bihar
              项目。因此，增长模式不是经典的账户扩张漏斗，而是由投标驱动：从项目中标，到签署 PPA，到投运容量，再到取得更大招标或相邻工业承购的重复资格。
