      - number: '1.5'
        title: 里程碑、伙伴关系与当前观察点
        blocks:
          - type: paragraph
            body: >-
              公开里程碑记录显示，这家公司反复借助邦级合作和战略资本，跃迁到下一层规模。2009-2011 年早期 Gujarat 项目之后，公司相继完成标志性单体太阳能建设、2021 年 GPSC 资本重组、2022 年
              1.25 GWp Rajasthan 项目、2023 年 Brookfield/GPSC 融资，以及 2024-2026 年一系列制造、电网和氢公告。近期里程碑值得关注，因为它们指向的不只是 MW
              增长，还有可选性：Gujarat 和 Bihar 备忘录延展土地和邦级关系；Gopalpur Port 与 Odisha 氨项目为绿色分子出口搭出物流路径；SCGJ
              中心则围绕氢制造增加技能护城河。同一记录也暴露了主要尽调观察点。子公司评级报告反复提到杠杆、单一承购方敞口和发起人支持；媒体报道指向再融资需求；公开披露在子公司层面远强于合并控股公司层面。平台看起来具备战略重要性、推进速度快，但仍不是一个完全透明的后期发行人。
