  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Avaada 位于印度可再生能源开发商第一梯队，但按披露运营规模看并非品类第一。独立 2026 年排名和公司披露一致显示，Adani Green 以约 19.3 GW 运营规模居首，ReNew 以约 12.6
              GW 居次，NTPC Green 约 10 GW；Greenko、JSW 和 Avaada 构成下一组。Avaada 官方叙事比独立太阳能 IPP
              更宽：它组合大型太阳能和风电、混合与储能相关项目、制造雄心，以及绿氢或绿氨路径。因此 Adani Green 和 ReNew
              是最接近的直接私营可比公司，因为它们也把资产建设与相邻制造、储能或工业减碳叙事结合起来。NTPC Green 是中央招标中最重要的国资在位者，Greenko 是最可信的储能导向相邻平台，Azure
              规模较小但仍是相关的太阳能重型可比对象。关键结论是，买方和贷方越来越比较的是平台，而不是孤立项目。
