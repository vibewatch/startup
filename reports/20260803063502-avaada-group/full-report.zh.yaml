      - - 交易对手和回款
        - 付款保障、中央交易对手组合，部分 SPV 有资金池结构
        - 应收账款天数、争议数量、LC 使用率、限电事件
        - 应收账款周期超过内部阈值，或关键购电方实质性争议电价
        - 要求提供交易对手账龄和法律争议日志
      - - 制造爬坡
        - 现有组件基础、ALMM 名单、可能的 IPO 所得款
        - 利用率、缺陷率、外部订单占比、电池片产线投运
        - 电池片产线滑期、质量问题增加，或第三方需求未出现
        - 要求按客户提供订单簿、按产线提供利润率和爬坡曲线
      - - 绿色分子
        - 国家任务支持、标准、港口和许可方合作伙伴关系、具名 MoU
        - 有约束力的承购、EPC 状态、投运日期、交付成本假设
        - 临近投运窗口，项目仍停留在非约束阶段，或缺少买方支持时资本开支继续上升
        - 要求提供照付不议合同、EPC 关键路径和成本结构
      - - 组合摊子过大
        - 横跨电力、储能、制造和燃料的一体化战略
        - 业务线层面的问责、资本开支分配、各业务现金生成
        - 太多未成规模业务在缺少运营证明时争夺资本
        - 要求提供资本配置框架和各业务线止损规则
    notes: 放弃标准面向投资纪律，而不是纯信用监控。
    claimRefs:
      - CR002
      - CR020
      - CR021
      - CR024
      - CR031
      - CR035
      - CR038
      - CR040
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 理由
    rows:
      - - 建议
        - 继续研究
        - 公开规模和融资是真实的，但公开来源没有清楚披露当前集团估值定价。
      - - 信心
        - 中
        - 官方规模和融资证据强；精确估值和资本结构证据不足。
      - - 风险评级
        - 高
        - 执行时点、杠杆、再融资和多业务线商业化仍是重大变量。
      - - 估值立场
        - 有合理性但验证不足
        - 约 $2B 的集团价值按规模启发式看并不明显荒唐，但也没有得到公开验证。
      - - 决策含义
        - 形成价格信念前，必须拿到数据室证据
        - 需要准确的投后估值、债务、EBITDA、资产现金收益率和业务层面价值拆解。
    notes: 建议基于 2026-08-03 可获得的公开证据。用户提供的约 $2B 说法被视作需要测试的外部锚点，而非已验证事实。
    claimRefs:
      - CV001
      - CV010
      - CV018
      - CV025
      - CV035
      - CV042
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 方向
      - 论点
      - 证据锚点
      - 哪些情况会改变判断
    rows:
      - - 正向论点
        - Avaada 已有可观规模；在印度民营公司里，可再生能源平台宽度也少见。
        - 官方 17.7 GWp 组合披露和 2026 年融资流。
        - 如果项目执行放慢，或大部分在建组合滑期，规模应打折。
      - - 正向论点
        - Brookfield、GPSC 和主要银行投入机构资本，说明外部信心仍在。
        - 官方 2023 年融资公告；2026 年债务交割和再融资讨论。
        - 如果再融资大幅收紧或出借人后撤，市场对平台的信心会减弱。
      - - 正向论点
        - $2B 集团价值在某些规模启发式下看起来有合理性，尤其是对照 ReNew 每 GW 市值信号。
        - ReNew 市值 / EV 和 Avaada 官方运营规模。
        - 如果杠杆远高于公开证据暗示，股权价值可能远低于产能启发式所隐含的水平。
      - - 正向论点
        - Electro 的 IPO 可选项说明，核心发电主体之外可能存在隐藏价值。
        - Avaada Electro 的 BS DRHP 和 SEBI 批准报道。
        - 如果 BS 报道的估值传闻被证明夸大，或 IPO 市场关闭，可选项应下调。
      - - 反向论点
        - 当前公开来源没有清楚披露 Avaada 的准确集团估值或投后估值标记。
        - PitchBook 公开页面设门槛；Inc42 提供融资和收入代理指标，但没有清楚给出集团投后估值。
        - 新一轮官方融资、经审计股权结构表，或董事会批准的估值备忘录，能补上这个缺口。
      - - 反论点
        - 二级市场的公开估值信号彼此冲突，还可能把集团、子公司和业务线层面的价值混在一起。
        - Inc42、Startuptimes 和 BS Electro 的文章指向的规模和口径不同。
        - 一张对齐后的法律实体图，按业务列清所有权和估值，能把这个问题解开。
      - - 反论点
        - 按容量估值的经验法忽略债务、上网电价质量、回款和执行风险。
        - CARE/ICRA 项目风险，加上大额再融资活动。
        - 集团 EBITDA、DSCR 和资产层面的现金收益率，能让这些经验法更适合投资判断。
      - - 反论点
        - 多垂直业务扩张会制造表面上行空间，也可能藏着资本拖累。
        - Electro 资本开支计划、绿色分子时间表，以及反复大额融资。
        - 若有证据证明制造业务能增厚利润率、绿色分子商业化具备约束力，信心会提高。
    notes: 关键问题不是 Avaada 有没有战略吸引力，而是现有公开证据是否足以支撑一个具体入场价。
    claimRefs:
      - CV001
      - CV010
      - CV014
      - CV018
      - CV024
      - CV025
      - CV038
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 示意估值区间
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 项目组合按期落地，制造可选性变现，平台溢价获得认可。
        - $3.5B-$5.5B
        - 上行情景；需要的不只是可再生资产执行兑现
        - Electro 可选性低于预期，或融资仍以债务为主、没有股权估值抬升
      - - 基准
        - 核心平台继续扩张，用户提供的 ~$2B 市场说法方向大致成立，但不透明仍在。
        - $1.8B-$3.0B
        - 按现有公开证据看最可信
        - 执行延误、债务成本上升，或集团现金创造低于预期
      - - 悲观
        - 并网 / PPA 延误、再融资拖累和早期绿色分子经济性，令价值主要锚定在已去风险的运营资产上。
        - $0.8B-$1.5B
        - 如果公开叙事跑在实际现金流前面，就有真实下行风险
        - 持续延误、回款质量下降，或资本开支超支
      - - 极端下行
        - 融资即便完成，若经济性弱到投资人只愿以深折价给成熟运营资产估值。
        - $0.5B-$0.8B
        - 概率低，但没有完整债务图谱前不能排除
        - 重大契约压力或再融资失败
      - - 极端上行
        - 如果市场在核心发电之外，还给 Electro 和绿色分子计入显著一体化平台溢价。
        - $5.5B-$7.0B
        - 目前只是叙事上行；公开证据还无法支撑承销
        - 公开市场可选性窗口关闭，或业务层面的价值拆分低于预期
    notes: 区间只是示意性情景带，不是可观察市场标记；它们用来表达公开估值证据不完整带来的离散度。
    claimRefs:
      - CV025
      - CV027
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 可观察信息
      - 公开价值信号
      - 重要性
      - 主要局限
    rows:
      - - Avaada（工作锚点）
        - 官方规模：17.7 GWp 组合，7.2 GWp 已运营，10.5 GWp 在建
        - 用户提供的追踪表说法约 ~$2B；公开一手资料尚未直接验证
        - 定下需要检验的估值问题
        - 集团确切投后估值、债务和 EBITDA 未公开披露
      - - Adani Green
        - 19.3 GW 已运营；市值 24.16B
        - 截至 2026 年 8 月市值约 $24.16B
        - 展示印度公开市场对规模化可再生资产给出的高端溢价
        - 规模大得多、已上市，相比 Avaada 可能有结构性优势
      - - ReNew Energy Global 公司
        - ~12.6 GW 运营、~20 GW 总量、市值 2.27B、EV 9.62B
        - 市值远低于 Adani，但 EV 明显高于市值
        - 有助于检验：债务很关键，单看容量会误导
        - Nasdaq 上市、资本结构和披露基础都明显不同
      - - NTPC Green Energy
        - 8.02B 市值，申报材料中提出 60 GW 目标
        - 带有大额可选性叙事的战略性公开估值
        - 说明公开市场投资人可能奖励清洁电力战略雄心
        - 目标规模不等于当前运营规模
      - - Tata Power
        - 市值 12.76B
        - 印度电力 / 清洁能源的广泛相邻敞口
        - 可作为一体化电力敞口的估值重心参照
        - 不是纯可再生能源平台
      - - Brookfield Renewable / NextEra
        - 市值分别为 16.01B 和 181.28B
        - 全球大盘清洁能源资本标尺
        - 帮助框定全球资本如何给成熟可再生平台定价
        - 不针对印度，结构也与 Avaada 差异很大
    notes: 这组可比公司刻意混合：没有一家上市公司能与一家横跨项目融资、制造和绿色分子的印度私营平台完全同口径对比。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV026
    enumerationScope:
      coverage: partial
      basis: >-
        The table samples the most decision-relevant public comparable signals for Avaada rather than exhaustively
        listing every renewable or utility comp.
  - id: TV005
    title: 论点破裂与终止触发因素表
    columns:
      - 触发因素
      - 重要性
      - 关注信号
      - 估值影响
    rows:
      - - 并网和 PPA 滑期显著超过当前披露
        - 延误把现金创造往后推，但债务和资本开支仍在消耗
        - 修订后的 COD、未售容量和输电日期
        - 向悲观区间压缩
      - - 再融资条款明显恶化
        - 在有杠杆的平台里，债务成本和期限直接影响股权价值
        - SOFR 利差、债券票息、契约紧度、银行偏好
        - 即使资产规模不变，股权价值也会被压缩
      - - Electro 扩张消耗资本，却缺少外部需求证明
        - 制造可选性从上行变成拖累
        - 第三方订单簿、利用率、利润率、IPO 时间
        - 显著削弱上行情景
      - - 临近投产窗口时，绿色分子仍没有约束性承诺
        - 绿色分子可选性不应按经常性现金流估值
        - 照付不议合同、EPC 状态、交付成本模型
        - 削减平台溢价
      - - 集团价值无法在各法律实体之间对齐
        - 价格发现本身变得不可投资
        - 股权结构表、债务图谱、所有权桥接
        - 让建议停留在继续研究或更差
    notes: 这些是估值触发因素，不是泛泛的运营风险。每一项都会改变可辩护的倍数或经验法。
    claimRefs:
      - CV014
      - CV028
      - CV031
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 待索取事项
      - 重要性
      - 回答方
      - 决策依赖
    rows:
      - - 最新集团层面确切投后估值和股权结构表
        - 用来验证公开追踪表说法是否真实，以及对应哪个实体层级
        - CFO / 企业发展
        - 建立价格信心前必需
      - - 合并层面和实体层面的债务明细表
        - 没有债务背景，市值和每 GW 经验法都没用
        - 司库 / 财务团队
        - 接受公开可比估值重心前必需
      - - FY25-FY26 按业务拆分的收入、EBITDA 和现金创造
        - 用来判断制造或绿色分子可选性是否值得计入价值
        - CFO 和 BU 财务负责人
        - 上调到继续研究以上前必需
      - - 发电、Electro 和绿色分子之间的业务层面价值拆分
        - 防止重复计算平台可选性
        - 董事会 / 财务 / 战略
        - 做分部估值前必需
      - - Electro 订单簿、利用率和外部客户占比
        - 判断制造可选性是真实外部需求，还是内部循环
        - Electro 管理层
        - 高优先级
      - - 有约束力的绿色分子承购协议和交付成本模型
        - 判断绿色分子可选性应进入乐观情景，还是留在证据缺口桶里
        - 绿色燃料团队
        - 高优先级
    notes: 这些问题聚焦价格形成，不是泛泛评估公司质量。每个未回答事项都会让公允价值区间过于分散。
    claimRefs:
      - CV011
      - CV012
      - CV015
      - CV037
      - CV038
      - CV040
      - CV041
