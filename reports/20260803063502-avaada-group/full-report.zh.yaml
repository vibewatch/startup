      - number: '8.2'
        title: 融资背景和公开记录真正说明了什么
        blocks:
          - type: paragraph
            body: >-
              最干净的公开融资事实来自官方且时间近。Avaada 2023 年新闻稿称，集团完成 13 亿美元融资，其中 Brookfield 承诺向 Avaada Ventures 投入最高 10 亿美元，GPSC 向
              Avaada Energy 增资。2026 年公开新闻又给出新一层验证：一个 FDRE 项目和两个太阳能资产获得约 9.5 亿美元债务融资，一个 2.15 GW 组合完成 13 亿美元融资关闭，以及公司正在寻找约
              7.5 亿美元，为此前与 Brookfield 相关的融资安排再融资。这些资金流证明资本市场仍认为 Avaada 可融资。它们不能证明集团当前股权估值。面向公众的 PitchBook
              提到估值与融资表，但没有平台权限看不到数字。Inc42 显示总融资超过 37 亿美元，并给出 FY25
              收入代理指标；一篇创业公司简介文章则给出更激进、内部噪音也更大的估值叙事。尽调结论应当是：公开融资可见度强，公开价格发现可见度弱。
            claimRefs:
