  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台定义：Avaada 实际在建设什么
        blocks:
          - type: paragraph
            body: >-
              Avaada 的产品形态最好理解为一体化清洁能源平台，而不是单一产品。核心运营层是大规模可再生能源发电：集团称项目组合已超过 17.7 GWp，其中超过 7.2 GWp 已运营、约 10.5 GWp
              在建，覆盖太阳能、风电、混合以及稳定且可调度的可再生能源格式。在这层发电基础周围，Avaada 至少在搭建三层相邻技术。第一层是储能和保供，证据包括混合拍卖中标、包含 5 GWh BESS 的 Gujarat
              计划，以及多篇公司署名储能论文——这些材料把电池和抽水蓄能描述为 24/7 清洁电力交付的必要条件。第二层是通过 Avaada Electro 做太阳能制造；Avaada Electro 现在把自己定位为
              N-type TOPCon 组件和电池的主要本土制造商，拥有多座工厂和 ALMM 相关产能。第三层是绿色分子层——氢、氨及相关燃料；Avaada 已公开设立专门业务垂直，在 Dadri 建立劳动力中心，并在
              Gopalpur 推进一个获许可的大型绿氨项目。重要尽调结论是，Avaada 的「产品」是一组资产和能力堆栈，可以把可再生电子转化为电网电力、硬件或工业分子。
