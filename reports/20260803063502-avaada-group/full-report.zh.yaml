  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Avaada 的风险图景最好理解为层层叠加，而不是彼此孤立。最即时的风险是执行时间：管理层自己表示，一些项目只是因 PPA 待签或电网连接而延迟，部分连接从 2027 年滑向 2028 或 2029
              年。第二个风险是资本结构和再融资。尽管贷方似乎愿意为集团融资，Avaada 仍在寻求一笔新的 $750M 融资包，用于再融资此前 $1B Brookfield 融资，同时还要为 capex
              密集的发电、制造和分子业务投入资金。第三是交易对手质量和集中度。公开记录反复显示，SPV
              层面存在单一承购方或集中结构，即便集团项目组合看起来多元。第四是运营和制造复杂度，尤其是太阳能电池爬坡、进口投入品敞口、BESS 和 FDRE
              整合、绿氨建设。第五是新分子的政策和商业化风险：印度政策支持明确，但政策支持不等于经济性已验证，也不等于客户销量已交付。
