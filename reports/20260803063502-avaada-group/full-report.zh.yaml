      - number: '3.2'
        title: 直接同业画像：规模、范围和战略方向
        blocks:
          - type: paragraph
            body: >-
              Adani Green 的优势是绝对执行体量：FY26 新增 5,051 MW，运营规模达到 19.3 GW，并把 Khavda 建成 30 GW 可再生能源综合体，电池储能已经安装。ReNew 小于
              Adani，但在披露运营容量和制造深度上仍明显领先 Avaada，拥有约 12.6 GW 运营容量、约 20 GW 总项目组合、明确的 C&I 关系，以及 6.5 GW 组件和 2.5 GW
              电池产能。Avaada 官方披露显示，总项目组合 17.7 GWp，已运营 7.2 GWp，约 10.5 GWp 在建；融资伙伴和氢相关项目支撑的逻辑，也比纯签约太阳能资产组合更一体化。NTPC Green
              的差异化在于国资背书的管线获取，以及 Rajasthan 和 Gujarat 项目持续并网节奏。Greenko 在一项保留核心指标上透明度较低，但仍是重要的储能中心型竞争者。Azure
              规模明显更小，也更集中于太阳能和 PPA，但仍相关，因为它展示了执行和签约摩擦叠加时的下行情形。
