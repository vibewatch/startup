companyProfile:
  summary: >-
    Avaada Group 是由 Vineet Mittal 创立的印度私营清洁能源平台，覆盖大型太阳能、风电和混合发电、太阳能制造、储能、绿氢和绿氨。公开证据支持这样一个平台：项目组合达 17.7 GWp，运营规模超过 7.2
    GWp，2023 年完成 Brookfield/GPSC 支持的大额融资，2026 年仍能获得大型项目融资。承销难点不在于 Avaada
    是否真实或是否具备战略意义；问题是当前集团估值、资本结构和合并经营经济性，仍明显不如其增长野心透明。
