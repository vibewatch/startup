            body: >-
              在保留公开材料中，Avaada 目前并不由诉讼或执法风险定义；监管风险更多表现为对审批、市场设计和政策连续性的依赖。管理层 2025 年评论说得很清楚：项目时间仍可能受 PPA
              签署和输电连接约束，而不是受内部资金可用性约束。评级报告又增加一层，指出预测和调度监管、电网变电站时点，以及交易对手遵守 PPA 条款都是持续监控项。对绿氢和绿氨而言，National Green
              Hydrogen Mission 以及印度已通知的标准具有建设性，但不能消除补贴设计、采购路径和承购经济性演进慢于项目发起人预期的风险。换句话说，政策风险不只是监管不利的风险；还包括支持性政策无法按 Avaada
              执行所需节奏变得足够可融资的风险。
