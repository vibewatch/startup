      - number: '3.4'
        title: 护城河耐久性、转换成本与潜在进入者
        blocks:
          - type: paragraph
            body: >-
              印度可再生能源的耐久护城河主要是资产负债表护城河和执行护城河。项目一旦中标、土地拼齐、并网锁定、项目融资搭好，其他开发商很难快速复制。Adani 和 ReNew 因而受益于已在更大披露规模上验证的执行。NTPC
              Green 受益于 PSU 可信度、并网节奏和与中央项目一致。Greenko 的护城河更多来自储能和可调度电力架构。Avaada
              的护城河更窄但真实存在：它正在围绕可再生发电、电池储能、氢或氨、制造搭建一体化叙事，并有大型融资伙伴和邦级 MoU 支撑。潜在进入压力也很重要。JSW 和 Tata
              说明，相邻印度电力集团可以迅速扩大储能、制造和清洁燃料能力，即便它们今天还不是最严格的同类可比公司。含义是，Avaada 不能只依赖项目组合广度；它必须把这种广度转化为运营资产、签约承购和可重复执行证据。
