      - number: '8.4'
        title: 情景分析、建议和进入纪律
        blocks:
          - type: paragraph
            body: >-
              由于公开估值证据噪音大，合理情景区间应当故意拉宽。熊市情景里，电网和 PPA 延误延续，再融资成本上升，制造继续吃资本，绿色分子有战略吸引力但商业化仍早；此时低于 15
              亿美元的价值很容易成立。基准情景里，17.7 GWp 组合持续转化为运营资产，2026 年融资带来按时 COD，市场愿意接受大致围绕用户给出的 20 亿美元锚点、或略高一些的私有估值，区间约 18 亿-30
              亿美元。牛市情景里，Avaada 证明自己不只会把发电变现，也能变现制造可选性和更深的一体化平台，可能支撑 35 亿-55 亿美元。新投资人的问题不是这些区间不可能，而是公开证据还不能告诉我们 Avaada
              实际落在区间哪里。因此建议是继续研究，而不是放弃：公司可能不错，但价格的公开可审计性还不足以让人有把握承销。
