              Avaada 的公开客户证据，与软件或消费公司完全不同。买方通常不是选择产品的终端用户，而是围绕特定项目或未来产出流签长期合同的电力交易对手或工业承购方。最强公开证据来自 NTPC、SECI、NHPC
              等中央机构和公共部门中介，UPPCL、MSEDCL、HPPC、RUVITL 和 BSPHC 相关 DISCOM 等邦级买方，以及 DVC、NDMC、Ordnance Factory
              网络等法定或公共机构。新的客户面来自绿氨，Mysore Ammonia 已为未来供应签署长期承购
              MoU。公司也宽泛声称服务企业、酒店、医院、教育机构和工业用户，但这些细分的公开实名证明远弱于公用事业承购方记录。因此，正确客户地图应以交易对手为中心、与项目绑定，并部分集中在公共部门。
