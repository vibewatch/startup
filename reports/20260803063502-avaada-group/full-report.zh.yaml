              Avaada
              客户故事中令人鼓舞的部分，是集团在项目组合层面并未绑定单一买方类别。它现在已有中央机构、邦级公用事业、法定机构、国防相关买方，以及早期工业绿色分子渠道的证据。较不舒服的是，单个资产层面的集中度仍然很真实。AGPL
              是单一交易对手 SECI 项目。受限集团对 UPPCL 的敞口为 90%。CARE 的 Solar Power 和 Clean Sustainable
              报告各自描述了唯一或主导承购方结构，信用风险中等；这些结构之所以可接受，主要因为付款保持及时且有合同保护。公开证据也留下真实盲点：没有按收入披露的前 10
