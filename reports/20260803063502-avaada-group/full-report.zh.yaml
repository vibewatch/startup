      - number: '8.6'
        title: 展项
        blocks:
          - type: callout
            title: 规模和融资让一个不小的股权故事成立
            body: Avaada 并不是从很小基数出发硬撑高估值。公司有官方披露的 7.2 GWp 运营规模、10.5 GWp 在建容量，并反复证明贷款人和投资人有胃口。这足以让数十亿美元级股权故事继续成立。
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV010
          - type: callout
            title: 公开估值证据明显比公开运营证据更嘈杂
            body: 官方和主流来源让规模和融资相当可读，但不能让当前股权价格发现可读。需要登录的追踪页、二手简介文章和业务臂 IPO 传闻，让不同实体之间的估值混乱空间太大。
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV014
              - CV015
          - type: callout
            title: 20 亿美元锚点或许合理，但合理不等于可承销
            body: 按粗略公开可比经验法，20 亿美元集团价值并不荒唐。但没有对齐的债务图、EBITDA 视角和实体级股权结构表，投资人无法判断自己是在正确给规模定价，还是只是在接手隐藏杠杆和执行风险。
            calloutType: risk
            claimRefs:
