      - number: '2.4'
        title: 政策与技术顺风
        blocks:
          - type: paragraph
            body: >-
              印度政策组合正在从支持容量新增，扩展到支持系统赋能。National Green Hydrogen Mission 总拨款 INR 19,744 crore，其中 INR 17,490 crore 用于
              SIGHT 计划，另有试点、R&D 和其他拨款。MNRE
              的赋能框架明确包括跨邦输电费豁免、可再生能源银行、开放接入，以及氢项目并网支持。绿氨和甲醇标准现在给出了可测量的碳强度阈值，这关系到出口可信度和工业采购。在电力系统层面，储能正从可选附加项进入主流采购类别：CEEW
              统计 FY26 有 37 个储能招标，其中 31 个为 BESS 招标；某个 APTRANSCO 基准中的价格发现降至每单位 INR 1.23。这些政策和市场变化，直接支撑 Avaada
              在可再生能源、储能、制造和氢上的一体化定位。
