      - number: '7.4'
        title: 伙伴、客户与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Avaada 的依赖远不止 EPC 执行。集团要靠中央和邦级交易对手签署、履约并支付长期 PPA；靠贷款人和投资人持续打开再融资窗口；靠 Casale
              等工业伙伴以及港口相关基础设施推进分子项目；也靠政策牵引的制造需求，支撑电池片和组件扩产。风险在项目融资文件里最清楚。AGPL 实际上是单一交易对手的 SECI 项目；受限 UP 组合对 UPPCL 的敞口达
              90%。挂钩 RUVITL 和 BSPHC 的结构也是单一或主导买方模式。即便 Sunrays
              这类分散组合，仍依赖有限几家公用事业公司和中央实体持续按既有方式运转。资本端，集团已经证明能从银行、Brookfield 和 GPSC 拿到钱，但 2026 年反复出现的再融资和债务融资落地公告，也说明
              Avaada 的商业模式默认资本市场会继续接纳它。绿色氨方面，已披露的 Mysore Ammonia 关系是重要客户验证，但项目仍未运营，因此还要取决于执行、标准、物流以及有约束力的商业落地。
