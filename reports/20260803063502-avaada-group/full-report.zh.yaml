      - number: '5.3'
        title: 运营架构与关键依赖
        blocks:
          - type: paragraph
            body: >-
              底层运营架构重资产、重依赖。可再生电站依赖辐照、风况、土地、输电接入和承购。制造依赖产线投产、原材料采购、ALMM 纳入、营运资金和需求可见性。储能依赖电池堆栈本身加控制软件；Avaada 自有材料也反复把
              BESS 定义为运营和平衡工具，而不只是硬件箱。绿氨路径又增加更多依赖：可再生电力供应、制氢、合成许可、储存或港口处理，以及终端市场承购。Casale 2025 年发布说得很直接：在 Avaada 的 1,500
              TPD Odisha 项目中，Casale 负责许可、基础工程、专有设备和设计审查。公开证据也暴露下行面。ICRA 警示 Avaada Electro
              仍有集团需求集中、进口投入品敞口，以及新电池产线执行风险。这些不是边缘问题；它们决定 Avaada 的产品堆栈能否复合成耐久平台，还是停留在一组雄心勃勃的相邻押注。
