      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个清晰但不完整的结论。Avaada 看起来可融资、运营可信，规模也足以吸引成熟资本；但承销案例仍更多建立在资产支持的项目经济性和发起人融资渠道上，而不是透明的合并盈利能力上。最强正面信号包括
              Avaada Electro 可见订单簿、项目 SPV 中长期 PPA 锁定的售电、ICRA 和 CARE
              的反复评级支持，以及贷方继续围绕平台设计大型融资。最强负面信号同样重要：杠杆不低，再融资仍在推进，项目经济性暴露于电价刚性和交易对手支付质量，且没有关于合并
              EBITDA、自由现金流、月度烧钱、应收账龄或氢业务经济性的当前公开桥梁。因此，投资者应把 Avaada
              视为一个资本密集的基础设施和制造平台：子公司层面可见度在提高，但集团层面仍高度依赖数据室。下一步决定性尽调不是再谈一次估值，而是自下而上核对项目现金流、制造营运资金和控股公司流动性。
