      - number: '1.3'
        title: 资本基础与融资结构
        blocks:
          - type: paragraph
            body: >-
              Avaada 的规模靠类股权战略资本，以及越来越可见的债务和再融资活动共同撑起。关键事件是 2023 年 Brookfield/GPSC 轮融资：Avaada 2023 年 4 月宣布 $1.07B，作为
              $1.3B 计划的一部分；随后 6 月称已完成全额 $1.3B。Brookfield Renewable 通过 Brookfield Global Transition Fund 在集团层面承诺最高
              $1B，GPSC 则提高对可再生能源业务的敞口，并表示其对 Avaada 的总投资约达 $779M。随后 2023 年 7 月 REC 备忘录承诺五年内提供 INR 20,000 crore
              支持，把融资边界从纯股权继续拓宽。到 2026 年中，故事已从融资头条转为资产负债表管理：Bloomberg 报道的再融资努力显示，一笔新的 $750M 融资包旨在偿还 Brookfield 时期的 $1B
              融资，并提到 Avaada Electro 可能在 Mumbai 推进 IPO。这并不否定投资者信心，但说明集团进入了对杠杆更敏感的阶段，融资成本和资本市场窗口会更重要。
