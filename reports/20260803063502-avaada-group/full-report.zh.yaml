      - number: '5.4'
        title: 信任、质量与合规信号
        blocks:
          - type: paragraph
            body: >-
              Avaada 的信任和质量故事在太阳能制造上最强，因为这里有真正第三方检查点，而不只是公司形容词。ICRA 强调 ALMM 相关产能批准和产量爬坡数据；pv magazine 报道同样的 8.5 GW
              运营组件基础，并指出 FY2025 利用率 83%、H1 FY2026 利用率 59%；North American Clean Energy 报道称，Avaada Electro 在 Kiwa PVEL
              2026 PV Module Reliability Scorecard 六个测试类别中获评「Top Performer」，包括 M10L、G12R 和 G12 glass-to-glass N-type
              TOPCon 组件。合在一起，这些来源给出的产品质量证据，强于私营可再生能源开发商通常水平。只是，全栈信任图景并不均衡。公开数据还没有给出 Avaada
              储能执行、电解槽选择、氨厂经济性或组件长期野外衰减的同等独立技术验证。因此，投资者应区分「制造信任」和「平台信任」：前者证据相对充足，后者的一体化未来架构仍走在公开运营证明之前。
