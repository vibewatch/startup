      - number: '7.3'
        title: 运营与技术执行风险
        blocks:
          - type: paragraph
            body: >-
              执行风险仍高，因为 Avaada 正同时扩张多个资本密集系统。ICRA 关于 DVC 和 SECI 相关 Gujarat
              项目的项目报告显示，常规可再生能源风险仍然重要：土地完成、输电就绪、变电站连接、辐照、组件表现，以及投运后的初始稳定。CARE
              的项目报告进一步扩大了这项担忧，显示天气相关发电波动、浮动债务利率敏感性，以及部分项目池在 Rajasthan 的地理集中。制造又增加一条不同风险向量。ICRA 的 Avaada Electro
              评级理由称，当前订单簿完全来自 Avaada Energy，进口原材料价格仍重要，新电池产线必须高效投产并爬坡。更新的 FDRE
              和混合融资也增加执行负担，因为它们组合的资产、交易对手和并网时间表，比简单单体太阳能项目更多。问题不是缺乏雄心，而是组织能否让所有时间表保持同步，同时不发生资本或运营漏损。
