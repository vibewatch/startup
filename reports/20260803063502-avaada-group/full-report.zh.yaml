      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Avaada 所处市场的买方结构分散，而这种分散决定了变现方式。邦级公用事业公司、SECI 式机构和公共交易对手，仍通过长期 PPA 锚定大型公用事业采购，给开发商带来规模，也让开发商暴露在招标设计和
              DISCOM 行为之下。企业构成另一条采用路径：开放接入和全天候清洁电力买方购买的是可靠性、电价可见性，以及 RE100 或减碳目标合规，而不只是最低太阳能标价。储能和 FDRE
              产品存在，正是因为可变可再生能源渗透率上升，迫使买方更重视保供和交付质量。绿氢及衍生品又增加第三条路径，有效买方可能是化肥生产商、钢铁厂、航运客户、港口运营商或出口中介，而不是电力公用事业。采用通常要经过政策资格、输电接入、融资、投标参与、技术可用性，再到合同可融资性。Avaada
              的优势在于产品菜单覆盖不止一种买方类型，但每个细分都有不同付款方、审批循环和收入兑现节奏。
