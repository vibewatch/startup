              Avaada 不披露客户流失、NRR 或续约分组；对于大型公用事业能源资产，这些本来也不是最合适的第一指标。耐久性更应从 PPA
              期限、付款行为、准备金结构，以及买方类别是中央还是邦级关联来推断。在保留评级报告覆盖的项目实体中，PPA 通常为 25 年，资产投运后可提供长期收入可见性。CARE 的 Sunrays
              报告尤其有用，因为它显示中央交易对手平均约 10 天付款，而邦级交易对手约 30 天付款；两者都可运作，但质量差异明显。受限集团报告还指出，应收账款低于 30 天、DSCR 健康，尽管集中在
              UPPCL。与此同时，Sunrays 的池化结构、DSRA 和额外流动性储备，在单一 SPV 之上又提供一层耐久性。相比之下，Mysore Ammonia 仍是面向未来的客户证明，因为它是
