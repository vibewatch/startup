      - number: '5.2'
        title: 制造、储能与交付工作流
        blocks:
          - type: paragraph
            body: >-
              Avaada 的技术工作流有两个可见引擎。一个是项目开发引擎：拿地，获得拍卖中标或邦级支持；建设太阳能或混合资产；在电网价值或可调度性需要时加入储能；再通过长期 PPA 或工业用能变现。另一个是 Avaada
              Electro 的制造引擎，目标是把高效率组件、最终还有电池，供给 Avaada 自身建设，也可能供给第三方需求。ICRA 2025 和 2026 年评级理由展示了这套经济机制：第一条 1.5 GW Dadri
              组件线于 2024 年 7 月投产，随后 Butibori 产线把合并组件产能提高到 8.5 GW，订单簿可见性主要来自集团实体 Avaada Energy。公司储能材料还勾勒了 BESS
              本身的技术工作流——电池单体组装成模组和机架，由 BMS 管理，通过 PCS 转换，并由 EMS 编排充电、放电和电网平衡。关键在于，Avaada
              不只销售商品化发电；它试图打通从自制组件到保供电力输出，并最终到氢衍生品生产的闭环。
