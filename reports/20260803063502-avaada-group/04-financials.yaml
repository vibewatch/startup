- id: I-FIN-4
  title: Financial verdict and diligence blockers
  body: 'The public record supports a clear but incomplete verdict. Avaada appears financeable, operationally
    credible and large enough to attract sophisticated capital, but the underwriting case still rests
    more on asset-backed project economics and sponsor access than on transparent consolidated profitability.
    The strongest positive signals are visible order books at Avaada Electro, contracted power sales with
    long-term PPAs at project SPVs, repeated rating support from ICRA and CARE, and the fact that lenders
    continue to structure large facilities around the platform. The strongest adverse signals are equally
    important: leverage is meaningful, refinancing remains active, project economics are exposed to tariff
    rigidity and counterparty payment quality, and there is no current public bridge for consolidated
    EBITDA, free cash flow, monthly burn, receivable ageing, or hydrogen-venture economics. Investors
    should therefore treat Avaada as a capital-intensive infrastructure and manufacturing platform with
    improving visibility at the subsidiary level but still material data-room dependence at the group
    level. The next decisive diligence step is not another valuation conversation; it is a bottoms-up
    reconciliation of project cash flow, manufacturing working capital and holdco liquidity.'
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  - CI034
