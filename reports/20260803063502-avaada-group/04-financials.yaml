- id: TI005
  title: Public financial gaps table
  type: comparison
  layout: wide
  summary: The most important missing private metrics still required for a real underwriting model.
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
  columns:
  - Missing metric
  - Why it matters
  - Impact if weak
  - Exact diligence path
  rows:
  - - Consolidated EBITDA and EBIT by business line
    - Needed to separate volume growth from true profitability
    - Could reveal thin or negative holdco economics despite large revenue
    - Request audited segment P&L and margin bridge
  - - Receivables ageing by offtaker and entity
    - Critical in India power because payment quality can impair cash conversion
    - Working-capital strain and covenant pressure may be hidden
    - Request ageing buckets, overdue trends and provisioning policy
  - - Net debt and maturity ladder at holdco and subsidiaries
    - Determines refinancing risk and structural subordination
    - Could expose mismatch between project debt and holdco obligations
    - Request debt schedule by borrower, tenor, security and currency
  - - Manufacturing gross margin and external customer mix
    - Capacity numbers alone do not prove attractive economics
    - Intra-group orders may flatter utilization without creating strong cash margin
    - Request customer mix, ASP, BOM cost, inventory turns
  - - Hydrogen / ammonia capex and contracted offtake
    - Prevents over-crediting optionality in valuation
    - Could reveal long-dated cash burn without firm demand
    - Request project-level capex, subsidies and binding offtake
  - - Monthly cash burn / cash generation bridge
    - Needed to understand whether growth is self-funding
    - Could show dependence on repeated external capital even during scale-up
    - Request monthly cash waterfall by entity and business line
  notes: These gaps are not edge cases; they are the core blockers to underwriting Avaada from public
    data alone.
