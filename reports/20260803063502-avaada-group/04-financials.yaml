- id: I-FIN-3
  title: Capital adequacy, refinancing and expansion dependency
  body: 'Avaada remains deeply capital dependent. The 2023 financing package closed at $1.3 billion and
    established Brookfield-led funding as the backbone of the group’s expansion into generation, manufacturing
    and green fuels. By mid-2026, management was seeking roughly $750-800 million of refinancing through
    a mix of offshore borrowing and local bonds, with ET describing the exercise as cost optimisation
    rather than near-term maturity stress. Even so, the facts underscore how financing structure is central
    to the model: the ET report says the Brookfield facility was a $1 billion zero-coupon optionally convertible
    instrument, around $400 million was drawn in March 2023, and nearly $230 million of that was infused
    into Avaada Energy, while remaining amounts supported Avaada Electro, Avaada Green Fuels and debt
    prepayment. Manufacturing expansion adds another major call on capital. ICRA’s 2025 note says a new
    3 GW cell-and-module facility carries project cost of roughly ₹2,427 crore, backed by about ₹607 crore
    promoter contribution and ₹1,820 crore fresh debt, while Avaada Electro is also preparing a proposed
    ₹9,000-10,000 crore IPO. The financial story is therefore one of execution financed by recurring access
    to debt and equity, not self-funded organic expansion.'
  claimRefs:
  - CI003
  - CI004
  - CI005
