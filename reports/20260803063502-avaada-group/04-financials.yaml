    topic: receivables-and-counterparty-quality
    missingEvidence: Portfolio-wide receivables ageing, delayed-payment exposure and curtailment data
      by offtaker.
    whyItMatters: Project-level DSCR can look healthy while cash conversion weakens because of payment
      delays or curtailment.
    diligencePath: Request ageing buckets, provision policy, top-10 offtakers, state DISCOM exposure,
      and curtailment history.
