- id: I-FIN-2
  title: Unit economics and project-level financial signals
  body: Where Avaada does disclose economics, it tends to be at the project or manufacturing-subsidiary
    level. CARE’s 2025 note on Avaada Clean Energy’s combined solar structure shows weighted average tariffs
    of ₹3.32 per unit, weighted average PLF of 22.6% in FY25, forward-looking average DSCR above 1.3x
    and Total Debt/EBITDA of 5.6x. That is useful because it shows the economics of the operating fleet
    are bankable but still leveraged and exposed to counterparty quality, weather and floating-rate debt.
    ICRA’s Avaada Inclean note similarly describes a 300 MW DVC-backed solar project with fixed-tariff
    revenue visibility, 19-year debt, and cumulative DSCR above 1.2x. On the manufacturing side, ICRA
    and pv magazine report that Avaada Electro reached 8.5 GW of operational module capacity, ran at 83%
    utilisation in FY2025 and 59% in H1 FY2026, and had an order book supported largely by group demand.
    These are strong signals of revenue visibility, but they do not translate cleanly into group-level
    margins without transfer-pricing, working-capital and receivables data.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
