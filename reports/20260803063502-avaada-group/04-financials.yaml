  rows:
  - - Utility-scale power sales
    - Electricity sold under long-term PPAs from project SPVs or operating assets
    - ₹/kWh or ₹/unit
    - Core current revenue stream; fixed-tariff visibility evidenced at project level
    - Medium to high — contracted but weather/counterparty exposed
    - Consolidated revenue split by project, receivables ageing, curtailment data
  - - Avaada Energy platform revenue
    - Parent revenue captured in MCA-linked FY2025 filing extract
    - ₹ crore annual revenue
    - ₹2,365.7 crore in FY2025, +13% YoY
    - Medium — headline revenue known, profitability unknown
    - Audited P&L, EBITDA, segment mix, operating cash flow
  - - Solar module manufacturing
    - Sale of PV modules from Avaada Electro, supported by group order book and utilisation ramp
    - MW shipped; ₹ crore operating income
    - 8.5 GW operational capacity; 1,165 MW produced in H1 FY2026; 8MFY2025 operating income ₹365.2 crore
    - Medium — revenue visibility good, transfer-pricing and margin mix unclear
    - External/customer share, gross margin by line, receivable days
  - - Cell manufacturing expansion
    - Future revenue from 6 GW cell installation and 3 GW integrated line under buildout
    - GW capacity / future shipments
    - Under expansion; capex-heavy and not yet fully monetised publicly
    - Low to medium — growth optionality, not mature current revenue
    - Ramp schedule, external orders, yield assumptions, working capital
  - - Green hydrogen / green ammonia
    - Future fuel and derivative sales from Avaada Green Fuels and related projects
    - kg/tonne or contract price
    - Strategic narrative public, current revenue not evidenced in retained set
    - Low — commercial offtake not yet transparent
    - Binding offtake, subsidy reliance, delivered-cost model
  - - Development / auction pipeline monetisation
    - Value created through project wins, grid access and financing before full COD
    - MW won / commissioned
    - 820 MWp hybrid award and multiple state MoUs show pipeline, not direct recognized revenue
    - Low visibility — economic conversion depends on COD and financing
    - Pipeline conversion, cancellation rate, COD schedule, pre-COD capex bridge
  notes: Revenue visibility is strongest for project-level PPAs and manufacturing capacity utilization;
    consolidated segment mix remains largely unavailable publicly.
