  - type: missing-source
    severity: material
    topic: consolidated-ebitda-and-cashflow
    missingEvidence: Current consolidated EBITDA, EBIT, cash flow from operations, capex and free-cash-flow
      disclosure for Avaada Group and Avaada Energy.
    whyItMatters: Without this bridge, headline revenue and funding rounds cannot be converted into real
      underwriting on margin, runway or debt capacity.
    diligencePath: Request audited FY2025 and FY2026 segment P&L, cash-flow statement and entity map across
      Avaada Energy, Avaada Ventures, Avaada Electro and Green Fuels.
    relatedQuestionRefs:
