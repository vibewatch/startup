slug: avaada-group
runDate: '2026-08-03'
company:
  name: Avaada Group
chapter:
  number: 4
  title: Financials
  summary: 'Avaada’s public financial record shows a capital-intensive but financeable platform, not a
    transparently underwritten consolidated business. The cleanest current parent datapoint is ₹2,365.7
    crore of FY2025 revenue at Avaada Energy, while the richest economics come from rated project SPVs
    and Avaada Electro’s manufacturing subsidiary: tariffs around ₹3.23-4.18/unit in disclosed structures,
    PLF of 22.6%, DSCR above ~1.2x-1.4x, and material manufacturing scale with 8.5 GW of module capacity.
    The group remains dependent on external capital, highlighted by the historic $1.3 billion close, the
    2026 $750-800 million refinancing, sanctioned manufacturing debt, and a proposed ₹9,000-10,000 crore
    Avaada Electro IPO. The main blocker is still missing consolidated EBITDA, net debt, receivables and
    cash-flow disclosure.'
sections:
- id: I-FIN-1
  title: Revenue model and what is actually disclosed
  body: Avaada’s public financial picture is fragmented across the parent company, project SPVs, manufacturing
    subsidiaries and credit reports rather than a single consolidated investor deck. The cleanest current
    parent-level datapoint is third-party extraction from FY2025 MCA filings showing Avaada Energy revenue
    of ₹2,365.7 crore, up 13% year on year. That number establishes that the operating platform is already
    material in size, but it does not disclose segment mix, EBITDA or cash generation by line of business.
    Publicly observable revenue mechanisms include long-term PPAs for utility-scale solar assets, manufacturing
    revenue booked at Avaada Electro, project-level fixed tariffs in ring-fenced SPVs, and future optionality
    from storage, hydrogen and ammonia initiatives that are still far less monetisation-proven than conventional
    power sales. The key underwriting point is that Avaada is not a single-stream IPP anymore, yet outside
    narrow project or subsidiary disclosures the market still cannot see a clean bridge from generated
    electricity, internal manufacturing orders and development capex to consolidated gross profit and
    free cash flow.
  claimRefs:
  - CI001
  - CI003
  - CI006
