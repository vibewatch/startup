evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current group board roster, independent-director count, audit and risk committee structure, and any consolidated
      governance charter.
    whyItMatters: >-
      A capital-intensive private group expanding simultaneously across generation, manufacturing and green fuels needs
      governance visibility to assess oversight, related-party risk and succession resilience.
    diligencePath: Request the latest group board pack, committee charters and shareholder-rights summary in the data room.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: valuation
    missingEvidence: >-
      Current group valuation, post-money share count, preference stack and any secondary transaction marks after the
      2023 Brookfield/GPSC round.
    whyItMatters: >-
      Without a current valuation benchmark, investors cannot translate Avaada’s scale narrative into entry pricing or
      dilution-adjusted economics.
    diligencePath: Obtain the cap table, the latest board-approved valuation materials and any financing or IPO-prep presentations.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-financials
    missingEvidence: >-
      Audited consolidated group revenue, EBITDA, net debt, project-level debt schedule and parent guarantees across the
      platform.
    whyItMatters: >-
      Subsidiary rating reports show pieces of the financing structure, but not enough to underwrite leverage, cash
      generation or refinancing risk at the group level.
    diligencePath: Request the latest consolidated audited statements, lender presentations and debt maturity waterfall.
    relatedQuestionRefs:
      - QO022
      - QO023
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: group-headcount
    missingEvidence: Current consolidated group employee count by business line and geography.
    whyItMatters: >-
      Only subsidiary-level workforce disclosure is visible publicly, making it difficult to judge organizational
      readiness for simultaneous expansion in manufacturing, generation and hydrogen.
    diligencePath: Request HR dashboard extracts covering group headcount, attrition and hiring plans by business vertical.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: public-milestones
    missingEvidence: >-
      A complete independently corroborated chronology for all private financing, governance and project-award
      milestones between the early portfolio build-out and the 2025-2026 public announcements.
    whyItMatters: >-
      The public milestone table is useful but still partial, so investors cannot fully distinguish company narrative
      highlights from the complete operating and financing history.
    diligencePath: >-
      Request the internal corporate timeline, board-approved milestone chronology and a project-by-project award and
      commissioning history for the whole group.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: avaada-sam
    missingEvidence: >-
      A rupee- or USD-denominated third-party SAM for integrated Indian renewable-plus-storage-plus-hydrogen developers
      that can be directly mapped to Avaada’s product set.
    whyItMatters: >-
      The public market is well evidenced in GW terms, but investors still need a cleaner value-pool estimate for the
      specific submarkets where Avaada competes.
    diligencePath: >-
      Build a bottoms-up SAM from tender pipelines, storage procurement, C&I contract volumes and hydrogen offtake
      assumptions, or obtain banker materials from Avaada’s financing process.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
