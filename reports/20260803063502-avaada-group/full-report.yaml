  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Platform definition: what Avaada actually builds'
        blocks:
          - type: paragraph
            body: >-
              Avaada’s product surface is best understood as an integrated clean-energy platform rather than a single
              product. The core operational layer is large-scale renewable generation: the group says it has surpassed
              17.7 GWp of portfolio, including over 7.2 GWp operational and about 10.5 GWp under construction, spanning
              solar, wind, hybrid and firm-and-dispatchable renewable energy formats. Around that generation base,
              Avaada is building at least three adjacent technology layers. First is storage and firming, evidenced by
              hybrid auction wins, a Gujarat plan that includes 5 GWh of BESS, and multiple company-authored storage
              papers that describe batteries and pumped storage as essential to 24/7 clean-power delivery. Second is
              solar manufacturing through Avaada Electro, which now frames itself as a major domestic maker of N-type
              TOPCon modules and cells with multiple factories and ALMM-linked capacity. Third is the green-molecule
              layer — hydrogen, ammonia and related fuels — where Avaada has publicly created a dedicated business
              vertical, a workforce center at Dadri, and a major licensed green-ammonia project at Gopalpur. The
              important diligence conclusion is that Avaada’s ‘product’ is a stack of assets and capabilities that can
              convert renewable electrons into grid power, hardware, or industrial molecules.
