            claimRefs:
              - CV018
              - CV019
              - CV024
              - CV025
              - CV026
      - number: '8.4'
        title: Scenario analysis, recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Because public valuation evidence is noisy, the right scenario range should be intentionally wide. In the
              bear case, grid and PPA delays persist, refinancing costs rise, manufacturing remains capital hungry, and
              green molecules remain strategically interesting but commercially early. In that case, a sub-$1.5 billion
              value is easy to justify. In the base case, the 17.7 GWp portfolio continues converting into operating
              assets, 2026 financings translate into timely CODs, and the market is willing to tolerate a private value
              roughly around the user-provided $2 billion anchor or modestly above it, producing a range around $1.8-3.0
              billion. In the bull case, Avaada proves it can monetize not just generation but also manufacturing
              optionality and a deeper integrated platform, which could justify $3.5-5.5 billion. The problem for new
              investors is not that these ranges are impossible; it is that public evidence does not yet tell us where
              inside them Avaada actually belongs. That is why the recommendation is research-more rather than pass: the
              company may be good, but the price is not publicly auditable enough to underwrite with conviction.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
          - type: table
            tableRef: TV003
            claimRefs:
              - CV025
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most important next step is not another narrative interview; it is a proper capital-structure and
              operating-metrics workstream. Investors need the exact latest group post-money valuation, ownership by
              major entity, debt by SPV and holdco, consolidated EBITDA or cash generation, and the relationship between
              Avaada Energy, Avaada Ventures and Avaada Electro. They also need to know how much of the platform's value
              is really in operating renewables versus manufacturing expansion versus molecule optionality. Without that
              decomposition, comps can be cherry-picked to support almost any number. Entry discipline should therefore
              be explicit: if management cannot provide a clean current cap table, group-wide debt schedule,
              operating-asset cash yield, and a clear bridge from 7.2 GWp operational scale to equity value, then the
              thesis remains interesting but not ready for a conviction price. The valuation breaks if execution slips
              materially, refinancing becomes meaningfully more expensive, or the manufacturing and molecule businesses
              absorb capital without external proof of margin and demand.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV014
              - CV028
              - CV031
              - CV039
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV011
              - CV012
              - CV015
              - CV037
              - CV038
              - CV040
              - CV041
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale and financing make a non-trivial equity story possible
            body: >-
              Avaada is not trying to justify a high valuation from a tiny base. The company has official 7.2 GWp
              operating scale, 10.5 GWp under construction and repeated evidence of lender and investor appetite. That
              is enough to keep a multi-billion-dollar equity story alive.
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
              - CV010
          - type: callout
            title: Public valuation evidence is materially noisier than public operating evidence
            body: >-
              Official and mainstream sources make scale and financing fairly legible. They do not make current equity
              price discovery legible. Gated tracker pages, secondary-profile articles and arm-level IPO talk leave too
              much room for valuation confusion across entities.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
              - CV014
              - CV015
          - type: callout
            title: A $2 billion anchor may be plausible, but plausibility is not underwriting
            body: >-
              On rough public comp heuristics, a $2B group value does not look absurd. But without a reconciled debt
              map, EBITDA view and entity-level cap table, investors cannot know whether they are pricing scale
              correctly or simply inheriting hidden leverage and execution risk.
            calloutType: risk
            claimRefs:
              - CV024
              - CV025
              - CV026
              - CV042
