  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Why it matters
      - Signal to watch
      - Valuation effect
    rows:
      - - Connectivity and PPA slippages extend materially beyond current disclosure
        - Delays push cash generation right while debt and capex remain live
        - Revised CODs, unsold capacity, and transmission dates
        - Compress toward bear range
      - - Refinancing arrives on meaningfully worse terms
        - Debt cost and tenor directly influence equity value in a leveraged platform
        - SOFR spread, bond coupon, covenant tightness, bank appetite
        - Compresses equity even if asset scale remains constant
      - - Electro expansion consumes capital without external demand proof
        - Manufacturing optionality flips from upside to drag
        - Third-party order book, utilization, margin, IPO timing
        - Reduces upside case materially
      - - Green molecules remain non-binding close to commissioning windows
        - Molecule optionality should not be valued like recurring cash flow
        - Take-or-pay contracts, EPC status, delivered-cost model
        - Cuts platform premium
      - - Group value cannot be reconciled across legal entities
        - Price discovery itself becomes uninvestable
        - Cap table, debt map, ownership bridges
        - Keeps recommendation at research-more or worse
    notes: >-
      These are valuation triggers, not generic operating risks. Each one changes what multiple or heuristic can be
      defended.
