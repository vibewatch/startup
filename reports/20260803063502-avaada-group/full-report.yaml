  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Avaada sits in the top tier of Indian renewable developers, but it is not the category leader on disclosed
              operating scale. Independent 2026 league tables and company disclosures consistently place Adani Green
              first at roughly 19.3 GW operating, ReNew second at roughly 12.6 GW, and NTPC Green around 10 GW, with
              Greenko, JSW and Avaada forming the next cluster. Avaada’s own official framing is broader than a
              standalone solar IPP: it combines utility-scale solar and wind, hybrid and storage-linked projects,
              manufacturing ambitions, and a green-hydrogen or ammonia pathway. That makes Adani Green and ReNew the
              closest direct private comparables, because they also combine asset buildout with adjacent manufacturing,
              storage, or industrial decarbonization narratives. NTPC Green is the most important state-backed incumbent
              in central tenders, Greenko is the most credible storage-oriented adjacent platform, and Azure remains a
              relevant but smaller solar-heavy comparator. The key conclusion is that buyers and lenders are
              increasingly comparing platforms, not isolated projects.
            claimRefs: []
