      - number: '2.5'
        title: Constraints, contradictions and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The market’s constraint set is now as important as its growth rate. S&P’s January 2026 interview with the
              MNRE secretary argued that building capacity is not the main problem; finding offtakers could become the
              limiting factor. Mercom, IEA and CEA all point to transmission readiness, evacuation bottlenecks,
              curtailment risk, grid flexibility and storage integration as binding issues as renewable penetration
              rises. Wind additions are growing more slowly than solar, increasing concentration in one technology.
              CSEP’s green-hydrogen work shows that banking and flexibility can lower levelized hydrogen cost, but loose
              banking rules may shift costs or emissions elsewhere, and state-level implementation remains uneven. CEEW
              also notes that FDI weakened even as capacity additions surged, a reminder that macro capital conditions
              still matter. For Avaada, this means headline market size supports scale, but valuation should reward
              dispatchability, buyer diversification, manufacturing resilience and balance-sheet discipline rather than
              simple GW ambition alone.
            claimRefs:
              - CM005
              - CM019
              - CM021
              - CM022
              - CM023
              - CM029
