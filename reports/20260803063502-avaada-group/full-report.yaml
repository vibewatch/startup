      - number: '7.3'
        title: Operational and technology execution risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk remains high because Avaada is scaling several capital-intensive systems at once. ICRA's
              project notes on the DVC and SECI-linked Gujarat projects show how conventional renewable risks still
              matter: land completion, transmission readiness, substation connectivity, irradiation, module performance
              and initial stabilization after commissioning. CARE's project reports widen that concern by showing
              weather-linked generation variability, interest-rate sensitivity on floating debt and geographic
              concentration in Rajasthan for some pools. Manufacturing adds a distinct risk vector. ICRA's Avaada
              Electro rationale says the current order book is entirely from Avaada Energy, that imported raw-material
              prices still matter, and that new cell lines must be commissioned and ramped efficiently. Newer FDRE and
              hybrid financings also create execution burden because they combine more assets, counterparties and
              commissioning schedules than a simple single-site solar build. The issue is not lack of ambition; it is
              whether the organization can keep all these timelines synchronized without capital or operating leakage.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
