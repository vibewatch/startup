      - number: '1.4'
        title: Scale, industrial footprint and roadmap
        blocks:
          - type: paragraph
            body: >-
              Operationally, Avaada has moved beyond a narrow utility-solar identity. The May 2026 portfolio update
              reported 17.7 GWp of renewable projects, of which more than 7.2 GWp were operational and about 10.5 GWp
              were under construction, with more than 2 GWp added during FY2025-26 alone. The group’s project map spans
              at least nine Indian states, while the industrial strategy now includes module and cell manufacturing in
              Uttar Pradesh and Maharashtra, hydrogen and ammonia projects in Odisha, and storage ambitions that stretch
              from multi-gigawatt pumped hydro to a 16 GWh BESS pipeline in corporate materials. Avaada Electro is the
              clearest public window into that build-out: ICRA and the company’s own sustainability disclosures point to
              8.5 GW of module capacity, a 6 GW cell line ramp at Butibori, further Noida expansion plans and an order
              book above 20 GW. This breadth strengthens the industrial thesis, but it also increases execution risk
              because manufacturing, storage and green-fuels projects all carry different ramp curves and capital needs.
