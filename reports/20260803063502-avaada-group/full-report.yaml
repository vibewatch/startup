          - type: callout
            title: Single-offtaker exposure persists underneath group-level diversification
            body: >-
              Avaada's portfolio looks broad at group level, but project documents still show single or highly
              concentrated buyer structures such as SECI-only, RUVITL-only, BSPHC-linked and 90%-UPPCL exposure.
              Investors need asset-level underwriting, not only portfolio storytelling.
            calloutType: risk
            claimRefs:
              - CR026
