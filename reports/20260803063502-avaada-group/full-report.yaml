      - number: '2.2'
        title: Sizing lenses and build-rate
        blocks:
          - type: paragraph
            body: >-
              Official and market-research data confirm that the Indian addressable market remains structurally large.
              MNRE’s June 2026 physical-progress release shows 236.5 GW renewable capacity excluding large hydro and
              288.6 GW total renewable capacity including large hydro, with solar at 162.2 GW and wind at 57.4 GW. The
              country achieved 50% installed electricity capacity from non-fossil sources ahead of schedule and added a
              record 55.3 GW of non-fossil capacity in FY2025-26. Beneath that top line, the run-rate is solar led: JMK
              estimates 26 GW solar and 3 GW wind additions in H1 2026, while Mercom counted 15.3 GW solar additions in
              Q1 2026 alone. CEEW’s market handbook adds another lens by showing around 151 GW of renewable capacity
              under construction as of March 2026. These figures do not all measure the same thing, but together they
              show the market is nowhere near saturated. For Avaada, the practical SAM is the subset of that build-out
              where integrated renewables, storage, domestic manufacturing and industrial clean-energy demand create a
              bankable advantage.
            claimRefs:
