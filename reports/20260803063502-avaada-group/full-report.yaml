  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              The relevant market for Avaada is not simply “Indian renewables” as a monolithic megawatt pool. Avaada
              sells into several adjacent but distinct spend categories: utility-scale solar and wind capacity procured
              by state utilities and renewable-energy implementing agencies; hybrid, FDRE and storage-backed power where
              buyers pay for reliability rather than only cheapest kWh; commercial and industrial open-access
              procurement for corporations seeking round-the-clock clean power and Scope 2 decarbonisation; and
              green-hydrogen or ammonia projects where renewable electricity is an input into industrial decarbonisation
              and exports. Domestic solar manufacturing also matters because India’s policy stack increasingly rewards
              local modules and cells. Excluded spend includes conventional thermal generation fuel, downstream retail
              supply economics and unrelated power-equipment categories where Avaada has no visible operating footprint.
              The market is therefore best understood as an infrastructure platform opportunity shaped by megawatt
              additions, storage procurement, industrial electrification, transmission and hydrogen policy—not just a
              single national capacity target headline.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM025
              - CM032
              - CM036
