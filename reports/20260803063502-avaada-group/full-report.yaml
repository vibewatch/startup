      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Execution slippage is management-confirmed, not just analyst-implied
            body: >-
              Mittal explicitly told ET that delayed PPAs and grid connectivity are the two reasons some projects are
              not moving as fast as planned, with some connectivity shifting from 2027 to 2028-2029. That makes
              execution timing the clearest near-term residual risk in the public record.
            calloutType: risk
            claimRefs:
              - CR001
