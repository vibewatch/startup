  - id: FU001
    title: Avaada customer journey map
    type: journey-map
    layout: standard
    summary: How utility and industrial counterparties typically appear in Avaada's public customer evidence.
    data:
      items:
        - label: 1. Tender / demand formation
          stage: Demand formation
          actor: Central agency, state buyer or industrial prospect
          action: Issues auction, seeks decarbonized supply, or explores green-molecule procurement
          pain: Needs long-term clean power or low-carbon feedstock with credible developer
          outcome: Avaada enters bid, MoU or bilateral discussion
        - label: 2. Award / commitment
          stage: Commitment
          actor: Awarding counterparty
          action: Signs Letter of Award, PPA path or MoU
          pain: Tariff competitiveness, credit comfort and execution capability matter
          outcome: Named contract surface becomes visible
        - label: 3. Build and commission
          stage: Deployment
          actor: Avaada SPV and project lenders
          action: Constructs asset and closes financing against offtake
          pain: Land, transmission, irradiation and timeline slippage can defer value
          outcome: Counterparty relationship moves from paper to operating asset
        - label: 4. Billing and collections
          stage: Operations
          actor: Offtaker and project SPV
          action: Invoices under PPA or supply terms; payments enter TRA and reserves
          pain: State buyers can pay slower than central intermediaries
          outcome: Receivable and DSCR behavior reveal real customer quality
        - label: 5. Repeat qualification
          stage: Expansion
          actor: Same buyer class or adjacent customer class
          action: Developer competes for larger tenders or extends into molecules
          pain: Concentration can persist even while total customer count grows
          outcome: Group-level customer surface widens beyond the initial project
        - label: 6. Renewal / rollover logic
          stage: Long-term durability
          actor: Investor, lender and counterparty
          action: Relationship persists through 25-year tenor or new rounds of awards
          pain: Few public data exist on late-life renegotiation or customer share by revenue
          outcome: Durability is inferred mostly from contract structure rather than churn metrics
    claimRefs:
      - CU001
      - CU002
      - CU014
      - CU026
      - CU033
