              - CP033
              - CP036
      - number: '3.3'
        title: Capability, contract model and distribution comparison
        blocks:
          - type: paragraph
            body: >-
              Across this peer set, the monetization model is still dominated by long-duration PPAs, central or state
              utility auctions, and a smaller but growing corporate or open-access segment. Azure’s filings make the
              structure explicit: its projects typically sell power under fixed-tariff PPAs, often with 25-year
              duration, and the company treats off-taker strength as fundamental. JSW’s public 2026 market-facing
              materials likewise describe 15–25 year PPAs, open access, group captive and firmed clean-power products as
              the primary procurement routes for buyers. Avaada, ReNew and Adani are all moving beyond commodity solar
              into hybrid, storage, firm power and manufacturing, but public tariff transparency is still uneven: only
              selected auctions or dispute filings reveal exact economics. That means competitive comparisons should
              emphasize who can win and finance projects across solar, wind, storage and industrial decarbonization
              rather than assume buyers are choosing among easily comparable list prices. Distribution power comes from
              auction access, lender confidence, state relationships, and ability to de-risk supply chains, not from
              classic software-style switching costs.
            claimRefs: []
          - type: table
            tableRef: TP003
            claimRefs:
              - CP014
              - CP015
              - CP016
              - CP022
              - CP029
              - CP030
              - CP031
      - number: '3.4'
        title: Moat durability, switching cost and likely entrants
        blocks:
          - type: paragraph
            body: >-
              The durable moats in Indian renewables are mostly balance-sheet and execution moats. Once a project is
              awarded, land assembled, interconnection secured and project finance structured, the resulting position is
              hard for another developer to replicate quickly. Adani and ReNew therefore benefit from
              already-demonstrated execution at larger disclosed scale. NTPC Green benefits from PSU credibility,
              commissioning cadence and alignment with central programs. Greenko’s moat is more about storage and
              dispatchable-power architecture. Avaada’s moat is narrower but still real: it is building an integrated
              narrative across renewable generation, battery storage, hydrogen or ammonia, and manufacturing, backed by
              large financing partners and state-level MoUs. Likely entrant pressure also matters. JSW and Tata
              illustrate that adjacent Indian power groups can scale storage, manufacturing and clean-fuels capabilities
              rapidly, even if they are not the closest apples-to-apples comparables today. The implication is that
              Avaada cannot rely on portfolio breadth alone; it must convert that breadth into operating assets,
              contracted offtake and repeatable execution evidence.
            claimRefs: []
