          - type: callout
            title: Access to capital is a mitigant, but not a substitute for de-risked execution
            body: >-
              Repeated 2026 debt closures and lender conversations show that Avaada can still attract serious financing.
              That reduces immediate liquidity panic risk, but it does not eliminate refinancing, commissioning or
              commercialization risk if timelines and margins disappoint.
            calloutType: strength
