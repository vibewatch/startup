      - number: '5.3'
        title: Operating architecture and critical dependencies
        blocks:
          - type: paragraph
            body: >-
              The underlying operating architecture is asset-heavy and dependency-heavy. Renewable plants depend on
              irradiation, wind regimes, land, transmission access and offtake. Manufacturing depends on line
              commissioning, raw-material sourcing, ALMM inclusion, working capital and demand visibility. Storage
              depends on the battery stack itself plus control software, and Avaada’s own materials repeatedly frame
              BESS as an operations and balancing tool rather than just a hardware box. The green-ammonia path adds even
              more dependencies: renewable power supply, hydrogen production, synthesis licensing, storage or port
              handling and end-market offtake. Casale’s 2025 release makes the point plainly by defining its role across
              license, basic engineering, proprietary equipment and design review for Avaada’s 1,500 TPD Odisha project.
              Public evidence also surfaces the downside. ICRA warns that Avaada Electro still has concentrated group
              demand, imported-input exposure, and execution risk around new cell lines. These are not side issues; they
              are central to whether Avaada’s product stack compounds into a durable platform or remains a set of
              ambitious adjacent bets.
