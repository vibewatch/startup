  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - Evidence anchor
      - What would change the view
    rows:
      - - Thesis
        - Avaada has meaningful scale and an unusually broad renewable platform for a private Indian company.
        - Official 17.7 GWp portfolio release and 2026 financing flow.
        - If project execution slows or much of the under-construction portfolio slips, scale should be discounted.
      - - Thesis
        - Institutional capital from Brookfield, GPSC and major banks suggests continuing external confidence.
        - Official 2023 funding release; 2026 debt closures and refinance discussions.
        - If refinancings tighten sharply or lenders pull back, confidence in the platform weakens.
      - - Thesis
        - >-
          A $2B group value can look plausible under some scale heuristics, especially versus ReNew market-cap-per-GW
          signals.
        - ReNew market cap/EV and Avaada official operating scale.
        - >-
          If leverage is much higher than public evidence suggests, equity value could be much lower than capacity
          heuristics imply.
      - - Thesis
        - Electro IPO optionality suggests hidden value could exist outside the core generation arm.
        - BS DRHP and SEBI-approval articles for Avaada Electro.
        - If BS-reported valuation talk proves overstated or IPO markets close, optionality should be marked down.
      - - Anti-thesis
        - Current public sources do not cleanly disclose Avaada's exact group valuation or post-money mark.
        - PitchBook public page is gated; Inc42 provides funding and revenue proxy but not clear group post-money.
        - A fresh official round, audited cap table or board-approved valuation memo would close the gap.
      - - Anti-thesis
        - Secondary public valuation signals conflict and may blend group, subsidiary and arm-level values.
        - Inc42, Startuptimes and BS Electro articles imply different scales and scopes.
        - A reconciled legal-entity map with ownership and valuation by business would resolve this.
      - - Anti-thesis
        - Capacity-based heuristics ignore debt, tariff quality, collections and execution risk.
        - CARE/ICRA project risks plus large refinance activity.
        - Group EBITDA, DSCR and asset-level cash yield would make the heuristics more investable.
      - - Anti-thesis
        - Multi-vertical expansion can create apparent upside while hiding capital drag.
        - Electro capex plans, green-molecule timeline, and repeated large financings.
        - Evidence of margin-accretive manufacturing and binding molecule commercialization would improve confidence.
    notes: >-
      The key question is not whether Avaada is strategically interesting; it is whether the available public evidence
      is sufficient to underwrite a specific entry price.
    claimRefs:
      - CV001
      - CV010
      - CV014
      - CV018
      - CV024
      - CV025
      - CV038
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key assumptions
      - Illustrative valuation range
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Portfolio execution stays on schedule, manufacturing optionality monetizes, and platform premium is rewarded.
        - $3.5B-$5.5B
        - Upside case; requires more than just renewable-asset execution
        - Electro optionality disappoints or financing stays debt-heavy without equity uplift
      - - Base
        - >-
          Core platform continues scaling and user-provided ~$2B market talk is directionally right, but opacity
          persists.
        - $1.8B-$3.0B
        - Most plausible on current public evidence
        - Execution slips, debt costs rise, or group cash generation underwhelms
      - - Bear
        - >-
          Grid/PPA delays, refinancing drag and early-stage molecule economics keep value anchored mostly to de-risked
          operating assets.
        - $0.8B-$1.5B
        - Real downside if public narrative outruns realized cash flow
        - Persistent delays, lower-quality collections, or capex overruns
      - - Stretch downside
        - >-
          If financing closes but economics weaken enough that investors underwrite only mature operating assets with
          steep discount.
        - $0.5B-$0.8B
        - Low probability but not dismissible without full debt map
        - Material covenant stress or failed refinancing
      - - Stretch upside
        - >-
          If market grants substantial integrated-platform premium including Electro and molecules beyond core
          generation.
        - $5.5B-$7.0B
        - Narrative upside only; not currently underwritable from public evidence
        - Public-market optionality closes or business-level value split disappoints
    notes: >-
      Ranges are illustrative scenario bands, not observable market marks. They are meant to express the dispersion
      created by incomplete public valuation evidence.
