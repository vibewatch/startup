        title: Customer segmentation and who actually pays
        blocks:
          - type: paragraph
            body: >-
              Avaada's public customer evidence looks very different from a software or consumer company. The buyer is
              usually not an end user choosing a product; it is a power counterparty or industrial offtaker signing a
              long-term contract against a specific project or future output stream. The strongest public evidence sits
              with central agencies and public-sector intermediaries such as NTPC, SECI and NHPC, state-linked buyers
              such as UPPCL, MSEDCL, HPPC, RUVITL and BSPHC-linked discoms, and statutory or public bodies such as DVC,
              NDMC and the Ordnance Factory network. The newer customer surface is green ammonia, where Mysore Ammonia
              has signed a long-term offtake MoU for future supply. There are also broad statements that Avaada serves
              corporates, hotels, hospitals, education institutions and industrial users, but public named proof for
              those segments is much thinner than the utility offtaker record. That means the right customer map is
              counterparty-led, project-linked and partly public-sector concentrated.
