      - number: '1.3'
        title: Capital base and financing structure
        blocks:
          - type: paragraph
            body: >-
              Avaada’s scale has been financed through a mix of equity-like strategic capital and increasingly visible
              debt and refinancing activity. The pivotal event was the 2023 Brookfield/GPSC round: Avaada announced
              $1.07 billion in April 2023 as part of a $1.3 billion plan, then said it had closed the full $1.3 billion
              by June 2023. Brookfield Renewable, via the Brookfield Global Transition Fund, committed up to $1 billion
              at the group level, while GPSC increased its exposure to the renewable arm and said its total investment
              in Avaada had reached roughly $779 million. The subsequent July 2023 REC memorandum for INR 20,000 crore
              of support over five years broadened the financing envelope beyond pure equity. By mid-2026, however, the
              story had moved from fundraising headline to balance-sheet management: Bloomberg-reported refinancing
              efforts described a fresh $750 million package aimed at repaying a Brookfield-era $1 billion facility and
              noted a possible Mumbai IPO for Avaada Electro. That does not negate investor confidence, but it does show
              the group entering a more leverage-sensitive phase where financing cost and capital-market timing matter.
            claimRefs:
