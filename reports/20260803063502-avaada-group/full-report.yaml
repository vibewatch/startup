  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Avaada begins with scale and strategic relevance. Officially, the group says it has
              surpassed 17.7 GWp of portfolio, with over 7.2 GWp operational and about 10.5 GWp under construction. It
              has also attracted unusually large capital commitments for an Indian private renewable platform, starting
              with the 2023 Brookfield and GPSC-backed funding round and extending through major 2026 debt closures for
              FDRE, solar and hybrid assets. This is not a small project developer looking for a story; it is a scaled
              platform spanning generation, manufacturing and green molecules. The anti-thesis is that valuation remains
              far less transparent than operating ambition. Publicly accessible tracker pages give funding and partial
              revenue clues but do not provide a clean current post-money mark for the group, while secondary articles
              imply widely differing values or mix subsidiary-level and group-level figures. In that setting, scale can
              make Avaada look investable, but opacity can still make the price wrong.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV010
              - CV014
              - CV018
              - CV024
              - CV025
              - CV038
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV025
              - CV035
      - number: '8.2'
        title: Financing context and what the public record really says
        blocks:
          - type: paragraph
            body: >-
              The cleanest public financing facts are official and recent. Avaada's 2023 release says the group closed a
              $1.3 billion funding round, with Brookfield committing up to $1 billion into Avaada Ventures and GPSC
              adding capital into Avaada Energy. Public 2026 news then shows another layer of validation: roughly $950
              million of debt financing for an FDRE project and two solar assets, a $1.3 billion financing closure for a
              2.15 GW portfolio, and an active search for about $750 million to refinance a prior Brookfield-linked
              facility. These flows prove capital markets still view Avaada as financeable. What they do not prove is
              the group's current equity valuation. Public-facing PitchBook references a valuation-and-funding table but
              does not expose the figures without platform access. Inc42 shows total funding above $3.7 billion and a
              FY25 revenue proxy, while a startup-profile article provides a more aggressive and internally noisy
              valuation story. The correct diligence takeaway is that public financing visibility is strong, but public
              price-discovery visibility is weak.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV010
              - CV018
              - CV025
