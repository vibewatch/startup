  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Avaada's risk picture is best understood as stacked rather than isolated. The most immediate risk is
              execution timing: management itself said some projects are delayed only by pending PPAs or grid
              connectivity, with certain connections slipping from 2027 toward 2028 or 2029. The second risk is capital
              structure and refinancing. Although lenders appear willing to finance the group, Avaada is still seeking a
              fresh $750 million package to refinance a prior $1 billion Brookfield facility while simultaneously
              funding capex-heavy generation, manufacturing and molecule businesses. Third is counterparty quality and
              concentration. The public record repeatedly shows single-offtaker or concentrated structures at the SPV
              level, even when the group portfolio looks diversified. Fourth is operating and manufacturing complexity,
              especially around solar-cell ramp, imported-input exposure, BESS and FDRE integration, and green-ammonia
              buildout. The fifth is policy and commercialization risk in new molecules: India is supportive, but policy
              support is not the same as proven economics or delivered customer volume.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
