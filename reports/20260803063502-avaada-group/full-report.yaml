      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The group is unmistakably founder centric. Vineet Mittal is the public face, chairman and strategic
              architect of Avaada, and multiple company, event and interview sources frame the platform’s identity
              through his relationships, policy engagement and long-term vision for India as a renewable-energy hub.
              Public biographies highlight his NIT engineering training, Harvard Business School exposure, prior telecom
              and internet experience, and roles at the World Economic Forum, B20 energy task force and CII hydrogen
              standards work. Sindoor Mittal appears as vice chairperson overseeing strategy, investor relations and
              organizational transformation, while Kishor Nair runs the renewable-power arm with longstanding
              project-development experience. The leadership bench is credible for execution, but governance
              transparency is materially weaker than leadership visibility: accessible public materials do not provide a
              detailed group board roster, committee structure, independence mix or consolidated governance pack. For a
              capital-heavy private platform now juggling manufacturing, generation and green fuels, that disclosure gap
              is a real diligence limitation rather than a cosmetic omission.
