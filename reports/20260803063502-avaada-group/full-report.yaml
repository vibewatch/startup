chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Avaada Group presents itself as an Indian clean-energy conglomerate built around an integrated value chain
              rather than a single-asset independent power producer. Official materials describe the operating footprint
              across renewable power generation, solar PV manufacturing, green hydrogen and derivatives, battery
              storage, pumped hydro, and increasingly green-data-centre power solutions. The strategic positioning has
              shifted from plain utility-scale solar toward 'Always Clean, Always On' supply: the group pairs solar and
              wind generation with firming technologies such as storage, hybrid projects and FDRE structures so it can
              serve round-the-clock industrial, utility and infrastructure demand. That matters because Avaada is trying
              to monetize not just low-cost generation, but reliability, domestic manufacturing and green-molecule
              optionality inside India’s broader energy-transition push. The business model is therefore capital
              intensive, partnership heavy and policy-linked, with value creation dependent on winning land,
              transmission access, PPAs, manufacturing scale-up and concessional capital at the same time.
