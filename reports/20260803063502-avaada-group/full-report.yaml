              - CV042
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV013
              - CV017
      - number: '8.3'
        title: Comparable set and the meaning of a $2 billion anchor
        blocks:
          - type: paragraph
            body: >-
              A $2 billion Avaada group value looks different depending on which public comp lens is used. Adani Green
              is a rich benchmark: CompaniesMarketCap shows a market cap of $24.16 billion as of August 2026, while ET
              reported 19.3 GW of operational capacity after 5.05 GW added in FY26. ReNew is far cheaper on headline
              market cap, with Yahoo showing about $2.27 billion of market cap and $9.62 billion of enterprise value as
              of 31 July 2026, while the company reported about 12.6 GW of operating capacity and roughly 20 GW of gross
              capacity. Tata Power sits at $12.76 billion but is a broader utility and therefore only a loose adjacency
              comp. NTPC Green's $8.02 billion market cap and 60 GW ambition show how public investors can value
              strategic clean-power optionality even before using the same operating lenses as merchant or IPP peers.
              Against those comparables, a $2 billion group value for Avaada is not obviously absurd on capacity alone:
              it implies only about $0.28 billion per operational GW using 7.2 GWp. But capacity heuristics ignore debt,
              PPA quality, cash generation and the cost of new-venture execution. That is why the comparable set points
              to plausibility, not proof.
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
          - type: table
            tableRef: TV004
            claimRefs:
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV026
          - type: figure
