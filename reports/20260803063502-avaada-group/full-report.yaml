      - number: '5.5'
        title: Roadmap, maturity and product-stage verdict
        blocks:
          - type: paragraph
            body: >-
              The roadmap is large enough that stage discipline matters more than storytelling. Operational renewable
              generation is mature. Hybrid-plus-storage deployment appears emerging but real, supported by auction wins
              and state-scale BESS plans. Module manufacturing is already scaled, while cell manufacturing is still in
              an intensive buildout phase. Green ammonia is earlier still: Avaada has public project announcements, a
              dedicated vertical and an external process licensor, but no retained evidence yet of operating production
              or contracted volume offtake. This stage mix is why the right product-tech verdict is not simply ‘Avaada
              is diversified.’ The better conclusion is that Avaada has a mature generation layer, a scaling
              manufacturing layer, an enabling storage layer, and an early industrial-molecules layer. Brookfield-backed
              funding, REC support and repeated rating-agency coverage show the roadmap is serious, but seriousness is
              not the same as de-risked execution. The remaining diligence question is how quickly these layers become
              mutually reinforcing instead of capital-intensive parallel tracks.
