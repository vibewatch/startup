              Avaada does not publish customer churn, NRR or renewal cohorts, and those would not be the right first
              metrics anyway for utility-scale energy assets. Durability is better inferred from PPA tenor, payment
              behavior, reserve structures and whether the buyer class is central or state-linked. Across the project
              entities covered in retained rating reports, PPAs are typically 25 years, which gives long revenue
              visibility once assets commission. CARE's Sunrays report is particularly helpful because it shows that
              central counterparties pay within roughly 10 days on average while state counterparties pay in roughly 30
              days, a meaningful quality difference even though both remain workable. The restricted-group reports also
              note receivables below 30 days and healthy DSCR despite concentration on UPPCL. Meanwhile, Sunrays' pooled
              structure, DSRA and additional liquidity reserve provide another durability layer above any single SPV. By
              contrast, Mysore Ammonia is still future-facing customer proof because it is an MoU, not delivered
