      - number: '7.4'
        title: Partner, customer and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Avaada's dependencies extend well beyond EPC execution. The group depends on central and state
              counterparties to sign, honor and pay under long-term PPAs; on lenders and investors to keep refinancing
              available; on industrial partners such as Casale and port-linked infrastructure for molecule projects; and
              on policy-linked manufacturing demand to justify cell and module expansion. The risk emerges most clearly
              in project finance documents. AGPL is effectively a single-counterparty SECI project. The restricted UP
              group is 90 percent exposed to UPPCL. RUVITL and BSPHC-linked structures are also sole or dominant
              off-taker models. Even diversified pools like Sunrays still rely on the continued behavior of a finite set
              of utilities and central entities. On the capital side, the group has shown real access to banks,
              Brookfield and GPSC, but repeated 2026 refinancing and debt-closure announcements also mean Avaada's
              business model assumes capital markets stay receptive. For green ammonia, the named Mysore Ammonia
              relationship is important customer proof, yet it remains pre-operational and therefore still dependent on
              project execution, standards, logistics and binding commercial follow-through.
            claimRefs:
              - CR026
              - CR027
              - CR028
              - CR029
