      - number: '3.2'
        title: 'Direct peer profiles: scale, scope and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              Adani Green’s advantage is sheer execution mass: it added 5,051 MW in FY26, reached 19.3 GW operating, and
              is building Khavda as a 30 GW renewable complex with battery storage already installed. ReNew is smaller
              than Adani but still meaningfully ahead of Avaada on disclosed operating capacity and manufacturing depth,
              with ~12.6 GW operating, ~20 GW gross portfolio, explicit C&I relationships, and 6.5 GW module plus 2.5 GW
              cell capacity. Avaada’s official disclosures put it at 17.7 GWp total portfolio with 7.2 GWp operational
              and ~10.5 GWp under construction, plus financing partnerships and hydrogen-linked projects that support a
              more integrated thesis than a pure contracted-solar fleet. NTPC Green’s differentiation is state-backed
              pipeline access and steady commissioning cadence across Rajasthan and Gujarat projects. Greenko is less
              transparent in one retained primary metric but remains a major storage-centered competitor. Azure is
              materially smaller and more solar- and PPA-concentrated, but still relevant because it shows the downside
              case when execution and contracting frictions compound.
            claimRefs: []
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP012
              - CP013
              - CP017
              - CP024
              - CP025
              - CP033
              - CP036
