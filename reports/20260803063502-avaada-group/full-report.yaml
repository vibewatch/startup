      - number: '3.5'
        title: Adverse evidence and what it means for Avaada
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence in this peer set is important. Azure’s filings show how quickly renewable-platform
              narratives can erode when PPAs are delayed, renegotiated or terminated: the company still had 967 MW
              awaiting executed PPAs, exited a 150 MW hybrid project, and described attempts to terminate 2,333 MW of
              previously awarded manufacturing-linked PPAs. Public information also shows that many green-hydrogen and
              ammonia narratives across the sector are ahead of disclosed long-term offtake contracts or project-level
              economics. For Avaada specifically, public sources do not yet prove the same depth of named corporate
              customers that ReNew discloses, nor do they prove Adani-like scale on commissioned assets. That does not
              invalidate Avaada’s strategy; it sharpens the diligence lens. Investors should underwrite Avaada as a
              credible but still execution-sensitive integrated platform whose differentiation depends on converting
              MoUs, manufacturing plans and hydrogen ambition into durable contracted cash flows faster than larger or
              state-backed rivals.
            claimRefs: []
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and what is actually disclosed
        blocks:
          - type: paragraph
            body: >-
              Avaada’s public financial picture is fragmented across the parent company, project SPVs, manufacturing
              subsidiaries and credit reports rather than a single consolidated investor deck. The cleanest current
              parent-level datapoint is third-party extraction from FY2025 MCA filings showing Avaada Energy revenue of
              ₹2,365.7 crore, up 13% year on year. That number establishes that the operating platform is already
              material in size, but it does not disclose segment mix, EBITDA or cash generation by line of business.
              Publicly observable revenue mechanisms include long-term PPAs for utility-scale solar assets,
              manufacturing revenue booked at Avaada Electro, project-level fixed tariffs in ring-fenced SPVs, and
              future optionality from storage, hydrogen and ammonia initiatives that are still far less
              monetisation-proven than conventional power sales. The key underwriting point is that Avaada is not a
              single-stream IPP anymore, yet outside narrow project or subsidiary disclosures the market still cannot
              see a clean bridge from generated electricity, internal manufacturing orders and development capex to
              consolidated gross profit and free cash flow.
