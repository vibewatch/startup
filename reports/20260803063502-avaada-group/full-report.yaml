companyProfile:
  summary: >-
    Avaada Group is a private Indian clean-energy platform founded by Vineet Mittal that spans utility-scale solar, wind
    and hybrid generation, solar manufacturing, storage, green hydrogen, and green ammonia. Public evidence supports a
    platform with 17.7 GWp of portfolio, over 7.2 GWp operational scale, a major 2023 Brookfield/GPSC-backed funding
    round, and continued 2026 access to large project financing. The underwriting challenge is not whether Avaada is
    real or strategically relevant; it is that current group valuation, capital structure, and consolidated operating
    economics remain materially less transparent than the platform's growth ambition.
  foundedDate: '2009-01-01'
  founders:
    - name: Vineet Mittal
      role: Founder and Chairman
      background: >-
        NIT-trained operator and Harvard Business School alumnus with prior telecom and internet-sector experience and
        visible policy roles across India's energy ecosystem.
      claimRefs:
        - CO003
        - CO004
        - CO005
  foundingLocation: Mumbai, India
  headquarters: Mumbai, India
  productSummary: >-
    Renewable power generation sold through long-term utility and institutional offtake contracts, plus solar-module and
    cell manufacturing and planned green-hydrogen and green-ammonia capacity.
  customerFocus: >-
    Indian utilities, central offtakers such as SECI and NTPC-linked counterparties, and industrial customers for green
    power or future green-molecule supply.
  businessModel: >-
    Develop, own and finance renewable-energy assets under long-term PPAs and auction-linked contracts, expand domestic
    solar manufacturing, and monetize future green-fuel projects if demand and economics become bankable.
  stage: Private
  fundingStatus: >-
