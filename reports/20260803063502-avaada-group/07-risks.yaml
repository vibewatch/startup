    {
      "id": "R-RSK-5",
      "title": "Financial model, people and thesis-break risk",
      "body": "The core financial risk is not that Avaada lacks capital; it is that the group may be tempted to outrun its own operating proof because capital has been available. ET reported a planned ₹20,000 crore capex program for 2025-26 with 75 percent debt, while several rating reports still describe leveraged structures, refinancing bullet risk or debt-to-EBITDA above 6x for certain pools. That is manageable if assets commission on time, collections remain healthy and manufacturing ramps as planned. It becomes dangerous if grid delays persist, if counterparty quality worsens, if refinancing turns more expensive, or if new industrial ventures absorb cash before revenues arrive. There is also an execution-governance layer: Avaada is spanning utility-scale generation, hybrid and FDRE, manufacturing, green fuels, pumped hydro, battery storage and green data centres. A founder-led integrated strategy can be a strength, but it also raises the cost of coordination failure. The clean thesis breaks if delays slip materially beyond current disclosure, if leverage ceases to amortize with operating cash generation, if molecule projects remain commercially non-binding into commissioning windows, or if manufacturing expansion consumes capital without external demand diversification.",
      "claimRefs": [
