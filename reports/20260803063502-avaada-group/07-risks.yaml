  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Avaada's highest residual risks are execution timing, leverage and refinancing, counterparty concentration, manufacturing ramp complexity, and the long-dated commercialization path for green hydrogen and ammonia. Public evidence is encouraging on access to capital and breadth of projects, but multiple rating reports and 2025-2026 news flows show that delayed PPAs, grid connectivity bottlenecks, single-offtaker structures, and aggressive multi-vertical expansion still matter. The right investment stance is not that Avaada faces unusual clean-energy risk; it is that the group is layering many normal renewable risks on top of a faster-than-average scaling agenda."
  },
  "sections": [
    {
      "id": "R-RSK-1",
      "title": "Severity-ranked risk overview",
      "body": "Avaada's risk picture is best understood as stacked rather than isolated. The most immediate risk is execution timing: management itself said some projects are delayed only by pending PPAs or grid connectivity, with certain connections slipping from 2027 toward 2028 or 2029. The second risk is capital structure and refinancing. Although lenders appear willing to finance the group, Avaada is still seeking a fresh $750 million package to refinance a prior $1 billion Brookfield facility while simultaneously funding capex-heavy generation, manufacturing and molecule businesses. Third is counterparty quality and concentration. The public record repeatedly shows single-offtaker or concentrated structures at the SPV level, even when the group portfolio looks diversified. Fourth is operating and manufacturing complexity, especially around solar-cell ramp, imported-input exposure, BESS and FDRE integration, and green-ammonia buildout. The fifth is policy and commercialization risk in new molecules: India is supportive, but policy support is not the same as proven economics or delivered customer volume.",
      "claimRefs": [
