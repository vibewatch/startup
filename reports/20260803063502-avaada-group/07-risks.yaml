    {
      "id": "R-RSK-2",
      "title": "Regulatory, legal and policy risk",
      "body": "Avaada is not presently defined by litigation or enforcement risk in the retained public set; instead, regulatory risk shows up as dependency on approvals, market design and policy continuity. Management's 2025 comments make plain that project timing can still be constrained by PPA signing and transmission connectivity rather than by internal capital availability. Rating reports add another layer by flagging forecasting and scheduling regulations, grid-substation timing and counterparty compliance with PPA terms as ongoing monitorables. For green hydrogen and ammonia, the National Green Hydrogen Mission and India's notified standards are constructive, but they do not eliminate the risk that subsidy design, procurement pathways and offtake economics evolve slower than project sponsors expect. In other words, policy risk is not simply the risk of adverse regulation; it is also the risk that supportive policy proves insufficiently bankable at the exact pace Avaada needs for execution.",
      "claimRefs": [
