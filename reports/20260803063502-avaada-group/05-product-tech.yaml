  - type: missing-source
    severity: material
    topic: storage-performance-proof
    missingEvidence: Independent project-level evidence on Avaada BESS round-trip efficiency, degradation,
      utilization and realized revenue contribution.
    whyItMatters: Storage is central to the platform thesis, but the retained public set is still dominated
      by company-authored technical explanations and roadmap claims.
    diligencePath: Request asset-level BESS operating data, revenue stack, degradation assumptions and
      third-party engineering reports.
