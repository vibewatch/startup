company:
  name: Avaada Group
chapter:
  number: 5
  title: Product & Technology
  summary: 'Avaada’s product stack is an integrated clean-energy platform, not a single renewable-asset
    product. The mature layer is large-scale generation, evidenced by a 17.7 GWp portfolio with 7.2 GWp
    operational and 10.5 GWp under construction. The next layer is storage and firming, where Avaada is
    pairing hybrid wins with a BESS-heavy roadmap and company-authored technical architecture around BMS,
    PCS and EMS. The most externally validated technology layer is manufacturing: Avaada Electro now has
    8.5 GW operational module capacity, ALMM-listed scale, rising utilization and independent PVEL recognition,
    though demand remains group-concentrated and cell-line execution is still a risk. The earliest layer
    is green ammonia, where the path is credible but still pre-operational, dependent on partners such
    as Casale and on offtake and port-linked execution that public evidence has not yet fully de-risked.'
sections:
- id: E-PT-1
  title: 'Platform definition: what Avaada actually builds'
  body: 'Avaada’s product surface is best understood as an integrated clean-energy platform rather than
    a single product. The core operational layer is large-scale renewable generation: the group says it
    has surpassed 17.7 GWp of portfolio, including over 7.2 GWp operational and about 10.5 GWp under construction,
    spanning solar, wind, hybrid and firm-and-dispatchable renewable energy formats. Around that generation
    base, Avaada is building at least three adjacent technology layers. First is storage and firming,
    evidenced by hybrid auction wins, a Gujarat plan that includes 5 GWh of BESS, and multiple company-authored
    storage papers that describe batteries and pumped storage as essential to 24/7 clean-power delivery.
    Second is solar manufacturing through Avaada Electro, which now frames itself as a major domestic
    maker of N-type TOPCon modules and cells with multiple factories and ALMM-linked capacity. Third is
    the green-molecule layer — hydrogen, ammonia and related fuels — where Avaada has publicly created
    a dedicated business vertical, a workforce center at Dadri, and a major licensed green-ammonia project
    at Gopalpur. The important diligence conclusion is that Avaada’s ‘product’ is a stack of assets and
    capabilities that can convert renewable electrons into grid power, hardware, or industrial molecules.'
