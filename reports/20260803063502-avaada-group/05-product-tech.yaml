    topic: green-ammonia-economics-and-offtake
    missingEvidence: Binding offtake, electrolyzer specifics, delivered-cost assumptions and construction
      schedule certainty for Avaada’s green-ammonia projects.
    whyItMatters: The molecule layer may be strategically important but cannot be treated as de-risked
      product-tech without actual commercial and engineering proof.
    diligencePath: Request FEED packages, licensor scope, electrolyzer suppliers, signed offtake and port-handling
      contracts.
