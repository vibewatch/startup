  columns:
  - Offering
  - User / buyer
  - Workflow
  - Output / contract
  - Current evidence
  - Key dependency
  rows:
  - - Utility-scale solar project
    - DISCOM, PSU, central agency or utility buyer
    - Develop site -> install modules -> connect -> dispatch under PPA
    - Grid electricity sold under long-duration offtake
    - Strong for existence of projects; weaker for portfolio economics
    - Grid access and counterparty payments
  - - Hybrid / FDRE project
    - Tendering agency or firm-power buyer
    - Win hybrid award -> co-locate or integrate assets -> add storage/dispatch logic -> deliver profile
    - Firmer renewable output than standalone solar
    - Official award evidence exists
    - Storage economics and dispatch performance
  - - Large BESS-backed renewable plant
    - Grid operator, utility, industrial offtaker
    - Charge from surplus renewable output -> manage through EMS -> discharge at peak
    - Peak shaving, balancing and higher renewable utilization
    - Company-authored technical workflow plus Rajasthan example
    - Battery cost, degradation and market design
  - - Module manufacturing
    - Internal Avaada buildout and potential external customers
    - Source wafers/cells or produce cells -> assemble modules -> qualify -> ship
    - Module sales and internal equipment supply
    - Strong manufacturing-line and utilization evidence
    - Raw materials, yields and demand concentration
  - - Cell manufacturing
    - Internal supply chain and module lines
    - Commission cell lines -> feed integrated module production
    - Higher local value-add and backward integration
    - Buildout is evidenced, mature throughput is not
    - Timely commissioning and process stability
  - - Green ammonia plant
    - Industrial or export market buyer
    - Renewable electricity -> hydrogen production -> ammonia synthesis -> storage/port handling
    - Green ammonia volumes for industrial or shipping uses
    - Plant licensing and port partnership are public
    - Electrolyzer selection, offtake and delivered cost
  notes: Workflow rows emphasize the operational chain rather than a software-style user journey; several
    outputs are contractual or infrastructural rather than retail product transactions.
