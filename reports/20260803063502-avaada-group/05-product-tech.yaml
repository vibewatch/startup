  columns:
  - Module / asset
  - Current status
  - Core technology
  - Primary use case
  - Evidence quality
  - Main limitation
  rows:
  - - Utility-scale renewable fleet
    - Mature and operating
    - Solar, wind, hybrid and FDRE assets
    - Contracted clean-power generation at scale
    - High — official capacity release and brochure
    - Portfolio-wide asset performance data remain sparse publicly
  - - Hybrid and firm-power projects
    - Emerging but commercial
    - Solar-wind hybrid plus dispatch-support architecture
    - Deliver firmer renewable supply and tender competitiveness
    - Medium — official hybrid award and project pipeline releases
    - Realized round-the-clock economics not widely disclosed
  - - BESS layer
    - Early deployment / scaling
    - Battery cells, BMS, PCS and EMS orchestration
    - Peak shaving, grid balancing, evening discharge and curtailment reduction
    - Medium — company technical blogs and Gujarat BESS plan
    - Independent project-level operating proof is still thin
  - - Solar module manufacturing
    - Scaled operating business
    - N-type TOPCon modules from Dadri and Butibori lines
    - Internal supply plus potential third-party module sales
    - High — ICRA, pv and company materials
    - Order book remains heavily group concentrated
  - - Solar cell manufacturing
    - Under construction / scaling
    - Integrated cell lines at Butibori, additional Noida plans
    - Backward integration and supply-chain de-risking
    - Medium — ICRA and company about page
    - Commissioning timing and ramp risk remain material
  - - Green ammonia platform
    - Pre-operational but structured
    - Renewable-power-linked hydrogen and ammonia process chain
    - Industrial decarbonization, export or fuel applications
    - Medium — Avaada + Casale + Gopalpur evidence
    - Public offtake, costs and operating readiness remain limited
  - - Hydrogen workforce and enablement
    - Capability-building stage
    - Dadri CoE with SCGJ
    - Train talent for future green-hydrogen economy
    - Medium — official launch release
    - Does not itself prove commercial plant execution
  notes: Rows separate mature operating assets from scaling or pre-operational layers; “evidence quality”
    refers to retained public proof, not intrinsic technical merit.
- id: TE002
  title: Workflow / use-case table
  type: comparison
