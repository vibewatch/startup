- id: E-PT-2
  title: Manufacturing, storage and delivery workflows
  body: 'Avaada’s technology workflow has two visible engines. One is the project-development engine:
    secure land, auctions or state support; build solar or hybrid assets; add storage where grid value
    or dispatchability requires it; then monetize via long-term PPAs or industrial energy use. The other
    is the manufacturing engine at Avaada Electro, which is meant to supply high-efficiency modules and
    eventually cells into Avaada’s own buildout and, potentially, third-party demand. ICRA’s 2025 and
    2026 rationales show how this works economically: the first 1.5 GW Dadri module line commissioned
    in July 2024, later Butibori lines took consolidated module capacity to 8.5 GW, and order-book visibility
    comes primarily from group entity Avaada Energy. The company’s storage materials also outline the
    technical workflow of BESS itself — battery cells assembled into modules and racks, managed by BMS,
    converted through PCS and orchestrated by EMS for charging, discharging and grid balancing. That matters
    because Avaada is not only selling commodity generation; it is trying to close the loop from manufactured
    modules to firmed power output and, eventually, to hydrogen-derivative production.'
  claimRefs:
  - CE009
  - CE010
  - CE013
  - CE014
