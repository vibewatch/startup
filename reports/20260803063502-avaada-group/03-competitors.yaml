slug: avaada-group
runDate: '2026-08-03'
company:
  name: Avaada Group
chapter:
  number: 3
  title: Competitors
  summary: Avaada competes in an Indian renewable market where scale, financing access and platform breadth
    now matter more than simple solar capacity alone. Adani Green is the disclosed operating-scale leader
    at 19.3 GW, ReNew is the strongest private integrated peer at ~12.6 GW operating with manufacturing
    and named C&I depth, and NTPC Green is the most relevant state-backed incumbent. Greenko is the storage-led
    adjacent rival, while Azure is the smaller cautionary comparator whose filings show how PPA and execution
    friction can impair value. Avaada’s real edge is breadth across generation, storage, manufacturing
    and hydrogen-linked ambition, but that edge remains more thesis-driven than proven against larger
    or better-disclosed peers.
sections:
- id: SP-3-1
  title: Competitive landscape overview
  body: 'Avaada sits in the top tier of Indian renewable developers, but it is not the category leader
    on disclosed operating scale. Independent 2026 league tables and company disclosures consistently
    place Adani Green first at roughly 19.3 GW operating, ReNew second at roughly 12.6 GW, and NTPC Green
    around 10 GW, with Greenko, JSW and Avaada forming the next cluster. Avaada’s own official framing
    is broader than a standalone solar IPP: it combines utility-scale solar and wind, hybrid and storage-linked
    projects, manufacturing ambitions, and a green-hydrogen or ammonia pathway. That makes Adani Green
    and ReNew the closest direct private comparables, because they also combine asset buildout with adjacent
    manufacturing, storage, or industrial decarbonization narratives. NTPC Green is the most important
    state-backed incumbent in central tenders, Greenko is the most credible storage-oriented adjacent
    platform, and Azure remains a relevant but smaller solar-heavy comparator. The key conclusion is that
    buyers and lenders are increasingly comparing platforms, not isolated projects.'
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: SP-3-2
  title: 'Direct peer profiles: scale, scope and strategic direction'
  body: 'Adani Green’s advantage is sheer execution mass: it added 5,051 MW in FY26, reached 19.3 GW operating,
    and is building Khavda as a 30 GW renewable complex with battery storage already installed. ReNew
    is smaller than Adani but still meaningfully ahead of Avaada on disclosed operating capacity and manufacturing
    depth, with ~12.6 GW operating, ~20 GW gross portfolio, explicit C&I relationships, and 6.5 GW module
    plus 2.5 GW cell capacity. Avaada’s official disclosures put it at 17.7 GWp total portfolio with 7.2
    GWp operational and ~10.5 GWp under construction, plus financing partnerships and hydrogen-linked
    projects that support a more integrated thesis than a pure contracted-solar fleet. NTPC Green’s differentiation
    is state-backed pipeline access and steady commissioning cadence across Rajasthan and Gujarat projects.
    Greenko is less transparent in one retained primary metric but remains a major storage-centered competitor.
    Azure is materially smaller and more solar- and PPA-concentrated, but still relevant because it shows
    the downside case when execution and contracting frictions compound.'
  tableRefs:
  - TP002
  figureRefs:
  - FP002
- id: SP-3-3
  title: Capability, contract model and distribution comparison
  body: 'Across this peer set, the monetization model is still dominated by long-duration PPAs, central
    or state utility auctions, and a smaller but growing corporate or open-access segment. Azure’s filings
    make the structure explicit: its projects typically sell power under fixed-tariff PPAs, often with
    25-year duration, and the company treats off-taker strength as fundamental. JSW’s public 2026 market-facing
    materials likewise describe 15–25 year PPAs, open access, group captive and firmed clean-power products
    as the primary procurement routes for buyers. Avaada, ReNew and Adani are all moving beyond commodity
    solar into hybrid, storage, firm power and manufacturing, but public tariff transparency is still
    uneven: only selected auctions or dispute filings reveal exact economics. That means competitive comparisons
    should emphasize who can win and finance projects across solar, wind, storage and industrial decarbonization
    rather than assume buyers are choosing among easily comparable list prices. Distribution power comes
    from auction access, lender confidence, state relationships, and ability to de-risk supply chains,
    not from classic software-style switching costs.'
  tableRefs:
  - TP003
- id: SP-3-4
  title: Moat durability, switching cost and likely entrants
  body: 'The durable moats in Indian renewables are mostly balance-sheet and execution moats. Once a project
    is awarded, land assembled, interconnection secured and project finance structured, the resulting
    position is hard for another developer to replicate quickly. Adani and ReNew therefore benefit from
    already-demonstrated execution at larger disclosed scale. NTPC Green benefits from PSU credibility,
    commissioning cadence and alignment with central programs. Greenko’s moat is more about storage and
    dispatchable-power architecture. Avaada’s moat is narrower but still real: it is building an integrated
    narrative across renewable generation, battery storage, hydrogen or ammonia, and manufacturing, backed
    by large financing partners and state-level MoUs. Likely entrant pressure also matters. JSW and Tata
    illustrate that adjacent Indian power groups can scale storage, manufacturing and clean-fuels capabilities
    rapidly, even if they are not the closest apples-to-apples comparables today. The implication is that
    Avaada cannot rely on portfolio breadth alone; it must convert that breadth into operating assets,
    contracted offtake and repeatable execution evidence.'
  tableRefs:
  - TP004
  figureRefs:
  - FP003
- id: SP-3-5
  title: Adverse evidence and what it means for Avaada
  body: 'The adverse evidence in this peer set is important. Azure’s filings show how quickly renewable-platform
    narratives can erode when PPAs are delayed, renegotiated or terminated: the company still had 967
    MW awaiting executed PPAs, exited a 150 MW hybrid project, and described attempts to terminate 2,333
    MW of previously awarded manufacturing-linked PPAs. Public information also shows that many green-hydrogen
    and ammonia narratives across the sector are ahead of disclosed long-term offtake contracts or project-level
    economics. For Avaada specifically, public sources do not yet prove the same depth of named corporate
    customers that ReNew discloses, nor do they prove Adani-like scale on commissioned assets. That does
    not invalidate Avaada’s strategy; it sharpens the diligence lens. Investors should underwrite Avaada
    as a credible but still execution-sensitive integrated platform whose differentiation depends on converting
    MoUs, manufacturing plans and hydrogen ambition into durable contracted cash flows faster than larger
    or state-backed rivals.'
