  rows:
  - - Adani Green Energy
    - Direct scaled peer
    - 19.3 GW operating; 5,051 MW added in FY26
    - Central/state utility tenders; hybrid and storage-linked projects
    - Largest disclosed operating scale in India; Khavda execution engine; BESS already installed
    - Less public emphasis on C&I buyer naming than ReNew; hydrogen thesis still project-led
  - - ReNew
    - Direct integrated private peer
    - ~12.6 GW operating; ~20 GW gross; 6.5 GW module + 2.5 GW cell capacity
    - Utility plus C&I clean power; manufacturing-linked growth
    - Second-largest operating portfolio; named C&I relationships; manufacturing depth
    - Still behind Adani on operating scale; hydrogen economics not fully public
  - - NTPC Green Energy
    - State-backed incumbent
    - ~10.1 GW installed/operating in 2026 sector tracking; repeated COD disclosures
    - Central procurement, PSU-linked projects, government programs
    - PSU credibility, project pipeline access, steady commissioning cadence
    - Less differentiated private-platform narrative; group reporting can blur pure-play economics
  - - Greenko Group
    - Storage-oriented adjacent peer
    - ~7.5 GW operating in 2026 league tables
    - Dispatchable renewable energy, storage-led industrial power
    - Strong storage and market-optimization positioning
    - Current retained official set does not provide one clean FY26 capacity datapoint
  - - Avaada Group
    - Subject company
    - 17.7 GWp portfolio; 7.2 GWp operational; ~10.5 GWp under construction
    - Utility-scale solar and wind, storage, hydrogen/ammonia, manufacturing
    - Platform breadth; REC and Brookfield-linked financing access; hydrogen and manufacturing angle
    - Behind Adani/ReNew on disclosed commissioned scale; customer depth less transparent publicly
  - - Azure Power
    - Smaller direct comparator
    - 3,041 MW operating as of Mar/Sep 2025; 3,161 MW contracted and awarded
    - Solar-heavy long-term PPAs with utilities and agencies
    - Established utility-scale solar fleet and filings detail contract mechanics
    - Smaller scale, PPA friction, discontinued hybrid project, and narrower disclosed platform breadth
  notes: Rows mix official disclosures with current sector league-table estimates where one retained primary
    comparator document is not available.
