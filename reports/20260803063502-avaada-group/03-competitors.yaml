- id: TP003
  title: Pricing / packaging comparison
  type: comparison
  layout: wide
  summary: Contract model and public pricing visibility across Avaada and key peers. Unknowns are explicit
    because most developers do not publish realized project economics comprehensively.
  claimRefs:
  - CP014
  - CP015
  - CP016
  - CP022
  - CP029
  - CP030
  - CP031
  columns:
  - Company
  - Public contract model
  - Illustrative disclosed price / term
  - Included capabilities
  - Unknowns / friction
  - Implication
  rows:
  - - Avaada
    - Utility bids, hybrid awards, state MoUs, financing-linked platform buildout
    - Exact realized tariffs not broadly disclosed in retained set
    - Solar, wind, hybrid, storage, hydrogen/manufacturing narrative
    - Sparse public realized tariffs and customer concentration disclosure
    - Need bidbook and project-level cash-flow data to underwrite margins
  - - Adani Green
    - Large utility and hybrid projects; central auction participation
    - FY26 press coverage emphasizes capacity and BESS, not broad realized tariff set
    - Mass-scale solar, wind, hybrid and BESS
    - Public pricing data are selective rather than portfolio-wide
    - Scale is clear; margin durability is less transparent publicly
  - - ReNew
    - Utility plus C&I contracting
    - Public disclosure emphasizes capacity, manufacturing and C&I partners more than tariff tables
    - Utility, C&I, BESS, manufacturing
    - List of named partners stronger than explicit portfolio tariff detail
    - Suggests better commercial diversification than pure utility-only peers
  - - NTPC Green
    - Central procurement and PSU-linked projects
    - Examples include 1,000 MW UPPCL PPA at INR 2.56/kWh in sector tracking
    - Solar, wind and public-program execution
    - Group disclosures do not isolate economics for every asset
    - State-backed route can aid award flow even when unit economics are opaque
  - - JSW Energy (entrant benchmark)
    - 15–25 year PPAs, open access, group captive, FDRE and storage-linked offers
    - Illustrative PPAs in sector tracking at INR 3.65–4.98/kWh depending on structure
    - Storage, FDRE, green hydrogen and industrial integration
    - Not the closest direct comparable on current operating renewable scale
    - 'Shows where competitive packaging is moving: firmer, more integrated clean-power products'
  - - Azure Power
    - Fixed-tariff long-term PPAs, typically around 25 years
    - Term disclosed in filings; several project economics constrained by PPA delays or disputes
    - Solar PPAs with utilities and agencies
    - 967 MW pending PPAs; discontinued hybrid project; terminated/contested PPAs
    - Contract quality and counterparty execution are as important as bid wins
  notes: Pricing visibility is selective; unknown cells reflect sparse public project-level economics
    rather than missing analysis.
- id: TP004
  title: Moat durability / competitive risk register
  type: comparison
  layout: wide
  summary: Competitive-risk view of Avaada’s current moat claims against larger and better-disclosed peers.
  claimRefs:
  - CP021
  - CP022
  - CP031
  - CP032
  - CP035
  - CP037
  - CP038
  columns:
  - Moat claim
  - Why it matters
  - Primary threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Integrated platform breadth
    - Generation plus storage, hydrogen and manufacturing could widen margin pools
    - Peers with larger commissioned scale can copy adjacent categories faster than Avaada can commission
      them
    - High
    - Request operating-asset conversion by business line and project-level commissioning calendar
  - - Financing access
    - Brookfield, GPSC and REC-linked capital support large capex programs
    - If refinancing tightens or projects slip, capital intensity can become a disadvantage
    - High
    - Request debt maturity ladder, covenant headroom and project-finance pipeline by asset
  - - State and utility relationships
    - MoUs and auction wins can create privileged entry into large projects
    - PSU-backed NTPC and larger incumbents may still dominate tender-heavy segments
    - Medium
    - Request tender conversion rates, repeat-award data and counterpart mix
  - - Storage and hybrid positioning
    - Firm-power products should become more valuable as grid constraints rise
    - Greenko, Adani, ReNew and JSW are also deepening storage narratives
    - Medium
    - Request contracted storage revenue, utilization assumptions and BESS procurement economics
  - - Hydrogen / ammonia optionality
    - Could unlock industrial decarbonization upside beyond commodity electrons
    - Public offtake and delivered-cost evidence remain sparse across the sector
    - High
    - Request binding offtake, subsidy stack and delivered-cost model by site
  - - Execution credibility
    - Once awarded and financed, projects create real switching cost
    - Azure demonstrates how PPA and execution friction can destroy value despite awarded capacity
    - High
    - Request canceled/delayed-project history, PPA amendments and realized COD slippage data
  notes: Severity reflects competitive pressure on Avaada’s moat, not a quantified default probability.
