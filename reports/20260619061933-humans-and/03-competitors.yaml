company:
  name: humans&
chapter:
  number: 3
  title: Competitors
  summary: 'humans& appears to sit at the intersection of three competitive sets: frontier neo-labs chasing collaborative
    reasoning, incumbent model vendors already selling enterprise-ready tooling, and human-feedback or evaluation platforms
    that can absorb adjacent budget without a base-model bet. Its public wedge is conceptually interesting, but the reviewed
    evidence still shows a stealth lab with elite pedigree and capital rather than a commercially proven product, which means
    the sharpest current competition is for talent, compute, and mindshare more than for locked-in customers.'
sections:
- id: landscape-segmentation
  title: Landscape Segmentation
  body: 'humans& should not be compared only to one named startup. The real landscape breaks into at least four solution classes.
    First are frontier neo-labs such as Thinking Machines Lab and Safe Superintelligence, which overlap with humans& on elite-team
    pedigree, giant funding rounds, and a willingness to define a new model architecture before shipping a broadly deployed
    enterprise product. Second are incumbent model vendors such as Anthropic, OpenAI, and xAI, which already expose public
    product, pricing, transparency, and developer surfaces. Third are enabling vendors such as Scale AI, Labelbox, Braintrust,
    and Arize, which do not need to win the frontier-model race to capture budget because they sell evaluation, RLHF, observability,
    and human-feedback workflows today. Fourth is the status quo: internal build around public APIs and tools. That last bucket
    matters because humans& public materials emphasize a new collaboration-centered model, but buyers can already combine
    existing models, eval stacks, and workflow software into an acceptable substitute.'
