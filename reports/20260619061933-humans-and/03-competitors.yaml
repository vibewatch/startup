- id: switching-barriers-and-adverse-view
  title: Switching Barriers and Adverse View
  body: 'The adverse case should be stated plainly. humans& may be directionally right that collaboration, communication,
    and long-horizon coordination are under-served by today’s single-user chat products. But the reviewed evidence does not
    yet show that humans& owns the only path to that outcome. Incumbent model vendors already provide public reasoning and
    enterprise surfaces, while eval and observability vendors provide the surrounding workflow infrastructure. That makes
    internal build and multi-homing credible. If humans& eventually creates sticky switching costs, they are most likely to
    come from workflow memory, decision context, and embedded team behavior rather than from base-model exclusivity. That
    is still a hypothesis because there is no public customer or deployment proof in the reviewed corpus. On top of that,
    the market is crowded, capital-rich, and compute-constrained. Reuters framed the frontier-lab hiring market as a talent
    war, and SSI’s TPU relationship shows how compute access itself becomes a moat. Those dynamics raise the bar for any stealth
    lab: it must not only invent a differentiated product, but also defend it against richer incumbents and a modular substitute
    stack.'
